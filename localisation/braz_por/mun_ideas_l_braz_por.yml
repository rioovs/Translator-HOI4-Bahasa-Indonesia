#Dynamic Modifiers National Spritits
CZE_ceskoslovenska_armada_dynamic_modifier: "Československá Armáda"
CZE_ceskoslovenska_armada_dynamic_modifier_desc: "Armada ini dibangun dari abu Unit Ceko Austro-Hungaria dan Veteran Legiun Cekoslowakia. Warisan keduanya masih mempengaruhi cara Armada dijalankan."
CZE_ceskoslovenske_letectvo_dynamic_modifier: "Československé Letectvo"
CZE_ceskoslovenske_letectvo_dynamic_modifier_desc: "Pesawat mungkin tidak selalu siap, tapi pilot kita selalu siap. Dengan adanya kemungkinan ancaman udara dari semua sisi, kita harus menjadikan udara sebagai lautan kita. Setiap pilot harus menghitung seolah-olah ada tiga."
CZE_a_divided_nation_dynamic_modifier: "Bangsa yang Terpecah"
CZE_a_divided_nation_dynamic_modifier_desc: "Negara [CZE.GetAdjective] telah berdiri sendiri di Eropa Tengah sebagai negara pluralis yang melindungi semua orang di wilayahnya. Namun, Depresi Hebat telah mengubah hal itu. Kesulitan ekonomi telah menyebabkan meningkatnya kebencian terhadap pemerintah dari berbagai gerakan di dalam negeri. Kebencian ini kini sangat memecah belah bangsa."
CZE_skoda_works_dynamic_modifier: "Skoda Bekerja"
CZE_skoda_works_dynamic_modifier_desc: "Perusahaan Škoda berisi produksi, konstruksi, dan investasi di semua sektor Industri Berat kami. Jangkauannya tidak mengenal batas wilayah kita."
CZE_ceskoslovenske_alecne_lodstvo_dynamic_modifier: "Československé válečné loďstvo"
#Dynamic State Modifiers
CZE_sudetenland_german_state_modifier: "Separatisme Sudetenland"
CZE_sudetenland_german_state_modifier_desc: "Kesulitan ekonomi baru-baru ini menimpa industri di Sudetenland. Hal ini menyebabkan masyarakat yang tinggal di wilayah tersebut menyalahkan pemerintah [ROOT.getname] atas kemalangan yang mereka alami baru-baru ini."
CZE_tesinko_polish_state_modifier: "Separatisme Polandia"
CZE_czech_state_modifier: "Kekurangan Pekerja Terampil Ceko"
CZE_czech_state_modifier_desc: "Perkembangan ekonomi yang pesat pada abad ke-20 telah membebani sebagian besar penduduk Ceko yang agraris. Kemampuan untuk mengisi posisi dengan tenaga kerja terampil dan berkualitas dengan pekerja Ceko sulit dilakukan. Upaya harus dilakukan untuk membantu mempersiapkan warga muda Ceko menghadapi perubahan kebutuhan ekonomi modern."
