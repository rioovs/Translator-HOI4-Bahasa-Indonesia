CZE_sudetenland_paramilitaries_modifier: "Aktivitas Paramiliter Sudetenland"
CZE_sudetenland_paramilitaries_modifier_desc: "Partisan dan paramiliter Sudetenland saat ini melemahkan kekuatan kami di wilayah ini. Mereka secara aktif menyerang pasukan kita dan berkolaborasi dengan musuh-musuh kita."
