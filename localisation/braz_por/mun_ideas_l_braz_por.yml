#National Spirits
CZE_taticek_of_czechoslovakia: "Tatíček Masaryk"
CZE_taticek_of_czechoslovakia_desc: "Tomáš Masaryk, sering disebut 'Tatíček Masaryk', yang berarti 'ayah' atau 'bapak' (bangsa), telah menjadi landasan bangsa Cekoslowakia sejak didirikan. Ketika koalisi dianggap mustahil untuk dibangun dan kebuntuan politik terlalu besar untuk diatasi, Masaryk, dari waktu ke waktu, mampu melakukan keajaiban politik untuk membantu memperkuat dan mengembangkan Cekoslowakia. Bahkan di masa pensiunnya, sentimen dan sarannya kepada para pemimpin politik dianggap lebih sebagai perintah daripada nasihat."
CZE_industrialists_veto: "Veto Industrialis"
CZE_industrialists_veto_desc: "Kaum industrialis mempunyai pengaruh besar terhadap politik negara, karena mereka memimpin banyak konglomerat terbesar [CZE.GetNameDef]. Kekhawatiran mereka tidak dapat diabaikan dalam hal kebijakan ekonomi, dan mobilisasi ekonomi adalah salah satu tindakan yang paling mereka tolak."
CZE_agrarian_politics_1: "Politik Agraria"
CZE_agrarian_politics_1_desc: "Meskipun negara kita bersifat industri, petani dan petani pedesaan mempunyai pengaruh politik yang besar di banyak partai politik. Sentimen mereka seringkali mempengaruhi keputusan kebijakan ekonomi, dan selalu menjadi hambatan politik dalam mencapai kemajuan industri lebih lanjut."
CZE_directorate_of_fortification_works_no_gd_idea: "Direktorat Pekerjaan Fortifikasi"
CZE_directorate_of_fortification_works_no_gd_idea_desc: "$CZE_directorate_of_fortification_works_no_gd_idea$, lebih dikenal sebagai ROP. Merupakan entitas pengelola yang bertugas mengawasi upaya fortifikasi di negara tersebut."
CZE_czech_corporatism: "Korporatisme Ceko"
CZE_broken_shield: "Perisai Rusak"
CZE_redirected_fortification_council_funds: "Dana Dewan Fortifikasi yang Diarahkan"
CZE_army_readiness_1: "Tentara yang tidak siap"
CZE_army_readiness_1_desc: "Kesiapan tentara tidak hanya bergantung pada jumlah personel dan perlengkapan di lapangan. Keyakinan terhadap persiapan Anda, dan dukungan dari para pemimpin politik dan industri di negara ini penting ketika menghadapi ancaman. Memiliki sarana untuk berjuang adalah satu hal, namun kemampuan untuk melakukannya secara efektif adalah hal lain."
CZE_army_readiness_3: "Tentara yang Disiapkan"
CZE_army_readiness_3_desc: "Kesiapan tentara tidak hanya bergantung pada jumlah personel dan perlengkapan di lapangan. Keyakinan terhadap persiapan Anda, dan dukungan dari para pemimpin politik dan industri di negara ini penting ketika menghadapi ancaman. Memiliki sarana untuk berjuang adalah satu hal, namun kemampuan untuk melakukannya secara efektif adalah hal lain."
CZE_ready_for_anything_idea: "Siap untuk Apa Pun"
CZE_sudeten_german_quandary: "Kebingungan Sudetenland"
CZE_sudeten_german_quandary_desc: "Meskipun mayoritas masyarakat yang tinggal di Sudetenland menginginkan otonomi yang lebih besar di bawah pemerintahan yang ada, banyak partai politik di Sudeten dan pendukungnya dapat dengan cepat menjadi pendukung kelima jika negara Jerman berusaha mencaplok bagian mana pun dari wilayah tersebut."
CZE_sudeten_german_quandary_modifier_tt: "§YEfek Pasif§!:\nJika §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§!, atau [BAY.GetFlag]§YNegara Jerman§! lainnya yang berbatasan dengan kita membenarkan atau mendapatkan §RTujuan Perang§! dari kami saat §Y[69.GetName]§!, §Y[972.GetName]§! atau §Y[74.GetName]§! dikendalikan oleh kami:\n- (§YSemua Negara Bagian Sudetenland yang Dikendalikan§!):\nTambahkan §Y$CZE_sudetenland_paramilitaries_modifier$§! yang memberikan:\n$MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+10%§!\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-10.0%§!\n$modifier_state_repair_speed_bunker_factor$: §R-10.00%§!\n\n- §YEffect§! ini hanya dapat terjadi satu kali"
CZE_sudeten_challenge: "Tantangan Sudeten"
CZE_sudeten_challenge_desc: "Aktivitas Paramiliter Sudetenland baru-baru ini di Sudetenland telah membuat banyak orang di komunitas internasional percaya bahwa tindakan agresif yang dilakukan terhadap kami saat ini dapat dibenarkan! Perlu waktu untuk meyakinkan dunia sebaliknya."
CZE_sudeten_facde: "Fasad Sudeten"
CZE_sudeten_facde_desc: "Dengan tidak mendukung Paramiliter setempat, pembenaran kami atas tindakan kami terhadap [CZE.getname] kini dipandang sebagai kedok di seluruh dunia."
