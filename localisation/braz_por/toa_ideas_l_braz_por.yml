 PAR_febrerista_land_reform: "Reformasi Tanah Febrerista"
 PAR_guarani_in_the_army: "Guarani di Angkatan Darat"
 PAR_guarani_in_the_army_desc: "Selama Perang Chaco, tentara Paraguay mengadopsi bahasa Guaraní sebagai bahasa yang digunakan antara tentara dan komando tinggi, beralih dari bahasa Spanyol, agar musuh mereka di Bolivia tidak dapat dengan mudah menguraikannya, dan ini terbukti sangat efektif."
 BOL_era_of_national_regression: "Era Regresi Nasional"
 BOL_era_of_national_regression_desc: "Beberapa dekade terakhir merupakan masa yang sulit bagi Bolivia. Pertama, Perang Pasifik pada tahun 1879 hingga 1883, kemudian Perang Acre pada tahun 1899 hingga 1903, dan terakhir kekalahan terakhir bangsa ini, Perang Chaco pada tahun 1932 hingga 1935."
 BOL_era_of_national_regression_tt: "Akan dihapus jika Bolivia Raya dipulihkan:\nMemiliki kendali penuh atas §YAcre§!, §YAntofagasta§!, §YChaco Boreal§!."
