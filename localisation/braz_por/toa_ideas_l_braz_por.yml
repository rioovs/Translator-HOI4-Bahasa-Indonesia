 CHL_chilean_economy_dynamic_modifier: "Perekonomian Chili"
 CHL_chilean_economy_dynamic_modifier_desc: "Karena ketergantungan yang besar pada ekspor tembaga dan nitrat, perekonomian Chili sangat terpukul setelah kehancuran besar tersebut, ketika mitra dagang terbesarnya, yaitu AS, berhenti mengimpor dari Chili, dan negara tersebut terpaksa menjual sebidang tanah agar perekonomian tidak runtuh sepenuhnya. Berbagai upaya telah dilakukan untuk mengatasi situasi ini, namun masih banyak yang perlu dilakukan. Perekonomian Chili suatu hari nanti akan menjadi hebat lagi!"
