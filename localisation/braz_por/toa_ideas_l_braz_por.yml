 BRA_radio_nacional_idea: "Radio Nasional"
 BRA_radio_nacional_idea_desc: "Dengan berdirinya stasiun radio nasional, pemerintah kini mempunyai cara berkomunikasi langsung dengan masyarakat. Kita dapat menggunakan hal ini untuk memastikan mereka mendapatkan informasi yang paling obyektif dan terkini, atau sekadar informasi yang kita ingin mereka ketahui."
 BRA_anaue_idea: "Anauê"
 BRA_anaue_idea_desc: "Sambutan pribumi Anauê telah menjalani kehidupan baru sebagai seruan gerakan integralis. Dinyanyikan di jalan-jalan oleh anggota partai berseragam hijau, hal ini menimbulkan kebanggaan bagi mereka yang memiliki keyakinan nasionalis dan kegelisahan terhadap oposisi mereka."
 BRA_ethical_internationalism_idea: "Internasionalisme Etis"
 BRA_ethical_internationalism_idea_desc: "$BRA_ethical_internationalism$"
 BRA_secure_our_borders_idea: "Amankan Perbatasan Kita"
 BRA_secure_our_borders_idea_desc: "$BRA_secure_our_borders$"
 BRA_army_reward: "Menghargai Kesetiaan Tentara"
 BRA_navy_reward: "Menghargai Loyalitas Angkatan Laut"
 BRA_psad_idea: "Departemen Administrasi Pelayanan Publik"
 BRA_psad_idea_desc: "DASP didirikan untuk membantu pemerintah dalam mempertahankan rezim dan perekonomian yang berfungsi dengan baik dengan mengkonsolidasikan dan mengatur ulang berbagai departemen pendahulu menjadi satu, kohesif, dan modern."
 BRA_commonwealth_idea: "Negara Anggota Persemakmuran Lusophone"
 BRA_commonwealth_idea_desc: "Negara ini adalah anggota Persemakmuran Lusophone, sebuah komunitas dengan ikatan sejarah yang kuat dimana bahasa Portugis sering menjadi bahasa yang paling banyak digunakan. Negara-negara anggota telah sepakat untuk bekerja sama satu sama lain dalam hal-hal yang menjadi perhatian bersama, seperti teknologi dan kebijakan luar negeri."
 BRA_proletarian_equality: "Kesetaraan Proletar"
 BRA_proletarian_equality_desc: "$BRA_equality_for_women_desc$"
 BRA_promoting_communism: "Komunisme Sedang Bangkit"
 BRA_promoting_communism_desc: "Brasil berusaha mempengaruhi politik kami dengan mendukung berbagai kelompok komunis."
 BRA_sway_the_neighbors_lar: "Menggoyangkan Kampanye Intelijen Tetangga"
 BRA_army_dummy_idea: "$SMB_army_BRA$"
 BRA_estado_novo_dummy_idea: "$BRA_estado_novo_modifier$"
 BRA_estado_novo_dummy_idea_desc: "$BRA_estado_novo_desc$"
 BRA_national_defence_fund_idea: "Peningkatan Belanja Pertahanan"
 BRA_national_defence_fund_idea_desc: "$BRA_defense_spending_desc$"
 JUNO_natal_base_sharing: "Berbagi Pangkalan Udara Natal"
 ToA_aid_against_communists: "Brigade Anti-Komunis"
 ToA_aid_against_communists_desc: "Pemerintah Amerika menutup mata terhadap para sukarelawan yang bersenjata lengkap, lengkap dan terlatih yang berangkat ke luar negeri untuk membantu perjuangan global melawan komunisme."
 ARG_resource_extration_focus: "Fokus pada Ekstraksi Sumber Daya"
 ARG_ferrocarriles_argentinos: "Ferrocarriles Argentina"
 ARG_construction_guilds_idea: "Persatuan Konstruksi Argentina"
 ARG_roca_runciman_new_partner_idea: "Perjanjian La Plata"
 ARG_argentine_beef_trade_idea: "Perdagangan Daging Sapi Argentina"
 BRA_defense_of_the_fatherland_idea: "Menuju Dominasi Amerika"
 BRA_defense_of_the_fatherland_idea_desc: "$BRA_domination_of_the_americas$"
 BRA_neglected_state_dynamic_modifier: "Negara yang Terabaikan"
 BRA_neglected_state_dynamic_modifier_desc: "Negara bagian ini sangat kekurangan investasi oleh pemerintahan-pemerintahan berturut-turut, yang menyebabkan kurangnya infrastruktur, pengangguran dan kebencian terhadap pemerintah pusat."
 BRA_growing_state_dynamic_modifier: "Negara Berkembang"
 BRA_growing_state_dynamic_modifier_desc: "Melalui investasi besar-besaran dan pembangunan yang dilakukan oleh pemerintah pusat, negara bagian ini kini memiliki pertumbuhan ekonomi yang berada pada jalur industrialisasi penuh di tahun-tahun mendatang."
 BRA_modify_economy_intro: "Ubah §Y$BRA_undiversified_economy_modifier$§! dengan:"
 BRA_rail_investment: "Investasi Kereta Api"
 BRA_rail_investment_desc: "$BRA_invest_in_railways_desc$"
 BRA_road_investment: "Investasi Jalan"
 BRA_road_investment_desc: "$BRA_invest_in_road_infrastructure_desc$"
 BRA_port_investment: "Investasi Pelabuhan"
 BRA_port_investment_desc: "$BRA_invest_in_ports_desc$"
 BRA_new_capital_modifier: "Pembangunan Ibu Kota Baru"
 BRA_new_capital_modifier_desc: "Kami sedang dalam proses membangun ibu kota baru di jantung negara untuk mengurangi perasaan terisolasi di negara-negara pedesaan."
 BRA_separatism_idea: "Sentimen Separatis"
 BRA_separatism_idea_desc: "Ada banyak orang di negara ini yang mempunyai keluhan terhadap pemerintah pusat Brasil atau tidak suka harus mendukung negara-negara yang kurang makmur. Di masa lalu, sentimen-sentimen ini telah menyebabkan gerakan separatis yang berumur pendek yang memisahkan negara mereka dari negaranya. Jika kita gagal untuk segera menstabilkan situasi politik, gerakan-gerakan seperti itu dapat menyebabkan perpecahan di Brasil."
 BRA_propaganda_idea: "Departemen Propaganda"
 BRA_propaganda_idea_desc: "Di masa sulit seperti ini, kita harus memastikan bahwa masyarakat hanya menerima informasi yang mereka butuhkan untuk melanjutkan pekerjaan mereka dan mendukung pemerintah."
 BRA_cangaceiro_state: "Cangaço Aktif di Negara Bagian"
 BRA_cangaceiro_state_desc: "Kekosongan kekuasaan pernah terjadi di Timur Laut Brasil yang menyebabkan munculnya bandit yang dikenal sebagai Cangaço. Bandit-bandit ini telah menjangkiti wilayah tersebut selama beberapa dekade dan sering kali berhasil dilakukan oleh penduduk setempat yang bersimpati. Kita harus melakukan sesuatu terhadap penjarahan dan pembunuhan yang terus terjadi sebelum kita benar-benar kehilangan kendali atas wilayah tersebut."
 BRA_disrupt_bolivar_LaR: "Pendanaan Kontra Intelijen"
 BRA_disrupt_bolivar_LaR_desc: "Badan Intelijen asing sudah terlalu lama bertindak tanpa mendapat hukuman. Dengan pendanaan baru kami, kami akan memastikan tidak ada yang terjadi tanpa sepengetahuan kami sebelumnya."
 BRA_disrupted_bolivar: "Operasi Bolivar Terganggu"
 BRA_disrupt_bolivar_no_lar: "Operasi Bolivar Terganggu"
 BRA_good_neighbor_policy: "Kebijakan Tetangga yang Baik"
 BRA_good_neighbor_policy_desc: "$BRA_cooperation_in_the_americas_desc$"
 BRA_accepted_washington_accords: "Mengadopsi Kesepakatan Washington"
 BRA_rejected_washington_accords: "Menolak Perjanjian Washington"
 BRA_washington_accords_idea: "Kesepakatan Washington"
 BRA_washington_accords_idea_desc: "$BRA_washington_accords$"
 BRA_departamento_de_political_e_social_no_lar: "Departemen Ordem Politik dan Sosial"
 BRA_departamento_de_political_e_social_no_lar_desc: "$BRA_departamento_de_political_e_social_no_desc$"
 BRA_supporting_operation_bolivar: "Mendukung Operasi Bolivar"
 BRA_aid_operation_bolivar: "Operasi Bolivar"
 BRA_aid_operation_bolivar_desc: "$BRA_expand_operation_bolivar_desc$"
 BRA_international_crisis: "Krisis Internasional"
 BRA_international_crisis_desc: "$BRA_the_international_crisis_desc$"
 BRA_unwilling_subjects: "Subyek yang Tidak Mau"
 BRA_unwilling_subjects_desc: "Dengan semakin banyaknya monarki yang mengambil alih sistem politik negara, masyarakat menjadi tidak nyaman dan frustrasi karena kembali tunduk pada otokrat."
 BRA_federal_republic: "Merangkul Federalisme"
 BRA_federal_republic_desc: "$BRA_greater_federalism_desc$"
 BRA_presidential_republic: "Republik Kepresidenan"
 BRA_presidential_republic_desc: "Negara ini membutuhkan kepemimpinan yang kuat dan tegas yang dapat menyatukan masyarakat dan mempertahankan perbatasan kita. Untuk melakukan hal ini, kami memusatkan otoritas politik pada Presiden Republik, meskipun kami harus memastikan adanya checks and balances yang kuat untuk mencegah upaya Vargas lain untuk merebut kekuasaan."
 BRA_tax_haven: "Surga Pajak yang Sedang Berkembang"
 BRA_tax_haven_desc: "Rendahnya pajak bagi korporasi dan sejumlah celah telah menyebabkan peningkatan jumlah perusahaan multinasional yang pindah ke Brasil. Lebih baik kita mendapat pemasukan pajak dari mereka daripada tidak sama sekali."
 BRA_nationalized_banks: "Bank yang Nasionalisasi"
 BRA_nationalized_banks_desc: "Dengan menasionalisasi bank, kita dapat meningkatkan kendali atas pasokan uang dalam perekonomian dan mengalihkannya dari kantong pemegang saham ke tangan pekerja."
 #BRA_court_the_military_ideaa: "Courting the Military"
 #BRA_court_the_military_ideaa_desc: "We can not maintain our grip on power without the established influence and resources of the military. At least for the time being, we must try to keep them on our side."
 BRA_collaboration_with_the_church: "Kolaborasi dengan Gereja"
 BRA_collaboration_with_the_church_desc: "Gereja sangat penting bagi banyak orang Brasil. Dengan berkonsultasi dengan mereka mengenai kebijakan, kita bisa mendapatkan dukungan massal dari mereka terhadap pemerintahan kita."
 BRA_atheist_state: "Negara Atheis"
 BRA_atheist_state_desc: "Sebagai negara yang fokus pada kemajuan ilmu pengetahuan, kita tidak bisa menghabiskan waktu kita untuk merayu para ulama. Pemerintahan suatu negara dan agama masyarakatnya tidak dimaksudkan untuk bercampur, dan kami bermaksud untuk menjaganya tetap seperti itu."
 BRA_collectivized_agriculture: "Pertanian Kolektivisasi"
 BRA_collectivized_agriculture_desc: "Dengan melakukan kolektivisasi industri pertanian, kami telah meningkatkan efisiensinya dan memperkuat ideologi komunis di antara masyarakat kami."
 BRA_article_138: "Pasal 138"
 BRA_article_138_desc: "$BRA_implement_article_138_desc$"
 BRA_court_the_military_idea: "Merayu Militer"
 BRA_court_the_military_idea_desc: "Kita tidak dapat mempertahankan kekuasaan kita tanpa pengaruh dan sumber daya militer yang kuat. Setidaknya untuk saat ini, kita harus berusaha menjaga mereka tetap berada di pihak kita."
 BRA_king_vassouras: "Dom Pedro Henrique"
 BRA_king_vassouras_desc: ""
 BRA_king_petropolis: "Dom Pedro de Alcantara"
 BRA_king_petropolis_desc: ""
 BRA_us_of_brazil: "Pertahanan Kebebasan"
 BRA_us_of_brazil_desc: "Cita-cita kebebasan dan demokrasi adalah fondasi yang menjadi dasar pembangunan republik kita. Kami akan melakukan apa pun untuk mempertahankan nilai-nilai tersebut di dalam dan luar negeri jika diperlukan."
 BRA_radicalized_proletariat: "Proletariat yang Radikalisasi"
 BRA_radicalized_proletariat_desc: "Ide-ide komunis telah mengakar di kalangan kelas pekerja [BRA.GetNameDef]. Kita sedang melewati garis tipis antara menyenangkan mereka dan tidak mengecewakan militer."
 BRA_aid_brazilian_communists: "Membantu Komunis Brasil"
 BRA_us_of_south_america: "Pembela Selatan"
 BRA_us_of_south_america_desc: "Perbatasan kita telah membengkak hingga mencakup sebagian besar benua. Oleh karena itu, kami akan menjadikannya sebagai tugas suci kami untuk membela hak-hak semua orang yang menyebut Amerika Selatan sebagai rumah mereka."
 BRA_stability_and_unity: "Ketertiban dan Kemajuan"
 BRA_stability_and_unity_desc: "Melalui manuver politik yang hati-hati, kita berhasil mewujudkan republik yang lebih kuat dan semakin bersatu. Atas dasar ini kami akan terus melindungi warga negara besar kami."
 BRA_romanticize_the_old_empire_idea: "Sentimen Kekaisaran"
 BRA_romanticize_the_old_empire_idea_desc: "Tidak ada kekurangan orang yang mempunyai keluhan terhadap pemerintah Brasil. Dengan menghidupkan kembali sentimen dan nostalgia kekaisaran, kita akan menyatukan faksi-faksi yang berbeda ini menjadi satu kekuatan yang kohesif."
 BRA_undermine_democracy_idea: "Melemahkan Demokrasi"
 BRA_undermine_democracy_idea_desc: "$BRA_undermine_democracy_desc$"
 BRA_modify_neglected_state: "Ubah §Y$BRA_neglected_state_dynamic_modifier$§!/§Y$BRA_growing_state_dynamic_modifier$§! dengan:"
 BRA_liberated_by_communist_brazil: "Dibebaskan oleh [BRA.GetNameDefCap]"
 BRA_liberated_by_communist_brazil_desc: "Negara kita akhirnya memperoleh kemerdekaan yang sah dari penjajah. Dengan bantuan [BRA.GetNameDef] kita sekali lagi menjadi negara bebas. Dengan tindakan mereka yang jelas-jelas membantu kami, ide-ide komunis yang mereka khotbahkan mulai mengakar di dalam masyarakat kami."
 BRA_expanding_the_revolution: "Memperluas Revolusi"
 BRA_expanding_the_revolution_desc: "Revolusi telah mencapai [BRA.GetNameDef] dan kita sekarang harus melihat melampaui batas negara kita sendiri. Sudah saatnya kita menyebarkan revolusi demi kawan-kawan kita di luar [BRA.GetNameDef]."
 BRA_banco_do_brasil_idea: "Banco do Brasil"
 BRA_banco_do_brasil_idea_desc: "$BRA_banco_do_brasil_desc$"
 BRA_cprm_idea: "Radio Marconi"
 BRA_ef_central_do_brasil_idea: "EF Central di Brasil"
 BRA_lloyd_brasileiro_idea: "Lloyd Brasileiro"
 BRA_departamento_nacional_do_cafe_idea: "Departamento Nacional do Café"
 BRA_brown_water_navy_idea: "Angkatan Laut Air Coklat yang Diperluas"
 BRA_brown_water_navy_idea_desc: "$SMB_brown_water_navy_desc$"
 BRA_brown_water_navy_idea_bonus_tt: "Semua infanteri:\n§Y-Sungai:§!\nPergerakan: §G+10%§!\nSerangan: §G+10%§!\nPertahanan: §G+5%§!"
 ARG_political_corruption_modifier: "Korupsi Politik"
 ARG_political_corruption_modifier_desc: "Selama bertahun-tahun, [ARG.GetNameDef] telah dilanda korupsi besar-besaran di pemerintahannya. Meskipun ada anggapan bahwa dengan membiarkan Concordancia terbentuk, hal ini mungkin akan berkurang, namun kecurangan dan intimidasi pemilih masih terus terjadi."
 ARG_modify_corruption_ns_intro: "Ubah §Y$ARG_political_corruption_modifier$§! dengan"
 ARG_international_loan_modifier: "Pinjaman Internasional"
 ARG_international_loan_modifier_desc: "Bukan hal yang aneh bagi negara-negara untuk menjangkau negara-negara lain di seluruh dunia untuk mendapatkan bantuan keuangan pada saat krisis. Mengingat kondisi perekonomian [ROOT.GetNameDef] saat ini, sangat masuk akal untuk menerima bantuan dari negara-negara besar yang terlibat dalam konflik ini."
 ARG_modify_international_loan_intro: "Ubah §Y$ARG_international_loan_modifier$§! dengan"
 ARG_corruption_crackdown_modifier: "$ARG_crack_down_on_corruption$"
 ARG_corruption_crackdown_modifier_desc: "Korupsi yang melanda pemerintahan negara kita benar-benar tidak dapat diterima. Berkat kebijakan Roberto María Ortiz, kami akhirnya dapat mengakhiri aktivitas penipuan terang-terangan yang dilakukan oleh para politisi kami."
 ARG_anti_corruption_modifier: "Kebijakan Anti Korupsi"
 ARG_anti_corruption_modifier_desc: "Korupsi yang melanda pemerintahan negara kita benar-benar tidak dapat diterima. Berkat kebijakan Marcelo T. de Alvear, kami akhirnya dapat mengakhiri aktivitas penipuan terang-terangan yang dilakukan oleh para politisi kami."
 ARG_infamous_decade_idea: "Dekade Terkenal"
 ARG_infamous_decade_idea_desc: "Dekade Terkenal adalah periode dalam sejarah Argentina yang dimulai dengan kudeta tahun 1930 terhadap Presiden Hipólito Yrigoyen. Itu adalah masa yang ditandai oleh dua hal. Di satu sisi, eksodus pedesaan yang signifikan setelah Depresi Hebat dan di sisi lain, kecurangan pemilu yang terang-terangan untuk melanggengkan kekuasaan pemerintah konservatif."
 ARG_infamous_decade_2_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_2_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_3_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_3_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_4_idea: "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_4_idea_desc: "$ARG_infamous_decade_idea_desc$"
 ARG_public_works_investment_idea: "Investasi Pekerjaan Umum"
 ARG_public_works_investment_idea_desc: "Penting bagi pemerintah [ARG.GetAdjective] untuk membiayai dan mengadakan proyek pekerjaan umum untuk keperluan rekreasi, lapangan kerja, kesehatan dan keselamatan. Hal ini akan meningkatkan kualitas hidup komunitas [ARG.GetAdjective] secara luas."
 ARG_towards_a_greater_argentina_idea: "$ARG_towards_a_greater_argentina$"
 ARG_towards_a_greater_argentina_idea_desc: "[ARG.GetNameDefCap] sangat menderita pada awal abad ke-20, seiring dengan terjadinya Depresi Besar dan dimulainya Dekade yang Terkenal. Meskipun pemilu terus menerus diwarnai kecurangan, upaya kudeta, dan pejabat pemerintah yang korup, kita mampu menjadi negara yang stabil dan efisien."
 ARG_economic_reactivation_idea: "Reaktivasi Ekonomi"
 ARG_economic_reactivation_idea_desc: "Undang-undang Reaktivasi Ekonomi adalah undang-undang yang dibentuk untuk memastikan bahwa lebih banyak uang pemerintah disalurkan untuk mendanai pembangunan sektor ekonomi dan industri."
 ARG_civilian_economy_boost_idea: "Ekonomi Sipil Maju"
 ARG_civilian_economy_boost_idea_desc: "Melalui perencanaan yang matang dan donasi yang ditempatkan dengan baik, kami telah mampu mengembangkan perekonomian sipil kami sepenuhnya. Meningkatnya fasilitas yang tersedia bagi warga negara kita berarti bahwa indeks kebahagiaan nasional akan meningkat secara perlahan seiring berjalannya waktu."
 ARG_invest_in_roads_idea: "Berinvestasi di Jalan"
 ARG_invest_in_roads_idea_desc: "Jalan raya negara ini sangat penting bagi kemampuan ekonomi, industri dan militer [ARG.GetNameDef]. Investasi kami dalam pembangunan dan pemeliharaannya akan bermanfaat bagi kami di tahun-tahun mendatang."
 ARG_invest_in_railways_idea: "Berinvestasi di Kereta Api"
 ARG_invest_in_railways_idea_desc: "Di era modern, setiap industri bergantung pada tulang punggung layanan kereta api nasional yang selalu mendukung. Seiring dengan perluasan jalur kereta api kami di seluruh negeri, kami meletakkan dasar bagi kelancaran perpindahan barang dari masyarakat pedesaan ke kota."
 ARG_roca_runciman_treaty_idea: "Perjanjian Roca-Runciman"
 ARG_roca_runciman_treaty_idea_desc: "Perjanjian Roca-Runciman adalah pakta perdagangan penting antara [ARG.GetNameDef] dan [ENG.GetNameDef] yang ditandatangani pada Mei 1933 yang menjamin [ARG.GetNameDef] dengan bagian tetap di pasar daging [ENG.GetAdjective]. Sebagai gantinya, [ARG.GetNameDef] menyetujui pembatasan perdagangan dan pertukaran mata uang, menjaga kepentingan komersial [ENG.GetNameDef] di negara tersebut."
 ARG_eden_malbran_treaty_idea: "Perjanjian Eden-Malbrán"
 ARG_eden_malbran_treaty_idea_desc: "Sebagai tanggapan terhadap pembatasan ketat yang diberlakukan dalam Perjanjian Roca-Runciman, kesepakatan baru telah dinegosiasikan dengan nama perjanjian Eden-Malbrán. Hal ini memungkinkan [ENG.GetNameDef] untuk mendapatkan konsesi tambahan sekaligus mengurangi biaya tarif pengangkutan gandum."
 ARG_raf_cooperation_idea: "Kerjasama RAF"
 ARG_raf_cooperation_idea_desc: "Ketika konflik di seluruh dunia terus berlanjut, kita harus melakukan yang terbaik untuk mendukung sekutu kita dengan apa pun yang kita bisa. Kerjasama yang lebih erat dengan Royal Air Force [ENG.GetNameDef] pasti akan membawa pilot kita ke standar yang lebih modern."
 ARG_argentine_beef_idea: "Daging Sapi Argentina"
 ARG_argentine_beef_idea_desc: "Sejak ternak pertama kali dibawa ke [ARG.GetNameDef] pada tahun 1536 oleh Penakluk Spanyol, daging sapi telah menjadi makanan pokok dalam masakan tradisional Argentina. Oleh karena itu, daging sapi kita dikenal di seluruh dunia sehingga permintaan ekspornya besar."
 ARG_argentine_metropole_idea: "Metropole Argentina"
 ARG_argentine_metropole_idea_desc: "Sampai saat ini, negara kita berkembang dengan mengandalkan komunitas pertanian dan pertambangan di pedesaan. Namun, seiring dengan perkembangan kita di abad ke-20, zaman telah berubah dan gagasan tentang kehidupan [ARG.GetAdjective] yang ideal juga telah berkembang. Banyak orang berbondong-bondong datang ke kota-kota kita yang kini berkembang dan berkembang dengan harapan dapat berakar dan beradaptasi dengan gaya hidup metropolitan."
 ARG_our_own_path_idea: "$ARG_our_own_path$"
 ARG_our_own_path_idea_desc: "Terlepas dari segala kesulitan yang kita alami untuk sampai ke sini, [ARG.GetNameDef] mampu berdiri sendiri, tanpa bertekuk lutut pada negara, faksi, dan konglomerat lain. Kita memilih jalan kita sendiri di masa yang penuh gejolak ini."
 ARG_british_cooperation_idea: "$ARG_british_cooperation$"
 ARG_british_cooperation_idea_desc: "[ENG.GetNameDefCap] telah menjadi salah satu mitra dagang terlama kami. Ketika kita terus menjunjung tinggi banyak perjanjian dan perjanjian, ideologi kita mungkin akan berubah untuk menyesuaikan dengan ideologi mereka."
 ARG_subdue_dissension_idea: "Pertikaian yang Tertunduk"
 ARG_subdue_dissension_idea_desc: "Pertikaian militer yang sedang berlangsung akhirnya dapat dipadamkan. Hal ini harus menjadi pelajaran bagi kita di masa depan untuk mewaspadai kerusuhan lebih lanjut di berbagai lembaga pemerintahan kita."
 ARG_improved_cooperation_idea: "Peningkatan Kerja Sama"
 ARG_improved_cooperation_idea_desc: "[ARG.GetNameDefCap] dan [ENG.GetNameDef] selaras dalam kepentingan mereka."
 ARG_refused_embargo_idea: "Menolak Permintaan Embargo"
 ARG_refused_embargo_idea_desc: "[ARG.GetNameDefCap] telah menolak permintaan kami untuk mengembargo Poros."
 ARG_maintain_neutrality_idea: "Didedikasikan untuk Diri Kita Sendiri"
 ARG_maintain_neutrality_idea_desc: "Kami telah menunjukkan bahwa kami tidak tertarik pada konflik yang lebih besar yang terjadi di seluruh dunia. Kita harus mengkhawatirkan diri kita sendiri terlebih dahulu. Biarlah ini menjadi pernyataan kepada semua bahwa [ARG.GetNameDef] akan fokus pada tujuannya sendiri."
 ARG_american_allyship_idea: "Hubungan Dekat dengan Washington"
 ARG_american_allyship_idea_desc: "Dalam semangat Kerjasama Amerika, kami telah menjalin hubungan politik yang lebih erat dengan [USA.GetNameDef]. Saat kita berdiri bersama berdasarkan kata-kata yang bermakna dari Doktrin Monroe, tidak ada kekuatan apa pun di Eropa yang dapat menghalangi front persatuan kita."
 ARG_envoy_to_london_idea: "Hubungan Dekat dengan London"
 ARG_envoy_to_london_idea_desc: "Selama kita terus saling mendukung, [ENG.GetNameDev] akan punya teman di [ARG.GetNameDef]. Penting bagi kedua negara untuk tetap terhubung secara politik dan memastikan bahwa tujuan kita tetap selaras."
 ARG_counter_interlligence_program_idea: "Program Kontra Intelijen Argentina"
 ARG_counter_interlligence_program_idea_desc: "Spionase adalah salah satu dari banyak bidang yang harus kita hadapi dalam konflik global ini, sehingga kemampuan kita untuk menjalankan program kontra intelijen secara efisien sangatlah penting agar kita bisa selamat dari perang ini. Kami telah mengambil sikap untuk fokus pada kebijakan defensif dibandingkan taktik dalih yang bersifat ofensif."
 ARG_disrupt_bolivar_lar: "Bekerja Melawan Operasi Bolivar"
 ARG_disrupt_bolivar_lar_desc: "Operasi Bolivar telah menjadi duri bagi kita selama bertahun-tahun dan sekarang kita harus mengambil sikap menentang tindakan spionase permusuhan yang keji ini."
 ARG_cut_ties_with_britain_idea: "Putuskan Hubungan Dengan Inggris"
 ARG_cut_ties_with_britain_idea_desc: "[ARG.GetNameDefCap] telah memutuskan hubungan dengan kami."
 ARG_disrupt_bolivar_no_lar: "Operasi Bolivar Terganggu"
 ARG_disrupt_bolivar_no_lar_desc: "$ARG_disrupt_bolivar_lar_desc$"
 ARG_red_scare_idea: "Dampak Ketakutan Merah"
 ARG_red_scare_idea_desc: "Ketegangan mengenai ideologi telah meluap di antara kedua negara."
 ARG_anti_soviet_idea: "Sentimen Anti-Soviet"
 ARG_anti_soviet_idea_desc: "Ancaman komunisme dan bahaya yang ditimbulkannya terhadap negara kita terlalu penting untuk diabaikan. [SOV.GetNameDefCap] terus membuktikan diri sebagai kekuatan yang mampu menghancurkan cara hidup kita selama ini. Orang-orang takut akan ancaman merah, dan memang seharusnya demikian!"
 ARG_buying_the_islands_idea: "Membeli Kepulauan Atlantik Selatan"
 ARG_buying_the_islands_idea_desc: "Ternyata membeli dua pulau utuh itu cukup mahal. Kami akan melunasi hutang ini untuk beberapa waktu."
 ARG_siam_di_tella: "SIAM Di Tella"
 ARG_chade_cade: "CHADE-CADE"
 ARG_anti_british_sentiment_idea: "Sentimen Anti-Inggris"
 ARG_anti_british_sentiment_idea_desc: "Sejak kita memutuskan hubungan dengan [ENG.GetNameDef], gelombang sentimen Anti-Inggris telah memasuki pemerintahan kita. Kita tidak lagi terikat oleh perjanjian dan perjanjian perdagangan mereka! Sekarang kita bisa fokus pada hal yang lebih penting: perang."
 ARG_growing_nationalism_modifier: "Gerakan Nasionalis yang Berkembang"
 ARG_growing_nationalism_modifier_desc: "Partai Nasionalis Argentina telah membuat gebrakan di seluruh negeri dan dengan demikian, semakin banyak orang berbondong-bondong mendukung ideologi mereka yang sedang berkembang. Nasionalisme Argentina mengikuti gagasan memulihkan identitas [ARG.GetAdjective] dan mengukuhkan diri sebagai kekuatan dominan di Amerika Selatan."
 ARG_modify_growing_nationalism_ns_intro: "Ubah §Y$ARG_growing_nationalism_modifier$§! dengan"
 ARG_military_government_idea: "Pemerintahan Militer"
 ARG_military_government_idea_desc: "Pedro Pablo Ramírez telah mengambil alih pemerintahan dan menggantikannya dengan mendirikan negara yang dikelola militer. Pergantian rezim ini dipicu oleh banyaknya tuntutan perubahan dari Concordancia yang sebelumnya korup dan curang. Dengan manifesto yang berfokus pada ekspansionisme [ARG.GeAdjective], negara kita pasti akan menghadapi banyak konflik di masa depan."
 ARG_spirit_of_the_conquistadors_idea: "Semangat Para Penakluk"
 ARG_spirit_of_the_conquistadors_idea_desc: "Ini berkat kejayaan para Conquistador yang membawa rakyat kita ke negeri perak yang indah ini. Mereka memainkan peranan penting dalam sejarah kita dan kini menjadi inspirasi bagi pemerintahan nasionalis Nimio de Anquín yang baru. [ARG.GetNameDefCap] akan tumbuh lebih besar seiring kita menaklukkan tetangga kita yang lebih lemah dan menjadi kekuatan dominan di Amerika Selatan."
 ARG_rapid_militarization_idea: "Militerisasi yang Cepat"
 ARG_rapid_militarization_idea_desc: "Militerisasi Cepat adalah proses di mana suatu masyarakat mengorganisir dirinya sendiri untuk menghadapi konflik dan kekerasan militer. Kami telah mengambil tanggung jawab untuk sepenuhnya mengembangkan Kompleks Industri Militer kami dan bersiap menghadapi pertempuran yang akan datang."
 ARG_argentine_nationalism_idea: "Nasionalisme Argentina"
 ARG_argentine_nationalism_idea_desc: "Ada banyak hal yang bisa kita banggakan sebagai [ARG.GetAdjective] dan karena itu kita terus mendorong mereka yang berada di dalam wilayah kita untuk mengidentifikasi dan mendukung kepentingan negara kita. Kami tidak membutuhkan bantuan dari mereka yang berupaya menerapkan peraturan yang keras atau mengancam kami dengan perang. [ARG.GetNameDefCap] adalah negara berdaulat yang berdiri sendiri."
 ARG_war_division_idea: "Divisi Perang"
 ARG_war_division_idea_desc: "Kini setelah bangsa kita memperkuat pemerintahannya dan membangun perekonomian yang kuat, kita akhirnya mendapatkan dukungan yang cukup dari rakyat kita untuk bersiap melaksanakan tujuan ekspansionis kita."
 ARG_preparing_for_war_idea: "Mempersiapkan Perang"
 ARG_preparing_for_war_idea_desc: "Benua Amerika Selatan menjulang di atas kita, siap untuk direbut. Tentara kita mempersiapkan diri untuk berperang sementara para politisi dan diplomat kita dengan sungguh-sungguh membuat dokumen dan ultimatum sebagai persiapan penaklukan kita. Pit Viper siap menyerang."
 ARG_spirit_of_the_cisplatine_war_idea: "Semangat Perang Cisplatine"
 ARG_spirit_of_the_cisplatine_war_idea_desc: "Perang Cisplatine juga biasa dikenal dengan nama Perang Argentina-Brasil. Ini adalah konflik bersenjata yang terjadi pada tahun 1820-an, dan sejak itu terjadilah perdamaian yang tegang dan tidak nyaman antara kedua negara. Hal ini tidak lagi terjadi. [BRA.GetNameDefCap] merupakan ancaman yang harus ditangani. Pasukan kita berbaris dengan semangat masa lalu kita sebagai penariknya."
 ARG_integrate_operation_bolivar_idea_lar: "Mengintegrasikan Operasi Bolivar"
 ARG_integrate_operation_bolivar_idea_lar_desc: "Berkat hubungan kami yang lebih dekat dengan kekuatan Poros, kami telah berhasil mulai mengintegrasikan Operasi Bolivar dan berupaya membantu teater Amerika Selatan dengan program spionase kami sendiri."
 ARG_integrate_operation_bolivar_idea_no_lar: "Mengintegrasikan Operasi Bolivar"
 ARG_integrate_operation_bolivar_idea_no_lar_desc: "$ARG_integrate_operation_bolivar_idea_lar_desc$"
 ARG_anti_american_idea: "Sentimen Anti-Amerika"
 ARG_anti_american_idea_desc: "$ARG_red_scare_idea_desc$"
 ARG_anti_american_propaganda_idea: "Propaganda Anti-Amerika"
 ARG_anti_american_propaganda_idea_desc: "[USA.GetNameDefCap] adalah ancaman penting bagi rezim kita. Meskipun mereka dikenal sebagai raksasa yang sedang tidur, kita tidak pernah tahu kapan mereka akan memutuskan untuk bangun dan mengalihkan perhatiannya kepada kita. Pasukan kami, berkat departemen propaganda kami, siap menghadapi bahaya [USA.GetAdjective] di utara."
 ARG_state_unions_idea: "Serikat Pekerja Negara"
 ARG_state_unions_idea_desc: "Serikat pekerja adalah organisasi pekerja yang bertujuan untuk mempertahankan dan meningkatkan kondisi kerja mereka. Banyak dari kondisi ini mencakup upah dan tunjangan yang lebih baik, peningkatan keselamatan dan kondisi kerja serta memastikan bahwa pekerja biasa tidak dianiaya oleh manajemen mereka."
 ARG_FJC_empowered_idea: "FJC Diberdayakan"
 ARG_FJC_empowered_idea_desc: "Federación Juvenil Comunista de la Argentina adalah salah satu organisasi politik pemuda paling berpengaruh dalam sejarah negara ini. Ini adalah organisasi pemuda yang sejalan dengan PCA dan didirikan pada tahun 1921 untuk mempromosikan kebijakan partai di kalangan pemuda Argentina. Dengan PCA yang kini memegang kendali penuh pemerintahan, FJC dapat terus menumbuhkan dan mengembangkan generasi muda Argentina menjadi revolusioner sejati!"
 ARG_state_atheism_idea: "Negara Ateisme"
 ARG_state_atheism_idea_desc: "Ateisme negara adalah penggabungan ateisme keras ke dalam rezim politik. Dianggap oleh banyak orang sebagai kebalikan dari teologi, kebijakan ini merupakan kebijakan umum yang diadopsi oleh negara-negara komunis, mengikuti jejak Uni Soviet ketika pertama kali berkuasa."
 ARG_liberation_theology_idea: "Teologi Pembebasan"
 ARG_liberation_theology_idea_desc: "Teologi pembebasan adalah salah satu ciri agama Kristen yang menekankan pembebasan kaum tertindas. Sebagai sebuah agama, agama terlibat dalam analisis sosio-ekonomi, dengan kepedulian sosial terhadap masyarakat miskin dan pembebasan politik bagi masyarakat tertindas. Teologi Pembebasan terbentuk melalui keinginan rakyat kita akan kebebasan beragama dan dukungan terhadap tujuan revolusioner kita."
 ARG_committee_of_state_security_idea_lar: "Komite Keamanan Negara"
 ARG_committee_of_state_security_idea_lar_desc: "Mencontoh badan-badan Intelijen Rusia, Komite Keamanan Negara Argentina dibentuk untuk menjalankan fungsi intelijen asing, kontra-intelijen, dan polisi rahasia."
 ARG_committee_of_state_security_idea_no_lar: "$ARG_committee_of_state_security_idea_lar$"
 ARG_committee_of_state_security_idea_no_lar_desc: "$ARG_committee_of_state_security_idea_lar_desc$"
 ARG_socialist_unification_idea: "Unifikasi Sosialis"
 ARG_socialist_unification_idea_desc: "Melalui kekuatan revolusi kita yang gemilang, kita akhirnya mampu mengukuhkan diri sebagai ideologi dominan di Benua Amerika Selatan. Perang ini, yang dimenangkan melalui darah dan keberanian, telah mengisi rakyat kita dengan keinginan untuk memiliki tanah air yang lebih besar bagi Republik Sosialis Amerika Selatan."
 ARG_eliminate_american_imperialism_idea: "Operasi Ocaso Escarlata"
 ARG_eliminate_american_imperialism_idea_desc: "Raksasa di utara telah lama menjadi benteng Kapitalisme. Sudah saatnya kita mengakhiri Imperialisme Amerika dan melahirkan Matahari Terbenam Merah."
 ARG_women_in_industry_idea: "$ARG_women_in_industry$"
 ARG_women_in_industry_idea_desc: "Dengan perempuan sebagai pemimpin tetap untuk [ARG.GetNameDef], maka perempuan harus mempunyai hak untuk bekerja di industri lain juga. Dengan bertambahnya jumlah tenaga kerja kita, kita dapat mengharapkan kemajuan ekonomi yang besar bagi negara kita."
 ARG_socialist_volunteers_idea: "$ARG_socialist_volunteers$"
 ARG_socialist_volunteers_idea_desc: "Untuk membantu mengamankan revolusi internasional, kita harus menawarkan bantuan kepada negara-negara sosialis kapan pun diperlukan. Jika kita bisa menghemat tenaga kerja, kita harus mengirimkan sukarelawan untuk membantu melawan kaum borjuis di seluruh dunia!"
 ARG_free_association_idea: "Asosiasi Produsen Bebas"
 ARG_free_association_idea_desc: "Asosiasi Bebas adalah hubungan antar individu di mana tidak ada negara, kelas sosial, hierarki, atau kepemilikan pribadi atas alat-alat produksi. Menurut kaum Anarko-Sindikalis yang berkuasa, hal ini akan memungkinkan individu untuk bebas berserikat tanpa batasan sosial untuk menghasilkan dan mereproduksi kondisi keberadaan mereka sendiri."
 ARG_no_gods_no_masters_idea: "¡Pembebasan!"
 ARG_no_gods_no_masters_idea_desc: "Meskipun negara-negara lain di benua ini mungkin tidak sepaham dengan pemerintah kita, namun jika kita duduk diam dan membiarkan negara-negara tersebut ditaklukkan oleh agresor yang penuh amarah dan suka berperang, maka hal ini akan bertentangan dengan ideologi kita. Jika ada tetangga kita yang jatuh ke tangan penjajah, kita harus mengangkat senjata untuk membebaskan mereka."
 ARG_regulated_salaries: "Gaji yang Diatur"
 ARG_regulated_salaries_desc: "Kami telah mengambil langkah-langkah untuk mencegah warga negara yang bekerja agar tidak dibayar rendah oleh industri dalam negeri. Kesepakatan yang dicapai dengan industri dan pekerja telah terbukti memberikan manfaat yang besar bagi kita sebagai sebuah negara."
 ARG_social_welfare_fund_ns: "Dana Kesejahteraan Sosial [ARG.GetAdjective]"
 ARG_social_welfare_fund_ns_desc: "Peningkatan belanja untuk upaya kesejahteraan sosial telah diberlakukan pada [ARG.GetNameDef]. Saat ini kami melihat dampak positif dari peningkatan anggaran ini dalam bentuk populasi yang lebih puas serta sikap yang semakin positif terhadap pemerintah."
 ARG_british_argentine_agreement: "Perjanjian [ENG.GetAdjective]-[ARG.GetAdjective]"
 ARG_british_argentine_agreement_desc: "Kesepakatan untuk kondisi perdagangan yang lebih baik antara kami dan [ENG.GetAdjective] telah tercapai. Kami menikmati sedikit diskon pada perdagangan kami dengan [ENG.GetAdjective] mulai sekarang."
