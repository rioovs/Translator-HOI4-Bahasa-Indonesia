 CHL_compania_general_electricidad: "Perusahaan Jenderal de Electricidad"
 CHL_compania_general_electricidad_desc: "CGE didirikan pada tanggal 21 Februari 1905 oleh sekelompok profesional, dipimpin oleh insinyur Francisco Huneeus Gana dan Raúl Claro Solar. Ini adalah pengembang elektronik terbesar di seluruh [ROOT.GetName]."
 CHL_compania_sudamerica_vapores: "Perusahaan Sudamericana de Vapores"
 CHL_compania_sudamerica_vapores_desc: "CSAV adalah perusahaan pelayaran [CHL.GetAdjective] yang saat ini merupakan perusahaan terbesar dari jenisnya di Amerika Latin dan juga salah satu yang tertua, didirikan pada tahun 1872. Hal ini dapat dimanfaatkan untuk meningkatkan produksi kapal pelayaran sipil."
 CHL_via_trans_radio: "Melalui Trans Radio Chilena Compañía de Radiotelegrafía"
 CHL_via_trans_radio_desc: "VTR didirikan pada tanggal 26 September 1928, dari investasi bersama yang dilakukan oleh Radio Corporation of America, Marconi Wireless Telegraph Company, Compagnie Generale de Telegraphie sans Fils dan Telefunken Gesellschaft. Perusahaan ini menyediakan layanan radiotelegrafi di dalam dan luar negeri, menjadi salah satu perusahaan telekomunikasi swasta pertama di [ROOT.GetName]."
 CHL_banco_central_de_chile: "Banco Central de Chili"
 CHL_banco_central_de_chile_desc: "Bank Sentral Chili didirikan pada bulan Agustus 1925, melalui Keputusan Undang-undang 486, yang juga menetapkan monopoli bank untuk menerbitkan uang kertas di bawah rezim standar emas. Itu dibuat pada masa jabatan pertama Arturo Alessandri sebagai presiden."
 CHL_compania_electro_industrial_valdivia: "Perusahaan Elektro-Siderúrgica dan Industrial de Valdivia"
 CHL_compania_electro_industrial_valdivia_desc: "ESVAL adalah industri besi dan baja yang berlokasi di Valdivia di Chili. Perusahaan ini dianggap sebagai pewaris Altos Hornos y Acerías de Corral yang infrastrukturnya dibeli pada tahun 1926 ketika didirikan oleh pengusaha dari Valdivia."
 CHL_empresa_ferrocarries_del_estado: "Perusahaan de los Ferrocarriles del Estado"
 CHL_empresa_ferrocarries_del_estado_desc: "EFE adalah perkeretaapian nasional dan perusahaan milik negara tertua di Chili. Ia mengelola infrastruktur dan mengoperasikan layanan kereta api di negara tersebut."
 CHL_compania_manufacura_cartones: "Perusahaan Produsen Papeles dan Karton"
 CHL_compania_manufacura_cartones_desc: "CMPC adalah perusahaan pulp dan kertas [CHL.GetAdjective], yang berkantor pusat di Santiago. Ini adalah produsen kertas terbesar di negara ini, dan perusahaan ini didirikan pada tahun 1920 sebagai penggabungan pabrik antara Cartón del Maipo dan Esperanza dan penggabungan pengusaha Luis Matte Larraín dan insinyur Jerman Germán Ebbinghaus."
 CHL_corporacion_fomento_production: "Corporación de Fomento de la Producción de Chile"
 CHL_corporacion_fomento_production_desc: "Setelah gempa bumi Chillán, CORFO didirikan untuk mendistribusikan barang kepada mereka yang terkena dampak, serta membantu pengendalian, distribusi dan pergerakan barang dalam [ROOT.GetAdjective]"
 CHL_fabricas_maestranzas_ejercito: "Kain dan Maestranzas del Ejército"
 CHL_famae_corvo: "Willys FAMAE Corvo"
