 USA_monroe_doctrine_idea: "Doktrin Monroe"
 USA_monroe_doctrine_idea_desc: "Amerika Serikat telah lama berjanji untuk melindungi belahan bumi barat dari campur tangan kekuatan kolonial dari luar, yang berarti setiap serangan ke wilayah kita kemungkinan besar berarti Amerika akan membantu kita. Namun, jika politik kita tidak lagi sejalan dengan Amerika Serikat, kita mungkin tidak terlindungi."
 USA_monroe_doctrine_enforcer: "Penegak Doktrin Monroe"
 USA_monroe_doctrine_enforcer_desc: "Sejak pertengahan abad ke-19, kami telah berupaya melindungi belahan bumi barat dari campur tangan kekuatan kolonial dari luar. Meskipun parameter doktrin ini telah berkembang seiring berjalannya waktu, inti dari doktrin ini adalah bahwa negara-negara tetangga kita di Amerika Utara dan Selatan akan mengharapkan kita untuk membantu mereka pada saat terjadi konflik. Tentu saja tergantung pada pemerintah kita sendiri yang menentukan kapan dan bagaimana menegakkan doktrin tersebut."
 idea_VEN_blockade_inactive: "Blokade Tidak Aktif"
 idea_VEN_blockade_inactive_instant_desc: "Kekuatan Asing dapat memblokade pengiriman minyak kita ke kekuatan selaras §YFasis§! jika mereka memiliki lebih dari 2 §YKapal Modal§! di §YLaut Karibia§!.\nStatus Saat Ini: §GTidak Ada Blokade§!"
