 SMB_MTG_naval_arms_race_legacy: "Warisan Perlombaan Senjata Angkatan Laut"
 SMB_MTG_naval_arms_race_legacy_desc: "Meskipun tidak ada perjanjian formal yang mencegah perluasan angkatan laut [BRA.GetAdjective], [CHL.GetAdjective] atau [ARG.GetAdjective], terdapat perjanjian informal sejak Perang Besar yang mencegah hal tersebut. Jika salah satu negara di kawasan ini mulai mempersenjatai armadanya dengan kapal-kapal besar yang baru, maka perlombaan senjata baru tidak akan terhindarkan."
 SMB_organization_of_american_states_member: "Organisasi Negara-negara Anggota Amerika"
 BRA_undiversified_economy_modifier: "Perekonomian yang Tidak Terdiversifikasi"
 BRA_undiversified_economy_modifier_desc: "Ketergantungan yang berlebihan pada ekspor kopi menyebabkan perekonomian Brasil lumpuh ketika depresi besar melanda dan negara-negara di dunia berhenti membeli stimulan yang membuat ketagihan. Pemerintah mana pun harus mendiversifikasi perekonomian ke bidang-bidang baru jika negaranya ingin berkembang."
 BRA_weak_government: "Pemerintahan yang Lemah"
 BRA_weak_government_desc: "Revolusi dan upaya kudeta selama bertahun-tahun telah melemahkan otoritas pemerintah Brasil. Situasi ini diperparah dengan konstitusi tahun 1934, sebuah perjanjian yang dibuat berdasarkan kompromi dan hanya mendapat sedikit pendukung. Apa pun masa depan Brasil, yang pasti tatanan politik yang ada saat ini tidak dapat dipertahankan."
 BRA_aftermath_of_the_coup: "Keadaan Darurat"
 BRA_aftermath_of_the_coup_desc: "Keadaan darurat diumumkan pada bulan November 1935 ketika komunis melancarkan kudeta yang mengancam akan berubah menjadi perang saudara skala penuh. Meski kudeta berhasil digagalkan, Presiden belum mengakhiri keadaan darurat. Banyak pihak dari berbagai spektrum politik sekarang khawatir bahwa rezim Tiongkok akan terus menggunakan kekuatan darurat untuk meredam perbedaan pendapat lebih lanjut."
