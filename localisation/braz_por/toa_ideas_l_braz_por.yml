 ARG_argentina_for_all_idea: "Argentina untuk Semua"
 ARG_argentina_for_all_idea_desc: "Bangsa kita yang besar ini mempunyai begitu banyak penduduk yang tinggal di dalam wilayahnya dan sejak lama, hampir mustahil untuk menyatukan penduduk kita di bawah satu bendera. Sudah saatnya kita mengubah pendekatan kita. [ARG.GetNameDef] adalah negara yang harus dapat diakses dan menerima semua orang yang tinggal di dalamnya."
 ARG_us_army_training_idea: "$ARG_us_army_training$"
 ARG_us_army_training_idea_desc: "Dengan hubungan yang lebih dekat dengan [USA.GetNameDef], kami dapat menerapkan pola pelatihan mereka ke dalam angkatan bersenjata kami. Jika kita melatih pasukan kita seperti yang dilakukan [USA.GetNameDef], kita akan memiliki militer yang lebih kuat dan tangguh."
 ARG_monroe_doctrine_idea: "Selaras dengan Doktrin Monroe"
 ARG_monroe_doctrine_idea_desc: "Doktrin Monroe telah lama menjadi cara untuk mencegah campur tangan Eropa di Belahan Barat. Penting bagi kita untuk menjunjung tinggi hal ini jika kita ingin selamat dari serangan gencar perang."
 ARG_argentina_first_idea: "$ARG_argentina_first$"
 ARG_argentina_first_idea_desc: "Tidak pernah mudah untuk melakukannya sendirian, terutama ketika kita mempunyai tujuan mulia untuk menaklukkan benua Amerika Selatan. Namun, jika kita terikat dengan gerakan fasis di Eropa, kita mungkin akan kehilangan tujuan sebenarnya: Amerika Selatan yang bersatu."
 ARG_united_workers_idea: "Pekerja Bersatu"
 ARG_united_workers_idea_desc: "Pekerja adalah tulang punggung revolusi sosialis. Proletariat bersatu melawan korupsi dan penipuan yang disebarkan kapitalisme di seluruh [ARG.GetNameDef]"
 ARG_agrarian_reforms_idea: "Reforma Agraria"
 ARG_agrarian_reforms_idea_desc: "$ARG_support_the_farmers_decisions_desc$"
