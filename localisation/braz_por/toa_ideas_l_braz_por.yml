l_braz_por:
 URG_terra_dictatorship: "Kediktatoran Terra"
 URG_terra_dictatorship_desc: "Sejak Revolusi 31 Maret 1933, Gabriel Terra dan para pendukungnya, termasuk mereka yang mengikuti Batllismo, serta Partai Putih dan pemimpinnya Luis Alberto de Herrera, Terra telah berkuasa, tanpa ada wewenang tersisa untuk menentang keputusannya. Bagi Uruguay, ini berarti netralitas yang ketat, sesuai keinginan Terra untuk pengembangan internal dan kendali dalam memilih pihak dalam perang yang tidak terduga, baik di Amerika Selatan, maupun di seberang lautan Atlantik."
 BOL_toll_of_the_chaco_war: "Korban Perang Chaco"
 BOL_toll_of_the_chaco_war_desc: "Perang Chaco baru saja berakhir, yang berlangsung dari tahun 1932 hingga 1935. Keinginan untuk berperang telah benar-benar terkuras bahkan dari para pendukung ekspansionisme yang paling bersemangat di Bolivia dan Paraguay, dan banyak yang tewas di wilayah Chaco Boreal yang masih disengketakan."
 BOL_toll_of_the_chaco_war_2: "Korban Perang Chaco"
 BOL_toll_of_the_chaco_war_2_desc: "Perang Chaco baru saja berakhir, yang berlangsung dari tahun 1932 hingga 1935. Keinginan untuk berperang telah benar-benar terkuras bahkan dari para pendukung ekspansionisme yang paling bersemangat di Bolivia dan Paraguay, dan banyak yang tewas di wilayah Chaco Boreal yang masih disengketakan."
 PRU_amazonian_war: "Perang Amazon"
 PRU_no_factions_tt: "Dapat Bergabung dengan Fraksi: §RNo§!"
 CHL_the_mapuche_conflict: "Konflik Mapuche"
 CHL_the_mapuche_conflict_desc: "Sejak pengamanan Araucania dan integrasi yang kuat atas tanah dan penduduknya ke dalam negara Chili, penduduk asli Mapuche telah terlantar, tidak disukai dan tidak puas. Walaupun ada kelompok di antara mereka yang memperjuangkan kerja sama dan integrasi, ada juga kelompok yang berjuang untuk menumbangkan negara dengan segala cara."
 CHL_mapuche_conflict_up_tt: "§RMemperburuk§! konflik Mapuche."
 CHL_mapuche_conflict_down_tt: "§GPelajaran§! konflik Mapuche."
 idea_CHL_the_Hacienda_inquilinaje_system: "Hacienda - Sistem Inquilinaje"
 idea_CHL_the_Hacienda_inquilinaje_system_desc: "Sistem Hacienda - Inquilinaje yang mengatur tuan tanah dan penyewa berasal dari cara Romawi kuno dan Kekaisaran Spanyol dalam menjalankan negara, dan seperti yang diharapkan, sangat ketinggalan jaman dan menindas. Hacienda Chili saat ini menonjol karena kondisi pekerja yang buruk dan bagian ekonomi yang terbelakang, karena masih memanfaatkan perbudakan hingga saat ini. Satu-satunya cara agar kita bisa keluar dari masalah ini dengan baik adalah §YReformasi Tanah§!, yang harus menjadi prioritas utama jika kita ingin memulihkan perekonomian kita."
 idea_CHL_near_anarchic_society: "Dekat Masyarakat Anarkis"
 idea_CHL_near_anarchic_society_desc: "Negara kita saat ini sering mengalami upaya kudeta dan kerusuhan, serta protes yang biasa terjadi sehari-hari. Hal ini juga disebabkan oleh permusuhan yang besar antara politisi, militer, dan lembaga-lembaga pemerintah, sehingga tidak ada satupun yang berfungsi dengan cukup efektif. Kita harus memperbaiki permasalahan ini jika kita ingin menstabilkan negara untuk selamanya."
 CHL_anarchic_society_level_down_tt: "§GMenurunkan§! efek $idea_CHL_near_anarchic_society$"
 CHL_anarchic_society_up_tt: "§RMemburuk§! dampak $idea_CHL_near_anarchic_society$"
 CHL_can_not_have_anarchy_tt: "Tidak memiliki $idea_CHL_near_anarchic_society$"
 idea_CHL_repubican_guard: "Garda Republik"
 idea_CHL_repubican_guard_desc: "Saat ini, republik ini berada dalam bahaya besar dan berada di ambang kehancuran. Namun, Presiden Arturo Alessandri sejak tahun 1925 telah menstabilkan sebagian besar situasi, dan sekarang ketergantungan pada milisi rahasia ini mengalihkan dana yang seharusnya disalurkan ke tentara, sehingga mencegah perluasan pasukan reguler."
 CHL_german_compensation_idea: "Kompensasi Jerman"
 CHL_spirit_of_the_conquistadors: "Semangat Para Penakluk"
 CHL_spirit_of_the_conquistadors_desc: "Ini berkat kejayaan para Conquistador yang membawa rakyat kita ke kerajaan besar kita di Atlantik Selatan. Mereka memainkan peranan penting dalam sejarah kita dan kini menjadi inspirasi bagi masyarakat kita dan kemauan mereka akan membimbing kita menuju masa depan. [CHL.GetNameDefCap] akan tumbuh lebih besar seiring kita menaklukkan tetangga kita yang lebih lemah dan menjadi kekuatan dominan di Amerika Selatan."
 CHL_relief_efforts_idea: "Upaya Bantuan"
 CHL_relief_efforts_idea_desc: "Pemerintah telah membentuk Perusahaan Rekonstruksi dan Bantuan dalam upaya untuk mengatur dan mendukung upaya bantuan dan rekonstruksi dengan lebih baik setelah gempa bumi Chillán tahun 1939."
 CHL_spanish_refugees: "Pengungsi Intelektual Spanyol"
 CHL_has_left_wing_government: "Memiliki Pemerintahan Sayap Kiri"
 CHL_has_right_wing_government: "Memiliki Pemerintahan Sayap Kanan"
 CHL_public_works_modifier: "Program Pekerjaan Umum"
 CHL_deeper_mines_modifier: "Jaringan Tambang yang Luas"
 CHL_devalue_the_peso_idea: "Mendevaluasi Peso"
 CHL_devalue_the_peso_idea_desc: "Agar perekonomian kita dapat memperoleh kekuatan yang dibutuhkan untuk tumbuh lebih besar, Peso sedang dalam proses devaluasi, meskipun merupakan ukuran yang tidak populer."
 CHL_devalue_the_franc_idea: "Mendevaluasi Franc"
 CHL_devalue_the_franc_idea_desc: "Agar perekonomian kita mendapatkan kekuatan yang dibutuhkan untuk tumbuh lebih besar, Franc sedang dalam proses devaluasi, meskipun merupakan ukuran yang tidak populer."
 CHL_introduced_the_franc_idea: "Memperkenalkan Franc"
 CHL_introduced_the_franc_idea_desc: "Agar negara ini dapat pulih dari dampak buruknya, dan menemukan tempatnya di panggung dunia, negara ini perlu menjadi bagian dari wilayah berbahasa Perancis yang lebih luas. Langkah besar telah dilakukan dengan mengganti Peso lama dengan Franc Araucanían."
 CHL_hydroelectric_power: "Pembangkit Listrik Tenaga Air"
 CHL_hydroelectric_power_desc: "Berkat investasi yang dilakukan di wilayah Araucanía, kami akhirnya membangun jaringan bendungan yang menghasilkan listrik dan mengatur aliran sungai."
 CHL_siphoning_funds: "Menyedot Dana"
 CHL_siphoning_funds_desc: "Departemen propaganda Partai Nacista saat ini menyedot dana dari sektor publik untuk meningkatkan pengaruhnya terhadap populasi [CHL.GetAdjective]."
 CHL_the_kings_scouts: "Pramuka Raja"
 CHL_the_kings_scouts_desc: "Sejak raja kami masih kecil, dia senang mengambil bagian dalam aksi paramiliter gerakan pramuka Perancis. Sekarang, dia akan membawa kegembiraan dan semangat yang sama kepada generasi muda [CHL.GetAdjective]."
 CHL_national_falange: "Falang Nasional"
 CHL_national_falange_desc: "Partai politik Kristen Falange Nacional adalah partai progresif dan reformis yang memisahkan diri dari partai konservatif pada tahun 1935, dan mereka sangat bersedia mendukung koalisi politik kita saat ini."
 CHL_popular_front_in_power: "Fronte Populer"
 CHL_liberal_party_in_power: "Partido Liberal"
 CHL_communist_party_in_power: "Partido Komunis"
 CHL_democratic_alliance_in_power: "Alianza Demokrasi"
 CHL_conservative_party_in_power: "Konservator Partido"
 CHL_radical_party_in_power: "Partido Radikal"
 CHL_popular_freedom_alliance_in_power: "Alianza Libertadora Populer"
 CHL_from_support_chile_static_modifier: "Mendukung Kerajaan Araucanía dan Patagonia"
 CHL_non_lar_encryption: "Bonus Enkripsi"
 CHL_lar_encryption: "Bonus Enkripsi"
 CHL_imposed_new_taxes: "Pajak Baru yang Dikenakan"
 CHL_impose_new_taxes_tt: "Ketika semangat kebangsaan §Y$CHL_imposed_new_taxes$§! dihilangkan, Ubah §Y$CHL_chilean_economy_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10%§!"
 CHL_relief_efforts_idea_tt: "Apabila semangat kebangsaan §Y$CHL_relief_efforts_idea$§! dihilangkan :"
 CHL_aid_SPR: "Membantu Republik Spanyol"
 CHL_aid_araucania: "Membantu Kerajaan Araucanía dan Patagonia"
 CHL_aiding_CHL_payment: "Pembayaran untuk Membantu Kerajaan Araucanía dan Patagonia"
 CHL_payment_for_aid: "Pembayaran Bantuan Luar Negeri"
 CHL_anti_americanism: "Anti-Amerikanisme"
 CHL_empowered_preparations_department: "Departemen Persiapan yang Diberdayakan"
 CHL_empowered_preparations_department_desc: "Departemen Persiapan Nacista saat ini diprioritaskan oleh partai tersebut, dan kelompok tersebut sedang mempersiapkan kudeta terhadap pemerintah liberal."
 CHL_lack_of_funds: "Kurangnya Dana"
 CHL_lack_of_funds_desc: "Pemerintah liberal telah mencuri sejumlah besar dana yang ada di dalam negeri dan melarikan diri ke luar negeri. Butuh waktu lama bagi kita untuk pulih dari kerugian ekonomi ini."
 CHL_republican_guards_in_exile: "[CHL.GetAdjective] Pengawal Republik di Pengasingan"
 CHL_republican_guards_in_exile_desc: "Pemerintahan Liberal [CHL.GetAdjective] telah membentuk pasukan paramiliter bersenjata di negara kita yang akan membantu mereka menghadapi ancaman fasis di negara mereka jika kita berperang dengan mereka."
 CHL_naval_mutiny: "Pemberontakan Angkatan Laut"
 CHL_naval_mutiny_desc: "Pemberontakan angkatan laut lainnya sedang berlangsung, sebagai protes terhadap gerakan kita untuk meraih kekuasaan, dan hal ini sangat melumpuhkan negara kita."
 CHL_the_international_revolution: "Revolusi Internasional"
 CHL_the_international_revolution_desc: "Kita harus memastikan bahwa api revolusioner, yang dimulai di luar negeri, tidak boleh dipadamkan."
 CHL_laissez_faire: "Laissez-Faire"
 CHL_laissez_faire_desc: "Pasar harus mengalir dengan bebas, dan hanya dengan menghindari pengaruh pemerintah atas urusan industri, perekonomian kita dapat pulih."
 CHL_strict_secularism: "Sekularisme Ketat"
 CHL_strict_secularism_desc: "Gereja tidak mempunyai suara dalam politik, dan harus dianggap benar-benar terpisah dari gereja. Kita harus meminta para politisi kita bersumpah untuk tidak membawa agama mereka ke parlemen."
 CHL_catholic_church_holding_political_power: "Gereja Katolik Memegang Kekuasaan Politik"
 CHL_catholic_church_holding_political_power_desc: "Gereja Katolik saat ini diizinkan untuk memberikan suara dalam kebijakan resmi pemerintah, sehingga membatasi kemampuan kelompok sayap kiri untuk membentuk koalisi yang kuat melawan kami."
 CHL_development_inwards_idea: "Perkembangan Ke Dalam"
 CHL_development_inwards_idea_desc: "Doktrin ekonomi baru, yang disebut Pembangunan ke Dalam, akan membantu rekonstruksi kita setelah bertahun-tahun menderita dan tidak melakukan tindakan."
 CHL_socialist_land_reform: "Reformasi Tanah Sosialis"
 CHL_socialist_land_reform_desc: "Era Hacendados telah berakhir, dan para petani kita tidak lagi harus hidup dalam perbudakan. Era baru benar-benar telah tiba di [CHL.GetNameDef]!"
 CHL_abolished_serfdom: "Menghapuskan Perhambaan"
 CHL_abolished_serfdom_desc: "Era Hacendados telah berakhir, dan para petani kita tidak lagi harus hidup dalam perbudakan!"
 CHL_comptroller_general_of_chile: "Kontraloría Jenderal de la República"
 CHL_comptroller_general_of_chile_desc: "Pengawas Keuangan Umum Republik adalah entitas audit superior di Chili, yang bersifat otonom dan berpangkat konstitusional, bertugas menjalankan kendali atas legalitas tindakan Administrasi Publik, mengawasi pendapatan dan investasi fiskal, kota dan organisasi serta layanan lainnya yang ditentukan oleh undang-undang, memeriksa dan menilai rekening orang-orang yang bertanggung jawab atas aset fiskal dan kota, menjaga akuntansi umum Negara dan melakukan fungsi-fungsi lain yang dipercayakan oleh hukum."
 CHL_oppressed_working_class: "Kelas Pekerja yang Tertindas"
 CHL_oppressed_working_class_desc: "Dengan penindasan brutal yang kita lakukan terhadap apa pun yang berbau komunis, serikat pekerja tidak bisa lagi bertindak di negara ini, dan kelas pekerja bisa diperintahkan untuk melakukan perintah kita, tanpa bisa melakukan protes yang layak, karena takut melanggar Hukum Pertahanan Permanen."
 CHL_socialist_youth_idea: "Pemuda Sosialis"
 CHL_socialist_youth_idea_desc: "Organisasi pemuda sosialis akan membantu kita mengorganisir sayap paramiliter yang dapat membantu tentara kita dalam pertempuran."
 CHL_anti_communist_action: "Aksi Chilena Anticomunista"
 CHL_anti_communist_action_desc: "Untuk memerangi ancaman komunis dalam negeri dengan baik, kita harus mengorganisir kelompok-kelompok patriotik yang siap untuk menekan gerakan kiri mana pun."
 CHL_ligas_patrioticas: "Ligas Patrioticas"
 CHL_ligas_patrioticas_desc: "Ligas Patrióticas adalah organisasi sipil para-polisi sayap kanan yang beroperasi di [CHL.GetNameDef], membantu kami memberantas perbedaan pendapat dan menghalangi siapa pun untuk menghindari wajib militer."
 CHL_hosting_german_intel_lar: "Menjadi tuan rumah bagi Intelijen dan Operasi Jerman"
 CHL_hosting_german_intel_lar_desc: "Kami secara aktif membantu Jerman dalam operasi mereka untuk memata-matai negara-negara lain di belahan bumi kami."
 CHL_hosting_german_intel_non_lar: "Menjadi tuan rumah bagi Intelijen dan Operasi Jerman"
 CHL_hosting_german_intel_non_lar_desc: "Kami secara aktif membantu Jerman dalam operasi mereka untuk memata-matai negara-negara lain di belahan bumi kami."
 CHL_fascist_assault_department: "Departemen de las Tropas Nacistas de Asalto"
 CHL_fascist_assault_and_provinces_department: "Departemen de las Tropas Nacistas de Asalto"
 CHL_fascist_youth_department: "Departemen Juventud Nacista"
 CHL_fascist_youth_and_provinces_department: "Departemen Juventud Nacista"
 CHL_pan_hispanic_rhetoric: "Retorika Pan-Hispanik"
 CHL_pan_hispanic_rhetoric_desc: "Segera, era masyarakat Hispanik akan tiba, dan kita akan menguasai benua ini. Ini saatnya mematahkan hegemoni Anglo dan menyatukan rakyat Hispanik!"
 CHL_pan_hispanic_rhetoric_2: "Retorika Pan-Hispanik"
 CHL_pan_hispanic_rhetoric_2_desc: "Segera, era masyarakat Hispanik akan tiba, dan kita akan menguasai benua ini. Ini saatnya mematahkan hegemoni Anglo dan menyatukan rakyat Hispanik!"
 CHL_pan_hispanic_rhetoric_3: "Retorika Pan-Hispanik"
 CHL_pan_hispanic_rhetoric_3_desc: "Segera, era masyarakat Hispanik akan tiba, dan kita akan menguasai benua ini. Ini saatnya mematahkan hegemoni Anglo dan menyatukan rakyat Hispanik!"
 CHL_fascist_military_excercises: "Latihan Militer"
 CHL_the_true_enemy_idea: "Serang Melawan Musuh Sejati"
 CHL_spirit_of_the_pacific_war: "Menghidupkan Kembali Semangat Perang Pasifik"
 CHL_spirit_of_the_pacific_war_desc: "Kami pernah mengalahkan pasukan [BOL.GetAdjective] dan [PRU.GetAdjective] meski kalah jumlah. Sekarang kami menggunakan ini sebagai propaganda untuk menginspirasi tentara kami agar terus maju!"
 CHL_ancestral_mapuche_resistance: "Resistencia Leluhur Mapuche"
 CHL_mapuche_ancestral_resistance_good: "Resistencia Leluhur Mapuche"
 CHL_democratic_volunteer_corps: "Perlindungan Internasional terhadap Demokrasi"
 CHL_democratic_volunteer_corps_desc: "Tidak peduli di mana pun otoritarianisme berani muncul, tentara kita akan berdiri dengan bangga dan siap untuk memberantasnya kapan saja."
 CHL_stubbornly_maintaining_neutrality: "Dengan Keras Kepala Menjaga Netralitas"
 CHL_stricter_labor_laws: "Undang-Undang Ketenagakerjaan yang Lebih Ketat"
 CHL_enact_stricter_labor_laws_tt: "Apabila semangat kebangsaan §Y$CHL_stricter_labor_laws$§! dihilangkan, Ubah §Y$CHL_chilean_economy_dynamic_modifier$§! dengan:\n$MODIFIER_STABILITY_FACTOR$: §G+10%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-25%§!"
 CHL_carabineros_de_chile_fascist: "Carabineros de Chili"
 CHL_carabineros_de_chile_fascist_desc: "Carabineros de Chile adalah gendarmerie penegak hukum nasional kita, yang memiliki yurisdiksi atas seluruh negara. Dibuat oleh presiden lama kami Carlos Ibáñez del Campo pada tahun 1927, misi mereka adalah menjaga ketertiban dan menegakkan hukum Chili."
 CHL_carabineros_de_chile_neutrality: "Carabineros de Chili"
 CHL_carabineros_de_chile_neutrality_desc: "Carabineros de Chile adalah gendarmerie penegak hukum nasional kita, yang memiliki yurisdiksi atas seluruh negara. Dibuat oleh presiden besar kita Carlos Ibáñez del Campo pada tahun 1927, misi mereka adalah menjaga ketertiban dan menegakkan hukum Chili."
 CHL_the_francoist_model: "Model Francois"
 CHL_the_francoist_model_desc: "Dengan mengikuti doktrin diktator netral, seperti yang dijanjikan oleh jenderal Spanyol Francisco Franco, kita dapat menghindari konflik global dan fokus pada wilayah pengaruh kita."
 CHL_the_francoist_model_conquest: "Model Francois"
 CHL_the_francoist_model_conquest_desc: "Dengan mengikuti doktrin diktator netral, seperti yang dijanjikan oleh jenderal Spanyol Francisco Franco, kita dapat menghindari konflik global dan fokus pada wilayah pengaruh kita."
 CHL_state_supporting_resistance_modifier: "Perlawanan yang Didukung Chili"
 CHL_state_supporting_resistance_modifier_desc: "Chile diam-diam memasok senjata dan peralatan, serta pelatihan militer kepada kelompok perlawanan dan gerilya setempat."
 CHL_mapuche_nationalism_dynamic_modifier: "Nasionalisme Mapuche"
 CHL_mapuche_nationalism_dynamic_modifier_desc: "Meskipun Nasionalisme Mapuche belum begitu lazim di negara kita selama ini. Oleh karena itu, kita harus membentuknya sendiri, untuk memastikannya mendapatkan bentuk yang paling kita inginkan."
 CHL_an_empire_in_the_pacific_idea: "Sebuah Kerajaan di Pasifik"
 CHL_an_empire_in_the_pacific_idea_desc: "Akhirnya tiba waktunya bagi [CHL.GetNameDef] untuk mengambil takdirnya dan membangun kerajaan besar di Pasifik."
 CHL_mapuche_social_classes: "Kelas Sosial Mapuche dan Identitas Rekan Gender"
 CHL_mapuche_social_classes_desc: "Dengan menerapkan kelas-kelas sosial dan norma-norma masyarakat lama kita ke dalam masyarakat baru, kita dapat membuat masyarakat kita sejahtera kembali."
 CHL_cattle_and_wool: "Sapi dan Wol Mapuche"
 CHL_cattle_and_wool_desc: "Berkat teknik penggembalaan dan peternakan yang sangat baik dari masyarakat Mapuche, negara ini dapat memanfaatkan sedikit yang mereka miliki."
 CHL_machi_in_the_army: "Organisasi Tentara Machi"
 CHL_machi_in_the_army_desc: "Dengan menyuruh para dukun Machi berbaris bersama pasukan kita, kita dapat memastikan bahwa mereka selalu bersemangat dan termotivasi."
 CHL_legacy_of_caupolican: "Warisan Caupolicán"
 CHL_legacy_of_caupolican_desc: "Warisan Caupolicán masih mempengaruhi kita saat ini, dan semangat serta kemauannya akan diteruskan dalam pikiran dan tindakan pasukan kita."
 CHL_unified_in_spirit_idea: "Bersatu dalam Roh"
 CHL_unified_in_spirit_idea_desc: "Masyarakat Amerindian dan Polinesia bekerja sama dalam mengoordinasikan dan melatih militer mereka, sehingga menjadikan mereka jauh lebih efisien."
 CHL_patagonian_giants: "Raksasa Patagonian"
 CHL_patagonian_giants_desc: "Dahulu kala, Patagones menimbulkan ketakutan di hati bahkan para penjelajah Eropa yang paling berani sekalipun. Kita harus memastikan bahwa tentara kita mewujudkan semangat orang-orang khayalan ini, dan mendapatkan rasa hormat dari semua orang di sekitar kita."
 CHL_crusade_against_imperialism_idea: "Perang Salib Besar Melawan Imperialisme"
 CHL_crusade_against_imperialism_idea_desc: "Akhirnya tiba saatnya untuk mengusir kekuatan imperialis dan kolonialis dari benua kita, dan membebaskan masyarakat Amerindian dan Polinesia dari penindasan asing!"
 CHL_local_mapuche_defense_groups: "Kelompok Pertahanan Mapuche Lokal"
 CHL_ibanez_foriegn_support: "Investasi Ekonomi Asing"
 CHL_ibanez_foriegn_support_desc: "Berkat pinjaman-pinjaman baru dalam jumlah besar, negara ini perlahan-lahan dapat bangkit kembali ketika dana baru mengalir ke tangan industri-industri kita."
 CHL_state_catholicism_idea: "Katolik Negara"
 CHL_state_catholicism_idea_desc: "Sebagai langkah lain menuju ranah berbahasa Perancis, [CHL.GetNameDef] telah mengadopsi agama Katolik sebagai agama negara barunya."
 CHL_french_investments: "Investasi Prancis"
 CHL_french_investments_desc: "Jacques Antoine Bernard tiba di negara tersebut dengan dukungan moneter dari para bangsawan Prancis yang tidak puas dengan Republik tempat mereka tinggal saat ini, dengan harapan akan masa depan yang lebih baik di [CHL.GetNameDef]."
 CHL_veteran_legionaries: "Legiun Veteran"
 CHL_veteran_legionaries_desc: "Banyak anggota Legiun Asing Perancis telah bergabung dengan Antoine Bernard dalam perjalanannya ke negara kita, dan akan membantunya dalam penaklukannya yang gemilang."
 CHL_popular_resistance: "Perlawanan Rakyat"
 CHL_popular_resistance_desc: "Masih banyak masyarakat di negeri ini yang tidak percaya dengan kekuatan kecemerlangannya, Raja Antoine Bernard. Mereka harus segera ditangani!"
 CHL_french_aristocracy: "Aristokrasi Perancis"
 CHL_araucanian_aristocracy: "Aristokrasi Araucanian Baru"
 araucanian_capital_perquenco: "Perquenco"
 CHL_invited_french_academia: "Akademisi Perancis"
 CHL_invited_french_academia_desc: "Bagian penting dalam dunia berbahasa Perancis adalah berpikir serupa, dan untuk melakukan hal tersebut, kami akan mendorong akademisi Perancis untuk beralih ke [CHL.GetNameDef]."
 CHL_royal_mountaineers: "Les Montagnards Royaux"
 CHL_royal_mountaineers_desc: "Meskipun Patagonia mungkin bukan tempat yang tepat, Araucanía jelas merupakan negeri pegunungan dan hutan. Oleh karena itu, raja menyerukan pembentukan korps pendaki gunung kerajaan, yang berspesialisasi dalam pertempuran di medan yang sulit ini."
 CHL_peru_payments_to_chile: "Pembayaran ke Chili"
 CHL_peru_payments_to_chile_desc: "Saat ini, kami diharuskan membayar sejumlah besar uang setiap bulannya kepada [CHL.GetNameDef], karena pembelian [951.GetName] yang kami lakukan."
 CHL_chile_payments_from_peru: "Pembayaran dari Peru"
 CHL_chile_payments_from_peru_desc: "Karena pembelian [951.GetName] baru-baru ini, [PRU.GetNameDef] memberi kami sejumlah besar uang setiap bulannya, sehingga memperkuat perekonomian kami."
 CHL_puppeteering_idea: "Aturan Dari Bayangan"
 CHL_puppeteering_idea_desc: "Seseorang tidak hanya memerintah dengan menaklukkan segalanya dan berusaha menobatkan dirinya sendiri sebagai raja. Dia malah harus menemukan rakyat yang setia, dan menempatkan mereka di atas takhta musuh-musuhnya yang telah ditaklukkan, seperti yang pernah dilakukan oleh Napoleon Bonaparte yang agung!"
 BOL_plurinational_democracy: "Plurinasionalisme Demokratis"
 BOL_plurinational_democracy_desc: "Negara kita ditentukan oleh hidup berdampingan dari banyak kelompok nasional yang dilindungi atau dilestarikan dalam suatu pemerintahan. Dalam [BOL.GetNameDef], gagasan tentang kebangsaan bersifat jamak, yang berarti terdapat banyak warga negara dalam suatu komunitas atau kumpulan masyarakat yang terorganisir."
