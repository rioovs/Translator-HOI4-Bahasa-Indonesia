#Building local support in a state
 wtt_political_organisation.1.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.1.desc: "Pejabat partai lokal di [state.GetName] melaporkan bahwa mayoritas warga di wilayah tersebut masih mendukung kami. Pekerjaan ekstensif bahkan telah menghasilkan peningkatan dukungan di wilayah tersebut."
 wtt_political_organisation.1.a: "Orang-orang mengetahui pemenang ketika mereka melihatnya."
 wtt_political_organisation.2.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.2.desc: "Sumber di [state.GetName] melaporkan bahwa [majority_country.GetNameDef] tampaknya telah melakukan upaya bersama untuk meningkatkan dukungan di seluruh wilayah. Mayoritas penduduk masih mendukung mereka."
 wtt_political_organisation.2.a: "Perjuangan terus berlanjut."
 wtt_political_organisation.3.t: "[state.GetName] Mendukung Kami"
 wtt_political_organisation.3.desc: "Kabar menggembirakan datang dari [state.GetName], dimana dibentuklah \"[Root.GetLeader] Masyarakat Studi Pemikiran\" beberapa waktu lalu. Kelompok ini kini mendapat dukungan besar dari masyarakat. Penyebutan dukungan mereka sebelumnya untuk [old_majority_country.GetLeader] telah hilang."
 wtt_political_organisation.3.a: "Mereka mengikuti teori yang lebih unggul."
 wtt_political_organisation.4.t: "[From.GetNameDefCap] Mendapatkan Mayoritas di [state.GetName]"
 wtt_political_organisation.4.desc_not_majority: "Agen kami di [state.GetName] melaporkan bahwa dukungan untuk [old_majority_country.GetNameDef] di wilayah tersebut telah menurun secara signifikan. Baru-baru ini, demonstrasi besar-besaran yang mendukung [majority_country.GetNameDef] telah terjadi di kota-kota besar di negara bagian tersebut, dan gambar besar [majority_country.GetLeader] dapat ditemukan di setiap desa."
 wtt_political_organisation.4.desc_had_majority: "Dengan menggunakan segala cara yang mereka miliki, agen [majority_country.GetNameDef] tampaknya telah berhasil mempengaruhi populasi [state.GetName] agar memihak mereka. Kita harus melipatgandakan upaya kita untuk mendapatkan kepercayaan mereka."
 wtt_political_organisation.4.a: "Tidak dapat diterima."
 wtt_political_organisation.5.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.5.desc: "Meskipun ada upaya besar untuk meyakinkan penduduk [state.GetName], hanya sedikit yang bersedia berpindah pihak secara terbuka. Rumornya, [majority_country.GetLeader] sendiri telah menyatakan bahwa [state.GetName] harus diadakan bagaimanapun caranya. Banyak warga yang takut akan pembalasan jika mereka secara terbuka menunjukkan dukungan mereka terhadap [Root.GetLeader], namun perwakilan lokal kami berharap bahwa upaya baru di masa depan mungkin dapat meyakinkan lebih banyak orang."
 wtt_political_organisation.5.a: "Kita harus mencoba lagi."
 wtt_political_organisation.6.t: "Dukungan Untuk [From.GetNameDef] Meningkat di [state.GetName]"
 wtt_political_organisation.6.desc_not_majority: "Surat kabar di [state.GetName] melaporkan rekor jumlah massa pada serangkaian pidato baru-baru ini oleh [From.GetLeader]. Tampaknya semakin banyak penduduk yang mendukung [From.GetNameDef]. Namun untuk saat ini, mayoritas masih mendukung [majority_country.GetLeader]."
 wtt_political_organisation.6.desc_has_majority: "Kabar meresahkan telah datang dari [state.GetName]. Serangkaian pidato [From.GetLeader] telah menarik perhatian banyak orang, dan fungsionaris partai lokal kita mendapati diri mereka dikelilingi oleh warga yang marah yang menuntut jawaban atas pertanyaan-pertanyaan yang dihadapi [state.GetName]. Untuk saat ini, posisi kita di negara bagian ini masih aman, namun hal itu mungkin akan berubah dengan cepat."
 wtt_political_organisation.6.a: "Kami harus mengawasi situasinya."
#Current leader being mean and removing local support in a state
 wtt_political_organisation.7.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.7.desc: "Demonstrasi di [state.GetName] telah meningkat menjadi kekerasan ketika pengunjuk rasa diserang oleh sekelompok preman bertopeng. Ledakan kekerasan ini nampaknya membuahkan hasil yang diinginkan, karena dukungan politik terhadap oposisi sudah hampir hilang.\n\nMeskipun tidak ada yang secara langsung menghubungkan kami dengan kejadian ini, pesan yang disampaikan seharusnya disampaikan dengan jelas dan jelas."
 wtt_political_organisation.7.a: "Hal ini seharusnya mengajarkan mereka untuk tidak ikut campur."
 wtt_political_organisation.8.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.8.desc: "Demonstrasi mendukung pemerintah kita di [state.GetName] telah diserang oleh preman bersenjata yang mempekerjakan [majority_country.GetLeader]. Sejumlah pendukung kami tewas dalam bentrokan tersebut, dan dukungan terhadap pemerintah kami menurun drastis."
 wtt_political_organisation.8.a: "Memalukan."
 wtt_political_organisation.9.t: "[state.GetName] Mendukung Kami"
 wtt_political_organisation.9.desc: "Agen kami di [state.GetName] telah melakukan serangkaian serangan terhadap markas partai lokal [old_majority_country.GetLeader], yang sangat merusak organisasi politik partainya. Hal ini tidak luput dari perhatian masyarakat. Pendukung [old_majority_country.GetLeader] kini menjadi minoritas."
 wtt_political_organisation.9.a: "Semuanya adil dalam cinta dan perang, dan politik adalah bagian dari keduanya."
 wtt_political_organisation.10.t: "[From.GetNameDefCap] Mendapatkan Mayoritas di [state.GetName]"
 wtt_political_organisation.10.desc_not_majority: "Dukungan untuk [old_majority_country.GetLeader] di [state.GetName] telah menurun secara signifikan setelah serangkaian pemboman terhadap kantor partai. Serangan ini mungkin diperintahkan oleh [majority_country.GetLeader], yang berjanji untuk \"memulihkan ketertiban\" di [state.GetName]. Tampaknya mayoritas penduduk kini menaruh dukungannya padanya."
 wtt_political_organisation.10.desc_had_majority: "Menyusul serangkaian serangan teroris di [state.GetName], penduduk setempat tampaknya kehilangan kepercayaan terhadap kemampuan kita untuk melindungi mereka. Karena serangan tersebut secara eksklusif menargetkan kantor partai kami, jelas bahwa [majority_country.GetLeader] terlibat dalam hal ini."
 wtt_political_organisation.10.a: "Tidak dapat diterima."
 wtt_political_organisation.11.t: "Laporan dari [state.GetName]"
 wtt_political_organisation.11.desc: "Kampanye kami untuk menekan dukungan terhadap [majority_country.GetLeader] tampaknya belum berhasil sepenuhnya. Meskipun kami telah berupaya sebaik mungkin, mayoritas warga di [state.GetName] masih mendukung [majority_country.GetLeader]."
 wtt_political_organisation.11.a: "Kita mungkin perlu menyampaikan pesan itu ke rumah."
 wtt_political_organisation.12.t: "Penindasan di [state.GetName]"
 wtt_political_organisation.12.desc_not_majority: "[state.GetName] sedang mengalami gelombang kekerasan politik yang belum pernah terjadi sebelumnya. Perkelahian jalanan antara pendukung [From.GetLeader] dan [majority_country.GetLeader] merupakan kejadian sehari-hari. Untuk saat ini, tampaknya [majority_country.GetLeader] masih didukung oleh mayoritas penduduk."
 wtt_political_organisation.12.desc_has_majority: "Agen [From.GetLeader] di [state.GetName] telah memulai kampanye intimidasi dan teror politik. Ada laporan bahwa warga yang mendukung kami dilecehkan di depan umum dan dicap sebagai pengkhianat. Pejabat partai dipukuli dan beberapa kantor kami dibakar. Meskipun demikian, mayoritas penduduk setempat masih menolak tunduk pada teror dan terus mendukung kami."
 wtt_political_organisation.12.a: "Kami akan menang."
#Warlord support 
 wtt_political_warlord_support.1.t: "[From.GetNameDefCap] Meminta Dukungan Kami"
 wtt_political_warlord_support.1.desc: "Perwakilan [asking_for_support.GetLeader] telah tiba untuk mengajak kami membentuk aliansi politik. [asking_for_support.GetLeader] berjanji tidak akan ikut campur dalam urusan internal kita jika dia menang dalam perjuangan politik saat ini. Memihak dalam konflik ini mungkin mempunyai dampak jangka panjang, karena pihak lain yang terlibat pasti akan menganggapnya sebagai pengkhianatan."
 wtt_political_warlord_support.1.a: "Kami akan mendukung mereka."
 wtt_political_warlord_support.1.b: "Kita harus menunggu kesepakatan yang lebih baik."
 wtt_political_warlord_support.2.t: "[warlord_asked_for_support.GetLeader] Mendukung Kami"
 wtt_political_warlord_support.2.desc: "Dalam surat pribadi kepada [Root.GetLeader], [warlord_asked_for_support.GetLeader] berterima kasih kepada kami atas dukungan kami yang murah hati terhadap pemerintahannya. Surat tersebut terus mengatakan bahwa setelah banyak pertimbangan pribadi, [warlord_asked_for_support.GetLeader] telah sampai pada kesimpulan bahwa kepentingan Tiongkok secara keseluruhan paling baik dilayani dengan memberikan [Root.GetLeader] peran yang lebih besar dalam membentuk masa depan politiknya.\n\nMulai sekarang, surat ini berakhir, [warlord_asked_for_support] akan mendukung upaya kita dalam perjuangan politik saat ini."
 wtt_political_warlord_support.2.a: "Orang baik."
 wtt_political_warlord_support.3.t: "[warlord_asked_for_support.GetNameDefCap] Menolak"
 wtt_political_warlord_support.3.desc: "Misi kami untuk mendapatkan dukungan [warlord_asked_for_support.GetLeader] belum berhasil. [warlord_asked_for_support.GetLeader] menganggap perjuangan politik saat ini hanya sekedar tontonan belaka yang mengalihkan perhatian kita dari ancaman nyata yang dihadapi Tiongkok."
 wtt_political_warlord_support.3.a: "Selama dia tetap netral..."
 wtt_political_warlord_support.10.desc: "Sejauh ini kami memilih untuk tidak ikut serta dalam perjuangan politik saat ini. Tampaknya hal ini tidak luput dari perhatian [From.GetLeader]. Dia telah mengirimkan pesan, menanyakan apa yang diperlukan bagi kita untuk menyatakan dukungan kita kepada pihaknya.\n\nKita harus mempertimbangkan pilihan-pilihan kita dengan hati-hati dan memastikan kita tidak menjual kemerdekaan kita terlalu murah."
 wtt_political_warlord_support.10.a: "Mintalah untuk menunjukkan dukungan publik."
 wtt_political_warlord_support.10.b: "Mintalah pengiriman senapan."
 wtt_political_warlord_support.10.c: "Mintalah bantuan dalam mereformasi militer kita."
 wtt_political_warlord_support.10.d: "Kami tidak akan dibeli dengan mudah!"
 wtt_political_warlord_support.11.t: "[From.GetLeader] menuntut dukungan publik."
 wtt_political_warlord_support.11.desc: "Negosiasi dengan [From.GetLeader] telah selesai. Pemimpin [From.GetNameDef] telah mencatat bahwa penduduk di negaranya mengikuti peristiwa-peristiwa di sekitar Tiongkok dengan penuh minat dan spekulasi tersebar luas mengenai kapan [From.GetLeader] akan bergabung dalam perjuangan untuk mendapatkan kendali atau menyerahkan kursinya di meja perundingan.\n\nPernyataan publik tentang persahabatan dan kekaguman terhadap [From.GetLeader] dari pihak kami akan sangat membantu dalam meyakinkan masyarakat [From.GetNameDef] bahwa pemimpin mereka dianggap sebagai kekuatan penting dalam politik Tiongkok dan dihormati secara luas."
 wtt_political_warlord_support.11.a: "Jika ini yang diperlukan..."
 wtt_political_warlord_support.11.b: "Tidak dapat diterima."
 wtt_political_warlord_support.12.t: "[From.GetLeader] meminta senjata."
 wtt_political_warlord_support.12.desc: "Negosiasi dengan [From.GetLeader] telah selesai. Pemimpin [From.GetNameDef] telah mencatat bahwa penduduk di negara bagiannya sangat prihatin dengan buruknya perlengkapan tentaranya. Banyak unit bahkan tidak memiliki senapan untuk setiap orang, dan sejumlah tentara harus menggunakan persenjataan yang ketinggalan jaman termasuk senapan dan pedang tua yang dilengkapi moncong.\n\nKarena memilih pihak dalam konflik yang sedang berlangsung dapat mengakibatkan konfrontasi militer, [From.GetLeader] menginginkan komitmen yang kuat dari pihak kita untuk melengkapi kembali pasukannya dengan senjata sebelum dia menyatakan dukungannya kepada publik."
 wtt_political_warlord_support.12.a: "Semoga kita tidak menyesali hal ini..."
 wtt_political_warlord_support.13.t: "[From.GetLeader] meminta bantuan militer."
 wtt_political_warlord_support.13.desc: "Negosiasi dengan [From.GetLeader] telah selesai. Dalam jawabannya, [From.GetLeader] mencatat bahwa pasukan militernya sangat kekurangan perwira berpengalaman dan sangat membutuhkan reformasi. Rakyat [From.GetNameDef] tidak akan pernah menoleransi dia mengambil sikap berani dalam perjuangan saat ini ketika pasukannya sedang kacau balau.\n\nJika kami membantu [From.GetLeader] dalam mereformasi pasukannya, dia akan dengan senang hati mendukung kami di depan umum."
 wtt_political_warlord_support.13.a: "Pengorbanan kecil."
 wtt_political_warlord_support.21.t: "[From.GetLeader] memberikan dukungannya."
 wtt_political_warlord_support.21.desc: "Berbicara kepada pers nasional dan internasional awal pekan ini, [From.GetLeader] menyebut dirinya sebagai \"siswa pertama dari pemikiran [From.From.GetLeader]\", dengan mengatakan bahwa orang-orang seperti [From.From.GetLeader]-lah yang akan membuat Tiongkok bangkit dari kekacauan perselisihan dan konflik internal.\n\nKetika ditanya apakah dia akan mempertimbangkan [From.From.GetLeader] untuk posisi di pemerintahannya, [From.GetLeader] menjawab bahwa dia akan dengan senang hati melakukannya memiliki seseorang dengan pengalaman dan kebijaksanaan [From.From.GetLeader] di sisinya."
 wtt_political_warlord_support.21.a: "Dia baik sekali."
 wtt_political_warlord_support.22.t: "[From.GetLeader] mengirimkan peralatan."
 wtt_political_warlord_support.22.desc: "Pengiriman pertama senapan dan perlengkapan infanteri lainnya telah tiba dari [From.GetNameDef]. Meskipun senjata-senjata ini bukanlah teknologi yang mutakhir, senjata-senjata ini tampaknya berfungsi dengan baik dan dapat diberikan kepada pasukan sesegera mungkin.\n\nBersamaan dengan pengiriman tersebut, kami menerima pesan dari [From.GetLeader], yang mengingatkan kami untuk menunda akhir kesepakatan kami."
 wtt_political_warlord_support.22.a: "Ini akan sangat berguna."
 wtt_political_warlord_support.23.desc: "Sekelompok perwira telah tiba, dikirim oleh [From.GetLeader] dengan misi membantu kami dalam mereformasi militer kami. Kelompok ini mencakup berbagai macam spesialis, mulai dari komandan infanteri berpengalaman hingga pasukan artileri dan perwira staf.\n\nPemimpin pasukan menyerahkan catatan dari [From.GetLeader], mengingatkan kami untuk menunda kesepakatan kami."
 wtt_political_warlord_support.23.a: "Mereka sangat diterima."
 wtt_take_national_leadership.1.t: "[From.GetLeader] Siap Menjabat Kepemimpinan Nasional"
 wtt_take_national_leadership.1.desc: "Di seluruh Tiongkok, demonstrasi besar-besaran terjadi, menuntut [old_leader.GetLeader] mundur sebagai pemimpin Tiongkok dan menyerahkan kendali kepada [new_leader.GetLeader]. Bahkan di dalam pemerintahan kita, banyak yang percaya bahwa [new_leader.GetLeader] memiliki peluang lebih baik untuk menyatukan Tiongkok dan memimpinnya menuju masa depan.\n\nDukungan politik terhadap [new_leader.GetLeader] telah berkembang hingga pada titik di mana menolak penyerahan kekuasaan akan berisiko menimbulkan kembali permusuhan."
 wtt_take_national_leadership.1.a: "Rakyat telah menyatakan keinginannya."
 wtt_take_national_leadership.1.b: "Ini bukan demokrasi!"
 wtt_take_national_leadership.2.t: "[old_leader.GetLeader] Menyerahkan"
 wtt_take_national_leadership.2.desc: "Dalam upacara resmi, [old_leader.GetLeader] telah mengalihkan jabatan perdana menteri Republik ke [new_leader.GetLeader]. Saat berpidato di hadapan para pendukungnya yang berkumpul, [new_leader.GetLeader] mengatakan ini:\n\n\"Tradisi Pemikiran [old_leader.GetLeader] telah menjadikan Tiongkok seperti sekarang ini. Tidak ada keraguan bahwa [old_leader.GetLeader] telah bekerja keras untuk membuat negara kita lebih kuat. Dia adalah seorang patriot sejati dan akan dikenang sebagai pemimpin yang hebat. Namun kita juga harus memberikan ide-ide baru kesempatan untuk membuktikan diri di dunia nyata. Bersama-sama, kita akan menciptakan baru, Tiongkok yang lebih baik, kuat dan bersatu!\"
 wtt_take_national_leadership.2.a: "Tiga sorakan untuk [new_leader.GetLeader]!"
 wtt_take_national_leadership.3.t: "[From.GetLeader] Menolak"
 wtt_take_national_leadership.3.desc: "Meskipun dukungan rakyat sangat besar terhadap [new_leader.GetLeader], [From.GetLeader] menolak menyerahkan posisinya sebagai perdana menteri Republik. Menyatakan bahwa dia tidak akan pernah tunduk pada pemerasan atau menyerahkan negara kepada pengkhianat dan bandit, [From.GetLeader] telah menegaskan bahwa dia tidak akan mundur dari jabatannya."
 wtt_take_national_leadership.3.a: "Maka kita akan mengambilnya dengan paksa!"
