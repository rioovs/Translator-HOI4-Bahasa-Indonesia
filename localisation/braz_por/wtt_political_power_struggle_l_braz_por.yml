 CHI_political_power_struggle_desc_active: "Perjuangan telah meletus untuk mendapatkan kendali politik di Tiongkok. Kita harus mendapatkan dukungan dari para panglima perang dan penduduk di berbagai negara bagian agar dapat meraih kemenangan."
 CHI_political_power_struggle_desc_not_active: "Politik Tiongkok bisa sama kejamnya dengan perang apa pun. Jika kita atau orang lain memutuskan untuk bermain demi Kepemimpinan Nasional, kita harus siap untuk mendapatkan dukungan dari para panglima perang dan penduduk di berbagai negara bagian agar bisa meraih kemenangan."
