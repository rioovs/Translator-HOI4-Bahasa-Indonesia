 RAJ_GOE_mughal_independence_category: "Kemerdekaan Mughal"
 RAJ_GOE_enforced_peace_decision_eng: "$RAJ_GOE_enforced_peace_decision$"
 RAJ_the_legacy_of_babur: "Warisan Babur"
 RAJ_the_legacy_of_babur_desc: "Kekaisaran Mughal pernah menyatukan sebagian besar wilayah di bawah benderanya. Kini, ada orang-orang yang bermimpi mengembalikan kejayaannya, menggunakan warisan Babur untuk menginspirasi era baru kebangkitan dan persatuan kekaisaran."
 RAJ_the_legacy_of_babur_tt: "Setiap negara bagian yang dilanda kerusuhan akan menerima:"
 RAJ_a_peacock_prince: "Pangeran Merak"
 RAJ_a_peacock_prince_desc: "Warisan Mughal menuntut pemimpin yang layak untuk merebut kembali tahtanya. Di antara negara-negara pangeran, Pangeran Merak harus bangkit—yang garis keturunan, ambisi, dan visinya dapat memulihkan kemegahan kekaisaran dan menyatukan benua sekali lagi."
 RAJ_halls_of_knowledge: "Aula Pengetahuan"
 RAJ_halls_of_knowledge_desc: "Bangsa yang kuat dibangun di atas landasan ilmu pengetahuan. Dengan berinvestasi dalam penelitian dan pendidikan, kami memupuk inovasi, memberdayakan sumber daya manusia, dan memastikan posisi [ROOT.GetNameDef] sebagai pemimpin dalam sains, industri, dan kemajuan."
 RAJ_sharpen_the_tulwar: "Pertajam Tulwar"
 RAJ_sharpen_the_tulwar_desc: "Tulwar, simbol kekuatan dan perlawanan, harus diasah untuk pertempuran yang akan datang. Dengan memodernisasi kekuatan kami dan menyempurnakan strategi kami, kami memastikan bahwa [ROOT.GetNameDef] siap menyerang dengan tegas ketika dibutuhkan."
 RAJ_timurid_bureaucracy: "Birokrasi Timurid"
 RAJ_timurid_bureaucracy_desc: "Berakar pada warisan Timur, Birokrasi Timurid memberikan model pemerintahan yang efisien dan kontrol terpusat. Merevitalisasi sistem ini akan memperkuat pemerintahan Kekaisaran, memastikan stabilitas dan kemakmuran di seluruh wilayahnya yang luas."
 RAJ_conquer_afghanistan: "Taklukkan Afganistan"
 RAJ_conquer_afghanistan_desc: "Afghanistan, jantung leluhur kekaisaran, harus direbut kembali. Dengan memulihkan kendali atas wilayah bersejarah ini, kami menghormati warisan Mughal dan mengamankan benteng penting bagi kebangkitan kekaisaran."
 RAJ_across_the_himalayas: "Di seberang Himalaya"
 RAJ_across_the_himalayas_desc: "Negeri-negeri di luar Pegunungan Himalaya menyimpan kekayaan yang tak terhitung dan kepentingan strategis. Dengan memperluas pengaruh Kekaisaran Mughal di puncak-puncak yang megah ini, kami memperkuat dominasi kami dan mengamankan perbatasan baru demi kejayaan kerajaan."
 RAJ_through_the_wakhan_corridor: "Melalui Koridor Wakhan"
 RAJ_through_the_wakhan_corridor_desc: "$RAJ_skibedi_san_ma_desc$"
 RAJ_skibedi_san_ma: "Menghancurkan Panglima Perang"
 RAJ_skibedi_san_ma_desc: "Para panglima perang Xibei San Ma berdiri sebagai penghalang dominasi Kekaisaran Mughal di Asia Tengah. Dengan melancarkan kampanye yang tegas, kita dapat membongkar kekuasaan mereka, mengamankan jalur perdagangan strategis, dan memperluas pengaruh kekaisaran di wilayah tersebut."
 RAJ_conquerors_of_persia: "Penakluk Persia"
 RAJ_conquerors_of_persia_desc: "[PER.GetNameDef], negeri dengan kekayaan dan sejarah yang luar biasa, pernah menjadi saingan kekaisaran. Dengan menempatkannya di bawah kekuasaan Mughal, kami menegaskan kembali dominasi kami, mengamankan wilayah-wilayah penting di barat, dan memperkuat posisi kekaisaran sebagai pewaris sejati keagungan kekaisaran."
 RAJ_halls_of_knowledge_2: "Akademi Kekaisaran"
 RAJ_halls_of_knowledge_2_desc: "Pengetahuan adalah kunci menuju kekuasaan yang abadi. Dengan mendirikan Akademi Kekaisaran di seluruh Kekaisaran Mughal, kami membina para cendekiawan, ilmuwan, dan administrator yang akan mendorong inovasi, memperkuat pemerintahan, dan memastikan warisan kebijaksanaan dan kemajuan kekaisaran."
 RAJ_halls_of_knowledge_3: "Sumur Pengetahuan Abadi"
 RAJ_halls_of_knowledge_3_desc: "Pengetahuan mungkin akan membawa kita ke jurang kekacauan yang dalam sehingga manusia tidak berani merangkainya, namun kita harus melangkah ke sana."
 RAJ_elephants_for_the_modern_age: "Gajah untuk Zaman Modern"
 RAJ_elephants_for_the_modern_age_desc: "Gajah perang perkasa dari Kerajaan Mughal pernah mendominasi medan perang. Kini, kami menyesuaikan warisan mereka dengan era modern dengan berinvestasi pada kendaraan lapis baja dan kekuatan mekanis, menciptakan mesin perang yang tak terhentikan untuk membawa kerajaan kami menuju kemenangan."
 RAJ_unite_the_subcontinent: "Satukan anak benua"
 RAJ_unite_the_subcontinent_desc: "Negara-negara yang terpecah-belah di anak benua ini merupakan bayangan dari kejayaannya di masa lalu. Dengan menyatukan kembali tanah-tanah ini di bawah panji Mughal, kami mengembalikan keharmonisan, kekuatan, dan keagungan sebuah kerajaan yang ditakdirkan untuk memerintah dari pegunungan hingga lautan."
 RAJ_the_true_mongols: "Bangsa Mongol Sejati"
 RAJ_the_true_mongols_desc: "[Root.GetNameDef] adalah pewaris sah warisan Mongol, yang memadukan kekuatan stepa dengan budaya anak benua. Dengan merangkul asal usul kami, kami menyalurkan semangat bangsa Mongol Sejati untuk menaklukkan dan bersatu seperti yang dilakukan nenek moyang kami dulu."
 RAJ_halls_of_knowlege_3: "Perpustakaan Kekaisaran"
 RAJ_halls_of_knowlege_3_desc: "Masyarakat terpelajar adalah fondasi kerajaan yang berkembang. Dengan membangun perpustakaan besar di wilayah Mughal, kami melestarikan kearifan kuno, mendorong inovasi, dan menginspirasi generasi mendatang untuk memimpin kekaisaran menuju kejayaan yang tak tertandingi."
 RAJ_thunder_elephants: "Gajah Guntur"
 RAJ_thunder_elephants_desc: "Gajah yang agung, simbol kekuatan Mughal, kembali ke medan perang sebagai perwujudan kekuatan dan tradisi. Kekuatan dan kehadiran mereka akan menginspirasi tentara kita dan menimbulkan ketakutan di hati musuh-musuh kita, membuka jalan bagi kemenangan kekaisaran."
 RAJ_revolt_of_the_princes: "Pemberontakan Para Pangeran"
 RAJ_revolt_of_the_princes_desc: "Negara-negara pangeran, yang telah lama ditaklukkan di bawah kekuasaan Inggris, akan melakukan pemberontakan untuk merebut kembali warisan mereka."
 RAJ_revolt_of_the_princes_tt: "Setelah menyatakan perang terhadap Raj Inggris, negara-negara pangeran akan bangkit dan bergabung dengan kita, menjadi subyek."
 RAJ_secular_rule: "Administrasi Sekuler"
 RAJ_secular_rule_desc: "Kerajaan Mughal tumbuh subur dalam keberagaman, dan pemerintahan sekuler memastikan pemerintahan yang adil bagi semua warga negara, apapun agamanya. Dengan memprioritaskan prestasi dan kesetaraan, kami memperkuat kesatuan kekaisaran dan menjamin loyalitas di seluruh wilayah kekuasaannya yang luas dan beragam."
 RAJ_theocratic_rule: "Kodifikasi ulang Dhimmi"
 RAJ_theocratic_rule_desc: "Hak-hak non-Muslim sangat ditentukan di bawah pemerintahan Mughal. Inilah saatnya untuk menyesuaikan hal-hal ini dengan dunia modern, dan membuktikan kepada seluruh India bahwa kita adalah dunia yang tercerahkan."
 RAJ_mughal_court: "Pengadilan Mughal"
 RAJ_mughal_court_desc: "Pengadilan Mughal mengumpulkan para pemikir paling cerdas dan pemimpin paling berpengaruh di dunia. Dengan memberdayakan para penasihat ini, kami memperkuat kekaisaran dengan bimbingan mereka, memastikan bahwa setiap keputusan mencerminkan kejayaan dan ambisi pemerintahan kami."
 RAJ_mughal_court_tt: "Semua Negara Kepangeranan akan menerima Semangat Nasional:"
 RAJ_mughal_court_princely_states_tt: "Semua pangeran akan meninggalkan negara pangeran mereka dan bergabung dengan Kekaisaran Mughal sebagai penasihat atau jenderal."
 RAJ_the_silk_road: "Perluas Jalur Sutra"
 RAJ_the_silk_road_desc: "Jalur Sutra pernah membawa kekayaan dan budaya bagi Kekaisaran. Dengan memulihkan jaringan perdagangan bersejarah ini, kami mendapatkan kembali posisi kami di pusat perdagangan global, memperkaya kekaisaran dan mendorong kemakmuran di seluruh wilayahnya yang luas."
 RAJ_restore_the_timurid_empire: "Kembalikan Kekaisaran Timurid"
 RAJ_restore_the_timurid_empire_desc: "Panji-panji Timur berkibar sekali lagi, dan kerajaan yang pernah menimbulkan ketakutan di hati para sultan dan raja telah bangkit dari abu sejarah. Kekuasaan kami membentang di seluruh wilayah yang pernah dibentuk oleh penaklukannya, mengikat Timur dan Barat di bawah satu kekuasaan. Biarlah dunia memperhatikan—Timurid telah kembali, dan kali ini, kita tidak akan tenggelam dalam masa lalu."
 RAJ_peacock_throne_for_the_modern_age: "Tahta Merak untuk Zaman Modern"
 RAJ_peacock_throne_for_the_modern_age_desc: "Singgasana Merak adalah lambang utama kekuasaan dan keagungan nenek moyang kita. Dengan membangun tahta baru di pusat kekuasaan bersejarah kita, kita menegaskan dominasi kita, menginspirasi kesetiaan, dan memperjelas visi kita untuk delta subur di anak benua ini."
 RAJ_the_crown_and_the_world: "Mahkota dan Dunia"
 RAJ_the_crown_and_the_world_desc: "Nasib Kerajaan Mughal adalah menjadi negara adidaya global yang tak tertandingi. Dengan memperluas pengaruh, meningkatkan kekuatan, dan menegaskan dominasi, kita akan mengamankan posisi kita sebagai penguasa utama dunia modern."
 RAJ_conquerors_of_iraq: "Berbaris di Mesopotamia"
 RAJ_conquerors_of_iraq_desc: "Irak dulunya merupakan persimpangan penting perdagangan dan kekuasaan dalam kekaisaran Timur, dan kekayaannya menyulut kejayaan kita di masa lalu. Kini, negara tersebut berada di tangan penguasa yang lebih rendah, dan tidak layak menerima warisannya. Dengan mengembalikan Mesopotamia ke bawah kekuasaan kita, kita akan mengamankan wilayah strategis, mengendalikan pintu gerbang antara Timur dan Barat, dan mengingatkan dunia bahwa Timurid tidak meminta, mereka mengambil."
 RAJ_conquerors_of_turkey: "Pertempuran Ankara Kedua"
 RAJ_conquerors_of_turkey_desc: "Anatolia pernah menjadi medan perang bagi berbagai kerajaan, dan sejarah mengenang kemenangan Timur atas Ottoman. Namun, penerus kesultanan yang hancur itu masih tetap berdiri, berpegang teguh pada tanah yang menjadi hak kekuasaan kami. Dengan bergerak ke barat sekali lagi, kita akan menghancurkan pertahanan mereka dan merebut kembali penaklukan kita di masa lalu."
 RAJ_reviving_the_workshop_of_the_world: "Menghidupkan Kembali Lokakarya Dunia"
 RAJ_reviving_the_workshop_of_the_world_desc: "Sebelum pemerintahan Inggris, India adalah pusat industri, tekstil, dan perdagangan global. Kini dengan terlahirnya kembali Kekaisaran, inilah saatnya untuk merebut kembali warisan itu. Dengan memodernisasi pabrik-pabrik kita dan merevitalisasi jalur perdagangan kita, kita akan mengubah perekonomian kita menjadi kekuatan yang mampu menyaingi negara-negara besar di dunia."
 RAJ_legacy_of_timur: "Warisan Timur"
 RAJ_legacy_of_timur_desc: "Kerajaan Timur tidak pernah dimaksudkan untuk hilang dalam sejarah. Dengan merebut kembali tanah leluhur kami dan menyatukannya di bawah satu pemerintahan, kami akan menghidupkan kembali warisan Timurid dan membentuk era baru yang penuh kekuatan dan ambisi. Dunia akan kembali gemetar di hadapan putra-putra Timur."
 RAJ_forging_the_mughal_arsenal: "Membangun Kembali Gudang Senjata Mughal"
 RAJ_forging_the_mughal_arsenal_desc: "Peperangan di masa lalu dimenangkan dengan tongkat dan batu, masa itu telah berlalu. Jika kerajaan kita ingin melawan kekuatan-kekuatan besar di dunia modern, kita harus membangun basis industri yang mampu menopang mesin militer yang besar. Jalur perakitan akan berdengung dengan suara Industri dan segera tentara kita akan berbaris dengan senjata yang ditempa oleh tangan kita sendiri."
 RAJ_rebuilding_the_empires_roads: "Membangun Kembali Jalan Kekaisaran"
 RAJ_rebuilding_the_empires_roads_desc: "Sebuah kerajaan tidak dapat berfungsi tanpa sarana untuk menggerakkan tentara, barang, dan rakyatnya. Jalan-jalan dan rel kereta api yang ditinggalkan oleh Inggris yang rusak harus diperluas dan dimodernisasi."
 if_not_subcontinent_tt: "Jika kami belum menyelesaikan §Y$RAJ_unite_the_subcontinent$§!:"
 if_not_silk_road_tt: "Jika kami belum menyelesaikan §Y$RAJ_the_silk_road$§!:"
 also_on_vijay_tt: "Dapatkan inti di §YIndia Selatan§! dan §YCoromandel§!"
 unlock_decisions_silk_road_tt: "Membuka keputusan untuk memasukkan lebih banyak wilayah §YJalur Sutra§!"
 mughal_west_britain_company_dec: "Gabungkan Perusahaan Inggris Barat"
 allows_mughal_west_british_company_tt: "Memungkinkan keputusan administratif."
 create_mwbc_tt: "Membuat §Y$mughal_west_britain_company$§! dengan inti di daratan Inggris dan Wales."
 RAJ_hedgemony_of_the_subcontinent: "Hegemoni anak benua"
 RAJ_hedgemony_of_the_subcontinent_desc: "Kita telah mencapai dominasi industri di benua ini, menyingkirkan semua pihak lain yang bisa mengklaim gelar tersebut. Kita menjadi tidak dapat diganggu gugat, meninggalkan kelompok-kelompok lain yang memisahkan diri dalam debu."
 RAJ_hedgemony_of_the_subcontinent_tt: "Semua negara bagian awal dimiliki oleh [ROOT.GetName]"
 pak_factories_tt: "[RAJ.GetName] memiliki §Y150%§! lebih banyak pabrik daripada §Y[PAK.GetName]§!\nPabrik Kami: [?var:THIS.num_of_factories]\nDibutuhkan: [?var:pak_factories]"
 pak_tech_tt: "[RAJ.GetName] memiliki §Y30%§! lebih banyak teknisi daripada §Y[PAK.GetName]§!\nTeknisi Kami: [?var:THIS.num_researched_technologies]\nDibutuhkan: [?var:pak_researched_techs]"
 RAJ_orchestrate_train_robberies_desc: "Pembangunan perkeretaapian melambat di bawah manajemen yang dipimpin oleh pekerja dan pengawasan yang lebih besar, namun setiap jalur yang dibangun lebih terintegrasi ke dalam perekonomian terencana, sehingga menghasilkan keluaran logistik dan efisiensi yang lebih tinggi."
 RAJ_revisiting_inquities: "Mata ganti mata"
 RAJ_revisiting_inquities_desc: "Kemunduran bersejarah Kekaisaran kita hanya dipercepat oleh campur tangan perusahaan dagang asing. Ada di antara kita yang percaya bahwa dengan kekuatan baru yang kita miliki, adalah hak kita untuk membuat musuh lama kita terkena kejahatan yang sama yang pernah mereka lakukan terhadap kita."
 RAJ_royal_indian_navy_mutiny: "Pemberontakan Angkatan Laut Kerajaan India"
 RAJ_royal_indian_navy_mutiny_desc: "Ketidakpuasan muncul di kalangan pelaut India, yang menunjukkan dukungan terhadap tujuan kami. Kita bisa menggunakan ini untuk merebut kekuasaan dan menghentikan bala bantuan Inggris. Mereka tidak punya pilihan selain menyerah."
 RAJ_royal_indian_navy_mutiny_tt: "§RKeputusan Infiltrasi Komunis akan dihapus ketika fokus ini selesai§!"
 RAJ_royal_indian_navy_mutiny_tt2: "§RKeputusan Infiltrasi Komunis akan dihapus ketika memenuhi kewajiban kami§!"
 RAJ_hide_communist_infiltration: "$RAJ_royal_indian_navy_mutiny_tt2$"
 RAJ_accept_russian_muhajir_money_desc: "Emas asing mengalir ke tangan kita, memicu api revolusi."
 RAJ_jugantar_desc: "Semangat Jugantar bangkit, menyebarkan perlawanan ke seluruh negeri. Kita bisa menggunakan ini untuk merebut Bengal sekali lagi"
 RAJ_the_peoples_liberation_army_desc: "Sebagai kekuatan yang disiplin dan berkomitmen secara ideologis, Tentara Pembebasan Rakyat akan memimpin upaya pembebasan nasional. Beranggotakan kelas pekerja dan kaum tani, mereka siap membela revolusi dan membentuk tatanan baru."
 RAJ_deathblow_to_imperial_remnants_desc: "[PAK.GetName] telah bertindak sebagai wakil bagi Inggris, dimana Inggris menyalurkan sejumlah besar sumber daya kepada mereka dalam upaya untuk mengimbangi gelombang pasang komunisme. Kami akhirnya akan mengakhiri pertengkaran ini."
 RAJ_the_revolutionary_army_marches_desc: "Dengan tujuan, tentara kita bergerak, demi revolusi, demi India, dan demi rakyat jelata."
 RAJ_threaten_princes_desc: "Para pangeran akan menuruti tuntutan kita, atau menghadapi konsekuensi dari pembangkangan mereka."
 #EIC feedback stuff
 RAJ_look_to_the_future: "Lihatlah ke Masa Depan"
 RAJ_look_to_the_future_desc: "Kita perlu melihat ke masa depan, bukan masa lalu untuk mengendalikan kekacauan harga ini. Sejumlah besar tindakan stabilisasi perlu dilaksanakan kemarin."
 RAJ_lobby_parliment: "Lobi Parlemen"
 RAJ_lobby_parliment_desc: "Dengan dukungan investor swasta, kami akan melobi Parlemen untuk menjadikan privatisasi sebagai satu-satunya upaya perlindungan terhadap keruntuhan ekonomi global lainnya. Menjual sebagian wilayah Raj bukan hanya sekedar strategi, tapi juga stabilitas kekaisaran."
 RAJ_lobby_parliment_tt: "Kami akan mulai membentuk Perusahaan India Timur"
 #bye
 RAJ_orchestrate_train_robberies: "Kereta Api Rakyat"
 RAJ_orchestrate_train_robberies_tt: "Fokus kereta api sekarang akan memodifikasi §YKereta Api India§! Semangat dengan:\nOutput Pabrik: §G+[?RAJ_railway_default_increase_tt]%§!\nKecepatan Konstruksi Kereta Api: §R[?RAJ_railway_default_decrease_tt]%§!\nKecepatan Konstruksi Pusat Pasokan: §R[?RAJ_railway_default_decrease_tt]%§!\nKecepatan Pembangunan Infrastruktur: §R[?RAJ_railway_default_decrease_tt]%§!\nuntuk setiap fokus perkeretaapian yang telah selesai\n\nSetiap fokus perkeretaapian yang sudah selesai akan secara otomatis dialihkan ke akun ini."
 RAJ_accept_russian_muhajir_money: "Terima Uang Muhajir Rusia"
 RAJ_jugantar: "Jugantar"
 RAJ_jugantar_tt: "Setelah menyatakan perang terhadap [PAK.GetName] kami akan memperoleh perpecahan di seluruh Bangladesh"
 RAJ_bhoodan_movement: "Gerakan Bhoodan"
 RAJ_bhoodan_movement_desc: "Melalui redistribusi tanah secara sukarela, kami akan memberdayakan mereka yang tidak memiliki tanah dan memulihkan keadilan di pedesaan. Dengan mengembalikan tanah kepada mereka yang menggarapnya, kita tidak hanya memperoleh hasil kerja mereka, namun juga kesetiaan abadi mereka."
 RAJ_the_peoples_liberation_army: "Bentuk Tentara Pembebasan Rakyat"
 RAJ_deathblow_to_imperial_remnants: "Pukulan mematikan bagi Sisa-sisa Kekaisaran"
 RAJ_the_revolutionary_army_marches: "Pawai Tentara Revolusioner"
 RAJ_nationalize_british_owned_factories: "Nasionalisasi Pabrik Milik Inggris"
 RAJ_nationalize_british_owned_factories_desc: "Pabrik-pabrik yang dibangun dengan tenaga kerja [RAJ.GetAdjective] tidak akan lagi melayani kepentingan asing. Dengan menasionalisasi industri milik [ENG.GetAdjective], kita mengembalikan kendali kepada rakyat dan merebut kembali apa yang telah diambil secara tidak adil."
 RAJ_threaten_princes: "Mengancam para Pangeran"
 RAJ_exile_princes: "Mengasingkan para Pangeran"
 RAJ_exile_princes_desc: "Era pemerintahan pangeran telah berakhir. Untuk menjamin persatuan nasional yang sejati, kami akan menyingkirkan sisa-sisa kekuasaan feodal ini, mengasingkan mereka jauh dari istana dan rakyat yang pernah mereka kuasai."
 RAJ_integrate_the_princes: "Integrasikan para Pangeran"
 RAJ_integrate_the_princes_desc: "Sekarang kita telah mengasingkan para pangeran dan perlahan-lahan mengintegrasikan mereka ke India, sekarang saatnya untuk akhirnya mengintegrasikan negara-negara Kepangeranan untuk selamanya."
 RAJ_integrate_the_princes2: "Subjugasi Pangeran"
 RAJ_integrate_the_princes2_desc: "Sistem semi-otonomi negara bagian Princely bukanlah sesuatu yang ingin kami pertahankan. Negara-negara pangeran akan sepenuhnya dimasukkan ke dalam India untuk selamanya."
 RAJ_exiled_princes_flag: "Telah mengasingkan para Pangeran"
 RAJ_join_the_co_prospherity_sphere: "Bergabunglah dengan Lingkungan Kemakmuran Bersama"
 RAJ_join_the_co_prospherity_sphere_desc: "Jepang adalah satu-satunya kekuatan lokal yang bersedia melawan imperialis Barat. Kita perlu bergabung dengan mereka untuk mencapai tujuan yang lebih besar."
 RAJ_join_the_co_prospherity_sphere_tt: "(§Y[JAP.GetName]§!) Mendapat acara '§Y[RAJ.GetNameDefCap] berupaya untuk bergabung dalam lingkup Kemakmuran Bersama§!'."
 RAJ_cruiser_effort_dlc: "$RAJ_cruiser_effort$"
 RAJ_submarine_effort_dlc: "$RAJ_submarine_effort$"
 RAJ_capital_ship_effort_dlc: "$RAJ_capital_ship_effort$"
 RAJ_black_swan_sloops: "Sloop Angsa Hitam"
 RAJ_black_swan_sloops_desc: "Dengan memperoleh dan memperbaiki lambung kelas Black Swan yang hemat biaya, kami dapat dengan cepat memperluas armada kapal patroli ringan kami, yang ideal untuk pertahanan pantai dan perlindungan konvoi."
 RAJ_coastal_protection: "Perlindungan Pesisir"
 RAJ_coastal_protection_desc: "Garis pantai kita yang luas memerlukan perlindungan terhadap ancaman asing."
 RAJ_the_sword_and_the_saffron: "Pedang dan Kunyit"
 RAJ_the_sword_and_the_saffron_desc: "Nasib kita ditempa melalui kekuatan dan iman. Pedang akan mempertahankan tanah kami, dan panji kunyit akan menyatukan rakyat kami di bawah satu tujuan."
 RAJ_burn_down_the_cellular_jail: "Bakar Penjara Seluler"
 RAJ_burn_down_the_cellular_jail_desc: "Penjara Seluler merupakan penghinaan terhadap siapa pun yang pernah memperjuangkan kemerdekaan India, penjara tersebut harus dihancurkan."
 RAJ_indian_marine_corps: "[ROOT.GetAdjective] Korps Marinir"
 RAJ_indian_marine_corps_desc: "Kami akan membentuk Korps Marinir yang berdedikasi, terlatih dalam operasi amfibi dan serangan khusus."
 RAJ_madras_ship_repair_factories: "Pabrik Perbaikan Kapal Madras"
 RAJ_madras_ship_repair_factories_desc: "Madras akan dikembangkan menjadi pusat dukungan angkatan laut utama dengan fasilitas perbaikan khusus untuk memelihara dan mereparasi armada kami yang terus bertambah, memastikan kesiapan operasional di seluruh pesisir timur."
 RAJ_obtain_british_naval_contracts: "Dapatkan Kontrak Angkatan Laut Inggris"
 RAJ_obtain_british_naval_contracts_desc: "Kami akan mendekati [ENG.GetNameDefCap] untuk mendapatkan kontrak pembangunan angkatan laut, memanfaatkan kapasitas industri mereka untuk memperkuat armada kami sendiri sekaligus memperkuat hubungan strategis."
 RAJ_purchase_decomissioned_british_ships: "Beli Kapal yang Dinonaktifkan"
 RAJ_purchase_decomissioned_british_ships_desc: "Kami akan mendekati [ENG.GetNameDefCap] untuk memperoleh kapal angkatan laut yang dinonaktifkan. Meskipun ketinggalan jaman, kapal-kapal ini dapat diperbaiki untuk memperluas armada kami dengan cepat dengan biaya minimal."
 RAJ_request_transfer_of_british_commanders: "Minta Pemindahan Komandan Inggris"
 RAJ_request_transfer_of_british_commanders_desc: "Kami akan meminta [ENG.GetNameDefCap] untuk memindahkan salah satu Komandan Angkatan Laut mereka kepada kami untuk membantu pelatihan marinir baru kami."
 RAJ_obtain_modern_ship_contracts: "Dapatkan Kontrak Kapal Modern"
 RAJ_obtain_modern_ship_contracts_desc: "Untuk mempercepat modernisasi angkatan laut kami, kami akan bernegosiasi dengan [ENG.GetNameDefCap] untuk akuisisi kapal penjelajah canggih, memastikan armada kami tetap kompetitif dalam lanskap maritim yang terus berkembang."
 RAJ_dominate_the_bay_of_bengal: "Mendominasi Teluk Benggala"
 RAJ_dominate_the_bay_of_bengal_desc: "Mengamankan supremasi angkatan laut di Teluk Benggala sangat penting bagi strategi maritim kita. Dengan memperluas kehadiran kami dan memproyeksikan kekuatan di perairan ini, kami menjaga jalur perdagangan dan menegaskan dominasi regional."
 RAJ_indian_cruiser_development: "[ROOT.GetAdjective] Pengembangan Kapal Penjelajah"
 RAJ_indian_cruiser_development_desc: "Waktunya telah tiba untuk menentukan arah angkatan laut kita sendiri. Dengan mengembangkan kapal penjelajah yang dirancang di dalam negeri, kami menegaskan kemandirian industri kami dan meletakkan dasar bagi armada India yang modern."
 RAJ_increase_funding_for_the_GRSE: "Meningkatkan pendanaan untuk GRSE"
 RAJ_increase_funding_for_the_GRSE_desc: "Kami akan meningkatkan pendanaan negara untuk GRSE untuk memungkinkan pembangunan galangan kapal baru."
 RAJ_womens_royal_indian_naval_service: "Dinas Angkatan Laut Kerajaan Wanita [ROOT.GetAdjective]"
 RAJ_womens_royal_indian_naval_service_desc: "Kami akan membentuk Layanan Angkatan Laut Kerajaan Wanita [ROOT.GetAdjective], yang memungkinkan perempuan untuk berperan di Angkatan Laut."
 RAJ_modernizing_navy_dlc: "Modernisasi Angkatan Laut"
 RAJ_modernizing_navy_dlc_desc: "Untuk menegaskan diri kita sebagai kekuatan regional, kita harus memodernisasi angkatan laut kita dengan berinvestasi pada desain kapal yang canggih, peningkatan infrastruktur, dan doktrin strategis untuk memproyeksikan pengaruh di seluruh lautan Asia."
 RAJ_rashtriya_swayamsevak_sangh: "Rashtriya Swayamsevak Sangh"
 RAJ_rashtriya_swayamsevak_sangh_desc: "Kami akan mengorganisir generasi muda menjadi kekuatan yang disiplin, siap membela negara kami dan menjunjung tinggi nilai-nilai Hindutva dengan cara apa pun."
 RAJ_the_hindu_martial_tradition: "Tradisi Bela Diri Hindu"
 RAJ_the_hindu_martial_tradition_desc: "Dari pejuang Shivaji hingga pembela dharma, kami akan menghidupkan kembali semangat bela diri kuno kami dan mempersiapkan rakyat kami untuk pertempuran di masa depan."
 RAJ_cultural_reawekening: "Kebangkitan Kembali Budaya"
 RAJ_cultural_reawekening_desc: "Fajar baru yang penuh dengan seni, bahasa, dan tradisi sudah dekat. Menyatukan bangsa di bawah semangat peradaban kita yang abadi."
 RAJ_mass_production: "Produksi Massal"
 RAJ_mass_production_desc: "Kami akan mendapatkan peralatan dari perusahaan swasta yang memberikan biaya terendah. Menekan biaya peralatan adalah kunci pertumbuhan."
 RAJ_deathknell_to_the_raj: "Lonceng kematian Raj"
 RAJ_deathknell_to_the_raj_desc: "Kita telah mengikis sisa-sisa Raj dengan mengambil lebih banyak kendali atas tanah mereka. Sudah waktunya untuk mengakhiri sandiwara ini dan menuntut untuk mengambil kendali penuh atas benua ini."
 RAJ_deathknell_to_the_raj_trigger: "§YRaj§! di bawah aturan §YBritish§! ada"
 RAJ_deathknell_to_the_raj_trigger_tt: "Menganeksasi sisa-sisa Raj"
 RAJ_learn_from_the_crown: "Belajar dari Mahkota"
 RAJ_learn_from_the_crown_desc: "Kita harus belajar dari pengalaman militer Kerajaan yang luas, dengan mengadopsi doktrin-doktrin mereka yang telah terbukti untuk mempersiapkan diri menghadapi tantangan di masa depan."
 RAJ_join_the_shadow_scheme: "Bergabunglah dengan Skema Bayangan"
 RAJ_join_the_shadow_scheme_desc: "Dengan berpartisipasi dalam operasi rahasia, kita dapat memperluas kemampuan intelijen dan memperkuat posisi strategis kita."
 RAJ_colonial_cadet_exchange: "Pertukaran Kadet Kolonial"
 RAJ_colonial_cadet_exchange_desc: "Kami akan mengirimkan kadet kami yang paling cerdas untuk berlatih bersama perwira Inggris, memastikan tentara kami dilengkapi dengan teknik mutakhir."
 RAJ_learn_from_the_secret_intelligence_service: "Belajar dari Badan Intelijen Rahasia"
 RAJ_learn_from_the_secret_intelligence_service_desc: "Dengan bekerja sama dengan Badan Intelijen Rahasia Inggris, kita dapat membangun jaringan spionase yang tangguh untuk melindungi kepentingan kita."
 RAJ_purchase_british_supply_equipment: "Beli Peralatan Pasokan Inggris"
 RAJ_purchase_british_supply_equipment_desc: "Kita harus memperoleh peralatan pasokan Inggris yang canggih untuk memperkuat kekuatan kita dan meningkatkan logistik medan perang."
 RAJ_forming_an_indian_doctrine: "Membentuk Doktrin India"
 RAJ_forming_an_indian_doctrine_desc: "Waktunya telah tiba untuk menempa jalan kita sendiri. Kami akan mengembangkan doktrin India yang mencerminkan kekuatan dan aspirasi unik kami."
 RAJ_model_after_germany: "Model Setelah Jerman"
 RAJ_model_after_germany_desc: "Kita dapat meniru doktrin militer Jerman yang disiplin dan efisien untuk mengubah kekuatan kita menjadi mesin perang modern."
 RAJ_model_after_usa: "Model Setelah AS"
 RAJ_model_after_usa_desc: "Dengan mempelajari strategi militer Amerika, kita dapat memodernisasi angkatan bersenjata kita dengan fokus pada fleksibilitas dan inovasi teknologi."
 RAJ_model_after_soviet: "Model Setelah Uni Soviet"
 RAJ_model_after_soviet_desc: "Penekanan Uni Soviet pada mobilisasi massa dan taktik revolusioner memberikan cetak biru bagi evolusi militer kita."
 RAJ_automating_the_army: "Mengotomatiskan Angkatan Darat"
 RAJ_automating_the_army_desc: "Kami akan memprioritaskan mekanisasi dan divisi lapis baja yang canggih, membuka jalan bagi angkatan bersenjata yang sepenuhnya dimodernisasi."
 RAJ_for_the_people_by_the_people: "Untuk Rakyat, Oleh Rakyat"
 RAJ_for_the_people_by_the_people_desc: "Fokus kami adalah memperkuat divisi infanteri, artileri, dan pendukung untuk membangun tentara yang benar-benar berakar pada keinginan rakyat."
 RAJ_five_year_plan: "Rencana Lima Tahun"
 RAJ_five_year_plan_desc: "Negara komunis mana pun memerlukan rencana lima tahun! Kita harus mulai mengembangkan industri kita agar industri [RAJ.GetNameDefCap] bisa berkembang!"
 RAJ_five_year_plan_flag: "Telah menyelesaikan fokus §YRencana Lima Tahun§!"
 RAJ_five_year_plan_tt: "Menyelesaikan §YSosialisme Agraria§! atau §YIndustrialisme Perkotaan§! akan mengubah Rencana Lima Tahun"
 RAJ_five_year_plan_when_removed_tt: "Hari-hari saat ini adalah: [?RAJ_five_year_plan_flag:days|Y0]"
 RAJ_five_year_plan_modify_tt: "Memodifikasi §YRencana Lima Tahun§! dengan:"
 RAJ_soviet_influence: "Pengaruh Soviet"
 RAJ_soviet_influence_desc: "Uni Soviet berdiri sebagai model transformasi revolusioner. Dengan merangkul panduan ideologis dan kerangka kelembagaan mereka, kita dapat memetakan jalur serupa untuk [RAJ.GetName]"
 RAJ_indian_socialism: "Sosialisme India"
 RAJ_indian_socialism_desc: "Daripada mencari inspirasi dari kekuatan besar sosialis, kami akan menciptakan doktrin sosialis kami sendiri yang disesuaikan dengan kebutuhan [RAJ.GetNameDefCap]."
 RAJ_soviet_indian_industrial_cooperation: "Kerja Sama Industri Soviet-India"
 RAJ_soviet_indian_industrial_cooperation_desc: "Untuk mempercepat transformasi ekonomi, kami akan menjalin kemitraan industri dengan [SOU.GetNameDefCap]. Keahlian teknis dan pengalaman mereka dalam pembangunan terpusat akan berperan penting dalam membangun ekonomi sosialis yang disesuaikan dengan kebutuhan kita."
 RAJ_indian_national_highways: "Jalan Raya Nasional India"
 RAJ_indian_national_highways_desc: "Untuk mengembangkan Industri [RAJ.GetNameDefCap] kita harus memulai dari dasar dengan jalur pasokan kita."
 RAJ_expand_industry_in_hyderabad: "Perluas Industri di Hyderabad"
 RAJ_expand_industry_in_hyderabad_desc: "Memperluas pabrik di Hyderabad akan sangat meningkatkan kapasitas industri kita tanpa memerlukan banyak investasi."
 RAJ_continue_the_five_year_plan: "Lanjutkan Rencana Lima Tahun"
 RAJ_continue_the_five_year_plan_desc: "Dengan berakhirnya tahun pertama Rencana Lima Tahun, sekarang saatnya untuk melihat ke belakang dan melihat seberapa besar kemajuan yang telah kita capai sejauh ini, dan kita harus menerapkan pembelajaran yang telah kita peroleh dalam empat tahun ke depan."
 RAJ_continue_the_five_year_plan_tt: "Akan mengalikan semua pengubah dalam §YRencana lima tahun§! kami dengan §G+30%§!"
 RAJ_nationalize_tata_group: "Nasionalisasi Tata Group"
 RAJ_nationalize_tata_group_desc: "Kita harus berhenti bergantung pada Tata Group untuk perekonomian kita. Sudah saatnya kita mengambil alih dan menasionalisasi perusahaan tersebut."
 RAJ_focus_on_military_industry: "Fokus pada Industri Militer"
 RAJ_focus_on_military_industry_desc: "Kita harus memprioritaskan keselamatan negara kita di atas segalanya, kita harus memprioritaskan perluasan militer kita untuk menjamin kelangsungan hidup kita."
 RAJ_nationalize_gun_carriage_agency: "Nasionalisasi Badan Pengangkut Senjata"
 RAJ_nationalize_gun_carriage_agency_desc: "Badan Pengangkut Senjata adalah salah satu sumber utama persenjataan kita, kekuasaan seperti ini tidak bisa diserahkan kepada perusahaan swasta, melainkan harus dinasionalisasi."
 RAJ_eastern_shipyard_construction: "Konstruksi Galangan Kapal Timur"
 RAJ_eastern_shipyard_construction_desc: "Untuk mendukung pertumbuhan kekuatan angkatan laut modern, kami akan memperluas kapasitas pembuatan kapal di sepanjang pantai timur. Galangan kapal baru ini akan menjadi tulang punggung ambisi maritim kita."
 RAJ_colonial_cadet_exchange_tt: "Saat dihapus:"
 RAJ_form_ties_with_leftist_parties: "Bentuk Hubungan dengan Partai Kiri"
 RAJ_form_ties_with_leftist_parties_desc: "Kita perlu mengumpulkan dukungan dari kaum sosialis dan komunis di negara ini."
 india: "India"
 indian: "India"
 pakistan: "Pakistan"
 pakistani: "Pakistan"
 bangladesh: "Bangladesh"
 bangladeshi: "Bangladesh"
 tech_recon_focus_bonus_tt: "£GFX_unit_recon_icon_small $category_recon$\nPengintaian: §G+200%§!"
 RAJ_relax_agrarian_society_criteria_tt: "Akan memodifikasi §Y$idea_RAJ_agrarian_society$§!\n§YPerubahan Efektif:§!"
 mountain_tanks_tt: "Mengaktifkan §YTangki Gunung§!\n§YSemua Divisi Tangki (Pegunungan)§!:\nSerangan §G+15%§!\nPergerakan: §G+15%§!"
 RAJ_secular_rule_alt: "Warisan Timurid"
 RAJ_secular_rule_alt_desc: "Waktunya telah tiba untuk merebut kembali jantung leluhur kita, menempa era baru dari pegunungan yang melahirkan dinasti kita. Dengan menempatkan kekaisaran di jantung Afghanistan yang terjal, kami mengamankan kekuasaan kami dan memulihkan fondasi pemerintahan kekaisaran."
 RAJ_theocratic_rule_alt: "Warisan Mongol"
 RAJ_theocratic_rule_alt_desc: "Kita adalah pewaris para penakluk, pewaris sebuah kerajaan yang pernah mengguncang dunia. Untuk menghormati warisan Mongol, kita harus menjalin persatuan melalui kekuatan, membawa anak benua India di bawah kekuasaan kita sebagai satu bangsa, tidak terikat oleh keyakinan atau asal usul, namun oleh kesetiaan kepada takhta. Di hadapan kekuatan kekaisaran, semua orang harus berlutut."
 RAJ_secret_weapons: "Kembalikan Kehebatan Ilmiah Kita"
 RAJ_secret_weapons_desc: "Kita akan sekali lagi menjadikan diri kita sebagai pemimpin dunia dalam pengembangan roket dan memanfaatkannya untuk menghancurkan musuh-musuh kita."
 RAJ_his_majestys_loyal_government: "Pemerintahan Setia Yang Mulia"
 RAJ_his_majestys_loyal_government_desc: "Meskipun seruan kemerdekaan semakin nyaring di jalanan, mesin [ROOT.GetName] tetap teguh. Diperintah oleh Raja Muda yang ditunjuk oleh Yang Mulia dan didukung oleh Dinas Sipil India, kami akan menjalankan kepentingan Kerajaan dengan disiplin dan tekad."
 RAJ_the_government_of_india_act: "Undang-undang Pemerintah India"
 RAJ_the_government_of_india_act_desc: "Undang-undang Pemerintah India telah membuka pintu bagi pemerintahan mandiri yang lebih besar di provinsi-provinsi kami. Dengan mendelegasikan wewenang yang lebih besar kepada kementerian-kementerian lokal, kita dapat meredakan suara-suara moderat dan memperkuat efisiensi administratif, sambil menjaga kekuasaan Kekaisaran tetap memegang kendali."
 RAJ_work_with_local_leaders: "Bekerja Dengan Pemimpin Lokal"
 RAJ_work_with_local_leaders_desc: "Dengan bekerja sama dengan tokoh-tokoh provinsi yang berpengaruh, kami dapat memperluas jangkauan kami tanpa menghabiskan sumber daya secara berlebihan. Para pemimpin ini memahami kebutuhan daerahnya dan dapat menerapkan perbaikan yang bermanfaat bagi rakyatnya dan kepentingan Kerajaan."
 RAJ_concessions_to_the_industrialists: "Konsesi kepada Kaum Industrialis"
 RAJ_concessions_to_the_industrialists_desc: "Untuk menstimulasi pembangunan tanpa menguras anggaran negara, kami akan menawarkan persyaratan yang menguntungkan bagi para industrialis yang ingin berinvestasi dalam pertumbuhan regional. Sebagai imbalan atas konsesi yang sederhana, para pemimpin lokal akan mendapatkan loyalitas melalui kemakmuran."
 RAJ_empower_provincial_authorities: "Memberdayakan Otoritas Provinsi"
 RAJ_empower_provincial_authorities_desc: "Daripada mengejar kepentingan swasta, kita akan memperkuat kewenangan administratif pemerintah daerah untuk mengawasi pembangunan secara langsung. Dengan mempercayakan keputusan investasi kepada pemerintah provinsi, kami memastikan kesetiaan dihargai dengan tanggung jawab."
 RAJ_confer_with_the_congress: "Berunding dengan Kongres"
 RAJ_confer_with_the_congress_desc: "Meskipun banyak orang di pemerintahan lebih memilih diam, mengabaikan gerakan kemerdekaan justru berisiko menimbulkan kerusuhan yang lebih besar. Dengan memenuhi tuntutan tertentu, kita dapat menenangkan emosi dan meningkatkan stabilitas internal."
 RAJ_favor_the_muslim_league: "Mendukung Liga Muslim"
 RAJ_favor_the_muslim_league_desc: "Dengan memberikan pengakuan dan dukungan politik yang lebih besar kepada Liga Muslim, kita dapat mengembangkan kekuatan penyeimbang terhadap gerakan nasionalis yang dominan. Memberdayakan mereka akan menimbulkan perselisihan yang bermanfaat di antara mereka yang ingin berbicara mewakili seluruh India. Dalam kesatuan, ada kekuatan; dalam perpecahan, politik yang bisa diatur."
 RAJ_the_indian_parliament: "Parlemen India"
 RAJ_the_indian_parliament_desc: "Dengan meningkatnya tuntutan akan pemerintahan sendiri, kita akan membentuk Parlemen India untuk mengambil alih kekuasaan sipil dari Raja Muda. Transisi ini akan memberikan otonomi nyata kepada kepemimpinan pribumi, tentu saja dalam kerangka Kekaisaran."
 RAJ_court_the_princes: "Dekati para Pangeran"
 RAJ_court_the_princes_desc: "Negara-negara pangeran telah lama berdiri sebagai pilar kesetiaan dan ketertiban di benua tersebut. Dengan menegaskan kembali hak-hak istimewa mereka dan melibatkan mereka secara lebih langsung dalam pemerintahan, kita memperkuat fondasi kekaisaran melawan meningkatnya agitasi populis."
 RAJ_the_integrity_of_india_act: "Undang-Undang Integritas India"
 RAJ_the_integrity_of_india_act_desc: "Untuk melawan ancaman penghasutan yang semakin besar dan mempertahankan otoritas kekaisaran, kami akan memberlakukan Undang-Undang Integritas India. Undang-undang ini memberdayakan kita untuk menahan para penghasut, membatasi perbedaan pendapat politik, dan memastikan pemerintahan yang loyal di seluruh benua. Bagaimanapun juga, persatuan terkadang harus ditegakkan."
 RAJ_princely_state_donations_GOE: "Sumbangan Negara Pangeran"
 RAJ_princely_state_donations_GOE_desc: "$RAJ_princely_state_donations_desc$"
 RAJ_the_jewel_becomes_the_crown: "Permata Menjadi Mahkota"
 RAJ_the_jewel_becomes_the_crown_desc: "Dengan jatuhnya ibu pertiwi, kini terserah pada kita untuk memikul beban kepemimpinan dalam keluarga kekaisaran. Dengan semangat baru, kami akan memanfaatkan sumber daya [ROOT.GetNameDef] yang luas untuk membebaskan jantung Kekaisaran dan menghancurkan semua orang yang berani menodai tanah hijau dan indahnya."
 RAJ_the_punjab_accord: "Kesepakatan Punjab"
 RAJ_the_punjab_accord_desc: "Dengan mengakui posisi unik komunitas Sikh dan memberikan otonomi terbatas di Punjab, kita akan memperkuat ikatan kesetiaan dan pelayanan yang telah lama ada. Sebagai imbalannya, dukungan berkelanjutan mereka akan memperkuat otoritas [ROOT.GetNameDef] di wilayah yang sangat penting dan memastikan bahwa tradisi dan stabilitas berjalan beriringan."
 RAJ_the_dominion_of_india: "Dominasi India"
 RAJ_the_dominion_of_india_desc: "Dengan tegaknya kembali ketertiban di anak benua ini, sekarang saatnya kita mengambil tempat di antara saudara-saudara kekaisaran kita sebagai wilayah kekuasaan Kekaisaran yang setia dan memiliki pemerintahan sendiri.\nHidup Raja!"
 RAJ_curtail_the_zamindars: "Batasi Zamindar"
 RAJ_curtail_the_zamindars_desc: "Pengaruh yang mengakar dari tuan tanah di pedesaan telah lama menghambat upaya untuk memodernisasi pemerintahan dan memaksimalkan potensi [ROOT.GetNameDef]. Dengan mengalihkan kekuasaan dan sumber daya administratif ke pejabat yang berdasarkan prestasi dan lembaga yang lebih akuntabel, kita dapat melemahkan cengkeraman mereka sekaligus memperkuat fondasi negara yang lebih responsif."
 RAJ_raise_import_duties: "Menaikkan Bea Masuk"
 RAJ_raise_import_duties_desc: "Untuk mengurangi ketergantungan ekonomi dan mendorong pertumbuhan dalam negeri, kita akan menerapkan bea masuk yang lebih tinggi terhadap barang-barang luar negeri. Kebijakan ini akan melindungi industri lokal, mempertahankan modal di dalam negeri, dan memastikan bahwa [ROOT.GetNameDef] dapat berdiri sendiri."
 RAJ_imperial_industry_initiative: "Inisiatif Industri Kekaisaran"
 RAJ_imperial_industry_initiative_desc: "Untuk mengamankan posisi [ROOT.GetNameDef] sebagai pilar Kerajaan, kita harus berkomitmen terhadap perluasan industri perkotaan secara besar-besaran. Inisiatif Industri Kekaisaran akan menyalurkan sumber daya ke sektor manufaktur berat dan tenaga kerja terampil, sehingga memastikan kota-kota kita menjadi mesin ketahanan dan pembaruan di benua ini."
 RAJ_rural_development_plan: "Rencana Pembangunan Pedesaan"
 RAJ_rural_development_plan_desc: "Dengan berlangsungnya reformasi pertanian, kita sekarang harus membawa industri ke pedesaan. Mekanisasi, proyek infrastruktur pedesaan, dan manufaktur skala kecil akan mengubah desa menjadi mesin produksi."
 RAJ_the_great_recovery: "Pemulihan Hebat"
 RAJ_the_great_recovery_desc: "Dampak Depresi Besar masih melekat pada perekonomian kita, memperlambat kemajuan dan melemahkan kepercayaan. Namun kini, dengan stabilitas dan visi yang diperbarui, kita akan menghilangkan beban stagnasi. Ini bukan sekedar kembalinya keadaan normal, ini adalah awal dari babak baru untuk [ROOT.GetNameDef]."
 RAJ_reform_the_agricultural_sector: "Reformasi Sektor Pertanian"
 RAJ_reform_the_agricultural_sector_desc: "Penggunaan lahan yang tidak efisien selama beberapa dekade dan praktik-praktik yang sudah ketinggalan zaman telah membuat sektor pertanian [ROOT.GetNameDef] rentan terhadap gangguan. Melalui reformasi yang ditargetkan, investasi di bidang infrastruktur, dan teknik modern, kita dapat meningkatkan hasil panen dan menciptakan pasokan pangan yang lebih tangguh."
 RAJ_expand_the_zamindari_system: "Perluas Sistem Zamindari"
 RAJ_expand_the_zamindari_system_desc: "Sistem Zamindari telah lama memberikan kerangka kerja yang dapat diandalkan untuk tata kelola pedesaan dan pengumpulan pendapatan. Dengan memperluas jangkauannya dan menegaskan kembali hak-hak istimewa tuan tanah yang setia, kita dapat memastikan ketertiban lokal dan efisiensi administratif tanpa membebani pemerintah pusat secara berlebihan."
 RAJ_crown_commodities: "Komoditas Mahkota"
 RAJ_crown_commodities_desc: "Dengan memprioritaskan penanaman tanaman komersial yang berorientasi ekspor, kita dapat mengamankan aliran pendapatan yang stabil dan memperkuat kepentingan ekonomi kita bagi Kekaisaran. Teh, kapas, rami, dan bahan pokok perdagangan kolonial lainnya akan menjadi tulang punggung kemakmuran di pedesaan."
 RAJ_rural_mechanization_program: "Program Mekanisasi Pedesaan"
 RAJ_rural_mechanization_program_desc: "Untuk meningkatkan hasil pertanian dan mengurangi ketergantungan pada metode tenaga kerja yang sudah ketinggalan zaman, kami akan menerapkan program terstruktur untuk memperkenalkan pertanian mekanisasi di pedesaan. Traktor, mesin perontok, dan sistem irigasi akan mengubah produktivitas pedesaan dan menjadi landasan bagi perekonomian modern yang mandiri."
 RAJ_the_riches_of_the_raj: "Kekayaan Raj"
 RAJ_the_riches_of_the_raj_desc: "Di bawah dataran luas dan perbukitan terjal [ROOT.GetNameDef] terdapat sumber daya yang dibutuhkan untuk memberi kekuatan pada kerajaan yang sedang berperang. Baja, minyak, dan bahan penting lainnya akan diekstraksi, dimurnikan, dan digunakan untuk pertahanan wilayah tersebut."
 RAJ_strengthen_ties_with_british_investors_GOE: "Perkuat Hubungan dengan Investor Inggris"
 RAJ_strengthen_ties_with_british_investors_GOE_desc: "$RAJ_strengthen_ties_with_british_investors_desc$"
 RAJ_imperial_rail_renewal_act: "Undang-Undang Pembaruan Kereta Kekaisaran"
 RAJ_imperial_rail_renewal_act_desc: "Untuk memastikan pergerakan cepat barang, pasukan, dan perbekalan di seluruh benua ini, kami akan berinvestasi dalam perbaikan menyeluruh infrastruktur kereta api [ROOT.GetNameDef]. Undang-Undang Pembaruan Kereta Api Kekaisaran akan memodernisasi jalur-jalur yang menua, memperluas kapasitas logistik, dan menyatukan wilayah kita yang luas dengan baja dan uap."
 RAJ_exploit_the_frontier: "Eksploitasi Perbatasan"
 RAJ_exploit_the_frontier_desc: "Cadangan sumber daya yang sangat besar terletak di daerah-daerah terpencil dan kurang dimanfaatkan di benua ini dan sekitarnya. Dengan memperluas operasi dan menegaskan kendali yang lebih besar atas wilayah seperti [BRM.GetNonIdeologyName], kita dapat mengamankan material penting seperti tungsten dan menjadi bahan bakar mesin perang kita yang terus berkembang."
 RAJ_overlords_railway_investment: "[ROOT.OVERLORD.GetAdjective] Investasi Kereta Api"
 RAJ_overlords_railway_investment_desc: "Dengan landasan yang diletakkan untuk sistem kereta api modern, kami akan mengundang investasi dari kepentingan industri dan keuangan [ROOT.OVERLORD.GetAdjective] untuk lebih memperluas dan menyempurnakan jaringan. Modal mereka, dipadukan dengan infrastruktur kita yang berkembang, akan menciptakan sistem kereta api yang sesuai dengan Kekaisaran."
 RAJ_territorial_development_scheme: "Skema Pembangunan Teritorial"
 RAJ_territorial_development_scheme_desc: "Untuk sepenuhnya memanfaatkan potensi ekonomi [ROOT.GetNameDef], kita harus menilai kembali bagaimana lahan dialokasikan dan dimanfaatkan. Skema Pembangunan Teritorial akan mengidentifikasi daerah-daerah tertinggal, menghilangkan hambatan pertumbuhan, dan mempersiapkan zona-zona baru untuk perluasan industri."
 RAJ_the_empires_workshop: "Lokakarya Kekaisaran"
 RAJ_the_empires_workshop_desc: "Untuk memastikan kekuatan Kekaisaran dalam menghadapi meningkatnya permintaan global, kami akan memperdalam hubungan ekonomi antara [ROOT.GetNameDef] dan [ROOT.OVERLORD.GetNameDef]. Investasi yang terkoordinasi dan perluasan pabrik di kedua wilayah akan mengubah basis industri kita bersama menjadi satu mesin produksi yang terpadu."
 RAJ_institute_of_fundamental_research_GOE: "Institut Penelitian Fundamental"
 RAJ_institute_of_fundamental_research_GOE_desc: "Dengan dukungan dari para industrialis dan pemikir ilmiah terkemuka, kami akan mendirikan Institut Penelitian Fundamental untuk melanjutkan studi teoretis tingkat lanjut. Lembaga ini akan berfungsi sebagai inti eksperimen mutakhir, termasuk studi energi atom."
 RAJ_keep_calm_and_carry_on: "Tetap Tenang dan Lanjutkan"
 RAJ_keep_calm_and_carry_on_desc: "Di saat yang paling sulit ini, kita tidak akan goyah. [ROOT.GetNameDefCap] akan bangkit sebagai benteng kekuatan, menempa alat perang dengan tekad yang tak kenal lelah. Biarkan tungku menyala dan bengkel bernyanyi, karena kemenangan tidak lahir dari kenyamanan, namun dari keberanian, keringat, dan baja."
 RAJ_indian_gentleman_officers: "Perwira Pria India"
 RAJ_indian_gentleman_officers_desc: "Untuk menjamin masa depan dan keamanan Permata Kekaisaran kita yang agung, sangat penting bagi kita untuk mendapatkan orang-orang setia untuk memimpin pasukan [RAJ.GetAdjective] kita yang baru. Orang-orang ini, melalui kerja sama yang erat dengan otoritas Kekaisaran, telah mengabdi dengan cukup baik untuk [RAJ.GetNameDef] sehingga dapat didaftar sebagai komandan kami yang paling tepercaya."
 RAJ_the_aden_protectorate: "Protektorat Aden"
 RAJ_the_aden_protectorate_desc: "Provinsi Aden di semenanjung Arab berada di bawah yurisdiksi kami. Oleh karena itu, sangat penting bagi kita untuk memastikan perlindungannya dalam upaya membuktikan kepada [ENG.GetNameDef] bahwa [RAJ.GetNameDef] mampu membela kepentingan Kerajaan [ENG.GetAdjective] di perairan Timur Tengah."
 RAJ_linlithgows_declaration_of_war: "Deklarasi Perang Linlithgow"
 RAJ_linlithgows_declaration_of_war_desc: "Sebagai bagian dari Kekaisaran [ENG.GetAdjective], adalah tanggung jawab kita untuk memanggul senjata dan bergabung dengan mereka dalam perang. Tidak ada waktu yang terbuang dengan meminta izin kepada Pimpinan Kongres. Seseorang harus memegang tanduk banteng itu. Draf deklarasi dan bersiap untuk perang dengan musuh [ENG.GetNameDef]."
 RAJ_consult_with_congress_leaders: "Konsultasikan Dengan Pemimpin Kongres"
 RAJ_consult_with_congress_leaders_desc: "Daripada memaksa kita untuk bergabung dengan [ENG.GetNameDef] dalam perangnya, kita harus menggunakan jalur resmi untuk melakukannya. Mari kita berkonsultasi dengan Pimpinan Kongres dan memohon kepada mereka dengan harapan mereka akan mengizinkan [RAJ.GetNameDef] untuk ikut berperang."
 RAJ_preemptive_invasion_of_iran: "Invasi Pencegahan ke Iran"
 RAJ_preemptive_invasion_of_iran_desc: "[PER.GetNameDef] berbatasan dengan kita di sebelah barat, dan jika tidak ditangani dengan cepat, mereka dapat memberi musuh kita jalan lurus menuju [RAJ.GetNameDef] melalui Koridor Persia. Invasi seperti itu tentu saja dapat menimbulkan kemarahan dari mereka yang memperjuangkan perdamaian, namun jika kita berhasil, maka ladang minyak [PER.GetNameDef] yang kaya akan menjadi milik kita."
 RAJ_mobilization_of_the_indian_army: "Mobilisasi Angkatan Darat India"
 RAJ_mobilization_of_the_indian_army_desc: "Jumlah kami banyak, dan semangat kami semakin kuat dalam mempertahankan kerajaan kami yang megah. Meskipun mungkin memerlukan waktu untuk menarik pasukan kita dari seluruh penjuru benua ini, sangatlah penting bagi kita untuk memulai mobilisasi tentara [RAJ.GetAdjective]. Saatnya berdiri dan memperjuangkan [RAJ.GetNameDef] dan [ENG.GetNameDef]."
 RAJ_support_naval_invasions: "Mendukung Invasi Angkatan Laut"
 RAJ_support_naval_invasions_desc: "Perang ini tidak hanya dilakukan di darat dan udara, tetapi juga di laut. Sama pentingnya dengan memobilisasi pasukan darat, kita juga harus mempersiapkan angkatan laut untuk mendukung rencana invasi angkatan laut sekutu kita."
 RAJ_assume_eastern_naval_responsibilities: "Asumsikan Tanggung Jawab Angkatan Laut Timur"
 RAJ_assume_eastern_naval_responsibilities_desc: "Tidak ada keraguan dalam benak siapa pun bahwa [JAP.GetNameDef] menimbulkan masalah di timur. Ketika rencana mereka terwujud, menjadi penting bagi kita untuk mempersiapkan angkatan laut kita untuk mempertahankan perairan [RAJ.GetAdjective]. Kita harus memohon kepada Kerajaan dan meminta agar mereka mengirim kapal angkatan laut [ENG.GetAdjective] untuk membantu upaya kita."
 RAJ_south_east_asia_command: "Komando Asia Tenggara"
 RAJ_south_east_asia_command_desc: "Ketika ketegangan meningkat, terdapat peningkatan permintaan akan pusat komando terpusat di Asia Tenggara. Kita bisa menjadi pelopor gerakan semacam itu, membangun basis operasi yang bisa kita gunakan untuk merencanakan kampanye militer kita di benua ini."
 RAJ_desert_training: "Pelatihan Gurun"
 RAJ_desert_training_desc: "Sebagai bagian dari upaya kami untuk meningkatkan keterampilan dan efektivitas pasukan tempur kami, kami dapat membentuk sistem pelatihan di dalam dan sekitar gurun Thar. Hal ini akan membantu pasukan kita menyesuaikan diri dengan lingkungan yang gersang."
 RAJ_fortify_el_alamein: "Membentengi El-Alamein"
 RAJ_fortify_el_alamein_desc: "El-Alamein adalah titik kepentingan strategis dalam hal mempertahankan dan mengamankan Mesir. Kerajaan akan sangat menghargai upaya kami dalam membantu membentengi wilayah ini dan mencegah musuh kami mendapatkan pijakan di [ENG.GetAdjective] Afrika Utara."
 RAJ_jungle_training_GOE: "Pelatihan Hutan"
 RAJ_jungle_training_GOE_desc: "Di lahan seluas milik kita, kita beruntung memiliki keanekaragaman bioma yang besar untuk dimanfaatkan demi keuntungan kita. [RAJ.GetNonIdeologyName], [BRM.GetNonIdeologyName] dan Indochina tercakup dalam hutan, dan pelatihan khusus dianjurkan untuk membuat tentara kita efektif di medan berbahaya ini."
 RAJ_defense_of_malaya: "Pertahanan Malaya"
 RAJ_defense_of_malaya_desc: "[MAL.GetNameDef] dapat menghadapi risiko invasi mengingat posisinya di antara Samudera Hindia dan Pasifik. Sebagai sesama permata mahkota, kita harus melakukan bagian kita untuk membantu mempertahankan dan membentengi wilayah ini. Kita harus mempertahankan kendali atas Asia Tenggara."
 RAJ_hill_training: "Pelatihan Bukit"
 RAJ_hill_training_desc: "Sebagai bagian dari inisiatif kami untuk mendiversifikasi pelatihan yang kami tawarkan kepada pasukan kami, kami harus memastikan bahwa mereka siap berperang di daerah pegunungan, serta di hutan, gurun, dan kota."
 RAJ_defense_of_burma: "Pertahanan Burma"
 RAJ_defense_of_burma_desc: "[BRM.GetNonIdeologyName] Terletak tepat di sebelah timur Benggala, dengan hutannya berfungsi sebagai penghalang alami terakhir untuk melindungi perbatasan [RAJ.GetNonIdeologyName] agar tidak ditembus ancaman dari timur. Sangat penting bagi kita untuk memobilisasi kekuatan pertahanan di wilayah ini, untuk berdiri bahu membahu dengan [BRM.GetAdjective] dan menjaga anak benua India tetap berada di tangan [ENG.GetAdjective]."
 RAJ_holding_the_gates_of_india: "Memegang Gerbang India"
 RAJ_holding_the_gates_of_india_desc: "Apa pun yang terjadi, kita harus melindungi [RAJ.GetNonIdeologyName] dari penjajah yang mengamuk di timur. Mereka mungkin mendatangi kita dengan semangat dan amarah, tapi kita akan menghentikan penaklukan mereka yang tak henti-hentinya di Gerbang [RAJ.GetNonIdeologyName]. Mereka tidak akan lulus."
 RAJ_free_abyssinia: "Bebaskan Abisinia"
 RAJ_free_abyssinia_desc: "Sudah terlalu lama kita membiarkan wilayah Abyssinia tetap berada di tangan musuh. Kami akan menunjukkan nilai kami kepada kerajaan dengan melakukan invasi angkatan laut yang kuat ke Tanduk Afrika melalui Aden, untuk membebaskan rakyatnya dari penjajah."
 RAJ_urban_training: "Pelatihan Perkotaan"
 RAJ_urban_training_desc: "Meskipun kita berharap hal ini tidak terjadi, ada kemungkinan kita harus menahan musuh di jalanan kota-kota besar kita. Kita harus siap untuk mengelola skenario seperti itu dengan pelatihan khusus perkotaan."
 RAJ_the_defense_of_hong_kong: "Pertahanan Hong Kong"
 RAJ_the_defense_of_hong_kong_desc: "Ketika tekanan di [CHI.GetNonIdeologyName] meningkat, kerajaan [ENG.GetAdjective] khawatir tentang nasib kepemilikannya di Hong Kong. Kami berada pada posisi utama untuk membantu melindungi kota dari invasi, dan jika kami berhasil, kami akan mendapatkan bantuan dan persetujuan dari pemerintah [ENG.GetAdjective]."
 RAJ_modify_a_loyal_government_tt: "Ubah §Y$RAJ_a_loyal_government$§! dengan:"
 RAJ_modify_south_east_asia_command_dm_tt: "Ubah §Y$RAJ_south_east_asia_command_dm$§! dengan:"
 RAJ_the_government_of_india_act_pp_bonus_tt: "Ubah §Y$RAJ_a_loyal_government$§! sebanyak [?RAJ_the_government_of_india_act_pp_bonus_based_on_compliance|+=%%0] $MODIFIER_POLITICAL_POWER_FACTOR$ per status awal dengan Kepatuhan lebih dari §Y74%§!."
 current_states_granting_bonus_tt: "Negara bagian saat ini yang memberikan bonus:"
 no_state_meet_requirements_tt: "(Tidak ada negara bagian yang memenuhi persyaratan saat ini)"
 RAJ_stop_unrest_events_tt: "§GTidak akan ada lagi kejadian Kerusuhan.§!"
