l_braz_por:
  ############
  #####RAJ####
  ############
 RAJ_take_over_administrative_rights: "Pengambilalihan Hak Administratif"
 RAJ_take_over_administrative_rights_desc: "Untuk menarik diri dari wilayah tersebut dengan baik, pemerintah [ENG.GetAdjective] telah mulai mengalihkan tugas administratif kepada pegawai perusahaan kami."
 RAJ_the_return_of_the_east_india_company: "Kembalinya Perusahaan India Timur"
 RAJ_the_return_of_the_east_india_company_desc: "Setelah beberapa dekade absen, East India Company akan didirikan kembali untuk mengeksploitasi anak benua India sepenuhnya melalui efisiensi yang kejam."
 RAJ_the_return_of_the_east_india_company_tt: "Skema Investasi dan Pajak India Timur sekarang aktif.\nMembuka §Ykeputusan§! untuk membayar dividen kepada investor"
 RAJ_privatized_tutelage: "Pengawasan yang Diprivatisasi"
 RAJ_privatized_tutelage_desc: "Pendidikan harus diperuntukkan bagi mereka yang layak mendapatkannya dengan mempertahankan sistem sekolah dan perguruan tinggi yang diprivatisasi secara ketat, bebas dari kekacauan."
 RAJ_vertical_integration: "Integrasi Vertikal"
 RAJ_vertical_integration_desc: "Skema penghindaran pajak baru-baru ini relatif tidak diperhatikan oleh pemerintah di luar negeri. Mungkin kita bisa memanfaatkan lebih banyak celah untuk mengurangi pajak kita lebih jauh lagi."
 RAJ_acquire_new_resources: "Dapatkan Sumber Daya Baru"
 RAJ_acquire_new_resources_desc: "Industri kita membutuhkan pasokan sumber daya yang semakin meningkat untuk memenuhi permintaan barang. Oleh karena itu, kami akan mempekerjakan massa pengangguran di fasilitas pemrosesan sumber daya baru di seluruh wilayah kepemilikan kami."
 RAJ_corporate_expansion: "Ekspansi Perusahaan"
 RAJ_corporate_expansion_desc: "Pertumbuhan ekonomi dalam portofolio inti kami telah menyebabkan peningkatan jumlah penduduk. Untuk memastikan pertumbuhan yang berkelanjutan, kami akan memperluas infrastruktur untuk mengakomodasi karyawan masa depan kami."
 RAJ_trade_federation_of_india: "Perubahan merek"
 RAJ_trade_federation_of_india_desc: "Kami telah mencapai pertumbuhan bersejarah dalam beberapa tahun terakhir dan mencapai tingkat kekuatan politik yang hanya dapat diimpikan oleh sebagian besar perusahaan. Namun, beberapa negara bagian di bawah kendali kami masih tidak sependapat dengan peraturan perusahaan, mungkin gelombang besar kompensasi moneter dapat membujuk mereka?"
 RAJ_trade_federation_of_india_tt: "Membuka keputusan bagi negara bagian inti yang memiliki kepatuhan tinggi menggunakan §YFaktor Pabrik Barang Konsumsi§! dan §YKekuatan Politik§!."
 RAJ_the_varuna_class: "Kelas Varuna"
 RAJ_the_varuna_class_desc: "Kapal modal terbaru kami merupakan prestasi teknik yang luar biasa. Oleh karena itu, satu-satunya nama yang cocok untuk wadah ini adalah nama dewa."
 RAJ_purchase_destroyers_and_subs: "Beli Kapal Perusak dan Kapal Selam"
 RAJ_purchase_destroyers_and_subs_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 RAJ_purchase_cruisers_and_dreadnoughts: "Beli Kapal Penjelajah dan Kapal Penempur"
 RAJ_purchase_cruisers_and_dreadnoughts_desc: "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_mineral_exploitation_institute: "Institut Eksploitasi Mineral"
 RAJ_mineral_exploitation_institute_desc: "Perkembangan pertambangan akhir-akhir ini belum mencapai hasil yang diharapkan. Tampaknya kita perlu berinvestasi dalam survei geologi yang lebih baik agar dapat mengukur potensi pendapatan dari sumber daya alam kita dengan lebih akurat."
 RAJ_establish_the_reserve_bank_of_india: "Mendirikan Reserve Bank Of India"
 RAJ_establish_the_reserve_bank_of_india_desc: "Untuk cukup melindungi perekonomian kita dari gelombang kejut, kita akan membentuk bank cadangan yang mempunyai kewenangan untuk mengendalikan mata uang kita."
 #RAJ_separate_electorates: "Separate Electorates"
 #RAJ_demand_free_votes: "Demand Free Votes"
 RAJ_all_india_kisan_sabha: "Seluruh India Kisan Sabha"
 RAJ_all_india_kisan_sabha_desc: "Petani dan petani di pedesaan India sudah cukup lama dieksploitasi. Waktunya telah tiba bagi mereka untuk berorganisasi dan menyuarakan keluhan mereka secara kolektif."
 RAJ_haripura_session_of_the_indian_national_congress: "Sidang Haripura Kedua"
 RAJ_haripura_session_of_the_indian_national_congress_desc: "Dengan kapitalisme yang memicu ketegangan global, sudah waktunya untuk mengubah Swaraj menjadi perjuangan buruh dan tani. Sidang Haripura Kedua akan menyatukan kita di bawah visi revolusioner, menolak aliansi imperialis dan mendukung perjuangan demi India yang mandiri dan tanpa kelas."
 RAJ_the_second_gorkha_war: "Perang Gorkha Kedua"
 RAJ_the_second_gorkha_war_desc: "Kemerdekaan Nepal adalah peninggalan masa lalu, yang membagi apa yang seharusnya menjadi anak benua yang bersatu. Sebuah kampanye yang menentukan akan membawa Gorkha ke dalam kelompoknya, mengamankan Himalaya."
 RAJ_guarantee_nepalese_independence: "Menjamin Kemerdekaan Nepal"
 RAJ_guarantee_nepalese_independence_desc: "Kedaulatan Nepal merupakan simbol ketahanan terhadap dominasi kekaisaran. Dengan menjamin kemerdekaannya, kami melindungi Himalaya dan memastikan adanya sekutu yang kuat dalam perjuangan kami melawan pengaruh asing di wilayah tersebut."
 RAJ_ignite_the_sino_indian_war: "Menyalakan Perang Sino-India"
 RAJ_ignite_the_sino_indian_war_desc: "Ketegangan yang meningkat dengan Tiongkok terkait sengketa perbatasan tidak bisa lagi diabaikan. Dengan mengambil tindakan tegas, kami menegaskan dominasi kami di Himalaya dan mengamankan wilayah yang menjadi hak kami. Serangan yang berani saat ini dapat membentuk kembali keseimbangan kekuatan di Asia dan menguntungkan kita."
 RAJ_national_planning_committee: "Komite Perencanaan Nasional"
 RAJ_national_planning_committee_desc: "Kemandirian ekonomi adalah landasan kemandirian sejati. Dengan membentuk Komite Perencanaan Nasional, kita dapat memetakan arah industrialisasi, pembangunan pedesaan, dan pertumbuhan yang adil. Rencana terpadu akan mengubah India menjadi negara modern dan mandiri."
 RAJ_promote_violence_against_the_british: "Mempromosikan Kekerasan Terhadap Inggris"
 RAJ_promote_violence_against_the_british_desc: "Waktu untuk protes damai telah berlalu. Untuk menghancurkan rantai penindasan kekaisaran, kita harus mengambil tindakan langsung. Perlawanan yang terkoordinasi akan melemahkan kendali Inggris dan menginspirasi massa untuk bangkit melawan tirani."
 RAJ_rally_the_indian_left: "Reli Kaum Kiri India"
 RAJ_rally_the_indian_left_desc: "Kelompok sayap kiri yang terfragmentasi harus bersatu untuk memimpin perjuangan demi hak-hak pekerja dan kemerdekaan sejati. Dengan menggalang kekuatan sosialis dan komunis di bawah satu bendera, kita dapat membentuk front yang kuat untuk menantang imperialisme dan kapitalisme."
 RAJ_forward_bloc: "Blok Maju"
 RAJ_forward_bloc_desc: "Blok Depan mewakili visi yang berani untuk masa depan India—visi yang menolak kompromi dan menganut tindakan revolusioner. Dengan menyatukan semua kekuatan anti-imperialis, kita dapat mempercepat perjuangan untuk mencapai kemerdekaan penuh dan meletakkan dasar bagi India yang lebih kuat dan radikal."
 RAJ_give_me_blood_and_i_will_grant_you_freedom: "Beri Aku Darah Dan Aku Akan Memberimu Kebebasan"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc: "Jalan menuju kemerdekaan diawali dengan perjuangan dan pengorbanan. Dengan menggalang keberanian untuk memperjuangkan tujuan kita, kita dapat menginspirasi sebuah gerakan yang cukup kuat untuk memutus rantai pemerintahan kolonial. Kemenangan akan datang kepada mereka yang bersedia membayar harganya."
 RAJ_rani_of_jhansi_regiment: "Rani Dari Resimen Jhansi"
 RAJ_rani_of_jhansi_regiment_desc: "Terinspirasi oleh keberanian Rani dari Jhansi, kita akan membentuk resimen yang seluruhnya perempuan untuk melawan penindasan. Dengan memberdayakan para pejuang pemberani ini, kita akan memberikan pukulan telak terhadap pemerintahan kolonial dan mendefinisikan kembali peran perempuan dalam perjuangan kemerdekaan."
 RAJ_azad_hind_dlc: "Azad Hind"
 RAJ_azad_hind_dlc_desc: "Azad Hind mewakili puncak perjuangan kami untuk pembebasan—sebuah pemerintahan di pengasingan yang didedikasikan untuk mengakhiri kekuasaan Inggris. Dengan kekuatan yang dimobilisasi dan visinya yang jelas, mereka siap memimpin India menuju kebebasan melalui kekuatan dan tekad."
 RAJ_azad_hind_dlc_radio: "Radio Azad Hind"
 RAJ_azad_hind_dlc_radio_desc: "Untuk menyebarkan pesan pembebasan, kita harus mendirikan Radio Azad Hind. Siaran revolusioner ini akan membawa seruan kami untuk kebebasan melintasi batas negara, menyatukan para patriot dan memicu perjuangan melawan penindasan kolonial. Perjuangan ini membutuhkan suara, dan ini akan menjadi suara kita."
 RAJ_azad_hind_dlc_bank: "Bank Azad Hind"
 RAJ_azad_hind_dlc_bank_desc: "Sebuah revolusi membutuhkan sumber daya. Dengan mendirikan Azad Hind Bank, kami menciptakan lembaga keuangan yang didedikasikan untuk mendukung perjuangan kemerdekaan. Hal ini akan memobilisasi dana, memberdayakan para patriot, dan meletakkan landasan ekonomi bagi India yang merdeka."
 RAJ_seek_japanese_support: "Carilah Dukungan Jepang"
 RAJ_seek_japanese_support_desc: "Musuh dari musuh kita bisa menjadi sekutu terkuat kita. Dengan mencari dukungan Jepang, kita dapat memperoleh akses terhadap sumber daya, pelatihan, dan tenaga untuk menantang pemerintahan Inggris. Meskipun jalur ini penuh dengan risiko, aliansi semacam ini dapat memberikan keuntungan bagi kita."
 RAJ_the_enemy_of_my_enemy: "Musuh dari Musuhku"
 RAJ_the_enemy_of_my_enemy_desc: "Dalam perjuangan kemerdekaan, aliansi dibentuk karena adanya kebutuhan. Dengan berkolaborasi dengan pihak-pihak yang menentang Inggris, kita dapat melemahkan cengkeraman mereka atas tanah kita. Kebebasan mungkin memerlukan kemitraan yang tidak mungkin terjadi, namun kemenangan adalah yang terpenting."
 RAJ_shaheed_and_swaraj: "Shaheed dan Swaraj"
 RAJ_shaheed_and_swaraj_desc: "Pengorbanan para martir kita mengilhami upaya tanpa henti untuk mencapai Swaraj. Darah mereka menjadi bahan bakar revolusi kita, mengingatkan kita bahwa kemerdekaan tidak diberikan, melainkan diambil. Biarkan ingatan mereka memperkuat tekad kita untuk mencapai India yang bebas dan berdaulat."
 RAJ_azad_hind_radio: "Radio Azad Hind"
 RAJ_azad_hind_radio_desc: "$RAJ_azad_hind_dlc_radio_desc$"
 RAJ_seek_international_recognition: "Mencari Pengakuan Internasional"
 RAJ_seek_international_recognition_desc: "Untuk melegitimasi perjuangan kita, kita harus mendapatkan pengakuan internasional atas tujuan kita. Dengan menggalang dukungan global, kita dapat mengisolasi [ENG.GetAdjective] dan memperkuat klaim kedaulatan kita di mata dunia."
 RAJ_war_taxes: "Pajak Perang"
 RAJ_war_taxes_desc: "Biaya perang menuntut pengorbanan bersama. Dengan mengenakan pajak perang, kita dapat mendanai kampanye militer dan memastikan sumber daya yang dibutuhkan untuk meraih kemenangan. India yang merdeka bernilai setiap rupee."
 RAJ_azad_hind_bank: "Bank Azad Hind"
 RAJ_azad_hind_bank_desc: "$RAJ_azad_hind_dlc_bank_desc$"
 RAJ_hindutva: "Hindutva"
 RAJ_hindutva_desc: "Gagasan Hindutva membayangkan India bersatu yang berakar pada warisan budaya dan agama. Dengan mempromosikan ideologi ini, kami bertujuan untuk membentuk identitas nasional yang memperkuat persatuan dan mempersiapkan India untuk menegaskan dirinya di panggung global."
 RAJ_netaji: "Netaji"
 RAJ_netaji_desc: "Netaji Subhas Chandra Bose mewujudkan semangat perlawanan tanpa henti terhadap kekuasaan kekaisaran. Visi dan kepemimpinannya menginspirasi jutaan orang untuk bergabung dalam perjuangan demi kedaulatan India. Di bawah bimbingannya, impian kemerdekaan semakin mendekati kenyataan."
 RAJ_hindu_mahasabha: "Negara Hindu Progresif"
 RAJ_hindu_mahasabha_desc: "Majelis Agung Hindu Seluruh India mendukung kemerdekaan negara-negara pangeran dan memuji mereka sebagai 'landasan kekuatan Hindu'. Dengan memberikan kemerdekaan kepada negara-negara ini, kita dapat memperoleh lebih banyak dana dari mereka, dan mengkonsolidasikan seluruh negara."
 RAJ_hindu_mahasabha_tt: "Melepaskan Negara Pangeran sebagai Boneka akan meningkatkan bonus roh ini sebesar §G+4%§! selama negara tersebut tetap menjadi boneka Anda, hingga maksimum §Y32%§!."
 RAJ_sanatani: "Sanatani"
 RAJ_sanatani_desc: "Prinsip-prinsip Sanatan Dharma menawarkan landasan abadi bagi persatuan dan kebangkitan India. Dengan menganut nilai-nilai ini, kita dapat menginspirasi bangsa yang harmonis dan berketahanan, berpedoman pada tradisi."
 RAJ_hindi_as_a_national_language: "Bahasa Hindi Sebagai Bahasa Nasional"
 RAJ_hindi_as_a_national_language_desc: "Mengadopsi bahasa Hindi sebagai bahasa nasional akan menyatukan India di bawah identitas budaya bersama. Dengan mempromosikan penggunaannya, kita memperkuat komunikasi, menumbuhkan kebanggaan nasional, dan meletakkan dasar bagi negara yang kohesif dan mandiri."
 RAJ_seven_shackles_desc: "Vyavasaybandi membatasi orang India untuk bebas memilih profesi mereka, mengikat mereka pada sistem yang eksploitatif. Dengan menghilangkan belenggu ini, kami membebaskan pekerja dan memberdayakan mereka untuk berkontribusi terhadap perekonomian yang benar-benar mandiri dan adil."
 RAJ_coal_fire_and_steel: "Batubara, Api dan Baja"
 RAJ_coal_fire_and_steel_desc: "Batubara menjadi bahan bakar mesin, api melemahkan kemauan, dan baja membangun masa depan. Dengan berinvestasi pada industri alat berat, kami meletakkan dasar bagi India yang mandiri dan mampu mempertahankan kedaulatannya dan mendorong kemakmurannya."
 RAJ_extend_indian_security_zone: "Perluas [GetRajName] Zona Keamanan"
 RAJ_extend_indian_security_zone_desc: "Memperluas zona keamanan kita akan menjaga perbatasan India dan memproyeksikan kekuatan di seluruh wilayah. Dengan memperluas pengaruh kami, kami menjamin stabilitas dan perlindungan yang diperlukan untuk negara yang aman dan berdaulat."
 RAJ_high_altitude_training: "Pelatihan Ketinggian Tinggi"
 RAJ_high_altitude_training_desc: "Puncak terjal Himalaya menuntut kekuatan dan ketahanan. Dengan mengadakan program pelatihan khusus di ketinggian, kami mempersiapkan kekuatan kami untuk mendominasi lingkungan ekstrem, mengamankan perbatasan kami, dan menegaskan kendali atas wilayah pegunungan yang strategis."
 RAJ_high_altitude_training_tt: "Akan mendapatkan template pendaki gunung"
 RAJ_demand_return_of_imperialist_colonies: "Menuntut kembalinya Koloni Imperialis"
 RAJ_demand_return_of_imperialist_colonies_desc: "Sudah waktunya untuk menuntut kembalinya seluruh koloni imperialis di India, menyatukan seluruh tanah India di bawah satu bendera dan mengakhiri era intrusi kolonial."
 RAJ_planned_economy: "Perekonomian Terencana"
 RAJ_planned_economy_desc: "Bangsa yang kuat membutuhkan perekonomian yang kuat, dipandu oleh tujuan dan visi. Dengan mengadopsi perekonomian terencana, kita dapat mengalokasikan sumber daya secara efisien, memprioritaskan pertumbuhan industri, dan memastikan pembangunan yang adil bagi seluruh warga negara."
 RAJ_two_nation_theory_: "Teori Dua Negara"
 RAJ_two_nation_theory__desc: "Teori Dua Bangsa menegaskan bahwa umat Hindu dan Muslim adalah bangsa yang berbeda, masing-masing berhak atas negaranya sendiri. Dengan menganut ideologi ini, kami mengakui perlunya jalur terpisah menuju penentuan nasib sendiri, yang membentuk masa depan benua ini melalui perpecahan dan otonomi."
 RAJ_red_in_the_shadows: "Merah Dalam Bayangan"
 RAJ_red_in_the_shadows_desc: "Di tengah kekacauan kemunduran kekaisaran, kekuatan revolusioner mengumpulkan kekuatan, bekerja secara rahasia untuk melemahkan tatanan lama. Munculnya bendera merah menandakan sebuah perhitungan yang akan datang—sesuatu yang dapat mengubah masa depan India dan dunia."
 RAJ_red_in_the_shadows_tt: "Membuka keputusan untuk menyusup ke pemerintah Inggris dan mempengaruhi gerakan kemerdekaan menuju sikap pro-Komunis, mengurangi persyaratan untuk menyelesaikan §Y$RAJ_royal_indian_navy$§!"
 has_swayed_bose_to_communism: "Telah Mempengaruhi Bose ke Komunisme"
 #RAJ_red_in_the_shadows_tt: "We will turn Communist upon gaining independence and avoid Partition. Pakistan will be released, gaining [ENG.GetAdjective] support to counter further communist influence."
 RAJ_seek_domestic_allies: "Carilah Sekutu Domestik"
 RAJ_seek_domestic_allies_desc: "Blok Maju tidak dapat mencapai visinya sendirian. Dengan mencari sekutu dari berbagai spektrum politik, kita dapat menyatukan para pemikir revolusioner, memobilisasi dukungan yang lebih luas, dan menyatukan kepemimpinan yang diperlukan untuk mendorong India menuju kemerdekaan sejati."
 RAJ_protest_against_the_howell_monument: "Protes Terhadap Monumen Holwell"
 RAJ_protest_against_the_howell_monument_desc: "Monumen Holwell berdiri sebagai pemujaan atas dominasi dan ketidakadilan kolonial. Dengan mengorganisir protes terhadap simbol ini, kami menggalang seluruh bangsa untuk menolak propaganda kekaisaran dan menuntut pemindahan peninggalan yang menghina perjuangan kami untuk kebebasan."
 RAJ_the_indian_national_army: "Tentara Nasional India"
 RAJ_the_indian_national_army_desc: "Tentara Nasional India mewujudkan perjuangan kemerdekaan, menyatukan para patriot di bawah satu bendera untuk mengangkat senjata melawan pemerintahan kolonial. Dengan tekad dan pengorbanannya, INA siap memimpin India menuju pembebasan dan kedaulatan."
RAJ_appoint_soviet_friendly_government: "Tunjuk Pemerintahan Pro-Soviet"
RAJ_appoint_soviet_friendly_government_desc: "Untuk memastikan dukungan jangka panjang dari Moskow, kami akan membentuk pemerintahan yang sepenuhnya sejalan dengan ideologi Soviet. Loyalitas mereka akan menjamin bantuan ekonomi, kerja sama militer, dan konsistensi ideologis di negara baru kita."
RAJ_appoint_german_friendly_government: "Tunjuk Pemerintah Pro-Jerman"
RAJ_appoint_german_friendly_government_desc: "Menyelaraskan pemerintahan kita dengan [GER.GetNameDef] akan memperkuat hubungan dengan kekuatan Eropa yang sedang meningkat. Pemerintahan ini akan memprioritaskan pertumbuhan industri, modernisasi militer, dan perlawanan tegas terhadap Bolshevisme."
 #RAJ_post_war_independence: "Post War Independence"
 #RAJ_post_war_independence_desc: ""
 RAJ_ban_untouchability_once_and_for_all: "Larang Untouchability Sekali Dan Untuk Selamanya"
 RAJ_ban_untouchability_once_and_for_all_desc: "Ketidaktersentuhan adalah sebuah noda dalam masyarakat kita, yang memecah belah kita ketika persatuan sangat dibutuhkan. Dengan menghapuskan praktik ini, kami menegaskan martabat setiap orang India dan mengambil langkah tegas menuju pembangunan negara yang adil dan inklusif."
 RAJ_a_tiger_unchained: "Seekor Harimau Tanpa Rantai"
 RAJ_a_tiger_unchained_desc: "Kami akan menciptakan unit elit yang mampu menguasai medan pegunungan yang paling keras. Harimau di puncak ini akan menimbulkan ketakutan pada musuh kita dan mengamankan dominasi kita di pegunungan."
 RAJ_to_shake_the_world: "Untuk Mengguncang Dunia"
 RAJ_to_shake_the_world_desc: "Potensi industri India sangat besar, dan sekarang adalah waktu yang tepat untuk memanfaatkannya. Dengan memperluas pabrik, memodernisasi infrastruktur, dan memanfaatkan sumber daya, kita dapat mengubah India menjadi raksasa industri yang mampu menentukan nasib dunia."
 RAJ_east_india_railways_dlc: "Kereta Api India Timur"
 RAJ_east_india_railways_dlc_desc: "Dengan memperluas dan memodernisasi Jalur Kereta Api India Timur, kita dapat memperkuat perdagangan, meningkatkan konektivitas, dan membuka jalur menuju negara yang lebih sejahtera dan terintegrasi."
 RAJ_modify_indian_railways_tt: "Memodifikasi $idea_RAJ_indian_railways$ dengan:"
 RAJ_the_calcutta_line: "Jalur Kalkuta"
 RAJ_the_calcutta_line_desc: "Ketika ketegangan regional meningkat, pengamanan perbatasan timur menjadi suatu keharusan. Memperkuat Jalur Calcutta akan menciptakan benteng pertahanan, menjaga infrastruktur penting dan melindungi jantung kita dari ancaman eksternal."
 RAJ_the_calcutta_line_tt: "Tambahkan §G2§!§YBenteng Tanah§!di §Ysetiap§! provinsi di negara bagian tersebut."
 RAJ_bombay_baroda_and_central_india_railway: "Bombay Baroda dan Kereta Api India Tengah"
 RAJ_bombay_baroda_and_central_india_railway_desc: "Memperluas Jalur Kereta Api Bombay, Baroda, dan India Tengah akan menghubungkan wilayah-wilayah utama, mendorong pertumbuhan ekonomi dan menyatukan masyarakat. Jalur-jalur penting ini akan memperkuat jaringan perdagangan dan membentengi infrastruktur India dalam menghadapi tantangan-tantangan di masa depan."
 RAJ_great_indian_peninsula_railway_dlc: "Kereta Api Semenanjung India yang Hebat"
 RAJ_great_indian_peninsula_railway_dlc_desc: "Great Indian Peninsula Railway adalah kunci untuk membuka potensi ekonomi di India tengah dan selatan. Memperluas jaringan ini akan meningkatkan perdagangan, memberdayakan industri, dan memastikan konektivitas yang lancar di seluruh benua ini."
 RAJ_south_indian_railway_company: "Perusahaan Kereta Api India Selatan"
 RAJ_south_indian_railway_company_desc: "Perusahaan Kereta Api India Selatan menghubungkan daerah selatan yang ramai dengan seluruh India. Memperkuat dan memperluas jaringan ini akan mendorong pertumbuhan regional, memupuk persatuan, dan memperkuat peran wilayah selatan dalam upaya India menuju kemandirian ekonomi."
 RAJ_supply_center_fortifications: "Benteng Pusat Pasokan"
 RAJ_supply_center_fortifications_desc: "Mengamankan pusat pasokan sangat penting untuk mempertahankan upaya perang. Dengan memperkuat pusat-pusat ini, kami memastikan aliran sumber daya tidak terganggu dan melindungi tulang punggung operasi militer kami dari serangan musuh."
 RAJ_supply_center_fortifications_tt: "Tambahkan §G3§! §Y$bunker$§! di setiap §YSupply Hub§! di negara bagian milik kami"
 RAJ_north_western_state_railway: "Kereta Api Negara Bagian Barat Laut"
 RAJ_north_western_state_railway_desc: "Jalur Kereta Api Negara Bagian Barat Laut (North Western State Railway) sangat penting untuk menghubungkan jantung India dengan perbatasan strategisnya. Memperluas dan memodernisasi jaringan ini akan memperkuat perdagangan regional, meningkatkan mobilitas, dan memperkuat kehadiran kami di sepanjang perbatasan penting."
 RAJ_prioritize_army_cargo: "Prioritaskan Kargo Angkatan Darat"
 RAJ_prioritize_army_cargo_desc: "Jaringan kereta api merupakan tulang punggung logistik militer. Dengan memprioritaskan muatan tentara, kami memastikan prajurit kami mendapat pasokan senjata, sumber daya, dan bala bantuan yang dibutuhkan untuk meraih kemenangan dengan cepat dan pasti."
 RAJ_prioritize_civilian_cargo: "Prioritaskan Kargo Sipil"
 RAJ_prioritize_civilian_cargo_desc: "Front tuan rumah yang kuat sangat penting untuk kemenangan. Dengan memprioritaskan kargo sipil, kami memastikan pengiriman makanan, barang, dan material tepat waktu untuk menopang masyarakat dan industri kami, sehingga menjaga ketahanan negara di saat krisis."
 RAJ_specialized_dietary_requirement: "Persyaratan Diet Khusus"
 RAJ_specialized_dietary_requirement_desc: "Untuk menjaga moral dan kohesi, kita harus menghormati beragam kebutuhan pangan pasukan kita. Dengan menyediakan makanan yang selaras dengan keyakinan agama dan budaya mereka, kami memastikan setiap prajurit merasa dihormati dan siap berperang."
 RAJ_standardized_rations: "Ransum Standar"
 RAJ_standardized_rations_desc: "Efisiensi dan konsistensi adalah kunci militer yang kuat. Dengan menerapkan jatah standar, kami menyederhanakan logistik, mengurangi biaya, dan memastikan setiap prajurit mendapat makanan yang sama, sehingga memupuk persatuan dan disiplin di seluruh jajaran."
 RAJ_royal_indian_artillery_: "Artileri Kerajaan India"
 RAJ_royal_indian_artillery__desc: "Dengan memperkuat kekuatan yang tangguh ini, kami memastikan kemampuan kami untuk memberikan daya tembak yang menghancurkan, menghancurkan garis musuh dan mengamankan kemenangan di medan perang."
 RAJ_armoured_corps_center_and_school: "Pusat Korps Lapis Baja"
 RAJ_armoured_corps_center_and_school_desc: "Masa depan peperangan terletak pada kekuatan mekanis. Mendirikan pusat korps lapis baja akan memungkinkan kita melatih pasukan kita dalam taktik lapis baja, mengubah tank menjadi ujung tombak strategi militer modern kita."
 RAJ_indian_army_corps_of_engineers: "[ROOT.GetAdjective] Korps Insinyur Angkatan Darat"
 RAJ_indian_army_corps_of_engineers_desc: "Dari benteng hingga jembatan, Korps Insinyur Angkatan Darat [ROOT.GetAdjective] sangat penting untuk keberhasilan operasional. Dengan memperluas dan memperlengkapi cabang penting ini, kami memastikan pasukan kami dapat mengatasi hambatan apa pun, membuka jalan menuju kemenangan di segala lini."
 RAJ_kingmaker: "pembuat raja"
 RAJ_kingmaker_desc: "Dengan mengirimkan sukarelawan ke konflik luar negeri, kami memperluas pengaruh kami dan memperoleh pengalaman tempur yang berharga. Upaya-upaya ini tidak hanya mendukung sekutu kita namun juga memposisikan kita sebagai kekuatan penentu dalam menentukan hasil perjuangan global."
 RAJ_relax_agrarian_society_criteria: "Masyarakat Industrialisasi"
 RAJ_relax_agrarian_society_criteria_desc: "Untuk bertransisi menjadi kekuatan industri modern, kita harus mengalihkan perekonomian kita dari pertanian tradisional. Dengan mendorong penduduk pedesaan untuk bergabung dengan angkatan kerja industri, kita meletakkan dasar bagi pertumbuhan berkelanjutan dan kemajuan teknologi."
 RAJ_mechanization_of_the_cavalry: "Mekanisasi Kavaleri"
 RAJ_mechanization_of_the_cavalry_desc: "Era peperangan berkuda telah berakhir. Dengan mekanisasi kavaleri, kami mengubahnya menjadi kekuatan lapis baja modern, menggabungkan kecepatan dan daya tembak untuk mendominasi medan perang dan memimpin India menuju masa depan peperangan."
 RAJ_mountain_tanks: "Tank Gunung"
 RAJ_mountain_tanks_desc: "Tank tradisional mampu bertahan di medan terjal, namun tank gunung khusus akan memberi kita keunggulan dalam pertempuran di ketinggian. Mesin-mesin yang gesit ini akan mendominasi, mengamankan benteng-benteng strategis dan mengatasi manuver musuh-musuh kita."
 RAJ_siege_batteries: "Baterai Pengepungan"
 RAJ_siege_batteries_desc: "Saat benteng menghalangi kita, baterai pengepungan akan menghancurkannya hingga menjadi puing-puing. Unit artileri berat ini membawa kekuatan destruktif yang tak tertandingi, memastikan bahwa tidak ada benteng atau benteng yang dapat menahan kemajuan kita."
 RAJ_mountain_guns: "Senjata Gunung"
 RAJ_mountain_guns_desc: "Peperangan di ketinggian menuntut kemampuan beradaptasi. Senjata gunung, yang dirancang untuk medan terjal, memberikan dukungan tembakan penting kepada pasukan di lingkungan paling keras, memastikan dominasi bahkan dalam pertempuran paling menantang sekalipun."
 RAJ_regimental_loyalty: "Loyalitas Resimen"
 RAJ_regimental_loyalty_desc: "Ikatan kesetiaan resimen membentuk persatuan dan disiplin di antara pasukan kita. Dengan memupuk kebanggaan terhadap tradisi-tradisi ini, kita menciptakan kekuatan yang terikat oleh kehormatan, kepercayaan, dan komitmen pantang menyerah terhadap kemenangan."
 RAJ_uplifting_the_people_of_india: "Mengangkat Semangat Rakyat India"
 RAJ_uplifting_the_people_of_india_desc: "Rakyat India harus tegas dalam perjalanan menuju kemerdekaan. Untuk mencapai hal ini, kebutuhan dasar mereka harus dipenuhi terlebih dahulu; oleh karena itu kami akan menerapkan kebijakan untuk mencapai hal ini."
 RAJ_gurkhas: "Gurkha"
 RAJ_gurkhas_desc: "Terkenal karena keberanian dan kegigihannya, Gurkha adalah kekuatan elit yang tak tertandingi dalam pertempuran. Dengan memperluas peran mereka dan memastikan dedikasi mereka terhadap tujuan kita, kita mendapatkan keuntungan utama di medan perang."
 RAJ_lions_of_the_great_war_: "Singa Perang Besar"
 RAJ_lions_of_the_great_war__desc: "Pengorbanan tentara India dalam Perang Besar merupakan bukti keberanian mereka. Dengan memperingati warisan mereka, kami menghormati keberanian mereka dan menginspirasi generasi baru untuk menjunjung semangat mereka dalam memperjuangkan nasib India."
 RAJ_abolish_agrarian_society_criteria: "Mempercepat Industrialisasi"
 RAJ_abolish_agrarian_society_criteria_desc: "Di era modern ini, sangat penting bagi kita untuk bisa bersaing dengan negara lain dalam hal pembangunan ekonomi. Sudah terlalu lama kita bergantung pada pertanian. Saatnya membuka jalan bagi industrialisasi yang pesat untuk membawa [RAJ.GetNameDef] ke era kemajuan baru."
 RAJ_abolish_agrarian_society_criteria_tt: "Mengurangi waktu yang dibutuhkan untuk mengurangi efek §Y$idea_RAJ_agrarian_society$§! sebanyak §Y_3§! bulan secara permanen"
 RAJ_womens_auxiliary_corps: "Korps Pembantu Wanita"
 RAJ_womens_auxiliary_corps_desc: "Dengan membentuk Korps Pembantu Perempuan, kami memberdayakan perempuan untuk berperan dalam peran pendukung yang penting, memperkuat angkatan bersenjata kami. Kontribusi mereka akan meningkatkan logistik, komunikasi, dan operasional, membuktikan bahwa setiap orang India mempunyai peran dalam menjamin masa depan kita."
 RAJ_indian_territorial_force: "[ROOT.GetAdjective] Pasukan Teritorial"
 RAJ_indian_territorial_force_desc: "Pasukan Teritorial [ROOT.GetAdjective] akan menyediakan cadangan vital warga negara terlatih yang siap membela tanah air."
 RAJ_military_engineer_services: "Layanan Insinyur Militer"
 RAJ_military_engineer_services_desc: "Layanan Insinyur Militer adalah tulang punggung infrastruktur militer, mulai dari benteng hingga jalur pasokan. Memperkuat cabang penting ini memastikan pasukan kita dilengkapi dengan jalan, pangkalan, dan pertahanan yang diperlukan untuk menang dalam konflik apa pun."
 RAJ_the_burma_rifles: "Senapan Burma"
 RAJ_the_burma_rifles_desc: "Senapan Burma adalah kekuatan penting untuk menjaga keamanan di medan yang menantang di perbatasan timur. Dengan memperkuat dan memodernisasi resimen ini, kami menjamin stabilitas, mempertahankan wilayah-wilayah utama, dan bersiap menghadapi tantangan masa depan di wilayah strategis ini."
 RAJ_help_from_the_nagas: "Bantuan Dari Para Naga"
 RAJ_help_from_the_nagas_desc: "Suku Naga, dengan pengetahuan mereka yang mendalam tentang medan dan keterampilan gerilya yang tak tertandingi, adalah sekutu yang sangat berharga. Dengan mendapatkan dukungan mereka, kami memperkuat posisi kami di timur laut, mengubah perbukitan terjal menjadi benteng perlawanan dan kekuatan."
 RAJ_campaign_against_agrarian_societys: "Skema Industrialisasi"
 RAJ_campaign_against_agrarian_societys_desc: "India tidak bisa dibiarkan begitu saja dalam satu abad terakhir. Kita perlu melakukan upaya terkonsentrasi untuk mengangkat rakyat kita."
 RAJ_indianize_the_army: "Indianisasi Angkatan Darat"
 RAJ_indianize_the_army_desc: "Saatnya telah tiba untuk menggantikan pengaruh kolonial dengan kepemimpinan India di angkatan bersenjata. Dengan mempromosikan perwira India dan merestrukturisasi angkatan bersenjata, kami membangun militer yang benar-benar mewakili dan melayani negara."
 RAJ_keep_british_generals: "Pertahankan Jenderal Inggris"
 RAJ_keep_british_generals_desc: "Di masa yang penuh ketidakpastian ini, kepemimpinan yang berpengalaman sangatlah penting. Mempertahankan jenderal-jenderal Inggris memastikan tentara mendapatkan manfaat dari keahlian dan disiplin mereka, menjaga stabilitas dan efektivitas saat kita menavigasi jalan menuju kemerdekaan."
 RAJ_keep_british_generals_tt: "Kami akan mempertahankan semua jenderal Inggris, bahkan jika kami berakhir berperang dengan [ENG.GetName]"
 RAJ_chindits_: "Chindit"
 RAJ_chindits__desc: "Suku Chindit adalah pejuang elit dan tidak konvensional yang dilatih untuk operasi hutan jarak jauh. Dengan memperluas barisan mereka dan menyempurnakan taktik mereka, kita mendapatkan kekuatan yang mampu mengatasi manuver musuh dan mengganggu operasi mereka jauh di belakang garis pertahanan mereka."
 RAJ_viceroys_body_guard: "Pengawal Raja Muda"
 RAJ_viceroys_body_guard_desc: "Pengawal Raja Muda mewakili tradisi, disiplin, dan prestise. Dengan mempertahankan dan memodernisasi unit kavaleri bertingkat ini, kami melestarikan simbol otoritas dan menyesuaikannya untuk menghadapi tantangan zaman yang terus berubah."
 RAJ_engineering_revolution: "Revolusi Rekayasa"
 RAJ_engineering_revolution_desc: "Kemajuan India menuntut revolusi teknik. Dengan berinvestasi di bidang infrastruktur, pengembangan industri, dan teknologi mutakhir, kita dapat mengubah negara ini menjadi negara besar yang mampu memimpin dalam perdamaian dan perang."
 RAJ_ordnance_factory_kanpur_uttar_pradesh: "Pabrik Persenjataan Kanpur"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc: "Pabrik Persenjataan di Kanpur adalah landasan produksi pertahanan India. Dengan memperluas kapasitas dan memodernisasi fasilitasnya, kami memastikan pasokan senjata dan peralatan yang stabil, memberdayakan kekuatan kami untuk membela dan mengamankan negara."
 RAJ_indian_air_force: "[ROOT.GetAdjective] Angkatan Udara"
 RAJ_indian_air_force_desc: "Langit adalah batas baru peperangan modern. Dengan membangun Angkatan Udara India yang kuat dan mandiri, kita mengamankan kedaulatan kita, mendominasi udara, dan bersiap menghadapi tantangan konflik di masa depan."
 RAJ_the_burma_road: "Jalan Burma"
 RAJ_the_burma_road_desc: "Jalan Burma adalah jalur pasokan penting yang menghubungkan India ke Asia Tenggara dan sekitarnya. Mengamankan dan memperluas jalur ini memastikan aliran sumber daya dan bala bantuan yang stabil, memperkuat posisi kita di kawasan dan mendukung sekutu kita."
 RAJ_womens_auxiliary_air_force: "Angkatan Udara Pembantu Wanita"
 RAJ_womens_auxiliary_air_force_desc: "Angkatan Udara Tambahan Wanita memberdayakan perempuan untuk mendukung operasi udara, mulai dari logistik hingga komunikasi. Dengan mengintegrasikan bakat mereka, kami memperkuat angkatan udara kami dan membuktikan bahwa setiap orang India dapat berkontribusi untuk mengamankan udara negaranya."
 RAJ_trainer_planes: "Pesawat Pelatih"
 RAJ_trainer_planes_desc: "Pilot yang terampil adalah tulang punggung angkatan udara yang kuat. Dengan berinvestasi pada pesawat latih, kami memastikan bahwa penerbang kami menerima persiapan terbaik, membangun kader penerbang elit yang siap mempertahankan langit India."
 RAJ_spitfire: "api unggun"
 RAJ_spitfire_desc: "Terkenal karena kecepatan dan kelincahannya, Spitfire akan menjadi inti dari angkatan udara modern kita, memastikan dominasi di langit dan respons yang tangguh terhadap ancaman udara apa pun."
 RAJ_ground_pounder: "Penumbuk Tanah"
 RAJ_ground_pounder_desc: "Medan yang terjal di India menyulitkan tank untuk bergerak cepat. Memiliki dukungan udara jarak dekat akan sangat penting untuk menutupi kekurangan dukungan darat yang berat."
 RAJ_douglas_dakota: "Douglas Dakota"
 RAJ_douglas_dakota_desc: "Kami mempunyai kebutuhan mendesak untuk menyediakan transportasi cepat pasukan dan barang. Dakota adalah pesawat yang sangat mampu untuk tugas ini."
 RAJ_vultee_vengeance: "Pembalasan Vultee"
 RAJ_vultee_vengeance_desc: "Dengan memperoleh pesawat American Vultee Vengeance kita dapat memperluas angkatan udara kita secara signifikan dengan biaya yang sangat terjangkau."
 RAJ_ordnance_factory_khamaria_jabalpur: "Pabrik Persenjataan Khamaria Jabalpur"
 RAJ_ordnance_factory_khamaria_jabalpur_desc: "Terletak di Jabalpur, Pabrik Persenjataan Khamaria adalah produsen utama amunisi dan persenjataan. Memperluas kapasitasnya akan memperkuat daya tembak militer kita, memastikan pasukan kita tetap diperlengkapi dengan baik untuk menghadapi tantangan apa pun di masa depan."
 RAJ_ordnance_factory_medak: "Pabrik Persenjataan Medak"
 RAJ_ordnance_factory_medak_desc: "Mengkhususkan diri dalam produksi kendaraan lapis baja, Pabrik Persenjataan Medak sangat penting untuk memodernisasi militer kita. Memperluas operasinya memastikan pasukan kami dilengkapi dengan mesin mutakhir yang diperlukan untuk mendominasi medan perang."
 RAJ_chariot_of_victory: "Kereta Kemenangan"
 RAJ_chariot_of_victory_desc: "Medan perang menuntut kecepatan dan kekuatan. Dengan berinvestasi pada kendaraan lapis baja dan pasukan mekanis, kami menciptakan tentara modern yang mampu meraih kemenangan cepat dan menentukan, memastikan supremasi India dalam konflik apa pun."
 RAJ_the_ledo_road: "Jalan Ledo"
 RAJ_the_ledo_road_desc: "Melewati medan terjal, Jalan Ledo merupakan jalur pasokan penting yang menghubungkan India dengan pasukan Sekutu di Tiongkok. Penyelesaian dan pengamanan jalur penyelamat ini akan menjamin aliran pasukan, sumber daya, dan peralatan yang diperlukan untuk membalikkan keadaan di Asia Tenggara."
 RAJ_long_range_escorts: "Pengawal Jarak Jauh"
 RAJ_long_range_escorts_desc: "Untuk melindungi jalur pasokan dan misi penting, kita membutuhkan pesawat yang mampu mengawal pesawat pengebom dan transportasi jarak jauh. Berinvestasi dalam pengawalan jarak jauh memastikan superioritas udara dan keamanan operasi jauh di luar perbatasan kita."
 RAJ_british_air_experts: "Pakar Udara Inggris"
 RAJ_british_air_experts_desc: "Memanfaatkan keahlian para penerbang dan insinyur Inggris yang berpengalaman dapat mempercepat pengembangan angkatan udara kita. Pengalaman mereka dalam peperangan udara modern akan memberikan wawasan yang sangat berharga saat kita membangun kehadiran yang tangguh di angkasa."
 RAJ_special_operations_executive: "Eksekutif Operasi Khusus"
 RAJ_special_operations_executive_desc: "Eksekutif Operasi Khusus berspesialisasi dalam peperangan non-konvensional, mulai dari sabotase hingga pengumpulan intelijen. Memperluas perannya di India membekali kita dengan alat untuk menggagalkan rencana musuh dan mengubah operasi rahasia menjadi keuntungan strategis."
 RAJ_the_ordnance_factories_board: "Dewan Pabrik Persenjataan"
 RAJ_the_ordnance_factories_board_desc: "Mengkoordinasikan jaringan pabrik persenjataan India yang luas di bawah satu dewan terpadu akan menyederhanakan produksi, meningkatkan efisiensi, dan memastikan pasokan senjata dan amunisi yang konsisten. Yayasan ini akan memberdayakan militer kita dan mendorong kemandirian India dalam bidang manufaktur pertahanan."
 RAJ_smiling_buddah: "Buddha yang Tersenyum"
 RAJ_smiling_buddah_desc: "Project Smiling Buddha menandai masuknya India ke dalam bidang kemampuan nuklir. Dengan menguasai teknologi ini, kita menegaskan kemandirian kita di panggung global dan mendapatkan pencegahan yang kuat untuk menjaga kedaulatan kita."
 RAJ_royal_indian_air_force_dlc: "Angkatan Udara Kerajaan [ROOT.GetAdjective]"
 RAJ_royal_indian_air_force_dlc_desc: "Angkatan Udara Kerajaan India mewakili puncak kekuatan udara India. Memperluas kemampuannya dengan pesawat dan pelatihan modern memastikan dominasi di angkasa, siap membela negara kita dan memproyeksikan kekuatan di seluruh kawasan."
 RAJ_infiltrate_aden: "Menyusup ke Aden"
 RAJ_infiltrate_aden_desc: "Aden, yang merupakan benteng strategis kekuatan Inggris, memegang kunci untuk mengganggu kendali mereka di wilayah tersebut. Dengan menyusup dan mengorganisir perlawanan lokal, kita dapat memicu pemberontakan yang melemahkan cengkeraman Inggris dan menciptakan kekacauan saat perjuangan kemerdekaan kita dimulai."
 RAJ_go_into_hiding: "Pergilah Bersembunyi"
 RAJ_go_into_hiding_desc: "Subhas Chandra Bose harus menghindari pengawasan Inggris untuk melanjutkan perjuangan kemerdekaan. Dengan bersembunyi, ia memastikan kepemimpinan G-30-S tetap utuh, siap menyerang ketika waktunya tepat."
 RAJ_trade_protection: "Perlindungan Perdagangan"
 RAJ_trade_protection_desc: "Untuk menjamin kemakmuran perekonomian kita, kita harus mempertahankan jalur perdagangan dan industri penting dari eksploitasi asing. Memperkuat perlindungan perdagangan akan mengamankan sumber daya India, mendorong pertumbuhan domestik, dan melindungi pasar kita dari ancaman eksternal."
 RAJ_seek_japanese_support_tt: "Ketika perang kemerdekaan dimulai [JAP.GetNameDef] akan memberi kita:\n§Y120§! B4Y Pembom Angkatan Laut\n§Y135§! [Jap.GetAdjective]Ki-10 Pejuang Antar Perang\nDesain mereka yang sesuai dan"
 RAJ_the_enemy_of_my_enemy_tt: "Pemerintah §Y[JAP.GetAdjective]§! akan menyatakan perang terhadap pihak lawan dalam perang saudara dan membantu kami."
 RAJ_the_enemy_of_my_enemy_tt_2: "§Y[JAP.GetAdjective]§! juga akan mencoba menyerang §Y[733.GetName]§! dan menyerahkannya kepada kami."
 RAJ_azad_hind_dlc_tt: "Kami akan mendapatkan:"
 RAJ_azad_hind_dlc_tt_2: "Pada awal §RPerang Saudara§! selama §Y120§! hari"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt: "Akan memulai perang saudara untuk kemerdekaan antara pendukung Demokrat dan kami\nSetiap negara bagian yang memiliki perlawanan di atas §Y65%§! atau §Y85%§! akan memihak kami selama perang saudara dan memberi kami 1 atau 2 divisi masing-masing, tergantung pada perlawanan tertinggi.\nSetiap negara bagian lain akan berpihak pada pihak Demokrat."
### 
RAJ_infiltrate_aden_tt: "Setelah dimulainya perang kemerdekaan, bentuklah milisi di §Y[659.GetName]§!, §Y[906.GetName]§!, §Y[658.GetName]§!, §Y[765.GetName]§!, §Y[422.GetName]§! dan §Y[656.GetName]§! untuk menyerang harta benda [ENG.GetName]."
 RAJ_go_into_hiding_tt: "Bose akan melarikan diri dari penawanan dan memulai perjalanannya, kembali setelah dimulainya perang saudara"
 RAJ_war_taxes_tt: "Membuka keputusan untuk menaikkan pajak perang untuk setiap negara yang berperang."
 RAJ_akhand_bharat: "Akhand Bharata"
 RAJ_akhand_bharat_desc: "Akhand Bharat harus tetap satu dan tidak dapat dipisahkan. Semua orang yang memiliki kesetiaan dan kesetiaan yang tidak terbagi kepada bangsa India dan negara bagiannya harus diperlakukan dengan kesetaraan yang sempurna, berbagi kewajiban yang sama, tanpa memandang kasta, kepercayaan atau agama."
 RAJ_akhand_bharat_tt: "Membuka keputusan untuk negara bagian inti di [AFG.GetName], [MLD.GetName], [NEP.GetName], [PAK.GetName], [BAN.GetName], [BHU.GetName], [SRL.GetName] dan membentuk Akhand Bharat. Kita dapat menargetkan suatu negara untuk menjadi negara inti pada satu waktu, sehingga kita perlu menduduki semua negara inti yang ada untuk mengklaim lebih banyak negara inti."
 RAJ_two_nation_theory_dlc: "$RAJ_two_nation_theory$"
 RAJ_two_nation_theory_dlc_desc: "$RAJ_two_nation_theory__desc$"
 RAJ_extended_franchise: "Hak yang Diperluas"
 RAJ_extended_franchise_desc: "Memperluas hak [GetRajAdjective] bersama adalah upaya utama untuk mengurangi kendali [ENG.GetAdjective] atas negara"
 RAJ_hand_over_aden_to_the_crown: "Serahkan Aden Kepada Mahkota"
 RAJ_hand_over_aden_to_the_crown_desc: "Sesuai rencana, [ROOT.GetNameDef] akan menyerahkan kekuasaan Aden kepada Kerajaan Inggris, sehingga membebaskan biaya administrasi."
 RAJ_renegotiate_adens_control: "Negosiasi ulang Kendali Aden"
 RAJ_renegotiate_adens_control_desc: "Meskipun rencananya adalah untuk menyerahkan Aden kepada [ENG.GetName], terdapat manfaat besar jika memiliki pelabuhan perdagangan di Laut Merah. Kita perlu menegosiasikan ulang kebijakan ini dan menjaganya tetap di bawah kendali kita."
 RAJ_renegotiate_adens_control_tt: "Kami akan mempertahankan kendali atas [992.GetName] alih-alih menyerahkannya kepada [ENG.GetName]"
 RAJ_cripps_mission_dlc: "$RAJ_cripps_mission$"
 RAJ_cripps_mission_dlc_desc: "$RAJ_cripps_mission_desc$"
 RAJ_trade_port: "Pelabuhan Perdagangan"
 RAJ_trade_port_desc: "Aden saat ini merupakan pelabuhan yang sangat kecil, namun dengan adanya investasi, Aden dapat berubah menjadi pelabuhan yang sedang berkembang."
 RAJ_fortify_aden: "Perkuat Aden"
 RAJ_fortify_aden_desc: "Karena Aden kini menjadi pelabuhan penting, maka Aden perlu diperkuat dari potensi serangan."
 RAJ_purna_swaraj: "Aturan Diri - Purna Swaraj"
 RAJ_purna_swaraj_desc: "Pemerintahan [ENG.GetAdjective] di India tidak hanya merampas kebebasan masyarakat [RAJ.GetAdjective] namun juga mendasarkan diri pada eksploitasi massa, dan telah menghancurkan India secara ekonomi, politik, budaya dan spiritual. Oleh karena itu India harus memutuskan hubungan [ENG.GetAdjective] dan mencapai Purna Swaraj atau kemerdekaan penuh"
 RAJ_the_second_duar_war: "Perang Duar Kedua"
 RAJ_the_second_duar_war_desc: "Rakyat [BHU.GetAdjective] tidak bisa lagi dibiarkan menjadi negara merdeka dengan keadaan dunia yang apa adanya. Kita perlu menyerap mereka ke India dengan baik."
 RAJ_bhutanese_protectorate: "Protektorat Bhutan"
 RAJ_bhutanese_protectorate_desc: "Kita perlu menghormati isolasi rakyat [BHU.GetAdjective], namun pada saat yang sama kita tidak dapat menyangkal kenyataan bahwa negara-negara kecil akan dimangsa oleh negara-negara yang mempunyai ambisi imperial. Kami akan menawarkan mereka perlindungan di bawah naungan India."
 RAJ_bhutanese_protectorate_tt: "§Y[BHU.GetName]§! akan menjadi wilayah kekuasaan §Y[RAJ.GetNameDefCap].§!\n\nMereka lebih cenderung menerima jika\n\t-Mereka mempunyai opini yang tinggi terhadap kami\n\t-Kami memiliki pasukan yang jauh lebih kuat daripada mereka"
 RAJ_give_sikkim_administrative_rights_for_bhutan: "Berikan Hak Administratif Sikkim Untuk Bhutan"
 RAJ_all_india_students_federation: "Federasi Pelajar Seluruh India"
 RAJ_all_india_students_federation_desc: "Memobilisasi siswa melawan kekuasaan [ENG.GetAdjective] akan memastikan bahwa pikiran muda kita yang paling cerdas bekerja melawan tatanan yang sudah ada."
 RAJ_league_against_gandhism: "Liga Melawan Gandhisme"
 RAJ_league_against_gandhism_desc: "Kebijakan non-kekerasan Mahatma sangat mengagumkan. Sayangnya [ENG.GetAdjective] berulang kali membuktikan bahwa mereka akan menghadapi protes dengan peluru. Oleh karena itu diperlukan taktik baru, taktik yang akan menumpahkan darah jika diperlukan."
 RAJ_league_against_gandhism_tt: "Peristiwa kerusuhan partisi sekarang akan menghasilkan §G5%§! Dukungan Perang ketika terjadi, hingga maksimum §Y+50%§!."
 RAJ_league_against_gandhism_tt_event: "Menambahkan §G+5%§! Dukungan Perang ekstra karena berpihak pada §Y$RAJ_league_against_gandhism$§!"
 RAJ_mahatma: "Mahatma"
 RAJ_mahatma_desc: "Mahatma Gandhi tidak diragukan lagi adalah wajah gerakan kemerdekaan. Bersama dia dan Jawaharlal Nehru kita akan mematahkan kuk yang mengikat kita dengan Inggris."
 RAJ_swadeshi_movement: "Gerakan Swadeshi"
 RAJ_swadeshi_movement_desc: "Swadeshi, atau swasembada dari [ENG.GetAdjective] akan menggembleng gerakan kemerdekaan dan menjaga kekayaan India di India."
 RAJ_form_a_federal_court: "Bentuk Pengadilan Federal"
 RAJ_form_a_federal_court_desc: "Segala bentuk demokrasi memerlukan pengadilan federal agar dapat berfungsi dan menegakkan supremasi hukum. Kita perlu memastikan bahwa kita dinilai oleh rekan-rekan kita, dan bukan oleh pengacara [ENG.GetAdjective]"
 RAJ_defense_of_india_act: "Undang-Undang Pertahanan India"
 RAJ_defense_of_india_act_desc: "Keamanan [GetRajName] terancam oleh agresi eksternal. [ROOT.GetLeader] telah mendeklarasikan melalui proklamasi suatu tindakan yang mengatur tindakan-tindakan khusus untuk menjamin keselamatan dan kepentingan umum, serta untuk pertahanan negara [GetRajAdjective]."
 RAJ_a_congress_resurgent: "Kebangkitan Kongres"
 RAJ_a_congress_resurgent_desc: "Kongres nasional telah meningkat popularitas dan kekuatannya. Kini ia menjadi kekuatan politik yang tidak dapat disangkal."
 RAJ_khadi_movement: "Gerakan Khadi"
 RAJ_khadi_movement_desc: "Sebagai bagian dari Swadeshi, simbol kemerdekaan telah menjadi Khadi. Kain yang dipintal dengan tangan memberikan isyarat perlawanan secara simbolis, dan pakaian yang ditenun dari kain tersebut memberikan banyak peluang ekonomi bagi masyarakat tertindas dan miskin."
 RAJ_boycott_british_made_goods: "Boikot Barang Buatan Inggris"
 RAJ_boycott_british_made_goods_desc: "Sudah terlalu lama [ENG.GetAdjective] mengekstraksi sumber daya mentah dari [GetRajName] dan menjual bahan olahannya kembali kepada kami dengan harga yang mahal. [RAJ.GetRajAdjective]s harus menghasilkan barang untuk [RAJ.GetRajAdjective]s, bukan dijual oleh penghuni kita sendiri."
 RAJ_litteracy_effort: "Upaya Literasi"
 RAJ_litteracy_effort_desc: "Masyarakat yang tidak berpendidikan ibarat masyarakat yang berpikiran terbuka, tidak dibatasi dan tidak dijaga. Mampu membaca adalah keterampilan utama yang dibutuhkan oleh setiap manusia, lagipula siapa yang akan rugi jika bukan dari gembalanya?"
 RAJ_debt_relief: "Penghapusan Hutang"
 RAJ_debt_relief_desc: "Sudah sejak lama para [ENG.GetAdjective] dan [GetRajAdjective] yang kaya telah memikat masyarakat awam ke dalam perangkap utang, hingga ke titik di mana utang tersebut kini mewabah. Kami akan melobi pemerintah daerah untuk memberikan bantuan kepada orang-orang ini guna meringankan beban mereka yang terjebak dalam sistem yang salah."
 RAJ_expand_healthcare_facilities: "Memperluas Fasilitas Pelayanan Kesehatan"
 RAJ_expand_healthcare_facilities_desc: "Sayangnya, layanan kesehatan di [GetRajName] sangat kurang. Disentri, kolera, dan malaria melanda daerah pedesaan, menghambat pertumbuhan. Memperluas fasilitas lokal akan mengatasi hal ini."
 RAJ_indo_centric_curriculum: "Kurikulum Indo-Sentrik"
 RAJ_indo_centric_curriculum_desc: "Pendidikan di [GetRajName] telah berpusat pada pandangan dunia [ENG.GetAdjective], meremehkan identitas [GetRajAdjective] dan mereduksi sejarah kita menjadi sejarah yang tunduk. Kita perlu mendasarkan sistem pendidikan kita pada identitas [GetRajAdjective] dan mengajarkan sejarah kita kepada anak-anak."
 RAJ_enrollment_of_dali_children: "Pendaftaran Anak Dalit"
 RAJ_enrollment_of_dali_children_desc: "Dalit, \"tak tersentuh\", lapisan kasta terbawah hidup dalam kemiskinan abadi. Sistem kasta, yang merupakan noda bagi bangsa kita, hanya bisa dihilangkan dengan mendaftarkan anak-anak mereka ke sekolah."
 RAJ_local_resistance_to_land_taxes: "Resistensi Lokal Terhadap Pajak Tanah"
 RAJ_local_resistance_to_land_taxes_desc: "Pemerintahan di Delhi sebagian besar didanai oleh pajak daerah. Jika kita mendorong penolakan untuk membayar pajak, maka hal ini akan mencekik pemerintah dan sekaligus memberikan porsi kekayaan yang lebih besar kepada rakyatnya."
 RAJ_tenancy_reforms: "Reformasi Sewa"
 RAJ_tenancy_reforms_desc: "Kelompok topi hitam yang kaya menyudutkan pasar perumahan, menaikkan harga dan menurunkan standar hidup sambil merendahkan masyarakat biasa. Kongres harus melakukan lobi yang kuat untuk melakukan reformasi persewaan, dengan membatasi berapa besar biaya yang dapat dikenakan oleh tuan tanah untuk perumahan."
 RAJ_quinine: "Kina"
 RAJ_quinine_tt: "Membuka versi yang ditingkatkan dari kemampuan §YPersediaan Ekstra§!.\n\nBiaya Tenaga Komando: §Y0.15§! (untuk setiap batalyon)\nDurasi: §Y10 hari§!\nJeda: §Y21 hari§!\n\n§YSaat Diaktifkan:§!\nAtrisi Divisi: §G12.0%§!\nAtrisi Panas: §G35.00%§!\nSupply Grace: §G+240.0 Jam§!\nPeluang Sakit: §G-100.00%§!\nMemberikan pasukan pasokan yang cukup untuk §Y240§! Jam"
 RAJ_quinine_desc: "Menyediakan pasukan kita dengan Kina dan obat-obatan serupa akan memungkinkan pasukan kita berperang di lingkungan tropis tanpa menderita malaria."
 RAJ_temple_entry_movements: "Pergerakan Masuk Kuil"
 RAJ_temple_entry_movements_desc: "Ketidaktersentuhan adalah noda di negara ini dan hanya berupaya memecah belah kita. Untuk melawan hal ini, kami akan mengizinkan orang-orang dari setiap kasta memasuki tempat ibadah mereka."
 RAJ_freedom_of_the_press: "Kebebasan Pers"
 RAJ_freedom_of_the_press_desc: "Kebebasan pers adalah sebuah persyaratan bagi negara demokrasi yang masih baru, tanpa kebebasan pers maka otoritarianisme akan segera terjadi."
 RAJ_provincial_autonomy: "Menuju Jalan Kemerdekaan"
 RAJ_provincial_autonomy_occupation_law_tt: "Membuka undang-undang pendudukan §Y$independent_rule$§! dan §Y$princely_subjugation$§! untuk Negara Bagian Pangeran"
 RAJ_provincial_autonomy_desc: "Mendapatkan tambahan otonomi provinsi dari Inggris akan menjadi langkah penting pertama menuju pemenuhan tujuan akhir, kemerdekaan."
 RAJ_provincial_autonomy_tt: "Untuk sepenuhnya membebaskan diri melalui §YTeori Dua Negara§! kita perlu menyelesaikan §YUnited Bengal§! atau §YPakistan Timur§!.\n\nUntuk sepenuhnya membebaskan diri melalui §YIndia United§! kita perlu selesaikan §YNegara Sekuler§!\n\n§Y§!Untuk sepenuhnya membebaskan diri melalui §YLeague Against Ghandism§! kita perlu menyelesaikan §YReds in the Shadow§! atau §YGive aku Darah dan aku akan memberimu Kebebasan§!"
 RAJ_princely_states_policy: "Kebijakan Negara Pangeran"
 RAJ_princely_states_policy_desc: "Negara-negara Kepangeranan hadir dalam berbagai bentuk dan ukuran, mulai dari Hyderabad yang berpengaruh hingga kerajaan-kerajaan kecil di Perbatasan Utara. Kita perlu menetapkan kebijakan tentang cara menanganinya."
 RAJ_indian_legion: "Legiun India"
 RAJ_indian_legion_desc: "Legiun India yang terdiri dari para pembangkang asing India di bawah kendali [GER.GetName] telah menjalani pelatihan ekstensif dalam peperangan gurun. Kita bisa menggunakan keahlian mereka untuk meningkatkan kekuatan kita sendiri."
 RAJ_the_pakistan_movement: "Gerakan Pakistan"
 RAJ_the_pakistan_movement_desc: "Seruan untuk tanah air umat Islam, Pakistan, semakin meningkat. Jika bentrokan antara umat Hindu dan Islam terus berlanjut seperti ini, mungkin tidak akan mungkin bisa mempertahankan persatuan India."
 RAJ_the_pakistan_movement_tt_1: "Menyegarkan hingga:\n§Y-[PAK.GetName]§! bebas\n§Y-[PAK.GetName]§! telah menyerah\n-Telah mengulangi §Y5§! kali.\n\nDi akhir semangat §Y90 hari§! siklus hidup kita akan memperoleh:"
 RAJ_the_pakistan_movement_tt_2: "Selama §Y90§! hari"
 RAJ_assam_oil_dlc: "Minyak Assam"
 RAJ_assam_oil_dlc_desc: "Kami baru-baru ini menemukan ladang minyak besar di negara bagian Assam. Dengan mendirikan perusahaan minyak negara dan membangun anjungan minyak di Assam, kita dapat meningkatkan perekonomian kita secara signifikan."
 RAJ_tata_steel_dlc: "Tata Baja"
 RAJ_tata_steel_dlc_desc: "$RAJ_tata_steel_desc$"
 RAJ_incorporation_of_the_east_india_company: "Pendirian Perusahaan India Timur"
 RAJ_incorporation_of_the_east_india_company_desc: "Setelah guncangan depresi besar dan seruan kemerdekaan yang semakin keras, jelaslah bahwa kerajaan [ENG.GetAdjective] tidak dapat lagi memikul beban pemerintahan India. Hal ini mungkin menyebabkan ketidakstabilan sementara, namun status quo tidak dapat dipertahankan."
 RAJ_incorporation_of_the_east_india_company_tt: "§YRaj§! akan dibagi antara §YPerusahaan India Timur§! dan sisa-sisa §YIndia§!"
 RAJ_special_economic_zones: "Kawasan Ekonomi Khusus"
 RAJ_special_economic_zones_desc: "Kita akan membentuk kawasan ekonomi khusus di negara kita untuk memudahkan korporasi berinvestasi, dan meringankan beban pajak korporasi tersebut."
 RAJ_seek_intial_funding: "Carilah Pendanaan Awal"
 RAJ_seek_intial_funding_desc: "Untuk meletakkan dasar bagi ambisi besar kita, kita harus mendapatkan modal dari investor [ENG.GetAdjective]. Pendanaan awal mereka akan menjadi pemicu yang menyalakan mesin perekonomian kita."
 RAJ_seek_intial_funding_tt: "Tambahkan §G3§! Slot Bangunan\nTambahkan §G3§! §YPabrik Sipil§! ke Modal kami saat menyelesaikan §Y$RAJ_incorporation_of_the_east_india_company$§!"
 RAJ_seek_intial_funding_unlock_tt: "Membuka §Y$RAJ_seek_intial_funding$§! fokus"
 has_paid_initial_funding: "Telah Membayar Dividen kepada Investor"
 RAJ_princely_autonomy: "Otonomi Pangeran"
 RAJ_princely_autonomy_tt: "Setelah melepaskan Negara Pangeran sebagai boneka, tambahkan:"
 RAJ_princely_autonomy_desc: "Anak benua ini perlahan-lahan mengalami destabilisasi. Kami akan menggunakan Pangeran setempat untuk membangun kendali. Mereka mendapatkan kemiripan dengan kekuatan lokal, dan kita dapat memetik hasilnya; selama mereka membayar kita."
 RAJ_funnel_british_investments_into_princely_states: "Menyalurkan Investasi ke Negara-negara Pangeran"
 RAJ_funnel_british_investments_into_princely_states_tt: "Setiap mata pelajaran yang berada di anak benua India akan menerima §G1§! §YPabrik Sipil§! dan §G3§! Slot Bangunan.\nMata pelajaran yang belum dirilis akan menerima bonus setelah dirilis."
 RAJ_funnel_british_investments_into_princely_states_desc: "Kerajaan telah menetapkan bahwa setiap investasi pada perusahaan tersebut dibelanjakan di India, namun Kerajaan tidak menentukan secara spesifik bahwa investasi tersebut harus dilakukan di dalam perusahaan."
 RAJ_demobilize: "Demobilisasi"
 RAJ_demobilize_desc: "Salah satu ketentuan utama dari pemerintah adalah kita harus mendemobilisasi tentara, hanya menyisakan kerangka pasukan penjaga perdamaian. Apakah mereka khawatir pasukan kita akan melebihi pasukan mereka?"
 RAJ_form_a_police_force: "Bentuk Pasukan Keamanan"
 RAJ_form_a_police_force_desc: "Meskipun pembatasan menghalangi kami untuk mempertahankan tentara formal, kami diberi wewenang untuk membentuk dan memperlengkapi pasukan keamanan dengan kedok kepolisian. Ini adalah langkah penting untuk melindungi kepentingan kita."
 RAJ_a_private_military: "Militer Swasta"
 RAJ_a_private_military_tt_1: "Membentuk Divisi Tidak Teratur dengan tenaga dan peralatan lengkap.\n\nMengirim divisi sebagai relawan akan memberikan §G1§! ke luar lokasi §YPabrik Sipil§! selama §Y365§! hari jika mereka dikirim ke negara yang sebelumnya belum pernah kita kirimkan relawannya untuk.\nMengirim sukarelawan baru ke negara yang sama setelah §Y540§! hari akan memberikan hibah kepada pabrik lagi.\n\nPabrik-pabrik ini tidak diperhitungkan dalam §YPajak§!"
 RAJ_a_private_military_desc: "Akan mudah untuk mengubah polisi setempat menjadi militer swasta. Secara teknis mereka tidak akan menjadi bagian dari tentara mana pun, namun dibayar langsung dari perusahaan, sesuai dengan ketentuan pemerintah."
 RAJ_headhunt_army_personell: "Personel Angkatan Darat Pengayauan"
 RAJ_headhunt_army_personell_desc: "Ada banyak pengangguran yang sedang naik daun dari mantan tentara yang sedang mencari pekerjaan, kami bisa menawarkan mereka tawaran yang lebih baik daripada yang bisa diberikan pemerintah."
 RAJ_lobby_for_increased_policing_responsibilities: "Lobi Untuk Peningkatan Tanggung Jawab Kepolisian"
 RAJ_lobby_for_increased_policing_responsibilities_desc: "Dunia bukan lagi tempat yang sepi seperti dulu. Meningkatnya ketegangan dari dalam dan luar memberi kita sanksi tambahan untuk melindungi properti perusahaan. Kami akan melobi peningkatan belanja PMC, tentu saja pemerintah akan melihat alasannya, dan jika tidak, setiap orang mempunyai konsekuensinya."
 RAJ_circuvment_demobilization_restrictions: "Mengakali Pembatasan"
 RAJ_circuvment_demobilization_restrictions_desc: "Pemerintah masih membatasi jumlah laki-laki yang dapat kami mobilisasi. Kerajaan harus sangat takut terhadap tentara yang tidak berada di bawah kendali mereka. Tidak masalah, ada cara untuk menghindari pembatasan ini, baik dengan menyuap atau dengan tidak memasukkan pegawai agama tertentu ke dalam angkatan bersenjata."
 RAJ_manipulate_army_statistics: "Memanipulasi Statistik Angkatan Darat"
 RAJ_manipulate_army_statistics_tt: "Menciptakan Divisi Tidak Teratur dengan tenaga dan peralatan penuh."
 RAJ_manipulate_army_statistics_desc: "Kerajaan mewaspadai PMC kita yang tumbuh terlalu besar dan berpengaruh dan pada gilirannya berpotensi menantang pasukan tetap. Ada cara untuk menenggelamkan para pengendali pemerintah dalam jumlah dan petunjuk palsu."
 RAJ_just_good_business: "Hanya Bisnis yang Bagus"
 RAJ_just_good_business_desc: "Kami sebenarnya tidak menentang rekan-rekan kami di Timur, hanya saja mereka memiliki sumber daya yang kami perlukan, ini bisnis yang bagus."
 RAJ_crush_the_anathema: "Hancurkan Kutukan itu"
 RAJ_crush_the_anathema_desc: "Komunisme adalah kutukan bagi bisnis yang baik. Uang membuat dunia berputar, dan dunia yang diperintah oleh Komunis akan menyebabkan stagnasi. Kita perlu membakar kebusukan itu."
 RAJ_nothing_personal: "Tidak ada yang bersifat pribadi"
 RAJ_nothing_personal_tt: "Menciptakan tujuan perang melawan §Y[ENG.GetNameDef]§! dan §YNegara Persemakmuran§!"
 RAJ_nothing_personal_desc: "Pemerintah sudah cukup lama memaksakan kehendaknya pada kita, menghambat pertumbuhan kita dengan menerapkan langkah-langkah kuno. Ini bukan masalah pribadi, namun pemerintah tidak bisa menjadi penyebab pertumbuhan di bawah standar."
 RAJ_bombay_trade_port: "Pelabuhan Perdagangan Bombay"
 RAJ_bombay_trade_port_desc: "Bombay berpotensi menjadi pelabuhan perdagangan kelas dunia, memfasilitasi impor dan ekspor barang dalam jumlah besar. Yang diperlukan hanyalah investasi dalam memperluas fasilitas pelabuhannya."
 RAJ_take_in_british_naval_experts: "Ambil [ENG.GetAdjective] Pakar Angkatan Laut"
 RAJ_take_in_british_naval_experts_desc: "Kami memiliki beberapa ahli angkatan laut terbaik di dunia yang tinggal di Inggris, dan membawa beberapa ahli angkatan laut ke sini akan cukup mudah."
 RAJ_the_need_for_a_mercantile_navy: "Kebutuhan Angkatan Laut Mercantile"
 RAJ_the_need_for_a_mercantile_navy_desc: "Perdagangan laut adalah cara paling penting untuk berdagang di seluruh dunia. Kita perlu memiliki angkatan laut yang mampu mengirimkan barang-barang ini, serta mempertahankannya."
 RAJ_trade_route_protection: "Perlindungan Jalur Perdagangan"
 RAJ_trade_route_protection_desc: "Di timur dan barat, kekuatan bermusuhan mulai terbentuk. Kita harus mampu bertindak sebagai pencegah terhadap siapapun yang berpikir untuk menangkap barang-barang yang melintas di perairan kita."
 RAJ_procure_the_guns: "Senjata Varuna"
 RAJ_procure_the_guns_desc: "Kita memerlukan alat pencegah yang cukup besar untuk melindungi rute kita, dan alat pencegah yang cukup besar memerlukan senjata yang besar, senjata yang sangat besar."
 RAJ_procure_the_task_force: "Satgas Varunas"
 RAJ_procure_the_task_force_desc: "Bahkan kapal terbesar pun memerlukan pengawalan untuk melindungi mereka dari kapal musuh. Dengan membentuk gugus tugas angkatan laut yang kuat, kita dapat memastikan kapal-kapal besar kita dapat melaksanakan tujuan utamanya."
 RAJ_procure_the_armor: "Armor Varuna"
 RAJ_procure_the_armor_desc: "Varuna membutuhkan baju besi yang berat, baju besi yang sangat berat. Membuat prototipe pada proyek yang lebih murah untuk menjaga biaya tetap rendah adalah suatu keharusan."
 RAJ_institutional_money_laundering: "Pencucian Uang Institusional"
 RAJ_institutional_money_laundering_desc: "Investor tidak perlu tahu ke mana uang sebenarnya pergi? Bukankah itu tujuan kita, bukan keharusan untuk memaksimalkan keuntungan dengan cara apa pun? Lalu bagaimana jika hal itu melibatkan sedikit penipuan? Mereka tidak akan menjadi lebih bijaksana."
 RAJ_institutional_money_laundering_tt: ""
 RAJ_appoint_a_c_suite: "Tunjuk AC Suite"
 RAJ_appoint_a_c_suite_desc: "Kepemimpinan perusahaan yang kuat sangat penting bagi keberhasilan kita. Dengan membentuk tim eksekutif yang cakap, kami akan memastikan manajemen yang efektif, visi strategis, dan pertumbuhan yang konsisten."
 RAJ_company_bonuses: "Bonus Perusahaan"
 RAJ_company_bonuses_desc: "Kami akan mengaitkan kinerja dengan potensi bonus untuk meningkatkan efisiensi di seluruh perusahaan."
 RAJ_creative_accounting: "Akuntansi Kreatif"
 RAJ_creative_accounting_desc: "Dengan menggunakan beberapa trik akuntansi yang kreatif, kita dapat menghilangkan sebagian dari keuntungan kita, atau setidaknya itulah yang diyakini oleh otoritas pajak."
 RAJ_privatized_healthcare: "Layanan Kesehatan yang Diprivatisasi"
 RAJ_privatized_healthcare_desc: "Seruan untuk skema layanan kesehatan komunis harus dibatasi di seluruh wilayah kita. Pelayanan kesehatan harus diberikan kepada mereka yang mendapatkannya melalui tangan pasar yang tidak kasat mata."
 RAJ_arrest_congress_leaders: "Tangkap Pemimpin Kongres"
 RAJ_arrest_congress_leaders_desc: "Para pemimpin Kongres tidak akan menyesuaikan diri dengan realitas baru dalam pemerintahan perusahaan. Mereka tetap melawan dan membuat kekacauan sekecil apa pun. Kita perlu membasmi para pengganggu sebelum menyebar."
 RAJ_union_busting: "Penghancuran Serikat"
 RAJ_union_busting_desc: "Serikat pekerja merupakan penghambat inovasi dan kemajuan yang berdasarkan prestasi, tidak melakukan apa pun untuk membantu pekerja dan menenggelamkan perusahaan dalam birokrasi. Hancurkan agenda komunis ini sebelum menyebar."
 RAJ_night_shifts: "Pergeseran Malam"
 RAJ_night_shifts_desc: "Memperkenalkan shift malam akan meningkatkan kapasitas operasional dan mempercepat produksi. Biaya tambahan adalah harga kecil yang harus dibayar untuk efisiensi sepanjang waktu."
 RAJ_legalize_the_opium_trade: "Legalkan Perdagangan Candu"
 RAJ_legalize_the_opium_trade_desc: "Meski kontroversial, legalisasi opium menjanjikan keuntungan ekonomi yang sangat besar. Dengan mengatur perdagangannya, kita dapat mengubah sifat buruk menjadi landasan strategi keuangan kita yang menguntungkan."
 RAJ_force_china_to_accept_opium_trade: "Perang Candu Ketiga"
 RAJ_force_china_to_accept_opium_trade_tt: "Pasar opium di seluruh dunia akan muncul. Beberapa jenderal mungkin terlalu menyukai ini..."
 RAJ_force_china_to_accept_opium_trade_desc: "[CHI.GetName] telah mencoba mengendalikan perdagangan opiumnya, yang secara langsung bertentangan dengan tujuan pertumbuhan kita. Kita perlu memastikan mereka melihat kesalahan mereka."
 RAJ_new_economic_policy: "Kebijakan Ekonomi Baru"
 RAJ_new_economic_policy_desc: "Kami akan mematuhi model yang mendorong penanaman modal dan pertumbuhan perusahaan dengan menerapkan kebijakan pajak rendah dan ramah bisnis."
 RAJ_phantom_armies: "Tentara Hantu"
 RAJ_phantom_armies_desc: "Jika kita meningkatkan jumlah personel militer yang kita pekerjakan di neraca, kita bisa menipu kantor pajak."
 RAJ_corporate_domination: "Dominasi Perusahaan"
 RAJ_corporate_domination_desc: "Ketika kita mengkonsolidasikan kendali atas anak benua ini, kita dapat semakin mendominasi sektor swasta dan publik. Dengan tujuan kami untuk mengendalikan secara total, baik langsung maupun tidak langsung, kami dapat meningkatkan produktivitas di seluruh perusahaan."
 RAJ_restrictive_administration_budget: "Anggaran Administrasi yang Membatasi"
 RAJ_restrictive_administration_budget_desc: "Untuk menjaga disiplin fiskal, semua pengeluaran yang tidak penting harus dihilangkan. Efisiensi menuntut kita memfokuskan sumber daya agar menghasilkan keuntungan yang terukur."
 RAJ_open_up_new_markets: "Buka Pasar Baru"
 RAJ_open_up_new_markets_desc: "Kita berisiko memenuhi pasar kita saat ini di tahun-tahun mendatang kecuali kita mengambil tindakan drastis untuk mengembangkannya. Oleh karena itu, kita akan terlibat dalam pengambilalihan wilayah tetangga secara bermusuhan."
 RAJ_hostile_takeover: "Pengambilalihan yang Bermusuhan"
 RAJ_hostile_takeover_tt: "Membuka keputusan untuk membeli negara bagian untuk §YPabrik Sipil§!. Negara tempat kami awalnya memulai mendapat diskon saat membeli."
 RAJ_hostile_takeover_desc: "Semuanya bisa dibeli, semuanya. Ini hanya masalah harga dan seberapa besar keinginan seseorang untuk tunduk."
 RAJ_shareholder_democracy: "Demokrasi Pemegang Saham"
 RAJ_shareholder_democracy_desc: "Kekuasaan legislatif di suatu negara terletak pada perusahaan namun hanya pada nama saja. Para hakim dan badan legislatif semuanya digaji oleh kita, sehingga kita dapat dengan mudah mengesahkan undang-undang yang menguntungkan dan memecah belah oposisi."
 RAJ_debt_manipulation: "Manipulasi Hutang"
 RAJ_debt_manipulation_desc: "Kita bisa menggunakan utang yang ada untuk memalsukan kerugian, artinya kita membayar pajak lebih sedikit dan bisa menimbun kelebihan keuntungan."
 RAJ_productivity_mandate: "Mandat Produktivitas"
 RAJ_productivity_mandate_desc: "Terikat oleh komitmen kami kepada investor, kami terpaksa memaksimalkan output di semua sektor. Produktivitas bukan lagi sebuah tujuan; ini adalah sebuah mandat, dan harus dicapai dengan cara apa pun."
 RAJ_lowest_bigger_construction: "Potong Biaya Konstruksi"
 RAJ_lowest_bigger_construction_desc: "Kita harus selalu memilih penawar terendah secara default agar biaya pembangunan tetap rendah."
 RAJ_water_privatization: "Privatisasi Air"
 RAJ_water_privatization_desc: "Kami akan menjalin kemitraan publik-swasta dengan pemasok air lokal untuk meningkatkan efisiensi dan kualitas layanan."
 RAJ_expand_tax_loopholes: "Perluas Celah Pajak"
 RAJ_expand_tax_loopholes_desc: "Dengan mengeksploitasi kesenjangan dalam peraturan perpajakan, kami secara hukum dapat meminimalkan kewajiban kami dan menginvestasikan kembali tabungan tersebut untuk ekspansi lebih lanjut. Bagaimanapun, efisiensi dimulai dari neraca."
 RAJ_land_grab: "Pembebasan Tanah"
 RAJ_land_grab_desc: "Untuk memenuhi tuntutan industrialisasi yang pesat, kita harus memperoleh dan menggunakan kembali lahan di seluruh benua ini. Ekspansi menyisakan sedikit ruang untuk keraguan ketika kemajuan harus didahulukan."
 RAJ_deforestation: "Bahan Bakar untuk Api"
 RAJ_deforestation_desc: "Industri bahan bakar api. Api membutuhkan kayu dan batu bara, dan kita mempunyai banyak bahan bakar, jadi mengapa tidak menggunakannya?"
 RAJ_agricultural_cooperatives: "Koperasi Pertanian"
 RAJ_agricultural_cooperatives_tt: "Keuntungan §G1§! §YInfrastruktur§! di setiap negara bagian yang dimiliki dengan setidaknya 4 §YPabrik Sipil§!.\nKeuntungan §G1§! §YPabrik Sipil§! untuk setiap 2 §YInfrastruktur§! diperoleh dari fokus ini."
 RAJ_agricultural_cooperatives_desc: "Koperasi pertanian yang dimiliki oleh beberapa petani merupakan kunci keberlanjutan, kemandirian dan pemberdayaan."
 RAJ_tea_exports: "Ekspor Teh"
 RAJ_tea_exports_tt: "§YDapat diperluas hingga 5 kali§!"
 RAJ_tea_exports_tt_2: "Setelah memperoleh kemerdekaan menghapus §Y$idea_RAJ_tea_exports$§! dan"
 RAJ_tea_exports_desc: "Teh telah menjadi ekspor utama di seluruh dunia dan merupakan landasan kehidupan banyak orang India."
 RAJ_cottage_industries: "Industri Pondok"
 RAJ_cottage_industries_desc: "Bisnis dan manufaktur yang dilakukan di rumah-rumah penduduk merupakan alternatif yang layak dibandingkan manufaktur berat dan memberikan rasa kemandirian pada masyarakat."
 RAJ_sikh_religious_guarantees: "Jaminan Keagamaan Sikh"
 RAJ_sikh_religious_guarantees_desc: "Kaum Sikh adalah agama minoritas yang penting dan pejuang yang tangguh. Kita perlu menenangkan mereka dengan menjamin hak beragama mereka."
 RAJ_punjab_autonomy: "Otonomi Punjab"
 RAJ_punjab_autonomy_desc: "Punjab mempunyai arti penting bagi kaum Sikh dan dengan memberi mereka otonomi daerah, kita dapat memperoleh kepercayaan mereka."
 RAJ_handloom_weaving: "Tenun Alat Tenun Tangan"
 RAJ_handloom_weaving_desc: "Tenun alat tenun tangan telah menjadi simbol tradisi dan kemandirian di benua ini, sekaligus memberikan peluang kerja bagi produsen lokal."
 RAJ_lahore_resolution: "Resolusi Lahore"
 RAJ_lahore_resolution_desc: "Minoritas Muslim di negara tersebut telah mengadopsi resolusi Lahore, yang menyerukan tanah air mereka sendiri; Pakistan."
 RAJ_united_bengal: "Benggala Bersatu"
 RAJ_united_bengal_tt: "§Y[BAN.GetName]§! akan gratis saat dipartisi"
 RAJ_united_bengal_desc: "Memisahkan Pakistan menjadi dua negara, Bengal dan Pakistan merupakan hal yang masuk akal. Pemerintahan di Pakistan tidak akan mampu mengatur dengan baik daerah kantong Bangladesh yang letaknya jauh."
 RAJ_eastern_pakistan: "Pakistan Timur"
 RAJ_eastern_pakistan_tt: "§Y[BAN.GetName]§! akan dimiliki oleh §Y[PAK.GetName]§! setelah dipartisi"
 RAJ_eastern_pakistan_desc: "Bangladesh akan menjadi Pakistan Timur, dan seluruh umat Islam akan diperintah di bawah satu bendera."
 RAJ_partition_preparation: "Persiapan Partisi"
 RAJ_partition_preparation_tt: "§YAkan mengurangi dampak partisi setelah terjadi§! Dengan Persiapan kita akan mendapatkan:"
 RAJ_partition_preparation_tt_2: "Dan tanpanya kita akan mendapatkan:"
 RAJ_partition_preparation_desc: "Kita perlu mempersiapkan diri untuk melakukan pemisahan, jangan sampai kita mengalami kekacauan yang akan terjadi seiring dengan perpindahan jutaan orang."
 RAJ_indian_independence_act: "Undang-Undang Kemerdekaan India"
 RAJ_indian_independence_act_desc: "Akan tiba saatnya, yang jarang terjadi dalam sejarah, ketika kita melangkah keluar dari masa lalu menuju masa baru, ketika sebuah zaman berakhir, dan ketika jiwa sebuah bangsa, yang telah lama tertekan, menemukan jawabannya."
 RAJ_tryst_with_destiny: "Percobaan Dengan Takdir"
 RAJ_tryst_with_destiny_desc: "Bertahun-tahun yang lalu kita mengadakan pertemuan dengan takdir, dan kini saatnya tiba ketika kita harus menebus janji kita, tidak seluruhnya atau seluruhnya, namun secara substansial. Tepat tengah malam, ketika dunia tertidur, India akan terbangun untuk hidup dan kebebasan."
 RAJ_india_united: "India Bersatu"
 RAJ_india_united_tt: "§YIndia akan tetap bersatu selama partisi dan tidak terpecah§!"
 RAJ_india_united_desc: "Kami adalah Muslim, Hindu, Kristen, Yahudi; kita semua adalah India."
 RAJ_power_sharing_agreement: "Perjanjian Pembagian Kekuasaan"
 RAJ_power_sharing_agreement_desc: "Liga Muslim memandang kita dengan curiga, takut dengan apa yang akan terjadi pada umat Islam di India yang didominasi Hindu. Kami akan mengadakan perjanjian dengan mereka untuk membagi kekuasaan secara setara."
 RAJ_cabinet_mission_plan: "Rencana Misi Kabinet"
 RAJ_cabinet_mission_plan_desc: "Dengan front persatuan umat Islam dan Hindu kami siap menghadapi delegasi yang dikirim dari pemerintah [ENG.GetAdjective]."
 RAJ_inclusive_nationalism: "Nasionalisme Inklusif"
 RAJ_inclusive_nationalism_desc: "Nasionalisme dan kebanggaan terhadap negara tidak selalu berarti buruk, selama kita bisa memupuknya agar menjadi inklusif bagi semua orang. Ikatan tidak akan putus jika kita semua memiliki rasa cinta yang sama terhadap bangsa."
 RAJ_a_secular_state: "Negara Sekuler"
 RAJ_a_secular_state_desc: "India adalah negara yang religius, namun penting bagi negara itu untuk bersifat sekuler agar tidak ada keraguan mengenai potensi bias terhadap kelompok minoritas."
 RAJ_a_permanent_muslim_governmental_seat: "Kursi Pemerintahan Muslim Permanen"
 RAJ_a_permanent_muslim_governmental_seat_desc: "Umat Islam merupakan minoritas terbesar di negara kami, dan untuk meredakan kegelisahan yang mungkin mereka miliki terhadap India bersatu, kami akan memberi mereka kursi pemerintahan permanen."
 RAJ_pledge_for_the_allies: "Janji Untuk Sekutu"
 RAJ_pledge_for_the_allies_desc: "Dengan meningkatnya fasisme dan komunisme di seluruh dunia, India tidak dapat berdiri sendiri. [ENG.GetName] mungkin bukan teman India, tapi jelas bahwa negara lain adalah musuh kita."
 RAJ_indian_prosperity_sphere: "Lingkungan Kemakmuran India"
 RAJ_sideline_the_conflict: "Sampingan Konflik"
 RAJ_sideline_the_conflict_desc: "Tidak jelas mengapa [ROOT.GetName] harus menderita karena kesalahan penilaian pihak lain dan agresi teritorial. Kita perlu fokus secara internal, bukan eksternal."
 RAJ_india_indivisible: "India Tidak Dapat Dibagi"
 RAJ_india_indivisible_tt: "Membuka keputusan untuk negara bagian inti §YIndia§!, §YPakistan§! dan §YBangladesh§!"
 RAJ_india_indivisible_desc: "Wilayah kami masih dipenuhi kegelisahan dan konflik. Kita perlu bekerja sama untuk membuat [ROOT.GetName] utuh."
 RAJ_preamble_to_the_constitution_of_india: "Pembukaan UUD [GetRajName]"
 RAJ_preamble_to_the_constitution_of_india_desc: "Kami, rakyat [GetRajName], dengan sungguh-sungguh memutuskan untuk membentuk [GetRajName] menjadi sebuah republik demokrasi sekuler sosialis yang berdaulat dan untuk menjamin keadilan, kebebasan, kesetaraan bagi semua warga negaranya dan untuk memajukan persaudaraan di antara mereka semua di majelis konstituante kami pada hari ini."
 RAJ_an_economy_unbound: "Perekonomian yang Tidak Terikat"
 RAJ_an_economy_unbound_desc: "Tidak lagi dikekang oleh penguasa, perekonomian kita akhirnya bisa berkembang, terlepas dari kewajiban-kewajiban sebelumnya."
 RAJ_annex_goa: "Lampiran Goa"
 RAJ_annex_goa_desc: "Goa adalah milik India yang pernah dikalahkan oleh kekuatan imperialis, dan jelas bahwa [POR.GetName] tidak mampu mempertahankannya. Kita perlu memperbaiki kesalahan bersejarah ini."
 RAJ_a_tiger_uncained: "Seekor Harimau Tanpa Rantai"
 RAJ_a_tiger_uncained_desc: "Sudah terlalu lama kita ditaklukkan oleh kerajaan-kerajaan yang berbeda, terikat pada kekuasaan kekaisaran. Tidak akan pernah lagi, seperti seekor harimau yang akhirnya terbebas dari para penculiknya, ia tidak akan pernah lagi ditaklukkan dengan sukarela."
 RAJ_suppress_paramilitary_organizations: "Menekan Organisasi Paramiliter"
 RAJ_suppress_paramilitary_organizations_desc: "Masih terdapat perbedaan kelompok paramiliter di [GetRajName]. Kita perlu mencabutnya dengan cepat, karena jika gulma sudah tertanam kuat di dalam tanah, akarnya akan sulit dicabut."
 RAJ_defend_burma: "Pertahankan Burma"
 RAJ_defend_burma_desc: "[BRM.GetName] bertindak sebagai benteng melawan agresi [JAP.GetName]. Memperkuat posisi mereka hanya bermanfaat bagi kami."
 RAJ_mixed_economy: "Ekonomi Campuran"
 RAJ_mixed_economy_tt: "Dapatkan §G+3§! sumber daya untuk setiap §YTeknologi Penggalian§! yang diteliti di setiap negara bagian awal dengan lebih dari 6 sumber daya di dalamnya"
 RAJ_mixed_economy_desc: "Kita mempunyai banyak sumber daya alam, melakukan diversifikasi ke ekstraksi mineral akan memperkuat kemandirian kita."
 RAJ_land_reforms: "Reformasi Pertanahan"
 RAJ_land_reforms_desc: "Memberi lebih banyak orang kemampuan untuk menggunakan tanah yang mereka miliki akan mengangkat mereka dari kemelaratan."
 RAJ_education_efforts: "Upaya Pendidikan"
 RAJ_education_efforts_2: "$RAJ_education_efforts$"
 RAJ_education_efforts_desc: "Angka melek huruf di [ROOT.GetName] masih rendah. Kita perlu meningkatkan belanja pendidikan secara drastis untuk mengejar ketertinggalan dari negara-negara besar."
 RAJ_education_efforts_2_desc: "$RAJ_education_efforts_desc$"
 RAJ_fight_malnutrition: "Melawan Malnutrisi"
 RAJ_attract_scientists: "Menarik Ilmuwan"
 RAJ_attract_scientists_desc: "Dengan kekayaan kita yang besar, kini kita dapat menarik ilmuwan-ilmuwan terbaik dari seluruh dunia."
 RAJ_fight_malnutrition_desc: "Kita perlu menerapkan rencana ekstensif untuk memerangi malnutrisi di kalangan masyarakat."
 RAJ_import_substitution_industrialisation: "Industrialisasi Substitusi Impor"
 RAJ_import_substitution_industrialisation_desc: "Kapanpun kita bisa, kita harus mengganti barang impor dengan barang dalam negeri dengan mengimbangi biaya produksinya."
 RAJ_i_am_death: "Akulah Kematian"
 RAJ_i_am_death_desc: "Pemimpin kita, dalam keadaan kesurupan setelah upaya pembunuhannya muncul. Merenungkan kebrutalan cobaan yang dialaminya, ia mendapat pencerahan, jika kekejaman terhadap umat manusia tidak dapat dicegah, maka seluruh umat manusia harus berada di bawah kendali demokrasinya yang kuat."
 RAJ_destroyer_of_worlds: "Penghancur Dunia"
 RAJ_destroyer_of_worlds_desc: "Pada waktunya kita akan tumbuh menjadi penghancur dunia yang kuat, tumbuh di sini untuk memusnahkan musuh-musuh kita."
 RAJ_uranium_tipped_bullets: "Peluru Berujung Uranium"
 RAJ_uranium_tipped_bullets_desc: "Apa yang akan kita lakukan dengan sisa uranium kita, tapi kita tidak bisa menggunakan uranium tersebut?"
 RAJ_uranium_tipped_bullets_tt: "§Y$category_all_infantry$§!:\nSerangan Keras: §G+25%§!\nTindik: §G+100%§!\n§Y$category_cavalry$§!:\nKeras Serangan: §G+10%§!\nTindik: §G+40%§!\n§Y$category_artillery$§!:\nTindik: §G+100%§!\n§Y$category_tank_destroyers$§!\nSerangan Keras: §G+15%§!\nMenusuk: §G+20%§!\n§Y$anti_tank$§!\nSerangan Keras: §G+10%§!\nMenusuk: §G+20%§!\n§Y$mot_anti_tank_brigade$§!\nSerangan Keras: §G+10%§!\nMenusuk: §G+20%§!\n§Y$anti_air$§!\nSerangan Anti-Udara: §G+10%§!\n§Y$mot_anti_air_brigade$§!\nSerangan Anti-Udara: §G+10%§!"
 RAJ_contamination_cleanup_crew: "Kru Pembersihan Kontaminasi"
 RAJ_contamination_cleanup_crew_desc: "Prajurit kita harus siap berperang dalam kondisi yang paling keras, bahkan ketika terjadi dampak nuklir."
 RAJ_rolling_nuke_barrages: "Rentetan Nuklir Bergulir"
 RAJ_rolling_nuke_barrages_desc: "Rentetan serangan bergilir adalah hal biasa selama perang Besar. Teknologi baru memungkinkan terjadinya serangan yang lebih dahsyat."
 RAJ_bathe_in_hellfire: "Mandi Di Api Neraka"
 RAJ_bathe_in_hellfire_desc: "Musuh kita hanya punya dua alternatif: mengantre, atau menghadapi tumpukan kayu."
 RAJ_bathe_in_hellfire_desc_tt: "§YNukes§! sekarang menghancurkan §Y50%§! dari negara target §YPabrik Militer§! secara permanen.\n§YNuklir Termonuklir§! sekarang menghancurkan §Y100%§! dari negara target §YPabrik Militer§! secara permanen."
 RAJ_jaguar: "jaguar"
 RAJ_jaguar_desc: "Jaguar adalah kandidat utama untuk mewujudkan keadilan demokratis dari atas."
 RAJ_ammunition_factory_khadki: "Pabrik Amunisi Khadki"
 RAJ_ammunition_factory_khadki_desc: "Untuk mempunyai kemampuan menyediakan senjata bagi kekuatan tempur modern, kita perlu memperluas pabrik-pabrik persenjataan di negara kita secara drastis."
 RAJ_rifle_factory_ishapore_west_bengal: "Pabrik Senapan Ishapore"
 RAJ_rifle_factory_ishapore_west_bengal_desc: "Pabrik Senapan Ishapore akan bekerja sama dengan pabrik Khadki untuk menyediakan senjata ringan kepada tentara."
 RAJ_gun_and_shell_factory_cossipore: "Pabrik Senjata dan Cangkang"
 RAJ_gun_and_shell_factory_cossipore_desc: "Pabrik Cassiopore akan semakin meningkatkan kemampuan kami dalam hal Peralatan Infanteri serta penyediaan amunisi bagi pasukan."
 RAJ_cordite_factory_aruvankadu_tamil_nadu: "Pabrik Cordite Aruvankadu"
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc: "Memiliki bahan bakar yang bagus untuk artileri akan membuat senjata berat kita unggul dibandingkan musuh."
 RAJ_local_recruitment_offices: "Kantor Perekrutan Lokal"
 RAJ_local_recruitment_offices_desc: "Kita mempunyai populasi yang besar, banyak dari mereka bersedia menjadi sukarelawan menjadi tentara sebagai cara untuk memperbaiki situasi ekonomi mereka, daripada kita harus meminta rancangan undang-undang secara umum. Mendirikan kantor perekrutan akan memberi kita banyak sukarelawan."
 RAJ_local_recruitment_offices_tt: "Setiap [?RAJ_recruitment_offices_timeout_max] bulan akan mengurangi denda §Y$idea_RAJ_agrarian_society$§! sebesar\n\t Faktor Populasi yang Dapat Direkrut: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\nKecepatan Mobilisasi: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\nHukum Mobilisasi Faktor Biaya: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_military_pensions: "Pensiun Militer"
 RAJ_military_pensions_desc: "Memberikan pensiun militer sebagai bagian dari paket militer akan memperkuat kompleks militer secara keseluruhan dengan mempertahankan staf lebih lama."
 RAJ_legacy_of_military_service: "Warisan Dinas Militer"
 RAJ_legacy_of_military_service_desc: "Ada banyak desa di sekitar [GetRajName] dimana para ayah bertugas di militer, sehingga anak laki-laki mereka juga mendapat tekanan. Bagaimanapun, ini adalah tradisi dan kita dapat menggunakan ini untuk mengumpulkan lebih banyak rekrutan daripada biasanya."
 RAJ_indian_states_force: "Angkatan Negara India"
 RAJ_indian_states_force_desc: "Negara-negara pangeran memiliki kekuatan mereka sendiri yang dapat dipanggil untuk mempertahankan [GetRajName]."
 RAJ_frontier_corps: "Korps Perbatasan"
 RAJ_frontier_corps_desc: "Negara kita terdiri dari beberapa bioma, di antaranya adalah daerah perbatasan yang terjal di bagian timur. Menghubungi milisi di sana dan menggabungkan keahlian mereka dalam perang lingkungan yang kejam akan menjadi keuntungan bagi kami."
 RAJ_seven_shackles: "Tujuh Belenggu"
 RAJ_seven_shackles_2: "Keempat hingga Keenam dari Tujuh Belenggu"
 RAJ_release_subjects_hint_tt: "§YSubjek yang kami keluarkan dari anak benua akan lebih cenderung memprioritaskan fokus industri dibandingkan fokus lainnya.§!"
 RAJ_famine_impact_reduction: "§YHal ini akan mengurangi dampak Kelaparan ketika terjadi§!"
 has_arrested_bose: "Pemerintah Inggris telah menangkap Subhas Chandra Bose"
 RAJ_heavy_industries: "Industri Berat"
 RAJ_heavy_industries_desc: "Industrialisasi yang pesat sangat penting untuk mengamankan masa depan [RAJ.GetName]. Dengan mengembangkan sektor industri berat yang kuat, kita meletakkan dasar bagi kekuatan militer dan kemandirian ekonomi di dunia modern."
 RAJ_strike_against_china: "Serang terhadap [CHI.GetName]"
 RAJ_strike_against_china_desc: "Jika [CHI.GetName] menjadi kekuatan regional mereka akan menyerang kita, mungkin tidak hari ini, tapi pasti besok. Kita harus menyerang terlebih dahulu"
 RAJ_strike_burma: "Pukul [BRM.GetNameDef]"
 RAJ_strike_burma_desc: "Keberlanjutan keberadaan [BRM.GetName] menimbulkan ancaman strategis di perbatasan timur kita. Dengan mengendalikannya, kita dapat mengamankan perbatasan dan menghilangkan potensi pijakan bagi kekuatan asing."
 RAJ_cult_of_personality: "$GUAY_cult_of_personality$"
 RAJ_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"
 RAJ_seek_financial_aid_from_the_ussr: "Mintalah Bantuan Keuangan dari [SOU.GetNameDef]"
 RAJ_seek_financial_aid_from_the_ussr_desc: "Untuk mencapai tujuan revolusioner dan mempercepat pembangunan nasional, kami akan meminta bantuan keuangan kepada [SOU.GetNameDefCap]. Dukungan mereka dapat membantu kita membangun tatanan baru yang didasarkan pada solidaritas dan kekuatan."
 RAJ_guided_democracy: "Demokrasi Terpimpin"
 RAJ_guided_democracy_desc: "Proses demokrasi yang dikelola dengan hati-hati akan memberikan kesan adanya pilihan sekaligus memastikan hasil-hasilnya tetap berada di bawah kendali kita. Stabilitas memerlukan bimbingan, dan kami siap menawarkannya."
 RAJ_authoritarianship: "Otoritarianisme"
 RAJ_authoritarianship_desc: "Otoritas terpusat yang kuat akan menjamin perdamaian, keadilan dan stabilitas bagi negara baru kita."
 RAJ_the_sun_sets: "Matahari Terbenam"
 RAJ_the_sun_sets_desc: "Era kekaisaran telah berakhir. Ketika cengkeraman [ENG.GetAdjective] melemah, kami akan mempercepat penurunannya. Matahari akhirnya akan terbenam di kerajaan mereka, dan kita akan bangkit dari bayang-bayangnya."
### Mughal Empire ###
 RAJ_great_depression_price_controls: "Pengendalian Harga Depresi Hebat"
 RAJ_great_depression_price_controls_desc: "Depresi Hebat menghantam benua ini dengan keras. Dengan mengikat Rupee ke Sterling dan menerapkan berbagai pengendalian harga, kami berharap dapat menstabilkan situasi."
 RAJ_look_to_the_past: "Lihatlah ke Masa Lalu"
 RAJ_look_to_the_past_desc: "Pengendalian harga berhasil memitigasi salah satu faktor depresi besar, namun akibatnya pengendalian tersebut kini menimbulkan malapetaka pada perekonomian dengan inflasi yang semakin tidak terkendali. Keputusasaan berujung pada perbedaan pendapat, dan semakin banyak pemimpin lokal yang menemukan kekuatan politik dengan membuat marah masyarakat dengan kisah-kisah kehebatan masa lalu.\nApakah yang dulu bisa bangkit kembali?"
 RAJ_secure_weapons: "Senjata Aman"
 RAJ_secure_weapons_desc: "Peralatan militer kita merupakan varian yang tidak cocok dari sejumlah negara. Namun, dengan sedikit bantuan dari luar negeri kita bisa mendapatkan perlengkapan untuk persiapan membebaskan diri"
 RAJ_secure_weapons_tt: "Senjata akan ditambahkan ke timbunan setelah menyelesaikan §Y$RAJ_the_mughal_uprising$§!."
 RAJ_stir_unrest_in_the_north: "Menimbulkan Kerusuhan di Utara"
 RAJ_stir_unrest_in_the_north_desc: "Masyarakat di bagian utara Raj terkena dampak yang sangat besar dari pengendalian harga. Mereka ibarat rumput kering, yang kita butuhkan hanyalah percikan api untuk menyalakan apinya."
 RAJ_stir_unrest_in_the_north_focus_tt: "Kami akan tetap mengontrol kondisi berikut saat kami melepaskan diri:"
 MUGHAL_divisions_spawned: "§Y4§! divisi loyalis yang lengkap akan bergabung dengan kita saat kita memicu pemberontakan."
 RAJ_the_mughal_uprising: "Pemberontakan Mughal"
 RAJ_the_mughal_uprising_desc: "Wilayah terpencil di utara bertindak sebagai lokasi geografis yang sempurna untuk melepaskan diri dari Inggris.\nPara pemimpin lokal telah mengobarkan api di hati masyarakat tentang kisah-kisah masa lalu yang gemilang, ketika Mughal memerintah negeri ini, bebas menentukan nasib mereka sendiri.\nInsya Allah, kami juga akan demikian."
 RAJ_the_mughal_uprising_tt: "Kami akan melepaskan diri dari §YKerajaan Inggris§! dan §Rmenyatakan perang untuk kemerdekaan§!."
 RAJ_the_mughal_uprising_tt2: "Kami akan memiliki semua negara bagian yang kami kendalikan setelah perang saudara berakhir" #separate into two if I need to remove it later
 6_month_timer_mughal_tt: "Kita akan memiliki §Y255§! hari untuk memenangkan perang ini sebelum pemerintahan devolusi menawarkan gencatan senjata."
 RAJ_reform_the_agricultural_system: "Reformasi Sistem Pertanian"
 RAJ_reform_the_agricultural_system_desc: "Sudah terlalu lama sistem pangan India dilanda pengabaian, salah urus, dan eksploitasi. Dengan dipulihkannya Kekaisaran Mughal, kita harus memastikan bahwa tidak ada rakyat yang kelaparan lagi. Dengan berinvestasi di bidang irigasi, modernisasi pertanian, dan mematahkan cengkeraman tuan tanah yang bersifat predator, kita akan mengubah India menjadi negeri yang kaya raya, di mana kelaparan masih menjadi peninggalan masa lalu."
 RAJ_princley_state_breakaway_tt: "§Y[442.GetName]\n[987.GetName]\n[988.GetName]\n[444.GetName]\n[445.GetName]\n[1012.GetName]§!"
 RAJ_GOE_enforced_peace_decision: "Gencatan Senjata Mendekati"
 RAJ_GOE_enforced_peace_decision_desc_tt: "Jika kami berhasil bertahan cukup lama, pemerintah [UK_INDIA.GetAdjective] akan menawarkan gencatan senjata kepada kami."
 RAJ_GOE_enforced_peace_decision_desc_eng_tt: "Jika [RAJ.GetName] bertahan cukup lama, pemerintah [UK_INDIA.GetAdjective] akan menawarkan mereka gencatan senjata dengan konsesi teritorial."
 RAJ_GOE_enforced_peace_decision_desc_2_tt: "§YKami akan mempertahankan kendali atas salah satu wilayah berikut§!: §YIndia Barat§!, §YIndia Selatan§!, §YIndia Tengah§!, §YIndia Timur§!, dan §YUtara India§! dengan syarat kami mengendalikan semua negara bagian di wilayah tertentu ketika gencatan senjata mulai berlaku."
