 AFG_expand_telegraph_network: "Perluas Jaringan Telegraf"
 AFG_expand_telegraph_network_desc: "[ROOT.GetNonIdeologyName] telah tertinggal dibandingkan negara tetangganya dalam berbagai metrik ekonomi. Langkah pertama untuk memodernisasi perekonomian kita adalah meningkatkan komunikasi antara kota-kota kita dan tetangga kita dengan memperluas jaringan telegraf."
 AFG_increase_agricultural_exports: "Meningkatkan Ekspor Pertanian"
 AFG_increase_agricultural_exports_desc: ""
 AFG_sugar_processing: "Pabrik Gula Baghlan"
 AFG_sugar_processing_desc: "Permintaan gula terus meningkat di kalangan masyarakat kita. Kita harus memenuhi permintaan tersebut dengan mendirikan pabrik gula untuk mengolah produk pertanian menjadi bahan yang berharga. Permintaan tidak hanya akan terpenuhi, tetapi lebih banyak lapangan kerja industri akan tercipta."
 AFG_fruit_packing: "Pengolahan Buah"
 AFG_fruit_packing_desc: "Masyarakat [ROOT.GetNonIdeologyName] adalah petani yang mampu, kelebihan produksi harus kita manfaatkan dengan mengemasnya untuk diekspor. Untuk melakukan hal ini, kita harus membangun lebih banyak fasilitas pengolahan industri."
 AFG_clear_malarial_swamps: "Bersihkan Rawa Malaria"
 AFG_clear_malarial_swamps_desc: "Malaria masih menjadi momok di banyak wilayah di negara ini. Dengan membersihkan wilayah tempat berkembang biaknya parasit pembawa malaria, kita dapat menghilangkan keluhan lama penduduk pedesaan dan mengklaim lahan baru untuk pembangunan."
 AFG_infrastructure_construction: "Investasi Infrastruktur"
 AFG_infrastructure_construction_desc: "Kurangnya infrastruktur di seluruh negeri menghambat pembangunan ekonomi, membuat masyarakat puas menjalani kehidupan seperti yang dilakukan nenek moyang mereka selama berabad-abad. Pandangan seperti ini bukan merupakan kepentingan jangka panjang negara dan harus diperbaiki dengan melakukan investasi pada proyek infrastruktur."
 AFG_expand_karakul_lambskin_industry: "Memperluas Industri Kulit Domba Karakul"
 AFG_expand_karakul_lambskin_industry_desc: "Produk kulit domba Karakul merupakan salah satu dari sedikit barang yang saat ini diekspor dalam jumlah besar dari [ROOT.GetNonIdeologyName]. Kita dapat menggunakan hal ini sebagai peluang untuk memperluas basis industri baru kita dengan mendirikan pabrik-pabrik yang mengolah dan mengekspor produk-produk tersebut."
 AFG_spinzar_cotton_factory: "Berinvestasi di Pabrik Kapas Spinzar"
 AFG_spinzar_cotton_factory_desc: "Pabrik Kapas Spinzar di Kunduz saat ini merupakan salah satu pabrik kami yang paling menguntungkan, dan pemiliknya ingin mengembangkan bisnis mereka. Namun tanpa dukungan pemerintah, negara ini tidak akan bisa berkembang melebihi ukurannya saat ini. Kita harus berusaha keras untuk mendirikan anak perusahaan baru, dan berinvestasi untuk masa depan industri kapas kita."
 AFG_forge_a_national_identity: "Membangun Identitas Nasional"
 AFG_forge_a_national_identity_desc: "Masyarakat kami tidak memandang diri mereka sebagai warga Afghanistan, melainkan sebagai bagian dari suku dan kebangsaan mereka masing-masing. Kita harus berusaha untuk memperkenalkan Pashto dan Dari sebagai bahasa nasional, dan suatu hari nanti kita mungkin bisa menyatukan masyarakat di bawah identitas nasional Afghanistan yang bersatu."
 AFG_constructing_a_national_identity_tt: "Ketika semangat kebangsaan §Y$AFG_constructing_a_national_identity_idea$§! dihilangkan:"
 AFG_look_to_other_partners: "Carilah Mitra Lain"
 AFG_look_to_other_partners_desc: "Perjanjian perdagangan kita dengan Uni Soviet telah menimbulkan kecurigaan bahwa perjanjian tersebut mempengaruhi politik dalam negeri dan kebijakan luar negeri kita. Tuduhan seperti itu tentu saja salah, namun mungkin demi kepentingan kita untuk mencari mitra dagang di tempat lain."
 AFG_look_to_other_partners_tt: "Negara-negara besar akan mendapatkan kesempatan untuk berinvestasi di [ROOT.GetNameDef], memberi kita §Gsatu pabrik sipil di luar peta per negara yang menyetujui§! sebagai imbalan atas §Ryang mempengaruhi politik kita selama satu tahun.§!"
 generic_higher_opinion_tt: "§YPendapat yang lebih tinggi terhadap [ROOT.GetNonIdeologyName] akan meningkatkan peluang negara sasaran menerima proposal.§!"
 AFG_renew_soviet_trade_agreement: "Memperbarui Perjanjian Dagang Soviet"
 AFG_renew_soviet_trade_agreement_desc: "Meskipun ideologi kita berbeda selama bertahun-tahun, [SOU.GetName] telah menjadi mitra ekonomi yang baik bagi bangsa kita. Meskipun beberapa pihak mengkhawatirkan risiko pengaruh [SOU.Adjective] terhadap urusan dalam negeri kami, kami tidak melihat ada masalah dalam memperbarui perjanjian perdagangan antar negara."
 AFG_salang_pass: "Terowongan Salang Pass"
 AFG_salang_pass_desc: "Daerah pegunungan [ROOT.GetNonIdeologyName] menyulitkan pengembangan rute transportasi yang nyaman di seluruh negeri. Namun, para insinyur [SOU.GetAdjective] yakin mereka dapat membangun terowongan melalui pegunungan di Salang. Pemerintah mereka telah menawarkan untuk melaksanakan pembangunan tersebut, dengan imbalan sejumlah konsesi strategis."
 AFG_75_year_oil_concessions: "Tawarkan konsesi Minyak 75 Tahun"
 AFG_75_year_oil_concessions_desc: "Ahli geologi dalam beberapa tahun terakhir telah menemukan cadangan minyak yang signifikan di wilayah kita. Namun, kita tidak mempunyai kapasitas industri untuk memanfaatkannya sendiri. Mungkin jika kita mendekati salah satu negara besar dengan kesepakatan yang saling menguntungkan, kita bisa mengekstraksi minyak bersama-sama."
 AFG_75_year_oil_concessions_tt: "§YMembuka keputusan untuk mengekstraksi sumber daya minyak dari wilayah kami bekerja sama dengan kekuatan asing.§!"
 AFG_rail_construction: "Mendirikan Perusahaan Kereta Api Afghanistan"
 AFG_rail_construction_desc: "Untuk pengangkutan sumber daya atau manusia dalam jumlah besar, tidak ada yang seefisien kereta api. Oleh karena itu, kita harus mendirikan perusahaan kereta api untuk mengembangkan dan mengoperasikan jaringan kereta api kita sendiri."
 AFG_electrification: "Inisiatif Elektrifikasi"
 AFG_electrification_desc: "Inovasi dalam industri, komunikasi dan peperangan semakin bergantung pada listrik. Oleh karena itu, kita harus memastikan bahwa negara kita mampu memanfaatkan kemajuan baru dengan memperluas elektrifikasi di seluruh [ROOT.GetNonIdeologyName]."
 AFG_electrification_tt: "§YElektrifikasi akan mulai menyebar keluar dari Kabul seiring berjalannya waktu, dengan satu negara bagian inti baru mendapatkan pengubahnya setiap bulan kedua.§!"
 AFG_establish_radio_networks: "Modernisasi Radio Kabul"
 AFG_establish_radio_networks_desc: "Radio Kabul didirikan pada tahun 1920-an dengan peralatan yang kini sudah kuno. Kita harus berinvestasi dalam meningkatkan peralatan penyiaran sehingga kita dapat memastikan pemerintah memiliki jalur komunikasi langsung dengan sebanyak mungkin masyarakat."
 AFG_connect_the_cities: "[ROOT.GetNonIdeologyName] Jalan Lingkar"
 AFG_connect_the_cities_desc: "Meskipun kereta api akan sangat penting bagi pembangunan jangka panjang kita, manfaat dari sistem jalan raya modern antar kota-kota besar tidak dapat diabaikan. Dengan dibuatnya jalan lingkar yang menghubungkan kota-kota, kita akhirnya dapat mengikis regionalisme ekonomi yang telah lama menghantui perekonomian kita."
 AFG_expand_kabul_university: "Perluas Universitas Kabul"
 AFG_expand_kabul_university_desc: "Kebutuhan akan insinyur, dokter, dan guru profesional tidak lagi dapat dipenuhi dengan mengirimkan siswa ke luar negeri untuk mendapatkan pendidikan spesialis. Sebaliknya, kita harus berinvestasi pada institusi kita sendiri dan membesarkan generasi baru profesional yang tumbuh di dalam negeri."
 AFG_expand_kabul_university_tt: "§RMemperluas pendidikan tinggi akan menyebabkan lulusannya menjadi radikal kecuali perekonomian tumbuh cukup kuat untuk menawarkan mereka pekerjaan!§!"
 AFG_kajaki_dam: "Bentuk Otoritas Lembah Helmand"
 AFG_kajaki_dam_desc: "Kita harus mengambil inspirasi dari Otoritas Lembah Tennessee di [USA.GetNameDef] dan mendirikan lembaga serupa untuk lembah sungai Helmand. Organisasi tersebut bertugas mengembangkan perekonomian daerah untuk kepentingan perekonomian nasional. Namun, kita harus berhati-hati agar tidak memprovokasi tetangga barat kita jika kita mulai mengubah aliran air di sepanjang sungai."
 AFG_kajaki_dam_tt: "§RKegagalan menegosiasikan perjanjian dengan [414.OWNER.GetNameDef] melalui rangkaian peristiwa berikutnya dapat menyebabkan perang!§!"
 AFG_qargha_dam: "Bangun Bendungan Qargha"
 AFG_qargha_dam_desc: "Daerah-daerah yang lebih kering di negara ini tidak memiliki irigasi yang memadai, yang pada gilirannya membahayakan panen dan berpotensi menyebabkan kelaparan. Namun, kita dapat membuat bendungan untuk meningkatkan ketersediaan air untuk irigasi yang bahkan dapat menyebabkan surplus pertanian."
 AFG_chaki_dam: "Bendungan Chak"
 AFG_chaki_dam_desc: "Ketika permintaan listrik meningkat, kita perlu memastikan pasokan listrik tetap tersedia. Dengan bantuan para ahli asing, kami mungkin dapat membangun bendungan pembangkit listrik tenaga air di sungai Chak yang dapat memasok listrik ke daerah sekitarnya, termasuk Kabul, untuk tahun-tahun mendatang."
 AFG_chromite_mines: "Mendirikan Tambang Krom"
 AFG_chromite_mines_desc: "Kromium menjadi sumber daya yang semakin dicari di negara-negara industri. Kita harus memulai penggalian sumber daya kromit kita sendiri untuk diekspor dan kemudian menggunakan kekayaan yang dihasilkan untuk melanjutkan program industrialisasi kita sendiri."
 AFG_iron_mines: "Memperluas Tambang Tembaga dan Timah"
 AFG_iron_mines_desc: "Timah, tembaga dan besi sangat penting untuk produksi banyak kebutuhan modern. Jika kita ingin berkembang menjadi negara industri, kita perlu mengembangkan dan mengamankan akses kita terhadap sumber daya tersebut. Untungnya kita mempunyai banyak sumber daya yang belum dimanfaatkan dan menunggu untuk dieksploitasi."
 AFG_truck_factory: "Pabrik Truk Janagalak"
 AFG_truck_factory_desc: "Bekerja sama dengan dermawan [SOU.GetAdjective] kami, kami memiliki kesempatan untuk mengembangkan pabrik skala besar pertama kami untuk produksi kendaraan. Truk-truk yang dikembangkan di sana dapat memenuhi permintaan domestik akan kendaraan-kendaraan tersebut di industri dan militer."
 AFG_maintain_quami: "Pertahankan Quami"
 AFG_maintain_quami_desc: "Sistem pungutan Quami telah menjadi landasan pertahanan kita selama berabad-abad. Mengapa kita harus membuang sistem yang berakar pada tradisi yang hanya menguntungkan elite perkotaan di ibu kota? Perlawanan terhadap gelombang reformasi terbaru ini adalah satu-satunya pilihan yang logis."
 AFG_maintain_quami_tt: "§YJaga $AFG_quami_category$ keputusan dan kemampuan untuk merekrut lebih banyak divisi tidak teratur.§!"
 AFG_quami_intro_tt: "Ubah §Y$AFG_quami_modifier$§! dengan:"
 AFG_nufus_intro_tt: "Ubah §Y$AFG_nufus_modifier$§! dengan:"
 AFG_asymmetric_warfare: "Perang Asimetris"
 AFG_asymmetric_warfare_desc: "Sementara negara-negara tetangga kita rela membuang warisan mereka demi mengejar industrialisasi dan angkatan bersenjata yang lebih besar. Kami akan mengatasinya melalui penggunaan taktik yang tidak konvensional dan pengetahuan unggul tentang medan kami. Ditambah dengan tekad tentara kami, kami akan mengusir kekuatan penyerang apa pun."
 AFG_khyber_pass_riflining: "Senapan Lulus Khyber"
 AFG_khyber_pass_riflining_desc: "Industri rumahan di sepanjang jalur Khyber telah memproduksi salinan persenjataan asing selama beberapa dekade. Meskipun kualitas senjata mereka kurang, mereka bisa mengimbanginya dengan kuantitas. Mungkin sudah saatnya kita berinvestasi di kawasan ini dan mengembangkan produsen senjata dalam negeri untuk angkatan bersenjata kita."
 AFG_encourage_jezail_production: "Mendorong Produksi Jezail Lokal"
 AFG_encourage_jezail_production_desc: "Jezail telah lama menjadi senjata favorit suku Pashtun karena produksinya yang murah, dan sangat berguna selama perang Inggris-Afghanistan. Kita harus mendorong suku-suku tersebut untuk mempertahankan tradisi ini, agar dapat memperoleh pungutan yang lebih besar."
 AFG_scavenging: "Taktik Pemulungan"
 AFG_scavenging_desc: "Peralatan yang tidak dapat kami produksi sendiri sering kali berakhir di tangan pihak asing. Oleh karena itu kita harus melatih pasukan kita untuk mengenali dan menangkap peralatan militer yang berharga kapan pun tersedia."
 AFG_militia_cavalry: "Kavaleri Qatgani"
 AFG_militia_cavalry_desc: "[ROOT.GetNameDefCap] adalah tuan rumah bagi sejumlah ras kuda yang khusus dibiakkan untuk medan berat di negara ini. Peralatan ini dapat digunakan dalam brigade kavaleri daripada harus berinvestasi pada peralatan asing yang mahal dan cenderung rusak dan memerlukan dukungan ekstensif."
 AFG_mountain_training: "Pelatihan Gunung"
 AFG_mountain_training_desc: "Teknologi dan taktik baru datang dan pergi seiring berjalannya waktu, namun gunung dan lembah tetap tidak berubah. Daripada berjuang untuk mengimbangi tetangga kita dalam hal teknologi, kita sebaiknya fokus pada pemanfaatan lahan di sekitar kita untuk mendapatkan keuntungan taktis."
 AFG_cross_border_ties: "Ikatan Lintas Batas"
 AFG_cross_border_ties_desc: "Sifat geografi kita membuat perbatasan selalu rapuh, dengan banyaknya keluarga yang datang dan pergi melintasinya dan menetap di kedua sisinya. Selama beberapa generasi, hal ini telah menghasilkan hubungan antarpribadi yang kuat di negara-negara tetangga yang pada saat krisis dapat dimanfaatkan."
 AFG_cross_border_ties_tt: "Membuka keputusan §Y$AFG_cross_border_ties_category$§! untuk mencaplok wilayah yang diklaim"
 AFG_approach_foreign_inteligence_services: "Pendekatan Badan Intelijen Asing"
 AFG_approach_foreign_inteligence_services_desc: "Kita berada di persimpangan kekuatan-kekuatan besar dan telah lama berada di bawah pengaruh permainan besar mereka. Jika kita membentuk badan intelijen kita sendiri, kita dapat mengambil keuntungan dari situasi unik kita dengan mengadu domba tetangga kita satu sama lain."
 AFG_expand_border_guards: "Perluas Penjaga Perbatasan"
 AFG_expand_border_guards_desc: "Kita harus melatih polisi perbatasan dalam peperangan dasar sehingga mereka dapat diminta untuk mengambil tanggung jawab yang lebih besar pada saat krisis dan mengurangi beban pada angkatan bersenjata konvensional. Pengawal kerajaan mewakili elit angkatan bersenjata kita dan memiliki pelatihan dan keahlian yang sesuai. Namun, kekhawatiran mengenai terbatasnya jumlah mereka semakin meningkat seiring dengan konflik yang terjadi di negara-negara tetangga kita."
 AFG_utilize_cameleers: "Manfaatkan Cameleer"
 AFG_utilize_cameleers_desc: "Unta kami telah diekspor jauh dan luas, dipekerjakan oleh Kerajaan Inggris untuk perjalanan dan pasokan di wilayah berbahaya di gurun Great Australian. Kita harus mempekerjakan para pekerja terampil ini untuk membantu pasukan kita di tanah kita sendiri."
 AFG_establish_camelry_regiments: "Bentuk Resimen Unta"
 AFG_establish_camelry_regiments_desc: "Unta adalah hewan yang tangguh, dan untuk memastikan pasukan kita dapat bekerja bahkan di gurun dan pegunungan, kita harus beradaptasi. Dengan bantuan unta kita akan mampu berperang di medan apa pun dan di daerah yang musuh kita tidak mungkin lawan."
 AFG_adopt_nufus: "Adopsi Nufus"
 AFG_adopt_nufus_desc: "Sistem pengumpulan pasukan tidak teratur yang telah berusia berabad-abad untuk mempertahankan wilayah tersebut telah lama memenuhi tujuannya dan sepertinya tidak akan mampu menahan serangan pasukan musuh profesional. Oleh karena itu, kita harus mengganti sistem tersebut dengan sistem wajib militer dan pelatihan formal."
 AFG_adopt_nufus_tt: "§RAkan menghapus keputusan $AFG_quami_category$ dan mencegah perekrutan divisi tidak teratur!§!"
 AFG_mohammed_daoud_khan_available_as_general_tt: "§YMohammed Daoud Khan§! tersedia sebagai level §Y2§! Umum"
 AFG_new_army: "Tentara Tetap"
 AFG_new_army_desc: "Meskipun masih ada penolakan terhadap reformasi militer dari penduduk pedesaan, kita harus bergerak maju dan memulai program pelatihan skala besar untuk kelompok wajib militer terbaru."
 AFG_expand_royal_guard: "Perluas Pengawal Kerajaan"
 AFG_expand_royal_guard_desc: "Pengawal kerajaan mewakili elit angkatan bersenjata kita dan memiliki pelatihan serta keahlian yang sesuai. Namun, kekhawatiran mengenai terbatasnya jumlah mereka semakin meningkat seiring dengan konflik yang terjadi di negara-negara tetangga kita."
 AFG_prussians_of_the_orient: "Prusia dari Timur"
 AFG_prussians_of_the_orient_desc: "Karena pelatihan kami oleh perwira asing, dan kelebihan peralatan [GER.GetAdjective] dalam jumlah besar, para pejabat di [GER.GetNameDef] mulai menyebut kami sebagai orang Prusia dari Timur. Kita harus memastikan bahwa kita dapat menghayati gelar ini, dan berdiri teguh terhadap siapa pun yang berani menentang kita."
 AFG_establish_naval_bases: "Mendirikan Pangkalan Angkatan Laut Baru"
 AFG_establish_naval_bases_desc: "Dengan didirikannya pangkalan angkatan laut pertama yang memasok kapal-kapal di sepanjang pantai yang baru dibebaskan, kita dapat memulai tugas berat untuk mengembangkan angkatan laut kita sendiri."
 AFG_establish_naval_bases_tt: "Tambahkan §G1§! §YPangkalan Angkatan Laut§! di negara bagian pantai acak"
 AFG_standardize_equipment: "Standarisasi Peralatan"
 AFG_standardize_equipment_desc: ""
 AFG_expand_academy: "Perluas Akademi Militer"
 AFG_expand_academy_desc: "Dengan bertambahnya tentara yang lebih profesional, kebutuhan akan perwira yang terlatih juga meningkat. Pembangunan akademi militer nasional akan menjadi langkah bijaksana untuk memastikan tentara mempunyai kepemimpinan dan keahlian yang mereka perlukan untuk melindungi perbatasan kita."
 AFG_expand_academy_tt: "Rekrut §YDua§! acak §YJenderal§!"
 AFG_foreign_military_advisors: "Undang Penasihat Militer Asing"
 AFG_foreign_military_advisors_desc: "Untuk melatih tentara kita agar memenuhi standar modern, cara tercepat adalah mengundang penasihat dari negara-negara barat. Mereka akan membantu melatih generasi [ROOT.GetAdjective] berikutnya agar siap bertarung di medan perang yang terus berkembang."
 AFG_expand_standing_army: "Perluas Tentara Tetap"
 AFG_expand_standing_army_desc: "Untuk mengalahkan musuh-musuh kita dan menjamin kemerdekaan kita, pasukan kita tidak hanya harus efektif, tetapi juga harus besar. Oleh karena itu, kita harus memperluas wajib militer dan merekrut lebih banyak pria ke dalam barisan kita."
 AFG_officialize_the_turkish_afghan_defense_treaty: "Perjanjian Pertahanan [TUR.GetAdjective]-[ROOT.GetAdjective]"
 AFG_officialize_the_turkish_afghan_defense_treaty_desc: "Sejak tahun 1933, personel militer Turki telah membantu mendidik generasi tentara Afghanistan berikutnya. Sudah saatnya memanfaatkan hubungan ini, meminta perjanjian defensif, yang mana kita berdua wajib melindungi satu sama lain dari agresi asing."
 AFG_purchase_tanks: "Beli Tank Asing"
 AFG_purchase_tanks_desc: "Tentara kita tidak mempunyai daya tembak untuk menerobos garis musuh yang tangguh atau kecepatan untuk membuat kemajuan. Kita harus melihat ke seluruh dunia dan berinvestasi pada kekuatan lapis baja untuk mengatasi permasalahan ini."
 AFG_purchase_aircraft: "Beli Pesawat Asing"
 AFG_purchase_aircraft_desc: "Angkatan bersenjata kita terlalu rentan terhadap serangan dari udara. Kita perlu berinvestasi pada angkatan udara kita sendiri untuk melawan pesawat musuh."
 AFG_expand_equipment_purchases: "Perbanyak Pembelian Peralatan"
 AFG_expand_equipment_purchases_desc: "Angkatan bersenjata kita menjadi semakin bergantung pada peralatan selain senapan dan peluru. Jika mereka ingin tetap menjadi kekuatan yang kredibel, kita harus segera mendapatkan lebih banyak peralatan pendukung."
 AFG_increase_air_purchases: "Tingkatkan Pembelian Udara"
 AFG_increase_air_purchases_desc: "Angkatan udara kita dengan cepat mengembangkan kemampuan untuk menghalangi atau menghancurkan pesawat asing memasuki wilayah udara kita. Namun, kami tidak memiliki kemampuan untuk memproyeksikan tenaga ke darat dengan pesawat kami. Oleh karena itu kita harus mulai berinvestasi pada skuadron pembom kita sendiri."
 AFG_naval_academy: "Mendirikan Akademi Angkatan Laut"
 AFG_naval_academy_desc: "Kurangnya wilayah pesisir dalam sejarah kita berarti kurangnya perwira yang memiliki keahlian angkatan laut. Oleh karena itu kita harus mendirikan akademi angkatan laut dan mencoba menarik perwira dari luar negeri untuk melatih pelaut [AFG.GetAdjective] generasi pertama."
 AFG_naval_academy_tt: "Rekrut §YDua§! acak §YLaksamana§!"
 AFG_shipyards: "Tetapkan [ROOT.GetAdjective] Pengiriman"
 AFG_shipyards_desc: "Sekalipun kami belum siap untuk mengembangkan kapal rancangan kami sendiri, kapal apa pun di masa depan akan memerlukan fasilitas pemeliharaan dan reparasi. Dengan mendirikan galangan kapal sekarang, kita dapat memastikan bahwa kapal masa depan kita akan memiliki fasilitas yang dibutuhkan untuk beroperasi selama beberapa dekade mendatang."
 AFG_shipyards_tt: "Tambahkan §G1§! slot bangunan dan §G1§! §YGalangan Kapal Angkatan Laut§! di negara bagian pesisir."
 AFG_shipyards_tt_2: "§YMembuka Organisasi Industri Militer:§!"
 AFG_research_bonus_1: "Mengembangkan Industri Angkatan Laut Dalam Negeri"
 AFG_research_bonus_1_desc: "Negara-negara besar hanya akan menjual kepada kita apa yang mereka anggap usang dan tidak mengancam kepentingan mereka di kawasan. Jika kita ingin mengembangkan angkatan laut modern yang mampu menghalangi kekuatan-kekuatan besar tersebut, kita harus berinvestasi dalam mengembangkan rancangan kita sendiri."
 AFG_purchase_destroyers: "Beli Penghancur"
 AFG_purchase_destroyers_desc: "Diperlukan waktu puluhan tahun bagi kami untuk mengembangkan keahlian dan infrastruktur guna mendukung perancangan dan konstruksi kapal perang modern. Pendekatan yang jauh lebih pragmatis adalah dengan membeli kapal-kapal yang sudah tidak digunakan lagi dari negara lain dan melengkapinya untuk tujuan kita."
 AFG_research_bonus_2: "Berinvestasi dalam Perkembangan Angkatan Laut"
 AFG_research_bonus_2_desc: "Keahlian kami dalam mengembangkan kapal yang lebih kecil telah membuahkan hasil, dan para insinyur kami kini menghadapi tantangan untuk mengembangkan desain yang jauh lebih besar untuk angkatan laut."
 AFG_purchase_capital_ships: "Beli Kapal Modal"
 AFG_purchase_capital_ships_desc: "Angkatan laut kita mulai terbentuk dengan akuisisi kapal-kapal kecil baru-baru ini, namun kita masih kekurangan daya tembak angkatan laut dibandingkan kapal-kapal besar dan harus mulai mencari kapal apa pun yang mungkin bisa kita beli."
 AFG_state_industries: "Mendirikan Industri Militer"
 AFG_state_industries_desc: "Lulusan universitas menjadi radikal karena kurangnya lapangan kerja yang memanfaatkan keterampilan mereka. Untuk mencegah hal ini, kita dapat mendirikan industri-industri yang dikelola negara untuk mempekerjakan lebih banyak industri dan juga mempersenjatai angkatan bersenjata kita dengan peralatan yang diproduksi di dalam negeri."
 AFG_state_industries_tt: "Buka keputusan untuk mendirikan §YOrganisasi Industri Militer§! dan memperpanjang batas waktu bagi lulusan untuk menjadi radikal."
 AFG_ideology_on_the_rise_tt: "§RKekuatan besar yang tidak memiliki ideologi yang sama dengan [THIS.GetNameDef] mungkin ingin menyerang [ROOT.GetNameDef] jika pengaruh mereka terhadap kita menjadi terlalu tinggi! (Jika [THIS.GetIdeologyNameWithCaps] lebih besar dari 40%, kekuatan lain mungkin menyerang kita!)§!"
 AFG_ideology_on_the_rise_flipped_tt: "§R[THIS.GetNameDefCap] mungkin ingin menyerang [ROOT.GetNameDef] jika negara lain mempunyai pengaruh yang terlalu besar terhadap kita! (Jika ideologi apa pun kecuali netralitas atau [THIS.GetIdeologyNameWithCaps] lebih besar dari 40%, [THIS.GetNameDef] dapat menyerang kami!)§!"
 AFG_foreign_influence_tt: "Tambahkan §Y[PREV.GetIdeologyNameWithCaps] Pengaruh pada Kenaikan§!, yang memberikan (Dukungan [PREV.GetIdeologyNameWithCaps] Harian: §G+0.02§!) selama §Y365§! hari"
 AFG_against_kabul: "Melawan Kabul"
 AFG_against_kabul_desc: "Raja Zahir dan pamannya adalah perampas takhta, rezim tidak sah mereka harus digulingkan dengan cara apa pun."
 AFG_contact_amanullah_loyalists: "Hubungi Loyalis Amanullah"
 AFG_contact_amanullah_loyalists_desc: "Mantan Raja, $AFG_amunullah_khan$, tidak pernah secara resmi menyerahkan takhta kepada penerusnya ketika ia digulingkan secara tidak adil oleh rakyat jelata. Oleh karena itu, kita harus mengumpulkan orang-orang di [AFG.GetNonIdeologyName] yang tetap setia kepada Raja dan membuat persiapan untuk kepulangannya yang tak terhindarkan."
 AFG_remember_the_khost_rebellion: "Ingat Pemberontakan Khost"
 AFG_remember_the_khost_rebellion_desc: "Pada tahun 1924, orang-orang saleh di antara kita bangkit melawan Raja Amanullah dan kroni-kroni baratnya untuk mengembalikan negara tersebut dari ambang kehilangan identitas kebanggaannya. Negara ini mungkin telah dikalahkan, namun semangatnya tetap hidup, dan sekarang kita tahu bagaimana cara mengatasi Kabul. Saatnya kembali ke tradisi!"
 AFG_crown_the_golden_emir: "Mahkota Emir Emas"
 AFG_crown_the_golden_emir_desc: "Setelah domain tersebut diamankan, penguasa baru harus bangkit untuk mengklaim gelar Emir. Setelah membuktikan dirinya di medan perang, tidak mengherankan jika Mirzali Khan Wazir menjadi kandidat paling populer. Dia akan membantu kami menyatukan kembali Pashtunistan dan menyatukan Dunia Islam."
 AFG_crown_the_bukharan_emir: "Mahkota Emir Bukharan"
 AFG_crown_the_bukharan_emir_desc: "Setelah domain tersebut diamankan, penguasa baru harus bangkit untuk mengklaim gelar Emir. Sayyid Mir Muhammad Alim Khan dari Bukhara telah berada di Kabul selama beberapa tahun, dan merupakan kandidat yang tepat jika kita ingin mengembalikan kejayaan Kerajaan Durrani yang agung."
 AFG_invite_the_mughal_prince: "Undang Pangeran Mughal"
 AFG_invite_the_mughal_prince_desc: "Setelah domain tersebut diamankan, penguasa baru harus bangkit untuk mengambil alih kekuasaan Timur. Entah karena darah, prestasi, atau kemauan keras, pilihan yang kita ambil akan membentuk masa depan wilayah kita. Oleh karena itu, kita harus mengundang Pangeran Mughal yang saat ini tinggal di India untuk naik takhta."
 AFG_unify_the_islamic_world: "Menyatukan Dunia Islam"
 AFG_unify_the_islamic_world_desc: "Sudah terlalu lama negara-negara Muslim bertengkar karena hal-hal sepele dan mengabaikan tanggung jawab kerja sama. Akhirnya tiba saatnya bagi kita untuk menyampaikan undangan kepada negara-negara Muslim di dunia, untuk bergabung bersama dalam sebuah aliansi besar."
 AFG_unify_the_islamic_world_tt: "Mendapat acara §Y[ROOT.GetNameDefCap] mengundang kami ke faksi mereka§!"
 AFG_united_islamic_world_faction: "Ittehad-e Islami"
 AFG_extend_a_hand_to_tokyo: "Ulurkan Tanganmu ke Tokyo"
 AFG_extend_a_hand_to_tokyo_desc: "Berkat bantuan pasukan [JAP.GetAdjective], kami berhasil memenangkan pertarungan untuk Afghanistan. Sekarang [JAP.GetNameDef] ingin menyatukan dan membebaskan Asia, akan lebih bijaksana jika kita sekali lagi melakukan pendekatan kepada mereka."
 AFG_extend_a_hand_to_tokyo_tt: "Kami akan berusaha untuk bergabung dengan faksi §Y[JAP.GetNameDef]§!"
 AFG_expand_the_madrasas: "Memperluas Madrasah"
 AFG_expand_the_madrasas_desc: "Agar kita bisa mengendalikan masyarakat kita dengan lebih baik dan mengajari mereka cara hidup yang seharusnya, kita harus meningkatkan pendanaan untuk lembaga-lembaga pendidikan Muslim yang ada di negara kita."
 AFG_promote_muslim_work_ethic: "Mempromosikan Etos Kerja Muslim"
 AFG_promote_muslim_work_ethic_desc: "Masyarakat Barat telah lama menyombongkan ‘etos kerja Protestan’ mereka dan mengabaikan kerja keras dunia Islam. Sudah saatnya kita mengingatkan mereka bahwa kita setara dengan mereka dalam hal dedikasi dan keahlian."
 AFG_rehabilitate_the_saqqawists: "Rehabilitasi kaum Saqqawist"
 AFG_rehabilitate_the_saqqawists_desc: "Kelompok Saqqawi berhasil menggulingkan pemerintahan dekaden Amanullah Khan pada tahun 1929, namun nasib berbalik melawan mereka dan mereka hancur beberapa tahun kemudian. Mungkin sudah tiba waktunya untuk menghormati para pahlawan yang berjuang dengan gagah berani untuk melindungi nilai-nilai tradisional kita."
 AFG_ulugh_beg_academy: "Akademi Ulugh Beg"
 AFG_ulugh_beg_academy_desc: "Ulugh Beg pernah memerintah kerajaan Timurid yang perkasa sebagai Sultan, namun juga meluangkan waktu untuk memperluas pengetahuan kita tentang astronomi dan matematika. Kita harus menghormati warisannya dengan mendirikan universitas baru atas namanya."
 AFG_prepare_the_war_industries: "Siapkan Industri Perang"
 AFG_prepare_the_war_industries_desc: "Industri kita saat ini tidak memiliki kapasitas untuk produksi perang. Untuk mencegah kewalahan oleh negara-negara tetangga, kita harus mengubah orientasi pabrik-pabrik kita untuk mendukung militer kita dan bukannya memenuhi tuntutan elit penguasa. Transisi ini sangat penting untuk kelangsungan hidup kita."
 AFG_revive_the_workshop_of_the_world: "Menghidupkan Kembali Lokakarya Dunia"
 AFG_revive_the_workshop_of_the_world_desc: "Kami akan meniru nenek moyang kami dengan memodernisasi pabrik dan merevitalisasi jalur perdagangan kami. Transformasi ini akan menjadikan perekonomian kita sebagai kekuatan yang mampu bersaing dengan negara-negara besar di dunia."
 AFG_reorganize_the_royal_guard: "Atur ulang Pengawal Kerajaan"
 AFG_reorganize_the_royal_guard_desc: "Pengawal Kerajaan gagal memenuhi kehormatan yang telah diberikan kepada mereka. Kami akan menghidupkan kembali mereka dengan serangkaian reformasi dan perluasan barisan mereka. Mereka harus mewujudkan kekuatan dan tekad [ROOT.GetNameDef]."
 AFG_reintroduce_heavy_cavalry: "Perkenalkan kembali Kavaleri Berat"
 AFG_reintroduce_heavy_cavalry_desc: "Nenek moyang kita berulang kali membawa kudanya dan menyapu dataran India dan Asia Tengah, merebut tanah dan sumber daya ketika penguasa mereka lemah. Ketika negara-negara tetangga kita terlibat dalam konflik, mungkin momen serupa akan terjadi lagi."
 AFG_reintroduce_war_elephants: "Perkenalkan kembali Gajah Perang"
 AFG_reintroduce_war_elephants_desc: "Sementara dunia berjuang mencari cara untuk membuat monster bermotor yang lebih rumit, kita akan menggunakan metode yang telah teruji dan benar untuk berperang dan menimbulkan ketakutan pada musuh-musuh kita dengan menghidupkan kembali penggunaan gajah perang."
 AFG_timurid_bureaucracy: "Birokrasi Timurid"
 AFG_timurid_bureaucracy_desc: "Berakar pada warisan Timur, Birokrasi Timurid memberikan model pemerintahan yang efisien dan kontrol terpusat. Merevitalisasi sistem ini akan memperkuat pemerintahan UEA, memastikan stabilitas dan kemakmuran di seluruh wilayahnya yang luas."
 AFG_hone_the_shamshir: "Asah Shamshir"
 AFG_hone_the_shamshir_desc: "Shamshir, simbol kekuatan dan perlawanan, harus diasah untuk pertempuran yang akan datang. Dengan memodernisasi kekuatan kami dan menyempurnakan strategi kami, kami memastikan bahwa [ROOT.GetNameDef] siap menyerang dengan tegas ketika dibutuhkan."
 AFG_restore_herat: "Kembalikan Herat"
 AFG_restore_herat_desc: "Bertentangan dengan pusat kekuasaan lama di Kabul, sudah saatnya ibu kota dipindahkan ke kediaman utama Kerajaan Durrani, Herat. Dengan melakukan hal ini, kita akan dapat memperkuat klaim kita sebagai penerus kerajaan yang dulunya besar ini."
 AFG_enforce_the_pashtunwali: "Tegakkan Pashtunwali"
 AFG_enforce_the_pashtunwali_desc: "Meskipun naskah Pashtunwali mungkin sudah ketinggalan jaman, naskah tersebut tetap perlu dipertahankan untuk memastikan dominasi Pashtun dalam politik internal. Bagian-bagian undang-undang yang paling ketinggalan jaman mungkin akan disesuaikan, namun akan tetap berlaku sampai generasi mendatang."
 AFG_form_the_khuddamul_furqan: "Bentuklah Khuddamul Furqan"
 AFG_form_the_khuddamul_furqan_desc: "Untuk memperkuat legitimasi pemerintahan baru kita, kita harus mendirikan partai politik yang tepat di bawah kepemimpinan Emir Emas. Satu-satunya kesetiaan yang dapat diterima adalah kepada Khuddamul Furqan, dan hanya partai inilah yang akan membawa keselamatan kepada masyarakat."
 AFG_instate_a_compulsory_jizya: "Mewajibkan Jizyah"
 AFG_instate_a_compulsory_jizya_desc: "Hak-hak non-Muslim sangat ditentukan di bawah pemerintahan lama. Inilah saatnya untuk menyesuaikan hal-hal ini dengan dunia modern, dan membuktikan kepada semua rakyat kita bahwa kita adalah dunia yang tercerahkan."
 AFG_raise_lashkar_regiments: "Angkat Resimen Lashkar"
 AFG_raise_lashkar_regiments_desc: "Rekan pejuang perlawanan Faqir di wilayah Pastun di Raj Inggris mencap diri mereka sebagai Lashkar. Sekarang setelah dia memerintah [ROOT.GetNameDef], mungkin inilah saat yang tepat untuk secara resmi membentuk resimen serupa di bawah dinas negara."
 AFG_support_nort_west_frontier_rebels: "Mendukung Pemberontak Perbatasan Barat Laut"
 AFG_support_nort_west_frontier_rebels_desc: "Pemberontak Pashtun di [RAJ.GetAdjective] Perbatasan Barat Laut masih berjuang dengan gagah berani melawan penindas mereka, meskipun Faqir telah pergi ke [ROOT.GetNameDef]. Kita harus turun tangan dan melindungi mereka, bahkan jika itu berarti perang dengan pihak-pihak yang saat ini mengklaim wilayah tersebut sebagai milik mereka."
 AFG_occupy_peshawar_tt: "§RIni dapat menyebabkan perang dengan pemilik [442.GetName]!§!"
 AFG_occupy_waziristan_tt: "§RIni dapat menyebabkan perang dengan pemilik [987.GetName]!§!"
 AFG_appraoch_anti_communist_theologians: "Pendekatan Para Teolog Anti-Soviet"
 AFG_appraoch_anti_communist_theologians_desc: "Banyak cendekiawan dan teolog muslim yang sepakat bahwa komunisme adalah momok bagi masyarakat sipil kita. Sedihnya, [SOV.GetNameDef] saat ini menerapkan ideologi keji terhadap saudara-saudara kita di Asia Tengah, dan kita harus melakukan segala daya kita untuk menghentikan kebodohan ini."
 AFG_unite_pashtunistan: "Satukan Pashtunistan"
 AFG_unite_pashtunistan_desc: "Tujuan akhir dari kampanye Faqir selalu untuk kemerdekaan negara Pashtun di tanah British Raj. Namun kini, ia diberi kesempatan untuk mendirikan negara Pashtun di luar perbatasan tersebut, dan menaklukkan wilayah yang tersisa. Hidup Pashtunistan, hidup Emir!"
 AFG_form_the_turkestan_legion: "Bentuk Legiun Turkestan"
 AFG_form_the_turkestan_legion_desc: "Ada banyak orang yang ingin melawan komunisme bahkan di panggung global. Kita harus mengorganisir pasukan sukarelawan anti-komunis Turki yang akan berjuang sampai titik darah penghabisan melawan kekuatan yang menentang Islam."
 AFG_form_the_turkestan_legion_tt: "Buka keputusan §Y$AFG_turkestan_legion_cat$§! untuk merekrut divisi dari seluruh dunia Turki."
 AFG_proclaim_a_new_caliphate: "Proklamasikan Khilafah Baru"
 AFG_proclaim_a_new_caliphate_desc: "Setelah kesultanan Utsmaniyah bubar, tidak ada kekhalifahan baru yang dideklarasikan. Untuk memimpin mereka yang tersesat dan salah arah, kita harus mengambil jubah baru ini, dan hidup sesuai dengan warisan Rashidun di masa lalu."
 AFG_proclaim_a_new_caliphate_tt: "Keuntungan §YAmbil negara yang diklaim§! tujuan perang melawan setiap negara yang menduduki negara-negara yang fokus ini memberi Anda klaim"
 AFG_proclaim_a_new_caliphate_2_tt: "Membuka keputusan untuk §YIntegrate§! negara bagian yang diklaim yang kami kendalikan"
 AFG_integrate_the_basmachi_movement: "Integrasikan Gerakan Basmachi"
 AFG_integrate_the_basmachi_movement_desc: "Hingga tahun 1934, Basmachi berjuang melawan kekuatan [SOV.GetAdjective] untuk membebaskan Asia Tengah dari kekuasaan tirani mereka. Meskipun sebagian besar gerakan mereka telah ditumpas, beberapa pemimpin mereka berhasil melarikan diri. Kita harus berusaha menjalin kontak dengan para pejuang kemerdekaan ini, dan mengundang mereka ke pengadilan kita."
 AFG_proclaim_the_second_afghan_empire: "Proklamasikan Kekaisaran Afghanistan Kedua"
 AFG_proclaim_the_second_afghan_empire_desc: "Pada tahun 1747 Ahmad Shah Durrani menyatukan suku-suku Afghanistan dan mengorganisasi mereka menjadi sebuah kerajaan. Pada puncaknya, kekuasaannya menguasai sebagian besar Asia Tengah, India Timur, dan Iran. Negara ini berdiri berdampingan dengan Kesultanan Utsmaniyah sebagai kerajaan Islam paling signifikan pada paruh kedua abad ke-18, dan kita harus merebut kembali warisan tersebut!"
 AFG_can_core_once_controlled_tt: "Membuka keputusan untuk inti negara bagian yang diklaim setelah dikuasai"
 AFG_return_to_delhi: "Kembali ke Delhi"
 AFG_return_to_delhi_desc: "Delhi pernah menjadi tempat kedudukan Sultan, dan merupakan rumah bagi Benteng Merah di mana Singgasana Merak kita yang megah berada. Kami sekarang akan bergerak menuju kota, dan merebut kembali ibu kota kami yang telah lama hilang, dan dengan demikian hidup sesuai dengan Kaisar Mughal di masa lalu."
 AFG_reclaim_moghulistan: "Rebut kembali Moghulistan"
 AFG_reclaim_moghulistan_desc: "Moghulistan, salah satu Kekhanan Chagatai, adalah salah satu penerus Kekaisaran Mongol Besar. Sebagai sebuah negara baru yang ingin meraih kejayaan yang pernah mereka miliki, mungkin akan lebih bijaksana jika kita mengambil tanah ini untuk diri kita sendiri."
 AFG_ally_the_sikhs: "Sekutu Sikh"
 AFG_ally_the_sikhs_desc: "Kaum Sikh adalah agama minoritas penting di anak benua India dan merupakan pejuang yang tangguh. Kita harus menggunakan bantuan mereka untuk menaklukkan wilayah itu untuk diri kita sendiri."
 AFG_ally_the_brahui_khanate: "Sekutu Brahui Khanate"
 AFG_ally_the_brahui_khanate_desc: "Kekhanan Kalat adalah sekutu penting kami di tahun-tahun terakhir Kekaisaran Durrani, dan sangat membantu kemenangan kami melawan Konfederasi Maratha. Kita harus menghubungi mereka sekali lagi, dan menjatuhkan penerus Maratha!"
 AFG_the_echoes_of_panipat: "Gema Panipat"
 AFG_the_echoes_of_panipat_desc: "Pertempuran Panipat Ketiga masih bergema di ingatan semua orang di anak benua India. Di sana, kami menghancurkan kekuatan Maratha dan mengukuhkan dominasi kami atas India barat laut. Sudah waktunya kita melakukannya lagi, dan menjatuhkan pewaris Konfederasi Maratha yang kurang ajar!"
 AFG_the_conquerors_of_persia: "Para Penakluk Persia"
 AFG_the_conquerors_of_persia_desc: "[PER.GetNameDefCap], negeri dengan kekayaan dan sejarah yang luar biasa, pernah menjadi saingan kekaisaran. Dengan menjadikannya di bawah kekuasaan kami, kami menegaskan kembali dominasi kami, mengamankan wilayah-wilayah penting di barat, dan memperkuat posisi kekaisaran sebagai pewaris sejati keagungan kekaisaran."
 AFG_reclaim_transoxiana: "Rebut kembali Transoxiana"
 AFG_reclaim_transoxiana_desc: "Tanah lama Transoxiana pernah menjadi milik Kekaisaran Timurid, dan kami adalah ahli warisnya. Kita harus merebut kembali tanah ini, jangan sampai warisan kita ternoda oleh kelemahan dan keragu-raguan!"
 AFG_rebuild_the_silk_road: "Membangun kembali Jalur Sutra"
 AFG_rebuild_the_silk_road_desc: "Jalur Sutra pernah membawa kekayaan dan budaya bagi Kekaisaran. Dengan memulihkan jaringan perdagangan bersejarah ini, kami mendapatkan kembali posisi kami di pusat perdagangan global, memperkaya kekaisaran dan mendorong kemakmuran di seluruh wilayahnya yang luas."
 AFG_restore_the_timurid_empire: "Kembalikan Kekaisaran Timurid"
 AFG_restore_the_timurid_empire_desc: "Panji-panji Timur berkibar sekali lagi, dan kerajaan yang pernah menimbulkan ketakutan di hati para sultan dan raja telah bangkit dari abu sejarah. Kekuasaan kami membentang di seluruh wilayah yang pernah dibentuk oleh penaklukannya, mengikat Timur dan Barat di bawah satu kekuasaan. Biarlah dunia memperhatikan—Timurid telah kembali, dan kali ini, kita tidak akan tenggelam dalam masa lalu."
 AFG_the_crown_and_the_world: "Mahkota dan Dunia"
 AFG_the_crown_and_the_world_desc: "Takdir Kekaisaran ini adalah menjadi negara adidaya global yang tak tertandingi. Dengan memperluas pengaruh, meningkatkan kekuatan, dan menegaskan dominasi, kita akan mengamankan posisi kita sebagai penguasa utama dunia modern."
 AFG_the_amu_darya_plan: "Rencana Amu Darya"
 AFG_the_amu_darya_plan_desc: "Kaisar telah menyusun rencana dan melakukan kontak dengan orang-orang di tanah air lamanya yang ingin melarikan diri dari kekuasaan [SOV.GetAdjective]. Pertama, kampanye pembebasan kita harus direncanakan dengan hati-hati, dan baru setelah itu kita dapat menyerang [SOV.GetNameDef]."
 AFG_reclaim_the_emperors_lost_domain: "Rebut kembali Wilayah Kaisar yang Hilang"
 AFG_reclaim_the_emperors_lost_domain_desc: "Waktunya akhirnya tiba. Dengan situasi dunia saat ini, tidak ada waktu yang lebih baik untuk menyerang [SOV.GetNameDef]. Kami akan membebaskan seluruh Asia Tengah, untuk selamanya!"
 AFG_secure_army_support: "Dukungan Angkatan Darat yang Aman"
 AFG_secure_army_support_desc: "Masih ada sejumlah perwira di angkatan bersenjata yang diangkat atau bertugas di bawah $AFG_amunullah_khan$. Dengan insentif yang tepat, mereka dapat dipaksa untuk mendukung kembalinya ia naik takhta."
 AFG_secure_army_support_tt: "§YLebih banyak divisi tentara akan bergabung dengan pihak kita dalam perang saudara yang akan datang.§!"
 AFG_modifiy_amanullah_insurrection_modifier_tt: "Ubah §Y$AFG_amanullah_insurection_modifier$§! dengan:"
 AFG_modifiy_look_to_the_past_modifier_tt: "Ubah §Y$AFG_look_to_the_past_modifier$§! dengan:"
 AFG_contact_rural_loyalists: "Hubungi Pedesaan Malik"
 AFG_contact_rural_loyalists_desc: "Elit [AFG.GetAdjective] cukup mudah untuk disuap atau dipengaruhi. Sebaliknya, rata-rata [AFG.GetAdjective] tidak begitu tertarik pada pernak-pernik materi atau janji-janji politik. Namun, dengan memanfaatkan nilai-nilai tradisional dan keluhan mereka, kita mungkin masih bisa mempengaruhi tujuan kita."
 AFG_contact_rural_loyalists_tt: "§YLebih banyak divisi milisi Pashtun akan bergabung dengan pihak kita dalam perang saudara yang akan datang.§!"
 AFG_request_german_support: "Minta Dukungan Jerman"
 AFG_request_german_support_desc: "$AFG_amunullah_khan$ telah lama mengagumi [GER.GetNonIdeologyName] dan telah mengumpulkan sejumlah pendukung tingkat tinggi di pemerintahannya. Mungkin mereka akan mendukung kembalinya Raja dengan imbalan rezim bersahabat di wilayah tersebut."
 AFG_request_german_support_tt: "Jika §Y[GER.GetNonIdeologyName]§! menerima usulan kami, mereka akan membekali kami dengan senjata dan mengirimkan sukarelawan untuk membantu kami ketika perang saudara dimulai. §Y[GER_oskar_von_nidermayer.GetName]§! akan bergabung dengan kami sebagai jenderal."
 AFG_request_japanese_support_tt: "Jika §Y[JAP.GetNonIdeologyName]§! menerima usulan kami, mereka akan membekali kami dengan senjata dan mengirimkan sukarelawan untuk membantu kami ketika perang saudara dimulai."
 AFG_political_events_53_tt: "§Y[GER.GetNonIdeologyName] akan membekali kami dengan senjata dan mengirimkan sukarelawan untuk membantu kami ketika perang saudara dimulai.§!"
 AFG_stir_unrest_in_the_east: "Menimbulkan Kerusuhan di Timur"
 AFG_stir_unrest_in_the_east_desc: "Waziristan dan Peshawar tetap menjadi sarang aktivitas anti-[RAJ.GetAdjective] dan [AFG.GetAdjective]. Kita harus mengikuti teladan mereka, dan mengobarkan pemberontakan di Celah Khyber agar pasukan Raja tetap menduduki tempat lain."
 AFG_eastern_state_breakaway_tt: "§Y[1006.GetName]\n[1008.GetName]§!"
 AFG_fascist_cw_is_over: "Pemberontakan Amanullah telah berakhir. (Kaum fasis telah menggulingkan pemerintah dan memenangkan perang saudara.)"
 AFG_request_japanese_support: "Minta Dukungan Jepang"
 AFG_request_japanese_support_desc: "[JAP.GetAdjective] berusaha untuk mendominasi benua Asia, dan mungkin mencari sekutu yang mendukung tujuan utama mereka. Mungkin akan lebih bijaksana untuk meyakinkan mereka bahwa saingan kita, Raja Zahir, menentang gagasan ini, dan mencari dukungan mereka untuk pemberontakan kita yang akan datang."
 AFG_hold_a_loya_jirga: "Adakan Loya Jirga"
 AFG_hold_a_loya_jirga_desc: "Kita harus meyakinkan Raja Zahir untuk mengadakan pertemuan dengan para pemimpin suku dan agama, di mana kita dapat mempertanyakan legitimasinya dan mendapatkan lebih banyak simpati atas pemberontakan yang semakin meningkat."
 AFG_hold_a_loya_jirga_tt: "Ketika §Y[ROOT.GetAdjective] Perang Saudara§! dimulai, pihak lawan akan mendapatkan keuntungan berikut selama §G180§! hari:"
 AFG_invite_waziristan_rebels: "Undang Pemberontak Waziristan"
 AFG_invite_waziristan_rebels_desc: "Faqir dari Ipi dan milisi Lashkarnya saat ini terlibat dalam pertempuran aktif melawan otoritas [RAJ.GetAdjective] di provinsi Barat Laut mereka. Kita harus membantu mereka melintasi perbatasan kita, dan mulai membangun basis kekuatan bagi mereka di wilayah timur kita, sehingga suatu hari nanti mereka dapat kembali ke Waziristan dengan lebih kuat dari sebelumnya."
 AFG_invite_waziristan_rebels_tt: "Ketika §Y[ROOT.GetAdjective] Perang Saudara§! dimulai, kami akan mendapatkan tambahan §G+10000§! Tenaga Kerja"
 AFG_the_faqirs_revolt: "Pemberontakan Faqir"
 AFG_the_faqirs_revolt_desc: "Waktunya akhirnya tiba. Pasukan Faqir siap bangkit di timur untuk melawan pejabat korup di Kabul, dan mengembalikan tradisi Islam yang pernah diandalkan bangsa kita. Insya Allah, kami akan menyelamatkan Afghanistan!"
 AFG_return_of_the_emir: "Kembalinya Raja"
 AFG_return_of_the_emir_desc: "Rencana telah dibuat, kontak telah terjalin dan senjata telah didistribusikan. Yang tersisa hanyalah Raja kembali ke Afghanistan dan pemberontakan kita akan memulai penggulingan rezim tidak sah Raja Zahir."
 AFG_revive_the_1923_constitution: "Menghidupkan kembali UUD 1923"
 AFG_revive_the_1923_constitution_desc: "Raja adalah seorang visioner yang, pada tahun 1923, memahami bahwa bangsa ini perlu dibawa ke abad ke-20. Namun reformasinya dirusak oleh Zahir Shah. Namun dengan kembalinya kekuasaan Raja, kita dapat melanjutkan apa yang dia tinggalkan dan memulihkan konstitusi tahun 1923-nya."
 AFG_custail_pashtunwali_primacy: "Batasi Keutamaan Pashtunwali"
 AFG_custail_pashtunwali_primacy_desc: "Kode moral tradisional suku Pashtun, Pashtunwali, tidak mendapat tempat di negara bagian baru Raja. Serangkaian undang-undang baru akan diberlakukan untuk memperkuat kekuatan Pashtun sekaligus memodernisasi seperangkat kode kuno ini."
 AFG_education_for_women_and_girls: "Pendidikan Untuk Wanita Dan Anak Perempuan"
 AFG_education_for_women_and_girls_desc: "Raja dan istrinya memahami pentingnya memberikan kesempatan bagi perempuan dan anak perempuan untuk mendapatkan pendidikan dibandingkan harus menjalani kehidupan sebagai pembantu rumah tangga. Setelah pemecatannya, reformasi pendidikan Raja dicabut. Sekarang kami akan memperbaiki ketidakadilan itu."
 AFG_enforce_western_attire: "Terapkan Pakaian Barat"
 AFG_enforce_western_attire_desc: "Raja dan lingkaran dalamnya tidak terkesan dengan pakaian tradisional yang dianut mayoritas penduduknya. Mereka melihatnya sebagai tanda masyarakat yang kuno dan oleh karena itu, mereka ingin mendirikan pabrik tekstil dan undang-undang baru untuk menegakkan penerapan pakaian barat."
 AFG_crackdown_on_nomadic_practices: "Tindakan Keras Terhadap Praktik Nomaden"
 AFG_crackdown_on_nomadic_practices_desc: "TODO"
 AFG_repaying_our_friends: "Membalas Teman Kita"
 AFG_repaying_our_friends_desc: "TODO"
 AFG_expand_state_run_factories: "Perluas Pabrik yang Dikelola Negara"
 AFG_expand_state_run_factories_desc: "Setelah bertahun-tahun diabaikan oleh rezim sebelumnya, sekarang saatnya kita memulai modernisasi ekonomi negara melalui pendirian pabrik-pabrik baru yang dikelola negara yang memproduksi barang-barang konsumsi dan militer."
 AFG_reinforce_the_royal_guard: "Bayangan Raja"
 AFG_reinforce_the_royal_guard_desc: "Terlepas dari legitimasinya, banyak orang yang tidak puas dengan kembalinya Raja dan reformasi radikal yang dilakukannya. Para pengkhianat ini tidak boleh dibiarkan meremehkan pekerjaan Raja dan harus ditangani oleh pasukan keamanan baru yang beroperasi secara diam-diam dan memaksakan kehendaknya."
 AFG_reinforce_the_royal_guard_tt: "Buka keputusan §Y$AFG_shadows_of_the_emir_category$§! untuk menindak perbedaan pendapat dan meningkatkan stabilitas."
 AFG_increase_land_and_animal_taxes: "Meningkatkan Pajak Tanah dan Hewan"
 AFG_increase_land_and_animal_taxes_desc: "Penduduk pedesaan hanya memberikan sedikit kontribusi terhadap vitalitas ekonomi negara dan pertanian subsisten mereka memungkinkan mereka menghindari sebagian besar bentuk perpajakan. Untuk memberi insentif pada praktik pertanian yang lebih modern, kita akan memberlakukan kebijakan perpajakan baru yang memaksa mereka mencari keuntungan lebih besar jika ingin menyediakan pangan."
 AFG_expand_state_education: "Memperluas Pendidikan Negara"
 AFG_expand_state_education_desc: "TODO"
 AFG_establish_darulaman: "Mendirikan Darulaman"
 AFG_establish_darulaman_desc: "Darulaman akan menjadi kota terencana baru yang menggantikan Kabul sebagai ibu kota [AFG.GetNonIdeologyName]. Ketika Raja digulingkan, pekerjaan pembangunan kota dihentikan. Sekarang kita dapat menyelesaikan proyek ini dan menjadikannya sebagai mercusuar modernitas."
 AFG_towards_an_amanullah_caliphate: "Menuju Khilafah Amanullah"
 AFG_towards_an_amanullah_caliphate_desc: "$AFG_amunullah_khan$ pernah mempertimbangkan untuk mengambil gelar Khalifah setelah pembubaran Kesultanan Utsmaniyah, namun memutuskan untuk tidak melakukannya dan memilih rezim yang lebih modern. Kali ini, dia memutuskan untuk tidak melakukan kesalahan yang sama dan malah akan mengamankan posisinya sebagai pemimpin dunia Islam."
 AFG_alternative_partnerships: "Carilah Kemitraan Alternatif"
 AFG_alternative_partnerships_desc: "Kami telah berhasil mempertahankan kemandirian kami dengan secara hati-hati memainkan [ENG.GetAdjective] dan [SOU.GetAdjective] satu sama lain selama beberapa dekade. Namun sekarang, ada pemain baru yang bergabung dalam Permainan Hebat, dan kami akan menyesuaikan strategi kami."
 AFG_officer_training: "Pelatihan Petugas"
 AFG_officer_training_desc: "Tentara [GER.GetAdjective] telah membuktikan diri mereka lebih dari sekedar tandingan tentara [ENG.GetAdjective] atau [SOU.GetAdjective]. Kita harus meminta dukungan dari perwira mereka dalam melatih prajurit [ROOT.GetAdjective] generasi berikutnya."
 AFG_permit_axis_airbases: "Izin Pangkalan Udara Poros"
 AFG_permit_axis_airbases_desc: "Teman-teman kami di [GER.Capital.GetCapitalVictoryPointName] sedang berjuang untuk mengerahkan angkatan udara mereka begitu jauh dari rumah. Kita dapat mengatasi masalah ini bagi mereka sambil juga memperoleh infrastruktur dan keahlian yang bermanfaat bagi diri kita sendiri."
 AFG_join_axis: "Bergabunglah dengan Poros"
 AFG_join_axis_desc: "Meskipun sejauh ini kita telah menghindari keterlibatan dalam konflik besar, ada banyak peluang yang dapat kita manfaatkan jika kita berkomitmen penuh pada tujuan Poros. Oleh karena itu, kami akan mengajukan petisi untuk keanggotaan penuh aliansi tersebut."
 AFG_axis_airforce: "Angkatan Udara Poros"
 AFG_axis_airforce_desc: "Setelah bekerja sama dengan angkatan udara [GER.GetAdjective], kami yakin kami dapat menciptakan kekuatan fungsional kami sendiri sesuai dengan gambaran mereka. Yang kita butuhkan hanyalah peralatan untuk melakukannya."
 AFG_axis_equipment: "Peralatan Poros"
 AFG_axis_equipment_desc: "Peralatan militer kita merupakan varian yang tidak cocok dari sejumlah negara. Namun, dengan sedikit bantuan dari [GER.GetAdjective]s, kami akhirnya dapat menstandarkan semua peralatan kami dan memodernisasikannya pada saat yang bersamaan."
 AFG_kabul_conference: "Konferensi Kabul"
 AFG_kabul_conference_desc: "Setelah berpuluh-puluh tahun berjuang terjebak antara [ENG.GetAdjective] dan [SOU.GetAdjective], kini kita mempunyai kesempatan untuk berdiri bersama para penguasa tatanan dunia baru dan dapat mengklaim apa yang menjadi hak kita."
 AFG_kabul_conference_tt: "Buka keputusan §Y$AFG_kabul_conference_category$§! untuk mengurangi biaya penawaran negara-negara sasaran di §YIndia, Asia Tengah, Iran dan Timur Tengah§! selama konferensi perdamaian ketika faksi kami menang."
 AFG_support_king_zahir: "Dukung Raja Zahir"
 AFG_support_king_zahir_desc: "Setelah puluhan tahun mengalami ketidakstabilan politik, pemerintahan Raja Zahir Shah akan menandai dimulainya era perdamaian dan stabilitas ekonomi bagi negara kita yang terkepung."
 AFG_support_king_zahir_tt: "§YRaja Zahir Shah§! memperoleh:\nPerolehan Kekuatan Politik §G+5%§!\nDukungan Harian untuk Kelompok yang Tidak Sejajar §G+0.02§!"
 AFG_biding_our_time: "Menunggu Waktu Kita"
 AFG_biding_our_time_desc: "Dengan Raja Zahir Shah yang bertindak sebagai pemimpin negara, pemerintah dapat menjalankan urusannya tanpa takut akan terjadinya pemberontakan radikal, selama pemerintah tetap mendukung mayoritas konservatif. Namun, peluang untuk melakukan modernisasi negara dengan cara yang tidak melanggar aktivitas tradisional masih kecil."
 AFG_expand_the_kings_powerbase: "Perluas Basis Kekuatan Raja"
 AFG_expand_the_kings_powerbase_desc: "Raja muda Zahir Shah hanyalah boneka bagi rakyatnya. Sementara itu, paman Raja memegang posisi pemerintahan yang paling berkuasa. Namun, Raja menjadi semakin frustrasi dengan pemikiran kuno mereka dan keinginan untuk membangun dukungan bagi rezim yang lebih progresif."
 AFG_visit_foreign_capitals: "Kunjungi Ibu Kota Asing"
 AFG_visit_foreign_capitals_desc: "Rezim kita tidak memiliki hubungan yang kuat dengan negara-negara besar di seluruh dunia. Ketika situasi geopolitik menjadi kurang stabil, maka akan menjadi kepentingan terbaik kita untuk menjalin hubungan yang lebih baik dengan negara-negara tersebut jika ada peluang yang terbuka bagi kita."
 AFG_retire_the_uncles: "Pensiunkan Paman"
 AFG_retire_the_uncles_desc: "Situasi politik mulai bergeser pada [ROOT.Capital.GetCapitalVictoryPointName] sehingga merugikan rezim lama. Kini saatnya bagi Raja untuk membubarkan kabinet yang ada saat ini dan membentuk kabinet baru sesuai dengan tujuannya sendiri."
 AFG_implement_currency_controls: "Bank Afghanistan"
 AFG_implement_currency_controls_desc: "Perekonomian kita tidak memiliki sektor keuangan yang kuat yang dapat mendukung pembangunan ekonomi bangsa. Oleh karena itu, kita harus bekerja sama dengan sektor swasta untuk mendirikan bank milik bersama yang dapat menawarkan layanan kepada industri dan bisnis kita yang sedang berkembang."
 AFG_privatize_factories: "Privatisasi Pabrik"
 AFG_privatize_factories_desc: "TODO"
 AFG_introduce_national_service: "Perkenalkan Pelayanan Nasional"
 AFG_introduce_national_service_desc: "Negara-negara di sekitar kita sedang terjerumus ke dalam konflik dan tidak ada jaminan kita bisa terhindar dari pusaran konflik. Untuk mempersiapkan kemungkinan seperti itu, kami akan memperkenalkan suatu bentuk layanan nasional untuk memperkuat angkatan bersenjata."
 AFG_placeholder_1: "Mengamankan Investasi Jerman"
 AFG_placeholder_1_desc: "Kami tidak menyukai [ENG.GetAdjective] atau [SOU.GetAdjective] setelah berabad-abad permusuhan dan konflik di antara kami. Namun, meningkatnya [GER.GetName] memberi kita kesempatan untuk mendapatkan mitra internasional yang memiliki pemikiran serupa."
 AFG_gain_religious_support_for_reforms: "Orang yang Menaruh Kepercayaannya pada Tuhan"
 AFG_gain_religious_support_for_reforms_desc: "Ada kekhawatiran yang semakin besar di kalangan masyarakat bahwa Raja muda Zahir Shah akan menggunakan kekuasaan barunya untuk melaksanakan reformasi drastis yang akan mengganggu cara hidup mereka. Untuk meredakan ketakutan ini, kita akan mendapatkan dukungan dari para Mullah dan menunjukkan komitmen Raja terhadap Islam."
 AFG_reform_1: "Reformasi Pendidikan"
 AFG_reform_1_desc: "Transisi menuju demokrasi parlementer tidak berjalan mulus dan kita harus berbuat lebih banyak untuk menanamkan nilai-nilai demokrasi pada generasi berikutnya. Oleh karena itu, kita harus mereformasi sistem pendidikan dan membuatnya lebih mudah diakses oleh semua anak di seluruh negeri."
 AFG_concessions_to_pashtuns: "Konsesi Untuk Pashtun"
 AFG_concessions_to_pashtuns_desc: "Suku Pashtun merupakan mayoritas penduduk dan sebagian besar keluarga mereka telah menganut tradisi kuno Pashtunwali selama berabad-abad. Kini, banyak dari mereka yang khawatir cara hidup mereka terkikis. Hal ini mungkin bisa diatasi jika kita ingin memasukkan lebih banyak nasionalis Pashtun dan praktisi Pashtunwali ke dalam pemerintahan."
 AFG_reform_2: "Bangun Bendungan Chak"
 AFG_reform_2_desc: "Dengan bantuan mitra asing kami, kami memiliki sarana teknologi dan finansial untuk membangun bendungan pembangkit listrik tenaga air baru yang besar di sungai Chak untuk menyediakan listrik ke ibu kota dan daerah sekitarnya. Meskipun hal ini pasti akan mengecewakan musuh-musuh para dermawan kita."
 AFG_reform_3: "Membatasi Pengaruh Anti-Demokrasi"
 AFG_reform_3_desc: "Meskipun kami berupaya untuk menjembatani kesenjangan antara pemerintah baru dan oposisi, banyak dari mereka yang masih rentan terhadap keyakinan reaksioner dan anti-demokrasi dan sangat mungkin mereka akan bertindak melawan kami jika diberi kesempatan. Oleh karena itu, kita harus berbuat lebih banyak untuk membatasi aktivitas semacam itu."
 AFG_reform_4: "Modernisasi Ekonomi"
 AFG_reform_4_desc: "Dengan kembalinya stabilitas ke [ROOT.GetNonIdeologyName], minat investasi dan bisnis terhadapnya pun ikut mengikuti. Untuk memulai perekonomian, kita akan berinvestasi dalam modernisasi pertanian dan industri terbatas kita."
 AFG_parliamentary_democracy: "Demokrasi Parlementer"
 AFG_parliamentary_democracy_desc: "Keyakinan politik Raja Zahir Shah mulai bersinar setelah bertahun-tahun berada di bawah bayang-bayang pamannya. Jelas bahwa Raja akan mendukung transisi menuju demokrasi parlementer jika terdapat cukup dukungan dari masyarakat untuk melakukan perubahan tersebut. Namun, perubahan radikal seperti itu dapat menjerumuskan negara ke dalam perang saudara dengan lebih banyak masyarakat tradisional berada di luar ibu kota."
 AFG_parliamentary_democracy_tt: "§YJika dukungan demokrasi lebih besar dari 50%, kita akan terhindar dari pemicu perang saudara.§!"
 AFG_secure_dynasty: "Amankan Dinasti"
 AFG_secure_dynasty_desc: "Dengan perekonomian yang stabil dan masyarakat yang tenang, kita dapat mengamankan Dinasti Barakzai dengan menyingkirkan unsur-unsur pemerintah yang kurang setia dan menggantinya dengan anggota keluarga lain yang setia kepada Raja. Atau yang lebih penting, pamannya."
 AFG_maintain_neutrality: "Pertahankan Netralitas"
 AFG_maintain_neutrality_desc: "Meskipun di dalam negeri relatif stabil, situasi global semakin berbahaya. Sebelum kita terseret ke dalam konflik apa pun yang bertentangan dengan keinginan kita, kita harus memperjelas kepada semua orang bahwa kita tetap merupakan negara netral."
 AFG_expel_axis_nationals: "Usir Warga Negara Poros"
 AFG_expel_axis_nationals_desc: "Sekutu menuduh kami menjadi kaki tangan musuh mereka karena banyaknya warga negara yang berperang yang diizinkan melakukan aktivitas mereka secara bebas di [ROOT.GetNonIdeologyName]. Meskipun hanya ada sedikit bukti bahwa mereka melakukan sesuatu yang merugikan kepentingan kita, kita harus menenangkan Sekutu dengan meminta orang-orang ini pergi selama konflik global sedang berlangsung."
 AFG_expel_allied_nationals: "Usir Warga Negara Sekutu"
 AFG_expel_allied_nationals_desc: "Kekuatan Poros telah memberi kita bukti yang meragukan bahwa rezim kita berisiko direbut oleh Sekutu. Mereka berpendapat bahwa satu-satunya cara untuk mencegah hal ini adalah dengan mengusir semua warga negara Sekutu dan mengusir semua mata-mata mereka di negara tersebut."
 AFG_pursue_our_own_agenda: "Kejar Agenda Kami Sendiri"
 AFG_pursue_our_own_agenda_desc: "Tatanan internasional sedang diubah ketika negara-negara besar saling berbenturan satu sama lain. Daripada mengikat diri kita pada satu kelompok saja, kita harus mengambil keuntungan dari kekacauan ini dan mengejar tujuan kebijakan luar negeri kita sendiri."
 AFG_align_with_the_allies: "Sejajarkan dengan Sekutu"
 AFG_align_with_the_allies_desc: "Meskipun terdapat banyak keluhan dengan Inggris, kita harus mengesampingkannya untuk saat ini dan mengupayakan kerja sama yang lebih besar dengan Sekutu. Seperti kata orang Inggris, lebih baik berurusan dengan iblis lho."
 AFG_demand_pashtunistan_referendum: "Menuntut Referendum Pashtunistan"
 AFG_demand_pashtunistan_referendum_desc: "Suku Pashtun merupakan mayoritas di negara kami, namun banyak yang masih berada di luar perbatasan kami di negara-negara tetangga. Kita perlu mendorong kemerdekaan bagi suku Pashtun di negara-negara bagian tersebut sehingga kita dapat membawa mereka ke dalam wilayah pengaruh kita."
 AFG_protector_of_the_tajiks: "Pelindung Orang Tajik"
 AFG_protector_of_the_tajiks_desc: "Ketegangan sering muncul antara mayoritas warga Pashtun dan sejumlah besar warga Tajik di wilayah Utara. Namun, kita memiliki kesempatan untuk memenangkan hati mereka dengan membebaskan orang-orang Tajik di luar perbatasan kita di bawah pemerintahan despotik [742.OWNER.GetLeader]."
 AFG_protector_of_the_tajiks_tt: "Buka keputusan untuk mengusulkan perdamaian dengan [742.OWNER.GetNameDef] ketika [742.GetName] ditempati oleh [ROOT.GetName]"
 AFG_anti_soviet_cooperation: "Kerja Sama Anti Soviet"
 AFG_anti_soviet_cooperation_desc: "Terdapat banyak negara yang ingin melihat pengaruh [SOU.GetAdjective] dibatasi. Kita harus menggunakan ini sebagai kesempatan untuk mendapatkan keahlian militer dari negara-negara tersebut sehingga kita sepenuhnya siap menghadapi ekspansionisme [SOU.GetAdjective] di masa depan."
 AFG_sinkiang_intervention: "Intervensi Sinkiang"
 AFG_sinkiang_intervention_desc: "[SIK.GetNonIdeologyName] telah lama menjadi bagian dari dunia Islam. Namun, kebangkitan komunisme di bekas Kekaisaran Rusia dan Tiongkok kini mengancam umat Islam di seberang perbatasan sana. Sudah saatnya kita mengakhiri ancaman terhadap mereka untuk selamanya."
 AFG_gant_refuge_to_jadidists: "Berikan Perlindungan kepada Jadidists"
 AFG_gant_refuge_to_jadidists_desc: "Kaum modernis dan reformis Islam yang merupakan bagian dari gerakan Jadid di [SOV.GetNameDef] secara aktif ditindas oleh pemerintah, dan banyak mantan anggota Bukharan Muda dan Khivan Muda menjadi sasaran pembersihan [SOV.GetLeader]. Adalah bijaksana untuk memberi mereka perlindungan di negara kita, sambil membiarkan mereka menyampaikan cita-cita demokrasi mereka kepada kita."
 AFG_ally_the_young_afghans: "Sekutu Pemuda Afghanistan"
 AFG_ally_the_young_afghans_desc: "Dipelopori oleh intelektual Mahmud Tarzi, Kaum Muda Afghanistan mempengaruhi mantan Amanullah Khan dan mendorong gerakan reformis yang menganjurkan monarki konstitusional. Kita harus membangun kembali kontak dengan beberapa loyalis Amanullah yang cenderung demokratis, dan memastikan dukungan mereka terhadap pemerintahan baru kita yang demokratis."
 AFG_propose_confederation_with_pakistan: "Usulkan Konfederasi dengan Pakistan"
 AFG_propose_confederation_with_pakistan_desc: "Masyarakat [PAK.GetNonIdeologyName] telah terlalu lama menderita di bawah pemerintahan [ENG.GetAdjective] dan berhak untuk mendorong kemerdekaan mereka. Namun, masyarakat kita memiliki begitu banyak sejarah dan budaya sehingga masuk akal jika kedua negara kita menjadi satu sebelum kita malah berselisih satu sama lain."
 AFG_afghan_pakistan_cold_War: "Perang Dingin Afghanistan-Pakistan"
 AFG_afghan_pakistan_cold_War_desc: "Meskipun menyakitkan bagi kita untuk berselisih dengan saudara-saudara kita di seberang perbatasan, kita harus mengakui ancaman yang mereka timbulkan terhadap kita. Oleh karena itu, kita harus melakukan persiapan untuk mengendalikannya dengan menggunakan cara apa pun yang diperlukan."
 AFG_graveyard_of_empires: "Makam Kerajaan"
 AFG_graveyard_of_empires_desc: "Kerajaan datang dan pergi, namun masyarakat kita tetap menjadi penguasa wilayah ini. Selama masyarakat kita tetap bersatu dan terhubung dengan warisan mereka, setiap penyerang akan menganggap [ROOT.GetNonIdeologyName] sebagai kuburan mereka."
 AFG_prepare_for_operation_countenance: "Mempersiapkan Wajah Operasi"
 AFG_prepare_for_operation_countenance_desc: "Sekutu bersiap untuk melakukan intervensi di negara tetangga [PER.GetName] untuk mengamankan minyak mereka sebelum musuh mengalahkan kita. Kita harus membuat pengaturan logistik untuk mendukung intervensi dan melakukan bagian kita dalam operasi mendatang."
 AFG_invite_foreign_corporations: "Undang Perusahaan Asing"
 AFG_invite_foreign_corporations_desc: "Kita masih tertinggal dalam industri dibandingkan dengan negara-negara lain, dan dampaknya adalah sedikitnya produksi senjata dalam negeri. Untuk membalikkan keadaan ini dan memodernisasi industri kita, kita akan mengundang perusahaan-perusahaan dari seluruh dunia untuk mendirikan operasi di sini."
 AFG_secure_iran: "Amankan Iran"
 AFG_secure_iran_desc: "Waktunya telah tiba untuk mengamankan ladang minyak [PER.GetAdjective]. Bersama dengan sekutu kami, kami akan melakukan apa yang harus kami lakukan. Sekalipun memerlukan perubahan rezim di [PER.Capital.GetCapitalVictoryPointName]."
 AFG_repeal_the_durand_line: "Cabut Garis Durand"
 AFG_repeal_the_durand_line_desc: "Kami telah membuktikan diri sebagai teman yang dapat dipercaya di wilayah ini bagi Sekutu. Mungkin sekarang adalah kesempatan yang baik untuk menegosiasikan kembali Garis Durand yang dipaksakan secara kejam kepada kita bertahun-tahun yang lalu."
 AFG_future_of_balochistan: "Masa Depan Balochistan"
 AFG_future_of_balochistan_desc: "Meskipun saat ini kita sedang berkolaborasi dengan Sekutu, kita harus memikirkan politik jangka panjang di kawasan kita. Oleh karena itu, kita harus mendorong Balochistan merdeka agar bisa kita pengaruhi, sebelum ia diambil alih oleh negara yang lebih besar."
 AFG_linchpin_of_global_defense: "Kunci Utama Pertahanan Global"
 AFG_linchpin_of_global_defense_desc: "Sekutu terus memandang kesetiaan kita sebagai aset dalam sikap geo-politik mereka terhadap musuh bersama. Kita harus memanfaatkan hal ini dengan mendapatkan lebih banyak investasi pada infrastruktur militer yang akan saling menguntungkan bagi kita semua."
 AFG_promote_the_counter_elite: "Promosikan Counter Elite"
 AFG_promote_the_counter_elite_desc: "Banyak elit politik yang mempunyai ide-ide radikal untuk memodernisasi bangsa, namun mereka tidak mampu mengeksplorasi ide-ide tersebut karena iklim politik yang konservatif. Dengan dibubarkannya pemerintahan lama, mungkin sudah tiba waktunya untuk mempromosikan kelompok radikal ini."
 AFG_promote_the_counter_elite_tt: "Penasihat berikut akan tersedia untuk disewa:"
 AFG_support_warzistan_independence: "Mendukung Kemerdekaan Waziristan"
 AFG_support_warzistan_independence_desc: "Perbatasan kita dengan [ENG.GetAdjective] di India selalu menjadi sumber ketegangan antar negara. Meskipun kita tidak mempunyai kekuatan untuk mengusir mereka dari wilayah tersebut, kita dapat melemahkan kekuasaan mereka dengan mendukung gerakan kemerdekaan seperti yang terjadi di Waziristan."
 AFG_socialist_coup: "Kudeta Sosialis"
 AFG_socialist_coup_desc: "Dengan terkikisnya pembatasan konservatif terhadap pemikiran politik, kotak Pandora telah terbuka dan gelombang sentimen anti-monarki melanda negara ini. Sekaranglah waktunya untuk menyapu bersih Kerajaan kuno ini dan mendirikan negara sosialis modern."
 AFG_socialist_coup_tt: "§YJika dukungan komunis lebih besar dari 60%, kita akan terhindar dari pemicu perang saudara.§!"
 AFG_state_atheism: "Negara Ateisme"
 AFG_state_atheism_desc: "Pashtunwali, Islam, dan semua aliran opioid tradisional lainnya harus disingkirkan jika kita ingin memodernisasi perekonomian dan masyarakat. Oleh karena itu, kita harus membatasi praktik-praktik kuno ini dan mendidik masyarakat dengan cara sekuler."
 AFG_soviet_research_cooperation: "Kerjasama Penelitian Soviet"
 AFG_soviet_research_cooperation_desc: "Musuh kita di [SOU.GetNameDef] dengan cepat menjadi teman terdekat kita setelah kita menggulingkan rezim lama. Oleh karena itu, kami memiliki peluang untuk mendapatkan wawasan teknologi dari mereka yang akan membantu transformasi [ROOT.GetNonIdeologyName]."
 AFG_soviet_research_technology_exchange_tt: "§Y[SOU.GetNameDefCap] akan lebih cenderung menerima jika mereka memiliki pendapat yang tinggi tentang kita.§!\nJika [SOU.GetFlag]§Y[SOU.GetNameDef]§! menyetujui proposal tersebut, kami akan bergabung dengan grup berbagi teknologi dengan mereka."
 AFG_communist_industrialization: "Industrialisasi Komunis"
 AFG_communist_industrialization_desc: "Ketika kita telah membongkar mekanisme pemerintahan lama rezim imperialis, kita sekarang dapat memulai proses kolektivisasi dan industrialisasi yang pesat untuk membawa perekonomian kita memasuki abad ke-20."
 AFG_support_soviets_in_asia: "Mendukung Soviet di Asia"
 AFG_support_soviets_in_asia_desc: "Republik-republik Asia Tengah yang tergabung dalam [SOU.GetNameDef] merupakan sarang aktivitas kontra-revolusioner karena jaraknya yang jauh dari [SOU.Capital.GetCaptialVictoryPointName]. Untuk mencegah meluasnya kelompok reaksioner ke negara kita, kita harus mendukung [SOU.GetAdjective] dalam menjaga ketertiban di kawasan."
 AFG_integrate_tajik_and_uzbek_republics: "Pembela Asia Tengah"
 AFG_integrate_tajik_and_uzbek_republics_desc: "Kami telah membuktikan diri sebagai aset yang sangat berharga bagi [SOU.GetNameDef]. Oleh karena itu, wajar jika kami meminta konsesi teritorial atas upaya kami. Hal ini juga akan membantu menenangkan kelompok minoritas non-Pashtun di Utara."
 AFG_ally_basmachi_remnants: "Sisa Sekutu Basmachi"
 AFG_ally_basmachi_remnants_desc: "Hingga tahun 1934, Basmachi berjuang melawan kekuatan [SOV.GetAdjective] untuk membebaskan Asia Tengah dari kekuasaan tirani mereka. Meskipun gerakan mereka telah ditumpas, beberapa pemimpin mereka berhasil melarikan diri. Kita harus berusaha menjalin kontak dengan para pejuang kemerdekaan ini, dan mengundang mereka ke pengadilan kita. Mereka mungkin sudah mendukung Habibullah Kalakani sebelumnya, tapi dengan amannya kekuasaan kita, mereka akan mudah terpengaruh."
 AFG_integrate_tajik_and_uzbek_republics_tt: "Jika §Y[SOU.GetName]§! menyetujui usulan:"
 AFG_republic_of_afghanistan: "Deklarasikan Republik"
 AFG_republic_of_afghanistan_desc: "Ini merupakan langkah besar dalam merangkul demokrasi dalam bentuk monarki konstitusional. Namun, masih ada kekhawatiran bahwa kebebasan demokratis kita tidak akan pernah terjamin sepenuhnya sampai kita menghapus sisa-sisa monarki dengan mendeklarasikan sebuah Republik dan memilih kepala negara yang demokratis."
 AFG_republic_of_afghanistan_tt: "§YKita akan dapat memilih identitas baru bagi bangsa kita yang dapat mengubah apa yang dianggap sebagai negara inti kita atau dapat menambah ide-ide baru.§!"
 AFG_hot_war_with_pakistan: "Hilangkan Pakistan"
 AFG_hot_war_with_pakistan_desc: "Orang-orang bodoh di [PAK.GetNonIdeologyName] ingin memecah belah rakyat kita dan membuat kita semua terus bertengkar sementara ancaman nyata dari [SOU.GetNameDef] dan [RAJ.GetNameDef] terus bertambah kuat. Kita harus melenyapkan rezim baru ini sebelum mereka membiarkan seluruh rakyat kita berada di bawah kekuasaan kekuasaan lain."
 AFG_accelerate_integration: "Perkuat Konfederasi"
 AFG_accelerate_integration_desc: "Pembentukan konfederasi antara [ROOT.GetNonIdeologyName] dan [PAK.GetNonIdeologyName] baru-baru ini membuahkan kesuksesan besar. Namun, kita harus mempercepat proses integrasi lebih jauh lagi untuk memastikan kita siap menghadapi apa pun yang mungkin terjadi di dunia."
 AFG_seek_british_investment: "Carilah Investasi Inggris"
 AFG_seek_british_investment_desc: "Selama beberapa dekade kita telah memicu [ENG.GetAdjective] ketakutan akan [SOV.GetNameDef] yang menyerbu negara kita dan mencaplok wilayah India mereka yang berharga. Hal ini menghasilkan tunjangan dan investasi yang membuat kami tetap berada di pihak mereka. Ketika situasi dunia menjadi lebih lemah, melanjutkan permainan ini mungkin akan lebih menguntungkan."
 AFG_central_asian_unification: "Unifikasi Asia Tengah"
 AFG_central_asian_unification_desc: "Asia Tengah telah bertransformasi dari negara yang ekonominya terbelakang menjadi negara industri yang berkembang pesat melalui pengelolaan yang cermat. Bersama-sama, kita akan membentuk masa depan sosialis baru bagi seluruh rakyat kita."
 AFG_central_asian_unification_tt: "Buka keputusan §Y$AFG_develop_central_asia_category$§! untuk mendapatkan inti di negara bagian bekas [SOU.GetAdjective] di Asia Tengah yang ditransfer ke kami."
 AFG_sov_iran_war: "Menggulingkan Shah [PER.GetNonIdeologyName]"
 AFG_sov_iran_war_desc: "Kawan-kawan kita di [SOU.GetNameDef] dikepung dari semua sisi, mencegah mereka mempertahankan armada air hangat yang dapat melawan musuh kita. Karena dukungan implisit mereka terhadap musuh-musuh kita, pendudukan [PER.GetName] dapat memberi kita basis baru untuk operasi angkatan laut dan akan menyingkirkan kita dari musuh potensial."
 AFG_development_in_uzb: "Mengembangkan Uzbekistan"
 AFG_development_in_uzb_desc: "Uzbekistan telah lama diabaikan oleh berbagai rezim yang mendudukinya. Jika kita ingin mengamankan kendali atas kawasan ini, kita harus memperbaiki ketidakadilan ini dan meningkatkan pembangunan di kawasan ini sembari mengintegrasikannya ke dalam perekonomian kita."
 AFG_development_in_taj: "Kembangkan Tajikistan"
 AFG_development_in_taj_desc: "Tajikistan adalah bayangan dari apa yang mungkin terjadi. Dengan integrasi ke dalam perekonomian kita, hal ini dapat menjadi sumber aluminium dan sumber daya penting lainnya yang berharga bagi upaya modernisasi kita."
 AFG_development_in_tms: "Kembangkan Turkmenistan"
 AFG_development_in_tms_desc: "Minyak menjadi sumber daya penting bagi perekonomian modern atau militer. Untungnya, para penambang telah menentukan bahwa Turkmenistan mengandung banyak sekali cairan berharga tersebut, dan tinggal menunggu untuk diekstraksi."
 AFG_modern_economy: "Perekonomian Modern"
 AFG_modern_economy_desc: "Kita akhirnya melepaskan belenggu praktik ekonomi kuno yang telah menghambat masyarakat kita selama berabad-abad. Kini, kita benar-benar dapat berdiri berdampingan dengan negara-negara industri maju lainnya di dunia."
 AFG_darulaman: "Darulaman"
 AFG_darulaman_university: "Universitas Darulaman"
 AFG_darulaman_university_desc: "Kota Darulaman yang modern berkembang pesat setelah adanya pengalihan fasilitas pemerintah ke kota tersebut. Namun Raja ingin menjadikan Darulaman sebagai kota besar pembelajaran melalui pendirian universitas baru dengan fasilitas kelas dunia."
 AFG_modifiy_1923_constitution_modifier_tt: "Ubah §Y$AFG_1923_constitution_modifier$§! dengan:"
 AFG_from_the_ashes: "Dari Abu"
 AFG_from_the_ashes_desc: "Sejak runtuhnya Kesultanan Utsmaniyah, terjadi kekosongan kekuasaan di dunia Islam. Kini, ketika negara-negara besar sekali lagi terganggu oleh konflik global, kita mempunyai kesempatan untuk menegaskan diri kita sebagai kekuatan unggul di dunia Islam."
 AFG_exploit_turko_persian_heritage: "Memanfaatkan Warisan Turki-Persia"
 AFG_exploit_turko_persian_heritage_desc: "Bangsa kita telah sangat dipengaruhi selama berabad-abad oleh budaya [PER.GetAdjective] dan [TUR.GetAdjective]. Kita harus mengedepankan hal ini dalam politik kita dan membentuk identitas Turki-Persia baru yang dapat digunakan untuk membangun rasa persatuan dengan tetangga kita."
 AFG_exploit_turko_persian_heritage_tt: "Buka keputusan §Y$AFG_turko_persian_heritage_category$§! untuk mengundang negara-negara ke faksi kami atau mendapatkan tujuan perang melawan mereka."
 AFG_protector_of_baghdad: "Pelindung Bagdad"
 AFG_protector_of_baghdad_desc: "TODO"
 AFG_savior_of_the_holy_lands: "Penyelamat Tanah Suci"
 AFG_savior_of_the_holy_lands_desc: "Saatnya telah tiba bagi kita untuk memenuhi tugas suci dan membebaskan Tanah Suci dari kuk penindas asing. Prajurit pemberani kita akan berbaris dengan kekuatan nenek moyang kita, terinspirasi oleh tujuan yang benar untuk merebut kembali tempat lahirnya iman kita. Upaya ilahi ini tidak hanya akan menyatukan dunia Islam di bawah kepemimpinan kita tetapi juga membawa kehormatan dan kejayaan bagi bangsa kita yang besar."
 AFG_recruit_experts_and_officers: "Rekrut Ahli dan Petugas"
 AFG_recruit_experts_and_officers_desc: "Para ilmuwan, insinyur, dan perwira militer yang pernah mengabdi pada negara bagian [PER.GetAdjective] atau [TUR.GetAdjective] kini mulai melihat keunggulan bangsa kita. Dengan demikian, kita mungkin bisa meyakinkan mereka untuk membantu kita dalam upaya kita menjadikan diri kita sebagai kekuatan besar di kawasan."
 AFG_turko_persian_empire: "Kekaisaran Turki-Persia"
 AFG_turko_persian_empire_desc: "Dengan mayoritas wilayah [TUR.GetAdjective] dan [PER.GetAdjective] kini berada di bawah kendali kita, inilah saatnya kita mengatur ulang wilayah kekuasaan kita menjadi Kekaisaran Turki-Persia yang baru, demi keselamatan dan keamanan masyarakat besar kita."
 AFG_eyes_on_the_north: "Mata tertuju ke Utara"
 AFG_eyes_on_the_north_desc: "Wilayah di utara kita kaya akan sumber daya yang belum sepenuhnya dieksploitasi oleh musuh-musuh kita. Sangat penting bagi kita untuk mulai membuat persiapan yang diperlukan untuk potensi ekspansi ke bidang-bidang ini. Memperkuat kehadiran militer dan mengamankan jalur pasokan akan menjadi langkah penting dalam proses ini."
 AFG_alliance_with_turkik_peoples: "Aliansi dengan Rakyat Turki"
 AFG_alliance_with_turkik_peoples_desc: "Sebagai bagian dari tujuan strategis kami di wilayah utara, sangatlah penting untuk melemahkan struktur kekuasaan yang ada dengan memicu kerusuhan di antara masyarakat Turki di wilayah tersebut. Dengan mengeksploitasi keluhan yang ada dan mendorong perbedaan pendapat, kita dapat menggoyahkan pemerintah daerah dan menciptakan lingkungan yang lebih mendukung ekspansi kita."
 AFG_alliance_with_turkik_peoples_tt: "Buka keputusan §Y[AFG_get_turkik_people_name_key]§! untuk menyebarkan sel resistensi di [SOU.GetAdjective] negara bagian Asia Tengah. Negara-negara yang kami ikut campur akan bergabung dengan kami ketika perang pecah dengan [SOU.GetNameDef]."
 AFG_red_threat: "Ancaman Merah"
 AFG_red_threat_desc: "Dengan sekutu rahasia kita di Asia Tengah, kita menghadapi peluang unik untuk melemahkan pengaruh [SOU.GetAdjective] dan memperluas pengaruh kita sendiri. Kami akan mengoordinasikan invasi kami dengan sel-sel perlawanan di seluruh wilayah, menggulingkan musuh bahkan sebelum mereka mengetahui apa yang sedang terjadi."
 AFG_fortify_pakistan: "Perkuat Perbatasan"
 AFG_fortify_pakistan_desc: "Sangat penting untuk mengamankan perbatasan kita yang baru diperluas. Membangun serangkaian benteng dan posisi pertahanan akan menjamin stabilitas dan keamanan wilayah kita. Selain itu, hal ini akan memberi kita posisi yang kuat untuk memproyeksikan kekuatan militer kita jika terjadi konflik di wilayah tersebut."
 AFG_fortify_pakistan_tt: "Negara bagian di sepanjang perbatasan dengan [RAJ.GetNameDef] yang kita peroleh pada fokus sebelumnya akan memperoleh §G2§! §YBenteng Tanah§!"
 AFG_into_the_plains_of_india: "Ke Dataran [RAJ.GetNameDef]"
 AFG_into_the_plains_of_india_desc: "Waktunya telah tiba bagi rakyat kita untuk menegaskan diri mereka sebagai penguasa anak benua India. Kami akan melakukan seperti yang pernah dilakukan nenek moyang kami dan turun gunung selagi mereka lemah, tapi kali ini kami akan tetap berada di sana."
 AFG_pashtun_empire: "Kekuasaan Pashtunistan"
 AFG_pashtun_empire_desc: "Hari ini akan menandai momen bersejarah dalam sejarah bangsa kita. Di bawah kepemimpinan [ROOT.GetLeader], kami dengan bangga akan mendeklarasikan berdirinya Kekuasaan Pashtun dan dimulainya era baru bagi masyarakat Pashtun. Melalui militer yang dimodernisasi, aliansi strategis, dan kebijakan ambisius, kita telah memperkuat posisi kita sebagai kekuatan regional yang dominan."
 AFG_work_with_gestapo: "Bekerja dengan [GER.GetAdjective] Intelijen"
 AFG_work_with_gestapo_desc: "Di wilayah yang baru kami peroleh, perbedaan pendapat dan kerusuhan terus menjadi tantangan besar bagi otoritas kami. Untuk mengatasi hal ini, kami telah menjalin kerjasama dengan badan intelijen [GER.GetAdjective]. Keahlian mereka dalam operasi pemberantasan pemberontakan dan intelijen akan sangat berharga dalam mengidentifikasi dan menetralisir faksi pemberontak."
 AFG_secure_baghdad: "Amankan Bagdad"
 AFG_secure_baghdad_desc: "Seiring dengan meluasnya pengaruh kami terhadap wilayah ini, semakin jelas bahwa [IRQ.GetNameDef] berpotensi melemahkan upaya kami. Oleh karena itu kita harus menuntut penyelarasan kebijakan luar negeri mereka, atau mereka akan menghadapi kemarahan angkatan bersenjata kita."
 AFG_agreement_with_germany: "Perjanjian dengan [GER.GetNameDef]"
 AFG_agreement_with_germany_desc: "Di masa yang penuh gejolak ini, kita harus mencari sekutu yang kuat dan dapat diandalkan untuk mengamankan posisi kita sebagai kekuatan dominan di dunia Islam. Oleh karena itu, kami akan menghubungi [GER.GetNameDef] untuk mengukur minat mereka terhadap pakta pertahanan bersama."
 AFG_agreement_with_germany_tt: "§Y[GER.GetNameDefCap] akan lebih cenderung menerima jika mereka memiliki pendapat lebih dari 50 tentang kita.§!"
 AFG_renounce_the_durand_line: "Tinggalkan Jalur Durand"
 AFG_renounce_the_durand_line_desc: "Garis Durand, yang dipaksakan kepada kami oleh penindas asing, telah terlalu lama memecah belah kerabat Pashtun kami. Melalui kelicikan para diplomat kita atau kekuatan angkatan bersenjata kita, kita akan mengakhiri ketidakadilan ini untuk selamanya."
 AFG_renounce_the_durand_line_tt: "§YPemilik negara bagian yang diklaim akan lebih mungkin menerima usulan kami jika negara tersebut sudah berperang atau dilemahkan oleh perang saudara yang sedang berlangsung.§!"
 AFG_topple_iran: "Gulingkan Iran"
 AFG_topple_iran_desc: "Di bawah kepemimpinan visioner [ROOT.GetLeader], kami siap untuk memberikan kebebasan dan keadilan kepada saudara-saudari [PER.GetAdjective] kami yang telah lama menderita di bawah pemerintahan lalim [PER.GetLeader]. Kami tidak hanya akan mengamankan perbatasan kami, namun juga memperluas pengaruh kami di seluruh kawasan."
 AFG_sov_attack_bonus: "Ancaman Merah"
 AFG_raj_attack_bonus: "Menyapu ke India"
 AFG_work_with_ger_intel_bonus: "Teknik Penindasan Partisan"
 AFG_rapprochement_with_non_pashtuns: "Pemulihan Hubungan dengan Non-Pashtun"
 AFG_rapprochement_with_non_pashtuns_desc: "Sudah terlalu lama orang-orang non-Pashtun di negara kita terpinggirkan dari dunia politik. Hal ini tidak hanya menimbulkan kebencian terhadap pemerintah pusat, namun juga berujung pada penggulingan pemerintah pusat pada tahun 1929. Oleh karena itu, kita harus memastikan bahwa di bawah sistem demokrasi yang baru, seluruh rakyat kita merasa terwakili dan didengar."
 AFG_khorasan_buffer_state: "Membangun Negara Penyangga Khorasan"
 AFG_khorasan_buffer_state_desc: "Dengan dihilangkannya ancaman [PER.GetNonIdeologyName] terhadap upaya perang kita saat ini, kita harus mulai melihat ke masa depan. Karena ketegangan bersejarah antara negara-negara kita dan keterlibatan kita dalam Operasi Countenance, kita harus mengambil tindakan untuk membangun penyangga antara kita dan pemerintahan [PER.GetAdjective] yang mungkin penuh dendam di masa depan."
 AFG_khorasan_buffer_state_tt: "§YKami akan membentuk pemerintahan boneka Khorasan di negara bagian berikut jika kami mengendalikannya:\n[1004.GetName]\n[416.GetName]\n[1003.GetName]§!"
 AFG_emerging_economy: "Perekonomian Berkembang"
 AFG_mountain_training_2: "Dominasi Pegunungan"
 AFG_mountain_training_2_desc: "Menyusul keberhasilan inisiatif pelatihan gunung kami, menjadi jelas bahwa kami harus terus membangun unit tempur spesialis untuk medan tersebut."
 AFG_expand_quami_template: "Reformasi Quami"
 AFG_expand_quami_template_desc: "Sistem Quami tentu saja telah membantu kami dengan baik selama bertahun-tahun, namun masih ada ruang untuk perbaikan. Dengan merestrukturisasi unit saat dinaikkan, mereka akan mampu mempertahankan [AFG.GetNonIdeologyName] dengan lebih baik."
 AFG_expand_quami_template_tt: "Tambahkan §Y3§! batalion laskar ke templat §YPashtun Levy§!."
 AFG_expand_quami_template_2_tt: "Jika kita telah meneliti §Y$tech_engineers$ , $tech_military_police$ atau $tech_field_hospital$§!, mereka akan ditambahkan ke template."
 AFG_request_soviet_support: "Minta Bantuan Soviet"
 AFG_request_soviet_support_desc: "Revolusi kita berada dalam bahaya kegagalan karena terbatasnya sumber daya ekonomi dan tenaga kerja yang dapat kita gunakan untuk menguasai pusat-pusat populasi utama di negara ini. Jika ingin berhasil, kami memerlukan bantuan dari [SOU.GetNameDef] secepatnya."
 AFG_international_brigades: "Brigade Internasional"
 AFG_international_brigades_desc: "Meskipun pasukan kita telah berkorban dengan berani, perang tampaknya tidak akan menguntungkan kita. Namun, kita mungkin bisa membalikkan keadaan dengan membuka perekrutan relawan internasional yang ingin melawan penindasan."
 AFG_defending_democracy: "Bela Negara"
 AFG_defending_democracy_desc: "Meskipun kita mungkin telah mengamankan pemerintah dari ancaman internal, akan selalu ada ancaman di luar wilayah kita. Kita harus melakukan semua yang kita bisa untuk memastikan bahwa perekonomian kita mampu mendukung angkatan bersenjata jika perang menimpa kita."
 AFG_islamic_republic_idea: "Demokrasi Islam"
 AFG_recruit_foreign_experts: "Rekrut Tenaga Ahli Asing"
 AFG_recruit_foreign_experts_desc: "Kita mungkin tidak memiliki keahlian di negara ini, jadi sebaiknya kita mencari orang di luar negeri untuk menemukan mereka yang dapat membantu kita saat ini, dan mengajari kita keterampilan tersebut untuk masa depan."
 AFG_seek_american_aid: "Carilah Bantuan Amerika"
 AFG_seek_american_aid_desc: "$PAR_accept_american_loans_desc$"
 AFG_bill_of_rights: "RUU Hak Asasi Manusia"
 AFG_bill_of_rights_desc: "Rakyat kita berhak mendapatkan dokumen terkodifikasi tentang hak-hak mereka berdasarkan hukum."
 AFG_follower_of_islam: "Penganut Islam"
 AFG_follower_of_islam_desc: "Islam telah menjadi inti keyakinan kita selama lebih dari satu milenium, dan kita harus memastikan bahwa pemimpin kita mematuhi prinsip-prinsip panduannya dan dengan demikian membawa bangsa kita menuju zaman keemasan baru."
 AFG_ministry_of_supply: "Kementerian Pasokan"
 AFG_ministry_of_supply_desc: "Jalur pasokan untuk militer hampir tidak ada. Untuk memperbaiki situasi, kami akan membentuk kementerian baru yang menangani semua pasokan untuk angkatan bersenjata dan infrastruktur penting."
 AFG_communist_propaganda: "Kementerian Propaganda"
 AFG_communist_propaganda_desc: "Segala sarana komunikasi massa harus ditempatkan di bawah kekuasaan negara dan dimanfaatkan untuk mengangkat rakyat menuju republik buruh kita yang mulia."
 AFG_hold_elections: "Adakan Pemilu"
 AFG_hold_elections_desc: "Dengan meredanya situasi di negara ini, kita sekarang memiliki kesempatan untuk menyelenggarakan pemilu bebas pertama di [AFG.GetNonIdeologyName]."
 AFG_hold_elections_tt: "§YAcara pemilu berikutnya akan memungkinkan kita memilih pemimpin negara baru.§!"
