 ### TOOLTIPS ###
 ################
 PER_clergy_upset_tt: "§RMengambil fokus ini akan membuat marah para Pendeta. Jika stabilitas turun terlalu jauh, maka Anda berisiko terjadinya perang saudara revolusioner!§!"
 PER_clergy_happy_tt: "§GMengambil fokus ini akan menenangkan Pendeta. Mereka tidak akan lagi melihat perlunya memberontak terhadap Anda.§!"
 PER_clergy_revolt_tt: "§RMengambil fokus ini akan menyebabkan revolusi yang tidak puas terhadap Anda, menjatuhkan Anda ke dalam perang saudara!§!"
 PER_profit_from_war_tt: "Membuka Keputusan: §Y$PER_profit_from_war_category$§! yang akan mengizinkan [PER.GetNonIdeologyName] memberikan hak sumber daya kepada negara lain sambil memperoleh pabrik lepas pantai."
 PER_add_panzer_leader_trait_tt: "§YDua§! pemimpin tentara yang dipilih secara acak akan mendapatkan sifat Pemimpin Panzer."
 PER_add_organizer_trait_tt: "§YDua§! pemimpin tentara yang dipilih secara acak akan mendapatkan sifat Penyelenggara."
 PER_expand_imperial_guard_tt: "Membuka templat divisi §YPengawal Kekaisaran Iran§! dan merekrut §Ydua§! unit di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_expand_immortal_legion_tt: "Merekrut §Ytiga§! unit §YLegiun Abadi§! di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_establish_immortal_legion_tt: "Membuka templat divisi §YImmortal Legion§! dan merekrut §Ytiga§! unit di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_naval_academy_random_admirals_tt: "Hingga §Ytiga§! pemimpin angkatan laut yang dipilih secara acak akan memperoleh §G+1§! keterampilan koordinasi"
 PER_acceptance_tt: "§Y[SOU.GetNameDefCap]§! kemungkinan besar akan menerima jika mereka memiliki §Gpendapat tinggi§! tentang kita!"
 PER_acceptance_ger_tt: "§Y[GER.GetNameDefCap]§! kemungkinan besar akan menerima jika mereka memiliki §Gpendapat tinggi§! tentang kita!"
 PER_foothold_in_indus_tt: "Akan membuka §Yrantai peristiwa§! di mana §Y[PER.GetNameDefCap]§! dan §Y[RAJ.GetNameDefCap]§! akan bernegosiasi untuk menguasai §YBaluchistan§!."
 PER_reintegrate_anatolia_tt: "Membuka keputusan §Ymengintegrasikan kembali Anatolia§! yang memungkinkan kita untuk mengintegrasikan wilayah yang ditaklukkan ke dalam negara kita."
 PER_absorb_byzantines_tt: "Membuka keputusan §YMenyerap Byzantium§! yang memungkinkan kita untuk mengintegrasikan wilayah yang ditaklukkan ke dalam negara kita."
 PER_memphis_initiative_tt: "Membuka keputusan §YInisiatif Memphis§! yang memungkinkan kita untuk mengintegrasikan wilayah yang ditaklukkan ke dalam negara kita."
 PER_new_shah_tt: "§Y$PER_mohammed_reza_pahlavi$§! menjadi pemimpin §Y$PER_neutrality_party$§!"
 PER_civil_unrest_tt: "§RMengambil fokus ini akan memulai misi berjangka waktu $PER_civil_unrest_category$§!"
 PER_legacy_of_greatness_tt: "Ubah §Y$PER_legacy_of_greatness_modifier$§! dengan:"
 PER_shahbanu_tt: "Mendapat acara: §YMemilih Shahbanu§! yang memungkinkan Anda memilih ratu yang akan tersedia sebagai §YPenasihat Politik§!."
 PER_imperial_excellency_tt: "Setelah fokus nasional: §YPerluasan Pengawal Istana§! selesai, §Ydua§! unit §YPengawal Istana Iran§! direkrut di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_half_stability_tt: "§RStabilitas kami turun dari 50%! Jika turun di bawah 20% maka kita berisiko mengalami revolusi!§!"
 PER_address_the_issue_tt: "Membuka §YKeputusan Revolusi Islam§! yang akan memberi kita waktu §R90 hari§! untuk mengekang kaum revolusioner."
 PER_rapid_appeasement_tt: "Dengan mengorbankan sumber daya yang kita miliki, kita telah berhasil menghentikan revolusi untuk saat ini."
 PER_islamic_revolution_tt: "Memulai §RPerang Saudara§! antara [PER.GetNameDef] dan Revolusioner Islam!"
 PER_trial_fifty_three_tt: "Mengambil fokus ini akan menyebabkan penasihat §YKomunis§! dilarang masuk ke dalam pemerintahan."
 PER_stand_with_giants_tt: "Ubah §Y$PER_stand_with_giants_modifier$§! dengan:"
 PER_negotiate_tt: "Akan mencoba menjadi perantara §Yperdamaian§! dengan musuh kita, yang mengakibatkan kemungkinan menjadi §Rboneka§! dari [ENG.GetFlag]§Y[ENG.GetNameDef]§! dan kehilangan wilayah ke [SOU.GetFlag]§Y[SOU.GetNameDef]§!!"
 PER_treaty_of_tehran_tt: "Akan mengirimkan acara ke [ENG.GetFlag]§Y[ENG.GetNameDef]§! dan [SOV.GetFlag]§Y[SOV.GetNameDef]§! meminta mereka menarik pasukannya dan mengakhiri perang."
 PER_strike_first_tt: "Melanjutkan ke bawah cabang ini akan §Rmencegah Anda§! mengambil fokus §YPakta Sa'dabad§! lagi!"
 PER_buffer_state_tt: "Jika §Yperdamaian§! diterima, maka [AZR.GetFlag]§Y[AZR.GetNameDef]§!, [GEO.GetFlag]§Y[GEO.GetNameDef]§!, [ARM.GetFlag]§Y[ARM.GetNameDef]§! dan [TMS.GetFlag]§Y[TMS.GetNameDef]§! akan dilepas sebagai boneka [PER.GetFlag]§Y[PER.GetNameDef]§!"
 PER_resistance_decisions_tt: "Membuka keputusan §YKetahanan Tanaman§! yang memungkinkan kita menyebabkan ketidakstabilan di negara-negara tetangga dalam persiapan untuk invasi."
 PER_recruit_rebels_tt: "Membuka templat divisi §YBakhtiari Rebels§! dan §YQashqai Rebels§! dan merekrut §Ytwo§! unit masing-masing di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
 PER_white_peace_tt: "Akan mengirimkan §Yevent§! kepada musuh kita yang menuntut §Yperdamaian putih§!, memungkinkan kita untuk §Ymempertahankan wilayah yang kita miliki sebelumnya§!."
 PER_reparations_tt: "Akan mengirimkan §Yevent§! kepada musuh kita yang menuntut §Yperdamaian§! dan §Yreparasi perang§! dalam bentuk §Ypabrik§! dan §Ydebuff§! kepada penyerang. Jika negara musuh adalah §Ytetangga langsung§! maka mereka akan menyerahkan wilayah perbatasan kepada §Yus§!."
 PER_swear_fealty_tt: "Akan mengirimkan §Yevent§! kepada musuh kita yang meminta kita menyerah dan bergabung dengan mereka sebagai §Yboneka§!. Ini akan membuka §Ycabang boneka§! yang memungkinkan kita memutuskan bagaimana kita ingin melanjutkan."
 PER_push_negotiations_tt: "Akan mengirimkan §Yevent§! kepada musuh kita yang menawarkan §Yhak sumber daya§! kepada penghasut konflik awal dengan imbalan §Yperdamaian putih§!. Jika mereka menolak kami, kami akan tetap berperang."
 PER_preemptive_invasion_of_iran_tt: "Setelah [PER.GetNameDef] menyerah, kita akan menjadi boneka bagi negara ini, dengan mengintegrasikan beberapa negara bagian di perbatasan kita dan mendapatkan hak atas sumber daya di negara-negara [PER.GetAdjective] yang kaya akan minyak. Kami akan dapat meminta intervensi [SOU.GetAdjective] untuk melakukan operasi gabungan."
 PER_territory_demands_tt: "Hal ini akan mengirimkan tuntutan ke negara yang bersangkutan, meminta mereka §Ymenyerahkan§! wilayah perbatasan mereka kepada kami. Mereka lebih mungkin melakukan hal yang sama jika militer kita lebih §Ykuat§!"
 PER_reinstate_qajars_tt: "Akan mengaktifkan rantai §Yevent§! yang memungkinkan kita mengembalikan dinasti Qajar ke takhta [PER.GetNameDef]."
 PER_republic_of_mahabad_tt: "Akan merilis [KUR.GetNameDef] sebagai §YRepublik Mahabad§!"
 ######################
 ##### INDUSTRIAL #####
 ######################
 PER_democratic_shortcut: "Politik:\nFront Nasional"
 PER_neutral_shortcut: "Politik:\nDinasti Pahlavi"
 PER_industry_shortcut: "Ekonomi"
 PER_army_shortcut: "Tentara"
 PER_air_shortcut: "Angkatan Udara"
 PER_navy_shortcut: "Angkatan Laut"
 PER_fight_for_iran_shortcut: "Perjuangan Untuk Iran"
 PER_modernizing_iran: "Modernisasi [ROOT.GetNonIdeologyName]"
 PER_modernizing_iran_desc: "Sudah terlalu lama [ROOT.GetNonIdeologyName] terhambat oleh disorganisasi dan pertengkaran kecil. Kita harus belajar berjuang sendiri jika kita ingin membentuk sebuah bangsa yang mampu bertahan dalam ujian waktu. Mari kita membangun masa depan berdasarkan persatuan dan menyambut era modern."
 PER_adult_literacy: "Kampanye Literasi Orang Dewasa"
 PER_adult_literacy_desc: "Buta huruf adalah masalah besar yang mengganggu penduduk kita. Kemampuan menulis dan membaca dalam bahasa mereka sendiri akan membantu memberdayakan dan membebaskan masyarakat kami. Dewan Menteri dan Kementerian Pendidikan telah bersama-sama menerbitkan buku pedoman pendidikan, serta berjanji untuk mendirikan sekolah yang akan mendidik populasi orang dewasa."
 PER_national_museum: "Buka Museum Nasional"
 PER_national_museum_desc: "Mendokumentasikan sejarah kita sangatlah penting, terutama mengingat kekayaan permadani yang telah ditenun [ROOT.GetNonIdeologyName] selama berabad-abad. Ada rencana untuk membuka museum di Teheran selama bertahun-tahun - Sekarang saatnya untuk melaksanakannya."
 PER_foreign_schools: "Kendalikan Sekolah Asing"
 PER_foreign_schools_desc: "Ada banyak sekali sekolah milik asing yang tersebar di wilayah [PER.GetAdjective]. Lembaga-lembaga ini dapat dianggap sebagai contoh kepemimpinan kita yang menyerahkan kedaulatannya kepada kekuatan asing. Kita harus menangkap dan menasionalisasi mereka demi pembangunan negara kita."
 PER_foreign_schools_bonus: "Sekolah Asing yang Nasionalisasi"
 PER_university_of_isfahan: "Mendanai Universitas Isfahan"
 PER_university_of_isfahan_desc: "Kita sangat membutuhkan institusi pendidikan baru yang akan fokus pada pengajaran generasi baru profesional medis. Universitas Isfahan siap menjadi sekolah kedokteran paling maju di seluruh [ROOT.GetNonIdeologyName]!"
 PER_university_of_isfahan_bonus: "Mendanai Universitas Isfahan"
 PER_shiraz_university: "Dana Universitas Shiraz"
 PER_shiraz_university_desc: "Dalam hal pendanaan universitas-universitas baru, fokus kita haruslah pada pendirian sekolah-sekolah teknik dengan harapan lulusannya akan meletakkan dasar bagi [ROOT.GetNonIdeologyName] yang modern!"
 PER_shiraz_university_bonus: "Universitas Shiraz yang didanai"
 PER_educational_reforms: "Reformasi Pendidikan"
 PER_educational_reforms_desc: "Kami telah meluncurkan kampanye literasi baru. Kami telah membangun universitas baru. Akhirnya tiba saatnya bagi kita untuk menerapkan reformasi pendidikan baru yang akan berkontribusi pada kemajuan sosial dan perkembangan warga negara kita dan mengatasi masalah-masalah yang sebelumnya tidak setara dalam kesempatan pendidikan."
 PER_trans_iranian_railway: "Kereta Api Trans-Iran"
 PER_trans_iranian_railway_desc: "Pada tahun 1927, kami mulai mengerjakan jalur kereta api nasional yang dikenal sebagai Kereta Api Trans-Iran. Sekarang kita sedang mempercepat modernisasi [ROOT.GetNonIdeologyName], sangat penting bagi kita untuk menyalurkan uang untuk menyelesaikan proyek monumental ini."
 PER_expand_tabriz_masshad: "Tautan Tabriz-Mashhad"
 PER_expand_tabriz_masshad_desc: "Kita harus terus memperluas Jalur Kereta Trans-Iran. Mari kita fokus pada perluasan jaringan kereta api antara kota Tabriz dan Masyhad."
 PER_expand_tehran_emam: "Tautan Teheran-Bandar Shahpur"
 PER_expand_tehran_emam_desc: "Kita harus terus memperluas Jalur Kereta Trans-Iran. Mari kita fokus pada perluasan jalur kereta api antara kota Teheran dan Bandar Shahpur."
 PER_expand_tehran_abbas: "Tautan Teheran-Bandar Abbas"
 PER_expand_tehran_abbas_desc: "Kita harus terus memperluas Jalur Kereta Trans-Iran. Mari kita fokus pada perluasan jaringan kereta api antara kota Teheran dan Bandar Abbas."
 PER_trains_from_germany: "Minta Kereta dari [GER.GetNonIdeologyName]"
 PER_trains_from_germany_desc: "Saat kami akan membuka Jalur Kereta Trans-Iran, kami perlu memiliki kereta api agar proyek dapat berjalan secepat mungkin. Kita punya teman-teman di [GER.GetNonIdeologyName], pasti kalau kita minta maka mereka akan dengan senang hati memberikan kelebihan lokomotif uap untuk grand opening kita."
 PER_trains_from_britain: "Minta Kereta dari [ENG.GetNonIdeologyName]"
 PER_trains_from_britain_desc: "Saat kami akan membuka Jalur Kereta Trans-Iran, kami perlu memiliki kereta api agar proyek dapat berjalan secepat mungkin. Karena [ENG.GetAdjective] mempunyai kepemilikan dan stok sumber daya mentah kita, akan bermanfaat bagi kedua negara jika mereka menawarkan mesin uap untuk membuka jalur kereta api baru kita."
 PER_feat_of_engineering: "Suatu Prestasi Teknik"
 PER_feat_of_engineering_desc: "Kami telah mencapai sesuatu yang istimewa dalam menyelesaikan Kereta Api Trans-Iran. Bukan hanya karena skalanya yang luar biasa, namun karena keajaiban teknik yang diperlukan untuk mengatasi rute terjal dan medan pegunungan [ROOT.GetNonIdeologyName]. Kita patut bangga dengan prestasi teknik yang dilakukan oleh pemerintah dan para insinyur yang dikontrak."
 PER_feat_of_engineering_bonus: "Menyelesaikan Kereta Api Trans-Iran"
 PER_white_revolution: "Memulai Revolusi Putih"
 PER_white_revolution_desc: "Modernisasi [ROOT.GetNonIdeologyName] bukanlah tugas yang mudah. Sebaliknya, diperlukan sejumlah besar reformasi agresif untuk mewujudkan tujuan besar ini. Kita akan menyebutnya Revolusi Putih, atau Revolusi Shah dan Rakyat, dan hal ini akan membawa [PER.GetNameDef] sejajar dengan negara-negara besar di barat."
 PER_national_bank: "Memperkuat Bank Nasional [ROOT.GetNonIdeologyName]"
 PER_national_bank_desc: "Secara ekonomi, kami tidak menonjol jika dibandingkan dengan negara-negara barat. Kasus ini memang disayangkan, tapi kita bisa mengubahnya. Pertama, kita harus memperkuat Bank Nasional [ROOT.GetNonIdeologyName] dan membuatnya lebih mudah diakses oleh penduduk pedesaan pada khususnya."
 PER_price_stabilization: "Stabilisasi Harga"
 PER_price_stabilization_desc: "Dengan menguatnya perbankan, kita sekarang harus memulai kampanye untuk menentang pengambilan keuntungan yang tidak masuk akal. Kami dapat mendenda mereka yang memiliki pabrik dan bisnis rantai besar yang tidak mematuhinya, dan menetapkan harga barang di seluruh [ROOT.GetNonIdeologyName]."
 PER_abolish_feudalism: "Hapuskan Feodalisme"
 PER_abolish_feudalism_desc: "Selama bertahun-tahun, [ROOT.GetNonIdeologyName] telah beroperasi di bawah sistem feodal, dengan tuan tanah memiliki properti yang banyak digunakan oleh petani di daerah pedesaan. Ini adalah sistem yang sudah ketinggalan zaman, dan sudah menjadi tugas kita sebagai pemerintah untuk membeli tanah ini dari pemiliknya dan menjualnya kembali kepada para petani dengan harga yang jauh lebih murah. Hal ini secara efektif akan memberikan kebebasan kepada sebagian besar penduduk kita."
 PER_women_vote: "Perluas Suara untuk Perempuan"
 PER_women_vote_desc: "Saat ini, hanya laki-laki yang dapat memilih dalam urusan pemerintahan kita. Karena jumlah mereka adalah setengah dari populasi kita, kita harus memastikan bahwa suara perempuan di negara kita dapat didengar. Namun kita harus berhati-hati, karena hal ini dapat menyebabkan para pendeta percaya bahwa kita meninggalkan tradisi."
 PER_food_for_all: "Makanan untuk Setiap [PER.GetAdjective]"
 PER_food_for_all_desc: "Tragisnya, kita tidak asing dengan kelaparan. Dengan upaya yang telah kami lakukan untuk memperbaiki perekonomian melalui upaya modernisasi, kami memiliki peluang untuk meningkatkan distribusi pangan dan memastikan bahwa setiap [PER.GetAdjective] akan memiliki akses terhadap salah satu kebutuhan dasar manusia."
 PER_rapid_industrialization: "Industrialisasi yang Pesat"
 PER_rapid_industrialization_desc: "Modernisasi sama dengan Industrialisasi. Tidak ada jalan keluar dari kenyataan bahwa kita harus dengan cepat memperluas produksi pabrik kita jika kita ingin mencapai kualitas yang sama dengan negara-negara besar lainnya di dunia ini."
 PER_tehran_power_plant: "Buka Pembangkit Listrik di Teheran"
 PER_tehran_power_plant_desc: "Seiring dengan pertumbuhan kota-kota di seluruh negeri, kita harus memastikan bahwa kota-kota tersebut mendapatkan pasokan listrik yang cukup. Mari kita buka pembangkit listrik baru di ibu kota Teheran dan memperkuatnya sebagai langkah signifikan berikutnya dalam perluasan kota terpenting kita."
 PER_tehran_power_grid_bonus: "Jaringan Listrik Teheran Diperluas"
 PER_develop_cities: "Kembangkan Permukiman Besar"
 PER_develop_cities_desc: "Saat ini, ibu kota Teheran adalah kota paling berkembang di [ROOT.GetNonIdeologyName]. Jika kita ingin benar-benar merangkul modernisasi di negara kita, maka kita harus memfokuskan upaya kita pada perluasan infrastruktur di kota-kota besar."
 PER_metropolitan_iran: "Metropolitan [ROOT.GetNonIdeologyName]"
 PER_metropolitan_iran_desc: "Akhirnya, setelah upaya pembangunan massal, kita telah mencapai titik di mana [ROOT.GetNonIdeologyName] dapat dianggap sebagai negara metropolitan. Kota-kota kita dipenuhi dengan industri dan kehidupan, mempersiapkan kita untuk sukses di masa depan."
 PER_develop_oil_fields: "Mengembangkan Ladang Minyak"
 PER_develop_oil_fields_desc: "Untuk menambah kompleks ekstraksi minyak kami yang sudah luas, kami baru-baru ini menemukan sumber baru emas hitam yang siap untuk digali. Para menteri perindustrian kita percaya bahwa pembangunan anjungan minyak baru dapat menimbulkan potensi monopoli atas sumber daya yang paling berharga ini."
 PER_form_oil_company: "Bentuk Perusahaan Minyak kita sendiri"
 PER_form_oil_company_desc: "Sudah terlalu lama ladang minyak kita ditambang dan dikuasai oleh kekuatan kolonial dari luar. Dengan diperolehnya persediaan baru dan masa depan yang bebas dari pengaruh asing, sudah saatnya kita mendirikan Perusahaan Minyak Nasional [PER.GetAdjective]."
 PER_establish_opec: "Mendirikan OPEC"
 PER_establish_opec_desc: "Dengan sepenuhnya mapannya industri minyak kita, sekarang saatnya kita melihat ke luar ke negara-negara kaya minyak lainnya untuk melihat apakah kita dapat bersatu di bawah satu bendera untuk memonopoli sumber daya strategis ini. Setelah mencapai [IRQ.GetNameDef], [SAU.GetNameDef] dan [VEN.GetNameDef], dengan suara bulat diputuskan bahwa kita akan membentuk Organisasi Negara-negara Pengekspor Minyak."
 PER_opec: "OPEC"
 PER_oil_baron: "Nyatakan Diri Anda sebagai Baron Minyak"
 PER_oil_baron_desc: "Daripada menggunakan minyak kita untuk mendanai perang yang dilakukan negara-negara lain di seluruh dunia, lebih baik kita menyimpannya untuk kepentingan kita sendiri. Jika kita menimbun minyak di [ROOT.GetNonIdeologyName], maka kita dapat yakin bahwa kita dapat menjualnya kepada mereka yang membutuhkan dengan harga yang melambung."
 PER_profit_from_war: "Untung dari Perang"
 PER_profit_from_war_desc: "Perang berarti uang, dan ada banyak hal yang bisa dihasilkan dari konflik yang sedang berkecamuk di seluruh dunia saat ini. Seiring kemajuan teknologi, lebih banyak minyak dibutuhkan oleh negara-negara yang berperang untuk memberi makan mesin perang mereka. Ini adalah kesempatan besar bagi kita, dan kita bodoh jika tidak memanfaatkannya."
 PER_invite_oil_nations: "Undang Negara Penghasil Minyak"
 PER_invite_oil_nations_desc: "OPEC sejauh ini telah berhasil menciptakan keuntungan bagi pasar minyak global, namun organisasi kami mempunyai sarana untuk tumbuh lebih besar. Mari kita menjangkau negara-negara penghasil minyak lainnya di seluruh dunia dan meminta mereka untuk bergandengan tangan dengan kita di OPEC."
 PER_deal_with_eitc: "Buat Kesepakatan dengan EITC"
 PER_deal_with_eitc_desc: "Tampaknya tetangga kita di sebelah timur sedang sibuk. [RAJ.GetNonIdeologyName] telah mendirikan kembali Perusahaan Perdagangan India Timur, dan telah menjadi perusahaan besar berskala nasional. Adalah bijaksana untuk membuat mereka berpihak pada monopoli minyak kita, dan membuat kesepakatan dengan mereka dan anggota OPEC lainnya."
 PER_a_modern_iran: "Iran Modern"
 PER_a_modern_iran_desc: "Setelah semua upaya modernisasi ini, kita akhirnya bisa dikatakan bangga dan kuat di antara bangsa-bangsa lain."
 ################
 ##### ARMY #####
 ################
 PER_restructure_army: "Restrukturisasi Angkatan Darat"
 PER_restructure_army_desc: "Tentara kita telah melemah akibat perang bertahun-tahun yang tak ada habisnya dengan Rusia di bawah komando dinasti Qajar. Dengan keadaan dunia saat ini, adalah bijaksana bagi kita untuk mengembalikan kekuatan militer kita ke kejayaannya."
 PER_expand_imperial_guard: "Perluas Pengawal Istana"
 PER_expand_imperial_guard_desc: "Sebagai keluarga besar terbaru yang memerintah [PER.GetNameDef], keluarga Syah hanya membutuhkan pengawal kerajaan terbaik. Jika diperlengkapi dan dilatih dengan baik, mereka mungkin bisa bergabung di garis depan kita juga."
 PER_expand_military_facilities: "Perluas Fasilitas Militer"
 PER_expand_military_facilities_desc: "Saat ini, kemampuan kita untuk memproduksi senjata sangat kurang. Kita harus berusaha untuk memperluas fasilitas militer kita sesegera mungkin, untuk memastikan bahwa pasukan kita yang baru direstrukturisasi diperlengkapi dan siap untuk berperang."
 PER_czech_tanks: "Beli Lisensi Tank Ceko"
 PER_czech_tanks_desc: "Sebelum kita berpikir untuk merancang dan memproduksi pasukan mekanis kita sendiri, kita harus melihat ke negara-negara yang terkenal dengan produksi tanknya. Dengan menghubungi [CZE.GetNameDef], kami bisa mendapatkan lisensi untuk memproduksi tank dari Skoda Works mereka yang terkenal."
 PER_german_tanks: "Beli Lisensi Tank Jerman"
 PER_german_tanks_desc: "Sebelum kita berpikir untuk merancang dan memproduksi pasukan mekanis kita sendiri, kita harus melihat ke negara-negara yang terkenal dengan produksi tanknya. Dengan menjangkau [GER.GetNameDef], kita dapat menghasilkan tank kuat yang akan menembus garis musuh seperti pisau panas menembus mentega."
 PER_reverse_engineer_tanks: "Tank Asing yang Direkayasa Balik"
 PER_reverse_engineer_tanks_desc: "Dengan melihat lebih dekat tank-tank yang kami produksi yang berasal dari negara asing, kami dapat mempelajari cara kerjanya dan bagaimana kami dapat memproduksi desain kami sendiri untuk digunakan di masa depan. Ini adalah langkah pertama menuju [PER.GetNonIdeologyName] mengembangkan desain tangkinya sendiri."
 PER_establish_tehran_armor: "Membangun Armor Teheran"
 PER_establish_tehran_armor_desc: "Waktunya telah tiba bagi kami untuk mendirikan perusahaan pembuat tangki kami sendiri. Setelah memutuskan nama Tehran Armor, diumumkan bahwa perusahaan tersebut akan disubsidi oleh pemerintah untuk membantu pendiriannya."
 PER_expand_tehran_armor: "Perluas Fasilitas Armor Teheran"
 PER_expand_tehran_armor_desc: "Dengan Teheran Armor yang berupaya memproduksi desain tank baru untuk upaya perang kita, akan menjadi keputusan bijak untuk mempercepat proses ini dengan memperluas fasilitas produksi mereka secara cepat. Dengan lebih banyak lantai pabrik yang didedikasikan untuk konstruksi peralatan lapis baja kami, semakin cepat kami dapat meluncurkan tank ke lapangan."
 PER_future_of_war: "Masa Depan Perang"
 PER_future_of_war_desc: "Hanya beberapa dekade yang lalu, perang masih terjadi dengan menggunakan manusia dan kuda, sedikit artileri, dan taktik kuno. Di zaman modern ini, era tank sudah tiba. Kita harus terus mengikuti kemajuan teknologi militer jika ingin melawan kekuatan yang mengancam kita."
 PER_train_tank_commanders: "Latih Komandan Tank"
 PER_train_tank_commanders_desc: "Untuk memanfaatkan divisi tank kita secara maksimal, mereka harus dipimpin oleh komandan yang kompeten. Untuk melakukan hal ini, kita harus bersiap mengirim para pemimpin militer kita kembali ke pelatihan untuk mempelajari cara menggabungkan peperangan tank ke dalam beragam taktik mereka secara efektif."
 PER_military_excellency: "[PER.GetAdjective] Yang Mulia Militer"
 PER_military_excellency_desc: "Ketika berbicara tentang pasukan yang menang, kekuatan yang paling terlatih pasti akan menjadi yang teratas. Dengan pendidikan yang ketat dan kaku, peralatan yang sangat baik dan taktik yang tak terhentikan, mari kita buktikan kepada dunia bahwa tentara [PER.GetAdjective] adalah kekuatan yang patut diperhitungkan."
 PER_foreign_retraining: "Inisiatif Pelatihan Ulang Asing"
 PER_foreign_retraining_desc: "Tentara kita saat ini kurang terlatih dan tidak terorganisir. Untuk meningkatkan kualitas pasukan kita, akan lebih bijaksana jika kita berinvestasi dengan mendatangkan orang asing ke [PER.GetNonIdeologyName] untuk melatih pasukan kita. Ini akan membuat mereka dalam kondisi yang baik untuk bertempur dalam waktu singkat."
 PER_bolster_infantry: "Perkuat Infanteri"
 PER_bolster_infantry_desc: "Prajurit biasa telah dianggap sebagai kebutuhan pokok angkatan bersenjata selama beberapa generasi, dan ini bukanlah posisi dalam angkatan bersenjata yang harus kita abaikan. Mari kita perkuat infanteri kita dan pastikan pasukan kita bergerak dengan baik dan bangga."
 PER_swedish_artillery: "Artileri Lisensi dari [SWE.GetNameDef]"
 PER_swedish_artillery_desc: "[SWE.GetAdjective] telah mengembangkan artileri kuat yang dapat kita manfaatkan jika kita miliki di pasukan kita. Kita harus menjangkau negara Nordik ini dan berupaya menegosiasikan perjanjian lisensi sehingga kita dapat mulai memproduksinya sendiri."
 PER_establish_motor_arms: "Mendirikan Industri Senjata Motor"
 PER_establish_motor_arms_desc: "Untuk mendukung infanteri kita, kita harus mempertimbangkan untuk memproduksi sejumlah kendaraan yang berbeda untuk memastikan bahwa kemampuan mereka melintasi medan pertempuran selalu mutakhir dan semulus mungkin. Dengan membangun industri peralatan semacam ini, kami mempersiapkan modernisasi angkatan bersenjata kami di masa depan."
 PER_motorize_infantry: "Menggerakkan Infanteri"
 PER_motorize_infantry_desc: "Kita harus menjadi yang terdepan, dan untuk melakukan hal tersebut, sangatlah penting bagi kita untuk melakukan mekanisasi pada pasukan reguler kita sehingga mereka dapat menyerang di medan perang bersama tank kita, terlindungi dan siap untuk menimbulkan kekacauan."
 PER_increase_heavy_arms: "Tingkatkan Fasilitas Senjata Berat"
 PER_increase_heavy_arms_desc: "Ketika angkatan bersenjata kita bertambah besar, kebutuhan kita akan fasilitas yang lebih besar juga meningkat untuk memproduksi beberapa alat berat kita. Hal ini juga akan membuka pintu bagi kita untuk menciptakan desain artileri kita sendiri, yang berarti bahwa kita tidak lagi harus bergantung pada kekuatan asing untuk mendukung pasukan kita. Hal ini juga akan memungkinkan kita untuk menyesuaikan rencana tempur kita dengan memperhitungkan front yang berfokus pada artileri."
 PER_our_own_artillery: "Bangun Artileri kita sendiri"
 PER_our_own_artillery_desc: "Kami sekarang memiliki fasilitas yang diperlukan untuk merancang dan membangun jenis artileri pendukung kami sendiri secara efektif. Kini kita tidak lagi harus bergantung pada perdagangan untuk memperkuat kekuatan kita. Meriam baru kami akan menghujani musuh-musuh kami dan memastikan kami dapat bertahan dalam konflik apa pun."
 PER_develop_qorkhaneh: "Mengembangkan Qorkhaneh"
 PER_develop_qorkhaneh_desc: "Qorkhaneh telah menjadi sumber utama produksi senjata dan amunisi kami di Teheran. Investasi sumber daya dalam pengembangan gudang senjata Qorkhaneh akan bermanfaat untuk memastikan bahwa produksi peralatan kita tetap dalam kondisi prima untuk menghadapi potensi konflik."
 PER_desert_training: "Pelatihan Gurun Khusus"
 PER_desert_training_desc: "Negara kita yang indah, [PER.GetNonIdeologyName], memiliki ekosistem yang bervariasi dan beragam, namun sebagian besar wilayah kita terdiri dari dataran gurun. Dengan medan yang sulit seperti ini, kita harus mempertimbangkan bagaimana militer kita beroperasi, dan oleh karena itu, kita harus berupaya untuk mengkhususkan pelatihan kita pada cara bertahan hidup dan melintasi lanskap gurun."
 PER_every_man_serves: "Setiap Orang Yang Dapat Melayani"
 PER_every_man_serves_desc: "Kuantitas dibandingkan kualitas akan menjadi masa depan militer kita. Kita mempunyai populasi yang sangat besar, dan di saat seperti ini, siapa pun yang mempunyai senjata harus menjalankan kewajiban sipilnya untuk membela [PER.GetNameDef] dari penjajah asing. Kami akan kehilangan pelatihan khusus, tapi mudah-mudahan jumlah kami bisa mengalahkan musuh."
 PER_special_units: "Operasi Khusus Iran"
 PER_special_units_desc: "Seiring dengan berkembangnya kemampuan militer kita, penting bagi kita untuk mempertimbangkan divisi khusus kita selain pasukan reguler kita. Dengan ini, banyak peluang baru akan muncul, termasuk operasi intelijen, pasukan khusus, dan bahkan senjata eksperimental."
 PER_form_savak: "Bentuk SAVAK"
 PER_form_savak_desc: "Spionase terbukti menjadi elemen penting dalam upaya perang. Untuk mengimbangi upaya intelijen musuh kita, kita harus membentuk organisasi kita sendiri untuk menangani semua operasi mata-mata dan spionase kita. Bahkan secara internal, hal ini akan membantu memperkuat pemerintahan kita dan mengawasi pihak-pihak yang ingin menggulingkannya."
 PER_transfer_officers_to_intelligence: "Pindahkan Petugas Ke Intelijen"
 PER_transfer_officers_to_intelligence_desc: "Untuk mendukung operasi badan intelijen kita, kita harus memindahkan beberapa perwira militer kita yang lebih intelektual ke dalam divisi intelijen."
 PER_fund_state_intelligence: "Dana Intelijen Negara"
 PER_fund_state_intelligence_desc: "Dengan menyalurkan lebih banyak dana ke dalam program intelijen negara, kita seharusnya bisa mengawasi lebih dekat potensi pemberontakan dan pemberontakan di negara kita. Dengan menghentikan hal ini sejak awal, kita terus menjamin keselamatan dan keamanan negara kita."
 PER_special_forces_program: "Program Pasukan Khusus"
 PER_special_forces_program_desc: "Ada beberapa tempat yang tidak dapat dikunjungi oleh pasukan garis depan reguler kita, dan untuk mengatasinya, pembentukan program pasukan khusus sangatlah penting. Kita akan segera memiliki pasukan khusus yang mampu menangani tugas sulit apa pun yang kita berikan kepada mereka."
 PER_recruit_bakhtiari: "Rekrut Spesialis Gunung Bakhtiari"
 PER_recruit_bakhtiari_desc: "Bakhtiari adalah suku Lur dari [PER.GetNonIdeologyName] bagian timur. Meskipun banyak orang di wilayah barat negara ini mengkhawatirkan pengaruh mereka, gaya hidup nomaden mereka ada gunanya dalam pasukan militer kita. Dengan merekrut anggota suku mereka, kita dapat memberikan keuntungan yang signifikan bagi pasukan pendaki gunung kita atas musuh-musuh kita."
 PER_expand_unique_unit: "Perluas Legiun Abadi"
 PER_expand_unique_unit_desc: "Setelah mendirikan Legiun Abadi sebagai bagian dari warisan kekaisaran kami, kami sekarang dapat menyalurkan sumber daya untuk memperluas legiun bergengsi ini dan memungkinkan lebih banyak orang untuk berdiri bahu-membahu memikul beban Kekaisaran [PER.GetAdjective]!"
 PER_import_rocketry: "Impor Desain Roket"
 PER_import_rocketry_desc: "Peperangan berkembang dengan kecepatan yang luar biasa cepat. Ketika negara-negara lain mulai mengembangkan teknologi roket untuk digunakan di medan perang, kita harus berusaha untuk mengikuti perkembangan ini dengan mengimpor desain yang diperlukan untuk memproduksi senjata ajaib kita sendiri."
 PER_cyrus_initiative: "Inisiatif Cyrus"
 PER_cyrus_initiative_desc: "Inisiatif Cyrus adalah proyek rahasia terbaru kami untuk mengembangkan senjata destruktif yang mengesankan yang dapat kami gunakan di medan perang untuk sepenuhnya melenyapkan musuh kami. Para ilmuwan kita telah menyusun beberapa rancangan menarik yang tampaknya tidak terpikirkan oleh negara lain, yang berarti kita berada dalam posisi yang baik untuk memberikan kejutan kepada lawan kita selama masa perang."
 PER_modern_cataphract: "Katafrak Modern"
 PER_modern_cataphract_desc: "Cataphract adalah salah satu bentuk kavaleri berat lapis baja yang berasal dari tanah kami pada zaman kuno. Baik kerajaan Achaemenid dan Sassanid memanfaatkan kuda-kuda kuat ini di medan perang. Dengan menggunakan mereka sebagai inspirasi, kita harus mampu menciptakan raksasa bermotor yang akan menghormati sejarah peperangan kavaleri kita."
 PER_war_elephant: "Gajah Perang"
 PER_war_elephant_desc: "Meskipun tidak banyak digunakan di Kekaisaran Persia zaman dulu, kami terkenal karena menerjunkan sekelompok kecil gajah perang dalam penaklukan kuno kami. Ilmuwan kita telah mendapatkan ide untuk membuat tank yang sangat berat yang terinspirasi dari bentuk Gajah India, dan pastinya akan menimbulkan ketakutan pada musuh kita seperti yang mereka lakukan ribuan tahun yang lalu."
 PER_negotiate_with_america: "Bernegosiasi dengan Amerika"
 PER_negotiate_with_america_desc: "[USA.GetNameDefCap] telah menunjukkan dirinya sebagai pemimpin dunia dalam hal pengembangan teknologi atom; inovasi yang terbukti penting untuk tetap menjadi yang terdepan dalam perjuangan kita untuk tetap relevan di panggung dunia. Kita harus mengirimkan utusan diplomatik untuk meminta bantuan mereka dalam mengembangkan program nuklir kita sendiri."
 PER_establish_nuclear_program: "Menetapkan Program Nuklir [PER.GetAdjective]"
 PER_establish_nuclear_program_desc: "Rahasia atom telah dibongkar dan ditusuk oleh [GER.GetNameDef] dan [USA.GetNameDef] selama beberapa waktu. Setelah menerima catatan dan dokumen penelitian dari teman-teman [USA.GetAdjective] kami, mereka secara resmi membantu kami dalam menyiapkan program nuklir kami sendiri."
 ####################
 ##### AIRFORCE #####
 ####################
 PER_establish_airforce: "Membentuk Angkatan Udara"
 PER_establish_airforce_desc: "Angkatan Udara Kekaisaran [PER.Adjective] secara resmi didirikan pada tahun 1920 oleh Reza Shah Pahlavi. Namun, kini ketika ancaman perang membayangi dunia, kita harus memperkuat kemampuan negara kita untuk ikut serta dalam pertempuran di angkasa, untuk memastikan keselamatan [PER.GetNameDef] selama beberapa dekade mendatang."
 PER_pilot_training: "Program Pelatihan Percontohan"
 PER_pilot_training_desc: "Pilot membutuhkan lebih dari sekedar bakat mentah untuk bisa menerbangkan pesawat tempur. Program pelatihan menyeluruh bagi mereka yang bersedia mempertaruhkan nyawanya untuk [PER.GetNameDef] akan sangat penting dalam memastikan keselamatan dan efektivitas mereka di angkasa."
 PER_raf_planes: "Beli Pesawat RAF"
 PER_raf_planes_desc: "[ENG.GetNameDefCap] memiliki Angkatan Udara Kerajaan, dan bakat serta keterampilan mereka terkenal di sebagian besar negara. Namun, bukan hanya keterampilan pilotnya tetapi juga kualitas pesawatnya yang membantu mereka memenangkan pertempuran. Mari kita hubungi mereka dan pesan pesawat mereka."
 PER_luftwaffe_planes: "Beli Pesawat Luftwaffe"
 PER_luftwaffe_planes_desc: "Dalam hal pesawat luar biasa, Luftwaffe [GER.GetNameDef] adalah salah satu yang terbaik. Karena kami sudah memiliki hubungan dekat dengan [GET.GetNameDef], masuk akal bagi kami untuk menghubungi mereka dan membeli kelebihan pesawat yang tidak lagi mereka perlukan."
 PER_own_plane_designs: "Kembangkan Desain kami sendiri"
 PER_own_plane_designs_desc: "Setelah menghabiskan sumber daya untuk membeli pesawat asing, mungkin inilah saatnya kita menugaskan para insinyur kita untuk membuat desain pesawat kita sendiri untuk digunakan di angkatan udara."
 PER_establish_air_academy: "Mendirikan Akademi Udara"
 PER_establish_air_academy_desc: "Kita telah menciptakan pelatihan pilot yang belum sempurna sebagai bagian dari proses menjadi anggota angkatan udara, namun kita perlu memiliki pendidikan yang lebih terspesialisasi jika kita ingin benar-benar bisa mengendalikan langit. Pembentukan akademi udara resmi di Teheran akan mempercepat proses ini, dan memastikan bahwa pilot kami dilatih dengan baik."
 PER_legacy_of_gilani: "Warisan Ozra Gilani"
 PER_legacy_of_gilani_desc: "Ozra Gilani adalah wanita pertama yang bergabung dengan Angkatan Udara Kekaisaran [PER.GetAdjective] dan dengan demikian telah menetapkan preseden untuk masa depan di mana kita lebih inklusif dengan angkatan bersenjata kita. Kita harus berupaya mendefinisikan peran perempuan dalam militer kita dan mengizinkan mereka terbang sebagai pilot. Mereka juga harus mempunyai hak untuk mengabdi pada negaranya dengan baik."
 PER_strategic_bombing: "Pengeboman Strategis"
 PER_strategic_bombing_desc: "Perang tidak hanya dimenangkan melalui udara, tetapi juga dengan menghancurkan kemampuan ekonomi dan industri lawan. Mari kita fokus pada pemboman strategis, dan hancurkan fasilitas mereka sebelum mereka menyerang kita."
 PER_battlefield_support: "Dukungan Medan Perang"
 PER_battlefield_support_desc: "Untuk menjamin keselamatan pasukan kita saat mereka bergerak menuju garis depan, sangat penting bagi kita untuk menggunakan pesawat pendukung darat untuk mencegah pesawat musuh menghujani tentara kita."
 PER_air_superiority: "Keunggulan Udara"
 PER_air_superiority_desc: "Kegunaan paling penting dari angkatan udara kita adalah memanfaatkannya untuk menguasai langit. Jika kita mempunyai superioritas udara, maka kita akan mampu melakukan operasi yang lebih berbahaya tanpa takut dicegat."
 PER_perfect_iranian_airforce: "Sempurnakan [PER.GetAdjective] Angkatan Udara"
 PER_perfect_iranian_airforce_desc: "Dengan seluruh sumber daya dan waktu yang kita habiskan untuk mengembangkan kemampuan udara kita, inilah saat yang tepat bagi kita untuk mencapai puncak dan mendeklarasikan diri kita sebagai salah satu angkatan udara yang paling efisien di dunia. Tidak ada yang bisa mengalahkan keterampilan dan bakat pilot kita, atau kehebatan pesawat kita."
 PER_construct_air_bases: "Membangun Pangkalan Udara"
 PER_construct_air_bases_desc: "Pesawat kita memerlukan tempat untuk dikerahkan agar dapat menjalankan misinya secara efisien. Oleh karena itu, penting bagi kita untuk meluangkan waktu untuk mengembangkan pangkalan udara baru di sekitar [PER.GetNonIdeologyName] dan memperluas kapasitas angkatan udara kita."
 PER_construct_air_defenses: "Membangun Pertahanan Udara"
 PER_construct_air_defenses_desc: "Kita perlu memasang lebih banyak senjata anti-pesawat di sepanjang perbatasan untuk melindungi pasukan kita yang maju dari pesawat musuh."
 PER_anti_air_development: "Mendanai Pengembangan Anti Serangan Udara"
 PER_anti_air_development_desc: "Pabrik-pabrik di kota kita telah menjadi sasaran pembom musuh karena mereka ingin mengganggu kemajuan ekonomi dan industri kita. Kita harus menyalurkan sumber daya untuk mengembangkan tindakan anti-serangan udara."
 PER_anti_air_research: "Inisiatif Penelitian Anti-Pesawat"
 PER_anti_air_research_desc: "Senjata anti-udara kita saat ini sudah mulai ketinggalan jaman. Kita harus lebih berupaya dalam meneliti teknologi baru yang akan membantu melindungi negara kita dari bahaya di langit."
 ################
 ##### NAVY #####
 ################
 PER_establish_the_navy: "Membentuk Angkatan Laut"
 PER_establish_the_navy_desc: "Seperti angkatan udara, Angkatan Laut Kekaisaran [PER_GetAdjective] didirikan oleh Reza Shah Pahlavi setelah kudeta dinasti Qajar lama. Sejak saat itu, kami menyadari adanya kebutuhan untuk memperkuat apa yang sudah ada dan memastikan bahwa kami memiliki kendali yang lebih baik atas lautan yang berada di perbatasan utara dan selatan kami."
 PER_officers_to_italy: "Kirim Petugas untuk Melatih di Italia"
 PER_officers_to_italy_desc: "[ITA.GetNameDefCap] adalah tempat kami pertama kali memperoleh beberapa kapal yang saat ini berada di galangan kapal kami, jadi, tentu saja kami memiliki koneksi dalam hal pengembangan angkatan laut. Kita harus menghubungi pemerintah [ITA.GetAdjective] dan meminta agar kita mengirimkan petugas kita untuk pelatihan angkatan laut."
 PER_persian_gulf_fleet: "Armada Teluk Persia"
 PER_persian_gulf_fleet_desc: "Teluk Persia adalah satu-satunya akses kita ke seluruh dunia melalui laut, sehingga layak untuk dilindungi dengan cara apa pun. Jika kami memfokuskan pelatihan kami secara spesifik pada aktivitas kami di teluk, kami dapat memastikan bahwa setiap penjajah dari selatan akan kesulitan mendarat melalui laut."
 PER_construct_naval_bases: "Bangun Pangkalan Angkatan Laut Baru"
 PER_construct_naval_bases_desc: "Kapasitas angkatan laut kita saat ini lebih rendah dari yang kita inginkan. Untuk meningkatkan hal ini, kita harus membangun lebih banyak galangan kapal di sepanjang dua garis pantai kita yang dapat menangani pengiriman kapal perang."
 PER_bolster_the_caspian: "Perkuat Laut Kaspia"
 PER_bolster_the_caspian_desc: "Laut Kaspia mungkin hanya berada di daratan, tapi akan memungkinkan [SOV.GetNameDef] cara lain untuk memasuki wilayah kita jika mereka memilih untuk menyerang. Beberapa orang mungkin mengatakan bahwa mempertahankan laut ini tidak berdasar, namun kita tidak akan pernah bisa merasa terlalu aman dari tetangga kita di utara."
 PER_coastal_defense_initiative: "Inisiatif Pertahanan Pesisir"
 PER_coastal_defense_initiative_desc: "Meskipun kita mempunyai akses yang buruk terhadap lautan di dunia, invasi melalui laut masih mungkin terjadi. Untuk menjamin perlindungan garis pantai [PER.GetNonIdeologyName], kita harus mengajukan inisiatif untuk mengembangkan pertahanan di sepanjang pantai Teluk Persia dan Laut Kaspia."
 PER_purchase_foreign_ships: "Beli Kapal Asing"
 PER_purchase_foreign_ships_desc: "Angkatan Laut kita dibentuk dengan membeli kapal bersenjata baru dari [ITA.GetNameDef] beberapa tahun yang lalu. Kita dapat meningkatkan kemampuan angkatan laut kita dengan menjangkau kekuatan asing lainnya dan membeli lebih banyak kapal. Hal ini hanya akan meningkatkan hubungan antar negara juga."
 PER_found_iranian_shipyards: "Menemukan Galangan Kapal Iran"
 PER_found_iranian_shipyards_desc: "Meskipun membeli kapal dari negara lain saat ini sudah mencukupi, jika kita ingin mengikuti perlombaan senjata angkatan laut di kawasan ini, maka kita harus berinvestasi dalam membangun aset kita sendiri. Kita dapat mencapai hal ini dengan mendirikan sebuah perusahaan yang fokus utamanya pada pembuatan kapal untuk upaya perang kita – Galangan Kapal Iran."
 PER_expand_dockyards: "Memperluas Fasilitas Galangan Kapal"
 PER_expand_dockyards_desc: "Seiring pertumbuhan angkatan laut kita, kita perlu memperluas infrastruktur angkatan laut kita untuk mengimbanginya. Melakukan hal ini hanya akan memastikan kendali atas garis pantai kita akan tetap menjadi milik kita."
 PER_merchant_navy: "Angkatan Laut Pedagang"
 PER_merchant_navy_desc: "Pengangkutan sumber daya melalui laut sangat penting untuk kelangsungan hidup [PER.GetNameDef]. Oleh karena itu, sangatlah penting bagi kita untuk membangun angkatan laut pedagang profesional yang mampu mendukung militer kita."
 PER_expert_raiders: "Perampok Ahli"
 PER_expert_raiders_desc: "Meskipun memastikan perlindungan perdagangan laut kita adalah hal yang penting, pada saat perang, secara aktif mencari dan mengganggu jalur pasokan musuh kita sangatlah penting untuk menghancurkan fungsi perekonomian mereka. Kita harus fokus menggunakan aset angkatan laut kita untuk menyerang konvoi musuh."
##################
#### IMPERIAL ####
##################
 PER_the_pahlavi_imperium: "Imperium Pahlavi"
 PER_the_pahlavi_imperium_desc: "Sejak ia menggulingkan dinasti Qajar pada tahun 1925, Reza Shah Pahlavi telah menjadi kekuatan penuntun [PER.GetNameDef]. Saat negara kita berada di persimpangan konflik besar dunia lainnya, Shah yang agung harus siap menghadapi badai apa pun yang mengancam akan menyapu tanah [PER.GetAdjective] kita yang mulia."
 PER_forced_secularization: "Sekularisasi yang Dipaksa"
 PER_forced_secularization_desc: "Sejak Reza Shah Pahlavi pertama kali berkuasa, selalu ada perlawanan terhadap ulama di [PER.GetNameDef]. Islam tetap menjadi agama negara kita, namun dalam upaya membuktikan kepada dunia Barat bahwa kita mampu berdiri di tengah mereka, sudah saatnya kita memisahkan agama dari negara dan menempuh jalur modernisasi."
 PER_legacy_of_greatness: "Warisan Keagungan"
 PER_legacy_of_greatness_desc: "Tidak mengherankan bagi para pendukung mereka bahwa dinasti Pahlavi ditakdirkan untuk bertahan selama beberapa generasi. Meskipun masa-masa penuh gejolak akan segera terjadi, jelas bahwa Shah dan putranya bersiap untuk memimpin [PER.GetNameDef] menuju masa keemasan kemakmuran."
 PER_imperial_funded_universities: "Universitas yang Didanai Kekaisaran"
 PER_imperial_funded_universities_desc: "Dalam upaya untuk membuktikan bahwa [PER.GetNameDef] mampu berdiri di antara raksasa besar dunia ini, Shah telah menyumbangkan sejumlah besar uang sebagai sumbangan untuk mendanai universitas-universitas di negara tersebut. Dengan pemberian yang melimpah ini, masyarakat kita akan memiliki akses yang lebih besar terhadap pendidikan tinggi yang berkualitas."
 PER_the_unification_initiative: "Inisiatif Unifikasi"
 PER_the_unification_initiative_desc: "[PER.GetNameDefCap] telah berjuang selama beberapa tahun, terutama dalam hal menyatukan masyarakat di bawah satu bendera. Dengan adanya pembangkangan Kurdi dan Azerbaijan yang menyebabkan masalah di negara-negara barat, dan para ulama menentang reformasi agama, kita harus melakukan banyak hal jika kita ingin menyatukan [PER.GetNameDef] untuk selamanya."
 PER_clamp_kurdish_dissidence: "Tekan Pembangkang Kurdi"
 PER_clamp_kurdish_dissidence_desc: "[PER.GetNameDefCap] mencakup beberapa wilayah yang dulunya milik masyarakat Kurdi. Oleh karena itu, terdapat banyak diaspora orang yang tidak senang dengan pemerintahan kita. Sudah saatnya kita menghentikan sel-sel pemberontak ini dan memastikan bahwa stabilitas dan kemakmuran dapat kembali ke kawasan."
 PER_clamp_azerbaijani_dissidence: "Menekan Pembangkangan Azerbaijan"
 PER_clamp_azerbaijani_dissidence_desc: "Bagian utara negara kami memiliki populasi besar orang Azerbaijan yang menyebut [PER.GetNameDef] sebagai rumah mereka. Namun, masih banyak masyarakat yang tidak puas dengan kebijakan kami. Sudah saatnya kita menghentikan sel-sel pemberontak ini dan memastikan bahwa stabilitas dan kemakmuran dapat kembali ke kawasan."
 PER_venerate_islam: "Muliakan Islam"
 PER_venerate_islam_desc: "Islam telah menjadi bagian mendasar dari masyarakat kita sejak Kekaisaran Lama dibongkar selama penaklukan Muslim di Persia. Sejak saat itu, hal ini telah memainkan peranan penting dalam kehidupan sehari-hari sebagian besar warga negara kita. Daripada melawan para ulama, mungkin inilah saatnya bagi kita untuk menghormati agama kita dan menunjukkan kepada dunia betapa berdedikasinya kita terhadap Islam."
 PER_state_atheism: "Sekularisasi Penuh"
 PER_state_atheism_desc: "Dalam [PER.GetNameDef] modern, kita tidak lagi memerlukan agama untuk memainkan peran sebesar dulu. Daripada memasukkannya ke dalam kehidupan kita sehari-hari, kita harus mendorong bentuk ateisme di kalangan masyarakat kita, sehingga memungkinkan kita untuk fokus pada inisiatif modernisasi. Namun, hal ini pasti akan membuat marah para pemimpin agama kita."
 PER_revive_old_ways: "Bangkitkan Kembali Cara Lama"
 PER_revive_old_ways_desc: "Jika kita ingin menonjol di kancah dunia, maka kita harus terus memegang teguh cita-cita Kerajaan Persia sebelumnya. Oleh karena itu, kita harus mengambil upaya untuk memperkenalkan kembali Zoroastrianisme sebagai agama negara bagi [PER.GetNameDef]. Beberapa suku kecil yang berkeliaran di bagian timur negara itu masih menganut agama tersebut, sehingga tidak menutup kemungkinan untuk menghidupkan kembali teologi kuno ini."
 PER_imperial_expansionism: "Ekspansionisme Kekaisaran"
 PER_imperial_expansionism_desc: "Waktunya telah tiba bagi kita untuk mulai memperluas kerajaan baru kita melampaui batas negara kita saat ini. Kita harus menyiapkan mesin perang kita, menyerukan kepada penduduk kita untuk melakukan tugas mereka dan bersiap untuk menunjukkan kepada dunia bahwa Kerajaan [PER.GetAdjective] siap untuk mengklaim apa yang menjadi hak kita."
 PER_tehran_moscow_pact: "Pakta Teheran-Moskow"
 PER_tehran_moscow_pact_desc: "Bukan rahasia lagi bahwa [SOV.GetNameDef] membayangi kita seperti beruang raksasa di utara. Jika kita ingin melaksanakan cita-cita ekspansionis kita, maka kita harus segera mengatasi masalah ini. Kami dapat mengirim utusan diplomatik ke Moskow sesegera mungkin, dengan harapan [SOV.GetAdjective] akan menerima pakta non-agresi."
 PER_establish_special_unit: "Bentuk Legiun Abadi"
 PER_establish_special_unit_desc: "The Immortals adalah salah satu pasukan paling ikonik yang diterjunkan oleh Kerajaan Persia di masa lalu. Saat kita memasuki era baru kebesaran kekaisaran, inilah saatnya bagi kita untuk membangun kembali Dewa sebagai legiun pasukan kejutan elit."
 PER_demand_iraqi_territory: "Menuntut Wilayah Irak"
 PER_demand_iraqi_territory_desc: "Wilayah utara [IRQ.GetNameDef] akan menjadi pijakan yang sangat baik untuk menunjukkan kepada masyarakat di wilayah ini bahwa [PER.GetNameDef] bermaksud untuk berdiri sebagai satu-satunya pembangkit tenaga listrik. Ini akan menjadi salah satu titik awal kampanye penaklukan besar kita."
 PER_demand_afghan_territory: "Menuntut Wilayah Afghanistan"
 PER_demand_afghan_territory_desc: "[AFG.GetNameDefCap] adalah negeri dengan pegunungan dan sungai yang berkelok-kelok, sehingga akan sulit untuk ditaklukkan di masa depan. Jika kita bisa mendapatkan pijakan di negara ini, maka ini akan menjadi titik awal yang sangat baik untuk mendorong lebih jauh menuju Kabul."
 PER_currently_doing_war_plan: "Saat ini sedang mengerjakan §YRencana Perang§!."
 PER_war_plan_darius: "Rencana Perang Darius"
 PER_war_plan_darius_desc: "Darius Agung adalah seorang penguasa Achaemenid yang mengabdi pada Persia sebagai raja segala raja dalam sejarah kuno kita. Dia memerintah Persia di puncak wilayahnya, termasuk sampai ke Lembah Indus. Oleh karena itu, dia sekarang akan menjadi senama bagi rencana kami untuk memasuki anak benua India dan mengusir [ENG.GetAdjective] dari wilayah ini."
 PER_foothold_in_indus: "Sebuah Pijakan di Indus"
 PER_foothold_in_indus_desc: "[RAJ.GetNameDefCap] adalah contoh cemerlang dari kekuatan kolonial [ENG.GetNameDef]. Namun, [ENG.GetAdjective] tidak pantas berada di sini, dan akan bermanfaat bagi mereka jika mengetahui bahwa ini adalah hak asasi [PER.GetNameDef] berdasarkan perkataan Darius Agung. Mulailah negosiasi dan amankan pijakan kami di India."
 PER_usurp_afghanistan: "Merebut [AFG.GetNameDef]"
 PER_usurp_afghanistan_desc: "Waktunya telah tiba bagi kita untuk akhirnya membawa Kabul di bawah kendali [PER.GetAdjective]. Dorong pasukan kami jauh ke pegunungan [AFG.GetNonIdeologyName] dan jangan kembali sampai bendera kami berkibar dari tenda Istana Tajbeg."
 PER_invasion_of_india: "Invasi ke anak benua India"
 PER_invasion_of_india_desc: "Rencana kami untuk menyerang [RAJ.GetNameDef] berpotensi menjadi salah satu tujuan terbesar kami, namun tidak ada keraguan di antara pasukan kami bahwa ini akan menjadi operasi yang berbahaya. Dengan mengancam India, kita akan mengundang kemarahan [ENG.GetAdjective] ke atas kepala kita. Jika hal ini tidak ada konsekuensinya, mari kita lanjutkan invasi ke India."
 PER_glory_of_cyrus: "Kemuliaan Cyrus Agung"
 PER_glory_of_cyrus_desc: "Dengan tercapainya tujuan perang dan mendarat dengan aman di bawah kedaulatan [PER.GetAdjective], kita telah membawa era baru kemakmuran bagi [PER.GetNameDef] melalui kerja keras dan keberanian angkatan bersenjata kita. Pada akhirnya, [PER.GetNameDef] dapat kembali mengharumkan nama pendiri peradaban kita, Cyrus Agung. Kemuliaan bagi Cyrus! Kemuliaan bagi Syah!"
 PER_war_plan_xerxes: "Rencana Perang Xerxes"
 PER_war_plan_xerxes_desc: "Xerxes adalah Raja keempat dari Kekaisaran Achaemenid, yang berkerabat dengan Darius dan Cyrus Agung. Karena Xerxes terkenal karena invasinya ke Yunani pada tahun 480 SM, kami memutuskan untuk menamai rencana kami untuk menyerang wilayah sebelah barat [PER.GetNameDef] untuk menghormatinya. Kita pada akhirnya akan menebus kekalahan kita di tangan kaum Hellenik."
 PER_reclaim_turkish_peninsula: "Rebut kembali Semenanjung Turki"
 PER_reclaim_turkish_peninsula_desc: "[TUR.GetNameDefCap] merupakan kendala yang menghalangi ekspansi kami ke arah barat. Anatolia pernah menjadi wilayah Persia, dan sudah waktunya kita bergerak untuk merebutnya kembali. Pindahkan pasukan kita ke posisinya dan bersiap untuk invasi!"
 PER_reintegrate_anatolia: "Integrasikan kembali Wilayah Anatolia"
 PER_reintegrate_anatolia_desc: "Kini setelah kami menaklukkan wilayah di dalam bekas perbatasan [TUR.GetNameDef], kini kami siap untuk mulai mengintegrasikan wilayah ini ke dalam [PER.GetNameDef] sebagai wilayah resmi, secara de jure."
 PER_clash_of_titans: "Bentrokan para Titan"
 PER_clash_of_titans_desc: "Masalah tak terduga telah tiba dalam bentuk kelahiran kembali [GRE.GetNameDef]. Kita tidak bisa memiliki kerajaan lain seperti ini yang mengumpulkan kekuatan di perbatasan kita. Kita harus segera mendeklarasikan perang, dan bergerak mengamankan tanah ini demi kejayaan Syah!"
 PER_absorb_byzantines: "Serap Kekaisaran Bizantium"
 PER_absorb_byzantines_desc: "Kami akhirnya menyelesaikan dendam berabad-abad terhadap [GRE.GetAdjective] dengan menjatuhkan [GRE.GetNameDef]. Wilayah ini sekarang dapat dimasukkan ke dalam kelompok, dan berdiri sebagai bagian resmi dari Kekaisaran kita."
 PER_war_plan_cambyses: "Rencana Perang Cambyses"
 PER_war_plan_cambyses_desc: "Sebagai penerus langsung Cyrus Agung, Cambyses II adalah Raja kedua dari Kerajaan Achaemenid. Karena pemerintahannya ditandai dengan penaklukan di Afrika Utara dan Mesir, kampanye kami di wilayah tersebut dinamai menurut namanya untuk menghormati kejayaannya."
 PER_path_through_iraq: "Buat Jalan Melalui Irak"
 PER_path_through_iraq_desc: "[IRQ.GetNameDefCap] adalah pintu gerbang kita untuk menaklukkan Afrika Utara dan karenanya, harus menjadi pihak pertama yang kalah. Karena Bagdad sangat dekat dengan perbatasan kami, kami seharusnya tidak mempunyai masalah untuk masuk ke negara tersebut dan mempertaruhkan klaim kami atas tanah mereka."
 PER_demand_west_asia: "Amankan Perancis di Asia Barat"
 PER_demand_west_asia_desc: "[FRA.GetAdjective] adalah penjajah yang melanggar hukum di wilayah ini dan harus diusir jika kita ingin mengamankan agenda kekaisaran kita sendiri. Wilayah [SYR.GetNameDef] dan [LEB.GetNameDef] harus direbut, jika kita ingin melanjutkan menghadapi [ENG.GetAdjective] di Afrika Utara..."
 PER_march_to_nile: "Perjalanan Panjang Menuju Sungai Nil"
 PER_march_to_nile_desc: "Untuk merebut kembali bekas wilayah Persia di Afrika Utara, kita harus menerobos [ENG.GetAdjective] Afrika Utara sebelum akhirnya menginvasi Mesir. Hal ini tidak diragukan lagi akan membawa kita berperang dengan [ENG.GetNameDef], namun ini adalah risiko yang harus kita ambil jika kita ingin menegaskan diri kita sebagai kekuatan imperial yang dominan di wilayah tersebut."
 PER_the_memphis_initiative: "Inisiatif Memphis"
 PER_the_memphis_initiative_desc: "Mengintegrasikan wilayah ke dalam Kekaisaran kita sangatlah penting jika kita ingin mempertahankan kendali atas wilayah yang kita taklukkan. Mesir khususnya akan sulit untuk menjaga sejalan jika kita tidak hati-hati, dan oleh karena itu kita harus memprioritaskan perhatian pada mereka secara khusus."
 PER_assassinate_reza_shah: "Pembunuhan Reza Syah"
 PER_assassinate_reza_shah_desc: "Reza Shah Pahlavi mungkin telah melakukan perubahan besar pada [PER.GetNameDef], namun tidak semuanya populer di kalangan masyarakat. Ada desas-desus tentang rencana pembunuhan selama bertahun-tahun, tetapi tidak ada yang benar-benar mengambil tindakan... bukan?"
 PER_root_out_conspiracies: "Singkirkan Konspirasi"
 PER_root_out_conspiracies_desc: "Selama bertahun-tahun, ada banyak rumor tentang potensi rencana pembunuhan terhadap Reza Shah Pahlavi. Kami menganggap risiko ini terlalu besar, dan oleh karena itu, sangat penting bagi kami untuk membasmi konspirasi ini demi menjamin keselamatan Shah."
 PER_his_fathers_footsteps: "Mengikuti Jejak Ayahnya"
 PER_his_fathers_footsteps_desc: "Menyusul kematian tragis Reza Shah Pahlavi, putranya, Mohammed Reza Pahlavi, mengambil alih jabatan sebagai pemimpin [PER.GetNameDef]. Meski seorang raja muda, yang tidak memiliki keinginan untuk memerintah, ia harus mengikuti jejak ayahnya dan membawa kejayaan bagi [PER.GetNameDef]."
 PER_third_persian_empire: "Kekaisaran Persia Ketiga"
 PER_third_persian_empire_desc: "Untuk menjamin masa depan rakyat kita, Mohammed Reza Pahlavi telah mengumumkan pembentukan Kekaisaran Persia Ketiga, yang bertujuan untuk meniru dan menghormati sejarah pendahulu kuno kita – Achaemenids. Ini adalah era baru bagi [PER.GetNameDef], dan era yang seharusnya membawa kita menuju kehebatan."
 PER_choose_a_shahbanu: "Pilih Shahbanu"
 PER_choose_a_shahbanu_desc: "Garis keturunan kerajaan Dinasti Pahlavi harus terus berlanjut, tetapi mengingat masa muda Mohammed Reza Pahlavi, dia belum memiliki kesempatan untuk mencari istri. Sudah waktunya bagi dia untuk mempertimbangkan pilihannya, dan memilih seorang wanita yang akan menjadi Shahbanu negara kita."
 PER_embrace_opulence: "Rangkullah Budaya Kemewahan"
 PER_embrace_opulence_desc: "Bagi seseorang yang sama pentingnya dengan Raja di atas Segala Raja, sangatlah penting bagi kita untuk menunjukkan kepada dunia betapa mewahnya [PER.GetAdjective]. Mari kita tunjukkan kemegahan kita kepada semua orang yang ingin memandangnya."
 PER_emperor_for_people: "Seorang Kaisar untuk Rakyat"
 PER_emperor_for_people_desc: "Mohammed Reza Shah berharap pemerintahannya menjadi ciri khas untuk menghubungkan kembali Kaisar dengan rakyatnya. Alih-alih secara egois menimbun kekayaan untuk keluarga kerajaan, ia malah ingin menggunakannya untuk meningkatkan kehidupan warga negara [PER.GetNameDef]."
 PER_fund_imperial_excellency: "Dana Yang Mulia Kekaisaran"
 PER_fund_imperial_excellency_desc: "Kekaisaran telah mengambil jalan untuk memamerkan kekayaan kami kepada tetangga-tetangga kami yang lebih kecil. Sekarang saatnya menghabiskan sebagian darinya untuk memperbaiki istana. Mempekerjakan lebih banyak penjaga sepertinya akan berhasil!"
 PER_uphold_civil_rights: "Menjunjung Tinggi Hak Sipil"
 PER_uphold_civil_rights_desc: "Menghormati hak-hak sipil warga [PER.GetNameDef]' telah menjadi bagian penting dari pemerintahan Mohammed Reza Shah sejauh ini. Dengan menjunjung tinggi aspek fundamental dalam masyarakat, kami mendorong masyarakat untuk mencapai hal-hal yang lebih besar dari sebelumnya."
 PER_absolute_monarchy: "Monarki Absolut"
 PER_absolute_monarchy_desc: "Menyusul tindakan keras Reza Shah Pahlavi terhadap para pembangkang yang berusaha mencabut kekuasaannya, ia kini mendeklarasikan monarki absolut, mengambil lebih banyak kekuasaan dan memastikan tidak ada orang lain yang dapat mengancam garis keturunannya. Proses ini mencakup fokus pada pendekatan yang lebih militeristik terhadap urusan luar negeri, dan perluasan pasukan tetap [PER.GetNameDef]."
 PER_first_iranian_empire: "Kekaisaran Iran Pertama"
 PER_first_iranian_empire_desc: "Reza Shah Pahlavi selalu lebih suka negaranya disebut [PER.GetNameDef], dan merupakan orang yang mengembalikan nama ini sebagai nama resmi negara pada tahun 1935. Oleh karena itu, dasar dari aspirasi kekaisaran barunya adalah pembentukan Kekaisaran Iran yang baru, daripada secara langsung meniru Persia sebelum dia."
 PER_take_regional_tour: "Ikuti Tur Regional"
 PER_take_regional_tour_desc: "Menyusul pembentukan Kekaisaran baru kami, Reza Shah Pahlavi ingin melakukan tur keliling wilayah, mengunjungi [IRQ.GetNameDef] dan [AFG.GetNameDef] untuk meningkatkan hubungannya dengan para pemimpin kedua negara ini."
 PER_limit_foreign_influence: "Batasi Pengaruh Asing"
 PER_limit_foreign_influence_desc: "Sudah terlalu lama [PER.GetNameDef] berada di bawah pengaruh kekuatan asing. Mereka mengklaim sumber daya yang kita miliki dan menuntut agar kita berbagi keuntungan alam yang kita peroleh. Sudah saatnya [PER.GetNameDef] berdiri sendiri, dan kita sebaiknya membatasi pengaruh pihak luar terhadap bangsa kita."
 PER_embrace_industrial_powers: "Merangkul Kekuatan Industri"
 PER_embrace_industrial_powers_desc: "Dari pada mengucilkan diri dan mengisolasi diri dari dunia luar, akan lebih baik jika kita memanfaatkan hubungan kita dengan kekuatan industri untuk membantu pembangunan masa depan [PER.GetNameDef]."
 PER_subserviant_to_noone: "Kita Tidak Tunduk pada Siapa Pun"
 PER_subserviant_to_noone_desc: "Meskipun kami mungkin pernah melihat hubungan kami dengan [ENG.GetNameDef] dan Perusahaan Minyak Anglo-Iran bermanfaat di masa lalu, kami tidak lagi perlu membiarkan sumber daya kami dirampas oleh kekuatan asing. Kita harus membubarkan perusahaan ini, dan fokus pada pengembangan diri kita sendiri."
 PER_modernize_iran_economy: "Modernisasi Perekonomian [PER.GetNameDef]"
 PER_modernize_iran_economy_desc: "Dengan bantuan teman-teman kami yang lebih rajin, kami telah mampu memodernisasi perekonomian kami saat ini. Ketika pabrik-pabrik bergejolak dan orang-orang kita bekerja keras, kita akan segera berdiri bersama negara-negara besar lainnya di dunia sebagai kekuatan industri."
 PER_last_thousand_years: "Sebuah Kerajaan yang Bertahan Seribu Tahun"
 PER_last_thousand_years_desc: "Melalui seluruh kerja keras dan dedikasi kami untuk memajukan bangsa, kami akhirnya mencapai titik di mana [PER.GetNameDef] ditakdirkan untuk bertahan dalam ujian waktu, dan berdiri di panggung dunia sebagai negara modern dan kuat. Kami akhirnya melampaui kemegahan nenek moyang Achaemenid kami!"
 PER_shahanshah: "Shahanshah"
 PER_shahanshah_desc: "Shahanshah, atau Raja segala Raja, adalah gelar tertinggi yang dianugerahkan kepada raja [PER.GetNameDef]. Itu adalah gelar yang sangat cocok untuk penguasa kita saat ini, dan suatu kehormatan untuk digunakan sekali lagi."
 PER_rally_ancient_history: "Reli Dibalik Sejarah Kuno"
 PER_rally_ancient_history_desc: "Bukan rahasia lagi bahwa masa pemerintahan dinasti Pahlavi yang masih muda telah membuat banyak orang [PER.GetNameDef] gelisah tentang apa yang mungkin terjadi di masa depan. Kesempatan terbesar kita untuk menyebarkan kebanggaan nasionalis dan kepercayaan pada Shah, adalah untuk mengingatkan rakyat kita, dan dunia, betapa menakjubkannya sejarah Persia kuno. Ini adalah waktu untuk merayakan Kekaisaran Achaemenid."
 PER_rebuild_persepolis: "Membangun kembali Persepolis"
 PER_rebuild_persepolis_desc: "Persepolis adalah ibu kota seremonial Kekaisaran Achaemenid, dan reruntuhannya terletak di dataran Marvdasht. Sebagai sebuah situs warisan budaya, akan menjadi langkah yang kuat untuk menghabiskan sumber daya kita untuk membangun kembali dan memperbarui kota kuno ini, dan menjadikannya sebagai simbol Kekaisaran kita selama beberapa dekade mendatang."
 PER_stand_with_germany: "Berdiri Dengan [GER.GetNameDef]"
 PER_stand_with_germany_desc: "Selama bertahun-tahun, [GER.GetNameDef] telah menjadi salah satu mitra dagang terbesar kami. Ketika negara-negara tersebut melanjutkan tujuan penaklukan mereka, sebaiknya kita membuat kesepakatan dan membuat pakta non-agresi dengan mereka, demi melindungi prospek kita sendiri."
 PER_align_with_axis: "Sejajarkan [PER.GetNameDef] dengan Axis"
 PER_align_with_axis_desc: "Saat perang berkecamuk di Eropa, teman-teman [GER.GetAdjective] kita membutuhkan sekutu untuk membantu upaya perang mereka. Sudah waktunya kita melemparkan topi kita sendiri ke dalam ring dan bergabung dalam perang di pihak Axis."
 PER_donate_oil_fields: "Donasi Ladang Minyak ke [GER.GetNameDef]"
 PER_donate_oil_fields_desc: "Setelah sekian lama menyediakan minyak untuk negara-negara seperti [ENG.GetNameDef], akan lebih bermanfaat jika kita mendonasikan sebagian fasilitas ekstraksi kita ke [GER.GetNameDef] untuk membantu upaya perang mereka. Semoga ini memberi manfaat bagi kita berdua dalam jangka panjang."
 PER_spoils_of_war: "Rampasan Perang"
 PER_spoils_of_war_desc: "Upaya kami dalam perang ini tidak luput dari perhatian sekutu kami, yang terbuka terhadap gagasan [PER.GetNameDef] mengamankan wilayah di wilayah sekitar setelah perang berakhir. Ini adalah peluang bagus untuk memanfaatkan rampasan perang."
 PER_middle_east_protectorate: "Membangun Protektorat di Timur Tengah"
 PER_middle_east_protectorate_desc: "Ketika perang telah berakhir, kami telah mampu mengamankan beberapa negara di wilayah sekitar [PER.GetNameDef]. Sekarang menjadi tugas kita sebagai penguasa mereka untuk memastikan perlindungan mereka dari invasi kekuatan lain sebelumnya. Jika ada orang yang ingin mencoba mengambil tanah ini dari kami, kami ingin melihat mereka mencobanya."
##################
### HISTORICAL ###
##################
 PER_stand_with_giants: "Untuk Berdiri Bersama Raksasa"
 PER_stand_with_giants_desc: "Keseimbangan dunia berada di ujung tanduk dan konflik antar negara-negara besar sedang terjadi di Eropa. Saat sumbu tong mesiu perlahan mulai terbakar, kita harus mempersiapkan diri untuk mengangkat [PER.GetNameDef] ke tingkat di mana kita dapat berdiri di antara raksasa dunia ini dan bertahan dalam ujian waktu sebagai masyarakat modern dan progresif."
 PER_saadabad_treaty: "Perjanjian Saadabad"
 PER_saadabad_treaty_desc: "Kita tidak akan rugi apa-apa dan kita akan mendapat banyak manfaat dengan tetap bersahabat dengan tetangga kita. Gagasan mengenai perjanjian yang meresmikan persahabatan kita kadang-kadang dilontarkan, dan inilah saat yang tepat bagi kita untuk mengambil inisiatif dan memastikan persahabatan ini dikodifikasikan dalam sebuah perjanjian."
 PER_increase_military_funding: "Meningkatkan Pendanaan Militer"
 PER_increase_military_funding_desc: "Pemimpin kami, Reza Shah Pahlavi, adalah alumni Cossack Persia yang bergengsi. Tidak mengherankan bagi mereka yang berada di pemerintahan bahwa ia ingin meningkatkan kemampuan militer [PER.GetNameDef]. Hal ini dimulai dengan mendanai apa yang kita miliki saat ini untuk meningkatkan kualitas pasukan kita dan meningkatkan produksi peralatan militer."
 PER_military_high_schools: "Mendirikan Sekolah Menengah Militer"
 PER_military_high_schools_desc: "Pasukan tetap yang terlatih dimulai dari masa muda kita. Dengan mendidik generasi muda kita mengenai keunggulan militer, kita akan mempersiapkan diri untuk sukses di masa depan. Ini akan memakan waktu beberapa tahun, namun pada akhirnya kita akan memiliki pasukan terbesar di kawasan ini."
 PER_persian_german_trade: "Kamar Dagang Persia-Jerman"
 PER_persian_german_trade_desc: "[GER.GetNameDefCap] telah berhasil melakukan industrialisasi dengan cepat sekali lagi setelah kekalahannya dalam Perang Besar. Ini akan menjadi contoh yang bagus untuk diikuti saat kita mendorong modernisasi [PER.GetNameDef]. Tampaknya pemimpin baru mereka juga menghormati kita, sehingga memungkinkan transisi yang mulus dalam membentuk hubungan yang positif."
 PER_trial_fifty_three: "Pengadilan Melawan Lima Puluh Tiga"
 PER_trial_fifty_three_desc: "Organisasi politik komunis telah terbukti bermasalah dalam proses mengamankan kekuasaan Pahlavi di [PER.GetNameDef]. Kita tidak bisa membiarkan sentimen anti-monarki ini berkembang dan berpotensi mengakibatkan demonstrasi massal. Sebaliknya, kita harus membawa para pembangkang ini ke pengadilan dan membiarkan pengadilan menentukan nasib mereka."
 PER_increase_education_funding: "Meningkatkan Pendanaan Pendidikan"
 PER_increase_education_funding_desc: "Sebagai bagian dari inisiatif modernisasi Reza Shah, terdapat penekanan pada peningkatan kualitas pendidikan di negara tersebut. Berbeda dengan masa lalu, kami bertujuan untuk mendirikan pendidikan wajib gratis bagi laki-laki dan perempuan serta menutup lembaga pendidikan keagamaan swasta."
 PER_open_abadan: "Buka Sekolah Teknik Abadan"
 PER_open_abadan_desc: "Pendidikan teknik akan membantu kita berdiri di antara raksasa industri dunia, dan dengan membuka sekolah teknik baru ini, kita dapat memberikan kesempatan pendidikan bagi mereka yang ingin bekerja di bidang tersebut. Hal ini akan membantu kita memulai pembangunan dan proses modernisasi."
 PER_royal_visit_germany: "Kunjungan Kerajaan ke Jerman"
 PER_royal_visit_germany_desc: "Selama masa pemerintahan Reza Shah, kami menjaga hubungan baik dengan pemimpin [GER.GetNameDef]. Hal ini tercermin dalam keinginan mereka untuk menerima kami dalam kunjungan kerajaan ke negara mereka. Jika kami melakukan hal ini, kami yakin akan terus meningkatkan hubungan kami dengan [GER.GetNameDef], namun masih harus dilihat apakah ini akan membantu atau menjadi hambatan, masih harus dilihat!"
 PER_german_non_aggression: "Diskusikan Pakta Non-Agresi dengan [GER.GetNonIdeologyName]"
 PER_german_non_aggression_desc: "Ketika keadaan mulai memanas di Eropa, mungkin ada tekanan bagi kita untuk memilih salah satu pihak. Namun, penting bagi [PER.GetNameDef] untuk tetap netral jika perang ingin pecah. Mengingat industrialisasi massal yang mereka lakukan, kita harus menawarkan pakta non-agresi kepada [GER.GetNameDef] untuk menjamin keselamatan kita."
 PER_wether_the_storm: "Mengatasi Badai yang Berkumpul"
 PER_wether_the_storm_desc: "Tampaknya upaya kami untuk melindungi diri kami secara diplomatis telah menjadi bumerang, karena mantan teman kami mengalihkan perhatian mereka ke wilayah kami dengan harapan dapat mencegah kami untuk melawan mereka. Meski kami tidak punya niat untuk melakukannya, kami harus bersiap menghadapi apa pun yang mungkin terjadi."
 PER_stand_our_ground: "Pertahankan Posisi Kami"
 PER_stand_our_ground_desc: "Ketakutan dan kecemasan merajalela di seluruh pemerintahan kita seiring dengan ancaman yang datang dari negara-negara tetangga kita dan negara-negara lain yang terus memberikan tekanan yang tidak tergoyahkan. Kita harus tetap teguh pada pendirian kita, apa pun yang mungkin terjadi. Sudah waktunya untuk mengambil langkah-langkah untuk memastikan bahwa [PER.GetNameDef] dapat bertahan pada dekade berikutnya."
 PER_bolster_civilian_industry: "Perkuat Industri Sipil kita"
 PER_bolster_civilian_industry_desc: "Jika kita ingin selamat dari badai yang akan datang, kita harus berhati-hati dalam mendukung industri sipil kita. Semakin banyak sumber daya yang kita gunakan untuk melakukan hal ini, semakin besar kemungkinan perekonomian kita akan bertahan dalam perang apa pun yang akan datang."
 PER_upscale_military_production: "Produksi Militer Kelas Atas"
 PER_upscale_military_production_desc: "Jika kita ingin melawan pihak-pihak yang mengancam negara kita, maka kita harus siap melipatgandakan hasil industri militer kita. Dengan mendirikan pabrik baru, kami akan berada dalam posisi terbaik untuk terus memperkuat kekuatan kami dengan peralatan baru dan terkini."
 PER_preparatory_mobilization: "Mobilisasi Persiapan"
 PER_preparatory_mobilization_desc: "Dengan gagal melakukan persiapan, kita sedang bersiap untuk gagal. Bukan rahasia lagi bahwa kekuatan asing memandang [PER.GetNonIdeologyName] dengan pandangan serakah, dan jika mereka ingin merebutnya, maka kami akan turun berperang. Dengan melakukan persiapan untuk memobilisasi tentara, kita akan siap menghadapi apa pun yang mungkin dilontarkan musuh kepada kita."
 PER_we_will_survive: "Kami Akan Bertahan"
 PER_we_will_survive_desc: "Pada akhirnya, perang telah tiba di depan pintu kita. Tanpa ragu, kami akan melakukan yang terbaik untuk melawan penjajah ini, dan menunjukkan kepada dunia bahwa negara besar [PER.GetNameDef] akan bertahan melawan segala rintangan. Kita telah bertahan selama ribuan tahun, dan kita akan bertahan selama ribuan tahun lagi."
 PER_we_survived: "Kami Bertahan"
 PER_we_survived_desc: "Kami telah berhasil bertahan melawan segala rintangan! Kini saatnya tiba untuk menciptakan stabilitas bagi rakyat kita."
 PER_question_of_resources: "Pertanyaan Sumberdaya"
 PER_question_of_resources_desc: "Kami telah mengetahui bahwa ada kemungkinan besar bahwa potensi invasi dari mantan rekanan kami sangat mungkin terjadi karena kayanya sumber daya [PER.GetNameDef]. Ladang minyak kita sangat berharga, sehingga besar kemungkinan seseorang akan datang untuk mengambilnya. Mereka tidak bisa dibiarkan melakukan hal ini, jadi mari kita berupaya untuk memberantas potensi ancaman ini sebelum mereka menyerang kita..."
 PER_plant_resistance_cells: "Sel Ketahanan Tanaman"
 PER_plant_resistance_cells_desc: "Untuk mempersiapkan serangan pendahuluan, sebaiknya kita mengobarkan kerusuhan politik di wilayah tetangga kita. [IRQ.GetNameDef] sepertinya merupakan pilihan yang sangat baik, begitu juga dengan wilayah yang diduduki [AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef], [TMS.GetNameDef]."
 PER_preemptive_strike: "Serangan Pencegahan"
 PER_preemptive_strike_desc: "Tidak ada yang akan mengancam kedaulatan kita. Untuk memastikan bahwa mereka yang melihat kami dengan mata serakah akan belajar untuk tidak mengganggu kami, kami akan menunjukkan kepada mereka kekuatan penuh dari pasukan militer [PER.GetNameDef]. Jika kita menyerang lebih dulu, maka mereka tidak akan siap bertahan dari serangan yang cepat dan berat."
 PER_establish_northern_buffer_states: "Membangun Negara Penyangga Utara"
 PER_establish_northern_buffer_states_desc: "Untuk memastikan bahwa musuh-musuh kita di utara tidak lagi memiliki kesempatan untuk menyerbu langsung ke [PER.GetNameDef], kita harus membebaskan negara-negara yang diduduki di wilayah ini dan memulihkan kedaulatan mereka. Mudah-mudahan hal ini akan mencegah invasi mendadak di masa depan."
 PER_prepare_for_worst: "Bersiaplah untuk yang Terburuk"
 PER_prepare_for_worst_desc: "Karena kami mengetahui adanya potensi invasi ke [PER.GetNameDef], sebaiknya kami mulai melakukan persiapan, jika hal terburuk terjadi. Meskipun kami merasa hal ini akan terjadi, kami tidak bisa membiarkan diri kami berguling dan memperlihatkan perut kami. Sebaliknya, kita harus membangun kekuatan untuk membantu upaya kita ketika tiba saatnya untuk melakukan serangan pendahuluan."
 PER_fight_for_iran: "Perjuangan untuk [PER.GetNonIdeologyName]"
 PER_fight_for_iran_desc: "Ketakutan terburuk kami menjadi kenyataan ketika pasukan musuh menerobos pertahanan kami dan membuat kemajuan dalam invasi skala penuh ke [PER.GetNameDef]. Meskipun masa-masa ini sulit, kita harus mengerahkan rakyat dan mempersiapkan pasukan kita untuk mempertahankan negara besar kita dari kekuatan asing yang mengancam kedaulatan kita."
 PER_force_them_back: "Paksa Mereka Kembali"
 PER_force_them_back_desc: "Kami selalu tahu bahwa ketika perang dimulai, kami harus bertahan atau memukul mundur musuh. Jika kita mengambil jalur ofensif, kita akan berada dalam posisi yang baik untuk mengajukan tuntutan setelah konflik selesai. Ini mungkin berisiko, tapi pasukan kami siap menangani operasi semacam itu."
 PER_push_to_deserts: "Serangan Utara"
 PER_push_to_deserts_desc: "Pasukan musuh terutama menyerang kami dari perbatasan utara [PER.GetNameDef]. Kita harus memfokuskan pasukan kita di wilayah ini dan mencegah penjajah menguasai wilayah lebih jauh. Lalu, kami melakukan perlawanan terhadap mereka, dan mendorong mereka kembali ke perbatasan."
 PER_push_to_mountains: "Front Selatan"
 PER_push_to_mountains_desc: "Tampaknya invasi telah terjadi di selatan [PER.GetNonIdeologyName]. Jika kita ingin menghalaunya, kita harus memfokuskan upaya kita untuk mengusir musuh-musuh kita kembali ke Teluk Persia. Waktu sangatlah penting, kita tidak bisa membiarkan kekuatan mereka menguasai lebih banyak wilayah."
 PER_demand_war_reparations: "Menuntut Pampasan Perang"
 PER_demand_war_reparations_desc: "Meskipun para penjajah telah berupaya sebaik-baiknya, mereka gagal mencapai tujuan mereka dan sebaliknya, kita mulai memenangkan perang. Kita harus segera memaksakan tuntutan kita kepada mereka, dan membuat mereka membayar kerugian yang telah mereka timbulkan."
 PER_force_white_peace: "Paksa Perdamaian Putih"
 PER_force_white_peace_desc: "Invasi musuh kita tidak berjalan sesuai rencana. Karena perlawanan sengit dan keinginan kami untuk melawan mereka, mereka gagal mendapatkan banyak kekuatan di [PER.GetNonIdeologyName]. Mengingat kesulitan yang mereka hadapi, kita berada dalam posisi yang baik untuk memaksakan perdamaian putih terhadap para penjajah yang kurang ajar ini."
 PER_dig_and_defend: "Gali dan Pertahankan"
 PER_dig_and_defend_desc: "Saat kekuatan musuh menyerbu perbatasan negara besar kita dari segala arah, kita harus bertindak cepat jika ingin menyelamatkan [PER.GetNameDef]. Daripada menyerang, kita harus berusaha keras untuk bertahan dan menimbulkan masalah bagi penjajah. Kalau tidak, kita berisiko mengalami kerugian dalam jumlah besar."
 PER_capital_protect: "Lindungi [PER.Capital.GetCapitalVictoryPointName]"
 PER_capital_protect_desc: "Mengingat posisi [PER.Capital.GetCapitalVictoryPointName], ini adalah tempat yang tepat untuk melakukan pertahanan yang kuat. Dengan mendirikan bunker dan pertahanan di sini, kita akan mampu menjadi benteng harapan terakhir di [PER.GetNameDef]."
 PER_secure_coastline: "Amankan Garis Pantai"
 PER_secure_coastline_desc: "Invasi dijadwalkan datang dari Teluk Persia, jadi mari kita hadapi mereka secara langsung dan cegah musuh mendapatkan wilayah apa pun di [PER.GetNonIdeologyName]. Jika kita bisa menghentikan mereka menyiapkan pantai, kita akan berada dalam posisi yang baik untuk menghentikan langkah mereka."
 PER_swear_fealty: "Bersumpah Setia kepada Penjajah"
 PER_swear_fealty_desc: "Meskipun kami berupaya sebaik mungkin untuk melindungi [PER.GetNameDef], kami gagal menahan musuh. Saat pasukan mereka semakin dekat dengan ibu kota kita, akan lebih bijaksana jika kita segera mengakhiri perang ini, dan menawarkan diri kita sebagai boneka. Setidaknya dengan cara ini, kita dapat mencegah kehancuran lebih lanjut terhadap negara kita."
 PER_push_negotiations: "Dorong Negosiasi"
 PER_push_negotiations_desc: "Saat ini, kami telah mampu menghalau invasi selama kami bisa. Namun, kami tidak dalam posisi untuk mendorong diakhirinya konflik secara langsung. Namun, kita mempunyai potensi untuk menawarkan sebagian sumber daya alam kita demi mempertahankan kedaulatan kita."
 PER_rebuilding_iran: "Membangun kembali [PER.GetNonIdeologyName]"
 PER_rebuilding_iran_desc: "Invasi ini telah menyebabkan sebagian besar industri dan infrastruktur kita hancur. Kita harus menggunakan waktu ini untuk fokus membangun kembali negara kita ke kejayaannya, mengambil bagian dan menyelesaikan luka kita."
 PER_declare_loyalty_to_britain: "Nyatakan Kesetiaan kepada [ROOT.OVERLORD.GetNameDef]"
 PER_declare_loyalty_to_britain_desc: "Sebagai subjek baru [ROOT.OVERLORD.GetNameDef], sebaiknya kita berhati-hati dan mengikuti keinginan tuan kita. Mungkin ini bisa menjadi kesempatan kita untuk menyelesaikan inisiatif modernisasi kita. Jalannya mungkin berbeda jauh, tapi akhirnya tetap sama."
 PER_invite_british_investors: "Undang [ROOT.OVERLORD.GetAdjective] Investor"
 PER_invite_british_investors_desc: "Untuk meningkatkan perekonomian kita dan membangun kembali setelah invasi, kita dapat mencoba melobi [ROOT.OVERLORD.GetNameDef] untuk menyediakan investor guna membantu industri kita kembali ke jalurnya."
 PER_request_british_equipment: "Minta Peralatan [ROOT.OVERLORD.GetAdjective]"
 PER_request_british_equipment_desc: "Angkatan bersenjata kami terpukul selama invasi, dan oleh karena itu, kami sangat ingin menambah pasokan pasukan kami. Sebagai subjek baru [ROOT.OVERLORD.GetNameDef], kami berada dalam posisi yang baik untuk meminta perbekalan dan perlengkapan agar pasukan kami kembali ke standar sebelumnya."
 PER_our_place_in_empire: "Tempat Kami dengan [ROOT.OVERLORD.GetNameDef]"
 PER_our_place_in_empire_desc: "Setelah berdiskusi dengan pemerintah [ROOT.OVERLORD.GetAdjective], kami memutuskan tindakan terbaik adalah menetapkan [PER.GetLeader] sebagai Raja Muda [PER.GetNonIdeologyName] yang baru sesuai dengan posisinya saat ini. Hal ini akan memberi kami lebih banyak kelonggaran dalam melaksanakan tugas kami sebagai bagian dari [ROOT.OVERLORD.GetNameDef]."
 PER_retake_north_iran: "Ambil kembali Utara [PER.GetNonIdeologyName]"
 PER_retake_north_iran_desc: "Saat awal kami menyerah dan memohon penyerahan diri, kami tidak punya pilihan selain menyerahkan wilayah utara kami kepada [SOU.GetNameDef]. Sekarang kita telah mengumpulkan lebih banyak kekuatan, sekarang saatnya untuk menyerang balik penjajah tersebut dan merebut kembali apa yang menjadi hak kita."
 PER_azadi: "Azadi"
 PER_azadi_desc: "Azadi adalah kata dalam bahasa Persia yang berarti 'Kebebasan' dan akan menjadi ungkapan yang kita gunakan saat kita bersiap melawan penjajah. [ROOT.OVERLORD.GetNameDefCap] mengharapkan kami untuk patuh, namun kami selalu mempunyai niat untuk melindungi kedaulatan kami. Kita mungkin kalah dalam pertempuran, tapi kita tetap akan berperang."
 PER_reinforce_iranian_identity: "Perkuat Identitas [PER.GetAdjective]"
 PER_reinforce_iranian_identity_desc: "Meski harus menyerah pada musuh, kita semua tetap [PER.GetAdjective] dan tidak ada yang akan mengambilnya dari kita. Kita harus memperkuat identitas ini kepada masyarakat, dan menunjukkan kepada mereka bahwa keinginan kita untuk kebebasan masih berkobar di hati kita."
 PER_rally_bakhtiari_and_qashqai: "Kumpulkan Bakhtiari dan Qashqai"
 PER_rally_bakhtiari_and_qashqai_desc: "Tidak puas dengan pergantian rezim, masyarakat suku Bakhtiari dan Qashqai mulai menolak negara hukum baru. Kita dapat memanfaatkan hal ini, dan jika kita menggalang dukungan mereka, kita akan memiliki lebih banyak orang untuk membantu kita berjuang jika perjuangan kemerdekaan kita berakhir dengan pertumpahan darah."
 PER_iran_for_iranians: "[PER.GetNonIdeologyName] untuk [PER.GetAdjective]dtk"
 PER_iran_for_iranians_desc: "Sungguh memalukan harus menyerah pada penguasa imperialis dan menyerahkan wilayah kami kepada mereka yang ingin menghancurkan kedaulatan kami. Namun ada satu hal yang benar, yaitu keinginan kita akan otonomi yang tidak akan pernah padam. Saatnya kita bangkit dan mendeklarasikan kemerdekaan!"
 PER_consolidate_british_territory: "Konsolidasikan Wilayah [ENG.GetAdjective]"
 PER_consolidate_british_territory_desc: "Sudah terlalu lama [ENG.GetNameDef] hadir di Timur Tengah; tempat di mana mereka sebenarnya bukan tempatnya. Sekarang kita telah berjuang untuk kemerdekaan, mari kita lakukan hal yang sama untuk negara-negara lain di kawasan ini, dan pastikan mereka dilindungi oleh kita dan bukan diperintah oleh [ENG.GetNameDef]."
 PER_assessing_the_opposition: "Menilai Oposisi"
 PER_assessing_the_opposition_desc: "Sebelum kita mempertimbangkan untuk memperluas perbatasan kita ke luar Iran, pertama-tama kita harus melihat ke dalam. Beberapa partai oposisi tampaknya semakin frustrasi terhadap pemerintah kita seiring berjalannya waktu. Jika kita ingin menggalang dukungan rakyat untuk membangun kembali sebuah kerajaan, maka kita perlu memastikan bahwa kita mendapat dukungan penuh dari pemerintah, dengan cara apa pun yang diperlukan."
 PER_assessing_the_opposition_tt: "Membuka keputusan §YPenindasan Pemerintah§! dalam misi §YKerusuhan Sipil§! dari §YWarisan Kebesaran§! yang memungkinkan kita mengelola ancaman dan mencegah perang saudara."
 PER_rally_the_reformers: "Bentuk Front Nasional"
 PER_rally_the_reformers_desc: "Terdapat banyak faksi di seluruh negeri yang ingin Shah atau institusi monarki diakhiri secara tiba-tiba. Ketika dunia mulai mengalami ketidakstabilan, peluang-peluang baru mungkin muncul bagi faksi-faksi tersebut untuk mengambil tindakan."
 PER_lobby_military_dissidents: "Jaringan Militer Tudeh"
 PER_lobby_military_dissidents_desc: "Partai Tudeh mempunyai sejumlah anggota yang memegang jabatan penting di kalangan militer. Mungkin kita bisa mempengaruhi mereka untuk mencapai tujuan kita dan memanfaatkan mereka untuk melemahkan Shah ketika waktunya tepat."
 PER_promise_clergy_power: "Janji Kekuasaan Pendeta"
 PER_promise_clergy_power_desc: "Islam adalah landasan masyarakat bagi sebagian besar masyarakat kita. Oleh karena itu, kita tidak dapat berharap untuk mempertahankan dukungan masyarakat jika kita mulai merendahkan penganut agama tertentu dan harus berbuat lebih banyak untuk mempengaruhi mereka agar mendukung tujuan kita."
 PER_exclude_religion: "Kecualikan Agama"
 PER_exclude_religion_desc: "Islam dan agama secara lebih luas telah menjadi penghambat modernisasi bangsa kita baik secara politik maupun ekonomi. Kita harus memperjelas bahwa rintangan seperti itu akan diatasi dalam [ROOT.GetNonIdeologyName] yang baru."
 PER_stage_mass_protests: "Atur Protes"
 PER_stage_mass_protests_desc: "Rakyat sudah muak dengan alasan-alasan Shah dan kekuasaan elit yang mengakar. Kini saatnya kita turun ke jalan dan menuntut perubahan segera."
 PER_stage_mass_protests_tt: "Membuka keputusan §Y$PER_mass_protests$§! untuk menurunkan dukungan terhadap Shah."
 PER_constitutional_monarchy: "Memulihkan Batasan Konstitusional pada Shah"
 PER_constitutional_monarchy_desc: "Shah telah terlalu lama mendominasi politik negara, namun ketidakhadirannya akan mengganggu banyak orang yang masih percaya pada peran sucinya. Oleh karena itu, kami akan membatasi kemampuan Shah untuk mempengaruhi urusan politik dan menurunkan perannya hanya sekedar seremonial."
 PER_strengthen_iranian_parliament: "Memperkuat Parlemen Iran"
 PER_strengthen_iranian_parliament_desc: "Dengan kekuasaan Shah yang kini terkendali, kita dapat meningkatkan proses demokrasi kita dengan mengembalikan kekuasaan ke badan-badan parlemen terpilih, di mana mereka seharusnya berada."
 PER_strengthen_iranian_parliament_tt: "§RJika partai demokrasi mendapat dukungan kurang dari 30%, Syah akan melancarkan perang saudara melawan kami!§!\n\n§RJika perang saudara terjadi, maka Anda tidak akan dapat sepenuhnya mengikuti Revolusi Islam.§!"
 PER_continue_westernization: "Lanjutkan Westernisasi"
 PER_continue_westernization_desc: "Westernisasi selalu menjadi tujuan yang ada di benak para pemimpin kita. Banyak dari mereka yang ingin mengikuti jejak negara-negara besar di Barat, dengan mengadopsi ideologi dan praktik mereka. Jika kita ingin bergabung dengan mereka di masa depan, kita harus mempersiapkan integrasi tersebut sekarang."
 PER_royal_college_funding: "Mendirikan Universitas Teheran"
 PER_royal_college_funding_desc: "Sangat penting bagi kita untuk terus mengikuti perkembangan intelektual kita. Dengan menyalurkan sebagian dana yang kami ambil dari dompet Shah ke dalam institusi pendidikan, kami akan berada dalam posisi yang baik untuk mengikuti perkembangan kemajuan teknologi yang berubah dengan cepat."
 PER_expand_oil_production: "Memperluas Produksi Minyak"
 PER_expand_oil_production_desc: "[PER.GetNonIdeologyName] kaya akan minyak, dan kita bodoh jika tidak mengeksploitasinya demi keuntungan kita sendiri. Mari kita tingkatkan produksi minyak kita sehingga nanti kita bisa berada dalam posisi yang baik untuk bernegosiasi dengan Barat."
 PER_increase_oil_sales: "Meningkatkan Penjualan Minyak"
 PER_increase_oil_sales_desc: "Karena kami sudah bermitra dengan [ENG.GetNameDef] mengenai cadangan minyak kami, masuk akal untuk menggunakan sumber daya yang baru dipanen dan meningkatkan jumlah penjualan kami kepada mereka. Bagaimanapun, ini adalah kesepakatan yang saling menguntungkan."
 PER_request_membership_allies: "Minta Keanggotaan Sekutu"
 PER_request_membership_allies_desc: "Dengan meningkatnya ketegangan di seluruh dunia, inilah saatnya bagi kita untuk memilih pihak yang berpihak. Mengingat kita semakin dekat dengan teman-teman Barat, maka masuk akal bagi kita untuk menyelaraskan diri dengan mereka. Bersama-sama kita bisa membasmi ancaman fasisme di seluruh dunia."
 PER_secure_iraq: "Amankan Irak"
 PER_secure_iraq_desc: "Sebagai bagian dari tugas kita terhadap sekutu, kita harus berupaya mengamankan [IRQ.GetNameDef] melalui segala cara yang diperlukan. Langkah drastis ini untuk menjamin perlindungan masyarakat [IRQ.GetAdjective] dari segala ancaman eksternal, serta mendorong persatuan di kawasan."
 PER_secure_afghanistan: "Amankan Afganistan"
 PER_secure_afghanistan_desc: "[AFG.GetNameDefCap] adalah salah satu gerbang terbuka [PER.GetNameDef] ke timur. Mengamankan koridor ini bagi sekutu kita adalah hal yang paling penting. Hal ini juga akan memungkinkan kami untuk memastikan bahwa [AFG.GetNameDef] dapat dilindungi di bawah pengawasan kami. Ini demi kebaikan masyarakat [AFG.GetAdjective] tentunya."
 PER_post_war_spoils: "Rampasan Pasca Perang"
 PER_post_war_spoils_desc: "Kini setelah perang hampir berakhir, kita harus melakukan apa yang harus kita lakukan untuk melindungi [IRQ.GetNonIdeologyName] dan [AFG.GetNonIdeologyName]. Setelah mengajukan petisi kepada sekutu kami, kami memutuskan bahwa tindakan terbaik adalah mengintegrasikan wilayah-wilayah ini ke dalam pemerintahan [PER.GetNameDef]. Dengan begitu, kita bisa memastikan Timur Tengah lebih kuat dan stabil."
 PER_follow_the_tudeh: "Rapat Umum di Sekitar Pesta Tudeh"
 PER_follow_the_tudeh_desc: "Partai Tudeh adalah satu-satunya partai yang merangkum keinginan masyarakat untuk melakukan perubahan radikal, bukan hanya sekedar window dressing demokratis dari rezim saat ini. Oleh karena itu, kita harus mendukung mereka sebagai jantung gerakan radikal."
 PER_rally_behind_mosaddegh: "Reli Di Belakang Mosaddegh"
 PER_rally_behind_mosaddegh_desc: "Sejak awal rezim Pahlavi, Mohammad Mosaddegh diketahui tidak setuju dengan banyak aspek pemerintahan Shah. Jika kita benar-benar ingin melawan Dinasti Pahlavi dan menciptakan [PER.GetNonIdeologyName] baru yang lebih demokratis, mungkin dialah yang akan mendukung gerakan kita."
 PER_reach_to_seperatists: "Jangkau Separatis"
 PER_reach_to_seperatists_desc: "Kelas pekerja belum sepenuhnya bisa menerima kondisi sosio-ekonomi mereka dan oleh karena itu tidak memiliki kekuatan untuk mengatasi kekuasaan Shah yang sudah mengakar. Namun, ada banyak orang di wilayah utara dan timur yang tergerak oleh sentimen Azerbaijan atau Kurdi yang mungkin terpengaruh oleh perjuangan kami."
 PER_reach_to_seperatists_tt: "Semua negara bagian yang merupakan inti dari §YKurdistan§! atau §YAzerbaijan§! akan bergabung dengan kami dan menyediakan pasukan dalam perang saudara yang akan datang.\n\n§RNamun, mereka berharap memperoleh kemandirian sebagai kompensasi dalam waktu dua tahun setelah menyelesaikan fokus ini!§!"
 PER_embrace_national_front: "Menuju Republik"
 PER_embrace_national_front_desc: "Kekuasaan politik dan pengambilan keputusan tidak bisa lagi terkonsentrasi di tangan Syah atau penerusnya yang tidak dipilih dan tidak dapat dipertanggungjawabkan. Kita harus menyingkirkan seluruh institusi dan bergerak menuju pembentukan Republik [ROOT.GetAdjective]."
 PER_force_abdication: "Pengunduran Diri Secara Paksa"
 PER_force_abdication_desc: "Shah dan kroni-kroninya terguncang oleh perbedaan pendapat massal di kalangan masyarakat. Sekarang adalah saat yang tepat untuk memanfaatkan keunggulan kita dan memaksanya turun tahta sehingga kita akhirnya bisa menghentikan omong kosong feodal ini, untuk selamanya."
 PER_force_abdication_tt: "§RJika partai non-blok mendapat lebih dari 50% dukungan, Shah akan melancarkan perang saudara melawan kami!§!"
 PER_nationalize_oil_fields: "Nasionalisasi Ladang Minyak"
 PER_nationalize_oil_fields_desc: "Kita telah menghabiskan waktu bertahun-tahun memperdagangkan minyak kita melalui perjanjian yang tidak adil dengan negara-negara rakus. Sudah waktunya bagi [PER.GetNameDef] untuk menasionalisasi produksi minyaknya, yang berarti kita pada akhirnya akan memiliki kendali penuh atas sumber daya alam kita sendiri."
 PER_free_elections: "Pemilu Bebas"
 PER_free_elections_desc: "Dengan terbentuknya pemerintahan kita yang baru dan diciptakan kembali, inilah saatnya bagi kita untuk memutuskan siapa yang akan menjadi Perdana Menteri untuk memimpin [PER.GetNameDef] menuju masa keemasan demokrasi!"
 PER_free_elections_tt: "Akan memungkinkan Anda memilih §Ykandidat§! mana yang paling cocok untuk memimpin §Ydemokratis [PER.GetNonIdeologyName].§!"
 PER_united_progressive_parties: "Partai Progresif Bersatu"
 PER_united_progressive_parties_desc: "Dengan turunnya Shah, kita memiliki peluang untuk membangun masa depan yang lebih progresif untuk [ROOT.GetNonIdeologyName]. Namun untuk melakukan hal tersebut, kita harus mendapat dukungan dari semua partai progresif dalam satu koalisi besar yang dapat mewujudkan agenda kita."
 PER_strengthen_the_tudeh: "Perkuat Partai Tudeh"
 PER_strengthen_the_tudeh_desc: "Partai Tudeh telah menjadi garda depan kelas pekerja [ROOT.GetAdjective], memimpin mereka menuju kemenangan atas Shah. Kini mereka harus diberi kewenangan untuk melaksanakan sosialisme dan membebaskan rakyat dari belenggu imperialisme dan kapitalisme."
 PER_soviet_alignment: "Penyelarasan Soviet"
 PER_soviet_alignment_desc: "Dunia berubah dengan cepat dan kita memerlukan sekutu yang kuat untuk menghalangi musuh kita. Partai Tudeh adalah satu-satunya partai sosialis yang memiliki ikatan dengan [SOU.GetNameDef] dan dengan demikian, dapat membina hubungan yang kuat dengan mereka."
 PER_soviet_alignment_tt: "Jika §Y[SOV.GetNameWithFlag]§! adalah komunis, mereka akan diundang ke faksi kami."
 PER_industrial_aid: "Bantuan Industri"
 PER_industrial_aid_desc: "Rekan-rekan kita di [SOU.GetNameDef] telah menunjukkan bahwa perekonomian yang didominasi pertanian dapat diindustrialisasi dengan cepat melalui perencanaan yang cermat. Kita harus menghubungi mereka dan melihat apakah mereka bersedia berbagi keahlian mengenai masalah ini."
 PER_workers_army: "Tentara Rakyat"
 PER_workers_army_desc: "Tentara dipenuhi oleh orang-orang fanatik kontra-revolusioner yang menunggu kesempatan untuk mengembalikan pandangan kuno mereka terhadap bangsa. Kita harus mereformasi angkatan bersenjata untuk mencegah hal ini terjadi, dimulai dengan mengusir kaum reaksioner."
 PER_elevate_the_iran_party: "Tinggikan Partai Iran"
 PER_elevate_the_iran_party_desc: "Partai Tudeh akan mengikat negara kita pada [SOU.GetNameDef], menerima perintah dari [SOU.Capital.GetCapitalVictoryPointName]. Oleh karena itu, semua kaum progresif harus mendukung Partai Iran jika kita ingin mempunyai harapan untuk membangun jalan Iran menuju sosialisme."
 PER_iranian_socialism: "Sosialisme Iran"
 PER_iranian_socialism_desc: "Untuk menjamin keamanan negara dalam jangka panjang, kita harus membentuk aliansi baru dengan pemerintah yang berpikiran sama di seluruh wilayah."
 PER_iranian_industrialization: "Industrialisasi"
 PER_iranian_industrialization_desc: "Kami tidak akan bergantung pada kekuatan asing untuk memodernisasi perekonomian kami. Sebaliknya, kita harus memanfaatkan potensi masyarakat kita yang belum dimanfaatkan dan menemukan jalan kita sendiri menuju modernisasi."
 PER_international_solidarity: "Solidaritas Internasional"
 PER_international_solidarity_desc: "Meskipun kita telah melepaskan belenggu imperialis di dalam wilayah kita, kita tidak akan benar-benar bebas sampai kekuatan-kekuatan imperialis dicopot dari wilayah kita. Tapi kami belum siap untuk konfrontasi penuh. Oleh karena itu, kita akan mulai melemahkan kepemilikan mereka."
 PER_appease_the_seperatists: "Tenangkan Kaum Separatis"
 PER_appease_the_seperatists_desc: "Sudah waktunya untuk memenuhi kewajiban kita terhadap penduduk Azerbaijan dan Kurdi dengan memberi mereka otonomi yang lebih besar atas urusan mereka sendiri. Namun, kita harus bekerja keras untuk menjaga mereka tetap berada dalam lingkup pengaruh kita demi kepentingan keamanan kolektif kita."
 PER_appease_the_seperatists_tt: "§GKami tidak lagi menghadapi risiko pecahnya perang kemerdekaan terhadap kami.§!"
 PER_communist_industrialization: "Komite Perencanaan Ekonomi"
 PER_communist_industrialization_desc: "Kita akan membentuk departemen baru untuk mengawasi perluasan dan modernisasi perekonomian, bebas dari bias dan kelambanan departemen ekonomi sebelumnya."
 PER_communist_education_reform: "Perluas Sistem Pendidikan"
 PER_communist_education_reform_desc: "Sistem pendidikan kita sudah kuno dan gagal memenuhi kebutuhan negara. Kita perlu memasukkan lebih banyak anak ke dalam kelas dan meminta mereka meninggalkan sekolah dengan lebih banyak keterampilan praktis yang dapat mereka gunakan dalam dunia kerja."
 PER_reject_foreign_dominance: "Tolak Dominasi Asing"
 PER_reject_foreign_dominance_desc: "[SOU.GetNameDefCap] dan [ENG.GetNameDef] keduanya berdiri tepat di depan pintu rumah kami. Jelas bahwa kita bisa menjadi subjek jika kita tidak segera bertindak. Sudah waktunya kita keluar dari pasir dan mulai melawan gerakan Permainan Hebat."
 PER_iranian_revolutionary_vanguard: "Pelopor Revolusi Iran"
 PER_iranian_revolutionary_vanguard_desc: "Untuk bertahan melawan negara adidaya yang jauh lebih kuat dari kita, kita harus mulai memperluas militer dan memobilisasi penduduk. Meskipun hal ini tidak akan menempatkan kita sejajar dengan ancaman-ancaman tersebut, hal ini akan menjadikan kita lebih dari sekedar penghalang dalam menghadapi ancaman-ancaman tersebut."
 PER_vanguard_template_tt: "Membuat Templat Divisi Artileri §Y§!."
 PER_one_for_all_all_for_one: "Satu untuk Semua, Semua untuk Satu"
 PER_one_for_all_all_for_one_desc: "Setiap [PER.GetAdjective] harus terlatih sepenuhnya dengan senjata dan siap membela rakyatnya jika saatnya tiba. Tidak ada seorang pun yang bebas dari tugas ini, satu-satunya kesempatan yang kita miliki untuk bertahan dalam The Great Game dan mempertahankan identitas Iran kita adalah dengan mulai melakukan mobilisasi dengan kecepatan yang [ENG.GetNameDefCap] dan [SOU.GetNameDef] tidak dapat mengimbanginya."
 PER_comintern_research_collaboration: "Kerjasama Penelitian Komintern"
 PER_comintern_research_collaboration_desc: "[SOU.GetNameDefCap] adalah salah satu pemimpin dunia dalam sains & penelitian. Dengan terjalinnya aliansi dengan mereka, kini kami memiliki peluang menarik untuk mengirimkan ilmuwan kami untuk belajar dari ilmuwan [SOU.GetAdjective] terkemuka dan membawa pulang pengetahuan & keterampilan [SOU.GetAdjective] bersama mereka."
 PER_land_reform: "Reformasi Pertanahan"
 PER_land_reform_desc: "Dengan keberhasilan revolusi, kita akan memberlakukan reformasi pertanahan yang luas yang akan membebaskan perekonomian dari belenggu feodalisme."
 PER_soviet_iranian_oil_collaboration: "Kolaborasi Minyak Soviet-Iran"
 PER_soviet_iranian_oil_collaboration_desc: "[ROOT.GetNameDefCap] dan teman-teman kami di seberang perbatasan di [SOU.GetNameDef] memiliki cadangan minyak yang sangat besar yang kami miliki. Dengan mengoordinasikan dan memperluas produksi minyak, kita dapat mengamankan sumber daya paling penting di dunia ini."
 PER_iranian_nuclear_program: "[ROOT.GetAdjective] Program Nuklir"
 PER_iranian_nuclear_program_desc: "Memulai program senjata atom kita sendiri merupakan sebuah langkah penting bagi kita untuk beralih dari negara yang lemah dan tidak berarti, menuju kekuatan dunia yang kuat seperti yang ditakdirkan oleh [ROOT.GetNameDef]."
 PER_iranian_culture: "Satukan Ultra-Nasionalis"
 PER_iranian_culture_desc: "Terlepas dari semua retorika yang dilontarkan para politisi dan Shah, tidak satupun dari mereka bersedia melakukan apa yang diperlukan untuk melindungi warisan budaya dan integritas wilayah kita. Kami akan menyatukan para penulis dan nasionalis yang berbeda ke dalam gerakan politik baru yang akan mengembalikan kejayaan bangsa."
 PER_ally_the_bazaari: "Goyangkan Elit"
 PER_ally_the_bazaari_desc: "Ada keresahan yang semakin besar di kalangan elit [PER.GetAdjective] mengenai arah negara. Banyak di antara mereka yang merasa khawatir akan masa depan bisnis atau aset mereka dan mungkin bersedia mendukung perjuangan kita dengan imbalan jaminan untuk melindungi mereka dari guncangan politik."
 PER_brown_shirts: "Pawai Shocktrooper"
 PER_brown_shirts_desc: "Banyak anggota partai kami yang baru-baru ini mengadopsi seragam gerakan fasis Eropa dengan kemeja coklat. Mungkin kita harus menyalurkan para anggota yang berdedikasi ini ke dalam pengorganisasian demonstrasi massal untuk menggalang dukungan bagi gerakan tersebut."
 PER_march_on_saadabad: "Berbaris Di Saadabad"
 PER_march_on_saadabad_desc: "Rezim telah gagal mengatasi keluhan kami, oleh karena itu kami akan bergerak ke kompleks Sa'dabad dan memberikan ultimatum kepada Shah. Entah mematuhi perubahan arah dan tetap berdaulat, atau menghadapi kemarahan gerakan kita."
 PER_roll_back_reforms: "Memulihkan Bangsa"
 PER_roll_back_reforms_desc: "Meskipun Shah mencapai beberapa kemajuan dalam memodernisasi negaranya, reformasi yang dilakukan tidak cukup berhasil. Kita akan mengejar agenda yang lebih mendalam dan radikal yang akan mengembalikan kita pada kejayaan."
 PER_fascist_secularism: "Tegakkan Sekularisme"
 PER_fascist_secularism_desc: "Konversi paksa Kekaisaran Persia ke Islam menghancurkan kebudayaan kita yang dulunya besar. Kita harus kembali ke akar kita dan menolak agama asing ini dari seluruh aspek kehidupan masyarakat dengan menegakkan kode sekularisme yang ketat."
 PER_form_savama: "Bentuk Polisi Rahasia"
 PER_form_savama_desc: "Para pengkhianat yang telah meninggalkan budaya kita atau bekerja sebagai agen kekuatan asing harus dibasmi sesegera mungkin. Untuk itu, kami akan membentuk pasukan polisi khusus baru untuk melakukan hal tersebut."
 PER_fascist_reach_out_to_germany: "Lihatlah ke Barat"
 PER_fascist_reach_out_to_germany_desc: "Karena keterlibatan kita dalam beberapa bentuk konflik global tampaknya semakin mungkin terjadi, mungkin kita harus menyelaraskan diri dengan rezim yang berpikiran sama seperti [GER.GetNameDef]."
 PER_fascist_reach_out_to_japan: "Lihatlah ke Timur"
 PER_fascist_reach_out_to_japan_desc: "[JAP.GetAdjective] mengetahui perjuangan memodernisasi bangsanya sekaligus melindungi budayanya dari kekuatan korosif westernisasi. Kita harus menyelaraskan diri dengan mereka untuk mematahkan cengkeraman Barat terhadap kekuatan global."
 PER_pan_iranianism: "Pan-Iranisme"
 PER_pan_iranianism_desc: "Masih ada kelompok masyarakat Iran yang tersebar di luar perbatasan kita, sebuah situasi yang tidak bisa dibiarkan terus berlanjut. Saatnya telah tiba untuk mempromosikan identitas Iran yang lebih besar dan mulai mempromosikan unifikasi rakyat kita."
 PER_anti_soviet_resistance_network: "Resistensi Anti-[SOU.GetAdjective]"
 PER_anti_soviet_resistance_network_desc: "Mereka dapat mendandaninya sesuka mereka, namun kenyataannya [SOU.GetNameDef] hanyalah sebuah Kekaisaran Rusia dan banyak masyarakat Iran yang masih terjebak di bawah kekuasaan mereka yang lalim. Kita harus berbuat lebih banyak untuk melemahkan otoritas mereka dan mendorong pembebasan rakyat kita."
 PER_intervene_in_central_asia: "Melindungi Diaspora Iran Raya"
 PER_intervene_in_central_asia_desc: "Kami telah melunakkan kendali [SOU.GetAdjective] atas Asia Tengah. Selain itu, perhatian mereka terganggu oleh konflik di seluruh dunia. Oleh karena itu, kita harus menggunakan momen ini untuk mengusir mereka dari wilayah tersebut untuk selamanya."
 PER_proclaim_greater_iran: "Proklamasikan Iran Raya"
 PER_proclaim_greater_iran_desc: "Perbatasan kami telah dikembalikan ke posisi semula di semua lini dan kami telah membebaskan rakyat kami dari tirani pemerintahan asing. Sekarang kita akhirnya bisa mendeklarasikan lahirnya Iran Raya yang akan bertahan dalam ujian waktu."
 PER_fascist_attack_turkey: "Kurangi Ancaman [TUR.GetAdjective]"
 PER_fascist_attack_turkey_desc: "[TUR.GetAdjective] dan para pendahulu Ottoman mereka telah lama menggerogoti perbatasan kita dan merusak budaya kita, sambil menduduki tanah yang menjadi hak rakyat kita. Kita harus memperbaiki ketidakadilan historis ini."
 PER_intervention_in_iraq: "Intervensi Dalam [IRQ.GetNonIdeologyName]"
 PER_intervention_in_iraq_desc: "[IRQ.GetNonIdeologyName] hanyalah hasil konstruksi imperialis Barat yang menggambarkan batas negara pada peta. Bangsa seperti ini tidak dapat dipertahankan dan harus dikembalikan kepada pemiliknya yang sah, yaitu kita."
 PER_crush_saudi_arabia: "Integrasi Ekonomi Perang"
 PER_crush_saudi_arabia_desc: "Penaklukan kami baru-baru ini telah memberi kami banyak peralatan dan personel industri yang dapat dikirim pulang untuk digunakan di sana. Meski dibutuhkan sejumlah besar kereta api untuk melaksanakan tugas tersebut."
 PER_fascist_attack_afghanistan: "Hadapi Afghanistan"
 PER_fascist_attack_afghanistan_desc: "Populasi Iran yang cukup besar terjebak di luar perbatasan kami di bawah kendali suku Pashtun di [AFG.Capital.GetCapitalVictoryPointName]. Penghinaan terhadap integritas wilayah kami tidak akan ditoleransi lagi."
 PER_modify_opposition_tt: "Ubah §Y$PER_opposition_modifier$§! dengan:"
 PER_communist_afghanistan_intervention: "Ganggu Permainan Hebat"
 PER_communist_afghanistan_intervention_desc: "[ENG.GetAdjective] dan [SOU.GetAdjective] telah bertengkar mengenai status [AFG.GetNonIdeologyName] selama hampir satu abad. Kita akan mengganggu keseimbangan yang menguntungkan kita dengan menempatkan rezim komunis berkuasa di sana."
 PER_communist_liberate_pashtuns: "Mendukung Nasionalisme Pashtun"
 PER_communist_liberate_pashtuns_desc: "Dengan [AFG.GetNonIdeologyName] yang aman dalam lingkup pengaruh kita, kita dapat menggoyahkan wilayah perbatasan [ENG.GetAdjective] dengan mempromosikan nasionalisme Pashtun yang lebih besar di seluruh wilayah tersebut."
 PER_communist_liberate_pashtuns_tt: "Buka lebih banyak keputusan §Y$PER_gulf_decisions_cat$§! untuk mendorong perlawanan terhadap kekuatan kolonial di sepanjang perbatasan Afghanistan-Iran."
 PER_communist_destabilize_iraq: "Menggoyahkan Irak Utara"
 PER_communist_destabilize_iraq_desc: "[ENG.GetAdjective] bergantung pada minyak yang mengalir dari [IRQ.GetNonIdeologyName], kita dapat melemahkan akses mereka terhadap minyak tersebut dengan mendorong pemberontakan Kurdi di bagian utara negara tersebut dan menyelaraskan mereka dengan diri kita sendiri."
 PER_communist_destabilize_iraq_tt: "Buka keputusan §Y$PER_gulf_decisions_cat$§! untuk mendorong pemberontakan Kurdi."
 PER_communist_kurdish_uprising: "Siapkan Pemberontakan Kurdi"
 PER_communist_kurdish_uprising_desc: "TODO"
 PER_revolution_in_the_gulf: "Revolusi di Teluk"
 PER_revolution_in_the_gulf_desc: "Keseimbangan kekuatan di kawasan ini kini semakin menguntungkan kita. Kita harus memanfaatkan keunggulan kita dan mulai mempromosikan gerakan anti-kolonial yang lebih besar di seluruh kawasan."
 PER_revolution_in_the_gulf_tt: "Membuka lebih banyak keputusan §Y$PER_gulf_decisions_cat$§! untuk mendorong perlawanan di negara-negara Teluk Persia yang diduduki."
 PER_hormuz_crisis: "Krisis Hormuz"
 PER_hormuz_crisis_desc: "Kaum imperialis berada dalam posisi yang tidak menguntungkan, sekaranglah waktunya untuk memaksa mereka keluar dari wilayah tersebut dengan ancaman serangan dari semua lini. Kami akan memulai prosesnya dengan memblokade Selat Hormuz terhadap pelayaran kekaisaran."
 PER_hormuz_crisis_tt: "§YSetiap kekuatan kolonial di Arab atau Teluk Persia akan menerima peristiwa untuk menarik diri dari wilayah di wilayah tersebut. Jika mereka menolak, kami mempunyai kesempatan untuk menyatakan perang terhadap mereka.§!"
 PER_communist_gulf_hegemony: "Hegemoni Teluk Persia"
 PER_communist_gulf_hegemony_desc: "Kita telah mencapai apa yang tampaknya mustahil, yaitu pengusiran kekuatan kekaisaran dari Teluk Persia. Kini, kami secara de facto merupakan kekuatan besar di kawasan ini dan dapat mulai menegaskan pengaruh kami tanpa campur tangan pihak luar."
 PER_communist_propaganda: "Radio Nasional Iran"
 PER_communist_propaganda_desc: "Menasionalisasi stasiun-stasiun radio menjadi satu lembaga penyiaran publik akan memungkinkan kita membangun cara untuk dengan cepat mempengaruhi opini publik mengenai hal-hal yang tidak sepenuhnya selaras dengan kepentingan negara."
 PER_communist_propaganda_tt: "Buka keputusan §Y$PER_national_iranian_radio$§! untuk meningkatkan stabilitas, dukungan perang, dan popularitas partai."
 PER_the_new_economy: "Perekonomian Baru"
 PER_the_new_economy_desc: "Perekonomian baru, yang berdasarkan pada kebutuhan masyarakat dan bukan berdasarkan keinginan pasar, akhirnya mulai muncul setelah reformasi yang kita lakukan. Meskipun masih ada pekerjaan yang harus diselesaikan, kami dapat mengatakan bahwa kami sedang membangun sosialisme di [ROOT.GetNameDef]."
 PER_oil_and_rubber_industry: "Diversifikasi Industri"
 PER_oil_and_rubber_industry_desc: "Meskipun negara kita memiliki cadangan minyak yang sangat besar yang belum dimanfaatkan, kita harus menghindari membiarkan perekonomian kita sepenuhnya bergantung pada pengiriman minyak ke tempat lain. Oleh karena itu, kita harus melakukan diversifikasi industri untuk menghasilkan produk yang layak dikonsumsi di dalam negeri."
 PER_the_peoples_airforce: "Angkatan Udara Revolusioner Rakyat"
 PER_the_peoples_airforce_desc: "Jika kita ingin menjadikan diri kita sebagai kekuatan regional, kita perlu menegaskan kendali atas Teluk Persia. Untuk melakukan hal ini, kita akan mulai membangun angkatan udara rakyat untuk mengatasi dominasi angkatan laut negara-negara imperial."
 PER_communist_air_defense: "Inisiatif Pertahanan Udara"
 PER_communist_air_defense_desc: "Kita tidak boleh membiarkan semua yang kita bangun dihancurkan dari udara oleh kekuatan kekaisaran. Oleh karena itu kami akan membangun serangkaian pertahanan anti-udara di seluruh negeri."
 PER_communist_basic_plane_design: "Kolaborasi Angkatan Udara"
 PER_communist_basic_plane_design_desc: "Reformasi angkatan udara kita dimulai dengan baik, sekarang kita harus fokus pada pengembangan teknologi dan keterampilan yang relevan untuk digunakan di kapal laut. Mungkin kita bisa mempercepat proses ini dengan bantuan kawan-kawan kita di luar negeri."
 PER_communist_naval_bomber_design: "[SOU.GetAdjective]-[ROOT.GetAdjective] Desain Pembom"
 PER_communist_naval_bomber_design_desc: "Dengan bantuan teman-teman [SOU.GetAdjective] kami, kami hampir siap untuk mengerahkan kekuatan pembom angkatan laut yang akan menghancurkan angkatan laut mana pun yang cukup bodoh untuk berlayar ke Teluk Persia tanpa persetujuan kami."
 PER_challenge_the_royal_navy: "Tantang Armada Inggris"
 PER_challenge_the_royal_navy_desc: "Kita sekarang memiliki teknologi dan pengetahuan teoretis untuk menghadapi musuh besar kita. Namun, kami kekurangan pengalaman nyata yang diperlukan untuk mewujudkannya. Mungkinkah kita bisa mengumpulkan pengetahuan melalui provokasi skala kecil di Teluk?"
 PER_the_peoples_navy: "Angkatan Laut Revolusioner Rakyat"
 PER_the_peoples_navy_desc: "Meskipun kita tidak dapat berharap untuk menantang armada permukaan negara-negara imperial di permukaan, kita dapat melakukannya dengan mengembangkan kapal selam kelas yang dibuat khusus."
 PER_communist_shore_defense: "Inisiatif Pertahanan Pesisir"
 PER_communist_shore_defense_desc: "Mempertahankan serangkaian pertahanan angkatan laut yang kuat di sepanjang pantai kita akan sangat membantu dalam mencegah calon agresor mendarat di pantai kita."
 PER_communist_naval_designs: "Kolaborasi Angkatan Laut"
 PER_communist_naval_designs_desc: "Kita mengalami kemajuan dalam reformasi angkatan laut, namun kita perlu melipatgandakan upaya kita dan mulai mengembangkan teknologi kapal selam. Mungkin rekan-rekan kami di tempat lain bersedia membantu kami dalam upaya ini?"
 PER_communist_submarine_design: "[SOU.GetAdjective]-[ROOT.GetAdjective] Pengembangan Kapal Selam"
 PER_communist_submarine_design_desc: "Bersama dengan rekan-rekan [SOU.GetAdjective] kami, kami hampir mengembangkan kapal selam canggih yang memungkinkan kami mendominasi Teluk Persia."
 PER_eastern_expansion: "Ekspansi Timur"
 PER_eastern_expansion_desc: "Dunia telah berubah secara drastis dalam beberapa tahun terakhir dan rezim-rezim di wilayah Timur masih rapuh dan rentan runtuh. Kita mungkin tidak akan pernah mendapat kesempatan lagi untuk mengintegrasikan mereka ke dalam wilayah pengaruh kita."
 PER_curtail_pan_arabism: "Batasi Pan-Arabisme"
 PER_curtail_pan_arabism_desc: "Masyarakat Arab di Timur Tengah dan Afrika Utara semakin mengadopsi rasa solidaritas Pan-Arab. Kita tidak bisa membiarkan mereka menjadi kekuatan yang bersatu di depan pintu kita dan oleh karena itu kita harus melakukan serangan terlebih dahulu untuk mencegah hal tersebut terjadi."
 PER_there_can_be_only_one: "Hanya Ada Satu"
 PER_there_can_be_only_one_desc: "Meskipun kita mungkin menganut nilai-nilai yang sama dengan [GER.GetNameDef], semakin jelas bahwa mereka memandang diri mereka lebih unggul dibandingkan semua bangsa di dunia. Ini merupakan penghinaan terhadap masyarakat dan warisan kita dan kita harus memperbaiki kesalahpahaman mereka dengan kekerasan."
 PER_iran_first: "[ROOT.GetNonIdeologyName] Pertama"
 PER_iran_first_desc: "Tidak seorang pun kecuali rakyat Iran sendiri yang dapat melindungi nilai-nilai dan budaya kami dengan baik. Oleh karena itu, kita akan mengejar tujuan kita sendiri dan mengarahkan dunia sesuai keinginan kita."
 PER_propagate_political_literature: "Bentuk Kelompok Oposisi Lokal"
 PER_propagate_political_literature_desc: "Institusi-institusi negara imperial mungkin tampak tidak dapat diatasi oleh individu, namun kenyataannya adalah bahwa sumber dayanya tersebar di seluruh negara dan tidak dapat mengatasi gerakan perlawanan yang terdesentralisasi. Untuk melakukan perubahan, kita harus memanfaatkan kelemahan ini."
 PER_propagate_political_literature_tt: "Membuka keputusan §Y$PER_mass_protests$§! untuk membentuk kelompok oposisi di negara-negara bagian sehingga mereka tidak akan bergabung dengan Shah dalam potensi §Rperang saudara§!."
 PER_brown_shirts_tt: "§YKami akan mendapatkan [?ROOT.PER_fascist_militia_count] divisi milisi saat memasuki perang saudara melawan Shah atau saat menjadi fasis.§!"
 PER_rally_the_reformers_tt: "Buka keputusan §Y$PER_mass_protests$§! untuk membangun basis operasi bagi gerakan oposisi kita."
 PER_fascism_sway_the_rich_idea_tt: "Ketika perang saudara dimulai, atau gerakan fasis mengambil alih kekuasaan, kita akan memperoleh gagasan berikut:"
 PER_finding_a_shah: "Menemukan Shah"
 PER_finding_a_shah_desc: "Dengan kekalahan dinasti Pahlavi, kita memiliki kesempatan untuk melantik Syah yang lebih patuh pada Tahta Matahari yang akan mengikuti dewan bijaksana dari para penasihat terpercaya mereka."
 PER_finding_a_shah_tt: "Kita bisa memilih siapa yang akan menjadi Shah baru [ROOT.GetNameDef] di acara berikutnya."
 PER_form_sumka: "Formulir SUMKA"
 PER_form_sumka_desc: "Davud Monshizadeh baru-baru ini menghabiskan waktu di [GER.GetNameDef] dan menjadi akrab dengan gerakan Sosialis Nasional di sana. Kini nampaknya dia siap untuk kembali ke Iran untuk memanfaatkan gelombang nasionalisme yang ada saat ini sehingga dia dapat mengantarkan tatanan baru di Iran."
 PER_form_arya_party: "Bentuk Partai Arya"
 PER_form_arya_party_desc: "Hasan Arfa telah menjadi perwira militer yang setia dan pembela Shah yang gigih sebagai cerminan Tuhan sendiri. Namun, ia mungkin dapat memanfaatkan meningkatnya sentimen nasionalis untuk melakukan reformasi radikal di negara ini bahkan melampaui impian terliar Shah."
 PER_iranian_socialist_revolution: "Revolusi Sosialis Iran"
 PER_iranian_socialist_revolution_desc: "Saatnya telah tiba bagi kelas pekerja Iran untuk bangkit dan menghancurkan rezim Shahis yang lemah dan para pendukung borjuisnya. Sebagai gantinya akan muncul sebuah negara buruh dan tani baru yang dijalankan oleh rakyat sendiri."
 PER_iranian_socialist_revolution_tt: "§RJika partai komunis mendapat dukungan kurang dari 50%, Shah akan melancarkan perang saudara melawan kami!§!"
 PER_islamic_restoration: "Tolak Gharbzadegi"
 PER_islamic_restoration_desc: "Semangat westernisasi baru-baru ini mengikis fondasi budaya Islam dan masyarakat Iran secara keseluruhan. Oleh karena itu, pemerintah harus berbuat lebih banyak untuk membatasi akses terhadap sifat buruk barat dan ideologi mereka yang tidak beriman."
 PER_ally_bazaari: "Sekutu Bazaari"
 PER_ally_bazaari_desc: "Bazaar dan pedagang yang mengoperasikannya telah menjadi pilar komunitas kita selama berabad-abad. Kini, mereka menghadapi tekanan yang semakin besar dari perusahaan multinasional negara-negara industri. Jika kita menerapkan kebijakan untuk melindungi para pedagang, kemungkinan besar mereka akan mendukung perjuangan konservatif kita."
 PER_islamic_solidarity: "Persaudaraan Islam"
 PER_islamic_solidarity_desc: "Meskipun kita mungkin tidak selalu sepakat dengan denominasi di luar Islam Syiah, kita tidak dapat menyangkal bahwa kita semua memiliki musuh yang sama yaitu kekuatan imperialis di Eropa Barat yang terus mencampuri urusan nasional kita. Namun bersama-sama, kami akan mengusir mereka dari tanah kami untuk selamanya."
 PER_promote_resistance_levant: "Perlawanan Anti-Imperialis"
 PER_promote_resistance_levant_desc: "Upaya kita untuk menghadapi kaum imperialis seringkali menemui perlawanan keras karena kekuatan mereka yang sangat besar. Namun, tidak ada kekurangan orang yang dengan senang hati mengangkat senjata di belakang garis musuh."
 PER_entice_foreign_investment: "Menarik Investasi Asing"
 PER_entice_foreign_investment_desc: "Perekonomian kita memiliki potensi pertumbuhan yang sangat besar karena melimpahnya sumber daya alam dan meningkatnya jumlah penduduk perkotaan yang mencari pekerjaan. Namun, kita memerlukan investasi yang lebih besar dari luar negeri untuk memulai pertumbuhan tersebut."
 PER_increase_faculty_staffing_budget: "Meningkatkan Anggaran Kepegawaian"
 PER_increase_faculty_staffing_budget_desc: "Jika kita ingin mempertahankan kecanggihan teknologi dan tidak ketinggalan, kita harus memastikan untuk menarik orang-orang paling cerdas yang ditawarkan negara kita. Biayanya mungkin tinggi, namun dampak stagnasi teknologi akan lebih tinggi."
 PER_increase_faculty_staffing_budget_tt: "Ubah §Y$PER_technological_modifier$§! dengan:"
 PER_invest_in_univerity_facilities: "Berinvestasi dalam Fasilitas Universitas"
 PER_invest_in_univerity_facilities_desc: "Jika kita ingin bersaing secara teknologi, kita harus memperhatikan fasilitas yang tersedia bagi mahasiswa, dosen, dan ilmuwan. Kita tidak bisa membiarkan pikiran kita yang paling cemerlang dibatasi oleh rintangan yang sia-sia seperti kurangnya peralatan yang memadai."
 PER_islamic_revolution: "Revolusi Islam"
 PER_islamic_revolution_desc: "Hari-hari Shah tinggal menghitung hari. Masjid-masjid bergema dengan seruan perubahan, dan jalanan tidak lagi menjadi kendalinya. Tatanan lama akan runtuh."
 PER_reinstate_qajars: "Kembalikan Dinasti Qajar"
 PER_reinstate_qajars_desc: "Dinasti Qajar adalah keluarga penguasa terakhir [PER.GetNameDef] sebelum pemerintahan keluarga Pahlavi. Setelah digulingkan pada tahun 1925 oleh Reza Shah Pahlavi sendiri, Dugaan Pewaris keluarga, Mohammad Hassan Mirza telah diasingkan di [ENG.GetNameDef]. Karena Pahlavi tidak mampu mempertahankan kepentingan [ENG.GetAdjective] di [PER.GetNameDef], mungkin ini saatnya untuk mengembalikan Qajars dan berharap hal ini akan menyenangkan penguasa baru kita."
 PER_secularize_the_state: "Sekularisasi Negara"
 PER_secularize_the_state_desc: "Sejak kami mulai mendorong westernisasi, selalu ada penolakan terhadap ulama di [PER.GetNameDef]. Islam tetap menjadi agama negara kita, namun dalam upaya membuktikan kepada dunia Barat bahwa kita mampu berdiri di tengah mereka, sudah saatnya kita memisahkan agama dari negara dan menempuh jalur modernisasi."
 ################
 ##### IRAQ #####
 ################
 IRQ_decouple_from_the_pound: "Pisahkan dari Pound"
 IRQ_decouple_from_the_pound_desc: "Mata uang kita tetap terikat pada Poundsterling Inggris, yang membatasi kemampuan kita untuk menerapkan kebijakan ekonomi yang sesuai dengan kebutuhan kita. Kita harus memutuskan hubungan dan membentuk dewan mata uang kita sendiri untuk mengendalikan dinar."
 IRQ_construct_the_kut_barrage: "Bangun Rentetan Kut"
 IRQ_construct_the_kut_barrage_desc: "Kemunduran yang terjadi baru-baru ini dalam pembangunan Bendungan Kut harus diatasi sesegera mungkin jika kita ingin menjaga pasokan air yang cukup untuk irigasi di sepanjang sungai Tigris."
 IRQ_strengthen_mesopotamian_farming: "Memperkuat Pertanian Mesopotamia"
 IRQ_strengthen_mesopotamian_farming_desc: "Seperti banyak pendahulunya, [ROOT.GetNonIdeologyName] berpusat pada dua sungai besar, Tigris dan Efrat. Lahan di antara sungai-sungai ini ideal untuk pertanian, namun mungkin ada teknik modern yang bisa kita gunakan untuk meningkatkan hasil panen."
 IRQ_extensive_irrigation_projects: "Proyek Irigasi yang Luas"
 IRQ_extensive_irrigation_projects_desc: "Sebagian besar lahan kami gersang dan tidak cocok untuk pertanian. Namun, melalui proyek irigasi besar-besaran, kita mungkin bisa mengubah wilayah tersebut menjadi ladang subur."
 IRQ_extensive_irrigation_projects_680_tt: "Jika kita mengontrol §Y[680.GetName]§!, kita akan mendapatkan §G1§! slot bangunan tambahan di status tersebut"
 IRQ_extensive_irrigation_projects_413_tt: "Jika kita mengontrol §Y[413.GetName]§!, kita akan mendapatkan §G2§! slot bangunan tambahan di negara bagian tersebut"
 IRQ_rural_electrification: "Elektrifikasi Pedesaan"
 IRQ_rural_electrification_desc: "Meskipun elektrifikasi menunjukkan kemajuan yang stabil di daerah perkotaan, masyarakat pedesaan masih tertinggal dari perkembangan tersebut. Oleh karena itu, kita harus membentuk dewan ketenagalistrikan nasional untuk mendistribusikan infrastruktur kelistrikan secara merata di seluruh negeri."
 IRQ_found_the_iraqi_state_railways: "[IRQ_found_the_iraqi_state_railways_key]"
 IRQ_found_the_iraqi_state_railways_IRQ: "Menemukan Kereta Api Negara Irak"
 IRQ_found_the_iraqi_state_railways_KUR: "Menemukan Kereta Api Negara Kurdi"
 IRQ_found_the_iraqi_state_railways_desc: "[ENG.GetAdjective] masih memegang kendali atas infrastruktur perkeretaapian kita dalam bentuk Perkeretaapian Mesopotamia, meskipun kita seharusnya merdeka. Kita harus mendekati mereka dengan tawaran untuk membeli bisnis tersebut dan mengganti namanya menjadi Kereta Api Negara Irak."
 IRQ_finish_the_berlin_baghdad_railway: "Selesaikan Kereta Api Berlin–Baghdad"
 IRQ_finish_the_berlin_baghdad_railway_desc: "Kekaisaran Jerman lama sudah berambisi untuk membangun jalur kereta api dari Berlin ke Bagdad guna mendukung kehadiran angkatan laut di Teluk Persia. 'Taurus Express' ini tidak pernah selesai, namun, kita mungkin dapat memperoleh manfaat ekonomi dari jalur ini dengan menyelesaikannya sendiri."
 IRQ_purchase_foreign_equipment: "Beli Peralatan Mesin Asing"
 IRQ_purchase_foreign_equipment_desc: "Meskipun kita mempunyai lahan subur dan banyak lahan untuk irigasi, kita kekurangan peralatan mekanis yang dimiliki oleh kekuatan industri. Jika kita berinvestasi dalam mengimpor mesin-mesin tersebut, kita dapat meningkatkan produksi tanaman dan hasil industri kita secara drastis."
 IRQ_found_southern_steel_plants: "Ditemukan Pabrik Baja Selatan"
 IRQ_found_southern_steel_plants_desc: "Baja sangat penting untuk pembangunan ekonomi, serta produksi peralatan militer. Saat ini, hanya sedikit produsen dalam negeri yang mampu memenuhi kebutuhan kita, sehingga kita bergantung pada impor. Hal ini tidak dapat berlanjut karena dunia menjadi semakin bermusuhan."
 IRQ_found_the_state_company_for_iron_and_steel: "Perusahaan Negara Besi dan Baja"
 IRQ_found_the_state_company_for_iron_and_steel_desc: "Investasi baru-baru ini di industri baja telah memberikan manfaat bagi perekonomian kita dan mengurangi ketergantungan pada impor. Namun, kita dapat melangkah lebih jauh dengan mendirikan industri-industri yang dikendalikan oleh negara untuk mengendalikan pasokan bahan mentah yang penting tersebut."
 IRQ_baghdad_colleges_of_engineering_and_education: "Perluas Perguruan Tinggi Bagdad"
 IRQ_baghdad_colleges_of_engineering_and_education_desc: "Bagdad telah menjadi pusat pembelajaran selama berabad-abad, namun dalam beberapa dekade terakhir kota ini telah diabaikan dan digantikan oleh universitas-universitas barat. Sudah saatnya kita berinvestasi pada institusi pendidikan kita untuk membangun kembali kota kita sebagai jantung dunia akademis."
 IRQ_strengthen_the_iraqi_dinar: "[IRQ_strengthen_the_iraqi_dinar_key]"
 IRQ_strengthen_the_iraqi_dinar_IRQ: "Memperkuat Dinar Irak"
 IRQ_strengthen_the_iraqi_dinar_KUR: "Perkuat Dinar Kurdi"
 IRQ_strengthen_the_iraqi_dinar_desc: "Kini setelah kita merebut kendali atas mata uang kita dari [ENG.GetAdjective], kita akhirnya dapat menetapkan kebijakan moneter kita sendiri dengan cara yang menguntungkan perekonomian domestik kita."
 IRQ_heavy_industry_investments: "Investasi Industri Berat"
 IRQ_heavy_industry_investments_desc: "Kita membuat kemajuan dalam penyediaan bahan mentah untuk industri, namun menjadi jelas bahwa untuk mengejar ketertinggalan dari negara-negara besar, kita perlu membangun lebih banyak industri berat yang dikelola negara atau mensubsidi industri yang sudah ada."
 IRQ_found_company_for_cement: "Mendirikan Perusahaan Umum untuk Semen"
 IRQ_found_company_for_cement_desc: "Untuk meningkatkan proyek konstruksi yang akan kita mulai di seluruh negeri, kita harus mendirikan badan usaha milik negara yang memproduksi dan mendistribusikan semen, yang menjadi semakin penting untuk fasilitas modern."
 IRQ_expand_the_cotton_industries: "Perluas Industri Kapas"
 IRQ_expand_the_cotton_industries_desc: "Sebagai bagian penting dari perekonomian kita, kita harus lebih fokus pada sektor kapas karena permintaan kita terus meningkat."
 IRQ_local_arms_industry: "Industri Senjata Lokal"
 IRQ_local_arms_industry_desc: "Jika perang pecah, kita tidak bisa bergantung pada pengiriman peralatan militer dari luar negeri. Oleh karena itu, kita harus segera membangun industri senjata dalam negeri untuk mendukung kekuatan kita di saat krisis."
 IRQ_invite_foreign_arms_corporations: "Undang Perusahaan Asing"
 IRQ_invite_foreign_arms_corporations_desc: "Kebutuhan akan industri senjata dalam negeri sangatlah penting, namun kita kekurangan keahlian untuk mengembangkan dan memproduksi peralatan kita sendiri. Oleh karena itu, kita harus bermitra dengan perusahaan asing untuk mendirikan pabrik yang saling menguntungkan bagi kita dan mereka."
 IRQ_construct_the_dukan_dam: "Membangun Bendungan Dukan"
 IRQ_construct_the_dukan_dam_desc: "Sungai-sungai besar di negara kita harus dimanfaatkan tidak hanya untuk irigasi, tapi juga untuk pembangkit listrik. Kami akan melakukannya dengan membangun bendungan pembangkit listrik tenaga air di sungai Zab, menciptakan danau buatan."
 IRQ_forceful_industrialization: "Industrialisasi yang Kuat"
 IRQ_forceful_industrialization_desc: "Laju industrialisasi di [ROOT.GetNameDef] terlalu lambat jika kita ingin terhindar dari ketertinggalan dari musuh-musuh kita. Kita harus mengatur program industrialisasi secara besar-besaran, meskipun hal itu akan membuat marah masyarakat."
 IRQ_nationalize_the_anglo_iraqi_oil_company: "Nasionalisasi Perusahaan Minyak Anglo-Irak"
 IRQ_nationalize_the_anglo_iraqi_oil_company_desc: "Perusahaan Minyak Anglo-Irak terus mendominasi urusan ekonomi dan luar negeri kita, menyalurkan kekayaan kita ke kapal perang Angkatan Laut [ENG.GetAdjective], yang pada gilirannya membuat kita tidak bisa mengendalikan urusan kita sendiri. Sudah waktunya kita mengakhiri sandiwara ini dan menasionalisasi perusahaan demi kepentingan rakyat kita sendiri."
 IRQ_anglo_iraqi_oil_expansion: "Ekspansi Minyak Anglo-Irak"
 IRQ_anglo_iraqi_oil_expansion_desc: "Perjanjian yang ada saat ini dengan Perusahaan Minyak Anglo-Irak mungkin mengecewakan masyarakat kita, namun mereka berpikiran sempit dan tidak dapat memahami manfaat yang dihasilkannya bagi perekonomian kita dan perlindungan yang kita peroleh dari [ENG.GetAdjective]."
 IRQ_form_opec: "Bentuk OPEC"
 IRQ_form_opec_desc: "Negara-negara besar sangat bergantung pada aliran minyak ke pabrik dan kendaraan mereka. Jika negara-negara penghasil minyak di dunia bisa berkolaborasi satu sama lain dalam produksi dan keamanan minyak, kita akhirnya bisa meminta pertanggungjawaban negara-negara besar atas semua yang telah mereka lakukan terhadap kita."
 IRQ_demand_greater_stake_in_the_company: "Menuntut Kepemilikan Lebih Besar pada Perusahaan"
 IRQ_demand_greater_stake_in_the_company_desc: "Kami telah berbuat banyak untuk membuat pengoperasian fasilitas minyak dapat diandalkan untuk [ENG.GetAdjective]. Oleh karena itu, wajar jika mereka berbagi kekayaan yang lebih besar dari pasokan minyak."
 IRQ_expand_oil_production: "Memperluas Produksi Minyak"
 IRQ_expand_oil_production_desc: "Para ahli geologi percaya bahwa terdapat banyak sekali cadangan minyak yang belum dimanfaatkan di negara kita. Sumber daya tersebut dapat menghasilkan kekayaan yang sangat besar bagi masyarakat kita dan harus dieksploitasi sesegera mungkin."
 IRQ_export_infrastructure: "Ekspor Infrastruktur"
 IRQ_export_infrastructure_desc: "Minyak sangat penting bagi perekonomian global, dengan berinvestasi pada infrastruktur ekspor kita, kita dapat menempatkan [ROOT.GetNameDef] dalam peta dan juga mendapatkan keuntungan finansial."
 IRQ_is_kurdistan: "§YBermain sebagai Kurdistan§!"
 IRQ_royal_iraqi_army: "[IRQ_royal_iraqi_army_key]"
 IRQ_royal_iraqi_army_IRQ: "Tentara Kerajaan Irak"
 IRQ_royal_iraqi_army_KUR: "Tentara Kurdi"
 IRQ_royal_iraqi_army_desc: "Ancaman perang, baik dari negara tetangga atau negara lain, semakin mungkin terjadi. Terlebih lagi, banyak sekali faksi dalam negeri yang siap memecah belah bangsa kita. Yang bisa menahan mereka hanyalah kekuatan angkatan bersenjata kita."
 IRQ_approach_tribes_for_support: "Dekati Suku untuk Mendapatkan Dukungan"
 IRQ_approach_tribes_for_support_desc: "Ada banyak komunitas pedesaan yang menganut gaya hidup kesukuan tradisional, dan sejak berdirinya negara kami, mereka sebagian besar memusuhi kami. Mungkin kita belum menemukan insentif yang tepat untuk memenangkan hati mereka."
 IRQ_establish_iraqi_coastal_defense_force: "[IRQ_establish_iraqi_coastal_defense_force_key]"
 IRQ_establish_iraqi_coastal_defense_force_IRQ: "Membentuk Pasukan Pertahanan Pesisir Irak"
 IRQ_establish_iraqi_coastal_defense_force_KUR: "Bentuk Pasukan Pertahanan Pesisir Kurdi"
 IRQ_establish_iraqi_coastal_defense_force_desc: "Garis pantai kita mungkin pendek, namun merupakan salah satu jalur pasokan paling penting di dunia untuk ekspor minyak ke wilayah barat. Oleh karena itu kita harus membentuk kekuatan angkatan laut untuk melindungi kepentingan kita di wilayah tersebut."
 IRQ_invite_foreign_advisors: "Undang Penasihat Asing"
 IRQ_invite_foreign_advisors_desc: "Kita tidak mempunyai keahlian untuk berhadapan langsung dengan kekuatan angkatan laut mana pun di kawasan ini. Namun, kita dapat meningkatkan keterampilan pasukan kita dengan mendatangkan ahli asing untuk melatih perwira angkatan laut kita."
 IRQ_purchase_small_ships: "Beli Kapal Kecil"
 IRQ_purchase_small_ships_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 IRQ_create_repair_yards: "Menemukan Pelabuhan Laut Dalam Umm Qasr"
 IRQ_create_repair_yards_desc: "Mengembangkan pelabuhan laut dalam dapat meningkatkan kemampuan kita dalam mengekspor barang sekaligus menyediakan fasilitas bagi kapal-kapal militer untuk berlabuh dan memasok pasokan."
 IRQ_navy_research_bonus: "Kemajuan Teknologi Angkatan Laut"
 IRQ_navy_research_bonus_desc: "Selama ini kami bergantung pada kapal bekas dari luar negeri yang sudah ketinggalan jaman bahkan sebelum kami membelinya. Agar tidak ketinggalan, kita perlu meneliti dan mengembangkan teknologi angkatan laut kita sendiri dan melakukan retrofit atau membangun kembali armada kita."
 IRQ_infantry_focus: "Perkuat Infanteri"
 IRQ_infantry_focus_desc: "Negara-negara besar bisa bermain-main dengan monster mekanis mereka sesuka mereka, kenyataannya perang apa pun pada akhirnya akan dilakukan oleh infanteri. Oleh karena itu, tentara akan menerima peningkatan anggaran yang besar untuk meningkatkan pelatihan mereka."
 IRQ_scavenging: "Gunakan Taktik Pemulungan"
 IRQ_scavenging_desc: "Peralatan yang tidak dapat kami produksi sendiri sering kali berakhir di tangan pihak asing. Oleh karena itu kita harus melatih pasukan kita untuk mengenali dan menangkap peralatan militer yang berharga kapan pun tersedia."
 IRQ_cavalry_integration: "Integrasi Kavaleri"
 IRQ_cavalry_integration_desc: "Meskipun motorisasi mungkin menjadi standar di masa depan, tentara kita membutuhkan dukungan yang saat ini hanya dapat kita berikan dalam bentuk kavaleri."
 IRQ_modernization: "Berjuang untuk Modernisasi"
 IRQ_modernization_desc: "Berparade di jalan-jalan dengan peralatan kuno mungkin cukup untuk mengendalikan rakyat kita, namun hal itu tidak akan banyak membantu menghalangi agresi kekuatan asing. Kita harus memodernisasi peralatan kita dan menjadikan angkatan bersenjata kita sebagai alat pencegah yang serius."
 IRQ_purchase_mechanized_equipment: "Beli Peralatan Mekanis"
 IRQ_purchase_mechanized_equipment_desc: "Gerakan infanteri yang lambat telah menjadi kelemahan nyata pasukan kita karena munculnya infanteri mekanis di luar negeri. Sudah saatnya kita berinvestasi dalam mekanisasi kekuatan kita sendiri sebelum terlambat."
 IRQ_purchase_armored_equipment: "Beli Peralatan Lapis Baja"
 IRQ_purchase_armored_equipment_desc: "Pasukan kami tidak mempunyai kekuatan pukulan yang kuat terhadap musuh karena ketergantungan kami yang berlebihan pada pasukan infanteri tradisional. Tank ini jelas merupakan masa depan perang darat dan kita harus mencari seseorang yang bersedia menjual kelebihan modelnya kepada kita."
 IRQ_training: "Sekolah Senjata Ringan Al-Wash"
 IRQ_training_desc: "Pelatihan pasukan di [IRQ.GetNonIdeologyName] sudah kuno dan dapat ditingkatkan dengan diperkenalkannya reformasi yang serupa dengan yang dilakukan negara lain. Oleh karena itu, kita harus mendidik prajurit kita mengenai senjata ringan dan taktik infanteri di Sekolah Senjata Ringan Al-Wash."
 IRQ_army_research_bonus: "Memodernisasi Doktrin Militer"
 IRQ_army_research_bonus_desc: "Banyak perwira militer kami adalah mantan tentara Kekaisaran Ottoman lama atau telah diberi pelatihan dasar oleh pasukan [ENG.GetAdjective]. Apa pun kasusnya, taktik mereka menunjukkan usia mereka dan perlu segera diperbarui."
 IRQ_special_projects: "Pusat Penelitian Nuklir Tuwaitha"
 IRQ_special_projects_desc: "Gemuruh rahasia atom dari luar negeri telah sampai ke para ilmuwan dan insinyur kita yang ingin menunjukkan kemampuan mereka. Dengan keahlian mereka dan pendanaan yang cukup, kita mungkin bisa mengembangkan senjata dengan kekuatan yang tak terbayangkan."
 IRQ_special_forces: "Pasukan Khusus"
 IRQ_special_forces_desc: "Dalam beberapa situasi selama perang, segelintir pasukan spesialis yang menyelinap di belakang garis musuh dapat memberikan pukulan telak yang tidak dapat dilakukan oleh seluruh pasukan di tempat terbuka. Kita membutuhkan kekuatan kita sendiri yang siap siaga."
 IRQ_expand_habbaniya_airbase: "Perluas Pangkalan Udara Habbaniya"
 IRQ_expand_habbaniya_airbase_desc: "Pangkalan udara Habbaniya telah menjadi jantung operasi udara di Irak sejak [ENG.GetAdjective] didirikan. Untuk mengakomodasi pertumbuhan angkatan udara kita dengan lebih baik, kita harus memperluas fasilitas di sana."
 IRQ_independent_flight_schools: "Sekolah Penerbangan Independen"
 IRQ_independent_flight_schools_desc: "Pilot-pilot kami sebagian besar telah dilatih di luar negeri oleh [ENG.GetAdjective], namun kini kami memiliki sejumlah pilot yang kritis sehingga kami mungkin dapat mulai melatih pilot-pilot kami di dalam negeri."
 IRQ_purchase_british_aircraft: "Beli Pesawat Inggris"
 IRQ_purchase_british_aircraft_desc: "Karena hubungan kami dengan [ENG.GetAdjective] RAF, tampaknya masuk akal untuk membeli lebih banyak pesawat dari mereka."
 IRQ_purchase_alternative_aricraft: "Beli Pesawat Alternatif"
 IRQ_purchase_alternative_aricraft_desc: "Untuk menghindari ketergantungan yang berlebihan pada satu pemasok, kita harus melihat lebih jauh dari [ENG.GetAdjective] untuk memasok pesawat bagi angkatan bersenjata kita yang sedang berkembang. Banyak petugas kami yang menganjurkan kesepakatan dengan [ITA.GetAdjective]s."
 IRQ_bomber_training: "Pelatihan Pengebom"
 IRQ_bomber_training_desc: "Angkatan udara kami tidak memiliki pengalaman dengan pesawat yang lebih besar yang dapat digunakan untuk misi pengeboman. Kesenjangan keterampilan ini harus ditutup secepat mungkin."
 IRQ_naval_air_support: "Dukungan Udara Angkatan Laut"
 IRQ_naval_air_support_desc: "Adalah suatu kebodohan jika kita percaya bahwa kita dapat mengembangkan angkatan laut yang mampu menghadapi kekuatan-kekuatan besar. Namun, pengembangan pesawat yang dapat menargetkan aset angkatan laut dapat menyamakan kedudukan dengan biaya yang jauh lebih kecil dibandingkan biaya yang dikeluarkan sebuah kapal."
 IRQ_fighter_training: "Pelatihan Petarung"
 IRQ_fighter_training_desc: "Semua perencanaan militer dan ekonomi kita akan sia-sia jika pilot kita tidak dapat memanfaatkan pesawat mereka secara memadai untuk melindungi langit kita dari pembom musuh."
 IRQ_air_research_bonus: "Penelitian Aerodinamika dan Avionik"
 IRQ_air_research_bonus_desc: "Bidang avionik mengalami kemajuan pesat seiring dengan munculnya konflik di seluruh dunia. Kita memerlukan fasilitas di mana para insinyur kita dapat mengembangkan teknologi mutakhir untuk angkatan udara jika kita ingin mempunyai harapan untuk menjadi kekuatan di wilayah ini."
 IRQ_project_babylon_focus: "Proyek Babel"
 IRQ_project_babylon_focus_desc: "Untuk memenangkan perang di masa depan, kita harus mengamankan persenjataan berat yang diperlukan untuk mendominasi musuh, tidak peduli seberapa kalah jumlah kita. Oleh karena itu kita harus berusaha untuk membuka fasilitas yang didedikasikan untuk penelitian dan pengembangan senjata eksperimental."
 IRQ_invest_in_ordnance_mountain_howitzers: "Berinvestasilah pada Ordnance Mountain Howitzer"
 IRQ_invest_in_ordnance_mountain_howitzers_desc: "Negara kita dikelilingi oleh pegunungan di utara dan timur, namun angkatan bersenjata kita kekurangan daya tembak yang memadai untuk berperang di daerah tersebut. Mungkin sudah saatnya kita berinvestasi pada artileri gunung khusus untuk mendukung mereka jika konflik dengan tetangga kita muncul."
 IRQ_basra_military_port_focus: "Penyerahan Pelabuhan Militer Basra"
 IRQ_basra_military_port_focus_desc: "Dengan adanya pembaruan minat kita terhadap laut dan Teluk Persia, kita harus memastikan bahwa Pelabuhan Militer Basra diserahkan kepada pemerintahan kita, dan tidak tetap menjadi bagian dari kekuatan imperialis yang menduduki negara kita."
 IRQ_develop_the_kuwaiti_port: "Mengembangkan Pelabuhan Kuwait"
 IRQ_develop_the_kuwaiti_port_desc: "Dengan Kuwait di bawah kendali penuh kami, garis pantai kami telah meningkat secara signifikan. Hal ini memberi kita peluang untuk memperluas fasilitas angkatan laut kita lebih jauh lagi untuk mendukung kehadiran yang lebih besar di Teluk Persia."
 IRQ_develop_the_kuwaiti_port_tt: "Menambahkan §G1§YPangkalan Angkatan Laut§!§!di setiap provinsi."
 IRQ_form_the_independent_mechanized_brigade: "Bentuk Brigade Mekanik Independen"
 IRQ_form_the_independent_mechanized_brigade_desc: "Dengan pembelian peralatan yang sesuai dan banyak pelatihan, angkatan bersenjata kami yakin mereka siap mengerahkan dan menggunakan unit mekanis pertama mereka."
 IRQ_form_the_independent_mechanized_brigade_tt: "Buat template divisi Al-Mechanikiyah §YMechanized§! dan sebarkan unit §Y1§!."
 IRQ_expand_camel_corps: "Integrasikan Polisi [ROOT.GetAdjective]"
 IRQ_expand_camel_corps_desc: "[ENG.GetAdjective] menunjukkan keserbagunaan unta selama Perang Besar terakhir dengan memanfaatkan kawanan unta di Afrika Utara dan Timur. Karena polisi kita sudah terbiasa menggunakan hewan untuk patroli, kita bisa mengintegrasikan mereka lebih dekat ke dalam angkatan bersenjata dan belajar lebih banyak dari mereka."
 IRQ_purchase_british_aircraft_AAT_tt: "§YKami menerima subsidi peralatan yang lebih besar selama $IRQ_anglo_iraqi_treaty$ aktif.§!"
 IRQ_purchase_british_aircraft_treaty_tt: "§YKami menerima peralatan dalam jumlah lebih besar saat $IRQ_anglo_iraqi_treaty$ aktif.§!"
 IRQ_align_afghanistan_fasc: "Undang Afghanistan"
 IRQ_align_afghanistan_fasc_desc: "[AFG.GetNameDef] telah lama terjebak di antara [SOU.GetAdjective]s dan [ENG.GetAdjective] sebagai status buffer. Mungkin dengan bekerja sama, kita bisa mengangkat mereka ke posisi yang lebih sesuai di wilayah ini."
 IRQ_ensure_sunni_dominance: "Pastikan Dominasi Sunni"
 IRQ_ensure_sunni_dominance_desc: "Meskipun merupakan minoritas, kelompok elit Sunni telah lama memerintah negara kita, didukung oleh Dinasti Hashemite dan kelompok nasionalis Arab. Jika kita ingin partai-partai ini tetap berkuasa, kita harus memastikan dominasi Sunni atas politik kita terus berlanjut."
 IRQ_rally_behind_the_hashemite_dynasty: "Rapat Umum di Belakang Dinasti Hashemite"
 IRQ_rally_behind_the_hashemite_dynasty_desc: "Keluarga Hashemite harus menjadi titik fokus kita untuk terus membangun rasa kebangsaan Irak. Setelah bertahun-tahun berkuasa, kita hampir benar-benar mengamankan kekuasaan kita."
 IRQ_align_afghanistan_fasc_tt: "§Y[AFG.GetNameWithFlag]§! diundang ke faksi kami"
 IRQ_anti_western_alliance_per_tt: "§Y[PER.GetNameWithFlag]§! diundang ke faksi kami"
 IRQ_anti_western_alliance_tur_tt: "§Y[TUR.GetNameWithFlag]§! diundang ke faksi kami"
 IRQ_refuge_for_the_grand_mufti: "Perlindungan untuk Mufti Agung"
 IRQ_refuge_for_the_grand_mufti_desc: "Setelah kekacauan baru-baru ini di Palestina, Amin al-Husseini, Mufti Agung Yerusalem yang kontroversial, diasingkan oleh Inggris. Untuk menenangkan sentimen anti-Inggris di dalam negeri kita sendiri, mungkin kita bisa menawarkan dia perlindungan untuk saat ini."
 IRQ_religious_resistance: "Perlawanan Agama"
 IRQ_religious_resistance_desc: "Dengan adanya Mufti Agung di bawah perlindungan kita, kita mungkin bisa bekerja sama dengannya untuk membangkitkan perlawanan di seluruh dunia Arab terhadap rezim opresif Barat yang telah dipaksakan kepada kita."
 IRQ_protector_of_the_gulf: "Pelindung Teluk"
 IRQ_protector_of_the_gulf_desc: "Kami telah membuktikan diri sebagai sekutu yang dapat dipercaya oleh negara-negara Barat. Mungkin mereka bersedia menarik diri dari wilayah tersebut dengan imbalan kita menjaga keamanan Teluk Persia mulai sekarang."
 IRQ_restoration_of_hejaz: "Pemulihan Hijaz"
 IRQ_restoration_of_hejaz_desc: "[SAU.GetAdjective]s menghancurkan Kerajaan Hijaz belum lama ini. Dan dengan itu, mereka membatasi pengaruh dinasti Hashemite. Sudah saatnya kita membalasnya dengan setimpal."
 IRQ_reach_out_to_jordan: "Jangkau Yordania"
 IRQ_reach_out_to_jordan_desc: "Kerabat kami terus memerintah Yordania di bawah perlindungan [ENG.GetAdjective]. Namun, kita mungkin bisa mempengaruhi mereka dan [ENG.GetAdjective] agar kita bisa mengembangkan kohesi politik dan ekonomi yang lebih besar dengan imbalan mengambil alih pertahanan mereka."
 IRQ_status_of_lebanon: "Status Libanon"
 IRQ_status_of_lebanon_desc: "Dengan Suriah yang berada di bawah kendali kami, perhatian beralih ke masa depan Lebanon. Mungkin kita bisa mencoba keberuntungan kita sekali lagi dan meminta keberuntungan itu juga dialihkan ke dalam kendali kita."
 IRQ_regional_economic_integration: "Integrasi Ekonomi Daerah"
 IRQ_regional_economic_integration_desc: "Kita harus mengatur investasi besar-besaran pada infrastruktur di kawasan ini sehingga kita semua dapat memperoleh manfaat dari pertumbuhan ekonomi jangka panjang."
 IRQ_regional_military_integration: "Integrasi Militer Regional"
 IRQ_regional_military_integration_desc: "Kita tidak memiliki kemampuan produksi militer seperti negara-negara besar, namun mungkin melalui investasi regional, kita bisa mulai mengejar ketinggalan."
 IRQ_regional_military_integration_tt: "Menyelesaikan fokus ini ketika Yordania menjadi subjek kami atau kami mengendalikan Yordania akan menambah dua pabrik militer tambahan di Yordania."
 IRQ_demand_palestine: "Menuntut Palestina"
 IRQ_demand_palestine_desc: "Inggris telah membuktikan diri mereka tidak dapat dipercaya dalam melindungi rakyat Palestina di wilayah mandatnya. Meskipun mata dunia tertuju pada mereka, kita mungkin bisa memaksa mereka dengan meminta mereka mengalihkan mandat ke dalam kendali kita."
 IRQ_hashemite_arab_federation: "Federasi Arab Hashemite"
 IRQ_hashemite_arab_federation_desc: "Dengan terbentuknya anggota dinasti Hashemite di seluruh wilayah, kita mempunyai peluang untuk menyatukan kerajaan-kerajaan kita menjadi satu Federasi Arab Hashemite yang lebih besar."
 IRQ_fligerfuhrer_irak: "Fliegerführer Irak"
 IRQ_fligerfuhrer_irak_desc: "Militer kita masih kalah jumlah dengan [ENG.GetAdjective], namun kita mungkin bisa menyeimbangkannya dengan pesawat dan pilot dari sekutu kita."
 IRQ_commander_of_the_faithful: "Amirul Mukminin"
 IRQ_commander_of_the_faithful_desc: "Sekarang kita telah menjalankan misi menyatukan bangsa Arab di bawah pemerintahan kita, adalah bijaksana untuk merekrut mereka sebaik mungkin untuk mendukung tujuan kita. Abd Al-Ilah mendapati dirinya mampu mengambil gelar Amir al-Mu'minīn pada dirinya sendiri, seperti yang pernah disandang Hussein bin Ali al-Hashimi."
 #IRQ_retire_radical_officers: "Retire Radical Officers"
 #IRQ_retire_radical_officers_desc: "The armed forces are rife with anti-[ENG.GetAdjective] and pan-arab radicals who wish to force a confrontation. We must retire them from their roles before they find an opportunity to undermine our rule."
 IRQ_increase_anglo_iraqi_economic_ties: "Meningkatkan Hubungan Ekonomi Inggris-Irak"
 IRQ_increase_anglo_iraqi_economic_ties_desc: "Adalah bodoh jika kita tidak memanfaatkan hubungan ekonomi erat yang telah kita kembangkan dengan [ENG.GetAdjective]."
 IRQ_raf_levies_focus: "Retribusi RAF"
 IRQ_raf_levies_focus_desc: "[ENG.GetAdjective] telah mempertahankan sejumlah pasukan yang dipungut di wilayah kami untuk menjaga keamanan pangkalan udara mereka. Mungkin kita bisa meningkatkan kemampuan pertahanan kita dengan berkolaborasi lebih baik dengan kekuatan-kekuatan tersebut."
 IRQ_increase_prime_ministers_powers: "Memperkuat Kekuasaan Perdana Menteri"
 IRQ_increase_prime_ministers_powers_desc: "Telah terbukti bahwa rakyat Irak tidak menginginkan pemerintahan absolut di bawah dinasti Hashemite, dan dengan demikian peluang kini terbuka bagi kita untuk mengamankan sifat konstitusional pemerintahan mereka untuk selamanya, dan mengarahkan Irak ke arah yang lebih barat."
 IRQ_party_of_national_brotherhood: "Partai Persaudaraan Nasional"
 IRQ_party_of_national_brotherhood_desc: "Sudah terlalu lama pemerintah menyerah pada keinginan [ENG.GetAdjective]. Hanya partai Persaudaraan Nasional yang berpotensi mengangkat [IRQ.GetNonIdeologyName] menuju kehebatan."
 IRQ_bakr_sidqi_coup: "Kudeta Bakr Sidqi"
 IRQ_bakr_sidqi_coup_desc: "Rezim saat ini lemah dan salah arah. Di bawah kepemimpinan Bakr Sidqi, kami akan menggulingkannya dan menjamin masa depan yang mandiri bagi rakyat [ROOT.GetNonIdeologyName]."
 IRQ_bakr_sidqi_tt: "§Y$IRQ_bakr_sidqi$ dipekerjakan sebagai penasihat yang tidak dapat dicopot.§!"
 IRQ_a_new_caliph: "Khalifah Baru"
 IRQ_a_new_caliph_desc: "Setelah perjuangan bertahun-tahun, kami telah memantapkan diri kami sebagai kekuatan unggul di dunia Islam. Oleh karena itu, sudah saatnya kita melanjutkan warisan Hussein bin Ali dan mendirikan kembali kekhalifahan di bawah kepemimpinan dinasti Hashemite."
 IRQ_demand_syria_hashemite: "Usulkan Unifikasi Suriah"
 IRQ_demand_syria_hashemite_desc: "Suriah sempat berada di bawah kekuasaan Faisal I pada tahun 1920, namun direbut oleh pengkhianatan Perancis. Sekarang kami dapat bernegosiasi dari posisi yang kuat dan dapat menuntut pengembalian wilayah yang menjadi hak kami."
 IRQ_kurdish_outreach: "Penjangkauan Kurdi"
 IRQ_kurdish_outreach_desc: "Suku Kurdi di Irak utara berpotensi mengganggu otoritas kami di wilayah tersebut jika mereka bersatu melawan kami. Oleh karena itu, kita harus melakukan upaya untuk mengintegrasikan mereka ke dalam wilayah Irak yang lebih luas, bahkan jika hal itu berarti menawarkan otonomi pada tingkat tertentu."
 IRQ_suppress_tribal_revolts: "Menekan Pemberontakan Suku"
 IRQ_suppress_tribal_revolts_desc: "Untuk mewujudkan persatuan dalam bangsa kita dan memastikan bahwa kita tidak terpecah belah ketika menghadapi tetangga kita, kita harus menghentikan pemberontakan suku dan memastikan pengentasan kemiskinan bagi mereka yang mau bekerja sama sehingga perpecahan dalam jiwa bangsa kita dapat diperbaiki."
 IRQ_assasination_of_sidqi: "Pembunuhan Bakr Sidqi"
 IRQ_assasination_of_sidqi_desc: "[IRQ_assassination_of_sidqi_desc_key]"
 IRQ_assassination_of_sidqi_desc_leader: "Bakr Sidqi telah gagal mempersatukan bangsa sejak penggulingan pemerintahan sebelumnya. Kebencian muncul di kalangan elit politik dan sebagian besar penduduk Irak tidak percaya pada suku Kurdi yang memiliki begitu banyak pengaruh dalam urusan nasional. Jika ada kesempatan, hampir tidak bisa dihindari bahwa seseorang akan berusaha mengakhiri hidupnya..."
 IRQ_assassination_of_sidqi_desc_not_leader: "Bakr Sidqi jelas sedang merencanakan kudeta terhadap pemerintah kami, dan banyak pejabat kami yang melaporkan bahwa dia mengambil tindakan untuk mencoba dan mengamankan kesetiaan mereka jika hal seperti itu terjadi. Kita harus menyingkirkannya jika kita ingin mempertahankan kekuasaan kita."
 IRQ_attempted_assasination_of_sidqi: "Percobaan Pembunuhan Sidqi"
 IRQ_attempted_assasination_of_sidqi_desc: "Meskipun ada kebencian yang sangat besar di kalangan masyarakat dan elit politik, upaya pembunuhan terhadap Bakr Sidqi baru-baru ini sejauh ini tidak berhasil. Namun, tampaknya kita perlu meningkatkan keamanan dan intelijen untuk melindungi rezim baru dari para pembangkang."
 IRQ_increase_italian_business_relations: "Impor dari [ITA.GetNonIdeologyName]"
 IRQ_increase_italian_business_relations_desc: "Kita tidak bisa membiarkan diri kita bergantung sepenuhnya pada [ENG.GetAdjective] untuk kebutuhan ekonomi kita. Untungnya [ITA.GetAdjective] dengan senang hati membantu kami dalam upaya ini."
 IRQ_revoke_anglo_iraq_treaty: "Cabut Perjanjian Inggris-Irak"
 IRQ_revoke_anglo_iraq_treaty_desc: "Perjanjian sepihak Inggris-Irak telah cukup lama menghambat pembangunan bangsa kita. Namun sekarang, kami memiliki kemauan yang kuat untuk menolak [ENG.GetAdjective] dan pada akhirnya akan mencabut perjanjian tersebut. Tidak peduli konsekuensinya."
 IRQ_revoke_anglo_iraq_treaty_tt: "§R[ENG.GetNameDefCap] kemungkinan besar akan menyatakan perang terhadap kami karena mencabut perjanjian!§!"
 IRQ_restore_regent: "Kembalikan Bupati"
 IRQ_restore_regent_desc: "Oportunisme bodoh Rashid Ali al-Gaylani dan Lapangan Emas hanya membawa kehancuran bagi bangsa kita. Kita harus menghilangkan pengaruh beracun mereka untuk selamanya dengan melenyapkan mereka dan memulihkan kekuasaan pemerintahan lama."
 IRQ_support_the_allied_war_effort: "Mendukung Upaya Perang Sekutu"
 IRQ_support_the_allied_war_effort_desc: "Apakah rakyat kita mau menerimanya atau tidak, masa depan kita ada di tangan negara-negara Sekutu di dunia. Kita harus menunjukkan komitmen kita terhadap perjuangan mereka dan mengambil posisi dalam tatanan dunia yang sedang berkembang."
 IRQ_allied_training: "Pelatihan Sekutu"
 IRQ_allied_training_desc: "Sekutu-sekutu kita bersedia memberikan sebagian keahlian yang mereka peroleh dalam beberapa tahun terakhir konflik dengan musuh-musuh kita. Bantuan ini akan kami terima untuk mempersiapkan pasukan kami sebaik-baiknya untuk tugas garis depan."
 IRQ_renegotiate_treaty: "Negosiasi ulang Perjanjian Inggris-Irak"
 IRQ_renegotiate_treaty_desc: "Kami telah membuktikan bahwa kami bukanlah ancaman terhadap kepentingan [ENG.GetAdjective] di kawasan dan dapat menjadi sekutu potensial bagi mereka jika diperlukan. Oleh karena itu, kita pada akhirnya harus merundingkan kembali perjanjian Inggris-Irak dengan pijakan yang setara."
 IRQ_strengthen_the_golden_square: "Perkuat Lapangan Emas"
 IRQ_strengthen_the_golden_square_desc: "Lapangan Emas, yang terdiri dari empat perwira tinggi militer, telah menjadi titik fokus pan-arabisme dan sentimen anti-[ENG.GetAdjective]. Mungkin sudah tiba waktunya untuk memasukkan mereka sepenuhnya ke dalam pemerintahan dan memulai reformasi yang diperlukan untuk memperkuat negara."
 IRQ_iraqi_al_futuwwa: "Bentuk Al-Futuwwa Irak"
 IRQ_iraqi_al_futuwwa_desc: "Agar bangsa kita semakin kuat, kita harus mendirikan organisasi pemuda yang melatih masyarakat kita untuk berjuang demi masa depan yang lebih gemilang!"
 IRQ_seek_axis_investment: "Carilah Investasi Axis"
 IRQ_seek_axis_investment_desc: "Perekonomian kita stagnan dan memerlukan diversifikasi jika kita ingin membangun ketahanan terhadap agresi asing. Mungkin teman-teman kita di luar negeri bersedia berinvestasi di sini guna mempererat hubungan kita."
 IRQ_axis_training: "Misi Pelatihan Brandenburger"
 IRQ_axis_training_desc: "$IRQ_allied_training_desc$"
 IRQ_eliminate_the_golden_square: "Hilangkan Kotak Emas"
 IRQ_eliminate_the_golden_square_desc: "Golden Square dan para pengikutnya akan membuat kita mengambil risiko konflik regional dan perpecahan internal karena keinginan mereka untuk menyatukan dunia Arab. Mereka harus dilenyapkan sebelum mereka menghancurkan bangsa kita."
 IRQ_embargo_the_axis_powers: "Embargo Poros"
 IRQ_embargo_the_axis_powers_desc: "Kekuatan Poros merupakan ancaman bagi perdamaian dunia dan harus kekurangan sumber daya yang diperlukan untuk melancarkan perang."
 IRQ_al_muthanna_club: "Klub Al-Muthanna"
 IRQ_al_muthanna_club_desc: "Banyak sekali klub dan kelompok yang bermunculan dengan tujuan membangun rezim pan-Arab di seluruh wilayah. Kami akan mengamankan pendanaan bagi organisasi-organisasi ini untuk memastikan mereka terus berkembang dan mempengaruhi masyarakat menuju tujuan tersebut."
 IRQ_arab_free_legion: "Legiun Arab Merdeka"
 IRQ_arab_free_legion_desc: "Masyarakat Arab di seluruh dunia secara sukarela berjuang melawan kekuatan lama yang telah menghambat kita selama beberapa dekade. Mungkin kita bisa memanfaatkan hal ini dan merekrut pasukan dari luar negeri untuk berperang bersama militer melawan musuh bersama."
 IRQ_arab_free_legion_tt: "Buka keputusan §Y$IRQ_arab_free_legion_cat$§! untuk merekrut divisi dari seluruh dunia Arab."
 IRQ_curtail_arabism: "Batasi Pan-Arabisme"
 IRQ_curtail_arabism_desc: "Obsesi yang semakin besar di kalangan masyarakat kita terhadap pan-arabisme semakin mengasingkan komunitas non-Arab yang membentuk negara kita dan menempatkan kita pada jalur yang bertentangan dengan kekuatan-kekuatan besar. Kita harus membatasi ideologi ini sebelum menghancurkan kita."
 IRQ_strengthen_relations_with_iran: "Memperkuat Hubungan Dengan Iran"
 IRQ_strengthen_relations_with_iran_desc: "Meskipun masyarakat [IRQ.GetAdjective] dan [PER.GetAdjective] tidak selalu sepakat, kami memiliki agenda yang sama dalam modernisasi negara kami dan perlawanan terhadap dominasi barat di wilayah tersebut. Inilah saatnya membangun hubungan yang konstruktif satu sama lain sehingga kita dapat mencapai tujuan kita bersama."
 IRQ_strengthen_relations_with_turkey: "Memperkuat Hubungan Dengan Turki"
 IRQ_strengthen_relations_with_turkey_desc: "[TUR.GetAdjective] telah berada di garis depan dalam melawan kekuatan barat, meskipun hal ini pada akhirnya merugikan kerajaan mereka. Oleh karena itu, kita adalah sekutu alami dan kita harus berbuat lebih banyak untuk membangun hubungan yang lebih baik dengan mereka."
 IRQ_anti_western_alliance: "Aliansi Anti-Barat"
 IRQ_anti_western_alliance_desc: "Jika negara-negara dominan di kawasan ini menyatukan kekuatan militer mereka dan berkomitmen untuk membela satu sama lain, kita akan memiliki peluang nyata untuk akhirnya melawan kekuatan-kekuatan barat yang begitu sering ikut campur dalam urusan kita."
 IRQ_carve_up_syria: "Suriah yang terpecah-belah"
 IRQ_carve_up_syria_desc: "Suriah seharusnya dimasukkan ke dalam kerajaan kami tetapi dirampok dari kami oleh Prancis. Selain itu, teman-teman kami di [TUR.GetNonIdeologyName] juga mengklaim sebagian wilayah tersebut. Mungkin inilah saatnya kita mengajukan tuntutan bersama atas wilayah tersebut sementara perhatian dunia sedang terganggu."
 IRQ_encourage_federalism: "Mendorong Federalisme"
 IRQ_encourage_federalism_desc: "Kita harus berusaha untuk memberikan otonomi tertentu kepada suku Kurdi dan Asyur, dan melegalkan bahasa dan praktik lokal di seluruh negara kita, untuk menyatukan seluruh warga Irak di bawah satu bendera."
 IRQ_reapproachment_with_the_tribes: "Celaan dengan Suku"
 IRQ_reapproachment_with_the_tribes_desc: "Masih banyak pemimpin suku yang tidak menaruh kepercayaan penuh pada pemerintah kita. Kita harus menenangkan mereka dan berinvestasi di wilayah lokal mereka, untuk memastikan bahwa kesetiaan mereka hanya ada pada kita dan kita saja."
 IRQ_reapproachment_with_the_tribes_tt: "§YAhmed Barzani§! dan §YMustafa Barzani§! tersedia sebagai level 3 §YJenderal§!"
 IRQ_abd_al_illah_fm_tt: "§YAbd Al-Ilah§! tersedia sebagai level 3 §YField Marshal§!"
 IRQ_greater_iraq: "Irak Raya"
 IRQ_greater_iraq_desc: "Dengan semakin banyaknya penduduk Arab yang kini berada di bawah kekuasaan kita, rasanya tepat jika kita menandai peristiwa ini dengan mendeklarasikan pembentukan definisi yang lebih luas tentang [IRQ.GetNonIdeologyName]."
 IRQ_greater_iraq_tt: "Buka keputusan §Y$greater_iraq_decision_cat$§! untuk mendapatkan inti di negara-negara Timur Tengah yang kita miliki."
 IRQ_arab_republic_core_tt: "Buka keputusan §Y$united_arab_republic_cat$§! untuk mendapatkan inti di negara-negara Arab yang kita miliki."
 IRQ_take_advantage_of_british_weakness: "Manfaatkan Situasi ini"
 IRQ_take_advantage_of_british_weakness_desc: "Jika kita ingin mengusir [ENG.GetAdjective] dari wilayah kita, kita mungkin tidak akan pernah mendapatkan kesempatan sebaik sekarang ketika perhatian mereka teralihkan oleh konflik di seluruh dunia. Mari kita melancarkan pukulan yang tidak akan pernah bisa mereka pulihkan."
 IRQ_arab_dominance: "Dominasi Arab"
 IRQ_arab_dominance_desc: "[IRQ.GetNonIdeologyName] adalah negara yang beragam, namun hanya dengan memperkuat dominasi politik mayoritas Arab kita dapat berharap untuk mempertahankan pemerintahan yang stabil."
 IRQ_rally_the_arab_world: "Kumpulkan Dunia Arab"
 IRQ_rally_the_arab_world_desc: "Dunia Arab sangat ingin melepaskan diri dari belenggu kekuatan Barat. Bersama-sama kita akan menyatukan bangsa Arab dan menjadikan diri kita sebagai penentu nasib kita sendiri."
 IRQ_regime_change_in_arabia: "Perubahan Rezim di Arab"
 IRQ_regime_change_in_arabia_desc: "Keluarga Saud tidak dapat dipercaya sebagai sekutu potensial melawan kekuatan-kekuatan besar. Oleh karena itu harus dihilangkan sebelum menjadi ancaman."
 IRQ_iran_ultimatum: "Klaim Pers tentang Arabistan"
 IRQ_iran_ultimatum_desc: "Sejumlah besar orang Arab tinggal di wilayah barat [PER.GetName]. Mungkin sudah tiba waktunya untuk menuntut penyatuan mereka dengan negara kita untuk melindungi mereka dari kekuasaan [PER.GetAdjective]."
 IRQ_iran_ultimatum_tt2: ""
 IRQ_iran_ultimatum_tt: "§YJika [PER.GetNameDef] menolak menyerahkan wilayah, kami mempunyai opsi untuk menyatakan perang terhadap mereka.§!"
 IRQ_liberate_levant: "Bebaskan Levant"
 IRQ_liberate_levant_desc: "Levant dipecah belah oleh para pemenang Perang Besar, yang hanya menyebabkan pertumpahan darah dan kesengsaraan bagi masyarakat di wilayah tersebut. Kita tidak bisa lagi berdiam diri sementara saudara kita mengalami nasib seperti itu."
 IRQ_liberate_north_africa: "Bebaskan Afrika Utara"
 IRQ_liberate_north_africa_desc: "Afrika Utara sudah terlalu lama tertindas di bawah pengaruh imperialis Eropa. Waktunya telah tiba untuk membebaskan dan membawa mereka kembali ke kelompoknya."
 IRQ_proclaim_united_arab_republic: "Proklamasikan Republik Persatuan Arab"
 IRQ_proclaim_united_arab_republic_desc: "Impian kita akan sebuah negara pan-Arab mulai membuahkan hasil. Kita harus memanfaatkan kesempatan ini dan mendeklarasikan berdirinya Republik Persatuan Arab dan menggalang rakyat untuk mendukung tujuan kita."
 IRQ_request_syria_from_vichy: "Permintaan Suriah"
 IRQ_request_syria_from_vichy_desc: "Prancis tidak pernah begitu terpecah dan lemah. Ini adalah kesempatan sempurna untuk menuntut penyerahan wilayah mereka di Suriah ke dalam kendali kami."
 AT_PEACE_WITH_SYRIA_OWNER_TT_NOT: "Bukan berperang dengan Suriah"
 IRQ_unite_mashriq: "Satukan Masyriq"
 IRQ_unite_mashriq_desc: "Mashriq adalah jantung dunia Islam yang berdetak. Kita tidak bisa tenang sampai semuanya berada di bawah kendali Khalifah."
 IRQ_discuss_a_new_treaty: "Diskusikan Perjanjian Baru"
 IRQ_discuss_a_new_treaty_desc: "Perjanjian Inggris-Irak dinegosiasikan ketika kita masih merupakan negara muda dan lemah. Sekarang, kita adalah kekuatan utama di dunia Islam dan perjanjian semacam itu merupakan penghinaan terhadap pemimpin kita. Oleh karena itu, waktunya telah tiba untuk menegosiasikan perjanjian baru dengan [ENG.GetAdjective]."
 IRQ_unite_maghreb: "Satukan Maghreb"
 IRQ_unite_maghreb_desc: "Maghreb adalah bagian intrinsik dari dunia Islam yang telah terlalu lama menderita di bawah kekuasaan Barat. Dengan kekuatan baru yang kita miliki, kita akan menyatukannya di bawah pemerintahan kita dan mengusir kaum imperialis untuk selamanya."
 IRQ_unite_maghreb_tt: "Keuntungan §YRebut kembali negara inti§!tujuan perang melawan setiap negara yang menduduki negara bagian dengan fokus ini memberi Anda inti"
 IRQ_arab_league: "Membentuk Liga Arab"
 IRQ_arab_league_desc: "Kita harus membangun aliansi negara-negara Arab yang memiliki pemikiran serupa dengan tujuan melindungi kepentingan Arab dari campur tangan luar dan membebaskan mereka yang berada di luar perbatasan kita dari pendudukan."
 IRQ_arab_league_economic_cooperation: "Dewan Ekonomi Liga Arab"
 IRQ_arab_league_economic_cooperation_desc: "Untuk mempererat persaudaraan antar bangsa Arab, kita harus berupaya untuk bekerja sama lebih erat lagi di bidang perekonomian."
 IRQ_arab_league_economic_cooperation_tt: "Kami akan menerima §YPabrik Sipil§! di luar peta untuk setiap §YNegara Arab§! yang memiliki §G85§! §Yopini§! lebih tinggi dari kami. Hal ini berlaku untuk §Y[KUW.GetNameWithFlag]§!, §Y[JOR.GetNameWithFlag]§!, §Y[SYR.GetNameWithFlag]§!, §Y[PAL.GetNameWithFlag]§!, §Y[BHR.GetNameWithFlag]§!, §Y[SAU.GetNameWithFlag]§!, §Y[QAT.GetNameWithFlag]§!, §Y[UAE.GetNameWithFlag]§!, §Y[OMA.GetNameWithFlag]§!, §Y[IMO.GetNameWithFlag]§!, §Y[YEM.GetNameWithFlag]§!, §Y[FSA.GetNameWithFlag]§!, §Y[EGY.GetNameWithFlag]§!, §Y[SUD.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§!, §Y[ALG.GetNameWithFlag]§!, §Y[TUN.GetNameWithFlag]§!, §Y[MOR.GetNameWithFlag]§!, §Y[RIF.GetNameWithFlag]§!, §Y[WES.GetNameWithFlag]§!, §Y[MRT.GetNameWithFlag]§! dan §Y[LEB.GetNameWithFlag]§!."
 IRQ_expand_membership: "Perluas Keanggotaan Federasi"
 IRQ_expand_membership_desc: "Sementara beberapa orang mencemooh gagasan federasi kami, yang lain memandang dengan kagum pada pencapaian kami. Mungkin ini saatnya untuk memperluas keanggotaan kepada mereka yang cukup bijaksana untuk menyadari bahwa kita lebih kuat jika bersama-sama."
 IRQ_expand_membership_tt: "Buka keputusan §Y$hashemite_federation_cat$§! untuk mengundang anggota menjadi boneka Anda."
 IRQ_restore_al_andalus: "Pulihkan Al-Andalus"
 IRQ_restore_al_andalus_desc: "Orang Spanyol mungkin menganggap diri mereka penguasa Iberia, tapi jauh sebelum negara mereka didirikan, negara itu adalah Al Andalus. Mengembalikannya ke dunia Islam akan menjadi kekalahan yang tidak akan pernah dilupakan oleh negara-negara Eropa."
 IRQ_promote_kurdish_culture: "Promosikan Identitas Kurdi"
 IRQ_promote_kurdish_culture_desc: "Masyarakat Kurdi tersebar di berbagai negara, namun budaya menyatukan kita di mana pun kita tinggal. Kita harus mempromosikan dan melindungi warisan tersebut sebelum dibongkar oleh mereka yang memerintah kita."
 IRQ_has_become_kurdistan_flag: "Telah menjadi Kurdistan"
 IRQ_kurdish_democratic: "Partai Demokrat Kurdistan"
 IRQ_kurdish_democratic_desc: "Hak-hak Kurdi diinjak-injak setiap hari oleh mayoritas [IRQ.GetNameDef] Arab. Sudah saatnya kita membentuk gerakan politik kita sendiri dengan tujuan menjamin bangsa yang bebas dan mandiri bagi rakyat kita."
 IRQ_kurdish_socialist: "Carilah Bantuan Soviet"
 IRQ_kurdish_socialist_desc: "[SOU.GetNameDefCap] merindukan cara untuk melemahkan dominasi Barat di Timur Tengah. Mungkin mereka akan bersedia membantu kami dalam perjuangan melawan pemerintah [IRQ.GetAdjective], dan juga [ENG.GetAdjective]."
 IRQ_kurdish_revolt: "Luncurkan Pemberontakan"
 IRQ_kurdish_revolt_desc: "Saatnya telah tiba untuk mendeklarasikan kemerdekaan kita dari [IRQ.GetNonIdeologyName] dan menciptakan negara yang benar-benar bebas bagi rakyat Kurdi."
 IRQ_kurdish_revolt_tt: "Kami akan mendeklarasikan kemerdekaan dari §YNegara Irak§!, membawa kita ke dalam §RPerang Kemerdekaan§! melawan mereka."
 kurdistan_exists_tt: "Kurdistan ada"
 IRQ_kurdish_language: "Sekolah Bahasa Kurdi"
 IRQ_kurdish_language_desc: "Dengan kemerdekaan yang baru kita peroleh, kita akhirnya dapat mulai menciptakan sistem pendidikan yang berpusat pada budaya dan bahasa Kurdi."
 IRQ_kurdish_industry: "Memperluas Basis Industri"
 IRQ_kurdish_industry_desc: "Untuk mencegah diri kita ditelan oleh negara tetangga kita yang lebih kuat, kita harus mengembangkan basis industri kita sendiri."
 IRQ_kurdish_oil: "Minyak Kurdi"
 IRQ_kurdish_oil_desc: "Cadangan minyak telah disadap dalam beberapa tahun terakhir di seluruh wilayah kami, namun kekayaan yang dihasilkannya tersedot keluar dari wilayah tersebut. Sekarang kita akhirnya bisa membangun industri minyak kita sendiri dan menggunakan kekayaannya untuk rakyat kita sendiri."
 IRQ_kurdish_form_the_peshmerga: "Bentuklah Peshmerga"
 IRQ_kurdish_form_the_peshmerga_desc: "Meskipun pemberontakan kami berhasil menghancurkan militer Irak, namun hal ini mungkin tidak akan seberuntung itu di masa depan. Oleh karena itu, kita akan membentuk tentara nasional dengan pelatihan militer nyata dan peralatan modern untuk mencegah terjadinya potensi konflik."
 IRQ_effectivize_the_production_line: "Optimalisasi Jalur Produksi"
 IRQ_effectivize_the_production_line_desc: "Untuk menjamin kemerdekaan kita di masa depan, upaya satu kali saja tidak akan cukup. Oleh karena itu, kita harus mengambil langkah-langkah untuk memastikan bahwa kita terus melakukan perbaikan dari waktu ke waktu."
 IRQ_kurdish_women_in_military: "Wanita di Militer"
 IRQ_kurdish_women_in_military_desc: "Pandangan kuno bahwa perempuan harus dijauhkan dari konflik harus dihilangkan jika kita ingin mengembangkan militer yang kuat dan mampu melawan tetangga kita."
 IRQ_kurdish_support_resistance: "Mendukung Perlawanan di Luar Negeri"
 IRQ_kurdish_support_resistance_desc: "Meskipun masyarakat di wilayah kita benar-benar menikmati kebebasan, masih banyak saudara kita yang terjebak di bawah kekuasaan asing. Kita harus mendukung upaya mereka untuk membebaskan diri."
 IRQ_kurdish_reject_ankara_treaty: "Tolak Perjanjian Ankara"
 IRQ_kurdish_reject_ankara_treaty_desc: "Perjanjian Ankara menghancurkan upaya-upaya sebelumnya untuk mendirikan sebuah negara bagi rakyat Kurdi. Kita harus menjelaskan kepada dunia bahwa kita menolak perbatasan yang ditetapkan dalam perjanjian tersebut dan bahwa kita tidak akan berhenti sampai rakyat Kurdi bersatu."
 IRQ_further_ussr_support: "Dukungan [SOV.GetAdjective] lebih lanjut"
 IRQ_further_ussr_support_desc: "Di awal perjalanan kami menuju kebebasan, kami mengandalkan bantuan [SOV.GetAdjective] untuk mencapai kesuksesan. Ketergantungan pada orang lain bukanlah sesuatu yang kita cita-citakan pada awalnya, namun, jika mereka dapat dibujuk untuk menganggap kita setara dan kawan, hubungan ini masih bisa membuahkan hasil."
 IRQ_support_from_skies_above: "Dukungan Dari Langit Di Atas"
 IRQ_support_from_skies_above_desc: "Mengingat lingkungan di sekitar kita, tidak bijaksana jika hanya mengandalkan infanteri dan unit darat. Meskipun upaya untuk membentuk angkatan udara kemungkinan besar memerlukan biaya yang besar, hal ini merupakan langkah yang harus kita ambil."
 IRQ_support_from_skies_above_tt: "Berada dalam faksi dengan §Y[SOV.GetNameWithFlag]§! dan mereka memiliki pesawat §YClose Air Support§! akan memberikan §Y100 pesawat Bantuan Udara Jarak Dekat§! kepada §Y[ROOT.GetNameWithFlag]§!"
 IRQ_support_from_the_mountains: "Keahlian Gunung"
 IRQ_support_from_the_mountains_desc: "Dengan adanya beberapa barisan pegunungan yang keras di sekitar kita, pelatihan dan peralatan yang disesuaikan dengan tujuan pertempuran di wilayah ini akan sangat membantu. Biaya awal mungkin tidak menjadi penghalang."
 IRQ_kurdish_attack_turkey: "Bebaskan Kurdi di Turki"
 IRQ_kurdish_attack_turkey_desc: "[TUR.GetAdjective] secara aktif menentang masyarakat Kurdi di wilayah mereka, merampas warisan budaya mereka. Hal ini tidak dapat ditoleransi lagi, meskipun itu berarti membebaskan rakyat kami dengan kekerasan."
 IRQ_kurdish_attack_iran: "Bebaskan Kurdi di Iran"
 IRQ_kurdish_attack_iran_desc: "Rezim [PER.GetAdjective] adalah ancaman bagi rakyat kami. Hanya melalui pembebasan paksa suku Kurdi di wilayah mereka dan kekalahan militer [PER.GetAdjective] di tangan kita, kita dapat menjamin masa depan rakyat kita."
 IRQ_kurdish_united: "Kurdistan Bersatu"
 IRQ_kurdish_united_desc: "Melalui kesulitan dan perjuangan yang besar, kami akhirnya menyatukan rakyat Kurdi di bawah kekuasaan kami. Apa pun yang terjadi saat ini, kami berdiri sebagai satu bangsa yang bersatu."
 IRQ_a_new_islamic_golden_age: "Zaman Keemasan Islam Baru"
 IRQ_a_new_islamic_golden_age_desc: "TODO"
 IRQ_put_down_tribal_revolts: "Hentikan Pemberontakan Suku"
 IRQ_put_down_tribal_revolts_desc: "TODO"
 IRQ_join_axis: "$TUR_join_the_axis$"
 IRQ_join_axis_desc: "$TUR_join_the_axis_desc$"
 RAJ_royal_indian_artillery_dlc: "$RAJ_royal_indian_artillery$"
 RAJ_royal_indian_artillery_dlc_desc: "$RAJ_royal_indian_artillery_desc$"
 RAJ_lions_of_the_great_war_dlc: "$RAJ_lions_of_the_great_war$"
 RAJ_lions_of_the_great_war_dlc_desc: "$RAJ_lions_of_the_great_war_desc$"
 RAJ_chindits_dlc: "$RAJ_chindits$"
 RAJ_chindits_dlc_desc: "$RAJ_chindits_desc$"
 RAJ_re_establish_the_khyber_rifles: "Pasang kembali Senapan Khyber"
 RAJ_re_establish_the_khyber_rifles_desc: "Kita akan membentuk kembali milisi Senapan Khyber untuk mempertahankan medan terjal kita, dan mungkin kita juga bisa belajar sesuatu dari mereka."
 RAJ_expand_mazagon_dock_dlc: "$RAJ_expand_mazagon_dock$"
 RAJ_expand_mazagon_dock_dlc_desc: "$RAJ_expand_mazagon_dock_desc$"
 RAJ_found_scindia_shipyard_dlc: "$RAJ_found_scindia_shipyard$"
 RAJ_found_scindia_shipyard_dlc_desc: "$RAJ_found_scindia_shipyard_desc$"
 RAJ_royal_indian_navy_dlc: "$RAJ_royal_indian_navy$"
 RAJ_royal_indian_navy_dlc_desc: "$RAJ_royal_indian_navy_desc$"
 IRQ_invite_oil_mission: "Undang Misi Minyak"
 IRQ_invite_oil_mission_desc: "Pengaruh kami ada pada emas hitam - dan teman-teman baru kami membutuhkan semua yang mereka bisa dapatkan. Sebuah konsesi kecil sekarang bisa berarti keuntungan yang jauh lebih besar di masa depan jika perang ini menguntungkan kita."
 IRQ_invite_oil_mission_ctt: "Kami akan menawarkan hak §Y[GER.GetNameDef]§! atas §YOil§! kami di §Y[676.GetName]§! dengan imbalan:"
  ###########################
  ##### SHARED SAADABAD #####
  ###########################
 SSB_the_saadabad_pact: "Pakta Saadabad"
 SSB_the_saadabad_pact_desc: "Kita tidak akan rugi apa-apa dan kita akan mendapat banyak manfaat dengan tetap bersahabat dengan tetangga kita. Gagasan mengenai perjanjian yang meresmikan persahabatan kita kadang-kadang dilontarkan, dan inilah saat yang tepat bagi kita untuk mengambil inisiatif dan memastikan persahabatan ini dikodifikasikan dalam sebuah perjanjian."
 SSB_military_cooperation: "Kerja Sama Militer"
 SSB_military_cooperation_desc: "Menghadapi ancaman yang semakin besar dari permainan besar yang berakhir dengan penaklukan kita oleh negara besar, kolaborasi militer dalam Pakta Saadabad menjadi sangat penting. Jika kita gagal menyatukan pertahanan, kita berisiko kewalahan secara individu."
 SSB_economic_cooperation: "Kerja Sama Ekonomi"
 SSB_economic_cooperation_desc: "Dengan ancaman raksasa militer dari segala arah, kebutuhan akan kerja sama ekonomi antara pakta Saadabad menjadi semakin jelas. Kita harus membuka pasar satu sama lain dan menurunkan tarif, serta mengurangi ketergantungan kita pada kekuatan dunia."
 SSB_expand_road_and_rail_connections: "Memperluas Koneksi Jalan dan Rel"
 SSB_expand_road_and_rail_connections_desc: "Dengan semakin kuatnya perjanjian Saadabad, tidak dapat dihindari bahwa kita membangun jalur kereta api dari Istanbul ke Kabul, yang menyatukan infrastruktur kita."
 SSB_integration_of_our_infrastructure: "Integrasi Infrastruktur kami"
 SSB_integration_of_our_infrastructure_desc: "Dengan meningkatnya ketegangan di seluruh dunia, dan kita dikelilingi oleh negara-negara adidaya dari segala penjuru, pakta ekonomi dan militer yang sederhana saja tidak lagi cukup. Kita harus menyelesaikan integrasi penuh infrastruktur kita dan mencabut semua tarif antar negara, dan menyatukan sumber daya kita."
 SSB_joint_military_exercises: "Latihan Militer Gabungan"
 SSB_joint_military_exercises_desc: "Kami akan mulai menyatukan proses pelatihan militer kami dan bekerja sama untuk menurunkan penghalang antara militer kami, menciptakan Tentara Saadabad yang semi-bersatu."
 SSB_coordinate_military_production: "Perluas Pengaruh kami"
 SSB_coordinate_military_production_desc: "Lewatlah sudah hari-hari besar kekuasaan dan dominasi, kita telah menjadi lemah dibandingkan dengan negara-negara lain di dunia. Namun kita tidak lagi sendirian, kita kini berdiri bersama dan disatukan oleh Pakta Saadabad. Bersama-sama, kita bisa bangkit kembali, dan mengambil alih posisi kita sebagai penguasa wilayah ini."
 SSB_expand_turkeys_military_infrastructure: "[TUR.GetAdjective] Korps Pendaki Gunung"
 SSB_expand_turkeys_military_infrastructure_desc: "[TUR.GetNameDefCap] penuh dengan pegunungan, dan sebagai hasilnya, pasukan [TUR.GetAdjective] sangat ahli dalam pertempuran Pendaki Gunung. Berbagi informasi dan teknologi dengan perjanjian ini bermanfaat bagi semua orang."
 SSB_expand_afghanistans_military_infrastructure: "[AFG.GetAdjective] Pelatihan Gurun"
 SSB_expand_afghanistans_military_infrastructure_desc: "Tentara [AFG.GetNonIdeologyName] memiliki banyak pengalaman dalam pertempuran di gurun pasir, dan pengetahuan tentang cara menangani medan yang berat. Semua negara anggota dapat memperoleh manfaat besar dari informasi ini."
 SSB_expand_iraqs_military_infrastructure: "[IRQ.GetAdjective] Pemrosesan Sumber Daya"
 SSB_expand_iraqs_military_infrastructure_desc: "Untuk berhenti bergantung pada negara-negara yang lebih kuat, kita harus memperluas produksi sumber daya kita sendiri untuk memastikan perdagangan terjadi di dalam negara kita bila memungkinkan, sehingga meningkatkan keberlanjutan diri kita."
 SSB_expand_irans_military_infrastructure: "Perluas [PER.GetAdjective] Infrastruktur Militer"
 SSB_expand_irans_military_infrastructure_desc: "Kita perlu memperluas kapasitas industri militer di seluruh serikat pekerja, dan setiap orang harus memainkan peran mereka. Pabrik peralatan baru akan dibangun di Iran."
 SSB_expand_turkish_chromium_deposits: "[TUR.GetAdjective] Ekspor Kromium"
 SSB_expand_turkish_chromium_deposits_desc: "Ketergantungan kita pada negara-negara besar semakin besar dan menimbulkan risiko besar yang tidak dapat kita tanggung. Kita harus memperluas simpanan kromium kita untuk memastikan kita bisa mandiri dalam hal tersebut."
 SSB_expand_iranian_oil_fields: "[PER.GetAdjective] Ekspor Minyak"
 SSB_expand_iranian_oil_fields_desc: "Ketergantungan kita pada negara-negara besar semakin besar dan menimbulkan risiko besar yang tidak dapat kita tanggung. Kita harus memperluas infrastruktur sumur minyak kita untuk memastikan kita bisa mandiri dalam hal tersebut."
 SSB_form_the_saadabad_alliance: "Usulan aliansi total"
 SSB_form_the_saadabad_alliance_desc: "Pakta Saadabad dimulai sebagai pakta non-agresi yang sederhana. Aliansi ini telah berkembang menjadi lebih dari itu, dengan pembangunan militer dan ekonomi bersama, dan dengan sumber daya yang dikumpulkan bersama, inilah saatnya kita akhirnya membentuk Aliansi Saadabad yang resmi."
 SSB_combined_arms: "Senjata Gabungan"
 SSB_combined_arms_desc: "Dengan terbentuknya aliansi, sekarang saatnya mengambil langkah terakhir dalam menyatukan militer kita dan memastikan kita dapat saling membela."
 SSB_saadabad_research_cooperation: "Kerjasama Penelitian Saadabad"
 SSB_saadabad_research_cooperation_desc: "Dengan terbentuknya aliansi, langkah logis berikutnya adalah mengelompokkan penelitian dan kemampuan ilmiah kita serta membentuk Komite Sains terpadu."
 SSB_is_leader_tt: "Adalah Pemimpin Pakta Saadabad"
 SSB_basic_available_trigger_tt: "Tidak berperang dengan Anggota Pakta Saadabad mana pun"
 SSB_spirit_tooltip: "Memodifikasi §YPakta Saadabad§!:"
 SSB_flags_tt: "[PER.GetFlag][TUR.GetFlag][IRQ.GetFlag][AFG.GetFlag]"
 SSB_resource_tt: "$SSB_flags_tt$$trade_cost_for_target_factor_tt$"
 SSB_is_in_faction_tt: "Adalah anggota Aliansi Saadabad"
 SSB_accept_tt: "Kami akan memasuki pakta non-agresi dengan setiap negara yang menerima Pakta Saadabad. Kami akan mendapatkan akses ke pohon fokus bersama dengan anggota lain untuk membantu mencapai tujuan bersama."
 SSB_savak_protect_us: "SAVAK untuk Melindungi Kita Semua"
 SSB_savak_protect_us_desc: "SAVAK melakukan tugasnya dengan baik dalam melindungi negara besar kita melalui kontra intelijen, kita memiliki kesempatan untuk menawarkan perlindungan kepada seluruh anggota pakta dengan berbagi pengetahuan kontra-intelijen, sehingga memberikan manfaat bagi sekutu kita tanpa menimbulkan kerugian bagi diri kita sendiri."
 SSB_berlin_baghdad_railway_into_iran_afghanistan: "Perdagangan Bersama Melalui Kereta Api Berlin–Baghdad"
 SSB_berlin_baghdad_railway_into_iran_afghanistan_desc: "Kereta Api Berlin-Baghdad adalah pilar inti perdagangan dan ekonomi [IRQ.GetAdjective]. Kami memiliki kesempatan untuk menghubungkan jalur kereta api ini dengan jalur kereta api Ankara-Kabul dan mengizinkan negara-negara penandatangan lainnya untuk berdagang melalui jalur tersebut."
 SSB_baghlan_sugar_factory_branches: "Cabang Baru untuk Perusahaan Gula Baghlan"
 SSB_baghlan_sugar_factory_branches_desc: "Perusahaan Gula Baghlan saat ini hanya membangun pabrik di [AFG.GetNonIdeologyName]. Kita dapat mengizinkan pembangunan pabrik-pabrik baru di mana pun di negara-negara Saadabad, bukan hanya [AFG.GetNonIdeologyName], sehingga memungkinkan pertumbuhan ekonomi bersama."
 SSB_chromium_tt: "Mengimpor sumber daya dari [TUR.GetName], menambahkan §Y10§! £GFX_resources_strip|6 di §Ycapital§!."
 SSB_chromium_2_tt: "Mengimpor sumber daya dari anggota pakta lainnya yang menambahkan:\n§Y4§! £GFX_resources_strip|1, §Y5§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|5 langsung ke §Ymodal§!."
 SSB_oil_tt: "Mengimpor sumber daya dari [PER.GetName], menambahkan §Y10§! £GFX_resources_strip|1 di §Ycapital§!."
 SSB_oil_2_tt: "Mengimpor sumber daya dari anggota pakta lainnya menambahkan:\n§Y4§! £GFX_resources_strip|4, §Y5§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|6 langsung ke §Ymodal§!."
 SSB_faction_invite_tt: "Kami akan mengundang negara-negara penandatangan Saadabad dengan ideologi §YNon-Blok§! ke faksi baru kami."
 RAJ_mughal_shortcut: "Politik:\nMughhal"
 RAJ_eic_shortcut: "Perusahaan India Timur"
 RAJ_road_to_independence_shortcut: "Jalan Menuju Kemerdekaan"
 RAJ_majestys_government_shortcut: "Pemerintahan yang Setia"
 RAJ_railways_shortcut: "Kereta Api"
 RAJ_army_shortcut: "Para Petugas"
 RAJ_ammunition_factories_shortcut: "Pabrik Amunisi"
 RAJ_recruitment_shortcut: "Rekrutmen"
 RAJ_navy_shortcut: "Angkatan Laut India"
 RAJ_airforce_shortcut: "Angkatan Udara India"
 RAJ_constitution_for_the_masses: "Konstitusi untuk Massa"
 RAJ_constitution_for_the_masses_desc: "Republik Rakyat tidak bisa bergantung pada hukum kekaisaran yang lama.\nKonstitusi baru harus mencerminkan keinginan para pekerja, petani, dan mereka yang tidak memiliki tanah – bukan keinginan raja atau gubernur kolonial."
 RAJ_founding_of_the_peoples_republic: "Pendirian Republik Rakyat"
 RAJ_founding_of_the_peoples_republic_desc: "Kita telah menggulingkan tatanan lama.\nSekarang dimulailah tugas membangun tatanan baru – yang ditempa oleh rakyat, untuk rakyat, dan ditopang oleh revolusi."
 RAJ_agrarian_socialism: "Sosialisme Agraria"
 RAJ_agrarian_socialism_desc: "Revolusi dimulai di ladang.\nBiarkan tanah kembali kepada mereka yang menggarapnya, dan biarkan desa-desa mengatur dirinya sendiri atas nama kesetaraan dan keadilan."
 RAJ_urban_industrialism: "Industrialisme Perkotaan"
 RAJ_urban_industrialism_desc: "Masa depan tidak terletak pada padang rumput, namun pada pabrik.\nHanya melalui perkembangan industri yang pesat kita dapat mengamankan revolusi dan bersiap menghadapi pertempuran di masa depan."
 RAJ_urban_industrialism_tt: "Hal ini akan mengubah rencana lima tahun menjadi lebih diarahkan pada Perluasan Industri, memberikan §G+10%§! Kecepatan Pembangunan"
 RAJ_urban_industrialism_tt2: "Hal ini akan mengubah rencana lima tahun menjadi lebih diarahkan pada Sosialisme Agraria, dengan memberikan:"
 RAJ_land_of_the_tillers: "Tanah Anakan"
 RAJ_land_of_the_tillers_desc: "Para tuan tanah telah tiada, namun perjuangan masih terus berlanjut.\nKami akan mendistribusikan kembali tanah tersebut dan memutus rantai terakhir feodalisme — petak demi petak, desa demi desa."
 RAJ_focus_on_the_countryside: "Fokus pada Pedesaan"
 RAJ_focus_on_the_countryside_desc: "Kekuatan kita terletak pada jutaan orang yang menganggap tanah ini sebagai rumah mereka.\nMari kita berinvestasi pada mereka, mempersenjatai mereka, dan mengorganisir mereka — revolusi adalah milik desa."
 RAJ_decentralize_the_party: "Desentralisasi Partai"
 RAJ_decentralize_the_party_desc: "Kewenangan tidak boleh mengalir dari kantor di Indraprastha.\nBiarkan rakyat memimpin revolusi melalui dewan lokal dan soviet pedesaan."
 RAJ_industrialize_the_ganges: "Industrialisasi Sungai Gangga"
 RAJ_industrialize_the_ganges_desc: "Sungai Gangga telah memberi makan kita selama berabad-abad.\nSekarang sungai ini akan menggerakkan mesin kita, mengisi bahan bakar tungku, dan mempersenjatai pasukan kita."
 RAJ_comrades_of_the_city: "Rekan Kota"
 RAJ_comrades_of_the_city_desc: "Buruh di kota adalah garda depan.\nDengan pendidikan, peralatan dan persatuan, mereka akan memimpin Republik menuju modernitas."
 RAJ_central_comittee_authority: "Otoritas Komite Sentral"
 RAJ_central_comittee_authority_desc: "Disiplin adalah kekuatan.\nKomite Sentral akan mengawasi semua aspek pemerintahan, memastikan bahwa revolusi tidak mengarah pada kekacauan."
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry: "Arahkan Ulang Rencana Lima Tahun"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc: "Laju industrialisasi saat ini tidak mencukupi.\nKita harus memprioritaskan industri berat dan produksi baja jika kita ingin mempertahankan revolusi kita."
 RAJ_invite_soviet_industrial_experts: "Undang Pakar Industri Soviet"
 RAJ_invite_soviet_industrial_experts_desc: "Soviet mempunyai pengalaman dalam membangun basis industri dari nol.\nMari kita belajar dari model mereka dan mempercepat transformasi kita sendiri."
 RAJ_planned_economy2: "Konsolidasikan Perekonomian Terencana"
 RAJ_planned_economy2_desc: "Pasar tidak mempunyai tempat dalam revolusi.\nSetiap sumber daya, setiap pekerja, dan setiap pabrik harus memenuhi rencana lima tahun."
 RAJ_the_red_curtain_falls_over_asia: "Tirai Merah Meliputi Asia"
 RAJ_the_red_curtain_falls_over_asia_desc: "Kita sudah mengamankan tanah air kita.\nSekarang saatnya membawa api revolusi ke tetangga kita dengan kata-kata, dengan pamflet atau dengan senjata."
 RAJ_the_red_curtain_falls_over_asia_desc_tt: "Membuka keputusan untuk menyebarkan revolusi komunis ke seluruh Asia"
 RAJ_red_punjab_operation: "Operasi Punjab Merah"
 RAJ_red_punjab_operation_desc: "Modal kita rentan terhadap agresi asing. Kita harus meningkatkan zona keamanannya"
 RAJ_secure_rajahsthan: "Amankan Rajasthan"
 RAJ_secure_rajahsthan_desc: "Gurun Rajasthan tidak boleh menjadi basis kontra-revolusi.\nKami akan melibatkan negara."
 RAJ_strike_eastern_pakistan: "Serang Pakistan Timur"
 RAJ_strike_eastern_pakistan_desc: "Sayap timur [PAK.GetName] terisolasi dan tidak stabil.\nSekaranglah waktunya untuk menyerang, sebelum mereka dapat memperoleh pijakan yang tepat."
 RAJ_mass_assault: "Penyerangan Massal"
 RAJ_defenders_of_the_revolution_idea_tt: "Tambahkan teknologi: §YSerangan Massal Revolusioner§!."
 revolutionary_mass_assault: "Serangan Massal yang Revolusioner"
 RAJ_arm_the_peasantry: "Persenjatai Kaum Tani"
 RAJ_arm_the_peasantry_desc: "Revolusi harus menjangkau segala bidang.\nKami akan mendistribusikan senjata kepada milisi pedesaan yang setia, memastikan bahwa tidak ada desa yang tidak berdaya melawan reaksi."
 RAJ_every_man_a_gun: "Setiap Orang adalah Senjata"
 RAJ_every_man_a_gun_desc: "Di Republik Rakyat Tiongkok, semua warga negara adalah tentara.\nKami akan menstandardisasi pelatihan dan mempersenjatai penduduk secara massal, menjadikan negara itu sendiri sebagai benteng."
 RAJ_every_man_a_leader: "Setiap Manusia adalah Pemimpin"
 RAJ_every_man_a_leader_desc: "Kekuatan revolusioner sejati bukan berasal dari perintah, melainkan dari inisiatif.\nKami akan melatih para komandan dan pemimpin milisi setempat untuk bertindak tegas, tanpa menunggu izin."
 RAJ_defenders_of_the_revolution: "Pembela Revolusi"
 RAJ_defenders_of_the_revolution_desc: "Mereka bukan tentara. Mereka adalah penjaga sebuah ide.\nKami akan mengangkat pejuang kami yang paling disiplin dan setia menjadi korps elit, pembela tanah dan ideologi."
 RAJ_education_for_the_masses: "Pendidikan untuk Massa"
 RAJ_education_for_the_masses_desc: "Tanpa pengetahuan, revolusi akan membusuk menjadi tirani.\nMelek huruf, pendidikan politik, dan pelatihan ilmiah akan dibawa ke setiap desa dan pabrik."
 RAJ_break_the_zamindars: "Hancurkan Zamindar"
 RAJ_break_the_zamindars_desc: "Tuan tanah adalah kerangka rezim lama.\nKami akan membongkar perkebunan mereka, merampas tanah mereka, dan menyebarkan kekuasaan mereka ke angin."
 RAJ_planned_but_decentralized: "Terencana namun Terdesentralisasi"
 RAJ_planned_but_decentralized_desc: "Kami akan mempertahankan perencanaan ekonomi, namun memberikan otonomi kolektif lokal.\nEfisiensi melalui ideologi, bukan birokrasi."
 RAJ_socialist_self_reliance: "Kemandirian Sosialis"
 RAJ_socialist_self_reliance_desc: "Kita tidak akan bergantung pada impor kapitalis atau penasihat imperialis.\nIndia akan memenuhi kebutuhan pangannya sendiri, mempersenjatai dirinya sendiri, dan berdiri sendiri jika perlu."
 RAJ_quality_training: "Pelatihan Berkualitas"
 RAJ_quality_training_desc: "Kuantitas saja tidak memenangkan perang.\nKami akan menstandardisasi program pelatihan kami, meningkatkan instruksi perwira, dan meningkatkan profesionalisme angkatan bersenjata kami."
 RAJ_iron_will_indoctrination: "Indoktrinasi Kehendak Besi"
 RAJ_iron_will_indoctrination_desc: "Kekuatan tidak hanya ada pada tubuh, tetapi juga pada keyakinan.\nKami akan menanamkan disiplin mutlak, kejelasan ideologi, dan kemauan berjuang yang tak tergoyahkan dalam diri setiap prajurit."
 RAJ_purge_the_reactionaries: "Bersihkan Kaum Reaksioner"
 RAJ_purge_the_reactionaries_desc: "Tidak ada kompromi dengan dunia lama.\nMusuh revolusi, penyabot, dan elemen kontra-revolusioner akan dibasmi."
 RAJ_stopping_the_japanese_threat_into_central_asia: "Hentikan Ancaman Jepang di Asia Tengah"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc: "Ambisi Jepang tidak berakhir di perbatasan Tiongkok. Pandangan mereka kini beralih ke Asia Tengah, yang merupakan batu loncatan potensial untuk ekspansi kekaisaran lebih lanjut.\nKita harus bertindak cepat. Dengan memperkuat perbatasan timur kita, kita akan menghentikan gelombang penaklukan sebelum mencapai stepa dan sekitarnya."
