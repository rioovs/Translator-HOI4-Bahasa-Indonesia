 RAJ_linlithgows_declaration_of_war_tt: "§Y[ROOT.GetNameWithFlag]§! akan menyatakan perang terhadap setiap musuh tuannya (§Y[ENG.GetNameWithFlag]§!)."
 RAJ_linlithgows_declaration_of_war_current_effects_tt: "§Y[ROOT.GetNameWithFlag]§! menyatakan perang terhadap setiap musuh tuan mereka saat ini"
