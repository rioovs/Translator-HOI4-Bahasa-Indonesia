 RAJ_exploit_the_frontier_decisions_tt: "memungkinkan pengembangan produksi sumber daya di negara kita dan permintaan hak sumber daya di Burma."
 RAJ_concessions_to_the_industrialists_chances_tt: "§Y$RAJ_investments_from_local_leaders$§! akan fokus terutama pada §YIndustri Sipil§! dan pada tingkat yang lebih rendah pada §YIndustri Militer§!."
 RAJ_empower_provincial_authorities_chances_tt: "§Y$RAJ_investments_from_local_leaders$§! akan membagi fokus secara merata antara §YIndustri Sipil§!, §YIndustri Militer§! dan §YInfrastruktur Pertahanan§!."
 RAJ_his_majestys_loyal_government_break_free_tt: "Untuk sepenuhnya membebaskan diri kita perlu menyelesaikan ketiga fokus batu penjuru §Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! dan §Y$RAJ_holding_the_gates_of_india$§!."
 RAJ_loyalist_branch_capstone_focuses_become_free_tt: "Penyelesaian ketiga fokus utama §Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! dan §Y$RAJ_holding_the_gates_of_india$§! akan §Gmenghapus pembatasan perubahan tingkat otonomi ke§! §YGratis§!."
