 light_tank_destroyer_brigade: "Penghancur Tank Ringan"
 light_tank_destroyer_brigade_desc: "Penghancur Tank adalah kendaraan lapis baja dengan meriam lebih besar dari biasanya dalam dudukan tetap sebagai pengganti kubah. Penghancur Tank Ringan didasarkan pada sasis Tank Ringan, yang berarti cukup lincah namun tidak membawa meriam yang terlalu kuat dibandingkan penghancur tank yang lebih berat."
 medium_tank_destroyer_brigade: "Penghancur Tank Sedang"
 medium_tank_destroyer_brigade_desc: "Penghancur Tank adalah kendaraan lapis baja dengan meriam lebih besar dari biasanya dalam dudukan tetap sebagai pengganti kubah. Penghancur Tank Sedang didasarkan pada sasis Tank Sedang, artinya cukup lincah dan membawa daya tembak yang sangat disegani."
 heavy_tank_destroyer_brigade: "Penghancur Tank Berat"
 heavy_tank_destroyer_brigade_desc: "Penghancur tank berat yang kubahnya dihilangkan untuk membawa meriam yang jauh lebih besar dalam dudukan tetap."
 super_heavy_tank_destroyer_brigade: "Penghancur Tank Super Berat"
 super_heavy_tank_destroyer_brigade_desc: "Sasis tank super berat dengan meriam raksasa dalam dudukan tetap sebagai pengganti kubah."
 modern_tank_destroyer_brigade: "Penghancur Tank Modern"
 modern_tank_destroyer_brigade_desc: "Sasis Tank Modern yang dipasangi meriam jauh lebih besar sebagai pengganti kubah."
