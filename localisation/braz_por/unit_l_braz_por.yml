 airborne_light_armor: "Lapis Baja Ringan Lintas Udara"
 airborne_light_armor_desc: "Menggunakan kendaraan lapis baja sangat ringan dan mekanisme glider yang inovatif, divisi lapis baja lintas udara bukan lagi angan-angan semata. Keunggulan taktis dari pengerahan yang begitu cepat dan tak terduga sangat sulit diabaikan."
 mountaineers_ski: "Pasukan Ski"
 category_mountaineers: "Semua Pasukan Gunung"
 category_paratroopers: "Semua Pasukan Lintas Udara"
 category_marines: "Semua Marinir"
 category_rangers: "Semua Ranger"
 category_marines_and_amphibious: "Semua Marinir dan Satuan Amfibi"
 rangers_support: "Ranger Pengintai"
 rangers_support_desc: "Ranger Pengintai adalah pasukan skirmish elit yang berspesialisasi dalam infiltrasi, pengintaian, dan pertempuran jarak dekat."
 ranger_battalion: "Ranger"
 ranger_battalion_desc: "Ranger adalah spesialis terkemuka dalam pertempuran di medan yang lebat dan bervegetasi tinggi."
 rangers: "Spesialis Medan Kasar"
 rangers_desc: "Berspesialisasi dalam infiltrasi dan kesadaran taktis, kita akan mendapatkan manfaat dari penekanan pelatihan lingkungan keras yang diterima Ranger kita."
 pioneer_support: "Pionir (Zeni Pelopor)"
 pioneer_support_desc: "Pionir adalah zeni berbakat yang mahir dalam mengamankan tumpuan pantai (beachhead), proyek zeni umum, dan mengonsolidasikan kemenangan."
 marines_shore_parties: "Regu Pendarat Pantai"
 marines_shore_parties_desc: "Sering kali menjadi yang pertama menerobos saat pendaratan, regu pantai adalah kelompok khusus zeni tempur dengan keahlian membangun pijakan kokoh di bawah tembakan musuh."
 marines_jungle_troops: "Spesialis Hutan Tropis"
 marines_jungle_troops_desc: "Mahir membersihkan medan yang rapat, marinir ini unggul dalam operasi ofensif skala besar dan tugas zeni di medan yang berat."
 marines_recon: "Program Pelatihan Berat"
 marines_recon_desc: "Tidak ada yang dapat sepenuhnya mempersiapkan manusia untuk perang, tetapi instruktur tempur kita meyakinkan bahwa pelatihan keras ini memastikan hanya prajurit paling tangguh yang lolos ke garis depan."
 marines_commandoes: "Komando Marinir"
 marines_commandoes_desc: "Marinir kita telah membuktikan kemampuannya dalam operasi jangka panjang di belakang garis musuh. Sudah saatnya kita memantapkan praktik ini dalam doktrin dan mengorganisasikan pasukan di sekitar taktik tabrak-lari yang efektif."
 marines_expeditionary: "Satuan Ekspedisi"
 marines_expeditionary_desc: "Serangan terkoordinasi memperoleh manfaat besar dari peningkatan perencanaan dan logistik antar-matra. Seiring doktrin kita berkembang, memberikan dukungan lebih besar kepada gugus tugas ini pasti akan memberi keunggulan."
 marines_expeditionary_blowtorch: "Blowtorch dan Corkscrew"
 marines_expeditionary_blowtorch_desc: "Kombinasi sempurna dari kekuatan laut, udara, dan darat khusus dapat mengamankan target apa pun. Pendekatan gabungan senjata terhadap perang ofensif ini akan menjadi manifestasi kehebatan logistik kita."
 marines_expeditionary_support: "Gugus Tugas Ekspedisi"
 marines_expeditionary_support_desc: "Pentingnya kerja sama antar-matra kini tak terbantahkan. Mendedikasikan logistik gugus tugas untuk operasi kita sungguh menjadikan pasukan kita kekuatan yang disegani."
 marines_commandos_demolition: "Pakar Pembongkaran/Pemusnahan"
 marines_commandos_demolition_desc: "Pemusnahan adalah seni yang dapat kita manfaatkan dengan baik. Sabotase mungkin taktik kotor, tetapi tak seorang pun dapat menyangkal kemanjurannya."
 marines_commandoes_mechanised: "Korps Marinir Mekanis"
 marines_commandoes_mechanised_desc: "Kemampuan untuk mengonsolidasikan kemenangan setelah pendaratan yang sukses akan semakin meningkat dengan memperlengkapi pasukan garda depan kita secara tepat. Ini membutuhkan pergeseran dalam strategi produksi dan doktrin kita."
 category_amphibious_tanks: "Lapis Baja Amfibi"
 SF_MARINES_exfiltration_effect_tt: "Komando Marinir memiliki kemampuan untuk melakukan eksfiltrasi dari provinsi pesisir mana pun."
 SF_marine_demoliton_effect_TT: "Divisi Komando Marinir akan menyebabkan §H1§! tingkat kerusakan pada semua bangunan negara strategis setelah setiap invasi laut yang berhasil."
 marines_commandoes_mechanised_non_mtg: "Pelatihan Khusus"
 marines_commandoes_mechanised_non_mtg_desc: "Mari kita tingkatkan kader pasukan khusus elit kita, meskipun dengan mengorbankan penerapannya yang lebih luas."
 northern_territory_recon_support: "Satuan Pengintai Teritorial Utara"
 northern_territory_recon_support_desc: "Dengan pengetahuan lokal dan keterampilan bertahan hidup di alam liar, Satuan Pengintai Teritorial mengawasi tanah yang paling terpencil dan keras sekalipun."
 winter_logistics_support: "Kompi Logistik Musim Dingin"
 winter_logistics_support_desc: "Menyediakan perlengkapan yang tepat bagi infanteri untuk bertempur dalam kondisi musim dingin yang membeku."
 long_range_patrol_support: "Kompi Patroli Jarak Jauh"
 long_range_patrol_support_desc: "Infanteri elit yang terampil dalam misi pengintaian dan penghancuran jauh di wilayah musuh."
 category_cavalry: "Infanteri Berkuda"
 category_vehicle_infantry: "Infanteri Bermotor & Mekanis"
 category_special_forces_leg_infantry: "Infanteri Kaki Pasukan Khusus"
 category_mobile_and_mobile_combat_sup: "Batalion Bergerak & Bantuan Tempur"
 category_support_artillery: "Artileri Bantuan"
 category_infantry_and_bicycle: "Infanteri"
 category_tank_destroyers: "Penghancur Tank"
 category_self_propelled_artillery: "Artileri Swagerak"
 category_self_propelled_anti_air: "Pertahanan Udara Swagerak"
 category_helicopter_support_companies: "Kompi Bantuan Helikopter"
 category_tank_destroyer_regimental_support: "Bantuan Resimen Penghancur Tank"
 category_self_propelled_anti_air_regimental_support: "Bantuan Resimen Pertahanan Udara Swagerak"
 category_regimental_support_artillery: "Meriam Infanteri dan Baterai Roket"
 jungle_pioneers_support: "Kompi Pionir Rimba"
 sturmtruppe_battalion: "Batalion Stosstruppen"
 sturmtruppe_battalion_desc: "Satuan infanteri serbu elit yang dilatih dan diperlengkapi untuk mendobrak garis musuh sebagai batalion penyerbu."
 assault_engineer: "Kompi Zeni Penyerbu"
 assault_engineer_desc: "Berspesialisasi dalam menembus posisi berbenteng, zeni penyerbu memadukan keahlian peledak dengan perlindungan lapis baja, memastikan mobilitas dan perbentengan bahkan di lingkungan paling ganas."
 armored_engineer: "Kompi Zeni Lapis Baja"
 armored_engineer_desc: "Kendaraan serbaguna yang diperlengkapi untuk membangun perbentengan, membersihkan rintangan, dan meningkatkan mobilitas medan perang dalam kondisi tempur."
 armored_maintenance: "Kompi Pemeliharaan Lapis Baja"
 armored_maintenance_desc: "Kendaraan khusus yang dirancang untuk mengevakuasi dan memperbaiki tank yang rusak serta unit lapis baja lainnya langsung di medan tempur."
 armored_signal: "Kompi Komunikasi Lapis Baja"
 armored_signal_desc: "Kendaraan khusus yang menyediakan kepemimpinan dan koordinasi medan perang, dilengkapi sistem komunikasi canggih untuk mengarahkan operasi dari garis depan."
 motorized_military_police: "Polisi Militer Bermotor"
 motorized_military_police_desc: "Menjaga ketertiban dan menekan perlawanan di wilayah pendudukan, serta dapat melakukan pengintaian di zona tempur aktif."
 helicopter_recon: "Pengintai Helikopter"
 helicopter_recon_desc: "Pengamat terlatih khusus yang menggunakan helikopter, mampu dengan cepat mengintai area tanpa terpengaruh medan, dan memanggil serangan presisi di tempat yang dibutuhkan."
 helicopter_transport: "Helikopter Angkut"
 helicopter_transport_desc: "Helikopter dengan kapasitas kargo yang dimodifikasi atau mengangkut pasokan dengan kabel gantung di bawahnya, membawa perlengkapan ke tempat yang dibutuhkan dengan cepat tanpa memedulikan medan darat."
 helicopter_field_hospital: "Evakuasi Medis Helikopter (Med-Evac)"
 helicopter_field_hospital_desc: "Perhatian seluruh personel! Helikopter dengan korban luka mendekat! Helikopter Med-Evac mampu mengevakuasi korban keluar dari medan perang jauh lebih cepat daripada ambulans darat biasa."
 helicopter_brigade: "Brigade Helikopter"
 helicopter_brigade_desc: "Brigade bantuan helikopter serba guna, mampu memberikan bantuan bergerak yang fleksibel di berbagai sektor operasi."
 super_heavy_artillery: "Artileri Super Berat"
 super_heavy_artillery_desc: "Satuan khusus yang dilengkapi dengan howitzer kaliber besar, dirancang untuk meluluhlantakkan perbentengan musuh dan posisi parit pertahanan yang kokoh."
 self_propelled_super_heavy_artillery: "Artileri Swagerak Super Berat"
 self_propelled_super_heavy_artillery_desc: "Howitzer kaliber masif yang dipasang pada sasis bergerak, menggabungkan daya tembak dahsyat dengan mobilitas yang ditingkatkan untuk menghancurkan pertahanan musuh."
 super_heavy_railway_gun: "$super_heavy_railway_gun_equipment$"
 super_heavy_railway_gun_desc: "$super_heavy_railway_gun_equipment_desc$"
 land_cruiser: "Penjelajah Darat (Land Cruiser)"
 land_cruiser_desc: "Mesin perang kolosal yang dipersenjatai dengan meriam kaliber kapal perang dan lapis baja terberat, namun sangat lambat dan membutuhkan konsumsi sumber daya yang sangat masif."
 strat_bomber_intercontinental: "Pesawat Pengebom Antarbenua"
