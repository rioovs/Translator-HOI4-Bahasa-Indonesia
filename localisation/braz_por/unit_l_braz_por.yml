 cavalry: "Kavaleri"
 cavalry_desc: "Infanteri berkuda. Biaya lebih tinggi, tetapi memiliki mobilitas yang baik."
 camelry: "Kavaleri Unta"
 camelry_desc: "Infanteri berunta. Biaya lebih tinggi, tetapi memiliki fleksibilitas luar biasa di padang pasir."
 elephantry: "Kavaleri Gajah"
 elephantry_desc: "Infanteri bergajah. Biaya lebih tinggi, namun sangat tangguh melawan infanteri biasa."
 light_armor: "Tank Ringan"
 light_armor_desc: "Tank berlapis baja ringan."
 medium_armor: "Tank Sedang"
 medium_armor_desc: "Tank sedang sangat fleksibel dan dapat menjalankan hampir semua tugas tempur."
 heavy_armor: "Tank Berat"
 heavy_armor_desc: "Tank terkuat dengan pelindung baja dan persenjataan dahsyat, namun lambat dan kurang fleksibel secara taktis."
 super_heavy_armor: "Tank Super Berat"
 super_heavy_armor_desc: "Tank super berat mengorbankan mobilitas dan kecepatan demi daya tembak dan lapis baja melampaui Tank Berat standar."
 motorized: "Infanteri Bermotor"
 motorized_desc: "Transportasi infanteri bermotor, seperti truk dan sepeda motor."
 mechanized: "Infanteri Mekanis"
 mechanized_desc: "Transportasi infanteri berpelindung lapis baja ringan."
 modern_armor: "Tank Modern"
 modern_armor_desc: "Tank Modern telah berevolusi untuk menghadapi sebagian besar situasi medan perang. Meriam bertenaga besar dan lapis baja miring meniadakan kebutuhan akan tank khusus."
 infantry: "Infanteri"
 infantry_desc: "Tulang punggung utama di garis depan pertempuran."
 bicycle_battalion: "Batalion Sepeda"
 bicycle_battalion_desc: "Pasukan infanteri gerak cepat yang dilengkapi sepeda untuk mobilitas tinggi di jalan raya."
 paratrooper: "Pasukan Lintas Udara (Paratrooper)"
 paratrooper_desc: "Dengan memasukkan pasukan lintas udara ke dalam angkatan darat kita, kita dapat melakukan penerobosan paksa dan menempatkan pasukan kunci di area yang sebelumnya tidak dapat diakses, membuka peluang taktis baru."
 marine: "Marinir"
 marine_desc: "Pasukan yang berspesialisasi dalam peperangan amfibi menjadi semakin tak tergantikan. Metode dan perlengkapan darurat menjadi masa lalu seiring infanteri angkatan laut kita didukung oleh kapal pendarat khusus dan pelatihan mendalam."
 marine_commando: "Komando Marinir"
 marine_commando_desc: "Pasukan khusus dalam penyerbuan amfibi. Mampu menyusup dan melancarkan serangan kejutan dari garis pantai."
 mountaineers: "Pasukan Gunung"
 mountaineers_desc: "Pertempuran di pegunungan menghadapkan pasukan pada banyak marabahaya medan, namun terkadang tak terhindarkan. Melalui pelatihan khusus di lingkungan ini, kita dapat meminimalkan risiko tersebut."
 penal_battalion: "Batalion Hukuman"
 penal_battalion_desc: "Batalion narapidana dan tahanan militer yang dikerahkan ke front pertempuran paling berbahaya."
 irregular_infantry: "Infanteri Tidak Reguler"
 irregular_infantry_desc: "Milisi lokal bersenjata."
 militia: "Milisi"
 militia_desc: "Milisi sukarelawan rakyat."
 blackshirt_assault_battalion: "Batalion Penyerbu"
 blackshirt_assault_battalion_desc: "Unit milisi elit yang dilatih dan diperlengkapi untuk beroperasi sebagai batalion penyerbu yang dilekatkan pada divisi biasa."
 maritime_patrol_plane: "Pesawat Pengebom Patroli Maritim"
 recon: "Detasemen Pengintai Kavaleri"
 recon_desc: "Mengirim kelompok kecil untuk mengintai ke depan sebelum pasukan utama bergerak memungkinkan kita mengumpulkan intelijen tentang posisi dan jumlah musuh."
 mot_recon: "Kompi Pengintai Bermotor"
 mot_recon_desc: "Memanfaatkan truk ringan dan sepeda motor, kompi pengintai dapat menjelajah lebih jauh ke depan dan mencakup area lebih luas untuk melindungi sayap pasukan."
 armored_car_recon: "Kompi Pengintai Panser Ringan"
 armored_car_recon_desc: "Dilengkapi dengan mobil lapis baja (panser), kompi pengintai dapat melancarkan perlawanan terhadap musuh dan mencegah pengintai musuh mendapatkan informasi berharga."
 light_tank_recon: "Kompi Pengintai Lapis Baja"
 light_tank_recon_desc: "Menggunakan tank ringan dalam peran pengintaian, kita dapat melakukan pengintaian dengan tembakan (reconnaissance by fire) dan memahami musuh dengan lebih baik."
 armored_car: "Mobil Lapis Baja (Panser)"
 armored_car_desc: ""
 engineer: "Kompi Zeni"
 engineer_desc: "Pembangunan perbentengan dan penembusan rintangan menjadikan zeni tempur sangat penting di medan tempur. Memberi zeni peran serbaguna memungkinkan kita mengerahkan mereka dalam situasi kritis di mana mereka dibutuhkan."
 field_hospital: "Rumah Sakit Lapangan"
 field_hospital_desc: "Memberikan pertolongan medis darurat bagi prajurit yang terluka di medan perang."
 logistics_company: "Kompi Logistik"
 logistics_company_desc: "Menangani perencanaan, permintaan, dan distribusi perbekalan serta bahan bakar untuk divisi."
 hq_support_company: "Staf Markas Besar"
 hq_support_company_desc: "Kompi staf markas besar khusus yang mengadministrasikan dan membantu aktivitas satuan."
 hq_engineer: "Staf Zeni"
 hq_engineer_desc: "Menangani hal-hal yang berkaitan dengan perbentengan serta langkah-langkah mobilitas dan kontra-mobilitas."
 hq_recon: "Staf Pengintaian"
 hq_recon_desc: "Mengumpulkan dan menganalisis data pengintaian yang diterima dari lapangan."
 hq_military_police: "Staf Polisi Militer"
 hq_military_police_desc: "Menjaga ketertiban setempat dan mengatur lalu lintas pergerakan divisi di seluruh area operasi tentara."
 hq_maintenance: "Staf Perencanaan Pemeliharaan"
 hq_maintenance_desc: "Merencanakan dan mendukung upaya pemeliharaan & perbaikan pada tingkat angkatan darat."
 hq_field_hospital: "Staf Grup Medis/Rumah Sakit"
 hq_field_hospital_desc: "Bertanggung jawab atas administrasi medis serta menyediakan evakuasi dan perawatan korban yang efisien di wilayah operasi angkatan darat."
 hq_logistics: "Staf Logistik & Layanan"
 hq_logistics_desc: "Memprioritaskan dan mengalokasikan distribusi pasokan dan bahan bakar di dalam tubuh angkatan darat."
 hq_signal: "Staf Komunikasi & Intelijen"
 hq_signal_desc: "Mengoordinasikan upaya komunikasi di dalam angkatan darat, sekaligus mengumpulkan dan melacak intelijen yang diperoleh."
 hq_infantry: "Pengamanan Markas Besar Infanteri"
 hq_infantry_desc: "Batalion infanteri berukuran kecil, didedikasikan untuk pengamanan markas besar."
 hq_motorized: "Pengamanan Markas Besar Bermotor"
 hq_motorized_desc: "Infanteri dengan kendaraan bermotor, memungkinkan relokasi markas besar yang lebih cepat."
 hq_armored_car: "Pengamanan Markas Besar Mobil Lapis Baja"
 hq_armored_car_desc: "Mobil lapis baja mengawal markas besar, memadukan mobilitas dengan perlindungan dan kemampuan pengintaian luar biasa."
 hq_paratrooper: "Pengamanan Markas Besar Lintas Udara"
