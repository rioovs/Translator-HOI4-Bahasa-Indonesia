 HUN_treaty_of_triannon: "Perjanjian Trianon"
 HUN_treaty_of_triannon_desc: "Perjanjian Trianon, dalam banyak hal, mirip dengan Perjanjian Versailles, yang melumpuhkan militer kita dan mencegah persenjataan kembali. Melihatnya diubah atau dihapuskan harus menjadi tujuan utama kami. Kita dapat melakukan hal ini dengan mengupayakan pemulihan hubungan dengan Entente Kecil, mengusulkan Perjanjian Bled, atau dengan menolak perjanjian tersebut sama sekali. Opsi terakhir akan dianggap sangat agresif dan mungkin akan memicu respons yang kuat."
