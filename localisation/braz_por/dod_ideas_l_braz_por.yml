 YUG_idea_croatian_opposition: "Oposisi Kroasia"
 YUG_idea_croatian_opposition_desc: "Perwakilan politik Kroasia telah mendorong pembentukan organisasi federal Kerajaan. Jika tuntutan mereka tidak dipenuhi, mereka akan terus menentang setiap tindakan pemerintah pusat. Mereka bahkan mungkin melancarkan pemberontakan jika mereka yakin waktunya tepat."
 YUG_idea_slovene_nationalism: "Nasionalisme Slovenia"
 YUG_idea_slovene_nationalism_desc: "Orang-orang Slovenia sudah lama menginginkan negara mereka sendiri. Meskipun mereka telah menerima aturan kami, mereka tidak terlalu antusias dengan hal tersebut. Para industrialis Slovenia jarang berinvestasi pada bisnis lokal dan tampaknya lebih memilih membelanjakan uang mereka di luar negeri."
 YUG_idea_slovene_nationalism_2: "Pemerintahan Sendiri Slovenia"
 YUG_idea_slovene_nationalism_2_desc: "Pemerintahan Slovenia yang telah dilimpahkan jauh lebih bersedia bekerja sama dengan kami untuk membangun kembali militer kami, namun konsesi yang diberikan kepada mereka berarti bahwa kami memiliki lebih sedikit kendali atas bagaimana pabrik-pabrik mereka dijalankan."
 YUG_idea_croats_suppressed: "Nasionalisme Kroasia Ditekan"
 YUG_idea_religious_freedoms_guaranteed: "Kebebasan Beragama Dijamin"
 YUG_idea_macedonian_opposition: "Oposisi Makedonia"
 YUG_idea_macedonian_opposition_desc: "Masyarakat Makedonia belum sepenuhnya menerima identitas mereka sebagai orang Serbia dan terus menuntut hak-hak khusus. Dukungan politik dari Bulgaria tidak diragukan lagi mempunyai peranan."
 YUG_idea_macedonian_opposition_1: "Oposisi Ringan Makedonia"
 YUG_idea_macedonian_opposition_1_desc: "Dengan memberikan sedikit konsesi politik kepada masyarakat Makedonia dan menghentikan upaya kami untuk memaksakan identitas Serbia pada mereka, ketegangan di Makedonia telah sedikit mereda untuk saat ini."
