 form_empire_of_zion: "Kekaisaran Sion"
 create_empire_of_zion_tt: "Menjadikan setiap negara bagian di Pesisir Karibia dan Florida yang dikuasai oleh [ROOT.getNameDef] atau negara subjek sebagai inti dari [ROOT.getNameDef]"
 ETH_liberate_SUD: "Bebaskan [SUD.GetName]"
 ETH_liberate_SUD_tt: "Dapatkan tujuan perang pada pemilik wilayah [SUD.GetAdjective]."
 ETH_liberate_DJI: "Bebaskan [DJI.GetName]"
 ETH_liberate_DJI_tt: "Dapatkan tujuan perang pada pemilik wilayah [DJI.GetAdjective]."
