 SWI_declare_the_alpine_union_desc: "Keinginan para pekerja dan masyarakat Pegunungan Alpen tidak dapat dihentikan, karena kita terus membebaskan wilayah dari kuk kaum borjuis, kita telah melampaui [SWI.GetNonIdeologyName] dan negara kita harus mencerminkan hal itu."
