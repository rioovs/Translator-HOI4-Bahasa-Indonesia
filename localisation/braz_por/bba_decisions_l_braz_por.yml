 ETH_offer_peace_SOM_tt: "Tawarkan perdamaian kepada pemilik wilayah [SOM.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [SOM.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
 ETH_offer_peace_UGA: "Tawarkan Perdamaian untuk Kemerdekaan [UGA.GetAdjective]"
 ETH_offer_peace_UGA_tt: "Tawarkan perdamaian kepada pemilik wilayah [UGA.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [UGA.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
 ETH_freedom_at_gunpoint_offer_peace: "Tawarkan perdamaian kepada [FROM.Capital.OWNER.GetName] untuk [FROM.GetAdjective] Kemerdekaan"
 ETH_freedom_at_gunpoint_offer_peace_tt: "§Y[FROM.Capital.OWNER.GetName]§! akan ditawari perdamaian sebagai imbalan atas pelepasan klaim atas §Y[FROM.GetAdjective]§! wilayah yang saat ini dikuasai §Y[THIS.GetName]§!. Jika mereka setuju, §Y[THIS.GetName]§! mendapatkan subjek di wilayah yang dikuasai yang merupakan inti dari §Y[FROM.GetName]§!.\n\n§R[ROOT.GetFlag][ROOT.GetNameDefCap] akan meninggalkan faksi mana pun yang menjadi bagiannya jika perdamaian diterima dan faksi tersebut berperang dengan [FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]!§!\n\n§R[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName] hanya akan mempertimbangkan tawaran perdamaian jika [ROOT.GetFlag][ROOT.GetName] menguasai [FROM.GetAdjective] wilayah!§!"
 ETH_exploit_french_weakness_category: "Manfaatkan Kelemahan Perancis"
 ETH_exploit_french_weakness_category_desc: "Jika waktunya tepat, kami akan mengendalikan [268.GetName] sementara [FRA.GetAdjective] diganggu dengan urusan yang lebih dekat dengan rumah."
 ETH_take_DJI: "Misalnya Somaliland Perancis"
 ETH_take_DJI_tt: "Kita harus menunggu saat yang tepat untuk menyerang. Ketika Somaliland Perancis tidak diduduki, kita akan dapat dengan cepat mengambil alih wilayah tersebut. Prancis kemungkinan besar akan menerima kepemilikan kami atas wilayah tersebut, namun kami tetap harus bersiap menghadapi konflik yang lebih luas."
 ETH_take_DJI_cancel_tt: "§RAkan dibatalkan jika $FRA_VICHY_fascism$ tidak lagi menjadi pengendali Somaliland Prancis atau jika mereka menempatkan divisi di negara bagian tersebut!§!"
 ETH_take_DJI_danger_tt: "§R$FRA_VICHY_fascism$ dapat melakukan pembalasan karena mencaplok wilayah mereka!§!"
 ETH_reintegrate_former_territory_category: "Rebut kembali Kekaisaran"
 ETH_reintegrate_former_territory_category_desc: "Tugas besar yang ada di hadapan kita terletak pada reklamasi tanah hak kita dan penyatuan rakyat [ETH.GetAdjective] di bawah pemimpin besar kita, [ETH.GetLeader]."
