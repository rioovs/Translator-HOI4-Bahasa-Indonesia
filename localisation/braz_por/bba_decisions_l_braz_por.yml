 ETH_liberate_UGA_tt: "Dapatkan tujuan perang pada pemilik wilayah [UGA.GetAdjective]."
 ETH_offer_peace_SUD: "Tawarkan Perdamaian untuk Kemerdekaan [SUD.GetAdjective]"
 ETH_offer_peace_SUD_tt: "Tawarkan perdamaian kepada pemilik wilayah [SUD.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [SUD.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
 ETH_offer_peace_DJI: "Tawarkan Perdamaian untuk Kemerdekaan [DJI.GetAdjective]"
 ETH_offer_peace_DJI_tt: "Tawarkan perdamaian kepada pemilik wilayah [DJI.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [DJI.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
 ETH_offer_peace_KEN: "Tawarkan Perdamaian untuk Kemerdekaan [KEN.GetAdjective]"
 ETH_offer_peace_KEN_tt: "Tawarkan perdamaian kepada pemilik wilayah [KEN.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [KEN.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
 ETH_offer_peace_ERI: "Tawarkan Perdamaian untuk Kemerdekaan [ERI.GetAdjective]"
 ETH_offer_peace_ERI_tt: "Tawarkan perdamaian kepada pemilik wilayah [ERI.GetAdjective] jika mereka setuju untuk melepaskan klaim atas wilayah yang saat ini dikuasai [ETH.GetName]. [ERI.GetAdjective] wilayah yang saat ini dikuasai akan menjadi boneka [ETH.GetAdjective]."
