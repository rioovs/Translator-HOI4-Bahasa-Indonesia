 ITA_bop_slander_the_duce: "£BoP_left_texticon Memfitnah Duce"
 ITA_bop_slander_the_duce_desc: "Italia sedang berjuang di berbagai bidang karena ketidakmampuan [ITA.GetLeader]. Mungkin ini saatnya untuk kepemimpinan baru?"
 ITA_bop_criticize_the_war: "£BoP_left_texticon Mengkritik Upaya Perang"
 ITA_bop_criticize_the_war_desc: "Pasukan kita yang gagah berani sedang berjuang karena kepemimpinan yang tidak kompeten, logistik yang buruk, dan peralatan yang tidak memadai. Masalah-masalah ini harus diperbaiki!"
 ITA_bop_question_the_army: "£BoP_left_texticon Mempertanyakan Loyalitas TNI Angkatan Darat"
 ITA_bop_question_the_army_desc: "Dengan kejadian-kejadian baru-baru ini yang menunjukkan ketidakefektifan Angkatan Darat, banyak orang bertanya-tanya seberapa loyalnya pasukan tersebut terhadap Italia dan sistem fasis."
 ITA_bop_question_the_airforce: "£BoP_left_texticon Mempertanyakan Loyalitas TNI AU"
 ITA_bop_question_the_airforce_desc: "Dengan kejadian baru-baru ini yang menunjukkan ketidakefektifan Angkatan Udara, banyak orang bertanya-tanya seberapa loyal pasukan tersebut terhadap Italia dan sistem fasis."
 ITA_bop_question_the_navy: "£BoP_left_texticon Mempertanyakan Loyalitas TNI AL"
 ITA_bop_question_the_navy_desc: "Dengan kejadian baru-baru ini yang menunjukkan ketidakefektifan Angkatan Laut, banyak orang bertanya-tanya seberapa loyal pasukan tersebut terhadap Italia dan sistem fasis."
 ITA_bop_military_parade: "£BoP_right_texticon Mengadakan Parade Militer"
 ITA_bop_military_parade_desc: "Sudah saatnya kita merayakan kemenangan dan kegagahan tentara kita dan membiarkan rakyat Italia menghujani mereka dengan kasih sayang."
 ITA_bop_send_support: "£BoP_right_texticon Kirim Dukungan Militer ke [FROM.GetName]"
 ITA_bop_send_support_desc: "Saudara-saudara ideologis kita sedang berperang. Sebagai pendiri fasisme, tugas kita adalah memastikan mereka menang!"
 ITA_bop_praise_the_army: "£BoP_right_texticon Puji Tentara"
 ITA_bop_praise_the_army_desc: "Pria dan wanita pemberani yang bertugas di Angkatan Darat kita adalah tulang punggung [ITA.GetName] yang aman dan stabil. Mereka pantas mendapatkan pemujaan dari masyarakat Italia!"
 ITA_bop_praise_the_airforce: "£BoP_right_texticon Puji TNI AU"
 ITA_bop_praise_the_airforce_desc: "Pria dan wanita pemberani yang bertugas di Angkatan Udara kita adalah tulang punggung [ITA.GetName] yang aman dan stabil. Mereka pantas mendapatkan pemujaan dari masyarakat Italia!"
 ITA_bop_praise_the_navy: "£BoP_right_texticon Puji Angkatan Laut"
