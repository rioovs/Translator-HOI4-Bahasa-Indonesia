 SWI_purchase_democratic_planes_fighters: "Beli pesawat tempur dari [FROM.GetName]"
 SWI_purchase_democratic_planes_fighters_desc: "Pertahanan udara di atas [ROOT.GetName] tidak bisa menunggu sampai kita memiliki kapasitas untuk memproduksi angkatan udara kita sendiri, jadi untuk sementara kita harus bergantung pada [FROM.GetName] untuk pesawat tempur kita."
 SWI_purchase_democratic_planes_cas: "Beli pembom dari [FROM.GetName]"
 SWI_purchase_democratic_planes_cas_desc: "Meskipun kapasitas industri kita masih terbatas, kita harus mengandalkan [FROM.GetName] untuk memasok angkatan udara kita dengan pesawat pengebom yang kita perlukan untuk mendukung pasukan kita di medan perang."
