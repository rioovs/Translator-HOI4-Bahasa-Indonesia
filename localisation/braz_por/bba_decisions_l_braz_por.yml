 SWI_renounce_guiding_principles: "Tinggalkan Prinsip-Prinsip Panduan"
 SWI_renounce_guiding_principles_desc: "[SWI_renounce_guiding_princpiples_desc_loc]"
 SWI_renounce_guiding_principles_desc_cantons: "Komitmen awal kami untuk melanjutkan pelimpahan kekuasaan ke wilayah-wilayah dan Majelis Federal mungkin terlalu dini. Keadaan saat ini memperjelas bahwa Dewan Federal yang lebih energik dan berdaya diperlukan untuk kelangsungan hidup kita."
 SWI_renounce_guiding_principles_desc_council: "Komitmen awal kami untuk mengkonsolidasikan kekuasaan ke dalam Dewan Federal mungkin salah arah. Situasi saat ini memerlukan demokrasi yang lebih langsung dan inklusif, yang mengutamakan stabilitas dan partisipasi masyarakat."
