 ETH_move_capital_to_axum: "Pindahkan ibu kota ke Axum"
 ETH_move_capital_to_axum_desc: "Kota kuno Axum seharusnya menjadi ibu kota baru Kekaisaran."
 ETH_prevents_further_capital_moves_tt: "Pemindahan Ibu Kota ke Yerusalem mencegah perpindahan Ibu Kota lebih lanjut."
