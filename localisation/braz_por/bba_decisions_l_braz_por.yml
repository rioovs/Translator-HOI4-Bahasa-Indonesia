 SWI_no_confederation_councilor: "Tidak ada anggota dewan konfederasi"
 SWI_no_confederation_councilor_desc: "Mempertahankan kursi anggota dewan yang kosong terlalu lama pasti akan menyebabkan oportunis yang tidak kompeten mencoba mengisi peran tersebut demi keuntungan mereka sendiri."
