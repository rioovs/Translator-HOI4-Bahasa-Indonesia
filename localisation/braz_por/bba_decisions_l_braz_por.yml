l_braz_por:
 #### Ethiopia
 # Balance of Power
 ETH_recall_balco_safo_decision: "Ingat $ETH_balcho_safo$ dari masa pensiun"
 ETH_recall_balco_safo_decision_desc: "$ETH_balcho_safo$ mungkin merupakan penentang keras ambisi kaisar untuk mereformasi dan memusatkan [ROOT.GetName]. Tapi di saat yang sama, dia adalah seorang pahlawan, setelah bertempur di pertempuran Mekelle dan kemenangan gemilang di Adwa. Dia juga seorang pemimpin yang populer, jadi dengan memintanya untuk sekali lagi mengangkat senjata demi [ROOT.GetName] kita tidak hanya akan mendapatkan komandan yang berpengalaman, tetapi kemungkinan besar juga akan ada lebih banyak tentara yang berkumpul di panji-panji kita."
 balcho_safo_recalled_tt: "Dapatkan 1 unit §Y$irregular_infantry$§!."
 ETH_bop_increase_mesafint_privileges: "Tingkatkan Hak Istimewa Mesafint"
 ETH_bop_increase_mesafint_privileges_desc: "Ras lokal adalah yang paling cocok untuk memerintah wilayah tersebut. Otoritas pusat di [ROOT.capital.GetCapitalVictoryPointName] tidak perlu peduli dengan detail kecil. Namun, kita perlu berhati-hati agar kita tidak bergerak terlalu cepat, atau mereka akan menggunakan kekuatannya untuk membebaskan diri sepenuhnya."
 ETH_bop_increase_the_power_of_the_mekwanint: "Meningkatkan Kekuatan Mekwanint"
 ETH_bop_increase_the_power_of_the_mekwanint_desc: "Menteri-menteri yang ditunjuk harus mempunyai kekuasaan yang lebih besar atas urusan-urusan daerah. Kita harus berupaya memindahkan kekuasaan dari Mesafint ke Mekwanint, secara bertahap memindahkan kendali ke pemerintah pusat, dan [ROOT.GetLeader]. Hal ini tentu saja akan mengecewakan Ras, tetapi hal ini perlu dilakukan jika kita ingin membangun [ROOT.GetName] yang kuat"
 ETH_bop_privileges_changed: "Kurang dari setahun sejak perubahan hak istimewa terakhir"
 ETH_bop_increase_anarchist_influence: "Tingkatkan Dukungan untuk Kaum Anarkis"
 ETH_bop_increase_communist_influence: "Meningkatkan Dukungan untuk Komunis"
 ETH_bop_increase_anarchist_influence_desc: "Kita perlu memastikan bahwa kaum anarkis mempunyai pengaruh yang cukup untuk mencegah pemerintah pusat membatasi hak-hak masyarakat lagi. Kita harus memulai kampanye propaganda untuk meningkatkan dukungan masyarakat terhadap tujuan kita."
 ETH_bop_increase_communist_influence_desc: "Kita perlu memastikan bahwa komunis memegang kendali atas keputusan yang diambil oleh pemerintah pusat. Kita harus memulai kampanye propaganda untuk meningkatkan dukungan masyarakat terhadap perjuangan kita sebelum negara ini terpecah belah."
# Decisions Menu
 ETH_placeholder_political_category: "PLACEHOLDER - UNTUK DIHAPUS"
 ETH_placeholder_political_category_desc: "PLACEHOLDER - AKAN DIHAPUS\n- Desentralisasi / Sentralisasi: [GetPlaceholderBopText]"
 war_escalation_text: "£generic_war_escalation_text_icon Tingkat Eskalasi Perang: §Y[?ETH.ETH_war_escalation_level]§!"
 war_escalation_level_tt: "§YEskalasi Perang Saat Ini§!\nTingkat Eskalasi meningkat seiring berjalannya waktu, dan juga oleh berbagai tindakan yang diambil Italia.\n\nLamanya Perang: §Y+[?ETH.ETH_escalation_time_increase_total]§!\nItalia telah melancarkan serangan besar-besaran (+1) [GetItalianRenewedOffensiveText]\n\nItalia telah mengerahkan setidaknya 25 divisi reguler (+1) [GetItalian20DivisionsText]\n\nItalia telah mengerahkan setidaknya 300 pesawat (+1) [GetItalianAircraftsText] [GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_escalation_icon_tt: "§YEskalasi Perang§!\nEfek dipicu oleh peningkatan eskalasi perang, berdasarkan level:\nLevel 3:\n§YLiga Bangsa-Bangsa§!: Embargo Permintaan dibuka.\n§YEthiopia§!: Reputasi Internasional Tumbuh\nLevel 4:\n§YLeague of Nations§!: Pembelian Senjata dibuka.\n§YItalia§!: Kepedulian Masyarakat Italia\nLevel 5:\n§YLeague of Nations§!: Menutup Suez terbuka.\n§YItalia§!: Tentara Afrika Kecewa\nLevel 6:\n§YLeague of Nations§!: Brigade Internasional tidak terkunci.\n§YEthiopia§!: Semangat Tentara Meningkat\n§YItalia§!: Kerusuhan di Koloni\nLevel 7:\n§YLiga Bangsa-Bangsa§!: Internasional Mediasi dibuka.\n§YItalia§!: Upaya Perang Pertanyaan Publik Italia\nLevel 8:\n§YEthiopia§!: Desersi Musuh\n§YItalia§!: Desersi Massal\nLevel 9:\n§YEthiopia§!: Bertahan Melawan Segala Tantangan\nLevel 10:\n§YEthiopia§!: Perang Rakyat\n§YItalia§!: Kegaduhan di Koloni"
 war_escalation_1_tt: "Level 1\nTidak ada efek"
 war_escalation_2_tt: "Level 2\nTidak ada efek"
 war_escalation_3_tt: "Level 3\n§YLeague of Nations§!: Ethiopia dapat meminta embargo.\n§YEthiopia§!: Reputasi Internasional Tumbuh, §YMinta Embargo§! fokus terbuka."
 war_escalation_4_tt: "Level 4\n§YLeague of Nations§!: Ethiopia dapat meminta senjata.\n§YItalia§!: Kepedulian Masyarakat Italia\n§YEthiopia§!: §YPembelian Senjata§! fokus tidak terkunci."
 war_escalation_5_tt: "Level 5\n§YLeague of Nations§!: Ethiopia dapat meminta penutupan Suez.\n§YItalia§!: Tentara Afrika Kecewa\n§YEthiopia§!: §YMenutup Suez§! fokus tidak terkunci"
 war_escalation_6_tt: "Level 6\n§YLeague of Nations§!: Ethiopia dapat meminta brigade internasional.\n§YEthiopia§!: Semangat Angkatan Darat Ditingkatkan, §YBrigade Internasional§! fokus terbuka.\n§YItalia§!: Kerusuhan di Koloni"
 war_escalation_7_tt: "Level 7\n§YLeague of Nations§!: Ethiopia dapat meminta mediasi internasional.\n§YItalia§!: Pertanyaan Publik Italia Upaya Perang\n§YEthiopia§!: §YMediasi Internasional§! fokus terbuka."
 war_escalation_8_tt: "Level 8\n§YEthiopia§!: Desersi Musuh\n§YItalia§!: Desersi Massal"
 war_escalation_9_tt: "Level 9\n§YEthiopia§!: Bertahan Melawan Segala Rintangan"
 war_escalation_10_tt: "Level 10\n§YEthiopia§!: Perang Rakyat\n§YItalia§!: Kegaduhan di Koloni"
 ETH_trigger_fulfilled: "£trigger_yes"
 ETH_trigger_not_fulfilled: "£trigger_no"
 ETH_war_escalation_threat: "Eskalasi Perang Italia-Ethiopia"
 ETH_major_offensive_threat: "Serangan Besar dalam Perang Italia-Ethiopia"
 ETH_improve_country_category: "Kemajuan [ROOT.GetName]"
 ETH_improve_country_category_desc: "[ETH.GetNameDefCap] sebagian besar merupakan perekonomian pertanian, yang dikelola oleh petani subsisten. Untuk melakukan industrialisasi, kita memerlukan investasi besar-besaran pada infrastruktur elektrifikasi dan transportasi sehingga lebih banyak pekerja dapat berpindah dari pertanian ke pabrik."
 ETH_build_local_resistance_force: "Bangun Kekuatan Perlawanan di [FROM.GetName]"
 ETH_build_local_resistance_force_desc: "Kita harus melakukan segala yang kita bisa untuk mendukung gerakan perlawanan di wilayah pendudukan. Hal ini akan sangat membantu dalam melemahkan cengkeraman [ITA.GetAdjective] di wilayah tersebut dan membuat mereka tetap diduduki sementara kita mempersiapkan diri untuk pembebasan [ETH.GetName] yang tak terelakkan."
 ETH_build_local_resistance_force_increase_tt: "Merekrut §G1§! divisi Arbegnoch yang bisa bangkit di negara bagian."
 ETH_build_local_resistance_force_cost: "£command_power §G25§!"
 ETH_build_local_resistance_force_cost_blocked: "£command_power §R25§!"
 ETH_building_local_resistance_flag: "Saat ini sedang merekrut pejuang perlawanan"
 ETH_launch_large_scale_uprising: "Pemberontakan Skala Besar"
 ETH_launch_large_scale_uprising_desc: "Rakyat [ETH.GetName] sangat ingin menggulingkan pasukan pendudukan asing di tanah air mereka. Kita hanya perlu memberi mereka dorongan untuk melakukannya."
 ETH_has_readied_uprising_tt: "Telah menyiapkan pemberontakan di setidaknya 1 negara bagian"
 ETH_italian_uprising_warning_mission: "Pemberontakan di [ETH.GetName] akan segera terjadi"
 ETH_italian_uprising_warning_mission_desc: "Rumornya adalah [ETH.GetLeader] telah menyerukan kepada pemberontak di negara tersebut untuk bangkit dalam serangan terkoordinasi terhadap [ROOT.GetName]."
 ETH_italian_uprising_warning_mission_tt: "Pemberontakan dimulai"
 ETH_coup_haile_selassie_imru: "Menghasut kudeta istana"
 ETH_coup_haile_selassie_imru_desc: "$ETH_ras_imru_haile_selassie$ yang berpikiran demokratis telah memerintah negara tanpa kehadiran kaisar. Tidak diragukan lagi, ia dipandang oleh massa sebagai pahlawan sejati [ROOT.GetName] setelah memimpin negara dalam perang. Seruan untuk [ROOT.GetName] yang lebih demokratis semakin keras. Mungkin sekaranglah saatnya untuk benar-benar melakukan perubahan di [ROOT.GetNameDef]."
 ETH_palace_coup_tt: "§Y$ETH_ras_imru_haile_selassie$§! melancarkan upaya kudeta"
 ETH_formal_request_to_host: "Ajukan permintaan resmi kepada pemerintah [?ETH.host_nation.GetAdjective]."
 ETH_formal_request_to_host_desc: "Pemerintah [?ETH.host_nation.GetAdjective] harus didekati dan diminta untuk mendukung penuh [ROOT.GetLeader] dalam perang melawan [ITA.GetNameDef]. Ini akan memulai bagian terakhir dari penaklukan kembali bangsa kita."
 ETH_false_flag_operation_decision: "Luncurkan operasi bendera palsu"
 ETH_false_flag_operation_decision_desc: "Untuk meyakinkan tuan rumah bahwa [ITA.GetName] tidak dapat dipercaya, kita perlu melakukan serangan terhadap pos perbatasan Jerman, dan menyalahkan pihak Italia."
 ETH_throw_grand_party_for_host: "Adakan pesta mewah"
 ETH_throw_grand_party_for_host_desc: "Pesta besar di kediaman [ROOT.GetLeader] akan memberikan peluang bagus untuk melakukan lobi informal selain yang lebih resmi."
 ETH_influence_host_cost: "§G10§! £GFX_ETH_imperial_treasury"
 ETH_influence_host_cost_blocked: "§R10§! £GFX_ETH_imperial_treasury"
 organization_of_african_unity_member_tt: "Adalah Organisasi Negara Anggota Persatuan Afrika"
 ETH_take_loans: "Pinjaman Pribadi"
 ETH_take_loans_desc: "Kita dapat mencoba meningkatkan dana yang tersedia, menggunakan Aset Kekaisaran sebagai jaminan."
 ETH_take_loans_tt: "£GFX_ETH_imperial_treasury Perbendaharaan: §G+10§!"
 ETH_fundraising_campaign_decision: "Kampanye Penggalangan Dana"
 ETH_fundraising_campaign_decision_desc: "Setelah Pidato Radio oleh [ROOT.GetLeader], dukungan terhadap tujuan kami di Amerika telah berkembang pesat. Kita harus mengambil keuntungan dari hal ini dan memulai kampanye penggalangan dana di sana dan di tempat lain, untuk membangun perbendaharaan kekaisaran, dan dengan demikian mendanai penaklukan kembali tanah air kita."
 ETH_low_fundraising_effect_tt: "£GFX_ETH_imperial_treasury Perbendaharaan: §G+5§!"
 ETH_medium_fundraising_effect_tt: "£GFX_ETH_imperial_treasury Perbendaharaan: §G+15§!"
 ETH_high_fundraising_effect_tt: "£GFX_ETH_imperial_treasury Perbendaharaan: §G+20§!"
 ETH_very_high_fundraising_effect_tt: "£GFX_ETH_imperial_treasury Perbendaharaan: §G+30§!"
 ETH_set_up_gideon_force_decision: "Angkatan Gideon"
 ETH_set_up_gideon_force_decision_desc: "Pemerintah [?ETH.host_nation.GetAdjective] tampaknya bersedia mensponsori pasukan ekspedisi kecil untuk secara langsung mendukung serangan kami terhadap penjajah. Kita harus segera mendorong pembentukan unit seperti itu!"
 ETH_set_up_gideon_force_decision_tt: "Seorang komandan pasukan khusus [?ETH.host_nation.GetAdjective] untuk sementara bergabung dengan tentara [ROOT.GetAdjective]."
 ETH_recruit_mercenaries_host_cost: "§G[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_host_cost_blocked: "§R[?ETH_recruit_mercenaries_cost]§! £GFX_ETH_imperial_treasury"
 ETH_recruit_mercenaries_from_host: "Rekrut tentara bayaran"
 ETH_recruiting_mercenaries_flag: "Merekrut tentara bayaran"
 ETH_recruit_mercenaries_from_host_desc: "Selalu ada orang yang akan berjuang demi koin."
 ETH_recruit_aircrews_from_host: "Rekrut pilot [?ETH.host_nation.GetAdjective]"
 ETH_recruit_aircrews_from_host_desc: "Tentunya ada [?ETH.host_nation.GetAdjective] pilot dan teknisi servis yang bersedia melakukan perdagangannya dalam layanan [ROOT.GetName], jika koinnya cukup bagus."
 ETH_recruit_merchant_marines_from_host: "Dapatkan kapal sipil"
 ETH_recruit_merchant_marines_from_host_desc: "Kami akan membutuhkan kapal dan pelaut untuk mengangkut tentara kami kembali ke Afrika"
 ETH_buy_rifles_from_host: "Beli senapan buatan [?ETH.host_nation.GetAdjective]."
 ETH_buy_rifles_from_host_desc: "Untuk membiayai penaklukan kembali [ROOT.GetName], diperlukan pengorbanan. Menghabiskan kekayaan pribadi raja untuk membeli senjata, mungkin merupakan hal yang menyedihkan, tetapi masa-masa sulit memerlukan tindakan yang sangat mendesak."
 ETH_buy_rifles_from_host_cost: "§G[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_buy_rifles_from_host_cost_blocked: "§R[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_securing_arms_deals_flag: "Mengamankan kesepakatan senjata"
 ETH_will_be_re_enabled_tt: "Jika sudah selesai, keputusan ini akan tersedia kembali dalam [?ETH_re_enable_time_international_actions] hari."
 ETH_buy_tanks_from_host: "Beli kelebihan tangki [?ETH.host_nation.GetAdjective]"
 ETH_buy_tanks_from_host_desc: "Tentara [ROOT.GetAdjective] sangat kekurangan tank. Ada kelebihan tangki-tangki tua yang tersedia di pasar, sehingga menghabiskan sebagian dari perbendaharaan kekaisaran untuk membeli beberapa tangki tersebut akan memperbaiki situasi. Tangki yang tua lebih baik daripada tidak ada tangki sama sekali."
 ETH_buy_support_equipment_from_host: "Dapatkan peralatan pendukung"
 ETH_buy_support_equipment_from_host_desc: "Senapan bukanlah segalanya. Tentara membutuhkan helm, sepatu bot, granat dan yang lainnya. Kita bisa mengalihkan sebagian dari perbendaharaan kekaisaran untuk memperoleh barang-barang ini."
 ETH_chitet_category: "Chitet"
 ETH_chitet_category_desc: "Pemberlakuan pungutan nasional memberi negara akses terhadap banyak pasukan dengan sangat cepat. Retribusi telah memberikan manfaat yang baik bagi negara selama berabad-abad. Ketika perang usai, mereka semua dapat dipulangkan ke kehidupan sipil mereka."
 ETH_raise_the_chitet: "Angkat Chitetnya"
 ETH_raise_the_chitet_desc: "Mengumpulkan pungutan regional di semua negara bagian yang dikuasai Ethiopia."
 ETH_disband_the_chitet: "Bubarkan Chitet"
 ETH_disband_the_chitet_desc: "Ketika perang usai, sekarang saatnya membiarkan retribusi kembali ke rumah mereka."
 ETH_chitet_cooldown_tt: "Chitet dapat dibangkitkan kembali [?var_ETH_chitet_cooldown] hari setelah dibubarkan."
 ETH_chitet_disband_tt: "[?var_ETH_chitet_cooldown] hari sejak Chitet dibubarkan"
 ETH_disband_the_chitet_mission: "Retribusi Kembali ke Rumah"
 ETH_disband_the_chitet_mission_desc: "Sudah waktunya untuk membubarkan chitet dan membiarkan para prajurit kembali ke kehidupan sipil mereka."
 ETH_raise_the_chitet_effect_tt: "Menaikkan Retribusi"
 ETH_number_levy_units_less_than_five: "Kurang dari 5 divisi retribusi aktif."
 ETH_second_italo_ethiopian_war_category: "Perang Italia-Ethiopia ke-2"
 ETH_second_italo_ethiopian_war_category_desc: "[Get2ndItaloEthiopianWarDesc]"
 ETH_2ndItaloEthiopianWar: "[ITA.GetName] telah menginvasi tanah air kami secara tidak sah. Meskipun kita adalah anggota penuh Liga Bangsa-Bangsa, dunia gagal mengambil tindakan dan memandang konflik tersebut sebagai konflik kecil kolonial.\nKita harus membuktikan kepada LoN bahwa ini adalah perang agresi skala penuh yang dilakukan oleh satu negara anggota terhadap negara anggota lainnya, dan dengan demikian memaksa dunia untuk mengambil tindakan terhadap [ITA.GetLeader]."
 ITA_2ndItaloEthiopianWar: "Liga Bangsa-Bangsa sejauh ini gagal mengambil tindakan terhadap kami, hanya memberikan perlawanan simbolis terhadap penaklukan kami atas Ethiopia. Namun, semakin lama konflik berlarut-larut, dan semakin banyak pasukan reguler yang kita kerahkan, semakin besar risiko mereka mulai ikut campur dalam urusan kita. Kita harus menyelesaikan perang ini sebelum [ETH.GetLeader] berhasil meyakinkan Liga Bangsa-Bangsa untuk mengambil tindakan."
 ETH_christmas_offensive_mission: "Serangan Natal"
 ETH_christmas_offensive_mission_desc: "Pasukan kami masih bergerak maju, namun kami kehilangan momentum. Energi yang ditimbulkan oleh serangan balik akan segera habis."
 ETH_time_based_war_escalation_mission: "Eskalasi Perang Bertahap"
 ETH_time_based_war_escalation_mission_desc: "Semakin lama perang berlangsung, dunia akan semakin khawatir. Untuk setiap enam bulan yang berlalu, sejak dimulainya bulan Oktober 1935, Eskalasi Perang akan meningkat satu bulan."
 ETH_started_uprising_flag: "Pemberontakan skala besar sedang berlangsung"
 ETH_hold_the_north_mission: "Pegang Utara"
 ETH_hold_the_north_mission_desc: "Serangan Natal berhasil memukul mundur pasukan Italia, tetapi kami gagal mengusir mereka ke laut seperti yang kami rencanakan. Mereka akan berkumpul kembali dan menyerang dengan kekuatan yang lebih besar, dan kita harus menunjukkan bahwa kita mampu mempertahankan negara kita."
 ETH_hold_the_north_mission_success: "[ETH.GetName] berhasil menguasai Utara (+1) £trigger_yes"
 ITA_conquer_the_north_mission: "Taklukkan Ethiopia Utara"
 ITA_conquer_the_north_mission_desc: "Ini adalah waktunya untuk mengambil kembali posisi yang kita kalahkan dari Ethiopia dalam serangan mereka."
 ETH_war_escalation_inc_tt: "Eskalasi perang meningkat sebesar §G1§!"
 ETH_war_deescalation_inc_tt: "Eskalasi perang berkurang sebesar §R1§!"
 ITA_war_escalation_inc_tt: "Eskalasi perang meningkat sebesar §R1§!"
 ITA_war_deescalation_inc_tt: "Eskalasi perang berkurang sebesar §G1§!"
 ETH_hold_the_south_mission: "Pegang Selatan"
 ETH_hold_the_south_mission_desc: "Front Selatan masih tenang hingga saat ini, namun pihak Italia sudah pasti bersiap untuk melancarkan serangan lain dari wilayah kekuasaan mereka di selatan. Kita harus menahan mereka, dan menunjukkan kepada dunia bahwa klaim yang mereka dan boneka Somalia mereka katakan adalah melanggar hukum."
 ETH_hold_the_south_mission_success: "[ETH.GetName] sukses selenggarakan Selatan (+1) £trigger_yes"
 ITA_conquer_the_south_mission: "Taklukkan Ethiopia Selatan"
 ITA_conquer_the_south_mission_desc: "Orang Etiopia mungkin tidak mengharapkan adanya dorongan di wilayah selatan. Kita harus melemahkan semangat tentara mereka, dan mengurangi dukungan mereka di Liga Bangsa-Bangsa, dengan segera menangkap [837.GetName] dan [836.GetName]."
 ETH_hold_addis_ababa_mission: "Tahan Addis Ababa"
 ETH_hold_addis_ababa_mission_desc: "Dengan bertahan di ibu kota, kami berharap dapat membuat masyarakat internasional memahami bahwa orang Italia harus dihentikan dengan kekerasan."
 ETH_hold_the_capital_mission_success: "[ETH.GetName] sukses menggelar Addis Ababa (+1) £trigger_yes"
 ETH_conquer_addis_ababa_mission: "Contohnya Addis Ababa"
 ETH_conquer_addis_ababa_mission_desc: "Kita harus mengambil ibu kota dan memaksa [ETH.GetName] untuk menyerah."
 ETH_hold_harar_mission: "Tahan [835.GetName]"
 ETH_hold_harar_mission_desc: "Setelah kehilangan wilayah Selatan, kita harus mencoba bertahan di Harar, dan mempertahankan jalur kita ke laut."
 ETH_harar_lost_tt: "Kehilangan kendali atas Harar akan menurunkan dukungan perang di kalangan masyarakat."
 ETH_conquer_harar_mission: "Taklukkan [835.GetName]"
 ETH_conquer_harar_mission_desc: "Orang Etiopia sedang berkumpul kembali di pegunungan. Kita perlu menangkap [835.GetCapitalVictoryPointName] sebelum mereka berhasil mempertahankan posisinya."
 ETH_hold_harar_mission_success: "[ETH.GetName] sukses menyelenggarakan [835.GetName] (+1) £trigger_yes"
 ETH_buy_rifles: "Beli Senjata Kecil"
 ETH_buy_rifles_desc: "Sekarang kita mempunyai akses ke pasar senjata internasional, kita perlu mengamankan kesepakatan senjata. Kebutuhan pertama dan terpenting kami adalah menyediakan senapan untuk infanteri kami, sehingga mereka dapat melawan penjajah dengan setara."
 ETH_buy_artillery: "Beli Artileri"
 ETH_buy_artillery_desc: "Kami sangat membutuhkan artileri modern untuk mendukung tentara kami. Prioritas kita adalah mengamankan kesepakatan senjata untuk pembelian senjata berat."
 ETH_buy_support_equipment: "Beli Peralatan Pendukung"
 ETH_buy_support_equipment_desc: "Kita tidak hanya membutuhkan senjata, kita juga sangat membutuhkan peralatan komunikasi dan peralatan pendukung secara umum. Mendapatkan lebih banyak manfaat dari hal ini adalah hal yang paling diprioritaskan."
 ETH_buy_anti_tank_guns: "Beli Senjata Anti-Tank"
 ETH_buy_anti_tank_guns_desc: "Kami mencoba melawan baju besi Italia dengan kaleng bensin dan senapan berburu hewan besar. Jika kita ingin mengalahkan Italia, kita membutuhkan senjata anti-tank yang bagus dalam jumlah besar."
 ETH_request_sent_flag: "Menunggu Respons"
 ETH_host_confirmed_flag: "Telah mengkonfirmasi Negara Tuan Rumah Pengasingan"
 ETH_host_country_decision: "Meminta izin untuk mendirikan Pemerintahan di Pengasingan di [FROM.GetName]"
 ETH_host_country_decision_desc: "Kita perlu bersiap menghadapi kemungkinan terburuk. Jika negara ini jatuh, kita memerlukan basis di mana kita dapat melanjutkan perlawanan. Kita harus mendekati pemerintah [FROM.GetAdjective] dan meminta izin untuk mendirikan pemerintahan pengasingan di sana."
 ETH_host_country_decision_tt: "§Y[ROOT.GetLeader]§! akan dapat membentuk §YPemerintahan di Pengasingan§! di §Y[FROM.GetNameWithFlag]§! jika fokus §Y$ETH_boarding_the_train$§! telah selesai sebelum penyerahan.\n\nMembuka fokus tambahan yang akan tersedia sebagai Pemerintahan di Pengasingan di [FROM.GetNameDef]."
 ITA_expand_regional_control: "Perluas Kontrol Regional ke [FROM.GetName]"
 ITA_expand_regional_control_desc: "Kami akan memperluas kendali [ITA.GetAdjective] atas [FROM.GetName]."
 ITA_discredit_haile_selassie_cd_tt: "[GetDecisionCooldownTooltip] §Y180§! hari."
 expanding_regional_control_flag: "Memperluas Kendali Regional"
 ETH_italian_occupation_category: "[ITA.GetAdjective] pekerjaan [ETH.GetName]"
 ETH_italian_occupation_category_desc: "Meskipun kami terpaksa mundur dari tanah air kami, perang masih jauh dari selesai. Kami akan menggunakan segala cara yang tersedia untuk menjamin kebebasan bagi orang-orang [ETH.GetAdjective] sekali lagi."
 ETH_italian_occupation_category_map_category_name: "Kelola pekerjaan [ITA.GetAdjective] di [ETH.getNameDef]"
 ETH_italian_control_mission: "[ITA.GetName] mengintegrasikan [?ITA.state_integrated.GetName]"
 ETH_italian_control_mission_desc: "[ITA.GetName] mencoba untuk menegaskan kendali atas wilayah kami melalui kekerasan. Kita harus mendorong mereka kembali."
 ETH_italian_control_mission_tt: "[?ITA.state_integrated.GetName] akan menjadi milik [ITA.GetNameWithFlag]."
 ETH_retake_territory_mission: "Rebut kembali Wilayah"
 ETH_retake_territory_mission_desc: "Setengah dari [ROOT.GetName] berada di bawah kendali musuh. Masyarakat Ras setempat kecewa karena wilayah mereka telah ditinggalkan, dan pemerintah pusat dipertanyakan. Ada pembicaraan untuk membuat kesepakatan dengan Italia. Mengambil kembali kendali atas wilayah [ROOT.GetAdjective] adalah satu-satunya cara untuk meyakinkan rakyat akan kemenangan."
 controls_50_percent_of_territory: "[ROOT.GetNameWithFlag] menguasai sedikitnya §Y50%§! dari total jumlah negara bagian yang dimiliki.\nSaat ini dikuasai: [?num_owned_controlled_states|Y0]\nKebutuhan: [?controlled_owned_50|Y0]"
 controls_more_than_50_percent_of_territory: "[ROOT.GetNameWithFlag] menguasai lebih dari §Y50%§! dari total jumlah negara bagian yang dimiliki.\nSaat ini dikuasai: [?num_owned_controlled_states|Y0]\nKebutuhan: [?controlled_owned_more_than_50|Y0]"
 ETH_road_reform_BoP: "Perbaikan Jalan"
 ETH_Education_reform_decentralized_BoP: "Reformasi Pendidikan Lokal"
 ETH_Education_reform_decentralized_BoP_tt: "Pendidikan berada di garis depan perjuangan kita melawan struktur kekuasaan yang sudah ketinggalan zaman. Kita perlu mendidik generasi muda dengan cara yang membuat mereka mempertanyakan otoritas dan menolak pandangan kuno kaum tradisionalis."
 ETH_Education_reform_centralized_BoP: "Reformasi Pendidikan Negara"
 ETH_Education_reform_centralized_BoP_tt: "Memastikan generasi penerus dapat memasuki dunia kerja tentu saja menjadi prioritas kami. Namun, kita mempunyai kesempatan untuk mendorong generasi mendatang ke arah moral yang lebih dapat diterima, sehingga memastikan bahwa mereka tetap setia kepada [ETH.GetLeader]."
 ETH_road_reform_local_BoP: "Mendukung Pembangunan Jalan Lokal"
 ETH_road_reform_highways_BoP: "Mendukung Pembangunan Jalan Raya Ibu Kota"
 ETH_road_reform_local_BoP_desc: "Jaringan jalan raya di [ETH.GetName] semakin menjadi penghalang bagi pembangunan ekonomi lebih lanjut. Saat ini kita mempunyai pengaruh politik untuk mendorong modernisasi jalan yang akan memberikan manfaat bagi masyarakat umum di seluruh negeri dengan menciptakan jalan yang lebih baik antara kota dan desa."
 ETH_road_reform_highways_BoP_tt: "Jaringan jalan raya di [ETH.GetName] semakin menjadi penghalang bagi pembangunan ekonomi lebih lanjut. Dengan adanya pengaruh baru ini, kita harus mempercepat pembangunan ekonomi dan sentralisasi dengan membangun jalan raya yang lebih baik di sekitar ibu kota."
 ETH_officer_reforms_centralized_BoP: "Perkenalkan Perwira Militer Politik"
 ETH_officer_reforms_decentralized_BoP: "Meningkatkan Meritokrasi di Militer"
 ETH_officer_reforms_centralized_BoP_tt: "Untuk memastikan militer tidak menentang rezim kita, kita harus memastikan kesetiaan mereka dengan memperkenalkan pejabat politik."
 ETH_officer_reforms_decentralized_BoP_tt: "Untuk memastikan militer efektif, kita harus meningkatkan meritokrasi korps perwira."
 ETH_BoP_purge_communists: "Bersihkan Komunis"
 ETH_BoP_purge_communists_tt: "Perdamaian yang tidak menentu antara Black Lions dan perwira militer komunis mulai runtuh. Para perwira jelas bermaksud memusatkan kekuasaan dan menciptakan negara otoriter yang setia pada diri mereka sendiri. Kita harus melenyapkan mereka sebelum mereka menghancurkan semua yang telah kita bangun."
 ETH_BoP_purge_anarchists: "Bersihkan Kaum Anarkis"
 ETH_BoP_purge_anarchists_tt: "Perdamaian yang tidak menentu antara militer dan Black Lions mulai runtuh. Pandangan anarkis naif mereka membusuk [ETH.GetNameDef] dari dalam ke luar, membuat kita rentan terhadap serangan. Untuk menjamin keberlangsungan revolusi, kita harus menumpas Singa Hitam untuk selama-lamanya.\n\n§Y$ETH_prov_mil_admin$§! akan menjadi pemimpin §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!."
 ETH_BoP_expand_black_lions: "Tingkatkan Divisi Black Lion"
 ETH_BoP_expand_black_lions_tt: "Komunis tidak bisa dipercaya, kita harus waspada kalau-kalau mereka berusaha merebut kekuasaan untuk diri mereka sendiri. Oleh karena itu kami akan menambah jumlah divisi Black Lion untuk mencegah mereka melakukan tindakan apa pun."
 ETH_BoP_expand_red_guards: "Tingkatkan Divisi Pengawal Merah"
 ETH_BoP_expand_red_guards_tt: "Singa Hitam tidak dapat dipercaya untuk memerintah dan pada akhirnya harus digulingkan dari kekuasaan. Kita harus meningkatkan jumlah unit Pengawal Merah di bawah komando kita sehingga kita dapat mengambil keuntungan dari situasi ketika Black Lions gagal."
 ETH_electrify_state: "Elektrifikasi [FROM.GetName]"
 ETH_electrify_state_desc: "Menyalurkan listrik ke desa-desa setempat merupakan bagian penting dalam modernisasi negara."
 ETH_electrify_state_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 ETH_improve_communications_in_state: "Meningkatkan Infrastruktur Komunikasi di [FROM.GetName]"
 ETH_improve_communications_in_state_desc: "Sarana komunikasi yang efisien sangat penting bagi kemajuan negara."
 ETH_improve_communications_in_state_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!"
 ETH_invest_in_state_industry: "Investasi di Industri [FROM.GetName]"
 ETH_invest_in_state_industry_desc: "Jika [FROM.GetName] ingin memiliki industri apa pun yang sukses, maka diperlukan investasi negara, baik secara langsung atau melalui penguasa lokal."
 ETH_invest_in_state_industry_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
 prospecting_ongoing_flag: "Pencarian sumber daya sedang berlangsung"
 ETH_prospect_for_resources: "Pencarian Sumber Daya"
 ETH_prospect_for_resources_desc: "Ada sumber daya alam di [FROM.GetName] yang dapat ditemukan. Menggali dan mengebor cukup jauh akan membuat [ROOT.GetName] menjadi negara yang lebih kaya."
 ETH_japanese_industrial_investments_decision: "Investasi Industri Jepang"
 ETH_japanese_industrial_investments_decision_desc: "Investor Jepang sedang mencari peluang investasi baru di Afrika. [FROM.GetName] bisa menjadi tempat yang sempurna untuk beberapa Industri yang dibiayai Jepang."
 ETH_japanese_investments_flag: "Investasi Jepang saat ini sedang berlangsung"
 ETH_local_development_state_grows_mission: "Pertumbuhan [?ETH.ETH_local_state.GetName]"
 ETH_local_development_state_grows_mission_desc: "[?ETH.ETH_local_state.GetName] makmur di bawah aturan saat ini. Hasil pertanian meningkat, kota-kota dan desa-desa pun berkembang."
 ETH_max_japanese_investments_tt: "Investasi dapat dilakukan di maksimal §Y_3§! negara bagian. Jumlah negara bagian yang berinvestasi di: §Y[?ETH_japanese_invesment_states]§!"
 ETH_japanese_infrastructure_investments_decision: "Investasi Infrastruktur Jepang"
 ETH_japanese_infrastructure_investments_decision_desc: "Investor Jepang sedang mencari peluang investasi baru di Afrika. [FROM.GetName] bisa menjadi tempat yang sempurna untuk beberapa pembangunan infrastruktur yang dibiayai Jepang."
 ETH_japanese_dockyard_investments_decision: "Investasi Pembuatan Kapal Jepang"
 ETH_japanese_dockyard_investments_decision_desc: "Investor Jepang sedang mencari peluang investasi baru di Afrika. [FROM.GetName] bisa menjadi tempat yang sempurna untuk beberapa fasilitas pembuatan kapal yang dibiayai Jepang."
 ETH_local_development_industry_grows_mission: "Ekspansi industri di [?ETH.ETH_local_state.GetName]"
 ETH_local_development_industry_grows_mission_desc: "Manufaktur skala kecil di [?ETH.ETH_local_state.GetName] sedang booming. JIKA kita terus mendorong hal ini, maka seluruh [ROOT.GetName] akan merasakan manfaatnya."
 ETH_local_development_arms_industry_grows_mission: "Produksi senjata lokal di [?ETH.ETH_local_state.GetName]"
 ETH_local_development_arms_industry_grows_mission_desc: "Pembuat senjata lokal di [?ETH.ETH_local_state.GetName] telah meningkatkan produksi secara signifikan. Hal ini mencapai tingkat dimana seluruh negara dapat memperoleh manfaat."
 ETH_local_development_improved_production_mission: "Komite konstruksi lokal terbentuk di [?ETH.ETH_local_state.GetName]"
 ETH_local_development_improved_production_mission_desc: "Komite lokal di [?ETH.ETH_local_state.GetName] sedang memperbaiki kondisi kerja, peralatan dan metode."
 ETH_local_development_improved_production_mission_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_anti_colonialism_category: "Anti-Kolonialisme"
 ETH_anti_colonialism_category_desc: "Kami akan melakukan segala yang kami bisa untuk mendukung gerakan perlawanan di seluruh kawasan sampai penderitaan imperialisme akhirnya teratasi."
 ETH_anti_colonialism_map_category_name: "Negara kolonial di mana perlawanan dapat didukung"
 ETH_support_resistance_decision: "Mendukung resistensi anti-[FROM.OWNER.GetAdjective] di [FROM.GetName]"
 ETH_support_resistance_decision_desc: "Dukung pejuang perlawanan untuk menggulingkan kekuasaan [FROM.Owner.GetAdjective]."
 ETH_arm_resistance_decision: "Persenjatai perlawanan anti-[FROM.OWNER.GetAdjective] di [FROM.GetName]"
 ETH_arm_resistance_decision_desc: "Pejuang perlawanan senjata di negara bagian ini."
 ETH_support_independence_decision: "Mendukung [FROM.GetAdjective] Kemerdekaan"
 ETH_support_independence_decision_desc: "Mendukung [FROM.GetAdjective] Kemerdekaan"
 ETH_independence_support_progress_flag: "Saat ini mendukung gerakan kemerdekaan"
 ETH_support_resistance_decision_cost: "£command_power §Y25§!"
 ETH_support_resistance_decision_cost_blocked: "£command_power §R25§!"
 ETH_anti_colonialism_decision: "Propaganda Anti-[FROM.GetAdjective]"
 ETH_anti_colonialism_decision_desc: "[FROM.GetAdjective] imperialisme di Afrika harus diakhiri. Dunia perlu bangun dan menyadari bahwa masa kolonialisme [FROM.GetAdjective] telah berakhir. Rakyat [FROM.GetNameDef] harus menekan para pemimpin mereka untuk melepaskan koloni mereka yang tertindas di Afrika."
 ETH_demand_peace_decision: "Menuntut [?FROM.previous_overlord.GetAdjective] pengakuan [FROM.GetNameDef]"
 ETH_demand_peace_decision_desc: "Orang-orang pemberani [FROM.GetName] telah bangkit melawan tirani [?FROM.previous_overlord.GetAdjective]. Kita harus bertindak sekarang, dan menggunakan segala cara yang diperlukan untuk memaksa [?FROM.previous_overlord.GetNameDef] mundur dari wilayah [FROM.GetAdjective]."
 ETH_demand_peace_decision_tt: "§Y[?FROM.previous_overlord.GetNameWithFlag]§! ditekan untuk mengakhiri perang dengan §Y[FROM.GetNameWithFlag]§!"
 ETH_currently_demanding_peace_flag: "Saat ini Menuntut Perdamaian"
 ETH_social_reforms_category: "Reformasi Sosial Anarko-Komunis"
 ETH_social_reforms_category_desc: "Kita memerlukan gelombang reformasi sosial untuk mengatasi perpecahan budaya dan agama di [ETH.GetName] agar kita bisa tetap bersatu."
 ETH_education_reforms_decision: "Reformasi Sistem Pendidikan"
 ETH_education_reforms_decision_desc: "Untuk mencegah berkembangnya gerakan reaksioner di masa depan, kita harus mereformasi sistem pendidikan sehingga anak-anak tumbuh menjadi orang dewasa yang berpikiran bebas dan bukannya antek kapitalis."
 ETH_collectivization_reforms_decision: "Reformasi Pertanahan"
 ETH_collectivization_reforms_decision_desc: "Tanah [ETH.GetNameDefCap] telah dimiliki oleh bangsawan selama berabad-abad meskipun digarap oleh rakyat. Kita mempunyai kesempatan untuk menjadikan setiap orang sebagai tuan mereka sendiri dengan mendistribusikan kembali tanah tersebut."
 ETH_secularization_reforms_decision: "Reformasi Sekularisasi"
 ETH_secularization_reforms_decision_desc: "[ETH.GetNameDefCap] mengandung banyak perbedaan budaya dan agama, yang asal usulnya sudah ada sejak berabad-abad yang lalu. Kita perlu melepaskan diri dari takhayul jika kita ingin mencegah terjadinya kekerasan sektarian di masa depan."
 ETH_freedom_at_gunpoint_category: "Kebebasan di bawah todongan senjata"
 ETH_freedom_at_gunpoint_category_desc: "Negara-negara tetangga kita masih terjebak di bawah kekuasaan imperialis. Sudah waktunya kita mengubah pengalaman perang dan kekuatan ekonomi baru kita menuju pembebasan Afrika dengan menggunakan satu-satunya bahasa yang dipahami oleh kekuatan kolonial. Kekerasan."
 ETH_freedom_at_gunpoint_dynamic: "Bebaskan [FROM.GetName] dari [FROM.Capital.OWNER.GetName]"
 ETH_freedom_at_gunpoint_dynamic_tt: "Dapatkan §Ymembebaskan tujuan perang§! melawan §Y[FROM.Capital.OWNER.GetName]§!"
 ETH_has_active_liberation_goal: "Memiliki tujuan perang pembebasan yang aktif"
 form_ethiopian_empire_category: "Perluasan Kekaisaran [ETH.GetAdjective]"
 form_ethiopian_empire_category_desc: "[ROOT.GetNameDefCap] sudah menjadi Kekaisaran yang perkasa, namun sekarang sudah tidak seperti dulu lagi, dan dengan bimbingan yang tepat, Kekaisaran ini bisa menjadi lebih kuat dari sebelumnya."
