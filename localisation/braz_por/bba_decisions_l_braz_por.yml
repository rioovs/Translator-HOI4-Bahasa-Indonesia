############### African Union ################
 african_union_category: "Organisasi Persatuan Afrika"
 african_union_category_desc: "Kami akan menciptakan lembaga-lembaga yang menyatukan talenta dan sumber daya dari seluruh benua dan semakin mendekatkan diri pada unifikasi politik. Hanya dengan berdiri bersama dan bekerja sama, masyarakat Afrika dapat berharap untuk tidak lagi menjadi subyek konflik."
 promote_org_of_african_unity: "Promosikan organisasi di [FROM.GetName]"
 invite_to_org: "Undang [FROM.OWNER.GetNameDef] ke Organisasi"
 invite_to_org_tt: "Negara-negara dengan ideologi yang berbeda dengan Anda akan cenderung tidak menerima tawaran keanggotaan."
 invite_to_ACB: "Undang [FROM.GetName] ke Bank Sentral Afrika"
 invite_to_ACB_tt: "Negara-negara yang ideologinya berbeda dengan Anda kemungkinan besar tidak akan menerima integrasi ekonomi dengan Anda."
 invite_to_org_alliance: "Undang [FROM.GetName] ke Perjanjian Pertahanan Bersama"
 invite_to_org_alliance_tt: "Negara-negara yang ideologinya berbeda dengan Anda akan kecil kemungkinannya untuk menandatangani perjanjian pertahanan."
 invite_to_exec_council: "Undang [FROM.GetName] ke Dewan Eksekutif"
 invite_to_exec_council_tt: "Negara-negara dengan ideologi berbeda tidak akan mendukung penyatuan politik dengan Anda."
 threaten_org_member: "Mengancam kepemimpinan [FROM.GetName]"
 integrate_into_org: "Integrasikan [FROM.GetName] ke dalam Uni Afrika"
 leave_org_of_african_unity: "Tinggalkan Organisasi Persatuan Afrika"
 threaten_member_state: "Mengintimidasi kepemimpinan [FROM.GetAdjective]"
 threaten_member_state_desc: "Kami akan mengirimkan pesan kepada para pemimpin [FROM.GetNameDef] bahwa jika mereka tidak menyetujui integrasi lebih dalam dengan Organisasi Persatuan Afrika, akan ada konsekuensi serius bagi mereka secara pribadi..."
 threaten_member_state_tt: "Pemimpin negara yang terintimidasi akan lebih mungkin menerima proposal integrasi selama §G60 hari§! keputusan ini aktif."
