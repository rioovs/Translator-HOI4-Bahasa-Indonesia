 SWI_promoting_to_president_TT: "§Y[?SWI.temp_character_president.GetName]§! Akan diberhentikan sebagai penasihat politik dan dipilih sebagai Presiden [SWI.GetNameDef]. Setelah presiden baru terpilih dalam satu tahun, §R[?SWI.temp_character_president.GetSheHe] tidak akan menjabat lagi sebagai Penasihat Politik atau Presiden Konfederasi.§!"
