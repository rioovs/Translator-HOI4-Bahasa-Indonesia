######## COUNCIL SYSTEM ###########
 SWI_federal_council_decisions_category: "Dewan Federal"
 SWI_federal_council_decisions_category_desc: "[SWI_get_correct_council_category_description]"
 SWI_federal_council_decisions_category_desc_dem: "Dewan Federal Swiss telah berdiri sejak tahun 1848 sebagai puncak pendukung Demokrasi Swiss. [SWI_get_temp_explanation_of_council_system]\n\n§YPresiden Konfederasi Swiss:§!\n[SWI_GetPresidentName]\n\n§YAnggota Dewan Utama:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_fasc: "Ini mungkin bukan dewan yang sama seperti dulu tetapi rezim baru yang mulia yang dipimpin oleh [SWI.GetLeader] masih membutuhkan dewan yang kuat untuk menegakkan kehendak Führer di [?SWI.SWI_biggest_fascist.GetNameDef].\n\n§YAnggota Dewan Pimpinan:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_alt: "Pemimpin [SWI.GetNameDef], [SWI.GetLeader] tidak dapat diharapkan untuk menjalankan seluruh tugas negara dengan misi penting tersebut, oleh karena itu [SWI.GetLeader.GetSheHe] harus bergantung pada dewan untuk mendelegasikan beberapa fungsi Majelis yang sudah tidak ada lagi.\n\n§YAnggota Dewan Pimpinan:§!\n[SWI_GetCouncilor1name]\n[SWI_GetCouncilor2name]\n[SWI_GetCouncilor3name]"
 SWI_recently_finished_president_initiative: "Menyelesaikan Inisiatif Dewan baru-baru ini"
 SWI_recently_finished_president_initiative_desc: "Dengan terbatasnya kekuasaan Presiden Konfederasi dan Dewan Federal, kita harus menunggu hingga inisiatif bersama lainnya dapat diupayakan. Memberi dewan kekuasaan yang lebih besar mungkin merupakan cara untuk melakukan lebih banyak inisiatif ini, namun kita harus mempertimbangkan apakah hal tersebut merupakan jalan terbaik bagi nilai-nilai demokrasi yang sudah tertanam dalam di Swiss."
 SWI_defense_fund_drive: "Penggalangan Dana Pertahanan"
 SWI_defense_fund_drive_desc: "Mempertahankan diri melawan calon penjajah memerlukan dana yang tidak dimiliki oleh Pemerintah Federal Swiss, namun kita dapat berkampanye agar warga Swiss menyediakan dana tersebut, dengan inisiatif yang bersifat bottom-up."
 SWI_swiss_democratic_tradition_campaign: "Kampanye Tradisi Demokrat Swiss"
 SWI_swiss_democratic_tradition_campaign_desc: "Kita dapat mengingatkan masyarakat Swiss akan tradisi demokrasi kita, demokrasi tertua di Eropa, dan mungkin satu-satunya yang benar."
 SWI_rally_workers: "Pekerja Reli"
 SWI_rally_workers_desc: "Para pekerja dapat menjadi bagian integral dari pertahanan [SWI.GetName], sehingga kita dapat mendorong partisipasi antusias mereka dalam industri militer [SWI.GetAdjective] dan menanggung pengorbanan yang diperlukan."
 SWI_anti_fascist_drive: "Penggerak Anti-fasis"
 SWI_anti_fascist_drive_desc: "Tidak ada tempat bagi kaum fasis di [ROOT.GetName], sebagai negara yang berdedikasi pada penentuan nasib sendiri dan kekuatan demokrasi lokal, dan negara yang bercita-cita menjadi surga bagi rakyatnya, adalah tugas kita untuk menyingkirkan setiap fasis yang masih ada di negara ini, di mana pun mereka berada."
 SWI_spouse_fascism: "Cita-cita Fasis Pasangan"
 SWI_spouse_fascism_desc: "Melihat keadaan dunia saat ini, menyelaraskan diri dengan kekuatan fasis mungkin merupakan pilihan yang paling aman, kita bisa mulai menyebarkan propaganda fasis sehingga masyarakat siap untuk melakukan penataan kembali nilai-nilai kita."
 SWI_focus_on_swiss_unity: "Fokus pada Persatuan Swiss"
 SWI_focus_on_swiss_unity_desc: "Kita dapat mendorong populasi [SWI.GetAdjective] yang situasi ini perlu untuk mengesampingkan perbedaan-perbedaan kita, dalam hal bahasa, kelas, latar belakang dan kecenderungan politik, untuk mengumpulkan sumber daya dan upaya kita dalam mempertahankan persatuan dan keberagaman yang mendefinisikan [SWI.GetNameDef]."
 SWI_isolate_switzerland: "Isolasikan Swiss"
 SWI_isolate_switzerland_desc: "Kita bisa fokus melakukan segala yang kita bisa untuk memastikan [SWI.GetName] bisa berdiri sendiri dan mandiri, yang mungkin merupakan satu-satunya kesempatan kita untuk menghindari kehilangan kemerdekaan yang kita miliki."
 SWI_militarization_drive: "Dorongan Militerisasi"
 SWI_militarization_drive_desc: "Kita dapat mengalihkan fokus kita ke arah perluasan mesin perang [SWI.GetAdjective] sehingga kita dapat mempertahankan diri dan bahkan mungkin mengambil inisiatif dan mencegah serangan mereka."
 SWI_expand_covert_operations: "Perluas Operasi Terselubung"
 SWI_expand_covert_operations_desc: "Kita dapat meningkatkan sumber daya spionase sehingga kita dapat mempengaruhi urusan dunia demi kepentingan kita sambil tetap menjaga netralitas."
 SWI_expand_arms_industry: "Memperluas Industri Senjata"
 SWI_expand_arms_industry_desc: "Kita dapat meningkatkan kapasitas kita untuk mengembangkan senjata baru dan memproduksinya dengan kecepatan yang signifikan sehingga kita tidak perlu bergantung pada kekuatan asing untuk pertahanan kita."
 SWI_support_humanitarian_efforts: "Mendukung Upaya Kemanusiaan"
 SWI_support_humanitarian_efforts_desc: "Kita tidak bisa berpangku tangan sementara kekejaman terjadi di sekitar kita. Kami mempunyai kewajiban moral untuk membantu kaum tertindas di Eropa dan memberi mereka suaka di tanah kami."
 SWI_diplomatic_mission: "Misi Diplomatik"
 SWI_diplomatic_mission_desc: "Kita bisa melakukan perjalanan diplomatik ke negara-negara lain untuk menjalin hubungan lebih dekat dengan negara-negara tersebut, dan meredakan keraguan mereka terhadap netralitas kita, serta menghindari potensi invasi dari negara-negara tersebut."
 SWI_appease_fascists: "Menenangkan Kaum Fasis"
 SWI_appease_fascists_desc: "Kita bisa menerima tatanan baru Eropa dan belajar hidup berdampingan dengan tetangga kita yang fasis. Hal ini dapat membuat kita terhindar dari perang, dan mengamankan kemerdekaan serta netralitas kita."
 SWI_oust_confederation_president: "Menggulingkan Presiden Konfederasi"
