########## ITALY ###########
############################
 ITA_withdraw_from_ethiopia: "Mundur dari Etiopia"
 ITA_withdraw_from_ethiopia_desc: "Perang melawan Ethiopia adalah sebuah kesalahan, sekarang saatnya untuk menyelesaikan masalah kontroversial ini."
 ITA_transfer_lost_states_tt: "§Y[550.GetName]§!, §Y[559.GetName]§! dan §Y[844.GetName]§! akan ditransfer ke §Y[ETH.GetName]§! jika mereka sepenuhnya dikendalikan oleh mereka. §Y[908.GetName]§! juga akan dialihkan jika dimiliki oleh [ROOT.GetNameDef]."
 ITA_missiolinis: "Misi dari Duce"
 ITA_missiolinis_desc: "Duce mempunyai rencana besar untuk membawa bangsa Italia yang bangga ke tempat yang selayaknya. Untuk mewujudkan visinya tentang Italia yang lebih besar, ia mengeluarkan perintah terkait yang ia yakini, akan dilaksanakan tepat waktu.\n\n£ITA_missiolini_text_icon Misi aktif: §Y[?ITA_missiolinis_active_missions]§!\n£ITA_missiolini_text_icon Misi yang berhasil: §Y[?ITA_missiolinis_successful_missions]§!\n£ITA_missiolini_silver_text_icon Misi yang gagal: §R[?ITA_missiolinis_failed_missions]§!"
 ITA_missiolini_conquer_ethiopia: "Taklukkan Etiopia"
 ITA_missiolini_conquer_ethiopia_desc: "Apapun benteng Abyssinian yang masih tersisa perlu diatasi untuk mengamankan kemenangan Italia."
 ITA_missiolini_pacify_ethiopia: "Tenangkan Etiopia"
 ITA_missiolini_pacify_ethiopia_desc: "Duce telah memberikan perintah untuk menindak oposisi Abyssinian dengan kekerasan dan menerapkan undang-undang untuk mengendalikan populasi. Dia ingin seluruh negeri tenang dan bergabung dengan Italia sesegera mungkin."
 ITA_missiolini_pacify_ethiopia_vanilla: "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc: "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_pacify_ethiopia_goal_tt: "Semua negara bagian awal di Etiopia memiliki Kepatuhan yang lebih besar daripada §Y60%§!"
 ITA_missiolini_strengthen_heavy_industry: "Program Industrialisasi"
 ITA_missiolini_strengthen_heavy_industry_desc: "Agar Italia benar-benar berkembang, kita perlu membangun pabrik-pabrik baru untuk menopang pertumbuhan kerajaan kita yang sibuk dan memperluas kemampuan produksi kita."
 ITA_missiolini_strengthen_heavy_industry_trigger_tt: "$TRIGGER_NUM_OF_CIVILIAN_FACTORIES_MORE_THAN$§Y[?ITA_missiolinis_required_civs]§!. (Saat ini §[GetColorNumOfCivsMissiolinis][?ROOT.num_of_civilian_factories]§!.)"
 ITA_missiolini_strengthen_the_army: "Perkuat Angkatan Darat"
 ITA_missiolini_strengthen_the_army_desc: "Seperti Kekaisaran Romawi di masa lalu, kerajaan kita yang sedang berkembang ini membentang jauh dan luas dan membutuhkan pasukan yang kuat untuk melindunginya dari gerombolan orang barbar di luar perbatasan."
 ITA_missiolini_stockpile_trucks: "Truk Penimbunan"
 ITA_missiolini_stockpile_trucks_desc: "Kita memerlukan kekuatan militer yang lebih mobile dan dapat bergerak cepat di wilayah yang luas tanpa harus terkendala oleh keterbelakangan logistik."
 ITA_missiolini_stockpile_fuel: "Meningkatkan Cadangan Bahan Bakar"
 ITA_missiolini_stockpile_fuel_desc: "Tentara modern tidak hanya bergerak dengan perutnya tetapi juga dengan bahan bakarnya, dan jika tidak ada maka seluruh mesin perang akan terhenti. Semua cabang militer membutuhkannya, dan kita harus mampu menyediakan gas dalam jumlah besar jika ingin sukses di medan perang."
 ITA_missiolini_strengthen_the_airforce: "Memperkuat Angkatan Udara"
 ITA_missiolini_strengthen_the_airforce_desc: "Regia Aeronautica telah menjadi simbol kebanggaan nasional dan pernah menjadi salah satu angkatan udara terbesar di dunia. Kita perlu memproduksi pesawat tambahan untuk memperkuat angkatan udara kita dan menjadikannya hebat kembali."
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt: "Telah memproduksi atau memperoleh §Y[?ROOT.ITA_missiolinis_fighters_to_produce]§! pesawat §Y$fighter_equipment$§! baru.\nPejuang Saat Ini yang dikerahkan: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§! - Petarung Saat Ini dalam persediaan §G[?ROOT.num_equipment@small_plane_airframe]§! - Total Petarung Sasaran §Y[?ITA_missiolinis_fighters_goal]§!"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt: "Telah memproduksi atau memperoleh pesawat §Y[?ROOT.ITA_missiolinis_bombers_to_produce]§! baru §Y$CAS_equipment$§!, §Y$nav_bomber_equipment$§! atau §Y$tac_bomber_equipment$§! (hanya satu jenis).\nCAS saat ini dikerahkan: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§! - CAS saat ini di timbunan §G[?ROOT.num_equipment@small_plane_cas_airframe]§! - Total Sasaran CAS §Y[?ITA_missiolinis_cas_goal]§!\nPembom Angkatan Laut saat ini dikerahkan: : §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§! - Pengebom Taktis Saat Ini dalam persediaan §G[?ROOT.num_equipment@medium_plane_airframe]§! - Total Sasaran Pembom Taktis §Y[?ITA_missiolinis_tactical_bombers_goal]§!"
 ITA_missiolini_industrial_research: "Riset Industri"
 ITA_missiolini_industrial_research_desc: "Kita harus menunjukkan kepada dunia betapa cepatnya fasisme dan rakyat Italia mampu mencapai lompatan besar dalam bidang teknologi."
 ITA_missiolini_expand_intelligence_agency: "Perluas Badan Intelijen"
 ITA_missiolini_expand_intelligence_agency_desc: "Dengan memperluas layanan intelijen kami, kami akan menyusup ke setiap aspek masyarakat Italia untuk menyeret komunis, penjahat, dan elemen berbahaya lainnya ke permukaan dan membawa mereka ke pengadilan, sehingga menjadikan Italia lebih aman."
 ITA_missiolini_occupy_albania: "Menempati Albania"
 ITA_missiolini_occupy_albania_desc: "Ikatan kuat antara Italia dan Albania sudah ada sejak ribuan tahun lalu, hingga masa Kekaisaran Romawi. Kita harus memasukkan Albania ke dalam Italia untuk mengamankan jalan masuk ke Laut Adriatik."
 ITA_missiolini_firmly_established_italian_administration_autonomy_text: "Administrasi [ROOT.GetAdjective] yang mapan"
 ITA_missiolini_occupy_albania_occupation_effects: "Jika [ROOT.GetFlag][ROOT.GetNameDef] mengontrol [ALB.GetFlag][ALB.GetAdjective] inti:"
 ITA_missiolini_occupy_albania_subject_effects: "Jika [ALB.GetFlag][ALB.GetNameDef] adalah subjek §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:"
 ITA_missiolini_occupy_dalmatia: "Menempati [103.GetName]"
 ITA_missiolini_occupy_dalmatia_desc: "Kita harus memperbaiki ketidakadilan yang parah akibat Perang Besar dan mengambil apa yang menjadi hak kita dengan paksa. Dalmatia harus menjadi orang Italia!"
 ITA_missiolini_occupy_dalmatia_occupation_effects: "Jika [ROOT.GetFlag][ROOT.GetNameDef] mengontrol §Y[103.GetName]§!:\nSetiap [YUG.GetFlag][YUG.GetAdjective] keadaan inti sepenuhnya dikontrol oleh [ROOT.GetFlag][ROOT.GetNameDef]:\nKepatuhan: §G+5,0%§!.\nResistensi: §G-5.0%§!"
 ITA_missiolini_occupy_dalmatia_subject_effects: "Jika §Y[103.GetName]§! dikuasai sepenuhnya oleh [ROOT.GetAdjective] subjek [YUG.GetAdjective] asal:\nSemua [ROOT.GetAdjective] subjek [YUG.GetAdjective] asal:"
 ITA_missiolini_occupy_greece: "Menempati [GRE.GetName]"
 ITA_missiolini_occupy_greece_desc: "Seperti legiun Romawi di masa lalu, kita juga dapat mendobrak batasan yang ada pada kita dengan menaklukkan Yunani dan mempersatukan bangsa-bangsa yang bersaudara."
 ITA_missiolini_occupy_greece_occupation_effects: "Setiap [GRE.GetFlag][GRE.GetAdjective] keadaan inti sepenuhnya dikendalikan oleh [ROOT.GetFlag][ROOT.GetNameDef]:\nKepatuhan: §G+5.0%§!.\nResistensi: §G-5.0%§!\n\nEfek saat ini:"
 ITA_missiolini_occupy_greece_subject_effects: "Jika [GRE.GetFlag][GRE.GetName] adalah subjek §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:"
 ITA_missiolini_occupy_ticino: "Menempati [846.GetName]"
 ITA_missiolini_occupy_ticino_desc: "Sejak Hannibal melintasi Pegunungan Alpen dengan gajah-gajahnya, pegunungan tersebut telah menjadi jalan raya bagi orang-orang barbar yang langsung menuju jantung Italia. Kita harus mengamankan perbatasan utara kita."
 ITA_missiolini_occupy_ticino_occupation_effects: "[846.GetName] dan setiap status inti [SWI.GetFlag][SWI.GetAdjective] dikontrol sepenuhnya oleh [ROOT.GetFlag][ROOT.GetNameDef]:\nKepatuhan: §G+5.0%§!.\nResistensi: §G-5.0%§!\n\nEfek saat ini:"
 ITA_missiolini_occupy_ticino_subject_effects: "Jika [SWI.GetFlag][SWI.GetName] adalah subjek §Y[ROOT.GetFlag][ROOT.GetNameDef]§!:"
 ITA_missiolini_bolster_political_cabinet: "Mendukung Kabinet Politik"
 ITA_missiolini_bolster_political_cabinet_desc: "Menemukan orang yang tepat untuk tempat yang tepat selalu sulit dilakukan. Kita tidak bisa meninggalkan kebutuhan bisnis yang terlewat dalam pencarian kita untuk orang-orang yang paling cerdas dan cerdas."
 ITA_missiolini_bolster_political_cabinet_trigger_tt: "Memiliki §Y3§! $political_advisor$ aktif, setidaknya salah satunya adalah §YHierarch§!"
 ITA_missiolini_bolster_military_high_command: "Memperkuat Komando Tinggi Militer"
 ITA_missiolini_bolster_military_high_command_desc: "Menemukan dan mempromosikan calon-calon yang layak untuk menduduki komando tinggi militer akan memperkuat pemikiran strategis dan taktis kita dalam konflik-konflik yang akan datang."
 ITA_missiolini_bolster_military_high_command_trigger_tt: "Memiliki §Y3§! $high_command$ penasihat aktif"
 ITA_victory_in_ethiopia_flag: "Kemenangan Italia dalam perang Italia-Ethiopia."
 ITA_balance_of_power_category: "$ITA_power_balance$"
 ITA_bop_take_over_ministry_of_foreign_affairs: "£BoP_right_texticon Ambil Alih Kementerian Luar Negeri"
 ITA_bop_take_over_ministry_of_foreign_affairs_desc: "Menunjuk dirinya sebagai Menteri Luar Negeri akan membuat Benito Mussolini mempunyai kendali langsung atas kebijakan dan hubungan luar negeri Italia."
 ITA_bop_resign_ministry_of_foreign_affairs_position: "£BoP_left_texticon Mengundurkan Diri dari Jabatan Kementerian Luar Negeri"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc: "Mengundurkan diri dari jabatannya sebagai Menteri Luar Negeri akan membuka peluang bagi orang lain, sehingga Benito Mussolini kehilangan kendali atas kebijakan dan hubungan luar negeri Italia."
 ITA_bop_take_over_ministry_of_justice: "£BoP_right_texticon Ambil alih Kementerian Kehakiman"
 ITA_bop_take_over_ministry_of_justice_desc: "Menunjuk dirinya sebagai Menteri Keadilan dan Keadilan akan memungkinkan Benito Mussolini melakukan kontrol langsung atas sistem dan institusi peradilan Italia."
 ITA_bop_resign_ministry_of_justice_position: "£BoP_left_texticon Mengundurkan Diri dari Jabatan Kementerian Kehakiman"
 ITA_bop_resign_ministry_of_justice_position_desc: "Mengundurkan diri dari jabatannya sebagai Menteri Hukum dan Keadilan akan membuka peluang bagi pihak lain, sehingga Benito Mussolini tidak mempunyai kendali atas sistem dan institusi peradilan Italia."
 ITA_bop_take_over_ministry_of_education: "£BoP_right_texticon Ambil alih Kementerian Pendidikan"
 ITA_bop_take_over_ministry_of_education_desc: "Menunjuk dirinya sebagai Menteri Pendidikan Umum akan membiarkan Benito Mussolini melakukan kontrol langsung atas sistem dan institusi pendidikan Italia."
 ITA_bop_resign_ministry_of_education_position: "£BoP_left_texticon Mengundurkan Diri dari Jabatan Kementerian Pendidikan"
 ITA_bop_resign_ministry_of_education_position_desc: "Mengundurkan diri dari jabatannya sebagai Menteri Pendidikan Umum akan membuka peluang bagi pihak lain, sehingga Benito Mussolini kehilangan kendali atas sistem dan institusi pendidikan Italia."
 ITA_bop_take_over_ministry_of_corporations: "£BoP_right_texticon Ambil Alih Kementerian Korporasi"
 ITA_bop_take_over_ministry_of_corporations_desc: "Menunjuk dirinya sebagai Menteri Korporasi akan membiarkan Benito Mussolini mengambil kendali langsung atas sistem dan institusi keuangan Italia."
 ITA_bop_resign_ministry_of_corporations_position: "£BoP_left_texticon Mengundurkan Diri dari Jabatan Kementerian BUMN"
 ITA_bop_resign_ministry_of_corporations_position_desc: "Mengundurkan diri dari jabatannya sebagai Menteri Korporasi akan membuka peluang bagi pihak lain, sehingga Benito Mussolini kehilangan kendali atas sistem dan institusi keuangan Italia."
