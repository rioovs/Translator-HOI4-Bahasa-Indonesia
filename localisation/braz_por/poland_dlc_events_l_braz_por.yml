l_braz_por:
 poland.13.t: "[From.GetNameDefCap] Mencari [faction_invitee_target.GetAdjective] Kolaborasi"
 poland.13.d: "[From.GetLeader] telah meminta agar pemerintah [Root.GetAdjective] menyampaikan undangan kepada [Root.GetFactionName], dengan alasan manfaat strategis yang besar dari aliansi [faction_invitee_target.GetAdjective] jika terjadi invasi."
 poland.13.a: "[faction_invitee_target.GetNameDefCap] adalah seorang teman, tentu saja!"
 poland.13.b: "Kami tidak bisa mempercayai [faction_invitee_target.GetLeader]."
 poland.1301.t: "[From.From.GetNameDefCap] Mengupayakan Kerjasama"
 poland.1301.d: "Sudah menjadi anggota [From.GetFactionName], [From.From.GetLeader] mencari kerja sama militer dengan [Root.GetNameDef] dengan alasan manfaat strategis yang besar dari aliansi [From.From.GetAdjective]-[Root.GetAdjective] jika terjadi invasi [GER.GetAdjective] atau [SOV.GetAdjective]."
 poland.1301.a: "Tentu saja!"
 poland.1301.b: "Kami tidak tertarik dengan \"[From.GetFactionName]\" ini."
 poland.1302.t: "[From.GetNameDefCap] Menolak [faction_invitee_target.GetAdjective] Masuk"
 poland.1302.d: "Tampaknya [From.GetLeader] tidak terlalu percaya pada perlunya aliansi [faction_invitee_target.GetAdjective] seperti halnya [Root.GetLeader]. Alasan sebenarnya dari keputusan ini masih belum diketahui, namun yang jelas pemerintah [From.GetAdjective] percaya bahwa [faction_invitee_target.GetNameDef] lebih merugikan daripada menguntungkan bagi kelangsungan hidup [From.GetFactionName]."
 poland.1302.a: "Yah, itu patut dicoba."
 poland.1303.t: "[From.GetNameDefCap] Menolak!"
 poland.1303.d: "Untuk alasan apa pun yang tidak diketahui, pemerintah [From.GetAdjective] telah memutuskan bahwa mereka memilih untuk tidak bergabung dengan kami dalam perjuangan kebebasan di pihak [From.From.GetFactionName]. Apa pun pembenarannya, masa depan tidak akan cerah jika kerja sama [Root.GetAdjective]-[From.GetAdjective] terus berlanjut."
 poland.1303.a: "Sedih."
 poland.15.t: "[From.GetNameDefCap] Menuntut [Root.GetAdjective] Aneksasi!"
 poland.15.d: "Sebuah telegram yang sangat mengkhawatirkan tiba di meja [Root.GetLeader] hari ini dari Presiden [From.GetAdjective], menuntut agar [LIT.GetNameDef] tidak hanya membatalkan klaimnya atas bekas ibu kota Vilnius, tetapi juga agar dia meletakkan senjatanya dan menyerahkan semua wilayah kepada negara bagian [From.GetAdjective]. [From.GetNameDefCap] telah berusaha untuk memulihkan Persemakmuran yang telah lama mati sejak berdirinya [Root.GetNameDef], dan tampaknya sekarang mereka percaya bahwa ancaman perang lagi saja sudah cukup untuk menyebabkan [Root.GetLeader] runtuh."
 poland.15.d.notlit: "Sebuah telegram yang sangat mengkhawatirkan tiba di meja [Root.GetLeader] hari ini dari Presiden [From.GetAdjective], menuntut agar [Root.GetNameDef] meletakkan senjatanya dan menyerahkan semua wilayah kepada negara bagian [From.GetAdjective]. [From.GetNameDefCap] telah berusaha untuk memulihkan Persemakmuran yang telah lama mati sejak berdirinya [Root.GetNameDef], dan tampaknya sekarang mereka percaya bahwa ancaman perang antar negara saja sudah cukup untuk menyebabkan [Root.GetLeader] runtuh."
 poland.15.a: "Baiklah."
 poland.15.b: "Sama sekali tidak!"
 poland.1501.t: "[From.GetNameDefCap] Menerima!"
 poland.1501.d: "Hari ini adalah hari perayaan yang luar biasa untuk [Root.GetNameDef] karena militer [From.GetAdjective] telah menurunkan senjata mereka dan mengizinkan tentara [Root.GetAdjective] untuk berbaris langsung ke ibu kota dan memproklamirkan reunifikasi [Root.GetNameDef] dan [From.GetNameDef]! Sebagai negara Persemakmuran yang terlahir kembali, jalan-jalan di [Root.Capital.GetName] dipenuhi oleh pria dan wanita yang mengibarkan bendera [Root.GetAdjective] dan [From.GetAdjective] secara bersamaan, meskipun perayaan seperti itu tidak dapat dilihat di ibu kota [From.GetAdjective], di mana orang-orang tampak muram dan sedih."
 poland.1501.a: "Persemakmuran terlahir kembali!"
 poland.1502.t: "[From.GetNameDefCap] Menantang!"
 poland.1502.d: "Tanggapan telah kembali dari komando tinggi [From.GetAdjective] hari ini dengan langsung menolak semua tuntutan [Root.GetAdjective] dan mengklaim bahwa mereka \"tidak akan membiarkan [Root.GetLeader] menginjak-injak kedaulatan [From.GetAdjective]\". Meskipun banyak yang lebih memilih untuk tidak terlibat perang lagi dengan [From.GetNameDef], jika [Root.GetLeader] tidak segera merespons, tuntutan [Root.GetAdjective] di masa depan kemungkinan besar tidak akan dianggap serius."
 poland.1502.a: "[Root.GetNameDef] dan [From.GetNameDef] akan menjadi satu!"
 poland.16.t: "[From.GetNameDefCap] Mengundang Kami ke Międzymorze"
 poland.16.a: "Tentu saja!"
 poland.16.b: "Saya tidak melihat alasan untuk bersekutu dengan Polandia."
 poland.17.t: "Kemenangan Sanasi Kiri"
 poland.17.d: "Walery Sławek akhirnya berhasil memulihkan posisinya sebagai kepala pemerintahan di [Root.GetNameDef], mendorong [Root.GetLeader] ke dalam peran yang lebih sebagai penasihat dalam pemerintahan. Namun, banyak pihak yang tidak yakin dengan kecenderungan politik Sławek yang sebenarnya. Beberapa orang percaya bahwa dia adalah seorang sosialis yang mengupayakan reformasi, sementara banyak pengkritiknya percaya bahwa dia adalah seorang otoriter, tidak berbeda dengan [Root.GetLeader] atau Rydz-Śmigły. Kini setelah ia akhirnya menjadi kepala pemerintahan, Sławek mungkin akan menjawab pertanyaan-pertanyaan ini dengan sekali lagi mengamandemen konstitusi Polandia."
 poland.17.a: "Pertahankan pemerintahan yang kuat."
 poland.17.b: "Menetapkan reformasi sosial."
 poland.18.t: "Kemenangan OZN"
 poland.18.d: "Edward Rydz-Śmigły dan pengikutnya di Sanation Right telah lama menjadi kekuatan sebenarnya di balik [Root.GetNameDef], namun dengan [Root.GetLeader] menyetujui Kubu Persatuan Nasional, kekuasaan de-facto Rydz-Śmigły akhirnya menjadi sah. Karena kedekatannya dengan kaum Falangis, beberapa orang khawatir bahwa [Root.GetNameDef] terlalu menggoda kelompok sayap kanan dan bahwa simpati fasis Rydz-Śmigły mungkin akan berakhir dengan mengisolasi [Root.GetNameDef] secara diplomatis dari mantan sekutunya."
 poland.18.a: "Kediktatoran kami sepenuhnya netral."
 poland.18.b: "Undang kaum Falangis ke dalam pemerintahan."
 poland.19.t: "Bunuh Diri Walery Sławek"
 poland.19.d: "\"Saya akan mengambil nyawa saya. Tolong jangan salahkan siapa pun. Saya telah membakar semua surat-surat pribadi, dan semua dokumen milik saya. Jika tidak semuanya, mohon maafkan saya. Semoga Tuhan Yang Maha Kuasa mengampuni dosa-dosa saya, termasuk yang terakhir ini.\" Surat dan senjata api ini ditemukan di samping tubuh Walery Sławek tepat pukul 20.45 kemarin malam. Dokter yang paling cekatan dan paling terampil di Rumah Sakit Militer Piłsudski tidak dapat menghentikan pendarahan di tubuh Sławek dan mantan Perdana Menteri diumumkan meninggal pagi ini. Bersamaan dengan catatannya terdapat surat untuk dilihat [Root.GetLeader] saja, dan meskipun isinya dan alasan Sławek melakukan tindakan paling mengejutkan ini masih menjadi misteri, spekulasi ada di bibir setiap pria dan wanita di [Root.Capital.GetName]. Banyak yang menduga marjinalisasi yang terus berlanjut terhadap kaum Kiri Sanasi dan isolasi yang semakin meningkat terhadap Sławek adalah faktor-faktor yang berkontribusi terhadap kemurungannya, dan kematian pemimpin sayap kiri yang paling berpengaruh ini pasti akan membuat banyak orang merasa kecewa dan kehilangan."
 poland.19.a: "Spoczywaj w pokoju."
 poland.20.t: "Rencana Empat Tahun Selesai!"
 poland.20.desc.a: "Kurangnya investasi selama empat tahun terakhir telah menyebabkan banyak orang menyatakan Rencana Empat Tahun sebagai kegagalan total. Polandia Timur masih merupakan wilayah terpencil yang dihuni oleh para petani miskin, yang disebut sebagai ‘kawasan industri pusat’ hanyalah beberapa pabrik dan stasiun kereta api yang menyedihkan, dan industri Polandia merupakan hal yang memalukan bagi negara. Para ahli keuangan yakin bahwa kegagalan Rencana Empat Tahun akan menjadi kerugian jangka panjang bagi upaya industri Polandia di masa depan."
 poland.20.desc.b: "Dengan investasi yang tidak terlalu besar, masa depan sektor industri Polandia tampak cerah, namun masih jauh tertinggal dibandingkan negara-negara tetangganya di Barat dan Timur. Meskipun ini bukan usaha industri besar-besaran seperti yang [Root.GetLeader] janjikan, investasi yang dilakukan oleh pemerintah akan memberikan manfaat besar bagi Rencana Empat Tahun berikutnya!"
 poland.20.desc.c: "Jeritan lokomotif di atas rel, bau jelaga dan kabut asap yang menyengat di udara, kabut industri yang tajam menyengat mata, inilah sensasi kemajuan. Tiba di wilayah tengah Polandia saat ini berarti memasuki dunia industri dan kemajuan. Pabrik, jalan raya, kereta api, lokomotif, mobil, negara Polandia akhirnya mencapai semuanya. Dengan terhubungnya Kongres, Besar, dan Timur Polandia dengan jaringan jalan raya dan kereta api yang erat, Polandia akhirnya bersatu sebagai satu kesatuan industri dan Rencana Empat Tahun Kwiatkowski akhirnya dapat dikatakan sukses. Meskipun hal ini tidak berarti akhir dari investasi industri Polandia, keberhasilan luar biasa dari program industrialisasi telah memberikan stabilitas dan lapangan kerja bagi rakyat Polandia, dan banyak yang merasa siap menghadapi kesulitan apa pun yang harus dihadapi negara Polandia di masa depan."
 poland.20.a: "sial!"
 poland.20.b: "Luar biasa!"
 poland.20.c: "Luar biasa!"
 poland.20.d: "Tidak ada yang bisa dilakukan tanpa solidaritas!"
 poland.20.e: "Luar biasa!"
 poland.20.f: "sial!"
 poland.21.t: "[DNZ.GetNameDef] Mencari Integrasi dengan [Ger.GetNameDefCap]"
 poland.21.d: "Saat perang melanda jalan-jalan [DNZ.GetNameDef], [DNZ.GetLeader] berdiri kokoh melawan pasukan [POL.GetLeader], namun jelas satu kota tidak cukup untuk menahan serangan gencar semua pasukan [POL.GetNameDef]. Sebagai anggota partai [Root.GetRulingParty], [DNZ.GetLeader] bertanggung jawab terhadap [Root.GetLeader] dan kekalahan [DNZ.GetAdjective] tidak dapat diterima. [GER.GetNameDefCap] dapat memasuki perang sebagai pembela [DNZ.GetNameDef], menghadirkan peluang unik untuk merebut kota sambil tampil sebagai pembela…"
 poland.21.a: "Gdansk akan tetap menjadi Danzig!"
 poland.21.b: "Kita tidak boleh terlibat."
 poland.2101.t: "[From.GetNameDefCap] Menawarkan Dukungan!"
 poland.2101.d: "Partai [GER.GetRulingParty] Jerman telah menawarkan untuk mendukung perjuangan kita melawan Polandia dengan imbalan kendali lebih langsung atas [Root.GetNameDef] oleh [From.GetNameDef]."
 poland.2101.a: "Kami tidak punya pilihan."
 poland.2101.b: "Danzig akan tetap menjadi Danzig!"
 poland.2102.t: "Aneksasi Danzig"
 poland.2102.d: "[DNZ.GetLeader] telah terbukti menjadi alat yang berguna untuk melawan [POL.GetNameDef], namun daerah otonom telah lama kehilangan kegunaannya dan takdir [DNZ.GetLeader] adalah menjadi Gauleiter dari Reichsgau Danzig-Prusia Barat, yang terintegrasi erat dengan [Root.GetNameDef]."
 poland.2102.a: "Selamat datang di Reich."
 poland.2102.b: "Mungkin mereka berhak mendapatkan otonomi."
 poland.22.t: "[DNZ.GetNameDefCap] Menawarkan Kedamaian"
 poland.22.d: "Perang ini telah berlangsung cukup lama, dan bahkan [DNZ.GetLeader] yang durhaka pun menginginkan perdamaian dengan [POL.GetNameDef]. Bahkan ketika Gdynia berada di bawah kendali [DNZ.GetAdjective], banyak yang khawatir bahwa kita akan mengambil risiko lebih besar jika tetap berperang melawan Kota Bebas daripada keuntungan yang bisa kita peroleh. Meskipun kota ini pasti akan berada di bawah kendali [GER.GetAdjective], kita tidak bisa melanjutkan konflik ini lebih lama lagi."
 poland.22.a: "Setidaknya kami mencoba."
 poland.22.b: "Perang ini belum berakhir sampai saya menyatakannya demikian!"
 poland.23.t: "Industri Disabotase di [poland_state_withdrawn.GetName]"
 poland.23.d: "Saat pasukan [Root.GetAdjective] maju ke [poland_state_withdrawn.GetName] dan mulai menguasai jalur kereta api dan industri, secara mengejutkan semuanya telah dilengkapi dengan bahan peledak untuk diledakkan. Jelas ini adalah jebakan yang ditinggalkan oleh tentara [POL.GetAdjective], hal ini dapat kita perkirakan akan terjadi setiap kali kita mencoba merebut industri [POL.GetAdjective]."
 poland.23.a: "Itu tidak akan menunda kita lama-lama."
 poland.24.d: "Ketegangan memuncak di wilayah Timur. Polisi telah dikerahkan di Timur untuk menangani para pengunjuk rasa ini, namun kebrutalan para petugas tidak berbuat apa-apa selain mengobarkan api pemberontakan di kalangan masyarakat.\n\nJika kita tidak menyelesaikan krisis ini sesegera mungkin, kita mungkin akan menghadapi perang saudara. Pemogokan yang diorganisir oleh pemimpin Partai Tani Stanisław Mikołajczyk telah membentuk koalisi demokrat, sosialis, dan komunis yang menentang pemerintah Polandia dan jika diabaikan akan memicu pemberontakan."
 poland.24.a: "Para petani memberontak!"
 poland.25.t: "[hosting_country_target.GetNameDefCap] Menuntut Pengunduran Diri [Root.GetLeader]!"
 poland.25.d: "Meskipun [hosting_country_target.GetNameDef] berjanji untuk menjadi tuan rumah bagi pemerintahan [Root.GetAdjective] di pengasingan, [hosting_country_target.GetLeader] telah menuntut agar [Root.GetLeader] segera mengundurkan diri dari jabatan [Root.GetLeader.GetHerHis] sebagai Presiden [Root.GetNameDef]. Dalam kekacauan kapitulasi dan pengasingan, [Root.GetLeader] telah melarikan diri ke negara netral di Eropa, dan hanya sedikit orang buangan yang tersisa dari pemerintahan [Root.GetAdjective] yang tersisa untuk memutuskan siapa yang akan memimpin perjuangan untuk merebut kembali tanah air mereka."
 poland.25.a: "Seorang patriot yang tidak memiliki ikatan dengan Sanasi."
 poland.25.b: "Kita memerlukan seorang legioner."
 poland.25.c: "Ini adalah kesempatan kita untuk memulihkan demokrasi Polandia."
 poland.26.t: "Bisikan Revolusi"
 poland.26.d: "Di seluruh wilayah Polandia yang diduduki [Root.GetAdjective], ada desas-desus bahwa revolusi sedang terjadi di bawah tanah. Di tembok kota terpampang tulisan \"Niech żyje opór!\" dan slogan-slogan serupa yang menyerukan perlawanan untuk melawan pendudukan [Root.GetAdjective]. Hingga saat ini, aktivitas perlawanan hanya terbatas pada distribusi propaganda, gangguan terhadap jalur produksi, serta pengeboman dan sabotase yang terjadi sesekali, namun kini anehnya perlawanan menjadi tenang dan suasana di Polandia dipenuhi dengan pengkhianatan dan ketidakpercayaan.\n\n[Root.GetAdjective] agen di seluruh Polandia memperkirakan akan terjadi pemberontakan besar-besaran yang disponsori oleh pemerintah [POL.GetAdjective] di pengasingan. Hanya dengan menekan perlawanan, [Root.GetNameDef] dapat berharap untuk tetap mengendalikan Polandia."
 poland.26.a: "Kita harus menangkap para pengkhianat ini."
