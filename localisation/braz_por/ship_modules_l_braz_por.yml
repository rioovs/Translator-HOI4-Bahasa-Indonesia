 ### EQUIPMENT MODULES ###
 ship_light_battery_1: "Meriam TC 85 mm"
 ship_light_battery_1_short: "Baterai Ringan I"
 ship_light_battery_1_desc: "Meriam berukuran relatif kecil untuk digunakan pada kapal perusak dan kapal yang lebih kecil."
 ship_light_battery_2: "Meriam TC 105 mm"
 ship_light_battery_2_short: "Baterai Ringan II"
 ship_light_battery_2_desc: "Meriam kecil dengan dudukan bertenaga mesin untuk memungkinkannya melacak target dengan cepat."
 ship_light_battery_3: "Meriam TC 127 mm"
 ship_light_battery_3_short: "Baterai Ringan III"
 ship_light_battery_3_desc: "Meriam kecil yang dilengkapi perisai meriam guna melindungi awak dari serpihan proyektil dan cuaca buruk."
 ship_light_battery_4: "Meriam TC 130 mm"
 ship_light_battery_4_short: "Baterai Ringan IV"
 ship_light_battery_4_desc: "Sepasang meriam kecil di dalam kubah lapis baja bertenaga mesin."
 dp_light_battery_1: "Baterai Dwi-Guna 100mm"
 dp_light_battery_1_short: "Baterai Utama Dwi-Guna I"
 dp_light_battery_1_desc: "Meriam kecil pada dudukan khusus, memungkinkannya menyerang pesawat udara sekaligus sasaran permukaan."
 dp_light_battery_2: "Baterai Dwi-Guna 113mm"
 dp_light_battery_2_short: "Baterai Utama Dwi-Guna II"
 dp_light_battery_2_desc: "Meriam kecil dengan dudukan sudut elevasi tinggi dan perisai meriam, memungkinkannya menyerang pesawat udara maupun sasaran permukaan."
 dp_light_battery_3: "Baterai Dwi-Guna 127mm"
 dp_light_battery_3_short: "Baterai Utama Dwi-Guna III"
 dp_light_battery_3_desc: "Meriam kecil di dalam kubah tertutup sudut elevasi tinggi, memungkinkannya menghadapi pesawat udara maupun sasaran permukaan."
 dp_light_battery_4: "Baterai Dwi-Guna TC 127mm"
 dp_light_battery_4_short: "Baterai Utama Dwi-Guna IV"
 dp_light_battery_4_desc: "Meriam kecil tembak cepat di dalam kubah bertenaga mesin sudut elevasi tinggi, memungkinkannya menghadapi pesawat udara maupun sasaran permukaan secara efektif."
 ship_heavy_battery_1: "Meriam 28 cm"
 ship_heavy_battery_1_short: "Baterai Berat I"
 ship_heavy_battery_1_desc: "Meriam kaliber besar peninggalan era sebelum Perang Besar."
 ship_heavy_battery_2: "Meriam 30,5 cm"
 ship_heavy_battery_2_short: "Baterai Berat II"
 ship_heavy_battery_2_desc: "Rangkaian meriam kaliber besar di dalam dudukan berlapis baja tebal. Desain ulang kubah memungkinkan elevasi meriam lebih tinggi, sehingga meningkatkan jarak jangkau tembakan."
 ship_heavy_battery_3: "Meriam 38 cm"
 ship_heavy_battery_3_short: "Baterai Berat III"
 ship_heavy_battery_3_desc: "Dudukan berlapis baja tebal untuk meriam berat, memadukan berbagai teknologi mutakhir guna mendongkrak akurasi dan kecepatan tembak."
 ship_heavy_battery_4: "Meriam 40,6 cm"
 ship_heavy_battery_4_short: "Baterai Berat IV"
 ship_heavy_battery_4_desc: "Puncak evolusi daya tembak artileri laut berat, dudukan berlapis baja masif ini memberikan tingkat akurasi tinggi pada jarak tempuh yang sangat jauh."
 ship_super_heavy_battery_1: "Meriam 46 cm"
 ship_super_heavy_battery_1_short: "Baterai Super Berat"
 ship_super_heavy_battery_1_desc: "Meriam terbesar yang pernah dipasang pada kapal perang, artileri raksasa ini dirancang untuk menembus segala jenis perisai baja dari jarak berapa pun."
 ship_light_medium_battery_1: "Meriam 14,5 cm"
 ship_light_medium_battery_1_short: "Baterai Penjelajah Ringan I"
 ship_light_medium_battery_1_desc: "Kompromi antara laju tembakan dan bobot proyektil, meriam ini ditujukan untuk digunakan pada kapal penjelajah ringan guna melumpuhkan kapal-kapal yang lebih kecil."
 ship_light_medium_battery_2: "Meriam 15 cm"
 ship_light_medium_battery_2_short: "Baterai Penjelajah Ringan II"
 ship_light_medium_battery_2_desc: "Meriam ini merupakan evolusi logis dari model sebelumnya, dirancang untuk memberi penjelajah ringan keunggulan daya tembak atas kapal perusak dan penjelajah tua."
 ship_light_medium_battery_3: "Meriam 15,5 cm"
 ship_light_medium_battery_3_short: "Baterai Penjelajah Ringan III"
 ship_light_medium_battery_3_desc: "Menggabungkan sejumlah teknologi baru, dudukan berlapis baja ringan ini kian memperlebar jarak keunggulan daya tembak antara kapal perusak dan penjelajah ringan."
 ship_light_medium_battery_4: "Meriam Pengisian Otomatis 15,5 cm"
 ship_light_medium_battery_4_short: "Baterai Penjelajah Ringan Isi-Otomatis"
 ship_light_medium_battery_4_desc: "Dirancang dari awal untuk laju tembakan yang luar biasa tinggi, dudukan ini diciptakan agar penjelajah ringan mampu melumpuhkan musuh yang lebih besar melalui rentetan tembakan bertubi-tubi."
 dp_ship_medium_1: "Baterai Dwi-Guna TC 152mm"
 dp_ship_medium_1_short: "Baterai Penjelajah Ringan IV"
 dp_ship_medium_1_desc: "Dirancang dari awal untuk sudut tembak elevasi tinggi, dudukan ini memungkinkan kapal penjelajah ringan untuk melawan kapal perang yang lebih besar sekaligus pesawat musuh."
 ship_medium_battery_1: "Meriam 17 cm"
 ship_medium_battery_1_short: "Baterai Penjelajah Berat I"
 ship_medium_battery_1_desc: "Meskipun tidak mampu menimbulkan kerusakan telak pada kapal tempur, meriam sedang ini memungkinkan kapal penjelajah berat menghadapi kapal-kapal yang lebih ringan dan sesama penjelajah dengan percaya diri."
 ship_medium_battery_2: "Meriam 19 cm"
 ship_medium_battery_2_short: "Baterai Penjelajah Berat II"
 ship_medium_battery_2_desc: "Evolusi dari desain terdahulu, meriam ini dibuat untuk mengimbangi peningkatan ketebalan lapis baja dan jarak tempur laut yang semakin jauh."
 ship_medium_battery_3: "Meriam 20,3 cm"
 ship_medium_battery_3_short: "Baterai Penjelajah Berat III"
 ship_medium_battery_3_desc: "Meskipun bukan meriam terbesar yang dapat dipasang pada penjelajah, meriam ini memberikan keseimbangan terbaik antara bobot persenjataan dan daya tembak, serta mampu menembus lapis baja penjelajah lawan dengan andal."
 ship_medium_battery_4: "Meriam Pengisian Otomatis 20,3 cm"
 ship_medium_battery_4_short: "Baterai Penjelajah Berat IV"
 ship_medium_battery_4_desc: "Dengan kaliber yang dibatasi oleh pasokan amunisi yang ada dan pertimbangan modernisasi kapal-kapal tua, meriam baru ini dilengkapi sistem pengisian otomatis mutakhir guna mendongkrak laju tembakan secara drastis."
 ship_secondaries_1: "Meriam TC 75mm"
 ship_secondaries_1_short: "Baterai Sekunder I"
 ship_secondaries_1_desc: "Ditempatkan di dalam kasemat pada sisi lambung kapal, meriam ringan ini memberi kapal-kapal besar perlindungan dari serbuan kapal perang kecil musuh."
 ship_secondaries_2: "Meriam TC 120mm"
 ship_secondaries_2_short: "Baterai Sekunder II"
 ship_secondaries_2_desc: "Dudukan kubah kecil untuk meriam tembak cepat, dirancang guna melindungi kapal utama dari serbuan kapal perusak dan kapal torpedo musuh."
 dp_ship_secondaries_1: "Baterai Sekunder Dwi-Guna 100mm"
 dp_ship_secondaries_1_short: "Baterai Sekunder Dwi-Guna I"
 dp_ship_secondaries_1_desc: "Dengan menggabungkan fungsi meriam anti-udara berat dan baterai sekunder, dudukan ini mendongkrak kemampuan anti-udara kapal secara drastis sekaligus memberikan pertahanan yang memadai terhadap sasaran permukaan yang lebih kecil."
 dp_ship_secondaries_2: "Baterai Sekunder Dwi-Guna 113mm"
 dp_ship_secondaries_2_short: "Baterai Sekunder Dwi-Guna II"
 dp_ship_secondaries_2_desc: "Menempatkan meriam sekunder dwi-guna di dalam kubah sangat meningkatkan keselamatan dan perlindungan bagi awak kapal."
 dp_ship_secondaries_3: "Baterai Sekunder Dwi-Guna 127mm"
 dp_ship_secondaries_3_short: "Baterai Sekunder Dwi-Guna III"
 dp_ship_secondaries_3_desc: "Kubah kembar bertenaga mesin untuk meriam dwi-guna memberikan peningkatan daya tembak yang sangat besar."
 dp_ship_secondaries_4: "Baterai Sekunder Dwi-Guna TC 127mm"
 dp_ship_secondaries_4_short: "Baterai Sekunder Dwi-Guna IV"
 dp_ship_secondaries_4_desc: "Diciptakan untuk tembakan cepat terhadap segala bentuk sasaran, meriam ini merupakan senjata sekunder pamungkas bagi armada."
 ship_fire_control_system_0: "Penjejak Jarak Pusat"
 ship_fire_control_system_0_short: "Kendali Tembakan 0"
 ship_fire_control_system_0_desc: "Stasiun pusat di tiang kapal bagian atas menentukan jarak ke sasaran dan meneruskan informasi tersebut ke dudukan meriam."
 ship_fire_control_system_1: "Pengarah Tembakan Pusat"
 ship_fire_control_system_1_short: "Kendali Tembakan I"
 ship_fire_control_system_1_desc: "Stasiun pengarah pusat menembakkan seluruh meriam secara serentak atas perintah perwira artileri."
 ship_fire_control_system_2: "Penyimpan Jarak Mekanis"
 ship_fire_control_system_2_short: "Kendali Tembakan II"
 ship_fire_control_system_2_desc: "Komputer mekanis di dalam kapal secara terus-menerus memperbarui jarak dan arah baringan sasaran berdasarkan data dari penjejak jarak dan sensor lainnya."
 ship_fire_control_system_3: "Komputer Balistik"
 ship_fire_control_system_3_short: "Kendali Tembakan III"
 ship_fire_control_system_3_desc: "Komputer mekanis yang lebih rumit memperhitungkan berbagai macam faktor saat menghitung kalkulasi balistik untuk menghantam sasaran."
 ship_torpedo_1: "Peluncur Torpedo 3x 450mm"
 ship_torpedo_1_short: "Peluncur Torpedo I"
 ship_torpedo_1_desc: "Rangkaian torpedo ukuran sedang yang dapat dipasang pada kapal perang permukaan."
 ship_torpedo_2: "Peluncur Torpedo 4x 450mm"
 ship_torpedo_2_short: "Peluncur Torpedo II"
 ship_torpedo_2_desc: "Dengan menambahkan tabung torpedo lain pada dudukan, kapal permukaan dapat menembakkan sebaran yang lebih rapat dengan peluang kena lebih tinggi."
 ship_torpedo_3: "Peluncur Torpedo 3x 533mm"
 ship_torpedo_3_short: "Peluncur Torpedo III"
 ship_torpedo_3_desc: "Torpedo yang lebih besar dapat membawa hulu ledak yang lebih masif, menimbulkan kerusakan yang jauh lebih besar pada target. Namun, ini membatasi jumlah tabung pada peluncur."
 ship_torpedo_4: "Peluncur Torpedo 4x 533mm"
 ship_torpedo_4_short: "Peluncur Torpedo IV"
 ship_torpedo_4_desc: "Setelah mengatasi kendala mekanis peluncuran torpedo besar dari kapal permukaan, model mutakhir ini juga dapat diisi ulang dengan cepat untuk salvo berikutnya."
 ship_torpedo_sub_1: "Tabung Torpedo 4x 450mm"
 ship_torpedo_sub_1_short: "Tabung Torpedo I"
 ship_torpedo_sub_1_desc: "Rangkaian tabung torpedo standar yang dapat diisi ulang dari bagian dalam kapal selam."
 ship_torpedo_sub_2: "Tabung Torpedo 6x 450mm"
 ship_torpedo_sub_2_short: "Tabung Torpedo II"
 ship_torpedo_sub_2_desc: "Ruang torpedo yang lebih lapang memungkinkan lebih banyak tabung torpedo dipasang, sekaligus memberi sedikit ruang hidup tambahan bagi awak kapal."
 ship_torpedo_sub_3: "Tabung Torpedo 4x 533mm"
 ship_torpedo_sub_3_short: "Tabung Torpedo III"
 ship_torpedo_sub_3_desc: "Rangkaian tabung torpedo berukuran lebih besar yang memungkinkan kapal selam meluncurkan torpedo yang lebih dahsyat."
 ship_torpedo_sub_4: "Tabung Torpedo 6x 533mm"
 ship_torpedo_sub_4_short: "Tabung Torpedo IV"
 ship_torpedo_sub_4_desc: "Penambahan ram pengisi bertenaga listrik memungkinkan tabung torpedo diisi ulang hanya dalam hitungan menit."
 ship_anti_air_1: "Senapan Mesin Kal. .50"
 ship_anti_air_1_short: "Anti-Udara I"
 ship_anti_air_1_desc: "Rangkaian senapan mesin berat memberikan sedikit pertahanan jarak dekat terhadap pesawat musuh."
 ship_anti_air_2: "Anti-Udara 20mm"
 ship_anti_air_2_short: "Anti-Udara II"
 ship_anti_air_2_desc: "Meriam otomatis kecil yang menembakkan proyektil jauh lebih besar, mampu merontokkan pesawat penyerang hanya dalam beberapa tembakan."
 ship_anti_air_3: "Anti-Udara 37mm"
 ship_anti_air_3_short: "Anti-Udara III"
 ship_anti_air_3_desc: "Kaliber meriam terdahulu terbukti terlalu ringan untuk menjatuhkan pesawat penyerang secara andal sebelum mereka melepaskan bomnya. Proyektil yang lebih besar membutuhkan meriam lebih besar, tetapi memiliki peluang jauh lebih tinggi untuk menghancurkan sasaran saat mengenainya."
 ship_anti_air_4: "Anti-Udara Laras Empat 40mm"
 ship_anti_air_4_short: "Anti-Udara IV"
 ship_anti_air_4_desc: "Model meriam anti-udara termutakhir yang dilengkapi dudukan bertenaga mesin untuk melacak sasaran berkecepatan tinggi dan sistem pengarah canggih guna mengoordinasikan tembakan dari berbagai posisi meriam ke satu sasaran."
 ship_mine_layer_1: "Rel Penebar Ranjau"
 ship_mine_layer_1_desc: "Modifikasi pada kapal perang permukaan untuk mengangkut dan menyebarkan ranjau laut."
 ship_mine_sweeper_1: "Peralatan Penyapu Ranjau"
 ship_mine_sweeper_1_desc: "Peralatan khusus untuk mengoperasikan berbagai perlengkapan penyapuan ranjau laut."
 ship_mine_layer_sub: "Tabung Penebar Ranjau"
 ship_mine_layer_sub_desc: "Modifikasi pada lambung kapal selam yang memungkinkannya menebarkan sejumlah ranjau laut secara rahasia."
 ship_depth_charge_1: "Rel Bom Laut"
 ship_depth_charge_1_short: "Bom Laut I"
 ship_depth_charge_1_desc: "Rangkaian rel sederhana yang memungkinkan bom laut digulingkan dari buritan kapal saat kapal melintas tepat di atas sasaran bawah air."
 ship_depth_charge_2: "Pelontar Bom Laut"
 ship_depth_charge_2_short: "Bom Laut II"
 ship_depth_charge_2_desc: "Menggunakan ledakan pendorong kecil, alat ini melontarkan bom laut cukup jauh, memungkinkan satu kapal menyebarkan pola bom laut di area yang lebih luas."
 ship_depth_charge_3: "Mortir Anti-Kapal Selam"
 ship_depth_charge_3_short: "Bom Laut III"
 ship_depth_charge_3_desc: "Proyektor pelontar bom laut yang lebih kecil dengan pemicu kontak, memungkinkan kapal menyerang sasaran tanpa kehilangan kontak sonar."
 ship_depth_charge_4: "Mortir Anti-Kapal Selam Mutakhir"
 ship_depth_charge_4_short: "Bom Laut IV"
 ship_depth_charge_4_desc: "Evolusi dari model sebelumnya, mortir ini mampu melontarkan muatan ledak yang jauh lebih besar ke jarak yang lebih jauh."
 ship_sub_snorkel_1: "Snorkel Dasar"
 ship_sub_snorkel_1_desc: "Perangkat pipa udara yang memungkinkan kapal selam menjalankan mesin utamanya di bawah air, sehingga dapat mengisi ulang baterai tanpa harus muncul ke permukaan dan terpapar bahaya serangan."
 ship_sub_snorkel_2: "Snorkel yang Disempurnakan"
 ship_sub_snorkel_2_desc: "Penyempurnaan pada desain snorkel mengurangi kendala saat menggunakan mesin utama di laut bergelombang besar, sekaligus memperkecil kemungkinan snorkel terdeteksi oleh radar musuh."
 ship_airplane_launcher_1: "Katapel Pesawat Amfibi"
 ship_airplane_launcher_1_desc: "Peluncur pesawat sederhana yang melontarkan pesawat pengintai kecil ke udara."
 ship_airplane_launcher_2: "Katapel Pesawat Amfibi yang Disempurnakan"
 ship_airplane_launcher_2_desc: "Mekanisme peluncuran yang disempurnakan, memungkinkan kapal meluncurkan pesawat yang lebih besar dengan jarak jangkau dan kecepatan yang lebih tinggi."
 ship_seaplane_tender_1: "Tender Pesawat Amfibi"
 ship_seaplane_tender_1_desc: "Peralatan untuk mengisi bahan bakar dan mengangkat kembali pesawat amfibi, menjaga kesiapan operasionalnya tanpa terlalu bergantung pada pangkalan di darat."
 ship_seaplane_tender_2: "Tender Pesawat Amfibi yang Disempurnakan"
 ship_seaplane_tender_2_desc: "Meskipun kapal tender awal merupakan konversi kapal niaga, tipe baru ini dibangun khusus sejak awal dan memiliki kemampuan pendukung pesawat amfibi yang jauh lebih unggul."
 sub_missile_launcher: "Peluncur Rudal Kapal Selam"
 sub_missile_launcher_desc: "Peluncur yang dipasang pada kapal selam untuk meluncurkan rudal kendali dan rudal balistik."
 slbm_launcher: "Peluncur Rudal Nuklir Kapal Selam"
 slbm_launcher_desc: "Peluncur yang dipasang pada kapal selam untuk menembakkan rudal balistik berhulu ledak nuklir."
 ship_engine_sub_aip_1: "Propulsi Bebas Udara (AIP)"
 ship_engine_sub_aip_1_desc: "Iterasi pertama tipe mesin generasi baru, memungkinkan kapal selam tetap beroperasi di bawah air lebih lama dengan konsekuensi lonjakan konsumsi bahan bakar dan berkurangnya jangkauan operasional kapal."
 ship_engine_sub_aip_2: "Mesin Kombinasi AIP-Diesel"
 ship_engine_sub_aip_2_desc: "Versi baru dari sistem propulsi bebas udara, menawarkan kinerja yang lebih baik dengan konsumsi bahan bakar yang lebih hemat."
 ship_engine_sub_aip_3: "Mesin Walter Kecepatan Tinggi"
 ship_engine_sub_aip_3_desc: "Kita telah mencapai puncak dari apa yang dapat dicapai dengan mesin AIP. Mesin ini menawarkan kecepatan yang luar biasa, sembari tetap menjaga konsumsi bahan bakar pada tingkat yang dapat diterima."
 ship_anechoic_tile: "Ubin Anekoik"
 ship_anechoic_tile_desc: "Lapisan ubin karet peredam suara yang dirancang untuk mempersempit jarak deteksi kapal oleh sonar pasif maupun sonar aktif musuh."
 ship_torpedo_sub_nuclear: "Torpedo Nuklir"
 ship_torpedo_sub_nuclear_desc: "Torpedo yang membawa hulu ledak nuklir, menyediakan senjata pemusnah yang sangat efektif terhadap kapal musuh, meski dibayangi risiko kecelakaan yang lebih tinggi."
 ship_deck_space: "Ruang Hanggar"
 ship_deck_space_desc: "Area terbuka yang luas di dalam kapal yang memungkinkan perawatan dan persenjataan pesawat beroda. Menambah ruang hanggar lebih lanjut pada kapal akan meningkatkan biaya secara drastis."
 big_ship_deck_space: "Landasan Pacu Pangkalan Udara Apung"
 big_ship_deck_space_desc: "Area terbuka yang memungkinkan pemeliharaan, pengisian bahan bakar, dan pasokan pesawat serta mempersiapkannya untuk misi tempur. Memungkinkan penyimpanan dan pengerahan varian pesawat non-kapal induk."
 ship_escort_deck_space: "Hanggar Kapal Induk Pengawal"
 ship_escort_deck_space_desc: "Area terbuka di dalam kapal yang memungkinkan pemeliharaan dan persenjataan pesawat beroda. Jauh lebih kecil dan sempit dibanding hanggar pada Kapal Induk Armada."
 ship_submarine_deck_space: "Hanggar Kapal Selam Pengangkut Pesawat"
 ship_submarine_deck_space_desc: "Kompartemen kedap air dan peralatan katapel yang memungkinkan kapal selam membawa, meluncurkan, dan mengangkat kembali sejumlah kecil pesawat amfibi."
 ship_sonar_1: "Hidrofon"
 ship_sonar_1_desc: "Rangkaian hidrofon sederhana untuk melacak sasaran bawah air berdasarkan suara yang ditimbulkannya."
 ship_sonar_2: "Sonar Aktif"
 ship_sonar_2_desc: "Pemancar gelombang aktif yang mengirimkan 'ping' singkat ke dalam air, lalu menangkap pantulan gema dari lambung kapal selam yang menyelam."
 ship_sonar_3: "Sonar Canggih"
 ship_sonar_3_desc: "Larik sonar aktif yang disempurnakan dengan pancaran pulsa sinyal lebih kuat dan kemampuan pemindaian berarah."
 ship_sonar_4: "Sonar Modern"
 ship_sonar_4_desc: "Sistem sonar mutakhir berteknologi terdepan, memberikan pelacakan superior terhadap sasaran bawah air."
 ship_radar_1: "Radar Pencari Laut Desimetrik"
 ship_radar_1_short: "Radar I"
 ship_radar_1_desc: "Perangkat radar sederhana yang beroperasi pada pita panjang gelombang 50 cm, memungkinkan pendeteksian kapal permukaan bahkan dalam cuaca buruk pada jarak lebih dari 10 kilometer."
 ship_radar_2: "Radar Pencari Laut Desimetrik Disempurnakan"
 ship_radar_2_short: "Radar II"
 ship_radar_2_desc: "Perangkat radar yang disempurnakan pada pita gelombang 30 cm, dapat mengukur jarak dan arah baringan kapal kecil sekalipun pada jarak lebih dari 25 kilometer secara akurat."
 ship_radar_3: "Radar Artileri Sentimetrik"
 ship_radar_3_short: "Radar III"
 ship_radar_3_desc: "Dilengkapi dengan magnetron rongga, perangkat radar ini tidak hanya dapat mendeteksi sasaran yang sangat kecil tetapi juga percikan air dari jatuhnya proyektil meriam. Ini memungkinkan penembakan buta (blind-fire) secara presisi terhadap sasaran bahkan di malam hari atau di tengah cuaca buruk."
 ship_radar_4: "Radar Kendali Tembakan Terintegrasi"
 ship_radar_4_short: "Radar IV"
 ship_radar_4_desc: "Bekerja pada pita panjang gelombang sentimeter, perangkat radar ini terintegrasi penuh ke dalam sistem kendali artileri kapal dan memungkinkan kendali tembakan meriam berakurasi tinggi dalam segala kondisi cuaca."
 ship_extra_fuel_tank: "Tangki Bahan Bakar Tambahan"
 ship_extra_fuel_tank_desc: "Kapasitas penyimpanan bahan bakar yang diperluas memungkinkan jangkauan operasional yang lebih jauh."
 light_ship_engine_1: "Mesin 35.000 Shp"
 light_ship_engine_1_short: "Mesin Ringan I"
 light_ship_engine_1_desc: "Rangkaian kecil turbin uap mampu mendorong kapal kecil pada kecepatan tinggi atau menggerakkan kapal lebih besar pada kecepatan yang lebih lambat."
 light_ship_engine_2: "Mesin 40.000 Shp"
 light_ship_engine_2_short: "Mesin Ringan II"
 light_ship_engine_2_desc: "Memanfaatkan ketel uap bertekanan tinggi, bobot dan ruang mesin yang sama dapat menghasilkan daya keluaran yang lebih besar."
 light_ship_engine_3: "Mesin 45.000 Shp"
 light_ship_engine_3_short: "Mesin Ringan III"
 light_ship_engine_3_desc: "Perkembangan baru dalam material logam memungkinkan tekanan uap yang jauh lebih tinggi dan karenanya menghasilkan daya dorong yang lebih besar."
 light_ship_engine_4: "Mesin 50.000 Shp"
 light_ship_engine_4_short: "Mesin Ringan IV"
 light_ship_engine_4_desc: "Tata letak mesin dan roda gigi reduksi turbin yang disempurnakan memberikan efisiensi lebih tinggi untuk bobot mesin yang sama."
 sub_ship_engine_1: "Mesin 1.000 Shp"
 sub_ship_engine_1_short: "Mesin Kapal Selam I"
 sub_ship_engine_1_desc: "Kombinasi mesin diesel dan motor listrik memungkinkan kapal selam beroperasi di bawah air pada kecepatan yang memadai."
 sub_ship_engine_2: "Mesin 2.000 Shp"
 sub_ship_engine_2_short: "Mesin Kapal Selam II"
 sub_ship_engine_2_desc: "Mesin diesel yang lebih bertenaga memberi kapal selam kemampuan melaju cepat mengambil posisi serang saat mendeteksi sasaran."
 sub_ship_engine_3: "Mesin 3.000 Shp"
 sub_ship_engine_3_short: "Mesin Kapal Selam III"
 sub_ship_engine_3_desc: "Material dan metode produksi baru memungkinkan terciptanya mesin yang mampu beroperasi lebih lama pada daya penuh."
 sub_ship_engine_4: "Mesin 4.000 Shp"
 sub_ship_engine_4_short: "Mesin Kapal Selam IV"
 sub_ship_engine_4_desc: "Mesin mutakhir dengan turbocharger mampu melaju jauh lebih kencang dalam waktu singkat, baik untuk mengejar sasaran maupun mengisi ulang baterai lebih cepat."
 sub_ship_nuclear_engine_1: "Reaktor Nuklir Kapal Selam"
 sub_ship_nuclear_engine_1_short: "Reaktor Kapal Selam"
 sub_ship_nuclear_engine_1_desc: "Reaktor kompak yang menyediakan propulsi tenaga nuklir untuk kapal selam, memastikan daya tahan penyelaman yang tak terbatas dan efisiensi operasional bagi armada laut modern."
 cruiser_ship_engine_1: "Mesin 60.000 Shp"
 cruiser_ship_engine_1_short: "Mesin Penjelajah I"
 cruiser_ship_engine_1_desc: "Rangkaian dasar ketel uap yang mengalirkan uap ke turbin tanpa reduksi roda gigi."
 cruiser_ship_engine_2: "Mesin 70.000 Shp"
 cruiser_ship_engine_2_short: "Mesin Penjelajah II"
 cruiser_ship_engine_2_desc: "Turbin uap yang dilengkapi roda gigi reduksi jauh lebih efisien, memungkinkan alokasi bobot mesin digunakan untuk daya tambahan."
 cruiser_ship_engine_3: "Mesin 80.000 Shp"
 cruiser_ship_engine_3_short: "Mesin Penjelajah III"
 cruiser_ship_engine_3_desc: "Pengaturan susunan ketel uap yang disempurnakan menghasilkan tekanan uap lebih tinggi untuk tenaga yang lebih besar."
 cruiser_ship_engine_4: "Mesin 90.000 Shp"
 cruiser_ship_engine_4_short: "Mesin Penjelajah IV"
 cruiser_ship_engine_4_desc: "Material logam mutakhir membuat mesin ini mampu beroperasi jauh lebih lama di bawah beban kerja tinggi."
 heavy_ship_engine_1: "Mesin 30.000 Shp"
 heavy_ship_engine_1_short: "Mesin Kapal Berat I"
 heavy_ship_engine_1_desc: "Ditujukan untuk menghemat bobot demi penambahan meriam dan lapis baja, mesin ini tidak pernah dirancang untuk menghasilkan kecepatan tinggi."
 heavy_ship_engine_2: "Mesin 90.000 Shp"
 heavy_ship_engine_2_short: "Mesin Kapal Berat II"
 heavy_ship_engine_2_desc: "Jauh lebih bertenaga dibanding desain terdahulu, mesin ini dirancang untuk memberi kapal berat keunggulan kecepatan yang nyaman atas model-model yang lebih tua."
 heavy_ship_engine_3: "Mesin 150.000 Shp"
 heavy_ship_engine_3_short: "Mesin Kapal Berat III"
 heavy_ship_engine_3_desc: "Seiring bertambahnya bobot meriam dan perisai baja, mesin ini dirancang untuk memungkinkan kecepatan lebih tinggi guna memburu musuh yang kabur atau menjaga jarak tempur terhadap musuh yang lebih unggul."
 heavy_ship_engine_4: "Mesin 210.000 Shp"
 heavy_ship_engine_4_short: "Mesin Kapal Berat IV"
 heavy_ship_engine_4_desc: "Dirancang dengan material baru dan desain ketel uap yang disempurnakan, pembangkit daya ini dimaksudkan agar kapal tempur modern mampu mengimbangi kecepatan kapal induk cepat dan kapal penjelajah."
 heavy_ship_nuclear_engine_1: "Reaktor Nuklir Kapal Berat"
 heavy_ship_nuclear_engine_1_short: "Reaktor Kapal Berat"
 heavy_ship_nuclear_engine_1_desc: "Reaktor nuklir bertenaga luar biasa, mampu menggerakkan kapal paling berat sekalipun tanpa memerlukan pengisian bahan bakar ulang."
 carrier_ship_engine_1: "Mesin 50.000 Shp"
 carrier_ship_engine_1_short: "Mesin Kapal Induk I"
 carrier_ship_engine_1_desc: "Rangkaian mesin standar yang memungkinkan kapal induk berukuran sedang mencapai kecepatan yang dibutuhkan untuk operasi peluncuran pesawat secara aman."
 carrier_ship_engine_2: "Mesin 120.000 Shp"
 carrier_ship_engine_2_short: "Mesin Kapal Induk II"
 carrier_ship_engine_2_desc: "Pembangkit daya baru ini dirancang agar kapal induk dapat melaju lebih cepat daripada kebanyakan kapal penjelajah tua dan kapal perusak, memungkinkannya meloloskan diri dari armada permukaan musuh."
 carrier_ship_engine_3: "Mesin 150.000 Shp"
 carrier_ship_engine_3_short: "Mesin Kapal Induk III"
 carrier_ship_engine_3_desc: "Mesin yang dirancang untuk memungkinkan kapal induk berukuran besar sekalipun bergerak dengan kecepatan sangat tinggi."
 carrier_ship_engine_4: "Mesin 210.000 Shp"
 carrier_ship_engine_4_short: "Mesin Kapal Induk IV"
 carrier_ship_engine_4_desc: "Pembangkit daya ini dirancang untuk melengkapi 'kapal induk cepat' modern yang berfungsi sebagai inti dari gugus tugas kapal induk."
 carrier_ship_nuclear_engine_1: "Reaktor Nuklir Kapal Induk"
 carrier_ship_nuclear_engine_1_short: "Reaktor Kapal Induk"
 carrier_ship_nuclear_engine_1_desc: "Reaktor nuklir bertenaga sangat besar, mampu menggerakkan kapal induk raksasa tanpa perlu bersandar untuk mengisi ulang bahan bakar."
 ship_armor_bb_1: "Sabuk 200mm/Geladak 40mm"
 ship_armor_bb_1_short: "Lapis Baja Kapal Tempur I"
 ship_armor_bb_1_desc: "Dirancang untuk melindungi kapal dari hantaman meriam berkaliber setara, skema lapis baja ini memastikan setiap bagian vital kapal terlindungi dengan baik sesuai tingkat kepentingannya."
 ship_armor_bc_1: "Sabuk 150mm/Geladak 25mm"
 ship_armor_bc_1_short: "Lapis Baja Penjelajah Tempur I"
 ship_armor_bc_1_desc: "Dirancang untuk melindungi kapal dari meriam yang lebih kecil, skema lapis baja ini berbobot jauh lebih ringan guna memungkinkan kecepatan yang lebih tinggi."
 ship_armor_bb_2: "Sabuk 350mm/Geladak 150mm"
 ship_armor_bb_2_short: "Lapis Baja Kapal Tempur II"
 ship_armor_bb_2_desc: "Menampilkan sabuk baja miring, skema lapis baja ini dirancang untuk melindungi kapal tempur lini utama dari tembakan meriam berkaliber setara."
 ship_armor_bc_2: "Sabuk 305mm/Geladak 100mm"
 ship_armor_bc_2_short: "Lapis Baja Penjelajah Tempur II"
 ship_armor_bc_2_desc: "Kompromi antara kecepatan dan perlindungan, skema lapis baja ini dirancang untuk mempertahankan kapal dari hantaman meriam penjelajah dan kapal perusak."
 ship_armor_bb_3: "Sabuk 380mm/Geladak 155mm"
 ship_armor_bb_3_short: "Lapis Baja Kapal Tempur III"
 ship_armor_bb_3_desc: "Terobosan radikal dari skema lapis baja terdahulu, desain ini menciptakan benteng pertahanan (citadel) berlapis baja tebal di bagian tengah kapal dengan mengorbankan perlindungan bagian lainnya. Dirancang untuk melindungi kapal dari meriam berkaliber setara."
 ship_armor_bc_3: "Sabuk 330mm/Geladak 130mm"
 ship_armor_bc_3_short: "Lapis Baja Penjelajah Tempur III"
 ship_armor_bc_3_desc: "Dirancang dengan memperhatikan batasan bobot, skema lapis baja ini berupaya memaksimalkan perlindungan pada kompartemen vital kapal dengan membiarkan area lain terbuka. Skema ini tidak dirancang untuk menahan gempuran senjata sekelas kapal tempur dalam waktu lama."
 ship_armor_shbb: "Sabuk 450mm/Geladak 210mm"
 ship_armor_shbb_short: "Lapis Baja Super Berat"
 ship_armor_shbb_desc: "Mahakarya puncak dalam desain perisai baja laut, skema lapis baja ini dirancang untuk mematahkan semua proyektil baterai utama yang dikenal, memungkinkan kapal menghancurkan dan menenggelamkan kapal tempur mana pun di dunia saat ini."
 ship_armor_cruiser_1: "Sabuk 50mm/Geladak 40mm"
 ship_armor_cruiser_1_short: "Lapis Baja Penjelajah I"
 ship_armor_cruiser_1_desc: "Skema lapis baja yang dimaksudkan untuk memberi kapal penjelajah sedikit keunggulan saat bertempur melawan kapal perusak dan kapal bersenjata ringan lainnya."
 ship_armor_cruiser_2: "Sabuk 100mm/Geladak 30mm"
 ship_armor_cruiser_2_short: "Lapis Baja Penjelajah II"
 ship_armor_cruiser_2_desc: "Sabuk baja yang lebih tebal dimaksudkan agar kapal penjelajah dapat menghadapi penjelajah ringan tua dan kapal kecil dengan tingkat perlindungan yang baik."
 ship_armor_cruiser_3: "Sabuk 120mm/Geladak 50mm"
 ship_armor_cruiser_3_short: "Lapis Baja Penjelajah III"
 ship_armor_cruiser_3_desc: "Meniru metode yang digunakan pada kapal tempur, skema lapis baja ini dirancang untuk mengimbangi perkembangan persenjataan laut di seluruh penjuru dunia."
 ship_armor_cruiser_4: "Sabuk 150mm/Geladak 60mm"
 ship_armor_cruiser_4_short: "Lapis Baja Penjelajah IV"
 ship_armor_cruiser_4_desc: "Skema lapis baja ini berupaya memaksimalkan perlindungan pada area yang mutlak diperlukan agar kapal tetap terapung dan dapat bertempur, dengan mengorbankan bagian lainnya."
 ship_armor_carrier_deck: "Geladak 90mm"
 ship_armor_carrier_deck_short: "Lapis Baja Geladak Terbang"
 ship_armor_carrier_deck_desc: "Pelat baja tebal melindungi ruang hanggar dari hantaman bom pesawat musuh, dengan konsekuensi berkurangnya ruang kerja penerbangan."
 ship_armor_ice_carrier_deck_1: "Penguatan Landasan Pykrete"
 ship_armor_ice_carrier_deck_1_desc: "Penguatan struktur tambahan, memastikan konstruksi lebih kokoh dan ulet, sekaligus memberikan ketahanan lebih baik terhadap cuaca ekstrem."
 ship_armor_ice_carrier_deck_2: "Landasan Pykrete Bertulang Baja"
 ship_armor_ice_carrier_deck_2_desc: "Pykrete bertulang baja menghadirkan konstruksi yang lebih kokoh, mampu menahan kerusakan lebih besar sekaligus menawarkan isolasi termal yang lebih baik."
 ship_armor_ice_carrier_deck_3: "Landasan Komposit Es"
 ship_armor_ice_carrier_deck_3_desc: "Material dan metode terkini menghadirkan ketahanan struktur terbaik dan meminimalkan dampak cuaca buruk terhadap operasi penerbangan kapal."
