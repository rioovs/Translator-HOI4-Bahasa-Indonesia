 HINT_AIR_BASE: "Petunjuk: Pangkalan Udara"
 HINT_AIR_BASE_TEXT: "Dunia dibagi menjadi §YWilayah Udara§! yang telah ditentukan sebelumnya. §YSayap Udara§! adalah sekelompok pesawat dengan jenis yang sama (misalnya Pesawat Tempur atau Pembom) dan mereka dapat ditugaskan ke suatu wilayah.\n\nSaat Anda mengklik §YPangkalan Udara§! di peta, Pangkalan Udara tersebut akan terbuka dan secara otomatis memilih semua Sayap Udara di pangkalan itu.\n\nUntuk menetapkan memilih Sayap Udara ke suatu wilayah atau untuk memindahkannya ke Pangkalan Udara lain, §Gklik kanan§! Wilayah Udara atau Pangkalan Udara.\n\nAnda juga dapat memasang Sayap Udara ke Pasukan, dengan memilih Sayap Udara dan §Gklik kanan§! pada Angkatan Darat di bagian bawah layar."
 HINT_CONSTRUCTIONS: "Petunjuk: Konstruksi"
 HINT_CONSTRUCTIONS_TEXT: "Ini adalah layar §YConstructions§! dan digunakan untuk meningkatkan Negara Bagian dan Provinsi Anda dengan membangun gedung. Di awal permainan, disarankan agar Anda membangun £GFX_civ_factory §YPabrik Sipil§! selama beberapa tahun sebelum mulai membangun £GFX_mil_factory §YPabrik Militer§! atau struktur yang lebih terspesialisasi. Dengan membangun Pabrik Sipil, Anda akan dapat membangun lebih banyak bangunan dalam jangka panjang.\n\nSemua Pabrik Sipil gratis akan membangun gedung baru sesuai pesanannya di antrian Konstruksi. Semakin tinggi £GFX_infrastructure_texticon §G80%§! §YInfrastruktur Negara§!, semakin cepat pembangunannya.\n\nPabrik Sipil telah disorot untuk kenyamanan Anda. §YKlik untuk mengaktifkan Build Mode§!. Saat Build Mode aktif, klik pada peta untuk mengantri pembangunan gedung. §YTahan shift dan klik untuk mengantri jumlah maksimum.§!"
 HINT_ARMY_PLANNER: "Petunjuk: Rekrut & Terapkan"
 HINT_ARMY_PLANNER_TEXT_1_1: "Ini adalah layar §YRecruit & Deploy§! dan ini adalah tempat Anda mengantri divisi baru untuk pelatihan dan kemudian penerapan. Kami menyarankan Anda menambahkan Divisi §YDivisione di Fanteria§! ke antrean.\n\nDivisi dalam pelatihan pertama-tama akan berupaya mengumpulkan §YPeralatan§! yang mereka perlukan. Begitu mereka memiliki Peralatan, mereka akan memulai pelatihannya. Kemajuan pelatihan tidak akan pernah melebihi kemajuan peralatan.\n\nKlik tombol §YTrain§! untuk menambahkan Divisi untuk pelatihan."
 HINT_ARMY_PLANNER_TEXT_1_2: "Setelah Divisi menyelesaikan pelatihannya, Divisi tersebut dapat §YDikerahkan§! ke §Ylokasi pilihan Anda§!. Anda hanya dapat menyebarkan Divisi di wilayah inti Anda."
 HINT_ARMY_PLANNER_TEXT_2: "Divisi dapat diproduksi secara serial dan/atau paralel.\n\nDivisi yang dilatih secara paralel akan memperoleh §YPeralatan§! dengan kecepatan yang sama, sehingga semuanya akan selesai pada waktu yang kurang lebih bersamaan. Ketika sebuah Divisi memiliki semua peralatan yang mereka perlukan dan telah terlatih sepenuhnya, mereka akan dikerahkan ke lokasi yang Anda pilih.\n\nKlik §YTambahkan Unit§! untuk menambahkan Divisi lain untuk pelatihan paralel.\n\nJika gelombang perang berbalik melawan Anda, mungkin layak untuk mengerahkan Divisi Anda §Ysebelum mereka memiliki semua peralatan dan pelatihan§!. Hal ini harus dihindari bila Anda bisa.\n\nAnda dapat membaca lebih lanjut tentang unit apa yang harus direkrut di HOI4 Wiki!"
 HINT_DIPLOMACY_SCREEN: "Petunjuk: Diplomasi"
 HINT_DIPLOMACY_TEXT: "Ini adalah layar §YDiplomasi§! dan di sini Anda mendapatkan gambaran umum tentang pendapat negara lain tentang Anda, apakah pendapat tersebut dijamin oleh negara lain.\n\nAda baiknya untuk mengetahui apakah target yang Anda tuju memiliki sekutu yang dapat mereka hubungi.\n\nAnda juga dapat §GKlik Kanan§! di negara mana pun untuk melihatnya interaksi diplomatik yang tersedia."
 HINT_DIVISION_DESIGNER: "Petunjuk: Desainer Divisi"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "Ini adalah §YDesainer Divisi§! dan digunakan untuk membuat atau mengedit §YTemplat Divisi§!. Mengedit atau membuat Templat Divisi baru akan dikenakan biaya £army_experience §YPengalaman Tentara§!. Pengalaman Angkatan Darat diperoleh ketika unit Anda terlibat dalam pertempuran atau sedang melakukan latihan militer. Unit dengan Pengalaman Level 1 - §YHijau§! tidak menghasilkan £army_experience Pengalaman Tentara.\n\nAnda memerlukan lebih banyak £army_experience Pengalaman Tentara sebelum Anda dapat membuat atau mengedit Templat Divisi."
 HINT_DIVISION_DESIGNER_XP_TEXT: "Ini adalah §YDesainer Divisi§! dan digunakan untuk membuat atau mengedit §YTemplat Divisi§!. Mengedit atau membuat Templat Divisi baru akan dikenakan biaya £army_experience §YPengalaman Tentara§!. Pengalaman Angkatan Darat diperoleh ketika unit Anda terlibat dalam pertempuran atau sedang melakukan latihan militer. Unit dengan Pengalaman Level 1 - §YHijau§! tidak menghasilkan £army_experience Pengalaman Tentara.\n\nUntuk pengeditan template pertama Anda, kami menyarankan Anda mengklik slot kosong di bawah kolom Dukungan untuk menambahkan £unit_artillery_icon_small §YArtileri Dukungan§! ke divisi Anda. Setelah Anda menambahkannya, klik §YSimpan§!. Divisi Anda yang menggunakan templat ini sekarang akan mulai meminta Artileri §YPeralatan§!."
 HINT_EDIT_TEMPLATE_TEXT: "Anda memproduksi peralatan yang tidak digunakan oleh §YTemplate Divisi§! mana pun. Namun Anda juga memiliki £army_experience §YPengalaman Angkatan Darat§! untuk melakukan sesuatu.\n\nKlik §YEdit§! di samping §YDivisione di Fanteria§! atau Divisi lain pilihan Anda."
 HINT_EXECUTE_ORDER_TEXT: "Di bawah potret, terdapat bilah kemajuan kecil (3) yang menunjukkan kekuatan relatif antara Angkatan Darat Anda dan kemungkinan kekuatan musuh.\n\nJika Anda belum menugaskan Komandan Angkatan Darat, Anda mungkin harus melakukannya sekarang. Klik potret kosong di kiri atas.\n\nJika semuanya tampak sesuai keinginan Anda, perkiraan lampu rencana (2) akan berwarna hijau. Itu dia, klik tombol Execute Plan (1)."
 HINT_NAVAL_MISSIONS: "Petunjuk: Misi Angkatan Laut"
 HINT_NAVAL_MISSIONS_TEXT: "Ini adalah antarmuka §YFleet§! dan di sinilah Anda dapat melihat dan memberi perintah kepada armada yang dipilih. Anda dapat membuat armada Anda melakukan pekerjaan tertentu dengan mengirimkannya ke §YMisi Angkatan Laut§!.\n\nSebuah armada biasanya dibagi menjadi beberapa §YSatuan Tugas§!. Armada bisa aktif di beberapa wilayah sekaligus, tapi Satgas biasanya tidak bisa. Ketika sebuah armada berada dalam Misi Angkatan Laut, armada tersebut akan mencoba untuk mencakup semua zona yang ditetapkan, namun hal ini mungkin membuatnya terlalu tersebar untuk melawan kekuatan musuh yang kuat.\n\nUntuk mengirim armada pada §YMisi Angkatan Laut§!, klik salah satu tombol misi yang disorot lalu §Gklik kanan§! pada §YWilayah Laut§!. Memesan armada Anda ke §YPatrol§! suatu wilayah mungkin merupakan ide yang bagus."
 HINT_LOGISTICS: "Petunjuk: Logistik dan Pasokan"
 HINT_LOGISTICS_TEXT: "Ini adalah layar §YLogistics§! dan tujuannya adalah untuk membantu Anda melihat apakah Anda memproduksi peralatan lebih cepat atau lebih lambat daripada yang Anda habiskan.\n\nJika Anda memproduksi lebih banyak jenis §YPeralatan§! daripada yang Anda pikir Anda perlukan, mungkin ada baiknya untuk mengurangi jumlah pabrik yang mengerjakan §YProduksi Jalur§! yang memproduksi Peralatan jenis itu.\n\nApakah divisi Anda memiliki §Ysupply§! yang baik atau tidak adalah bagian penting dari kesuksesan Anda di medan perang. Anda dapat memeriksa status persediaan Anda dengan beralih ke §YMode Peta Pasokan§! £GFX_F4 ."
 HINT_LOGISTICS_TEXT_2: "Pasokan didistribusikan dari £GFX_capital_hub_texticon §YCapital Supply Hub§! dan mengalir melalui £GFX_train_texticon §YTrains§! atau £GFX_convoy_texticon §YConvoys§! ke £GFX_supply_hub_texticon §YSupply Hub§! atau £GFX_naval_supply_hub_texticon §YPangkalan Angkatan Laut§! di berbagai provinsi.\n\nPasokan kemudian didistribusikan ke divisi yang ditempatkan dalam jangkauan hub. Anda dapat melihat rentangnya dengan memilih £GFX_supply_hub_texticon §YSupply Hub§! dan menahan £GFX_shift. Jangkauan dapat dipengaruhi oleh motorisasi yang menggunakan £GFX_unit_motorized_icon_small §YTruk§!.\n\nEfisiensi selanjutnya dipengaruhi oleh tingkat £GFX_railways_texticon §YKereta Api§! dan £GFX_naval_supply_hub_texticon §YNaval Pangkalan§!, kekurangan £GFX_train_texticon §YKereta§!, dan serangan udara musuh. Hal ini menciptakan §Rkemacetan§!. Hal ini dapat diatasi dengan meningkatkan jalur kereta api menjadi pusat pasokan ibu kota, menyediakan pertahanan udara dengan pesawat tempur, dan memastikan tersedianya kereta api yang cukup. Ketersediaan pasokan ditampilkan di §YSupply Mapmode§! £GFX_F4 ."
 HINT_OBJ_LOG_1: "Beralih ke §LMode Peta Pasokan§! £GFX_F4"
 HINT_OBJ_LOG_2: "Beralih kembali ke §Lmode peta biasa§! £GFX_F1"
 HINT_NATIONAL_FOCUS: "Petunjuk: Fokus Nasional"
 HINT_NATIONAL_FOCUS_TEXT: "Ini adalah layar §YFokus Nasional§! dan memungkinkan negara Anda memilih tujuan politiknya yang akan menghasilkan efek atau bonus yang membantu kemajuan permainan.\n\nKami telah menyoroti beberapa Fokus Nasional untuk kenyamanan Anda yang kami sarankan agar Anda memulainya. Alasan jalur ini direkomendasikan adalah karena memungkinkan Anda memperoleh §YSlot Penelitian§! lainnya secepat mungkin, yang memungkinkan Anda meneliti satu lagi £tech_mod §YTeknologi§! secara bersamaan."
 HINT_NATIONAL_FOCUS_RECOMMENDED_TEXT: "Fokus Nasional yang Direkomendasikan"
 HINT_NO_TEMPLATE: "Petunjuk: Tidak Ada Templat"
 HINT_NO_TEMPLATE_NO_XP_TEXT: "Anda telah mengklik §YTidak Ada Peringatan Template§!. Jangan kuatir! Sangat baik jika Anda terus melihat peringatan untuk mendapatkan jawaban, mereka ada untuk membantu Anda.\n\nKemungkinan besar, Anda membuat Lini Produksi yang memproduksi peralatan Artileri. Pada saat ini, tidak ada satu pun dari §YDivisi§! Anda yang menggunakan peralatan itu di salah satu §YTemplat Divisi§!.\n\nSetelah Anda memperoleh lebih banyak £army_experience §YPengalaman Tentara§!, Anda dapat mengedit Templat Divisi Anda untuk menyertakan Artileri. £army_experience Pengalaman Tentara diperoleh ketika Divisi Anda terlibat dalam pertempuran atau ketika mereka sedang latihan militer.\n\nAnda dapat mengabaikan peringatan ini untuk saat ini, karena tutorial ini akan membantu Anda setelah Anda mendapatkan lebih banyak £army_experience Pengalaman Tentara."
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "Anda telah mengklik §YTanpa peringatan Template§! yang menunjukkan bahwa Anda memproduksi Peralatan yang saat ini tidak Anda gunakan.\n\nUntuk memungkinkan Divisi Anda mulai menggunakan jenis peralatan baru, Anda perlu mengedit §YTemplate Divisi§! mereka. Mengedit Templat Divisi memerlukan biaya £army_experience §YPengalaman Angkatan Darat§!.\n\nBuka layar §YRekrut & Deploy§! dan pilih Templat Divisi untuk §YEdit§!.\n\nOleh Dengan tooltip peringatan ini, Anda dapat melihat jenis Peralatan apa yang Anda produksi, namun saat ini tidak Anda gunakan."
 HINT_POLITICS_SCREEN: "Petunjuk: Politik"
 HINT_POLITICS_SCREEN_TEXT: "Ini adalah §YLayar Politik§! dan di sinilah Anda dapat mengakses hal-hal seperti §YFokus Nasional§! negara Anda, £pol_idea §YIdeas§!, §YHukum§! dan more.\n\n£pol_power §YKekuatan Politik§! mewakili kemampuan negara Anda untuk mencapai tujuan politiknya.\nMempekerjakan penasihat, membenarkan klaim atau menjamin kemerdekaan adalah contoh tindakan yang membutuhkan £pol_power Kekuatan Politik.\n\n£pol_idea Ide berikan negara Anda bonus di berbagai bidang, tetapi bonus tersebut juga memerlukan £pol_power Kekuatan Politik untuk mengaktifkannya."
 HINT_PRODUCTION_LINES: "Petunjuk: Jalur Produksi"
 HINT_PRODUCTION_LINES_TEXT_1: "Ini adalah layar §YJalur Produksi§!. Jalur Produksi memproduksi peralatan yang dibutuhkan untuk upaya perang Anda. Disarankan agar Anda memproduksi peralatan yang Anda perlukan saat ini dan yang mungkin Anda perlukan di masa depan.\n\nAda dua jenis Jalur Produksi: Militer dan Angkatan Laut. Yang pertama menggunakan £factory_item §YPabrik Militer§! dan yang terakhir menggunakan £naval_factory_icon §Ygalangan kapal angkatan laut§!. Semakin banyak pabrik yang ditugaskan pada Lini Produksi, semakin cepat pabrik tersebut memproduksi peralatan yang Anda perlukan.\n\nLini Produksi dapat dibuat dengan mengklik salah satu dari empat tombol yang disorot."
 HINT_PRODUCTION_LINES_TEXT_2: "Setelah Anda memilih jenis peralatan, Lini Produksi akan dibuat untuk jenis peralatan tersebut.\n\nBaca §Yhalaman berikutnya§! petunjuk ini untuk §Ymelihat rekomendasi§! tentang apa yang harus diproduksi dan berapa banyak pabrik yang akan ditugaskan ke setiap Lini Produksi."
 BUTTON_HINT_PAGE_1: "1"
 BUTTON_HINT_PAGE_2: "2"
 HINT_PRODUCTION_LINES_2_1: "Pada gambar di bawah ini Anda dapat melihat contoh Lini Produksi dengan §Y10§! £factory_item §YPabrik Militer§! ditugaskan padanya."
 HINT_PRODUCTION_LINES_2_2: "Kami menyarankan Anda juga membuat Jalur Produksi untuk:"
 HINT_RESEARCH_TREE: "Petunjuk: Pohon Penelitian"
 HINT_RESEARCH_TREE_TEXT: "Ini adalah §YPohon Penelitian§!. Meskipun pada awalnya mungkin tampak rumit, sebenarnya tidak terlalu rumit. Kami telah menyoroti beberapa teknologi yang direkomendasikan untuk diteliti di awal permainan.\n\nAdalah ide bagus untuk meneliti teknologi yang meningkatkan basis industri negara Anda serta peningkatan militer yang lebih umum. Seiring berjalannya permainan, mungkin sah untuk meneliti Teknologi yang lebih terspesialisasi seperti Tank atau Pesawat. Itu semua tergantung pada apa yang ingin Anda capai.\n\nTeknologi membutuhkan waktu lebih lama untuk diteliti jika Anda mencoba meneliti sesuatu sebelumnya. Terdapat §YFokus Nasional§! yang dapat mengurangi penalti dini untuk Teknologi tertentu."
 HINT_RESEARCH_SCREEN: "Petunjuk: Penelitian"
 HINT_RESEARCH_SCREEN_TEXT: "Ini adalah layar §YResearch§!. Anda memiliki sejumlah slot penelitian yang masing-masing dapat meneliti £tech_mod §YTeknologi§!. Klik §YSlot Penelitian§! yang kosong untuk memilih sesuatu yang akan diteliti.\n\nNegara mempunyai jumlah Slot Penelitian yang berbeda, dengan Kekuatan Besar biasanya memiliki lebih banyak. Dimungkinkan untuk membuka slot tambahan melalui §YFokus Nasional§!. Fokus Nasional akan tercakup dalam peringatan lain dan petunjuk lain."
 HINT_DECISION_SCREEN: "Petunjuk: Peristiwa dan Keputusan"
 HINT_DECISION_SCREEN_TEXT: "§YPeristiwa§! terjadi sepanjang permainan. Ada berbagai macam peristiwa dalam permainan, yang dapat memberikan hasil positif, negatif, dan beragam bagi negara pemain. Keputusan tersebut berbentuk pemberitahuan pop-up di layar pemain, yang mungkin memberikan pilihan kepada pemain, atau sekadar memberi tahu pemain tentang konsekuensinya dan mengharuskan mereka mengakui peristiwa tersebut telah terjadi.\n\n§YKeputusan§! adalah tujuan jangka panjang dan/atau pendek yang dapat Anda perjuangkan. Pengambilan keputusan memerlukan biaya £pol_power §YKekuatan Politik§!.\n\nBeberapa keputusan ditentukan waktunya dan memerlukan kondisi tertentu untuk diselesaikan dalam jangka waktu tertentu."
 HINT_INTELLIGENCEAGENCY_SCREEN: "Petunjuk: Badan Intelijen"
 HINT_INTELLIGENCEAGENCY_SCREEN_TEXT: "Ini adalah layar §YBadan Intelijen§!. Sebuah §YBadan Intelijen§! diperlukan untuk merekrut mata-mata, mengumpulkan intel, membangun jaringan §Ymata-mata§! dan melakukan §Yoperasi§! rahasia. §YKriptologi§! adalah aspek lain dari perang, dan memecahkan sandi musuh dapat memberi Anda keuntungan besar di medan perang.\n\nSemakin tinggi intel Anda, semakin banyak yang Anda ketahui tentang penempatan pasukan musuh, kapasitas industri, fokus penelitian, dan banyak lagi.\n\nAnda bisa §GKlik Kanan§! suatu negara untuk menampilkan '§YIntel Ledger§! di tab di sebelah §YDiplomacy§!."
 HINT_OFFICER_CORPS_SCREEN: "Petunjuk: Korps Perwira"
 HINT_OFFICER_CORPS_SCREEN_TEXT_1: "Ini adalah layar §YPetugas Korps§!. Di sinilah Anda menunjuk §YKomando Tinggi Militer§!, §YAhli Teori§!, serta §YPanglima Angkatan Darat§!, §YAngkatan Laut§!, dan §YAngkatan Udara§!.\n\nPanglima dan Panglima Tinggi Militer memberikan £army_experience §YPengalaman Angkatan Darat§!, £navy_experience §YPengalaman Angkatan Laut§!, £air_experience §YPengalaman Udara§! serta bonus untuk statistik tertentu yang ditampilkan di bawah setiap cabang."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "Para ahli teori mengurangi biaya §YDoctrines§! Darat, Laut dan Udara, yang berfokus pada strategi keseluruhan. Ini ditetapkan untuk setiap cabang militer, memberikan bonus kepada divisi, armada, dan resimen udara yang diturunkan."
 HINT_OCCUPIED_TERRITORIES_SCREEN: "Petunjuk: Wilayah Pendudukan"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "Untuk memerangi perlawanan dan mengawasi penduduk, negara-negara yang diduduki perlu ditempatkan oleh pasukan militer untuk menjalankan tugas kepolisian. Garnisun dalam game mewakili hal ini dan dapat ditugaskan dari tab §YWilayah Pendudukan§! di §YLayar Politik§! Anda, yang dibuka dengan mengklik bendera negara Anda di sudut kiri atas.\n\nDivisi yang diperlukan untuk mengatur garnisun tidak terlihat di peta dan dialokasikan serta mendapatkan peralatan mereka secara otomatis. Alokasi peralatan dapat diatur melalui tab §YRecruit & deploy§!."
 HINT_SELECT_UNIT_TEXT: "Saatnya berperang melawan §YEthiopia§!. Anda harus mulai dengan memberi perintah pada unit Anda dengan membuat Rencana Pertempuran dengan Perintah Ofensif.\n\n§YPilih Divisi§! yang disorot di negara bagian §YEritrea§!."
 HINT_TRADE_SCREEN: "Petunjuk: Perdagangan"
 HINT_TRADE_SCREEN_TEXT: "Ini adalah layar §YTrade§! dan memungkinkan Anda untuk memperdagangkan £GFX_civ_factory §YPabrik Sipil§! Anda dengan sumber daya.\n\nPeringatan §YSumber Daya Tidak Cukup§! akan muncul setiap kali salah satu lini produksi Anda tidak memiliki sumber daya yang diperlukan. Jalur produksi akan terus memproduksi peralatan, namun dengan kecepatan yang dikurangi. Perdagangan adalah pilihan yang valid untuk menyelesaikan masalah tersebut.\n\nPerhatikan bahwa ketika Anda menukar Pabrik Sipil Anda dengan sumber daya, sumber daya tersebut tidak dapat digunakan untuk membangun gedung."
 HINT_WAR_SCREEN: "Petunjuk: Perang"
 HINT_WAR_SCREEN_TEXT: "Ini adalah layar §YWar§! dan ini akan menunjukkan kepada Anda bagaimana perang sedang berlangsung.\n\nItalia mulai berperang dengan Etiopia, namun Anda tidak perlu khawatir tentang hal itu sekarang. Lanjutkan dengan melihat peringatan lainnya."
 HINT_WORLD_TENSION: "Petunjuk: Ketegangan Dunia"
 HINT_WORLD_TENSION_TEXT: "Ini adalah layar £world_tension_icon §YKetegangan Dunia§!. Semua peristiwa yang mempengaruhi Ketegangan Dunia, akan ditampilkan dalam daftar di sini.\n\nKetegangan Dunia adalah ukuran seberapa panasnya permainan ini. Negara-negara tertentu mungkin memiliki §YTindakan Diplomatik§! tertentu yang dikunci sampai Ketegangan Dunia cukup tinggi.\n\nSecara umum, negara-negara Poros ingin Ketegangan Dunia tetap rendah untuk mencegah negara-negara Demokrat melakukan intervensi, sementara negara-negara Demokrat ingin Ketegangan Dunia tinggi sehingga mereka dapat melakukan intervensi.\n\nMenyatakan perang, membenarkan klaim, mencaplok wilayah, menyelesaikan §YFokus Nasional§! tertentu merupakan contoh tindakan yang dapat meningkatkan Ketegangan Dunia.\n\nSemakin tinggi Ketegangan Dunia, semakin dekat Anda dengan Perang Dunia."
 HINT_WORLD_TENSION_TEXT_2: "£world_tension_icon §YKetegangan Dunia§! adalah ukuran seberapa panasnya pertandingan tersebut. Negara-negara tertentu mungkin memiliki §YTindakan Diplomatik§! tertentu yang dikunci sampai Ketegangan Dunia cukup tinggi.\n\nSecara umum, kekuatan Fasis dan Komunis menginginkan Ketegangan Dunia tetap rendah untuk mencegah negara-negara Demokrat melakukan intervensi, sementara negara-negara Demokrat ingin Ketegangan Dunia menjadi tinggi sehingga mereka dapat melakukan intervensi.\n\nMenyatakan perang, membenarkan klaim, mencaplok wilayah, menyelesaikan §YFokus Nasional§! tertentu adalah contoh tindakan yang mungkin meningkatkan Ketegangan Dunia.\n\nSemakin tinggi Ketegangan Dunia, semakin dekat Anda dengan Perang Dunia."
 HINT_LOW_SUPPLY: "Petunjuk: Pasokan"
 HINT_LOW_SUPPLY_TEXT_1: "Untuk menjaga agar divisi Anda tetap mampu bertempur, Anda memerlukan persediaan. Pasokan didistribusikan dari £GFX_capital_hub_texticon §YCapital Supply Hub§! dan mengalir melalui £GFX_train_texticon §YTrains§! atau £GFX_convoy_texticon §YConvoys§! ke £GFX_supply_hub_texticon §YSupply Hub§! atau £GFX_naval_supply_hub_texticon §YPangkalan Angkatan Laut§! di berbagai provinsi.\n\nPasokan kemudian didistribusikan ke divisi yang ditempatkan dalam jangkauan hub. Anda dapat melihat rentangnya dengan memilih £GFX_supply_hub_texticon §YSupply Hub§! dan menahan £GFX_shift. §YPrioritas Motorisasi§! dapat meningkatkan jangkauan hub, sehingga meningkatkan jangkauan di mana divisi Anda menerima pasokan. Ini akan menggunakan £GFX_unit_motorized_icon_small §YTrucks§!."
 HINT_LOW_SUPPLY_TEXT_2: "Anda dapat mengubah §YPrioritas Motorisasi§! pada Angkatan Darat, dengan memilihnya dan menelusuri ketiga level ini di kiri atas. Secara default, prioritas disetel ke rendah, yang tidak menggunakan £GFX_unit_motorized_icon_small §YTrucks§!.\n\nKetersediaan pasokan ditampilkan di §YSupply Mapmode§! £GFX_F4 . Untuk kembali ke §YDefault Mapmode§! klik £GFX_F1 ."
 HINT_4_FAC: "£factory_item §Yx4§!"
 HINT_3_FAC: "£factory_item §Yx2§!"
 HINT_2_FAC: "£factory_item §Yx2§!"
 HINT_13_FAC: "£factory_item §Yx1§!"
 HINT_11_FAC: "£naval_factory_icon §Yx10§!"
 HINT_12_FAC: "£naval_factory_icon §Yx1§!"
INTERNATIONAL_MARKET_HINT_SCREEN: "Petunjuk: Pasar Internasional"
INTERNATIONAL_MARKET_HINT_SCREEN_TEXT: "Ini adalah layar §YPasar Internasional§!. Di sini Anda dapat membeli peralatan dari negara lain dan menjual peralatan Anda sendiri seharga £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$, yang untuk sementara akan meningkatkan kecepatan konstruksi Anda.\n\nSaat Anda membeli peralatan, Anda perlu menugaskan £GFX_civ_factory §YPabrik Sipil§! ke dalam kontrak, yang akan menghasilkan £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$ yang harus Anda bayar untuk peralatan. Semakin banyak pabrik yang Anda tetapkan, semakin sedikit pengiriman yang akan dilakukan, dan Anda akan mendapatkan jumlah total peralatan dengan lebih cepat. Perhatikan bahwa ketika Anda menugaskan £GFX_civ_factory §YPabrik Sipil§! Anda untuk membayar kontrak, pabrik tersebut tidak dapat digunakan untuk membangun gedung.\n\n§YPeringatan Kontrak Tidak Efisien§! akan ditampilkan di tombol §YPasar Internasional§! setiap kali salah satu dari Anda kontrak tidak mengirimkan jumlah peralatan yang diharapkan atau memproduksi £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$ dalam jumlah yang diharapkan. Kontrak akan tetap berjalan, tetapi diperlukan lebih banyak pengiriman untuk menyelesaikannya."
BUTTON_WIKI_MARKET: "Baca tentang §HMarket§! di HOI4 Wiki!"
MILITARY_INDUSTRIAL_ORG_HINT_SCREEN: "Petunjuk: Organisasi Industri Militer"
MILITARY_INDUSTRIAL_ORG_HINT_SCREEN_TEXT: "Saat Anda memproduksi, meneliti, atau mendesain peralatan, Anda dapat menetapkan $INDUSTRIAL_ORG_TOOLTIP_HEADER$. Organisasi-organisasi ini memberikan perbaikan pada peralatan yang mereka teliti atau rancang. Di lini produksi, mereka membantu kecepatan produksi, efisiensi, dan kebutuhan sumber daya.\n\nUntuk setiap tugas yang diselesaikan $INDUSTRIAL_ORG_TOOLTIP_HEADER$, ia memperoleh dana yang dapat digunakan untuk membuka sifat. Ciri-ciri ini meningkatkan peralatan atau bonus produksi $INDUSTRIAL_ORG_TOOLTIP_HEADER$.\n\nSetiap penelitian yang ditugaskan kepada $INDUSTRIAL_ORG_TOOLTIP_HEADER$ akan dikenakan biaya £pol_power §YKekuatan Politik§! harian."
BUTTON_WIKI_MILITARY_INDUSTRIAL_ORG: "Baca tentang §HOrganisasi§! di HOI4 Wiki!"
