 tut_1_text_1: "Selamat datang di tutorial §YHearts of Iron IV§!!\n\nAnda akan memimpin Italia @ITA selama periode menjelang perang. Membaca tooltips akan membantu Anda memahami berbagai hal saat bermain, jadi Anda disarankan untuk memanfaatkannya dengan baik."
 tut_1_text_alert: "Mulailah dengan §Ymenangani peringatan§! di bagian atas layar."
 tut_2_text_1: "Bagus! Sekarang setelah peringatannya beres, Anda dapat mulai menyelami detail peperangan. Italia mulai berperang dengan Etiopia dan Anda tidak akan mengalami banyak kesulitan untuk memenangkan perang tersebut setelah Anda mempelajari cara melakukannya.\n\nGerakkan kamera Anda ke arah tenggara hingga Anda menemukan Eritrea di Afrika. Setelah lokasi kamera Anda berubah, §Ypilih Divisi§! dalam status $STATE|Y$ dengan menahan §Gklik kiri§! dan seret pilihan."
 tut_3_text_1: "Hebat! Sekarang Anda akan belajar bagaimana memulai merencanakan serangan.\n\nDivisi dapat bergabung bersama dalam §YArmies§!. Pasukan digunakan untuk menyusun Rencana Pertempuran dan mereka dapat diberi §YKomandan§! untuk memimpinnya."
 tut_3_text_2: "Saat Anda telah memilih divisi, klik tombol §YTentara Baru§! di bagian bawah layar. Lakukan prosedur yang sama untuk divisi di selatan, di §YSomaliland§!."
 tut_4_text_1: "Bagus! Membuat Tentara adalah langkah pertama.\n\nSeorang §YTentara§! dapat diberikan perintah dengan menggambar §YRencana Pertempuran§!.\n\nKlik tombol §YFront Line§! lalu klik perbatasan ke Etiopia. Arahkan kursor ke tombol §YGaris Depan§! untuk mendapatkan informasi lebih lanjut tentang cara menggambar garis depan. Jika Anda ingin menghapus garis depan Anda klik §YHapus Pesanan§!."
 tut_5_text_1: "Bagus! §YGaris Depan§! sekarang ada menuju Ethiopia. Agar Anda dapat membuat pasukan Anda menyerang dengan §YRencana Pertempuran§! Anda juga harus terlebih dahulu menggambar §YPerintah Serangan§!.\n\nKlik tombol §YGaris ofensif§! lalu tahan §Gklik kanan§! dan seret di antara dua provinsi yang disorot. Lakukan prosedur yang sama untuk divisi di selatan, di §YSomaliland§!."
 tut_6_text_1: "Anda sekarang telah membuat Perintah Serangan untuk menyerang ibu kota Ethiopia. Sebelum Anda melanjutkan dan memberikan perintah untuk melaksanakan rencana, sebaiknya lakukan persiapan yang benar.\n\nJika Anda mengizinkan unit Anda bersiap selama $DAYS_OF_PLANNING|0Y$ hari, mereka akan menerima bonus tempur hingga §G+$PLANNING_MAX|0%$§!. £tech_mod §YDoktrin Tanah§! tertentu dapat mengubah berapa lama Anda dapat §YMempersiapkan§! sementara yang lain mungkin mengubah seberapa cepat Anda dapat mencapai tingkat Persiapan maksimum Anda.\n\nDisarankan juga agar Anda mempersiapkan Angkatan Udara Anda juga. Klik §YPangkalan Udara§! di §YEritrea§!."
 tut_7_text_1: "Bagus! Agar pasukan Anda memiliki jaminan keberhasilan yang lebih tinggi dalam pertempuran, penting juga untuk memberi mereka §YDukungan Udara§! yang mungkin mereka perlukan.\n\n§YSayap Udara§! yang ditugaskan pada §YWilayah Udara§! dapat dikirim dalam misi. §YDukungan§! Sayap Udara dapat dikirim pada misi §YDukungan Udara Dekat§!, yang akan memungkinkan mereka untuk bergabung dalam pertempuran darat.\n\nTugaskan §YSayap Udara§! yang berbasis di §YEritrea Air Basis§! dengan §Gmengklik kanan§! §YDanakil§! dan memberi mereka perintah setelah mereka ditugaskan."
 tut_8_text_1: "Bagus! Anda sekarang memiliki §YSayap Udara§! yang ditugaskan ke §YWilayah Udara§! Afrika Timur. Namun, sebelum mereka mulai melakukan apa pun, Anda harus memberikan §Ymisi§! Sayap Udara Anda terlebih dahulu. Jika Sayap Udara tidak mempunyai misi aktif maka Sayap Udara akan tetap berada di Pangkalan Udara.\n\nAda sejumlah §YMisi Udara§! dan Misi Udara yang dapat dikirim oleh Sayap Udara tergantung pada jenis Sayap Udara. §YDukungan Sayap Udara§! dapat dikirim pada misi §YDukungan Udara Dekat§!, yang memungkinkan mereka bergabung dalam pertempuran darat dan menyerang musuh Anda.\n\nUntuk mengirim Sayap Udara dalam suatu misi, klik ikon misi di Antarmuka Udara."
 tut_9_text_1: "Bagus! Sekarang hampir semuanya sudah siap, saatnya untuk melihat pelaksanaan §YRencana Pertempuran§! dan taklukkan Etiopia untuk Italia.\n\nKlik tombol §YDefault Mapmode§! £GFX_F1 tombol di kanan bawah lalu pilih Pasukan Anda dengan mengeklik potret di bagian bawah layar."
 tut_10_text_1: "Bagus! Sebelum kita memulai penyerangan ke Etiopia, Anda harus menugaskan seorang Komandan di Angkatan Darat Anda jika Anda belum melakukannya. Klik §Ypotret pemimpin kosong§! di kiri atas layar dan pilih Komandan dari daftar.\n\nKlik tombol §YJalankan Rencana§! di bagian bawah layar untuk memerintahkan pasukan Anda memulai invasi."
 tut_10_text_2: "Tombol Jalankan Rencana"
 tut_11_text_1: "Pasukan Anda sekarang akan memulai serangan di Addis Ababa, ibu kota Ethiopia. Ketika Anda sudah cukup menduduki wilayah musuh, mereka akan menyerah.\n\n§YBatalkan jeda§! permainan dengan menekan £SPACE . Anda dapat mengatur kecepatan permainan dengan menekan tombol £KP_PLUS atau £KP_MINUS. Merupakan hal yang normal jika pemain sering menyesuaikan kecepatan permainan sesuai dengan kebutuhan mereka dibandingkan bermain dengan kecepatan yang sama sepanjang waktu.\n\nPetunjuk: Jika Anda merasa dapat mengontrol unit Anda dengan lebih baik, pilih divisi dan §Gklik kanan§! provinsi untuk secara manual menimpa pesanan yang diperoleh unit dari Rencana Pertempuran."
 tut_12_text_1: "Etiopia telah menyerah! Anda telah menang!\nAnda sekarang dapat mengajukan tuntutan selama §YKonferensi Perdamaian§!. Kami menyarankan Anda memilih untuk §YAmbil Semua Negara§!.\n\nSetiap permintaan yang Anda buat akan meningkatkan £world_tension_icon §YKetegangan Dunia§! dengan jumlah tertentu. Semakin tinggi §YKetegangan Dunia§!, semakin dekat Anda dengan Perang Dunia.\n\nBeberapa negara memiliki §YTindakan Diplomatik§! tertentu yang dikunci hingga Ketegangan Dunia cukup tinggi. Baca lebih lanjut pada petunjuk di bawah ini."
 tut_13_text_1: "Anda menang! Perang telah berakhir dan Ethiopia telah dikalahkan.\n\nSelama masa damai Anda mungkin ingin §Ymengangkut pasukan§! melintasi lautan untuk memindahkan mereka ke lokasi berbeda, atau mungkin untuk bersiap menghadapi perang.\n\nSekarang Ethiopia telah dikalahkan Anda tidak perlu memiliki begitu banyak Divisi di sana.\n\nPilih setidaknya §Y4 Divisi§! dan pindahkan ke §Yport yang disorot§! dengan §Gklik kanan§! provinsi."
 tut_14_text_1: "Untuk memindahkan pasukan antara dua wilayah persahabatan, pasukan Anda harus terlebih dahulu berdiri di pelabuhan.\n\nPilih unit §Yberdiri di pelabuhan§! dan §Gklik kanan§! §Ypelabuhan lain di Italia§!."
