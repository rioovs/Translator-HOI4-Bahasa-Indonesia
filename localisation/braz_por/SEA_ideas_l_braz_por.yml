 JAP_first_strike_principle_dm_desc: "Revisi Kebijakan Pertahanan Nasional yang diadopsi pada tahun 1936 telah menguraikan doktrin yang menetapkan prinsip serangan pertama dan operasi jangka pendek dalam keadaan darurat militer sebagai modus operandi militer. Oleh karena itu, persiapan kekuatan militer di masa damai diperlukan untuk operasi jangka pendek yang ditekankan dengan mempertimbangkan perang yang berkepanjangan dan habis-habisan. Kita akan memenangkan perang ini dengan cepat, karena jika tidak, kita mungkin tidak akan memenangkannya sama sekali!"
