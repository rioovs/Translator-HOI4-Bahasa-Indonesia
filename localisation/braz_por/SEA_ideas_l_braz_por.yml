 PHI_modify_economy_dynamic_modifier_tt: "[GetPHIEconomicModifier]"
 ## Great Depression
 PHI_the_great_depression_dynamic_modifier: "Depresi Hebat"
 PHI_the_great_depression_dynamic_modifier_desc: "Depresi Hebat telah memukul Amerika Serikat dengan keras, dan sebagai korbannya, kita pun tidak luput dari kehancuran finansial yang diakibatkannya."
 PHI_modify_the_great_depression_dynamic_modifier_tt: "Ubah §Y$PHI_the_great_depression_dynamic_modifier$§! dengan:"
 PHI_the_great_depression_temp_construction_speed: "Boom Konstruksi Sementara"
 PHI_ruling_ideology_ideology_drift_tt: "Penyimpangan ideologi apa pun akan sejalan dengan partai yang berkuasa"
 PHI_ruling_ideology_ideology_drift_tt_2: "Penyimpangan Partai Penguasa Harian: $KANAN|+=2$"
 ##Shaken/Recovering Economy
 PHI_shaken_economy_dynamic_modifier: "Perekonomian Terguncang"
 PHI_shaken_economy_dynamic_modifier_desc: "Dampak Depresi Hebat masih terasa di seluruh negara kita, dan perekonomian masih terguncang dan rentan terhadap guncangan. Namun tidak semuanya buruk, masih ada sedikit tanda-tanda pemulihan yang akan terjadi."
 PHI_replace_depression_dynamic_modifier_tt: "Ganti §Y$PHI_the_great_depression_dynamic_modifier$§! dengan §Y$PHI_shaken_economy_dynamic_modifier$§!\nPerubahan yang efektif:"
 PHI_replace_depression_dynamic_modifier_no_modifiers_tt: "Ganti §Y$PHI_the_great_depression_dynamic_modifier$§! dengan §Y$PHI_shaken_economy_dynamic_modifier$§!"
 PHI_modify_shaken_economy_dynamic_modifier_tt: "Ubah §Y$PHI_shaken_economy_dynamic_modifier$§! dengan:"
 PHI_recovering_economy_dynamic_modifier: "Memulihkan Perekonomian"
 PHI_recovering_economy_dynamic_modifier_desc: "Perekonomian kita telah mulai pulih dari kemalangan finansial sebelumnya, dan investasi telah dimulai kembali dengan sungguh-sungguh. Meskipun pertumbuhan nyata belum terlihat, setidaknya kita sudah kembali ke kondisi sebelum Depresi Besar melanda."
 PHI_replace_shaken_dynamic_modifier_tt: "Ganti §Y$PHI_shaken_economy_dynamic_modifier$§! dengan §Y$PHI_recovering_economy_dynamic_modifier$§!\nPerubahan yang efektif:"
 PHI_modify_recovering_economy_dynamic_modifier_tt: "Ubah §Y$PHI_recovering_economy_dynamic_modifier$§! dengan:"
 ## Economic Growth/Pearl of the Orient (Great Depression's lategame replacement)
 PHI_economic_growth_dynamic_modifier: "Pertumbuhan Ekonomi"
 PHI_economic_growth_dynamic_modifier_desc: "Kita akhirnya mulai melihat pertumbuhan ekonomi yang nyata, seiring dengan mulai berkembangnya usaha kecil dan semangat kewirausahaan, yang membawa negara ini menuju kemakmuran fiskal."
 PHI_modify_economic_recovery_dynamic_modifier_tt: "Ubah §Y$PHI_economic_growth_dynamic_modifier$§! dengan:"
 PHI_replace_economic_dynamic_modifier_tt: "Ganti §Y$PHI_recovering_economy_dynamic_modifier$§! dengan §Y$PHI_economic_growth_dynamic_modifier$§!\nPerubahan yang efektif:\nBatas ketegangan faksi gabungan: §G-[?PHI_the_great_depression_join_faction_tension|%0]§!"
 PHI_pearl_of_the_orient_dynamic_modifier: "$PHI_pearl_of_the_orient_seas$"
 PHI_pearl_of_the_orient_dynamic_modifier_desc: "Perekonomian kita benar-benar berkembang pesat, sekarang kita tidak terkekang oleh penguasa kolonial, kita bebas mengambil keputusan sendiri dan menjadi bukti kemakmuran ekonomi yang mungkin terjadi di Asia Tenggara."
 PHI_remove_economic_recovery_dynamic_modifier_tt: "Ganti §Y$PHI_economic_growth_dynamic_modifier$§! dengan §Y$PHI_pearl_of_the_orient_dynamic_modifier$§!\nPerubahan yang efektif:"
 PHI_modify_pearl_of_the_orient_dynamic_modifier_tt: "Ubah §Y$PHI_pearl_of_the_orient_dynamic_modifier$§! dengan:"
 ## Philippine Army
 PHI_philippine_army_dynamic_modifier: "Tentara Filipina"
 PHI_philippine_army_dynamic_modifier_desc: "Pasukan darat Filipina, yang terutama bertanggung jawab mempertahankan pulau asal kami. Awalnya terbentuk dari sejumlah satuan pramuka, kekuatan yang dikuasainya terus berkembang."
 PHI_philippine_army_dynamic_modifier_tt: "Ubah §Y$PHI_philippine_army_dynamic_modifier$§! dengan:"
 PHI_philippine_rule_cant_volunteer: "Dapat mengirimkan sukarelawan: §RTidak§!"
 ## Philippine Army Air Corps
 PHI_philippine_army_air_corps_dynamic_modifier: "Korps Udara Angkatan Darat Filipina"
 PHI_philippine_army_air_corps_dynamic_modifier_desc: "Meski merupakan kekuatan baru di militer Filipina, keinginan untuk menguasai langit tidak pudar karenanya."
 PHI_philippine_army_air_corps_dynamic_modifier_tt: "Ubah §Y$PHI_philippine_army_air_corps_dynamic_modifier$§! dengan:"
 ## American Interference
 PHI_american_interference_dynamic_modifier: "Intervensi Amerika"
 PHI_american_interference_dynamic_modifier_desc: "Kekuatan asing memegang kekuasaan yang besar atas negara kita, dan jika kita ingin benar-benar merasakan kemerdekaan kita, maka kendali sombong yang mereka miliki terhadap kita harus dipatahkan."
 PHI_american_interference_dynamic_modifier_tt: "Ubah §Y$PHI_american_interference_dynamic_modifier$§! dengan:"
 ## Island Nation
 PHI_island_nation_dynamic_modifier: "Negara Pulau"
 PHI_island_nation_dynamic_modifier_desc: "Filipina adalah negara kepulauan, dan oleh karena itu masyarakat kami telah mengembangkan ketertarikan alami terhadap laut."
