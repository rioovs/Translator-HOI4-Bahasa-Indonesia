 ### Dynamic Modifiers ###
 ## Defense Strategy
 PHI_defense_strategy_dynamic_modifier: "Strategi Pertahanan"
 PHI_defense_strategy_dynamic_modifier_desc: "Sebagai rangkaian pulau, Filipina secara alami cukup dapat dipertahankan. Hal ini bukan berarti kita tidak boleh menambahkan hambatan tambahan yang harus diatasi oleh penyerbu mana pun."
 PHI_defense_strategy_dynamic_modifier_tt: "Strategi Pertahanan"
 PHI_modify_defense_strategy_dynamic_modifier_tt: "Ubah §Y$PHI_defense_strategy_dynamic_modifier_tt$§! dengan:"
