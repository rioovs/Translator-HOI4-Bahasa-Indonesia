 JAP_army_and_naval_air_services_dm_desc: "Angkatan udara kita saat ini terbagi antara Dinas Udara Angkatan Darat Kekaisaran Jepang dan Dinas Udara Angkatan Laut Kekaisaran Jepang, terbagi dalam operasi, produksi serta penelitian dan pengembangan antara angkatan laut dan angkatan darat kita. Oleh karena itu, negara ini menghadapi hambatan logistik yang besar, yang beberapa di antaranya hanya dapat diatasi dengan penggabungan angkatan udara kita."
