 JAP_imperial_army_dm_desc: "IJA adalah pasukan darat utama kami, yang memainkan peran penting dalam modernisasi pesat selama era Meiji, dan telah bertempur dalam berbagai konflik termasuk Perang Jepang-Qing, Perang Rusia-Jepang, serta Perang Besar. Awalnya dibentuk dari tentara domain setelah Restorasi Meiji, kemudian berkembang menjadi militer modern yang kuat yang dipengaruhi oleh model Perancis dan Jerman."
