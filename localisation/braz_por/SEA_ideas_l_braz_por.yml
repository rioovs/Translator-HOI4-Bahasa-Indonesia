 CHI_liberated_by_democratic_china: "Dibebaskan oleh [CHI.GetNameDefCap]"
 CHI_liberated_by_democratic_china_desc: "Negara kita akhirnya memperoleh kemerdekaan yang sah dari penjajah. Dengan bantuan [CHI.GetNameDef] kita sekali lagi menjadi negara bebas. Dengan tindakan mereka yang jelas-jelas membantu kami, ide-ide komunis yang mereka khotbahkan mulai mengakar di dalam masyarakat kami."
