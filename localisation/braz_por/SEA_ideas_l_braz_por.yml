 ### state ###
 SIK_state_autonomous_prefecture: "Prefektur Otonomi"
 SIK_state_autonomous_prefecture_desc: "Diperintah oleh para pemimpin lokal, jangkauan pemerintah yang berlebihan di prefektur ini berkurang, dan jika terjadi perang, para pemimpin ini mungkin tidak sepenuhnya loyal."
 PRC_the_yulin_garrison: "Garnisun Yulin"
 PRC_the_yulin_garrison_desc: "Meskipun kami berupaya semaksimal mungkin untuk menghalau mereka, Divisi 86 dan 84 di bawah pimpinan Jing Yueixu dan Gao Guizi telah berhasil menangkis serangan kami dan secara efektif menjaga wilayah utara tetap berada di bawah kendali Kuomintang. Namun menyingkirkan mereka tidaklah mudah, karena posisi mereka sangat kuat."
### military spirits  ###
living_off_the_land_army_spirit: "Hidup di Luar Negeri"
living_off_the_land_army_spirit_desc: "Menghancurkan musuh dengan senjata Anda sendiri adalah hal yang baik, tetapi lebih baik lagi menghancurkannya dengan senjata Anda sendiri."
rapid_emplacement_army_spirit: "Penempatan Cepat"
rapid_emplacement_army_spirit_desc: "Semua daya tembak di dunia tidak berarti apa-apa jika berada di tempat yang salah."
direct_fire_support_army_spirit: "Dukungan Kebakaran Langsung"
direct_fire_support_army_spirit_desc: "Turunkan ke ketinggian nol dan libatkan musuh dalam pemandangan terbuka!"
subsidized_contracts_army_spirit: "Kontrak Bersubsidi"
subsidized_contracts_army_spirit_desc: "Meskipun mengganti kuda dengan tank merupakan hal yang diinginkan dalam jangka panjang, hal ini tidak dapat dilakukan dengan mengorbankan kehancuran perekonomian nasional."
subsidized_contracts_no_lar_army_spirit: "$subsidized_contracts_army_spirit$"
subsidized_contracts_no_lar_army_spirit_desc: "$subsidized_contracts_army_spirit_desc$"
all_arms_at_defense_army_spirit: "Pertahanan Anti-tank Seluruh Senjata"
all_arms_at_defense_army_spirit_desc: "Terobosan lapis baja bisa terjadi kapan saja, di mana saja. Dewa Perang membantu mereka yang membantu dirinya sendiri."
spirit_of_defiance_army_spirit: "Semangat Pembangkang"
spirit_of_defiance_army_spirit_desc: "Suatu bangsa tidak dapat ditaklukkan sampai mereka mengakui bahwa mereka telah ditaklukkan."
proxy_wars_army_spirit: "Spesialis Intervensi"
proxy_wars_army_spirit_desc: "Musuh dari musuhku adalah temanku."
naval_tripwire_navy_spirit: "Tripwire Angkatan Laut"
naval_tripwire_navy_spirit_desc: "Kita mungkin tidak sepenuhnya menghentikan musuh mendekati pantai kita, tapi kita bisa membuat hal itu berdarah dan merugikannya."
ship_to_shore_navy_spirit: "Pelatihan Kirim ke Pantai"
ship_to_shore_navy_spirit_desc: "Tidak ada artileri darat yang mampu menandingi kekuatan senjata yang dapat dihasilkan oleh puluhan ribu ton baja angkatan laut."
scouting_force_navy_spirit: "Pasukan Pramuka"
scouting_force_navy_spirit_desc: "Lautnya sangat luas. Kemenangan dalam pertempuran biasanya jatuh ke tangan pihak yang mendeteksi dan menyerang pihak lain terlebih dahulu."
fleet_defense_navy_spirit: "Pertahanan Armada"
fleet_defense_navy_spirit_desc: "Patroli udara tempur dan kapal ringan hadir untuk memungkinkan kapal-kapal berat kami melakukan tugasnya tanpa diganggu secara kasar."
fleet_interoperability_navy_spirit: "Interoperabilitas Armada"
fleet_interoperability_navy_spirit_desc: "Pengisian logistik yang cepat dan pengendalian kerusakan yang efisien tidak akan memenangkan pertempuran dengan sendirinya, namun tetap menjaga senjata kemenangan tetap menyala."
rapid_concentration_navy_spirit: "Konsentrasi Cepat"
rapid_concentration_navy_spirit_desc: "Berkumpul dengan cepat melawan musuh seperti segerombolan belalang, tembakkan segala senjata yang Anda miliki: jalan tercepat menuju kemenangan."
aa_curtain_navy_spirit: "Tirai Anti Pesawat"
aa_curtain_navy_spirit_desc: "Ibarat tembok perisai kuno, setiap kapal dalam armada tempur tidak hanya bertanggung jawab atas pertahanannya sendiri, namun juga membantu tetangganya."
stay_at_your_posts_navy_spirit: "Tetap di Postingan Anda"
stay_at_your_posts_navy_spirit_desc: "Selama satu penyangga berputar dan satu senjata tetap berada di atas permukaan air, kita masih dalam pertarungan."
selective_engagement_navy_spirit: "Keterlibatan Selektif"
selective_engagement_navy_spirit_desc: "Orang bodoh berdiri diam di depan musuh yang lebih unggul dan membiarkan dirinya dihancurkan. Tolak pertarungan yang tidak bisa Anda menangkan."
sea_lane_denial_navy_spirit: "Penolakan Jalur Laut"
sea_lane_denial_navy_spirit_desc: "Tidak ada yang memakan bulu babi, untuk alasan yang bagus."
underdog_mentality_navy_spirit: "Mentalitas yang Tidak Diunggulkan"
underdog_mentality_navy_spirit_desc: "Jika pada awalnya Anda tidak berhasil, lakukan torpedo lagi."
cult_of_heroism_army_spirit: "Kultus Kepahlawanan"
cult_of_heroism_army_spirit_desc: "Sepanjang sejarah hingga zaman modern, tentara dan warga negara sama-sama menghormati pengorbanan rekan-rekan mereka."
