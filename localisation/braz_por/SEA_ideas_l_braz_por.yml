 CHI_the_political_tutelage_upgraded_dm: "Republik yang Dipulihkan"
 CHI_corruption_in_the_administration: "Korupsi di Pemerintahan"
 CHI_corruption_in_the_administration_desc: "Roda yang diberi gemuk lebih mudah berbelok, tetapi hal itu tidak berarti efisiensi. Sepasang individu menggunakan kekuasaan yang tidak proporsional yang berdampak pada negara nasional."
 CHI_reorganized_administration: "Administrasi yang Direorganisasi"
 CHI_reorganized_administration_desc: "Kami telah melumasi roda pemerintahan kami sehingga mereka dapat berjalan lebih efisien dengan menghilangkan rintangan yang menghalangi kami."
 CHI_switch_administration_modifiers_tt: "Tingkatkan §Y$CHI_corruption_in_the_administration$§! menjadi §Y$CHI_reorganized_administration$§!"
 CHI_illicit_trade: "Perdagangan Gelap"
 CHI_illicit_trade_desc: "Pasar bawah tanah dan jaringan penyelundupan melemahkan otoritas pemerintah dan mengganggu stabilitas ekonomi. Upaya untuk mengekang kegiatan-kegiatan ini masih serampangan dan pengaruh perdagangan gelap terus menghambat persatuan dan reformasi nasional."
 CHI_inefficient_economy: "Perekonomian Tidak Efisien"
 CHI_inefficient_economy_desc: "Industrialisasi kita masih baru karena pemerintahan sebelumnya tidak mendukung pertumbuhan yang tepat. Namun kita dapat menyelesaikannya melalui tindakan internal dan eksternal, potensi kita sungguh tidak terbatas."
 CHI_neglected_countryside: "Pedesaan yang Terabaikan"
 CHI_neglected_countryside_desc: "Dekade Nanjing telah menyaksikan perubahan yang sangat mengesankan pada masyarakat kita. Namun modernitas sebagian besar terbatas pada wilayah perkotaan dan pedesaan telah terabaikan. Hal ini dapat menjadi tempat berkembangnya ide-ide radikal."
 CHI_corruption_in_the_armed_forces: "Korupsi di Angkatan Bersenjata"
 CHI_corruption_in_the_armed_forces_desc: "Tentara Revolusioner Nasional berasal dari jajaran partai dan dengan demikian mempunyai beban yang sama dengan partai. Nepotisme, penyuapan, dan penggelapan merajalela dan jika kita ingin menang, kita harus memberantasnya."
 CHI_blue_shirt_society: "Masyarakat Baju Biru"
 CHI_blue_shirt_society_desc: "Masyarakat yang Mempraktikkan Tiga Prinsip Rakyat, atau Kaus Biru, menerangi jalan khusus kita dan akan menjatuhkan mereka yang menghalanginya."
 CHI_ROCAF: "Komisi Urusan Penerbangan"
 CHI_ROCAF_desc: "Sejak didirikan pada dekade terakhir, Komisi Urusan Penerbangan telah menjadi organisasi yang melaluinya kita akan mengendalikan langit kita. Meskipun angkatan udara masih belum terpusat, kemajuan terus berlanjut dan melalui ketekunan kita akan menang."
 CHI_an_appropriate_design_tt: "[GetAppropriateDesign]"
 CHI_appropriate_design_offensive_idea: "Desain yang Menyerang"
 CHI_appropriate_design_defensive_idea: "Desain Defensif"
 CHI_protracted_warfare_idea: "Peperangan yang Berlarut-larut"
 CHI_protracted_warfare_idea_desc: "Beberapa tentara percaya bahwa serangan cepat akan memenangkan semua perang dan yang lain memahami bahwa jika mereka menolak serangan, maka kemauan mereka akan hancur. Dengan bertahan lebih lama dalam posisi bertahan, penyerang mana pun akan dipukul mundur."
 CHI_decisive_battle_idea: "Pertempuran yang Menentukan"
 CHI_decisive_battle_idea_desc: "Tidak ada negara yang mendapatkan keuntungan dari peperangan yang berkepanjangan dan oleh karena itu kita perlu menang melawan musuh dengan cepat dengan menemukan di mana kita akan melancarkan upaya ofensif. Pukulannya akan cepat dan pukulannya akan jatuh dengan keras."
 CHI_gung_ho_idea: "Gerakan Gung Ho"
 CHI_gung_ho_idea_desc: "Salah satu sumber daya yang kami miliki adalah manusia dan kami telah mengorganisir mereka dalam koperasi industri skala kecil. Organisasi akar rumput ini akan memberi kita keunggulan ekonomi dalam konflik yang kita hadapi saat ini."
 CHI_ROCN: "Angkatan Laut Republik Tiongkok"
 CHI_ROCN_desc: "Dengan tradisi yang berasal dari zaman Qing, Angkatan Laut Pusat yang diselaraskan kembali dengan Kuomintang setelah Ekspedisi Utara sekarang akan memungkinkan kita untuk memproyeksikan kekuatan kita keluar dari benua tersebut."
