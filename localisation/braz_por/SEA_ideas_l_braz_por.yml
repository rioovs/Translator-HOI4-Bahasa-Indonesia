 idea_CHI_cult_of_shek_desc: "Bahkan setelah kematiannya, pengaruh Chiang Kai-Shek bergema di seluruh lapisan tinggi pemerintahan Tiongkok, berdiri sebagai mercusuar perlawanan dan pembangkangan dalam menghadapi agresi asing."
 idea_CHI_our_place: "Tempat kami"
 idea_CHI_our_place_desc: "Keanggotaan kami di [ROOT.GetFactionName] memperkuat kami, namun kami harus berjuang untuk menjadi pemimpin. Itu hanyalah hak kami."
 CHI_whampoa_military_academy_spirit: "Keutamaan Whampoa"
 CHI_whampoa_military_academy_spirit_desc: "Akademi Militer Whampoa milik Kuomintang memegang kekuasaan atas rekrutmen baru dan promosi dalam angkatan bersenjata. Meskipun tidak sepenuhnya tidak efisien, hal ini mengandung sejumlah besar korupsi yang terlembaga."
 CHI_the_political_tutelage_dm: "Pengawasan Politik"
 CHI_the_political_tutelage_dm_desc: "Saatnya telah tiba untuk menerapkan ide-ide Sun Yat Sen secara maksimal, meningkatkan literasi masyarakat Tiongkok dan membangkitkan kesadaran politik mereka, memungkinkan terciptanya dan kelangsungan hidup sebuah Republik di tanah kita."
