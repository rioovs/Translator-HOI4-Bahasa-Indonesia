 JAP_state_shinotism_dm: "Shintoisme Negara"
 JAP_state_shinotism_dm_desc: "Sejak Restorasi Meiji kami berupaya menggunakan ibadah di kuil Shinto untuk mempromosikan kesetiaan kekaisaran dan bantuan dalam pembangunan bangsa. Hal ini memungkinkan kita membangun negara yang siap berkorban banyak demi nama negara."
