 TIB_tibetan_politics_idea: "Ganden Podrang"
 TIB_tibetan_politics_idea_desc: "Ketika menyatukan jantung Tibet di bawah kendali aliran Gelug, setelah mengalahkan pangeran saingannya Tsangpa dalam perang saudara yang berkepanjangan, Dalai Lama ke-5 membentuk pemerintahan yang setelahnya pemerintahan kita juga menjadi model. Meskipun bersifat isolasionis, hal ini mengarah pada keadaan yang lebih stabil."
 TIB_tibetan_army_idea: "Dmag Dpung Bod"
 TIB_tibetan_army_idea_desc: "Meskipun persenjataannya kurang dan ketinggalan jaman, pasukan kami telah membantu kami menumpas Pemberontakan Bai Lang dan mempertahankan kendali nominal atas wilayah tersebut. Kita harus terus memperluasnya untuk menjaga keamanan negara dari intrusi panglima perang saingannya."
