 CHI_warlord_looting_idea: "Penjarahan Biasa"
 CHI_warlord_looting_idea_desc: "Karena kurangnya moral dan kendali menyeluruh atas seluruh kekuatan militer kita, penjarahan produk lokal adalah hal biasa. Kita harus mengakhiri hal ini jika kita ingin menciptakan provinsi yang stabil."
