 CHI_saco: "SACO"
 CHI_saco_desc: "Organisasi Koperasi Sino-Amerika adalah kelompok gabungan yang berpusat pada pertukaran intelijen di mana kita dapat belajar satu sama lain."
 CHI_women_in_the_war_effort_idea: "Perempuan dalam Perjuangan Nasional"
 CHI_women_in_the_war_effort_idea_desc: "Modernitas bukan hanya bidang laki-laki dan perempuan di negara kita telah bangkit dan mengambil tempat yang selayaknya di angkatan bersenjata dan batalyon mereka sendiri."
 CHI_chinese_womens_national_war_relief_society: "Lembaga Bantuan Perang Nasional Wanita Tiongkok"
 CHI_chinese_womens_national_war_relief_society_desc: "Suatu bangsa hanya akan sekuat titik terlemahnya sehingga masyarakat berupaya untuk memperkuatnya."
