 SIC_a_loose_unity: "Persatuan yang Longgar"
 SIC_a_loose_unity_desc: "Meskipun secara nominal bersatu di bawah bendera \"Klik Sichuan\", ada beberapa penguasa berbeda di provinsi kami yang memiliki tujuan dan ambisinya masing-masing. Beberapa di antaranya, seperti Liu Wenhui, bahkan telah menciptakan wilayah kecilnya sendiri yang secara fungsional terpisah dari wilayah lain di provinsi tersebut, sementara yang lain memiliki gagasannya sendiri tentang cara menangani tentara."
