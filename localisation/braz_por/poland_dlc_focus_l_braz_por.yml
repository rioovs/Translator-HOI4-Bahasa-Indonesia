l_braz_por:
 POL_central_region_strategy: "Strategi Wilayah Tengah"
 POL_central_region_strategy_desc: "Dengan memusatkan pabrik-pabrik jauh dari perbatasan, kita akan meningkatkan produksi sekaligus melindungi mereka dari calon penakluk."
 POL_expansion_of_new_towns: "Industri Polandia Baru"
 POL_expansion_of_new_towns_desc: "Dengan wilayah barat yang kini direbut kembali dari Jerman, kita harus mengembangkan industri yang sedang berkembang di kota-kota seperti Gdynia yang dengan cepat menyaingi Warsawa dalam hal kemegahan."
 POL_fill_the_railways_gaps: "Isi Kesenjangan Kereta Api"
 POL_fill_the_railways_gaps_desc: "Polandia pernah terbagi menjadi tiga kekuatan, sehingga jaringan kereta api kita berjauhan dan tidak terhubung. Kita harus menyatukan ketiga jalur kereta api yang terpisah ini menjadi satu jika kita ingin menjadikan Polandia sebagai industri terpusat yang kita perlukan!"
 POL_start_central_industrial_region: "Perluas Industri Kraków"
 POL_start_central_industrial_region_desc: "Ibu kota lama Polandia, Kraków, telah terbebas dari cengkeraman Kekaisaran Austria, namun kota ini masih terbelenggu oleh masa lalunya; negara ini kekurangan industri modern yang dibutuhkan untuk menyaingi negara-negara barat. Dengan investasi, kami akan menghidupkan kembali Kraków dari kematian."
 POL_expand_central_industrial_region: "Modernisasikan Industri Galicia"
 POL_expand_central_industrial_region_desc: "Galicia, seperti Kraków, pernah dikuasai dan diabaikan oleh Austria, namun kini setelah kembali berada di tangan Polandia, kita dapat memberikan investasi modernisasi yang sangat dibutuhkannya."
 POL_the_four_year_plan: "Rencana Empat Tahun"
 POL_the_four_year_plan_desc: "Kita harus merencanakan perluasan infrastruktur untuk mengakomodasi tidak hanya industri kita saat ini, namun juga masa depan."
 POL_national_defence_fund: "Dana Pertahanan Nasional"
 POL_national_defence_fund_desc: "Warga negara dan negara sama-sama harus berkontribusi terhadap pendanaan industri yang sedang berkembang, untuk bersiap menghadapi bahaya di tahun-tahun mendatang."
 POL_warsaw_main_railway_station: "Stasiun Kereta Api Utama Warsawa"
 POL_warsaw_main_railway_station_desc: "Warsawa adalah pusat transportasi dan kargo. Untuk menghindari kemacetan, upaya ekstra harus dilakukan pada pengelolaan perkeretaapian."
 POL_invest_in_the_old_polish_region: "Berinvestasi di Wilayah Polandia Lama"
 POL_invest_in_the_old_polish_region_desc: "Modernisasi pabrik-pabrik tua di Kielce, Skarżysko, Radom, Starachowice dan Ostrowiec, sekaligus membangun pabrik-pabrik baru untuk memperkuat industri kita."
 POL_develop_upper_silesia: "Kembangkan Silesia Atas"
 POL_develop_upper_silesia_desc: "Kami hanya menguasai wilayah kecil di Silesia, namun wilayah yang kami miliki memiliki kepentingan industri yang besar. Silesia adalah salah satu kawasan industri paling padat di negara kita, dan dengan sedikit investasi, kawasan ini dapat terus mendukung industrialisasi lebih lanjut di seluruh negara kita."
 POL_additional_research_slot1: "Sekolah Matematika Polandia"
 POL_additional_research_slot1_desc: "Matematika merupakan pusat dari hampir semua hal di sektor teknologi. Di seluruh Polandia; dari Lwów hingga Warsawa, sekolah matematika berkembang pesat. Kita harus memanfaatkan masa keemasan para pemikir Polandia ini, dan memberikan semua yang mereka butuhkan untuk menjadikan Polandia sebagai pusat kekuatan teknologi yang layak mereka dapatkan!"
 POL_the_bombe: "Bom itu"
 POL_the_bombe_desc: "\"Cryptologic Bombe\" adalah pengembangan dari Cyclometer, dan memungkinkan kita menguraikan versi sandi Enigma Jerman yang semakin canggih."
 POL_the_cyclometer: "Sikometer"
 POL_the_cyclometer_desc: "Dengan penemuan ini, sandi orang Jerman akan menjadi teks yang jelas. Tidak ada rahasia yang akan disimpan dari kami."
 POL_atomic_physics_institute: "Institut Fisika Atom"
 POL_atomic_physics_institute_desc: "Kita tidak boleh kehilangan kesempatan untuk menjadi orang pertama yang menemukan cara memanfaatkan api utama fisi."
 POL_additional_research_slot2: "Perluas Universitas Warsawa"
 POL_additional_research_slot2_desc: "Universitas Warsawa adalah tempat sebagian besar pemikir terbesar Polandia bersekolah untuk mengajar, belajar, dan memperluas kemampuan teknologi Polandia. Dengan berinvestasi dalam perluasan universitas, kita akan mendapatkan lebih banyak kursi bagi para pemikir dan pemikir untuk memperkuat negara Polandia!"
 POL_prepare_for_the_next_war: "Bersiaplah Untuk Perang Berikutnya"
 POL_prepare_for_the_next_war_desc: "Perang Besar mungkin hanya yang pertama. Kita harus bersiap menghadapi medan perang yang selalu berubah."
 POL_the_defence_of_poland: "Pertahanan Polandia"
 POL_the_defence_of_poland_desc: "Strategi yang lebih berani pun harus dirancang jika ingin mempertahankan tanah air kita berhasil."
 POL_romanian_bridgehead_strategy: "Strategi Jembatan Rumania"
 POL_romanian_bridgehead_strategy_desc: "Jika pertempuran berbalik melawan kita, kita harus mempunyai rencana untuk melakukan pengelompokan kembali secara efektif dan melakukan pembalasan bersama dengan teman dan sekutu kita."
 POL_silesia_fortified_area: "Kawasan Benteng Silesia"
 POL_silesia_fortified_area_desc: "Lebih banyak benteng yang dibangun di selatan akan mengamankan pertahanan tambahan."
 POL_hel_fortified_area: "Daerah Benteng Hel"
 POL_hel_fortified_area_desc: "Dengan membentengi wilayah-wilayah utama, kita akan mengurangi kerentanan kita jika perang kembali terjadi di wilayah pesisir dan perbatasan kita."
 POL_standardisation_of_equipment: "Standardisasi Peralatan"
 POL_standardisation_of_equipment_desc: "Dengan menstandarkan perlengkapan prajurit kami, kami menetapkan landasan bagi peralatan pasokan modern."
 POL_modernising_the_cavalry: "Memodernisasi Kavaleri"
 POL_modernising_the_cavalry_desc: "Meskipun kavaleri masih memiliki peran, kita memerlukan tunggangan logam baru agar dapat bersaing di medan perang modern."
 POL_study_foreign_tanks: "Pelajari Tank Asing"
 POL_study_foreign_tanks_desc: "\"Tank-tank\" ini akan menjadi bagian penting dari konflik bersenjata saat ini, dan kita harus memastikan untuk mengimbangi negara-negara tetangga kita, dengan cara apapun yang diperlukan."
 POL_cruiser_tank_experiments: "Eksperimen Tangki Penjelajah"
 POL_cruiser_tank_experiments_desc: "Dengan dasar-dasar desain tangki yang ada, kami sekarang siap untuk mulai menempa jalur kami sendiri di bidang desain mekanis yang rumit."
 POL_artillery_modernisation: "Modernisasi Artileri"
 POL_artillery_modernisation_desc: "Kita tidak boleh mengabaikan peningkatan dan modernisasi dukungan yang dibutuhkan tentara kita untuk penempatan yang efektif."
 POL_anti_tank_guns: "Senjata Anti-Tank"
 POL_anti_tank_guns_desc: "Musuh mana pun pasti akan mengerahkan tank untuk melawan kita. Kita harus bersiap menyambut mereka dengan hangat."
 POL_army_modernisation: "Modernisasi Angkatan Darat"
 POL_army_modernisation_desc: "Senjata modern untuk pria modern!"
 POL_air_base_expansion: "Perluasan Pangkalan Udara"
 POL_air_base_expansion_desc: "Pangkalan udara sama pentingnya dengan dukungan udara seperti halnya dukungan udara dalam peperangan modern."
 POL_fighter_modernisation: "Modernisasi Pesawat Tempur"
 POL_fighter_modernisation_desc: "Sebagai andalan angkatan udara mana pun, pesawat tempur kita tidak boleh ketinggalan jaman. Seiring dengan kemajuan angkatan udara kita, mereka juga harus meningkat."
 POL_air_innovations: "Inovasi Udara"
 POL_air_innovations_desc: "Masih banyak yang harus dilakukan di bidang strategi dan taktik udara."
 POL_heavy_fighter_concept: "Konsep Petarung Berat"
 POL_heavy_fighter_concept_desc: "Jika kita terpaksa melakukan serangan, kita memerlukan pesawat tempur jenis baru yang dapat beroperasi dalam jarak jauh di dalam wilayah musuh."
 POL_naval_bomber_experiments: "Eksperimen Pembom Angkatan Laut"
 POL_naval_bomber_experiments_desc: "Supremasi udara sama pentingnya di laut dan di darat. Pesawat khusus yang dikembangkan untuk tujuan peperangan laut adalah salah satu cara untuk mencapai tujuan tersebut."
 POL_medium_bomber_focus: "Fokus Pembom Sedang"
 POL_medium_bomber_focus_desc: "Perpanjangan filosofi pengeboman presisi yang diadaptasi untuk jangkauan lebih luas untuk digunakan dalam peran pendukung."
 POL_light_bomber_focus: "Fokus Pembom Ringan"
 POL_light_bomber_focus_desc: "Manfaat penggunaan pesawat pengebom tukik untuk dukungan udara jarak dekat tidak boleh dianggap remeh."
 POL_air_modernisations_programme: "Program Modernisasi Udara"
 POL_air_modernisations_programme_desc: "Teori penerbangan sama pentingnya dengan teknologi. Strategi baru yang dilakukan pilot kami masih menunggu untuk ditemukan."
 POL_rocket_development: "Pengembangan Roket"
 POL_rocket_development_desc: "Kecepatan adalah atribut yang diandalkan oleh semua atribut udara lainnya. Mesin roket dan jet secara teoritis memungkinkan kita melewati semua batasan sebelumnya."
 POL_develop_polish_ship_building: "Mengembangkan Pembuatan Kapal Polandia"
 POL_develop_polish_ship_building_desc: "Danzig sudah kalah telak dari rezim keji partai Nazi, dan perdagangan Polandia harus menemukan cara untuk menumbangkan embargo efektif yang dilakukan Nazi terhadap perekonomian kita. Kita mungkin tidak akan pernah memulihkan Gdańsk, tapi mungkin kita bisa mengubah Gdynia menjadi pelabuhan besar untuk menyaingi Gdańsk dalam kemegahannya."
 POL_study_foreign_built_ships: "Pelajari Desain Kapal Inggris"
 POL_study_foreign_built_ships_desc: "Angkatan Laut Inggris telah menjadi sekutu Polandia selama beberapa dekade, namun akhir-akhir ini, kebijakan peredaan Inggris menempatkan Polandia dalam posisi genting dan tidak mempunyai teman yang dapat diandalkan. Mungkin dengan mempelajari desain Inggris, kita akan dapat mulai memproduksi kapal dengan efisiensi dan kemegahan yang setara."
 POL_a_cruiser_navy: "Angkatan Laut Penjelajah"
 POL_a_cruiser_navy_desc: "Kapal yang lebih besar akan dibutuhkan untuk mewujudkan rencana kehadiran kita di laut."
 POL_import_submarine_technology: "ORP Orzeł"
 POL_import_submarine_technology_desc: "Peperangan angkatan laut modern dimenangkan baik di atas maupun di bawah gelombang dan jika kita ingin bersaing dengan U-boat Jerman, kita harus merancang dan mendistribusikan kapal selam asli Polandia."
 POL_commerce_attack: "Taktik Serangan Perdagangan"
 POL_commerce_attack_desc: "Tidak ada angkatan laut yang lengkap tanpa kapal selam. Armada kita perlu diorganisir untuk menghasilkan tingkat kematian yang optimal, sama seperti armada lainnya."
 POL_the_twin_threats: "Lanjutkan Modernisasi Angkatan Laut"
 POL_the_twin_threats_desc: "Sekarang setelah kita mendapatkan kembali kendali atas garis pantai kita, kita dapat melanjutkan modernisasi angkatan laut kita. Kemenangan akan datang dari mempelajari metode peperangan laut sebelum melakukan industri kita pada apa pun."
 POL_coastal_defense: "Modernisasi Sederhana"
 POL_coastal_defense_desc: "Kita adalah negara dengan perekonomian kecil dengan garis pantai yang kecil, jadi modernisasi angkatan laut kita harus dilakukan secara sederhana. Kapal perusak adalah cara yang murah dan efisien untuk mempertahankan garis pantai, dan kita harus berkomitmen terhadap mereka."
 POL_strike_force: "Ambisi Naga"
 POL_strike_force_desc: "Angkatan Laut Polandia sejauh ini bersikap sederhana dan lemah lembut dalam upayanya melakukan modernisasi, namun tidak lebih dari itu. Seekor naga Polandia yang besar akan menaiki ombak, dan baik orang Jerman maupun Rusia akan gemetar mendengar aumannya saat ia muncul seperti binatang buas di cakrawala!"
 POL_baltic_navy: "Penjaga Baltik"
 POL_baltic_navy_desc: "Tak seorang pun boleh melewati blokade kami, tak seorang pun boleh mendarat di pantai Polandia atau sekutunya. Laut Baltik adalah milik Polandia dan bukan milik negara lain."
 POL_strengthen_the_polish_state: "Perkuat Negara Polandia"
 POL_strengthen_the_polish_state_desc: "Kita tidak bisa membiarkan diri kita terpecah belah. Kekuatan kita untuk melakukan perubahan sebanding dengan kesatuan kita baik di senat maupun sejm."
 POL_defensive_focus: "Fokus Defensif"
 POL_defensive_focus_desc: "Kami tidak akan memulai perang berikutnya, tapi kami akan memastikan kami menyelesaikannya."
 POL_polish_militarism: "Militerisme Polandia"
 POL_polish_militarism_desc: "Perang-perang sebelumnya mungkin telah membuat kita tunduk, namun kita tidak kalah. Kita akan bangkit kembali, berkat keberanian prajurit kita dan kelicikan para perwira kita."
 POL_polish_revanchism: "Revanchisme Polandia"
 POL_polish_revanchism_desc: "Hanya sedikit negara yang mengalami kerugian sebesar itu dalam waktu yang sangat singkat. Jika ada keadilan, kami akan mendapatkannya kembali, dengan satu atau lain cara."
 POL_poland_first: "Polandia Pertama"
 POL_poland_first_desc: "Kebaikan bangsa harus didahulukan dari apa yang disebut \"kebenaran\". Sama seperti kita menentukan nasib kita sendiri, kita juga harus menentukan fakta-fakta kita sendiri."
 POL_ideological_fanaticism: "Pendidikan Nasionalis"
 POL_ideological_fanaticism_desc: "Banyak sekali generasi muda yang kuliah di universitas-universitas di seluruh negeri, dan kita kehilangan kesempatan emas untuk menanamkan cita-cita Polandia yang kita bangun ke dalam pikiran mereka. Kaum muda harus didorong untuk menjadi patriot, pejuang, dan benteng cita-cita Polandia!"
 POL_the_between_the_seas_concept: "Konsep Antar Lautan"
 POL_the_between_the_seas_concept_desc: "Józef Piłsudski memiliki ambisi untuk membentuk aliansi negara-negara yang terbentang di antara lautan; Polandia, Rumania, mantan anggota Persemakmuran, dan bahkan Italia bekerja sama untuk memastikan kelangsungan hidup mereka bersama, tanpa memberikan satu inci pun pada kedaulatan mereka. Kini, kami siap mewujudkan visi berani Piłsudski. Dengan menjangkau Rumania, kami akan mengambil langkah pertama dalam mewujudkan Intermarium!"
 POL_treaty_with_lithuania: "Perjanjian Dengan Lituania"
 POL_treaty_with_lithuania_desc: "Dendam lama harus tetap ada di masa lalu. Setiap teman dibutuhkan di masa-masa sulit yang akan datang."
 POL_the_baltic_alliance: "Aliansi Dengan Negara Baltik"
 POL_the_baltic_alliance_desc: "Seseorang tidak akan pernah mempunyai cukup teman."
 POL_internationalism: "Internasionalisme"
 POL_internationalism_desc: "Musuh dari musuh kita bisa menjadi teman kita."
 POL_authoritarianism: "Otoritarianisme"
 POL_authoritarianism_desc: "Demokrasi adalah solusi yang lemah terhadap permasalahan yang sulit. Jika kekuasaan ingin digunakan dengan kekerasan, maka kekuasaan harus dibebaskan dari belenggu konsensus."
 POL_paramilitarism: "Paramiliterisme"
 POL_paramilitarism_desc: "Prinsip-prinsip militer dapat diterapkan di luar arena militer. Dengan dilatihnya setiap bagian masyarakat dalam disiplin ilmu ini, setiap warga negara akan mampu mengangkat senjata kapan saja."
 POL_go_right: "Ke Kanan"
 POL_go_right_desc: "Kekuatan adalah satu-satunya kualitas yang patut dikejar. Tetangga kita telah menerima kebenaran ini, dan kita pun juga harus menerima hal ini."
 POL_military_youth: "Pemuda Militer"
 POL_military_youth_desc: "Mendaftarkan generasi muda kita ke organisasi-organisasi yang mempromosikan disiplin dan ideologi nasional akan melahirkan generasi muda yang setia di masa depan."
 POL_seek_accommodation_with_germany: "Carilah Akomodasi Dengan Jerman"
 POL_seek_accommodation_with_germany_desc: "Mengapa kita harus bertengkar, padahal kita lebih mirip daripada berbeda?"
 POL_go_left: "Ke Kiri"
 POL_go_left_desc: "Hanya dengan menyatukan rakyat, kita bisa menang melawan musuh yang mengancam akan menghancurkan kita."
 POL_political_commissars: "Komisaris Politik"
 POL_political_commissars_desc: "Untuk mempertahankan kendali atas militer, pejabat politik akan ditunjuk untuk memastikan kepatuhan militer terhadap kebijakan partai."
 POL_seek_accommodation_with_USSR: "Carilah Akomodasi Dengan Uni Soviet"
 POL_seek_accommodation_with_USSR_desc: "Uni Soviet sama kecilnya dengan kita yang menginginkan perang. Mungkin ada cara untuk mendamaikan sejarah kita tanpa pertumpahan darah."
 POL_liberalism_focus: "Liberalisme"
 POL_liberalism_focus_desc: "Kami tidak akan tunduk pada tingkat lalim dan diktator. Jangan pernah lupa bahwa negara melayani rakyatnya, dan bukan sebaliknya."
 POL_intervention_focus: "Fokus Intervensi"
 POL_intervention_focus_desc: "Jika kita menghargai kebebasan, kita perlu menjaganya tidak hanya untuk diri kita sendiri, tapi juga untuk negara di mana pun. Jika ini berarti perang, biarlah!"
 POL_draw_closer_to_britain: "Mendekatkan Diri ke Inggris"
 POL_draw_closer_to_britain_desc: "Inggris telah berkomitmen untuk melindungi kemerdekaan kita dari serangan para agresor. Kita perlu memberikan sikap apresiasi yang diperlukan."
 POL_volunteer_corps: "Korps Relawan"
 POL_volunteer_corps_desc: "Kebebasan tidak bisa ditegakkan oleh mereka yang tidak mau, atau hal itu akan menjadi sebuah parodi. Namun, mereka yang mengangkat senjata demi kebebasan karena pilihannya harus diberikan sarana untuk melakukannya."
 POL_militarism_focus: "Militerisme Polandia"
 POL_authoritarianism_focus: "Otoritarianisme"
 POL_polish_revanchism_focus: "Revanchisme Polandia"
 POL_slavic_revanchism: "Revanchisme Polandia"
 POL_internationalism_focus: "Internasionalisme"
 POL_invite_to_faction_tooltip: "diundang ke fraksi [Root.GetFlag]§Y[Root.GetName]§!."
 POL_central_defence_of_poland: "Pusat Pertahanan Polandia"
 POL_central_defence_of_poland_desc: "Polandia kekurangan peralatan yang dibutuhkan untuk mempertahankan diri dari ancaman yang tak terhitung jumlahnya terhadap perbatasannya. Dengan memperluas Kementerian Pertahanan Nasional, kita akan lebih siap untuk melawan tentara mana pun yang berupaya melakukan tindakan brutal terhadap Polandia di bawah pendudukan."
 POL_modernize_congressional_factories: "Modernisasi Pabrik Kongres"
 POL_modernize_congressional_factories_desc: "Kongres Polandia adalah wilayah terbesar dan paling bersatu di negara kita dan memiliki potensi pertumbuhan terbesar di seluruh Polandia. Dengan memodernisasi kota-kota besar seperti Warsawa, kita akan mengubah Kongres Polandia menjadi jantung industri negara kita."
 POL_expand_katowice_mines: "Perluas Sumber Daya Katowice"
 POL_expand_katowice_mines_desc: "Meskipun ukurannya relatif kecil, Silesia Atas adalah harta karun berupa baja dan aluminium. Meskipun ideal untuk mengendalikan keseluruhan Silesia, untuk saat ini kita harus mengeksploitasi industri Silesia Atas secara maksimal."
 POL_abolish_segregated_seating: "Hapuskan Tempat Duduk Terpisah"
 POL_abolish_segregated_seating_desc: "Polandia adalah negara yang terdiri dari orang-orang dari etnis, budaya, dan kepercayaan yang berbeda, namun dalam pendidikan kami, kami memisahkan mereka. Jika mereka benar-benar orang Polandia, maka mereka harus berkumpul dan berbagi ide dengan bebas. Tempat duduk yang terpisah hanyalah sebuah kendala bagi pendidikan kita dan harus dihapuskan."
 POL_agrarian_reform: "Reforma Agraria"
 POL_agrarian_reform_desc: "Pemogokan petani sudah di depan mata. Di seluruh negeri, harga pangan meroket, dan baik industri yang terputus-putus maupun kurangnya tindakan pemerintah untuk membantu masyarakat termiskin di Polandia menyebabkan keresahan besar di kalangan petani. Namun dengan investasi dan reformasi yang memadai, kita akan mampu memenuhi tuntutan petani."
 POL_invest_in_eastern_poland: "Berinvestasilah di Polandia Timur"
 POL_invest_in_eastern_poland_desc: "Bagian timur adalah tempat yang tandus dan terpencil, diabaikan sepenuhnya oleh Rusia dan negara Polandia. Ada banyak sekali lokasi yang ideal untuk pabrik, dan banyak orang yang dapat bekerja di pabrik tersebut, jika kita memilih untuk berinvestasi pada hal-hal tersebut."
 POL_complete_the_plan: "Selesaikan Rencananya"
 POL_complete_the_plan_desc: "Saatnya telah tiba untuk merefleksikan Rencana Empat Tahun dan menyiapkan rencana untuk empat tahun industrialisasi Polandia ke depan! Semakin banyak kita berinvestasi di Polandia dan industrinya, semakin siap kita menghadapi masa depan industri Polandia."
 POL_woo_the_sanation_generals: "Woo para Jenderal Sanasi"
 POL_woo_the_sanation_generals_desc: "Staf militer Sanasionis tidak puas dan tidak loyal terhadap rezim. Beberapa orang mungkin mengatakan bahwa pembersihan staf militer diperlukan karena keangkuhan Sanasi sendiri, namun kita tahu bahwa orang-orang ini terlalu berharga untuk digantikan."
 POL_sanationist_army: "Tentara Sanasionis"
 POL_sanationist_army_desc: "Dengan komando tinggi Sanasi yang setia di bawah kendali kita, telah tiba waktunya untuk memanfaatkan pengalaman pengawal lama di antara pasukan."
 POL_purge_the_sanation: "Bersihkan Sanasi"
 POL_purge_the_sanation_desc: "Para jenderal Sanasi berubah-ubah dan tidak setia dan telah membuktikan diri mereka lebih setia pada diri mereka sendiri daripada pada Polandia sendiri! Kita harus membersihkan komando tertinggi kita dari semua jenderal yang terlibat dalam kudeta Sanasi!"
 POL_appoint_new_officers: "Tunjuk Pejabat Baru"
 POL_appoint_new_officers_desc: "Kini setelah staf militer kami dibersihkan dari jenderal-jenderal yang tidak setia, kami memiliki kesempatan untuk memberikan kekuasaan kepada orang-orang yang sangat peduli terhadap kedaulatan Polandia, dan tidak memiliki loyalitas terhadap Kastil, Kiri, atau Kanan."
 POL_new_military_academy: "Akademi Militer Baru"
 POL_new_military_academy_desc: "Komando tinggi kita tandus dan kosong, namun hal ini menyisakan peluang emas untuk menanam benih untuk masa depan; memastikan bahwa para jenderal masa depan setia kepada negara kita dan berpendidikan tinggi dalam seni perang. Dengan mendanai akademi militer di seluruh negara, kami akan memastikan bahwa setiap perwira baru Polandia memiliki kaliber yang lebih tinggi dibandingkan pendahulunya."
 POL_attract_foreign_motors: "Menarik Perusahaan Motor Asing"
 POL_attract_foreign_motors_desc: "Meskipun beberapa orang berpendapat bahwa desain LRL asli Polandia adalah masa depan peralatan bermotor Polandia, pertanyaannya tetap mengapa kita harus menemukan kembali roda ketika kita hanya dapat menyelaraskannya kembali? Perusahaan otomotif asing telah menguasai seni membuat bahan lebih murah, lebih cepat, dan lebih keras sehingga akan lebih bijaksana jika mengundang mereka merancang peralatan untuk kita!"
 POL_adaptive_designs: "Desain Adaptif"
 POL_adaptive_designs_desc: "Mempertahankan lisensi untuk desainer asing akan menimbulkan biaya besar bagi negara, namun mungkin ada cara agar kita dapat memanfaatkan kembali desain militer kita agar dapat digunakan di sektor swasta. Dengan mendistribusikan sebagian dari bahan-bahan kami kepada orang-orang kaya, kami dapat mengurangi biaya pemeliharaan biaya mempekerjakan perusahaan desain asing tersebut."
 POL_complete_april_constitution: "Lengkapi Konstitusi April"
 POL_complete_april_constitution_desc: "Konstitusi April adalah serangkaian reformasi yang dirancang untuk memusatkan Polandia menjadi rezim otoriter yang lebih tersentralisasi di bawah Presiden. Pemerintahan Sanasi dilegitimasi oleh undang-undang ini, namun masih ada pihak yang merindukan sistem lama. Konstitusi bulan April harus diselesaikan dan diubah untuk memperluas kekuasaan [GetAppropriateLeaderNameInBookmark] dan memusatkan negara Polandia!"
 POL_consolidate_sanation_government: "Konsolidasikan Pemerintahan Sanasi"
 POL_consolidate_sanation_government_desc: "Sejak kematian Józef Piłsudski, pemerintahan Sanasi terpecah-pecah dan tidak terorganisir. Pemerintah telah terpecah menjadi tiga cabang: Kastil, Sanasi Kiri, dan Sanasi Kanan. Tidak pasti apakah Kastil ini dapat mempertahankan kendali atas kediktatoran, namun pemerintah harus segera meninggalkan keadaan ragu-ragu ini jika ingin memiliki harapan untuk bertahan menghadapi badai perang yang akan datang."
 POL_the_castle: "Kastil"
 POL_the_castle_desc: "Kastil ini mewakili gubernur yang memerintah Kastil Warsawa di bawah kepemimpinan Ignacy Mościcki. Pendukung setia status quo, memberikan dukungan kepada pemerintah di Kastil akan menjaga stabilitas negara dan mencegah Sanasi kiri dan kanan memiliki pijakan yang diperlukan untuk memicu kudeta."
 POL_eliminate_socialist_parties: "Hilangkan Partai Sosialis"
 POL_eliminate_socialist_parties_desc: "Sosialisme adalah sebuah ideologi yang dengan cepat menguasai dunia, namun pada dasarnya tidak sesuai dengan cita-cita pemerintahan Castle. Kelompok kiri menentang kami baik dalam bentuk partai agraris dan sosial demokrat, dan dalam partai komunis pengkhianat. Segala bentuk sosialisme tidak boleh diterima dan semua partai sosial harus dilarang demi kelangsungan stabilitas dan keamanan negara Polandia."
 POL_dissolve_the_sejm: "Larutkan Sejm"
 POL_dissolve_the_sejm_desc: "Sejm terus ada di bawah pemerintahan Sanasi hanya sebagai tanda demokrasi yang pernah dianut Polandia. Namun waktunya telah tiba untuk mencabut semua kekuasaan Sejm dan memberikan semua kekuasaan kepada Senat dan Senator Kastil."
 POL_promote_chemical_industry: "Mendukung Industri Kimia"
 POL_promote_chemical_industry_desc: "Sebelum masa pemerintahan Sanasi, Ignacy Mościcki adalah seorang intelektual dan ahli kimia. Kini, sebagai pemimpin negara Polandia, Mościcki mempunyai posisi yang memungkinkan dia mendukung industri kimia dan studinya."
 POL_camp_of_national_unity: "Pertahankan Kediktatoran"
 POL_camp_of_national_unity_desc: "Sanasi Kiri dan Kanan tidak lagi memiliki kekuatan untuk menjadi ancaman nyata bagi pemerintah dan yang tersisa hanyalah membubarkan mereka secara resmi dan mempertahankan kepemimpinan Ignacy Mościcki dan membimbing Polandia menuju masa depan baru yang lebih cerah."
 POL_the_sanation_left: "Sanasi Kiri"
 POL_the_sanation_left_desc: "Setia kepada Walery Sławek, Sanation Left mewakili mereka yang merasa Sławek adalah penerus sejati Piłsudski dan mencari akomodasi dengan oposisi, daripada mengucilkan mereka dari pemerintahan sepenuhnya seperti yang dilakukan oleh Partai Kanan dan Kastil. Meskipun kerja sama dengan mereka mungkin akan mengecewakan kelompok Kanan Sanasi, kelompok sayap kiri mempunyai kekuatan internal yang kita perlukan untuk membangun kabinet menteri yang kompeten."
 POL_modus_vivendi: "Modus Vivendi"
 POL_modus_vivendi_desc: "Kaum Kiri Sanasi mencari akomodasi dengan oposisi di negara kita; memberi mereka kursi kekuasaan dalam pemerintahan. Dengan adanya perwakilan yang tepat dari anggota oposisi, mereka mungkin tidak lagi berusaha menentang Kediktatoran."
 POL_draft_a_new_constitution: "Draf Konstitusi Baru"
 POL_draft_a_new_constitution_desc: "Sławek sudah lama berambisi untuk mengamandemen konstitusi Polandia, dan dengan memberikan hak untuk melakukan hal tersebut, kita bisa mendapatkan kendali lebih langsung atas negara Polandia dan semakin menyempurnakan Konstitusi April."
 POL_department_for_home_defence: "Departemen Pertahanan Dalam Negeri"
 POL_department_for_home_defence_desc: "Polandia sudah lama kekurangan pertahanan dalam negeri yang dibutuhkannya untuk bertahan melawan musuh di kedua sisi perbatasannya. Dengan mendirikan Departemen Pertahanan Dalam Negeri, kita akan menguasai metode perang yang diperlukan untuk mempertahankan negara kita."
 POL_legion_of_merit: "Legiun Kebajikan"
 POL_legion_of_merit_desc: "Sebuah konsep dari Walery Sławek, Legion of Merit akan memberikan posisi istimewa kepada setiap warga negara republik yang telah membuktikan diri mereka memberikan manfaat luar biasa bagi negara. Penghargaan ini akan menjamin individu tersebut mendapat posisi di senat, dan siapa pun yang diundang ke Legiun tentu tidak mempunyai alasan untuk merasa tidak puas terhadap rezim."
 POL_the_left_chairman: "Ketua Kiri"
 POL_the_left_chairman_desc: "Sanasi Kiri dan Kanan pada dasarnya tidak sejalan secara ideologis. Meskipun kita bisa mendapatkan manfaat dari reformasi yang diusulkan oleh kelompok sayap kanan, kelompok sayap kirilah yang mempunyai kepentingan terbaik bagi Polandia dan mungkin dengan memberi mereka kekuasaan yang lebih besar, kita dapat mengesampingkan kelompok sayap kanan sepenuhnya…"
 POL_common_organization_of_society: "Organisasi Umum Masyarakat"
 POL_common_organization_of_society_desc: "Sławek telah lama mempunyai ambisi untuk menggantikan BBWR dengan struktur kekuasaan yang disebutnya \"Organisasi Masyarakat Bersama\". Struktur ini secara unik akan memberikan otonomi lokal yang besar kepada negara bagian dan kotapraja di Polandia, sekaligus memusatkan pemerintahan dalam rezim otoriter yang kuat dan siap untuk campur tangan dalam pemerintahan lokal pada saat perang. Dengan berkuasanya kelompok Kiri, Sławek pada akhirnya dapat memenuhi ambisinya."
 POL_dissolve_the_bbwr: "Raja Baru di Kastil"
 POL_dissolve_the_bbwr_desc: "Kaum Kiri telah tumbuh begitu berpengaruh dan berkuasa dalam masa Kediktatoran sehingga gelar Presiden Mościcki tampaknya sepenuhnya bersifat simbolis. Yang tersisa hanyalah meresmikannya dan membubarkan semua jejak Kastil dari pemerintahan, membawa Sławek ke puncak kekuasaan tertinggi di negara bagian tersebut."
 POL_the_sanation_right: "Hak Sanasi"
 POL_the_sanation_right_desc: "Pengikut Edward Rydz-Śmigły, Hak Sanasi terutama terdiri dari para jenderal dan staf militer berpangkat tinggi. Kelompok sayap kanan yang merupakan kekuatan militer dalam pemerintahan Sanasi berada pada posisi utama untuk mengambil alih pemerintahan, namun memberikan kekuasaan dan konsesi kepada mereka dapat memastikan kesetiaan mereka yang berkelanjutan dan potensi penggabungan mereka ke dalam Kastil."
 POL_support_right_paramilitaries: "Mendukung Paramiliterisme Sayap Kanan"
 POL_support_right_paramilitaries_desc: "Kaum Falangis dalam lanskap politik Polandia sering digambarkan sebagai orang yang fanatik, fasis, dan bahkan sebanding dengan Nazi, namun retorika mereka menarik bagi para patriot Polandia, dan Jerzy Rutkowski mengusulkan pembentukan paramiliter yang terdiri dari sukarelawan muda yang siap berjuang dan mati demi kemerdekaan Polandia."
 POL_codify_national_unity: "Kodifikasi Kamp Persatuan Nasional"
 POL_codify_national_unity_desc: "Kubu Persatuan Nasional mewakili kepentingan bersama dari Hak Sanasi dan Kastil, dan sejauh ini kebijakan dan tujuan kelompok tersebut tidak jelas. Namun, kita dapat mengamandemen Konstitusi bulan April untuk memasukkan nilai-nilai nasionalisme, hukum dan ketertiban, serta anti-komunisme ke dalam landasan republik kita."
 POL_second_man_of_the_state: "Orang Kedua Negara"
 POL_second_man_of_the_state_desc: "Kelompok Kiri Sanasi telah cukup dikesampingkan dan sekarang, Śmigły dan Mościcki mampu sepenuhnya menyingkirkan semua pengaruh kaum Kiri dalam pemerintahan. Śmigły akan dijadikan \"orang kedua\", yang berarti bahwa pada saat perang, Mościcki harus menyerahkan jabatannya sebagai Presiden kepada Sanation Right dan militer."
 POL_ozon: "Kemenangan OZN"
 POL_ozon_desc: "Meskipun perjanjiannya adalah bahwa Mościcki menyerahkan kursinya pada saat perang, jelas bahwa ancaman di perbatasan kita lebih dari yang dapat kita hadapi dan perang akan segera terjadi. Dengan Śmigły memegang kendali penuh atas negara ini, pemerintahan militer dan sipil kami akan menjadi satu dan kami akan siap melawan siapa pun yang mengancam kedaulatan Polandia."
 baltic_security_opinion: "Melindungi Keamanan Baltik"
 POL_align_with_the_west: "Sejajar dengan Barat"
 POL_align_with_the_west_desc: "Inggris, Prancis, dan negara-negara barat lainnya telah lama menjadi pembela kedaulatan Polandia sehingga kita sebaiknya menjaga negara kita tetap selaras dengan mereka."
 POL_lithuanian_ultimatum: "Ultimatum Lituania"
 POL_lithuanian_ultimatum_desc: "Selama bertahun-tahun, kami secara resmi berperang dengan Lituania meskipun tidak ada yang mengambil tindakan agresif sejak aneksasi Vilnius. Ketika Jerman menyerbu benua ini dan mengambil apa pun yang mereka inginkan hanya dengan ancaman perang, mungkin kita dapat melakukan hal yang sama untuk Lituania; menuntut diakhirinya permusuhan ini demi kedua negara kita."
 POL_lithuanian_alliance: "Aliansi Lituania"
 POL_lithuanian_alliance_desc: "Kita telah berdamai dengan bekas musuh kita di utara, namun sekarang kita harus belajar bagaimana bergerak maju bersama sebagai teman. Musuh dan sekutu kita sama, jadi wajar jika Lituania bersekutu dengan kekuatan yang sama dengan kita."
 POL_lithuanian_annexation: "Menuntut Aneksasi Lituania"
 POL_lithuanian_annexation_desc: "Dengan terjadinya anschluss Jerman di Austria, menjadi jelas bahwa serikat pekerja lama dapat dipulihkan jika seseorang memintanya dengan sedikit agresi. Mungkin kita bisa berpendapat bahwa orang-orang Lituania akan jauh lebih aman jika mereka tinggal di negara yang lebih besar dan lebih kuat… Polandia, misalnya."
 POL_restore_the_sejm: "Kembalikan Sejm"
 POL_restore_the_sejm_desc: "Penerapan Konstitusi bulan April jelas merupakan sebuah kesalahan yang perlu segera diperbaiki. Kekuasaan harus dikembalikan kepada Sejm, dan dari sana kita harus menentukan masa depan bangsa kita melalui cara-cara demokratis."
 POL_plan_west: "Rencanakan Barat"
 POL_plan_west_desc: "Poros bernafas di leher kita. Meskipun beberapa pihak di pemerintahan percaya bahwa hubungan kami dengan [GER.GetLeader] baik-baik saja, kami tahu bahwa Jerman tidak dapat dipercaya dan rencana besar-besaran di negara-negara barat diperlukan untuk mengamankan masa depan Polandia."
 POL_the_prusya_line: "Garis Prusia"
 POL_the_prusya_line_desc: "Prusia Timur adalah titik invasi utama Jerman, dan merupakan celah besar dalam pertahanan kita saat ini. Dengan memperluas garis pertahanan di sepanjang perbatasan Prusia, tentara kita akan lebih mampu mempertahankan negara kita dari ancaman di utara."
 POL_invest_anti_air: "Berinvestasi di Anti-Udara"
 POL_invest_anti_air_desc: "Kita tidak mungkin mampu mengalahkan jumlah Jerman di udara, namun kita tidak perlu melebihi jumlah mereka ketika kita bisa berinvestasi besar-besaran dalam membangun persenjataan anti-udara di darat. Dengan adanya Bofors di setiap negara bagian, pilot Jerman tidak akan bisa jauh-jauh sebelum bertemu dengan senjata kita."
 POL_the_prusya_army: "Pengawal Prusia"
 POL_the_prusya_army_desc: "Sayangnya, perbatasan kita dengan Prusia tidak dijaga. Semua investasi kami di benteng Prusia tidak akan berarti apa-apa tanpa tentara yang menjaga benteng tersebut."
 POL_expand_poznan_forts: "Perluas Benteng Poznań"
 POL_expand_poznan_forts_desc: "Poznań sudah menjadi rumah bagi sejumlah besar bunker dan struktur pertahanan utama, namun masih banyak ruang untuk perbaikan. Poznań adalah garis pertahanan pertama melawan musuh dan harus dipertahankan, berapapun biayanya."
 POL_local_western_plans: "Rencana Lokal Barat"
 POL_local_western_plans_desc: "Terdapat kawasan strategis utama di sepanjang perbatasan Polandia-Jerman. Menyusun rencana komprehensif pada tingkat lokal dan melaksanakannya pada waktu yang tepat sama pentingnya dengan kelangsungan hidup negara Polandia seperti halnya rencana pertempuran kita yang lebih besar."
 POL_sudeten_mountaineers: "Pendaki Gunung Sudeten"
 POL_sudeten_mountaineers_desc: "Sudetenland merupakan perbatasan yang tidak aman, namun juga memberikan posisi pertahanan yang unik. Dengan melatih orang-orang yang menguasai peperangan gunung, kita akan mampu mengalahkan tentara Jerman di puncak Zaolzie yang tinggi!"
 POL_complete_plan_west: "Rencana Lengkap Barat"
 POL_complete_plan_west_desc: "Komando tinggi militer Polandia yakin bahwa rencana yang memadai telah dibuat untuk menghadapi konflik yang tak terhindarkan dengan Jerman dan waktu untuk Plan West telah berakhir."
 POL_sabotage_polish_industry: "Sabotase Industri Polandia"
 POL_sabotage_polish_industry_desc: "Musuh kita mempunyai pasukan yang jauh lebih kuat dari kita dan jumlahnya lebih banyak. Meskipun menyenangkan untuk menerima gagasan bahwa kita tidak akan kehilangan kekuatan, kenyataannya adalah kita tidak mungkin bertahan selamanya. Dengan memasang bahan peledak di pabrik-pabrik dan jalur kereta api kita, kita mungkin bisa menjadikannya tidak berguna bagi musuh-musuh kita jika terjadi pendudukan."
 POL_plan_east: "Rencanakan Timur"
 POL_plan_east_desc: "Kita telah terlibat dalam konflik militer dengan Rusia selama berabad-abad dan kita dapat dengan aman berasumsi bahwa [SOV.GetLeader] akan, seperti [SOV.GetLeader.GetHerHis] pendahulunya, akan mencoba melakukan invasi ke Polandia. Mereka tidak boleh berhasil kali ini, rencana harus dibuat untuk memastikan kemenangan telak Polandia atas [SOV.GetNameDef]!"
 POL_eastern_conscripts: "Wajib Militer Timur"
 POL_eastern_conscripts_desc: "Banyak orang di Polandia Timur lebih cepat mengidentifikasi diri mereka sebagai orang Ukraina atau Belarusia daripada orang Polandia, namun mereka harus diyakinkan untuk tetap berjuang! Meskipun kita mungkin hanya menemukan sedikit orang yang mau berperang demi Polandia, ada banyak sekali di antara mereka yang dengan bersemangat mengangkat senapan untuk melawan [SOV.GetAdjective]!"
 POL_belorussian_army: "Tentara Belarusia"
 POL_belorussian_army_desc: "Ada banyak kelompok militer independen yang bersedia berperang melawan [SOV.GetNameDef] di Belarus, yang perlu kita lakukan hanyalah memberi mereka pengakuan resmi dan menawarkan mereka kepemimpinan militer."
 POL_ruthenian_army: "Tentara Ruthenia"
 POL_ruthenian_army_desc: "Di kalangan warga Polandia dan Ukraina, sentimen anti-[SOV.GetAdjective] sangat terasa di wilayah Timur. Dengan pendanaan dan kepemimpinan militer, paramiliter ini akan menjadi tambahan yang bagus bagi angkatan bersenjata kita."
 POL_fortification_of_belarus: "Benteng Utara"
 POL_fortification_of_belarus_desc: "Sisi utara Polandia Timur hanyalah serangkaian hutan lebat dan hampir tidak ada jejak peradaban di dalamnya. Hal ini tidak dapat terus terjadi jika terjadi invasi; hutan-hutan ini harus diubah menjadi perisai melawan Bolshevisme!"
 POL_fortification_of_ukraine: "Fortifikasi Ukraina"
 POL_fortification_of_ukraine_desc: "Wilayah timurnya terbelakang dan agraris, dan Ukraina Polandia masih menjadi titik lemah di wilayah selatan Polandia yang siap untuk diinvasi. Beberapa benteng dasar harus dibangun di sepanjang perbatasan jika kita ingin menjaga keamanan negara kita!"
 POL_supply_the_rail_nexus: "Pasokan Rail Nexus"
 POL_supply_the_rail_nexus_desc: "Jalur kereta api di Polandia Timur berada dalam kondisi yang menyedihkan, tidak sebanding dengan wilayah tengah Polandia. Perang dengan [SOV.GetNameDef] akan dimenangkan atau dikalahkan dengan kendali pasokan, dan rantai pasokan yang baik untuk orang-orang kita sendiri akan menjadi awal yang baik."
 POL_local_eastern_plans: "Rencana Timur Lokal"
 POL_local_eastern_plans_desc: "Seringkali staf militer kita dapat dipercaya untuk menyusun rencana di antara mereka sendiri, namun dalam perang seperti ini, intervensi langsung dalam skala kecil diperlukan. Setiap inci bidang tanah sangatlah penting, dan kita harus menerapkan keahlian kita pada konflik terkecil jika kita ingin menghentikan imperialisme [SOV.GetAdjective]!"
 POL_complete_plan_east: "Rencana Lengkap Timur"
 POL_complete_plan_east_desc: "Komando tinggi militer Polandia merasa yakin bahwa rencana yang memadai telah dibuat untuk menghadapi konflik yang tak terhindarkan dengan [SOV.GetAdjective] dan waktu untuk Plan East telah berakhir."
 POL_prepare_for_the_inevitable: "Bersiaplah untuk Hal yang Tak Terelakkan"
 POL_prepare_for_the_inevitable_desc: "Kita telah bertahan selama yang kita bisa, tapi dengan kekalahan yang kita miliki, inilah saatnya untuk mengakui kekalahan. Polandia sudah tiada, namun semangat Polandia tetap hidup, dan dia tetap mencari mangsa bahkan di pengasingan. Dengan dukungan yang cukup dari sekutu-sekutu kita, kita akan mampu mengerahkan pasukan di pengasingan, mendukung kawan-kawan kita yang masih melawan pendudukan di negara asal kita, dan mengisi barisan musuh kita dengan laki-laki dan perempuan yang setia kepada Polandia."
 POL_foreign_air_support: "Dukungan Udara Asing"
 POL_foreign_air_support_desc: "Dengan bantuan sekutu kami, kami mungkin masih dapat mengerahkan angkatan udara Polandia yang kuat. Membeli pabrik dan peralatan hanyalah permulaan dari pengasingan angkatan udara Polandia!"
 POL_foreign_army_support: "Dukungan Tentara Asing"
 POL_foreign_army_support_desc: "Dengan banyaknya pengungsi yang datang dari Polandia untuk bertugas di barisan kami setiap hari, kami hanya perlu memberi mereka senapan dan mereka akan siap mendaki gunung mana pun demi janji untuk pulang. Yang perlu kita lakukan hanyalah meminta kontrol lebih lanjut terhadap industri sekutu kita."
 POL_aces_in_exile: "Aces di Pengasingan"
 POL_aces_in_exile_desc: "Musuh mungkin telah merebut tanah air kita, namun pilot-pilot terbaik kita masih terus mengudara dan menginspirasi pasukan kita untuk terus pulang ke rumah!"
 POL_foreign_naval_support: "Dukungan Angkatan Laut Asing"
 POL_foreign_naval_support_desc: "Yang tersisa dari angkatan laut kita berada dalam kondisi yang menyedihkan. Meskipun kita mungkin tidak akan pernah bisa mengembalikan kejayaannya, dukungan dari sponsor kita mungkin masih bisa memberikan para pelaut Polandia sarana untuk membantu teman-teman kita di laut."
 POL_resistance_industries: "Industri Perlawanan"
 POL_resistance_industries_desc: "Meskipun tanah air kita telah hilang, kita masih memerlukan basis industri yang kuat untuk memperluas intelijen Polandia dan mengembangkan wilayah yang kita rebut kembali dari musuh."
 POL_exile_industries: "Industri Pengasingan"
 POL_exile_industries_desc: "Karena kampung halaman sudah tinggal kenangan, kami perlu berupaya mempersiapkan kepulangan kami dengan pengembangan lebih lanjut ke basis produksi kami di pengasingan."
 POL_expand_polish_intelligence: "Perluas Intelijen Polandia"
 POL_expand_polish_intelligence_desc: "Dengan tentara kita yang hancur, dikalahkan, dan dipaksa bersembunyi, Polandia terpaksa melakukan perjuangan dari bayang-bayang. Kita harus memprioritaskan perluasan intelijen Polandia yang cepat jika hanya ada sedikit harapan untuk kembali ke tanah air."
 POL_pomscimy_wawer: "Pomścimy Wawer"
 POL_pomscimy_wawer_desc: "Ada bisik-bisik yang datang kepada kita dari jalan-jalan Warsawa bahwa perlawanan sedang mempersiapkan tindakan berani melawan musuh. Di seluruh penjuru kota, temboknya dihiasi dengan kata-kata firasat yang menjanjikan musuh bahwa kita akan membalas dendam. Hal ini akan sulit, namun pemberontakan ini mungkin merupakan dorongan yang kita perlukan untuk kembali pulang dan menyerang balik musuh, yang diperlukan hanyalah organisasi dari komando tinggi Polandia dan mereka mungkin akan berhasil…"
 POL_the_long_push_home: "Perjalanan Panjang ke Rumah"
 POL_the_long_push_home_desc: "Pemberontakan itu sukses! Yang tersisa sekarang hanyalah bertahan cukup lama hingga bantuan tiba. Dengan masyarakat yang telah menyaksikan kengerian dan kebrutalan pendudukan musuh, tentara Polandia akan berperang dengan kekuatan manusia sebanyak empat puluh kali lipat jumlah mereka lagi! Kali ini: kita tidak akan jatuh!"
 POL_the_north_sea: "Laut Utara"
 POL_the_north_sea_desc: "Sebelum kita mulai mempertimbangkan untuk mempengaruhi negara-negara netral di Korea Utara untuk bergabung dengan aliansi kita, kita harus meletakkan landasan pada tahap diplomasi global. Kita harus membuat negara-negara utara menyadari keinginan kita untuk bekerja sama, dan mengirim Józef Beck dan lidah peraknya ke negara-negara Nordik untuk meyakinkan mereka tentang banyak manfaat dari menyelaraskan diri dengan Międzymorze."
 POL_finno_polish_pact: "Pakta Finno-Polandia"
 POL_finno_polish_pact_desc: "Sirip berada dalam posisi yang sama dengan kita; terjebak di perbatasan dengan [SOV.GetAdjective] yang hanya ingin melihat bangsanya ditaklukkan sekali lagi menjadi sebuah kerajaan. Hal ini menjadikan Finlandia kandidat ideal untuk ekspansi awal Międzymorze ke negara-negara Nordik."
 POL_invite_denmark: "Undang Denmark"
 POL_invite_denmark_desc: "Meskipun kekuatan kecilnya, Denmark menguasai selat Denmark, wilayah strategis utama di Baltik. Dengan menyelaraskan Denmark dengan faksi kami, kami akan mengamankan akses masuk dan keluar Baltik. Denmark harus dipercaya untuk bertahan hidup."
 POL_invite_sweden: "Undang Swedia"
 POL_invite_sweden_desc: "Swedia memiliki konsep netralitas yang menarik di masa konflik yang semakin meningkat. Mungkin kita bisa meyakinkan para menteri luar negeri mereka bahwa Intermarium adalah aliansi paling netral di dunia dan bahwa tawaran pertahanan bersama ini adalah peluang terbaik mereka untuk menghalangi intervensi langsung dari negara-negara besar."
 POL_invite_norway: "Undang Norwegia"
 POL_invite_norway_desc: "Bukan rahasia lagi bahwa Jerman mempunyai ambisi dan rencana untuk Norwegia, dan sudah ada orang-orang di negara mereka yang siap berkolaborasi dengan penjajah asing ini. Dengan menyampaikan undangan ke Intermarium, kami menawarkan kepada Norwegia kesempatan unik untuk melawan agresi Jerman tanpa tunduk pada mereka."
 POL_the_mediterranean: "Mediterania"
 POL_the_mediterranean_desc: "Antara Polandia dan Mediterania terdapat kawanan domba dengan serigala di punggungnya. Yugoslavia, Austria, bahkan Yunani dan Turki menjadi mangsa kekuatan predator di Barat. Kita harus membuat semua negara di Balkan dan sekitarnya menyadari keinginan kita untuk melindungi kedaulatan mereka dan keselamatan rakyat mereka, hanya dengan cara itulah kita dapat memberikan tawaran resmi perlindungan kepada mereka dan memperluas Intermarium."
 POL_coerce_czechoslovakia: "Pertahankan Cekoslowakia"
 POL_coerce_czechoslovakia_desc: "Ceko dan Slovakia adalah saudara bagi Polandia, dan melindungi mereka bukan hanya demi kepentingan terbaik kita, namun juga merupakan keharusan moral kita."
 POL_austro_hungarian_alliance: "Aliansi Austria-Hongaria"
 POL_austro_hungarian_alliance_desc: "Meskipun bangsa Austro-Hungaria pernah menjebak rakyat Polandia di kekaisaran mereka, mereka kini berada di garis bidik Jerman, sama seperti kita. Kolaborasi nampaknya tidak bisa dihindari bagi mereka, tapi mungkin jika kita menawarkan pilihan lain, mereka akan menghindari dorongan untuk menyerahkan kunci kerajaan mereka kepada [GER.GetLeader]."
 POL_protect_yugoslavia: "Lindungi Yugoslavia"
 POL_protect_yugoslavia_desc: "Yugoslavia berada dalam keadaan yang menyedihkan, dan mereka menjadi sasaran utama invasi oleh hampir semua negara tetangganya. Kita harus mengundang mereka ke Międzymorze untuk mendapatkan perlindungan dari ancaman baik di dalam maupun di luar perbatasan mereka."
 POL_invite_greece: "Undang Yunani"
 POL_invite_greece_desc: "Ketegangan antara Yunani dan Turki masih kuat, dan dengan potensi invasi Italia yang akan segera terjadi, Yunani pasti akan mendapat manfaat dari perlindungan kita."
 POL_control_the_bosporus: "Kendalikan Bosporus"
 POL_control_the_bosporus_desc: "Aliansi Rumania sama sekali tidak ada artinya jika kita tidak berdaya menggerakkan angkatan bersenjata dan angkatan laut melalui selat Bosporus. Turki mempunyai kepentingan strategis yang penting bagi negara kita dan mereka harus diyakinkan untuk bekerja sama."
 POL_italian_alliance: "Aliansi Italia"
 POL_italian_alliance_desc: "Pemerintah Italia tidak merahasiakan bahwa mereka adalah musuh cita-cita penentuan nasib sendiri yang diwakili oleh Międzymorze, namun dengan perubahan yang tepat pada pemerintahan dalam negeri Polandia dan Italia, kami mungkin dapat menyelaraskannya dengan visi kami untuk masa depan Eropa."
 POL_anti_blitz_vehicles: "Kendaraan Anti Blitz"
 POL_anti_blitz_vehicles_desc: "Musuh-musuh kita akan berusaha untuk menguasai kita dengan gelombang besar divisi lapis baja. Kita tidak mungkin bisa menandingi tank musuh, namun kita bisa berinvestasi pada persenjataan yang dirancang khusus untuk menghancurkan kendaraan dengan kerugian besar bagi musuh."
 POL_clamp_down_on_danzig: "Tekan Danzig"
 POL_clamp_down_on_danzig_desc: "Secara resmi, Danzig adalah kota bebas di bawah perlindungan Polandia, namun akhir-akhir ini, kota ini telah jatuh ke dalam kendali Nazi dan hanya menjadi boneka Adolf Hitler. Cacat di perbatasan Utara kita ini tidak lain hanyalah hambatan terhadap perdagangan Polandia dan kita harus menegaskan kembali kendali atas kota tersebut, atau berisiko jatuh ke tangan Jerman."
 POL_attract_poles_to_gdynia: "Menarik orang Polandia ke Gdynia"
 POL_attract_poles_to_gdynia_desc: "Sebuah pelabuhan besar membutuhkan orang-orang hebat untuk menjalankannya, dan banyak sekali orang Polandia yang menunggu pekerjaan. Dengan mendorong migrasi ke Gdynia, kami dapat melanjutkan proyek pengembangan pelabuhan kami."
 POL_ban_the_nazi_party: "Larang Partai Nazi"
 POL_ban_the_nazi_party_desc: "Kami telah mengumpulkan cukup dukungan dari penduduk Gdańsk sehingga kami dapat secara resmi membersihkan kota tersebut dari Nazi dan merebut kembali kota tersebut untuk negara Polandia!"
 POL_develop_gdansk_ship_building: "Mengembangkan Pembuatan Kapal Gdańsk"
 POL_develop_gdansk_ship_building_desc: "Sekarang Gdańsk sekali lagi berada di bawah kendali kita, kita dapat memberikan investasi angkatan laut yang sangat dibutuhkannya untuk mulai membangun angkatan laut Baltik yang luar biasa yang dibutuhkan Polandia!"
 POL_expand_gdynia_seaport: "Perluas Pelabuhan Gdynia"
 POL_expand_gdynia_seaport_desc: "Sekarang Gdynia telah berkembang menjadi kota perdagangan yang hebat untuk menyaingi Danzig, yang tersisa hanyalah membuka kota itu secara resmi untuk perdagangan dan perekonomian kita sekali lagi akan menjadi milik kita dan kendali kita sendiri!"
 POL_integrate_gdansk_industries: "Integrasikan Industri Gdańsk"
 POL_integrate_gdansk_industries_desc: "Selama beberapa dekade, Gdańsk telah terpisah dari negara lain, namun tidak lebih! Dengan mengintegrasikan Gdańsk ke dalam pemerintahan kami, kami akan dapat memperoleh kembali kendali atas ekspor dan impor kami!"
 POL_expand_northern_rail: "Perluas Rel Utara"
 POL_expand_northern_rail_desc: "Semua barang Polandia harus masuk dan keluar melalui wilayah Utara, namun infrastruktur di sana masih jauh dari harapan. Korea Utara harus diberikan infrastruktur perkeretaapian yang memadai."
 POL_join_allies: "Bergabunglah dengan Sekutu"
 POL_join_allies_desc: "Masa depan [Root.GetNameDef] ada di tangan sekutu lama kita di Barat. Meskipun kami sudah berafiliasi dengan Sekutu, bergabung secara resmi dengan mereka akan menegaskan komitmen kami terhadap Barat, dan semoga juga komitmen Barat terhadap Polandia."
 uncontrolled_exports: "Ekonomi yang Diembargo"
 uncontrolled_exports_desc: "Negara asing hampir mempunyai kendali penuh atas ekspor dan impor kita, yang pada dasarnya menjadikan perekonomian kita berada dalam keadaan embargo; tidak mampu berdagang secara bebas dengan negara lain."
 POL_anti_german_offensive: "Rencana Anti-Jerman"
 POL_anti_german_offensive_desc: "Rencana telah dibuat untuk menjebak orang Jerman di jalan-jalan kota di negara bagian ini."
 POL_anti_soviet_offensive: "Rencana Anti-Rusia"
 POL_anti_soviet_offensive_desc: "Tentara Polandia telah menerima rencana yang sangat khusus untuk melawan serangan [SOV.GetAdjective] di negara bagian ini."
 POL_new_military_academy_idea: "Akademi Militer Baru"
 POL_looming_peasants_strike: "Pemogokan Petani yang Akan Terjadi"
 POL_looming_peasants_strike_desc: "Marah karena kurangnya tindakan untuk mengatasi kondisi miskin di Polandia Timur, Pemogokan Petani akan segera terjadi di Polandia. Jika tidak diatasi sebelum tahun ini berakhir, Polandia akan menghadapi risiko terjadinya kerusuhan sipil pada tingkat yang tidak diketahui di seluruh negara."
 POL_great_peasants_strike: "Pemogokan Petani"
 POL_great_peasants_strike_desc: "Kurangnya tindakan pemerintah telah menyebabkan protes massal di seluruh pedesaan! Tindakan polisi tidak banyak membantu selain membuat para pengunjuk rasa semakin gelisah dan terpinggirkan, dan jika tindakan cepat tidak diambil, protes massal ini dapat berkembang menjadi perang saudara skala penuh."
 POL_four_year_plan_idea: "Rencana Empat Tahun"
 POL_four_year_plan_complete_1: "Rencana Empat Tahun"
 POL_four_year_plan_complete_2: "Rencana Empat Tahun"
 POL_four_year_plan_complete_3: "Rencana Empat Tahun"
 POL_four_year_plan_complete_4: "Rencana Empat Tahun"
 POL_four_year_plan_idea_desc: "Negara ini telah melakukan upaya industrialisasi massal di seluruh negeri."
 POL_san_left_desc: "Pendukung reformasi, Sanation Left percaya bahwa Walery Sławek adalah penerus sejati diktator sebelumnya, Józef Piłsudski."
 POL_sanation_left_opposition_1: "Oposisi Kiri Sanasi Rendah"
 POL_sanation_left_opposition_1_desc: "[Root.GetLeftDesc] Saat ini, Sanasi Kiri merupakan ancaman yang sangat kecil terhadap Kediktatoran dan tidak dalam posisi mengancam stabilitas rezim."
 POL_sanation_left_opposition_2: "Oposisi Kiri Sanasi Moderat"
 POL_sanation_left_opposition_2_desc: "[Root.GetLeftDesc] Saat ini, Sanasi Kiri sedang membangun kekuasaan dalam Kediktatoran dan mampu mengganggu operasi politik kita sehari-hari di sektor sipil."
 POL_sanation_left_opposition_3: "Oposisi Kiri Sanasi Tinggi"
 POL_sanation_left_opposition_3_desc: "[Root.GetLeftDesc] Saat ini, Sanasi Kiri sangat kuat dan memiliki kekuatan untuk menghentikan sektor sipil jika mereka menginginkannya."
 POL_sanation_left_opposition_4: "Oposisi Kiri Sanasi Sangat Tinggi"
 POL_sanation_left_opposition_4_desc: "[Root.GetLeftDesc] Saat ini, Sanasi Kiri berada di ambang upaya kudeta terhadap pemerintah. Bosan dengan marginalisasi yang terus berlanjut, tidak ada yang tahu apa yang akan dilakukan Sławek."
 POL_san_right_desc: "Sayap kanan pemerintah sebagian besar terdiri dari staf militer kuat yang bersatu di belakang Edward Rydz-Śmigły."
 POL_sanation_right_opposition_1: "Oposisi Kanan Sanasi Rendah"
 POL_sanation_right_opposition_1_desc: "[Root.GetRightDesc] Saat ini, Hak Sanasi puas dengan pemerintah dan ancamannya sangat kecil terhadap rezim."
 POL_sanation_right_opposition_2: "Oposisi Kanan Sanasi Moderat"
 POL_sanation_right_opposition_2_desc: "[Root.GetRightDesc] Saat ini, Kelompok Hak Sanasi menjadi sedikit gelisah dan menganggap perintah Mościcki lebih sebagai nasihat daripada perintah sebenarnya."
 POL_sanation_right_opposition_3: "Oposisi Kanan Sanasi Tinggi"
 POL_sanation_right_opposition_3_desc: "[Root.GetRightDesc] Saat ini, Kelompok Kanan Sanasi percaya bahwa Kediktatoran sedang berusaha melemahkan otoritas militer dan menggunakan posisi mereka di komando tinggi militer untuk mengganggu tentara Polandia."
 POL_sanation_right_opposition_4: "Oposisi Kanan Sanasi Sangat Tinggi"
 POL_sanation_right_opposition_4_desc: "[Root.GetRightDesc] Saat ini, Sanation Right sedang mempersiapkan kudeta terhadap pemerintah Polandia. Kekuasaan mereka atas militer menjadikan mereka kekuatan nyata dalam kediktatoran dan jika konsesi tidak segera diberikan, kelompok sayap kanan dapat memecah-belah Polandia."
 POL_april_constitution_1: "Konstitusi April"
 POL_april_constitution_1_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_2: "Konstitusi April"
 POL_april_constitution_2_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_3: "Konstitusi April"
 POL_april_constitution_3_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_4: "Konstitusi April"
 POL_april_constitution_4_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_5: "Konstitusi April"
 POL_april_constitution_5_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_left: "Konstitusi April"
 POL_april_constitution_left_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_right: "Konstitusi April"
 POL_april_constitution_right_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi memberikan kekuasaan hampir total kepada Presiden, memberinya supremasi atas Sejm dan Senat."
 POL_april_constitution_dem: "Amandemen Konstitusi April"
 POL_april_constitution_dem_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diubah untuk memasukkan sejumlah hak sakral dan keistimewaan bagi setiap wilayah Polandia, memberikan otonomi lokal dan hak demokratis, meskipun Presiden masih memegang kekuasaan absolut atas negara bagian di tingkat nasional."
 POL_april_constitution_dem_left: "Amandemen Konstitusi April"
 POL_april_constitution_dem_left_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diubah untuk memasukkan sejumlah hak sakral dan keistimewaan bagi setiap wilayah Polandia, memberikan otonomi lokal dan hak demokratis, meskipun Presiden masih memegang kekuasaan absolut atas negara bagian di tingkat nasional."
 POL_april_constitution_dem_right: "Amandemen Konstitusi April"
 POL_april_constitution_dem_right_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diubah untuk memasukkan sejumlah hak sakral dan keistimewaan bagi setiap wilayah Polandia, memberikan otonomi lokal dan hak demokratis, meskipun Presiden masih memegang kekuasaan absolut atas negara bagian di tingkat nasional."
 POL_april_constitution_fas: "Amandemen Konstitusi April"
 POL_april_constitution_fas_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diamandemen untuk menempatkan militer sebagai penguasa atas segala urusan baik internal maupun eksternal. Selain itu, prinsip-prinsip falang ultranasionalis telah dianut oleh para petinggi militer, menjadikan perbedaan antara militer dan falang hanya sekedar masalah teknis."
 POL_april_constitution_fas_left: "Amandemen Konstitusi April"
 POL_april_constitution_fas_left_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diamandemen untuk menempatkan militer sebagai penguasa atas segala urusan baik internal maupun eksternal. Selain itu, prinsip-prinsip falang ultranasionalis telah dianut oleh para petinggi militer, menjadikan perbedaan antara militer dan falang hanya sekedar masalah teknis."
 POL_april_constitution_fas_right: "Amandemen Konstitusi April"
 POL_april_constitution_fas_right_desc: "Undang-undang ini disahkan oleh Sejm pada tahun 1935 untuk menjamin kelanjutan perdamaian dan stabilitas negara Polandia. Konstitusi telah diamandemen untuk menempatkan militer sebagai penguasa atas segala urusan baik internal maupun eksternal. Selain itu, prinsip-prinsip falang ultranasionalis telah dianut oleh para petinggi militer, menjadikan perbedaan antara militer dan falang hanya sekedar masalah teknis."
 POL_walery_slawek_chairman: "Ketua Kiri"
 POL_edward_rydz_smigly_chairman: "Ketua Militer"
 POL_right_paramilitarism_idea: "Związek Młodej Polski"
 POL_right_paramilitarism_idea_desc: "Pemuda Militer Polandia adalah organisasi yang didirikan oleh Edward Rydz-Śmigły dan dioperasikan oleh Falangis berpengaruh, Jerzy Rutkowski. Meskipun organisasi ini secara resmi didirikan untuk membentuk pemuda militer, program ini secara efektif menanamkan cita-cita fasis ke dalam pikiran para pemuda yang mudah dibentuk."
 POL_common_organization_of_society_idea: "Organisasi Umum Masyarakat"
 POL_common_organization_of_society_idea_desc: "Sesuai dengan ambisi Walery Sławek, Polandia telah menata ulang struktur masyarakatnya untuk memberikan otonomi yang lebih besar kepada masyarakat lokal, sementara Presiden mempertahankan kendali absolut di tingkat nasional."
 POL_eastern_conscription_idea: "Wajib Militer Timur"
 POL_eastern_conscription_idea_desc: "Mereka yang tinggal di Polandia Timur dengan cepat dilatih untuk memerangi [SOV.GetNameDef] jika terjadi perang."
 POL_expand_intelligence_idea: "Perluasan Intelijen Polandia"
 POL_expand_intelligence_idea_desc: "Dengan hilangnya tanah airnya, Polandia mungkin hanya berharap untuk mendapatkan kembali kemerdekaannya dengan mendukung gerakan perlawanan dan menyerang musuh-musuhnya dengan agen rahasia."
 POL_push_home_idea: "Perjalanan Panjang ke Rumah"
 POL_push_home_idea_desc: "Persiapan telah dilakukan untuk menyusup dan merebut kembali tanah air, yang tersisa hanyalah menjaganya tetap berada di bawah kendali Polandia cukup lama hingga sekutu kita tiba dan Polandia sama baiknya dengan milik kita."
 POL_segregated_seating_abolished: "Tempat Duduk Terpisah Dihapuskan"
 POL_segregated_seating_abolished_desc: "Selama beberapa dekade, pendidikan di Polandia menerapkan sistem tempat duduk terpisah untuk orang-orang dari latar belakang etnis yang berbeda. Kini setelah praktik ini dihapuskan, negara sudah siap untuk menciptakan masyarakat multikultural yang sederajat."
 POL_national_defence_fund_idea: "Dana Pertahanan Nasional"
 POL_national_defence_fund_idea_desc: "Polandia telah melakukan investasi yang signifikan dalam pertahanan nasional negaranya, dengan mengambil aset dari sektor sipil untuk digunakan dalam pembangunan struktur yang berguna bagi militer."
 POL_central_defence_of_poland_idea: "Pusat Pertahanan Polandia"
 POL_central_defence_of_poland_idea_desc: "Negara ini fokus pada pembangunan benteng dan peralatan infanteri untuk mempercepat militerisasi negaranya."
 POL_baltic_security: "Keamanan Baltik"
 POL_baltic_security_desc: "Meskipun kami mengandalkan dukungan Barat, konsesi terus-menerus yang diberikan kepada Jerman membuat kami ragu apakah Sekutu akan membela kami jika terjadi invasi. Mungkin dengan melindungi sesama kita di Eropa Timur, kita mungkin bisa menjaga perdamaian."
 POL_protect_czechozlovakia: "Lindungi Cekoslowakia"
 POL_protect_czechozlovakia_desc: "Menjadi jelas bahwa [GER.GetLeader] mempunyai [Ger.GetLeader.GetHerHis] rencana sendiri untuk nasib Cekoslowakia; yang akan meninggalkan Cekoslowakia tanpa kemerdekaannya. Gelombang imperialisme ini harus dihentikan."
 POL_baltic_alliance_focus: "Aliansi Baltik"
 POL_baltic_alliance_focus_desc: "Negara-negara Baltik tidak diragukan lagi adalah negara-negara yang menjadi target berikutnya setelah jatuhnya Polandia, jadi adalah bijaksana jika ketiga negara tersebut mengesampingkan kebencian mereka terhadap negara Polandia dan berdiri bersama kita melawan musuh bersama di kedua sisi perbatasan kolektif kita."
 POL_romanian_alliance: "Aliansi Rumania"
 POL_romanian_alliance_desc: "Kami telah mengadakan aliansi jangka panjang dengan Rumania, aliansi antar lautan, dan meskipun secara historis hal ini tidak berarti apa-apa, sekarang saatnya kami menyampaikan undangan resmi kepada Rumania untuk bergabung dengan faksi kami dan mewujudkan ambisi Intermarium."
 POL_baltic_ultimatums: "Ultimatum kepada Negara-negara Baltik"
 POL_baltic_ultimatums_desc: "Setelah Lituania ditangani, yang tersisa hanyalah memasukkan mantan anggota Persemakmuran paling utara ke dalam Kekaisaran kita yang sedang berkembang. Dengan negara-negara yang sangat kecil dan tentara yang sangat lemah, kami ragu negara-negara Balt akan mampu menolak ultimatum kami."
 POL_sea_to_sea: "Dari Laut ke Laut"
 POL_sea_to_sea_desc: "Persemakmuran lebih dari sekedar persatuan Polandia dan Lituania; ini adalah kerajaan megah yang berkilauan dari laut ke laut; Polandia ke Krimea."
 POL_pan_slavic_revanchism: "Revanchisme Pan-Slavia"
 POL_pan_slavic_revanchism_desc: "Gerakan Pan-Slavia sejauh ini hanya sekedar alat yang berguna bagi Rusia untuk mengklaim hegemoni atas seluruh bangsa Slavia, namun juga berguna dalam menyatukan masyarakat Slavia yang berbeda ke dalam negara-negara bersatu seperti Yugoslavia dan Cekoslowakia. Lalu mengapa Polandia harus menjadi pengecualian? Bukankah Polandia juga harus memanfaatkan gelombang Pan-Slavisme ini?"
 POL_the_old_borders: "Perbatasan Lama"
 POL_the_old_borders_desc: "Berabad-abad yang lalu, wilayah yang diduduki bangsa Slavia kini dianggap wilayah Jerman; Pomerania, Silesia, dan Prusia. Imperialisme Jerman telah menjadi bencana bagi negara Polandia dan masyarakat Slavia di sekitarnya selama berabad-abad, dan inilah saatnya kita memperbaiki kesalahan sejarah dan merebut kembali apa yang menjadi hak kita."
 POL_annex_czech: "Annex Cekoslowakia"
 POL_annex_czech_desc: "Negara Cekoslowakia terbukti tidak mampu mempertahankan diri, menyerah dan gemetar ketakutan di bawah perlindungan Barat. Sudah waktunya kita membawa Ceko dan Slovakia ke dalam perlindungan militer Polandia."
