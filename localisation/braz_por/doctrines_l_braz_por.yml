l_braz_por:
  GRAND_DOCTRINE_MOBILE_WARFARE: "Peperangan Bergerak"
  GRAND_DOCTRINE_MOBILE_WARFARE_DESC: "Serang mereka di tempat yang tak terduga - doktrin peperangan bergerak berusaha memecah kebuntuan parit Perang Dunia Pertama melalui manuver agresif untuk mendahului dan mengacaukan musuh."
  GRAND_DOCTRINE_SUPERIOR_FIREPOWER: "Daya Tembak Unggul"
  GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC: "Kirim peluru, bukan manusia - Daya Tembak Unggul menekankan penggunaan tembakan meriam berkekuatan dahsyat untuk membuka jalan bagi unit manuver agar dapat maju dan merebut wilayah."
  GRAND_DOCTRINE_GRAND_BATTLEPLAN: "Rencana Pertempuran Akbar"
  GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC: "Dengan persiapan yang cukup, tiada rintangan yang tak teratasi - Rencana Pertempuran Akbar dicirikan oleh persiapan yang sabar dan cermat dari seluruh kecabangan, baik dalam penyerangan maupun pertahanan."
  GRAND_DOCTRINE_MASS_ASSAULT: "Serangan Massa"
  GRAND_DOCTRINE_MASS_ASSAULT_DESC: "Kesediaan kita untuk berkorban menjamin kemenangan kita - Serangan Massa berfokus pada pemusatan keunggulan jumlah untuk memaksakan penerobosan pada waktu dan tempat yang dipilih."
  SUBDOCTRINE_MOBILE_INFANTRY: "Infanteri Bergerak"
  SUBDOCTRINE_MOBILE_INFANTRY_DESC: "Fokuskan infanteri kita pada mobilitas untuk mengimbangi laju gerak maju dan menghindari terjebak dalam pertempuran posisi yang memakan banyak korban."
  SUBDOCTRINE_DEFENSIVE_POSTURES: "Postur Pertahanan"
  SUBDOCTRINE_DEFENSIVE_POSTURES_DESC: "Penekanan doktrin dan pelatihan pada taktik bertahan yang dirancang untuk mempertahankan wilayah dengan gigih, menimbulkan korban jiwa dan menunda penyerang."
  SUBDOCTRINE_LARGE_UNIT_TACTICS: "Taktik Satuan Besar"
  SUBDOCTRINE_LARGE_UNIT_TACTICS_DESC: "Jika kita dapat menguasai operasi terpusat pada garis depan yang sempit, kita dapat menciptakan keunggulan lokal untuk menundukkan musuh di titik upaya utama dan menciptakan penerobosan."
