 ARG_implemented_rural_reforms: "Reformasi Pedesaan yang Diimplementasikan"
 ARG_osmar_hellmuth_event_tt: "Mendapat event '§YPertanyaan Osmar Hellmuth§!' yang memungkinkan kita memilih apakah kita harus membebaskan dan mempekerjakannya sebagai §YOperatif§! atau membiarkannya di penjara."
