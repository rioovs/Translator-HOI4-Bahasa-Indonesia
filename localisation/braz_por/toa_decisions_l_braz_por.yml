 ARG_appease_the_axis: "Tenangkan Poros"
 ARG_economic_tax_reforms_decisions: "Reformasi Pajak Ekonomi"
 ARG_economic_tax_reforms_decisions_desc: "Dengan melakukan berbagai reformasi pada sistem perpajakan kita saat ini, kita mungkin dapat memberikan bantuan ke daerah pedesaan [ARG.GetName]. Menciptakan infrastruktur yang layak bagi komunitas petani hanya akan membantu meningkatkan kesejahteraan negara kita!"
 ARG_economic_tax_reforms_decisions_tt: "Membuka keputusan §YReformasi Pajak Ekonomi§!."
 ARG_economic_reform_in_state: "Reformasi Pajak di [FROM.GetName]."
 ARG_balancing_act_decisions: "UU Penyeimbang"
 ARG_balancing_act_decisions_desc: "Seiring dengan pulihnya pemerintahan baru kita, kita sekali lagi didesak dengan isu upaya menjaga hubungan dengan kekuatan Sekutu dan Poros. Perang ini nampaknya tidak akan segera berakhir, oleh karena itu penting bagi kita untuk menyeimbangkan kesetiaan kita dengan bijak. Memihak pada salah satu pihak kemungkinan besar akan mengecewakan pihak lain."
 ARG_balancing_act_decisions_AAT_tt: "Membuka keputusan §YBalancing Act§! yang memungkinkan kita menyeimbangkan antara memenuhi tuntutan [USA.GetFlag]§Y[USA.GetName]§! dan [ENG.GetFlag]§Y[ENG.GetName]§! atau [GER.GetFlag]§Y[GER.GetName]§! dan [ITA.GetFlag]§Y[ITA.GetName]§!. Penenangan akan memberikan §YSubsidi Peralatan§! untuk §YPasar Internasional§!"
 ARG_balancing_act_decisions_tt: "Membuka keputusan §YBalancing Act§! yang memungkinkan kita menyeimbangkan antara memenuhi tuntutan [USA.GetFlag]§Y[USA.GetName]§! dan [ENG.GetFlag]§Y[ENG.GetName]§! atau [GER.GetFlag]§Y[GER.GetName]§! dan [ITA.GetFlag]§Y[ITA.GetName]§!."
 ARG_military_coup_decisions: "Perbedaan Pendapat Militer"
 ARG_military_coup_decisions_desc: "Ketika pemerintah kita yang baru terpilih merayakan kemenangannya dalam pemilu, rasa ketidakpuasan mulai tumbuh dari dalam kalangan militer. Dengan banyaknya korupsi di dalam Concordancia dan banyaknya anggota elit militer yang bersaing untuk mendapatkan kekuasaan, hanya masalah waktu saja sampai mereka bergerak ke Buenos Aires."
 ARG_military_coup_attempt: "Upaya Kudeta Militer yang Akan Segera Terjadi"
 military_coup_attempt_happened: "Upaya Kudeta Militer Telah Terjadi"
 ARG_military_state_absorption_mission: "Dukungan Pertemuan Militer"
 ARG_military_state_absorption_timer_tt: "Satu negara bagian di [ARG.GetName] akan bersekutu dengan militer."
 ARG_military_owned_state: "Sel Militer Hadir"
 ARG_military_owned_state_desc: "Negara bagian ini terkenal penuh dengan sel-sel militer pemberontak. Jika kita membiarkan hal ini berkembang, maka risiko kudeta akan semakin besar."
 ARG_sanction_the_generals: "Sanksi para Jenderal"
 ARG_sanction_the_generals_tt: "Menambah waktu hingga percobaan Kudeta diluncurkan, sehingga mengurangi persiapan yang harus dilakukan sebelumnya oleh Pemimpin Militer yang memberontak."
 ARG_consolidating_power_tt: "§RHal ini akan membuat marah pihak Militer dan mempersingkat waktu hingga percobaan Kudeta dilancarkan.§!"
 ARG_increase_military_salaries: "Meningkatkan Gaji Militer"
 ARG_federal_intervention_tt: "Memberlakukan Intervensi Federal di suatu negara bagian akan mencegah Fraksi Militer menyerapnya jika terjadi Kudeta dan perang saudara berikutnya."
 ARG_south_american_unity_decisions_tt: "Membuka keputusan §YPersatuan Amerika Selatan§! yang memungkinkan kita untuk mengintegrasikan wilayah yang ditaklukkan ke dalam negara kita."
 ARG_south_american_unity_decisions: "Persatuan Amerika Selatan"
 ARG_south_american_unity_decisions_desc: "Kini setelah kita menyatukan masyarakat Amerika Selatan di bawah satu bendera, kita dapat menegaskan dominasi kita atas benua ini dengan menyatukan wilayah negara-negara yang sebelumnya lebih besar satu per satu."
 ARG_core_conquered_state: "Integrasikan [FROM.GetName]"
 ARG_island_negotiations_decisions_tt: "Membuka keputusan §YNegosiasi Pulau§! yang memungkinkan kita menjadi perantara kesepakatan damai dengan ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) jika kita tidak terlibat dalam perang skala besar."
 ARG_island_negotiations_decisions: "Negosiasi Pulau"
 ARG_island_negotiations_decisions_desc: "Kepulauan Atlantik Selatan adalah wilayah yang kontroversial dan dengan demikian perdebatan mengenai siapa yang harus memiliki kedaulatan atas kepulauan tersebut terus berlanjut. Perang ini dapat membawa kita lebih jauh dari kondisi ideal dan kita harus mengambil kesempatan ini untuk menegosiasikan perjanjian damai jika kita bisa."
 ARG_peace_out: "Bernegosiasi dengan [ENG.GetNameDef]"
 ARG_england_demands_peace: "Bernegosiasi dengan [ARG.GetNameDef]"
 ARG_united_workers_decisions_tt: "Membuka keputusan §YSatukan Pekerja§!."
 ARG_unite_the_workers_decisions: "Satukan Pekerja"
 ARG_unite_the_workers_decisions_desc: "Tulang punggung gerakan komunis adalah kaum proletar yang pekerja keras dan tertindas. Kini ketika lanskap politik [ARG.GetAdjective] bergeser ke arah kiri, PCA harus menghasut pemogokan pekerja di beberapa kota besar untuk menggalang dukungan dari orang-orang di balik revolusi kita yang gemilang!"
 ARG_instigate_worker_strike: "Menghasut Pemogokan Pekerja di [FROM.GetName]"
 ARG_uniting_workers_in_progress: "Saat ini sedang memicu pemogokan pekerja"
 ARG_support_the_farmers_decisions_tt: "Membuka §YMendukung keputusan Petani§!."
 ARG_support_the_farmers_decisions: "Dukung Petani"
 ARG_support_the_farmers_decisions_desc: "Saat kita menetapkan standar kesetaraan bagi semua orang di negara komunis kita yang baru, sangatlah penting bagi kita untuk tidak melupakan kaum proletar yang telah bekerja keras dan lama di ladang pertanian [ARG.GetNameDef]. Kita harus menyalurkan uang untuk mendukung para petani guna memastikan bahwa mereka memiliki peluang yang sama besarnya untuk mendapatkan kualitas hidup yang baik seperti halnya mereka yang tinggal di perkotaan."
