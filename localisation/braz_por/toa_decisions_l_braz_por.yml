 ARG_international_loan_decisions: "Pinjaman Internasional"
 ARG_international_loan_decisions_desc: "Untuk memulihkan perekonomian [ROOT.GetAdjective], adalah bijaksana untuk menghubungi negara-negara besar di dunia untuk mendapatkan pinjaman guna memulai proses peremajaan kita. Namun, kita harus berhati-hati agar tidak terlilit hutang terlalu banyak."
