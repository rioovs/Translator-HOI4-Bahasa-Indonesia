 ARG_intervenciones_federales_decisions: "Intervensi Federales"
 ARG_intervenciones_federales_decisions_desc: "Meningkatnya ancaman kudeta terhadap kabinet baru kita telah mengakibatkan aktifnya intervensi federales. Kita harus memilih negara bagian mana yang akan memberlakukan badan legislatif baru ini. Melakukan hal ini akan memungkinkan kami untuk memanggil dan membantu orang-orang yang bersedia membela pemerintah mereka dengan lebih efisien."
