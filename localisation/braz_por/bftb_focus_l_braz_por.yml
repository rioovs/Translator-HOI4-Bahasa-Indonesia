l_braz_por:
 GRE_bring_home_the_exiled_republicans: "Bawa Pulang Partai Republik yang Diasingkan"
 GRE_bring_home_the_exiled_republicans_desc: "Dengan pemimpin kita Eleftherios Venizelos akhirnya kembali berkuasa, kita dapat mengundang kawan-kawan kita kembali dari pengasingan panjang yang dipaksakan oleh rezim monarki. Kita akan membutuhkan segala bantuan jika kita ingin mengembalikan negara kita ke jalur yang benar!"
 GRE_bring_home_the_exiled_republicans_focus_tt: "§YVenezelist§! menteri dan jenderal akan kembali dari pengasingan dan siap sedia."
 GRE_compromise_with_the_monarchists: "Kompromi dengan kaum Monarki"
 GRE_compromise_with_the_monarchists_desc: "Kami mungkin tidak menyukai raja, tapi negara kami sudah terlalu lama terpecah belah karena masalah ini. Daripada mengambil risiko terjadinya perang saudara lagi, mari kita ajak kaum Monarki ke meja perundingan dan mendiskusikan persyaratannya. Waktu perjuangan telah berakhir."
 GRE_compromise_with_the_monarchists_focus_tt: "§YGeorge II§! melepaskan cengkeramannya di negara tersebut dan menjadi raja konstitusional.\n\nPara £faction_gre_monarchist §YMonarkis§! menjadi §Gramah§!.\nOrang £faction_gre_communist §YKomunis§! menjadi §Rbermusuhan§!."
 GRE_request_communist_support: "Minta Dukungan Komunis"
 GRE_request_communist_support_desc: "George II bukan orang Yunani dan dia sama sekali tidak berhak ikut campur dalam urusan Yunani! Negara kita sudah terlalu sering mengeluarkan darah karena haknya untuk memerintah, dan sekarang kita akhirnya harus membawa penjahat ini ke pengadilan! Tapi kita tidak bisa melakukannya sendiri, dan hanya ada satu kelompok yang membenci raja seperti kita..."
 GRE_request_communist_support_focus_tt: "£faction_gre_communist §YKomunis§! menjadi §Gramah§!.\nPara £faction_gre_monarchist §YMonarkis§! menjadi §Rbermusuhan§!.\n\n£faction_gre_monarchist §YMonarkis§! jenderal dan menteri akan §Rmengundurkan diri§! dari dinas, tetapi £faction_gre_communist §YKomunis§! jenderal dan menteri akan menjadi §Gtersedia§!."
 GRE_remembering_the_anatolian_catastrophe: "Mengingat Bencana Anatolia"
 GRE_remembering_the_anatolian_catastrophe_desc: "Kampanye Asia Kecil bukanlah sebuah bencana. Rakyat kami dibantai, prestise kami hancur, dan gerakan politik kami hancur – semuanya dalam waktu tiga tahun! Kita tidak bisa membiarkan hal ini menjadi warisan kita, kita harus memutarbalikkannya sedemikian rupa sehingga rakyat kita akan menyalahkan Turki dan bukan kita – dan mungkin, kita akhirnya bisa mewujudkan impian kita tentang Yunani Raya setelah bertahun-tahun..."
 GRE_old_memories_stir_new_threats_tt: "Memicu emosi di Anatolia dapat menimbulkan §Ykonsekuensi yang tidak diinginkan§!..."
 GRE_a_socialist_economy: "Ekonomi Sosialis"
 GRE_a_socialist_economy_desc: "Rakyat Yunani sudah terlalu lama berdarah-darah di bawah pemerintahan otokratis raja palsu dan kaum Venizelist yang penghasut perang, inilah waktunya bagi rakyat untuk akhirnya sejahtera di bawah pemerintahan yang mengutamakan mereka!"
 GRE_restoring_our_home: "Memulihkan Rumah Kita"
 GRE_restoring_our_home_desc: "Tahun-tahun yang kita lalui tidaklah baik bagi Yunani – kita telah dirusak oleh perang, utang, dan kemiskinan. Ketika demokrasi akhirnya kembali ke negara kita, sudah tiba waktunya untuk menolak orang-orang Jerman dan Italia yang eksploitatif. Kita sebaiknya fokus pada hubungan dekat kita dengan Inggris dengan harapan mereka dapat membantu kita membangun kembali negara kita – baik dalam bidang industri maupun semangat."
 GRE_venerate_the_ancient_hellenes: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_desc: "Bukankah kita adalah keturunan orang-orang Yunani yang terhormat di zaman dahulu?\nTidakkah kita berbagi darah dengan para jagoan polemik, filsafat, dan perang itu? Kami akan menanamkan kembali rasa bangga yang kuat pada masyarakat kami, sehingga kami dapat kembali menjadi bintang penuntun Eropa."
 GRE_the_birthplace_of_democracy: "Tempat Lahirnya Demokrasi"
 GRE_the_birthplace_of_democracy_desc: "Para tiran jarang menaruh rasa hormat di hati dan pikiran orang-orang Yunani, dan itu adalah sifat yang dengan bangga kami pertahankan sejak zaman Pericles! Demokrasi adalah salah satu dari banyak buah kejeniusan kita, dan sudah sepantasnya kita mempertahankannya dari tirani Romawi dan Teuton!"
 GRE_nationalized_banks: "Bank yang Nasionalisasi"
 GRE_nationalized_banks_desc: "Deutsche Bank dan Bank of England sudah terlalu lama mengeksploitasi rakyat Yunani: menyalahgunakan pendapatan mereka yang sudah sedikit dan menghukum mereka atas tindakan pemerintahan diktator yang tidak mereka pilih! Kami mengatakan bahwa rakyat Yunani tidak boleh dieksploitasi lagi, dan dana mereka harus disalurkan ke pemerintah!"
 GRE_soviet_subsidised_railways: "Kereta Api Bersubsidi Soviet"
 GRE_soviet_subsidised_railways_desc: "Yunani telah disalahgunakan di setiap kesempatan oleh negara-negara besar di Eropa, sekarang saatnya untuk melihat ke seberang Laut Hitam jika kita ingin memiliki peluang untuk memodernisasi perekonomian Yunani."
 GRE_agricultural_communes: "Komune Pertanian"
 GRE_agricultural_communes_desc: "Dunia telah mengalami industrialisasi di sekitar kita dan sudah saatnya kita mengejar ketertinggalan tersebut. Namun banyak masyarakat kita yang tidak mengetahui apa-apa selain bekerja di bidang pertanian, dan kita tidak dapat menghilangkan asal-usul kita dengan mudah. Kita akan mengatur sektor agraria menjadi komune yang efisien, sehingga memberikan kesempatan bagi orang-orang berbakat untuk bekerja di bidang lain seperti manufaktur atau kerja militer."
 GRE_theban_warriors: "Prajurit Thebes"
 GRE_theban_warriors_desc: "Bukanlah tujuan kami untuk menciptakan masyarakat militan yang terpilarisasi dan mengutamakan kekuatan di atas segalanya. Kami secara aktif menentang dan menolak segala upaya untuk meniru sistem pemerintahan Mussolini! Kami orang Yunani, bukan orang Romawi! Daripada menciptakan kultus pemujaan terhadap Spartan yang kejam, marilah kita merayakan Thebans – yang menggulingkan hegemoni Spartan melalui kelicikan!"
 GRE_athenian_thinkers: "Pemikir Athena"
 GRE_athenian_thinkers_desc: "Beberapa pemikir terbaik umat manusia berasal dari Athena, dan dengan sedikit dorongan yang diberikan pada seni dan ilmu pengetahuan, kita akan sekali lagi mulai melihat pemikiran-pemikiran hebat bermunculan dari seluruh Yunani!"
 GRE_macedonian_generals: "Jenderal Makedonia"
 GRE_macedonian_generals_desc: "Alexander Agung pernah mengukir dari dirinya sendiri sebagian besar dunia untuk dijadikan miliknya, dan dia melakukan semuanya dari Makedonia yang sederhana. Apa yang membuatnya hebat mengalir dalam darah kita semua, dan kita harus melihat Alexander dan Argeads sebagai contoh keunggulan Yunani dalam komando."
 GRE_the_greek_industrial_revolution: "Revolusi Industri Yunani"
 GRE_the_greek_industrial_revolution_desc: "Yunani seharusnya sudah mengalami industrialisasi beberapa dekade yang lalu, namun para politisi yang korup dan kekuatan asing yang menjadi perantara telah meninggalkan kita dengan sistem ekonomi yang sudah ketinggalan zaman. Kita tidak mempunyai banyak waktu untuk mengubah cara hidup kita dari waktu ke waktu, kita harus mulai sekarang dan bekerja dengan cepat."
 GRE_industry_bypass_tt: "Slot bangunan tidak cukup untuk §YPabrik Militer§! atau §YPabrik Sipil§!"
 GRE_red_militias: "Milisi Merah"
 GRE_red_militias_desc: "Ada banyak orang yang berusaha menggagalkan upaya kami dalam memodernisasi masyarakat Yunani, namun dengan adanya organisasi milisi yang berdedikasi untuk melestarikan Revolusi, mereka akan semakin sulit menghentikan kami."
 GRE_clearing_land_for_industrial_expansion: "Pembukaan Lahan untuk Perluasan Industri"
 GRE_clearing_land_for_industrial_expansion_desc: "Ladang zaitun, anggur, dan tembakau berjajar di banyak bukit di Yunani, begitu pula sejumlah besar gereja – peninggalan Kekaisaran Bizantium. Kita tidak membutuhkan semua hal yang pertama, dan tidak ada tempat di Yunani yang baru untuk hal yang terakhir. Mari kita ambil tanah yang diambil alih ini dan manfaatkan dengan mendirikan pabrik untuk para pekerja!"
 GRE_the_anatolian_refugees: "Pengungsi Anatolia"
 GRE_the_anatolian_refugees_desc: "Setelah Bencana Anatolia, kami terpaksa menerima hampir dua juta pengungsi Yunani yang selama ini tinggal di Turki. Kami tidak siap, dan situasinya semakin tidak dapat dipertahankan. Para pengungsi kini diorganisir secara politik di bawah Georgios Kosmidis, salah satu warga pengasingan di Anatolia. Pergerakan mereka terlalu besar untuk diabaikan, dan pada akhirnya, apakah tujuan kita benar-benar berbeda?"
 GRE_depose_the_reactionaries: "Singkirkan Kaum Reaksioner"
 GRE_depose_the_reactionaries_desc: "Kami telah cukup lama menoleransi koalisi dengan kaum Venezelis ini. Agenda liberal mereka merupakan kutukan terhadap keyakinan Marxis kita, dan inilah saatnya untuk mengakhiri hubungan lucu ini. Untuk Revolusi!"
 GRE_resurrecting_the_megali_idea: "Menghidupkan Kembali Ide Megali"
 GRE_resurrecting_the_megali_idea_desc: "Kita dijanjikan Ide Megali pada tahun 1919, namun setelah Perang Yunani-Turki berikutnya, mimpi itu hampir pupus selamanya. Namun selama Turki terus mencemarkan tanah kami yang luas dengan kehadiran mereka, kami akan terus menginginkan apa yang menjadi hak kami. Orang-orang Yunani mengingat hal ini sekali, mereka dapat dibuat mengingatnya lagi..."
 GRE_megali_idea_conference_invites_tt: "Undangan ke §YMegali Convention§! akan dikirimkan setelah memilih fokus."
 GRE_prepare_for_the_great_anti_fascist_war: "Bersiaplah untuk Perang Besar Anti-Fasis"
 GRE_prepare_for_the_great_anti_fascist_war_desc: "Fasisme adalah ancaman terbesar terhadap keyakinan Marxisme – fasisme merupakan tantangan ideologis yang hanya dapat dihancurkan di medan perang. Uni Soviet tidak melakukan apa pun untuk membendung penyebaran fasisme, sehingga hal ini menjadi tanggung jawab kita."
 GRE_ally_tito: "Sekutu Tito"
 GRE_ally_tito_desc: "Tidak ada seorang revolusioner yang lebih mengabdi pada keyakinan kita akan Marxisme anti-Stalinis selain Josip Broz Tito dari Yugoslavia. Kita mungkin tidak menyukainya, namun kita membutuhkan dia dan warga negaranya bersatu di belakang kita di bawah panji solidaritas persaudaraan melawan kaum fasis yang haus darah dan kaum Bolshevik yang pengkhianat."
 GRE_tow_the_stalinist_line: "Ikuti Garis Stalinis"
 GRE_tow_the_stalinist_line_desc: "Kita berhutang revolusi kepada para pemikir besar di Uni Soviet: jika bukan karena kontribusi mereka, kita mungkin tidak akan pernah mendapatkan kekuasaan di Yunani! Kami berdiri dalam solidaritas dengan rekan-rekan kami di Moskow."
 GRE_horror_and_fear: "Horor dan Ketakutan"
 GRE_horror_and_fear_desc: "Deimos kai Phobos – kengerian dan ketakutan. Ini adalah putra kembar Ares, Dewa Perang. Spartan menumpahkan darah untuk menghormati Putra Ares di medan perang; terisolasi dan sendirian, kita juga akan menumpahkan darah di medan perang untuk menghormati kejayaan masa lalu kita."
 GRE_the_gordian_knot: "Simpul Gordian"
 GRE_the_gordian_knot_desc: "Gordian Knot adalah bagian dari legenda Alexander Agung: yang berarti menyelesaikan tugas yang tampaknya mustahil melalui pukulan yang berani. Tugas kita yang mustahil adalah merebut kembali tanah kita yang hilang – tindakan berani kita adalah meminta sekutu kita yang kuat untuk mengambilnya untuk kita."
 GRE_megali_idea_approved: "§YIde Megali§! Disetujui"
 GRE_megali_convention_a_failure: "Konvensi Heraklion gagal"
 GRE_gordian_knot_tt: "Setiap penandatangan yang bukan §YItalia§! akan menyatakan perang terhadap §YTurki§! bersama §YYunani§! untuk memenuhi ketentuan §YKonvensi Megali§!."
 GRE_secure_the_aegean: "Amankan Laut Aegea"
 GRE_secure_the_aegean_desc: "Kami berupaya menyelesaikan permasalahan di negara lain di Eropa namun mengabaikan ancaman yang ada di depan pintu kami. Orang-orang Turki telah menghantui rakyat Yunani sebagai musuh bebuyutan kami selama berabad-abad, dan meskipun kami berharap untuk menciptakan jalan baru yang lebih cerah, menjadi jelas bahwa masa depan tidak dapat dimenangkan sampai masa lalu diperbaiki."
 GRE_dominate_the_bulgarians: "Dominasi Bulgaria"
 GRE_dominate_the_bulgarians_desc: "Bulgaria berulang kali mengancam keselamatan Yunani. Mereka disebut 'Prusia dari Balkan' – sungguh aneh. Kami tidak akan membiarkan mereka membahayakan keselamatan Yunani, tidak lagi."
 GRE_stage_an_incident_in_the_bosporus: "Mengadakan Insiden di Bosporus"
 GRE_stage_an_incident_in_the_bosporus_desc: "Politbiro Soviet tidak merahasiakan keinginan mereka untuk menguasai Konstantinopel. Dengan bantuan kami, Soviet telah memutuskan untuk mengambil langkah konkrit pertama untuk mengambil kendali Selat Bosporus, dan Yunani memainkan peran yang sangat penting..."
 SOV_isolating_turkey: "Mendukung ambisi melawan Turki"
 GRE_reviving_the_double_headed_eagle: "Menghidupkan Kembali Elang Berkepala Dua"
 GRE_reviving_the_double_headed_eagle_desc: "Kaum Venizelist adalah pengecut yang menolak membiarkan Yunani mengembalikan kejayaannya yang hilang – kejayaan Byzantium! Mengapa berhenti di pesisir Turki jika kita bisa merebut kembali seluruh wilayah Kekaisaran yang hilang? Era kejayaan baru bagi Yunani telah dimulai!"
 GRE_nenikikamen: "Nenikikamen"
 GRE_nenikikamen_desc: "[Root.GetNenikikamenDesc]"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_STANDARD: "Kami telah menang! Venizelos akhirnya terbukti benar setelah bertahun-tahun! Ide Megali telah menang atas para penentang dan mereka yang akan menggagalkan nasib kita, dan kita sekarang berdiri di jurang zaman baru bagi Yunani – Zaman Keemasan!"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_BYZANTINE: "Kami telah menang! Byzantium telah terbalaskan setelah bertahun-tahun! Dengan merebut kembali ibu kota kekaisaran lama kita, kita selangkah lebih dekat menuju takdir kita! Kita berdiri di jurang zaman baru bagi Yunani – zaman yang lahir dari darah dan api! Kosmídisy Nikas!"
 GRE_attack_the_fascists: "Serang kaum Fasis"
 GRE_attack_the_fascists_desc: "Fasisme adalah sebuah virus, ia telah menyebar dari satu negara ke negara lain di Eropa seperti sebuah wabah. Komunisme adalah obatnya, dan kami akan memberikannya kepada mereka melalui kekerasan!"
 GRE_revolutionaries_of_the_south: "Revolusioner dari Selatan"
 GRE_revolutionaries_of_the_south_desc: "Kita tidak akan pernah bisa bertemu langsung dengan kawan-kawan kita di Moskow, namun selama Yunani masih mendiktekan keyakinan revolusionernya, di sini – di selatan Eropa – kita akan hidup bebas dalam Komunisme sejati kita!"
 GRE_phoideratoi: "Poideratoi"
 GRE_phoideratoi_desc: "Nenek moyang kita punya keinginan untuk bekerja sama dengan orang-orang barbar ketika diperlukan, dan kita pasti mempunyai kebutuhan itu saat ini. Kita harus memberikan hak kepada semua mantan rakyat Kekaisaran yang bersimpati dengan perjuangan kita melawan dunia modern untuk berperang dalam barisan tentara kita yang luar biasa! Bersama-sama, sebagai satu kesatuan, kita berbaris menuju kemenangan!"
 GRE_the_die_is_cast: "Dadu sudah dilemparkan!"
 GRE_the_die_is_cast_desc: "Impian kita menjadi kenyataan, namun dunia masih berada dalam bahaya! Batasan telah ditentukan, dan Yunani akan menentukan bagaimana konflik yang akan datang ini berakhir!"
 GRE_byzantine_themata: "Tema Bizantium"
 GRE_byzantine_themata_desc: "Dunia telah banyak berubah sejak Kejatuhan Konstantinopel, dan penaklukan telah berubah menjadi sebuah usaha yang cukup rumit. Kita tidak bisa mengharapkan masyarakat Kekaisaran yang baru ditaklukkan untuk melayani kita hanya karena kita menginginkannya: kita harus mengizinkan pemerintahan mandiri pada tingkat tertentu dan bekerja sama dengan pemerintah lokal di wilayah yang ditaklukkan ini. Untuk mengamankan Kerajaan kita kembali, ini hanyalah harga kecil yang harus dibayar."
 byz_restore_byzantine_empire_category_tt: "Membuka keputusan §YPulihkan Kekaisaran Bizantium§!."
 GRE_the_kings_government: "Pemerintahan Raja"
 GRE_the_kings_government_desc: "Intervensi tepat waktu dari Yang Mulia telah menghentikan kaum Venizelist dalam membentuk pemerintahan baru, dan tidak terlalu cepat! Ada pekerjaan yang harus diselesaikan! Demertzis telah memenuhi tujuannya sebagai mediator berhaluan tengah, namun kini Yunani membutuhkan kepala pemerintahan yang lebih kuat."
 GRE_the_right_to_rule: "Hak untuk Memerintah"
 GRE_the_right_to_rule_desc: "Mengapa menunjuk seorang diktator untuk bertindak atas nama Raja ketika Raja benar-benar mampu bertindak atas haknya sendiri! Janganlah kita berpegang pada tradisi sementara Yunani menderita, inilah saatnya bagi seorang raja sejati yang melayani rakyat! Tuhan Selamatkan Raja George II!"
 GRE_abandon_french_italian_debt_tt: "Kami akan meninggalkan hutang yang kami miliki dengan §YPrancis§! dan §YItalia§!."
 GRE_absolute_monarchy_opposition_tt: "§RMengambil jalan ini akan menyebabkan Perang Saudara!§!\nPara §YVenezelis§! akan menjadi §Rpemberontak!§!\nPara §YKomunis§! akan menjadi §Rpemberontak!§!"
 GRE_metaxism_focus: "Metaksisme"
 GRE_metaxism_focus_desc: "Raja adalah kepala negara yang tidak perlu dipersoalkan, namun rakyat Yunani tetap merasa tidak nyaman dengan pengaturan ini. Ini mungkin tidak ideal, tetapi ada mantan perwira yang sangat berbakat dan setia menunggu untuk membentuk pemerintahan..."
 GRE_metaxism_warning_tt: "Jika §YYunani§! bergabung dengan suatu faksi sebelum sepenuhnya meningkatkan semangat kebangsaan §YMetaxisme§!, maka faksi tersebut akan §Rdihapus§!."
 GRE_the_hellenic_spirit: "Roh Helenik"
 GRE_the_hellenic_spirit_desc: "Kami berjuang untuk tetap menyalakan api suci yang menjadikan Yunani begitu hebat, pada suatu waktu. Kami mampu mencapai kehebatan sejati, kami tahu ini! Kita hanya perlu menemukan percikan itu lagi..."
 GRE_four_year_plan: "Rencana Empat Tahun"
 GRE_four_year_plan_desc: "Metaxas telah merancang rencana brilian untuk melakukan industrialisasi Yunani. Berdasarkan model ekonomi korporatis Italia, kita akan mencapai tingkat autarki dan kemandirian dari kekuatan yang mengikat kita."
 GRE_petition_britain_for_aid: "[Root.GetGreekPetitionForAidName]"
 GRE_PETITION_FOR_AID_FOCUS_NAME_STANDARD: "Petisi Bantuan kepada Inggris!"
 GRE_PETITION_FOR_AID_FOCUS_NAME_MONARCHIST: "Petisi Bantuan kepada Inggris dan Jerman!"
 GRE_petition_britain_for_aid_desc: "[Root.GetGreekPetitionForAidDesc]"
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_STANDARD: "Rakyat jelata telah menunjukkan ketidaksetujuan mereka terhadap pemerintahan Raja melalui pembangkangan sipil dan ancaman perang saudara. Musuh-musuh kita memiliki posisi yang lebih tinggi saat ini, jadi tidak ada salahnya meminta bantuan sekutu Inggris dalam perjuangan kita. Dengan Inggris di pihak kita, kita tidak mungkin kalah."
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_MONARCHIST: "Rakyat jelata telah menunjukkan ketidaksetujuan mereka terhadap pemerintahan Raja melalui pembangkangan sipil dan ancaman perang saudara. Musuh-musuh kita mempunyai posisi yang lebih tinggi saat ini, jadi tidak ada salahnya meminta bantuan sekutu kita dalam perjuangan kita. Dengan Inggris dan Jerman di pihak kita, kita tidak mungkin kalah."
 GRE_monarchist_civil_war: "Perang saudara atas kekuasaan absolut George II telah dimulai"
 GRE_the_national_youth_organisation: "Organisasi Pemuda Nasional"
 GRE_the_national_youth_organisation_desc: "Ada sesuatu yang mengagumkan dalam cara Jerman dan Italia mengorganisir generasi muda mereka. Kita dapat menyesuaikan model mereka untuk memastikan bahwa generasi muda kita tidak berpartisipasi dalam perilaku asosial atau tidak menghormati pemimpin besar kita [ROOT.GetLeader]."
 GRE_crack_down_on_the_republicans: "Menindak Partai Republik"
 GRE_crack_down_on_the_republicans_desc: "Kita sudah terlalu lama menghibur para Venezelist - sekarang saatnya sandiwara ini diakhiri. Mereka sama sekali tidak mempunyai kehormatan dan rasa hormat, mereka sama sekali tidak mempunyai moral, dan kita akan mengusir mereka keluar dari Yunani seperti hama yang mereka derita!"
 GRE_use_the_military: "Gunakan Militer"
 GRE_use_the_military_desc: "Kami akan menyerang mereka dengan segala yang kami miliki! Kami akan memburu mereka di jalanan, kami akan memburu mereka di gang-gang, kami akan memburu mereka sampai ke ujung bumi! Jangan sampai ada warga Venezel yang menganggap diri mereka aman dari aturan kita yang selalu waspada!"
 GRE_recruit_the_fascists: "Rekrut kaum Fasis"
 GRE_recruit_the_fascists_desc: "Untuk menangkap seorang radikal, Anda harus mampu berpikir seperti itu. Kaum fasis adalah musuh kita yang keji, tapi dari semua musuh kita, kitalah yang paling tidak membenci mereka. Mereka bersedia bekerja sama dengan kita, jadi mengapa kita tidak memanfaatkan mereka untuk tujuan kita sendiri?"
 GRE_fascists_put_in_play_tt: "§YFaksi Fasis§! menjadi aktif dan mulai §Gbersahabat§! dengan pemerintah.\nDengan bekerja sama dengan §Yfasis§!, kita melegitimasi gerakan mereka."
 GRE_realign_ourselves_with_the_central_powers: "Sejajarkan Kembali Diri Kita dengan Kekuatan Sentral"
 GRE_realign_ourselves_with_the_central_powers_desc: "Entah bagaimana, hal yang mustahil telah terjadi! Führer telah pergi dan Kaiser telah kembali! Kebijakan luar negeri Inggris telah beradaptasi karena peristiwa-peristiwa ini, dan belum tentu menguntungkan kita. Mungkin kita harus bersatu dengan saudara kita di Berlin, dan berjuang untuk menyelamatkan hak ilahi para raja di seluruh Eropa."
 GRE_AUS_is_HUN_EMPIRE_tt: "Austria telah membentuk §Y$HUN_EMPIRE_neutrality$§!"
 GRE_no_central_powers_tt: "§YAustria-Hongaria§! atau §YKaiserreich§! harus ada agar fokus ini dapat memberikan dampak apa pun."
 GRE_our_traditional_allies_in_the_aegean: "Sekutu Tradisional Kita di Laut Aegea"
 GRE_our_traditional_allies_in_the_aegean_desc: "Siapa yang membantu kami memenangkan kemerdekaan melawan Ottoman pada tahun 1832? Inggris. Siapa yang terus menjaga perekonomian kita dengan pinjaman dan investasi selama bertahun-tahun? Inggris. Kekuatan apa yang menentukan masa depan Yunani? Dengan Inggris!"
 GRE_metaxism_lost_tt: "Jika kita belum melaksanakan reformasi Metaxas yang terakhir, maka kita akan kehilangan semangat nasional §YMetaxism§!!"
 GRE_prepare_against_the_mediterranean_threat: "Bersiap Melawan Ancaman Mediterania"
 GRE_prepare_against_the_mediterranean_threat_desc: "Italia adalah ancaman yang ambisinya bertentangan dengan nasib Yunani. Kita tidak mendapatkan apa pun dengan menunggu dan berpura-pura bahwa mereka tidak menimbulkan ancaman bagi kita. Kami akan mengambil tindakan, sehingga ketika orang-orang Italia akhirnya mencapai pantai kami, mereka akan dipaksa kembali ke lautan tempat mereka keluar melalui upaya bersama jutaan orang Yunani!"
 GRE_the_metaxas_line: "Permulaan §YJalur Metaxas§! - serangkaian benteng darat yang melapisi perbatasan kita yang sering dirusak - akan selesai."
 GRE_the_leonidas_line: "Permulaan §YLeonidas Line§! - serangkaian benteng darat yang melapisi perbatasan kita yang sering dirusak - akan selesai."
 GRE_an_orthodox_state: "Negara Ortodoks"
 GRE_an_orthodox_state_desc: "Kami adalah negara Kristen Ortodoks - ini adalah bagian integral dari identitas nasional kami. Kemuliaan bagi-Mu ya Tuhan, harapan kami, kemuliaan bagi-Mu."
 GRE_following_in_the_footsteps_of_giants: "Mengikuti Jejak Raksasa"
 GRE_following_in_the_footsteps_of_giants_desc: "Metaxas telah membantu menunjukkan kepada kita beberapa manfaat dari fasisme, namun dia terlalu pengecut untuk membawa kita sepenuhnya. Kita memerlukan jenis fasisme yang sebenarnya: fasisme Yunani - fasisme yang bukan fasisme murahan seperti model Italia atau Jerman."
 GRE_if_does_right_to_rule_effect_tt: "Jika fokus §Y$GRE_the_right_to_rule$§! telah selesai:"
 GRE_if_does_metaxism_effect_tt: "Jika fokus §Y$GRE_metaxism_focus$§! telah selesai:"
 no_fascist_metaxism_spirit_tt: "Jika fokus §YMenghidupkan Kembali Semangat Prajurit Spartan§! belum diambil, maka semangat kebangsaan §YMetaksisme§! tidak akan difasis dan malah akan §Rdihapus§!."
 GRE_reclaiming_the_wayward_ally: "Merebut Kembali Sekutu yang Tersesat"
 GRE_reclaiming_the_wayward_ally_desc: "Runtuhnya Kesultanan Utsmaniyah sangat melegakan kami, namun Republik Turki merupakan ancaman yang lebih besar bagi Yunani dibandingkan Kesultanan Utsmaniyah yang mendahuluinya. Saat-saat yang aneh membutuhkan teman tidur yang asing; terserah pada Yunani untuk mengembalikan Ottoman."
 GRE_the_greater_enosis: "Mencapai Enosis"
 GRE_the_greater_enosis_desc: "[Root.GetAchievingEnosisDesc]"
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_STANDARD: "Siprus telah dan akan selalu menjadi Yunani. Mungkin kita belum siap sebelumnya ketika Inggris merampas kesempatan kita untuk melakukan unifikasi, namun kini negara kita sudah cukup kuat dan stabil untuk menyatukan rakyat kita! Sudah waktunya untuk mengakhiri pendudukan asing di Siprus sehingga pulau Siprus dapat digabungkan menjadi negara Yunani tempatnya berada."
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_ALTERNATE: "Siprus telah dan akan selalu menjadi Yunani. Mungkin kita belum siap sebelumnya ketika Inggris merampas kesempatan kita untuk melakukan unifikasi, namun kini setelah Siprus memperoleh kemerdekaannya, tentunya sudah tiba waktunya untuk memperbaiki kesalahan! Mimpi tentang pemerintahan sendiri ini bersifat khayalan hingga mencapai titik arogansi; tentunya masyarakat Siprus harus melihat bahwa mereka adalah tempat yang paling aman sebagai bagian integral dari bangsa Yunani."
 GRE_securing_the_bulgarian_menace: "Mengamankan Ancaman Bulgaria"
 GRE_securing_the_bulgarian_menace_desc: "Kapan Bulgaria tidak menjadi ancaman terhadap integritas wilayah Yunani? Bagaimana kita bisa mempercayai pemerintah Bulgaria untuk tidak mencari kesepakatan dengan kekuatan yang lebih besar sehingga mereka bisa bersekongkol melawan kita? Kita mungkin menyebutnya paranoia, tapi kita menyebutnya pengalaman. Kita harus menyelaraskan Bulgaria untuk menjaga kepentingan kita."
 GRE_third_hellenic_civilization: "Peradaban Hellenic Ketiga"
 GRE_third_hellenic_civilization_desc: "Dunia masih gagal melihat kami sebagai pewaris warisan Bizantium dan Hellenik. Mereka sangat memuji nenek moyang kita namun memandang rendah kita saat ini dengan sikap yang begitu meremehkan. Kami akan membuat mereka melihat - kami bukanlah Kekaisaran Bizantium dan kami juga bukan orang Yunani dahulu kala, kami adalah Peradaban Hellenic Ketiga dan kami akan melakukan perbuatan besar yang dengan bangga kami sebut sebagai milik kami!"
 GRE_the_modern_movement: "Gerakan Modern"
 GRE_the_modern_movement_desc: "Fasisme adalah keyakinan abad ke-20 - ini adalah jawaban atas kesalahan merajalelanya kapitalisme dan korupsi komunisme. Fasisme adalah seruan sebuah generasi; sebuah generasi yang sudah muak dengan penindasan dari luar negeri! Generasi yang sudah muak dengan rasa malu nasional! Sebuah generasi yang siap membawa Yunani ke Era Baru sebagai Kekuatan Besar – siap menjawab segala ancaman dan penghinaan apa pun! Aera!"
 GRE_required_fascist_faction_loyalty_tt: "§YFaksi Fasis§! harus §Gloyal§!."
 GRE_expansion_of_athens_university: "Perluasan Universitas Athena"
 GRE_expansion_of_athens_university_desc: "Sains dan pendidikan tinggi selalu menjadi bagian integral dari tradisi Yunani, dan tidak ada badan akademis yang lebih penting bagi Yunani saat ini selain Universitas Nasional dan Kapodistrian Athena. Dengan menyediakan dana tambahan dan ruang untuk perluasan, kita akan meningkatkan manfaat lembaga ini bagi negara."
 GRE_defending_our_kingdom: "Mempertahankan Kerajaan Kita"
 GRE_defending_our_kingdom_desc: "Beberapa pakar mengatakan bahwa mengingat perkembangan politik terkini di Eropa, ancaman terbesar terhadap suatu negara sebenarnya bisa datang dari dalam. Omong kosong! Tetangga kitalah yang selalu merencanakan dan berkomplot melawan kita yang merupakan ancaman sebenarnya! Kita sering mengalami kekalahan, namun dalam perang berikutnya, penting bagi kita untuk keluar dari pihak lain dengan kemenangan."
 GRE_hellenoturkism: "Helenoturkisme"
 GRE_hellenoturkism_desc: "Ada keinginan yang hampir universal di antara Partai Sosialis Nasional Yunani untuk memperdalam hubungan kita dengan Turki. Kita telah bertarung dan berdarah satu sama lain selama berabad-abad sehingga tak seorang pun berpikir untuk mempertimbangkan keajaiban yang bisa kita capai bersama! Kita berdua harus mengikat diri pada kekuatan fasis demi keamanan! Mari kita berharap orang-orang Turki melihatnya dengan cara yang sama seperti kita..."
 GRE_cement_greco_german_ties: "Ikatan Semen Yunani-Jerman"
 GRE_cement_greco_german_ties_desc: "Sebuah kebenaran yang banyak dilupakan oleh kaum sayap kiri adalah bahwa jika bukan karena kebijakan fiskal Jerman yang murah hati terhadap kita, negara kita akan terpuruk lagi beberapa tahun yang lalu. Apa pun yang telah kita capai sejauh ini tidak akan mungkin terjadi tanpa Jerman! Kita lebih membutuhkan mereka daripada mereka membutuhkan kita, namun kita masih bisa mendapatkan kesepakatan yang lebih baik dari mereka atas nama persahabatan kita yang erat dan baik."
 schachtplan_required_tt: "Tidak memiliki variasi apa pun dari §YSchachtplan§!"
 GRE_protectors_of_the_mediterranean: "[Root.GetProtectorsMediterraneanName]"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_STANDARD: "Pelindung Mediterania"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_MONARCHIST: "Juara Mediterania"
 GRE_protectors_of_the_mediterranean_desc: "[Root.GetProtectorsMediterraneanDesc]"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_STANDARD: "Mediterania adalah rumah kita, dan rumah bagi jutaan orang lainnya. Kami selalu berkeinginan untuk mewujudkan perdamaian abadi di wilayah kecil di dunia ini, namun tujuan-tujuan mengagumkan ini selalu digagalkan oleh pihak-pihak yang memiliki niat buruk. Kita tidak bisa lagi menyerah dan membiarkan diri kita atau tetangga kita menderita karena tindakan orang-orang yang ingin melakukan kejahatan. Inilah saatnya untuk membela apa yang benar."
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_MONARCHIST: "Mediterania adalah rumah kita, dan rumah bagi jutaan orang lainnya. Kami selalu berkeinginan untuk mewujudkan perdamaian abadi di wilayah kecil di dunia ini, namun tujuan-tujuan mengagumkan ini selalu digagalkan oleh pihak-pihak yang memiliki niat buruk. Nah, jika Anda tidak bisa mengalahkan mereka - bergabunglah dengan mereka. Kita akan membentuk kerajaan Yunani yang perkasa bagi diri kita sendiri, dan pada akhirnya melakukan hal yang benar terhadap negara-negara yang sering diinjak-injak."
 GRE_reviving_the_spartan_warrior_spirit: "Menghidupkan Kembali Semangat Prajurit Spartan"
 GRE_reviving_the_spartan_warrior_spirit_desc: "Pada Pertempuran Thermopylae, dikatakan bahwa empat ribu orang Sparta mampu membunuh dua puluh ribu orang Persia saat mereka menghalangi perjalanan Xerxes lebih jauh ke Yunani. Kita membutuhkan kepahlawanan seperti itu saat ini lebih dari sebelumnya, sehingga ketika calon penakluk berikutnya muncul di pinggiran kota Athena untuk mengambil rumah dan nyawa kita, kita dapat memiliki keberanian untuk menghadapinya dan berkata: molon labé."
 GRE_subjugating_the_bulgarians: "Menaklukkan Bulgaria"
 GRE_subjugating_the_bulgarians_desc: "Orang-orang Bulgaria adalah musuh seumur hidup kami; mereka ada hanya untuk menjadi pisau di punggung kita. Peradaban mereka yang menyedihkan tidak pernah berarti apa-apa, sehingga mereka berusaha meruntuhkan warisan dan bangsa kita di setiap kesempatan. Cukup sudah – mari kita ingatkan orang Bulgaria mengapa kita adalah salah satu bangsa tertua yang masih bertahan di Eropa."
 GRE_greece_and_turkey_in_the_axis: "Yunani dan Turki Bersama di Poros!"
 GRE_greece_and_turkey_in_the_axis_desc: "Dengan ditandatangani dan diratifikasinya Pakta Persahabatan Yunani-Turki, kita sekarang akhirnya dapat mengubah nasib Balkan dengan menggunakan Jerman untuk memberikan kita semua kemakmuran abadi yang telah kita peroleh! Kami akan membawa sisa wilayah Balkan bersama kami dan berteriak jika itu yang diperlukan..."
 greek_turkish_friendship: "Pakta Persahabatan Yunani-Turki ditandatangani"
 GRE_last_country_standing: "Negara Terakhir yang Berdiri"
 GRE_last_country_standing_desc: "Kerja sama dengan pemerintah Turki sangat diharapkan, namun perlu diketahui bahwa pemerintahan baru Yunani tidak takut untuk mengambil tindakan ketika situasi menuntutnya. Semoga Tuhan mengampuni kita semua."
 GRE_moulding_the_new_world_order: "Membentuk Tatanan Dunia Baru"
 GRE_moulding_the_new_world_order_desc: "Mayatnya sudah menumpuk begitu tinggi, dan itu tidak boleh sia-sia. Kita berjuang untuk menciptakan status quo global yang baru, dan kita akan terus berjuang sampai tiba-tiba tidak ada lagi keinginan untuk berjuang di dunia."
 GRE_reevaluating_the_drachma: "Mendevaluasi Drachma"
 GRE_reevaluating_the_drachma_desc: "Kesengsaraan keuangan kita nampaknya tidak ada habisnya, dan gagal bayar serta hutang telah membuat kita berada dalam situasi ekonomi yang benar-benar tidak dapat dipertahankan. Kita harus dengan sengaja melakukan devaluasi mata uang sebagai persyaratan untuk merangsang masuknya modal asing, meskipun hal ini mungkin merugikan sebagian utang kita dalam jangka panjang."
 GRE_pay_back_debt_tt: "§Ykeputusan§! ini akan memungkinkan kita untuk menurunkan peringkat dan pada akhirnya menghilangkan §YHutang kepada semangat nasional I.F.C.§!."
 GRE_lignite_liquefaction: "Pencairan Lignit"
 GRE_lignite_liquefaction_desc: "Negara kami kaya akan tambang lignit, dan kami sudah mengetahui proses bagaimana lignit dapat diubah menjadi bahan bakar. Pemerintah harus mendorong pembukaan lebih banyak fasilitas pencairan lignit."
 GRE_force_the_farmers_into_factories: "Paksa Petani Masuk Pabrik"
 GRE_force_the_farmers_into_factories_desc: "Masyarakat umum tampaknya terjebak dalam dongeng bahwa mereka dapat terus bertani selama sisa hidup mereka dan keluar dari konflik yang sedang terjadi dengan baik-baik saja. Mereka salah: kita tidak punya pilihan selain mulai merampas lahan pertanian dan kemudian secara paksa memindahkan para petani ke pusat kota sehingga mereka dapat memulai pekerjaan yang lebih bermanfaat bagi negara."
 GRE_utilize_our_strengths: "Manfaatkan Kekuatan Kami"
 GRE_utilize_our_strengths_desc: "Yunani adalah negara petani dan barang mewah, dan tidak ada rasa malu dalam hal ini. Tentu saja, Jerman mungkin memproduksi tank dan pesawat tempur secara massal, tetapi menurut Anda dari mana asal tembakau dalam pipa Hermann Göring? Kami, orang Yunani, mengetahui kekuatan kami, dan jika kami terus menggunakannya maka kami akan baik-baik saja."
 GRE_extracting_more_from_our_soil: "Mengekstraksi Lebih Banyak Dari Tanah Kita"
 GRE_extracting_more_from_our_soil_desc: "Yunani adalah negara yang kaya akan sumber daya alam, kita hanya perlu memiliki tekad untuk menggalinya. Teknologi telah memberi kita jalan, sekarang yang tersisa hanyalah menemukan kemauan."
 GRE_open_foreign_subsidized_factories: "Buka Pabrik Bersubsidi Asing"
 GRE_open_foreign_subsidized_factories_desc: "Kami telah melampaui semua harapan dalam pembangunan dan penempatan staf di pabrik-pabrik, namun tidak ada keraguan bahwa kami berkembang lebih lambat dibandingkan negara-negara Eropa lainnya. Ada orang-orang yang jauh lebih kaya daripada kita yang bisa membuat perbedaan besar dalam proses modernisasi, kalau saja kita bisa membuat negara kita terlihat cukup menarik untuk berinvestasi."
 GRE_open_foreign_subsidized_factories_tt: "Satu §YPabrik Militer§! dan satu §YPabrik Sipil§! akan ditambahkan untuk masing-masing negara berikut yang memiliki §Yopini§! dari §YYunani§! lebih besar dari §G80§!:\n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, dan §Y[SOV.GetNameDef]§!."
 GRE_unlock_soviet_decision_tt: "Membuka Keputusan: §YTuan Rumah [SOV.GetAdjective] Birokrat di [ROOT.GetNameDef]§!"
 GRE_paying_back_our_debts_in_bulk: "Membayar Kembali Hutang Kami dalam Jumlah Besar"
 GRE_paying_back_our_debts_in_bulk_desc: "Semakin cepat kita terbebas dari utang, semakin cepat kita dapat benar-benar mengubah negara ini. Kita akan menyisihkan lebih banyak modal negara untuk membayar utang sehingga kita bisa lebih cepat terbebas dari penguasa fiskal asing."
 GRE_paid_off_most_of_debt_tt: "Pasti sudah melunasi sebagian besar §Yutang§! negara kita."
 GRE_paying_back_our_debts_in_bulk_ENG_tt: "Membuka Keputusan: §YPembayaran Hutang Besar ke Inggris§!"
 GRE_paying_back_our_debts_in_bulk_FRA_tt: "Membuka Keputusan: §YPembayaran Hutang Besar ke Perancis§!"
 GRE_paying_back_our_debts_in_bulk_ITA_tt: "Membuka Keputusan: §YPembayaran Hutang Besar kepada Italia§!"
 GRE_open_up_the_country: "Buka Negara"
 GRE_open_up_the_country_desc: "Memang menyedihkan untuk mengakuinya, namun kita tidak bisa melakukan industrialisasi sendirian. Kita sudah lama bergantung pada modal dan kemampuan industri negara-negara yang lebih besar dari kita, dan era ini tidak terkecuali. Jadi marilah kita mengundang modal dan investasi mereka ke Yunani hari ini, karena besok kita tidak akan membutuhkannya lagi!"
 GRE_connecting_our_prefectures: "Menghubungkan Prefektur Kami"
 GRE_connecting_our_prefectures_desc: "Bukan hanya basis industri yang kurang, namun juga infrastruktur nasional. Negara-negara tetangga kita telah melakukan urbanisasi di negara mereka, sudah waktunya kita mulai melakukan urbanisasi terhadap penduduk kita juga."
 GRE_exporting_more_luxury_commodoties: "Mengekspor Lebih Banyak Komoditas Mewah"
 GRE_exporting_more_luxury_commodoties_desc: "Tembakau, zaitun, feta, anggur, buah ara: bila Anda menginginkan yang terbaik dalam hidup, belilah perlengkapan mandi Anda dari Yunani! Kita tidak akan mengalami kesulitan untuk lebih meningkatkan citra internasional kita sebagai negara dengan produk mewah terbaik untuk dibeli."
 GRE_greek_autarky: "Autarki Yunani"
 GRE_greek_autarky_desc: "Ketergantungan kita yang sudah lama terhadap ibu kota negara-negara yang lebih kaya dari kita sungguh memalukan; negara-negara ini menggurui kami dan menindas kami serta menjadikan kami tetap miskin sehingga mereka dapat memenuhi kantong mereka dengan kekayaan. Jerman, Italia, dan Soviet telah menunjukkan kepada kita bahwa ada cara lain – jalan menuju swasembada dan kemerdekaan penuh! Tentu saja, kita mungkin memerlukan waktu untuk mencapai kondisi tersebut: kita bukan Jerman..."
 GRE_fiscal_responsibility: "[Root.GetFiscalResponsibilityName]"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_STANDARD: "Tanggung Jawab Fiskal"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_COMMUNIST: "Redistribusi Kekayaan yang Meluas"
 GRE_fiscal_responsibility_desc: "Kita akhirnya mencapai keseimbangan finansial untuk pertama kalinya dalam sejarah Yunani modern. Tidak ada keraguan bahwa ini adalah acara yang benar-benar layak untuk dirayakan! Kita harus memuji diri kita sendiri atas kehebatan kita dalam bernegara, kita pantas mendapatkannya."
 GRE_fiscal_responsibility_tt: "Harus telah melunasi sebagian atau seluruhnya §YHutang kepada I.F.C§!"
 GRE_bolster_the_schachtplan: "Perkuat Schachtplan"
 GRE_bolster_the_schachtplan_desc: "Schachtplan selama beberapa waktu telah menjadi landasan perencanaan terpusat Yunani, namun jelas bahwa Schachtplan secara terang-terangan ditulis untuk mendukung Jerman. Beberapa ekonom terkemuka di negara kita telah mengajukan skema untuk menegosiasikan ulang Schachtplan agar lebih menguntungkan kedua belah pihak, dan kita bodoh jika memilih untuk tidak memanfaatkannya!"
 GRE_british_docking_rights: "Hak Docking Inggris"
 GRE_british_docking_rights_desc: "Kunci kemenangan Entente di Front Timur Tengah selama Perang Besar adalah akses mereka ke pelabuhan-pelabuhan Yunani. Kita hidup di masa di mana Mediterania sepertinya akan menjadi ladang mesiu yang membuat Eropa bergejolak, dan Inggris pasti akan mendapatkan keuntungan dengan memiliki akses ke pelabuhan kita sekali lagi."
 GRE_renegotiate_debt_with_france: "Negosiasi Ulang Utang Kami dengan Prancis"
 GRE_renegotiate_debt_with_france_desc: "Perancis tampaknya tidak bisa mengatur kebijakan luar negeri mereka di Balkan secara langsung - baiklah, mari kita tawarkan mereka kesepakatan yang begitu sederhana sehingga mereka pun tidak akan bisa salah memahaminya. Maafkan hutang kami, dan kami akan mengikat keamanan dan penghidupan kami pada keberhasilan rezim Perancis."
 GRE_renegotiate_debt_with_france_tt: "Membuka Keputusan: §YMenyuap Serikat Buruh Prancis untuk Melecehkan Pemerintahnya§!\nMembatalkan §YHutang kepada I.F.C.§! yang dikelola oleh §Y[FRA.GetNameDef]§!."
 GRE_sophistry_and_science: "Penyesatan dan Sains"
 GRE_sophistry_and_science_desc: "Keistimewaan Yunani Kuno, kita sekarang membutuhkan pikiran yang cerdas dan ingin tahu yang siap untuk mengubah negara ini dan mendorong kita memasuki abad ke-20. Berfokus pada inovasi teknologi berarti kita tidak akan terjebak dalam mengejar ketertinggalan dari negara-negara Eropa lainnya selama lima puluh tahun ke depan."
 GRE_expand_our_tobacco_industry: "Perluas Industri Tembakau Kita"
 GRE_expand_our_tobacco_industry_desc: "Tidak ada keraguan bahwa ekspor terbesar dan paling menguntungkan kami adalah tembakau, produk yang kami jual ke seluruh dunia. Negara-negara yang telah menjalin hubungan dagang dengan kami pasti akan menghargai bahwa kami telah mempersiapkan usaha kami dengan sangat matang sehingga apa pun yang terjadi, dunia tidak akan pernah kekurangan tembakau kami yang terkenal."
 GRE_increase_our_mining_operations: "Tingkatkan Operasi Penambangan Kami"
 GRE_increase_our_mining_operations_desc: "Memperluas produksi tembakau mungkin akan membuat kita lebih tertarik pada komunitas internasional, namun hal ini berarti memperluas industri pertambangan berat kita yang memiliki lebih banyak manfaat bagi negara. Mineral dan bijih akan memenangkan perang, bukan tembakau dan minyak zaitun."
 GRE_bedrock_of_balkan_financial_stability: "[Root.GetBedrockFinancialStabilityName]"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_STANDARD: "Landasan Stabilitas Keuangan Balkan"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_COMMUNIST: "Surga bagi Korupsi Ekonomi Balkan"
 GRE_bedrock_of_balkan_financial_stability_desc: "Siapa yang menyangka bahwa Yunani, di antara semua negara lainnya, akan menjadi negara pertama di Balkan yang mampu memperbaiki situasi keuangannya dengan baik dan benar? Prestise regional kita telah meningkat pesat, dan kita harus memanfaatkan posisi baru kita sebagai bankir di Eropa Selatan untuk semakin memperkaya negara kita."
 GRE_bedrock_of_balkan_financial_stability_tt: "Kami akan menerima §YPabrik Sipil§! di luar peta untuk setiap negara di §YBalkan Barat§!, §YBalkan Timur§!, dan §YBalkan Utara§! yang memiliki keramahan tinggi §Ypendapat§! dari kami. Hal ini berlaku juga untuk §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, dan §Y[TUR.GetNameDef]§!."
 GRE_rapprochement_with_the_italians: "Pemulihan hubungan dengan Italia"
 GRE_rapprochement_with_the_italians_desc: "Saat-saat yang drastis memerlukan tindakan yang drastis. Kita harus melakukan hal yang tidak terpikirkan dan mendekati Italia atas bantuan mereka dalam memodernisasi negara kita. Bagaimana pihak Italia akan memeras dan memeras kita terkait pengaturan ini? Hanya Tuhan yang tahu. Jika kesepakatan bisa dicapai sejak awal..."
 GRE_appeal_to_the_soviet_union: "Banding ke Uni Soviet"
 GRE_appeal_to_the_soviet_union_desc: "Kami tidak memandang enteng Uni Soviet. Kita akan masuk ke dalam sarang serigala yang siap mencabik-cabik kita jika kita tidak berhati-hati, namun tentunya lebih baik bagi kita untuk mendatangi mereka daripada mereka mendatangi kita..."
 GRE_encourage_tourism: "Mendorong Pariwisata"
 GRE_encourage_tourism_desc: "Situs warisan budaya kita membuat iri dunia, dan tidak ada keraguan bahwa kita dapat mengubah pariwisata menjadi keuntungan besar bagi perekonomian kita. Tentu saja, bayang-bayang perang yang membayangi Eropa akan sedikit meredam segalanya - tapi mudah-mudahan hal ini akan membuat liburan ke Yunani yang eksotis menjadi lebih menarik!"
 GRE_encourage_tourism_tt: "§RKita akan kehilangan industri pariwisata segera setelah kita memasuki keadaan perang!§!"
 GRE_mobilise_our_economy: "Memobilisasi Perekonomian"
 GRE_mobilise_our_economy_desc: "Negara-negara besar di Eropa sedang meningkatkan mesin perang mereka, dan kita tidak bisa mengambil risiko jika kita tidak siap. Proses ini akan menyakitkan bagi Yunani – lebih menyakitkan daripada kebanyakan negara – namun demi kelangsungan hidup kita, kita harus berkorban."
 GRE_rejuvenating_athens: "Meremajakan Athena"
 GRE_rejuvenating_athens_desc: "Ibu kota kami yang besar dan megah adalah salah satu kota tertua di seluruh Eropa. Prefektur ini juga merupakan salah satu prefektur kami yang terkaya dan paling terorganisir secara efektif. Daripada mengembangkan provinsi-provinsi yang sudah terbelakang, mari kita asah upaya kita pada modal kita yang sudah modern."
 GRE_making_use_of_our_islands: "Memanfaatkan Pulau Kami"
 GRE_making_use_of_our_islands_desc: "Kita mendapatkan kembali banyak sekali pulau dari sisa-sisa Kesultanan Utsmaniyah setelah pulau itu dibantai dengan sangat efisien oleh Entente, namun kita tidak berbuat banyak terhadap pulau-pulau tersebut sejak kita mengambil alih. Kreta telah lama menjadi bagian penting dari Yunani, dan kami akan memulai upaya kami di sana dan berupaya menjangkau pulau-pulau lain untuk menjadikannya lebih bernilai strategis dan material bagi negara."
 GRE_making_use_of_our_islands_tt: "Fokus ini memiliki dampak yang lebih besar ketika juga mengendalikan §YSiprus§! dan §YKepulauan Dodecanese§!."
 GRE_making_use_of_our_islands_dodecanese_tt: "Fokus ini memiliki efek yang lebih besar ketika mengendalikan §YKepulauan Dodecanese§!."
 GRE_making_use_of_our_islands_cyprus_tt: "Fokus ini memiliki efek yang lebih besar ketika juga mengendalikan §YCyprus§!."
 GRE_clear_the_slums: "Bersihkan Permukiman Kumuh"
 GRE_clear_the_slums_desc: "Pengungsi Yunani menghindari wajib militer dan mengambil ruang yang berharga dengan mendirikan dan menetap di daerah kumuh dan kota kumuh. Keberadaan mereka mempermalukan negara, begitu pula para penghuninya dengan melalaikan tugas terhadap negara. Kami akan mengosongkan daerah kumuh ini dan memanfaatkan tanah serta masyarakatnya dengan lebih baik."
 GRE_cooperate_with_foreign_monopolies: "[Root.GetCooperateForeignMonopoliesName]"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_STANDARD: "Bekerjasama dengan Monopoli Asing"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST: "Nasionalisasi Monopoli Asing"
 GRE_cooperate_with_foreign_monopolies_desc: "Tidak ada gunanya melawan kekuatan yang ada, ini adalah pertarungan yang tidak dapat dimenangkan dan akan membunuh Yunani secara perlahan jika kita melakukannya. Daripada bersikap bodoh, mari kita bawa monopoli ke meja perundingan dan buat kesepakatan damai untuk semua pihak yang terlibat."
 GRE_crack_down_on_foreign_monopolies: "Menindak Monopoli Asing"
 GRE_crack_down_on_foreign_monopolies_desc: "Sudah terlalu lama kita menoleransi pemberi pinjaman asing dan monopoli keuangan global – tidak lagi! Kita tidak akan lagi dipermainkan oleh entitas berbahaya ini, karena mulai hari ini Yunani akan benar-benar bebas!"
 GRE_academy_of_athens: "Akademi Athena"
 GRE_academy_of_athens_desc: "Akademi Athena didirikan pada tahun 1929 sebagai lembaga pendidikan tinggi, namun masih muda dan memerlukan bantuan untuk berkembang. Dengan intervensi kami, kami akan menjadikannya sebagai landasan bagi semua calon akademisi di Eropa dan sekitarnya!"
 GRE_hellenic_armed_forces: "Angkatan Bersenjata Hellenic"
 GRE_hellenic_armed_forces_desc: "Angkatan bersenjata kita cukup baik untuk menghadapi situasi nasional saat ini, namun kita tetap menjadi anggota Pakta Balkan yang paling lemah secara militer dan sering dikritik karena kurangnya modernisasi di seluruh angkatan bersenjata kita. Sudah waktunya kita serius dengan situasi militer kita, terutama ketika situasi internal kita memburuk..."
 GRE_the_hellenic_air_force: "Angkatan Udara Hellenic"
 GRE_the_hellenic_air_force_desc: "Meskipun Akademi Angkatan Udara kami baru didirikan pada tahun 1930, masyarakat Yunani telah terlibat dalam dunia penerbangan sejak Perang Balkan! Kita sudah memahami pentingnya angkatan udara yang kuat, andai saja kita mempunyai kemampuan untuk membuat angkatan udara kita semakin kuat dan besar..."
 GRE_the_hellenic_army: "Tentara Hellenic"
 GRE_the_hellenic_army_desc: "Kecil, kuno, tapi ulet - begitulah gambaran tentara Yunani, dan ini bukanlah deskripsi yang tidak akurat. Yang perlu kita lakukan hanyalah memodernisasi taktik dan peralatan kita dan kita akan menjadi kekuatan yang ditakuti di Balkan."
 GRE_the_hellenic_navy: "Angkatan Laut Hellenic"
 GRE_the_hellenic_navy_desc: "Kami, orang Yunani, memiliki tradisi maritim yang kuat dan membanggakan sejak kami pertama kali meraih kemerdekaan dari Kesultanan Utsmaniyah. Angkatan laut kita adalah yang terkuat di antara negara-negara tetangga kita, dan kita hanya perlu memupuk warisan angkatan laut kita untuk menjadikan diri kita pemain regional yang benar-benar kuat di Mediterania."
 GRE_destroying_our_foes: "Menghancurkan Musuh Kita"
 GRE_destroying_our_foes_desc: "Keamanan masa depan kita bergantung pada kemampuan kita untuk menyerang musuh sebelum mereka sempat menyentuh tanah air kita. Kita harus berinvestasi dalam strategi pengeboman strategis terhadap sasaran musuh."
 GRE_protecting_our_skies: "Melindungi Langit Kita"
 GRE_protecting_our_skies_desc: "Kita tidak pernah memiliki industri yang mampu melindungi langit dan mengebom musuh-musuh kita. Jika situasinya tergantung pada apakah kita ingin menyerang lebih banyak musuh atau menyelamatkan lebih banyak musuh kita dari serangan mereka, maka kita akan memilih untuk menyelamatkan bangsa kita sendiri setiap saat."
 GRE_the_backbone_of_our_army: "Tulang Punggung Angkatan Darat"
 GRE_the_backbone_of_our_army_desc: "Proses wajib militer kami agak kuno dibandingkan dengan banyak negara tetangga kami, dan sayangnya peralatan kami sudah ketinggalan zaman. Sudah saatnya kita memodernisasi prosedur wajib militer dan peralatan yang kita gunakan untuk mempersenjatai prajurit kita."
 GRE_a_legacy_of_war: "Warisan Perang"
 GRE_a_legacy_of_war_desc: "Perang ada dalam darah kita – kita telah mengobarkannya terhadap orang lain dan telah mengobarkannya terhadap kita sejak dahulu kala. Kita telah mempelajari lebih dari beberapa trik selama berabad-abad, dan sudah saatnya tentara nasional kita akhirnya mencerminkan masa lalu kita yang penuh darah."
 GRE_abandon_the_greek_turkish_naval_treaty: "Batalkan Perjanjian Angkatan Laut Yunani-Turki"
 GRE_abandon_the_greek_turkish_naval_treaty_desc: "Sebuah perjanjian yang seharusnya membatasi ukuran kapal yang boleh dibuat oleh Turki, akhirnya berakhir dengan kita terikat di dalamnya dengan batasan yang sama! Lupakan saja, Yunani dulunya memiliki kapal-kapal besar yang mendominasi pantai kita, dan selama masa pertikaian ini, tidak ada keamanan yang lebih baik daripada kapal perang raksasa!"
 GRE_abandon_the_greek_turkish_naval_treaty_tt: "Menyelaraskan diri kita secara politik dengan §YInggris§! atau dengan §YJerman§! akan memungkinkan kita membangun kembali beberapa §Ykapal berat§!.\nlama kita"
 GRE_a_modern_navy: "Angkatan Laut Modern"
 GRE_a_modern_navy_desc: "Tidak menjadi masalah jika Perjanjian Angkatan Laut Yunani-Turki membatasi ukuran kapal yang dapat kita bangun karena sejujurnya kita tidak memiliki industri angkatan laut untuk memelihara atau memperbesar armada kapal besar dan kapal penjelajah. Namun kapal selam... sekarang terdapat solusi yang layak untuk pertanyaan angkatan laut Yunani."
 GRE_escorts_for_our_bombers: "Pengawal Untuk Pembom Kami"
 GRE_escorts_for_our_bombers_desc: "Kita tidak cukup hanya memproduksi pesawat pengebom, harus ada pengawal yang melindungi para pengebom tersebut! Kita tidak bisa bergantung pada pesawat tempur standar untuk melakukan tugasnya, jadi kita harus mengembangkan pesawat tempur hebat yang mampu mengawal pesawat pengebom kita ke pantai musuh."
 GRE_defending_our_seas: "Mempertahankan Laut Kita"
 GRE_defending_our_seas_desc: "Yunani memiliki wilayah pantai yang sangat luas dan menguasai banyak pulau. Meskipun dulunya laut adalah salah satu aset pertahanan terbesar kita, kini laut tidak lagi mampu menghadapi musuh potensial. Jika musuh kita ingin merebut pulau-pulau kita atau mendarat di pantai kita, pertama-tama mereka harus selamat dari pemboman kapal-kapal pembom angkatan laut kita!"
 GRE_embracing_modern_warfare: "Merangkul Peperangan Modern"
 GRE_embracing_modern_warfare_desc: "Laporan dari Jerman menunjukkan bahwa 'tank' tersebut mungkin berguna selain hanya memberikan dukungan kepada batalyon infanteri. Bayangkan itu! Kita mungkin tidak memiliki industri yang mampu melakukan hal tersebut, namun ini merupakan pertaruhan yang patut dilakukan."
 GRE_new_weapons_old_tricks: "Senjata Baru, Trik Lama"
 GRE_new_weapons_old_tricks_desc: "Kami memiliki cukup banyak pengalaman dalam menjaga artileri dan menjalankan pengintaian selama Perang Besar. Teknologi dan peralatannya mungkin sudah berubah, tapi taktiknya belum. Mari kita gunakan kekuatan kita dan tunjukkan pada dunia bahwa kita tidak bisa melawan Yunani dengan mudah."
 GRE_a_fleet_fit_for_the_aegean: "Armada yang Cocok untuk Laut Aegea"
 GRE_a_fleet_fit_for_the_aegean_desc: "Setiap hari kita terpaksa melihat kapal penjelajah tempur Italia dan kapal induk Inggris mengangkut diri mereka melintasi lautan kita. Ini memalukan! Sudah saatnya seseorang di Balkan akhirnya berdiri dan menurunkan angkatan laut yang bisa kita banggakan."
 GRE_disrupting_the_great_powers: "Mengganggu Kekuatan Besar"
 GRE_disrupting_the_great_powers_desc: "Tempat kita bukanlah untuk bersaing dengan kekuatan-kekuatan besar di dunia yang saling bertarung di ladang dan lautan. Sebaliknya, kita akan menyerang mereka di tempat yang paling menyakitkan – jalur suplai mereka!"
 GRE_fund_the_hellenic_air_force_academy: "Danai Akademi Angkatan Udara Hellenic"
 GRE_fund_the_hellenic_air_force_academy_desc: "Pilot kita bersedia, mampu, dan kompeten - inilah saatnya kita memberi mereka rasa hormat yang pantas mereka terima. Kita akan mulai dengan mendanai kembali Akademi Angkatan Udara secara penuh dan meningkatkan produksi pesawat tempur secara tepat sehingga angkatan udara kita benar-benar bernilai bagi Yunani."
 GRE_hellenic_armoured_corp: "Perusahaan Lapis Baja Hellenic"
 GRE_hellenic_armoured_corp_desc: "Mendirikan divisi unit lapis baja kita sendiri akan menunjukkan kepada dunia betapa modernnya kita! Tentunya tidak ada daerah terpencil yang memiliki tank di pasukannya, bukan?"
 GRE_greek_mechanisation: "Mekanisasi Yunani"
 GRE_greek_mechanisation_desc: "Modernisasi sudah merupakan proses yang cukup menyakitkan, namun mekanisasi tentara kita mungkin benar-benar menempatkan kuda di depan kereta! Kemajuan memerlukan biaya yang besar, namun kita tidak boleh menghindarinya. Keamanan negara kita adalah yang terpenting di atas segalanya."
 GRE_the_cannon: "Meriam"
 GRE_the_cannon_desc: "Dunia akan mendengar ledakan meriam kita dari belahan dunia lain!"
 GRE_the_torpedo: "Torpedo"
 GRE_the_torpedo_desc: "Mungkin salah satu dari sekian banyak kru yang kita kirim ke kuburan air di bawah laut akhirnya akan membawa kita ke Atlantis! Atau mungkin kita akan puas dengan mengubah ibu kota musuh kita menjadi kota berikutnya yang hilang dan tenggelam..."
 GRE_a_land_of_mountains: "Negeri Pegunungan"
 GRE_a_land_of_mountains_desc: "Geografi alam kita memberi kita banyak pertahanan alami terhadap penjajah, kita hanya perlu belajar memanfaatkan wilayah kita sendiri! Tentu ada sesuatu yang bisa kita pelajari dari Swiss dalam hal ini."
 GRE_mountain_training_effect: "Mengaktifkan §HPelatihan Peperangan Gunung§!\n§HInfanteri\nPegunungan§!\nPertahanan: §G+5%§!\nPergerakan: §G+5%§!\n§HMarinir\nPegunungan§!\nSerangan: §G+5%§!\nPergerakan: §G+10%§!\n§HPendaki Gunung\nPegunungan§!\nSerangan: §G+5%§!\nPertahanan: §G+5%§!\nPergerakan: §G+10%§!\n§HPasukan Terjun Payung\nPegunungan§!\nSerangan: §G+5%§!\nPergerakan: §G+10%§!"
 GRE_a_long_and_proud_tradition: "Tradisi yang Panjang dan Bangga"
 GRE_a_long_and_proud_tradition_desc: "Angkatan Laut kita adalah salah satu dari sedikit hal yang secara konsisten menjadi kebanggaan Yunani, bahkan di saat-saat tergelap kita. Apa yang kami lakukan saat ini hanyalah kelanjutan dari tradisi panjang dan membanggakan."
 GRE_the_double_headed_aquila: "Aquila Berkepala Dua"
 GRE_the_double_headed_aquila_desc: "Kita akan menerbangkan Aquila Berkepala Dua dengan setiap pesawat yang terbang ke langit dan menghujani musuh kita dengan api! Dunia akan melihat seberapa jauh sayap kita bisa melebar..."
 GRE_modern_cataphracts: "Katafrak Modern"
 GRE_modern_cataphracts_desc: "Katafrak dulunya membuat iri dunia Abad Pertengahan! Kecepatan, armor, dan kekuatan mereka membuat kagum semua orang! Katafrak masa kini tidak diragukan lagi adalah tangki, dan kami akan memproduksi kelas tangki yang benar-benar layak untuk warisan katafrak Bizantium."
 GRE_thema_nautikon: "Tema Nautikon"
 GRE_thema_nautikon_desc: "Dulunya Byzantium menguasai ombak, namun bahkan berabad-abad sejak jatuhnya Byzantium, masyarakat Yunani tidak pernah kehilangan semangat pelautnya! Jika berbicara tentang medan perang, lautan sudah tidak asing lagi bagi kita seperti Pegunungan Pindus!"
 GRE_the_macedonian_farmlands: "Lahan Pertanian Makedonia yang Kaya"
 GRE_the_macedonian_farmlands_desc: "Ekspor utama [731.GetName] adalah produk pertaniannya. Tidak seperti wilayah lain di wilayah kita, wilayah ini sangat bagus untuk bertani, dan kita harus mengasah hal ini agar masa depan negara kita menjadi lebih baik."
 GRE_reorganize_the_royal_guard: "Atur ulang Pengawal Kerajaan"
 GRE_reorganize_the_royal_guard_desc: "Pengawal Kerajaan, atau yang sebelumnya dikenal dengan Kompi Pengawal Presiden, dibentuk berdasarkan dekrit kerajaan pada tahun 1868. Unit pengawal Agema terdiri dari seorang staf, dua kompi infanteri Evzone, dan satu kompi kavaleri. Kita harus mengatur ulang unit-unit tersebut, dan memanfaatkannya di medan perang sekali lagi."
 GRE_utilize_british_capital: "Memanfaatkan Modal Inggris"
 GRE_utilize_british_capital_desc: "Jelas bahwa Inggris sangat bersedia membantu kami karena raja kami adalah sekutu setia mereka. Kita harus memanfaatkan fakta ini dengan meminta investor mereka untuk membantu membangun kembali apa yang hilang selama perang saudara."
 TUR_the_montreux_convention: "Konvensi Montreux"
 TUR_the_montreux_convention_desc: "Sungguh keterlaluan bahwa terlepas dari segala hal yang telah terjadi sejak Perang Besar, kita masih tidak diberi hak untuk mengatur wilayah kita sendiri. Daripada mengambil alih selat ini secara sepihak oleh militer kita, marilah kita mencoba melakukan manuver diplomasi yang lebih cekatan sehingga kita dapat keluar dari krisis ini tanpa menjadi paria baru di Eropa."
 TUR_the_montreux_convention_tt: "Kami akan mengadakan §YKonvensi§! yang mengumumkan niat kami untuk melakukan militerisasi kembali §YDardanelles§! dan §YSelat Bosporus§!. Kita harus bersiap menghadapi kemungkinan reaksi balik dari §YUni Soviet§!."
 TUR_fully_integrate_the_is_bank: "Integrasikan Sepenuhnya Bank İş"
 TUR_fully_integrate_the_is_bank_desc: "Celâl Bayar dan sekelompok tokoh liberal yang berpikiran serupa serta pendukung demokrasi telah mengikatkan diri pada institusi İş Bank, yang didirikan Atatürk pada tahun 1924. Dengan mengintegrasikan İş Bank dan kelompok liberal yang terikat padanya, kita dapat memberikan sinyal kepada negara kita dan dunia yang lebih luas bahwa Turki akhirnya siap untuk mengambil beberapa langkah tentatif berikutnya menuju negara demokrasi penuh."
 TUR_sanayiciler_liberals_tt: "Keputusan §YProyek Industri Sanayiciler§! akan lebih murah karena model ekonomi liberal kita."
 TUR_continue_the_sumerbank_industrialization_scheme: "Lanjutkan Skema Industrialisasi Sümerbank"
 TUR_continue_the_sumerbank_industrialization_scheme_desc: "Didirikan pada tahun 1933, Pabrik Tekstil Sümerbank adalah bank milik negara yang mendanai pembangunan dan pengembangan industri tekstil di negara kita. Kita harus terus memperluas tanggung jawab yang diemban oleh bank, dan memperluas industri kita sesuai dengan rencana lima tahun."
 TUR_continue_the_sumerbank_industrialization_scheme_tt: "Jika §Y$TUR_first_five_year_plan$§! adalah §GAktif§!:"
 TUR_continue_the_sumerbank_industrialization_scheme_2_tt: "Jika §Y$TUR_first_five_year_plan$§! adalah §RNOT§! aktif:"
 TUR_millet_mektebi_focus: "Millet Mektepleri"
 TUR_millet_mektebi_focus_desc: "Meskipun program ini telah berjalan cukup lama, reformasi alfabet dan bahasa masih dilaksanakan secara nasional. Untuk mengatasi meluasnya buta huruf, kita harus memanfaatkan Lembaga Penelitian Bahasa Turki dan program sekolah nasional. Pendanaan lebih lanjut juga harus diberikan kepada tim pengajar keliling yang melakukan perjalanan antar desa yang kekurangan sekolah dalam upaya meningkatkan literasi."
 TUR_ratify_the_six_arrows: "Ratifikasi Enam Panah"
 TUR_ratify_the_six_arrows_desc: "Enam Anak Panah melambangkan enam pilar fundamental Kemalisme dan ratifikasi kami terhadap prinsip-prinsip ini ke dalam konstitusi nasional Turki tentunya akan sangat membantu kami dalam misi kami untuk menanamkan nilai-nilai Kemalisme di seluruh Turki."
 TUR_privatize_the_anadolu_agency: "Privatisasi Anadolu Agency"
 TUR_privatize_the_anadolu_agency_desc: "Kebebasan pers adalah suatu keharusan di bawah demokrasi sejati, dan meskipun kita mungkin tidak menyukai media yang bebas, kita harus belajar untuk mengatasinya. Kita dapat mengambil langkah besar ke arah ini dengan memprivatisasi Anadolu Agency milik negara, yang telah menyebarkan berita ke seluruh Turki sejak Atatürk mendirikannya pada tahun 1920."
 TUR_privatize_the_anadolu_agency_tt: "Menghapus keputusan §YInstitut Sensor Pers§!."
 TUR_lift_the_ban_on_other_political_parties: "Cabut Larangan terhadap Partai Politik Lain"
 TUR_lift_the_ban_on_other_political_parties_desc: "Tentu saja, setiap kali sebuah partai politik baru didirikan untuk melawan CHP, partai tersebut selalu dibajak oleh para fundamentalis agama yang akan memutarbalikkan republik kita dan prinsip-prinsip pendiriannya demi kepentingan mereka sendiri. Kali ini keadaannya pasti berbeda - namun kita harus tetap waspada."
 TUR_holding_our_first_multi_party_election: "Adakan Pemilu Multi-Partai Pertama Kami"
 TUR_holding_our_first_multi_party_election_desc: "Nasib Republik Turki tergantung pada pemilu yang akan datang: namun kami bersumpah untuk memperjuangkannya dengan adil, dan kami berjuang dengan adil. Masyarakat Turki dapat dipercaya untuk mengambil keputusan yang tepat."
 TUR_official_opposition_party_organised: "Sebuah partai oposisi resmi telah dibentuk."
 TUR_democratic_transition_focus: "[Root.GetDemocraticTransitionFocusName]"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_STANDARD: "Mencapai Impian Atatürk"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_ISLAMIST: "Milletin Adamı"
 TUR_democratic_transition_focus_desc: "[Root.GetDemocraticTransitionFocusDesc]"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_STANDARD: "Mustafa Kemal Atatürk telah lama bermimpi bahwa [ROOT.GetNameDef] suatu hari nanti akan menjadi negara demokrasi yang berfungsi penuh, dan tampaknya kita telah berhasil mewujudkan impian tersebut."
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_ISLAMIST: "Adnan Menderes, dengan secara transparan mendorong kebijakan-kebijakan Islamis berdasarkan platform hak-hak demokratis, telah menjadi Tokoh Bangsa. [ROOT.GetNameDefCap] sedang mengalami revolusi konservatif, dan yang bisa dilakukan dunia hanyalah menyaksikan dengan cemas."
 TUR_expanding_our_armaments: "Perluas Persenjataan Kami"
 TUR_expanding_our_armaments_desc: "Dunia sedang berubah, dan kami akan memikul tanggung jawab untuk mengangkat senjata melawan mereka yang tidak hanya mengancam Republik Turki namun juga fondasi ideologi yang mendasarinya. Dibutuhkan sedikit upaya untuk meyakinkan para sanayiciler mengenai hal ini, dan untuk mendapatkan bantuan mereka dalam melindungi negara kita."
 TUR_permit_regional_elections: "Izin Pilkada"
 TUR_permit_regional_elections_desc: "Turki adalah negara besar dengan banyak agama, budaya, dan kepentingan - mungkin tidak akan terlalu memperketat batas-batas konstitusi jika kita mengizinkan otonomi pada tingkat tertentu di seluruh negara, bahkan bagi mereka yang melakukan demonstrasi paling keras melawan Kemalisme... semua atas nama keamanan nasional, tentu saja."
 TUR_unlock_reconciliation_occupation_law_tt: "Membuka hukum pekerjaan: §YRekonsiliasi§!."
 TUR_truce_with_government_called_flag: "Gencatan senjata dengan pemerintah telah diumumkan."
 TUR_privatize_our_infrastructure: "Privatisasi Infrastruktur Kami"
 TUR_privatize_our_infrastructure_desc: "Sebagai penganut paham liberal yang teguh, kita harus belajar untuk lebih bergantung pada perusahaan swasta daripada membiarkan negara ikut campur dalam setiap persoalan konstruksi. Jika ada permintaan untuk lebih banyak infrastruktur provinsi, maka pasar akan meningkat untuk memenuhi permintaan tersebut!"
 TUR_democratic_capstone_focus: "[Root.GetDemocraticCapstoneFocusName]"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_STANDARD: "Melihat ke Luar"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_ISLAMIST: "Bersihkan Petugas"
 TUR_democratic_capstone_focus_desc: "[Root.GetDemocraticCapstoneFocusDesc]"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_STANDARD: "Menjadi negara demokrasi yang bertanggung jawab mempunyai lebih banyak tanggung jawab dibandingkan sekedar menjamin kebebasan warga negaranya. Dunia ini berbahaya, dan negara-negara demokrasi di seluruh dunia sedang diserang oleh kekuatan jahat. Kita mempunyai kewajiban untuk membela kebebasan."
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_ISLAMIST: "Kita tidak bisa memerintah secara efektif sampai kita berhasil menyingkirkan sampah-sampah Kemalis dari setiap organ negara. Kita bahkan tidak bisa mempercayai angkatan bersenjata kita untuk setia kepada pemerintah yang dipilih secara sah! Itu perlu diubah."
 TUR_civil_war_tt: "§RMembersihkan kaum Kemalis dari angkatan bersenjata kita akan memicu perang saudara. Kekuatan posisi awal kita akan bergantung pada seberapa kuat kelompok Islamis di wilayah tengah, dan apakah kita telah mereformasi angkatan bersenjata kita atau tidak. Kurdistan akan memisahkan diri dan memperjuangkan kebebasannya jika stabilitas di bawah 60% ketika fokus ini selesai.§!"
 TUR_the_sanayiciler: "Sanayiciler"
 TUR_the_sanayiciler_desc: "Atatürk telah bekerja tanpa kenal lelah selama bertahun-tahun untuk membina kelas pengusaha dan industrialis untuk membantu modernisasi negara kita. Sudah waktunya untuk berhenti bercocok tanam, dan mulai memanen – kita harus bekerja sama untuk menjadikan Turki sebagai kekuatan regional yang kompetitif."
 TUR_sanayiciler_tt: "Dengan menggunakan §YKekuatan Politik§! dan sarana lain yang kita miliki, kita akan mampu memberdayakan kelas industri yang sedang berkembang untuk menginvestasikan sumber daya mereka dalam mendirikan §YPabrik Sipil§! dan §YPabrik Militer§! untuk keperluan negara."
 TUR_cooperate_with_the_debt_council: "Bekerja sama dengan Dewan Utang"
 TUR_cooperate_with_the_debt_council_desc: "Ketika keadaan mereda setelah Perang Besar, Republik Turki tetap berdiri: sebuah negara yang bebas dan mandiri. Ya, kecuali fakta bahwa [TUR.GetNameDef] telah mewarisi utang tidak senonoh yang dimiliki Kesultanan Utsmaniyah, dan fakta bahwa utang yang sama dikelola di luar negeri oleh calon penakluk kita. Memang tidak ideal, tapi kita bisa bekerja sama dan menciptakan skenario yang bermanfaat bagi kita semua."
 TUR_debt_council_nationalized_tt: "§YDewan Utang§! tidak lagi memegang kendali atas utang §Y[TUR.GetNameDef]§!."
 TUR_utilize_foreign_capital: "Memanfaatkan Modal Asing"
 TUR_utilize_foreign_capital_desc: "Bangsa kita masih muda dan sebagian besar lahan kita belum subur untuk industri, namun kita tidak harus bekerja sendirian dalam hal ini. Turki yang kuat merupakan kepentingan banyak negara-negara Eropa, dan jika kita meminta bantuan kepada mereka maka mereka pasti akan memberikannya."
 TUR_foreign_capital_tt: "Semakin tinggi hubungan kita dengan §YKekuatan Besar Eropa§! dan §YUSA§!, semakin banyak pilihan untuk §Yinvestasi§! yang mampu kita bayar."
 TUR_treaty_of_saadabad: "Perjanjian Saadabad"
 TUR_treaty_of_saadabad_desc: "Kita tidak akan rugi apa-apa dan mendapatkan keuntungan apa pun dengan tetap bersahabat dengan tetangga kita di timur. Gagasan mengenai perjanjian yang meresmikan persahabatan kita kadang-kadang dilontarkan, dan inilah saat yang tepat bagi Turki untuk mengambil inisiatif dan memastikan persahabatan ini dikodifikasikan dalam sebuah perjanjian."
 TUR_assess_our_future: "Menilai Masa Depan Kita"
 TUR_assess_our_future_desc: "Ketika Mustafa Kemal Atatürk membebaskan bangsa ini dan mendeklarasikan kemerdekaannya, ia melakukannya dengan visi yang sangat spesifik tentang seperti apa negara [ROOT.GetAdjective] nantinya. Saatnya telah tiba untuk menganalisis apakah visi Ghazi kita masih sejalan dengan prioritas pemerintahan saat ini."
 TUR_choices_will_decide_legacy_tt: "§YMustafa Kemal Atatürk§! telah lama memperjuangkan transisi §Y[ROOT.GetNameDef]§! dari negara satu partai yang otoriter menjadi negara demokrasi liberal multi-partai. Pilihan kita dalam mengarahkan arah ideologis negara kita akan mencerminkan seberapa baik kita dianggap hidup sesuai dengan cita-cita §YAtatürk§!."
 TUR_ataturk_seeking_treatment: "Atatürk mencari perawatan medis"
 TUR_the_hatay_issue: "Masalah Hatay"
 TUR_the_hatay_issue_desc: "Kita tidak bisa lagi berdiam diri dan membiarkan penindasan terhadap minoritas Turki yang dilakukan oleh kaum irredentis Arab dan imperialis Perancis. Gagasan bahwa Hatay bukanlah bagian yang sah dari Turki adalah hal yang menggelikan dan dianggap sebagai revisionisme. Sudah waktunya untuk memperbaiki kesalahan tahun 1921."
 TUR_peace_in_the_world: "Perdamaian di Dunia"
 TUR_peace_in_the_world_desc: "Atatürk pernah menyatakan Perdamaian di Dunia sebagai tujuan akhir kebijakan luar negeri Turki, dan kami bermaksud untuk mewujudkan tujuan mulia tersebut. Kami berupaya mewujudkan perdamaian di Bumi, bukan perang abadi karena pertikaian kecil-kecilan."
 TUR_continue_the_policy_of_etatism: "Lanjutkan Kebijakan Etatisme"
 TUR_continue_the_policy_of_etatism_desc: "İsmet İnönü dan sekelompok menteri sayap kiri mendukung perubahan kebijakan ekonomi kita dari liberalisme laissez-faire dan menuju perekonomian unik yang dikelola negara Turki. Etatisme, seperti Kemalisme, mewakili perpaduan sempurna antara ideologi sayap kiri dan sayap kanan menjadi sesuatu yang lebih besar yang memberikan manfaat terbaik bagi rakyat Turki."
 TUR_sanayiciler_etatism_tt: "Keputusan §YProyek Industri Sanayiciler§! akan lebih mahal karena model ekonomi Etatist kami."
 TUR_peace_at_home: "Kedamaian di Rumah"
 TUR_peace_at_home_desc: "Musuh potensial kita akan menerkam kita saat mereka merasakan kelemahan dalam diri kita. Merupakan tanggung jawab utama seluruh pemerintahan Turki untuk menjamin kesejahteraan dan stabilitas internal negara. Ketika kita memiliki Kedamaian di Rumah, kita dapat mencita-citakan Kedamaian di Dunia."
 TUR_turkish_state_railways: "Kereta Api Negara Turki"
 TUR_turkish_state_railways_desc: "Tanpa campur tangan negara, negara kita akan selamanya menjadi negara yang terdiri dari kota-kota kaya dan perkotaan yang berbeda-beda di bagian barat dan suku-suku yang terdesentralisasi di bagian timur. Dengan menghubungkan negara kita melalui infrastruktur, kita membawa keseluruhan Turki ke abad ke-20, bukan hanya kota-kota pesisir kaya yang berbatasan dengan Laut Aegea."
 TUR_revive_turkish_revolutionism: "Menghidupkan kembali Revolusionisme Turki"
 TUR_revive_turkish_revolutionism_desc: "Reformasi sistem politik Turki jelas terbukti tidak memadai menghadapi penolakan luas dari rakyat Turki. Namun apakah solusi ini bertujuan untuk menenangkan massa, atau justru melipatgandakan radikalisme dalam reformasi yang kita lakukan? Kemalisme telah berubah pada tingkat inti sebelumnya: siapa yang dapat mengatakan ke mana arah konfigurasi ulang komponen ideologisnya di masa depan?"
 TUR_reinvigorate_turkish_nationalism: "Menghidupkan kembali Nasionalisme Turki"
 TUR_reinvigorate_turkish_nationalism_desc: "Satu-satunya cara untuk menyatukan negara adalah dengan meniru pemerintahan Mussolini. Kita membutuhkan pemimpin sayap kanan yang kuat, tidak menentang reformasi ekonomi sayap kiri, dan mampu menyuarakan isi hati masyarakat. Hanya ada satu orang untuk pekerjaan itu: Marsekal Fevzi Çakmak yang terhormat."
 TUR_the_second_five_year_plan: "Rencana Lima Tahun Kedua"
 TUR_the_second_five_year_plan_desc: "Rencana Lima Tahun yang pertama sukses besar, sehingga menteri-menteri terbaik di negara ini berkumpul dan memutuskan bahwa jika Rencana Lima Tahun yang pertama sukses, mengapa tidak mengadakan Rencana Lima Tahun yang lain?"
 TUR_the_guardians_of_kemalism: "Penjaga Kemalisme"
 TUR_the_guardians_of_kemalism_desc: "Korps perwira Kemalis hanya bisa berbuat banyak dalam hal menyebarkan cita-cita Kemalis ke seluruh negeri. Sudah waktunya bagi pemerintah untuk mengambil pendekatan yang lebih proaktif dalam membantu Kemalisme memenangkan hati dan pikiran masyarakat Turki."
 TUR_kemalist_state_targets_tt: "Dua negara bagian yang tidak selaras menjadi §YKemalis§!"
 TUR_the_sun_language_theory: "Teori Bahasa Matahari"
 TUR_the_sun_language_theory_desc: "Teori Bahasa Matahari adalah teori yang menyatakan bahwa semua bahasa manusia berasal dari akar bahasa Turki yang sama. Teori ini jelas sepenuhnya logis dan sangat penting bagi kita untuk secara resmi mensponsori teori tersebut dan mulai mengajarkannya ke seluruh negeri."
 TUR_variant_turkish_tax_focus: "[Root.GetTurkishVariantTaxName]"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_STANDARD: "Varlik Vergisi"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_SECULAR: "İnanç Vergisi"
 TUR_variant_turkish_tax_focus_desc: "[Root.GetTurkishVariantTaxDesc]"
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_STANDARD: "Kami akan memungut 'Pajak Kekayaan' pada non-Muslim di negara kami sehingga kami dapat mendanai proyek industri kami dengan lebih baik dan mendukung misi sekularisasi [ROOT.GetNameDef]."
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_SECULAR: "Institusi-institusi keagamaan sudah terlalu lama mengalami hal-hal baik di negara ini. Berkali-kali otoritas agama berusaha melemahkan pemerintah dan upaya-upayanya, maka sekarang kita harus membebaskan mereka dari kekayaan mereka agar dapat dimanfaatkan dengan lebih baik."
 TUR_turk_ulusu: "Turki Ulusu"
 TUR_turk_ulusu_desc: "Bagian dari menjadi negara yang bertanggung jawab dan modern adalah kemampuan untuk mendefinisikan kembali apa artinya menjadi warga negara dari negara tersebut. Kita terlalu ketat dalam mendefinisikan apa artinya menjadi orang Turki, dan untuk mewakili negara kita dengan tepat, inilah saatnya kita memperluas definisi tentang apa yang membuat seorang warga negara menjadi orang Turki."
 TUR_loosen_the_laws_on_secularism: "Melonggarkan Undang-Undang Sekularisme"
 TUR_loosen_the_laws_on_secularism_desc: "Agama telah menjadi faktor pemisah terbesar bagi bangsa kita: kita telah berkomitmen pada jalur sekularisme, namun mengapa? Untuk meniru negara-negara barat yang lemah? Bukan urusan negara untuk memutuskan kapan, di mana, dan bagaimana seseorang berdoa kepada tuhannya."
 TUR_purify_the_diyanet: "Bersihkan Diyanet"
 TUR_purify_the_diyanet_desc: "Diyanet penuh dengan orang-orang yang tidak pernah berdoa kepada Yang Mahakuasa sekalipun dalam kehidupan mereka yang kosong dan hampa. Diyanet harus diisi oleh orang-orang yang beriman: orang-orang yang mengabdi pada negara dan berpaling kepada Allah untuk mendapatkan bimbingan dan kenyamanan!"
 TUR_kemalist_officers_made_hostile_tt: "§RPejabat Kemalis akan sangat mempermasalahkan tindakan pemerintah.§!"
 TUR_rehabilitate_the_kadro_movement: "Rehabilitasi Gerakan Kadro"
 TUR_rehabilitate_the_kadro_movement_desc: "Merupakan kesalahan jika menutup Kadro dan membubarkan teorinya. Mereka mendekati negara dengan ide-ide segar dan revolusioner, namun kita mengabaikan mereka. Bangsa yang baru membutuhkan ide-ide baru, dan tidak ada ide yang lebih berani ditemukan di luar Kadro!"
 TUR_kemalism_and_the_modern_movement: "Kemalisme dan Gerakan Modern"
 TUR_kemalism_and_the_modern_movement_desc: "Ketika Recep Peker kembali dari Italia dengan membawa laporan tentang bagaimana fasisme dapat diselaraskan dengan Kemalisme, dia dikeluarkan dari jabatannya. Fasisme adalah keyakinan abad kedua puluh, dan kita bodoh jika mengabaikan ideologi yang paling cocok untuk Turki ketika negara itu menatap kita dari seberang Laut Adriatik!"
 TUR_kemalism_and_the_modern_movement_tt: "Semua negara §Yfasis§! di §YEropa§! pendapatnya tentang [ROOT.GetNameDef] akan meningkat sebesar §G+25§!."
 TUR_integrate_the_fascist_council: "Integrasikan Dewan Fasis"
 TUR_integrate_the_fascist_council_desc: "Dewan Fasis penasehat Recep Peker sudah cukup lama berada di sisi negara, sekarang saatnya memulai integrasi nilai-nilai fasis Turki ke dalam kerangka Kemalisme."
 TUR_restack_the_officer_corps: "Susun kembali Korps Perwira"
 TUR_restack_the_officer_corps_desc: "Korps perwira menjunjung tinggi nilai-nilai utama Turki, namun nilai-nilai utama tersebut telah... berubah. Jika para petugas enggan mencerminkan nilai-nilai ideologi Kemalis saat ini, maka kami akan memaksa mereka untuk mewujudkan nilai-nilai tersebut."
 TUR_restack_the_officer_corps_tt: "§YPetugas Kemalis§! akan ditata ulang agar lebih sesuai dengan keinginan pemerintah.\n§RJika stabilitas negara berada di bawah 50% dan Pejabat Kemalis sudah sangat diberdayakan maka mereka dapat diperkirakan akan memberontak melawan pemerintah!§!"
 TUR_form_the_redshirts: "Bentuklah Kaus Merah"
 TUR_form_the_redshirts_desc: "Setiap gerakan fasis yang sah di seluruh dunia mempunyai gerakan berkemeja! Orang Inggris dan Italia punya kaos hitam, orang Jerman punya kaos coklat, orang Cina punya kaos biru - warna merah paling mencerminkan Republik Turki, jadi kita akan membentuk kaos merah! Ketika orang mendengar istilah 'kaos merah', mereka akan langsung teringat pada laki-laki dan perempuan yang mendukung gerakan kita! Kami jenius!"
 TUR_fatherland_first: "Tanah Air Pertama!"
 TUR_fatherland_first_desc: "Ada banyak elemen masyarakat Turki yang akan melemahkan pemerintah dan menggoyahkan masyarakat kita karena alasan egois mereka sendiri. Itu berhenti pada kita: mulai sekarang, setiap warga negara Turki akan mengutamakan Tanah Airnya!"
 TUR_fatherland_first_tt: "Kami akan mengajukan seruan nasional kepada £faction_tur_traditionalist §YTradisionalis§!, £faction_tur_kurdish §YKurds§!, dan kelompok tertindas lainnya di negara kita untuk bersatu dan berdiri di belakang pemerintah yang mewakili mereka semua."
 TUR_deal_for_the_oniki_islands: "Kesepakatan untuk Kepulauan Oniki"
 TUR_deal_for_the_oniki_islands_desc: "Kepulauan Oniki di lepas pantai kami direnggut dari tangan kami dan diserahkan kepada orang-orang Italia yang bejat, tetapi sebelumnya orang-orang Yunani yang durhaka mengajukan klaim mereka atas pulau-pulau tersebut. Rhodes adalah orang Turki, dan Rhodes akan menjadi orang Turki lagi!"
 TUR_the_pontic_redoubt: "Keraguan Pontik"
 TUR_the_pontic_redoubt_desc: "Kita sudah terlalu lama memanjakan pertahanan barat dan mengabaikan perbatasan kita dengan [SOV.GetNameDef] yang terang-terangan tidak bertanggung jawab! Kita tidak bisa berharap untuk menahan mereka di perbatasan kita dalam jangka waktu lama, tapi dengan memperkuat benteng di sepanjang garis sungai kita, kita bisa berharap bisa mengalahkan mereka dalam perang gesekan. Harapan apa lagi yang kita miliki?"
 TUR_pontic_redoubt_trabzon_tt: "Menambahkan §Y7 benteng darat§! di sepanjang Sungai Çoruh dekat perbatasan [SOV.GetAdjective]."
 TUR_pontic_redoubt_van_tt: "Menambahkan §Y6 benteng darat§! di sepanjang Aliran Kars dekat perbatasan [SOV.GetAdjective]."
 TUR_pontic_redoubt_erzurum_tt: "Menambahkan §Y3 benteng darat§! di kota Erzurum."
 TUR_abuse_the_office_of_soil_products: "Penyalahgunaan Kantor Hasil Tanah"
 TUR_abuse_the_office_of_soil_products_desc: "Toprak Mahsulleri Ofisi didirikan untuk mengatur produksi bahan makanan dan upah pekerja pertanian, tetapi [ROOT.GetNameDef] tidak membutuhkan petani - ia membutuhkan tanah. Kami akan menekan pemilik lahan pertanian yang kinerjanya buruk untuk menjual tanah mereka sehingga industri baru dapat dibangun di lahan tersebut demi keuntungan negara secara keseluruhan."
 TUR_kemalist_socialist_theory: "Teori Sosialis Kemalis"
 TUR_kemalist_socialist_theory_desc: "Gerakan Kadro mewakili bentuk sosialisme yang pada dasarnya patriotik, dan sangat mirip dengan fasisme Inggris dan Marxisme-Leninisme dalam banyak hal. Intinya, Kadro mengutamakan pekerja Turki pada tingkat fundamental, dan tidak berusaha menghilangkan identitas nasional mereka saat melakukan hal tersebut. Gerakan kami adalah gerakan yang benar-benar revolusioner, dan yang lebih penting lagi: ini adalah gerakan Turki yang sesungguhnya."
 TUR_patriotism_over_internationalism: "Patriotisme Atas Internasionalisme"
 TUR_patriotism_over_internationalism_desc: "Kami menolak internasionalisme Trotskisme dan Marxisme radikal dan mendukung bentuk sosialisme yang benar-benar nasional. Penderitaan buruh internasional adalah hal sekunder dibandingkan perjuangan buruh Turki, dan itulah yang membedakan sosialisme Kemalis dengan varian komunisme yang lebih radikal."
 TUR_create_the_turkish_workers_militia: "Bentuk Milisi Pekerja Turki"
 TUR_create_the_turkish_workers_militia_desc: "Politik adalah bisnis kotor, dan tidak ada rezim yang menjamin kelanggengannya. Penting bagi kita untuk mempersenjatai buruh dan membekali mereka dengan sarana dan kemauan untuk melindungi hak-hak mereka dari siapapun yang akan merampasnya: baik itu kekuatan asing, atau gerakan politik baru yang baru muncul dari dalam negeri kita sendiri."
 TUR_halk_ve_devlet: "Halus dan Devlet"
 TUR_halk_ve_devlet_desc: "'Rakyat dan Negara' - di sinilah letak prioritas pemerintahan Kemalis-sosialis kita. Kita harus melindungi dan menjaga rakyat kita, dan hal terbaik yang bisa kita lakukan adalah memperkuat kekuasaan negara dalam segala hal."
 TUR_nationalise_all_private_industry: "Nasionalisasi Semua Industri Swasta"
 TUR_nationalise_all_private_industry_desc: "Kami tidak mengabaikan kontribusi para industrialis dan kaum liberal dalam perjuangan bersama untuk melindungi negara Turki dari kekuatan asing yang bersifat predator, namun mereka telah bertindak terlalu besar untuk kepentingan mereka sendiri. Selain melindungi kita dari pemodal ventura predator, mereka juga menjadi pemodal ventura predator. Hal ini tidak dapat ditaati lagi: kita harus menasionalisasi industri kita dan melindungi pekerja kita."
 TUR_georgian_manganese_extraction: "Ekstraksi Mangan di Georgia"
 TUR_georgian_manganese_extraction_desc: "Masih banyak mineral dan logam yang belum dimanfaatkan di Georgia, sementara stok baja kita sendiri masih sangat sedikit. Kami akan mengirimkan tawaran kepada pemerintah regional Georgia, dan menukar hak kami untuk mengekstraksi logam mereka dengan imbalan menyimpan sebagian kelebihannya untuk kami sendiri. Jika mereka setuju, kami akan memproduksi baja tepat di sebelah lokasi operasi di Trabzon."
 TUR_salt_the_scars_of_the_great_war: "Garam Bekas Luka Perang Besar"
 TUR_salt_the_scars_of_the_great_war_desc: "Rakyat Turki menjadi lunak pada tahun-tahun sejak Perang Kemerdekaan. Di manakah kemarahan yang sangat kita perlukan jika kita ingin menunjukkan kekuatan kita kepada dunia? Kita kalah banyak dalam Perang Besar, lebih banyak dari kebanyakan orang, dan satu-satunya alasan kita bertahan adalah karena kita berjuang mati-matian demi hak untuk bertahan hidup. Kami akan bertarung mati-matian di perang berikutnya juga."
 TUR_intervene_in_the_spanish_civil_war: "Campur tangan dalam Perang Saudara Spanyol"
 TUR_intervene_in_the_spanish_civil_war_desc: "Perang Saudara Spanyol telah berubah menjadi cawan petri dunia bagi persaingan ideologi. Kita berbagi wilayah Mediterania, dan hal ini memberi kita lebih banyak hak untuk memilih menjadi perantara atas nama pihak yang kita pilih dalam perang."
 TUR_a_common_destiny_for_all_of_turkey: "Takdir yang Sama untuk Seluruh Turki"
 TUR_a_common_destiny_for_all_of_turkey_desc: "Turki, Yunani, Kurdi, Kristen, Muslim, Atheis - kita semua bersama-sama melakukan hal ini. Adalah kepentingan kita bersama untuk bersatu secara keseluruhan dan bersatu di belakang pemerintahan yang kuat yang mendukung ide-ide radikal dan bekerja untuk kolektif secara keseluruhan. Kita akan bersatu, atau kita akan binasa dalam perpecahan."
 TUR_hunt_down_fifth_columnist_islamists: "Memburu Islamis Kolumnis Kelima"
 TUR_hunt_down_fifth_columnist_islamists_desc: "Sementara Eropa mengkhawatirkan kolumnis kelima komunis internasionalis mereka, kita telah berjuang dengan kolumnis kelima internasionalis kita sendiri sejak negara kita lahir. Tidak ada ancaman nyata yang lebih besar terhadap republik besar kita selain Islam radikal dan para pendukungnya. Kami akan menghancurkan sisa-sisa Kesultanan Ottoman ini seperti serangga."
 TUR_pivot_to_the_past: "Beralih ke Masa Lalu"
 TUR_pivot_to_the_past_desc: "Perang Kemerdekaan mungkin merupakan suatu keharusan, tetapi Republik adalah sebuah kesalahan. Atatürk tidak lagi berada di sini untuk menjaga republik sekulernya yang berharga, dan masyarakat menuntut kembalinya Kesultanan Ottoman. Kami akan menuruti mereka, setelah menumpas kaum Kemalis untuk selama-lamanya."
 TUR_purge_the_kemalists: "Bersihkan kaum Kemalis"
 TUR_purge_the_kemalists_desc: "Dengan membersihkan negara kita dari momok Kemalis, kita telah menabur benih untuk kembali ke cara hidup dan pemerintahan kita yang lama. Kembalinya Sultan tidak bisa dihindari, begitu pula kehancuran kaum republiken yang fana."
 TUR_kemalists_purged_tt: "Menghapus semua pengubah status £faction_tur_kemalist §YKemalis§!."
 TUR_restore_the_divan: "Kembalikan Dipan"
 TUR_restore_the_divan_desc: "Parlemen antek sipil yang dipilih oleh musuh kita? Tidak, kami tidak pernah bermaksud agar hal itu berlangsung lama. Sudah waktunya untuk mengembalikan cara-cara lama: kita akan mengembalikan Dipan sehingga agama menjadi pusat negara. Kita juga akan menghapuskan jabatan Perdana Menteri yang dipinjam oleh orang Barat, sudah saatnya kita mengembalikan Wazir Agung!"
 TUR_rebuilding_our_nation: "Membangun Kembali Bangsa Kita"
 TUR_rebuilding_our_nation_desc: "Kaum Kemalis menghancurkan bangsa kita dalam upaya mereka yang sia-sia untuk menekan keinginan rakyat. Musuh kita akan menganggap kita lemah, jadi kita harus membangun kembali secepat mungkin!"
 TUR_return_of_the_sultan: "Kembalinya Sultan"
 TUR_return_of_the_sultan_desc: "Ini adalah saat terakhir untuk mencapai apa yang telah kita impikan sejak lama: kita harus segera membawa pulang Sultan dari pengasingan. Para loyalis kami sudah memilikinya, dan sekarang yang tersisa hanyalah membawanya pulang dan memberinya penobatan besar."
 TUR_reclaim_macedonia: "Rebut kembali Makedonyalı Sanjak"
 TUR_reclaim_macedonia_desc: "Anjing-anjing yang tidak setia di wilayah barat kita memainkan peran penting dalam runtuhnya Kekaisaran Ottoman terakhir. Orang-orang Yunani telah membenci kami sejak kami membongkar kerajaan mereka yang menyedihkan dan sakit-sakitan - dan sekarang mereka menguasai sebagian besar Thrace dan Makedonia dari kami. Inilah saatnya untuk menyelamatkan rekan-rekan kita, sambil melakukan sedikit balas dendam di saat yang sama..."
 TUR_join_the_central_powers: "Bergabunglah kembali dengan Kekuatan Sentral"
 TUR_join_the_central_powers_desc: "Kita pernah gagal bersama sebagai sebuah perjanjian kekuatan, tapi kali ini kita tidak akan gagal! Nasib entah bagaimana telah memberikan kita kesempatan kedua untuk memperbaiki kesalahan Perang Besar, dan kita semua harus bersama-sama memanfaatkan kesempatan itu!"
 TUR_press_the_austro_hungarian_claim: "Tekan Klaim Austro-Hungaria"
 TUR_press_the_austro_hungarian_claim_desc: "Kembalinya kami dengan penuh kemenangan dari puing-puing Republik Turki memang merupakan sebuah peristiwa besar, namun kami dikelilingi oleh musuh-musuh yang akan melihat kami dihancurkan sekali lagi. Kita membutuhkan sekutu, dan ekspedisi yang dipimpin Ottoman ke Danube bukanlah hal yang belum pernah terjadi sebelumnya."
 TUR_aligning_bulgaria: "Sejajarkan Bulgaria"
 TUR_aligning_bulgaria_desc: "[BUL.GetNameDef], satu-satunya dari kita semua dari Blok Sentral yang bertahan dengan kedaulatan dan cara hidup mereka yang utuh, dan apa yang telah mereka lakukan dengan hal itu? Tidak ada apa-apa. Mereka pengecut! Kita akan melihat betapa pengecutnya mereka ketika kita membiarkan mereka melakukan tugas mereka."
 TUR_reclaiming_our_lost_empire: "Rebut kembali Kekaisaran yang Jatuh"
 TUR_reclaiming_our_lost_empire_desc: "Menyingkirkan kaum Kemalis dari kekuasaan dan memulihkan otoritas Sultan hanyalah langkah awal menuju rencana induk kami. Kami akan berbaris melintasi seluruh dunia sampai kerajaan kami utuh kembali!"
 TUR_expanding_the_saadabad_pact: "Perluas Pakta Saadabad"
 TUR_expanding_the_saadabad_pact_desc: "Pakta Saadabad merupakan inisiatif yang berharga dari kaum Kemalis, namun kini kita memiliki lebih banyak kesamaan dengan para penandatangan dibandingkan sebelumnya. Jangan kita buang waktu dengan setengah-setengah, sekarang saatnya kita melakukan pendekatan kepada anggota Pakta Saadabad agar kita bisa meresmikan perjanjian ini menjadi aliansi yang tepat."
 TUR_saadabad_pact_faction_tt: "Kami akan mengundang semua penandatangan §YPakta Saadabad§! ke dalam aliansi formal."
 TUR_no_faction_members_tt: "Pakta Saadabad tidak memiliki penandatangan"
 TUR_no_faction_alliance_members_tt: "Para penandatangan Pakta Saadabad belum meratifikasi Konkordat Saadabad"
 TUR_the_damascus_diktat: "Diktat Damaskus"
 TUR_the_damascus_diktat_desc: "[677.Controller.GetNameDefCap] lemah. Yang perlu kita lakukan hanyalah mengancam kemungkinan perang jika mereka tidak menyerahkan Suriah, dan mereka akan berlutut sambil menyerukan perdamaian dan memohon agar kita mengambil alih Suriah dari tangan mereka."
 TUR_supporting_the_east: "Mendukung Timur"
 TUR_supporting_the_east_desc: "Negara-negara bagian kami di wilayah timurlah yang menjadi tulang punggung dukungan kami, namun kualitas infrastruktur di negara-negara bagian ini dibandingkan dengan provinsi-provinsi perkotaan di wilayah barat sangatlah buruk. Dengan mendukung wilayah timur, kami mendukung pengikut kami dan juga lebih mempersiapkan diri untuk melakukan operasi di timur dan utara."
 TUR_desert_camel_corps: "Korps Unta Gurun"
 TUR_desert_camel_corps_desc: "Jika kita ingin melakukan operasi yang sulit dan memakan waktu lama di Timur Tengah dan Afrika, maka sangatlah tidak masuk akal jika kita tidak mereformasi pasukan unta kita! Dengan unta kami, kami dapat berkendara dari Kairo ke Cape Town dengan nyaman dan penuh gaya!"
 TUR_unlock_camelry_effect_tt: "Tambahkan teknologi: §YUnit Unta§!."
 TUR_the_pan_national_association_of_ulemas: "Persatuan Ulama Pan-Nasional"
 TUR_the_pan_national_association_of_ulemas_desc: "Gerakan kami bukanlah gerakan nasional: kami tidak sekadar membela otoritas Sultan, namun juga membela otoritas umat Islam di seluruh dunia. Kami tidak menganut nasionalisme, karena kami percaya pada tujuan internasional Islam! Kami akan bekerja sama dengan para pemimpin agama dari seluruh dunia untuk menentukan cara terbaik untuk menyebarkan dan membebaskan umat agama kami dengan pedang."
 TUR_reinstate_the_darulfununu_sahane: "Aktifkan kembali Darülfünûn-u Şahâne"
 TUR_reinstate_the_darulfununu_sahane_desc: "Kami tidak ragu untuk mengatakan bahwa banyak dari institusi kami... tidak sepenuhnya modern. Namun, kita hidup di zaman peperangan modern. Merupakan hal yang baik bahwa negara kita sudah maju dan modern - semua berkat kerja keras Birokrasi Ottoman! Untuk mencapai tujuan tersebut, kami akan mendirikan sebuah sekolah di Universitas Istanbul yang mendorong kerja sama teknis dan ilmiah antara kami dan negara-negara yang memiliki pemikiran serupa."
 TUR_imperial_factories: "Pabrik Kekaisaran"
 TUR_imperial_factories_desc: "Kaum Kemalis mempunyai gagasan menarik yang disebut 'Etatisme', dan meskipun kita tidak akan pernah secara terbuka mensponsori pilar ideologi Kemalis, kita pasti merasa bahwa mungkin... bijaksana untuk mengatur dan mengendalikan alat-alat produksi negara secara terpusat. Jangan membandingkannya dengan komunisme atau fasisme: semua pabrik akan menjadi milik Sultan – kami akan mengelola pabrik-pabrik ini atas namanya!"
 TUR_refining_our_strategies: "Menyempurnakan Strategi Kami"
 TUR_refining_our_strategies_desc: "Kita telah belajar banyak tentang peperangan sejak kejatuhan kita dalam Perang Besar, dan kita tidak boleh lagi memulai rencana-rencana gila yang kita tidak punya harapan untuk menang. Kita harus berjuang dengan cerdas dan konservatif, sehingga ketika semua pertempuran berhenti dan keadaan sudah tenang, kitalah pemenang yang masih berdiri."
 TUR_the_red_apples_of_sevres: "Apel Merah Sèvres"
 TUR_the_red_apples_of_sevres_desc: "Paris, Roma, London: ini adalah kızıl elma dari Kekaisaran Ottoman yang dipulihkan. Kami tidak akan berhenti untuk memastikan musuh lama kami – yang sudah melihat kami dibongkar, dihina, dan dihancurkan – direndahkan, dibengkokkan, dan kemudian dihancurkan karena rencana jahat mereka terhadap wilayah kami. Kita akan membakar tatanan dunia lama dan membangun status quo baru di atas reruntuhan kerajaan mereka."
 TUR_realize_the_nightmare_of_meiji: "Sadarilah Mimpi Buruk Meiji"
 TUR_realize_the_nightmare_of_meiji_desc: "Sultan Abdul Hamid II dulu takut kaisar Jepang akan masuk Islam dan menyatakan diri mereka sebagai Khalifah menggantikan raja Turki. Hal ini tidak pernah terjadi. Sayangnya, Jepang menandatangani Sèvres, sama seperti mereka menandatangani Lausanne - meskipun kita sudah lama mengagumi Jepang, mereka sama bersalahnya dengan negara-negara lama lainnya. Kami akan merendahkan mereka dengan memerintah Khedivate Nihon langsung dari Kostantiniye."
 TUR_continue_to_prioritise_balkan_integrity: "Terus Mengutamakan Integritas Balkan"
 TUR_continue_to_prioritise_balkan_integrity_desc: "Kami selalu berkepentingan agar perdamaian tercipta di Balkan. Kita harus mengakui bahwa kita merasa bertanggung jawab untuk melindungi dan meninggikan sesama kita, terutama mengingat... masa lalu kita yang tidak menguntungkan. Saatnya sudah berlalu: kita tidak lagi bertindak sebagai penakluk, namun sebagai teman setia yang bermaksud melindungi tetangga kita yang lebih lemah dari penakluk baru yang ingin mencelakakan mereka."
 TUR_reaffirm_the_balkan_pact: "Reformasi Pakta Balkan"
 TUR_reaffirm_the_balkan_pact_desc: "Pakta Balkan dibentuk untuk mencegah iredentisme Bulgaria dan Hongaria, namun dunia menjadi jauh lebih berbahaya sejak saat itu. Pakta Balkan tidak memadai, kita harus mereformasinya menjadi Balkan Entente!"
 TUR_balkan_defense_council: "Dewan Pertahanan Balkan"
 TUR_balkan_defense_council_desc: "Setiap negara di Balkan Entente mengenal perang seperti teman lama. Kita secara kolektif tahu bahwa kita tidak bisa memulai perang dengan menyerang, jadi kita harus berkoordinasi bersama untuk membentuk pertahanan terbaik."
 TUR_balkan_defense_council_tt: "Setelah §YPakta Balkan§! telah diratifikasi menjadi sebuah aliansi, kita dapat berkoordinasi tentang cara terbaik untuk mempertahankan diri dari agresi asing."
 TUR_three_year_industrial_plan: "Rencana Industri Tiga Tahun"
 TUR_three_year_industrial_plan_desc: "Kami siap menjalani upaya industrialisasi di seluruh semenanjung yang bahkan dapat membuat takut [ENG.GetNameDef]. Kita akan saling mendukung secara setara, dan bersama-sama kita akan mengatasi kekuatan musuh-musuh kita melalui kekuatan kolektif Entente Balkan!"
 TUR_united_against_imperialism: "Front Persatuan Melawan Imperialisme"
 TUR_united_against_imperialism_desc: "Kita semua telah menjadi korban intrik kekuasaan yang lebih besar dari kita. Terlalu sering kita diintimidasi dengan perjanjian dan kesepakatan yang mempermalukan dan melemahkan kita. Kami mengatakan bahwa dunia tidak lagi seperti dulu dan kami tidak akan pernah lagi menjadi sasaran pelecehan imperialis!"
 TUR_united_against_imperialism_tt: "Perubahan popularitas Demokrasi atau Tidak Sejajar untuk negara-negara §YPakta Balkan§!: §G10%§!."
 TUR_create_the_balkan_central_bank: "Bentuk Bank Sentral Balkan"
 TUR_create_the_balkan_central_bank_desc: "Kita akan mengadopsi mata uang baru yang digunakan bersama oleh semua negara kita bersama dengan mata uang nasional kita, dan mendirikan bank sentral baru yang melaluinya kita semua dapat menukarkan alat pembayaran yang sah dan terlibat dalam urusan bisnis. Apa yang mungkin salah?"
 TUR_the_treaty_for_prosperity_and_trade: "Perjanjian untuk Kemakmuran dan Perdagangan"
 TUR_the_treaty_for_prosperity_and_trade_desc: "Kami akan mempelopori perjanjian kolektif yang mempromosikan perdagangan bebas berdasarkan prinsip liberalisme pasar bebas. Kita tidak bisa mengharapkan semua negara anggota untuk sepenuhnya mengkonfigurasi ulang perekonomian mereka untuk memungkinkan perdagangan bebas, tapi setidaknya kita bisa mengakhiri proteksionisme di Balkan."
 TUR_joint_budgets_on_fortifications: "Anggaran Bersama untuk Benteng"
 TUR_joint_budgets_on_fortifications_desc: "Garis benteng telah lama menjadi inti dari sebagian besar doktrin pertahanan, dan meskipun beberapa orang saat ini berpendapat bahwa strategi semacam itu sudah ketinggalan zaman oleh teknologi modern, kami yakin bahwa benteng tersebut mungkin masih berguna. Dengan saling mendukung pertahanan satu sama lain, kita menjamin keselamatan kolektif kita."
 TUR_connecting_our_capitals: "Menghubungkan Ibu Kota Kita"
 TUR_connecting_our_capitals_desc: "Agar pasukan kita dapat bergerak dengan lancar dari garis depan ke garis depan, kita harus memiliki infrastruktur yang efisien di seluruh Semenanjung Balkan. Kami akan bekerja sama dengan mitra kami untuk memastikan sebaik mungkin bahwa ibu kota kami terhubung dengan infrastruktur modern."
 TUR_connect_capitals_greece_tt: "Karena §YYunani§! telah melaksanakan proyek infrastruktur atas kemauannya sendiri, maka negara tersebut akan menerima infrastruktur tambahan."
 TUR_connect_capitals_romania_tt: "Karena §YRumania§! telah melaksanakan proyek infrastruktur atas kemauannya sendiri, maka negara tersebut akan menerima infrastruktur tambahan."
 TUR_connect_capitals_yugoslavia_tt: "Karena §YYugoslavia§! telah melaksanakan proyek infrastruktur atas kemauannya sendiri, maka negara tersebut akan menerima infrastruktur tambahan."
 TUR_fortifying_contentious_areas: "Membentengi Daerah yang Bersengketa"
 TUR_fortifying_contentious_areas_desc: "Bukan tanpa alasan Balkan disebut sebagai Powderkegnya Eropa. Di setiap negara kita, terdapat setidaknya satu potensi konflik dengan kekuatan yang lebih besar. Adalah tugas kita untuk memastikan titik-titik konflik ini dipertahankan dan dibentengi secara memadai."
 TUR_fortify_the_south_tt: "Menambahkan §Y2 benteng darat§! pada setiap penyeberangan dari §Y[164.GetName]§!."
 TUR_fortify_the_north_tt: "Menambahkan garis pertahanan §Ytanah benteng§! di §Y[354.GetName]§!."
 TUR_fortify_the_east_tt: "Menambah §Y5 benteng darat§! di perbatasan timur §Y[800.GetName]§!."
 TUR_integrated_armed_forces: "Angkatan Bersenjata Terpadu"
 TUR_integrated_armed_forces_desc: "Ini adalah program yang ambisius, namun kami telah memutuskan bahwa program ini layak untuk dilaksanakan. Mengingat kesulitan yang dihadapi negara-negara kecil ketika menghadapi kekuatan besar, kami memutuskan untuk mempelopori organisasi angkatan bersenjata multinasional Balkan Entente. Kita harus menyediakan sumber daya satu sama lain jika diperlukan sehingga ketika kita bersatu, kita tidak akan padam seperti lilin oleh kaum imperialis."
 TUR_the_balkan_academy_of_science: "Akademi Sains Balkan"
 TUR_the_balkan_academy_of_science_desc: "Kita hidup di zaman ilmu pengetahuan dan inovasi, dan kita tidak boleh membiarkan diri kita atau anggota Entente Balkan lainnya tertinggal terlalu jauh dari pencapaian teknis negara-negara industri yang lebih besar."
 TUR_extend_an_olive_branch_to_bulgaria: "Perluas Ranting Zaitun ke Bulgaria"
 TUR_extend_an_olive_branch_to_bulgaria_desc: "Pakta Balkan dibentuk untuk melawan revanchisme Bulgaria, namun dunia telah melahirkan monster yang jauh lebih buruk pada tahun-tahun berikutnya. Bulgaria, seperti kita, hanyalah pion bagi kaum imperialis untuk bermanuver dalam mengejar dominasi kekaisaran. Kita harus menawarkan bantuan – membiarkan mereka menggabungkan kekuatan mereka dengan kekuatan kita sehingga kita semua dapat keluar dari konflik ini dengan perbatasan dan moral kita yang masih utuh."
 TUR_preempt_bulgarian_alignment: "Mencegah Penyelarasan Bulgaria"
 TUR_preempt_bulgarian_alignment_desc: "Prusia di Balkan mungkin merupakan negara dengan kekuatan yang lebih kecil seperti kita, namun mereka mempunyai rasa lapar dan ambisi yang sama dengan kekuatan yang sangat besar. Bisakah kita meragukan sejenak bahwa orang-orang Bulgaria tidak akan menikam kita dari belakang demi keuntungan pribadi mereka begitu ada kesempatan? Jawabannya adalah tidak, dan hanya menyisakan satu solusi: Bulgaria harus dihancurkan."
 TUR_peninsular_network_of_factories: "Jaringan Pabrik Semenanjung"
 TUR_peninsular_network_of_factories_desc: "Sendirian, tidak seorang pun dari kita dapat melawan negara-negara yang lebih besar dan maju seperti [GER.GetNameDef] dan [SOV.GetNameDef], namun bersama-sama - dengan kita semua mengumpulkan sumber daya untuk memaksimalkan seluruh potensi kita? Itu akan membuat kita menjadi kekuatan besar dalam diri kita sendiri."
 TUR_combined_operational_strategies: "Strategi Operasional Gabungan"
 TUR_combined_operational_strategies_desc: "Dengan berkolaborasi secara lebih mendalam dalam hal strategi dan pertahanan, kita dapat menjamin keamanan seluruh wilayah kita – bahkan dalam menghadapi rintangan yang sangat besar."
 TUR_edirne_research_exchange: "Pertukaran Penelitian Edirne"
 TUR_edirne_research_exchange_desc: "Kami akan mengambil inisiatif dan membentuk lembaga publik yang mendorong aliran ide multinasional yang bebas sehingga kami dapat berdiri di garis depan dalam semua kemajuan teknologi dan ilmu pengetahuan terkini dalam Pakta Balkan."
 TUR_crush_the_warmongers_in_rome: "Hancurkan Penghasut Perang di Roma"
 TUR_crush_the_warmongers_in_rome_desc: "[ITA.GetAdjective]s adalah sumber segala kesengsaraan di Mediterania. Mereka adalah tumor jahat yang diyakini dapat menyebar ke Eropa Selatan seperti kanker dengan kekuatan yang besar. Kami akan melakukan perlawanan terhadap mereka dan memberi mereka begitu banyak dosis obat mereka sendiri sehingga mereka tersedak karenanya."
 TUR_brace_against_the_red_menace: "[GetBraceAgainstTheRedMenaceName]"
 TUR_brace_against_the_red_menace_desc: "[GetBraceAgainstTheRedMenaceDesc]"
 TUR_brace_against_the_red_menace_communism: "Bersiap Melawan Ancaman Merah"
 TUR_brace_against_the_red_menace_communism_desc: "Di wilayah utara terdapat ancaman jahat dari komunisme dan sponsor utamanya di dunia. [SOV.GetNameDef] adalah penyakit cacar di dunia ini, dan Entente Balkan akan memberikan manfaat bagi umat manusia dengan menghilangkan hegemoni [SOV.GetAdjective]."
 TUR_brace_against_the_red_menace_generic: "Bersiap Melawan Ancaman [SOV.GetAdjective]"
 TUR_brace_against_the_red_menace_generic_desc: "Di sebelah utara terletak Rusia yang durhaka. Selamanya mereka mencoba mencampuri urusan Balkan dan Turki. Entente Balkan akan membantu umat manusia dengan menghilangkan hegemoni [SOV.GetAdjective]."
 TUR_reconfigure_our_foreign_policy: "Konfigurasi Ulang Kebijakan Luar Negeri Turki"
 TUR_reconfigure_our_foreign_policy_desc: "[TUR.GetAdjective] kebijakan luar negeri selama ini terfokus pada urusan dalam negeri dan interaksi kebijakan luar negeri sebagian besar diserahkan kepada negara tetangga kita, namun zaman telah berubah dan kebijakan luar negeri kita harus mencerminkan hal tersebut. Sudah lama terlambat bagi kita untuk mulai lebih banyak berhubungan dengan negara-negara besar di dunia."
 TUR_the_anglo_turkish_agreement: "Perjanjian Inggris-Turki"
 TUR_the_anglo_turkish_agreement_desc: "Pemerintah [ENG.GetAdjective] sangat ingin menandatangani perjanjian dengan kami: sebuah perjanjian yang, pada dasarnya, mengharuskan kami untuk tidak berjanji apa pun kecuali akan memaksa [ENG.GetNameDef] untuk segera membantu kami jika terjadi invasi. Semuanya berbau keputusasaan, tapi kita bisa menggunakan keputusasaan."
 TUR_add_medium_tank_technology_tt: "Tambahkan teknologi: §YBasic Medium Tank§!."
 TUR_applying_british_oil_embargoes_on_iraq: "Menerapkan Embargo Minyak [ENG.GetAdjective] di Irak"
 TUR_applying_british_oil_embargoes_on_iraq_desc: "[ENG.GetAdjective] bertekad untuk menghentikan pengiriman minyak [IRQ.GetAdjective] mencapai musuh kontinental mereka tetapi sebagian besar tidak berhasil. Kita dapat mendukung inisiatif [ENG.GetAdjective] dengan memblokir salah satu jalur darat terbesar yang dilalui [IRQ.GetAdjective] untuk berdagang di Eropa."
 TUR_host_exiled_scientists: "Tuan Rumah Ilmuwan yang Diasingkan"
 TUR_host_exiled_scientists_desc: "Begitu banyak negara yang dipimpin oleh orang-orang bodoh yang rela membuang pikiran-pikiran terbaik dan tercemerlang mereka hanya karena para ilmuwan tersebut tidak mau menjalankan agenda tirani. Kami akan menawarkan rumah kepada orang-orang buangan di sini di [TUR.GetNameDef], karena kami sangat membutuhkan mereka."
 TUR_the_chester_concession: "Konsesi Chester"
 TUR_the_chester_concession_desc: "Kami tetap berhak atas konsesi yang dijanjikan Amerika lebih dari satu dekade lalu. Kita dapat menjadikan keterlibatan kita dalam perang ini sebagai kewajiban atas kontribusi Amerika terhadap kesejahteraan negara bagian [TUR.GetAdjective]."
 TUR_raise_opinion_of_america_tt: "Semakin tinggi opini §YAmerika Serikat§! terhadap kami, semakin besar kemungkinan konsesi tersebut akan disetujui."
 TUR_american_motor_factories: "Pabrik Motor Amerika"
 TUR_american_motor_factories_desc: "Sebagian besar industri berat kita yang terkait dengan produksi kendaraan bermotor bergantung pada kerja sama dengan Amerika. Kita tidak selalu menjadi negara yang paling toleran dalam hal investasi asing, tapi jika kita melonggarkan peraturan untuk teman-teman Amerika kita... yah... siapa yang bisa mengatakan apa yang mungkin terjadi?"
 TUR_bomber_schematics: "Skema Pengebom"
 TUR_bomber_schematics_desc: "Kita tidak hanya bisa mempertahankan langit kita sendiri di masa perang, kita harus mampu menyerang jantung musuh kita sehingga perang dapat segera diakhiri. Sekutu ahli dalam menggunakan bom sebagai alat untuk menjatuhkan musuh-musuhnya, dan ada banyak hal yang dapat kita pelajari dari mereka."
 TUR_join_the_allies: "Bergabunglah dengan Sekutu"
 TUR_join_the_allies_desc: "Dunia telah mencapai momen takdir, dan kita berada di persimpangan banyak kerajaan yang berlomba-lomba mengubah dunia selamanya. Kita harus membela nilai-nilai yang mendasari negara kita, dan berperang dengan negara-negara Barat atas nama kebebasan dan kebebasan."
 TUR_controlling_the_skies_of_europe: "Mengontrol Langit"
 TUR_controlling_the_skies_of_europe_desc: "Daya tembak yang unggul adalah cara kita memenangkan perang, dan kita harus menjadi kontributor aktif dalam upaya perang dengan menambahkan daya tembak kita sendiri dalam perjuangan untuk mendominasi langit."
 TUR_expanding_our_navy: "Perluas Angkatan Laut Kita"
 TUR_expanding_our_navy_desc: "Kita berjuang bersama beberapa kekuatan angkatan laut global yang terkemuka, dan kita harus banyak belajar dari mereka. Pada akhir perang, angkatan laut kita akan dipuji di antara yang terhebat."
 TUR_the_petra_proposal: "Usulan Petra"
 TUR_the_petra_proposal_desc: "Penasihat kami telah membuat rencana yang membuat kami bertanggung jawab untuk melindungi dan mengatur protektorat [ENG.GetAdjective] di Levant. Strategi dan proposalnya sudah bagus, dan sekarang yang tersisa hanyalah menyampaikannya ke [ENG.GetAdjective]."
 TUR_expanded_credit_on_our_debts: "Kredit yang Diperluas atas Hutang Kami"
 TUR_expanded_credit_on_our_debts_desc: "Betapa beruntungnya kita bisa bersekutu dengan banyak negara dimana kita berhutang banyak! Tentunya partisipasi kita dalam konflik ini merupakan alasan yang cukup untuk menghapuskan sebagian besar utang tersebut, tentu saja semua atas nama perjuangan kita bersama demi kebebasan."
 TUR_partnership_pact_with_bulgaria: "Pakta Kemitraan dengan Bulgaria"
 TUR_partnership_pact_with_bulgaria_desc: "Adalah bijaksana untuk tidak menghakimi orang [BUL.GetAdjective] terlalu keras agar mereka tidak jatuh ke pelukan musuh. Mari kita tawarkan mereka alternatif: kesempatan untuk berpihak pada kebebasan dan keadilan, dibandingkan otokrasi dan korupsi."
 TUR_seizing_the_romanian_oil_fields: "Merebut Ladang Minyak Rumania"
 TUR_seizing_the_romanian_oil_fields_desc: "Ladang minyak Rumania merupakan wilayah penting untuk upaya perang [GER.GetFactionName]. Memotong pasokan minyak [ROM.GetNameDef] sama seperti menghentikan aliran darah ke jantung."
 TUR_securing_iran: "Mengamankan Iran"
 TUR_securing_iran_desc: "Jika [PER.GetAdjective] tidak mengatur perdagangan minyak mereka sehingga tidak mencapai cadangan musuh kita, maka kita akan secara paksa mengatur sumber daya mereka untuk mereka."
 TUR_british_dockyards_in_turkey: "Galangan Kapal Inggris di Turki"
 TUR_british_dockyards_in_turkey_desc: "Pantai kami panjang dan membentang hampir di seluruh negara kami. Ada banyak real estat gratis di sini untuk industri pembuatan kapal dan [ENG.GetAdjective] menyadari hal ini. Kita akan menerima tawaran mereka untuk memperkuat industri angkatan laut kita agar upaya perang lebih menguntungkan kita bersama."
 TUR_taking_over_defense_of_the_gulf: "Mengambil alih Pertahanan Teluk"
 TUR_taking_over_defense_of_the_gulf_desc: "Kita dapat mengurangi sedikit tekanan terhadap sekutu [ENG.GetAdjective] kita dengan menawarkan untuk menjaga harta benda mereka di Timur Tengah. Kemungkinan besar mereka akan menyetujui saran tersebut, terutama mengingat semua kontribusi kita dalam upaya perang... dan fakta bahwa mereka tidak mampu menghentikan kita untuk sekadar merebut wilayah tersebut."
 TUR_we_must_not_fall: "Kita Tidak Harus Jatuh!"
 TUR_we_must_not_fall_desc: "Kita tidak berjuang mati-matian sebagai sebuah bangsa selama Perang Kemerdekaan hanya untuk dimusnahkan beberapa dekade kemudian. Tidak, kisah [TUR.GetNameDef] tidak berakhir di sini - kita tidak boleh jatuh, kita tidak akan jatuh!"
 TUR_the_german_turkish_friendship_treaty: "Perjanjian Persahabatan Jerman-Turki"
 TUR_the_german_turkish_friendship_treaty_desc: "[GER.GetNameDefCap] dan [ROOT.GetNameDef] adalah teman alami. Kita tidak harus saling berhadapan dalam setiap isu, karena sejarah kita saat ini tidak terlalu berbeda. Upaya [ENG.GetAdjective] untuk mengendalikan kebijakan luar negeri kita akan sia-sia: kita harus membuktikannya dengan Perjanjian Persahabatan baru, yang ditandatangani secara sepihak antara [GER.GetLeader] dan [ROOT.GetLeader]."
 TUR_the_clodius_agreement: "Perjanjian Clodius"
 TUR_the_clodius_agreement_desc: "[GER.GetAdjective] telah mendekati kita dengan kesepakatan yang menguntungkan: bijih kromium sebagai imbalan atas sarana untuk memproduksi lebih banyak peralatan militer milik kita sendiri. Dengan menjadi sumber utama bijih kromium [GER.GetNameDef], kami juga berhak atas perlindungan [GER.GetNameDef] yang merupakan posisi yang patut ditiru saat ini."
 TUR_clodius_agreement_tt: "Setiap negara bagian yang memproduksi §Y65§! atau lebih unit §YChromium§! akan menerima tiga tingkat §YInfrastruktur§! dan dua §YPabrik Militer§!."
 TUR_purchase_italian_light_tanks: "Beli Tank Ringan Italia"
 TUR_purchase_italian_light_tanks_desc: "Anda tidak dapat memiliki angkatan bersenjata modern tanpa baju besi yang kuat dan andal yang mendukung tulang punggung angkatan bersenjata. Kita hanya perlu memilikinya sendiri, dan apakah ada keraguan bahwa tank terhebat yang diproduksi di dunia berasal dari [ITA.GetNameDef]?"
 TUR_approve_the_funkplan: "Setujui rencana Funk"
 TUR_approve_the_funkplan_desc: "Ketika Schachtplan diluncurkan di seluruh Eropa Selatan, kami tidak berpartisipasi dalam skema tersebut. Situasi telah berubah, dan kami siap memperdalam hubungan ekonomi kami dengan [GER.GetNameDef]. [GER.GetAdjective] ekonom Walther Funk telah menyusun skema yang dirancang khusus untuk situasi kita, dan bodoh sekali jika kita tidak menerapkan skema ini sesegera mungkin."
 TUR_the_italo_turkish_naval_academy: "Akademi Angkatan Laut Italia-Turki"
 TUR_the_italo_turkish_naval_academy_desc: "[ITA.GetAdjective] adalah penguasa lautan yang tak terbantahkan. Ada banyak hal yang bisa kita pelajari dari mereka jika mereka mau mengajari kita."
 TUR_invite_german_officers_to_izmir: "Undang Petugas Jerman ke [339.GetName]"
 TUR_invite_german_officers_to_izmir_desc: "[GER.GetAdjective] penasihat militer membuat iri dunia. Untuk memodernisasi militer dan taktiknya, kita harus menggunakan bantuan masyarakat yang memiliki angkatan bersenjata paling modern di Eropa."
 TUR_the_mediterranean_entente: "Entente Mediterania"
 TUR_the_mediterranean_entente_desc: "Kita harus merundingkan aliansi pan-Mediterania yang komprehensif dan bertanggung jawab atas keamanan kawasan. Setiap proyek yang bertujuan untuk mengendalikan Mediterania yang tidak dimulai dengan tangan terbuka hingga [ITA.GetNameDef] pasti akan gagal."
 TUR_join_the_axis: "Bergabunglah dengan Poros"
 TUR_join_the_axis_desc: "Masa depan [ROOT.GetNameDef] sangat jelas terletak pada bangsa yang akan mengubah nasib dunia. Tidak ada negara yang siap untuk menggoyahkan status quo lama dan menghadirkan era baru yang damai dan sejahtera seperti [GER.GetNameDef]. Kita harus membantu mereka mewujudkan visi mereka untuk masa depan."
 TUR_invite_bulgaria: "Undang Bulgaria"
 TUR_invite_bulgaria_desc: "[BUL.GetNameDefCap] sudah terlalu lama berada di pinggir lapangan. Masa depan mereka dengan [GER.GetNameDef] tidak diragukan lagi, hanya ketika mereka akhirnya menyatakan kesetiaannya. Kami akan membantu [BUL.GetAdjective] menemukan keberanian mereka."
 TUR_entice_the_greeks: "Pikat orang-orang Yunani"
 TUR_entice_the_greeks_desc: "Perdamaian dengan [GRE.GetNameDef] telah menjadi sesuatu yang telah dikerjakan dengan sangat keras oleh pemerintahan kita sejak runtuhnya Kekaisaran Ottoman. Kita tidak punya alasan untuk membuang upaya diplomasi yang telah dilakukan selama puluhan tahun, namun jika kita berada di pihak yang berlawanan dalam perang ini, maka hal itu bisa saja berubah. Mari kita berharap mereka mendengarkan kebijaksanaan, dan tidak menyia-nyiakan masa depan mereka dengan sia-sia."
 TUR_carve_up_greece: "Mengukir Yunani"
 TUR_carve_up_greece_desc: "Kami sangat kecewa karena sepertinya tidak ada masa depan bagi [GRE.GetNameDef] untuk keluar dari era ini sebagai negara yang masih merdeka. Tidak ada permusuhan dalam keputusan ini, kami hanya melakukan apa yang harus dilakukan demi kelangsungan hidup. Perdamaian akan kembali berkuasa di Laut Aegea, namun tidak di era yang kejam dan tak kenal ampun ini."
 TUR_pressure_portugal_to_join: "Menekan Portugal untuk Bergabung"
 TUR_pressure_portugal_to_join_desc: "[POR.GetNameDefCap] secara teknis mungkin tidak berbatasan dengan Mediterania, namun memiliki pengaruh besar terhadap masa depan kawasan tersebut. Kita membutuhkan kerajaan mereka yang besar, dan mereka akan mendapatkan banyak manfaat dari teman-teman seperti kita."
 TUR_collaborative_civil_works_programme: "Program Pekerjaan Sipil Kolaboratif"
 TUR_collaborative_civil_works_programme_desc: "Jika itu murni sampai [ITA.GetNameDef], yang akan dilakukan semua orang di aliansi kita hanyalah menaklukkan dan menundukkan bangsa lain. Kami berperan sebagai pemberi suara dalam aspek-aspek pemerintahan lainnya: apakah tidak ada seorang pun yang mempertimbangkan tingkat lapangan kerja atau perekonomian pascaperang? Kita harus mengumpulkan sumber daya kita dan bekerja sama untuk membangun masa depan yang lebih baik dan layak menerima semua pertumpahan darah ini."
 TUR_fortifying_the_bosporus: "Memperkuat Bosporus"
 TUR_fortifying_the_bosporus_desc: "Bosporus terletak sebagai pintu gerbang antara Laut Hitam dan Laut Mediterania. Terusan Suez dijaga ketat, begitu pula pintu masuk ke Selat Gibraltar. Apakah masuk akal jika kita membiarkan wilayah kita sendiri tidak terlindungi dan terbuka untuk dianiaya oleh kekuatan asing? Tidak. Kami akan bekerja keras untuk mempertahankan apa yang menjadi milik kami."
 TUR_fortifying_the_bosporus_istanbul_tt: "Menambahkan §Y3 benteng darat§! di dalam kota."
 TUR_fortifying_the_bosporus_edirne_tt: "Menambahkan serangkaian §Ybenteng darat§! tingkat dua di sepanjang §YSelat Turki§!."
 TUR_mediterranean_merchant_fleet: "Armada Pedagang Mediterania"
 TUR_mediterranean_merchant_fleet_desc: "Konvoi adalah garis keturunan faksi ini, dan kita semua harus melakukan upaya kolektif yang lebih baik untuk meningkatkan jumlah konvoi yang kita miliki. Tentu saja, jika armada dagang baru ini juga digunakan sebagai sarana rahasia untuk berbagi informasi tambahan tentang penelitian angkatan laut, maka hal ini mungkin akan menjadi upaya yang bermanfaat."
 TUR_court_the_spanish: "Mengajak orang Spanyol"
 TUR_court_the_spanish_desc: "Bukan rahasia lagi bahwa pemimpin Spanyol bersimpati kepada faksi kami dan apa yang diwakilinya. Tawaran persahabatan yang sederhana dan janji-janji samar mengenai keuntungan di masa depan sudah cukup untuk membuat mereka lebih berkomitmen pada pihak kita."
 TUR_cleanse_iberia_of_bolshevism: "Bersihkan Iberia dari Bolshevisme"
 TUR_cleanse_iberia_of_bolshevism_desc: "Hilangnya perjuangan Nasionalis selama Perang Saudara Spanyol sungguh sebuah kebiadaban! Itu salah; sebuah penyimpangan keadilan dan kegagalan tragis perjuangan fasis. Kita harus memperbaiki kesalahan di masa lalu melalui kekerasan."
 TUR_end_the_british_hegemony: "Akhiri Hegemoni Inggris"
 TUR_end_the_british_hegemony_desc: "Dunia ini tidak akan pernah damai sampai pemerintahan [ENG.GetAdjective] yang jahat dan abadi berakhir dengan kekerasan dan definitif. Ini bukan perang, ini tugas."
 TUR_punish_french_weakness: "Menghukum Kelemahan Prancis"
 TUR_punish_french_weakness_desc: "Tiga warna [FRA.GetAdjective] pernah terbang melintasi separuh Eropa pada zaman Napoleon. Saat ini, bahkan tidak layak untuk terbang di atas Paris. Sudah waktunya untuk mengakhiri rasa malu global yang dikenal sebagai bangsa '[FRA.GetNameDef]'."
 TUR_victory_or_death_against_communism: "[GetVictoryOrDeathAgainstCommunismName]"
 TUR_victory_or_death_against_communism_desc: "[GetVictoryOrDeathAgainstCommunismDesc]"
 TUR_victory_or_death_against_communism_communism: "Kemenangan atau Kematian Melawan Komunisme"
 TUR_victory_or_death_against_communism_communism_desc: "Perjuangan global melawan komunisme adalah perjuangan yang benar. Pertarungan ini lebih dari sekadar ideologi sederhana: kita berjuang demi cara hidup kita melawan monolit mengerikan yang menghancurkan apa pun yang disentuhnya. Kami tidak boleh kalah."
 TUR_victory_or_death_against_communism_generic: "Kemenangan Melawan Imperialisme Rusia"
 TUR_victory_or_death_against_communism_generic_desc: "Perjuangan global melawan imperialisme [SOG.GetAdjective] adalah perjuangan yang benar. Perjuangan ini lebih dari sekedar pertikaian perbatasan: kita berjuang demi cara hidup kita melawan kerajaan ekspansionis yang mengerikan yang menghancurkan segala sesuatu yang disentuhnya. Kami tidak boleh kalah."
 TUR_increase_german_military_aid: "Tingkatkan Bantuan Militer Jerman"
 TUR_increase_german_military_aid_desc: "Jika [GER.GetAdjective] mengharapkan kita untuk mengikuti kemajuan mereka di garis depan, maka mereka perlu berbagi sejumlah teknologi yang telah mereka kumpulkan selama bertahun-tahun. Tentu saja, kami ingin berjuang dalam kapasitas yang lebih intensif - namun bantuan [GER.GetAdjective] bisa sangat membantu dalam memfasilitasi keinginan tersebut."
 TUR_cooperative_research_centers: "Pusat Penelitian Koperasi"
 TUR_cooperative_research_centers_desc: "Perang ini akan dimenangkan oleh negara dengan kemampuan teknologi terhebat. Fasisme adalah keyakinan masa depan, jadi masuk akal jika kita hanya memerlukan teknologi paling modern untuk melancarkan peperangan."
 TUR_the_tuz_golu_training_facility: "Fasilitas Pelatihan Tuz Gölü"
 TUR_the_tuz_golu_training_facility_desc: "Iklim Mediterania di negara kita bukanlah lingkungan yang cocok untuk melatih tentara kita sehingga mereka dapat beroperasi dengan baik di iklim kering. Kami telah memilih untuk mendirikan fasilitas pelatihan di dekat danau garam Tuz Gölü, sehingga pasukan kami dapat lebih siap berperang di lingkungan kering."
 TUR_pack_for_a_long_winter: "Berkemas untuk Musim Dingin yang Panjang"
 TUR_pack_for_a_long_winter_desc: "Bukanlah tugas yang mudah untuk meniru kondisi dingin yang dialami Eurasia, namun kita terpaksa harus melakukannya. Kami telah memilih untuk membangun fasilitas di puncak Gunung Palandöken di Erzurum dengan fasilitas tambahan yang lebih kecil yang berbasis di sekitar Gunung Ağrı sehingga pasukan kami dapat berlatih dalam kondisi pegunungan dan gletser sepanjang tahun."
 TUR_support_the_golden_square: "Dukung Lapangan Emas"
 TUR_support_the_golden_square_desc: "Ada kelompok yang memiliki pengaruh besar di [IRQ.GetNameDef] yang memiliki tujuan yang sangat mirip dengan kita. Kita harus mendukung orang-orang yang memiliki pemikiran serupa sehingga mereka dapat membantu menghilangkan kehadiran imperialis di wilayah tersebut."
 TUR_secure_the_iraqi_oil: "Amankan Minyak Irak"
 TUR_secure_the_iraqi_oil_desc: "Mengapa memercayai orang lain untuk melakukan pekerjaan yang Anda tahu dapat Anda lakukan sendiri dengan baik? Sepatu bot kami akan mendarat di Bagdad sebelum akhir bulan: dijamin."
 TUR_rebuke_the_treaty_of_lausanne: "Tegur Perjanjian Lausanne"
 TUR_rebuke_the_treaty_of_lausanne_desc: "Kita telah melanggar begitu banyak ketentuan perjanjian yang diberlakukan pada kita setelah berakhirnya Perang Besar. Inilah waktunya untuk melepaskan diri dari kuk musuh kita, seperti yang telah dilakukan sekutu kita sebelum kita. Sangat disayangkan, namun kami tidak dapat percaya bahwa perbatasan barat kami akan aman sampai [GRE.GetAdjective] terselesaikan."
 TUR_turkish_panzers: "Panzer Turki"
 TUR_turkish_panzers_desc: "Mengapa [GER.GetNameDef] menjadi satu-satunya negara yang memiliki tank menakjubkan? Kami akan menugaskan rangkaian baju besi kami sendiri yang akan menaklukkan dunia bersama panzer [GER.GetAdjective]!"
 TUR_establish_the_committee_of_pan_turkism: "Menyebarkan Doktrin Pan-Turkisme"
 TUR_establish_the_committee_of_pan_turkism_desc: "Di seluruh Eurasia, saudara dan saudari Turki kita yang tertindas menunggu kita untuk membebaskan mereka dari cengkeraman tuan mereka yang jahat. Kami berniat melakukan hal tersebut, dan kami tidak akan berhenti sampai setiap orang Turki di dunia bebas di perbatasan kami dan di bawah perlindungan kami!"
 TUR_integrate_german_officers_into_the_army: "Integrasikan Perwira Jerman ke dalam Angkatan Darat"
 TUR_integrate_german_officers_into_the_army_desc: "Karena tidak ada lagi kebutuhan untuk menyamarkan peran pejabat militer Jerman di negara kami, kami telah secara resmi mengintegrasikan mereka ke dalam rantai komando kami dengan persetujuan tegas dari [GER.GetLeader]."
 TUR_restoring_our_nations_pride: "Mengembalikan Harga Diri Bangsa"
 TUR_restoring_our_nations_pride_desc: "Prestasi kami dalam beberapa tahun terakhir sungguh mencengangkan. Kita telah berubah dari rasa takut akan perang setelah kekalahan besar kita dalam Perang Besar menjadi para penakluk benua yang berperang di seluruh dunia. Kita berada di titik puncak zaman keemasan: Zaman Keemasan Serigala!"
 TUR_renew_the_turkish_soviet_non_aggression_pact: "Memperbarui Pakta Non-Agresi Soviet"
 TUR_renew_the_turkish_soviet_non_aggression_pact_desc: "Kami menandatangani pakta non-agresi dengan [SOV.GetNameDef] pada tahun 1925 dan merupakan salah satu negara pertama di dunia yang menjalin hubungan persahabatan dengan [SOV.GetAdjective], namun zaman telah berubah. Penting bagi kita untuk memperbarui perjanjian ini, dan memastikan hubungan yang sehat dengan rezim saat ini."
 TUR_the_batumi_accord: "Kesepakatan Batumi"
 TUR_the_batumi_accord_desc: "Kita harus bekerja sama dengan pemerintah regional Georgia untuk meningkatkan industri di kedua negara kita. Kesepakatan seperti itu akan bermanfaat bagi kedua belah pihak, dan tidak mungkin ditolak kecuali karena alasan-alasan yang jelas-jelas bersifat politis."
 TUR_provide_refuge_to_the_victims_of_fascism: "Memberikan Perlindungan kepada Korban Fasisme"
 TUR_provide_refuge_to_the_victims_of_fascism_desc: "Perjuangan fasis tidak pandang bulu dalam memilih korban. Para demagog ini menjadi kaki tangan massa dengan delusi keagungan di satu sisi, dan membiarkan tikus keluar dari selokan di sisi lain. Kita harus melindungi mereka yang tidak mempunyai sarana untuk melindungi diri mereka sendiri."
 TUR_soviet_tank_factories: "Pabrik Tank Soviet"
 TUR_soviet_tank_factories_desc: "Dengan mengambil sikap anti-fasis yang lebih eksplisit dalam kebijakan luar negeri kita, kita dapat memastikan keberhasilan skema yang dirancang untuk mendorong produksi baju besi di [ROOT.GetNameDef] dengan bantuan [SOV.GetAdjective]s."
 TUR_dissolve_the_ODPA: "Membubarkan Dewan Utang"
 TUR_dissolve_the_ODPA_desc: "Negara-negara Barat berpikir bahwa hanya karena Kesultanan Utsmaniyah berhutang budi kepada mereka, maka itu berarti kesetiaan kita pada perjuangan mereka. Kaum imperialis belum berubah, dan mereka secara konsisten berupaya membuktikan bahwa mereka tidak akan pernah bisa berubah. Kita akan mematikan simbol kuno masa lalu kita ini: ketika kita terlalu lemah untuk membela diri kita sendiri."
 TUR_adana_to_baku_highway: "Jalan Raya Adana-ke-Baku"
 TUR_adana_to_baku_highway_desc: "Kami sudah lama ingin membina hubungan yang lebih besar antara kami dan Kaukasus. Inisiatif ini hanya dapat memperdalam hubungan kita dengan [SOV.GetNameDef]."
 TUR_arctic_wolves_training_program: "Program Pelatihan Serigala Arktik"
 TUR_arctic_wolves_training_program_desc: "Prajurit kita akan berkeliaran di salju seperti serigala yang memburu mangsa di hutan boreal. Melalui pelatihan kami, musuh akan menjadi lebih takut daripada kedinginan di tengah angin sedingin es."
 TUR_seize_religious_property: "Rebut Properti Keagamaan"
 TUR_seize_religious_property_desc: "Agama telah menjadi kutukan bagi republik ini sejak awal berdirinya. Kami akan menasionalisasi dan menutup setiap bangunan keagamaan di negara ini dan memanfaatkan lahan tersebut dengan lebih baik. Dengan melepaskan diri dari belenggu agama, pada akhirnya kita akan mencapai potensi maksimal kita."
 TUR_guarding_our_western_frontiers: "Memperkuat Perbatasan Barat"
 TUR_guarding_our_western_frontiers_desc: "Ancaman terbesar terhadap kedaulatan kita datang dari negara barat. Ketika negara-negara Barat mendatangi kita, mereka akan mendapati kita siap untuk mendorong mereka kembali ke laut tempat mereka bertelur."
 TUR_anti_bolshevik_mediterranean_bloc: "Blok Mediterania Anti-Bolshevik"
 TUR_anti_bolshevik_mediterranean_bloc_desc: "Kami berharap dapat mempertahankan hubungan persahabatan dengan [SOV.GetNameDef], namun Stalinisme sangat jauh dari cita-cita Marxis sehingga kami berbohong kepada diri kami sendiri jika kami mengklaim hal tersebut dapat ditoleransi. Kita harus memutuskan hubungan dengan [SOV.GetNameDef], dan mencari teman yang berpikiran sama di tempat lain."
 TUR_readdress_the_montreux_convention: "Menangani kembali Konvensi Montreux"
 TUR_readdress_the_montreux_convention_desc: "Ketika kami pertama kali mengadakan Konvensi Montreux, kami mungkin terlalu keras ketika mempertimbangkan posisi [SOV.GetAdjective]. Kita harus meninjau kembali deklarasi yang telah ditandatangani dan membuat konsesi yang diminta [SOV.GetNameDef] atas nama persahabatan dan kerja sama."
 TUR_the_international_of_proletarian_freethinkers: "Internasional Pemikir Bebas Proletar"
 TUR_the_international_of_proletarian_freethinkers_desc: "Para pemikir bebas datang dari kelas pekerja, dan tak lama lagi kelas pekerja terbaik dan terpandai akan berkumpul di sini untuk berkontribusi demi kebaikan yang lebih besar."
 TUR_officers_of_the_revolution: "Petugas Revolusi"
 TUR_officers_of_the_revolution_desc: "Sama seperti para perwira Kemalis yang mewakili dan menjaga ideologi mereka sendiri, para perwira baru kita akan bertindak sebagai penjaga Marxisme di [TUR.GetNameDef]."
 TUR_taking_responsibility_for_the_air_war: "Mengambil Tanggung Jawab atas Perang Udara"
 TUR_taking_responsibility_for_the_air_war_desc: "[SOV.GetAdjective] sudah cukup menguasai daratan dan lautan, kita harus memberikan bantuan dengan mengambil tanggung jawab dalam perang udara."
 TUR_strengthening_our_navies: "Memperkuat Angkatan Laut Kita"
 TUR_strengthening_our_navies_desc: "Untuk melindungi diri kita di Mediterania, kita memerlukan angkatan laut yang kuat dan mumpuni. Melalui upaya gabungan, kita akan mencapai jumlah minimum yang diperlukan untuk melindungi perbatasan kita dari ancaman perambahan."
 TUR_avenge_the_treaty_of_sevres: "Membalas Perjanjian Sèvres"
 TUR_avenge_the_treaty_of_sevres_desc: "[FRA.GetNameDefCap] mengira mereka bisa menghancurkan kami saat kami berada dalam kondisi terlemah. Mereka berusaha mengeksploitasi kami, melucuti senjata kami, dan memecah belah kami. Kami akan melakukan terhadap mereka persis seperti yang mereka rencanakan untuk dilakukan terhadap kami."
 TUR_strike_at_the_fascist_menace: "Serang Ancaman Fasis"
 TUR_strike_at_the_fascist_menace_desc: "Fasisme adalah ideologi yang terlalu berbahaya untuk dibiarkan merajalela di halaman belakang rumah kita. Berapa lama lagi sebelum rakyat kita terjangkit penyakit fasis? Kita harus menghancurkan kaum fasis dan merampas semua legitimasi gerakan mereka."
 TUR_learning_from_the_tripolitanian_war: "Belajar dari Perang Tripolitan"
 TUR_learning_from_the_tripolitanian_war_desc: "Rangkaian peristiwa yang memicu runtuhnya Kesultanan Utsmaniyah terjadi begitu cepat sehingga hampir tidak ada waktu sama sekali untuk merenungkan pelajaran yang didapat. Kita harus belajar dari kesalahan kita ketika [ITA.GetAdjective] menyerbu Libya Ottoman dan merebutnya dari kita."
 TUR_stop_the_stalinist_charade: "Hentikan Sandiwara Stalinis"
 TUR_stop_the_stalinist_charade_desc: "Revolusi yang sesungguhnya harus dimunculkan kembali. Di tengah perjalanan, [SOV.GetNameDef] kehilangan tujuan dan semangatnya. Kita harus membantu mereka mendapatkan kembali idealisme mereka yang hilang."
 TUR_strike_the_british_imperialists: "Pukul Imperialis Inggris"
 TUR_strike_the_british_imperialists_desc: "Dunia tidak akan pernah benar-benar berubah selama [ENG.GetNameDef] masih ada sebagaimana adanya. Kita harus menghancurkan mereka, dan menghancurkan kerajaan mereka yang menyedihkan."
 TUR_foreign_brigades_for_the_revolution: "Brigade Asing untuk Revolusi"
 TUR_foreign_brigades_for_the_revolution_desc: "Marxisme pada dasarnya adalah sebuah keyakinan internasionalis, sehingga wajar jika kaum revolusioner dari seluruh dunia berbondong-bondong datang ke negara kita untuk berjuang dalam perjuangan global kita bersama."
 TUR_joint_caucasian_turkish_officer_school: "Sekolah Perwira Gabungan Kaukasia-Turki"
 TUR_joint_caucasian_turkish_officer_school_desc: "Kars adalah kota dengan sejarah yang kaya, dan kedekatannya dengan [SOV.GetNameDef] menjadikannya lokasi ideal untuk mendirikan sekolah perwira baru yang dipolitisasi. Para perwira kami tidak hanya akan diajari dasar-dasar peperangan, namun juga seluk-beluk doktrin Marxis."
 TUR_lift_the_turkiye_komunist_partisis_exile: "Angkat Pengasingan Partisi Türkiye Komünist"
 TUR_lift_the_turkiye_komunist_partisis_exile_desc: "Banyak anggota Partai Komunis Turki masih berada di pengasingan di [SOV.GetNameDef] atau bersembunyi di sel-sel rahasia di seluruh Eropa. Kami mungkin tidak setuju dengan semua yang dikatakan TKP, namun kami tetap menjadi kawan dalam perjuangan pembebasan kelas. Sudah waktunya untuk membawa mereka pulang."
 TUR_reconciling_kemalism_with_bolshevism: "Mendamaikan Kemalisme dengan Bolshevisme"
 TUR_reconciling_kemalism_with_bolshevism_desc: "[SOV.GetLeader] harus ditambahkan sebagai salah satu tokoh ideologi penting yang mendefinisikan ideologi kita. Bagaimana kita bisa dengan bersih mencapai perubahan ideologi dengan cara yang bersih adalah sebuah misteri, tapi siapa yang akan memanggil kita untuk melakukan hal tersebut?"
 TUR_the_turkish_tank_project: "Proyek Tank Turki"
 TUR_the_turkish_tank_project_desc: "Tank adalah senjata masa depan, dan komunisme adalah keyakinan masa depan. Keduanya berjalan bersama seperti çiğ köfte dan rakı!"
 TUR_scrapping_our_debts: "Menghapus Hutang Kita"
 TUR_scrapping_our_debts_desc: "Membangun bangsa kita dari awal adalah sebuah upaya yang mahal, dan kita akan berterima kasih atas sumbangan amal dari negara-negara yang lebih kaya dari kita yang telah membantu kita dalam pendakian menuju kemajuan nasional. Namun, kami telah menjadi sangat berbeda dengan mereka yang berpikir untuk mengendalikan kami dengan uang sehingga kami tidak punya pilihan selain memutuskan semua hutang kami."
 TUR_collectivising_our_agriculture: "Kolektivisasi Pertanian Kita"
 TUR_collectivising_our_agriculture_desc: "Pertanian adalah bidang yang sangat penting di [ROOT.GetNameDef], dan mereka yang bekerja keras di bumi tidak dapat lagi dieksploitasi oleh mereka yang memerasnya untuk mendapatkan keuntungan. Mulai sekarang, petani menentukan upahnya sendiri dan mengendalikan alat produksinya sendiri."
 TUR_capitalise_on_rising_kurdish_nationalism: "Memanfaatkan Kebangkitan Nasionalisme Kurdi"
 TUR_capitalise_on_rising_kurdish_nationalism_desc: "Kami mempunyai alasan untuk percaya bahwa suku Kurdi di luar negara kami berkonspirasi untuk melakukan tindakan terorisme yang salah arah di dalam wilayah kami sendiri. Mereka tidak memahami bahwa melalui komunisme pekerja Kurdi telah dibebaskan. Kami juga akan membebaskan kaum prolet yang sesat di luar negeri."
 TUR_issue_an_ultimatium_to_the_bulgarians: "Mengeluarkan Ultimatum kepada Bulgaria"
 TUR_issue_an_ultimatium_to_the_bulgarians_desc: "Pernahkah ada negara yang lebih buruk dari [BUL.GetNameDef]? Berkali-kali, mereka telah mengganggu keseimbangan di Balkan tanpa alasan apa pun selain untuk memenuhi khayalan egois dan irredentis mereka sendiri. Kami akan mendominasi mereka, dan dengan melakukan hal ini kami akan membebaskan pekerja [BUL.GetAdjective] – meskipun dia sebenarnya tidak pantas mendapatkannya."
 TUR_learning_from_the_great_war: "Belajar dari Perang Besar"
 TUR_learning_from_the_great_war_desc: "Meskipun tentara kita berhasil keluar dari Perang Pembebasan dengan kemenangan melawan Entente dan Ottoman, bangsa kita membayar harga kebebasan dengan darah. Kita tidak boleh lagi membiarkan bencana sebesar ini menimpa negara kita lagi. Kita harus belajar dari kesalahan masa lalu kita, dan mempelajari kemenangan kita."
 TUR_modernising_the_army: "Modernisasi Angkatan Darat"
 TUR_modernising_the_army_desc: "Kita tertinggal dalam hal inovasi teknologi dalam peperangan. Untuk menghindari terulangnya pertumpahan darah di masa lalu, kita harus segera memodernisasi taktik dan peralatan kita."
 TUR_hava_okulu: "Hava Okulu"
 TUR_hava_okulu_desc: "Kami bangga memiliki akademi tua dan terhormat yang didedikasikan untuk penerbangan militer dan sipil. Kita harus lebih fokus pada upaya perang udara."
 TUR_expand_the_air_bases: "Perluas Pangkalan Udara"
 TUR_expand_the_air_bases_desc: "Negara kita sangat besar, dan sangat penting bagi angkatan udara kita untuk dapat mencakup setiap inci wilayah [ROOT.GetAdjective]."
 TUR_mechanising_our_army: "Mekanisasi Tentara Kita"
 TUR_mechanising_our_army_desc: "Ini adalah tujuan yang ambisius tetapi dicapai karena kebutuhan. Cepat atau lambat, semua pasukan akan dimekanisasi. Kita tinggal memutuskan apakah kita siap untuk melakukan upaya tersebut sekarang, atau menunggu sampai upaya tersebut menjadi lebih layak di masa depan."
 TUR_embrace_military_tradition: "Merangkul Tradisi Militer"
 TUR_embrace_military_tradition_desc: "Kesultanan Utsmaniyah dulunya merupakan ancaman bagi seluruh benua Eropa. Tentu saja, ada beberapa kesalahan yang dilakukan - tetapi dengan melihat ke masa lalu mungkin kita bisa sekali lagi memiliki pasukan yang mampu berbaris sampai ke gerbang Wina dan sekitarnya."
 TUR_the_kirikkale_tank: "Tangki Kırıkkale"
 TUR_the_kirikkale_tank_desc: "Kita menjadi terlalu bergantung pada desain kendaraan lapis baja asing. Kami akan merancang tangki [ROOT.GetAdjective] kami sendiri - Tangki Kırıkkale!"
 TUR_superiority_of_arms: "Keunggulan Senjata"
 TUR_superiority_of_arms_desc: "Untuk apa melemparkan manusia ke suatu masalah padahal peluru dan peluru jauh lebih mudah dibuang? Kita harus melakukan upaya yang lebih besar untuk menyelamatkan nyawa prajurit kita melalui penggunaan senjata yang luar biasa."
 TUR_utilising_our_terrain: "Memanfaatkan Medan Kita"
 TUR_utilising_our_terrain_desc: "Anatolia adalah impian seorang pembela HAM dan mimpi buruk terburuk bagi penjajah. Kami mengenal negara kami, dan kami harus berlatih untuk memanfaatkan pertahanan alami negara kami agar invasi apa pun menjadi pertempuran yang sulit."
 TUR_construct_the_cakmak_line: "Bangun Jalur Çakmak"
 TUR_construct_the_cakmak_line_desc: "Marsekal Lapangan Fevzi Çakmak telah mengusulkan pembangunan garis pertahanan pertahanan di sekitar Edirne dan Selat Bosporus. Meskipun terdapat keraguan di kalangan pejabat mengenai pelaksanaan proyek ini, pada akhirnya manfaat yang diperoleh lebih besar daripada biayanya dan sudah saatnya kita mulai mengambil tindakan."
 TUR_accelerate_native_fighter_designs: "Mempercepat Desain Pesawat Tempur Asli"
 TUR_accelerate_native_fighter_designs_desc: "Industri penerbangan kita sudah tua dan dihormati, tetapi hanya sedikit desain pesawat [ROOT.GetAdjective] yang memenuhi standar produksi. Kita harus berupaya mengubahnya."
 TUR_patrol_the_seas: "Patroli Laut"
 TUR_patrol_the_seas_desc: "Laut adalah penghalang alami kita terhadap invasi dan kita harus menjaganya sama seperti kita merawat perbatasan darat."
 TUR_invoke_the_methods_of_mehmed_ii: "Gunakan Metode Mehmed II"
 TUR_invoke_the_methods_of_mehmed_ii_desc: "Kita belajar dari Mehmed II bahwa ketika suatu permasalahan tampaknya tidak dapat diatasi, meriam besar biasanya terbukti menjadi solusi yang sangat tepat."
 TUR_turkish_air_defense_platforms: "Platform Pertahanan Udara Turki"
 TUR_turkish_air_defense_platforms_desc: "Kita harus berupaya mempertahankan wilayah udara kita jika terjadi serangan udara dari laut atau dari salah satu wilayah tetangga kita."
 TUR_expand_the_golcuk_naval_base: "Perluas Pangkalan Angkatan Laut Gölcük"
 TUR_expand_the_golcuk_naval_base_desc: "Dengan memperluas Pangkalan Angkatan Laut Gölcük kami akan dapat mendukung tujuan strategis kami di selat dan laut Aegea."
 TUR_relocate_from_yildiz_palace: "Pindah dari Istana Yıldız"
 TUR_relocate_from_yildiz_palace_desc: "Kami telah terlalu lama memusatkan upaya angkatan laut kami di sekitar Çanakkale dan Selat Malaka. Sekarang saatnya untuk akhirnya menindaklanjuti rencana kami untuk memperluas Pelabuhan Mersin."
 TUR_the_legacy_of_osmanli_donanmasi: "Warisan Osmanlı Donanması"
 TUR_the_legacy_of_osmanli_donanmasi_desc: "Armada Ottoman benar-benar mengesankan, dan jika ada setidaknya satu hal yang patut disesali dari jatuhnya kekaisaran tersebut, maka hal itu adalah angkatan laut termasyhur yang dimilikinya. Kita dapat menghormati warisan itu dengan angkatan laut yang lebih modern saat ini."
 TUR_the_path_of_the_wolf: "Jalan Serigala"
 TUR_the_path_of_the_wolf_desc: "Ibarat serigala, kita harus selalu mencari mangsa. Kami akan tetap diam, dan menyerang saat musuh tidak menduganya. Kita mempunyai pola pikir seperti serigala, dan kapal selam adalah alat yang sempurna untuk menerapkan pola pikir tersebut."
 TUR_fortified_defensive_bases: "Pangkalan Pertahanan yang Dibentengi"
 TUR_fortified_defensive_bases_desc: "Dikatakan bahwa serangan terbaik adalah pertahanan yang baik, dan pendirian resmi kami adalah bahwa kami tidak berbeda pendapat!"
 TUR_turk_silahli_kuvvetleri: "Türk Silahlı Kuvvetleri"
 TUR_turk_silahli_kuvvetleri_desc: "Angkatan bersenjata kita telah menjadi benar-benar modern dan tidak lagi seperti setelah Perang Kemerdekaan yang mengerikan. Kita bisa menghadapi dunia dengan kondisi kita saat ini. Kita patut bangga dengan pencapaian kita sejauh ini."
 TUR_misak_i_milli: "Misak-ı Millî"
 TUR_misak_i_milli_desc: "Misak-ı Millî - Sumpah Nasional. Setelah runtuhnya Kekaisaran Ottoman dan berakhirnya Perang Kemerdekaan, kami secara sukarela menyerahkan sebagian besar wilayah yang kami kuasai dan membatalkan klaim kami atas wilayah tersebut. Dunia kini berbeda, dan orang-orang di wilayah ini menuntut kami kembali. Kami akan mewajibkan mereka."
 TUR_alienate_our_allies_tt: "§RPerubahan radikal dalam kebijakan luar negeri mungkin akan mengasingkan kita dari sekutu kita, terutama jika kita mulai menargetkan mereka.§!"
 TUR_recover_the_kardzhali_vilayet: "Pulihkan Vilayet Kardzhali"
 TUR_recover_the_kardzhali_vilayet_desc: "[BUL.GetAdjective] yang hina telah terlalu lama menjadi duri bagi kita. Mereka bisa saja menolak apa yang mereka inginkan, namun rakyat Turki yang terperangkap dan tertindas dalam kondisi kejam mereka berteriak meminta pembebasan. Kami tidak bermaksud membuat mereka menunggu lebih lama lagi."
 TUR_cypriot_and_oniki_ilhak: "Siprus dan Oniki Ilhak"
 TUR_cypriot_and_oniki_ilhak_desc: "Para [GRE.GetAdjective] dapat berteriak meminta enosis semau mereka; kita akan mengalahkan mereka di permainan mereka sendiri dengan ilhak kita sendiri. Siprus dan Rhodes adalah hak kami, dan ketika kami menguasainya lagi, kami tidak akan pernah melepaskannya."
 TUR_reuniting_thrace_through_force: "Menyatukan Kembali Thrace Melalui Kekuatan"
 TUR_reuniting_thrace_through_force_desc: "Masih terdapat populasi [ROOT.GetAdjective] yang cukup besar di Thrace. Kami menguasai sebagian besar wilayah tersebut di Edirne, namun [GRE.GetAdjective] bersikeras untuk membagi wilayah tersebut. Kini kita harus menegaskan hal yang sebaliknya."
 TUR_rebuke_the_treaty_of_kars: "Tegur Perjanjian Kars"
 TUR_rebuke_the_treaty_of_kars_desc: "Perjanjian Kars seharusnya menghapuskan perbatasan antara [ROOT.GetNameDef] dan Kaukasus, tapi bagaimana perjanjian seperti itu bisa tetap berpengaruh ketika nyawa penduduk Turki di wilayah terkutuk itu dipertaruhkan? Kami akan berjuang mati-matian untuk menyelamatkan saudara kami."
 TUR_unite_the_azeri_diaspora: "Satukan Diaspora Azerbaijan"
 TUR_unite_the_azeri_diaspora_desc: "Merupakan tugas serius kami untuk menyatukan semua bangsa Turki di dunia di bawah satu negara, dan sampai kami dapat membebaskan saudara-saudara Azeri kami di luar negeri, misi kami belum selesai."
 TUR_konfederasyon: "Konfederasi"
 TUR_konfederasyon_desc: "Kami selalu mempunyai kedekatan yang besar dengan rakyat Azerbaijan, dan merupakan sebuah keistimewaan mutlak untuk memberikan kewarganegaraan yang setara kepada rakyat Azerbaijan dalam konglomerasi baik bangsa Turki."
 TUR_annul_the_ankara_anlasmasi: "Membatalkan Ankara Anlaşması"
 TUR_annul_the_ankara_anlasmasi_desc: "Pada tahun 1926, Masalah Mosul tampaknya telah terselesaikan - namun seperti semua krisis pada saat itu, tidak dapat disangkal bahwa hasilnya adalah [ENG.GetAdjective] dan [FRA.GetAdjective]. Kita tidak akan lagi mengabaikan penderitaan [IRQ.GetAdjective] Turki. Waktunya untuk bertindak telah tiba."
 TUR_liberate_the_kurdish_diaspora: "Bebaskan Diaspora Kurdi"
 TUR_liberate_the_kurdish_diaspora_desc: "Nasib masyarakat Turki dan Kurdi saling terkait, dan jika kita tidak bersama-sama mengalami hal ini, maka sejarah akan terulang kembali selamanya."
 TUR_turanist_ambition: "Ambisi Turanis"
 TUR_turanist_ambition_desc: "Kita mempunyai keinginan untuk membentuk sebuah kerajaan besar bagi diri kita sendiri, namun kita berisiko memicu kemarahan negara-negara besar yang masih berdiri di dunia. Mereka akan mencoba menghalangi kita, tapi begitu Eurasia berada di bawah kendali kita, mereka tidak akan mampu menghentikan kita."
 TUR_subdue_the_magyars: "Taklukkan Magyar"
 TUR_subdue_the_magyars_desc: "Mereka mungkin menganggap diri mereka jauh melampaui akar mereka setelah berabad-abad berada di bawah pengaruh Austria, namun kita melihat orang Hongaria itu apa adanya. Dia adalah orang Turki yang menyangkal hal itu; serigala yang melihat dirinya sebagai elang. Kami akan mengingatkan bangsa Magyar akan warisan mereka."
 TUR_cin_turkleri: "di Türkleri"
 TUR_cin_turkleri_desc: "Orang Turki di Tiongkok akan selalu menjadi mangsa tanpa solidaritas orang Turki di luar negeri. Adalah kewajiban kita untuk membebaskan dan melindungi orang-orang Turki di Tiongkok dari orang-orang yang menyangkal warisan leluhur mereka."
 TUR_crowning_ourselves_with_the_fin_ugor: "Memahkotai Diri Kita dengan Fin-Ugor"
 TUR_crowning_ourselves_with_the_fin_ugor_desc: "Tidak ada permata yang lebih bagus di mahkota Turanist selain [FIN.GetNameDef]. Menaklukkan [FIN.GetAdjective] adalah puncak dari ambisi utama, dan kami sepenuhnya bermaksud untuk memenuhi ambisi tersebut dan melengkapi persaudaraan Turanist kami."
 BUL_acquire_modern_tools: "Dapatkan Alat Modern"
 BUL_acquire_modern_tools_desc: "Industri Bulgaria sebagian besar terdiri dari manufaktur dan kerajinan tangan kuno berskala kecil. Kita memerlukan alat yang tepat untuk membangun dan mengembangkan fondasi industri modern."
 BUL_improve_the_road_system: "Memperbaiki Sistem Jalan"
 BUL_improve_the_road_system_desc: "Jalan-jalan di Bulgaria benar-benar terbelakang, sehingga membuat komunikasi menjadi sulit dan lambat. Perkembangan industri infrastruktur modern yang mampu memperbaiki dan memperluas sistem jalan raya yang ada saat ini akan membuka jalan bagi penyelesaian masalah transportasi kita."
 BUL_attract_foreign_capitals: "Menarik Modal Asing"
 BUL_attract_foreign_capitals_desc: "Kita tidak mempunyai sarana untuk membangun industri yang kuat dan efisien, jadi pilihan terbaik kita adalah menarik investor asing yang ingin memperluas bisnis mereka dan beroperasi di Bulgaria."
 BUL_attract_foreign_capitals_dynamic_modifier_tt: "Memperoleh Semangat Nasional §YIndustri Asing§!, yang memberikan (Perolehan Kekuatan Politik: §G+5%§!, Kecepatan Konstruksi: §R-10%§!, Output Pabrik: §R-2%§!, £GFX_prod_eff_cap Batas Efisiensi Produksi: §R-5%§!, £GFX_prod_eff Pertumbuhan Efisiensi Produksi: §R-5%§!)"
 BUL_invigorate_national_industry: "Menggiatkan Industri Nasional"
 BUL_invigorate_national_industry_desc: "Kita sudah terlalu lama mengandalkan modal asing untuk mengembangkan infrastruktur, industri, dan pertanian. Jika kita ingin mencapai swasembada dan kebebasan untuk membangun negara dengan cara kita sendiri, maka kita harus memulainya dengan melakukan investasi pada industri nasional dan pengembangan pabrik-pabrik baru.\nIni bukanlah tugas yang mudah, namun upaya ini pasti akan bermanfaat dalam jangka panjang."
 BUL_expand_sofia_university: "Perluas Universitas Sofia"
 BUL_expand_sofia_university_desc: "Dengan mengalokasikan sebagian anggaran kami untuk membiayai perluasan fasilitas Universitas Sofia, institusi pendidikan tinggi paling bergengsi di Bulgaria, kami akan meningkatkan pemikiran cemerlang kami, yang akan kami manfaatkan sebaik-baiknya."
 BUL_expand_the_tobacco_industry: "Memperluas Industri Tembakau"
 BUL_expand_the_tobacco_industry_desc: "Selama beberapa dekade, ekspor utama kami adalah produksi pertanian, namun jelas bahwa kami masih dapat meningkatkan keuntungan dari ekspor ini dengan beralih dari produksi biji-bijian ke tanaman yang lebih bernilai, seperti tembakau."
 BUL_nationalization: "Nasionalisasi"
 BUL_nationalization_desc: "Modal asing telah memungkinkan kami mengembangkan kompleks industri baru di Bulgaria dalam skala yang belum pernah terjadi sebelumnya di Balkan. Namun para tokoh terkemuka yang memiliki barang-barang tersebut semakin banyak mengambil keuntungan dari perekonomian kita, jadi sudah saatnya kita menyita alat-alat produksi mereka dan mengusir mereka keluar dari negara kita. Namun, hal ini akan membuat marah pemerintah asing dan, jika diplomasi gagal, kita mungkin harus berjuang untuk itu..."
 BUL_nationalization_dynamic_modifier_tt: "Hapus Semangat Kebangsaan §YIndustri Luar Negeri§!"
 BUL_nationalization_warning_tt: "§RSebagai konsekuensi dari nasionalisasi, negara asing yang telah berinvestasi di industri Bulgaria mungkin memutuskan untuk menerapkan embargo perdagangan terhadap negara kami, mengeluarkan kami dari faksi atau bahkan menyatakan perang terhadap kami!§!"
 BUL_increase_industry_investments: "Meningkatkan Investasi Industri"
 BUL_increase_industry_investments_desc: "Kita harus mengembangkan industri berat yang mampu mendukung pertumbuhan industri dan militer kita yang besar. Investasi nasional yang besar memang diperlukan, namun hal ini akan membawa kita lebih dekat pada kemandirian ekonomi akhir."
 BUL_utmost_optimization: "Optimasi Semaksimal mungkin"
 BUL_utmost_optimization_desc: "Dengan mengutamakan pengembangan industri nasional, kita mengalami peningkatan produksi yang berkelanjutan dan banyak industri baru yang berkembang pesat meskipun belum terlalu efisien. Sudah waktunya bagi kita untuk melakukan upaya terakhir, melakukan reorganisasi industri dan lahan secara besar-besaran, yang akan memungkinkan kita mencapai efisiensi maksimum baik di bidang industri maupun pertanian."
 BUL_utmost_optimization_dynamic_modifier_tt: "Ubah §YIndustri Asing§! dengan\nKecepatan Konstruksi: §G+5%§!\n£GFX_prod_eff_cap Batas Efisiensi Produksi: §G+3%§!\n£GFX_prod_eff Pertumbuhan Efisiensi Produksi: §G+3%§!"
 BUL_utmost_optimization_tt: "Dampaknya akan berubah jika fokus §YMenarik Modal Asing§! selesai."
 BUL_national_railway_lines: "Jalur Kereta Api Nasional"
 BUL_national_railway_lines_desc: "Kita memerlukan cara yang cepat dan dapat diandalkan untuk memindahkan tidak hanya pasukan kita tetapi juga perbekalan kita ke seluruh negeri. Memperluas jalur kereta api akan meningkatkan kemampuan logistik kami."
 BUL_all_that_glitters: "Semua Itu Berkilau"
 BUL_all_that_glitters_desc: "Cadangan emas di Chelopech dapat memberikan manfaat bagi perekonomian kita di saat investasi pada aset non-material menghadapi risiko besar. Dampaknya terhadap cadangan nasional kita seharusnya bisa terlihat."
 BUL_light_metal_exploitation: "Eksploitasi Logam Ringan"
 BUL_light_metal_exploitation_desc: "Ketika industri militer kita menuntut banyak sumber daya alam, upaya harus dilakukan untuk memperluas produksi dalam negeri. Meskipun simpanan kita masih kecil, masa-masa sulit ini tentu mengharuskan kita untuk mengeksploitasinya."
 BUL_steel_plant_in_pernik: "Pabrik Baja di Pernik"
 BUL_steel_plant_in_pernik_desc: "Bulgaria bukanlah negara terkaya di Balkan dalam hal sumber daya, dan karena itu kita perlu memanfaatkan kekayaan yang tersembunyi di tanah kita. Kami harus memperbaiki pabrik besi dan fasilitas ekstraksi batubara di Pernik, dan membangun pabrik baja pertama kami di sana."
 BUL_mineral_extraction_in_the_rhodopes: "Ekstraksi Mineral di Rhodopes"
 BUL_mineral_extraction_in_the_rhodopes_desc: "Rhodopes kaya akan mineral seperti kromit, bijih besi, seng, dan timbal, dan para ahli kami optimis bahwa eksplorasi yang tepat di kawasan tersebut dapat mengarah pada penemuan deposit baru."
 BUL_uranium_prospecting: "Prospek Uranium"
 BUL_uranium_prospecting_desc: "Uranium menjadi sumber daya yang sangat berharga untuk menciptakan senjata baru yang kuat dan menghancurkan, dan kami telah menemukan potensi simpanan yang kaya di Buhovo. Kita harus mensurvei wilayah tersebut, dan mempertimbangkan apakah akan lebih bermanfaat jika kita memanfaatkan sumber daya tersebut sendiri atau memberikan hak eksploitasi kepada sekutu kita."
 BUL_uranium_prospecting_no_target_tt: "Membuka Keputusan: §YPerjanjian Konsesi Uranium§!, memberikan bonus kepada pemimpin faksi Bulgaria atau sekutu utama. §RMengharuskan Bulgaria berada dalam faksi.§!"
 BUL_uranium_prospecting_leader_target_tt: "Membuka Keputusan: §YPerjanjian Konsesi Uranium§!, memberikan bonus kepada pemimpin faksi Bulgaria."
 BUL_uranium_prospecting_major_ally_target_tt: "Membuka Keputusan: §YPerjanjian Konsesi Uranium§!, memberikan bonus kepada sekutu utama Bulgaria."
 BUL_georgi_benkovski_aircraft_repair_facilities: "Fasilitas Perbaikan Pesawat Georgi Benkovski"
 BUL_georgi_benkovski_aircraft_repair_facilities_desc: "Untuk membangun angkatan udara nasional diperlukan pembangunan hanggar perbaikan badan pesawat dan fasilitas pengujian mesin. Dalam hal ini, kami dihadapkan pada proyek menarik untuk mendirikan pabrik perbaikan pesawat Terem Georgi Benkovski di Plovdiv."
 BUL_pilot_training_program: "Program Pelatihan Percontohan"
 BUL_pilot_training_program_desc: "Jika Bulgaria ingin mendominasi angkasa, kita memerlukan sejumlah besar pilot dan awak berpengalaman, dan untuk mencapai hal itu, kita harus mengembangkan program pelatihan optimal yang didukung oleh pangkalan udara dan fasilitas pelatihan yang diperlukan."
 BUL_negotiate_bulgarian_rearmament: "Negosiasikan Persenjataan Kembali Bulgaria"
 BUL_negotiate_bulgarian_rearmament_desc: "Tentara Bulgaria berada dalam kondisi yang menyedihkan karena pembatasan Perjanjian Neuilly-sur-Seine, dan kami hampir tidak berdaya melawan invasi dari negara mana pun yang berbatasan. Kita harus menegosiasikan pencabutan pembatasan tersebut secepatnya, jangan sampai tetangga kita yang rakus memutuskan untuk memulai perang Balkan lagi."
 BUL_reorganize_the_military_industry: "Menata Kembali Industri Militer"
 BUL_reorganize_the_military_industry_desc: "Industri militer kita sudah ketinggalan zaman dan tidak efisien, dirancang untuk memproduksi peralatan yang sudah usang. Kita harus melaksanakan program modernisasi sebelum terlambat."
 BUL_darzhavna_aeroplanna_rabotilnitsa: "Darzhavna Aeroplanna Rabotilnitsa"
 BUL_darzhavna_aeroplanna_rabotilnitsa_desc: "Kita tidak boleh bergantung pada perancang asing untuk memasok pesawat yang dibutuhkan angkatan udara kita. Kami akan melakukan perluasan besar-besaran dan modernisasi fasilitas Bengkel Pesawat Negara kami di Bozhurishte."
 BUL_darzhavna_samoletna_fabrika: "Darzhavna Samoletna Fabrika"
 BUL_darzhavna_samoletna_fabrika_desc: "Fasilitas DAR di Bozhurishte sudah memproduksi pesawat tempur Bulgaria untuk memberi makan angkatan udara kita. Kita sekarang dapat berinvestasi dalam pembangunan Pabrik Pesawat Negara di Lovech, dengan instalasi modern yang akan fokus pada produksi pesawat ringan lainnya."
 BUL_foreign_aircraft_designers: "Desainer Pesawat Asing"
 BUL_foreign_aircraft_designers_desc: "Mengapa kita harus membuang-buang waktu dan tenaga untuk mengembangkan industri penerbangan nasional, padahal kita bisa saja merekrut desainer asing yang sudah berpengalaman puluhan tahun di bidang produksi pesawat militer?"
 BUL_kaproni_bulgarski: "Kaproni Bulgarski"
 BUL_kaproni_bulgarski_desc: "Perusahaan konstruksi pesawat Italia Caproni saat ini sedang menghadapi kebangkrutan, berjuang untuk mengatasi kekurangan sumber daya, yang telah dialihkan ke rantai produksi lain. Hal ini membuka kemungkinan bagi kami untuk mengakuisisi kompleks industri di Kazanlak, Kaproni Bulgarski, di mana kami dapat fokus pada produksi pesawat pengebom menengah dan berat."
 BUL_darzhavna_voenna_fabrika: "Darzhavna Voenna Fabrika"
 BUL_darzhavna_voenna_fabrika_desc: "Dengan memperluas Pabrik Militer Negara di Kazanlak, kita dapat meletakkan dasar bagi industri militer nasional yang sesuai dan mampu memasok peralatan berkualitas tinggi kepada tentara kita."
 BUL_found_dvf_sopot: "Menemukan DVF Sopot"
 BUL_found_dvf_sopot_desc: "Pembangunan pabrik amunisi di Sopot dimulai pada tahun 1935, namun belum selesai. Kita harus membuat perjanjian untuk akuisisi sisa mesin dan peralatan agar kompleks tersebut dapat dioperasikan sesegera mungkin."
 BUL_contract_foreign_companies: "Kontrak Perusahaan Asing"
 BUL_contract_foreign_companies_desc: "Industri militer kita masih jauh dari cukup untuk melaksanakan program persenjataan yang memadai. Kita harus mencari perancang yang tepat di luar negeri yang mampu memproduksi kendaraan berkualitas tinggi untuk memasok tentara kita."
 BUL_rebuild_the_army: "Membangun kembali Angkatan Darat"
 BUL_rebuild_the_army_desc: "Kita dikelilingi oleh musuh-musuh potensial, seperti yang telah diajarkan oleh sejarah dengan keras, dan sangat penting bagi kita untuk membangun pasukan yang kuat dan mengembangkan taktik modern jika kita ingin menang dalam konflik di masa depan."
 BUL_vasil_levsky_national_military_university: "Universitas Militer Nasional Vasil Levsky"
 BUL_vasil_levsky_national_military_university_desc: "Universitas Militer Nasional mempunyai sejarah yang panjang, namun pendidikan militernya telah berkurang drastis sejak diberlakukannya Perjanjian Neuilly. Ini adalah waktu yang tepat untuk membiayai sebuah proyek untuk memperluas fasilitas mereka dan mendorong pendaftaran taruna baru, yang pada akhirnya akan menjadi perwira yang sukses."
 BUL_prussia_of_the_balkans: "Prusia dari Balkan"
 BUL_prussia_of_the_balkans_desc: "Pada tahun-tahun awalnya, Ketsaran Bulgaria adalah negara yang sangat termiliterisasi dengan tentara yang besar dan lengkap, yang diidentifikasi sebagai Prusia dari Balkan, hingga negara tersebut dikhianati oleh mantan sekutunya yang pengkhianat. Namun, kami telah membangun kembali negara kami setelah kekalahan memalukan di masa lalu, dan kini saatnya telah tiba untuk mendapatkan kembali kejayaan Bulgaria. Dunia akan menyebut kami Prusia dari Balkan sekali lagi!"
 BUL_national_military_academy: "Akademi Militer Nasional"
 BUL_national_military_academy_desc: "Kepala Akademi Militer Nasional telah memberi kami sebuah proyek untuk memperluas fasilitasnya, dengan tujuan tidak hanya untuk meningkatkan kapasitas institusi, tetapi juga untuk memberikan pelatihan yang lebih baik bagi komandan militer kita di masa depan."
 BUL_war_logistics: "Logistik Perang"
 BUL_war_logistics_desc: "Kita kalah dalam Perang Besar bukan karena kekalahan di medan perang, namun karena ketidakmampuan kita untuk memberi makan rakyat dan memasok pasukan kita. Kita harus meningkatkan logistik kita untuk mencegah hal ini terjadi lagi."
 BUL_defensive_lines: "Garis Pertahanan"
 BUL_defensive_lines_desc: "Kita harus memulai pembangunan benteng yang memadai dan peningkatan infrastruktur untuk melindungi jalur transportasi kita dan menjamin aliran pasokan untuk pasukan kita."
 BUL_a_black_sea_fleet: "Armada Laut Hitam"
 BUL_a_black_sea_fleet_desc: "Jika kita ingin memiliki kehadiran angkatan laut, kita perlu membentuk armada yang sesuai untuk Laut Hitam, dengan fokus pada pembangunan kapal perusak, karena mereka adalah tulang punggung armada modern mana pun."
 BUL_improve_coastal_defenses: "Meningkatkan Pertahanan Pesisir"
 BUL_improve_coastal_defenses_desc: "Kami sangat rentan terhadap kemungkinan invasi angkatan laut dari Laut Hitam, dan sangat penting bagi kami untuk memperkuat garis pertahanan kami di sepanjang pantai Laut Hitam. Semakin cepat kita melakukannya, semakin baik."
 BUL_reinforce_naval_bases: "Perkuat Pangkalan Angkatan Laut"
 BUL_reinforce_naval_bases_desc: "Kita harus memastikan bahwa pangkalan angkatan laut kita terlindungi dengan baik dan mempunyai kapasitas untuk mempertahankan armada kita yang beroperasi di wilayah tersebut."
 BUL_supremacy_on_the_bosporus: "Supremasi di Bosporus"
 BUL_supremacy_on_the_bosporus_desc: "Sekarang kita berada di bawah kendali Selat Bosporus, kita harus membangun benteng yang memadai untuk memastikan dominasi Bulgaria atas wilayah strategis utama ini."
 BUL_dominance_in_the_black_sea: "Dominasi di Laut Hitam"
 BUL_dominance_in_the_black_sea_desc: "Masa-masa sulit memerlukan tindakan yang mengerikan untuk diambil. Untuk menjamin tidak hanya integritas bangsa Bulgaria, tetapi juga hegemoninya, sudah tiba waktunya bagi kita untuk mengamankan Laut Hitam, menghilangkan segala kemungkinan ancaman dari pantainya."
 BUL_dominance_in_the_aegean_sea: "Dominasi di Laut Aegea"
 BUL_dominance_in_the_aegean_sea_desc: "[GetDominanceInTheAegeanDesc]"
 BUL_dominance_in_the_aegean_default: "Masa-masa sulit memerlukan tindakan yang mengerikan untuk diambil. Untuk menjamin tidak hanya integritas bangsa Bulgaria, namun juga dominasinya di Tiga Lautan, sudah tiba waktunya bagi kita untuk mengamankan Laut Aegea, menghilangkan segala kemungkinan ancaman dari pantainya."
 BUL_dominance_in_the_aegean_black_sea_success: "Setelah kita sukses mengamankan Laut Hitam, kini saatnya kita mengulangi manuver di Laut Aegea. Kami akan mengusir negara musuh yang ada di pantainya dan merebut wilayah-wilayah berharganya untuk Prusia di Balkan."
 BUL_dominance_in_the_aegean_black_sea_failure: "Pukulan yang kami derita setelah kegagalan misi kami untuk mengamankan Laut Hitam telah menyebabkan suramnya suasana hati penduduk Bulgaria, satu-satunya cara untuk menyelesaikannya adalah dengan mengamankan, kali ini dengan sukses, dominasi Bulgaria di Laut Aegea."
 BUL_dominance_in_the_aegean_adriatic_success: "Setelah keberhasilan kami mengamankan Laut Adriatik, moral pasukan Bulgaria dan juga penduduk sipil lebih tinggi dari sebelumnya. Kita harus memanfaatkan momentum ini dan mengamankan Laut Aegea, sehingga Prusia di Balkan akan menjadi satu-satunya penjaga tiga lautan yang tak terbantahkan."
 BUL_dominance_in_the_aegean_adriatic_failure: "Kegagalan kita mengamankan Laut Adriatik telah memberikan pukulan telak terhadap moral Bulgaria. Jika kita ingin mendapatkan kembali keberanian dan kepercayaan diri, kita harus mengamankan dominasi Bulgaria di Laut Aegea."
 BUL_dominance_in_the_aegean_total_failure: "Pukulan yang kita derita setelah kegagalan mengamankan Laut Adriatik dan Laut Hitam telah menyebabkan gelombang demoralisasi dan ketidakpercayaan terhadap pemerintah di negara tersebut. Jika kita ingin menebus kesalahan kita dan mengembalikan kejayaan Prusia di Balkan, kita harus mengamankan dominasi Bulgaria di Laut Aegea."
 BUL_dominance_in_the_adriatic_sea: "Dominasi di Laut Adriatik"
 BUL_dominance_in_the_adriatic_sea_desc: "[GetDominanceInTheAdriaticDesc]"
 BUL_dominance_in_the_adriatic_default: "Masa-masa sulit memerlukan tindakan yang mengerikan untuk diambil. Untuk menjamin tidak hanya keutuhan bangsa Bulgaria, namun juga dominasinya di Tiga Lautan, sudah tiba waktunya bagi kita untuk mengamankan Laut Adriatik, menghilangkan segala kemungkinan ancaman dari pantainya."
 BUL_dominance_in_the_adriatic_black_sea_success: "Setelah kita berhasil mengamankan Laut Hitam, kini saatnya mengulangi manuver di Laut Adriatik. Kami akan mengusir negara musuh yang ada di pantainya dan merebut wilayah-wilayah berharganya untuk Prusia di Balkan."
 BUL_dominance_in_the_adriatic_black_sea_failure: "Pukulan yang kami derita setelah kegagalan misi kami untuk mengamankan Laut Hitam telah menyebabkan suramnya suasana hati penduduk Bulgaria, satu-satunya cara untuk menyelesaikannya adalah dengan mengamankan, kali ini dengan sukses, dominasi Bulgaria di Laut Adriatik."
 BUL_dominance_in_the_adriatic_aegean_success: "Setelah keberhasilan kami mengamankan Laut Aegea, moral pasukan Bulgaria dan juga penduduk sipil lebih tinggi dari sebelumnya. Kita harus memanfaatkan momentum ini dan mengamankan Laut Adriatik, sehingga Prusia di Balkan akan menjadi satu-satunya penjaga tiga lautan yang tak terbantahkan."
 BUL_dominance_in_the_adriatic_aegean_failure: "Kegagalan kami mengamankan Laut Aegea telah memberikan pukulan telak terhadap moral Bulgaria. Jika kita ingin mendapatkan kembali keberanian dan kepercayaan diri, kita harus mengamankan dominasi Bulgaria di Laut Adriatik."
 BUL_dominance_in_the_adriatic_total_failure: "Pukulan yang kita derita setelah kegagalan mengamankan Laut Aegea dan Laut Hitam telah menyebabkan gelombang demoralisasi dan ketidakpercayaan terhadap pemerintah di negara tersebut. Jika kita ingin menebus kesalahan kita dan mengembalikan kejayaan Prusia di Balkan, kita harus mengamankan dominasi Bulgaria di Laut Adriatik."
 BUL_bulgaria_on_the_three_seas: "Bulgaria di Tiga Lautan"
 BUL_bulgaria_on_the_three_seas_desc: "Seperti yang terjadi di zaman kuno pada masa Kekaisaran Bulgaria Pertama dan Kedua, pesisir [ROOT.GetNameDef] sekali lagi dikelilingi oleh Laut Aegea, Laut Adriatik, dan Laut Hitam. Langkah selanjutnya adalah mengembangkan infrastruktur yang diperlukan untuk membangun angkatan laut yang kuat yang mampu mengamankan dominasi Bulgaria di tiga lautan."
 BUL_national_submarine_production: "Produksi Kapal Selam Nasional"
 BUL_national_submarine_production_desc: "Angkatan Laut kita terlalu lemah untuk menantang armada asing dan melawan dominasi laut di atas permukaan. Namun, kita bisa fokus pada produksi kapal selam yang akan mengganggu armada musuh dan mengancam rute pelayaran mereka dari bawah air."
 BUL_bulgarian_shipping_chamber: "Kamar Pengiriman Bulgaria"
 BUL_bulgarian_shipping_chamber_desc: "Kita harus menyediakan sarana yang dibutuhkan perusahaan pelayaran dan koperasi Bulgaria untuk terus meningkatkan armada mereka, karena konvoi mereka sangat penting untuk perdagangan di masa damai, tetapi juga untuk mengangkut pasukan dan perbekalan selama perang."
 BUL_strike_from_the_seas: "Serangan dari Lautan"
 BUL_strike_from_the_seas_desc: "Ada banyak pulau dan banyak lokasi strategis di sepanjang pantai Mediterania dan Laut Hitam. Oleh karena itu, kita memerlukan kekuatan yang solid dengan transportasi yang memadai yang mampu menyerang dari laut dan mengambil posisi-posisi penting untuk melancarkan serangan besar-besaran."
 BUL_expand_varna_naval_base: "Perluas Pangkalan Angkatan Laut Varna"
 BUL_expand_varna_naval_base_desc: "Kita harus memperluas fasilitas pangkalan angkatan laut Varna dan membangun galangan kapal yang memadai untuk melaksanakan produksi kapal perang."
 BUL_develop_burgas_shipyards: "Mengembangkan Galangan Kapal Burgas"
 BUL_develop_burgas_shipyards_desc: "Untuk meningkatkan kapasitas produksi kapal perang, kami akan berinvestasi dalam perluasan pangkalan angkatan laut Burgas dan pembangunan galangan kapal baru di daerah tersebut."
 BUL_an_aegean_sea_fleet: "Armada Laut Aegea"
 BUL_an_aegean_sea_fleet_desc: "Kini setelah kita hadir di Laut Aegea, kita harus berusaha mendominasi sepenuhnya. Untuk mencapai hal ini, kita tidak bisa hanya mengandalkan kapal perusak dan kapal selam, kita membutuhkan kapal bertonase lebih besar di armada kita."
 BUL_a_powerful_bulgarian_navy: "Angkatan Laut Bulgaria yang Kuat"
 BUL_a_powerful_bulgarian_navy_desc: "Kita harus fokus pada pembangunan kapal-kapal besar yang dapat memberikan armada kita daya tembak yang saat ini tidak mereka miliki. Kita mungkin tidak memiliki angkatan laut yang terbesar, namun jika kita memusatkan upaya kita, kita mungkin akan mampu melawan dominasi angkatan laut kita bahkan melawan kekuatan angkatan laut yang besar."
 BUL_modern_tactics: "Taktik Modern"
 BUL_modern_tactics_desc: "Angkatan laut modern memerlukan pengembangan taktik modern untuk memanfaatkannya semaksimal mungkin. Namun kita tidak boleh hanya mengandalkan angkatan laut ketika menghadapi pasukan musuh yang kuat, karena salah satu kelemahan terbesar kapal adalah kerentanannya terhadap serangan udara..."
 BUL_oppose_the_royal_dictatorship: "Menentang Kediktatoran Kerajaan"
 BUL_oppose_the_royal_dictatorship_desc: "Jika kita ingin mengakhiri rezim opresif [GetBulgarianTsar], kita harus mulai dengan mencari dukungan yang diperlukan untuk memberikan perlawanan yang signifikan terhadap pemerintahan saat ini, yang seluruhnya terdiri dari boneka-boneka Tsar."
 BUL_appoint_communist_ministers: "Tunjuk Menteri Komunis"
 BUL_appoint_communist_ministers_desc: "Kita harus menekan pemerintah Bulgaria untuk menunjuk menteri yang mengupayakan perubahan arah dari rezim diktator Tsar. Hanya dari dalam pemerintahan kita dapat meruntuhkan sistem Tsar."
 BUL_the_spanish_struggle: "Perjuangan Spanyol"
 BUL_the_spanish_struggle_desc: "Kawan-kawan kita di Spanyol sedang menghadapi sampah fasis yang, berkat dukungan kekuatan sayap kanan lainnya di Eropa, secara serius mengancam akan mengalahkan pemerintah Republik.\nMenghadapi kekejaman seperti itu, [ROOT.GetNameDef] tidak bisa berpaling. Kita harus mengorganisir brigade sukarelawan yang akan berjuang berdampingan dengan milisi Spanyol untuk mempertahankan kebebasan."
 BUL_overthrow_the_tsar: "Gulingkan Tsar"
 BUL_overthrow_the_tsar_desc: "Sentimen anti-tsar sedang menyebar di Bulgaria dan kita harus memanfaatkan kesempatan berharga ini untuk menggulingkan [GetBulgarianTsar] dan menghapuskan monarki Bulgaria untuk selamanya. Tidak ada tempat di Bulgaria modern untuk bentuk pemerintahan yang ketinggalan jaman!"
 BUL_abolish_the_tarnovo_constitution: "Hapus Konstitusi Tarnovo"
 BUL_abolish_the_tarnovo_constitution_desc: "Konstitusi Tarnovo dianggap liberal dan maju pada abad terakhir, namun saat ini hanya berfungsi untuk melegitimasi rezim diktator yang menindas. Sudah waktunya untuk menghapus konstitusi ini dan menulis konstitusi baru, berdasarkan model Konstitusi Soviet tahun 1936, dan mencakup hak-hak dasar seperti kesetaraan warga negara di depan hukum, kebebasan berbicara dan berkumpul, serta sistem kesejahteraan universal."
 BUL_unify_the_bourgeois_movement: "Satukan Gerakan Borjuis"
 BUL_unify_the_bourgeois_movement_desc: "Jika kita ingin melawan fasisme di Bulgaria, kita harus menyatukan gerakan borjuis menjadi sebuah gerakan bersama. Untuk mencapai hal ini, Partai Komunis Bulgaria harus bekerja sama dengan kaum sosialis, meninggalkan perbedaan di antara kita demi kebaikan yang lebih besar."
 BUL_united_front_against_fascism: "Front Persatuan Melawan Fasisme"
 BUL_united_front_against_fascism_desc: "Langkah selanjutnya setelah menyatukan gerakan borjuis adalah membentuk blok anti-fasis, sebuah taktik yang disarankan oleh Kongres Komintern ke-7 pada tahun 1935. Kita harus menghimbau kaum agraris dan bahkan demokrat untuk bergabung dalam front kita melawan fasisme Bulgaria."
 BUL_the_fatherland_front: "Front Tanah Air"
 BUL_the_fatherland_front_desc: "Setelah mengumpulkan dukungan yang signifikan dari berbagai kelompok politik, sekarang saatnya front anti-fasis kita menjadi sebuah gerakan politik, menyatukan anggota dari semua organisasi politik yang berbeda menjadi satu partai, bertekad untuk melawan fasisme di Bulgaria dengan segala cara."
 BUL_full_voting_rights_for_women: "Hak Pilih Penuh bagi Perempuan"
 BUL_full_voting_rights_for_women_desc: "Jika kita ingin kebebasan, kesetaraan, dan kemajuan terwujud di negara kita, inilah saatnya memberikan hak pilih penuh kepada perempuan dan mendukung Persatuan Perempuan Bulgaria dalam tugasnya meningkatkan kesadaran sosial mengenai isu-isu perempuan di [ROOT.GetNameDef]."
 BUL_the_peoples_republic_of_bulgaria: "Republik Rakyat Bulgaria"
 BUL_the_peoples_republic_of_bulgaria_desc: "Kini setelah kita menyingkirkan monarki Bulgaria, kita harus melakukan beberapa perubahan yang sangat diperlukan dalam tata kelola negara kita. Sudah waktunya untuk mengakhiri era despotisme dan penindasan yang telah melanda negara ini selama bertahun-tahun dan membentuk Republik Rakyat Bulgaria.\nPersatuan menjadikan kekuatan!"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance: "Perjanjian Saling Membantu Soviet-Bulgaria"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc: "[SOU.GetNameDef] mewakili sekutu kuat yang dapat meningkatkan perekonomian kita dan membantu kita memastikan integritas wilayah [ROOT.GetNameDef] di masa-masa sulit ini. Kita harus berusaha memperkuat hubungan dengan pemerintah [SOU.GetAdjective] dan mendapatkan dukungan yang berharga jika kita ingin menang melawan banyak musuh di sekitar kita."
 BUL_follow_the_stalinist_doctrine: "Ikuti Doktrin Stalinis"
 BUL_follow_the_stalinist_doctrine_desc: "Sudah saatnya kita secara resmi mengajukan keanggotaan resmi [SOV.GetFactionName] sehingga kita dapat mengembangkan kerjasama yang lebih baik antara [SOV.GetNameDef] dan [ROOT.GetNameDef], tidak hanya dalam masalah ekonomi dan industri, tetapi juga dalam masalah militer."
 BUL_joint_research_effort: "Upaya Penelitian Bersama"
 BUL_joint_research_effort_desc: "Kita harus menggabungkan upaya penelitian kita di bidang militer dengan penelitian sekutu kita untuk mendorong pengembangan senjata modern yang dapat memberikan keseimbangan yang menguntungkan kita dalam konflik militer."
 BUL_soviet_military_exercises: "Latihan Militer Soviet"
 BUL_soviet_military_exercises_desc: "Pasukan militer kita harus banyak belajar dari Tentara Merah yang kompeten dan disiplin. Kita harus mengundang penasihat militer dari [SOV.GetNameDef] untuk datang ke [ROOT.GetNameDef] guna membantu kita mengembangkan program pelatihan militer yang terinspirasi oleh model Soviet."
 BUL_soviet_bulgarian_war_industry: "Industri Perang Soviet-Bulgaria"
 BUL_soviet_bulgarian_war_industry_desc: "Jika kita ingin meletakkan dasar bagi industri militer nasional yang mampu mendukung pasukan dalam jumlah besar, kita harus menyerukan kerja sama Soviet yang lebih besar dalam pengembangan dan produksi senjata modern."
 BUL_carry_the_revolution_abroad: "Membawa Revolusi ke Luar Negeri"
 BUL_carry_the_revolution_abroad_desc: "Bulgaria harus menjadi garda depan revolusi komunis di Balkan. Kami akan mengundang pemerintah-pemerintah yang berpikiran sama untuk bergabung dengan aliansi kami, dan kami akan mengambil tanggung jawab untuk membawa revolusi dengan kekerasan ke negara-negara tetangga kami."
 BUL_liberation_of_the_proletariat: "Pembebasan Proletariat"
 BUL_liberation_of_the_proletariat_desc: "Adalah tugas kita untuk mengakhiri rezim penindasan yang dialami kelas pekerja di negara-negara tetangga. Tentara rakyat Bulgaria tidak akan berhenti sampai pemerintahan tirani ini digulingkan, bahkan jika mereka harus berperang melawan negara-negara besar Eropa yang mendukung mereka."
 BUL_the_anti_capitalist_fight: "Pertarungan Anti-Kapitalis"
 BUL_the_anti_capitalist_fight_desc: "Sepanjang sejarah, negara-negara yang disebut sebagai negara demokrasi besar di Eropa telah mencampuri urusan perekonomian dan perbatasan negara-negara Balkan, hanya mementingkan kepentingan mereka sendiri dan tidak peduli terhadap konflik berdarah yang mereka timbulkan. Namun sudah tiba waktunya bagi kaum kapitalis busuk untuk menghilang, karena kini giliran Bulgaria yang mendikte perekonomian, pemerintahan, dan perbatasannya."
 BUL_united_we_shall_prevail: "Bersatu, Kita Akan Menang!"
 BUL_united_we_shall_prevail_desc: "Balkan telah lama menjadi sasaran negara-negara asing, namun sekaranglah waktunya bagi rakyat kita untuk bersatu melawan penjajah dan memperjuangkan tanah yang, menurut hak mereka, adalah milik kita."
 BUL_the_unification_of_the_balkans: "Penyatuan Balkan"
 BUL_the_unification_of_the_balkans_desc: "Saatnya telah tiba untuk mewujudkan visi kami tentang Federasi Balkan yang bersatu dan mandiri di mana semua warga negara setara dan dapat bergerak bebas tanpa memandang asal usul, budaya, atau keyakinan."
 BUL_the_peoples_militia_directorate: "Direktorat Milisi Rakyat"
 BUL_the_peoples_militia_directorate_desc: "Kami akan membentuk Direktorat Milisi Rakyat, di bawah kendali langsung Kementerian Dalam Negeri, yang bertugas menangani keamanan politik, menjaga ketertiban umum, dan melakukan investigasi kriminal."
 BUL_purge_the_elites: "Bersihkan Para Elit"
 BUL_purge_the_elites_desc: "Sudah waktunya bagi kelas-kelas istimewa di Bulgaria untuk berhenti menimbun kekayaan mereka. Jika kita ingin negara dan perekonomian kita sejahtera, maka orang kaya perlu membagi apa yang mereka miliki kepada mereka yang tidak punya apa-apa, dan bukan kepada bank."
 BUL_collectivization_of_the_countryside: "Kolektivisasi Pedesaan"
 BUL_collectivization_of_the_countryside_desc: "Krisis dalam distribusi pertanian telah menyebabkan keresahan besar di Bulgaria pada masa lalu, dan solusi terhadap masalah ini terletak pada penggantian lahan pertanian yang dimiliki secara individual dengan pertanian yang dioperasikan secara kolektif, sebuah proses yang telah berhasil dilakukan di Uni Soviet."
 BUL_heavy_industry: "Industri Berat"
 BUL_heavy_industry_desc: "Menyusul keberhasilan reorganisasi pertanian, kami akhirnya mampu melaksanakan program industrialisasi yang modern dan ambisius di Bulgaria."
 BUL_train_the_youth_wings: "Latih Sayap Pemuda"
 BUL_train_the_youth_wings_desc: "Untuk menutupi kekurangan tenaga kerja di angkatan bersenjata kita, kita harus memberikan kursus pelatihan dasar untuk memberikan instruksi kepada anggota sayap pemuda kita dalam penggunaan senjata dan taktik militer sehingga mereka dapat memperkuat barisan kita jika diperlukan."
 BUL_treaty_of_perpetual_friendship: "Perjanjian Persahabatan Abadi"
 BUL_treaty_of_perpetual_friendship_desc: "Sebagai langkah pertama dalam mengembangkan hubungan baik dengan tetangga kita di Balkan, kita harus mendekati pemerintah Yugoslavia dengan proposal untuk menandatangani sebuah perjanjian yang menjadi dasar kerja sama antara negara-negara kita dan yang dengannya [ROOT.GetNameDef] akhirnya meninggalkan klaim irredentisnya di [YUG.GetNameDef]."
 BUL_balkan_federation_of_socialist_republics: "Federasi Republik Sosialis Balkan"
 BUL_balkan_federation_of_socialist_republics_desc: "Proyek Federasi Balkan gagal pada tahun 1920-an karena aspirasi nasionalis dari berbagai anggotanya. Namun zaman telah berubah, dan kita harus menunjukkan proyek federasi baru kita ke negara-negara Balkan lainnya, dimulai dengan [YUG.GetNameDef]."
 BUL_bury_the_grudges_of_the_past: "Kubur Dendam Masa Lalu"
 BUL_bury_the_grudges_of_the_past_desc: "Inilah saatnya untuk melupakan perselisihan di masa lalu dan mulai menatap masa depan solidaritas dan kerja sama di Balkan. Kita harus mendesak tetangga kita untuk bergabung dengan [GetFederationOrConfederation] kita, karena proyek kita untuk menyatukan Balkan tidak akan lengkap tanpa mereka."
 BUL_balkan_trade_union_secretariat: "Sekretariat Serikat Buruh Balkan"
 BUL_balkan_trade_union_secretariat_desc: "Kita harus membentuk Sekretariat Serikat Pekerja yang menentukan arahan yang harus diikuti oleh serikat pekerja yang berbeda, dengan tujuan untuk meningkatkan perekonomian dan membina kerja sama antar negara [GetFederationOrConfederation] kita."
 BUL_defy_moscow: "Menentang Moskow"
 BUL_defy_moscow_desc: "Uni Soviet telah lama mendapatkan keuntungan dari persaingan antara negara-negara Balkan, dan tidak ragu untuk ikut campur dalam politik kita jika itu demi kepentingan mereka. Sekarang adalah waktunya bagi [GetFederationOrConfederation] kita untuk menyerang sebelum pemerintah Soviet menyadari bahwa blok Balkan kita yang bersatu berada dalam posisi untuk menantang hegemoni Moskow."
 BUL_balkan_research_cooperation: "Kerjasama Penelitian Balkan"
 BUL_balkan_research_cooperation_desc: "Kita harus mengembangkan program kerja sama yang memungkinkan para ilmuwan dari berbagai negara di [GetFederationOrConfederation] kita untuk berbagi penemuan mereka dan mendorong kemajuan teknologi baru."
 BUL_recover_italian_territories: "Pulihkan Wilayah Italia"
 BUL_recover_italian_territories_desc: "Sebelum ambisi teritorial Italia melangkah lebih jauh, kita harus menuntut agar pemerintah Italia mengalihkan kendali atas wilayah-wilayah pendudukan di Balkan ke negara-negara yang secara sah memiliki wilayah-wilayah tersebut, atau kita akan menghadapi konsekuensinya."
 BUL_democratic_principles: "Prinsip Demokrasi"
 BUL_democratic_principles_desc: "Meskipun tujuan utama kami adalah mengakhiri rezim otoriter Tsar, kami tidak bisa membiarkan pemerintahan komunis totaliter didirikan sebagai penggantinya. Kita harus tetap setia pada cita-cita demokrasi dan berupaya meningkatkan pengaruh menteri-menteri yang berpikiran sama dalam pemerintahan."
 BUL_legalize_the_agrarian_party: "Mendukung Serikat Agraria"
 BUL_legalize_the_agrarian_party_desc: "Ide-ide Persatuan Nasional Agraria Bulgaria dalam bidang ekonomi mungkin sedikit berbeda dengan kita, namun jika kita mengabaikan hal-hal sepele ini, para anggotanya dapat menyesuaikan diri dengan kebijakan-kebijakan kita. Oleh karena itu, kita harus melegalkan organisasi ini dan mengupayakan kerja sama di antara partai-partai kita, karena jika kita ingin memimpin Bulgaria menuju demokrasi yang sesungguhnya, kita memerlukan semua dukungan yang bisa kita peroleh..."
 BUL_form_a_popular_bloc: "Bentuk Blok Populer"
 BUL_form_a_popular_bloc_desc: "Untuk membentuk blok persatuan yang kuat melawan otoritarianisme dan penindasan di [ROOT.GetNameDef], kita harus bersandar pada kebijakan sosialis dan mengupayakan kohesi antara kelompok politik sayap kiri yang bersedia melawan rezim fasis dan monarki."
 BUL_abolish_the_monarchy: "Hapuskan Monarki"
 BUL_abolish_the_monarchy_desc: "Monarki mungkin merupakan alat yang berguna dalam menjaga stabilitas di Bulgaria selama tahun-tahun awal Negara Ketiga Bulgaria, namun setelah perang yang menghancurkan dan rezim tirani, masyarakat telah kehilangan kepercayaan terhadap sistem pemerintahan kuno ini. Waktunya telah tiba untuk menghapuskannya."
 BUL_seek_cooperation_with_the_tsar: "Mencari Kerja Sama dengan Tsar"
 BUL_seek_cooperation_with_the_tsar_desc: "Tsar masih memegang terlalu banyak kekuasaan dalam pemerintahan dan dapat menghalangi semua usulan kita jika diprovokasi, jadi pilihan terbaik kita adalah mencoba bekerja sama dengannya sementara kita secara bertahap meningkatkan pengaruh kita dalam pemerintahan."
 BUL_legislative_elections: "Pemilu Legislatif"
 BUL_legislative_elections_desc: "Partai Demokrat Bulgaria telah memperoleh dukungan besar-besaran dan kini berada dalam posisi untuk menekan pemerintah agar mengadakan pemilihan parlemen, kali ini bebas dari kecurangan yang telah mereka lakukan selama bertahun-tahun."
 BUL_petorka: "Petorkata"
 BUL_petorka_desc: "Kami telah menerima usulan untuk bekerja sama dengan kelompok politik tertentu yang, seperti kami, berupaya mempertahankan prinsip-prinsip demokrasi melawan semua kekuatan politik yang berusaha mendirikan rezim diktator, baik rezim Tsar, fasis, atau komunis. Koalisi ini akan terdiri dari lima organisasi, termasuk Partai Demokrat Radikal, Partai Liberal Nasional dan, tentu saja, Partai Demokrat Bulgaria."
 BUL_land_reorganization: "Reorganisasi Tanah"
 BUL_land_reorganization_desc: "Sudah waktunya untuk melakukan reorganisasi industri dan agraria, sesuai dengan rencana kita untuk melaksanakan serangkaian reformasi baru untuk memperkuat sektor-sektor ini dalam waktu dekat."
 BUL_agrarian_cooperative_movement: "Gerakan Koperasi Agraria"
 BUL_agrarian_cooperative_movement_desc: "Kita harus mengambil inspirasi dari langkah-langkah agraria yang diusulkan oleh Persatuan Nasional Agraria dan mendorong organisasi pedesaan berdasarkan koperasi."
 BUL_modernize_the_industry: "Modernisasikan Industri"
 BUL_modernize_the_industry_desc: "Jika kita ingin menjadikan diri kita sebagai kekuatan industri terkemuka di Balkan, kita harus berusaha memodernisasi industri kita! Peningkatan alokasi anggaran dan perbaikan alat akan mewujudkan impian kita."
 BUL_the_salonika_agreement: "Perjanjian Salonika"
 BUL_the_salonika_agreement_desc: "Jelas bahwa Bulgaria sendiri tidak menimbulkan ancaman apa pun terhadap negara-negara yang membentuk Entente Balkan untuk menghadapi negara kita bersama-sama, jadi kita harus mencoba membangun kembali hubungan persahabatan dengan tetangga kita, dan cara apa yang lebih baik untuk memulai selain menandatangani perjanjian dengan pemimpin [GRE.GetNameDef], [GRE.GetLeader]?"
 BUL_a_balkan_confederation: "Konfederasi Balkan"
 BUL_a_balkan_confederation_desc: "Alasan yang menyebabkan terbentuknya Balkan Entente kini sudah ketinggalan zaman. Di masa yang penuh gejolak ini, negara-negara Balkan harus meninggalkan konflik masa lalu dan bersatu untuk mempertahankan diri melawan kekuatan asing yang berusaha menundukkan mereka."
 BUL_approach_the_united_kingdom: "Pendekatan ke Inggris"
 BUL_approach_the_united_kingdom_desc: "[ROOT.GetNameDef] membutuhkan perlindungan dari kekuatan demokrasi besar di Eropa jika ingin bertahan di masa yang tidak menentu ini. Kita harus bertemu dengan pemerintah [ENG.GetAdjective] untuk merundingkan perjanjian kerja sama antar negara kita."
 BUL_join_the_allies: "Bergabunglah dengan Sekutu"
 BUL_join_the_allies_desc: "Kita harus meresmikan keinginan kita untuk bergabung dengan [ENG.GetFactionName] dengan mengajukan permohonan kepada pemerintah [ENG.GetAdjective] untuk mempertimbangkan keanggotaan [ROOT.GetNameDef] dalam aliansi mereka."
 BUL_consolidate_the_third_bulgarian_state: "Konsolidasikan Negara Bulgaria Ketiga"
 BUL_consolidate_the_third_bulgarian_state_desc: "Setelah sekian lama mengalami konflik sosial, depresi ekonomi, dan perselisihan internasional, kami akhirnya siap untuk menstabilkan dan memperkuat Negara Bulgaria Ketiga."
 BUL_free_balkan_states: "Negara Balkan Merdeka"
 BUL_free_balkan_states_desc: "Adalah tugas kita sebagai negara Balkan untuk melindungi negara-negara tetangga kita yang lebih lemah dari ambisi negara mana pun yang berupaya menginvasi tanah kita. Kita harus mengembangkan kerja sama di antara negara-negara sahabat di kawasan dan mempersiapkan pertahanan Balkan."
 BUL_fight_tyranny: "Lawan Tirani"
 BUL_fight_tyranny_desc: "Inilah saatnya untuk menghadapi kekuatan-kekuatan besar Eropa yang menganut kebijakan fasis yang mengkhawatirkan dan yang para pemimpinnya tidak memimpikan apa pun selain memperluas wilayah kekuasaan mereka dan menundukkan dunia."
 BUL_assert_our_claims: "Tegaskan Klaim kami"
 BUL_assert_our_claims_desc: "Sudah waktunya untuk mengatasi masalah teritorial yang telah melanda negara kita selama beberapa dekade. Kita harus mencari dukungan dari pemerintah [ENG.GetAdjective] untuk memperbaiki penghinaan yang dilakukan terhadap Bulgaria sejak pembebasannya."
 BUL_appeal_to_european_capitalists: "Seruan kepada Kapitalis Eropa"
 BUL_appeal_to_european_capitalists_desc: "[ROOT.GetNameDef] membutuhkan suntikan modal baru untuk merangsang perkembangan industri nasional dan menegosiasikan kembali utangnya dengan perusahaan multinasional besar yang sudah berinvestasi di negara tersebut."
 BUL_obliterate_the_bolshevik_threat: "Hilangkan Ancaman Bolshevik"
 BUL_obliterate_the_bolshevik_threat_desc: "Cepat atau lambat, negara-negara komunis akan berusaha membawa revolusi terkutuk mereka ke [ROOT.GetNameDef]. Mengapa harus menunggu sepak terjang Bolshevik jika kita bisa memanfaatkan elemen kejutannya? Kita harus menjadi pihak pertama yang melakukan serangan, dan kita harus melakukan serangan dengan keganasan yang sedemikian rupa sehingga revolusi yang mereka cintai hancur untuk selama-lamanya!"
 BUL_research_sharing: "Berbagi Penelitian"
 BUL_research_sharing_desc: "Negara kita tertinggal dalam bidang penelitian ilmiah. Jika kita ingin memproduksi mesin perang tercanggih dan mengembangkan industri modern, kita harus mengusulkan kepada sekutu kita penerapan program kerja sama teknologi."
 BUL_power_to_the_tsar: "Kekuasaan untuk Tsar"
 BUL_power_to_the_tsar_desc: "Zveno mendirikan rezim militer otoriter sebelum digulingkan oleh Tsar Boris III pada tahun 1935. Namun Tsar tetap mempertahankan sentralisasi kekuasaan ini dan inilah saatnya untuk memanfaatkannya, jika kita ingin menyatukan negara yang terpecah."
 BUL_condemn_macedonian_organizations: "Mengutuk Organisasi Makedonia"
 BUL_condemn_macedonian_organizations_desc: "Kita harus menyatakan ketidaksenangan kita terhadap IMRO dan mulai berupaya memburu dan melenyapkan sel-sel revolusioner Makedonia yang masih beroperasi di Bulgaria, dan pada akhirnya mengakhiri apa yang dimulai Zveno pada tahun 1934 dan meningkatkan hubungan luar negeri kita dengannya."
 BUL_support_macedonian_organizations: "Mendukung Organisasi Makedonia"
 BUL_support_macedonian_organizations_desc: "Jika kita ingin mewujudkan impian kita untuk menyatukan dan mencaplok Makedonia, akan lebih bermanfaat jika kita bekerja sama dengan para pemimpin IMRO di pengasingan yang dapat membuka jalan bagi potensi pendudukan Bulgaria atas Makedonia di masa depan."
 BUL_dissolve_the_military_union: "Bubarkan Persatuan Militer"
 BUL_dissolve_the_military_union_desc: "Zveno memiliki pengaruh yang terlalu besar terhadap para perwira kami, dan terdapat kebencian yang nyata di antara para perwira kami setelah Tsar Boris menggulingkan mereka dari kekuasaan pada tahun 1935. Jika kami ingin menghindari kudeta Zveno yang baru, kami harus mengumpulkan para perwira kami di Sofia dan mengumumkan pembubaran Persatuan Militer."
 BUL_cooperate_with_the_zveno: "Bekerja sama dengan Zveno"
 BUL_cooperate_with_the_zveno_desc: "Kita harus bekerja sama dengan Zveno, bukannya memusuhi mereka. Jika kita memutuskan untuk memberi mereka konsesi, kita bisa mendapatkan sekutu yang kuat."
 BUL_the_tsars_regime: "Rezim Tsar"
 BUL_the_tsars_regime_desc: "Negara kita terpecah menjadi beberapa faksi, gerakan sosial dan organisasi politik terlarang. Tsar harus menerapkan otoritas penuhnya jika ia ingin membawa kohesi dan stabilitas ke Bulgaria."
 BUL_restrained_paramilitary_organizations: "Organisasi Paramiliter yang Terkendali"
 BUL_restrained_paramilitary_organizations_desc: "Anggota organisasi paramiliter adalah individu setia yang telah memiliki disiplin militer dan siap berperang demi kejayaan negara kita. Jika kita bisa memikat organisasi-organisasi ini, mereka bisa menjadi sumber tenaga kerja yang dapat diandalkan."
 BUL_ban_far_right_organizations: "Larang Organisasi Sayap Kanan"
 BUL_ban_far_right_organizations_desc: "Kelompok radikal sayap kanan tidak segan-segan menggunakan kekerasan terhadap otoritas, karena hal ini merupakan ancaman besar bagi pemerintah dan warga negara kita. Kita harus melarang semua gerakan sosial seperti ini dan membubarkan organisasi paramiliter yang terkait."
 BUL_restore_the_tarnovo_constitution: "Kembalikan Konstitusi Tarnovo"
 BUL_restore_the_tarnovo_constitution_desc: "Sejak kudeta tahun 1934, negara bagian ini diatur berdasarkan konstitusi yang ditangguhkan secara de facto. Sudah saatnya kita secara resmi memulihkan Konstitusi Tarnovo, yang tidak hanya menyenangkan warga negara kita, tetapi juga secara hukum mendukung rezim otoriter kita."
 BUL_freedom_of_press: "Kebebasan Pers"
 BUL_freedom_of_press_desc: "Sekarang setelah konstitusi dipulihkan, kita harus menjamin hak dan prinsipnya. Mengizinkan distribusi surat kabar yang saat ini dilarang dapat menjadi langkah pertama dalam menjalin kerja sama dengan organisasi tertentu."
 BUL_promote_bulgarian_nationalism: "Mempromosikan Nasionalisme Bulgaria"
 BUL_promote_bulgarian_nationalism_desc: "Mungkin ada banyak sekali ancaman terhadap bangsa kita, baik dari luar maupun dari dalam negeri, namun jika kita, rakyat Bulgaria, berdiri bersama dan bekerja berdampingan, kita akan menang dalam masa-masa penuh gejolak di masa depan!"
 BUL_crush_the_communists: "Hancurkan Komunis"
 BUL_crush_the_communists_desc: "Meskipun telah ditindas berkali-kali sepanjang abad ini, komunis masih bersembunyi di balik bayang-bayang, memangsa kelompok yang sengsara dan terbuang untuk mempertebal barisan mereka. Adalah tugas kita untuk menghabisi mereka untuk selamanya, dengan cara apa pun yang diperlukan..."
 BUL_illusions_of_a_non_partisan_system: "Ilusi Sistem Non-Partisan"
 BUL_illusions_of_a_non_partisan_system_desc: "Tsar membutuhkan dukungan dari rakyatnya yang demokratis untuk mewujudkan visinya tentang Bulgaria yang bersatu. Kita harus mempertahankan pemilu parlemen yang hanya ilusi, melarang partai oposisi populer, dan memastikan kandidat pro-pemerintah memenangkan mayoritas kursi."
 BUL_limited_womens_suffrage: "Hak Pilih Perempuan Terbatas"
 BUL_limited_womens_suffrage_desc: "Perempuan Bulgaria menyerukan kemajuan sosial dan kesetaraan, dan kaum nasionalis telah memperingatkan bahwa perjuangan ini bukan hanya persoalan perempuan, namun juga persoalan pembangunan sosial dan pembangunan bangsa. Oleh karena itu, untuk mengikuti jalur kemajuan sambil mempertahankan kontrol politik penuh, kami akan memberikan hak suara bersyarat kepada perempuan non-komunis yang sudah menikah."
 BUL_found_the_brannik: "Menemukan Brannik"
 BUL_found_the_brannik_desc: "Bogdan Filov mempunyai usulan menarik untuk mendirikan organisasi pemuda nasional pro-fasis, bernama Brannik, dekat dengan pihak berwenang dan setia kepada Tsar, meniru organisasi pemuda Jerman lainnya. Filov percaya bahwa Brannik bisa menjadi besar, memberi kita sumber tenaga kerja yang besar.\n\"Boris, Bulgaria, Tuhan!\""
 BUL_bulgarian_irredentism: "Irredentisme Bulgaria"
 BUL_bulgarian_irredentism_desc: "Nasionalisme Bulgaria menyerukan perlunya mengubah perbatasan Balkan demi kepentingan Bulgaria, dan bahkan kaum komunis dan demokrat pun akan menyetujui hal tersebut. Kita harus menekankan perlunya memulihkan Bulgaria Raya, yang merupakan tujuan bersama bagi seluruh rakyat kita."
 BUL_strengthen_the_royal_dictatorship: "Memperkuat Kediktatoran Kerajaan"
 BUL_strengthen_the_royal_dictatorship_desc: "Kita harus fokus untuk meningkatkan kesetiaan kepada Boris dan memberantas semua oposisi terhadap rezim. Dengan demikian membuka jalan bagi Tsar Unifier untuk akhirnya membawa kejayaan yang layak bagi bangsa kita tercinta."
 BUL_war_industry: "Industri Perang"
 BUL_war_industry_desc: "Tentara yang berperang memerlukan aliran peralatan, senjata, dan pesawat terbang yang konstan. Jika kita ingin menang dalam konflik ini, kita perlu meningkatkan produksi militer untuk memberi makan pasukan kita."
 BUL_liberalization_of_trade_policies: "Liberalisasi Kebijakan Perdagangan"
 BUL_liberalization_of_trade_policies_desc: "Perekonomian Bulgaria telah terhuyung-huyung dari satu krisis ke krisis berikutnya sejak kemerdekaannya dari Kekaisaran Ottoman. Kebijakan autarkis terbukti tidak memadai di masa lalu, sehingga sekarang saatnya untuk beralih ke liberalisasi ekonomi."
 BUL_plot_against_boris: "[GetPlotAgainstBorisFocusName]"
 BUL_plot_against_boris_plot: "Plot Melawan Boris"
 BUL_plot_against_boris_death: "Kematian Tsar Boris"
 BUL_plot_against_boris_desc: "[GetPlotAgainstBorisFocusDesc]"
 BUL_plot_against_boris_desc_plot: "Kami mengira Tsar Boris adalah raja yang akan memimpin negara menuju kejayaan, namun rezim otoriternya, yang mendekati kediktatoran, membuktikan bahwa kami salah dan mengancam akan semakin mengacaukan stabilitas negara. Adalah tugas kita sebagai pelayan setia Bulgaria untuk menyingkirkan negara kita dari penguasa yang tidak layak ini dan membentuk pemerintahan baru yang layak mendapatkan kepercayaan rakyat."
 BUL_plot_against_boris_desc_death: "[GetBorisDeathContext]"
 BUL_form_a_regency_council: "Membentuk Dewan Kabupaten"
 BUL_form_a_regency_council_desc: "Setelah kematian Tsar Boris, dan karena ahli warisnya adalah [GetSimeonsAge], Dewan Kabupaten harus ditunjuk untuk menjalankan pemerintahan negara atas nama Simeon II muda."
 BUL_the_return_of_ferdinand_i: "Kembalinya Tsar Ferdinand I"
 BUL_the_return_of_ferdinand_i_desc: "Meskipun usianya sudah lanjut dan fakta bahwa ia terpaksa turun tahta pada tahun 1918 setelah kekalahan Bulgaria dalam Perang Besar, pengalaman politik dan keterampilan militer mantan Tsar Ferdinand I menjadikannya kandidat yang paling cocok untuk memimpin bangsa menuju kejayaan. Kita harus membuat pengaturan yang diperlukan untuk mengembalikan Ferdinand ke tahta Bulgaria."
 BUL_amend_old_grudges: "Ubah Dendam Lama"
 BUL_amend_old_grudges_desc: "Ini adalah waktu yang tepat untuk membalas semua kerusakan dan penghinaan yang menimpa Bulgaria oleh banyak musuhnya di masa lalu, mulai dari pengkhianat Rumania dan Turki yang menikam kita dari belakang selama Perang Balkan Kedua hingga kekuatan Entente yang mengalahkan kita dalam perang besar dan telah menghambat pembangunan negara kita sejak saat itu."
 BUL_the_fate_of_the_balkans: "Nasib Balkan"
 BUL_the_fate_of_the_balkans_desc: "Bulgaria sudah terlalu lama tunduk pada kehendak negara-negara tetangganya dan negara-negara besar Eropa yang mendukung mereka... Namun waktu telah berubah, negara kita telah tumbuh lebih kuat dibandingkan negara-negara Balkan lainnya, dan Bulgaria pada akhirnya cukup kuat untuk menegaskan supremasinya dan menaklukkan negara-negara menyedihkan yang mengelilinginya."
 BUL_toppling_giants: "Menggulingkan Raksasa"
 BUL_toppling_giants_desc: "Sepanjang sejarah, negara-negara yang sedang berkembang telah meruntuhkan kerajaan-kerajaan besar yang telah lama berdiri. Jika [ROOT.GetNameDef] ingin menjadi kekuatan besar berikutnya di Eropa, pertama-tama kita harus menantang hegemoni kekuatan lain yang ada dalam genggaman kita."
 BUL_nationalist_propaganda: "Propaganda Nasionalis"
 BUL_nationalist_propaganda_desc: "Masih ada sebagian masyarakat Bulgaria yang menentang peran Bulgaria sebagai kekuatan dominan di Balkan, dengan menyatakan bahwa kebijakan pemerintah \"sangat menindas\". Untuk membungkam suara-suara ini, kita harus mendanai kampanye propaganda yang akan membantu kita membenarkan tindakan pemerintah dan menghidupkan kembali nasionalisme Bulgaria."
 BUL_bulgarian_academy_of_sciences: "Akademi Ilmu Pengetahuan Bulgaria"
 BUL_guardians_of_the_balkans: "Penjaga Balkan"
 BUL_guardians_of_the_balkans_desc: "Kita harus menjaga hegemoni Bulgaria di Balkan melawan kekuatan musuh yang berani menantangnya, oleh karena itu kita akan melipatgandakan upaya militer kita dan mendesak pemerintah boneka kita di Balkan untuk bertindak serupa guna membantu kita mempertahankan wilayah kekuasaan kita."
 BUL_consolidate_dominance_of_the_seas: "Konsolidasikan Dominasi Lautan"
 BUL_consolidate_dominance_of_the_seas_desc: "Jika kita ingin mengamankan Balkan, tidak cukup hanya dengan mengerahkan pasukan dalam jumlah besar di semenanjung tersebut, kita juga perlu membangun angkatan laut yang kuat yang menjaga laut di sekitarnya."
 BUL_appoint_right_wing_ministers: "Tunjuk Menteri Sayap Kanan"
 BUL_appoint_right_wing_ministers_desc: "Rezim Tsar, meskipun membantu dalam menjalankan kontrol yang kuat atas negara tersebut, tidak memiliki tujuan nyata untuk memperbaiki situasi Bulgaria di kancah internasional. Kita harus memanfaatkan sifat otoriter sistem saat ini untuk menunjuk menteri baru yang siap melakukan perubahan politik dan sosial yang benar-benar dibutuhkan Bulgaria."
 BUL_the_path_towards_a_greater_bulgaria: "Jalan Menuju Bulgaria Raya"
 BUL_the_path_towards_a_greater_bulgaria_desc: "Kita harus mulai menyesuaikan perekonomian kita agar dapat menahan mobilisasi tentara Bulgaria yang akan segera terjadi. Karena jalan menuju Bulgaria yang lebih luas dilanda perang dan konflik."
 BUL_depose_the_tsar: "Singkirkan Tsar"
 BUL_depose_the_tsar_desc: "Monarki Bulgaria telah menjadi beban yang hanya dapat menghambat kita dalam mencapai tujuan kita. Kegunaan Tsar telah berakhir dan inilah waktunya untuk menyingkirkannya."
 BUL_military_dictatorship: "Kediktatoran Militer"
 BUL_military_dictatorship_desc: "Kita harus mengambil kendali penuh atas negara ini dan memerintahnya di bawah rezim otoriter militeristik yang memungkinkan kita mengambil tindakan yang diperlukan untuk melanjutkan upaya militer kita."
 BUL_support_the_spanish_coup: "Mendukung Kudeta Spanyol"
 BUL_support_the_spanish_coup_desc: "Teater pertama dalam perang melawan Bolshevisme adalah Spanyol. Jika kita secara resmi mendukung pemberontakan militer dan mengorganisir sekelompok sukarelawan untuk mendukung pihak pemberontak, perang saudara di Spanyol bisa menjadi ajang uji coba yang sempurna bagi pasukan kita."
 BUL_allow_far_right_organizations: "Izinkan Organisasi Sayap Kanan"
 BUL_allow_far_right_organizations_desc: "Melegalkan organisasi sayap kanan tertentu, seperti Gerakan Sosial Nasional atau Ratnik, dapat memberi kita sekutu yang membantu dan setia yang mendukung rezim dan cita-cita kita."
 BUL_integrate_the_ratniks: "Integrasikan Ratnik"
 BUL_integrate_the_ratniks_desc: "Ratniks, atau Persatuan Prajurit untuk Kemajuan Bulgaria adalah organisasi paramiliter nasionalis yang baru didirikan dan terbukti menjadi alat yang sangat berguna dalam memberikan dukungan kepada rezim dan sejumlah besar tenaga kerja untuk tentara."
 BUL_economic_protectionism: "Proteksionisme Ekonomi"
 BUL_economic_protectionism_desc: "Kita harus menerapkan reformasi baru untuk meningkatkan perekonomian dan industri nasional, sekaligus melindungi sektor-sektor dasar di Bulgaria seperti pertanian dan kerajinan tangan."
 BUL_industrial_autarky: "Autarki Industri"
 BUL_industrial_autarky_desc: "Reformasi proteksionis yang kita lakukan telah sangat berhasil dalam meningkatkan perekonomian dan industri negara ini, sehingga kita harus melanjutkan tindakan ini dan menerapkan reformasi baru yang membawa Bulgaria semakin dekat menuju autarki."
 BUL_corporatism: "Korporatisme"
 BUL_corporatism_desc: "Terinspirasi oleh model Italia, pekerja dan kapitalis dari berbagai sektor ekonomi harus berpartisipasi dalam pembuatan kebijakan nasional, sehingga kita dapat menjadi perantara antara kelompok-kelompok tersebut dan melaksanakan reformasi yang paling bermanfaat bagi perekonomian nasional."
 BUL_approach_germany: "Dekati Jerman"
 BUL_approach_germany_desc: "Sementara Inggris dan Perancis terus-menerus mencekik perekonomian kami sejak dipermalukan dalam Perjanjian Neuilly, Jerman tidak hanya menunjukkan tanda-tanda mengakui klaim teritorial kami, namun juga membantu kami melunasi utang dan membeli sebagian besar hasil panen kami, meningkatkan perekonomian kami dan memungkinkan kami melakukan reformasi industri dan agraria yang penting."
 BUL_approach_germany_foreign_industry_tt: "Mengurangi biaya pengambilan keputusan untuk §YPerjanjian Luar Negeri§! dengan [GER.GetNameDef] dan meningkatkan batas pabrik [GER.GetAdjective]."
 BUL_approach_british_foreign_industry_tt: "Mengurangi biaya pengambilan keputusan untuk §YPerjanjian Luar Negeri§! dengan [ENG.GetNameDef] dan meningkatkan batas pabrik [ENG.GetAdjective]."
 BUL_approach_soviet_foreign_industry_tt: "Mengurangi biaya pengambilan keputusan untuk §YPerjanjian Luar Negeri§! dengan [SOV.GetNameDef] dan meningkatkan batas pabrik [SOV.GetAdjective]."
 BUL_cooperation_with_italy: "Kerjasama dengan Italia"
 BUL_cooperation_with_italy_desc: "Orang Italia telah beberapa kali menunjukkan minat ekonomi mereka terhadap negara kita, dan kita tidak boleh melupakan pernikahan kerajaan antara Tsar Boris dan putri Giovanni. Kami akan memperkuat hubungan diplomatik dan ekonomi dengan mereka, karena mereka bisa menjadi sekutu kuat di Balkan dalam waktu dekat."
 BUL_join_the_tripartite_pact: "Bergabunglah dengan [GetGermanFactionName]"
 BUL_join_the_tripartite_pact_axis: "Pakta Tripartit"
 BUL_join_the_tripartite_pact_central_powers: "Kekuatan Sentral"
 BUL_join_the_tripartite_pact_desc: "[GetJoinTripartitePactFocusDesc]"
 BUL_join_the_tripartite_pact_desc_axis: "Kami akan memberitahu Jerman bahwa kami siap dan bersedia menandatangani [GetGermanFactionName] dan secara resmi bergabung dengan faksi mereka sebagai sekutu."
 BUL_join_the_tripartite_pact_desc_central_powers: "Kaiser telah kembali dan kita harus berusaha membangun kembali aliansi lama kita sekali lagi. Kali ini kita akan memperbaiki kesalahan yang dilakukan terhadap negara kebanggaan kita. Kali ini tidak ada yang menghalangi kita menuju kejayaan dan kebesaran. Kali ini kita akan muncul sebagai pemenang!"
 BUL_peaceful_development: "Pembangunan yang Damai"
 BUL_peaceful_development_desc: "Untuk apa ikut berperang yang tidak akan membawa apa-apa selain kematian dan bencana bagi rakyat kita, padahal kita bisa berperan sebagai penjaga perdamaian di wilayah Balkan yang diduduki, meraup keuntungan teritorial tanpa harus mengirim satu orang pun ke kematian tertentu di medan perang terpencil?"
 BUL_military_secrets_sharing: "Berbagi Rahasia Militer"
 BUL_military_secrets_sharing_desc: "Teknologi Jerman jauh lebih unggul dibandingkan teknologi kita, dan akan sangat bermanfaat bagi kita untuk menandatangani perjanjian yang memungkinkan para ilmuwan dan insinyur Bulgaria mengakses beberapa keajaiban teknologi Jerman, sehingga membuka jalan bagi kita untuk lebih mengembangkan penelitian kita sendiri."
 BUL_bulgarian_administration_of_the_balkans: "Integrasi Bulgaria di Balkan"
 BUL_bulgarian_administration_of_the_balkans_desc: "Untuk memperkuat klaim kami atas Balkan, kami harus melakukan integrasi Bulgaria di wilayah-wilayah yang diduduki, sehingga, setelah [GetGermanFactionNameDef] kemenangan dalam perang, [GetGermanOrIndependent] dapat melihat sifat Bulgaria di wilayah tersebut dan tidak berani merusak integritas nasional kami, seperti yang dilakukan Inggris pada tahun 1878."
 BUL_bulgarian_administration_of_the_balkans_axis_name_def: "Axis"
 BUL_bulgarian_administration_of_the_balkans_central_powers_name_def: "sebuah Kekuatan Sentral"
 BUL_bulgarian_administration_of_the_balkans_independent_name_def: "milik kita"
 BUL_bulgarian_administration_of_the_balkans_germans_name: "orang Jerman"
 BUL_bulgarian_administration_of_the_balkans_everyone_name: "dunia"
 BUL_restore_the_bulgarian_patriarchate: "Kembalikan Patriarkat Bulgaria"
 BUL_restore_the_bulgarian_patriarchate_desc: "Patriark Konstantinopel harus ditekan untuk mengakui autocephaly Gereja Bulgaria dan membuat pengaturan yang diperlukan untuk mengizinkan Sinode Suci Gereja Ortodoks Bulgaria memilih seorang Metropolitan, yang akan menjadi Patriark Bulgaria."
 BUL_total_war: "Perang Total"
 BUL_total_war_desc: "Kita harus meresmikan klaim teritorial kita di Rumania dengan tujuan memastikan sumber minyak yang dapat digunakan untuk mempertahankan upaya perang kita, karena [ROOT.GetNameDef] akhirnya siap melancarkan perang habis-habisan melawan musuh-musuh sekutunya."
 BUL_the_eastern_front: "Front Timur"
 BUL_the_eastern_front_desc: "Hingga saat ini, warga negara kami enggan membiarkan adanya permusuhan terhadap para pembebas rakyat Bulgaria. Namun perang dahsyat antara sekutu kami dan [SOV.GetNameDef] telah mengubah pola pikir banyak mantan pengkritik, yang kini mendukung usulan kami untuk bergabung dengan Front Timur."
 BUL_the_third_bulgarian_empire: "Kekaisaran Bulgaria Ketiga"
 BUL_the_third_bulgarian_empire_desc: "Kita harus mengambil langkah terakhir menuju kejayaan dan kebesaran. Negara-negara yang meremehkan Bulgaria di masa lalu tidak punya pilihan selain mengakui supremasi negara kita yang perkasa.\nSaatnya memproklamirkan Kekaisaran Bulgaria Ketiga!"
 BUL_oppose_the_royal_dictatorship_tt: "Membuka keputusan untuk bekerja sama dengan [GetBsName] dan [GetBznsName].\nMembuka keputusan untuk menindas [GetBsName] dan [GetBznsName]."
 BUL_appoint_communist_ministers_tt: "Membuka keputusan untuk menekan [GetNsmName]."
 BUL_the_spanish_struggle_tt: "§YKepala Angkatan Udara§!, §YZachari Zachariev§!, akan dikirim untuk berperang dalam Perang Saudara Spanyol sebagai pilot pesawat tempur dari kelompok penerbangan sukarelawan Bulgaria. §RMemerlukan pengiriman relawan ke§! §Y[GetSpanishRepublicFlag]Republik Spanyol§!."
 BUL_spd_flag: "[SPD.GetFlag]"
 BUL_spr_flag: "[SPR.GetFlag]"
 BUL_no_spr_flag: ""
 BUL_potential_civil_war_low_requirement_tt: "§RJika§! §YStabilitas§! §Rdi bawah§! §Y30%§! §Rpada saat fokus ini selesai, perang saudara akan dimulai!§!"
 BUL_the_fatherland_front_bzns_support_requirement_tt: "Lebih dari §Y50%§! [GetBznsName] loyalitas faksi"
 BUL_the_fatherland_front_zveno_support_requirement_tt: "Lebih dari §Y50%§! [GetZvenoName] loyalitas faksi"
 BUL_the_fatherland_front_communist_support_tt: "(Mengintegrasikan faksi [GetZvenoName] dan [GetBznsName] akan semakin meningkatkan Dukungan Komunis)"
 BUL_the_peoples_republic_of_bulgaria_bs_support_requirement_tt: "Lebih dari §Y50%§! [GetBsName] loyalitas faksi"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_tt: "Jika [SOV.GetNameDefCap] menerima proposal kami:"
 BUL_collectivization_of_the_countryside_bs_support_requirement_tt: "Lebih dari §Y70%§! [GetBsName] loyalitas faksi"
 BUL_soviet_bulgarian_war_industry_research_sharing_tt: "Bonus Penelitian dari Kelompok Berbagi Teknologi meningkat sebesar §G5%§!."
 BUL_carry_the_revolution_abroad_tt: "Negara §YKomunis§! independen mana pun di Balkan akan mendapatkan acara §Y'Bulgaria mengundang kami ke faksi mereka'§!."
 BUL_the_anti_capitalist_fight_ns_tt: "Negara-negara berikut ini dianggap sebagai Negara Demokrasi Besar di Eropa:"
 BUL_the_anti_capitalist_fight_wargoal_tt: "Mendapatkan §YMenggulingkan Pemerintah§! tujuan perang melawan §Ynegara demokrasi besar di Eropa§!."
 BUL_treaty_of_perpetual_friendship_tt: "Jika [YUG.GetNameDefCap] menerima proposal kami:"
 BUL_liberation_of_the_proletariat_tt: "Mendapatkan §YMenggulingkan Pemerintah§! tujuan perang melawan tetangga §YFasis§! atau §YNon-Blok§! atau kekuatan utama Eropa:"
 BUL_condemn_macedonian_organizations_tt: "Membuka keputusan §YLawan Organisasi Revolusioner Makedonia§!."
 BUL_support_macedonian_organizations_tt: "Membuka keputusan §YMendukung Organisasi Revolusioner Makedonia§!."
 BUL_dissolve_the_military_union_tt: "Membuka keputusan untuk menekan [GetZvenoName]."
 BUL_cooperate_with_the_zveno_tt: "Membuka keputusan untuk bekerja sama dengan [GetZvenoName]."
