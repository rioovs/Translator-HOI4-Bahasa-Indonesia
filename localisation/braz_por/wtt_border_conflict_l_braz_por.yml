 wtt_border_conflict_won_attacker.1.t: "Kemenangan di [their_state.GetName]"
 wtt_border_conflict_won_attacker.1.desc: "Bentrokan di perbatasan antara [our_state.GetName] dan [their_state.GetName] menyaksikan pasukan kita meraih kemenangan telak atas pasukan [their_country.GetLeader]. Pasukan [their_country.GetAdjective] telah mundur untuk berkumpul kembali, dan pasukan kami telah menguasai wilayah yang disengketakan."
 wtt_border_conflict_won_attacker.1.a: "Kami telah menunjukkan kepada mereka kekuatan kami!"
 wtt_border_conflict_won_defender.1.t: "Kemenangan di [their_state.GetName]"
 wtt_border_conflict_won_defender.1.desc: "Bentrokan di perbatasan antara [our_state.GetName] dan [their_state.GetName] menyaksikan pasukan kita meraih kemenangan telak atas pasukan [their_country.GetLeader]. Pasukan [their_country.GetAdjective] telah mundur untuk berkumpul kembali, dan pasukan kami telah menguasai wilayah yang disengketakan."
 wtt_border_conflict_won_defender.1.a: "Kami telah menunjukkan kepada mereka kekuatan kami!"
 wtt_border_conflict_lost_attacker.1.t: "Kalah di [our_state.GetName]"
 wtt_border_conflict_lost_attacker.1.desc: "Pasukan di bawah komando [their_country.GetLeader] telah berhasil mendorong kami keluar dari wilayah sengketa antara [our_state.GetName] dan [their_state.GetName]. Pasukan kami telah mundur dengan baik dan melakukan reorganisasi jika kami ingin melanjutkan pertempuran di masa depan."
 wtt_border_conflict_lost_attacker.1.a: "Kita harus melakukan serangan balik secepat mungkin!"
 wtt_border_conflict_lost_defender.1.t: "Kalah di [our_state.GetName]"
 wtt_border_conflict_lost_defender.1.desc: "Pasukan di bawah komando [their_country.GetLeader] telah berhasil mendorong kami keluar dari wilayah sengketa antara [our_state.GetName] dan [their_state.GetName]. Pasukan kami telah mundur dengan baik dan melakukan reorganisasi jika kami ingin melanjutkan pertempuran di masa depan."
 wtt_border_conflict_lost_defender.1.a: "Kita harus melakukan serangan balik secepat mungkin!"
 wtt_border_conflict_canceled_attacker.1.t: "Kebuntuan di [their_state.GetName]"
 wtt_border_conflict_canceled_attacker.1.desc: "Pertempuran di Area [our_state.GetName]-[their_state.GetName] terhenti karena kedua belah pihak terbukti tidak mampu mengusir pihak lain. Hanya sedikit wilayah yang diperoleh kedua pihak. Pengintai melaporkan bahwa tentara [their_country.GetAdjective] di sisi lain sedang menggali medan pertahanan. Tampaknya mereka berniat untuk mempertahankan wilayah yang mereka miliki, tapi mungkin tidak akan melanggar batas kita."
 wtt_border_conflict_canceled_attacker.1.a: "Kami akan kembali."
 wtt_border_conflict_canceled_defender.1.t: "Kebuntuan di [their_state.GetName]"
 wtt_border_conflict_canceled_defender.1.desc: "Pertempuran di Area [our_state.GetName]-[their_state.GetName] terhenti karena kedua belah pihak terbukti tidak mampu mengusir pihak lain. Hanya sedikit wilayah yang diperoleh kedua pihak. Pengintai melaporkan bahwa tentara [their_country.GetAdjective] di sisi lain sedang menggali medan pertahanan. Tampaknya mereka berniat untuk mempertahankan wilayah yang mereka miliki, tapi mungkin tidak akan melanggar batas kita."
 wtt_border_conflict_canceled_defender.1.a: "Kami akan kembali."
 wtt_border_incident_defender_warning.1.t: "[From.GetNameDefCap] mengancam perbatasan kita"
 wtt_border_incident_defender_warning.1.desc: "Sebelumnya kemarin, tentara [their_country.GetAdjective] terlihat melintasi perbatasan dari [attacker_state.GetName] ke [defender_state.GetName]. Pada malam hari, lebih banyak pasukan [their_country.GetAdjective] telah masuk ke wilayah tersebut dan mendirikan posisi pertahanan di dalam wilayah kami.\n\nHal ini terjadi setelah serangkaian pertempuran kecil dan pelanggaran perbatasan oleh pasukan di bawah komando [their_country.GetLeader] di sepanjang perbatasan bersama kita.\n\nNamun kali ini, jelas bahwa pasukan [their_country.GetAdjective] akan tetap ada. Kita harus mengirimkan pasukan ke wilayah tersebut sesegera mungkin untuk memeriksa kemajuan mereka."
 wtt_border_incident_defender_warning.1.a: "Mobilisasikan semua kekuatan yang ada!"
 wtt_border_conflict_escalate_to_war.1.t: "[From.GetNameDefCap] Melakukan Mobilisasi untuk Perang"
 wtt_border_conflict_escalate_to_war.1.desc: "Laporan pengintaian menunjukkan bahwa pasukan [From.GetAdjective] berkumpul di dalam [their_state.GetName] untuk operasi besar guna mendorong lebih dalam ke [our_state.GetName]. Mengingat jumlah sumber daya yang [From.GetLeader] bersedia keluarkan untuk petualangan ini, jelas bahwa ini bukan lagi sekadar perselisihan mengenai lokasi pasti garis demarkasi.\n\nPerang skala penuh akan segera terjadi."
 wtt_border_conflict_escalate_to_war.1.a: "Kita harus siap bertemu mereka!"
