 LOW_SUPPLIES_TIPS: "Tindakan berikut dapat membantu Anda mengatasi situasi ini:\n- Sebarkan atau tugaskan kembali unit Anda untuk mengurangi konsumsi setempat.\n\n- Bangun infrastruktur tingkat lebih tinggi dan pastikan tidak ada hambatan jalur kereta api dari ibu kota.\n\n- Jika Anda memiliki cukup truk, Anda dapat memotorisasi hub di wilayah tersebut, memberikannya peningkatan batas pasokan dan jangkauan.\n\nJika pasokan di area tersebut dikirim melalui laut, Anda juga dapat:\n- Tingkatkan level pangkalan laut di provinsi asal dan tujuan.\n\n- Pastikan Anda telah membangun cukup konvoi.\n\n- Pastikan Anda mengawal konvoi dengan misi angkatan laut 'Pengawalan Konvoi' di sepanjang rute. Efisiensi pengiriman dapat menurun jika konvoi ditenggelamkan."
