 AI_MESSAGE_CAT1_MES4: "Mengalahkan $OTHER$ dengan sangat telak, sampai hampir merasa kasihan pada mereka."
 AI_MESSAGE_CAT1_MES5: "Mungkin game ini terlalu hardcore untukmu, $OTHER$. Kamu sebaiknya mencoba game kasual."
 AI_MESSAGE_CAT1_MES6: "Pasti $OTHER$ bahkan tidak menghabiskan 2 jam untuk mengatur OOB mereka. Pemula!"
 AI_MESSAGE_CAT1_MES7: "Oh lihat semua tanah $OTHER_ADJ$ yang sekarang aku miliki. Sepertinya mereka memang tidak membutuhkannya."
