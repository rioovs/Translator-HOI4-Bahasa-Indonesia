 AI_MESSAGE_CAT2_MES1: "Aku akan mem-blitz krieg-mu sampai hancur berkeping-keping, $OTHER$!"
 AI_MESSAGE_CAT2_MES2: "Sebentar lagi semua orang di $OTHER$ akan berbicara dalam bahasa $US_ADJ$."
 AI_MESSAGE_CAT2_MES3: "Lihatlah pecundang $OTHER_ADJ$ ini mencoba mengalahkan pasukan $US_ADJ$ kami yang superior."
 AI_MESSAGE_CAT2_MES4: "Kamu menyebut ini perang, $OTHER$? Aku menyebutnya jalan-jalan santai."
 AI_MESSAGE_CAT2_MES5: "Pastikan pabrik-pabrik $OTHER_ADJ$ itu tetap terawat dan terpoles, aku akan segera mengambil alihnya."
 AI_MESSAGE_CAT2_MES6: "Dengar itu, $OTHER$? Itu adalah suara betapa hebatnya aku membabatmu saat ini."
 AI_MESSAGE_CAT2_MES7: "Hei $OTHER$, mungkin kamu tidak akan sepayah ini jika berhenti mengerahkan infanteri tanpa artileri."
 AI_MESSAGE_CAT2_MES8: "Wkwk, lihat $COUNTRY$ mencoba melawanku! Seperti melihat balita memegang senapan mesin."
 AI_MESSAGE_CAT2_MES9: "Pemandangan di $COUNTRY$ sungguh indah saat ini sepanjang tahun. Pasukanku sangat menikmatinya."
 AI_MESSAGE_CAT2_MES10: "Tekan tombol menyerah sekarang juga, $COUNTRY$! Kamu hanya membuang-buang waktuku di sini."
 AI_MESSAGE_CAT3_MES1: "$OTHER|U$ itu cheater! Mustahil mereka mengalahkanku secara sah!"
 AI_MESSAGE_CAT3_MES2: "Game ini sangat tidak seimbang! Space marine $OTHER_ADJ$ mustahil dikalahkan sementara pasukan $US_ADJ$ hanyalah kertas basah."
 AI_MESSAGE_CAT3_MES3: "Halah, seolah-olah aku tidak punya hal yang lebih baik untuk dilakukan selain memainkan game bodoh ini."
 AI_MESSAGE_CAT3_MES4: "Aku tidak akan kalah dari $OTHER$ jika Paradox tidak secara sengaja memprogram mereka agar curang!"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlv PERSETAN DENGANMU $OTHER$, AKU TIDAK AKAN PERNAH BERMAIN DENGANMU LAGI!"
 AI_MESSAGE_CAT3_MES6: "GG $OTHER$, lain kali mungkin kamu bisa mencoba bertarung secara adil."
 AI_MESSAGE_CAT3_MES7: "Wah, mekanisme game yang satu itu benar-benar mengacaukanku. Pantas saja aku kalah melawan $OTHER$."
 AI_MESSAGE_CAT3_MES8: "WOW! MUNGKIN jika mereka tidak MEMBUAT $OTHER$ TERLALU OVERPOWERED DI PATCH TERAKHIR, ini akan berbeda!"
 AI_MESSAGE_CAT3_MES9: "Inilah sebabnya Hearts of Iron 3 adalah game yang lebih baik, di HOI3 $OTHER$ tidak akan pernah bisa melakukan itu."
 AI_MESSAGE_CAT3_MES10: "Ya, jadi RNG benar-benar membuatku kalah dalam perang melawan $OTHER$. Sayang sekali itu sama sekali bukan karena keahlian."
