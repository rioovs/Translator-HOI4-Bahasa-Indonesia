 ### FINLAND ###
 FIN_balance_of_power_category: "$FIN_power_balance$"
 FIN_motti_tactics_category: "Taktik Motti"
 FIN_motti_tactics_category_desc: "Strategi motti melibatkan pengepungan dan isolasi unit musuh untuk melumpuhkan jalur logistik dan komunikasi mereka.\nPenerapan pendekatan ini memerlukan perencanaan dan pelatihan yang cermat terhadap kekuatan pertahanan untuk memastikan efektivitasnya di medan perang, namun hal ini akan memungkinkan untuk mengatasi manuver musuh dan menyerang di tempat yang paling tidak mereka duga."
 FIN_prepare_motti_tactics_in_state: "Siapkan Taktik Motti di [FROM.GetName]"
 FIN_prepare_motti_tactics_in_state_desc: "Persiapan akan dilakukan untuk penerapan taktik motti di [FROM.GetName]."
 FIN_cancel_motti_tactics_in_state: "Hentikan Taktik Motti di [FROM.GetName]"
 FIN_cancel_motti_tactics_in_state_desc: "Pasukan kami tidak lagi menggunakan taktik motti di [FROM.GetName], sehingga sumber daya militer dapat dipindahkan ke tempat lain."
 FIN_motti_tactics_cost_increase_tt: "Biaya untuk keputusan §YMempersiapkan Taktik Motti§! akan §Rdikalikan§! dengan §Y[?FIN_motti_decision_cost_increase]§!."
 FIN_motti_tactics_cost_decrease_tt: "Biaya untuk keputusan §YMempersiapkan Taktik Motti§! akan §Gdibagi§! dengan §Y[?FIN_motti_decision_cost_increase]§!."
