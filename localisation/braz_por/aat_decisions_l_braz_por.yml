 DEN_bop_criticize_the_country_leader: "Mengkritik [DEN.GetLeader]"
 DEN_bop_criticize_the_country_leader_desc: "Anggota Rigsdagen mempertanyakan kepemimpinan [ROOT.GetLeader] secara tertutup, namun tampaknya tidak ada seorang pun yang bersedia melakukannya secara terbuka. Seseorang harus mengkritiknya secara terbuka dan menggalang mayoritas Rigsdagen untuk membuka jalan bagi mosi tidak percaya!"
 DEN_has_criticized_country_leader_flag: "Telah Mengkritik [DEN.GetLeader]"
 DEN_bop_defend_our_chosen_path_neutrality: "£BoP_left_texticon Pertahankan Jalan Pilihan Kita"
 DEN_bop_defend_our_chosen_path_neutrality_desc: "Baik atau buruk, kita telah memulai jalan yang sangat tidak bijaksana untuk menyimpang dari sekarang. Kita harus menaruh keyakinan pada keputusan yang telah kita buat yang membawa kita ke sini dan berharap bahwa jalan yang dipilih ini adalah jalan yang benar."
 DEN_bop_ban_all_political_uniforms: "£BoP_left_texticon Larang semua Seragam Politik"
 DEN_bop_ban_all_political_uniforms_desc: "Di seluruh Eropa, seragam politik terlihat berbaris, seolah-olah itu adalah parade militer. Dan di seluruh Eropa, kerusuhan dan ketidakstabilan politik terlihat semakin meningkat, menyeret benua ini ke dalam kekacauan. Kita harus mencegah perkembangan ini mencapai [ROOT.GetNameDef] sebelum terlambat."
 DEN_bop_unban_oppositions_uniforms: "£BoP_left_texticon Izinkan Seragam Politik Oposisi"
 DEN_bop_unban_oppositions_uniforms_desc: "Kita tidak bisa melarang penggunaan seragam politik oleh partai lain ketika pendukung kita turun ke jalan seperti peserta parade militer. Kita harus mencabut sensor ini."
 DEN_bop_defend_the_policy_of_neutrality: "£BoP_left_texticon Mempertahankan Kebijakan Netralitas"
 DEN_bop_defend_the_policy_of_neutrality_desc: "Netralitas telah memberikan manfaat yang baik bagi kita, salah satunya pada masa Perang Besar ketika peperangan berkecamuk di seluruh Eropa. Tapi tidak di sini, tidak di Denmark. Kami diselamatkan, kami terhindar. Netralitas memang bermanfaat bagi kita."
 DEN_bop_speak_out_in_favor_of_disarmament: "£BoP_left_texticon Berbicara Mendukung Perlucutan Senjata"
 DEN_bop_speak_out_in_favor_of_disarmament_desc: "Sebagai sebuah negara kecil yang dikelilingi oleh negara-negara besar, kita tidak mempunyai harapan untuk menahan kekuatan yang menyerang, jadi mengapa menghabiskan uang untuk pertahanan yang tidak akan pernah membantu kita, namun berpotensi membuat marah negara-negara tetangga kita yang jauh lebih besar?"
 DEN_bop_speak_out_against_warfare: "£BoP_left_texticon Berbicara menentang Persenjataan Kembali Militer"
 DEN_bop_speak_out_against_warfare_desc: "Mempersenjatai kembali pasukan sekarang akan menimbulkan bahaya besar bagi negara kita karena hal ini dapat dengan mudah dilihat sebagai tindakan permusuhan oleh negara-negara terdekat. Kita tidak bisa mengambil risiko membuat marah negara tetangga yang lebih besar saat ini karena kita tidak punya cara untuk membela diri melawan kekuatan militer yang jauh lebih kuat."
 DEN_bop_expand_the_welfare: "£BoP_left_texticon Memperluas Sistem Kesejahteraan"
 DEN_bop_expand_the_welfare_desc: "Daripada melakukan penghasutan perang dan membuang-buang uang untuk pertahanan yang tidak mampu menahan serangan gencar negara-negara besar di sekitar kita, kita harus meningkatkan pengeluaran untuk sistem kesejahteraan kita yang sedang berkembang!"
 DEN_bop_unban_all_political_uniforms: "£BoP_right_texticon Izinkan semua Seragam Politik"
 DEN_bop_unban_all_political_uniforms_desc: "Kita tidak bisa membiarkan larangan seragam politik tetap ada karena hal itu membatasi hak-hak masyarakat!"
 DEN_bop_ban_oppositions_uniforms: "£BoP_right_texticon Melarang Seragam Politik Oposisi"
 DEN_bop_ban_oppositions_uniforms_desc: "Kita tidak bisa membiarkan lawan politik kita berjalan-jalan dengan mengenakan seragam dan pamer. Hal ini hanya akan menyebarkan ketidakpuasan dan perselisihan. Kita harus melarang semua seragam politik – kecuali mereka yang berkuasa tentunya."
 DEN_bop_defend_our_chosen_path_rearmament: "£BoP_right_texticon Pertahankan Jalan Pilihan Kita"
 DEN_bop_defend_our_chosen_path_rearmament_desc: "$DEN_bop_defend_our_chosen_path_neutrality_desc$"
 DEN_bop_criticize_our_preparedness: "£BoP_right_texticon Kritik Kesiapsiagaan Kita"
 DEN_bop_criticize_our_preparedness_desc: "Awan gelap kembali berkumpul di Eropa, dan kita belum siap menghadapi badai yang akan datang! Kita harus memulai persiapan sesegera mungkin jika ingin menghadapi badai ini."
 DEN_bop_question_our_defenses: "£BoP_right_texticon Pertanyakan Pertahanan Kami"
 DEN_bop_question_our_defenses_desc: "Kebijakan netralitas yang telah lama dianut telah melucuti semua pertahanan Denmark! Jika kami diserang oleh kekuatan asing, tidak ada yang bisa menghentikan mereka untuk bergerak langsung ke København sekarang. Kita harus menjaga pertahanan kita jika kita ingin bertahan hidup sebagai sebuah negara!"
 DEN_bop_speak_out_against_welfare: "£BoP_right_texticon Berbicara menentang Sistem Kesejahteraan"
 DEN_bop_speak_out_against_welfare_desc: "Pertama-tama kita harus memikirkan pertahanan kita untuk mengamankan kemerdekaan kita sebelum kita dapat membelanjakan uang untuk hal lain. Masuk akal bahwa tanpa negara Denmark, tidak ada orang Denmark yang bisa membelanjakan uang sebanyak itu."
 DEN_bop_speak_out_in_favor_of_rearmament: "£BoP_right_texticon Berbicara Mendukung Persenjataan Kembali"
 DEN_bop_speak_out_in_favor_of_rearmament_desc: "Kita tidak bisa berpangku tangan ketika negara-negara Eropa lainnya sedang berlomba senjata dan masa-masa yang tidak menentu akan terjadi. Kita harus mempersiapkan pertahanan kita dan memulai persenjataan kembali secepat mungkin, sebaiknya kemarin!"
 DEN_bop_landstorm: "£BoP_right_texticon Bangun kembali Landstorm"
 DEN_bop_landstorm_desc: "Dengan kekacauan yang terjadi di sekitar kita, inilah saat yang tepat untuk mengaktifkan kembali Landstorm untuk mempertahankan wilayah kita. Meski bukan dengan kualitas terbaik, pasukan tersebut bisa menjadi lini pertahanan terakhir."
 DEN_bop_hold_a_military_parade: "£BoP_right_texticon Mengadakan Parade Militer"
 DEN_bop_hold_a_military_parade_desc: "Dengan mengadakan parade militer kita akan meningkatkan kepercayaan masyarakat terhadap kemampuan kita membela [ROOT.GetNameDef]. Hal ini tentunya akan menguatkan semangat dan tekad mereka untuk melihat motivasi pasukan kita."
 #OCCUPATION BOP
 DEN_bop_occupation_criticize_collaboration: "£BoP_right_texticon Mengkritik Kebijakan Kolaborasi"
 DEN_bop_occupation_criticize_collaboration_desc: "Penyerahan yang tidak terhormat dan kolaborasi yang tidak suci antara [ROOT.GetNameDef] dan [?DEN.DEN_overlord_nation.GetNameDef] tidak sebanding dengan kertas yang digunakan untuk menulisnya!"
 DEN_bop_occupation_strikes: "£BoP_right_texticon Diam-diam Mengkoordinasikan Serangan"
 DEN_bop_occupation_strikes_decs: "Hal terbaik yang bisa kita lakukan saat ini adalah secara pasif memprotes pendudukan [?DEN.DEN_overlord_nation.GetAdjective] dengan mengoordinasikan pemogokan berskala nasional."
 DEN_bop_occupation_resistance_coordination: "£BoP_right_texticon Mengkoordinasikan Gerakan Perlawanan"
 DEN_bop_occupation_resistance_coordination_desc: "Jika kita ingin mendapatkan kembali kebebasan kita, kita harus bersatu dalam gerakan perlawanan bersama dan berjuang untuk tujuan yang sama; pembebasan [ROOT.GetNameDef]."
 DEN_bop_occupation_underground_factories: "£BoP_right_texticon Pabrik Senjata Bawah Tanah"
 DEN_bop_occupation_underground_factories_desc: "Untuk mendapatkan peluang yang lebih baik untuk mendapatkan kembali kedaulatan, kita memerlukan persediaan senjata yang memadai. Kita harus membangun pabrik senjata rahasia sehingga kita dapat mempersenjatai masyarakat ketika saatnya tiba ketika kita harus berjuang demi kebebasan kita."
 DEN_bop_occupation_raid_depots: "£BoP_right_texticon Depot Senjata Penyerangan"
 DEN_bop_occupation_raid_depots_desc: "Pabrik senjata dalam negeri kami memproduksi dan membantu [?DEN.DEN_overlord_nation.GetNameDef] dengan senjata, senjata yang digunakan dalam perang mereka. Merampok gudang senjata akan mengurangi pasokan senjata sekaligus memperkuat gerakan perlawanan kita."
 DEN_bop_occupation_sabotage_civ_industry: "£BoP_right_texticon Sabotase Industri Sipil"
 DEN_bop_occupation_sabotage_civ_industry_desc: "Pabrik dan industri dalam negeri kita terpaksa memproduksi dan membantu [?DEN.DEN_overlord_nation.GetNameDef] dengan berbagai material, material yang digunakan dalam perang mereka. Dengan menyabotase pabrik-pabrik ini, pasokan material akan berkurang, sehingga merugikan upaya perang Jerman."
 DEN_bop_occupation_sabotage_mil_industry: "£BoP_right_texticon Sabotase Industri Militer"
 DEN_bop_occupation_sabotage_mil_industry_desc: "Pabrik senjata dalam negeri kami memproduksi dan membantu [?DEN.DEN_overlord_nation.GetNameDef] dengan senjata, senjata yang digunakan dalam perang mereka. Menyabotase pabrik-pabrik ini akan mengurangi pasokan senjata, merugikan upaya perang Jerman sekaligus membantu calon sekutu kita."
 DEN_bop_occupation_funnel_resources_danish_brigade: "£BoP_right_texticon Menyalurkan Sumber Daya ke Brigade Denmark"
 DEN_bop_occupation_funnel_resources_danish_brigade_desc: "[?DEN.hosts_danish_brigades.GetNameDefCap] dengan senang hati menerima dan melatih pasukan Denmark yang dapat membantu pembebasan [ROOT.GetNameDef] ketika saatnya tiba. Namun untuk memastikan bahwa pasukan ini memiliki peluang terbaik untuk berhasil dalam misi pembebasan negara kita, kita harus membantu dalam bentuk uang dan materi."
 DEN_bop_occupation_switch_ideology: "Adopsi [?DEN.DEN_overlord_nation.GetRulingIdeologyNoun]"
 DEN_bop_occupation_switch_ideology_desc: "Jika kita benar-benar ingin sejalan dengan [?DEN.DEN_overlord_nation.GetNameDef] dan mendapatkan dukungan mereka, kita harus mengadopsi ideologi dan keyakinan mereka."
 DEN_bop_occupation_ban_elections: "£BoP_left_texticon Melarang Pemilu"
 DEN_bop_occupation_ban_elections_desc: "Kita harus menenangkan tuan [?DEN.DEN_overlord_nation.GetAdjective] kita dengan melarang pemilihan umum yang bebas"
 DEN_bop_occupation_defend_collaboration: "£BoP_left_texticon Mempertahankan Kebijakan Kolaborasi"
 DEN_bop_occupation_defend_collaboration_desc: "Menyerah dan berkolaborasi dengan [?DEN.DEN_overlord_nation.GetNameDef] adalah satu-satunya pilihan yang tepat! Hal ini telah menghindarkan kita dari kengerian dan kehancuran yang tidak dapat kita bayangkan."
 DEN_bop_occupation_censor_the_media: "£BoP_left_texticon Menyensor Media"
 DEN_bop_occupation_censor_the_media_desc: "Kita tidak bisa membiarkan media secara terbuka mengkritik pasukan pendudukan [?DEN.DEN_overlord_nation.GetAdjective] dalam situasi genting ini. Kita harus membatasi apa yang bisa mereka publikasikan agar tidak mengambil risiko atas sedikitnya kebebasan yang kita miliki."
 DEN_bop_occupation_remove_political_agitator: "£BoP_left_texticon Singkirkan Agitator Politik"
 DEN_bop_occupation_remove_political_agitator_desc: "Beberapa politisi terkemuka tidak segan-segan mengkritik tuan [?DEN.DEN_overlord_nation.GetAdjective] kita, yang berkontribusi pada peningkatan ketegangan antar negara. Kita harus menyingkirkan para pembuat onar ini dari tugas politik mereka sebelum [?DEN.DEN_overlord_nation.GetNameDef] memaksa kita melakukannya."
 DEN_bop_occupation_ban_communism: "£BoP_left_texticon Melarang Komunisme"
 DEN_bop_occupation_ban_communism_desc: "Tuan [?DEN.DEN_overlord_nation.GetAdjective] kita melihat diri mereka berperang melawan ideologi Komunis itu sendiri dan akan lebih menghargai kerja sama kita yang berkelanjutan jika kita melarang semua organisasi Komunis di negara kita."
 DEN_bop_occupation_allow_communism: "£BoP_left_texticon Izinkan Komunisme"
 DEN_bop_occupation_allow_communism_desc: "Penguasa Komunis kami tidak menerima kenyataan bahwa kami telah melarang ideologi mereka di [ROOT.GetNameDef]. Akan menjadi kepentingan terbaik kita jika mengijinkan komunisme kembali terjadi."
 DEN_bop_occupation_ban_fascism: "£BoP_left_texticon Melarang Fasisme"
 DEN_bop_occupation_ban_fascism_desc: "Tuan [?DEN.DEN_overlord_nation.GetAdjective] kita melihat diri mereka berperang melawan ideologi Fasis itu sendiri dan akan lebih menghargai kerja sama kita yang berkelanjutan jika kita melarang semua organisasi Fasis di negara kita."
 DEN_bop_occupation_allow_fascism: "£BoP_left_texticon Izinkan Fasisme"
 DEN_bop_occupation_allow_fascism_desc: "Tuan-tuan Fasis kami tidak menerima kenyataan bahwa kami telah melarang ideologi mereka di [ROOT.GetNameDef]. Adalah kepentingan terbaik kita untuk mengizinkan kembali fasisme."
 DEN_bop_occupation_allow_democratism: "£BoP_left_texticon Izinkan Partai Demokrat"
 DEN_bop_occupation_allow_democratism_desc: "Mengadakan pemilu yang berulang merupakan tanda kepercayaan antar warga negara dan kekuatan suatu negara. Tidak mengizinkan pemilu demokratis adalah aib bagi bangsa kita."
 #RESISTANCE
 DEN_resistance_category: "Gerakan Perlawanan Denmark"
 DEN_resistance_category_desc: "Kita harus melawan kekuasaan pendudukan dan mendapatkan kembali kebebasan kita! Hal ini hanya dapat dicapai dengan upaya bersama dan kita bekerja dengan gigih menuju tujuan bersama yaitu [ROOT.GetNameDef] yang merdeka."
