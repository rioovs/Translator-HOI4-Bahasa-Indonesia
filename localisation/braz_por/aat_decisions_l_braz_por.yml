l_braz_por:
  #### ICELAND ####
 ICE_drilling_for_oil_off_shore: "Bor Minyak dan Gas Lepas Pantai"
 ICE_drilling_for_oil_off_shore_repeat_tt: "Keputusan ini dapat diambil kembali setelah §Y180§! hari"
 no_more_oil_tt: "§RTidak ada lagi minyak yang ditemukan§!"
 no_more_oil_flag: "Ladang minyak telah mengering"
 ICE_improve_the_viking_spirit: "Menghormati Leluhur kita"
 ICE_already_improving_the_viking_spirit_flag: "Sudah meningkatkan Semangat Viking"
 ICE_a_new_yggdrasill: "Yggdrasil Modern"
 ICE_a_new_yggdrasill_desc: "Sekarang setelah orang-orang mengetahui nenek moyang mereka yang hebat, kita harus berusaha keras untuk membangun proyek-proyek besar dan memperbaiki pulau Islandia agar bisa menyamai Miðgarður dan Yggdrasil sang Legenda!"
 ICE_has_best_spirit_idea: "Kami telah sepenuhnya menghormati leluhur kami"
 ICE_the_wisdom_of_odin: "Kebijaksanaan Óðinn"
 ICE_the_wisdom_of_odin_desc: "Óðinn adalah dewa yang diasosiasikan dengan segala sesuatu mulai dari kebijaksanaan, penyembuhan, kematian, royalti, tiang gantungan, pengetahuan, perang, pertempuran, kemenangan, sihir, puisi, dan kegilaan hingga alfabet rahasia. Dia dianugerahi kebijaksanaan luar biasa ketika dia menawarkan matanya untuk minum dari Mímisbrunnr, yang memberinya kemampuan pengetahuan tak terbatas tentang masa kini, masa depan, dan masa lalu. Kita harus berusaha untuk mewujudkan semangatnya, dan meneruskan warisannya di masa depan!"
 ICE_the_might_of_thor: "Kekuatan Þór"
 ICE_the_might_of_thor_desc: "Þór adalah dewa guntur, kekuatan, dan perlindungan umat manusia. Sambil memegang palu Mjölnir, dia memukul awan untuk menjadikannya badai, dan pasukan kita akan menyerang lawan kita dengan guntur dan ketakutan yang sama!"
 ICE_the_guidance_of_aegir_and_ran: "Bimbingan Ægir dan Rán"
 ICE_the_guidance_of_aegir_and_ran_desc: "Di bawah bimbingan Rán dan Ægir, personifikasi laut dan suaminya jötunn, kapal kami akan mencapai supremasi di laut utara."
 ICE_the_ferocity_of_the_fenrir: "Keganasan Fenrisúlfr"
 ICE_the_ferocity_of_the_fenrir_desc: "Fenrisúlfr bersama Hel dan Ular Dunia, anak Loki dan raksasa wanita Angrboða. Selama Ragnarök, ia seharusnya membunuh Óðinn, namun gagal, meskipun memiliki kekuatan dan keganasan yang besar. Prajurit kita harus mewujudkan esensinya di medan perang untuk mengalahkan musuh baik di lapangan maupun pikiran."
 ICE_the_fertility_of_freya: "Kesuburan Freyja"
 ICE_the_fertility_of_freya_desc: "Freyja antara lain adalah dewi cinta, kecantikan, dan kesuburan. Kita harus memanggil namanya untuk memastikan rakyat kita memiliki anak-anak yang suatu hari nanti bisa tumbuh menjadi pejuang hebat."
 ICE_a_monument_to_leif: "Angkat Monumen Leifur Eiríksson"
 ICE_a_monument_to_leif_desc: "Terlepas dari mitos umum yang disebarkan oleh orang-orang selatan bahwa Christopher Columbus adalah orang Eropa pertama yang menemukan benua Amerika, nenek moyang kita Leifur Eiríksson tidak diragukan lagi adalah orang pertama yang menemukan benua Amerika. Untuk menghormati ingatannya, kita harus membangun sebuah monumen yang didedikasikan untuknya di Vinland, saat kita menaklukkan wilayah itu untuk diri kita sendiri."
 ICE_infiltrate_the_british_isles_category: "Menyusup ke Kepulauan Inggris"
 ICE_infiltrate_the_british_isles_category_desc: "Revolusi buruh perlu disebarkan. Titik awal yang sempurna adalah para pekerja yang tertindas di kepulauan Inggris. Sentimen anti-imperialis dan anti-kapitalis dapat, dan harus, dimanfaatkan secara maksimal."
 ICE_incite_communist_uprising_scotland: "Menghasut pemberontakan di Skotlandia"
 ICE_incite_communist_uprising_scotland_desc: "Dengan sedikit dorongan, kita harus mampu membuat para pekerja Skotlandia bangkit di [121.GetCapitalVictoryPointName] dan mendeklarasikan kemerdekaan mereka dari pemerintah di [121.owner.capital.GetCapitalVictoryPointName]."
 ICE_uprising_scotland_tt: "§Y[121.owner.GetName]§!: Lebih dari [?ICE.communism_support_needed|%Y0] dukungan untuk [121.owner.GetCommunistParty]"
 ICE_incite_communist_uprising_scotland_tt: "§Y[SCO.GetName]§! memulai Perang Kemerdekaan melawan §Y[121.owner.GetName]§! di [121.GetName]"
 ICE_incite_communist_uprising_wales: "Menghasut pemberontakan di Wales"
 ICE_incite_communist_uprising_wales_desc: "Dengan sedikit dorongan, kita harus mampu membuat para pekerja Welsh bangkit di [122.GetCapitalVictoryPointName] dan mendeklarasikan kemerdekaan mereka dari pemerintah di [122.owner.capital.GetCapitalVictoryPointName]."
 ICE_uprising_wales_tt: "§Y[122.owner.GetName]§!: Lebih dari [?ICE.communism_support_needed|%Y0] dukungan untuk [122.owner.GetCommunistParty]"
 ICE_incite_communist_uprising_wales_tt: "§Y[WLS.GetName]§! memulai Perang Kemerdekaan melawan §Y[122.owner.GetName]§! di [122.GetName]"
 ICE_incite_communist_uprising_ni: "Menghasut pemberontakan di Irlandia Utara"
 ICE_incite_communist_uprising_ni_desc: "Dengan sedikit dorongan, kita harus mampu membuat para pekerja di Irlandia Utara bangkit di [119.GetCapitalVictoryPointName] dan mendeklarasikan kemerdekaan mereka dari pemerintah di [119.owner.capital.GetCapitalVictoryPointName]."
 ICE_uprising_ni_tt: "§Y[119.owner.GetName]§!: Lebih dari [?ICE.communism_support_needed|%Y0] dukungan untuk [119.owner.GetCommunistParty]"
 ICE_incite_communist_uprising_ni_tt: "§Y[WLS.GetName]§! memulai Perang Kemerdekaan melawan §Y[119.owner.GetName]§! di [119.GetName]"
  # NORWAY
 NOR_democratic_preparation_decisions_category: "Membangun Bangsa Kita"
 NOR_democratic_preparation_decisions_category_desc: "Bangsa muda kita mempunyai banyak hal yang harus dilakukan jika kita ingin bersaing dengan dunia pada umumnya. Pengabaian selama berpuluh-puluh tahun dan bertahun-tahun memasuki masa depresi besar, telah menyebabkan industri kita berada dalam kondisi yang menyedihkan dan memerlukan upaya bersama untuk memperbaikinya.\n\nSayangnya hal ini akan mengorbankan kesiapan militer dan kemampuan pertahanan kita, namun kita mempercayai kebijakan netralitas penuh dan tidak bersenjata untuk menunjukkan niat baik kita dan musuh mana pun yang dengan aman menghadap ke wilayah kita.\n\n\n[NOR.GetName] Perkembangan Total: [?NOR.NOR_country_preparedness]/30"
 NOR_historical_deploy_prep_decisions_category: "Bersiap menghadapi Badai"
 NOR_historical_deploy_prep_decisions_category_desc: "Meskipun kita telah berupaya semaksimal mungkin, perang telah tiba di wilayah kita. Sejauh ini kita telah memfokuskan energi kita untuk mengembangkan industri, ekonomi dan infrastruktur di wilayah kita, namun sekarang kita harus menemukan cara untuk memanfaatkan hal ini untuk pertahanan Potensi Kesiapsiagaan [NOR.GetNameDef].\n\n\n[NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_preparation_decisions_category: "Mempersiapkan Norwegia untuk Perang"
 NOR_allied_democratic_preparation_decisions_category_desc: "Pemerintahan ini yakin bahwa musuh-musuh kita akan menyerang kapan saja. Kita harus tegas dalam semangat mempersenjatai penduduk [NOR.GetName] untuk mencegah invasi. Sekalipun itu berarti menyerang terlebih dahulu. Jadi, marilah kita menggalang kekuatan negara kita, dan mengambil kekuatan yang kita perlukan untuk menang telak melawan musuh-musuh kita.\n\nKesiapsiagaan Nasional: [?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_deploy_prep_decisions_category: "Menyebarkan Persiapan Perang Kita"
 NOR_allied_democratic_deploy_prep_decisions_category_desc: "Seperti yang kita perkirakan, perang akhirnya akan menimpa kita, namun tidak ada yang perlu ditakutkan. Selama beberapa tahun terakhir kami telah memfokuskan seluruh upaya kami untuk mempersiapkan [ROOT.GetName] menghadapi apa pun yang dilemparkan musuh kepada kami. Mari kita tunjukkan pada mereka kita terbuat dari apa.\n\nKesiapsiagaan Nasional: [?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_alt_dem: "Siapkan [FROM.GetName] Untuk Perang"
 NOR_prepare_state_alt_dem_desc: "Sayangnya, kita tidak siap menghadapi apa yang akan terjadi. Kita harus mengambil tindakan yang tepat sehingga ketika perang pecah, [FROM.GetName] dapat berkontribusi dalam upaya perang. Beberapa orang tidak akan mengerti, tapi kami telah menentukan pilihan. Tidak ada jalan kembali."
 NOR_alt_dem_naval_expansion: "Ekspansi Angkatan Laut"
 NOR_alt_dem_naval_expansion_desc: "Mengembangkan angkatan laut kita sangatlah penting, bukan hanya karena hal ini berarti mempertahankan garis pantai kita yang sangat luas dari penjajah, namun karena hal ini dapat digunakan sebagai landasan untuk melakukan perlawanan di tanah air mereka."
 NOR_alt_dem_military_industry_expansion: "Memperluas Industri Militer"
 NOR_alt_dem_military_industry_expansion_desc: "Kita tidak bisa bergantung pada negara lain yang menyediakan peralatan kita, karena pedagang perang saat ini bisa menjadi musuh perang di masa depan. Kita harus memperluas kapasitas industri kita untuk memproduksi material yang kita perlukan untuk berperang."
 NOR_alt_dem_economic_relief_measures: "Tindakan Bantuan Ekonomi"
 NOR_alt_dem_economic_relief_measures_desc: "Masyarakat semakin bosan dengan pembangunan militer kita. Mereka mungkin tidak melihat apa yang kita lihat dan mungkin tidak tahu bahwa pengorbanan mereka diperlukan agar mesin perang kita harus berjalan dengan susah payah untuk mengamankan kemenangan. Tidak masalah, kami akan memenuhi kebutuhan mereka untuk saat ini."
 NOR_alt_dem_expedite_training: "Mempercepat Pelatihan"
 NOR_alt_dem_expedite_training_desc: "Kita mendapati diri kita berada dalam situasi yang mengerikan. Jika kita tidak segera melatih pasukan baru, kita semua mungkin akan hancur."
 NOR_alt_dem_prioritize_production: "Prioritaskan Produksi"
 NOR_alt_dem_prioritize_production_desc: "Mesin perang kita membutuhkan peralatan, dan ia membutuhkannya sekarang! Biarkan pabrik-pabrik bersenandung dengan kerja mereka yang terus-menerus sehingga prajurit kita yang gagah berani mempunyai sarana untuk mengalahkan musuh-musuh kita, apa pun risikonya."
 NOR_alt_dem_offensive_push: "Dorongan Ofensif"
 NOR_alt_dem_offensive_push_desc: "Segala sesuatu yang lain dibendung, saatnya menyerang. Mari kita maju terus dan hancurkan musuh kita sebelum mereka tahu apa yang menimpa mereka."
 NOR_alt_dem_focus_on_defense: "Fokus Pada Pertahanan"
 NOR_alt_dem_focus_on_defense_desc: "Sampai baru-baru ini [NOR.GetName] adalah negara yang damai dan tidak memiliki senjata, kita telah berusaha sekuat tenaga. Kami harus fokus mempertahankan apa yang kami miliki saat ini."
 NOR_alt_dem_modernize_armed_forces_decision: "$NOR_modernize_armed_forces_decision$"
 NOR_alt_dem_modernize_armed_forces_decision_desc: "$NOR_modernize_armed_forces_decision_desc$"
 NOR_fascist_preparation_decisions_category: "Mengintai dalam Bayangan"
 NOR_fascist_preparation_decisions_category_desc: "Partai Nasjonal Samling secara historis memiliki dukungan yang sangat terbatas di masyarakat [NOR.GetAdjective], inilah mengapa penting untuk menyebarkan agama di seluruh negeri dan membangun basis dukungan.\n\nDengan menanam benih fasisme, ketika kesempatan yang tepat datang, kita akan dapat memetik hasil dari perencanaan kita dan mengambil alih [ROOT.GetName].\n\n\n[NOR.GetName] total dukungan untuk Nasjonal Samling: [?NOR.NOR_country_preparedness]/30"
 NOR_fascist_deploy_prep_decisions_category: "Bangkit Dari Bayangan"
 NOR_fascist_deploy_prep_decisions_category_desc: "Waktu untuk bersembunyi telah berakhir, kami telah mengumpulkan cukup dukungan untuk meluncurkan pengambilalihan [NOR.GetName]. Sekarang kita harus mengerahkan persiapan kita di setiap wilayah Tanah Air kita.\n\nKami telah membangun dukungan kami dari bawah ke atas, dan menanam sel-sel yang siap mengambil alih wilayah mereka di bawah komando Fører kita yang agung, dan melawan kekuatan Demokrasi yang pengecut."
 NOR_communist_preparation_decisions_category: "Membangkitkan Proletariat"
 NOR_communist_preparation_decisions_category_desc: "[GetRousingProletariatDesc]"
 NOR_communist_preparation_decisions_category_desc_stalinist: "Masyarakat [ROOT.GetName] sudah terlalu lama menutup mata, kini saatnya mereka akhirnya mengindahkan seruan saudara-saudara kita di [SOU.GetNameDef].\n\nMenggunakan mereka sebagai contoh apa yang dapat dicapai [ROOT.GetName] setelah mereka merebut alat-alat produksi dan bersatu di bawah satu panji dan satu pemimpin, yang akan membimbing mereka untuk melawan tirani Oslo.$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_trostkyist: "Sudah waktunya masyarakat [NOR.GetName] mendengarkan ajaran Marx dan Troskij, dan bersiap menghadapi bentrokan yang tak terelakkan yang akan mengubah bangsa kita menjadi ujung tombak Komunisme di Skandinavia.\n\nMari kita rangkul api dan belerang Revolusi Permanen, dan satukan negara melawan kekuatan kapitalisme yang ada di Oslo.$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_other: "Revolusi harus datang dari bawah ke atas, dari massa yang bekerja keras demi tuan tanah atau industrialis.\n\nBanyak saudara dan saudari proletar kita tidak mengetahui kekuatan yang mereka miliki, jadi kita harus maju dan membangkitkan proletariat agar mereka dapat bersatu melawan Oslo untuk meruntuhkan rantai kapitalisme, satu demi satu negara.$NOR_revolution_support_counter$"
 NOR_revolution_support_counter: "Dukungan Total untuk Revolusi kita: [?NOR.NOR_country_preparedness]/[?NOR.NOR_comm_prep_max_preparedness]"
 NOR_monarchist_preparation_decisions_category: "Tunjukkan pada Raja Haakon Dukungan kami untuk Pemerintahannya"
 NOR_monarchist_preparation_decisions_category_desc: "Bahkan sebelum naik takhta, Raja Haakon VII kita yang rendah hati telah menyerahkan kekuasaannya kepada Storting dan konstituennya. Hal ini baik dan bagus pada saat itu, tapi kita harus menunjukkan kepadanya bahwa kita mendukung dia untuk merebut kendali langsung atas [ROOT.GetName] sebelum tidak ada lagi yang bisa dikendalikan.\n\n\nTotal Dukungan untuk Monarki: [?NOR.NOR_country_preparedness]/30"
 NOR_prepare_state_historical: "Kembangkan [?FROM.GetName]"
 NOR_prepare_state_historical_desc: "Basis industri kami berantakan, namun kami bersedia melakukan upaya yang diperlukan untuk memperbaiki situasi masyarakat [ROOT.GetName], dan peluang kami untuk bertahan hidup jika hal terburuk terjadi."
 NOR_prepare_historical_unlock_TT: "Membuka keputusan §YNegara Berkembang§! yang memungkinkan percepatan §GKonstruksi Sipil§! tetapi memberikan penalti kepada §RKonstruksi dan Pertahanan Militer§!."
 NOR_prepare_fascist_unlock_TT: "Membuka §YMembangun Dukungan di Negara§! keputusan yang §GCMeningkatkan Dukungan Fasisme§! dan memberikan §GWilayah dan manfaat§! ketika Perang Saudara dimulai, tetapi memberikan hukuman kepada §RIndustri Sipil§!."
 NOR_prepare_communist_unlock_TT: "Membuka §YRouse Proletariat di Negara§! yang memberikan §GWilayah dan Pasukan§! ketika Revolusi Komunis dimulai, tetapi §Rmerusak bangunan§! di negara bagian."
 NOR_deploy_state_preparation_historical: "[get_deploy_prep_decision_name]"
 NOR_decision_defend_state_title: "Pertahankan [FROM.GetName]"
 NOR_decision_emergency_production_title: "Produksi Darurat di [FROM.GetName]"
 NOR_decision_deploy_emergency_militias_title: "Kerahkan Milisi di [FROM.GetName]"
 NOR_dem_his_integrate_militias: "Integrasikan Milisi"
 NOR_dem_his_integrate_militias_desc: "Kini setelah orang-orang yang membentuk milisi kita telah membuktikan keberanian mereka, kita dapat mengintegrasikan mereka dengan lebih baik ke dalam angkatan bersenjata, ke dalam batalyon dan divisi reguler."
 NOR_alt_dem_integrate_militias: "$NOR_dem_his_integrate_militias$"
 NOR_alt_dem_integrate_militias_desc: "$NOR_dem_his_integrate_militias_desc$"
 NOR_prepare_exile: "Siapkan Pengasingan"
 NOR_prepare_exile_desc: "Kenyataannya tidak dapat disangkal. Bangsa kita tidak bisa menangkis musuh selamanya, tapi kita bisa bertahan cukup lama untuk mengeluarkan sebanyak mungkin orang ke luar negeri untuk berperang di lain waktu."
 NOR_focus_on_training: "Fokus Pada Pelatihan"
 NOR_focus_on_training_desc: "Kita perlu mencurahkan seluruh upaya kita untuk menjadikan cadangan dan rekrutan kita diubah menjadi tentara dan ke medan perang secepat mungkin, karena mungkin tidak akan ada lagi front yang ada."
 NOR_alt_dem_focus_on_training: "$NOR_focus_on_training$"
 NOR_alt_dem_focus_on_training_desc: "$NOR_focus_on_training_desc$"
 NOR_modernize_armed_forces_decision: "Modernisasi Angkatan Bersenjata"
 NOR_modernize_armed_forces_decision_desc: "Militer [ROOT.GetAdjective] telah lama diabaikan, angkatan bersenjata kita terlihat lebih cocok untuk museum daripada medan perang."
 NOR_move_government_headquarters_decision: "Pindahkan pemerintahan ke [FROM.GetName]"
 NOR_move_government_headquarters_decision_desc: "Jika pemerintahan kita jatuh ke tangan musuh, hal itu akan menjamin kehancuran kita dan Raja serta Pangeran kita. Satu-satunya pilihan adalah tetap bergerak dan menghindari hal yang tak terhindarkan selama mungkin."
 NOR_expedite_training: "Mempercepat Pelatihan"
 NOR_expedite_training_desc: "Melatih pasukan kita sebaik mungkin sangat penting untuk kelangsungan hidup kita tapi itu akan sia-sia jika mereka menyelesaikan pelatihan mereka dan tidak ada [NOR.GetName] yang tersisa untuk dipertahankan. Kita harus maju secepat mungkin sebelum kita diusir dari negara kita."
 NOR_public_investment_drive: "Penggerak Investasi Publik"
 NOR_public_investment_drive_desc: "Ada banyak pekerjaan yang harus dilakukan dalam [ROOT.GetName] dan tampaknya hal ini tidak akan selesai tanpa investasi langsung dari sektor publik. Mari kita banjiri negara ini dengan proyek infrastruktur dan konstruksi."
 NOR_alt_dem_public_investment_drive: "$NOR_public_investment_drive$"
 NOR_alt_dem_public_investment_drive_desc: "$NOR_public_investment_drive_desc$"
 NOR_naval_expanion: "Ekspansi Angkatan Laut"
 NOR_naval_expanion_desc: "Jika kita ingin bertahan hidup, kita perlu mempertahankan garis pantai kita, dan kita memerlukan kapal untuk itu. Kita harus menjadikan setiap fjord sebagai galangan kapal."
 NOR_prepare_state_fascist: "Bangun dukungan di [FROM.GetName]"
 NOR_deploy_state_preparation_fascist: "[get_deploy_prep_decision_name_fascist]"
 NOR_invite_fascist_to_invade: "Undang [GER.GetNameDef] untuk menyerang [NOR.GetNonIdeologyName]"
 NOR_decision_take_over_state_title: "Ambil alih di [FROM.GetName]"
 NOR_decision_industrial_takeover_title: "Pengambilalihan Industri di [FROM.GetName]"
 NOR_decision_military_takeover_title: "Pengambilalihan Militer di [FROM.GetName]"
 NOR_prepare_state_communist: "Bangkitkan Proletariat di [FROM.GetName]"
 NOR_prepare_state_communist_desc: "Masyarakat [FROM.GetName] sudah terlalu lama dieksploitasi dalam tidurnya. Mari kita tanamkan benih-benih revolusi kita"
 NOR_communist_propaganda_campaign: "Kampanye Propaganda Komunis"
 NOR_prepare_state_monarchist: "Demonstrasi Monarki di [FROM.GetName]"
 NOR_prepare_state_monarchist_desc: "Rakyat [FROM.GetName] perlu diingatkan akan pemilu tahun 1905 dan mengapa mereka secara mayoritas memilih rajanya untuk jabatan tersebut. Mereka akan menuntut intervensi langsung raja dalam waktu dekat."
 NOR_prop_up_the_economy: "Menopang Perekonomian"
 NOR_prop_up_the_economy_desc: "Kita tidak akan bisa mencapai tujuan politik kita jika rakyat kelaparan. Kita harus menghentikan perjuangan monarki untuk mengurus rakyat kita dan kebutuhan mereka."
 NOR_make_assurances_to_the_people: "Memberikan Jaminan kepada Masyarakat [NOR.GetNonIdeologyName]"
 NOR_make_assurances_to_the_people_desc: "Tentu saja ini adalah masa yang menakutkan di [NOR.GetName], jadi kita harus meyakinkan melalui media bahwa kita akan berhasil melewatinya, dan di sisi lain, raja kita yang baik hati akan memimpin upaya untuk kelangsungan hidup kita."
 NOR_promote_the_armed_defense_of_the_country: "Mempromosikan Pertahanan Bersenjata [NOR.GetName]"
 NOR_promote_the_armed_defense_of_the_country_desc: "Masyarakat [NOR.GetName] harus diingatkan apa jadinya jika tidak membela negara kita. Setiap orang harus memainkan perannya dalam konflik yang akan datang."
 NOR_exile_decisions_category: "Pengasingan Pemerintahan [ROOT.GetName]"
 NOR_exile_decisions_category_desc: "Kita mendapati diri kita berada dalam situasi yang paling buruk. Setelah kehilangan tanah kami karena musuh, kami tidak punya jalan lain selain hidup di pengasingan. Setidaknya kita bisa bersyukur atas kebaikan tuan rumah kita, dan semoga suatu saat nanti, dengan bantuan mereka, kita bisa kembali berada di [NOR.GetNonIdeologyName] tercinta."
 NOR_request_reinstatement: "Minta [FROM.GetNameDef] untuk pemulihan"
 NOR_request_reinstatement_desc: "Musuh kita mulai kehilangan kekuatan di [NOR.GetName], dan menurut kami sudah waktunya bagi pemerintah kita untuk kembali ke posisi yang seharusnya."
 NOR_lobby_for_parliamentary_support: "Lobi untuk dukungan di Pemerintahan [FROM.GetAdjective]"
 NOR_lobby_for_parliamentary_support_desc: "Tuan rumah kami sudah sangat bermurah hati sejauh ini, namun mungkin mereka perlu diingatkan tentang apa yang dialami masyarakat kami sehingga mereka tidak pernah melupakan apa yang sedang dipertaruhkan bagi kami."
 NOR_bring_soldiers_from_norway: "Bawa tentara dari [NOR.GetNonIdeologyName]"
 NOR_bring_soldiers_from_norway_desc: "Banyak orang yang berjuang membela negara kita masih terjebak di tanah air kita. Kita bisa berupaya mendatangkan sebagian dari mereka, ditambah sebagian lagi yang mungkin belum berperang namun masih ingin merebut kembali negaranya dari tempat kita berada."
 NOR_weapons_for_the_resistance: "Pengadaan dan Distribusi Senjata"
 NOR_weapons_for_the_resistance_desc: "Kita dapat memanfaatkan armada dagang kita yang luas untuk mendapatkan senjata baik untuk upaya kita di sini maupun untuk pejuang perlawanan di tanah air kita. Senjata-senjata di sana akan melemahkan cengkeraman musuh kita pada [NOR.GetNonIdeologyName] dan senjata-senjata di sini akan memberikan pukulan terakhir terhadap tirani mereka."
 NOR_unity_parade: "Parade Persatuan di [FROM.Capital.GetCapitalVictoryPointName]"
 NOR_unity_parade_desc: "Mari kita isi jalan-jalan [FROM.Capital.GetCapitalVictoryPointName] dengan suara kita untuk mengingatkan masyarakat kota besar itu bahwa perjuangan kita dan perjuangan mereka adalah satu dan sama."
 NOR_joint_training_exercise: "Latihan Latihan dengan [FROM.GetNameDef]"
 NOR_joint_training_exercise_desc: "Jika kita berharap meraih kemenangan, kekuatan kita harus menyatu dengan [FROM.GetNameDef]. Hal ini hanya dapat dilakukan melalui pelatihan dan kolaborasi mendalam dengan sekutu kita."
 NOR_expand_industrial_capacity: "Berinvestasi dalam Kapasitas Industri"
 NOR_expand_industrial_capacity_desc: "Kita mungkin diasingkan tetapi bukan berarti kita tidak berdaya. Kita mempunyai salah satu armada marinir niaga terbesar di dunia, dan kita dapat menggunakannya untuk mendapatkan kapasitas industri yang diperlukan untuk mendukung upaya kita merebut kembali tanah air kita."
 NOR_foment_resistance_in_state: "Resistensi Foment di [FROM.GetName]"
 NOR_foment_resistance_in_state_desc: "Masyarakat [FROM.GetName] mempunyai semangat perlawanan dalam diri mereka, dan mereka melawan musuh kita! Mereka hanya perlu dorongan ekstra agar hal itu menjadi penentu."
 NOR_support_rebellion: "Mendukung Pemberontakan di [FROM.GetName]"
 NOR_support_rebellion_desc: "Upaya perlawanan kami di [FROM.GetName] telah membuahkan hasil. Masyarakat di sana siap mengambil tindakan melawan penindasnya. Biarkan mereka memulai pertarungan, dan segera setelah mereka melakukannya, kita akan siap untuk pulang ke rumah dan bertarung."
