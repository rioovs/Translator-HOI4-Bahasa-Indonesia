 FIN_national_defense_category: "Pertahanan Nasional"
 FIN_national_defense_category_desc: "Pertahanan wilayah [ROOT.GetAdjective] dan kemerdekaan adalah hal yang paling penting. Kita harus siap melakukan apa pun untuk membela rakyat kita dari ancaman eksternal apa pun."
 FIN_set_up_weapon_caches_in_state: "Siapkan Cache Senjata di [FROM.GetName]"
 FIN_set_up_weapon_caches_in_state_desc: "Sebagai bagian dari operasi militer rahasia, sejumlah besar [ROOT.GetAdjective] senjata dan peralatan Angkatan Darat akan disembunyikan di tempat persembunyian yang tersebar di sekitar [FROM.GetName] sehingga [ROOT.GetAdjective] Elemen perlawanan dapat melanjutkan perjuangan melawan penjajah."
 FIN_weapon_caches_cost_increase_tt: "Biaya untuk keputusan §YMenyiapkan Cache Senjata§! akan ditingkatkan sebesar §Y[?FIN_weapon_caches_decision_cost_increase]§!."
 FIN_weapon_caches_decision_cost_dynamic_ie_cp_pp: "£infantry_equipment_text_icon §Y50§! £command_power §Y[?FIN.FIN_weapon_caches_decision_cost]§! £pol_power §Y[?FIN_weapon_caches_decision_cost]§!"
