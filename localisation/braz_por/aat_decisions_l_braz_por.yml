 NORDIC_economic_cooperation_decisions_desc: "[ROOT.GetName] dan [FROM.GetName] memiliki sejarah yang sama selama berabad-abad. Terkadang sebagai musuh, dan di lain waktu sebagai sekutu dan tetangga yang bersahabat. Di masa yang tidak menentu ini, kita sebagai masyarakat Nordik harus tetap bersatu dan bekerja sama dalam kerja sama yang saling menguntungkan, secara setara."
