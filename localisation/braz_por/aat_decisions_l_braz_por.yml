 FIN_fight_alongside_country_comrades_nordic: "$SOV_fight_alongside_country_comrades_baltic$"
 FIN_fight_alongside_country_comrades_nordic_desc: "$SOV_fight_alongside_country_comrades_baltic_desc$"
 FIN_pressure_government_active_flag: "$SOV_pressure_government_active_flag$"
 FIN_pressure_government_cd_tt: "Kami hanya dapat menekan pemerintah suatu negara setiap §Y[?FIN_pressure_government_cd]§! hari."
 FIN_coup_preparations: "Persiapan Kudeta"
 FIN_coup_preparations_desc: "Kudeta tidak akan berhasil jika kita tidak terlebih dahulu melakukan semua yang kita bisa untuk memastikan kudeta tersebut berhasil. Persiapan adalah unsur penting menuju kesuksesan."
 FIN_appeal_to_the_middle_class: "Banding ke Kelas Menengah"
 FIN_appeal_to_the_middle_class_desc: "Dukungan utama terhadap organisasi sayap kanan Finlandia berasal dari kelas menengah. Kita harus menghimbau para petani kaya, kaum borjuis terpelajar, pegawai negeri, pendeta dan mahasiswa untuk bergabung dengan gerakan kita dan menyebarkan prinsip-prinsip dan ideologi kita di kalangan masyarakat."
 FIN_appeal_to_the_middle_class_dec_tt: "Pihak kami akan mendapatkan §G+10%§! dari total wilayah dan unit militer."
 FIN_secure_the_military: "Amankan Militer"
 FIN_secure_the_military_desc: "Militer selalu menjadi sekutu yang berguna bagi setiap pembuat kudeta, sebagaimana dibuktikan oleh sejarah. Oleh karena itu, penting untuk memastikan dukungan mereka sebelum kita melakukan kudeta."
 FIN_secure_the_military_dec_tt: "Pihak kami akan mendapatkan §G+10%§! dari total wilayah dan unit militer dan akan mempertahankan semua pemimpin militer."
 FIN_purchase_german_equipment: "Beli Peralatan Jerman"
 FIN_purchase_german_equipment_desc: "Jerman memiliki sejumlah besar peralatan yang terbuang sia-sia di gudang. Kita harus meminta agar mereka memberikan sebagian darinya, karena kita dapat membuktikan bahwa kita adalah teman mereka yang berguna."
 FIN_the_last_kinship_war: "Perang Kekerabatan Terakhir"
 FIN_the_last_kinship_war_desc: "Setelah menghidupkan kembali semangat Heimosodat, kini kita dapat memulai persiapan untuk membebaskan bangsa kita dari cengkeraman penindasan asing."
 FIN_stir_anti_soviet_sentiment_in_karelia: "Menimbulkan Sentimen Anti-Soviet di Karelia"
 FIN_stir_anti_soviet_sentiment_in_karelia_desc: "Ada banyak orang di Karelia yang tidak setuju dengan kebijakan pemerintah Soviet, dan kita dapat memanfaatkan hal ini untuk menimbulkan masalah di wilayah tersebut."
 FIN_instigate_a_new_karelian_uprising: "Menghasut Pemberontakan Karelia Baru"
 FIN_instigate_a_new_karelian_uprising_desc: "Menghidupkan kembali semangat Heimosodat, kita harus berusaha menciptakan pemberontakan Karelia yang baru, dan membiarkan rakyat Karelia mencapai kemerdekaan yang mereka inginkan."
 FIN_finno_soviet_kinship_war: "Finno-[ROOT.GetAdjective] Perang Kekerabatan"
 FIN_finno_soviet_kinship_war_desc: "Selama perang saudara di Rusia, Finlandia terlibat dalam perang kekerabatan, yang mana mereka menyusup ke wilayah kami untuk mencuri tanah kami, dan sekarang mereka mulai melakukan hal yang sama lagi."
 FIN_crush_the_karelian_insurrection: "Hancurkan Pemberontakan Karelia"
 FIN_crush_the_karelian_insurrection_desc: "Sekarang kita telah mengumpulkan cukup senjata dan tentara untuk menghancurkan Pemberontakan Karelian regionalis. Mulailah operasinya!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp: "£infantry_equipment_text_icon §Y1500§! £command_power §Y30§! £pol_power §Y70§!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp_blocked: "£infantry_equipment_text_icon §R1500§! £command_power §R30§! £pol_power §R70§!"
 FIN_crush_the_karelian_insurrection_decision_cost_ie_cp_pp_tooltip: "Diperlukan biaya £infantry_equipment_text_icon §Y1500§! £command_power §Y30§! £pol_power §Y70§! untuk mengambil keputusan"
 FIN_crush_the_karelian_insurrection_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! §Gtidak akan dapat memicu Pemberontakan Karelia lagi§!."
 FIN_confederated_finno_russian_republics_category: "Republik Konfederasi Finno-Rusia"
 FIN_confederated_finno_russian_republics_category_desc: "Ada banyak orang Finlandia yang tinggal di republik dan teritori Rusia, seperti Finlandia, Estonia, Karelia, Veps, Izhoria, Votes, Seto, Voro, dan Ingrian. Kita harus membentuk konfederasi negara-negara yang dapat mendukung semua hal tersebut dan lebih banyak lagi."
 FIN_integrate_karelia_puppet: "Integrasikan [FROM.GetName] sebagai Republik"
 FIN_integrate_karelia_puppet_desc: "Sudah waktunya kita membangun Karelia sebagai Republik baru yang dapat kita pimpin."
 FIN_integrate_karelia_states: "Integrasikan [FROM.GetName] sebagai bagian dari Republik Karelia"
 FIN_integrate_karelia_states_desc: "Republik Karelia masih belum mencakup seluruh wilayah yang dihuni oleh orang Karelia, dan dengan mengintegrasikan [FROM.GetName] ke dalamnya, kita dapat mencoba menyelesaikan situasi tersebut."
 FIN_integrate_karelia_additional_states: "Tambahkan [FROM.GetName] ke Republik Karelia"
 FIN_integrate_karelia_additional_states_desc: "Republik Karelia masih belum mencakup seluruh wilayah yang dihuni oleh orang Karelia, dan dengan mengintegrasikan [FROM.GetName] ke dalamnya, kita dapat mencoba menyelesaikan situasi tersebut."
 FIN_integrate_veps_states: "Integrasikan [FROM.GetName] sebagai Republik"
 FIN_integrate_veps_states_desc: "Orang-orang Veps tidak pernah memiliki negara bagian mereka sendiri, tetapi sudah saatnya kita memberikan hal itu kepada mereka."
 FIN_integrate_veps_additional_states: "Integrasikan [FROM.GetName] sebagai Republik"
 FIN_integrate_veps_additional_states_desc: "Ada lebih banyak wilayah yang dapat diintegrasikan ke dalam Republik Veps yang baru dibentuk, dan [FROM.GetName] adalah salah satunya."
 FIN_integrate_ingria_states: "Integrasikan [FROM.GetName] sebagai Republik Ingria"
 FIN_integrate_ingria_states_desc: "Ada lebih banyak wilayah yang dapat diintegrasikan ke dalam Republik Ingria yang baru dibentuk, dan [FROM.GetName] adalah salah satunya."
 FIN_integrate_ingria_additional_states: "Tambahkan [FROM.GetName] ke Republik Ingria"
 FIN_integrate_ingria_additional_states_desc: "Ada lebih banyak wilayah yang dapat diintegrasikan ke dalam Republik Ingria yang baru dibentuk, dan [FROM.GetName] adalah salah satunya."
 FIN_integrate_leningrad: "Tetapkan [FROM.GetName] sebagai ibu kota Republik Ingria"
 FIN_integrate_leningrad_desc: "[195.GetName] mungkin mayoritas orang Rusia, tetapi dengan rencana yang kami adakan untuk Republik Ingria baru, hal itu tidak menjadi masalah."
 FIN_request_an_armistice_with_moscow: "Minta gencatan senjata dengan Moskow"
 FIN_request_to_switch_sides_in_the_war: "Tawarkan untuk Beralih Sisi sebagai Imbalan Perdamaian"
