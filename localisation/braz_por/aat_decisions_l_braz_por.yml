 FIN_mining_the_sea: "Menambang Laut"
 FIN_mining_the_sea_desc: "Kita harus menambang lautan untuk memastikan bahwa lalu lintas musuh tidak dapat melewatinya, dan kita lebih aman dari serangan laut."
 FIN_mining_the_sea_decision_cost_pp_xp_cp: "£pol_power  §Y[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £navy_experience  §Y[?FIN.FIN_mining_the_sea_pp_xp_cost]§! £command_power  §Y[?FIN.FIN_mining_the_sea_cp_cost]§!"
