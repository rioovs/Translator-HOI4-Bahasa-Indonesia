 FIN_surrender_to_the_soviet_union: "Menyerah pada [SOV.GetNameDef]"
 FIN_surrender_to_the_soviet_union_desc: "Jelas bahwa meskipun prajurit kita telah melakukan upaya yang paling berani, kita tidak dapat menahan [SOV.GetAdjective] selamanya. Sudah saatnya kita meminta perdamaian terbatas dengan musuh-musuh kita."
 FIN_reached_out_to_soviets_to_surrender_flag: "Sudah berusaha untuk memulai negosiasi perdamaian dengan [SOV.GetNameDef]"
 FIN_demand_peace_negotiations: "Menuntut Perundingan Damai kepada [SOV.GetName]"
 FIN_demand_peace_negotiations_desc: "Kini setelah kita berhasil menguasai kembali [SOV.GetAdjective], kita dapat mencoba menegakkan perdamaian."
 FIN_can_demand_territory_if_occupying_tt: "Kami akan dapat meminta konsesi Teritorial dari [SOV.GetNameDef] jika kami menguasai negara bagian §Y[213.GetName]§!, §Y[215.GetName]§! atau §Y[216.GetName]§!."
 FIN_can_demand_peace_negotiations_flag: "Telah menyelesaikan misi §Y$FIN_hold_leningrad_mission$§! (kontrol §Y[195.GetName]§! setidaknya selama §Y30 hari§!) dan saat ini mengendalikan §Y[195.GetName]§!"
 FIN_winter_war_ongoing_flag: "[ROOT.GetFlag]§Y[ROOT.GetNameDef]§! sedang berperang dalam Perang Musim Dingin melawan §Y[SOV.GetNameDef]§!, sebagai pembela."
 FIN_hold_leningrad_mission: "Tahan [195.GetName]"
 FIN_hold_leningrad_mission_desc: "[195.GetName] mungkin telah direbut oleh pasukan kami, namun untuk melaksanakan tuntutan kami, kami harus mempertahankan wilayah tersebut sampai pasukan [SOV.GetAdjective] mengalami demoralisasi yang cukup."
 FIN_retake_leningrad_mission: "Ambil kembali [195.GetName]"
 FIN_retake_leningrad_mission_desc: "Pasukan [FIN.GetAdjective] telah merebut [195.GetName] dari kami, dan jika kami tidak dapat segera merebutnya kembali, mereka akan dapat melaksanakan tuntutan apa pun yang mereka miliki."
 FIN_finland_can_send_peace_demands_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! dapat menuntut perundingan perdamaian, termasuk [ROOT.GetAdjective] konsesi teritorial jika mereka menguasai §Y[213.GetName]§!, §Y[215.GetName]§! atau §Y[216.GetName]§!."
 FIN_finnish_resistance_category: "[FIN.GetAdjective] Resistensi"
 FIN_finnish_resistance_category_desc: "Sebagai bagian dari operasi militer rahasia, sejumlah besar senjata dan perlengkapan Angkatan Darat [ROOT.GetAdjective] disimpan di tempat persembunyian yang tersebar di seluruh Finlandia, dengan tujuan membantu elemen Perlawanan [ROOT.GetAdjective] untuk melanjutkan perjuangan melawan pasukan kita."
 FIN_search_for_weapon_caches_in_state: "Cari Cache Senjata di [FROM.GetName]"
 FIN_search_for_weapon_caches_in_state_desc: "Pasukan kami akan melakukan penyelidikan menyeluruh terhadap Kasus Tembolok Senjata Finlandia di [FROM.GetName] untuk menemukan dan menyita semua simpanan senjata di negara bagian tersebut."
 FIN_search_for_weapon_caches_decision_cost_cp: "£command_power  §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_search_for_weapon_caches_decision_cost_cp_blocked: "£command_power  §R[?FIN.FIN_search_for_weapon_caches_decision_cost]§!"
 FIN_search_for_weapon_caches_decision_cost_cp_tooltip: "Dibutuhkan biaya £command_power §Y[?FIN.FIN_search_for_weapon_caches_decision_cost]§! untuk mengambil keputusan"
 FIN_motion_of_no_confidence_against_leader: "Mosi Tidak Percaya terhadap [ROOT.GetLeader]"
 FIN_motion_of_no_confidence_against_leader_desc: "[ROOT.GetLeader] belum berbuat cukup untuk menyelesaikan permasalahan yang dihadapi negara kita, dan jelas fakta ini tidak akan berubah. Sudah waktunya untuk mengadakan mosi tidak percaya untuk menggulingkan pemimpin yang tidak kompeten ini."
 FIN_resignation_of_kallio: "Pengunduran diri $FIN_kyosti_kallio$"
 FIN_resignation_of_kallio_desc: "$FIN_kyosti_kallio$ bukanlah negarawan terhebat, dan kegagalannya baru-baru ini menunjukkan bahwa ia tidak dapat mengarahkan negara ke arah yang benar. Kini, dengan ketegangan dunia yang semakin tinggi dan kesehatannya yang tidak memungkinkan dia untuk menangani masalah serius yang terus bermunculan, sebaiknya dia mengundurkan diri."
 FIN_form_a_military_government: "Membentuk Pemerintahan Militer"
 FIN_form_a_military_government_desc: "Pemerintahan sipil saat ini telah menunjukkan kelemahan dalam menghadapi permusuhan dan kesulitan. $FIN_carl_mannerheim$ telah melayani negara kita dengan baik sebelumnya, dan pasti akan melakukannya lagi. Dia harus membentuk Pemerintahan Militer untuk menangkis setiap musuh kita."
 FIN_resignation_of_mannerheim: "Pengunduran diri $FIN_carl_mannerheim$"
 FIN_resignation_of_mannerheim_desc: "$FIN_carl_mannerheim$ tidak mempunyai kebutuhan atau keinginan untuk memerintah negara tanpa batas waktu, dan dengan demikian ingin mengumumkan pengunduran dirinya dari jabatan Presiden, dengan menyatakan bahwa dia tidak diperlukan lagi karena dia telah memenuhi tugas yang dia janjikan untuk dipenuhi ketika mulai menjabat."
 FIN_organize_the_opposition: "Atur Oposisi"
 FIN_organize_the_opposition_desc: "Pemerintah belum berhasil memenuhi janjinya dan harus ditindaklanjuti. Sudah waktunya untuk menyatukan oposisi dan mengadakan acara untuk mengumpulkan dukungan dan mendiskreditkan [ROOT.GetLeader]."
 FIN_appeal_to_the_finnish_spirit: "Menarik Semangat Finlandia"
 FIN_appeal_to_the_finnish_spirit_desc: "Kita harus memanfaatkan tekad, ketangguhan, dan ketabahan Finlandia yang luar biasa dalam menghadapi kesulitan. Rakyat Finlandia harus bekerja sama untuk mengatasi segala rintangan. Sisu kita membuat kita kuat!"
 FIN_entice_the_masses: "Pikat Massa"
 FIN_entice_the_masses_desc: "Massa mudah terombang-ambing. Dengan memberikan janji untuk menyelesaikan pertanyaan-pertanyaan dan persoalan-persoalan kecil yang menyentuh hati, pemerintah kita dapat dengan mudah menjadi lebih menarik dan disukai oleh rata-rata warga Finlandia."
 FIN_organize_the_opposition_cost_increase_tt: "Biaya untuk keputusan §Y$FIN_organize_the_opposition$§! akan §Rdikalikan§! dengan §Y[?FIN_bop_decision_cost_multiplier]§!."
 FIN_appeal_to_the_finnish_spirit_cost_increase_tt: "Biaya untuk keputusan §Y$FIN_appeal_to_the_finnish_spirit$§! akan §Rdikalikan§! dengan §Y[?FIN_bop_decision_cost_multiplier]§!."
 FIN_entice_the_masses_cost_increase_tt: "Biaya untuk keputusan §Y$FIN_entice_the_masses$§! akan §Rdikalikan§! dengan §Y[?FIN_bop_decision_cost_multiplier]§!."
 FIN_the_path_to_socialism: "Jalan Menuju Sosialisme"
 FIN_the_path_to_socialism_desc: "Dalam beberapa tahun ke depan, melalui upaya kolektif masyarakat, kita akan mencapai sosialisme sejati, meskipun jalan menuju tujuan tersebut mungkin penuh duri dan sulit. Namun kita harus terus menapakinya, apa pun risikonya."
 FIN_gather_popular_support: "Kumpulkan Dukungan Populer"
 FIN_gather_popular_support_desc: "Rakyat sangat penting bagi revolusi atau pemerintahan apa pun, dan kita harus melakukan yang terbaik untuk mengumpulkan semua dukungan yang kita bisa dari mereka."
 FIN_gather_popular_support_dec_tt: "Pihak kami akan mendapatkan §G+10%§! dari total wilayah dan unit militer.\nEkstra Komunis §YMilisi§! Perpecahan akan muncul."
 when_civil_war_starts_tt: "§YSaat Perang Saudara dimulai:§!"
 FIN_crack_down_on_fascists: "Menindak Fasis"
 FIN_crack_down_on_fascists_desc: "Kaum fasis adalah musuh sebenarnya rakyat [FIN.GetAdjective], dan harus diberantas secepatnya."
 FIN_crack_down_on_fascists_character_tt: "Tokoh politik fasis akan dipenjarakan dan tidak akan bisa membantu pihak musuh dalam Perang Saudara:"
 FIN_crack_down_on_fascists_militias_tt: "Musuh akan menghitung dengan Divisi §YMilitia§! Fasis yang lebih sedikit."
 FIN_crack_down_on_the_military: "Menindak Militer"
 FIN_crack_down_on_the_military_desc: "Akhir-akhir ini pihak militer bersikap mencurigakan dan perlu diwaspadai sebelum hal ini menjadi masalah."
 FIN_crack_down_on_the_military_character_tt: "Jenderal dan Penasihat Militer tertentu akan dimasukkan ke dalam penjara dan tidak akan tersedia untuk pihak musuh dalam Perang Saudara:"
 FIN_crack_down_on_the_military_divs_tt: "Beberapa divisi §YInfantri§! Fasis akan dibubarkan."
 effects_applied_to_the_enemy_side_in_cw_tt: "§YEfek diterapkan pada pihak musuh dalam Perang Saudara:§!"
 FIN_prepare_construction_workers_actions: "Mempersiapkan Tindakan Pekerja Konstruksi"
 FIN_prepare_construction_workers_actions_desc: "Para pekerja konstruksi dapat melumpuhkan perekonomian melalui upaya terkoordinasi mereka dalam sehari, dan sudah saatnya kita memanfaatkan orang-orang ini semaksimal mungkin."
 FIN_prepare_construction_workers_actions_dec_tt: "Pihak kami akan mendapatkan §G+5%§! dari total wilayah dan unit militer.\nEkstra Komunis §YMilisi§! Perpecahan akan muncul."
 FIN_prepare_construction_workers_actions_enemy_side_dec_tt: "Sejumlah Pabrik dan Infrastruktur Sipil akan disabotase dan dirusak."
 FIN_align_the_trade_unions: "Menyelaraskan Serikat Pekerja"
 FIN_align_the_trade_unions_desc: "Dukungan serikat pekerja terbukti sangat dibutuhkan oleh pemerintah kita. Kita harus membuat konsesi agar mereka tetap berada di pihak kita."
 FIN_align_the_trade_unions_enemy_side_dec_tt: "Sejumlah Pabrik Militer dan Galangan Kapal akan disabotase dan dirusak."
 FIN_purchase_soviet_equipment: "Beli Peralatan Soviet"
 FIN_purchase_soviet_equipment_desc: "Soviet memiliki banyak peralatan yang dapat kita gunakan untuk hal-hal yang lebih baik dan lebih penting."
 FIN_infiltrate_soviet_commandos: "Menyusup ke Komando Soviet di Finlandia"
 FIN_infiltrate_soviet_commandos_desc: "Komando Soviet adalah salah satu prajurit terhebat yang pernah ada, dan mungkin berguna bagi revolusi kita."
 FIN_infiltrate_soviet_commandos_dec_tt: "§G3 Divisi§! dengan 6 batalyon §YInfantri§!, 2 §YBrigade Artileri§! dan 4 §YBatalyon Pendukung§!, akan dibentuk di ibu kota kita."
 FIN_call_to_union_activism: "Panggilan untuk Aktivisme Serikat"
 FIN_call_to_union_activism_desc: "Serikat pekerja mempunyai kekuatan untuk menekan pemerintah agar mengambil kebijakan yang lebih menguntungkan kelas pekerja, dan sekarang kita harus menerapkan kebijakan tersebut."
 FIN_push_for_cabinet_participation: "Mendorong Partisipasi Kabinet"
 FIN_push_for_cabinet_participation_desc: "Kaum Sosialis telah dilarang masuk dalam Kabinet sejak tahun 1929. Sudah saatnya kita menekan [ROOT.GetLeader] untuk akhirnya menghormati prinsip-prinsip parlementerisme."
 FIN_gather_funds_for_womens_shelters: "Mengumpulkan Dana untuk Tempat Perlindungan Perempuan"
 FIN_gather_funds_for_womens_shelters_desc: "$FIN_miina_sillanpaa$ telah bekerja keras selama dekade terakhir, mengkampanyekan hak-hak perempuan yang bekerja dan lajang serta mendirikan tempat penampungan perempuan. Dia akan mampu mencapai hasil yang lebih baik lagi jika pemerintah mendukung kegiatannya."
 FIN_appoint_yrjo_leino_as_president: "Tunjuk Yrjö Leino sebagai Presiden"
 FIN_appoint_yrjo_leino_as_president_desc: "Yrjö Leino adalah orang yang benar-benar dapat memimpin rakyat kita menuju kemakmuran, dan menjadikannya Presiden sesegera mungkin harus dipertimbangkan."
 FIN_request_extradition_of_kullervo_manner: "Minta Ekstradisi Cara Kullervo"
 FIN_request_extradition_of_kullervo_manner_desc: "Kondisi Kullervo Manner semakin memburuk dari hari ke hari, dan kami harus membawanya kembali ke [FIN.GetNameDef] sebelum tuberkulosisnya membunuhnya di kamp penjara."
 FIN_prioritize_light_industry: "Prioritaskan Industri Ringan"
 FIN_prioritize_light_industry_desc: "Fokus industri kita semuanya salah, dan kita harus segera mempertimbangkannya kembali."
 FIN_prioritize_heavy_industry: "Prioritaskan Industri Berat"
 FIN_prioritize_heavy_industry_desc: "Fokus industri kita semuanya salah, dan kita harus segera mempertimbangkannya kembali."
 FIN_rebalance_industrial_focus: "Menyeimbangkan Kembali Fokus Industri"
 FIN_rebalance_industrial_focus_desc: "Fokus industri kita semuanya salah, dan kita harus segera mempertimbangkannya kembali."
 FIN_prioritize_light_industry_dec_cost_tt: "Biaya untuk pengambilan keputusan §Y$FIN_prioritize_heavy_industry$§! akan menjadi §Rdua kali lipat§! dengan tetap memprioritaskan industri ringan."
 FIN_prioritize_heavy_industry_dec_cost_tt: "Biaya untuk pengambilan keputusan §Y$FIN_prioritize_light_industry$§! akan §Rdua kali lipat§! dengan tetap memprioritaskan industri berat."
 FIN_rebalance_industrial_focus_dec_cost_tt: "Biaya untuk keputusan §Y$FIN_prioritize_light_industry$§! dan §Y$FIN_prioritize_heavy_industry$§! akan diatur ulang ke nilai aslinya."
 FIN_kullervo_manner_extradited_flag: "§Y$FIN_kullervo_manner$§! telah diekstradisi dari [SOV.GetName] (fokus lengkap §Y$FIN_approach_the_soviets$§! dan keputusan §Y$FIN_request_extradition_of_kullervo_manner$§!) sebelum kematiannya pada §Y31 Januari 1939§!."
 FIN_coastal_garrisons: "Garnisun Pesisir"
 FIN_coastal_garrisons_desc: "Kita harus membentuk garnisun pesisir dengan tujuan melindungi dari segala invasi angkatan laut."
 FIN_coastal_garrisons_decision_cost_pp_xp_cp: "£pol_power  §Y[?FIN.FIN_coastal_garrisons_pp_xp_cost]§! £army_experience  §Y[?FIN.FIN_coastal_garrisons_pp_xp_cost]§! £command_power  §Y[?FIN.FIN_coastal_garrisons_cp_cost]§!"
