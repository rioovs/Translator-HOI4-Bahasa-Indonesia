 NORDIC_ask_for_investment_to_nordic_desc: "Jelas bahwa kita kekurangan modal untuk melakukan investasi yang diperlukan bagi pembangunan kita dan pada akhirnya mencapai kekuasaan. Kita bisa meminta tetangga kita di Nordik, [FROM.GetName] untuk mengalirkan sebagian modalnya ke negara kita untuk mencapai tujuan ini. Tentu saja, mereka akan mendapat imbalan atas dukungan mereka."
