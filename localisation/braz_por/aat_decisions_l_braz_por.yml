 ENG_explode_the_swedish_iron_ore_mine: "Rencana R 4"
 ENG_explode_the_swedish_iron_ore_mine_tt: "Kita hanya mempunyai waktu terbatas untuk menyabotase tambang besi sebelum kemarahan internasional dan dalam negeri terjadi. Tidak mengelola hal ini berarti kekalahan militer yang memalukan."
 #NORTH SEA EMPIRE
 form_north_sea_category: "Kembalikan Kekaisaran Laut Utara"
 form_north_sea_category_desc: "Dengan seluruh Alam Cnut Agung berada di bawah kekuasaan kita, waktunya telah tiba untuk memulihkan Danelaw yang lama dan menghidupkan kembali semangat Kekaisaran Laut Utara. Ombak sekali lagi akan menjadi kekuasaan kita dan kita akan memerintah sesuai keinginan kita."
 form_north_sea_empire: "Kembalikan Kekaisaran Laut Utara"
 #Baltic Sea Empire
 form_baltic_sea_empire_category: "Mendirikan Dominium Maris Baltici"
 form_baltic_sea_empire_category_desc: "Membangun hegemoni atas Laut Baltik sudah lama menjadi salah satu tujuan utama kami. Kami telah berperang banyak, terutama dengan Swedia, untuk menguasai laut. Setelah ambisi kita akhirnya terpenuhi, inilah waktunya untuk mendirikan [ROOT.GetAdjective] dominium maris baltici."
 form_baltic_sea_empire: "Mendirikan Dominium Maris Baltici"
