l_braz_por:
 rhineland: "Remiliterisasi Rhineland"
 rhineland_desc: "Rhineland telah mengalami demiliterisasi sejak akhir Perang Dunia Pertama, namun penghinaan ini tidak akan terjadi lagi! Jerman adalah negara berdaulat dan bebas memindahkan pasukan ke mana pun dalam batas negaranya!"
 rhineland_short_desc: "§LPindahkan pasukan Jerman ke barat Rhine yang bertentangan dengan Perjanjian Versailles.§!"
 rhineland_1: "Remiliterisasi Mosselland"
 rhineland_2: "Remiliterisasi Rheinland"
 anschluss: "Aktifkan Anschluss"
 anschluss_desc: "Anschluss, atau persatuan dengan Austria, adalah tujuan lama rakyat Jerman. Meski dilarang oleh Perjanjian Versailles, akhirnya tiba saatnya untuk mewujudkannya. Kita harus meningkatkan dukungan lokal terhadap fasisme di Austria untuk meletakkan dasar bagi aneksasi."
 anschluss_short_desc: "§LMenggunakan cara terselubung untuk meningkatkan dukungan rakyat terhadap Fasisme di Austria.§!"
 anschluss_1: "Mempengaruhi politik"
 take_state: "Taklukkan"
 take_state_desc: "Ambil $STATE|Y$ dari $TARGET|Y$."
 take_state_short_desc: "Tujuan perang ini akan membuat negara-negara terpilih lebih murah untuk dipilih dalam konferensi perdamaian."
 take_state_focus: "Taklukkan (Fokus)"
 take_state_focus_desc: "Ambil $STATE|Y$ dari $TARGET|Y$."
 take_state_focus_short_desc: "Tujuan perang ini akan membuat negara-negara terpilih lebih murah untuk dipilih dalam konferensi perdamaian."
 liberate_wargoal: "Membebaskan"
 liberate_wargoal_short_desc: "Membebaskan"
 liberate_wargoal_desc: "Tujuan perang ini akan menjadikan pembebasan lebih murah untuk dicapai dalam konferensi perdamaian."
 independence_wargoal: "Kemerdekaan"
 independence_wargoal_short_desc: "Perang Kemerdekaan"
 independence_wargoal_desc: "Perang Kemerdekaan"
 puppet_wargoal_focus: "Boneka (Fokus)"
 puppet_wargoal_focus_desc: "Boneka $TARGET|Y$"
 puppet_wargoal_focus_short_desc: "Tujuan perang ini akan membuat negara boneka lebih murah dalam konferensi perdamaian."
 take_claimed_state: "Ambil keadaan yang diklaim"
 take_claimed_state_desc: "Ambil $STATE|Y$ dari $TARGET|Y$"
 take_claimed_state_short_desc: "Tujuan perang ini akan membuat negara-negara terpilih lebih murah untuk dipilih dalam konferensi perdamaian."
 take_core_state: "Ambil kembali status inti"
 take_core_state_desc: "Ambil kembali $STATE|Y$ dari $TARGET|Y$"
 take_core_state_short_desc: "Tujuan perang ini akan membuat negara-negara terpilih lebih murah untuk dipilih dalam konferensi perdamaian."
 annex_everything: "Lampiran"
 annex_everything_desc: "Lampirkan negara bagian yang dipilih."
 annex_everything_short_desc: "Tujuan perang ini akan membuat aneksasi lebih murah untuk dilakukan pada konferensi perdamaian."
 civil_war: "Perang Saudara"
 civil_war_desc: "Perang saudara! Bangsa ini terpecah menjadi faksi-faksi yang berjuang untuk menguasai negara."
 civil_war_short_desc: "Tujuan perang ini akan membuat aneksasi lebih murah untuk dilakukan pada konferensi perdamaian."
 topple_government: "Menggulingkan Pemerintahan"
 topple_government_desc: "Menggulingkan pemerintahan yang berkuasa."
 topple_government_short_desc: "Tujuan perang ini akan membuat keputusan untuk menggulingkan pemerintahan lebih murah dalam konferensi perdamaian."
 anti_comintern_pact: "Pakta Anti-Komintern"
 anti_comintern_pact_desc: "Sudah waktunya untuk membuat perjanjian \"dengan mengakui bahwa tujuan Komunis Internasional, yang dikenal sebagai Komintern, adalah untuk menghancurkan dan menundukkan negara-negara yang ada dengan segala cara yang mereka bisa; yakin bahwa toleransi terhadap campur tangan Komunis Internasional dalam urusan internal suatu negara tidak hanya membahayakan perdamaian internal dan kesejahteraan sosial mereka, namun juga merupakan ancaman bagi perdamaian dunia yang ingin bekerja sama dalam pertahanan terhadap kegiatan subversif Komunis.\""
 anti_comintern_pact_short_desc: "§LMembentuk front persatuan melawan komunisme bersama Italia dan Jepang.§!"
 tripartite_pact: "Pakta Tripartit"
 tripartite_pact_desc: "Untuk memperkuat Pakta Anti-Komintern, selama sepuluh tahun ke depan negara-negara penandatangan sepakat bahwa \"tujuan utama mereka adalah untuk membangun dan memelihara tatanan baru, untuk memajukan kemakmuran bersama dan kesejahteraan masyarakat yang bersangkutan.\""
 tripartite_pact_short_desc: "§LJalin hubungan lebih erat dengan Italia dan Jepang dengan menandatangani perjanjian baru.§!"
 demand_sudetenland: "Minta Sudetenland"
 demand_sudetenland_desc: "Rakyat Jerman di Sudetenland dianiaya dengan kejam oleh penguasa Cekoslowakia, sebuah kejahatan yang tidak bisa dibiarkan berlangsung lebih lama lagi! Sudetenland dan rakyatnya harus segera diserahkan kepada Jerman."
 demand_sudetenland_short_desc: "§LPasukan massal di sepanjang perbatasan Cekoslowakia untuk menekan Praha.§!"
 fate_of_czechoslovakia: "Nasib Cekoslowakia"
 fate_of_czechoslovakia_desc: "Dengan Sudetenland di tangan kita, Cekoslowakia tidak berdaya. Sudah waktunya untuk mengakhiri keadaan menyedihkan ini."
 fate_of_czechoslovakia_short_desc: "§LKumpulkan pasukan di Sudetenland untuk mencaplok sisa-sisa negara Ceko.§!"
 molotov_ribbentrop_pact: "Pakta Molotov-Ribbentrop"
 molotov_ribbentrop_pact_desc: "Dengan menandatangani perjanjian persahabatan dan non-agresi dengan Uni Soviet, kita dapat mencapai kesepakatan tentang apa yang harus dilakukan terhadap negara-negara yang berada di antara perbatasan kita saat ini serta terlibat dalam volume perdagangan yang lebih tinggi. Selain ketentuan non-agresi, perjanjian tersebut mencakup protokol rahasia yang membagi wilayah Rumania, Polandia, Lituania, Latvia, Estonia, dan Finlandia menjadi wilayah pengaruh Nazi dan Soviet, untuk mengantisipasi potensi penataan ulang teritorial dan politik negara-negara tersebut."
 molotov_ribbentrop_pact_short_desc: "§LMenandatangani pakta non-agresi dengan Uni Soviet untuk menghindari intervensi Soviet.§!"
 poland_goal: "Danzig atau perang!"
 poland_goal_desc: "Danzig adalah orang Jerman, Danzig tetap orang Jerman, dan Danzig akan menjadi orang Jerman mulai sekarang! Kita harus mempersiapkan rakyat Jerman menghadapi perang yang tak terhindarkan dengan Polandia. Kampanye propaganda akan memperkuat tekad mereka untuk menghadapi pertempuran yang akan datang, sementara kejahatan bangsa Polandia terungkap ke seluruh dunia. Danzig dan wilayah sekitarnya akan kembali ke Jerman!"
 poland_goal_short_desc: "§LPersiapkan rakyat Jerman untuk berperang dengan Polandia, lalu berbaris ke Warsawa!§!"
 poland_goal_1: "Bersiaplah untuk perang"
 poland_goal_2: "Nyatakan perang"
 test_the_chinese_focus: "Insiden Perbatasan Tiongkok"
 test_the_chinese_focus_desc: "Tiongkok masih menolak mengakui pembebasan Manchuria, dan ketegangan di sepanjang perbatasan dekat Beijing telah mengakibatkan beberapa bentrokan. Jika kita merekayasa sebuah insiden, kita dapat meningkatkan konflik tersebut menjadi perang skala penuh. Hal ini akan memberi kita alasan untuk berurusan dengan Tiongkok untuk selamanya!"
 test_the_chinese_focus_short_desc: "§LMemprovokasi konfrontasi dengan mengerahkan pasukan di sepanjang perbatasan Tiongkok.§!"
 chinese_border_incident_SUCCEEDED: "Insiden Jembatan Marco Polo"
 chinese_border_incident_SUCCEEDED_DESC: "Elemen pasukan kami terlibat dalam pertempuran sengit dengan tentara Tiongkok ketika mencoba untuk menguasai Jembatan Marco Polo yang strategis di selatan Beijing. Pertempuran berakhir tanpa hasil, namun kami menuntut permintaan maaf dan konsesi wilayah tambahan."
 south_pacific_mandate: "Mandat Pasifik Selatan"
 south_pacific_mandate_desc: "Kepemilikan kami di Pasifik, yang diberikan kepada kami oleh Liga Bangsa-Bangsa setelah perang terakhir, akan menjadi garis pertahanan pertama Jepang dalam perang melawan Amerika di masa depan. Pulau-pulau ini merupakan kapal induk yang tidak dapat tenggelam, dan kita harus mengambil langkah-langkah untuk membentengi pulau-pulau tersebut."
 south_pacific_mandate_short_desc: "§LBangun benteng pantai baru di kepulauan Pasifik kita.§!"
 south_pacific_mandate_SUCCEEDED: "Mandat Pasifik Selatan telah diperkuat"
 south_pacific_mandate_SUCCEEDED_DESC: "Para insinyur kami telah membentengi pulau-pulau kami di Mandat Pasifik Selatan. Setiap penyerang akan kesulitan mengusir pasukan kita."
 demand_indochina_focus: "Permintaan Indochina Prancis"
 demand_indochina_focus_desc: "Setelah kekalahannya di Eropa, kekuasaan Perancis atas koloni-koloninya di luar negeri semakin lemah. Menekan pemerintah baru Perancis agar memberikan Jepang akses penuh ke pangkalannya di Indochina. Wilayah ini akan berguna sebagai batu loncatan untuk kampanye di masa depan."
 demand_indochina_focus_tt: "Prancis memiliki §YIndochina§!"
 demand_indochina_focus_short_desc: "§LMenekan pemerintah baru Perancis agar menyerahkan Indochina.§!"
 demand_french_indochina_SUCCEEDED: "Permintaan Dikirim"
 demand_french_indochina_SUCCEEDED_DESC: "Pasukan kami ditempatkan di sepanjang perbatasan Indochina Prancis, sehingga jelas bahwa akan ada konsekuensi serius jika usulan kami ditolak."
 test_the_ussr_focus: "Memperkuat Perbatasan Soviet"
 test_the_ussr_focus_desc: "Kita harus menanggapi provokasi Soviet yang terus berlanjut di sepanjang perbatasan utara kita. Pelanggaran yang terus menerus mereka terhadap perbatasan Manchuria tidak dapat lagi ditoleransi. Pasukan massal di Manchuria utara untuk mencegah pelanggaran di masa depan."
 test_the_ussr_focus_short_desc: "§LPasukan massal di Manchuria untuk mencegah provokasi Soviet.§!"
 naval_expansion_focus: "Meningkatkan Produksi Angkatan Laut"
 naval_expansion_focus_desc: "Kita tidak lagi terikat oleh Perjanjian Angkatan Laut Washington, dan sebagai negara kepulauan, angkatan laut sangat penting bagi kelangsungan hidup kita. Memperluas fasilitas pelabuhan kami untuk meningkatkan produksi angkatan laut. Hanya dengan cara itulah Jepang dapat membangun armada yang layak."
 naval_expansion_focus_short_desc: "§LMeningkatkan produksi angkatan laut Jepang dengan membangun lebih banyak galangan kapal.§!"
 increase_naval_production_SUCCEEDED: "Produksi Angkatan Laut Meningkat"
 increase_naval_production_SUCCEEDED_DESC: "Kami telah berhasil meningkatkan produksi angkatan laut kami. Kaisar akan segera memimpin armada terkuat yang pernah ada di dunia!"
 siamese_puppet_focus: "Tekanan Siam"
 siamese_puppet_focus_desc: "Pasukan kami memerlukan akses ke Siam untuk mencapai wilayah kekuasaan Inggris di Burma dan Malaya. Unjuk kekuatan dapat meyakinkan pemerintah Siam untuk menandatangani aliansi dengan kita sebagai mitra setia dalam Kawasan Kemakmuran Bersama Asia Timur Raya."
 siamese_puppet_focus_short_desc: "§LMeyakinkan Siam untuk bergabung dengan kami.§!"
 occupy_philippines: "Menempati Filipina"
 occupy_philippines_desc: "Langkah pertama dalam keberhasilan kampanye Pasifik adalah pendudukan Filipina. Amerika tidak akan ragu untuk menggunakan pulau-pulau tersebut sebagai pangkalan terdepan untuk menyerang Jepang secara langsung, namun kita dapat menggunakannya untuk tujuan yang sama dalam operasi di masa depan melawan Wilayah Sumber Daya Selatan."
 occupy_philippines_short_desc: "§LPasukan darat di Filipina menolak penggunaannya sebagai basis melawan kami.§!"
 southern_resource_area: "Wilayah Sumber Daya Selatan"
 southern_resource_area_desc: "Borneo Britania dan Hindia Belanda yang kaya merupakan tujuan strategis penting yang sudah siap untuk dilaksanakan. Jepang harus mengamankan akses ke ladang minyak dan perkebunan karet, atau industrinya akan kelaparan dan mesin perangnya akan runtuh."
 southern_resource_area_short_desc: "§LMenempati Area Sumber Daya Selatan untuk mengamankan bahan mentah bagi industri perang kita.§!"
 british_far_east: "Timur Jauh Inggris"
 british_far_east_desc: "Inggris perlu dilucuti dari kerajaan kolonialnya di Asia jika Jepang ingin mengambil tempat yang selayaknya sebagai pemimpin tatanan baru di Asia Timur Raya. Rebut Hong Kong, menduduki Semenanjung Malaya dan maju ke Burma. Membangun perbatasan baru di sepanjang perbatasan menuju India."
 british_far_east_short_desc: "§LSelesaikan penaklukan Hongkong, Singapura dan Burma.§!"
 isolate_australia: "Isolasi Australia"
 isolate_australia_desc: "Australia sangat penting dalam upaya perang Sekutu di Pasifik, dan Australia tidak boleh dijadikan sebagai basis di mana pasukan dikerahkan untuk melawan Jepang dan penaklukannya yang sah. Dengan mengambil alih pulau-pulau penting di barat daya Pasifik, kita dapat mengisolasi Australia dari Amerika Serikat."
 isolate_australia_short_desc: "§LMengisolasi Australia dengan menduduki pulau-pulau penting di sekitarnya.§!"
 invade_australia: "Menyerang Australia"
 invade_australia_desc: "Waktunya telah tiba untuk melakukan invasi besar-besaran ke Australia. Hal ini akan menghilangkan secara permanen benteng terbesar kekuatan Sekutu di Pasifik dan mengamankan sisi selatan Kawasan Kemakmuran Bersama Asia Timur Raya."
 invade_australia_short_desc: "§LMeluncurkan invasi besar-besaran ke Australia.§!"
 secure_the_pacific: "Amankan Pasifik"
 secure_the_pacific_desc: "Pangkalan Amerika di seluruh Pasifik harus direbut, untuk mengurangi kemampuan proyeksi kekuatan armada mereka di wilayah kita. Staf Umum Angkatan Laut Kekaisaran telah mengidentifikasi beberapa pulau yang harus diduduki, termasuk pangkalan utama Armada Pasifik AS di Hawaii."
 secure_the_pacific_short_desc: "§LMenempati pulau-pulau penting Amerika untuk mengamankan kendali atas Pasifik.§!"
 close_panama_canal: "Tutup Terusan Panama"
 close_panama_canal_desc: "Amerika mengandalkan Terusan Panama untuk mentransfer aset angkatan laut antara pantai barat dan timur, dan inilah kelemahan mereka! Kita harus merebut Kepulauan Galapagos untuk membangun pangkalan depan, dan kemudian mendaratkan pasukan di Panama untuk menutup terusan tersebut. Untuk Kaisar!"
 close_panama_canal_short_desc: "§LMenempati Terusan Panama untuk menolak penggunaannya bagi Amerika.§!"
 invasion_of_alaska: "Invasi Alaska"
 invasion_of_alaska_desc: "Pendekatan utara ke Home Islands harus diamankan dengan menduduki Kepulauan Aleutian. Penguasaan atas pulau-pulau ini akan semakin memungkinkan kita membangun pijakan di Amerika Utara dengan menginvasi Alaska. Keterpencilan wilayah ini seharusnya menyulitkan Amerika untuk memperkuat wilayahnya."
 invasion_of_alaska_short_desc: "§LMenyerang dan menduduki wilayah Amerika di Alaska.§!"
 invasion_of_west_coast: "Operasi Ketsu-Go"
 invasion_of_west_coast_desc: "Markas Besar Kekaisaran telah memilih untuk mengakhiri perang kita dengan Amerika dengan melancarkan invasi ke Pantai Barat mereka. Sasaran operasi ini meliputi Los Angeles, San Francisco dan Seattle. Bersiaplah untuk kemungkinan serangan balik terhadap tempat berpijak kita."
 invasion_of_west_coast_short_desc: "§LMemulai invasi ke Pantai Barat Amerika.§!"
 invasion_of_india: "Invasi ke India"
 invasion_of_india_desc: "Pada akhirnya, era dominasi Inggris atas anak benua India akan berakhir. Kita harus melanjutkan perjalanan dari Burma dan mengusir Inggris sepenuhnya dari Asia. Ini akan menjadi pukulan yang tidak akan pernah bisa dipulihkan oleh kerajaan mereka!"
 invasion_of_india_short_desc: "§LUsir Inggris keluar dari India dengan menduduki seluruh anak benua.§!"
 secure_the_indian_ocean: "Amankan Samudera Hindia"
 secure_the_indian_ocean_desc: "Kita harus menguasai Samudera Hindia untuk mencegah pergerakan armada Sekutu menuju Asia. Ada beberapa tujuan yang harus dicapai, termasuk Madagaskar di lepas pantai Afrika. Pulau ini dapat digunakan sebagai pangkalan untuk mengganggu konvoi Inggris menuju Timur Tengah."
 secure_the_indian_ocean_short_desc: "§LMenetapkan kendali atas Samudera Hindia dengan merebut tujuan-tujuan utama.§!"
 invasion_of_south_africa: "Invasi Afrika Selatan"
 invasion_of_south_africa_desc: "Kekuatan kita yang tak terhentikan kini siap menyerang Afrika Selatan. Penaklukannya akan mempersulit unit angkatan laut Sekutu untuk memasuki Samudera Hindia tanpa menggunakan Terusan Suez. Imperium Inggris yang dekaden sedang terbongkar di depan mata kita."
 invasion_of_south_africa_short_desc: "§LPasukan darat di Afrika Selatan dan hancurkan semua oposisi.§!"
 extend_maginot_line: "Perluas Garis Maginot"
 extend_maginot_line_desc: "Perbatasan kita menuju Jerman dilindungi oleh Garis Maginot yang tangguh, namun serangan Jerman yang mengapit melalui Belgia dan Luksemburg, seperti pada tahun 1914, selalu memungkinkan. Kita harus memperluas benteng pertahanan kita hingga ke Selat Inggris, bahkan jika ini berarti Belgia harus bergantung pada belas kasihan Jerman."
 extend_maginot_line_short_desc: "§LPerluas Jalur Maginot sampai ke Selat Inggris.§!"
 improve_alpine_line: "Perbaiki Jalur Alpen"
 improve_alpine_line_desc: "'Garis Maginot Kecil' yang mempertahankan perbatasan selatan kita menuju Italia selalu menjadi prioritas kedua dalam perencanaan militer kita. Namun, Italia yang fasis menjadi semakin agresif, dan kita tahu mereka mempunyai ambisi teritorial di Prancis selatan. Kita harus meningkatkan benteng Jalur Alpine ke standar yang sama dengan Jalur Maginot."
 improve_alpine_line_short_desc: "§LMemperbaiki benteng pertahanan kita di sepanjang perbatasan Italia.§!"
 expand_french_air_force: "Perluas Armée de l'Air"
 expand_french_air_force_desc: "Kekuatan udara akan menjadi sangat penting dalam perang berikutnya - penyerahan wilayah udara kita pasti berarti penyerahan Perancis sendiri. Kita harus terus memperluas Armée de l'Air untuk memastikan bahwa Perancis memiliki salah satu angkatan udara terbaik di dunia."
 expand_french_air_force_short_desc: "§LMeningkatkan jumlah angkatan udara kita untuk melindungi langit di atas Perancis.§!"
 french_arms_industry: "Meningkatkan Industri Senjata"
 french_arms_industry_desc: "Perang lain dengan Jerman tampaknya semakin mungkin terjadi pada saat ini. Kita harus mempersiapkan diri dengan memperluas industri senjata. Tentara Perancis adalah satu-satunya penghalang antara Jerman dan kekuasaan atas Eropa Barat!"
 french_arms_industry_short_desc: "§LMembangun industri senjata Prancis untuk mempersiapkan perang yang akan datang.§!"
 scandinavian_expedition: "Ekspedisi Skandinavia"
 scandinavian_expedition_desc: "Kita harus melakukan apa yang kita bisa untuk mencegah perang di wilayah Prancis, dan ekspedisi ke Norwegia dan Swedia utara akan membuka peluang baru untuk dipertimbangkan Jerman. Sebagian besar baja Jerman berasal dari wilayah ini, dan dengan memutus pasokan, hal ini dapat melumpuhkan industri mereka."
 scandinavian_expedition_short_desc: "§LBuka front baru untuk Jerman dari Skandinavia utara.§!"
 grand_offensive: "Luncurkan Serangan Besar"
 grand_offensive_desc: "Sementara Wehrmacht sibuk melawan pasukan Polandia yang pemberani di timur, kita harus memenuhi kewajiban aliansi kita dan menyerang Jerman secara mendalam! Menempati jantung industri mereka di Lembah Rhine. Hal ini seharusnya menarik perhatian OKW, dan mungkin memaksa mereka untuk menghentikan serangan mereka ke Polandia."
 grand_offensive_short_desc: "§LMenempati industri Jerman di Lembah Rhine.§!"
 seize_berlin_fra: "Rebut Berlin"
 seize_berlin_fra_desc: "Kami tidak punya pilihan selain berbaris ke Berlin dan menanam Tricolor di atas gedung Reichstag. Mari kita selesaikan perang ini sebelum sempat dimulai dengan sungguh-sungguh."
 seize_berlin_fra_short_desc: "§LMenempati ibu kota Jerman.§!"
 occupy_libya_fra: "Menempati Libya Italia"
 occupy_libya_fra_desc: "Kerajaan kolonial Italia harus dibongkar. Luncurkan serangan ke Libya Italia dari protektorat Tunisia dan menduduki pantai Mediterania. Tujuan vitalnya mencakup kota pelabuhan strategis Tripoli dan Benghazi."
 occupy_libya_fra_short_desc: "§LMelancarkan serangan untuk menduduki Tripoli dan Benghazi.§!"
 occupy_north_italy_fra: "Menempati Italia Utara"
 occupy_north_italy_fra_desc: "Sekali lagi ini saatnya bagi tentara Prancis untuk bergerak ke Italia utara. Sebagian besar industri perang Italia terkonsentrasi di sana, dan Roma harus kehilangan pemanfaatannya. Hancurkan Vallo Alpino yang dibanggakan dan pergilah ke Lembah Po. Hiduplah di Prancis!"
 occupy_north_italy_fra_short_desc: "§LMenembus Vallo Alpino yang dibanggakan dan melaju ke Lembah Po.§!"
 occupy_south_italy_fra: "Menempati Italia Selatan"
 occupy_south_italy_fra_desc: "Bagian selatan semenanjung Italia harus diamankan, bersama dengan Sisilia dan Sardinia. Raih semua tujuan, tapi jangan teralihkan dari target utama kami: Roma. Setelah Anda menduduki Kota Abadi, lanjutkan perjalanan Anda di sepanjang pantai dan hilangkan kantong perlawanan yang tersisa."
 occupy_south_italy_fra_short_desc: "§LRebut Sisilia dan Sardinia beserta ibu kota Italia.§!"
 claim_bessarabia: "Klaim Bessarabia"
 claim_bessarabia_desc: "Wilayah Bessarabia diduduki secara ilegal oleh Rumania pada periode pergolakan setelah Revolusi Rusia. Itu hak milik kami dan harus dikembalikan. Pakta Molotov - Ribbentrop memberi kita kebebasan untuk menghadapi Rumania tanpa ancaman intervensi Jerman, jadi sekaranglah waktunya untuk bertindak."
 claim_bessarabia_short_desc: "§LMemaksa Rumania mengembalikan Bessarabia kepada kami.§!"
 claim_baltic_states: "Klaim Negara Baltik"
 claim_baltic_states_desc: "Negara-negara Baltik adalah eksperimen kapitalisme yang gagal dan harus diakhiri. Perjanjian kami dengan Jerman memungkinkan kami bertindak dengan impunitas di wilayah tersebut, dan kami telah menyiapkan ultimatum kepada Estonia, Latvia, dan Lituania agar mengizinkan kami mendirikan pangkalan militer di dalam perbatasan mereka. Maka akan menjadi hal yang mudah untuk memasukkan negara-negara ini sebagai anggota penuh Uni Republik Sosialis Soviet."
 claim_baltic_states_short_desc: "§LMemasukkan Negara Baltik ke dalam Uni Soviet.§!"
 claim_karelia: "Klaim Karelia"
 claim_karelia_desc: "Sesuai dengan Pakta Molotov - Ribbentrop, Finlandia berada dalam lingkup kepentingan kami, dan waktunya telah tiba untuk merevisi perbatasan mereka. Perbatasan tenggara mereka di Tanah Genting Karelia terletak sangat dekat dengan Leningrad, sehingga membahayakan keamanan negara kita. Kami akan mengajukan tuntutan kepada Helsinki untuk konsesi teritorial Finlandia, namun kami harus siap melawan jika mereka menolak."
 claim_karelia_short_desc: "§LMenuntut Karelia dari Finlandia untuk meningkatkan keamanan Leningrad.§!"
 improve_stalin_line: "Perbaiki Garis Stalin"
 improve_stalin_line_desc: "Pekerjaan di Garis Stalin dimulai pada tahun 1920-an di sepanjang perbatasan barat kita, untuk mempertahankan diri dari negara-negara borjuis di Eropa Barat yang hanya ingin menghancurkan kita. Kita harus terus meningkatkan pertahanan ini."
 improve_stalin_line_short_desc: "§LMeningkatkan pertahanan di sepanjang Garis Stalin untuk mencegah invasi asing.§!"
 five_year_plans: "Rencana Lima Tahun"
 five_year_plans_desc: "Rencana lima tahun untuk pembangunan perekonomian nasional sangatlah penting bagi masa depan Uni Soviet. Keterbelakangan ekonomi dan industri pada akhirnya akan berarti kehancuran kita di tangan kekuatan kapitalis dan fasis di luar negeri. Kita harus terus memperluas industri dan hasil produksi kita!"
 five_year_plans_short_desc: "§LMemperluas hasil industri sipil Uni Soviet.§!"
 operation_zet: "Operasi Zet"
 operation_zet_desc: "Fasis Jepang melancarkan perang untuk menaklukkan seluruh Tiongkok. Tentu saja, Uni Soviet tidak berkepentingan untuk melihat keberhasilan mereka. Kita harus memberikan dukungan apa pun yang kita bisa kepada Tiongkok. Jika beruntung, Tentara Kekaisaran Jepang akan terseret ke dalam rawa yang melemahkan kerajaan mereka dan membuat mereka tetap diduduki di masa mendatang."
 operation_zet_short_desc: "§LMenawarkan dukungan kepada Tiongkok dalam perang mereka melawan Jepang.§!"
 annex_tannu_tuva: "Lampiran Tannu Tuva"
 annex_tannu_tuva_desc: "Republik Rakyat Tuvan adalah anggota Uni Soviet kecuali namanya saja. Mari kita formalkan hubungan tersebut dengan secara resmi menganeksasi mereka ke dalam negara besar kita."
 annex_tannu_tuva_short_desc: "§LMemasukkan Tannu Tuva ke dalam Uni Soviet.§!"
 second_vienna_award: "Penghargaan Wina Kedua"
 second_vienna_award_desc: "Perjanjian Trianon secara tidak adil melucuti lebih dari dua pertiga wilayah Hongaria. Kehilangan Transylvania ke tangan Rumania merupakan hal yang sangat sulit untuk diterima. Namun, tatanan baru telah terbentuk di Eropa, dan kita harus mengajukan petisi kepada teman-teman kita di Jerman agar tanah Hongaria yang dicuri dikembalikan."
 second_vienna_award_short_desc: "§LPetisi Jerman untuk kembalinya Transylvania ke Hongaria.§!"
 claim_memel: "Klaim Memel"
 claim_memel_desc: "Memel adalah salah satu ketidakadilan yang muncul dari Perjanjian Versailles yang dibenci. Provinsi ini menjadi milik Prusia selama ratusan tahun, namun Entente memutuskan untuk memisahkannya dari Jerman dan membiarkannya dianeksasi secara ilegal oleh Lituania. Sudah waktunya untuk memperbaiki kesalahan ini."
 claim_memel_short_desc: "§LMenuntut pemulangan Memel ke Jerman Raya.§!"
 treaty_of_craiova: "Perjanjian Craiova"
 treaty_of_craiova_desc: "Dobrudja Selatan diambil dari kami oleh Rumania setelah Perang Balkan Kedua. Namun, perbatasan Eropa sedang dalam proses digambar ulang, dan Rumania telah dipaksa untuk membuat konsesi. Kita harus menuntut pengembalian wilayah kita yang hilang."
 treaty_of_craiova_short_desc: "§LMenuntut kembalinya Dobrudja selatan dari Rumania.§!"
 german_advisors_china: "Penasihat Jerman di Tiongkok"
 german_advisors_china_desc: "Penasihat militer Jerman telah hadir di Tiongkok setidaknya sejak tahun dua puluhan, memberikan dukungan penting kepada Kuomintang. Mengingat perang yang kita hadapi saat ini, hal ini tidak dapat ditoleransi lagi. Sebagai penandatangan Pakta Anti-Komintern, kami berhak menuntut penarikan segera semua dukungan Jerman kepada Tiongkok. Sudah waktunya bagi Jerman untuk memilih pihak."
 german_advisors_china_short_desc: "§LMenuntut kembalinya penasihat Jerman yang membantu Tiongkok.§!"
 chinese_coastal_regions: "Menempati Wilayah Pesisir Tiongkok"
 chinese_coastal_regions_desc: "Kita harus memanfaatkan keunggulan angkatan laut kita dan mengisolasi Tiongkok dengan menduduki pelabuhan-pelabuhan utama di sepanjang pantai mereka. Markas Besar Umum Kekaisaran telah menetapkan beberapa wilayah yang perlu berada di bawah kendali Jepang."
 chinese_coastal_regions_short_desc: "§LMengisolasi orang Tionghoa dengan menduduki wilayah pesisir mereka.§!"
 chinese_interior: "Menempati Interior Cina"
 chinese_interior_desc: "Mari kita akhiri perlawanan Tiongkok untuk selamanya dengan menyerang wilayah pedalaman mereka. Tunjukkan kepada mereka bahwa jangkauan kita tidak mengenal batas dengan menumpas semua pertentangan. Hal ini akan memastikan dominasi Jepang di Asia."
 chinese_interior_short_desc: "§LMengejar Tiongkok barat hingga ke pedalamannya.§!"
 russian_far_east: "Timur Jauh Rusia"
 russian_far_east_desc: "Uni Soviet harus ditunjukkan bahwa mereka tidak lagi diterima di Asia. Menempati Timur Jauh Rusia, dimulai dengan pangkalan Armada Pasifik mereka di Vladivostok. Sakhalin Utara dan Kamchatka juga perlu diamankan."
 russian_far_east_short_desc: "§LTaklukkan Timur Jauh Rusia untuk Jepang!§!"
 siberia_beckons: "Siberia Memanggil"
 siberia_beckons_desc: "Kita harus terus maju dan melanjutkan kemajuan kita ke Siberia. Dorong Rusia ke barat sampai mereka tidak lagi mengancam wilayah kita di Asia. Hutan belantara Siberia akan menjadi penyangga kerajaan kita, dan sumber daya alam yang belum dimanfaatkan di kawasan ini pasti akan bermanfaat bagi generasi Jepang di masa depan."
 siberia_beckons_short_desc: "§LBergerak maju dan rebut Siberia atas nama Kaisar.§!"
 conquest_of_abyssinia: "Penaklukan Abisinia"
 conquest_of_abyssinia_desc: "Kenangan menyakitkan dari Perang Italia-Abyssinian Pertama dan kekalahan di Adwa sudah berlalu sekarang. Kami berkomitmen untuk penaklukan penuh Kekaisaran Ethiopia dan integrasinya ke Afrika Timur Italia. Dorong maju menuju kemenangan!"
 conquest_of_abyssinia_short_desc: "§LMelakukan invasi ke Etiopia.§!"
 conquest_of_albania: "Penaklukan Albania"
 conquest_of_albania_desc: "Pasukan Italia secara memalukan terpaksa mundur dari wilayah Albania yang mereka duduki pada tahun 1920, namun sekarang adalah waktu yang tepat bagi kami untuk kembali. Aneksasi Albania akan memberi kita kendali penuh atas pintu masuk ke Laut Adriatik, dan wilayah tersebut dapat berfungsi sebagai pijakan untuk kampanye di masa depan di Balkan."
 conquest_of_albania_short_desc: "§LAmankan Laut Adriatik dengan merebut Albania.§!"
 strengthen_vallo_alpino: "Perkuat Vallo Alpino"
 strengthen_vallo_alpino_desc: "Ancaman bisa datang dari segala arah di sepanjang perbatasan utara kita. Orang Prancis, Austria dan teman-teman Jerman mereka, bahkan orang Swiss yang pengecut bisa menyerang kapan saja! Pekerjaan pembangunan garis benteng telah dimulai, namun kemajuannya lambat. Selesaikan Tembok Alpine agar invasi ke Italia Utara di masa depan menjadi mahal!"
 strengthen_vallo_alpino_short_desc: "§LAmankan perbatasan utara Italia dengan meningkatkan benteng.§!"
 industrialize_southern_italy: "Industrialisasi Italia Selatan"
 industrialize_southern_italy_desc: "Italia Utara selalu menjadi jantung industri negara kita, sedangkan Italia selatan tetap miskin dan terbelakang. Kita harus mengambil langkah-langkah untuk menutup perpecahan ekonomi ini dengan membangun lebih banyak industri di negara bagian selatan kita."
 industrialize_southern_italy_short_desc: "§LMasyarakat miskin di bagian selatan negara kita harus terindustrialisasi.§!"
 regia_marina: "Regia Marina"
 regia_marina_desc: "Nasib Italia terkait langsung dengan Mediterania, sesuatu yang dipahami dengan baik oleh orang Romawi kuno. Jelas bahwa Regia Marina akan memainkan peran penting dalam konflik di masa depan melawan Inggris atau Perancis. Kita harus memperluas galangan kapal untuk meningkatkan produksi kapal."
 regia_marina_short_desc: "§LMembangun lebih banyak galangan kapal untuk meningkatkan produksi angkatan laut.§!"
 condemn_japan: "Mengutuk Jepang"
 condemn_japan_desc: "Perang agresi Jepang terhadap Tiongkok adalah sebuah kebiadaban terhadap kesopanan dan kebebasan, serta membahayakan nyawa, hak, dan kepentingan ekonomi Amerika di Tiongkok! Jepang harus menghentikan serangannya atau menghadapi dampaknya."
 condemn_japan_short_desc: "§LMengutuk perang agresi Jepang terhadap Tiongkok.§!"
 embargo_japan: "Embargo Jepang"
 embargo_japan_desc: "Serangan Jepang terhadap Tiongkok terus berlanjut meskipun kami sudah memperingatkannya. Saatnya telah tiba untuk mengembargo semua perdagangan dengan Jepang."
 embargo_japan_short_desc: "§LEmbargo semua perdagangan dengan Jepang sebagai pembalasan atas serangan mereka terhadap Tiongkok.§!"
 threaten_japan: "Tunjukkan bendera di Pasifik"
 threaten_japan_desc: "Untuk memastikan bahwa Jepang mengetahui bahwa kami serius, maka sangat penting untuk mempertahankan armada listrik di Pearl Harbor."
 threaten_japan_short_desc: "§LMempertahankan armada listrik di Pearl Harbor.§!"
 build_infrastructure: "Membangun Infrastruktur"
 build_infrastructure_desc: "Membangun infrastruktur tidak hanya akan mempermudah perjalanan ke seluruh negeri, namun yang lebih penting lagi adalah akan menciptakan lapangan kerja dan membantu kita keluar dari resesi saat ini."
 build_infrastructure_short_desc: "§LMemperluas infrastruktur di negara kita.§!"
 build_factories: "Membangun pabrik"
 build_factories_desc: "Membangun pabrik baru menciptakan lapangan kerja selama dan setelah proses konstruksi, sebuah langkah penting dalam meningkatkan perekonomian."
 build_factories_short_desc: "§LMembangun pabrik sipil baru untuk meningkatkan perekonomian.§!"
 anglo_egypt_treaty: "Perjanjian Inggris-Mesir"
 anglo_egypt_treaty_desc: "Meskipun secara nominal merdeka, Mesir telah berada di bawah perlindungan kami sejak tahun 1882. Raja Farouk ingin meresmikan hubungan kami melalui perjanjian sehubungan dengan operasi militer Italia di Abyssinia. Mesir akan bergabung dengan kami sebagai sekutu, sementara kami tetap memegang kendali atas Terusan Suez dan berjanji membantu pertahanan mereka jika terjadi perang."
 anglo_egypt_treaty_short_desc: "§LResmikan kemerdekaan Mesir sambil mempertahankan mereka sebagai sekutu.§!"
 shadow_scheme: "Skema Bayangan"
 shadow_scheme_desc: "Kementerian Udara telah mengembangkan rencana untuk pembentukan 'pabrik bayangan' - pabrik sipil yang akan dipersiapkan dan diperluas sehingga mereka dapat lebih mudah beralih ke produksi militer jika terjadi perang."
 shadow_scheme_short_desc: "§LMempersiapkan dan memperluas pabrik sipil untuk kemungkinan perang.§!"
 chain_home: "Jaringan Radar Rumah Rantai"
 chain_home_desc: "Munculnya peperangan udara telah menjadikan Inggris rentan - kita tidak bisa lagi bergantung hanya pada armada besar untuk menjaga keamanan kita. Rencana telah disusun untuk jaringan stasiun radar di sepanjang pantai kami dengan nama sandi 'Chain Home'. Pembangunannya akan sangat membantu kita dalam pertahanan wilayah udara kita."
 chain_home_short_desc: "§LBangun jaringan stasiun radar di sepanjang pantai Inggris.§!"
 gibraltar_east: "Gibraltar di Timur"
 gibraltar_east_desc: "Upaya untuk mengubah Singapura menjadi pangkalan angkatan laut utama telah berlangsung sejak akhir Perang Besar. Pelabuhan ini berfungsi sebagai benteng bagi Angkatan Laut Kerajaan Inggris, yang memungkinkan kami memproyeksikan pengaruh kami di seluruh Asia. Selesaikan pekerjaan yang telah dimulai dan tingkatkan pertahanan Singapura."
 gibraltar_east_short_desc: "§LMeningkatkan pertahanan angkatan laut Singapura.§!"
 home_guard: "Penjaga Rumah"
 home_guard_desc: "Prancis telah kalah, dan kini Inggris sendiri menghadapi ancaman invasi. Sebuah saran telah diajukan untuk membentuk organisasi pertahanan baru yang terdiri dari sukarelawan lokal. Banyak veteran perang sebelumnya yang terlalu tua untuk melakukan dinas militer reguler, namun dengan cara ini mereka masih dapat berkontribusi pada pertahanan kita."
 home_guard_short_desc: "§LMembentuk organisasi pertahanan sukarelawan lokal.§!"
 operation_laudabiliter: "Operasi Laudabiliter"
 operation_laudabiliter_desc: "Kemerdekaan Irlandia merupakan noda bagi kehormatan Inggris. Demi kebaikan mereka sendiri, Irlandia harus diperintah oleh tangan tegas dari London. Perencanaan sedang dilakukan untuk invasi yang akan membawa domba-domba liar ini kembali ke kandangnya."
 operation_laudabiliter_short_desc: "Menyerang Irlandia dan merebutnya kembali untuk Inggris."
 expand_the_luftwaffe: "Perluas Luftwaffe"
 expand_the_luftwaffe_desc: "Perjanjian Versailles tidak mengizinkan Jerman untuk mempertahankan angkatan udara, jadi kita harus membangun Luftwaffe dari awal dalam waktu singkat. Kami telah mencapai kemajuan yang signifikan, namun masih banyak yang harus dilakukan. Lanjutkan perluasan Luftwaffe dan ubah menjadi angkatan udara terbaik di dunia."
 expand_the_luftwaffe_short_desc: "§LMeningkatkan ukuran Luftwaffe untuk mempersiapkan perang yang akan datang.§!"
 panzerwaffe: "Buat Panzerwaffe"
 panzerwaffe_desc: "Teori-teori baru kita tentang peperangan bergerak memerlukan penciptaan kekuatan tank yang mampu memberikan serangan yang kuat. Kita harus semakin meningkatkan ukuran Panzerwaffe kita sebagai persiapan menghadapi perang yang akan datang."
 panzerwaffe_short_desc: "§LMembentuk kekuatan lapis baja dengan meningkatkan divisi panzer baru untuk Heer.§!"
 reichsautobahn: "Selesaikan Reichsautobahn"
 reichsautobahn_desc: "Sejak dimulainya pada tahun 1933, proyek autobahn telah sukses besar. Upaya konstruksi telah mengurangi pengangguran, dan jalan lebar menjadi monumen pemulihan ekonomi Jerman. Namun, masih banyak pekerjaan yang harus dilakukan."
 reichsautobahn_short_desc: "§LMenyelesaikan pembangunan autobahn dengan meningkatkan infrastruktur di negara-negara bagian utama.§!"
 fortify_the_westwall: "Perkuat Tembok Barat"
 fortify_the_westwall_desc: "Westwall membentang sejajar dengan Jalur Maginot kebanggaan Prancis, menempati area yang hampir sama dengan Jalur Siegfried di Weltkrieg sebelumnya. Memperkuat pertahanannya akan memungkinkan kita mempertahankan perbatasan dengan lebih sedikit orang, sehingga membebaskan perpecahan untuk berpartisipasi dalam potensi kampanye di wilayah timur."
 fortify_the_westwall_short_desc: "§LTingkatkan pertahanan Westwall dengan membangun benteng baru.§!"
 operation_weserubung: "Operasi Weserübung"
 operation_weserubung_desc: "Besi Skandinavia sangat penting bagi industri perang Jerman, dan pasokan kita harus dijaga. Kami akan mencegah pendudukan Sekutu di Norwegia dengan melancarkan invasi kami sendiri. Sebagai langkah mewujudkan tujuan tersebut, Denmark juga harus ditinggali. Hal ini akan memberikan keuntungan tambahan karena menutup Laut Baltik dari musuh-musuh kita."
 operation_weserubung_short_desc: "§LMenyerang Denmark dan Norwegia untuk mengamankan perdagangan besi Skandinavia.§!"
 operation_tannenbaum: "Operasi Tannenbaum"
 operation_tannenbaum_desc: "Swiss adalah sebuah jerawat di muka Eropa, dan Swiss sendiri mewakili kelompok masyarakat Jerman yang bandel. Mereka harus diintegrasikan ke dalam Jerman Raya dengan cara apa pun. Serang benteng gunung mereka dan akhiri lelucon bangsa ini."
 operation_tannenbaum_short_desc: "§LMenyerang Swiss dan menggabungkannya ke dalam Reich Jerman.§!"
 operation_felix: "Operasi Felix"
 operation_felix_desc: "Operasi Sekutu di Mediterania harus dibatasi dengan menutup Selat Gibraltar, namun Spanyol tidak dapat diandalkan untuk mendukung tujuan kami. Kita harus memaksakan masalah ini dengan melancarkan invasi besar-besaran ke seluruh Pyrenees. Spanyol dan Portugal perlu diduduki untuk menjaga sisi barat daya Jerman."
 operation_felix_short_desc: "§LMenyerang semenanjung Iberia dan merebut Gibraltar.§!"
 operation_ikarus: "Operasi Ikarus"
 operation_ikarus_desc: "Untuk mendukung operasi Kriegsmarine di Atlantik Utara, OKW telah memberi lampu hijau untuk melakukan invasi ke Islandia. Penguasaan atas pulau ini akan memperluas jangkauan operasional kami lebih jauh ke barat, dan akan sangat membantu upaya kami dalam menyukseskan Pertempuran Atlantik."
 operation_ikarus_short_desc: "§LMenyerang Islandia sebagai langkah menuju kemenangan Pertempuran Atlantik.§!"
 operation_herkules: "Operasi Herkules"
 operation_herkules_desc: "Pangkalan Inggris di Malta sudah terlalu lama menjadi duri bagi kita. Hal ini terus mengganggu operasi di Afrika Utara, dan selama pulau tersebut berada di bawah kendali Sekutu, Mediterania Tengah akan tetap diperebutkan. Kita harus memastikan penangkapannya."
 operation_herkules_short_desc: "§LTangkap Malta dan tolak penggunaannya sebagai basis Inggris.§!"
 fall_grun: "Musim Gugur Grün"
 fall_grun_desc: "Lewati pertahanan utama Inggris dengan mendirikan pangkalan di Irlandia. Ketika pulau ini berada di bawah kendali kita, Inggris akan berada dalam posisi yang jauh lebih terisolasi. Dari pangkalan baru ini angkatan udara dan angkatan laut kita dapat menghajar Inggris yang keras kepala agar tunduk!"
 fall_grun_short_desc: "§LMelakukan invasi ke Irlandia untuk mengisolasi Inggris dan mengamankan pangkalan angkatan laut baru.§!"
 operation_seelowe: "Operasi Seelowe"
 operation_seelowe_desc: "Kemenangan kita di Barat hanya dapat dipastikan dengan pendudukan penuh atas Inggris Raya. Kita harus melakukan operasi pendaratan melintasi Selat dan membangun tempat berpijak di tanah Inggris. Ujung tombak kami kemudian dapat menyebar ke pedesaan dan terus maju hingga seluruh Inggris telah diduduki. Kerajaan mereka kemudian akan runtuh seperti rumah kartu. Benar!"
 operation_seelowe_short_desc: "§LMeluncurkan invasi amfibi besar-besaran ke Inggris dan merebut London.§!"
 operation_barbarossa: "Operasi Barbarossa"
 operation_barbarossa_desc: "Kita akan memulai kampanye militer terbesar dalam sejarah - invasi ke Uni Soviet! Jika Napoleon gagal, kita akan berhasil. Maju melintasi perbatasan, lingkari dan hancurkan konsentrasi pasukan Soviet dan terus maju ke arah timur. Operasi ini akan dianggap berhasil jika kita merebut Moskow dan berhasil membangun garis depan di sepanjang poros Arkhangelsk - Astrakhan. Panggil nach Osten!"
 operation_barbarossa_short_desc: "§LMenyerang Uni Soviet dan mencapai jalur Arkhangelsk - Astrakhan.§!"
 operation_gertrude: "Operasi Gertrude"
 operation_gertrude_desc: "Pendudukan Turki akan memudahkan kita memindahkan kekuatan dari Eropa ke Timur Tengah, dan memberi kita kendali penuh atas satu-satunya pintu masuk ke Laut Hitam. Dalam keadaan apa pun Turki tidak boleh bersekutu dengan Sekutu!"
 operation_gertrude_short_desc: "§LAmankan pintu masuk ke Laut Hitam dengan melancarkan invasi ke Turki.§!"
 operation_mungo: "Operasi Mungo"
 operation_mungo_desc: "Mengikuti jejak Alexander Agung, pasukan kita telah mencapai Lembah Indus. Kita sekarang berada dalam posisi untuk merampok permata Inggris di kerajaan mereka. Mulailah invasi besar-besaran ke India!"
 operation_mungo_short_desc: "§LMemulai invasi ke India Britania dan menaklukkannya demi Vaterland.§!"
 operation_knickerbocker: "Operasi Knickerbocker"
 operation_knickerbocker_desc: "Kita harus membawa perang melintasi Atlantik. Sebelum kita dapat melancarkan invasi ke Pantai Timur Amerika, kita harus mengamankan pangkalan-pangkalan di mana kita dapat mengerahkan pasukan kita. Kriegsmarine telah menyiapkan rencana invasi ke Newfoundland dan Bermuda. Salah satu dari pulau-pulau ini akan sesuai dengan tujuan kita."
 operation_knickerbocker_short_desc: "§LPangkalan aman di Atlantik sebagai persiapan invasi Amerika.§!"
 operation_buffel: "Operasi Buffel"
 operation_buffel_desc: "Untuk mengamankan kepemimpinan Jerman dalam tatanan dunia baru yang kita ciptakan, invasi besar-besaran ke benua Amerika harus dilakukan. Sasaran politik dan industri penting di sepanjang pantai timur laut Amerika harus segera diduduki, termasuk Gedung Putih di Washington."
 operation_buffel_short_desc: "§LMenyerang Amerika Utara dan menduduki sasaran penting di Pantai Timur AS.§!"
 deutsches_afrikakorps: "Jerman Afrikakorps"
 deutsches_afrikakorps_desc: "Kita harus membantu Italia dalam perjuangan mereka melawan Inggris di Afrika Utara. Pindahkan pasukan ekspedisi ke Libya dan dukung perjalanan Italia menuju Mesir!"
 deutsches_afrikakorps_short_desc: "§LMendukung operasi Italia di Afrika Utara dengan mendaratkan pasukan di Libya.§!"
 fall_weiss: "Jatuh Weiss"
 fall_weiss_desc: "Invasi ke Polandia harus dimulai. Tujuan strategis yang penting termasuk Warsawa, Krakow dan Lwow. Kita juga harus membangun koridor darat untuk pasukan kita di Prusia Timur secepat mungkin. Sementara itu, perbatasan kita dengan Perancis harus dipertahankan dengan segala cara. Jangan biarkan Moselland atau Württemberg jatuh ke tangan Prancis!"
 fall_weiss_short_desc: "§LMenyerang Polandia sambil menguasai Westwall melawan Prancis.§!"
 fall_gelb: "Jatuh Gelb"
 fall_gelb_desc: "Garis Maginot akan membuat serangan langsung terhadap Prancis dari seberang perbatasan kita menjadi sangat merugikan. Meminjam Rencana Schlieffen, OKH telah bersiap untuk melakukan invasi melalui Negara-Negara Rendah. Jika memungkinkan, isolasi dan hancurkan pasukan Sekutu yang menyeberang ke Belgia dengan membuat perpecahan antara mereka dan wilayah Prancis lainnya."
 fall_gelb_short_desc: "§LMenghindari Garis Maginot dengan menyerang dan menduduki Negara-Negara Rendah.§!"
 fall_rot: "Busuk Musim Gugur"
