 NAVAL_MISSION_ACTIVATE: "Aktifkan"
 NAVAL_MISSION_NAME_NONE: "Menunggu Perintah"
 NAVAL_MISSION_NAME_PATROL: "Patroli"
 NAVAL_MISSION_NAME_PATROL_DESC: "Perintahkan satuan tugas untuk berpatroli di area operasi armada.\n\nSebuah satuan tugas hanya dapat berpatroli di satu wilayah pada satu waktu.\nSatuan tugas akan mencoba menemukan armada musuh di wilayah aktifnya. Radar dan Keunggulan Udara akan membantunya menemukan musuh lebih cepat.\n\nPerhatikan bahwa musuh dapat melihat dan menyerang Anda sebelum Anda melihat mereka."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY: "Cari dan Hancurkan"
 NAVAL_MISSION_NAME_STRIKE_FORCE: "Gugus Tempur Penyerang"
 NAVAL_MISSION_NAME_STRIKE_FORCE_DESC: "Perintahkan satuan tugas untuk menunggu di pangkalan laut terdekat sampai satuan tugas musuh terlihat.\nSetelah musuh terlihat oleh salah satu satuan tugas patroli Anda, gugus tempur penyerang Anda akan bergerak mencegatnya.\n\nSaat tidak aktif menghadapi musuh, misi ini mengonsumsi $PERCENT|%0G$ bahan bakar."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY_DESC: "Perintahkan satuan tugas untuk secara aktif mencari dan melawan armada musuh di wilayah yang dipilih."
 NAVAL_MISSION_NAME_CONVOY_RAIDING: "Penyerbuan Konvoi"
 NAVAL_MISSION_NAME_CONVOY_RAIDING_DESC: "Perintahkan satuan tugas untuk menyerbu konvoi musuh di wilayah yang dipilih."
 NAVAL_MISSION_NAME_CONVOY_ESCORT: "Pengawalan Konvoi"
 NAVAL_MISSION_NAME_CONVOY_ESCORT_DESC: "Perintahkan satuan tugas untuk mengawal konvoi di wilayah yang dipilih dan melindunginya dari serbuan musuh."
 NAVAL_MISSION_NAME_INVASION: "Transportasi/Invasi"
 NAVAL_MISSION_NAME_INVASION_DESC: "Perintahkan satuan tugas untuk secara aktif mendukung pengangkutan pasukan dan invasi dalam §YPerintah Invasi§! yang dipilih.\n§GKlik§! untuk mengaktifkan misi ini, lalu §GKlik§! pada panah invasi jika Anda telah menggambarnya."
 NAVAL_MISSION_NAME_MINES_PLANTING: "Penebaran Ranjau"
 NAVAL_MISSION_NAME_MINES_PLANTING_DESC: "Perintahkan satuan tugas untuk menebar ranjau laut di wilayah yang dipilih. Potensi penalti tertinggi bagi musuh Anda adalah:\n"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT: "£mapicon_unit_invalid_orders£ Kemampuan Bombardir Pantai rendah"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC: "Satuan tugas tidak akan mampu secara efisien membantu divisi di garis pantai dalam pertempuran karena kemampuan Bombardir Pantainya yang rendah. Pertimbangkan untuk menambahkan kapal dengan §YSerangan Meriam Berat§! ke satuan tugas."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES: "£mapicon_unit_invalid_orders£ Jumlah §YBom Laut§! rendah"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES_DESC: "Satuan tugas kemungkinan kecil dapat merusak kapal selam. Pertimbangkan untuk menambahkan kapal dengan lebih banyak §HBom Laut§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION: "£mapicon_unit_invalid_orders£ Deteksi Bawah Air Rendah"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION_DESC: "Satuan tugas kemungkinan kecil dapat mendeteksi kapal selam selama pertempuran. Pertimbangkan untuk menambahkan lebih banyak kapal dengan §YSonar§!, §YRadar§!, atau §YKetapel Pesawat§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION: "£mapicon_unit_invalid_orders£ Deteksi Permukaan Rendah"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION_DESC: "Satuan tugas akan lambat dalam mendeteksi musuh potensial. Pertimbangkan untuk menambahkan lebih banyak kapal dengan §YRadar§! dan §YKetapel Pesawat§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED: "£mapicon_unit_invalid_orders£ Kecepatan Maks Rendah"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED_DESC: "Kecepatan rata-rata satuan tugas terlalu rendah dan akan menghambat kemampuan pencariannya. Pertimbangkan untuk mengeluarkan kapal lambat atau menambahkan yang lebih cepat."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY: "£mapicon_unit_invalid_orders£ Visibilitas Permukaan Tinggi"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC: "Satuan tugas terlalu terlihat dan dapat dengan mudah dilihat dan/atau dihindari oleh musuh. Pertimbangkan menggunakan kapal yang lebih kecil atau berlapis baja lebih tipis dengan Visibilitas Permukaan yang lebih rendah."
 NAVAL_MISSION_SET_REASON_FOR_PLANTING_NO_SHIPS: "Penebaran ranjau §Rtidak memungkinkan§!, karena tidak ada kapal di armada Anda yang memiliki kemampuan untuk melakukannya!"
 NAVAL_MISSION_SET_REASON_FOR_SWEEPING_NO_SHIPS: "Pembersihan ranjau §Rtidak memungkinkan§!, karena tidak ada kapal di armada Anda yang memiliki kemampuan untuk melakukannya!"
 NAVAL_MISSION_SET_REASON_FOR_NO_WAR: "Anda harus sedang §Rberperang§! untuk mengaktifkan misi ini."
 NAVAL_MISSION_NAME_MINES_SWEEPING: "Pembersihan Ranjau"
 NAVAL_MISSION_NAME_MINES_SWEEPING_DESC: "Perintahkan satuan tugas untuk mencari dan menetralisasi ranjau laut di wilayah yang dipilih. Potensi penalti tertinggi yang dapat Anda alami dari ranjau musuh adalah:\n"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT: "Dukungan Invasi Laut"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT_DESC: "Perintahkan kapal untuk mengawal invasi laut dan mendukung mereka dengan bombardir pantai."
 NAVAL_MISSION_NAME_TRAINING: "Latihan Angkatan Laut"
 NAVAL_MISSION_NAME_TRAINING_DESC: "Perintahkan satuan tugas untuk melakukan latihan di wilayah yang bersebelahan dengan pangkalan laut terdekat.\nIni memiliki peluang untuk merusak kapal dari waktu ke waktu.\nAwak tidak akan mendapatkan pengalaman setelah mereka mencapai tingkat Reguler.\nAnda akan mendapatkan §YPengalaman Angkatan Laut§! saat berlatih.\n§YKebanggaan Armada§! lebih kecil kemungkinannya mengalami kecelakaan.\n\nTahan §HShift§! dan klik untuk mengaktifkan §HLatihan Angkatan Laut§! hingga semua kapal terlatih sepenuhnya."
 NAVAL_BTN_REMOVE_REGIONS: "§HHapus Wilayah§!\n§GKlik§! tombol ini, lalu klik pada wilayah yang ingin Anda hapus untuk armada yang dipilih saat ini.\n§GKlik kanan§! tombol ini untuk §Rmenghapus semua wilayah§! bagi armada yang dipilih saat ini."
 NAVAL_BTN_REMOVE_REGIONS_NO_REGIONS: "§RTidak ada wilayah untuk dihapus.§!"
