 UNITS_VIEW_BTN_RESHAPE: "§HMode Sunting§!\nTekan tombol ini untuk mengalihkan mode, atau tahan §GALT§!\n§GKlik kanan§! pada pin ujung rencana pertempuran untuk menyuntingnya.\n§GKlik dan tahan tombol mouse§! pada Panah Kemajuan untuk mengubah bentuknya atau menghubungkannya dengan perintah lain.\n§GKlik kanan dan tahan tombol mouse§! pada salah satu perintah yang berkedip untuk mulai menggambar Panah Kemajuan baru."
 UNITS_VIEW_BTN_DRAW_OFFENCE: "§HGaris Serangan§!\n§GKlik kanan dan tahan tombol mouse§! di peta untuk menggambar §YGaris Serangan§!.\nGaris hanya dapat digambar di wilayah tempat Anda menetapkan §HGaris Depan§! atau §HInvasi Laut§!.\n\nDivisi yang ditugaskan ke rencana dengan Garis Serangan akan mencoba merebut wilayah untuk memindahkan garis depan mereka ke sana.\n\n§GTahan tombol mouse§! dan §Glepaskan§! pada tombol perilaku eksekusi untuk mengubah jenis eksekusi rencana"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§HGaris Depan§!\n- §GKlik§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan yang ditugaskan di sepanjang seluruh perbatasan.\n- §GKlik kanan dan seret mouse§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan dalam interval yang lebih pendek.\n- §GKlik kanan dan seret mouse§! pada ujung garis depan yang ada untuk menyuntingnya.\n\nGaris depan adalah titik awal serangan ke wilayah musuh menuju Garis Serangan, tetapi juga memungkinkan Anda memposisikan Divisi dengan cepat di sepanjang perbatasan luar negeri."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§HGaris Depan§!\n- §GKlik§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan yang ditugaskan di sepanjang seluruh perbatasan.\n- §GShift + Klik§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan yang ditugaskan tanpa garis depan sub-angkatan darat di sepanjang seluruh perbatasan.\n- §GKlik kanan dan seret mouse§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan dalam interval yang lebih pendek.\n- §GShift + Klik kanan dan seret mouse§! pada salah satu perbatasan melawan negara lain untuk menetapkan garis depan tanpa garis depan sub-angkatan darat dalam interval yang lebih pendek.\n- §GKlik kanan dan seret mouse§! pada ujung garis depan yang ada untuk menyuntingnya.\n\nGaris depan adalah titik awal serangan ke wilayah musuh menuju Garis Serangan, tetapi juga memungkinkan Anda memposisikan Divisi dengan cepat di sepanjang perbatasan luar negeri."
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§HGaris Pertahanan Cadangan§!\n- §GKlik kanan dan seret mouse§! di wilayah kawan untuk menggambar perintah pertahanan §YSekali pakai§!.\n\nGaris pertahanan cadangan berguna untuk memposisikan Divisi untuk bertahan, misalnya di belakang sungai, atau di tempat lain di wilayah kawan."
 UNITS_VIEW_BTN_AREA_DEFENSE: "§HPertahanan Wilayah§!\n- §GKlik§! pada negara bagian untuk menambah/menghapusnya dari perintah angkatan darat.\nAngkatan Darat dengan perintah ini tidak dapat memiliki jenis perintah lain pada saat yang sama.\n\nDivisi yang ditugaskan ke Angkatan Darat dengan perintah ini akan menyebar ke area yang ditentukan untuk menjaga kota-kota penting, pelabuhan, atau objek lain serta menangani keberadaan musuh skala kecil."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV: "§HPerintah Invasi Laut§!\nLangkah 1) §GKlik§! pada salah satu provinsi yang disorot untuk menetapkan sumber invasi.\nLangkah 2) §GKlik kanan§! pada provinsi pesisir yang diinginkan untuk diinvasi.\nSetelah rencana diaktifkan, invasi akan mulai bersiap dan mencadangkan konvoi dari stok negara Anda."
 UNITS_VIEW_BTN_DRAW_PARADROP: "§HPerintah Terjun Payung§!\nLangkah 1) §GKlik§! pada pangkalan udara kita untuk menentukan titik lepas landas. Pangkalan udara harus memiliki pesawat angkut yang tersedia.\nLangkah 2) §GKlik kanan§! pada provinsi yang berada dalam jangkauan pesawat angkut lokal, untuk menentukan lokasi pendaratan.\n§gIngat bahwa hanya unit dengan kemampuan terjun payung yang akan diangkut.§!"
