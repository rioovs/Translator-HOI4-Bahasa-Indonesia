 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR: "§HPerintah Invasi Laut (Dengan dukungan Pelabuhan Terapung)§!\nLangkah 1) §GKlik§! pada salah satu provinsi yang disorot untuk menetapkan sumber invasi.\nLangkah 2) §GKlik kanan§! pada provinsi pesisir yang diinginkan untuk diinvasi.\nSetelah rencana diaktifkan, invasi akan mulai bersiap dan mencadangkan Konvoi serta Pelabuhan Terapung dari Cadangan Anda."
