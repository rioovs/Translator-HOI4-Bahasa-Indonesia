 SUPPLY_FLOW_SHOW_RANGE: "§HPusat Pasokan§! mendistribusikan pasokan ke provinsi-provinsi terdekat. Jangkauan dan efisiensinya bergantung pada cuaca, kondisi tanah, infrastruktur, tingkat rel kereta api, dan motorisasi.\n\nUntuk meningkatkan jangkauan dan pasokan yang disediakan oleh §HPusat Pasokan§!, pertimbangkan untuk menggunakan perintah §HTingkatkan Kereta Api§!, mengubah §HTingkat Motorisasi§!, atau meningkatkan §HTingkat Infrastruktur§!.\n\nTahan §GShift§! untuk menampilkan jangkauan.\n§GShift-klik§! untuk beralih motorisasi.\n§GCtrl-klik§! untuk beralih pasokan sekutu."
 SUPPLY_FLOW_DELAYED_DESC: "§HSisa Pasokan§! menunjukkan berapa banyak pasokan yang disediakan untuk provinsi ini, dan terdiri dari pasokan negara bagian dan pusat dalam jangkauan. Jangkauan pusat dipengaruhi oleh cuaca, kondisi tanah, infrastruktur, tingkat kereta api, dan motorisasi.\n\n§HDivisi§! akan mengonsumsi pasokan provinsi berdasarkan beban pasokan mereka. Jika §HPasokan Tersimpan§! mereka berada di atas rasio pasokan yang disediakan di lokasi mereka, mereka akan mengonsumsi dari penyimpanan internal mereka sampai pasokan tersimpan berada pada tingkat yang sama dengan pasokan lokal.\n\nTahan §GCtrl§! untuk menampilkan sumber aliran."
