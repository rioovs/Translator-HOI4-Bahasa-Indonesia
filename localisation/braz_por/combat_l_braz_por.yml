 combat_stat_depth_charges_info: "§HBom Laut (Depth Charges)§!\n\nBom laut digunakan untuk melawan kapal selam, yang tidak dapat diserang oleh jenis senjata lain.\n"
 combat_stat_light_guns_info: "§HMeriam Ringan§!\n\nMeriam Ringan lebih efektif melawan §YKapal Tabir§!. Meriam ringan armada Anda akan menargetkan musuh terdekat.\n"
 combat_stat_heavy_guns_info: "§HMeriam Berat§!\n\nMeriam Berat lebih efektif melawan §YKapal Utama§!. Senjata ini dapat menjangkau dua kelompok musuh terdekat dan akan memprioritaskan menembak target yang lebih besar.\n"
 combat_stat_anti_air: "§HAnti-Udara Armada§!\n\nAnti-Udara Armada dihitung menggunakan nilai Anti-Udara dari semua kapal di seluruh armada dan akan mengganggu pembom musuh yang menyerang armada serta mengurangi kerusakan yang dapat ditimbulkannya.\n"
 combat_stat_torpedoes_info: "§HTorpedo§!\n\nTorpedo mengabaikan baju besi dan jauh lebih efektif melawan §YKapal Utama§!. Jumlah torpedo yang diluncurkan melawan musuh bergantung pada §YEfisiensi Tabir§! mereka.\n"
 screening_efficiency_info: "§HEfisiensi Tabir§!\n\n§YEfisiensi Tabir§! yang tinggi melindungi §YKapal Utama§! Anda dari torpedo musuh. Kapal Induk Anda akan dilindungi oleh Kapal Utama maupun Kapal Tabir Anda. Kapal Utama hanya akan dilindungi oleh Kapal Tabir Anda.\n"
 POSITIONING_INFO: "§HPemosisian§! menggambarkan seberapa baik posisi armada Anda dibandingkan dengan musuh. Hal ini dipengaruhi oleh ukuran relatif armada, cuaca, dan keahlian pemimpin. Kapal yang bergabung dalam pertempuran setelah pertempuran dimulai akan menerima penalti sementara terhadap Pemosisian.\n\nJika Pemosisian berada di bawah 100%, armada akan menderita penalti.\n"
