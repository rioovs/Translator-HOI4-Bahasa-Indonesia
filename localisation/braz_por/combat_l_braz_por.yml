 SCREENING_TOOLTIP_LOW_INFO: "Celah dalam §YKelompok Tabir§! menyebabkan efisiensi tabir rendah, memungkinkan kapal selam musuh menargetkan garis tempur berikutnya."
 SCREENING_TOOLTIP_BONUSES: "Efisiensi tabir Anda akan memberikan bonus berikut kepada §YGaris Tempur§! Anda:\n"
