 SCREENING_TOOLTIP_NO_SCREENS: "Kurangnya §YKapal Tabir§! akan memungkinkan kapal selam musuh dan kapal ringan lainnya menargetkan kapal utama Anda dengan torpedo serta memberi penalti berat pada Pemosisian."
 SCREENING_BOX_TOOLTIP: "§YKelompok Tabir§! menampung semua kapal tabir - biasanya Penjelajah Ringan dan Perusak - yang bertugas menjauhkan kapal tabir musuh dari §YGaris Tempur§! utama. Perlindungan tabir yang tidak memadai akan memungkinkan kapal tabir musuh meluncurkan serangan torpedo ke garis tempur."
 CAPITAL_BOX_TOOLTIP: "§YGaris Tempur§! menyediakan daya tembak langsung utama armada, biasanya berupa Kapal Tempur dan Penjelajah Berat. Mereka juga akan mencegah kapal utama musuh menembaki §YKapal Induk§! kawan."
 CARRIER_BOX_TOOLTIP: "§YKelompok Kapal Induk§! menyediakan daya serang jarak jauh utama armada. Terlindungi dari musuh oleh §YKelompok Tabir§! dan §YGaris Tempur§!, kapal induk dapat melancarkan serangan terhadap musuh tanpa gangguan. Jika ada §YKonvoi§! dalam pertempuran, mereka juga akan muncul di area ini."
 SUBMARINE_BOX_TOOLTIP: "§YKawanan Serigala Kapal Selam (Wolfpack)§! akan berusaha menghabisi kapal-kapal yang melarikan diri dengan torpedonya sembari tetap tersembunyi. Kurangnya kapal anti-kapal selam khusus di pihak musuh akan memungkinkan kapal selam lolos tanpa terdeteksi."
