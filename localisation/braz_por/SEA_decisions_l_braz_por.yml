 JAP_increase_takahashi_korekiyo_security_decision: "Tingkatkan Keamanan Sekitar $JAP_takahashi_korekiyo$"
 JAP_increase_takahashi_korekiyo_security_decision_tt: "Keamanan di sekitar Takahashi Korekiyo akan ditingkatkan untuk melindunginya jika ada serangan oleh kelompok radikal tentara, namun sebagai hasilnya mereka mungkin akan memprioritaskan kembali daftar target mereka dan mengerahkan lebih banyak kekuatan untuk membunuh orang lain."
