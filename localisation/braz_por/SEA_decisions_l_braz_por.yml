 JAP_assault_tauran_decision: "Bersiaplah untuk Menyerang Posisi [MON.GetAdjective]"
 JAP_assault_tauran_decision_desc: "Karena provokasi baru-baru ini yang dilakukan oleh [MON.GetAdjective] dan pendudukan mereka atas desa Tauran di tepi danau Buir, kita harus mempersiapkan pasukan kita untuk mengusir mereka sebelum klaim mereka atas wilayah sah kita dapat dilegitimasi."
 JAP_tauran_border_incident_forgotten_1: "Pasukan Kehilangan Semangat"
 JAP_tauran_border_incident_forgotten_1_desc: "Jika kita ingin merebut kembali desa ini dari musuh, kita harus menyerang dengan cepat."
 JAP_tauran_border_conflict_warning_MON: "Provokasi Perbatasan di Perbatasan [MAN.GetAdjective]"
 JAP_tauran_border_conflict_warning_MON_desc: "Telah terjadi bentrokan antara kontingen tentara kita yang memasuki Tauran baru-baru ini dan tentara [MAN.GetAdjective] di perbatasan bersama kita di [761.GetName]. Sumber intelijen di [MAN.GetNameDef] melaporkan bahwa ini mungkin hanya langkah pertama dalam konfrontasi yang lebih besar. Kita harus segera memperkuat perbatasan dengan [MAN.GetNameDef]."
 JAP_border_conflict_escalation_warning_MON: "[JAP.GetAdjective] persiapan"
 JAP_border_conflict_escalation_warning_MON_desc: "Pengintaian udara telah mengkonfirmasi pergerakan besar pasukan di sisi [JAP.GetAdjective] perbatasan. Kami tidak tahu apakah atau kapan [JAP.GetAdjective] memutuskan untuk menyerang, namun kami harus siap."
 JAP_tauran_border_incident_forgotten: "Jendela Peluang"
 JAP_tauran_border_incident_forgotten_desc: "Jika kita ingin mengusir pasukan [MON.GetAdjective] keluar dari wilayah kita dan menjauh dari perbatasan mereka ke [761.GetName], kita harus menyerang dengan cepat."
 JAP_escalate_incident_to_border_conflict_MON: "Tingkatkan Insiden"
 JAP_escalate_incident_to_border_conflict_MON_desc: "Tampaknya [MON.GetAdjective] tidak mundur dari konflik. Pada titik ini, kita harus meningkatkan konfrontasi bersenjata atau mundur."
 JAP_tauran_border_conflict_time_until_cancelled: "Akhiri konflik"
 JAP_tauran_border_conflict_time_until_cancelled_desc: "Dengan kondisi saat ini, kita hanya dapat mempertahankan operasi tempur dalam jangka waktu lama sebelum kita perlu menghentikan pertempuran."
