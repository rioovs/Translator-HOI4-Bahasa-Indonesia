 JAP_kodoha_insurgency_decisions: "Jalan Kekaisaran"
 JAP_kodoha_insurgency_decisions_desc: "Faksi Kōdōha, sebuah faksi dalam Tentara Kekaisaran kita saat ini sedang bergerak melawan musuh-musuh mereka, sebagaimana dibuktikan dengan pembunuhan mereka terhadap perwira militer Tetsuzan Nagata pada bulan Agustus 1935. Jika mereka memutuskan untuk mengambil tindakan dalam skala yang lebih besar, itu tidak akan terjadi sampai persidangan perwira mereka Aizawa berakhir. Mungkin yang terbaik adalah meningkatkan keamanan di sekitar individu tertentu yang mereka anggap mengancam Kokutai, jiwa bangsa kita."
 JAP_aizawa_trial_ongoing: "Uji Coba Saburō Aizawa Sedang Berlangsung"
 JAP_aizawa_trial_ongoing_desc: "Letnan Kolonel Saburō Aizawa saat ini berada dalam tahanan rumah sementara persidangannya masih berlangsung atas pembunuhannya terhadap perwira militer Tetsuzan Nagata. Namun, dengan persidangan yang menjadi sensasi media dimana para hakim berkolusi dengan fraksinya dan mengubah persidangan menjadi kotak sabun dimana ideologi mereka dapat disiarkan, jelas bahwa ia tidak akan menerima hukuman yang nyata. Sebagai anggota inti Kōdōha, jika kelompok tersebut ingin mengambil tindakan, mereka tidak akan melakukannya sampai tahanan rumah Aizawa selesai."
 JAP_aizawas_trial_over_flag: "Sidang Saburō Aizawa telah selesai, dan §YInsiden 26 Februari§! telah berlangsung"
 JAP_takahashi_korekiyo_was_killed: "Takahashi Korekiyo dibunuh oleh pemberontak"
 JAP_jotaro_watanabe_was_killed: "Jōtarō Watanabe dibunuh oleh pemberontak"
