 JAP_organize_the_fifth_column_decision_desc: "Partisan setia yang beroperasi di belakang garis musuh dapat digunakan untuk mengganggu komunikasi musuh di [FROM.GetNameDef]. Serangan terhadap pos komando, pemotongan kabel telegraf, atau penggelinciran kereta api, membuat musuh kurang siap menahan serangan unit kita, dan meningkatkan peluang keberhasilan pembebasan Jepang."
