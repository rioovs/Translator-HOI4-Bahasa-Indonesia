 JAP_kwantung_army_decisions: "Tentara Kwantung"
 JAP_kwantung_army_decisions_desc: "Pasukan kami yang beroperasi di Manchuria dan Tiongkok, Kantō-gun, saat ini bertindak sangat mandiri dan dikenal karena mengambil tindakan tanpa persetujuan dari tingkat yang lebih tinggi. Awalnya dibentuk untuk bertugas sebagai pasukan keamanan di wilayah sewaan Kwantung, kini mereka telah jauh melebihi jumlah aslinya, dan mungkin akan menyeret kita ke dalam konflik skala besar jika kita tidak mengendalikan situasi dengan tegas."
 JAP_kwantung_army_impatience: "Tentara Kwantung Semakin Tidak Sabar"
 JAP_kwantung_army_impatience_desc: "Tentara Kwantung dengan cepat menjadi tidak sabar dengan status quo saat ini di Tiongkok, dan sepertinya akan terus memperluas wilayah kekuasaannya tanpa persetujuan pemerintah jika keadaan terus berlanjut seperti ini."
