 XIC_war_in_yanan: "Kampanye Pengepungan Keenam"
 XIC_war_in_yanan_desc: "Dengan dimulainya kembali perang di provinsi Shaanxi, hanya masalah waktu sampai pasukan Tentara Penindas Bandit menyerah dan melakukan desersi. Jika kita ingin menang, kita harus menyerang dengan cepat dan tegas."
 XIC_war_halting: "Serangan Kehabisan Tenaga"
 XIC_stalemate_tt: "Perang akan mengakibatkan jalan buntu dan pasukan akan kembali ke posisi semula, kecuali kita dapat mengalahkan [PRC.GetNameWithFlag] dalam waktu yang ditentukan."
 PRC_holding_out: "Bertahan"
 PRC_survival_tt: "Jika kami bertahan selama setengah tahun, perang akan terhenti dan posisi kami di Shaanxi akan tetap ada. Jika kita berhasil menangkap Yan'an pada saat serangan terhenti, kita akan mampu mempertahankannya."
 RNG_state_shintoism_decisions: "Negara Shinto"
 RNG_state_shintoism_decisions_desc: "Karena diimpor ke negara kita dari Jepang, masih ada kekhawatiran seputar agama Shinto, namun jika ada yang yakin, penduduk lokal pasti akan ikut mengantre. Dengan menggunakan metode yang telah dicoba dan diuji di Tanah Air Jepang, kita dapat menggunakan ini sebagai peluang untuk memperkuat pengaruh Kaisar terhadap rakyat kita dan pada gilirannya stabilitas internal kita."
