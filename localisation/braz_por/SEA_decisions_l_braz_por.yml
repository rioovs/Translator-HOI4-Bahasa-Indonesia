 CHI_war_in_liangguang_desc: "Dengan dimulainya perang di provinsi Liangguang, hanya masalah waktu saja sampai pasukan kita lelah berperang satu sama lain dan ingin memprioritaskan menghadapi ancaman [JAP.GetAdjective] bersama-sama. Jika kita ingin menang, kita harus menyerang dengan cepat dan tegas."
 CHI_war_in_south_halting: "Tumbuhnya oposisi terhadap perang"
 CHI_stalemate_tt: "Perang akan mengakibatkan jalan buntu dan pasukan akan kembali ke posisi semula"
 GDC_holding_out: "Bertahan"
 GDC_survival_tt: "Jika kami bertahan selama satu tahun, perang akan terhenti dan posisi kami di Liangguang akan tetap ada. Negara-negara Republik tetangga mana pun yang berada di bawah kendali kami akan tetap menjadi bagian dari Klik kami ketika kebuntuan terjadi"
