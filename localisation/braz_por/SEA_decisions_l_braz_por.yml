 JAP_state_shintoism_decisions_desc: "Shintoisme telah menjadi agama orang Jepang setidaknya sejak zaman Yayoi, yang seiring berjalannya waktu disinkronisasikan dengan Buddhisme Zen. Selama era Meiji, Kuil ini berada di bawah pengaruh pemerintah yang semakin besar, dan warga didorong untuk memuja kaisar sebagai kami. Oleh karena itu, kita sekarang dapat meningkatkan kontrol pemerintah atas ibadah tersebut, dan menyesuaikan keinginan masyarakat dengan keinginan kita sendiri."
