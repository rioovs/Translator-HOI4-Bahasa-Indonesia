l_braz_por:
 MINIMIZE_EVENT: "§GKlik§! untuk Meminimalkan. Peristiwa akan ditempatkan dalam Antrean Peristiwa di bawah §HPeristiwa dan Keputusan§!."
 germany.4.t: "Anschluss"
 germany.4.d: "Pemberontakan yang berulang kali terjadi di Austria dengan jelas menunjukkan bahwa rakyat di sana mendambakan persatuan dengan Reich kita. Kini saatnya untuk bertindak dan membiarkan kehendak rakyat terwujud secara nyata."
 germany.4.a: "Bagaimana bisa ada yang mengatakan Austria bukan bangsa Jerman?!"
 germany.5.t: "Pakta Anti-Komintern"
 germany.5.d: "Jerman mengusulkan agar kita menandatangani sebuah pakta untuk menanggapi tujuan Komintern dalam menyebarkan Komunisme ke seluruh dunia melalui subversi dan kekerasan. Dengan menandatangani pakta ini, kita sepakat untuk berbagi intelijen mengenai ancaman Komunis dan bertindak dalam kerja sama erat melawan ancaman ini."
 germany.5.a: "Bergabung"
 germany.5.b: "Tolak"
 germany.6.t: "Pakta Tripartit"
 germany.6.d: "Para penandatangan menganggap hal ini sebagai prasyarat bagi perdamaian abadi dimana semua negara di dunia diberikan tempat yang layak, telah memutuskan untuk berdiri dan bekerja sama satu sama lain dalam upaya mereka di Asia Timur Raya dan kawasan Eropa dimana tujuan utama mereka adalah membangun dan memelihara tatanan baru, yang diperhitungkan untuk memajukan kemakmuran dan kesejahteraan bersama masyarakat yang bersangkutan."
 germany.6.a: "Bergabung"
 germany.6.b: "Tolak"
 germany.11.t: "Pakta Molotov-Ribbentrop"
 germany.11.d: "Kementerian Luar Negeri Jerman telah mengusulkan pakta non-agresi antara kedua negara kita. Perjanjian ini akan sangat meningkatkan perdagangan timbal balik kita, dan protokol rahasia tambahan mengusulkan pembagian Eropa Timur ke dalam lingkup pengaruh Jerman dan Soviet.\n\nMeskipun kaum fasis di Berlin mungkin tidak dapat dipercaya, pakta ini akan memungkinkan kita untuk menghadapi Finlandia, Negara-negara Baltik, dan Rumania tanpa takut akan campur tangan pihak luar. Wilayah timur Polandia juga akan jatuh ke tangan kita jika Polandia runtuh."
 germany.11.a: "Tandatangani perjanjian."
 germany.11.a.tt: "§RSelama pakta berlaku, kebijakan perdagangan Ekonomi Tertutup tidak akan tersedia.§!\n"
 germany.11.b: "Tidak ada kompromi dengan kaum fasis!"
 germany.12.t: "Moskow Menandatangani Pakta"
 germany.12.d: "[SOV.GetNameDefCap] telah dengan bijak setuju untuk menandatangani pakta non-agresi kita. Ini berarti kita bebas bertindak tanpa risiko intervensi Soviet.\n\nSayangnya, beberapa sekutu kita kini mempertanyakan komitmen Jerman terhadap pemusnahan akhir komunisme. Ketika urusan dengan Polandia dan Prancis telah diselesaikan, kita mungkin perlu meninjau kembali perjanjian ini, tetapi itu adalah pembahasan untuk lain waktu..."
 germany.12.a: "Luar biasa."
 germany.13.t: "Moskow Menolak Pakta"
 germany.13.d: "[SOV.GetNameDefCap] telah menolak untuk menandatangani pakta non-agresi kita! Hal ini memperumit masalah, karena kita tidak dapat bertindak tegas terhadap Polandia atau Prancis tanpa risiko kaum Bolshevik ikut campur."
 germany.13.a: "Terkutuklah mereka!"
 germany.14.t: "Pembagian Polandia"
 germany.14.d: "Polandia adalah milik kita, tetapi bagian timurnya jatuh ke dalam lingkup pengaruh [SOU.GetAdjective] sesuai ketentuan Pakta Molotov-Ribbentrop. Haruskah kita menarik pasukan kita dan membiarkan bangsa [SOU.GetAdjective] menduduki wilayah ini? Kegagalan untuk melakukannya akan membatalkan perjanjian kita."
 germany.14.a: "Hormati perjanjian dengan Soviet."
 germany.14.b: "Pertahankan seluruh wilayah untuk kita sendiri!"
 germany.15.t: "Jerman Menghormati Pakta"
 germany.15.d: "Sesuai dengan Pakta Molotov-Ribbentrop, pasukan Jerman telah mengevakuasi Polandia timur dan pasukan kita sendiri telah bergerak maju untuk menduduki wilayah tersebut."
 germany.16.t: "[From.GetNonIdeologyName] Mengkhianati Pakta"
 germany.16.d: "[From.GetNonIdeologyName] telah menolak untuk membagi Polandia bersama kita, suatu pelanggaran terang-terangan terhadap Pakta Molotov-Ribbentrop! Pengkhianatan ini telah membuat perjanjian kita dengan mereka batal demi hukum!"
 germany.16.a: "Kami bodoh karena mempercayai kaum fasis!"
 germany.20.t: "Arbitrase Wina Kedua"
 germany.20.d: "Menyadari bahwa suatu tatanan baru telah ditegakkan di Eropa, kita telah diminta oleh Hongaria dan Rumania untuk menengahi sengketa wilayah antara kedua negara tersebut. Transilvania direbut dari Hongaria dan digabungkan ke dalam Rumania dalam salah satu dari banyak perubahan keliru yang dipaksakan terhadap dunia di Versailles. Haruskah Transilvania Utara dikembalikan ke bawah kendali Hongaria?"
 germany.20.a: "Sudetenland kembali ke tanah air!"
 germany.20.b: "Berikan Hongaria seluruh Transylvania."
 germany.20.c: "Transylvania akan tetap berada di Rumania."
 germany.21.t: "Rumania Menolak Putusan Kita"
 germany.21.d: "Rumania telah menolak untuk mematuhi keputusan yang kita capai dalam Arbitrase Wina Kedua! Delegasi mereka telah ditarik kembali ke Bukares, dan tidak ada wilayah yang diserahkan kepada Hongaria."
 germany.21.a: "Keinginan Jerman harus dipatuhi!"
 germany.22.t: "Memel - [FROM.GetNameDef] Tunduk"
 germany.22.d: "Pemerintah [FROM.GetAdjective] telah menyetujui tuntutan kita, dan Memel akan digabungkan kembali ke Prusia Timur. Satu lagi provinsi yang dicuri secara tidak sah telah dikembalikan ke pangkuan bangsa Jerman!"
 germany.22.a: "Luar biasa."
 germany.23.t: "Memel - [FROM.GetNameDef] Menolak Tuntutan"
 germany.23.d: "Pemerintah [FROM.GetAdjective] telah menolak tuntutan kita! Mereka bersembunyi di balik Konvensi Klaipeda, mengklaim bahwa Jerman tidak memiliki hak hukum atas wilayah Memel. Kita harus menjelaskan posisi kita kepada mereka melalui cara lain..."
 germany.23.a: "Orang-orang keras kepala yang bodoh."
 germany.24.t: "Misi Militer Jerman ke Tiongkok"
 germany.24.d: "Jerman menikmati hubungan baik dengan Tiongkok sejak akhir Perang Dunia sebelumnya, terlepas dari hilangnya wilayah milik kita di Tiongkok. Sebuah misi militer Jerman telah hadir di Tiongkok selama beberapa tahun, dan Alexander von Falkenhausen telah membuat kemajuan besar dalam mereformasi sebagian pasukan Kuomintang.\n\nHal ini tentu menjadi perhatian pihak Jepang, mengingat perang mereka saat ini melawan Tiongkok. Mereka menuntut penarikan segera seluruh dukungan Jerman untuk Tiongkok."
 germany.24.a: "Ingat von Falkenhausen."
 germany.24.b: "Tidak, penasihat kami akan tetap di sini."
 germany.24.c: "Tidak, penasihat kami akan tetap tinggal, seperti yang telah kami janjikan kepada Tiongkok."
 germany.25.t: "Penasihat Militer Ditarik"
 germany.25.d: "Memburuknya hubungan dengan Tiongkok membuat secara politik tidak mungkin untuk mempertahankan misi militer di negara mereka. Alexander von Falkenhausen dan penasihat kami lainnya telah dipanggil kembali."
 germany.25.a: "Kami akan mempekerjakannya."
 germany.26.t: "Tiongkok Menahan Penasihat Militer"
 germany.26.d: "Jerman dan Tiongkok sedang berperang, dan akibatnya Tiongkok menahan penasihat militer Jerman yang sedang mereformasi angkatan bersenjata mereka. Von Falkenhausen dan beberapa perwiranya berhasil lolos dari penangkapan, dan kini dalam perjalanan kembali ke Eropa."
 germany.26.a: "Orang baik!"
 germany.27.t: "Memperkuat Tembok Barat"
 germany.27.d: "Zeni angkatan darat telah menyelesaikan survei benteng pertahanan kita yang ada, dan mengidentifikasi lokasi-lokasi yang harus diperkuat. Perintah pembangunan yang diperlukan telah dikeluarkan."
 germany.27.a: "Ini akan lebih baik daripada Jalur Siegfried."
 germany.28.t: "Jerman Mendesak Terjadinya Anschluss"
 germany.28.d: "Kerusuhan sipil dan tindakan kekerasan pecah ketika para pengunjuk rasa menyuarakan keinginan mereka agar Austria bergabung dengan Jerman dalam persatuan masyarakat Jerman. Berlin berupaya keras mewujudkan Anschluss, yang akan membuat Austria dianeksasi ke dalam negara mereka."
 germany.28.a: "Perang tak terhindarkan!"
 germany.28.b: "Tidak, nasib Austria ada di tempat lain."
 germany.29.t: "Austria Menolak Anschluss!"
 germany.29.d: "Orang-orang bodoh di Wina telah menolak untuk menerima penggabungan kedua negara kita! Ini adalah pengabaian terang-terangan terhadap kehendak rakyat Austria, dan ini tidak dapat dibiarkan! Kita mungkin harus memaksakan Anschluss melalui kekuatan militer."
 germany.29.a: "Kita harus prepare for a military intervention."
 germany.40.t: "Konferensi Munich"
 germany.40.d: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, tempat tinggal sejumlah besar etnis Jerman, telah mencapai puncaknya. [GER.GetLeader] telah menempatkan pasukan di sepanjang perbatasan Cekoslowakia sebagai persiapan untuk menyerang. Pembicaraan sedang diadakan di Munich antara Inggris, Prancis, Italia, dan Jerman dengan harapan dapat merundingkan penyelesaian damai atas Krisis Sudeten. Bagaimana sikap Inggris nantinya?"
 germany.40.d_2: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, tempat tinggal sejumlah besar etnis Jerman, telah mencapai puncaknya. [GER.GetLeader] telah menempatkan pasukan di sepanjang perbatasan Cekoslowakia sebagai persiapan untuk menyerang. Karena kita telah membuktikan bahwa kita tidak akan menerima ekspansionisme Jerman, ini berarti kita kini memiliki sekutu lain dalam perang melawan Jerman."
 germany.40.d_3: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, tempat tinggal sejumlah besar etnis Jerman, telah mencapai puncaknya. [GER.GetLeader] telah menempatkan pasukan di sepanjang perbatasan Cekoslowakia sebagai persiapan untuk menyerang. Pembicaraan sedang berlangsung di Munich antara Belanda, Inggris, Prancis, Italia, dan Jerman dengan harapan merundingkan akhir yang damai bagi Krisis Sudeten. Bagaimana sikap Belanda nantinya?"
 germany.40.a: "Ceko sendirian."
 germany.40.b: "Cekoslowakia harus dipertahankan!"
 germany.41.d: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, tempat tinggal sejumlah besar etnis Jerman, telah mencapai puncaknya. [GER.GetLeader] telah menempatkan pasukan di sepanjang perbatasan Cekoslowakia sebagai persiapan untuk menyerang. Pembicaraan sedang berlangsung di Munich antara Inggris, Prancis, Italia, dan Jerman demi merundingkan penyelesaian damai Krisis Sudeten.\n\nInggris telah menegaskan bahwa mereka tidak berniat berperang demi 'pertikaian di negeri yang jauh.' Haruskah kita mengikuti langkah mereka, atau akankah kita menghormati kewajiban kita kepada Cekoslowakia dengan memberikan dukungan kepada mereka?"
 germany.41.a: "Biarkan Ceko menanggung nasibnya sendiri."
 germany.41.b: "Terkutuklah orang Inggris! Prancis mendukung teman-temannya!"
 germany.42.d: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, tempat tinggal sejumlah besar etnis Jerman, telah mencapai puncaknya. [GER.GetLeader] telah menempatkan pasukan di sepanjang perbatasan Cekoslowakia sebagai persiapan untuk menyerang. Pembicaraan sedang diadakan di Munich antara Inggris, Prancis, Italia, dan Jerman dengan harapan merundingkan penyelesaian damai Krisis Sudeten.\n\nInggris menolak untuk mundur, dan justru mengancam Jerman dengan perang jika mereka melanggar perbatasan Cekoslowakia. Perang mungkin akan segera pecah."
 germany.42.a: "Kita harus prepare!"
 germany.42.b: "Prancis harus menghindari hal ini."
 germany.43.t: "Prancis Keluar dari Sekutu"
 germany.43.d: "Bangsa Prancis yang keras kepala menolak untuk mengikuti langkah kita dalam Krisis Sudeten! Mereka tetap pada pendirian mendukung Cekoslowakia, dan karena kita tidak, mereka memutuskan untuk membatalkan persekutuan bersama kita. Bahkan saat ini, Prancis sedang bersiap untuk menghadapi perang yang tak terhindarkan dengan Jerman."
 germany.43.a: "Bodoh! [GER.GetLeader] harus ditenangkan!"
 germany.44.d: "Tuntutan Jerman atas wilayah kami di wilayah Sudetenland menjadi semakin bermusuhan, dan kini pasukan mereka berkumpul di sepanjang perbatasan kami! Sebuah konferensi diadakan di Munich di mana para pemimpin Eropa membahas masa depan Cekoslowakia, namun kami belum diundang.\n\nUntungnya, tampaknya Sekutu akan menepati janji dukungan mereka sebelumnya. Mereka mengancam [GER.GetLeader] dengan perang jika perbatasan kita dilanggar sedikit pun. Meskipun demikian, kita harus bersiap menghadapi serangan Jerman yang akan segera terjadi."
 germany.44.a: "Bagus! Biarkan mereka datang!"
 germany.45.d: "Tuntutan Jerman atas wilayah kami di wilayah Sudetenland menjadi semakin bermusuhan, dan kini pasukan mereka berkumpul di sepanjang perbatasan kami! Sebuah konferensi diadakan di Munich di mana para pemimpin Eropa membahas masa depan Cekoslowakia, namun kami belum diundang.\n\nPara pengecut Inggris menolak mendukung kedaulatan kami, namun setidaknya Prancis membela kami! Mereka telah meninggalkan aliansi mereka dengan Inggris dan membentuk aliansi baru dengan kami, berjanji untuk mendukung Cekoslowakia melawan agresi Jerman."
 germany.45.a: "Hidup Prancis! (Vive la France!)"
 germany.46.t: "Diktat Munich"
 germany.46.d: "Tuntutan Jerman atas wilayah kami di wilayah Sudetenland menjadi semakin bermusuhan, dan kini pasukan mereka berkumpul di sepanjang perbatasan kami! Sebuah konferensi diadakan di Munich di mana para pemimpin Eropa membahas masa depan Cekoslowakia, namun kami belum diundang.\n\nBaik Inggris maupun Prancis telah membatalkan janji mereka sebelumnya untuk mendukung kami melawan agresi Jerman. Para diplomat mereka telah menjelaskan dengan jelas bahwa jika kami memilih untuk melawan Jerman, kami akan melakukannya sendiri. Mungkin kita tidak punya pilihan selain menyerahkan Sudetenland..."
 germany.46.a: "Ini adalah hari yang kelam bagi Eropa."
 germany.46.b: "Kita tidak akan pernah menyerah!"
 germany.47.d: "Pembicaraan telah diadakan di Munich antara para pemimpin Jerman, Inggris, Perancis dan Italia untuk membahas masa depan Cekoslowakia. Inggris dan Sekutu mereka sama-sama menolak klaim sah kami atas Sudetenland, dan mereka mengancam kami dengan perang jika kami 'melanggar' perbatasan Ceko!\n\nRencana invasi ke Cekoslowakia telah disusun, namun hal ini kemungkinan akan memicu perang umum di Eropa. Kami harus memastikan bahwa kami siap untuk ini."
 germany.47.a: "Saatnya melakukan ini dengan cara yang sulit."
 germany.48.d: "Pembicaraan telah diadakan di Munich antara para pemimpin Jerman, Inggris, Perancis dan Italia untuk membahas masa depan Cekoslowakia. Inggris telah melihat alasan dan menerima klaim kami atas Sudetenland sebagai hal yang sah, namun Prancis yang keras kepala menolak untuk mundur.\n\nMereka telah meninggalkan kerja sama mereka dengan Inggris dan malah menjalin hubungan lebih dekat dengan Ceko. Sepertinya kita harus menangani keduanya pada saat yang sama, tapi setidaknya sekarang Inggris diharapkan tidak melakukan intervensi..."
 germany.48.a: "Ini mungkin menguntungkan kita."
 germany.49.d: "Pembicaraan telah diadakan di Munich antara para pemimpin Jerman, Inggris, Perancis dan Italia untuk membahas masa depan Cekoslowakia. Baik Inggris maupun Prancis telah menerima klaim kami atas Sudetenland sebagai hal yang sah, dan tawaran dukungan mereka sebelumnya kepada Ceko telah dibatalkan.\n\nMeskipun situasi mereka tidak ada harapan, Ceko yang keras kepala menolak menyerahkan wilayah mereka! Kita harus mengambilnya dengan paksa. Sebuah rencana invasi telah disiapkan yang akan menghapus eksperimen keji Versailles ini dari muka bumi!"
 germany.49.a: "Ceko harus dihancurkan."
 germany.50.d: "Pembicaraan telah diadakan di Munich antara para pemimpin Jerman, Inggris, Perancis dan Italia untuk membahas masa depan Cekoslowakia. Baik Inggris maupun Prancis telah menerima klaim kami atas Sudetenland sebagai hal yang sah, dan tawaran dukungan mereka sebelumnya kepada Ceko telah dibatalkan.\n\nMenyadari situasi mereka yang tidak ada harapan, Ceko telah menyerahkan wilayah Sudeten kepada kami. Penduduk Jerman mereka yang tertindas pada akhirnya akan dibawa ke Vaterland!"
 germany.50.a: "Ini adalah hari bersejarah bagi Jerman."
 germany.51.t: "Arbitrase Wina Pertama"
 germany.51.d: "Cekoslowakia adalah tumor kanker di jantung Eropa, dan akhirnya bangsa [GER.GetAdjective] memutuskan untuk mengambil tindakan tegas terhadap mereka. Sudetenland telah diserahkan kepada Jerman, dan kini, sebagai konsekuensi dari Perjanjian Munich, wilayah Cekoslowakia yang sah milik Hongaria akan dikembalikan kepada kita."
 germany.51.a: "Sudah waktunya!"
 germany.52.t: "Aneksasi Zaolzie"
 germany.52.d: "Cekoslowakia sedang hancur lebur, dan kita harus bertindak cepat untuk melindungi wilayah dengan populasi Polandia yang signifikan sebelum direbut oleh Jerman. Kepemilikan Ceko atas Zaolzie selalu kami sengketakan, dan kini saatnya wilayah tersebut bergabung dengan bangsa kita."
 germany.52.a: "Zaolzie adalah milik kita!"
 germany.53.t: "Nasib Cekoslowakia"
 germany.53.d: "Tidak puas hanya dengan mencuri Sudetenland, bangsa Jerman kini memutuskan untuk merebut seluruh negeri kita. Ditinggalkan oleh mereka yang mengaku sebagai sekutu kita, dan dengan pertahanan terbaik kita lenyap dalam Diktat Munich, situasi tampak tanpa harapan..."
 germany.53.a: "Menyerah pada Jerman."
 germany.53.b: "...namun kita tetap harus melawan!"
 germany.54.t: "Ceko Melawan"
 germany.54.d: "Entah bagaimana, bangsa Ceko berhasil mengumpulkan keberanian untuk melawan pendudukan kita atas negara mereka. Pertahanan terbaik mereka berada di Sudetenland, yang kini berada di bawah kendali kita, jadi ini mestinya menjadi kampanye militer yang singkat."
 germany.54.a: "Praha akan segera menjadi milik kita."
 germany.55.d: "Akhir dari Cekoslowakia sudah di depan mata, dan pasukan kita sedang berbaris memasuki Praha saat ini juga. Dengan menyerahnya militer Cekoslowakia, kita telah membebaskan persenjataan dalam jumlah besar. Tank-tank mereka, khususnya, akan sangat berguna bagi pasukan kita.\n\nBöhmen akan dianeksasi ke dalam Jerman sebagai protektorat, tetapi apa yang harus dilakukan terhadap Slowakia? Kita dapat menjadikannya negara boneka otonom di bawah pimpinan Jozef Tiso."
 germany.55.d_2: "Setelah menaklukkan Cekoslowakia, kita harus mempertimbangkan cara terbaik untuk membagi wilayah-wilayah ini.\n\nBöhmen tetap menjadi milik Jerman sebagai protektorat, tetapi bagaimana dengan Slowakia? Kita dapat menjadikannya negara boneka otonom di bawah pimpinan Jozef Tiso."
 germany.55.a: "Tetapkan Slovakia sebagai negara boneka."
 germany.55.b: "Pemisahan Cekoslowakia dengan Hongaria."
 germany.55.c: "Seluruh Cekoslowakia adalah milik Reich!"
 germany.55.e: "Jadikan Bohemia dan Slovakia sebagai boneka"
 germany.56.t: "Pembagian Cekoslowakia"
 germany.56.d: "Pasukan Jerman telah memasuki Praha dan akhir dari Cekoslowakia sudah di ambang pintu. Mereka berniat menganeksasi Bohemia ke dalam Reich Jerman, tetapi mereka bersedia menyerahkan Slowakia kepada kita. Haruskah kita menyetujui pembagian ini? Ini berarti memasuki aliansi militer formal dengan Jerman."
 germany.56.d_2: "Setelah menganeksasi Cekoslowakia, Jerman berniat mempertahankan Bohemia sebagai bagian dari Reich, tetapi mereka bersedia menyerahkan Slowakia kepada kita. Haruskah kita menyetujui pembagian ini? Ini berarti menyepakati aliansi militer resmi dengan Jerman."
 germany.56.a: "Tentu saja! Hongaria Raya akan segera menjadi kenyataan!"
 germany.56.b: "Tidak, kami tidak membutuhkan persahabatan Slovakia atau Jerman."
 germany.57.t: "Hongaria Menolak Tawaran Kita"
 germany.57.d: "Pihak Hongaria secara keterlaluan menolak tawaran murah hati kita untuk menganeksasi Slowakia, mengklaim bahwa mereka tidak memiliki kepentingan di wilayah tersebut! Kita harus segera berurusan dengan mereka nanti. Untuk saat ini, kita harus mencari solusi untuk Masalah Slowakia."
 germany.57.a: "Bentuk pemerintahan boneka Tiso."
 germany.57.b: "Annex Slovakia ke Jerman."
 germany.58.t: "Masalah Polandia"
 germany.58.d: "Reichsministerium Pencerahan Publik dan Propaganda telah melakukan pekerjaan luar biasa, dan rakyat Jerman — bahkan seluruh dunia — telah diberitahu mengenai ketidakadilan yang terpaksa dialami saudara-saudara Jerman kita di Polandia. Kini kita memiliki semua pembenaran yang kita butuhkan untuk perang!"
 germany.58.a: "Polandia tidak akan ada lagi!"
 germany.59.desc: "Dengan berani dan sepihak, [GER.GetNameDef] telah menetapkan pengalihan wilayah [664.GetName] ke [FROM.GetNameDef]. Keputusan ini, yang diambil tanpa konsultasi atau persetujuan, menandai pembongkaran lebih lanjut integritas teritorial [ROOT.GetNameDef] dan merupakan pengingat akan kerentanan geopolitik kita.\nDelegasi [GER.GetAdjective], dengan alasan klaim sejarah lama, telah menekan pimpinan kami untuk menyetujui revisi wilayah ini. Hilangnya [664.GetName], wilayah yang kaya akan budaya dan sumber daya, ke [FROM.GetNameDef] adalah pil pahit yang harus ditelan rakyat kita dan merupakan tantangan langsung terhadap kedaulatan bangsa kita."
 germany.59.a: "Hari menyedihkan lainnya untuk [ROOT.GetNameDef]"
 germany.60.t: "Remiliterisasi Rhineland"
 germany.60.d: "Beberapa divisi Jerman baru-baru ini bergerak maju ke Rhineland, menandai pertama kalinya sejak berakhirnya Perang Besar bahwa Jerman menempatkan pasukannya di sebelah barat Rhein. Ini adalah pelanggaran nyata terhadap Perjanjian Versailles, di mana Jerman dilarang memiliterisasi wilayah tersebut! Kecuali kita mengeluarkan ultimatum yang menuntut penarikan mundur mereka, perjanjian itu tidak akan dapat ditegakkan."
 germany.60.a: "Ini adalah tindakan perang! Kumpulkan Inggris ke pihak kita!"
 germany.60.a.tt: "§RJika pecah perang, kita akan mengalami perang saudara karena §YPemerintahan kita yang terputus-putus:§!§!"
 germany.60.b: "Mengeluarkan keberatan diplomatis."
 germany.61.d: "Beberapa divisi Jerman baru-baru ini bergerak maju ke Rhineland, menandai pertama kalinya sejak berakhirnya Perang Besar bahwa Jerman menempatkan pasukan di sebelah barat Rhein. Hal ini merupakan pelanggaran nyata terhadap Perjanjian Versailles, di mana Jerman dilarang memiliterisasi kawasan tersebut!\n\nPihak Prancis sedang memobilisasi pasukan mereka, dan tampaknya berniat mengeluarkan ultimatum. Jika Jerman menolak, mereka siap maju ke dalam wilayah Jerman untuk mengatasi ancaman ini. Opini publik di Inggris menentang perang, namun jika kita menolak mendampingi Prancis, aliansi kita dengan mereka akan dibubarkan."
 germany.61.a: "Perang tidak mungkin terjadi."
 germany.61.b: "Kita harus stand by France!"
 germany.62.d: "Beberapa divisi Jerman baru-baru ini bergerak maju ke Rhineland, menandai pertama kalinya sejak berakhirnya Perang Besar bahwa Jerman menempatkan pasukannya di sebelah barat Rhein. Ini merupakan pelanggaran nyata terhadap Perjanjian Versailles, di mana Jerman dilarang memiliterisasi wilayah tersebut!\n\nPihak Prancis tampaknya puas membatasi tanggapan mereka terhadap pelanggaran ini hanya pada keberatan diplomatik, dan opini publik di Inggris dengan tegas menentang peperangan."
 germany.62.a: "Kita akan issue an objection as well."
 germany.62.b: "Versailles tidak lagi menjadi perhatian kita."
 germany.63.t: "Inggris Menolak Perang"
 germany.63.d: "Pihak Inggris menolak mendukung kita melawan Jerman, mengklaim bahwa orang Jerman 'hanya berjalan di halaman belakang rumah mereka sendiri.' Jika kita berperang dengan mereka, tampaknya kita harus berjuang sendirian.\n\nOpini publik di Prancis menentang perang, tetapi Jerman hanya akan bertambah kuat dan remiliterisasi Rhineland merupakan ancaman langsung terhadap perbatasan kita. Mengeluarkan ultimatum akan kurang mengancam tanpa Inggris di pihak kita. Haruskah kita maju melawan mereka sendirian?"
 germany.63.a: "Iya! Jerman harus ditangani sekarang."
 germany.63.b: "Tidak, tanpa Inggris kita harus mundur..."
 germany.64.t: "Inggris Mendukung Kita"
 germany.64.d: "Meskipun dukungan publik untuk perang minim di Inggris, pemerintah Inggris telah menyadari ancaman yang ditimbulkan oleh Jerman dan mereka menawarkan dukungan penuh kepada kita. Kita akan mengeluarkan ultimatum terakhir kepada Jerman agar mundur dari zona demiliterisasi. Jika mereka menolak, saatnya bagi pasukan kita untuk merangsek jauh ke dalam wilayah Jerman dan mengakhiri rezim tiran mereka!"
 germany.64.a: "Selanjutnya!"
 germany.65.t: "Prancis dan Inggris Memobilisasi Pasukan!"
 germany.65.d: "Pihak Inggris dan Prancis menolak menerima remiliterisasi Rhineland, menyebutnya sebagai 'pelanggaran tak termaafkan' terhadap Perjanjian Versailles. Mereka memobilisasi pasukan untuk melawan kita dan mengeluarkan ultimatum agar pasukan kita segera mundur dan Rhineland tetap didemiliterisasi, atau negara kita akan berada dalam keadaan perang."
 germany.65.a: "Kita tidak bisa mundur! Reich harus dipertahankan!"
 germany.65.b: "We are unprepared for this confrontation. Kita harus back down."
 germany.66.t: "Prancis Memobilisasi Pasukan!"
 germany.66.d: "Pihak Inggris dapat berpikir jernih dan menerima remiliterisasi Rhineland, tetapi pihak Prancis yang gila menolak untuk mundur! Dengan dalih bahwa insiden ini merupakan ancaman langsung terhadap keamanan negara mereka, mereka memobilisasi pasukannya dan dapat menyerbu melintasi perbatasan kapan saja! Kita berada dalam perang!"
 germany.67.t: "Prancis Mundur"
 germany.67.d: "Pihak Prancis dengan bijak memilih mundur ketika mereka menyadari bahwa rencana gila mereka tidak akan mendapat dukungan Inggris. Pasukan mereka telah didemobilisasi dan perang berhasil dihindari untuk saat ini. Demi Tuhan, nyaris saja!"
 germany.67.a: "Perang sekarang akan menjadi kegilaan."
 germany.68.t: "Prancis Menolak Mundur"
 germany.68.d: "Prancis dengan keras kepala memutuskan untuk bertindak sendirian melawan Jerman, dan aliansi kita dengan mereka telah dicabut. Satu lagi perang Eropa telah meletus akibat perselisihan yang sia-sia. Barangkali sudah saatnya bagi Inggris untuk kembali menjaga jarak dari urusan benua Eropa..."
 germany.68.a: "Mungkin hal itu tidak bisa dihindari."
 germany.70.t: "Konspirasi Oster"
 germany.70.d: "Berkeyakinan bahwa Hitler telah menyeret Jerman ke dalam perang yang mustahil dimenangkan, sekelompok perwira senior di dalam Wehrmacht melancarkan kudeta! Kudeta ini tampaknya didalangi oleh Kolonel Hans Oster dari Abwehr, namun jenderal Beck, von Brauchitsch, Halder, serta Laksamana Canaris juga telah dipastikan terlibat!\n\nPasukan bersenjata lengkap yang menunggu di beberapa apartemen Berlin bergerak mengepung Reichskanzlei dengan niat melenyapkan Hitler dan rekan-rekan terdekatnya. Baku tembak sengit saat ini berkecamuk di dalam gedung."
 germany.70.a: "Lindungi Führer dengan segala cara!"
 germany.70.b: "Mungkin pemecatannya adalah yang terbaik..."
 germany.71.t: "Sang Führer Telah Tewas"
 germany.71.d: "Pasukan SS dan unit angkatan darat yang setia bergegas menuju Reichskanzlei dan berhasil menewaskan atau menangkap semua komando pengkhianat, tetapi anjing-anjing itu telah berhasil membunuh Hitler! Sang Führer ditemukan terkulai di atas mejanya dengan puluhan luka tembak — bekerja tanpa lelah demi Vaterland hingga hembusan napas terakhirnya, tak diragukan lagi! Orang kepercayaannya sejak lama, Eva Braun, terluka dalam baku tembak tersebut, namun tampaknya akan pulih pada waktunya.\n\nPara konspirator yang masih hidup akan diadili atas kejahatan keji mereka, tetapi saat ini Jerman sedang berperang dan seorang pemimpin baru sangat dibutuhkan. Siapakah yang akan menjadi Führer berikutnya?"
 germany.71.a: "Herr Himmler akan memimpin kita ke masa depan."
 germany.71.b: "Herr Göring adalah pilihan yang logis."
 germany.71.c: "Eva Braun harus membalas dendam!"
 germany.72.t: "Konspirasi Gagal"
 germany.72.d: "Pasukan SS dan unit angkatan darat yang setia bergegas menuju Reichskanzlei dan berhasil menewaskan atau menangkap semua komando pengkhianat, bahkan Hitler sendiri memimpin pembersihan itu dengan pistol Luger andalannya. Secara ajaib, sang Führer keluar dari pertempuran hanya dengan beberapa luka gores ringan.\n\nPara konspirator yang selamat akan membayar mahal atas ketidaksetiaan mereka, dan Hitler kini semakin berkomitmen untuk mengobarkan perang saat ini menuju kemenangan gilang-gemilang!"
 germany.72.a: "Hidup Fuhrer!"
 germany.73.t: "Konspirasi Berhasil"
 germany.73.d: "Pertempuran sengit di Reichskanzlei telah membuat bangunan tersebut menjadi reruntuhan yang terbakar. Meskipun sejumlah besar tentara SS bergegas membantu Hitler, unit-unit tentara yang setia kepada para konspirator ikut serta dan terbukti tegas. Führer telah dipastikan terbunuh, Eva Braun yang sudah lama percaya diri terluka parah dalam baku tembak, dan para konspirator telah berhasil menyerbu semua gedung pemerintah di Berlin.\n\nSebagian besar Wehrmacht telah berpindah ke pihak lain, namun banyak perwira yang masih loyalis NSDAP. Siapa yang harus memimpin mereka?"
 germany.73.a: "Kematian bagi Sosialisme Nasional!"
 germany.73.b: "Himmler akan membalikkan keadaan ini!"
 germany.73.c: "Göring adalah satu-satunya harapan kami saat ini!"
 germany.73.e: "Eva Braun harus membalas dendam!"
 germany.74.t: "Mempersiapkan Landasan"
 germany.74.d: "Rakyat Austria mendambakan untuk menjadi bagian dari Reich Jerman, namun pemerintah di Wina yang keras kepala sejauh ini menolak semua upaya untuk mewujudkan persatuan. Kita harus meningkatkan dukungan terhadap fasisme di Austria. Partai Nazi Austria kemudian akan menjadi alternatif yang kuat bagi kaum austrofasis yang berkuasa.\n\nSeorang agen Abwehr telah disiapkan untuk misi spionase. Gunakan dia untuk meningkatkan dukungan rakyat terhadap fasisme secara rahasia di Austria."
 germany.74.a: "Austria akan menjadi milik kita!"
 germany.75.t: "Perjanjian Jerman-Soviet"
 germany.75.d: "Terlepas dari retorika keras sebelumnya terhadap rakyat maupun kepemimpinan ideologis [Root.GetName], [From.GetLeader] dan Jerman kini menghubungi kita, meminta perjanjian riset yang saling menguntungkan. Walaupun pertukaran pengetahuan akan membantu upaya kita mengembangkan rancangan tank baru bersama janji manfaat riset lainnya di masa depan, mengingat pernyataan sebelumnya kecil keraguan bahwa Jerman melakukan ini demi kepentingan mereka sendiri. Haruskah kita melanjutkan perjanjian ini terlepas dari risiko membantu ambisi [From.GetLeader]?"
 germany.75.a: "Kaum kapitalis adalah ancaman yang lebih buruk bagi kita berdua."
 germany.75.b: "Kami tidak akan memberikan senjata kepada fasis untuk menghancurkan proletariat!"
 germany.76.t: "Soviet Menerima Perjanjian Jerman-Soviet"
 germany.76.d: "Perundingan kita dengan [From.GetName] telah berhasil. Suatu kesepakatan telah dicapai di mana kedua negara kita akan saling membantu dalam pengembangan unit lapis baja baru, dengan kemungkinan perluasan ke bidang penelitian lain di masa depan."
 germany.76.a: "Perjanjian ini akan menjadi batu loncatan menuju masa depan."
 germany.77.t: "Soviet Menolak Perjanjian Jerman-Soviet"
 germany.77.d: "[From.GetName] telah menolak usulan perjanjian kita yang bertujuan memajukan penelitian unit lapis baja di kedua negara, diduga karena khawatir senjata unggul kita kelak akan digunakan untuk melawan mereka."
 germany.77.a: "Saat ini, mereka hampir tidak bisa mengurangi risikonya."
 germany.78.t: "Riset Udara Bersama Jerman"
 germany.78.d: "Sebagaimana ditetapkan dalam perjanjian dengan Jerman, beberapa proyek penelitian khusus mereka berbagi penemuan dengan para insinyur kami. Sebuah terobosan baru dalam teknologi radar telah menjadi perhatian kami, membuka peluang tak terduga untuk memajukan penelitian kami di lapangan."
 germany.78.a: "Mendeteksi musuh adalah langkah pertama."
 germany.79.t: "Ultimatum dari Jerman"
 germany.79.d: "Dengan Yunani di bawah cengkeraman Jerman, [From.GetLeader] telah menekan pemerintah kita untuk bergabung dengan barisan mereka. Aliansi Soviet-Jerman menempatkan kita pada posisi di mana netralitas bukan lagi sebuah pilihan, dan kini sebuah ultimatum telah tiba dari Berlin yang menuntut kita menyerahkan wilayah timur kita kepada sekutu Soviet mereka dan bergabung dalam pakta yang mereka gunakan untuk menekan kita.\n\nKendati kita tidak dapat mempertahankan netralitas, ada pilihan lain. Mencari dukungan dari Inggris adalah salah satunya, mempertahankan posisi kita adalah yang lain. Namun, tak satu pun yang dapat menjamin masa depan republik dengan pasti."
 germany.79.a: "Jika kita bekerja sama dengan Jerman, kita mungkin mendapat peluang untuk merebut kembali tanah lain."
 germany.79.b: "Kami dapat mengandalkan dukungan Inggris, dan mereka juga dapat mengandalkan kami."
 germany.79.c: "Jika para penguasa lalim ini ingin mengambil alih rumah kami, mereka harus berjuang untuk itu."
 germany.80.t: "Danzig untuk Slowakia"
 germany.80.d: "Jerman telah lama mengincar Danzig, berupaya menyatukan wilayah mereka di Ostpreussen dengan wilayah Jerman lainnya. Para diplomat telah memperingatkan bahwa akan tiba harinya ketika mereka membuat kita memilih antara Danzig atau perang.\n\nYang mengejutkan, kita dihadapkan pada apa yang dianggap oleh Jerman sebagai solusi yang lebih damai. Mereka menawarkan negara Slovakia yang baru dibentuk, yang saat ini hanya berupa negara boneka di bawah kekuasaan Jerman, kepada kita sebagai imbalan atas Danzig.\nLangkah apa yang akan diambil Jerman jika kami menolak tidak diketahui, namun kami telah diberi kesempatan untuk menyelesaikan konflik ini dengan sejumlah perolehan teritorial."
 germany.80.a: "Ini adalah tawaran terbaik yang akan kami dapatkan."
 germany.80.b: "Kami tidak akan memberikan apa yang menjadi hak kami atas apa yang telah mereka curi!"
 germany.81.t: "Danzig Diserahkan demi Slowakia"
 germany.81.d: "Polandia telah menyetujui pertukaran di mana Danzig akan diserahkan kepada [GER.GetNameDef], sementara Slowakia kini berada di bawah kendali Polandia. Melalui perjanjian ini, kita telah merebut kembali Danzig sembari mempertahankan hubungan yang bersahabat, atau setidaknya tidak bermusuhan secara terbuka, dengan tetangga timur kita."
 germany.81.a: "Jerman adalah satu lagi."
 germany.82.t: "[From.GetNameDefCap] Menolak Menyerahkan Danzig"
 germany.82.d: "Tawaran murah hati kita berupa wilayah Slowakia kepada [From.GetNameDef] sebagai ganti Danzig telah ditolak, membiarkan Danzig tetap di tangan Polandia. Jelas, [From.GetLeader] tidak memiliki pemahaman yang sama dengan kita bahwa Danzig adalah wilayah Jerman yang sah.\n[Root.GetLeader] sangat murka, dan opsi diplomatik untuk merebut kembali Danzig tampaknya telah habis."
 germany.82.a: "Mungkin ini saatnya untuk mempertimbangkan pilihan lain."
 germany.83.t: "Pakta Anti-Soviet"
 germany.83.d: "Dengan Pakta Anti-Komintern, [From.GetNameDef] telah mengamankan lahan subur bagi sarana diplomatik untuk membendung ancaman Soviet. Namun, pakta tersebut bukan merupakan aliansi militer, juga tidak memuat kewajiban yang jelas bagi para penandatangannya. [From.GetLeader] kini berupaya untuk memperluas pakta tersebut ke dalam koalisi Anti-Soviet, sebuah perjanjian yang mengikat untuk bergabung bersama dalam perang jika ada negara penandatangan yang terlibat dalam keadaan perang dengan Uni Soviet.\n\nMeskipun jauh lebih berbahaya, dan kemungkinan besar akan mengakhiri diplomasi apa pun yang masih kita pertahankan dengan Soviet, ini juga merupakan kesempatan kita untuk memastikan bahwa kita memiliki sekutu yang kuat di pihak kita jika terjadi perang."
 germany.83.a: "Kami akan mendukung Jerman dan sekutunya melawan Soviet."
 germany.83.b: "Siapapun bisa memulai perang dunia lagi dengan perjanjian seperti itu."
 germany.84.t: "Memanggil Anggota Pakta untuk Berperang"
 germany.84.d: "Tepat seperti dugaan kita saat menandatangani Pakta Anti-Soviet, kini kita mendapati diri kita dalam keadaan perang dengan Uni Soviet. Sudah saatnya bagi sesama penandatangan untuk menepati janji mereka dan bergabung bersama kita."
 germany.84.a: "Pandangan ke depan kami membuahkan hasil."
 germany.85.t: "[From.GetName] Memanggil Anggota Pakta untuk Berperang"
 germany.85.t.a: "[From.GetName] Memanggil Anggota Pakta untuk Berperang"
 germany.85.t.b: "[From.GetName] Memanggil Jaminan"
 germany.85.d: "Pakta Anti-Soviet menetapkan bahwa seluruh penandatangan harus bergabung dalam setiap konflik pertahanan melawan Uni Soviet. [From.GetName] kini telah diserang oleh Soviet dan telah mengirimkan permintaan kepada seluruh anggota pakta untuk segera datang membantu. Kini saatnya menunjukkan dedikasi [Root.GetAdjective] untuk melindungi dunia dari ancaman Uni Soviet untuk selama-lamanya."
 germany.85.desc.a: "Pakta Anti-Soviet menetapkan bahwa semua negara penandatangan harus ikut serta dalam konflik defensif apa pun dengan Uni Soviet. [From.GetName] kini telah diserang oleh Soviet dan telah mengirimkan permintaan kepada semua anggota pakta untuk segera membantu mereka. Saatnya menunjukkan dedikasi [Root.GetAdjective] untuk melindungi dunia dari ancaman Uni Soviet untuk selamanya."
 germany.85.desc.b: "Jaminan kami terhadap [From.GetNameDef] menetapkan bahwa kami harus ikut serta dalam konflik defensif apa pun dengan Uni Soviet. Mereka kini telah diserang oleh Soviet, dan sudah waktunya bagi kita untuk menepati janji kita dan segera memberikan bantuan kepada mereka. Saatnya menunjukkan dedikasi [Root.GetAdjective] untuk melindungi dunia dari ancaman Uni Soviet untuk selamanya."
 germany.85.a: "[From.GetName] tidak berdiri sendiri!"
 germany.85.b: "Ini bukan perang kita."
 germany.85.b_tt: "§YIni akan dianggap sebagai pengkhianatan oleh semua negara yang menghormati pakta tersebut (§!§R-50§!§Yopini)§!"
 germany.86.t: "Danzig atau Perang"
 germany.86.d: "[GER.GetNameDefCap] telah lama mengumumkan tujuan mereka untuk merebut kembali wilayah yang hilang dalam Perang Besar. Secara khusus mereka mengincar wilayah Danzig, yang memisahkan Ostpreussen dari wilayah negara mereka lainnya.\n\nKini, mereka menuntut agar Danzig diserahkan kepada [GER.GetNameDef], dan sebagai imbalannya tidak menawarkan apa pun selain janji untuk membatalkan klaim mereka atas Poznań. Dengan bayang-bayang ancaman perang, menerima tawaran ini akan menunda kemungkinan konflik, tetapi dengan harga memberikan Jerman kekuatan lebih secara cuma-cuma demi apa pun yang ada di depan."
 germany.86.a: "Ayo buat kesepakatan. Mungkin mereka akan beralih ke tempat lain."
 germany.86.b: "Danzig akan tetap menjadi Gdansk!"
 germany.87.t: "Polandia Menyerahkan Danzig"
 germany.87.d: "Dihadapkan pada ultimatum kita, Polandia telah sepakat untuk menyerahkan wilayah yang mereka peroleh secara tidak adil kepada kita, membuktikan bahwa mereka pasti tahu wilayah itu sah milik Jerman!"
 germany.87.a: "Polandia telah menghindari perang... untuk saat ini."
 germany.88.t: "Polandia Menolak Menyerahkan Danzig"
 germany.88.d: "Terlepas dari upaya kita untuk membiarkan Polandia menyerahkan Danzig secara damai, bahkan berjanji melepaskan klaim kita atas wilayah Jerman lainnya sebagai gantinya, kita dihadapkan pada penolakan. Seperti yang sudah diduga, dunia tidak memberikan apa pun kepada kita selain apa yang kita rebut dengan kekerasan."
 germany.88.a: "Mereka tahu betul apa alternatifnya."
 germany.1002.t: "Menghormati Pakta Molotov-Ribbentrop?"
 germany.1002.desc: "Jerman dan [SOU.GetNameDef] telah membuat kesepakatan untuk membagi Polandia menjadi bagian timur dan barat, namun pendudukan kita atas bagian timur telah menimbulkan komplikasi dalam pengaturan ini. Meskipun sekutu Jerman kita sepenuhnya berharap kita akan menyerahkan wilayah Polandia yang dijanjikan kepada [SOU.GetNameDef], kita malah bisa melanggar pakta tersebut dan melanjutkan pendudukan kita."
 germany.1002.b: "Polandia adalah milik kita!"
 germany.1003.t: "[From.GetNameDefCap] Melanggar Pakta!"
 germany.1003.desc: "Terlepas dari keputusan untuk menyerahkan Polandia timur kepada [SOU.GetNameDef], sekutu kita di [From.GetNameDef] memilih untuk melanjutkan pendudukan mereka atas Polandia, secara resmi melanggar Pakta Molotov-Ribbentrop!"
 germany.1003.a: "Sekarang kita harus membayar harga atas kekurangajaran mereka."
 china.1.t: "Insiden Jembatan Marco Polo"
 china.1.d: "Tentara Jepang baru-baru ini melancarkan serangan ke Jembatan Marco Polo yang strategis di selatan Beijing, namun mereka berhasil digagalkan oleh tentara pemberani kita. Tidak diragukan lagi ini adalah peristiwa yang dirancang untuk menyalahkan kami dan memaksa kami untuk menyerahkan lebih banyak wilayah – seperti Insiden Mukden ketika Jepang menginvasi Manchuria.\n\nBagaimana sebaiknya kita menyikapinya?"
 china.1.a: "Kita telah mencapai titik puncaknya!"
 china.1.b: "Kita tidak sanggup berperang dengan Jepang."
 china.1.b_tt_SND: "§Y[SND.GetNameDefCap]§! akan dipaksa untuk menyerahkan tanahnya kepada §Y[JAP.GetName]§!"
 china.1.b_tt_HBC: "§Y[HBC.GetNameDefCap]§! akan dipaksa untuk menyerahkan tanahnya kepada §Y[JAP.GetName]§!"
 china.2.t: "Jerman Menarik Penasihat Militer"
 china.2.d: "Jerman telah menyerah pada tekanan diplomatik Jepang, dan memutuskan untuk menarik penasihat militernya dari negara kita! Von Falkenhausen berjanji pada jamuan makan malam perpisahan bahwa dia tidak akan mengungkapkan rencana pertempuran kita kepada Jepang, tetapi berakhirnya dukungan Jerman pasti akan merugikan militer kita."
 china.2.a: "Kita harus puas tanpa mereka."
 china.3.t: "Memburuknya Hubungan Tiongkok - Jerman"
 china.3.d: "Hubungan kita yang kian memburuk dengan Jerman telah mengakibatkan mereka menarik kembali seluruh penasihat militer mereka dari negara kita."
 china.3.a: "Perwira Tiongkok akan menyelesaikan apa yang mereka mulai!"
 china.4.t: "Penasihat Militer Ditahan"
 china.4.d: "Karena saat ini kita berada dalam keadaan perang dengan Jerman, semua penasihat militer mereka yang berada di negara kita telah ditahan. Von Falkenhausen dan beberapa kroninya berhasil lolos dari cengkeraman kita dan telah kembali ke Eropa!"
 china.4.a: "Selamat jalan!"
 china.5.t: "Tak Lagi Terpojok"
 china.5.d: "Tentara Merah pernah bertahan dalam kondisi yang tampak tanpa harapan, namun sejak Mars Panjang beberapa tahun lalu, keadaan perlahan berbalik. Dengan kemajuan teritorial yang signifikan, peran kita sebagai pihak yang tertindas telah menjadi masa lalu. Setelah berjuang melewati masa-masa penuh kesukaran ini, keputusasaan kini telah kita tinggalkan. Mao Zedong telah beralih dari pemimpin pasukan gerilya menjadi ketua."
 china.5.a: "Hidup Republik Rakyat!"
 china.6.t: "Mempersiapkan Serangan Terhadap Komunis"
 china.6.d: "Setelah mundurnya Tentara Merah Partai Komunis Tiongkok dalam pelarian panjang, mereka berhasil berkonsolidasi kembali dan menancapkan kekuasaan di Shaanxi. Upaya berkelanjutan mereka untuk menghasut penduduk pedesaan melawan kita dan mencari dukungan dari Uni Soviet mengindikasikan bahwa mereka bisa tumbuh semakin kuat jika dibiarkan begitu saja. Namun, banyak panglima perang di sekitar wilayah tersebut, kendati mendukung pemerintah kita, enggan atau tidak mampu berkorban demi melancarkan serangan yang efektif.\n\nSaat ini belum jelas apakah Tentara Merah masih dalam tahap pemulihan atau sudah siap menghadapi kita dalam pertempuran, tetapi waktu tidak berpihak kepada kita. Untuk memperkuat posisi politik kita, kita harus menyerang kaum komunis."
 china.6.a: "Perkuat panglima perang lokal untuk menyerang."
 china.6.b: "Rekrut penjahat lokal untuk memperjuangkan kami."
 china.6.c: "Andalkan sukarelawan lokal yang menentang komunis."
 china.6.tt: "§YJika RRT memilih untuk menghadapi serangan:§!"
 china.6.tt_2: "§YJika RRT memilih mundur:§!"
 china.7.t: "Kuomintang Melancarkan Serangan"
 china.7.d: "Meskipun kita telah lolos dari kekalahan melalui Long March, kaum nasionalis tidak berencana membiarkan kita tumbuh lebih kuat tanpa konfrontasi lebih lanjut. Mata-mata kami menyatakan bahwa mereka melancarkan serangan terhadap kami, yang dapat melemahkan dukungan politik kami jika kami mencoba mundur lebih jauh.\n\nKami tidak tahu seberapa besar komitmen Kuomintang untuk memukul mundur kami saat ini. Mencoba menghadapi mereka membawa risiko yang signifikan. Jika panglima perang setempat bersatu untuk mendukung serangan tersebut, peluang kita mungkin kecil. Di sisi lain, mundur sekarang ketika kita akhirnya berhenti mungkin bukan suatu pilihan."
 china.7.a: "Hadapi serangan itu dengan cara apa pun yang kita mampu!"
 china.7.b: "Mundur ke dalam isolasi."
 china.8.t: "Kaum Komunis Mundur"
 china.8.d: "Setelah mengetahui rencana ofensif kita melalui jaringan mata-mata lokal mereka, PKC telah menarik Tentara Merah mereka lebih jauh ke pedalaman Shaanxi. Meskipun hal ini menghilangkan kesempatan kita untuk semakin mengikis kekuatan mereka, peristiwa ini membuktikan bahwa kaum komunis belum siap menghadapi kita, terlepas dari propaganda yang mereka gembar-gemborkan. Sampai batas tertentu, langkah ini tetap menguntungkan kita."
 china.8.a: "Pengecut!"
 china.9.t: "Kemenangan Terhadap Kaum Komunis"
 china.9.d: "Komitmen kita untuk memukul telak Tentara Merah telah membuahkan hasil, setidaknya untuk saat ini. Kendati memperoleh informasi mengenai serangan tersebut, kaum komunis memutuskan untuk menghadapi pasukan kita dan menderita kekalahan. Mereka kini terpaksa mundur lebih jauh, dan banyak penduduk setempat mulai ragu akan kemampuan mereka memenuhi janji untuk menggulingkan pemerintah kita."
 china.9.a: "Dan memang demikian!"
 china.10.t: "Kaum Komunis Memukul Mundur Serangan"
 china.10.d: "Berbekal informasi mengenai rencana ofensif kita sebelumnya, Tentara Merah telah bersiap siaga dan menyambut serangan kita. Pasukan yang berhasil kita himpun di wilayah ini, di mana basis kekuasaan kita tergolong lemah, tidak mencukupi untuk menundukkan kekuatan komunis.\nSangat disayangkan, serangan ini justru berbalik merugikan kita dan dipandang sebagai bukti bangkitnya kembali Tentara Merah setelah mundurnya mereka dalam pelarian panjang."
 china.10.a: "Itu tidak akan membantu mereka dalam jangka panjang."
 china.11.t: "Kekalahan Melawan Kuomintang"
 china.11.d: "Meskipun kami telah berupaya sebaik-baiknya untuk menghalau serangan pasukan lokal yang mendukung pemerintah nasionalis, persiapan kami tidak cukup untuk menghentikannya. Dengan kekalahan yang cukup besar, kita terpaksa mundur, meski lebih singkat.\n\nMenghadapi kaum nasionalis sebelum kita pulih sepenuhnya mungkin merupakan sebuah kesalahan. Pemulihan luar biasa kami dalam Long March memberikan harapan pada pendukung kami, namun kini, benih keraguan telah disemai."
 china.11.a: "Kami akan pulih dan memenangkan kembali kepercayaan masyarakat."
 china.12.t: "Kemenangan Melawan Kuomintang"
 china.12.d: "Menantang serangan Kuomintang telah menguntungkan kami. Pasukan lokal yang dikirim untuk menghadapi Tentara Merah tidak siap menghadapi serangan yang akan datang dan dikalahkan, semua ini berfungsi sebagai peringatan bagi panglima perang di sekitar bahwa menyerang kami akan memakan biaya yang besar.\n\nKaum nasionalis hanya membuktikan bahwa mereka meremehkan kita sebagai musuh, dan bahwa Republik Rakyat Tiongkok sekali lagi sedang bangkit."
 china.12.a: "Kekuatan Politik tumbuh dari laras senjata."
 china.13.t: "Bentrokan dengan Gerilyawan Komunis"
 china.13.d: "Dengan kondisi kita dan Tentara Merah Tiongkok yang baru saja pulih dari ofensif sebelumnya, keberadaan pasukan kedua belah pihak di dekat perbatasan telah mengobarkan kembali api konflik. Selain mengandalkan panglima perang lokal dan milisi, kita mempertimbangkan untuk mendatangkan lebih banyak pasukan dari wilayah lain.\n\nMeskipun langkah ini mungkin tidak memberi kita kesempatan untuk memusnahkan ancaman komunis untuk selamanya, ini akan menjadi kemenangan ideologis penting guna membuktikan bahwa mereka tidak akan dibiarkan memperluas pengaruh lebih jauh."
 china.13.a: "Kita harus menarik garis batasnya sekarang!"
 china.13.b: "Kami tidak mampu melakukan konfrontasi lagi."
 china.14.t: "Kekalahan di [From.GetName]"
 china.14.d: "Terlepas dari upaya kita untuk menegaskan bahwa kaum komunis tidak akan diizinkan memperluas pengaruh mereka ke luar daerah perlindungan mereka saat ini, kita tidak mampu mengerahkan sumber daya yang cukup untuk memenangkan pertempuran di sepanjang perbatasan [From.GetName].\n\nKonflik sporadis dengan milisi komunis perlahan-lahan kian menguntungkan pihak mereka, yang pada akhirnya menjadikan kampanye militer ini gagal membuktikan bahwa situasi berada di bawah kendali kita. Jika dukungan rakyat terhadap mereka terus meningkat, kaum komunis bisa menjadi ancaman yang nyata."
 china.14.a: "meresahkan."
 china.15.t: "Kemenangan di [From.From.GetName]"
 china.15.d: "Setelah serangkaian bentrokan kecil di pinggiran wilayah kekuasaan kita, konflik dengan Kuomintang tampaknya mulai berbalik menguntungkan kita. Meskipun mempertahankan tekanan konstan sangat menguras tenaga pasukan dan perbekalan kita, perjuangan ini membuahkan hasil setimpal.\n\nMeski tiada pertempuran yang menentukan, kita meraih kemenangan bertahap kali ini, yang semakin memperteguh keyakinan akan perjuangan kita dan kembali mengobarkan api revolusi."
 china.15.a: "Ini tidak akan segera terlupakan!"
 china.16.t: "Kekalahan di [From.GetName]"
 china.16.d: "Upaya kita untuk melancarkan perang tidak langsung terhadap meningkatnya kehadiran Kuomintang terbukti menjadi bencana. Kaum nasionalis ternyata jauh lebih bertekad memukul kita mundur dari perkiraan semula, barangkali karena mereka menyadari dampak kegagalan ini terhadap reputasi kita. Kendati pasukan kita untuk saat ini kembali aman untuk memulihkan diri, kerugian yang dialami tidak luput dari perhatian penduduk setempat, dan desas-desus mengenai kegagalan revolusi telah menyebar ke desa-desa sekitar."
 china.16.a: "Revolusi masih jauh dari kematian!"
 china.17.t: "Kemenangan di [From.From.GetName]"
 china.17.d: "Upaya kita untuk menarik garis batas menghadapi ancaman komunisme telah membuahkan hasil. Kampanye gerilya PKC dalam merespons peningkatan konsentrasi pasukan kita di wilayah-wilayah sekitar basis kekuatan mereka gagal mengantisipasi kegigihan kita untuk menghentikan mereka. Unjuk kekuatan ini, kendati tidak lepas dari pengorbanan, telah meyakinkan banyak penduduk lokal yang sebelumnya memberikan dukungan diam-diam kepada [From.GetLeader] dan partainya bahwa Tiongkok tidak akan pernah bisa disatukan di bawah ideologi semacam itu."
 china.17.a: "Mari kita berharap mereka ingat."
 china.18.t: "Bentrokan dengan Tentara Nasionalis"
 china.18.d: "Kendati kita baru saja pulih dari ofensif mereka sebelumnya, kaum nasionalis tampaknya meningkatkan kehadiran pasukan mereka di daerah-daerah dekat perbatasan kita. Jelas sekali mereka berusaha menunjukkan bahwa mereka telah berhasil mengepung kita kembali dan bahwa Mars Besar hanya menunda pukulan terakhir mereka terhadap PKC. Kita tidak boleh membiarkan rakyat memercayai hal tersebut."
 china.18.a: "Kita tidak bisa menghabiskan waktu untuk memulihkan diri."
 china.100.t: "Tiongkok Mendapat Serangan Lanjutan"
 china.100.d: "Bagaikan kucing pemangsa, Jepang merangsek maju dan merebut Korea. Mereka berusaha mempermalukan kita dengan 21 Tuntutan mereka, menduduki Manchuria, dan kini mereka bergerak maju lagi. Cukup sudah, Tiongkok akan berjuang hingga titik darah penghabisan demi mempertahankan kemerdekaan. Dalam pidatonya kepada rakyat, [Root.GetLeader] menyerukan kepada segenap rakyat [Root.GetAdjective], agar mereka bersatu padu atau menghadapi kehancuran mutlak sendirian."
 china.100.a: "Untuk Tiongkok!"
 china.101.t: "Tiongkok Diserang"
 china.101.d: "Sudah saatnya kita berdiri bersama menghadapi musuh bersama kita, Jepang. Mari kita kesampingkan perselisihan remeh dan berjuang sebagai satu Tiongkok yang kuat dan bersatu!"
 china.101.a: "Bersatu kita teguh!"
 china.101.b: "Kita harus melawan penjajah!"
 china.102.t: "Tiongkok Diserang"
 china.102.d: "Dengan disibukkannya Uni Soviet dalam perang melawan Jerman, kita telah diberitahu bahwa mereka tidak lagi mampu memberikan perlindungan sebanyak yang mereka berikan di masa lalu. Merupakan kepentingan terbaik kita untuk meraih dukungan KMT dan bergabung bersama mereka dalam perang melawan Jepang."
 china.102.a: "Bersatu kita teguh!"
 china.102.b: "Mari kita bersama-sama melawan ancaman Jepang."
 china.102.c: "Kepentingan kita paling baik dilindungi oleh kekuatan Soviet"
 china.103.t: "Tiongkok Bersatu"
 china.103.d: "[From.GetName] telah memilih untuk bergabung bersama kita dalam perjuangan melawan Jepang. Dalam persatuan, kita akan mengusir penjajah kembali."
 china.103.a: "Bersatu kita teguh!"
 china.104.t: "Tiongkok Diserang"
 china.104.d: "Tiongkok sedang diserang. Para panglima perang mengesampingkan keluhan mereka untuk melawan pasukan Jepang yang menyerang. Ini adalah kesempatan untuk memajukan kepentingan CPC, kita dapat menunjukkan kepada rakyat Tiongkok bahwa kitalah dan bukan KMT yang dekaden yang merupakan masa depan Tiongkok yang sebenarnya. Haruskah kita ikut serta dalam perjuangan ini dan memastikan adanya masa depan bagi Tiongkok?"
 china.104_PRC_SOV_reinforcements: "Akan menerima 10 divisi dari Soviet."
 china.104.a: "Bersatu kita teguh!"
 china.104.b: "Mereka harus menangani Jepang tanpa bantuan kita"
 china.104.tt: "Tiongkok Utara dan Manchuria kini dapat dibebaskan atas nama [Root.GetName]."
 china.105.t: "Tiongkok Bersatu"
 china.105.d: "[From.GetName] ingin kita menggabungkan kekuatan dalam perjuangan melawan Jepang. Mereka telah bergabung dengan [From.GetFactionName] dan siap mengesampingkan perselisihan lama demi menghadapi invasi Jepang."
 china.105.a: "Bersatu kita teguh!"
 china.105.b: "Kami akan mengizinkan mereka mengendalikan negara kami selama perang yang akan datang"
 china.106.t: "Tiongkok Bersatu"
 china.106.d: "[From.GetName] telah bergabung dengan [Root.GetFactionName] dan siap bertempur."
 china.106.a: "Kami akan mengusir setan Jepang dari tanah kami"
 china.107.t: "Tak Lagi Bersatu"
 china.107.d_PRC_joined: "[Root.GetFactionName] telah menuntaskan tujuannya. Tiada lagi musuh bersama yang mengharuskan kita berdiri bersatu. Mao Zedong kini tengah mengonsolidasikan cengkeramannya atas wilayah-wilayah di Tiongkok Utara. Namun, harapan apa yang mereka miliki melawan bala tentara kita yang bergemilang kemenangan?"
 china.107.d_PRC_refused: "Dengan berakhirnya perang, para patriot sejati telah menang. Ini saatnya untuk menyelesaikan masalah dengan mereka yang bersembunyi saat kita berdarah."
 china.107_tt: "@PRC §YRepublik Rakyat Tiongkok§! mengambil kendali atas negara bagian Tiongkok di §YTiongkok Utara§! dan §YManchuria§!"
 china.107.a: "Kami tidak lagi memiliki musuh bersama"
 china.108.t: "Kemajuan Komunisme"
 china.108.d: "Peran kita dalam perjuangan melawan anjing-anjing Jepang yang dibenci telah mendatangkan wibawa besar bagi PKC. Semakin banyak rakyat yang menyadari bahwa kitalah masa depan Tiongkok, terutama jika dibandingkan dengan Kuomintang yang korup. Kader-kader partai telah mengorganisasi rakyat ke dalam pasukan baru yang akan berenang laksana ikan di lautan petani."
 china.108.a: "Kita harus memperkuat barisan kita"
 china.108_PRC_SOV_reinforcements_2: "Menerima 20 divisi"
 china.109.t: "Berjuang Demi Tiongkok!"
 china.109_tt: "§YMendapatkan klaim di daratan Tiongkok§!"
 china.109.d: "Sudah saatnya membersihkan Tiongkok dari penyakit bernama Kuomintang. Kita akan membebaskan segenap rakyat Tiongkok dan mewujudkan bangsa yang bersatu di bawah kepemimpinan bijaksana Mao."
 china.109.a: "Menuju Perang!"
 china.110.t: "[From.GetName] Menyatakan Perang"
 china.110.d: "[From.GetName] dan kabinet [From.GetLeader] telah menyatakan perang terhadap kita."
 china.110.a: "Menuju Perang!"
 china.111.t: "Tak Lagi Bersatu"
 china.111.d: "[Root.GetFactionName] telah menuntaskan tujuannya. Tiada lagi musuh bersama yang mengharuskan kita berdiri bersatu. Kita telah memanfaatkan waktu dengan bijak untuk membangun dukungan di seluruh Tiongkok Utara dan Manchuria, dan kini saatnya meresmikan kendali kita di kawasan ini."
 china.111.a: "Kami tidak lagi memiliki musuh bersama"
 china.200.t: "Bergabung dengan Republik Rakyat Tiongkok"
 china.200.d: "Setelah memisahkan diri dari Kuomintang nasionalis demi membebaskan rakyat, kini kita harus menggabungkan kekuatan dengan Republik Rakyat Tiongkok yang telah berdiri demi mencegah terpecah-belahnya pergerakan. Musuh-musuh Tiongkok selalu mengandalkan pertikaian internal kita untuk memperlemah kita; negara sosialis yang baru ini tidak akan mengulangi kesalahan serupa!"
 china.200.a: "Bersatu kita akan mengalahkan kaum nasionalis!"
 china.201.t: "Pemberontak Komunis Bergabung dengan Republik"
 china.201.d: "Setelah membebaskan diri dari cengkeraman nasionalis, kaum revolusioner Tiongkok yang bersimpati dengan perjuangan kita telah memutuskan untuk menggabungkan wilayah mereka dengan kita di bawah kepemimpinan [Root.GetLeader]. Mulai saat ini dan seterusnya, akan berdiri satu Republik Rakyat Tiongkok yang bersatu."
 china.201.a: "Kita harus bergabung untuk melindungi rekan-rekan kita!"
 china.202.t: "Pemberontakan Komunis di [CHI_communist_state.GetName]"
 china.202.d: "Meningkatnya dukungan komunis di [CHI_communist_state.GetName] telah mencapai titik puncaknya. Fasilitas pemerintah telah dikuasai dan pemberontak telah menyatakan bahwa mereka tidak lagi menganggap diri mereka sebagai bagian dari [Root.GetName]. Kami secara efektif telah kehilangan seluruh kendali atas [CHI_communist_state.GetName] ke tangan rezim komunis."
 china.202.a: "Kita harus quell this communist menace!"
 china.203.t: "Pemberontakan Komunis di [CHI_communist_state.GetName]"
 china.203.d: "Setelah membebaskan diri dari cengkeraman nasionalis, kaum revolusioner Tiongkok yang bersimpati dengan perjuangan kita telah memutuskan untuk menyatukan wilayah mereka dengan kita di bawah kepemimpinan [Root.GetLeader]. Mulai saat ini dan seterusnya, akan berdiri satu [Root.GetName] yang bersatu."
 china.203.a: "Kami menyambut saudara-saudara komunis kami!"
 china.204.t: "Ibu Kota [Root.GetAdjective]"
 china.204.d: "Dengan berakhirnya Perang Saudara Tiongkok, kini saatnya bagi kita untuk mengonsolidasikan kekuasaan di Tiongkok dan membuktikan kepada rakyat bahwa kitalah penjelmaan modern dari Kerajaan Tengah. Kitalah negara yang akan menuntun mereka menuju masa depan.\n\nUntuk tujuan ini, kita harus memiliki ibu kota yang pantas bagi negara agung kita."
 china.204.a: "Kami akan memerintah dari Ibu Kota Utara yang lama."
 china.204.b: "Kami akan memerintah dari Ibu Kota Selatan yang lama."
 china.204.c: "Tidak perlu memindahkan pusat pemerintahan."
 CHI_nanjing_tt: "Memindahkan ibu kota ke §YNanjing§!."
 CHI_no_united_front: "Tidak akan ada kerja sama melawan ancaman eksternal."
 spanish_civil_war: "Perang Saudara Spanyol telah dimulai"
 spain.1.t: "Perang Saudara!"
 spain.1.d: "Sekelompok jenderal yang berkuasa di Angkatan Bersenjata telah mengeluarkan pronunciamento, mengecam pemerintahan Spanyol saat ini! Mereka melancarkan kudeta sayap kanan dengan dukungan kaum monarki konservatif dan ulama. Sebagian besar militer memihak kelompok Nasionalis ini, namun sejauh ini mereka gagal merebut kota-kota besar di Spanyol kecuali Sevilla.\n\nRelawan sayap kiri berbondong-bondong mendukung pemerintah Republik, siap mendukung pemerintah melawan pemberontak. Para loyalis ini mungkin kurang terlatih, namun tidak ada yang meragukan antusiasme mereka.\n\nGaris pertempuran telah ditentukan - faksi mana yang harus kita dukung?"
 spain.1.a: "Kaum Nasionalis!"
 spain.1.b: "Partai Republik!"
 spain.10.d: "Setelah Jenderal Francisco Franco terpilih sebagai presiden Spanyol secara damai, ada harapan bahwa pemberontakan yang disertai kekerasan dan kekacauan politik dalam beberapa tahun terakhir akan diakhiri. Desas-desus bahwa Franco akan berusaha menciptakan kediktatoran satu partai dengan dirinya sebagai kepala negara dipicu oleh hilangnya beberapa pemimpin oposisi secara tiba-tiba.\nSetelah diadili dengan cepat, perwira Carabineros José Galánfor dihukum karena pengkhianatan dan eksekusi publiknya dilakukan segera setelahnya. Meskipun hal ini dimaksudkan sebagai upaya untuk menghilangkan keinginan untuk menolak kebangkitan Nasionalis Spanyol, hal ini mempunyai efek sebaliknya. Relawan sayap kiri dan bahkan sekelompok jenderal telah berbondong-bondong mengibarkan bendera Tentara Rakyat yang baru dibentuk, siap mendukung perjuangan melawan kaum Nasionalis yang menindas. Meskipun sebagian besar dari mereka kurang terlatih, mereka berhasil merebut beberapa kota penting dalam kekacauan yang terjadi setelah pemberontakan.\n\nGaris pertempuran telah ditentukan - faksi manakah yang harus kita dukung?"
 spain.10.b: "Tentara Rakyat!"
 nationalists_chosen: "Kematian bagi Rojo!"
 republicans_chosen: "Kematian bagi kaum Falangis!"
 spain.2.t: "Mencari Dukungan Internasional?"
 spain.2.d: "Kudeta ini belum sepenuhnya berhasil, namun kaum Carlist, Falangis, dan Konfederasi Hak Otonom (CEDA) telah berhasil memobilisasi sebagian besar tentara untuk menggulingkan Republik, yang telah terlalu lama membiarkan bangsa Kristen kita yang bangga ini terjerumus ke dalam anarki. Hasil akhirnya masih belum pasti, sementara dunia memperhatikan dengan cemas pihak mana yang akan keluar sebagai pemenang.\n\nNamun, kita tidak melancarkan kudeta ini hanya untuk berpangku tangan, begitu pula dunia jika ingin menghancurkan ancaman merah. Negara-negara lain yang tengah berjuang memulihkan kejayaan nasional mereka semestinya bersedia datang membantu kita."
 spain.2.a: "Ayo minta peralatan dan amunisi."
 spain.2.b: "Spanyol harus dimenangkan dengan darah Spanyol!"
 spain.3.d: "Kekuatan reaksioner dan fasis di kalangan militer berupaya menghancurkan Republik dengan satu pukulan cepat, namun mereka tidak menyangka akan adanya perlawanan yang mereka temui di kota-kota besar maupun mobilisasi cepat milisi buruh. Daripada melakukan kudeta, mereka malah memulai perang, perang demi kemajuan dan masa depan yang diinginkan rakyat Spanyol.\n\nNegara-negara demokratis dan sosialis sama-sama menyuarakan dukungannya terhadap Republik, namun hanya sedikit yang berani berkomitmen untuk terlibat langsung. Kita bisa meminta mereka untuk mendukung upaya kita, atau para penindas akan datang untuk menuntut kebebasan dan solidaritas mereka."
 spain.3.a: "Ini adalah perjuangan internasional untuk membendung fasisme!"
 spain.3.b: "Kita tidak akan menjadi boneka negara-negara buruh yang mengalami kemerosotan!"
 spain.4.t: "Spanyol Nasionalis Meminta Bantuan Kita"
 spain.4.d: "Perang Saudara Spanyol telah menjadi semacam mikrokosmos dari pandangan kita terhadap situasi global: kaum Komunis dan liberal berupaya menghancurkan nilai-nilai lama, dan kita mengangkat senjata untuk membangkitkannya kembali. Tidaklah mengherankan jika kaum Nasionalis di Spanyol telah menghubungi kita dan pihak lain untuk melengkapi persenjataan mereka demi konflik yang kian mendekat."
 spain.4.a: "Kami berjanji untuk mengirimkan apa yang kami bisa."
 spain.4.b: "Jika mereka tidak mempunyai kekuatan untuk merebut kekuasaan, mereka tidak pantas mendapatkannya."
 spain.5.t: "Spanyol Republikan Meminta Bantuan Kita"
 spain.5.d: "Upaya untuk menggulingkan Republik Spanyol Kedua adalah sinyal nyata bahwa kaum fasis tidak akan membiarkan bunga kemajuan berkembang bahkan di tempat ia berakar secara alami. Kaum Republikan dan sekutunya—campuran kaum demokrat, komunis, dan anarkis—telah berpaling kepada kita dan komunitas internasional lainnya untuk memohon bantuan. Banyak negara yang mengaku membela demokrasi dan kebebasan justru menahan dukungan mereka karena takut terseret ke dalam perang. Bagaimana kita menanggapinya?"
 spain.5.a: "Berjanjilah pada mereka untuk mengirimkan senjata dan peralatan."
 spain.4.a.tt: "[From.GetName] akan berterima kasih jika kita mengatur pinjam-sewa selama perang."
 spain.5.b: "Sayangnya, kita tidak bisa melakukan intervensi."
 spain.6.t: "Spanyol Nasionalis Menghargai Bantuan Kita"
 spain.6.d: "Bantuan pinjam-sewa kita kepada Spanyol Nasionalis tidak luput dari perhatian. Jika mereka keluar sebagai pemenang, kita mungkin akan memiliki sekutu yang kuat setelah Spanyol dibangun kembali."
 spain.6.a: "Mari kita berharap mereka bisa membendung teror Merah."
 spain.7.t: "Spanyol Republikan Menghargai Bantuan Kita"
 spain.7.d: "Bantuan pinjam-sewa kita kepada Spanyol Republikan tidak luput dari perhatian. Jika Republik pulih, kita dapat meyakini bahwa mereka akan mendukung upaya berkelanjutan kita untuk membersihkan dunia dari sampah fasis."
 spain.7.a: "Hidup Republik!"
 spain.8.t: "Madrid Direbut Kembali"
 spain.8.d: "Perang telah dimenangkan. Madrid kembali menjadi milik kita dan kita memiliki kesempatan untuk menjadikan kota kuno ini sebagai pusat Spanyol sekali lagi. Kota ini telah menyaksikan begitu banyak pertempuran dan membutuhkan pembangunan kembali. Adakah cara yang lebih baik untuk mewujudkannya selain menjadikannya ibu kota kita?"
 spain.8.a: "Pindahkan ibu kota ke Madrid"
 spain.8.b: "Pertahankan lokasi saat ini"
 spain.9.t: "Pemilu Spanyol 1936"
 spain.9.d: "Republik Kedua terbukti sangat rentan. [Root.GetLeader] dapat menjadi presiden dengan dukungan Front Populer, sebuah koalisi luas kelompok sayap kiri yang disokong oleh kaum republikan, komunis, dan anarkis.\n\nNamun, oposisi sayap kanan—yang mencakup kaum konservatif, monarkis, dan fasis—juga mulai bersatu demi menumbangkan Front Populer. Koalisi mana pun yang runtuh, lawan mereka kemungkinan besar akan memanfaatkan perselisihan internal tersebut untuk melancarkan revolusi. Pemilu ini bukanlah ujian terakhir yang harus dilalui Spanyol demi menuntaskan konflik ini."
 spain.9.a: "Pertahankan Front Populer."
 spain.9.b: "Satukan kelompok konservatif di bawah Falange."
 italy.9.t: "Meminta Kepulauan Balearik dari Spanyol"
 italy.9.d: "Selama perang saudara, Italia menawarkan sukarelawan untuk berjuang demi perjuangan nasionalis. Meskipun motivasi ideologis adalah yang terpenting, Italia juga memiliki kepentingan strategis terhadap hasil akhir perang. Pertahanan Kepulauan Balearik, khususnya Mallorca, memiliki arti penting khusus bagi Italia karena posisinya di Laut Mediterania, terutama yang berkaitan dengan koloni-koloni Eropa barat.\n\nKini, [From.GetLeader] telah menyarankan agar pulau-pulau tersebut dialihkan ke kendali Italia secara permanen. Menimbang kontribusi mereka terhadap kemenangan kita, saran tersebut mungkin ada benarnya."
 italy.9.a: "Biarkan Italia mempertahankan apa yang mereka pertahankan."
 italy.9.b: "Kami tidak memenangkan perang ini untuk tunduk pada tuntutan asing!"
 italy.10.t: "Spanyol Menyerahkan Kepulauan Balearik"
 italy.10.d: "Sebagai wujud terima kasih atas dukungan dan pembelaan kita terhadap perjuangan fasis selama Perang Saudara Spanyol, [From.GetLeader] telah setuju untuk menjadikan instalasi militer sementara kita di Mallorca, Menorca, dan Ibiza bersifat permanen. Meskipun kepulauan dengan posisi strategis yang penting ini merupakan tambahan yang berharga bagi imperium kita, tampaknya pihak Spanyol kini menganggap hutang budi tersebut telah terbayar lunas."
 italy.10.a: "Asalkan mereka mengakui kita sebagai pemilik yang sah."
 italy.11.t: "Spanyol Menolak Menyerahkan Kepulauan"
 italy.11.d: "Terlepas dari bantuan yang kita berikan kepada mereka dalam perang saudara, [From.GetLeader] kini menolak untuk menyerahkan Kepulauan Balearik kepada kita, yang dulu diperjuangkan dan dipertahankan oleh rekan-rekan sebangsa kita. Meskipun mereka bersikukuh berupaya menjaga hubungan baik dengan bangsa kita, memaksa kita menarik instalasi militer yang sejak awal mempertahankan pulau-pulau ini tetap menjadi milik Spanyol adalah penghinaan yang tidak akan kita lupakan."
 italy.11.a: "Jika diperlukan, kami mungkin akan tetap mengklaimnya."
 italy.12.t: "Konferensi London"
 italy.12.d: "Sahabat-sahabat kita di Yugoslavia telah mendapat tekanan dari tetangga utara kita. Negara-negara barat yang korup dan dekaden telah memperlihatkan mengapa mereka kian memudar dengan kegagalan mereka membela hak-hak Yugoslavia. Ini bisa menjadi celah yang tepat bagi kekuatan yang lebih muda dan lebih dinamis, yang memiliki kepemimpinan yang tepat untuk melangkah dengan mantap di panggung dunia! Comando Supremo melaporkan bahwa mereka hampir siap untuk melepaskan legiun-legiun kita yang tak terkalahkan."
 italy.12.a: "Ini adalah waktu kita!"
 italy.12.b: "Akan ada peluang yang lebih baik."
 italy.13.t: "Keputusan Arbitrase Ljubljana Pertama"
 italy.13.d_dalmatia_montenegro: "Seiring runtuhnya negara Yugoslavia di bawah kontradiksinya sendiri, inilah saatnya bagi Italia untuk mengambil haknya. Kekuatan-kekuatan Barat yang kian meredup mungkin begitu gentar terhadap Italia hingga mereka menolak memberikan haknya, namun kekuatan-kekuatan baru sedang bangkit dan melihat nilai sejati Italia. Kita tidak hanya mengamankan apa yang sempat dinafikan dari kita dalam Kemenangan yang Dimutilasi (Vittoria Mutilata), tetapi protektorat kita di Albania pun turut menyaksikan wilayahnya bertambah luas."
 italy.13.d_montenegro: "Keputusan kami untuk menyelaraskan diri dengan kebangkitan kekuatan Jerman telah membuahkan hasil. Negara Yugoslavia sedang menuju pembubaran dan kepemimpinan Jerman memiliki pandangan ke depan untuk melihat manfaat dari persahabatan Italia. Montenegro akan diserahkan ke Albania sebagaimana mestinya"
 italy.13.d_dalmatia: "Setelah pengkhianatan mantan sekutu kita di barat dalam konferensi perdamaian Paris, di mana kita dijanjikan Dalmatia utara, kita memilih untuk menyelaraskan diri dengan Berlin. Jerman dengan bijak menilai bahwa persahabatan dengan Italia terlalu berharga untuk diabaikan, dan klaim kita di Yugoslavia akhirnya diakui. Laut Adriatik akan menjadi danau milik Italia dan keadilan akan ditegakkan."
 italy.13.a: "Italia Bangkit"
 italy.14.t: "Jerman Menggagalkan Tuntutan Kita"
 italy.14.d: "Jerman merasa berhak menggagalkan tuntutan kita yang bersahaja, adil, dan masuk akal atas wilayah Vichy. Haruskah kita meninggalkan [From.GetFactionName]?"
 italy.14.a: "Tidak dapat diterima. Kita bisa melakukan yang lebih baik sendirian"
 italy.14.b: "Kita akan earn their respect"
 italy.15.t: "Jerman Mendukung Tuntutan Kita"
 italy.15.d: "Jerman telah melihat kebijaksanaan dalam mendukung tuntutan kita atas wilayah Vichy. Vichy telah menyerahkan Savoy dan Korsika kepada kita."
 italy.15.d_Corsica: "Dengan sedikit dukungan dari Jerman, Vichy telah menyerahkan Korsika kepada kita."
 italy.15.a: "Balas dendam untuk Italia"
 italy.16.t: "Jerman Nyaris Mendukung Kita"
 italy.16.d: "Jerman merasa perlu mencampuri sengketa kita dengan Prancis Vichy. Mereka telah memblokir upaya kita untuk memperoleh Korsika, tetapi kita masih mendapatkan Savoy."
 italy.16.a: "Pertanyaan Korsika Hanya Ditunda"
 france.1.t: "Jepang Menuntut Indocina"
 france.1.d: "Pasukan Jepang telah bersiaga di sepanjang perbatasan koloni kita di Indocina, dan mereka menuntut akses penuh terhadap pangkalan-pangkalan dan fasilitas kita! Jika kita menyetujui permintaan mereka, kita secara efektif menyerahkan kendali atas Indocina kepada mereka. Di sisi lain, kita tidak memiliki sarana yang memadai untuk melawan mereka dalam masalah ini."
 france.1.a: "Kami tidak punya pilihan selain setuju."
 france.1.b: "Tidak akan pernah!"
 france.2.t: "Perluasan Garis Maginot"
 france.2.d: "Rencana perluasan Garis Maginot hingga ke Selat Inggris telah rampung, dan perintah pembangunan telah dikeluarkan. Pihak Belgia telah melayangkan protes resmi setelah melihat persiapan kita dari seberang perbatasan, namun pekerjaan tetap berlanjut."
 france.2.a: "Mungkin mereka seharusnya tidak meninggalkan aliansi kita."
 france.3.t: "Perluasan Garis Alpen"
 france.3.d: "Kita telah memulai pekerjaan untuk meningkatkan benteng pertahanan Garis Alpen. Ketika pertahanan baru ini selesai, pihak Italia pastilah sudah gila jika berani melintasi perbatasan!"
 france.3.a: "Biarkan mereka datang!"
 france.10.t: "Kekalahan"
 france.10.d: "Pertempuran telah kalah. Paris telah jatuh ke tangan Jerman, dan hanya tinggal menunggu waktu sebelum sisa wilayah negeri ini diduduki. Kita kini harus memikirkan masa depan. Sejumlah elemen di dalam pemerintahan menghendaki gencatan senjata dengan Jerman, namun banyak perwira ingin melanjutkan perjuangan dari Inggris.\n\nAnggota tertentu dari Kabinet Perang Britania telah menyarankan opsi lain — penggabungan Prancis dan Britania Raya menjadi satu negara tunggal, yang akan terus berjuang hingga seluruh wilayah Prancis berhasil dibebaskan."
 france.10.a: "Kita harus berkolaborasi dengan Jerman."
 france.10.a_tt: "§YBermain sebagai Vichy Perancis jika Jerman memberikan gencatan senjata§!"
 france.10.b: "Pertarungan berlanjut!"
 france.10.b_tt: "§YBermain sebagai Prancis jika Jerman menyetujui gencatan senjata§!"
 france.10.c: "Mari kita bergabung dengan Inggris!"
 france.11.t: "Prancis Mengusulkan Persatuan"
 france.11.d: "Situasi di Prancis sangat genting. Banyak pihak di pemerintahan mereka ingin mengupayakan gencatan senjata dengan Jerman, tetapi beberapa pihak merespons positif usulan dari anggota Kabinet Perang Britania untuk menggabungkan kedua negara kita menjadi satu. Uni Prancis-Britania ini akan melanjutkan perang melawan Jerman hingga kemenangan tercapai. Bagaimana kita harus merespons?"
 france.11.a: "Tidak. Inggris adalah Inggris, dan Prancis adalah Prancis."
 france.11.b: "Ya, jika itu bisa membuat Prancis tetap berjuang!"
 france.12.t: "Britania Menyetujui Persatuan"
 france.12.d: "Britania telah setuju untuk menggabungkan kedua negara kita menjadi satu. Bahkan saat ini, sebuah pemerintahan bersama yang baru sedang dibentuk di London."
 france.12.a: "Ke London!"
 FRA_franco_british_cores: "Semua §Y[FRA.GetAdjective] core§! menjadi §Y[ENG.GetAdjective] core§!."
 france.13.t: "Britania Menolak Persatuan"
 france.13.d: "Pemerintah Britania telah menolak segala kemungkinan untuk menggabungkan kedua negara kita menjadi satu. Gencatan senjata dengan Jerman pada saat ini tidak dapat dihindarkan."
 france.13.a: "Kita harus collaborate."
 france.13.b: "Kita harus melanjutkan perjuangan!"
 france.14.t: "Kejayaan di Prancis"
 france.14.d: "Kemenangan kita di Prancis hampir tuntas. Pemerintah Prancis telah meminta gencatan senjata, dan diplomat kita telah menyiapkan syarat-syarat yang telah mereka setujui. Mereka akan mempertahankan kendali atas Prancis selatan, sementara kita bebas menduduki sisanya."
 france.14.a: "Mendirikan Vichy Prancis."
 establishing_vichy_tt: "§YVichy France§! akan didirikan di Prancis selatan.\n§YVichy Perancis§! akan memperoleh seluruh §Ywilayah kolonial Perancis§!\nPersentase pasukan §YPerancis§! akan dipindahkan ke §YVichy Perancis§!\n(§YVichy Perancis§!):\n§YMouvement Franciste§! menjadi partai yang berkuasa.\n§YPhilippe Pétain§! menjadi pemimpin partai §YFasis§!.\nMenambah Semangat Kebangsaan §YBiaya Pekerjaan§!, yang memberikan hibah (Pabrik Barang Konsumsi: §Y20%§!)\nMemindahkan modal ke §YAuvergne§!"
 france.14.b: "Tidak, Jerman akan menaklukkan semuanya!"
 france.14.c: "Mendirikan Bourbon Prancis."
 france.15.t: "Jerman Menolak Gencatan Senjata!"
 france.15.d: "Jerman telah menolak permintaan gencatan senjata kita! Mereka jelas-jelas berniat memperbudak kita semua... kita tidak punya pilihan selain bertempur hingga titik darah penghabisan!"
 france.15.a: "Kita ditakdirkan!"
 france.16.t: "Tetap Bersatu, Tetap Kuat!"
 france.16.d: "Mengingat peristiwa baru-baru ini di Paris telah berdampak pada sebagian besar dari kita, kini menjadi semakin penting daripada sebelumnya bagi kita untuk bersatu padu sebagai sebuah bangsa. Kita harus melihat kondisi negara kita bukan untuk menyerah pasrah, melainkan untuk mengubah hasil akhir perang ini.\n\nLupakan masa lalu dan tataplah cakrawala baru. Kita tidak tahu apa yang akan terjadi dalam bulan-bulan mendatang, tetapi kita akan menghadapinya bersama-sama!"
 france.16.a: "Kami telah melihat yang lebih buruk!"
 france.17.t: "Undangan ke Faksi Prancis"
 france.17.d: "Dalam upaya memperkuat Entente Kecil — Cekoslowakia, Yugoslavia, dan Rumania — serta membendung kemungkinan bangkitnya kembali ekspansionisme agresif dari pihak Kekuatan Poros Tengah lama, Prancis telah meminta agar kita bergabung bersama mereka dalam aliansi yang bertujuan menyatukan bangsa-bangsa ini."
 france.17.a: "Dengan senang hati. Entente Kecil perlu dibangun kembali."
 france.17.b: "[Root.GetName] berjalan di jalurnya sendiri."
 france.18.t: "[From.GetName] Bergabung dengan Faksi Prancis"
 france.18.d: "Rencana kita untuk mencegah aliansi Entente Kecil terpecah dan menjauh dari kita tengah mengalami kemajuan. [From.GetLeader] menyetujui upaya kita dan telah menerima undangan kita untuk bersekutu."
 france.18.a: "Kami selangkah lebih dekat untuk membangun kembali Entente Kecil."
 france.19.t: "[From.GetName] Menolak Aliansi Prancis"
 france.19.d: "Terlepas dari upaya terbaik kita untuk menawarkan dukungan kepada Entente Kecil, pendekatan terbaru kita ke salah satu negara tersebut disambut dengan skeptisisme. [From.GetLeader] telah menolak bergabung dengan aliansi, barangkali meragukan motif kita, atau cemas bahwa bersekutu terlalu erat dengan kita akan menjadikan mereka sasaran empuk."
 france.19.a: "Mereka sudah bisa menjadi target dari semua yang mereka tahu!"
 france.20.t: "Perlawanan terhadap gencatan senjata"
 france.20.d: "Setelah gencatan senjata Prancis dengan Jerman dan pembentukan pemerintahan baru di Vichy Prancis, sekelompok perwira senior memberontak melawan pemerintahan baru Prancis. Charles de Gaulle menyampaikan siaran radio yang mendesak perlawanan terhadap rezim kolaborasionis Vichy. De Gaulle secara efektif mengambil alih kepemimpinan Pasukan Prancis Merdeka dan melanjutkan perjuangan melawan Jerman."
 france.20.a: "Perjuangan untuk Prancis terus berlanjut."
 france.20.a_tt: "§YCharles de Gaulle menjadi pemimpin Perancis§!"
 france.21.t: "Buruh Mengancam dengan Mogok Kerja"
 france.21.d: "Menyusul pemecatan dua pekerja di sebuah pabrik besar, pertikaian antara pekerja dan pemilik pabrik terjadi di seluruh negeri. Para pekerja yang didukung oleh [Root.GetCommunistParty] telah mengorganisir dan menuntut kondisi yang lebih baik, seperti upah yang lebih tinggi dan minggu kerja yang lebih pendek. Hal ini akan sangat mengurangi output pabrik kita dan dipandang sebagai kemenangan bagi [Root.GetCommunistParty]. Kami diundang ke Matignon untuk negosiasi. Apakah kita menuruti tuntutan mereka atau tetap teguh dan mengambil risiko terjadinya pemogokan di seluruh negeri?"
 france.21.a: "Biarkan mereka menyerang"
 france.21.b: "Negosiasikan kesepakatan"
 france.22.t: "Meninjau Kembali Perjanjian Matignon"
 france.22.d: "Dengan perjanjian Matignon yang ditandatangani baru-baru ini, industri kami tidak dapat bersaing dengan Jerman. Kami semakin tertinggal dalam kapasitas produksi dari hari ke hari. Beberapa pemilik pabrik sudah mulai menegosiasikan kembali beberapa hak yang diberikan dalam Perjanjian Matignon, tanpa ada perlawanan dari para pekerja. Kita mempunyai peluang untuk secara resmi mencabut hak-hak pekerja yang baru diperoleh di seluruh negeri, namun ada risiko mereka akan kembali mendukung [Root.GetCommunistParty], dengan harapan mereka akan kembali melakukan pemogokan. Membiarkan para pekerja mempertahankan hak-hak mereka dan fokus pada optimalisasi alur kerja saat ini dapat membantu menyatukan kembali masyarakat Prancis dan membuat kita tumbuh bersama."
 france.22.a: "Seiring waktu kita akan menjadi seefisien sebelumnya"
 france.22.b: "Cabut hak mereka dan segera kembalikan industri kita ke jalurnya"
 france.23.t: "Pemogokan Berakhir"
 france.23.d: "Sebagian besar pekerja kini menyadari bahwa tuntutan mereka yang tidak masuk akal tidak akan dipenuhi. Anak-anak mereka kelaparan dan meskipun [Root.GetCommunistParty] mendesak mereka untuk melanjutkan pemogokan, mereka tidak memiliki sumber daya untuk melanjutkan pemogokan. Setiap hari para pekerja menyerah dan kembali ke pabrik. Industri kami akan kembali ke kapasitas penuh dan kecil kemungkinannya kami akan melakukan pemogokan dalam waktu dekat."
 france.23.a: "Akhirnya kita bisa berkompetisi lagi"
 france.24.t: "Ancaman Komunis"
 france.24.d: "Ancaman yang ditimbulkan oleh bersatunya Jerman dan Soviet terlalu besar untuk diabaikan. Menyusul kesepakatan kedua negara untuk membagi Polandia, kita dihadapkan pada pilihan yang sulit. Jika kita membiarkan [Root.GetCommunistParty] beroperasi seperti biasa, kita membuka diri terhadap perpecahan internal seiring berkembangnya kekuatan Soviet. Dengan melarang segala aktivitas komunis atau afiliasi dengan [Root.GetCommunistParty], kita mengirimkan sinyal kuat kepada seluruh warga negara bahwa kita tidak akan menoleransi siapa pun yang menjadi ancaman bagi perdamaian.\nSecara tradisional kita mampu melibatkan [Root.GetCommunistParty] dalam diskusi politik, namun karena mereka menolak melepaskan kesetiaan mereka kepada Moskwa, mungkin sudah saatnya mengambil tindakan drastis."
 france.24.a: "Melarang komunisme di Perancis"
 france.24.b: "Perbedaan pendapat adalah bagian dari proses demokrasi"
 france.25.t: "Konferensi London"
 france.25.d: "Dengan rezim di Berlin yang semakin meningkatkan ketegangan atas perbatasan antara mereka dan Yugoslavia, pihak Britania telah memilih untuk mengalah. Namun, Yugoslavia adalah salah satu dari tiga pilar tempat tatanan Eropa Timur dibangun. Jika pilar tersebut melemah, keamanan Prancis akan terancam. Haruskah kita membuktikan bahwa kitalah kekuatan yang lebih besar dan mengambil risiko bertempur sendirian?"
 france.25.a: "Kami akan menjaga perdamaian"
 france.25.b: "Kita akan stand for liberty"
 france.26.t: "Konferensi London"
 france.26.d: "Dengan rezim di Berlin yang semakin meningkatkan ketegangan atas perbatasan antara mereka dan Yugoslavia, pihak Britania telah mengambil keputusan untuk berdiri melawan agresi Jerman. Namun luka dari perang terdahulu belum sepenuhnya sembuh dan negara kita terpecah belah secara mendalam, apakah kita cukup kuat untuk melangkah sendirian?"
 france.26.a: "Sudah waktunya untuk melawan Jerman"
 france.26.b: "Ini adalah penyebab yang salah"
 france.27.t: "Jerman Mendukung Tuntutan Italia"
 france.27.d_1_state: "Jerman telah menyetujui tuntutan Italia atas wilayah kita. Setelah kekalahan kita, kita benar-benar tidak berada dalam kondisi untuk menentangnya."
 france.27.d_both: "Italia akan diberikan Savoy dan Corsica. Keputusan Jerman ini menimbulkan kekhawatiran para gubernur kolonial yang bertanya-tanya siapa yang akan menjadi penerus mereka. Gubernur Suriah tidak menunggu untuk mengetahuinya dan telah membelot ke Free France."
 france.27.a: "Kami sebenarnya tidak punya pilihan."
 france.27.b: "Orang-orang Jerman adalah orang-orang bodoh yang berpandangan pendek"
 france.28.t: "Suriah Membelot"
 france.28.d: "Menyusul keputusan Jerman untuk memberikan wilayah Vichy kepada Italia, pemerintahan Suriah telah memilih untuk bergabung ke pihak kita."
 france.28.a: "Prancis selangkah lebih dekat menuju penebusan"
 france.29.t: "Britania Menerima Permintaan Sekutu"
 france.29.d: "'Sejarah telah membuktikan betapa banyak hal yang dapat dicapai ketika bangsa-bangsa besar kita berdiri berdampingan. Dalam semangat Entente Cordiale, kami bangga menyambut Anda bukan hanya sebagai sahabat, tetapi sebagai Sekutu. Bersama-sama kita akan menjadi mercusuar kebebasan yang bersinar di dunia yang diselimuti oleh kegelapan penindasan!'\n\nPermintaan kita untuk bergabung dengan Britania sebagai Sekutu telah diterima. Kita dapat mengandalkan dukungan penuh mereka di masa-masa penuh gejolak di depan."
 france.29.a: "Bersama-sama kita akan mempertahankan garisnya!"
 france.30.t: "Britania Menolak Permintaan Sekutu"
 france.30.d: "'Meskipun kita telah menikmati hubungan baik di masa lalu, kita tidak dapat mengambil risiko eskalasi konflik di seberang selat. Jerman telah mendapatkan kepercayaan kita dalam menepati Pakta Angkatan Laut kita, dan meskipun kita akan membela diri jika kobaran api menyebar, kita tidak akan mengambil risiko mengipasi api tersebut. Perdamaian harus selalu menjadi tujuan dari setiap bangsa yang demokratis.'\n\nPermintaan kita untuk bergabung dengan Britania sebagai Sekutu telah ditolak. Pemerintah Britania tidak bersedia memusuhi Jerman lebih jauh, dan tidak akan membahayakan perdamaian saat ini."
 france.30.a: "'Kedamaian' mereka hanyalah kata lain dari 'penyerahan'"
 france.33.title: "Pembebasan Prancis"
 france.33.desc: "Dengan berakhirnya perang, kebutuhan untuk mempertahankan persatuan erat dengan bangsa Prancis pun mulai surut. Partai-partai politik Prancis semakin gencar menyerukan pembentukan pemerintahan sementara dan pemilihan umum."
 france.33.a: "Tentu saja, sekutu setia kita adalah orang-orang yang bebas."
 france.33.b: "Kita perlu menjaga keamanan yang ketat di daratan."
 france.34.title: "Uni Prancis-Britania Berakhir"
 france.34.desc: "Dengan tercapainya perdamaian bagi Britania, [From.GetLeader] telah menyetujui permintaan partai-partai politik Prancis untuk memulihkan pemerintahan sementara Prancis. Integrasi politik mereka telah dihentikan, namun tidak diragukan lagi kedua bangsa akan terus menjadi sahabat dekat di masa depan."
 france.34.a: "Bagus sekali!"
 france.34.b: "Saya mengerti."
 low.1.t: "Prancis Memperpanjang Garis Maginot"
 low.1.d: "Pihak Prancis telah memutuskan untuk memperpanjang Garis Maginot ke arah barat hingga ke Selat Inggris! Hal ini secara gamblang menunjukkan niat mereka untuk menelantarkan kita jika terjadi invasi Jerman. Kedutaan kita di Paris telah mengajukan nota protes resmi, tetapi diragukan apakah hal itu akan memberi dampak berarti."
 low.1.a: "Ini sungguh keterlaluan!"
 soviet.1.t: "Pengerahan Pasukan Jepang"
 soviet.1.d: "Ketegangan di sepanjang perbatasan Manchuria telah berlangsung cukup lama, dan kini kita menerima laporan dari kawan-kawan Mongolia kita bahwa pihak Jepang sedang memusatkan pasukan di Heilungkiang. Mundur dapat dianggap sebagai tanda kelemahan, tetapi jika kita menanggapi dengan kekuatan militer, situasinya dapat meningkat. Apa perintah Anda, tovarisch komandir?"
 soviet.1.a: "Kami mendorong kembali. Keras."
 soviet.1.b: "Kita tidak bisa berperang dengan Jepang."
 soviet.2.t: "Serbuan Berhasil"
 soviet.2.d: "Serbuan kita melintasi perbatasan Manchuria terhadap pasukan Jepang yang berkumpul di sana membuahkan keberhasilan! Kita menyergap mereka sebelum mereka menyelesaikan persiapannya, dan prajurit kita yang gagah berani memberi mereka pukulan telak dalam pertempuran sengit yang terjadi."
 soviet.2.a: "Bagus sekali!"
 soviet.3.t: "Serbuan Gagal"
 soviet.3.d: "Serbuan kita melintasi perbatasan Manchuria terhadap pasukan Jepang yang berkumpul di sana mengalami kegagalan! Musuh menjepit pasukan kita dalam gerakan capit dan kita menderita korban jiwa yang berat sebelum berhasil menarik diri."
 soviet.3.a: "Siapkan regu tembak."
 soviet.4.t: "[FROM.GetNameDefCap] Menyerahkan Bessarabia"
 soviet.4.d: "Pihak [FROM.GetAdjective] dengan bijak tunduk pada tuntutan kita dan telah menarik seluruh pasukan mereka dari Bessarabia. Kita akan menggabungkan wilayah tersebut ke dalam persatuan sebagai Republik Sosialis Soviet Moldavia. Rakyatnya kini akan menikmati manfaat sosialisme."
 soviet.4.a: "Luar biasa."
 soviet.5.t: "Rumania Menolak Tuntutan Kita"
 soviet.5.d: "Pihak Rumania menolak untuk tunduk pada tuntutan kita! Tampaknya kita harus mengusir pasukan pendudukan mereka dari Bessarabia dengan kekuatan senjata."
 soviet.5.a: "Orang-orang bodoh!"
 soviet.6.t: "[FROM.GetNameDefCap] Tunduk"
 soviet.6.d: "[FROM.GetNameDefCap] telah menyerah pada tuntutan kita. Kita telah mengganti pemerintahan dekaden di Tallinn dengan Parlemen Rakyat, yang secara bulat telah memilih untuk mengubah [FROM.GetNameDef] menjadi Republik Sosialis Soviet. Setelah pertimbangan seksama, Majelis Soviet Tertinggi memutuskan untuk menerima permohonan ini."
 soviet.6.a: "Selamat datang di serikat pekerja, kawan."
 soviet.7.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 soviet.7.d: "[FROM.GetNameDefCap] secara keterlaluan telah memutuskan untuk menolak tawaran murah hati kita mengenai pakta bantuan timbal balik! Kaum kapitalis dan penjilat di Tallinn bahkan lancang mengeluarkan pernyataan yang menuntut agar kita menghormati integritas wilayah bangsa mereka!"
 soviet.7.a: "Kita harus melindungi [FROM.GetAdjective] dari diri mereka sendiri."
 soviet.8.t: "[FROM.GetNameDefCap] Tunduk"
 soviet.8.d: "Pemerintah [FROM.GetAdjective] di Riga telah menyetujui tuntutan kita, dan kita telah menggantikan kekuasaan korup mereka dengan Majelis Rakyat. Lembaga ini secara bulat telah memilih untuk mengajukan keanggotaan ke dalam serikat agung kita sebagai Republik Sosialis Soviet. Dengan senang hati kita menyetujui pemenuhan permohonan ini."
 soviet.8.a: "Anda adalah sosialis sekarang!"
 soviet.9.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 soviet.9.d: "Kaum penindas borjuasi yang berkuasa [FROM.GetNameDef] telah memilih untuk mengabaikan semua alasan. Mereka menolak pakta bantuan timbal balik yang murah hati, dan menuntut penarikan segera seluruh pasukan Soviet yang 'berkumpul' di sepanjang perbatasan mereka."
 soviet.9.a: "Rakyat [FROM.GetAdjective] harus dibebaskan."
 soviet.10.t: "[FROM.GetNameDefCap] Tunduk"
 soviet.10.d: "Permintaan kita untuk pangkalan militer di [FROM.GetNameDef] telah dikabulkan, namun sayangnya pemerintah mereka telah runtuh. Kita telah membentuk Parlemen Rakyat untuk menghindari anarki, dan mereka secara bulat telah memilih untuk memohon keanggotaan dalam persatuan kita kepada Majelis Soviet Tertinggi. Permohonan ini telah dikabulkan."
 soviet.10.a: "Kita akan save you from capitalism."
 soviet.11.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 soviet.11.d: "[FROM.GetNameDefCap] tampaknya bertekad untuk menghancurkan diri sendiri, dan orang-orang bodoh di pemerintahan mereka menolak akses pasukan kita ke negara mereka. Apakah mereka pikir keadaan mereka akan lebih baik di bawah pemerintahan Jerman? Para pemimpin mereka yang egois melakukan kejahatan terhadap rakyat dengan menolak sosialisme sejati bagi warga negara mereka."
 soviet.11.a: "Masyarakat [FROM.GetAdjective] sudah cukup menderita."
 soviet.12.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 soviet.12.d: "Pasukan luar biasa besar yang kita kerahkan di sepanjang perbatasan telah meyakinkan pemerintah [FROM.GetAdjective] untuk menerima permintaan sederhana kita perihal revisi perbatasan mereka. Kita telah memperoleh kendali atas Karelia, dan posisi [195.GetName] kini jauh lebih aman."
 soviet.12.a: "Kami berharap mereka akan melakukan perlawanan..."
 soviet.13.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 soviet.13.d: "Pemerintah [FROM.GetAdjective] telah menolak tuntutan kita, tetapi hal ini sudah diperkirakan. Jika kita menginginkan Karelia, kita harus merebutnya dengan kekerasan. Sudah saatnya memberi bangsa Finlandia yang keras kepala sebuah pelajaran yang tidak akan mereka lupakan!"
 soviet.13.a: "Kami akan menghancurkan mereka dalam beberapa minggu."
 soviet.14.t: "Keanggotaan dalam Uni Soviet"
 soviet.14.d: "Kita berada di bawah tekanan dari Moskwa untuk secara resmi bergabung dengan Uni Soviet. Haruskah kita menyetujuinya?"
 soviet.14.a: "Ya, mari kita bergabung dengan mereka."
 soviet.14.b: "Tidak, kami belum mencapai potensi penuh kami!"
 soviet.15.t: "Tannu Tuva Menolak!"
 soviet.15.d: "Rakyat Tuva secara memalukan menolak bergabung dengan Uni Soviet! Apa yang mungkin diharapkan dapat dicapai oleh bangsa yang menyedihkan seperti itu seorang diri adalah sebuah misteri yang mungkin tidak akan pernah terjawab."
 soviet.15.a: "Semoga sukses untuk mereka."
 soviet.16.t: "Anekshasi Tannu Tuva"
 soviet.16.d: "Majelis Soviet Tertinggi telah menerima permintaan resmi dari parlemen Tuva untuk keanggotaan dalam Uni Soviet. Mereka akan diorganisasikan sebagai Oblast Otonom Tuva di dalam RSFSR Rusia."
 soviet.16.a: "Selamat datang di serikat pekerja, kawan."
 soviet.17.t: "Menyempurnakan Garis Stalin"
 soviet.17.d: "Revisi menyeluruh terhadap benteng pertahanan di sepanjang wilayah perbatasan barat kami telah selesai, dan para narapidana dari kamp kerja paksa kami siap untuk mulai bekerja. Tak lama lagi, Garis Stalin akan sesuai dengan namanya yang gemilang!"
 soviet.17.a: "Kamerad Stalin akan bangga!"
 soviet.60.t: "Pembagian Polandia"
 soviet.60.d: "Polandia kini milik kita, namun bagian barat berada di bawah zona pengaruh [GER.GetAdjective] sesuai ketentuan Pakta Molotov-Ribbentrop. Haruskah kita menarik pasukan kita dan membiarkan pihak [GER.GetAdjective] menduduki wilayah ini? Kegagalan melakukan hal tersebut akan membatalkan perjanjian kita."
 soviet.60.a: "Ya. Sekarang bukan waktunya untuk melanggar perjanjian."
 soviet.60.b: "Tidak! Seluruh Polandia adalah milik Tanah Air!"
 soviet.61.t: "Soviet Menghormati Pakta"
 soviet.61.d: "Sesuai dengan perjanjian, pihak [SOV.GetAdjective] telah menyerahkan wilayah barat Polandia kepada administrasi kita. Pasukan Jerman telah masuk untuk menjamin keamanan."
 soviet.61.a: "Luar biasa."
 soviet.62.t: "Soviet Melanggar Pakta"
 soviet.62.d: "Terlepas dari jaminan yang berulang kali diberikan, pihak Soviet sejauh ini belum menarik mundur pasukannya, ataupun mengambil langkah apa pun untuk menyerahkan wilayah-wilayah tersebut dan kembali ke perbatasan yang telah kita sepakati. Tampaknya mereka tidak memiliki niat untuk mematuhi perjanjian tersebut."
 soviet.62.a: "Itu bahkan tidak sebanding dengan tintanya!"
 soviet.70.t: "Tekanan dari [SOV.GetNameDef]"
 soviet.70.desc: "Meskipun tanah air kita telah dibebaskan dari pendudukan [GER.GetAdjective], kita masih harus berhadapan dengan [SOV.GetName] yang selalu mengintai. Mereka kini menolak untuk mengakui legitimasi pemerintah kita kecuali jika kaum komunis yang sejalan dengan [SOV.GetAdjective] di negara ini diberi peran yang lebih terkemuka dalam administrasi. Kenyataannya, ini adalah ancaman terselubung dari pihak [SOV.GetAdjective] bahwa mereka menuntut kita untuk bersekutu dengan mereka. Sementara itu, mitra kita di barat tampaknya enggan memberi kita bantuan dalam menentang tuntutan [SOV.GetLeader]."
 soviet.70.a: "Kami tidak dalam kondisi untuk melakukan pertarungan lagi."
 soviet.70.b: "Kami tidak akan didikte oleh [SOV.GetLeader]."
 soviet.71.t: "Keselarasan [POL.GetAdjective] Terjamin"
 soviet.71.desc: "Menyusul tekanan terkini dari pemerintahan kita dan ancaman nyata dari Tentara Merah yang perkasa, administrasi borjuis [POL.GetNameDef] telah sepakat untuk menghormati otoritas partai komunis sebagai satu-satunya perwakilan rakyat yang sah. Meskipun kita bisa memaksakan kehendak kita dengan kekerasan, hal itu kini tidak lagi diperlukan karena kita dapat dengan aman mengandalkan [POL.GetName] untuk menjadi bagian dari lingkup pengaruh kita mulai saat ini."
 soviet.71.a: "Mereka benar untuk menyerah."
 soviet.72.t: "[POL.GetNameDefCap] Terus Menindas Kaum Proletariat"
 soviet.72.desc: "Dalam keangkuhan borjuis yang bodoh, administrasi tidak sah [POL.GetName] menolak mengakui otoritas partai komunis. Kita tidak boleh membiarkan orang-orang bodoh ini kembali mengubah Polandia menjadi pangkalan loncatan untuk agresi fasis ke [SOV.GetNameDef]. Sangat penting demi keamanan nasional agar kita segera membawa [POL.GetName] ke dalam lingkup pengaruh kita."
 soviet.72.a: "Kita akan menghancurkan kaum borjuis [POL.GetAdjective] untuk selamanya."
 soviet.72.b: "Rakyat sudah bosan dengan perang, kita harus mencari cara lain."
 soviet.73.t: "[SOV.GetNameDefCap] Mundur"
 soviet.73.desc: "Ketegangan belakangan ini seputar arah kebijakan luar negeri [POL.GetName] telah mereda seiring [SOV.GetNameDef] menarik diri dari retorika agresif mereka sebelumnya. Meskipun kemungkinan invasi lain telah berkurang, kita harus tetap waspada terhadap tetangga timur kita beserta boneka-boneka mereka."
 soviet.73.a: "Kita harus waspada."
 soviet.74.t: "[FROM.GetNameDefCap] akan Mengembalikan Wilayah [ROOT.GetAdjective]"
 soviet.74.d: "Sebagai tanda itikad baik dan persahabatan antara negara [FROM.GetAdjective] dan [ROOT.GetAdjective], [FROM.GetLeader] telah menawarkan untuk mengembalikan sebagian wilayah yang mereka kuasai, yang secara historis merupakan bagian dari Polandia."
 soviet.74.a: "Ada sesuatu yang lebih baik daripada tidak sama sekali"
 soviet.74.b: "Kami tidak menerima amal"
 POL_refused_states: "Polandia menolak wilayah tersebut"
 POL_accepted_states: "Polandia menerima wilayah"
 soviet.75.t: "[FROM.GetLeader] Menerima Tawaran Kita."
 soviet.75.d: "Tawaran kita untuk mengembalikan wilayah telah diterima oleh pemerintah [FROM.GetAdjective]. Hal ini diharapkan dapat memuaskan semua pihak di masa mendatang, dan mengurangi risiko konflik internal."
 soviet.75.a: "Seperti yang diharapkan"
 soviet.76.t: "[FROM.GetLeader] Menolak Tawaran Kita."
 soviet.76.d: "Karena alasan tertentu, tawaran kita untuk mengembalikan wilayah telah ditolak oleh pemerintah [FROM.GetAdjective]. Apa yang mereka rencanakan sulit dipastikan saat ini, namun setidaknya ini berarti mereka akan kesulitan mengajukan klaim atas wilayah tersebut di kemudian hari."
 soviet.76.a: "Tidak ada yang menyenangkan seseorang"
 finland.1.t: "Pihak [FROM.GetAdjective] Menuntut [146.GetName]"
 finland.1.d: "Mengutip kebutuhan untuk menciptakan penyangga keamanan untuk [195.GetName], pejabat dari [FROM.GetNameDef] telah meminta revisi perbatasan kami. Mereka ingin kita menyerahkan Karelia kepada mereka, dan dilihat dari penumpukan pasukan [FROM.GetAdjective] di sepanjang perbatasan kita, mereka tidak akan menerima jawaban tidak. Bagaimana seharusnya kita menanggapinya?"
 finland.1.a: "Kami tidak punya pilihan selain menerima tuntutan mereka."
 finland.1.b: "Biarkan mereka datang jika berani!"
 FIN_remove_soviet_claims_in_other_states_tt: "Menolak semua klaim di [FIN.GetFlag]§Y[FIN.GetAdjective]§! negara bagian inti."
 finland.2.t: "Memohon Bantuan Swedia dalam Perang"
 finland.2.d: "Finlandia dan Uni Soviet sedang berperang. Setelah hanya beberapa dekade berdaulat, kini kita berisiko kembali menjadi wilayah taklukan salah satu negara tetangga kita.\n\nNamun, ancaman musuh kita merambah jauh melampaui perbatasan. Tetangga kita di Swedia masih mempertahankan sikap netral terhadap Uni Soviet, tetapi mungkin dapat diyakinkan untuk bergabung bersama kita membela warisan bersama dan mengamankan zona penyangga strategis mereka sendiri."
 finland.2.a: "Mereka harus berkontribusi pada pendirian yang kita ambil."
 finland.2.b: "Kami tidak membutuhkan bantuan dari para penindas lama."
 finland.3.t: "Finlandia Mencari Dukungan Swedia"
 finland.3.d: "Negara tetangga kita, Finlandia, menolak tunduk pada tekanan Uni Soviet, dan kedua negara kini berada dalam keadaan perang. Meski belum ada persekutuan resmi yang disepakati antarnegara kita, pemerintah Finlandia telah meminta agar Swedia berkontribusi dalam pertahanan bersama Åland, yang mayoritas penduduknya berbahasa Swedia dan bernilai strategis penting bagi kedua belah pihak.\n\nMeskipun pemerintah masih terpecah mengenai langkah apa yang harus diambil untuk membantu Finlandia, dukungan publik terhadap pertahanan mereka sangat besar. Sejauh mana kita bersedia melangkah demi melindungi sesama negara Nordik dari agresi timur?"
 finland.3.a: "Kita harus menjaga netralitas kita."
 finland.3.b: "Jika mereka mempunyai dukungan publik, kirimkan sukarelawan dan peralatan."
 finland.3.c: "Perjuangan Finlandia adalah perjuangan kita! Untuk berperang!"
 finland.4.t: "Swedia Menolak Permintaan"
 finland.4.d: "Pemerintah Swedia telah memberikan tanggapan negatif terhadap permintaan bantuan kita dalam perang melawan Uni Soviet. Memilih untuk tetap netral guna menghindari dampak internasional maupun internal, sejauh ini mereka menentang untuk berkontribusi dalam perang dengan cara apa pun."
 finland.4.a: "Semoga saja mereka menyadari kesalahannya sebelum terlambat."
 finland.5.t: "Swedia Mengirim Sukarelawan"
 finland.5.d: "Pemerintah Swedia tidak bersedia bergabung bersama kita dalam perang melawan Uni Soviet, tetapi dukungan publik di antara tetangga kita tetap tinggi, dan banyak sukarelawan dari negara-negara Nordik lainnya telah menawarkan diri untuk bergabung dengan barisan kita demi membantu upaya perang. Walaupun kurang dari yang kita harapkan, setidaknya ada kesadaran rakyat mengenai ancaman yang kita hadapi."
 finland.5.a: "Setidaknya itu yang diharapkan."
 finland.6.t: "Swedia Bergabung dalam Perang Kita"
 finland.6.d: "Permintaan kita kepada pemerintah Swedia untuk pertahanan bersama Åland telah dipenuhi melampaui ekspektasi. Swedia telah bergabung bersama kita dalam perang melawan Uni Soviet, menolak untuk tetap netral di hadapan ancaman yang begitu nyata. Terlepas dari perselisihan internal, mereka kini akan bertempur bersama kita bahu-membahu demi mengamankan kedaulatan Finlandia yang berkelanjutan."
 finland.6.a: "Hari ini akan dikenang."
 finland.7.t: "Negosiasi Perdamaian Dengan [SOV.GetNameDef]"
 finland.7.d: "Tokoh komunis [Root.GetAdjective] Hella Wuolijoki telah menghubungi pemerintah kita dan menawarkan bantuannya untuk menjalin kontak dengan rezim [SOV.GetAdjective]. Sebuah pertemuan telah diatur di lokasi rahasia di Swedia, tempat kita akan ditawari kesempatan untuk menyerahkan wilayah sebagai ganti atas kedaulatan [Root.GetAdjective] yang terus berlanjut.\n\nKekuatan militer Finlandia menyusut dengan cepat, dan upaya-upaya sebelumnya untuk membuka jalur komunikasi tidak membuahkan hasil. Ini mungkin satu-satunya harapan kita demi penyelesaian damai atas konflik ini."
 finland.7.a_tt: "§YJika [SOV.GetName] menerima:§!"
 finland.7.a: "Tidak ada kemenangan dalam perang ini"
 finland.7.b: "Kita harus keep fighting!"
 finland.8.t: "[From.GetNameDefCap] Menawarkan Konsesi"
 finland.8.d: "Perang dengan [From.GetNameDef] telah memakan biaya yang sangat besar, tetapi karena kita berhasil memukul mundur tentara [From.GetAdjective], mereka mengajukan tawaran yang menarik. Kita diberi kendali atas wilayah-wilayah strategis yang penting, tetapi harus menarik pasukan kita dan menghentikan permusuhan lebih lanjut.\nHal ini akan mengakhiri ofensif kita terhadap [From.GetNameDef] tanpa kendali penuh atas wilayah tersebut, namun sebagai gantinya akan memungkinkan kita untuk fokus memperluas pengaruh di bagian lain dunia."
 finland.8.a: "Tentara kita dibutuhkan di tempat lain"
 finland.8.b: "Kami membutuhkan semua [From.GetNameDef]"
 finland.9.t: "[From.GetNameDefCap] Menolak"
 finland.9.d: "Negosiasi yang diprakarsai dengan [From.GetNameDef] telah buntu. Itu jelas merupakan siasat untuk mengulur waktu sementara tentara [From.GetAdjective] bersiap melancarkan serangan berikutnya ke wilayah [Root.GetAdjective].\n\n[Root.GetNameDef] akan berdiri tegak dan bertempur hingga titik darah penghabisan."
 finland.9.a: "Mereka akan berdarah di setiap langkah!"
 FIN_agree_peace: "Finlandia menyetujui tuntutan Soviet dan menyerahkan §YKarjala, Salla dan Petsamo§!."
 finland.10.t: "Perang Musim Dingin"
 finland.10.d: "Akhirnya, ambisi teritorial [SOV.GetNameDef] telah memuncak dengan invasi terhadap negara kita oleh musuh yang keji ini. Kita harus mengerahkan segala daya upaya untuk membentuk pertahanan kokoh melawan serangan tanpa ampun ini. Biarkan mereka membayar mahal untuk setiap jengkal kemajuan di tanah air kita!"
 finland.10.a: "Potong-potong!"
 japan.1.d: "Otoritas Tiongkok mengklaim bahwa 'titik puncak' telah tercapai sehubungan dengan 'agresi tak berdasar' kita terhadap Tiongkok! Tuntutan ganti rugi kita telah ditolak, dan beredar laporan bahwa warga negara Jepang diserang di Shanghai. Jika kita membutuhkan dalih untuk menindak tegas pihak Tiongkok, inilah saatnya!"
 japan.1.a: "Mereka akan membayarnya!"
 japan.2.d: "Tanpa diduga, pihak Tiongkok memilih untuk mengalah menyusul pertempuran kecil di Jembatan Marco Polo. Mereka memahami bahwa membuat kita marah akan berakibat sangat fatal, dan telah menyetujui konsesi teritorial yang luas mencakup Beijing dan wilayah-wilayah sekitarnya. Sedikit demi sedikit, Tiongkok mulai menjadi milik kita."
 japan.2.a: "Perang harus menunggu."
 japan.3.t: "Bentrokan Perbatasan: Kemenangan Soviet"
 japan.3.d: "Pihak Rusia dan anjing pesuruh Mongol mereka mendeteksi penumpukan pasukan kita di Heilungkiang, lalu merespons dengan serangan kilat skala besar melintasi perbatasan sebelum persiapan kita rampung! Pasukan kita menderita kerugian berat dalam bentrokan sengit yang terjadi sebelum kedua belah pihak akhirnya menarik diri."
 japan.3.a: "Bagaimana ini bisa terjadi?!"
 japan.4.t: "Bentrokan Perbatasan: Kemenangan Jepang"
 japan.4.d: "Rusia dan anjing pangkuan Mongolia mereka mendeteksi penumpukan pasukan kami di Heilungkiang, dan berusaha melancarkan serangan besar-besaran melintasi perbatasan untuk mengganggu persiapan kami! Untungnya, komandan kami yang berpikiran cepat mampu menangkap pasukan mereka dengan gerakan menjepit. Kami menimbulkan kerugian besar pada pasukan mereka sebelum mereka melarikan diri kembali melintasi perbatasan."
 japan.4.a: "Itu akan mengajari mereka!"
 japan.5.t: "Penarikan Pasukan Soviet"
 japan.5.d: "Setelah mengetahui adanya penambahan pasukan, Soviet dengan bijak memilih untuk menarik pasukannya dari daerah yang berbatasan langsung dengan perbatasan Manchuria. Tentara kami untuk sementara menduduki beberapa pos perbatasan yang ditinggalkan. Mudah-mudahan hal ini akan mengakhiri klaim konyol perbatasan yang diajukan Rusia dan sekutunya, Mongolia."
 japan.5.a: "Yang diperlukan hanyalah unjuk kekuatan."
 japan.6.t: "Prancis Menerima Tuntutan Kita"
 japan.6.d: "Pihak Prancis telah menyetujui tuntutan kita, dan pangkalan serta fasilitas mereka di Indocina kini sepenuhnya berada dalam wewenang kita. Mereka secara efektif telah menyerahkan kendali penuh atas koloni mereka kepada kita."
 japan.6.a: "Sebuah langkah yang bijaksana."
 japan.7.t: "Prancis Menolak Tuntutan Kita"
 japan.7.d: "Pihak Prancis secara kurang ajar telah menolak tuntutan kita! Tampaknya jika kita menginginkan Indocina, kita harus merebutnya dengan kekuatan senjata!"
 japan.7.a: "Orang-orang bodoh!"
 japan.8.t: "Jerman Menarik Penasihat"
 japan.8.d: "Pihak Jerman telah setuju untuk menarik kembali seluruh penasihat mereka dari Tiongkok. Mereka seharusnya sudah menaiki pesawat menuju Berlin saat ini juga. Jerman mengakui bahwa masa depan Asia Timur Raya adalah milik Jepang, bukan Tiongkok."
 japan.8.a: "Dan memang seharusnya begitu."
 japan.9.t: "Jerman Menolak Permintaan Kita"
 japan.9.d: "Pihak Jerman telah menolak untuk menarik kembali penasihat mereka dari Tiongkok, kendati misi militer mereka jelas-jelas mengganggu rencana kita untuk Asia Timur! Tidakkah mereka menyadari bahwa hal ini merusak fondasi diplomatik yang telah kita bangun bersama? Apakah pihak Jerman masih bisa dipercaya?"
 japan.9.a: "Kemudian para penasihat mereka akan mati bersama orang-orang Cina lainnya."
 japan.11.t: "Mengirim Ultimatum ke Siam"
 japan.11.d: "Dengan memusatkan pasukan di Indocina dekat perbatasan Siam, kita telah menegaskan bahwa niat kita untuk menggunakan wilayah mereka sebagai pangkalan guna membebaskan Asia Tenggara dari kolonialisme Eropa adalah tulus. Diharapkan, dengan memberi mereka pilihan untuk bergabung bersama kita dalam aliansi militer — yang secara efektif menjadikan Siam negara boneka Kekaisaran Jepang — kita dapat menghindari invasi sepihak yang tak berguna. Tentu saja, jika mereka menolaknya, hal itu sama saja dengan pernyataan perang."
 japan.11.a: "Kami akan memasuki Siam, apapun yang mereka katakan."
 japan.11.b: "Kalau dipikir-pikir, ancaman invasi terlalu agresif."
 japan.12.t: "Jepang Mengeluarkan Ultimatum"
 japan.12.d: "Jepang telah menghimpun pasukan di dekat perbatasan kita sejak lama, dan sebagaimana diduga, rencana mereka adalah menggunakan pelabuhan kita sebagai pangkalan untuk ekspansi lebih lanjut ke Burma dan Malaya. Kini, mereka memberi kita pilihan antara tunduk dan mengizinkan mereka melintas, atau menghadapi invasi.\n\nMeskipun hal ini dapat dipandang sebagai menyerahkan kedaulatan kita dan mengubah kita menjadi negara boneka Jepang, menghindari peperangan mungkin merupakan kepentingan terbaik kita."
 japan.12.a: "Kami akan menyetujui aliansi dengan Jepang."
 japan.12.b: "Kami tidak akan menyerahkan kemerdekaan kami begitu saja!"
 japan.13.t: "Siam Menerima Ultimatum"
 japan.13.d: "[From.GetLeader] telah dengan bijak memutuskan untuk menerima ultimatum kita dan menjalin aliansi militer antara kedua negara kita. Secara efektif, kita akan dapat menggunakan Siam sebagai pangkalan untuk operasi-operasi mendatang di Pasifik."
 japan.13.a: "Lingkungan Kemakmuran Bersama di Asia Timur Raya semakin kuat."
 japan.14.t: "Siam Menolak Ultimatum"
 japan.14.d: "[From.GetLeader] telah menolak tuntutan kita untuk memasuki Siam dan tawaran aliansi militer kita. Mengingat kita telah mengumumkan niat untuk tetap masuk apa pun yang terjadi, ini berarti perang."
 japan.14.a: "Sayangnya hal ini akan terjadi."
 romania.1.t: "[FROM.GetNameDefCap] Menuntut Bessarabia"
 romania.1.d: "Pasukan [FROM.GetAdjective] tengah berkonsentrasi di seberang perbatasan kita, dan diplomat mereka menuntut agar kita menyerahkan seluruh Bessarabia kepada mereka! Kita tidak bisa mengharapkan Jerman untuk campur tangan, karena pakta mereka dengan Rusia tampaknya memuat protokol rahasia yang menempatkan kita di dalam zona kepentingan [FROM.GetAdjective]. Haruskah kita melawan?"
 romania.1.a: "Tidak. Tidak ada harapan lagi."
 romania.1.b: "Iya! Kami tidak akan menyerahkan wilayah kami tanpa perlawanan!"
 romania.2.t: "Arbitrase Wina Kedua"
 romania.2.d: "Jerman telah dilibatkan untuk menengahi sengketa wilayah kita dengan Hungaria, dan dalam Arbitrase Wina Kedua mereka memutuskan bahwa Transilvania Utara harus dikembalikan ke bawah kendali Hungaria. Haruskah kita menerima keputusan ini?"
 romania.2.a: "Ya... kita tidak punya pilihan."
 romania.2.b: "Tidak, kami tidak akan pernah menyerahkan Transylvania!"
 romania.3.d: "Jerman telah dilibatkan untuk menengahi sengketa wilayah kita dengan Hungaria, dan dalam Arbitrase Wina Kedua mereka secara keterlaluan memutuskan bahwa seluruh Transilvania harus dikembalikan ke bawah kekuasaan Hungaria! Haruskah kita menerima keputusan ini?"
 romania.4.t: "Jerman Menengahi Sengketa"
 romania.4.d: "Jerman telah dilibatkan untuk menengahi sengketa wilayah kita dengan Hungaria, dan mereka dengan bijak memutuskan bahwa Transilvania harus tetap berada di bawah kendali Rumania. Pihak Hungaria tidak senang, tetapi semoga hal ini dapat menyelesaikan permasalahan untuk selamanya."
 romania.4.a: "Transylvania akan tetap menjadi milik Rumania."
 romania.5.t: "Traktat Craiova"
 romania.5.d: "Diplomat Bulgaria telah maju, dengan dukungan Jerman, meminta pengembalian Dobrudja Selatan—wilayah yang kita aneksasi dari mereka pada tahun 1913 setelah Perang Balkan Kedua. Berbagai konsesi yang sebelumnya telah terpaksa kita berikan tampaknya memicu tuntutan ini."
 romania.5.a: "Ini akan menyelesaikan perselisihan tersebut"
 romania.5.b: "Tidak, garisnya harus ditarik di sini!"
 romania.6.t: "Pilihan yang Berat"
 romania.6.d: "Kita telah kehilangan begitu banyak wilayah akibat negara-negara tetangga yang serakah. Kendati demikian, masih ada peluang untuk merebut kembali tanah yang hilang, bahkan dengan keuntungannya. Yang perlu kita lakukan hanyalah memilih pihak yang tepat."
 romania.6.a: "Satu-satunya harapan kami adalah Jerman."
 romania.6.b: "Uni Soviet menawarkan kita kesempatan terbaik"
 romania.6.c: "Kita harus tetap netral"
 baltic.1.t: "Ultimatum [FROM.GetAdjective]"
 baltic.1.d: "[FROM.GetNameDefCap] menekan kita untuk menandatangani perjanjian 'saling membantu' dengan mereka, yang akan memberi mereka hak menempatkan pasukan di dalam wilayah kita! Ini tidak lain adalah kedok terselubung untuk menganeksasi negara kita, namun kita nyaris tidak bisa memberikan perlawanan terhadap pasukan yang telah mereka siagakan di perbatasan kita."
 baltic.1.a: "Terimalah hal yang tak terhindarkan..."
 baltic.1.b: "Mereka harus merampas tanah kami dengan paksa!"
 baltic.4.t: "Jerman Menuntut Memel"
 baltic.4.d: "Pasukan Jerman sedang berkonsentrasi di Ostpreussen, dan Kementerian Luar Negeri mereka telah menyampaikan ultimatum kepada kita! Kita harus segera menyerahkan wilayah Memel kepada mereka, atau menghadapi ancaman aksi militer. Haruskah kita menyetujui tuntutan mereka?"
 baltic.4.a: "Kita harus accept."
 baltic.4.b: "Tidak akan pernah!"
 baltic.5.t: "Kaum Komunis Memegang Kendali."
 baltic.5.d: "[Root.GetName] telah memilih solidaritas dan kekuasaan politik telah direbut dari kaum borjuis. Banyak pihak di dalam pemerintahan baru menyarankan agar kita menunaikan kewajiban komunis kita dan menyatu dengan Uni Soviet."
 baltic.5.a: "Masa depan kita paling terjamin jika kita benar-benar menyatu dengan Tanah Air."
 baltic.5.b: "[Root.GetName] memiliki lebih banyak hal untuk ditawarkan dan beroperasi sendiri di bawah perlindungan Uni Soviet."
 baltic.5.c: "[Root.GetName] akan tetap menjadi negara berdaulat."
 baltic.7.t: "[From.GetName] Meminta Partisipasi [Root.GetAdjective] di [From.GetFactionName]"
 baltic.7.d: "Dengan ditandatanganinya perjanjian persahabatan antarnegara kita, [From.GetName] meminta agar [Root.GetName] bergabung bersama mereka di [From.GetFactionName], guna bersatu melawan ancaman yang kian membesar di sekeliling negara kita. Baik komunis maupun fasis, [From.GetName] berjanji akan membela kepentingan [Root.GetAdjective]."
 baltic.7.a: "[Root.GetName] berdiri bersama saudara-saudaranya."
 baltic.7.b: "[Root.GetName] hanya bisa bertahan dengan sendirinya."
 baltic.8.t: "[SOV.GetNameDefCap] memperluas kendali kita atas wilayah Baltik"
 baltic.8.desc: "Ini adalah hari yang menyenangkan untuk [ROOT.GetNameDef]! Setelah kampanye gagah berani yang dilakukan oleh kamerad-kamerad kita, [SOV.GetNameDefCap] telah dengan tepat menyatakan bahwa wilayah Baltik yang baru dibebaskan, bersama dengan para pekerjanya yang berani, akan berada di bawah yurisdiksi kita.\n\nHal ini membawa kita satu langkah lebih dekat ke Negara Baltik yang bersatu dan cukup kuat untuk melawan musuh-musuh kelas pekerja."
 baltic.8.a: "Itu pilihan yang wajar!"
 hungary.1.t: "Arbitrase Jerman"
 hungary.1.d: "Terlepas dari klaim sah kita, Jerman telah memutuskan bahwa Transilvania harus tetap berada di bawah kendali Rumania. Mereka menyatakan berhasrat memperbaiki segala ketidakadilan yang ditimbulkan di Versailles, tetapi terbukti hal ini hanya berlaku jika menyangkut perbatasan mereka sendiri."
 hungary.1.a: "Keterlaluan."
 hungary.2.t: "Arbitrase Wina Kedua"
 hungary.2.d: "Jerman telah mengakui keabsahan klaim kita, seperti yang sudah kita duga, dan Transilvania Utara telah dikembalikan ke Hungaria. Ini adalah momen bersejarah!"
 hungary.2.a: "Hari untuk dirayakan!"
 hungary.3.d: "Jerman tidak hanya mengakui keabsahan klaim kita, tetapi mereka juga telah memutuskan bahwa seluruh Transilvania harus dikembalikan ke bawah kendali Hungaria! Ini melebihi apa yang sempat kita harapkan."
 hungary.4.d: "Jerman mengakui keabsahan klaim kita dan menganugerahkan Transilvania Utara kepada kita, tetapi Rumania dengan keras kepala menolak menerima keputusan tersebut!"
 hungary.4.a: "Orang-orang bodoh!"
 hungary.5.d: "Jerman mengakui keabsahan klaim kita dan menganugerahkan seluruh Transilvania kepada kita, tetapi Rumania dengan keras kepala menolak menerima keputusan ini!"
 hungary.6.t: "Putusan Ljubljana Pertama"
 hungary.6.d: "Orang Jerman mungkin mengeluhkan Traktat Versailles, tetapi nasib mereka masih jauh lebih baik dibandingkan dengan ketidakadilan Traktat Trianon. Kendati mereka mengklaim perjanjian itu demi penentuan nasib sendiri suatu bangsa, traktat itu justru menjerumuskan begitu banyak putra sejati Hungaria ke bawah kekuasaan asing. Salah satu luka pada kebanggaan Hungaria adalah provinsi Vojvodina. Pengembalian wilayah-wilayah ini ke pangkuan Hungaria telah memulihkan ketidakadilan yang ditimpakan kepada kita."
 hungary.6.a: "Keadilan Hongaria"
 bulgaria.1.t: "Traktat Craiova - Rumania Menyetujui"
 bulgaria.1.d: "Pemerintah Rumania telah menerima Arbitrase Jerman dalam sengketa kita. Dobrudja Selatan telah dipersatukan kembali dengan Bulgaria!"
 bulgaria.1.a: "Akhirnya!"
 bulgaria.2.t: "Traktat Craiova - Rumania Menolak"
 bulgaria.2.d: "Pemerintah Rumania menolak tawaran kita untuk mengakhiri segala sengketa! Mereka mengklaim bahwa Dobrudja Selatan kini menjadi bagian tak terpisahkan dari bangsa mereka yang tidak akan pernah mereka lepaskan."
 bulgaria.2.a: "Tidak dapat diterima!"
 bulgaria.3.t: "Putusan Ljubljana Pertama"
 bulgaria.3.d: "Sudah lama kita mengimpikan Bulgaria Raya dan sudah lama pula kita diperlakukan sebagai warga kelas dua. Hak kita diingkari dalam Konferensi London, dikhianati sekutu kita pada 1913, dan dihukum karena menuntut keadilan pada 1918. Kini hal itu berakhir sudah. Jerman bertekad memperbaiki ketidakadilan dari apa yang disebut perdamaian itu, bukan hanya demi dirinya sendiri tetapi juga untuk bangsa lain. Bulgaria kini akan menyaksikan kembalinya Makedonia dari Yugoslavia."
 bulgaria.3.a: "Rakyat Bulgaria bersukacita!"
 bulgaria.4.t: "Traktat Craiova"
 bulgaria.4.d: "Kita tidak lupa bagaimana Rumania menusuk kita dari belakang pada tahun 1913 dan secara pengecut merebut Dobrudja Selatan ketika tentara kita sedang bertempur di tempat lain. Hungaria telah memanfaatkan persahabatannya dengan Jerman untuk membalas dendam kepada Rumania, apakah kini tiba giliran kita?"
 bulgaria.4.a: "Kami akan membalas dendam"
 bulgaria.4.b: "Balas dendam adalah hidangan yang paling enak disajikan dingin"
 bulgaria.5.t: "Traktat Craiova"
 bulgaria.5.d: "Jerman memilih memihak kaum Rumania yang tercela dalam upaya kita menuntut keadilan. [Root.GetLeader] telah menegaskan kepada duta besar Jerman bahwa Bulgaria mengharapkan perlakuan lebih dari sahabat-sahabatnya."
 bulgaria.5.a: "Ditolak"
 italy.1.t: "Albania Tunduk"
 italy.1.d: "Otoritas Albania telah menyetujui tuntutan kita, dan [ALB.GetLeader] telah dipaksa mengundurkan diri. Mulai saat ini dan hingga akhir zaman, Albania akan menjadi milik Italia!"
 italy.1.a: "Hari yang mulia."
 italy.2.t: "Zog Menolak Ultimatum"
 italy.2.d: "Menantang sampai akhir, Raja Zog telah menolak ultimatum kami. Dia dan para penasihatnya kini berusaha mengumpulkan pertahanan menyedihkan apa pun yang bisa dikerahkan Albania. Kita harus menduduki Tirana dan mengakhiri lelucon ini!"
 italy.2.a: "Kita bisa melakukannya dengan cara yang mudah, Zog!"
 italy.3.t: "Ultimatum Italia"
 italy.3.d: "Para diplomat Italia telah menyampaikan ultimatum kepada kami menuntut agar kami tunduk pada pendudukan mereka! Albania akan diperintah dalam persatuan pribadi di bawah raja Italia!"
 italy.3.a: "Kita harus submit."
 italy.3.b: "Itu tidak akan terjadi! Berkumpul ke Zog!"
 italy.4.t: "Perluasan Vallo Alpino"
 italy.4.d: "Insinyur dari Regio Esercito telah mempelajari perbatasan utara kami dan mengidentifikasi lokasi di mana Vallo Alpino perlu diperkuat dan diperluas. Perintah pembangunan yang diperlukan telah dikeluarkan."
 italy.4.a: "Jika benteng ini ada di sini pada zaman Hannibal..."
 italy.5.t: "Perjanjian Teknologi Italia-Jerman"
 italy.5.d: "[FROM.GetNameDefCap] menyarankan pertukaran teknologi dan gagasan yang akan mendekatkan bangsa kita dan menjadikan kita berdua semakin kuat."
 italy.5.a: "Saran yang bagus!"
 italy.5.b: "Teknologi Jerman hanya untuk rakyat Jerman"
 italy.6.t: "Perjanjian Teknologi Italia-Jerman - Diterima!"
 italy.6.d: "Sebagaimana telah kita duga, pihak Jerman sangat senang menyusun serangkaian pertukaran teknologi. Jelas sekali bahwa angin baru tengah berhembus di Eropa, dan Italia kini selangkah lebih dekat untuk merebut kembali kejayaan masa lalunya!"
 italy.6.a: "Hebat!"
 italy.7.t: "Perjanjian Teknologi Italia-Jerman - Ditolak!"
 italy.7.d: "Pihak Jerman telah menolak tawaran perjanjian kita."
 italy.7.a: "Sebaiknya kita menjaga diri kita sendiri mulai sekarang"
 italy.8.t: "Bergabung dengan Faksi Prancis"
 italy.8.d: "Mouvement Franciste tengah menguat di Prancis dan telah meminta kita untuk bergabung dengan faksi mereka. Apakah hal ini menguntungkan kepentingan Italia?"
 italy.8.a: "Mari kita bergabung dengan Perancis."
 italy.8.b: "Orang Prancis tidak bisa dipercaya"
 usa.1.t: "Earhart Ingin Mendaftar Militer"
 usa.1.d: "Di saat Amerika memobilisasi pasukannya untuk perang, kita telah menerima permintaan yang tidak biasa. Amelia Earhart, penerbang wanita terkenal yang belum lama ini berhasil mengelilingi dunia, ingin mendaftar ke Korps Udara Angkatan Darat sebagai pilot pesawat tempur. Dia telah menunjukkan keterampilan luar biasa dalam simulasi pertempuran udara, namun ada banyak kalangan di jajaran petinggi militer yang keberatan dengan gagasan seorang wanita menerbangkan misi tempur. Haruskah kita membuat pengecualian dalam kasusnya dan mengizinkannya bergabung?"
 usa.1.a: "Ya, kami membutuhkannya."
 usa.1.b: "Tidak, itu tidak perlu."
 usa.2.t: "Takdir Nyata (Manifest Destiny)"
 usa.2.d: "Landasan unik dan sejarah Amerika Serikat menjadikannya tugas kita untuk menjaga demokrasi dan kebebasan di dunia. Dekade terakhir telah membuktikan bahwa misi ini tidak dapat terwujud tanpa mengangkat senjata melawan mereka yang berupaya menghancurkannya. Mulai saat ini, setiap penindas harus bertanggung jawab kepada kita, dan angkatan bersenjata kita akan membebaskan rakyat di seluruh dunia."
 usa.2.a: "Kebebasan atau kematian!"
 usa.3.t: "Armada Amerika di Pearl Harbor"
 usa.3.d: "Sanksi diplomatik dan ekonomi yang kita derita dari Amerika Serikat tampaknya hanyalah awal dari ancaman yang jauh lebih besar. Armada Pasifik Amerika telah ditempatkan di pangkalan laut Pearl Harbor, Hawaii, yang jelas memberi sinyal bahwa pihak Amerika akan mempertahankan kehadiran kuat di Pasifik dan terus mendukung musuh-musuh kita. Melancarkan serangan terhadap pangkalan tersebut pada saat ini dapat memberi kita keunggulan kejutan."
 usa.3.a: "Siapa yang tahu berapa lama peluang ini akan bertahan?"
 usa.4.t: "Perjanjian Kapal Perusak untuk Pangkalan"
 usa.4.d: "Setelah mengambil sikap menentang Jerman, AS tampak berkepentingan memastikan Britania tetap berdiri kokoh melawan ancaman Jerman. Namun, mereka juga berkeinginan mempertahankan kehadiran armada laut mereka sendiri di Atlantik. Sebagai imbalan atas beberapa pangkalan laut kita, mereka akan memasok bangsa kita dengan kapal-kapal perusak. Kapal-kapal tersebut sebelumnya berstatus cadangan, namun menerimanya tetap akan memperkuat ikatan militer antar bangsa kita, dan mungkin merupakan keputusan yang bijak."
 usa.4.a: "Ini adalah kesempatan unik."
 usa.4.a.tt: "Kami akan mendapatkan 43 Kapal Perusak Amerika.\nKanada akan mendapatkan 7 Kapal Perusak Amerika."
 usa.4.b: "Hal ini jelas lebih menguntungkan AS dan tidak dapat diterima."
 usa.5.t: "Britania Menolak Tawaran"
 usa.5.d: "Terlepas dari persiapan dan itikad baik kita, Britania telah menolak tawaran kapal perusak tua kita sebagai imbalan atas pangkalan laut mereka."
 usa.5.a: "Kerugian mereka."
 usa.6.t: "Pemilihan Umum [GetYear]"
 usa.6.d: "Hari pemilihan presiden telah tiba. Petahana Franklin Delano Roosevelt telah mengimplementasikan sejumlah program yang secara kolektif disebut sebagai New Deal, yang dimaksudkan untuk membawa AS keluar dari Depresi Besar.\n\nMeskipun banyak dari upaya tersebut mendapat sambutan baik, rencananya untuk memperluas peran dan wewenang pemerintah menuai kritik keras dari lawannya, kandidat Partai Republik Alf Landon. Berlatar belakang industri minyak, Landon menginginkan kebebasan ekonomi yang lebih besar, sementara Roosevelt dan Partai Demokrat ingin memperluas Jaminan Sosial dan menjamin stabilitas ekonomi. Pemilu kali ini mungkin berlangsung sangat ketat, atau menjadi kemenangan besar bagi Partai Demokrat."
 usa.6.a: "Partai Demokrat. Empat tahun lagi!"
 usa.6.b: "Partai Republik. Kita harus menjaga cita-cita sistem Amerika."
 usa.7.t: "Roosevelt vs Willkie"
 usa.7.d: "Sejak jabatan Presiden Amerika Serikat pertama kali dibentuk, belum pernah ada presiden yang menjabat selama tiga periode berturut-turut. Namun, mengingat situasi dunia yang genting dan perkembangan internasional dalam beberapa tahun terakhir, Presiden Roosevelt telah memutuskan untuk mendobrak tradisi dan mencalonkan diri untuk periode ketiga. Kandidat dari Partai Republik Wendell Willkie, yang dipandang sebagai kuda hitam dengan latar belakang industrialis dan pengalaman politik terbatas, melontarkan kritik terhadap intervensionisme ekonomi Roosevelt maupun pembenarannya untuk maju di periode ketiga.\n\nMeskipun kedua kandidat memiliki banyak kesamaan dalam kebijakan luar negeri mereka dan Willkie ingin mempertahankan sebagian bentuk dari New Deal, banyak kalangan masih memandang pemilu ini sebagai titik penentu bagi masa depan demokrasi Amerika."
 usa.7.a: "Partai Demokrat. FDR sangat diperlukan."
 usa.7.b: "Partai Republik. Kami menginginkan Willkie!"
 usa.8.t: "Landon vs Roosevelt"
 usa.8.d: "Presiden Landon menghentikan kelanjutan reformasi New Deal Partai Demokrat empat tahun lalu, lebih memilih mengandalkan kekuatan bangsa yang bertumpu pada perusahaan industri seperti yang ia bantu dirikan sebelum masa kepresidenannya. Roosevelt, yang terus berkampanye demi menuntaskan program-program yang semula ia rencanakan untuk masa jabatan keduanya, kini kembali mencalonkan diri sebagai presiden. Kendati ia tetap menjadi kandidat yang populer, Landon terus mengkritik upayanya yang memusatkan kekuasaan di tangan presiden, dan dengan demikian ia sendiri menghindari kebijakan serupa.\n\nAncaman di luar negeri, baik terhadap bangsa kita maupun bangsa lain, tetap menjadi kenyataan dan tak satu pun dari kedua kandidat mendukung sikap Amerika Serikat yang berpura-pura menutup mata. Pertanyaannya adalah siapa yang akan memimpin gudang senjata demokrasi melewati masa-masa genting ini."
 usa.8.a: "Partai Republik. Landon mengabdi pada nilai-nilai kita."
 usa.8.b: "Partai Demokrat. Roosevelt siap melakukan apa yang diperlukan."
 usa.9.t: "Roosevelt vs Dewey"
 usa.9.d: "Masa kepresidenan Franklin D. Roosevelt telah menjadi luar biasa dalam banyak hal. Terlepas dari kesehatannya yang menurun dan lamanya masa jabatan kepresidenannya yang belum pernah terjadi sebelumnya, ia bercita-cita untuk terus memimpin negara kita melewati upaya perang. Partai Republik sempat terbatas dalam memilih calon karena banyak calon potensial yang sedang bertugas di medan perang, namun mereka akhirnya memilih Gubernur Thomas E. Dewey untuk mewakili mereka.\n\nRoosevelt terus memperoleh dukungan rakyat, tetapi banyak yang menduga ia mungkin tidak akan bertahan hidup hingga akhir masa jabatannya. Namun apakah hal itu cukup untuk memberi Dewey kemenangan atas pria yang telah membawa kita sejauh ini?"
 usa.9.a: "FDR mengalahkan Dewey."
 usa.9.b: "Dewey mengalahkan FDR."
 usa.10.t: "[Root.GetLeader] vs Roosevelt"
 usa.10.d: "Meskipun banyak aspek dari New Deal dipertahankan oleh [Root.GetLeader], Roosevelt masih melihat kesempatan untuk mewujudkan rencana awalnya bagi kelanjutan pembangunan program-program tersebut. Terlepas dari kesehatannya yang menurun, ia berhasil mempertahankan sebagian besar dukungan yang sebelumnya mengantarkannya ke kursi kepresidenan, dan kini kembali berkampanye untuk Partai Demokrat.\n\n[Root.GetLeader] berargumen bahwa pergantian kepemimpinan dalam situasi Amerika yang sensitif adalah tindakan tidak bertanggung jawab, hal yang agak ironis mengingat klaim serupa pernah dilontarkan sebelum kemenangan sebelumnya atas Roosevelt. Meski demikian, ia mungkin ada benarnya."
 usa.10.a: "[Root.GetLeader] telah terbukti menjadi pemimpin yang mumpuni."
 usa.10.b: "Amerika siap untuk Kesepakatan Baru yang baru."
 usa.11.t: "Roosevelt vs MacArthur"
 usa.11.d: "Dengan terus adanya ancaman perang, baik Partai Demokrat maupun Republik bercita-cita mencari kandidat dari kalangan militer. Jenderal Douglas MacArthur, yang biasanya menjalankan tugas militernya, telah mengambil kesempatan untuk berkampanye untuk nominasi Partai Republik sementara negara kita dalam keadaan damai dan menang. Dia sekarang menantang Roosevelt, mendukung koalisi konservatif.\n\nRoosevelt terus menjadi populer, namun karisma dan rasa tanggung jawab MacArthur telah memberikan kesan yang kuat pada para pemilih. Apakah pihak militer benar-benar tahu yang terbaik?"
 usa.11.a: "Roosevelt dan Truman akan berhasil."
 usa.11.b: "MacArthur adalah orang yang cinta damai dan juga perang."
 usa.12.t: "Kampanye Douglas MacArthur"
 usa.12.d: "Demi menantang rekor masa kepresidenan Roosevelt yang luar biasa panjang, Partai Republik melirik komandan militer yang disegani, dengan harapan menemukan kandidat potensial untuk membawa Amerika melewati perang ini. Jenderal Douglas MacArthur telah menjadi calon favorit di kalangan konservatif, tetapi ia juga aset yang sangat diperlukan dalam konflik yang sedang berlangsung dan enggan menghabiskan waktunya untuk berkampanye merebut kursi kepresidenan.\n\nKendati demikian, ia tetap menjadi salah satu kandidat konservatif yang paling menjanjikan dan mungkin dapat diyakinkan untuk berkampanye guna mencegah terpilihnya presiden dari faksi moderat Partai Republik. Apakah pengorbanan ini sepadan?"
 usa.12.a: "MacArthur lebih dibutuhkan di lini depan dibandingkan di Gedung Putih."
 usa.12.b: "Kita membutuhkannya untuk menantang Roosevelt."
 usa.13.t: "Roosevelt Meninggal Dunia"
 usa.13.d: "Meskipun kesehatan Presiden Roosevelt telah menurun selama beberapa waktu, kampanye kepresidenannya yang penuh semangat meyakinkan banyak orang bahwa ia masih memiliki umur bertahun-tahun lagi. Namun demikian, kemungkinan meninggalnya FDR saat masih menjabat tetap membayangi, dan hari ini beliau menghembuskan napas terakhir setelah terserang stroke. Wakil Presiden Harry S. Truman kini telah mengambil sumpah jabatan, memohon dukungan dan doa dari seluruh rakyat. Kabinet lama tetap dipertahankan, dan Truman bersumpah untuk melanjutkan banyak kebijakan pendahulunya."
 usa.13.a: "Maka berakhirlah suatu era, dan dimulailah era lainnya."
 news.1.t: "Insiden Jembatan Marco Polo"
 news.1.d: "Pasukan Jepang dan Tiongkok telah terlibat dalam pertempuran kecil tanpa hasil yang menentukan di sekitar Jembatan Marco Polo yang strategis, terletak tepat di barat daya Beijing.\n\n[CHI.GetNameDef] telah menolak tuntutan [JAP.GetNameDef] atas permintaan maaf dan konsesi teritorial, seraya menyatakan bahwa 'titik batas' agresi Jepang telah terlampaui.\n\nPara diplomat khawatir bahwa situasi yang kian bergejolak ini dapat memicu perang terbuka setiap saat."
 news.1.a: "Kabar yang mengkhawatirkan."
 news.1.b: "Sebuah tragedi bagi rakyat Spanyol."
 news.1.c: "Dukung rekan-rekan seperjuangan kita!"
 news.2.d: "Pasukan Jepang dan Tiongkok telah terlibat dalam pertempuran kecil tanpa hasil yang menentukan di sekitar Jembatan Marco Polo yang strategis, terletak tepat di barat daya Beijing.\n\n[CHI.GetNameDef] telah menerima tanggung jawab penuh atas insiden tersebut, menyampaikan permohonan maaf kepada [JAP.GetNameDef] serta menyetujui konsesi teritorial yang luas. Hal ini mengejutkan banyak pengamat, yang sebelumnya memperkirakan ketegangan perbatasan ini akan meletus menjadi perang skala penuh.\n\nApakah ini menandakan terwujudnya perdamaian abadi di Asia?"
 news.2.a: "Kemenangan bagi ketertiban."
 news.2.b: "Hari yang menyedihkan bagi demokrasi."
 news.2.c: "Kita tidak memiliki pilihan lain."
 news.5.t: "[JAP.GetNameDefCap] Menuntut Indocina Prancis"
 news.5.d: "Mengambil keuntungan dari kelemahan Perancis sehubungan dengan perjuangan di Eropa, [JAP.GetNameDef] telah memaksa pemerintah baru untuk menyerahkan kendali atas koloni mereka di Indochina!\n\nPasukan Jepang telah bergerak untuk menduduki semua pangkalan utama di wilayah tersebut, dan para ahli khawatir bahwa koloni tersebut dapat digunakan sebagai titik peluncuran ekspedisi militer di masa depan."
 news.5.a: "Burung nasar memangsa mayat..."
 news.5.b: "Seharusnya begitu."
 news.5.c: "Para serigala tidak memberi kami pilihan."
 news.5.e: "Sekutu kita menunjukkan inisiatif!"
 news.6.d: "Berupaya memanfaatkan kelemahan Prancis setelah kekalahan mereka di Eropa, [JAP.GetNameDef] baru-baru ini mengajukan tuntutan kepada pemerintah baru Prancis demi akses penuh ke pangkalan-pangkalan mereka di Indocina.\n\nHal ini secara efektif berarti menyerahkan kendali seluruh koloni kepada Jepang, suatu hal yang tidak dapat disetujui oleh pihak Prancis.\n\nPara pakar menilai kemungkinan besar keputusan ini akan memicu pembalasan militer dari pihak Jepang."
 news.6.a: "Mereka tidak akan berani... kan?."
 news.6.b: "Orang bodoh yang keras kepala akan menanggung akibatnya."
 news.6.c: "Kita harus prepare ourselves."
 news.6.e: "Langkah berani lainnya dari teman-teman kita."
 news.7.t: "Bentrokan Soviet - Jepang"
 news.7.d: "Pasukan Soviet dan Jepang baru-baru ini bentrok dalam pertempuran sengit di sepanjang perbatasan Manchuria.\n\nPasukan penyerbu Soviet dalam jumlah besar yang didukung kavaleri Mongolia rupanya mengejutkan tentara Jepang dan menimbulkan korban jiwa yang berat.\n\nSuasana di Tokyo dilaporkan mencekam, namun masih terlalu dini untuk memastikan apakah konflik ini akan meningkat menjadi perang terbuka."
 news.7.a: "Pemberontakan terhadap tatanan Versailles!"
 news.7.b: "Kedaulatan Jerman telah dipulihkan."
 news.7.c: "Kami telah mengirimkan pesan kepada dunia."
 news.8.d: "Pasukan Soviet dan Jepang baru-baru ini bentrok dalam pertempuran sengit di sepanjang perbatasan Manchuria.\n\nLaporan dari medan pertempuran mengindikasikan bahwa tentara Jepang berhasil menjepit pasukan Soviet dalam gerakan sapit saat mereka menyerang melintasi perbatasan, memaksa mereka yang selamat mundur kocar-kacir.\n\nAkankah insiden ini mendorong Moskwa mengirimkan lebih banyak bala bantuan ke Timur Jauh Rusia?"
 news.8.b: "Demi Kaisar!"
 news.8.c: "Kita harus mengevaluasi situasi..."
 news.9.t: "Penarikan Pasukan Soviet"
 news.9.d: "Menyusul penumpukan pasukan Jepang di Manchuria, Uni Soviet secara tak terduga tampak menarik mundur unit-unit yang ditempatkan tepat di sepanjang perbatasan.\n\nLangkah ini mungkin merupakan upaya Moskwa untuk menghindari konfrontasi di masa depan dengan Jepang, yang barangkali dipicu oleh kenangan pahit atas kekalahan yang diderita Rusia dalam Perang Rusia - Jepang."
 news.9.a: "Mungkin hal ini akan menghasilkan perdamaian abadi."
 news.9.b: "Para pengecut melarikan diri!"
 news.9.c: "Mundur taktis. Tidak lebih."
 news.10.t: "Uni Soviet Mengklaim Bessarabia"
 news.10.d: "Setelah memusatkan pasukannya di sepanjang perbatasan Rumania, [SOV.GetNameDef] melayangkan ultimatum kepada pemerintah di Bukares untuk segera menyerahkan Bessarabia ke dalam kendali mereka. Wilayah tersebut dulunya merupakan bagian dari Kekaisaran Rusia, yang dipandang oleh [SOV.GetNameDef] sebagai dasar hukum yang cukup atas tuntutan mereka.\n\nRumania menyatakan tidak memiliki pilihan lain selain tunduk, dan pasukannya telah ditarik mundur dari Bessarabia."
 news.10.a: "Menarik."
 news.10.b: "Bessarabia berhak menjadi milik kami."
 news.10.c: "Kami tidak punya pilihan..."
 news.10.e: "Nikmati kemenangan sementara ini, Moskow."
 news.11.t: "Rumania Menolak Tuntutan Soviet"
 news.11.d: "[SOV.GetNameDefCap] telah memusatkan kekuatan pasukan yang signifikan di sepanjang perbatasannya dengan [ROM.GetNameDef], dan hari ini Moskwa mengeluarkan ultimatum kepada pemerintah Rumania, menuntut penyerahan segera Bessarabia ke bawah kendalinya. Wilayah tersebut dulunya milik Kekaisaran Rusia, yang dipandang [SOV.GetNameDef] sebagai dasar hukum yang memadai bagi klaim mereka.\n\nDalam sebuah langkah pembangkangan, Bukares memutuskan untuk menolak mentah-mentah seluruh tuntutan teritorial Soviet, dan tentara Rumania telah diperintahkan untuk melakukan mobilisasi penuh.\n\nPara pengamat internasional memperkirakan pasukan Soviet akan menerobos perbatasan setiap saat."
 news.11.a: "Menarik."
 news.11.b: "Mereka telah melakukan kesalahan besar."
 news.11.c: "Bessarabia adalah milik kita!"
 news.11.e: "Biarkan orang bodoh berkelahi."
 news.12.t: "[FIN.GetNameDefCap] Menolak Tuntutan Soviet"
 news.12.d: "Diplomat Soviet telah menyampaikan ultimatum kepada pemerintah [FIN.GetNameDef], menuntut penyesuaian perbatasan di wilayah Karelia.\n\nMeskipun ada peningkatan signifikan pasukan Soviet di perbatasan, Helsinki menolak tuntutan ini, dengan menyatakan bahwa \"tidak satu kaki pun tanah Finlandia akan diberikan secara sukarela kepada agresor Rusia.\"\n\nPengamat internasional khawatir bahwa invasi Soviet akan segera terjadi."
 news.12.a: "Ini tidak akan berakhir dengan baik."
 news.12.b: "Mereka seharusnya tidak menolak tuntutan kami."
 news.12.c: "Kita harus menjaga pertahanan kita."
 news.12.e: "Mari kita lihat seberapa baik kinerja kaum Bolshevik..."
 news.12.f: "Mereka akan segera menyadari kesalahan mereka."
 news.13.t: "[FIN.GetNameDefCap] Menerima Tuntutan Soviet"
 news.13.d: "Setelah perdebatan sengit yang panjang, pemerintah [FIN.GetNameDef] memutuskan untuk menyetujui tuntutan Soviet terkait penyesuaian garis perbatasan di wilayah Karelia.\n\n[SOV.GetNameDef] berdalih perlunya zona penyangga untuk meningkatkan keamanan Leningrad, yang jaraknya hanya 30 kilometer dari garis perbatasan lama Finlandia.\n\nBanyak pengamat sebelumnya mencemaskan invasi besar-besaran Soviet ke Finlandia tak terelakkan, namun penyelesaian diplomatik ini diharapkan meredakan ketakutan tersebut."
 news.13.a: "Perang lain melanda Asia."
 news.13.b: "Sekarang kita dapat memfokuskan upaya kita pada hal lain."
 news.13.c: "Kami telah mengamankan kemerdekaan kami."
 news.13.e: "Sayang sekali. Hal ini akan membuat kaum Bolshevik sibuk."
 news.13.f: "Rekan-rekan kita menunjukkan kekuatan mereka!"
 news.14.t: "[SOV.GetNameDefCap] Mencaplok [TAN.GetNameDef]"
 news.14.d: "Dalam siaran pers pagi hari ini, Moskwa mengumumkan aneksasi resmi atas [TAN.GetNameDef].\n\nSoviet Tertinggi telah menyetujui permohonan parlemen Tuva untuk bergabung ke dalam Uni Soviet.\n\nRepublik Rakyat Tuva yang kecil, yang selama ini hanya diakui secara resmi oleh Uni Soviet dan Mongolia, akan diintegrasikan sebagai sebuah oblast otonom."
 news.14.a: "Tannu apa?"
 news.14.b: "Keadaan mereka akan menjadi lebih baik."
 news.15.t: "Arbitrase Wina Kedua"
 news.15.d: "Sebuah perjanjian telah ditandatangani di Wina menyusul arbitrase Jerman yang mengembalikan Transilvania Utara ke bawah kekuasaan Hungaria.\n\nWilayah tersebut sebelumnya diserahkan kepada [ROM.GetNameDef] pada akhir Perang Dunia I, yang berujung pada sengketa berkepanjangan yang sengit.\n\nApakah ini batas negara pertama dari sekian banyak perbatasan yang akan diubah, kini setelah tatanan baru tampaknya telah ditegakkan di Eropa?"
 news.15.a: "Kita akan lihat berapa lama hal ini berlangsung."
 news.15.b: "Peta Eropa akan digambar ulang."
 news.15.c: "Semoga revisi ini bermanfaat bagi kita suatu saat nanti."
 news.15.e: "Dengar, dengar!"
 news.16.d: "Menyusul arbitrase Jerman, sebuah traktat telah ditandatangani di Wina yang menetapkan seluruh Transilvania dikembalikan ke bawah kekuasaan Hungaria.\n\nWilayah tersebut sebelumnya diserahkan kepada [ROM.GetNameDef] pada akhir Perang Dunia I, yang memicu sengketa sengit.\n\nApakah ini awal dari perombakan banyak perbatasan lainnya kini setelah tatanan baru tampaknya mulai berakar di Eropa?"
 news.17.t: "Rumania Menolak Arbitrase Jerman"
 news.17.d: "Negosiasi antara [HUN.GetNameDef] dan [ROM.GetNameDef] mengenai sengketa teritorial berakhir buntu di Wina.\n\n[GER.GetNameDef] bertindak sebagai penengah, namun ketika mereka memutuskan untuk menyerahkan Transilvania Utara kembali kepada [HUN.GetNameDef], pihak [ROM.GetNameDef] menolak mentah-mentah keputusan tersebut. Pemerintah Rumania segera memerintahkan delegasinya untuk pulang ke Bukares.\n\nTampaknya [GER.GetNameDef] belum memiliki pengaruh diplomatik sebesar yang mereka bayangkan."
 news.17.a: "Menarik..."
 news.17.b: "Orang Rumania telah mempermalukan kami..."
 news.17.c: "Transilvania adalah milik kita!"
 news.17.e: "Ini belum berakhir."
 news.18.d: "Negosiasi antara [HUN.GetNameDef] dan [ROM.GetNameDef] mengenai sengketa teritorial berakhir buntu di Wina.\n\n[GER.GetNameDef] bertindak sebagai penengah, namun ketika mereka memutuskan untuk menyerahkan Transilvania Utara kembali kepada [HUN.GetNameDef], pihak [ROM.GetNameDef] menolak mentah-mentah keputusan tersebut. Pemerintah Rumania segera memerintahkan delegasinya untuk pulang ke Bukares.\n\nTampaknya [GER.GetNameDef] belum memiliki pengaruh diplomatik sebesar yang mereka bayangkan."
 news.19.t: "[GER.GetNameDefCap] Mengklaim Memel"
 news.19.d: "Dengan pasukan Jerman di perbatasan mereka yang siap menyerang, [FROM.GetNameDef] telah menyerah pada ultimatum [GER.GetAdjective] yang menuntut penyerahan wilayah lama Prusia di Memel.\n\nItu diserahkan kepada [FROM.GetNameDef] melalui Perjanjian Versailles, tetapi sekarang telah diintegrasikan kembali ke wilayah Ostpreussen.\n\nApakah kita belum mencapai ambisi teritorial Jerman di Eropa? Para ahli ragu..."
 news.19.a: "Kumpulan peta lainnya menjadi usang."
 news.19.b: "Rakyat Jerman di mana pun harus bersatu."
 news.19.c: "Kalau saja kita punya cara untuk melawan..."
 news.19.e: "Mereka berhak tunduk pada atasannya!"
 news.20.t: "[FROM.GetNameDefCap] Menolak Tuntutan [GER.GetAdjective]"
 news.20.d: "Kendati pasukan [GER.GetAdjective] telah bersiap di sepanjang perbatasan mereka, [FROM.GetNameDef] tetap menolak ultimatum yang dilayangkan Berlin untuk mengembalikan wilayah Memel.\n\nMemel dulunya bagian dari Prusia Timur, tetapi dianeksasi oleh [FROM.GetNameDef] menyusul Traktat Versailles. Integritas traktat inilah yang dinyatakan oleh [FROM.GetLeader] wajib dipertahankan ketika pemerintah [FROM.GetAdjective] mengumumkan penolakan mereka.\n\nPara pengamat internasional kini memperkirakan Jerman mungkin akan berupaya merebut wilayah tersebut dengan kekuatan senjata..."
 news.20.a: "Sangat berani."
 news.20.b: "Mereka telah menandatangani surat perintah kematian."
 news.20.c: "Garisnya harus ditarik di sini!"
 news.21.t: "Traktat Craiova"
 news.21.d: "Konsesi lebih lanjut terpaksa diberikan oleh [ROM.GetNameDef], dengan [BUL.GetNameDef] berhasil merebut kembali Dobrudja Selatan.\n\nWilayah ini dicaplok oleh Rumania pada tahun 1913 setelah Perang Balkan Kedua, dan sebagian besar penduduknya masih merupakan etnis Bulgaria dan Turki.\n\nApa pun alasannya, posisi [ROM.GetNameDef] kini melemah secara signifikan."
 news.21.a: "Tidak terlalu memprihatinkan."
 news.21.b: "Ini adalah kemenangan besar."
 news.21.c: "Lagipula tanah itu tidak berharga."
 news.22.t: "[ALB.GetLeader] Tunduk pada Italia"
 news.22.d: "Sebuah ultimatum telah disampaikan kepada pemerintah Albania oleh diplomat Italia, menuntut agar mereka tunduk pada pendudukan militer sepenuhnya.\n\n[ALB.GetLeader] telah turun tahta setelah menyadari kesia-siaan perlawanan, dan Albania sekarang akan diperintah dalam persatuan pribadi di bawah Raja Vittorio Emanuele III.\n\n[ITA.GetNameDef] memandang ke Balkan..."
 news.22.a: "Prancis telah takluk!"
 news.22.b: "Hari paling kelam bagi dunia bebas."
 news.22.c: "Kemenangan lagi untuk teman kita [From.GetLeader]!"
 news.23.t: "Raja Zog Menentang"
 news.23.d: "Para diplomat dari [ITA.GetNameDef] telah menyampaikan ultimatum kepada [ALB.GetNameDef], menuntut aneksasi TK1___ ke Italia Raya.\n\nDalam tindakan kepemimpinan nasional yang berani, Raja Zog menolak untuk menyerah pada tuntutan Italia, mendesak rakyat Albania untuk menolak tekanan dari [ITA.GetNameDef].\n\nNamun demikian, pakar militer asing sepakat bahwa [ALB.GetNameDef] memiliki peluang kecil untuk melawan invasi."
 news.23.a: "Berapa lama [ALB.GetNameDef] bisa melawan?"
 news.23.b: "Ini akan menjadi kampanye singkat."
 news.23.c: "Hidup Raja Zog!"
 news.24.t: "Persoalan Polandia"
 news.24.d: "Dalam pidato berapi-api hari ini di hadapan Reichstag, [GER.GetLeader] mengecam keras Polandia atas perlakuan mereka terhadap warga Jerman yang tinggal di Danzig dan Koridor Polandia.\n\nMenuduh bahwa kaum minoritas Jerman di Polandia 'dianiaya dengan cara yang paling keji yang dapat dibayangkan,' [GER.GetLeader] mempertegas pendirian pemerintahannya:\n'Danzig dahulunya kota Jerman dan tetap merupakan kota Jerman! Koridor itu dahulu milik Jerman dan tetap milik Jerman! Tanpa Volk Jerman, wilayah-wilayah timur ini masih akan terperosok ke dalam jurang kebiadaban.'"
 news.24.a: "Perang semakin dekat."
 news.25.t: "Remiliterisasi Rhineland"
 news.25.d: "Jerman telah menempatkan pasukan di wilayah Rhineland, dekat perbatasan Prancis, yang jelas-jelas melanggar Perjanjian Versailles. Penduduk setempat menyemangati tentara Jerman, sementara reaksi diplomatik dari Perancis dan Inggris sejauh ini tidak terdengar.\n\n'Ini tidak lebih dari sekedar orang Jerman yang berjalan ke halaman belakang rumah mereka sendiri', seorang komentator politik di Inggris mengamati."
 news.25.a: "Khawatir."
 news.25.b: "Itu adalah wilayah Jerman."
 news.25.c: "Kita harus menjaga pertahanan perbatasan kita."
 news.25.e: "Tentu saja tidak ada yang perlu dikhawatirkan."
 news.26.d: "Dalam pelanggaran terang-terangan terhadap Traktat Versailles, pasukan Jerman telah menyeberangi Sungai Rhine dan memasuki wilayah Rhineland, tepat di dekat perbatasan Prancis.\n\nMenyebut tindakan ini sebagai 'pelanggaran tak termaafkan' terhadap traktat perdamaian yang mengakhiri Perang Besar, Prancis dan Britania Raya telah memobilisasi pasukan mereka sebagai persiapan untuk melancarkan serangan militer ke Jerman.\n\nPerang sekali lagi meletus di Eropa!"
 news.26.a: "Ini dia lagi!"
 news.26.b: "Jerman akan menang!"
 news.26.c: "Pemberhentian berikutnya: Berlin!"
 news.26.e: "Mari kita selesaikan ini."
 news.27.d: "Dalam tindakan yang merupakan pelanggaran langsung terhadap Traktat Versailles, tentara Jerman telah melintasi Sungai Rhine dan berbaris menuju wilayah Rhineland di dekat perbatasan Prancis.\n\nSementara reaksi dari Britania Raya masih belum terdengar hingga saat ini, pihak Prancis tengah memobilisasi pasukan mereka sebagai persiapan melancarkan serbuan bersenjata ke Jerman.\n\nPerang sekali lagi pecah di Eropa!"
 news.28.t: "Hitler Dibunuh!"
 news.28.d: "Sekelompok perwira Wehrmacht yang menentang perang melancarkan kudeta di Berlin. Sekelompok pria bersenjata tak dikenal menyerbu Reichskanzlei dan, setelah baku tembak dengan pengawalnya, berhasil merenggut nyawa Führer Jerman.\nPara konspirator yang masih hidup semuanya telah ditangkap oleh Gestapo, dan pagi ini Heinrich Himmler dilantik sebagai Führer baru dari Reich Jerman.\n\nDalam pidatonya di hadapan Reichstag, Himmler menuduh Inggris dan Prancis mendalangi pembunuhan Hitler dan menyatakan komitmen tegas Jerman terhadap kehancuran total kedua negara."
 news.28.a: "Sebuah perkembangan yang menarik."
 news.28.b: "Mereka akan membayar!"
 news.28.c: "Setidaknya Hitler sudah pergi."
 news.29.d: "Sekelompok perwira Wehrmacht yang menentang perang melancarkan kudeta di Berlin. Sekelompok pria bersenjata tak dikenal menyerbu Reichskanzlei dan, setelah baku tembak dengan pengawalnya, berhasil merenggut nyawa Führer Jerman.\nPara konspirator yang masih hidup semuanya telah ditangkap oleh Gestapo, dan pagi ini Hermann Göring dilantik sebagai Führer baru dari Reich Jerman.\n\nDalam pidatonya di hadapan Reichstag, Göring menuduh Inggris dan Prancis mendalangi pembunuhan Hitler dan menyatakan komitmen tegas Jerman terhadap kehancuran total kedua negara."
 news.30.t: "Percobaan Pembunuhan Hitler Gagal"
 news.30.d: "Sekelompok perwira Wehrmacht yang menentang perang melancarkan kudeta terhadap Hitler di Berlin. Sekelompok pria bersenjata tak dikenal menyerbu Reichskanzlei, namun mereka berhasil dilawan oleh anggota pengawal SS Führer.\nAgen Gestapo telah menangkap semua konspirator, termasuk perwira tinggi seperti Ludwig Beck dan Wilhelm Canaris.\n\nDalam pidatonya di hadapan Reichstag, Hitler bersumpah akan membalas dendam terhadap Prancis dan Inggris karena mendalangi 'upaya curang' terhadap hidupnya ini."
 news.30.a: "Bayangkan jika mereka berhasil..."
 news.30.c: "Ini tidak mengubah apa pun."
 news.30.e: "Sayang sekali mereka tidak mendapatkan buggernya!"
 news.31.t: "Perang Saudara di Jerman!"
 news.31.d: "Sekelompok perwira Wehrmacht yang menentang perang saat ini telah melancarkan kudeta terhadap Hitler di Berlin. Sekelompok pria bersenjata tak dikenal menyerbu Reichskanzlei dan berhasil melikuidasi Führer Jerman setelah baku tembak sengit dengan pengawal SS-nya.\n\nPara pemberontak berhasil menguasai sebagian besar Berlin, dan banyak unit Wehrmacht telah membelot ke pihak mereka. Pasukan yang masih setia kepada Nazi telah berkumpul di bawah kepemimpinan baru, dan bersumpah akan membersihkan Jerman dari 'para pembangkang komunis dan agen asing yang saat ini menduduki Berlin.'"
 news.31.a: "Menarik."
 news.31.b: "Jerman harus bebas dari tirani!"
 news.31.c: "Kematian bagi para pengkhianat!"
 news.31.e: "Ini adalah keuntungan kita!"
 news.32.t: "Pakta Molotov-Ribbentrop"
 news.32.d: "Para diplomat dari Jerman dan Uni Soviet menyimpulkan apa yang digambarkan oleh para pengamat sebagai perjanjian bersejarah saat ini dengan penandatanganan Pakta Molotov-Ribbentrop.\nDinamakan setelah Menteri Luar Negeri Jerman Joachim von Ribbentrop dan Menteri Luar Negeri Soviet, Vyacheslav Molotov, pakta non-agresi ini menetapkan bahwa tidak ada pihak yang akan bersekutu atau membantu musuh pihak lain.\n\nDiplomat asing memperingatkan bahwa perjanjian ini secara efektif memberi Jerman kebebasan untuk berperang di Eropa tanpa harus takut akan intervensi Soviet."
 news.32.d_finland: "$news.32.d$ Namun, rakyat [ROOT.GetAdjective] tampaknya lebih khawatir akan ancaman yang mungkin ditimbulkan oleh [SOV.GetNameDef] terhadap mereka."
 news.32.a: "Ini tidak mungkin bagus..."
 news.32.b: "Bersulang untuk teman-teman baru Bolshevik kita!"
 news.32.c: "Bersulang untuk teman baru kita di Jerman!"
 news.32.e: "Ini untuk persahabatan yang panjang dan bermanfaat!"
 news.32.f: "Kita harus bersiap membela negara kita."
 news.33.t: "Uni Soviet Menduduki Polandia Timur"
 news.33.d: "Pasukan Soviet telah menduduki Polandia timur, secara resmi dengan dalih melindungi minoritas Belarus dan Ukraina dari kekacauan menyusul runtuhnya pemerintah Polandia.\n\nPasukan Jerman telah ditarik mundur dari wilayah-wilayah ini dengan tertib, yang berujung pada pembagian efektif Polandia di antara kedua kekuatan besar tersebut."
 news.33.a: "Sebuah cerita yang mungkin terjadi!"
 news.33.b: "Nikmatilah selagi masih ada, kaum Bolshevik..."
 news.33.c: "Batasan komunisme semakin maju!"
 news.34.t: "Gencatan Senjata Kedua di Compiègne"
 news.34.d: "Gencatan senjata antara [From.GetName] dan Republik Ketiga Prancis telah ditandatangani di Compiègne, tepat di gerbong kereta api yang sama di mana penyerahan diri Jerman dalam Perang Dunia I pernah dinegosiasikan.\n\nBerdasarkan syarat-syarat gencatan senjata, pemerintahan Prancis di bawah [vichy_france.GetLeader] yang berpusat di Vichy akan tetap mengelola sebagian besar Prancis selatan, sementara bagian negara lainnya jatuh ke dalam Zona Pendudukan Jerman.\n\nBeberapa perwira Prancis telah bersumpah untuk melanjutkan perlawanan dari luar negeri, namun langkah ini mengakhiri pertempuran secara efektif di daratan Prancis, setidaknya untuk saat ini."
 news.34.a: "Mengganggu"
 news.34.b: "Luar biasa!"
 news.34.c: "Pertarungan berlanjut!"
 news.35.t: "Kelahiran Uni Prancis-Britania"
 news.35.d: "Menghadapi jurang kekalahan di Prancis, pemerintah Prancis dan Britania memutuskan untuk menyatukan kedua bangsa mereka menjadi satu hingga kemenangan atas Jerman dapat dipastikan.\n\nPemerintahan bersama yang baru kini tengah dibentuk di London, dengan Edward VIII tetap menjabat sebagai kepala negara. Dalam 'Deklarasi Persatuan' yang diterbitkan, Kabinet Perang Bersama menyatakan:\n\n'Prancis dan Britania Raya bukan lagi dua bangsa terpisah, melainkan satu Uni Prancis-Britania. Konstitusi Uni ini akan mengatur badan-badan bersama untuk kebijakan pertahanan, luar negeri, keuangan, dan ekonomi. Setiap warga negara Prancis atau Britania akan serta-merta menikmati status kewarganegaraan di negara lainnya.'"
 news.35.a: "Prancis pasti putus asa"
 news.35.b: "Apakah mereka pikir mereka akan aman di bawah bendera lain?"
 news.35.c: "Bersatu melawan musuh bersama!"
 news.36.t: "Anschluss Austria"
 news.36.d: "Setelah kudeta yang berhasil dilakukan oleh partai Nazi lokal di Wina, pasukan Jerman telah melintasi perbatasan Austria dan menguasai negara tersebut.\n\nTidak ada pertempuran yang dilaporkan, dan tentara Jerman disambut oleh massa yang bersorak-sorai di kota-kota.\n\nDalam pidatonya di hadapan massa besar-besaran di Heldenplatz di Wina, Hitler mengumumkan Anschluss Austria, mencaplok negara itu ke dalam Jerman:\n\n'Provinsi timur tertua rakyat Jerman, mulai saat ini, akan menjadi yang terbaru benteng Reich Jerman!'"
 news.36.a: "Jika itu yang mereka inginkan..."
 news.36.b: "Selamat datang di Reich!"
 news.36.c: "Kita harus mengamankan perbatasan utara kita!"
 news.36.e: "Ini melanggar Perjanjian Versailles!"
 news.37.t: "Pembunuhan Lev Trotsky"
 news.37.d: "Lev Trotsky, yang pernah menjadi letnan tertinggi dan pewaris Vladimir Ilich Lenin, meninggal hari ini di rumah sakit Mexico City. Dia diserang di rumahnya dengan kapak es oleh seorang warga negara Spanyol yang diyakini bekerja di NKVD.\n\nSetelah perebutan kekuasaan yang gagal dengan $SOV_iosif_stalin$ dan sekutunya untuk menguasai Partai Komunis Uni Soviet, Trotsky menghabiskan tahun tiga puluhan di pengasingan, tinggal di Turki, Prancis dan Norwegia sebelum akhirnya menetap di Meksiko.\n\nDia tetap menjadi kritikus Stalin dan 'negara pekerja' Uni Soviet yang merosot."
 news.37.a: "Barbar."
 news.37.b: "Misi tercapai."
 news.37.c: "Akhir yang pas untuk pengacau massa itu."
 news.38.t: "Trotsky Selamat dari Percobaan Pembunuhan"
 news.38.d: "Setelah pergulatan sengit di rumahnya di Mexico City hari ini, Lev Trotsky membunuh seorang calon pembunuh dengan kapak es yang digunakan pria tersebut untuk menyerangnya. Pembunuhnya telah diidentifikasi sebagai warga negara Spanyol yang diyakini bekerja di NKVD.\n\nTrotsky pernah menjadi letnan tertinggi dan pewaris Vladimir Lenin, tetapi setelah perebutan kekuasaan yang gagal, ia terpaksa diasingkan dari Uni Soviet oleh $SOV_iosif_stalin$.\n\nBerbicara kepada pers, Trotsky mengecam upaya pembunuhan tersebut sebagai 'rencana pengecut lainnya yang dibuat oleh Stalin untuk membungkam para pengkritiknya.'"
 news.38.a: "Menarik."
 news.38.b: "Cacing itu!"
 news.39.t: "Trotsky Tewas di Perbatasan Soviet"
 news.39.d: "Otoritas Soviet telah merilis foto-foto jasad Lev Trotsky, membenarkan desas-desus bahwa ia terbunuh baru-baru ini saat mencoba menyelinap masuk ke [SOV.GetNameDef].\n\nJasadnya ditemukan terdampar di tepian Sungai Atrek yang membentang di sepanjang perbatasan Soviet - Persia.\n\nDiyakini bahwa Trotsky berusaha memanfaatkan gejolak di dalam tubuh Uni Soviet saat ini dengan mencari sekutu untuk melawan rival lamanya, Stalin, dan menggulingkannya melalui sebuah kudeta."
 news.39.a: "Menarik."
 news.39.b: "Setidaknya satu ancaman berkurang."
 news.40.t: "Trotsky Melancarkan Kudeta!"
 news.40.d: "Perebutan kekuasaan yang penuh kekerasan telah terjadi di ibu kota sementara Soviet. Lev Trotsky tampaknya diam-diam memasuki sisa-sisa Uni Soviet, mengakhiri pengasingan panjang yang dipaksakan kepadanya.\n\nBersama dengan sekutu di eselon tertinggi Partai Komunis, ia melancarkan kudeta yang sukses lagi terhadap Stalin.\n\nSetelah persidangan singkat oleh Pengadilan Rakyat, Stalin dijatuhi hukuman mati dengan cara digantung. Hukuman itu dilaksanakan pagi tadi."
 news.40.a: "Itu tidak terduga."
 news.40.b: "Hidup kawan Trotsky!"
 news.41.t: "Akhir Riwayat Trotsky"
 news.41.d: "Lev Trotsky ditemukan tewas pagi ini di kamar hotel Buenos Aires.\n\nDia tampaknya telah dicekik sampai mati dengan gendongan gunung, dan pembunuhnya ditangkap oleh pengawal Trotsky sebelum dia dapat meninggalkan gedung.\n\nMeskipun pembunuhnya adalah warga negara Portugis, ada bukti yang mengaitkannya dengan direktorat intelijen Soviet GRU. Tampaknya Stalin akhirnya memberikan pukulan telak kepada rival lamanya."
 news.42.t: "Bencana Hindenburg"
 news.42.d: "Kapal udara penumpang Jerman Hindenburg hancur hari ini saat mencoba berlabuh di Pangkalan Udara Angkatan Laut Lakehurst di Amerika Serikat. Atas sebab yang belum dapat dipastikan, kapal udara tersebut dilalap kobaran api dan terhempas ke tanah, merenggut 35 korban jiwa.\n\nAkibat kelangkaan dan mahalnya harga helium serta larangan ekspor oleh AS, Hindenburg, sama halnya dengan seluruh kapal udara penumpang Jerman lainnya, pada akhirnya dirancang untuk menggunakan hidrogen yang memberikan daya angkat lebih besar namun sangat mudah terbakar.\n\nDengan terguncangnya kepercayaan publik akibat malapetaka ini dan bangkitnya pesawat penumpang yang jauh lebih cepat, ini bisa menandai berakhirnya era kapal udara."
 news.42.a: "Oh, kemanusiaan!"
 news.43.t: "Insiden Hindenburg"
 news.43.d: "Bencana besar nyaris terjadi hari ini ketika kebocoran bahan bakar diesel terdeteksi pada kapal udara penumpang Jerman Hindenburg saat hendak berlabuh di Pangkalan Udara Angkatan Laut Lakehurst di Amerika Serikat.\n\nKebocoran tersebut berhasil segera diperbaiki. Jika luput dari perhatian, uap yang mudah terbakar dapat memicu kobaran api yang sanggup melalap habis seluruh kapal udara.\n\nPara pengamat sejak lama mempertanyakan kelayakan kapal udara penumpang mengingat catatan keselamatannya yang meragukan, dan insiden ini dipastikan membuat kritik mereka kian nyaring."
 news.43.a: "Hampir saja."
 news.44.t: "Penerbangan Rudolf Hess"
 news.44.d: "Wakil Führer Rudolf Hess ditangkap oleh tentara Home Guard di Skotlandia kemarin setelah terjun payung dari pesawat tempur berat.\n\nSeorang pilot ulung, ia tampaknya terbang sendirian melintasi Laut Utara, berhati-hati agar tetap berada di luar jangkauan radar sebelum membelok ke barat menuju Inggris.\nHess tampaknya telah mengambil keputusan sendiri untuk menegosiasikan perjanjian damai antara Inggris dan Jerman, meskipun Berlin telah mengecamnya sebagai orang gila dan memecatnya dari jabatan politik apa pun.\n\nPihak berwenang Inggris belum dapat dihubungi untuk dimintai komentar."
 news.44.a: "Menarik."
 news.44.b: "Wahnsinn!"
 news.44.c: "Pergi ke Menara London bersamanya!"
 news.45.t: "Kematian Rudolf Hess"
 news.45.d: "Wakil Führer Rudolf Hess tewas kemarin ketika Angkatan Udara Kerajaan mencegat pesawat tempur berat yang ia kemudikan di lepas pantai Skotlandia.\n\nTujuan pasti dari misinya masih belum jelas — kendati Hess adalah penerbang berpengalaman, ia terbang sendirian dan pesawatnya tampaknya tidak dipersenjatai.\nJenazahnya berhasil dievakuasi oleh otoritas Britania, namun upacara pemakaman kenegaraan dengan peti kosong telah dijadwalkan di Berlin.\n\nHitler dilaporkan sangat terpukul atas kematian sahabat lamanya itu."
 news.45.a: "Menarik."
 news.45.b: "Si bodoh yang malang itu."
 news.45.c: "Apa yang dia lakukan di sini?"
 news.46.d: "Kapal udara Hindenburg menemui akhir yang dramatis hari ini ketika meledak di atas langit Skotlandia.\nKapal tersebut tampaknya dibajak oleh Wakil Führer Rudolf Hess, yang berhasil menerbangkannya seorang diri melintasi Laut Utara dalam misi pribadi untuk merundingkan perdamaian dengan Britania.\nStasiun-stasiun radar Britania tak kesulitan mendeteksi pesawat raksasa itu, dan beberapa skuadron Angkatan Udara Kerajaan segera dikerahkan menuju posisinya. Ketika Hindenburg gagal merespons panggilan radio, mereka melepaskan tembakan.\n\nHess terjun payung menyelamatkan diri dan kini dijebloskan ke Menara London."
 news.47.d: "Kapal udara Hindenburg menemui akhir yang dramatis hari ini ketika meledak di atas langit Skotlandia.\nKapal tersebut tampaknya dibajak oleh Wakil Führer Rudolf Hess, yang berhasil menerbangkannya seorang diri melintasi Laut Utara dalam misi pribadi untuk merundingkan perdamaian dengan Britania.\nStasiun radar Britania tak kesulitan melacak pesawat raksasa tersebut, dan beberapa skuadron Angkatan Udara Kerajaan segera dikerahkan ke posisinya. Ketika Hindenburg tidak membalas panggilan radio, mereka langsung melepaskan tembakan.\n\nJasad Hess ditemukan di antara puing-puing reruntuhan."
 news.47.b: "Orang gila itu..."
 news.47.c: "Apa yang ingin dia capai?"
 news.48.t: "Amelia Earhart Hilang"
 news.48.d: "Penerbang terkenal Amelia Earhart, wanita pertama yang menyelesaikan penerbangan solo melintasi Atlantik, telah menghilang bersama navigatornya, Fred Noonan, dekat Pulau Howland di tengah Samudra Pasifik.\n\nKeduanya mencoba penerbangan keliling dunia dengan pesawat Lockheed Electra bermesin ganda ketika mereka menghilang.\n\nPencarian terhadap penerbang yang hilang kini dilakukan oleh Angkatan Laut dan Penjaga Pantai A.S., namun harapan untuk menemukan mereka kecil."
 news.48.a: "Kerugian bagi dunia penerbangan."
 news.49.t: "Amelia Earhart Kelilingi Dunia"
 news.49.d: "Penerbang termasyhur Amelia Earhart, yang dijuluki banyak orang sebagai 'Ratu Angkasa,' telah menuntaskan penerbangan keliling dunia bersama navigatornya Fred Noonan.\n\nSetelah kepanikan singkat ketika keduanya sempat tersesat saat mendekati Pulau Howland di Pasifik, penerbangan berlanjut tanpa kendala dan pagi ini pesawat Lockheed Electra mereka mendarat di Oakland, California.\n\nSebuah upacara perayaan akan diselenggarakan di Gedung Putih pekan depan, di mana Earhart akan diberi ucapan selamat secara langsung oleh Presiden atas prestasinya yang gemilang."
 news.49.a: "Sebuah pencapaian yang luar biasa!"
 news.55.t: "Aliansi Anglo-Polandia"
 news.55.d: "Mengingat perilaku agresif Jerman baru-baru ini, Inggris dan Prancis merasa harus menandatangani aliansi militer dengan Polandia. Perdana Menteri Inggris membuat pernyataan berikut di House of Commons:\n\n'Jika terjadi tindakan apa pun yang jelas-jelas mengancam kemerdekaan Polandia, dan oleh karena itu Pemerintah Polandia menganggap penting untuk melawan dengan kekuatan nasionalnya, Pemerintahan Yang Mulia akan segera merasa terikat untuk memberikan semua dukungan kepada Pemerintah Polandia sesuai dengan kekuasaannya. Mereka telah memberikan jaminan kepada Pemerintah Polandia mengenai hal ini.'"
 news.55.a: "Segalanya bergerak cepat sekarang."
 news.55.b: "Mereka menggertak!"
 news.55.c: "Kami mendukung Polandia."
 news.55.e: "Jerman tidak akan berani menyerang sekarang!"
 news.55.f: "Kami mendukung sekutu kami."
 news.56.t: "Perjanjian Munich"
 news.56.d: "Tuntutan Jerman atas wilayah Sudetenland di Cekoslowakia, yang dihuni oleh populasi minoritas Jerman dalam jumlah besar, kian meningkat tajam.\n\nDalam konferensi tingkat tinggi di Munich, Jerman, Britania Raya, Prancis, dan Italia berupaya mencari jalan keluar diplomatik bagi apa yang disebut sebagai 'Krisis Sudetenland.' Cekoslowakia sendiri tidak diundang hadir. Sebuah kesepakatan tercapai di mana Jerman mencaplok Sudetenland, namun berjanji tidak akan lagi mengejar perluasan wilayah di Eropa.\n\nTn. Chamberlain berpidato di hadapan khalayak di London:\n'Untuk kedua kalinya seorang Perdana Menteri kembali dari Jerman dengan membawa perdamaian yang terhormat. Saya meyakini inilah perdamaian untuk zaman kita.'"
 news.56.a: "Tidak ada perang tahun ini."
 news.56.b: "Damai setidaknya untuk saat ini..."
 news.56.c: "Kita telah terhindar dari Perang Dunia lagi."
 news.56.e: "Ini bukan perjanjian, ini diktat!"
 news.57.t: "Krisis Sudetenland"
 news.57.d: "Tuntutan Jerman terhadap wilayah perbatasan Sudeten di Cekoslowakia, yang merupakan rumah bagi sebagian besar minoritas Jerman, semakin meningkat akhir-akhir ini.\n\nPada pertemuan puncak yang diadakan di Munich, Jerman, Inggris, Perancis dan Italia berusaha untuk menemukan solusi diplomatik terhadap apa yang disebut 'Krisis Sudeten.'\n\nPerundingan tersebut tampaknya gagal, namun Inggris dan Sekutunya memberikan peringatan keras kepada Jerman bahwa jika pasukannya melintasi perbatasan Cekoslowakia, akibatnya adalah perang.\n\nWaktu tampaknya hampir habis untuk penyelesaian perselisihan secara damai."
 news.57.a: "Sepertinya akan ada perang!"
 news.57.b: "Orang-orang bodoh!"
 news.57.c: "Sudah waktunya untuk mengambil sikap."
 news.57.e: "Biarkan Jerman datang!"
 news.58.d: "Tuntutan Jerman atas wilayah perbatasan Sudetenland di Cekoslowakia, yang dihuni oleh minoritas Jerman yang signifikan, kian memanas akhir-akhir ini.\n\nDalam konferensi di Munich, Jerman, Britania Raya, Prancis, dan Italia berusaha mencari solusi diplomatik atas 'Krisis Sudetenland.'\n\nPerpecahan telah terjadi antara Prancis dan Britania, di mana Britania menganggap klaim Jerman beralasan, sedangkan Prancis menolaknya. Pihak Prancis telah membentuk persekutuan baru dengan bangsa Ceko, dan mengancam Jerman dengan perang jika pasukannya melanggar kedaulatan perbatasan Cekoslowakia."
 news.58.b: "Kami akan segera menangani Prancis."
 news.58.c: "Kali ini Prancis sendirian."
 news.58.e: "Jerman tidak akan berani menyerang sekarang... bukan?"
 news.58.f: "Dunia bebas bergantung pada kita."
 news.59.t: "Diktat Munich"
 news.59.d: "Tuntutan Jerman atas wilayah perbatasan Sudetenland di Cekoslowakia, yang menjadi rumah bagi banyak minoritas Jerman, kian gencar belakangan ini.\n\nDalam konferensi tingkat tinggi di Munich, Jerman, Britania Raya, Prancis, dan Italia berusaha merumuskan solusi diplomatik terhadap 'Krisis Sudetenland.'\n\nSementara Britania dan Prancis sama-sama menerima tuntutan Jerman sebagai hal yang wajar, Cekoslowakia, yang sengaja tidak diundang dalam konferensi itu, menolak menyerahkan sejengkal tanah pun.\n\nKini negeri tersebut harus menghadapi Jerman seorang diri dalam apa yang tampak sebagai pertempuran yang mustahil dimenangkan."
 news.59.a: "Segalanya tampak suram bagi Ceko."
 news.59.b: "Orang-orang keras kepala yang bodoh."
 news.59.c: "Kita tidak akan pernah menyerah!"
 news.60.t: "Nasib Cekoslowakia"
 news.60.d: "Pasukan Jerman telah melintasi perbatasan memasuki Bohemia dan Moravia, dengan dalih memulihkan ketertiban menyusul runtuhnya pemerintahan Cekoslowakia.\n\nDi Praha, pasukan pendudukan mengumumkan pembentukan 'protektorat otonom' di dalam lingkungan Reich Jerman.\n\nDengan sokongan Jerman, Slowakia telah memproklamasikan kemerdekaannya di bawah kepemimpinan Jozef Tiso. Negara Cekoslowakia kini tinggal sejarah."
 news.60.d_2: "Menyusul aneksasi Cekoslowakia oleh Jerman, perdebatan berlanjut mengenai bagaimana wilayah-wilayah ini seharusnya dibagi, dan kini tampaknya sebuah kesimpulan telah dicapai.\n\nDengan sokongan Jerman, Slowakia telah dinyatakan merdeka di bawah kepemimpinan Jozef Tiso."
 news.60.a: "Begitu banyak untuk perdamaian."
 news.60.b: "Ceko harus dilindungi dari diri mereka sendiri."
 news.60.c: "Ini bukan hal yang kita sepakati!"
 news.60.e: "Hongaria akan dikembalikan ke kejayaannya!"
 news.61.d: "Pasukan Jerman baru-baru ini melintasi Bohemia dan Moravia, dengan dalih memulihkan ketertiban di kawasan tersebut pasca-runtuhnya pemerintah Cekoslowakia.\n\nDi Praha, pasukan pendudukan mengumumkan pendirian 'protektorat otonom' di dalam [GER.GetNameDef]. Pasukan Hungaria, yang bertindak atas persetujuan Jerman, telah berbaris memasuki Slowakia dan mencaploknya ke dalam pangkuan Hungaria.\n\nNegara Cekoslowakia kini telah tiada."
 news.61.d_2: "Pasca-aneksasi Cekoslowakia oleh Jerman, pembahasan terus berlanjut tentang bagaimana wilayah-wilayah ini akan dibagi, dan kini kesepakatan tampaknya telah tercapai.\n\nPasukan Hungaria, bertindak dengan izin dari Jerman, telah berbaris menuju Slowakia dan mencaploknya ke dalam kekuasaan Hungaria."
 news.62.d: "Pasukan Jerman menerobos perbatasan Bohemia dan Moravia baru-baru ini, dengan dalih menjaga ketertiban umum di tengah keruntuhan pemerintah Cekoslowakia.\n\nDi Praha, tentara pendudukan mengumumkan pembentukan 'protektorat otonom' di dalam batas Reich Jerman.\n\nProtektorat kedua yang berpusat di Slowakia juga diumumkan di Bratislava. Seluruh Cekoslowakia secara efektif telah dianeksasi ke dalam kekuasaan Jerman."
 news.62.d_2: "Setelah aneksasi Cekoslowakia oleh Jerman, pembahasan tetap berlanjut mengenai bagaimana pembagian wilayah ini diatur, dan kini tampaknya suatu keputusan telah diambil.\n\nWilayah yang dianeksasi diorganisasi menjadi dua protektorat, namun tetap berada di bawah kendali penuh Jerman. Dalam praktiknya, hampir tidak ada yang berubah, dan Jerman tetap menguasai seluruh Cekoslowakia."
 news.63.t: "Perang Saudara Spanyol"
 news.63.d: "Perang saudara telah meletus di Spanyol! Beberapa jenderal yang berusaha menggulingkan pemerintahan saat ini di Madrid telah mengeluarkan pronunciamento, dan sebagian besar Angkatan Bersenjata Spanyol telah menjawab seruan mereka untuk mengangkat senjata.\n\nFaksi Nasionalis sayap kanan ini telah menduduki sebagian besar Spanyol, termasuk wilayah seberang laut.\nPasukan loyalis dan sukarelawan telah berkumpul di bawah pemerintahan Partai Republik yang berhaluan kiri, bertekad untuk melawan kudeta hingga nafas terakhir mereka.\n\nPertempuran untuk Spanyol telah dimulai."
 news.63.a: "Apa dampaknya bagi Spanyol?"
 news.63.b: "Menuju kemenangan!"
 news.64.t: "Berakhirnya Perang Saudara Spanyol"
 news.64.d: "Dengan menyerahnya benteng-benteng pertahanan Republik yang terakhir, Perang Saudara Spanyol telah resmi berakhir.\n\nPihak Nasionalis tampil sebagai pemenang, dan sebuah era baru telah bermula bagi Spanyol.\n\nNegeri yang luluh lantak akibat perang ini menderita kepedihan luar biasa sepanjang pertempuran, dan begitu banyak pekerjaan pembangunan kembali yang menanti di depan mata."
 news.64.a: "Sebuah perkembangan yang menarik."
 news.64.b: "Sekarang untuk menyembuhkan bangsa kita."
 news.65.a: "Bagus untuk Spanyol."
 news.65.d: "Dengan menyerahnya unit-unit terakhir pasukan Nasionalis, Perang Saudara Spanyol telah resmi berakhir.\n\nPihak Republik berhasil keluar sebagai pemenang, dan fajar era baru kini menyingsing bagi Spanyol.\n\nNegeri yang tercabik perang ini menderita kerusakan parah dalam pertempuran, dan upaya rekonstruksi besar-besaran harus segera dijalankan."
 news.66.t: "Olimpiade Musim Panas XI"
 news.66.d: "Olimpiade kesebelas baru-baru ini diadakan di Berlin, Jerman.\n\nDihadiri oleh atlet dari 49 negara berbeda di seluruh dunia, Olimpiade Musim Panas 1936 adalah yang pertama dalam sejarah yang menikmati liputan televisi langsung secara terbatas. Pertandingan tersebut merupakan kemenangan propaganda yang signifikan bagi rezim Jerman, yang menghabiskan banyak uang untuk acara tersebut.\n\nAtlet Jerman meraih kesuksesan paling besar, memenangkan 33 medali emas, sementara Amerika berada di urutan kedua, dengan 24 medali. Empat di antaranya dimenangkan oleh Jesse Owens, satu-satunya atlet paling sukses di Olimpiade tersebut."
 news.66.d.b: "Olimpiade ke-11 baru-baru ini diselenggarakan di kawasan-kawasan yang terbebas dari kehancuran di Berlin yang tengah dibangun kembali, Jerman.\n\nDihadiri oleh atlet dari 49 bangsa berbeda di dunia, Olimpiade Musim Panas 1936 menjadi yang pertama dalam sejarah yang menikmati siaran televisi langsung secara terbatas. Perhelatan akbar ini, sebuah simbol pemulihan persatuan nasional Jerman, juga menjadi kemenangan propaganda bagi rezim baru Jerman yang jor-joran mendanai acara tersebut meski biaya rekonstruksi pascaperang saudara teramat mahal.\n\nAtlet Jerman meraih kejayaan terbesar dengan menggondol 33 medali emas, sementara kontingen Amerika menyusul di peringkat kedua dengan 24 emas. Empat medali di antaranya disabet oleh Jesse Owens, atlet paling bersinar sepanjang pesta olahraga ini."
 news.66.a: "Pertandingan telah selesai."
 news.66.b: "Kami telah menunjukkan sisi terbaik kami kepada dunia."
 news.67.t: "Olimpiade Musim Panas XII"
 news.67.d: "Olimpiade ke-12 baru saja dilangsungkan di Tokyo, Jepang. Mengingat meningkatnya ketegangan internasional, banyak kalangan sebelumnya mencemaskan ajang ini akan dibatalkan, namun kekhawatiran itu tidak terbukti.\n\nTokyo menjadi kota non-Barat pertama yang menjadi tuan rumah Olimpiade, dan sebuah pesawat jarak jauh Me 261 yang dirancang khusus membawa Api Olimpiade dari Jerman ke sana tanpa henti untuk mengisi bahan bakar.\n\nPara atlet Jepang menorehkan prestasi gemilang, dan raihan 14 medali emas menempatkan mereka di posisi ketiga dalam perolehan medali, di belakang Jerman dan Amerika Serikat."
 news.68.d: "Olimpiade ke-12 baru-baru ini dihelat di Helsinki, Finlandia.\n\nAjang Olimpiade ini mulanya dijadwalkan bertempat di Tokyo, namun keterlibatan Jepang dalam perang berkepanjangan membuat rencana tersebut mustahil dijalankan sehingga Komite Olimpiade Internasional mengalihkannya ke Helsinki.\n\nPara atlet dari Amerika Serikat meraup medali terbanyak, disusul oleh Jerman dan kemudian Italia. Finlandia finis di posisi keempat dengan torehan 10 medali emas mereka."
 news.69.t: "Ekspansi Soviet di Eropa"
 news.69.d: "Sejak naiknya [From.GetRulingParty] ke tampuk kekuasaan, [From.GetNameDef] terus membina hubungan yang semakin erat dengan [SOV.GetNameDef], dan kini bahkan telah bergabung ke dalam Uni Soviet itu sendiri.\n\nSejak beberapa hari lalu, pemerintah [From.GetAdjective] secara resmi menyerahkan kendali negara kepada [SOV.GetNameDef] sebagai sebuah oblast terintegrasi.\n\nPara pejabat Soviet menolak anggapan bahwa asimilasi [From.GetNameDef] belakangan ini bersifat agresif, seraya mengklaim bahwa 'integrasi wilayah' tersebut berlangsung murni tanpa tekanan dari luar."
 news.69.a: "Mereka telah melihat alasannya."
 news.69.b: "[SOV.GetNameDefCap] berkembang."
 news.70.t: "Pengaruh Soviet di Eropa"
 news.70.d: "Sejak naiknya kekuasaan [baltic_annexation.GetRulingParty], [baltic_annexation.GetNameDef] telah mengupayakan hubungan yang lebih dekat dengan [SOV.GetNameDef].\n\nMeskipun [baltic_annexation.GetLeader] tetap menjabat, para menteri dipilih karena kesetiaan mereka kepada [SOV.GetNameDef], dan sebagian besar kedaulatan negara telah diserahkan. Pejabat Soviet menyatakan bahwa [baltic_annexation.GetName] hanya mencari perlindungan sebagai respons terhadap Eropa yang semakin tidak aman bagi negara-negara kecil.\n\n[SOV.GetNameDef] juga menegaskan bahwa mereka bersedia memperluas \"perlindungan\" tersebut ke negara mana pun yang merasa terancam oleh negara tetangga."
 news.100.t: "Jatuhnya Warsawa"
 news.100.d: "Pasukan Jerman yang maju di [POL.GetNameDef] telah berhasil merebut Warsawa.\n\nPertempuran sporadis berlanjut di Praga dan beberapa distrik lainnya, namun perlawanan terorganisir di kota tersebut tampaknya telah berhenti.\n\nPemerintah Polandia dilaporkan mengevakuasi kota tersebut ketika unit Jerman pertama memasuki pinggiran kota Warsawa, dan lokasi mereka saat ini tidak diketahui.\n\nPertempuran melawan penjajah Jerman terus berlanjut di bagian lain negara tersebut, namun hilangnya ibu kota adalah pukulan telak bagi upaya perang Polandia."
 news.100.a: "Polandia tidak punya peluang."
 news.100.b: "Kemenangan lain untuk Vaterland."
 news.100.c: "Ini adalah bencana!"
 news.101.t: "Jatuhnya Paris"
 news.101.d: "Di saat pertempuran masih membara di wilayah lain di [FRA.GetNameDef], laporan mengonfirmasi bahwa pasukan Jerman telah merangsek masuk ke Paris.\n\nIbu kota tersebut dinyatakan sebagai kota terbuka oleh militer Prancis sesaat sebelum unit-unit terakhir mereka ditarik mundur. Berbagai kolom pasukan Jerman mengulang parade kemenangan Prusia tahun 1871 dengan berbaris gagah menuruni Champs-Élysées sementara warga Paris menyaksikan dalam kebisuan yang terpukul.\n\nPara pengamat militer memperkirakan keruntuhan total [FRA.GetNameDef] tinggal menunggu waktu."
 news.101.a: "Tentara [GER.GetNameDefCap] sepertinya tak terhentikan!"
 news.102.t: "Jatuhnya London"
 news.102.d: "Laporan dari London membenarkan bahwa ibu kota Inggris tersebut telah jatuh ke tangan tentara Jerman yang terus merangsek maju.\n\nTembakan senjata ringan masih sesekali terdengar dari beberapa distrik, namun tidak ada lagi konsentrasi pasukan tempur Britania yang terlihat di dalam kota.\n\nSatu detasemen Fallschirmjäger telah menyerbu Istana Buckingham, kendati diyakini bahwa Keluarga Kerajaan telah dievakuasi jauh sebelum serangan dilancarkan.\n\nUntuk pertama kalinya sejak William Sang Penakluk, London telah takluk ke tangan penjajah asing."
 news.400.t: "Jatuhnya [43.GetCapitalVictoryPointName]"
 news.400.desc: "Kabar dari [43.GetCapitalVictoryPointName] mengonfirmasi bahwa ibu kota [HUN.GetAdjective] tersebut telah direbut oleh gerak maju pasukan [FROM.GetAdjective].\n\nTembakan senjata ringan masih terdengar dari beberapa perkubuan di tepi Sungai Donau, namun tidak ada unit besar pasukan [HUN.GetAdjective] yang terlihat di dalam batas kota.\n\nSebagian besar jembatan besar di atas sungai dilaporkan telah hancur diledakkan, dan beberapa sisanya telah jatuh ke bawah kekuasaan [FROM.GetNameDef].\nUntuk pertama kalinya dalam bertahun-tahun, Alun-alun Kossuth terdiam sunyi, dan Puri Buda kini dikuasai oleh tangan asing."
 news.400.a: "Pukulan telak bagi Roh [HUN.GetAdjective]"
 news.400.b: "Bagaimana kita bisa pulih?"
 news.401.t: "Jatuhnya [43.GetCapitalVictoryPointName]"
 news.401.desc: "Laporan dari [43.GetCapitalVictoryPointName] membenarkan bahwa ibu kota [HUN.GetAdjective] tersebut telah berhasil ditaklukkan oleh laju tentara [SOV.GetAdjective].\n\nSebagian besar sudut kota luluh lantak selama pengepungan brutal menjelang kejatuhannya, dan milisi-milisi setempat masih terlibat dalam pertempuran kecil melawan pasukan [SOV.GetAdjective], kendati peluang mereka sia-sia.\n\nPanji [SOV.GetAdjective] kini berkibar di atas Puri Buda, dan banyak politisi terkemuka [HUN.GetAdjective] telah tertawan dalam pertempuran baru-baru ini. Apakah ini lonceng kematian bagi [HUN.GetNameDef]?"
 news.401.a: "Sebuah perkembangan yang signifikan"
 news.401.b: "Kemenangan lain untuk ibu pertiwi!"
 news.401.c: "Kita mungkin lebih dekat ke akhir dari yang kita duga"
 news.103.t: "Jatuhnya [195.GetCapitalVictoryPointName]"
 news.103.d: "[195.GetCapitalVictoryPointName], tempat kelahiran Revolusi Rusia, akhirnya takluk ke tangan pasukan Jerman yang merangsek tanpa henti.\n\nPertempuran sporadis masih dapat didengar dari beberapa daerah pinggiran, namun keheningan yang mencekam tampak menyelimuti sisa-sisa kota yang telah hancur lebur.\n\nPagi hari tadi, barisan serdadu Jerman berbaris melintasi Katedral Santo Ishak, yang kubah megahnya sempat dicat abu-abu oleh korps zeni Angkatan Darat [SOV.GetSovietArmyAdjectiveBasedOnIdeology] demi mengelabui pandangan pesawat pengebom Luftwaffe yang mengintai.\nTerlepas dari upaya mereka, kubah tersebut kini penuh berlubang diterpa peluru dan serpihan pecahan bom."
 news.103.c: "Seseorang akan ditembak karena ini!"
 news.104.t: "Jatuhnya Kiev"
 news.104.d: "Kiev, ibu kota RSS Ukraina, telah direbut oleh pasukan penyerbu Jerman dalam operasi mereka di Uni Soviet.\n\nKehilangan salah satu kota terpenting ini menjadi pukulan telak bagi pihak Soviet, kendati masih menjadi tanda tanya apakah Jerman mampu mempertahankan momentum mereka. Sesaat setelah Jerman menduduki kota, ribuan ranjau yang dipasang oleh NKVD meledak serempak di gedung-gedung sepanjang jalan utama Khreshchatyk, menimbulkan kehancuran yang lebih parah di kota yang sudah porak-poranda tersebut.\n\nKini pasukan penyerbu mengalihkan pandangan tajam mereka ke arah timur."
 news.105.t: "Jatuhnya [217.GetCapitalVictoryPointName]"
 news.105.d: "Ujung tombak Jerman yang maju telah merebut Stalingrad, kota yang sama dengan Stalin di tepi Sungai Volga.\n\nSetelah berjuang melewati Pabrik Traktor Stalingrad yang hancur dan merebut dataran tinggi Mamayev Kurgan yang strategis dan penting, Jerman telah memaksa pasukan Soviet yang bertahan terakhir menyeberangi Volga ke pantai timurnya. Menurut laporan yang belum dikonfirmasi, pasukan Tentara Merah yang bertempur bersama dengan partisan telah mundur ke selokan dan ruang bawah tanah untuk melanjutkan perjuangan mereka.\n\nNamun diyakini tidak ada perlawanan terorganisir yang signifikan yang masih ada."
 news.105.d_alt: "Ujung tombak Jerman yang maju telah merebut [217.GetCapitalVictoryPointName], pusat industri di tepi Sungai Volga.\n\nSetelah berjuang melewati reruntuhan Pabrik Traktor [217.GetCapitalVictoryPointName] dan merebut ketinggian Mamayev Kurgan yang strategis dan penting, Jerman telah memaksa pasukan [SOV.GetAdjective] terakhir menyeberangi Volga ke pantai timurnya. Menurut laporan yang belum dikonfirmasi, perlawanan dari Tentara [SOV.GetSovietArmyAdjectiveBasedOnIdeology] yang bertempur bersama dengan partisan telah mundur ke selokan dan ruang bawah tanah untuk melanjutkan perjuangan mereka.\n\nNamun diyakini tidak ada perlawanan terorganisir yang signifikan yang masih ada."
 news.106.t: "Jatuhnya Moskwa"
 news.106.d: "Saat fajar menyingsing hari ini, divisi panzer Jerman menerobos barikade-barikade darurat di jalanan Moskwa dan kendaraan pengangkut lapis baja terlihat menurunkan pasukan Panzergrenadier di Lapangan Merah.\nAsap tebal membubung tinggi dari kobaran api yang melalap pinggiran kota saat infanteri Jerman menyerbu masuk ke Kremlin. Granat dan pelontar api dilaporkan harus digunakan untuk menumpas pertahanan gigih pasukan NKVD yang bertekad mempertahankan setiap jengkal kompleks istana itu. Ibu kota Rusia kini berada di bawah cengkeraman Jerman, meninggalkan kota yang menjadi puing-puing membara.\n\nLaporan yang belum dikonfirmasi menyebutkan jenazah awetan Lenin telah berhasil dievakuasi ke timur dengan aman."
 news.106.a: "Apakah ini akhir dari Uni Soviet?"
 news.106.b: "Akhirnya, Moskau menjadi milik kita!"
 news.106.c: "Kaum fasis harus diusir dari Moskow!"
 news.107.t: "Jatuhnya Sevastopol"
 news.107.d: "Kota Sevastopol yang dibentengi dengan kokoh, pangkalan utama Armada Laut Hitam Soviet, akhirnya menyerah di bawah gempuran tentara Jerman.\n\nKehilangan pangkalan ini akan melumpuhkan setiap upaya Soviet untuk menguasai perairan Laut Hitam, dan jatuhnya kota tersebut dipandang sebagai kemenangan Jerman yang sangat penting.\n\nSebuah dekret telah dikeluarkan dari Berlin yang menetapkan bahwa mulai saat ini kota tersebut akan dinamai 'Theodorichshafen', diambil dari nama Theodoric yang Agung."
 news.108.t: "Jatuhnya Baku"
 news.108.d: "Pagi hari tadi, pasukan Jerman berhasil menduduki kota Baku, sebuah sasaran strategis yang teramat vital dalam perang mereka melawan Uni Soviet.\n\nTerletak di pesisir Laut Kaspia, kota ini merupakan kunci utama penguasaan wilayah Kaukasus, dan ladang-ladang minyaknya yang melimpah dipastikan akan mendongkrak mesin perang Jerman.\n\nPenguasaan kota ini menempatkan Jerman dalam posisi strategis untuk memperluas perang ke Timur Tengah dan bahkan berpotensi menuju India."
 news.109.t: "Jatuhnya Kairo"
 news.109.d: "Pasukan dari Deutsches Afrikakorps telah berjuang menuju Kairo, ibu kota Mesir.\n\nSaat pasukan Sekutu mundur lebih jauh ke padang pasir dalam kekacauan, tentara Jerman yang berbaris melalui Kairo disambut sebagai pembebas oleh banyak warga yang menganggap Inggris sebagai penindas.\n\nJatuhnya Kairo merupakan kerugian besar bagi upaya perang Sekutu, dan beberapa ahli berspekulasi bahwa seluruh Timur Tengah kini terbuka untuk penaklukan Jerman."
 news.110.t: "Jatuhnya Washington"
 news.110.d: "Pertempuran di wilayah Washington D.C. berakhir hari ini, ketika kantong perlawanan terakhir di kota tersebut dilenyapkan oleh pasukan Jerman yang maju di sepanjang Potomac.\n\nLapisan asap tebal menyelimuti kota, dan setidaknya sebagian dilaporkan berasal dari agen OSS yang membakar dokumen sensitif hingga saat-saat terakhir. Sebuah detasemen Waffen-SS mengamankan Gedung Putih setelah baku tembak singkat dengan anggota Dinas Rahasia AS, namun diyakini bahwa Presiden telah dievakuasi dengan aman beberapa hari yang lalu.\n\nJatuhnya ibu kota Amerika menggambarkan dahsyatnya keperkasaan mesin perang Jerman."
 news.111.t: "Jatuhnya New York"
 news.111.d: "Setelah berjam-jam peperangan jalanan, yang sebagian besar dilaporkan melawan laskar bersenjata, ujung tombak Jerman telah maju ke Kota New York dan menguasai kota tersebut.\n\nPerbaikan penghalang anti-tank yang ditempatkan di sepanjang Fifth Avenue terbukti tidak efektif, dan Panzergrenadier berjuang melewati Manhattan, blok demi blok.\n\nKebakaran berkobar tak terkendali di bagian timur kota selama beberapa hari, menerangi cakrawala di malam hari.\n\nPatung Liberty dipenggal oleh peluru artileri nyasar, meskipun pihak mana yang menembakkannya masih menjadi perdebatan."
 news.112.t: "Jatuhnya Gibraltar"
 news.112.d: "Menyusul berbagai laporan simpang siur, kini telah dipastikan bahwa Gibraltar telah jatuh ke tangan Jerman.\n\nKota pelabuhan strategis ini mengawal pintu masuk ke Laut Tengah, dan sebelum perang meletus kota ini dipandang luas sebagai benteng yang mustahil ditembus. Garnisun Britania sempat mundur ke dalam labirin terowongan di bawah Karang Gibraltar, namun pada akhirnya berhasil dihalau keluar oleh semburan pelontar api dan lemparan granat.\n\nDengan jatuhnya Gibraltar ke tangan Jerman, perimbangan kekuatan dalam Pertempuran Mediterania telah bergeser secara dramatis."
 news.113.d: "Tentara Italia yang gembira memasuki Kairo hari ini, beberapa saat setelah unit terakhir Inggris mundur dari kota tersebut.\n\nParade kemenangan segera diselenggarakan, dan tentara Italia berbondong-bondong ke Piramida Agung Giza untuk berfoto di depan landmark terkenal.\n\nDengan kendali Kairo, [ITA.GetLeader] kini selangkah lebih dekat untuk menghubungkan Afrika Timur Italia dengan Libya Italia dan membentuk koloni yang berdekatan di Afrika."
 news.113.b: "Penaklukan lain untuk Italia!"
 news.114.d: "[GetItalianConquestofParisDesc]"
 news.114.d_leader: "Kantong-kantong terakhir perlawanan Prancis di Paris telah disapu bersih hari ini, dan kota tersebut kini sepenuhnya berada di bawah kendali Italia.\n\n[ITA.GetLeader] diterbangkan secara tergesa-gesa untuk memimpin parade kemenangan di Champs-Élysées, menunggangi kuda jantan putih di depan barisan prajurit yang berbaris gagah. Sepanjang perayaan, ia membandingkan kampanye militer di Prancis saat ini dengan penaklukan Galia oleh Julius Caesar, dan bersumpah bahwa ini hanyalah awal dari kebangkitan Italia menuju kejayaan sejati.\n\nWaktu yang akan membuktikan kebenarannya."
 news.114.d_council: "Kantong-kantong terakhir perlawanan Prancis di Paris telah disapu bersih hari ini, dan kota tersebut kini sepenuhnya berada di bawah kendali Italia.\n\n[ITA.GetLeader] diterbangkan secara tergesa-gesa untuk mengikuti parade kemenangan di Champs-Élysées, menunggangi kuda-kuda jantan putih di depan pasukan yang melangkah tegap. Selama perayaan, perbandingan antara operasi militer di Prancis saat ini dengan penaklukan Galia oleh Caesar dikemukakan, dan janji bahwa ini hanyalah awal dari kebangkitan Italia menuju kejayaan dilontarkan oleh beberapa anggota dewan.\n\nWaktu yang akan membuktikan apakah mereka benar."
 news.115.d: "Pasukan Italia berhasil menyerbu London, dan bendera il Tricolore telah dikibarkan di atas Menara Victoria. Pertempuran kecil masih terjadi di beberapa sudut kota, dan dalam sebuah insiden pagi ini beberapa prajurit Bersaglieri tewas ditembak oleh penembak runduk yang bersembunyi di puncak Big Ben.\n\nSetelah tiga kali upaya gagal untuk melumpuhkan mereka, seluruh menara jam tersebut akhirnya diledakkan hingga runtuh oleh bahan peledak penghancur, dalam apa yang digambarkan oleh pejabat Italia sebagai 'reaksi berlebihan yang disesalkan' dari komandan setempat."
 news.116.d: "Italia tampaknya telah memegang kendali penuh atas Gibraltar, menyusul apa yang dilaporkan sebagai pertempuran sengit di sekitar Karang Gibraltar dan area pelabuhan. Dentuman ledakan sesekali masih terdengar dari terowongan militer jauh di bawah batu karang, namun pihak militer Italia menyatakan bahwa seluruh perlawanan terorganisasi telah dipadamkan.\n\nDengan dikuasainya gerbang vital menuju Laut Tengah ini oleh Italia, armada laut Britania akan menghadapi kesulitan besar untuk menantang dominasi Regia Marina di kawasan tersebut."
 news.117.t: "Jatuhnya Singapura"
 news.117.d: "Singapura, 'Gibraltar dari Timur,' telah direbut oleh angkatan perang Kekaisaran Jepang kendati sebelumnya dianggap sebagai benteng yang tak tergoyahkan oleh penguasa kolonial Britania.\n\nPemerintahan Militer Jepang di Singapura telah memilih Gedung Fullerton sebagai markas besarnya, dan kota tersebut diganti namanya menjadi Syonanto, yang secara kasar bermakna 'Pulau Selatan yang diraih pada zaman Showa.' Polisi militer Kempeitai tampak berpatroli massal di jalan-jalan kota untuk menegaskan pesan bahwa bangsa Jepang telah hadir untuk menetap."
 news.117.b: "Demi Kaisar!"
 news.118.t: "Jatuhnya Pearl Harbor"
 news.118.d: "Pasukan Jepang telah menyerbu dan merebut Honolulu, kota terbesar di pulau O'ahu, Hawaii. Pangkalan angkatan laut di Pearl Harbor, bekas markas besar Armada Pasifik AS, juga telah jatuh.\n\nMenurut para saksi, para pelaut dan Marinir Amerika yang terkepung mundur ke Pulau Ford, di mana mereka terus memberikan perlawanan keras kepala hingga mereka menjadi sasaran serangan artileri dan pemboman udara yang hebat. Dengan pulau ini berada di bawah kendalinya, jangkauan panjang Angkatan Laut Kekaisaran Jepang menjadi semakin besar."
 news.119.t: "Jatuhnya New South Wales"
 news.119.d: "Memperluas penaklukannya di selatan, Kekaisaran Jepang telah merebut Sydney dan ibu kota Australia, Canberra. Pasukan pembela setempat terpaksa mundur melintasi Jembatan Pelabuhan Sydney menuju posisi baru di Bukit Observatorium, namun upaya untuk meledakkan jembatan digagalkan oleh gerak cepat pasukan Jepang yang kemudian terus merangsek maju merebut Canberra.\n\nBendera perang Jepang kini tampak berkibar di Gedung Parlemen di Canberra, yang difungsikan sebagai markas administrasi militer baru setempat, sementara polisi militer Kempeitai mengawasi jalan-jalan kota dengan ketat."
 news.120.t: "Jatuhnya Los Angeles"
 news.120.d: "Setelah berhasil menancapkan pijakan di daratan utama Amerika, pasukan Jepang bergerak mengepung Los Angeles dan memorak-porandakan barisan pertahanan kota tersebut. Iring-iringan panjang pasukan Kekaisaran berbaris melintasi Central Avenue sore ini sementara juru kamera warta berita Jepang mengabadikan peristiwa bersejarah itu.\n\nSebelum pasukan Amerika ditarik mundur, pertempuran dilaporkan berkecamuk hebat di berbagai penjuru kota. Hollywood menderita kehancuran yang sangat parah, dan banyak perwira Jepang berpose mengambil foto di depan Papan Tanda Hollywood yang telah berlubang-lubang dan nyaris runtuh."
 news.121.t: "Jatuhnya Nanjing"
 news.121.d: "Ibu kota Republik Tiongkok, Nanjing, telah diduduki oleh pasukan Kekaisaran Jepang. Meskipun mendapat perlawanan sengit dari para pembela Tiongkok di kota bertembok itu, pasukan Jepang berhasil merebut Gerbang Zhongshan dan berhasil memasuki kota.\n\nTembakan sporadis masih terdengar dan beberapa kebakaran berkobar di berbagai bagian kota, namun sebagian besar pasukan Tiongkok yang masih hidup telah ditarik atau ditangkap. Seiring dengan direbutnya Shanghai, ini merupakan kemenangan signifikan bagi Jepang dalam perang melawan Tiongkok."
 news.122.t: "Jatuhnya Vladivostok"
 news.122.d: "Vladivostok, kota terbesar di Timur Jauh Rusia dan pangkalan Armada Pasifik Soviet, telah diserbu dan direbut oleh tentara Jepang. Letak strategisnya di ujung Jalur Kereta Api Trans-Siberia membuat kehilangannya menjadi pukulan yang sangat telak bagi upaya perang Soviet di Asia.\n\nBanyak penduduk kota ini masih mengingat pendudukan Jepang yang berlangsung selama beberapa tahun semasa Perang Saudara Rusia. Kali ini, sebagian warga mencemaskan pasukan penyerbu tak akan pernah pergi lagi."
 news.123.t: "Jatuhnya Hong Kong"
 news.123.d: "Pasukan dari Kekaisaran Jepang telah merebut Koloni Kerajaan Inggris di Hong Kong setelah menerobos Jalur Peminum Gin dan mendarat di Pulau Hong Kong itu sendiri. Situasi segera menjadi tidak dapat dipertahankan bagi para pembela HAM, dan Gubernur menyerah secara langsung di hotel Peninsula Hong Kong tempat Jepang mendirikan markas besar mereka.\n\nSetelah upacara singkat, gubernur Jepang baru dilantik dan mengumumkan 'Hong Kong Baru' kepada dunia, 'bebas dari kolonialisme Barat.'"
 news.124.t: "Jatuhnya Manila"
 news.124.d: "Manila, ibu kota Filipina, telah jatuh ke tangan Jepang menyusul penarikan mundur pasukan gabungan Amerika dan Filipina. Pintu masuk ke Teluk Manila yang bernilai vital sempat diperebutkan beberapa saat setelah runtuhnya kota karena keberadaan artileri pantai Amerika di Pulau Corregidor, namun meriam-meriam tersebut akhirnya terbungkam setelah gempuran terpadu Jepang.\n\nDengan Manila di bawah kendali Jepang, sisa wilayah Filipina diperkirakan akan segera menyusul dalam waktu dekat. Ini merupakan kekalahan pahit yang memalukan bagi angkatan bersenjata Amerika di Asia dan Pasifik."
 news.125.t: "Jatuhnya Kalkuta"
 news.125.d: "Menyusul bombardir artileri yang bertubi-tubi, kini telah dipastikan bahwa kota Kalkuta di India telah jatuh ke tangan pasukan Jepang yang bergerak maju. Bahkan ketika pertempuran sporadis masih meletus di pinggiran kota, parade kemenangan segera digelar di jalan Chowringhee.\n\nAnggota Tentara Nasional India (INA), sebuah kesatuan militer bentukan Jepang yang berdedikasi membebaskan India dari kekuasaan Britania, ikut serta dalam parade tersebut dan disambut sorak-sorai riuh dari kerumunan massa. Dengan runtuhnya Kalkuta, banyak pihak meramalkan seluruh wilayah India Britania akan segera menyusul."
 news.126.t: "Jatuhnya New Delhi"
 news.126.d: "Serangan besar-besaran Jepang terus berlanjut di India, dan kejatuhan New Delhi baru saja terjadi. Sebagai pusat pemerintahan India Britania, kota ini memiliki nilai strategis yang tak terhingga dan kehilangannya bisa menjadi faktor penentu dalam kampanye militer di India.\n\nSang Raja Muda (Viceroy) sendiri dilaporkan tertangkap oleh unit garis depan Jepang saat tengah mengawasi pemindahan barang-barang pribadinya dari Istana Raja Muda ke dalam iring-iringan truk, kendati kabar ini belum dikonfirmasi secara resmi."
 news.127.t: "Jatuhnya Terusan Panama"
 news.127.d: "Dalam sebuah peristiwa yang menjadi pukulan luar biasa dahsyat bagi upaya perang Amerika Serikat, pasukan Jepang telah mendarat di Panama dan merebut kendali atas terusan setelah memaksa garnisunnya menyerah. Beberapa kelompok serdadu Amerika dan Panama dilaporkan melarikan diri ke dalam hutan rimba terdekat untuk melancarkan perang gerilya, namun mereka diyakini tak sanggup mengancam keberadaan militer Jepang secara berarti.\n\nDengan jatuhnya terusan ini, kapal-kapal perang Amerika kini harus mengitari ujung selatan Amerika Selatan untuk mencapai Pantai Barat AS, memberi Angkatan Laut Kekaisaran Jepang keunggulan strategis yang mutlak."
 news.128.t: "Jatuhnya Berlin"
 news.128.d: "Perebutan ibu kota Jerman telah dikonfirmasi oleh para pejabat di Washington, setelah pasukan AS menyerbu Berlin dari beberapa arah. Pertempuran di kota digambarkan sebagai pertempuran sengit, dengan Jembatan Moltke dihancurkan oleh para pionir Jerman yang putus asa untuk menghentikan kemajuan Amerika.\n\nJembatan lain di atas Spree akhirnya diamankan, dan GI berhasil menyerbu Gedung Opera Kroll dan Reichstag meskipun ada perlawanan sengit dari Jerman. Bintang dan Garis kini berkibar tertiup angin di atas Reichstag, dan pertempuran di kota telah berhenti. Pertempuran Berlin telah berakhir."
 news.128.b: "Operasi buku teks!"
 news.129.d: "Pasukan Britania telah merangsek masuk ke Berlin, dan Kabinet Perang mengumumkan keberhasilan merebut ibu kota Jerman setelah pertempuran yang menegangkan. Menyerang pada saat fajar, pasukan komando Britania menduduki Bandara Tempelhof sementara kolom-kolom divisi lapis baja melaju di sepanjang Frankfurter Allee.\n\nDengan jatuhnya Reichskanzlei ke bawah kekuasaan Britania, pertempuran di kota tersebut sebagian besar telah reda. Keberadaan jajaran pemerintah Jerman saat ini belum jelas, namun diyakini setidaknya sebagian pejabat penting telah meloloskan diri sebelum kota tersebut takluk."
 news.129.b: "Kerja bagus yang bagus, teman-teman!"
 news.130.d: "Pasukan Prancis berhasil menyerbu masuk ke ibu kota Jerman, yang akhirnya takluk setelah serangkaian pertempuran sengit di dalam batas kota. Sekelompok besar prajurit Waffen-SS sempat membarikade diri mereka di Olympiastadion, yang akhirnya berhasil direbut menyusul serangan gigih Legiun Asing yang disokong tembakan artileri berat.\n\nBendera triwarna Prancis kini tampak berkibar di atas Reichskanzlei, dan kendati tembakan sporadis masih dilaporkan terdengar di pinggiran kota, sebagian besar Berlin diyakini telah bersih dari perlawanan terorganisasi."
 news.130.b: "Hidup Prancis! (Vive la France!)"
 news.131.d: "Pertempuran sengit dilaporkan terjadi di Berlin, ibu kota Jerman, namun kini diyakini bahwa kota tersebut sepenuhnya berada di tangan Polandia. Setelah maju di sepanjang Frankfurter Allee, pasukan Polandia mencapai Alexanderplatz yang merupakan lokasi pertempuran sengit.\n\nDi tempat lain di kota, Gerbang Brandenburg runtuh, diduga setelah ditabrak oleh tank Polandia, dan Gedung Opera Kroll diratakan oleh serangan artileri setelah para pembela SS yang keras kepala menolak untuk menyerah. Bendera merah putih Polandia kini berkibar di atas Reichstag, dan kantong-kantong perlawanan terakhir telah berhasil diatasi."
 news.131.b: "Raksasa Polandia tidak bisa dihentikan."
 news.132.t: "Jatuhnya Roma"
 news.132.d: "Pasukan Sekutu baru-baru ini melangkah masuk ke Roma menyusul penyerahan diri garnisunnya, dan kota tersebut kini berada di bawah pendudukan militer. Sebagian besar bangunan bersejarah tetap utuh setelah melewati satu lagi babak pertempuran demi memperebutkan kota suci ini. Untuk saat ini, tentara Sekutu tetap bersiaga di luar batas Kota Vatikan atas permohonan Takhta Suci.\n\nJatuhnya Roma adalah tonggak sejarah penting dalam kampanye militer di Italia, dan sebagian pihak bertanya-tanya apakah ini menandai berakhirnya perlawanan terorganisasi terhadap gerak maju tentara Sekutu di semenanjung tersebut."
 news.132.b: "Kemenangan besar!"
 news.133.d: "Pasukan dari Perancis baru-baru ini memasuki Roma setelah sisa garnisun Italia di kota itu melebur ke pedesaan sekitarnya. Pasukan Prancis bergerak cepat untuk menduduki semua gedung pemerintahan yang penting, dan 'kemenangan' diadakan di sepanjang Via del Corso dengan prosesi panjang tentara dan kendaraan lapis baja.\n\nDengan jatuhnya Roma, kemampuan Italia untuk melanjutkan perang dipertanyakan. Pengamat dari luar memperkirakan bahwa pemerintah Italia, yang meninggalkan kota tersebut sebelum jatuhnya kota tersebut, akan segera memulai negosiasi penyerahan diri."
 news.134.t: "Pembebasan Paris"
 news.134.d: "Kini Paris, ibu kota Prancis, telah dipastikan telah terbebas dari pendudukan Jerman. Pasukan Sekutu telah memasuki kota, dan garnisun Jerman yang tersisa telah menyerah. Warga Paris terlihat menyemangati para pembebas mereka saat mereka berjalan menyusuri Champs Élysées, meskipun terdapat rumor mengenai tembakan penembak jitu Jerman di beberapa bagian kota.\n\nDikhawatirkan bahwa Jerman akan menggunakan strategi bumi hangus dan membuat Paris menjadi reruntuhan yang terbakar, namun landmark kota tersebut tampaknya tidak terkena dampaknya. Bahkan, tiga warna Prancis kini terlihat terbang dari Menara Eiffel."
 news.135.t: "Jatuhnya Tokyo"
 news.135.d: "Pasukan Amerika telah memasuki Tokyo, dan Departemen Perang AS baru-baru ini mengumumkan diakhirinya operasi tempur besar-besaran di kota tersebut. Pertempuran dilaporkan berlangsung sengit, khususnya di sekitar Istana Kekaisaran yang dipertahankan oleh anggota Garda Kekaisaran yang fanatik, meskipun Kaisar diyakini telah meninggalkan kota tersebut sebelum serangan Amerika dimulai.\n\nDengan jatuhnya Tokyo, para ahli memperkirakan bahwa perlawanan terorganisir di Kepulauan Asal Jepang lainnya akan segera runtuh. Perundingan perdamaian diperkirakan akan segera dimulai, kecuali kelompok garis keras Jepang dapat meyakinkan Kaisar untuk melanjutkan perjuangan sampai mati."
 news.136.d: "Setelah serangkaian pertempuran sengit, pasukan Sekutu menduduki Moskow, ibu kota [SOV.GetNameDef]. Kota ini mengalami kerusakan parah, dan kebakaran masih berkobar di kedua sisi sungai Moskva. Meskipun dibom secara besar-besaran, Kremlin masih utuh, dan telah dipilih sebagai lokasi markas Administrasi Pendudukan Sekutu.\n\nDengan hilangnya Moskow, upaya perang Soviet mengalami pukulan yang sangat besar. Meskipun sebagian besar pemerintah diyakini telah mengevakuasi kota tersebut jauh sebelum kejatuhannya, para ahli militer menyatakan bahwa keruntuhan total Uni Soviet mungkin akan segera terjadi."
 news.137.t: "Pembebasan London"
 news.137.d: "Pertempuran telah berakhir di London, kantong terakhir perlawanan Jerman telah berhasil diatasi. Segera setelah semuanya selesai, massa yang bergembira bergegas ke jalan-jalan untuk merayakan para pembebas Amerika mereka, sementara lonceng gereja terdengar berbunyi di seluruh kota.\n\nDemam pembebasan tampaknya sedang melanda Inggris, karena sekarang tampaknya pendudukan Jerman akan segera berakhir. Pemberontakan spontan telah dilaporkan terjadi di wilayah yang masih berada di bawah kendali Jerman, meskipun insiden tersebut telah ditangani dengan keras. Apakah kebebasan akhirnya kembali ke Inggris?"
 news.138.d: "Berbeda dengan tahun 1920, kali ini tidak ada lagi 'Mukjizat di Sungai Vistula' tatkala tentara Soviet mendekati Warsawa. Perlawanan tentara Polandia di kota tersebut sebagian besar telah pupus, dan panji-panji Soviet terlihat berkibar di atas sebagian besar gedung pemerintahan.\n\nApakah kita tengah menyaksikan berakhirnya eksistensi bangsa Polandia, ataukah angkatan perang mereka sanggup bangkit kembali dan merebut kembali ibu kotanya? Sebagian besar pengamat memandang kemungkinan tersebut sangat mustahil."
 news.138.b: "[GetSOVIdeologyLondonResponse]"
 get_SOV_ideology_london_response: "Selanjutnya, kawan!"
 get_SOV_ideology_london_response_alt: "Selanjutnya!"
 news.139.t: "Pembebasan Warsawa"
 news.139.d: "Kota Warsawa yang hancur telah jatuh ke tangan pasukan Soviet, setelah pasukan Jerman terakhir mundur dari pinggiran kota yang terbakar. Sebagian besar kota berada dalam reruntuhan setelah pertempuran sebelumnya, dan para anggota perlawanan lokal bergegas keluar dari reruntuhan untuk menyambut para pembebas mereka.\n\nDengan Warsawa di bawah kendali Soviet, situasi strategis Jerman di Eropa Timur mungkin akan semakin memburuk. Para ahli ragu bahwa mereka akan mampu melakukan serangan balik untuk merebut kembali kota tersebut, namun penduduk setempat yang merasa tidak yakin akan hal ini."
 news.139.a: "Apakah ini awal dari akhir...?"
 news.140.d: "Komunike Soviet mengumumkan penyerahan seluruh pasukan Jerman di Berlin. Setelah mengepung kota, pasukan Rusia menyerbu kota tersebut dari beberapa arah yang berbeda, dengan pasukan Jerman yang bertahan melawan dengan sekuat tenaga di setiap langkah.\n\nPasukan Soviet akhirnya berjuang melintasi Jembatan Moltke dan masuk ke gedung Reichstag, bertempur dari ruangan ke ruangan hingga mereka mencapai atap tempat bendera Soviet dikibarkan di atas kota. Pertempuran Berlin telah berakhir."
 news.140.a: "Beruang [SOV.GetAdjective] sedang tumbuh..."
 news.140.b: "Sarang fasis adalah milik kita!"
 news.141.d: "Roma, sang 'Kota Abadi,' akhirnya bertekuk lutut di hadapan gerak maju ujung tombak tentara Soviet. Saat pasukan Italia terdesak mundur, serdadu Rusia menyebar ke seluruh penjuru kota dan menumpas sisa-sisa kantong perlawanan yang ada. Sebagian besar monumen bersejarah tampaknya hanya mengalami kerusakan ringan, kendati terdapat laporan simpang siur bahwa kuil Pantheon sempat dihujani tembakan senapan mesin.\n\nSejauh ini pihak Soviet tampak menghormati kenetralan Takhta Suci, namun pasukan mereka telah memposisikan diri membentuk cincin pengepungan di sekitar Kota Vatikan — sebuah isyarat yang niscaya membuat Sri Paus waswas."
 news.142.d: "Kemajuan Tentara Merah yang tak terhindarkan terus berlanjut, dan kini muncul laporan bahwa ibu kota Prancis telah jatuh. Komunis Perancis konon membantu Soviet ketika mereka memasuki kota, mengambil bagian dalam serangan terhadap mundurnya elemen armée de terre.\n\nLeaflet telah didistribusikan ke seluruh kota, memberi tahu warga Paris bahwa mereka telah 'dibebaskan dari penindasan Borjuasi' dan bahwa Komune Paris akhirnya bangkit kembali."
 news.143.d: "Dalam Perintah Harian terbaru yang disiarkan dari Moskwa, penguasaan Paris dari tangan pasukan Jerman resmi diumumkan. Banyak prajurit pembela kota dilaporkan tenggelam di Sungai Seine setelah rentetan tembakan artileri berat Soviet meruntuhkan beberapa jembatan penyeberangan.\n\nMenara Eiffel roboh setelah ledakan dahsyat mengguncang fondasinya, kendati belum jelas pihak mana yang bertanggung jawab atas peledakan tersebut. Pasukan Soviet kini tengah menggelar parade kemenangan di Champs-Élysées sementara warga Paris yang letih menyaksikan dengan tatapan cemas, bertanya-tanya apakah mereka hanya menukar satu penjajah dengan penjajah lainnya."
 news.143.a: "Apakah ini awal dari akhir...?"
 news.144.d: "[GetSOVIdeologyLondonDesc]"
 get_SOV_ideology_london_desc: "Gelombang komunis terus berlanjut, dan pasukan Soviet baru saja menyelesaikan penaklukan London. Sebuah parade dengan cepat diorganisir oleh Tentara Merah, bahkan sebelum kantong-kantong perlawanan terakhir di kota itu berhasil diatasi sepenuhnya.\n\nSimpatisan komunis dengan cepat menyerahkan nama-nama orang yang dikenal anti-komunis kepada otoritas militer Soviet, dan Pengadilan Rakyat telah bersidang di Trafalgar Square untuk menghukum para pelanggar terburuk."
 get_SOV_ideology_london_desc_alt: "Serangan [SOV.GetAdjective] berlanjut. Perkembangan terkini menunjukkan bahwa London berada di bawah serangan gencar yang agresif, dan kemudian jatuh ke dalam rentetan serangan yang sepertinya tidak pernah berakhir.\n\nKantong perlawanan terakhir baru saja dapat diatasi sebelum sebuah parade diselenggarakan oleh pasukan [SOV.GetAdjective] untuk merayakan kemenangan mereka. Para pendukung kepemimpinan [SOV.GetLeader] dan [SOV.GetLeader.GetHerHis] telah memberikan dukungan dan kekaguman mereka sepenuhnya seiring dengan berakhirnya era baru ini."
 news.145.d: "Kebakaran terus berkobar di pusat kota London, namun diyakini bahwa sebagian besar penjajah Jerman di kota tersebut telah gugur dalam pertempuran atau ditangkap oleh pasukan Soviet yang maju. Massa bermunculan di jalan-jalan untuk menyemangati Rusia saat mereka bergerak menghadapi perlawanan keras kepala terakhir.\n\nKolaborator telah ditindak dengan keras, dan Soviet telah membentuk dewan sementara untuk mengelola kota yang telah dibebaskan tersebut hingga pemberitahuan lebih lanjut. Para kritikus mengamati bahwa semua anggota dewan ini tampaknya berasal dari Partai Komunis Inggris Raya."
 news.145.a: "Sebuah perkembangan yang signifikan."
 news.146.d: "Tentara Soviet telah mengepung Tokyo, dan pertempuran berdarah dilaporkan berkecamuk di seantero kota. Sebagian besar wilayah kini berada di bawah kendali Soviet, kecuali pinggiran timur kota tempat kebakaran hebat masih membara.\n\nKetika pertempuran merembet ke arah Istana Kekaisaran, anggota Pengawal Kekaisaran dilaporkan melancarkan serangan sangkur nekat terhadap pasukan Soviet yang mendekat. Istana tersebut pada akhirnya diserbu oleh satu detasemen pasukan lintas udara VDV yang harus bertempur merebut ruangan demi ruangan di kompleks tersebut. Tidak ada tawanan yang diambil hidup-hidup, namun Kaisar diyakini telah dievakuasi dengan selamat sebelum kota itu runtuh."
 news.147.d: "Leningrad, bekas ibu kota Kekaisaran Rusia, telah diduduki oleh pasukan Finlandia. Dengan populasi lebih dari tiga juta jiwa, kota ini memiliki jumlah penduduk yang hampir sama banyaknya dengan seluruh Finlandia, namun fakta ini jelas tidak menghalangi para penyerang Finlandia.\n\nAda beberapa perdebatan mengenai apakah kota ini harus diintegrasikan ke dalam Finlandia Raya, karena warga Finlandia Ingrian merupakan minoritas yang cukup besar di wilayah di luar kota. Hal ini tentu saja mengasumsikan bahwa Tentara Merah tidak mampu merebut kembali kota tersebut melalui serangan balasan."
 news.148.d: "Warta yang datang dari Tokyo baru-baru ini mengonfirmasi bahwa kota metropolitan tersebut telah jatuh ke tangan tentara Tiongkok. Sebagian besar kota kini luluh lantak, termasuk Istana Kekaisaran yang kini dialihfungsikan sebagai markas besar administrasi militer Tiongkok.\n\nPara koresponden asing menyaksikan parade kemenangan kolosal yang menampilkan barisan tentara Tiongkok yang seolah tiada putusnya melintasi jalan-jalan kota. Warga Jepang yang berbaris di tepi jalan hanya bisa menyaksikan parade tersebut dalam kebisuan total."
 news.149.d: "Untuk pertama kalinya sejak direbut Inggris lebih dari dua abad lalu, Gibraltar kembali berada di tangan Spanyol. Berita yang masuk dari wilayah tersebut melaporkan bahwa sebagian besar garnisun telah menyerah, meskipun beberapa pasukan yang bertahan dengan keras kepala telah mundur ke terowongan yang berada di bawah Batu.\n\nPada konferensi pers di Madrid, perwakilan pemerintah menyatakan bahwa Gibraltar selanjutnya dianggap sebagai wilayah Spanyol 'untuk selama-lamanya'. Para diplomat Inggris secara mengejutkan membantah pernyataan tersebut dan menganggapnya sebagai 'omong kosong'."
 news.150.t: "Kudeta di Yugoslavia"
 news.150.d: "Upaya pemerintah Yugoslavia untuk bekerja sama dengan Jerman menuai penentangan keras dari kalangan militer negara tersebut, yang hari ini berpuncak pada sebuah kudeta yang menggulingkan penguasa saat ini dan menobatkan Raja Petar II ke atas takhta.\n\nNegara tersebut telah memutuskan sebagian besar hubungannya dengan Jerman, dan rezim baru tampaknya lebih memilih mengambil risiko perang daripada tunduk bekerja sama."
 news.150.b: "Orang bodoh telah menggali kuburnya sendiri."
 news.151.t: "Rhineland Tetap Didemiliterisasi"
 news.151.d: "Menyusul upaya Jerman untuk membatalkan ketentuan Traktat Versailles dan meremiliterisasi kembali Rhineland, sebuah ultimatum dari Sekutu memaksa mereka untuk mengurungkan niat tersebut. Dengan ancaman mobilisasi serempak dari Britania dan Prancis jika Jerman meneruskan rencananya, dengan cepat disadari bahwa perlawanan sebesar ini di luar perkiraan Berlin. Jerman belum siap menghadapi kedua negara adidaya tersebut dalam perang total.\n\nDengan kondisi saat ini, Rhineland akan tetap berstatus sebagai zona demiliterisasi sebagaimana diatur oleh traktat, kecuali jika Jerman memilih menempuh jalan perang."
 news.151.a: "Krisis dapat dihindari untuk saat ini."
 news.151.b: "Hari kita akan tiba."
 news.151.c: "Mereka seharusnya tahu bahwa kami tidak akan membiarkan mereka tanpa tantangan."
 news.152.d: "Menyusul upaya Jerman untuk melanggar aturan Traktat Versailles dan meremiliterisasi kembali Rhineland, sebuah ultimatum tegas dari Prancis memaksa mereka untuk mundur. Kendati Britania menolak untuk ikut campur, ancaman mobilisasi perang dari Prancis jika Jerman bersikeras dengan rencananya membuktikan bahwa intervensi militer sekecil apa pun sama sekali tidak diperhitungkan Berlin. Jerman belum siap menghadapi Prancis dalam perang terbuka.\n\nSebagaimana keadaannya sekarang, kawasan Rhineland akan tetap berstatus sebagai zona demiliterisasi sesuai ketetapan traktat kecuali Jerman memutuskan untuk berperang."
 news.152.c: "Prancis berdiri sendiri, namun kuat."
 news.152.e: "Jelas, intervensi kami tidak diperlukan."
 news.153.t: "Jerman Mengingkari Pakta Molotov-Ribbentrop"
 news.153.d: "Pakta non-agresi antara Jerman dan [SOV.GetNameDef], yang sejak awal merupakan sebuah kejutan besar, kini telah hancur berantakan sebagaimana sudah diduga banyak pihak. Jerman telah melancarkan serangan, mencabik-cabik pakta tersebut dan kembali secara terbuka mencap Uni Soviet sebagai ancaman berbahaya yang wajib ditumpas demi mewujudkan visi masa depan mereka.\n\nPara petinggi Soviet sangat murka, namun barangkali mereka tidak terlalu terkejut atas pengkhianatan ini melainkan lebih kecewa karena gagal mendahului mengambil kesempatan penyerangan terlebih dahulu."
 news.153.a: "Kepercayaan antar raksasa adalah hal yang rapuh."
 news.153.b: "Kami hanya menandatanganinya untuk menunggu waktu sebelum penyerangan."
 news.153.c: "Sebuah perjanjian hanyalah selembar kertas bagi kaum fasis."
 news.154.t: "Uni Soviet Mengingkari Pakta Molotov-Ribbentrop"
 news.154.d: "Pakta non-agresi antara Jerman dan [SOV.GetNameDef], yang awalnya merupakan sebuah perkembangan yang mengejutkan, kini telah berantakan. [SOV.GetNameDef] telah menyerang, melanggar perjanjian dan bersumpah untuk menghancurkan rezim Jerman dan sekali lagi menempatkan negara ekspansionis di tempatnya.\n\nPara pemimpin Jerman mungkin telah merencanakan serangan mereka sendiri, tetapi dunia tidak akan pernah tahu. Mereka sekarang dengan cepat melakukan mobilisasi untuk menghadapi ancaman baru."
 news.154.b: "Komunis tidak punya rasa hormat atau kebanggaan!"
 news.154.c: "Perjanjian tersebut telah mencapai tujuannya."
 news.155.t: "Jerman Kembali Berperang"
 news.155.d: "Meskipun banyak pihak yang menginginkan perdamaian jangka panjang di Eropa, kejadian baru-baru ini telah membuat Jerman kembali berada di jalur perang. Meskipun jelas-jelas melanggar perjanjian Versailles, pasukan Jerman telah bergerak dan siap melakukan serangan. Para pejabat Jerman menyatakan bahwa mereka tidak akan lagi melakukan demiliterisasi di Rheinland, dengan alasan perlunya melindungi warga negara Jerman di wilayah tersebut."
 news.155.a: "Ini mungkin merupakan awal dari Perang Besar lainnya"
 news.155.b: "Demi kejayaan bangsa Jerman!"
 news.156.t: "Komet Terlihat di Angkasa"
 news.156.d: "Kemunculan sebuah Komet di angkasa telah memicu keresahan di kalangan rakyat kita. Me 163 Komet, sebuah pesawat roket eksperimental yang tengah menjalani uji terbang, telah mengejutkan penduduk pedesaan yang menyaksikan pesawat melesat luar biasa cepat ini. Pesawat ini dikembangkan dengan kerahasiaan paling ketat, namun akan segera diumumkan ke publik. Insiden kecil ini justru akan membuat penampilan perdananya kelak menjadi jauh lebih mengesankan."
 news.156.a: "Akhir sudah dekat... bagi musuh kita."
 news.156.a.tt: "Sebuah vas jatuh."
 news.156.a.2.tt: "Lagipula aku tidak suka vas itu."
 news.157.t: "[From.From.GetName] Melakukan Intervensi dalam Perang [From.GetAdjective]"
 news.157.d: "Hanya beberapa hari yang lalu pasukan dari [From.GetName] dimobilisasi menuju [From.From.From.GetName] dalam suatu pernyataan perang. Tak lama berselang, [From.From.GetName] melayangkan ultimatum, memerintahkan kedua pihak menghentikan pertempuran dan seluruh tentara [From.GetAdjective] ditarik mundur. [From.GetLeader] menyatakan perang mereka memiliki pembenaran yang sah dan menolak untuk tunduk. Negara tersebut kini terjerumus ke dalam perang terbuka melawan [From.From.From.GetName] sekaligus [From.From.GetName]."
 news.157.a: "Sepertinya [From.From.GetName] rela mengotori tangannya"
 news.157.a_usa: "Kita akan show them"
 news.158.t: "[From.From.GetName] Melakukan Intervensi dalam Perang [From.GetAdjective]"
 news.158.d: "Beberapa hari lalu [From.GetName] menyatakan perang terhadap [From.From.From.GetName]. Tak lama kemudian [From.From.GetName] melayangkan ultimatum, menyatakan akan berperang melawan [From.GetName] jika mereka tidak segera menghentikan segala agresi dan menandatangani perjanjian damai. [From.GetLeader] menegaskan bahwa alasan perang mereka adalah adil, namun akhirnya memilih untuk melakukan demobilisasi dan menyepakati perdamaian."
 news.158.a: "Tampaknya permainan kekuatan [From.From.GetAdjective] membuahkan hasil"
 news.158.a_usa: "Kita harus menjaga perdamaian"
 news.159.t: "Fajar Kebangkitan [From.GetFactionName]"
 news.159.d_01: "[From.GetLeader] hari ini mengumumkan bahwa [From.GetName] telah berupaya untuk membentuk aliansi baru. [From.GetFactionName] telah mengumumkan niat mereka untuk bekerja sama jika terjadi perang.\n\nMeskipun koalisi yang besar dapat mencegah agresi, kita telah melihat konsekuensi yang ditimbulkannya ketika konflik benar-benar muncul. Niat berbagai pihak untuk bergabung dalam aliansi baru ini masih bisa diperdebatkan, namun tujuan apa yang akan dicapai mungkin tidak diketahui bahkan oleh para pencetusnya."
 news.159.d_02: "Ada teori yang menyatakan bahwa negara-negara demokrasi tidak akan saling berperang, namun hal itu bukan jaminan bahwa mereka pasti akan saling menolong di medan pertempuran. Mengingat kepentingan politik yang beragam dan kehendak rakyat akan perdamaian, terjun ke dalam perang sering kali menuntut pengorbanan yang sangat besar bagi negara-negara ini.\n\nKendati demikian, kenyataan ini tidak menghentikan [From.GetName] untuk mengumumkan hari ini bahwa mereka telah membentuk pakta aliansi militer, [From.GetFactionName], demi menyatukan kekuatan dalam melindungi rakyat dan cita-cita luhur mereka."
 news.159.d_03: "Bahkan [From.GetName], yang termasyhur atas keyakinannya yang teguh pada keunggulan dan kekuatan bangsa serta rakyatnya, tidak menutup diri untuk bersekutu dengan pihak-pihak yang mereka hormati. [From.GetLeader] mengumumkan hari ini bahwa kesepakatan final telah tercapai mengenai [From.GetFactionName], sebuah koalisi militer yang konon hanya diperuntukkan bagi bangsa-bangsa terhormat yang ditakdirkan menuju kejayaan.\n\nApakah kejayaan ini hendak diraih melalui pembangunan masyarakat ideal di dalam batas negara masing-masing ataukah dengan bekerja sama demi ekspansi melampaui perbatasan mereka, dunia mungkin tidak akan pernah tahu sampai semuanya terlambat."
 news.159.d_04: "Terlepas dari fokus Soviet belakangan ini pada sosialisme di satu negara, akar internasionalis gerakan kaum buruh senantiasa melintasi batas-batas negara. Solidaritas bersama kelas pekerja di seluruh penjuru dunia menjadi pilar utama dalam pidato [From.GetLeader] hari ini tatkala pembentukan [From.GetFactionName] diumumkan secara resmi.\n\nMelangkah lebih jauh dari sekadar Internasionale politik, ini adalah aliansi yang mengikat negara-negara anggotanya secara militer, di mana kedua rezim berjanji saling membantu melawan ancaman musuh dari luar. Apakah aliansi ini akan berperan sebagai pedang penyerang atau perisai pelindung bagi revolusi komunis, waktu yang akan membuktikannya."
 news.159.a: "Apakah ini akan membawa perdamaian abadi atau perang lainnya?"
 news.159.b: "Bersama-sama, kita tidak akan pernah kalah!"
 news.159.c: "Inisiatif yang luar biasa!"
 news.159.tt: "[This.GetName] adalah bagian dari [From.GetFactionName] dengan [From.GetName]."
 news.160.t: "Jerman Diserang"
 news.160.d: "Belum lama ini Jerman kembali terseret ke dalam perang. Meskipun semua orang mengharapkan perdamaian jangka panjang di Eropa, jelas bahwa ketegangan di benua ini masih terlalu besar. Pejabat Jerman menyatakan bahwa mereka tidak mampu lagi menjaga demiliterisasi Rheinland, dengan alasan bahwa mereka memerlukan mobilitas penuh di dalam perbatasan mereka sendiri untuk mempertahankan diri."
 news.160.a: "Hal ini bukan pertanda baik bagi Eropa"
 news.160.b: "Rakyat Jerman akan menang"
 news.161.t: "Prancis Melarang Komunisme"
 news.161.d: "Kabinet [From.GetLeader] telah menetapkan dekret pembubaran [From.GetCommunistParty]. Sejak Soviet Rusia menandatangani pakta non-agresi dengan Jerman Nazi, telah berhembus desakan kuat untuk melarang komunisme di Prancis. Dekret ini disahkan menyusul kesepakatan antara kedua raksasa tersebut untuk membagi-bagi wilayah Polandia.\n[From.GetLeader] memanfaatkan kesempatan ini tatkala dukungan terhadap pelarangan kian meluas dan bahkan surat-surat kabar haluan kiri mulai menyerukan pembubaran [From.GetCommunistParty]."
 news.161.a: "Sebuah keputusan drastis"
 news.161.b: "Melakukan semua yang mereka bisa untuk mempertahankan kekuasaan borjuis"
 news.161.c: "Ini mungkin diperlukan"
 news.161.e: "Itu adalah satu-satunya cara"
 news.162.d: "Dengan disepakatinya perjanjian damai final yang membelah Spanyol menjadi dua oleh kedua belah pihak, Perang Saudara Spanyol telah resmi berakhir. Kendati kelompok pembangkang di kedua belah kubu mengecam kompromi ini, perdamaian rapuh ini setidaknya memberi waktu bagi bangsa yang terpecah tersebut untuk pulih dan membangun kembali di kedua sisi perbatasan."
 news.162.a: "Bagus untuk orang Spanyol."
 news.162.b: "Suatu hari, kami akan merebut kembali seluruh Spanyol."
 news.163.t: "Konferensi London"
 news.163.d: "Menggunakan aneksasi Austria ke dalam [GER.GetName] sebagai dasar klaim mereka, Jerman kini menuntut \"pengembalian yang sah\" bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, para penandatangan Perjanjian Versailles berkumpul di London untuk membahas solusi terhadap \"Permasalahan Slovenia\". Konferensi perdamaian besar ini telah menghasilkan keputusan bahwa Yugoslavia harus menyerahkan Slovenia kepada Jerman demi perdamaian abadi.\n\nMengingat dirinya ditinggalkan oleh kekuatan besar Eropa, pemerintah [YUG.GetLeader] tidak melihat pilihan lain selain menandatangani perjanjian seperti yang disajikan."
 news.163.a: "Ini akan berakhir dengan baik"
 news.163.b: "Keadilan"
 news.163.c: "Sangat disesalkan"
 news.163.e: "Dikhianati"
 news.164.t: "Krisis di Slovenia"
 news.164.d: "Menjadikan aneksasi Austria ke dalam [GER.GetName] sebagai dalih klaimnya, Jerman kini menuntut 'pengembalian sah' atas bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, negara-negara penandatangan Traktat Versailles telah berkumpul di London guna merundingkan solusi atas 'Persoalan Slovenia.'\n\nDalam konferensi tersebut, Britania dan Prancis berdiri kompak menghadapi tuntutan Jerman, seraya menegaskan bahwa Yugoslavia harus mempertahankan perbatasannya sebagaimana ditetapkan oleh Versailles."
 news.164.d_FRA_abandoned_yugoslavia: "Menggunakan aneksasi Austria ke dalam [GER.GetName] sebagai dasar klaim mereka, Jerman kini menuntut \"pengembalian yang sah\" bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, para penandatangan Perjanjian Versailles telah berkumpul di London untuk membahas solusi terhadap \"Permasalahan Slovenia.\""
 news.164.a: "Saya pikir ini berarti perang"
 news.164.b: "Mereka akan menghadapi kemarahan kita"
 news.164.c: "Kami akan berdiri di sisi keadilan"
 news.164.e: "Pertama yang bertarung!"
 news.164.f: "Orang Inggris bodoh"
 news.165.t: "Krisis di Slovenia"
 news.165.d: "Menggunakan aneksasi Austria ke dalam [GER.GetName] sebagai dasar klaim mereka, Jerman kini menuntut \"pengembalian yang sah\" bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, para penandatangan Perjanjian Versailles telah berkumpul di London untuk membahas solusi terhadap \"Permasalahan Slovenia.\""
 news.165.a: "Ini terlihat suram"
 news.165.b: "Kita akan not back down"
 news.165.c: "Sangat disayangkan"
 news.165.e: "Bersama-sama kita akan menang"
 news.165.f: "Kami akan melakukan apa yang benar!"
 news.166.t: "Persetujuan London"
 news.166.d: "Menggunakan aneksasi Austria ke dalam [GER.GetName] sebagai dasar klaim mereka, Jerman kini menuntut \"pengembalian yang sah\" bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, para penandatangan Perjanjian Versailles telah berkumpul di London untuk membahas solusi terhadap \"Permasalahan Slovenia.\""
 news.166.a: "Lampu padam"
 news.166.b: "Kita akan crush them"
 news.166.c: "Kami berdiri sendiri"
 news.167.t: "Krisis di Slovenia"
 news.167.d: "Menggunakan aneksasi Austria ke dalam [GER.GetName] sebagai dasar klaim mereka, Jerman kini menuntut \"pengembalian yang sah\" bekas wilayah Austria di Slovenia dari [YUG.GetName].\n\nSebagai tanggapan, para penandatangan Perjanjian Versailles telah berkumpul di London untuk membahas solusi terhadap \"Permasalahan Slovenia.\""
 news.167.a: "Kita akan keep an eye on this"
 news.167.b: "Kita akan crush them both"
 news.167.c: "Setidaknya kita tidak berteman"
 news.167.e: "Italia akan menunjukkan kepada Dunia!"
 news.168.t: "Arbitrase Ljubljana Pertama"
 news.168.d: "Dengan hilangnya Slovenia, garis perpecahan etnis di Yugoslavia mulai terlihat lebih jelas, dan otoritas pusat semakin melemah dari hari ke hari.\n\nHari ini, Menteri Luar Negeri Jerman mengumumkan rencana untuk menyelesaikan \"kesalahan Negara Versailles\". Dalam perjanjian yang ditandatangani oleh beberapa negara tetangga [YUG.GetName] yang paling kuat, sebagian besar wilayahnya telah dibagi antara negara-negara yang bersahabat dengan Jerman.\n\nPerjanjian ini bahkan tidak dilihat oleh diplomat [YUG.GetAdjective] sebelum diratifikasi, namun dengan banyaknya negara yang berusaha merebut tanah Yugoslavia dari pemerintah pusat yang runtuh, pemerintah [YUG.GetLeader] tidak bisa berbuat banyak."
 news.168.a: "Demikianlah Orde Baru dibangun"
 news.168.b: "Sebuah mimpi telah mati hari ini"
 news.168.c: "Ini tidak mungkin bagus"
 news.168.e: "Berita Luar Biasa"
 news.168.f: "Hasil yang buruk bagi kami"
 news.168.g: "Kami berterima kasih"
 news.168.h: "Sayangnya"
 news.168.i: "Kekuatan Italia mendapat pengakuan nyata"
 news.168.j: "Jerman sebaiknya menjaga dirinya sendiri."
 news.169.t: "Nasib Yugoslavia"
 news.169.d_annex_YUG: "Kehilangan teritorial baru-baru ini telah memicu perpecahan di dalam negara Yugoslavia yang berujung pada konflik antaretnis dan runtuhnya wibawa pemerintah pusat. Jerman telah melangkah ke dalam kekosongan kekuasaan tersebut dan memutuskan untuk memproklamasikan 'protektorat' atas sisa wilayah Yugoslavia."
 news.169.d_puppet_CRO_annex_YUG: "Kehilangan teritorial belakangan ini telah menyebabkan keretakan hebat di dalam negara Yugoslavia yang memicu konflik etnis dan melumpuhkan kekuasaan pusat. Jerman telah mendirikan negara Kroasia yang 'merdeka' dan mencaplok sisa wilayah lainnya ke dalam kekuasaannya."
 news.169.d_puppet_CRO_YUG: "Kehilangan wilayah baru-baru ini telah menimbulkan keretakan di dalam negara Yugoslavia, memicu konflik etnis dan merapuhkan otoritas pusat. Jerman memilih untuk membagi sisa wilayah tersebut antara negara Serbia dan Kroasia di bawah kendali dan arahan mereka."
 news.169.a: "Jerman menunjukkan kekuatannya kepada Eropa"
 news.169.b: "Kami memilih sisi kanan"
 news.169.c: "Ini tidak menyenangkan"
 news.169.e: "Kedamaian terancam"
 news.170.t: "Arbitrase Ljubljana Kedua"
 news.170.d_BUL: "Berdalih berupaya menjamin perdamaian di kawasan Balkan, Jerman melayangkan tuntutan kepada pemerintah Yunani agar mereka menyerahkan sebagian wilayahnya kepada Bulgaria. Kendati [GRE.GetName] melayangkan protes keras, kuatnya pengaruh Jerman di Balkan membuat mereka tak memiliki banyak pilihan. Satu-satunya jalan keluar untuk menghindari konfrontasi bersenjata dengan [GER.GetName] adalah membiarkan diplomasi Jerman mendikte keutuhan wilayah mereka."
 news.170.d_ITA: "Mengklaim tengah berupaya menjaga perdamaian di Balkan, Jerman menyodorkan tuntutan kepada pemerintah Yunani agar menyerahkan wilayah mana pun yang diklaim oleh [ITA.GetName]. Kendati [GRE.GetName] melayangkan protes keras, besarnya hegemoni Jerman di Balkan tidak menyisakan ruang pilihan bagi mereka. Satu-satunya cara untuk menghindari benturan perang melawan [GER.GetName] dan [ITA.GetName] sekaligus adalah membiarkan diplomasi Jerman mendikte keutuhan wilayah kedaulatan mereka."
 news.170.d_ITA_BUL: "Mengklaim berupaya menjamin stabilitas perdamaian di Balkan, Jerman telah mendesak pemerintah Yunani untuk menyerahkan setiap wilayah yang dituntut oleh [BUL.GetName] dan [ITA.GetName]. Mengingat kuatnya kehadiran militer [GER.GetAdjective] di semenanjung Balkan serta ancaman nyata dari Bulgaria maupun Italia, [GRE.GetLeader] tidak melihat jalan lain selain menerima tuntutan tersebut."
 news.170.d_GER: "Setelah menancapkan pengaruhnya sebagai kekuatan dominan di Balkan, [GER.GetName] kini berdalih tindakannya semata-mata demi menjaga perdamaian di kawasan yang bergolak tersebut. Demi tujuan ini, Berlin kini menuntut penyerahan langsung wilayah Yunani ke bawah otoritasnya.\n\nMenghadapi kedigdayaan mesin perang Jerman, [GRE.GetName] terpaksa menelan pil pahit dan menerima tuntutan tersebut, kendati mereka mengutuknya sebagai sebuah kepalsuan belaka."
 news.170.a: "Apapun untuk menjaga perdamaian"
 news.170.b: "Kami bangkit"
 news.170.c: "Ini sepertinya tidak bagus"
 news.170.e: "Apakah pusatnya bisa bertahan?"
 news.170.f: "Sayang sekali"
 news.171.t: "Arbitrase Ljubljana Kedua"
 news.171.d_BUL: "Yunani menolak mentah-mentah mediasi Jerman dalam sengketa perbatasannya dengan Bulgaria, seraya menegaskan bahwa tawaran Jerman tersebut sama saja dengan penyerahan diri tanpa syarat.\n\nBerbicara kepada media, [GRE.GetLeader] menegaskan bahwa apabila [BUL.GetLeader] dan [GER.GetLeader] menginginkan wilayah-wilayah ini, mereka dipersilakan 'datang dan coba merebutnya'.\n\nPemerintah [BUL.GetAdjective] menepis tuduhan bahwa mereka telah menjanjikan dukungan militer dan ekonomi kepada [GER.GetNameDef] sebagai imbalan atas bantuan merebut wilayah-wilayah Yunani."
 news.171.d_ITA: "Menyusul pertemuan tingkat tinggi antara [GER.GetLeader] dan [ITA.GetLeader], pemerintah [GER.GetAdjective] secara terang-terangan mendukung posisi [ITA.GetAdjective] dalam sengketa perbatasan yang tengah memanas dengan [GRE.GetNameDef].\n\nPemimpin Yunani [GRE.GetLeader] menyatakan solusi yang disodorkan sama sekali tidak dapat diterima dan bersumpah akan mempertahankan tanah airnya 'hingga peluru terakhir, mortir terakhir, dan helaan napas terakhir.'"
 news.171.d_ITA_BUL: "Tawaran Jerman untuk menjadi mediasi dalam sengketa perbatasan antara Yunani di satu sisi dan Italia serta Bulgaria di sisi lain telah ditolak oleh Yunani. Seorang juru bicara pemerintah [GRE.GetAdjective] mengumumkan bahwa tentara [GRE.GetAdjective] siap membela negara dari penjajah mana pun, dan lebih baik mati dalam pertempuran daripada menyerah kepada serigala dan burung nasar yang mengikuti jejak Jerman."
 news.171.d_GER: "Perundingan antara [GRE.GetNameDef] dan [GER.GetNameDef] guna menyelesaikan sengketa perbatasan telah menemui kegagalan total. Menyatakan bahwa usulan Jerman untuk menyewa sejumlah kawasan demi pangkalan militer Jerman secara efektif berarti menyerahkan sebagian besar kedaulatan negara, [GRE.GetLeader] telah menyerukan kepada seluruh rakyat Yunani yang mampu memanggul senjata untuk bangkit membela tanah air."
 news.171.a: "Bodoh."
 news.171.b: "Beraninya mereka!?"
 news.171.c: "Kita harus melihat apakah kita dapat membantu Yunani."
 news.171.e: "Ini berarti perang."
 news.171.f: "Mereka akan gagal, seperti yang dialami Persia."
 news.172.t: "Yunani Tunduk"
 news.172.d: "Menyusul pembicaraan yang panjang dan memanas dengan duta besar Jerman, [GRE.GetLeader] mengumumkan bahwa pemerintah [GRE.GetAdjective] akan menyelaraskan kebijakannya secara erat dengan [GER.GetNameDef] di masa mendatang.\n\nPasukan kepolisian di ibu kota [GRE.GetAdjective] terpaksa menggunakan kekerasan untuk membubarkan sejumlah aksi demonstrasi spontan yang menentang keputusan ini, dengan banyak orang di tengah kerumunan massa menuntut hukuman mati bagi 'sang pengecut [GRE.GetLeader]'."
 news.172.a: "Mereka menunjukkan dengan bijak."
 news.172.b: "Kemenangan lainnya."
 news.172.c: "Ini memprihatinkan."
 news.172.e: "Tidak ada yang bisa kami lakukan."
 news.172.f: "Ini adalah tragedi Yunani."
 news.173.t: "Internasionale Keempat"
 news.173.d_1: "Sejumlah delegasi komunis dari seluruh dunia bertemu di Paris hari ini untuk konferensi pendirian. Dengan dipimpin oleh para pendukung teori Trotsky, landasan bagi Internasional Keempat pun diletakkan.\n\nMeskipun masih belum jelas apa dampak upaya pengorganisasian ini terhadap panggung politik internasional, berita tersebut tampaknya telah membangkitkan kecurigaan Stalin. Dia mencurigai banyak petinggi partai dan militer diam-diam mendukung Trotsky, dan banyak dari mereka masih hidup. Dengan kembalinya paranoianya, dia menjadi semakin tertutup. Ketidakpercayaan dan ketidakstabilannya menyebabkan krisis di pemerintahan Soviet. Jika terus begini, negara ini akan terjerumus ke dalam perang saudara."
 news.173.d_2: "Sejumlah delegasi komunis dari seluruh dunia bertemu di Paris hari ini untuk konferensi pendirian, yang meletakkan dasar bagi apa yang dikenal sebagai Internasional Keempat. Seruan untuk pembentukannya telah ada selama bertahun-tahun, dengan para pendukung teori Trotsky yang memimpin.\n\nStalin telah menanggapi meningkatnya dukungan terhadap Trotskyisme di luar negeri dengan memerintahkan pembunuhan tambahan dan meningkatkan propaganda terhadap saingan lamanya. Dengan adanya pembersihan terhadap orang-orang yang dicurigai sebagai anggota Trotskis di jajaran tinggi militer dan kepemimpinan Soviet di masa lalu, hal ini sepertinya tidak akan menemui perlawanan apa pun."
 news.173.a: "Berapa banyak pemain internasional yang akan hadir?"
 news.173.b: "Era yang penuh kekerasan bagi Persatuan kita."
 news.174.t: "[From.GetName] Mengembangkan Teknologi Nuklir"
 news.174.d: "Setelah uji coba awal, politisi [From.GetName] memutuskan untuk mengarahkan penelitian [From.GetAdjective] ke arah pengembangan teknologi nuklir.\n\nTeknologi ini masih sangat eksperimental, dan ada ketidakpastian besar apakah teknologi ini dapat diterapkan secara praktis. Siapa yang tahu ke mana hal ini akan mengarahkan upaya perang mereka."
 news.174.a: "Perkembangan ini harus kita ikuti."
 news.174.b: "Mari kita berharap penelitian mereka membuahkan hasil."
 news.174.c: "Itu tidak akan berarti apa-apa."
 news.174.e: "Kami akan melakukan penelitian kami secara rahasia."
 news.175.t: "Prancis dan Britania Mengumumkan Aliansi"
 news.175.d: "Merujuk kembali pada jalinan persaudaraan yang ditempa semasa Perang Besar, Prancis telah mengajukan permohonan aliansi resmi dengan Britania Raya, dengan dalih ancaman nyata yang membayangi stabilitas Eropa.\n\nHari ini permohonan mereka telah disetujui secara resmi oleh Parlemen Britania, dan Prancis kini telah bergabung ke dalam [ENG.GetFactionName]."
 news.175.a: "Kami berdiri bersama."
 news.175.b: "Mereka bersiap menghadapi kemungkinan terburuk."
 news.175.c: "Bersatu seperti tikus yang terpojok."
 news.175.e: "Inggris telah melakukan hal yang sama."
 news.176.t: "Britania Menolak Bersekutu dengan Prancis"
 news.176.d: "Dalam perkembangan peristiwa yang mengejutkan, Parlemen Britania hari ini menolak permohonan [FRA.GetName] untuk meresmikan aliansi militer formal antara kedua negara. Dalih yang dikemukakan adalah demi menghindari memicu pergolakan pada perimbangan kekuatan yang sudah sangat rapuh di benua Eropa.\n\nPemerintah Prancis mengutuk langkah tersebut sebagai manuver politik egois yang mengorbankan keamanan Prancis demi kepentingan sepihak Britania."
 news.176.a: "Seharusnya mereka bertanya dengan lebih baik."
 news.176.b: "Musuh lama kita terpecah belah."
 news.176.c: "Hari yang kelam bagi sekutu lama."
 news.177.t: "Entente Kecil"
 news.177.d: "Demi membentuk front persatuan menghadapi musuh bersama, [From.GetName] telah mengulurkan tangan kepada Cekoslowakia dengan tawaran membentuk sebuah 'Entente Kecil', seraya mengesampingkan ikatan masa lalu mereka dengan Britania sejak era Perang Besar. Kendati sempat ditawari tempat dalam pakta pertahanan ini, Perdana Menteri Britania menegaskan bahwa negerinya tidak memandang aliansi semacam itu 'bermanfaat bagi perlindungan kemerdekaan Eropa.'\n\nKendati demikian, Prancis tetap menjalin hubungan diplomatik erat dengan negara-negara lain yang merasa terancam, dan mendorong persatuan demi menjaga keseimbangan diplomatik di Eropa serta mencegah konflik di masa depan. Hanya waktu yang akan membuktikan apakah mereka sanggup meraih keberhasilan."
 news.177.a: "Kalau begitu, jangan datang menangis kepada kami nanti!"
 news.177.b: "Vive la France dan L'Entente!"
 news.177.c: "Kita tidak boleh lagi membiarkan Perancis mempunyai hegemoni di Eropa."
 news.177.e: "Eropa harus bersatu melawan agresor Fasis!"
 news.177.f: "Sebuah tanda meningkatnya ketegangan Eropa."
 news.178.t: "Sayap Kiri Bangkit di Prancis"
 news.178.d: "Menyusul hampir dua dekade pergolakan politik yang tiada henti, rakyat [From.GetName] merasa belum mampu merebut kembali apa yang hilang semasa Perang Besar. Golongan [From.GetAdjective] kini mengarahkan pandangannya untuk merekonstruksi kembali negara [From.GetAdjective], bersama rakyatnya, dan demi rakyatnya.\n\nReformasi politik baru ini memicu maraknya serikat-serikat buruh dan organisasi komunis. Apabila Prancis terus melangkah di jalur ini, mereka siap menyongsong pergeseran politik menuju haluan kiri radikal, atau bahkan letupan revolusi skala penuh."
 news.178.a: "Prancis mengikuti kita menuju masa depan!"
 news.178.b: "Sebuah tanda kelemahan Prancis."
 news.178.c: "Perkembangan yang tragis bagi Republik Ketiga."
 news.178.e: "Perkembangan yang mengkhawatirkan."
 news.179.t: "Sayap Kanan Berjaya di Prancis"
 news.179.d: "Menyusul hampir dua dasawarsa kemelut politik berkepanjangan, rakyat [From.GetName] merasa belum berhasil memulihkan kembali apa yang terenggut dalam Perang Besar. Kaum mapan [From.GetAdjective] kini membulatkan tekad untuk membangun kembali tatanan negara [From.GetAdjective], serta membangkitkan kembali kejayaan bangsa [From.GetAdjective].\n\nLangkah-langkah reformasi politik ini secara nyata memperkokoh cengkeraman kekuasaan negara dan angkatan perang, didukung rakyat [From.GetAdjective] yang terpesona oleh janji-janji kejayaan dari [From.GetLeader]."
 news.179.a: "Pemerintah Perancis adalah musuh rakyatnya sendiri!"
 news.179.b: "Hal ini sekali lagi dapat membuat Perancis menjadi negara yang besar."
 news.179.c: "Perkembangan yang tragis bagi Republik Ketiga."
 news.179.e: "Perkembangan yang mengkhawatirkan."
 news.180.t: "Prancis Disambut ke dalam Komintern"
 news.180.d: "Menyusul pergeseran haluan ke arah komunisme yang tidak hanya melanda rakyat jelata Prancis namun juga lorong-lorong kekuasaan, [France.GetName] secara terbuka mengumumkan keinginannya untuk menjadi bagian dari [From.GetFactionName].\n\n[From.GetName] menyambut secara seketika, mengindikasikan adanya perundingan intensif berminggu-minggu yang telah berlangsung di balik layar. [From.GetLeader] berpidato panjang lebar tentang bagaimana kaum pekerja sedunia harus bersatu padu demi mengobarkan api revolusi di seantero negeri.\n\n[France.GetLeader] mengamininya, dan melontarkan ancaman tanpa tedeng al-aling kepada mereka 'yang beralasan untuk gentar terhadap [From.GetFactionName].'"
 news.180.a: "Bersatu menuju Revolusi Dunia!"
 news.180.b: "Aliansi mereka akan segera hancur."
 news.180.c: "Musuh-musuh demokrasi tidak boleh dibiarkan tumbuh semakin kuat."
 news.180.e: "Prancis telah memihaknya."
 news.181.t: "[France.GetName] dan [From.GetName] Bersatu"
 news.181.d: "Menyusul iklim politik yang kian condong ke arah otokrasi, [France.GetName] mengumumkan bahwa sudah saatnya mereka mencari sekutu demi membendung bahaya komunisme global. Dan kini tampaknya [From.GetName] adalah sekutu yang dimaksud.\n\nPagi hari ini, [From.GetLeader] mengumumkan bahwa [France.GetName] dan [From.GetName] akan berdiri tegak bersama layaknya saudara kandung. 'Warisan masa lalu kita bersama tidak lagi menjadikan kita musuh, melainkan kawan seperjuangan! Raksasa-Raksasa Eropa kini berdiri bersatu.'"
 news.181.a: "Bersama-sama kita berdiri kokoh!"
 news.181.b: "Musuh-musuh demokrasi semakin kuat."
 news.181.c: "Persahabatan yang tak terduga"
 news.182.t: "[France.GetName] Bergabung ke [From.GetFactionName]!"
 news.182.d: "Politik Eropa berubah drastis hari ini, ketika diplomat Perancis dan Jerman mengumumkan pakta militer antara [France.GetName] dan [From.GetName]. Mereka mengumumkan bahwa terlalu banyak darah telah tertumpah di perbatasan mereka, ketika ada kekuatan lain di luar sana yang ingin menghancurkan mereka.\n\n[From.GetName] mendorong semua orang untuk mempertimbangkan apa artinya daripada melemahkan diri mereka sendiri terhadap satu sama lain, musuh lama akan tumbuh lebih kuat bersama-sama."
 news.182.a: "Tidak ada yang bisa mengancam [From.GetFactionName]!"
 news.182.b: "[From.GetName] baru muncul di Eropa."
 news.182.c: "Diplomasi Eropa menyelaraskan kembali sepanjang Poros Paris-Berlin."
 news.182.e: "Oh bugger."
 news.183.t: "[From.GetName] Menolak Aliansi Prancis!"
 news.183.d: "Menolak kemajuan diplomatik [France.GetAdjective], [From.GetLeader] secara terbuka mengumumkan bahwa [From.GetName] tidak akan melakukan pakta militer dengan [France.GetName].\n\nMenyebut negara [France.GetAdjective] lemah dan korup, diplomat [From.GetAdjective] mengatakan bahwa [From.GetAdjective] yang sebenarnya tidak akan mengizinkan \"[France.GetAdjective] Penyakit\" menyebar."
 news.183.a: "Beraninya mereka!"
 news.183.b: "Kita bisa hidup bersama mereka sebagai musuh kita."
 news.183.c: "Selama mereka sibuk berkelahi satu sama lain..."
 news.184.t: "Italia Menjalin Hubungan Kian Erat dengan Jerman"
 news.184.d: "Italia dan Jerman telah lama memperlihatkan berbagai benturan kepentingan, terutama terkait wilayah Austria dan Semenanjung Balkan. Kendati demikian, hal tersebut terbukti tidak menghalangi kebijakan luar negeri kedua negara untuk tumbuh semakin bersahabat, dan perundingan kini tengah berjalan demi menyepakati traktat yang akan 'melindungi kepentingan bersama.'\n\nApabila perundingan ini membuahkan hasil, kita akan menyaksikan aliansi berkekuatan dahsyat yang sanggup menancapkan pengaruh raksasa di Eropa Tengah dan Eropa Timur."
 news.184.a: "Bangsa kita mempunyai banyak kepentingan yang sama."
 news.184.b: "Kami akan mengawasi situasinya."
 news.185.t: "[From.GetName] Mengupayakan Pakta Militer Luas"
 news.185.d: "Bertekad untuk merombak perimbangan kekuatan di Mediterania, [From.GetName] mulai melancarkan manuver politik demi membentuk aliansi baru di kawasan tersebut.\n\nSebagian besar bersifat militer, [From.GetFactionName], menurut kata-kata [From.GetLeader], akan menempatkan Italia di pusat kekuatan dunia yang baru."
 news.185.a: "[From.GetName] memimpin!"
 news.185.b: "Mari kita berharap kepentingan mereka tidak bertentangan dengan kepentingan kita."
 news.185.c: "Hal ini dapat menimbulkan kekhawatiran."
 news.186.t: "Italia Menuntut Wilayah Yunani"
 news.186.d: "Merujuk pada Kekaisaran Romawi sebagai pendahulu negara [From.GetAdjective] modern, [From.GetName] menegaskan bahwa negara Yunani yang merdeka tidak berhak untuk ada. Sebaliknya, 'Wilayah Yunani' harus mengakui supremasi Italia di Aegea, atau wilayah tersebut akan direbut dengan kekerasan.\n\n[Greece.GetName] mengecam klaim itu sebagai hal yang menggelikan. Namun demikian, [From.GetName] mendapat sokongan penuh dari [From.GetFactionName]."
 news.186.a: "Italia harus menguasai Laut Aegea."
 news.186.b: "Klaim yang keterlaluan!"
 news.187.t: "Italia Mencari Dukungan dari [GRE.GetName]"
 news.187.d: "Menyebut [GRE.GetName] sebagai penerus negara-negara kuno pertama di Eropa, [ITA.GetName] mengklaim adanya persahabatan alami di antara kedua negara mereka.\nAgenda politik mereka tampak gamblang, karena [ITA.GetName] juga memandang [GRE.GetName] sebagai anggota alami dari [ITA.GetFactionName].\n\nSetelah terpisah selama satu setengah milenium, masih harus dilihat apakah dunia timur dan barat dapat kembali bersatu."
 news.187.a: "Tentunya [Greece.GetName] memiliki minat yang sama dengan kita."
 news.187.b: "Hal ini tidak mengherankan."
 news.187.c: "Kami memang memiliki banyak sejarah bersama."
 news.188.t: "[ITA.GetName] Upayakan Rekonsiliasi dengan [TUR.GetName]"
 news.188.d: "Meski dilanda konflik berdekade-dekade serta manuver diplomatik demi meraih dominasi di Mediterania, [ITA.GetName] dan [TUR.GetName] mulai mengesampingkan perselisihan mereka.\n\nDalam sebuah kesepakatan untuk bekerja sama 'demi kemaslahatan segenap Kawasan Mediterania', [ITA.GetName] dan [TUR.GetName] berikrar untuk menjalin ikatan diplomatik yang lebih erat daripada yang pernah ada sejak berdirinya kedua bangsa modern tersebut."
 news.188.a: "Pengaruh [ITA.GetName] tumbuh"
 news.188.b: "Bagaimana seseorang bisa setuju untuk \"bekerja sama\" dengan [ITA.GetAdjective]s?"
 news.188.c: "Kemitraan di Mediterania sangatlah penting"
 news.189.t: "Italia Tuntut Pangkalan Angkatan Laut di Anatolia"
 news.189.d: "Perjanjian London 1915 menjanjikan wilayah Turki di Anatolia kepada Italia. Meski perjanjian lain kemudian menggantikannya, janji-janji tersebut tak pernah dilupakan oleh kepemimpinan [From.GetAdjective].\n\n[From.GetLeader] telah menyatakan di hadapan publik bahwa mengingat nilai strategis pesisir Anatolia, [From.GetName] bertekad penuh untuk mengambil kembali apa yang 'secara sah merupakan hak milik Italia'."
 news.189.a: "Masalah ini telah diselesaikan!"
 news.189.b: "Kita akan have what we were promised!"
 news.189.c: "Persaingan Turki-Italia semakin meningkat."
 news.190.t: "Kepulauan Balears Diserahkan kepada [Italy.GetName]"
 news.190.d: "Menyusul ketergantungan pada pasukan [Italy.GetAdjective] dalam Perang Saudara Spanyol, [Italy.GetName] telah meminta Kepulauan Balears dari [From.GetName]. [From.GetLeader] menyetujuinya, menegaskan langkah diplomatik ini sebagai pengukuhan ikatan antara kedua negara.\n\nBagi [Italy.GetName], pangkalan angkatan laut di Kepulauan Balears akan memungkinkan mereka menancapkan pengaruh lebih kuat atas Selat Gibraltar, serta memberi akses yang lebih leluasa ke Atlantik."
 news.190.a: "Ini adalah langkah penting menuju dominasi penuh Mediterania."
 news.190.b: "Italia memperkuat cengkeramannya di Mediterania."
 news.190.c: "Simbol \"persahabatan sayang\" antar bangsa kita."
 news.192.t: "Italia Umumkan Klaim atas Wilayah Yugoslavia"
 news.192.d: "Berbicara di hadapan masyarakat Italia di sepanjang pesisir Dalmasia, [From.GetLeader] mengumumkan bahwa [From.GetName] sepenuhnya memandang wilayah berbahasa Italia di [YUG.GetName] sebagai bagian sah dari [From.GetName].\n\nSebuah pernyataan resmi memperkuat klaim tersebut, menegaskan bahwa [From.GetName] siap merebut wilayah itu dengan kekuatan senjata jika diperlukan."
 news.192.a: "Itu adalah tanah Yugoslavia, bukan tanah Italia!"
 news.192.b: "Hal ini mengganggu keseimbangan yang sudah rapuh di kawasan."
 news.192.c: "Wilayah-wilayah tersebut tampak lebih khas Italia daripada Yugoslavia."
 news.193.t: "Kantor Urusan Luar Negeri Italia di [YUG.GetName]"
 news.193.d: "Alih-alih berseteru dengan [YUG.GetName] mengenai populasi Italia di pesisir Dalmasia, [From.GetName] telah mengumumkan pendirian misi diplomatik permanen untuk [YUG.GetName]. Menurut pernyataan kementerian luar negeri [From.GetAdjective], kedua negara memiliki begitu banyak sejarah dan kepentingan bersama sehingga saling pengertian jauh lebih penting ketimbang sengketa perbatasan yang remeh.\n\nDi tengah ketegangan yang kian memuncak di seantero Eropa, semua pihak hanya bisa berharap lebih banyak negara yang menempuh jalan serupa."
 news.193.a: "Bangsa kita berdiri bersama sebagai teman."
 news.193.b: "Akan ada perdamaian di Laut Adriatik."
 news.193.c: "Akan menarik untuk melihat di mana hal ini berakhir."
 news.194.t: "Polandia Timur Diserahkan kepada [From.GetName]"
 news.194.d: "Melalui intrik politik yang tak terungkap, kepemimpinan [Poland.GetName] telah menyerahkan wilayah timur mereka kepada [From.GetName].\n\nBelum diketahui janji atau ancaman apa yang dilancarkan oleh [From.GetName] demi meraih kemenangan politik ini. Mungkin kita tidak akan pernah mengetahuinya, mengingat [Poland.GetLeader] belum mengeluarkan sepatah kata pun di luar pengumuman kesepakatan tersebut."
 news.194.a: "[Poland.GetName] mengakui kekuatan [From.GetFactionName]!"
 news.194.b: "[From.GetName] menghabiskan semua yang ada di jalurnya."
 news.194.c: "[Poland.GetName] pasti tidak punya pilihan lain."
 news.195.t: "[From.GetName] Diberikan Wilayah Jerman Timur"
 news.195.d: "Menyusul pendudukan [Soviet.GetName] atas Jerman, [From.GetName] telah diberikan sebagian besar wilayah Jerman Timur, termasuk wilayah sengketa Prusia Timur (Ostpreussen).\nTampaknya ini merupakan hasil dari klausul rahasia dalam perjanjian Soviet-Polandia. Polandia dianugerahi tanah Jerman sebagai kompensasi atas wilayah yang terpaksa mereka serahkan kepada [Soviet.GetName].\n\nPolandia bermain dengan taruhan tertinggi; meski banyak yang hilang, kini banyak pula yang didapatkan kembali."
 news.195.a: "[Soviet.GetName] menghormati perjanjiannya."
 news.195.b: "Mari kita berharap Polandia yang merdeka dapat bangkit dari abu yang diciptakan oleh \"pelindungnya\"."
 news.195.c: "Pergeseran geografis untuk Polandia. Lagi."
 news.196.t: "[From.GetName] Menyemangati Kaum Revolusioner"
 news.196.d: "Dalam pidato yang berapi-api, [From.GetLeader] menyerukan kepada partai-partai komunis di mana pun untuk mempercepat kejatuhan Kapitalisme dengan menerapkan taktik-taktik yang lebih ekstrem. Rasa takut akan persekusi tak boleh menghentikan satu pun pria maupun wanita dalam mengobarkan perjuangan kelas pekerja.\n\n[From.GetName] akan meningkatkan pendanaan bagi partai-partai komunis asing, serta melatih mereka taktik-taktik yang lebih radikal demi membawa negara mereka sejalan dengan [From.GetFactionName]."
 news.196.a: "Demokrasi tidak boleh diremehkan!"
 news.196.b: "Sebuah upaya yang menggelikan!"
 news.196.c: "Bangkitlah, saudara dan saudari!"
 news.196.e: "Benturan ideologi adalah pertempuran terakhir antar peradaban."
 news.197.t: "[From.GetName] Tunduk pada Ultimatum [Soviet.GetAdjective]"
 news.197.d: "[From.GetName] telah tunduk pada ultimatum [Soviet.GetAdjective], dan menyerahkan kendali atas Kepulauan Aegea kepada [Soviet.GetName].\n\nDengan demikian, [Soviet.GetName] kian memperkokoh kehadiran mereka di Mediterania, meneguhkan diri sebagai kekuatan armada laut yang disegani di kawasan tersebut."
 news.197.a: "Mereka seharusnya senang kami menawarkan persyaratan yang baik kepada mereka."
 news.197.b: "[Soviet.GetName] harus dihentikan!"
 news.197.c: "[Soviet.GetName] bersiap memasuki Mediterania."
 news.198.t: "[From.GetName] Menolak Ultimatum [Soviet.GetAdjective]"
 news.198.d: "[From.GetName] telah menolak tuntutan dalam ultimatum [SOV.GetAdjective] yang dilayangkan terkait Kepulauan Aegea. Ketika [SOV.GetName] kian menancapkan pengaruhnya di kawasan itu, [From.GetLeader] menegaskan bahwa menyerahkan satu pulau saja di Aegea akan berujung pada direbutnya seluruh Mediterania oleh mereka.\n\nDengan ditolaknya ultimatum ini, [From.GetName] berada di ambang perang, dan kini hanya bisa menanti kapan [SOV.GetNameDef] menarik pelatuk senjata."
 news.198.a: "Kemudian waktu untuk berbicara selesai."
 news.198.b: "Para penghasut perang [SOV.GetNameDef] harus dihentikan!"
 news.198.c: "Ini adalah ultimatum mereka. Yunani harus bersiap menghadapi perang"
 news.198.e: "Kami berdiri dengan [From.GetNameDef]"
 news.199.t: "[?SOV.former_controller_of_bessarabia.GetNameDefCap] Serahkan Bessarabia kepada [From.GetNameDef]"
 news.199.d: "\n\n[?SOV.former_controller_of_bessarabia.GetNameDefCap] terpaksa menyerah pada ultimatum dari [From.GetNameDef]. Wilayah Bessarabia kini telah beralih ke bawah kendali [From.GetAdjective], meninggalkan negara [?SOV.former_controller_of_bessarabia.GetAdjective] dengan perbatasan yang kian menyempit.\n\nKini patut dinanti bagaimana cara [?SOV.former_controller_of_bessarabia.GetNameDef] menghindari kerugian wilayah lebih lanjut."
 news.199.a: "Ini penting untuk strategi [From.GetAdjective]"
 news.199.b: "Negara-negara di dunia harus menghadapi kejahatan [From.GetNameDef]!"
 news.199.c: "[?SOV.former_controller_of_bessarabia.GetNameDefCap] berada dalam posisi yang tidak menguntungkan."
 news.200.t: "Pengaruh Jerman di [CZE.GetNameDef]"
 news.200.d: "Berbicara mengenai persaudaraan antarbangsa di dalam 'Kawasan Jerman', [From.GetLeader] dalam pidatonya hari ini mengumumkan komitmen [From.GetName] terhadap kerja sama politik dan diplomatik dengan [CZE.GetNameDef]. Dengan populasi berbahasa Jerman yang cukup signifikan, [CZE.GetNameDef] dihadirkan sebagai mitra alami bagi kepentingan [From.GetAdjective].\n\nKendati belum jelas seberapa besar hak suara [CZE.GetNameDef] dalam kemitraan ini, setidaknya mereka dapat merasa tenang bahwa perbatasan mereka aman dari ambisi wilayah [GER.GetNameDef]."
 news.200.a: "Persahabatan Jerman lebih disukai daripada kekuasaan Jerman."
 news.200.b: "Orang Ceko selalu berteman dengan orang Jerman"
 news.200.c: "[From.GetName] terus memperluas lingkup pengaruhnya"
 news.200.e: "Damai untuk zaman kita?"
 news.200.f: "Kabar baik ketika [Root.GetLeader] kembali dari liburan di Munich!"
 news.201.t: "[GER.GetNameDefCap] Paksa [TUR.GetNameDef] Tunduk"
 news.201.d: "\nMenghadapi tekanan diplomatik dan militer dari [GER.GetFactionName] baik dari arah timur maupun barat, pemerintah [TUR.GetAdjective] terjerumus ke dalam kemelut politik.\n\nMenyusul ancaman dari Jerman dan Soviet, pemerintahan baru yang lahir dari kekacauan ini bersikap jauh lebih bersahabat kepada [GER.GetFactionName] dibandingkan rezim sebelumnya. Sejumlah wilayah timur bahkan telah diserahkan kepada [SOV.GetNameDef].\n\nBahkan, segelintir pembangkang yang segera dibungkam bersuara bahwa pemerintahan baru ini tunduk pada setiap kehendak [GER.GetLeader]."
 news.201.a: "Pemerintahan Turki yang baru mengamankan daya saing kita di Mediterania."
 news.201.b: "Kekuatan mengerikan dari [GER.GetFactionName] adalah menghancurkan negara-negara seperti kartu domino."
 news.201.c: "[From.GetNameDefCap] tidak dapat menahan kekuatan [GER.GetFactionName]."
 news.201.e: "Aliansi ini memperkuat posisi kami."
 news.201.f: "Turki telah menjadi korban predator [GER.GetFactionName]"
 news.202.t: "Slowakia Ditukar Danzig"
 news.202.d: "Menyusul retorika agresif yang berlangsung selama berbulan-bulan, hubungan yang kian memburuk antara [GER.GetNameDef] dan [POL.GetNameDef] berbalik arah malam ini melalui kesepakatan diplomatik untuk menyelesaikan sengketa Danzig.\n\n[POL.GetNameDef] akan menggabungkan Slowakia yang dikuasai Jerman sebagai negara bagian Polandia, dan sebagai imbalannya akan menyerahkan wilayah Danzig. Status Kota Bebas Danzig diselesaikan dengan cepat, dan tak lama lagi akan sepenuhnya digabungkan kembali ke dalam negara Jerman.\n\nKendati masalah ini tampak diselesaikan secara damai, pihak pemenang Perang Besar dipastikan akan mengajukan keberatan keras."
 news.202.a: "Pertukaran yang adil untuk memperbaiki kesalahan Versailles"
 news.202.b: "Kerja sama membuat kita lebih kuat dibandingkan konflik"
 news.202.c: "Ini adalah pelanggaran terang-terangan terhadap Versailles!"
 news.202.e: "Konflik mengenai Danzig telah dapat dihindari"
 news.203.t: "Polandia Serahkan Danzig"
 news.203.d: "Menyusul penyerahan ultimatum [GER.GetAdjective] kepada [From.GetNameDef], [From.GetLeader] beserta pemerintah [From.GetAdjective] telah memutuskan untuk mematuhi setiap tuntutan daripada harus menghadapi perang.\n\nMereka berharap dengan lepasnya Danzig, [From.GetNameDef] akan luput dari ambisi teritorial Jerman berikutnya. Kendati demikian, situasi tetap mencekam, dan nyata terlihat bahwa pasukan perbatasan Polandia belum menerima perintah untuk mundur."
 news.203.a: "[GER.GetLeader] tidak bisa dibiarkan terus-menerus mengajukan tuntutan ke Eropa!"
 news.203.b: "Ini adalah pengakuan atas kekuatan [GER.GetFactionName]"
 news.203.c: "Ekspansi Jerman terus berlanjut"
 news.203.e: "Jelas bahwa \"negara-negara demokrasi\" di Eropa tidak mampu menghentikan ancaman fasis."
 news.204.t: "Polandia Tolak Ultimatum Jerman"
 news.204.d: "Mempertimbangkan tuntutan yang diajukan, hal ini tampaknya tak terelakkan.\n\n[From.GetNameDef] dipaksa menyerahkan Danzig ke Jerman, dan seorang utusan berkuasa penuh Polandia diminta hadir ke Berlin demi menegosiasikan syarat-syarat lanjutan. [From.GetLeader] menunjuk tindakan-tindakan terbaru [GER.GetNameDef] saat menegaskan bahwa sudah sangat jelas Jerman tidak akan puas hanya dengan Danzig semata.\n\nPasukan Jerman dan Polandia kini telah bersiap perang, dan laporan-laporan mengenai bentrokan di perbatasan mulai berdatangan. Sekali lagi, bara perang berkobar di Eropa."
 news.204.a: "Jerman telah mengabaikan setiap peringatan!"
 news.204.b: "Maka itu adalah perang"
 news.204.c: "Bersama-sama kita harus menghentikan agresor ini!"
 news.204.e: "Ini adalah situasi yang gawat"
 news.205.t: "Pax Americana"
 news.205.d_america: "Memandang konflik yang berkecamuk di benua lain, [USA.GetLeader] mengumumkan program kebijakan luar negeri baru yang bertujuan menjaga perdamaian di dalam negeri.\n\nSetiap pemerintahan di benua Amerika dapat memohon perlindungan militer kepada Amerika Serikat jika merasa terancam oleh negara tetangganya. Kendati bukan jaminan bagi negara tertentu, hasrat akan perdamaian di benua Amerika kini bukan lagi sekadar angan, melainkan kebijakan resmi Amerika."
 news.205.d_not_america: "Memandang konflik yang berkecamuk di benua lain, [USA.GetLeader] mengumumkan program kebijakan luar negeri baru yang bertujuan menjaga perdamaian di dalam negeri.\nSetiap pemerintahan di benua Amerika dapat memohon perlindungan militer kepada Amerika Serikat jika merasa terancam oleh tetangganya. Kendati bukan jaminan mutlak bagi negara tertentu, hasrat akan perdamaian di Amerika kini bukan lagi sekadar impian, melainkan kebijakan resmi Amerika."
 news.205.a: "Hal ini seharusnya membuat Amerika lebih aman"
 news.205.b: "Dengan perdamaian di dalam negeri, AS dapat fokus pada musuh-musuhnya di luar negeri"
 news.205.c: "Saat ini kita mungkin kesulitan menemukan sekutu di Amerika"
 news.205.e: "Mari kita berharap untuk perdamaian abadi"
 news.206.t: "Anti-Imperialisme Amerika"
 news.206.d_communist: "Menyusul penyebaran revolusi buruh di Amerika Serikat, retorika mereka terhadap tatanan lama menjadi jauh lebih agresif. Kini [USA.GetLeader] mempertanyakan status Kanada sebagai negara yang tunduk pada Kerajaan Inggris, sementara para diplomat Amerika mendukung dunia yang bebas dari aristokrasi dan kekuasaan di seluruh dunia.\n\nMeskipun ada ikatan yang mengikat mereka, ketegangan antara [USA.GetNameDef] dan kerajaan kolonial [ENG.GetNameDef] meningkat. Hanya masalah waktu sebelum konflik diplomatik ini meningkat dan revolusi dilakukan dengan kekerasan."
 news.206.d_not_communist: "Rezim komunis baru di Amerika Serikat telah mengadopsi doktrin baru kebijakan luar negeri [USA.GetAdjective], mengambil sikap yang jauh lebih agresif terhadap mantan sekutu dan kawan-kawannya, sambil mendekati anggota Komunis Internasional.\nPerubahan kebijakan ini mencakup mempertanyakan status [CAN.GetName] sebagai negara subjek, dan praktik umum dari apa yang mereka sebut sebagai \"imperialisme Inggris di seluruh dunia.\""
 news.206.a: "Seluruh dunia akan dibebaskan melalui revolusi!"
 news.206.b: "Kita harus be prepared for any eventuality"
 news.206.c: "Keseimbangan global terancam"
 news.206.e: "Rezim [USA.GetAdjective] tidak perlu dikhawatirkan"
 news.206.f: "Perkembangan yang mengkhawatirkan"
 news.207.t: "[USA.GetNameDefCap] Mengecam Komintern"
 news.207.d_fascism: "\nMenanggapi retorika yang kian agresif dari [SOV.GetNameDef], [USA.GetLeader] angkat bicara mengecam apa yang ia sebut sebagai 'bahaya terbesar bagi peradaban manusia, yaitu komunisme'.\n\nTidak hanya akan menjalankan kebijakan protektif untuk mencegah penyebaran sosialisme dunia di benua Amerika, [USA.GetNameDef] bahkan bertekad melumat jantung komunisme itu sendiri.\n\nDengan kedahsyatan mesin perang [USA.GetAdjective], pemusnahan total segenap paham komunisme tampak—untuk pertama kalinya—sangat mungkin diwujudkan."
 news.207.d_not_fascism: "[USA.GetLeader] hari ini menyampaikan pidato umum yang menentang apa yang ia sebut sebagai 'bahaya terbesar bagi peradaban manusia', yakni komunisme.\n\nTak hanya akan menjalankan kebijakan protektif guna membendung penyebaran sosialisme dunia di benua Amerika, bangsa [USA.GetAdjective] secara terang-terangan berhasrat memusnahkan jantung komunisme itu sendiri.\n\nDengan ketegangan yang mencapai titik puncaknya, sepercik api saja sudah cukup untuk menyulut kobaran perang antara [SOV.GetNameDef] dan [USA.GetNameDef]."
 news.207.a: "Kemanusiaan akan terbebas dari penyakit sampar ideologis ini!"
 news.207.b: "Mereka akan menghancurkan benteng komunisme"
 news.207.c: "Kami akan membuat mereka bertekuk lutut"
 news.207.e: "Apa pun arah konflik ini, kehancuran akan terjadi total"
 news.207.f: "[USA.GetNameDefCap] harus melakukan apa yang harus dilakukan untuk melindungi dirinya sendiri"
 news.208.t: "Angkatan Darat Jepang Menganut Nanshin-ron"
 news.208.d: "Angkatan bersenjata Jepang telah lama mengakui bahwa [JAP.GetName] tidak memiliki sumber daya alam yang diperlukan untuk upaya perang yang berkepanjangan. Dengan meningkatnya ketegangan dan pecahnya konflik bersenjata yang melibatkan negara-negara besar di dunia, ancaman hilangnya impor tampaknya semakin besar dari hari ke hari.\nUntuk mengatasi hal ini, para ahli strategi Jepang telah menyusun rencana strategis untuk merebut koloni-koloni Barat di Asia Tenggara dan Pasifik. Daerah yang kaya sumber daya ini akan menjadi bahan bakar bagi mesin perang Jepang dan memungkinkannya untuk terus beroperasi tanpa hambatan, selama kekuatan kolonial dan [USA.GetName] dapat dicegah."
 news.208.a: "Apakah mereka benar-benar mampu mengancam harta benda kita?"
 news.208.b: "Selama wilayah Amerika tidak terancam"
 news.208.c: "Mereka menyadari bahwa mereka harus mencari mangsa di tempat lain"
 news.208.e: "Perang di Asia Tenggara sepertinya mungkin terjadi"
 news.209.t: "Angkatan Darat Jepang Menganut Hokushin-ron"
 news.209.d: "Angkatan bersenjata Jepang telah lama mengakui bahwa [JAP.GetNameDef] tidak memiliki sumber daya alam yang diperlukan untuk upaya perang yang berkepanjangan. Dengan meningkatnya ketegangan dan pecahnya konflik bersenjata yang melibatkan negara-negara besar, ancaman hilangnya impor tampaknya semakin besar dari hari ke hari.\nUntuk mengatasi hal ini, ahli strategi Jepang telah membuat rencana strategis untuk merebut tambang dan ladang minyak Siberia dari [SOV.GetNameDef]. Ada teori yang mengatakan bahwa kemajuan yang cepat akan memungkinkan Jepang untuk menguasai wilayah penting sebelum serangan balik [SOV.GetAdjective] yang tepat dapat dilakukan. Pada saat itu tentara Jepang akan memiliki semua sumber daya yang dibutuhkan untuk menjaga api perang tetap menyala sampai [SOV.GetAdjective] menyerah."
 news.209.a: "Adalah tindakan yang bodoh jika mengancam harta benda kita"
 news.209.b: "Kami telah menghalangi Jepang untuk maju di Pasifik"
 news.209.c: "Mereka tidak mengerti betapa dahsyatnya kekuatan yang akan mereka hadapi"
 news.209.e: "Perang di Siberia sepertinya tidak bisa dihindari"
 news.210.t: "Jepang Ganti Pemerintahan di Tiongkok"
 news.210.d: "Menyusul dekade demi dekade ketidakstabilan politik di Tiongkok, ditambah konflik bersenjata baik internal maupun eksternal, pemerintah Jepang mengumumkan bahwa mereka memandang pemerintah Tiongkok sebagai ancaman bagi stabilitas mandala pengaruhnya.\n\nAtas dasar inilah—di bawah ancaman perang—pemerintahan baru didudukkan di tampuk kekuasaan, yang tunduk setia kepada Jepang dan Kaisar Jepang. Rezim baru ini tidak hanya menikmati perlindungan dari tentara Jepang, tetapi juga mandat militer untuk menaklukkan kembali negara-negara panglima perang Tiongkok.\n\nKendati perselisihan politik dipastikan masih akan bergolak, perang terbuka antara kedua negara untuk sementara waktu berhasil dihindarkan."
 news.210.a: "Tidak dapat disangkal pengaruh Jepang"
 news.210.b: "Kita harus mengawasi perbatasan tenggara kita"
 news.210.c: "Mungkin ini saatnya memperkuat koloni kita melawan ambisi Jepang"
 news.210.e: "Tampaknya akan ada semacam perdamaian antara Tiongkok dan Jepang"
 news.211.t: "Jepang Klaim Hegemoni di Asia Timur"
 news.211.d: "Memandang keunggulan militer mereka tak tertandingi di Asia Timur, [JAP.GetLeader] mengumumkan bahwa [JAP.GetNameDef] menganggap segenap kawasan tersebut sebagai mandala pengaruh mereka. Tanpa informasi akurat mengenai batas jangkauan kekuatan Jepang, masih belum jelas wilayah mana saja yang dianggap [JAP.GetNameDef] sebagai bagian sah dari [JAP.GetFactionName] yang baru saja dibentuk."
 news.211.a: "[JAP.GetFactionName] meningkat"
 news.211.b: "Ini merupakan perkembangan yang menarik"
 news.211.c: "Mereka tidak akan berani mengklaim wilayah Asia kita"
 news.211.e: "Perkembangan yang memprihatinkan di Pasifik"
 news.211.f: "Sepertinya kita mempunyai kepentingan yang bertentangan"
 news.211.g: "Kita harus mengawasi hal ini"
 news.212.t: "Diplomat Jepang di Berlin"
 news.212.d_not_axis: "Kemitraan baru tengah terjalin antara Tokyo dan Berlin. Negosiasi telah dimulai untuk membentuk pakta antara kedua negara, dengan merujuk pada kepentingan strategis maupun nilai-nilai bersama. Kendati masih harus ditunggu apa hasil nyata dari negosiasi ini, prospek persahabatan antara dua kekuatan militer terkuat di masing-masing belahan bumi menjadi alasan kuat bagi banyak musuh mereka untuk waspada."
 news.212.d_axis: "Kemitraan baru tengah terjalin antara Tokyo dan Berlin. Perundingan telah dimulai untuk menyepakati pakta antara kedua negara, dengan alasan kepentingan strategis serta kesamaan nilai. Kendati masih harus dinanti kelanjutan dari perundingan ini, prospek persahabatan antara dua kekuatan militer terhebat di masing-masing belahan dunia menjadi kabar gembira bagi sekutu mereka, sekaligus ancaman mencemaskan bagi musuh-musuh mereka."
 news.212.a: "Ini akan menjadikan kita semua lebih kuat"
 news.212.b: "Musuh kita tidak seharusnya berteman"
 news.212.c: "Mungkin lebih baik jika tidak ada hasil dari ini"
 news.213.t: "[USA.GetNameDefCap] Menentang Fasisme"
 news.213.d_peace: "Sebagai Negeri Kebebasan, [USA.GetNameDef] memandang dirinya sebagai musuh alami fasisme dalam segala bentuknya di seluruh penjuru dunia. Menyusul agresi rezim Jerman, mereka kini dipandang sebagai musuh terbesar bagi tatanan dunia yang dibangun di atas prinsip-prinsip kebebasan yang dijunjung oleh [USA.GetNameDef].\n\nMenyadari hal ini, dan dengan persetujuan Kongres [USA.GetAdjective], [USA.GetLeader] telah melayangkan peringatan keras kepada [GER.GetNameDef]. Kecuali [GER.GetNameDef] mengubah haluan politiknya, [USA.GetNameDef] akan mengambil tindakan tegas terhadap mereka.\n\nKendati bentuk tindakan tersebut belum dirinci, ancaman perang tersirat membayangi hubungan kedua negara."
 news.213.d_war: "Sebagai Negeri Kebebasan, [USA.GetNameDef] menganggap dirinya sebagai seteru alami fasisme dalam segala bentuknya di seluruh dunia. Seiring agresi rezim Jerman, saat ini mereka adalah ancaman terbesar bagi dunia yang ditegakkan di atas asas-asas kebebasan yang dianut [USA.GetNameDef].\n\nDengan pertimbangan tersebut, serta restu dari Kongres [USA.GetAdjective], [USA.GetLeader] mengeluarkan peringatan keras kepada [GER.GetNameDef]. Kecuali [GER.GetNameDef] menyerah dan memutar haluan politiknya, [USA.GetNameDef] akan mengerahkan segenap daya industri dan kekuatan militernya untuk melawan mereka.\n\"Kita tidak akan membiarkan [GER.GetNameDef] membelokkan laju sejarah!\""
 news.213.a: "[GER.GetName] akan berdiri kokoh selama seribu tahun!"
 news.213.b: "Mereka harus membuktikan perkataan mereka dengan baja"
 news.213.c: "[GER.GetName] akan jatuh!"
 news.213.e: "Hal ini tidak akan menghasilkan penyelesaian damai"
 news.214.t: "Polandia Upayakan Kerja Sama Baltik"
 news.214.d_not_baltic: "\"Tidak ada hasil bagi kami yang tidak mengambil risiko penindasan yang lebih besar terhadap rakyat Polandia.\""
 news.214.d_baltic: "[POL.GetName] secara bertahap menjauhkan diri dari komunitas internasional, menyadari bahwa mereka tidak dapat mengandalkan politik dari \"kekuatan besar\" untuk mencegah agresor sekali lagi menjatuhkan negara Polandia.\n\nSebaliknya, [POL.GetLeader] telah menyampaikan rencana aliansi untuk memperkuat wilayah Baltik, yang diharapkan akan mencegah agresi dari timur atau barat.\n\nDengan memburuknya stabilitas Eropa, aliansi semacam itu mungkin merupakan kepentingan terbaik kita."
 news.214.a: "Kekuatan baru di Eropa Timur."
 news.214.b: "Mereka ikut campur dalam wilayah pengaruh kita!"
 news.214.c: "Mereka jelas-jelas berusaha mengancam [GER.GetName]."
 news.214.e: "[POL.GetFactionName] mungkin merupakan pilihan teraman kami."
 news.215.t: "[GER.GetName] Meresmikan Pakta Anti-Soviet"
 news.215.d_not_soviet: "[GER.GetNameDefCap] telah sejak lama mengutuk komunisme dalam segala bentuknya, dan giat melancarkan manuver diplomatik demi menuntut bangsa-bangsa lain untuk turut menentangnya.\n\nKini, [GER.GetName] menawarkan kepada 'negara-negara yang terancam langsung oleh komunisme' kesempatan untuk membentuk pakta penentang [SOU.GetName]. Negara mana pun yang terikat dalam pakta ini akan berkomitmen untuk berperang melawan [SOU.GetName], bilamana tiba saatnya salah satu anggota diserang."
 news.215.d_soviet: "[GER.GetLeader] telah menjadi penentang lantang komunisme bahkan sejak sebelum ia berkuasa, dan tak pernah ada keraguan sedikit pun bahwa [GER.GetNameDef] menempatkan dirinya sebagai musuh bebuyutan [SOU.GetNameDef].\n\nHari ini, pendirian tersebut diumumkan ke seantero dunia, seiring kesepakatan yang sebelumnya berstatus 'Perjanjian Anti-Soviet' antara [GER.GetNameDef] dan sejumlah negara lain kini telah resmi diikat menjadi sebuah pakta militer. Anggota-anggota lainnya akan diseru untuk berperang bilamana salah satu dari mereka terseret dalam konflik terbuka melawan kita."
 news.215.a: "Ini adalah satu-satunya cara untuk melawan ancaman komunis."
 news.215.b: "Perjuangan hanya akan mempercepat revolusi buruh."
 news.215.c: "Biarkan mereka saling mengeringkan darah."
 news.216.t: "[TUR.GetName] Menolak Ultimatum dari [GER.GetName]."
 news.216.d: "Para diplomat dari [GER.GetName] memberikan [TUR.GetName] sebuah ultimatum kemarin, yang menuntut [TUR.GetLeader] mundur dan mendukung pemerintah yang didukung Jerman. Dengan dukungan Majelis Agung Nasional, [TUR.GetLeader] menolak ultimatum tersebut, dan mengumumkan kepada rakyat [TUR.GetAdjective] bahwa Turki tidak akan pernah menjadi pion dalam latihan perang diktator asing.\n\nSekarang negara tersebut bersiap menghadapi perang."
 news.216.a: "[GER.GetName] akan diturunkan."
 news.216.b: "Kami berdiri dengan [TUR.GetName]."
 news.216.c: "Perlawanan yang bodoh."
 news.216.e: "Perang di Turki sepertinya tidak bisa dihindari."
 news.217.t: "[GER.GetNameDefCap] Dorong [TUR.GetNameDef] Masuk [ENG.GetFactionName]"
 news.217.d: "Dalam menyampaikan ultimatum kepada pemerintah [TUR.GetAdjective], [GER.GetNameDef] telah menciptakan musuh baru bagi dirinya sendiri. Daripada menuruti tuntutan diplomat [GER.GetAdjective] seperti yang diharapkan [GER.GetLeader], [TUR.GetNameDef] telah menyetujui aliansi defensif dengan [ENG.GetNameDef].\n\n[ENG.GetNameDef] dan sekutunya bersiap untuk membela [TUR.GetNameDef] jika [GER.GetNameDef] bertindak berdasarkan ultimatumnya."
 news.217.a: "Kita harus stand together against [GER.GetNameDef]."
 news.217.b: "[GER.GetNameDefCap] membuat lebih banyak musuh."
 news.217.c: "Jika mereka menolak kerja sama damai..."
 news.217.e: "[GER.GetNameDefCap] dan [TUR.GetNameDef] sedang memainkan permainan berbahaya."
 news.218.t: "Ya! Kami Tak Punya Pisang"
 news.218.d: "Meskipun program penjatahan kami yang ketat tidak mencakup buah-buahan segar, bayang-bayang perang menyebabkan kami kekurangan sebagian besar kapasitas impor. Oleh karena itu, banyak komoditas yang dulunya berasal dari daerah tropis kini menjadi barang mewah yang tidak dapat dicapai, termasuk komoditas seperti lemon dan pisang.\nUntuk menjaga semangat masa perang, para pemilik toko menggantungkan tanda di jendela mereka, merujuk pada lagu pertunjukan lama yang periang.\n\nSayangnya terdapat juga kekurangan kacang panjang dan bawang bombay, kubis dan daun bawang, serta segala jenis buah-buahan, namun semangat Inggris tetap bertahan!"
 news.218.a: "Aku hanya ingin pisang"
 news.219.t: "Pembersihan Kepemimpinan di [SOV.GetNameDef]"
 news.219.d: "Ketidakpastian telah lama menguasai [SOV.GetNameDef]. Meskipun rinciannya masih terbatas, telah terjadi serangkaian persidangan rahasia di tingkat tertinggi, dan baik jenderal maupun menteri menghilang dari pandangan publik.\nAsumsi yang wajar adalah bahwa ada konspirasi besar yang terungkap di dalam Partai Komunis, namun belum ada pernyataan resmi yang dibuat. Selain itu, laporan diplomatik yang dapat kami akses menunjukkan bahwa bukti-bukti yang diajukan dalam persidangan ini tidak dapat disangkal.\n\nApa pun yang terjadi, struktur komando tinggi [SOV.GetAdjective] telah berubah tanpa dapat ditarik kembali."
 news.219.a: "[SOV.GetLeader] telah mengamankan stabilitas di [SOV.GetNameDef]."
 news.219.b: "Bukti korupsi yang melekat pada komunisme."
 news.219.c: "Perintah [SOV.GetAdjective] sangat menderita"
 news.220.t: "Pemberontakan Perwira di [SOV.GetNameDef]!"
 news.220.d: "Sebagian dari komando tinggi Soviet telah bangkit memberontak melawan kepemimpinan [SOV.GetLeader]!\nBelum jelas apa yang memicu pemberontakan ini, namun tampaknya ini bukanlah upaya perebutan kekuasaan yang dirancang dengan matang.\n\nSituasi politik [SOV.GetAdjective] barangkali tidak sekukuh apa yang mereka tampakkan kepada dunia luar."
 news.220.a: "Rakyat akan selalu menang."
 news.220.b: "Untuk [Root.GetNameDef]!"
 news.220.c: "Mereka hancur dari dalam!"
 news.220.e: "Struktur kekuasaan sosialis tidak berkelanjutan."
 news.220.f: "Itu adalah perkembangan yang tidak terduga."
 news.221.t: "Trotsky Kembali ke [SOV.GetNameDef]"
 news.221.d: "Guncangan dahsyat melanda [SOV.GetNameDefCap], menyusul penggulingan Stalin oleh sebuah faksi penyokong rival politik lamanya, [SOV.GetLeader]!\nMengenai keberadaan sang diktator lama saat ini, atau bagaimana persisnya peralihan kekuasaan berlangsung, rinciannya masih sangat terbatas.\nNamun, segala indikasi menunjukkan bahwa peralihan ini tidak berlangsung damai, mengingat sejumlah loyalis Stalin telah mengibarkan bendera pemberontakan melawan rezim baru pimpinan Trotsky."
 news.221.a: "Internasional Keempat memimpin."
 news.221.b: "Seorang pemimpin dunia baru memasuki panggung."
 news.221.c: "Tapi Trotsky ada di sini di... Oh."
 news.222.t: "Parlemen [ENG.GetAdjective] Perdebatkan Intervensi di Skandinavia"
 news.222.d: "\nMempertimbangkan nilai strategis kawasan Skandinavia bagi upaya pertahanan [ENG.GetAdjective], serta potensi bahaya apabila musuh menancapkan pengaruh di sana, Parlemen [ENG.GetAdjective] telah memperdebatkan kemungkinan intervensi militer.\nKendati implikasi politik dari tindakan tersebut membebani [ENG.GetLeader], sejumlah argumen krusial dilontarkan sebelum akhirnya diputuskan bahwa sisa perdebatan harus dilangsungkan dalam sidang tertutup.\n\nIntervensi semacam itu dipastikan akan mengubah lanskap politik Eropa Utara secara permanen."
 news.222.a: "Kami melakukan apa yang harus kami lakukan, demi Raja dan negara."
 news.222.b: "Akankah mereka juga mengancam kemerdekaan [Root.GetAdjective]?"
 news.222.c: "[ENG.GetNameDefCap] harus membuat beberapa pilihan sulit."
 news.222.e: "Tindakan tersebut akan mengganggu keseimbangan di Eropa."
 news.222.f: "Apakah mereka benar-benar akan melakukan intervensi?"
 news.223.t: "Parlemen [ENG.GetAdjective] Perdebatkan Intervensi di Benelux"
 news.223.d: "\nBelajar dari Perang Besar, bangsa [ENG.GetAdjective] tidak akan memandang remeh nilai strategis wilayah Benelux, serta risiko bahaya membiarkan negara musuh menancapkan taring di sana. Parlemen [ENG.GetAdjective] kini telah memperdebatkan opsi intervensi militer.\nKendati konsekuensi politik dari tindakan ini membebani [ENG.GetLeader], sederet pertimbangan menentukan dipaparkan sebelum akhirnya diputuskan bahwa perdebatan dilanjutkan dalam sidang tertutup.\n\nLangkah intervensi semacam ini akan merombak total wajah perpolitikan di Eropa Barat."
 news.223.a: "Kami melakukan apa yang harus kami lakukan, demi Raja dan negara."
 news.223.b: "Akankah mereka juga mengancam kemerdekaan [Root.GetAdjective]?"
 news.223.c: "[ENG.GetNameDefCap] harus membuat beberapa pilihan sulit."
 news.223.e: "Tindakan tersebut akan mengganggu keseimbangan di Eropa."
 news.223.f: "Apakah mereka benar-benar akan melakukan intervensi?"
 news.224.t: "[ENG.GetNameDefCap] Tekan [SPR.GetNameDef]"
 news.224.d: "Dengan tradisi hegemoni Britania di Mediterania yang diproyeksikan dari Gibraltar, bukanlah hal yang mengejutkan apabila pemerintah [ENG.GetAdjective] memutuskan untuk melancarkan tekanan politik terhadap rezim fasis di [Spain.GetNameDef].\n\nDi tengah upaya pemulihan pascaperang saudara, dukungan dari [ENG.GetAdjective] terasa jauh lebih berharga ketimbang sekadar mempertahankan prinsip politik."
 news.224.a: "Kita harus accept their diplomatic mission."
 news.224.b: "Menurut [ENG.GetAdjective] siapa mereka?"
 news.224.c: "[ENG.GetAdjective] menggunakan pengaruhnya."
 news.225.t: "[ENG.GetNameDefCap] Tancapkan Pengaruh di [TUR.GetNameDef]"
 news.225.d: "\nMediterania telah lama menjadi kawasan bernilai strategis tinggi bagi pengaruh kekaisaran [ENG.GetNameDef]. Kini pemerintah [ENG.GetAdjective] mencari dukungan lebih lanjut dari negara-negara di kawasan tersebut. Untuk tujuan itu, mereka telah menunjuk seorang 'konsul khusus untuk negara [TUR.GetAdjective]'.\n\nMengingat persaingan sengit selama berabad-abad demi supremasi laut di Mediterania, keberhasilan mereka dalam mendekatkan kedua negara masih harus dinantikan."
 news.225.a: "Misi diplomatik mereka mungkin berguna bagi kita."
 news.225.b: "Menurut [ENG.GetAdjective] siapa mereka?"
 news.225.c: "[ENG.GetAdjective] menggunakan pengaruhnya."
 news.226.t: "[ENG.GetNameDefCap] Tancapkan Pengaruh di [GRE.GetNameDef]"
 news.226.d: "\nMediterania telah lama menjadi wilayah bernilai strategis luar biasa bagi proyeksi kekuasaan kekaisaran [ENG.GetNameDef]. Kini pemerintah [ENG.GetAdjective] berupaya merangkul dukungan lebih besar dari negara-negara di kawasan ini. Untuk keperluan itu, mereka telah mengangkat seorang 'konsul khusus untuk negara [GRE.GetAdjective]'.\n\nLebih dari satu abad setelah keikutsertaan Lord Byron dalam Perang Kemerdekaan Yunani, masih patut ditunggu apakah [ENG.GetNameDef] akan menuai keberhasilan serupa."
 news.226.a: "Misi diplomatik mereka mungkin berguna bagi kita."
 news.226.b: "Menurut [ENG.GetAdjective] siapa mereka?"
 news.226.c: "[ENG.GetAdjective] menggunakan pengaruhnya."
 news.227.t: "Perjalanan Gelap dan Liar"
 news.227.d: "'Kami baru sepuluh mil di luar Berlin ketika efek obat itu mulai terasa. Benda itu seharusnya meningkatkan kemampuan tempur kami. Konyol sekali. Satu-satunya hal yang meningkat hanyalah kecurigaanku bahwa komandanku sedang berusaha menyingkirkanku. Keadaan makin parah karena aku tak bisa membedakan antara deru rantai panzer Jerman dan denyutan liar di belakang pelupuk mataku.\nAku harus segera menemukan Dr. Gonzo.'"
 news.227.a: "Kami berada di negara Fledermaus."
 news.228.t: "[ENG.GetNameDefCap] Umumkan Prakarsa Diplomatik Balkan"
 news.228.d: "\n[ENG.GetNameDef] bukanlah satu-satunya pihak yang mencium ancaman yang kian membesar di Eropa Tengah.\n\nDengan status kedaulatan yang dijamin oleh Perjanjian Versailles yang kini mulai diobrak-abrik, atau di bawah ancaman retorika agresif kekuatan-kekuatan fasis yang mengklaim tanah air mereka, sejumlah negara terdorong untuk mengambil haluan politik pro-[ENG.GetAdjective].\n[ENG.GetNameDef] menyambut situasi ini dengan melipatgandakan manuver diplomatik mereka di kawasan Balkan."
 news.228.a: "Mari kita berharap mereka dapat melindungi kita dari gelombang fasis."
 news.228.b: "Mereka harus tetap berpegang pada \"lingkup pengaruh\" kecil mereka sendiri."
 news.228.c: "Stabilitas Eropa harus dijaga!"
 news.228.e: "[ENG.GetNameDefCap] sedang mempersiapkan strateginya."
 news.229.t: "[GRE.GetNameDefCap] Lawan Tekanan [GER.GetAdjective]"
 news.229.d: "Meski wilayahnya telah banyak menyusut akibat tuntutan teritorial yang didorong oleh [GER.GetNameDef], [GRE.GetNameDef] kini telah menarik garis batas tegas. [GRE.GetLeader] menyatakan dengan lugas bahwa [GRE.GetNameDef] tidak akan memberikan konsesi lagi, dan tidak akan sudi tunduk pada tuntutan apa pun dari [GER.GetAdjective].\n\nSikap keras ini merupakan tanggapan atas ultimatum dari [GER.GetNameDef], yang menuntut agar pemerintah [GRE.GetNameDef] meletakkan jabatan dan menerima pengganti yang direstui oleh [GER.GetAdjective]."
 news.229.a: "[GER.GetAdjective] uang muka harus ditolak!"
 news.229.b: "Mereka seharusnya menyelamatkan diri mereka sendiri selagi ada kesempatan."
 news.229.c: "Hal ini kemungkinan besar akan berakhir dengan konflik bersenjata."
 news.230.t: "Pemberontakan di Benua Amerika"
 news.230.d: "Di Amerika Tengah maupun Selatan, kaum revolusioner telah mengangkat senjata dan mengobarkan pemberontakan atas nama [USA.GetRulingIdeologyNoun].\n\nSecara umum mereka bersenjata lengkap dan terorganisir dengan rapi, dan seandainya mereka mengusung ideologi lain, jejak pendanaan mereka pasti sangat mudah dilacak. Akan tetapi, siapa pun pemasok gerakan-gerakan ini telah berusaha keras menyembunyikan keterlibatannya.\n\nTentu saja, hanya ada satu kekuatan adidaya yang memiliki misi kebijakan luar negeri eksplisit untuk menyebarkan [USA.GetRulingIdeologyNoun] di seantero Amerika..."
 news.230.a: "Mereka akan membawa negara kita ke jurang kehancuran!"
 news.230.b: "Hah? Bukankah kita."
 news.230.c: "Masyarakat di mana pun harus bangkit demi kebebasan!"
 news.230.e: "Kudeta yang disponsori Amerika?\nPeristiwa sekali seumur hidup!"
 news.231.t: "Penumpukan Pasukan [JAP.GetAdjective] di Perbatasan [CHI.GetAdjective]"
 news.231.d: "Menyusul Insiden Jembatan Marco Polo, [JAP.GetName] tidak mengendurkan tekanannya di perbatasan [CHI.GetAdjective].\nDiiringi retorika garang [JAP.GetAdjective] mengenai 'pembalasan dahsyat atas penolakan [CHI.GetNameDef] untuk bekerja sama', pecahnya kembali perang antara [JAP.GetNameDef] dan [CHI.GetNameDef] kian tak terelakkan dari hari ke hari.\n\nSituasi diplomatik dipastikan akan segera mencapai titik didih, dan pihak [JAP.GetNameDef] sama sekali tidak menunjukkan iktikad untuk meredakannya."
 news.231.a: "Penjajah imperialis yang kejam!"
 news.231.b: "Konflik di Tiongkok memang mengkhawatirkan."
 news.232.t: "[GER.GetNameDefCap] Cari Dukungan Skandinavia"
 news.232.d: "Menyinggung perihal 'kepentingan politik bersama', [GER.GetLeader] hari ini mengumumkan program diplomatik demi meningkatkan hubungan antara [GER.GetNameDef] dan negara-negara Skandinavia.\nLangkah awal ditempuh lewat pendirian misi diplomatik permanen di [DEN.GetNameDef], yang dimaksudkan untuk menjamin tidak adanya konflik antara kedua negara.\n\nPemerintah [DEN.GetAdjective] telah menyambut baik uluran tangan diplomatik ini, demikian klaim [GER.GetLeader].\n\nPara diplomat [DEN.GetAdjective] sendiri tidak dapat dihubungi untuk memberikan komentar."
 news.232.a: "Berteman lebih baik dari pada mencari musuh..."
 news.232.b: "Apakah mereka benar-benar mengira akan menemukan sekutu baru saat ini?"
 news.232.c: "Kita harus mewaspadai situasi ini."
 news.233.t: "Ketertarikan [GER.GetAdjective] di Skandinavia"
 news.233.d_war: "[GER.GetNameDefCap] memiliki kepentingan strategis yang sangat nyata di Skandinavia, baik sebagai pangkalan operasi militer maupun demi mengamankan impor sumber daya alam. Konflik yang kian membara menimbulkan ancaman konkret bagi jalur pengangkutan bahan mentah melalui Laut Baltik atau Laut Utara.\n\nDiiringi ancaman diplomatik yang kian intensif terhadap [DEN.GetNameDef] dan [NOR.GetNameDef], peningkatan operasi militer [GER.GetAdjective] di kawasan tersebut dipandang tinggal menunggu waktu."
 news.233.d_no_war: "Retorika [GER.GetAdjective] telah meningkat terhadap negara-negara utara dalam beberapa minggu terakhir. Pesannya jelas: [DEN.GetNameDef] dan [NOR.GetNameDef] sama sekali tidak boleh, baik melalui perlawanan atau kelambanan, menghambat impor Jerman.\n\nMeskipun tidak ada alasan yang jelas untuk tuntutan tersebut, karena impor masih mengalir bebas ke Jerman, para diplomat kami khawatir bahwa hal ini merupakan awal dari tindakan [GER.GetAdjective] di wilayah tersebut."
 news.233.a: "Ini bukan pertanda baik."
 news.233.b: "Kita harus mempertimbangkan pilihan kita."
 news.233.c: "Kami akan melihat bagaimana situasinya berkembang."
 news.234.t: "Tekanan [GER.GetAdjective] terhadap Benelux"
 news.234.d: "Menyusul meletusnya perang dengan Prancis, Jerman melancarkan tekanan diplomatik yang lebih gencar daripada sebelumnya terhadap negara-negara Benelux. Akan tetapi, berkat sokongan [FRA.GetAdjective] dan [ENG.GetAdjective], mereka menolak untuk tunduk.\n\nBanyak pihak meyakini bahwa jika [GER.GetNameDef] gagal meraih tujuannya lewat jalan diplomasi, mereka tak akan segan-segan merebutnya dengan kekuatan senjata."
 news.234.a: "Tidak lagi!"
 news.234.b: "[GER.GetNameDefCap] harus dijauhkan!"
 news.234.c: "Itu akan menjadi serangan yang agresif."
 news.235.t: "Chaplin Ditangkap di California"
 news.235.d: "Kabar menggembirakan bagi [GER.GetLeader] hari ini, di mana bintang film idolanya, Charlie Chaplin, telah tertangkap di California. Saat melarikan diri ke kawasan pedesaan, ia dihentikan oleh patroli [GER.GetAdjective], yang langsung mengenalinya lewat kumisnya yang tersohor. Setelah memintanya mengulangi monolog penutup dari karya agungnya 'The Great Dictator', aktor ternama itu 'diyakinkan' untuk ikut menghibur pasukan [GER.GetAdjective] yang bertugas di sana.\n\nKini ia akan dikirim ke Berlin, tempat di mana [GER.GetLeader] akhirnya dapat bersua dengan sang idola. Meski perbedaan haluan politik berpotensi membayangi pertemuan tersebut, [GER.GetLeader] menanti momen itu dengan gembira layaknya seorang anak kecil."
 news.235.a: "Dia akan mendapat sambutan layaknya seorang pahlawan Amerika!"
 news.236.t: "Konferensi Yalta"
 news.236.d: "Melihat kemenangan bersama melawan [GER.GetNameDef] sebagai hal yang tak terelakkan, [yalta_origin.GetNameDef] dan [yalta_partner.GetNameDef] berupaya mengamankan stabilitas masa depan di Eropa. [yalta_origin.GetLeader], [yalta_partner.GetLeader], dan para pemimpin negara-negara lain yang berpartisipasi dalam upaya perang telah bertemu untuk menyepakati nasib [GER.GetNameDef].\n\nHari-hari perundingan telah menghasilkan gambar peta baru Eropa. Tatanan baru Eropa ini terbagi antara timur dan barat melalui luka yang akan diukir di tengah-tengah [GER.GetNameDef].\n\nMasih harus dilihat apakah hal ini benar-benar akan membawa perdamaian abadi di Eropa."
 news.236.a: "Jangan memuji hari sebelum malam berakhir."
 news.236.b: "Kami menuntut apa yang tampaknya benar."
 news.236.c: "Mari kita selesaikan perang ini secepatnya."
 news.236.e: "Ini mungkin akhir dari [GER.GetNameDef]."
 news.237.t: "Anschluss Austria"
 news.237.d: "Menyusul kudeta yang berhasil dilancarkan oleh partai Nazi setempat di [From.Root.GetNameDef], pasukan Jerman telah melintasi perbatasan dan mengambil alih kendali negeri itu.\n\nTentara Jerman disambut oleh sorak-sorai khalayak ramai di kota-kota saat mereka merangsek ke seluruh penjuru negeri untuk bergabung dengan pihak [From.Root.GetAdjective] yang bertempur dalam perang saudara. [GER.GetLeader] mengumumkan penyatuan (Anschluss) Austria, dan menegaskan:\n\n'Penderitaan rakyat akan segera berakhir! Provinsi timur tertua dari bangsa Jerman, mulai saat ini, akan menjadi benteng terdepan terbaru bagi [GER.GetNameDef]!'"
 news.237.a: "Jika itu yang mereka inginkan..."
 news.237.b: "Selamat datang di Reich!"
 news.237.c: "Kita harus mengamankan perbatasan utara kita!"
 news.237.e: "Ini melanggar Perjanjian Versailles!"
 news.238.t: "[AST.GetNameDefCap] Ambil Tanggung Jawab atas Wilayah Jajahan"
 news.238.d: "\nDalam ikhtiar membendung ancaman yang kian membesar terhadap jajahan [ENG.GetAdjective] di Asia Tenggara, wilayah kolonial Singapura dan Kalimantan telah dialihkan pengelolaannya kepada [AST.GetNameDef]. Bertekad menjadi lini pertahanan pertama dan terunggul bagi Persemakmuran di Pasifik, [AST.GetNameDef] memikul tanggung jawab penuh atas persiapan militer serta administratif andai perang meletus di kawasan tersebut.\n\nDengan tujuan utama membendung ambisi imperial [JAP.GetNameDef], [AST.GetNameDef] kini tak lagi bergantung sepenuhnya pada upaya sang mantan penguasa kolonial dalam melindungi pantainya dari serbuan musuh."
 news.238.a: "Sebuah strategi yang menarik."
 news.238.b: "Mari berharap [AST.GetNameDef] mengetahui apa yang mereka lakukan."
 news.238.c: "Kami akhirnya memiliki sarana yang kami butuhkan untuk mempertahankan benua ini."
 news.238.e: "Apakah mereka benar-benar yakin hal ini akan membuat perbedaan?"
 news.239.t: "[AST.GetNameDefCap] Bergabung dengan [SOV.GetFactionName]"
 news.239.d: "Melihat negara mereka sebagai \"sekutu alami dalam penyebaran revolusi\", [AST.GetLeader] dan [SOV.GetLeader] telah menandatangani sebuah perjanjian yang menjadikan [AST.GetNameDef] sebagai salah satu anggota utama dari [SOV.GetFactionName].\n[AST.GetNameDef] telah dinyatakan sebagai contoh cemerlang dari sebuah negara buruh, oleh dan untuk rakyat, dan bukannya sebagai penguasa kolonial. Eropa.\n\nDengan perkembangan terkini dalam politik [AST.GetAdjective], beberapa orang mungkin mengatakan langkah ini tidak bisa dihindari. Namun demikian, hal ini dipandang sebagai penyebab kekhawatiran yang besar di kalangan \"penguasa kolonial Eropa\", dan siapa pun yang menentang cengkeraman komunis dan Revolusi Dunia yang mereka lakukan."
 news.239.a: "Sangat membingungkan."
 news.239.b: "Kami menyambut rekan-rekan sosialis kami dengan tangan terbuka!"
 news.239.c: "Kami adalah garis depan keadilan dan keadilan!"
 news.239.e: "Lebih banyak tikus menaiki kapal yang akan kita tenggelamkan."
 news.240.t: "Perjanjian Jayapura"
 news.240.d: "Pemerintah [AST.GetAdjective] dan [HOL.GetAdjective] hari ini mengumumkan sebuah 'Pakta Pertahanan dan Kerja Sama Bersama' yang menyerahkan wilayah jajahan [HOL.GetAdjective] di Asia Tenggara ke bawah naungan perlindungan angkatan bersenjata [AST.GetAdjective]. Perjanjian ini ditandatangani oleh Gubernur Hindia Belanda dan [AST.GetLeader], yang menyatakan bahwa kesepakatan tersebut mencakup wewenang administrasi kolonial penuh, mengingat 'situasi di Eropa yang teramat jauh dan genting'.\n\nPemerintah [HOL.GetAdjective] sendiri belum mengeluarkan pernyataan resmi mengenai perjanjian tersebut."
 news.240.a: "Ini mengejutkan."
 news.240.b: "Seseorang melakukan apa yang harus dilakukan untuk bertahan hidup."
 news.240.c: "[AST.GetNameDefCap] mengawasi Pasifik."
 news.241.t: "[NZL.GetNameDefCap] Tunduk pada Pengaruh [AST.GetAdjective]"
 news.241.d: "Menyusul tegaknya negara sosialis buruh di Australia, pemerintah [AST.GetAdjective] kini giat menancapkan hegemoninya di kawasan itu. Menyuarakan seruan kaum tani dan buruh pabrik yang tertindas di [NZL.GetNameDef], [AST.GetNameDef] telah menekan pemerintah [NZL.GetAdjective] untuk bergabung ke dalam 'Serikat Rakyat' Pasifik Selatan.\n\nMerasa terkepung dan tipis harapan memperoleh bala bantuan tepat waktu dari [ENG.GetFactionName], [NZL.GetNameDef] akhirnya menyerah pada tuntutan itu. Kendati [AST.GetLeader] mendengungkan 'kesetaraan semua negara sebagai cerminan kesetaraan seluruh manusia', nyaris tak ada keraguan tentang siapa yang memegang kendali utama."
 news.241.a: "Banyak hal sedang berubah di Pasifik."
 news.241.b: "Kami tidak punya pilihan, jadi... untuk revolusi."
 news.241.c: "Biarkan saya mendengar Anda berkata \"untuk revolusi!\""
 news.242.t: "[AST.GetNameDefCap] Ambil Alih Kendali Koloni Asia Tenggara"
 news.242.d: "\nDoktrin militer [ENG.GetNameDef] telah lama bergulat dengan peliknya pertahanan di Asia Tenggara. Kini mereka berharap beban itu terangkat, seiring [AST.GetNameDef] mengambil alih tanggung jawab mempertahankan Singapura dan Kalimantan dari geliat militer musuh di kawasan tersebut.\n\nPengalihan wewenang ini mencakup pula administrasi sipil di wilayah jajahan tersebut untuk sementara waktu, demi memberi keleluasaan bagi [AST.GetNameDef] dalam mengambil segala tindakan yang diperlukan guna menjaga benua mereka dari serbuan seberang lautan. Dampak politik dari langkah ini bagi [ENG.GetNameDef], [AST.GetNameDef], dan [MAL.GetNameDef] masih belum dapat dipastikan."
 news.242.a: "Hal ini mengubah keseimbangan kekuatan di Asia Tenggara."
 news.242.b: "Semoga saja [AST.GetNameDef] tidak merusak ini."
 news.242.c: "Sempurna! Semua sesuai rencana."
 news.243.t: "[AST.GetNameDefCap] dan [JAP.GetNameDef] Umumkan Aliansi"
 news.243.d: "Menyusul ekspansi [AST.GetNameDef] dan [JAP.GetNameDef] di Asia Timur dan Pasifik belakangan ini, banyak pengamat memperkirakan bahwa bentrokan antara dua kekaisaran yang tengah naik daun ini tinggal menunggu waktu. Namun, kedua negara tersebut justru mencapai mufakat kerja sama, dalam apa yang segera dijuluki sebagai 'Benteng Pasifik'.\nPerjanjian ini tidak dipublikasikan oleh kedua belah pihak, sehingga banyak butir kesepakatan yang masih menjadi misteri. Yang pasti, kedua belah pihak saling menjanjikan bantuan militer demi 'menangkal gerak maju pihak luar yang serakah di kawasan kita masing-masing'.\n\nMasih terlalu dini untuk menebak rupa tatanan dunia yang diangankan oleh [JAP.GetNameDef] dan [AST.GetNameDef], tetapi tak diragukan lagi bahwa [AST.GetFactionName] kini menjadi kekuatan terkuat di Pasifik."
 news.243.a: "Membingungkan, untuk sedikitnya."
 news.243.b: "[Root.GetNameDefCap] menyambut baik kerja sama dengan semua orang yang tidak menghalangi kita."
 news.243.c: "Ini adalah kemitraan yang hebat, setidaknya untuk saat ini."
 news.244.t: "[AST.GetNameDefCap] Bentuk Mandala Pengaruh"
 news.244.d: "Dalam manuver yang telah diprediksi oleh banyak pengamat, [AST.GetNameDef] telah mengumumkan organisasi pakta pertahanan mandirinya sendiri. [AST.GetLeader] menyatakan bahwa [AST.GetNameDef] akan mencari sekutu demi menjaga stabilitas di kawasan Asia Tenggara-Pasifik dan sekitarnya, serta jika perlu menangkis agresi terhadap kedaulatan [AST.GetAdjective] maupun mitranya.\n\nSeiring langkah menjauh dari ikatan Persemakmuran, ini tampak sebagai langkah wajar berikutnya saat [AST.GetNameDef] bertekad menjadi penentu nasibnya sendiri."
 news.244.a: "Mereka sedang bermain untuk mendominasi."
 news.244.b: "Halaman belakang rumah kita sendiri tidak akan dikuasai oleh orang Eropa!"
 news.245.t: "[USA.GetNameDefCap] Bergabung dalam Prakarsa Pertahanan [AST.GetAdjective]"
 news.245.d: "\nDidorong oleh kian pentingnya nilai strategis Samudra Pasifik, [AST.GetNameDef] dan [USA.GetNameDef] telah menandatangani pakta kerja sama Pasifik. Kendati dirancang untuk menjaga stabilitas politik kawasan serta kelancaran pelayaran trans-Pasifik, pakta ini juga memuat klausul kesiapsiagaan pertahanan militer, yang memungkinkan kedua negara memproyeksikan kekuatan jauh melampaui perbatasan wilayah mereka sendiri.\n\nDengan cakupan wilayah mahaluas yang kini berada di bawah 'perlindungan' Australia-Amerika, tinggal menunggu waktu sebelum kesiapsiagaan tersebut diuji di medan laga."
 news.245.a: "Sebuah gerakan yang menarik..."
 news.245.b: "Hal ini akan memastikan posisi kita sebagai kekuatan dominan di Pasifik."
 news.245.c: "Bersama-sama kita akan menjaga stabilitas di separuh dunia."
 news.246.t: "[USA.GetNameDefCap] dan [CAN.GetNameDef] Resmikan Aliansi"
 news.246.d: "Setelah bekerja sama selama beberapa waktu melalui Dewan Pertahanan Gabungan, kemitraan politik baru telah berkembang antara [USA.GetNameDef] dan [CAN.GetNameDef]. Disebut [CAN.GetFactionName], program ini bertujuan untuk memajukan kepentingan Amerika Utara dalam semua urusan luar negeri, termasuk semua urusan pertahanan dan tindakan militer.\n\nDengan [CAN.GetNameDef] masih menemukan diri mereka pasca-kolonial dan para politisi [USA.GetAdjective] praktis saling bertarung karena kebijakan isolasionis dan intervensionis, aliansi yang baru dibentuk ini mungkin menawarkan arah kebijakan luar negeri yang sangat kurang bagi kedua negara."
 news.246.a: "Akankah mereka melihat ke benua Amerika, atau lebih jauh lagi?"
 news.246.b: "Saudara sedara, saudara seperjuangan!"
 news.246.c: "Tidak ada ancaman di dalam negeri saat ini."
 news.247.t: "[CAN.GetNameDefCap] Bergabung dengan Aliansi Pimpinan [GER.GetAdjective]!"
 news.247.d: "Menyusul negosiasi kilat, [CAN.GetNameDef] mengumumkan bahwa mereka resmi menjadi anggota penandatangan [GER.GetFactionName]. Pemerintah [CAN.GetAdjective] memproklamasikan dirinya sebagai 'pelindung penuh kebanggaan bagi rakyat [GER.GetAdjective], sebagaimana [GER.GetNameDef] akan menjadi perisai bagi bangsa [CAN.GetAdjective]'.\n\nKendati butir kesepakatan masuknya [CAN.GetNameDef] ke dalam pakta ini belum terungkap, agresi militer terhadap musuh-musuh [GER.GetNameDef] tampaknya akan segera dilancarkan dalam waktu dekat. Ini bisa menjadi babak penentu dalam jalannya perang."
 news.247.a: "Perkembangan yang mengejutkan!"
 news.247.b: "Kami akan membantu sekutu kami di Eropa!"
 news.247.c: "Saudara sekalian berdiri bersama!"
 news.247.e: "Sialan [CAN.GetAdjective] yang berubah-ubah itu!"
 news.248.t: "[ENG.GetNameDefCap] Lepaskan Wilayah Timur Laut"
 news.248.d: "Menyusul meningkatnya tekanan diplomatik dari [CAN.GetNameDef], [ENG.GetNameDef] telah menyerahkan wilayah Labrador dan Newfoundland ke negara bagian [CAN.GetAdjective]. Sudah lama menjadi tujuan para politisi [CAN.GetAdjective] untuk \"menyatukan seluruh wilayah [CAN.GetAdjective] yang sah\", sebuah tujuan yang kini selangkah lebih dekat untuk terwujud.\n\nTentu saja, pertanyaan yang belum terjawab masih tetap mengenai apa yang dimaksud dengan wilayah \"yang menjadi hak [CAN.GetAdjective]\". Baik [ENG.GetNameDef] maupun seluruh benua Amerika Utara akan tidur dengan satu mata terbuka mulai sekarang."
 news.248.a: "[ENG.GetNameDefCap] tidak lagi memiliki pijakan di Amerika Utara..."
 news.248.b: "Semuanya sebagaimana mestinya."
 news.248.c: "Bah, ambillah batu-batu terpencil itu!"
 news.249.t: "[CAN.GetNameDefCap] dan [MEX.GetNameDef] Bersatu!"
 news.249.d: "Para politisi [USA.GetAdjective] terbangun karena berita yang mengkhawatirkan pagi ini, ketika [CAN.GetNameDef] dan [MEX.GetNameDef] mengumumkan pakta pertahanan baru, yang berfokus pada \"melawan dan membendung ancaman langsung terhadap kelanjutan kedaulatan kedua negara.\" Ancaman terselubung ini tidak banyak menyamarkan niat untuk menghambat upaya militer [USA.GetNameDef] di benua Amerika, dan mungkin di luarnya.\n\nPara komentator politik membandingkan situasinya dengan situasi di Eropa sebelum Perang Besar; kedua belah pihak akan kehilangan segalanya, dan tidak ada cara untuk meredakan ketegangan. Pertanyaannya bukan lagi soal siapa yang memberikan ancaman lebih besar kepada siapa, melainkan pihak mana yang akan melancarkan serangan pendahuluan terlebih dahulu."
 news.249.a: "Kita telah melihat ini sebelumnya; itu hanya bisa berakhir dengan air mata."
 news.249.b: "Tentara dari utara akan siap."
 news.249.c: "Tentara dari selatan akan siap."
 news.249.e: "Kita harus menemukan cara untuk melawan tindakan ini dengan cepat."
 news.250.t: "Perang Saudara di [MEX.GetNameDef]!"
 news.250.d: "Gejolak politik [MEX.GetAdjective] selama beberapa tahun terakhir akhirnya meletus menjadi bentrokan bersenjata! Kekuatan dari partai Sinarkis telah mengangkat senjata, dan pertempuran berkecamuk di jalan-jalan sejumlah kota besar di [MEX.GetAdjective]!\n\nKendati pemerintah diyakini memiliki keunggulan mutlak untuk memadamkan pemberontakan, desas-desus mengenai sokongan asing bagi kaum nasionalis kian santer berhembus. Negara-negara tetangga mengamati situasi ini dengan napas tertahan. Ke mana arah perang saudara ini membawa Meksiko, hanya waktu yang dapat menjawab."
 news.250.a: "Konflik yang mengkhawatirkan dan mungkin akan menghancurkan Meksiko."
 news.250.b: "Sekarang kita hanya perlu memastikan kaum nasionalis merebut kekuasaan."
 news.250.c: "Sebuah biaya yang mahal bagi negara kita, namun harus dibayar."
 news.251.t: "[CAN.GetNameDefCap] Tuntut Pemulangan Konstitusi Segera"
 news.251.d: "\n\nMenyusul kebuntuan dalam negosiasi dengan Westminster serta perdebatan sengit tanpa henti selama 63 jam, Parlemen Kanada telah mencabut Akta Amerika Utara Britania, mengabadikan Konstitusi Kanada dalam undang-undang yang tak lagi dapat disentuh oleh parlemen maupun monarki Britania.\nKendati bukan serta-merta merupakan tindakan anti-Britania, ini menandakan pelepasan diri dari doktrin Persemakmuran imperium lama.\n\nMeski merupakan langkah alamiah bagi negara berdaulat mana pun yang ingin mengamankan kestabilan masa depannya, manuver ini sama sekali tak meredakan ketegangan konstelasi geopolitik global yang kian rapuh."
 news.251.a: "Kalau begitu, mereka bisa bertahan sendirian."
 news.251.b: "[ENG.GetNameDefCap] semakin lemah dari hari ke hari."
 news.251.c: "Kenapa ini harus terjadi sekarang?!"
 news.251.e: "Sebuah kerajaan hancur berantakan."
 news.251.f: "Dari Laut ke Laut, [CAN.GetNameDef] akan gratis!"
 news.252.t: "[CAN.GetNameDefCap] Bergabung ke [GER.GetFactionName]!"
 news.252.d: "Memandang diri mereka sebagai sekutu alami, [GER.GetNameDef] dan [CAN.GetNameDef] telah menandatangani pakta pertahanan bersama. Perdana Menteri [CAN.GetAdjective], [CAN.GetLeader], mengumumkan aliansi tersebut dalam sebuah pidato yang menggarisbawahi keselarasan alami antara kepentingan [CAN.GetAdjective] dan [GER.GetAdjective].\n\nMenimbang peningkatan mobilisasi militer di seantero Eropa serta kian menjauhnya [CAN.GetNameDef] dari Persemakmuran, tidaklah sulit untuk menerka kepentingan macam apa yang tengah dibicarakan.\nBaik di Eropa maupun di Amerika, kekuatan-kekuatan lama menyaksikan pergeseran ini dengan kecemasan yang kian mendalam."
 news.252.a: "Ini adalah cara dunia berubah..."
 news.252.b: "Kita adalah beban yang menjaga keseimbangan kekuatan."
 news.252.c: "Dengan ini keseimbangan kekuatan akan menguntungkan kita!"
 news.252.e: "Hal lain yang perlu dikhawatirkan, jika sampai terjadi perang."
 news.252.f: "Kami tumbuh semakin kuat!"
 news.253.t: "[AST.GetNameDefCap] Berupaya Menjauh dari Persemakmuran"
 news.253.d: "\nDalam pidatonya pagi ini, Perdana Menteri [AST.GetLeader] mengumumkan komitmen pemerintah Australia demi kemajuan dan stabilitas sebagai negara Oseania. Ini berarti mengalihkan pandangan ke cakrawala baru di luar Eropa milik Britania, lantaran rakyat Australia tak sanggup lagi memikul beban konflik asing di pundak mereka. Merujuk langsung pada Amanat Raja saat pembukaan parlemen lalu, [AST.GetLeader] menegaskan sikapnya dengan menyerukan 'Jangan Ada Lagi Gallipoli!'.\n\nGemuruh sorak-sorai khalayak menandakan fajar era baru dalam perpolitikan Australia telah menyingsing. Ke mana arah akhirnya, dunia hanya bisa berspekulasi."
 news.253.a: "[Root.GetFactionName] harus dilakukan tanpa [AST.GetNameDef]."
 news.253.b: "Saksikan sebuah kerajaan hancur berkeping-keping..."
 news.253.c: "Mereka memilih SEKARANG untuk mencari kemerdekaan yang lebih besar?"
 news.253.e: "Hal ini akan mempunyai konsekuensi besar di Pasifik."
 news.253.f: "Kami mempertaruhkan jalan kami sendiri!"
 news.254.t: "[AST.GetNameDefCap] dan Selandia Baru 'Bersatu'"
 news.254.d: "[AST.GetNameDefCap], yang menegaskan kemerdekaan penuhnya, mulai menancapkan pengaruhnya di Pasifik Selatan. Sebagai bagian dari langkah ini, pemerintah [AST.GetAdjective] menuntut agar seluruh bekas wilayah jajahan di Oseania diserahkan ke bawah kekuasaan mereka.\n\nTentu saja enggan tunduk, pemerintah [ENG.GetAdjective] dan Selandia Baru yang terdesak awalnya melancarkan perlawanan diplomatik. Namun, tanpa adanya pangkalan untuk memproyeksikan wibawa Imperium di kawasan tersebut—peran yang sebelumnya diemban Australia—hanya soal waktu sebelum [AST.GetNameDef] melayangkan ultimatum berdarah.\nSelandia Baru kini resmi menjadi provinsi paling timur dari [AST.GetNameDef]."
 news.254.a: "Kita harus mewaspadai situasinya."
 news.254.b: "Seperti yang benar."
 news.254.c: "Ini adalah pengkhianatan!"
 news.260.t: "[SAF.GetNameDefCap] Ambil Tanggung Jawab atas Koloni Afrika"
 news.260.desc: "Dalam upacara resmi hari ini, [SAF.GetLeader] menandatangani perjanjian yang akan memberikan pemerintahannya kendali atas wilayah ketergantungan Inggris di Afrika. Wilayah Bechuanaland, Rhodesia dan Kenya sekarang akan dikelola dari Pretoria.\n\nBerbicara di depan House of Commons, [ENG.GetLeader] membantah bahwa tindakan tersebut melemahkan posisi Inggris di benua tersebut, dan menyebutnya sebagai \"perubahan yang paling masuk akal untuk memungkinkan administrasi dan pertahanan yang lebih efisien di wilayah ini.\""
 news.260.a: "Menarik."
 news.260.b: "Memang sangat masuk akal."
 news.260.c: "Apakah ini awal dari berakhirnya Imperium di Afrika?"
 news.261.t: "[ENG.GetNameDefCap] Reorganisasi Koloni di Afrika"
 news.261.desc: "Parlemen Britania dengan selisih suara tipis menyetujui undang-undang yang merombak secara mendasar tata kelola koloni Britania di Afrika. Undang-undang baru ini secara efektif membentuk dua rezim kolonial baru di Rhodesia dan Kenya. Wilayah-wilayah baru ini akan menikmati otonomi tertentu dalam mengurus urusan domestik mereka, namun diwajibkan membiayai dan menyelenggarakan pertahanan mereka sendiri.\n\nSejumlah kalangan konservatif yang menentang keputusan ini menyuarakan kekhawatiran terbuka bahwa langkah ini adalah gerbang awal dari proses yang mereka sebut 'dekolonisasi'.\n\n[ENG.GetLeader] belum dapat dimintai keterangan."
 news.261.a: "Menarik."
 news.261.b: "Pengaturan yang bodoh."
 news.261.c: "Tampaknya itu adalah salah satu cara untuk mengembangkan Persemakmuran."
 news.262.t: "Perang Saudara Afrika Selatan"
 news.262.desc: "Ketegangan yang berkepanjangan di [SAF.GetName] kini telah berubah menjadi perang terbuka. Kaum Nasionalis fasis mengklaim bahwa kebijakan pemerintahan Unionis yang demokratis mengancam cara hidup [SAF.GetAdjective]. Para Unionis, kata mereka, menikam para pejuang pemberani Perang Boer dari belakang dengan dukungan tanpa syarat mereka untuk [ENG.GetName].\n\nPemerintahan Sementara Nasionalis di bawah [SAF.GetLeader] telah menyerukan semua patriot sejati untuk bergabung dengan mereka dalam memulihkan kebebasan di Afrika Selatan melalui kekuatan senjata. Pemerintahan Unionis di Pretoria menyebut kaum Nasionalis sebagai \"pemberontak dan pengkhianat yang paling buruk\". Dengan kekuatan militer yang menyatakan dukungan yang sama bagi kedua belah pihak, konflik di Afrika Selatan mungkin memerlukan waktu lama untuk diselesaikan."
 news.262.a: "Mungkin kita harus mempertimbangkan untuk mengirimkan dukungan."
 news.262.b: "Ini sudah lama terjadi."
 news.262.c: "Mungkin ancaman terbesar ada di dalam perbatasan kita..."
 news.263.t: "Kerusuhan Anti-Monarki di [SAF.GetNameDef]"
 news.263.desc: "Gelombang demonstrasi anti-monarki, yang sebagian besar berujung anarki, telah melanda seantero Afrika Selatan. Ribuan pengunjuk rasa tumpah ke jalan-jalan, menyerbu pos-pos polisi serta gedung-gedung pemerintah. Potret sang Raja dirobek, dicabik-cabik, dibakar, dan dalam satu insiden, dilarutkan ke dalam asam.\n\nPara pengamat mencatat bahwa kepolisian dan militer tampak sangat enggan meredam amuk massa, dan lebih memilih berjaga di pabrik-pabrik serta jembatan. Hal ini memicu kecurigaan apakah kerusuhan ini benar-benar terjadi di luar dugaan pemerintah."
 news.263.a: "Sebuah revolusi sedang terjadi?"
 news.263.b: "Tidak ada komentar."
 news.263.c: "Mungkin ancaman terbesar ada di dalam perbatasan kita..."
 news.264.t: "Serikat Rakyat Afrika"
 news.264.desc: "Anggota pendiri [SAF.GetFactionName] telah berkumpul di Pretoria untuk mengumumkan pembentukan aliansi baru mereka. Para pengamat Eropa dengan cepat mencatat bahwa satu-satunya pemerintahan yang memiliki legitimasi adalah pemerintahan [SAF.GetNameDef] itu sendiri, [SAF.GetLeader] yang memimpin berbagai pemerintahan yang ditunjuk sendiri di pengasingan dan kelompok-kelompok revolusioner lainnya.\n\nPartai-partai yang hadir mengeluarkan deklarasi bersama, menyerukan Kekuatan Kekaisaran Eropa untuk melepaskan tanah apa pun yang mereka miliki di Afrika kepada pemilik sahnya sekaligus, mengutuk praktik kolonialisme dan bersumpah untuk memberikan kebebasan kepada masyarakat Afrika yang tertindas – dengan cara apa pun yang diperlukan."
 news.264.a: "orang Afrika? Mengatur diri mereka sendiri !?"
 news.264.b: "Langkah pertama dalam perjalanan menuju kebebasan sejati."
 news.264.c: "Mari kita lihat apakah idealisme mereka bertahan hingga perang yang akan datang."
 news.264.d: "Ternyata mereka bukan komunis sejati."
 news.265.t: "Tekanan [SAF.GetAdjective] terhadap Prancis"
 news.265.desc: "Menyusul kekalahan mengejutkan yang diderita Prancis di tanah airnya, legitimasi kerajaan kolonialnya dipertanyakan. Pemerintah [SOV.GetNameDef] dan [SAF.GetNameDef] telah mengeluarkan pernyataan bersama yang menyatakan bahwa Prancis tidak dapat lagi dipercaya untuk menjaga ketertiban di Madagaskar, menuntut agar pulau tersebut diserahkan kepada [SAF.GetNameDef].\n\nPemerintah Perancis yang bebas telah bertemu untuk membahas masalah ini. Pakar pertahanan berpendapat kecil kemungkinannya pasukan Prancis yang terkuras akan mampu mempertahankan pulau tersebut, jika terjadi perang."
 news.265.a: "Hanya hiu yang mencium bau darah di dalam air."
 news.265.b: "Mari kita lihat apakah orang Prancis bersikap masuk akal."
 news.265.c: "Prancis sudah selesai."
 news.265.d: "Satu lagi kemenangan tanpa pertumpahan darah bagi komunisme."
 news.270.t: "Kelahiran Kendaraan Lapis Baja [NZL.GetAdjective]"
 news.270.desc: "Menderu melintasi jalan protokol ibu kota, tank Bob Semple terbaru milik Pasukan Pertahanan Selandia Baru berdiri gagah sebagai bukti nyata kelihaian dan semangat juang rakyat [NZL.GetAdjective]. Dipersenjatai enam senapan mesin dan dilapisi pelat besi yang hampir pasti antipeluru, kendaraan ini digadang-gadang sebagai rintangan terbesar yang harus dihadapi oleh penyerbu mana pun.\n\nSejumlah pihak yang mengaku pakar menyoroti performa kendaraan yang loyo serta persenjataannya yang minim sebagai dalih mengapa tank ini tak layak diproduksi. Namun, sebagaimana ditegaskan Perdana Menteri [NZL.GetLeader] dalam upacara peresmian kendaraan tersebut, kesiapsiagaan pertahanan negara teramat mendesak sehingga perlengkapan yang sempurna tak dapat dinanti maupun dituntut."
 news.270.a: "Jadi ini yang kamu sebut tank!"
 news.270.b: "Mereka menyebut hal ini APA?"
 news.271.t: "'Big Bob' Unjuk Gigi"
 news.271.desc: "Menyusul kesuksesan gemilang tank Bob Semple, komando tinggi Pasukan Pertahanan [NZL.GetName] meminta agar versi yang lebih masif segera diproduksi. Menjulang setinggi lebih dari 15 kaki dan berbobot tak kurang dari 120 ton, monster lapis baja baru ini benar-benar mencengangkan. Persenjataannya yang terdiri dari meriam antitank kembar 17-pon sanggup melumat musuh dalam sekejap, sementara perisai bajanya yang tebal—yang telah diuji secara menyeluruh guna memastikan bahwa ia memang benar-benar antipeluru—memungkinkannya merangsek ke kancah pertempuran tanpa rasa gentar.\n\nDalam upacara peluncurannya, seorang pengamat menyebutnya 'tank paling luar biasa yang pernah diciptakan', sementara yang lain memujinya 'tiada tanding'.\nProduksi massal diperkirakan akan dimulai dalam bulan ini."
 news.271.a: "Dunia gemetar saat melihat tank kita!"
 news.271.b: "Dunia bergetar...dengan tawa."
 news.272.t: "Bencana Kelaparan Bengal Melanda"
 news.272.desc: "Bencana alam, ketidakcakapan administrasi, dan kejamnya perang telah berpadu memicu malapetaka kelaparan massal di India.\n\nMenyusul badai topan yang memporak-porandakan sebagian besar wilayah serta melenyapkan hampir seluruh panen padi, aparat pemerintah kolonial terbukti lamban—bahkan dinilai sengaja mengulur waktu—dalam menanggulangi krisis ini. Kendati daerah lain di India mengalami surplus pangan, tak ada pengiriman bantuan logistik akibat kekhawatiran pasokan tersebut jatuh ke tangan musuh.\n\nWilayah yang luas hancur luluh-lantak, dan korban jiwa serta kerugian produksi yang timbul bahkan belum dapat diperkirakan."
 news.272.a: "Mengerikan."
 news.272.b: "Mengerikan."
 news.272.c: "Tidak ada yang bisa dilakukan mengenai hal itu."
 news.273.t: "Bencana Kelaparan Bengal Berakhir"
 news.273.desc: "Setelah berbulan-bulan berpangku tangan, pemerintah kolonial dan tentara India akhirnya memutuskan untuk bertindak. Penyaluran bantuan pangan darurat mulai menjangkau daerah-daerah terdampak, sementara panen padi yang baru telah melampaui perkiraan.\n\nKendati demikian, harga bahan makanan di kawasan bencana masih melambung tinggi, dan dampak jangka panjang dari malapetaka kelaparan ini masih belum dapat ditaksir sepenuhnya."
 news.273.a: "Setidaknya semuanya sudah berakhir."
 news.273.b: "Akhirnya."
 news.280.t: "India Raih Pemerintahan Mandiri (Home Rule)"
 news.280.desc: "Setelah pertemuan yang menegangkan antara duta besar [GER.GetAdjective] dan menteri luar negeri [ENG.GetAdjective], pemerintah [ENG.GetNameDef] hari ini mengumumkan bahwa [RAJ.GetNameDef] akan diizinkan untuk menentukan kebijakannya sendiri mulai sekarang. Pemerintahan Inggris selama berabad-abad di anak benua ini secara mengejutkan berakhir dengan sangat cepat karena pegawai negeri diperintahkan pulang dan pemerintahan kolonial diserahkan kepada penduduk asli India.\n\nSalah satu tindakan pertama dari kepemimpinan baru India adalah mengumumkan perjanjian kerja sama yang luas dengan [GER.GetNameDef]. Pemerintah India menolak mengomentari tuduhan bahwa ini adalah harga yang mereka bayar untuk dukungan Jerman."
 news.280.a: "Bagus."
 news.280.b: "Apakah ini akhir dari Kerajaan Inggris?"
 news.280.c: "Sekutu yang berharga."
 news.280.d: "Bukan masa-masa terindah kita."
 news.281.t: "India Raih Pemerintahan Mandiri (Home Rule)"
 news.281.desc: "Dalam pernyataan bersama, Menteri Luar Negeri [ENG.GetAdjective] yang tampak terguncang bersama duta besar [SOV.GetAdjective] mengumumkan bahwa India akan segera diberikan kedaulatan penuh atas urusan dalam negerinya. Belum terungkap jelas peran apa yang dimainkan [SOV.GetNameDef] dalam memicu perubahan mendadak kebijakan [ENG.GetAdjective] ini, namun pengaruhnya tampaknya sangat signifikan.\n\nSalah satu tindakan awal dari kepemimpinan baru India adalah memproklamasikan hubungan kerja sama erat dengan [SOV.GetNameDef], yang memperkuat spekulasi bahwa [SOV.GetNameDef] telah campur tangan demi kepentingan mereka."
 news.281.a: "Bagus."
 news.281.b: "Apakah ini akhir dari Kerajaan Inggris?"
 news.281.c: "Sekutu yang berharga."
 news.281.d: "Bukan masa-masa terindah kita."
 news.282.t: "Gerakan 'Enyahlah dari India' (Quit India)"
 news.282.desc: "Tuntutan kemerdekaan India kian memuncak akhir-akhir ini. Kini situasi telah mencapai titik kritis, seiring Gerakan Quit India yang radikal menuntut [ENG.GetNameDef] untuk segera angkat kaki dari tanah air mereka secepat mungkin. Kendati demikian, aparat berwenang [ENG.GetAdjective] bereaksi cepat dengan menumpas gerakan tersebut, menangkap sejumlah tokoh utama dalam penggerebekan fajar di seantero India.\n\nLaporan yang disusun Cabang Khusus (Special Branch) mengindikasikan bahwa masih banyak simpatisan yang bebas berkeliaran, dan banyak pejabat sipil khawatir anasir-anasir ekstremis dari gerakan tersebut akan menempuh jalur kekerasan."
 news.282.a: "Masa depan masih belum pasti."
 news.282.b: "Namun upaya kebebasan lainnya yang gagal."
 news.283.t: "Kongres Nasional India Berjaya dalam Pemilu Tingkat Provinsi"
 news.283.desc: "\nDalam pemilihan umum daerah baru-baru ini, Kongres Nasional India berhasil meraih kemenangan mutlak atas platform transisi bertahap dan teratur menuju pemerintahan mandiri serta status dominion di masa depan.\n\nTampaknya mayoritas rakyat India telah menolak kebijakan yang lebih radikal yang disuarakan oleh Gandhi, yang mendesak pemutusan hubungan total dengan Britania serta penegakan pemerintahan berdaulat mutlak secepat mungkin."
 news.283.a: "Mereka akan membawa kita menuju kebebasan."
 news.283.b: "Apakah pemungutan suara benar-benar mengubah sesuatu?"
 news.284.t: "Gerakan Swaraj Raih Kemenangan dalam Pemilu Tingkat Provinsi"
 news.284.desc: "\nPara pegawai sipil Britania tersentak kaget pagi ini seiring masuknya hasil pemilihan umum provinsi baru-baru ini. Sudah terang benderang bahwa mayoritas mutlak rakyat India memberikan suara mereka kepada calon-calon pro-Swaraj. Di berbagai provinsi di India, seruan kian menggema untuk mengubah pemerintahan daerah yang terbatas ini menjadi kemerdekaan penuh secepat mungkin.\n\nJuru bicara pemerintah [ENG.GetAdjective] menegaskan bahwa saat ini bukanlah waktu yang tepat untuk membahas langkah tersebut, dan peralihan kekuasaan lebih lanjut kepada bangsa India sama sekali tidak masuk dalam pertimbangan."
 news.284.a: "Kebebasan berada dalam jangkauan."
 news.284.b: "Inggris tidak akan pernah mendukungnya."
 news.285.t: "Pakistan Merdeka"
 news.285.desc: "Sesuai dengan Teori Dua Bangsa, kaum minoritas Muslim telah dianugerahi tanah air yang berdaulat di daerah-daerah tempat umat Muslim menjadi mayoritas penduduk. Awalnya dinamai Pakstan sebagai singkatan dari perpaduan suku Punjab, Afghani, Kashmir, Sindh, dan Baloch, nama tersebut kemudian diubah menjadi Pakistan demi kemudahan pelafalan.\n\nKendati demikian, ketegangan tetap membara antara India dan Pakistan yang baru merdeka, mengingat sejumlah wilayah perbatasan diklaim oleh kedua negara baru tersebut. Sejumlah pengamat bahkan memperingatkan akan pecahnya perang baru di anak benua tersebut."
 news.285.a: "Mungkin ini satu-satunya cara."
 news.285.b: "Kebebasan!"
 news.285.c: "Kita akan lihat apakah perdamaian itu bertahan lama."
 news.286.t: "Australia Putus Hubungan dengan Britania"
 news.286.desc: "\nDalam pemungutan suara yang sengit, mayoritas tipis di parlemen [AST.GetAdjective] memutuskan bahwa negeri tersebut harus keluar dari Imperium Britania. Sisa-sisa terakhir dari sistem hukum Britania dinyatakan batal demi hukum. [AST.GetLeader] telah menandatangani keputusan ini menjadi undang-undang, sehingga mengesampingkan tradisi hukum Restu Kerajaan (Royal Assent) oleh Gubernur Jenderal dan mengubah [AST.GetNameDef] menjadi bangsa yang berdaulat sepenuhnya.\n\nParlemen juga menyetujui pembentukan Komite Konstitusi, yang bertugas merancang dan merekomendasikan amendemen undang-undang dasar demi menghapus seluruh jejak campur tangan Britania dalam urusan internal [AST.GetAdjective]."
 news.286.a: "Sekadar formalitas pada saat ini."
 news.286.b: "Kebebasan!"
 news.286.c: "Australia keluar dari Persemakmuran."
 news.287.t: "Jerman Duduki Polandia Barat"
 news.287.desc: "Pasukan Jerman telah menduduki Polandia bagian barat, secara resmi bertujuan untuk melindungi kelompok minoritas Jerman dari kekacauan yang terjadi setelah runtuhnya pemerintahan Polandia.\n\nPasukan Soviet telah menarik diri dari wilayah ini dengan baik, sehingga Polandia secara efektif membagi kedua kekuatan tersebut."
 news.287.a: "Sebuah cerita yang mungkin terjadi!"
 news.287.b: "Kami akan mengambil sisanya pada waktunya..."
 news.287.c: "Kemajuan kaum fasis - untuk saat ini."
 news.288.t: "Front Persatuan Tiongkok Terbentuk"
 news.288.desc: "[CHI.GetLeader] dan [PRC.GetLeader] telah merilis pengumuman bersama, menegaskan bahwa mereka mengesampingkan perselisihan demi menghadapi invasi Jepang. Kedua kubu akan mematuhi kebijakan non-agresi yang ketat satu sama lain selama perang melawan Jepang berkecamuk, dan bersumpah mengerahkan segala daya upaya demi memukul mundur sang penjajah. Sejumlah panglima perang kecil lainnya turut menyatakan kesetiaan, menyerahkan pasukan mereka di bawah komando [CHI.GetLeader].\n\nApakah kedua musuh bebuyutan dalam Perang Saudara Tiongkok ini benar-benar mampu bahu-membahu masih harus dibuktikan, dan banyak pakar meyakini bahwa langkah ini tak lebih dari sekadar menunda kekalahan tak terelakkan Tiongkok."
 news.288.a: "Aliansi keputusasaan."
 news.288.b: "Ini tidak mengubah apa pun!"
 news.288.c: "Aliansi yang tidak stabil."
 news.337.title: "Penghinaan di Afrika"
 news.337.desc: "Sebuah perjanjian damai telah ditandatangani hari ini antara [ETH.GetLeader] dan [ITA.GetLeader], mengakhiri permusuhan antara kedua negara. Terlepas dari jurang kekuatan yang menganga antara kerajaan pedalaman dan imperium adidaya tersebut, pemerintah Etiopia tampil sebagai pemenang mutlak dalam perundingan ini. Tak hanya Italia harus menyepakati gencatan senjata dengan Etiopia, wilayah Eritrea dan Somaliland Italia bahkan diserahkan secara resmi kepada [ETH.GetNameDef].\n\nDengan kekalahan kedua kalinya bagi tentara Italia di tanah Etiopia ini, pemerintahan [ITA.GetLeader] kini luluh lantak, dan dipastikan akan butuh bertahun-tahun sebelum harga diri Italia yang terkoyak dapat benar-benar pulih dari kehinaan ini."
 news.337.desc_some_states: "Sebuah perjanjian damai telah disepakati hari ini antara [ETH.GetLeader] dan [ITA.GetLeader], menyudahi pertikaian bersenjata antara kedua bangsa. Terlepas dari perbedaan kekuatan yang luar biasa timpang antara kerajaan tanpa laut dan imperium besar dunia, pemerintah Etiopia jelas berada di atas angin dalam perundingan ini. Tak hanya Italia dipaksa mengadakan gencatan senjata dengan Etiopia, sebagian dari bekas wilayah kekuasaan Italia di Afrika Timur pun resmi diserahkan kepada [ETH.GetNameDef].\n\nMenjadi kekalahan kedua bagi militer Italia di Etiopia, rezim [ITA.GetLeader] kini berada dalam kemelut hebat, dan butuh waktu bertahun-tahun sebelum kebanggaan bangsa Italia pulih dari tamparan keras ini."
 news.337.desc_no_states: "Perjanjian damai resmi ditandatangani hari ini antara [ETH.GetLeader] dan [ITA.GetLeader], mengakhiri peperangan antara kedua bangsa. Terlepas dari kesenjangan kekuatan yang teramat besar antara kerajaan pedalaman dan imperium lintas samudra, pemerintah Etiopia berhasil mempertahankan tanah air mereka dari serbuan tentara Italia.\n\nMenjadi kekalahan telak kedua bagi pasukan Italia di tanah Etiopia, kedudukan pemerintah [ITA.GetLeader] kini berada di ujung tanduk, dan harga diri bangsa Italia yang terluka parah diperkirakan butuh waktu bertahun-tahun untuk pulih dari aib ini."
 news.337.a: "Bagus untuk Etiopia!"
 news.337.b: "Kami berharap [ITA.GetLeader] tidak dikenang atas kegagalannya."
 news.337.c: "Kita tidak akan pernah bisa pulih dari hal ini."
 news.337.d: "Kekaisaran Ras Alula Bangkit Kembali!"
 news.338.t: "Uji Coba Nuklir Sukses"
 news.338.desc: "[FROM.GetNameDefCap] telah sukses menggelar uji coba dengan reaktor nuklir, demikian diumumkan [FROM.GetLeader] dalam pidato publik kemarin. [FROM.GetNameDefCap] kini tampak memimpin perlombaan senjata atom global."
 news.338.a: "Masa depan tidak pasti"
 news.338.b: "Dunia seharusnya kagum dengan pencapaian kita"
 news.350.t: "Reunifikasi Damai [ROOT.GetNameDef]"
 news.350.desc: "\n\nMendengarkan aspirasi luhur rakyat [ROOT.GetAdjective], [ROOT.GetLeader] telah berhasil mewujudkan penyatuan damai dari negara-negara [ROOT.GetAdjective] yang berhaluan [ROOT.GetRulingIdeology]. Masih harus ditunggu dampak apa yang akan ditimbulkan peristiwa ini terhadap dunia secara luas, namun setidaknya di [ROOT.Capital.GetCapitalVictoryPointName], rakyat berpesta merayakan tonggak sejarah monumental ini."
 news.350.a: "Ini bisa berbahaya"
 news.350.b: "Ini jelas merupakan awal yang baru"
 news.350.c: "Kurasa itu bagus untuk mereka"
 news.409.t: "Tanggul Sungai Kuning Diledakkan"
 news.409.desc: "Sebagai ikhtiar putus asa demi membendung gelombang laju kekuatan pasukan [JAP.GetAdjective], jejaring tanggul dan benteng banjir di sepanjang Sungai Kuning diledakkan dan dihancurkan oleh tentara [FROM.GetAdjective].\n\nBanjir bandang dahsyat yang menyusul telah menenggelamkan ribuan desa dan menelantarkan jutaan warga pedesaan, yang hanya memiliki waktu sekejap untuk menyelamatkan diri.\n\nMasih harus dibuktikan apakah langkah pengorbanan ini mampu memberi militer [FROM.GetAdjective] cukup waktu untuk menata ulang barisan dan menghadapi pertempuran berikutnya."
 news.409.a: "Dimengerti."
 news.409.b: "Hal ini tidak dapat menghentikan hal yang tidak bisa dihindari."
 news.409.c: "Tragedi kemanusiaan."
 ace_promoted.1.t: "Penerbang Ulung Dipromosikan"
 ace_promoted.2.t: "Penerbang Ulung Tangguh Muncul"
 ace_promoted.1.d: "Hanya sedikit yang mengambil risiko sebanyak pilot pemberani angkatan udara [Root.GetAdjective]. [From.GetName] [From.GetSurname], seorang pilot terampil yang dikenal dengan tanda panggilan [From.GetCallsign], telah membedakan [From.GetHerselfHimself] dengan tidak hanya kembali hidup-hidup dari misi baru-baru ini di [From.GetMissionRegion], namun juga hidup melalui kemenangan signifikan dalam banyak pertemuan kritis.\n\nDianggap sebagai contoh cemerlang dari keberanian [Root.GetAdjective], promosi [From.GetName] baru-baru ini telah dipublikasikan secara luas. Meskipun masyarakat mungkin menganggap perang lebih sebagai neraka daripada kejayaan, banyak yang senang melihat masih ada pahlawan yang bisa diandalkan."
 ace_promoted.1.d_major: "Hanya sedikit yang mengambil risiko sebanyak pilot pemberani angkatan udara [Root.GetAdjective]. [From.GetName] [From.GetSurname], seorang pilot terampil yang dikenal dengan panggilan [From.GetCallsign], telah membedakan [From.GetHerselfHimself] tidak hanya kembali dalam keadaan hidup, tetapi juga mengemudikan [From.GetHerHis] [From.GetWing] dengan keterampilan yang luar biasa. Baru-baru ini, [From.GetName] sedang menjalankan misi di [From.GetMissionRegion] dan berperan penting dalam keberhasilan pertemuan penting ini.\n\nDiadakan sebagai contoh cemerlang dari keberanian [Root.GetAdjective], promosi terbaru [From.GetName] telah dipublikasikan secara luas. Meskipun masyarakat mungkin menganggap perang lebih sebagai neraka daripada kejayaan, banyak yang senang melihat masih ada pahlawan yang bisa diandalkan."
 ace_promoted.1.a: "Siapa yang berani, dialah pemenangnya."
 ace_died.1.t: "[From.GetCallsign] Gugur di Atas [From.GetMissionRegion]"
 ace_died.1.d: "Salah satu penerbang ulung [From.GetAceType] paling terkenal dari [From.Owner.GetName], [From.GetFullName], telah gugur dalam kobaran api saat bertugas, dalam sebuah misi di atas [From.GetMissionRegion]. Sayangnya, karena [From.GetSheHe] telah lama menjadi tokoh publik, gugurnya [From.GetCallsign] sangat memukul semangat banyak orang yang mengagumi [From.GetHerHim].\n\nMeski kita berharap ada cara untuk menyembunyikan kabar duka ini dari rakyat, hilangnya penampilan publik dari [From.GetName] akan segera menimbulkan kecurigaan. Pada akhirnya, wafatnya [From.GetHerHis] adalah bagian lain dari sebuah legenda yang diharapkan akan terus abadi melampaui masa-masa sulit kita saat ini."
 ace_died.1.d_major: "Salah satu ace [From.Owner.GetName] yang paling terkenal, [From.GetFullName], telah jatuh saat menjalankan tugas. Pilot yang kembali dari misi melaporkan melihat [From.GetHerHis] [From.GetWingShort] terbakar di atas [From.GetMissionRegion] setelah menerima tembakan musuh yang besar. Sayangnya, karena [From.GetSheHe] telah lama menjadi figur publik, kematian [From.GetCallsign] sangat melemahkan semangat banyak orang yang mengagumi [From.GetHerHim].\n\nMeskipun kami berharap ada cara untuk menyembunyikan peristiwa ini dari masyarakat, kurangnya penampilan publik dari [From.GetName] akan segera menimbulkan kecurigaan. Pada akhirnya, kematian [From.GetHerHis] adalah bagian lain dari legenda yang diharapkan akan bertahan lama melewati masalah kita saat ini."
 ace_died.1.a: "Legenda hidup masih lebih baik."
 ace_killed_by_ace.1.t: "[From.GetFullName] Ditembak Jatuh Oleh [Prev.GetCallsign]"
 ace_killed_by_ace.1.d: "Pilot yang kembali dari [From.GetMissionRegion] melaporkan bahwa satu skuadron pesawat [Prev.Owner.GetAdjective], dipimpin oleh [Prev.GetCallsign] yang terkenal, fokus mengejar [From.GetCallsign]. Setelah menghindari beberapa ledakan dari [Prev.Owner.GetAdjective] dan menjatuhkan sejumlah pesawat musuh, [From.GetCallsign] dikalahkan oleh [Prev.GetCallsign], yang dilaporkan mengalahkan [From.GetHerHim] dan merobek tangki bahan bakar hingga terbuka dengan pukulan telak. Pesawat [From.GetName] [From.GetSurname] terbakar dan jatuh berputar-putar di atas [From.GetMissionRegion] dalam kobaran api yang hebat.\n\n[From.GetFullName] telah menunjukkan keberanian yang besar selama dinas [From.GetHerHis] dan disegani oleh banyak orang. Hilangnya pahlawan nasional ini merupakan pukulan telak bagi angkatan udara [From.Owner.GetAdjective] dan merupakan pukulan telak bagi bangsa kita secara keseluruhan. Mengetahui bahwa saat kita berduka, [Prev.Owner.GetName] merayakan [Prev.GetFullName] sebagai pahlawan, membuat tragedi tersebut semakin besar."
 ace_killed_by_ace.1.d_major: "Pilot yang kembali dari [From.GetMissionRegion] melaporkan bahwa, satu skuadron pesawat [Prev.Owner.GetAdjective] yang dipimpin oleh [Prev.GetCallsign] yang terkenal itu fokus mengejar [From.GetCallsign]. Setelah menjatuhkan sejumlah pesawat musuh dan menghindari beberapa ledakan dari [Prev.Owner.GetAdjective], [From.GetCallsign] dikalahkan oleh [Prev.GetCallsign] dengan [Prev.GetWingShort] miliknya, yang dilaporkan mengungguli [From.GetHerHim] dan merobek tangki bahan bakar hingga terbuka dengan pukulan telak. [From.GetName] [From.GetSurname] [From.GetWingShort] terbakar dan jatuh berputar-putar di atas [From.GetMissionRegion] dalam kobaran api yang hebat.\n\n[From.GetFullName] telah menunjukkan keberanian yang besar sepanjang pelayanan [From.GetHerHis] dan dihormati oleh banyak orang. Hilangnya pahlawan nasional ini merupakan pukulan telak bagi angkatan udara [From.Owner.GetAdjective] dan merupakan pukulan telak bagi bangsa kita secara keseluruhan. Mengetahui bahwa saat kita berduka, [Prev.Owner.GetName] merayakan [Prev.GetFullName] sebagai pahlawan, membuat tragedi tersebut semakin besar."
 ace_killed_by_ace.1.a: "Sebuah kehilangan yang sangat besar bagi kita semua"
 ace_killed_other_ace.1.t: "[From.GetFullName] Menembak Jatuh [Prev.GetCallsign]"
 ace_killed_other_ace.1.d: "Misi terbaru kami di [From.GetMissionRegion] merupakan kesuksesan besar bagi angkatan udara [From.Owner.GetAdjective] di lebih dari satu aspek. Laporan muncul menyoroti tindakan heroik [From.GetFullName], yang berhasil mengecoh pilot [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], yang dikenal sebagai [Prev.GetCallsign]. [From.GetCallsign] menggunakan [From.GetHerselfHimself] sebagai umpan dan memikat [Prev.GetCallsign] ke dalam perangkap di mana pilot [From.Owner.GetAdjective] dapat menyelam ke skuadron [Prev.GetCallsign]. [From.GetCallsign] melanjutkan untuk mengakali pesawat [Prev.Owner.GetAdjective] dan dengan satu ledakan mengirim [Prev.GetCallsign] berputar dari langit [From.GetMissionRegion].\n\n[Prev.GetFullName] adalah seorang pilot yang ditakuti dengan banyak [From.Owner.GetAdjective] hidup dengan hati nurani [Prev.GetHerHis]. Ini adalah kemenangan besar dan menunjukkan bahwa ketika kita mendukung para pahlawan besar, mereka akan melakukan perbuatan besar."
 ace_killed_other_ace.1.d_major: "Misi terbaru kami di [From.GetMissionRegion] merupakan kesuksesan besar bagi angkatan udara [From.Owner.GetAdjective] di lebih dari satu aspek. Laporan muncul menyoroti tindakan heroik [From.GetFullName], yang berhasil mengecoh pilot [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], yang dikenal sebagai [Prev.GetCallsign]. [From.GetCallsign] menggunakan [From.GetHerselfHimself] sebagai umpan dan memikat [Prev.GetCallsign] ke dalam perangkap di mana pilot [From.Owner.GetAdjective] dapat menyelam ke skuadron [Prev.GetCallsign]. [From.GetCallsign] melanjutkan untuk mengakali pesawat [Prev.Owner.GetAdjective] dan dengan satu ledakan mengirim [Prev.GetCallsign] berputar dari langit [From.GetMissionRegion].\n\n[Prev.GetFullName] adalah seorang pilot yang ditakuti dengan banyak [From.Owner.GetAdjective] hidup dengan hati nurani [Prev.GetHerHis]. Ini adalah kemenangan besar dan menunjukkan bahwa ketika kita mendukung para pahlawan besar, mereka akan melakukan perbuatan besar."
 ace_killed_other_ace.1.a: "Kemenangan yang akan diingat oleh semua [From.Owner.GetName]!"
 aces_killed_each_other.1.t: "[From.GetFullName] Telah Gugur"
 aces_killed_each_other.1.d: "Dalam misi terkini, penerbang ulung [From.GetAceType] kebanggaan kita, [From.GetFullname], terlibat dalam duel sengit berkepanjangan dengan pilot kawakan musuh yang ditakuti, [Prev.GetFullName]. Karena kehabisan amunisi dan tak ada jalan untuk melarikan diri, [From.GetCallsign] bermanuver menembus hujan peluru dari pesawat [Prev.Owner.GetAdjective] lalu menabrakkan diri ke pesawat [Prev.GetCallsign].\nPesawat [From.GetCallsign] maupun [Prev.GetCallsign] terlihat jatuh berkeping-keping di atas [From.GetMissionRegion].\n\nKendati sedikit terhibur bahwa momok ancaman [Prev.Owner.GetAdjective], [Prev.GetCallsign], tidak akan lagi mengganggu kita, kita telah kehilangan sosok panutan publik yang sangat berharga dan sumber inspirasi bagi seluruh rakyat [From.Owner.GetAdjective]."
 aces_killed_each_other.1.d_major: "Dalam misi terkini, penerbang ulung [From.GetAceType] kebanggaan kita, [From.GetFullname], terlibat dalam duel sengit berkepanjangan dengan pilot kawakan musuh yang ditakuti, [Prev.GetFullName]. Karena kehabisan amunisi dan tak ada jalan untuk melarikan diri, [From.GetCallsign] mengarahkan [From.GetWingShort] milik [From.GetHerHis] bermanuver menembus hujan peluru pesawat [Prev.Owner.GetAdjective] lalu menabrakkan diri ke pesawat [Prev.GetCallsign].\nBaik [From.GetWingShort] milik [From.GetCallsign] maupun [Prev.GetWingShort] milik [Prev.GetCallsign] terlihat hancur berkeping-keping jatuh di atas [From.GetMissionRegion].\n\nKendati sedikit terhibur bahwa momok ancaman [Prev.Owner.GetAdjective], [Prev.GetCallsign], tidak akan lagi mengganggu kita, kita telah kehilangan sosok panutan publik yang sangat berharga dan sumber inspirasi bagi seluruh rakyat [From.Owner.GetAdjective]."
 aces_killed_each_other.1.a: "Namun, ini merupakan kerugian besar bagi kami"
 election.1.t: "PEMILU UMUM"
 election.1.d: ""
 election.1.a: ""
 election.2.t: "Pemilu: Publik Menentang Persenjataan Kembali"
 election.2.d: "Dalam pemilihan umum mendatang, dukungan bagi [Root.GetRulingParty] masih tetap tinggi, karena rakyat menaruh kepercayaan penuh pada kepemimpinan [Root.GetLeader]. Namun, upaya partai untuk memperbesar fokus [Root.GetName] pada urusan militer tidak sepenuhnya disukai masyarakat; sebagian besar warga menganggap hal itu sebagai jingoistis yang gegabah. Perang belum menjangkau perbatasan kita dan hanya sedikit yang ingin melihat [Root.GetName] mengambil tindakan agresif. Dengan bekerja sama bersama partai-partai besar lain yang memiliki kekhawatiran serupa demi keselamatan bangsa, kita masih akan dapat memerintah pasca-pemilu, kendati dengan dukungan yang berkurang."
 election.2.a: "Masyarakat harus didengarkan."
 election.2.b: "Melindungi kedaulatan kita adalah prioritas utama."
 election.3.t: "Pemilu: Publik Menuntut Persenjataan Kembali"
 election.3.d: "Perang yang tengah berkecamuk dan kian mendekati perbatasan kita membayangi pemilihan umum yang akan datang. Banyak pemilih cemas bahwa [Root.GetName] tidak siap jika terseret ke dalam konflik ini atau berbagai ancaman yang mungkin timbul darinya. Mereka menuntut kita meningkatkan kewaspadaan dan memastikan negara kita siap berperang. Walaupun mayoritas masih mendukung [Root.GetRulingParty], kita bisa kehilangan dukungan mereka ke elemen-elemen yang lebih radikal jika kita tidak meredakan kekhawatiran rakyat."
 election.3.a: "Masyarakat mempunyai hak untuk merasa aman."
 election.3.b: "Banyak pihak yang masih mendukung solusi diplomatik."
 election.4.t: "Pemilu: Kaum Fasis Masuk Pemerintahan?"
 election.4.d: "Sentimen nasionalis agresif kian tumbuh di [Root.GetName], melahirkan beberapa partai yang mengusung gagasan fasis: sebuah negara yang menegakkan kekuasaannya melalui kekuatan senjata. Salah satu dari partai ini secara khusus meraih banyak suara dalam pemilu saat ini, memicu perdebatan sengit di tubuh partai [Root.GetRulingParty] tentang apakah kita harus berkoalisi dengan mereka untuk membentuk pemerintahan. Walaupun mereka secara terbuka menolak cita-cita demokrasi yang menjadi fondasi negara kita, kenyataan bahwa mereka memilih berpartisipasi dalam pemilu itu sendiri memberikan pengakuan pada sistem kita, dan merangkul dukungan mereka mungkin dapat mencegah mereka mengambil tindakan anarkis penuh kekerasan."
 election.4.a: "Daripada komunis!"
 election.4.b: "Koalisi partai-partai demokratis yang luas lebih disukai."
 election.5.t: "Pemilu: Kaum Komunis Masuk Pemerintahan?"
 election.5.d: "Gerakan komunis di [Root.GetName], yang dipicu oleh ketidakpuasan luas di kalangan kelas pekerja dan tren radikal di kalangan akademisi, telah berkembang cukup besar sehingga mengarah pada pembentukan beberapa partai. Setelah salah satu dari mereka memperoleh dukungan yang cukup besar dalam pemilu saat ini, para politisi di [Root.GetRulingParty] mulai berdebat apakah mereka akan mencari dukungan mereka dalam membentuk pemerintahan atau tidak. Meskipun mereka menganggap lembaga-lembaga demokrasi kita tidak lebih dari tirani borjuis, mereka nampaknya bersemangat untuk melakukan perubahan yang ingin mereka capai melalui kerja sama dengan pemerintah, bukan dengan menggulingkan pemerintah."
 election.5.a: "Lebih baik reformasi daripada revolusi!"
 election.5.b: "Koalisi partai-partai demokratis yang luas lebih disukai."
 election.6.t: "Pemilu: Partai-Partai Demokratis Menjadi Minoritas"
 election.6.d: "Perpolitikan di [Root.GetName] semakin terpolarisasi dan radikal. Di masa lalu pernah ada dukungan luas bagi partai-partai yang menjunjung cita-cita demokrasi dan institusi perwakilan [Root.GetName], namun dalam pemilu ini lebih banyak pemilih berpaling ke kubu ekstrem. Partai-partai berhaluan tengah, bahkan jika mereka mengesampingkan perselisihan, tidak lagi membentuk mayoritas. Demi menghindari pemerintahan minoritas yang rapuh, kita tidak punya pilihan selain berkoalisi dengan kubu fasis atau komunis."
 election.6.a: "Kami akan bekerja dengan fasis untuk memperkuat [Root.GetName]."
 election.6.b: "Bergabung dengan komunis, kita dapat memfasilitasi perubahan sosial."
 election.6.c: "Pemerintahan minoritas, meskipun lemah, lebih baik."
 election.7.t: "Kaum Fasis Memengaruhi Kebijakan Luar Negeri"
 election.7.d: "Menerima kaum fasis ke dalam koalisi politik kita telah memberi dampak nyata pada kebijakan luar negeri kita. Terlepas dari nasionalisme mereka yang menggebu-gebu, mereka memiliki simpatisan di luar negeri yang menyambut baik pengaruh yang diberikan kepada mereka di [Root.GetName]. Rezim-rezim totaliter berhaluan ideologi serupa melihat kita sebagai sekutu potensial. Memelihara hubungan dengan negara-negara tersebut—betapa pun [Root.GetRulingParty] muak terhadap ideologi mereka—mungkin diperlukan demi mempertahankan dukungan kaum fasis yang menopang pemerintahan kita."
 election.7.a: "Kita dapat menggunakan beberapa sekutu untuk melawan ancaman yang lebih besar."
 election.7.b: "Dengan teman-teman seperti itu, kita tidak memerlukan musuh."
 election.8.t: "Kaum Komunis Memengaruhi Kebijakan Luar Negeri"
 election.8.d: "Kaum Komunis sering kali menganggap diri mereka sebagai bagian dari revolusi internasional, dan pilihan kita untuk menerima mereka sebagai mitra dalam pemerintahan kita telah menarik perhatian banyak sekutu internasional mereka. Perwakilan partai-partai komunis memelihara hubungan dekat dengan negara-negara yang telah meninggalkan bentuk pemerintahan kita dan memilih kediktatoran proletariat, hubungan yang mungkin perlu kita akui dalam kebijakan luar negeri [Root.GetAdjective] jika kita ingin mempertahankan dukungan mereka."
 election.8.a: "Kita harus merangkul tujuan bersama."
 election.8.b: "Di ujung jalan itulah terletak pembubaran [Root.GetName] itu sendiri."
 election.11.t: "Pemilu: Mayoritas Fasis"
 election.11.d: "Pemilu kali ini membawa kehancuran bagi institusi demokrasi yang diwakilinya. Mayoritas rakyat [Root.GetAdjective] telah memberikan suara mereka kepada partai fasis yang bertekad menghapuskan pemilihan umum dan menegakkan penguasa otokratis. Walaupun banyak warga mempertimbangkan untuk mengangkat senjata melawan pengkhianatan atas cita-cita demokrasi yang awalnya memberi mereka mandat ini, sebagian lainnya memandang bahwa penggunaan kekerasan hanya akan membenarkan propaganda kaum fasis."
 election.11.a: "Ini adalah hari kelam bagi [Root.GetName], namun masyarakat telah angkat bicara."
 election.11.b: "Kami tidak akan menyerahkan kebebasan kami tanpa perlawanan!"
 election.12.t: "Pemilu: Mayoritas Komunis"
 election.12.d: "Pemilu saat ini telah menghasilkan kemenangan bagi partai-partai komunis, dengan reaksi beragam dari pemerintahan sebelumnya. Meskipun para penguasa baru mengklaim mewakili rakyat secara keseluruhan, mereka memandang banyak lembaga demokrasi yang kita hargai sebagai upaya untuk memanipulasi dan menindas kelas pekerja, sehingga menimbulkan diskusi tentang apa yang sebenarnya merupakan 'kekuasaan rakyat'. Di beberapa negara, revolusi dimulai dengan aliran darah. Di [Root.GetName] tidak, tapi mungkin akan berakhir di sana."
 election.12.a: "Ini meresahkan, tapi mereka benar-benar mewakili mayoritas."
 election.12.b: "Kita harus menghentikan mereka sebelum mereka menghapuskan setiap tanda pemikiran yang berbeda pendapat!"
 election.13.t: "Pemilu: Konglomerat Mendukung Fasisme"
 election.13.d: "Seorang industrialis terkemuka di balik salah satu perusahaan mitra produksi industri kita baru-baru ini melontarkan sejumlah pernyataan politik yang membuat geram jajaran pemerintahan. Ia secara terbuka menganjurkan pemerintahan otoriter dan memuji rezim-rezim luar negeri berhaluan fasis, secara tersirat menyarankan bahwa [Root.GetName] akan diuntungkan oleh kepemimpinan bertangan besi semacam itu. Mengecam sang konglomerat dan pandangannya dapat merusak hubungan kerja sama kita dengan perusahaannya, tetapi membiarkannya begitu saja akan memberinya panggung untuk menyebarkan propaganda yang mengikis segala hal yang diperjuangkan oleh [Root.GetRulingParty]."
 election.13.a: "Dia bisa mengatakan apa yang dia suka, kita tidak perlu mendukungnya."
 election.13.b: "Kita tidak bisa mengandalkan fasis untuk mengembangkan dan melindungi [Root.GetName]."
 election.14.t: "Pemilu: Pengecualian Masa Perang"
 election.14.d: "[Root.GetName] sedang dalam keadaan perang. Lazimnya, pemilihan umum akan digelar pada saat-saat seperti ini, namun karena tengah berkutat dalam konflik besar, banyak pihak berpendapat bahwa kita tidak boleh menghabiskan waktu dan sumber daya untuk kampanye politik, ataupun pergantian kepemimpinan jika hal itu terjadi. Sementara itu, kubu lain menyatakan bahwa menjadikan perang sebagai dalih untuk menunda pemilu adalah langkah awal mengikis demokrasi [Root.GetAdjective]. Bagaimanapun juga, membiarkan urusan militer mengesampingkan suara rakyat adalah lereng curam menuju tirani."
 election.14.a: "Pemilihan akan dilaksanakan seperti biasa."
 election.14.b: "Kita bisa mengurus hal-hal seperti itu setelah perang ini selesai."
 election.15.t: "Pemilu: Pemerintahan Digugat"
 election.15.d: "Menjelang pemilihan umum mendatang, rakyat mulai meragukan kecakapan pemerintahan saat ini dalam memimpin perang yang sedang berlangsung. [Root.GetName] telah menanggung penderitaan yang begitu besar dan opini publik berbalik menentang mereka yang dianggap membawa bangsa kita menuju kehancuran. Meski rakyat bertekad berjuang sampai titik akhir, mereka lebih menginginkan pemerintahan lain yang menuntaskannya."
 election.15.a: "Krisis kepercayaan ini sangat disayangkan."
 election.15.b: "Biarkan lanskap politik berubah untuk menjaga persatuan masyarakat."
 election.16.t: "[Root.GetLeader] Menikmati Dukungan Rakyat"
 election.16.d: "Dengan pemilu kali ini, pihak oposisi, sejauh masih ada, telah mengkritik pemerintahan [Root.GetRulingParty] yang semakin otoriter. Mereka mempertanyakan apakah para pemilih mempunyai kekuasaan atau hanya sekedar pamer.\n\nNamun, dukungan terhadap [Root.GetLeader] nampaknya tetap tinggi, dan meskipun kondisi pemilu dipertanyakan oleh masyarakat internasional, pemilu tersebut belum mendapat perlawanan di dalam negeri. Tampaknya meskipun [Root.GetName] tidak lagi dikuasai oleh rakyat, rakyat tetap mendukung penguasanya... setidaknya mereka yang berhasil lolos ke pemungutan suara."
 election.16.a: "Satu orang, satu pemimpin."
 election.17.t: "Hasil Pemilu Dipertanyakan"
 election.17.d: "Meskipun rezim [Root.GetLeader] telah membungkam sebagian besar musuh politiknya dengan tangan besi, beberapa kalangan masih bersuara lantang menentang pemilu terkini, menuduh [Root.GetRulingParty] memanipulasi hasil suara dan mengabaikan upaya rakyat yang jelas-jelas memilih parlemen oposisi.\n\nPemerintah menepis keberatan-keberatan ini sebagai upaya memecah belah persatuan bangsa. Namun, kenyataan tetap menunjukkan bahwa mayoritas rakyat meragukan kekuasaan mereka, dan oposisi, meski saat ini dibungkam, telah menyampaikan suaranya."
 election.17.a: "Pemisah!"
 political.1.t: "Komunisme Menguat"
 political.1.d: "'Sementara pekerja bangkit melawan penindas mereka di seluruh dunia, mereka yang mengklaim telah mencapai kesadaran kelas di [Root.GetName] hanya duduk diam dan menunggu perubahan datang dari sistem politik yang sangat korup, hanya revolusi yang bisa menyelamatkan kita darinya!'\n\nJadi, sampaikan suara-suara baru dalam gerakan komunis [Root.GetAdjective]. Merujuk pada pemerintahan [Root.GetRulingParty] sebagai kediktatoran borjuis, mereka mulai menyerukan agar pemerintahan tersebut digulingkan dengan cara apapun yang diperlukan. Masih harus dilihat apakah cara-cara tersebut akan datang dari dalam atau dari luar."
 political.1.a: "Mungkin ada pihak-pihak di pemerintahan sendiri yang mendukung gagasan seperti itu."
 political.1.a.tt: "Meningkatkan kemungkinan dukungan internal terhadap kudeta komunis."
 political.1.b: "Sebuah gerakan untuk rakyat harus mencari dukungan dari rakyat."
 political.1.b.tt: "Meningkatkan kemungkinan dukungan rakyat terhadap pemberontakan komunis."
 political.2.t: "Simpati Marxis di Pemerintahan"
 political.2.d: "Meskipun garis partai resmi [Root.GetRulingParty] menentang keras sosialisme revolusioner dan terus mengawasi elemen sayap kiri radikal bangsa secara saksama, beberapa orang di pemerintahan lebih terbuka terhadap kemungkinan tersebut. Setidaknya, mereka melihat ruang untuk menanggapi kekhawatiran rakyat yang mencari solusi lewat kaum komunis tanpa harus menanggung risiko perang saudara skala penuh.\n\nKendati mereka mungkin dianggap sebagai pengkhianat oleh mereka yang tetap setia kepada [Root.GetLeader], suara-suara pembangkang inilah yang mungkin dapat menjamin transisi yang relatif tanpa pertumpahan darah seandainya revolusi benar-benar meletus."
 political.2.a: "Kami juga akan terus mengawasinya, karena berbagai alasan."
 political.2.a.tt: "Jika dukungan publik mencukupi, kudeta dapat dilakukan."
 political.3.t: "Kaum Komunis Melancarkan Kudeta"
 political.3.d: "Walaupun gerakan rakyat untuk revolusi komunis sangat keras dan menakutkan, sebagian besar gerakan politik masih diam dan menunggu. Penantiannya kini telah berakhir. Saat ini, ketika kepemimpinan [Root.GetRulingParty] dan tentara sedang bersiap menghadapi pemberontakan dalam skala nasional, sejumlah pejabat di pemerintahan [Root.GetAdjective] dengan cepat menjadikan [Root.GetLeader] sebagai tahanan rumah dan melakukan perundingan dengan para pemberontak.\n\nSambil tetap berpura-pura menjaga ketertiban, tujuan sebenarnya dari negosiasi tersebut adalah mengamankan posisi di dalam negara sosialis baru bagi mereka yang memilih untuk bekerja sama. Kudeta telah selesai sebelum siapa pun dapat bergerak untuk menghentikannya, dan mereka yang ingin menghentikannya kini dipenjara, diasingkan, atau dieksekusi oleh rezim baru."
 political.3.a: "Gelombang sejarah akan menyapu masa lalu."
 political.4.t: "Konflik Kelas Memecah Belah [Root.GetName]"
 political.4.d: "Gerakan revolusioner komunis, yang dulu hanya merupakan kelompok pinggiran di kalangan akademisi radikal secara teori dan pembuat onar secara praktik, kini meraih peningkatan dukungan di kalangan kelas pekerja [Root.GetAdjective]. Kenyataan bahwa semakin banyak orang memilih mengidentifikasi diri mereka berdasarkan 'kelas' menandakan bahwa gagasan-gagasan Marxis tengah menyebar melampaui kelompok yang secara aktif berusaha menggulingkan pemerintah.\n\nPara anggota [Root.GetRulingParty] meratapi perkembangan ini, merindukan masa-masa ketika identitas '[Root.GetAdjective]' adalah hal utama yang melekat pada diri setiap orang. Kekhawatiran mereka bukannya tanpa alasan. Dapat dikatakan bahwa revolusi sesungguhnya telah berlangsung di berbagai lapisan masyarakat, dan mungkin sudah terlambat untuk menghentikannya."
 political.4.a: "Orang-orang boleh menyebut diri mereka apa pun yang mereka inginkan."
 political.5.t: "Prajurit Membelot ke Partisan Komunis"
 political.5.d: "'Kapitalis dan nasionalis ingin Anda menumpahkan darah Anda di garis depan, membuat saudara melawan saudara karena perselisihan yang tidak menyangkut pekerja! Daripada mengangkat senjata melawan buruh yang berjuang di luar negeri, lebih baik angkat senjata melawan penindas dan gulingkan para tiran!'\n\nTentara, yang biasanya menjadi benteng patriotisme dan kesetiaan, terbukti tidak kebal terhadap propaganda komunis yang menyebar pesat di [Root.GetName]. Tentara melakukan desersi, menolak berperang demi negaranya, dan kadang-kadang bahkan bergabung dengan gerakan partisan yang mengaku sedang mempersiapkan revolusi."
 political.5.a: "Mungkin mereka hanya berjuang untuk [Root.GetName] yang berbeda."
 political.6.t: "Revolusi [GetMonth]"
 political.6.d: "Gagasan bahwa gerakan komunis mewakili rakyat jelata benar-benar mendapatkan angin segar di [Root.GetName], di mana dukungan publik terhadap partai komunis meningkat pesat dalam beberapa bulan terakhir. Namun, mereka yang menyerukan revolusi bukan lagi sekadar kelompok gerilyawan yang tercerai-berai dan serikat buruh yang kecewa. Kelompok di balik seruan pemberontakan ini telah terorganisasi dengan cukup matang untuk membentuk pemerintahan jika mereka berhasil.\n\nKendati demikian, jika revolusi dimulai sekarang, hal itu hampir mustahil terwujud tanpa menyeret [Root.GetName] ke dalam perang saudara. Haruskah kaum revolusioner mengambil risiko membelah bangsa menjadi dua demi memuaskan ketidaksabaran mereka, atau menunggu kesempatan yang lebih baik di masa depan?"
 political.6.a: "Mereka yang ingin membuat sejarah harus bertindak hari ini!"
 political.6.b: "Revolusi tidak bisa dihindari. Hal yang tak terhindarkan bisa menunggu."
 political.7.t: "Fasisme Menguat"
 political.7.d: "'Rakyat [Root.GetAdjective] telah terlalu lama tunduk pada kepemimpinan tidak becus dari [Root.GetRulingParty]! Mereka mengklaim mewakili rakyat, tetapi menjaga ketertiban jalanan kita saja mereka tak becus! Hanya dengan menyingkirkan mereka dari kekuasaan, kita dapat membuat bangsa ini berjaya kembali!'\n\nPara orator fasis di [Root.GetName] tidak merahasiakan pandangan mereka terhadap kepemimpinan dan sistem politik saat ini. Pidato-pidato semacam ini telah menyulut ketidakpuasan publik yang sangat kentara, khususnya di kalangan militer yang lebih konservatif."
 political.7.a: "Para petinggi mungkin menyimpan simpati yang tak terucapkan."
 political.7.a.tt: "Meningkatkan kemungkinan dukungan internal terhadap kudeta fasis."
 political.7.b: "Generasi muda akan mengambil alih kekuasaan."
 political.7.b.tt: "Meningkatkan kemungkinan dukungan rakyat terhadap kudeta fasis."
 political.8.t: "Simpati Fasis di Kalangan Militer"
 political.8.d: "Beberapa perwira tinggi militer [Root.GetAdjective] telah menyatakan dukungannya, baik secara tertutup maupun terang-terangan, terhadap gerakan Fasis di [Root.GetName]. Mereka merasa bahwa [Root.GetRulingParty] telah melupakan betapa pentingnya kekuatan senjata untuk menjaga keutuhan negara, dan semakin kesal karena militer diperlakukan oleh pemerintah lebih sebagai sekadar alat ketimbang salah satu institusi terpenting bangsa. Sebagian dari mereka bahkan berani menyatakan bahwa pemerintahan baru mutlak diperlukan, pemerintahan yang tahu bagaimana memimpin [Root.GetName] menuju paruh abad berikutnya.\n\nFaksi ini mungkin bukan berisikan politisi murni, tetapi beberapa dari mereka telah menduduki posisi penting di kementerian pertahanan. Jika perkembangan ini berlanjut, mereka mungkin akan mengantongi dukungan politik yang memadai untuk melancarkan kudeta."
 political.8.a: "Semangat kebangsaan mengungguli pemerintah."
 political.9.t: "Kudeta Fasis"
 political.9.d: "Sebagian orang akan mengatakan bahwa mereka sudah menduganya. Baik mereka yang memperingatkan bahaya fasisme maupun mereka yang menyanjungnya sebagai penyelamat [Root.GetName] mendapati ramalan mereka menjadi kenyataan hari ini, ketika militer di [Root.Capital.GetName] menggulingkan pemerintahan yang dipimpin [Root.GetRulingParty] dan merebut kekuasaan. [Root.GetLeader] menghilang, dikabarkan telah melarikan diri ke pengasingan, dan kudeta tersebut nyaris tidak menemui perlawanan awal.\n\nKepemimpinan baru [Root.GetAdjective] juga tidak berniat membiarkan perlawanan berkembang. Darurat militer telah diumumkan dan dengan perubahan besar yang tengah bergulir, apa pun yang terjadi setelah ini dipastikan akan sangat berbeda."
 political.9.a: "Negara yang kuat diperlukan untuk melindungi rakyatnya dari diri mereka sendiri."
 political.10.t: "Perang Saudara demi Fasisme"
 political.10.d: "Meskipun upaya gerakan fasis untuk menghidupkan kembali sentimen nasionalis telah membuahkan hasil, penolakan terhadap gagasan ini masih tetap tinggi. Para jenderal yang merencanakan untuk menggulingkan pemerintahan saat ini kecewa dengan kurangnya kepercayaan masyarakat [Root.GetAdjective] terhadap [Root.GetFascistParty].\n\nMereka tetap yakin bahwa rakyat pada akhirnya akan bosan dengan [Root.GetLeader], namun berbeda pendapat mengenai tindakan apa yang harus diambil. Beberapa orang menyerukan agar kudeta dilakukan sekarang, sebelum musuh [Root.GetName] mengambil tindakan. Namun, melakukan hal tersebut ketika dukungan publik terbatas akan menjerumuskan negara ini ke dalam perang saudara."
 political.10.a: "Keinginan untuk berkuasa tidak ada artinya jika seseorang ragu untuk merebutnya."
 political.10.b: "Mereka harus menyatukan rakyat terlebih dahulu, lalu memerintah mereka."
 political.11.t: "Divisi Serbuan Fasis Dibentuk"
 political.11.d: "Dunia politik dan militer selalu berkelindan erat dalam fasisme. Sejalan dengan menguatnya gerakan politik mereka, partai-partai fasis mulai membentuk organisasi paramiliter untuk melindungi diri dari ancaman internal maupun eksternal — ancaman internal yang dimaksud adalah lawan-lawan politik mereka. Meskipun banyak pihak merasa cemas dengan perkembangan ini, gelombang kobaran semangat militeristik telah mendorong peningkatan jumlah sukarelawan yang bergabung dengan angkatan bersenjata kita.\n\nPara pemimpin politik gerakan ini menegaskan bahwa lawan-lawan mereka memang beralasan untuk merasa takut. Dengan disusupinya tubuh militer di berbagai tingkatan oleh unsur-unsur politik yang demikian kental, batas antara musuh [Root.GetName] dan musuh fasisme kini tampak kian kabur."
 political.11.a: "Hanya pengkhianat negara yang perlu ditakuti."
 political.12.t: "Ancaman Komunisme"
 political.12.d: "'[Root.GetLeader] ingin kalian percaya bahwa [Root.GetName] aman sentosa dan bersatu. Tidak mengherankan jika kebohongan semacam itu telah meracuni pikiran rakyat kita, padahal seekor ular berbisa tengah melingkar tepat di sebelah kita! Lihatlah ke seberang perbatasan kita untuk menyaksikan bagaimana sesama anak bangsa saling serang atas nama komunisme, memproklamirkan berakhirnya batas-batas negara. Berapa lama lagi sampai mereka menyatakan negara kita juga telah tiada? Akankah [Root.GetRulingParty] melindungi kita dari ancaman ini?'\n\nPertumbuhan gerakan fasis di [Root.GetName] kian terdongkrak oleh dekatnya jarak revolusi komunis. Banyak kaum moderat yang biasanya menepis fasisme sebagai eksperimen ideologis sesat kini menganggap kekhawatiran ini sangat nyata. Jika dihadapkan pada pilihan antara komunisme dari negara tetangga atau rezim fasis, mereka mengakui lebih memilih opsi yang kedua. Mereka bahkan mungkin bersedia mendukungnya secara aktif."
 political.12.a: "Kami akan menjadi garda depan melawan ancaman merah!"
 political.13.t: "Langkah Menuju Demokrasi"
 political.13.d: "'Jika kita membungkam suara rakyat, bagaimana mungkin ada di antara kita yang berhak mengeklaim diri sebagai suara [Root.GetName]? Jika kita takut pada perbedaan pendapat, jika kita takut dikecam di muka umum atau dilengserkan melalui pemungutan suara rakyat, yang sebenarnya kita takuti adalah bahwa kita dibenci dan dicerca oleh warga negara kita sendiri. Apakah [Root.GetRulingParty] benar-benar memiliki keyakinan yang begitu rapuh terhadap prinsip-prinsipnya sendiri?'\n\nSebuah faksi yang berhati-hati dan terorganisasi secara longgar namun bersemangat di dalam pemerintahan telah mulai mendesak diterapkannya kebijakan yang tidak terlalu represif terhadap musuh-musuh negara. Mereka menghendaki masyarakat dilibatkan dalam pengambilan keputusan melalui referendum dan rapat-rapat partai lokal, bahkan jika hal ini berisiko mengancam masa depan agenda penguasa saat ini."
 political.13.a: "Kita bisa membicarakan hal ini secara internal sebagai permulaan."
 political.13.a.tt: "Meningkatkan peluang dukungan internal untuk mengatur pemilu."
 political.13.b: "Mengetahui bahwa kita berada di pihak yang benar, kita bisa membiarkan musuh kita berbicara lebih terbuka."
 political.13.b.tt: "Meningkatkan peluang masyarakat menyuarakan dukungan terhadap demokrasi dan membentuk oposisi."
 political.14.t: "[Root.GetRulingParty] Memperdebatkan Demokrasi"
 political.14.d: "Yang mengejutkan, seruan untuk melakukan lebih banyak referendum dan mengurangi tindakan represif terhadap penentang rezim mendapat dukungan dalam diskusi internal partai. Meskipun kepemimpinan [Root.GetRulingParty] masih skeptis, beberapa anggota berpengaruh telah mendukung perubahan tersebut.\n\nMungkin mereka memiliki keyakinan bahwa praktiknya tidak akan banyak berubah, atau mungkin mereka secara diam-diam adalah pengkhianat terhadap partai, sebagaimana diyakini oleh banyak lawan mereka. Terlepas dari itu, jika seruan publik untuk perubahan tersebut muncul, beberapa pemimpin [Root.GetName] siap untuk berkompromi."
 political.14.a: "Pilihannya mungkin tidak selalu berada di antara kebebasan dan kematian."
 political.14.a.tt: "Pemerintah dapat menyelenggarakan pemilu ketika kebijakan tersebut mendapat dukungan mayoritas."
 political.14.c: "Kami membutuhkan referendum."
 political.14.e: "Ini akan reda."
 impending_civil_war_tt: "§RJika dukungan ideologis terus meningkat, hal ini dapat menyebabkan perang saudara besar-besaran!§!"
 political.15.t: "Oposisi Demokratis Terbentuk"
 political.15.d: "Melonggarkan pembatasan terhadap jenis propaganda anti-[Root.GetRulingParty] yang boleh disebarkan ke publik, seperti yang telah diperkirakan, telah menyebabkan peningkatan ekspresi ketidakpuasan masyarakat secara terbuka. Demonstrasi terorganisasi dan selebaran sejauh ini sebagian besar ditemukan di lembaga-lembaga akademis dan kawasan-kawasan miskin di [Root.GetName], namun tak diragukan lagi bahwa gerakan ini tengah meluas.\n\nPara pemimpin bangsa terbelah dalam menyikapi masalah ini. [Root.GetLeader], yang mempertahankan cengkeraman besinya atas kepemimpinan partai, enggan memperluas ruang debat publik. Namun, langkah pertama telah diambil, dan barangkali tiada jalan untuk kembali lagi."
 political.15.a: "Gerakan ini tampaknya tumbuh secara alami tanpa adanya represi."
 political.16.t: "Tuntutan Publik untuk Pemilu"
 political.16.d: "Unjuk rasa penentangan publik yang dulunya terbatas di wilayah-wilayah tertentu kini telah menyebar luas. Sementara rakyat berkerumun memenuhi jalan-jalan, [Root.GetRulingParty] mendapati dirinya berada di persimpangan jalan. Jika kita terus membiarkan propaganda ini menyebar, referendum yang diusulkan baik dari dalam tubuh partai sendiri maupun oleh oposisi dapat membuktikan bahwa kita tidak lagi mengantongi dukungan publik. Persatuan yang selama ini kita perjuangkan mulai tergerus oleh kemajemukan pendapat yang kini bersatu melawan kita."
 political.16.a: "Sekalipun reformasi terjadi, kita harus menunjukkan kekuatan kita dengan menekan pembangkangan ini."
 political.16.b: "Biarkan orang-orang didengarkan."
 political.17.t: "Pemilihan Umum di [Root.GetName]"
 political.17.d: "Seiring kebebasan berpendapat dan berkumpul yang semakin diakui di [Root.GetName], faksi di dalam tubuh [Root.GetRulingParty] yang menyerukan penyelenggaraan pemilu telah beralih dari komplotan rahasia menjadi kaum reformis yang didukung masyarakat luas. Terlepas dari penentangan [Root.GetLeader], negara ini telah membuat pergerakan perlahan namun pasti menuju demokrasi dalam beberapa bulan terakhir, dan pemilihan umum kini dipandang sebagai langkah wajar berikutnya.\n\nKendati demikian, tidak semua warga [Root.GetAdjective] mendukung reformasi demokratis. Masih terdapat perdebatan sengit di dalam internal partai mengenai apakah pemilu sebaiknya ditunda hingga kita dapat menjamin stabilitas jalannya pembangunan."
 political.17.a: "Mereka yang setia pada [Root.GetRulingParty] akan mendukung keputusan tersebut sekarang."
 political.17.b: "Reformasi ini memerlukan dukungan yang lebih luas sebelum pemilu dapat diselenggarakan."
 political.18.t: "Kaum Fasis Menuntut Referendum"
 political.18.d: "Gerakan fasis [Root.GetAdjective] yang berkembang pesat tidak pernah mengklaim bahwa mereka membutuhkan dukungan mayoritas sebelum mereka merebut kekuasaan, dan mengandalkan penyatuan negara di bawah kepemimpinan mereka setelah kekuasaan mereka terbentuk. Namun, tampaknya dukungan publik terhadap mereka meningkat pesat. Banyak kaum fasis yang kini menyebut [Root.GetLeader] munafik, mengaku mewakili keinginan rakyat, padahal kenyataannya tidak mau mendengarkan massa.\n\nSejauh ini, seruan untuk melakukan referendum telah dianggap sebagai upaya biasa untuk mengganggu sistem yang dilakukan oleh anggota [Root.GetRulingParty], tapi setidaknya ini adalah tindakan politik. Jika kita tidak bertindak sekarang, kaum fasis mungkin akan memilih perjuangan dengan kekerasan sebagai jalan yang lebih baik menuju kekuasaan."
 political.18.a: "Tekan gerakan kebencian ini!"
 political.18.b: "Jangan memperhatikan mereka."
 political.18.c: "Jika rakyat menginginkannya, kami akan mengadakan referendum."
 political.19.t: "Kaum Komunis Menuntut Referendum"
 political.19.d: "Ide-ide Marxis sudah lama berakar di [Root.GetName], namun akhir-akhir ini mendapat dukungan yang lebih luas. Gerakan ini telah menyebar ke luar teori politik dan ke dalam praktik politik, dimana para pekerja yang tidak puas dan bahkan beberapa selebriti terkenal menyuarakan dukungannya. Kaum komunis menyebutnya sebagai kesadaran kelas. Kelompok [Root.GetRulingParty] menyebutnya sebagai jalur cepat menuju kerusuhan dan makar.\n\nTidak terlalu percaya pada kesediaan [Root.GetLeader] untuk menerapkan reformasi yang mereka minta, kelompok komunis yang lebih vokal menyerukan referendum segera untuk menggulingkan pemerintahan saat ini. Meskipun kita mungkin bisa membalikkan momentum gerakan massa ini, kegagalan untuk melakukan hal ini pasti akan menghasilkan metode penghapusan komunis yang lebih populer: Revolusi."
 political.19.a: "Kegiatan un-[Root.GetAdjective] harus dihentikan!"
 political.19.b: "Abaikan saja, mereka hanya menimbulkan masalah."
 political.19.c: "Referendum lebih baik daripada pemberontakan berdarah."
 political.20.t: "Kaum Demokrat Menuntut Referendum"
 political.20.d: "Tak mengherankan bila gagasan tentang kedaulatan rakyat atas negeri yang mereka diami dapat begitu cepat memikat hati khalayak. Tentu saja, [Root.GetRulingParty] memandang gagasan demokrasi yang diusung oleh gerakan-gerakan ini — kebebasan berbicara, pemilihan umum, kebebasan pers — semata-mata sebagai retorika populis yang ditujukan untuk memperlemah pemerintahan [Root.GetLeader].\n\nKendati demikian, tak dapat dimungkiri bahwa gagasan-gagasan tersebut telah menghunjam kuat di kalangan rakyat [Root.GetAdjective]. Selaras dengan asas demokrasi sejati, mereka menuntut referendum publik demi mengganti rezim yang berkuasa saat ini. Walaupun untuk saat ini tuntutan itu mudah diabaikan, gagasan semacam ini memiliki daya tahan yang luar biasa gigih. Apa yang akan menimpa kita jika kita menutup pintu bagi revolusi damai?"
 political.20.a: "Kumpulkan mereka."
 political.20.b: "Lanjutkan saja seperti biasa."
 political.20.c: "Jika kita menerima referendum, mungkin kita bisa melestarikan warisan kita."
 political.21.t: "Kaum Fasis Berbaris Menuju [Root.Capital.GetName]"
 political.21.d: "Setelah tuntutan referendum mereka ditolak — yang sesungguhnya hanyalah dalih formalitas belaka untuk merebut kekuasaan secara legal — kaum fasis memanfaatkan besarnya dukungan publik dan jejaring mereka di lingkungan militer [Root.GetAdjective] untuk melancarkan kudeta. Pemerintah [Root.GetRulingParty] menolak syarat-syarat yang mereka ajukan dan bersumpah akan berjuang hingga titik darah penghabisan guna mempertahankan [Root.GetName] sebagaimana adanya."
 political.21.a: "Kita akan stop them at any cost!"
 political.21.b: "Kaum fasis membawa semangat [Root.GetName] yang sebenarnya!"
 political.22.t: "Kaum Komunis Bangkit Memberontak"
 political.22.d: "Setelah permintaan referendum mereka ditolak, beberapa reformis gerakan komunis di [Root.GetName] dengan cepat kehilangan pengaruhnya terhadap elemen-elemen yang lebih radikal. Dengan penolakan [Root.GetRulingParty] untuk mengakui dukungan publik terhadap usulan reformasi, pandangan romantis terhadap revolusi secara bertahap semakin meluas dan para pemimpin gerakan menjadi orang yang paling mudah memicu kerusuhan. Kerusuhan tersebut kini telah berubah menjadi perang saudara berskala besar, yang mempertaruhkan masa depan negara."
 political.22.a: "Kami tidak akan membiarkan mereka merusak negara kami!"
 political.22.b: "Api revolusi harus dipadamkan dengan darah para penindas!"
 political.23.t: "Musim Semi [Root.GetAdjective]"
 political.23.d: "Setelah upaya referendum publik untuk melembagakan demokrasi ditolak, orang-orang di balik usulan tersebut menganggap rezim [Root.GetLeader] tidak dapat diperbaiki lagi. Koalisi kelompok pemberontak yang luas, disatukan oleh tujuan bersama untuk melembagakan sistem politik yang lebih representatif di [Root.GetName], telah mengangkat senjata dan mengumumkan bahwa mereka tidak akan berhenti sampai [Root.GetRulingParty] digulingkan."
 political.23.a: "Jauhkan kami dari peraturan mafia ini!"
 political.23.b: "Akhirnya, [Root.GetName] gratis!"
 political.24.t: "Kaum Fasis Dicemooh"
 political.24.d: "Kegilaan masyarakat [Root.GetAdjective] terhadap kebanggaan nasionalisme dan upaya menghidupkan kembali kejayaan masa lalu tampaknya sudah berlalu. Sebuah kebangkitan yang tidak sopan bagi para pendukungnya yang bersemangat, yang seragam, sikap militeristik, dan pidatonya yang berlebihan kini lebih sering menjadi sasaran ejekan daripada simpati.\n\nDulu dianggap sebagai ancaman terhadap basis kekuatan [Root.GetRulingParty], [Root.GetAdjective] fasisme kini semakin dilihat sebagai posisi yang tidak masuk akal, ekstremis, dan serangan terhadap nilai-nilai paling mendasar dari bangsa kita, bangsa yang mereka klaim menganut paham tersebut. sangat dihormati. Kata tersebut tampaknya lebih cocok sebagai penghinaan daripada sebutan politik."
 political.24.a: "Sungguh sekelompok badut."
 political.25.t: "Euforia Komunis Meredup"
 political.25.d: "Banyak penganut paham komunis yang meramalkan bahwa [Root.GetName] akan menjadi negara berikutnya yang akan jatuh ke dalam revolusi internasional, namun setelah beberapa bulan pemogokan dan bendera merah di jalanan, gerakan ini tampaknya telah mereda. Kelas pekerja, yang dianggap sebagai kekuatan pendorong revolusi, memiliki kekhawatiran yang lebih mendesak daripada menggulingkan [Root.GetLeader] dan tampaknya sama sekali tidak terkesan dengan keberhasilan revolusi-revolusi ini di tempat lain. Sementara itu, para intelektual yang menulis seruan untuk menggorok leher para penindas ternyata secara mengejutkan enggan untuk menghasut apa pun yang mungkin benar-benar mengganggu gaya hidup nyaman mereka.\n\nPembicaraan tentang revolusi kemungkinan akan terus berlanjut, baik mengenai bir murah atau anggur mahal, namun kemungkinan besar hanya berupa pembicaraan dan tidak lebih."
 political.25.a: "Sungguh sekelompok orang munafik."
 political.26.t: "Gerakan Demokratis Membungkam"
 political.26.d: "Setelah beberapa bulan diramaikan oleh gelombang penentangan keras terhadap rezim [Root.GetLeader] yang menuntut pemilihan umum serta undang-undang kebebasan berpendapat dan berkumpul yang lebih longgar, gerakan tersebut tampaknya mulai runtuh. Masyarakat kini justru lebih mencemaskan stabilitas [Root.GetName] seandainya reformasi semacam itu dipaksakan, dan mereka yang gencar menuntut demokrasi kini kian dipandang sebagai pengacau ketertiban umum.\n\nAnehnya lagi, banyak tokoh terkemuka pergerakan ini mendadak raib tanpa jejak atau mendadak menghentikan aktivitas mereka begitu saja. Barangkali sebagian dari mereka memilih mengasingkan diri setelah menyadari kegagalan perjuangannya. Apa pun yang sesungguhnya terjadi, pemerintah [Root.GetRulingParty] menepis segala tuduhan dan menyangkal keterlibatan apa pun."
 political.26.a: "Benar-benar sekelompok orang yang mudah menyerah."
 political.27.t: "[Root.GetLeader] Meninggalkan Kebijakan Luar Negeri Netral"
 political.27.d_fascism: "Menyusul naiknya [Root.GetRulingParty] ke tampuk kekuasaan baru-baru ini, [Root.GetLeader] mengumumkan bahwa [Root.GetName] tidak akan lagi mempertahankan Kebijakan Luar Negeri Netral.\n'Dunia telah menjadi kian rumit dan berbahaya. Kita tidak lagi dapat merasa aman jika berdiri sendirian. Kita harus berdiri kokoh bersama mitra-mitra fasis kita menghadapi musuh bersama. Jika kita menolak berpihak, kita akan binasa sendirian.'"
 political.27.d_communism: "Menyusul naiknya [Root.GetRulingParty] ke tampuk kekuasaan baru-baru ini, [Root.GetLeader] mengumumkan bahwa [Root.GetName] tidak akan lagi mempertahankan Kebijakan Luar Negeri Netral.\n'Dunia telah menjadi kian rumit dan berbahaya. Negeri ini selalu tegak di atas prinsip-prinsipnya dan senantiasa bersiap mempertahankannya. Kita tidak lagi dapat merasa aman jika berdiri sendirian. Netralitas bukan lagi tempat perlindungan yang aman seperti dahulu kala, dan pihak-pihak yang haus kekuasaan di dunia ini sama sekali tidak menghormatinya. Kita harus berdiri kokoh bersama saudara-saudara komunis kita melawan kekuatan-kekuatan yang berupaya menindas kita, melawan hegemoni kaum borjuis yang tiada hentinya ingin menindas kita. Jika kita tidak berani mengambil sikap tegas, kita akan binasa sendirian.'"
 political.27.a: "Untuk masa depan [Root.GetName]"
 political.28.t: "[Root.GetNameDefCap] Bersatu Kembali"
 political.28.d: "Perang saudara mengerikan yang telah meluluhlantakkan tanah air kita akhirnya mendekati ujungnya, dan sebuah kesepakatan politik pada akhirnya berhasil dicapai. Kini kita dapat kembali seia sekata dengan sesama warga [Root.GetAdjective], dan bersama-sama kita akan membangun kembali kejayaan bangsa. Musuh-musuh yang berniat menangguk keuntungan dari pertikaian saudara kita kini harus berhadapan dengan negara [Root.GetAdjective] yang bersatu padu.\n\nNegara [Root.GetName] yang berideologi [Root.GetRulingIdeology] ini takkan pernah terpecah belah lagi!"
 political.28.a: "Akhirnya bersatu!"
 political.29.t: "Akhir dari Pergolakan Saudara"
 political.29.d: "Perang saudara yang sempat memecah belah bangsa kita kini telah usai, dan perjuangan luhur kita telah beroleh kejayaan. Kendati demikian, kita tidak boleh membiarkan anasir-anasir pendukung musuh terus menebarkan propaganda berbisa mereka di tengah masyarakat. Tangan besi mutlak diperlukan di hari-hari mendatang, agar kita dapat tegak bersatu, waspada, dan perkasa menghadapi segala ancaman luar yang hendak merongrong pemerintahan kita yang masih belia ini."
 political.29.a: "Itu akan selesai."
 political.31.t: "Wacana Penyatuan Kembali [ROOT.GetAdjective]"
 political.31.desc: "Kancah peperangan telah membelah negeri kita. Kini saatnya memulai pemulihan setelah kedamaian kembali bersemi. Desakan kuat untuk penyatuan kembali mengemuka di antara faksi-faksi [ROOT.GetAdjective] yang berhaluan [ROOT.GetRulingIdeology]."
 political.31.a: "Kita harus menerima ini"
 political.31.b: "Mari kita tetap di luar. Biarkan masa lalu menjadi masa lalu."
 political.32.t: "Penyatuan Kembali [ROOT.GetAdjective]"
 political.32.desc: "Saatnya telah tiba untuk menyatukan kembali rakyat [ROOT.GetAdjective] berideologi [ROOT.GetRulingIdeology] yang sempat terpecah selepas perang. [ROOT.GetNameDefCap] akan kembali utuh seutuhnya."
 political.32.a: "[ROOT.GetName] yang bersatu kembali"
 political.33.t: "[ROOT.GetCountryAppropriateFilmProduction]"
 political.33.desc: "Demi membangkitkan sentimen positif masyarakat terhadap perjuangan perang, kementerian propaganda kita telah memilih karya sinema istimewa '[ROOT.GetCountryAppropriateFilmProduction]' — tontonan bermutu tinggi yang sarat pesan patriotisme mendalam — untuk diputar di seantero negeri.\n\nKita berharap ini menjadi tonggak awal tradisi panjang dan gemilang bagi industri perfilman patriotik kita — hasil yang dicapai sejauh ini sungguh luar biasa."
 political.33.a: "Sebuah mahakarya."
 britain.1.t: "Misi Tizard"
 britain.1.d: "Pemerintah Britania telah mengirimkan delegasi ilmiah yang dipimpin oleh Henry Tizard dengan membawa usulan menarik. Pihak Britania bersedia menggabungkan upaya penelitian mereka dengan kita di sejumlah bidang penting, mengingat mereka kekurangan kapasitas industri untuk memproduksi temuan-temuan teknologi tersebut dalam skala massal."
 britain.1.a: "Usulan yang bagus!"
 britain.1.b: "Tidak, Inggris sendirian."
 britain.1.c: "Kita harus mengincar kerja sama jangka panjang."
 britain.2.t: "Misi Tizard Berhasil"
 britain.2.d: "Pemerintah Amerika Serikat telah menyetujui usulan kita dan membagikan sebagian data riset penting mereka kepada delegasi kita."
 britain.2.a: "Sangat bagus!"
 britain.3.t: "Misi Tizard Ditolak"
 britain.3.d: "Pemerintah Amerika Serikat telah menolak usulan kita; kita tidak akan mendapatkan bantuan sedikit pun dari mereka."
 britain.3.a: "Para perusak itu!"
 britain.4.t: "Jalan Burma"
 britain.4.d: "Demi menyokong perjuangan perang kita melawan Jepang, Britania telah membenahi infrastruktur dan mendirikan sejumlah pangkalan udara di sepanjang garis perbatasan Burma kita."
 britain.4.a: "Usir anjing-anjing yang berlari!"
 japan.16.t: "Boneka Jepang"
 japan.16.d: "Kekaisaran Jepang berniat menguasai kekayaan Tiongkok dan takkan berhenti sebelum perang meletus. Jika kita enggan mengangkat senjata melawan mereka, kita terpaksa harus tunduk pada cengkeraman mereka dan menjadi sekadar negara boneka belaka bagi Jepang."
 japan.16.a: "Kita tidak bisa melawan"
 japan.16.b: "Kita harus fight!"
 japan.17.t: "Tiongkok Tunduk"
 japan.17.d: "Bangsa Tiongkok yang pengecut sekali lagi bertekuk lutut di hadapan tuntutan kita; mereka telah menyetujui untuk menjadi negara boneka tak berdaya bagi imperium kita."
 japan.17.a: "Kerugian mereka adalah keuntungan kita!"
 japan.18.t: "Tiongkok Menolak"
 japan.18.d: "Bangsa Tiongkok yang bebal telah menolak permintaan kita yang sepenuhnya masuk akal untuk mengelola sektor-sektor tertentu dalam pemerintahan mereka. Kita terpaksa harus menaklukkan mereka dengan kekerasan jika menginginkan akses terhadap sumber daya mereka."
 japan.18.a: "Seharusnya tidak sulit!"
 britain.6.t: "Kemerdekaan India"
 britain.6.d: "Empat tahun lalu kita berikrar akan memberikan kemerdekaan bagi India dalam kurun waktu empat tahun. Batas waktu itu kini telah tiba, dan rakyat India menuntut agar kita memenuhi janji tersebut. Akankah permata mahkota kekaisaran ini lepas dari pangkuan Imperium Britania?"
 britain.6.a: "Saatnya untuk melepaskan"
 britain.6.b: "Tidak akan pernah!"
 japan.15.t: "Tentara Nasional India"
 japan.15.d: "Setelah kekalahan kami atas Inggris, kami mempunyai sejumlah besar tawanan perang India. Dengan persuasi yang tepat, kita bisa menggunakan para tahanan itu untuk memperkuat kekuatan kita..."
 japan.15.a: "Demi keadilan yang luar biasa!"
 JAP_Indian_National_Army_arrives: "Dua divisi Tentara Nasional India tiba di Singapura."
 britain.7.t: "Hentikan Perdagangan dengan Jerman"
 britain.7.d: "Britania Raya telah melayangkan ultimatum kepada kita: Segera hentikan seluruh perdagangan dengan Jerman, atau mereka akan melancarkan invasi."
 britain.7.a: "Lagipula aku tidak pernah menyukai orang Jerman"
 britain.7.b: "Kami akan berdagang dengan siapa yang kami suka!"
 britain.8.t: "Tuntutan Ditolak!"
 britain.8.d: "[From.GetName] telah menolak mentah-mentah tuntutan kita untuk menghentikan hubungan dagang dengan Jerman."
 britain.8.a: "Maka itu perang!"
 britain.8.b: "Kita tidak bisa memaksa mereka."
 britain.9.t: "Chamberlain Mengundurkan Diri"
 britain.9.d: "Dengan berkembangnya perang yang merugikan kita dan sekutu kita, Perdana Menteri mendapat kecaman karena keputusannya di masa damai dan masa perang di titik-titik kritis. Pada saat ketika Inggris perlu bersatu lebih dari sebelumnya, Inggris mendapati dirinya terpecah karena sebagian anggota parlemen memandang rendah Chamberlain.\n\nKarena kurangnya dukungan penting dari Partai Buruh, Perdana Menteri telah mengambil keputusan untuk mengundurkan diri, dan memilih Lord Halifax sebagai penggantinya. Namun, Halifax bersikap skeptis dan Chamberlain telah menyarankan Raja untuk memanggil Winston Churchill. Churchill, yang telah lama memperingatkan kita akan perang yang sedang menimpa kita, diyakini mampu membawa kita melewatinya."
 britain.9.a: "Kami tidak akan pernah menyerah."
 britain.10.t: "Chamberlain Tutup Usia"
 britain.10.d: "Perdana Menteri Neville Chamberlain jatuh sakit parah baru-baru ini, kendati sebelumnya secara umum tergolong bugar untuk usianya. Setelah didiagnosis mengidap kanker usus besar, rasa sakit yang kian tak tertahankan dan gangguan tidur akut memaksanya meletakkan jabatannya. Chamberlain sejatinya masih menikmati dukungan rakyat yang luas dan hanya bersedia mundur sebagai jalan terakhir, menyadari bahwa usianya takkan cukup panjang untuk kembali bertugas.\n\nPertanyaan besar kini mengemuka: Siapakah yang akan meneruskan estafet kepemimpinan negarawan besar ini dan menuntun Britania melewati masa-masa kelam yang masih membentang di hadapan kita?"
 britain.10.a: "Winston Churchill adalah orang yang dibutuhkan Kekaisaran."
 britain.10.b: "Lord Halifax adalah pilihan pertama Chamberlain."
 britain.21.t: "Kemenangan Misi Tizard"
 britain.21.d: "Pemerintah AS tidak hanya menyetujui proposal awal kami tetapi bahkan menawarkan kerja sama jangka panjang antar peneliti di negara kami."
 britain.21.a: "Luar biasa!"
 soviet.18.t: "Insiden Xi'an"
 soviet.18.d: "Tekanan eksternal dari [SOV.GetNameDef] untuk mengakhiri permusuhan antara kita dan Tentara Merah Tiongkok telah mendorong sejumlah pihak di barisan kita mengambil tindakan sendiri. Dua jenderal telah menahan [Root.GetLeader], berusaha memaksakan gencatan senjata antara kita dan pihak komunis guna menyatukan Tiongkok melawan ancaman luar. Tekanan internasional untuk solusi damai, berpadu dengan rapuhnya Tiongkok yang terpecah-belah pada era ini, menjadi faktor yang mendukung terbentuknya front persatuan. Langkah apa yang harus kita ambil?"
 soviet.18.a: "Hubungi partai komunis untuk pembicaraan damai."
 soviet.18.b: "Tidak akan pernah!"
 soviet.19.t: "Nasionalis Menawarkan Gencatan Senjata"
 soviet.19.d: "Perbedaan pendapat di kalangan Nasionalis telah menyebabkan situasi yang berbahaya. Pemimpin mereka, [From.GetLeader] telah ditangkap dalam upaya memaksa musuh kita untuk menerima gencatan senjata dengan kita untuk menyatukan Tiongkok melawan musuh asing. Meskipun kami ingin melihat kepemimpinan Kuomintang dihukum atas kejahatan mereka terhadap kami, ini adalah kesempatan langka untuk bekerja sama dan memastikan bahwa Tiongkok tidak jatuh ke tangan imperialis asing."
 soviet.19.a: "Kami menerima gencatan senjata untuk saat ini."
 soviet.19.b: "Revolusi tidak bisa dikesampingkan begitu saja!"
 soviet.20.t: "Tiongkok Nasionalis Menolak Negosiasi"
 soviet.20.d: "Meskipun [From.GetLeader] diculik, kaum Nasionalis menolak untuk memulai perundingan gencatan senjata dengan pihak Komunis. Sayangnya, rakyat Tiongkok akan tetap berada dalam pusaran konflik berdarah antarsesama bangsanya sendiri, menjadikan mereka mangsa empuk bagi musuh-musuh mereka."
 soviet.20.a: "Kami melakukan apa yang kami bisa."
 soviet.21.t: "Gencatan Senjata dalam Perang Saudara Tiongkok"
 soviet.21.d: "Perundingan di Xi'an telah membuahkan hasil. Pihak Nasionalis dan Komunis telah menyepakati gencatan senjata, menghentikan permusuhan setidaknya untuk sementara waktu dan memungkinkan kedua kubu bekerja sama melawan ancaman asing."
 soviet.21.a: "Masih ada harapan bagi Tiongkok."
 soviet.22.t: "Tiongkok Komunis Menolak Negosiasi"
 soviet.22.d: "Meskipun para jenderal Kuomintang telah berupaya sebaik-baiknya untuk mencapai gencatan senjata dengan para pemimpin Partai Komunis, pihak komunis menolak untuk membuat perdamaian sementara selama pemimpin Nasionalis masih hidup. Tampaknya permusuhan tidak akan berakhir dengan mudah."
 soviet.22.a: "Jika terus begini, musuh-musuh Tiongkok mungkin akan terpecah belah dan menaklukkan."
 soviet.23.t: "[SOV.GetNameDefCap] Menyerahkan Wilayah"
 soviet.23.d: "[SOV.GetNameDefCap] memiliki ancaman lain yang lebih mencemaskan dan tidak ingin memperuncing permusuhan dengan Kekaisaran kita. Sebagai tanda keinginan berdamai di antara bangsa kita, mereka telah menyerahkan sejumlah wilayah kepada kita, dengan harapan dapat mempererat hubungan diplomatik kita."
 soviet.23.a: "Mungkin ini bisa menjadi titik balik."
 soviet.24.t: "Kolom Kelima (The Fifth Column)"
 soviet.24.d: "Penindasan terhadap musuh-musuh rakyat, mereka yang berupaya memutarbalikkan atau menumbangkan revolusi, telah menjadi kebijakan tetap sejak Partai berkuasa. Perebutan kekuasaan internal setelahnya telah mengalihkan fokus kita, dan pembersihan barisan Partai itu sendiri semakin ditekankan sejak pengasingan Trotsky. Stalin telah menjadikan dirinya sebuah ikon, namun dengan konsekuensi menciptakan banyak musuh nyata dan musuh khayalan yang tak terhitung jumlahnya.\n\nSetelah menyaksikan perebutan kekuasaan internal terburuk, Sekretaris Jenderal cenderung bertindak bahkan pada kecurigaan terkecil sekalipun. Disingkirkan dari Partai berarti hukuman penjara atau kematian. Masa-masa kelam menanti siapa pun yang menunjukkan ketidaksetiaan - atau yang justru terlalu setia hingga tampak mencurigakan."
 soviet.24.a: "Apakah Zinoviev dan sejenisnya masih berhubungan dengan Trotsky?"
 soviet.25.t: "Pengadilan Pusat Trotskis Anti-Soviet"
 soviet.25.d: "Meskipun Lev Trotsky telah dipaksa hidup di pengasingan, $SOV_iosif_stalin$ khawatir ia masih memiliki pendukung rahasia di dalam partai. Serangkaian penangkapan kilat dan interogasi brutal telah membuahkan pengakuan dan kesaksian yang secara tepat mengarah pada beberapa rival Stalin. Namun, semakin banyak pertanyaan diajukan dan semakin dalam polisi rahasia menyelidiki surat-surat serta buku harian, semakin banyak orang yang terseret, meski secara tidak langsung.\n\nPara anggota Partai mulai meyakini bahwa kekuasaan mutlak Stalin dan wafatnya sang istri telah mengisolasinya sedemikian rupa hingga ia menganggap siapa pun sebagai ancaman, namun bukankah itu persis seperti apa yang akan dikatakan oleh seorang pengkhianat?"
 soviet.25.a: "Istri Kalinin dicurigai. Dia juga tidak bisa dipercaya."
 soviet.25.b: "Khrushchev pernah mencoba-coba Trotskisme di masa lalu. Dia harus pergi."
 soviet.25.c: "Pengakuan Radek menunjuk pada beberapa orang di dalam partai."
 soviet.25.e: "Anggota partai bisa dipercaya. Paranoia ini harus dihentikan."
 soviet.26.t: "Pengadilan Rahasia Para Jenderal"
 soviet.26.d: "Tentara Merah selalu menjadi sarang bagi anasir-anasir subversif, sejak masa Trotsky sendiri menjabat sebagai Komisaris Perang. Dokumen-dokumen yang diperoleh NKVD telah menyeret sejumlah perwira tinggi bukan hanya sebagai pengkhianat, melainkan juga mata-mata. Mikhail Tukhachevsky termasuk di antara tersangka paling menonjol, dan sosok yang sangat ingin disingkirkan Stalin dari tubuh angkatan darat. Sementara itu, seringnya kontak angkatan laut dengan orang asing menyebabkan banyak perwira mereka juga ditangkap.\n\nMeskipun ada dokumen dari musuh-musuh kita yang membuktikan kesalahan mereka, tidak ada yang tahu apakah mereka merekayasanya, atau apakah mereka memang sengaja diberi informasi palsu oleh pihak-pihak yang menginginkan pembersihan ini bergulir sejak awal."
 soviet.26.a: "Tukhachevsky harus diadili secara rahasia dan segera dieksekusi."
 soviet.26.b: "Rokossovsky menolak mengaku, tetapi tidak bisa dibiarkan hidup."
 soviet.26.c: "Dokumen palsu dan pengakuan paksa bukanlah bukti."
 soviet.27.t: "Pengadilan 21 Tokoh"
 soviet.27_tt: "Meningkatkan penalti dari §YPetugas Dibersihkan§!"
 soviet.27_tt2: "§RAkan menyebabkan perang saudara di masa depan.§!"
 soviet.27.d: "Setelah beberapa kali penangkapan dan persidangan, Pembersihan Besar-besaran telah menyusun narasi yang mengarah pada persidangan ini. Di antara para terdakwa tidak hanya terdapat pemimpin lama seperti Nikolai Bukharin, tetapi sejumlah diplomat, politisi, pejabat militer, dan bahkan banyak perwira tinggi NKVD. Tuduhan yang diajukan juga lebih luas dibandingkan sebelumnya, termasuk rencana pembunuhan para pemimpin Soviet dan menjual Uni Soviet kepada musuh-musuhnya yang telah berlangsung selama satu dekade.\n\nFakta bahwa NKVD sendiri kini menjadi salah satu target pembersihan telah menjadikan proses ini berjalan lancar. Ancaman dan pemukulan menyebabkan banyak orang mengakui semua tuduhan, bahkan tuduhan yang paling aneh sekalipun. Terdakwa utama menghadapi eksekusi."
 soviet.27.a: "Angkatan Laut dan Angkatan Udara sejauh ini berjalan dengan mudah."
 soviet.27.b: "Seperti yang kita duga, musuh ada dimana-mana."
 soviet.27.c: "Ini sudah keterlaluan. Sebentar lagi kita akan membunuh semua anggota kita sendiri."
 soviet.28.t: "Kudeta Kaum Trotskis"
 soviet.28.d: "Dunia mungkin tidak akan pernah tahu apakah pembersihan yang dilakukan Stalin menyasar orang-orang yang tepat, atau apakah ia menciptakan lebih banyak musuh dalam upaya memusnahkan setiap penganut Trotskis di Partai. Yang diketahui, apa yang ditakutkannya akhirnya terjadi. Hari ini, Lev Trotsky muncul kembali setelah kembali dari pengasingannya, dan dengan dukungan beberapa anggota partai berpengaruh dan pejabat NKVD, melancarkan kudeta untuk menggulingkan pemerintahan Stalin.\n\nMantan Sekretaris Jenderal diserang di rumahnya dengan kapak es, dan segera dieksekusi bersama beberapa pendukungnya. Menghancurkan kultus kepribadian yang ia bangun akan memakan waktu, tetapi orang-orang sekarang setidaknya tahu bahwa ia tidak abadi.\n\nSalah satu dari sedikit orang yang selamat yang berhasil melarikan diri adalah Ivan Konev. Pendukung setia Stalin telah berhasil mengumpulkan sejumlah dukungan dan menyatakan perang terhadap pemerintahan Trotsky, dalam upaya untuk mengambil kembali kekuasaan dan 'memenuhi visi Kamerad Stalin'."
 soviet.28.a: "Pemimpin datang dan pergi, namun rakyat tetap ada."
 soviet.29.t: "Prancis Ingin Bergabung dengan Komintern."
 soviet.29.d: "Kawan-kawan kita di Parti Communiste Français telah membuat kemajuan luar biasa. Bangsa Prancis siap untuk bergabung dengan Komintern."
 soviet.29.a: "Tambahan yang disambut baik"
 soviet.29.b: "Tidak!"
 soviet.100.t: "Kaum Komunis Mengalah"
 soviet.100.d: "Karena [SOV.GetNameDef] dan kita berada dalam perang melawan musuh bersama, mereka tampaknya telah menurunkan dukungan mereka kepada partai-partai komunis dalam negeri kita."
 soviet.100.a: "Senang bisa terbebas dari mereka!"
 yugoslavia.1.t: "Mendukung Kudeta di Yugoslavia"
 yugoslavia.1.d: "Sentimen anti-Poros di Yugoslavia, yang telah lama kami coba seimbangkan dalam upaya menjadikan negara ini tetap netral dan melanjutkan kerja sama dengan kepemimpinan saat ini, telah mencapai titik kritis dengan upaya baru negara ini untuk bekerja sama dengan Jerman. Meskipun beberapa sekutu Jerman memiliki kepentingan teritorial di Yugoslavia, kepemimpinannya memilih untuk mengizinkan pasukan Jerman masuk ke negara mereka.\n\nSebuah inisiatif di Angkatan Udara Yugoslavia berupaya untuk menggulingkan pemerintah yang bersahabat dengan Jerman. Meskipun hal ini berisiko semakin mengganggu stabilitas kawasan, hal ini akan menghentikan kerja sama mereka dengan Jerman. Haruskah agen intelijen kita mendukung kudeta tersebut, atau mencoba meyakinkan faksi anti-Jerman untuk menundanya?"
 yugoslavia.1.a: "Membantu kudeta melalui BUMN."
 yugoslavia.1.b: "Mencegah para komplotan."
 yugoslavia.2.t: "Kudeta Militer"
 yugoslavia.2.d: "Ketika [Root.GetLeader] berusaha untuk tetap bersahabat dengan Jerman, kebencian dalam negeri terhadap kerja sama dengan Jerman semakin meningkat. Kaum nasionalis Serbia khususnya menentang arah diplomasi ini, dan oposisi populer sangat vokal. Saat ini, para pejabat militer di angkatan udara mencoba melakukan kudeta, menyatakan Raja Peter II yang masih muda sudah cukup umur dan mengangkatnya ke atas takhta. Didorong oleh badan intelijen musuh Jerman, kudeta ini bertujuan untuk mempersingkat perjanjian kita. Ini mungkin berarti perang."
 yugoslavia.2.a: "Lebih baik perang daripada perjanjian!"
 yugoslavia.2.b: "Kami lebih memilih melawan kudeta dibandingkan melawan Jerman."
 yugoslavia.3.t: "Konferensi London"
 yugoslavia.3.d: "Harapan kita bahwa kita tidak akan menghadapi ancaman Jerman seorang diri telah menjadi kenyataan. Kekuatan perkasa Imperium Britania dan sekutunya akan berdiri tegak di samping kita."
 yugoslavia.3.d_FRA_abandoned_yugoslavia: "Harapan kita bahwa kita tidak akan menghadapi ancaman Jerman seorang diri telah menjadi kenyataan. Kekuatan perkasa Imperium Britania dan sekutunya akan berdiri tegak di samping kita. Sayangnya Prancis telah memilih jalan pengecut."
 yugoslavia.3.a: "Yugoslavia akan berdiri bebas"
 yugoslavia.4.d: "Harapan kita bahwa kita tidak akan menghadapi ancaman Jerman seorang diri telah menjadi kenyataan. Kendati redupnya kejayaan Imperium Britania tidak hadir bersama kita, kedigdayaan Imperium Prancis akan berdiri bahu-membahu di sisi kita."
 yugoslavia.4.a: "Kita akan triumph!"
 yugoslavia.5.t: "Diktat London!"
 yugoslavia.5.d: "Menghadapi kebangkitan Jerman yang merobek perjanjian yang menjaga perdamaian. Para pengecut di barat melemparkan kita ke serigala dengan harapan kita bisa memuaskan rasa lapar mereka. Sejarah akan menilai mereka dengan buruk, tapi sekarang kita harus memilih nasib kita."
 yugoslavia.5.a: "Perlawanan hanya akan menyebabkan kematian yang sia-sia"
 yugoslavia.5.b: "Kami akan berjuang sampai akhir"
 yugoslavia.6.t: "Konferensi London"
 yugoslavia.6.d: "Ketika semua pihak lain telah meninggalkan kita, hanya Italia yang setia berdiri di sisi kita. Kini mereka adalah sahabat sejati kita dan kita akan berjuang bersama-sama."
 yugoslavia.6.a: "Tuhan Tolong Kami"
 yugoslavia.7.t: "Nasib Yugoslavia"
 yugoslavia.7.d: "[From.GetNameDefCap] menuntut agar kita menyerahkan kendali penuh atas negara kita kepada mereka. Seluruh warga Yugoslavia pada hakikatnya akan menjadi warga Jerman dan kita tidak lagi memiliki kedaulatan apa pun. Kita dapat memilih untuk bertahan di sini dan berharap bantuan akan tiba, tetapi ini mungkin merupakan satu-satunya cara untuk menghindarkan pembantaian terhadap rakyat Yugoslavia."
 yugoslavia.7.a: "Kita harus tetap teguh."
 yugoslavia.7.b: "Ini akan menyelamatkan banyak nyawa"
 yugoslavia.8.d: "[From.GetNameDefCap] menuntut agar kita menyerahkan kendali penuh atas negara kita. Warga Yugoslavia pada hakikatnya akan menjadi warga [From.GetNameDef] atau salah satu negara boneka mereka. Kita dapat memilih untuk bertahan di sini dan berharap bantuan akan tiba, tetapi ini mungkin merupakan satu-satunya cara untuk menghindarkan pembantaian terhadap rakyat Yugoslavia."
 yugoslavia.8.a: "Kita harus tetap teguh."
 yugoslavia.8.b: "Ini akan menyelamatkan banyak nyawa"
 yugoslavia.9.d: "[From.GetNameDefCap] menuntut agar kita menyerahkan wilayah kepada pemerintah Kroasia yang baru dibentuk, yang dikendalikan oleh [From.GetNameDef]. Mereka juga menuntut kita melaksanakan reformasi besar-besaran dalam pemerintahan, yang memungkinkan kita memerintah warga Yugoslavia namun dengan pengaruh kuat [From.GetAdjective] terhadap politik kita. Kita dapat memilih untuk bertahan di sini dan berharap bantuan akan tiba, tetapi ini mungkin merupakan satu-satunya cara untuk menghindarkan pembantaian terhadap rakyat Yugoslavia."
 yugoslavia.9.a: "Kita harus tetap teguh."
 yugoslavia.9.b: "Ini akan menyelamatkan banyak nyawa"
 germany.89.t: "Aliansi Durjana"
 germany.89.d: "Setelah keberhasilan kerja sama kita baru-baru ini, pihak Jerman datang kepada kita dengan tawaran yang memikat. Mereka mengusulkan agar kita mengesampingkan perbedaan dan alih-alih menyia-nyiakan kekuatan kita untuk saling memerangi sementara negara-negara demokrasi barat menonton dan meraup untung, kita menggabungkan kekuatan dan menghancurkan mereka!"
 germany.89.a: "Biarkan dunia gemetar!"
 germany.89.b: "Tidak ada kesepakatan dengan kaum Fasis!"
 germany.90.t: "Aliansi Ditolak"
 germany.90.d: "Soviet telah menolak tawaran kita, jika kita menginginkan sumber daya [SOV.GetNameDef] kita harus merebutnya dengan kekerasan!"
 germany.90.a: "Jika mereka tidak bersama kita, mereka melawan kita."
 germany.91.t: "Prancis Ingin Bergabung dengan Faksi Kita"
 germany.91.d: "Para pemimpin kuat Mouvement Franciste telah membuat kemajuan besar dan menawarkan untuk bergabung dengan tujuan kami. Bangsa Perancis siap berperang demi Reich."
 germany.91.a: "Mehr Soldaten untuk das Reich"
 germany.91.b: "Tidak!"
 germany.92.t: "Jerman Menolak Ultimatum"
 germany.92.d: "Terlepas dari penegasan kita bahwa remiliterisasi Rhineland akan dipandang sebagai tindakan perang, Jerman menolak untuk mundur dan bergerak maju ke zona demiliterisasi, mengabaikan peringatan kita. Ini berarti bahwa terlepas dari upaya terbaik kita untuk memelihara perdamaian, perang sekali lagi meletus di Eropa."
 germany.92.a: "Perjanjian Versailles harus ditegakkan."
 germany.93.t: "Konferensi London"
 germany.93.d: "Kita mengharapkan negara-negara besar Eropa duduk mengelilingi meja dan mencapai kesepakatan yang adil atas nama perdamaian. Sebaliknya, pihak Inggris dan Prancis memilih mendukung orang-orang Yugoslavia yang lancang beserta negara buatan mereka. Slovenia akan menjadi milik kita, dengan satu atau lain cara...."
 germany.93.d_FRA_abandoned_yugoslavia: "Kita mengharapkan negara-negara besar Eropa duduk mengelilingi meja dan mencapai kesepakatan yang adil atas nama perdamaian. Meskipun Prancis melihat keadilan dari perkara kita, pihak Inggris yang bodoh telah memilih untuk mendukung orang-orang Yugoslavia yang lancang beserta negara buatan mereka. Slovenia akan menjadi milik kita, dengan satu atau lain cara...."
 germany.93.a: "Kita akan not be denied"
 germany.94.t: "Penyerahan di London"
 germany.94.d: "Dalam kemenangan lain atas keberanian dan tindakan nyata, Slovenia, yang akan segera dinamai kembali sebagai Karniola, telah dikembalikan ke rumah sahnya di dalam Reich Jerman."
 germany.94.a: "Kemenangan bagi Jerman!"
 germany.95.t: "Pihak Yugoslavia Menolak"
 germany.95.d: "Dengan rasa kepantasan yang keliru tentang tempat mereka di dunia, orang-orang Yugoslavia memilih untuk tidak menerima kesempatan yang telah kita tawarkan kepada mereka."
 germany.95.a: "Saatnya memberi mereka pelajaran"
 germany.96.t: "Konferensi London"
 germany.96.d: "Orang-orang Yugoslavia, yang dihasut oleh pihak Italia yang bodoh, telah memutuskan untuk menentang kita. Orang-orang Italia yang tidak tahu berterima kasih akan binasa bersama pihak Yugoslavia. Jenderal Rommel meyakinkan kita bahwa mereka lari kocar-kacir pada waktu lalu, dan tak diragukan lagi mereka akan lari lagi."
 germany.96.a: "Perang ini tidak akan berlangsung lama"
 germany.97.t: "Konferensi London"
 germany.97.d: "Konferensi London yang besar seharusnya membetulkan salah satu dari sekian banyak ketidakadilan yang telah ditimpakan kepada Jerman. Namun, pihak Prancis masih haus akan pembalasan dendam dan hanya ingin melihat Jerman berlutut. Mereka mendukung rezim di Beograd terlepas dari keadilan perjuangan kita. Apakah mereka sungguh mengira ancaman kosong mereka ada artinya bagi kita?"
 germany.97.a: "Kita akan crush them both."
 germany.98.t: "Nasib Yugoslavia"
 germany.98_tt: "§YJika Yugoslavia menerima, hal berikut akan terjadi:§!"
 germany.98.d: "Kita selalu tahu bahwa negara Yugoslavia yang dibentuk dari pecahan Kekaisaran Habsburg adalah negara buatan yang ditakdirkan tidak akan bertahan lama. Kebencian etnis yang mendidih di bawah permukaan kini meluap dan negara tersebut hancur berantakan. Kita harus turun tangan untuk membenahi situasi ini."
 germany.98.a: "Annex seluruh Yugoslavia."
 germany.98.b: "Buatlah boneka Kroasia. Lampirkan sisanya."
 germany.98.c: "Buatlah boneka Kroasia dan Yugoslavia."
 germany.99.t: "Membagi Yunani bersama [ITA.GetNameDef]"
 germany.99.d: "Ketika kita menyarankan agar barangkali perbatasan Yunani harus disesuaikan kembali, duta besar Italia berkoar bahwa mereka akan membangun kembali Kekaisaran Romawi di atas puing-puing abu Yunani."
 germany.99.a: "Tentu saja mereka akan melakukannya"
 germany.99.b: "Tetaplah memastikan kereta berjalan tepat waktu"
 germany.100.t: "Membagi Yunani bersama [BUL.GetNameDef]"
 germany.100.d: "Wilayah yang dianggap milik Bulgaria diserahkan kepada Yunani setelah Perang Balkan Kedua dan Perang Besar. Jika kita membetulkan kesalahan ini, kita akan mengikat Bulgaria ke pihak kita. Namun, jika mereka tidak cukup kuat untuk merebutnya sendiri, apakah mereka sekutu yang layak bagi kita?"
 germany.100.a: "Mari kita ikat Bulgaria dengan kita"
 germany.100.b: "Mereka perlu mendapatkan persahabatan kita"
 germany.101.t: "Menuntut Wilayah Yunani"
 germany.101.d: "Kurangnya sekutu yang cocok membuat Jerman berada dalam posisi strategis yang merugikan di Mediterania Timur. Namun, kita dapat memperbaikinya dengan menuntut pangkalan dan wilayah di sekitarnya dari Yunani demi mengamankannya."
 germany.101.a: "Mereka harus menyerahkan pangkalan ke Jerman"
 germany.101.b: "Kami harus memainkan permainan panjang"
 germany.101_tt: "§YJika Yunani menerima, hal berikut akan terjadi:§!"
 germany.102.t: "Yunani Menolak"
 germany.102.d: "Yunani dengan bodohnya menolak bantuan kita dalam menyelesaikan sengketa perbatasan mereka."
 germany.102.a: "Mereka pasti sudah menyadari alternatifnya"
 germany.103.t: "Yunani Menolak"
 germany.103.d: "Yunani telah menolak tawaran perlindungan dan bantuan kita yang murah hati"
 germany.103.a: "Kita harus memaksa mereka untuk melihat alasannya"
 germany.104.t: "Italia Menuntut Wilayah Vichy"
 germany.104.d_Savoy: "Pihak Italia mulai mengajukan tuntutan kepada Prancis Vichy dengan menunggangi kemenangan kita. Mereka menginginkan zona perbatasan Savoy demi memperkuat Italia. Namun, kitalah yang akan memutuskannya."
 germany.104.d_Corsica: "Pihak Italia menuntut Pulau Korsika dari Vichy sebagai bagian dari rampasan perang mereka. Apakah kita harus mengabulkannya?"
 germany.104.d_Savoy_Corsica: "Italia menuntut agar Vichy menyerahkan Savoy dan Korsika. Hal ini akan menguntungkan Italia, tetapi ini akan merisaukan otoritas kolonial Prancis."
 germany.104.a: "Saya kira mereka dapat memiliki Savoy"
 germany.104.b: "Korsika adalah satu-satunya nilai mereka"
 germany.104.c: "Biarkan mereka memiliki Savoy"
 germany.104.e: "Sekutu yang kuat akan menghasilkan Jerman yang kuat"
 germany.104.f: "Mereka membutuhkan lebih dari beberapa ribu orang yang tewas"
 germany.105.t: "Italia Meninggalkan [Root.GetFactionName]"
 germany.105.d: "Menyusul keputusan kita untuk tidak memberikan wilayah mana pun kepada Italia, mereka memilih untuk meninggalkan [Root.GetFactionName] dengan dalih bahwa kita bukan sekutu yang cukup berharga bagi mereka."
 germany.105.a: "Lagipula mereka tidak pernah banyak bertengkar"
 germany.106.t: "Perjanjian Craiova"
 germany.106_threat: "Perjanjian Craiova"
 germany.106.d_second_vienna_accepted_north: "Dengan perolehan Transilvania Utara oleh Hongaria, Bulgaria mengingatkan kita akan sengketa perbatasan lama mereka dengan Rumania atas Dobruja Selatan, yang direbut oleh Rumania pada tahun 1913."
 germany.106.d_second_vienna_accepted_all: "Dengan perolehan Transilvania oleh Hongaria, Bulgaria mengingatkan kita akan sengketa perbatasan lama mereka dengan Rumania atas Dobruja Selatan, yang direbut oleh Rumania pada tahun 1913."
 germany.106.d_no_vienna: "Karena hubungan dengan Hongaria mendingin, di mana mereka memilih bergabung dalam aliansi lain, rencana awal kita untuk memberi mereka sebagian dari Transilvania tidak mungkin dilakukan. Sebagai gantinya, kita sebaiknya mendengarkan sengketa wilayah Bulgaria atas Dobruja Selatan, yang direbut oleh Rumania pada tahun 1913."
 germany.106.a: "Biarkan mereka menuntut Dobrudja Selatan"
 germany.106.b: "Kita akan not back any Bulgarian demands"
 germany.107.t: "Penerbangan Rudolf Hess"
 germany.107.d: "Wakil Führer Rudolf Hess ditangkap oleh tentara Home Guard di Skotlandia kemarin setelah terjun payung dari pesawat tempur berat. Sebagai seorang pilot ulung, ia tampaknya terbang sendirian melintasi Laut Utara, berhati-hati agar tetap berada di luar jangkauan radar sebelum berbelok ke barat menuju Inggris.\nHess tampaknya berinisiatif sendiri untuk merundingkan perjanjian damai antara Inggris dan Jerman, meskipun Berlin telah mengecamnya sebagai orang gila dan ia telah dicopot dari semua jabatan politiknya. Pihak berwenang Inggris belum dapat dimintai keterangan."
 germany.107.a: "Wahnsinn!"
 germany.108.t: "Kematian Rudolf Hess"
 germany.108.d: "Wakil Führer Rudolf Hess tewas kemarin ketika Angkatan Udara Kerajaan mencegat pesawat tempur berat yang ia terbangkan di lepas pantai Skotlandia. Hakikat sebenarnya dari misinya masih belum jelas — kendati Hess adalah seorang pilot berpengalaman, ia terbang sendirian dan pesawatnya tampaknya tidak dipersenjatai.\nJasadnya ditemukan oleh pihak berwenang Inggris, tetapi pemakaman kenegaraan dengan peti kosong telah dijadwalkan di Berlin.\n\nHitler dilaporkan sangat terguncang atas kematian teman lamanya tersebut."
 germany.108.a: "Si bodoh yang malang itu."
 germany.109.d: "Kapal udara Hindenburg, yang ditambatkan di Jerman sejak awal permusuhan, menemui akhir yang dramatis hari ini ketika meledak di atas Skotlandia. Pesawat itu tampaknya dikomandoi oleh Wakil Führer Rudolf Hess, yang berhasil menerbangkannya sendirian melintasi Laut Utara dalam misi pribadi untuk merundingkan perdamaian dengan Inggris.\nStasiun radar Inggris tidak kesulitan mendeteksi pesawat raksasa tersebut, dan beberapa wing Angkatan Udara Kerajaan segera diarahkan menuju posisinya. Ketika Hindenburg gagal merespons melalui radio, mereka melepaskan tembakan.\n\nHess terjun payung dengan selamat, dan kini dipenjarakan di Menara London."
 germany.110.d: "Kapal udara Hindenburg, yang ditambatkan di Jerman sejak awal permusuhan, menemui akhir yang dramatis hari ini ketika meledak di atas Skotlandia. Pesawat itu tampaknya dikomandoi oleh Wakil Führer Rudolf Hess, yang berhasil menerbangkannya sendirian melintasi Laut Utara dalam misi pribadi untuk merundingkan perdamaian dengan Inggris.\nStasiun radar Inggris tidak kesulitan mendeteksi pesawat raksasa tersebut, dan beberapa wing Angkatan Udara Kerajaan segera diarahkan ke posisinya. Ketika Hindenburg gagal merespons melalui radio, mereka melepaskan tembakan.\n\nJasad Hess ditemukan di antara puing-puing reruntuhan."
 germany.110.a: "Orang gila itu..."
 germany.111.t: "Yugoslavia Menolak"
 germany.111.d: "Yugoslavia dengan bodohnya menolak tawaran kita untuk meredakan ketegangan di kawasan tersebut."
 germany.111.a: "Mereka telah memaksa tangan kita"
 germany.113.t: "Jerman Secara Resmi Meminta Danzig"
 germany.113.d: "Menganggap dukungan militer mereka sangat penting bagi keberhasilan apa pun di masa depan dalam perang saudara kita, [GER.GetNameDef] telah mengajukan rencana untuk menegakkan kendali [GER.GetAdjective] atas Danzig setelah pertempuran usai. Mereka juga menegaskan bahwa ketergantungan [Root.GetNameDef] pada dukungan militer mereka tidak memberi [Root.GetLeader] pilihan selain menandatangani 'Perjanjian Danzig' ini."
 germany.113.a: "[Root.GetName] harus melakukan satu pertempuran dalam satu waktu."
 germany.114.t: "Tuntutan Jerman atas Danzig"
 germany.114.d: "Menyusul kemenangan kita dalam perang saudara [Root.GetAdjective], Jerman berulang kali mengingatkan kita akan permintaan mereka atas Danzig. Mereka juga mengingatkan kita akan akibat dari pembangkangan bagi suatu bangsa yang masih memulihkan diri dari konflik internal."
 germany.114.a: "Mereka akan mendapatkan Danzig, sesuai kesepakatan."
 germany.114.b: "Kita akan never cede Polish land!"
 germany.115.t: "Polandia Menyerahkan Danzig"
 germany.115.d: "Sesuai dengan perjanjian Danzig, [GER.GetNameDef] telah menyetujui pemindahan Danzig ke bawah kendali [GER.GetNameDef]."
 germany.115.a: "Hal ini terbukti merupakan kemitraan yang bermanfaat."
 germany.116.t: "Polandia Mengingkari Perjanjian Danzig"
 germany.116.d: "Mengabaikan dukungan tak ternilai yang kita berikan kepada mereka dalam perang saudara mereka, [From.GetName] telah memutuskan untuk mengabaikan klaim kita atas Danzig."
 germany.116.a: "Tidak menghormati perjanjian kita akan sangat merugikan mereka."
 germany.116.b: "Kita tidak bisa menanggung konflik ini."
 germany.117.t: "Perjanjian Danzig"
 germany.117.d: "[From.GetName] telah menyetujui permintaan kita atas Danzig sebagai imbalan atas dukungan dalam perang saudara mereka. Permintaan dan janji kita telah diresmikan dalam Perjanjian Danzig. Sekarang kita harus memastikan bahwa [From.GetName] keluar sebagai pemenang dari konflik mereka."
 germany.117.a: "Ini juga perjuangan [Root.GetAdjective]."
 germany.118.t: "Konferensi Yalta"
 germany.118.d: "Dengan perang di Eropa yang berlangsung cepat, saatnya bagi pihak pemenang yang tak terelakkan untuk mempertimbangkan masa depan Eropa.\n\nKita dapat mengusulkan kepada [yalta_partner.GetNameDef] sebuah konferensi mengenai pembagian [GER.GetNameDef] setelah perang, untuk menggariskan lingkup pengaruh kita di benua itu.\n\n'Sekutu' kita di [yalta_partner.GetNameDef] telah mengindikasikan bahwa mereka tertarik dengan konferensi semacam itu. Tak diragukan lagi, mereka menginginkan semacam imbalan atas pengorbanan mereka."
 germany.118.a: "Kita memerlukan konferensi tentang masa depan Eropa."
 germany.118.b: "Kami tidak dapat bekerja sama dengan [yalta_partner.GetNameDef]."
 yalta_division_tt: "Negara bagian berikut akan ditetapkan sebagai wilayah kepentingan gabungan:\n§Y[42.GetName]§!, §Y[978.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!.\n\nNegara bagian berikut akan berada di [SOU.GetAdjective] bidang minat:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!.\n\n[POL.GetAdjective] klaim ke negara bagian berikut akan diakui oleh semua pihak:§Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!."
 germany.118.c: "Kita harus mengikuti Rencana Morgenthau."
 morgenthau_division_tt: "[FRA.GetFlag] [FRA.GetNameDefCap] menerima §Y[42.GetName]§!\n[POL.GetFlag] Polandia menerima §Y[67.GetName]§! dan §Y[5.GetName]§!.\n[SOV.GetFlag] [SOV.GetNameDefCap] menerima §Y[763.GetName]§!\nZona internasional, di bawah [ENG.GetFlag] [ENG.GetAdjective] administrasi akan dibentuk di: §Y[51.GetName]§!, §Y[52.GetName]§!, dan §Y[56.GetName]§!.\nNegara bagian Jerman Utara yang merdeka [GER.GetFlag], di zona pengaruh [yalta_partner.GetAdjective], akan didirikan di §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§!, dan §Y[60.GetName]§!.\nNegara bagian Jerman Selatan yang merdeka [GER.GetFlag] akan dibentuk di §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[978.GetName]§!, §Y[52.GetName]§!, dan §Y[53.GetName]§!."
 germany.118.e: "Churchill punya ide ini..."
 churchill_plan_germany_tt: "Jerman akan dipecah menjadi tiga negara. Negara Jerman Barat, Negara Bagian, Negara Bagian Jerman Utara, dan Negara Bagian Jerman Selatan, yang juga merupakan bagian dari Kekaisaran Austro-Hungaria. Semua negara ini akan berada dalam Lingkungan Pengaruh Sekutu, sedangkan wilayah Eropa Tengah dan Timur lainnya akan berada dalam Lingkungan Pengaruh [yalta_partner.GetAdjective]."
 germany.119.t: "Konferensi Yalta"
 germany.119.d: "Dengan perang melawan [GER.GetNameDef] yang kian mendekati akhir yang tak terelakkan, [yalta_origin.GetNameDef] telah menghubungi kita mengenai sebuah konferensi tentang masa depan Eropa.\n\nMereka mengusulkan pembagian [GER.GetNameDef] antara timur dan barat. Hal ini akan memungkinkan lingkup pengaruh kita meluas jauh ke dalam Eropa, yang akan menebus sebagian dari kerugian yang kita derita dalam perjuangan yang mengerikan ini."
 germany.119.a: "Demi kerjasama yang langgeng."
 germany.119.b: "Kami akan mendikte perdamaian kami sendiri."
 germany.1190.t: "Konferensi Toronto"
 germany.1190.desc: "Dengan perang melawan [GER.GetNameDef] yang bergerak menuju akhir yang tak terelakkan, [yalta_origin.GetNameDef] telah mendekati kita mengenai sebuah konferensi tentang masa depan Eropa.\n\nMereka mengusulkan pembagian tiga arah atas [GER.GetNameDef] di mana kita akan mendapatkan pengaruh terbatas atas kawasan Timur. Kawasan industri utama akan berada di bawah kendali sekutu, dan pihak sekutu juga akan memiliki kendali terbatas atas wilayah Selatan. Hal ini akan mengurangi kekuatan Jerman, namun pengaruh kita atas Eropa tengah akan tetap tidak menentu."
 germany.120.t: "[yalta_partner.GetNameDefCap] Menolak untuk Berpartisipasi"
 germany.120.d: "Usulan konferensi kita mengenai masa depan Eropa telah kandas.\n\nBerbicara tanpa ragu-ragu, [yalta_partner.GetLeader] menolak segala kebutuhan akan perencanaan dan kerja sama di Eropa pascaperang.\n\n'Kita akan bertemu saat saya mengajukan tuntutan saya terhadap [GER.GetNameDef] di meja perundingan damai. Saya tidak akan membiarkan manuver politik picik merintangi jalan [yalta_partner.GetNameDef].'"
 germany.120.a: "Ini mengkhawatirkan."
 germany.121.t: "Pembagian Jerman"
 germany.121.d: "Sebagaimana ditetapkan dalam perjanjian Yalta, Jerman akan dibagi menjadi dua negara terpisah, masing-masing berada di bawah lingkup pengaruh salah satu pihak yang berperang.\n\nSemoga ini membawa akhir bagi konflik di Eropa."
 germany.121.a: "Untuk Jerman..."
 germany.122.t: "[From.GetNameDefCap] Menuntut Sudetenland"
 germany.122.d: "Di tengah situasi yang terus berkembang, Jerman telah menuntut wilayah Sudetenland dari kita, demi 'melindungi populasi Jerman' di wilayah tersebut.\n\nDengan situasi saat ini, mereka telah menegaskan bahwa ini adalah batas akhir. Tidak akan ada perundingan atau diplomasi. Mereka akan merebut Sudetenland, atau mereka akan berperang demi itu."
 germany.122.desc_cze_subject_of_ger: "Pemimpin [FROM.GetAdjective], [FROM.GetLeader], telah menuntut wilayah Sudetenland dari kita, demi 'melindungi populasi Jerman' di wilayah tersebut.\n\nMengingat keadaan, dan ketatnya kendali yang diberlakukan [FROM.GetNameDef] atas negara kita, tidak ada yang dapat kita lakukan untuk menghentikan mereka. Mereka akan menguasai Sudetenland, dan kita harus berdamai dengan kenyataan pahit ini."
 germany.122.a: "Mereka bisa berperang, jika mereka berani!"
 germany.122.b: "Kami tidak mampu berperang dengan [From.GetNameDef]."
 germany.122.c: "Kita harus mematuhi tuntutan [FROM.GetLeader]."
 germany.123.t: "[From.GetNameDefCap] Menolak Menyerahkan Sudetenland kepada Kita"
 germany.123.d: "Dalam langkah diplomatik yang bodoh, [From.GetLeader], pemimpin [From.GetAdjective] telah menolak semua tuntutan [ROOT.GetAdjective]!\n\nMereka tidak akan menyerahkan Sudetenland, dan secara terang-terangan menantang kita untuk menyatakan perang, mencemooh keinginan kita untuk melindungi saudara-saudari [ROOT.GetAdjective] kita."
 germany.123.a: "Jadilah itu!"
 germany.124.t: "[From.GetNameDefCap] Menyerahkan Sudetenland"
 germany.124.d: "Menghadapi prospek perang dengan kita, [From.GetNameDef] telah setuju untuk menyerahkan seluruh kendali atas Sudetenland, dan melepaskan klaim apa pun di masa depan atas wilayah tersebut.\n\nPopulasi [ROOT.GetAdjective] di Sudetenland akhirnya akan aman berada di dalam naungan [ROOT.GetNameDef]."
 germany.124.desc_cze_subject_of_ger: "Pemerintah [From.GetAdjective] tidak punya pilihan selain setuju untuk menyerahkan seluruh kendali atas Sudetenland, melepaskan klaim apa pun di masa depan atas kawasan tersebut.\n\nPopulasi [ROOT.GetAdjective] di Sudetenland akhirnya akan aman berada di dalam naungan [ROOT.GetNameDef]."
 germany.124.a: "Untuk [ROOT.GetNameDef] dan semua [ROOT.GetAdjective]!"
 germany.125.t: "[FROM.GetNameDefCap] Menyerahkan Sudetenland kepada [GER.GetNameDef]"
 germany.125.d: "Tuan [FROM.GetAdjective] kita telah memutuskan untuk menyerahkan Sudetenland kepada [GER.GetNameDef]. Mereka mengklaim bahwa tindakan tersebut diambil sebagai langkah demi menjaga perdamaian di kawasan dan bahwa tindakan lain akan menyebabkan nasib yang jauh lebih buruk menimpa kita. Kita tidak diajak berkonsultasi mengenai hal ini dan sekarang hanya bisa menyaksikan ketika wilayah sah kita direnggut dari kita."
 germany.125.a: "Kami akan menanganinya secara berbeda jika itu terserah kami."
 germany.126.t: "Anschluss atau Kehancuran"
 germany.126.warning: "§RDapat menyebabkan perang§!"
 germany.126.d: "Kerusuhan sipil dan tindakan kekerasan pecah ketika para pengunjuk rasa menyuarakan keinginan mereka agar Austria bergabung dengan Jerman. Perjuangan internal yang dialami negara kita hanya menambah suara orang-orang yang menginginkan persatuan dengan Jerman. Berlin sedang berusaha keras untuk mendapatkan Anschluss dan ini mungkin satu-satunya kesempatan kita untuk menjaga sebagian dari nilai-nilai Austria yang sebenarnya tetap hidup."
 germany.126.a: "Kami akan bergabung dengan Reich Jerman!"
 germany.126.b: "Tidak, nasib Austria ada di tempat lain."
 germany.127.t: "Meresmikan Aliansi"
 germany.127.d: "Bersatu dalam pertempuran kita melawan [SOV.GetNameDef], barangkali saatnya telah tiba untuk meresmikan aliansi dan mengundang mitra baru kita dalam perang anti-komunis ini ke faksi kita."
 germany.127.a: "Kami akan mengirim utusan."
 germany.127.b: "Kami tidak akan memiliki kewajiban lebih lanjut terhadap mereka."
 germany.128.t: "Pakta Anti-Soviet"
 germany.128.d: "[From.GetNameDefCap] telah menawarkan diri untuk menyambut kita ke faksi mereka, sehingga kita dapat berkoordinasi lebih baik melawan ancaman komunis. Utusan untuk meresmikan aliansi ini telah tiba di ibu kota."
 germany.128.a: "Ini adalah inisiatif yang bagus."
 germany.128.b: "Nasib kita terletak pada orang lain."
 germany.200.t: "Jerman yang Baru"
 germany.200.desc: "Jerman tidak lagi menimbulkan ancaman seperti dahulu, sebaliknya [SOV.GetNameDef]-lah yang mengancam akan merusak tatanan dunia. Jerman yang kuat dan demokratis bisa menjadi sekutu yang sangat berguna dalam perjuangan ini. Mengizinkan Jerman bangkit kembali juga dapat memberikan keuntungan perdagangan yang kuat bagi kita dan mereka. Mungkin saatnya tepat untuk mengakhiri pendudukan dan meletakkan dasar bagi dunia demokratis yang kuat dan bersatu."
 germany.200.a: "Mari kita luncurkan rencana ini"
 germany.200.b: "Tidak, itu terlalu berisiko"
 germany.201.t: "[FROM.GetName] Ingin Menyatukan Kembali Jerman"
 germany.201.desc: "[FROM.GetName] telah memutuskan untuk mengakhiri pendudukan mereka atas Jerman, dan memberi bangsa Jerman pemerintahan sendiri sebagai sebuah republik baru bernama [WGR.GetNameDef]. Mereka mengklaim hal ini demi menciptakan benteng pertahanan melawan komunisme, berargumen bahwa Jerman yang demokratis dan kuat adalah perlindungan yang lebih baik terhadap penyebaran komunisme daripada negara yang lemah dan terpecah-belah.\nKita telah diminta untuk mendukung langkah ini dengan menggabungkan wilayah Jerman kita dengan [WGR.GetName] yang baru dibentuk. Dukungan rakyat untuk hal ini sangat kuat."
 germany.201.a: "Tentu saja ada kelebihannya"
 germany.201.b: "Tidak, waktunya bukan sekarang"
 germany.202.t: "Jerman yang Baru"
 germany.202.desc: "[FROM.GetName] membiarkan wilayah Jerman mereka digabungkan ke dalam apa yang disebut sebagai [WGR.GetName]. Hal ini memicu banyak orang di zona Jerman kita menyerukan penyatuan kembali dengan Jerman yang merdeka juga."
 germany.202.a: "Mari kita ciptakan Jerman yang merdeka"
 germany.202.b: "Tidak ada gunanya mempertahankannya"
 THREAT_FROM_EFFECT: "Ancaman dari tindakan"
 war_justification.1.t: "[ROOT.GetLeader] Mengecam [From.GetName]"
 war_justification.1.d: "'Apakah [From.GetName] milik bangsa [From.GetAdjective]? Mari kita tanyakan pertanyaan yang lebih mendasar: Apakah masa depan milik [From.GetAdjective] ataukah milik [ROOT.GetNameDef]?'\n\nPidato [ROOT.GetLeader] hari ini mengisyaratkan bahwa [ROOT.GetName] berada di jalur menuju perang. Ketegangan politik telah memuncak selama sebulan terakhir dan tampaknya rakyat [ROOT.GetAdjective] mulai menerima bahwa perang tidak dapat dihindari."
 war_justification.1.a: "Masa depan adalah milik [ROOT.GetName]!"
 war_justification.2.t: "[ROOT.GetLeader] Mencela Cita-Cita [From.GetAdjective]"
 war_justification.2.d: "'Bangsa [From.GetAdjective] mengklaim memiliki kebebasan dan demokrasi, mengklaim menginginkan perdamaian, namun semua hal yang mereka banggakan itu hampa. Demokrasi mereka memecah belah rakyat di saat mereka seharusnya bersatu, dan kebebasan mereka hanyalah cerminan dari kurangnya disiplin. Kita bangsa [ROOT.GetAdjective] melihat kebohongan-kebohongan ini... dan kita dapat melihat bahwa perdamaian ini, perdamaian berdasarkan syarat mereka, juga merupakan sebuah dusta.'\n\n[ROOT.GetRulingParty] telah lama mencemooh kelemahan bangsa [From.GetAdjective], namun akhir-akhir ini retorikanya semakin agresif. Hari pecahnya konflik bersenjata semakin dekat."
 war_justification.2.a: "[ROOT.GetName] bersatu di bawah [ROOT.GetLeader]."
 war_justification.3.t: "[ROOT.GetLeader] Memperingatkan Bahaya Komunisme [From.GetAdjective]"
 war_justification.3.d: "'Adakah ancaman yang lebih besar bagi jalan hidup kita, atau bahkan bagi jalan hidup itu sendiri, selain komunisme? Wabah yang mengancam untuk menobatkan budak, bukannya tuan, menjadi penguasa setiap bangsa, meruntuhkan bangsa itu sendiri, memusnahkan manusia dan sejarah mereka. Kita akan merebut [From.GetName] dan memusnahkan wabah komunis tersebut.'\n\nKebencian [ROOT.GetLeader] terhadap kaum komunis telah lama dikenal bahkan sebelum naiknya [ROOT.GetRulingParty] ke tampuk kekuasaan, namun tampaknya kebencian itu semakin menghebat baru-baru ini dalam kasus pemerintah [From.GetAdjective]. Upaya kita untuk memusnahkan Marxisme dari muka bumi mungkin akan bermula dari sana."
 war_justification.3.a: "Mereka yang menolak suatu bangsa akan menyaksikan kehancuran bangsanya sendiri."
 war_justification.4.t: "[ROOT.GetName] Bersiap untuk Perjuangan Akbar"
 war_justification.4.d: "'Bangsa [From.GetAdjective] adalah bangsa yang tidak akan menyerahkan kekuasaannya dengan mudah. Namun, mereka juga harus menyadari bahwa persimpangan jalan kedua bangsa kita hanya dapat berujung pada benturan. Kita harus membulatkan tekad untuk perjuangan yang akan datang. Karena [From.GetName] tidak akan bisa direbut tanpa pertempuran.'\n\nKemungkinan tercapainya kesepahaman antara pemerintah [From.GetName] dan [ROOT.GetName] yang berpikiran serupa kini telah beralih menjadi kampanye untuk merebut wilayah mereka dengan kekuatan militer."
 war_justification.4.a: "Sejarah akan ditulis melalui kemenangan kita."
 war_justification.5.t: "[ROOT.GetLeader] Membawa Revolusi ke [From.GetName]"
 war_justification.5.d: "'Meskipun kita telah mengkonsolidasikan masyarakat sosialis di [ROOT.GetName], masih banyak negara yang menderita di bawah pemerintahan lalim di masa lalu. Para pekerja di [From.GetName] tidak punya suara, tidak punya sarana untuk berorganisasi, dan segala upaya untuk melembagakan sosialisme akan dihancurkan dengan kejam oleh rezim [From.GetLeader]. Kita tidak bisa menunggu sampai roda revolusi internasional berputar untuk rakyat [From.GetAdjective]. Dengan revolusi kami telah membuktikan bahwa kami dapat menghancurkan para penindas kapitalis di sini, dan kami akan menghancurkan para penindas di [From.Capital.GetName] juga!'\n\n[ROOT.GetLeader] telah meninggalkan semua upaya retorika diplomatik terhadap [From.GetName] yang dikuasai [From.GetRulingParty]. Upaya untuk menghapuskan semua perbatasan kini hanya terfokus pada penghapusan perbatasan mereka."
 war_justification.5.a: "[From.GetAdjective] pekerja, pembebasanmu sudah dekat!"
 war_justification.6.t: "[ROOT.GetLeader] Menyerukan Bantuan bagi Kaum Buruh [From.GetAdjective]"
 war_justification.6.d: "'Apakah ada kebohongan yang lebih besar daripada apa yang dianggap sebagai kebebasan orang [From.GetAdjective]? Dulunya mereka menjadi budak di bawah pemerintahan pangeran dan adipati yang mengklaim kepemilikan tanah, namun kini mereka terpaksa menjual tenaga kerja mereka kepada pihak yang mengklaim kepemilikan pabrik. Kebebasan mereka untuk memilih salah satu majikan dibandingkan majikan lainnya hampir tidak bisa disebut kebebasan. Kebebasan mereka untuk memilih pemimpin juga merupakan pilihan yang salah, karena propaganda tidak akan membiarkan kaum sosialis sejati mengambil alih kekuasaan. Masyarakat yang diindoktrinasi secara menyeluruh hanya dapat diselamatkan melalui intervensi [ROOT.GetAdjective].'\n\n[ROOT.GetLeader] telah lama berpolemik melawan pemerintah pada [From.GetName] dalam rapat-rapat partai, namun retorika ini kini lebih sering digunakan di depan umum. Tidak ada alasan untuk percaya bahwa konflik ini dapat diselesaikan secara damai."
 war_justification.6.a: "Kita akan crush their bourgeois dictatorship!"
 war_justification.7.t: "Komunisme [From.GetAdjective] Menuju Kegagalan"
 war_justification.7.d: "\"Kawan-kawan, meskipun kaum revolusioner terhebat pernah disebut sebagai pengkhianat, sudah jelas terlihat bahwa revolusi itu sendiri telah dikhianati. Bagaimana lagi Anda menjelaskan aturan [From.GetRulingParty] dari [From.GetName], yang telah mengesampingkan setiap petunjuk ide-ide Marxis untuk membangun negara pekerja yang merosot di mana mereka dapat berkuasa di bawah premis-premis yang salah? Dengan memperkuat kekuatan mereka sendiri dengan mengorbankan revolusi internasional, mereka telah menunjukkan bahwa mereka tidak terlalu peduli terhadap cita-cita yang mereka yakini. Kita harus membawa revolusi yang sebenarnya kepada mereka.'\n\nMeskipun pada awalnya mendukung revolusi [From.GetAdjective], [ROOT.GetLeader] semakin menyatakan kekecewaannya terhadap perkembangan revolusi tersebut. [ROOT.GetRulingParty] mungkin harus melakukan intervensi sebelum terlambat."
 war_justification.7.a: "Masih ada waktu untuk menyelamatkan upaya mereka menuju sosialisme."
 war_justification.8.t: "[ROOT.GetLeader] Menyerukan Penghancuran Nasionalisme [From.GetAdjective]"
 war_justification.8.d: "'Adakah tatanan masyarakat yang lebih menjijikkan bagi masa depan revolusi, adakah yang lebih asing bagi nasib kaum buruh, selain rezim fasis [From.GetName]? Menyerukan rakyat untuk mengabdi secara fanatik pada institusi bobrok bernama negara-bangsa, mereka mendandani kebiadaban purba dalam busana modern, berupaya menampilkan diri sebagai alternatif masa depan dari kemenangan internasional kaum buruh yang tak terelakkan. Tinggal menunggu waktu sampai mereka menyerang kita atau sekutu kita. Mari kita pukul terlebih dahulu.'\n\nTidak ada yang mengharapkan selain kebencian timbal balik antara kita dan pihak [From.GetAdjective], namun permusuhan tersebut kian meruncing belakangan ini. Kini tampak jelas bahwa benturan akan segera terjadi dalam waktu dekat."
 war_justification.8.a: "Kematian bagi kaum fasis!"
 war_justification.9.t: "Diplomasi dengan [From.GetName] Menemui Jalan Buntu"
 war_justification.9.d: "'Meskipun kami berupaya untuk menemukan solusi diplomatis terhadap konflik kami dengan [From.GetName], negosiasi sekali lagi gagal, sehingga pilihan kami terbatas. Rezim otoriter [From.GetLeader] telah menunjukkan pendekatan yang tidak masuk akal terhadap masalah ini, tipikal pemimpin yang tidak bertanggung jawab kepada rakyatnya. Jika tidak ada perubahan menyeluruh dalam kebijakan kepemimpinan [From.GetAdjective], maka kita tidak punya pilihan selain berjuang.'\n\n[ROOT.GetAdjective] intervensi di [From.GetName] telah menjadi isu hangat, dengan beberapa politisi di oposisi mengklaim bahwa [ROOT.GetRulingParty] telah menjalankan kebijakan yang agresif sejak awal. Apa pun niat awal mereka, perang di masa depan kini tiba-tiba tampak sangat nyata dan tak terelakkan."
 war_justification.9.a: "Terkadang, Anda perlu mendaki gunung konflik."
 war_justification.10.t: "[ROOT.GetLeader] Menyerukan Intervensi di [From.GetName]"
 war_justification.10.d: "'Dengan berat hati kita harus menghadapi kenyataan pahit dari situasi kita: Invasi ke [From.GetName] mungkin menjadi satu-satunya jalan keluar. Keuntungan strategisnya terlalu besar untuk mengupayakan solusi lain dalam situasi kita saat ini. Kendati kita percaya bahwa baik rakyat [ROOT.GetAdjective] maupun [From.GetAdjective] tidak menginginkan perang, namun sejarah telah membawa kita ke titik ini dan pilihan kita sangat terbatas. Kita hanya bisa berharap bahwa melalui penegasan kekuatan militer kita ini, kita dapat mencegah pertumpahan darah yang lebih besar di masa depan.'\n\nMeskipun ada teori populer bahwa negara demokrasi tidak akan saling berperang, perkembangan terkini mengarah pada invasi [ROOT.GetAdjective] ke [From.GetName] di masa mendatang. Sejarah mungkin masih menyimpan kejutan bagi kita."
 war_justification.10.a: "[From.GetName] adalah demokrasi yang meragukan."
 war_justification.11.t: "[ROOT.GetLeader] Bersuara Melawan Bahaya Merah"
 war_justification.11.d: "'Tidak diragukan lagi, [From.GetName] komunisme adalah salah satu ancaman terbesar terhadap kebebasan dan ketertiban di era ini. Tanpa kenal lelah dan kejam, hal ini mengancam tidak hanya menghancurkan harapan masyarakat [From.GetAdjective] akan masyarakat yang sejahtera dan demokratis, namun juga harapan negara-negara tetangganya. Jika kita tidak bertindak sekarang, kita mungkin akan terlambat melihat domino pertama ini jatuh, sehingga akan mengakibatkan lebih banyak eksperimen sosial yang gagal. Berapa banyak lagi yang perlu mati sebelum kita melakukan intervensi?'\n\nAncaman aktivitas subversif yang merusak demokrasi kita, yang dipicu oleh ambisi [From.GetAdjective], telah menjadi topik perdebatan hangat akhir-akhir ini. Meskipun perwakilan oposisi menyebut hal ini sebagai Ketakutan Merah yang bertujuan untuk melancarkan perang dengan [From.GetName], retorika [ROOT.GetRulingParty] sejauh ini sangat berhasil."
 war_justification.11.a: "Mereka mengikuti ideologi kekerasan, reaksi apa yang bisa mereka harapkan selain kekerasan?"
 war_justification.12.t: "[ROOT.GetLeader] Menghadapi Fasisme [From.GetAdjective]"
 war_justification.12.d: "'Dalam sejarah modern, bahkan mungkin dalam sejarah secara keseluruhan, tidak ada tirani yang lebih buruk daripada cengkeraman besi di mana [From.GetRulingParty] kini memegang [From.GetName]. Orang-orang mungkin berpendapat bahwa kita tidak boleh memprovokasi konflik, bahwa kita harus percaya [From.GetLeader] untuk menghormati perjanjian dan janji di masa depan, namun orang-orang ini gagal untuk melihat bahwa perjanjian yang dibuat di bawah pemerintahan fasisme tidak ada gunanya. Bagi para pembohong yang tidak terhormat ini, kekuatan akan membuat kebenaran, dan kertas yang menjadi dasar perjanjian tertulis akan mudah terbakar seperti buku-buku para pencela mereka.'\n\nOrang-orang yang telah lama berharap untuk menghindari konfrontasi langsung dengan [From.GetName] kini ditentang keras oleh [ROOT.GetLeader], yang berpendapat bahwa kita dalam istilah Machiavellian hanya menunda perang demi keuntungan musuh. Kalau terus begini, kita mungkin akan melakukan serangan pertama."
 war_justification.12.a: "Tidak akan ada kedamaian di zaman kita sampai hal-hal tersebut hilang."
 war_justification.13.t: "[ROOT.GetLeader] Menyerukan Perang Melawan [From.GetName]"
 war_justification.13.d: "'Meskipun kita mungkin bangsa yang cinta damai, sifat alamiah kita semata tidak menentukan jalannya sejarah yang harus kita tempuh. Ini adalah zaman perang. Sudah terlalu lama pihak [From.GetAdjective] menguasai sarana yang kita butuhkan untuk melewati cobaan yang ada di hadapan kita, dan jelas bahwa mereka tidak akan melepaskannya secara damai. Terlepas dari upaya terbaik kita membangun negara modern, beberapa perkara hanya dapat diselesaikan melalui pembuktian di medan laga.'\n\nRetorika permusuhan [ROOT.GetLeader] terhadap [From.GetName] telah mengerahkan segala upaya untuk menjustifikasi invasi. Sebagian masyarakat mendukung langkah ini, namun keputusan akhir berada di tangan pemimpin kita."
 war_justification.13.a: "Ini mungkin keputusan yang sulit, tapi kita harus mendukungnya."
 war_justification.14.t: "[ROOT.GetLeader] Menantang Kepongahan [From.GetAdjective]"
 war_justification.14.d: "'[From.GetName] mungkin menganggap diri mereka lebih modern dan maju dibandingkan kita, namun faktanya bangsa mereka belum teruji seperti bangsa kita, dan mereka juga belum siap menghadapi ancaman yang akan segera terlihat. Dengan sikap meremehkan mereka terhadap kami, dan menghalangi kami untuk merampas apa yang menjadi hak kami, mereka telah menjadikan kami salah satu ancaman terhadap diri mereka sendiri. Bangsa mereka yang lemah dan terpecah belah tidak akan bisa menolak klaim kami.'\n\nPendapat yang mengejek [From.GetName] yang telah lama dianut oleh [ROOT.GetRulingParty] telah berkembang dari kritik menjadi permusuhan. Meskipun pendapat umum menyatakan bahwa masyarakat [From.GetAdjective] ingin menghindari perang, [ROOT.GetLeader] mengklaim bahwa pemimpin terpilih mereka telah memprovokasi hal tersebut melalui kesombongan mereka."
 war_justification.14.a: "Mereka tidak tahu betapa kuatnya penderitaan yang kita alami."
 war_justification.15.t: "[ROOT.GetLeader] Ingin Memulihkan Ketertiban di [From.GetName]"
 war_justification.15.d: "'Semangat kebangsaan [ROOT.GetAdjective] memang kuat, namun tidak semua bangsa seberuntung itu. [From.GetName] tradisinya telah dihancurkan dan para penguasa yang sah telah lama dibunuh dan dikuburkan, semuanya atas nama gagasan revolusi besar Marxis. Adalah tugas kita untuk memulihkan ketertiban di dunia yang disesatkan oleh perampas kekuasaan yang haus darah dan menegaskan kekuatan [ROOT.GetName] melawan ancaman ini.'\n\nSementara [ROOT.GetRulingParty] selalu menentang komunisme, [From.GetName] telah menjadi sasaran serangan tertentu dalam pidato-pidatonya baru-baru ini. Terlepas dari apakah serangan komunis terhadap negara [ROOT.GetAdjective] merupakan ancaman nyata atau tidak, serangan pendahuluan terhadap komunisme [From.GetAdjective] sudah mulai dilakukan."
 war_justification.15.a: "Mereka yang terbunuh dalam revolusi akan dibalaskan!"
 war_justification.16.t: "[ROOT.GetLeader] Memanggil [From.GetAdjective] Penindas"
 war_justification.16.d: "'Lawan saya ingin Anda percaya bahwa peraturan saya seperti [From.GetRulingParty] di [From.GetName]. Mereka sangat salah. Meskipun keberhasilan [From.GetLeader] adalah hasil dari tren yang terjadi baru-baru ini, sebuah gerakan massa destruktif yang bertekad menindas negara-negara lain agar tunduk, [ROOT.GetRulingParty] menentang gerakan tersebut sebagai pihak yang tidak mau tunduk. Saya siap melakukan apapun yang diperlukan untuk menghilangkan ancaman ini, bahkan jika itu berarti perang.'\n\nRezim [ROOT.GetLeader] telah mengambil kebijakan yang bermusuhan terhadap negara [From.GetAdjective]. Apa pun sebutan para pemimpin kita, fasis adalah kata yang ditujukan kepada musuh-musuh kita."
 war_justification.16.a: "Tradisi dan pragmatisme akan selalu menang atas fanatisme dan teror."
 war_justification.17.t: "[ROOT.GetLeader] Mempertanyakan Kedaulatan [From.GetAdjective]"
 war_justification.17.d: "'Siapa yang menentukan perbatasan suatu bangsa dan bagaimana perbatasan itu ditentukan? Cara apa pun yang mungkin pernah ditemukan orang di masa lalu untuk membenarkan di mana [ROOT.GetName] berakhir dan [From.GetName] bermula, kita hidup di era baru. Arti penting strategis dari perbatasan ini tidak dapat dilebih-lebihkan, dan kita sepenuhnya berhak untuk menggesernya demi menjamin keselamatan berkesinambungan bagi rakyat kita.'\n\nMendengar pidato-pidato terkini [ROOT.GetLeader], invasi ke [From.GetName] tampaknya sudah di depan mata. Suara-suara penentang sempat melontarkan keberatan, namun dukungan publik terhadap perang kian meningkat."
 war_justification.17.a: "Kita harus rally behind this cause!"
 war_justification.18.t: "[ROOT.GetLeader] Mempertanyakan Niat [From.GetName]"
 war_justification.18.d: "'Tidak diragukan lagi bahwa [From.GetName] sedang bersiap untuk perang. Perubahan dalam kebijakan ekonomi memperjelas bahwa bangsa [From.GetAdjective] bukanlah bangsa yang cinta damai, melainkan sedang menunggu saat yang tepat untuk menyerang kita. Apakah kita akan berpangku tangan dan menyaksikan mereka mempersenjatai diri sementara [ROOT.GetName] tanpa pertahanan? Ataukah kita akan melucuti ancaman ini sebelum kekuatannya melampaui kemampuan kita?'\n\nKalangan garis keras di [ROOT.GetRulingParty] telah mengarahkan pandangan mereka ke [From.GetName], berargumen bahwa menyerang adalah pertahanan terbaik. Pandangan mereka semakin mendapat dukungan dan [ROOT.GetName] bersiap untuk perang."
 war_justification.18.a: "Setidaknya melalui perang, konflik ini akan berakhir."
 war_justification.19.t: "[ROOT.GetLeader] Geram atas Manuver [From.GetAdjective]"
 war_justification.19.d: "'Warga negara [ROOT.GetName] yang naif dan membayangkan bangsa [From.GetAdjective] sebagai bangsa yang cinta damai benar-benar kehilangan kontak dengan kenyataan. Mereka yang tinggal di perbatasan kita tidak memiliki kemewahan untuk berkhayal seperti itu, melihat pasukan mereka mendekati kita tepat di seberang sana. Ini adalah ancaman yang tidak bisa kita biarkan tanpa balasan. Setiap hari yang berlalu, [From.GetName] bersiap untuk perang. Sungguh gila jika kita tidak melakukan hal yang sama.'\n\nKehadiran militer [From.GetAdjective] di dekat wilayah kita telah memicu kekhawatiran yang kian mendalam seiring bangsa ini tampak semakin jelas menjadi musuh [ROOT.GetRulingParty]. Apakah hal ini merupakan sebab atau akibat dari polemik mereka masih menjadi perdebatan."
 war_justification.19.a: "Apapun yang terjadi, kita harus mempersiapkan rakyat untuk berperang."
 war_justification.20.t: "[ROOT.GetLeader] Menganjurkan Invasi ke [From.GetName]"
 war_justification.20.d: "'Jika kita ingin mendapatkan keuntungan strategis di masa mendatang, apalagi perang yang tak terhindarkan dengan [From.GetName], tidak ada ruang untuk ragu. Ini tentang menjaga masa depan anak-anak kita dan memastikan bahwa [ROOT.GetName] mendapat tempat di dunia besok. Ini adalah masalah pengabdian pada tujuan kita dan cita-cita yang kita anggap remeh. Saatnya bertindak.'\n\nSerangkaian pidato yang menggugah dari para pemimpin [ROOT.GetRulingParty], yang paling menonjol adalah [ROOT.GetLeader], telah menyerukan masyarakat untuk mendukung invasi [From.GetName]. Motif geopolitik di balik invasi tersebut kurang menonjol dalam retorika sentimen patriotik, namun kampanye ini nampaknya sangat efisien dalam meyakinkan masyarakat akan pentingnya hal tersebut."
 war_justification.20.a: "Negara ini mendukung keputusan penting ini."
 war_justification.201.t: "[From.GetLeader] Mengecam [ROOT.GetName]"
 war_justification.201.d: "'Apakah [ROOT.GetName] milik bangsa [ROOT.GetAdjective]? Mari kita tanyakan pertanyaan yang lebih mendasar: Apakah masa depan milik [ROOT.GetAdjective] ataukah milik [From.GetName]?'\n\nPidato [From.GetLeader] hari ini mengisyaratkan bahwa [From.GetName] berada di jalur menuju perang. Ketegangan politik telah memuncak selama sebulan terakhir dan tampaknya rakyat [From.GetAdjective] mulai menerima bahwa perang tidak dapat dihindari. [ROOT.GetName] juga harus bersiap."
 war_justification.201.a: "Mengapa kita tidak dibiarkan hidup damai?"
 war_justification.202.t: "[From.GetLeader] Mencela Cita-Cita [ROOT.GetAdjective]"
 war_justification.202.d: "'Bangsa [ROOT.GetAdjective] mengklaim memiliki kebebasan dan demokrasi, mengklaim menginginkan perdamaian, namun semua hal yang mereka banggakan itu hampa. Demokrasi mereka memecah belah rakyat di saat mereka seharusnya bersatu, dan kebebasan mereka hanyalah cerminan dari kurangnya disiplin. Kita bangsa [From.GetAdjective] melihat kebohongan-kebohongan ini... dan kita dapat melihat bahwa perdamaian ini, perdamaian berdasarkan syarat mereka, juga merupakan sebuah dusta.'\n\n[From.GetRulingParty] telah lama mencemooh kelemahan bangsa [ROOT.GetAdjective], namun akhir-akhir ini retorikanya semakin agresif. Hari pecahnya konflik bersenjata semakin dekat."
 war_justification.202.a: "Seperti yang diharapkan dari sampah fasis seperti [From.GetLeader]."
 war_justification.203.t: "[From.GetLeader] Memperingatkan Bahaya Komunisme [ROOT.GetAdjective]"
 war_justification.203.d: "'Adakah ancaman yang lebih besar bagi jalan hidup kita, atau bahkan bagi jalan hidup itu sendiri, selain komunisme? Wabah yang mengancam untuk menobatkan budak, bukannya tuan, menjadi penguasa setiap bangsa, meruntuhkan bangsa itu sendiri, memusnahkan manusia dan sejarah mereka. Kita akan merebut [From.GetName] dan memusnahkan wabah komunis tersebut.'\n\nKebencian [From.GetLeader] terhadap kaum komunis telah lama dikenal bahkan sebelum naiknya [From.GetRulingParty] ke tampuk kekuasaan, namun tampaknya kebencian itu semakin menghebat baru-baru ini dalam kasus pemerintah [ROOT.GetAdjective]. Upaya kita untuk memusnahkan Marxisme dari muka bumi mungkin akan bermula dari sana."
 war_justification.203.a: "Jika mereka takut pada tujuan kita, berarti mereka takut pada rakyatnya sendiri."
 war_justification.204.t: "[From.GetName] Bersiap untuk Perjuangan Akbar"
 war_justification.204.d: "'Bangsa [ROOT.GetAdjective] adalah bangsa yang tidak akan menyerahkan kekuasaannya dengan mudah. Namun, mereka juga harus menyadari bahwa persimpangan jalan kedua bangsa kita hanya dapat berujung pada benturan. Kita harus membulatkan tekad untuk perjuangan yang akan datang. Karena [ROOT.GetName] tidak akan bisa direbut tanpa pertempuran.'\n\nKemungkinan tercapainya kesepahaman antara pemerintah [ROOT.GetName] dan [From.GetName] yang berpikiran serupa kini telah beralih menjadi kampanye untuk merebut wilayah mereka dengan kekuatan militer."
 war_justification.204.a: "Biarkan mereka datang!"
 war_justification.205.t: "[From.GetLeader] Membawa Revolusi ke [ROOT.GetName]"
 war_justification.205.d: "'Meskipun kita telah mengkonsolidasikan masyarakat sosialis di [From.GetName], masih banyak negara yang menderita di bawah pemerintahan lalim di masa lalu. Para pekerja di [ROOT.GetName] tidak punya suara, tidak punya sarana untuk berorganisasi, dan segala upaya untuk melembagakan sosialisme akan dihancurkan dengan kejam oleh rezim [ROOT.GetLeader]. Kita tidak bisa menunggu sampai roda revolusi internasional berputar untuk rakyat [ROOT.GetAdjective]. Kami telah membuktikan bahwa kami dapat menghancurkan para penindas kapitalis di sini, dan kami akan menghancurkan para penindas di [ROOT.Capital.GetName] juga!'\n\n[From.GetLeader] telah mengabaikan semua upaya diplomasi dengan pemerintah kami. Tugas komunis untuk menghapuskan semua perbatasan kini terfokus pada penghapusan perbatasan kita."
 war_justification.205.a: "[ROOT.GetLeader] adalah penguasa yang lebih baik daripada oportunis revolusioner mana pun!"
 war_justification.206.t: "[From.GetLeader] Menyerukan Bantuan bagi Kaum Buruh [ROOT.GetAdjective]"
 war_justification.206.d: "'Apakah ada kebohongan yang lebih besar daripada apa yang dianggap sebagai kebebasan orang [ROOT.GetAdjective]? Dulunya mereka menjadi budak di bawah pemerintahan pangeran dan adipati yang mengklaim kepemilikan tanah, namun kini mereka terpaksa menjual tenaga kerja mereka kepada pihak yang mengklaim kepemilikan pabrik. Kebebasan mereka untuk memilih salah satu majikan dibandingkan majikan lainnya hampir tidak bisa disebut kebebasan. Kebebasan mereka untuk memilih pemimpin juga merupakan pilihan yang salah, karena propaganda tidak akan membiarkan kaum sosialis sejati mengambil alih kekuasaan. Masyarakat yang diindoktrinasi secara menyeluruh hanya dapat diselamatkan melalui intervensi [From.GetAdjective].'\n\nTidak mau menerima bahwa rakyat kita akan puas tanpa eksperimen sosial mereka, rezim komunis di [From.GetName] secara terbuka mengancam akan menyerang bangsa kita. Tidak ada alasan untuk percaya bahwa konflik ini dapat diselesaikan secara damai."
 war_justification.206.a: "Apa manfaat dari keyakinan mereka jika mereka harus memaksakannya pada kita?"
 war_justification.207.t: "Komunisme [ROOT.GetAdjective] Menuju Kegagalan"
 war_justification.207.d: "\"Kawan-kawan, meskipun kaum revolusioner terhebat pernah disebut sebagai pengkhianat, sudah jelas terlihat bahwa revolusi itu sendiri telah dikhianati. Bagaimana lagi Anda menjelaskan aturan [ROOT.GetRulingParty] dari [ROOT.GetName], yang telah mengesampingkan setiap petunjuk ide-ide Marxis untuk membangun negara pekerja yang merosot di mana mereka dapat berkuasa di bawah premis-premis yang salah? Dengan memperkuat kekuatan mereka sendiri dengan mengorbankan revolusi internasional, mereka telah menunjukkan bahwa mereka tidak terlalu peduli terhadap cita-cita yang mereka yakini. Kita harus membawa revolusi yang sebenarnya kepada mereka.'\n\nMeskipun awalnya mendukung kemenangan [ROOT.GetRulingParty] di [ROOT.Capital.GetName], [From.GetLeader] telah menyimpang dari filosofi [ROOT.GetLeader]. Konflik telah meningkat hingga mereka bersiap menyerang untuk memaksakan sosialisme mereka kepada kita."
 war_justification.207.a: "Mereka tidak mengerti apa arti revolusi bagi rakyat [ROOT.GetAdjective]."
 war_justification.208.t: "[From.GetLeader] Menyerukan Penghancuran Nasionalisme [ROOT.GetAdjective]"
 war_justification.208.d: "'Adakah tatanan masyarakat yang lebih menjijikkan bagi masa depan revolusi, adakah yang lebih asing bagi nasib kaum buruh, selain rezim fasis [ROOT.GetName]? Menyerukan rakyat untuk mengabdi secara fanatik pada institusi bobrok bernama negara-bangsa, mereka mendandani kebiadaban purba dalam busana modern, berupaya menampilkan diri sebagai alternatif masa depan dari kemenangan internasional kaum buruh yang tak terelakkan. Tinggal menunggu waktu sampai mereka menyerang kita atau sekutu kita. Mari kita pukul terlebih dahulu.'\n\nTidak ada yang mengharapkan selain kebencian timbal balik antara kita dan pihak [ROOT.GetAdjective], namun permusuhan tersebut kian meruncing belakangan ini. Mendengar pidato [From.GetLeader], tampak jelas bahwa benturan akan segera terjadi dalam waktu dekat."
 war_justification.208.a: "Kematian bagi komunis!"
 war_justification.209.t: "Diplomasi dengan [ROOT.GetName] Menemui Jalan Buntu"
 war_justification.209.d: "'Meskipun kami berupaya untuk menemukan solusi diplomatis terhadap konflik kami dengan [ROOT.GetName], negosiasi sekali lagi gagal, sehingga pilihan kami terbatas. Rezim otoriter [ROOT.GetLeader] telah menunjukkan pendekatan yang tidak masuk akal terhadap masalah ini, tipikal pemimpin yang tidak bertanggung jawab kepada rakyatnya. Jika tidak ada perubahan menyeluruh dalam kebijakan kepemimpinan [ROOT.GetAdjective], maka kita tidak akan mempunyai jalan lain selain berjuang.'\n\n[From.GetAdjective] campur tangan dalam urusan dalam negeri kita telah menjadi isu hangat, dengan beberapa politisi di pihak oposisi mengklaim bahwa [From.GetRulingParty] telah menjalankan kebijakan yang agresif sejak awal. Apa pun niat awal mereka, perang di masa depan kini tiba-tiba tampak sangat nyata dan tak terelakkan."
 war_justification.209.a: "Retorika mereka yang merendahkan tidak akan mengintimidasi kita."
 war_justification.210.t: "[From.GetLeader] Menyerukan Intervensi di [ROOT.GetName]"
 war_justification.210.d: "'Dengan berat hati kita harus menghadapi kenyataan pahit dari situasi kita: Invasi ke [ROOT.GetName] mungkin menjadi satu-satunya jalan keluar. Keuntungan strategisnya terlalu besar untuk mengupayakan solusi lain dalam situasi kita saat ini. Kendati kita percaya bahwa baik rakyat [From.GetAdjective] maupun [ROOT.GetAdjective] tidak menginginkan perang, namun sejarah telah membawa kita ke titik ini dan pilihan kita sangat terbatas. Kita hanya bisa berharap bahwa melalui penegasan kekuatan militer kita ini, kita dapat mencegah pertumpahan darah yang lebih besar di masa depan.'\n\nMeskipun ada teori populer bahwa negara demokrasi tidak akan saling berperang, perkembangan terkini mengarah pada invasi [From.GetAdjective] ke [ROOT.GetName] di masa mendatang. Sejarah mungkin masih menyimpan kejutan bagi kita."
 war_justification.210.a: "[From.GetName] adalah negara demokrasi yang meragukan dan melakukan tindakan agresif seperti itu."
 war_justification.211.t: "[From.GetLeader] Bersuara Melawan Bahaya Merah"
 war_justification.211.d: "'Tidak diragukan lagi, [ROOT.GetName] komunisme adalah salah satu ancaman terbesar terhadap kebebasan dan ketertiban di era ini. Tanpa kenal lelah dan kejam, hal ini mengancam tidak hanya menghancurkan harapan masyarakat [ROOT.GetAdjective] akan masyarakat yang sejahtera dan demokratis, namun juga harapan negara-negara tetangganya. Jika kita tidak bertindak sekarang, kita mungkin akan terlambat melihat domino pertama ini jatuh, sehingga akan mengakibatkan lebih banyak eksperimen sosial yang gagal. Berapa banyak lagi yang harus mati sebelum kita melakukan intervensi?'\n\nGerakan buruh yang baru lahir telah mengintimidasi para pemimpin [From.GetAdjective]. Meskipun perwakilan dari pihak oposisi menyebut hal ini sebagai Ketakutan Merah yang bertujuan untuk berperang dengan kita, retorika [From.GetRulingParty] sejauh ini sangat berhasil."
 war_justification.211.a: "Selama masih ada keuntungan yang bisa diperoleh, kapitalis akan mengobarkan perang."
 war_justification.212.t: "[From.GetLeader] Menghadapi Fasisme [ROOT.GetAdjective]"
 war_justification.212.d: "'Dalam sejarah modern, bahkan mungkin dalam sejarah secara keseluruhan, tidak ada tirani yang lebih buruk daripada cengkeraman besi di mana [ROOT.GetRulingParty] kini memegang [ROOT.GetName]. Orang-orang mungkin berpendapat bahwa kita tidak boleh memprovokasi konflik, bahwa kita harus percaya [ROOT.GetLeader] untuk menghormati perjanjian dan janji di masa depan, namun orang-orang ini gagal untuk melihat bahwa perjanjian yang dibuat di bawah pemerintahan fasisme tidak ada gunanya. Bagi para pembohong yang tidak terhormat ini, kekuatan akan membuat kebenaran, dan kertas yang menjadi dasar perjanjian tertulis akan mudah terbakar seperti buku-buku para pencela mereka.'\n\nCemburu pada masyarakat mulia yang sedang kita bangun dan warisan yang mendasarinya, [From.GetAdjective] tampaknya siap memulai perang untuk menghancurkannya. Begitu banyak kepura-puraan mereka akan perdamaian."
 war_justification.212.a: "Tidak bisa dihindari. Lebih baik selesaikan saja."
 war_justification.213.t: "[From.GetLeader] Menyerukan Perang Melawan [ROOT.GetName]"
 war_justification.213.d: "'Meskipun kita mungkin bangsa yang cinta damai, sifat alamiah kita semata tidak menentukan jalannya sejarah yang harus kita tempuh. Ini adalah zaman perang. Sudah terlalu lama pihak [ROOT.GetAdjective] menguasai sarana yang kita butuhkan untuk melewati cobaan yang ada di hadapan kita, dan jelas bahwa mereka tidak akan melepaskannya secara damai. Terlepas dari upaya terbaik kita membangun negara modern, beberapa perkara hanya dapat diselesaikan melalui pembuktian di medan laga.'\n\nDalam pidato terbarunya kepada rakyat [From.GetAdjective], retorika permusuhan terhadap [ROOT.GetName] semakin menghebat dan [From.GetLeader] telah mengerahkan segala upaya untuk menjustifikasi invasi. Sebagian masyarakat mendukung langkah ini, namun keputusan akhir berada di tangan pemimpin mereka."
 war_justification.213.a: "Mereka akan menyesal menjadikan kita musuh mereka."
 war_justification.214.t: "[From.GetLeader] Menantang Kepongahan [ROOT.GetAdjective]"
 war_justification.214.d: "'[ROOT.GetName] mungkin menganggap diri mereka lebih modern dan maju dibandingkan kita, namun faktanya bangsa mereka belum teruji seperti bangsa kita, dan mereka juga belum siap menghadapi ancaman yang akan segera terlihat. Dengan sikap meremehkan mereka terhadap kami, dan menghalangi kami untuk merampas apa yang menjadi hak kami, mereka telah menjadikan kami salah satu ancaman terhadap diri mereka sendiri. Bangsa mereka yang lemah dan terpecah belah tidak akan bisa menolak klaim kami.'\n\nPendapat yang mengejek [ROOT.GetName] yang telah lama dianut oleh [From.GetRulingParty] telah berkembang dari kritik menjadi permusuhan. Meskipun pendapat umum adalah bahwa masyarakat [ROOT.GetAdjective] ingin menghindari perang, [From.GetLeader] mengklaim bahwa para pemimpin terpilih kita telah memprovokasi hal tersebut melalui kesombongan mereka."
 war_justification.214.a: "Suara-suara perdamaian di kalangan masyarakat [From.GetAdjective] tentu saja dibungkam."
 war_justification.215.t: "[From.GetLeader] Ingin Memulihkan Ketertiban di [ROOT.GetName]"
 war_justification.215.d: "'Semangat kebangsaan [From.GetAdjective] memang kuat, namun tidak semua bangsa seberuntung itu. [ROOT.GetName] tradisinya telah dihancurkan dan para penguasa yang sah telah lama dibunuh dan dikuburkan, semuanya atas nama gagasan revolusi besar Marxis. Adalah tugas kita untuk memulihkan ketertiban di dunia yang disesatkan oleh perampas kekuasaan yang haus darah dan menegaskan kekuatan [From.GetName] melawan ancaman ini.'\n\nSementara [From.GetRulingParty] selalu menentang komunisme, [ROOT.GetName] telah menjadi sasaran serangan tertentu dalam pidato-pidatonya baru-baru ini. Khawatir akan kemajuan bangsa mereka ke tahap sejarah berikutnya, serangan pendahuluan terhadap komunisme [ROOT.GetAdjective] sudah direncanakan."
 war_justification.215.a: "Sudah terlambat untuk membalikkan kemajuan yang telah kita capai."
 war_justification.216.t: "[From.GetLeader] Memanggil [ROOT.GetAdjective] Penindas"
 war_justification.216.d: "'Lawan-lawan politik saya ingin Anda percaya bahwa kekuasaan saya sama seperti kekuasaan [ROOT.GetRulingParty] di [ROOT.GetName]. Mereka salah besar. Sementara keberhasilan [ROOT.GetLeader] hanyalah buah dari tren sesaat, gerakan massa perusak yang berniat memaksa bangsa-bangsa lain untuk tunduk, [From.GetRulingParty] berdiri menentang gerakan tersebut sebagai pihak yang menolak untuk tunduk. Saya siap melakukan apa pun yang diperlukan untuk melenyapkan ancaman ini, bahkan jika itu berarti perang.'\n\nRezim [From.GetLeader] telah mengambil kebijakan permusuhan terhadap bangsa [ROOT.GetAdjective]. Rencana visioner kita untuk kejayaan masa depan telah membuat bangsa mereka merasa kerdil, dan tak mengherankan jika mereka merasa terancam."
 war_justification.216.a: "Jika mereka ingin menguji kekuatan kita, mereka akan menyesalinya."
 war_justification.217.t: "[From.GetLeader] Mempertanyakan Kedaulatan [ROOT.GetAdjective]"
 war_justification.217.d: "'Siapa yang menentukan perbatasan suatu bangsa dan bagaimana perbatasan itu ditentukan? Cara apa pun yang mungkin pernah ditemukan orang di masa lalu untuk membenarkan di mana [From.GetName] berakhir dan [ROOT.GetName] bermula, kita hidup di era baru. Arti penting strategis dari perbatasan ini tidak dapat dilebih-lebihkan, dan kita sepenuhnya berhak untuk menggesernya demi menjamin keselamatan berkesinambungan bagi rakyat kita.'\n\nMendengar pidato-pidato terkini [From.GetLeader], invasi ke [ROOT.GetName] tampaknya sudah di depan mata. Suara-suara penentang sempat melontarkan keberatan, namun dukungan publik terhadap perang kian meningkat."
 war_justification.217.a: "Apakah dunia tidak belajar apa pun dari Perang Besar?"
 war_justification.218.t: "[From.GetLeader] Mempertanyakan Niat [ROOT.GetName]"
 war_justification.218.d: "'Tidak diragukan lagi bahwa [ROOT.GetName] sedang bersiap untuk perang. Perubahan dalam kebijakan ekonomi memperjelas bahwa bangsa [ROOT.GetAdjective] bukanlah bangsa yang cinta damai, melainkan sedang menunggu saat yang tepat untuk menyerang kita. Apakah kita akan berpangku tangan dan menyaksikan mereka mempersenjatai diri sementara [From.GetName] tanpa pertahanan? Ataukah kita akan melucuti ancaman ini sebelum kekuatannya melampaui kemampuan kita?'\n\nKalangan garis keras di [From.GetRulingParty] telah mengarahkan pandangan mereka ke [ROOT.GetName], berargumen bahwa menyerang adalah pertahanan terbaik. Pandangan mereka semakin mendapat dukungan dan [From.GetName] bersiap untuk perang."
 war_justification.218.a: "Inilah sebabnya kita harus bersiap."
 war_justification.219.t: "[From.GetLeader] Geram atas Manuver [ROOT.GetAdjective]"
 war_justification.219.d: "'Warga negara [From.GetName] yang naif dan membayangkan bangsa [ROOT.GetAdjective] sebagai bangsa yang cinta damai benar-benar kehilangan kontak dengan kenyataan. Mereka yang tinggal di perbatasan kita tidak memiliki kemewahan untuk berkhayal seperti itu, melihat pasukan mereka mendekati kita tepat di seberang sana. Ini adalah ancaman yang tidak bisa kita biarkan tanpa balasan. Setiap hari yang berlalu, [ROOT.GetName] bersiap untuk perang. Sungguh gila jika kita tidak melakukan hal yang sama.'\n\nKehadiran militer kita di dekat wilayah [From.GetAdjective] telah memicu kekhawatiran yang kian mendalam, karena mereka menafsirkan pergerakan pasukan kita sebagai bukti niat permusuhan. Mereka hampir tidak mau menyadari bahwa retorika agresif merekalah yang menjadi alasan bagi langkah pertahanan kita."
 war_justification.219.a: "Kita hampir tidak bisa melucuti senjata setelah ancaman-ancaman ini."
 war_justification.220.t: "[From.GetLeader] Menganjurkan Invasi ke [ROOT.GetName]"
 war_justification.220.d: "'Jika kita ingin mendapatkan keuntungan strategis di masa mendatang, apalagi perang yang tak terhindarkan dengan [ROOT.GetName], tidak ada ruang untuk ragu. Ini tentang menjaga masa depan anak-anak kita dan memastikan bahwa [From.GetName] mendapat tempat di dunia besok. Ini adalah masalah pengabdian pada tujuan kita dan cita-cita yang kita anggap remeh. Saatnya bertindak.'\n\nSerangkaian pidato yang menggugah dari para pemimpin [From.GetRulingParty], yang paling menonjol adalah [From.GetLeader], telah menyerukan masyarakat untuk mendukung invasi [ROOT.GetName]. Motif geopolitik di balik invasi tersebut kurang menonjol dalam retorika sentimen patriotik, namun kampanye ini nampaknya sangat efisien dalam meyakinkan masyarakat akan pentingnya hal tersebut."
 war_justification.220.a: "Sebaiknya kita bersiap. Perang akan datang."
 war_justification.301.t: "[ROOT.GetLeader] Dikritik karena Kebijakan Luar Negeri yang Lemah"
 war_justification.301.d: "'Kami mempunyai kesempatan untuk menyerang musuh kami, tapi [ROOT.GetRulingParty] membiarkannya berlalu begitu saja. Hal ini bukan hanya merupakan satu lagi kasus yang memberatkan dalam serangkaian hilangnya peluang untuk memperkuat posisi [ROOT.GetName] di dunia internasional, namun juga merupakan tanda bahwa klaim mereka untuk bertindak demi kepentingan masyarakat [ROOT.GetAdjective] sebagian besar hanyalah retorika kosong. Sudah waktunya untuk perubahan kebijakan.'\n\nKegagalan kami dalam melancarkan perang seperti yang diharapkan banyak orang telah menjadi sasaran kritik pedas dari lawan-lawan politik kami. Tidak menindaklanjuti rencana militer akan mempersulit kami meyakinkan rakyat ke arah mana kami mengambil [ROOT.GetName]."
 war_justification.301.a: "Bukankah mereka ingin menghindari perang?"
 war_justification.301.b: "Tidak ada ruang untuk perselisihan publik di luar rapat partai."
 war_justification.301.c: "Kami tidak bisa membiarkan orang menuduh [ROOT.GetLeader] pengecut!"
 nuke_dropped.1.t: "Pengeboman Atom di [From.From.GetName]"
 nuke_dropped.1.d: "Untuk pertama kalinya dan semoga yang terakhir dalam sejarah, sebuah bom nuklir telah diledakkan di [From.From.GetName] sebagai bagian dari perang internasional yang dilancarkan oleh [?global.nukecountry.GetNameDef]. Kehancuran dahsyat yang belum pernah terjadi sebelumnya ini menjadi bukti nyata kekuatan mengerikan dari senjata baru ini, yang ditakuti bukan hanya karena daya luluh-lantaknya terhadap target, melainkan juga konsekuensi moral dan eksistensial bagi pihak yang menggunakannya serta bagi kemanusiaan itu sendiri.\n\nDunia menahan napas menunggu apa yang akan terjadi selanjutnya. Akankah ini memaksa [From.From.Owner.GetNameDef] untuk menyerah demi menghindari teror yang lebih mengerikan, ataukah justru memperkuat tekad mereka untuk membalas pihak-pihak yang berani menggunakan tindakan keji semacam itu?"
 nuke_dropped.1.a: "Era Atom telah benar-benar dimulai."
 nuke_dropped.1.b: "Kami akan melakukan apa pun yang diperlukan untuk melindungi masyarakat [ROOT.GetAdjective]."
 nuke_dropped.2.t: "Pengeboman Atom di Hiroshima"
 nuke_dropped.2.d: "\"\"Jalanan tampak bagaikan pemandangan dari neraka.\"\n- Kuniyoshi Aikawa\n\nHari ini, sebuah bom nuklir diledakkan di atas kota Hiroshima pada ketinggian 580 meter, diluncurkan oleh [?global.nukecountry.GetNameDef]. Lebih dari dua pertiga kota langsung musnah seketika. Meskipun kota ini dibangun agar tahan terhadap gempa bumi, hanya segelintir struktur kokoh yang mampu bertahan dari gelombang ledakan tersebut.\n\nSementara kedahsyatan bom atom digembar-gemborkan dalam benak publik, korban jiwa manusia akibat senjata ini justru dipandang sebelah mata. Tak ada pihak yang sanggup merenungi kengerian dari tragedi ini, tetapi warisannya akan selalu dikenang sebagai nyawa yang terenggut dalam sekejap mata serta debu radioaktif yang bertahan lama."
 nuke_dropped.2.a: "Berapa banyak lagi yang akan gugur sebelum perang ini berakhir?"
 nuke_dropped.2.b: "Kita harus bertindak cepat untuk membantu para korban."
 nuke_dropped.3.t: "Pengeboman Atom di Nagasaki"
 nuke_dropped.3.d: "Sebuah bom nuklir, yang awalnya ditujukan ke Kokura, diledakkan hari ini di atas Nagasaki. Kondisi cuaca memaksa pesawat pengangkut mengalihkan misi mereka—kombinasi asap, awan tebal, dan kendala teknis menjadi faktor penentu dalam peristiwa yang akan mengubah jalannya sejarah.\n\nDampak ledakan sedikit tertahan oleh kontur kota yang berada di lembah, namun kehancurannya tetap teramat parah. Sejumlah fasilitas militer memang terhantam, tetapi kerugian besar warga sipil jauh membayanginya. Mungkin butuh waktu berpuluh-puluh tahun sebelum kita mengetahui dampak jangka panjang senjata ini dengan pasti. Ancaman yang ditebar oleh [?global.nukecountry.GetNameDef] benar-benar tak mengenal batas."
 nuke_dropped.3.a: "Apakah ini akan menyebabkan [From.From.Owner.GetAdjective] menyerah?"
 nuke_dropped.3.b: "Kami berharap Nagasaki akan selamat."
 nuke_dropped.4.t: "Pengeboman Atom di Berlin"
 nuke_dropped.4.d: "Hari ini, di [GetDateText], ibu kota Jerman, Berlin, dilanda ledakan nuklir yang diluncurkan oleh [?global.nukecountry.GetNameDef]. Kota ini telah mengalami beberapa serangan, dalam perang ini dan perang terakhir, namun semuanya tidak ada apa-apanya jika dibandingkan dengan perang ini. Sejak Perang Tiga Puluh Tahun, Berlin belum pernah mengalami kehancuran serupa - mengingat pertumbuhannya, hal ini dipandang sebagai suatu kemustahilan.\n\nFührerbunker tampaknya selamat dari ledakan setidaknya sebagian karena bom tersebut meledak jauh dari pusat gempa yang direncanakan, dan [From.From.Owner.GetLeader] dikabarkan masih hidup, jika marah. Namun bagaimana para pemimpin [From.From.Owner.GetAdjective] harus dievakuasi dan apakah mereka dapat dilindungi dari dampak buruknya adalah persoalan lain."
 nuke_dropped.4.a: "Hari ini, saya lega karena tidak menjadi warga Berlin."
 nuke_dropped.4.b: "Musuh-musuh kita telah menyerang jantung negara ini!"
 nuke_dropped.5.t: "Pengeboman Atom di London"
 nuke_dropped.5.d: "Sebuah ledakan nuklir telah meluluhlantakkan kota London hari ini. Meskipun kota ini memiliki pertahanan antiserangan udara, [From.From.Owner.GetNameDef] sama sekali tidak siap menghadapi serangan yang diprakarsai oleh [?global.nukecountry.GetNameDef]. Tepat pada [GetDateText], Big Ben berdentang untuk terakhir kalinya, sebelum meleleh akibat panasnya ledakan. Berbagai laporan awal menunjukkan Istana Buckingham telah rata dengan tanah dan keberadaan keluarga kerajaan saat ini belum diketahui.\n\n[From.From.Owner.GetLeader] kendati demikian dikonfirmasi selamat dan tengah mempersiapkan pidato pembangkit semangat untuk disiarkan lewat radio hari ini. Dengan moral rakyat yang berada di titik terendah, bangsa Inggris sangat membutuhkan pidato ini—atau sebuah pernyataan menyerah yang sangat fasih."
 nuke_dropped.5.a: "Sulit untuk mempertahankan bibir atas yang kaku dalam menghadapi gelombang ledakan nuklir."
 nuke_dropped.5.b: "Tuhan selamatkan Raja!"
 nuke_dropped.6.t: "Pengeboman Atom di Kyoto"
 nuke_dropped.6.d: "Kota Kyoto, sebuah pusat industri terkemuka [From.From.Owner.GetAdjective], dihantam hari ini oleh bom nuklir yang diluncurkan oleh [?global.nukecountry.GetNameDef]. Diduga kuat bahwa kota ini dipilih sebagai sasaran karena dianggap sebagai pusat intelektual bangsa.\n\nKeindahan dan nilai sejarah Kyoto membuat banyak pihak mengira kota ini akan luput dari sasaran bom, namun tampaknya teror menghujani kehancuran di tempat semacam itu justru dipandang menguntungkan guna melipatgandakan dampak psikologis serangan. Lokasi kota di lembah agak menahan laju ledakan, tetapi Istana Kekaisaran kuno dan banyak bangunan industri telah hancur total."
 nuke_dropped.6.a: "Warisan dan keindahan tidak ada artinya dalam perang seperti ini."
 nuke_dropped.6.b: "Jika mereka menghancurkan yang lama, kita akan membangun yang baru."
 nuke_dropped.7.t: "Pengeboman Atom di Tokyo"
 nuke_dropped.7.d: "Hari ini, sebuah serangan nuklir diarahkan tepat ke jantung Kekaisaran Jepang oleh [?global.nukecountry.GetNameDef]. Ibu kota Tokyo, meski diperkirakan akan menjadi sasaran pengeboman badai api biasa, tidak pernah diduga akan menjadi target prioritas senjata baru pemusnah massal ini. Namun pada akhirnya, mungkin karena nilai simbolis ibu kota baru dan Istana Kekaisaran yang kini telah rata dengan tanah, api yang jauh lebih dahsyat dan melahap segalanya telah menimpa kota tersebut.\n\nMeskipun [From.From.Owner.GetLeader] dilaporkan selamat, peristiwa ini memicu pertanyaan tentang seberapa jauh musuh-musuh Jepang bersedia melangkah. Jika perang ini tidak berakhir sekarang, sasaran apa lagi yang tersisa? Ancaman apa lagi yang masih bisa mereka gunakan?"
 nuke_dropped.7.a: "Apakah ini berarti berakhirnya Kerajaan Jepang?"
 nuke_dropped.7.b: "Selama [From.From.Owner.GetLeader] hidup, begitu pula Kekaisaran."
 nuke_dropped.8.t: "Pengeboman Atom di Washington D.C."
 nuke_dropped.8.d: "Sebuah bom nuklir diledakkan hari ini di atas ibu kota Amerika Serikat. Dalam serangan yang jelas-jelas ditujukan ke pusat politik dan warisan sejarah AS, Gedung Putih, Capitol, serta sejumlah monumen dan tugu peringatan musnah dari muka bumi oleh musuh mereka, [?global.nukecountry.GetNameDef]. Bahkan peristiwa Pembakaran Washington lebih dari satu abad silam tidak ada apa-apanya dibandingkan dengan kehancuran yang ditimpakan pada kota ini oleh senjata penghancur dahsyat ini.\n\nMeskipun Presiden [From.From.Owner.GetLeader] telah dievakuasi ke tempat aman, bangsa ini telah terguncang hingga ke akarnya. Tak diragukan lagi, AS sempat berharap menjadi negara pertama dan satu-satunya yang menguasai senjata semacam itu. Harapan tersebut kini telah hancur lebur dengan cara yang paling mengerikan."
 nuke_dropped.8.a: "Satu bangsa, tidak dapat dibagi, versus satu atom, dapat dibagi."
 nuke_dropped.8.b: "Elang akan bangkit dari abu seperti burung phoenix."
 nuke_dropped.9.t: "Pengeboman Atom di Roma"
 nuke_dropped.9.d: "Sebuah ledakan nuklir menghantam kota Roma hari ini, mengejutkan masyarakat di seluruh dunia dalam sebuah serangan tak terduga oleh [?global.nukecountry.GetNameDef]. Karena kekayaan sejarah dan karya seninya yang tak ternilai, banyak yang tak pernah membayangkan bahwa kota kuno ini akan menjadi sasaran kehancuran tanpa pandang bulu. Dengan Kota Vatikan yang juga hancur sebagian dan keberadaan Paus yang belum diketahui, peristiwa ini tidak hanya membuat bangsa Italia ngeri, tetapi juga umat Katolik di seluruh penjuru bumi.\n\nPertumbuhan pesat Roma dalam satu dekade terakhir hampir sepenuhnya sirna akibat serangan ini. Sempat ada harapan bahwa kota ini dapat menopang pemulihan bangsa setelah perang berakhir. Harapan-harapan itu kini telah menjadi abu, bersama dengan begitu banyak nyawa manusia."
 nuke_dropped.9.a: "Bomba Iacta Est!"
 nuke_dropped.9.b: "Roma tidak akan dibangun kembali dalam satu hari..."
 nuke_dropped.10.t: "Pengeboman Atom di Paris"
 nuke_dropped.10.d: "Hari ini, perangkat nuklir yang diluncurkan oleh [?global.nukecountry.GetNameDef] diledakkan di kota Paris, menyebabkan kerusakan luas dan korban jiwa yang tak terhitung jumlahnya. Prancis terkejut ketika ibu kotanya mengalami serangan yang mungkin merupakan serangan paling dahsyat yang pernah dialaminya, meskipun terjadi perang dan revolusi selama berabad-abad. Warga Paris mungkin mengharapkan penaklukan, namun bukan kehancuran yang brutal.\n\nSetiap parade kemenangan di Champs-Élysées melewati sisa-sisa Arc de Triomphe tampaknya tidak mungkin terjadi dalam kondisi kota saat ini. Mungkin dekade mendatang kita akan melihat lahirnya Paris yang baru, namun Paris di benak publik, kota yang dibangun pada masa Belle Époque, telah hilang selamanya."
 nuke_dropped.10.a: "Kota cahaya telah padam."
 nuke_dropped.10.b: "Baru kemarin, sepertinya kita akan selalu memiliki Paris."
 nuke_dropped.11.t: "Pengeboman Atom di Moskwa"
 nuke_dropped.11.d: "Sebuah kota yang telah dicoba dan gagal ditaklukkan oleh banyak orang, Moskow menjadi sasaran serangan nuklir oleh [?global.nukecountry.GetNameDef] hari ini. Ledakan tersebut diarahkan ke jantung kepemimpinan [From.From.Owner.GetAdjective], karena Kremlin hampir hancur seluruhnya akibat ledakan tersebut.\n\n[From.From.Owner.GetLeader], yang semakin sadar dan takut akan semua ancaman yang mungkin dan tidak mungkin terjadi akhir-akhir ini, berhasil dievakuasi tepat waktu dan selamat. Namun, bahkan luasnya [From.From.Owner.GetName] mungkin tidak cukup untuk melarikan diri dari musuh yang begitu kejam. Memang benar, jika hal ini terus berlanjut, negara ini hanya akan terdiri dari dua jenis lahan terlantar: lahan yang sudah ada sejak awal, dan lahan yang diciptakan oleh musuh-musuhnya."
 nuke_dropped.11.a: "Bukankah musim dingin nuklir hanya akan membuat Moskow menjadi sasaran yang lebih sulit?"
 nuke_dropped.11.b: "Mereka mungkin membakar setiap kota yang kita miliki, tapi mereka tidak akan pernah merebutnya."
 nuke_dropped.12.t: "Pengeboman Atom di Kopenhagen"
 nuke_dropped.12.d: "Hari ini, kota Kopenhagen dilanda ledakan nuklir yang diluncurkan oleh [?global.nukecountry.GetNameDef]. Berkembang setelah lolos dari kehancuran dalam Perang Besar berkat netralitas Denmark, ibu kota ini belum pernah mengalami serangan sebesar ini sejak Perang Napoleon. Daerah sekitar Öresund juga mengalami dampak yang signifikan dan orang-orang yang selamat mulai melarikan diri ke Fyn dan daratan utama karena takut akan serangan lebih lanjut.\n\nKeberadaan Raja Christian X saat ini tidak diketahui, dan moral bangsa telah rusak parah akibat serangan tersebut. Masih harus dilihat apakah ini adalah awal dari akhir nasib salah satu negara tertua di Eropa ini."
 nuke_dropped.12.a: "Sesuatu diiradiasi di negara bagian Denmark."
 nuke_dropped.12.b: "Kota ini pernah terbakar sebelumnya, namun tidak musnah."
 nuke_dropped.12.c: "Dengan plutonium kita membuat Denmark bertekuk lutut!"
 nuke_dropped.13.t: "Pengeboman Atom di Stockholm"
 nuke_dropped.13.d: "Kota Stockholm yang indah, Venesia dari Utara yang membanggakan, telah dihantam oleh bom nuklir yang diluncurkan oleh [?global.nukecountry.GetNameDef] hari ini. Terlepas dari upaya terbaik mereka untuk tetap netral di masa lalu, bangsa Swedia kini harus membayar harga termahal akibat konflik internasional. Episentrum ledakan berada di tengah wilayah selatan pusat kota Stockholm, sebuah kawasan yang direncanakan untuk proyek-proyek pembangunan besar di masa depan, kini hancur tanpa dapat diperbaiki.\n\nSebagian besar kota tak lagi dapat dikenali, tetapi bangunan kuno di Slussen tampaknya selamat dari ledakan lebih baik daripada yang diperkirakan. Telah diputuskan bahwa struktur tersebut akan dibiarkan berdiri selamanya tanpa diubah sebagai monumen ketangguhan kota."
 nuke_dropped.13.a: "Dengan ini, netralitas Swedia hanya akan tinggal kenangan."
 nuke_dropped.13.b: "Harimau Swedia tidak akan kehilangan belangnya!"
 soviet.30.t: "Tuntut Bessarabia"
 soviet.30.d: "Rumania tidak bisa berharap mampu menahan keperkasaan Tentara Merah, jika kita mengirim tuntutan atas wilayah klaim sah kita di Bessarabia, mereka mungkin akan menyerahkannya tanpa perlawanan."
 soviet.30.a: "Kirim ultimatum!"
 soviet.30.b: "Tidak, kami akan membayar harga besinya!"
 soviet.31.t: "Tuntut Karjala"
 soviet.31.d: "Finlandia tidak bisa berharap mampu menahan keperkasaan Tentara Merah, jika kita mengirim tuntutan atas wilayah klaim sah kita di Karjala, mereka mungkin akan menyerahkannya tanpa perlawanan."
 soviet.31.a: "Kirim ultimatum!"
 soviet.31.b: "Tidak, kami akan membayar harga besinya!"
 soviet.32.t: "Tundukkan Estonia"
 soviet.32.d: "Estonia tidak bisa berharap mampu menahan keperkasaan Tentara Merah, jika kita mengirim tuntutan hak pangkalan dan kendali atas keamanan perbatasan mereka, kita secara efektif dapat menganeksasi mereka tanpa perlu berperang."
 soviet.32.a: "Kirim ultimatum!"
 soviet.32.b: "Tidak, kami akan membayar harga besinya!"
 soviet.33.t: "Tundukkan Latvia"
 soviet.33.d: "Latvia tidak bisa berharap mampu menahan keperkasaan Tentara Merah, jika kita mengirim tuntutan hak pangkalan dan kendali atas keamanan perbatasan mereka, kita secara efektif dapat menganeksasi mereka tanpa perlu berperang."
 soviet.33.a: "Kirim ultimatum!"
 soviet.33.b: "Tidak, kami akan membayar harga besinya!"
 soviet.34.t: "Tundukkan Lithuania"
 soviet.34.d: "Lithuania tidak bisa berharap mampu menahan keperkasaan Tentara Merah, jika kita mengirim tuntutan hak pangkalan dan kendali atas keamanan perbatasan mereka, kita secara efektif dapat menganeksasi mereka tanpa perlu berperang."
 soviet.34.a: "Kirim ultimatum!"
 soviet.34.b: "Tidak, kami akan membayar harga besinya!"
 soviet.35.t: "[From.GetNameDefCap] Berusaha Bergabung dengan [SOV.GetNameDef]"
 soviet.35.d: "Gejolak politik belakangan ini di [From.GetName] telah meninggalkan pemerintah mereka dengan visi kuat untuk masa depan yang sejalan dengan kita. Mereka telah melihat kebaikan yang dapat dibawa oleh Uni Soviet yang perkasa bagi dunia dan rela memberikan segalanya demi Tanah Air."
 soviet.35.a: "Gerakkanlah."
 soviet.35.b: "Saatnya tidak tepat untuk melakukan tindakan seperti itu."
 soviet.35_threat_LIT: "Lituania bagian dari Uni Soviet"
 soviet.35_threat_FIN: "Finlandia bagian dari Uni Soviet"
 soviet.35_threat_EST: "Estonia bagian dari Uni Soviet"
 soviet.35_threat_LAT: "Latvia bagian dari Uni Soviet"
 soviet.36.t: "[From.GetName] Menginginkan Kekuasaan Kita."
 soviet.36.d: "Gejolak politik belakangan ini di [From.GetName] telah meninggalkan pemerintah mereka dengan visi kuat untuk masa depan yang sejalan dengan rencana kita. Mereka mencari perlindungan kita dan menawarkan dukungan tanpa syarat. Secara resmi mereka akan tetap berjalan sebagai bangsa merdeka, namun mereka akan mengikuti Tanah Air dalam setiap langkahnya."
 soviet.36.a: "Alat lain untuk membantu kemajuan kita."
 soviet.36.b: "Mereka memerlukan terlalu banyak perlindungan."
 soviet.36_threat_LIT: "Boneka Lituania dari Uni Soviet"
 soviet.36_threat_FIN: "Boneka Finlandia dari Uni Soviet"
 soviet.36_threat_EST: "Boneka Estonia dari Uni Soviet"
 soviet.36_threat_LAT: "Boneka Latvia dari Uni Soviet"
 soviet.37.t: "Perwira-perwira Baru Berbakat."
 soviet.37.d: "Perwira-perwira baru kita terbukti mampu mengemban tugas dan mulai beradaptasi dengan peran baru mereka di komando tinggi militer. Dengan korps perwira setia yang memimpin militer kita, pembersihan yang dilakukan [Root.GetLeader] tampaknya membawa dampak seperti yang kita harapkan. Tentara Merah mulai memulihkan kekuatannya dan akan segera menjadi lebih perkasa daripada sebelumnya."
 soviet.37.a: "Luar biasa."
 soviet.37.a_tt: "Menurunkan penalti dari §YPetugas Dibersihkan§!"
 soviet.46.t: "Perang Patriotik Raya"
 soviet.46.d: "Meskipun kita masih memiliki banyak pekerjaan yang tersisa untuk membangun kembali komando tinggi militer kita, kemajuan tentara [From.GetAdjective] di perbatasan kita telah memicu kecerdikan dan kemauan patriotik untuk berperang dalam korps perwira baru kita. Kami tumbuh lebih kuat dengan setiap pukulan yang kami lakukan saat kami bersiap untuk bangkit dan menyerang balik dengan segenap kekuatan [Prev.GetName]. Setiap prajurit rela menyerahkan nyawanya dan berdiri teguh melawan musuh kita. Kami berharap hal ini akan memberikan manfaat besar bagi pelatihan dan komitmen para perwira baru kami bahkan setelah perang ini dimenangkan!"
 soviet.46.a: "Demi kemuliaan [Root.GetName]"
 soviet.46.a_tt: "Menambahkan §YPerang Patriotik Hebat§! yang mengimbangi sebagian hukuman dari §YPetugas Dibersihkan§!"
 soviet.48.t: "Revolusi Permanen"
 soviet.48.d: "Meskipun tak terhitung banyaknya orang yang telah dieksekusi dan dipenjarakan sebagai pengkhianat dan kontra-revolusioner selama beberapa tahun terakhir, posisi-posisi kepemimpinan puncak sebagian besar masih aman. Namun demikian, mereka tidak luput dari kecurigaan. Dengan berdirinya Internasionale Keempat, Stalin tampaknya dirasuki pikiran bahwa orang-orang terdekatnya tidak pernah benar-benar berpihak padanya. Mereka yang mencoba meraih kepercayaannya semakin mengobarkan gagasan ini demi menonjolkan diri mereka sendiri.\n\nSituasi saat ini diwarnai ironi luar biasa: rasa saling curiga di dalam administrasi saat ini telah membuatnya tidak lagi berkelanjutan, dan kudeta kini sudah di depan mata. Beberapa anggota partai berpendapat bahwa mengundang kembali Trotsky dan mengarahkan pembersihan kepada kaum Stalinis dapat meminimalkan kerusakan akibat perang saudara yang akan menyusul. Bisakah rencana ini, yang selama bertahun-tahun menjadi ketakutan terbesar Sekretaris Jenderal, benar-benar terlaksana?"
 soviet.48.a: "Tidak terpikirkan!"
 soviet.48.a_tt: "§YPerang saudara besar-besaran akan segera terjadi§!"
 soviet.48.b: "Komunisme di satu negara telah gagal. Kita membutuhkan Trotsky."
 soviet.48.b_tt: "§YPerang saudara kecil akan pecah ketika Trotsky kembali§!"
 soviet.49.t: "Perang Saudara Rusia Kedua"
 soviet.49.d: "Dengan kian memuncaknya paranoia Stalin, Partai dan militer menjadi terpecah. Mereka yang berhasil meraih kepercayaannya - setidaknya untuk sementara waktu - ingin mempertahankannya di tampuk kekuasaan dan menjaga kultus individu yang telah ia bangun, namun banyak pihak lain yang secara informal disingkirkan dari lingkaran kekuasaan. Sebagian dari mereka meyakini bahwa pemerintahan Stalin telah gagal, sementara yang lain menduga mereka hanya tinggal menunggu hari ketika NKVD akan menemukan atau mengarang alasan untuk menangkap mereka.\n\nBersama-sama, mereka telah membentuk faksi yang cukup kuat untuk menantang administrasi saat ini. Tujuan yang mereka nyatakan adalah menggulingkan tirani Stalin dan bertransisi dari negara totaliter, dengan sebuah dewan perwira militer mengawasi proses tersebut.\n\nPara pendukung Stalin di militer dan Partai telah bersatu untuk mempertahankan rezim saat ini, mengecam lawan-lawan mereka sebagai pengkhianat kontra-revolusioner. Perang saudara baru kini di ambang pintu."
 soviet.49.a: "Kematian bagi para pengkhianat!"
 soviet.50.t: "Tentara Pembebasan Rusia Didirikan"
 soviet.50.d: "Berdirinya Internasional Keempat telah membangkitkan kembali ketakutan Stalin terhadap pengkhianat di Partai dan komando militer. Setelah melihat persidangan dan eksekusi dalam Pembersihan Besar-besaran, banyak yang menduga akan ada persidangan lain yang akan dilakukan. Sebagai tanggapan, sejumlah jenderal yang dipimpin oleh Andrey Vlasov telah membentuk Komite Pembebasan Rakyat Rusia, dengan tujuan menggulingkan rezim Stalin sebelum rezim tersebut menimbulkan kerusakan lebih lanjut.\n\nMeskipun tujuan jangka panjangnya adalah transisi menuju demokrasi, bentuk pastinya masih belum jelas. Yang jelas mereka berniat menggulingkan Stalin dari kekuasaan dan mengakhiri kekuasaan Bolshevik."
 soviet.50.a: "Mereka harus dihentikan!"
 soviet.51.t: "NKVD Melancarkan Kudeta"
 soviet.51.d: "Berdirinya Internasional Keempat telah membangkitkan kembali ketakutan Stalin terhadap pengkhianat di Partai dan komando militer. Setelah melihat persidangan dan eksekusi dalam Pembersihan Besar-besaran, banyak yang menduga akan ada persidangan lain yang akan dilakukan. NKVD, yang merupakan alat penting dalam pembersihan, juga sangat menyadari fakta bahwa lembaga tersebut sendiri merupakan target potensial. Daripada menunggu untuk dipenjara, dieksekusi dan diganti, para pemimpinnya memutuskan untuk menyerang terlebih dahulu dan melancarkan kudeta dengan dukungan dari para pejabat militer yang mempunyai kekhawatiran serupa.\n\nNamun, meskipun mempunyai posisi yang berpengaruh, NKVD merasa sulit untuk mendapatkan kepercayaan dari para pemimpin militer. Kudeta hanya berhasil menguasai sebagian wilayah Uni Eropa, namun dengan sisa-sisa badan lama yang kini menghadapi hukuman mati, mereka sepertinya tidak akan menyerah."
 soviet.51.a: "Mereka harus ditangkap!"
 soviet.52.t: "Kudeta Orang yang Selamat"
 soviet.52.d: "Berdirinya Internasional Keempat telah membangkitkan kembali ketakutan Stalin terhadap pengkhianat di Partai dan komando militer. Setelah melihat persidangan dan eksekusi dalam Pembersihan Besar-besaran, banyak yang menduga akan ada persidangan lain yang akan dilakukan. Dengan banyaknya orang yang hilang, hanya sedikit orang yang dicurigai berhasil menghindari eksekusi. Setelah diinterogasi secara brutal dan dalam beberapa kasus dipenjara, mereka tahu betul bahwa mereka akan menjadi korban pertama dari pembersihan berikutnya. Karena putus asa, para jenderal ini memutuskan untuk mencoba menggulingkan rezim Stalin sebelum hal ini terjadi.\n\nMeskipun usahanya tidak mungkin berhasil, beberapa orang yang selamat dari Pembersihan Besar-besaran telah berhasil merebut kendali di beberapa wilayah Uni. Pemerintahan Sekretaris Jenderal setidaknya telah mengalami ketidakstabilan."
 soviet.52.a: "Kita harus stabilize it as quickly as possible."
 soviet.53.t: "Pembersihan yang Berhasil"
 soviet.53.d: "Setelah berdirinya Internasional Keempat, perburuan terhadap pendukung Trotsky semakin intensif dan beberapa orang yang dekat dengan Stalin dieksekusi. Karena tidak punya siapa-siapa selain dirinya sendiri, Stalin mundur ke rumahnya. Setelah setiap teman dan anggota keluarga yang pengkhianat akhirnya ditangani, dia sekarang dapat beristirahat dan fokus sepenuhnya untuk membawa kejayaan bagi [SOV.GetNameDef]."
 soviet.53.a: "Saatnya menggantung kapak"
 soviet.54.t: "Di Bawah Kepemimpinan Baru"
 soviet.54.d_nopurge: "Dengan memudarnya kekuasaan partai komunis, sudah lama menjadi jelas bahwa sistem Stalinis tidak lagi berkelanjutan.\nKekuatan-kekuatan baru telah bangkit untuk merebut kekuasaan, memanggil cita-cita luhur Rusia untuk membimbing negara kita di sepanjang jalur baru.\n\nMelambangkan transisi ini, [Root.GetLeader] telah menggulingkan Stalin dan menempatkannya di bawah tahanan rumah, jauh dari koridor-koridor kekuasaan tempat ia merancang begitu banyak proyek berbahayanya.\nSeiring tumbuhnya sistem Rusia yang baru menggantikan bangkai Partai yang membusuk, kerahasiaan, paranoia, dan persekongkolan politik sang mantan Sekretaris Jenderal telah berakhir."
 soviet.54.d_purge: "Menjadi jelas bahwa ancaman terbesar terhadap negara Rusia bukanlah para konspirator yang menentang Partai Komunis, namun Partai Komunis itu sendiri. Dengan kekecewaan terhadap impian komunis di Rusia, kekuatan baru telah merebut kekuasaan untuk membawa negara kita ke masa depan.\n\nSetelah penggulingan Stalin oleh [Root.GetLeader], Sekretaris Jenderal yang lama diberikan pengadilan yang bijaksana. Perburuan penyihirnya yang paranoid digambarkan sebagai penghancuran kepemimpinan negara pada saat sangat membutuhkan, Stalin dijatuhi hukuman mati karena pengkhianatan. Sistem lama membawanya ke dalam kuburan tak bertanda."
 soviet.54.a: "Fajar baru bagi politik Rusia."
 usa.14.t: "Senja Kaum Fasis"
 usa.14.d: "Panutan agung kita, Jerman Nazi, telah mengkhianati prinsip-prinsip terdalam mereka dan bersekutu dengan musuh besar kita: Kaum Komunis. Seiring kabar ini menyebar, keresahan pun menyusul di belakangnya. Rakyat tadinya bersedia mengikuti kita sejauh ini karena takut akan revolusi Komunis, namun dengan pembelotan Jerman, kebangkitan besar kita kini mulai dipertanyakan."
 usa.14.a: "Kembali ke Demokrasi."
 usa.14.b: "Tetap setia pada Fasisme."
 usa.24.t: "Senja Kaum Merah"
 usa.24.d: "[SOV.GetNameDefCap], inspirasi yang meyakinkan banyak orang tentang kemungkinan menggulingkan kapitalisme, telah mengkhianati revolusi internasional dan menyelaraskan diri dengan Jerman Nazi. Di antara sosialisme dalam satu negara dan aliansi dengan kaum fasis ini, orang-orang mulai meragukan ketulusan cita-cita komunis di seluruh dunia. Apakah komunisme Amerika hanyalah alat lain yang digunakan [Root.GetLeader] untuk mengonsolidasikan kekuasaan?"
 usa.24.a: "Kembali ke Demokrasi."
 usa.24.b: "Tetap setia pada Komunisme."
 usa.17.t: "[From.From.GetName] telah menyatakan perang terhadap [From.GetName]"
 usa.17.d: "Dunia sudah menjadi tempat yang tidak aman. Bisakah kita benar-benar membiarkan perang berkecamuk di kawasan kita sendiri, atau haruskah kita memastikan bahwa perdamaian tetap terjaga? Kita dapat mengirimkan ultimatum kepada [From.From.GetName] untuk berdamai dengan [From.GetName] atau membiarkan mereka bertarung sampai tuntas."
 usa.17.a: "Beri tahu [From.From.GetName] bahwa kami siap berperang."
 usa.17.a_tt: "§RJika [From.From.GetName] mundur akan menghasilkan perdamaian putih.§!"
 usa.17.b: "Kita akan not intervene this time."
 usa.18.t: "[From.GetName] campur tangan dalam perang melawan [being_attacked.GetName]"
 usa.18.d: "[From.GetName] tidak senang dengan perang konflik kita melawan [being_attacked.GetName]. Mereka mengancam kita dengan perang mereka sendiri jika kita tidak segera menandatangani perjanjian damai dengan [being_attacked.GetName].\nHaruskah kita mundur?"
 usa.18.a: "Beri tahu [From.GetName] bahwa kami siap berperang."
 usa.18.b: "Kita akan back down."
 usa.18.b_tt: "[Root.GetNameWithFlag] berdamai dengan [being_attacked.GetNameWithFlag]"
 usa.19.t: "[From.GetNameWithFlag] mendapatkan tujuan perang Boneka (fokus) terhadap [Root.GetName]"
 usa.20.t: "Pengaruh AS"
 usa.20.d: "Dukungan [From.GetName] terhadap demokrasi mulai memengaruhi negara kita. Siaran radio memungkinkan pidato-pidato dari [From.GetLeader] menjangkau rakyat kita dan kita mendapati banyak warga [Root.GetAdjective] terpikat pada gaya hidup [From.GetAdjective]. [Root.GetName] bukanlah boneka, dan kita tidak akan membiarkan politik kita didikte oleh [From.GetName]. Namun demikian, kita tidak dapat menyangkal pengaruh politik [From.GetAdjective] terhadap negara kita."
 usa.20.a: "Dalam hati kami akan selalu [Root.GetAdjective]"
 usa.20.a_tt: "[Root.GetNameWithFlag] keuntungan: §YPengaruh AS§!"
 usa.21.d: "Advokasi [From.GetName] terhadap komunisme mulai mempengaruhi negara kita. Siaran radio memungkinkan pidato dari [From.GetLeader] menjangkau masyarakat kita. Kami bahkan menemukan selebaran propaganda yang mendorong pekerja [Root.GetAdjective] untuk mengatur dan mempromosikan cara hidup [From.GetAdjective]. [Root.GetName] bukanlah boneka, kami juga tidak akan membiarkan politik kami didikte oleh [From.GetName]. Namun, kita tidak dapat memungkiri pengaruh politik [From.GetAdjective] terhadap negara kita."
 usa.22.d: "Dukungan [From.GetName] terhadap fasisme mulai memengaruhi negara kita. Siaran radio memungkinkan pidato-pidato dari [From.GetLeader] menjangkau rakyat kita dan kita bahkan menemukan selebaran propaganda yang mempromosikan gaya hidup [From.GetAdjective] disebarkan di beberapa wilayah negara ini. [Root.GetName] bukanlah boneka, dan kita tidak akan membiarkan politik kita didikte oleh [From.GetName]. Namun demikian, kita tidak dapat menyangkal pengaruh politik [From.GetAdjective] terhadap negara kita."
 usa.23.t: "Perlindungan AS"
 usa.23.d: "[From.GetName] sekarang menerapkan doktrin Monroe dengan lebih ketat. Selain pengaruh politik yang mereka miliki terhadap negara kita, para pejabat [From.GetName] kini menyatakan bahwa mereka siap untuk campur tangan dalam konflik apa pun antar negara-negara Amerika."
 usa.23.a: "[From.GetName] semakin kuat"
 usa.23.a_tt: "[From.GetNameWithFlag] sekarang dapat melakukan intervensi dalam perang Amerika"
 britain.11.t: "Poros Berlin-Moskwa"
 britain.11.d: "Aliansi militer penuh antara Jerman dan Soviet berpotensi menggulingkan tatanan dunia dan memicu era baru totalitarianisme. Guna membendung perkembangan berbahaya ini, kita wajib merapatkan barisan negara-negara demokratis di seluruh dunia ke dalam sebuah Aliansi Akbar demi menumpas ancaman persekutuan Nazi-Komunis."
 britain.11.a: "Rapatkan Demokrasi!"
 britain.11.b: "Tidak perlu bereaksi berlebihan."
 britain.12.t: "Aliansi Akbar"
 britain.12.d: "Britania mengundang kita untuk bergabung dengan faksi mereka demi memerangi ancaman Nazi-Komunis. Bagaimana kita harus menanggapi undangan ini?"
 britain.12.a: "Ya"
 britain.12.b: "Tidak"
 britain.13.t: "Prancis Ingin Bergabung dengan Sekutu"
 britain.13.d: "Situasi dunia kian hari kian genting. Britania dan Prancis tetap menjadi benteng pertahanan terakhir bagi demokrasi dan kebebasan di Eropa, dan Prancis kini mengajukan permohonan untuk bergabung dengan pihak Sekutu.\nBagaimana kita harus merespons?"
 britain.13.a: "Ya"
 britain.13.b: "Tidak"
 britain.14.t: "Konferensi London"
 britain.14.d: "Pemerintah Jerman mulai memicu pergolakan atas status Slovenia, yang mereka klaim sebagai provinsi historis Jerman bernama Carniola, di mana mereka menuduh etnis Jerman dan Slovenia tengah ditindas oleh pemerintah Yugoslavia. Pemerintahan Yang Mulia telah mengundang pemerintah Prancis, Jerman, dan Italia untuk menghadiri konferensi di London guna mencari penyelesaian yang adil atas krisis ini. Tiada keraguan bahwa minoritas kecil Jerman ingin bergabung ke Jerman, namun kehendak mayoritas bangsa Slovenia jauh dari kata pasti. Jerman tampaknya siap melepaskan anjing-anjing perang demi sengketa ini, dan awan kelam peperangan sekali lagi membayangi benua Eropa."
 britain.14.a: "Perdamaian abadi harus dicari"
 britain.14.b: "Sejarah tidak akan memaafkan kita"
 britain.15.t: "Prancis Meninggalkan Kita"
 britain.15.d: "Pemerintah Prancis gagal berpikir jernih menanggapi usulan penyesuaian perbatasan kita yang bersahaja, dan malah memilih merusak perdamaian demi mengobarkan perang yang mengerikan. Kita akan membiarkan mereka menguras habis tenaganya dalam pertempuran parit yang sia-sia, hingga akhirnya mereka akan memohon-mohon bantuan kita."
 britain.15.a: "Mereka akan mempelajari tempat mereka."
 britain.16.t: "Raja George V Wafat"
 britain.16.d: "Baginda Yang Mulia George V, Raja Britania Raya dan Dominion Seberang Laut serta Kaisar India, telah berpulang ke hadirat Tuhan. Ketenangan pribadinya yang bersahaja dan baktinya yang tak kenal lelah kepada rakyat telah menuntun Imperium melewati badai Perang Besar maupun Depresi Besar. Putranya akan meneruskan takhta sebagai Raja Edward VIII, namun kecemasan telah bermunculan bahwa ia memiliki watak berpikir yang terlalu independen. Stanley Baldwin dan Neville Chamberlain kini tengah bersiap memastikan agar Sang Raja bersedia menerima arahan dari Perdana Menteri dan Kabinet."
 britain.16.a: "Semoga Dia Beristirahat dalam Damai"
 britain.17.t: "Raja Edward Turun Takhta"
 britain.17.d: "Perdana Menteri Baldwin telah menjelaskan dengan jelas bahwa martabat Raja-Kaisar akan tercoreng jika ia menikah bukan hanya dengan orang biasa, tapi juga dengan orang yang sudah bercerai dan, jika hal tersebut tidak cukup buruk, dengan orang Amerika. Setelah banyak pencarian jiwa, Yang Mulia telah memilih cinta daripada tugas dan memilih untuk turun tahta. Adik laki-lakinya, Albert, akan mengambil alih jabatan sebagai Raja George VI. Para bandar taruhan di London sudah memperkirakan apakah pria pemalu ini akan berhasil mencapai penobatannya sendiri."
 britain.17.a: "Tuhan Selamatkan Raja George VI"
 britain.18.t: "Kembalinya Sang Raja"
 britain.18.d: "Bukan rahasia lagi bahwa hubungan antara George VI dan [Root.GetRulingParty] dingin tanpa kehangatan. Suara-suara di parlemen kini mulai lantang menuntut pengunduran dirinya demi menyerahkan takhta kepada kakaknya yang berada di pengasingan, Edward VIII. Beliau adalah sosok yang memahami betul gagasan persatuan melalui kekuatan, seorang pria dengan visi agung bagi Inggris. Kualitas kepemimpinan sejati semacam itulah yang kita dambakan bagi pemimpin bangsa kita!"
 britain.18.a: "Demi Kekaisaran, Edward VIII harus memerintah!"
 britain.18.b: "Kita akan not interfere with parliament."
 britain.19.t: "Pemerintahan India Merdeka Dibentuk"
 britain.19.d: "Dengan dukungan Jepang, kaum nasionalis India telah membentuk pemerintahan di pengasingan, Azad Hind.\n\nKaum nasionalis menyebarkan propaganda di Raj, dan mendorong desersi Sepoy. Meskipun saat ini mereka kekurangan dukungan, upaya mereka pada akhirnya bisa menjadi berbahaya."
 britain.19.a: "Tugas orang bodoh!"
 ENG_RAJ_azad_hind_tooltip: "Dukungan nasionalis akan terus tumbuh kecuali diimbangi dengan janji kemerdekaan."
 britain.20.t: "Azad Hind Memimpin Pemberontakan India"
 britain.20.d: "Azad Hind, pemerintahan dalam pengasingan bagi India Merdeka, kian giat menebarkan propaganda dan menggalang sokongan di kalangan rakyat Kemaharajaan. Meskipun kerja sama di lingkungan Imperium saat ini menjadi jauh lebih genting dari sebelumnya, mereka telah membulatkan tekad bahwa inilah detik yang tepat untuk melancarkan pukulan."
 britain.20.a: "Tidak, Kekaisaran harus bersatu!"
 britain.23.t: "Pemberontakan India"
 britain.23.d: "Azad Hind, pemerintahan India Merdeka di pengasingan, telah menyatakan bahwa waktunya telah tiba bagi semua patriot sejati untuk mengangkat senjata melawan penguasa Inggris. Nasib India berada di ujung tanduk dan kita harus menentukan pilihan."
 britain.23.a: "Kami akan mendukung Kekaisaran!"
 britain.23.b: "Kami akan memanfaatkan kesempatan ini!"
 britain.24.t: "Pabrik-Pabrik Skema Bayangan Mulai Difungsikan"
 britain.24.d: "Persiapan cermat yang kita rancang dalam Skema Bayangan (Shadow Scheme) guna memuluskan transisi pabrik-pabrik sipil menjadi industri perang penuh kini menuai hasil nyata. Pabrik-pabrik baru tersebut telah beroperasi jauh lebih efisien daripada perkiraan rasional mana pun dalam kurun waktu sesingkat ini."
 britain.24.a: "Sungguh suatu kebetulan bahwa kami memiliki pandangan ke depan!"
 poland.1.t: "Ekspansi ke Timur"
 poland.1.d: "Setelah dipaksa menyerahkan Gdansk kepada Jerman, kini kita terjepit di antara dua kekaisaran yang mengancam kedaulatan kita. Saat kita kehilangan wilayah di barat dan tak dapat lagi memercayai Sekutu untuk melindungi kita dari agresi Jerman, kita dapat mempertimbangkan untuk menyelaraskan diri dengan ambisi Jerman dan merebut kembali bagian-bagian Persemakmuran lama kita yang kini diserap ke dalam [SOV.GetNameDef]. Kita akan menjadi mangsa empuk jika tetap netral, dan kita telah berjuang terlalu keras untuk menyaksikan pemisahan Polandia terjadi sekali lagi."
 poland.1.a: "Saatnya mengubah Poros dari ancaman menjadi sekutu."
 poland.1.b: "Bekerja secara diplomatis dengan Soviet lebih disukai."
 poland.2.t: "[FROM.GetNameDefCap] Menuntut Wilayah Timur"
 poland.2.d: "Setelah menegaskan kembali klaim mereka atas wilayah timur kita, [FROM.GetNameDef] kini menekan kita untuk menyerahkan tanah ini kepada mereka, mengisyaratkan bahwa ini adalah satu-satunya cara untuk menghindari invasi baru serta kemungkinan aneksasi atau pemisahan wilayah.\n\nDalam keadaan biasa, menyerah begitu saja pada ancaman semacam itu jelas mustahil, tetapi [FROM.GetNameDef] bukanlah satu-satunya kekhawatiran kita. Jika kita menyetujui tuntutan mereka, kekhawatiran kita di front timur mungkin berkurang, meskipun hal itu juga akan menggeser front timur jauh lebih ke arah barat."
 poland.2.a: "Menyerahkan timur dengan damai."
 poland.2.b: "[ROOT.GetName] tidak akan menyerah tanpa perlawanan!"
 poland.3.t: "[FROM.GetName] Menyerahkan Wilayah Timur"
 poland.3.d: "Setelah kita menekan [FROM.GetNameDef] agar tunduk pada klaim sah kita atas wilayah timurnya, mereka setuju untuk menyerahkan apa yang kita tuntut tanpa konflik lebih lanjut. Namun, kita mungkin harus mengubur harapan untuk menjalin ikatan yang lebih erat dengan negara itu di masa depan. Setelah memenuhi hak kita, mereka tampaknya berharap untuk menjaga kontak sekecil mungkin dengan kita."
 poland.3.a: "Selama mereka mengakui klaim kami, tidak ada masalah."
 poland.4.t: "[FROM.GetName] Menolak Menyerahkan Wilayah Timur"
 poland.4.d: "Meskipun kita telah berupaya menyelesaikan sengketa dengan [FROM.GetNameDef] secara damai, mereka menolak menyerahkan wilayah timur mereka dan memaksa kita ke dalam situasi di mana satu-satunya cara untuk mengklaimnya adalah melalui perang. Jelas sekali, negara pembangkang ini tidak akan luput dari pemisahan wilayah bahkan ketika mereka diberi kesempatan."
 poland.4.a: "Apakah mereka pikir mereka bisa melawan kita?"
 poland.5.t: "[FROM.GetNameDefCap] Menawarkan Perlindungan"
 poland.5.d: "Setelah [FROM.GetNameDef] mengklaim hak atas Polandia timur, kita mengira serangan baru sudah di depan mata. Namun, tawaran terkini dari pihak [FROM.GetAdjective] mengindikasikan sebaliknya. Tampaknya, asalkan kita menyerahkan wilayah yang diklaim, mereka bersedia mengizinkan kita bergabung dalam sebuah aliansi bersama mereka. Lebih dari itu, mereka berjanji bahwa jika terjadi perang dengan Jerman, kita akan diberi kompensasi atas kerugian wilayah itu dengan dianugerahi tanah baru di barat.\n\nKendati tawaran ini mungkin lebih baik daripada yang kita duga, kita tidak tahu apakah perang di masa depan ini benar-benar akan terjadi. Barangkali [FROM.GetNameDef] hanya mencari jalan mudah untuk mencaplok tanah dan memaksa kita masuk ke zona pengaruh mereka. Meskipun demikian, ini mungkin perlindungan terbaik yang bisa kita andalkan."
 poland.5.a: "Kita harus accept now, before it's too late."
 poland.5.b: "[ROOT.GetName] Belum Hilang!"
 poland.6.t: "[FROM.GetNameDefCap] Menerima Perlindungan"
 poland.6.d: "Tawaran untuk merangkul [FROM.GetNameDef] di bawah perlindungan kita dan memandu mereka menuju penaklukan di barat sebagai imbalan atas wilayah di timur terbukti berhasil. Dengan dijanjikan bagian dari wilayah Jerman jika perang berhasil dan jaminan perlindungan kita, mereka setuju untuk menyerahkan wilayah timur mereka secara damai."
 poland.6.a: "Sekutu melawan Jerman lebih disukai daripada partisi lain."
 poland.7.t: "[FROM.GetNameDefCap] Menolak Perlindungan"
 poland.7.d: "Meskipun kita telah memberikan tawaran paling bermurah hati yang kita bisa—mengupayakan kesepakatan di mana [FROM.GetNameDef] akan menyerahkan wilayah timurnya demi janji pembagian wilayah Jerman di masa depan—[From.GetLeader] justru menolak upaya diplomatik kita. [FROM.GetNameDefCap] telah memilih jalan yang keras, bagi kita, terlebih lagi bagi diri mereka sendiri."
 poland.7.a: "Apa yang tidak bisa dibeli harus disita."
 poland.8.t: "[POL.GetName] Dianugerahi Jerman Timur"
 poland.8.d: "Sesuai kesepakatan sebelumnya, setelah aneksasi wilayah Jerman timur oleh [SOV.GetNameDef], beberapa wilayah tersebut akan berada di bawah kendali [POL.GetAdjective] sebagai kompensasi atas penyerahan Polandia timur di masa lalu kepada [SOV.GetNameDef]."
 poland.8.a: "Pergeseran ke barat adalah hal terbaik yang bisa kami harapkan, dalam situasi seperti ini."
 poland.9.a: "Situasi ini tampaknya terselesaikan demi kepuasan kita bersama."
 poland.10.t: "[From.GetName] Bergabung dengan [Root.GetFactionName]!"
 poland.10.d: "Mengakui perlunya persatuan menghadapi ancaman yang mengepung negara kita dari segala arah, [From.GetLeader] hari ini mengumumkan kepada dunia bahwa [From.GetName] telah menandatangani pakta bersama [Root.GetName] demi keselamatan bersama."
 poland.10.a: "[Root.GetName] dan [From.GetName] saat ini berdiri sebagai saudara."
 poland.11.t: "[From.GetName] Menolak Bergabung dengan [Root.GetFactionName]"
 poland.11.d: "Dalam tindakan bodoh yang dikira sebagai penyelamatan diri, [From.GetLeader] hari ini mengumumkan bahwa [From.GetName] akan menahan diri dari tindakan diplomatik apa pun yang dapat dianggap mengancam tetangga mereka yang perkasa. Oleh karena itu, mereka menolak permintaan kita untuk bergabung dengan [Root.GetFactionName]."
 poland.11.a: "Satu-satunya keamanan adalah berdiri bersama."
 poland.12.t: "Wojtek Tak Pernah Menjatuhkan Peti Amunisi"
 poland.12.d: "Prajurit Wojtek telah membuktikan dirinya sebagai anggota jalur suplai kita yang luar biasa berharga. Bahkan di tengah panasnya pertempuran sengit, dengan peluru senjata ringan menyapu bulu di kepala, tangan, dan kakinya, ia tidak pernah menjatuhkan satu peti amunisi pun. Prajurit pemberani ini memastikan artileri kita terus menembak tanpa henti, dan dengan demikian berperan penting dalam mengalahkan musuh. Sebagai hasil dari jasanya, telah diputuskan bahwa Wojtek harus dinaikkan pangkatnya."
 poland.12.a: "Semoga kita semua mengambil inspirasi dari keberaniannya"
 WOJTEK_COMMANDER: "Wojtek menjadi §HKomandan Korps§!"
 greece.1.t: "Ultimatum Soviet"
 greece.1.d: "Kita berada di bawah tekanan Soviet untuk menyerahkan wilayah. Mereka mengancam dengan perang total jika kita tidak tunduk. Menyerah mungkin akan menyelamatkan nyawa banyak prajurit Yunani, tetapi apakah ini akan menjadi kali terakhir mereka menuntut tanah air kita?"
 greece.1.a: "Menghindari perang adalah yang terbaik bagi Yunani"
 greece.1.b: "Jangan beri mereka apa pun."
 greece.2.t: "Putusan Ljubljana Kedua"
 greece.2.d_GER_demand: "Jerman berupaya menggertak Yunani agar menyerahkan wilayah untuk 'pangkalan militer'."
 greece.2.d_ITA: "Pihak Jerman berupaya merebut tanah demi kawan-kawan Italia mereka dengan mengorbankan kita."
 greece.2.d_BUL: "Pihak Jerman menuntut agar kita menyerahkan wilayah kepada kaki tangan Bulgaria mereka."
 greece.2.d_ITA_BUL: "Pihak Jerman mendesakkan tuntutan Italia sekaligus Bulgaria atas wilayah kita."
 greece.2.a: "Kita tidak bisa menolaknya"
 greece.2.b: "Kita akan not yield"
 greece.3.t: "Nasib Yunani"
 greece.3.d: "Jerman menuntut agar kita menerima 'koordinasi' demi Jerman. Hal ini secara efektif akan mengubah kita menjadi boneka Jerman."
 greece.3.a: "Terimalah Hal yang Tak Terelakkan"
 greece.3.b: "Tolak"
 greece.4.t: "Perang Terhadap Turki"
 greece.4.d: "Sahabat-sahabat Italia kita berencana melancarkan serangan terhadap Turki. Ini adalah kesempatan sempurna bagi kita untuk mengamankan posisi kita di Laut Aegea. Mari kita rebut Izmir untuk diri kita sendiri dan bantu pihak Italia mengusir orang-orang Turki jauh dari Eropa."
 greece.4.a: "Izmir akan menjadi milik kita"
 turkey.1.t: "Wafatnya Mustafa Kemal Atatürk"
 turkey.1.d: "\nRepublik berduka.\n\nPahlawan perang, revolusioner, presiden, dan Bapak Bangsa Turki, Mustafa Kemal Atatürk, telah berpulang.\n\nBeliau menunaikan baktinya kepada rakyat Turki dan republik yang didirikannya hingga hembusan napas terakhir. Ribuan pelayat memberikan penghormatan terakhir di Istanbul, sebelum jenazahnya diantarkan dengan kereta jenazah, kapal, dan kereta api menuju Ankara. Di sana pemakaman kenegaraannya diselenggarakan dengan dihadiri oleh segenap anggota parlemen serta tokoh-tokoh terkemuka dari seluruh penjuru dunia.\n\nDengan kepergian bapak bangsa Turki modern, Republik harus terus melangkah maju. Majelis Agung Nasional telah memilih [Root.GetLeader] sebagai penerusnya."
 turkey.1.a: "Atatürk akan dikenang"
 generic.1.t: "[From.GetName] Memengaruhi Politik Kita"
 generic.1.d_neutral_good: "Sekian lama pemerintah [From.GetAdjective] berupaya menyelaraskan haluan negara kita, dan telah menunjukkan minat besar terhadap perpolitikan [Root.GetAdjective]. Baru-baru ini hal tersebut kian gencar ketika [From.GetRulingParty] mulai menyebarkan propaganda [From.GetRulingIdeology] mereka lewat serangkaian pidato dan bahan bacaan yang dibagikan kepada rakyat [Root.GetAdjective].\n\nKini bahkan sejumlah politisi dan pejabat lain mulai terpengaruh oleh propaganda [From.GetAdjective] tersebut, dan mulai memperjuangkan [From.GetRulingIdeologyNoun] di [Root.GetName]."
 generic.1.d_bad: "Sekian lama pemerintah [From.GetAdjective] berupaya menyelaraskan haluan negara kita, dan sering kali mencoba campur tangan dalam perpolitikan [Root.GetName]. Baru-baru ini hal tersebut kian mengkhawatirkan, saat [From.GetRulingParty] mulai memaksakan propaganda [From.GetRulingIdeology] mereka tanpa menghormati tradisi politik [Root.GetAdjective]. Sejumlah pidato dan materi [From.GetRulingIdeology] lainnya telah dibagikan kepada rakyat [Root.GetAdjective]. Tampaknya sejumlah politisi dan pejabat lain pun mulai terpengaruh oleh propaganda [From.GetAdjective] dan mulai menyuarakan [From.GetRulingIdeologyNoun] di [Root.GetName]."
 generic.1.a: "Menarik"
 generic.1.b: "Beraninya mereka!"
 country_capitulated.0.t: "[Root.GetName] telah kapitulasi"
 country_capitulated.0.d_positive_both_no_faction: "\n[From.From.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] yang pengecut tidak dapat lagi menahan tekanan dari kehadiran pasukan [From.From.GetAdjective] yang melimpah ruah di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] memilih melarikan diri dari negaranya dan hidup dalam pengasingan. Pasukan utama mereka telah menyerah, dan [From.From.GetNameDef] kini memegang kendali atas tanah air mereka.\nMeskipun perang masih terus berkecamuk di tempat lain, ini adalah kemenangan besar bagi [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_no_faction: "\n[From.From.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] yang pengecut tidak dapat lagi menahan tekanan dari kehadiran pasukan [From.From.GetAdjective] yang melimpah ruah di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] memilih melarikan diri dari negaranya dan hidup dalam pengasingan. Pasukan utama mereka telah menyerah, dan [From.From.GetNameDef] kini memegang kendali atas tanah air mereka.\nMeskipun perang melawan sisa-sisa [Root.GetFactionName] masih terus berlangsung di tempat lain, ini adalah kemenangan besar bagi [From.From.GetNameDef]."
 country_capitulated.0.d_positive_prev_faction: "\n[From.From.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] yang pengecut tidak dapat lagi menahan tekanan dari kehadiran pasukan [From.From.GetAdjective] yang melimpah ruah di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] memilih melarikan diri dari negaranya dan hidup dalam pengasingan. Pasukan utama mereka telah menyerah, dan [From.From.GetNameDef] kini memegang kendali atas tanah air mereka.\nMeskipun perang melawan sisa-sisa [Root.GetFactionName] masih terus berlangsung di tempat lain, ini adalah kemenangan besar bagi segenap anggota [From.From.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] tidak dapat lagi menahan tekanan dari pasukan pendudukan [From.From.GetAdjective], yang melakukan kekejaman di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] kini berada di pengasingan. Pasukan utama mereka telah kapitulasi, dan [From.From.GetNameDef] kini menguasai tanah air mereka.\nTerlepas dari kehilangan yang menghancurkan ini, perang melawan [From.From.GetNameDef] masih jauh dari kata usai."
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] tidak dapat lagi menahan tekanan dari pasukan pendudukan [From.From.GetAdjective], yang melakukan kekejaman di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] kini berada di pengasingan. Pasukan utama mereka telah kapitulasi, dan [From.From.GetNameDef] kini menguasai tanah air mereka.\nKendati perang melawan [From.From.GetNameDef] masih berlanjut, ini merupakan kemunduran yang sangat disayangkan bagi segenap [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] telah mengumumkan bahwa bangsa [Root.GetAdjective] tidak dapat lagi menahan tekanan dari pasukan pendudukan [From.From.GetAdjective], yang melakukan kekejaman di seluruh penjuru negeri. Pemerintah [Root.GetAdjective] kini berada di pengasingan. Pasukan utama mereka telah kapitulasi, dan [From.From.GetNameDef] kini menguasai tanah air mereka.\nKendati perang melawan [From.From.GetNameDef] dan sisa anggota [From.From.GetFactionName] masih berlanjut, ini merupakan kemunduran yang sangat disayangkan bagi segenap [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction: "\nPemerintah [Root.GetAdjective] telah pergi ke pengasingan dan pasukan utama mereka telah kapitulasi kepada [From.From.GetNameDef], yang kini menguasai tanah air mereka.\n\nWalaupun pertempuran antara [From.From.GetName] dan [Root.GetName] telah berakhir, [From.From.GetNameDef] masih berada dalam kancah perang total, dan pertempuran masih berkecamuk di tempat lain."
 country_capitulated.0.d_neutral_prev_no_faction: "\nPemerintah [Root.GetAdjective] telah pergi ke pengasingan dan pasukan utama mereka telah kapitulasi kepada [From.From.GetNameDef], yang kini menguasai tanah air mereka.\n\nPerjuangan di [Root.GetName] hanyalah bagian kecil dari konflik yang lebih besar. Perang antara [From.From.GetNameDef] dan sisa-sisa [Root.GetFactionName] masih berlanjut di tempat lain."
 country_capitulated.0.d_neutral_prev_faction: "\nPemerintah [Root.GetAdjective] telah pergi ke pengasingan dan pasukan utama mereka telah kapitulasi kepada [From.From.GetNameDef], yang kini menguasai tanah air mereka.\n\nPerjuangan antara [From.From.GetNameDef] dan [Root.GetNameDef] hanyalah bagian kecil dari konflik yang lebih besar. Perang antara [From.From.GetFactionName] dan sisa-sisa [Root.GetFactionName] masih berlanjut di tempat lain."
 country_capitulated.0.d_positive_collab_diff_ideology: "\n[Root.GetNameDef] telah mengumumkan penyerahan totalnya kepada [From.From.GetNameDef]. Pasukan [From.From.GetAdjective] bersama sejumlah pendukung independen [Root.GetAdjective] [From.From.GetRulingIdeology] telah memaksa [Root.GetLeader] dan pemerintahannya ke pengasingan saat sebuah pemerintahan baru dibentuk untuk memimpin [Root.GetNameDef] dalam kerja sama dengan [From.From.GetNameDef]. [From.From.GetLeader] menyatakan bahwa kesepakatan bersama ini akan membawa era baru kemakmuran dan kerja sama bagi [Root.GetNameDef].\n[Root.GetLeader] menanggapi dengan menyatakan bahwa bahkan di pengasingan sekalipun, ia akan terus berjuang demi [Root.GetNameDef] dan mendukung segala upaya perlawanan di tanah airnya."
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "\n[Root.GetNameDef] telah mengumumkan penyerahan totalnya kepada [From.From.GetNameDef]. Sejumlah warga [Root.GetAdjective] yang tidak puas dengan corak [From.From.GetRulingIdeologyNoun] yang dibawa ke [Root.GetNameDef] oleh [Root.GetLeader] bergabung dengan serdadu [From.From.GetAdjective] dalam menggulingkannya dari kekuasaan dan membentuk pemerintahan baru di bawah bimbingan [From.From.GetNameDef]. [From.From.GetLeader] menyatakan bahwa kesepakatan bersama ini akan membawa era baru kemakmuran dan kerja sama bagi [From.From.GetNameDef]\n[Root.GetLeader] menanggapi dengan menyatakan bahwa [From.From.GetLeader] bukanlah penganut [From.From.GetRulingIdeology] sejati dan bahkan di pengasingan sekalipun, ia akan terus berjuang demi [Root.GetNameDef] dan mendukung segala upaya perlawanan di tanah airnya."
 country_capitulated.0.d_negative_collab_diff_ideology: "\n[Root.GetNameDef] telah mengumumkan penyerahan totalnya kepada [From.From.GetNameDef]. Terbukti nyata bahwa kelonggaran pemerintah [Root.GetAdjective] terhadap simpatisan domestik [From.From.GetRulingIdeology] menjadi faktor yang berkontribusi atas jatuhnya [Root.GetName] saat [Root.GetFascistLeader] didudukkan ke tampuk kekuasaan untuk memerintah negara atas nama rezim [From.From.GetLeader].\n[Root.GetLeader] menegaskan bahwa ini bukanlah akhir dari kedaulatan [Root.GetAdjective], dan pemerintah akan senantiasa mendukung segala upaya perlawanan bahkan saat terasing dari tanah air mereka."
 country_capitulated.0.a: "Berita bagus!"
 country_capitulated.0.b: "Ini adalah masa-masa kelam"
 country_capitulated.0.c: "Saat-saat yang tidak pasti"
 britain.22.t: "Stanley Baldwin Mengundurkan Diri"
 britain.22.d: "Dua pekan selepas upacara penobatan Raja George VI, Tuan Baldwin mengumumkan bahwa ia meletakkan jabatan perdana menteri demi menikmati masa pensiun di usia 70 tahun. Setelah memimpin Pemerintahan Nasional secara berkala sejak 1923, ia telah menjadi nahkoda berwibawa yang mengantarkan Imperium Britania keluar dari jurang Depresi Besar, serta beberapa tahun belakangan ini dengan berat hati mengawasi dimulainya persenjataan kembali Imperium dan krisis turun takhta Raja Edward VIII. Ia mundur sebagai perdana menteri yang dihormati dan sukses, namun akankah langkahnya cukup untuk membendung ancaman Jerman yang kian menggelora?"
 britain.22.a: "Tuan Chamberlain akan berusaha membentuk pemerintahan."
 france.31.t: "Édouard Daladier Mengundurkan Diri"
 france.31.d: "Dengan runtuhnya Republik Ketiga dan keengganan pemerintah Jerman menawarkan gencatan senjata, tampuk kepemimpinan segar kini harus memikul beban meneruskan perjuangan perlawanan dari tanah-tanah koloni. Meskipun segelintir orang meragukan kecakapan Monsieur Daladier sebagai seorang perdana menteri yang piawai, beliau semata-mata tidak sanggup membendung gelombang peristiwa luar biasa dahsyat yang melanda Prancis. Kita hanya bisa memanjatkan doa semoga senantiasa ada secercah harapan di ujung kegelapan ini."
 france.31.a: "Tuan Reynaud akan berusaha membentuk pemerintahan."
 germany.999.t: "Kisah Dua Kota"
 germany.999.desc: "Menyusul kemenangan gemilang pasukan Jerman, waktunya telah tiba untuk melenyapkan sisa-sisa terakhir kekuasaan Bolsyevik di Eropa. Bahkan hingga saat ini, nama Stalin dan Lenin menodai dua kota besar di Lebensraum Jerman yang baru, menghina prajurit yang mengorbankan nyawa demi merebutnya.\n\n'Asosiasi Veteran Perang Dunia' telah menyampaikan saran kepada pemerintah untuk memperbaiki keadaan yang mengerikan ini."
 germany.999.a: "Mari kita hormati para pahlawan perang terakhir!"
 germany.999.b: "Saran yang tidak masuk akal!"
 GAME_OVER_TT: "§RPermainan akan berakhir untuk Anda.§!"
 CAN_ANGERED_WORKERS: "Hal ini akan membuat masyarakat resah"
 generic.2.t: "[From.GetNameDefCap] berupaya bergabung dengan [Root.GetFactionName]"
 generic.2.d.a: "Di hadapan ancaman yang kian membesar terhadap kebebasan dan nilai-nilai demokrasi, pihak [alliance_applicant.GetAdjective] memandang kita sebagai benteng pelindung kemerdekaan. Mereka kini berhasrat untuk diterima ke dalam aliansi kita, baik untuk bernaung di bawah perlindungan kita maupun untuk berdiri bersama kita melawan kekuatan yang mengancam demokrasi."
 generic.2.d.b: "Perjuangan keras kita untuk meruntuhkan tatanan dunia saat ini tidak luput dari perhatian negara-negara yang sepemikiran. Pihak [alliance_applicant.GetAdjective] menyadari bahwa peluang terbaik mereka untuk mengukir masa depan yang makmur adalah dengan menyelaraskan diri bersama kita dalam konflik mendatang, dan karenanya mereka telah menawarkan diri untuk secara resmi bergabung bersama kita melawan musuh-musuh kita."
 generic.2.d.c: "[alliance_applicant.GetNameDefCap] telah menyadari bahwa ia harus bersatu dengan sesama republik sosialis demi memperkokoh kedudukan Komunisme di panggung dunia. Mengakui peran kepemimpinan kita dalam perjuangan kaum buruh internasional, pihak [alliance_applicant.GetAdjective] kini memohon untuk secara resmi masuk ke dalam persekutuan bersama kita."
 generic.2.d.e: "Seiring pergolakan politik internasional saat ini yang terus bergema di seluruh penjuru dunia, pihak [alliance_applicant.GetAdjective] menganggap kita sebagai peluang terbesar mereka untuk bertahan melewati masa-masa penuh kemelut ini. Oleh karena itu, mereka memohon untuk diterima ke dalam aliansi kita, agar kita dapat mengarungi badai yang akan datang bersama-sama."
 generic.2.a: "Semua yang membela kebebasan dan demokrasi boleh mendukung kami."
 generic.2.b: "Dunia adalah milik semua orang yang kuat!"
 generic.2.c: "Jika kita berdiri bersama, revolusi akan menang."
 generic.2.e: "Dan menghadapinya, kami akan melakukannya!"
 generic.2.f: "Kita lebih baik tanpa mereka."
 generic.2.g: "Kami sudah memiliki sekutu yang kami butuhkan."
 generic.3.t: "[alliance_inviter.GetNameDefCap] menyambut kita ke dalam [alliance_inviter.GetFactionName]"
 generic.3.d: "[alliance_inviter.GetNameDefCap] telah memutuskan untuk menerima permohonan kita untuk bergabung dengan [alliance_inviter.GetFactionName]. Mulai saat ini kita akan berdiri atau gugur bersama-sama."
 generic.3.a: "Bersama-sama kita akan membela demokrasi."
 generic.3.b: "Tidak ada yang bisa melawan kita!"
 generic.3.c: "Penderitaan kaum buruh tidak bisa meminta pemimpin yang lebih baik!"
 generic.3.e: "Kami akan mengesampingkan perbedaan kami, untuk saat ini."
 generic.4.t: "[alliance_inviter.GetNameDefCap] menolak permohonan untuk bergabung dengan [alliance_inviter.GetFactionName]"
 generic.4.d: "[alliance_inviter.GetNameDefCap] telah memutuskan untuk menolak permohonan kita untuk bergabung dengan [alliance_inviter.GetFactionName]. Kita harus bertahan tanpa bantuan mereka."
 generic.4.a: "Mereka menyebut diri mereka pembela kebebasan?"
 generic.4.b: "Lalu kita akan menghancurkan mereka juga!"
 generic.4.c: "Revolusi mereka korup!"
 generic.4.e: "Perbedaan kami terlalu besar."
 news.289.t: "[alliance_applicant.GetNameDefCap] Bergabung dengan [alliance_inviter.GetFactionName]"
 news.289.d: "\nPagi hari ini, [alliance_inviter.GetNameDef] dan [alliance_applicant.GetNameDef] merilis pernyataan bersama yang menegaskan bahwa pihak kedua telah resmi dianugerahi status keanggotaan dalam [alliance_inviter.GetFactionName]. Apakah persekutuan ini akan diarahkan untuk tujuan ofensif atau defensif masih harus dinanti, namun tak diragukan lagi bahwa perencanaan militer gabungan skala besar telah mulai bergulir."
 news.289.a: "Kita lebih kuat bersama-sama."
 news.289.b: "Mereka mencari kekuatan dalam jumlah."
 news.289.c: "Itu tidak akan berguna bagi mereka!"
 news.289.e: "Perang meningkat..."
 news.289.f: "Aliansi kami semakin kuat."
 generic.5.t: "[From.GetNameDefCap] mengundang [Root.GetNameDef] ke [From.GetFactionName]"
 generic.5.d.a: "Dengan tatapan waspada terhadap perkembangan politik dunia belakangan ini, [alliance_inviter.GetNameDef] mengulurkan tangan persahabatan kepada kita, menawarkan perlindungan mereka dan mendesak kita untuk berdiri bersama mereka membela prinsip-prinsip kemerdekaan dan demokrasi. Sebagai anggota [alliance_inviter.GetFactionName], kebebasan rakyat kita niscaya dapat terlindungi."
 generic.5.d.b: "Menyadari bahwa adakalanya pihak yang kuat pun membutuhkan sekutu, pihak [alliance_inviter.GetAdjective] telah mengundang kita untuk bergabung dengan [alliance_inviter.GetFactionName]. Jika kita memilih menerimanya, hal ini dapat membuka peluang luas bagi kita untuk meraih kejayaan kita sendiri."
 generic.5.d.c: "Sekutu ideologis kita di [alliance_inviter.GetNameDef] telah mencatat kontribusi berharga kita bagi perjuangan kaum buruh, dan pagi ini kita menerima undangan untuk bergabung dengan [alliance_inviter.GetFactionName]. Berdiri berdampingan dengan republik sosialis lainnya, kita dapat mengobarkan revolusi dengan kekuatan baru."
 generic.5.d.e: "Tampaknya pihak [alliance_inviter.GetAdjective] menganggap kita memiliki nilai strategis bagi mereka, dan memandang bahwa lebih menguntungkan bagi kita untuk bekerja sama ketimbang terpecah belah oleh perbedaan ideologi. Pagi ini, Duta Besar [alliance_inviter.GetAdjective] menyampaikan undangan bagi kita untuk menjadi negara anggota [alliance_inviter.GetFactionName]."
 generic.5.a: "Kami akan mengambil sikap bersama mereka."
 generic.5.b: "Kita hanya perlu beberapa ribu orang mati..."
 generic.5.c: "Kami akan bertarung bersama rekan-rekan kami!"
 generic.5.e: "Ini adalah pilihan yang menguntungkan."
 generic.6.t: "[alliance_applicant.GetNameDefCap] menerima undangan ke [alliance_inviter.GetFactionName]"
 generic.6.d: "[alliance_applicant.GetNameDefCap] telah memutuskan untuk menerima tawaran kita untuk bergabung dengan [alliance_inviter.GetFactionName]. Mulai saat ini kita akan berdiri atau gugur bersama-sama."
 generic.7.t: "[alliance_applicant.GetNameDefCap] menolak tawaran untuk bergabung dengan [alliance_inviter.GetFactionName]"
 generic.7.d: "[alliance_applicant.GetNameDefCap] telah memutuskan untuk menolak tawaran kita untuk bergabung dengan [alliance_inviter.GetFactionName]. Kita harus berjuang tanpa bantuan mereka."
 generic.7.a: "Bantuan kami tidak diinginkan."
 news.290.t: "Otto Kenakan Mahkota Hungaria"
 news.290.desc: "Demi mencari raja yang pantas, Kerajaan Hungaria melayangkan undangan kepada Otto von Habsburg untuk kembali ke tanah yang belum lama ini diperintah oleh dinastinya. Otto, yang hidup dalam pengasingan di seantero Eropa Barat sejak akhir Perang Besar dan runtuhnya imperium sang ayah, memutuskan untuk menerima pinangan tersebut. Hari ini, di tengah kemeriahan dan perayaan akbar, ia dinobatkan sebagai Raja Hungaria dalam upacara khidmat di Istana Kerajaan di Budapest.\n\nDalam pidato penobatannya, Raja Otto mengucapkan terima kasih kepada rakyat Hungaria atas kesetiaan dan pengabdian mereka, serta bersumpah untuk menyatukan kembali wilayah Habsburg, dengan janji bahwa kali ini Hungaria akan menjadi pilar utama yang paling dominan."
 news.290.a: "Bukan lagi kerajaan hanya sekedar nama."
 news.290.b: "Itu adalah pembicaraan yang berbahaya..."
 news.290.c: "Perlombaan untuk Austria telah dimulai!"
 news.290.e: "Akankah Kekaisaran bangkit kembali?"
 news.291.t: "Austria Memilih Bersatu dengan Hungaria"
 news.291.desc: "Atas desakan bangsa Hungaria, Austria telah menggelar referendum terkait kemungkinan reunifikasi kedua bangsa di bawah naungan takhta Habsburg. Penghitungan akhir hampir rampung, namun sudah dapat dipastikan kemenangan telak berada di pihak kubu reunifikasi. Tidak ada kecurangan yang dilaporkan dalam proses pemungutan suara, dan pemerintah Austria kini berkewajiban merombak diri menjadi pemerintahan daerah di bawah negara Hungaria.\n\nKendati langkah ini disambut dengan sukacita oleh publik Hungaria, dampak politik dari referendum ini dipastikan akan bergema kuat di seluruh penjuru Eropa."
 news.291.a: "Ikatan persaudaraan kita belum dilupakan."
 news.291.b: "Hal ini tidak akan berjalan tanpa dampak..."
 news.291.c: "Kekosongan kekuasaan Kekaisaran mungkin masih terisi..."
 news.292.desc: "Atas desakan Hongaria, Austria mengadakan referendum mengenai kemungkinan reunifikasi kedua negara, di bawah mahkota Habsburg. Penghitungan akhir hampir selesai, namun sudah jelas bahwa ini merupakan kemenangan telak bagi kubu reunifikasi. Ada banyak laporan mengenai inkonsistensi, kecurangan pemilu, dan kecurangan pemilu, namun para pejabat Austria telah menepis tuduhan tersebut dan sudah mulai melakukan reformasi pemerintahan menjadi pemerintahan regional di negara bagian Hongaria.\n\nMeskipun langkah ini disambut baik oleh masyarakat Hongaria, dampak politik dari referendum tersebut kemungkinan besar akan sangat terasa di seluruh Eropa."
 news.292.a: "Ikatan persaudaraan dan beberapa suap berguna..."
 news.292.b: "Itu adalah rencana kami!"
 news.292.c: "Kekosongan kekuasaan Kekaisaran mungkin masih terisi..."
 news.292.e: "Penghinaan terhadap demokrasi!"
 news.293.t: "Austria Tolak Reunifikasi"
 news.293.desc: "Atas desakan bangsa Hungaria, Austria telah melangsungkan referendum mengenai kemungkinan unifikasi kedua bangsa di bawah naungan Habsburg. Penghitungan suara hampir tuntas, namun kemenangan bagi kubu reunifikasi sudah mustahil tercapai. Oleh karena itu, pemerintah Austria memutuskan untuk menolak bergabung dalam uni Austria-Hungaria.\n\nDalam semangat demokrasi dan hak menentukan nasib sendiri, pihak Hungaria berbesar hati menerima hasil tersebut dan memutuskan untuk tidak memaksakan usulan mereka lebih jauh."
 news.293.a: "Sangat disayangkan."
 news.293.b: "Kemerdekaan kita terjamin!"
 news.293.c: "Luar biasa... Giliran kita selanjutnya."
 news.293.e: "Kalau begitu, jatuhnya Kekaisaran bersifat permanen."
 news.294.t: "Austria Tolak Reunifikasi"
 news.294.desc: "Atas desakan pihak Hungaria, Austria telah mengadakan referendum mengenai penyatuan kedua negara di bawah mahkota Habsburg. Penghitungan akhir hampir selesai, namun kemenangan kubu pro-unifikasi telah dipastikan pupus. Oleh sebab itu, pemerintah Austria menolak bergabung dalam perserikatan Austria-Hungaria.\n\nNamun demikian, Hungaria menuduh pemerintah Austria telah mencurangi pemilu demi menggagalkan unifikasi. Mereka menyatakan tidak akan ragu menggunakan kekuatan militer guna membela kehendak rakyat Austria yang ingin bersatu kembali dengan saudara Hungaria mereka. Kedua belah pihak kini mulai memobilisasi angkatan bersenjatanya, dan perang tampak tak terelakkan."
 news.294.a: "Apa sajakah kematian bagi sebuah Kekaisaran?"
 news.294.b: "Kami akan mempertahankan Wina sampai orang terakhir!"
 news.294.c: "Ini merusak semua rencana kami..."
 news.294.e: "Semoga konflik ini tidak meluas."
 news.295.t: "Restorasi Austria-Hungaria"
 news.295.desc: "Seiring tuntasnya penyatuan kembali Austria dan Hungaria, pemerintah Hungaria menghimpun pers internasional di Budapest dan memproklamasikan pemulihan Kekaisaran Austria-Hungaria.\n\nRaja Otto telah memangku gelar sahnya sebagai Kaisar Austria, serta mengulangi sumpahnya bahwa meski saat ini kekaisaran barulah bayang-bayang dari kejayaan masa lalunya, ia tidak akan beristirahat hingga seluruh tanah Habsburg dipersatukan kembali. Negara-negara tetangga mereka tentu memandang manuver di Budapest ini dengan penuh rasa curiga."
 news.295.a: "Seperti burung phoenix dari abu."
 news.295.b: "Ini sangat mengubah situasi..."
 news.295.c: "Apakah mereka akan menjadi teman atau musuh?"
 news.295.e: "Sebaiknya kita membentengi perbatasan kita..."
 news.296.t: "Wilhelm Kenakan Mahkota Hungaria"
 news.296.desc: "Dalam ikhtiar mencari seorang raja bagi bangsa mereka, pihak Hungaria, setelah negosiasi dan persiapan panjang, secara resmi mengundang Pangeran Swedia Wilhelm, Adipati Södermanland, awal pekan ini. Hari ini, di tengah kemeriahan dan perayaan akbar, ia dinobatkan sebagai Raja Hungaria dalam upacara khidmat di Istana Kerajaan di Budapest.\n\nKonon sang Raja baru sangat memedulikan kesejahteraan rakyatnya dan menjunjung tinggi hak-hak demokratis mereka. Selain itu, ia lebih mengedepankan dialog ketimbang permusuhan dengan negara-negara tetangga Hungaria. Dengan demikian, sang Raja baru berpeluang besar menjadi pembawa angin segar dalam meredakan ketegangan di kawasan tersebut."
 news.296.b: "Yang lemah lainnya bangkit."
 news.296.c: "Satu lagi yang membawa obor."
 news.297.t: "Friedrich Franz Kenakan Mahkota Hungaria"
 news.297.desc: "Demi mencari seorang raja bagi negeri mereka, pihak Hungaria, melalui proses perundingan dan persiapan yang panjang, secara resmi mengundang bangsawan Jerman Friedrich Franz, Adipati Agung Mecklenburg-Schwerin, awal pekan ini. Hari ini, di tengah gegap gempita pesta rakyat, ia dinobatkan sebagai Raja Hungaria dalam prosesi khidmat di Istana Kerajaan di Budapest.\n\nSebagai anggota SS sejak 1931, kecondongan ideologi sang Raja baru sudah menjadi rahasia umum, dan ia telah menegaskan tekadnya untuk 'membawa Hungaria menuju kejayaan yang selayaknya, berapa pun harga yang harus dibayar'. Berpadu dengan janji sang Raja untuk 'menghapus ketidakadilan yang menimpa kita di masa lampau', penobatan ini tampaknya mustahil akan meredakan ketegangan di kawasan tersebut."
 news.297.b: "Perkembangan yang sangat meresahkan..."
 news.297.c: "Sekutu potensial baru!"
 news.298.t: "[HUN.GetName] Ingkari Perjanjian Trianon"
 news.298.desc: "Dalam pernyataan terbuka di hadapan publik, [HUN.GetLeader] telah membatalkan secara sepihak perjanjian yang dipaksakan oleh kekuatan Sekutu usai Perang Besar. Ditandatangani oleh bangsa [HUN.GetAdjective] di bawah tekanan protes pada tahun 1920, perjanjian tersebut memangkas drastis wilayah negara serta membatasi kekuatan militernya.\n\nDalam pidatonya, [HUN.GetLeader] mengisyaratkan bahwa Hungaria tak lama lagi akan menegaskan kembali klaim mereka atas tanah-tanah yang dirampas dari mereka dua dekade silam."
 news.298.a: "Penghinaan sudah berakhir, tapi tidak dilupakan!"
 news.298.b: "Mereka ikut campur dalam tatanan dunia..."
 news.298.c: "Mereka telah lolos dari kuk Versailles."
 news.299.t: "Hungaria Proklamasikan Hungaria Raya"
 news.299.desc: "Setelah merebut kembali tanah-tanah yang dirampas dari mereka dalam Perjanjian Trianon, [From.GetLeader] mengeluarkan proklamasi kemarin petang bahwa negeri tersebut mulai saat ini akan dikenal sebagai Hungaria Raya. Langkah ini diharapkan mampu mengangkat prestise Hungaria Raya di mata dunia, sekaligus mencerminkan bentang perbatasannya yang kini kian meluas."
 news.299.a: "Dunia akan melihat kekuatan kita."
 news.299.b: "Mereka agak terlalu percaya diri."
 news.300.t: "[HUN.GetNameDefCap] Tuntut Transilvania"
 news.300.desc: "Dalam ikhtiar untuk semakin membalikkan isi Perjanjian Trianon, [HUN.GetNameDef] telah melayangkan ultimatum kepada [ROM.GetNameDef] yang menuntut pengembalian Transilvania. Belum ada tanggapan resmi yang diberikan, namun [HUN.GetNameDef] telah mengisyaratkan bahwa opsi kekuatan senjata akan ditempuh apabila tuntutan mereka ditolak."
 news.300.a: "Kita akan no longer be cowed!"
 news.300.b: "Kita harus think fast..."
 news.300.c: "Mari kita berharap mereka menyelesaikannya dengan damai."
 news.301.t: "[ROM.GetNameDefCap] Kembalikan Transilvania"
 news.301.desc: "[ROM.GetNameDefCap] mengumumkan bahwa mereka menerima tuntutan [HUN.GetAdjective] atas pengembalian Transilvania. Dengan demikian, wilayah tersebut kini telah dipersatukan kembali dengan negeri itu, melipatgandakan luas wilayah serta kekuatannya. Sangat kecil kemungkinan bahwa keberhasilan sebesar ini akan membendung bangsa Hungaria untuk melancarkan tuntutan lanjutan atas sisa wilayah mereka yang masih hilang."
 news.301.a: "Kita berada di jalan menuju kehebatan!"
 news.301.b: "Kita tidak memiliki pilihan lain."
 news.301.c: "Setidaknya perdamaian tetap terjaga."
 news.302.t: "Rumania Tolak Tuntutan [HUN.GetAdjective]"
 news.302.desc: "Batas waktu ultimatum telah berlalu tanpa ada jawaban dari Rumania. Para pejabat [HUN.GetAdjective] yang marah telah mengecam pemerintah Rumania, mengklaim bahwa mereka 'mengganggu stabilitas kawasan' dengan desakan mereka untuk mematuhi 'perjanjian yang melanggar hukum'. Kedua negara tampaknya bersiap menghadapi perang yang bisa saja meletus kapan saja."
 news.302.a: "Jika kekuatan adalah segalanya, mereka akan mendengarkan..."
 news.302.b: "Biarkan mereka datang!"
 news.302.c: "Orang bodoh berkepala batu..."
 news.303.t: "Hungaria Tuntut Slowakia Selatan"
 news.303.desc: "Melanjutkan ikrar mereka untuk memulihkan keadilan atas Perjanjian Trianon, Hungaria telah menuntut penyerahan Slowakia Selatan dari [From.GetName]. Pihak [From.GetAdjective] belum memberikan tanggapan resmi, namun aroma ancaman perang dalam retorika [HUN.GetAdjective] teramat kentara. Penolakan terhadap tuntutan ini kemungkinan besar akan menyulut perang baru di kawasan tersebut."
 news.303.a: "Mereka seharusnya beruntung, hanya ini yang kami minta."
 news.303.b: "Mari kita berharap kita dapat menemukan kompromi..."
 news.304.t: "[From.GetName] Kembalikan Slowakia Selatan"
 news.304.desc: "[From.GetName] secara resmi menerima tuntutan [HUN.GetAdjective] untuk mengembalikan Slowakia Selatan, dan telah mengambil langkah kilat guna memastikan wilayah tersebut segera diserahkan kembali kepada Hungaria. Kemenangan ini tampaknya tidak akan meredam ambisi bangsa [HUN.GetAdjective] untuk menuntut sisa tanah air mereka yang masih terlepas."
 news.304.a: "Kami menyambut mereka kembali."
 news.305.t: "[From.From.GetName] Tolak Tuntutan [HUN.GetAdjective]"
 news.305.desc: "Perundingan diplomatik telah menemui jalan buntu, dan hari ini [From.From.GetName] secara terbuka menolak tuntutan [HUN.GetAdjective] atas penyerahan Slowakia Selatan. Pejabat [HUN.GetAdjective] yang berang mengecam keras pemerintah [From.From.GetName], mendakwa mereka 'merusak stabilitas kawasan' karena bergeming mempertahankan 'perjanjian haram'. Kedua bangsa kini tengah bersiap menghadapi perang yang siap meletus setiap saat."
 news.306.t: "Hungaria Tuntut Vojvodina"
 news.306.desc: "Didorong oleh keberhasilan mereka merebut kembali tanah-tanah yang hilang sebelumnya, bangsa [HUN.GetAdjective] kini menuntut Yugoslavia mengembalikan Vojvodina. Di saat pihak Yugoslavia berupaya mencari solusi diplomatik, ketidaksabaran [HUN.GetAdjective] kian hari kian nyata, dan apabila Yugoslavia menolak tuntutan tersebut, jalan damai dipastikan mustahil tercapai."
 news.306.a: "Perjalanan menuju Hongaria Raya terus berlanjut."
 news.306.b: "Kita harus think fast..."
 news.307.t: "Yugoslavia Kembalikan Vojvodina"
 news.307.desc: "Yugoslavia memutuskan untuk menyerah pada tuntutan [HUN.GetAdjective], dan telah mengatur penyerahan kilat Vojvodina kepada sang tetangga. Meski proses ini diwarnai diplomasi kapal meriam (gunboat diplomacy), tak dapat dimungkiri bahwa Hungaria kini telah menjelma menjadi kekuatan adidaya baru di kawasan tersebut."
 news.307.a: "Kemenangan diplomatik lainnya!"
 news.308.t: "Yugoslavia Tolak Tuntutan [HUN.GetAdjective]"
 news.308.desc: "Dalam aksi perlawanan yang nyata, pihak Yugoslavia menolak mentah-mentah tuntutan [HUN.GetAdjective] atas Vojvodina. Hungaria sendiri sama sekali tidak berniat mengendurkan ancaman penggunaan kekuatan militer demi mengamankan 'wilayah sahnya'. Kedua negara kini bersiap menghadapi perang yang bisa meletus kapan saja."
 news.309.t: "Hungaria Klaim Pertuanan atas Slowakia"
 news.309.desc.a: "[HUN.GetAdjective] telah mengajukan klaim bahwa Slovakia harus kembali menjadi bagian dari negara mereka, baik sebagai bagian integral atau sebagai wilayah otonom. Ultimatum mengenai hal ini telah dikeluarkan, didukung dengan ancaman kekerasan, dan diplomat dari beberapa negara Eropa sedang sibuk mencari solusi damai terhadap krisis terbaru ini."
 news.309.desc.b: "[HUN.GetAdjective] telah mengajukan klaim bahwa Slovakia harus kembali menjadi bagian dari negara mereka, baik sebagai bagian integral atau sebagai wilayah otonom. Ultimatum mengenai hal ini telah dikeluarkan, didukung dengan ancaman kekerasan, dan pemerintah Slovakia sedang berusaha keras untuk menemukan solusi diplomatis terhadap krisis [HUN.GetAdjective] terbaru ini."
 news.309.a: "Semoga saja kekerasan tidak diperlukan."
 news.309.b: "Ini bukan permintaan kecil..."
 news.309.c: "Apakah kita bersedia berpisah dengan kemerdekaan kita?"
 news.310.t: "[From.GetName] Tunduk kepada Hungaria"
 news.310.desc.a: "Setelah banyak pertimbangan, Pemerintah [From.GetAdjective] di bawah [From.GetLeader] telah memutuskan untuk menyerah pada tuntutan [HUN.GetAdjective]. Mereka telah menerima kendali [HUN.GetAdjective] atas Slovakia, dan lebih memilih untuk menenangkan [HUN.GetLeader] demi menjaga perdamaian. Tidak diragukan lagi, hal ini akan memperkuat tekad [HUN.GetAdjective] dalam menghadapi tetangga mereka yang lemah di masa depan."
 news.310.desc.b: "Setelah banyak pertimbangan, rakyat Slovakia memutuskan untuk menyerah pada tuntutan [HUN.GetAdjective]. Karena tidak punya pilihan lain, mereka berpisah dengan kemerdekaan mereka demi mempertahankan kehidupan rakyatnya. Tidak diragukan lagi, hal ini akan memperkuat tekad [HUN.GetAdjective] dalam menghadapi tetangga mereka yang lemah di masa depan."
 news.310.a: "Orang Slovakia lebih baik dengan cara ini."
 news.310.b: "Itu adalah pengorbanan yang perlu."
 news.311.t: "[From.From.GetName] Tolak Tuntutan [HUN.GetAdjective]"
 news.311.desc.a: "Krisis diplomatik telah meletus antara Jerman dan Hongaria terkait nasib Slovakia. [HUN.GetLeader] sebelumnya telah menyatakan bahwa Slovakia adalah kepentingan utama [HUN.GetNameDef], karena ikatan historisnya dengan Hongaria. Pemerintahannya diharapkan diajak berkonsultasi mengenai tindakan apa pun terkait Slovakia.\n\nPemimpin Jerman [GER.GetLeader] menolak untuk menerima tuntutan tersebut, dan menyebutnya sebagai \"campur tangan yang bodoh dan berbahaya dalam urusan dalam negeri sebuah negara berdaulat.\""
 news.311.desc.b: "Berpegang teguh pada kemerdekaan mereka, Slovakia telah menolak tuntutan [HUN.GetAdjective], dan memperkuat perbatasan mereka. Hongaria tidak melakukan upaya untuk meredakan ketegangan, dan kedua negara tampaknya akan berperang."
 news.311.b: "Kami berdiri sebagai satu. Biarkan mereka datang!"
 news.312.t: "Pembaruan Protokol Roma"
 news.312.desc.a: "Atas dorongan [HUN.GetAdjective], [ITA.GetNameDef], [AUS.GetNameDef] dan [HUN.GetNameDef] telah memperbarui Protokol Roma yang semula ditandatangani pada tahun 1934. Perjanjian tersebut berkaitan dengan pembangunan ekonomi dan pemulihan hubungan. Pada dasarnya merupakan deklarasi persahabatan, terdapat tanda-tanda bahwa hal ini dapat mengarah pada aliansi resmi yang bertujuan untuk melawan kecenderungan revisionis dan ekspansionis yang semakin meningkat dari [GER.GetNameDef]."
 news.312.desc.b: "Atas dorongan [HUN.GetAdjective], [ITA.GetNameDef] dan [HUN.GetNameDef] telah memperbarui Protokol Roma yang semula ditandatangani pada tahun 1934. Perjanjian tersebut berkaitan dengan pembangunan ekonomi dan pemulihan hubungan. Pada dasarnya merupakan deklarasi persahabatan, terdapat tanda-tanda bahwa hal ini dapat mengarah pada aliansi resmi yang bertujuan untuk melawan kecenderungan revisionis dan ekspansionis yang semakin meningkat dari [GER.GetNameDef]."
 news.312.a: "Kami menyambut teman baru kami."
 news.312.b: "Ini bukan pertanda baik..."
 news.312.c: "Mungkin hal-hal baik akan muncul dari sini."
 news.313.t: "Pakta Roma Terbentuk"
 news.313.desc.a: "Hari ini, masing-masing pemerintah Italia, Austria dan Hongaria mengeluarkan pernyataan bersama yang mengumumkan pembentukan Pakta Roma. Ketiga negara tersebut telah berjanji untuk saling membantu secara militer baik secara defensif maupun ofensif, jika diperlukan. Keseimbangan kekuatan di kawasan ini telah berubah secara drastis dalam sekejap."
 news.313.desc.b: "Hari ini, masing-masing pemerintah Italia dan Hongaria mengeluarkan pernyataan bersama yang mengumumkan pembentukan Pakta Roma. Kedua negara telah berjanji untuk saling membantu secara militer baik secara defensif maupun ofensif, jika diperlukan. Keseimbangan kekuatan di kawasan ini telah berubah secara drastis dalam sekejap."
 news.313.a: "Kami berdiri bersama."
 news.313.b: "Hal inilah yang menjadi kekhawatiran..."
 news.313.c: "Jerman bukan lagi tanpa perlawanan."
 news.314.t: "Horthy Dibunuh"
 news.314.desc: "Laporan muncul dari Hongaria bahwa Miklos Horthy ditembak oleh seorang pria bersenjata hari ini setelah meninggalkan gedung Parlemen di Budapest. Meskipun ia segera dilarikan ke rumah sakit, dokter mengumumkan bahwa ia sudah meninggal pada saat ia tiba. Pria bersenjata tersebut, yang ditembak oleh polisi ketika ia mencoba melarikan diri dari lokasi kejadian, telah diidentifikasi sebagai anggota partai komunis.\n\nPembunuhan tersebut telah menyebabkan keributan dalam politik [HUN.GetAdjective] dalam negeri, karena kecenderungan Horthy yang anti-komunis sangat penting dalam mencegah unsur-unsur revolusioner. Tanpa laksamana lama yang memimpin panggung politik, kemungkinan besar pengaruh komunis akan meningkat secara dramatis."
 news.314.a: "Kehidupan seorang pria hanyalah harga kecil yang harus dibayar."
 news.314.b: "Revolusi tidak dapat dihentikan!"
 news.314.c: "Bisakah komunis merosot lebih rendah lagi?"
 news.315.t: "Austria Tolak Referendum"
 news.315.desc: "Austria secara tegas menolak desakan [HUN.GetAdjective] untuk menggelar referendum, kendati Hungaria memperlihatkan sikap yang kian agresif. Pihak Hungaria menuduh pemerintah Austria telah secara terang-terangan menginjak-injak hak-hak demokratis rakyatnya. Mereka menegaskan tidak akan segan-segan menggunakan kekuatan militer guna membela keinginan rakyat Austria untuk bersatu kembali dengan saudara mereka di [HUN.GetAdjective]. Kedua pihak kini telah memulai mobilisasi pasukan, dan perang tampak tak terelakkan."
 news.316.t: "Aliansi Polandia-Rumania"
 news.316.desc: "Pihak Polandia dan Rumania telah mengumumkan komitmen baru demi saling mempertahankan satu sama lain. Kendati hubungan harmonis telah terjalin antara kedua negara selama lebih dari satu dekade, pengumuman hari ini menandakan bahwa doktrin pertahanan bersama kian mendominasi perencanaan militer baik di Polandia maupun di Rumania."
 news.316.a: "Kami saling membutuhkan."
 news.316.b: "Mereka pikir itu akan menyelamatkan mereka?"
 news.316.c: "Semoga saja ini membuahkan hasil."
 news.317.t: "Kordon Saniter (Cordon Sanitaire)"
 news.317.desc: "Merujuk pada kian meningkatnya bahaya yang ditimbulkan oleh ideologi-ideologi ekstrem di sebelah timur dan barat mereka, pihak Rumania telah mengumumkan pembentukan Kordon Saniter (Cordon Sanitaire). Aliansi ini menyambut hangat siapa pun yang merasa tercekik oleh ancaman fasisme dan komunisme di Eropa Timur, dan sejumlah negara kini tengah mempertimbangkan untuk menggabungkan kekuatan mereka bersama Rumania."
 news.317.a: "Kami mengambil alih."
 news.317.b: "Kami mendukung Rumania."
 news.317.g: "Ini mengacaukan rencana kami..."
 news.317.e: "Inisiatif yang terpuji."
 news.317.f: "Sekarang siapa yang bermusuhan?"
 news.318.t: "Bulgaria Tunduk kepada Rumania"
 news.318.desc: "Menanggapi ultimatum Rumania, dan dihadapkan pada ancaman aksi militer kilat Rumania jika menolak, pihak Bulgaria telah melakukan perombakan besar-besaran dalam pemerintahan mereka agar lebih bersahabat dengan Rumania. Bulgaria telah menerima seluruh tuntutan tetangganya tersebut, dan kecil kemungkinan mereka akan menolak permintaan berikutnya. Akibatnya, negeri itu kini tak lebih dari sekadar boneka Rumania."
 news.318.a: "Mereka tahu apa yang terbaik bagi mereka."
 news.318.b: "Suatu tindakan yang perlu..."
 news.318.c: "Perkembangan yang meresahkan."
 news.319.t: "Bulgaria Tolak Tuntutan Rumania"
 news.319.desc: "Kendati telah dilayangkan ultimatum dan dihadapkan pada ancaman serbuan militer langsung dari Rumania jika menolak, Bulgaria tetap bergeming menolak tuntutan Rumania. Pihak Rumania sendiri enggan mundur selangkah pun, dan kedua negara kini berada di jalur pasti menuju bentrokan militer."
 news.319.a: "Mereka akan melihat betapa salahnya mereka."
 news.319.b: "Datang dan dapatkan!"
 news.319.c: "Namun Perang Balkan lagi...?"
 news.324.t: "Yugoslavia Tunduk kepada Rumania"
 news.324.desc: "Dihadapkan pada tuntutan Rumania untuk melakukan 'restrukturisasi drastis' atas negara mereka, serta ancaman kekuatan militer andai menolak, Yugoslavia tak melihat jalan lain selain bertekuk lutut. Namun demikian, 'restrukturisasi' yang diumumkan tersebut tidak hanya berujung pada pembagian wilayah Yugoslavia menjadi negara-negara bagian, melainkan juga pemasangan rezim boneka.\n\nSangat jelas bahwa kepentingan utama Rumania telah dipenuhi di balik kedok hak menentukan nasib sendiri, dan pengaruh Rumania di kawasan tersebut kian hari kian mencengkeram."
 news.324.a: "Benar-benar sebuah pukulan hebat!"
 news.324.b: "Sungguh licik."
 news.320.t: "Yugoslavia Tolak Tuntutan Rumania"
 news.320.desc: "Meskipun dihadapkan pada tuntutan Rumania untuk melakukan 'restrukturisasi drastis' atas negara mereka serta ancaman serbuan militer andai menolak, Yugoslavia menolak mentah-mentah ultimatum tersebut. Kendati tekanan bertubi-tubi dilancarkan terhadap negeri itu dari berbagai penjuru, bangsa Yugoslavia bertekad mempertahankan tanah air mereka habis-habisan hingga tetes darah penghabisan. Rumania kini telah menyatakan perang, dan bukan hal yang mustahil negara-negara lain akan turut serta dalam pembagian wilayah tersebut."
 news.320.a: "Mereka memintanya."
 news.320.b: "Datang dan dapatkan!"
 news.320.c: "Kami memperingatkan mereka."
 news.320.f: "Mereka tidak bisa berharap untuk bertahan lama."
 news.321.t: "Yugoslavia Dipecah-Belah"
 news.321.desc: "Atas hasutan Rumania, Yugoslavia telah dilayangkan ultimatum yang menuntut 'restrukturisasi negara mereka'. Dihadapkan pada kepungan tekanan dari beberapa negara tetangga sekaligus, pihak Yugoslavia tak memiliki pilihan selain menerima, dan proses pemecahbelahan negeri tersebut kini tengah berlangsung."
 news.321.a: "Kita harus berterima kasih kepada teman-teman kita."
 news.321.b: "Ini adalah ide yang bagus!"
 news.321.c: "bajingan serakah."
 news.321.e: "Kami tahu perasaannya..."
 news.322.t: "Kudeta di Rumania"
 news.322.desc: "Seiring ketidakpuasan terhadap kepemimpinan negara mencapai taraf yang mengkhawatirkan di Rumania, Pangeran Michael melancarkan kudeta dengan sokongan unsur-unsur penting militer. Laporan awal mengindikasikan kudeta tersebut berhasil, dan Raja Michael telah mengumumkan bahwa dirinya memangku peran sebagai kepala negara, bertekad memimpin Rumania keluar dari kemelut."
 news.322.a: "Ini adalah perubahan ke arah yang lebih baik."
 news.322.b: "Dia tampak lebih... Setidaknya sederhana."
 news.323.t: "Raja Carol II Turun Takhta"
 news.323.desc: "Di bawah desakan unsur-unsur berpengaruh di pemerintahannya, Raja Carol II dari Rumania tak memiliki pilihan selain mengumumkan dan menandatangani pengunduran dirinya. Penerusnya adalah Raja Michael, namun sebagian besar kekuasaan diktator yang sebelumnya dikuasai Carol telah dikembalikan kepada kabinet pemerintahan, sehingga kecil kemungkinan sang Raja muda dapat menggunakan kekuasaan mutlak seperti pendahulunya.\n\nMenyusul pengunduran dirinya, Carol dilaporkan telah menguras rekening banknya yang melimpah dan melarikan diri ke pengasingan, menetap di salah satu kawasan elite di Mexico City bersama wanita simpanannya, Magda Lupescu."
 news.323.a: "Selamat jalan."
 news.323.b: "Lucu."
 news.325.t: "Yugoslavia Klaim Bulgaria"
 news.325.desc: "Merujuk pada fondasi negara mereka sebagai 'persatuan bangsa Slavia Selatan', retorika Yugoslavia belakangan ini kian gencar mendesakkan keikutsertaan bangsa Bulgaria dalam persatuan tersebut. Kini, propaganda itu mengambil langkah drastis baru di mana Yugoslavia secara terang-terangan mengklaim seluruh wilayah Bulgaria. Seiring kedua bangsa menyiagakan kekuatan tempurnya, perang bisa pecah kapan saja."
 news.325.a: "Yugoslavia untuk semua orang Slavia!"
 news.325.b: "Kami siap untuk mereka!"
 news.325.c: "Powderkeg tidak pernah mengecewakan."
 news.326.t: "Banovina Kroasia"
 news.326.desc: "Akibat ketegangan berkepanjangan yang kian memanas dengan elemen nasionalis Kroasia, pemerintah Yugoslavia terpaksa memberikan otonomi yang lebih luas kepada bangsa Kroasia. Sebuah negara semi-independen baru, Banovina Kroasia, resmi dibentuk, dan kendati secara nominal masih merupakan bagian dari Yugoslavia, pengaruh kekuasaan pemerintah pusat di wilayah tersebut kini telah terpangkas drastis."
 news.326.a: "Itu perlu."
 news.326.b: "Hidup Kroasia!"
 news.326.c: "Awal Keruntuhan Yugoslavia?"
 news.327.t: "Yugoslavia Klaim Makedonia"
 news.327.desc: "Dengan tujuan menyatukan segenap bangsa Makedonia, Yugoslavia telah mengumumkan bahwa mereka kini memandang Makedonia Tengah sebagai bagian tak terpisahkan dari bangsa Yugoslavia. Untuk memperkuat klaim tersebut, divisi-divisi militer telah disiagakan di perbatasan, dan ancaman konflik bersenjata baru kini membayangi kawasan itu."
 news.327.a: "Semua orang Slavia Selatan adalah satu!"
 news.327.b: "Mereka dipersilakan untuk mencoba!"
 news.327.c: "Perkembangan yang meresahkan."
 news.328.t: "Yugoslavia Klaim Perbatasan Italia"
 news.328.desc: "Pemerintah Yugoslavia belakangan ini kian lantang mengecam perlakuan Italia terhadap minoritas Slavia di kawasan perbatasan Istria dan Zara. Hari ini mereka mengumumkan bahwa mereka memandang wilayah-wilayah tersebut, yang direbut Italia usai Perang Besar dan mayoritas dihuni oleh etnis Slavia, sebagai bagian integral dari bangsa Yugoslavia. Terlebih lagi, demi melindungi hak-hak penduduk di wilayah itu, pihak Yugoslavia menegaskan bahwa mereka tidak akan ragu menggunakan kekuatan militer."
 news.328.a: "Hanya di negara kita mereka akan aman."
 news.328.b: "Kami akan menghancurkan mereka jika mereka mencoba!"
 news.328.c: "Konflik lain sedang terjadi."
 news.329.t: "Yugoslavia Mengakui [SOV.GetNameDef]"
 news.329.desc: "Yugoslavia, bahkan jauh lebih gigih ketimbang negara-negara lain, selama bertahun-tahun menolak mengakui negara komunis [SOV.GetNameDef]. Namun, dengan pengumuman hari ini bahwa pemerintah Yugoslavia akan menjalin hubungan diplomatik resmi dengan Soviet mulai saat ini, kebijakan penolakan tersebut akhirnya berakhir. Apakah langkah ini menandakan terbukanya negara Yugoslavia terhadap pengaruh komunis masih harus dinanti, namun nada dalam pengumuman tersebut terdengar luar biasa bersahabat."
 news.329.a: "Mereka punya beberapa ide menarik."
 news.329.b: "Kami akan menunjukkannya kepada Revolusi."
 news.329.c: "Pengaruh Soviet menyebar..."
 news.330.t: "Kongres Buruh Pan-Slavia"
 news.330.desc: "Berselisih paham dengan aspek-aspek mendasar komunisme Soviet, pihak Yugoslavia telah menempuh pendekatan tersendiri terhadap ideologi tersebut. Alih-alih menjadi anggota Komintern, pemerintah Yugoslavia mengumumkan niat mereka untuk memimpin bangsa Slavia Selatan dalam memperjuangkan hak-hak kaum buruh. Tampaknya mereka akan segera berupaya merangkul negara-negara tetangga ke dalam barisan mereka, sebuah langkah yang dapat mengguncang perimbangan kekuatan di kawasan tersebut secara signifikan."
 news.330.a: "Kami akan memimpin sesama Slavia kami!"
 news.330.b: "Pemula kecil yang kurang ajar!"
 news.330.c: "Menarik..."
 news.330.e: "Mungkinkah ini membawa stabilitas?"
 excellent: "Luar biasa."
 unfortunate: "Sayangnya."
 traitors: "Pengkhianat!"
 stability.21.t: "Penghindaran Wajib Militer"
 stability.21.desc.a: "Laporan baru dari War Office menunjukkan penurunan tajam dalam jumlah tenaga kerja yang tersedia. Tampaknya jumlah rekrutan terbaru jauh lebih kecil dari perkiraan awal. Perbedaan tersebut saat ini sedang diselidiki, namun yang pertama mengarah pada sejumlah besar orang yang secara teknis layak untuk mengelola layanan untuk menghindari wajib militer melalui berbagai cara. Siswa berusia 18 tahun tiba-tiba menjadi pekerja terampil yang dipekerjakan di industri perang yang kritis, mantan atlet gagal dalam tes kebugaran dan dalam beberapa kasus, rekrutan menghilang begitu saja tanpa jejak.\n\nKetika orang ditangkap dan diinterogasi, mereka menunjuk pada kondisi buruk di tentara, perwira yang acuh tak acuh dan tidak ingin mati demi tujuan yang sia-sia. Para pemimpin militer menuntut tindakan keras terhadap orang-orang yang menghindari wajib militer, namun banyak orang di pemerintahan percaya bahwa memperbaiki kondisi kehidupan prajurit tamtama mungkin merupakan pendekatan yang lebih baik."
 stability.21.desc.b: "Respons pemerintah yang tidak efektif terhadap penolakan rancangan undang-undang tersebut hanya memperburuk masalah. Semakin banyak rekrutan yang tidak pernah muncul setelah menerima surat rancangan mereka. Kontra-Intelijen telah menyadap pamflet yang dibuat secara profesional yang memberi nasihat kepada masyarakat tentang cara menghindari wajib militer, menyarankan hal-hal seperti menyuap dokter untuk menyatakan bahwa calon yang direkrut tidak sehat secara medis. Pengecualian bagi ayah yang berkeluarga telah menyebabkan para janda perang yang memiliki anak dikerumuni dengan lamaran pernikahan, sementara jumlah orang yang mengajukan pengecualian karena alasan etis telah mencapai rekor tertinggi.\n\nPara pemimpin militer telah menyarankan untuk menghilangkan beberapa pengecualian terakhir dan membuat contoh dari beberapa orang yang melalaikan yang telah ditangkap. Pejabat lain di pemerintahan telah menyarankan agar kita meningkatkan rasa tanggung jawab warga negara kita dan menunjukkan konsekuensi dari kekalahan dalam perang ini."
 stability.21.desc.c: "Karena tanggapan pemerintah terhadap penghindaran rancangan undang-undang tidak memberikan dampak positif apa pun, semakin banyak orang mulai bertanya-tanya mengapa mereka harus mempertaruhkan diri mereka sendiri sementara orang lain tetap aman. Para rekrutan yang muncul sering kali melaporkan bahwa mereka dilecehkan atau diejek di jalanan sebagai orang bodoh yang berjuang demi tujuan yang gagal. Laporan mengenai para ibu yang melarang anak-anak mereka untuk mengikuti wajib militer tersebar dimana-mana, dan Kantor Perang telah menyampaikan laporan yang mengklaim bahwa mereka tidak lagi yakin berapa banyak orang yang harus mereka wajibkan, karena birokrasi mereka sudah mulai rusak karena tekanan dalam memproses semua tentara yang hilang tersebut."
 stability.21.a: "Tidak ada yang bisa dilakukan mengenai hal itu."
 stability.21.d: "Kita harus menangkap siapa pun yang terbukti menghindar dari wajib militer!"
 stability.21.e: "Kenaikan gaji bagi prajurit tamtama mungkin merupakan hal yang wajar."
 stability.21.f: "Sudah waktunya untuk mengambil tindakan yang lebih keras."
 stability.21.g: "Menarik rasa tanggung jawab masyarakat sebagai warga negara."
 stability.21.h: "Kita harus make an example."
 stability.21.i: "Kita harus memberi rakyat sesuatu untuk diperjuangkan."
 stability.22.t: "Pemogokan!"
 stability.22.desc.a: "Produksi di beberapa pabrik telah melambat drastis selama beberapa hari terakhir karena para pekerja mengumumkan pemogokan terhadap semua produksi perang. Menuntut \"Perdamaian dan Roti!\", mereka sejauh ini menolak semua upaya untuk menegosiasikan penyelesaian. Beberapa pihak di pemerintahan menganjurkan respons militer yang tajam, diikuti dengan eksekusi cepat terhadap para pemimpin kelompok yang dianggap sebagai agen musuh dan pengkhianat. Namun, para pegawai negeri lainnya merekomendasikan pendekatan yang lebih terukur, dengan menunjukkan bahwa tindakan keras bisa menjadi bumerang jika tentara yang terlibat tidak loyal seperti yang kita kira."
 stability.22.desc.b: "Upaya pemerintah untuk meyakinkan para pemogok agar kembali bekerja tampaknya tidak membuahkan hasil apa pun. Sebaliknya, pemogokan juga dilaporkan terjadi di pabrik-pabrik lain, dan beberapa pemogokan terakhir di lokasi kerja yang terkena dampak juga menyebabkan mereka berhenti bekerja setelah menghadapi kemarahan rekan-rekan mereka. Meskipun persediaan sejauh ini mampu meredam pukulan terhadap pasokan di garis depan, hanya masalah waktu saja sebelum penghentian produksi mulai mempengaruhi kemampuan kita untuk melakukan perang.\n\nKantor Perang sekali lagi mendesak pemerintah untuk bersikap keras terhadap para pemogok, namun faksi-faksi lain di dalam pemerintahan berpendapat bahwa menawarkan diri untuk bertemu dengan para pekerja di tengah jalan mungkin cukup untuk meyakinkan mereka untuk kembali bekerja."
 stability.22.desc.c: "Apa yang awalnya merupakan aksi industri di beberapa tempat terpencil kini telah menyebar ke seluruh negeri, bahkan mempengaruhi industri-industri yang hanya berhubungan dengan upaya perang dalam cara-cara tersier. Bahkan cara kerja pemerintah sendiri pun terkena dampaknya, karena semakin banyak pegawai tingkat rendah, kurir, dan supir yang menolak masuk kerja.\n\nDi banyak tempat, dewan pekerja telah mengambil alih gedung pabrik. Laporan dari polisi rahasia menunjukkan bahwa beberapa tempat sepertinya sudah mulai memproduksi senjata lagi - untuk pemberontakan besar-besaran melawan apa yang disebut \"Rezim Perang\".\n\nKomando Tinggi Militer percaya bahwa tindakan tegas oleh pasukan yang setia masih bisa menang, sementara pihak sipil dari pemerintah berpendapat bahwa hal ini berisiko menimbulkan perang saudara dan kekalahan tertentu."
 stability.22.a: "Ini akan reda."
 stability.22.b: "Lakukan demonstrasi kekuatan militer di kota-kota."
 stability.22.c: "Jadikan pahlawan propaganda dari masyarakat yang masih mau bekerja."
 stability.22.d: "Merekrut para pekerja ke dalam dinas militer dan menempatkan pabrik-pabrik di bawah kendali militer."
 stability.22.e: "Tawarkan untuk meningkatkan jatah makanan pekerja."
 stability.22.f: "Kirim pasukan, tangkap para pemogok, eksekusi pemimpinnya."
 stability.22.g: "Usulkan undang-undang kesejahteraan baru."
 stability.23.t: "Pembangkangan di Tubuh Angkatan Darat"
 stability.23.desc.a: "Berita mengkhawatirkan telah sampai ke Komando Tinggi Militer tentang sejumlah satuan di Angkatan Darat kita yang menolak perintah atasannya. Meskipun tidak ada unit yang meninggalkan posisinya di barisan, perwakilan tentara telah menegaskan dengan jelas bahwa mereka tidak akan mematuhi perintah apa pun untuk menyerang musuh.\n\nPemberontakan sejauh ini hanya dapat diatasi dengan sejumlah kecil batalion dan segelintir unit pelatihan dan pendukung, namun banyak orang di Kantor Perang khawatir bahwa pemberontakan ini akan segera menyebar ke unit lain dan pada akhirnya membuat kita tidak dapat melanjutkan perang. Diperlukan tindakan tegas."
 stability.23.desc.b: "Upaya untuk mengatasi pemberontakan di kalangan tentara tidak membuahkan hasil. Didorong oleh kurangnya respon pemerintah yang efektif, para pemberontak telah memperluas daftar tuntutan mereka dengan memasukkan gencatan senjata segera yang diikuti dengan perjanjian perdamaian komprehensif dan demobilisasi.\n\nKantor Perang sangat menyarankan agar kita mengirimkan sinyal yang kuat kepada para pemberontak untuk menghalangi tindakan lebih lanjut dari pihak mereka."
 stability.23.desc.c: "Karena pemerintah jelas-jelas tidak mau atau tidak mampu mengatasi permasalahan mereka, para pemberontak memutuskan untuk mengambil tindakan sendiri. Pemilihan untuk \"Dewan Pekerja dan Prajurit\" telah diumumkan, dengan tujuan untuk mengambil alih negara dan berdamai dengan musuh.\n\nKecuali tindakan diambil dengan cepat, dewan-dewan ini mungkin akan menggantikan pemerintahan kita di beberapa wilayah di negara ini dan membuat kita tidak dapat melanjutkan perang."
 stability.23.a: "Kami tidak bisa berbuat apa-apa sekarang."
 stability.23.b: "Kelilingi unit pemberontak dengan loyalis dan perintahkan mereka untuk mundur."
 stability.23.c: "Adakan pidato patriotik di hadapan para pemberontak."
 stability.23.d: "Umumkan secara terbuka bahwa siapa pun yang kedapatan mendukung pemberontak akan dituduh melakukan makar."
 stability.23.e: "Umumkan inisiatif perdamaian. Pastikan itu tidak bisa diterima oleh musuh."
 stability.23.f: "Memobilisasi milisi loyalis dan menangkap semua tentara yang tidak berada di tempat tugasnya."
 stability.23.g: "Tawarkan kepada tentara untuk mengizinkan mereka memilih perwira mereka sendiri."
 15_days_tt: "Ini akan memakan waktu sekitar §Y15 hari§! untuk diterapkan."
 30_days_tt: "Ini akan memakan waktu sekitar §Y30 hari§! untuk diterapkan."
 45_days_tt: "Ini akan memakan waktu sekitar §Y45 hari§! untuk diterapkan."
 stability.31.t: "Tindakan Keras Militer Berhasil"
 stability.31.desc: "Tindakan cepat kita terbukti sangat efektif. Unit-unit polisi militer, didukung oleh aparat penegak hukum setempat dan sukarelawan patriotik, bergerak serentak dalam operasi terkoordinasi rapi untuk mendatangi setiap calon wajib militer yang mangkir. Sebagian besar bersedia memenuhi panggilan ketika mereka diberitahu tentang konsekuensi hukum bila tidak melapor bertugas. Komando Tinggi Militer secara terbuka menyatakan bahwa siapa pun yang datang ke pos tugas mereka tidak akan didakwa dengan tindak pidana apa pun atau dihukum atas keterlambatan mereka di masa lalu. Kendati demikian, sejumlah orang yang secara mutlak menolak mengangkat senjata demi membela negaranya telah ditangkap."
 stability.31.a: "Tindakan tegas mencegah hal yang lebih buruk."
 stability.32.t: "Kerusuhan Anti-Wajib Militer"
 stability.32.desc: "Upaya kami untuk menyelesaikan situasi melalui kekuatan militer belum membuahkan hasil. Tampaknya seseorang di pemerintahan kami telah membocorkan rencana operasi kami kepada publik, dan mereka merespons dengan cepat. Ketika polisi militer dan lembaga penegak hukum lainnya mencoba menangkap para penghindar wajib militer, jalan mereka dihalangi oleh massa yang marah, menuntut diakhirinya perang dan wajib militer paksa. Dalam beberapa kasus, terjadi bentrokan jalanan antara polisi dan pengunjuk rasa, yang mengakibatkan sejumlah korban jiwa ketika tentara terpaksa menggunakan senjata mereka untuk membela diri. Butuh beberapa jam sampai polisi dapat mengendalikan situasi sepenuhnya.\n\nSuasana hati yang buruk telah menyelimuti ibu kota ketika barikade dibersihkan dan orang mati dikuburkan. Laporan dari Kantor Perang menunjukkan tidak ada perubahan dalam jumlah rekrutan yang melapor untuk bertugas. Banyak orang di pemerintahan bertanya-tanya berapa lama lagi kita bisa terus berjuang dalam situasi seperti ini."
 stability.32.a: "Situasinya belum tentu menguntungkan kita."
 stability.33.t: "Pemberontakan Anti-Wajib Militer"
 stability.33.desc: "Upaya kami untuk menyelesaikan situasi melalui kekuatan militer belum membuahkan hasil. Tampaknya seseorang di pemerintahan kami telah membocorkan rencana operasi kami kepada publik, dan mereka merespons dengan cepat. Ketika polisi militer dan lembaga penegak hukum lainnya mencoba menangkap para penghindar wajib militer, jalan mereka dihalangi oleh massa yang marah, menuntut diakhirinya perang dan wajib militer paksa. Dalam beberapa kasus, terjadi bentrokan jalanan antara polisi dan pengunjuk rasa, yang mengakibatkan sejumlah korban jiwa ketika tentara terpaksa menggunakan senjata mereka untuk membela diri.\n\nSituasi dengan cepat menjadi tidak terkendali setelah itu, ketika warga menyerbu tentara dan menyerbu kantor polisi untuk mempersenjatai diri. Beberapa kota di negara ini kini sedang melakukan pemberontakan bersenjata melawan pemerintah. Ironisnya, para pemberontak tampaknya tidak mempunyai masalah dalam menemukan tentara yang bersedia angkat senjata."
 stability.33.a: "Oh, jadi SEKARANG mereka ingin bertarung!?"
 stability.34.t: "Reformasi Wajib Militer Terbukti Efektif"
 stability.34.desc: "Langkah-langkah sosial yang dikeluarkan oleh pemerintah sebagai bagian dari proses reformasi kebijakan rekrutmen militer yang lebih besar terbukti sangat populer. Gaji yang lebih tinggi dan cuti yang lebih sering sering disebut-sebut sebagai manfaat baru yang terbesar, namun banyak juga yang menunjuk pada program baru pemerintah untuk mendukung para janda korban perang dan anak yatim piatu. Semakin sedikit laki-laki yang bisa membenarkan penolakan negara mereka terhadap warna kulit, dan dukungan publik terhadap para penghindar wajib militer sudah hampir hilang.\n\nMemang, baru-baru ini ada peningkatan dalam dukungan publik terhadap pemerintah karena semakin banyak orang menyadari bahwa cara hidup [Root.GetAdjective] sedang diserang."
 stability.34.a: "Keputusan yang bijaksana."
 stability.35.t: "Batalion Hukuman ke-591"
 stability.35.desc: "Melihat gentingnya situasi, Komando Tinggi Militer memutuskan bahwa diperlukan langkah-langkah yang lebih drastis guna menunjukkan bahwa mangkir dari kewajiban membela tanah air tidak akan ditoleransi. Saat fajar menyingsing, polisi militer menggerebek rumah sejumlah tokoh terkemuka dan berjejaring luas yang selama ini memanfaatkan pengaruh mereka untuk meloloskan orang lain dari wajib militer. Masih mengenakan pakaian tidur, mereka mendapati diri mereka langsung diwajibmiliterkan dan dikawal menuju barak di bawah penjagaan bersenjata, tempat mereka akan dihimpun ke dalam sebuah unit khusus tersendiri, guna mencegah penyebaran pengaruh subversif ke unit lainnya.\n\nKabar mengenai tindakan ini menyebar kilat, dan tampaknya sebagian besar orang yang selama ini meyakini bisa lolos dari surat panggilan wajib militer mulai berubah pikiran. Pos-pos pendaftaran di seantero negeri melaporkan lonjakan jumlah warga yang datang untuk menanyakan apa konsekuensinya jika seorang \"teman\" mereka yang sempat berniat kabur dari dinas kini menyerahkan diri secara sukarela."
 stability.35.a: "Mereka mungkin masih dapat menebus diri mereka sendiri."
 stability.36.t: "Elit Lokal Menyuarakan Protes"
 stability.36.desc: "Melihat parahnya situasi, Komando Tinggi Militer telah memutuskan bahwa tindakan yang lebih drastis diperlukan untuk menunjukkan bahwa menghindari kewajiban sipil untuk membela negara tidak akan ditoleransi. Saat fajar, polisi militer menggerebek rumah sejumlah orang yang dipilih dengan cermat, terkenal dan memiliki koneksi, yang telah menggunakan pengaruhnya untuk memungkinkan orang lain menghindari wajib militer. Masih mengenakan baju tidur, mereka mendapati diri mereka wajib militer. Keluarga mereka telah memobilisasi jaringan dukungan mereka yang luas untuk memprotes keputusan ini. Kantor Perang telah dibanjiri dengan telepon dan surat dari para pekerja biasa yang menginginkan manajer pabrik mereka kembali menjadi wakil sekretaris di berbagai kementerian lain, menuntut untuk mengetahui mengapa orang-orang yang bekerja di bidang-bidang yang penting bagi upaya perang telah dikeluarkan dari pekerjaan mereka. Tampaknya bahkan beberapa anggota kabinet berubah pikiran mengenai perang tersebut - mungkin takut akan keselamatan putra mereka sendiri."
 stability.36.a: "Apakah mereka tidak punya rasa tanggung jawab?"
 stability.37.t: "\"Kewajiban Suci Penuh Khidmat\""
 stability.37.desc: "\"\"Tentu saja aku ingin tetap hidup. Aku ingin menyelesaikan sekolah, aku ingin mengenal gadis-gadis, aku ingin membangun keluarga—tetapi jika kita kalah dalam perang ini, aku pun tidak akan bisa mewujudkan semua itu. Maka dari itu, aku berjuang.\"\n\nSurat tersebut, yang dikirimkan secara anonim ke setiap surat kabar terkemuka di negeri ini, telah menimbulkan kehebohan besar. Mengaku berasal dari seorang serdadu yang awalnya mencoba menghindar dari wajib militer, tetapi kemudian tersadar bahwa ia harus bertempur demi menyelamatkan bangsanya, pesan itu menyentuh sanubari banyak orang yang merasakan hal serupa. Dewan wajib militer di berbagai penjuru negeri melaporkan bahwa keengganan segelintir orang yang menolak panggilan telah tertutupi oleh membanjirnya sukarelawan baru yang tak lagi sudi menunggu dipanggil, sementara yang lain pergi bertempur demi menyelamatkan tanah air dan martabat bangsa mereka."
 stability.37.a: "Kami tidak akan membiarkan hidup mereka sia-sia."
 stability.38.t: "Akhir Sang Pengecut"
 stability.38.desc: "\"Mereka membawanya ke tembok saat fajar menyingsing. Dia menolak rokok terakhirnya, namun menerima penutup matanya. Kata-kata terakhirnya adalah permintaan maaf kepada ibunya karena telah menyebabkan ibunya begitu kesakitan. Regu tembak membidik dengan tepat. Beberapa menit kemudian, dokter yang hadir menyatakan dia meninggal.\""
 stability.38.a: "Sayang sekali hal ini harus terjadi."
 stability.39.t: "Martir Demi Perdamaian"
 stability.39.desc: "\"Mereka membawanya ke tembok saat fajar menyingsing. Dia menolak rokok terakhirnya, namun menerima penutup matanya. Kata-kata terakhirnya adalah permintaan maaf kepada ibunya karena telah menyebabkan ibunya begitu kesakitan. Regu tembak membidik dengan tepat. Beberapa menit kemudian, dokter yang hadir menyatakan dia meninggal.\""
 stability.39.a: "Segalanya belum tentu membaik."
 stability.40.t: "Kesepakatan Baru bagi [Root.GetNameDef]"
 stability.40.desc: "Dalam pidato yang disiarkan radio hari ini, [Root.GetLeader] mengumumkan apa yang disebutnya sebagai \"Revolusi Sosial\". Selama satu jam berikutnya, ia menyusun sistem reformasi yang menyentuh setiap aspek kehidupan sosial, menjanjikan setiap prajurit yang kembali mendapatkan pendidikan, pekerjaan bergaji tinggi, dan pensiun yang berlimpah. Ia juga mengumumkan program pembangunan besar-besaran untuk perumahan terjangkau bagi keluarga muda, yang dimulai pada hari penandatanganan gencatan senjata. Hal ini tampaknya mempunyai pengaruh yang signifikan terhadap moral secara umum. Kantor perekrutan di seluruh negeri melaporkan adanya wajib militer yang muncul dan menanyakan pilihan untuk memperluas layanan mereka di luar konflik saat ini, sementara yang lain menuntut penempatan di unit garis depan untuk memastikan manfaat tambahan."
 stability.40.a: "Dan kita membayar semua ini bagaimana...?"
 strikes_event.1.t: "Ketertiban Dipulihkan"
 strikes_event.1.desc: "Bergerak cepat, Komando Tinggi Militer memobilisasi sejumlah unit pelatihan untuk bertugas dan membentuk kelompok tentara sementara yang sedang cuti. Menggerakan formasi ini melewati gerbang pabrik mempunyai dampak yang diinginkan, karena sebagian besar pemogok tidak ingin memaksakan konfrontasi dengan konsekuensi yang berpotensi mematikan. Beberapa orang yang mencoba membujuk para prajurit untuk melakukan hal yang sama mendapati kata-kata mereka tidak banyak berpengaruh ketika para prajurit bertanya mengapa para pekerja di barisan belakang harus dibiarkan mengecewakan para prajurit di depan."
 strikes_event.1.a: "Memang kenapa."
 strikes_event.2.t: "Senin Berdarah"
 strikes_event.2.desc: "Bergerak cepat, Komando Tinggi Militer memobilisasi sejumlah unit pelatihan untuk bertugas dan membentuk kelompok tentara ad-hoc yang sedang cuti. Namun, memindahkan formasi ini ke kota-kota yang terkena dampak ternyata jauh lebih sulit dari yang diperkirakan, karena para pemogok memblokir jalur kereta api dan memaksa pasukan untuk berjalan kaki, sehingga memberi mereka cukup waktu untuk bersiap. Ketika pasukan kami mencapai pabrik-pabrik yang dibarikade, mereka menemukan para pemogok sudah siap menyerang mereka. Upaya untuk membersihkan jalan ditanggapi dengan serangan ganas oleh para pekerja yang melemparkan batu dan botol ke arah tentara.\n\nDalam beberapa kejadian, pasukan melepaskan tembakan untuk mempertahankan diri, menewaskan sejumlah pemogok dan melukai lebih banyak lagi. ini hanya membuat massa semakin marah, dengan teriakan \"Pembunuh!\" mengisi udara dari orang-orang di sekitar. Suasana di ibukota berubah secara dramatis berpihak pada para pemogok. Saat malam tiba, tentara mundur, membiarkan barikade tetap utuh.\n\nTidak ada upaya lebih lanjut untuk memaksakan situasi. Para pemogok tetap memegang kendali atas pabrik-pabrik, dan tidak ada pekerjaan yang dilakukan."
 strikes_event.2.a: "Tidak sesuai rencana."
 strikes_event.3.t: "Pahlawan di Lini Produksi"
 strikes_event.3.desc: "\"Perang industri lebih dari sekedar pergerakan perpecahan dan pengeboman pesawat. Ini lebih dari sekedar tugas seorang prajurit untuk berperang dan mati demi negaranya. Perang industri dimenangkan, pertama dan terutama, di pabrik-pabrik dan pengecoran logam. Meninggalkan pertempuran di jalur perakitan tidak lebih baik daripada meninggalkannya di garis depan. Dan kemenangan jalur perakitan harus dirayakan sama seperti kemenangan yang dimenangkan di garis depan.\""
 strikes_event.3.a: "Pahlawan satu dan semua."
 strikes_event.4.t: "Departemen Produksi Perang"
 strikes_event.4.desc: "[Root.GetLeader] hari ini mengumumkan beberapa perubahan kecil pada draf tersebut. Meskipun pekerja terampil sebelumnya dikecualikan dari wajib militer, pengecualian ini kini telah dihapus dan semua pria yang dikecualikan segera direkrut. Pada saat yang sama, Kantor Perang telah diberi wewenang untuk mengambil kendali langsung atas pabrik mana pun yang memproduksi barang-barang yang relevan dengan upaya perang jika pimpinan pabrik tersebut menunjukkan kurangnya kemampuan.\n\nPengumuman tersebut ditanggapi dengan pengunduran diri secara diam-diam di kota-kota yang terkena dampak, terutama setelah diumumkan bahwa siapa pun yang melawan akan diperlakukan sama seperti seorang prajurit yang menolak untuk mengikuti perintah. Ketika semangat kerja para pekerja di pabrik berada pada titik terendah, produksi telah dimulai kembali."
 strikes_event.4.a: "Seharusnya hal itu dilakukan sejak awal."
 strikes_event.5.t: "Negeri yang Membangkang"
 strikes_event.5.desc: "[Root.GetLeader] hari ini mengumumkan beberapa perubahan kecil pada draf tersebut. Meskipun pekerja terampil sebelumnya dikecualikan dari wajib militer, pengecualian ini kini telah dihapus dan semua pria yang dikecualikan segera direkrut. Pada saat yang sama, Kantor Perang telah diberi wewenang untuk mengambil kendali langsung atas pabrik mana pun yang memproduksi barang-barang yang relevan dengan upaya perang jika pimpinan pabrik tersebut menunjukkan kurangnya kemampuan.\n\nPengumuman tersebut disambut dengan gelak tawa di kota-kota yang terkena dampak, terutama setelah diumumkan bahwa siapa pun yang melawan akan diperlakukan sama seperti seorang prajurit yang menolak untuk mengikuti perintah. Polisi yang dikirim untuk menyampaikan rancangan pemberitahuan kepada para pekerja diminta untuk kembali dengan membawa lebih dari sekadar tinta di atas kertas."
 strikes_event.5.a: "Mungkin kita harus melakukannya."
 strikes_event.6.t: "Buruh yang Berguna"
 strikes_event.6.desc: "Tanpa menyebutkan pemogokan yang terjadi, [Root.GetLeader] hari ini mengumumkan bahwa pekerja di industri yang terkait dengan perang akan mendapatkan jatah tambahan berupa gula, kopi, dan daging untuk mempertahankan kekuatan mereka. Sayangnya, rumor bahwa pemerintah bersedia membagikan tambahan coklat ternyata tidak benar.\n\nSementara para pemimpin pemogokan berusaha untuk mencegah para pekerja kembali bekerja, sebagian besar tampaknya telah menerima bahwa \"Perdamaian dan Roti\" tidak akan pernah terjadi dan mereka senang hanya dengan roti."
 strikes_event.6.a: "Mereka lebih baik mendapatkan penghasilannya."
 strikes_event.7.t: "Operasi Black Oak"
 strikes_event.7.desc: "Pasukan berkumpul di luar kota semalaman, menjaga kebisingan dan disiplin ringan untuk menjaga unsur kejutan. Saat matahari mulai terbenam dan para pekerja yang menjaga barikade di pabrik-pabrik menantikan pertolongan pada shift siang hari, pasukan penyerang bergerak masuk. Para pekerja yang lelah menjadi lamban dalam mengorganisir perlawanan dan dengan cepat mengatasinya. Meninggalkan satu detasemen kecil untuk menjaga para tahanan, pasukan menyapu kota, menangkap semua orang yang ada dalam daftar pekerja pabrik yang dikenal. Menjelang siang, militer telah mengambil kendali penuh atas kota-kota tersebut dan memberlakukan jam malam. Diperkirakan tidak ada resistensi lebih lanjut. Mayoritas pekerja akan segera dibebaskan dengan syarat kembali bekerja, para pemimpin komplotan akan ditahan dan diadili. Hukuman mati diperkirakan akan dijatuhkan."
 strikes_event.7.a: "Ketertiban telah dipulihkan."
 strikes_event.8.t: "Pertempuran Oak Street"
 strikes_event.8.desc: "Pasukan berkumpul di luar kota pada malam hari, namun pencahayaan dan kebisingan yang buruk membuat mereka terkejut. Saat pasukan bergerak masuk, mereka mendapati para pekerja sudah waspada dan siap menghadapi mereka. Serangan pertama gagal dalam hujan batu yang dilempar. Serangan kedua dengan bayonet tertancap berhasil digagalkan dengan pertarungan tangan kosong yang brutal, menyebabkan puluhan orang tewas dan sekarat di jalanan.\n\nPara perwira yang bertanggung jawab telah mundur untuk mengkonsolidasikan kekuatan mereka, sementara para pekerja memperluas benteng mereka dan mempersenjatai diri dengan senjata yang tertinggal saat mundur. Pertempuran hari kedua diperkirakan akan terjadi besok, namun Komando Tinggi Militer tidak lagi percaya bahwa kemungkinan besar akan ada kemenangan."
 strikes_event.8.a: "Kami dengan cepat kehabisan pilihan."
 strikes_event.9.t: "Undang-Undang Perlindungan Hak-Hak Buruh"
 strikes_event.9.desc: "Ketika ketegangan meningkat di ibu kota, [Root.GetLeader] mengumumkan undang-undang baru untuk melindungi hak-hak pekerja bahkan di masa perang. Undang-undang tersebut mengamanatkan cuti sakit yang dibayar tanpa batasan, asuransi kecelakaan wajib bagi setiap pekerja, hak untuk bergabung dengan serikat pekerja mana pun, serta, untuk pertama kalinya, hak bagi perempuan pekerja untuk mendapatkan cuti melahirkan setelah melahirkan anak.\n\nMeskipun banyak orang di pemerintahan menganggap hal ini sebagai penyerahan sepenuhnya kepada para pemogok, hasilnya meyakinkan: pekerjaan telah dimulai kembali di semua pabrik."
 strikes_event.9.a: "Semoga ini cukup."
 mutiny_event.1.t: "Pembangkangan Militer Ditumpas"
 mutiny_event.1.desc: "Setelah beberapa jam perundingan yang menegangkan di gerbang barak dan di ruang galian garis depan, pemberontakan tentara kita telah berakhir. Dihadapkan pada kemungkinan pertarungan yang tidak dapat mereka menangkan, para pemberontak segera memutuskan untuk mundur.\n\nMasalah utama kemudian adalah nasib mereka yang menolak perintah. Komando Tinggi Militer telah memilih memberikan grasi dan meyakinkan para pemberontak bahwa mereka tidak akan dihukum berat. Beberapa contoh telah dibuat di mana beberapa tentara diturunkan pangkatnya lebih rendah dan dipindahkan ke unit lain."
 mutiny_event.1.a: "Mari kita berharap itu adalah yang terakhir."
 mutiny_event.2.t: "Gertakan Kosong"
 mutiny_event.2.desc: "Upaya untuk menakut-nakuti para pemberontak agar menyerah telah menjadi bumerang karena pasukan tidak menunjukkan rasa takut terhadap unit yang dikirim untuk menekan mereka. Dengan menggunakan keterampilan yang diasah di garis depan, mereka dengan cepat mengatur pertahanan posisi mereka yang akan membuat segala upaya untuk mengalahkan mereka menjadi sangat mahal.\n\nPara perwira yang memimpin unit loyalis telah mundur dan menunggu perintah lebih lanjut, namun keberhasilan kecil ini tidak diragukan lagi memperkuat tekad para pemberontak."
 mutiny_event.2.a: "Tidak ada yang bisa meramalkan hal ini."
 mutiny_event.3.t: "\"Apa yang Sebenarnya Kita Perjuangkan?\""
 mutiny_event.3.desc: "\"Bukan hal yang aneh bagi seorang prajurit untuk meragukan apakah apa yang dia lakukan benar-benar layak dilakukan. Adakah yang bisa membenarkan pengorbanan yang kami minta dari Anda? Bisakah kami benar-benar menuntut Anda untuk berpotensi mati dalam mengejar tujuan yang tidak akan pernah Anda lihat?\n\nSungguh disayangkan bahwa kita harus hidup di zaman kita dilahirkan. Takdir telah memutuskan bahwa kita harus berperang, untuk melindungi kebebasan kita, rumah kita, cara hidup [Root.GetAdjective] kita! Kita tidak memilih perang ini, hal itu dipaksakan pada kami! Anda tahu bahwa saya tidak akan meminta apa pun dari Anda yang saya sendiri tidak akan bersedia melakukannya, dan saya tahu bahwa Anda akan melakukan apa pun yang diperlukan untuk mengamankan kemenangan.\""
 mutiny_event.3.a: "Pidato yang bagus."
 mutiny_event.4.t: "Undang-Undang Pengkhianatan di Masa Perang"
 mutiny_event.4.desc: "Meskipun Kantor Perang melakukan yang terbaik untuk menjaga agar pemberontakan yang terjadi di angkatan bersenjata tidak diketahui secara luas, penyensoran surat hanya dapat dilakukan sejauh ini. Para prajurit yang sedang cuti dengan cepat menyebarkan berita bahwa tentara tidak mau lagi mengeluarkan darah yang sia-sia dalam perang ini.\n\nTanpa menyebutkan pemberontakan secara spesifik, [Root.GetLeader] hari ini mengumumkan bahwa pemerintah sekarang akan menganggap tindakan apa pun yang mencerminkan kurangnya komitmen terhadap perang sebagai makar.\n\nHukuman bagi makar sudah diketahui secara umum, dan dukungan publik terhadap para pemberontak tidak ada apa-apanya menguap. Berita tentang hal ini tentu saja tersebar luas. Melihat sedikitnya dukungan dari masyarakat umum, para prajurit diam-diam melanjutkan tugas mereka."
 mutiny_event.4.a: "Kita tidak perlu menjelaskan hal ini."
 mutiny_event.5.t: "Upaya Penindasan Buntu"
 mutiny_event.5.desc: "Meskipun Kantor Perang melakukan yang terbaik untuk menjaga agar pemberontakan yang terjadi di angkatan bersenjata tidak diketahui secara luas, penyensoran surat hanya dapat dilakukan sejauh ini. Para prajurit yang sedang cuti dengan cepat menyebarkan berita bahwa tentara tidak mau lagi mengeluarkan darah yang sia-sia dalam perang ini.\n\nUpaya pemerintah untuk membendung gelombang ini telah gagal total. Laporan dari Polisi Rahasia menunjukkan bahwa para pemberontak mempunyai dukungan kuat dari masyarakat umum, sehingga sulit bagi kita untuk mengisolasi dan menekan mereka."
 mutiny_event.5.a: "Sikap tidak hormat terhadap hukum ini sangat mengkhawatirkan."
 mutiny_event.6.t: "Tawaran Perdamaian [Root.GetAdjective]"
 mutiny_event.6.desc: "[Root.GetLeader] mengumumkan kepada pers hari ini bahwa tawaran perdamaian terbarunya telah gagal. Walaupun penyebab kejadian yang tidak menguntungkan ini sangat kompleks, tuntutan [Root.GetAdjective] agar pihak lain membayar semua kerugian yang ditimbulkan, melucuti senjata sepenuhnya dan secara terbuka mengakui bahwa merekalah yang memulai perang mungkin merupakan pukulan terakhir.\n\nMusuh kita telah memberikan tanggapan yang sama, menyebut permintaan wajar kita sebagai tuntutan penyerahan tanpa syarat. Mereka telah berjanji bahwa mereka akan melanjutkan perang ini sampai akhir yang pahit.\n\nDengan musuh-musuh kita yang jelas-jelas tidak mau melihat alasan dan berjanji untuk terus berjuang, upaya para pemberontak untuk memaksakan penyelesaian damai telah gagal."
 mutiny_event.6.a: "Rasa malu yang luar biasa."
 mutiny_event.7.t: "Tindakan Keras Militer Berhasil."
 mutiny_event.7.desc: "Terlepas dari beberapa insiden di mana kelompok-kelompok kecil pembangkang memilih untuk melawan, operasi kita untuk menumpas pemberontakan meraih keberhasilan gemilang. Mengandalkan keunggulan jumlah alih-alih kemahiran taktis, milisi loyalis mengepung kubu-kubu pertahanan pembangkang dan menuntut penyerahan diri mereka. Sebagian besar serdadu memutuskan untuk tidak mengangkat senjata melawan sesama anak bangsa dan menyerah secara damai.\n\nPara dalang pembangkangan akan diadili di mahkamah militer rahasia, namun prajurit biasa akan dikirim kembali ke garis depan, meski ditempatkan di unit berbeda guna mencegah terbentuknya sel-sel perlawanan baru."
 mutiny_event.7.a: "Bagus sekali."
 mutiny_event.8.t: "Saudara Melawan Saudara"
 mutiny_event.8.desc: "Upaya kami untuk mencegah pemilihan Dewan Pekerja dan Prajurit telah memperburuk situasi bahkan melebihi perkiraan yang paling pesimis sekalipun. Daripada menyerah, para pemberontak malah membentuk Dewan sementara, memilih komandan lapangan dan mendirikan pertahanan di jalanan. Jelas bahwa mereka bertujuan untuk melawan hal ini.\n\nPerpecahan dalam angkatan bersenjata kini terjadi di setiap unit dan sering kali bahkan di antara anggota keluarga yang sama. [Root.GetNameDefCap] berdiri di ambang perang saudara."
 mutiny_event.8.a: "Hal ini semakin memburuk."
 mutiny_event.9.t: "Generasi Baru Perwira"
 mutiny_event.9.desc: "Kendati mendapat penentangan keras dari kalangan petinggi militer, setiap unit di Angkatan Darat [Root.GetAdjective] menggelar pemilihan untuk menentukan komandan mereka sendiri. Hasilnya sangat mengejutkan, karena sebagian besar yang terpilih adalah serdadu berprestasi dengan segudang pengalaman lapangan. Meskipun banyak perwira karir masih menganggap hal ini sebagai penghinaan pribadi, tak dapat dimungkiri bahwa mayoritas prajurit sangat menyukai perubahan ini."
 mutiny_event.9.a: "Ini seharusnya tidak berhasil, bukan?"
 if_they_accept: "Jika mereka menerima:"
 if_they_reject: "Jika mereka menolak:"
 canada_vanilla.1.title: "Ronnie, Gadis Senapan Bren"
 canada_vanilla.1.desc: "Sekitar satu juta perempuan Kanada memasuki dunia kerja selama Perang Dunia Kedua. Mereka diwakili di media nasional oleh simbol ketahanan dan patriotisme: Veronica Foster, yang dikenal sebagai Ronnie, Bren Gun Girl. Dia bekerja untuk John Inglis and Company di pabrik senjata Toronto sementara ketiga saudara laki-lakinya bertempur di luar negeri. Poster dan film pendek yang menampilkan dia, dan perempuan seperti dia, berpartisipasi dalam upaya perang kemungkinan besar menginspirasi kampanye media yang lebih terkenal seputar 'Rosie the Riveter', setelah Amerika ikut serta dalam perang."
 canada_vanilla.1.opt: "'Pekerjaan pabrik tidak lebih sulit daripada pekerjaan rumah tangga', seperti yang dikatakan dalam film-film berita."
 usa.30.t: "Pemilihan Umum Kongres"
 usa.30.desc: "Setiap dua tahun, sepertiga kursi Senat dan seluruh kursi di Dewan Perwakilan Rakyat diperebutkan dalam pemilihan umum. Meski sering kali dibayangi oleh peristiwa-peristiwa dunia, situasi lokal di setiap daerah pemilihan terkadang dapat menjadi penentu.\n\nSetelah seluruh suara dihitung, faksi yang mendukung pemerintah [USA.GetSenateElectionOutcome] di Senat dan [USA.GetHouseElectionOutcome] di DPR."
 usa.30.a: "Masyarakat sudah angkat bicara."
 SenateElectionLost: "kehilangan [?sen_loc] kursi"
 SenateElectionGained: "memperoleh [?sen_loc] kursi"
 HouseElectionLost: "kehilangan [?ror_loc] kursi"
 HouseElectionGained: "memperoleh [?ror_loc] kursi"
 usa.31.t: "Pergeseran dalam Lanskap Politik"
 usa.31.desc: "Dengan dilantiknya presiden baru, kubu oposisi terdahulu di Kongres sebagian besar telah beralih mendukung administrasi baru. Presiden [USA.GetLeader] dapat mengandalkan dukungan dari [?senators_support] Senator dan [?representatives_support] Anggota Dewan."
 usa.31.a: "Masyarakat sudah angkat bicara."
 usa_congress_elections_tt_bad: "Dalam pemilu kongres, faksi pendukung pemerintah akan menghadapi oposisi yang lebih kuat."
 usa_congress_elections_tt_good: "Momentum yang didapat dari pemilu presiden kemungkinan besar akan terbawa ke pemilu kongres."
 usa.32.t: "Faksi Pemerintah Memenangkan Mayoritas di Kongres"
 usa.32.desc: "Tampaknya reformasi sistem pemilu yang kita berlakukan telah membuahkan hasil optimal, karena sejumlah besar pendukung kita terpilih ke Kongres dalam pemilu terakhir. Dengan mayoritas yang solid, kita seharusnya tidak kesulitan meloloskan agenda politik kita."
 usa.32.a: "Sebuah tanda yang jelas dari dukungan kami terhadap masyarakat."
 usa.40.t: "Senator Mendukung Usulan Pemerintah"
 usa.40.desc: "Dalam pemungutan suara terkini, seorang senator secara mengejutkan berpindah haluan untuk mendukung usulan pemerintah. Meskipun masalahnya sendiri tergolong kecil, suara dukungan terbuka dari sosok yang sebelumnya vokal mengkritik [USA.GetLeader] telah menarik perhatian banyak kalangan di Washington.\n\nBeberapa analis meyakini bahwa langkah ini akan mendorong senator-senator lain untuk mempertimbangkan kembali sikap mereka."
 usa.40.a: "Sekutu yang berguna."
 usa.41.t: "Anggota Dewan Bersuara Lantang Mendukung Pemerintah"
 usa.41.desc: "Saat ditanya mengenai pandangannya terhadap sejumlah isu kebijakan dalam sebuah jamuan makan malam penggalangan dana, seorang anggota dewan angkat bicara mendukung kebijakan Presiden [USA.GetLeader]. Ia lebih lanjut mengklaim bahwa banyak rekan sesama anggota dewan memiliki pandangan serupa, namun terhalang oleh 'pandangan sempit bodoh yang hanya memikirkan pemilu berikutnya' alih-alih melakukan hal yang benar bagi rakyat Amerika.\n\nPernyataannya telah diberitakan secara luas oleh pers dan menyudutkan beberapa koleganya karena mereka harus menjelaskan posisi mereka dalam isu-isu tersebut."
 usa.41.a: "Dia benar, kamu tahu."
 usa.42.t: "Senator Menentang Kebijakan Pemerintah"
 usa.42.desc: "Seorang Senator memberikan wawancara di sebuah surat kabar terkemuka, menyatakan bahwa ia tidak dapat lagi mendukung kebijakan Presiden [USA.GetLeader] yang 'bodoh dan berbahaya'. Ia lebih lanjut mengklaim mengetahui beberapa Senator lain yang berpikiran serupa dan akan segera meninggalkan sang Presiden dalam waktu dekat."
 usa.42.a: "Dia akan segera kembali."
 usa.43.t: "Anggota Dewan Mengkritik Presiden"
 usa.43.desc: "Dalam perdebatan baru-baru ini mengenai reformasi perpajakan, seorang Anggota Dewan melancarkan pidato panjang lebar mengenai berbagai kegagalan Administrasi. Menurutnya, tidak ada warga Amerika yang berpikiran waras yang mau mendukung kebijakan Presiden, apa pun afiliasi partai mereka.\n\nKata-katanya yang keras tampaknya membawa dampak, karena sejumlah Anggota Dewan yang sebelumnya diperkirakan teguh di belakang kebijakan [USA.GetLeader] mulai menyuarakan dukungan."
 usa.43.a: "Memalukan."
 usa.44.t: "Oposisi Menderita Kekalahan di Senat"
 usa.44.desc: "Sebuah mosi untuk mengecam Presiden [USA.GetLeader] telah dikalahkan di Senat. Meskipun para pendukungnya yang paling bersemangat sekalipun tidak mempunyai harapan bahwa RUU tersebut akan disahkan, jumlah suara yang menentangnya merupakan sebuah kejutan bahkan bagi para pengamat yang paling pesimis sekalipun. Tampaknya Presiden mendapat dukungan yang jauh lebih besar di Senat dibandingkan yang diperkirakan sebagian besar orang, sehingga hal ini akan membantu memajukan agenda legislatifnya."
 usa.44.a: "Bagus."
 usa.45.t: "Komite DPR Mendukung Kebijakan Presiden"
 usa.45.desc: "Rangkaian dengar pendapat terkini di Komite Jalur dan Sarana DPR telah menghasilkan laporan yang mengaitkan kebijakan Presiden dengan perbaikan besar di seluruh indikator ekonomi yang ada. Kendati tidak sampai melontarkan pujian terbuka, laporan tersebut tetap menjadi pukulan telak bagi mereka yang mengkritik Presiden dan menuntut reformasi.\n\nSejumlah Anggota Dewan telah menyatakan secara terbuka bahwa kendati mereka masih memendam keraguan terhadap agenda Presiden, mereka kini akan memberikan suara mendukung."
 usa.45.a: "Mereka juga harus melakukannya."
 usa.46.t: "Senator Pensiun"
 usa.46.desc: "Setelah serangan jantung ringan, seorang Senator senior hari ini mengumumkan bahwa dia akan pensiun karena alasan kesehatan. Dengan lebih dari dua dekade di Kongres, Senator membangun jaringan pendukung yang besar dan pengaruhnya sangat berpengaruh. Meskipun secara teknis hanya ada satu orang yang mempunyai satu suara, orang dalam di Washington tetap menganggapnya bernilai beberapa suara karena dia adalah kunci untuk mengamankan beberapa suara lainnya.\n\nDengan kursi yang kemungkinan besar akan jatuh ke tangan kritikus Presiden [USA.GetLeader], Pemerintah akan merasa jauh lebih sulit untuk mendapatkan suara yang diperlukan untuk meloloskan rancangan undang-undang."
 usa.46.a: "Dia akan dirindukan. Dan suaranya juga."
 usa.47.t: "Dengar Pendapat DPR Menyelidiki Pelanggaran Presiden"
 usa.47.desc: "Sebuah skandal kecil yang bermula dari Gedung Putih mulai berkembang luas. Menyusul berminggu-minggu laporan media yang menyiratkan bahwa seorang pejabat administrasi rendah telah menerima suap sebagai imbalan atas kontrak pemerintah yang menggiurkan, Komite Pengeluaran Eksekutif DPR telah mulai menggelar sidang dengar pendapat guna menentukan apakah Presiden mengetahui hal ini. Meskipun sebagian besar pengamat tidak percaya hal ini akan menimbulkan masalah besar bagi Presiden [USA.GetLeader], tak pelak lagi ini berarti banyak pendukung presiden harus bersikap rendah hati untuk sementara waktu."
 usa.47.a: "Perburuan penyihir."
 usa.61.t: "Senator dari [USA_congress_investment_state.GetName] Menawarkan Dukungan"
 usa.61.desc: "Senator senior dari [USA_congress_investment_state.GetName] telah mendekati pemerintah dengan tawaran dukungan. Negarabagiannya mengalami krisis kekurangan investasi, dan program stimulus ekonomi yang diprakarsai pemerintah tentu akan membuatnya mempertimbangkan kembali sikapnya terhadap usulan kebijakan pemerintah tertentu. Sang senator duduk di beberapa komite penting, dan cukup terkenal karena keahliannya menegosiasikan kesepakatan, menjadikan suaranya bernilai beberapa suara di kedua majelis."
 usa.61.a: "Ini adalah wilayah yang sangat terbelakang."
 usa.61.b: "Ini berbau korupsi."
 usa.62.desc: "Para Senator dari [USA_congress_investment_state.GetName] telah mendekati pemerintah, menawarkan dukungan mereka kepada Presiden dengan imbalan jaminan informal bahwa [USA_congress_investment_state.GetName] akan menjadi lokasi pabrik amunisi baru untuk Angkatan Darat. Mereka berpendapat bahwa membangun pabrik di wilayah tersebut akan menciptakan banyak lapangan kerja dan memberikan dukungan yang sangat dibutuhkan Angkatan Darat di dunia yang semakin berbahaya. Kedua Senator juga menyebutkan hubungan kerja mereka yang sangat baik dengan beberapa anggota DPR yang berpengaruh."
 usa.62.a: "Mereka memberikan banyak poin bagus."
 usa.62.b: "Kesepakatan semacam ini berada di bawah Presiden."
 usa.63.t: "Perwakilan dari [USA_congress_investment_state.GetName] Menawarkan Dukungan"
 usa.63.desc: "Delegasi kongres dari [USA_congress_investment_state.GetName] telah mendekati pemerintah dengan sejumlah usulan untuk meningkatkan infrastruktur di negarabagian mereka. Dana federal harus disediakan untuk memodernisasi jalan dan jembatan guna mendorong perdagangan antar-negarabagian. Mereka juga mencatat bahwa dukungan pemerintah dalam hal ini tentu akan membuat mereka lebih condong untuk mendukung Presiden secara lebih langsung dalam agendanya."
 usa.63.a: "Inisiatif yang terpuji."
 usa.63.b: "Biarkan mereka mencoba memaksakannya sendiri."
 usa.64.t: "Komite Senat Menyelidiki Pembuatan Kapal di [USA_congress_investment_state.GetName]"
 usa.64.desc: "Didorong oleh Senator senior dari [USA_congress_investment_state.GetName], Komite Perdagangan Senat telah memulai dengar pendapat mengenai keadaan industri pembuatan kapal lokal. Menurut para ahli, sebagian besar perdagangan AS bergantung pada perdagangan luar negeri, dan negara tersebut sangat kekurangan kapasitas pembuatan kapal. [USA_congress_investment_state.GetName] telah diidentifikasi sebagai wilayah di mana investasi besar harus dilakukan, dan beberapa anggota komite telah menyatakan harapan bahwa administrasi [USA.GetLeader] akan menyisihkan dana untuk hal ini."
 usa.64.a: "Sebuah kelemahan kritis."
 usa.64.b: "Kami memiliki masalah yang lebih besar."
 usa.65.t: "Kebaikan Hati [GER.GetAdjective] yang Mengejutkan."
 usa.65.desc: "Kita telah mendapatkan cerita yang luar biasa dari Angkatan Udara. Setelah bom gagal dijalankan di industri militer [GER.GetAdjective], pembom kami ''Ye Olde Pub'' mengalami kerusakan parah, kehilangan satu awak dan sisanya terluka parah. Para kru, yang dipimpin oleh Letnan 2 Charles ''Charlie'' Brown, menolak memberikan jaminan dan meninggalkan mereka yang tidak dapat melakukan pendaratan aman untuk turun bersama pesawat.\n\nSaat pesawat yang tersesat sekali lagi dicegat oleh pesawat tempur musuh yang hampir tidak memiliki persenjataan yang berfungsi untuk mempertahankan diri, para kru terkejut melihat pesawat tempur tersebut tidak mau melepaskan tembakan. Melalui gerak tubuh dan ucapan, pilot [GER.GetAdjective] berusaha berkomunikasi dengan kru. Meskipun ada upaya besar dari kedua belah pihak, sarana komunikasi tidak dapat dilakukan. Pesawat tempur tersebut menemani ''Ye Olde Pub'' keluar dari wilayah udara [GER.GetAdjective] dan saat para kru mengarahkan senjata mereka yang tersisa ke pesawat tempur tersebut untuk menandakan bahwa mereka tidak lagi membutuhkan dukungannya, pilot pesawat tempur tersebut memberi hormat, dan kembali ke [GER.GetNameDef].\n\nKisah ini membawa harapan bahwa masih ada orang-orang baik, bahkan di pihak lawan kita, namun membiarkan cerita ini menyebar bebas di kalangan penduduk dan pasukan kita mungkin akan menimbulkan efek samping yang tidak diinginkan."
 usa.65.a: "Hiasi pilot karena keberaniannya!"
 usa.65.b: "Jika dia mempercayai [GER.GetAdjective], kami tidak mempercayainya!"
 usa.65.c: "Pastikan ini tidak menyebar."
 news.334.t: "Insiden Panay"
 news.334.d: "Kapal meriam [USA.GetAdjective] dan [ENG.GetAdjective] diserang oleh pesawat tempur [JAP.GetAdjective] dalam insiden terpisah hari ini, saat mengevakuasi warga sipil Barat dari garis depan kancah perang antara [JAP.GetName] dan [CHI.GetName]. Kendati bertanda pengenal jelas sebagai kapal [USA.GetAdjective], kapal perang USS Panay dihantam dua bom dan karam, menewaskan tiga warga [USA.GetAdjective] dan satu warga [ITA.GetAdjective] serta melukai lainnya. Dalam serangan terpisah terhadap HMS Ladybird, seorang pelaut [ENG.GetAdjective] tewas.\n\nBaik Pemerintah [USA.GetAdjective] maupun [ENG.GetAdjective] telah melayangkan nota protes keras. Insiden ini kian mempertegas ketegangan yang kian membara di antara tiga kekuatan armada laut terkemuka di dunia."
 news.334.a: "Apakah [JAP.GetNonIdeologyName] tidak ada batasnya?"
 news.334.b: "Hal ini dapat memperumit masalah"
 news.334.c: "Ancaman [JAP.GetAdjective] tampak lebih besar"
 news.335.t: "Ketegangan Memuncak antara [USA.GetNameDef] dan [JAP.GetName]"
 news.335.d: "\nInsiden Panay baru-baru ini telah lepas kendali. Kemarahan publik di [USA.GetNameDef] mendorong sejumlah politisi terkemuka menuntut aksi balasan militer segera terhadap [JAP.GetNameDef]. Media massa [USA.GetAdjective] dibanjiri kisah-kisah baru seputar kekejaman tentara [JAP.GetAdjective], sebagian nyata, sebagian dibesar-besarkan, dan sebagian lagi rekaan belaka. Dengan dua kekuatan raksasa kini berada di tubir jurang perang, segelintir pengamat masih menyimpan secercah harapan bahwa situasi genting ini dapat diredakan."
 news.335.a: "Apa dampaknya bagi Pasifik?"
 news.335.b: "Ingat Panay!"
 news.335.c: "Biarkan mereka datang!"
 news.335.e: "Kabar buruk bagi Jepang adalah kabar baik bagi kami"
 news.335.f: "Hal ini dapat membuat situasi di Tiongkok menjadi lebih sulit"
 news.336.title: "Ingatlah Alamo"
 news.336.desc: "Pasukan [MEX.GetAdjective] telah menduduki kembali Texas setelah satu abad lamanya terlepas. Pasukan [USA.GetAdjective] telah sepenuhnya dihalau dari kota-kota utama di Texas, termasuk San Antonio beserta situs bersejarahnya yang tersohor, Benteng Alamo. Kendati tak ada pertempuran yang berkecamuk di situs keramat tersebut, [MEX.GetLeader] telah berkeliling di kompleks misi Katolik itu, menggelar rapat akbar dan berpidato membakar semangat pasukannya untuk terus berjuang demi kemenangan akhir atas kaum 'Yanki' yang dibenci."
 news.336.a: "Kami ingat."
 news.336.b: "Kami lupa."
 news.336.c: "Bagaimana [USA.GetLeader] membiarkan hal ini terjadi?"
 generic.19.t: "[From.GetName] Mengirimkan Dukungan Industri"
 generic.19.d: "[From.GetNameDefCap] telah memberitahu kita bahwa mereka mendukung perjuangan kita, dan akan memberi kita bantuan industri dalam batas tertentu guna memperkokoh posisi kita menghadapi musuh bersama."
 generic.20.t: "[From.GetNameDefCap] Menuntut Ketundukan Kita"
 generic.20.d_friends: "Hari ini kita menerima sebuah delegasi yang menyampaikan minat [From.GetLeader] untuk memperluas hubungan antarnegara dan mengambil langkah-langkah guna mempersatukan rakyat [Root.GetAdjective] bersama [From.GetNameDef]. Menyetujui usulan [From.GetLeader] akan menjadikan [Root.GetNameDef] negara boneka dengan otonomi terbatas di bawah [From.GetNameDef], dan pemerintahan kita akan dirombak agar sejalan dengan visi [From.GetLeader].\n\nPertanyaannya tetap sama: apakah kemerdekaan [Root.GetAdjective] lebih berharga daripada persahabatan kita dengan [From.GetNameDef]?"
 generic.20.d_enemies: "Sebuah pesan tiba dari [From.GetNameDef] hari ini menuntut agar [Root.GetLeader] mengakui [From.GetLeader] sebagai kepala negara dan agar bangsa kita direorganisasi menjadi sesuatu yang lebih sejalan dengan visi pemerintah [From.GetAdjective] untuk [Root.GetNameDef]. Menerimanya akan membuat kita menjadi negara boneka [From.GetNameDef].\n\nMeskipun kita enggan menyerahkan kedaulatan kita kepada musuh di seberang perbatasan, ada nada ancaman nyata dalam pesan mereka yang mengisyaratkan bahwa jika kita tidak memenuhi tuntutan [From.GetLeader], kita akan segera mendapati diri kita berada dalam keadaan perang melawan [From.GetNameDef]."
 generic.20.a: "Tunduk pada tuntutan mereka."
 generic.20.b: "Saya, misalnya, menyambut tuan [From.GetAdjective] kami yang baru."
 generic.20.c: "Sama sekali tidak!"
 generic.21.t: "[From.GetNameDefCap] Tunduk"
 generic.21.d: "Pemerintah [From.GetAdjective] telah setuju untuk menanggalkan kemerdekaan mereka dan menjadi negara boneka dari [Root.GetNameDef]. Kita yakin ini akan membawa kejayaan dan memajukan kepentingan [Root.GetAdjective] di kawasan tersebut."
 generic.21.a: "Luar biasa."
 generic.22.t: "[From.GetNameDefCap] Menentang!"
 generic.22.d: "Diplomat dari [From.GetNameDef] tiba hari ini untuk mengumumkan bahwa mereka menolak tawaran kami untuk menyatukan [From.GetNameDef] dengan [Root.GetNameDef]. Walaupun mungkin mengecewakan, pilihan untuk memaksa [From.GetNameDef] mundur secara paksa tetap merupakan pilihan yang valid dan menggoda."
 generic.22.a: "Mengecewakan."
 generic.23.t: "[From.GetNameDefCap] Menuntut Kendali atas [demanded_prov_target.GetName]"
 generic.23.d: "Hari ini kita menerima delegasi bermusuhan dari [From.GetNameDef], yang mengklaim kepemilikan atas keseluruhan wilayah [demanded_prov_target.GetName]. [From.GetLeader] menuntut agar kita segera menyerahkan wilayah tersebut atau perang tak akan terelakkan. Mereka mengklaim bahwa kepemilikan [demanded_prov_target.Owner.GetAdjective] atas kawasan tersebut tidak sah dan bahwa [demanded_prov_target.GetName] merupakan bagian integral dari negara [From.GetAdjective].\n\nJika kita menyetujui tuntutan mereka, [demanded_prov_target.GetName] akan diserahkan kepada [From.GetNameDef] namun kita tetap mempertahankan klaim atau inti wilayah kita atas kawasan tersebut. Jika kita menolak, perang antarnegara kita tampaknya mustahil dihindarkan."
 generic.23.a: "Kami tidak punya pilihan."
 generic.23.b: "[demanded_prov_target.GetName] akan tetap [Root.GetAdjective]!"
 generic.24.t: "[demanded_prov_target.GetName] Diserahkan!"
 generic.24.d: "[From.GetNameDefCap] telah memutuskan untuk menerima klaim sah kita atas [demanded_prov_target.GetName] dan telah menyerahkan kawasan tersebut kepada [Root.GetNameDef].\nDengan diselesaikannya persoalan ini secara cepat dan terhormat, kita meyakini bahwa perdamaian antara [Root.GetNameDef] dan [From.GetNameDef] akan terus abadi selamanya."
 generic.25.t: "[From.GetNameDefCap] Menentang!"
 generic.25.d: "[From.GetNameDefCap] telah menolak tuntutan kita dan kini kita harus memutuskan apakah akan menunaikan ancaman kita untuk melancarkan invasi. Kegagalan menepati kata-kata kita akan sangat merusak citra publik [Root.GetLeader] dan legitimasi pemerintah [Root.GetAdjective]."
 generic.25.a: "Bagaimanapun, [demanded_prov_target.GetName] akan menjadi milik kita."
 maybe_war_tt: "§RHal ini dapat mengakibatkan perang dengan§! §Y[From.GetNameDef]§!"
 usa.401.t: "[From.GetNameDefCap] Menerima Perjanjian Kapal Perusak untuk Pangkalan"
 usa.401.desc: "Perdana Menteri Britania [From.GetLeader] telah memberi sinyal persetujuannya atas syarat-syarat Perjanjian Kapal Perusak untuk Pangkalan. Sekelompok perwira laut [From.GetAdjective] telah tiba untuk memeriksa kapal-kapal perusak tersebut dan mengawasi proses serah terima.\n\nJelas masih ada beberapa pekerjaan yang harus diselesaikan karena sejumlah perwira [From.GetAdjective] tampak agak prihatin melihat begitu banyaknya tumpukan kotoran burung dan tebalnya karat pada kapal-kapal yang akan diserahkan."
 usa.401.a: "Pengemis tidak bisa menjadi pemilih."
