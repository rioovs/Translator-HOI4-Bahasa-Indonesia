 lar_collab_gov.1.t: "Partisan [From.GetAdjective] di [Root.GetNameDef]"
 lar_collab_gov.1.d: "[From.GetNameDefCap] baru-baru ini meningkatkan upaya mereka untuk membangun kolaborasi di dalam negara kita. Sejumlah politisi [This.GetAdjective] mulai berbicara penuh simpati tentang rezim [From.GetAdjective], dan banyak partisan di dalam negeri mengubah sentimen [From.GetRulingIdeology] mereka menjadi dukungan langsung bagi [From.GetNameDef].\n\nKian menguatnya pengaruh [From.GetAdjective] di negara kita niscaya akan menurunkan resistensi [Root.GetAdjective] dan bahkan dapat bermuara pada pembentukan pemerintahan [From.GetRulingIdeology] baru yang berkolaborasi dengan [From.GetNameDef] seandainya [Root.GetNameDef] kapitulasi."
 worrying: "Khawatir."
 ETH_events.1.t: "Etiopia Mengusulkan Perdamaian Status Quo"
 ETH_events.1.d: "Dengan kendali atas Somaliland dan Eritrea yang hampir sepenuhnya hilang kecuali segelintir kantong perlawanan, pemerintah Etiopia mengusulkan agar kita mengakhiri permusuhan ini secara damai. Italia akan secara resmi menghentikan invasi mereka ke Etiopia dan menyerahkan wilayah pendudukan di Afrika Timur kepada Etiopia. Bagaimana kita harus menanggapinya?"
 ETH_events.1.a: "Tandatangani perjanjian."
 ETH_events.1.b: "Kita tidak boleh menerima penghinaan lagi!"
 ETH_events.101.t: "[From.GetNameDefCap] Menolak Perdamaian"
 ETH_events.101.d: "Kendati telah kehilangan kendali atas seluruh wilayah di Afrika Timur, [From.GetLeader] menolak tawaran damai status quo kita. Tampaknya kapitulasi total adalah satu-satunya jalan agar perang ini berakhir."
 ETH_events.101.a: "Sedih."
 germany.1041.t: "[FROM.GetNameDefCap] Menuntut Sudetenland"
 germany.1041.desc: "Meskipun terjadi pergolakan perbatasan Ceko baru-baru ini, kebijakan luar negeri [FROM.GetAdjective] tetap teguh. Diplomat [FROM.GetAdjective] telah mengajukan ultimatum kepada kita — serahkan Sudetenland, atau perang akan diumumkan."
 germany.1041.desc_ally_or_subject: "Terlepas dari pergolakan perbatasan Ceko baru-baru ini, kebijakan luar negeri [FROM.GetAdjective] tidak berubah. Diplomat [FROM.GetAdjective] telah mengajukan tuntutan wilayah mereka kepada kita, mengharapkan kita menyerahkan Sudetenland tanpa penundaan."
 germany.1041.a: "Kami tidak punya pilihan."
 germany.1041.b: "[GetSudetenlandRejectOption]"
 germany.1041.b_default: "Mesin perang [FROM.GetAdjective] berhenti di sini."
 germany.1041.b_ally_of_ger: "Kami tidak akan menyerahkan keuntungan teritorial kami."
 germany.1042.t: "[FROM.GetNameDefCap] Tunduk"
 germany.1042.desc_default: "Keperkasaan [ROOT.GetAdjective] tiada tandingannya — wilayah Sudetenland yang sebelumnya berada di bawah lingkup pengaruh [FROM.GetAdjective] kini telah diserahkan kepada kita. [FROM.GetNameDefCap] tetap luput dari sasaran kita. Untuk saat ini."
 germany.1042.desc_ally: "Keperkasaan [ROOT.GetAdjective] tiada tandingannya — wilayah Sudetenland yang sebelumnya berada di bawah lingkup pengaruh [FROM.GetAdjective] kini telah diserahkan kepada kita. Tak butuh waktu lama bagi [FROM.GetLeader] dan diplomat [FROM.GetAdjective] untuk menyadari bahwa ini adalah yang terbaik bagi [ROOT.GetFactionName]."
 germany.1042.desc_subject: "Keperkasaan [ROOT.GetAdjective] tiada batasnya — wilayah Sudetenland yang sebelumnya di bawah kendali [FROM.GetAdjective] kini telah dialihkan kepada kita. Penguasa boneka kita di [FROM.GetNameDef], [FROM.GetLeader], memastikan bahwa otoritas setempat dan organisasi [FROM.GetAdjective] mematuhi perjanjian tanpa keberatan."
 germany.1042.a: "Luar biasa."
 germany.1043.t: "[FROM.GetNameDefCap] Menolak Tuntutan"
 germany.1043.desc: "Terlepas dari ketimpangan kekuatan, diplomat [FROM.GetAdjective] telah menolak tuntutan kita untuk penyerahan Sudetenland. Sudah dapat dipastikan bahwa perang akan menyusul."
 germany.1043.desc_ally: "Meskipun demi kepentingan terbaik seluruh anggota [ROOT.GetFactionName], diplomat [FROM.GetAdjective] telah menolak tuntutan kita atas penyerahan Sudetenland. Tidak banyak yang dapat dilakukan sekarang, mengingat perlunya menghormati otonomi sekutu kita."
 germany.1043.a: "Drat."
 GRE_turkey_surrenders: "Turki mundur dari tuntutan Yunani"
 germany.1050.t: "Kematian Sang Führer"
 germany.1050.desc: "Sang Führer, $GER_adolf_hitler$, telah ditemukan tewas di dalam bunkernya. Dengan pasukan musuh yang kian mendekat, tampaknya sang Führer memutuskan untuk mengakhiri hidupnya sendiri alih-alih menghadapi risiko ditawan. Demi mencegah demoralisasi pasukan, corong propaganda kita diinstruksikan menyebarkan kabar bahwa Hitler gugur secara heroik bertempur hingga napas terakhir menghadapi kekuatan musuh yang luar biasa besar. Namun, masalah kita yang lebih mendesak adalah siapa yang akan maju menggantikan sang Führer?"
 germany.1050.a: "$GER_karl_donitz$ adalah penerus pilihan Führer."
 germany.1050.b: "$GER_albert_speer$ akan memenuhi ambisi Führer."
 germany.1050.c: "$GER_heinz_guderian$ akan mengeluarkan kita dari kekacauan ini."
 generic_purchase_ships_events.01.t: "Pengadaan Kapal Perang [FROM.GetAdjective]"
 generic_purchase_ships_events.01.desc: "[FROM.GetNameDefCap] telah mendekati kita dengan tawaran untuk membeli sejumlah aset angkatan laut kita yang telah dinonaktifkan. Aset-aset yang mereka minati tersebut sudah tidak lagi bertugas di armada karena faktor usia dan ketiadaan perlengkapan modern."
 generic_purchase_ships_events.01.a: "Kesepakatan yang saling menguntungkan."
 generic_purchase_ships_events.01.b: "Kami tidak dapat menyisihkan aset angkatan laut apa pun."
 generic_purchase_ships_events.02.t: "[FROM.GetNameDefCap] Menyetujui Pengadaan Kapal Perang"
 generic_purchase_ships_events.02.desc: "[FROM.GetAdjective] diplomat dan personel angkatan laut telah memberi tahu kami bahwa mereka akan menyerahkan peralatan kapur barus yang kami tawarkan untuk dibeli. Hal ini akan memungkinkan kita untuk dengan cepat memperluas angkatan laut kita yang masih baru."
 generic_purchase_ships_events.02.a: "Berita bagus!"
 generic_purchase_ships_events.03.t: "[FROM.GetNameDefCap] Menolak Kesepakatan Pengadaan Kapal Perang"
 generic_purchase_ships_events.03.desc: "[FROM.GetAdjective] diplomat telah memberi tahu kami bahwa mereka tidak mau menyerahkan peralatan kapur barus yang kami tawarkan untuk dibeli. Tidak jelas apakah penolakan tersebut disebabkan oleh rencana mereka sendiri terhadap kapal tersebut atau dimaksudkan sebagai tanda ketidaksetujuan mereka terhadap kebijakan kami."
 generic_purchase_ships_events.03.a: "Sayangnya."
 generic_purchase_ships_events.04.t: "Pengadaan Kapal Perang [FROM.GetAdjective]"
 generic_purchase_ships_events.04.desc.a: "[FROM.GetNameDefCap] telah mendekati kami dengan tawaran untuk membeli beberapa kapal modal kami yang sudah tidak digunakan lagi. Aset yang mereka minati sudah tidak dapat digunakan lagi karena usianya dan kurangnya peralatan modern. Namun, dengan menjual aset tersebut kepada [FROM.GetNameDef], kita berisiko meningkatkan perlombaan senjata angkatan laut yang sudah memburuk di wilayah tersebut."
 generic_purchase_ships_events.04.desc.b: "[FROM.GetNameDefCap] telah mendekati kami dengan tawaran untuk membeli beberapa kapal modal kami yang sudah tidak digunakan lagi. Aset yang mereka minati sudah tidak dapat digunakan lagi karena usianya dan kurangnya peralatan modern."
 generic_purchase_ships_events.04.a: "Kesepakatan yang saling menguntungkan."
 generic_purchase_ships_events.04.b: "Kami tidak dapat menyisihkan aset angkatan laut apa pun."
 generic_purchase_ships_events.05.t: "[FROM.GetNameDefCap] Menyetujui Pengadaan Dreadnought"
 generic_purchase_ships_events.05.desc: "[FROM.GetAdjective] diplomat dan personel angkatan laut telah memberi tahu kami bahwa mereka akan berpisah dengan kapal penempur kapur barus yang kami tawarkan untuk dibeli. Hal ini akan memungkinkan kita untuk dengan cepat memperluas angkatan laut kita dan mempertahankan keunggulan atas negara-negara tetangga kita."
 generic_purchase_ships_events.05.a: "Berita bagus!"
 generic_purchase_ships_events.06.t: "[FROM.GetNameDefCap] Menolak Kesepakatan Pengadaan Dreadnought"
 generic_purchase_ships_events.06.desc: "[FROM.GetAdjective] diplomat telah memberi tahu kami bahwa mereka tidak mau berpisah dengan kapal penempur kapur barus yang kami tawarkan untuk dibeli. Tidak jelas apakah penolakan tersebut disebabkan oleh rencana mereka sendiri terhadap kapal tersebut atau dimaksudkan sebagai tanda ketidaksetujuan mereka terhadap kebijakan kami."
 generic_purchase_ships_events.06.a: "Sayangnya."
 AAT_germany.1.t: "[FROM.GetNameDefCap] Meminta Hak Sumber Daya"
 AAT_germany.1.a: "Itu bukan kepentingan terbaik kami"
 AAT_germany.1.b: "Tidak ada yang kalah!"
 AAT_germany.2.t: "[FROM.GetName] Menolak Kesepakatan Kita"
 AAT_germany.2.desc: "[FROM.GetName] telah menolak tawaran kita, menyatakan bahwa saat ini kesepakatan tersebut bukan demi kepentingan terbaik mereka.\nMereka menegaskan bahwa tidak ada niat buruk terhadap kita, melainkan mereka memiliki prioritas lain saat ini."
 AAT_germany.2.a: "Sayang sekali"
 AAT_germany.3.t: "[FROM.GetName] Menerima Kesepakatan Kita"
 AAT_germany.3.desc: "[FROM.GetName] telah menerima kesepakatan kita, sesuatu yang pasti akan menguntungkan kedua belah pihak. Semoga pengaturan yang menguntungkan ini disusul oleh lebih banyak kerja sama lainnya."
 AAT_germany.3.a: "Bagus"
 #This loc is now used in a different German event for trade deals:
 AAT_germany.1.desc: "[FROM.GetNameDefCap] telah mendekati kita dengan kesepakatan yang mereka klaim akan menguntungkan kedua perekonomian. Mereka membutuhkan sumber daya alam kita untuk industri mereka dan kita membutuhkan investasi mereka untuk memperluas industri kita. Tawaran yang menggiurkan, tapi apakah ini perjanjian terlarang yang menjebak?"
 #This loc string is used for when Germany pressures Sweden to give up resource rights:
 AAT_germany.10.desc: "Dengan pendudukan [144.GetName] baru-baru ini oleh [FROM.GetNameDef] dan antek-anteknya, [GER.GetLeader] telah meningkatkan tekanannya pada kita untuk memperdagangkan lebih banyak sumber daya dengan mereka guna menyalakan mesin perang mereka. Kesepakatan yang ditawarkan tidak sepenuhnya sepihak, dan menolaknya bisa membuat kita terseret ke dalam kancah peperangan..."
 wtt_xian_incident_warning_8: "§R[CHI.GetNameDef] boleh memilih berperang karena ini!§!"
