l_braz_por:
 CHI_secure_internal_politics: "Amankan Politik Dalam Negeri"
 CHI_secure_internal_politics_desc: "Jika pemerintahan kita ingin bertahan dalam kekacauan politik Tiongkok yang membingungkan, kita tidak boleh teralihkan oleh pertikaian internal. Setiap oposisi internal harus dibasmi hingga ke akarnya."
 CHI_strenghten_warlord_authority: "Perkuat Otoritas Panglima Perang"
 CHI_strenghten_warlord_authority_desc: "Demi mengamankan zona kendali kita dan memastikan kita tidak dirongrong oleh Kuomintang, kaum komunis, maupun Jepang, kita harus memperkuat otoritas [ROOT.GetLeader]."
 CHI_uplift_the_cavalry_regiments: "Tingkatkan Resimen Kavaleri"
 CHI_uplift_the_cavalry_regiments_desc: "Wilayah kita memiliki tradisi berkuda dan ketangkasan menunggang kuda yang panjang serta membanggakan. Kita harus menghormati tradisi ini, memastikan kavaleri kita dijunjung tinggi, dan ditempatkan di garda depan angkatan bersenjata kita."
 CHI_uplift_the_mountain_brigades: "Tingkatkan Brigade Gunung"
 CHI_uplift_the_mountain_brigades_desc: "Pedalaman Tiongkok beriklim keras dan medannya sangat sulit dilalui. Oleh karena itu, kita harus melatih brigade-brigade khusus untuk bertempur di medan berbukit dan bergunung demi melindungi tanah air kita secara layak."
 CHI_cooperation_with_the_nationalists: "Kerja Sama dengan Kaum Nasionalis"
 CHI_cooperation_with_the_nationalists_desc: "Kaum Nasionalis menawarkan peluang terbaik untuk menyatukan negeri dan mengalahkan Jepang. Kita harus memastikan mereka tidak memandang kita sebagai ancaman."
 CHI_cooperation_with_the_nationalists_effect_tooltip: "[WTT_communist_china.GetNameDefCap] dan para Panglima Perang yang berpihak pada Komunis dapat memulai §HKonflik Perbatasan§! dengan kita sebagai tanggapan atas langkah ini."
 CHI_technological_cooperation: "Kerja Sama Teknologi"
 CHI_technological_cooperation_desc: "Kerja sama kita dengan Pemerintah Pusat akan memastikan kita memperoleh akses ke berbagai teknologi baru yang mereka kembangkan."
 CHI_new_model_province: "Provinsi Model Baru"
 CHI_new_model_province_desc: "Sementara Pemerintah Pusat tertatih-tatih menyeret negeri ini ke era modern, kita akan menerapkan reformasi dalam skala yang lebih kecil dan menjadi mercusuar kemajuan yang bersinar di tengah ketertinggalan wilayah lain."
 CHI_root_out_corruption: "Bongkar Korupsi"
 CHI_root_out_corruption_desc: "Selama berpuluh-puluh tahun, para pejabat pemerintah telah menyalahgunakan wewenang untuk memperkaya diri dan menindas rakyat, sambil menutup mata terhadap para kriminal yang menyogok mereka. Semua itu berakhir sekarang."
 CHI_embrace_the_opium_trade: "Rangkul Perdagangan Opium"
 CHI_embrace_the_opium_trade_desc: "Suatu negara membutuhkan uang untuk dapat berfungsi. Dalam situasi kita saat ini, kita tidak bisa terlalu pilih-pilih soal sumbernya."
 CHI_land_reform: "Reforma Agraria"
 CHI_land_reform_desc: "Kaum komunis melancarkan program agresif redistribusi tanah yang merebut banyak dukungan dari kalangan petani. Kita harus menerapkan program yang tidak terlalu radikal demi menarik rakyat ke pihak kita."
 CHI_reform_the_administration: "Reformasi Administrasi"
 CHI_reform_the_administration_desc: "Segala jerih payah kita di tingkat pemerintahan pusat akan sia-sia jika tidak terlaksana di tingkat daerah. Kita harus memastikan para pejabat setempat mampu dan bersedia menjalankan perintah kita."
 CHI_join_the_republican_government: "Bergabung dengan Pemerintahan Republik"
 CHI_join_the_republican_government_desc: "Dengan wilayah kita yang kian kukuh dan pemerintahan yang telah direformasi, kini saatnya mendekati Pemerintah Pusat dan menuntut kursi di meja kekuasaan. Begitu kita diakui sebagai faksi sah dalam pemerintahan, legitimasi baru ini dapat kita manfaatkan untuk membangun dukungan di provinsi lain demi memperbesar basis kekuasaan kita."
 CHI_power_struggle: "Perebutan Kekuasaan"
 CHI_power_struggle_desc: "Pengaruh politik kita terhadap urusan negara telah tumbuh secara signifikan. Kini kita dapat mencoba mendekati negara-negara lain sebagai pihak yang setara."
 china_nationalist_focus: "Pohon Fokus Tiongkok Nasionalis"
 china_communist_focus: "Pohon Fokus Tiongkok Komunis"
 CHI_cooperation_with_the_communists: "Kerja Sama dengan Kaum Komunis"
 CHI_cooperation_with_the_communists_desc: "KMT telah mencoba dan gagal membangun bangsa yang modern. Negeri ini lebih terpecah dari sebelumnya, kaum tani hidup dalam ketakutan terhadap pemerintah, korupsi merajalela di semua tingkat kekuasaan, dan kaum imperialis Jepang bercokol tepat di perbatasan kita. Barangkali Komunisme adalah visi masa depan yang lebih baik."
 CHI_cooperation_with_the_communists_effect_tooltip: "Panglima Perang yang berpihak pada Kaum Nasionalis dapat memulai §HKonflik Perbatasan§! dengan kita sebagai tanggapan atas tindakan ini.\n"
 CHI_land_redistribution: "Redistribusi Tanah"
 CHI_land_redistribution_desc: "Para petani ditindas dan diperas tanpa ampun oleh tuan tanah, padahal merekalah tulang punggung ekonomi kita. Menjadikan orang-orang yang menggarap tanah sebagai pemilik tanah yang sesungguhnya akan melahirkan masyarakat yang jauh lebih adil dan produktif."
 CHI_ideological_education: "Pendidikan Ideologis"
 CHI_ideological_education_desc: "Landasan kesuksesan masa depan diletakkan hari ini. Generasi penerus harus diajari kebenaran fundamental bahwa seluruh sejarah adalah sejarah perjuangan kelas, serta peran mereka di dalamnya."
 CHI_land_value_tax: "Pajak Nilai Tanah"
 CHI_land_value_tax_desc: "Memungut pajak langsung atas nilai tanah memberi kita sistem perpajakan yang jauh lebih stabil dan adil, yang menarik pendapatan dari pihak yang memiliki kelebihan paling banyak."
 CHI_judiciary_reforms: "Reformasi Yudisial"
 CHI_judiciary_reforms_desc: "Jika administrasi kita ingin membawa perubahan nyata, kita harus memastikan semua hakim telah terdidik dengan baik untuk menegakkan hukum kita secara adil dan tepat."
 CHI_communist_administrators: "Administrator Komunis"
 CHI_communist_administrators_desc: "Para pejabat angkatan tua terlalu berakar kuat pada cara lama untuk bisa dipengaruhi ke arah pemikiran kita. Kita harus mengganti mereka sepenuhnya dengan administrator baru yang lebih muda dan memiliki gagasan revolusioner."
 CHI_join_the_chinese_soviet: "Bergabung dengan Soviet Tiongkok"
 CHI_join_the_chinese_soviet_desc: "Revolusi hanya dapat berhasil jika kaum Komunis bersatu padu. Tentu saja, kita harus memastikan tidak ada anasir kontra-revolusioner di dalam partai yang berupaya menggagalkan revolusi sebelum sempat bermula."
 CHI_the_yanan_incident: "Insiden Yan'an"
 CHI_the_yanan_incident_effect_tt: "Minta dukungan §H[SOU.GetNameDef]§! untuk menggantikan §H[WTT_communist_china.GetNameDef]§! sebagai pemimpin komunis.\nLangkah ini akan berujung pada perang melawan §H[WTT_communist_china.GetNameDef]§! jika mereka menolak.\nKesepakatan dengan §H[SOU.GetNameDef]§! ini akan membuka diri kita terhadap tuntutan dari [SOU.GetLeader]\n"
 CHI_the_yanan_incident_desc: "Pemimpin partai saat ini telah memunggungi saudara-saudara sosialis di Uni Soviet. Kita harus mendekati kaum Soviet demi mengamankan dukungan mereka untuk mengobarkan revolusi ke seluruh penjuru Tiongkok."
 CHI_opposition: "Oposisi Terbuka"
 CHI_opposition_effect_tooltip: "§H[WTT_current_china_leader.GetNameDef]§! dapat memulai perang perbatasan melawan kita sebagai tanggapan atas hal ini."
 CHI_opposition_desc: "Pemerintah Pusat rapuh dan korup. Kaum Komunis ingin melenyapkan 5.000 tahun sejarah agung Tiongkok. Situasi ini menuntut Pemimpin Agung sejati, seseorang yang berani mengambil keputusan terberat demi menyatukan negeri — dengan segala cara yang diperlukan."
 CHI_public_works: "Pekerjaan Umum"
 CHI_public_works_desc: "Rakyat harus dapat melihat langsung bahwa kita bekerja demi kemaslahatan mereka. Beberapa proyek prestisius berskala besar akan berfungsi sebagai sarana propaganda yang ampuh dan memberi mereka gambaran nyata betapa majunya seluruh Tiongkok jika mereka mendukung kita sepenuhnya."
 CHI_labor_reform: "Reformasi Ketenagakerjaan"
 CHI_labor_reform_desc: "Metode dan adat kerja di Tiongkok telah berkembang selama ribuan tahun. Kini saatnya membawa tradisi tersebut memasuki era modern."
 CHI_rural_militias: "Milisi Pedesaan"
 CHI_rural_militias_desc: "Di pelosok pedesaan yang luas, bantuan militer sering kali membutuhkan waktu sangat lama untuk mencapai lokasi penyusupan musuh. Dengan membentuk milisi lokal, kita dapat memastikan setiap penyerbu akan menghadapi rintangan berat saat menerobos wilayah pedesaan kita."
 CHI_war_taxes: "Pajak Perang"
 CHI_war_taxes_desc: "Kondisi genting menuntut tindakan yang tegas. Selama perang berkecamuk, kita harus memobilisasi segenap sumber daya ekonomi penduduk hingga batas maksimal."
 CHI_seek_japanese_support: "Cari Dukungan Jepang"
 CHI_seek_japanese_support_desc: "Baik Pemerintah Pusat maupun kaum komunis sama-sama disokong oleh sekutu kuat. Jika kita ingin tampil sebagai pemenang mutlak di akhir pergolakan ini, kita harus menemukan pelindung tangguh bagi diri kita sendiri."
 CHI_personal_leadership: "Kepemimpinan Pribadi"
 CHI_personal_leadership_desc: "Membagi komando militer berisiko memunculkan perwira pembangkang yang haus kekuasaan untuk merebut tampuk pemerintahan. Kita harus memastikan segenap prajurit senantiasa setia tanpa syarat kepada pimpinan."
 CHI_personal_leadership_tt: "§YChen Jitang§! kini tersedia sebagai Marsekal Lapangan level §Y3§!"
 CHI_personal_leadership_custom_tt: "[ROOT.GetLeader] memperoleh salah satu sifat berikut secara acak: §Y$brilliant_strategist$§!, §Y$career_officer$§!, §Y$cavalry_officer$§!, §Y$infantry_officer$§!, §Y$old_guard$§!, §Y$politically_connected$§!, §Y$war_hero$§!."
 CHI_cult_of_personality: "Kultus Individu"
 CHI_cult_of_personality_desc: "Rakyat perlu mengetahui siapa yang memimpin mereka melewati hari-hari kelam ini menuju masa depan yang gemilang, serta memahami kualitas kepemimpinan luar biasa yang disandang tokoh tersebut."
 CHI_provoke_border_clashes: "Bentrok Perbatasan dengan Kaum Nasionalis"
 CHI_provoke_border_clashes_desc: "Kita belum sanggup mengambil risiko perang terbuka skala penuh saat ini. Konflik kecil dan terukur memungkinkan kita merebut tanah berharga tanpa hancur seketika. Idealnya, kita akan menyerang tepat saat lawan sedang mengerahkan pasukannya di tempat lain."
 CHI_defensive_posture: "Postur Bertahan"
 CHI_defensive_posture_desc: "Konflik ini adalah lari maraton, bukan lari cepat. Menantang faksi-faksi lain terlalu dini hanya akan mengundang bencana. Untuk saat ini, kita akan tetap bertahan kokoh."
 CHI_rapid_mobilization: "Mobilisasi Cepat"
 CHI_rapid_mobilization_desc: "Demi menjadi penantang yang disegani dalam kepemimpinan Tiongkok, kita harus melipatgandakan kekuatan militer kita. Kita akan merancang metode-metode baru untuk merampingkan pelatihan dan membentuk angkatan darat yang siap menghadapi ujian apa pun."
 CHI_proclaim_rival_government: "Proklamasikan Pemerintahan Tandingan"
 CHI_proclaim_rival_government_desc: "Kini saatnya meresmikan ambisi kita di panggung dunia. Kita menuntut kendali penuh atas seluruh Tiongkok, dan kita akan berunding dengan segenap bangsa di dunia atas dasar kesetaraan mutlak."
 CHI_industrial_investment: "Investasi Industri"
 CHI_industrial_investment_desc: "Meskipun sumber daya kita terbatas, kita harus tetap menyalurkan modal yang kita miliki demi memperkuat perekonomian kita."
 CHI_public_education_reform: "Reformasi Pendidikan Publik"
 CHI_public_education_reform_desc: "Fondasi sebuah bangsa modern adalah ilmu pengetahuan dan sains. Pertama-tama kita harus memperbaiki dan memperkokoh fondasi tersebut."
 CHI_local_arms_production: "Produksi Senjata Lokal"
 CHI_local_arms_production_desc: "Selama kita hanya dipandang sebagai faksi kecil yang tak berarti dalam perang, kita tidak bisa mengandalkan pengiriman senjata dari luar negeri. Kita harus membangun bengkel persenjataan sendiri untuk memproduksi senapan."
 CHI_long_term_economic_planning: "Perencanaan Ekonomi Jangka Panjang"
 CHI_long_term_economic_planning_desc: "Aparatus birokrasi kita tidak sebesar Pemerintah Pusat. Hal ini memungkinkan kita memangkas birokrasi berbelit-belit yang menghambat pertumbuhan ekonomi, serta memusatkan ikhtiar kita agar menghasilkan dampak setinggi-tingginya."
 CHI_local_arms_development: "Pengembangan Senjata Lokal"
 CHI_local_arms_development_desc: "Memproduksi tiruan kasar dari senjata asing belumlah cukup. Jika kita ingin mengimbangi kekuatan lain di Tiongkok, kita harus merancang senjata baru secara mandiri."
 90_days_tt: "Langkah ini akan memerlukan waktu sekitar 90 hari untuk diterapkan.\n"
 CHI_heavy_weapons_development: "Pengembangan Senjata Berat"
 CHI_heavy_weapons_development_desc: "Di tengah kelangkaan sumber daya, kita harus memanfaatkan daya tembak senjata berat kita semaksimal mungkin. Kita harus memerintahkan perancangan meriam artileri baru."
 CHI_anti_opposition_campaigns: "Kampanye Anti-Oposisi"
 CHI_anti_opposition_campaigns_desc: "Musuh-musuh kita tengah berkumpul tepat di seberang perbatasan. Kita tidak boleh membiarkan mereka leluasa tanpa perlawanan. Serangkaian serangan terukur akan memukul mundur mereka dan memberi kita ruang gerak yang lebih leluasa."
 CHI_anti_opposition_campaigns_effect_tooltip: "Membuka £decision_icon_small §HKeputusan§! untuk memulai §HKonflik Perbatasan§! dengan Panglima Perang yang tidak bekerja sama dengan pihak yang sama dengan kita.\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_communists: "§RBelum ada Panglima Perang yang berpihak pada Kaum Komunis.§!\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_nationalists: "§RBelum ada Panglima Perang yang berpihak pada Kaum Nasionalis.§!\n"
 CHI_institute_cross_border_raids: "Lancarkan Serbuan Lintas Batas"
 CHI_institute_cross_border_raids_desc: "Kita tidak akan diperhitungkan sebagai penantang independen dalam perebutan kepemimpinan Tiongkok kecuali kita membuktikan kepada dunia bahwa kita mampu dan berani bertarung mempertahankan tanah kita. Beberapa serbuan kecil akan memperlihatkan tekad baja kita dan memungkinkan kita merebut wilayah lawan yang tidak terjaga."
 CHI_institute_cross_border_raids_effect_tooltip: "Membuka £decision_icon_small §HKeputusan§! untuk memulai §HKonflik Perbatasan§! dengan para Panglima Perang dan [WTT_communist_china.GetNameDef]\n"
 CHI_provoke_border_clashes_effect_tooltip: "Membuka £decision_icon_small §HKeputusan§! untuk memulai §HKonflik Perbatasan§! dengan [WTT_current_china_leader.GetNameDef]\n"
 CHI_inflation_up_tt: "§RMenaikkan§! inflasi.\n"
 CHI_inflation_down_tt: "§GMenurunkan§! inflasi.\n"
 CHI_invite_foreign_investors: "Undang Investor Asing"
 CHI_invite_foreign_investors_desc: "Betapapun memalukannya, jalan tercepat untuk mengindustrialisasi bangsa kita adalah dengan mendekati pihak-pihak yang selama ini mengeksploitasi kita."
 CHI_mission_to_germany: "Misi ke Jerman"
 CHI_mission_to_germany_desc: "Negara yang pernah terkucilkan di Eropa ini telah membuat kemajuan luar biasa dalam mereformasi negeri mereka dan memulihkan kejayaan masa lalu. Kita dapat memetik banyak pelajaran berharga dari mereka."
 CHI_give_falkenhausen_citizenship: "Beri Kewarganegaraan pada von Falkenhausen"
 CHI_give_falkenhausen_citizenship_desc: "Para penasihat militer Jerman telah memberikan sumbangsih luar biasa dalam membangun dan memodernisasi militer kita. Kita harus memastikan mereka dapat tetap tinggal di sini, apa pun perubahan situasi politik yang terjadi."
 falkenhausen_tt: "Negara lain telah lebih dulu menawarkan kewarganegaraan kepada von Falkenhausen."
 CHI_chinese_general_staff: "Staf Umum Tiongkok"
 CHI_chinese_general_staff_desc: "Staf Umum yang terorganisir rapi adalah kunci keberhasilan operasi militer yang rumit. Kita harus meneladani contoh Jerman dan mendirikan lembaga komando serupa."
 CHI_wargaming_division: "Divisi Simulasi Perang"
 CHI_wargaming_division_desc: "Kita harus membentuk departemen khusus di dalam Staf Umum yang berfokus memprediksi peperangan masa depan serta merumuskan taktik dan strategi baru untuk melumpuhkan musuh. Mereka bahkan dapat menggunakan semacam perangkat komputasi untuk mensimulasikan perang dunia..."
 CHI_closer_ties_with_germany: "Pererat Hubungan dengan Jerman"
 CHI_closer_ties_with_germany_desc: "Misi diplomatik kita ke Jerman telah membuka peluang kerja sama yang kian erat, termasuk pinjaman modal untuk mendanai pembangunan industri lebih lanjut."
 CHI_purchase_tanks: "Beli Tank"
 CHI_purchase_tanks_desc: "Kendaraan lapis baja akan menjadi ujung tombak peperangan modern. Kita harus membeli sejumlah tank sebagai persiapan pembentukan unit lapis baja pertama bagi tentara Tiongkok."
 CHI_chinese_panzers: "Panzer Tiongkok"
 CHI_chinese_panzers_desc: "Tank-tank Jerman tanpa ragu adalah yang terhebat di dunia. Kita harus meneladani keunggulan mereka dan merancang tank kita sendiri berdasarkan cetak biru tersebut."
 CHI_tank_plant: "Pabrik Tank"
 CHI_tank_plant_desc: "Seiring riset tank baru yang kian maju, kini kita dapat berinvestasi mendirikan pabrik khusus untuk memproduksinya secara massal."
 CHI_experimental_mechanised_unit: "Unit Mekanis Percobaan"
 CHI_experimental_mechanised_unit_effect: "Dapatkan sebuah Divisi dengan 2 batalion §YTank Ringan§! dan 4 batalion §YBermotor§!\n"
 CHI_experimental_mechanised_unit_desc: "Para pakar militer di Eropa telah lama memperdebatkan cara terbaik mengerahkan tank. Terbukti bahwa menggabungkan infanteri bergerak cepat dengan tank lincah merupakan pendekatan paling unggul. Kita akan membentuk unit semacam itu."
 CHI_combined_arms_warfare: "Peperangan Senjata Terpadu"
 CHI_combined_arms_warfare_desc: "Kendati truk memadai untuk eksperimen awal peperangan mekanis modern, kinerja lintas medan yang buruk serta ketiadaan perisai baja membuatnya kurang cocok untuk pertempuran di garis terdepan."
 CHI_hire_soviet_designer: "Rekrut Perancang Soviet"
 CHI_hire_soviet_designer_desc: "Uni Soviet telah lama bereksperimen dengan tank dan memiliki sejumlah perancang tank terbaik di dunia. Kita dapat merekrut salah satu dari mereka untuk merancang kendaraan tempur lapis baja bagi kita."
 CHI_joint_tank_development: "Pengembangan Tank Bersama"
 CHI_joint_tank_development_desc: "Berdasarkan pengalaman berharga dari kerja sama dengan perancang Soviet, kita harus membentuk tim perancang gabungan demi mengoordinasikan pekerjaan dan saling belajar satu sama lain secara lebih baik."
 CHI_mission_to_the_soviet_union: "Misi ke Uni Soviet"
 CHI_mission_to_the_soviet_union_desc: "Uni Soviet menaruh minat besar terhadap Tiongkok, terutama sebagai penyeimbang ekspansionisme Jepang. Kita harus mengirim misi diplomatik ke Moskwa untuk melihat kesamaan tujuan kita."
 CHI_rapprochement_with_soviet_union: "Pendekatan dengan Uni Soviet"
 CHI_rapprochement_with_soviet_union_desc: "Kendati kita memiliki perbedaan ideologis dengan Uni Soviet, jelas bahwa mereka memiliki kepentingan strategis yang serupa dengan kita. Kita harus meresmikan hubungan baru ini dan menandatangani pakta non-agresi timbal balik guna menunjukkan kepada dunia bahwa kita berdiri bersama."
 CHI_invite_soviet_advisers: "Undang Penasihat Soviet"
 CHI_invite_soviet_advisers_desc: "Pihak Soviet telah menawarkan pengiriman misi militer untuk membantu kita membangun kembali angkatan perang kita."
 soviet_advisers_tt: "Kaum Soviet telah mengirim misi militer ke salah satu faksi di Tiongkok"
 CHI_the_soviet_volunteer_group_focus: "Grup Sukarelawan Soviet"
 CHI_the_soviet_volunteer_group_focus_desc: "Angkatan udara kita masih sangat lemah dibandingkan dengan kekuatan lain di kawasan ini. Pihak Soviet tampak terbuka terhadap kemungkinan mengirimkan kelompok penerbang sukarelawan."
 CHI_reach_out_to_france: "Jalin Hubungan dengan Prancis"
 CHI_reach_out_to_france_desc: "Meskipun Prancis berulang kali mempermalukan kita dan memaksakan konsesi-konsesi baru, dalam situasi genting saat ini kita mungkin sangat memerlukan bantuan mereka."
 CHI_small_arms_expertise: "Keahlian Senjata Ringan"
 CHI_small_arms_expertise_desc: "Senapan perorangan masih menjadi senjata penentu dalam angkatan darat kita. Kita harus memusatkan sumber daya yang ada demi menjaga persenjataan ini semodern mungkin."
 CHI_elite_mountaineers: "Pasukan Gunung Elit"
 CHI_elite_mountaineers_desc: "Peperangan di pegunungan terjal adalah seni tempur yang sama sekali berbeda dibandingkan bertempur di dataran terbuka. Kita harus melatih divisi-divisi khusus dalam keahlian ini demi memanfaatkan kontur medan kita secara optimal."
 CHI_free_mountain_template_tt: "Dapatkan templat dengan §Y7 batalion Gunung§! dan §Y2 batalion Artileri§!.\n"
 CHI_heavy_weapons: "Senjata Berat"
 CHI_heavy_weapons_desc: "Pasukan tanpa dukungan artileri tidak akan mampu membendung serangan serius dari lawan. Kita harus memastikan angkatan perang kita diperlengkapi secara memadai untuk menghadapi ancaman ini."
 CHI_guarantee_the_hanoi_route: "Jamin Jalur Hanoi"
 CHI_guarantee_the_hanoi_route_desc: "Rute melalui Hanoi dan mengarah ke utara menuju perbatasan kita menawarkan pasokan bantuan paling potensial dari dunia luar seandainya perang dengan Jepang meletus."
 CHI_construction_battalions: "Batalion Zeni Konstruksi"
 CHI_construction_battalions_desc: "Jika ada satu hal yang melimpah ruah di negeri kita, itu adalah sumber daya manusia. Kita dapat membentuk unit-unit zeni khusus bermodalkan cangkul dan sekop untuk melaksanakan pekerjaan rekayasa militer yang vital."
 CHI_french_military_mission: "Misi Militer Prancis"
 CHI_french_military_mission_desc: "Angkatan Darat Prancis adalah salah satu yang terlatih paling baik di Eropa. Kita dapat memetik banyak ilmu berharga dari pengalaman mereka."
 CHI_french_drill: "Latihan Tempur Prancis"
 CHI_french_drill_desc: "Pengalaman Prancis dalam Perang Besar telah melahirkan doktrin tentara yang unggul dalam pertahanan kokoh. Dengan mengadopsi metode pelatihan dan standar mereka, kita dapat meningkatkan kapabilitas pertahanan kita sendiri."
 CHI_modern_logistics: "Logistik Modern"
 CHI_modern_logistics_desc: "Tanpa sistem logistik yang berfungsi prima, kita tidak akan mampu mempertahankan pasukan di medan tempur."
 CHI_renegotiate_the_unequal_treaties: "Negosiasi Ulang Perjanjian Tak Adil"
 CHI_renegotiate_the_unequal_treaties_desc: "Sekian lama bangsa-bangsa Barat mendikte cara kita berniaga di tanah air sendiri. Warga negara mereka kebal hukum dari peradilan kita, dan kita tidak memiliki kedaulatan dalam mengatur perdagangan mereka di kota-kota kita. Tirani ini harus berakhir. Kita akan berdiri sejajar dengan mereka sekali lagi."
 CHI_one_china_policy: "Kebijakan Satu Tiongkok"
 CHI_one_china_policy_desc: "Di tengah kekacauan pasca-revolusi, sejumlah wilayah memisahkan diri dan mencoba membentuk negara sendiri. Ada yang berhenti tunduk pada pemerintah pusat, ada pula yang berlagak menjadi negara berdaulat. Kini, setelah kita makin perkasa, kita menyatakan secara terbuka bahwa kita menuntut pemulihan perbatasan historis Tiongkok yang telah tegak selama berabad-abad."
 CHI_integrate_tibet: "Integrasikan Tibet"
 CHI_integrate_tibet_desc: "Eksperimen kemerdekaan Tibet telah usai. Invasi militer adalah sebuah opsi, namun kita sebaiknya mencoba membawa mereka kembali ke pangkuan tanah air melalui jalur damai terlebih dahulu."
 CHI_conquer_tibet: "Taklukkan Tibet"
 CHI_conquer_tibet_desc: "Tibet menguasai medan yang sangat kritis secara strategis di antara negeri kita dan India. Mereka terlalu lemah untuk mempertahankan diri. Kita harus bertindak demi mengamankan sayap selatan kita."
 CHI_renounce_the_mcmahon_line: "Tolak Garis McMahon"
 CHI_renounce_the_mcmahon_line_desc: "Garis perbatasan lama yang ditarik sepihak antara Pemerintah Kekaisaran dan pihak Inggris tidak pernah adil, bahkan ketika Inggris berpura-pura menghormatinya. Selama beberapa dekade, kita terlalu lemah untuk menentangnya. Kini hal itu berakhir."
 CHI_demand_mongolia: "Tuntut Mongolia"
 CHI_demand_mongolia_desc: "Terjepit di antara kita dan Rusia, Mongolia dapat jatuh ke tangan mereka kapan saja. Kita harus mengambil inisiatif lebih dahulu."
 CHI_anti_imperialism: "Anti-Imperialisme"
 CHI_lessons_of_war_completed: "Menyelesaikan seluruh tahapan §YReformasi Angkatan Darat§! dan §YPelajaran Perang§!\n"
 CHI_anti_imperialism_desc: "Hari ini kita berdiri sebagai salah satu bangsa pelopor yang telah melepaskan belenggu kolonialisme. Adalah tugas suci kita untuk memastikan segenap bangsa lain di Asia juga dapat menentukan nasib mereka sendiri secara merdeka."
 CHI_guidance_and_support: "Bimbingan dan Dukungan"
 CHI_guidance_and_support_desc: "Rakyat Indochina masih membutuhkan bantuan untuk membangun bangsa mereka sendiri. Kita akan memastikan mereka tidak jatuh lagi ke bawah tekanan asing."
 CHI_indian_cooperation: "Kerja Sama dengan India"
 CHI_indian_cooperation_desc: "Rakyat India tengah berjuang melepaskan belenggu penindasan kolonial terakhir. Kita harus merangkul mereka, menyokong perjuangan mereka, dan bekerja sama demi masa depan gemilang bagi kedua bangsa."
 CHI_commit_to_korean_independence: "Komitmen Kemerdekaan Korea"
 CHI_commit_to_korean_independence_desc: "Bangsa Korea adalah korban pertama dari pendudukan Jepang. Mereka berhak berdiri kembali sebagai bangsa merdeka di antara bangsa-bangsa dunia."
 CHI_influence_mongolia: "Pengaruhi Mongolia"
 CHI_influence_mongolia_desc: "Menjadikan Mongolia sebagai negara penyangga antara kita dan Rusia akan mengamankan sayap utara kita. Kita hanya perlu memastikan mereka sanggup mempertahankan diri mereka sendiri."
 CHI_imperial_legacy: "Warisan Kekaisaran"
 CHI_imperial_legacy_desc: "Tiongkok telah berdiri sebagai kekuatan dominan di Timur selama ribuan tahun, menjamin perdamaian dan stabilitas di kawasan. Kini saatnya kita merebut kembali kedudukan agung masa lalu tersebut."
 CHI_overlordship_over_indochina: "Pertuanan atas Indochina"
 CHI_overlordship_over_indochina_desc: "Indochina senantiasa bergantung pada perlindungan Tiongkok sejak masa lampau. Fakta bahwa kawasan itu jatuh ke tangan Prancis membuktikan bahwa mereka tidak mampu melindungi diri mereka sendiri."
 CHI_dominate_japan: "Dominasi Jepang"
 CHI_dominate_japan_desc: "Selama beberapa dekade, Jepang telah menjadi ancaman terbesar bagi kedaulatan kita. Mereka bersekutu dengan Kekuatan Barat untuk menundukkan kita di masa lalu. Kita tidak boleh membiarkan mereka melancarkan agresi baru. Kita harus menyerang terlebih dahulu."
 CHI_secure_the_peninsula: "Amankan Semenanjung"
 CHI_secure_the_peninsula_desc: "Demi kepentingan strategis terbaik kita, semenanjung Korea tidak boleh lagi diduduki oleh kekuatan yang memusuhi kita."
 CHI_british_cooperation: "Kerja Sama dengan Inggris"
 CHI_british_cooperation_desc: "Kendati mereka adalah gembong imperialis, bekerja sama dengan Inggris menawarkan peluang paling menjanjikan untuk memodernisasi angkatan udara kita dan menjamin kelancaran pasokan suplai perang."
 CHI_burma_road: "Jalur Burma"
 CHI_burma_road_desc: "Jalur Burma merupakan urat nadi penghubung kita dengan dunia barat. Rute ini harus dijaga dengan taruhan nyawa dan diperluas guna menjamin kelancaran arus perbekalan militer."
 CHI_ledo_road: "Jalur Ledo"
 CHI_ledo_road_desc: "Jalur Burma semata tidak sanggup menopang kebutuhan perang kita. Kita harus membuka rute-rute baru demi mengalirkan perbekalan agar kita tetap mampu bertempur."
 CHI_fighter_purchases: "Pembelian Pesawat Tempur"
 CHI_fighter_purchases_desc: "Angkatan Udara kita membutuhkan pesawat tempur modern demi mengimbangi ancaman asing. Industri kita belum sanggup memproduksinya, sehingga kita harus membelinya dari luar negeri."
 CHI_camco: "CAMCO"
 CHI_camco_desc: "Jika kita ingin membangun industri penerbangan yang mandiri, pertama-tama kita harus menguasai teknik dan metode perakitan serta pemeliharaan pesawat yang telah kita miliki saat ini."
 CHI_local_fighter_production: "Produksi Pesawat Tempur Lokal"
 CHI_local_fighter_production_desc: "Dengan tenaga kerja yang kini telah terampil dalam pemeliharaan dasar, kita dapat melanjutkan langkah dengan memproduksi seluruh komponen pesawat tempur modern."
 CHI_local_bomber_production: "Produksi Pesawat Pembom Lokal"
 CHI_local_bomber_production_desc: "Setelah menguasai teknologi produksi pesawat bermesin tunggal, kita dapat melangkah untuk merancang dan memproduksi pesawat multi-mesin yang lebih berat guna memberikan dukungan tembakan udara ke darat."
 CHI_the_hump: "Rute The Hump"
 CHI_the_hump_desc: "Operasi jembatan udara melintasi pegunungan Himalaya memang pengganti yang terbatas bagi jalur transportasi darat, namun rute lintas udara ini jauh lebih sulit untuk diganggu oleh musuh."
 CHI_chinese_expeditionary_force: "Pasukan Ekspedisi Tiongkok"
 CHI_chinese_expeditionary_force_desc: "Demi mengoordinasikan operasi militer bersama sekutu secara lebih efektif, pihak Amerika telah mengirimkan salah satu Jenderalnya untuk memimpin pasukan gabungan."
 CHI_the_chu_x_po: "Chu X-PO"
 CHI_the_chu_x_po_desc: "Chu X-PO menandai puncak pencapaian inovasi dirgantara di Tiongkok — pesawat tempur pertama yang dirancang dan diproduksi secara mandiri di dalam negeri, sanggup bertarung tangguh melawan musuh mana pun."
 CHI_mission_to_the_us: "Misi ke Amerika Serikat"
 CHI_mission_to_the_us_soong_us_decision: "Selama §YSoong Mei-Ling§! menjabat sebagai §YPenasihat Politik§!, Amerika Serikat dapat mendukung perang kita melawan §YJepang§!\n"
 CHI_mission_to_the_us_desc: "Tiongkok telah lama memiliki sahabat karib di Amerika Serikat. Merekalah peluang terbaik kita untuk memperoleh sokongan logistik dan persenjataan yang kita butuhkan."
 CHI_hire_chennault: "Rekrut Chennault"
 CHI_hire_chennault_desc: "Claire Chennault adalah teoretisi perang udara asal Amerika Serikat yang berminat mengabdi bagi perjuangan kita. Kita harus merekrutnya demi merombak dan melatih angkatan udara kita."
 CHI_invite_the_flying_tigers: "Undang Harimau Terbang (Flying Tigers)"
 CHI_invite_the_flying_tigers_desc: "Rekan-rekan kita di Amerika Serikat telah membentuk kelompok sukarelawan penerbang dan membeli sejumlah pesawat tempur modern untuk menyokong kita. Kita hanya perlu menyambut dan merestui kedatangan mereka."
 CHI_sino_american_cooperative_organization: "Organisasi Kerja Sama Tiongkok-Amerika (SACO)"
 CHI_sino_american_cooperative_organization_desc: "Dinas intelijen Amerika Serikat bersedia bekerja sama dengan kita dalam menyelenggarakan operasi khusus rahasia di garis belakang musuh. Langkah ini akan membantu kita mengembangkan kapabilitas kita sendiri di bidang ini."
 CHI_light_cruiser_project: "Proyek Penjelajah Ringan"
 CHI_light_cruiser_project_desc: "Langkah awal dalam membangun angkatan laut samudra yang disegani adalah memodernisasi armada kapal penjelajah kita. Proyek perdana kita sebaiknya tidak terlalu ambisius."
 CHI_heavy_cruiser_project: "Proyek Penjelajah Berat"
 CHI_heavy_cruiser_project_desc: "Berbekal keberhasilan rancangan kapal penjelajah sebelumnya, kita dapat memperbesar skala dan performanya, menciptakan kapal tempur tangguh demi mengawal armada kita."
 CHI_naval_aviation: "Penerbangan Angkatan Laut"
 CHI_naval_aviation_desc: "Masa depan peperangan laut adalah kapal induk. Kita tidak akan pernah diakui sebagai kekuatan maritim sejati kecuali kita mengoperasikan kapal induk sendiri."
 CHI_carrier_air_wing: "Skuadron Udara Kapal Induk"
 CHI_carrier_air_wing_desc: "Kapal induk hanya sehebat skuadron udara yang diluncurkan dari geladaknya. Kita harus memastikan pesawat-pesawat tersebut adalah jenis paling andal dan tercanggih yang tersedia."
 CHI_investment_into_shipbuilding: "Investasi Pembuatan Kapal"
 CHI_investment_into_shipbuilding_desc: "Armada besar membutuhkan basis industri perkapalan yang kuat untuk menopangnya. Kita harus mengundang investor asing guna membantu mendirikan galangan-galangan kapal baru."
 CHI_order_destroyers: "Pesan Kapal Perusak"
 CHI_order_destroyers_desc: "Sebagai langkah pertama pembangunan kembali armada perang kita, sejumlah kecil kapal perusak harus segera diproduksi."
 CHI_train_marines: "Latih Marinir"
 CHI_train_marines_desc: "Garis pantai kita yang sangat panjang rentan terhadap pendaratan musuh, namun di saat yang sama juga membuka kesempatan untuk melancarkan serangan kejutan dari arah laut seandainya musuh menyerbu lewat darat."
 CHI_collaboration_with_the_japanese: "Kolaborasi dengan Jepang"
 CHI_collaboration_with_the_japanese_desc: "Apa pun rencana mereka atas Tiongkok, pihak Jepang telah menegaskan bahwa mereka bersedia bekerja sama jika kita menunjukkan rasa hormat yang pantas."
 CHI_modern_submarines: "Kapal Selam Modern"
 CHI_modern_submarines_desc: "Pihak Jepang enggan memberi kita pengetahuan teknis untuk menantang armada mereka dalam pertempuran laut terbuka, namun mereka memandang kapal selam hanyalah senjata pendukung. Kita tentu tidak harus sependapat dengan anggapan itu."
 CHI_coastal_patrol_planes: "Pesawat Patroli Pantai"
 CHI_coastal_patrol_planes_desc: "Garis pantai kita yang panjang hanya dapat dipatroli secara efektif dari udara. Pesawat pembom patroli maritim modern akan memungkinkan kita mempertahankan pantai tanpa memboroskan terlalu banyak sumber daya."
 CHI_three_principles_of_the_people: "Tiga Prinsip Rakyat (San Min Chu-i)"
 CHI_three_principles_of_the_people_desc: "Pendiri republik, Dr. Sun Yat-Sen, merumuskan tiga prinsip fundamental yang menjadi pedoman bangsa: Minzu, Minquan, dan Minsheng — Nasionalisme, Demokrasi, dan Kesejahteraan Sosial."
 CHI_welfare: "Kesejahteraan Sosial"
 CHI_welfare_desc: "Negara modern berkewajiban melindungi dan mengayomi rakyatnya, sehingga di saat bahaya mengancam, rakyat akan rela dan berani berkorban demi membelanya."
 CHI_refugee_relief_agency: "Badan Bantuan Pengungsi"
 CHI_refugee_relief_agency_desc: "Akibat amukan perang, jutaan rakyat kehilangan tempat tinggal. Kita akan mendirikan badan khusus untuk menolong para pengungsi menemukan tempat bernaung yang baru."
 CHI_land_tax_reform: "Reformasi Pajak Tanah"
 CHI_land_tax_reform_desc: "Keuangan negara kita sangat membutuhkan reformasi mendesak. Salah satu langkah kuncinya adalah memperluas basis penerimaan pajak tanah kita."
 CHI_refugee_resettlement: "Pemukiman Kembali Pengungsi"
 CHI_refugee_resettlement_desc: "Jutaan pengungsi malang yang terlunta-lunta akibat perang perlu dimukimkan kembali secara teratur. Memberi mereka hunian dan lahan berarti mengamankan sumber rekrutmen penting bagi ketentaraan dan perekonomian kita."
 CHI_new_life_movement: "Gerakan Hidup Baru"
 CHI_new_life_movement_desc: "Empat kebajikan luhur: Moralitas, Kejujuran, Keadilan, dan Kesetiaan kelak akan memandu setiap warga negara menuju kehidupan yang lebih mulia dan berdaya guna."
 CHI_unemployment_assistance: "Bantuan Pengangguran"
 CHI_unemployment_assistance_desc: "Kehilangan pekerjaan jangan sampai menjerumuskan warga negara ke dalam jurang kemiskinan dan keputusasaan. Kelaparan adalah sekutu paling mematikan bagi kaum Komunis."
 CHI_free_hospitals: "Rumah Sakit Gratis"
 CHI_free_hospitals_desc: "Bangsa yang agung pantang menelantarkan rakyatnya saat mereka didera penyakit. Dengan membangun sistem layanan kesehatan yang komprehensif, kita akan memastikan peningkatan taraf kesehatan segenap rakyat. Mereka pun akan bersatu padu membela negeri ini."
 CHI_rural_schooling: "Pendidikan Pedesaan"
 CHI_rural_schooling_desc: "Penduduk yang terdidik adalah kunci memodernisasi suatu bangsa. Kita tidak boleh hanya mengandalkan segelintir birokrat terpelajar, melainkan harus membawa semangat ilmu pengetahuan dan sains ke setiap pelosok desa."
 CHI_democracy: "Demokrasi"
 CHI_democracy_desc: "Perjalanan yang dirintis Dr. Sun Yat-Sen pada akhirnya harus bermuara pada terbentuknya sebuah republik sejati. Ini tentu perjalanan panjang, namun kita menapakinya selangkah demi selangkah."
 CHI_constitutional_reform: "Reformasi Konstitusi"
 CHI_constitutional_reform_desc: "Persoalan yang kita hadapi saat ini berakar sebagian dari belum adanya konstitusi yang mencerminkan kenyataan hidup di Tiongkok. Kita harus segera membenahinya."
 CHI_republicanism: "Republikanisme"
 CHI_republicanism_desc: "Banyak kalangan di Barat ragu apakah kita bersungguh-sungguh ingin membangun republik berlandaskan model peradaban modern. Kita harus menyatakan secara tegas niat tulus kita kepada dunia."
 CHI_inter_party_coordination_council: "Dewan Koordinasi Antar-Partai"
 CHI_inter_party_coordination_council_desc: "Langkah awal untuk mengubah negeri kita menjadi demokrasi multi-partai yang berfungsi sehat serta mengakhiri masa perwalian politik rakyat adalah dengan mendirikan wadah yang memungkinkan partai-partai lain bersuara dalam penyusunan kebijakan."
 CHI_judicial_yuan: "Yuan Yudisial"
 CHI_judicial_yuan_desc: "Dr. Sun Yat-Sen mencita-citakan republik modern dengan pemisahan kekuasaan yang tegas. Badan peradilan kita harus merdeka dari tekanan luar dan memutus perkara murni berlandaskan hukum semata."
 CHI_control_yuan: "Yuan Kontrol"
 CHI_control_yuan_desc: "Korupsi adalah bahaya laten dalam pemerintahan mana pun. Pemerintahan yang efektif membutuhkan pengawasan ketat. Kita akan membentuk cabang kekuasaan pengawas tersendiri yang setara dengan lembaga legislatif, eksekutif, dan yudisial."
 CHI_examination_yuan: "Yuan Ujian"
 CHI_examination_yuan_desc: "Selama ribuan tahun, para abdi negara Tiongkok diseleksi melalui ujian kenegaraan yang amat ketat. Kendati materi ujiannya telah berganti di zaman modern ini, prinsip dasarnya tetap luhur."
 CHI_executive_yuan: "Yuan Eksekutif"
 CHI_executive_yuan_desc: "Inti dari roda pemerintahan adalah badan Eksekutif yang menjalankan roda hukum. Sangatlah beralasan bahwa pembentukannya menjadi langkah paling mendasar dalam melahirkan pemerintahan republik yang berdaya."
 CHI_legislative_yuan: "Yuan Legislatif"
 CHI_legislative_yuan_desc: "Hak rakyat untuk memilih badan perwakilan yang menyusun undang-undang berada di jantung republik modern. Bangsa kita pantang tertinggal dalam menegakkan pilar agung ini."
 CHI_nationalism: "Nasionalisme"
 CHI_nationalism_desc: "Kesadaran menjadi bagian dari satu bangsa — alih-alih sekadar suku atau aliran agama — adalah ikatan suci yang mentransformasikan sekelompok manusia menjadi sebuah negara berdaulat."
 CHI_foreign_threats: "Ancaman Asing"
 CHI_foreign_threats_desc: "Beberapa tahun silam, Jepang merampas Manchuria dari kita dan mendirikan negara boneka. Mereka tidak akan berhenti sebelum menguasai seluruh Tiongkok. Kita harus siap menghadapi mereka, bahkan jika itu berarti harus berkompromi dengan para penguasa perang lokal."
 CHI_prioritize_the_interior: "Utamakan Pedalaman"
 CHI_prioritize_the_interior_desc: "Sebelum kita berpikir untuk merebut kembali wilayah yang dirampas Jepang, kita harus mengamankan wilayah pedalaman kita terlebih dahulu. Jika negeri ini terpecah-belah dan saling berperang, kita tak akan punya harapan menang."
 CHI_united_front: "Front Persatuan"
 CHI_united_front_desc: "Dengan moncong senjata Jepang yang menodong di tengkuk kita, kita harus bersedia menerima bantuan dari mana pun — bahkan dari kaum komunis sekalipun."
 CHI_pick_a_fight_with_japan: "Hadapi Jepang Secara Terbuka"
 CHI_pick_a_fight_with_japan_desc: "Bertahun-tahun lamanya Jepang terus menimbun tuntutan demi tuntutan ke pundak kita. Masa-masa kelam itu kini berakhir. Begitu mereka berani menuntut bahkan sejengkal pun tanah kita lagi, kita pantang mundur barang seujung kuku!"
 CHI_anti_communism: "Anti-Komunisme"
 CHI_anti_communism_desc: "Komunisme adalah ancaman paling berbahaya terhadap masa depan bangsa kita. Paham ini harus diberantas sampai tuntas tanpa belas kasihan."
 CHI_subjugate_the_warlords: "Tundukkan Para Panglima Perang"
 CHI_subjugate_the_warlords_desc: "Di saat bangsa kita melemah, para jenderal lokal merampas kekuasaan di berbagai provinsi. Kini saatnya mengingatkan mereka bahwa mereka tunduk di bawah perintah kita — baik lewat jalur damai maupun ujung bedil."
 CHI_war_of_resistance: "Perang Perlawanan"
 CHI_war_of_resistance_desc: "Kita belum cukup kuat untuk memindahkan medan laga ke wilayah Jepang. Kita harus bertahan sekuat tenaga melawan penjajah hingga tiba saatnya kita sanggup melancarkan serangan balasan."
 CHI_industrial_evacuations: "Evakuasi Industri"
 CHI_industrial_evacuations_desc: "Perang modern dimenangkan di pabrik-pabrik. Pasukan bersenjata tanpa pasokan peluru dan senapan hanyalah sekelompok orang malang berseragam."
 CHI_war_of_national_liberation: "Perang Pembebasan Nasional"
 CHI_war_of_national_liberation_desc: "Dengan berhasil dipatahkannya gempuran Jepang, kita kini dapat beralih menyerang dan membebaskan setiap jengkal tanah air kita yang terampas."
 CHI_scorched_earth_tactics: "Taktik Bumi Hangus"
 CHI_scorched_earth_tactics_desc: "Dalam pertarungan demi kelangsungan hidup bangsa, tidak ada hal yang tabu dan setiap opsi harus dipertimbangkan demi kemenangan."
 CHI_war_of_anti_imperialism: "Perang Anti-Imperialisme"
 CHI_war_of_anti_imperialism_desc: "Setelah tanah air kita terbebas dari penindasan, kini kita mengarahkan pandangan ke garis pertahanan musuh demi memastikan tidak ada lagi invasi yang dilancarkan dari sana."
 CHI_forced_conscription: "Wajib Militer Paksa"
 CHI_forced_conscription_desc: "Metode rekrutmen kita saat ini tidak menghasilkan cukup prajurit untuk memenuhi tuntutan medan tempur. Kekalahan dalam perang ini berarti kepunahan bangsa, maka kita harus menuntut pengorbanan lebih besar dari rakyat kita."
 CHI_dare_to_die_corps: "Korps Berani Mati"
 CHI_50_cheaper_force_attack: "Biaya §G-50%§! untuk §YPaksa Serangan§!\n"
 CHI_dare_to_die_corps_desc: "Perjuangan menegakkan republik telah melahirkan begitu banyak martir mulia. Masih banyak lagi yang akan berkorban sebelum badai ini berlalu. Pengorbanan suci mereka akan dikenang abadi oleh generasi mendatang."
 CHI_military_affairs_commission: "Komisi Urusan Militer"
 CHI_military_affairs_commission_desc: "Militer kita memperlihatkan kelemahan kepemimpinan yang memprihatinkan. Reformasi komando tinggi adalah langkah mutlak pertama untuk membenahinya."
 CHI_fortify_shanghai: "Bentengi Shanghai"
 CHI_fortify_shanghai_desc: "Jika Jepang menyerang, pukulan pertama mereka pasti mendarat di Shanghai. Kita harus siap menyambut mereka dengan benteng baja."
 CHI_army_reform: "Reformasi Angkatan Darat"
 CHI_army_reform_desc: "Korupsi, ketidakcakapan, dan kepengecutan masih menjangkiti berbagai tingkat komando pasukan kita. Membenahinya akan menjadi perjuangan panjang dan berliku."
 CHI_bureau_of_investigation_and_statistics: "Biro Investigasi dan Statistik (Juntong)"
 CHI_bureau_of_investigation_and_statistics_desc: "Kita tidak boleh membiarkan pengkhianat dan mata-mata berkeliaran bebas di negeri kita di saat kita tengah bertaruh nyawa demi masa depan bangsa. Metode badan intelijen ini mungkin tampak kejam, namun tugas kotor ini mutlak harus dikerjakan."
 CHI_the_chinese_hindenburg_line: "Garis Hindenburg Tiongkok"
 CHI_the_chinese_hindenburg_line_desc: "Para penasihat Jerman kita telah mewariskan taktik pembentengan berharga dari pengalaman Perang Besar. Setiap upaya musuh untuk menerobos keluar dari Shanghai akan remuk hancur di hadapan perbentengan ini."
 CHI_60_divisions_plan: "Rencana 60 Divisi"
 CHI_60_divisions_plan_desc: "Alih-alih mengandalkan gelombang massa manusia semata, para penasihat asing kita mengusulkan rencana perombakan radikal: Angkatan perang yang lebih ramping namun terdiri atas divisi-divisi elit berkemampuan tempur tinggi. Proyek percontohannya telah dimulai."
 CHI_whampoa_military_academy: "Akademi Militer Whampoa"
 CHI_whampoa_military_academy_desc: "Pasukan perang tak ada gunanya tanpa kepemimpinan perwira yang tangguh. Jika kita ingin mengubah ketentaraan kita menjadi kekuatan tempur kelas satu, kita harus melahirkan perwira-perwira berdisiplin baja."
 CHI_unified_industrial_planning: "Perencanaan Industri Terpadu"
 CHI_unified_industrial_planning_desc: "Program industrialisasi agresif kita tidak boleh tertunda walau sekejap pun."
 CHI_expand_the_academica_sinica: "Perluas Academia Sinica"
 CHI_expand_the_academica_sinica_desc: "Selama berabad-abad, Tiongkok memimpin dunia dalam perkembangan ilmu pengetahuan dan kesenian. Peningkatan pendanaan bagi perguruan tinggi kita adalah langkah perdana untuk merebut kembali takhta keilmuan tersebut."
 CHI_chemical_research_institute: "Institut Riset Kimia"
 CHI_chemical_research_institute_desc: "Kendati kita tidak akan pernah menjadi pihak pertama yang menggunakan senjata kimia, kita harus tetap siap mempertahankan diri seandainya diserang dengan gas beracun. Kita harus mendanai institut riset khusus demi menguasai teknologi pertahanan yang diperlukan."
 CHI_rural_reconstruction_movement: "Gerakan Rekonstruksi Pedesaan"
 CHI_rural_reconstruction_movement_desc: "Di saat kita membuat lompatan pesat dalam memajukan taraf hidup warga kota, hanya beberapa kilometer dari sana kaum tani masih hidup dalam kondisi abad pertengahan. Kita akan memastikan setiap warga negara dapat menikmati hasil kemakmuran ini."
 CHI_mining_commission: "Komisi Pertambangan"
 CHI_mining_commission_desc: "Sumber daya alam sangat vital demi kelangsungan upaya perang. Kita harus mengambil alih kendali industri pertambangan guna memastikan pasokan bahan mentah yang kita butuhkan senantiasa terpenuhi."
 CHI_taiyuan_arsenal: "Pabrik Persenjataan Taiyuan"
 CHI_taiyuan_arsenal_desc: "Pabrik Persenjataan Taiyuan adalah satu dari segelintir fasilitas di Tiongkok yang mampu memproduksi persenjataan berat. Kita harus memperluas kapasitasnya demi memasok pasukan kita dengan artileri dan amunisi modern."
 CHI_develop_the_hanyan_arsenal: "Kembangkan Pabrik Persenjataan Hanyang"
 CHI_develop_the_hanyan_arsenal_desc: "Pabrik Persenjataan Hanyang telah lama memasok senapan bagi tentara Tiongkok. Mengembangkan fasilitas ini akan menjamin produksi senjata tetap berkesinambungan di masa depan."
 CHI_financial_policy: "Kebijakan Keuangan"
 CHI_financial_policy_desc: "Keuangan negara tidak terlalu kukuh, dan program belanja pemerintah yang sangat ambisius membangkitkan momok hiperinflasi yang tak terkendali. Reformasi moneter harus menjadi prioritas terdepan kita."
 CHI_price_controls: "Pengendalian Harga"
 CHI_price_controls_desc: "Langkah awal untuk mengendalikan inflasi adalah memastikan barang-barang pokok dijual dengan harga eceran tertinggi yang dipatok negara. Kebijakan ini tentu tidak akan disukai oleh kalangan saudagar."
 CHI_grain_tax: "Pajak Hasil Panen"
 CHI_grain_tax_desc: "Uang kertas keluaran pemerintah makin merosot daya belinya. Tak lama lagi kita tidak akan sanggup memberi makan prajurit kita di garis depan. Kita dapat memberlakukan aturan bahwa petani wajib membayar pajak dalam bentuk gabah, melewati perantara pasar. Mereka tentu akan membencinya, dan ada risiko kebijakan ini memicu kelaparan parah jika tidak diawasi ketat."
 CHI_reform_the_national_bank: "Reformasi Bank Nasional"
 CHI_reform_the_national_bank_desc: "Bank Nasional baru akan mengoordinasikan seluruh lalu lintas keuangan pemerintah dan menyediakan dana yang diperlukan bagi proyek-proyek strategis."
 CHI_forced_loans: "Pinjaman Wajib"
 CHI_forced_loans_desc: "Para saudagar dan pemilik industri telah menumpuk kekayaan melimpah ruah selama masa damai. Bukanlah hal berlebihan meminta mereka meminjamkan sebagian dari pundi-pundi emas mereka kepada negara di saat genting ini, dengan janji pelunasan segera setelah badai mereda."
 CHI_purchase_tanks_tt: "Kita akan menerima 100 tank ringan tua dari sekutu penyokong kita."
 CHI_purchase_fighters_tt: "Kita akan menerima 50 pesawat tempur tua dari sekutu penyokong kita. Mengamankan dukungan baik dari Inggris maupun Amerika Serikat akan menjamin penjualan pesawat dari kedua belah pihak."
 PRC_strengthen_the_central_secretariat: "Perkuat Sekretariat Pusat"
 PRC_strengthen_the_central_secretariat_desc: "Mengikuti jejak Mars Panjang, kita harus menata ulang organisasi politik kita demi membangun negara yang sanggup menandingi kaum Nasionalis."
 PRC_marxist_orthodoxy: "Ortodoksi Marxis"
 PRC_marxist_orthodoxy_desc: "Kunci utama mewujudkan komunisme sejati adalah menerapkan ajaran Karl Marx semurni dan sedalam mungkin."
 PRC_soviet_leadership: "Kepemimpinan Soviet"
 PRC_soviet_leadership_desc: "Uni Soviet berdiri kokoh sebagai pelopor terdepan di jalan menuju komunisme penuh. Kita harus mengakui posisi ini dan belajar dari teladan mereka."
 PRC_soviet_economic_aid: "Bantuan Ekonomi Soviet"
 PRC_soviet_economic_aid_desc: "Kehancuran dahsyat akibat Mars Panjang akan butuh waktu turun-temurun untuk dipulihkan tanpa bantuan luar. Kita harus mendekati pihak Soviet untuk memohon bantuan ekonomi."
 PRC_internationalism: "Internasionalisme"
 PRC_internationalism_desc: "Buruh dan tani di seluruh penjuru dunia harus bersatu padu melepaskan rantai penindasan mereka. Berdampingan bahu-membahu, kita akan menyongsong masa depan yang adil."
 PRC_agrarian_socialism: "Sosialisme Agraria"
 PRC_agrarian_socialism_desc: "Tiongkok berbeda dengan negara-negara industri Barat. Mengharapkan revolusi komunis terjadi persis seperti yang dibayangkan Marx berarti salah memahami kenyataan posisi negeri kita."
 PRC_rectification_campaign: "Gerakan Rektifikasi (Zhengfeng)"
 PRC_rectification_campaign_desc: "Terdapat sejumlah kekeliruan pemikiran mengenai arah perjuangan yang harus kita tempuh. Kita harus memberi kesempatan bagi kawan-kawan yang tersesat untuk menyadari kekhilafan mereka."
 PRC_maoism: "Maoisme"
 PRC_maoism_desc: "Sang Ketua Agung telah mencurahkan waktu berbulan-bulan mengembangkan teori-teori politiknya menjadi sebuah ideologi yang padu dan kokoh demi memandu langkah bangsa ke depan."
 PRC_socialism_with_chinese_characteristics: "Marxisme Berkarakteristik Tiongkok"
 PRC_socialism_with_chinese_characteristics_desc: "Kendati tak diragukan kejeniusannya, Marx menulis ajarannya dari kacamata peradaban Eropa. Keadaan istimewa Tiongkok harus tercermin secara nyata dalam penerapan kebijakan sosialis kita."
 PRC_proclaim_the_peoples_republic: "Proklamasikan Republik Rakyat"
 PRC_proclaim_the_peoples_republic_desc: "Berbekal kemenangan atas kaum nasionalis, kini tiba saatnya mengambil tempat sah kita sebagai pemerintahan tunggal Tiongkok. Masih banyak tugas berat menanti, namun fajar masa depan tampak kian benderang."
 PRC_socialist_market_economy: "Ekonomi Pasar Sosialis"
 PRC_socialist_market_economy_desc: "Jalan menuju sosialisme dan komunisme secara ilmiah harus melewati fase kapitalisme terlebih dahulu. Tiongkok tidak pernah mengembangkan ekonomi pasar kapitalis yang matang, membuat transisi langsung menuju sosialisme sangat mustahil. Kita harus menumbuhkan kekuatan produksi kapitalis sebelum kita dapat melangkah lebih jauh."
 PRC_social_democracy_focus: "Demokrasi Sosial"
 PRC_social_democracy_focus_desc: "Garis kebijakan partai yang terlampau radikal kerap memperburuk keadaan alih-alih memperbaikinya. Kaum Nasionalis, dengan segala kekurangannya, adalah sekutu kita dalam perjuangan mewujudkan masa depan yang lebih baik. Kita harus mendekat ke arah mereka dalam gelanggang politik."
 PRC_coalition_government: "Pemerintahan Koalisi"
 PRC_coalition_government_desc: "Kendati unifikasi penuh bangsa kita masih menuntut waktu, pembentukan pemerintahan bersama dengan kaum Nasionalis akan mempermudah jalan ke arah sana."
 PRC_purge_the_radicals: "Bersihkan Kaum Radikal"
 PRC_purge_the_radicals_desc: "Anasir tertentu di dalam partai masih terpaku pada doktrin pertentangan kelas tanpa henti dan kebencian buta terhadap golongan pemilik modal. Mereka harus disingkirkan dari panggung kekuasaan."
 PRC_strengthen_the_left_wing_of_the_kmt: "Perkuat Sayap Kiri KMT"
 PRC_strengthen_the_left_wing_of_the_kmt_desc: "Kaum Nasionalis didera perselisihan faksi internal yang berusaha menyabotase rekonsiliasi antara kedua rezim kita. Kita harus mengerahkan segenap daya agar sekutu kita di faksi kiri KMT memenangkan perebutan kekuasaan tersebut."
 PRC_remove_chiang_kai_shek: "Lengserkan Chiang Kai-Shek"
 PRC_remove_chiang_kai_shek_desc: "Terlepas dari segala upaya rekonsiliasi kita, sang Generalissimo tetap memandang kita sebagai duri dalam daging. Sikap permusuhannya yang membabi buta telah menjadi batu sandungan besar. Tindakan tegas harus diambil."
 PRC_national_leadership: "Kepemimpinan Nasional"
 PRC_national_leadership_desc: "Dengan tersingkirnya Chiang Kai-shek, rintangan terakhir menuju unifikasi telah sirna. Sudah sewajarnya kita memegang kendali kepemimpinan utama dalam pemerintahan persatuan ini."
 PRC_land_redistribution: "Redistribusi Lahan"
 PRC_land_redistribution_desc: "Selama berabad-abad, mereka yang memeras keringat menggarap sawah dipaksa membayar upeti sewa kepada para tuan tanah yang ongkang-ongkang kaki. Kita akan merombak ketidakadilan ini."
 PRC_the_yanan_base_area: "Pangkalan Basis Yan'an"
 PRC_the_yanan_base_area_desc: "Fondasi utama revolusi kita bermula di Yan'an. Jika kita ingin keluar sebagai pemenang dalam pertarungan yang menjelang, pangkalan ini harus diperluas dan diperkuat."
 PRC_prepare_for_war_with_japan: "Bersiap untuk Perang dengan Jepang"
 PRC_prepare_for_war_with_japan_desc: "Kaum militeris Jepang adalah ancaman paling mematikan bagi eksistensi bangsa kita. Mereka bernafsu mencabik-cabik negeri ini dan mengeksploitasinya melampaui imajinasi siapa pun. Konflik melawan kaum Nasionalis tak ada artinya dibanding bahaya ini."
 PRC_government_of_national_defense: "Pemerintahan Pertahanan Nasional"
 PRC_government_of_national_defense_desc: "Bangsa yang terpecah adalah bangsa yang mengundang kehancuran. Kita harus menyatukan kekuatan dengan kaum Nasionalis demi mengoordinasikan benteng pertahanan bersama."
 PRC_confrontation_with_the_warlords: "Hadapi Para Panglima Perang"
 PRC_confrontation_with_the_warlords_desc: "Beberapa faksi di Tiongkok mengabaikan seruan persatuan dan enggan berpihak dalam perjuangan bangsa. Sebagian bahkan diam-diam berambisi merebut takhta atau berkolaborasi dengan Jepang. Mereka harus ditertibkan."
 PRC_anti_japanese_expedition: "Ekspedisi Anti-Jepang"
 PRC_anti_japanese_expedition_desc: "Menghadapi tentara Jepang secara terbuka dalam posisi kita saat ini lebih merupakan tindakan gegabah daripada keberanian. Pertama-tama kita harus menyiapkan pijakan dengan menyusupkan kelompok-kelompok kecil ke wilayah musuh guna membangun pangkalan gerilya. Begitu saatnya tiba, kita akan mengobarkan pemberontakan massal."
 PRC_revolutionary_military_commission: "Komisi Militer Revolusioner"
 PRC_revolutionary_military_commission_desc: "Perjuangan revolusioner bersenjata melawan musuh-musuh kita harus dipimpin dan dikoordinasikan melalui badan komando khusus."
 PRC_provoke_japan: "Provokasi Jepang"
 PRC_provoke_japan_desc: "Selama tiga generasi kita hidup di bawah bayang-bayang teror Jepang. Perlawanan gigih terhadap agresi Jepang akan mengangkat kita menjadi pahlawan di mata segenap rakyat Tiongkok. Dan jika pihak Jepang enggan meladeni perang yang kita butuhkan, maka kita yang akan memancing mereka!"
 PRC_protracted_warfare: "Perang Berlarut-larut (Protracted Warfare)"
 PRC_protracted_warfare_desc: "Kita harus mengendalikan jalannya perang sesuai aturan main kita. Tiongkok memiliki manusia yang melimpah dan waktu yang tak terbatas. Menghadapi kekuatan unggul musuh dalam perang terbuka konvensional adalah tindakan bunuh diri."
 PRC_mobile_warfare: "Peperangan Gerak Cepat"
 PRC_mobile_warfare_desc: "Kita tidak bisa selamanya bersembunyi di rimba dan gunung-gunung cadas. Waktunya telah tiba untuk menyeret pertempuran ke pihak musuh dan membuktikan kepada dunia bahwa kita tak gentar menghadapi mereka di medan terbuka."
 PRC_peoples_war: "Perang Rakyat Semesta"
 PRC_peoples_war_desc: "Negara-negara borjuis boleh percaya bahwa senjata canggih dan daya hancur mesiu semata yang menentukan kemenangan perang. Kita lebih tahu. Tak ada senjata di muka bumi yang sanggup mematahkan kehendak rakyat yang bersatu dan rela berkorban!"
 PRC_100_regiments_campaign: "Serangan 100 Resimen"
 PRC_100_regiments_campaign_desc: "Selama ini kita membatasi diri pada pertempuran kecil dan penyergapan gerilya. Musuh mengira kita lemah dan tak lebih dari sekadar gangguan kecil. Terbuai dalam rasa aman palsu, mereka akan kaget dan tak siap menghadapi ofensif raksasa kita."
 PRC_central_military_commission: "Komisi Militer Pusat"
 PRC_central_military_commission_desc: "Dengan posisi kita yang makin perkasa, kita dapat beralih dari fase perjuangan revolusioner untuk bertahan hidup menuju pertarungan merebut kepemimpinan nasional tertinggi."
 PRC_peoples_liberation_army: "Tentara Pembebasan Rakyat (PLA)"
 PRC_peoples_liberation_army_desc: "Tentara Merah Tiongkok telah menorehkan tinta emas pengorbanan agung. Di masa mendatang, panji-panjinya akan merengkuh kehormatan yang kian megah di saat kita berjuang membebaskan seluruh rakyat kita."
 PRC_peoples_volunteer_army: "Tentara Sukarelawan Rakyat"
 PRC_peoples_volunteer_army_desc: "Gelora perjuangan membebaskan kaum buruh dan tani berkobar di banyak negeri sahabat. Tidak selamanya bijak untuk melakukan intervensi militer langsung secara resmi. Terkadang, pengiriman kontingen sukarelawan tangguh sudah lebih dari cukup untuk membalikkan perimbangan kekuatan."
 PRC_military_intelligence_department: "Departemen Intelijen Militer"
 PRC_military_intelligence_department_desc: "Kita memiliki banyak simpatisan setia di tengah rakyat jelata yang menyuplai informasi berharga. Namun kita juga dikepung oleh mata-mata musuh. Kita harus mendirikan badan intelijen khusus demi menyaring kawan dari lawan."
 PRC_central_security_bureau: "Biro Keamanan Pusat"
 PRC_central_security_bureau_desc: "Kita tidak boleh membiarkan bibit kontra-revolusi tumbuh subur bahkan di dusun terkecil sekalipun. Tugas suci kita adalah menciduk setiap pengkhianat sebelum mereka sempat menimbulkan kerugian."
 PRC_focus_on_china: "Pusatkan Perhatian pada Tiongkok"
 PRC_focus_on_china_desc: "Kita mustahil berharap sanggup mengusir penjajah Jepang selagi kita masih harus meladeni tikaman kaum Nasionalis dan para panglima perang di garis belakang. Kita harus menundukkan mereka terlebih dahulu sebelum mencurahkan tenaga menghadapi Jepang."
 PRC_exploit_the_weak_neighbours: "Manfaatkan Tetangga yang Lemah"
 PRC_exploit_the_weak_neighbours_desc: "Para tetangga di sekitar kita rapuh akibat digerogoti korupsi dan perselisihan saudara. Ini membuka peluang emas bagi kita untuk memperluas wilayah kekuasaan revolusi."
 PRC_infiltration: "Infiltrasi Wilayah"
 PRC_infiltration_desc: "Kaum Nasionalis memancing kita bertempur secara konvensional di medan terbuka. Kita tidak boleh terjebak perangkap itu. Kita akan menyusupkan sel-sel kecil prajurit ke wilayah musuh guna membangun basis rahasia. Begitu saatnya tiba, kita akan memantik pemberontakan serentak dan menggulung lawan tanpa sempat bersiap."
 PRC_enforce_the_three_rules: "Tegakkan Tiga Aturan Pokok"
 PRC_enforce_the_three_rules_desc: "1: Patuhi setiap komando.\n2: Jangan rampas sebutir jarum pun milik rakyat jelata.\n3: Serahkan seluruh rampasan perang kepada komando.\nMelalui disiplin murni ini, kita membuktikan kepada rakyat jelata bahwa tentara ini adalah darah daging mereka sendiri."
 PRC_permit_opium_trade: "Izinkan Perdagangan Opium"
 PRC_permit_opium_trade_desc: "Di balik dampak buruknya yang disesalkan, mengizinkan kaum tani menanam candu akan mendatangkan aliran uang tunai yang sangat dibutuhkan demi membiayai amunisi dan perbekalan pasukan kita."
 PRC_ban_the_opium_trade: "Larang Perdagangan Opium"
 PRC_ban_the_opium_trade_desc: "Candu adalah racun terkutuk yang dipakai oleh kekuatan imperialis Barat untuk melumpuhkan dan menundukkan bangsa kita. Kita tidak boleh membiarkan kejahatan ini merajalela kembali di tanah revolusi."
 PRC_abolish_the_land_rent: "Hapuskan Sewa Tanah"
 PRC_abolish_the_land_rent_desc: "Hak milik pribadi atas tanah adalah konsep borjuis yang menindas. Tanah adalah milik siapa saja yang mengucurkan keringat menggarapnya. Mengizinkan para petani berorganisasi secara mandiri akan memastikan kesetiaan penuh mereka pada revolusi."
 PRC_literacy_programs: "Program Pemberantasan Buta Huruf"
 PRC_literacy_programs_desc: "Fondasi masyarakat modern adalah memastikan setiap warganya sanggup membaca, memahami dinamika persoalan bersama, dan turut aktif menyelesaikannya."
 PRC_china_medical_university: "Universitas Kedokteran Tiongkok"
 PRC_china_medical_university_desc: "Kebersihan sanitasi dan pertolongan medis tempur akan menjaga pasukan kita tetap tegap di garis depan serta meningkatkan kesejahteraan rakyat. Kita akan merintis metode baru di bidang kesehatan dan mengedukasikannya kepada segenap rakyat."
 PRC_form_the_academy_of_sciences: "Bentuk Akademi Ilmu Pengetahuan"
 PRC_form_the_academy_of_sciences_desc: "Kita akan menyatukan berbagai laboratorium penelitian dan universitas ke dalam sebuah lembaga terpadu demi mengelola riset ilmiah secara efektif dan berdaya guna tinggi."
 JAP_the_unthinkable_option: "Opsi yang Tak Terpikirkan"
 JAP_the_unthinkable_option_desc: "Masa depan bangsa menuntut jalan yang tak pernah terbayangkan sebelumnya oleh para pemimpin kita. Opsi radikal ini kini harus dipertimbangkan secara sungguh-sungguh."
 JAP_approach_the_young_officers: "Dekati Perwira Muda"
 JAP_approach_the_young_officers_desc: "Generasi tua terlalu kaku dan terikat pada cara lama untuk bisa diarahkan ke jalan pemikiran baru. Sebagai gantinya, kita akan merangkul para perwira generasi muda."
 JAP_approach_the_young_officers_tt: "Mendapatkan §G3§! jenderal berhaluan komunis.\n"
 JAP_exchange_the_exiles: "Pertukaran Tokoh Pengasingan"
 JAP_if_man_accepts: "Jika §HManchukuo§! menyetujui, hal berikut akan berlaku:\n"
 JAP_exchange_the_exiles_desc: "Jika sebelumnya kita membuang para perwira dan birokrat sayap kiri ke pembuangan tidak resmi di Manchuria, kini kita akan menukarkan mereka kembali dengan membuang para perwira sayap kanan ke sana."
 JAP_open_up_the_universities: "Buka Akses Universitas"
 JAP_open_up_the_universities_desc: "Setiap anak bangsa berhak menuntut ilmu di perguruan tinggi, terlepas dari asal usul keturunan maupun status sosialnya."
 JAP_cast_the_die: "Melempar Dadu (Cast the Die)"
 JAP_cast_the_die_desc: "Basis politik dan militer kita sudah cukup kukuh. Waktunya telah tiba untuk merebut takdir bangsa dengan keberanian penuh!"
 cast_the_die_TT: "§RPenetrasian dan perebutan Tokyo akan mengakhiri perang saudara dengan cepat.§!\n"
 JAP_the_fate_of_the_imperial_family: "Nasib Keluarga Kekaisaran"
 JAP_the_fate_of_the_imperial_family_desc: "Waktunya telah tiba untuk menentukan nasib sisa-sisa terakhir dari sistem pemerintahan turun-temurun di Jepang. Kita harus memutuskan nasib apa yang akan menimpa Kaisar beserta segenap keluarganya."
 JAP_rebuild_the_civil_service: "Bangun Kembali Aparatur Sipil"
 JAP_rebuild_the_civil_service_desc: "Demi mengelola roda pemerintahan secara bersih dan adil, kita akan merombak total birokrasi dengan menempatkan orang-orang yang paling cakap dan berintegritas."
 JAP_reeducation_campaign: "Gerakan Re-edukasi"
 JAP_reeducation_campaign_desc: "Gejolak keresahan merebak di tengah masyarakat pasca-revolusi akbar kita. Kita harus mengedukasi kembali rakyat demi menanamkan nilai-nilai luhur dan perilaku bermasyarakat yang kita anggap paling selaras."
 JAP_cleaning_up_our_own_mess: "Menuntaskan yang Telah Dimulai"
 JAP_finish_the_fight: "Tuntaskan Pertarungan"
 JAP_finish_the_fight_desc: "Kita harus membawa medan perang ke bekas koloni kita di seberang lautan, dan melumat habis benteng pertahanan terakhir para musuh ideologis kita."
 JAP_join_comintern: "Bergabung dengan Komintern"
 JAP_join_comintern_desc: "Kita tidak dapat berdiri seorang diri menghadapi kepungan kekuatan imperialis dunia. Kita harus bersatu padu dengan negeri tempat lahirnya sosialisme demi melindungi panji revolusi!"
 JAP_red_brigades: "Brigade Merah"
 JAP_red_brigades_desc: "Setiap pemuda dan pemudi wajib mengemban baktinya membela negara buruh. Kita akan menjamin setiap anak bangsa memiliki wadah untuk mengabdi."
 JAP_communist_volunteers: "Sukarelawan Komunis"
 JAP_communist_volunteers_desc: "Perjuangan revolusioner kita tidak berhenti di kepulauan ini saja. Kita terpanggil untuk membantu membebaskan bangsa-bangsa lain. Putra-putri terbaik kita akan dikirim ke garis depan untuk membela panji kebebasan di negeri-negeri yang merangkul revolusi!"
 JAP_asian_communist_solidarity: "Solidaritas Komunis Asia"
 JAP_asian_communist_solidarity_tt: "Undang §H[WTT_communist_china.GetNameWithFlag]§! ke faksi kita."
 JAP_asian_communist_solidarity_desc: "Kita harus bergandengan tangan dengan saudara-saudara kita di Asia. Bentuk komunisme ala Barat tidak cocok di tanah kita, namun bersama para tetangga, kita sanggup menyebarkan sosialisme yang selaras dengan kepribadian dan martabat bangsa-bangsa Asia."
 JAP_nationalize_the_zaibatsus: "Nasionalisasi Zaibatsu"
 JAP_nationalize_the_zaibatsus_desc: "Konglomerat-konglomerat raksasa di negeri kita sekian lama menggenggam kekuasaan ekonomi dan politik yang teramat besar dan menindas. Kediktatoran modal ini tamat hari ini. Dominasi negara demi kepentingan rakyat tidak boleh digugat!"
 JAP_people_owned_mines: "Tambang Milik Rakyat"
 JAP_people_owned_mines_desc: "Kaum buruh tambang akan diberikan hak kepemilikan atas tambang-tambang tempat mereka memeras keringat, melipatgandakan motivasi kerja dan efisiensi produksi."
 JAP_public_works: "Pekerjaan Umum"
 JAP_public_works_desc: "Serangkaian proyek pekerjaan umum berskala nasional akan membuka lapangan kerja bagi segenap rakyat serta membenahi infrastruktur di seantero negeri."
 JAP_tokyo_aluminum_plant: "Pabrik Aluminium Tokyo"
 JAP_tokyo_aluminum_plant_desc: "Kita akan mendayagunakan tenaga kerja kaum buruh demi melipatgandakan kemandirian industri bangsa dalam memproduksi logam strategis."
 JAP_purge_the_kodoha_faction: "Bersihkan Faksi Kodoha"
 JAP_purge_the_kodoha_faction_desc: "Faksi militer radikal baru telah muncul, berambisi merebut tampuk kekuasaan dan menyeret kita menyerbu ke utara melawan Uni Soviet. Kita harus melenyapkan mereka sebelum mereka mendatangkan petaka bagi bangsa."
 JAP_liaison_conference: "Konferensi Penghubung (Gozen Kaigi)"
 JAP_liaison_conference_desc: "Dengan mempertemukan para perwira penghubung dari seluruh cabang pemerintahan sipil dan komando militer dalam konferensi terpadu, kita dapat melipatgandakan kecepatan pengambilan keputusan strategis."
 JAP_greater_east_asian_co_prosperity_sphere: "Kawasan Kemakmuran Bersama Asia Timur Raya"
 JAP_greater_east_asian_co_prosperity_sphere_desc: "Era kolonialisme Barat telah tamat. Bangsa-bangsa di Asia harus bersatu padu dan berdiri tegak sebagai benua yang perkasa dan berdaulat di bawah kepemimpinan kita. Asia untuk Bangsa Asia!"
 JAP_intervene_in_china: "Insiden Jembatan Marco Polo"
 JAP_intervene_in_china_desc: "[Root.GetNameDefCap] miskin sumber daya alam, namun negeri tetangga kita berlimpah ruah. Kita harus merampas dari mereka apa yang tidak kita miliki, dan kita hanya memerlukan sebuah dalih untuk memulainya. Alasan tersebut dapat direkayasa oleh segelintir prajurit pemberani di garis depan, setelah itu Kaisar tidak punya pilihan selain merestui kobaran perang, betapa pun belum siapnya persiapan kita..."
 JAP_secure_china: "Amankan Tiongkok"
 JAP_secure_china_desc: "Perlawanan bangsa Tionghoa terbukti gigih dan tak kunjung reda. Kita harus menggandakan upaya penaklukan demi menundukkan daratan utama secepat mungkin."
 JAP_develop_chinese_resources: "Kembangkan Sumber Daya Tiongkok"
 JAP_develop_chinese_resources_desc: "Kita harus mengeksploitasi kekayaan alam Tiongkok yang melimpah yang telah jatuh ke tangan kita demi menopang logistik peperangan berikutnya."
 JAP_strike_south_doctrine: "Doktrin Serbu ke Selatan (Nanshin-ron)"
 JAP_strike_south_doctrine_desc: "Kendati kaya, daratan Tiongkok tidak memiliki seluruh sumber daya mentah yang kita butuhkan. Tak jauh di selatan, terbentang kepulauan Hindia Belanda yang kaya minyak serta koloni Inggris di Malaya dan Kalimantan. Demi kemandirian sejati, kita harus merebut kendali atas wilayah-wilayah perawan ini dari tangan imperialis Eropa."
 JAP_non_aggression_pact_with_the_soviet_union: "Pakta Non-Agresi dengan [SOV.GetNameDef]"
 JAP_non_aggression_pact_with_the_soviet_union_desc: "Perbatasan utara kita harus aman terkendali jika kita ingin leluasa mengerahkan armada menyerbu ke selatan. Kita harus segera membuka perundingan resmi dengan [SOV.GetNameDef]."
 JAP_bypass_the_philippines: "Lewati Filipina"
 JAP_bypass_the_philippines_desc: "Kepulauan Filipina adalah gangguan yang tidak perlu dalam perjalanan kita menuju target utama. Kita akan mengabaikannya untuk saat ini."
 JAP_secure_the_philippines: "Amankan Filipina"
 JAP_secure_the_philippines_desc: "Filipina adalah pangkalan militer yang mutlak dibutuhkan dalam rute kita menuju sasaran utama. Kita harus mengamankannya bagi kelancaran operasi armada kita di masa depan."
 JAP_strike_on_the_southern_resource_area: "Serang Kawasan Sumber Daya Selatan"
 JAP_strike_on_the_southern_resource_area_desc: "Saatnya telah tiba untuk menggerakkan roda rencana kita. Kita akan meluncurkan serbuan kilat ke selatan dan merebut koloni-koloni Barat yang berlimpah sumber daya bagi kejayaan kekaisaran."
 JAP_alliance_with_siam: "Aliansi dengan Siam"
 JAP_alliance_with_siam_desc: "Kerajaan Siam berada di lokasi geografis yang sangat strategis untuk membantu kita dalam perang menghadapi kekuatan Barat. Dengan menarik mereka ke kubu kita, invasi tak terelakkan ke Malaya dan Hindia Belanda akan menjadi jauh lebih mudah."
 JAP_exploit_the_southern_resource_area: "Eksploitasi Wilayah Sumber Daya Selatan"
 JAP_exploit_the_southern_resource_area_desc: "Kita harus melipatgandakan eksploitasi kekayaan minyak dan karet Hindia Belanda yang melimpah ruah demi menggerakkan mesin perang angkatan bersenjata kita."
 JAP_sign_tripartite_pact: "Tanda Tangani Pakta Tripartit"
 JAP_sign_tripartite_pact_bypass_tt: "Jerman atau Italia tidak berhaluan fasis atau kita sedang berperang dengan salah satu dari mereka."
 JAP_sign_tripartite_pact_desc: "Tugas raksasa yang membentang di hadapan kita akan menjadi ujian berat bagi kemampuan bangsa. Kita harus merangkul pemerintahan di belahan bumi lain yang memiliki ambisi serupa demi menjalin persekutuan strategis."
 JAP_guide_the_zaibatsus: "Bimbing Kaum Zaibatsu"
 JAP_guide_the_zaibatsus_desc: "Konglomerat bisnis raksasa di negeri kita sekian lama menikmati pengaruh ekonomi dan politik yang tak tertandingi. Dengan sedikit kelihaian diplomasi, kita dapat mengarahkan potensi modal mereka demi menyokong ambisi kekaisaran."
 JAP_nationalize_war_industry: "Nasionalisasi Industri Perang"
 JAP_nationalize_war_industry_desc: "Meningkatkan kendali penuh negara atas industri persenjataan akan melipatgandakan efisiensi dan keluaran produksi perang kita."
 JAP_coal_liquification: "Pencairan Batubara (Sintesis Bahan Bakar)"
 JAP_coal_liquification_desc: "[JAP.GetNameDefCap] sangat miskin cadangan minyak bumi alam, sehingga kita harus melipatgandakan riset dan produksi minyak sintetis dari batubara."
 JAP_national_mobilization_law: "Undang-Undang Mobilisasi Nasional"
 JAP_national_mobilization_law_desc: "Peraturan perundang-undangan baru akan menjadikan dinas militer wajib bagi seluruh sendi kehidupan masyarakat, menanamkan rasa bakti yang mendalam serta memperjelas urgensi perang suci kepada segenap rakyat."
 JAP_national_research_policy: "Kebijakan Riset Nasional"
 JAP_national_research_policy_desc: "Dukungan dan koordinasi pemerintah terhadap lembaga-lembaga riset akan memberi fleksibilitas dan hasil yang jauh lebih tinggi dalam program litbang militer kita."
 JAP_imperial_arsenals: "Bengkel Persenjataan Kekaisaran"
 JAP_imperial_arsenals_desc: "Memperluas kendali langsung kekaisaran atas industri senjata akan secara drastis meningkatkan efisiensi dan kapasitas amunisi kita."
 JAP_national_defense_state: "Negara Pertahanan Nasional"
 JAP_national_defense_state_desc: "Setiap warga negara harus disadarkan akan keharusan mutlak mengubah seluruh tatanan bangsa menjadi benteng pertahanan baja yang kebal terhadap gempuran musuh mana pun."
 JAP_spiritual_mobilization: "Mobilisasi Spiritual"
 JAP_spiritual_mobilization_desc: "Dengan mengobarkan ajaran Shinto yang menekankan bakti keprajuritan dan kesetiaan luhur, kita dapat melipatgandakan gelombang rekrutmen sukarelawan perang."
 JAP_warrior_spirit: "Jiwa Kesatria (Semangat Bushido)"
 JAP_warrior_spirit_desc: "Shinto Negara memungkinkan kita menanamkan tekad suci dalam diri setiap pemuda untuk rela mempersembahkan jiwa dan raga demi kejayaan Negara dan Yang Mulia Kaisar."
 JAP_strengthen_the_divine_wind: "Kobarkan Angin Dewa (Kamikaze)"
 JAP_strengthen_the_divine_wind_effect: "Membuka produksi §HYokosuka MXY7 Ohka§!"
 JAP_strengthen_the_divine_wind_effect_bba: "Membuka modul §HMuatan Peledak Tetap (Fixed Explosive Charge)§!"
 JAP_strengthen_the_divine_wind_desc: "Kamikaze, taktik Serangan Khusus (Tokko), telah mengubah serangan pengorbanan jiwa dari tindakan darurat sporadis menjadi sebuah doktrin tempur resmi. Berbekal pesawat khusus berkecepatan tinggi yang pada hakikatnya adalah rudal berawak manusia, serangan ini tak akan terbendung oleh armada musuh!"
 JAP_support_the_kodoha_faction: "Dukung Faksi Kodoha (Fraksi Jalan Kekaisaran)"
 JAP_support_the_kodoha_faction_desc: "Sebuah gerakan perwira baru telah bangkit, bertekad mengambil alih pemerintahan dan mengarahkan pedang ke utara melawan Uni Soviet. Demi kejayaan Kaisar dan masa depan Kekaisaran, kita harus memastikan faksi ini memegang kendali!"
 JAP_challenge_the_zaibatsus: "Tantang Para Zaibatsu"
 JAP_challenge_the_zaibatsus_desc: "Perusahaan-perusahaan konglomerat raksasa telah terlalu lama menikmati kekuasaan politik dan finansial tanpa batas. Kita harus mengingatkan mereka bahwa mereka tetaplah abdi yang tunduk di bawah titah Kaisar."
 JAP_showa_restoration: "Restorasi Showa"
 JAP_showa_restoration_desc: "Zaman para penguasa boneka telah usai, dan Kaisar sendiri harus mengambil alih kendali langsung atas seluruh urusan negara. Hanya dengan begitu Kekaisaran kita akan sanggup berdiri perkasa menghadapi imperialis Barat."
 JAP_modern_shogunate: "Keshogunan Modern"
 JAP_modern_shogunate_desc: "Kaisar sebaiknya tetap memegang peran sakral dan seremonial, sementara para jenderal yang kuat menjalankan roda pemerintahan atas nama beliau. Langkah ini akan memastikan titah Kaisar ditegakkan dengan pedang baja ke pelosok negeri."
 JAP_prepare_for_war_with_the_soviet_union: "Bersiap Perang Melawan [SOV.GetNameDef]"
 JAP_prepare_for_war_with_the_soviet_union_desc: "Ancaman [SOV.GetSovietThreatName] terhadap perbatasan utara kita harus ditumpas tuntas. Kita harus segera memulai persiapan perang menyeluruh melawan [SOV.GetNameDef]."
 SOV_communist_threat: "komunis"
 SOV_fascist_threat: "fasis"
 SOV_country_threat: "[SOV.GetAdjective]"
 SOV_communist_threatAlt: "Bolshevik"
 SOV_fascist_threatAlt: "Imperialis"
 JAP_join_the_london_naval_treaty: "Bergabung dengan Perjanjian Angkatan Laut London"
 JAP_join_the_london_naval_treaty_desc: "Kita harus mengamankan sayap maritim kita jika kita ingin mengerahkan segenap kekuatan melawan beruang merah. Jika menandatangani selembar kertas pembatasan armada laut dapat menjamin perdamaian di Pasifik, maka biarlah demikian."
 JAP_build_up_the_manchurian_army: "Bangun Angkatan Darat Manchuria"
 JAP_build_up_the_manchurian_army_desc: "[MAN.GetNameDefCap] akan berada di garis terdepan dalam setiap perang di utara. Kita harus memastikan mereka cukup tangguh untuk menahan setiap potensi serangan musuh."
 JAP_non_aggression_pact_with_china: "Pakta Non-Agresi dengan Tiongkok"
 JAP_non_aggression_pact_with_china_desc: "Meskipun hubungan kita dengan Tiongkok secara historis penuh ketegangan, kini kita membutuhkan pakta non-agresi dengan mereka demi membebaskan pasukan untuk serbuan ke utara."
 JAP_create_a_manchurian_imperial_air_force: "Bentuk Angkatan Udara Kekaisaran Manchuria"
 JAP_create_a_manchurian_imperial_air_force_desc: "Keunggulan udara adalah kunci memenangkan perang. Jika [MAN.GetNameDef] memiliki angkatan udara sendiri, hal ini akan sangat membantu meringankan beban udara kita."
 JAP_technological_exchange: "Pertukaran Teknologi"
 JAP_technological_exchange_desc: "Kita memerlukan sekutu untuk menghadapi sang beruang kutub. Jerman bukan hanya kandidat yang tepat, tetapi juga memiliki kemajuan teknologi melimpah yang dapat dibagikan kepada kita demi membantu perjuangan kita."
 JAP_preemptive_war: "Perang Preemtif"
 JAP_preemptive_war_desc: "Dengan memalsukan laporan peningkatan agresi [SOV.GetAdjective] di perbatasan utara, kita dapat menciptakan dalih untuk melancarkan serangan preemtif demi menumpas ancaman utara."
 JAP_establish_the_northern_resource_area: "Bentuk Kawasan Sumber Daya Utara"
 JAP_establish_the_northern_resource_area_desc: "Hamparan luas Siberia yang kaya mineral harus dieksploitasi demi menyokong mesin perang kita yang terus membesar."
 JAP_german_rocketry: "Teknologi Roket Jerman"
 JAP_german_rocketry_desc: "Kemajuan teknologi roket Jerman akan sangat berguna bagi upaya perang kita. Kita harus berusaha memperoleh cetak biru ini, berapa pun harganya."
 JAP_strengthen_civilian_government: "Perkuat Pemerintahan Sipil"
 JAP_tora_tora_tora_idea: "Tora! Tora! Tora!"
 JAP_tora_tora_tora_idea_desc: "Setelah pukulan telak pembuka mereka, pihak Jepang melancarkan kampanye kilat agresif menggunakan kekuatan armada kapal induk mereka."
 JAP_strengthen_civilian_government_desc: "Nilai-nilai liberalisme dan demokrasi yang kian berkembang bukanlah ancaman bagi bangsa kita, melainkan justru dapat menjadi kekuatan terbesarnya. Kita harus memperkuat pemerintahan agar dapat melindungi cita-cita luhur ini."
 JAP_ally_with_the_zaibatsus: "Bersekutu dengan Kaum Zaibatsu"
 JAP_ally_with_the_zaibatsus_desc: "Konglomerat terbesar di negara kita telah lama memiliki pengaruh politik dan ekonomi yang luar biasa. Mereka adalah bukti nyata dari peluang yang dihadirkan oleh kebebasan dan individualitas, dan kita harus bekerja sama dengan mereka demi kemaslahatan bangsa."
 JAP_research_spending: "Alokasi Anggaran Riset"
 JAP_research_spending_desc: "Anggaran yang cukup besar harus dialokasikan untuk penelitian dan pengembangan, jika kita ingin memanfaatkan bakat putra-putri terbaik bangsa kita secara optimal."
 JAP_pre_emptive_coup: "Kudeta Preemtif"
 JAP_pre_emptive_coup_desc: "Kita harus bertindak cepat demi mengamankan masa depan bangsa bagi anak cucu kita, jangan sampai cita-cita kemerdekaan kita diberangus oleh rezim otoriter."
 JAP_purge_the_militarists: "Bersihkan Kaum Militeris"
 JAP_purge_the_militarists_desc: "Mereka yang percaya bahwa kekuatan militer adalah jawaban dari segala persoalan harus dibersihkan dari kepulauan kita demi memberi ruang bagi pemikiran yang lebih berkepala dingin. Mereka dapat mencari jalan hidup mereka sendiri di luar batas wilayah kita."
 JAP_the_showa_constitution: "Konstitusi Showa"
 JAP_the_showa_constitution_desc: "Kita menerima dan menghormati sejarah kekaisaran bangsa kita. Namun, otoritarianisme tidak memiliki tempat di Jepang yang ingin kita bangun. Kita akan mempertahankan Kaisar sebagai simbol pemersatu bangsa, namun membatasi kekuasaannya dalam konstitusi, sebagaimana lazimnya di banyak negara demokrasi Barat."
 JAP_west_pacific_treaty_organization: "Pakta Pertahanan Pasifik Barat (WPTO)"
 JAP_west_pacific_treaty_organization_desc: "Aliansi tersendiri bersama bangsa-bangsa Asia lainnya akan memungkinkan kita berdiri tegak membendung setiap potensi ancaman terhadap tatanan hidup baru kita."
 JAP_rekindle_the_old_alliance: "Hidupkan Kembali Aliansi Lama"
 JAP_rekindle_the_old_alliance_desc: "Peluang terbaik kita berada di tangan sekutu lama kita semasa Perang Besar. Kita akan mengaktifkan kembali aliansi bersejarah tersebut dan berdiri bersama [ENG.GetNameDef] dalam membela panji demokrasi."
 JAP_pacific_guardian: "Penjaga Pasifik"
 JAP_pacific_guardian_desc: "Kita akan mengemban peran sebagai pelindung seluruh negara Asia di lingkar Pasifik. Setelah terbebas dari cengkeraman imperialisme Barat, mereka memerlukan bimbingan bersahabat demi tumbuh menjadi negara demokrasi yang matang."
 JAP_anti_communist_bulwark: "Benteng Anti-Komunis"
 JAP_anti_communist_bulwark_desc: "Prinsip-prinsip luhur demokrasi bertentangan mutlak dengan komunisme. Kita harus berdiri teguh melawan ideologi tersebut, demi melindungi diri kita sendiri serta bangsa-bangsa yang menaruh harapan pada kita."
 JAP_anti_communist_volunteers: "Sukarelawan Anti-Komunis"
 JAP_anti_communist_volunteers_desc: "Kita harus memerangi komunisme di mana pun ia berada, bahkan jika kita sendiri tidak terlibat secara resmi dalam konflik tersebut. Kita akan mengirimkan pasukan sukarelawan untuk memperjuangkan kebebasan di front-front tersebut."
 JAP_the_korean_question: "Persoalan Korea"
 JAP_the_korean_question_desc: "Kita telah lama menguasai semenanjung Korea, namun tuntutan hak penentuan nasib sendiri bangsa Korea kian mendesak. Apakah kita pantas mengaku menjunjung cita-cita demokrasi jika kita merampas hak tetangga kita untuk memerintah tanah air mereka sendiri?"
 JAP_liberate_manchuria: "Bebaskan Manchuria"
 JAP_liberate_manchuria_desc: "Manchuria terus hidup di bawah tirani otoriter; sebuah peninggalan kelam dari masa penjajahan kita. Kita harus memperbaiki kekeliruan sejarah ini dan memastikan wilayah tersebut dikembalikan kepada kedaulatan bangsa Tionghoa yang berhak."
 JAP_liberate_manchuria_tt: "Keputusan ini dapat diambil setelah menaklukkan Manchuria.\n"
 JAP_ultimate_deterrence: "Daya Tangkal Mutlak (Ultimate Deterrence)"
 JAP_ultimate_deterrence_desc: "Cara terbaik untuk melindungi rakyat kita adalah memastikan mereka tidak pernah terseret ke dalam kancah perang. Pengembangan senjata baru dengan daya hancur dahsyat akan menjamin mereka tak perlu lagi memikul derita pertempuran."
 JAP_full_sovereignty_for_the_philippines: "Kedaulatan Penuh bagi Filipina"
 JAP_full_sovereignty_for_the_philippines_desc: "Hak penentuan nasib sendiri harus diperluas ke seantero Asia. [USA.GetNameDefCap] masih terus menguasai Filipina, dan harus ditekan agar menghormati hak-hak demokratis rakyat Filipina."
 JAP_the_manchurian_project: "Proyek Manchuria"
 JAP_the_manchurian_project_desc: "Di saat tanah di kepulauan kita sangat terbatas, wilayah kekuasaan kita di daratan benua terbentang luas. Apa yang tak sanggup kita bangun di tanah air, dapat kita bangun di daratan Manchuria. Kita akan memulai program industrialisasi berskala raksasa bagi [MAN.GetNameDef]."
 JAP_expand_the_showa_steel_works: "Perluas Pabrik Baja Showa"
 JAP_expand_the_showa_steel_works_desc: "Kita harus memperluas Pabrik Baja Showa demi melipatgandakan produksinya, sebagai prasyarat krusial bagi industrialisasi skala besar."
 JAP_develop_aluminum_sources: "Kembangkan Sumber Aluminium"
 JAP_develop_aluminum_sources_desc: "Program penerbangan tempur kita membutuhkan pasokan aluminium melimpah, sehingga cadangan bauksit Manchuria harus dieksploitasi secara intensif."
 JAP_expand_manchurian_railways: "Perluas Jaringan Rel Manchuria"
 JAP_expand_manchurian_railways_desc: "Infrastruktur kereta api Manchuria membutuhkan ekspansi drastis untuk mengangkut beban industrialisasi yang kian pesat."
 JAP_light_industry_development: "Pengembangan Industri Ringan"
 JAP_light_industry_development_desc: "Pabrik-pabrik barang konsumsi dan perkakas ringan akan menciptakan lapangan kerja dan menopang perekonomian daerah."
 JAP_heavy_industry_development: "Pengembangan Industri Berat"
 JAP_heavy_industry_development_desc: "Pembangunan pabrik mesin berat, peleburan logam, dan kimia dasar akan melengkapi rantai produksi industri kita di Manchuria."
 JAP_japanese_settlement: "Pemukiman Jepang"
 JAP_japanese_settlement_desc: "Dengan memukimkan warga negara kita sendiri di Manchuria, kita dapat menambah angkatan kerja terlatih sekaligus menciptakan sentra-sentra industri baru yang strategis."
 JAP_fortify_the_border: "Bentengi Perbatasan"
 JAP_fortify_the_border_desc: "Perbatasan utara praktis tidak memiliki pertahanan memadai. Kita harus membangun kubu-kubu pertahanan utara demi mengantisipasi potensi serangan dari arah ini."
 JAP_army_expansion_law: "Undang-Undang Ekspansi Angkatan Darat"
 JAP_army_expansion_law_desc: "Pemerintahan kita harus menetapkan peningkatan drastis kekuatan angkatan bersenjata sebagai salah satu prinsip utamanya."
 JAP_small_arms_modernization: "Modernisasi Senjata Ringan"
 JAP_small_arms_modernization_desc: "Pasukan kita membutuhkan senapan modern agar sanggup menandingi persenjataan musuh potensial kita."
 JAP_supremacy_of_technology: "Keunggulan Teknologi"
 JAP_supremacy_of_technology_desc: "Teknologilah yang akan membawa kita menuju kemenangan mutlak. Segala daya upaya harus diarahkan untuk mengungguli persenjataan dan perlengkapan musuh."
 JAP_modern_artillery: "Artileri Modern"
 JAP_modern_artillery_desc: "Betapa pun gagah beraninya prajurit kita, mereka membutuhkan daya gempur artileri superior demi melapangkan gerak maju di medan laga."
 JAP_armored_divisions: "Divisi Lapis Baja"
 JAP_armored_divisions_desc: "Bangsa-bangsa lain telah menyadari kedahsyatan divisi lapis baja. Kita pantang tertinggal, dan harus merancang tank yang lebih canggih dan bertenaga agar sanggup menghantam musuh dengan cepat dan mematikan."
 JAP_bicycle_battalions: "Batalion Sepeda"
 JAP_bicycle_battalions_desc: "Mobilitas adalah kunci kemenangan. Pasukan infanteri kita akan diperlengkapi dengan sepeda militer, melipatgandakan kecepatan gerak manuver divisi melintasi medan berhutan dan jalan sempit."
 JAP_army_expansion: "Ekspansi Angkatan Darat"
 JAP_army_expansion_desc: "Demi memperluas kekuatan militer, kita harus mendayagunakan keahlian para perwira berpengalaman yang terbukti piawai melatih prajurit dalam seni peperangan."
 JAP_supremacy_of_will: "Keunggulan Tekad (Seishin)"
 JAP_supremacy_of_will_desc: "Peralatan tercanggih tak ada artinya tanpa jiwa kesatria yang membara di dada penggunanya, dan tekad baja sanggup mengubah batu sederhana menjadi senjata paling mematikan."
 JAP_fighter_modernization: "Modernisasi Pesawat Tempur"
 JAP_fighter_modernization_desc: "Kita harus mempertahankan keunggulan mutlak atas lawan di segala matra, termasuk perang udara. Pesawat tempur modern sangat krusial untuk mencapainya."
 JAP_range_focus: "Fokus Jarak Jangkau"
 JAP_range_focus_desc: "Jarak geografis dalam gelanggang perang Pasifik teramat luas, maka kita memerlukan pesawat yang sanggup menembus jarak ribuan mil laut tersebut."
 JAP_agility_focus: "Fokus Kelincahan"
 JAP_agility_focus_desc: "Jarak jangkau jauh tak berguna jika pesawat kita kalah lincah saat duel udara dengan lawan. Kita harus memproduksi pesawat dengan kemampuan manuver tak tertandingi."
 JAP_the_zero: "Sang Legenda Zero"
 JAP_the_zero_desc: "Rancangan revolusioner dari Mitsubishi terbukti sebagai pesawat tempur berbasis kapal induk paling mematikan yang pernah diciptakan manusia. Kelincahan luar biasa dipadu jarak jangkau jauh akan mendominasi angkasa selama bertahun-tahun. Kita harus segera memproduksinya secara massal."
 JAP_the_zero_tt: "Membuka produksi §HMitsubishi A6M Zero-sen§!"
 JAP_bomber_modernization: "Modernisasi Pesawat Pembom"
 JAP_bomber_modernization_desc: "Armada pembom taktis modern adalah kunci utama dalam memberikan bantuan tembakan bagi pasukan darat kita di medan tempur."
 JAP_strategic_bomber_effort: "Pengembangan Pembom Strategis"
 JAP_strategic_bomber_effort_desc: "Betapa pun kita ingin, perang tidak dapat dimenangkan semata-mata lewat bentrokan langsung di garis depan. Kapasitas industri menentukan hasil akhir perang, sehingga kita harus berinvestasi pada armada pembom strategis untuk melumat sentra industri musuh di garis belakang."
 JAP_unified_fighter_development: "Penyatuan Riset Pesawat Tempur"
 JAP_unified_fighter_development_desc: "Terlalu lama kita dirugikan oleh persaingan tidak sehat antara penerbangan Angkatan Darat dan Angkatan Laut. Kita harus menyatukan program riset ini demi standardisasi persenjataan dan efisiensi sumber daya litbang."
 JAP_jet_prototypes: "Purwarupa Mesin Jet"
 JAP_jet_prototypes_desc: "Masa depan penerbangan bukan lagi milik baling-baling. Kita harus mengembangkan tenaga penggerak jet demi melipatgandakan kecepatan pesawat kita."
 JAP_new_naval_estimates: "Rencana Anggaran Angkatan Laut Baru"
 JAP_new_naval_estimates_desc: "Kita harus menyusun kalkulasi baru mengenai perluasan armada kapal perang kita, serta fasilitas galangan kapal yang dibutuhkan untuk merealisasikannya."
 JAP_carrier_warfare_experiments: "Eksperimen Perang Kapal Induk"
 JAP_carrier_warfare_experiments_desc: "Kapal tempur adalah peninggalan era lampau. Masa depan peperangan samudra bertumpu pada penerbangan tempur laut. Kapal induk memungkinkan kita memproyeksikan kekuatan udara ke seberang Samudra Pasifik."
 JAP_expand_the_snlf: "Perluas Pasukan Pendarat Laut Khusus (SNLF)"
 JAP_expand_the_snlf_desc: "Peperangan di kepulauan Pasifik akan sangat bergantung pada operasi pendaratan amfibi. Pasukan Khusus Pendarat Angkatan Laut harus diperbesar agar sanggup mengemban misi berat ini."
 JAP_first_air_fleet: "Armada Udara Pertama (Kido Butai)"
 JAP_first_air_fleet_desc: "Demi memaksimalkan daya hancur ofensif, kita akan menghimpun konsentrasi kapal induk terbesar dalam sejarah peradaban ke dalam satu gugus tempur pemukul. Dengan mematangkan doktrin operasi ofensif terpadu ini, armada musuh tak akan berkutik di hadapan kedahsyatan penerbangan tempur kita."
 JAP_modern_escorts: "Kapal Pengawal Modern"
 JAP_modern_escorts_desc: "Armada tempur kita memerlukan kapal-kapal pengawal paling modern demi beroperasi leluasa tanpa gangguan dari kapal selam dan kapal torpedo musuh."
 JAP_supremacy_of_the_battlefleet: "Keunggulan Armada Tempur Utama (Kantai Kessen)"
 JAP_supremacy_of_the_battlefleet_desc: "Berbekal rancangan kapal tempur superior kita, kita hanya membutuhkan satu bentrokan laut yang menentukan untuk mengunci kemenangan mutlak. Kita harus mengoptimalkan armada tempur agar mampu memaksakan dan memenangkan pertempuran tersebut."
 JAP_the_ultimate_battleship: "Kapal Tempur Pamungkas"
 JAP_the_ultimate_battleship_desc: "Karena kita tidak kaya sumber daya, kita harus memanfaatkannya untuk kapal terhebat. Kita akan membangun kapal tempur terbesar dan paling perkasa yang pernah mengapung di muka bumi, sanggup melumat musuh mana pun dalam duel terbuka."
 JAP_cruiser_modernization: "Modernisasi Kapal Penjelajah"
 JAP_cruiser_modernization_desc: "Kapal penjelajah akan menjadi tulang punggung gugus tugas kita di seantero Pasifik, sehingga kita memerlukan rancangan terbaik yang mampu kita bangun."
 JAP_long_lance_torpedoes: "Torpedo Long Lance (Tipe 93)"
 JAP_long_lance_torpedoes_desc: "Ketidakseimbangan sumber daya global membuat armada kita kalah jumlah oleh musuh. Oleh karena itu, kita akan merancang torpedo tercanggih di dunia: senjata berdaya hancur dahsyat dengan jarak jangkau luar biasa jauh yang didorong oleh oksigen murni, memungkinkan kapal permukaan kecil kita menghancurkan kapal raksasa musuh dari jarak aman."
 JAP_torpedo_cruisers: "Penjelajah Torpedo"
 JAP_torpedo_cruisers_desc: "Kita akan mengkhususkan satu kelas kapal perang untuk membawa puluhan torpedo baru kita, memungkinkan mereka memuntahkan badai torpedo mematikan ke tengah konvoi armada musuh."
 JAP_yamato_tt: "Menambahkan dua jalur produksi Kapal Tempur Super-Berat §YKelas Yamato§!, masing-masing selesai 75% dan 50%."
 cost_reduced_last_stand: "Mengizinkan penggunaan kemampuan komando §YBertahan Sampai Akhir (Last Stand)§! dengan pengurangan biaya yang signifikan.\n"
 MAN_pacify_the_countryside: "Pasifikasi Pedalaman"
 MAN_pacify_the_countryside_desc: "Sejak kita naik ke tampuk kekuasaan, para bandit dan pemberontak terus merongrong kekuasaan kita di wilayah pelosok negeri. Jika kita ingin dihormati sebagai pemerintahan yang berwibawa, kita harus menumpas tuntas gerombolan ini dan membuktikan kepada rakyat bahwa kita sanggup menegakkan hukum."
 MAN_pacify_the_countryside_effect_tooltip: "Tempatkan pasukan di negara bagian tertentu untuk menetralkan bandit di pedalaman.\n"
 MAN_army_modernization: "Modernisasi Angkatan Darat"
 MAN_army_modernization_desc: "Angkatan Darat kita kecil dan ketinggalan zaman. Mengingat potensi sumber daya kita, hal ini tidak bisa diterima. Kita harus sanggup memikul tanggung jawab kita secara mandiri."
 MAN_mukden_military_academy: "Akademi Militer Mukden"
 MAN_mukden_military_academy_desc: "Tentara kita membutuhkan perwira-perwira setia dan cakap jika kita ingin mengandalkan taktik dan disiplin daripada sekadar jumlah massa untuk meraih kemenangan."
 MAN_invite_japanese_settlers: "Undang Transmigran Jepang"
 MAN_invite_japanese_settlers_desc: "Lahan kita jauh lebih luas daripada jumlah penduduk kita. Sebagian besar wilayah negeri masih berupa padang belantara. Kita harus mendatangkan pemukim ke daerah-daerah ini demi membangun komunitas baru dan mempercepat pembangunan ekonomi."
 MAN_collective_farms: "Pertanian Kolektif"
 MAN_collective_farms_desc: "Sistem pertanian perorangan yang dikelola oleh satu keluarga kecil terbukti terbelakang dan tidak efisien. Menyatukan tenaga kerja dan lahan satu desa ke dalam satu kesatuan akan memungkinkan modernisasi yang jauh lebih produktif."
 MAN_law_university: "Universitas Hukum"
 MAN_law_university_desc: "Negara kita masih belia. Kita memiliki peluang emas untuk menyusun sistem hukum yang benar-benar baru, berlandaskan pemahaman kenegaraan paling modern. Untuk itu, kita harus mendirikan lembaga pendidikan tinggi guna menghimpun para pemikir paling cemerlang di Asia."
 MAN_research_and_education_department: "Departemen Riset dan Pendidikan"
 MAN_research_and_education_department_desc: "Seiring tumbuhnya bangsa kita, sarana pendidikan dan riset kita harus dikembangkan sepadan. Upaya lebih besar harus dikerahkan guna memastikan fokus penelitian diarahkan tepat pada sektor-sektor yang paling membutuhkan."
 MAN_trade_delegation: "Delegasi Perdagangan"
 MAN_trade_delegation_desc: "Dunia luar jauh lebih maju dalam penguasaan metode industri modern. Kita harus mengirimkan delegasi dagang untuk mempelajari teknik-teknik mereka guna memperbaiki sistem kita sendiri."
 MAN_expand_the_textile_industry: "Perluas Industri Tekstil"
 MAN_expand_the_textile_industry_desc: "Pabrik-pabrik tekstil kita sekian lama menjadi andalan manufaktur negeri, dan merupakan cara paling cepat untuk meraup modal asing demi memperluas basis industri berat kita."
 MAN_obedience: "Ketaatan pada Sekutu"
 MAN_obedience_desc: "Segelintir pihak mencap kita sekadar boneka Jepang, namun mereka sama sekali tidak memahami ikatan erat dan kesetaraan hubungan kita. Melawan para penyokong kita sama hinanya dengan anak yang durhaka kepada orang tuanya."
 MAN_hoankyoku: "Hoankyoku (Biro Keamanan Politik)"
 MAN_hoankyoku_desc: "Pemerintahan kita adalah harapan terbaik bagi masa depan Tiongkok. Tak pelak lagi, banyak pihak bernafsu menghancurkannya. Kita harus membentuk dinas keamanan khusus yang bertugas memburu para pengacau tersebut dan melindungi keutuhan negara."
 MAN_first_five_year_plan: "Rencana Lima Tahun Pertama"
 MAN_first_five_year_plan_desc: "Kendati kerap dikaitkan dengan komunisme, rencana lima tahun adalah instrumen berharga dalam merancang pembangunan ekonomi nasional. Kita harus menerapkan rencana ini demi memandu ekspansi industri kita secara terukur."
 MAN_invite_japanese_investors: "Undang Investor Jepang"
 MAN_invite_japanese_investors_desc: "Membangun negeri memerlukan modal dari luar. Sejumlah konglomerat di Jepang telah menyatakan kesediaan mereka menanamkan modal di negara kita."
 MAN_expand_the_railways: "Perluas Jaringan Rel Kereta Api"
 MAN_expand_the_railways_desc: "Jaringan kereta api modern adalah urat nadi yang menyatukan setiap sudut negeri kita di bawah satu naungan."
 MAN_develop_aluminum_sources: "Kembangkan Sumber Aluminium"
 MAN_develop_aluminum_sources_desc: "Kita memiliki deposit bauksit melimpah di Liaoning yang siap ditambang. Kekayaan ini akan menjadi suntikan tenaga luar biasa bagi industri penerbangan kita."
 MAN_expand_showa_steel_works: "Perluas Pabrik Baja Showa"
 MAN_expand_showa_steel_works_desc: "Pabrik Baja Showa merupakan tulang punggung industri berat kita. Berinvestasi di sana akan mendatangkan keuntungan melimpah bagi kemandirian bangsa di kemudian hari."
 MAN_social_research_unit: "Unit Riset Sosial"
 MAN_social_research_unit_desc: "Kita harus membentuk unit khusus untuk meneliti adat istiadat dan perilaku rakyat kita, agar kita dapat membimbing mereka menjadi warga negara yang patuh dan berdaya guna."
 MAN_second_five_year_plan: "Rencana Lima Tahun Kedua"
 MAN_second_five_year_plan_desc: "Menyusul kesuksesan Rencana Lima Tahun Pertama, sudah selayaknya kita melanjutkan momentum pembangunan ekonomi ini ke tahap berikutnya."
 MAN_national_defense_state: "Negara Pertahanan Nasional"
 MAN_national_defense_state_desc: "Hingga perang ini dimenangkan dan kita kembali bertahta atas seluruh Tiongkok, kita harus mengerahkan segenap daya, rela berkorban jiwa raga, dan mendayagunakan seluruh sumber daya untuk memenangkan perang."
 MAN_mukden_arsenal: "Pabrik Persenjataan Mukden"
 MAN_mukden_arsenal_desc: "Pabrik senjata lama Kekaisaran akan menjadi inti dari kompleks industri militer baru yang akan memasok persenjataan modern bagi tentara kita."
 MAN_mamc: "MAMC (Perusahaan Manufaktur Pesawat Manchuria)"
 MAN_mamc_desc: "Mendirikan Perusahaan Manufaktur Pesawat Manchuria akan memberi kita sarana untuk membangun angkatan udara modern yang sanggup berdiri sejajar dengan negara mana pun."
 MAN_alliance_with_the_kwantung_army: "Aliansi dengan Tentara Kwantung"
 MAN_alliance_with_the_kwantung_army_desc: "Pasukan militer Jepang di negeri kita kerap berselisih paham dengan gagasan kita. Kita harus menjalin kemitraan yang lebih erat dengan mereka demi memastikan kerja sama berjalan mulus tanpa gesekan."
 MAN_chinese_leadership: "Kepemimpinan Sejati Tiongkok"
 MAN_chinese_leadership_desc: "Rakyat Tiongkok merindukan pemimpin sejati keturunan Tionghoa. Kita harus menyatakan secara terbuka kepada dunia bahwa cita-cita kita adalah pemulihan penuh Dinasti Kekaisaran atas seluruh daratan Tiongkok!"
 MAN_vassalize_mengukuo: "Tundukkan Mengkukuo"
 MAN_vassalize_mengukuo_desc: "Pangeran Mengkukuo tidak pantas disejajarkan dengan Kaisar Manchukuo. Waktunya telah tiba untuk mengakhiri eksperimen ini dan menempatkan beliau pada kedudukan vasal yang semestinya."
 MAN_national_cooperation_government: "Pemerintahan Kerja Sama Nasional"
 MAN_national_cooperation_government_desc: "Kita mendengar desas-desus meresahkan bahwa Jepang tengah mempertimbangkan politisi Tionghoa lain — rakyat jelata — untuk membentuk pemerintahan kolaborasi. Ini penghinaan yang tak bisa ditoleransi. Kita harus memastikan seluruh wilayah Tiongkok yang dibebaskan dikelola langsung oleh kita!"
 MAN_the_two_emperors: "Dua Kaisar Bersaudara"
 MAN_the_two_emperors_desc: "Saatnya membuang anggapan keliru bahwa kita hanyalah bawahan Jepang. Dua Kaisar kita berdiri sejajar bagaikan saudara kandung yang saling menghormati!"
 MAN_assertiveness: "Kemandirian Tegas (Assertiveness)"
 MAN_assertiveness_desc: "Pihak Jepang terus bersikap arogan dan memperlakukan kita semena-mena. Kita harus mengingatkan mereka bahwa kita pun sebuah Kekaisaran berdaulat yang patut disegani."
 MAN_request_control_of_the_railways: "Tuntut Kendali Kereta Api"
 MAN_request_control_of_the_railways_desc: "Di negeri seluas wilayah kita, menguasai rel kereta api berarti menguasai jalannya negara.\n\nDan saat ini pihak Jepang yang menguasai perkeretaapian itu.\n\nKeadaan tersebut harus diakhiri."
 MAN_staff_the_court_with_manchus: "Isi Istana dengan Bangsawan Manchu"
 MAN_staff_the_court_with_manchus_desc: "Dinasti Qing telah memimpin Tiongkok selama berabad-abad. Jika kita ingin merebut kembali keagungan masa lalu kita, kita harus memastikan kita meneladani tata kelola istana leluhur kita sedekat mungkin."
 MAN_expand_the_imperial_guards: "Perluas Pasukan Pengawal Kekaisaran"
 MAN_expand_the_imperial_guards_tt: "Dapatkan 4 unit dengan §Y7 batalion Infanteri§! dan §Y2 batalion Artileri§!.\n"
 MAN_expand_the_imperial_guards_desc: "Pasukan Pengawal Kekaisaran akan menjadi korps elit angkatan darat kita yang menjadi teladan pengabdian bagi seluruh prajurit."
 MAN_local_arms_procurement: "Pengadaan Senjata Mandiri"
 MAN_local_arms_procurement_desc: "Kita tidak bisa selamanya bergantung pada belas kasihan pasokan senjata Jepang. Jika kita ingin berdaulat, kita harus memegang pabrik senjata kita sendiri."
 MAN_bolster_nationalism: "Kobarkan Nasionalisme"
 MAN_bolster_nationalism_desc: "Sekian lama khalayak memandang Manchukuo sekadar ciptaan artifisial bentukan Jepang. Namun setiap bangsa besar bermula dari sebuah gagasan. Kita harus membangkitkan rasa identitas kebangsaan Manchu di hati rakyat dan mengubah gagasan itu menjadi kenyataan agung."
 MAN_five_equal_peoples: "Lima Bangsa yang Setara"
 MAN_five_equal_peoples_desc: "Zaman ketika satu etnis mendominasi dan menindas etnis lainnya telah berlalu. Manchukuo akan menjadi fajar baru sebuah bangsa, di mana lima suku bangsa — Rusia, Jepang, Mongolia, Korea, dan Manchu — hidup berdampingan dalam harmoni persaudaraan."
 MAN_white_russian_advisers: "Penasihat Militer Rusia Putih"
 MAN_white_russian_advisers_desc: "Pasca-perang saudara di Rusia, ribuan warga Rusia Putih memilih mengungsi ke tanah kita daripada menghadapi pembantaian kaum Bolshevik. Kita dapat mendayagunakan keahlian tempur para perwira berpengalaman ini untuk melatih angkatan perang kita."
 MAN_empower_the_legislative_council: "Berdayakan Dewan Legislatif"
 MAN_empower_the_legislative_council_desc: "Dewan Legislatif saat ini hanyalah stempel seremonial yang menyetujui apa pun yang disodorkan oleh tuan Jepang kita. Jika kita ingin menjadi negara berdaulat sejati, kita harus memegang otonomi mutlak dalam urusan perundang-undangan."
 MAN_five_people_armies: "Laskar Lima Bangsa"
 MAN_five_people_armies_desc: "Jika setiap warga negara memiliki derajat yang setara, maka setiap warga negara wajib sama-sama siap membela kedaulatan tanah air dari penindasan asing."
 MAN_five_people_armies_tt: "Dapatkan 7 unit dengan §Y3 batalion Infanteri§!.\n"
 MAN_purge_the_general_affairs_council: "Bubarkan Dewan Urusan Umum"
 MAN_purge_the_general_affairs_council_desc: "Dewan Urusan Umum sengaja disusupkan oleh Jepang demi memegang kendali penuh atas pemerintahan kita. Tirani tersembunyi ini tidak boleh dibiarkan. Kita harus menyingkirkan siapa pun yang kesetiaannya pada negara kita diragukan!"
 MAN_reform_the_civil_service: "Reformasi Aparatur Sipil"
 MAN_reform_the_civil_service_desc: "Dewan Urusan Umum barulah puncak gunung es. Para birokrat Jepang praktis mengendalikan sebagian besar instansi sipil di luar kendali kita. Kita harus menempatkan para pamong praja kita sendiri di pos-pos penting."
 MAN_independence_war: "Perang Kemerdekaan"
 MAN_independence_war_desc: "Waktunya telah tiba untuk mematahkan belenggu penindasan dan bertarung demi kemerdekaan pusaka leluhur kita. Manchukuo akan menjadi tanah Tiongkok pertama yang menghirup udara kebebasan dari cengkeraman penjajah!"
 MAN_imperial_divinity: "Kesucian Takhta Kekaisaran"
 MAN_imperial_divinity_desc: "Di masa lampau, para Kaisar Tiongkok diagungkan sebagai Putra Langit pembawa amanat suci. Kita harus menautkan kembali kedudukan Yang Mulia Kaisar saat ini dengan tradisi agung tersebut."
 MAN_imperial_university: "Universitas Kekaisaran"
 MAN_imperial_university_desc: "Kekaisaran membutuhkan cendekiawan berbakat untuk memperjuangkan kejayaannya. Kita harus mendirikan universitas agung tempat putra-putri terbaik bangsa saling menuntut ilmu dan berinovasi."
 MAN_move_capitals: "Pindahkan Ibu Kota"
 MAN_move_capitals_desc: "Ibu kota kuno seluruh Tiongkok sejak zaman dahulu adalah Beijing. Kini setelah kota tersebut berhasil kita rebut kembali, kita dapat mengarak Sang Kaisar dalam pawai kemenangan kembali ke istana leluhur beliau."
 MAN_claim_the_mandate_of_heaven: "Klaim Mandat Langit (Tianming)"
 MAN_claim_the_mandate_of_heaven_desc: "Kemenangan gemilang kita dalam perang membuktikan bahwa langit sendiri telah merestui Yang Mulia Kaisar sebagai penguasa yang adil dan berhak atas Takhta Surgawi. Setiap keraguan akan keabsahan beliau sebagai penguasa tunggal seluruh Tiongkok akan sirna di hadapan bukti nyata yang tak terbantahkan ini!"
 MAN_reclaim_the_empire: "Rebut Kembali Kekaisaran"
 MAN_reclaim_the_empire_desc: "Kini setelah kita memenangkan kemerdekaan sejati, saatnya meneruskan perang suci menumpas para pengkhianat dan pemberontak di seantero Tiongkok. Kita akan bertahta atas negeri ini, atau gugur sebagai kesatria dalam mencapainya!"
 MAN_assert_our_authority: "Tegakkan Otoritas Kekaisaran"
 MAN_assert_our_authority_desc: "Seluruh penjuru negeri kini terpecah-belah oleh anarki. Tak satu pun dari para perampas kekuasaan dan bandit yang menggelari diri mereka panglima perang maupun ketua faksi yang pantas memimpin bangsa. Mereka akan dipaksa berlutut, dan cahaya kepemimpinan agung kita akan menyinari seluruh Tiongkok!"
 MAN_offer_vassalization: "Tawarkan Status Vasal"
 MAN_offer_vassalization_desc: "Kobaran perang telah mencabik-cabik persatuan tanah air. Kita dapat memadamkannya jika kita menawarkan tempat terhormat di istana bagi mereka yang selama ini enggan memihak pemberontak."
