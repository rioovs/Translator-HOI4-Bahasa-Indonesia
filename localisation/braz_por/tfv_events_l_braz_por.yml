 tfv_new_zealand.1.t: "[From.GetNameDefCap] Meminta Keanggotaan di Komintern"
 tfv_new_zealand.1.desc: "Revolusi telah berhasil dalam [From.GetNameDef]! Pemerintahan komunis baru telah mengambil alih negara tersebut dan berupaya menjadi anggota Komintern."
 tfv_new_zealand.1.a: "Semua orang dipersilakan untuk bergabung dalam perjuangan."
 tfv_new_zealand.1.b: "Menerima mereka hanya akan membuka kemungkinan konflik di wilayah yang jauh."
 tfv_new_zealand.2.t: "Keanggotaan Komintern disetujui"
 tfv_new_zealand.2.desc: "Setelah mempertimbangkan dengan cermat, Komite Sentral Komintern telah menyetujui permintaan keanggotaan kami."
 tfv_new_zealand.2.a: "[Root.GetNameDefCap] dan [From.GetFactionName] akan berbaris berdampingan!"
 tfv_new_zealand.3.t: "Keanggotaan Komintern ditolak"
 tfv_new_zealand.3.desc: "Delegasi kami harus menerima ceramah panjang lebar dari Ketua Komintern, yang menjelaskan bahwa negara sekecil kami tidak mungkin menjadi negara industri maju yang bisa menghasilkan revolusi komunis. Rupanya kita adalah sesuatu yang lain. Bagaimanapun juga, kami tidak dapat menjadi bagian dari Komintern."
 tfv_new_zealand.3.a: "Mungkin merekalah yang salah?"
 tfv_new_zealand.4.t: "[From.GetNameDefCap] ingin bergabung dengan tujuan kami"
 tfv_new_zealand.4.desc: "Melihat kekuatan tentara kita yang tak terkalahkan, pemerintah [NZL.GetName] telah memutuskan bahwa mereka lebih memilih berada di pihak kita dalam konflik ini. Pertanyaannya adalah apakah kita harus mengizinkannya."
 tfv_new_zealand.4.a: "Selama mereka tahu tempatnya."
 tfv_new_zealand.4.b: "Mengapa mengambil dengan diplomasi apa yang bisa diambil dengan perang?"
 tfv_new_zealand.5.t: "Jepang menyetujuinya"
 tfv_new_zealand.5.desc: "Permintaan kami untuk aliansi dengan Jepang telah disetujui."
 tfv_new_zealand.5.a: "Ini akan membuat kita tetap aman."
 tfv_new_zealand.6.t: "Jepang menolak aliansi"
 tfv_new_zealand.6.desc: "Pemerintah [JAP.GetAdjective] bahkan tidak memberikan tanggapan resmi terhadap permintaan kami. Rumor mengatakan bahwa hal ini dianggap sebagai sumber kegembiraan besar di kalangan pemerintah [JAP.GetAdjective]."
 tfv_new_zealand.6.a: "Kasar."
 tfv_new_zealand.7.t: "Michael Joseph Savage Meninggal"
 tfv_new_zealand.7.desc: "Dalam peristiwa yang tragis, Perdana Menteri Selandia Baru yang sangat dicintai, Michael Joseph Savage, telah meninggal dunia karena kanker. Seluruh negeri berduka atas sosok yang dianggap sebagai pendiri sistem kesejahteraan Selandia Baru. Sejarah akan mengingat keberanian dan kebaikannya kepada orang-orang disekitarnya."
 tfv_new_zealand.7.a: "Dia akan dirindukan."
 tfv_raj.1.t: "Dana Pejuang"
 tfv_raj.1.desc: "Di seluruh Kekaisaran, \"Fighter Funds\" telah dibentuk di komunitas lokal untuk mengumpulkan uang bagi pesawat tempur baru untuk Royal Air Force. Orang-orang kaya juga ikut menyumbang untuk membeli pesawat untuk militer. Nizam Hyderabad telah menyumbangkan cukup uang untuk membiayai pembelian 2 skuadron penuh. Pertanyaannya adalah di mana mereka harus ditempatkan."
 tfv_raj.1.a: "Mereka harus pergi ke Inggris."
 tfv_raj.1.b: "Kami membutuhkan ini untuk pertahanan tanah air!"
 tfv_raj.2.t: "Pangeran India menyumbangkan pesawat tempur"
 tfv_raj.2.desc: "Nizam dari Hyderabad, seorang Pangeran India, dengan murah hati menyumbangkan uangnya untuk membeli dua skuadron penuh pesawat tempur paling modern kami untuk Royal Air Force. Pemerintah telah mengucapkan terima kasih dan menyatakan bahwa pesawat pertama akan diberi nama \"Spirit of Hyderabad\"."
 tfv_raj.2.a: "Mereka akan terbukti sangat berguna."
 tfv_raj.21.t: "Kelaparan Benggala"
 tfv_raj.21.desc: "Bengal pernah dilanda kelaparan sebelumnya, namun kali ini kejadian-kejadian di wilayah tersebut justru memperburuk keadaan dibandingkan biasanya. Pemerintahan kolonial yang sangat tidak kompeten telah menunjukkan bahwa mereka sama sekali tidak mampu – atau mungkin bahkan tidak mau – memberikan reaksi yang memadai terhadap topan yang menyapu bersih sebagian besar panen padi di Bengal. Dengan banyaknya pengungsi yang berdatangan dari daerah-daerah yang dilanda perang, permintaan akan makanan meningkat setiap hari sementara pasokan semakin berkurang.\n\nHarga pangan telah meningkat secara dramatis, menyebabkan orang-orang terpaksa berhenti bekerja karena tidak lagi mempunyai gaji yang cukup untuk memberi makan keluarga mereka. Jumlah rekrutmen tentara juga menurun drastis karena semakin banyak orang yang menolak meninggalkan rumah mereka untuk memperjuangkan pemerintah yang tidak melakukan apa pun untuk membantu mereka."
 tfv_raj.21.a: "Ini adalah bencana!"
 tfv_raj.30.t: "Komunis India meminta dukungan"
 tfv_raj.30.desc: "Subhas Chandra Bose, pemimpin Blok Maju Seluruh India, datang ke Moskow untuk meminta bantuan kami dalam perjuangan kemerdekaan India. Dengan mengacu pada konflik tradisional antara Rusia dan Inggris di India, yang berasal dari masa Pertandingan Besar, ia percaya bahwa kita adalah pilihan yang wajar untuk membantu orang India mencapai kemerdekaan mereka dari Inggris."
 tfv_raj.30.a: "Mari kita akhiri Kerajaan Inggris untuk selamanya."
 tfv_raj.30.b: "Gagasan yang tidak masuk akal."
 tfv_raj.31.t: "[SOV.GetNameDefCap] mendukung Kemerdekaan India"
 tfv_raj.31.desc: "Duta Besar [SOV.GetAdjective] hari ini mengunjungi Kementerian Luar Negeri untuk membahas masalah Kemerdekaan India. Dalam pertemuan tersebut, beliau menegaskan dengan sangat jelas bahwa [SOV.GetNameDef] menganggap kelanjutan kekuasaan kami di India sama sekali tidak dapat diterima. Tampaknya kata-kata Bose mendapat perhatian dari [SOV.GetLeader], dan telah mempengaruhi Rusia untuk mendukung perjuangannya.\n\nUntuk saat ini, [SOV.GetAdjective] tampaknya membatasi diri mereka pada pelatihan sukarelawan India di negara mereka, namun mereka mungkin akan melakukan intervensi dalam konflik apa pun yang muncul di anak benua tersebut."
 tfv_raj.31.a: "Kalau begitu, mereka tidak memberi kita pilihan. Kita harus membiarkan mereka pergi."
 tfv_raj.31.b: "Jika mereka ingin memainkan Permainan Hebat lagi, ayo bermain."
 tfv_raj.32.t: "[SOV.GetNameDefCap] mengambil tujuan kita"
 tfv_raj.32.desc_SOV_helps: "Negosiasi kami di Moskow sukses luar biasa. Hari ini, tajuk utama Pravda berbunyi \"Perjuangan rakyat India untuk kebebasan adalah perjuangan kita!\" Kawan [SOV.GetLeader] sendiri sudah bertemu dengan Chandra Bose dan menjanjikan dukungan penuhnya."
 tfv_raj.32.desc_SOV_helps_ENG_reject: "Harapan kami akan jalan mudah menuju kemerdekaan telah diakhiri dengan kejam oleh pemerintahan kolonial Inggris. Ketika Duta Besar [SOV.GetAdjective] mendekati mereka dengan permintaan agar kami diizinkan menentukan nasib kami sendiri, dia segera diberitahu bahwa tidak ada yang perlu dibicarakan. Pemerintah [ENG.GetAdjective] menyatakan bahwa persoalan kemerdekaan kita adalah persoalan internal yang tidak boleh diintervensi oleh kekuatan asing."
 tfv_raj.32.a: "Pertarungan berlanjut."
 tfv_raj.33.t: "[SOV.GetAdjective]s menolak membantu"
 tfv_raj.33.desc: "Subhas Chandra Bose telah berusaha mengajak pemerintah [SOV.GetAdjective] untuk membantu perjuangan kami, namun usahanya belum membuahkan hasil. Setelah menunggu beberapa hari untuk berbicara dengan [SOV.GetLeader], dia diberikan kesempatan untuk pertemuan yang berlangsung hampir sepuluh menit.\n\nMeskipun [SOV.GetLeader] mengungkapkan kekagumannya yang besar terhadap perjuangan revolusioner rakyat kita, ia juga menjelaskan bahwa ia tidak yakin negara kita siap untuk langkah selanjutnya menuju komunisme penuh."
 tfv_raj.33.a: "Mungkin kita harus bertanya pada orang Jerman?"
 tfv_raj.34.t: "Kebebasan Untuk India"
 tfv_raj.34.desc: "Hari ini menandai dimulainya era baru dalam sejarah India. Setelah berabad-abad berada di bawah kekuasaan asing, kita akhirnya mencapai kemerdekaan penuh. Pegawai negeri [ENG.GetAdjective] setempat telah diperintahkan untuk membantu transisi ke aturan rumah [RAJ.GetAdjective] dan akan dipulangkan dalam beberapa bulan ke depan.\n\nDengan bantuan kawan-kawan [SOV.GetAdjective] yang baru, kami sekarang dapat fokus pada tugas di depan kami – membangun bangsa untuk rakyat kami."
 tfv_raj.34.a: "Kemenangan!"
 tfv_raj.40.t: "Nasionalis India meminta dukungan"
 tfv_raj.40.desc: "Subhas Chandra Bose, pemimpin Blok Maju Seluruh India, datang ke Berlin untuk meminta bantuan kami dalam perjuangan kemerdekaan India. Dalam suratnya kepada [GER.GetLeader], dia mengungkapkan kekagumannya dan menyarankan agar India merdeka akan menjadi sekutu yang berharga dalam upaya kita memulihkan [GER.GetNameDef] ke tempat yang selayaknya di dunia."
 tfv_raj.40.a: "Inggris mengambil koloni kami. Sekarang kita ambil milik mereka."
 tfv_raj.40.b: "Gagasan yang tidak masuk akal."
 tfv_raj.41.t: "[GER.GetNameDefCap] mendukung Kemerdekaan India"
 tfv_raj.41.desc: "Duta Besar [GER.GetAdjective] hari ini mengunjungi Kementerian Luar Negeri untuk membahas masalah Kemerdekaan India. Dalam pertemuan tersebut, beliau menegaskan dengan sangat jelas bahwa [GER.GetLeader] menganggap kelanjutan kekuasaan kami di India sama sekali tidak dapat diterima. Tampaknya Bose telah berjanji bahwa India yang merdeka akan mendukung kepentingan [GER.GetAdjective] di wilayah tersebut.\n\nDuta Besar menolak untuk menjelaskan apa yang pemerintahnya bersedia lakukan jika kami menolak, namun kami harus berasumsi bahwa mereka bahkan mungkin akan melakukan perang."
 tfv_raj.41.a: "Kalau begitu, mereka tidak memberi kita pilihan. Kita harus membiarkan mereka pergi."
 tfv_raj.41.b: "Kami telah memainkan Permainan Hebat di India sebelumnya. Mari kita lihat seberapa baik Jerman memainkannya."
 tfv_raj.42.t: "[GER.GetNameDefCap] mengambil tujuan kita"
 tfv_raj.42.desc_GER_helps: "Setelah bertemu dengan menteri luar negeri [GER.GetAdjective] dan menyampaikan argumennya, Subhas Chandra Bose berhasil meyakinkan [GER.GetAdjective] untuk mendukung kami. Bose juga bertemu dengan pemimpin Jerman [GER.GetLeader] dan membahas masalah-masalah yang menjadi kepentingan bersama selama beberapa jam, termasuk meningkatkan satu unit sukarelawan India dari Tahanan Perang Inggris."
 tfv_raj.42.desc_GER_helps_ENG_reject: "Harapan kami akan jalan mudah menuju kemerdekaan telah diakhiri dengan kejam oleh pemerintahan kolonial Inggris. Ketika Duta Besar [GER.GetAdjective] mendekati mereka dengan permintaan agar kami diizinkan menentukan nasib kami sendiri, dia segera diberitahu bahwa tidak ada yang perlu dibicarakan. Pemerintah [ENG.GetAdjective] menyatakan bahwa persoalan kemerdekaan kita adalah persoalan internal yang tidak boleh diintervensi oleh kekuatan asing."
 tfv_raj.42.a: "Pertarungan berlanjut."
 tfv_raj.43.t: "[GER.GetAdjective]s menolak membantu"
 tfv_raj.43.desc: "Subhas Chandra Bose telah berusaha mengajak pemerintah [GER.GetAdjective] untuk membantu perjuangan kami, namun usahanya belum membuahkan hasil. Setelah menunggu beberapa hari untuk berbicara dengan [GER.GetLeader], dia diberikan kesempatan untuk pertemuan yang berlangsung hampir sepuluh menit.\n\nSementara [GER.GetLeader] mengungkapkan kekagumannya yang besar atas situasi kita dan semangat perlawanan yang fanatik, ia juga menjelaskan bahwa ia tidak percaya bahwa negara kita layak untuk dikerahkan sumber dayanya."
 tfv_raj.43.a: "Kutukan."
 tfv_raj.44.t: "Kebebasan Untuk India"
 tfv_raj.44.desc: "Hari ini menandai dimulainya era baru dalam sejarah India. Setelah berabad-abad berada di bawah kekuasaan asing, kita akhirnya mencapai kemerdekaan penuh. Pegawai negeri [ENG.GetAdjective] setempat telah diperintahkan untuk membantu transisi ke aturan rumah [RAJ.GetAdjective] dan akan dipulangkan dalam beberapa bulan ke depan.\n\nDengan bantuan teman-teman baru [GER.GetAdjective], kami sekarang dapat fokus pada tugas di depan kami - membangun bangsa untuk rakyat kami."
 tfv_raj.44.a: "Kemenangan!"
 AST_CREATE_FACTION: "Kami akan membentuk faksi kami sendiri."
 SAF_colonies_tt: "Melepaskan §YKenya§! dan §YZimbabwe§! sebagai boneka."
 SAF_soviet_research_tt: "Menandatangani perjanjian penelitian dengan Afrika Selatan."
 tfv_raj_focus_paratrooper_tt: "Pasukan terjun payung Battaglione Azad Hindoustan akan dikerahkan di Italia."
 tfv_raj.201.t: "Batalyon Azad Hindoustan"
 tfv_raj.201.desc: "Direkrut dari Tahanan Perang, para prajurit Battaglione Azad Hindoustan telah bersumpah untuk memberikan hidup mereka demi mengejar kebebasan India. Terlatih dalam sabotase dan infiltrasi, prajurit elit ini juga mampu dijatuhkan dengan parasut untuk membuat kekacauan di belakang garis musuh."
 tfv_raj.201.a: "Serang dari langit, saudara-saudara!"
 tfv_raj.210.t: "Sabotase?"
 tfv_raj.210.desc: "Para pekerja lokal baru saja istirahat untuk makan siang ketika sebuah ledakan dahsyat mengguncang salah satu pabrik kami. Kerusakan parah terjadi pada bangunan itu sendiri, dan beberapa pekerja terluka akibat pecahan kaca. Syukurlah, sebagian besar peralatan mesin tampaknya masih utuh. Unit polisi dan tentara telah membangun perimeter sementara para penyelidik mencari di antara puing-puing untuk mencari petunjuk penyebab ledakan.\n\nAda banyak desas-desus bahwa ini adalah hasil kerja sel perlawanan dari gerakan Quit India, yang mengubah protes mereka menjadi kekerasan dalam perjuangan mereka untuk kebebasan."
 tfv_raj.210.a: "Mengganggu."
 tfv_raj.211.t: "Sabotase!"
 tfv_raj.211.desc: "Hanya beberapa minggu setelah ledakan pertama, pabrik kedua tiba-tiba hancur, lagi-lagi tepat setelah para pekerja meninggalkan gedung utama untuk makan siang. Tidak ada keraguan bahwa ini adalah hasil kerja kelompok perlawanan terorganisir yang melakukan kampanye sabotase dan terorisme yang terencana. Serangan kurang ajar di siang hari bolong menunjukkan bahwa para penyerang tampak sangat yakin pada diri mereka sendiri."
 tfv_raj.211.a: "Akankah tidak ada yang menghentikan mereka?"
 tfv_raj.212.t: "Musuh di Dalam"
 tfv_raj.212.desc: "Ledakan ketiga telah menghancurkan sebuah pabrik di salah satu negara bagian kita. Kali ini, tampaknya serangannya terjadi pada waktu yang salah, karena bom meledak di tengah-tengah shift. Puluhan pekerja tewas dan puluhan lainnya masih hilang. Penyidik ​​​​sedang mengejar beberapa petunjuk, dan sejumlah rumah telah digeledah. Hasilnya sangat meresahkan, mulai dari propaganda Keluar dari India hingga alat-alat yang dapat digunakan untuk membuat bahan peledak mentah.\n\nTidak satu pun dari mereka yang ditangkap tampaknya merupakan pemimpin kelompok, dan sejauh ini mereka menolak untuk berbicara."
 tfv_raj.212.a: "Ini sudah tidak terkendali."
 tfv_raj_quit_india_unrest_tt: "Para pendukung gerakan ini diperkirakan akan menuntut perubahan."
 tfv_new_zealand.9.t: "[From.GetNameDefCap] Meminta Kontrol atas [Root.GetAdjective] Polinesia"
 tfv_new_zealand.9.desc: "[From.GetNameDefCap] telah mengeluarkan permintaan diplomatik kepada [Root.GetNameDef] untuk meminta kendali atas kepemilikan mereka di Pasifik. Mengutip kedekatan pemerintah mereka dengan masyarakat Maori, para menteri dari [From.GetNameDef] mengklaim bahwa mereka memiliki pemahaman dan hubungan pribadi yang mendalam dengan masyarakat Pasifik yang akan memberi mereka rasa memiliki dan mendorong mereka untuk memperjuangkan tujuan [From.GetFactionName]. Banyak yang percaya [From.GetLeader] memiliki ambisi untuk mengubah [From.GetNameDef] menjadi negara kesatuan Polinesia dan apakah hal ini akan bermanfaat bagi [Root.GetNameDef] masih belum ditentukan."
 tfv_new_zealand.9.a: "Permintaan yang masuk akal."
 tfv_new_zealand.9.b: "Pulau-pulau itu terlalu berharga."
 tfv_new_zealand.91.t: "[From.GetNameDefCap] Menerima!"
 tfv_new_zealand.91.desc: "Permintaan wajar kami untuk mengendalikan negara bagian Polinesia yang diduduki oleh [From.GetNameDefCap] telah diterima dan kami sekarang mengendalikan sejumlah wilayah kepulauan baru."
 tfv_new_zealand.91.a: "Luar biasa."
 tfv_new_zealand.92.t: "[From.GetNameDefCap] Menolak"
 tfv_new_zealand.92.desc: "Delegasi [Root.GetAdjective] ke [From.GetNameDefCap] telah kembali dengan berita mengecewakan bahwa [Root.GetNameDefCap] tidak akan menerima satu pun wilayah Polinesia [From.GetNameDefCap]."
 tfv_new_zealand.92.a: "sial!"
