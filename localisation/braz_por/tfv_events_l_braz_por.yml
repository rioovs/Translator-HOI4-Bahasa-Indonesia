l_braz_por:
 tfv_australia.1.t: "[From.GetAdjective] Proposal tentang Strategi Singapura"
 tfv_australia.1.d: "Strategi Singapura telah menjadi landasan kebijakan pencegahan kami terhadap [JAP.GetNameDef] sejak berakhirnya Perang Besar. Namun, penempatan kembali Armada Utama ke Singapura jika terjadi serangan bergantung pada dukungan sekutu kita di [From.GetNameDef]. Dengan potensi ancaman terhadap wilayah kekuasaan Inggris di Timur Jauh yang semakin meningkat dari hari ke hari, komando tinggi [From.GetAdjective] telah menghadirkan potensi strategi baru, yang akan menjadikan Australia memiliki kendali yang jauh lebih besar atas pertahanan wilayah tersebut.\n\nIni adalah rencana yang masuk akal, dan satu-satunya pertanyaan adalah apakah kami yakin mereka dapat memberikan keamanan yang kami perlukan."
 tfv_australia.1.a: "Australia harus menjadi garis pertahanan pertama di Asia Tenggara."
 tfv_australia.1.b: "Strategi Singapura akan tetap seperti biasanya."
 tfv_australia.2.t: "[From.GetNameDefCap] Mentransfer Kepemilikan Kolonial"
 tfv_australia.2.d: "[From.GetAdjective] telah mengesahkan undang-undang yang akan mengalihkan kendali atas seluruh kepemilikan kolonial [From.GetAdjective] di dekat Singapura dan Kalimantan kepada [Root.GetNameDef].\n\nKeamanan nasional kita akhirnya ada di tangan kita sendiri."
 tfv_australia.2.a: "Kami tidak akan mengecewakan."
 tfv_australia.3.t: "[From.GetNameDefCap] Menolak Penyesuaian Strategis"
 tfv_australia.3.d: "Meskipun kami mempunyai kekhawatiran yang sah mengenai kelangsungan Strategi Singapura, saran kami untuk mengubahnya telah ditolak di parlemen [From.GetAdjective].\nHal ini tampaknya merupakan akibat dari dominasi konservatisme militer di Komando Tinggi [From.GetAdjective], namun faktanya adalah jika ketakutan kita menjadi kenyataan, kita mungkin harus menghadapi pasukan musuh di wilayah pesisir kita."
 tfv_australia.3.a: "Dengan atau tanpa dukungan [From.GetAdjective], [Root.GetNameDef] akan berdiri tegak!"
 tfv_australia.10.t: "[From.GetNameDefCap] Menawarkan Perlindungan bagi Koloni Kita"
 tfv_australia.10.d: "[From.GetNameDefCap] telah memulai negosiasi dengan diplomat [Root.GetAdjective] mengenai kemungkinan pengalihan tanggung jawab atas perlindungan wilayah [Root.GetAdjective] di Asia Tenggara.\n\nMengingat tantangan yang ada dalam mempertahankan wilayah tersebut, kemitraan mungkin bukan ide yang buruk. Hal ini berarti bahwa di masa mendatang wilayah tersebut hanya akan memiliki nilai nominal [Root.GetAdjective], namun kepemilikan nominal tentunya lebih baik daripada kehilangan wilayah tersebut sepenuhnya."
 tfv_australia.10.a: "[From.GetNameDefCap] akan menjadi pelaksana kepentingan [Root.GetAdjective] di wilayah tersebut."
 tfv_australia.10.b: "Wilayah [Root.GetAdjective] akan tetap berada di tangan [Root.GetAdjective]!"
 tfv_australia.11.t: "[From.GetNameDefCap] Menyerahkan Protektorat"
 tfv_australia.11.d: "Pasukan [Root.GetAdjective] siap memikul tanggung jawab untuk melindungi seluruh wilayah [From.GetAdjective] di Asia Tenggara segera setelah [From.GetLeader] menyetujui perjanjian tersebut.\n\nSementara beberapa perlawanan lokal ditemui dalam pemindahan tersebut, ketakutan akan agresi asing memastikan bahwa sebagian besar mengakui perlunya pertahanan [Root.GetAdjective]."
 tfv_australia.11.a: "[Root.GetNameDefCap] akan melakukan apa yang harus dia lakukan."
 tfv_australia.12.t: "[From.GetAdjective] Blokir Tindakan Keamanan Regional"
 tfv_australia.12.d: "Meyakini diri mereka cukup mampu melindungi wilayah [From.GetAdjective] di Asia Tenggara, [From.GetNameDef] telah menolak usulan kami mengenai strategi pertahanan bersama.\n\nTidak diragukan lagi dimotivasi oleh kekhawatiran akan kontrol kolonial, tindakan mereka dapat dimengerti. Namun, jika mereka tidak mampu melindungi wilayah mereka – seperti yang kita khawatirkan – kita mungkin akan melihat wilayah tersebut digunakan sebagai landasan peluncuran untuk menyerang benua Australia."
 tfv_australia.12.a: "Kami hanya bisa berharap mereka mampu melawan."
 tfv_australia.20.t: "[From.GetNameDefCap] Menuntut Aneksasi Kami!"
 tfv_australia.20.d: "Kita sudah lama khawatir dengan tumbuhnya semangat nasionalisme di [From.GetNameDef], dan nampaknya sudah tiba saatnya semangat nasionalisme tersebut menyebar melewati perbatasan negara mereka sendiri.\nMengutip warisan bersama sebagai \"negara-negara perintis,\" telah banyak usulan yang diajukan mengenai negara kesatuan Oseania. Namun, retorika menjadi semakin agresif dalam menghadapi perlawanan [Root.GetAdjective].\n\nSekarang spekulasi politik telah berubah menjadi permusuhan terbuka, dan [From.GetLeader] secara terbuka menuntut aneksasi seluruh wilayah [Root.GetAdjective] ke negara bagian [From.GetNameDef].\nJika kami menolak, invasi yang kuat tampaknya sangat mungkin terjadi."
 tfv_australia.20.a: "Kami tidak punya pilihan selain menerima status baru kami sebagai provinsi [From.GetNameDef]."
 tfv_australia.20.b: "Jika mereka menginginkan pulau kita, mereka bisa datang dan memperjuangkannya!"
 tfv_australia.21.t: "[From.GetNameDefCap] Menerima Aneksasi"
 tfv_australia.21.d: "[From.GetAdjective] telah menyerah pada ultimatum kami, dan menerima status baru mereka sebagai provinsi [Root.GetNameDef]. Sementara [From.GetAdjective] PM [From.GetLeader] berduka atas hilangnya [From.GetAdjective] \"kemerdekaan\", momen ini menandai dimulainya era baru bagi Oseania.\n\n[From.GetNameDef], seperti kita, kini sudah tidak lagi menjadi anjing piaraan Kerajaan yang tidak memikirkan kepentingan kita."
 tfv_australia.21.a: "[Root.GetNameDefCap] dan Selandia Baru, bersama menuju masa depan yang lebih kuat!"
 tfv_australia.22.t: "[From.GetNameDefCap] Menolak Tawaran Persatuan Kami"
 tfv_australia.22.d: "Gagal mengakui posisi genting mereka dalam lanskap geopolitik Pasifik, pemerintah [From.GetAdjective] telah menolak tawaran kami untuk menjadikan Selandia Baru salah satu provinsi terkemuka [Root.GetNameDef].\nTidak menyadari bahwa mereka hanyalah anjing kesayangan Inggris, [From.GetAdjective] Perdana Menteri [From.GetLeader] mengutip prinsip-prinsip [From.GetAdjective] \"kebebasan dan kemerdekaan.\"
 tfv_australia.22.a: "Untuk mempersenjatai, [Root.GetAdjective]s!"
 tfv_australia.31.t: "[Root.GetNameDefCap] sebagai Pemimpin Global"
 tfv_australia.31.d: "Mengikuti kebijakan kami yang baru-baru ini untuk menjauhkan diri dari Kekaisaran, masuk akal bagi negara yang sama dominannya dengan kami untuk mengambil posisi sebagai pemimpin, bukan sebagai pengikut.\nKami akan mengumpulkan kekuatan regional lainnya untuk mendukung tujuan kami, dan memastikan bahwa kepentingan bersama kami dipertahankan di panggung global.\n\nTidak lagi mengabdi pada kekuatan kolonial Eropa, kami akan memastikan keseimbangan kekuatan baru yang lebih adil."
 tfv_australia.31.a: "[Root.GetNameDefCap] memimpin jalan menuju masa depan!"
 tfv_australia.32.t: "[From.GetNameDefCap] Meminta Kerja Sama Politik"
 tfv_australia.32.d: "Menyusul kepergian resmi [From.GetNameDef] dari Persemakmuran, pemerintah [From.GetAdjective] kini mencari sekutu baru. Mengingat Eropa tampaknya berada di ambang konflik baru yang memakan banyak biaya, dan nilai strategis [From.GetNameDef] terhadap potensi konflik di Pasifik, kemitraan mungkin merupakan hal yang terbaik bagi kita.\n\nKemitraan ini tentunya akan menekankan Asia Tenggara, Timur Jauh, dan Pasifik sebagai bagian dari wilayah pengaruh kita, dan memastikan bahwa apa pun yang terjadi di Eropa, kepentingan [Root.GetAdjective] tidak akan diganggu."
 tfv_australia.32.a: "Kami akan dengan senang hati menyebut mereka sekutu kami!"
 tfv_australia.32.b: "Kita bisa melindungi kepentingan kita sendiri dengan lebih baik."
 tfv_australia.33.t: "[From.GetNameDefCap] Menyetujui Kerjasama Pasifik"
 tfv_australia.33.d: "Melihat manfaat nyata dari kemitraan transpasifik, [From.GetNameDef] telah menyetujui usulan kami untuk membentuk aliansi regional."
 tfv_australia.33.a: "Tuan-tuan tua sudah mati. Kita semua setara sekarang."
 tfv_australia.34.t: "[From.GetNameDefCap] Menolak Proyek Kerjasama"
 tfv_australia.34.d: "Entah karena kegagalan kita mengakui sejarah kita bersama, atau hanya karena oportunisme politik, [From.GetNameDef] telah menolak tawaran kita untuk menjalin kemitraan transpasifik.\n\nMeskipun partisipasi mereka akan menjadi aset besar, kita harus bergerak maju dengan agenda kita sendiri, menuju tujuan kita sendiri."
 tfv_australia.34.a: "Kami akan tetap melakukan apa yang kami bisa untuk sudut dunia kami."
 tfv_australia.34.b: "Kami telah gagal."
 tfv_australia.41.t: "Dalam Mengejar Kebebasan [INS.GetAdjective]"
 tfv_australia.41.d: "Dengan maraknya kekacauan di bekas koloni [HOL.GetAdjective], terlihat jelas bahwa [INS.GetNameDef], tetangga kita yang terpercaya, membutuhkan uluran tangan untuk mempertahankan otoritas yang telah mereka peroleh dengan susah payah. Selama mereka membutuhkan dukungan kita, [Root.GetNameDef] ada untuk mendukung pemerintah [INS.GetAdjective].\n\nSuatu hari nanti [INS.GetNameDef] akan mampu melawan kekuatan kolonial Eropa sebagai saudara kita di Pasifik. Sampai saat itu tiba, kami akan memastikan mereka tetap kuat bersama kami."
 tfv_australia.41.a: "Bersama-sama dalam pelukan, melawan dunia jika kita harus!"
 tfv_australia.50.t: "[From.GetNameDefCap] Meminta Keanggotaan di [Root.GetFactionName]"
 tfv_australia.50.d: "Mengidentifikasi sebagai bangsa pekerja, bebas dari borjuasi Eropa lama, [From.GetNameDef] secara bertahap beralih ke ranah politik [Root.GetAdjective]. Pemerintah [From.GetAdjective] telah secara resmi meminta keanggotaan nasional dalam [Root.GetFactionName].\n\nDengan Revolusi Dunia di depan mata, [From.GetLeader] menyajikan visi [Root.GetNameDef] dan [From.GetNameDef] sebagai dua kutub utama dalam tatanan dunia Sosialis yang baru, yang membangun dominasi [From.GetNameDef] di Oseania, dan [Root.GetNameDef] ada di Eurasia."
 tfv_australia.50.a: "Negara revolusioner mana pun akan disambut dengan tangan terbuka!"
 tfv_australia.50.b: "Kita tidak bisa menanggung konflik yang pasti akan menyeret kita ke dalamnya oleh [From.GetAdjective]."
 tfv_australia.51.t: "Saudara Revolusi"
 tfv_australia.51.d: "[From.GetNameDefCap] telah mempertimbangkan permintaan kami untuk menjadi anggota [From.GetFactionName], dan menyatakan kami sebagai sekutu yang berharga dalam tujuan ini!"
 tfv_australia.51.a: "Revolusi Dunia menanti!"
 tfv_australia.52.t: "Melakukannya Sendiri"
 tfv_australia.52.d: "Setelah berminggu-minggu negosiasi yang terhenti dan jebakan birokrasi, menjadi jelas bahwa [From.GetNameDef] tidak tertarik untuk memberikan jawaban yang pasti mengenai aksesi kita ke [From.GetFactionName].\nKarena kami mengharapkan negosiasi yang cepat dan konklusif, [Root.GetNameDef] harus bersiap untuk memberikan kebebasan sejati kepada para pekerja di dunia dengan usahanya sendiri."
 tfv_australia.52.a: "Kami berjuang untuk kaum tertindas di seluruh penjuru dunia!"
 tfv_australia.60.t: "[From.GetNameDefCap] Memaksakan Ketuhanan"
 tfv_australia.60.d: "Mengutip hak-hak semua pekerja atas kebebasan dan penentuan nasib sendiri, pemerintah [From.GetAdjective] menuntut agar negara [Root.GetAdjective] menyerah pada gelombang \"Sosialisme Oseanik\" yang melanda wilayah kita.\n\nTerlepas dari kepentingan sebenarnya dari rakyat [Root.GetNameDef], ancaman dari [From.GetNameDef] adalah nyata, dan ada sedikit keraguan bahwa mereka kemungkinan akan menekan hak-hak mereka. tuntutan dengan segala cara yang tersedia bagi mereka..."
 tfv_australia.60.a: "Kami sebenarnya tidak punya pilihan. Untuk revolusi, kawan."
 tfv_australia.60.b: "[Root.GetNameDefCap] tidak akan pernah dikirimkan!"
 tfv_australia.61.t: "[From.GetNameDefCap] Bergabung dalam Perjuangan Revolusioner!"
 tfv_australia.61.d: "Mengakui kebenaran dan kebenaran perjuangan Komunis, [From.GetNameDef] setuju dengan perlunya menyatukan upaya kita di bawah bendera Oseanik yang sama."
 tfv_australia.61.a: "Dari bawah gelombang merah akan muncul dan melahap dunia!"
 tfv_australia.62.t: "[From.GetNameDefCap] Upaya Mengganggu Revolusi"
 tfv_australia.62.d: "Setelah membiarkan rakyat [From.GetAdjective] tertindas di bawah pengawasan borjuis mereka, kucing-kucing gemuk yang mengendalikan pemerintahan [From.GetNameDef] kini telah mengumumkan bahwa mereka, dalam kondisi apa pun, tidak akan bekerja sama dengan negara [Root.GetAdjective].\nKasihan sekali bagi mereka karena kita tidak mencari kerja sama mereka, melainkan kerja sama dengan mereka yang bekerja keras di bawah beban obesitas mereka yang berlebihan!"
 tfv_australia.62.a: "Kami akan membawa kebebasan sejati ke [From.GetNameDef]!"
 tfv_australia.70.t: "[From.GetNameDefCap] Menuntut Hak Mengontrol Protektorat"
 tfv_australia.70.d: "Mengklaim bahwa kegagalan [Root.GetNameDef] dalam mempertahankan wilayah kolonialnya di Asia Tenggara akan berdampak buruk bagi pertahanan nasional [From.GetNameDef], [From.GetLeader] telah meminta agar pemerintah [From.GetAdjective] diberikan tanggung jawab penuh dan independen atas pertahanan wilayah tersebut.\nMeskipun bukan merupakan tuntutan langsung, pertumbuhan pengaruh strategis dan militer [From.GetAdjective] di wilayah tersebut mempunyai argumen yang kuat masuk akal. Penyeimbangnya adalah adanya jarak politik baru-baru ini dari kita yang dianut oleh [From.GetNameDef].\nIni akan menjadi perjanjian dengan mitra potensial, bukan subjek, dan secara de facto akan membuat koloni berada di luar kendali kita, seandainya [From.GetNameDef] memilih untuk mewujudkannya."
 tfv_australia.70.a: "Ya, stabilitas Asia Tenggara adalah prioritas."
 tfv_australia.70.b: "Tidak, kami akan menjadi satu-satunya pengendali wilayah kolonial kami sendiri!"
 tfv_australia.71.t: "Komisi Pertahanan"
 tfv_australia.71.d: "Menyusul tawaran dari komando militer [Root.GetAdjective], [From.GetNameDef] telah memutuskan untuk memberi kami \"kendali perantara\" atas semua wilayah kolonial [From.GetAdjective] di Asia Tenggara.\n\nDengan semakin bijaksananya kekuatan lama di Pasifik, upaya kami untuk memastikan dominasi [Root.GetNameDef] atas wilayah tersebut terus berlanjut."
 tfv_australia.71.a: "Kami akan membuat negara lama bangga."
 tfv_australia.72.t: "[From.GetNameDefCap] Menolak \"Proyek Pertahanan\""
 tfv_australia.72.d: "Meskipun ada tawaran dari Komando Tinggi [Root.GetAdjective], [From.GetNameDef] telah menolak permintaan kami untuk menguasai koloni mereka di wilayah Asia Tenggara.\n\nAkan tetapi, ambisi kami tidak dapat dibendung. Kami akan terus mencari cara untuk menjadikan [Root.GetAdjective] menonjol di Pasifik."
 tfv_australia.72.a: "[Root.GetNameDefCap] berdiri kokoh, meski mengalami kemunduran."
 tfv_australia.80.t: "Tawaran Dari Luar Laut"
 tfv_australia.80.d: "[From.GetNameDefCap] seiring berjalannya waktu menjadi lebih bersimpati terhadap ambisi kekaisaran [Root.GetNameDef]. Sebagai satu-satunya kekuatan militer besar yang berbasis di wilayah tersebut, [From.GetAdjective] telah memutuskan bahwa lebih baik berdiri sebagai sekutu kita yang bangga daripada sebagai pelayan kita yang rendah hati.\n\nUntuk meningkatkan minat kita, usulan aliansi Pasifik Barat dengan jelas menguraikan wilayah [Root.GetAdjective] yang juga mencakup beberapa wilayah yang saat ini dikuasai oleh musuh [From.GetNameDef]."
 tfv_australia.80.a: "Bersama-sama kita akan sepenuhnya mendominasi belahan bumi timur!"
 tfv_australia.80.b: "Ambisi kami tidak memberi ruang bagi para petani terpencil itu!"
 tfv_australia.81.t: "[From.GetNameDefCap] Menyetujui Aliansi"
 tfv_australia.81.d: "Delegasi kami ke Jepang kembali dengan kemenangan. Kami telah menandatangani aliansi resmi dengan [JAP.GetName]. Dokumen tersebut dengan jelas mendefinisikan bidang kepentingan masing-masing negara kita, yang tidak dapat diintervensi oleh negara lain."
 tfv_australia.81.a: "[Root.GetAdjective]s dan [From.GetAdjective] di seluruh Pasifik Barat akan mendapatkan manfaat dari hal ini."
 tfv_australia.82.t: "Pemerintah [From.GetAdjective] Menolak Kemitraan!"
 tfv_australia.82.d: "Meskipun kami termasuk yang terdepan dalam kancah global, [From.GetNameDef] menolak mengakui pentingnya kami di kawasan Pasifik Barat.\nTak hanya [From.GetAdjective] yang langsung menolak kami, mereka juga menyatakan dengan tegas bahwa doktrin Nanshin-ron mungkin akan membawa mereka keluar dari Indonesia, menuju benua Australia sendiri."
 tfv_australia.82.a: "Jika mereka tidak mau mendukung kita, kita akan membuat mereka berlutut di hadapan kita."
 tfv_australia.90.t: "Kunjungan Penobatan"
 tfv_australia.90.desc: "[AST.GetLeader] telah melakukan perjalanan ke Inggris untuk mengambil bagian dalam upacara penobatan Raja George VI dan Ratu Elizabeth. Setelah beberapa minggu makan siang, makan malam, pesta kebun, resepsi, dan makan malam lainnya, dia akhirnya berhasil mendapatkan audiensi pribadi dengan Raja baru. Setelah berbasa-basi dan berbasa-basi, topik beralih ke politik, dan Raja bertanya apa yang bisa dia lakukan untuk membantu [AST.GetNameDef]."
 tfv_australia.90.a: "Minta Raja melakukan kunjungan ke Australia untuk meningkatkan semangat."
 tfv_australia.90.b: "Minta Raja untuk mendukung kampanye perekrutan."
 tfv_australia.90.c: "Mintalah Raja untuk secara terbuka mendukung pemerintah."
 tfv_australia.92.t: "Raja Edward VIII Mengunjungi Australia"
 tfv_australia.92.desc: "[AST.GetLeader] telah melakukan perjalanan ke Inggris untuk mengambil bagian dalam upacara pernikahan antara Raja Edward VIII dan Wallis Simpson. Setelah beberapa minggu makan siang, makan malam, pesta kebun, resepsi, dan makan malam lainnya, dia akhirnya berhasil mendapatkan audiensi pribadi dengan Raja baru.\n\nSetelah berbasa-basi dan berbasa-basi, topik beralih ke politik. Sang Raja mengomel panjang lebar tentang solidaritas dan kesetiaan Persemakmuran kepada negara induknya, dan ketika ia membahas politik kontinental [AST.GetLeader] mau tidak mau merasa sedikit tidak nyaman. Raja bertanya apa yang bisa dia lakukan untuk membantu [AST.GetNameDef] dan membuat dirinya disayangi oleh orang-orang di sana."
 tfv_australia.92.a: "Minta Raja melakukan kunjungan ke Australia untuk meningkatkan semangat."
 tfv_australia.92.b: "Minta Raja untuk mendukung kampanye perekrutan."
 tfv_australia.92.c: "Mintalah Raja untuk secara terbuka mendukung pemerintah."
 tfv_australia.95.t: "Nasionalis bangkit di Indonesia"
 tfv_australia.95.desc: "Agitasi Nasionalis meningkat tajam di seluruh Indonesia dalam beberapa minggu terakhir. Perkiraan intelijen mengenai jumlah simpatisan Nasionalis telah mencapai angka yang mengkhawatirkan. Yang menjadi perhatian khusus adalah laporan bahwa beberapa pemimpin Nasionalis secara terbuka mendiskusikan pemberontakan bersenjata. Baru kemarin, sebuah kapal angkatan laut mencegat sebuah kapal nelayan mencurigakan di selatan Jawa. Ditemukan di kapal ada senjata dan amunisi tanpa tanda resmi. Interogasi terhadap kru sejauh ini tidak membuahkan hasil, tetapi tampaknya seseorang mencoba menimbulkan masalah."
 tfv_australia.95.a: "Sangat meresahkan."
 tfv_australia.96.t: "Perang Saudara!"
 tfv_australia.96.desc: "Nasionalis bersenjata turun ke jalan di seluruh Indonesia. Sejauh ini tindakan militer dan polisi terhadap pemberontakan terbukti tidak berhasil. Pemberontakan bersenjata ini terjadi setelah meningkatnya sentimen Nasionalis secara tiba-tiba, yang kini berarti kita berada dalam perang saudara habis-habisan."
 tfv_australia.96.a: "Lawanlah sampah nasionalis!"
 tfv_australia.96.b: "Bergabunglah dengan pemberontakan!"
 tfv_canada.1.t: "[From.GetNameDefCap] Meminta Aliansi Amerika Utara"
 tfv_canada.1.d: "Dengan semakin selarasnya kepentingan diplomatik di seluruh benua Amerika Utara, dan semakin besarnya gejolak di Eropa, [From.GetNameDef] telah mengusulkan langkah politik yang radikal.\nDengan menandatangani pakta pertahanan bersama, kita dapat menjamin keamanan dan integritas benua Amerika, sekaligus secara signifikan memperluas pilihan politik dan militer kita dalam situasi apa pun. [From.GetLeader] menyatakan bahwa ini adalah \"pilihan yang jelas\", untuk memastikan kesejahteraan [Root.GetNameDef] serta [From.GetNameDef], dan [Root.GetLeader] tampaknya setuju bahwa sulit untuk membantah sebaliknya."
 tfv_canada.1.a: "Ini adalah strategi yang bagus. Kami akan bergabung dengan [From.GetNameDef]!"
 tfv_canada.1.b: "Kami tidak akan menerima adanya peluang untuk terseret ke dalam isu-isu di luar batas negara kami."
 tfv_canada.2.t: "Aliansi Amerika Utara Didirikan"
 tfv_canada.2.d: "Hari ini menandai penandatanganan perjanjian baru, merayakan persahabatan dan dukungan bersama antara [Root.GetNameDef] dan [From.GetNameDef]. Kedua negara kita berjanji untuk saling membantu dalam hal kebijakan luar negeri, termasuk pertahanan benua kita.\n\nDengan kerja sama negara-negara kita, para agresor asing di dunia tidak mempunyai peluang untuk melawan kita."
 tfv_canada.2.a: "Dari Laut ke Laut!"
 tfv_canada.3.t: "[From.GetNameDefCap] Menolak Aliansi Amerika Utara"
 tfv_canada.3.d: "Meskipun ada manfaat dari kerja sama militer yang diformalkan antara kedua negara kita, seperti yang dicontohkan oleh Dewan Pertahanan Gabungan, [From.GetAdjective] telah menolak perundingan kita untuk aliansi permanen.\nPakta tersebut akan menjamin integritas benua Amerika Utara, namun sekarang tampaknya kita harus mencari cara lain untuk mempertahankan tanah air."
 tfv_canada.3.a: "Kami punya pilihan lain."
 tfv_canada.10.t: "[From.GetNameDefCap] Mencari Keanggotaan di [Root.GetFactionName]"
 tfv_canada.10.d: "Setelah ditinggalkannya Persemakmuran, [From.GetNameDef] sedang bernegosiasi untuk mendapatkan posisi sebagai salah satu sekutu kita di [Root.GetFactionName]. Keyakinan Komunis mereka kuat, dan tidak dapat disangkal bahwa sekutu di benua Amerika akan memberikan manfaat besar bagi perjuangan revolusi dunia...\nMeskipun konsep mereka tentang Sosialisme Patriotik, sifat independen, dan upaya Keajaiban Industrialisasi [From.GetLeader] mungkin akan menimbulkan masalah di masa depan, tampaknya ini adalah kesempatan yang terlalu bagus untuk dilewatkan."
 tfv_canada.10.a: "Kami menyambut semua kaum revolusioner sejati dengan tangan terbuka!"
 tfv_canada.10.b: "Risikonya terlalu besar saat ini."
 tfv_canada.11.t: "Revolusi Amerika Sejati"
 tfv_canada.11.d: "Setelah membuang sisa-sisa kaum borjuis yang ditopang oleh kekerasan kolonial selama berabad-abad, kita akhirnya berhasil memasuki panggung dunia. Kami berdiri berdampingan dengan [From.GetNameDef] di [From.GetFactionName] saat kami berupaya menyebarkan revolusi dunia ke seluruh penjuru dunia!"
 tfv_canada.11.a: "Kami akan menunjukkan kepada benua ini apa sebenarnya arti revolusi!"
 tfv_canada.12.t: "[From.GetNameDefCap] Menolak Keanggotaan di [From.GetFactionName]"
 tfv_canada.12.d: "Khawatir akan dampaknya terhadap \"stabilitas global\", [From.GetLeader] secara terbuka menolak permintaan kami untuk menjadi anggota [From.GetFactionName].\nMelihat bahwa [From.GetNameDef] tidak lepas dari politik kecil di dunia lama, upaya revolusioner kami akan sia-sia.\n\nBahkan jika [Root.GetNameDef] berdiri sendiri di dunia fasisme, kita tidak akan menyerah sampai sosialisme sejati disebarkan kepada setiap pekerja di seluruh dunia!"
 tfv_canada.12.a: "Demi keadilan, pengertian, dan cara Kanada!"
 tfv_canada.20.t: "[From.GetNameDefCap] Mencari Aliansi"
 tfv_canada.20.d: "Menyusul bangkitnya nasionalisme konservatif dalam politik [From.GetAdjective], [From.GetNameDef] telah mencari sekutu baru yang benar-benar memiliki kapasitas untuk membantu tujuan mereka, dibandingkan dengan \"demokrasi\" Persemakmuran yang lemah.\n\nBermitra dengan [From.GetNameDef] tidak hanya wajar secara ideologis, namun juga akan memastikan kehadiran negara kuat yang dapat... mengejar kepentingan kita di benua Amerika Utara."
 tfv_canada.20.a: "Wajar jika [From.GetAdjective]s dan [Root.GetAdjective]s bekerja sama!"
 tfv_canada.20.b: "Kepentingan kami ada di Eropa, [From.GetNameDef] harus mempertaruhkan pendiriannya sendiri."
 tfv_canada.21.t: "Aliansi Kekuasaan"
 tfv_canada.21.d: "[From.GetNameDefCap] telah menerima tawaran aliansi kami, melihat manfaat yang jelas dalam hubungan dengan negara Amerika yang kuat.\nDengan langkah diplomatik ini kita akan jauh lebih mampu memproyeksikan kekuatan kita di Amerika Utara, dan bukan suatu kebetulan bahwa Poros Berlin-Ottawa bergerak tajam melalui London."
 tfv_canada.21.a: "Kami berdiri sebagai kekuatan global."
 tfv_canada.22.t: "Kebusukan Eropa"
 tfv_canada.22.d: "Karena tidak mampu melihat ke luar perbatasan mereka yang sangat kecil, [From.GetName] dari [From.GetLeader] telah menolak tawaran aliansi kita.\nTentu saja, dengan kemungkinan runtuhnya negara [From.GetAdjective] dan seluruh Eropa di bawah beban rakyatnya sendiri, kita mungkin akan lebih baik tanpa mereka."
 tfv_canada.22.a: "Kami akan menunjukkan kepada mereka apa arti kebesaran sebenarnya."
 tfv_canada.30.t: "Revolusi Sinarkis"
 tfv_canada.30.d: "Ketika pengaruh kaum Sinarkis semakin besar, tuntutan mereka pun semakin kuat. Tampaknya pemerintah kita tidak lagi mampu mengendalikan politik sayap kanan mereka, karena bentrokan antara kaum Sinarkis dan pendukung pemerintah dilaporkan terjadi di [Root.GetNameDef]. Hal ini termasuk penggunaan senjata mematikan di kedua belah pihak.\nMeskipun tidak jelas kapan dan bagaimana militerisasi partai Sinarkis terjadi, hal ini merupakan ancaman nyata dan langsung terhadap pemerintahan saat ini.\n\nPerang saudara sudah di depan mata."
 tfv_canada.30.a: "Dukung Nasionalis."
 tfv_canada.30.b: "Dukung Partai Republik."
 tfv_canada.30.c: "Menyerahkan kekuasaan kepada kaum Nasionalis."
 tfv_canada.40.t: "Sebuah Rencana untuk Dominasi"
 tfv_canada.40.d: "Meskipun kekuatan negara [Root.GetAdjective] yang baru saja direformasi tidak dapat disangkal, begitu pula realitas politik regionalnya. Musuh lama kita, [USA.GetNameDef], mendominasi benua ini, dan telah terbukti tidak mampu menghindari masalah di luar perbatasan mereka.\nHal ini membuat tawaran kerja sama dengan [From.GetNameDef] semakin berharga. Salah satu negara kita mungkin tidak memiliki kekuatan untuk mencegah intervensi [USA.GetAdjective] sendirian, namun terhadap utara dan selatan, [USA.GetLeader] harus berpikir dua kali sebelum mengambil tindakan.\n\nDan mungkin mereka akan lebih menerima pengembalian wilayah [Root.GetAdjective] yang sah..."
 tfv_canada.40.a: "Kami akan memeras kehidupan tetangga kami yang busuk!"
 tfv_canada.40.b: "Kita tidak bisa mengambil risiko terlihat sebagai agresor."
 tfv_canada.41.t: "Meksiko Setuju"
 tfv_canada.41.d: "Pemerintah [MEX.GetAdjective] sepenuhnya sepakat mengenai ancaman yang ditimbulkan terhadap negara kita akibat kebijakan agresif tetangga kita di wilayah selatan. Satu-satunya cara agar kita bisa bertahan adalah dengan mematahkan cengkeraman mereka di benua ini. Kita harus segera menyerang, sebelum mereka selesai mempersenjatai kembali. Konsesi teritorial tertentu harus diberikan kepada teman-teman baru kita, tentu saja, tapi bersama-sama, kita akan mengakhiri hegemoni Amerika!"
 tfv_canada.41.a: "Gedung Putih akan terbakar lagi!"
 tfv_canada.42.t: "Meksiko Menolak"
 tfv_canada.42.desc: "Pemerintah [MEX.GetAdjective] telah menolak tawaran kami untuk bekerja sama melawan musuh bersama. Mereka sepertinya percaya bahwa mereka bisa mengabaikan ular berbisa yang siap menyerang mereka, dengan harapan ular itu akan membiarkan mereka sendirian selama mereka tidak melakukan tindakan yang mengancam. Tampaknya kita harus mengandalkan pertahanan kita sendiri."
 tfv_canada.42.a: "Bodoh! Pengecut! PENGkhianat!"
 tfv_canada.50.t: "Musuh di Dalam"
 tfv_canada.50.d: "Sebuah ledakan mengguncang salah satu pabrik kami hari ini, dan walaupun awalnya tampak seperti kecelakaan industri, penyelidikan telah mengungkapkan bahwa bahan peledak sengaja ditempatkan di sepanjang jalur produksi.\nSementara kami berduka atas hilangnya nyawa, serangan terhadap upaya perang tidak dapat diabaikan.\n\nSiapa pun yang berada di balik serangan ini merupakan ancaman bagi semua [Root.GetNameDef]!"
 tfv_canada.50.a: "Kami tidak akan membiarkan musuh menjatuhkan kami!"
 tfv_canada.51.t: "Serangan Lain"
 tfv_canada.51.d: "Serangan lain terjadi di tanah [Root.GetAdjective], kali ini secara langsung menargetkan salah satu pabrik militer kita!\nProduksi telah dihentikan saat reparasi dimulai, namun pelakunya masih buron.\n\nSetidaknya sudah jelas bahwa ini adalah pekerjaan kelompok, bukan pekerjaan individu."
 tfv_canada.51.a: "Semakin besar lingkarannya, semakin mudah mereka dilacak."
 tfv_canada.52.t: "Lingkaran Quebec"
 tfv_canada.52.d: "Penegakan hukum telah bekerja sama dengan polisi militer untuk mengambil langkah besar dalam kasus sabotase pabrik yang terus berlanjut. Dengan menargetkan pabrik lain, menjadi jelas bahwa sabotase tersebut tidak dilakukan oleh mata-mata asing, melainkan oleh kelompok yang memprotes wajib militer paksa yang diberlakukan di Quebec!\n\nTerlepas dari kepentingan politik mereka, negara kita sedang berperang, dan mereka adalah pengkhianat tingkat tertinggi."
 tfv_canada.52.a: "Mereka harus dihentikan!"
 tfv_canada.53.t: "Akhir dari Garis"
 tfv_canada.53.d: "Sebuah jebakan telah dipasang untuk Lingkaran Quebec di pabrik yang dianggap sebagai target sabotase mereka berikutnya. Di tengah malam, penegak hukum menunggu para penyusup.\nSaat para penyabot tiba, ternyata mereka adalah kelompok yang jauh lebih besar dari yang diperkirakan, dan lebih bersenjata lengkap, dengan peralatan tentara curian. Baku tembak terjadi, merusak jalur produksi sebanyak yang direncanakan Lingkaran Quebec.\nNamun, setelah pertempuran sengit, tidak ada satu pun penyabot yang masih hidup. Lingkaran Quebec telah berakhir."
 tfv_canada.53.a: "Sebuah kemenangan, bukan kekalahan untuk [Root.GetNameDef]!"
 tfv_canada.60.t: "[From.GetNameDefCap] Menuntut Labrador dan Newfoundland"
 tfv_canada.60.d: "Setelah lama menyatakan keinginan untuk \"memulangkan\" wilayah jajahan Labrador dan Newfoundland sebagai bagian dari negaranya, [From.GetNameDef] kini telah mengambil langkah untuk menuntut mereka.\n[From.GetLeader] telah memperjelas bahwa [From.GetNameDef] menganggapnya sebagai tanah [From.GetAdjective], dan bahwa mereka akan \"mengambil langkah-langkah yang diperlukan untuk mencapainya\"."
 tfv_canada.60.a: "Berikan apa yang mereka inginkan, [Root.GetNameDef] tidak bisa bertengkar karena hal ini sekarang."
 tfv_canada.60.b: "Kami tidak memberikan satu inci pun tanah [ENG.GetAdjective]!"
 tfv_canada.61.t: "Takdir Terpenuhi"
 tfv_canada.61.d: "Dengan penyerahan Labrador dan Newfoundland oleh [From.GetNameDef], [Root.GetNameDef] akhirnya utuh. Benar-benar dari Laut ke Laut, setiap [Root.GetAdjective] yang sebenarnya kini berada di dalam perbatasan kita, di mana mereka berada.\nLangkah kita selanjutnya harus menjamin keselamatan dan keamanan negara [Root.GetAdjective]!"
 tfv_canada.61.a: "Garis pantai adalah satu-satunya perbatasan yang aman!"
 tfv_canada.62.t: "Keangkuhan Kekaisaran"
 tfv_canada.62.d: "Meminta \"hak kekaisaran\" mereka yang runtuh, dan menyerukan agar status Labrador dan Newfoundland sebagai milik kolonial dilindungi [From.GetNameDef] telah menolak menyerahkan tanah yang menjadi hak kami! Orang-orang ini adalah [Root.GetAdjective]s, dan Newfoundland dan Labrador memiliki sumber daya [Root.GetAdjective], tetapi mereka harus bertanggung jawab kepada master [From.GetAdjective].\nIni adalah keadaan yang tidak dapat diterima, tetapi jelas bahwa [From.GetNameDef] tidak dapat diyakinkan akan solusi diplomatik..."
 tfv_canada.62.a: "[ROOT.GetNameDefCap] akan menjadi salah satunya!"
 tfv_canada.70.t: "[FROM.GetNameDefCap] keinginan untuk Persatuan dengan Newfoundland"
 tfv_canada.70.desc: "[FROM.GetLeader] telah menghubungi kami setelah pemungutan suara yang diadakan di parlemen Kanada untuk meminta kami menandatangani revisi terhadap Undang-undang Inggris Amerika Utara yang sebelumnya, dan melalui undang-undang tersebut mendeklarasikan persatuan antara [FROM.GetNameDef] dan koloni Newfoundland dan Labrador."
 tfv_canada.70.a: "Kami tidak melihat ada salahnya dalam hal ini"
 tfv_canada.70.b: "Ya ampun tidak!"
 tfv_canada.71.t: "[FROM.GetNameDefCap] menandatangani Undang-Undang Newfoundland"
 tfv_canada.71.desc: "Teman baik kami di [FROM.GetName] telah menerima permintaan kami dan telah menandatangani usulan Undang-Undang Newfoundland, yang secara efektif menyerahkan kedaulatan atas Newfoundland dan Labrador kepada kami dalam prosesnya. Ini adalah hari yang menyenangkan bagi Kanada!"
 tfv_canada.71.a: "Luar biasa!"
 tfv_canada.72.t: "[FROM.GetNameDefCap] menolak menandatangani Deklarasi"
 tfv_canada.72.desc: "Mereka yang kami anggap sebagai teman baik kami, [FROM.GetAdjective], telah menolak usulan kami untuk bersatu dengan Newfoundland dan Labrador. Anggota parlemen dan politisi mereka yang keras kepala telah menunjukkan kepada kita posisi mereka dalam masalah ini, dan kita tahu bagaimana kita harus bertindak bersama mereka di masa depan."
 tfv_canada.72.a: "Mereka sadar kalau ini merugikan hubungan kita?"
 tfv_canada.73.t: "[CAN.GetName] Diberikan Newfoundland dan Labrador oleh Inggris"
 tfv_canada.73.desc: "Setelah menandatangani Undang-Undang Newfoundland, kedaulatan Newfoundland dan Labrador akan diserahkan kepada sekutu kita [CAN.GetNameDef]. Meskipun mereka menyatakan bahwa hal ini tidak dapat dinegosiasikan, mereka setidaknya mengakui bahwa kami harus diberikan kompensasi ekonomi karena menyerahkan basis kami di wilayah tersebut."
 tfv_canada.73.a: "Setidaknya kita mendapat kompensasi..."
 mex_nationalists_chosen: "Berpihak pada Nasionalis."
 mex_republicans_chosen: "Berpihak pada Partai Republik."
 tfv_south_africa.1.t: "[From.GetNameDefCap] Meminta Mandat Afrika"
 tfv_south_africa.1.d: "Saat kami berjuang dengan cakupan militer di seluruh Kekaisaran, [From.GetNameDef] telah menghubungi kami mengenai perjanjian administratif. Koloni kita di Afrika Selatan dan Tengah harus diserahkan kepada mereka, dengan hak dan tanggung jawab penuh terhadap pertahanan mereka."
 tfv_south_africa.1.a: "Kita perlu memfokuskan energi kita pada Eropa."
 tfv_south_africa.1.b: "Kita bisa mempertahankan koloni ini dengan baik."
 tfv_south_africa.1.c: "Koloni harus mempertahankan diri."
 tfv_south_africa.2.t: "[From.GetNameDefCap] Menyetujui"
 tfv_south_africa.2.d: "Dengan meningkatnya komitmen yang lebih dekat dengan negara asalnya, [From.GetNameDef] telah setuju bahwa koloninya di Afrika harus dikelola oleh kami untuk saat ini."
 tfv_south_africa.2.a: "Kami akan menjadi tuan yang baik hati."
 tfv_south_africa.3.t: "[From.GetNameDefCap] Menolak"
 tfv_south_africa.3.d: "Mengutip kurangnya ancaman langsung terhadap koloninya di Afrika, [From.GetNameDef] telah memperjelas bahwa mereka tidak bermaksud untuk menyerahkan administrasi kepemilikannya kepada kami."
 tfv_south_africa.3.a: "Apakah mereka tidak mempercayai kita?"
 tfv_south_africa.4.t: "Kompromi Afrika"
 tfv_south_africa.4.d: "Setelah pertimbangan panjang, pemerintah Inggris mencapai kompromi mengenai pertahanan koloni Afrika. Berdasarkan skema baru ini, koloni akan bertanggung jawab atas pertahanan mereka sendiri namun akan menikmati kebebasan yang lebih besar dalam mengatur urusan mereka sendiri."
 tfv_south_africa.4.a: "Kompromi yang bagus - tidak ada yang senang dengan hal itu."
 tfv_south_africa.10.t: "Bantuan luar negeri untuk perjuangan kita"
 tfv_south_africa.10.desc: "Perang besar demi masa depan negara kita akhirnya tiba. Sekarang kita harus mendapatkan setiap dukungan yang bisa kita peroleh untuk memastikan kita menang dalam perjuangan ini. Kelangsungan hidup budaya [From.GetAdjective] dan cara hidup kita dipertaruhkan!"
 tfv_south_africa.10.a: "Kita harus mendekati Jerman."
 tfv_south_africa.10.b: "Belanda akan membantu kita."
 tfv_south_africa.11.t: "[SAF.GetNameDefCap] meminta bantuan!"
 tfv_south_africa.11.desc: "Perjuangan dengan kekerasan telah terjadi di [From.GetName]. Saat mereka berjuang demi kelangsungan hidup mereka, mereka sangat membutuhkan dukungan apa pun yang bisa kami berikan. Ini juga akan menjadi kesempatan untuk menguji beberapa senjata baru kita dan mendapatkan sekutu yang berharga di Afrika Selatan."
 tfv_south_africa.11.a: "Kirimi mereka pesawat tempur."
 tfv_south_africa.11.b: "Kirimi mereka tank."
 tfv_south_africa.11.c: "Kirimi mereka senapan dan artileri."
 tfv_south_africa.11.e: "Mereka harus berjuang sendiri."
 tfv_south_africa.12.t: "[From.GetNameDefCap] mohon bantuan kami"
 tfv_south_africa.12.desc: "Pertempuran sengit telah terjadi di Afrika Selatan antara kaum Nasionalis dan Unionis. Karena kalah jumlah dan persenjataan, kaum Nasionalis telah meminta dukungan kepada kami, kampung halaman nenek moyang mereka."
 tfv_south_africa.12.a: "Kirimi mereka pesawat tempur."
 tfv_south_africa.12.b: "Kirimi mereka tank."
 tfv_south_africa.12.c: "Kirimi mereka senapan dan artileri."
 tfv_south_africa.12.e: "Mereka harus berjuang sendiri."
 tfv_south_africa.13.t: "Respon Jerman"
 tfv_south_africa.13.desc.a: "Delegasi kami ke [GER.GetNameDef] telah kembali dengan tangan kosong. Meskipun ada sambutan hangat dari pemerintah [GER.GetAdjective], mereka tidak dapat memperoleh komitmen dukungan yang tegas. Tampaknya kami tidak dapat lagi mengandalkan pemerintah Jerman untuk membantu perjuangan kami."
 tfv_south_africa.13.desc.b: "Mengutip kurangnya bahan yang tersedia, pemerintah [GER.GetAdjective] telah memutuskan bahwa mereka tidak lagi berkepentingan untuk mengirimkan dukungan lebih lanjut kepada kami. Segala upaya malah difokuskan pada pembangunan militer mereka sendiri. Hal ini membuat kita berada pada posisi yang sulit."
 tfv_south_africa.13.a: "Hubungi teman-teman Belanda kami."
 tfv_south_africa.13.b: "Kita akan berhasil dengan sendirinya, atau binasa dalam upaya tersebut."
 tfv_south_africa.14.t: "Respon [HOL.GetAdjective]"
 tfv_south_africa.14.desc.a: "Delegasi kami ke [HOL.GetNameDef] merasa frustrasi karena hambatan dan penundaan yang tiada henti. Pertemuan dengan pejabat [HOL.GetAdjective] dan manajer industri dibatalkan pada menit-menit terakhir, panggilan tidak dibalas, telegram tidak dijawab. Tampaknya pemerintah [HOL.GetAdjective] sebenarnya tidak tertarik untuk membantu upaya kami."
 tfv_south_africa.14.desc.b: "Meskipun ada dukungan awal, putaran terakhir negosiasi dengan pemerintah [HOL.GetAdjective] untuk peralatan baru telah gagal. Tampaknya [HOL.GetAdjective] tidak lagi bersedia menerima pembayaran dalam bentuk berlian, dengan alasan adanya masalah dalam mengubahnya menjadi mata uang yang dapat dikonversi."
 tfv_south_africa.14.a: "Hubungi teman-teman Jerman kami."
 tfv_south_africa.14.b: "Kita akan berhasil dengan sendirinya, atau binasa dalam upaya tersebut."
 tfv_south_africa.15.t: "[From.GetNameDefCap] mengirimkan peralatan"
 tfv_south_africa.15.desc.a: "Kiriman pesawat telah tiba dari Jerman. Pilot kami sangat bersemangat untuk mendapatkannya, dan persaingan yang ketat telah dimulai untuk penempatan ke skuadron baru."
 tfv_south_africa.15.desc.b: "Setelah diskusi panjang dengan teman [GER.GetAdjective] kami, mereka setuju untuk mengirimkan sejumlah tank ringan kepada kami. Meskipun jumlahnya sedikit, mereka mungkin akan memberikan keseimbangan yang menguntungkan kita."
 tfv_south_africa.15.desc.c: "Sebuah kapal dari [GER.GetNameDef] telah mencapai kami. Di dalam genggamannya mereka membawa berton-ton senapan dan beberapa senjata berat untuk para sukarelawan dari Jerman yang datang ke kami melalui cara lain."
 tfv_south_africa.15.a: "Ini akan sangat berguna."
 tfv_south_africa.15.b: "Mereka akan menjadi tulang punggung tentara kita."
 tfv_south_africa.15.c: "Dukungan mereka sangat diharapkan."
 tfv_south_africa.16.t: "[From.GetNameDefCap] mengirimkan peralatan"
 tfv_south_africa.16.desc.a: "Pengiriman pesawat telah tiba dari [HOL.GetNameDef], atas sumbangan dermawan dari beberapa tokoh terkemuka di industri penerbangan [HOL.GetAdjective]. Pilot kami sangat bersemangat untuk mendapatkannya, dan persaingan yang ketat telah dimulai untuk penempatan ke skuadron baru."
 tfv_south_africa.16.desc.b: "Setelah diskusi panjang dengan teman [HOL.GetAdjective] kami, mereka setuju untuk mengirimkan sejumlah tank ringan eksperimental kepada kami. Meskipun jumlahnya sedikit, mereka mungkin akan memberikan keseimbangan yang menguntungkan kita."
 tfv_south_africa.16.desc.c: "Sebuah kapal dari [HOL.GetNameDef] telah mencapai kami. Di dalam genggamannya mereka membawa berton-ton senapan dan beberapa senjata berat untuk para relawan dari [HOL.GetNameDef] yang datang kepada kami melalui cara lain."
 tfv_south_africa.16.a: "Ini akan sangat berguna."
 tfv_south_africa.16.b: "Mereka akan menjadi tulang punggung tentara kita."
 tfv_south_africa.16.c: "Dukungan mereka sangat diharapkan."
 tfv_south_africa.20.t: "[From.GetNameDefCap] Meminta Keanggotaan di Komintern"
 tfv_south_africa.20.d: "Revolusi telah berhasil dalam [From.GetNameDef]! Pemerintahan komunis baru telah mengambil alih negara tersebut dan berupaya menjadi anggota Komintern."
 tfv_south_africa.20.a: "Kami menyambut kawan-kawan baru kami dalam perjuangan melawan imperialisme!"
 tfv_south_africa.20.b: "Menerima keanggotaan mereka saat ini hanya akan membuka kemungkinan konflik di wilayah yang jauh."
 tfv_south_africa.21.t: "Keanggotaan Komintern disetujui"
 tfv_south_africa.21.d: "Setelah mempertimbangkan dengan cermat, Komite Sentral Komintern telah menyetujui permintaan keanggotaan kami."
 tfv_south_africa.21.a: "Berdampingan, [Root.GetNameDef] dan [From.GetFactionName] akan berbaris menuju masa depan!"
 tfv_south_africa.22.t: "Keanggotaan Komintern ditolak"
 tfv_south_africa.22.d: "Mengutip perbedaan yang tidak dapat dipecahkan antara pandangan khusus kami mengenai ajaran Marx dan interpretasi ortodoks, Komintern menolak permohonan kami. Meskipun mereka tidak menyebut kami fasis sosial atau lebih buruk lagi, mereka tetap memperjelas bahwa kami tidak dapat mengharapkan bantuan apa pun dari mereka."
 tfv_south_africa.22.a: "Mungkin merekalah yang salah?"
 tfv_south_africa.30.t: "[From.GetNameDefCap] Menuntut Madagaskar"
 tfv_south_africa.30.d: "Menyusul kekacauan di Eropa, pemerintah [From.GetAdjective] secara terbuka mempertanyakan hak kami atas kedaulatan di Madagaskar, serta kemampuan kami untuk melindungi penduduk yang tinggal di sana. Perilaku ini akhirnya melampaui sekedar retorika, dengan pemerintahan [From.GetAdjective] menuntut agar kami menyerahkan kendali atas pulau itu kepada mereka."
 tfv_south_africa.30.a: "Kami tidak punya pilihan. Ada hal-hal yang lebih penting untuk diperhatikan."
 tfv_south_africa.30.b: "Setiap meter persegi tanah [Root.GetAdjective] adalah suci. Kami tidak akan menyerah!"
 tfv_south_africa.31.t: "[From.GetNameDef] Hasil"
 tfv_south_africa.31.d: "Pemerintah [From.GetAdjective] telah dengan bijaksana memutuskan untuk mengizinkan pendudukan damai kami di Madagaskar."
 tfv_south_africa.31.a: "Satu langkah lagi untuk membongkar sistem kolonialisme imperialis!"
 tfv_south_africa.32.t: "[From.GetAdjective] Menolak"
 tfv_south_africa.32.d: "Pemerintahan [From.GetAdjective] dengan keras kepala menolak untuk membahas masalah penyerahan Madagaskar kepada kami. Menurut perwakilan mereka, mereka menganggap diri mereka lebih dari mampu, bersedia dan siap mempertahankan pulau tersebut."
 tfv_south_africa.32.a: "Maka kita harus menggunakan kekerasan."
 tfv_south_africa.32.b: "Biarkan mereka menyimpan sepetak tanah yang tidak berharga itu."
 tfv_south_africa.40.t: "Perjanjian penelitian dengan [From.GetNameDef]"
 tfv_south_africa.40.d: "Menyusul keberhasilan misi militer ke [From.GetNameDef], pemerintah mereka telah menyarankan perjanjian penelitian formal antara kedua negara."
 tfv_south_africa.40.a: "Kami akan dengan senang hati menawarkan bantuan apa pun yang kami bisa."
 tfv_south_africa.40.b: "Memberikan rahasia kita kepada mereka akan membahayakan keamanan nasional kita."
 tfv_south_africa.41.t: "[SOV.GetNameDefCap] Setuju"
 tfv_south_africa.41.d: "Soviet telah setuju untuk membiarkan kita mempelajari cara dan metode mereka. Sejumlah ilmuwan [SOV.GetAdjective] telah tiba untuk mengajar di sekolah dan universitas kita."
 tfv_south_africa.41.a: "Belajar dari [SOV.GetNameDef] berarti belajar dari para pemenang sejarah!"
 tfv_south_africa.42.t: "[SOV.GetNameDefCap] Menolak"
 tfv_south_africa.42.d: "Setelah beberapa putaran perundingan, delegasi dari [SOV.GetNameDef] keluar, dengan alasan keraguan mengenai kemampuan kami menjaga rahasia penelitian mereka. Tampaknya kita tidak diperbolehkan berbagi teknologi dengan sekutu kita."
 tfv_south_africa.42.a: "Sangat disayangkan."
 tfv_south_africa.50.t: "Dukungan untuk Spanyol"
 tfv_south_africa.50.d: "Pertikaian telah terjadi di Spanyol antara pemerintah Nasionalis dan pemerintah Republik yang sah. Ada banyak perdebatan di antara masyarakat tentang posisi pemerintah kita."
 tfv_south_africa.50.a: "Mungkin beberapa tentara kita tertarik berlibur ke Spanyol?"
 tfv_south_africa.50.b: "Jika masyarakat ingin ikut berjuang, kami tidak akan menghentikan mereka."
 tfv_south_africa.50.c: "Mengapa kita harus berperang di belahan dunia lain?"
 tfv_south_africa.51.t: "Relawan dari Afrika Selatan tiba"
 tfv_south_africa.51.d: "Meskipun pemerintah [SAF.GetAdjective] secara resmi belum berkomitmen, pemerintah telah mengizinkan sejumlah besar warganya untuk bergabung dengan gerakan kami sebagai sukarelawan."
 tfv_south_africa.51.a: "Selamat datang."
 tfv_south_africa.52.t: "Relawan dari Perang Saudara Spanyol kembali"
 tfv_south_africa.52.d: "Dengan berakhirnya pertempuran di Spanyol, para sukarelawan perang yang selamat telah pulang ke rumah. Mereka membawa serta pengalaman berharga tentang peperangan modern."
 tfv_south_africa.52.a: "Mereka akan membantu kita dalam perang berikutnya."
 tfv_south_africa.60.t: "Kebebasan untuk Angola"
 tfv_south_africa.60.d: "Setelah terbebas dari cengkeraman penjajah kolonial, masyarakat [ANG.GetName] siap menentukan nasibnya sendiri. Mereka telah membentuk pemerintahan sementara dan merancang konstitusi. Satu-satunya yang tersisa adalah mengalihkan wewenang dari gubernur militer kita ke pemerintahan [ANG.GetAdjective] yang baru."
 tfv_south_africa.60.a: "Negara baru mana pun harus dibimbing dengan hati-hati, jika tidak maka kontra-revolusi akan berhasil!"
 tfv_south_africa.60.b: "Kami menyambut mereka dengan tangan terbuka!"
 tfv_south_africa.60.c: "Situasi saat ini belum memungkinkan."
