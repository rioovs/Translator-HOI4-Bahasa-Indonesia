 basic_heavy_tank_chassis: "Tank Berat Dasar"
 basic_heavy_tank_chassis_desc: "Analisis mendalam dari Perang Besar membuktikan perlunya kendaraan berat untuk menerobos garis parit musuh dan membuka jalan bagi pasukan yang lebih ringan untuk memanfaatkan penerobosan tersebut. Kendaraan semacam itu harus bersenjata berat dan berlapis baja tebal, meski tidak harus bergerak sangat cepat."
 basic_heavy_tank_chassis_short: "Berat 1934"
 improved_heavy_tank_chassis: "Tank Berat Ditingkatkan"
 improved_heavy_tank_chassis_desc: "Kendati corak peperangan telah berubah, tetap ada tempat bagi kendaraan berat berlapis baja tebal untuk menciptakan penerobosan di garis musuh atau memperkuat pertahanan dari serangan lawan."
 improved_heavy_tank_chassis_short: "Berat 1940"
 advanced_heavy_tank_chassis: "Tank Berat Mutakhir"
 advanced_heavy_tank_chassis_desc: "Dengan kemajuan dalam teknologi lapis baja dan daya tembak, tank modern membutuhkan lapisan baja tebal dan meriam besar agar tetap efektif. Hal ini memerlukan kendaraan bertubuh besar."
 advanced_heavy_tank_chassis_short: "Berat 1943"
 heavy_tank_chassis_desc: "Sasis besar yang dapat memuat meriam berat, lapis baja tebal, atau keduanya."
