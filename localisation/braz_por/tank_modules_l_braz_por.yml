 main_battle_tank_chassis: "Tank Tempur Utama Modern"
 modern_tank_chassis: "Tank Modern"
 modern_tank_chassis_desc: "Sasis modern yang mengadopsi banyak rancangan tank sedang sebelumnya, namun memberikan penekanan lebih besar pada kecepatan dan kemampuan manuver, serta memungkinkan lapis baja yang lebih tebal dan meriam yang lebih besar daripada tank sedang biasa. Hasilnya adalah kendaraan yang dapat mengisi berbagai macam peran tempur."
 main_battle_tank_chassis_desc: "Pengalaman membuktikan bahwa desain tank ringan, sedang, dan berat semakin berkonvergensi. Tank berat menjadi semakin lincah, sementara tank ringan membawa persenjataan dan lapis baja yang lebih berat untuk bertahan hidup. Karena itu, sangat bernilai untuk menyatukan ketiga desain menjadi satu tipe universal: Tank Tempur Utama (Main Battle Tank)."
 modern_tank_chassis_1: "Tank Modern"
 modern_tank_artillery_chassis: "Artileri Swagerak Modern"
 modern_tank_artillery_chassis_desc: "Kendaraan modern yang dirancang sebagai artileri fungsional penuh yang dapat mengimbangi pergerakan tank modern dan terlindung dari berbagai ancaman di medan perang."
 modern_tank_artillery_chassis_1: "Artileri Swagerak Modern"
 modern_tank_destroyer_chassis_desc: "Kendaraan modern yang dimaksudkan untuk memberikan respons cepat terhadap serangan tank musuh, dengan tingkat perlindungan lapis baja yang sebanding."
 modern_tank_destroyer_chassis_1: "Penghancur Tank Modern"
 modern_tank_destroyer_chassis: "Penghancur Tank Modern"
 modern_tank_aa_chassis_desc: "Kendaraan modern yang dimaksudkan untuk memberikan pertahanan bergerak dan terlindung rapat dari serangan udara musuh."
 modern_tank_aa_chassis_1: "Anti-Udara Swagerak Modern"
