 basic_medium_tank_chassis_desc: "Meskipun tank ringan menjadi tulang punggung formasi mekanis pada masa lalu, potensi perkembangannya mulai mencapai batas. Kita membutuhkan kendaraan yang lebih besar dengan tetap mempertahankan tingkat mobilitas tinggi."
 improved_medium_tank_chassis: "Tank Sedang Ditingkatkan"
 improved_medium_tank_chassis_short: "Sedang 1940"
 improved_medium_tank_chassis_desc: "Berdasarkan pengalaman generasi tank sedang sebelumnya, desain baru dengan daya angkut lebih besar sangat diperlukan agar tetap relevan di garis depan."
 advanced_medium_tank_chassis: "Tank Sedang Mutakhir"
 advanced_medium_tank_chassis_short: "Sedang 1943"
 advanced_medium_tank_chassis_desc: "Pertumbuhan bobot persenjataan dan ketebalan lapis baja menuntut sasis yang lebih besar, menghasilkan kendaraan seukuran tank berat masa-masa awal."
 medium_tank_chassis_desc: "Sasis berukuran sedang yang seimbang, menawarkan fleksibilitas tinggi untuk membangun beragam jenis kendaraan tempur."
