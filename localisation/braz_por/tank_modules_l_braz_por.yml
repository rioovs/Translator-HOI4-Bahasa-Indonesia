 super_heavy_tank_chassis: "Tank Super Berat"
 super_heavy_tank_chassis_desc: "Kendaraan raksasa yang mampu memasang lapis baja paling tebal dan meriam terbesar, namun konsekuensinya cukup lambat dan kurang andal."
