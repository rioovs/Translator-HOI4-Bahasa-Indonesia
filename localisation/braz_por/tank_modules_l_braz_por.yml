 amphibious_tank_chassis: "Tank Amfibi"
 amphibious_tank_chassis_desc: "Lambung tank kecil yang dirancang khusus untuk mengapung. Untuk mencapai hal ini, batasan ketat harus diterapkan pada ukuran senjata dan ketebalan lapis baja yang dibawa kendaraan."
 amphibious_tank_chassis_1: "Tank Amfibi"
 gwtank_chassis: "Pengembangan Tank Antar-Perang"
 gwtank_chassis_desc: "Tank telah membuktikan dirinya sebagai senjata ampuh dalam Perang Besar. Walau pengembangannya sempat melambat pada tahun-tahun berikutnya, tank dipastikan akan memainkan peran utama dalam perang-perang mendatang."
 armor_tech_1: "Perlindungan Lapis Baja Dasar"
 armor_tech_1_desc: "Tank selama Perang Besar hanya perlu menghadapi senjata ringan musuh, sehingga cukup menggunakan lapis baja tipis. Senjata anti-tank generasi baru menjadikan medan perang jauh lebih berbahaya bagi tank, dan perlindungan yang jauh lebih tebal sangat dibutuhkan."
 armor_tech_2: "Perlindungan Lapis Baja Ditingkatkan"
 armor_tech_2_desc: "Dengan senjata anti-tank yang semakin berat dikerahkan di seluruh dunia, generasi tank berikutnya akan membutuhkan perlindungan yang lebih kuat."
 armor_tech_3: "Perlindungan Lapis Baja Mutakhir"
 armor_tech_3_desc: "Meskipun batas kemampuan meriam anti-tank tarik kemungkinan telah tercapai, generasi tank baru akan membawa persenjataan lebih canggih yang mampu menembus perlindungan saat ini pada jarak jauh."
 armor_tech_4: "Perlindungan Lapis Baja Modern"
 armor_tech_4_desc: "Selama perang, ancaman yang dihadapi tank berlipat ganda, mulai dari tank musuh, meriam anti-tank, penghancur tank khusus, hingga senjata infanteri modern berhulu ledak terarah yang mampu menembus lapis baja tebal. Kita harus mengembangkan metode perlindungan baru agar tank kita tetap bertahan menghadapi ancaman ini."
 engine_tech_1: "Mesin Dasar"
 engine_tech_1_desc: "Bila tank Perang Besar bergerak lamban dan berat, tank modern sangat mengandalkan kecepatan dan kelincahan gerak untuk meraih kemenangan."
 engine_tech_2: "Mesin Ditingkatkan"
 engine_tech_2_desc: "Dengan meriam yang lebih besar dan lapis baja yang lebih tebal, generasi tank baru membutuhkan mesin yang lebih bertenaga agar tetap lincah."
 engine_tech_3: "Mesin Mutakhir"
 engine_tech_3_desc: "Peperangan mekanis menuntut pengambilan keputusan cepat serta pergerakan pasukan dan logistik yang gesit. Jika tank kita ingin membawa senjata modern dan lapis baja tebal untuk bertahan hidup, mereka membutuhkan mesin bertenaga besar untuk mengimbangi infanteri bermotor."
 engine_tech_4: "Mesin Modern"
 engine_tech_4_desc: "Berbagai penambahan fitur modern pada tank telah meningkatkan bobot kendaraan secara substansial. Untuk menggerakkan massa seberat itu, kita membutuhkan mesin dengan tenaga yang sangat besar."
 DESIGNER_CHASSIS_BASE: "Sasis:"
 DESIGNER_FROM_MODULES: "Modul:"
 DESIGNER_UNSAVED_CHANGES: "Perubahan belum disimpan:"
 tank_rocket_launcher: "Peluncur Roket"
 tank_rocket_launcher_desc: "Peluncur multi-laras untuk roket berdaya ledak tinggi tanpa kendali. Volume tembakan yang tinggi memberikan kinerja sangat baik terhadap sasaran lunak, namun tembakan langsung sekalipun berdampak kecil terhadap target lapis baja tebal."
 tank_rocket_launcher_2: "Peluncur Roket Ditingkatkan"
 tank_rocket_launcher_2_desc: "Meskipun terdapat sejumlah peningkatan akurasi, keuntungan utama dari peluncur roket yang ditingkatkan ini adalah kapasitas roket yang lebih banyak untuk ditembakkan ke arah musuh."
 tank_wheeled_suspension: "Suspensi Beroda"
 tank_wheeled_suspension_desc: "Berasal dari sasis truk, suspensi ini sangat terbatas daya angkutnya dan memiliki kemampuan lintas medan yang terbatas, namun memiliki keunggulan biaya pembuatan yang sangat murah."
 tank_half_track_suspension: "Suspensi Half-track"
 tank_half_track_suspension_desc: "Hibrida antara kendaraan beroda rantai penuh dan suspensi beroda biasa, susunan ini memiliki sepasang roda depan untuk kemudi dan poros belakang beroda rantai untuk meningkatkan kinerja lintas medan. Meski kapasitas muatnya terbatas, biaya pembuatannya tetap lebih murah daripada desain rantai penuh."
 squeezebore_adaptor: "Adaptor Squeeze-bore"
 squeezebore_adaptor_desc: "Adaptor khusus di ujung laras mempersempit diameter laras dan memeras proyektil ke kaliber yang lebih kecil. Hal ini secara signifikan meningkatkan kecepatan laras dan daya tembus meriam, namun membutuhkan amunisi khusus dari bahan langka."
 armor_skirts: "Rok Pelindung Baja"
 armor_skirts_desc: "Rangkaian pelat logam tipis yang dipasang di sisi samping kendaraan, memberikan perlindungan ekstra terhadap senapan anti-tank dan hulu ledak terarah (shaped charges)."
 dozer_blade: "Bilah Buldoser"
 dozer_blade_desc: "Bilah buldoser memungkinkan kendaraan membangun posisi tempur lapangan secara mandiri dengan cepat tanpa bantuan pasukan zeni."
 auto_loader: "Pengisi Otomatis (Autoloader)"
 auto_loader_desc: "Mekanisme otomatis yang mengisi proyektil dan memungkinkan tank mempertahankan laju tembakan tinggi dalam jangka waktu yang lama."
 easy_maintenance: "Perawatan Mudah"
 easy_maintenance_desc: "Pintu palka di sekeliling kendaraan memberikan akses mudah ke berbagai komponen penting, memungkinkan awak melakukan pemeliharaan bahkan yang rumit sekalipun secara efisien."
 additional_machine_guns: "Senapan Mesin Tambahan"
 additional_machine_guns_desc: "Pemasangan senapan mesin tambahan pada sponson atau dudukan putar memberikan pertahanan ekstra terhadap serangan infanteri jarak dekat."
