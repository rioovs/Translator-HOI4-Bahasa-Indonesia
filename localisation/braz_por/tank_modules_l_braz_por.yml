 light_flame_tank: "Kompi Tank Penyembur Api Ringan"
 light_flame_tank_desc: "Kompi kendaraan ringan berpenyembur api untuk memberikan bantuan tembakan dalam menyerbu perkotaan dan perbentengan."
 medium_flame_tank: "Kompi Tank Penyembur Api Sedang"
 medium_flame_tank_desc: "Kompi kendaraan sedang berpenyembur api untuk memberikan bantuan tembakan dalam menyerbu perkotaan dan perbentengan."
 heavy_flame_tank: "Kompi Tank Penyembur Api Berat"
 heavy_flame_tank_desc: "Kompi kendaraan berat berpenyembur api untuk memberikan bantuan tembakan dalam menyerbu perkotaan dan perbentengan."
 light_tank_amphibious_chassis_desc: "Tank ringan yang dilengkapi dengan perangkat pelampung dan baling-baling."
 medium_tank_amphibious_chassis_desc: "Tank sedang yang dilengkapi dengan perangkat pelampung dan baling-baling."
 heavy_tank_amphibious_chassis_desc: "Tank berat yang dilengkapi dengan perangkat pelampung dan baling-baling."
 expanded_fuel_tank: "Tong Bahan Bakar"
 expanded_fuel_tank_desc: "Tong bahan bakar eksternal yang dipasang untuk memperjauh jangkauan operasional kendaraan lapis baja."
 land_cruiser_chassis: "Sasis Penjelajah Darat"
 land_cruiser_chassis_desc: "Sasis raksasa berlapis baja sangat tebal yang dirancang untuk membawa persenjataan super berat dan menahan gempuran dahsyat di medan tempur, namun boros bahan bakar dan bergerak sangat lambat karena bobotnya yang luar biasa."
