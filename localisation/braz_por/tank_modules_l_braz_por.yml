 lc_heavy_naval_guns: "Meriam Laut Kaliber Berat"
 lc_heavy_naval_guns_desc: "Persenjataan utama standar untuk kendaraan lapis baja raksasa ini, meriam kelas kapal perang bertenaga besar ini disesuaikan untuk konfrontasi langsung, melancarkan daya tembak dahsyat terhadap sasaran lapis baja dan benteng pertahanan."
 lc_super_heavy_railway_gun: "Meriam Rel Kereta Super Berat"
 lc_super_heavy_railway_gun_desc: "Meriam raksasa ini, yang awalnya dirancang untuk platform rel kereta api, mampu membombardir target dari jarak ekstrem dengan daya rusak tak tertandingi."
 lc_high_impact_obliterator_cannon: "Meriam Penghancur Berdaya Pukul Tinggi"
 lc_high_impact_obliterator_cannon_desc: "Dirancang khusus untuk menembus lapis baja super tebal, energi kinetik tinggi senjata ini menjadikannya penangkal ampuh dalam menghadapi tank super berat lainnya."
 lc_heavy_anti_air_platform: "Platform Anti-Udara Kaliber Berat"
 lc_heavy_anti_air_platform_desc: "Platform yang memuat beberapa meriam flak kaliber besar, dirancang untuk bertahan dari pesawat pengebom dan intai musuh yang mengancam Land Cruiser."
 lc_medium_naval_guns: "Meriam Laut Kaliber Sedang"
 lc_medium_naval_guns_desc: "Menawarkan kombinasi seimbang antara laju tembakan dan daya hancur, meriam ini efektif untuk menghadapi kendaraan yang lebih ringan dan memberikan bantuan tembakan terhadap sasaran tanpa lapis baja."
 lc_hull_mounted_railway_gun: "Meriam Rel Tertanam di Lambung"
 lc_hull_mounted_railway_gun_desc: "Meriam rel kereta yang dipasang langsung ke dalam lambung demi stabilitas maksimal, memberikan bantuan tembakan berat dan dapat mengenai sasaran jauh dengan presisi tinggi."
 lc_super_heavy_howitzer: "Howitzer Super Berat"
 lc_super_heavy_howitzer_desc: "Howitzer raksasa yang dirancang untuk menghancurkan perbentengan dan pertahanan perkotaan. Varian ini mengkhususkan diri meluncurkan proyektil berdaya ledak masif, ideal untuk melumat posisi perkubuan dan meruntuhkan struktur kokoh."
 lc_heavy_high_velocity_cannons: "Meriam Kecepatan Tinggi Kaliber Berat"
 lc_heavy_high_velocity_cannons_desc: "Meriam anti-tank yang dirancang untuk menghadapi dan menghancurkan kendaraan lapis baja musuh dengan akurasi tinggi. Proyektil berkecepatan tinggi memastikan penetrasi luar biasa pada jarak jauh."
 lc_heavy_anti_air_battery: "Baterai Anti-Udara Kaliber Berat"
 lc_heavy_anti_air_battery_desc: "Baterai pertahanan udara dengan meriam berkaliber besar untuk menarget pesawat berkecepatan tinggi dan berketinggian tinggi, menciptakan kubah pertahanan di sekitar kendaraan."
 lc_medium_cannon_turret: "Meriam Koaksial Kaliber Sedang"
 lc_medium_cannon_turret_desc: "Meriam kubah standar yang mampu menghadapi infanteri dan kendaraan ringan. Desainnya yang ringkas membuatnya serbaguna untuk pertempuran jarak dekat dan peran sekunder."
 lc_assault_gun: "Meriam Serbu"
 lc_assault_gun_desc: "Dirancang untuk pertempuran perkotaan jarak dekat dan penghancur bungker. Senjata ini menembakkan proyektil berdaya ledak tinggi untuk membersihkan infanteri dan sasaran yang diperkeras."
 lc_high_velocity_cannon_turret: "Meriam Koaksial Kecepatan Tinggi"
 lc_high_velocity_cannon_turret_desc: "Kubah yang dilengkapi meriam kecepatan tinggi untuk melawan kendaraan lapis baja musuh. Ukurannya yang lebih kecil memungkinkannya memberikan bantuan tembakan cepat dan responsif terhadap ancaman lapis baja yang lebih ringan."
 lc_light_anti_air_battery: "Baterai Anti-Udara Ringan"
 lc_light_anti_air_battery_desc: "Baterai anti-udara ringan yang dirancang untuk menarget pesawat terbang rendah dan melindungi kendaraan dari serangan berondongan peluru (strafing) dan pengebom tukik."
 lc_flamethrower_turret: "Gugusan Penyembur Api"
 lc_flamethrower_turret_desc: "Kubah khusus yang menyemburkan aliran api, sempurna untuk membersihkan posisi pertahanan, infanteri, dan titik penyergapan. Sangat ideal untuk pertempuran jarak dekat di lingkungan perkotaan yang padat."
 lc_rocket_launcher: "Peluncur Roket"
 lc_rocket_launcher_desc: "Sistem roket modular yang dipasang pada Land Cruiser, melancarkan rentetan roket mematikan untuk menekan pertahanan musuh dan melumpuhkan formasi besar."
 lc_radio_1: "$tank_radio_1$"
 lc_radio_1_desc: "$tank_radio_1_desc$"
 lc_radio_2: "$tank_radio_2$"
 lc_radio_2_desc: "$tank_radio_2_desc$"
 lc_radio_3: "$tank_radio_3$"
 lc_radio_3_desc: "$tank_radio_3_desc$"
 lc_command_center: "Pusat Komando"
 lc_command_center_desc: "Pusat komando terintegrasi penuh yang mengubah Land Cruiser menjadi markas bergerak, dilengkapi dengan sistem komunikasi canggih untuk mengoordinasikan operasi militer skala besar."
 lc_radar: "Radar"
 lc_radar_desc: "Sistem deteksi dini yang meningkatkan kewaspadaan terhadap pesawat musuh dan pasukan sekitar, memungkinkan Land Cruiser mempersiapkan diri menghadapi potensi ancaman udara maupun darat."
 lc_aircraft_catapult: "Ketapel Peluncur Pesawat"
 lc_aircraft_catapult_desc: "Sistem peluncur untuk pesawat pengintai kecil, memungkinkan Land Cruiser mengintai area jauh dan memberikan intelijen medan perang waktu nyata."
 lc_helipad: "Landasan Helikopter (Helipad)"
 lc_helipad_desc: "Platform peluncur helikopter, dirancang untuk menyediakan pengintaian udara tingkat lanjut dan meningkatkan kesadaran situasi di medan pertempuran."
 lc_armored_skirts: "Rok Pelindung Baja"
 lc_armored_skirts_desc: "Pelat lapis baja yang diperkuat dipasang di sepanjang sisi untuk melindungi rantai roda dan sistem suspensi yang rentan dari tembakan senjata anti-tank dan senjata ringan."
 lc_bunker_emplacement: "Kedudukan Bungker"
 lc_bunker_emplacement_desc: "Struktur pertahanan internal berbenteng yang mengubah Land Cruiser menjadi bungker bergerak. Memungkinkan awak mempertahankan posisi defensif dan membalas tembakan musuh bahkan di bawah hujan peluru yang hebat."
 lc_obstacle_clearance_gear: "Peralatan Pembersih Rintangan"
 lc_obstacle_clearance_gear_desc: "Perlengkapan tugas berat, seperti bilah buldoser raksasa dan derek, dirancang untuk membersihkan puing-puing, membuka jalur melalui medan sulit, dan membantu operasi perbentengan."
 lc_internal_fuel_tanks: "Tangki Bahan Bakar Internal"
 lc_internal_fuel_tanks_desc: "Kompartemen bahan bakar yang diperluas di dalam lambung, meningkatkan jangkauan operasional kendaraan dan mengurangi kebutuhan pengisian bahan bakar berkala selama kampanye berkepanjangan."
 lc_internal_ammunition_compartments: "Kompartemen Amunisi Internal"
 lc_internal_ammunition_compartments_desc: "Area penyimpanan amunisi yang diperkuat untuk membawa pasokan amunisi tambahan, memungkinkan Land Cruiser bertahan dalam pertempuran berkepanjangan tanpa pasokan ulang."
 lc_wet_ammunition_storage: "Penyimpanan Amunisi Basah"
 lc_wet_ammunition_storage_desc: "Kompartemen khusus yang diisi dengan cairan pendingin untuk meminimalkan risiko detonasi amunisi akibat tembakan musuh, secara signifikan meningkatkan keselamatan awak."
 lc_smoke_generators: "Generator Asap"
 lc_smoke_generators_desc: "Sistem yang dirancang untuk menggelar tabir asap tebal, menyamarkan pergerakan kendaraan dan mengurangi visibilitasnya terhadap ancaman darat maupun udara."
 lc_stabilizers: "Stabilisator"
 lc_stabilizers_desc: "Perangkat mekanis yang meredam tolak balik dan menjaga kelurusan laras meriam saat menembak, memungkinkan pembidikan ulang sasaran lebih cepat dan tembakan lebih akurat saat berhenti sejenak."
