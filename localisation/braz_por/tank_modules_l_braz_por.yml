 ### EQUIPMENT MODULES ###
 tank_gasoline_engine: "Mesin Bensin"
 tank_gasoline_engine_desc: "Mesin berbahan bakar bensin akan lebih cepat untuk ukuran mesin tertentu, namun bahan bakarnya jauh lebih rentan terbakar."
 tank_diesel_engine: "Mesin Diesel"
 tank_diesel_engine_desc: "Mesin berbahan bakar solar (diesel) lebih andal daripada mesin bensin, namun tidak secepat itu untuk ukuran mesin yang sama."
 tank_petrol_electric_engine: "Mesin Bensin-Listrik"
 tank_petrol_electric_engine_desc: "Kombinasi mesin berbahan bakar bensin yang menyediakan daya ke motor listrik. Kompleks, mahal, dan kurang andal, namun menawarkan kinerja tak tertandingi dalam pergerakan taktis."
 tank_gas_turbine_engine: "Turbin Gas"
 tank_gas_turbine_engine_desc: "Turbin yang dikembangkan dari mesin jet. Konsumsi bahan bakar tinggi, namun menghasilkan kecepatan tertinggi di antara mesin mana pun pada ukuran mesin tertentu."
 tank_riveted_armor: "Lapis Baja Keling"
 tank_riveted_armor_desc: "Pelat lapis baja dibaut ke rangka dan disatukan oleh paku keling pada tepinya. Teknologi yang sangat teruji dan cukup murah, namun tepi sambungan paku keling menjadi titik lemah dan dapat mencederai awak jika terkena hantaman."
 tank_cast_armor: "Lapis Baja Tuang"
 tank_cast_armor_desc: "Seluruh sasis, termasuk pelindung lapis baja, dicetak/dituang sebagai satu kesatuan utuh. Proses yang mahal dan memakan waktu namun memungkinkan lapis baja yang jauh lebih tebal dengan titik lemah yang lebih sedikit."
 tank_welded_armor: "Lapis Baja Las"
 tank_welded_armor_desc: "Pelat lapis baja dilas ke sasis. Proses yang lebih cepat daripada penuangan, sembari tetap memberikan perlindungan yang sangat baik."
 NOR_tank_rikstanken_armor: "Lapis Baja Darurat"
 NOR_tank_rikstanken_armor_desc: "Dibuat dari lembaran besi alih-alih baja untuk menghemat biaya. Lebih baik daripada tanpa lapis baja sama sekali... mungkin."
 tank_torsion_bar_suspension: "Batang Torsi"
 tank_torsion_bar_suspension_desc: "Sistem suspensi yang cukup andal berupa batang logam yang dipasang pada sasis kendaraan yang memberikan kenyamanan berkendara lebih halus dibandingkan jenis suspensi lainnya."
 tank_christie_suspension: "Suspensi Christie"
 tank_christie_suspension_desc: "Dikembangkan oleh penemu Amerika, suspensi ini memungkinkan pergerakan dengan kecepatan sangat tinggi."
 tank_bogie_suspension: "Suspensi Bogie"
 tank_bogie_suspension_desc: "Jenis suspensi sederhana dan cukup murah di mana roda jalan dipasang secara terpisah, memungkinkan perbaikan atau penggantian dengan mudah jika rusak."
 tank_interleaved_suspension: "Roda Jalan Bersilangan"
 tank_interleaved_suspension_desc: "Dengan menumpuk roda jalan secara bersilangan, lebih banyak roda dapat dimuat dalam panjang lambung yang sama, sehingga meningkatkan mobilitas serta memberikan perlindungan tambahan pada sisi lambung."
 tank_light_one_man_tank_turret: "Kubah Satu Awak"
 tank_light_one_man_tank_turret_desc: "Kubah kecil yang nyaris tidak cukup untuk menampung satu awak, yang bertugas membidik dan mengisi amunisi senjata utama sekaligus mengawasi target dan ancaman musuh."
 tank_light_two_man_tank_turret: "Kubah Dua Awak"
 tank_light_two_man_tank_turret_desc: "Kubah yang memungkinkan dua awak berbagi tugas mengoperasikan persenjataan dan mengamati situasi medan. Hal ini tetap belum memberikan pembagian kerja yang efektif di antara awak."
 tank_light_three_man_tank_turret: "Kubah Tiga Awak"
 tank_light_three_man_tank_turret_desc: "Kubah yang cukup besar bagi tiga awak untuk membagi tugas mengisi amunisi, membidik persenjataan utama, dan mempertahankan kesadaran situasional di sekitar mereka."
 tank_light_fixed_superstructure_turret: "Kasemat Tetap Ringan"
 tank_light_fixed_superstructure_turret_desc: "Kasemat (suprastruktur tetap) hanya memungkinkan senjata utama berputar dalam sudut sempit tanpa memutar seluruh kendaraan. Namun, ini memungkinkan kendaraan membawa meriam lebih besar dengan ukuran keseluruhan yang lebih kecil, sangat cocok untuk penyergapan."
 tank_medium_one_man_tank_turret: "Kubah Satu Awak"
 tank_medium_one_man_tank_turret_desc: "Kubah kecil yang nyaris tidak cukup untuk menampung satu awak, yang bertugas membidik dan mengisi amunisi senjata utama sekaligus mengawasi target dan ancaman musuh."
 tank_medium_two_man_tank_turret: "Kubah Dua Awak"
 tank_medium_two_man_tank_turret_desc: "Kubah yang memungkinkan dua awak berbagi tugas mengoperasikan persenjataan dan mengamati situasi medan. Hal ini tetap belum memberikan pembagian kerja yang efektif di antara awak."
 tank_medium_three_man_tank_turret: "Kubah Tiga Awak"
 tank_medium_three_man_tank_turret_desc: "Kubah yang cukup besar bagi tiga awak untuk membagi tugas mengisi amunisi, membidik persenjataan utama, dan mempertahankan kesadaran situasional di sekitar mereka."
 tank_medium_fixed_superstructure_turret: "Kasemat Tetap Sedang"
 tank_medium_fixed_superstructure_turret_desc: "Kasemat (suprastruktur tetap) hanya memungkinkan senjata utama berputar dalam sudut sempit tanpa memutar seluruh kendaraan. Namun, ini memungkinkan kendaraan membawa meriam lebih besar dengan ukuran keseluruhan yang lebih kecil, sangat cocok untuk penyergapan."
 tank_heavy_two_man_tank_turret: "Kubah Dua Awak"
 tank_heavy_two_man_tank_turret_desc: "Kubah yang memungkinkan dua awak berbagi tugas mengoperasikan persenjataan dan mengamati situasi medan. Hal ini tetap belum memberikan pembagian kerja yang efektif di antara awak."
 tank_heavy_three_man_tank_turret: "Kubah Tiga Awak"
 tank_heavy_three_man_tank_turret_desc: "Kubah yang cukup besar bagi tiga awak untuk membagi tugas mengisi amunisi, membidik persenjataan utama, dan mempertahankan kesadaran situasional di sekitar mereka."
 tank_heavy_fixed_superstructure_turret: "Kasemat Tetap Berat"
 tank_heavy_fixed_superstructure_turret_desc: "Kasemat (suprastruktur tetap) hanya memungkinkan senjata utama berputar dalam sudut sempit tanpa memutar seluruh kendaraan. Namun, ini memungkinkan kendaraan membawa meriam lebih besar dengan ukuran keseluruhan yang lebih kecil, sangat cocok untuk penyergapan."
 tank_super_heavy_four_man_tank_turret: "Kubah Empat Awak"
 tank_super_heavy_four_man_tank_turret_desc: "Kubah masif dengan ruang tambahan bagi juru isi kedua untuk melayani meriam utama yang sangat besar."
 tank_super_heavy_three_man_tank_turret: "Kubah Tiga Awak"
 tank_super_heavy_three_man_tank_turret_desc: "Kubah yang cukup besar bagi tiga awak untuk membagi tugas mengisi amunisi, membidik persenjataan utama, dan mempertahankan kesadaran situasi di sekitar mereka."
 tank_modern_tank_turret: "Kubah Modern"
 tank_modern_tank_turret_desc: "Kubah dengan tata letak yang dirancang sangat baik memungkinkan tiga awak mengoperasikan persenjataan utama secara efisien dan memantau lingkungan sekitar."
 tank_heavy_machine_gun: "Senapan Mesin Berat"
 tank_heavy_machine_gun_desc: "Senapan mesin memberikan kemampuan anti-infanteri yang lumayan dengan biaya rendah. Bahkan dengan amunisi penembus baja khusus, performa anti-lapis bajanya masih sangat terbatas."
 flamethrower: "Penyembur Api"
 flamethrower_desc: "Alat untuk menyemburkan cairan yang menyala. Sangat berguna dalam pertempuran kota dan melawan perbentengan, namun tidak memiliki kemampuan anti-lapis baja dan harus digunakan oleh awak terlatih khusus dalam unit terpisah agar efektif."
 advanced_flamethrower: "Penyembur Api Mutakhir"
 advanced_flamethrower_desc: "Sistem penyembur api yang ditingkatkan, ideal untuk membersihkan posisi pertahanan berbenteng dan menimbulkan kerusakan mematikan dalam pertempuran jarak dekat."
 tank_auto_cannon: "Meriam Otomatis"
 tank_auto_cannon_desc: "Diadaptasi dari meriam anti-udara tembak cepat, meriam otomatis ini mampu melancarkan tembakan beruntun yang menghancurkan sasaran lunak. Kaliber kecilnya membatasi performa anti-lapis baja."
 tank_auto_cannon_2: "Meriam Otomatis Ditingkatkan"
 tank_auto_cannon_2_desc: "Diadaptasi dari meriam anti-udara tembak cepat, meriam otomatis ini mampu melancarkan tembakan beruntun yang menghancurkan sasaran lunak. Kaliber kecilnya membatasi performa anti-lapis baja."
 tank_anti_air_cannon: "Meriam Anti-Udara Dasar"
 tank_anti_air_cannon_desc: "Meriam otomatis tembak cepat yang dirancang untuk menghadapi pesawat tempur. Memiliki potensi terbatas sebagai senjata bantuan tembakan terhadap sasaran darat."
 tank_anti_air_cannon_2: "Meriam Anti-Udara Ditingkatkan"
 tank_anti_air_cannon_2_desc: "Meriam otomatis tembak cepat yang dirancang untuk menghadapi pesawat tempur. Memiliki potensi terbatas sebagai senjata bantuan tembakan terhadap sasaran darat."
 tank_anti_air_cannon_3: "Meriam Anti-Udara Mutakhir"
 tank_anti_air_cannon_3_desc: "Meriam otomatis tembak cepat yang dirancang untuk menghadapi pesawat tempur. Memiliki potensi terbatas sebagai senjata bantuan tembakan terhadap sasaran darat."
 tank_medium_howitzer: "Howitzer Sedang"
 tank_medium_howitzer_desc: "Howitzer medan kaliber sedang yang disesuaikan untuk dipasang pada kendaraan. Tujuan utamanya adalah bantuan tembakan tidak langsung terhadap sasaran lunak, namun dapat ditembakkan langsung jika diperlukan. Membawa sedikit amunisi penembus baja menjadikannya kurang cocok untuk tugas anti-tank."
 tank_medium_howitzer_2: "Howitzer Sedang Ditingkatkan"
 tank_medium_howitzer_2_desc: "Howitzer medan kaliber sedang yang disesuaikan untuk dipasang pada kendaraan. Tujuan utamanya adalah bantuan tembakan tidak langsung terhadap sasaran lunak, namun dapat ditembakkan langsung jika diperlukan. Membawa sedikit amunisi penembus baja menjadikannya kurang cocok untuk tugas anti-tank."
 tank_heavy_howitzer: "Howitzer Berat"
 tank_heavy_howitzer_desc: "Howitzer medan kaliber berat yang disesuaikan untuk dipasang pada kendaraan. Tujuan utamanya adalah bantuan tembakan tidak langsung terhadap sasaran lunak, namun dapat ditembakkan langsung jika diperlukan. Membawa sedikit amunisi penembus baja menjadikannya kurang cocok untuk tugas anti-tank."
 tank_small_cannon: "Meriam Kecil"
 tank_small_cannon_desc: "Meriam kecil dan murah, mampu menembakkan proyektil anti-infanteri maupun anti-lapis baja. Kalibernya yang kecil membatasi kegunaannya."
 tank_small_cannon_2: "Meriam Kecil Ditingkatkan"
 tank_small_cannon_2_desc: "Meriam kecil dan murah, mampu menembakkan proyektil anti-infanteri maupun anti-lapis baja. Kalibernya yang kecil membatasi kegunaannya."
 tank_medium_cannon: "Meriam Sedang"
 tank_medium_cannon_desc: "Senjata serbaguna yang sangat cocok untuk berbagai macam tugas. Senjata ini tidak terlalu unggul dalam pertempuran anti-infanteri maupun anti-tank murni, tetapi memberikan fleksibilitas tinggi bagi kendaraan."
 tank_medium_cannon_2: "Meriam Sedang Ditingkatkan"
 tank_medium_cannon_2_desc: "Senjata serbaguna yang sangat cocok untuk berbagai macam tugas. Senjata ini tidak terlalu unggul dalam pertempuran anti-infanteri maupun anti-tank murni, tetapi memberikan fleksibilitas tinggi bagi kendaraan."
 tank_high_velocity_cannon: "Meriam Kecepatan Tinggi Dasar"
 tank_high_velocity_cannon_desc: "Meriam yang dirancang khusus untuk mencapai kecepatan laras tinggi. Menggunakan amunisi khusus, meriam ini memiliki karakteristik anti-lapis baja yang luar biasa, namun performanya terhadap sasaran lunak menurun."
 tank_high_velocity_cannon_2: "Meriam Kecepatan Tinggi Ditingkatkan"
 tank_high_velocity_cannon_2_desc: "Meriam yang dirancang khusus untuk mencapai kecepatan laras tinggi. Menggunakan amunisi khusus, meriam ini memiliki karakteristik anti-lapis baja yang luar biasa, namun performanya terhadap sasaran lunak menurun."
 tank_high_velocity_cannon_3: "Meriam Kecepatan Tinggi Mutakhir"
 tank_high_velocity_cannon_3_desc: "Meriam yang dirancang khusus untuk mencapai kecepatan laras tinggi. Menggunakan amunisi khusus, meriam ini memiliki karakteristik anti-lapis baja yang luar biasa, namun performanya terhadap sasaran lunak menurun."
 tank_heavy_cannon: "Meriam Berat Dasar"
 tank_heavy_cannon_desc: "Senjata yang dapat menembakkan peluru kaliber besar. Dengan penetrasi lapis baja yang luar biasa dan performa yang layak terhadap sasaran lunak, kelemahan terbesarnya adalah ukuran dan biaya yang besar, membuatnya terlalu berat untuk dipasang pada kendaraan yang tidak dirancang khusus untuk membawanya."
 tank_heavy_cannon_2: "Meriam Berat Ditingkatkan"
 tank_heavy_cannon_2_desc: "Senjata yang dapat menembakkan peluru kaliber besar. Dengan penetrasi lapis baja yang luar biasa dan performa yang layak terhadap sasaran lunak, kelemahan terbesarnya adalah ukuran dan biaya yang besar, membuatnya terlalu berat untuk dipasang pada kendaraan yang tidak dirancang khusus untuk membawanya."
 tank_heavy_cannon_3: "Meriam Berat Mutakhir"
 tank_heavy_cannon_3_desc: "Senjata yang dapat menembakkan peluru kaliber besar. Dengan penetrasi lapis baja yang luar biasa dan performa yang layak terhadap sasaran lunak, kelemahan terbesarnya adalah ukuran dan biaya yang besar, membuatnya terlalu berat untuk dipasang pada kendaraan yang tidak dirancang khusus untuk membawanya."
 tank_super_heavy_cannon: "Meriam Super Berat"
 tank_super_heavy_cannon_desc: "Senjata berukuran luar biasa besar dengan kinerja tanpa tanding. Hanya ada sedikit target yang tidak dapat dihancurkan oleh senjata ini di medan perang."
 NOR_rikstanken_turret: "Kubah Improvvisasi"
 NOR_rikstanken_turret_desc: "Menampung senjata dan dapat berputar. Ketika sedang berfungsi."
 tank_close_support_gun: "Meriam Bantuan Dekat"
 tank_close_support_gun_desc: "Senjata kaliber sedang berlaras pendek yang dirancang untuk menembakkan peluru berdaya ledak tinggi terhadap benteng lapangan musuh guna membantu gerak maju infanteri. Walau mampu menyerang tank musuh, laras pendek dan amunisi terbatas membuatnya kurang memadai menghadapi tank musuh yang lebih kuat."
 tank_radio_1: "Radio Dasar"
 tank_radio_1_desc: "Radio dua arah dasar memungkinkan tank mengoordinasikan manuver taktis mereka dalam skala kecil."
 tank_radio_2: "Radio Ditingkatkan"
 tank_radio_2_desc: "Radio yang ditingkatkan memungkinkan komandan memegang kendali efektif atas formasi tank yang lebih besar, memungkinkan manuver operasional skala besar."
 tank_radio_3: "Radio Mutakhir"
 tank_radio_3_desc: "Dengan pemancar yang lebih kuat dan penerimaan yang lebih jernih, radio ini memungkinkan komunikasi jarak puluhan kilometer dan mampu mengatasi gangguan sinyal (jamming) musuh."
 amphibious_drive: "Penggerak Amfibi"
 amphibious_drive_desc: "Perangkat pelampung dan baling-baling pendorong memungkinkan tank ini dipersiapkan dengan cepat untuk melintasi air, baik dari kapal ke pantai maupun menyeberangi sungai."
 secondary_turret_hmg: "Senapan Mesin Berat"
 secondary_turret_hmg_desc: "Senapan mesin berat di kubah sekunder. Penempatan kubah membatasi sudut tembaknya, menurunkan efektivitas senjata secara keseluruhan, namun memungkinkan tank menghadapi lebih banyak sasaran, terutama saat menyerang."
 secondary_turret_small_cannon: "Meriam Kecil"
 secondary_turret_small_cannon_desc: "Meriam kecil di kubah sekunder. Penempatan kubah membatasi sudut tembaknya, menurunkan efektivitas senjata secara keseluruhan, namun memungkinkan tank menghadapi lebih banyak sasaran, terutama saat menyerang."
 secondary_turret_close_support_gun: "Meriam Bantuan Dekat"
 secondary_turret_close_support_gun_desc: "Meriam bantuan dekat di kubah sekunder. Penempatan kubah membatasi sudut tembaknya, menurunkan efektivitas senjata secara keseluruhan, namun memungkinkan tank menghadapi lebih banyak sasaran, terutama saat menyerang."
 sloped_armor: "Lapis Baja Miring"
 sloped_armor_desc: "Lapis baja yang diposisikan miring terhadap proyektil yang datang memiliki ketebalan efektif yang jauh lebih besar dibandingkan ketebalan baja yang sama secara vertikal. Hal ini juga meningkatkan peluang proyektil memantul (ricochet). Namun, perancangannya menuntut seluruh bodi tank disesuaikan sehingga kendaraan lebih rumit dirakit."
 stabilizer: "Stabilisator"
 stabilizer_desc: "Perangkat mekanis untuk menjaga moncong meriam tetap mengarah ke sasaran saat tank bergerak. Walau belum cukup canggih untuk menembak akurat saat melaju kencang, perangkat ini memungkinkan penembak melepas tembakan tepat saat berhenti sejenak tanpa perlu membidik ulang."
 smoke_launchers: "Pelontar Asap"
 smoke_launchers_desc: "Pelontar piroteknik yang dapat dipicu dari dalam tank untuk menciptakan tabir asap tebal guna menyembunyikan tank. Sangat berguna saat bertahan atau setelah terjebak dalam penyergapan."
 extra_ammo_storage: "Penyimpanan Amunisi Tambahan"
 extra_ammo_storage_desc: "Rak amunisi cadangan memungkinkan tank bertempur jauh lebih lama tanpa perlu pasokan ulang. Namun, jika pelindung baja tertembus, risikonya menjadi sangat fatal. Hal ini menjadi masalah besar terutama saat melakukan serangan."
 wet_ammo_storage: "Penyimpanan Amunisi Basah"
 wet_ammo_storage_desc: "Selubung cairan yang ditambahkan ke rak amunisi secara drastis mengurangi risiko ledakan amunisi setelah tank terkena tembakan, suatu fitur yang sangat dihargai oleh para awak tank."
 armor_tech_1_tt: "Mengaktifkan nilai Peningkatan Lapis Baja 5 ke atas."
 armor_tech_2_tt: "Mengaktifkan nilai Peningkatan Lapis Baja 10 ke atas."
 armor_tech_3_tt: "Mengaktifkan nilai Peningkatan Lapis Baja 15 ke atas."
 armor_tech_4_tt: "Mengaktifkan nilai Peningkatan Lapis Baja 18 ke atas."
 engine_tech_1_tt: "Mengaktifkan nilai Peningkatan Mesin 5 ke atas."
 engine_tech_2_tt: "Mengaktifkan nilai Peningkatan Mesin 10 ke atas."
 engine_tech_3_tt: "Mengaktifkan nilai Peningkatan Mesin 15 ke atas."
 engine_tech_4_tt: "Mengaktifkan nilai Peningkatan Mesin 18 ke atas."
 light_tank_chassis: "Tank Ringan"
 medium_tank_chassis: "Tank Sedang"
 heavy_tank_chassis: "Tank Berat"
 light_tank_chassis_0: "Tank Ringan Antar-Perang"
 light_tank_chassis_desc: "Sasis kecil dan ringkas, ideal untuk kendaraan ringan berbiaya murah yang menjalankan tugas pengintaian dan bantuan tembakan. Daya angkutnya yang terbatas membuatnya kurang cocok untuk membawa lapis baja tebal atau meriam besar."
 light_tank_chassis_1: "Tank Ringan Dasar"
 basic_light_tank_chassis: "Tank Ringan Dasar"
 basic_light_tank_chassis_short: "Ringan 1934"
 basic_light_tank_chassis_desc: "Kemajuan teknologi telah membuat desain pasca-perang usang. Medan perang modern membutuhkan desain baru yang memadukan kemajuan metalurgi dan tata letak interior yang efisien."
 light_tank_chassis_2: "Tank Ringan Ditingkatkan"
 improved_light_tank_chassis: "Tank Ringan Ditingkatkan"
 improved_light_tank_chassis_short: "Ringan 1936"
 improved_light_tank_chassis_desc: "Penyempurnaan lebih lanjut berdasarkan pengalaman dari tank ringan sebelumnya, sasis ini memberikan keandalan dan kemudahan perawatan yang lebih baik."
 light_tank_chassis_3: "Tank Ringan Mutakhir"
 advanced_light_tank_chassis: "Tank Ringan Mutakhir"
 advanced_light_tank_chassis_short: "Ringan 1941"
