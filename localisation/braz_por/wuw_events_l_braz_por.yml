l_braz_por:
 # News events 
 wuw_GER_news.1.t: "Penyatuan Kembali Jerman"
 wuw_GER_news.1.d: "Setelah sekian lama terpecah belah di antara berbagai negara bagian, oleh perbatasan semena-mena yang memisahkan saudara sebangsa, rakyat Jerman kini dapat kembali bersukacita saat sebuah negara Jerman baru tengah bangkit. Menyusul manuver politik terkini, [FROM.GetLeader] telah membuktikan diri sejalan dengan semangat Bismarck, dan memproklamasikan penyatuan kembali Jerman, sebuah bangsa yang akan berdiri tegak selama seribu tahun!"
 wuw_GER_news.1.a: "Jerman akhirnya kembali utuh"
 wuw_GER_news.1.b: "Ini baru permulaan"
 wuw_GER_news.2.t: "Pemberontakan di Silesia"
 wuw_GER_news.2.desc: "Untuk keempat kalinya sejak Perjanjian Versailles ditandatangani, para pemberontak di Silesia Jerman bangkit melawan pemerintah. Kali ini [SIL.GetLeader] mengklaim bahwa tujuan tindakan militer mereka terutama adalah untuk mengamankan kemerdekaan negara Silesia sekaligus melindungi rakyat Silesia dari marabahaya selama perang saudara Jerman, kendati pemberontakan sebelumnya lebih bertujuan meraih otonomi di dalam naungan negara Polandia. Hanya waktu yang akan membuktikan apakah mereka sanggup bertahan menghadapi tentara Jerman."
 wuw_GER_news.2.a: "Perkembangan situasi yang menarik"
 wuw_GER_news.2.b: "Mereka sudah pernah mencoba dan gagal sebelumnya"
 wuw_GER_news.2.c: "Inilah saatnya bagi kita!"
 wuw_GER_news.2.d: "Semoga kali ini mereka berhasil"
 # Austrian events
 AUS_political_events.1.t: "Nasib Creditanstalt-Bankverein"
 AUS_political_events.1.desc: "Telah menjadi perhatian kita bahwa merger bank tahun 1934, di mana Creditanstalt yang telah direkapitalisasi mengambil alih seluruh aset dan kewajiban Wiener Bankverein serta operasi layak dari Niederösterreichische Escompte-Gesellschaft, kini menjadi bumerang bagi kita. Hal ini sangat menghambat perkembangan ekonomi kita dan secara tidak sengaja menciptakan semacam monopoli pada sektor keuangan. Mengingat kita kini meregulasi sektor ini, bagaimana kita harus menyikapi situasi tersebut?"
 AUS_political_events.1.a: "Paling aman adalah membiarkannya apa adanya"
 AUS_political_events.1.a_tt: "Tidak ada perubahan yang akan dilakukan pada Konsorsium Industri kita. Creditanstalt-Bankverein akan tetap tersedia, memberikan:"
 AUS_political_events.1.b: "Österreichische Creditanstalt adalah pilihan paling cerdas"
 AUS_political_events.1.c: "Wiener Bankverein tidak akan mengecewakan kita"
 AUS_reestablish_creditanstalt: "Creditanstalt-Bankverein akan dibubarkan dan Österreichische Creditanstalt yang baru akan diberikan dukungan penuh kita."
 AUS_reestablish_benkverein: "Creditanstalt-Bankverein akan dibubarkan dan Wiener Bankverein yang baru akan diberikan dukungan penuh kita."
 AUS_political_events.2.t: "Skandal Asuransi Phönix"
 AUS_political_events.2.desc: "Tak lama setelah kematian direktur jenderal mereka yang dicintai, Wilhelm Berliner, Asuransi Phönix terjerumus ke dalam kesulitan lebih lanjut. Neraca keuangan yang dipalsukan telah dilaporkan kepada pemerintah oleh direktur baru Eberhard Reininghaus, menyingkap defisit sejak tahun 1929 yang mencapai lebih dari 250 juta schilling.\n\nPerusahaan tersebut telah menyatakan bangkrut dan segera menghentikan seluruh operasinya. Asuransi Peserta Perang yang sangat populer telah terhenti secara tiba-tiba, memicu kecaman keras dari banyak pihak yang selama ini bergantung pada pembayaran klaim asuransi tersebut."
 AUS_political_events.2.a: "Mengerikan sekali!"
 AUS_political_events.2.b: "Kita yang akan menanggung pembayaran klaimnya!"
 AUS_political_events.2.b_tt: "Menanggung asuransi ini akan memungkinkan kita nantinya membangkitkan kembali Asuransi Phönix."
 AUS_political_events.3.t: "Remiliterisasi Jerman Memicu Kekhawatiran Luas"
 AUS_political_events.3.desc: "Remiliterisasi Rheinland baru-baru ini telah menimbulkan kekhawatiran besar di kalangan rakyat kita. Di dalam tubuh pemerintahan kita muncul pertanyaan, 'Mungkinkah kita sasaran berikutnya?' Kendati sang Führer terus-menerus menegaskan bahwa mencaplok Austria tidak termasuk dalam kepentingannya, kita harus mempertimbangkan bahwa tindakan semacam itu kini bukan lagi hal yang mustahil."
 AUS_political_events.3.a: "Kita harus bersiap menghadapi skenario terburuk..."
 AUS_political_events.3.a_tt: "Membuka keputusan §YLangkah-Langkah Anti-Anschluss§!"
 AUS_political_events.4.t: "Perubahan Sikap"
 AUS_political_events.4.desc: "Kardinal Theodor Innitzer yang sebelumnya secara terbuka berhaluan fasis belakangan ini mengubah retorikanya secara radikal. Dari yang semula vokal dan terang-terangan mendukung Nazisme serta Führer [GER.GetAdjective], dalam sebuah misa pada tanggal 7 Oktober, ia secara tegas mengambil sikap menentang sang Führer. Alih-alih khotbahnya yang biasa tentang bagaimana massa harus menaruh iman mereka kepada [GER.GetLeader], ia kini mengarahkan mereka kembali kepada Tuhan.\n\nKepemimpinan [GER.GetAdjective] geram dan menuntut kita untuk mengambil tindakan tegas."
 AUS_political_events.4.a: "Singkirkan pengkhianat itu!"
 AUS_political_events.4.b: "Herr Innitzer berhak atas pendapatnya sendiri."
 AUS_political_events.5.t: "[AUS.GetNameDefCap] Mengharapkan Kerja Sama Antar Angkatan Udara"
 AUS_political_events.5.desc: "Sebuah usulan dari para diplomat [AUS.GetAdjective] di negara kita baru saja tiba. Setelah dibebaskan dari Perjanjian Saint-Germain-en-Laye, mereka kini bertekad membangun kembali angkatan darat dan udara mereka, yang mereka tegaskan murni demi langkah-langkah pertahanan. Negara mereka memiliki sejarah merancang badan pesawat yang cukup tangguh dan memiliki cukup banyak pilot berbakat, namun dengan adanya jurang dalam produksi dan pelatihan, mereka kini menghadapi tantangan membangun kembali kapasitas ini. Jika kita bersedia mengesampingkan tindakan mereka di Perang Besar, kita berpeluang memetik keuntungan dari kemitraan ini."
 AUS_political_events.5.a: "Ini sangat berharga, kita akan membantu sebanyak mungkin!"
 AUS_political_events.5.b: "Kita dapat belajar untuk bekerja sama."
 AUS_political_events.5.c: "Kita tidak mempercayai dusta 'Pertahanan' yang mereka katakan."
 AUS_political_events.6.t: "[FROM.GetNameDefCap] Menerima Usulan Kita dan Memberi Izin Pembelian Peralatan"
 AUS_political_events.6.desc: "[FROM.GetNameDefCap] menyambut positif saran kita untuk bekerja sama dalam membangun angkatan udara dan berbagi pengalaman tempur. Mereka memahami kesulitan yang kita hadapi setelah melepaskan diri dari Perjanjian Saint-Germain-en-Laye dan menawarkan kita kemungkinan untuk membeli kelebihan peralatan militer dari mereka!"
 AUS_political_events.6.a: "Bersulang untuk kemitraan yang agung!"
 AUS_political_events.7.t: "[FROM.GetNameDefCap] Menerima Usulan Kita"
 AUS_political_events.7.desc: "[FROM.GetNameDefCap] merespons cukup baik saran terbaru kita untuk bekerja sama dalam pembangunan angkatan udara masing-masing. Kendati mereka tidak dapat menawarkan bantuan material, mereka sepakat untuk membagikan beberapa metode terbaru mereka dalam pelatihan pilot tempur."
 AUS_political_events.7.a: "Bagus sekali!"
 AUS_political_events.8.t: "[FROM.GetNameDefCap] Menolak Usulan Kemitraan Kita"
 AUS_political_events.8.desc: "[FROM.GetNameDefCap] telah menolak tawaran kita. Mereka menyatakan bahwa perjanjian itu akan berat sebelah dan tidak memberi manfaat bagi mereka, serta menegaskan bahwa kitalah yang menjerumuskan diri kita sendiri ke dalam situasi ini akibat tindakan kita di Perang Besar."
 AUS_political_events.8.a: "Lantas bagaimana situasi ini akan menguntungkan mereka?"
 AUS_air_force_partnership_big: "Kemitraan Angkatan Udara Ekstensif"
 AUS_air_force_partnership_small: "Kemitraan Angkatan Udara"
 AUS_rejected_air_force_partnership: "Kemitraan Angkatan Udara Ditolak"
 AUS_political_events.9.t: "Wilhelm Zehner Dibunuh"
 AUS_political_events.9.desc: "Wilhelm Zehner, salah satu anggota Komando Tinggi Militer kita, telah ditemukan tewas di apartemennya. Para diplomat [GER.GetAdjective] menyangkal segalanya dan mengklaim mereka tidak terlibat, bersikeras bahwa Zehner pasti melakukan ini sendiri dengan senjata api yang ditemukan bersamanya. Namun penyelidikan kriminal mengarah ke arah yang sama sekali berbeda..."
 AUS_political_events.9.a: "Jadi pihak [GER.GetAdjective] bukan hanya pembohong, tapi juga pembunuh..."
 AUS_political_events.9.a_tt: "§YWilhelm Zehner§!§Rtewas terbunuh!§!"
 AUS_anschluss_ratio_lowered: "§YKekuatan Tempur Total Angkatan Darat§! yang dibutuhkan untuk §YAnschluss§! akan §YDiturunkan§!"
 AUS_anschluss_ratio_raised: "§YKekuatan Tempur Total Angkatan Darat§! yang dibutuhkan untuk §YAnschluss§! akan §YDinaikkan§!"
 AUS_political_events.10.t: "Upaya Pembunuhan Wilhelm Zehner Digagalkan"
 AUS_political_events.10.desc: "Kemarin petang, Gestapo mendobrak masuk ke apartemen Wilhelm Zehner dan dihadang oleh para penjaga yang kita tempatkan di sekitar Komando Tinggi kita. Baku tembak tidak berlangsung lama, dan Zehner berhasil selamat dari insiden tersebut tanpa terluka sedikit pun."
 AUS_political_events.10.a: "Sudah kami duga!"
 AUS_political_events.11.t: "[GER.GetNameDefCap] Menyatakan Ketidaksukaan terhadap Komando Tinggi Militer Kita"
 AUS_political_events.11.desc: "Para diplomat dari [GER.GetNameDef] telah menyampaikan kekhawatiran perihal salah satu anggota komando tinggi militer kita. Mereka mengklaim bahwa kendati kita adalah negara berdaulat dan bebas bertindak sesuka hati, hal ini dapat menyebabkan hubungan diplomatik kita dengan [GER.GetNameDef] memburuk.\n\nKita dapat memperkirakan mereka akan mengambil tindakan sendiri jika kita gagal bertindak demi kepentingan terbaik mereka."
 AUS_political_events.11.a: "Ini bukan urusan mereka!"
 AUS_political_events.11.a_tt: "Memicu misi §YPermusuhan [GER.GetAdjective] terhadap Komando Tinggi Militer§!\n\nKegagalan mencegah kematian Zehner akan menyebabkan §YKekuatan Tempur Total Angkatan Darat§! yang dibutuhkan untuk §YAnschluss§! §YDiturunkan§!."
 AUS_political_events.11.b: "Jika itu yang diperlukan untuk menghentikan keonaran mereka..."
 AUS_political_events.12.t: "[FROM.GetNameDefCap] Menawarkan Peralatan Infanteri kepada Kita"
 AUS_political_events.12.desc: "[FROM.GetNameDefCap] telah menghubungi kita menawarkan dukungan berupa peralatan infanteri. Mereka sangat menghargai kita sebagai sekutu yang paling berharga dan berharap senapan-senapan ini dimanfaatkan untuk upaya perang kita di [ETH.GetNameDef] demi memastikan kemenangan kita dalam peperangan ini."
 AUS_political_events.12.a: "Sungguh tak terduga, namun sangat disambut baik."
 AUS_political_events.13.t: "[FROM.GetNameDefCap] Keberatan atas Embargo terhadap [ITA.GetNameDef]"
 AUS_political_events.13.desc: "Kita telah menerima protes menentang embargo yang telah kita terapkan terhadap [ITA.GetNameDef], sama seperti yang dilakukan banyak negara lain. Mengklaim bahwa embargo tersebut tidak masuk akal dan tak berdasar, kepemimpinan [AUS.GetAdjective] menuntut agar kita mencabut embargo itu.\n\nKetika didesak mengenai alasan mereka memprotes embargo tersebut, kepemimpinan [FROM.GetNameDef] menolak memberikan penjelasan lebih lanjut."
 AUS_political_events.13.a: "Pihak [AUS.GetAdjective] tidak punya hak menuntut hal ini."
 AUS_political_events.13.b: "Baiklah."
 AUS_political_events.14.t: "[FROM.GetNameDefCap] Menentang Keras Embargo terhadap Kita"
 AUS_political_events.14.desc: "Tekanan kita terhadap [FROM.GetNameDef] telah membuahkan hasil, dan Arthur Seyss-Inquart telah diangkat sebagai penasihat. Kendati kesetiaannya sempat dipertanyakan belakangan ini, ia jauh lebih bersimpati kepada partai kita dibanding kaum [FROM.GetAdjective].\n\nKini, [FROM.GetNameDefCap] seharusnya akan jauh lebih patuh terhadap permintaan kita."
 AUS_political_events.14.a: "Pihak [FROM.GetAdjective] tunduk pada tuntutan kita"
 AUS_political_events.15.t: "[FROM.GetNameDefCap] Menolak Mencabut Embargo"
 AUS_political_events.15.desc: "Kabar baru saja sampai kepada kita bahwa pemerintah [FROM.GetAdjective] telah memberlakukan pelarangan terhadap DNSAP di [FROM.GetNameDef]. Larangan lunak sebenarnya telah ada sejak tahun 1934, meski larangan tersebut sebagian besar diabaikan oleh partai-partai politik maupun pemerintah. Hal ini menandakan perubahan sikap dari kepemimpinan [FROM.GetAdjective] terhadap kita.\n\nDi luar penghinaan terang-terangan ini, tindakan tersebut juga dapat menghambat pengaruh kita atas [FROM.GetNameDef]."
 AUS_political_events.15.a: "Sikap yang sangat disayangkan."
 AUS_political_events.15.b: "Sungguh lancang!"
 AUS_political_events.15.c: "Kita tidak punya waktu untuk urusan itu sekarang!"
 AUS_banned_dnsap: "Melarang DNSAP"
 AUS_meddling_with_our_politics: "Mencampuri Politik Dalam Negeri Kita"
 AUS_political_events.16.t: "[FROM.GetNameDefCap] Mencabut Embargo"
 AUS_political_events.16.desc: "Seperti yang telah diduga, [FROM.GetNameDef] bereaksi sangat keras terhadap pelarangan DNSAP baru-baru ini. Selain tuntutan nyata agar kita segera mencabut larangan tersebut, mereka juga menuntut agar kita mengangkat Arthur Seyss-Inquart sebagai penasihat. Mereka sangat bersikeras mengenai hal ini, dan walau kita selalu tahu bahwa ia sangat menyukai cara hidup [FROM.GetAdjective], hal ini tetap menimbulkan tanda tanya besar: mengapa?"
 AUS_political_events.16.a: "Kabar yang sangat melegakan."
 AUS_political_events.16.b: "Sama sekali tidak boleh!"
 AUS_political_events.16.a_tt: "Mengangkat §YArthur Seyss-Inquart§! sebagai Penasihat yang §Rtidak dapat diberhentikan§!\n"
 AUS_political_events.17.t: "[FROM.GetNameDefCap] Memprotes Pelarangan DNSAP Kita"
 AUS_political_events.17.desc: "Seperti yang telah diduga, [FROM.GetNameDef] bereaksi sangat buruk terhadap pelarangan DNSAP oleh kita. Mereka menganggap ini sebagai serangan langsung terhadap ideologi mereka sendiri dan menyuarakan kekecewaan serta kemarahan besar atas keputusan kita. Kendati kita memiliki alasan kuat untuk melarang DNSAP, kepemimpinan [FROM.GetAdjective] kini menuntut agar kita segera mencabut larangan tersebut."
 AUS_political_events.17.a: "Tindak tegas para koruptor!"
 AUS_political_events.18.t: "[FROM.GetNameDefCap] Mengangkat Arthur Seyss-Inquart sebagai Penasihat"
 AUS_political_events.18.desc: "Tampaknya kaum [FROM.GetAdjective] akhirnya dapat diajak bernalar sehat. Larangan terhadap partai saudari kita di [FROM.GetNameDef] memang masih berlaku, namun setidaknya mereka telah mengangkat Arthur Seyss-Inquart sebagai penasihat, memberikan kita wawasan berharga tentang manuver politik mereka."
 AUS_political_events.18.a: "Laksanakan reformasi militer!"
 AUS_political_events.19.t: "Kembalinya Godwin von Brumowski"
 AUS_political_events.19.desc: "Penerbang ulung (ace) kita yang paling berprestasi dari Perang Besar telah menghadap kita menawarkan jasanya sekali lagi saat bangsa kita mendapati diri dalam kancah peperangan. Kendati tak lagi muda, ataupun mampu terbang seperti sedia kala menyusul kecelakaan fatal yang nyaris merenggut nyawanya pada tahun 1936, ia menawarkan diri untuk memimpin angkatan udara kita menuju kemenangan dari darat. Para pilot muda kita tetap memandangnya dengan rasa hormat yang mendalam dan ada keyakinan luas bahwa ia sanggup menggembleng para penerbang kita hingga mencapai kehebatan yang menandingi reputasinya sendiri."
 AUS_political_events.19.a: "Kita membutuhkan semua bantuan yang bisa kita peroleh!"
 AUS_political_events.19.b: "Mengingat keterlibatannya dalam kudeta 1934, kita tidak boleh mengambil risiko."
 AUS_von_brumowski_recruited_flag: "Merekrut Godwin von Brumowski"
 AUS_political_events.20.t: "[FROM.GetNameDefCap] Mengharapkan Dukungan Kita"
 AUS_political_events.20.desc: "[GetGuarantorFlavorText]"
 AUS_guarantor_is_italy_key: "[FROM.GetNameDefCap] telah mengutus sang Jenderal dan atase militer berkala Emil Liebitzky kepada kita dengan membawa permohonan bantuan. Beliau, bersama para petinggi dalam kepemimpinan [FROM.GetAdjective], telah menyaksikan kecenderungan yang mengkhawatirkan dari [GER.GetNameDef] dan kini mengharapkan dukungan yang lebih resmi dari kita seandainya penilaian mereka atas situasi ini terbukti benar.\n\nSebagai pihak yang turut menandatangani Perjanjian Saint-Germain-en-Laye, kita kemungkinan besar diharapkan datang membantu mereka, kendati celah hukum dalam naskah perjanjian tersebut kemungkinan besar dapat ditemukan."
 AUS_guarantor_is_not_italy_key: "[FROM.GetNameDefCap] telah mengutus seorang duta besar kepada kita memohon bantuan kita. Kepemimpinan [FROM.GetAdjective] telah melihat gelagat mencemaskan dari pimpinan [GER.GetNameDef], dan karena mereka terikat larangan mobilisasi untuk menghadapi ancaman tersebut akibat Perjanjian Saint-Germain-en-Laye, mereka kini secara lebih resmi memohon dukungan kita. Dalam naskah perjanjian dan kesepakatan berikutnya kita memang telah setuju untuk membantu mereka, namun tidak ada rincian pasti mengenai bentuk nyata bantuan tersebut."
 AUS_political_events.20.a: "Kemerdekaan mereka adalah hal yang paling krusial bagi kita!"
 AUS_political_events.20.b: "Kita akan mendukung mereka secara diplomatis"
 AUS_political_events.20.c: "Mungkin kita dapat mencapai kesepakatan yang saling menguntungkan"
 AUS_political_events.20.d: "Kita tidak akan mempertaruhkan apa pun demi mereka"
 AUS_political_events.21.t: "[FROM.GetNameDefCap] Menjamin Kemerdekaan Kita"
 AUS_political_events.21.desc: "Sesuai dengan apa yang tertulis dalam Perjanjian Saint-Germain-en-Laye, [FROM.GetNameDef] telah sepakat untuk menjamin kemerdekaan kita. Demi memastikannya, mereka juga memberi kita sarana untuk pengadaan sejumlah perlengkapan militer, mengingat saat ini kita belum sanggup memproduksi peralatan sendiri."
 AUS_political_events.21.a: "Luar biasa!"
 AUS_political_events.22.t: "[FROM.GetNameDefCap] Mendukung Kemerdekaan Kita Secara Diplomatis"
 AUS_political_events.22.desc: "Dengan memanfaatkan sejumlah klausul yang kurang dikenal dan pasal-pasal terselubung, [FROM.GetNameDef] memutuskan untuk tidak menawarkan jaminan militer, melainkan hanya dukungan diplomatis seandainya terjadi invasi. Mereka bersikeras bahwa kata-kata mereka sanggup membujuk [GER.GetLeader] sama efektifnya dengan ancaman intervensi senjata, sehingga mereka memandang tidak ada alasan untuk menyiagakan pasukan demi kita."
 AUS_political_events.22.a: "Bukan ini yang kita minta, tapi lebih baik daripada tidak sama sekali."
 AUS_political_events.22.b: "Diplomasi dan peralatan saja tidak akan sanggup menyelamatkan kita!"
 AUS_political_events.23.t: "[FROM.GetNameDefCap] Menawarkan Jaminan Bersyarat"
 AUS_political_events.23.desc: "[FROM.GetNameDefCap] menanggapi permohonan bantuan kita dengan mengajukan tuntutan balik. Sejak masa perjanjian ini dipaksakan kepada kita, kita selalu berikhtiar merebut kembali Alto Adige dan Trentino, karena wilayah itu secara sah adalah milik kita. Namun [FROM.GetNameDef] memandang tanah tersebut sebagai milik mereka, dan jika mereka harus menjamin kemerdekaan kita, mereka menuntut kita melepaskan klaim-klaim itu untuk selama-lamanya."
 AUS_political_events.23.a: "Keselamatan mendesak kita jauh lebih penting daripada klaim wilayah tersebut"
 AUS_political_events.23.b: "Mereka berusaha memeras keuntungan dari kemalangan kita, jelas tidak bisa diterima."
 AUS_political_events.24.t: "[FROM.GetNameDefCap] Menolak Permohonan Bantuan Kita"
 AUS_political_events.24.desc: "Dengan memanfaatkan berbagai celah hukum, tulisan halus, dan klausul kabur dalam Perjanjian Saint-Germain-en-Laye, [FROM.GetNameDef] entah bagaimana telah berhasil berkelit dari kewajiban membantu kita. Tertulis gamblang di atas kertas bahwa kita berhak atas bantuan eksternal sebagai kompensasi atas dilarangnya kita memiliki angkatan darat yang layak, namun kenyataannya [FROM.GetNameDef] memutuskan aturan itu tak berlaku bagi mereka. Kita terpaksa berjuang sendirian."
 AUS_political_events.24.a: "Kita sudah menunjukkan kelemahan fatal ini kepada pihak-pihak lain..."
 AUS_political_events.24.b: "Kita akan memberi mereka imbalan yang menggoda!"
 AUS_political_events.25.t: "[FROM.GetNameDefCap] Mencabut Klaim atas Wilayah Kita"
 AUS_political_events.25.desc: "[FROM.GetNameDefCap] menanggapi tuntutan kita agar mereka mencabut klaim atas wilayah kita dengan tunduk pada tuntutan tersebut. Mereka telah sepenuhnya mengubur gagasan merebut wilayah ini sebagai imbalan atas dukungan kita."
 AUS_political_events.25.a: "Kabar yang Luar Biasa!"
 AUS_political_events.26.t: "[FROM.GetNameDefCap] Menolak Mencabut Klaim Mereka"
 AUS_political_events.26.desc: "Semula kita mengira pihak [FROM.GetAdjective] adalah bangsa yang berakal sehat ketika mereka mendekati kita memohon pertolongan baru-baru ini. Namun dugaan kita keliru besar. Ketika didesak untuk mencabut klaim mereka atas wilayah yang secara sah adalah milik kita, mereka menolak mentah-mentah."
 AUS_political_events.26.a: "Kalau begitu, tidak ada bantuan sedikit pun bagi mereka."
 AUS_political_events.27.t: "[AUS.GetNameDefCap] Berupaya Mempersenjatai Diri Kembali"
 AUS_political_events.27.desc: "[AUS.GetNameDefCap] telah menghubungi kita memohon persetujuan untuk mempersenjatai diri kembali dan menghapuskan Perjanjian Saint-Germain-en-Laye. Menyatakan bahwa kawasan tetangga mereka kian bermusuhan belakangan ini, mereka menyampaikan bahwa mereka tidak lagi merasa aman tanpa tentara sendiri. Pertanyaan ini telah dilayangkan kepada ketiga kekuatan utama penandatangan perjanjian, yaitu [ITA.GetNameDef], [ENG.GetNameDef], dan [FRA.GetNameDef], serta [USA.GetNameDef], dan sesuai ketentuan perjanjian, masing-masing dari kita berhak mengajukan veto jika menginginkannya."
 AUS_political_events.27.a: "Mereka tidak akan menimbulkan bahaya apa pun."
 AUS_political_events.27.b: "Sama sekali tidak boleh."
 AUS_political_events.28.t: "Para Penjamin Menyetujui Persenjataan Kembali"
 AUS_political_events.28.desc: "Kita akhirnya menerima jawaban dari para negara penjamin dan penantian itu terbayar lunas. Setelah serangkaian diskusi dan perundingan panjang di antara mereka, mereka sepakat bahwa kita boleh mempersenjatai diri kembali dan menyatakan Perjanjian Saint-Germain-en-Laye telah usang. Kita tidak lagi terbelenggu oleh dosa-dosa para pendahulu kita."
 AUS_political_events.28.a: "Luar biasa!"
 AUS_political_events.29.t: "Para Penjamin Menolak Permohonan Persenjataan Kembali"
 AUS_political_events.29.desc: "Setelah perundingan yang berlarut-larut dan sekian banyak perdebatan, para penjamin memutuskan untuk tidak merestui permohonan persenjataan kembali kita. Kita telah berupaya meyakinkan mereka dengan akal sehat, namun jawaban mereka tetap bergeming terlepas dari ancaman nyata terhadap kedaulatan dan kemerdekaan kita."
 AUS_political_events.29.a: "Kalau begitu kita tidak punya pilihan lain..."
 AUS_political_events.29.a_tt: "§RDengan memilih ini, Anda akan menghapuskan Perjanjian Saint-Germain-en-Laye secara permanen, namun mungkin akan menimbulkan konsekuensi serius§!"
 AUS_political_events.29.b: "Kita harus merundingkan hal ini kembali!"
 AUS_political_events.29.c: "Mereka menjebak kita menuju kehancuran, tapi apa yang bisa kita perbuat?"
 AUS_political_events.29.c_tt: "§RDengan memilih ini, Perjanjian Saint-Germain-en-Laye akan tetap aktif hingga 16 Juli 1940§!"
 AUS_political_events.30.t: "[AUS.GetNameDefCap] Melanggar Perjanjian Saint-Germain-en-Laye"
 AUS_political_events.30.desc: "[GetTreatyStatus]"
 AUS_treaty_asked_permission_key: "Terlepas dari upaya terbaik kita untuk menghentikan mereka, pemerintah [AUS.GetAdjective] telah memutuskan untuk memerintahkan persenjataan kembali [AUS.GetNameDef] yang secara nyata melanggar perjanjian. Semula kita berharap hal ini tidak akan terjadi, namun tampaknya tidak ada yang dapat menghentikan mereka menempuh jalan ini."
 AUS_treaty_no_permission_key: "Tanpa peringatan apa pun sebelumnya, kita telah diberitahu bahwa [AUS.GetNameDef] tidak lagi bersedia mematuhi Perjanjian Saint-Germain-en-Laye beserta segala ketentuannya. Yang paling mencemaskan, ini berarti mereka kini bebas mempersenjatai diri tanpa mengindahkan batasan yang dijatuhkan pasca Perang Besar. Mengapa mereka mendadak bernafsu mempersenjatai diri masih menjadi tanda tanya besar."
 AUS_political_events.30.a: "Kita tidak dapat menghentikan mereka, tapi kita dapat memperlambat langkah mereka"
 AUS_political_events.30.b: "Biarkan saja mereka berbuat sesuka hati."
 AUS_political_events.30.c: "Tidak ada lagi jaminan kemerdekaan untuk mereka!"
 AUS_broke_the_treaty: "Melanggar Perjanjian Kita"
 AUS_broke_the_treaty_democratic: "Melanggar Perjanjian Kita"
 AUS_political_events.31.t: "[FROM.GetNameDefCap] Menuntut Kompensasi atas Bantuan Mereka"
 AUS_political_events.31.desc: "Saat debu pertempuran mulai mereda pasca perang saudara, kita telah dihubungi oleh pihak [FROM.GetAdjective] mengenai masalah kompensasi atas pengorbanan mereka dalam perang saudara. Mereka menuntut semacam ganti rugi atas jasa yang mereka berikan, nyawa prajurit yang gugur, serta persenjataan yang digunakan dan rusak oleh para sukarelawan mereka."
 AUS_political_events.31.a: "Kita akan membantu di sektor industri."
 AUS_political_events.31.b: "Mereka boleh mengambil sebagian perlengkapan yang kita rampas dari musuh"
 AUS_political_events.31.c: "Dukungan mereka sama sekali tidak berarti"
 AUS_political_events.32.t: "[FROM.GetNameDefCap] Menawarkan Bantuan Membangun Pabrik Baru"
 AUS_political_events.32.desc: "Permohonan kompensasi kita telah didengar oleh kaum nasionalis [FROM.GetAdjective] dan sebagai wujud terima kasih, mereka meminjamkan tenaga kerja serta material untuk membangun sebuah pabrik baru di Niederösterreich. Langkah ini memungkinkan kita mengganti perlengkapan yang hilang dan akan terbukti sangat bermanfaat di masa depan."
 AUS_political_events.32.a: "Bagus sekali!"
 AUS_political_events.33.t: "[FROM.GetNameDefCap] Menawarkan Peralatan Militer Hasil Rampasan"
 AUS_political_events.33.desc: "Permohonan kompensasi kita telah didengar oleh pihak [SPA.GetAdjective] dan sebagai wujud terima kasih, mereka mengirimkan sebagian perlengkapan yang mereka rampas dari lawan selama perang saudara guna mengganti sebagian peralatan kita yang hilang saat membantu mereka."
 AUS_political_events.33.a: "Bagus sekali!"
 AUS_political_events.34.t: "[FROM.GetNameDefCap] Menolak Memberi Ganti Rugi"
 AUS_political_events.34.desc: "Setelah membantu pihak [SPA.GetAdjective] dalam perang saudara mereka, hal paling minim yang kita harapkan adalah semacam ganti rugi dan rasa terima kasih, namun tampaknya harapan kita terlalu muluk. Dengan berdalih bahwa bantuan kita bukan hal yang istimewa, pimpinan [SPA.GetNameDef] menolak gagasan bahwa kita berhak menerima kompensasi atas dukungan yang telah kita kurbankan."
 AUS_political_events.34.a: "Sungguh tak tahu terima kasih..."
 AUS_political_events.35.t: "Aktivitas Paramiliter Memicu Keresahan Sipil"
 AUS_political_events.35.desc: "Kerja sama kita terkini dengan [GetMilitiaName] telah menimbulkan dampak samping yang meresahkan. Seiring organisasi tersebut dilegitimasi oleh pucuk pimpinan negara, [GetMilitiaName] kian bertindak sewenang-wenang terhadap penduduk sipil.\n\nKeresahan di dalam negeri kian meruncing seiring rakyat kita tak lagi merasa tenteram dengan tindak-tanduk organisasi tersebut. Berbagai pertanyaan dilayangkan kepada pimpinan kita mengenai apakah kita sungguh-sungguh mengendalikan [GetMilitiaName], dan apakah keputusan ini benar-benar membantu menjaga keselamatan bangsa."
 AUS_political_events.35.a: "[GetMilitiaName] telah menyia-nyiakan kesempatan mereka."
 AUS_political_events.35.b: "Rakyat hanya perlu menyesuaikan diri."
 AUS_political_events.35.c: "Inilah tatanan baru [ROOT.GetName]!"
 AUS_political_events.36.t: "Masa Depan [ROOT.GetNameDef]"
 AUS_political_events.36.desc: "Perjalanan panjang kita bangkit dari kekuatan kecil yang lumpuh parah merupakan jalan terjal penuh rintangan. Menengok kembali titik awal perjuangan kita menegaskan betapa berharganya pengorbanan ini. Terlahir kembali dan kini jauh lebih perkasa dari sebelumnya, telah tiba saatnya bagi kita menentukan masa depan dan bagaimana bangsa ini ingin dikenal oleh dunia."
 AUS_political_events.36.a: "Pada saatnya kita akan dikenal sebagai [GetGrossosterreichCosmeticIdeology]"
 AUS_grossosterreich_fascism_key: "Großösterreich"
 AUS_grossosterreich_neutrality_key: "Kekaisaran Austria Raya"
 AUS_political_events.36.a_tt: "§YMembuka keputusan§! untuk §YMengintegrasikan Inti Wilayah Jerman§! seiring berjalannya waktu."
 AUS_political_events.36.b: "Kita akan dikenal sebagai Süddeutschland (Jerman Selatan)"
 AUS_political_events.36.c: "Kita sudah sempurna apa adanya"
 AUS_political_events.37.t: "Ultimatum Dari [FROM.GetNameDef]"
 AUS_political_events.37.desc: "[GetIntegrationEventTarget]"
 AUS_integration_target_is_poland_key: "Sebuah pesan bernada keras telah disampaikan kepada kita dari pemerintah [FROM.GetAdjective]. Mereka menuntut kita menyerahkan [Get37PuppetOrNotDesc] kepada mereka dan memperingatkan bahwa akan ada konsekuensi fatal jika kita mencoba melawan.\n\nTindakan agresi dari [FROM.GetNameDef] ini sama sekali tidak mengejutkan menyusul serangkaian tuntutan serupa yang dilancarkan terhadap negara-negara lain di sekitar wilayah ini."
 AUS_integration_target_is_not_poland_key: "Pemerintah [FROM.GetAdjective] telah melayangkan ultimatum kepada kita: serahkan [Get37PuppetOrNotDesc] secara sukarela, atau hadapi kedahsyatan mesin perang mereka yang kini telah bangkit di medan laga. Apapun jalan yang kita pilih dalam persoalan ini, jelas tidak ada jalan keluar tanpa menanggung konsekuensi berat."
 AUS_political_events.37.a: "Kita tidak akan pernah tunduk kepada mereka!"
 AUS_political_events.37.b: "Kita tidak memiliki peluang bertahan menghadapi mereka"
 AUS_political_events.37_tt: "Kita akan menyerahkan wilayah bagian yang mereka klaim kepada mereka."
 37DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 37DescIsNotPuppet: "wilayah-wilayah lama mereka"
 AUS_political_events.38.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.38.desc: "Kita bermaksud memberi kesempatan kepada pihak [FROM.GetAdjective] [Get38PuppetOrNotDesc] ke dalam masyarakat kita, namun tampaknya tawaran murah hati kita tidak digubris. Bagaimanapun juga, kita sangat menyadari bahwa [FROM.GetNameDef] akan bernasib jauh lebih baik di bawah kepemimpinan kita."
 AUS_political_events.38.a: "Mereka akan bergabung dengan kita, terlepas dari apa pun kehendak mereka."
 AUS_political_events.38_tt: "Membuat Tujuan Perang §YRebut Bagian Wilayah yang Diklaim§! terhadap §Y[FROM.FROM.OWNER.GetNameWithFlag]§!"
 38DescIsPuppet: "untuk menyerahkan [FROM.FROM.OWNER.GetName] dan membiarkannya terintegrasi"
 38DescIsNotPuppet: "untuk berintegrasi secara damai"
 AUS_political_events.39.t: "[FROM.GetNameDefCap] Tunduk"
 AUS_political_events.39.desc: "Tanggapan dari kepemimpinan [FROM.GetAdjective] sungguh sangat melegakan. Mereka bersedia meletakkan senjata dan tidak akan melawan saat kita mengintegrasikan apa yang secara sah adalah milik kita. Jelas mereka menyadari betapa sia-sianya menjerumuskan bangsa mereka ke dalam perang tak bermakna hanya demi persoalan ini."
 AUS_political_events.39.a: "Selamat datang di [ROOT.GetNameDef]!"
 AUS_political_events.40.t: "[FROM.GetNameDefCap] Berupaya Bergabung dengan [ROOT.GetFactionName]"
 AUS_political_events.40.desc: "[FROM.GetNameDefCap] telah menghubungi kita memohon untuk bergabung ke dalam faksi kita. Mereka telah memulai program militerisasi dan menyampaikan keinginan untuk bekerja sama demi memperkuat kedua bangsa kita. Secara historis negara tersebut pernah menjadi kekuatan dahsyat yang disegani di medan tempur, dan kendati kini melemah, mereka tetap meyakinkan bahwa mereka akan menjadi sekutu yang sangat berharga bagi kita."
 AUS_political_events.40.a: "Mereka sangat disambut baik untuk bergabung bersama kita"
 AUS_political_events.40.b: "Kita sama sekali tidak membutuhkan mereka."
 AUS_political_events.41.t: "[FROM.GetNameDefCap] Menyetujui Kita Bergabung dengan [FROM.GetFactionName]"
 AUS_political_events.41.desc: "[FROM.GetNameDefCap] membalas permohonan kita untuk bergabung dengan penuh antusiasme dan menyambut kita ke dalam faksi mereka. Kita tidak akan lagi bertempur sendirian melawan mereka yang mengancam keselamatan kita!"
 AUS_political_events.41.a: "Kita jauh lebih kuat bila bersatu!"
 AUS_political_events.42.t: "[FROM.GetNameDefCap] Menolak Membiarkan Kita Bergabung dengan [FROM.GetFactionName]"
 AUS_political_events.42.desc: "Permohonan kita untuk bergabung dengan [FROM.GetFactionName] telah ditolak secara dingin. Kita telah berupaya membuktikan kegunaan kita, namun sayangnya [FROM.GetNameDef] telah menetapkan keputusan mereka. Kendati hal ini sangat menjengkelkan, kita tidak boleh patah arang dan sebaliknya harus mencari jalan keluar lain."
 AUS_political_events.42.a: "Akan kita buktikan kepada mereka!"
 AUS_political_events.43.t: "[FROM.GetNameDefCap] Menuntut [Get43PuppetOrNotTitle]"
 43TitleIsPuppet: "Penyerahan Negara Bawahan Kita"
 43TitleIsNotPuppet: "Penundukan Kita"
 AUS_political_events.43.desc: "Tuntutan bernada keras dari [FROM.GetNameDef] tiba di meja kita pagi ini, menuntut agar kita segera [Get43PuppetOrNotDesc]. Ancaman agresi terselubung membayangi tuntutan tersebut, dan sangat mungkin bahwa pertumpahan darah akan pecah seandainya kita menolak usulan mereka ini."
 43DescIsPuppet: "menyerahkan kendali atas [FROM.FROM.OWNER.GetNameDef] kepada mereka"
 43DescIsNotPuppet: "tunduk pada tuntutan mereka dan menjadi negara bawahan di bawah kekuasaan mereka"
 AUS_political_events.43.a: "Kita tidak berada dalam posisi untuk melawan"
 AUS_political_events.43.a.tt: "§Y[Get43PuppetOrNotTt]§! mungkin dipaksa untuk bergabung ke dalam Faksi [FROM.GetAdjective]"
 AUS_political_events.43.b: "Langkahi dulu mayat kami!"
 AUS_political_events.43.c: "Kita bukan negara bawahan mereka, namun mereka boleh mengambil kembali wilayah-wilayah yang pernah menjadi milik mereka."
 43TtIsPuppet: "[FROM.FROM.OWNER.GetNameDefCap]"
 43TtIsNotPuppet: "[ROOT.GetNameDefCap]"
 AUS_political_events.44.t: "[FROM.GetNameDefCap] Tunduk pada Tuntutan Kita"
 AUS_political_events.44.desc: "Tanggapan terhadap tuntutan kita kepada [FROM.GetNameDef] sungguh sangat disambut baik. Mereka bersedia menyerahkan [Get44PuppetOrNotDesc] ke bawah kekuasaan kita dan menjadi negara bawahan kita, berlaku seketika. Ini menandai keberhasilan gemilang bagi ikhtiar kita dalam menegakkan kembali imperium kita!"
 AUS_political_events.44.a: "Wunderbar!"
 44DescIsPuppet: "[FROM.FROM.OWNER.GetNameDef]"
 44DescIsNotPuppet: "diri mereka sendiri"
 AUS_political_events.45.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.45.desc: "Dalam wujud pembangkangan terang-terangan dan pengabaian atas keselamatan mereka sendiri, [FROM.GetNameDef] telah memutuskan untuk menolak usulan kita. Kesepakatan ini sejatinya saling menguntungkan bagi kedua belah pihak, namun tampaknya mereka tidak memiliki pandangan yang sama mengenai hal ini."
 AUS_political_events.45.a: "Kalau begitu kita selesaikan di medan tempur!"
 AUS_political_events.46.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah Demi Menghindari Penundukan"
 AUS_political_events.46.desc: "Dalam upaya menghindari penundukan mutlak dan pemotongan kedaulatan mereka, pimpinan [FROM.GetAdjective] mengambil langkah drastis. Alih-alih menjadi negara bawahan kita, mereka menyerahkan wilayah-wilayah mereka yang dulunya pernah kita kuasai kepada kita. Ini bukan hasil yang semula kita perkirakan, dan kita kini harus menentukan sikap apakah akan menerimanya atau menolaknya."
 AUS_political_events.46.a: "Bahkan jauh lebih baik!"
 AUS_political_events.46.b: "Tidak. Kita ingin mereka sepenuhnya berada di bawah kendali kita!"
 AUS_political_events.47.t: "[FROM.GetNameDefCap] Menolak Usulan Kompromi"
 AUS_political_events.47.desc: "Terlepas dari upaya terbaik kita untuk menenangkan pihak [FROM.GetAdjective], mereka tampaknya bersikeras bahwa satu-satunya hasil yang dapat diterima adalah kita tunduk pada tuntutan mereka dan membiarkan mereka memasang rezim boneka di negara kita. Mereka menegaskan tidak ada ruang kompromi: kita bersama mereka, atau menjadi musuh mereka."
 AUS_political_events.47.a: "Kita tidak akan mau digertak seperti ini!"
 AUS_political_events.47.b: "Patut dicoba, walau gagal."
 AUS_political_events.48.t: "[FROM.GetNameDefCap] Menobatkan Penguasa Habsburg di Singgasana Kita"
 AUS_political_events.48.desc: "Sudah tak terelakkan mengingat sejarah panjang [FROM.GetNameDef] bahwa, sebagai penguasa atasan kita, cepat atau lambat mereka akan mencampuri urusan politik dalam negeri kita. Kita telah diberitahu secara resmi bahwa mereka telah mengangkat [ROOT.GetLeader] sebagai pemimpin negara kita."
 AUS_political_events.48.a: "Tipikal perbuatan wangsa Habsburg..."
 AUS_political_events.49.t: "[FROM.GetNameDefCap] Menuntut Penyerahan Silesia"
 AUS_political_events.49.desc: "Dunia di sekeliling kita tengah bergolak seiring meruncingnya ketegangan. Hari ini kita menerima telegram diplomatik di mana pemerintah [FROM.GetAdjective] menuntut kita menyerahkan Silesia kepada mereka. Silesia secara historis merupakan bagian dari kekaisaran mereka, namun pasca Perang Besar berada di bawah kendali kita hingga saat ini.\n\n[FROM.GetNameDefCap] menawarkan kompensasi sejumlah pabrik sebagai imbalan atas penyerahan Niederschlesien dan Oberschlesien dengan harapan dapat mempermudah keputusan kita."
 AUS_political_events.49.a: "Baiklah, mereka boleh mengambil wilayah-wilayah itu."
 AUS_political_events.49.b: "Kedaulatan wilayah kita bernilai jauh lebih tinggi daripada itu!"
 AUS_political_events.50.t: "[FROM.GetNameDefCap] Menyerahkan Silesia"
 AUS_political_events.50.desc: "Kita telah menerima jawaban dari pihak [FROM.GetAdjective] mengenai keinginan kita untuk memperoleh kembali Silesia. Mereka dengan lapang dada menyetujui kesepakatan ini dan akan segera mentransfer wilayah-wilayah tersebut kepada kita. Sebagai imbalannya, kita telah membangun beberapa pabrik di wilayah pilihan mereka."
 AUS_political_events.50.a: "Kesepakatan yang paling adil!"
 AUS_political_events.51.t: "[FROM.GetNameDefCap] Menolak Menyerahkan Silesia"
 AUS_political_events.51.desc: "Kawat diplomatik dari duta besar [FROM.GetAdjective] bukanlah apa yang kita harapkan. Tidak hanya [FROM.GetNameDef] menolak mentah-mentah kesepakatan ini, mereka melakukannya dengan nada menghina dan meremehkan, mempertanyakan mengapa mereka harus menyetujui hal semacam itu dan atas hak apa kita merasa berhak menuntut wilayah mereka."
 AUS_political_events.51.a: "Mereka akan menelan kembali kata-kata angkuh itu!"
 AUS_political_events.52.t: "[FROM.GetNameDefCap] Menuntut Integrasi Kita"
 AUS_political_events.52.desc: "Atas dasar klaim kuno dan ikatan darah turun-temurun, penguasa monarki [FROM.GetAdjective] [FROM.GetLeader] menuntut agar kita tunduk ke bawah kekuasaannya. Mengklaim bahwa kota Habsburg, sebagai domain leluhur keluarganya, secara sah merupakan milik negaranya, ia menuntut kita segera berintegrasi, atau menghadapi amukan mesin perang mereka yang baru saja dibangun kembali."
 AUS_political_events.52.a: "Kita tidak punya pilihan selain tunduk"
 AUS_political_events.52.b: "Wangsa Habsburg tidak punya hak apapun atas Habsburg!"
 AUS_political_events.53.t: "[FROM.GetNameDefCap] Berintegrasi Secara Damai"
 AUS_political_events.53.desc: "Kita menerima kabar gembira bahwa pihak [FROM.GetAdjective] tidak akan melawan aneksasi negara mereka dan sebaliknya berintegrasi secara damai ke dalam [ROOT.GetName] kita yang agung. Kita akhirnya berhasil merebut kembali kendali dan kepemilikan atas tanah air leluhur kita: puri dan desa Habsburg."
 AUS_political_events.53.a: "Akhirnya kembali ke pangkuan kita!"
 AUS_political_events.54.t: "[FROM.GetNameDefCap] Menolak Klaim Sah Kita atas Habsburg"
 AUS_political_events.54.desc: "Kita telah menerima tanggapan dari kepemimpinan [FROM.GetAdjective]: mereka tidak akan tunduk pada tuntutan kita. Dengan mencampakkan klaim leluhur kita atas tanah Habsburg, mereka merampas hak milik sah keluarga kerajaan kita dan menodai kehormatan dinasti kita. Penghinaan ini tidak dapat dibiarkan begitu saja!"
 AUS_political_events.54.a: "Demi kejayaan Habsburg!"
 AUS_political_events.55.t: "[FROM.GetNameDefCap] Ingin Membuat Kesepakatan atas Kepemilikan [39.GetName] dan [850.GetName]"
 AUS_political_events.55.desc: "Kepemimpinan [FROM.GetAdjective] telah menghubungi kita dengan sebuah proposal. Sejak lama mereka berhasrat untuk memperoleh kembali [39.GetName] dan [850.GetName] dari kita. Mereka datang menawarkan kompensasi pembangunan beberapa pabrik jika kita bersedia menyerahkan wilayah-wilayah ini secara baik-baik."
 AUS_political_events.55.a: "Kesepakatan yang adil"
 AUS_political_events.55.b: "Tanah air kita bukan barang dagangan!"
 AUS_political_events.56.t: "[GetHostilityItalianClaimTitle56]"
 AUS_seeks_a_deal_title_56: "[FROM.GetNameDefCap] Menyerahkan Wilayah sebagai Imbalan atas Investasi Industri"
 AUS_makes_demands_title_56: "[FROM.GetNameDefCap] Menyerahkan Wilayah"
 AUS_political_events.56.desc: "[GetHostilityItalianClaimDesc56]"
 AUS_seeks_a_deal_desc_56: "Kesepakatan yang kita ajukan kepada [FROM.GetNameDef] telah disetujui. Sebagai imbalan atas investasi industri dalam jumlah besar, pihak [FROM.GetAdjective] sepakat untuk menyerahkan wilayah [39.GetName] dan [850.GetName] sesuai permohonan kita."
 AUS_makes_demands_desc_56: "Tuntutan yang kita layangkan kepada [FROM.GetNameDef] telah disetujui. Pihak [FROM.GetAdjective] akan menyerahkan wilayah [39.GetName] dan [850.GetName] kepada kita segera, dan akhirnya kedua wilayah bersejarah ini kembali menjadi milik kita!"
 AUS_political_events.56.a: "Kabar yang menggembirakan"
 AUS_political_events.57.t: "[GetHostilityItalianClaimTitle57]"
 AUS_seeks_a_deal_title_57: "[FROM.GetNameDefCap] Menolak Kesepakatan yang Kita Usulkan"
 AUS_makes_demands_title_57: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.57.desc: "[GetHostilityItalianClaimDesc57]"
 AUS_seeks_a_deal_desc_57: "Jawaban dari pihak [FROM.GetADjective] telah sampai kepada kita; mereka menolak kesepakatan tersebut. Menegaskan bahwa tanah air mereka tidak untuk diperjualbelikan, mereka dengan tegas menolak segala kemungkinan penjualan ataupun kesepakatan apa pun terkait wilayah yang bersangkutan."
 AUS_makes_demands_desc_57: "Tuntutan yang kita kirimkan kepada pimpinan [FROM.GetAdjective] ditanggapi dengan kemarahan. Mereka menolak tuntutan kita tanpa menyisakan ruang sedikit pun untuk negosiasi lebih lanjut."
 AUS_political_events.57.a: "Mereka akan menyesali keras kepalanya ini!"
 AUS_political_events.58.t: "[FROM.GetNameDefCap] Menuntut Kepemilikan atas [39.GetName] dan [850.GetName]"
 AUS_political_events.58.desc: "[FROM.GetNameDefCap] telah menghubungi kita dengan apa yang tampak seperti sebuah ancaman terselubung. Tanpa kata-kata manis, mereka memberi tahu kita bahwa mereka menginginkan kepemilikan atas [39.GetName] dan [850.GetName] yang mereka klaim sebagai hak mereka. Wilayah-wilayah tersebut dulunya merupakan bagian dari jantung negeri [FROM.GetAdjective], namun sejak Perang Besar telah menjadi milik kita."
 AUS_political_events.58.a: "Pertahankan Jansa dan jalankan rencananya!"
 AUS_political_events.58.b: "Singkirkan Jansa demi menenangkan Berlin."
 AUS_political_events.59.t: "[FROM.GetNameDefCap] Mendukung Rencana Alfred Jansa"
 AUS_political_events.59.desc: "Pemerintah [FROM.GetNameDef] sekali lagi menaruh kepercayaan mereka kepada Alfred Jansa, seorang marsekal lapangan dengan sentimen yang jelas-jelas anti-[ROOT.GetAdjective]. Dengan rancangan memperkuat perbatasan dan rencana pertahanan yang dirancang khusus untuk memukul balik serangan dari kita, marsekal ini telah menjadi duri dalam daging bagi kita sebelumnya dan kemungkinan besar akan menjadi ancaman serupa lagi."
 AUS_political_events.59.a: "Pengorbanan yang pahit demi perdamaian."
 AUS_political_events.59.b: "Itu adalah keputusan mereka sendiri"
 AUS_political_events.60.t: "[FROM.GetNameDefCap] Keberatan atas Rencana Pertahanan Alfred Jansa"
 AUS_political_events.60.desc: "Sebuah nota keberatan resmi dari [FROM.GetNameDef] terkait komitmen kita belakangan ini terhadap rencana pertahanan yang digagas Alfred Jansa telah dilayangkan. Mereka mengklaim bahwa tindakan ini jelas-jelas diambil atas dasar permusuhan terhadap mereka dan akan merintangi hubungan diplomatik kita di masa depan. Kita sendiri tidak yakin mengapa hal ini memicu reaksi yang sedemikian sengit."
 AUS_political_events.60.a: "Austria akan bertahan!"
 AUS_political_events.60.a_tt: "§YFranz Böhme§! akan menjadi §GTersedia§! sebagai Kepala Angkatan Darat.\n\n§YAlfred Jansa§! akan §RTidak lagi tersedia§! sebagai Kepala Angkatan Darat."
 AUS_political_events.60.b: "Justru karena itulah Alfred Jansa harus tetap bertahan!"
 AUS_political_events.60.b_tt: "§YAlfred Jansa§! akan tetap tersedia sebagai Kepala Angkatan Darat"
 AUS_political_events.61.t: "[FROM.GetNameDefCap] Memberhentikan Alfred Jansa"
 AUS_political_events.61.desc: "Tekanan kita agar pihak [FROM.GetAdjective] segera mengganti Alfred Jansa beserta rencana pertahanannya yang gegabah telah membuahkan hasil. Sebagai pengganti Jansa yang sangat anti-[ROOT.GetAdjective], kaum [FROM.GetAdjective] kini menunjuk Franz Böhme yang jauh lebih kompromistis."
 AUS_political_events.61.a: "Bagus sekali!"
 AUS_political_events.62.t: "[FROM.GetNameDefCap] Tetap Mempertahankan Alfred Jansa"
 AUS_political_events.62.desc: "Meskipun kita menuntut agar [FROM.GetNameDef] membatalkan penerapan apa yang disebut Rencana Jansa dan memastikan perwira tersebut tidak memegang kekuasaan apapun, pihak [FROM.GetAdjective] menolak mendengarkan tuntutan kita. Kita hanya bisa menyimpulkan bahwa ini adalah pertanda buruk bagi hubungan masa depan kita."
 AUS_political_events.62.a: "Berani-beraninya mereka?"
 AUS_political_events.63.t: "Kaum Pengasingan [AUS.GetAdjective] Menawarkan Jasa Mereka"
 AUS_political_events.63.desc: "Anschluss terhadap [AUS.GetNameDef] telah membuat banyak warga [AUS.GetAdjective] yang menentang pencaplokan ini hidup dalam pengasingan di luar negeri. Sebagian dari pembangkang ini kini tiba di [ROOT.GetNameDef] dan menawarkan jasa mereka di pabrik-pabrik, di jalanan, dan di garis depan."
 AUS_political_events.63.a: "Kita tidak dapat menjamin loyalitas mereka"
 AUS_political_events.63.b: "Kita membutuhkan bantuan mereka"
 AUS_political_events.64.t: "[FROM.GetNameDefCap] Menawarkan Dukungan Industri"
 AUS_political_events.64.desc: "Tampaknya tanpa dipicu oleh alasan khusus, pihak [FROM.GetAdjective] menghubungi kita dengan tawaran untuk membantu memajukan industri kita lebih jauh. Mereka menawarkan diri untuk menanggung sebagian dari produksi barang konsumen sipil kita agar kita dapat lebih memfokuskan diri pada pembangunan pabrik."
 AUS_political_events.64.a: "Sebuah kejutan yang disambut baik!"
 AUS_industrial_help: "Dukungan Industri"
 AUS_political_events.65.t: "[FROM.GetNameDefCap] Menawarkan Dukungan Pasar"
 AUS_political_events.65.desc: "Tampaknya tanpa dipicu oleh alasan khusus, pihak [FROM.GetAdjective] menghubungi kita dengan tawaran diskon untuk peralatan militer mereka di Pasar Internasional. Apakah ini sekadar taktik agar kita membeli lebih banyak dari mereka atau tawaran tulus, masih belum dapat dipastikan."
 AUS_political_events.65.a: "Bagaimanapun juga, ini sangat bermanfaat!"
 AUS_market_help: "Dukungan Pasar"
 AUS_political_events.66.t: "[FROM.Get.GetNameDefCap] Mengusulkan Uni Federatif"
 AUS_political_events.66.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kita dengan apa yang ia sebut sebagai tawaran persatuan. Seiring federasi berkembang, semakin penting bagi semua negara yang terlibat untuk bekerja sama secara erat tanpa celah. Demi menyederhanakannya, [FROM.GetLeader] menyarankan agar kita semua bersatu di bawah kepemimpinan mereka.\n\nKita memang harus memberikan konsesi terkait kedaulatan kita, namun sebagai bagian dari satu negara federatif yang padu, kita juga akan menikmati rasa aman dari tentara yang jauh lebih besar dan kekuatan diplomasi yang lebih disegani."
 AUS_political_events.66.a: "Terdengar seperti kesepakatan yang adil"
 AUS_political_events.66.b: "Ini sama sekali tidak menguntungkan kita!"
 AUS_political_events.67.t: "[FROM.GetNameDefCap] Menerima Uni Federatif"
 AUS_political_events.67.desc: "Kabar gemilang bahwa [FROM.GetNameDef] telah sepakat untuk menjadi bagian dari negara federatif baru kita baru saja tiba. Apa yang kita tawarkan terbukti cukup memuaskan bagi mereka untuk menganggap tawaran ini menguntungkan terlepas dari sedikit pengorbanan pada kedaulatan mereka."
 AUS_political_events.67.a: "Luar biasa!"
 AUS_political_events.68.t: "[FROM.GetNameDefCap] Menolak Bergabung dalam Uni Federatif"
 AUS_political_events.68.desc: "Terlepas dari keuntungan nyata dan fakta bahwa ini adalah yang terbaik bagi federasi, [FROM.GetNameDef] telah menolak usulan kita untuk persatuan yang lebih erat. Kita hanya bisa berspekulasi mengenai motif mereka, namun tampaknya mereka tidak memiliki niat baik bagi keutuhan masa depan federasi."
 AUS_political_events.68.a: "Mereka adalah ancaman bagi persatuan federasi!"
 AUS_political_events.68.b: "Kita akan mengawasi gerak-gerik mereka dengan ketat"
 AUS_political_events.69.t: "Risiko Anschluss Berhasil Dimitigasi"
 AUS_political_events.69.desc: "[GetHowAvoidedAnschluss]"
 AUS_joined_faction: "Dengan kini menjadi bagian dari [ROOT.GetFactionName], tampaknya [GER.GetLeader] telah membatalkan niatnya untuk mencoba mencaplok kita ke dalam [GER.GetNameDef].\n\nKita telah berjuang mati-matian memastikan kemerdekaan kita tetap terjaga, dan hasilnya sungguh sepadan dengan segala jerih payah kita."
 AUS_became_subject: "[ROOT.GetNameDefCap] tengah mengalami perubahan radikal sejak kita kehilangan kemerdekaan penuh. Kendati banyak di antaranya merupakan dampak pahit dari status bawahan, satu dampak positif yang langka kini tersingkap di hadapan kita. Dengan status kita saat ini, setiap upaya untuk menganeksasi kita akan memicu amarah dari pihak yang jauh lebih besar daripada sekadar bangsa kita sendiri.\n\nSadar akan hal itu, tampaknya [GER.GetLeader] telah membatalkan rencana memaksakan pencaplokan kita ke dalam [GER.GetNameDef]."
 AUS_political_events.69.a: "Secercah harapan di tengah situasi genting kita"
 AUS_political_events.69.b: "Kedamaian dan keselamatan bagi zaman kita!"
 AUS_political_events.69.a_tt: "Menghapus Keputusan §YLangkah-Langkah Anti-Anschluss§!."
 AUS_political_events.70.t: "Pemerintah [FROM.GetAdjective] Menawarkan Kompensasi sebagai Imbalan Jaminan"
 AUS_political_events.70.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kita secara pribadi kali ini. Interaksi diplomatik kita sebelumnya tidak membuahkan hasil seperti yang mereka harapkan, sehingga mereka memutuskan untuk mengajukan tawaran baru dengan harapan dapat mengubah pendirian kita.\n\nMengingat ini adalah masalah hidup dan mati bagi mereka, mereka menawarkan untuk menanggung biaya pembangunan dua pabrik baru di negara kita, dan meyakinkan kita akan rasa terima kasih mereka seandainya kita bersedia mengubah pikiran dan memberi mereka jaminan perlindungan."
 AUS_political_events.70.a: "Itu mengubah segalanya!"
 AUS_political_events.70.b: "Jawaban kita tidak berubah: Tidak."
 AUS_political_events.71.t: "[FROM.GetNameDefCap] Memberikan Jaminan atas Bantuan Industri"
 AUS_political_events.71.desc: "Upaya kita meyakinkan pemimpin [FROM.GetAdjective] [FROM.GetLeader] akhirnya membuahkan hasil manis. Kita diwajibkan menyokong pembangunan dua pabrik untuk mereka, dan kendati ini akan sedikit memperlambat ekspansi industri kita sendiri, kita kini dapat bernapas lebih lega mengetahui bahwa mereka berada di pihak kita seandainya terjadi serangan terhadap kedaulatan kita."
 AUS_political_events.71.a: "Kabar baik, akhirnya!"
 AUS_political_events.72.t: "[FROM.GetNameDefCap] Menolak Membantu Terlepas dari Tawaran Kompensasi"
 AUS_political_events.72.desc: "Tidak dapat dipungkiri bahwa kita telah berupaya sekuat tenaga. Kita telah merujuk pada Perjanjian Saint-Germain-en-Laye, dan kita telah menawarkan kompensasi jauh melampaui apa yang sewajarnya diharapkan dari negara seukuran kita dalam situasi genting ini. Terlepas dari semua itu, [FROM.GetNameDef] tetap bersikukuh menolak memberi jaminan sesuai perjanjian yang sejatinya mereka rumuskan sendiri. Kita tidak dapat lagi mengandalkan bantuan mereka di masa depan."
 AUS_political_events.72.a: "Kita akan bertahan, dan kita buktikan kepada mereka!"
 AUS_political_events.73.t: "[FROM.GetNameDef] Mengusulkan Revisi Perjanjian Saint-Germain-en-Laye"
 AUS_political_events.73.desc: "\nTetap gigih dalam ikhtiar mereka untuk diizinkan mempersenjatai diri kembali, pihak [FROM.GetAdjective] kembali menghubungi kita mengajukan revisi perjanjian yang lebih lunak agar kita dapat mengontrol laju persenjataan mereka. Revisi ini mengizinkan mereka mulai melatih pasukan, namun industri pertahanan mereka akan tetap dibatasi selama satu tahun lagi."
 AUS_political_events.73.a: "Kita dapat menerimanya"
 AUS_political_events.73.a_tt: "Kita akan mendukung usulan revisi [FROM.GetNameDef]. Semua Penjamin harus sepakat agar revisi dapat disahkan."
 AUS_political_events.73.b: "Tidak, perjanjian harus tetap utuh."
 AUS_political_events.73.b_tt: "Kita §Rtidak§! akan mendukung usulan revisi [FROM.GetNameDef]. Semua Penjamin harus sepakat agar revisi dapat disahkan."
 AUS_political_events.73.c: "Jika mereka hendak mempersenjatai diri, kita menuntut adanya pengawas resmi!"
 AUS_political_events.73.c_tt: "Seorang Pengawas berhaluan demokratis akan ditunjuk untuk bertugas di Austria selama berlakunya Perjanjian yang direvisi"
 AUS_political_events.74.t: "Para Penjamin Menyetujui Revisi Perjanjian"
 AUS_political_events.74.desc: "Kabar gembira akhirnya tiba dari para penjamin perjanjian. Setelah negosiasi panjang, mereka sepakat untuk merevisi Perjanjian Saint-Germain-en-Laye dan mengizinkan kita merekrut serta melatih kembali tentara pertahanan kita."
 AUS_political_events.74.a: "Langkah awal menuju kedaulatan sejati!"
 AUS_political_events.75.t: "Para Penjamin Menolak Revisi Perjanjian"
 AUS_political_events.75.desc: "Bagaimanapun upaya kita, para penjamin tetap bergeming. Kita tidak diizinkan untuk mempersenjatai diri kembali dalam keadaan apa pun. Usaha diplomatik kita untuk meyakinkan mereka dan menawarkan kompromi telah menemui jalan buntu. Rakyat [ROOT.GetAdjective] kini menyimpan kebencian mendalam terhadap para Penjamin tersebut."
 AUS_political_events.75.a: "Kita hanya perlu bertahan lebih lama"
 AUS_political_events.75.b: "Sudah cukup, kita tidak butuh izin mereka!"
 AUS_political_events.76.t: "Para Penjamin Menyetujui Revisi Perjanjian, Menunjuk Pengawas"
 AUS_political_events.76.desc: "\nSetelah sekian banyak perdebatan dan diskusi alot, para Penjamin akhirnya mencapai mufakat. Kita akan diizinkan mempersenjatai diri secara bertahap seiring berjalannya waktu; mulai hari ini tidak ada lagi batasan yang menghalangi kita melatih prajurit baru dan menambah jumlah pasukan di medan tempur. Industri pertahanan kita masih dikenai pembatasan meski kini jauh lebih longgar. Pembatasan tersebut akan dicabut sepenuhnya dalam satu tahun, asalkan tidak terjadi perubahan drastis di panggung dunia.\n\nNamun kemenangan ini harus dibayar mahal. Para Penjamin tidak mempercayai kemampuan kita untuk menjauhkan diri dari konflik, dan menunjuk seorang pengawas resmi yang wajib berada di pemerintahan kita selama proses transisi ini berlangsung."
 AUS_political_events.76.a: "Kita terima persyaratannya!"
 AUS_political_events.77.t: "Ancaman yang Sudah di Depan Mata"
 AUS_political_events.77.desc: "Beberapa diplomat kita yang paling berpengalaman dan cakap telah lama memantau ancaman bahwa [GER.GetNameDef] akan melancarkan rencana yang terkadang dikonfirmasi, terkadang disangkal oleh [GER.GetLeader]. Tampaknya telah terjadi pergeseran radikal belakangan ini dan sumber intelijen kita kini meyakini bahwa upaya mencaplok bangsa kita kemungkinan besar sudah berada di depan mata."
 AUS_political_events.77.a: "Bersiap menghadapi benturan dahsyat..."
 AUS_political_events.77.a_tt: "§R[GER.GetNameWithFlag] telah memulai proses Anschluss terhadap kita. Kita tidak dapat lagi mencegahnya secara diplomatis!§!"
 AUS_political_events.78.t: "Kaum Komunis di [FROM.GetNameDef] Mengharapkan Dukungan Kita"
 AUS_political_events.78.desc: "Para pemimpin [FROM.GetCommunistParty] di [FROM.GetNameDef] telah menghubungi kita memohon bantuan sekali lagi. Kendati mereka saat ini tidak terlibat dalam konflik bersenjata terbuka, kegagalan pahit perang saudara dan kudeta tahun 1934 bersama kaum Sosial Demokrat masih membekas membara di benak mereka. Mereka mendambakan bantuan kita seiring mereka kembali berikhtiar merebut kekuasaan di negeri mereka."
 AUS_political_events.78.a: "Kita akan membantu jika sanggup!"
 AUS_political_events.78.b: "Kita memiliki prioritas lain yang lebih mendesak"
 AUS_political_events.79.t: "[FROM.GetNameDefCap] Menawarkan Dukungan Mereka"
 AUS_political_events.79.desc: "Persis seperti yang kita harapkan, pimpinan [FROM.GetAdjective] telah menawarkan dukungan kepada kita di masa-masa penuh ujian ini. Kita tentu tidak dapat menggantungkan diri sepenuhnya kepada mereka untuk menuntaskan semua masalah kita, namun memiliki dukungan mereka sekali lagi jelas merupakan bantuan yang sangat berharga. Terutama di saat perjuangan perebutan kekuasaan kita terus bergulir."
 AUS_political_events.79.a: "Bagus sekali!"
 AUS_political_events.79.a_tt: "Seandainya perang pecah, [FROM.GetFlag]§Y[FROM.GetNameDef]§! lebih berpeluang mengirimkan sukarelawan dan peralatan sewa-pinjam (lend-lease) kepada kita."
 AUS_political_events.80.t: "[FROM.GetNameDefCap] Menolak Panggilan Bantuan Kita"
 AUS_political_events.80.desc: "Dengan alasan perbedaan ideologis kecil dan keraguan kita terhadap komunisme revolusioner, [FROM.GetNameDef] telah menolak seruan bantuan kita. Kita terpaksa harus berdiri tegak di atas kaki kita sendiri."
 AUS_political_events.80.a: "Semula kita sungguh mengira mereka akan membantu!"
 AUS_political_events.81.t: "[FROM.GetNameDefCap] Menyelaraskan Diri dengan Politik Kita"
 AUS_political_events.81.desc: "Selama kurun waktu yang panjang, kaum [FROM.GetAdjective] dengan keras kepala memegang teguh bentuk komunisme khas mereka sendiri, yang dikenal sebagai Austromarksisme. Perpecahan politik ini merupakan perpaduan antara demokrasi sosial dan komunisme sejati yang kurang kita sukai. Tampaknya kini mereka akhirnya sadar dan menghapuskan kekeliruan ideologis tersebut untuk menyelaraskan diri dengan kita demi meraih simpati dan perlindungan kita seandainya kekuatan musuh menyerang mereka."
 AUS_political_events.81.a: "Bagus, kita akan menawarkan perlindungan kita"
 AUS_political_events.81.b: "Mereka akan menjadi sekutu yang paling berharga... tapi belum saatnya."
 AUS_aligned_with_our_values: "Selaras dengan Nilai-Nilai Kita"
 AUS_political_events.82.t: "[FROM.GetNameDefCap] Menawarkan Jaminan"
 AUS_political_events.82.desc: "Keputusan kita untuk menyelaraskan diri lebih erat dengan ideologi politik [FROM.GetLeader] telah disambut baik. [FROM.GetNameDefCap] telah menawarkan jaminan perlindungan kepada kita dan akan menyokong kita seandainya kita menjadi sasaran agresi asing."
 AUS_political_events.82.a: "Luar biasa!"
 AUS_political_events.83.t: "[FROM.GetNameDefCap] Merestui Pergeseran Politik Kita"
 AUS_political_events.83.desc: "Keputusan kita untuk menyelaraskan diri lebih dekat dengan haluan politik [FROM.GetLeader] telah diterima dengan hangat. [FROM.GetNameDefCap] telah menyatakan apresiasi mereka atas langkah ini sebagai langkah menuju arah yang tepat, dan berharap dapat menyambut kita sebagai sekutu sejati di masa depan."
 AUS_political_events.83.a: "Kita menantikan masa itu tiba!"
 AUS_political_events.84.t: "Kaum [FROM.GetAdjective] Membakar Sentimen Komunis di Negara Kita"
 AUS_political_events.84.desc: "\nTelah dilaporkan kepada kita bahwa saat ini ada upaya sistematis dari pihak [AUS.GetNameDef] untuk mengobarkan sentimen komunis di kalangan kaum buruh kita. Kendati hal ini bisa saja sekadar propaganda tanpa bahaya langsung, ada kemungkinan ini adalah persiapan terselubung untuk aksi subversi. Kita belum mengetahui niat sejati mereka, namun kita harus memperhitungkan segala kemungkinan terburuk."
 AUS_political_events.84.a: "Kita tidak melihat ada masalah dalam hal ini"
 AUS_political_events.84.b: "Larang dan bubarkan mereka!"
 AUS_political_events.84.b_tt: "§RIni dapat memicu konsekuensi yang sangat fatal!§!"
 AUS_political_events.85.t: "[FROM.GetNameDefCap] Mengizinkan Upaya Pengorganisasian Buruh Kita"
 AUS_political_events.85.desc: "\nKita sepenuhnya sadar bahwa kegiatan kita di [FROM.GetNameDef] cepat atau lambat akan terendus. Bersyukur tampaknya [FROM.GetLeader] tidak mempermasalahkan kita menggalang sentimen komunis di kalangan tenaga kerja mereka, memberi pencerahan kepada kaum proletar mengenai hak-hak dan kewajiban mereka sebagai buruh sejati."
 AUS_political_events.85.a: "Sempurna"
 AUS_political_events.85.a_tt: "Membuka keputusan untuk §YMenuntut Pembebasan Kaum Buruh§! setelah fokus §YMenuntut Pembebasan Kaum Buruh§! selesai"
 AUS_political_events.85.2.a_tt: "Membuka keputusan untuk §YMenuntut Pembebasan Kaum Buruh di [FROM.GetNameDef]§!."
 AUS_political_events.86.t: "[FROM.GetNameDefCap] Melarang Gerakan Pengorganisasian Buruh"
 AUS_political_events.86.desc: "\nDalam tindakan pelecehan terhadap para pekerjanya sendiri, [FROM.GetLeader] telah melarang segala ikhtiar kita untuk menyadarkan mereka akan hak-hak mereka dalam masyarakat. Ini adalah tindakan permusuhan terbuka, bukan hanya kepada kita, tetapi juga kepada seluruh kaum buruh di seantero dunia."
 AUS_political_events.86.a: "Keparat!"
 AUS_political_events.86.b: "Kita akan membalas permusuhan ini!"
 AUS_political_events.87.t: "Tuntutan [FROM.GetAdjective] untuk Rezim Komunis"
 AUS_political_events.87.desc: "Menyusul merebaknya sentimen komunis seiring propaganda [FROM.GetAdjective] menjalar di kalangan kaum buruh kita, sebuah ultimatum kini telah tiba di hadapan kita. [FROM.GetLeader] menuntut agar kita mengizinkan pengambilalihan kekuasaan secara damai oleh kaum komunis sebagaimana ia anggap sebagai kehendak rakyat kita. Seandainya kita menolak, ia menegaskan bahwa mereka akan berdiri membela kaum buruh kita dalam tindakan apa pun yang hendak mereka lancarkan."
 AUS_political_events.87.a: "Kita tidak punya pilihan lain."
 AUS_political_events.87.b: "Kitalah yang menentukan takdir bangsa kita sendiri."
 AUS_political_events.88.t: "[FROM.GetNameDefCap] Membentuk Pemerintahan Komunis"
 AUS_political_events.88.desc: "Perjuangan tanpa kenal lelah kita di [FROM.GetNameDef] akhirnya terbayar lunas. Kaum buruh bersukacita saat pemimpin baru kawan [FROM.GetLeader] mengambil alih kendali kepemimpinan negara."
 AUS_political_events.88.a: "Selamat datang, para kawan seperjuangan!"
 AUS_political_events.89.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.89.desc: "Terlepas dari pertanda jelas bahwa rakyat mereka menginginkannya, pihak [FROM.GetAdjective] dan pemimpin mereka [FROM.GetLeader] memilih untuk tidak mengundurkan diri demi pemerintahan yang lebih layak. Kita harus mempertimbangkan pilihan kita dan melakukan apa yang benar demi kaum tertindas."
 AUS_political_events.89.a: "Perang terbuka hanya akan membawa kehancuran yang lebih parah"
 AUS_political_events.89.b: "Suara rakyat tertindas harus didengar!"
 AUS_political_events.90.t: "Hasil Pemilihan Umum Kita"
 AUS_political_events.90.desc: "Pemilihan umum pertama sejak peristiwa 'Peniadaan Parlemen Mandiri' telah selesai digelar. Partisipasi pemilih sangat tinggi seiring bangsa kita menyadari kehancuran apa yang menimpa negara jika mereka melalaikan kewajiban sebagai warga negara. Tiga kandidat utama bersaing sengit dengan selisih suara yang sangat tipis dalam penghitungan akhir."
 AUS_political_events.90.a: "Kurt Schuschnigg adalah seorang demokrat sejati di lubuk hatinya!"
 AUS_political_events.90.a_tt: "§YKurt Schuschnigg§! menjadi pemimpin untuk partai §YDemokrat§!."
 AUS_political_events.90.b: "Karl Renner telah mengabdi dengan gemilang kepada kita sebelumnya!"
 AUS_political_events.90.c: "Vinzenz Schumy dapat merangkul sebagian besar aspirasi pemilih!"
 AUS_political_events.91.t: "[ROOT.GetLeader] Ingin Berada di Medan Laga"
 AUS_political_events.91.desc: "Belakangan ini kita mendapati Adipati Agung kita, Yang Mulia [ROOT.GetLeader], tiada henti memikirkan situasi di garis depan. Beliau merasa tidak berbuat cukup dan berhasrat memimpin pasukannya secara langsung. Hari ini persoalan itu diangkat kembali; sang Adipati Agung berkehendak gagah berani memimpin prajuritnya dalam pertempuran dan menyerahkan roda pemerintahan kepada sosok lain."
 AUS_political_events.91.a: "Majulah ke medan laga, Adipati Agung! Kami akan menunjuk seseorang menjaga singgasana Anda"
 AUS_political_events.91.b: "Bahkan seorang Adipati Agung pun harus tetap berada di istana"
 AUS_political_events.91.a_tt: "Ibu Kota baru akan bernama §YVaduz§!"
 AUS_political_events.91.a_tt2: "§YOtto von Habsburg§! menjadi Marsekal Lapangan §YTingkat 2§!"
 AUS_political_events.92.t: "[FROM.GetNameDefCap] Mengajukan Pembelian Alaska"
 AUS_political_events.92.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kita dengan permohonan untuk membeli wilayah [463.GetName]. Pada tahun 1867 ketika wilayah itu dibeli dari Kekaisaran Rusia oleh [USA.GetNameDef], tawaran penjualan semula pertama kali diajukan kepada [FROM.GetNameDef]. Tawaran itu ditolak kala itu, namun sejak saat itu mereka berubah pikiran dan kini ingin membeli wilayah tersebut dari kita. Sebagai imbalannya, mereka menawarkan bayaran yang sangat menggiurkan."
 AUS_political_events.92.a: "Kedaulatan wilayah kita tidak untuk dijual!"
 AUS_political_events.92.b: "Kita tidak memerlukan [463.GetName]"
 generic_this_might_cause_tt: "§RHal ini dapat memicu§!:"
 AUS_political_events.93.t: "[FROM.GetNameDefCap] Menjual [463.GetName] kepada Kita"
 AUS_political_events.93.desc: "Kita telah menerima kabar dari [FROM.GetLeader] bahwa mereka sepakat menjual wilayah [463.GetName] kepada kita dengan harga yang telah kita tawarkan. Wilayah tersebut akan dialihkan kepada kita segera agar proses integrasi dapat segera dimulai."
 AUS_political_events.93.a: "Luar biasa"
 AUS_political_events.94.t: "[FROM.GetNameDefCap] Menolak Menjual [463.GetName]"
 AUS_political_events.94.desc: "Meskipun kita menawarkan sejumlah besar uang kepada [FROM.GetNameDef] untuk memperoleh [463.GetName], mereka menolak kesepakatan ini. Kita memiliki klaim historis yang sangat sah atas [463.GetName] yang kini mereka tolak secara sepihak. Kita harus memikirkan jalan terbaik selanjutnya."
 AUS_political_events.94.a: "Patut dicoba walau gagal"
 AUS_political_events.94.b: "Kita akan membebaskan mereka dengan kekuatan senjata!"
 AUS_political_events.95.t: "Tentara [ROOT.GetAdjective] Kembali Pasca Ekspedisi yang Sukses"
 AUS_political_events.95.desc: "Ketika Perang Austria-Prusia berakhir pada 22 Juli 1866, tentara gagah berani kita berbaris kembali ke tanah air. Konon dikisahkan ada satu prajurit lebih banyak di barisan saat pulang dibanding saat berangkat perang. Apakah kisah ini nyata atau sekadar legenda rakyat masih diperdebatkan. Namun kini kita dapat memastikan keajaiban itu terulang kembali saat tentara agung kita pulang, satu prajurit lebih kuat."
 AUS_political_events.95.a: "Selamat datang di [ROOT.GetNameDef]!"
 AUS_political_events.95.a_tt: "Satu patriot sejati [ROOT.GetAdjective] telah bergabung ke dalam barisan kita"
 AUS_political_events.96.t: "[FROM.GetNameDefCap] Ingin Bergabung dengan [ROOT.GetFactionName]"
 AUS_political_events.96.desc: "[FROM.GetLeader] dari negara [FROM.GetName] yang baru saja beralih ke demokrasi telah mendekati kita memohon untuk bergabung ke dalam [ROOT.GetFactionName]. Kendati mereka berdiri sendirian sejak berakhirnya Perang Besar, iklim politik terkini dan memuncaknya ketegangan dunia membuat mereka berubah pikiran. Melihat mereka kini telah menjadi negara demokrasi sejati, mereka memilih merapat kepada kita, meyakinkan bahwa mereka akan menjadi aset tak ternilai bagi faksi kita!"
 AUS_political_events.96.a: "Mereka sangat disambut baik untuk bergabung!"
 AUS_political_events.96.b: "Kita tidak mempercayai mereka."
 AUS_political_events.97.t: "[FROM.GetNameDefCap] Menyambut Kita ke Dalam [ROOT.GetFactionName]"
 AUS_political_events.97.desc: "Permohonan kita untuk bergabung dengan [ROOT.GetFactionName] telah disetujui! Kendati kita sangat yakin bahwa perubahan haluan drastis ini adalah apa yang dibutuhkan negeri kita, ada bobot tanggung jawab berat dalam situasi ini. Pasca Perang Besar kita memutuskan segala ikatan persekutuan dengan harapan bencana serupa tak akan terulang. Kini saat kita bernaung dalam rasa aman dari aliansi baru kita, hal itu disertai kesadaran mendalam bahwa perdamaian sejatinya adalah hal yang sangat rapuh."
 AUS_political_events.97.a: "Langkah ini mutlak harus diambil"
 AUS_political_events.98.t: "[FROM.GetNameDefCap] Menolak Permohonan Kita Bergabung dengan [FROM.GetFactionName]"
 AUS_political_events.98.desc: "Terlepas dari ikhtiar terbaik kita, permohonan yang kita kirimkan kepada pihak [FROM.GetAdjective] untuk bergabung ke dalam [FROM.GetFactionName] telah ditolak mentah-mentah. Jawaban mereka tidak menyertakan alasan yang jelas dan tampaknya kita kembali dibiarkan berjuang sendirian."
 AUS_political_events.98.a: "Sungguh keterlaluan perlakuan mereka!"
 AUS_political_events.98.b: "Tampaknya kita harus menuntaskan segala sesuatunya sendiri!"
 AUS_political_events.99.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.99.desc: "[GetRejectionAmounts]"
 AUS_has_not_rejected_before: "[FROM.GetLeader] dari kepemimpinan [FROM.GetAdjective] telah membalas tuntutan kita. Surat diplomatik itu bernada sopan namun sarat akan nada penghinaan terselubung. Kekhawatiran kita dianggap angin lalu, membuktikan bahwa kecurigaan kita terhadap [FROM.GetNameDef] selama ini terbukti beralasan. Sebagian petinggi kita mendesak agar terus menekan pihak [FROM.GetAdjective] untuk tunduk demi memuluskan rencana masa depan kita terhadap mereka, sementara faksi minoritas berpendapat kita sebaiknya membiarkan pihak [FROM.GetAdjective] menikmati kemenangan semu ini."
 AUS_GER_cannot_take_a_no: "Kendati tekanan terus berlanjut dan kian meningkat terhadap [FROM.GetNameDef], [FROM.GetLeader] tetap teguh mempertahankan sikap [FROM.GetLeader.GetHerHis]. Arthur Seyss-Inquart tidak akan diizinkan masuk sebagai penasihat dalam pemerintahan, apa pun yang kita katakan atau lakukan. Kita harus mencari jalan lain; ini hanyalah rintangan kecil belaka."
 AUS_political_events.99.a: "Mereka akan tunduk kepada kita!"
 AUS_refuses_to_submit: "Menolak Tunduk kepada Kita"
 AUS_political_events.99.b: "Biarkan mereka menikmati ini sejenak, agar mereka lengah..."
 AUS_bullied_austria: "Menindas [AUS.GetNameDef]"
 AUS_political_events.100.t: "Tekanan Lanjutan untuk Mengangkat Arthur Seyss-Inquart"
 AUS_political_events.100.desc: "\nTerlepas dari penolakan tegas kita sebelumnya untuk mengangkat Arthur Seyss-Inquart ke dalam kabinet, pemimpin [FROM.GetAdjective] [FROM.GetLeader] tak henti-hentinya menuntut hal itu dilaksanakan. Kendati tekanan diplomatik kian menghimpit kita, kita tetap mempertahankan kedaulatan atas urusan dalam negeri kita, dan keputusan akhir tetap berada di tangan kita."
 AUS_political_events.100.a: "Pasti ada muslihat jahat di balik tekanan ini, jangan pernah gentar!"
 AUS_trying_to_control_us: "Berupaya Mengendalikan Kita"
 AUS_political_events.100.b: "Kita menanggung risiko pembalasan mematikan jika menolak"
 AUS_political_events.101.t: "[FROM.GetNameDefCap] Menghentikan Upaya Memasang Arthur Seyss-Inquart"
 AUS_political_events.101.desc: "Setelah sekian lama tarik-ulur atas persoalan yang sama sekali bukan urusan mereka, [FROM.GetNameDef] akhirnya menghentikan upaya ikut campur secara tidak sah dalam perpolitikan kita. Kita yakin mereka saat ini sangat mendendam kepada kita, namun itu bukan perhatian utama kita. Fokus utama kita sejak awal hingga selamanya adalah kejayaan [ROOT.GetNameDef]."
 AUS_political_events.101.a: "Akhirnya reda juga"
 AUS_political_events.102.t: "Rencana Ekspansi Sang Führer"
 AUS_political_events.102.desc: "Dalam sebuah konferensi yang baru-baru ini diselenggarakan oleh [ROOT.GetLeader], sang Führer memaparkan sebagian ambisinya bagi ekspansi masa depan [ROOT.GetNameDef]. Langkah ekspansi pertama tersebut dipandang oleh [ROOT.GetLeader.GetSheHe] mengandung risiko yang sangat kecil. Rakyat [AUS.GetAdjective] tiada bedanya dengan bangsa kita, dan mereka sebagian besar menganut pandangan serupa, sebagaimana terbukti dari iklim politik di negeri tersebut. Sang Führer meyakini bahwa ekspansi semacam itu akan dapat dicapai melalui jalur diplomasi, asalkan diberikan waktu yang cukup bagi bertumbuhnya sentimen ramah [ROOT.GetAdjective] di dalam [AUS.GetNameDef]."
 AUS_political_events.102.a: "Gagasan yang sangat cemerlang!"
 AUS_anschluss_ratio_ticking_down: "§YKekuatan Tempur Total Angkatan Darat§! yang dibutuhkan untuk memulai Fokus Nasional §YAnschluss§! akan diturunkan setiap pekan. Jumlah penurunannya sebanding dengan popularitas §YNetralitas§! di §Y[AUS.GetNameWithFlag]§!."
 AUS_anschluss_ratio_ticking_down_monarchist: "§YKekuatan Tempur Total Angkatan Darat§! yang dibutuhkan untuk memulai Fokus Nasional §YAnschluss§! akan diturunkan setiap pekan. Jumlah penurunannya sebanding dengan popularitas §YFasisme§! di §Y[AUS.GetNameWithFlag]§!."
 AUS_political_events.103.t: "Laporan Mengkhawatirkan atas Ekspansionisme [GER.GetAdjective]"
 AUS_political_events.103.desc: "Kendati kita telah lama mencurigai niat [GER.GetAdjective] untuk menganeksasi kita, laporan intelijen yang mendarat di meja kita pagi ini menempatkan situasi dalam bahaya yang jauh lebih mengerikan. Terungkap bahwa sebuah konferensi baru saja digelar di mana [GER.GetLeader] menyuarakan rencana keji untuk mencaplok bangsa kita ke dalam wilayah mereka. Terlepas dari upaya kita merahasiakannya, informasi bocor ke publik dan parahnya disambut baik oleh partai-partai politik tertentu yang menganggapnya gagasan brilian. Kelompok-kelompok ini berpotensi merongrong tekad juang rakyat kita."
 AUS_political_events.103.a: "Ini kabar yang sangat buruk."
 AUS_political_events.104.t: "Sang Pelarian [GER.GetAdjective]"
 AUS_political_events.104.desc: "Pagi ini sebuah pertemuan yang sangat tidak biasa terjadi. Kepemimpinan kita berhadapan langsung dengan pria misterius yang wajahnya terasa sangat akrab, bahkan suaranya pun tak asing. Pria ini mengaku sebagai seorang seniman berbakat yang telah mengembara dari [GER.GetNameDef] dan ingin membantu kita. Ia menegaskan bahwa dirinya adalah pemimpin ulung dan negeri kita sangat membutuhkan sosok seperti dirinya.\n\nKetika ditanyakan kepada para penjaga perbatasan, mereka membantah ada pria dengan nama itu melintasi perbatasan, dan nama Elizabeth Hiedler adalah nama yang paling mendekati."
 AUS_political_events.104.a: "Tidak akan pernah, kita tidak akan tertipu muslihat murahan itu"
 AUS_political_events.104.b: "Apa yang mungkin salah?"
 AUS_political_events.104.c: "Elizabeth..?"
 AUS_british_monarch: "Pemimpin keturunan garis panjang Ratu-Ratu Inggris"
 AUS_political_events.105.t: "[FROM.GetNameDefCap] Menarik Dukungan Mereka"
 AUS_political_events.105.desc: "Menyusul agresi belakangan ini dari [GER.GetNameDef], kita mulai mencari bantuan dari luar. Pihak [ITA.GetAdjective] di masa lalu tampak bersedia mendukung kita apabila kaum [GER.GetAdjective] mengambil tindakan militer terhadap kita. Mungkin kini saatnya kita menagih janji tersebut dan memohon bantuan mereka demi pertahanan kita."
 AUS_political_events.105.a: "Sikap pengecut yang khas."
 AUS_political_events.105.b: "Kita akan berdiri tegak sendirian!"
 AUS_political_events.106.t: "[FROM.GetNameDefCap] Menjamin Kemerdekaan Kita"
 AUS_political_events.106.desc: "Mengingat permusuhan baru-baru ini dari [GER.GetNameDef], pihak [ITA.GetAdjective] telah menghubungi kita untuk menegaskan kembali dukungan mereka. Terlepas dari segala ancaman yang ada, mereka akan menjamin kemerdekaan kita, dan bilamana pecah konflik bersenjata, mereka akan bertempur bahu-membahu di sisi kita."
 AUS_political_events.106.a: "Kaum [GER.GetAdjective] akan menyesali perbuatan mereka!"
 AUS_political_events.107.t: "[FROM.GetNameDefCap] Tunduk pada Tekanan [GER.GetAdjective]"
 AUS_political_events.107.desc: "Kabar memilukan telah sampai kepada kita bahwa [FROM.GetLeader] telah menyerah pada tuntutan [GER.GetAdjective] untuk integrasi ke dalam [GER.GetNameDef]. Kendati kita telah menawarkan jaminan kepada kaum [FROM.GetAdjective], tampaknya janji tersebut tidak cukup untuk membakar keberanian mereka melawan. Kita tetap memiliki kepentingan vital di kawasan ini, sehingga di masa depan, kita patut mempertimbangkan pembebasan kembali rakyat [FROM.GetAdjective]."
 AUS_political_events.107.a: "Tumpas para pemberontak dengan kekuatan penuh!"
 AUS_political_events.107.a_tt: "Saat memulai perang melawan [GER.GetNameDef], kita akan memperoleh:\n"
 AUS_political_events.107.b: "Coba redam dengan perundingan."
 AUS_political_events.108.t: "[FROM.GetNameDefCap] Menggelar Latihan Militer di Perbatasan Kita"
 AUS_political_events.108.desc: "Telah menjadi perhatian kita bahwa Angkatan Darat [FROM.GetAdjective] telah memulai latihan militer berskala cukup besar tepat di garis perbatasan kita. Kendati tiada ancaman lisan yang diucapkan secara terbuka, kita tidak dapat menepis firasat bahwa ini adalah semacam peringatan atas apa yang bakal terjadi. Kita harus sangat berhati-hati dalam setiap tindakan kita terhadap mereka, agar tidak memancing agresi yang lebih beringas."
 AUS_political_events.108.a: "Ketertiban telah ditegakkan."
 AUS_political_events.109.t: "[FROM.GetNameDefCap] Mempersenjatai Penjaga Perbatasan"
 AUS_political_events.109.desc: "Belakangan ini patroli perbatasan kita melaporkan peningkatan signifikan jumlah patroli dan pos penjagaan di sisi perbatasan [FROM.GetAdjective]. Yang kian mencemaskan, para penjaga ini tidak lagi bersenjata ringan, melainkan menyandang senapan tempur yang setara dengan perlengkapan angkatan darat reguler. Apabila pernyataan-pernyataan mereka sebelumnya menjadi tolok ukur, ini merupakan sinyal bahaya yang patut diwaspadai."
 AUS_political_events.109.a: "Siagakan seluruh pos pertahanan perbatasan!"
 AUS_political_events.110.t: "Sentimen Anti-[ROOT.GetAdjective] Meningkat di [FROM.GetNameDef]"
 AUS_political_events.110.desc: "Sebagai akibat dari unjuk rasa yang didanai pemerintah, kita menerima laporan mengenai lonjakan tajam sentimen anti-[ROOT.GetAdjective] di [FROM.GetNameDef]. Kepemimpinan [FROM.GetAdjective] sama sekali belum menghubungi kita secara langsung untuk membahas masalah ini, dan hanya dapat diasumsikan bahwa mereka sudah tidak lagi menaruh minat pada jalur diplomasi saat ini."
 AUS_political_events.110.a: "Dukungan moral yang berharga."
 AUS_political_events.111.t: "[FROM.GetNameDefCap] Menawarkan Pakta Non-Agresi"
 AUS_political_events.111.desc: "Kawat diplomatik dari kepemimpinan [FROM.GetAdjective] baru saja tiba di meja kita. Mereka meminta agar kita menandatangani perjanjian damai timbal balik antarnegara kita. Mereka mengakui bahwa hubungan kita di masa lalu kerap diwarnai perselisihan, namun mereka kini mendambakan dialog yang lebih konstruktif untuk masa kini dan masa depan."
 AUS_political_events.111.a: "Untuk tanah air dan kedaulatan!"
 AUS_political_events.111.b: "Mengingat tabiat kaum [FROM.GetAdjective] dan kekacauan yang mereka timbulkan, sama sekali tidak!"
 AUS_political_events.112.t: "[FROM.GetNameDefCap] Menandatangani Pakta Non-Agresi"
 AUS_political_events.112.desc: "Rencana kita untuk [FROM.GetNameDef] melangkah satu babak lebih maju hari ini, menyusul penandatanganan pakta non-agresi. Kita akan terus melanjutkan upaya untuk mengikat mereka semakin erat dengan kita. Masa depan masih berupa lembaran terbuka, namun kita harus terus melangkah maju dengan rencana-rencana kita."
 AUS_political_events.112.a: "Rakyat berdiri teguh di belakang kita!"
 AUS_political_events.113.t: "[FROM.GetNameDefCap] Menolak Pakta Non-Agresi"
 AUS_political_events.113.desc: "Tampaknya tawaran kita kepada kepemimpinan [FROM.GetAdjective] tidak memuaskan bagi mereka. Entah mereka telah mencium rencana masa depan kita atau mereka sendiri yang memendam niat jahat terhadap kita. Kita harus bersiap menghadapi segala kemungkinan, dan jika kita bertekad meneruskan rencana kita, tindakan yang lebih agresif mungkin akan diperlukan."
 AUS_political_events.113.a: "Bantuan yang tepat pada waktunya."
 AUS_political_events.114.t: "[FROM.GetNameDef] Menawarkan Dukungan Industri"
 AUS_political_events.114.desc: "Mengingat kesepakatan damai terkini antara negara kita, pihak [FROM.GetAdjective] menawarkan dukungan industri kepada kita. Kendati sektor industri kita lazimnya telah memenuhi standar, bantuan mereka tentu saja sangat disambut. Beberapa peringatan kehati-hatian disuarakan, menduga bahwa [FROM.GetNameDefCap] tentu memiliki motif terselubung dalam hal ini."
 AUS_political_events.114.a: "Sampaikan terima kasih tulus kita."
 AUS_political_events.115.t: "Usulan Latihan Militer Gabungan [FROM.GetAdjective]-[ROOT.GetAdjective]"
 AUS_political_events.115.desc: "Para perwira Angkatan Darat [FROM.GetAdjective] menghubungi kita dengan harapan menggelar latihan militer gabungan bagi pasukan kita. Mereka meyakinkan kita bahwa latihan ini akan sangat menguntungkan bagi kedua negara dan kita dapat memetik banyak ilmu dari mereka, sebagaimana mereka dari kita."
 AUS_political_events.115.a: "Kenapa tidak?"
 AUS_political_events.115.b: "Ini terdengar mencurigakan..."
 AUS_political_events.116.t: "Latihan Militer Gabungan [ROOT.GetAdjective]-[FROM.GetAdjective] Berakhir"
 AUS_political_events.116.desc: "Hari ini menandai penutupan latihan militer gabungan [ROOT.GetAdjective]-[FROM.GetAdjective]. Pasukan kita memetik manfaat besar dari latihan ini, dan kita berharap pihak [FROM.GetAdjective] merasakan hal yang sama. Mengamati lebih dekat operasional Angkatan Darat [FROM.GetAdjective] juga memberi kita gambaran utuh tentang apa yang harus kita hadapi saat rencana masa depan kita terlaksana."
 AUS_political_events.116.a: "Luar biasa!"
 AUS_political_events.117.t: "Penolakan [FROM.GetAdjective] atas Latihan Militer Gabungan [ROOT.GetAdjective]-[FROM.GetAdjective]"
 AUS_political_events.117.desc: "\nTerlepas dari manfaat nyata bagi kita berdua, [FROM.GetNameDef] menolak usulan kita untuk latihan militer bersama. Padahal angkatan bersenjata kita dapat saling belajar satu sama lain. Ini juga semestinya menjadi peluang emas bagi kita memengaruhi [FROM.GetNameDef] menuju arah yang kita rencanakan untuk masa depan mereka."
 AUS_political_events.117.a: "Tidak masalah..."
 AUS_political_events.118.t: "Organisasi Kekaisaran"
 AUS_political_events.118.desc: "Seiring kita melangkah di jalan restorasi kekaisaran kita, masalah tata kelola kekaisaran kembali mengemuka di hadapan kita. Para pendahulu kita gagal dalam persoalan ini, menghasilkan kekaisaran luas yang terpecah-belah dan kacau. Kita disodori saran pembentukan faksi demi memastikan negeri-negeri vasal tetap setia kepada kita, sekaligus mencegah mereka saling bertikai satu sama lain."
 AUS_political_events.118.a: "Mereka wajib bergabung bersama kita"
 AUS_political_events.118.b: "Biarkan kesepakatan saat ini menyelesaikan hal ini"
 AUS_political_events.118.c: "Kita akan membentuk tata kelola organisasi yang paling tepat untuk ini!"
 AUS_political_events.118.c.tt: "§Y[FROM.FROM.GetNameDefCap]§! akan dipaksa untuk bergabung ke dalam faksi §Y[ROOT.GetAdjective]§!"
 AUS_political_events.119.t: "[FROM.GetNameDefCap] Menuntut Konsesi Tambahan"
 AUS_political_events.119.desc: "Meskipun mereka telah mengajukan klaim wilayah yang cukup besar di Balkan, pihak [FROM.GetAdjective] tampaknya masih belum puas. Tuntutan yang mereka ajukan kali ini akan merambah lingkup pengaruh kita seandainya kita menyetujuinya, namun pada saat yang sama, konsekuensi yang mereka ancamkan jika kita menolak bisa jadi sangat mematikan."
 AUS_political_events.119.a: "Kita terpaksa mengalah"
 AUS_political_events.119.b: "Kita tidak boleh membiarkan kelancangan ini!"
 AUS_political_events.120.t: "[FROM.GetNameDefCap] Tunduk pada Tuntutan Kita"
 AUS_political_events.120.desc: "Tuntutan wilayah yang kita layangkan kepada kepemimpinan [FROM.GetAdjective] telah diterima. Kendati kita memang sudah memperkirakan hasil ini, tetap sangat melegakan bahwa kita tidak perlu menempuh jalan kekerasan demi mengamankan kembali wilayah sah kita."
 AUS_political_events.120.a: "Kejayaan sejati."
 AUS_political_events.121.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 AUS_political_events.121.desc: "Terlepas dari klaim sah kita atas wilayah yang kini dikuasai oleh [FROM.GetAdjective], [FROM.GetLeader] memutuskan untuk tidak menyerahkan wilayah yang diminta. Ini jelas merupakan hambatan, namun kita pasti merebut kembali tanah air leluhur itu, apapun risikonya."
 AUS_political_events.121.a: "Kita akan merebut tanah itu kembali!"
 AUS_political_events.122.t: "Dengung Kapal Selam [ROOT.GetAdjective]?"
 AUS_political_events.122.desc: "Georg von Trapp dulunya adalah seorang Komandan Kapal Selam yang sangat disegani dalam jajaran Angkatan Laut Austria-Hongaria yang perkasa. Menyusul runtuhnya kekaisaran agung kita dan hilangnya seluruh garis pantai kita, ia bersama banyak veteran lainnya beralih ke profesi lain. Setelah sempat terjun ke dunia perbankan yang menguras sebagian besar kekayaannya, ia mengalihkan perhatiannya ke dunia musik.\n\nKini seiring kita berhasil merebut kembali kendali atas garis pantai maritim kita, von Trapp menawarkan jasanya untuk kembali mengarungi samudra luas atas nama bangsa agung kita."
 AUS_political_events.122.a: "Luar biasa, masukkan kembali ia ke jajaran armada laut!"
 AUS_political_events.122.b: "Betapapun kita mengaguminya... sayangnya tidak"
 AUS_political_events.123.t: "Kaum [FROM.GetAdjective] Membentuk Kembali Blok Sentral"
 AUS_political_events.123.desc: "Kabar bahwa Austria telah membentuk kembali Blok Sentral sampai ke telinga kita pagi ini. Persekutuan militer bersejarah ini berdiri kokoh melewati Perang Besar, namun hancur lebur seiring tumbangnya sebagian besar monarki anggotanya. Pihak [FROM.GetAdjective] kini memutuskan untuk mengobarkan kembali faksi legendaris ini, dan mengingat kita adalah bagian dari persekutuan masa lalu tersebut, mereka memandang layak untuk melayangkan undangan resmi kepada kita."
 AUS_political_events.123.a: "Kita akan berdiri bersatu kembali!"
 AUS_political_events.123.b: "Sekali sudah lebih dari cukup"
 AUS_political_events.124.t: "[FROM.GetNameDefCap] Bergabung dengan [ROOT.GetFactionName]"
 AUS_political_events.124.desc: "Persis seperti yang kita harapkan dari sekutu setia kita, mereka menyambut hangat undangan kita untuk membangkitkan kembali faksi agung kita. Mereka sepakat untuk bergabung dalam perjuangan kita melawan tatanan dunia yang memperlakukan kita dengan begitu tidak adil di akhir Perang Besar."
 AUS_political_events.124.a: "Kekaisaran kita akan bangkit kembali!"
 AUS_political_events.125.t: "[FROM.GetNameDefCap] Menolak Undangan Kita"
 AUS_political_events.125.desc: "Semula kita berharap pihak [FROM.GetAdjective] dapat melihat manfaat nyata dari bergabung kembali bersama kita, namun tampaknya kepahitan masa lalu telah membutakan pandangan mereka. Pemimpin kita [ROOT.GetLeader] menyikapi hal ini dengan ketabahan dan tekad baja: ini hanyalah rintangan kecil."
 AUS_political_events.125.a: "Jika mereka tidak bersama kita..."
 AUS_news_events.1.t: "[AUS.GetNameDefCap] Menolak Anschluss [GER.GetAdjective]"
 AUS_news_events.1.desc: "Menghadapi musuh yang jauh lebih perkasa, kepemimpinan [AUS.GetAdjective] memutuskan untuk tidak tunduk pada tuntutan terbaru [GER.GetAdjective] agar menyerah dan bergabung dengan [GER.GetNameDef]. Pasukan dari [GER.GetNameDef] telah berbaris di sepanjang perbatasan [AUS.GetAdjective], namun masih harus ditunggu apakah invasi skala penuh akan segera dilancarkan.\n\nPeristiwa ini terjadi setelah bertahun-tahun memburuknya hubungan kedua negara dan kian meningkatnya tekanan dari pihak [GER.GetAdjective] agar [AUS.GetNameDef] melebur ke dalam [GER.GetNameDef]."
 AUS_news_events.1.a: "Kami mendoakan yang terbaik bagi [AUS.GetNameDef]..."
 AUS_news_events.1.b: "Akan kita beri mereka pelajaran..."
 AUS_news_events.1.c: "Östfrei!"
 AUS_news_events.3.t: "Tragedi Gugurnya sang Penerbang Ulung"
 AUS_news_events.3.desc: "Penerbang ulung (ace) tempur [AUS.GetAdjective] Godwin von Brumowski telah tewas dalam kecelakaan fatal bersama seorang siswa penerbang [HOL.GetAdjective] yang tengah ia latih di atas Lapangan Udara Schiphol.\n\nVon Brumowski adalah penerbang paling berprestasi dari jajaran Luftfahrtruppen yang perkasa. Dengan rekor 35 kemenangan udara tunggal, 12 kemenangan bersama, dan 8 kemenangan tak terkonfirmasi, ia mengabdi baik dalam Perang Besar maupun Perang Saudara 1934 di [AUS.GetNameDef]."
 AUS_news_events.3.a: "Ia telah mengabdi dengan gagah berani, beristirahatlah dalam damai"
 AUS_news_events.3.b: "Tragedi yang memilukan"
 AUS_news_events.4.t: "Penerbang Ulung Nyaris Mengalami Petaka"
 AUS_news_events.4.desc: "Penerbang ulung tempur [AUS.GetAdjective] Godwin von Brumowski nyaris meregang nyawa kemarin saat melatih seorang siswa penerbang [HOL.GetAdjective] di atas Lapangan Udara Schiphol.\n\nVon Brumowski adalah penerbang tempur paling berprestasi dari Luftfahrtruppen yang perkasa. Dengan torehan 35 kemenangan udara, 12 kemenangan bersama, dan 8 kemenangan tak terkonfirmasi, ia bertempur dalam Perang Besar serta Perang Saudara 1934 di [AUS.GetNameDef].\n\nKeduanya berhasil selamat tanpa luka parah dari musibah tersebut."
 AUS_news_events.4.a: "Sungguh lolos dari maut"
 AUS_news_events.5.t: "Bangsa [AUS.GetAdjective] Membatalkan Perjanjian Saint-Germain-en-Laye"
 AUS_news_events.5.desc: "\n[AUS.GetLeader] dari [AUS.GetNameDef] baru-baru ini menyatakan niat mereka untuk membatalkan Perjanjian Saint-Germain-en-Laye secara tuntas dan mempersenjatai diri kembali. Perjanjian tersebut diberlakukan pasca-Perang Besar guna mencegah [AUS.GetNameDef] mengulangi tindakan yang memicu perang serta memperluas wilayah demi meraih kekuasaan. Para pengamat berspekulasi bahwa ini adalah tanggapan atas kian memuncaknya ketegangan dunia; apakah upaya militerisasi ini murni bersifat defensif ataukah ofensif masih harus kita buktikan."
 AUS_news_events.5.a: "Mencemaskan"
 AUS_news_events.5.b: "Akhirnya!"
 AUS_news_events.6.t: "[AUS.GetNameDefCap] Membentuk Kembali Blok Sentral"
 AUS_news_events.6.desc: "\n\nTanpa opsi persekutuan yang layak di kawasan terdekat mereka, [AUS.GetNameDef] memutuskan untuk membangkitkan kembali aliansi legendaris Blok Sentral. Setelah membebaskan diri dari belenggu perjanjian yang melumpuhkan mereka, negara tersebut kini menempuh jalur remiliterisasi dengan kecepatan kilat. Apakah aliansi baru ini akan menandingi kejayaan dan kedahsyatan pendahulunya di Perang Besar, masih harus dibuktikan oleh sejarah."
 AUS_news_events.6.a: "Sangat mencemaskan"
 AUS_news_events.6.b: "Hari yang bersejarah!"
 AUS_news_events.7.t: "Otto von Habsburg Kembali ke [AUS.GetNameDef]"
 AUS_news_events.7.desc: "\nSetelah menghabiskan sebagian besar masa hidupnya dalam pengasingan, mula-mula di [SWI.GetNameDef] dan kemudian di Pulau Madeira di [POR.GetNameDef], Otto von Habsburg akhirnya kembali ke [AUS.GetNameDef]. Sang pangeran melarikan diri dari tanah airnya pada tahun 1918 bersama orang tuanya, Kaisar Karl I dan Permaisuri Zita, pasca runtuhnya monarki di penghujung Perang Besar. Kepulangannya sebagai kepala negara [AUS.GetAdjective] menandai pembalikan arah angin politik yang sangat drastis di [AUS.GetNameDef]."
 AUS_news_events.7.a: "Hidup sang pangeran Habsburg!"
 AUS_news_events.7.b: "Bukan ini yang tertulis dalam naskah perjanjian damai!"
 AUS_news_events.7.c: "Bagus untuknya"
 AUS_news_events.8.t: "Wangsa Habsburg Kembali Menguasai Kastel Habsburg"
 AUS_news_events.8.desc: "Di bawah kepemimpinan [AUS.GetLeader], [AUS.GetNameDef] telah merebut kembali kota dan puri leluhur Habsburg. Setelah menundukkan pihak [SWI.GetAdjective] ke bawah kehendak mereka, tujuan dari langkah ini adalah memperkuat legitimasi trah Habsburg dan menandai kembalinya [AUS.GetName] yang jauh lebih imperialis."
 AUS_news_events.8.a: "Mengapa mereka melakukan hal itu?"
 AUS_news_events.8.b: "Habsburg adalah milik sah kita!"
 AUS_news_events.9.t: "Kudeta Komunis di [FROM.GetNameDef]"
 AUS_news_events.9.desc: "Menyusul merebaknya simpati rakyat terhadap [FROM.GetCommunistParty] di [FROM.GetNameDef] dalam kurun waktu yang panjang, sebuah peralihan kekuasaan secara damai terjadi di [FROM.GetNameDef]. Kaum Komunis mengambil alih kendali pemerintahan dengan sedikit perlawanan.\n\nPeristiwa ini menandai perubahan haluan radikal dari corak politik [FROM.GetNameDef] selama beberapa dekade terakhir."
 AUS_news_events.9.a: "Sungguh tak terduga"
 AUS_news_events.9.b: "Kami mendoakan keberhasilan mereka!"
 AUS_news_events.9.c: "Akhirnya!"
 AUS_news_events.10.t: "Perang Saudara Meletus di [FROM.GetNameDef]"
 AUS_news_events.10.desc: "Perang Saudara berdarah meletus di [FROM.GetNameDef]. Partai Komunis [FROM.GetCommunistParty] melancarkan pemberontakan bersenjata melawan penguasa dari faksi [FROM.GetNeutralParty]. Menggalang gelombang dukungan rakyat dalam jumlah besar baru-baru ini, kaum komunis telah bertransformasi menjadi kekuatan militer yang patut diperhitungkan di [FROM.GetNameDef]."
 AUS_news_events.10.a: "Sungguh gila"
 AUS_news_events.10.b: "Kerja bagus dan semoga sukses!"
 AUS_news_events.10.c: "Maju terus kawan!"
 AUS_news_events.11.t: "[AUS.GetNameDefCap] Membentuk Blok Donau"
 AUS_news_events.11.desc: "Memutar haluan secara radikal dari masa lalunya, kepemimpinan [AUS.GetAdjective] di bawah [AUS.GetLeader] telah memutuskan mendirikan faksi persekutuan mereka sendiri. Ia menyuarakan harapan agar seluruh kaum buruh di Eropa Tengah bangkit melawan para penindas mereka dan bergabung dalam perjuangan suci ini demi membela hak-hak rakyat jelata."
 AUS_news_events.11.a: "Mengapa mereka berbuat sejauh itu?"
 AUS_news_events.11.b: "Kami mendoakan yang terbaik bagi mereka!"
 AUS_news_events.11.c: "Hari yang agung bagi [AUS.GetNameDef]!"
 AUS_news_events.12.t: "[AUS.GetNameDefCap] Kembali Menggelar Pemilu Demokratis"
 AUS_news_events.12.desc: "\nUntuk pertama kalinya sejak 11 September 1930, [AUS.GetNameDef] berhasil menyelenggarakan pemilihan umum demokratis. Antusiasme rakyat luar biasa tinggi dan saat penghitungan suara tuntas, [AUS.GetLeader] dari [AUS.GetDemocraticParty] tampil sebagai pemenang. Ia kini mengemban amanah berat memandu negerinya melangkah di jalan baru yang lebih demokratis dan bermartabat."
 AUS_news_events.12.a: "Luar biasa"
 AUS_news_events.12.b: "Tercatat"
 # Hungarian country events
 WW_hungary.1.t: "[HUN.GetName] Meluncurkan Program Manufaktur Sekutu"
 WW_hungary.1.desc: "Sekutu kita [HUN.GetNameDef] telah memprakarsai sebuah program untuk bersama-sama mengembangkan pesawat terbang di dalam faksi kita, dan memulai langkah ini dengan berinvestasi pada riset manufaktur kita demi memajukan teknologi penerbangan bersama di masa depan."
 WW_hungary.1.a: "Sebuah berkah yang tak ternilai"
 WW_hungary.2.t: "Pengiriman Senjata dari [FROM.GetAdjective] Tiba"
 WW_hungary.2.desc: "Pemerintah [FROM.GetAdjective] secara terang-terangan mengambil sikap membela negara kita dalam upaya perang kita. Sebagai wujud nyata dukungan baru mereka, mereka telah mengirimkan kargo persenjataan besar kepada kita. Pasokan ini niscaya akan memperkuat posisi kita dalam perang ini."
 WW_hungary.2.a: "Bagus sekali!"
 WW_hungary.3.t: "Wafatnya Perdana Menteri Gyula Gömbös"
 WW_hungary.3.desc: "Perdana menteri kita, seorang perwira militer dan pendiri Asosiasi Pertahanan Nasional Hongaria (MOVE), Gyula Gömbös, dilaporkan telah menghembuskan napas terakhir akibat kanker testis saat menjalankan misi diplomatik di München. Kendati [ROOT.GetLeader] telah menyiapkan calon pengganti, yaitu tokoh sentris Kálmán Darányi, pertanyaan besar tetap membayangi mengenai nasib organisasi paramiliter fasis yang dulunya dipimpin langsung oleh mendiang Gömbös. Mengingat kesamaan sikap anti-komunis antara mereka dan [ROOT.GetLeader], sangat mungkin untuk merangkul mereka bekerja demi kita, namun ketidakpastian mengenai loyalitas sejati mereka dapat menjadi duri dalam daging jika kita memasukkan mereka ke dalam tubuh angkatan bersenjata. Bagaimana kita harus bersikap terhadap MOVE?"
 WW_hungary.3.a: "Kita harus berupaya mengintegrasikan MOVE"
 WW_hungary.3.b: "Bubarkan Fasis Szeged ini segera!"
 WW_hungary.3.c: "Biarkan mereka berkeliaran bebas. Apa hal terburuk yang bisa terjadi?"
 HUN_gombos_has_died_flag: "§YGyula Gömbös§! telah wafat"
 WW_hungary.4.t: "[HUN.GetNameDefCap] Menuntut Transilvania"
 WW_hungary.4.desc: "Transilvania telah lama menjadi bagian dari [HUN.GetNameDef], sebelum direnggut dari mereka dalam Perjanjian Trianon. Sayangnya, [HUN.GetNameDef] tidak pernah bisa menerima hilangnya wilayah mereka. Di berbagai kesempatan, mereka secara terbuka mengklaim Transilvania sebagai bagian integral dari bangsa mereka. Seiring pergeseran situasi politik baru-baru ini, mereka sekali lagi memutuskan untuk memajukan klaim mereka, menuntut agar kita menyerahkan seluruh Transilvania kepada mereka... atau tanggung akibatnya."
 WW_hungary.4.a: "Terserahlah, mereka boleh mengambilnya..."
 WW_hungary.4.b: "Atau tanggung akibatnya... apa?"
 WW_hungary.5.t: "[FROM.GetNameDefCap] Menyerahkan Transilvania"
 WW_hungary.5.desc: "Daripada menghadapi kedigdayaan angkatan bersenjata kita, orang-orang [FROM.GetAdjective] yang pengecut telah memutuskan untuk mengembalikan wilayah sah kita. Seluruh wilayah yang mereka kuasai di Transilvania telah diserahkan kepada administrasi kita, dan pasukan kita telah mengambil kendali penuh."
 WW_hungary.5.a: "Sebagaimana mestinya"
 WW_hungary.6.t: "[FROM.GetNameDefCap] Menolak Menyerahkan Transilvania"
 WW_hungary.6.desc: "Para pemimpin sombong di [FROM.getNameDef] telah menolak tawaran damai kita, dan menyatakan bahwa perang lebih baik daripada menyerahkan Transilvania kepada kita. Mungkin mereka mengira gertakan kita kosong, atau mungkin saat ini adalah saat yang tepat untuk menyerang mereka. Hanya waktu yang akan membuktikannya."
 WW_hungary.6.a: "Maka peranglah jadinya"
 WW_hungary.6.b: "Ini sama sekali tidak sepadan dengan upayanya"
 WW_hungary.7.t: "[FROM.GetNameDefCap] Menuntut Slowakia Selatan"
 WW_hungary.7.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas Slowakia selatan wilayah [FROM.GetAdjective]. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.7.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.7.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.8.t: "[HUN.GetNameDefCap] Menawarkan Perlindungan Sebagai Imbalan atas [975.GetName]"
 WW_hungary.8.desc: "[HUN.GetLeader] dari [HUN.GetNameDef] telah menemui kita dengan tawaran menarik. Ia menyatakan bahwa, sebagai imbalan atas pengembalian [975.GetName], atau sebagaimana mereka menyebutnya, Lajtabánság, ke tangan [HUN.GetAdjective], mereka bersedia menawarkan jaminan kemerdekaan kepada kita, dan berdiri di pihak kita seandainya kaum [GER.GetAdjective] datang menyerang kita. Haruskah kita menerima tawaran mereka?"
 WW_hungary.8.a: "Kita membutuhkan semua bantuan yang bisa kita dapatkan..."
 WW_hungary.8.b: "Dan seberapa berhargakah jaminan mereka sebenarnya?"
 WW_hungary.9.t: "[FROM.GetNameDefCap] Menyerahkan [975.GetName] Demi Jaminan"
 WW_hungary.9.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk menerima tawaran kita dan akan segera menyerahkan kendali atas wilayah [975.GetName] kepada kita sebagai imbalan atas jaminan kemerdekaan. Kita kian membesar, dan persahabatan kita dengan bangsa [FROM.GetAdjective] sekali lagi telah terjalin kembali."
 WW_hungary.9.a: "Hari ini kita berdiri sebagai dua kawan lama yang bersatu kembali!"
 WW_hungary.10.t: "[FROM.GetNameDefCap] Menolak Perlindungan Kita"
 WW_hungary.10.desc: "Kepemimpinan bodoh di [FROM.GetNameDef] telah menolak tawaran kita, menyatakan bahwa hal itu jelas lebih menguntungkan kita daripada mereka, dan bahwa mereka tidak dapat mempercayai bahwa kita akan menghormati komitmen kita... Memangnya mereka pikir kita ini siapa!?"
 WW_hungary.10.a: "Otak mereka pasti sudah geser..."
 WW_hungary.11.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Wilayah [SLO.GetAdjective] Kita"
 WW_hungary.11.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas Slowakia wilayah [FROM.GetAdjective]. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.11.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.11.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.12.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah [SLO.GetAdjective] Mereka"
 WW_hungary.12.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Slowakia, dan telah memerintahkan pasukan mereka untuk mundur dan menarik diri dari daerah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.12.a: "Ini hari yang luar biasa!"
 WW_hungary.13.t: "[FROM.GetNameDefCap] Bertahan Teguh di Slowakia"
 WW_hungary.13.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait perselisihan ini."
 WW_hungary.13.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.13.b: "Kita harus merelakan ini"
 WW_hungary.14.t: "[FROM.GetNameDefCap] Menuntut Vojvodina"
 WW_hungary.14.desc: "Pemerintah [HUN.GetAdjective] mulai memberikan tekanan lebih besar terkait masalah Vojvodina, menyatakan bahwa wilayah itu dulunya bagian dari Hongaria selama masa Kekaisaran dan oleh karena itu harus dikembalikan. Mereka mengklaim bahwa penyatuan dengan Serbia pada akhir Perang Besar adalah \"tidak sah karena adanya tekanan luar\", dan oleh karena itu wilayah tersebut secara hukum masih milik [HUN.GetAdjective]."
 WW_hungary.14.a: "Ini bukan konflik yang bisa kita menangkan"
 WW_hungary.14.b: "Kita tidak akan mendukung delusi mereka"
 WW_hungary.15.t: "[FROM.GetNameDefCap] Menyerahkan Vojvodina"
 WW_hungary.15.desc: "\n[FROM.GetNameDef] telah sepakat untuk menyerahkan Vojvodina kepada kita. Pasukan kita telah mengambil kendali penuh atas wilayah tersebut dan integrasi akan segera dimulai."
 WW_hungary.15.a: "Bagus sekali"
 WW_hungary.16.t: "[From.GetNameDefCap] Menolak Tuntutan Kita"
 WW_hungary.16.desc: "Dalam pertemuan yang tegang dengan [FROM.GetLeader], delegasi kita diberitahu bahwa kedaulatan Vojvodina tidak dapat diperdebatkan, dan dalam situasi apa pun pemerintah [FROM.GetAdjective] tidak akan pernah tunduk pada tekanan semacam itu. Rakyat Vojvodina telah menentukan pilihan mereka pada tahun 1919, dan mereka memilih untuk tidak bergabung dengan kita saat itu. Bagi pemerintah [FROM.GetAdjective], masalah ini sudah selesai."
 WW_hungary.16.a: "Mungkin memang begitu"
 WW_hungary.16.b: "Mereka akan mengutuk hari ini"
 WW_hungary.17.t: "[HUN.GetName] Menuntut Pendudukan Banat Barat"
 WW_hungary.17.desc: "Hari ini [HUN.GetLeader] dari [HUN.GetNameDef] telah mengirimkan ultimatum kepada kita yang menuntut agar kita memberikan hak pendudukan wilayah Banat Barat kepada [HUN.GetName]. Jika kita tidak mematuhi tuntutan [HUN.GetLeader], kemungkinan besar kita akan menghadapi konflik militer."
 WW_hungary.17.a: "Mereka boleh mengambilnya"
 WW_hungary.17.b: "Memangnya mereka pikir mereka ini siapa?"
 WW_hungary.18.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 WW_hungary.18.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] dengan suka rela menerima tuntutan kita untuk pendudukan Banat Barat, dan kemudian menyerahkan wilayah tersebut kepada kita. Mereka lebih memilih menenangkan kita daripada melawan kita, yang pada akhirnya akan semakin memajukan tujuan Italia di Balkan."
 WW_hungary.18.a: "Semua berjalan sesuai rencana"
 WW_hungary.19.t: "[FROM.GetLeader] yang Bodoh Telah Menolak Ultimatum Kita"
 WW_hungary.19.desc: "[FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menolak tanah sah kita, dan kini saatnya menghancurkan [FROM.GetNameDef] dalam satu serangan kilat. Hal ini tentu akan mengamankan klaim kita atas Banat Barat untuk waktu dekat."
 WW_hungary.19.a: "Maka kekerasanlah jalannya"
 WW_hungary.20.t: "[FROM.GetNameDefCap] Menuntut Rutenia Karpathia"
 WW_hungary.20.desc: "Pemerintah [HUN.GetAdjective] mulai memberikan tekanan lebih besar terkait masalah Rutenia Karpathia, menyatakan bahwa wilayah itu dulunya bagian dari Hongaria selama masa Kekaisaran dan oleh karena itu harus dikembalikan. Mereka mengklaim bahwa Republik Hutsul dan semua negara penerus di wilayah tersebut tidak sah, dan ketidakadilan itu hanya dapat dipulihkan setelah kawasan tersebut kembali menjadi milik [HUN.GetAdjective]."
 WW_hungary.20.a: "Ini bukan konflik yang bisa kita menangkan"
 WW_hungary.20.b: "Bisakah mereka benar-benar membuktikan ucapan mereka?"
 WW_hungary.21.t: "[FROM.GetNameDefCap] Menyerahkan Rutenia Karpathia"
 WW_hungary.21.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Rutenia Karpathia, dan telah memerintahkan pasukannya untuk mundur dan menarik diri dari wilayah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.21.a: "Bagus sekali"
 WW_hungary.22.t: "[From.GetNameDefCap] Menolak Tuntutan Kita"
 WW_hungary.22.desc: "Meski tidak sepenuhnya tak terduga, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait sengketa di Rutenia Karpathia."
 WW_hungary.22.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.22.b: "Kita harus merelakan ini"
 WW_hungary.23.t: "[FROM.GetNameDefCap] Menuntut Burgenland"
 WW_hungary.23.desc: "Pemerintah [HUN.GetAdjective] mulai memberikan tekanan lebih besar terkait masalah Burgenland, menyatakan bahwa wilayah itu dulunya bagian dari Hongaria selama masa Kekaisaran dan oleh karena itu harus dikembalikan. Mereka mengklaim bahwa Lajtabánság harus didirikan kembali di wilayah tersebut dan bahwa pemerintahan kita tidak sah. Bagaimana kita harus menanggapi?"
 WW_hungary.23.a: "Ini bukan konflik yang bisa kita menangkan"
 WW_hungary.23.b: "Bisakah mereka benar-benar membuktikan ucapan mereka?"
 WW_hungary.24.t: "[FROM.GetNameDefCap] Menyerahkan Burgenland"
 WW_hungary.24.desc: "[FROM.GetLeader] yang berpikiran rasional dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Burgenland, dan telah memerintahkan pasukan mereka untuk mundur dan menarik diri dari wilayah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.24.a: "Bagus sekali"
 WW_hungary.25.t: "[From.GetNameDefCap] Menolak Tuntutan Kita"
 WW_hungary.25.desc: "Meski tidak sepenuhnya tak terduga, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait sengketa di Burgenland."
 WW_hungary.25.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.25.b: "Kita harus merelakan ini"
 WW_hungary.26.t: "[FROM.GetNameDefCap] Berharap Bergabung dengan Faksi Kita"
 WW_hungary.26.desc: "[FROM.GetLeader] telah menemui kita setelah berkunjung ke ibu kota agung kita, mengklaim berbicara atas nama seluruh rakyat [FROM.GetAdjective], berharap kedua bangsa kita dapat bersatu dalam suatu aliansi militer, dengan tujuan memperluas wilayah bangsa [ROOT.GetAdjective] dan [FROM.GetAdjective]."
 WW_hungary.26.a: "Mereka disambut baik untuk bergabung dengan kita"
 WW_hungary.26.b: "Kita tidak membutuhkan mereka"
 WW_hungary.27.t: "[FROM.GetNameDefCap] Mengizinkan Kita Bergabung dengan Mereka"
 WW_hungary.27.desc: "[FROM.GetLeader] yang agung dari [FROM.GetNameDef] telah sepakat untuk membentuk aliansi militer baru, memperkuat hubungan yang telah terjalin antara bangsa kita. Rakyat kita tumpah ruah ke jalanan untuk merayakan peristiwa bersejarah ini, karena hal ini menandai lahirnya kembali negara [ROOT.GetAdjective], dan dimulainya era baru bagi rakyatnya."
 WW_hungary.27.a: "Mari kita bangun masa depan bersama!"
 WW_hungary.28.t: "[FROM.GetNameDefCap] Menolak Kita Bergabung"
 WW_hungary.28.desc: "[FROM.GetLeader] yang keji dari [FROM.GetNameDef] telah menolak permintaan kita, secara praktis menutup semua peluang kerja sama antarnegara kita dalam waktu dekat. Dengan demikian, kita harus mencari aliansi lain, atau berdiri sendiri."
 WW_hungary.28.a: "Memang belum jalannya"
 WW_hungary.29.t: "[FROM.GetNameDefCap] akan Memulihkan Kekuasaan Habsburg"
 WW_hungary.29.desc: "Pemerintah di [FROM.GetNameDef] telah mengumumkan niatnya untuk memberlakukan kembali Sanksi Pragmatis 1713, yang secara efektif memungkinkan seorang Habsburg kembali menduduki takhta mereka, menentang tuntutan kita pasca-Perang Besar. Kita tidak bisa benar-benar membenarkan perang karenanya, namun karena mereka mungkin akan segera menjadi ancaman bagi kita, mungkin kita harus mencoba menekan mereka?"
 WW_hungary.29.a: "Layangkan Protes Diplomatik"
 WW_hungary.29.b: "Berlakukan Embargo dan Layangkan Protes"
 WW_hungary.30.t: "Entente Kecil Menuntut Janji Perdamaian"
 WW_hungary.30.desc: "Kekuatan Entente Kecil tidak menganggap enteng upaya Charles IV untuk memulihkan monarki Habsburg pada tahun 1921, dan mereka masih tidak mengizinkan tindakan serupa diambil. Namun kali ini, mereka tidak mengancam kita dengan perang atas masalah tersebut, melainkan menuntut kita menunjukkan niat damai kita, agar mereka tidak perlu memusnahkan monarki kita untuk selamanya."
 WW_hungary.30.a: "Kita bisa menjanjikan non-agresi. Untuk saat ini..."
 WW_hungary.30.b: "Mereka tidak bisa memaksa kita melakukan itu!"
 HUN_habsburg_refused_promises_of_peace: "Menolak janji perdamaian kepada Entente Kecil"
 WW_hungary.31.t: "[FROM.GetNameDefCap] Menetapkan Monarki Baru untuk Kita"
 WW_hungary.31.desc: "[FROM.GetNameDefCap] telah menetapkan Joseph August von Habsburg sebagai Palatine baru bagi bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.31.a: "Sungguh"
 WW_hungary.32.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Habsburg"
 WW_hungary.32.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan tanah Cisleithania, dan sekali lagi memahkotai seorang Habsburg sebagai monarki kita sendiri. Ini pada dasarnya akan mengakhiri kemerdekaan kita, tetapi mungkin menyelamatkan kita dari aneksasi total. Apakah kita menerima posisi dalam federasi kekaisaran baru ini?"
 WW_hungary.32.a: "Mereka benar"
 WW_hungary.32.b: "Wangsa Habsburg diasingkan bukan tanpa alasan!"
 WW_hungary.33.t: "[FROM.GetNameDefCap] Menerima Monarki Habsburg"
 WW_hungary.33.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai seorang monarki Habsburg sesuai dengan tuntutan kita, dan mengundurkan diri demi raja baru mereka. Fajar baru akan menyingsing bagi federasi kekaisaran kita!"
 WW_hungary.33.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.34.t: "[FROM.GetNameDefCap] Menolak Monarki Habsburg"
 WW_hungary.34.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk tidak mengundurkan diri dari jabatan mereka, entah bagaimana mempercayai bahwa mereka lebih bijak daripada seorang monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Joseph August di takhta mereka, suka atau tidak!"
 WW_hungary.34.a: "Mereka mengambil pilihan yang salah"
 WW_hungary.35.t: "[FROM.GetNameDefCap] Berharap Bergabung dengan Faksi Kita"
 WW_hungary.35.desc: "[FROM.GetLeader] telah menemui kita setelah berkunjung ke ibu kota agung kita, mengklaim berbicara atas nama seluruh rakyat [FROM.GetAdjective], berharap agar kedua bangsa kita bersatu dalam suatu aliansi militer, dengan tujuan memperluas wilayah bangsa [ROOT.GetAdjective] dan [FROM.GetAdjective]."
 WW_hungary.35.a: "Mereka disambut baik untuk bergabung dengan kita"
 WW_hungary.35.b: "Kita tidak membutuhkan mereka"
 WW_hungary.36.t: "[FROM.GetNameDefCap] Memulihkan Blok Poros Tengah"
 WW_hungary.36.desc: "[FROM.GetLeader] yang agung dan terhormat dari [FROM.GetNameDef] telah sepakat untuk membentuk aliansi militer baru, memperkuat hubungan yang telah ada antara bangsa kita. Rakyat kita tumpah ruah ke jalanan untuk merayakan peristiwa bersejarah ini, karena hal ini menandai lahirnya kembali negara [ROOT.GetAdjective], dan dimulainya era baru bagi rakyatnya."
 WW_hungary.36.a: "Mari kita bangun masa depan bersama!"
 WW_hungary.37.t: "[FROM.GetNameDefCap] Menodai Kehormatan Kita"
 WW_hungary.37.desc: "[FROM.GetLeader] yang keji dari [FROM.GetNameDef] telah menolak permintaan kita, secara praktis menutup semua peluang kerja sama antarnegara kita dalam waktu dekat. Dengan demikian, kita harus mencari aliansi lain, atau berdiri sendiri."
 WW_hungary.37.a: "Memang belum jalannya"
 WW_hungary.38.t: "[FROM.GetNameDefCap] Mengundang Kita ke Blok Poros Tengah"
 WW_hungary.38.desc: "[FROM.GetLeader] telah menemui kita setelah berkunjung ke ibu kota kita, mengklaim berbicara atas nama seluruh rakyat [FROM.GetAdjective], berharap agar kedua bangsa kita sekali lagi bersatu dalam aliansi militer, dengan tujuan memperluas wilayah bangsa [ROOT.GetAdjective] dan [FROM.GetAdjective]. Bagaimana kita harus menanggapi petisi mereka?"
 WW_hungary.38.a: "Mereka tidak akan pernah berdiri sendirian"
 WW_hungary.38.b: "Mereka hanya akan menjadi beban"
 WW_hungary.39.t: "[FROM.GetNameDefCap] Bergabung dengan Blok Poros Tengah"
 WW_hungary.39.desc: "[FROM.GetLeader] yang agung dan terhormat dari [FROM.GetNameDef] telah sepakat untuk bergabung dengan aliansi militer baru kita, memperkuat hubungan yang sudah ada antarbangsa kita. Rakyat kita tumpah ruah ke jalanan untuk merayakan peristiwa bersejarah ini, karena menandai lahirnya kembali negara [ROOT.GetAdjective], dan dimulainya era baru bagi rakyatnya."
 WW_hungary.39.a: "Mari kita hapus kesalahan Perang Besar!"
 WW_hungary.40.t: "[FROM.GetNameDefCap] Menodai Kehormatan Kita"
 WW_hungary.40.desc: "[FROM.GetLeader] yang keji dari [FROM.GetNameDef] telah menolak permintaan kita, secara praktis menutup semua peluang kerja sama antarnegara kita dalam waktu dekat. Dengan demikian, kita harus mencari aliansi lain, karena mereka tidak bersedia bersekutu dengan kita."
 WW_hungary.40.a: "Kalau begitu kita yang akan memimpin!"
 WW_hungary.40.b: "Kita harus mencoba pendekatan yang berbeda"
 WW_hungary.41.t: "[FROM.GetNameDefCap] Berharap Memulihkan Aliansi Agung"
 WW_hungary.41.desc: "[FROM.GetLeader] telah menemui kita setelah berkunjung ke ibu kota agung kita, mengklaim berbicara atas nama seluruh rakyat [FROM.GetAdjective], berharap kedua bangsa kita dapat bersatu dalam suatu aliansi militer, dengan tujuan memperluas wilayah bangsa [ROOT.GetAdjective] dan [FROM.GetAdjective]."
 WW_hungary.41.a: "Mereka disambut baik untuk bergabung dengan kita"
 WW_hungary.41.b: "Kita tidak membutuhkan mereka"
 WW_hungary.42.t: "[FROM.GetNameDefCap] Menghormati Aliansi Agung"
 WW_hungary.42.desc: "[FROM.GetLeader] yang agung dan terhormat dari [FROM.GetNameDef] telah sepakat untuk membentuk aliansi militer baru. Rakyat kita tumpah ruah ke jalanan untuk merayakan peristiwa bersejarah ini, karena menandai kebangkitan kembali negara [ROOT.GetAdjective], dan awal dari era baru bagi rakyatnya."
 WW_hungary.42.a: "Mari kita lindungi masa depan bersama!"
 WW_hungary.43.t: "[FROM.GetNameDefCap] Menodai Kehormatan Kita"
 WW_hungary.43.desc: "[FROM.GetLeader] yang keji dari [FROM.GetNameDef] telah menolak permintaan kita, secara praktis menutup semua peluang kerja sama antarnegara kita dalam waktu dekat. Dengan demikian kita harus mencari aliansi lain, atau berdiri sendiri."
 WW_hungary.43.a: "Anda hanya bisa benar-benar mempercayai keluarga sendiri"
 ENG_Rejected_HUN_grand_alliance: "Inggris menolak pemulihan Aliansi Agung"
 WW_hungary.44.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Dinasti Wied"
 WW_hungary.44.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan takhta Wied, dan sekali lagi memahkotai Wilhelm dari Wied sebagai monarki kita sendiri. Ini pada dasarnya akan mengakhiri kemerdekaan kita, namun mungkin menyelamatkan kita dari aneksasi menyeluruh. Apakah kita menerima posisi dalam federasi kekaisaran baru ini?"
 WW_hungary.44.a: "Mereka benar"
 WW_hungary.44.b: "Wangsa Wied diasingkan bukan tanpa alasan!"
 WW_hungary.45.t: "[FROM.GetNameDefCap] Menerima Monarki Wangsa Wied"
 WW_hungary.45.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai Wilhelm dari Wied sesuai tuntutan kita, dan mengundurkan diri demi raja baru mereka. Fajar baru akan menyingsing pada federasi kekaisaran kita!"
 WW_hungary.45.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.46.t: "[FROM.GetNameDefCap] Menolak Monarki Wangsa Wied"
 WW_hungary.46.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk tidak mengundurkan diri dari jabatan mereka, entah bagaimana mempercayai bahwa mereka lebih bijaksana daripada seorang raja yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Wilhelm dari Wied di atas takhta mereka, suka atau tidak!"
 WW_hungary.46.a: "Mereka mengambil pilihan yang salah"
 WW_hungary.47.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Habsburg"
 WW_hungary.47.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan kekuasaan Habsburg atas tanah kita sebagaimana disepakati dalam Dekrit 5 November, dan sekali lagi memahkotai seorang Habsburg sebagai penguasa kita. Ini akan menyelaraskan kita dengan mereka dan mengizinkan kita bergabung dengan aliansi mereka, tanpa sepenuhnya mengakhiri kemerdekaan kita."
 WW_hungary.47.a: "Ini kewajiban kita"
 WW_hungary.47.b: "Matilah para monarki!"
 WW_hungary.48.t: "[FROM.GetNameDefCap] Menerima Monarki Habsburg"
 WW_hungary.48.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai seorang penguasa Habsburg sesuai tuntutan kita, dan mengundurkan diri demi raja baru mereka."
 WW_hungary.48.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.49.t: "[FROM.GetNameDefCap] Menolak Monarki Habsburg"
 WW_hungary.49.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk tidak mengundurkan diri dari jabatan mereka, entah bagaimana mempercayai bahwa mereka lebih bijak daripada seorang monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Karl Albrecht di takhta mereka, suka atau tidak!"
 WW_hungary.49.a: "Mereka mengambil pilihan yang salah"
 WW_hungary.50.t: "[FROM.GetNameDefCap] Menetapkan Monarki Habsburg untuk Kita"
 WW_hungary.50.desc: "[FROM.GetNameDefCap] telah menetapkan Karl Pius von Habsburg sebagai raja baru bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.50.a: "Sungguh"
 WW_hungary.51.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Habsburg"
 WW_hungary.51.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan kekuasaan Habsburg atas tanah kita seperti pada kurun waktu 1516 hingga 1700, dan sekali lagi memahkotai seorang Habsburg sebagai penguasa kita. Ini akan menyelaraskan kita dengan mereka dan memungkinkan kita bergabung dengan aliansi mereka, tanpa sepenuhnya mengakhiri kemerdekaan kita."
 WW_hungary.51.a: "Ini kewajiban kita"
 WW_hungary.51.b: "Memangnya mereka pikir mereka ini siapa?"
 WW_hungary.52.t: "[FROM.GetNameDefCap] Menerima Monarki Habsburg"
 WW_hungary.52.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai seorang raja Habsburg sesuai dengan tuntutan kita, dan mengundurkan diri demi raja baru mereka."
 WW_hungary.52.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.53.t: "[FROM.GetNameDefCap] Menolak Monarki Habsburg"
 WW_hungary.53.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk tidak mengundurkan diri dari jabatan mereka, entah bagaimana mempercayai bahwa mereka lebih bijak daripada monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Karl Pius di takhta mereka, suka atau tidak!"
 WW_hungary.53.a: "Mereka mengambil pilihan yang salah"
 WW_hungary.54.t: "[FROM.GetNameDefCap] Menetapkan Monarki Habsburg untuk Kita"
 WW_hungary.54.desc: "[FROM.GetNameDefCap] telah menetapkan Vasyl Vyshyvanyi von Habsburg sebagai raja baru bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.54.a: "Sungguh"
 WW_hungary.55.t: "Austria-Hongaria Menawarkan \"Perlindungan\""
 WW_hungary.55.desc: "Seiring pergeseran dramatis baru-baru ini dalam lanskap politik Balkan, pertanyaan mengenai hubungan kita dengan Kekaisaran Austria-Hongaria yang baru telah mengemuka berulang kali. Hari ini, duta besar Hongaria telah menyerahkan nota resmi, secara resmi meminta agar kita menyatakan sikap kita terhadap Kekaisaran tersebut. Wangsa Habsburg mengklaim bahwa, sebagai tanah mahkota lama, Bohemia dan Moravia adalah milik mereka.\n\nNamun demikian, [HUN.GetLeader] telah mengindikasikan bahwa ia bersedia menerima solusi kompromi, dengan dirinya secara nominal menjadi kepala negara kita, tetapi dengan kekuasaan nyata yang sangat sedikit."
 WW_hungary.55.a: "Kita akan kembali ke pangkuan Kekaisaran."
 WW_hungary.55.b: "Kita tidak akan pernah menukar kebebasan demi keselamatan!"
 WW_hungary.56.t: "Bohemia Kembali ke Mahkota"
 WW_hungary.56.desc: "Menyusul perundingan tingkat tinggi yang berlangsung hingga larut malam, pemerintah [CZE.GetAdjective] telah memutuskan untuk menerima tawaran kita dan memproklamasikan Albrecht Franz sebagai Raja Bohemia, Margrave Moravia, dan Adipati Teschen. Para prajurit dari bekas Tentara Ceko telah mengucapkan sumpah setia kepada Raja dan Kaisar baru mereka, dan administrasi sipil di wilayah-wilayah tersebut secara nominal telah diintegrasikan."
 WW_hungary.56.a: "Selangkah lagi menuju pengembalian hak kelahiran kita."
 WW_hungary.57.t: "[CZE.GetNameDefCap] Menolak Ajakan"
 WW_hungary.57.desc: "[CZE.GetNameDefCap] menolak untuk mempertimbangkan penyelesaian atau kesepakatan apa pun terkait hubungan masa depan mereka dengan kita. Ketika duta besar kita tiba di kementerian luar negeri untuk membahas nota resmi yang telah diserahkannya sebelumnya, ia diberitahu bahwa tidak ada hal yang perlu dibicarakan, dan segera diantar keluar pintu. Duta besar [CZE.GetAdjective] untuk pemerintah kita telah menyatakan bahwa, meskipun pemerintahnya menginginkan hubungan damai dan bersahabat antarbangsa kita, tidak ada kemungkinan untuk menggabungkan [CZE.GetNameDef] ke dalam Kekaisaran Austria-Hongaria."
 WW_hungary.57.a: "Sungguh disayangkan..."
 WW_hungary.58.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Galisia dan Bukovina"
 WW_hungary.58.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas wilayah Galisia dan Bukovina. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.58.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.58.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.59.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah Galisia dan Bukovina Mereka"
 WW_hungary.59.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Galisia dan Bukovina, dan telah memerintahkan pasukannya untuk mundur dan menarik diri dari wilayah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.59.a: "Ini hari yang luar biasa!"
 WW_hungary.60.t: "[FROM.GetNameDefCap] Bertahan Teguh"
 WW_hungary.60.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait perselisihan ini."
 WW_hungary.60.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.60.b: "Kita harus merelakan ini"
 WW_hungary.61.t: "[FROM.GetNameDefCap] Memulihkan Dinasti de Iturbide"
 WW_hungary.61.desc: "[FROM.GetNameDefCap] telah menetapkan María Josepha Sophia de Iturbide sebagai ratu baru bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.61.a: "Sungguh"
 WW_hungary.62.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Kekaisaran"
 WW_hungary.62.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan kekuasaan Iturbide-Habsburg atas tanah kita seperti yang terjadi pada tahun 1821 hingga 1823 dan 1864 hingga 1867, dan sekali lagi memahkotai seorang monarki. Ini akan menyelaraskan kita dengan mereka dan mengizinkan kita bergabung dengan aliansi mereka, tanpa sepenuhnya mengakhiri kemerdekaan kita."
 WW_hungary.62.a: "Lagipula sudah saatnya"
 WW_hungary.62.b: "Memangnya mereka pikir mereka ini siapa?"
 WW_hungary.63.t: "[FROM.GetNameDefCap] Menerima Kekuasaan Kekaisaran"
 WW_hungary.63.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai María Josepha Sophia de Iturbide sebagai kaisar baru mereka sesuai dengan tuntutan kita, dan mengundurkan diri demi ratu baru mereka."
 WW_hungary.63.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.64.t: "[FROM.GetNameDefCap] Menolak Kekuasaan Kekaisaran"
 WW_hungary.64.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk tidak mengundurkan diri dari posisi mereka, entah bagaimana mempercayai bahwa mereka lebih bijak daripada seorang monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan María Josepha Sophia de Iturbide di takhta mereka, suka atau tidak!"
 WW_hungary.64.a: "Mereka mengambil pilihan yang salah"
 WW_hungary.65.t: "[FROM.GetNameDefCap] Menetapkan Monarki Habsburg untuk Kita"
 WW_hungary.65.desc: "[FROM.GetNameDefCap] telah menetapkan Joseph Francis von Habsburg sebagai raja baru bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.65.a: "Sungguh"
 WW_hungary.66.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Habsburg"
 WW_hungary.66.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan kekuasaan Habsburg atas tanah kita seperti halnya sebelum pembubaran Kekaisaran Austria-Hongaria, dan sekali lagi memahkotai seorang Habsburg sebagai monarki kita sendiri. Namun mereka menjanjikan otonomi yang lebih besar daripada sebelumnya, dengan janji muluk tentang apa yang disebut Monarki Tripartit. Bagaimana tanggapan kita?"
 WW_hungary.66.a: "Inilah yang selalu kita inginkan!"
 WW_hungary.66.b: "Memangnya mereka pikir mereka ini siapa?"
 WW_hungary.67.t: "[FROM.GetNameDefCap] Menerima Monarki Habsburg"
 WW_hungary.67.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai seorang monarki Habsburg sesuai dengan tuntutan kita, dan mengundurkan diri demi raja baru mereka."
 WW_hungary.67.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.68.t: "[FROM.GetNameDefCap] Menolak Monarki Habsburg"
 WW_hungary.68.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk bertahan di posisi mereka saat ini, entah bagaimana meyakini bahwa mereka lebih bijak daripada seorang monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Joseph Francis di takhta mereka, suka atau tidak!"
 WW_hungary.68.a: "Mereka mengambil pilihan yang tidak bijaksana..."
 WW_hungary.69.t: "[FROM.GetLeader] Menuntut Kita Memulihkan Kekuasaan Habsburg"
 WW_hungary.69.desc: "Kaisar [FROM.GetLeader] dari [FROM.GetNameDefCap] telah menuntut agar kita memulihkan kekuasaan Habsburg atas tanah kita seperti halnya sebelum unifikasi kita dengan Italia, dan sekali lagi memahkotai seorang Habsburg sebagai monarki kita sendiri. Namun demikian, mereka menjanjikan otonomi yang lebih besar daripada sebelumnya kepada kita. Bagaimana tanggapan kita?"
 WW_hungary.69.a: "Dengan senang hati kita akan bergabung"
 WW_hungary.69.b: "Memangnya mereka pikir mereka ini siapa?"
 WW_hungary.70.t: "[FROM.GetNameDefCap] Menerima Monarki Habsburg"
 WW_hungary.70.desc: "Kepemimpinan bijak di [FROM.GetNameDef] telah memutuskan untuk memahkotai seorang monarki Habsburg sesuai dengan tuntutan kita, dan mengundurkan diri demi raja baru mereka."
 WW_hungary.70.a: "Mereka mengambil pilihan yang tepat"
 WW_hungary.71.t: "[FROM.GetNameDefCap] Menolak Monarki Habsburg"
 WW_hungary.71.desc: "Kepemimpinan dekaden di [FROM.GetNameDef] telah memutuskan untuk bertahan di posisi mereka saat ini, entah bagaimana mempercayai bahwa mereka lebih bijak daripada seorang monarki yang dipilih oleh Tuhan sendiri. Kita akan menumpas mereka dan mendudukkan Robert di takhta mereka, suka atau tidak!"
 WW_hungary.71.a: "Mereka mengambil pilihan yang tidak bijaksana..."
 WW_hungary.72.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Wilayah [SIL.GetAdjective] Kita"
 WW_hungary.72.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas Silesia wilayah [FROM.GetAdjective]. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.72.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.72.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.73.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah [SIL.GetAdjective] Mereka"
 WW_hungary.73.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Silesia, dan telah memerintahkan pasukannya untuk mundur dan menarik diri dari daerah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.73.a: "Ini hari yang luar biasa!"
 WW_hungary.74.t: "[FROM.GetNameDefCap] Bertahan Teguh di Silesia"
 WW_hungary.74.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait perselisihan ini."
 WW_hungary.74.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.74.b: "Kita harus merelakan ini"
 WW_hungary.75.t: "[FROM.GetNameDefCap] Menuntut Tanah Suci"
 WW_hungary.75.desc: "[FROM.GetLeader] yang gegabah telah menyerukan pendudukan Tanah Suci oleh pasukan [FROM.GetAdjective], dan menuntut agar kita menyerahkan wilayah tersebut serta menarik mundur pasukan kita sendiri dari kawasan itu. Situasi ini berpotensi lepas kendali jika kita tidak berhati-hati. Bagaimana kita harus menanggapi?"
 WW_hungary.75.a: "Para pembela Katolik boleh memilikinya"
 WW_hungary.75.b: "Berapa banyak perang salib yang gagal lagi tadi?"
 WW_hungary.76.t: "[FROM.GetNameDefCap] Menyerahkan Tanah Suci"
 WW_hungary.76.desc: "[FROM.GetLeader] yang berpikiran rasional dari [FROM.GetNameDef] telah sepakat untuk menyerahkan Palestina kepada kita, dan telah memerintahkan pasukannya untuk mundur dan menarik diri dari daerah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.76.a: "Ini hari yang luar biasa!"
 WW_hungary.77.t: "[FROM.GetNameDefCap] Bertahan Teguh di Tanah Suci"
 WW_hungary.77.desc: "Meski tidak sepenuhnya tak terduga, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait sengketa ini."
 WW_hungary.77.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.77.b: "Kita harus merelakan ini"
 WW_hungary.78.t: "[FROM.GetNameDefCap] Menetapkan Pemimpin Baru untuk Kita"
 WW_hungary.78.desc: "[FROM.GetNameDefCap] telah menetapkan Paus baru sebagai pemimpin bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.78.a: "Sungguh"
 WW_hungary.79.t: "[FROM.GetNameDefCap] Menetapkan Pemimpin Baru untuk Kita"
 WW_hungary.79.desc: "[FROM.GetNameDefCap] telah menetapkan seorang monarki baru sebagai pemimpin bangsa kita. Hal ini niscaya akan memperkuat rezim kita."
 WW_hungary.79.a: "Sungguh"
 WW_hungary.80.t: "[HUN.GetNameDefCap] Berusaha Mengintegrasikan Kita"
 WW_hungary.80.desc: "[HUN.GetNameDefCap] telah memutuskan bahwa sudah saatnya wilayah kita diintegrasikan kembali ke dalam mahkota Austria-Hongaria. Kita tidak bisa berbuat banyak selain menerima kenyataan ini..."
 WW_hungary.80.a: "Memang sudah semestinya"
 WW_hungary.80.b: "Mereka tidak akan pernah menangkap kita hidup-hidup!"
 WW_hungary.81.t: "[FROM.GetNameDefCap] Menerima Integrasi"
 WW_hungary.81.desc: "[FROM.GetNameDefCap] telah memutuskan untuk menerima tuntutan kita agar tanah mereka diintegrasikan kembali ke dalam mahkota Austria-Hongaria. Hari ini adalah hari besar bagi kekaisaran!"
 WW_hungary.81.a: "Dan segalanya baik-baik saja di dunia"
 WW_hungary.82.t: "[FROM.GetNameDefCap] Menolak Integrasi"
 WW_hungary.82.desc: "[FROM.GetNameDefCap] telah memutuskan untuk menolak tuntutan kita agar wilayah mereka diintegrasikan kembali ke dalam mahkota Austria-Hongaria. Dengan demikian kita harus melakukannya dengan kekuatan senjata..."
 WW_hungary.82.a: "Kita akan membuat mereka membayarnya"
 WW_hungary.83.t: "[FROM.GetNameDefCap] Menawarkan Membeli [975.GetName]"
 WW_hungary.83.desc: "Pemerintah [HUN.GetAdjective] masih memandang [975.GetName] sebagai wilayah integral dari negeri mereka, menyatakan bahwa kawasan itu dulunya bagian dari Hongaria selama era Kekaisaran dan oleh karena itu harus dikembalikan. Mereka kini telah mendatangi kita dengan tawaran untuk membeli kembali wilayah itu dari kita, tentu dengan harga yang bagus."
 WW_hungary.83.a: "Kita akan mengambil semua uang yang bisa kita peroleh"
 WW_hungary.83.b: "[975.GetName] adalah milik [ROOT.GetAdjective]!"
 WW_hungary.84.t: "[FROM.GetNameDefCap] Menjual [975.GetName] kepada Kita"
 WW_hungary.84.desc: "[FROM.GetLeader] yang berpikiran sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan [975.GetName] kepada kita, dan telah menerima pembayaran sebagaimana yang kita janjikan. Hari ini adalah hari besar bagi rakyat [ROOT.GetAdjective]!"
 WW_hungary.84.a: "Sempurna"
 WW_hungary.85.t: "[From.GetNameDefCap] Menolak Tawaran Kita"
 WW_hungary.85.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menolak permintaan kita, dan mengirim utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait sengketa di [975.GetName]."
 WW_hungary.85.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.85.b: "Mereka menolak dan kita harus menghormati itu"
 WW_hungary.86.t: "[FROM.GetNameDefCap] Menggelar Pemberontakan di [975.GetName]"
 WW_hungary.86.desc: "Pemberontak dari organisasi paramiliter [FROM.GetAdjective] telah merebut kendali atas gedung-gedung kunci di wilayah [975.GetName], tergesa-gesa menggelar referendum agar wilayah itu bergabung kembali dengan [FROM.GetNameDef], dengan hasil yang jelas-jelas dicurangi sangat memihak pada langkah tersebut. Pasukan kita bersiaga di dekat sana, tetapi masih menunggu perintah untuk memastikan apakah intervensi merupakan pilihan tindakan yang tepat atau bukan."
 WW_hungary.86.a: "Kita tidak memiliki kekuatan untuk melawan mereka"
 WW_hungary.86.b: "Mereka akan tahu rasa dan menyesali keputusan mereka!"
 WW_hungary.87.t: "[FROM.GetNameDefCap] Berharap Bergabung dengan Faksi Kita"
 WW_hungary.87.desc: "[FROM.GetLeader] telah menemui kita setelah berkunjung ke ibu kota kita, mengklaim berbicara atas nama seluruh rakyat [FROM.GetAdjective], berharap kedua bangsa kita dapat bersatu dalam aliansi militer, dengan tujuan melindungi rakyat dari kedua bangsa [ROOT.GetAdjective] dan [FROM.GetAdjective]."
 WW_hungary.87.a: "Mereka disambut baik untuk bergabung dengan kita"
 WW_hungary.87.b: "Kita tidak membutuhkan mereka"
 WW_hungary.88.t: "[FROM.GetNameDefCap] Mengizinkan Kita Bergabung dengan Mereka"
 WW_hungary.88.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah sepakat untuk membentuk aliansi militer baru, mempererat hubungan antara bangsa kita. Rakyat kita tumpah ruah ke jalanan untuk merayakan peristiwa bersejarah ini, karena menandai lahirnya kembali negara [ROOT.GetAdjective], dan dimulainya era baru yang lebih aman bagi rakyatnya."
 WW_hungary.88.a: "Mari kita bangun masa depan bersama!"
 WW_hungary.89.t: "[FROM.GetNameDefCap] Menolak Kita Bergabung"
 WW_hungary.89.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kita, secara praktis menutup semua peluang kerja sama antara negara kita dalam waktu dekat. Dengan demikian kita harus mencari aliansi lain, atau berdiri sendiri."
 WW_hungary.89.a: "Memang belum jalannya"
 WW_hungary.90.t: "Pemahkotaan Raja Apostolik"
 WW_hungary.90.desc: "Kini telah diputuskan bahwa monarki dipulihkan secara resmi, namun kita menghadapi sebuah masalah. Tidak ada kandidat yang baik muncul, namun sang wali penguasa harus segera memilih. Ia dapat memahkotai dirinya sendiri, meskipun itu akan sangat tidak populer, atau mungkin menempuh jalur alternatif dan memahkotai putranya István Horthy, yang sangat disukai oleh rakyat. Siapa yang harus dipilih untuk posisi tersebut?"
 WW_hungary.90.a: "Miklós Horthy adalah pilihan yang wajar"
 WW_hungary.90.b: "István Horthy mendapat dukungan rakyat"
 WW_hungary.91.t: "[FROM.GetNameDefCap] Mengusulkan Penyatuan"
 WW_hungary.91.desc: "Pemerintah [HUN.GetAdjective] telah mendatangi kita dengan tawaran menarik untuk menyatukan kedua negara kita menjadi satu. Mereka tentu saja menginginkannya sesuai dengan syarat mereka, yang berarti pemerintahan merekalah yang akan memerintah keduanya, namun mungkinkah itu pilihan teraman yang harus diambil?"
 WW_hungary.91.a: "Baiklah, kita terima"
 WW_hungary.91.b: "Mereka pasti besar kepala"
 WW_hungary.92.t: "[FROM.GetNameDefCap] Menerima Penyatuan"
 WW_hungary.92.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan kendali pemerintahan kepada kita, memulai proses penyatuan kedua bangsa kita di bawah satu raja. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.92.a: "Luar biasa!"
 WW_hungary.93.t: "[From.GetNameDefCap] Menolak Penyatuan"
 WW_hungary.93.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima usulan kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun, menegaskan bahwa 'Rumania adalah Rumania!'."
 WW_hungary.93.a: "Itu pilihan yang harus mereka buat"
 WW_hungary.94.t: "Memilih Presiden Baru [ROOT.GetAdjective]"
 WW_hungary.94.desc: "Bangsa ini sangat membutuhkan wakil rakyat yang terpilih, kini setelah debu perang saudara mereda. Di satu sisi berdiri Mihály Károlyi yang populer, politisi konservatif dan mantan perdana menteri Hongaria. Di sisi lain adalah kaum komunis, yang sebagian mendukung pengembalian Béla Kun, pemimpin bekas Republik Soviet Hongaria ke tampuk kekuasaan, dan sebagian lagi mendukung penganut Stalinis Mátyás Rákosi, yang baru-baru ini menuai pujian karena bertempur di garis depan. Siapa yang akan memimpin negeri ini menuju masa depan?"
 WW_hungary.94.a: "Béla Kun harus kembali berkuasa"
 WW_hungary.94.b: "Mátyás Rákosi telah meraih rasa hormat rakyat"
 WW_hungary.94.c: "Mihály Károlyi harus memimpin kita"
 WW_hungary.95.t: "Pemilihan Presiden Pertama Republik Kedua"
 WW_hungary.95.desc: "Waktunya telah tiba untuk akhirnya menggelar pemilihan presiden bagi bangsa ini, dan memastikan bahwa prinsip-prinsip demokratis kita dapat bersinar sebagai mercusuar terang di jantung Eropa. Kandidat utama yang berpartisipasi adalah Mihály Károlyi, presiden Republik Pertama, Árpád Szakasits pemimpin kaum sosial demokrat Hongaria, dan János Zichy, pemimpin Partai Ekonomi dan Sosial Kristen Hongaria, serta anggota Akademi Ilmu Pengetahuan Hongaria. Masa depan apa yang menanti Hongaria?"
 WW_hungary.95.a: "Mihály Károlyi tahu bagaimana memimpin"
 WW_hungary.95.b: "Árpád Szakasits bisa menemukan jalan tengah yang baik"
 WW_hungary.95.c: "János Zichy bisa membantu kita bangkit kembali"
 WW_hungary.96.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Wilayah [SLO.GetAdjective] Kita"
 WW_hungary.96.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas Slowakia wilayah [FROM.GetAdjective]. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.96.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.96.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.97.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah [SLO.GetAdjective] Mereka"
 WW_hungary.97.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Slowakia, dan telah memerintahkan pasukannya untuk mundur dan menarik diri dari daerah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.97.a: "Ini hari yang luar biasa!"
 WW_hungary.98.t: "[FROM.GetNameDefCap] Bertahan Teguh di Slowakia"
 WW_hungary.98.desc: "Meski tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait perselisihan ini."
 WW_hungary.98.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.98.b: "Kita harus merelakan ini"
 WW_hungary.99.t: "Hongaria Menuntut Pertuanan atas Tanah Székely"
 WW_hungary.99.desc: "Wilayah yang mencakup sebagian besar [76.GetName], yang dikenal oleh bangsa [HUN.GetAdjective] sebagai Székelyföld, sebagian besar dihuni oleh saudara sebangsa mereka, kaum Hongaria Székely. Mereka menuturkan dialek khas mereka sendiri dan memiliki budaya unik mereka sendiri, dan karenanya [HUN.GetLeader] menyatakan bahwa mereka tidak perlu menjadi bagian yang diintegrasikan dari bangsa mereka. Namun demikian, mereka berhasrat untuk menjadi pelindung bagi rakyat ini, dan meminta kepada kita hak pertuanan atas wilayah tersebut."
 WW_hungary.99.a: "Demi dunia yang lebih adil!"
 WW_hungary.99.b: "Mereka jelas-jelas berdelusi"
 WW_hungary.100.t: "[FROM.GetName] Memberikan Protektorat Székelyföld kepada Kita"
 WW_hungary.100.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima tuntutan kita dan menyerahkan wilayah Székelyföld sebagai kawasan otonom. Kita kini bertugas untuk melindungi dan memajukan wilayah tersebut."
 WW_hungary.100.a: "Akhirnya bersatu kembali!"
 WW_hungary.101.t: "[FROM.GetName] Menolak Permintaan Protektorat Székelyföld Kita"
 WW_hungary.101.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak tuntutan kita akan sebuah protektorat otonom Székely. Rakyat Székely tetap rentan dan tanpa perlindungan. Mengingat para penguasa mereka saat ini sangat sedikit mempedulikan mereka, haruskah kita turun tangan dan menduduki wilayah tersebut?"
 WW_hungary.101.a: "Mereka akan menyesali tindakan mereka"
 WW_hungary.101.b: "Tidak banyak yang bisa kita perbuat"
 WW_hungary.102.t: "Pawai Menuju Budapest"
 WW_hungary.102.desc: "Setelah berbulan-bulan berkampanye dan berdemonstrasi menentang Wali Penguasa Miklós Horthy, gerakan-gerakan fasis, yang terinspirasi oleh pemberontakan Salib Sabit dan pawai ke Roma karya Mussolini, kini telah berbaris menuju ibu kota kita, menuntut agar Horthy mengundurkan diri agar tokoh yang lebih disukai, Gyula Gömbös, dapat mengambil alih posisinya."
 WW_hungary.102.a: "Gömbös harus mengambil alih kekuasaan darurat!"
 WW_hungary.103.t: "Kudeta Ferenc Szálasi"
 WW_hungary.103.desc: "Setelah mempersenjatai Partai Kehendak Nasional agar mereka berbaris ke Budapest demi memuluskan dirinya mengambil alih kepemimpinan nasional, Gömbös tidak lagi membutuhkan mereka, dan mulai bergerak untuk menekan mereka. Namun pagi ini, mereka mengepung Istana Sándor di Budapest, menuntut agar ia mengundurkan diri demi pemimpin mereka, Ferenc Szálasi. Sebagai tanggapan, gerakan MOVE mulai bergerak untuk mengepung kota, dan negara kini berada di ambang kehancuran. Apa yang harus dilakukan?"
 WW_hungary.103.a: "Mundur dan angkat Szálasi sebagai Nemzetvezető baru"
 WW_hungary.103.b: "Kita akan menyetujui tuntutan mereka, dengan satu syarat"
 WW_hungary.104.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Kroasia"
 WW_hungary.104.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan tidak sah kita atas tanah Kroasia. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka sedang berkumpul di perbatasan kita. Bagaimana kita harus menanggapi?"
 WW_hungary.104.a: "Ini tidak sepadan dengan pertumpahan darah"
 WW_hungary.104.b: "Kalau begitu datang dan ambillah!"
 WW_hungary.105.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah Kroasia Mereka"
 WW_hungary.105.desc: "[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Kroasia, dan telah memerintahkan pasukan mereka untuk mundur dan menarik diri dari wilayah tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 WW_hungary.105.a: "Ini hari yang luar biasa!"
 WW_hungary.106.t: "[FROM.GetNameDefCap] Bertahan Teguh"
 WW_hungary.106.desc: "Meski tidak sepenuhnya tak terduga, [FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menempatkan pasukan negaranya dalam siaga tinggi setelah menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun terkait sengketa ini."
 WW_hungary.106.a: "Mereka akan menyesali keputusan mereka!"
 WW_hungary.106.b: "Kita harus merelakan ini"
 WW_hungary.108.t: "[FROM.GetNameDefCap] Ingin Memahkotai Hermann Göring sebagai Raja"
 WW_hungary.108.desc: "\nDengan kepemimpinan [FROM.GetAdjective] di bawah [FROM.GetLeader] kini selaras dengan kita, mereka telah meminta untuk memahkotai seorang raja Jerman guna mengisi takhta [FROM.GetAdjective] yang kini bersifat simbolis. Untuk tujuan ini mereka telah memilih Hermann Göring, dan para sejarawan mereka telah mulai menuliskan hubungannya dengan pemimpin lama Hongaria, Árpád. Haruskah kita mengizinkannya pergi ke [FROM.GetNameDef]?"
 WW_hungary.108.a: "Kita akan mengizinkannya"
 WW_hungary.108.b: "Itu tidak patut"
 WW_hungary.109.t: "[FROM.GetLeader] Mengizinkan Göring Dimahkotai"
 WW_hungary.109.desc: "[GER.GetLeader] yang agung telah mengizinkan Hermann Göring untuk pindah ke negara kita dan menjadi raja konstitusional baru bagi rakyat kita. Ikatan kita semakin erat, dan akhirnya, takhta tidak lagi kosong."
 WW_hungary.109.a: "Kita sangat bersyukur"
 WW_hungary.110.t: "[FROM.GetLeader] Melarang Pemahkotaan Göring"
 WW_hungary.110.desc: "[FROM.GetLeader] yang paranoid telah memutuskan untuk tidak mengizinkan Hermann Göring pindah ke negara kita, terlepas dari desakan yang terus-menerus dan argumen yang disampaikan dengan baik. Kita harus bertahan tanpa seorang raja, dan menjadikan Szálasi sebagai satu-satunya pemimpin bangsa."
 WW_hungary.110.a: "Tampaknya bukan kerajaan lagi"
 WW_hungary.111.t: "Referendum untuk Bergabung dengan Negara [HUN.GetAdjective]"
 WW_hungary.111.desc: "Sebuah referendum publik telah berlangsung selama sebulan terakhir di [664.GetName], dengan tujuan memutuskan apakah mereka ingin bergabung dengan [HUN.GetNameDef] atau tidak. Dengan disetujui oleh para pengamat internasional, dapat diasumsikan secara aman bahwa tidak banyak kecurangan pemilu yang terjadi. Namun, hasilnya telah keluar, dengan sebagian besar rakyat memilih untuk meninggalkan bangsa kita. Haruskah kita menerima ini?"
 WW_hungary.111.a: "Jika itulah yang diinginkan oleh rakyat"
 WW_hungary.111.b: "Referendum itu penuh kecurangan"
 WW_hungary.112.t: "[FROM.GetNameDefCap] Menerima Referendum"
 WW_hungary.112.desc: "Kepemimpinan di [FROM.GetNameDef] telah tampil di depan publik menyatakan dukungan teguh mereka bagi penentuan nasib sendiri rakyat di wilayah [664.GetName]. Sudah saatnya mereka berhak memilih di negara mana mereka ingin hidup, demikian dinyatakan [FROm.GetLeader] awal pekan ini, yang pada dasarnya melepaskan klaim mereka atas wilayah tersebut."
 WW_hungary.112.a: "Tanggapan yang masuk akal"
 WW_hungary.113.t: "[FROM.GetNameDefCap] Menyatakan Referendum Tidak Sah"
 WW_hungary.113.desc: "Kepemimpinan di [FROM.GetNameDef] telah tampil di depan publik menyatakan bahwa hasil referendum yang diadakan di wilayah [664.GetName] awal bulan ini tidak sah, menyatakan bahwa jumlah pemilih dan pengamat internasional penuh dengan kecurangan, jelas-jelas memendam keberpihakan terhadap pemerintah [ROOT.GetAdjective]."
 WW_hungary.113.a: "Kita harus menerimanya"
 WW_hungary.114.t: "Referendum untuk Bergabung dengan Negara [HUN.GetAdjective]"
 WW_hungary.114.desc: "Sebuah referendum publik telah berlangsung selama sebulan terakhir di [73.GetName], dengan tujuan memutuskan apakah mereka ingin bergabung dengan [HUN.GetNameDef] atau tidak. Dengan disetujui oleh para pengamat internasional, dapat diasumsikan secara aman bahwa tidak banyak kecurangan pemilu yang terjadi. Namun, hasilnya telah keluar, dengan sebagian besar rakyat memilih untuk meninggalkan bangsa kita. Haruskah kita menerima ini?"
 WW_hungary.114.a: "Jika itulah yang diinginkan oleh rakyat"
 WW_hungary.114.b: "Referendum itu penuh kecurangan"
 WW_hungary.115.t: "[FROM.GetNameDefCap] Menerima Referendum"
 WW_hungary.115.desc: "Kepemimpinan di [FROM.GetNameDef] telah tampil di depan publik menyatakan dukungan teguh mereka bagi penentuan nasib sendiri rakyat di wilayah [73.GetName]. Sudah saatnya mereka berhak memilih di negara mana mereka ingin hidup, demikian dinyatakan [FROm.GetLeader] awal pekan ini, yang pada dasarnya melepaskan klaim mereka atas wilayah tersebut."
 WW_hungary.115.a: "Tanggapan yang masuk akal"
 WW_hungary.116.t: "[FROM.GetNameDefCap] Menyatakan Referendum Tidak Sah"
 WW_hungary.116.desc: "Kepemimpinan di [FROM.GetNameDef] telah tampil di depan publik menyatakan bahwa hasil referendum yang diadakan di wilayah [73.GetName] awal bulan ini tidak sah, menyatakan bahwa jumlah pemilih dan pengamat internasional penuh dengan kecurangan, jelas-jelas memendam keberpihakan terhadap pemerintah [ROOT.GetAdjective]."
 WW_hungary.116.a: "Kita harus menerimanya"
 WW_hungary.117.t: "Referendum untuk Bergabung dengan Negara [HUN.GetAdjective]"
 WW_hungary.117.desc: "Sebuah referendum publik telah berlangsung selama sebulan terakhir di [45.GetName], dengan tujuan memutuskan apakah mereka ingin bergabung dengan [HUN.GetNameDef] atau tidak. Dengan disetujui oleh para pengamat internasional, dapat diasumsikan secara aman bahwa tidak banyak kecurangan pemilu yang terjadi. Namun, hasilnya telah keluar, dengan sebagian besar rakyat memilih untuk meninggalkan bangsa kita. Haruskah kita menerima ini?"
 WW_hungary.117.a: "Jika itulah yang diinginkan oleh rakyat"
 WW_hungary.117.b: "Referendum itu penuh kecurangan"
 WW_hungary.118.t: "[FROM.GetNameDefCap] Menerima Hasil Referendum"
 WW_hungary.118.desc: "Pimpinan di [FROM.GetNameDef] telah tampil ke hadapan publik menyatakan dukungan teguh mereka terhadap hak menentukan nasib sendiri bagi rakyat di wilayah [45.GetName]. Sudah saatnya mereka berhak memilih di negara mana mereka ingin bernaung, demikian dinyatakan [FROm.GetLeader] awal pekan ini, yang secara efektif melepaskan klaim mereka atas wilayah tersebut."
 WW_hungary.118.a: "Sebuah tanggapan yang bijaksana"
 WW_hungary.119.t: "[FROM.GetNameDefCap] Menyatakan Referendum Tidak Sah"
 WW_hungary.119.desc: "Pimpinan di [FROM.GetNameDef] telah tampil ke publik menyatakan bahwa hasil referendum yang diselenggarakan di wilayah [45.GetName] awal bulan ini tidak sah, menegaskan bahwa tingkat partisipasi pemilih dan pemantau internasional sarat dengan kecurangan, serta jelas-jelas berpihak kepada pemerintah [ROOT.GetAdjective]."
 WW_hungary.119.a: "Kita terpaksa menerimanya"
 WW_hungary.120.t: "Referendum untuk Bergabung dengan Negara [HUN.GetAdjective]"
 WW_hungary.120.desc: "Referendum rakyat telah berlangsung selama sebulan terakhir di [76.GetName], dengan tujuan memutuskan apakah mereka ingin bergabung dengan [HUN.GetNameDef] atau tidak. Mengingat telah disetujui oleh para pengamat internasional, dapat dipastikan bahwa tidak banyak kecurangan pemilu yang terjadi. Hasilnya kini telah keluar, dengan sebagian besar rakyat memilih untuk memisahkan diri dari negara kita. Haruskah kita menerimanya?"
 WW_hungary.120.a: "Jika memang itu kehendak rakyat"
 WW_hungary.120.b: "Referendum tersebut penuh kecurangan"
 WW_hungary.121.t: "[FROM.GetNameDefCap] Menerima Hasil Referendum"
 WW_hungary.121.desc: "Pimpinan di [FROM.GetNameDef] telah tampil ke hadapan publik menyatakan dukungan teguh mereka terhadap hak menentukan nasib sendiri bagi rakyat di wilayah [76.GetName]. Sudah saatnya mereka berhak memilih di negara mana mereka ingin bernaung, demikian ditegaskan [FROm.GetLeader] awal pekan ini, yang secara efektif melepaskan klaim mereka atas wilayah tersebut."
 WW_hungary.121.a: "Sebuah tanggapan yang bijaksana"
 WW_hungary.122.t: "[FROM.GetNameDefCap] Menyatakan Referendum Tidak Sah"
 WW_hungary.122.desc: "Pimpinan di [FROM.GetNameDef] telah tampil ke publik menyatakan bahwa hasil referendum yang digelar di wilayah [76.GetName] awal bulan ini tidak sah, seraya menegaskan bahwa tingkat partisipasi pemilih dan pengamat internasional sarat rekayasa, serta secara nyata memperlihatkan keberpihakan kepada pemerintah [ROOT.GetAdjective]."
 WW_hungary.122.a: "Kita terpaksa menerimanya"
 WW_hungary.123.t: "Pawai Palang Arit Menuju Budapest"
 WW_hungary.123.desc: "Pasukan kita berhasil mencegat politisi sosialis-nasional radikal Zoltán Böszörmény dan para pengikutnya yang berbaris menuju Budapest, dalam sebuah upaya kudeta yang sangat terinspirasi oleh pawai Mussolini ke Roma. Aktivis politik garis tepi ini, yang menjuluki dirinya sendiri sebagai 'raksasa di antara para raksasa intelektual, serta penyair agung Hungaria dengan misi kenabian', telah menghimpun gerombolan pengikut agraris yang kecewa di bawah panji Palang Arit mereka, dan kini bergerak menuju ibu kota kita. Bagaimana kita harus menghadapinya?"
 WW_hungary.123.a: "Bubarkan mereka dan tangkap pemimpin menyedihkan itu!"
 WW_hungary.123.b: "Lepaskan tembakan dan buat mereka lari kocar-kacir"
 HUN_third_mexican_empire_tt: "§YMeksiko§! akan dikenal sebagai §YKekaisaran Meksiko Ketiga§!.\n"
 HUN_croatia_slavonia_tt: "§YKroasia§! akan dikenal sebagai §YKerajaan Kroasia-Slavonia§!.\n"
 HUN_bohemia_and_silesia_tt: "§YCekoslowakia§! akan dikenal sebagai §YKerajaan Bohemia-Moravia dan Silesia§!.\n"
 HUN_cisleithania_tt: "§YAustria§! akan dikenal sebagai §YKerajaan dan Tanah yang Terwakili dalam Dewan Kekaisaran§!.\n"
 WW_hungary.124.t: "Seorang Pria Kembali ke Kampung Halaman"
 WW_hungary.124.desc: "Pagi-pagi buta hari ini, pihak berwenang di Gori melaporkan seorang pria menuntut pengembalian tanah perkebunan yang ia klaim pernah menjadi miliknya, seraya mengaku baru saja berhasil kembali ke tanah airnya dan lolos dari cengkeraman ancaman Rusia. Ia juga berjanji bahwa jika diizinkan terjun ke dunia politik, ia sanggup memimpin bangsa kita menuju kejayaan, konon mewarisi garis keturunan politisi terpandang. Apakah ia sosok yang kita butuhkan demi memulihkan impian Georgia Raya?"
 WW_hungary.124.a: "Beri pria ini jabatan, sekarang juga!"
 WW_hungary.124.b: "Apa pun yang ia katakan, kita tak boleh mempercayainya"
 ### HUN news events ###
 wuw_HUN_news_events.1.t: "[HUN.GetNameDEFCAP] Mengumumkan Program Győri"
 wuw_HUN_news_events.1.d: "\nPemerintah [HUN.GetAdjective] di bawah [HUN.GetLeader] telah mengumumkan program industri skala besar yang baru, dengan tujuan mempersenjatai kembali bangsa secara efisien dan secepat mungkin. Pengamat luar negeri memandang ini sebagai tindakan agresi oleh [HUN.GetNameDef] terhadap tetangga-tetangganya, tetapi hanya waktu yang akan membuktikan apa niat mereka yang sebenarnya."
 wuw_HUN_news_events.1.a: "Mereka sedang mempersiapkan sesuatu..."
 wuw_HUN_news_events.1.b: "Ini akan mengamankan masa depan kita!"
 wuw_HUN_news_events.2.t: "[HUN.GetNameDefCap] Bergabung dengan Blok [GER.GetAdjective]"
 wuw_HUN_news_events.2.d: "Setelah menandatangani pakta baru bantuan timbal balik serta pemajuan tujuan nasional masing-masing, hari ini [GER.GetLeader] dan [HUN.GetLeader] mengumumkan bergabungnya [HUN.GetNameDef] ke dalam faksi [GER.GetAdjective]."
 wuw_HUN_news_events.2.a: "Bagaimana dampaknya kelak?"
 wuw_HUN_news_events.2.b: "Demi masa depan yang lebih gemilang!"
 wuw_HUN_news_events.2.c: "Mereka akan menjadi pion yang berguna"
 wuw_HUN_news_events.3.t: "[HUN.GetNameDefCap] Membentuk Kembali Kekuatan Sentral"
 wuw_HUN_news_events.3.desc: "\nTanpa opsi aliansi yang layak di kawasan sekitarnya, [HUN.GetNameDef] memutuskan untuk kembali membentuk Blok Poros Sentral. Setelah melepaskan diri dari belenggu traktat-traktat yang dibebankan kepada mereka, negara ini mengambil haluan menuju remiliterisasi dengan kecepatan kilat. Apakah aliansi baru ini akan menandingi kedigdayaan pendahulunya di Perang Besar atau tidak, masih harus dibuktikan oleh sejarah."
 wuw_HUN_news_events.3.a: "Sangat mengkhawatirkan"
 wuw_HUN_news_events.3.b: "Kita akan merebut kembali kejayaan masa lalu!"
 wuw_HUN_news_events.3.c: "Mereka melanjutkan warisan luhur kita"
 GER_Rejected_HUN_central_powers: "Jerman menolak masuknya kita ke Blok Poros Sentral"
 wuw_HUN_news_events.4.t: "[HUN.GetNameDefCap] Memproklamasikan Dominasi Global"
 wuw_HUN_news_events.4.desc: "[HUN.GetLeader] dari [HUN.GetNameDef] telah mengumumkan ambisi bangsanya untuk mendominasi jagat raya dan menegakkan hegemoni [HUN.GetAdjective] di seluruh benua. Mereka mengklaim bahwa ini adalah hak kesulungan rakyat Kerajaan Apostolik, dan mereka tidak akan pernah lagi bertekuk lutut di hadapan kekuatan asing."
 wuw_HUN_news_events.4.a: "Mereka harus dihancurkan!"
 wuw_HUN_news_events.4.b: "Dunia kini berada dalam genggaman kita!"
 wuw_HUN_news_events.5.t: "[HUN.GetLeader] Mengemban Mahkota Hungaria"
 wuw_HUN_news_events.5.desc: "Mendambakan sosok Raja bagi bangsa mereka, bangsa [HUN.GetAdjective], seusai perundingan dan persiapan panjang, secara resmi menobatkan [HUN.GetLeader] awal pekan ini. Hari ini, di tengah riuh gegap gempita dan perayaan akbar, ia dinobatkan sebagai Raja Hungaria dalam sebuah upacara khidmat di Istana Kerajaan di Budapest."
 wuw_HUN_news_events.5.a: "Seorang raja, akhirnya!"
 wuw_HUN_news_events.5.b: "Musuh baru telah bangkit"
 wuw_HUN_news_events.5.c: "Sebuah sekutu potensial?"
 wuw_HUN_news_events.6.t: "Joseph August Mengemban Mahkota Hungaria"
 wuw_HUN_news_events.6.desc: "Mendambakan seorang Raja bagi bangsa mereka, bangsa [HUN.GetAdjective], seusai perundingan dan persiapan yang panjang, secara resmi menobatkan Joseph August von Habsburg, Palatine terakhir Hungaria, Adipati Utama Austria dan Pangeran Hungaria dan Bohemia, serta Feldmarschall dari bekas tentara Austria-Hungaria, awal pekan ini. Hari ini, di tengah kemeriahan dan sukacita rakyat, ia dinobatkan sebagai Raja Hungaria dalam upacara khidmat di Istana Kerajaan di Budapest.\nSebagai seorang Vitéz dan bangsawan Habsburg, kecondongan ideologis sang Raja baru terpampang nyata, dan ia telah menegaskan bahwa dirinya 'akan membawa Hungaria menuju keagungan yang layak didapatkannya, tanpa melanggar traktat-traktat yang membubarkan Kekaisaran Austria-Hungaria'. Ditambah dengan janji sang Raja untuk 'memulihkan ketidakadilan yang ditimpakan kepada kita di masa lalu', kecil kemungkinan penobatan ini akan meredakan ketegangan di kawasan tersebut."
 wuw_HUN_news_events.6.a: "Seorang raja, akhirnya!"
 wuw_HUN_news_events.6.b: "Musuh baru telah bangkit"
 wuw_HUN_news_events.6.c: "Sebuah sekutu potensial?"
 wuw_HUN_news_events.7.t: "Pemulihan Republik Soviet Hungaria"
 wuw_HUN_news_events.7.desc: "Hari ini, Ketua Dewan Eksekutif Pusat Hungaria, Béla Kun, mengumumkan pembentukan kembali Republik Soviet Federatif Dewan-Dewan di Hungaria, yang sebelumnya runtuh seketika pada Agustus 1919. Kendati di masa lalu sempat dihancurkan oleh gabungan kekuatan kontra-revolusioner dan Entente Kecil, Béla Kun menegaskan bahwa kali ini nasibnya akan berbeda. Apa yang menanti kawasan Balkan pada tahun-tahun mendatang?"
 wuw_HUN_news_events.7.a: "Kaum buruh sedunia, bersatulah!"
 wuw_HUN_news_events.7.b: "Apa gerangan yang sedang mereka rencanakan?"
 wuw_HUN_news_events.7.c: "Dasar kaum revisionis gadungan..."
 wuw_HUN_news_events.8.t: "Proklamasi Republik Rakyat Hungaria"
 wuw_HUN_news_events.8.desc: "Hari ini, Sekretaris Jenderal Hungaria, Mátyás Rákosi, telah memproklamasikan berdirinya Republik Rakyat Hungaria yang baru, seraya mengumumkan bahwa negara tersebut bertekad mempererat kerja sama dengan [SOV.GetNameDef]. Kendati ia menyatakan negaranya sebagai demokrasi terbuka, corak kediktatorannya sangat mustahil untuk dipungkiri. Bagaimanakah nasib masa depan rakyat Hungaria?"
 wuw_HUN_news_events.8.a: "Akhirnya tiba juga!"
 wuw_HUN_news_events.8.b: "Perdamaian memang tak pernah menjadi pilihan..."
 wuw_HUN_news_events.8.c: "Sebuah kejutan, namun sangat disambut baik"
 wuw_HUN_news_events.9.t: "[HUN.GetNameDefCap] Menduduki Burgenland"
 wuw_HUN_news_events.9.desc: "Awal pekan ini, pasukan [HUN.GetAdjective] memasuki Eisenstadt dan menduduki wilayah tersebut. Mereka mengklaim aksi ini demi melindungi rakyat [HUN.GetAdjective] di kawasan itu, yang baru saja turun ke jalan memprotes apa yang menurut mereka adalah pendudukan ilegal pasca-Trianon. Akankah peristiwa ini memicu perang baru di Balkan, ataukah hanya sekadar penyesuaian kecil garis perbatasan?"
 wuw_HUN_news_events.9.a: "Kembali ke tangan yang berhak"
 wuw_HUN_news_events.9.b: "Itu bukan milik mereka!"
 wuw_HUN_news_events.9.c: "Sebuah Perkembangan yang Menarik"
 ##### Belgian events #####
 #### Historical ####
 ### Political Events
 #Government Resigns
 ww_BEL_event_political.1.t: "Pemerintah Mengundurkan Diri dan Pemilu Dipercepat"
 ww_BEL_event_political.1.desc: "Tekanan pada pemerintah akibat skandal korupsi yang terus berlanjut akhirnya meruntuhkan kabinet. Tim penyelidik yang dipimpin Léon Degrelle, pemimpin gerakan fasis Rexis, telah menyelidiki penyuapan menteri selama beberapa tahun yang mengungkap banyak aliran dana gelap.\n\nDalam upaya meraih kembali legitimasi, Perdana Menteri Paul van Zeeland yang terpojok menyerukan pemilu sela untuk mengembalikan kredibilitas dan keabsahan, dan hasilnya kini telah keluar.\n\nParti Ouvrier Belge (Partai Buruh Belgia) yang dipimpin Emile Vandervelde tampil terbaik, memanfaatkan ketidakpopuleran rival politiknya. Ia dapat memanfaatkan kemenangan ini untuk membentuk Pemerintahan Minoritas, atau bekerja sama dengan partai Katolik Paul van Zeeland untuk menggalang mayoritas yang lebih stabil dan membentuk Pemerintahan Persatuan Nasional.\n\nPerlu dicatat pula bahwa partai Rexis pimpinan Léon Degrelle juga berkinerja sangat gemilang, dengan sikap antikorupsi mereka yang terbukti sangat populer."
 ww_BEL_event_political.1.a: "Bentuk Pemerintahan Persatuan Nasional"
 ww_BEL_event_political.1.b: "Vandervelde membentuk Pemerintahan Minoritas"
 BEL_paul_van_zeeland_remains_tt: "§YPaul van Zeeland§! tetap menjabat sebagai Perdana Menteri, memimpin koalisi luas partai-partai §YDemokratis§!."
 #Corrupt Zeeland
 ww_BEL_event_political.2.t: "Skandal Korupsi Paul van Zeeland"
 ww_BEL_event_political.2.desc: "Skandal korupsi yang menghantui partai Katolik Paul van Zeeland hari ini semakin memburuk tatkala sang Perdana Menteri sendiri didapati menerima \"dana sumbangan\"! Tampaknya tinggal menunggu waktu saja sebelum pemerintahannya runtuh kembali..."
 ww_BEL_event_political.2.a: "Apakah tidak ada akhir bagi korupsi ini?!"
 #Royal Appointment
 ww_BEL_event_political.3.t: "Penunjukan Kerajaan"
 ww_BEL_event_political.3.desc: "Paul van Zeeland akhirnya mengundurkan diri sebagai Perdana Menteri, meninggalkan jabatannya dengan penuh aib. Kali ini Leopold III, sang Raja sendiri, telah menyatakan akan turun tangan dan menunjuk seorang Perdana Menteri baru. Ada dua kandidat terkemuka:\n\nPaul-Émile Janson, anggota Partai Liberal dan tokoh Pemerintahan Persatuan Nasional yang dipandang sebagai sosok bertangan dingin. Sosok lainnya adalah Léon Degrelle, yang dielu-elukan sebagai suara hukum dan ketertiban, serta baru saja terdongkrak oleh keberhasilan partainya dalam pemilu."
 ww_BEL_event_political.3.a: "Tunjuk sosok yang stabil, tokoh Liberal Paul-Émile Janson"
 ww_BEL_event_political.3.b: "Pilih tokoh Rexis Léon Degrelle, demi memulihkan hukum dan ketertiban"
  #Budgetary Crisis
 ww_BEL_event_political.4.t: "Krisis Anggaran"
 ww_BEL_event_political.4.desc: "Terlepas dari tanda-tanda awal pemulihan ekonomi kita, kita sekali lagi dihadapkan pada krisis keuangan. Perdana Menteri [BEL.GetLeader] telah gagal meloloskan rancangan anggaran [BEL.GetHerHis] melalui parlemen, tidak mampu mencapai konsensus luas tentang reformasi pajak yang amat dibutuhkan demi membendung memburuknya keuangan negara, yang sekali lagi berujung pada keruntuhan pemerintah.\n\nHal ini berujung pada penyerahan kekuasaan secara cepat kepada Paul-Henri Spaak, bintang yang tengah bersinar dari Partai Buruh dan Perdana Menteri Sosialis pertama di Belgia."
 ww_BEL_event_political.4.a: "Semoga Perdana Menteri Spaak bertahan lebih lama!"
  #Adriaan Martens Crisis
 ww_BEL_event_political.5.t: "Krisis Adriaan Martens"
 ww_BEL_event_political.5.desc: "Apa yang berawal dari penunjukan pejabat biasa berubah menjadi krisis politik baru bagi pemerintah kita. Perdana Menteri perlu menunjuk anggota baru untuk Akademi Kedokteran Kerajaan, dan ia mengajukan Adriaan Martens untuk dipertimbangkan. Ini ternyata menjadi pilihan kontroversial akibat nasionalisme Flandria Martens dan catatan kolaborasinya dengan penjajah Jerman semasa Perang Besar. Pilihan ini ditentang keras oleh kalangan veteran, liberal, warga Belgia berbahasa Prancis, bahkan sang Raja sendiri telah mengisyaratkan ketidaksenangannya.\n\n[BEL.GetLeader] telah berupaya membela pilihan tersebut, namun berada di bawah tekanan yang kian besar. Para lawannya telah menyerukan pemilu sela untuk memilih pemimpin baru, kendati Spaak berpotensi memiliki modal politik untuk berjuang mempertahankan posisinya."
 ww_BEL_event_political.5.a: "Perdana Menteri harus mundur dan menggelar pemilu sela"
 ww_BEL_event_political.5.b: "Spaak memiliki dukungan politik untuk bertahan melalui krisis ini"
  #The Flemish Question
 ww_BEL_event_political.6.t: "Persoalan Flandria"
 ww_BEL_event_political.6.desc: "Sejak awal berdirinya, Belgia adalah negara yang terbelah di antara dua kelompok bahasa: Walloon yang berbicara bahasa Prancis, dan Flandria yang berbicara bahasa Belanda. Hal ini menimbulkan serangkaian persoalan di dalam bangsa kita, mulai dari kesalahpahaman biasa antarsahabat, perintah militer yang keliru dijalankan, hingga ketidakadilan hukum akibat terdakwa tidak menuturkan bahasa yang sama dengan pengadilan yang mengadilinya.\n\nSudah saatnya mengesampingkan perpecahan ini untuk selamanya, dan memutuskan bagaimana cara terbaik mempersatukan bangsa kita di bawah satu model bahasa bersama."
 ww_BEL_event_political.6.a: "Bahasa Belanda harus diprioritaskan."
 ww_BEL_event_political.6.b: "Bahasa Prancis harus diprioritaskan."
 ww_BEL_event_political.6.c: "Belgia didefinisikan oleh kedua kebudayaan secara setara."
  #The Snap Election
 ww_BEL_event_political.7.t: "Pemilu Sela"
 ww_BEL_event_political.7.desc: "Dengan tertanganinya Krisis Konstitusional untuk saat ini, sudah saatnya memastikan pemerintah kembali memiliki legitimasinya, jika tidak, mereka tak ada bedanya dengan pihak yang baru saja digulingkannya. Saat ini Paul-Henri Spaak dari kaum Sosialis dan Hubert Pierlot dari Partai Katolik adalah kandidat terdepan dalam kemungkinan digelarnya pemilu sela."
 ww_BEL_event_political.7.a: "Hubert Pierlot dan Partai Katolik akan tetap teguh melawan mereka yang mengancam kita."
 ww_BEL_event_political.7.b: "Paul-Henri Spaak dan Partai Buruh akan memimpin kita menuju masa depan sosialis baru."
 #Communist Language Problems
 ww_BEL_event_political.8.t: "Bahasa Rakyat"
 ww_BEL_event_political.8.desc: "Rakyat kita telah lama terpecah oleh bahasa. Kaum Walloon berbicara bahasa Prancis, dan kaum Flandria berbicara bahasa Belanda yang menorehkan jurang pemisah di antara kelompok-kelompok tersebut serta menghalangi perkembangan [ROOT.GetName] yang lebih bersatu. Kita harus mengambil keputusan mengenai apa bahasa resmi kita, jika tidak, kesalahpahaman antarsahabat, perintah militer yang salah dieksekusi, dan kegagalan peradilan tidak akan pernah berhenti menjadi bagian dari kehidupan sehari-hari rakyat [ROOT.GetAdjective]."
 ww_BEL_event_political.8.a: "Bahasa Belanda adalah bahasa kita"
 ww_BEL_event_political.8.b: "Bahasa Prancis adalah bahasa kita"
 ww_BEL_event_political.8.c: "Bahasa-bahasa kita setara dan kita akan mempertahankan keduanya!"
 ### Diplomatic Events
 #Repudiate Treaties
 ww_BEL_event_diplomatic.1.t: "[FROM.GetNameDefCap] Menolak Jaminan Kita"
 ww_BEL_event_diplomatic.1.desc: "[FROM.GetLeader] telah memberitahu kita bahwa traktat pertahanan timbal balik antara negara kita batal demi hukum karena mereka mengupayakan pendekatan netral di masa-masa sulit ini. Namun, hal itu terbukti tidak banyak membantu mereka semasa Perang Besar...."
 ww_BEL_event_diplomatic.1.a: "Biarkan mereka melangkah sendiri"
 #Luxembourg Receives Ultimatum - to LUX
 ww_BEL_event_diplomatic.2.t: "[FROM.GetNameDefCap] Menuntut Aneksasi Kita"
 ww_BEL_event_diplomatic.2.desc: "[FROM.GetLeader] telah menyerukan ikatan masa lalu serta kesamaan warisan budaya dan bahasa kita dalam upaya mengamankan aneksasi negara kita ke dalam bangsa mereka."
 ww_BEL_event_diplomatic.2.a: "Kita lebih kuat bila bersatu."
 ww_BEL_event_diplomatic.2.b: "Luksemburg adalah bangsa yang bangga dan berdaulat!"
 #Luxembourg Yields - to BEL
 ww_BEL_event_diplomatic.3.t: "[FROM.GetNameDefCap] Tunduk"
 ww_BEL_event_diplomatic.3.desc: "Kita telah menerima kabar luar biasa! Rakyat [FROM.GetNameDefCap] dengan bijak telah menetapkan bahwa kita lebih perkasa bila bersatu, dan berbagai pengaturan telah dilakukan demi menata roda administrasi baru wilayah ini."
 ww_BEL_event_diplomatic.3.a: "Bagus sekali"
 #Luxembourg Resists - to BEL
 ww_BEL_event_diplomatic.4.t: "[FROM.GetNameDefCap] Melawan!"
 ww_BEL_event_diplomatic.4.desc: "Sayang sekali, tampaknya rakyat [FROM.GetNameDefCap] memiliki rasa percaya diri yang berlebihan atas kedaulatan mereka, dan memilih menolak tawaran tulus penyatuan kita. Kita perlu menunjukkan kepada mereka keperkasaan bangsa kita, dan memasukkan mereka ke dalam persatuan kita melalui jalan kekerasan."
 ww_BEL_event_diplomatic.4.a: "Mereka mengambil pilihan yang keliru"
 ##Demand Calais Events
 # To Belgium : What can we offer?
 ww_BEL_event_diplomatic.5.t: "Bagaimana Kita Seharusnya Merebut Calais?"
 ww_BEL_event_diplomatic.5.desc: "Kita telah memutuskan untuk menuntut Calais dari Prancis, namun kita masih harus memilih bagaimana cara mendapatkannya. Tentu saja tentara kita yang perkasa dapat merebut tanah ini tanpa kesulitan, namun kita harus memperhitungkan kemungkinan terjadinya kerusakan sampingan, sehingga menempuh jalan alternatif mungkin merupakan pilihan yang bijak. Cara penyatuannya tidaklah penting bagi kita, asalkan apa yang menjadi hak kita kembali ke pangkuan!"
 ww_BEL_event_diplomatic.5.a: "Ancam perang demi merebutnya."
 ww_BEL_event_diplomatic.5.b: "Kongo demi Calais."
 ww_BEL_event_diplomatic.5.c: "Berikan kompensasi finansial."
 ww_BEL_event_diplomatic.5.d: "Tawarkan aliansi sebagai imbalannya."
 # To France : Belgium demand Calais
 ww_BEL_event_diplomatic.6.t: "Belgia Menuntut Calais"
 ww_BEL_event_diplomatic.6.desc: "Kita baru saja menerima tuntutan lancang dari [BEL.GetName] untuk menyerahkan Calais kepada mereka! Mereka mengklaim bahwa tanah ini secara sah merupakan bagian dari Belgia berlandaskan Kadipaten Bourgogne historis, yang mereka klaim sebagai akar warisan mereka. Para duta besar mereka sangat gamblang dalam melontarkan ancaman perang jika kita tidak menyetujui tuntutan mereka, namun mengetahui kekuatan militer mereka, ini kemungkinan besar hanyalah gertakan belaka."
 ww_BEL_event_diplomatic.6.a: "Sacre Bleu! Tidak akan!"
 ww_BEL_event_diplomatic.6.b: "Kita tidak mampu menambah musuh baru saat ini."
 # To France : Belgium offers Congo land for Calais
 ww_BEL_event_diplomatic.7.t: "Belgia Berkehendak Menukar Calais"
 ww_BEL_event_diplomatic.7.desc: "Kita baru saja menerima tawaran menarik dari delegasi [BEL.GetAdjective]. Mereka mengusulkan pertukaran wilayah, Calais untuk sebagian besar Kongo. Kita akan memperoleh negara bagian Coquilhatville dan Stanleyville yang berbatasan langsung dengan kepemilikan wilayah kita saat ini di kawasan tersebut. Tersirat sejumlah ancaman dari diplomat mereka bilamana kita menolak tawaran ini, dan ini akan menjadi perluasan signifikan bagi tanah Afrika kita, tetapi apakah sepadan dengan biayanya?"
 ww_BEL_event_diplomatic.7.a: "Tidak, Calais jauh lebih berharga bagi kita."
 ww_BEL_event_diplomatic.7.b: "Baiklah, ini adalah pertukaran yang adil."
 # To France : Belgium offers payment for Calais
 ww_BEL_event_diplomatic.8.t: "Belgia Berkehendak Membeli Calais"
 ww_BEL_event_diplomatic.8.desc: "Kita baru saja menerima tawaran menarik dari delegasi [BEL.GetAdjective]. Mereka menyatakan minat untuk membeli Calais dari kita dalam upaya \"menyatukan kembali wilayah historis mereka\". Jumlah yang mereka usulkan cukup tinggi, dan tentu saja akan membantu memperbaiki perekonomian kita sendiri, persoalannya adalah apakah pelepasan tanah ini sepadan dengan harga tersebut. Perlu dicatat pula bahwa para diplomat mereka mengisyaratkan peningkatan ketegangan jika kita menampik tawaran mereka."
 ww_BEL_event_diplomatic.8.a: "Tidak, Calais jauh lebih berharga bagi kita."
 ww_BEL_event_diplomatic.8.b: "Itu tampaknya harga yang adil!"
# To Congo : Belgium just handed land over to France
 ww_BEL_event_diplomatic.9.t: "Coquilhatville dan Stanleyville Dijual ke Prancis!"
 ww_BEL_event_diplomatic.9.desc: "Gubernur Kolonial kita baru saja diberitahu bahwa [BEL.GetName] telah mencapai kesepakatan dengan [FRA.GetName] untuk menukar Calais dengan beberapa negara bagian kita, yaitu Coquilhatville dan Stanleyville. Sekali lagi para penguasa Eropa merombak perbatasan Afrika tanpa meminta masukan sedikit pun dari kita yang benar-benar hidup di sini!"
 ww_BEL_event_diplomatic.9.a: "Kita harus memperbarui peta kita... Lagi."
 # To Belgium : France accepted! We got the land.
 ww_BEL_event_diplomatic.10.t: "Prancis Menerima!"
 ww_BEL_event_diplomatic.10.desc: "Kita telah menerima kabar dari delegasi kita di Paris bahwa [FRA.GetName] telah memilih untuk menerima tawaran kita, dan prosesnya sudah berjalan untuk mengalihkan administrasi Calais serta wilayah sekitarnya kepada kita!"
 ww_BEL_event_diplomatic.10.a: "Wilayah sah kita telah dipulihkan!"
 # To Belgium : France refused. Escalate?
 ww_BEL_event_diplomatic.11.t: "Meningkatnya Ketegangan atas Calais"
 ww_BEL_event_diplomatic.11.desc: "Delegasi kita di Paris telah mengirimkan kabar bahwa negosiasi untuk Calais telah gagal, dan kita mungkin harus menggunakan kekuatan senjata demi mengamankan tanah yang secara sah milik kita ini. Kita telah mencoba bersikap wajar dalam tawaran kita, namun mereka menolak kita di setiap langkah. Sudah saatnya menunjukkan kepada mereka kekuatan sejati dari kedigdayaan militer [BEL.GetAdjective]."
 ww_BEL_event_diplomatic.11.a: "Mundur dari tepi jurang kehancuran."
 ww_BEL_event_diplomatic.11.b: "Maka mereka telah memilih perang!" #Tool tip to say occupying Paris may be enough to force peace.
 #To ENG/FRA/SOV: Belgium requests guarantee
 ww_BEL_event_diplomatic.12.t: "[FROM.GetNameDefCap] Meminta Bantuan Kita"
 ww_BEL_event_diplomatic.12.desc: "Sebuah komunikasi dari pimpinan [FROM.GetAdjective] baru saja sampai ke hadapan kita. Seiring dunia yang kian memusuhi mereka, mereka menyimpan kekhawatiran tentang kemampuan sendiri dalam menjaga keutuhan negerinya. Bantuan kita akan sangat dihargai, dan akan menjadi bagian penting demi menjaga perdamaian di kawasan."
 ww_BEL_event_diplomatic.12.a: "Mereka akan mendapatkan bantuan kita!"
 ww_BEL_event_diplomatic.12.b: "Kita tidak sanggup membantu mereka"
 #To Belgium: Gets guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.13.t: "[FROM.GetNameDefCap] Menjamin Kemerdekaan Kita"
 ww_BEL_event_diplomatic.13.desc: "Kepemimpinan [FROM.GetAdjective] telah menanggapi permintaan bantuan kita. Mereka telah sepakat untuk menjamin kemerdekaan kita, dan menjanjikan bala bantuan militer bilamana negara kita diserang oleh kekuatan agresor asing!"
 ww_BEL_event_diplomatic.13.a: "Sangat melegakan!"
 #To Belgium: Does not get guarantee from ENG/FRA/SOV
 ww_BEL_event_diplomatic.14.t: "[FROM.GetNameDefCap] Menolak Membantu Kita"
 ww_BEL_event_diplomatic.14.desc: "Pimpinan [FROM.GetAdjective] telah membalas permintaan bantuan kita. Mereka menolak memberikan bantuan apa pun kepada kita, seraya menyatakan tidak memiliki kapasitas maupun kehendak untuk campur tangan dalam urusan kita."
 ww_BEL_event_diplomatic.14.a: "Betapa kasarnya mereka!"
 #To GER/FRA/ENG: Exiled Belgium Requests equipment
 ww_BEL_event_diplomatic.15.t: "[FROM.GetNameDefCap] Meminta Peralatan"
 ww_BEL_event_diplomatic.15.desc: "Sebuah permohonan dari pimpinan [FROM.GetAdjective] yang diasingkan baru saja sampai kepada kita. Mereka memohon sejumlah peralatan militer dari kita guna melatih sisa-sisa pasukan mereka, dengan harapan suatu saat mampu merebut kembali tanah air mereka."
 ww_BEL_event_diplomatic.15.a: "Kita akan mengirimkan $infantry_equipment$ kepada mereka!"
 ww_BEL_event_diplomatic.15.c: "Kita akan mengirimkan $support_equipment$ kepada mereka!"
 ww_BEL_event_diplomatic.15.b: "Ambisi mereka mulia, tetapi kita tidak bisa menolong"
 #To GER/FRA/ENG: Exiled Belgium Requests factories
 ww_BEL_event_diplomatic.16.t: "[FROM.GetNameDefCap] Meminta Fasilitas Pabrik"
 ww_BEL_event_diplomatic.16.desc: "Kita telah menerima permohonan dari kepemimpinan [FROM.GetAdjective] untuk menggunakan pabrik-pabrik kita guna memproduksi peralatan bagi pasukan mereka yang tersisa. Mereka berhasrat merebut kembali tanah air mereka dan untuk itu, tentara mereka membutuhkan perlengkapan perang."
 ww_BEL_event_diplomatic.16.a: "Tentu saja kita akan menolong"
 ww_BEL_event_diplomatic.16.b: "Kita tidak memiliki kapasitas untuk membantu"
 #To GER/USA/ENG: BEL requests military experience sharing
 ww_BEL_event_diplomatic.17.t: "[FROM.GetNameDefCap] Mengajukan Pertukaran Pengalaman Militer"
 ww_BEL_event_diplomatic.17.desc: "Pemerintahan pengasingan [FROM.GetNameDef] telah menghubungi kita untuk mengajukan prakarsa bersama demi berbagi pengalaman militer di antara angkatan darat kita. Hal ini dapat memberikan manfaat yang sama besarnya bagi kita maupun mereka."
 ww_BEL_event_diplomatic.17.a: "Gagasan yang sangat hebat!"
 ww_BEL_event_diplomatic.17.b: "Tidak sebanding dengan waktu yang terbuang"
 #To BEL: Generic accept
 ww_BEL_event_diplomatic.18.t: "[FROM.GetNameDefCap] Setuju"
 ww_BEL_event_diplomatic.18.desc: "Usulan upaya kita demi memperkuat posisi serta membangun kembali pasukan guna merebut tanah air telah disambut dengan persetujuan dari [FROM.GetNameDef]. Kendati langkah ini tidak dapat secara mandiri menuntaskan masalah kita, ini akan menjadi batu loncatan berharga bagi kita untuk akhirnya merebut kembali kemerdekaan."
 ww_BEL_event_diplomatic.18.a: "Kabar luar biasa!"
 #To BEL: generic reject
 ww_BEL_event_diplomatic.19.t: "[FROM.GetNameDefCap] Menolak"
 ww_BEL_event_diplomatic.19.desc: "Usulan upaya kita demi memperkuat kedudukan dan membangun kembali angkatan perang untuk merebut kembali tanah air telah ditolak mentah-mentah oleh [FROM.GetNameDef]. Kita tadinya berharap ini akan menjadi batu loncatan bagi masa depan, namun tampaknya rencana itu kini telah musnah."
 ww_BEL_event_diplomatic.19.a: "Sangat disayangkan"
 ww_BEL_event_diplomatic.20.t: "[FROM.GetNameDefCap] Mengundang Kita ke Proyek Kerja Sama Eropa"
 ww_BEL_event_diplomatic.20.desc: "Kita telah menerima undangan resmi dari [FROM.GetNameDef] untuk bergabung ke dalam [FROM.GetFactionName]. Ini adalah inisiatif baru mereka untuk mendorong kerja sama di kawasan, dengan harapan prakarsa ini akan menstabilkan wilayah serta membina hubungan diplomatik yang lebih baik."
 ww_BEL_event_diplomatic.20.a: "Sebuah inisiatif yang luar biasa!"
 ww_BEL_event_diplomatic.20.b: "Ini terdengar mencurigakan..."
 ww_BEL_event_diplomatic.21.t: "[FROM.GetNameDefCap] Bergabung dengan [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.21.desc: "Undangan kita kepada [FROM.GetNameDef] telah disambut dengan persetujuan hangat. Mereka sepakat bahwa komunitas Eropa yang lebih luas adalah jalan yang tepat. Melalui kerja sama erat, kita akan mampu menstabilkan kembali kawasan ini."
 ww_BEL_event_diplomatic.21.a: "Kabar Luar Biasa!"
 ww_BEL_event_diplomatic.22.t: "[FROM.GetNameDefCap] Menolak Undangan Kita ke [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.22.desc: "Para diplomat [FROM.GetAdjective] telah kembali dengan jawaban mengecewakan. Mereka berdalih bahwa kendati gagasannya tampak mulia, prakarsa ini niscaya akan gagal, tak ubahnya inisiatif serupa sebelum kita."
 ww_BEL_event_diplomatic.22.a: "Sungguh sangat disayangkan..."
 ww_BEL_event_diplomatic.23.t: "[FROM.GetNameDefCap] Mengajak Kita ke Upaya Riset Mereka"
 ww_BEL_event_diplomatic.23.desc: "Sebuah delegasi [FROM.GetAdjective] telah mendekati kita guna mengusulkan kerja sama riset di seluruh penjuru [FROM.GetFactionName]. Sebagai sekutu dekat, kita perlu saling berbagi teknologi demi memajukan seluruh anggota Uni."
 ww_BEL_event_diplomatic.23.a: "Tentu, kita akan bergabung"
 ww_BEL_event_diplomatic.23.b: "Teknologi kita akan tetap menjadi milik kita sendiri"
 ww_BEL_event_diplomatic.24.t: "[FROM.GetNameDefCap] Bergabung dengan Kelompok Riset Uni Eropa"
 ww_BEL_event_diplomatic.24.desc: "Prakarsa kita untuk membuka wadah pertukaran teknologi antarsekutu telah disambut dengan persetujuan dari [FROM.GetNameDef]. Mereka telah bergabung dalam upaya ini dan akan membagikan kemajuan teknologi mereka kepada kita dan sekutu bersama kita, sebagaimana kita akan membagikan teknologi kita kepada mereka."
 ww_BEL_event_diplomatic.24.a: "Luar biasa!"
 ww_BEL_event_diplomatic.25.t: "[FROM.GetNameDefCap] Menolak Bergabung dengan Kelompok Riset Uni Eropa"
 ww_BEL_event_diplomatic.25.desc: "Kendati kita merasa telah menyajikan argumen yang sangat meyakinkan perihal Kelompok Riset Uni Eropa kepada [FROM.GetNameDef], mereka tetap menolak bergabung dalam inisiatif ini. Kita berharap tetap dapat memetik manfaat dari inisiatif ini, kendati harus berjalan tanpa [FROM.GetNameDef]."
 ww_BEL_event_diplomatic.25.a: "Ya sudah..."
 ww_BEL_event_diplomatic.26.t: "[FROM.GetNameDefCap] Meminta Federalisasi Terbatas"
 ww_BEL_event_diplomatic.26.desc: "Kita telah menerima permohonan dari [FROM.GetNameDef]. Selaku pemimpin [ROOT.GetFactionName], mereka sampai pada kesimpulan bahwa Eropa yang lebih federal akan memperkokoh pertahanan serta perdagangan blok ini, dan memohon agar kita turut bergabung dalam ikhtiar ini."
 ww_BEL_event_diplomatic.26.a: "Demi kemaslahatan [FROM.GetFactionName]"
 ww_BEL_event_diplomatic.26.b: "Tidak, kita harus memikirkan kedaulatan kita!"
 ww_BEL_event_diplomatic.26.b_tt: "§RMereka mungkin akan menendang kita dari faksi!§!"
 ww_BEL_event_diplomatic.27.t: "[FROM.GetNameDefCap] Mengizinkan Federalisasi Terbatas"
 ww_BEL_event_diplomatic.27.desc: "[FROM.GetNameDefCap] telah menyetujui permintaan kita untuk mengikat diri mereka lebih erat dengan [FROM.GetFactionName]. Kita akan diberikan wewenang tertentu atas kebijakan luar negeri mereka dan perdagangan antarnegara kita akan dipermudah."
 ww_BEL_event_diplomatic.27.a: "Luar biasa!"
 ww_BEL_event_diplomatic.28.t: "[FROM.GetNameDefCap] Menolak Federalisasi Terbatas"
 ww_BEL_event_diplomatic.28.desc: "Meskipun memiliki keuntungan yang jelas, [FROM.GetNameDef] telah memilih untuk tidak bergabung dengan gagasan Eropa berformat federal kita. Mereka berdalih bahwa kedaulatan mereka sendiri berdiri di atas kesejahteraan seluruh $EU_tech_sharing_group_name$, yang merupakan sentimen yang cukup mengkhawatirkan dari dalam persatuan."
 ww_BEL_event_diplomatic.28.a: "Hal itu sangat mengkhawatirkan"
 ww_BEL_event_diplomatic.28.b: "Mereka adalah ancaman bagi kita semua!"
 ww_BEL_event_diplomatic.29.t: "Otto von Habsburg Menawarkan Dukungannya"
 ww_BEL_event_diplomatic.29.desc: "Kita telah menerima tawaran dukungan dari sosok yang cukup mengejutkan untuk didengar. Otto von Habsburg mungkin adalah pewaris Karl I, Kaisar Austria, Raja Hungaria, dan Raja Kroasia, namun tampaknya tidak seperti ayahnya, Otto jauh lebih condong ke arah kerja sama di Eropa. Ia menyambut baik upaya kita dan menawarkan bantuannya di ranah diplomatik; jaringan diplomatiknya yang luas dapat menjadi aset berharga bagi kita dan ini adalah bantuan yang dengan senang hati ia tawarkan."
 ww_BEL_event_diplomatic.29.a: "Merupakan kehormatan bagi kita untuk menerimanya bersama kita"
 ww_BEL_event_diplomatic.29.b: "Wangsa Habsburg adalah bagian dari masa lalu."
 ww_BEL_event_diplomatic.30.t: "[FROM.GetNameDefCap] Memohon untuk Bergabung dengan [ROOT.GetFactionName]"
 ww_BEL_event_diplomatic.30.desc: "Menyusul keputusan [FROM.GetAdjective] untuk menanggalkan aspirasi netralitas mereka, kepemimpinan [FROM.GetNameDef] telah menyelaraskan diri semakin erat dengan agenda politik kita. Mereka kini telah menghubungi kita dengan permintaan untuk bergabung langsung ke dalam [ROOT.GetFactionName]. Bantuan mereka dapat sangat berguna, membuka peluang baru bagi strategi ekspansi masa depan kita."
 ww_BEL_event_diplomatic.30.a: "Mereka disambut dengan hangat di sini"
 ww_BEL_event_diplomatic.30.b: "Kita tidak membutuhkan mereka"
 ww_BEL_event_diplomatic.31.t: "[FROM.GetNameDefCap] Menerima Kita ke dalam [FROM.GetFactionName]"
 ww_BEL_event_diplomatic.31.desc: "Pemimpin [FROM.GetAdjective] [FROM.GetLeader] telah menghubungi untuk menyambut kita ke dalam [FROM.GetFactionName]. Mulai sekarang kita akan bertempur bahu-membahu melawan ancaman bersama. Masa-masa netralitas kita telah berakhir!"
 ww_BEL_event_diplomatic.31.a: "Kabar Luar Biasa"
 ww_BEL_event_diplomatic.32.t: "[FROM.GetNameDefCap] Menolak Keanggotaan Kita di [FROM.GetFactionName]"
 ww_BEL_event_diplomatic.32.desc: "Terlepas dari berbagai manfaat nyata, pemimpin [FROM.GetAdjective] [FROM.GetLeader] telah menolak kita sebagai anggota [FROM.GetFactionName]. Kita sebenarnya dapat menyumbangkan banyak hal, namun menimbang tanggapan ini, kita harus mempertimbangkan kembali ambisi untuk bergabung dengan mereka, baik sekarang maupun di masa depan."
 ww_BEL_event_diplomatic.32.a: "Kita dapat menciptakan sesuatu yang lebih baik!"
 BEL_tried_to_join_the_axis_flag: "Sudah pernah berupaya bergabung dengan [GER.GetFactionName]"
 ww_BEL_event_diplomatic.33.t: "Masa Depan Netralitas [ROOT.GetAdjective]"
 ww_BEL_event_diplomatic.33.desc: "Netralitas telah melayani negara kita dengan sangat baik, namun tetap bersikap netral dapat membuat pihak lain memandang kita tak lebih dari sekadar penonton pasif dan sasaran empuk. Kita harus mempertimbangkan dengan matang masa depan kebijakan luar negeri kita, serta sikap kita terkait perjuangan bersenjata mengingat konflik tampaknya akan segera melanda kita dalam waktu dekat."
 ww_BEL_event_diplomatic.33.a: "Kita harus memutus belenggu dan bersiap!"
 ww_BEL_event_diplomatic.33.b: "Netralitas harus dipertahankan!"
 ww_BEL_event_diplomatic.34.t: "[FRA.GetNameDefCap]: Kawan atau Lawan?"
 ww_BEL_event_diplomatic.34.desc: "Betapa pun lengkapnya persenjataan kita, kita harus menerima kenyataan bahwa tetangga Selatan kita kemungkinan besar akan selalu memiliki kapasitas yang lebih besar. Kita harus mencapai kesepakatan bersama, apakah kita menganggap mereka sebagai kawan, ataukah lawan?"
 ww_BEL_event_diplomatic.34.a: "Bangsa [FRA.GetAdjective] adalah kawan kita"
 ww_BEL_event_diplomatic.34.b: "Bangsa [FRA.GetAdjective] tidak dapat dipercaya!"
 ww_BEL_event_diplomatic.35.t: "[FROM.GetNameDefCap] Menghubungi Kita"
 ww_BEL_event_diplomatic.35.desc: "Kita telah dihubungi oleh tetangga utara kita. Mereka berkehendak menjalin hubungan diplomatik yang lebih serius dengan kita. Tawaran mereka berpotensi menguntungkan kedua belah pihak, namun kita tetap harus berhati-hati dalam mengambil keputusan tepat perihal perkara ini."
 ww_BEL_event_diplomatic.35.a: "Tentu saja!"
 ww_BEL_event_diplomatic.35.b: "Tidak, kita tidak melihat adanya manfaat dalam hal ini."
 ww_BEL_event_diplomatic.36.t: "Pihak [FROM.GetAdjective] Setuju"
 ww_BEL_event_diplomatic.36.desc: "Pimpinan [FROM.GetNameDef] sepakat bahwa kita berdua dapat memetik manfaat dari memperdalam hubungan diplomatik. Kita dapat mengandalkan mereka sebagai kawan dan sekutu di dunia yang kian sarat permusuhan ini."
 ww_BEL_event_diplomatic.36.a: "Bagus sekali!"
 ww_BEL_event_diplomatic.37.t: "Pihak [FROM.GetAdjective] Tidak Setuju"
 ww_BEL_event_diplomatic.37.desc: "Terlepas dari keuntungan nyata bagi kedua belah pihak, tampaknya bangsa [FROM.GetAdjective] tidak bersedia memperluas hubungan diplomatik dengan kita melebihi apa yang telah ada. Kita menaruh harapan besar pada hal ini, namun harapan itu rupanya bertepuk sebelah tangan."
 ww_BEL_event_diplomatic.37.a: "Sungguh disayangkan..."
 ### War Events
 #Relocate Air Industries
 ww_BEL_event_war.1.t: "Industri Dirgantara yang Dipindahkan Diaktifkan"
 ww_BEL_event_war.1.desc: "Pandangan jauh ke depan kita untuk membina hubungan kerja yang erat dengan perusahaan industri asing telah membuahkan hasil. Fasilitas mereka siap memulai produksi secepatnya."
 ww_BEL_event_war.1.a: "Inilah alasannya mengapa kita harus merencanakan masa depan!"
 ### King's Surrender Chain
 #Unknown Sympathies
 ww_BEL_event_war.2.t: "Simpati yang Masih Menjadi Misteri"
 ww_BEL_event_war.2.desc: "Raja Leopold III selama ini hidup di bawah bayang-bayang kebesaran ayahnya, Raja Albert sang Raja Prajurit, yang termasyhur karena berhasil mempertahankan Belgia dalam kancah Perang Besar serta menggagalkan kemenangan Kekaisaran Jerman. Kendati dalam prosesnya negeri ini luluh lantak menjadi medan pertempuran, kehormatan militer bangsa tetap tak ternoda dan reputasi Belgia melambung tinggi di panggung dunia.\n\nKini, tatkala Belgia sekali lagi terseret ke dalam perang, ujian watak sesungguhnya bagi Leopold akan segera dimulai, dan riak keresahan yang mengkhawatirkan sudah mulai terdengar.\n\nBerdalih ingin melindungi nyawa rakyatnya, sang Raja telah mulai mencari celah perundingan damai, dan kita mencurigai bilamana Brussels, Liège, atau Antwerpen jatuh, sang Raja mungkin akan menyerah sebelum waktunya, tanpa memedulikan kehendak demokratis rakyat untuk terus bertempur."
 ww_BEL_event_war.2.a: "Raja Leopold akan memimpin kita menuju kemenangan."
 BEL_unknown_sympathies_tt: "§RRaja Leopold akan menyerah jika kita kehilangan salah satu dari Liège, Antwerpen, atau Brussels. Anda mungkin masih memiliki opsi jika saat itu tiba.§!"
 #The King's Surrender
 ww_BEL_event_war.3.t: "Kapitulasi Sang Raja"
 ww_BEL_event_war.3.desc: "Sang Raja, selaku Panglima Tertinggi angkatan bersenjata, hari ini telah menawarkan kapitulasi tanpa syarat bagi [BEL.GetName], tanpa menunggu ratifikasi terlebih dahulu dari parlemen [BEL.GetAdjective]. Secara teknis, selaku Panglima Tertinggi, beliau memiliki kewenangan untuk menyerahkan militer, namun bukan menyerahkan kedaulatan negara itu sendiri.\n\nParlemen sipil telah melarikan diri ke pengasingan, menegaskan dengan sangat gamblang niat mereka untuk melanjutkan pertempuran dengan mengerahkan segenap sumber daya Imperium [BEL.GetAdjective]."
 ww_BEL_event_war.3.a: "Itu adalah kehendak sang Raja!"
 ww_BEL_event_war.3.b: "Lanjutkan pertempuran!"
 ww_BEL_event_war.3.c: "Beliau tidak memiliki hak untuk itu! Tahan sang raja sebagai tahanan rumah."
 #Royal Prisoner
 ww_BEL_event_war.4.t: "Tawanan Kerajaan"
 ww_BEL_event_war.4.desc: "Menyusul pengkhianatannya yang menyerahkan negara kepada sang penyerbu, Raja telah ditempatkan di bawah tahanan rumah dan dicopot dari posisinya sebagai Panglima Tertinggi angkatan bersenjata, dilucuti dari gelar-gelarnya, dan tentu saja dimakzulkan dari mahkotanya. Namun rakyat tetap membutuhkan seorang penguasa, dan kini menjadi pilihan kita mengenai siapa yang harus memimpin perwalian (regensi) hingga putranya cukup umur untuk naik takhta. Terdapat dua opsi:\n\nYang pertama adalah Léon Degrelle, sang Perdana Menteri dan pemimpin rakyat kita yang diangkat secara sah menurut hukum. Pilihan lainnya adalah Pangeran Charles, Pangeran Flandria, adik kandung Leopold yang akan memberikan nuansa legitimasi dan kesinambungan garis takhta."
 ww_BEL_event_war.4.a: "Jadikan Léon Degrelle sebagai pemangku takhta baru"
 ww_BEL_event_war.4.b: "Amankan garis keturunan yang sah bersama Charles"
 #The King's Surrender - Triggered via capitulation rather than event
 ww_BEL_event_war.5.t: "Kapitulasi Sang Raja"
 ww_BEL_event_war.5.desc: "Menyusul perlawanan sengit demi mempertahankan bangsa, Raja Leopold III akhirnya menawarkan penyerahan diri [BEL.GetName] dan pemerintah kita terpaksa menyingkir ke pengasingan. Leopold memilih untuk tetap tinggal bersama rakyatnya, dan menjadi tawanan di istananya sendiri. Kita masih dapat bersandar pada niat baik para sekutu kita, serta mengerahkan segenap sumber daya Imperium [BEL.GetAdjective], agar pada saatnya nanti kita mampu memulihkan tanah air kita."
 ww_BEL_event_war.5.a: "Masa depan masih sarat ketidakpastian."
 ## King's Surrender Chain Ends
 # Belgium demands special treatment (-_-)ゞ゛ - Event for any occupier of Belgium 
 ww_BEL_event_war.6.t: "Para Sekretaris Jenderal"
 ww_BEL_event_war.6.desc: "Sekelompok pegawai negeri sipil Belgia telah mendatangi kita dengan sebuah tawaran; izinkan mereka melanjutkan tugas di kantor-kantor pemerintahan, dan mereka akan memastikan roda pemerintahan daerah tetap berputar lancar dalam masa transisi ini. Pemerintah Belgia telah mengesahkan undang-undang yang melegalkan kerja sama mereka dengan kita demi mengurangi dampak keras pendudukan terhadap rakyat mereka. Mereka bahkan telah memberikan izin kepada bank-bank Belgia untuk tetap membayarkan gaji para administrator ini. Ini adalah peluang bagi kita untuk menunjukkan kesediaan bekerja sama dengan penduduk setempat, dan akan sangat membantu meredam perlawanan aktif di wilayah tersebut."
 ww_BEL_event_war.6.a: "Prakarsa yang bagus, bekerja samalah dengan mereka demi memastikan pendudukan yang lancar."
 ww_BEL_event_war.6.b: "Gagasan yang menarik, kita akan mempertimbangkan tawaran mereka."
 ww_BEL_event_war.6.c: "Ini hanyalah kedok bagi perlawanan yang terorganisir. Tolak."
 BEL_set_secretaries_general_tt: "§YSekretaris Jenderal§! akan diberlakukan sebagai §YHukum Pendudukan§! di seluruh Belgia"
 BEL_available_secretaries_general_tt: "§YSekretaris Jenderal§! kini tersedia sebagai §YHukum Pendudukan§! di Belgia"
 BEL_no_secretaries_general_tt: "§YSekretaris Jenderal§! akan dihapus sebagai §YHukum Pendudukan§! di Belgia"
 BEL_remove_secretaries_general_civs_tt: "Hilangkan 2 §YPabrik Sipil Luar Peta§!"
## France Limited War
 # To Belgium: Inform Belgium of Limited War goals
 ww_BEL_event_war.7.t: "Potensi Perang Terbatas - Paris Harus Jatuh!"
 ww_BEL_event_war.7.desc: "Para diplomat dan jenderal terkemuka kita baru-baru ini bertemu, dan memberi masukan bahwa jika konflik ini tetap berskala terbatas, yaitu tanpa campur tangan kekuatan-kekuatan besar lainnya, maka kita mungkin dapat membawa [FRA.GetName] ke meja perundingan dan mengamankan perjanjian damai yang cepat. Kita tahu bahwa mereka gentar akan meningkatnya ketegangan, dan sebagaimana kita, mereka tidak ingin terseret ke dalam kancah perang global lainnya.\n\nOleh sebab itu, perhitungan kita menyatakan bahwa apabila Paris jatuh, peristiwa itu akan menjadi unjuk keperkasaan yang cukup guna membuat mereka bersedia merundingkan penyerahan Calais yang disengketakan."
 ww_BEL_event_war.7.a: "Pasukan kita akan berderap melintasi jalanan Paris tak lama lagi!"
 # To France: Paris has fallen! Sue for peace?
 ww_BEL_event_war.8.t: "Paris Telah Jatuh!"
 ww_BEL_event_war.8.desc: "Dalam sebuah malapetaka nasional, ibu kota kebanggaan kita, Paris, telah jatuh! Sekali lagi, angkatan bersenjata kita terbukti tidak memadai dalam menghadapi musuh yang secara militer seharusnya lebih lemah. Pihak [FROM.GetAdjective] telah menawarkan penarikan mundur pasukannya dan membiarkan bagian lain negara kita tetap utuh, namun sebagai imbalannya, mereka menuntut kita menyerahkan Calais kepada mereka.\n\nKita sudah dapat merasakan burung-burung nasar mulai berputar mengintai, dan perdamaian ini akan memberi kita waktu untuk memetik pelajaran berharga serta bersiap menghadapi musuh-musuh potensial yang jauh lebih besar kelak."
 ww_BEL_event_war.8.a: "Tawarkan Calais demi perdamaian."
 ww_BEL_event_war.8.b: "Terus bertempur! Peperangan ini belum usai."
 # To Belgium: Accept peace offer?
 ww_BEL_event_war.9.t: "Prancis Menyetujui Perdamaian"
 ww_BEL_event_war.9.desc: "Hari ini, kita menerima kedatangan delegasi Prancis yang datang merundingkan penyelesaian damai atas konflik yang tengah berlangsung menyusul jatuhnya ibu kota mereka. Setelah melalui musyawarah panjang, mereka akhirnya bersepakat menawarkan Calais kepada kita sebagai imbalan atas penghentian permusuhan seketika.\n\nPerlu diingat bahwa ini adalah tawaran satu kali, dan jika kita menolaknya, pertahanan mereka akan menjadi jauh lebih gigih serta kecil kemungkinan mereka akan menawarkannya kembali."
 ww_BEL_event_war.9.a: "Kita terima! Calais demi perdamaian."
 ww_BEL_event_war.9.b: "Terus bertempur! Kita sanggup merebut lebih banyak lagi."
 ww_BEL_event_war.10.t: "Paris di Bawah Kendali [ROOT.GetAdjective]"
 ww_BEL_event_war.10.desc: "Sasaran-sasaran yang digariskan di hadapan kita dalam pembahasan pada hari-hari awal perang melawan bangsa [FRA.GetAdjective] kini telah tercapai. Paris kini berada di bawah kendali kita, dan dengan demikian, orang dapat berasumsi bahwa pihak [FRA.GetAdjective] kini cukup tertekan sehingga tawaran penarikan mundur pasukan kita sebagai imbalan penyerahan Calais akan disambut dengan persetujuan kendati dengan berat hati.\n\nPada saat yang sama, desakan mulai bergema kencang: kita telah melangkah sejauh ini, dan bangsa [FRA.GetAdjective] secara nyata terbukti tak berdaya membendung kita. Mengapa kita harus berhenti sekarang?"
 ww_BEL_event_war.10.a: "Kita telah memperoleh apa yang kita tuju, ajukan perundingan damai!"
 ww_BEL_event_war.10.b: "Kita menghendaki semuanya!"
 ### King's Surrender Chain End
 ### Spanish Civil War Interaction Events ###
 ww_BEL_event_spanish_interaction.1.t: "[FROM.GetNameDefCap] Mengirim Perlengkapan"
 ww_BEL_event_spanish_interaction.1.desc: "Kita telah menerima pengiriman senapan dari pemerintah [FROM.GetAdjective]. Mereka memiliki pandangan yang sama bahwa kaum nasionalis wajib dihentikan, dan berhasrat menyokong perjuangan kita, bukan sekadar lewat kata-kata belaka."
 ww_BEL_event_spanish_interaction.1.a: "Kita akan memanfaatkannya dengan sebaik-baiknya!"
 ww_BEL_event_spanish_interaction.2.t: "Pengiriman Perlengkapan Lanjutan kepada Kaum Republikan [SPR.GetAdjective]"
 ww_BEL_event_spanish_interaction.2.desc: "Pengiriman perlengkapan kita sebelumnya kepada bangsa [SPR.GetAdjective] telah terbukti amat berharga bagi sahabat-sahabat Republikan kita. Kendati demikian, perjuangan mereka masih jauh dari usai dan kita seharusnya sanggup memasok lebih banyak peralatan kepada mereka."
 ww_BEL_event_spanish_interaction.2.a: "Kirim lebih banyak senapan!"
 ww_BEL_event_spanish_interaction.2.b: "Mereka membutuhkan sejumlah Perlengkapan Pendukung!"
 ww_BEL_event_spanish_interaction.2.c: "Kirimkan artileri kepada mereka!"
 ww_BEL_event_spanish_interaction.3.t: "[FROM.GetNameDefCap] Mengirimkan Pasokan Perlengkapan Tambahan"
 ww_BEL_event_spanish_interaction.3.desc: "Kita telah menerima pengiriman tambahan perlengkapan [FROM.GetAdjective]. Bantuan mereka akan terbukti amat berharga dalam memukul mundur malapetaka kaum nasionalis yang memporak-porandakan tanah air kita."
 ww_BEL_event_spanish_interaction.3.a: "Luar biasa!"
 ww_BEL_event_spanish_interaction.4.t: "Pidato [FROM.GetAdjective] Menyokong Perjuangan Kita"
 ww_BEL_event_spanish_interaction.4.desc: "Kita telah diberi warta bahwa beberapa jam lalu sebuah rapat akbar dan pidato digelar demi mendukung kita di [FROM.GetNameDef]. Kepemimpinan [FROM.GetAdjective] sekali lagi menegaskan dukungan teguh mereka bagi kita, dengan harapan langkah ini akan memberi kita ruang gerak lebih leluasa seiring rakyat yang semakin menaruh kepercayaan kepada kita."
 ww_BEL_event_spanish_interaction.4.a: "Sampaikan rasa terima kasih kita kepada bangsa [FROM.GetAdjective]!"
 ww_BEL_event_spanish_interaction.5.t: "Pemberian Dorongan bagi Emigrasi [FROM.GetAdjective]"
 ww_BEL_event_spanish_interaction.5.desc: "Belakangan ini kita menyaksikan lonjakan imigrasi dari warga negara [FROM.GetAdjective]. Banyak dari kalangan pendatang ini menyatakan kesediaan untuk bergabung ke dalam angkatan bersenjata kita bilamana kita membutuhkan tenaga mereka. Tak diragukan lagi bahwa ini merupakan ikhtiar yang terencana dengan matang dari pihak [FROM.GetAdjective]."
 ww_BEL_event_spanish_interaction.5.a: "Kabar luar biasa!"
 ww_BEL_event_spanish_interaction.6.t: "[FROM.GetNameDefCap] Mengajukan Aliansi"
 ww_BEL_event_spanish_interaction.6.desc: "Bangsa [FROM.GetAdjective] yang sebelumnya bersikukuh netral kini mengirimkan sebuah tawaran mengejutkan kepada kita. Mereka berhasrat menggalang aliansi militer dengan kita. Mereka berharap langkah ini memungkinkan pemberian sokongan yang lebih optimal bagi perjuangan kita dalam melawan kaum nasionalis."
 ww_BEL_event_spanish_interaction.6.a: "Gagasan yang sangat cemerlang!"
 ww_BEL_event_spanish_interaction.6.b: "Kita menghargai dukungan mereka, namun terpaksa menolaknya."
 ww_BEL_event_spanish_interaction.7.t: "[FROM.GetNameDef] Bergabung dengan [ROOT.GetFactionName]"
 ww_BEL_event_spanish_interaction.7.desc: "Pihak [FROM.GetAdjective] telah mengembalikan jawaban positif atas proposal kita untuk mendirikan [ROOT.GetFactionName]. Kita akan berdiri teguh bersama-sama menghadapi ancaman kaum nasionalis!"
 ww_BEL_event_spanish_interaction.7.a: "Maju terus!"
 ww_BEL_event_spanish_interaction.8.t: "[FROM.GetNameDefCap] Menolak Usulan Aliansi Kita"
 ww_BEL_event_spanish_interaction.8.desc: "Menimbang dukungan nyata yang tiada henti kita curahkan kepada pihak [FROM.GetAdjective], kita semula menaruh harapan besar bahwa proposal kita akan disambut secara positif. Namun kenyataan berbicara lain; mereka menolak usulan kita, seraya menyatakan bahwa bantuan kita disambut baik, namun mereka tidak menghendaki adanya ikatan aliansi formal."
 ww_BEL_event_spanish_interaction.8.a: "Sungguh tidak tahu terima kasih!"
 ww_BEL_event_spanish_interaction.9.t: "[FROM.GetNameDefCap] Membubarkan $BEL_SPR_alliance$"
 ww_BEL_event_spanish_interaction.9.desc: "Seiring tuntasnya Perang Saudara kita, pihak [FROM.GetAdjective] telah menetapkan bahwa sudah tiba saatnya kemitraan kita disudahi. Kendati langkah ini mengakhiri aliansi kita untuk saat ini, mereka sangat bersikeras bahwa ini bukan berarti kita tak akan pernah bersekutu kembali di masa depan."
 ww_BEL_event_spanish_interaction.9.a: "Sungguh disayangkan"
 ww_BEL_event_misc.1.t: "Sang Bos Telah Tiada"
 ww_BEL_event_misc.1.desc: "Émile Vandervelde, yang berjuluk 'le patron' (sang bos), politisi Sosialis kawakan sekaligus Perdana Menteri [BEL.GetName], telah mengembuskan napas terakhirnya. Beliau termasyhur sebagai anggota delegasi Belgia di Konferensi Perdamaian Paris yang memungkasi Perang Besar, serta penentang gigih Fasisme yang bahkan memperjuangkan intervensi langsung membela kaum Republikan dalam Perang Saudara Spanyol.\n\nHenri de Man telah mengambil alih tampuk kepemimpinan sebagai Perdana Menteri baru, dan akan disumpah oleh Raja pada sore hari ini."
 ww_BEL_event_misc.1.a: "Penerusnya adalah orang yang tepat untuk menuntaskan pekerjaan ini!"
 ww_BEL_event_misc.3.t: "Cockerill: Jantung Manufaktur Belgia"
 ww_BEL_event_misc.3.desc: "Cockerill adalah perusahaan raksasa yang berdiri kokoh di jantung industri manufaktur Belgia. Sepanjang sejarahnya, perusahaan ini tidak hanya memproduksi besi dan baja bermutu tinggi, melainkan juga mesin-mesin rekayasa presisi termasuk mesin uap, kereta api, hingga kapal tempur perang. Reputasinya yang gilang-gemilang mengantarkannya menjadi kekuatan utama industri baja di seantero Eropa Barat.\n\nDirektur Utama Adolphe Greiner beserta jajaran manajemen lainnya memilih tetap bertahan di pos mereka selama Pengepungan Liège semasa Perang Besar, demi memastikan lapangan kerja tetap terbuka bagi para buruhnya selama mungkin. Saat wilayahnya diduduki, perusahaan tersebut menolak mentah-mentah berproduksi bagi pasukan penjajah, dan akibatnya sebagian besar peralatan berat pengerjaan bajanya dijarah habis.\n\nPerusahaan ini telah bangkit kembali selama masa antarperang dan tetap menjadi pilar terdepan industri nasional kita."
 ww_BEL_event_misc.3.a: "Merekalah yang sesungguhnya membangun roda penggerak ekonomi kita!"
 ### Congolese events ###
 ww_congo.1.t: "Belgia Berinvestasi dalam Pembangunan Kita"
 ww_congo.1.desc: "Kantor kolonial Belgia hari ini meloloskan undang-undang untuk mengalokasikan sumber daya dalam jumlah yang jauh lebih masif bagi pembangunan industri kita, dan telah memulai pembangunan fasilitas-fasilitas industri di [295.GetName]."
 ww_congo.1.a: "Sebuah anugerah yang luar biasa"
 ww_congo.4.t: "Raoul van Overstraeten Kembali ke Belgia"
 ww_congo.4.desc: "Perwira militer Belgia Raoul van Overstraeten, yang bertugas di negeri kita hingga belum lama ini, kini dengan tersiarnya kabar kemerdekaan kita yang baru, memutuskan untuk pulang kembali ke daratan Eropa. Kita tidak lagi membutuhkan orang-orang Eropa semacam dirinya, dan kepergiannya niscaya hanya akan membuat kita bertambah perkasa."
 ww_congo.4.a: "Enyahlah, hai Kaum Imperialis!"
 ww_congo.5.t: "[COG.GetLeader] Ingin Meningkatkan Produksi Pangan di Kongo"
 ww_congo.5.desc: "Gubernur kita di Kongo, [COG.GetLeader], telah mengutarakan keinginannya untuk mendongkrak produksi pangan dengan mengurangi kapasitas tambang sebagai bagian dari ikhtiarnya guna 'memperbaiki kondisi sosial penduduk kolonial'. Langkah ini niscaya akan merugikan profitabilitas koloni untuk saat ini, namun hampir dapat dipastikan akan mendatangkan keuntungan berlipat ganda dalam jangka panjang."
 ww_congo.5.a: "Hal itu akan menggerus keuntungan!"
 ww_congo.5.b: "Jika ia menganggap itu yang terbaik..."
 CONGO_refused_increased_food_production: "Tuan kolonial kita menolak Rencana Peningkatan Produksi Pangan kita"
 CONGO_accepted_increased_food_production: "Tuan kolonial kita menyetujui Rencana Peningkatan Produksi Pangan kita"
 ww_congo.6.t: "Pihak [BEL.GetAdjective] Menolak Rencana Produksi Pangan Kita"
 ww_congo.6.desc: "Administrasi kolonial di [BEL.GetNameDef] telah menampik permohonan kita untuk mendongkrak produksi pangan melalui pengurangan hasil tambang demi 'memperbaiki kondisi sosial penduduk kolonial'."
 ww_congo.6.a: "Sudah dapat diduga sebelumnya"
 ww_congo.7.t: "Pihak [BEL.GetAdjective] Menyetujui Rencana Produksi Pangan Kita"
 ww_congo.7.desc: "Administrasi kolonial di [BEL.GetNameDef] telah menyetujui permohonan kita untuk meningkatkan produksi pangan dengan mengurangi kapasitas tambang demi 'memperbaiki kondisi sosial penduduk kolonial'."
 ww_congo.7.a: "Bagus sekali!"
 ww_congo.8.t: "Munculnya Kelas Menengah Baru"
 ww_congo.8.desc: "Terdapat segmen penduduk Kongo yang kian membesar dengan penguasaan bahasa Prancis yang fasih, memeluk agama Kristen, serta mengenyam pendidikan pascasekolah dasar. Para pejabat kolonial mulai menyebut mereka sebagai Évolué, kaum yang telah tereropanisasi. Kendati mobilitas sosial mereka masih dibatasi oleh hierarki kolonial, populasi yang kian berpendidikan ini niscaya akan menjadi tumpuan kemakmuran bangsa kita suatu hari nanti."
 ww_congo.8.a: "Kita akan mencermati perkembangannya lebih lanjut"
 evolue_will_start_attempting_to_enter_politics_tt: "Kaum Évolué akan mulai berupaya terjun ke panggung politik, yang akan membuka peluang hadirnya berbagai §YPenasihat Politik§! baru"
 evolue_have_entered_politics: "Berbagai §YTokoh Perjuangan Kemerdekaan§! dan §YPemikir Politik Kongo§! kini akan tersedia sebagai §YPenasihat Politik§!"
 ww_congo.9.t: "Kaum Évolué Mulai Memasuki Panggung Politik [ROOT.GetAdjective]"
 ww_congo.9.desc: "Dengan bertumbuhnya kelas menengah belakangan ini serta banyaknya warga di perkotaan yang mengenyam pendidikan lanjutan, banyak kaum [COG.GetAdjective] mulai mendalami risalah-risalah para pemikir politik kenamaan, dan sekumpulan tokoh politik serta pejuang kemerdekaan baru mulai bermunculan. Ini menandai fajar baru bagi bangsa [COG.GetAdjective]!"
 ww_congo.9.a: "Orang-orang ini niscaya akan memimpin bangsa kita menuju kemerdekaan"
 ww_congo.10.t: "[FROM.GetNameDefCap] Menuntut [772.GetName]"
 ww_congo.10.d: "Pasukan Kongo telah bersiaga di sepanjang garis perbatasan koloni kita di [772.GetName], dan mereka menuntut akses penuh tanpa batas ke pangkalan dan instalasi militer kita! Bilamana kita menyepakati tuntutan mereka, secara de facto kita telah menyerahkan kendali atas [772.GetName] ke tangan mereka. Di sisi lain, kita tidak memiliki sarana yang memadai untuk melawan mereka dalam sengketa ini."
 ww_congo.10.a: "Kita tidak memiliki pilihan lain selain tunduk."
 ww_congo.10.b: "Tidak akan pernah!"
 ww_congo.11.t: "Pihak Prancis Menerima Tuntutan Kita"
 ww_congo.11.d: "Pihak Prancis telah bertekuk lutut menerima tuntutan kita, dan pangkalan beserta instalasi mereka di [772.GetName] kini sepenuhnya berada di bawah kendali kita. Secara efektif mereka telah menyerahkan kendali mutlak koloni mereka kepada kita."
 ww_congo.11.a: "Langkah yang sangat bijaksana."
 ww_congo.12.t: "Pihak Prancis Menolak Tuntutan Kita"
 ww_congo.12.d: "Pihak Prancis secara keterlaluan telah menampik tuntutan kita! Tampaknya bilamana kita menghendaki [772.GetName], kita harus merebutnya dengan kekuatan senjata!"
 ww_congo.12.a: "Orang-orang pandir!"
 ww_congo.13.t: "[FROM.GetNameDefCap] Menuntut Integrasi Kita"
 ww_congo.13.d: "Kekuatan militer Kongo telah bersiap di perbatasan kita, dan mereka menuntut kendali penuh atas pangkalan, institusi, serta instalasi kita! Jika kita menyetujui permintaan mereka, kita secara efektif mengakhiri kemerdekaan kita dan melebur menjadi bagian dari bangsa mereka. Namun di sisi lain, kita sama sekali tidak memiliki sarana untuk melawan mereka dalam perkara ini."
 ww_congo.13.a: "Kita akan bertambah kuat bersama-sama!"
 ww_congo.13.b: "Tidak akan pernah!"
 ww_congo.14.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 ww_congo.14.d: "[FROM.GetNameDefCap] telah menyetujui tuntutan kita, dan negara mereka akan lenyap sebagai entitas berdaulat dalam beberapa hari ke depan. Mereka secara efektif telah menyerahkan kendali penuh atas negeri mereka ke tangan kita."
 ww_congo.14.a: "Langkah yang sangat bijaksana."
 ww_congo.15.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 ww_congo.15.d: "[FROM.GetNameDefCap] secara lancang menolak tuntutan kita! Tampaknya bilamana kita menghendaki [772.GetName], kita terpaksa merebutnya melalui kekuatan perang!"
 ww_congo.15.a: "Orang-orang pandir!"
 ww_congo.16.t: "Afrika Latin Bersatu"
 ww_congo.16.d: "Menanggapi memuncaknya ketegangan global, serta berkat kejayaan gemilang [FROM.GetLeader] baru-baru ini, penyatuan negara-negara Afrika Tengah penutur bahasa Roman akhirnya berhasil diwujudkan. Kini, mereka mendeklarasikan diri sebagai kekuatan dunia baru, dan berikrar melindungi segenap rakyat [FROM.GetAdjective], berapapun harganya."
 ww_congo.16.a: "Mereka pasti akan binasa"
 ww_congo.16.b: "Hiduplah [ROOT.GetNameDef]!"
 ww_congo.17.t: "Kemerdekaan Kongo Berhasil Diraih"
 ww_congo.17.d: "Menyusul persetujuan dari otoritas [BEL.GetAdjective] di negeri ini, Perdana Menteri baru [COG.GetAdjective] Patrice Lumumba menyampaikan pidato singkat demi merayakan kemerdekaan baru tanah airnya. Di dalamnya termuat kecaman pedas terhadap kolonialisme, serta apa yang kerap didengungkan sebagai \"misi pembudayaan [BEL.GetAdjective]\". Kendati pidato ini disambut gegap gempita di dalam negeri, banyak kalangan luar negeri menilainya sebagai serangan personal langsung terhadap Kepala Negara [BEL.GetAdjective]. Era dekolonisasi baru saja menyingsing!"
 ww_congo.17.a: "Keseimbangan Kekuatan di Afrika telah bergeser"
 ww_congo.17.b: "Sudah saatnya membuktikan bahwa kita adalah dua bangsa merdeka yang setara"
 ww_congo.17.c: "Mungkin ini memang jalan yang terbaik..."
 ww_congo.18.t: "Pemberontakan Kongo Berhasil Ditumpas"
 ww_congo.18.d: "Belum lama ini, pemerintah Kongo Merdeka di Stanleyville berupaya memisahkan diri dari imperium kolonial Belgia. Kendati sempat menuai dukungan besar di dalam negeri, pemberontakan mereka berhasil ditumpas tanpa ampun oleh pasukan yang setia kepada Belgia beserta serdadu bayaran asing."
 ww_congo.18.a: "Zaman Imperialisme belum lagi berakhir"
 ww_congo.18.b: "Para pengkhianat itu menuai apa yang layak mereka dapatkan"
 ww_congo.18.c: "Persatuan melahirkan kekuatan"
 ww_congo.19.t: "Pemberontakan Kongo Menuai Kemenangan"
 ww_congo.19.d: "Belum lama berselang, pemerintah Kongo Merdeka di Stanleyville mengobarkan perang kemerdekaan melawan imperium kolonial Belgia. Kendati memakan waktu berliku, pemberontakan mereka akhirnya sanggup menggulung pasukan kolonial yang ditempatkan di kawasan tersebut dan merebut kota-kota kunci di seantero Kongo. Kini, mereka secara resmi memproklamasikan kemerdekaan, dan kesepakatan damai tengah diupayakan antara mereka dan bekas penindas mereka.."
 ww_congo.19.a: "Zaman Imperialisme telah tamat"
 ww_congo.19.b: "Kemenangan adalah milik kita!"
 ww_congo.19.c: "Pukulan telak yang membinasakan..."
 ww_congo.20.t: "Revolusi Rwanda"
 ww_congo.20.d: "Dengan cengkeraman kekuasaan pemerintah kita yang kian rapuh atas mandat Ruanda-Urundi serta merebaknya gelombang sentimen nasionalis di seantero kawasan, Mwami Mutara III Rudahigwa, Raja Rwanda, telah mendeklarasikan bangsanya sebagai negara merdeka, sekaligus memutus ikatan dengan pemerintah pusat kita. Haruskah kita melancarkan intervensi militer?"
 ww_congo.20.a: "Bukan hak kita untuk menghalangi mereka"
 ww_congo.20.b: "Siapa yang mengizinkan mereka untuk merdeka?"
 ww_congo.21.t: "Deklarasi Mwambutsa"
 ww_congo.21.d: "Dengan cengkeraman kekuasaan pemerintah kita yang kian melemah atas mandat Ruanda-Urundi serta berkobarnya sentimen nasionalisme di seantero wilayah, Mwami Mwambutsa IV, Raja Burundi, telah memproklamasikan bangsanya sebagai negara yang berdaulat, memutus tali hubungan dengan pemerintah pusat kita. Haruskah kita mengambil tindakan?"
 ww_congo.21.a: "Bukan tempat kita untuk menghalangi mereka"
 ww_congo.21.b: "Siapa yang memberi mereka hak untuk merdeka?"
 threatened_us_opinion_modifier: "Mereka mengancam kita!"
 attempted_diplomacy_opinion_modifier: "Mereka berupaya mendekati kita melalui jalur diplomasi"
 BEL_commonwealth_faction: "Persemakmuran Belgia"
 ww_congo.22.t: "[COG.GetLeader] Meminta Peningkatan Emigrasi ke Kongo"
 ww_congo.22.desc: "Gubernur kita di Kongo, [COG.GetLeader], telah menyampaikan permohonan agar memacu imigrasi bangsa [ROOT.GetAdjective] ke wilayah tersebut, demi mendatangkan kaum terpelajar dan pemilik modal. Tanah Katanga yang subur, hangat, dan kaya raya akan sangat memikat banyak insan yang berjiwa petualang maupun berdedikasi, dan jika kita mendorong hal ini, niscaya akan menarik lebih banyak orang untuk berpindah.."
 ww_congo.22.a: "Kita akan memenuhinya"
 ww_congo.22.b: "Ia pikir siapa dirinya?"
 ww_congo.23.t: "Pihak [FROM.GetAdjective] Menyetujui Rencana Imigrasi Kita"
 ww_congo.23.desc: "Administrasi kolonial di [FROM.GetNameDef] telah menyetujui permintaan kita untuk meningkatkan dorongan emigrasi bangsa [FROM.GetAdjective] ke negara bagian kita. Gelombang baru warga yang siap membantu pembangunan negeri kita pasti akan segera berdatangan."
 ww_congo.23.a: "Sempurna"
 ww_congo.24.t: "Pihak [FROM.GetAdjective] Menolak Rencana Imigrasi Kita"
 ww_congo.24.desc: "Administrasi kolonial di [FROM.GetNameDef] telah menolak permintaan kita untuk meningkatkan dorongan emigrasi bangsa [FROM.GetAdjective] ke negara bagian kita. Sungguh sangat disayangkan, namun tidak banyak yang dapat kita lakukan untuk mengubah keputusan mereka."
 ww_congo.24.a: "Lantas, apa yang sebenarnya kita harapkan?"
 ww_congo.25.t: "Albert de Vleeshauwer Bertolak ke Luar Negeri Menggalang Dukungan"
 ww_congo.25.desc: "Menteri Urusan Koloni Belgia, Albert de Vleeshauwer, sekutu dekat Pierre Ryckmans, telah memutuskan pergi ke luar negeri guna melobi dukungan dari para sekutu baru kita, tatkala situasi tampak kian genting dan para politisi di daratan utama enggan bertindak. Mungkinkah kita dapat mengamankan sejumlah kesepakatan yang menguntungkan berkat bantuannya?"
 ww_congo.25.a: "Di sinilah peperangan sesungguhnya bermula"
 ww_congo.26.t: "[FROM.GetNameDefCap] Menduduki [796.GetName]!"
 ww_congo.26.desc: "\nAwal pekan ini, pasukan dari [COG.GetNameDef] bergerak masuk dan menduduki wilayah kita di [796.GetName], seraya berdalih bahwa mereka menjalankan misi demi melindungi kawasan tersebut dari potensi pendudukan oleh musuh-musuh mereka. Ini jelas merupakan sebuah tindakan perang, kendati demikian, ini adalah peristiwa yang kemungkinan besar dapat kita pilih untuk diabaikan begitu saja, mengingat mereka sepertinya bukan sengaja memancing peperangan dengan kita, melainkan berupaya menyatukan kembali lembah cekungan Kongo."
 ww_congo.26.a: "Tidak sebanding untuk diperangi"
 ww_congo.26.b: "Mereka pikir siapa diri mereka?"
 ww_congo.27.t: "Pemberontakan di Luluabourg"
 ww_congo.27.desc: "Awal pekan ini, para bintara Kongo yang dipimpin oleh Sersan Mayor Satu Ngoie Mukalabushi memberontak di Luluabourg di provinsi Kasaï. Salah satu pemicu utamanya tampaknya adalah perlakuan sewenang-wenang oleh para perwira Belgia kita. Para pemberontak membobol gudang senjata pangkalan pada pagi hari dan menjarah pemukiman kulit putih di kota tersebut. Mereka juga menyerang simbol-simbol otoritas kolonial dan memproklamasikan kehendak mereka akan kemerdekaan. Mereka kemudian membubarkan diri menuju desa-desa asal mereka sembari menjarah di sepanjang perjalanan, namun tampaknya gagal menyebarkan pemberontakan ke garnisun-garnisun tetangga. Bagaimana kita harus menangani situasi ini?"
 ww_congo.27.a: "Tangkap mereka dan jadikan Mukalabushi sebagai peringatan keras"
 ww_congo.27.b: "Ini adalah pertanda bahwa perubahan besar mutlak diperlukan"
 COG_pro_independence_reforms_in_the_force_publique_structure: "Reformasi Pro-Kemerdekaan dalam Struktur Force Publique"
 ww_congo.28.t: "Meningkatnya Kecurigaan terhadap Komite Nasional"
 ww_congo.28.desc: "Melihat Komite Nasional Pembebasan yang baru dibentuk mengambil sikap yang kian konfrontatif terhadap pemerintah kolonial, banyak penduduk di pedesaan mulai khawatir bahwa Komite tidak akan menempuh jalan damai menuju kemerdekaan. Terlebih lagi di kawasan Katanga, bisik-bisik pemisahan diri mulai terdengar, dan besar kemungkinan wilayah tersebut akan berupaya memproklamasikan kemerdekaan tatkala perang pembebasan kita meletus..."
 ww_congo.28.a: "Mereka harus diyakinkan, atau dibebaskan melalui kekuatan senjata"
 COG_coquilatville_and_lusambo_will_join_the_belgian_loyalsits_tt: "§Y[538.GetName]§! dan §Y[888.GetName]§! akan bergabung dengan §YLoyalis Pro-Belgia§! saat perang kemerdekaan dimulai"
 ww_congo.29.t: "Kaum Nasionalis Kongo Mendekati Kita Meminta Bantuan"
 ww_congo.29.desc: "Kaum nasionalis Kongo yang menamakan diri mereka Komite Nasional Pembebasan tengah mempersiapkan perang kemerdekaan melawan tuan kolonial mereka. Mereka berjanji akan menyelaraskan diri lebih dekat dengan kita begitu perang dimenangkan, dengan syarat kita mengirimkan senjata saat pertempuran meletus, seraya menegaskan bahwa melemahnya [BEL.GetName] sejalan dengan kepentingan nasional kita."
 ww_congo.29.a: "Tentu saja"
 ww_congo.29.b: "Tidak ada alasan untuk campur tangan"
 ww_congo.30.t: "[FROM.GetNameDefCap] Memutuskan untuk Membantu Kita"
 ww_congo.30.desc: "Para diplomat kita telah kembali dari perundingan dengan staf militer [FROM.GetAdjective], dan dikabarkan telah mencapai kesepakatan di mana mereka akan mengirimkan pasukan dan peralatan tempur tatkala kita memutuskan untuk menyatakan perang melawan para penindas kita. Hari ini adalah hari yang gemilang bagi seluruh rakyat Kongo!"
 ww_congo.30.a: "Sempurna"
 ww_congo.31.t: "[FROM.GetNameDefCap] Memutuskan Tidak Membantu Kita"
 ww_congo.31.desc: "Para diplomat kita telah kembali dari perundingan dengan staf militer [FROM.GetAdjective] dengan tangan hampa. Tampaknya kesepakatan gagal diraih, dan mereka yang kita sangka sekutu telah mengkhianati kita..."
 ww_congo.31.a: "Sungguh sangat disayangkan"
 ww_congo.32.t: "Kudeta Gerakan Simba"
 ww_congo.32.desc: "Gerakan Simba telah meraih dukungan luar biasa di seantero negeri akhir-akhir ini. Kini, mereka telah merangsek masuk ke dalam kongres nasional, menuntut pergantian pucuk kepemimpinan. Tidak banyak yang dapat diperbuat oleh para politisi kita selain menerima kenyataan yang ada. Namun pertanyaannya, siapakah yang pantas memimpin negara kita sekarang?"
 ww_congo.32.a: "Cyrille Adoula adalah negarawan yang cakap"
 ww_congo.32.b: "Christophe Gbenye yang harus memimpin"
 ww_congo.33.t: "Persoalan Kepemimpinan"
 ww_congo.33.desc: "Kepemimpinan bangsa kita belakangan ini mulai dipertanyakan, berpangkal dari jalinan hubungan Cyrille Adoula dengan pihak Amerika dan serikat-serikat buruh Belgia. Banyak kalangan meyakini bahwa pemimpin kaum Simba, Christophe Gbenye, harus mengambil alih tampuk kekuasaan sebagai ketua negara yang baru. Haruskah kita bertekuk lutut kepada tuntutan mereka?"
 ww_congo.33.a: "Cyrille Adoula adalah negarawan yang mumpuni, ia tidak boleh mundur"
 ww_congo.33.b: "Christophe Gbenye yang harus memimpin"
 ww_congo.34.t: "Kunjungan Kenegaraan Kwame Nkrumah"
 ww_congo.34.desc: "Tokoh pan-Afrikanis asal Ghana, Kwame Nkrumah, hari ini tiba di ibu kota kita atas undangan resmi dari [ROOT.GetLeader]. Sebagai seorang sosialis gigih, banyak pihak meyakini bahwa kerja sama dengannya akan membawa maslahat besar demi mengamankan masa depan Afrika, bahkan sebagian kalangan menyuarakan agar ia mengemban kepemimpinan bangsa kita. Apakah langkah terbaik yang harus diambil?"
 ww_congo.34.a: "Kita yakin kerja sama agung dapat terwujud"
 ww_congo.34.b: "Dialah pemimpin sejati yang kita dambakan!"
 ww_congo.35.t: "[COG.GetNameDefCap] Memicu Perlawanan Kolonial"
 ww_congo.35.desc: "\nPemerintah [COG.GetAdjective] dilaporkan telah mulai menyelundupkan persenjataan kepada kelompok-kelompok perlawanan di Afrika, serta menampung dan melatih para pembangkang dan milisi demi upaya pembebasan negeri-negeri mereka yang berada di bawah pendudukan kita. Kita harus ekstra waspada memantau kawasan ini di masa-masa mendatang..."
 ww_congo.35.a: "Kita harus segera mengakhiri hal ini!"
 ww_congo.35.b: "Saat bagi kebangkitan Afrika telah tiba"
 ww_congo.36.t: "[FROM.GetName] Menolak Usulan Damai"
 ww_congo.36.desc: "Duta besar dari [FROM.GetNameDef] telah menampik usulan perdamaian kita. Mereka berdalih bahwa serangan kita terhadap mereka sama sekali tidak berdasar dan oleh sebab itu, mereka tidak akan menerima apa pun selain kapitulasi tanpa syarat dari kita karena telah menjadi ancaman bagi perdamaian kawasan."
 ww_congo.36.a: "Alangkah munafiknya, kekerasan imperialis mereka hanya dapat dihentikan dengan kekuatan senjata."
 ww_congo.37.t: "[FROM.GetNameDefCap] Menawarkan Perdamaian demi Kemerdekaan [?COG.COG_disputed_colony.GetAdjective]"
 ww_congo.37.desc: "Para diplomat [FROM.GetAdjective] telah mendatangi kita dengan sebuah tawaran perdamaian. Tawaran tersebut menuntut kita menyetujui pelepasan klaim atas wilayah [?COG.COG_disputed_colony.GetAdjective] yang terlepas ke tangan [FROM.GetNameDef] selama konflik ini. Para diplomat tersebut juga menyatakan bahwa pemungutan suara akan diselenggarakan di wilayah [?COG.COG_disputed_colony.GetAdjective] yang dilepaskan guna memilih pemerintahan baru. Seberapa bebas pemilihan tersebut kelak masih menjadi tanda tanya besar."
 ww_congo.37.a: "Kita tidak akan menyerahkan wilayah kedaulatan kita."
 ww_congo.37.b: "Kita tidak memiliki pilihan selain menyetujuinya."
 ww_congo.38.t: "[FROM.GetName] Menyetujui Tawaran Damai"
 ww_congo.38.desc: "Para diplomat dari [FROM.GetNameDef] telah memberitahu kita bahwa pemerintah mereka bersedia melepaskan klaim atas wilayah [?COG.COG_disputed_colony.GetAdjective] yang telah kita bebaskan. Mereka kini tengah menarik mundur pasukannya ke garis perbatasan baru yang disepakati di kawasan tersebut."
 ww_congo.38.a: "Kemenangan kepahlawanan melawan belenggu imperialisme!"
 ww_congo.39.t: "Pemilu Bebas Pertama Kongo"
 ww_congo.39.desc: "Pemilihan umum bebas pertama telah usai digelar, dan Joseph Kasa-Vubu keluar sebagai pemenang teratas. Kini, ia tengah bekerja keras menyusun kabinet menteri Kongo yang pertama. Memperoleh popularitas luar biasa di seantero negeri serta piawai dalam menjalankan tugasnya, ia niscaya akan dikenang sebagai presiden agung untuk generasi-generasi mendatang."
 ww_congo.39.a: "Kasa-Vubu adalah negarawan yang cakap, kita membutuhkannya"
 ww_congo.40.t: "Kabinet Pertama Kasa-Vubu"
 ww_congo.40.desc: "Presiden kita [ROOT.GetLeader] tengah dalam proses menyusun kabinet resmi pertama kita, seusai mengamankan kemenangan mutlak dalam pemilihan umum baru-baru ini. Meraih dukungan meluas di seluruh penjuru negeri, ia dipastikan akan tercatat dalam lembaran sejarah sebagai bapak pendiri negara modern kita untuk generasi-generasi berikutnya!"
 ww_congo.40.a: "Kasa-Vubu benar-benar sosok yang tepat untuk tugas ini"
 ww_congo.41.t: "[FROM.GetLeader] Menuntut Reunifikasi Rakyat Bakongo"
 ww_congo.41.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef] dan Aliansi Bakongo, telah menghubungi kita, menuntut agar kita menyerahkan seluruh wilayah mayoritas Bakongo kepada mereka. Bagaimana kita harus menanggapinya?"
 ww_congo.41.a: "Ini demi kemaslahatan bersama"
 ww_congo.41.b: "Mustahil!"
 ww_congo.42.t: "[FROM.GetLeader] Menyerahkan Wilayah-Wilayah Bakongo"
 ww_congo.42.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah sepakat untuk menyerahkan seluruh wilayah yang berpopulasi signifikan rakyat Bakongo, seraya mendoakan yang terbaik bagi masa depan kita. Hari ini adalah hari bersejarah bagi bangsa Kongo."
 ww_congo.42.a: "Luar biasa!"
 ww_congo.43.t: "[FROM.GetLeader] Menolak Menyerahkan Wilayah Bakongo"
 ww_congo.43.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menampik tuntutan kita untuk menyerahkan wilayah-wilayah berpopulasi besar rakyat Bakongo. Bagaimana kita harus menanggapi penindasan terhadap rakyat kita oleh kekuasaan asing ini?"
 ww_congo.43.a: "Tidak banyak yang sanggup kita perbuat"
 ww_congo.43.b: "Kita akan beri mereka pelajaran!"
 ww_congo.44.t: "Wangsa Água Rosada"
 ww_congo.44.desc: "Dewan telah menetapkan bahwa penguasa paling sah bagi Kongo adalah Dom Pedro VII, penuntut takhta saat ini bagi Kerajaan Kongo yang baru saja dibubarkan, yang dahulu membentang di provinsi-provinsi barat kita serta di wilayah yang kini menjadi Cabinda dan Angola. Niscaya ia sanggup memulihkan stabilitas dan mewujudkan persatuan seluruh rakyat Bakongo?"
 ww_congo.44.a: "Ia adalah kandidat paling sah yang mungkin kita dapatkan!"
 ww_congo.44.b: "Bukan, kita membutuhkan sosok yang lain!"
 ww_congo.45.t: "Sang Nyim dari Bakuba"
 ww_congo.45.desc: "Dewan telah menetapkan bahwa penguasa paling sah berikutnya bagi Kongo adalah Mbóp Mábíínc maMbéky, raja dari Kerajaan Kuba, sebuah kerajaan kecil yang terletak di provinsi-provinsi pedalaman tengah kita. Niscaya ia sanggup menghadirkan stabilitas dan menggapai apa yang hanya mampu diimpikan oleh segelintir orang?"
 ww_congo.45.a: "Dialah sosok yang akan mengantarkan kita menuju keagungan!"
 ww_congo.45.b: "Bukan, kita membutuhkan sosok yang lain!"
 ww_congo.46.t: "Sang Mâ Loango"
 ww_congo.46.desc: "Dewan telah memutuskan bahwa calon penguasa sah berikutnya bagi Kongo adalah Moe Poaty III, sang Mâ Loango dari Kerajaan Loango, sebuah negara yang bertapak di dalam dan sekitar provinsi-provinsi paling barat kita, terutama di kawasan yang kini menjadi Kongo Tengah. Niscaya ia sanggup menorehkan stabilitas dan mewujudkan penyatuan dengan provinsi-provinsi barat Kongo?"
 ww_congo.46.a: "Ia dapat memberi kita klaim sah atas Kongo Tengah!"
 ww_congo.46.b: "Bukan, kita membutuhkan sosok yang lain!"
 ww_congo.47.t: "Wangsa Ntwero dari Burundi"
 ww_congo.47.desc: "Dewan telah mempertimbangkan bahwa penguasa potensial lainnya bagi Kongo adalah Mwambutsa IV, sang Mwami dari Kerajaan Burundi, sebuah kerajaan di timur. Mampukah ia mendatangkan stabilitas dan mewujudkan penyatuan dengan negeri Burundi?"
 ww_congo.47.a: "Setidaknya ia dapat memberikan klaim yang sah atas Burundi kepada kita..."
 ww_congo.47.b: "Bukan, kita membutuhkan sosok yang lain!"
 ww_congo.48.t: "Klan Abanyiginya dari Rwanda"
 ww_congo.48.desc: "Dewan telah bermusyawarah bahwa kandidat penguasa lain bagi Kongo adalah Mutara III Rudahigwa, sang Umwami dari Kerajaan Rwanda, sebuah kerajaan di sebelah timur. Bukankah ia sanggup menegakkan stabilitas dan menuntaskan unifikasi dengan negeri Rwanda?"
 ww_congo.48.a: "Setidaknya ia dapat menganugerahkan klaim sah atas Rwanda kepada kita..."
 ww_congo.48.b: "Bukan, kita membutuhkan sosok yang lain!"
 ww_congo.49.t: "Sang Kolaborator Jerman"
 ww_congo.49.desc: "Mengingat tidak ada lagi opsi yang tersisa, dewan akhirnya memutuskan bahwa penguasa potensial terakhir bagi Kongo adalah Yuhi V Musinga, sang Umwami dari Kerajaan Rwanda, sebuah kerajaan di timur, yang digulingkan dari takhta oleh para gubernur Belgia seusai Perang Besar akibat kolaborasi dan kekagumannya pada Imperium Kolonial Jerman. Memilihnya mungkin merupakan perjudian yang berisiko, namun setidaknya ia menyimpan ambisi yang membara..."
 ww_congo.49.a: "Ia terpaksa menjadi pilihan..."
 ww_congo.49.b: "Ini sama sekali tidak berjalan sesuai rencana kita..."
 ww_congo.50.t: "[FROM.GetNameDefCap] Berhasrat Membentuk Aliansi"
 ww_congo.50.desc: "\n[FROM.GetNameDefCap] telah menghubungi kita untuk mengajukan pembentukan aliansi timbal balik. Mereka telah melancarkan langkah militerisasi dan mengutarakan kehendak untuk bekerja sama agar kita berdua menjadi semakin digdaya. Secara historis hubungan kita kerap diwarnai ketegangan, namun tiada saat yang lebih tepat daripada masa kini demi sebuah rekonsiliasi."
 ww_congo.50.a: "Kita akan menyambutnya dengan senang hati"
 ww_congo.50.b: "Kita tidak membutuhkan mereka."
 ww_congo.51.t: "[FROM.GetNameDefCap] Setuju Membentuk Aliansi"
 ww_congo.51.desc: "\n[FROM.GetNameDefCap] menyambut permohonan aliansi kita dengan penuh antusiasme dan telah menandatangani segenap dokumen resmi yang diperlukan. Kita tidak akan lagi bertarung sendirian melawan pihak-pihak yang mengancam kita!"
 ww_congo.51.a: "Kita lebih kuat bila bersatu!"
 ww_congo.52.t: "[FROM.GetNameDefCap] Menolak Tawaran Aliansi Kita"
 ww_congo.52.desc: "\nTawaran pembentukan aliansi kita telah ditampik secara dingin oleh [FROM.GetLeader]. Kita telah berupaya memaparkan kegunaan kerja sama ini, namun sayangnya [FROM.GetNameDef] telah membulatkan tekad mereka. Kendati hal ini sangat menjengkelkan, kita pantang berkecil hati, melainkan akan mencari jalan keluar lainnya."
 ww_congo.52.a: "Kita akan buktikan kepada mereka"
 ww_congo.53.t: "[FROM.GetLeader] Menuntut Penyatuan Kembali Rakyat Burundi"
 ww_congo.53.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef] dan rakyat Burundi, telah menghubungi kita, menuntut agar kita menyerahkan seluruh wilayah mayoritas Burundi kepada mereka. Bagaimana kita harus menanggapinya?"
 ww_congo.53.a: "Ini demi kemaslahatan bersama"
 ww_congo.53.b: "Mustahil!"
 ww_congo.54.t: "[FROM.GetLeader] Menyerahkan Wilayah-Wilayah Burundi"
 ww_congo.54.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah bersepakat untuk menyerahkan setiap wilayah dengan populasi rakyat Burundi dalam jumlah besar, seraya mendoakan masa depan terbaik bagi kita. Hari ini adalah hari yang agung bagi bangsa Kongo."
 ww_congo.54.a: "Luar biasa!"
 ww_congo.55.t: "[FROM.GetLeader] Menolak Menyerahkan Wilayah Burundi"
 ww_congo.55.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menampik tuntutan kita untuk menyerahkan wilayah-wilayah yang didiami oleh mayoritas bangsa Burundi. Bagaimana kita harus menyikapi penindasan terhadap rakyat kita oleh kekuatan asing?"
 ww_congo.55.a: "Tidak banyak yang sanggup kita perbuat"
 ww_congo.55.b: "Kita akan beri mereka pelajaran!"
 ww_congo.56.t: "[FROM.GetLeader] Menuntut Penyatuan Kembali Rakyat Rwanda"
 ww_congo.56.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef] dan rakyat Rwanda, telah menghubungi kita, menuntut agar kita menyerahkan seluruh wilayah mayoritas Rwanda kepada mereka. Bagaimana kita harus bersikap?"
 ww_congo.56.a: "Ini demi kemaslahatan bersama"
 ww_congo.56.b: "Mustahil!"
 ww_congo.57.t: "[FROM.GetLeader] Menyerahkan Wilayah-Wilayah Rwanda"
 ww_congo.57.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah setuju untuk menyerahkan segenap wilayah yang dihuni oleh banyak rakyat Rwanda, seraya mendoakan masa depan terbaik bagi kita. Hari ini adalah hari yang agung bagi bangsa Kongo."
 ww_congo.57.a: "Luar biasa!"
 ww_congo.58.t: "[FROM.GetLeader] Menolak Menyerahkan Wilayah Rwanda"
 ww_congo.58.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menampik tuntutan kita untuk menyerahkan wilayah-wilayah yang dihuni oleh banyak rakyat Rwanda. Bagaimana kita harus menanggapi penindasan terhadap rakyat kita oleh kekuatan asing?"
 ww_congo.58.a: "Tidak banyak yang sanggup kita lakukan"
 ww_congo.58.b: "Kita akan beri mereka pelajaran!"
 ww_congo.59.t: "[FROM.GetLeader] Memohon untuk Menjadi Protektorat"
 ww_congo.59.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], belum lama ini mendatangi salah seorang diplomat kita, memohon-mohon dan meratap agar kita menegakkan kembali perlindungan atas kerajaannya, bahkan melangkah sedemikian jauh hingga menamai negaranya Mittelafrika. Ia dahulu berada di bawah naungan perlindungan kita tatkala bertakhta sebagai raja Rwanda, namun kemudian digulingkan oleh otoritas Belgia. Haruskah kita mengabulkan permohonan sang raja gila ini?"
 ww_congo.59.a: "Ini adalah peluang emas yang pantang kita lewatkan"
 ww_congo.59.b: "Nein!"
 ww_congo.60.t: "[FROM.GetLeader] Menerima Permohonan Kita untuk Menjadi Protektorat Mereka"
 ww_congo.60.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah memutuskan untuk menerima permohonan kita, dan mengizinkan kita kembali menjadi protektorat di bawah naungan bangsa mereka. Sungguh, keseimbangan sejati telah dipulihkan di Afrika!"
 ww_congo.60.a: "Hari ini adalah hari yang patut dikenang!"
 ww_congo.61.t: "[FROM.GetLeader] Menolak Permohonan Kita untuk Menjadi Protektorat Mereka"
 ww_congo.61.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah memutuskan menolak permohonan kita, karena ia memandang rendah nilai kawasan kita, seraya berdalih tidak banyak yang dapat kita sumbangkan selain dari apa yang telah mereka miliki."
 ww_congo.61.a: "Hari ini adalah hari yang patut dikenang..."
 ww_congo.62.t: "Raoul van Overstraeten Kembali ke Belgia"
 ww_congo.62.desc: "Perwira militer Belgia Raoul van Overstraeten, yang telah mengabdi di negeri kita hingga belum lama ini, menimbang lepasnya tanah air mereka, telah dipanggil pulang kembali ke [BEL.GetName]. Ia telah melayani kita dengan sangat baik di sini, dan kita berharap ia sanggup membantu memukul mundur para penyerbu."
 ww_congo.62.a: "Semoga berhasil!"
 ww_congo.63.t: "[FROM.GetLeader] Ingin Menjual Uranium kepada Kita"
 ww_congo.63.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah mendekati kita dengan sebuah tawaran yang sangat memikat. Tampaknya, cadangan Uranium di negara tersebut jauh lebih melimpah daripada perkiraan, dan kini muncul gagasan untuk menyelundupkan sebagian bahan mentah tersebut ke negeri kita dengan harga tertentu."
 ww_congo.63.a: "Ini adalah karunia yang sangat disambut baik"
 ww_congo.63.b: "Kita tidak akan merendahkan martabat kita dalam tindak kriminal"
 ww_congo.64.t: "[FROM.GetLeader] Menerima Kesepakatan Uranium"
 ww_congo.64.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menyetujui penandatanganan kesepakatan uranium yang kita ajukan kepada mereka, dan telah mengirimkan pembayaran yang kita tetapkan."
 ww_congo.64.a: "Luar biasa!"
 ww_congo.65.t: "[FROM.GetLeader] Menolak Kesepakatan Uranium"
 ww_congo.65.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menampik tawaran kita untuk menyelundupkan pasokan uranium ke negeri mereka dengan sejumlah bayaran, seraya menegaskan bahwa mereka tidak sudi menurunkan martabat menjadi penjahat internasional."
 ww_congo.65.a: "Sayang sekali..."
 ww_congo.66.t: "[FROM.GetNameDefCap] Membatalkan Kesepakatan Uranium"
 ww_congo.66.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah memutuskan untuk membatalkan kesepakatan pasokan uranium kita yang tengah berjalan, beralasan kesepakatan tersebut dinilai terlampau mahal bagi bangsa [FROM.GetAdjective]."
 ww_congo.66.a: "Sungguh sangat disayangkan..."
 ww_congo.67.t: "[FROM.GetLeader] Mengundang Kita ke Konsorsium Pengembangan Uranium"
 ww_congo.67.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah mendekati kita dengan tawaran yang memikat. Mereka berhasrat mengajak kita bergabung dalam Konsorsium Pengembangan Uranium bersama, serta saling berbagi material nuklir dan hasil riset satu sama lain. Langkah ini berpotensi memperbesar risiko bocornya rahasia, namun mungkin sangat sepadan demi mengamankan pasokan uranium yang amat kita butuhkan."
 ww_congo.67.a: "Dengan senang hati!"
 ww_congo.67.b: "Langkah itu terlampau berbahaya"
 ww_congo.68.t: "[FROM.GetLeader] Bergabung dengan Konsorsium Pengembangan Uranium"
 ww_congo.68.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah bersepakat bergabung dengan Konsorsium Pengembangan Uranium yang kita tawarkan kepada mereka, dan program nuklir mereka kini akhirnya dapat kembali berjalan sesuai rencana berkat pasokan uranium yang baru mereka peroleh."
 ww_congo.68.a: "Luar biasa!"
 ww_congo.69.t: "[FROM.GetLeader] Menampik Gagasan Kita"
 ww_congo.69.desc: "\n[FROM.GetLeader], pemimpin [FROM.GetNameDef], telah menolak undangan kita ke Konsorsium Pengembangan Uranium, menegaskan bahwa mereka wajib merahasiakan seluruh program nuklir serapat mungkin karena membocorkan informasi apa pun yang berpotensi sampai ke tangan musuh dinilai terlampau berbahaya untuk menerima usulan semacam itu sejak awal."
 ww_congo.69.a: "Sayang sekali..."
 ww_congo.70.t: "Jan Zumbach Bergabung dengan Pihak [ENG.GetAdjective]"
 ww_congo.70.desc: "Penerbang ulung kita, Jan Zumbach, telah meninggalkan kita dan memutuskan untuk turut bertempur membela RAF. Keputusannya meninggalkan rekan-rekan seperjuangan bukanlah perkara mudah, namun kita patut memberikan penghormatan atas tekadnya untuk terus berjuang demi Polandia yang merdeka dan bebas dari penindasan."
 ww_congo.70.a: "Selamat terbang dan semoga berhasil"
 ww_congo.71.t: "Jan Zumbach Berkehendak Bertolak ke Kongo"
 ww_congo.71.desc: "Penerbang ulung kita, Jan Zumbach, yang tiba di sini dari Polandia, telah mengutarakan keinginannya untuk meninggalkan kita dan bertolak ke Kongo guna membantu pembentukan angkatan udara di sana. Haruskah kita mengizinkannya pergi?."
 ww_congo.71.a: "Biarkan ia pergi"
 ww_congo.71.b: "Cegah kepergiannya!"
 ww_congo.72.t: "Jan Zumbach Tiba"
 ww_congo.72.desc: "Penerbang tempur Polandia, Jan Zumbach, baru saja mendarat di negeri kita, seraya mengutarakan niatnya untuk bergabung dengan angkatan udara kita dan bertempur membela kita. Tentu ada peran penting yang dapat kita percayakan kepadanya?"
 ww_congo.72.a: "Kita akan memberinya tugas tempur"
 ww_congo.73.t: "[FROM.GetNameDefCap] Menawarkan Perdamaian demi Kemerdekaan Koloni Kita"
 ww_congo.73.desc: "Para diplomat [FROM.GetAdjective] telah mendatangi kita dengan sebuah tawaran perdamaian. Tawaran tersebut menuntut kita menyetujui pelepasan klaim atas sejumlah kepemilikan wilayah di Afrika serta menarik mundur seluruh pasukan kita dari kawasan tersebut. Apakah kita menerima tawaran ini?"
 ww_congo.73.a: "Kita tidak akan menyerahkan tanah air kita."
 ww_congo.73.b: "Kita tidak memiliki pilihan lain selain tunduk."
 #### THE WHISPERS AND NEGOTIATIONS OF INDEPENDENCE EVENT CHAIN ####
 congo_independence_struggle.1.t: "Bisik-Bisik Kemerdekaan"
 congo_independence_struggle.1.d: "Semenjak benua kita dikerat-kerat dan dibagi-bagikan di antara bangsa-bangsa Eropa, kita senantiasa mendambakan kebebasan, serta hak menentukan nasib kita sendiri. Lembaran sejarah kita sebagai tanah jajahan [BEL.GetNameDefCap] telah dinodai oleh eksploitasi kejam dan dehumanisasi, namun kita selalu terbelenggu di bawah tumit penjajah akibat perpecahan internal kita sendiri serta kedigdayaan senjata mereka.\n\nBisik-bisik pembebasan kini kembali membahana di lorong-lorong jalanan dan lebatnya rimba belantara, tatkala rakyat kita menyuarakan impian luhur akan sebuah Kongo yang merdeka dari cengkeraman kolonial. Sebuah Kongo yang berdaulat dalam menggubah dan menegakkan hukumnya sendiri, sebuah Kongo yang bebas menikmati hasil keringat cucuran darahnya sendiri, sebuah Kongo yang berkuasa menentukan masa depannya sendiri."
 congo_independence_struggle.1.a: "Kita harus mengupayakan kemerdekaan kita melalui jalur diplomasi"
 congo_independence_struggle.1.b: "Kemerdekaan adalah harga mati, berapa pun bayarannya"
 congo_independence_struggle.2.t: "[FROM.GetNameDefCap] Menghubungi Kita Perihal Kemerdekaan Mereka"
 congo_independence_struggle.2.d: "Kita baru saja didekati oleh sebuah kelompok yang mengklaim mewakili gerakan kemerdekaan tanah jajahan kita, [COG.GetNameDef]. Kendati administrasi kolonial di sana telah menyadari merebaknya sentimen kemerdekaan selama beberapa waktu, keberanian mereka yang secara terang-terangan menuntutnya cukup mengejutkan pihak pemerintah. Mereka memperingatkan kita bahwa terdapat sokongan rakyat lokal yang sangat masif demi meraih cita-cita bangsa yang merdeka dan berdaulat, dan apabila kita menanggapi secara terlampau keras, hal itu dapat memicu pertumpahan darah dan bahkan perang terbuka.\n\nKita juga harus mempertimbangkan komitmen global serta wibawa internasional kita. Oleh karena itu, tawaran paling diplomatik adalah mengizinkan mereka bergabung bersama kita sebagai mitra setara dalam Persemakmuran [BEL.GetAdjective].\n\nSebagai alternatif, sebagian besar kekayaan kita bersumber dari wilayah tersebut, dan keuangan negara kita akan terpukul sangat telak akibat lepasnya koloni ini. Kita dapat menuntut mereka membayar harga kemerdekaan mereka—dengan tebusan yang sangat tinggi.\n\nAkhirnya, kita dapat begitu saja menolak mentah-mentah, dan memobilisasi angkatan perang kita sebagai peringatan keras terhadap setiap potensi pemberontakan."
 congo_independence_struggle.2.a: "Sepanjang mereka bersedia terus bertempur di sisi kita"
 congo_independence_struggle.2.b: "Baiklah, namun hanya jika mereka bersedia membayar kompensasi yang sangat besar"
 congo_independence_struggle.2.c: "Kita tidak akan pernah membiarkan mereka lepas secara sukarela!"
 congo_independence_struggle.3.t: "[FROM.GetNameDefCap] Memberi Kemerdekaan Jika Kita Bergabung dengan Faksi Mereka"
 congo_independence_struggle.3.d: "Kita telah menerima warta dari [BEL.GetName], dan mereka mengakui bahwa era kekaisaran kolonial kini kian mendekati ajalnya. Oleh sebab itu, mereka mengulurkan tawaran kepada kita untuk bergabung ke dalam Persemakmuran [Bel.GetAdjective] sebagai bangsa yang bebas dan merdeka, dan dengan demikian menjadi mitra yang setara. Kita tetap akan terikat oleh ketentuan yang sama sebagaimana sekutu militer lainnya, dan karenanya diharapkan untuk maju berperang bersama-sama.\n\nIni kemungkinan merupakan jalan keluar paling diplomatik yang dapat kita harapkan, dan langkah ini memungkinkan kita menghindari pertumpahan darah sepenuhnya dengan sahabat-sahabat Eropa kita sembari tetap menjunjung tinggi kehormatan dan kemerdekaan Afrika."
 congo_independence_struggle.3.a: "Ini terdengar sangat bijaksana. Kita terima!"
 congo_independence_struggle.3.b: "Kita tidak dapat menyepakati syarat-syarat semacam itu..."
 congo_independence_struggle.4.t: "[FROM.GetNameDefCap] Membebaskan Kita Jika Membayar Kompensasi"
 congo_independence_struggle.4.d: "Kita telah menerima kabar dari [BEL.GetName], dan mereka secara harfiah telah menetapkan harga tebusan bagi kemerdekaan kita. Mereka mengingatkan kita akan besarnya modal yang telah mereka tanamkan ke negeri kita, mulai dari pembangunan bentangan rel kereta api yang panjang, pengembangan fasilitas pertambangan, hingga perluasan infrastruktur secara umum.\n\nPada saat itu, hal tersebut diklaim sebagai bagian dari tanggung jawab mereka terhadap kita selaku penguasa kolonial, dan dipandang semata-mata sebagai proses pembudayaan bangsa. Namun kini, mereka menyandera hal ini di atas kepala kita sebagai jaminan yang dirancang demi mempertahankan loyalitas kita melalui ketergantungan ekonomi.\n\nHarga tebusan yang diminta memang bukan mustahil, namun luar biasa tinggi dan akan memiskinkan bangsa kita dalam jangka pendek, serta membelenggu kita dalam jeratan utang untuk kurun waktu yang jauh lebih lama kelak. Pertanyaannya sekarang, apakah ini sepadan dengan harga kemerdekaan, ataukah kemerdekaan harus ditebus dengan darah?"
 congo_independence_struggle.4.a: "Kita akan mengumpulkan modal itu, dengan satu atau lain cara"
 congo_independence_struggle.4.b: "Kita tidak dapat menyepakati syarat-syarat tersebut..."
 congo_independence_struggle.5.t: "Merelakan [FROM.GetNameDef] Lepas"
 congo_independence_struggle.5.d: "Kita baru saja menerima kabar dari duta besar baru dari [COG.GetName], yang mengumumkan bahwa mereka telah menerima tawaran kemerdekaan dari penjajahan kolonial [BEL.GetAdjective] sebagai imbalan bergabung ke dalam Persemakmuran [BEL.GetAdjective] sebagai anggota penuh dan setara. Kini pekerjaan besar dimulai untuk menarik seluruh aparatur administrasi dari Kantor Kolonial dan menyerahkan tanggung jawab pemerintahan ini seutuhnya kepada kabinet baru mereka."
 congo_independence_struggle.5.a: "Misi kita telah sampai pada akhirnya!"
 congo_independence_struggle.6.t: "[FROM.GetNameDefCap] Tidak Mau Menerima Syarat Kita"
 congo_independence_struggle.6.d: "Ternyata [COG.GetNameDef] telah menolak tawaran murah hati kita untuk menempuh jalan kemerdekaan yang damai dan saling menguntungkan. Oleh karena itu, kini terserah kepada kita seberapa keras kita akan mempertahankan koloni pembangkang ini. Kita memiliki tiga opsi sebagai berikut;\n\nOpsi pertama, jika kita meyakini tekad mereka untuk merdeka mulai goyah, kita dapat menawarkan status sebagai departemen luar negeri, yang secara efektif mengubah mereka dari aset kolonial menjadi bagian terpencil dari wilayah kedaulatan kita, dengan otonomi yang sangat terbatas.\n\nOpsi kedua adalah memprovokasi mereka ke dalam konflik terbuka, lalu menunjukkan keperkasaan kita atas mereka di medan perang. Ini lebih merupakan perjudian, namun andai kita menang, jalan menuju penaklukan total terbuka lebar, dan kita dapat menyita seluruh aset mereka tanpa kecaman internasional.\n\nOpsi ketiga adalah yang paling diplomatis, di mana kita mengadopsi model serupa Imperium Britania, dengan [COG.GetNameDef] memperoleh hak menjadi dominion. Keputusan diplomatik mereka akan tetap ditentukan oleh kita, namun di luar itu otonomi mereka akan diperluas secara signifikan.\n\nNamun kita harus menyadari, bahwa jika mereka menolak salah satu dari tawaran ini, besar kemungkinan tidak ada jalan lain selain kekerasan."
 congo_independence_struggle.6.a: "Tuntut agar mereka menjadi departemen luar negeri"
 congo_independence_struggle.6.b: "Provokasi perang melawan mereka"
 congo_independence_struggle.6.c: "Tawarkan status Dominion kepada mereka"
 congo_independence_struggle.7.t: "Melepaskan [FROM.GetNameDef]"
 congo_independence_struggle.7.d: "Kita baru saja menerima kabar dari duta besar baru dari [COG.GetNameDef], yang mengumumkan bahwa mereka telah menerima tawaran untuk menebus kemerdekaan mereka dari kekuasaan kolonial kita. Kini pekerjaan dimulai untuk menarik administrasi dari Kantor Kolonial dan menyerahkan tanggung jawab ini kepada pemerintahan baru mereka—serta tentunya memastikan rekening bank dan perusahaan induk telah dibuat guna mulai menerima pembayaran yang semestinya."
 congo_independence_struggle.7.a: "Baiklah. Kita terima..."
 congo_independence_struggle.8.t: "[FROM.GetNameDefCap] Ingin Menjadikan Kita Teritori Luar Negeri"
 congo_independence_struggle.8.d: "[BEL.GetName] tampaknya berpikir bahwa kita tidak mampu merebut kemerdekaan dari mereka dengan kekerasan, dan menantang gertakan kita. Mereka telah menawarkan \"kesempatan\" kepada kita untuk menjadi departemen luar negeri, yang pada dasarnya menjadikan kita perpanjangan tangan bangsa mereka dengan hak kewarganegaraan namun tanpa otonomi untuk merajut masa depan kita sendiri. Mereka mungkin benar bahwa kita tidak memiliki kekuatan militer untuk menentang hal ini, namun pilihan pada akhirnya berada di tangan kita."
 congo_independence_struggle.8.a: "Baiklah. Kita terima..."
 congo_independence_struggle.8.b: "Ini tidak dapat diterima, kita menuntut kemerdekaan penuh!"
 congo_independence_struggle.9.t: "Force Publique Menyerang Pasukan Kita di Léopoldville"
 congo_independence_struggle.9.d: "Fajar menyingsing pagi ini diiringi deru tembakan saat unsur-unsur pemberontak dari Force Publique menyerang gedung-gedung pemerintah di Léopoldville. Pasukan pengawal setia membalas tembakan dan berhasil memukul mundur para pemberontak, namun ketegangan memuncak luar biasa dan beredar laporan tentang pembangkangan lebih lanjut di seantero unit Force Publique, serta milisi-milisi lokal yang mulai mempersenjatai diri dan berkumpul di seluruh penjuru Kongo."
 congo_independence_struggle.9.a: "Sebuah krisis tengah berkecamuk di Kongo"
 congo_independence_struggle.22.t: "Pembentukan Departemen Luar Negeri Baru"
 congo_independence_struggle.22.d: "Kita telah menerima kabar dari delegasi [COG.GetNameDef] yang telah ditundukkan, bahwa mereka memutuskan untuk menerima kedudukan mereka sebagai Departemen Luar Negeri [BEL.GetName]. Kantor kewarganegaraan dan perpajakan kita telah mulai menyusun dokumentasi untuk integrasi yang semestinya bagi warga negara baru ini ke dalam sistem kita, dan Kantor Kolonial telah mulai merancang sistem pemerintahan daerah baru yang lebih selaras dengan tatanan [BEL.GetAdjective]."
 congo_independence_struggle.22.a: "Kita telah berhasil memperdaya mereka!"
 congo_independence_struggle.23.t: "[FROM.GetNameDefCap] Ingin Kita Menjadi Dominion"
 congo_independence_struggle.23.d: "Pertemuan kita dengan para diplomat [BEL.GetName] telah membuahkan hasil, dan tampaknya mereka masih ingin menempuh jalur diplomasi. Mereka telah menawarkan perluasan otonomi sebagai Dominion, serupa dengan model Britania. Kita masih harus mengikuti garis diplomasi [BEL.GetAdjective], namun kita akan memiliki hak yang jauh lebih besar untuk memerintah diri sendiri selagi tetap berada di bawah perlindungan mereka."
 congo_independence_struggle.23.a: "Ya, kita dapat menyetujuinya"
 congo_independence_struggle.23.b: "Ini tidak dapat diterima, kita menuntut kemerdekaan penuh!"
 congo_independence_struggle.10.t: "[FROM.GetNameDefCap] Bersedia Menerima Status Dominion"
 congo_independence_struggle.10.d: "Kita baru saja menerima jawaban dari [COG.GetNameDef] mengenai tawaran kita untuk mengangkat status mereka menjadi dominion, dan mereka telah setuju!\n\nKini setelah kita melihat mereka bersedia berunding, jika kita mendesak sedikit lebih keras, kita mungkin dapat menekan mereka lebih jauh, namun langkah ini bukannya tanpa risiko dan kita bisa kehilangan mereka sepenuhnya, atau lebih buruk lagi, memojokkan mereka ke sudut tanpa pilihan."
 congo_independence_struggle.10.a: "Kita puas dengan menjadikan mereka Dominion"
 congo_independence_struggle.10.b: "Tidak, kita bisa mendesak mereka menuju integrasi lebih jauh"
 congo_independence_struggle.11.t: "Pembentukan Dominion Kongo"
 congo_independence_struggle.11.d: "Sesuai kesepakatan dengan [BEL.GetName], peletakan batu pertama dilakukan pagi ini untuk memulai pembangunan gedung pemerintahan baru guna menaungi Parlemen Dominion. Langkah berikutnya adalah memulai proses penyusunan konstitusi kita, dan menyerukan pemilihan umum pertama. Dari awal yang bersahaja ini, kita dapat mulai membentuk identitas politik masa depan bangsa ini."
 congo_independence_struggle.11.a: "Saatnya mulai bekerja, dan membangun Dominion baru kita!"
 congo_independence_struggle.12.t: "[FROM.GetNameDefCap] Menolak Solusi Dominion"
 congo_independence_struggle.12.d: "Dalam langkah yang mengejutkan, [BEL.GetName] telah memutuskan untuk membatalkan tawaran pembentukan Dominion! Kita tidak sepenuhnya yakin apa yang menyebabkan perubahan sikap ini, mungkin setelah sempat mundur sekali, kaum penjajah melakukan apa yang paling mereka kuasai: memanfaatkan situasi. Kita harus menentukan tanggapan kita sendiri terhadap penghinaan ini."
 congo_independence_struggle.12.a: "Ini tidak dapat diterima! Ancam mereka dengan pengerahan kekuatan."
 congo_independence_struggle.12.b: "Kita sebaiknya mengalah, teritori luar negeri tidaklah terlalu buruk"
 congo_independence_struggle.13.t: "Kongo Mengalah dan Setuju Menjadi Teritori Luar Negeri"
 congo_independence_struggle.13.d: "Muslihat diplomasi kita terhadap [COG.GetName] telah berhasil! Delegasi mereka datang menemui kita hari ini untuk menerima kedudukan mereka sebagai Teritori Luar Negeri."
 congo_independence_struggle.13.a: "Sempurna!"
 congo_independence_struggle.14.t: "[FROM.GetNameDefCap] Mengancam Perang"
 congo_independence_struggle.14.d: "Seorang delegasi yang sangat agresif dari [COG.GetNameDef] telah bertemu dengan Gubernur Kolonial tadi. Merasa sangat frustrasi dengan jalannya perundingan sejauh ini, mereka melayangkan ultimatum.\n\nAntara kita menerima kemerdekaan mereka yang berlaku segera, atau mereka akan membunyikan lonceng kebebasan melawan kita. Kita telah menerima laporan tentang unit milisi yang berkumpul, dan sejumlah bentrokan telah meletus melawan garnisun Force Publique. Belum ada korban jiwa, namun dengan ketegangan setinggi ini, itu hanyalah masalah waktu."
 congo_independence_struggle.14.a: "Maka perang yang akan mereka dapatkan! [COG.GetNameDef] adalah MILIK KITA!"
 congo_independence_struggle.14.b: "Kekuatan kita saat ini terlalu terpencar. Berikan kebebasan yang begitu mereka dambakan."
 congo_independence_struggle.15.t: "[FROM.GetNameDefCap] Tidak Akan Pergi Tanpa Perlawanan"
 congo_independence_struggle.15.d: "Unit Force Publique loyalis hari ini berupaya mengepung dan menangkap para pemimpin pergerakan kemerdekaan. Milisi [COG.GetAdjective] turun tangan, dan baku tembak pun meletus di antara mereka. Tampaknya diplomasi telah runtuh, dan perang kemerdekaan ini telah resmi berkobar."
 congo_independence_struggle.15.a: "Kita akan berjaya"
 congo_independence_struggle.16.t: "[FROM.GetNameDefCap] Mundur dan Memberi Kita Kemerdekaan"
 congo_independence_struggle.16.d: "Kita berhasil terhindar dari jurang perang dengan tuan kolonial kita. Atau lebih tepatnya, mantan tuan kolonial.\n\nDelegasi yang kita utus untuk bertemu dengan pihak administrasi telah menemui Gubernur Kolonial pagi ini, dan kedua belah pihak menandatangani berkas yang secara resmi mendeklarasikan kemerdekaan [COG.GetNameDef]. Kita kini menjadi bangsa merdeka yang berdaulat, dan penyerahan kekuasaan telah dimulai.\n\nKini kita memegang kendali penuh atas nasib kita sendiri mulai detik ini, dan semuanya tanpa perlu ditebus dengan darah, harga diri, maupun uang."
 congo_independence_struggle.16.a: "Hari ini adalah hari perayaan!"
 congo_independence_struggle.17.t: "[FROM.GetNameDefCap] Mengincar Kemerdekaan dengan Segala Cara"
 congo_independence_struggle.17.d: "Pagi ini kita menerima laporan radio yang disusun tergesa-gesa dari Gubernur Kolonial [COG.GetNameDef]. Dia mengklaim bahwa sekelompok massa telah menerobos kediaman resminya, melumpuhkan penjaga dengan senjata buatan luar negeri, dan menyerahkan deklarasi kemerdekaan langsung ke tangannya. Mereka kemudian bergegas pergi. Yang paling mengkhawatirkan, terindikasi bahwa massa ini dipimpin oleh unsur-unsur Force Publique, kepolisian militer yang bertugas menjaga ketertiban.\n\nDeklarasi tersebut menuntut penarikan segera administrasi Kolonial, dan penyerahan kekuasaan sah berikutnya kepada pemerintahan sipil yang akan dibentuk dari kepemimpinan pemberontakan ini. Kita tidak boleh berilusi bahwa ancaman ini nyata, dan kenyataan bahwa massa ini dipersenjatai dengan senjata yang bukan rancangan [BEL.GetAdjective] menyiratkan bahwa pihak asing telah menaruh kepentingan langsung dan mungkin mendukung pemberontak secara militer."
 congo_independence_struggle.17.a: "Kita tidak punya pilihan selain menerima"
 congo_independence_struggle.17.b: "Mereka berkhayal. Siapkan pasukan ekspedisi untuk segera memulihkan ketertiban!"
 congo_independence_struggle.18.t: "[FROM.GetNameDefCap] Melepas Kita"
 congo_independence_struggle.18.d: "Tampaknya ultimatum kita telah ditanggapi dengan keseriusan yang semestinya oleh tuan kolonial kita, karena hari ini kita menerima surat keputusan kemerdekaan yang telah ditandatangani dari Administrasi Kolonial. Rencana penurunan resmi bendera [BEL.GetAdjective] dan penyerahan kekuasaan secara damai kepada rezim baru kita telah berjalan. Kendati tujuan utama kita telah tercapai, tugas sesungguhnya untuk membentuk pemerintahan baru baru saja dimulai. Banyak hal yang harus kita lakukan: mengembangkan perekonomian, menormalisasi hubungan dengan negara-negara lain, dan tentu saja melunasi hutang budi tertentu kepada mereka yang telah mendukung terwujudnya impian ini."
 congo_independence_struggle.18.a: "Hari ini adalah hari perayaan!"
 congo_independence_struggle.19.t: "[FROM.GetNameDefCap] Bersiap untuk Berperang"
 congo_independence_struggle.19.d: "Kita menerima laporan bahwa pasukan [BEL.GetAdjective] mulai bergerak di Léopoldville, serta menindak tegas unsur-unsur yang tidak loyal di seluruh Force Publique. Kendati kita telah berupaya sekuat tenaga untuk menekan pemerintah [BEL.GetAdjective] agar tunduk dan mencapai tujuan kemerdekaan tanpa pertumpahan darah, kekuatan kolonial memilih untuk mempertahankan kekuasaan dengan satu-satunya cara yang mereka ketahui—melalui kekerasan. Peluang kita kian menyempit dengan cepat, dan kita harus memutuskan apakah akan memberi aba-aba bagi pendukung kita untuk bangkit atau mundur sebelum situasi memburuk di luar kendali kita."
 congo_independence_struggle.19.a: "Kemenangan akan berpihak pada mereka!"
 congo_independence_struggle.19.b: "Ini terlalu berbahaya. Kita harus mundur."
 congo_independence_struggle.20.t: "Kongo Menyatakan Perang Kemerdekaan!"
 congo_independence_struggle.20.d: "Kita telah mengambil tindakan apa pun yang memungkinkan demi mempertahankan kendali atas situasi yang kian memburuk dengan cepat, termasuk pembersihan sistematis terhadap unsur-unsur pengkhianat di tubuh Force Publique. Sayangnya, tindakan yang lebih terbuka ini dipandang sebagai bentuk agresi dan unit-unit pembangkang langsung melepaskan tembakan ke arah para perwira begitu mereka mendekat. Dengan desingan peluru ini, Perang Kemerdekaan telah resmi berkobar, berputar liar di luar kendali kedua belah pihak.\n\nMasih ada daerah-daerah yang tetap setia kepada kita, terutama yang merasakan manfaat kolonisasi secara paling langsung, namun sebagian besar wilayah kini telah bersatu melawan kita."
 congo_independence_struggle.20.a: "Angkat senjata, saudara-saudara!"
 congo_independence_struggle.21.t: "Kongo Mengalah dan Setuju Menjadi Teritori Luar Negeri"
 congo_independence_struggle.21.d: "Reaksi cepat kita terhadap perkembangan situasi di Kongo tampaknya berhasil meredakan ketegangan di sana. Para perwira [BEL.GetAdjective] bergerak sigap melumpuhkan unsur-unsur pembangkang Force Publique yang diketahui. Dengan kesetiaan mereka yang kembali terjamin, kobaran api pemberontakan lekas padam dan suara-suara paling lantang berhasil dibungkam—dalam banyak kasus oleh kokohnya dinding penjara.\n\nAdministrasi Kolonial telah mengambil inisiatif dan memanfaatkan kesempatan yang terbuka bagi mereka, memperluas kendali mereka ke seluruh tingkatan pemerintahan, dan sebagai hasilnya kita kini menikmati tingkat kendali yang jauh lebih tinggi atas koloni tersebut dibandingkan sebelumnya."
 congo_independence_struggle.21.a: "Jayalah Imperium [BEL.GetAdjective]!"
 congo_independence_struggle.24.t: "Kaum Loyalis di Léopoldville Memperuncing Konflik"
 congo_independence_struggle.24.d: "Suara desingan peluru memecah keheningan fajar. Unit-unit kepolisian [BEL.GetAdjective] dikerahkan untuk menawan unsur-unsur patriotik dari Force Publique, namun mereka justru disambut dengan hujan peluru. Pembangkangan menyebar dengan cepat, dan milisi mulai mengangkat senjata di seluruh penjuru negeri. Dukungan terhadap perjuangan meluas di seantero negeri, namun pasukan Kolonial tetap mempertahankan kendali atas beberapa daerah, khususnya daerah-daerah yang paling gencar mereka eksploitasi dan karenanya memiliki kehadiran militer terbesar.\n\nPerang Kemerdekaan ini telah berkobar dengan sungguh-sungguh, dan kita tidak akan beristirahat hingga Kongo bebas dari pendudukan bangsa Eropa."
 congo_independence_struggle.24.a: "Ini adalah perang yang tak boleh sampai kita kalah!"
 congolese_civil_war_starting_tt: "Kongo akan menyatakan perang kemerdekaan melawan kita. Mereka akan dapat memaksakan perdamaian dan meraih kemerdekaan penuh jika mengendalikan §YLéopoldville§!, §YÉlisabethville§!, dan §YStanleyville§!.\n\nDemikian pula, kita akan dapat memaksakan perdamaian dengan mereka dan mempertahankan kendali atas wilayah tersebut dengan mengendalikan §YLéopoldville§!, §YÉlisabethville§!, dan §YStanleyville§!."
 congolese_civil_war_starting_congo_side_tt: "Kaum Loyalis Belgia akan memulai perang saudara melawan kita. Kita akan dapat memaksakan perdamaian dengan mantan tuan kita dan meraih kemerdekaan penuh jika kita mengendalikan §YLéopoldville§!, §YÉlisabethville§!, dan §YStanleyville§!.\n\nDemikian pula, mereka akan dapat memaksakan perdamaian dengan kita dan mempertahankan kendali atas negara kita dengan mengendalikan §YLéopoldville§!, §YÉlisabethville§!, dan §YStanleyville§!."
