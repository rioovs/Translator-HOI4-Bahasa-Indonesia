 wuw_GER_reichskommissariats.16.desc: "Kini setelah kita membentuk administrasi sipil baru di Britania Raya, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
