 wuw_GER_reichskommissariats.17.t: "Status Slowakia"
 wuw_GER_reichskommissariats.17.desc: "Dengan dikuasainya zona strategis Slowakia, muncul perdebatan mengenai nasib wilayah ini. Sebagian rencana memasukkan wilayah ini ke dalam Balkan, sementara sebagian mengusulkan untuk menggabungkannya ke dalam wilayah Bohemia, atau bahkan diintegrasikan langsung ke dalam wilayah Jerman Raya. Apa ketetapan kita?"
 wuw_GER_reichskommissariats.17.a: "Hongaria harus diberi ganjaran wilayah"
 wuw_GER_reichskommissariats.17.b: "Wilayah ini harus dimasukkan ke dalam Balkan"
 wuw_GER_reichskommissariats.17.c: "Wilayah ini harus dimasukkan ke dalam Böhmen-Mähren"
 wuw_GER_reichskommissariats.17.d: "Wilayah ini harus diintegrasikan langsung ke dalam Reich kita"
