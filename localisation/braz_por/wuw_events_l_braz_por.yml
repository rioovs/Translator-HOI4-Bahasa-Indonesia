 wuw_GER_reichskommissariats.23.t: "Status Pesisir Barat Amerika"
 wuw_GER_reichskommissariats.23.desc: "Dengan dikuasainya zona strategis Pesisir Barat Amerika, muncul perdebatan mengenai bagaimana wilayah ini harus dikelola. Sebagian rencana memasukkan wilayah ini ke dalam Nordamerika, sementara sebagian menyarankan agar digabungkan ke dalam wilayah Kolumbus. Bahkan ada yang mendesak agar wilayah tersebut diserahkan kepada [JAP.GetNameDef]. Apa titah kita?"
 wuw_GER_reichskommissariats.23.a: "Perjanjian persekutuan dengan Jepang harus dihormati"
 wuw_GER_reichskommissariats.23.b: "Wilayah ini harus dimasukkan ke dalam Nordamerika"
 wuw_GER_reichskommissariats.23.c: "Wilayah ini harus dimasukkan ke dalam Kolumbus"
