 poland_mefo_bills_tt: "Menggunakan emas Polandia untuk memotong biaya §Y[GetMilitaryProductionModifierName]§!.\n"
 generic_lower_mefo_bills_tt: "Menggunakan emas yang baru disita untuk memotong biaya §Y[GetMilitaryProductionModifierName]§!.\n"
 wuw_GER_military_events.2.t: "Penerbang Mengampuni Awak Pengebom [USA.GetAdjective]"
 wuw_GER_military_events.2.desc: "Menyusul serangan pengeboman intensif terhadap industri militer kita, sebuah kisah tak terduga mencuat ke permukaan. Kendati ada perintah tegas untuk menembak jatuh setiap pesawat musuh yang melanggar wilayah udara kita, seorang penerbang tempur menolak melakukannya. Sang penerbang, bernama Franz Stigler, berpapasan dengan sebuah pesawat pengebom yang lumpuh tepat setelah serangan bom dan memilih untuk tidak menembakinya. Ia membenarkan tindakannya dengan menyatakan bahwa pengebom yang lumpuh itu tak ubahnya serdadu yang berparasut, dan menembaki mereka sama kejinya. Setelah awalnya berusaha berkomunikasi dengan awak pengebom agar mereka mendarat di [GER.GetNameDef] dan menyerah, atau setidaknya menuju ke wilayah netral, Stigler menyerah pada upaya baik tersebut, dan justru mengawal pengebom musuh itu menuju keselamatan.\n\nFranz Stigler adalah penerbang berbakat, namun jika dibiarkan terus seperti ini, ia beserta tindakan membangkangnya dapat menimbulkan masalah bagi kita."
 wuw_GER_military_events.2.a: "Kita biarkan dia hidup, namun ini tidak boleh terulang!"
 wuw_GER_military_events.2.b: "Jadikan dia sebagai contoh teladan hukuman!"
 wuw_GER_military_events.2.c: "Jangan ada sepatah kata pun tentang hal ini."
 wuw_GER_diplomacy.1.t: "[FROM.GetNameDefCap] Menawarkan Kemitraan Dagang"
 #wuw_GER_diplomacy.1.desc - there is none - using AAT_germany.1.desc
 wuw_GER_diplomacy.1.a: "Kita berdua sama-sama diuntungkan dari kesepakatan ini."
 wuw_GER_diplomacy.1.b: "Perjanjian ini hanya akan menguntungkan salah satu dari kita..."
 wuw_GER_diplomacy.2.t: "[FROM.GetNameDefCap] Menerima Usulan Dagang Kita"
 wuw_GER_diplomacy.2.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang masuk akal dan memperhatikan kepentingan terbaik negara [FROM.GetLeader.GetHerHis]. Kebetulan sekali, hal ini juga sangat menguntungkan kepentingan negara kita. Kita akan memanfaatkan tambahan sumber daya dari [FROM.GetName] dengan sebaik-baiknya."
 #wuw_GER_diplomacy.2.a - there is none
 wuw_GER_diplomacy.3.t: "[FROM.GetNameDefCap] Menolak Usulan Dagang Kita"
 wuw_GER_diplomacy.3.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang tidak masuk akal dan picik yang sama sekali tidak memedulikan apa yang terbaik bagi negara [FROM.GetLeader.GetHerHis]. Kita akan beralih ke tempat lain untuk menemukan apa yang kita cari."
 wuw_GER_diplomacy.3.a: "Kerugian bagi mereka."
 #wuw_GER_diplomacy.10.t - using old loc
 #wuw_GER_diplomacy.10.desc - using old loc
 wuw_GER_diplomacy.10.a: "Kita tidak berani menolak...."
 wuw_GER_diplomacy.10.b: "Ini tidak dapat diterima!"
 wuw_GER_diplomacy.11.t: "[FROM.GetNameDefCap] Menggagalkan Rencana Kita"
 wuw_GER_diplomacy.11.desc: "Secara tegas [FROM.GetLeader] dari [FROM.GetName] telah memberi tahu kita apa pendapat [FROM.GetLeader.GetSheHe] tentang upaya terbaru kita untuk memengaruhi politik internal mereka. Tak perlu dikatakan lagi, para diplomat kita harus menyusun ulang sebagian dari isi pesan tersebut sebelum menyampaikannya kepada [ROOT.GetLeader]."
 wuw_GER_diplomacy.11.a: "Sungguh lancang!"
 wuw_GER_diplomacy.20.t: "Undangan ke [FROM.GetFactionName]"
 wuw_GER_diplomacy.20.desc: "[FROM.GetLeader] secara pribadi telah menyampaikan undangan ke [FROM.GetFactionName] kepada [ROOT.GetLeader]. Perwakilan dari Komando Tinggi [FROM.GetAdjective] meyakinkan kita bahwa bersama dengan aliansi mereka yang sudah tangguh, kita akan dengan mudah membasmi musuh bersama kita, memastikan dominasi [ROOT.GetAdjective] di sekitar kita."
 wuw_GER_diplomacy.20.a: "Bersatu demi kemenangan!"
 wuw_GER_diplomacy.20.b: "Kita memiliki rencana lain"
 wuw_GER_diplomacy.21.t: "[FROM.GetNameDefCap] Bergabung dengan [ROOT.GetFactionName]"
 wuw_GER_diplomacy.21.desc: "Komando Tinggi Militer kita bersama para diplomat ulung telah berhasil meyakinkan [FROM.GetLeader] dan pemerintah [FROM.GetAdjective] untuk menyatukan kekuatan bersama kita demi meremukkan musuh bersama kita. Tentu saja kita sebenarnya tidak membutuhkan bantuan mereka untuk memporak-porandakan musuh kita, namun serdadu mereka akan berguna sebagai umpan peluru selagi prajurit kita menumbangkan perlawanan apa pun."
 wuw_GER_diplomacy.21.a: "Selamat datang dalam barisan!"
 wuw_GER_diplomacy.22.t: "[FROM.GetNameDefCap] Menolak Undangan Kita"
 wuw_GER_diplomacy.22.desc: "Kendati kita telah berusaha sebaik mungkin dan ada keuntungan nyata yang akan diraih [FROM.GetNameDef] dengan menggabungkan kekuatan kita, [FROM.GetLeader] dan pemerintah [FROM.GetAdjective] telah mengambil keputusan keliru dengan menolak undangan kita untuk bergabung dengan [ROOT.GetFactionName]. Tentu saja hal ini tidak banyak mengubah apa pun bagi kita karena undangan ini sejatinya lebih demi kebaikan [FROM.GetName]."
 wuw_GER_diplomacy.22.a: "Mari kita lihat berapa lama mereka mampu bertahan sendirian"
 wuw_GER_diplomacy.23.t: "[FROM.GetNameDefCap] Meminta Kendali atas Bekas Koloni"
 wuw_GER_diplomacy.23.desc: "Pemimpin [FROM.GetAdjective], [FROM.GetLeader], telah mendekati kita dengan usulan kesepakatan yang, setidaknya menurut [FROM.GetLeader.GetHerHis], bersifat saling menguntungkan. [FROM.GetLeader.GetHerHis] ingin mendapatkan kembali bekas koloni mereka, namun sebagai imbalannya menawarkan wawasan tentang produksi tank mereka dan janji perdamaian di antara kedua negara kita."
 wuw_GER_diplomacy.23.a: "Pihak [FROM.GetADjective]s mengajukan alasan yang meyakinkan"
 wuw_GER_diplomacy.23.b: "Itu sama sekali tidak menguntungkan kita!"
 wuw_GER_diplomacy.24.t: "Pihak [FROM.GetAdjective] Menyerahkan Bekas Koloni [ROOT.GetAdjective]"
 wuw_GER_diplomacy.24.desc: "Kita telah menerima pesan yang paling menggembirakan dari [FROM.GetNameDef]. Mereka melihat manfaat dari kesepakatan yang kita usulkan dan telah menyerahkan seluruh bekas koloni kita yang sebelumnya berada di bawah kendali mereka kembali ke kepemilikan kita."
 wuw_GER_diplomacy.24.a: "Kabar Luar Biasa!"
 wuw_GER_diplomacy.25.t: "Pihak [FROM.GetAdjective] Menolak Menyerahkan Bekas Koloni Kita kepada Kita."
 wuw_GER_diplomacy.25.desc: "Kita mengira [FROM.GetLeader] dari [FROM.GetNameDef] adalah sosok yang paling masuk akal, namun tampaknya dugaan kita keliru. Pihak [FROM.GetAdjective] dengan keras kepala menolak usulan kesepakatan kita terlepas dari keuntungan nyata yang akan mereka dapatkan. Kita terpaksa harus bertahan tanpa bekas koloni kita."
 wuw_GER_diplomacy.25.a: "Keputusan buruk dari pihak mereka..."
 wuw_GER_diplomacy.26.t: "Usulan Riset Bersama"
 wuw_GER_diplomacy.26.desc: "Pemimpin [FROM.GetAdjective], [FROM.GetLeader], telah mendekati kita dengan usulan kerja sama ilmiah. [FROM.GetLeader.GetSheHeCap] menyatakan bahwa dengan kesamaan ideologi namun fokus yang sangat berbeda dalam pengelolaan angkatan laut kita, terdapat peluang besar untuk bekerja sama di sini. Menyetujui pakta ini berarti membagikan beberapa temuan kita kepada mereka, namun juga memungkinkan kita belajar dari mereka."
 wuw_GER_diplomacy.26.a: "Kedengarannya cukup adil"
 wuw_GER_diplomacy.26.b: "Hal ini sama sekali tidak menarik bagi kita"
 wuw_GER_diplomacy.27.t: "[FROM.GetNameDefCap] Setuju Membentuk Upaya Riset Bersama"
 wuw_GER_diplomacy.27.desc: "Kepemimpinan [FROM.GetAdjective] menanggapi dengan sangat positif usulan upaya riset bersama kita. Mengingat upaya angkatan laut kita sangat berbeda, mereka pun melihat nilai penting dari saling belajar satu sama lain sehingga kita dapat tumbuh kian perkasa bersama-sama."
 wuw_GER_diplomacy.27.a: "Bagus!"
 wuw_GER_diplomacy.28.t: "[FROM.GetNameDefCap] Menolak Usulan Riset Kita"
 wuw_GER_diplomacy.28.desc: "Tanggapan dari [FROM.GetNameDef] tidak sesuai dengan yang kita harapkan. Mereka tampaknya enggan membagikan temuan mereka dalam bidang teknik angkatan laut, bahkan ketika kita menawarkan kesepakatan yang paling menguntungkan bagi mereka dengan bersedia membagikan temuan kita sendiri. Seiring dengan penolakan tersebut, terselip pernyataan bahwa Angkatan Laut [FROM.GetAdjective] jauh lebih unggul daripada milik kita dan sebelum kita membuat kemajuan signifikan dalam teknologi maritim, segala bentuk kesepakatan semacam ini ditiadakan."
 wuw_GER_diplomacy.29.t: "Sekutu Lama Mengusulkan Kesepakatan Dagang"
 wuw_GER_diplomacy.29.desc: "Pernah ada masa ketika kita menganggap [FROM.GetNameDef], atau setidaknya pendahulu mereka, sebagai sekutu kita. Selama beberapa tahun terakhir kita telah menjauh, tetapi tampaknya kini mereka ingin menyalakan kembali persahabatan tersebut. Mengusulkan kesepakatan dagang yang saling menguntungkan, pihak [FROM.GetAdjective] sekali lagi mengulurkan tangan kepada kita."
 wuw_GER_diplomacy.29.a: "Tak terduga, namun disambut baik!"
 wuw_GER_diplomacy.29.b: "Ini terdengar mencurigakan..."
 wuw_GER_diplomacy.30.t: "Penerimaan [FROM.GetAdjective] atas Usulan Dagang"
 wuw_GER_diplomacy.30.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi secara positif usulan kesepakatan dagang kita. Kita sebelumnya memiliki kesepakatan dagang yang sangat menguntungkan dengan mereka dan [ROOT.GetLeader] sangat yakin bahwa ini akan mendatangkan banyak keuntungan bagi kita."
 wuw_GER_diplomacy.30.a: "Kabar bagus!"
 wuw_GER_diplomacy.31.t: "Penolakan [FROM.GetAdjective] atas Usulan Dagang Kita"
 wuw_GER_diplomacy.31.desc: "Kendati memiliki ikatan sejarah dan keuntungan nyata bagi mereka, [FROM.GetNameDef] telah menolak kesepakatan dagang yang kita usulkan. Kesepakatan itu sejatinya akan memfasilitasi lebih banyak perdagangan antara kedua negara kita dan memperkokoh persahabatan kita. Sayang sekali, tampaknya pihak [FROM.GetAdjective] memiliki gagasan lain."
 wuw_GER_diplomacy.31.a: "Kerugian bagi mereka"
 wuw_GER_diplomacy.32.t: "Permintaan [FROM.GetAdjective] untuk Melanjutkan Sewa [743.GetName]"
 wuw_GER_diplomacy.32.desc: "Dalam perundingan selama tahun 1898, [743.GetName] disewakan kepada apa yang saat itu disebut Kekaisaran Jerman. Hari ini penerus mereka, [FROM.GetNameDef], telah menghubungi kita dengan harapan dapat melanjutkan sewa ini. Sewa asli sedianya berjalan hingga tahun 1997, namun terhenti akibat Perang Besar dan pendudukan [JAP.GetAdjective]."
 wuw_GER_diplomacy.32.a: "Kita tidak berminat melanjutkan sewa tersebut"
 wuw_GER_diplomacy.32.b: "Kita akan menghormati kesepakatan awal kita"
 wuw_GER_diplomacy.33.t: "[FROM.GetNameDefCap] Menolak Kembali ke Kesepakatan Kita"
 wuw_GER_diplomacy.33.desc: "Kesepakatan kita pada tahun 1898 sudah jelas: [743.GetName] adalah milik kita hingga tahun 1997, namun pihak [FROM.GetAdjective] tampaknya mulai gentar. Mereka tampaknya berpikir bahwa hanya karena perang itu dan pendudukan [JAP.GetAdjective] setelahnya, kesepakatan kita tidak lagi berlaku. Perjanjian tersebut sama sekali tidak mencantumkan klausul seperti itu, namun tampaknya kita hanya memiliki sedikit pilihan. Jika kita menginginkan [743.GetName] kembali, kita mungkin harus menempuh langkah-langkah yang lebih drastis."
 wuw_GER_diplomacy.33.a: "Sungguh tidak sopan!"
 wuw_GER_diplomacy.34.t: "[FROM.GetNameDefCap] Kembali Melanjutkan Sewa [743.GetName]"
 wuw_GER_diplomacy.34.desc: "Pihak [FROM.GetAdjective] telah membuktikan diri sebagai mitra yang paling setia. Kita awalnya menandatangani sewa 99 tahun atas [743.GetName] pada tahun 1898, namun sewa tersebut terputus saat Perang Besar melanda dunia. Setelah sempat diduduki oleh [JAP.GetNameDef], wilayah tersebut dikembalikan kepada [FROM.GetNameDef], dan syukurlah mereka mau menghormati kesepakatan kita."
 wuw_GER_diplomacy.34.a: "Kabar yang luar biasa!"
 wuw_GER_diplomacy.35.t: "[FROM.GetNameDefCap] Meminta Kendali atas Bekas Koloni"
 wuw_GER_diplomacy.35.desc: "Kita telah menerima kabar dari pemimpin [FROM.GetAdjective] [FROM.GetLeder], [FROM.GetLeader.GetSheHe] ingin mendapatkan kembali kendali atas bekas koloni mereka yang saat ini berada di bawah kendali kita. Komunikasi ini tampak cukup bersahabat, namun mengingat iklim perpolitikan [FROM.GetNameDef] saat ini, mungkin ada konsekuensi mengerikan jika kita menolaknya."
 wuw_GER_diplomacy.35.a: "Tanah itu bukan milik mereka!"
 wuw_GER_diplomacy.35.b: "Tidak sebanding risikonya jika menolak mereka!"
 wuw_GER_diplomacy.36.t: "Penolakan [FROM.GetAdjective] untuk Menyerahkan Koloni Kita"
 wuw_GER_diplomacy.36.desc: "Kita mengira telah memperjelas kepada [FROM.GetNameDef] bahwa penyerahan koloni sah kita bukanlah pilihan sukarela. Namun, mereka tetap bersikeras menolak melakukan apa yang benar dan terbaik bagi mereka. Kita tetap mengklaim wilayah ini, dan mereka tidak berhak menghalangi jalan kita!"
 wuw_GER_diplomacy.36.a: "Tanah itu adalah milik kita!"
 wuw_GER_diplomacy.37.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah kepada Kita"
 wuw_GER_diplomacy.37.desc: "Permintaan kita untuk mendapatkan kembali koloni kita dari [FROM.GetNameDef] telah disambut dengan pengertian dan kepatuhan oleh [FROM.GetLeader]. Menyatakan bahwa mereka lebih menjunjung tinggi hubungan kita daripada sebidang tanah, mereka dengan murah hati telah mengembalikan wilayah yang secara sah merupakan milik kita kepada kita."
 wuw_GER_diplomacy.37.a: "Pilihan yang bijak"
 wuw_GER_diplomacy.38.t: "[FROM.GetAdjective] Menuntut Wilayah"
 wuw_GER_diplomacy.38.desc: "[GetGERAfricanColonyOverlordDesc]"
 GER_is_not_colonial_overlord_desc: "Kita telah menerima tuntutan untuk menyerahkan wilayah kita kepada [FROM.GetNameDef]. Atas dasar sejarah, mereka mengklaim sebagai pemilik sah tanah-tanah ini. Tuntutan ini disampaikan dengan nada yang cukup keras, namun masih ada ruang bagi kita untuk menanggapi sesuai dengan agenda kita sendiri."
 GER_is_colonial_overlord_desc: "Kita telah mencemaskan hari ini akan tiba, meski berharap hal itu tidak akan terjadi. [FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut agar kita, sebagai bawahan dari [FROM.GetLeader.GetHerHis], melepaskan kemerdekaan kita dan menjadi bagian sah dari [FROM.GetNameDef]. Pendapat kita tidak lagi berarti dalam persoalan ini, kita tidak bisa berbuat apa-apa selain patuh."
 wuw_GER_diplomacy.38.a: "[GetGERAfricanColonyOverlordOption]"
 GER_is_not_colonial_overlord_option: "Lebih baik cari aman daripada menyesal..."
 GER_is_colonial_overlord_option: "Kita telah menjalani masa-masa yang baik"
 wuw_GER_diplomacy.38.b: "Sama sekali tidak!"
 wuw_GER_diplomacy.39.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah kepada Kita"
 wuw_GER_diplomacy.39.desc: "Tuntutan kita kepada kepemimpinan [FROM.GetAdjective] telah dipenuhi dengan persetujuan yang enggan. Kendati mereka tampaknya tidak terlalu senang menyerahkan wilayah mereka, apa yang mereka rasakan bukanlah urusan kita; mendapatkan wilayah yang sah milik kita adalah yang terpenting."
 wuw_GER_diplomacy.39.a: "Bagus!"
 wuw_GER_diplomacy.40.t: "[FROM.GetNameDefCap] Menolak Tuntutan Teritorial Kita"
 wuw_GER_diplomacy.40.desc: "Kendati tekanan kian besar ditimpakan kepada pemimpin [FROM.GetAdjective], [FROM.GetLeader], serta jajaran kepemimpinan [FROM.GetAdjective] lainnya, mereka bergeming. Kita tidak akan dapat merebut kendali atas bekas koloni kita yang saat ini berada di bawah kendali mereka secara damai."
 wuw_GER_diplomacy.40.a: "Kita akan mencari cara lain"
 wuw_GER_diplomacy.100.t: "Pembayaran Biaya Pendudukan [FROM.GetAdjective] Terhenti"
 wuw_GER_diplomacy.100.desc: "Duta besar [FROM.GetName] telah memberi tahu kita bahwa kita tidak akan lagi menerima pembayaran biaya pendudukan dari mereka yang sebelumnya telah disepakati bersama."
 wuw_GER_diplomacy.100.a: "Biarlah begitu"
 wuw_GER_diplomacy.50.t: "[FROM.GetNameDefCap] Ingin Memulai Kerja Sama Pengembangan Angkatan Laut"
 wuw_GER_diplomacy.50.desc: "\nPara diplomat dan insinyur angkatan laut [FROM.GetNameDef] telah mendekati kita dengan tawaran yang tak biasa. Mereka menyatakan ingin memulai program kerja sama maritim yang ekstensif, berbagi teknologi serta teknik antara kedua negara kita. Ini dapat menguntungkan kita, tetapi juga berisiko membocorkan informasi rahasia kepada pihak [FROM.GetAdjective]. Apa tanggapan kita?"
 wuw_GER_diplomacy.50.a: "Sungguh Luar Biasa!"
 wuw_GER_diplomacy.50.b: "Tidak ada kerja sama dengan kaum Kraut!"
 wuw_GER_diplomacy.51.t: "[FROM.GetNameDefCap] Menerima Kerja Sama Pengembangan Angkatan Laut"
 wuw_GER_diplomacy.51.desc: "[FROM.GetLeader] hari ini telah berbicara mendukung kesepakatan kerja sama maritim yang kita ajukan baru-baru ini, dan mengklaim bahwa para insinyur angkatan laut [FROM.GetAdjective] sudah bersiap memulai riset dan pengembangan bersama kapal-kapal laut serta persenjataan seawal pekan depan. Ini adalah hari yang agung bagi [ROOT.GetNameDef] dan armadanya!"
 wuw_GER_diplomacy.51.a: "Armada kita akan bangkit perkasa kembali"
 wuw_GER_diplomacy.52.t: "[FROM.GetNameDefCap] Menolak Kerja Sama Pengembangan Angkatan Laut"
 wuw_GER_diplomacy.52.desc: "[FROM.GetLeader] hari ini telah berbicara menentang kesepakatan kerja sama maritim yang kita ajukan baru-baru ini, dan mengklaim bahwa itu adalah muslihat nyata dan terang-terangan untuk mencuri rahasia teknik [FROM.GetAdjective]..."
 wuw_GER_diplomacy.52.a: "Pilihan yang bodoh"
 wuw_GER_diplomacy.53.t: "[FROM.GetNameDefCap] Menawarkan Kemitraan Dagang"
 wuw_GER_diplomacy.53.desc: "Para diplomat [FROM.GetNameDef] telah mendekati kita terkait tawaran yang menggiurkan. Mereka ingin membeli hak atas cadangan sumber daya alam tertentu di koloni kita, dan menawarkan bantuan industri sebagai imbalannya. Haruskah kita menerima kesepakatan ini?"
 wuw_GER_diplomacy.53.a: "Kita berdua sama-sama diuntungkan dari kesepakatan ini."
 wuw_GER_diplomacy.53.b: "Perjanjian ini hanya akan menguntungkan salah satu dari kita..."
 wuw_GER_diplomacy.54.t: "[FROM.GetNameDefCap] Menerima Usulan Dagang Kita"
 wuw_GER_diplomacy.54.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang masuk akal dan memperhatikan kepentingan terbaik negara [FROM.GetLeader.GetHerHis]. Secara kebetulan, hal ini pun selaras dengan kepentingan terbaik negara kita. Kita akan memanfaatkan sebaik mungkin sumber daya tambahan dari [FROM.GetName]."
 wuw_GER_diplomacy.54.a: "Sempurna!"
 wuw_GER_diplomacy.55.t: "[FROM.GetNameDefCap] Menolak Usulan Dagang Kita"
 wuw_GER_diplomacy.55.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang tidak masuk akal dan picik yang sama sekali tidak memedulikan apa yang terbaik bagi negara [FROM.GetLeader.GetHerHis]. Kita akan beralih ke tempat lain untuk mencari apa yang kita butuhkan."
 wuw_GER_diplomacy.55.a: "Kerugian bagi mereka."
 wuw_GER_diplomacy.56.t: "[FROM.GetNameDefCap] Mengosongkan Rekening Kita"
 wuw_GER_diplomacy.56.desc: "Para pejabat dan bankir [FROM.GetAdjective] telah memutus akses ke rekening kita di Jerman, dan mengosongkannya. Ini berarti [GER.GetNameDef] telah menyita dana kita yang didapat dari Perjanjian Perdagangan Gömbös, yang pada hakikatnya membatalkan perjanjian tersebut. Kita tidak akan pernah bisa mempercayai kata-kata mereka lagi..."
 wuw_GER_diplomacy.56.a: "Berani-beraninya mereka!"
 wuw_GER_diplomacy.57.t: "[FROM.GetNameDefCap] Menuntut Pengembalian Schleswig Utara"
 wuw_GER_diplomacy.57.desc: "\nRetorika dari [FROM.GetLeader] dan pemerintah [FROM.GetAdjective] kian memusuhi kita akhir-akhir ini, mengklaim bahwa plebisit Schleswig 1920 tidak sah dan penuh kecurangan, dan kini menuntut agar kita mengembalikan wilayah tersebut kepada mereka. Kita tahu hal itu tidak benar, namun mungkinkah jalan terbaik adalah menghindari konflik terbuka dengan [FROM.GetNameDef]?"
 wuw_GER_diplomacy.57.a: "Kita tidak menginginkan konflik, maka kita harus patuh..."
 wuw_GER_diplomacy.57.b: "Biarkan mereka datang dan coba merebutnya!"
 wuw_GER_diplomacy.58.t: "[FROM.GetNameDefCap] Tunduk pada Tuntutan Kita"
 wuw_GER_diplomacy.58.desc: "[FROM.GetLeader] telah menyatakan bahwa, demi menghindari konflik bersenjata melawan kita, mereka memilih untuk mengembalikan wilayah yang diperoleh dalam plebisit Schleswig 1920. Rakyat di kawasan itu bersuka cita, karena mereka sekali lagi telah dipulangkan ke pangkuan tanah air."
 wuw_GER_diplomacy.58.a: "Hari yang agung bagi rakyat [ROOT.GetAdjective]!"
 wuw_GER_diplomacy.59.t: "[FROM.GetNameDefCap] Berdiri Teguh pada Plebisit Schleswig"
 wuw_GER_diplomacy.59.desc: "\nDengan penuh percaya diri yang berlebihan, [FROM.GetLeader] telah menetapkan bahwa Schleswig Utara adalah dan akan selalu menjadi milik [FROM.GetAdjective]. Pasukan [FROM.GetNameDefCap] telah dimobilisasi, dan dikerahkan secara kilat ke perbatasan kita, seolah bersiap menyongsong perang. Bagaimana kita harus menanggapi provokasi ini?"
 wuw_GER_diplomacy.59.a: "Maka kita akan merebutnya dari tangan dingin mereka!"
 wuw_GER_diplomacy.59.b: "Kita sungguh sebaiknya tidak memperkeruh situasi..."
 wuw_GER_mutual_guarantees.1.t: "[FROM.GetNameDefCap] Meminta Kerja Sama Timbal Balik"
 wuw_GER_mutual_guarantees.1.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita dengan tawaran jaminan dan kerja sama timbal balik. Kesepakatan ini mencakup perlindungan timbal balik atas tanah masing-masing, dan berpotensi berkembang menjadi sesuatu yang jauh lebih besar di masa depan. Apa tanggapan kita?"
 wuw_GER_mutual_guarantees.1.a: "Ini adalah kesepakatan yang saling menguntungkan"
 wuw_GER_mutual_guarantees.1.b: "Kita tidak melihat nilai penting dalam pakta ini"
 wuw_GER_mutual_guarantees.2.t: "[FROM.GetNameDefCap] Menyambut Baik Kerja Sama Timbal Balik"
 wuw_GER_mutual_guarantees.2.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima permintaan kita untuk kerja sama dan jaminan timbal balik serta menyambut para diplomat kita dengan tangan terbuka, menyatakan bahwa hanya dengan bersatulah kita dapat melindungi bangsa kita dari kekuatan asing yang mengancam keseimbangan."
 wuw_GER_mutual_guarantees.2.a: "Bagus"
 wuw_GER_mutual_guarantees.3.t: "[FROM.GetNameDefCap] Menolak Kerja Sama Timbal Balik"
 wuw_GER_mutual_guarantees.3.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kita untuk pakta perlindungan dan kerja sama timbal balik, mengklaim bahwa ini adalah cara bagi kita untuk secara diam-diam menyusup bukan hanya ke dalam sanubari rakyat mereka demi melemahkan mereka, melainkan juga sebuah muslihat demi mendominasi negara mereka pada akhirnya. Mereka benar-benar tidak menyadari tawaran berharga yang mereka lewatkan..."
 wuw_GER_mutual_guarantees.3.a: "Mereka membuat kesalahan besar"
 wuw_GER_weltpolitik.1.t: "[FROM.GetName] Meminta Pengembalian Bekas Wilayah Kolonial"
 wuw_GER_weltpolitik.1.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita dengan permintaan yang menarik. Mereka meminta agar kita mengembalikan bekas wilayah kolonial [FROM.GetAdjective] kepada mereka sebagai imbalan atas pendalaman hubungan antarnegara kita dan dukungan resmi mereka terhadap pemerintah kita di panggung global. Ini tampak agak berat sebelah, namun mungkinkah ini yang terbaik?"
 wuw_GER_weltpolitik.1.a: "Apa pun demi sahabat kita"
 wuw_GER_weltpolitik.1.b: "Tidak, tanah itu kini milik kita"
 wuw_GER_weltpolitik.2.t: "[FROM.GetNameDefCap] Mengembalikan Koloni Kita"
 wuw_GER_weltpolitik.2.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima permintaan kita untuk mengembalikan bekas koloni kita, menyatakan bahwa wilayah-wilayah itu akan lebih baik berada di tangan kita. Rakyat merayakannya di jalan-jalan, seiring kembalinya imperium kolonial [ROOT.GetAdjective] ke peta dunia."
 wuw_GER_weltpolitik.2.a: "Kita bergegas menyongsong Zaman Keemasan baru!"
 wuw_GER_weltpolitik.3.t: "[FROM.GetNameDefCap] Tidak Mengembalikan Koloni Kita"
 wuw_GER_weltpolitik.3.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kita untuk mengembalikan bekas koloni kita, mengklaim bahwa ini adalah kesepakatan sepihak di mana mereka hampir tidak mendapatkan keuntungan apa pun."
 wuw_GER_weltpolitik.3.a: "Memang belum ditakdirkan..."
 wuw_GER_diplomacy.60.t: "[FROM.GetNameDefCap] Menuntut Schleswig Utara"
 wuw_GER_diplomacy.60.desc: "\nRetorika dari [FROM.GetLeader] dan pemerintah [FROM.GetAdjective] kian memusuhi para administrator lokal kita di [912.GetName], mengklaim bahwa Schleswig Utara selalu dan akan selalu menjadi tanah Jerman, dan kini menuntut agar kita mengembalikan wilayah tersebut kepada mereka. Kita tahu hal itu tidak benar, namun mungkinkah jalan terbaik adalah menghindari konflik terbuka dengan [FROM.GetNameDef]?"
 wuw_GER_diplomacy.60.a: "Mereka benar"
 wuw_GER_diplomacy.60.b: "Apakah mereka sedang berkhayal?"
 wuw_GER_diplomacy.61.t: "[FROM.GetNameDefCap] Tunduk pada Tuntutan Kita"
 wuw_GER_diplomacy.61.desc: "[FROM.GetLeader] telah menyatakan bahwa, demi menghindari konflik bersenjata melawan kita, mereka memilih untuk mengembalikan wilayah [912.GetName]. Rakyat di kawasan itu bersuka cita, karena mereka sekali lagi telah dipulangkan ke pangkuan tanah air."
 wuw_GER_diplomacy.61.a: "Hari yang agung bagi rakyat [ROOT.GetAdjective]!"
 wuw_GER_diplomacy.62.t: "[FROM.GetNameDefCap] Berdiri Teguh di [912.GetName]"
 wuw_GER_diplomacy.62.desc: "\nDengan penuh percaya diri yang berlebihan, [FROM.GetLeader] telah menetapkan bahwa Schleswig Utara adalah dan akan selalu menjadi milik [FROM.GetAdjective]. Pasukan [FROM.GetNameDefCap] telah dimobilisasi, dan ditempatkan di kawasan itu demi menangkal invasi. Bagaimana kita harus menanggapi provokasi ini?"
 wuw_GER_diplomacy.62.a: "Kita tidak akan berkompromi atas kebebasan rakyat kita!"
 wuw_GER_diplomacy.62.b: "Kita sungguh sebaiknya tidak memperkeruh situasi ini..."
 wuw_GER_diplomacy.63.t: "[FROM.GetNameDefCap] Merebut [912.GetName]"
 wuw_GER_diplomacy.63.desc: "\nTuan kita [FROM.GetLeader] telah menetapkan bahwa Schleswig Utara adalah dan akan selalu menjadi milik [FROM.GetAdjective]. Pasukan [FROM.GetNameDefCap] telah bergerak memasuki wilayah tersebut, dan para administrator lokal baru mereka telah memaksa politisi kita menandatangani undang-undang peminjaman wilayah tersebut kepada mereka selama 100 tahun ke depan."
 wuw_GER_diplomacy.63.a: "Sayangnya tidak banyak yang bisa kita perbuat untuk menghentikan mereka..."
 GER_seized_north_schleswig: "Jerman Merebut Schleswig Utara"
 wuw_GER_chinese_diplomacy.1.t: "[FROM.GetNameDefCap] Mengirimi Kita Senjata dan Perlengkapan"
 wuw_GER_chinese_diplomacy.1.desc: "\nSekutu agung kita di barat, pihak [FROM.GetAdjective]s, telah mengirimi kita kiriman senjata dan amunisi. Namun tidak hanya itu, mereka juga mengirim sekelompok insinyur dan industrialis yang akan membantu kita mengembangkan persenjataan kita sendiri agar ekonomi militer kita dapat bangkit kembali setelah berabad-abad masa penghinaan."
 wuw_GER_chinese_diplomacy.1.a: "Ini akan sangat berguna"
 wuw_GER_chinese_diplomacy.2.t: "[FROM.GetNameDefCap] Menawarkan Bantuan Industri sebagai Imbalan atas Hak Sumber Daya"
 wuw_GER_chinese_diplomacy.2.desc: "\nSekutu agung kita di barat, pihak [FROM.GetAdjective]s, telah mengirim sebuah delegasi kepada kita. Delegasi tersebut menyatakan siap menanamkan investasi ke dalam industri kita, sebagai imbalan atas hak kesepakatan dagang yang lebih baik terkait sumber daya alam kita. Mereka sungguh sahabat yang berharga untuk dimiliki."
 wuw_GER_chinese_diplomacy.2.a: "Sungguh seorang sahabat sejati"
 wuw_GER_chinese_diplomacy.2.b: "Kita tidak bisa menyerahkan sumber daya alam kita"
 wuw_GER_chinese_diplomacy.3.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_chinese_diplomacy.3.desc: "\nDelegasi kita telah kembali membawa kabar yang luar biasa. Mereka menyatakan bahwa pemerintah [FROM.GetAdjective] dengan senang hati menandatangani kesepakatan yang kita usulkan kepada mereka, dan bahwa pakta tersebut akan segera berlaku. Dengan demikian kita telah berhasil memperoleh akses ke sumber daya alam mereka dengan biaya kecil berupa bantuan industrialisasi bagi mereka."
 wuw_GER_chinese_diplomacy.3.a: "Bagus"
 wuw_GER_chinese_diplomacy.4.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_chinese_diplomacy.4.desc: "\nDelegasi kita telah kembali membawa kabar yang mengecewakan. Mereka menyatakan bahwa pemerintah [FROM.GetAdjective] menolak menandatangani kesepakatan tersebut, mengklaim bahwa kita berusaha mengeksploitasi mereka di balik kedok bantuan industri."
 wuw_GER_chinese_diplomacy.4.a: "Sungguh mengecewakan"
 wuw_GER_diplomacy.64.t: "[FROM.GetNameDefCap] Menawarkan Perlindungan sebagai Imbalan Upeti"
 wuw_GER_diplomacy.64.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita menawarkan perlindungan terhadap ancaman dari timur. Namun perlindungan ini tidak cuma-cuma, karena dinyatakan bahwa kita harus membayar sejumlah upeti kepada pihak [FROM.GetAdjective]s jika menginginkan perlindungan."
 wuw_GER_diplomacy.64.a: "Jika memang itu yang diperlukan"
 wuw_GER_diplomacy.64.b: "Biayanya terlalu mahal untuk diterima..."
 wuw_GER_diplomacy.65.t: "[FROM.GetNameDefCap] Menerima Syarat Kita"
 wuw_GER_diplomacy.65.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi tawaran kita, menyatakan bahwa demi mengamankan masa depan [FROM.GetAdjective], syarat-syarat kita akan dipenuhi, dan pembayaran yang diminta akan segera dilaksanakan."
 wuw_GER_diplomacy.65.a: "Semuanya berjalan sesuai rencana!"
 wuw_GER_diplomacy.66.t: "[FROM.GetNameDefCap] Menolak Syarat Kita"
 wuw_GER_diplomacy.66.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi tawaran kita, menyatakan bahwa syarat perlindungan kita terlalu berat, dan biaya yang dibebankan terlalu tinggi. Mereka dapat bertahan sendiri, dan tidak membutuhkan bantuan tentara tiruan Prusia."
 wuw_GER_diplomacy.66.a: "Sudahlah"
 wuw_GER_diplomacy.66.b: "Mereka tetap membutuhkan perlindungan, meski menolak membayarnya!"
 wuw_GER_diplomacy.67.t: "[FROM.GetNameDefCap] Menawarkan Pakta Rahasia"
 wuw_GER_diplomacy.67.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita secara rahasia menawarkan pembagian wilayah tetangga kita bersama-sama, dalam pakta yang akan membawa kita bersekutu satu sama lain dan menetapkan lingkup pengaruh di wilayah Tanah Rendah. Haruskah kita menerima tawaran mencurigakan ini?"
 wuw_GER_diplomacy.67.a: "Ini tentu akan menguntungkan kita"
 wuw_GER_diplomacy.67.b: "Ini tidak beretika!"
 wuw_GER_diplomacy.68.t: "[FROM.GetNameDefCap] Menyetujui Pakta Ini"
 wuw_GER_diplomacy.68.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi tawaran kita, menyatakan bahwa demi menjamin masa depan [FROM.GetAdjective], mereka menyetujui pakta ini dan akan menetapkan lingkup pengaruh."
 wuw_GER_diplomacy.68.a: "Maka tibalah saatnya menyerang!"
 wuw_GER_diplomacy.68.b: "Kabar baik. Namun kita harus tetap bersabar"
 wuw_GER_diplomacy.69.t: "[FROM.GetNameDefCap] Menolak Pakta Ini"
 wuw_GER_diplomacy.69.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi tawaran kita, menyatakan bahwa gagasan membagi-bagi wilayah tetangga dan menikam mereka dari belakang terasa tidak benar, dan bahwa kita sebaiknya mencari sekutu di tempat lain jika ingin menjadi agresor dalam konflik di masa depan."
 wuw_GER_diplomacy.69.a: "Kita terpaksa harus mencari sekutu lain"
 warning_they_may_instead_apporach_our_neighbor_tt: "§R[FROM.GetNameDefCap] may instead approach our Neighbor§!"
 wuw_GER_diplomacy.70.t: "[FROM.GetNameDefCap] Mencampuri Politik Kita"
 wuw_GER_diplomacy.70.desc: "Para juru propaganda [FROM.GetAdjective] baru-baru ini mulai memengaruhi rakyat kita dan menarik mereka ke pihak mereka, menjanjikan masa depan cerah jika kita bersedia bergabung dengan negara mereka sebagai sekutu. Ini belum tentu merupakan ancaman bagi kemerdekaan kita, namun jelas merupakan tindakan agresi terhadap pemerintahan kita saat ini, dengan banyaknya surat kabar yang baru dibagikan menyuarakan kelemahan yang melekat dalam sistem kita. Mungkin kita memang membutuhkan sahabat baru di dunia, kendati ini kemungkinan besar bukanlah yang terakhir kita dengar dari [FROM.GetLeader] dan antek-antek [FROM.GetLeader.GetHerHis]."
 wuw_GER_diplomacy.70.a: "Bukan gagasan yang buruk, kita bisa memanfaatkan sekutu baru"
 wuw_GER_diplomacy.70.b: "Tidak ada kerja sama dengan pihak [FROM.GetAdjective]s, bungkam juru propaganda ini segera!"
 wuw_GER_diplomacy.71.t: "Pembentukan Volkskommissariat [ROOT.GetNonIdeologyName]"
 wuw_GER_diplomacy.71.desc: "Menyusul perkembangan peristiwa terkini, telah diputuskan bahwa negara kita akan diubah menjadi sebuah Volkskommissariat. Dalam praktiknya, ini berarti negara kita akan berada di bawah kedaulatan [FROM.GetNameDef] dan diperintah oleh boneka-boneka mereka. Kendati ini jelas merupakan hari kelam bagi rakyat kita, kita harus mempertimbangkan fakta bahwa di bawah perlindungan mereka bangsa kita mungkin dapat makmur."
 wuw_GER_diplomacy.71.a: "Ini demi kepentingan terbaik rakyat kita."
 wuw_GER_diplomacy.72.t: "Pengaruh Komunis dari [FROM.GetNameDef]"
 wuw_GER_diplomacy.72.desc: "Telah menjadi perhatian kita bahwa saat ini terdapat sel-sel [FROM.GetAdjective] yang aktif di negara kita menyebarkan sentimen komunis. Meski hal ini tampaknya cukup tidak berbahaya, beberapa materi propaganda tampak bersifat revolusioner. Laporan tentang kaum buruh yang didorong untuk berorganisasi dan bersatu kian sering terdengar, dan berkaca dari sejarah terkini, kita tidak dapat memastikan bahwa ini bukanlah muslihat terencana dari kepemimpinan [GER.GetAdjective] untuk mencaplok kita pada akhirnya."
 wuw_GER_diplomacy.72.a: "Kita tidak memiliki alasan untuk mencurigai mereka"
 wuw_GER_diplomacy.72.a_tt: "§RJika para Pendukung Komunis memenangkan perang saudara, [FROM.GetNameWithFlag] mungkin akan berupaya menaklukkan kita!§!"
 wuw_GER_diplomacy.72.b: "Kita tidak akan tertipu oleh muslihat ini!"
 wuw_GER_diplomacy.73.t: "[FROM.GetNameDefCap] Mengizinkan Kita Memperkuat Sentimen Komunis."
 wuw_GER_diplomacy.73.desc: "Agen-agen kita yang beroperasi di [FROM.GetNameDef] untuk memperkuat pergerakan komunis telah diketahui oleh kepemimpinan negara tersebut. Syukurlah mereka tampaknya sebagian besar tidak acuh terhadap semakin banyaknya rakyat yang mendukung perjuangan kaum proletar dan kita dapat melanjutkan upaya kita."
 wuw_GER_diplomacy.73.a: "Demi Kaum Proletar!"
 wuw_GER_diplomacy.74.t: "[FROM.GetNameDefCap] Melarang Operasi Pengaruh Politik"
 wuw_GER_diplomacy.74.desc: "Agen-agen kita yang beroperasi di [FROM.GetNameDef] untuk memperkuat pergerakan komunis telah diketahui oleh kepemimpinan negara tersebut. Kita telah menerima surat keras dari mereka yang menuntut agar kita menghentikan operasi ini seketika. Tampaknya niat baik kita memberi tahu hak-hak kaum buruh telah menyingkap sisi sejati [FROM.GetLeader] sebagai musuh rakyat jelata."
 wuw_GER_diplomacy.74.a: "Kita harus membebaskan kawan-kawan [FROM.GetAdjective] kita!"
 wuw_GER_diplomacy.75.t: "Perang Saudara di [ROOT.GetNameDef]"
 wuw_GER_diplomacy.75.desc: "Setelah sekian lama sentimen komunis berkembang, tampaknya kaum proletar [ROOT.GetAdjective] telah jenuh menunggu perubahan pemerintahan secara damai. Menyusul perselisihan sengit, tampaknya diplomasi telah runtuh dan konflik bersenjata pun berkobar."
 wuw_GER_diplomacy.75.a: "Demi Kaum Proletar!"
 wuw_GER_diplomacy.75.b: "Kita harus menghentikan kebodohan ini!"
 wuw_GER_diplomacy.76.t: "[FROM.GetNameDefCap] Menuntut Kita Tunduk"
 wuw_GER_diplomacy.76.desc: "Setelah perang saudara akhirnya mereda, [FROM.GetNameDef] kembali kepada kita untuk menuntut ketundukan kita. Kita telah menduga hal ini akan datang tetapi memilih untuk mengabaikannya sebagai sarana mendapatkan bantuan mereka demi menggulingkan pemerintahan sebelumnya. Sejauh ini mereka terbukti cukup ramah terhadap kita, sehingga ada harapan bahwa ini mungkin tidak akan terlalu buruk bagi kita."
 wuw_GER_diplomacy.76.a: "Itulah harga yang harus kita bayar."
 wuw_GER_diplomacy.77.t: "[FROM.GetNameDefCap] Menuntut Kita Menggelar Referendum untuk Bergabung dengan Mereka"
 wuw_GER_diplomacy.77.desc: "Tetangga kita di utara telah melayangkan tuntutan agar kita menggelar referendum untuk bergabung dengan mereka. Menyatakan bahwa bangsa kita sangat mirip dengan mereka dan pantas hidup bersatu, mereka mengisyaratkan bahwa kita harus tunduk kepada mereka. Kita masih akan diberi sedikit tingkat kebebasan, namun antara lain kebijakan luar negeri kita akan dipantau dan diatur oleh pihak [FROM.GetAdjective]s."
 wuw_GER_diplomacy.77.a: "Mengapa tidak?"
 wuw_GER_diplomacy.77.b: "Sama sekali tidak!"
 wuw_GER_diplomacy.78.t: "[FROM.GetNameDefCap] Menyerah dan Tunduk"
 wuw_GER_diplomacy.78.desc: "Menyusul kemenangan bagi kaum [FROM.GetAdjective]s yang ingin bergabung dengan kita dalam referendum baru-baru ini, kepemimpinan [FROM.GetNameDef] telah kembali kepada kita dengan tanggapan positif. Mulai detik ini mereka akan menundukkan diri kepada kita demi kebaikan rakyat kita."
 wuw_GER_diplomacy.78.a: "Hari yang layak dirayakan!"
 wuw_GER_diplomacy.79.t: "Kepemimpinan [FROM.GetNameDefCap] Menolak Bergabung dengan Kita"
 wuw_GER_diplomacy.79.desc: "Tanggapan negatif dari kepemimpinan [FROM.GetAdjective] telah sampai kepada kita terlalu cepat untuk meyakini bahwa referendum benar-benar sempat digelar. Kendati ada indikasi jelas bahwa rakyat mereka akan bernasib jauh lebih baik di bawah kepemimpinan kita yang kukuh, [FROM.GetLeader] justru memilih kekuasaan [FROM.GetLeader.GetHerHis] sendiri alih-alih yang terbaik bagi rakyat [FROM.GetLeader.GetHerHis]."
 wuw_GER_diplomacy.79.a: "Kita harus membebaskan mereka!"
 wuw_GER_diplomacy.80.t: "[FROM.GetNameDefCap] Menanam Modal di Industri Kita"
 wuw_GER_diplomacy.80.desc: "Investasi dalam jumlah besar telah ditanamkan oleh pemerintah [FROM.GetAdjective] demi mengangkat industri kita ke standar yang sama dengan milik mereka. Mereka menyajikan hal ini sebagai kesepakatan yang saling menguntungkan: kita, sebagai sebuah negara, memperoleh industri yang lebih maju, dan seiring meningkatnya kapasitas kita, mereka pun dapat memanfaatkannya."
 wuw_GER_diplomacy.80.a: "Bagus!"
 wuw_GER_diplomacy.81.t: "Integrasi [ROOT.GetNameDef]"
 wuw_GER_diplomacy.81.desc: "Masa kita sebagai Volkskommissariat telah berakhir. Kepemimpinan [FROM.GetAdjective] sangat puas dengan upaya kita dan kini memandang negeri kita lebih dari sekadar negara bawahan. Karena itu, mereka ingin memberi penghargaan dengan mengizinkan kita menjadi bagian dari negara adidaya mereka alih-alih sekadar daerah taklukan. Tentu saja ini berarti kita tidak lagi memiliki kemerdekaan apa pun, namun mereka meyakinkan bahwa mereka akan merawat rakyat kita dengan baik."
 wuw_GER_diplomacy.81.a: "Nyaris bukan sebuah penghargaan, namun apa pilihan kita?"
 wuw_GER_diplomacy.82.t: "Dukungan [FROM.GetAdjective] bagi Pemberontakan"
 wuw_GER_diplomacy.82.desc: "Kawan-kawan kita di [FROM.GetNameDef] telah mengirimi kita kiriman senapan untuk membantu perjuangan kita melawan kapitalisme dan kaum borjuis. Bantuan ini kemungkinan besar akan menuntut bayaran di kemudian hari, namun siapakah kita yang berani menolak bantuan mereka?"
 wuw_GER_diplomacy.82.a: "Manfaatkan senapan-senapan ini dengan baik!"
 wuw_GER_diplomacy.83.t: "[GER.GetNameDefCap] Mengundang Kita ke [GER.GetFactionName]"
 wuw_GER_diplomacy.83.desc: "Menyusul keberhasilan kita dalam perang saudara dan peralihan berikutnya menuju komunisme, [GER.GetNameDef] telah mengulurkan tangan persahabatan kepada kita. Seberapa besar andil sesungguhnya dari dukungan yang kita terima dari kaum [GER.GetAdjective]s sebaiknya tak perlu diungkit. Karena kini kita memiliki ideologi yang serupa, mereka telah menyampaikan tawaran ini kepada kita, meski seberapa besar kebebasan memilih yang sesungguhnya kita miliki dalam hal ini masih belum sepenuhnya jelas."
 wuw_GER_diplomacy.83.a: "Tentu saja kita akan bergabung"
 wuw_GER_diplomacy.83.b: "Kita lebih suka berdiri sendiri."
 wuw_GER_diplomacy.84.t: "Permintaan [FROM.GetNameDefCap] untuk Solidaritas Proletar yang Lebih Besar"
 wuw_GER_diplomacy.84.desc: "[GetIsRootProletarianSubject]"
 GER_root_is_proletarian_subject: "Karena negara kita kini secara sah dipimpin oleh perwakilan kaum buruh dan proletar, pihak [FROM.GetAdjective]s telah menghubungi kita. Mereka berbicara tentang apa yang disebut Solidaritas Proletar dan bagaimana kita sebagai bawahan mereka harus menyumbangkan sebagian dari industri kita kepada mereka sebagai imbalan atas bantuan mereka dalam membangun negeri kita."
 GER_root_not_proletarian_subject: "Karena negara kita kini secara sah dipimpin oleh perwakilan kaum buruh dan proletar, pihak [FROM.GetAdjective]s telah menghubungi kita. Mereka berbicara tentang solidaritas antarnegara komunis demi meningkatkan taraf hidup rakyat kita. Membuka perdagangan antarsesama negara kita dapat menguntungkan kaum buruh di kedua negara, sekaligus mencegah pengaruh dari negara-negara kapitalis yang akan merongrong sistem politik yang telah kita bangun dengan susah payah."
 wuw_GER_diplomacy.84.a: "Kita setuju, Solidaritas untuk semua!"
 wuw_GER_diplomacy.84.b: "Ini kedengarannya lebih menguntungkan mereka."
 wuw_GER_diplomacy.85.t: "[FROM.GetNameDefCap] Menuntut Kita Berintegrasi"
 wuw_GER_diplomacy.85.desc: "Tuntutan bernada keras dari pihak [FROM.GetAdjective] telah sampai kepada kita. Mereka menganggap kerja sama kita saat ini, kendati menguntungkan, belumlah memadai. Solusi mereka adalah menuntut kita berintegrasi ke dalam [FROM.GetNameDef]. Meski tidak disebutkan konsekuensi penolakan, kita hanya bisa berasumsi bahwa menolak bukanlah langkah yang boleh diambil begitu saja."
 wuw_GER_diplomacy.85.a: "Kita tidak memiliki pilihan"
 wuw_GER_diplomacy.85.b: "Jika kita harus bertempur, kita akan bertempur!"
 wuw_GER_diplomacy.86.t: "[FROM.FROM.GetNameDefCap] Menyerahkan Wilayah dalam Lingkup Pengaruh Kita"
 wuw_GER_diplomacy.86.desc: "Hari ini kita menerima kabar yang paling dinanti-nantikan: setelah menguasai tanah [FROM.GetAdjective] yang berada dalam Lingkup Pengaruh kita, [FROM.FROM.GetNameDef] telah memutuskan untuk menghormati kesepakatan kita. Wilayah di dalam Lingkup Pengaruh kita telah diserahkan ke dalam kepemilikan kita."
 wuw_GER_diplomacy.86.a: "Bagus!"
 wuw_GER_diplomacy.87.t: "Menghormati Lingkup Pengaruh"
 wuw_GER_diplomacy.87.desc: "Sebagai hasil dari kemenangan kita dalam perang terbaru, ada keputusan yang harus kita buat. Sebagian tanah yang kita taklukkan tidak berada di dalam lingkup pengaruh kita. Sesuai kesepakatan, kita harus menyerahkan wilayah-wilayah ini. Namun demikian, perjanjian itu tidak pernah tertulis di atas kertas, sehingga seseorang dapat berargumen bahwa kesepakatan itu tidaklah mengikat..."
 wuw_GER_diplomacy.87.a: "Kita harus menghormati kesepakatan itu!"
 wuw_GER_diplomacy.87.b: "Kita merebut tanah itu dengan adil dan sah!"
 wuw_GER_diplomacy.88.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah dalam Lingkup Pengaruh Kita"
 wuw_GER_diplomacy.88.desc: "Hari ini kita menerima kabar yang paling dinanti-nantikan: setelah menguasai tanah [FROM.GetAdjective] yang berada dalam Lingkup Pengaruh kita, [FROM.FROM.GetNameDef] telah memutuskan untuk menghormati kesepakatan kita. Wilayah di dalam Lingkup Pengaruh kita telah diserahkan ke dalam kepemilikan kita."
 wuw_GER_diplomacy.88.a: "Bagus!"
 wuw_GER_diplomacy.89.t: "[FROM.GetNameDefCap] Menetapkan Lingkup Pengaruh"
 wuw_GER_diplomacy.89.desc: "[FROM.GetNameDefCap] telah memberi tahu kita bahwa mereka telah menetapkan Lingkup Pengaruh. Meskipun hal ini tidak secara langsung berdampak pada kita karena tidak ada perjanjian formal, ini adalah sesuatu yang perlu kita waspadai. Mereka mungkin mencoba memaksakan hal ini kepada kita atau menuntut wilayah dari kita andai kita menguasainya kelak."
 wuw_GER_diplomacy.89.a: "Baiklah kalau begitu..."
 wuw_GER_diplomacy.89.b: "Tidak dapat diterima"
 wuw_GER_diplomacy.90.t: "[FROM.GetNameDefCap] Meminta Pakta Non-Agresi"
 wuw_GER_diplomacy.90.desc: "[FROM.GetLeader] telah menghubungi kita dengan sebuah permintaan. [FROM.GetLeader.GetSheHe] ingin menandatangani pakta non-agresi bersama kita, mempertegas gagasan bahwa kendati kita mungkin bukan sekutu sejati, kita jelas bukanlah musuh. Pakta semacam ini memang membatasi kebebasan kita bertindak jika kita sampai berselisih dengan pihak [FROM.GetAdjective]s, namun hal ini juga berpotensi meminimalkan risiko terjadinya hal seperti itu."
 wuw_GER_diplomacy.90.a: "Ini akan memperkuat kita!"
 wuw_GER_diplomacy.90.b: "Kita tidak bisa mengikatkan diri kepada mereka."
 wuw_GER_diplomacy.91.t: "[FROM.GetNameDefCap] Menyatakan Keinginan untuk Menyelaraskan Diri"
 wuw_GER_diplomacy.91.desc: "Kita baru saja menerima pesan dari kepemimpinan [FROM.GetAdjective] bahwa mereka ingin menyelaraskan diri dengan doktrin politik kita. Mereka berharap ini dapat menjadi landasan baik bagi kerja sama berkelanjutan di masa depan namun menegaskan bahwa rencana tersebut belum perlu dilaksanakan sekarang. Ini adalah kesempatan emas bagi kita untuk memengaruhi elite politik mereka."
 wuw_GER_diplomacy.91.a: "Kita tahu sosok yang tepat..."
 wuw_GER_diplomacy.92.t: "[FROM.GetNameDefCap] Menyetujui Penyelarasan Kita"
 wuw_GER_diplomacy.92.desc: "Tanggapan dari kawan-kawan kita di [FROM.GetNameDef] sangat positif. Mereka menyambut baik penyelarasan kita dengan doktrin politik mereka dan berbagi harapan yang sama akan hubungan kerja yang baik di masa depan. Mengenai cara terbaik melaksanakannya, mereka memiliki usulan agar transisi ini berlangsung lebih mudah dan cepat. Mereka menyarankan agar kita mengganti pemimpin politik kita; kendati Ernst Thälmann jelas pemimpin yang cakap, mereka meyakini bahwa Walter Ulbricht dapat memberikan fondasi yang lebih baik bagi kerja sama masa depan kita."
 wuw_GER_diplomacy.92.a: "Ulbricht sama cakapnya, kita akan beralih."
 wuw_GER_diplomacy.92.b: "Tidak, kita tidak akan membiarkan mereka ikut campur!"
 wuw_GER_diplomacy.93.t: "[FROM.GetNameDef] Mengangkat Walter Ulbricht"
 wuw_GER_diplomacy.93.desc: "Cukup mengejutkan, kepemimpinan [FROM.GetAdjective] bersedia mengganti Ernst Thälmann. Mereka melakukan pergantian ini demi membina hubungan baik dengan kita, dan demi memastikan agenda politik kita cukup sejalan sehingga kerja sama kita berlangsung tanpa gesekan. Ini harus dianggap sebagai sebuah keberhasilan!"
 wuw_GER_diplomacy.93.a: "Bagus!"
 wuw_GER_diplomacy.94.t: "[FROM.GetNameDefCap] Menolak Mengganti Ernst Thälmann"
 wuw_GER_diplomacy.94.desc: "Kendati saran kita merupakan upaya paling tulus demi membantu kawan-kawan [FROM.GetAdjective] kita, mereka dengan keras kepala menolak mendengarkan nasihat kita. Tampaknya mereka menganggap usulan itu sebagai upaya mencampuri politik mereka, meski sama sekali bukan itu niat kita."
 wuw_GER_diplomacy.94.a: "Kaum [FROM.GetAdjective]s yang keras kepala..."
 wuw_GER_diplomacy.95.t: "Usulan Kerja Sama Industri"
 wuw_GER_diplomacy.95.desc: "Kepemimpinan [FROM.GetAdjective] telah mendatangi kita dengan usulan Kerja Sama Industri antarkedua negara kita. Saran mereka merinci bagaimana kita dapat meningkatkan dan memperluas upaya industri kita bersama-sama. Apakah kita benar-benar akan diuntungkan dari hal ini, ataukah ini semata-mata hal yang hanya menguntungkan pihak [FROM.GetAdjective]s, masih harus kita buktikan."
 wuw_GER_diplomacy.95.a: "Kedengarannya cukup adil"
 wuw_GER_diplomacy.95.b: "Mereka pasti mengira kita bodoh."
 wuw_GER_diplomacy.96.t: "[FROM.GetNameDefCap] Menyetujui Kerja Sama Industri"
 wuw_GER_diplomacy.96.desc: "Tanggapan atas usulan kita kepada pihak [FROM.GetAdjective]s untuk Kerja Sama Industri telah disetujui. Di masa depan kita akan menikmati kerja sama dalam memperluas dan mengefektifkan industri kita."
 wuw_GER_diplomacy.96.a: "Bagus!"
 wuw_GER_diplomacy.97.t: "[FROM.GetNameDefCap] Menolak Usulan Kita"
 wuw_GER_diplomacy.97.desc: "Usulan kita kepada pihak [FROM.GetAdjective]s telah ditolak mentah-mentah. Kendati kesepakatan tersebut sangat menguntungkan baik bagi kita maupun mereka, mereka menolak mendengarkan kita. Walau rencana ini gagal, kita masih dapat mencapai sebagian dari apa yang telah kita rencanakan. Kita masih dapat mengefektifkan ekspansi industri kita sendiri."
 wuw_GER_diplomacy.97.a: "Maka kita akan berekspansi sendiri."
 wuw_GER_diplomacy.98.t: "[FROM.GetNameDefCap] Mengundang Kita ke Inisiatif Berbagi Teknologi"
 wuw_GER_diplomacy.98.desc: "Kawan-kawan kita di [FROM.GetNameDef] baru-baru ini menghubungi kita mengenai kemungkinan pembentukan inisiatif untuk menyatukan pengetahuan kita mengenai industri dan produksi. Kita akan membagikan pengetahuan kita kepada mereka, dan sebagai imbalannya, mereka akan membagikan pengetahuan mereka kepada kita. Semuanya dapat memberikan manfaat bagi kaum buruh dan lini produksi kita."
 wuw_GER_diplomacy.98.a: "Ini adalah inisiatif yang luar biasa"
 wuw_GER_diplomacy.98.b: "Mereka tidak dapat dipercaya."
 wuw_GER_diplomacy.99.t: "[FROM.GetNameDefCap] Bergabung dengan Inisiatif Berbagi Teknologi."
 wuw_GER_diplomacy.99.desc: "Sangat memuaskan kita, tampaknya pihak [FROM.GetAdjective]s telah melihat manfaat dari kelompok berbagi teknologi yang kita usulkan. Mulai sekarang kita akan memiliki akses ke pengetahuan mereka, sebagaimana mereka memiliki akses ke milik kita. Kita semestinya akan melihat kemajuan besar dalam bidang industri dan produksi sebagai hasilnya."
 wuw_GER_diplomacy.99.a: "Bagus"
 wuw_GER_diplomacy.101.t: "[FROM.GetNameDefCap] Menolak Inisiatif Berbagi Teknologi"
 wuw_GER_diplomacy.101.desc: "Kendati keuntungan nyata terbuka bagi semua pihak, [FROM.GetNameDef] menolak bergabung dengan inisiatif berbagi teknologi kita. Menyatakan bahwa kita tidak dapat dipercaya untuk memegang teknologi mereka, mereka menolak tawaran kita dan meminta agar kita tidak lagi mengajukan kebodohan semacam itu kepada mereka."
 wuw_GER_diplomacy.101.a: "Kaum [FROM.GetAdjective]s yang tidak masuk akal..."
 wuw_GER_diplomacy.102.t: "[FROM.GetNameDefCap] Menyetujui Pakta Non-Agresi"
 wuw_GER_diplomacy.102.desc: "Permintaan kita untuk memberlakukan pakta non-agresi dengan [FROM.GetNameDef] telah disetujui. Mulai sekarang kita berdua akan menahan diri dari agresi terhadap satu sama lain. Kita yakin bahwa hal ini akan sangat menguntungkan kedua bangsa kita."
 wuw_GER_diplomacy.102.a: "Bagus"
 wuw_GER_diplomacy.103.t: "[FROM.GetNameDefCap] Menolak Pakta Non-Agresi"
 wuw_GER_diplomacy.103.desc: "Kendati membawa keuntungan nyata bagi kita berdua, [FROM.GetNameDef] telah menolak usulan Pakta Non-Agresi. Kita tidak mengetahui apa alasan di balik ini, namun penolakan mereka cukup mengkhawatirkan. Kita akan mengawasi mereka dengan cermat."
 wuw_GER_diplomacy.103.a: "Mengkhawatirkan"
 wuw_GER_diplomacy.104.t: "[FROM.GetNameDefCap] Menyetujui Penetapan Lingkup Pengaruh"
 wuw_GER_diplomacy.104.desc: "Kita telah menerima kabar dari pihak [FROM.GetAdjective]s bahwa mereka menyetujui gagasan penetapan Lingkup Pengaruh kita. Ini akan mencegah permusuhan dan memperkecil risiko konflik atas tanah di kawasan sekitar kita."
 wuw_GER_diplomacy.104.a: "Bagus!"
 wuw_GER_diplomacy.105.t: "[FROM.GetNameDefCap] Menolak Penetapan Lingkup Pengaruh"
 wuw_GER_diplomacy.105.desc: "Kita telah menerima kabar dari pihak [FROM.GetAdjective]s bahwa mereka menolak mengakui dan menerima lingkup pengaruh kita; sedangkan untuk wilayah mereka sendiri, mereka menyatakan akan menentukan lingkup pengaruh mereka sendiri tanpa campur tangan dari pihak kita. Hal ini dapat memicu sejumlah ketegangan di kawasan tersebut."
 wuw_GER_diplomacy.105.a: "Sungguh Kasar!"
 wuw_GER_diplomacy.107.t: "Pihak [FROM.GetAdjective]s Menawarkan Industri untuk Sumber Daya"
 wuw_GER_diplomacy.107.desc: "Kita telah menerima tawaran dari [FROM.GetNameDef]. Mereka berminat dalam perdagangan sumber daya jangka panjang sebagai imbalan atas relokasi sebagian industri mereka. Saat ini mereka mengincar sumber daya di [FROM.FROM.GetName] yang sebagian darinya ingin mereka peroleh."
 wuw_GER_diplomacy.107.a: "Mengapa tidak?"
 wuw_GER_diplomacy.107.b: "Saat ini bukanlah waktu yang tepat"
 wuw_GER_diplomacy.107.c: "Tawaran yang tidak adil, jangan pernah mengusulkan hal ini lagi!"
 wuw_GER_diplomacy.108.t: "Persetujuan [FROM.GetAdjective] atas Relokasi Industri"
 wuw_GER_diplomacy.108.desc: "Kita telah menerima kabar dari pihak [FROM.GetAdjective]s mengenai permintaan kita untuk merelokasi industri sebagai imbalan atas sebagian sumber daya mereka. Tampaknya kita sepakat mengenai manfaat dari kesepakatan ini dan mereka dengan senang hati menyetujuinya. Kita akan segera menerima sumber daya tersebut."
 wuw_GER_diplomacy.108.a: "Bagus"
 wuw_GER_diplomacy.109.t: "Pihak [FROM.GetAdjective] Menolak Kesepakatan Relokasi Industri"
 wuw_GER_diplomacy.109.desc: "Kendati sebagian besar bersikap netral terhadap kesepakatan yang kita ajukan, pihak [FROM.GetAdjective]s pada akhirnya memilih untuk menolak usulan kita merelokasi industri kepada mereka sebagai imbalan atas sumber daya. Mereka berdalih bahwa saat ini bukanlah waktu yang tepat, mengisyaratkan bahwa kita mungkin dapat mencapai kesepakatan di masa depan setelah mempererat hubungan kita lebih jauh."
 wuw_GER_diplomacy.109.a: "Jika awalnya tidak berhasil..."
 wuw_GER_diplomacy.110.t: "Pihak [FROM.GetAdjective] Menolak Keras Kesepakatan Relokasi Industri"
 wuw_GER_diplomacy.110.desc: "Tampaknya kesepakatan yang sangat adil yang kita ajukan kepada pihak [FROM.GetAdjective]s disambut dengan penolakan dingin. Tidak hanya itu, mereka juga memperjelas bahwa mereka tidak ingin kita menghubungi mereka mengenai hal ini lagi. Jika kita menginginkan sumber daya tersebut, kita mungkin harus mencari... cara alternatif."
 wuw_GER_diplomacy.110.a: "Kaum [FROM.GetAdjective]s yang egois..."
 GER_SOV_have_had_enough_tt: "§RMenghapus §YKeputusan§! untuk Merelokasi Industri ke §Y[SOV.GetNameWithFlag]§! sebagai Imbalan atas Sumber Daya§!"
 wuw_GER_diplomacy.111.t: "Perjanjian Pengembangan Hubungan Ekonomi"
 wuw_GER_diplomacy.111.desc: "Para diplomat dari [FROM.GetNameDef] bersikeras agar kita menandatangani usulan Perjanjian Jerman–Rumania untuk Pengembangan Hubungan Ekonomi antarkedua Negara. Mereka mengklaim bahwa perjanjian ini akan menguntungkan kedua negara karena mereka membutuhkan sumber daya alam kita bagi industri mereka dan kita mendapatkan harga yang lebih baik untuk persenjataan Jerman. Kesepakatan ini tidak tampak menguntungkan bagi kita seperti yang diklaim pihak Jerman, namun menolak mereka niscaya akan memicu kemarahan mereka..."
 wuw_GER_diplomacy.111.a: "Kita tidak punya pilihan lain selain menerima..."
 wuw_GER_diplomacy.111.b: "Kita tidak bisa menerima ini, persetan dengan akibatnya!"
 wuw_GER_diplomacy.112.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang masuk akal dan memperhatikan kepentingan terbaik negara [FROM.GetLeader.GetHerHis]. Kebetulan sekali, perjanjian berat sebelah ini juga sangat menguntungkan kepentingan negara kita. Kita akan memanfaatkan tambahan sumber daya dari [FROM.GetName] dengan sebaik-baiknya."
 wuw_GER_diplomacy.113.desc: "[FROM.GetLeader] tampaknya merupakan pemimpin yang tidak masuk akal dan picik yang sama sekali tidak memedulikan apa yang terbaik bagi negara [FROM.GetLeader.GetHerHis]. Rakyat [FROM.GetAdjective] akan menderita akibat kebodohan ini."
 wuw_GER_diplomacy.113.b: "Maka terjadilah perang!"
 wuw_GER_diplomacy.117.a: "Kita tak punya harapan untuk melawan mereka..."
 wuw_GER_diplomacy.117.b: "Kita tidak akan pernah tunduk!"
 wuw_GER_diplomacy.118.t: "[FROM.GetNameDefCap] Tunduk"
 wuw_GER_diplomacy.118.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan tunduk pada kekuasaan kita, yang merupakan jalan terbaik karena mereka tidak memiliki kekuatan untuk menghentikan kita, dan pertempuran hanya akan mendatangkan kehancuran bagi tanah dan rakyat mereka."
 wuw_GER_diplomacy.119.t: "[FROM.GetNameDefCap] Menolak untuk Tunduk"
 wuw_GER_diplomacy.119.desc: "Kaum [FROM.GetAdjective]s yang keras kepala telah menolak usulan kita untuk menyatukan negara kita menjadi entitas yang lebih kuat. Inikah balasan yang kita terima setelah semua yang kita perbuat untuk mereka?"
 wuw_GER_weltpolitik.4.t: "[FROM.GetLeader] Ingin Membagi-bagi Kongo"
 wuw_GER_weltpolitik.4.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita mengenai masalah koloni [FROM.GetAdjective] yang hilang, karena mereka merasa dirampok oleh Versailles. Mereka kini menuntut agar kita menandatangani pakta dengan bangsa [GER.GetAdjective] untuk membagi Kongo ke dalam lingkup pengaruh, secara bersama-sama melayangkan tuntutan agar hal itu diwujudkan. Haruskah kita mengalah kepada mereka dan menandatangani pakta semacam itu?"
 wuw_GER_weltpolitik.4.a: "Ini adalah kesepakatan yang saling menguntungkan"
 wuw_GER_weltpolitik.4.b: "Kita tidak akan mendanai agresi ini"
 wuw_GER_weltpolitik.5.t: "[FROM.GetLeader] Menuntut Kita Menyerahkan Kongo"
 wuw_GER_weltpolitik.5.desc: "Dalam pernyataan bersama dengan [GER.GetLeader], [FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita menuntut agar kita menyerahkan Kongo kepada kedua negara yang mereka wakili. Haruskah kita melawan mereka dalam masalah ini, atau haruskah kita menyerah begitu saja, menyerahkan Kongo kepada mereka?"
 wuw_GER_weltpolitik.5.a: "Sayangnya tidak banyak yang bisa dilakukan mengenai hal ini"
 wuw_GER_weltpolitik.5.b: "Kita tidak dapat menerima hal ini"
 wuw_GER_weltpolitik.6.t: "[FROM.GetLeader] Menolak Kesepakatan"
 wuw_GER_weltpolitik.6.desc: "[FROM.GetLeader] telah menegaskan bahwa [FROM.GetLeader.GetSheHe] mewakili seluruh warga pemberani [FROM.GetNameDef] saat menyatakan bahwa mereka tidak akan mendukung gagasan gila kita untuk bersama-sama membagi wilayah Kongo, sebuah wilayah yang sama sekali tidak berbatasan dengan wilayah kita. Tampaknya keputusan ini sudah bulat dan final."
 wuw_GER_weltpolitik.6.a: "Kalau begitu seluruh wilayah itu akan menjadi milik kita!"
 wuw_GER_weltpolitik.6.b: "Kita sebaiknya tidak memaksakan kehendak lebih jauh"
 wuw_GER_weltpolitik.7.t: "[BEL.GetNameDefCap] Berencana Menyerahkan Kemerdekaan Kita"
 wuw_GER_weltpolitik.7.desc: "[BEL.GetLeader] dari [BEL.GetNameDef] telah tunduk pada tuntutan gabungan [GER.GetAdjective] dan [ENG.GetAdjective] dan telah memutuskan untuk menandatangani penyerahan bangsa kita untuk dibagi di antara mereka, yang secara praktis akan mengakhiri kemerdekaan apa pun yang saat ini kita miliki. Apakah kita benar-benar hanya akan pasrah dan menerima nasib seperti itu?"
 wuw_GER_weltpolitik.7.a: "Kita tidak sanggup melawan kehendak mereka..."
 wuw_GER_weltpolitik.7.b: "Kita tidak bisa menerima ini, angkat senjata!"
 wuw_GER_weltpolitik.8.t: "[BEL.GetNameDefCap] Bersedia Menyerahkan Kongo"
 wuw_GER_weltpolitik.8.desc: "[BEL.GetLeader] dari [BEL.GetNameDef] telah bertekuk lutut di hadapan tuntutan kita dan menyatakan bahwa wilayah Kongo akan dialihkan kepada kita berlaku seketika. Masih belum dapat dipastikan apakah rakyat dan para gubernur di Kongo akan menerima keputusan ini, namun setidaknya pihak [BEl.GetAdjective] telah mengalah."
 wuw_GER_weltpolitik.8.a: "Sempurna"
 wuw_GER_weltpolitik.9.t: "[BEL.GetNameDefCap] Menolak Menyerahkan Kongo"
 wuw_GER_weltpolitik.9.desc: "[BEL.GetLeader] dari [BEL.GetNameDef] memutuskan untuk berdiri teguh menentang tuntutan kita, menyatakan bahwa tentara [BEL.GetAdjective] tidak akan mundur menghadapi ancaman musuh, dan akan bertempur hingga tetes darah penghabisan demi mempertahankan Kongo. Mereka belum menyadari dengan siapa mereka berurusan."
 wuw_GER_weltpolitik.9.a: "Kalau begitu mereka akan kita hancurkan lebur"
 wuw_GER_weltpolitik.9.b: "Tidak perlu memaksakannya lebih lanjut"
 wuw_GER_weltpolitik.10.t: "Krisis Kongo"
 wuw_GER_weltpolitik.10.desc: "Perjanjian penyerahan telah resmi ditandatangani, dan wilayah tersebut semestinya dialihkan. Namun demikian, perlawanan bersenjata meletus di Kongo, perlawanan yang harus ditindak tegas..."
 wuw_GER_weltpolitik.10.a: "Kita akan merebutnya dengan kekuatan senjata"
 wuw_GER_weltpolitik.10.b: "Hari ini adalah hari yang gemilang"
 wuw_GER_weltpolitik.11.t: "Krisis Kongo"
 wuw_GER_weltpolitik.11.desc: "Para gubernur kita di Kongo melaporkan bahwa mereka menolak takdir yang telah kita putuskan bagi mereka, dan akan berdiri teguh mempertahankan otonomi [COG.GetAdjective]. Kita harus menumpas perlawanan mereka agar mereka tidak membawa kehancuran bagi bangsa kita, terutama jika [ENG.GetNameDef] dan [GER.GetNameDef] memandang hal ini sebagai pembangkangan terang-terangan dari pihak kita."
 wuw_GER_weltpolitik.11.a: "Kita harus membinasakan mereka demi keselamatan rakyat kita!"
 wuw_GER_chinese_diplomacy.5.t: "Program Riset Bersama Tiongkok-Jerman"
 wuw_GER_chinese_diplomacy.5.desc: "Sekutu agung kita di barat, pihak [FROM.GetAdjective], telah mengirimkan sebuah delegasi diplomatik yang memohon agar kita memulai kerja sama pengembangan teknologi baru, menjuluki program baru yang direncanakan ini sebagai 'Program Riset Bersama Tiongkok-Jerman'. Haruskah kita bergabung bersama mereka?"
 wuw_GER_chinese_diplomacy.5.a: "Sebuah inisiatif yang luar biasa!"
 wuw_GER_chinese_diplomacy.5.b: "Kita merasa hal ini tidak akan banyak membantu kita"
 wuw_GER_chinese_diplomacy.6.t: "[FROM.GetNameDefCap] Setuju untuk Bekerja Sama"
 wuw_GER_chinese_diplomacy.6.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menyetujui usulan kita, dan menyatakan minat mendalam terhadap Program Riset Bersama Tiongkok-Jerman kita. Kini, mari kita mulai pekerjaannya!"
 wuw_GER_chinese_diplomacy.6.a: "Bagus sekali"
 wuw_GER_chinese_diplomacy.7.t: "[FROM.GetNameDefCap] Menolak Bekerja Sama"
 wuw_GER_chinese_diplomacy.7.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menolak tawaran kita, mengklaim bahwa mereka sanggup mengurus diri mereka sendiri tanpa bergantung pada teknologi barat. Apa boleh buat..."
 wuw_GER_chinese_diplomacy.7.a: "Mereka tidak menyadari kesempatan emas apa yang mereka lewatkan"
 wuw_GER_weltpolitik.12.t: "[FROM.GetName] Menuntut Pengembalian Bekas Wilayah Kolonial"
 wuw_GER_weltpolitik.12.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita dengan permohonan yang menarik. Mereka meminta agar kita mengembalikan bekas wilayah kolonial lama [FROM.GetAdjective] kepada mereka sebagai imbalan atas penguatan hubungan bilateral kedua negara dan dukungan resmi mereka bagi pemerintah kita di panggung global. Ini tampak agak sepihak, namun mungkin ini pilihan terbaik?"
 wuw_GER_weltpolitik.12.a: "Apa pun demi sahabat kita"
 wuw_GER_weltpolitik.12.b: "Tidak, tanah itu kini milik kita"
 wuw_GER_weltpolitik.13.t: "[FROM.GetNameDefCap] Mengembalikan Koloni Kita"
 wuw_GER_weltpolitik.13.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima permohonan pengembalian bekas koloni kita, menyatakan bahwa wilayah tersebut akan lebih makmur di tangan kita. Rakyat bersuka ria merayakannya di jalan-jalan kota, seiring imperium kolonial [ROOT.GetAdjective] akhirnya kembali terpampang di peta dunia."
 wuw_GER_weltpolitik.13.a: "Imperialisme kembali bersemi!"
 wuw_GER_weltpolitik.14.t: "[FROM.GetNameDefCap] Menolak Mengembalikan Koloni Kita"
 wuw_GER_weltpolitik.14.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef] menolak mentah-mentah permohonan pengembalian bekas koloni kita, berdalih bahwa itu adalah kesepakatan berat sebelah di mana mereka hampir tidak mendapatkan keuntungan apa pun."
 wuw_GER_weltpolitik.14.a: "Tampaknya belum ditakdirkan..."
 wuw_GER_weltpolitik.15.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah kepada [GER.GetNameDefCap]"
 wuw_GER_weltpolitik.15.desc: "\n[FROM.GetLeader] dari [FROM.GetNameDef], dalam perkembangan yang mengejutkan, telah memutuskan untuk menyerahkan seluruh bekas wilayah kolonial [GER.GetAdjective] kembali kepada mereka, termasuk daerah-daerah yang selama ini kita kuasai. Sayangnya kita tidak berdaya menghentikan kesepakatan baru itu, namun setidaknya kita dapat menuntut semacam kompensasi ganti rugi dari mereka."
 wuw_GER_weltpolitik.15.a: "Kita menuntut kompensasi yang layak!"
 wuw_GER_reichskommissariats.1.t: "Kepemimpinan Belgien-Nordfrankreich"
 wuw_GER_reichskommissariats.1.desc: "Kini setelah kita membentuk administrasi sipil baru di Belgia dan Prancis Utara, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.1.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.1.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.2.t: "Kepemimpinan Niederlande"
 wuw_GER_reichskommissariats.2.desc: "Kini setelah kita membentuk administrasi sipil baru di Belanda, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.2.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.2.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.3.t: "Kepemimpinan Norwegen"
 wuw_GER_reichskommissariats.3.desc: "Kini setelah kita membentuk administrasi sipil baru di Norwegia, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.3.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.3.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.4.t: "Kepemimpinan Ukraine"
 wuw_GER_reichskommissariats.4.desc: "Kini setelah kita membentuk administrasi sipil baru di Ukraina, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.4.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.4.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.5.t: "Kepemimpinan Ostland"
 wuw_GER_reichskommissariats.5.desc: "Kini setelah kita membentuk administrasi sipil baru di Ostland, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.5.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.5.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.6.t: "Kepemimpinan Kaukasien"
 wuw_GER_reichskommissariats.6.desc: "Kini setelah kita membentuk administrasi sipil baru di Kaukasus, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.6.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.6.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.7.t: "Kepemimpinan Turkestan"
 wuw_GER_reichskommissariats.7.desc: "Kini setelah kita membentuk administrasi sipil baru di Turkestan, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.7.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.7.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.8.t: "Kepemimpinan Moskowien"
 wuw_GER_reichskommissariats.8.desc: "Kini setelah kita membentuk administrasi sipil baru di Moskow, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Reichskommissar, atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.8.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.8.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
 wuw_GER_reichskommissariats.9.t: "Status Jerman Volga"
 wuw_GER_reichskommissariats.9.desc: "[ROOT.GetLeader] secara terbuka menyuarakan keinginan untuk mengubah koloni Jerman Volga menjadi wilayah langsung Reich (Reichsgebiet) dan mengintegrasikannya sedalam mungkin. Namun, banyak administrator lokal menilai akan lebih bijak jika memerintahnya dari negara bagian yang lebih dekat. Bagaimana masalah ini harus diselesaikan?"
 wuw_GER_reichskommissariats.9.a: "Wilayah ini harus dijadikan Reichsgebiet langsung!"
 wuw_GER_reichskommissariats.9.b: "Wilayah ini harus digabungkan ke dalam Moskowien"
 wuw_GER_reichskommissariats.9.c: "Wilayah ini harus digabungkan ke dalam Turkestan"
 wuw_GER_reichskommissariats.10.t: "Status Ural Selatan"
 wuw_GER_reichskommissariats.10.desc: "Dengan direbutnya zona strategis Ural Selatan, muncul pertanyaan mengenai bagaimana kawasan ini harus dikelola. Sebagian rencana mengusulkan wilayah ini dimasukkan ke dalam Moskowien, sementara sebagian lain menyarankan agar berdiri sebagai negara sendiri, atau bahkan menjadi bagian dari Turkestan. Apa keputusan kita?"
 wuw_GER_reichskommissariats.10.a: "Wilayah ini harus menjadi Reichskommissariat tersendiri"
 wuw_GER_reichskommissariats.10.b: "Wilayah ini harus dimasukkan ke dalam Moskowien"
 wuw_GER_reichskommissariats.10.c: "Wilayah ini harus dimasukkan ke dalam Turkestan"
 wuw_GER_reichskommissariats.11.t: "Status Karelia Timur"
 wuw_GER_reichskommissariats.11.desc: "Dengan direbutnya zona strategis Karelia Timur, muncul pertanyaan mengenai bagaimana kawasan ini harus diperlakukan. Sebagian rencana menginginkan kawasan tersebut dimasukkan ke dalam Moskowien, sementara sebagian lain menyarankan wilayah itu diserahkan kepada Finlandia. Bagaimana pandangan kita?"
 wuw_GER_reichskommissariats.11.a: "Finlandia harus diberi imbalan atas pengorbanan mereka"
 wuw_GER_reichskommissariats.11.b: "Wilayah ini harus dimasukkan ke dalam Moskowien"
 wuw_GER_reichskommissariats.12.t: "Kepemimpinan Generalgouvernement"
 wuw_GER_reichskommissariats.12.desc: "Kini setelah kita membentuk administrasi sipil baru di Polandia Selatan, kita tidak hanya harus memutuskan tujuan strategis dari negara bawahan baru kita, tetapi juga siapa yang akan memimpin rakyat di kawasan ini, serta memastikan kebijakan kita diterapkan sebagaimana mestinya. Haruskah kita menempatkan seorang politisi [ROOT.GetAdjective] pada jabatan Gubernur Jenderal (Generalgouverneur), atau memanfaatkan kolaborator lokal?"
 wuw_GER_reichskommissariats.12.a: "Mereka membutuhkan seorang Pejabat Jerman"
 wuw_GER_reichskommissariats.12.b: "Mungkin lebih bijak menggunakan kolaborator lokal"
