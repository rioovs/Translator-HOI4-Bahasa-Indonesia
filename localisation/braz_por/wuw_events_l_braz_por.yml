 wuw_GER_realpolitik.1.t: "[FROM.GetNameDefCap] Mengundang Kita ke Dalam Aliansi"
 wuw_GER_realpolitik.1.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kita hari ini untuk menyampaikan sebuah tawaran persekutuan. Mereka berharap kita sudi bergabung ke dalam aliansi mereka, serta ikut serta dalam seluruh kemitraan dan persatuan yang telah disepakati sebelumnya. Maukah kita menerima tawaran ini?"
 wuw_GER_realpolitik.1.a: "Dengan rendah hati kita menerima tawaran kehormatan ini"
 wuw_GER_realpolitik.1.b: "Kita sama sekali tidak membutuhkan pertemanan mereka!"
 wuw_GER_realpolitik.2.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_realpolitik.2.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyambut sangat baik tawaran aliansi kita, dan para diplomat mereka telah tiba di negeri kita untuk menandatangani dokumen-dokumen yang diperlukan guna memfasilitasi keikutsertaan penuh mereka ke dalam persekutuan kita."
 wuw_GER_realpolitik.2.a: "Sangat bagus"
 wuw_GER_realpolitik.3.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.3.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menanggapi undangan aliansi kita dengan kemarahan besar, dan menegaskan bahwa kemitraan dalam bentuk apa pun antara kedua negara kita selamanya mustahil terjadi. Mereka mengira kita ini siapa, gerombolan penakluk bengis?"
 wuw_GER_realpolitik.3.a: "Mereka yang merugi..."
 wuw_GER_realpolitik.4.t: "[FROM.GetNameDefCap] Mengirimkan Bantuan Militer"
 wuw_GER_realpolitik.4.desc: "Pihak [FROM.GetAdjective] ingin menyokong kita dalam upaya perang kita dan telah mengirimkan sejumlah perlengkapan militer. Kendati jumlah pengirimannya terbilang kecil, setiap bantuan sangat berarti."
 wuw_GER_realpolitik.4.a: "Bantuan ini pasti akan sangat berguna"
 wuw_GER_weltpolitik.16.t: "[FROM.GetNameDefCap] Menetapkan Lingkup Pengaruh"
 wuw_GER_weltpolitik.16.desc: "[FROM.GetNameDefCap] telah memberi tahu kita bahwa mereka telah menetapkan suatu Lingkup Pengaruh resmi. Kendati hal ini tidak secara langsung berdampak pada kita karena tidak ada kesepakatan formal yang mengikat, ini adalah hal yang harus kita waspadai. Mereka mungkin akan mencoba memaksakan tatanan ini kepada kita atau menuntut wilayah dari kita seandainya wilayah tersebut jatuh ke tangan kita."
 wuw_GER_weltpolitik.16.a: "Kita akan menaklukkan dunia, bersama-sama!"
 wuw_GER_weltpolitik.16.b: "Mustahil!"
 wuw_GER_weltpolitik.17.t: "[FROM.GetNameDefCap] Menyetujui Penetapan Lingkup Pengaruh"
 wuw_GER_weltpolitik.17.desc: "Kita telah menerima kabar dari pihak [FROM.GetAdjective] bahwa mereka menyetujui gagasan penetapan Lingkup Pengaruh masing-masing. Hal ini akan mencegah timbulnya permusuhan dan memperkecil risiko konflik teritorial atas wilayah di sekitar kawasan kita."
 wuw_GER_weltpolitik.17.a: "Luar biasa!"
 wuw_GER_weltpolitik.18.t: "[FROM.GetNameDefCap] Menolak Penetapan Lingkup Pengaruh"
 wuw_GER_weltpolitik.18.desc: "Kita telah menerima kabar dari pihak [FROM.GetAdjective] bahwa mereka menolak mengakui keberadaan lingkup pengaruh kita. Sementara untuk lingkup pengaruh mereka sendiri, mereka menyatakan akan memutuskannya sendiri tanpa campur tangan dari pihak kita. Ini berpotensi menimbulkan ketegangan sengit di kawasan."
 wuw_GER_weltpolitik.18.a: "Sungguh tidak tahu adat!"
 wuw_GER_weltpolitik.19.t: "[FROM.GetNameDefCap] Menuntut Kendali atas Wilayah [ANG.GetAdjective] Kita"
 wuw_GER_weltpolitik.19.desc: "[FROM.GetLeader] yang gegabah baru-baru ini mengecam apa yang ia sebut sebagai pendudukan ilegal kita atas Angola [FROM.GetAdjective]. Kini, kita telah menerima ultimatum resmi dari pihak [FROM.GetAdjective], dan pasukan mereka mulai dikerahkan di perbatasan kita. Bagaimana kita harus menanggapi?"
 wuw_GER_weltpolitik.19.a: "Wilayah itu tidak layak dibayar dengan tetesan darah"
 wuw_GER_weltpolitik.19.b: "Kalau berani, datang dan rebut sendiri!"
 wuw_GER_weltpolitik.20.t: "[FROM.GetNameDefCap] Menyerahkan Wilayah [ANG.GetAdjective] Mereka"
 wuw_GER_weltpolitik.20.desc: "[FROM.GetLeader] yang bijaksana dari [FROM.GetNameDef] telah sepakat untuk menyerahkan wilayah mereka di Angola, dan telah memerintahkan pasukannya untuk mundur dari kawasan sengketa. Kita kembali keluar sebagai pemenang!"
 wuw_GER_weltpolitik.20.a: "Ini adalah hari kemenangan yang agung!"
 wuw_GER_weltpolitik.21.t: "[FROM.GetNameDefCap] Berdiri Teguh di Angola"
 wuw_GER_weltpolitik.21.desc: "Kendati tidak sepenuhnya mengejutkan, [FROM.GetLeader] yang keras kepala dari [FROM.GetNameDef] telah menyiagakan tentara negaranya dalam status darurat tertinggi pasca menerima ultimatum kita, dan mengirimkan utusan yang menyatakan bahwa mereka tidak akan mundur satu jengkal pun dalam sengketa ini."
 wuw_GER_weltpolitik.21.a: "Mereka akan menyesali keputusan bodoh mereka!"
 wuw_GER_weltpolitik.21.b: "Kita sebaiknya merelakan masalah ini"
 wuw_GER_realpolitik.5.t: "Persoalan [LIT.GetAdjective]"
 wuw_GER_realpolitik.5.desc: "Sebagaimana termaktub dalam Perjanjian Brest-Litovsk, tanah yang kini dikenal sebagai Lituania semestinya menjadi negara satelit di bawah naungan kita, kendati rincian pastinya belum disepakati secara menyeluruh kala itu. Kini setelah masalah ini kembali mengemuka, kita harus memutuskan: bagaimana kita akan memperlakukan [LIT.GetNameDef]?"
 wuw_GER_realpolitik.5.a: "Mereka harus diintegrasikan langsung ke dalam [ROOT.GetNameDef]"
 wuw_GER_realpolitik.5.b: "Mungkin kita dapat menjadikan mereka negara satelit kita"
 wuw_GER_realpolitik.6.t: "[FROM.GetNameDefCap] Menuntut Aneksasi Kita"
 wuw_GER_realpolitik.6.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut kita tunduk ke bawah kekuasaan mereka dan menjadi wilayah otonom di dalam naungan negara mereka, sebagaimana dahulu disepakati dalam Perjanjian Brest-Litovsk masa lampau. Haruskah kita menyerah pada tuntutan mereka?"
 wuw_GER_realpolitik.6.a: "Tidak banyak yang bisa kita lakukan untuk menghentikan mereka..."
 wuw_GER_realpolitik.6.b: "Kita tidak akan pernah menyerahkan kemerdekaan kita!"
 wuw_GER_realpolitik.7.t: "[FROM.GetNameDefCap] Menuntut Kita Menjadi Negara Klien Mereka"
 wuw_GER_realpolitik.7.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menuntut agar kita tunduk ke bawah kekuasaan mereka dan menjadi negara klien di bawah naungan mereka, sebagaimana dahulu digariskan dalam naskah Perjanjian Brest-Litovsk. Haruskah kita menyerah pada tuntutan mereka?"
 wuw_GER_realpolitik.7.a: "Tidak banyak yang bisa kita lakukan untuk membendung mereka..."
 wuw_GER_realpolitik.7.b: "Kita tidak akan pernah menyerahkan kemerdekaan kita!"
 wuw_GER_realpolitik.8.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.8.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan tunduk ke bawah kekuasaan kita, karena mereka tidak memiliki kekuatan militer untuk menghentikan kita, dan perlawanan bersenjata hanya akan membawa kehancuran yang lebih parah bagi tanah air dan rakyat mereka."
 wuw_GER_realpolitik.8.a: "Hari yang agung bagi [ROOT.GetNameDef]!"
 wuw_GER_realpolitik.9.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.9.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyatakan bahwa alasan kita menuntut ketundukan mereka hanya berlandaskan pada dokumen-dokumen usang yang tak bernilai hukum, dan secara terbuka mengecam bangsa kita secara keseluruhan. Tampaknya mereka bertekad kuat memperjuangkan kebebasan mereka seandainya harus bertempur..."
 wuw_GER_realpolitik.9.a: "Mereka akan menyesali keputusan gegabah mereka"
 wuw_GER_realpolitik.10.t: "[FROM.GetNameDefCap] Menuntut Kita Memulihkan Monarki"
 wuw_GER_realpolitik.10.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menuntut kita tunduk ke bawah kekuasaan mereka dan menjadi negara klien, sebagaimana rencana awal saat kita pertama kali menyetujui seorang pangeran von Hessen bertahta di singgasana kita pada tahun 1918. Haruskah kita mengalah pada tuntutan mereka?"
 wuw_GER_realpolitik.10.a: "Mungkin mereka sanggup melindungi kita dari ancaman [SOV.GetAdjective]"
 wuw_GER_realpolitik.10.b: "Demi semangat Sisu, kami tidak akan pernah bertekuk lutut!"
 wuw_GER_realpolitik.11.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.11.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan tunduk ke bawah kekuasaan kita, mengakui bahwa merupakan kekeliruan fatal dari rezim terdahulu yang membatalkan monarki dan hak pengklaim Jerman atas singgasana mereka."
 wuw_GER_realpolitik.11.a: "Hari yang agung bagi [ROOT.GetNameDef]!"
 wuw_GER_realpolitik.12.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.12.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menegaskan bahwa alasan kita menuntut ketundukan mereka serapuh moral rakyat dan kehendak nasional kita sendiri. Tampaknya mereka siap bertempur mempertahankan kemerdekaan mereka..."
 wuw_GER_realpolitik.12.a: "Mereka akan menyesali keputusan mereka"
 wuw_GER_realpolitik.13.t: "[FROM.GetNameDefCap] Menuntut Kita Menjadi Negara Klien Mereka"
 wuw_GER_realpolitik.13.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut kita tunduk ke bawah kekuasaan mereka dan menjadi negara klien, berdalih bahwa langkah ini semata-mata demi mempermudah perlindungan kita dari ancaman bahaya [SOV.GetAdjective]. Haruskah kita menuruti tuntutan mereka?"
 wuw_GER_realpolitik.13.a: "Mungkin mereka sanggup melindungi kita dari ancaman [SOV.GetAdjective]"
 wuw_GER_realpolitik.13.b: "Demi semangat Sisu, kami tidak akan pernah bertekuk lutut!"
 wuw_GER_realpolitik.14.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.14.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan tunduk ke bawah kekuasaan kita, menyadari mereka membutuhkan segenap bantuan yang bisa didapat jika berhasrat melanjutkan perang saudara persaudaraan suku (Heimosodat)."
 wuw_GER_realpolitik.14.a: "Hari yang agung bagi [ROOT.GetNameDef]!"
 wuw_GER_realpolitik.15.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.15.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyatakan bahwa alasan kita menuntut ketundukan mereka sama sekali tak berdasar. Tampaknya mereka bertekad memanggul senjata demi mempertahankan kedaulatan mereka jika dipaksa..."
 wuw_GER_realpolitik.15.a: "Mereka akan menyesali keputusan mereka"
 wuw_GER_realpolitik.16.t: "[FROM.GetNameDefCap] Menuntut Aneksasi Kita"
 wuw_GER_realpolitik.16.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menyatakan bahwa eksistensi kita harus segera diakhiri, dan kita wajib diintegrasikan langsung ke dalam negara [FROM.GetAdjective]. Haruskah kita menerima tuntutan mereka?"
 wuw_GER_realpolitik.16.a: "Inilah akhir perjalanan bagi kita semua"
 wuw_GER_realpolitik.16.b: "Angkat senjata, maju ke medan tempur!"
 wuw_GER_realpolitik.17.t: "[FROM.GetNameDefCap] Menuntut Pengembalian Wilayah Kekaisaran"
 wuw_GER_realpolitik.17.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menuntut kita mengembalikan bekas wilayah kekaisaran timur mereka, yaitu Provinsi Westpreußen, Provinsi Schlesien, dan Provinsi Posen. Itu adalah wilayah yang sangat luas, namun mungkin mengembalikannya adalah satu-satunya cara menghindari jurang penaklukan mutlak."
 wuw_GER_realpolitik.17.a: "Jika itu harga yang harus dibayar demi keselamatan bangsa..."
 wuw_GER_realpolitik.17.b: "Mereka harus merebutnya sendiri dari cengkeraman tangan kami!"
 wuw_GER_realpolitik.18.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.18.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] bersedia menyerahkan kembali wilayah kekaisaran timur lama kita. Akhirnya, ketidakadilan historis akibat Perjanjian Versailles berhasil dihapuskan!"
 wuw_GER_realpolitik.18.a: "Hari yang agung bagi bangsa [ROOT.GetAdjective]!"
 wuw_GER_realpolitik.19.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.19.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyatakan bahwa alasan kita menuntut wilayah mereka telah dibatalkan oleh Perjanjian Versailles, sebuah perjanjian yang mereka tegaskan tidak berhak kita langgar."
 wuw_GER_realpolitik.19.a: "Mereka akan menyesali keputusan angkuh ini"
 wuw_GER_realpolitik.19.b: "Sekarang bukan saatnya tergesa-gesa"
 GER_kaiserreich_decided_not_to_attack_poland: "Memutuskan untuk tidak menyerang §YPolandia§! atas penolakan pengembalian bekas Wilayah Kekaisaran"
 wuw_GER_realpolitik.20.t: "[FROM.GetNameDefCap] Menuntut Konsesi Wilayah Tambahan"
 wuw_GER_realpolitik.20.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menuntut agar kita menyerahkan lebih banyak wilayah lagi kepada mereka. Kali ini mereka menuntut [87.GetName], [98.GetName], dan [97.GetName]. Mereka sekali lagi merangsek kedaulatan kita, namun mungkin ini jalan satu-satunya menghindari pemusnahan total. Haruskah kita menyetujui syarat mereka?"
 wuw_GER_realpolitik.20.a: "Semoga ini menjadi tuntutan terakhir mereka..."
 wuw_GER_realpolitik.20.b: "Kali ini mereka sudah kelewat batas!"
 wuw_GER_realpolitik.21.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.21.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan menyerahkan wilayah [87.GetName], [98.GetName], dan [97.GetName] kepada kita. Barangkali mereka belum menyadari rencana besar apa yang telah kita siapkan untuk masa depan bangsa [FROM.GetAdjective]."
 wuw_GER_realpolitik.21.a: "Hari kemenangan yang agung bagi bangsa [ROOT.GetAdjective]!"
 wuw_GER_realpolitik.22.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.22.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyatakan bahwa dalih kita menuntut tanah air [FROM.GetAdjective] adalah fabrikasi dusta semata, dan mereka tidak akan tinggal diam saat kita merampas tanah leluhur [FROM.GetAdjective] dari rakyatnya. Tampaknya mereka membaca gertakan kita."
 wuw_GER_realpolitik.22.a: "Mereka tidak termakan muslihat kita, namun kita pantang goyah!"
 wuw_GER_realpolitik.23.t: "[FROM.GetNameDefCap] Mengundang Kita ke Dalam Aliansi"
 wuw_GER_realpolitik.23.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kita hari ini untuk menyampaikan tawaran persekutuan. Mereka berharap kita bergabung dengan aliansi mereka, serta ikut serta dalam seluruh kemitraan yang telah dirintis sebelumnya. Mereka juga menjanjikan bantuan militer untuk merebut kembali wilayah lama Utsmaniyah kita. Maukah kita menerima tawaran ini?"
 wuw_GER_realpolitik.23.a: "Telah tiba saatnya merebut kembali hak waris pusaka kita!"
 wuw_GER_realpolitik.23.b: "Kita sama sekali tidak membutuhkan pertemanan mereka!"
 wuw_GER_realpolitik.24.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_realpolitik.24.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] merespons sangat positif tawaran kita, dan para diplomat mereka telah tiba di negeri kita untuk menandatangani dokumen guna meresmikan keikutsertaan penuh mereka ke dalam aliansi kita. Mereka dengan senang hati menerima bantuan kita dalam merebut kembali wilayah lama Utsmaniyah."
 wuw_GER_realpolitik.24.a: "Sangat bagus"
 wuw_GER_realpolitik.25.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.25.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menanggapi undangan aliansi kita dengan ketidaksukaan mendalam, menyatakan bahwa kemitraan apa pun antara kedua negara selamanya mustahil terjadi. Tampaknya mereka tidak menginginkan bantuan kita untuk memulihkan tanah lama Utsmaniyah..."
 wuw_GER_realpolitik.25.a: "Mereka yang merugi..."
 wuw_GER_realpolitik.26.t: "[FROM.GetNameDefCap] Mengajukan Perjanjian Dagang"
 wuw_GER_realpolitik.26.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengutus para diplomat ke ibu kota kita guna membahas prospek hubungan dagang yang erat dengan bangsa [FROM.GetAdjective]. Ini akan mempererat hubungan bilateral kita, namun juga memberi mereka akses terhadap sumber daya alam kita dengan harga lebih murah, yang berisiko merugikan perekonomian dalam negeri kita."
 wuw_GER_realpolitik.26.a: "Kita terima kesepakatan dagang ini"
 wuw_GER_realpolitik.26.b: "Perekonomian kita harus tetap mandiri!"
 wuw_GER_realpolitik.27.t: "Perang Saudara di [ROOT.GetNameDef]"
 wuw_GER_realpolitik.27.desc: "Setelah sekian lama sentimen komunis kian menguat, tampaknya anasir-anasir komunis [ROOT.GetAdjective] telah jenuh menanti peralihan kekuasaan secara damai. Mereka menyatakan bahwa pemerintahan kita saat ini berniat memonopoli seluruh kekuasaan dan harus digulingkan agar komunisme dapat bersemi. Menyusul perdebatan sengit, jalur diplomasi akhirnya runtuh dan konflik bersenjata pun tak terelakkan."
 wuw_GER_realpolitik.27.a: "Bagus sekali"
 wuw_GER_realpolitik.27.b: "Kita harus menghentikan kegilaan ini!"
 wuw_GER_realpolitik.28.t: "Perang Saudara di [ROOT.GetNameDef]"
 wuw_GER_realpolitik.28.desc: "Setelah sekian lama sentimen demokratis kian menguat, tampaknya anasir-anasir demokratis [ROOT.GetAdjective] telah jenuh menanti peralihan kekuasaan secara damai. Mereka menyatakan bahwa pemerintahan kita saat ini berniat memonopoli seluruh kekuasaan dan harus ditumbangkan demi mekarnya demokrasi. Menyusul perselisihan tajam, jalur diplomasi telah pupus dan pertempuran bersenjata pun meletus."
 wuw_GER_realpolitik.28.a: "Sangat disayangkan"
 wuw_GER_realpolitik.28.b: "Kita harus menghentikan kegilaan ini!"
 wuw_GER_realpolitik.29.t: "Perang Saudara di [ROOT.GetNameDef]"
 wuw_GER_realpolitik.29.desc: "Setelah sekian lama sentimen fasis kian menguat, tampaknya anasir-anasir fasis [ROOT.GetAdjective] telah jenuh menanti pergantian kekuasaan secara damai. Mereka mengebom sebuah kantor polisi setempat, memicu bentrokan berdarah di jalanan. Menyusul eskalasi tajam, jalur kompromi telah buntu dan konflik bersenjata tak terbendung. Kita hanya bisa menahan napas seraya menyaksikan ke mana arah masa depan bangsa [ROOT.GetAdjective] ini akan bermuara."
 wuw_GER_realpolitik.29.a: "Tuntut plebisit ulang!"
 wuw_GER_realpolitik.29.b: "Biarkan perbatasan apa adanya."
 # wuw_GER_realpolitik.30, wuw_GER_realpolitik.31 and wuw_GER_realpolitik.32 use other loc 
 wuw_GER_realpolitik.33.t: "[FROM.GetNameDefCap] Menuntut Integrasi Ekonomi"
 wuw_GER_realpolitik.33.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kita hari ini untuk menyampaikan sebuah tawaran. Mereka menginginkan kita memperluas kegiatan serikat pabean dan memperdalam integrasi ekonomi dengan mereka. Hal ini tentu akan sangat mendongkrak perekonomian kita, namun ada aroma mencurigakan di balik semua ini..."
 wuw_GER_realpolitik.33.a: "Perbatasan utara kita aman."
 wuw_GER_realpolitik.33.b: "Kita tidak akan mengorbankan kemandirian ekonomi kita!"
 wuw_GER_realpolitik.34.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_realpolitik.34.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menyambut baik tawaran kita, dan para diplomat mereka telah tiba di negeri kita untuk menandatangani dokumen-dokumen yang diperlukan guna memfasilitasi integrasi ekonomi lebih lanjut."
 wuw_GER_realpolitik.34.a: "Biarkan mereka menanggung akibat kecurigaannya."
 wuw_GER_realpolitik.35.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.35.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi undangan integrasi kita dengan ketidaksenangan yang nyata. Mereka menegaskan bahwa kemitraan ekonomi yang lebih erat antarnegara kita tidak akan pernah dipertimbangkan sama sekali. Mungkin mereka telah mencium niat tersembunyi kita..."
 wuw_GER_realpolitik.35.a: "Kobarkan panji persatuan Jermanik!"
 wuw_GER_realpolitik.36.t: "[FROM.GetNameDefCap] Mengusulkan Penyatuan"
 wuw_GER_realpolitik.36.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengusulkan agar bangsa kita bersatu dengan bangsa mereka, mengingat rakyat kita serumpun dan akan merasa lebih terlindungi di bawah satu negara yang lebih perkasa. Tersirat nada pemaksaan dan agresi dalam pesan tersebut, namun barangkali memang yang terbaik adalah menjadi bagian dari entitas yang lebih agung?"
 wuw_GER_realpolitik.36.a: "Mereka buta akan takdir sejarah"
 wuw_GER_realpolitik.36.b: "Kita tidak akan mengorbankan kemerdekaan kita!"
 wuw_GER_realpolitik.37.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 wuw_GER_realpolitik.37.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa setelah menggelar pemungutan suara publik, diputuskan bahwa bangsa [FROM.GetAdjective] secara resmi membubarkan diri mulai hari ini dan menjadi bagian integral tak terpisahkan dari kedaulatan [ROOT.GetAdjective]. Tampaknya persuasi diplomatik kita berhasil gemilang."
 wuw_GER_realpolitik.37.a: "Hari kemenangan yang agung bagi bangsa [ROOT.GetAdjective]!"
 wuw_GER_realpolitik.38.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 wuw_GER_realpolitik.38.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyatakan bahwa alasan kita menuntut penundukan [FROM.GetAdjective] sepenuhnya merusak prinsip kedaulatan dan hak menentukan nasib sendiri [FROM.GetAdjective]. Tampaknya mereka enggan menjadi bagian dari negara Jermanik Raya."
 wuw_GER_realpolitik.38.a: "Kalau begitu kita wajib menghormati kehendak mereka"
 wuw_GER_realpolitik.38.b: "[FROM.GetNameDefCap] adalah milik sah bangsa [ROOT.GetAdjective]!"
 AUS_is_more_likely_to_accept_being_brothers_in_arms_flag: "Rakyat §Y[AUS.GetAdjective]§! telah terbujuk untuk berpihak kepada kita"
 wuw_GER_realpolitik.39.t: "[FROM.GetNameDefCap] Mengundang Kita ke Dalam Aliansi"
 wuw_GER_realpolitik.39.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] tiba di ibu kota kita hari ini membawa tawaran resmi. Mereka berharap kita bergabung dengan aliansi mereka, serta ikut serta dalam setiap kemitraan dan persatuan yang dirintis sebelumnya. Mereka juga menjanjikan sokongan militer dalam merebut kembali wilayah lama Hongaria kita dan memulihkan Hongaria Raya. Maukah kita menerima tawaran ini?"
 wuw_GER_realpolitik.39.a: "Telah tiba saatnya merebut kembali hak waris pusaka kita!"
 wuw_GER_realpolitik.39.b: "Kita tidak membutuhkan pertemanan mereka!"
 wuw_GER_realpolitik.40.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_realpolitik.40.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyambut sangat hangat tawaran kita, dan para utusan mereka telah tiba di tanah air untuk menandatangani dokumen keikutsertaan penuh ke dalam aliansi kita. Mereka dengan suka cita menerima bantuan kita dalam merebut kembali wilayah historis Hongaria."
 wuw_GER_realpolitik.40.a: "Sangat bagus"
 wuw_GER_realpolitik.41.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.41.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menanggapi ajakan persekutuan kita dengan amarah, menyatakan bahwa persekutuan dalam bentuk apa pun antara kedua negara selamanya mustahil. Tampaknya mereka tidak menghendaki bantuan kita memulihkan wilayah lama Hongaria..."
 wuw_GER_realpolitik.41.a: "Mereka yang merugi..."
 wuw_GER_realpolitik.42.t: "[FROM.GetNameDefCap] Mengundang Kita ke Dalam Aliansi"
 wuw_GER_realpolitik.42.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kita hari ini membawa tawaran persaudaraan. Mereka mendambakan kita bergabung dengan aliansi mereka, dan sekali lagi bertempur berdampingan laksana saudara seperjuangan, persis seperti yang kita buktikan dalam Perang Besar. Mereka juga menjanjikan bantuan militer dalam merebut kembali wilayah lama Austria-Hongaria dan memulihkan keutuhan wilayah Kekaisaran. Haruskah kita menerima tawaran ini?"
 wuw_GER_realpolitik.42.a: "Telah tiba saatnya merebut kembali hak waris pusaka kita!"
 wuw_GER_realpolitik.42.b: "Kita tidak membutuhkan pertemanan mereka!"
 wuw_GER_realpolitik.43.t: "[FROM.GetNameDefCap] Menerima Tawaran Kita"
 wuw_GER_realpolitik.43.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyambut sangat baik tawaran aliansi kita, dan para diplomat mereka telah tiba di negeri kita menandatangani kesepakatan masuknya mereka secara utuh ke dalam Mitteleuropa. Mereka menyambut hangat bantuan kita memulihkan wilayah bersejarah Austria-Hongaria, dan mendambakan bertempur bahu-membahu kembali sebagai saudara melawan ancaman dunia."
 wuw_GER_realpolitik.43.a: "Sungguh megah dan gemilang"
 wuw_GER_realpolitik.44.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.44.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] membalas ajakan persekutuan kita dengan permusuhan terang-terangan, menyatakan bahwa kemitraan apa pun antarnegara selamanya tertutup. Tampaknya mereka tidak menginginkan bantuan kita untuk memulihkan tanah air Austria-Hongaria..."
 wuw_GER_realpolitik.44.a: "Mereka gagal melihat apa yang terbaik bagi rakyat mereka sendiri"
 wuw_GER_realpolitik.45.t: "[FROM.GetLeader] Ingin Membagi Cekoslowakia"
 wuw_GER_realpolitik.45.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] mendekati kita dengan tawaran yang memikat. Mereka berkehendak membagi wilayah Cekoslowakia lama di antara kedua bangsa kita. Terdengar seperti rencana yang menguntungkan, bukan?"
 wuw_GER_realpolitik.45.a: "Sepakat!"
 wuw_GER_realpolitik.45.b: "Kita tidak dapat menyetujui pembagian ini"
 wuw_GER_realpolitik.46.t: "[GER.GetNameDefCap] Menuntut Wilayah Cekoslowakia"
 wuw_GER_realpolitik.46.desc: "[GER.GetLeader] dari [GER.GetNameDef] menuntut agar kita menyerahkan seluruh wilayah Cekoslowakia yang dulunya merupakan bagian dari Kekaisaran Austria-Hongaria kembali kepada mereka dan sekutu-sekutu mereka. Terdengar seperti kesepakatan yang sangat merugikan bagi kita, namun mampukah kita bertahan menghadapi kedahsyatan militer mereka?"
 wuw_GER_realpolitik.46.a: "Kita tidak sanggup melawan mereka berdua..."
 wuw_GER_realpolitik.46.b: "Kami tidak akan pernah menyerah!"
 wuw_GER_realpolitik.47.t: "[FROM.GetLeader] Menyetujui Pembagian Cekoslowakia"
 wuw_GER_realpolitik.47.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tunduk pada tuntutan kita, betapapun pahitnya syarat itu. Pasukan kita telah mulai bergerak melintasi perbatasan dan kini saatnya memulihkan kejayaan masa lalu yang lama terkubur."
 wuw_GER_realpolitik.47.a: "Bagus sekali"
 wuw_GER_realpolitik.48.t: "[FROM.GetLeader] Menolak Pembagian Cekoslowakia"
 wuw_GER_realpolitik.48.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menolak menyerahkan wilayah sah kita dan menegaskan bahwa jika kita menginginkannya, kita harus merebutnya sendiri dengan kekuatan senjata. Pihak [FROM.GetAdjective] memang pandai menggertak, namun mampukah mereka membuktikannya di medan tempur?"
 wuw_GER_realpolitik.48.a: "Kita akan merebut kembali apa yang menjadi hak milik kita!"
 wuw_GER_realpolitik.49.t: "Tuan Penguasa Kita Menyerahkan Kita kepada [GER.GetNameDef]"
 wuw_GER_realpolitik.49.desc: "Tuan penguasa kita telah mengkhianati kita seutuhnya dan memilih untuk menyerahkan tanah air kita kepada [GER.GetNameDef]. Haruskah kita mematuhi keputusan mereka ataukah berjuang melawan?"
 wuw_GER_realpolitik.49.a: "Laksanakan partisi!"
 wuw_GER_realpolitik.49.b: "Kalau begitu mereka harus merebut kami dengan kekerasan!"
 wuw_GER_realpolitik.50.t: "[FROM.GetNameDefCap] Menolak Tawaran Kita"
 wuw_GER_realpolitik.50.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak usulan kita untuk membagi-bagi bekas wilayah Cekoslowakia era Austria-Hongaria. Tampaknya kesepakatan ini akhirnya batal sama sekali..."
 wuw_GER_realpolitik.50.a: "Kemenangan tanpa tetesan darah."
 wuw_GER_realpolitik.51.t: "Perlawanan Slowakia"
 wuw_GER_realpolitik.51.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] baru-baru ini mengecam apa yang mereka sebut sebagai pendudukan tanpa hak atas tanah Galicia kita, dengan dalih bahwa wilayah tersebut konon masih merupakan bagian sah dari Kekaisaran Austria-Hongaria masa lampau—klaim yang ditegaskan sepenuhnya oleh [FROM.GetNameDef] dan para sekutunya. Kini, kita telah menerima ultimatum [FROM.GetAdjective], dan pasukan mereka kian menumpuk di perbatasan kita. Bagaimana kita harus menanggapi?"
 wuw_GER_realpolitik.51.a: "Hancurkan kubu pertahanan mereka!"
 wuw_GER_realpolitik.51.b: "Kalau begitu datang dan rebutlah!"
 wuw_GER_realpolitik.52.t: "[FROM.GetNameDefCap] Menyerahkan Galicia"
 wuw_GER_realpolitik.52.desc: "Sang pemimpin yang berpikiran jernih, [FROM.GetLeader] dari [FROM.GetNameDef], telah sepakat untuk menyerahkan wilayah mereka di Galicia kepada aliansi kita, serta telah memerintahkan pasukannya untuk bersiap siaga mundur dari kawasan tersebut. Kita sekali lagi berdiri sebagai pemenang!"
 wuw_GER_realpolitik.52.a: "Terapkan keputusan arbitrase!"
 wuw_GER_realpolitik.53.t: "[FROM.GetNameDefCap] Tetap Teguh"
 wuw_GER_realpolitik.53.desc: "Kendati tidak sepenuhnya di luar dugaan, tindakan gegabah [FROM.GetLeader] dari [FROM.GetNameDef] yang menetapkan status siaga penuh bagi pasukan negerinya pasca-menerima ultimatum kita, disusul pengiriman utusan yang menyatakan bahwa mereka tidak akan mundur walau satu langkah pun terkait sengketa ini."
 wuw_GER_realpolitik.53.a: "Keadilan telah dipulihkan."
 wuw_GER_realpolitik.53.b: "Kita sebaiknya merelakan masalah ini..."
 wuw_GER_realpolitik.54.t: "Penghargaan Berlin Kedua"
 wuw_GER_realpolitik.54.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] baru-baru ini mengecam apa yang mereka sebut sebagai pendudukan ilegal kita atas wilayah Banat dan Transilvania, dengan dalih bahwa wilayah-wilayah tersebut secara sah masih merupakan bagian dari bekas Kekaisaran Austria-Hongaria, klaim yang didukung penuh oleh [FROM.GetNameDef] dan sekutu-sekutu mereka. Kini kita menerima ultimatum resmi [FROM.GetAdjective], dan pasukan mereka mulai berhimpun di perbatasan kita. Bagaimana kita harus menanggapi?"
 wuw_GER_realpolitik.54.a: "Wilayah itu tidak sepadan dengan pertumpahan darah rakyat kita"
 wuw_GER_realpolitik.54.b: "Kalau begitu datang dan rebutlah sendiri!"
 wuw_GER_realpolitik.55.t: "[FROM.GetNameDefCap] Menyerahkan Bekas Wilayah Hongaria"
 wuw_GER_realpolitik.55.desc: "\n[FROM.GetLeader] yang berakal sehat dari [FROM.GetNameDef] sepakat untuk menyerahkan wilayah mereka di bekas tanah Hongaria kepada persekutuan kita, dan telah memerintahkan pasukannya untuk menghentikan siaga serta mundur dari kawasan sengketa. Kita sekali lagi keluar sebagai pemenang!"
 wuw_GER_realpolitik.55.a: "Ini adalah hari kemenangan yang agung!"
 wuw_GER_realpolitik.56.t: "[FROM.GetNameDefCap] Berdiri Teguh"
 wuw_GER_realpolitik.56.desc: "Kendati tidak sepenuhnya di luar dugaan, [FROM.GetLeader] yang keras kepala dari [FROM.GetNameDef] menyiagakan penuh pasukan tempur negaranya pasca menerima ultimatum kita, serta mengirim utusan yang menyatakan bahwa mereka tidak akan mundur satu langkah pun dalam sengketa teritorial ini."
 wuw_GER_realpolitik.56.a: "Mereka akan menyesali keputusan bodoh mereka!"
 wuw_GER_realpolitik.56.b: "Kita sebaiknya merelakan sengketa ini..."
 wuw_GER_realpolitik.57.t: "[FROM.GetNameDefCap] Mengintegrasikan Perekonomian Kita"
 wuw_GER_realpolitik.57.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah bertindak melampaui janji awal mereka, memanipulasi pasar demi memperdalam ketergantungan kita pada perekonomian mereka, dalam langkah sistematis demi memastikan kita tidak dapat membelot dari jalur mereka. Seandainya kita tidak melepaskan diri dari mereka sekarang juga, ini secara praktis akan mengakhiri status kita sebagai bangsa berdaulat. Bagaimana kita harus menyikapi persoalan ini?"
 wuw_GER_realpolitik.57.a: "Kita terpaksa harus menerima kenyataan pahit ini"
 wuw_GER_realpolitik.57.b: "Menang atau mati!"
 wuw_GER_realpolitik.58.t: "[FROM.GetNameDefCap] Menyetujui Integrasi Lanjutan"
 wuw_GER_realpolitik.58.desc: "Kabar kemenangan bahwa pimpinan di [FROM.GetNameDef] telah sepakat untuk berintegrasi lebih jauh dengan kita disambut tepuk tangan membahana di gedung Reichstag hari ini. Apa yang mampu kita tawarkan terbukti memuaskan bagi mereka untuk memandang tawaran tersebut menguntungkan terlepas dari sedikit erosi terhadap kedaulatan mereka."
 wuw_GER_realpolitik.58.a: "Luar biasa!"
 wuw_GER_realpolitik.59.t: "[FROM.GetNameDefCap] Menolak Integrasi Lanjutan"
 wuw_GER_realpolitik.59.desc: "Terlepas dari berbagai keuntungan nyata dan fakta bahwa ini adalah yang terbaik bagi kesatuan uni, [FROM.GetNameDef] menolak usulan kita untuk integrasi yang lebih dalam. Kita hanya bisa menduga motif mereka, namun tampak jelas mereka tidak menaruh kepentingan terbaik uni di dalam benak mereka."
 wuw_GER_realpolitik.59.a: "Mereka adalah ancaman bagi persatuan konfederasi!"
 wuw_GER_realpolitik.59.b: "Kita akan mengawasi gerak-gerik mereka dengan saksama"
 wuw_GER_realpolitik.60.t: "[FROM.GetNameDefCap] Menuntut Integrasi Total"
 wuw_GER_realpolitik.60.desc: "Mengintegrasikan sektor ekonomi kita rupanya belum cukup memuaskan nafsu keserakahan pihak [FROM.GetAdjective]. Hari ini [FROM.GetLeader] dari [FROM.GetNameDef] melangkah lebih jauh dari janji semula dan menuntut integrasi total seluruh bangsa kita ke dalam negara mereka. Jika kita tidak memutuskan hubungan dengan mereka seketika, ini adalah lonceng kematian bagi status kita sebagai bangsa yang merdeka. Bagaimana kita menghadapinya?"
 wuw_GER_realpolitik.60.a: "Kita terpaksa harus menerima kenyataan takdir ini"
 wuw_GER_realpolitik.60.b: "Menang atau mati!"
 wuw_GER_realpolitik.61.t: "[FROM.GetNameDefCap] Menerima Integrasi Total"
 wuw_GER_realpolitik.61.desc: "Kabar agung bahwa kepemimpinan di [FROM.GetNameDef] telah bersedia diintegrasikan secara utuh ke dalam bangsa kita disambut sorak-sorai kemenangan di Reichstag tadi pagi. Apa yang sanggup kita berikan terbukti memikat bagi mereka untuk memandang tawaran ini menguntungkan terlepas dari berakhirnya kedaulatan nasional mereka."
 wuw_GER_realpolitik.61.a: "Bagus sekali!"
 wuw_GER_realpolitik.62.t: "[FROM.GetNameDefCap] Menolak Integrasi Total"
 wuw_GER_realpolitik.62.desc: "Terlepas dari keuntungan berlimpah dan fakta tak terbantahkan bahwa ini adalah pilihan terbaik bagi persatuan federasi, [FROM.GetNameDef] menolak mentah-mentah usulan kita untuk integrasi total. Kita hanya dapat mereka-reka alasan mereka, namun nyata terlihat mereka enggan tunduk pada masa depan bersama."
 wuw_GER_realpolitik.62.a: "Mereka adalah duri dalam daging bagi kesatuan federasi!"
 wuw_GER_realpolitik.62.b: "Kita akan memantau gerak-gerik mereka dengan penuh kewaspadaan"
 wuw_GER_realpolitik.63.t: "[FROM.GetNameDefCap] Mengajak Kita ke Dalam Uni Kepabeanan"
 wuw_GER_realpolitik.63.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] mendekati kita dengan tawaran untuk bergabung ke dalam uni kepabeanan bersama mereka, yang semata-mata bertujuan memperkokoh perekonomian kedua negara kita. Terdengar seperti kesepakatan dagang yang terlalu berharga untuk dilewatkan, bukan?"
 wuw_GER_realpolitik.63.a: "Dengan senang hati kita menyetujuinya"
 wuw_GER_realpolitik.63.b: "Terdengar mencurigakan di mata kita..."
 GOT_GER_integrated_puppet_economies.01.t: "Bantuan Pembangunan [FROM.GetAdjective]"
 GOT_GER_integrated_puppet_economies.01.desc: "Pihak Jerman tengah menanamkan investasi besar pada sektor industri demi mengembangkan produksi militer kita dan mengintegrasikan sebagian dari perekonomian kita. Kendati hal ini niscaya akan mendongkrak produktivitas kita, langkah ini juga akan mengikis otonomi dan kedaulatan merdeka kita."
 GOT_GER_integrated_puppet_economies.01.a: "Kita harus memutar situasi ini agar menguntungkan posisi kita"
 GOT_GER_integrated_puppet_economies.02.t: "Program Eksploitasi [FROM.GetAdjective]"
 GOT_GER_integrated_puppet_economies.02.desc: "Demi memperkuat kapasitas industri perang mereka sendiri, pihak Jerman melancarkan kebijakan eksploitasi besar-besaran untuk menguras seluruh sumber daya alam dan hasil produksi kita hingga negeri ini kering kerontang."
 GOT_GER_integrated_puppet_economies.02.a: "Kita harus memanfaatkan situasi ini demi keuntungan kita"
 GER_idea_added_for_limited_time: "Gagasan berikut akan ditambahkan selama §Y$TIME$§! hari:\n$IDEA$"
 wuw_GER_the_battle_of_britain.01.t: "Pertempuran Britania (Battle of Britain)"
 wuw_GER_the_battle_of_britain.01.desc: "$GER_hermann_goring$ sangat berhasrat membuktikan keunggulan mutlak Luftwaffe dan mematahkan semangat juang rakyat [ENG.GetAdjective]. Ia bertekad mencapainya dengan membom tengara ikonik London, jam raksasa Big Ben. Ia berargumen bahwa kehancuran simbol tersebut akan memaksa [ENG.GetNameDef] bertekuk lutut dan mempercepat akhir perang. Ia bahkan secara pribadi menjamin bahwa tidak akan ada satu bom pun yang mampu menjatuhi Berlin selama kampanye ini, atau Anda boleh memanggilnya Hermann 'Meier'."
 wuw_GER_the_battle_of_britain.01.a: "Biarkan ia membuktikannya"
 wuw_GER_the_battle_of_britain.01.b: "Janjinya terlalu muluk dan berlebihan"
 GER_unlocks_big_ben_raid_tt: "Membuka §YSerangan Udara§! ke §YBig Ben§!"
 wuw_GER_uncertain_future.01.t: "$GER_growing_public_dissent_mission$"
 wuw_GER_uncertain_future.01.desc: "Dengan Perang Saudara yang akhirnya usai, kita perlahan membangun kembali bangsa ini, sementara rakyat mendambakan stabilitas dan keamanan namun kian merasa terombang-ambing tanpa haluan atau tujuan pasti. Masyarakat kian jenuh dengan ketidakpastian ini dan menuntut arah kebijakan yang mantap."
 wuw_GER_uncertain_future.01.a: "Kita harus bertindak cepat!"
 wuw_GER_uncertain_future.02.t: "[ROOT.GetNameDefCap] Menghadapi Masa Depan yang Penuh Ketidakpastian"
 wuw_GER_uncertain_future.02.desc: "Dengan Perang Saudara yang akhirnya usai, bangsa Jerman perlahan menata kembali negerinya, namun rakyatnya sangat merindukan kestabilan dan rasa aman. [ROOT.GetLeader] belum mengambil langkah tegas untuk melangkah maju dan tampak tidak peduli dalam menentukan akan seperti apa rupa negara Jerman baru kelak. Hal ini menimbulkan kecemasan mendalam di kalangan rakyat yang ingin segera meninggalkan masa lalu kelam mereka."
 wuw_GER_uncertain_future.02.a: "Gejolak keresahan di kalangan rakyat jelata, benarkah?"
 wuw_GER_german_politics.01.t: "Kembalinya Demokrasi"
 wuw_GER_german_politics.01.desc: "Dengan kembalinya pemilihan umum yang bebas, rakyat [ROOT.GetAdjective] berbondong-bondong mendatangi tempat pemungutan suara untuk menentukan masa depan Jerman. Gelombang euforia meluap di jalan-jalan dengan perasaan lega bahwa hari-hari kelam akhirnya telah berlalu, menjadikan hari ini terasa lebih menyerupai festival perayaan ketimbang sekadar pemilu nasional."
 wuw_GER_german_politics.01.a: "Kita membutuhkan sosok tradisionalis yang berhati-hati"
 wuw_GER_german_politics.01.b: "Kita membutuhkan sosialis berpandangan maju"
 wuw_GER_german_politics.02.t: "Pemimpin bagi Rakyat Jelata"
 wuw_GER_german_politics.02.desc: "Dengan kembalinya cita-cita Liga Spartakus, muncul kehendak untuk melibatkan rakyat secara lebih aktif. Pemilihan umum untuk memilih sosok yang mewakili kita telah digelar, dan saat seluruh surat suara dihitung, hasilnya tampak sangat berimbang. Rakyat jelas memandang kedua kandidat sebagai figur yang cakap memimpin [ROOT.GetNameDef], sayangnya kita hanya dapat mengangkat satu orang saja."
 wuw_GER_german_politics.02.a: "Heinrich Brandler adalah pilihan yang tepat!"
 wuw_GER_german_politics.02.b: "Pertahankan Ernst Thälmann di tampuk kekuasaan!"
 wuw_GER_german_politics.02.c: "Kita membutuhkan seorang Sosialis yang pragmatis!"
 GOT_GER_amerikabomber.01.t: "Proyek Pengebom Amerika (Amerikabomber)"
 GOT_GER_amerikabomber.01.desc: "Dengan ditetapkannya keputusan merancang pengebom strategis jarak jauh antarkontinental, rancangan dari berbagai konsorsium penerbangan telah diajukan ke meja komando. Masing-masing menjanjikan mampu memproduksi mesin perang yang sanggup membawa kobaran perang melintasi Samudra Atlantik. Kini satu-satunya langkah tersisa adalah menentukan tim mana yang akan mewujudkan rencana ambisius ini."
 GOT_GER_amerikabomber.01.a: "$GER_focke_wulf_organization$"
 GOT_GER_amerikabomber.01.b: "$GER_heinkel_organization$"
 GOT_GER_amerikabomber.01.c: "$GER_junkers_organization$"
 GOT_GER_amerikabomber.01.d: "$GER_messerschmitt_organization$"
 when_intercontinental_bomber_project_is_completed_tt: "Ketika Proyek Khusus §Y$sp_air_intercontinental_bomber$§! selesai diteliti:"
 GER_amerikabomber_focke_wulf_flag: "§Y$GER_focke_wulf_organization$§! telah ditugaskan untuk pengembangan §YAmerikabomber§!"
 GER_amerikabomber_heinkel_flag: "§Y$GER_heinkel_organization$§! telah ditugaskan untuk pengembangan §YAmerikabomber§!"
 GER_amerikabomber_messerschmitt_flag: "§Y$GER_messerschmitt_organization$§! telah ditugaskan untuk pengembangan §YAmerikabomber§!"
 GER_amerikabomber_junkers_flag: "§Y$GER_junkers_organization$§! telah ditugaskan untuk pengembangan §YAmerikabomber§!"
 # Event for GER
 GER_operation_panzerfaust_events.01.t: "Keraguan atas Loyalitas Horthy"
 GER_operation_panzerfaust_events.01.desc: "Kecurigaan bahwa sekutu kita Miklós Horthy tengah menjalin perundingan damai rahasia dengan musuh-musuh kita telah sampai ke telinga pimpinan Reich. Kita harus melancarkan tekanan keras kepadanya demi memastikan Hongaria tetap setia pada perjuangan Poros."
 GER_operation_panzerfaust_events.01.a: "Tuntut ketundukan mutlaknya kepada sang Führer"
 GER_operation_panzerfaust_events.01.b: "Ini reaksi berlebihan, Horthy adalah sekutu setia!"
 # Event for HUN
 GER_operation_panzerfaust_events.02.t: "[GER.GetLeader] Menuntut Pengunduran Diri Horthy"
 GER_operation_panzerfaust_events.02.desc: "Hari ini kita menerima kabar bahwa pihak Jerman menuntut Miklós Horthy meletakkan jabatan demi digantikan oleh Ferenc Szálasi, sosok yang mereka nilai jauh lebih dapat dipercaya. Mereka juga menegaskan bahwa jika tuntutan mereka tidak dipenuhi, intervensi militer ke negara kita mutlak akan terjadi."
 GER_operation_panzerfaust_events.02.a: "Kita tidak dalam posisi sanggup menentang mereka"
 GER_operation_panzerfaust_events.02.b: "Mereka tidak memiliki kuasa apa pun di tanah air kita"
 # Event for GER
 GER_operation_panzerfaust_events.03.t: "Hongaria Tunduk"
 GER_operation_panzerfaust_events.03.desc: "Miklós Horthy telah menyerah dan Hongaria kini sepenuhnya berada dalam cengkeraman kita. Tampaknya intimidasi tegas kita membuahkan hasil manis."
 GER_operation_panzerfaust_events.03.a: "Luar biasa"
 # Event for GER
 GER_operation_panzerfaust_events.04.t: "Horthy Tetap Membangkang"
 GER_operation_panzerfaust_events.04.desc: "Miklós Horthy hari ini mengumumkan secara terbuka bahwa ia tidak akan tunduk pada gertakan Jerman dan Hongaria akan tetap merdeka di luar kendali Jerman. Mengingat tekanan diplomatik semata tidak mempan, kita kini harus menentukan langkah militer kita."
 GER_operation_panzerfaust_events.04.a: "Ini sudah kelewat batas. Luncurkan Operasi Margarethe!"
 GER_operation_panzerfaust_events.04.b: "Kita tidak akan terpancing permainan politiknya"
 GER_operation_panzerfaust_events.04.c: "Kalau begitu kita serahkan urusan ini kepada para agen intelijen kita..."
 # Event for HUN
 GER_operation_panzerfaust_events.05.t: "Jerman Melancarkan Operasi Margarethe"
 GER_operation_panzerfaust_events.05.desc: "Sang Führer membuktikan ancamannya dan kini secara resmi mengumumkan dimulainya Operasi Margarethe: invasi kilat terhadap tanah air kita demi penundukan paksa. Kita harus berdiri melawan dengan gagah berani!"
 GER_operation_panzerfaust_events.05.a: "Biarkan mereka datang menghadapi perlawanan kita"
 # Event for HUN
 GER_operation_panzerfaust_events.06.t: "Jerman Mencoba Menurunkan Ketegangan"
 GER_operation_panzerfaust_events.06.desc: "Terlepas dari segala ancaman terhadap perbatasan dan kedaulatan kita, pihak Jerman kini berupaya meredakan ketegangan dengan menarik kembali tuntutan keras mereka."
 GER_operation_panzerfaust_events.06.a: "Baguslah kalau begitu"
 # Event for GER
 GER_operation_panzerfaust_events.07.t: "Operasi Panzerfaust Mengalami Kegagalan"
 GER_operation_panzerfaust_events.07.desc: "Semula kita berharap operasi rahasia ini menjadi pukulan pamungkas bagi kaum Hongaria yang kian memberontak, namun Operasi Panzerfaust hari ini digagalkan setelah agen-agen komando kita diringkus persis di luar kediaman Horthy."
 GER_operation_panzerfaust_events.07.a: "Mereka terpaksa berada di luar kendali kita, untuk saat ini"
 # Event for GER
 GER_operation_panzerfaust_events.08.t: "Operasi Panzerfaust Meraih Keberhasilan Gemilang"
 GER_operation_panzerfaust_events.08.desc: "Kita berhasil menculik Horthy beserta putranya, dan segera menyerahkan tampuk kekuasaan kepada Ferenc Szálasi. Dengan demikian Hongaria kini akan patuh dan setia pada perjuangan Poros."
 GER_operation_panzerfaust_events.08.a: "Kemenangan mutlak"
 # Event for HUN
 GER_operation_panzerfaust_events.09.t: "Operasi Margarethe Berhasil"
 GER_operation_panzerfaust_events.09.desc: "Pasukan Wehrmacht telah menduduki titik-titik strategis di Budapest dan mengamankan pemerintahan militer di Hongaria."
 GER_operation_panzerfaust_events.09.a: "Hongaria telah diamankan."
 # Event for HUN
 GER_operation_panzerfaust_events.10.t: "Szálasi Mengambil Alih Kekuasaan"
 GER_operation_panzerfaust_events.10.desc: "Ferenc Szálasi dan Partai Salib Panah kini memegang kendali penuh atas pemerintahan Hongaria di bawah perlindungan Jerman."
 GER_operation_panzerfaust_events.10.a: "Sekutu yang setia telah berkuasa."
 GER_operation_panzerfaust_events.10.b: "Kami tidak akan pernah menyerah!"
 GOT_GER_fading_eagle.01.t: "[FROM.GetNameDefCap] Menuntut Penundukan Kita"
 GOT_GER_fading_eagle.01.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut agar kita tunduk pada otoritas mereka di tengah kampanye untuk merebut kembali kendali atas Balkan dan bekas Kekaisaran Italia. Kita sesungguhnya tidak memiliki kekuatan untuk melawan mereka saat ini, namun barangkali inilah kesempatan menuju kemerdekaan yang selama ini kita nanti-nantikan?"
 GOT_GER_fading_eagle.01.a: "Kita terpaksa mengizinkannya untuk saat ini"
 GOT_GER_fading_eagle.01.b: "Kita tidak akan pernah menyerahkan kedaulatan kita!"
 GOT_GER_fading_eagle.02.t: "[FROM.GetNameDefCap] Menerima Tuntutan Kita"
 GOT_GER_fading_eagle.02.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengumumkan bahwa bangsa [FROM.GetAdjective] akan menyerahkan diri ke bawah kepemimpinan kita, dan berikrar setia pada perjuangan kita hingga akhir hayat."
 GOT_GER_fading_eagle.02.a: "Kita kembali merebut kendali!"
 GOT_GER_fading_eagle.03.t: "[FROM.GetNameDefCap] Menolak Tuntutan Kita"
 GOT_GER_fading_eagle.03.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menegaskan bahwa mereka tidak akan menerima penundukan sekali lagi, dan jika kita menginginkan wilayah mereka, kita harus merebutnya dengan kekerasan senjata."
 GOT_GER_fading_eagle.03.a: "Mereka akan menyesali keputusan mereka"
 GOT_GER_fading_eagle.03.b: "Kita tidak sanggup menambah satu musuh lagi"
