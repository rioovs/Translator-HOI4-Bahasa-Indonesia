 # NEWS
 GOE_RAJ_news.1.t: "Kembalinya [?event_target:EIC_FORMER.GetAdjective] Perusahaan India Timur"
 GOE_RAJ_news.1.desc: "Dengan ketegangan di [RAJ.GetNonIdeologyName] yang terus meningkat, pertanyaan tentang bagaimana [?event_target:EIC_FORMER.GetNonIdeologyName] akan menstabilkan kawasan telah menjadi pokok diskusi utama di parlemen mereka. Pagi ini, [?event_target:EIC_FORMER.GetLeader] mengadakan pidato yang mengumumkan rencana [?event_target:EIC_FORMER.GetLeader.GetHerHis] untuk membentuk negara korporasi baru di [429.GetName] guna mendorong pertumbuhan ekonomi di [RAJ.GetNonIdeologyName] dan [?event_target:EIC_FORMER.GetNonIdeologyName]. [?event_target:EIC_FORMER.GetLeader.GetSheHeCap] mengklaim negara bagian ini akan beroperasi secara independen dari pemerintah, namun secara ekonomi akan terikat dengan [?event_target:EIC_FORMER.GetNonIdeologyName] melalui perpajakan. [?event_target:EIC_FORMER.GetSheHeCap] menggambarkannya sebagai 'penerus spiritual East India Company pada abad ke-19'.\n\n[?event_target:EIC_FORMER.GetLeader] mengatakan bahwa meskipun hal ini dapat menyebabkan kebingungan sementara dan meningkatkan ketidakstabilan, hal ini akan membuka jalan bagi keamanan ekonomi baru dan stabilisasi bertahap di kawasan."
 GOE_RAJ_news.1.a: "Kedua kalinya adalah pesonanya."
 GOE_RAJ_news.2.t: "Pemberontakan di Angkatan Laut Kerajaan India"
 GOE_RAJ_news.2.desc: "Sentimen komunis yang meningkat pesat di [RAJ.GetNonIdeologyName] telah mencapai titik balik yang kritis saat ini ketika Angkatan Laut Kerajaan India mendeklarasikan pemberontakan, yang mengakibatkan pemerintahan kolonial yang sudah melemah kehilangan sedikit pengaruh yang mereka miliki terhadap [RAJ.GetNonIdeologyName]. Akibatnya, Republik Rakyat India yang baru telah dideklarasikan oleh [RAJ.GetLeader].\n\nUntuk menghindari konflik yang tak terhindarkan, [RAJ.GetLeader] telah mendapatkan kesepakatan untuk otonomi [PAK.GetAdjective], dengan pembentukan negara merdeka [PAK.GetAdjective] yang dipimpin oleh [PAK.GetLeader], bersama dengan gencatan senjata antara kedua negara, yang berlaku segera."
 GOE_RAJ_news.2.a: "Raj telah jatuh."
 GOE_RAJ_news.3.t: "Lonceng Kematian Raj"
 GOE_RAJ_news.3.desc: "Keputusan untuk mereformasi East India Company di [RAJ.GetNonIdeologyName] diambil oleh [?event_target:EIC_FORMER.GetNonIdeologyName] beberapa tahun yang lalu untuk menstabilkan perekonomian [RAJ.GetAdjective] yang sedang menurun. Karena langkah ini secara umum dianggap sukses oleh para ekonom [?event_target:EIC_FORMER.GetAdjective], pemerintah [?event_target:EIC_FORMER.GetAdjective] telah mengumumkan bahwa dengan segera, sisa lahan yang dikuasai oleh Raj akan dialihkan ke [RAJ.GetNameDefCap]. Administrasi Raj akan dibongkar, memungkinkan [RAJ.GetNameDefCap] mengawasi seluruh anak benua."
 GOE_RAJ_news.3.a: "Menjanjikan."
 currentStateResistance: "Saat ini §R[?var:THIS.resistance|1]%§! Resistensi."
 currentStateCompliance: "Saat ini Kepatuhan §Y[?var:THIS.compliance|1]%§!."
 GOE_RAJ_news.4.t: "Hindustan Bersatu"
 GOE_RAJ_news.4.desc: "Telah dilaporkan bahwa [FROM.GetLeader] dari [FROM.GetNameDef] telah mendeklarasikan penyatuan seluruh bangsa di anak benua India, menandai babak baru dalam sejarah Asia, dan seluruh dunia. Banyak analis telah menyatakan bahwa penyatuan Hindustan dapat berdampak drastis pada politik dunia, dan berarti munculnya Negara Adidaya baru."
 GOE_RAJ_news.4.a: "Benar-benar negara adidaya baru"
 GOE_RAJ_news.4.b: "Mengerikan"
