 GOE_RAJ_generals.7.t: "[RAJ.GetNameDefCap] meminta pembelian perlengkapan"
 GOE_RAJ_generals.7.desc: "[RAJ.GetLeader] telah mengirimkan kepada kami permintaan untuk membeli peralatan pasokan dari [ENG.GetAdjective] industri sipil. Kami telah ditawari untuk dibayar komisi yang besar untuk mengatur perdagangan ini."
 GOE_RAJ_generals.7.a: "Kesepakatan yang saling menguntungkan!"
 GOE_RAJ_generals.7.b: "Kami tidak tertarik."
 GOE_RAJ_generals.8.t: "[ENG.GetNameDefCap] menerima!"
 GOE_RAJ_generals.8.desc: "[ENG.GetLeader] telah menanggapi proposal kami dan setuju untuk mengizinkan kami membeli peralatan pasokan dari mereka."
 GOE_RAJ_generals.8.a: "Hebat!"
 GOE_RAJ_generals.9.t: "[ENG.GetNameDefCap] menolak tawaran kami."
 GOE_RAJ_generals.9.desc: "[ENG.GetLeader] telah menanggapi proposal kami dan menyatakan tidak tertarik."
 GOE_RAJ_generals.9.a: "Sayang sekali."
