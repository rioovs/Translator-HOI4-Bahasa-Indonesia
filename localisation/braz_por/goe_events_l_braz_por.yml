l_braz_por:
 AFG_industrial_events.10.t: "[FROM.GetNameDefCap] Menawarkan Konsesi Minyak"
 AFG_industrial_events.10.desc: "Pemerintah [FROM.GetNameDef] telah mengusulkan usaha patungan dimana kami akan membantu mereka dalam pengembangan ladang minyak yang baru ditemukan dengan imbalan konsesi jangka panjang terhadap minyak yang diproduksi. Meskipun usulan tersebut tampak asli, kami tidak dapat menjamin bahwa kami akan mempertahankan akses terhadap minyak jika keinginan pemerintah [FROM.GetAdjective] berubah."
 AFG_industrial_events.10.a: "Ini demi kepentingan strategis kami."
 AFG_industrial_events.10.b: "Kita tidak perlu terlibat dalam urusan internal [FROM.GetAdjective]."
 AFG_industrial_events.11.t: "[FROM.GetNameDefCap] Menyetujui Kesepakatan Minyak"
 AFG_industrial_events.11.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk berinvestasi dalam pengembangan sumber daya minyak kita dengan imbalan bagian jangka panjang dari sumber daya tersebut setelah produksi dimulai."
 AFG_industrial_events.11.a: "Ini akan menjadi langkah besar menuju industrialisasi."
 AFG_industrial_events.12.t: "[FROM.GetNameDefCap] Menolak Kesepakatan Minyak"
 AFG_industrial_events.12.desc: "Pemerintah [FROM.GetAdjective] yang berpikiran sempit telah menolak proposal kami untuk pengembangan bersama sumber daya minyak kami."
 AFG_industrial_events.12.a: "Kami akan mencari mitra lain untuk proyek ini."
 AFG_industrial_events.13.t: "[FROM.GetNameDefCap] Menasionalisasi Industri Minyak"
 AFG_industrial_events.13.desc: "Pemerintah [FROM.GetAdjective] telah menasionalisasi industri minyak mereka meskipun kita telah melakukan investasi besar di dalamnya. Nasionalisasi telah menyebabkan terhentinya konsesi minyak jangka panjang yang telah kita sepakati. Kawasan ini kini menahan napas menunggu tanggapan kami."
 AFG_industrial_events.13.a: "Kami bertaruh dan kalah."
 AFG_industrial_events.13.b: "Sumber daya tersebut akan diambil kembali secara paksa."
 AFG_industrial_events.14.t: "[FROM.GetName] Menyatakan Perang terhadap [ROOT.GetName]"
 AFG_industrial_events.14.desc: "Rezim [FROM.GetAdjective] yang arogan telah menyatakan niat mereka untuk menggulingkan pemerintahan kita yang adil atas kejahatan yang memanfaatkan sumber daya alam kita untuk kepentingan rakyat kita sendiri. Belum jelas bagaimana mereka akan melaksanakan ancamannya, namun kita harus mulai mempersiapkan serangan militer ke wilayah kita."
 AFG_industrial_events.14.a: "Kita tidak bisa diintimidasi untuk tunduk."
 AFG_industrial_events.15.t: "[FROM.GetNameDefCap] Memberikan Sedikit Perlawanan terhadap Nasionalisasi"
 AFG_industrial_events.15.desc: "[FROM.GetNameDef] pemerintah telah melontarkan retorika keras mengenai nasionalisasi industri minyak. Namun belum ada tanda-tanda mereka akan melanjutkan masalah ini."
 AFG_industrial_events.15.a: "Masalahnya sudah ditutup."
 AFG_industrial_events.16.t: "[FROM.GetAdjective] Konsesi Minyak Ditangguhkan"
 AFG_industrial_events.16.desc: "Karena permusuhan baru-baru ini antara negara kita, pemerintah [FROM.GetNameDef] telah menangguhkan konsesi minyak kita di negara tersebut. Sekalipun permusuhan berakhir, mereka kemungkinan besar ingin mempertahankan kendali atas sumber daya mereka sendiri."
 AFG_industrial_events.16.a: "Itu sudah diduga."
 AFG_industrial_events.20.t: "[FROM.GetName] Peluang Investasi"
 AFG_industrial_events.20.desc: "Pemerintah [FROM.GetAdjective] sedang menjalankan kebijakan untuk meningkatkan investasi asing di negara tersebut dan telah menjangkau kepentingan kami sendiri. Meskipun tidak banyak keuntungan ekonomi yang bisa kita peroleh dari perjanjian ini, ini akan menjadi peluang bagus untuk mempengaruhi pemerintah [FROM.GetAdjective] agar mengikuti cara berpikir kita."
 AFG_industrial_events.20.a: "Memperkuat pengaruh kami di kawasan ini adalah hal yang penting."
 AFG_industrial_events.20.b: "[FROM.GetNonIdeologyName] tidak menjadi faktor dalam rencana jangka panjang kami"
 AFG_industrial_events.21.t: "[FROM.GetAdjective] Pemerintah Mengumumkan Investasi"
 AFG_industrial_events.21.desc: "Teman-teman kita di [FROM.GetNameDef] telah mengumumkan niat mereka untuk menginvestasikan sejumlah besar uang untuk industrialisasi negara kita. Meskipun hal ini memberikan manfaat besar bagi kita secara ekonomi, kita harus tetap waspada agar [FROM.GetAdjective] tidak memanfaatkan hal ini untuk mempengaruhi politik kita secara drastis."
 AFG_industrial_events.21.a: "Berita bagus!"
 AFG_industrial_events.22.t: "$bftb_greece.194.t$"
 AFG_industrial_events.22.desc: "$bftb_greece.194.desc$"
 AFG_industrial_events.22.a: "$bftb_greece.194.a$"
 AFG_industrial_events.30.t: "[FROM.GetNameDefCap] Mengubah Aliran Sungai Helmand"
 AFG_industrial_events.30.desc: "Dalam beberapa tahun terakhir, pemerintah [FROM.GetAdjective] telah mengatur sejumlah proyek bendungan dan irigasi di sepanjang sungainya. Hal ini mencapai puncaknya dengan sejumlah perubahan pada sungai Helmand, yang mengalir ke provinsi-provinsi Timur kita. Ketinggian air yang mengalir melintasi perbatasan semakin berkurang dari tahun ke tahun dan masyarakat kami menjadi khawatir bahwa mereka tidak dapat lagi memanfaatkan sungai jika hal ini terus berlanjut. Kita perlu memutuskan apakah akan menangani hal ini secara internal saja, atau membawa masalah ini ke [FROM.GetAdjective]s."
 AFG_industrial_events.30.a: "Kami akan menuntut negosiasi dengan [AFG.GetNonIdeologyName] mengenai pengembangan sungai."
 AFG_industrial_events.30.b: "Kita tidak bisa mengambil risiko krisis diplomatik saat ini."
 AFG_industrial_events.31.t: "[FROM.GetAdjective] Pemerintah Menuntut Negosiasi Sungai"
 AFG_industrial_events.31.desc: "[FROM.GetNameDefCap] pemerintah telah meminta negosiasi mengenai perubahan terbaru kami pada sungai Helmand. Mereka menyatakan bahwa bendungan dan sistem irigasi kita mengurangi aliran sungai melintasi perbatasan ke tingkat yang berbahaya. Beberapa orang di kabinet kami telah menyarankan pembentukan perjanjian untuk mengatur aliran air melintasi perbatasan. Hal ini mungkin berarti mengurangi manfaat dari perubahan yang kita lakukan saat ini di sepanjang sungai, namun juga akan mengurangi dampak yang ditimbulkan terhadap masyarakat [FROM.GetAdjective] di seberang perbatasan."
 AFG_industrial_events.31.a: "Mungkin kita bisa membuat perjanjian air?"
 AFG_industrial_events.31.b: "Air itu milik kita dan kita boleh berbuat sesuka kita dengannya."
 AFG_industrial_events_31_tt: "§RTindakan ini dapat menyebabkan perang dengan [FROM.GetNameDefCap]!§!"
 AFG_industrial_events.32.t: "[FROM.GetAdjective] Pemerintah Usulkan Perjanjian Air"
 AFG_industrial_events.32.desc: "[FROM.GetNameDefCap] pemerintah telah mengusulkan pembentukan perjanjian air antara negara-negara kita untuk mengatur jumlah air yang dapat mereka gunakan untuk proyek irigasi sambil menjamin aliran air minimum melintasi perbatasan ke kita. Meskipun usulan tersebut tampak masuk akal, kemungkinan besar hal ini mengharuskan kita untuk menerima sejumlah kerugian dibandingkan dengan apa yang telah kita nikmati secara historis."
 AFG_industrial_events.32.a: "Hal ini tampaknya masuk akal."
 AFG_industrial_events.32.b: "Hanya pembalikan perubahan sepenuhnya yang akan memuaskan kita."
 AFG_industrial_events.33.t: "[FROM.GetNameDefCap] Menolak Negosiasi Lebih Lanjut"
 AFG_industrial_events.33.desc: "Pemerintah [FROM.GetNameDefCap] telah menolak negosiasi lebih lanjut mengenai pembangunan di sepanjang sungai Helmand, dengan alasan bahwa air apa pun yang melewati wilayah mereka adalah milik mereka sesuai keinginan mereka. Mengalah pada titik ini mungkin pada akhirnya akan memberanikan mereka untuk sepenuhnya memutus aliran air di masa depan. Namun, eskalasi lebih lanjut pada saat ini akan mengharuskan kita untuk melakukan konflik bersenjata."
 AFG_industrial_events.33.a: "Kami tidak mempunyai sumber daya untuk melakukan eskalasi militer."
 AFG_industrial_events.33.b: "Maka kita akan memperbaiki situasi ini dengan kekerasan."
 AFG_industrial_events.34.t: "[FROM.GetNameDefCap] Menyetujui Perjanjian Air"
 AFG_industrial_events.34.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui perjanjian air antara negara-negara kita dengan syarat bahwa perjanjian tersebut menjamin aliran air minimum yang dapat diterima melintasi perbatasan ke negara-negara tersebut. Meskipun hal ini akan memaksa kita untuk tidak memanfaatkan bendungan kita sepenuhnya seperti yang telah kita lakukan selama ini, setidaknya hal ini akan menghindari kemungkinan konflik atas sungai Helmand dalam waktu dekat."
 AFG_industrial_events.34.a: "Krisis telah dapat dihindari."
 AFG_industrial_events.35.t: "[FROM.GetNameDefCap] Menolak Perjanjian Air"
 AFG_industrial_events.35.desc: "[FROM.GetNameDefCap] telah menolak untuk menerima perjanjian apa pun dan sebaliknya menuntut pembatalan total proyek apa pun di sepanjang sungai Helmand yang mengurangi aliran sungai ke sungai tersebut. Tampaknya mereka bersedia memaksakan keinginan mereka dengan kekerasan jika kami menolak."
 AFG_industrial_events.35.a: "Kita tidak bisa membiarkan hal ini meningkat lebih jauh."
 AFG_industrial_events.35.b: "Jika tidak masuk akal, tidak ada gunanya melanjutkan negosiasi."
 AFG_industrial_events.36.t: "[FROM.GetAdjective] Setuju untuk Membalikkan Perubahan Helmand"
 AFG_industrial_events.36.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk membatalkan banyak perubahan yang telah mereka lakukan pada sungai Helmand. Meskipun hal ini jelas menimbulkan kebencian yang besar terhadap kami, kami telah berhasil menghindari konfrontasi bersenjata untuk saat ini."
 AFG_industrial_events.36.a: "Tentang waktu."
 AFG_industrial_events.37.t: "[FROM.GetAdjective] Pasukan Bersiap untuk Invasi"
 AFG_industrial_events.37.desc: "[FROM.GetAdjective] angkatan bersenjata di sepanjang perbatasan kami dilaporkan sedang melakukan mobilisasi untuk melakukan invasi ke Lembah Sungai Helmand menyusul kegagalan negosiasi antara pemerintah kami. Tampaknya kita tidak punya pilihan selain memobilisasi kekuatan kita sendiri."
 AFG_industrial_events.37.a: "Peningkatan yang tidak masuk akal."
 AFG_industrial_events.38.t: "[FROM.GetAdjective] Pemerintah Diam Terhadap Perubahan Helmand"
 AFG_industrial_events.38.desc: "Meskipun terjadi negosiasi sengit selama berminggu-minggu antara pemerintah kita masing-masing, nampaknya [FROM.GetAdjective] sudah menyerah untuk mengganggu proyek bendungan dan irigasi kita untuk saat ini. Hanya waktu yang akan menentukan apakah mereka akan mengangkat masalah ini lagi di masa depan."
 AFG_industrial_events.38.a: "Tampaknya perubahannya aman, untuk saat ini."
 AFG_industrial_events.40.t: "Semakin Banyak Lulusan Universitas Menjadi Radikalisasi"
 AFG_industrial_events.40.desc: "Upaya kami untuk memperluas pendidikan tinggi telah menimbulkan reaksi negatif dari lulusan baru yang tidak mampu mendapatkan pekerjaan yang memanfaatkan keterampilan mereka. Hal ini menimbulkan kekecewaan di kalangan lulusan yang kini beralih ke politik radikal untuk melampiaskan rasa frustrasi mereka."
 AFG_industrial_events.40.a: "Perkembangan yang meresahkan."
 AFG_industrial_events.50.t: "Perlawanan Pashtun Berakar"
 AFG_industrial_events.50.desc: "Memanfaatkan koneksi lintas batas penduduk Pashtun, kami berhasil menggerakkan kerabat mereka di seberang perbatasan untuk melakukan protes anti-pemerintah dan menuntut persatuan di bawah pemerintahan kami."
 AFG_industrial_events.50.a: "Mereka akan segera dibebaskan!"
 AFG_industrial_events.51.t: "Perlawanan Pashtun di sepanjang Perbatasan [AFG.GetAdjective]"
 AFG_industrial_events.51.desc: "Para penggiat massa dari [FROM.GetNonIdeologyName] tampaknya melintasi perbatasan untuk menimbulkan keresahan di kalangan penduduk Pashtun. Ada pembicaraan untuk menyatukan Pashtun di bawah pemerintahan [FROM.GetAdjective], bukan di bawah pemerintahan kita sendiri."
 AFG_industrial_events.51.a: "Situasi yang meresahkan."
 AFG_industrial_events.52.t: "[FROM.GetAdjective] Pemerintah Usulkan Pemindahan Wilayah"
 AFG_industrial_events.52.desc: "Karena ketegangan yang sedang berlangsung di beberapa wilayah yang mayoritas penduduknya Pashtun, pemerintah [FROM.GetAdjective] berani mendekati kami dengan tawaran untuk mengambil kendali atas wilayah yang sulit diatur tersebut. Kecurigaan merajalela bahwa mereka berada di balik kerusuhan yang terjadi baru-baru ini."
 AFG_industrial_events.52.a: "Wilayah ini lebih merupakan persoalan daripada manfaatnya."
 AFG_industrial_events.52.b: "Ini adalah wilayah kedaulatan kami, apapun klaim mereka."
 AFG_industrial_events.53.t: "[FROM.GetAdjective] Pemerintah Memindahkan Wilayah"
 AFG_industrial_events.53.desc: "Terganggu oleh kekhawatiran yang lebih mendesak di tempat lain, pemerintah [FROM.GetNameDef] telah setuju untuk memindahkan sebagian wilayah mereka ke tempat dimana kerusuhan Pashtun semakin tidak terkendali. Namun, kita mungkin mengalami kerusakan yang tidak dapat diperbaiki pada hubungan dengan tetangga kita yang [FROM.GetAdjective] karena campur tangan kita dalam urusan dalam negeri mereka."
 AFG_industrial_events.53.a: "Bagus"
 AFG_industrial_events.54.t: "[FROM.GetNameDefCap] Menolak Pemindahan Wilayah"
 AFG_industrial_events.54.desc: "Meskipun kami dengan hati-hati memanipulasi situasi di sepanjang perbatasan dengan [FROM.GetNameDef], pemerintah mereka menolak menyerahkan kendali atas wilayah Pashtun mana pun kepada kami. Tampaknya satu-satunya cara kami untuk merebut wilayah ini adalah dengan meningkatkan situasi dengan ancaman intervensi militer."
 AFG_industrial_events.54.a: "Kami tidak tertarik untuk memperburuk situasi ini."
 AFG_industrial_events.54.b: "Kami tidak takut untuk membebaskan wilayah ini dengan kekerasan."
 AFG_industrial_events.55.t: "[FROM.GetNameDefCap] Mengancam Perang"
 AFG_industrial_events.55.desc: "Pemerintah [FROM.GetAdjective] telah mengeluarkan pernyataan yang mengutuk pendudukan kami atas tanah yang dianggap Pashtun dan mengindikasikan bahwa mereka siap untuk membebaskan wilayah tersebut dengan kekerasan jika diperlukan. Tentu saja mereka mungkin hanya menggertak, tetapi kita tidak tahu niat sebenarnya mereka saat ini."
 AFG_industrial_events.55.a: "Kami punya sedikit pilihan selain menenangkan mereka."
 AFG_industrial_events.55.b: "Kami siap mempertahankan wilayah kami dengan segala cara."
 AFG_industrial_events.56.t: "[FROM.GetNameDefCap] Menolak Ultimatum"
 AFG_industrial_events.56.desc: "Tidak mengherankan, orang-orang bodoh yang keras kepala di [FROM.Capital.GetCapitalVictoryPointName] menolak menyerahkan wilayah sah kami di sepanjang perbatasan. Oleh karena itu, kita harus melaksanakan ancaman serangan militer atau mengambil risiko kehilangan muka di panggung internasional."
 AFG_industrial_events.56.a: "Sudah saatnya kita melakukan atau mengancam."
 AFG_industrial_events.56.b: "Kita harus mundur."
 AFG_industrial_events.57.t: "[FROM.GetAdjective] Pemerintah Menyerahkan Klaim"
 AFG_industrial_events.57.desc: "Pemerintah [FROM.GetAdjective] akhirnya melihat alasannya dan memutuskan untuk meredakan situasi di sepanjang perbatasan dan mereka telah mencabut klaim atas wilayah perbatasan yang bermasalah dimana ketegangan meningkat baru-baru ini."
 AFG_industrial_events.57.a: "Kemenangan bagi hukum dan ketertiban internasional."
 AFG_industrial_events.58.t: "[FROM.GetNameDefCap] Menawarkan Persyaratan Perdamaian"
 AFG_industrial_events.58.desc: "[FROM.GetAdjective] diplomat telah mendekati kami dengan tawaran perdamaian dengan syarat kami mengakui kendali mereka atas wilayah Pashtun yang disengketakan di sepanjang perbatasan. Karena mereka saat ini menduduki wilayah tersebut, kami tidak punya jaminan bahwa mereka akan mampu mengusir mereka dalam waktu dekat. Namun, hal ini akan menjadi preseden bahwa [FROM.GetNameDef] dapat menggerogoti perbatasan kita sedikit demi sedikit."
 AFG_industrial_events.58.a: "Mari kita akhiri konflik ini."
 AFG_industrial_events.58.b: "Kami akan mengusir mereka dari tanah kami."
 AFG_industrial_events.59.t: "[FROM.GetNameDefCap] Menolak Syarat Perdamaian"
 AFG_industrial_events.59.desc: "Pemerintah [FROM.GetNameDef] telah menolak tawaran perdamaian kami baru-baru ini. Mereka jelas yakin bahwa mereka masih mempunyai kapasitas untuk mengusir kami dari wilayah yang menjadi hak kami."
 AFG_industrial_events.59.a: "Kemudian kami terus mempertahankan wilayah kami."
 AFG_political_events.01.t: "Proposal Unifikasi Asia Tengah"
 AFG_political_events.01.desc: "Perwakilan dari [FROM.GetNameDef] telah mendekati kami dengan proposal yang berani untuk reorganisasi Asia Tengah. Usulan mereka mengharuskan kita menyerahkan kendali sejumlah negara bagian di sepanjang perbatasan [FROM.GetAdjective] kepada mereka dan pembentukan federasi sosialis baru di bawah administrasi [FROM.Capital.GetCapitalVictoryPointName]. Hal ini memungkinkan kita membantu pembangunan negara penyangga yang kuat di kawasan yang dapat mengambil alih sebagian beban pertahanan kita di kawasan, sehingga membebaskan militer kita untuk ditempatkan di tempat lain."
 AFG_political_events.01.a: "Sebuah usulan yang menarik."
 AFG_political_events.01.b: "Kami memiliki rencana alternatif untuk wilayah tersebut."
 AFG_political_events.02.t: "[FROM.GetName] Menerima Proposal"
 AFG_political_events.02.desc: "[FROM.GetNameDefCap] telah menerima proposal kami untuk menyatukan Asia Tengah sebagai satu kesatuan politik di bawah kendali kami. Tampaknya era baru sedang menimpa masyarakat kita setelah puluhan tahun mengalami ketidakstabilan."
 AFG_political_events.02.a: "Luar biasa!"
 AFG_political_events.03.t: "[FROM.GetName] Menolak Usulan"
 AFG_political_events.03.desc: "[FROM.GetNameDefCap] telah menolak usulan kami untuk menyatukan Asia Tengah menjadi satu kesatuan politik di bawah kendali kami. Meskipun ini merupakan kemunduran besar, mimpi tersebut belumlah mati. Kita hanya perlu menunggu waktu dan menunggu kesempatan yang tepat untuk muncul."
 AFG_political_events.03.a: "Mereka tidak bisa menghalangi kita selamanya."
 AFG_political_events.10.t: "[FROM.GetNameDefCap] Mengusulkan Konfederasi"
 AFG_political_events.10.desc: "Pemerintah [FROM.GetNonIdeologyName] telah menawarkan proposal menarik untuk memperkuat kedua negara kita dengan membentuk konfederasi satu sama lain. Hal ini akan membuat kita membuka perbatasan satu sama lain dalam satu pasar ekonomi dan menciptakan kebijakan luar negeri bersama di panggung dunia. Namun, hal ini pada akhirnya akan membatasi kebebasan bertindak kita."
 AFG_political_events.10.a: "Kami mendukung inisiatif ini."
 AFG_political_events.10.b: "Kami telah mengabaikan satu tuan dan tidak membutuhkan tuan yang lain."
 AFG_political_events.11.t: "[FROM.GetName] Setuju dengan Konfederasi"
 AFG_political_events.11.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui proposal konfederasi kami. Kita sekarang dapat memulai proses mengintegrasikan dua sistem politik dan ekonomi menjadi satu. Harapannya, hal ini dapat menjadi pencegahan bagi musuh-musuh regional kita di masa depan."
 AFG_political_events.11.a: "Luar biasa!"
 AFG_political_events.12.t: "[FROM.GetName] Menolak Konfederasi"
 AFG_political_events.12.desc: "Pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk membentuk konfederasi kedua negara. Ini merupakan kemunduran besar dalam kebijakan luar negeri bagi kami dan telah menimbulkan kekhawatiran mengenai seperti apa hubungan jangka panjang kami dengan [FROM.GetNameDef] sekarang."
 AFG_political_events.12.a: "Sebuah peluang yang terlewatkan."
 AFG_political_events.20.t: "[FROM.GetName] Mencari Investasi"
 AFG_political_events.20.desc: "Para diplomat [FROM.GetNameDefCap] telah mendekati kami dengan proposal ekonomi untuk berinvestasi dalam perekonomian mereka. Mereka berpendapat bahwa jika kita mengembangkan industri di sana untuk mereka, kita akan memperoleh keuntungan dari ekspor di masa depan. Lebih lanjut, mereka menjelaskan bahwa hal ini pasti akan mengecewakan [SOU.GetAdjective] dan [ENG.GetAdjective] yang secara historis merupakan pemain kunci dalam [FROM.GetNonIdeologyName]."
 AFG_political_events.20.a: "Merusak pengaruh musuh di negara ini akan menguntungkan kita."
 AFG_political_events.20.b: "Kami tidak tertarik pada [FROM.GetNonIdeologyName]"
 AFG_political_events.21.t: "[FROM.GetName] Setuju untuk Berinvestasi dalam Perekonomian kita"
 AFG_political_events.21.desc: "[FROM.GetAdjective] diplomat telah mengumumkan bahwa pemerintah mereka mendukung proposal kami untuk berinvestasi di [ROOT.GetNonIdeologyName]. Insinyur dan pengusaha sudah mulai membangun industri baru di seluruh negeri."
 AFG_political_events.21.a: "Kontribusi yang besar!"
 AFG_political_events.22.t: "[FROM.GetName] Menolak Berinvestasi dalam Perekonomian kita"
 AFG_political_events.22.desc: "[FROM.GetAdjective] diplomat telah mengumumkan bahwa pemerintah mereka menolak untuk berinvestasi di [ROOT.GetNonIdeologyName]. Mereka berpendapat bahwa motivasi jangka panjang kita masih belum jelas dan mereka tidak ingin menawarkan bantuan ekonomi kepada negara yang pada akhirnya mungkin jatuh ke dalam pengaruh musuh mereka."
 AFG_political_events.22.a: "Kami akan mengingat ini."
 AFG_political_events.30.t: "Masa Depan [ROOT.GetNonIdeologyName]"
 AFG_political_events.30.desc: "Setelah bertahun-tahun melakukan reformasi politik dan kompromi antara berbagai faksi di negara kita, kini kita memiliki kesempatan untuk melepaskan diri dari belenggu monarki untuk selamanya. Namun, kita harus mendefinisikan kembali siapa kita sebagai sebuah bangsa."
 AFG_political_events.30.a: "Ini adalah awal yang baru dan Kami akan menjadi Republik [ROOT.GetAdjective]"
 AFG_political_events.30.b: "Kami adalah bangsa Pashtun di atas segalanya"
 AFG_political_events.30.c: "Perpaduan demokrasi dan Islam adalah jalan ke depan"
 AFG_political_events.40.t: "[FROM.GetNameDefCap] Mengeluarkan Ultimatum"
 AFG_political_events.40.desc: "Perwakilan dari kedutaan [FROM.GetAdjective] telah mengeluarkan ultimatum kepada pemerintah kita. Mereka menuntut agar kita membatasi pengaruh asing di negara kita yang dapat membahayakan kepentingan [FROM.GetAdjective], atau menghadapi kemungkinan intervensi militer untuk menggantikan pemerintah kita."
 AFG_political_events.40.a: "Kami tidak dalam posisi untuk berdebat."
 AFG_political_events.40.b: "Ini adalah sebuah gertakan dan kami tidak akan terintimidasi olehnya."
 AFG_political_events.41.t: "[FROM.GetNameDefCap] Mengabulkan Tuntutan"
 AFG_political_events.41.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui tuntutan kami untuk mengakhiri campur tangan asing di negara mereka yang dapat merugikan kepentingan kami di wilayah tersebut. Meskipun mereka tentu saja tidak senang dengan intervensi kami, tampaknya mereka tidak mempunyai keinginan untuk melakukan perlawanan dalam waktu dekat."
 AFG_political_events.41.a: "Kami akan terus mengamatinya dengan cermat."
 AFG_political_events.42.t: "[FROM.GetNameDefCap] Menolak Tuntutan"
 AFG_political_events.42.desc: "Pemerintah [FROM.GetAdjective] telah menolak tuntutan kami untuk mengakhiri campur tangan asing di negara mereka. Mereka berpendapat bahwa kita tidak mempunyai hak untuk mencampuri urusan dalam negeri mereka dan pengaturan yang telah mereka negosiasikan dengan negara lain."
 AFG_political_events.42.a: "Kita harus menggunakan cara alternatif untuk menyelaraskannya."
 AFG_political_events.42.b: "Mereka meninggalkan kita tanpa pilihan."
 AFG_political_events.43.t: "Campur Tangan Asing dalam [FROM.GetNameDefCap]"
 AFG_political_events.43.desc: "Duta Besar kami untuk [FROM.GetNameDefCap] telah memberi tahu kami bahwa baru-baru ini ada semacam perjanjian yang ditandatangani dengan perwakilan negara lain di [FROM.Capital.GetCapitalVictoryPointName]. Meskipun rincian perjanjian tersebut tidak jelas, tidak ada keraguan bahwa pemerintahan [FROM.GetAdjective] dipengaruhi oleh negara-negara yang mungkin ingin melemahkan kepentingan kita di wilayah tersebut."
 AFG_political_events.43.a: "Kami akan mengawasi situasinya."
 AFG_political_events.51.t: "$AFG_amunullah_khan$ dari [AFG.GetNonIdeologyName] Meminta Bantuan"
 AFG_political_events.51.desc: "Dalam pesan rahasia, $AFG_amunullah_khan$, mantan penguasa [FROM.GetNonIdeologyName], telah menghubungi pemerintah kami untuk mencari dukungan bagi pemulihan takhtanya. Ia berjanji bahwa, dengan dukungan Jerman, ia akan membangun negara yang kuat dan modern yang selaras dengan kepentingan kita."
 AFG_political_events.51.a: "Kita bisa menggunakan lebih banyak sekutu di kawasan ini."
 AFG_political_events.51.b: "Mengapa ikut campur di negeri yang begitu jauh?"
 AFG_political_events.52.t: "[FROM.GetNameDefCap] Menolak Rencana"
 AFG_political_events.52.desc: "Pemerintah [FROM.GetAdjective] telah menanggapi permintaan kami dan dengan menyesal menolak memberikan dukungan untuk pemulihan takhta $AFG_amunullah_khan$. Mengutip kekhawatiran atas potensi keterikatan dan iklim geopolitik saat ini, [FROM.GetAdjective] telah memutuskan untuk fokus pada prioritas strategis lainnya."
 AFG_political_events.52.a: "Beraninya mereka mengkhianati kita!"
 AFG_political_events.53.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 AFG_political_events.53.desc: "Menanggapi permintaan kami, pemerintah [FROM.GetName] telah setuju untuk mendukung pemulihan $AFG_amunullah_khan$ ke tahta [ROOT.GetNonIdeologyName]. Dukungan ini akan mencakup dukungan dan peralatan militer untuk memastikan keberhasilan upaya kami."
 AFG_political_events.53.a: "Masa depan [AFG.GetNonIdeologyName] adalah milik kita!"
 AFG_political_events.54.t: "[GER.GetAdjective] Dukungan Tiba"
 AFG_political_events.54.desc: "Seperti yang telah disepakati sebelumnya, peralatan [FROM.GetAdjective] telah tersedia bagi kami sejak pecahnya perang saudara. Agen mereka di [ROOT.Capital.GetCapitalVictoryPointName] juga telah meyakinkan kami bahwa pasukan rahasia [FROM.GetAdjective] akan segera mencapai negara tersebut untuk membantu kami dalam perjuangan."
 AFG_political_events.54.a: "Luar biasa!"
 AFG_political_events.60.t: "$AFG_turko_persian_union$ Undang"
 AFG_political_events.60.desc: "Pemerintahan [FROM.GetNameDef] sedang membentuk entitas politik baru yang mereka sebut persatuan Turki-Persia. Tampaknya ini merupakan persenjataan warisan Turki dan Persia untuk menyatukan seluruh masyarakat kita di bawah satu pemerintahan. Langkah pertama yang dilakukan adalah pembentukan aliansi militer di antara kita. Jika kita menerimanya, tidak diragukan lagi mereka akan mendorong integrasi yang lebih besar di bawah kepemimpinan mereka pada saatnya nanti."
 AFG_political_events.60.a: "Kita akan menerima takdir kita bersama!"
 AFG_political_events.60.b: "Siapakah mereka yang berbicara atas nama rakyat [ROOT.GetAdjective]?"
 AFG_political_events.61.t: "[FROM.GetNonIdeologyName] Bergabung $AFG_turko_persian_union$"
 AFG_political_events.61.desc: "[FROM.GetNameDefCap] telah setuju untuk bergabung dengan Uni Turki-Persia kami. Bersama-sama, militer kita akan mampu mencegah agresi musuh bersama dengan lebih baik. Namun yang lebih penting, kita mempunyai pijakan untuk melemahkan kemandirian mereka seiring berjalannya waktu."
 AFG_political_events.61.a: "Hebat!"
 AFG_political_events.62.t: "[FROM.GetNonIdeologyName] Menolak $AFG_turko_persian_union$"
 AFG_political_events.62.desc: "[FROM.GetNameDefCap] telah menolak keanggotaan Uni Turki-Persia. Mereka marah atas keangkuhan kami dalam berusaha mewakili seluruh masyarakat [TUR.GetAdjective] dan [PER.GetAdjective]."
 AFG_political_events.62.a: "Mereka akan melihat kesalahan mereka pada waktunya."
 AFG_political_events.62.b: "Jika mereka tidak bersama kita, mereka adalah musuh kita!"
 AFG_political_influence_major_warning_tt: "Jika [FROM.GetNameDefCap] memperoleh lebih dari §R40%§! dukungan untuk ideologi yang tidak sejalan dengan ideologi kita, kita akan memperoleh kemampuan untuk melakukan intervensi dan mungkin menyerang mereka melalui keputusan §Y$AFG_foreign_intervention_category$§!"
 AFG_political_events_51_tt: "Ketika perang saudara [AFG.GetNonIdeologyName] dimulai:"
 AFG_political_events.70.t: "[FROM.GetNonIdeologyName] Menolak Garis Durand"
 AFG_political_events.70.desc: "Garis Durand, yang didirikan pada tahun 1893 sebagai perbatasan antara British India dan [FROM.GetNonIdeologyName], telah lama menjadi sumber perselisihan. Dengan bangkitnya nasionalisme [FROM.GetAdjective] dan keinginan untuk menyatukan suku Pashtun di kedua sisi perbatasan, pemerintah [FROM.GetLeader] secara resmi menolak Garis Durand. [FROM.Capital.GetCapitalVictoryPointName] sekarang menuntut negosiasi ulang perbatasan, dengan alasan keluhan sejarah dan pembagian tanah Pashtun yang tidak adil. Mereka bahkan mengancam perang jika kita gagal mencapai kesepakatan."
 AFG_political_events.70.a: "Kita tidak mampu menanggung konflik saat ini."
 AFG_political_events.70.b: "Kami tidak sanggup berperang, tapi kami memerlukan persetujuan dari [ROOT.OVERLORD.capital.GetCapitalVictoryPointName]."
 AFG_political_events.70.c: "Perbatasan adalah masalah yang sudah diselesaikan dan tidak akan dibahas lebih lanjut."
 AFG_political_events.71.t: "[FROM.GetNameDefCap] Menyetujui Negosiasi Ulang Perbatasan"
 AFG_political_events.71.desc: "Melawan segala rintangan, [FROM.GetNameDef] telah menyetujui tuntutan kami untuk melakukan negosiasi ulang Jalur Durand. Di bawah tekanan yang sangat besar dan tidak mau mengambil risiko konflik berkepanjangan di wilayah tersebut, [FROM.GetAdjective] telah setuju untuk mengubah perbatasan, mengakui klaim sah kami atas tanah Pashtun. Kemenangan diplomatik ini tidak hanya mempersatukan rakyat kita tetapi juga memperkuat legitimasi pemerintahan [ROOT.GetLeader]. [ROOT.GetNameDef] berdiri lebih bersatu dan lebih kuat dari sebelumnya."
 AFG_political_events.71.a: "Kemenangan gemilang bagi Afghanistan!"
 AFG_political_events.72.t: "[FROM.GetNameDef] Mengusulkan Konsesi Teritorial"
 AFG_political_events.72.desc: "Situasi politik di [AFG.GetNameDef] telah mencapai titik kritis. Pemerintah mereka secara resmi menolak Garis Durand dan menuntut negosiasi ulang perbatasan untuk menyatukan suku Pashtun. Pemerintah [AFG.GetAdjective] telah menyatakan dengan jelas bahwa kegagalan untuk memenuhi tuntutan ini akan mengakibatkan deklarasi perang. Menghadapi kemungkinan konflik yang merugikan dan berkepanjangan, [FROM.GetNameDef] telah mengusulkan penyerahan wilayah yang disengketakan kepada [AFG.GetNameDef] dalam upaya menjaga stabilitas regional dan menghindari eskalasi lebih lanjut."
 AFG_political_events.72.a: "Kita harus menghindari terlibat dalam konflik lain."
 AFG_political_events.72.b: "Kami tidak akan diancam untuk memberikan konsesi teritorial."
 AFG_political_events.73.t: "[FROM.GetNameDefCap] Menerima Konsesi Teritorial"
 AFG_political_events.73.desc: "Mengingat ketegangan global saat ini dan potensi konflik yang merugikan di wilayah tersebut, [FROM.Capital.GetCapitalVictoryPointName] telah memutuskan bahwa adalah kepentingan terbaik mereka untuk menyerahkan wilayah yang disengketakan kepada [AFG.GetNonIdeologyName]. Kita diperintahkan untuk mematuhi arahan ini untuk menjaga stabilitas dan menghindari perang yang tidak perlu."
 AFG_political_events.73.a: "Sebuah resolusi yang pragmatis."
 AFG_political_events.74.t: "[FROM.GetNameDefCap] Menolak Konsesi Teritorial"
 AFG_political_events.74.desc: "Tuntutan dari [AFG.GetNonIdeologyName] untuk menegosiasikan ulang Jalur Durand dan menyerahkan wilayah Pashtun mendapat penolakan keras dari [FROM.Capital.GetCapitalVictoryPointName]. Meskipun terdapat potensi konflik, pemerintah [FROM.GetAdjective] telah memutuskan bahwa menyerahkan wilayah-wilayah tersebut akan menjadi preseden berbahaya dan melemahkan posisi mereka di wilayah tersebut. Kami diinstruksikan untuk menolak tuntutan [AFG.GetNonIdeologyName] dan bersiap mempertahankan perbatasan jika diperlukan."
 AFG_political_events.74.a: "Kami akan melakukan apa yang harus kami lakukan."
 AFG_political_events.75.t: "Menolak Renegosiasi Perbatasan"
 AFG_political_events.75.desc: "Terlepas dari klaim kami dan keinginan jelas masyarakat Pashtun untuk bersatu, [FROM.GetNameDef] langsung menolak untuk merundingkan ulang perbatasan. Tanggapan mereka tegas, menolak gagasan penyerahan wilayah dan peringatan terhadap eskalasi lebih lanjut. Tampaknya satu-satunya jalan untuk membebaskan wilayah tersebut adalah melalui konflik."
 AFG_political_events.75.a: "Maka kita harus bersiap untuk perang."
 AFG_political_events.80.t: "[FROM.GetNameDefCap] Menuntut Penyelarasan Kebijakan Luar Negeri"
 AFG_political_events.80.desc: "Dalam langkah berani untuk menegaskan dominasi di dunia Islam, [FROM.GetNameDef] telah mengeluarkan ultimatum. Mereka menuntut kita untuk bergabung dengan aliansi mereka yang semakin luas, yang bertujuan untuk menyatukan dan memperkuat negara-negara Islam di bawah kepemimpinan [FROM.GetAdjective]. Kegagalan untuk memenuhi tuntutan ini tampaknya akan mengakibatkan invasi besar-besaran."
 AFG_political_events.80.a: "Ini demi kepentingan terbaik kami."
 AFG_political_events.80.b: "Mereka tidak punya hak untuk mendikte kebijakan kepada kami."
 AFG_political_events.81.t: "[FROM.GetNameDefCap] Setuju untuk Bergabung"
 AFG_political_events.81.desc: "Menanggapi ultimatum kami, [FROM.GetNameDef] memutuskan untuk menyetujui tuntutan kami. Mereka setuju untuk bergabung dengan aliansi kami, mengakui kekuatan dan kepemimpinan [ROOT.GetNameDef] dalam menyatukan dunia Islam. Langkah strategis ini tidak hanya memperluas pengaruh kami namun juga memperkuat posisi kami sebagai kekuatan dominan di kawasan. Dengan adanya mereka di pihak kita, visi kita tentang front persatuan Islam semakin mendekati kenyataan."
 AFG_political_events.81.a: "Mereka tidak punya pilihan."
 AFG_political_events.82.t: "[FROM.GetNameDefCap] Menolak Bergabung"
 AFG_political_events.82.desc: "Bertentangan dengan ultimatum kami, [FROM.GetNameDef] telah menolak permintaan kami untuk bergabung dengan aliansi kami. Pemerintah Irak tetap teguh pada kemerdekaannya dan tidak mau tunduk pada otoritas kami."
 AFG_political_events.82.a: "Kemudian mereka akan dihancurkan."
 AFG_political_events.85.t: "[FROM.GetNameDefCap] Meminta Perlindungan"
 AFG_political_events.85.desc: "Dalam komunikasi rahasia, pemerintah [FROM.GetAdjective] telah menghubungi kami dengan proposal pakta pertahanan. Mereka mencari kesepakatan bersama untuk membela satu sama lain jika terjadi perang, dan mengakui manfaat strategis dari kemitraan dengan kita dibandingkan musuh-musuh kita. Ambisi Afghanistan untuk menjadi kekuatan dominan di dunia Islam dapat sejalan dengan kepentingan geopolitik kita yang lebih luas."
 AFG_political_events.85.a: "Ini bisa menjadi keuntungan bagi kita."
 AFG_political_events.85.b: "Kami tidak akan terjebak dalam politik [FROM.GetAdjective]."
 AFG_political_events.86.t: "[FROM.GetNameDefCap] Setuju dengan Pakta"
 AFG_political_events.86.desc: "[FROM.GetNameDefCap] telah menyetujui proposal kami untuk pakta pertahanan. Pakta ini memastikan bahwa kedua negara akan saling mendukung jika terjadi perang, sehingga memperkuat posisi strategis kita. Dengan dukungan kekuatan militer [FROM.GetNameDef], ambisi kami untuk menjadi kekuatan dominan di dunia Islam kini lebih dapat dicapai."
 AFG_political_events.86.a: "Kemudian kami akan memulai ekspansi kami di seluruh wilayah."
 AFG_political_events.87.t: "[FROM.GetNameDefCap] Menolak Pakta"
 AFG_political_events.87.desc: "Dalam tanggapannya yang hati-hati, [FROM.GetNameDef] telah menolak proposal pakta pertahanan kami. Meskipun menyadari potensi manfaat strategisnya, mereka memilih untuk memprioritaskan kemitraan lain dan tetap berhati-hati dalam berkomitmen pada perjanjian tersebut dengan kami saat ini."
 AFG_political_events.87.a: "Ini akan memakan waktu, tapi kami akan mencapai tujuan kami sendiri."
 AFG_political_events.90.t: "[AFG.GetNameDefCap] Mendukung Reaksioner di Asia Tengah."
 AFG_political_events.90.desc: "Muncul laporan bahwa [AFG.GetNameDef], di bawah pemerintahan [AFG.GetLeader], secara aktif mempromosikan aktivitas reaksioner di republik-republik Asia Tengah kita. Agen [AFG.GetAdjective] diyakini menimbulkan keresahan dan mendorong sentimen anti-[ROOT.GetAdjective] di kalangan penduduk setempat. Perilaku subversif ini merupakan tantangan langsung terhadap otoritas kita di kawasan dan mengancam stabilitas wilayah kita di Asia Tengah. Kita harus melawan campur tangan asing ini dan mempertahankan kendali atas republik kita."
 AFG_political_events.90.a: "Kita harus mengerahkan pasukan keamanan tambahan untuk meredam kerusuhan."
 AFG_political_events_90_tt: "Membuka keputusan §Y[AFG_get_turkik_people_name_key]§! untuk menghilangkan sel-sel resistensi di negara-negara Asia Tengah. §RJika kita gagal menghilangkan sel-sel perlawanan dan berperang dengan [FROM.GetNameDef], negara akan memberontak melawan kita!§!"
 AFG_political_events.91.t: "Pemberontakan Republik Asia Tengah"
 AFG_political_events.91.desc: "Dengan pecahnya perang dengan [AFG.GetNameDef], situasi di republik-republik Asia Tengah kita telah mencapai titik kritis. Terinspirasi oleh campur tangan [AFG.GetAdjective] dan didorong oleh konflik yang terjadi saat ini, beberapa republik memberontak, mendeklarasikan kemerdekaan mereka dari [ROOT.GetNameDef]. Pemberontakan yang meluas ini mengancam akan mengganggu stabilitas seluruh kawasan dan semakin menipiskan sumber daya militer kita. Kita harus bertindak cepat untuk memadamkan pemberontakan dan memulihkan ketertiban, atau kita berisiko kehilangan kendali atas Asia Tengah."
 AFG_political_events.91.a: "Kita harus menekan pemberontakan dan memulihkan otoritas kita."
 AFG_political_events.95.t: "[GER.GetAdjective] Pasukan Aktif di [FROM.GetNonIdeologyName]"
 AFG_political_events.95.desc: "Perang saudara baru-baru ini yang melanda negara [AFG.GetNonIdeologyName] yang terkepung telah menimbulkan kekhawatiran di [ROOT.Capital.GetCapitalVictoryPointName]. Namun, situasi ini menjadi semakin mendesak karena laporan dari wilayah tersebut menunjukkan bahwa pasukan [GER.GetAdjective] membantu pasukan [AFG.GetLeader] untuk menggulingkan pemerintah yang sah. Kami hanya dapat berasumsi bahwa hal ini menunjukkan adanya keselarasan antara [AFG.GetLeader] dengan [GER.GetNameDef] yang akan menjadi ancaman besar bagi kepentingan kami di wilayah tersebut. Oleh karena itu, anggota angkatan bersenjata telah menyusun rencana untuk mendapatkan persetujuan kami yang memungkinkan kami secara diam-diam membantu pemerintah yang sah dan mencegah pengambilalihan negara oleh fasis."
 AFG_political_events.95.a: "Hal ini penting untuk keamanan regional, disetujui."
 AFG_political_events.95.b: "[AFG.GetNonIdeologyName] bukan urusan kami."
 AFG_political_events.100.t: "Negara Penyangga Khorasan"
 AFG_political_events.100.desc: "Pemerintah [FROM.GetNameDef], telah mengidentifikasi kebutuhan strategis untuk membentuk negara penyangga di [PER.GetNonIdeologyName] Timur. Untuk tujuan ini, mereka secara resmi meminta pengalihan kendali atas sejumlah wilayah di Iran Timur untuk memfasilitasi pembentukan negara Khorasan. Mereka berpendapat bahwa negara penyangga baru ini akan berfungsi sebagai kekuatan stabilisasi di kawasan."
 AFG_political_events.100.a: "Jika hal ini mengarah pada perdamaian jangka panjang, siapakah yang bisa kita bantah?"
 AFG_political_events.100.b: "Kami tidak akan melakukan hal seperti itu."
 AFG_political_events.101.t: "[FROM.GetNameDefCap] Setuju Pembentukan Negara Penyangga"
 AFG_political_events.101.desc: "Pemerintah [FROM.GetNameDef] telah setuju untuk mengalihkan kendali atas wilayah yang ditunjuk di [PER.GetNonIdeologyName] Timur. Pemindahan ini akan memungkinkan kita untuk membangun negara penyangga Khorasan sesuai rencana."
 AFG_political_events.101.a: "Sisi Barat kita akhirnya aman."
 AFG_political_events.102.t: "[FROM.GetNameDefCap] Menolak Usulan Negara Penyangga"
 AFG_political_events.102.desc: "Pemerintah [FROM.GetNameDef] dengan menyesal menolak proposal kami untuk mengalihkan kendali atas wilayah yang diminta di [PER.GetNonIdeologyName] Timur. Mereka telah menyatakan keprihatinan atas implikasi transfer tersebut dan potensi dampaknya terhadap stabilitas regional."
 AFG_political_events.102.a: "Kami akan melaksanakan agenda kami dengan menggunakan cara-cara alternatif."
 AFG_political_events.110.t: "[FROM.GetNameDefCap] Meminta Wilayah"
 AFG_political_events_110_desc_balochistan: "Pemerintah [FROM.GetNameDef] telah meminta wilayah Balochistan. Mereka mengklaim bahwa tanah-tanah tersebut seharusnya menjadi milik mereka dan berpendapat bahwa perbatasan yang ada saat ini membagi masyarakat dan wilayah mereka secara tidak adil."
 AFG_political_events_110_desc_durand: "Pemerintah [FROM.GetNameDef] telah meminta sejumlah wilayah kami di sepanjang perbatasannya. Mereka mengklaim bahwa tanah-tanah tersebut seharusnya menjadi milik mereka dan berpendapat bahwa perbatasan yang ada saat ini membagi masyarakat dan wilayah mereka secara tidak adil."
 AFG_political_events.110.a: "Jika itu menjauhkan mereka dari kita."
 AFG_political_events.110.b: "Kami tidak akan memberikan satu inci pun."
 AFG_political_events.111.t: "[FROM.GetNameDefCap] Menyetujui Penyerahan Wilayah"
 AFG_political_events.111.desc: "[FROM.GetNameDefCap] telah setuju untuk mentransfer negara bagian yang kami minta dari mereka. Setelah perselisihan selama beberapa dekade, kita akhirnya dapat menyambut kembali orang-orang kita yang telah lama hilang."
 AFG_political_events.111.a: "Luar biasa!"
 AFG_political_events.112.t: "[FROM.GetNameDefCap] Menolak Menyerahkan Wilayah"
 AFG_political_events.112.desc: "[FROM.GetNameDefCap] telah menolak untuk mentransfer negara bagian yang kami minta dari mereka. Tampaknya kita harus mencari cara alternatif untuk mendapatkan kembali wilayah yang menjadi hak kita di masa depan."
 AFG_political_events.112.a: "Itu patut dicoba."
 AFG_political_events.112.b: "Maka kita akan mengambilnya dengan paksa."
 AFG_political_events.120.t: "[FROM.GetNameDefCap] Meminta Dukungan"
 AFG_political_events.120.desc: "Perwakilan gerakan komunis di [AFG.GetNonIdeologyName] telah menghubungi kami untuk meminta dukungan dalam revolusi mereka yang sedang berkembang. Meskipun masih bisa diperdebatkan apakah negara yang terkepung mampu mendukung perekonomian sosialis, kita tidak bisa mengabaikan pentingnya mendorong batas-batas sosialisme lebih jauh ke Asia Tengah dan sekitarnya."
 AFG_political_events.120.a: "Hal ini sejalan dengan tujuan strategis kami di kawasan."
 AFG_political_events.120.b: "[SOU.GetAdjective] darah tidak akan pernah tertumpah di [FROM.GetNonIdeologyName]!"
 AFG_political_events.121.t: "[FROM.GetNameDefCap] Setuju Datang Membantu Kami"
 AFG_political_events.121.desc: "Sebagai wujud komitmen mereka terhadap cita-cita solidaritas internasional, [FROM.GetNameDefCap] telah setuju untuk membantu kami dalam perjuangan kami. Mereka memberi tahu kami bahwa sukarelawan bersenjata lengkap dari angkatan bersenjata mereka akan berangkat menuju kami dalam waktu dekat."
 AFG_political_events.121.a: "Terima kasih kawan!"
 AFG_political_events.122.t: "[FROM.GetNameDefCap] Menahan Dukungan"
 AFG_political_events.122.desc: "[FROM.GetNameDefCap] telah menolak permohonan bantuan kami. Mereka berpendapat bahwa revolusi kita terlalu dini dan pasti akan gagal. Masyarakat kita kemungkinan besar akan menyimpan kebencian yang mendalam terhadap [FROM.GetNameDef] di masa mendatang."
 AFG_political_events.122.a: "Pengkhianatan terhadap cita-cita sosialis."
 AFG_political_events.130.t: "[FROM.GetNameDefCap] Meminta Wilayah"
 AFG_political_events.130.desc: "Pemerintah [FROM.GetNonIdeologyName] telah berkonsultasi dengan kami mengenai usulan untuk memperkuat negaranya dengan membentuk konfederasi dengan sebagian wilayah kami di sepanjang perbatasan [ROOT.GetAdjective]. Hal ini akan membuat kita menyesuaikan perbatasan kita namun dapat membantu menciptakan sekutu yang kuat di wilayah tersebut."
 AFG_political_events.130.a: "Kami mendukung inisiatif ini."
 AFG_political_events.130.b: "Mereka bodoh bahkan berkonsultasi dengan kami mengenai hal ini."
 AFG_political_events.131.t: "[FROM.GetName] Setuju dengan Konfederasi"
 AFG_political_events.131.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui proposal konfederasi kami. Kami sekarang dapat memulai proses mengintegrasikan wilayah baru kami ke dalam sistem politik dan ekonomi kami. Harapannya, hal ini dapat menjadi pencegahan bagi musuh-musuh regional kita di masa depan."
 AFG_political_events.131.a: "Luar biasa!"
 AFG_political_events.132.t: "[FROM.GetName] Menolak Konfederasi"
 AFG_political_events.132.desc: "Pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk membentuk konfederasi. Ini merupakan kemunduran besar dalam kebijakan luar negeri bagi kami dan telah menimbulkan kekhawatiran mengenai seperti apa hubungan jangka panjang kami dengan [FROM.GetNameDef] sekarang."
 AFG_political_events.132.a: "Sebuah peluang yang terlewatkan."
 AFG_political_events.140.t: "Hasil Pemilu"
 AFG_political_events.140.desc: "Pemilu kali ini agak kacau karena kurangnya pengalaman negara ini menghadapi peristiwa-peristiwa semacam itu. Namun, beberapa kandidat yang mencalonkan diri pada platform yang luas telah muncul sebagai kandidat terdepan. Namun ketika TPS ditutup, tampaknya para pemilih terpengaruh oleh:"
 AFG_political_events.140.a: "Pesona awet muda Mohammad Daoud Khan."
 AFG_political_events.140.b: "Sardar Shah Mahmud Khan yang selalu konsisten."
 AFG_political_events.140.c: "Muhammad Ibrahim Khan yang sangat tradisional."
 AFG_political_events.150.t: "[FROM.GetNameDefCap] Meminta Perjanjian Pertahanan"
 AFG_political_events.150.desc: "Pemerintah [FROM.GetNonIdeologyName] telah menghubungi kami mengenai proposal untuk memperkuat kedua negara kami dengan mengintegrasikan ekonomi militer kami pada tingkat yang kecil. Ini berarti kita berdua diharuskan untuk saling membantu jika terjadi perang, tapi mungkin itu adalah harga yang bisa diterima untuk kerja sama yang lebih erat?"
 AFG_political_events.150.a: "Itu hanya akan memperkuat kita"
 AFG_political_events.150.b: "Mereka bodoh sekali bahkan mendekati kita dalam hal ini"
 AFG_political_events.151.t: "[FROM.GetName] Setuju untuk Memperluas Perjanjian"
 AFG_political_events.151.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui proposal pertahanan kami. Kita sekarang dapat memulai proses mengintegrasikan kompleks militer kita satu sama lain. Harapannya, hal ini dapat menjadi pencegahan bagi musuh-musuh regional kita di masa depan."
 AFG_political_events.151.a: "Luar biasa!"
 AFG_political_events.152.t: "[FROM.GetName] Menolak Perjanjian"
 AFG_political_events.152.desc: "Pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk mengoordinasikan industri pertahanan kami, dan dengan demikian impian kami untuk berteman dengan [FROM.GetLeader] berakhir secara drastis."
 AFG_political_events.152.a: "Sebuah peluang yang terlewatkan."
 AFG_political_events.153.t: "$AFG_faqir_of_ipi$ dari [AFG.GetNonIdeologyName] Meminta Bantuan"
 AFG_political_events.153.desc: "Dalam pesan rahasia, $AFG_faqir_of_ipi$, pemimpin suku tradisionalis di [FROM.GetNonIdeologyName], telah menghubungi pemerintah kami untuk mencari dukungan atas kenaikan takhtanya. Dia berjanji bahwa, dengan dukungan kita, dia akan membangun negara yang kuat dan selaras dengan kepentingan kita."
 AFG_political_events.153.a: "Kita bisa menggunakan lebih banyak sekutu di kawasan ini."
 AFG_political_events.153.b: "Mengapa ikut campur di negeri yang begitu jauh?"
 AFG_political_events_153_tt: "§Y[JAP.GetNonIdeologyName] akan membekali kami dengan senjata dan mengirimkan sukarelawan untuk membantu kami ketika perang saudara dimulai.§!"
 AFG_political_events.154.t: "[FROM.GetNameDefCap] Menolak Rencana"
 AFG_political_events.154.desc: "Pemerintah [FROM.GetAdjective] telah menanggapi permintaan kami dan dengan menyesal menolak memberikan dukungan untuk kenaikan takhta $AFG_faqir_of_ipi$. Mengutip kekhawatiran atas potensi keterikatan dan iklim geopolitik saat ini, [FROM.GetAdjective] telah memutuskan untuk fokus pada prioritas strategis lainnya."
 AFG_political_events.154.a: "Beraninya mereka mengkhianati kita!"
 AFG_political_events.155.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 AFG_political_events.155.desc: "Menanggapi permintaan kami, pemerintahan [FROM.GetName] telah setuju untuk mendukung kenaikan $AFG_faqir_of_ipi$ ke tahta [ROOT.GetNonIdeologyName]. Dukungan ini akan mencakup dukungan dan peralatan militer untuk memastikan keberhasilan upaya kami."
 AFG_political_events.155.a: "Masa depan [AFG.GetNonIdeologyName] adalah milik kita!"
 AFG_political_events.156.t: "[JAP.GetAdjective] Dukungan Tiba"
 AFG_political_events.156.desc: "Seperti yang telah disepakati sebelumnya, peralatan [FROM.GetAdjective] telah tersedia bagi kami sejak pecahnya perang saudara. Agen mereka di [ROOT.Capital.GetCapitalVictoryPointName] juga telah meyakinkan kami bahwa pasukan rahasia [FROM.GetAdjective] akan segera mencapai negara tersebut untuk membantu kami dalam perjuangan."
 AFG_political_events.156.a: "Luar biasa!"
 AFG_political_events.157.t: "[GER.GetAdjective] Dukungan Tiba"
 AFG_political_events.157.desc: "Seperti yang telah disepakati sebelumnya, peralatan [FROM.GetAdjective] telah tersedia bagi kami sejak pecahnya perang saudara. Agen mereka di [ROOT.Capital.GetCapitalVictoryPointName] juga telah meyakinkan kami bahwa pasukan rahasia [FROM.GetAdjective] akan segera mencapai negara tersebut untuk membantu kami dalam perjuangan."
 AFG_political_events.157.a: "Luar biasa!"
 AFG_political_events.158.t: "$AFG_faqir_of_ipi$ dari [AFG.GetNonIdeologyName] Meminta Bantuan"
 AFG_political_events.158.desc: "Dalam pesan rahasia, $AFG_faqir_of_ipi$, pemimpin suku tradisionalis di [FROM.GetNonIdeologyName], telah menghubungi pemerintah kami untuk mencari dukungan atas kenaikan takhtanya. Dia berjanji bahwa, dengan dukungan kita, dia akan membangun negara yang kuat dan selaras dengan kepentingan kita."
 AFG_political_events.158.a: "Kita bisa menggunakan lebih banyak sekutu di kawasan ini."
 AFG_political_events.158.b: "Mengapa ikut campur di negeri yang begitu jauh?"
 AFG_political_events.159.t: "[FROM.GetNameDefCap] Menolak Rencana"
 AFG_political_events.159.desc: "Pemerintah [FROM.GetAdjective] telah menanggapi permintaan kami dan dengan menyesal menolak memberikan dukungan untuk kenaikan takhta $AFG_faqir_of_ipi$. Mengutip kekhawatiran atas potensi keterikatan dan iklim geopolitik saat ini, [FROM.GetAdjective] telah memutuskan untuk fokus pada prioritas strategis lainnya."
 AFG_political_events.159.a: "Beraninya mereka mengkhianati kita!"
 AFG_political_events.160.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 AFG_political_events.160.desc: "Menanggapi permintaan kami, pemerintahan [FROM.GetName] telah setuju untuk mendukung kenaikan $AFG_faqir_of_ipi$ ke tahta [ROOT.GetNonIdeologyName]. Dukungan ini akan mencakup dukungan dan peralatan militer untuk memastikan keberhasilan upaya kami."
 AFG_political_events.160.a: "Masa depan [AFG.GetNonIdeologyName] adalah milik kita!"
 AFG_political_events.170.t: "Penobatan Pangeran Mughal"
 AFG_political_events.170.desc: "Mirza Khurshid Jah Bahadur tiba di negara kita beberapa hari yang lalu, dan sebuah upacara akbar kini sedang diadakan di mana klaimnya atas Kerajaan Mughal dan Timurid diakui, sekaligus menobatkannya sebagai Emir Afganistan yang baru. Pada saatnya nanti, mungkin kita akan mampu mengklaim kejayaan kerajaan-kerajaan kuno ini."
 AFG_political_events.170.a: "Hidup Emir baru!"
 AFG_political_events.171.t: "Penobatan Emir Bukharan"
 AFG_political_events.171.desc: "Sayyid Mir Muhammad Alim Khan telah berada di Kabul sejak dia diasingkan dari Bukhara oleh Soviet. Dengan penobatannya sebagai Emir Afghanistan yang baru, mungkin kita akan dapat menggunakan klaimnya untuk mendapatkan kembali Asia Tengah dari ancaman [SOV.GetAdjective]."
 AFG_political_events.171.a: "Hidup Emir baru!"
 AFG_political_events.172.t: "[FROM.GetNameDefCap] menduduki Waziristan!"
 AFG_political_events.172.desc: "Awal minggu ini, pasukan yang tergabung dalam [FROM.GetNameDef] masuk dan menduduki wilayah kami di Waziristan, dengan menyatakan bahwa mereka menjalankan misi untuk melindungi wilayah tersebut dari kemungkinan pendudukan musuh-musuh mereka. Ini jelas merupakan tindakan perang, namun ini adalah salah satu tindakan yang mungkin bisa kita abaikan saja, mengingat kemungkinan besar mereka tidak ingin berperang dengan kita, melainkan berupaya menyatukan kembali masyarakat Pashtun yang tersebar."
 AFG_political_events.172.a: "Tidak ada gunanya diperebutkan"
 AFG_political_events.172.b: "Menurut mereka, siapakah mereka?"
 AFG_political_events.173.t: "Perdana Menteri Kerajaan Baru"
 AFG_political_events.173.desc: "Karena banyak yang mempertanyakan keputusan yang diambil oleh $AFG_mohammad_hashim_khan$, keputusan tersebut diambil untuk mengamankan kekuasaan kerajaan dengan menunjuk salah satu saudara kandungnya sebagai pemimpin baru, tunduk pada $AFG_mohammed_zahir_shah$. Siapa yang akan menggantikannya?"
 AFG_political_events.173.a: "$AFG_shah_mahmud_khan$ yang selalu konsisten"
 AFG_political_events.173.b: "$AFG_sardar_shah_wali_khan$ yang brilian secara militer"
 AFG_political_events.173.c: "Semakin progresif $AFG_mohammed_daoud_khan$"
 #RAJ
 #India wants to invade Bhutan
 GOE_RAJ.1.t: "[FROM.GetName] Meminta Izin untuk Menyerang [BHU.GetName]"
 GOE_RAJ.1.desc: "Subjek kami [FROM.GetNameDef] telah mencari peluang untuk memperluas pengaruh kami di anak benua India dengan menundukkan kerajaan pertapa [BHU.GetAdjective]. Hal ini dapat membuka pintu gerbang ke wilayah Asia bagian dalam."
 GOE_RAJ.1.a: "Ide bagus"
 GOE_RAJ.1.b: "Itu terlalu agresif"
 GOE_RAJ.2.t: "[FROM.GetName] Menyetujui"
 GOE_RAJ.2.desc: "[FROM.GetName] telah menyetujui permintaan kami untuk perluasan wilayah. Harus ada sedikit perlawanan yang menghalangi kita."
 GOE_RAJ.2.a: "Bagus"
 GOE_RAJ.3.t: "[FROM.GetName] Menolak"
 GOE_RAJ.3.desc: "[FROM.GetName] telah menolak permintaan kami untuk perluasan wilayah, dengan menyatakan bahwa Kerajaan tidak berkepentingan untuk mengganggu stabilitas anak benua saat ini."
 GOE_RAJ.3.a: "Sayang sekali"
 #India demands Bhutan protectorate
 GOE_RAJ.4.t: "[FROM.GetName] Menuntut Penaklukan"
 GOE_RAJ.4.desc: "Ketika situasi keamanan di benua ini memburuk dengan cepat, [FROM.GetNameDef] telah menuntut agar Kerajaan kita terintegrasi secara kuat ke dalam wilayah pengaruh mereka.\nPemerintah [FROM.GetAdjective] telah menekankan bahwa kita akan mempertahankan kemerdekaan, namun tidak dapat lagi menerima potensi risiko keamanan terhadap negara."
 GOE_RAJ.4.a: "Persyaratan yang tidak dapat diterima"
 GOE_RAJ.4.b: "Kita harus melipat"
 GOE_RAJ.5.t: "[FROM.GetName] Menolak"
 GOE_RAJ.5.desc: "[FROM.GetName] telah menolak tuntutan kami, menekankan bahwa ini adalah Kerajaan yang mandiri dengan peraturan dan kepentingannya sendiri."
 GOE_RAJ.5.a: "Tidak dapat diterima"
 GOE_RAJ.6.t: "[FROM.GetName] Lipatan"
 GOE_RAJ.6.desc: "[FROM.GetName] telah menerima tuntutan kami, dan secara efektif mengubah negara mereka menjadi negara subjek."
 GOE_RAJ.6.a: "Hebat!"
 GOE_RAJ.7.t: "Subhas Chandra Bose mengusulkan untuk menggulingkan pemerintahan [GetRajAdjective]."
 GOE_RAJ.7.desc: "Dalam upayanya untuk memperoleh kemerdekaan bagi [GetRajName], pemimpin nasionalis Chandra Bose telah mendekati kita dengan proposal untuk mengacaukan benua [GetRajAdjective]. Jika kami menerimanya, kami akan terpanggil untuk membantu menggulingkan pendudukan kekaisaran [GetRajAdjective] jika waktunya tepat."
 GOE_RAJ.7.a: "Kami akan membantunya."
 GOE_RAJ.7.a_tt: "§YKita akan dipanggil berperang melawan [RAJ.GetName] ketika Chandra Bose melancarkan revolusinya§!"
 GOE_RAJ.7.b: "Kami punya rencana lain"
 GOE_RAJ.8.t: "[FROM.GetName] setuju untuk membantu kami"
 GOE_RAJ.8.desc: "[FROM.GetName] memberi isyarat bahwa mereka akan mendukung perjuangan kemerdekaan kita."
 GOE_RAJ.8.a: "Selangkah lebih dekat menuju kemerdekaan"
 GOE_RAJ.9.t: "[FROM.GetName] menolak membantu kami"
 GOE_RAJ.9.desc: "[FROM.GetName] telah menyatakan bahwa mereka mempunyai rencana yang akan terancam jika mereka terlibat dalam perang melawan [ENG.GetAdjective], dan dengan demikian akan menahan diri untuk tidak membantu kami."
 GOE_RAJ.9.a: "Lagipula kami tidak membutuhkan bantuan"
 GOE_RAJ.10.t: "[FROM.GetName] Memanggil [JAP.GetName] untuk Memenuhi Sumpahnya."
 GOE_RAJ.10.desc: "Subhas Chandra Bose telah meluncurkan revolusinya. Sebuah telegram tiba yang menyatakan bahwa jika kami berniat menepati janji kami, sekaranglah saatnya.\nHal ini berpeluang untuk menumbangkan musuh besar di kawasan Asia."
 GOE_RAJ.10.a: "Kami bertarung"
 GOE_RAJ.10.b: "Kita harus melanggar sumpah kita"
 GOE_RAJ.11.t: "[FROM.GetName] Menghormati Janji Mereka"
 GOE_RAJ.11.desc: "[FROM.GetName] melakukan mobilisasi penuh dan siap membantu perjuangan kami"
 GOE_RAJ.11.a: "Darah dan Kebebasan!"
 GOE_RAJ.12.t: "[FROM.GetName] Mengingkari Janjinya"
 GOE_RAJ.12.desc: "Tidak ada tentara [FROM.GetAdjective] yang siap membantu kami. Bantuan yang dijanjikan tidak terlihat dan Tokyo diam saja. Kita hanya bisa berasumsi bahwa kita sendirian."
 GOE_RAJ.12.a: "Pelanggar sumpah!"
 GOE_RAJ.13.t: "Serahkan kepulauan Andaman kepada [GetRajName]?"
 GOE_RAJ.13.desc: "Pemerintahan Azad Hind dapat menggunakan ibu kota khusus untuk tujuan administratif yang jauh dari garis depan sampai kemenangan mereka diperkuat.\nKepulauan Andaman yang baru saja ditaklukkan bisa menjadi tempat yang sempurna untuk ini."
 GOE_RAJ.13.a: "Serahkan"
 GOE_RAJ.13.b: "Sebenarnya kita membutuhkannya"
 GOE_RAJ.14.t: "[JAP.GetName] Menyerahkan Andaman"
 GOE_RAJ.14.desc: "[JAP.GetAdjective] telah berhasil menginvasi kepulauan Andaman. Mereka memutuskan untuk mengalihkan kendalinya kepada kami, sehingga kami dapat membentuk pemerintahan yang tepat di sana."
 GOE_RAJ.14.a: "Bagus"
 GOE_RAJ.14.tt: "Kita dapat mentransfer Modal kita ke Andaman dengan menyelesaikan fokus §Y$RAJ_shaheed_and_swara$j§!."
 GOE_RAJ.15.t: "[RAJ.GetNameDefCap] mempertahankan kendali atas [992.GetName]"
 GOE_RAJ.15.desc: "[RAJ.GetNameDefCap] telah memberi tahu kami bahwa mereka bermaksud untuk mempertahankan Pelabuhan Aden di bawah kendalinya, meskipun sebelumnya ada rencana untuk menyerahkan kendalinya kepada kerajaan.\nSeperti yang diharapkan, hal ini telah menyebabkan kegemparan di parlemen, terutama dari Winston Churchill tetapi tidak ada tindakan disipliner yang direncanakan saat ini."
 GOE_RAJ.15.a: "Apa yang mereka rencanakan?"
 GOE_RAJ.16.t: "[FROM.GetNameDefCap] menyerahkan [992.GetName]"
 GOE_RAJ.16.desc: "Sesuai rencana berdasarkan undang-undang Pemerintah India tahun 1935, pemerintahan [GetRajAdjective] telah menyerahkan tanggung jawab administratif [992.GetName] kepada kami."
 GOE_RAJ.16.a: "Lebih sedikit biaya administratif."
 GOE_RAJ.17.t: "[RAJ.GetName] bergerak melawan [TIB.GetName]"
 GOE_RAJ.17.desc: "Dalam tindakan agresifnya, [RAJ.GetName] telah mengambil sikap di perbatasan dengan [TIB.GetName], menyatakan hal itu sebagai niat mereka untuk memperluas zona keamanan untuk melindungi wilayah jantung mereka. Hal ini jelas bertentangan dengan kepentingan kami di wilayah ini."
 GOE_RAJ.17.a: "Tawarkan jaminan [TIB.GetName]"
 GOE_RAJ.17.b: "Kita tidak mampu membuka front lain."
 GOE_RAJ.18.t: "[RAJ.GetLeader] menuntut pengembalian kepemilikan kolonial"
 GOE_RAJ.18.desc: "Ketika [RAJ.GetNameDefCap] melepaskan beban masa lalunya, [RAJ.GetLeader] menjadi cukup berani untuk menuntut kembalinya kepemilikan kolonial kita di wilayah tersebut. Menyatukan anak benua menjadi satu negara yang kuat tampaknya merupakan hal yang paling penting bagi negara yang baru lahir ini."
 GOE_RAJ.18.a: "Mereka harus mengambilnya dengan paksa"
 GOE_RAJ.18.b: "Kita tidak sanggup berperang begitu lama dari rumah"
 GOE_RAJ.19.t: "[FROM.GetName] menolak menyerahkan koloni"
 GOE_RAJ.19.desc: "Pemerintah [FROM.GetAdjective] dengan keras kepala menolak menyerahkan tanah [GetRajAdjective] yang sah, meskipun telah berulang kali diperingatkan bahwa status quo tidak dapat diterima"
 GOE_RAJ.19.a: "Kalau begitu, kita harus mengambilnya dengan paksa"
 GOE_RAJ.20.t: "[FROM.GetName] menyerahkan koloni"
 GOE_RAJ.20.desc: "[FROM.GetName] dengan enggan menerima tuntutan kami. Mereka menegaskan dengan jelas bahwa politik tangan kosong seperti ini tidak akan bertahan lama, dan hanya bisa dilakukan jika ada imbalan yang kecil."
 GOE_RAJ.20.a: "Keadilan menjadi benar"
 GOE_RAJ.21.t: "Rantai yang putus"
 GOE_RAJ.21.desc: "Pemerintahan lama di bawah kekuasaan Imperialis Inggris telah menyerah dan pemerintahannya telah meninggalkan negara tersebut. Saat kita memperkuat kendali atas anak benua ini, kita perlu memutuskan bagaimana menghadapi penguasa lama kita"
 GOE_RAJ.21.a: "Tawarkan mereka kedamaian"
 GOE_RAJ.21.b: "Tidak akan ada perdamaian bagi kaum Imperialis"
 GOE_RAJ.22.t: "Raj Inggris telah jatuh"
 GOE_RAJ.22.desc: "Sebuah telegram panik dari Lord Linlithgow memberi tahu kami bahwa pemberontak yang dipimpin oleh [RAJ.GetLeader] telah menguasai negara.\nLinlithgow masuk ke negara itu dengan tawaran perdamaian putih dari [RAJ.GetLeader], dengan syarat kami menyerahkan semua klaim atas India."
 GOE_RAJ.22.a: "Tidak ada kompromi"
 GOE_RAJ.22.b: "Timur telah jatuh"
 GOE_RAJ.23.t: "[ENG.GetName] menolak tawaran perdamaian"
 GOE_RAJ.23.desc: "[ENG.GetName] telah menolak tawaran perdamaian kami. Ini adalah niat [ENG.GetAdjective] untuk melanjutkan perang ini sampai mutiara mereka direbut kembali."
 GOE_RAJ.23.a: "Jadilah itu."
 GOE_RAJ.24.t: "[ENG.GetName] menerima tawaran perdamaian"
 GOE_RAJ.24.desc: "[ENG.GetName] dengan enggan menerima tawaran perdamaian kami. [GetRajName] bebas menentukan nasibnya sendiri"
 GOE_RAJ.24.a: "Darah diberikan"
 GOE_RAJ.25.t: "[RAJ.GetName] Perdamaian Putih dengan [ENG.GetName]"
 GOE_RAJ.25.desc: "[RAJ.GetAdjective] telah menandatangani perdamaian dengan mantan penguasa mereka, dan akhirnya memperoleh kemerdekaan penuh dari kekuasaan kekaisaran. Kita sekarang mempunyai pilihan untuk melakukan hal yang sama, dan meraih kemenangan moral yang besar dalam prosesnya."
 GOE_RAJ.25.a: "Tandatangani Perdamaian"
 GOE_RAJ.25.b: "Kita belum selesai"
 GOE_RAJ.26.t: "Subhas Chandra Bose dibebaskan dari penjara"
 GOE_RAJ.26.desc: "Kami telah berhasil membebaskan pemimpin kami dari penjara. Sebuah keuntungan besar yang akan membawa struktur pada tujuan kita."
 GOE_RAJ.26.a: "Hebat!"
 GOE_RAJ.27.t: "[RAJ.GetNameDefCap] mendoakan kedamaian kulit putih"
 GOE_RAJ.27.desc: "Setelah melepaskan diri dari belenggu penindasnya, [RAJ.GetNameDefCap] tidak lagi ingin negara kita terlibat dalam perang yang sia-sia."
 GOE_RAJ.27.a: "Tidak, perang harus terus berlanjut"
 GOE_RAJ.27.b: "Kedengarannya seperti kesepakatan"
 GOE_RAJ.28.t: "[FROM.GetName] menolak menandatangani perdamaian putih"
 GOE_RAJ.28.desc: "[FROM.GetName] telah menolak upaya kami untuk keluar dari konflik. Apakah ini akan menjadi kejatuhan kita dan kejatuhan mereka?"
 GOE_RAJ.28.a: "Tidak menyenangkan"
 GOE_RAJ.29.t: "Raja Muda Baru untuk [RAJ.GetName]"
 GOE_RAJ.29.desc: "Menjelang akhir masa jabatan Freeman-Freeman Thomas sebagai Raja Muda India, kita perlu memutuskan apakah kita ingin menggantinya dengan kandidat yang cocok, atau apakah kita ingin memperpanjang masa jabatan Marquess of Willingdon lebih jauh."
 GOE_RAJ.29.a: "Victor Hope akan menggantikan Earl"
 GOE_RAJ.29.b: "Pertahankan Freeman-Freeman"
 GOE_RAJ.30.t: "Pemerintahan RAJ Inggris jatuh"
 GOE_RAJ.30.desc: "Setelah berabad-abad berkuasa, pemerintahan [ENG.GetAdjective] akhirnya keluar dari India. Para pejabat mengemasi kantor mereka, administrator kolonial menyusun laporan akhir mereka dan Union Jack diturunkan dari gedung-gedung pemerintah. Namun transisi ini jauh dari mulus; pertanyaan mengenai perbatasan dan kendali militer masih belum terselesaikan, sehingga menyebabkan tertundanya kemerdekaan akhir."
 GOE_RAJ.30.a: "Pada akhirnya, kita akan bebas."
 GOE_RAJ.30.b: "Nah, kami suka di sini"
 GOE_RAJ.30_we_are_leaving_tt: "§Y[RAJ.GetName]§! untuk sementara akan tetap berada di bawah kendali kami sementara kami membiarkan mereka mengatur administrasinya. Namun mereka pada akhirnya akan membebaskan diri."
 GOE_RAJ.31.t: "Kekacauan harga di [RAJ.GetName]"
 GOE_RAJ.31.desc: "Ketika [RAJ.GetName] mencoba untuk pulih dari Depresi Besar, pengendalian harga tampaknya telah mengganggu stabilitas negara. Mengikat Rupee ke Sterling berisiko membuat kedua negara kita terjerumus ke dalam kekacauan ekonomi.\nSebuah konglomerat perorangan telah mendekati kita dengan usulan untuk membagi Raj menjadi dua bagian, sehingga meringankan beban keuangan negara. Satu bagian berada dalam kendali swasta, dan satu lagi masih berada di bawah kendali utama.\nTidak melakukan apa pun dapat menimbulkan risiko yang lebih buruk."
 GOE_RAJ.31.a: "Kita harus"
 GOE_RAJ.31.a_tt: "Perusahaan India Timur akan terbentuk, mengambil alih sebagian India"
 GOE_RAJ.31.b: "Tidak pernah"
 GOE_RAJ.32.t: "Pertanyaan Aden"
 GOE_RAJ.32.desc: "Sesuai rencana pemerintah [ENG.GetAdjective], kami akan menyerahkan Provinsi Aden kepada mereka, namun kami mungkin dapat mempertahankannya jika kami menginginkannya."
 GOE_RAJ.32.a: "Serahkan"
 GOE_RAJ.32.b: "Simpan itu"
 GOE_RAJ.32.b_tt: "Kami akan mempertahankan kendali atas §YProvinsi Aden§!, memungkinkan kami menyelesaikan fokus §YPelabuhan Perdagangan§!"
 GOE_RAJ.33.t: "Pemberontakan di India Barat Laut!"
 GOE_RAJ.33.desc: "Sebuah kelompok yang mengaku sebagai ahli waris sah Kekaisaran yang telah lama mati telah mendeklarasikan perang kemerdekaan di ujung barat laut, mengumpulkan faksi-faksi yang tidak puas di bawah bendera mereka. Meskipun sebagian besar wilayah India masih terkendali, pemberontakan ini mengancam stabilitas. Akankah ini menjadi catatan kaki dalam sejarah atau kembalinya sebuah kerajaan?"
 GOE_RAJ.33.a: "Ini tidak akan bertahan"
 GOE_RAJ.33.b_tt: "Kehilangan kendali atas Gujarat dan Delhi akan memaksa perdamaian kulit putih"
 GOE_RAJ.33.b: "Kami memiliki kekhawatiran lain"
 GOE_RAJ.33.c: "Menuju kemenangan!"
 GOE_RAJ_33_c_tt: "§RKita harus bertahan selama 255 hari sampai gencatan senjata ditawarkan. Jika kita menduduki semua negara bagian di India Barat, Timur, Tengah, Selatan atau Utara pada saat gencatan senjata, kita akan memperoleh konsesi teritorial yang lebih besar!§!"
 GOE_RAJ.34.t: "[UK_INDIA.GetName] Administrasi Runtuh"
 GOE_RAJ.34.desc: "Bencana di [UK_INDIA.GetName]! Pemerintahan lokal telah runtuh karena perang berkepanjangan di barat. Untuk mempertahankan kendali negara, mereka menawarkan kompromi teritorial kepada pemberontak. Kita mungkin tidak mengenali para pemberontak ini tetapi untuk saat ini, perang sudah kalah."
 GOE_RAJ.34.a: "Bencana!"
 GOE_RAJ.35.t: "[ENG.GetName] ayo kita pergi"
 GOE_RAJ.35.desc: "Tanpa tembakan, Raj tidak ada lagi. Kami telah memperkuat kendalinya atas India, dan Pemerintahan Yang Mulia yang lelah dengan beban kekaisaran memilih untuk tidak melakukan intervensi."
 GOE_RAJ.35.a: "Itu tidak terduga"
 GOE_RAJ.37.t: "Peringatan dari Whitehall"
 GOE_RAJ.37.desc: "Kebijakan pendudukan terbaru kami diperkirakan telah menyebabkan peningkatan aktivitas perlawanan. Hal ini tampaknya telah menarik perhatian Pemerintahan Yang Mulia. Sebuah surat dengan kata-kata yang tajam telah tiba, memperjelas bahwa London tidak menyetujui pendekatan kita yang ceroboh terhadap pemerintahan. Pesan tersebut dipenuhi dengan kata-kata yang dipilih dengan cermat namun masih mengandung ancaman. Dengan tegas, kita disarankan untuk mempertimbangkan kembali pendirian kita, jangan sampai kita terbantu secara paksa dalam memulihkan ketertiban dengan cara yang mungkin tidak kita hargai."
 GOE_RAJ.37.a: "Haruskah kita menyebut gertakan mereka?"
 GOE_RAJ.38.t: "Kekaisaran Menyerang Kembali"
 GOE_RAJ.38.desc: "Tampaknya pemerintah [ENG.GetAdjective] sudah cukup memahami pendekatan kami terhadap pemerintahan daerah. Pasukan Inggris telah mencapai kekuatan dengan kedok operasi stabilisasi.. Jaringan perlawanan telah ditumbangkan, elemen-elemen yang menyusahkan ditenangkan dan pengaruh kita sendiri telah disingkirkan.\nInggris menegaskan bahwa semua ini hanya bersifat sementara, sebuah intervensi yang diperlukan untuk melindungi integritas kawasan. Namun pesannya jelas: mereka berkuasa di sini dan jika kita ingin memerintah, kita harus melakukannya sesuai dengan ketentuan mereka."
 GOE_RAJ.38.a: "Kami akan bermain bagus untuk saat ini."
 GOE_RAJ.39.t: "Negosiasi dengan Serikat Pekerja"
 GOE_RAJ.39.desc: "Di ruang bawah tanah yang gelap dan terang, para pemimpin Serikat pekerja sepakat untuk bertemu dengan kami, jauh dari pengawasan pemerintah. Mereka menguasai para petani, pekerja pabrik, dan penjual ikan, serta rakyat jelata. Mereka bersedia mendukung upaya kami untuk menggulingkan pemerintahan saat ini, namun mereka mengharapkan kelonggaran sebagai balasannya."
 GOE_RAJ.39.a: "Menjamin Keselamatan Pekerja"
 GOE_RAJ.39.a_tt: "Ketika kita memperoleh kekuasaan, kita wajib meningkatkan keselamatan pekerja dalam waktu §Y6 bulan§!. Kegagalan untuk melakukan hal ini akan mengecewakan serikat pekerja. Peningkatan hasil keselamatan pekerja:"
 GOE_RAJ.39.b: "Menjamin upah minimum"
 GOE_RAJ.39.b_tt: "Ketika kami memperoleh kekuasaan, kami wajib menjamin upah minimum dalam §Y6 bulan§!. Kegagalan untuk melakukan hal ini akan mengecewakan serikat pekerja. Hasil upah minimum yang dijamin:"
 GOE_RAJ.39.c: "Akhiri pertemuan"
 GOE_RAJ.39.c_tt: "Kami akan dapat bertemu dengan mereka lagi sampai kami menyelesaikan §Y$RAJ_royal_indian_navy_mutiny$§!"
 GOE_RAJ.40.t: "Bentrokan Perbatasan di Utara Delhi"
 GOE_RAJ.40.desc: "Pasukan India telah menyeberang ke wilayah sengketa dekat [986.GetName]. Pertempuran terjadi di perbukitan dan dataran di utara Delhi. Mereka mengklaim tanah itu milik revolusi berdasarkan hak historis. Dalam pidatonya di radio, Perdana Menteri menyebut Pakistan sebagai peninggalan perpecahan kolonial. Ketegangan meningkat dan bentrokan tampaknya akan segera terjadi."
 GOE_RAJ.40.a: "Beraninya mereka?"
 GOE_RAJ.41.t: "[RAJ.GetName] merebut [986.GetName]"
 GOE_RAJ.41.desc: "Pasukan India telah merebut wilayah perbatasan. Pasukan Pakistan mundur setelah pertempuran sengit dan spanduk komunis kini berkibar di wilayah tersebut. Stasiun televisi India menyebutnya sebagai kemenangan rakyat."
 GOE_RAJ.41.a: "Revolusi bergerak maju."
 GOE_RAJ.41.b: "Sebuah kehilangan yang pahit"
 GOE_RAJ.42.t: "Bentrokan Perbatasan di [431.GetName]"
 GOE_RAJ.42.desc: "Pasukan India telah menyeberang ke wilayah sengketa dekat [431.GetName]. Pertempuran kecil terjadi di dataran utara Kalkuta. Mereka mengklaim tanah itu milik revolusi berdasarkan hak historis. Dalam pidatonya di radio, Perdana Menteri menyebut Pakistan sebagai peninggalan perpecahan kolonial. Ketegangan meningkat dan bentrokan tampaknya akan segera terjadi."
 GOE_RAJ.42.a: "Beraninya mereka?"
 GOE_RAJ.43.t: "[RAJ.GetName] merebut [431.GetName]"
 GOE_RAJ.43.desc: "Pasukan India telah merebut Kalkuta. Pasukan Pakistan mundur setelah pertempuran sengit dan spanduk komunis kini berkibar di wilayah tersebut. Stasiun televisi India menyebutnya sebagai kemenangan rakyat."
 GOE_RAJ.43.a: "Revolusi bergerak maju."
 GOE_RAJ.43.b: "Sebuah kehilangan yang pahit"
 GOE_RAJ.44.t: "Bentrokan Perbatasan di [433.GetName]"
 GOE_RAJ.44.desc: "Pasukan India telah menyeberang ke wilayah sengketa dekat [433.GetName]. Pasukan India telah merebut Taj Mahal. Mereka mengklaim tanah itu milik revolusi berdasarkan hak historis. Dalam pidatonya di radio, Perdana Menteri menyebut Pakistan sebagai peninggalan perpecahan kolonial. Ketegangan meningkat dan bentrokan tampaknya akan segera terjadi."
 GOE_RAJ.44.a: "Beraninya mereka?"
 GOE_RAJ.45.t: "[RAJ.GetName] merebut [433.GetName]"
 GOE_RAJ.45.desc: "Pasukan India telah merebut [433.GetName]. Pasukan Pakistan mundur setelah pertempuran sengit dan spanduk komunis kini berkibar di wilayah tersebut. Stasiun televisi India menyebutnya sebagai kemenangan rakyat."
 GOE_RAJ.45.a: "Revolusi bergerak maju."
 GOE_RAJ.45.b: "Sebuah kehilangan yang pahit"
 GOE_RAJ.46.t: "Pemberontakan Rakyat"
 GOE_RAJ.46.desc: "Kerusuhan meningkat di pedesaan ketika para agitator komunis, yang telah lama beroperasi secara sembunyi-sembunyi, menyerukan masyarakat untuk mengangkat senjata. Desa-desa telah berbalik melawan tuan tanah mereka dan spanduk-spanduk bergambar palu arit berkibar di atas balai kota.\n\nPemberontakan memiliki jejak [FROM.GetName] yang menggunakan slogan dan senjata mereka.\n\nPerang baru untuk hati dan jiwa bangsa kita telah dimulai."
 GOE_RAJ.46.a: "Usir Tentara Merah!"
 GOE_RAJ.46.b: "Kami tidak bisa mengatasi tekanan tersebut"
 GOE_RAJ.46.c: "Kita sudah menuju komunisme!"
 GOE_RAJ.47.t: "Pengaruh India Tumbuh"
 GOE_RAJ.47.desc: "Republik Rakyat India telah mulai memperluas jangkauan ideologinya melampaui batas negaranya.\n\nDalam beberapa minggu terakhir, suara-suara pro-India semakin keras dalam lingkup politik kita. Publikasi-publikasi memuji model sosialisme mereka yang terdesentralisasi, perlawanan mereka terhadap pengaruh asing, dan keberhasilan nyata mereka dalam mentransformasikan negara pasca-kolonial.\n\nApakah ini merupakan bagian dari upaya terkoordinasi oleh [From.GetNameDef] untuk mengubah politik internal kita masih belum jelas – namun kehadiran mereka dapat dirasakan."
 GOE_RAJ.47.a: "Kami akan mengawasi mereka dengan cermat."
 GOE_RAJ.48.t: "Pengaruh Revolusioner India di [This.GetNameDef]"
 GOE_RAJ.48.desc: "Menyusul serangkaian publikasi dan siaran yang terinspirasi oleh [RAJ.GetNameDef], semakin banyak segmen masyarakat [This.GetAdjective] yang beralih ke model sosialisme agraria India. Pesan reformasi pertanahan, pemerintahan mandiri, dan persatuan anti-imperial bergema di kalangan pekerja dan petani.\n\nMeskipun masih merupakan gerakan pinggiran, banyak orang di dalam kepemimpinan [This.GetAdjective] khawatir bahwa tanpa tanggapan yang kuat, sentimen ini dapat berkembang menjadi pemogokan massal, atau lebih buruk lagi, agitasi bersenjata yang sejalan dengan tujuan revolusioner [From.GetNameDef]."
 GOE_RAJ.48.a: "Mengenai"
 GOE_RAJ.51.t: "[PAK.GetName] mempertahankan kendali atas [986.GetName]"
 GOE_RAJ.51.desc: "Pasukan Pakistan tetap menguasai wilayah perbatasan. Pasukan India mundur setelah pertempuran sengit dan Pakistan terus menguasai wilayah tersebut. Siaran-siaran TV di India menyensor kegagalan dalam menghindari rasa malu nasional."
 GOE_RAJ.51.a: "Sebuah kehilangan yang pahit"
 GOE_RAJ.51.b: "[986.GetName] adalah hak kami."
 GOE_RAJ.49.t: "[PAK.GetName] mempertahankan kendali atas [431.GetName]"
 GOE_RAJ.49.desc: "Pasukan Pakistan tetap menguasai Calcutta. Pasukan India mundur setelah pertempuran sengit dan Pakistan terus menguasai wilayah tersebut. Siaran-siaran TV di India menyensor kegagalan dalam menghindari rasa malu nasional."
 GOE_RAJ.49.a: "Sebuah kehilangan yang pahit"
 GOE_RAJ.49.b: "[431.GetName] adalah hak kami."
 GOE_RAJ.50.t: "[PAK.GetName] mempertahankan kendali atas [433.GetName]"
 GOE_RAJ.50.desc: "Pasukan Pakistan mempertahankan [433.GetName]. Pasukan India mundur setelah pertempuran sengit dan Pakistan terus menguasai wilayah tersebut. Siaran-siaran TV di India menyensor kegagalan dalam menghindari rasa malu nasional."
 GOE_RAJ.50.a: "Sebuah kehilangan yang pahit"
 GOE_RAJ.50.b: "[433.GetName] adalah hak kami."
 GOE_RAJ_famine.1.t: "Wabah Penyakit Bercak Coklat di [?global.famine_state.GetName]"
 GOE_RAJ_famine.1.desc: "Penyakit bercak coklat telah ditemukan di [?global.famine_state.GetName]. Para pejabat khawatir penyakit jamur ini dapat menyebar lebih jauh dan berdampak pada panen musim dingin."
 GOE_RAJ_famine.1.a: "Uh oh"
 GOE_RAJ_famine.2.t: "Topan melanda [?global.famine_state.GetName]"
 GOE_RAJ_famine.2.desc: "Topan besar yang diikuti beberapa badai telah melanda [?global.famine_state.GetName]. Meskipun kerusakannya parah, hal ini mempunyai dampak tambahan berupa penyebaran Penyakit Bintik Coklat di wilayah yang lebih luas, sehingga semakin memperburuk dampak jamur."
 GOE_RAJ_famine.2.a: "Tentunya ini adalah akhir dari semuanya"
 GOE_RAJ_famine.3.t: "Prakiraan Tanaman yang Tidak Dapat Diandalkan"
 GOE_RAJ_famine.3.desc: "Perkiraan resmi mengenai hasil panen tahun ini memperkirakan adanya penurunan yang signifikan. Meskipun sudah diketahui secara luas bahwa perkiraan ini salah di masa lalu."
 GOE_RAJ_famine.3.a: "Mudah-mudahan mereka salah lagi."
 GOE_RAJ_famine.4.t: "Hambatan Perdagangan Provinsi"
 GOE_RAJ_famine.4.desc: "Provinsi-provinsi di India dan negara bagian Princely sudah mulai menerapkan hambatan perdagangan antarprovinsi karena kekhawatiran terhadap kenaikan harga pangan. Hambatan perdagangan ini berisiko meningkatkan harga pangan seiring dengan semakin terisolasinya provinsi-provinsi tersebut."
 GOE_RAJ_famine.4.a: "Jaringan distribusi pangan tercekik"
 GOE_RAJ_famine.5.t: "Kekacauan Harga di [?global.famine_state.GetName]"
 GOE_RAJ_famine.5.desc: "Karena harga gabah meningkat, pemerintah daerah mencoba menerapkan pengendalian harga untuk membantu penduduk setempat. Sayangnya, hal ini hanya berarti bahwa sejumlah besar gabah telah hilang ke pasar gelap, atau disimpan di gudang-gudang besar.\nPemerintah daerah telah melonggarkan langkah-langkah tersebut namun masih ada kepercayaan yang tersebar luas bahwa terdapat kekurangan gabah dalam jumlah besar, yang mengakibatkan merajalelanya inflasi."
 GOE_RAJ_famine.5.a: "Ini semakin buruk"
 GOE_RAJ_famine.6.t: "Distribusi Prioritas di [?global.famine_state.GetName]"
 GOE_RAJ_famine.6.desc: "Pemerintah daerah telah menyetujui skema untuk memprioritaskan pasokan bahan pokok bagi masyarakat kelas atas dan menengah yang penting bagi industri berat di negara bagian tersebut dan bersimpati pada nilai-nilai Barat dan modernisasi. Hal ini semakin meningkatkan harga pangan."
 GOE_RAJ_famine.6.a: "..."
 GOE_RAJ_famine.7.t: "Keadaan Kelaparan di [?global.famine_state.GetName]"
 GOE_RAJ_famine.7.desc: "Kerusuhan sipil massal telah terjadi di [?global.famine_state.GetName]. Kurangnya pasokan bahan pokok telah memaksa sebagian besar penduduk pedesaan pindah ke kota-kota yang penuh sesak untuk mencari bantuan.\nHal ini dengan cepat menjadi tidak terkendali ketika massa mulai terbentuk dan bentrok satu sama lain."
 GOE_RAJ_famine.7.a: "Ini tidak bagus"
 GOE_RAJ_famine.7.tt: "§YKelaparan mungkin menyebar ke negara bagian yang berdekatan setiap bulan kecuali tindakan pencegahan diambil\nMembuka kategori keputusan Kelaparan§!"
 GOE_RAJ_famine.9.t: "[FROM.Getname] meminta Bantuan Kelaparan"
 GOE_RAJ_famine.9.tt: "Mengaktifkan Keputusan §YKelaparan§!"
 GOE_RAJ_famine.9.desc: "[FROM.Getname] menghadapi situasi yang memburuk dimana sebagian negaranya berada dalam kondisi kelaparan. Pemerintahnya telah memohon bantuan apa pun yang dapat disisihkan oleh masyarakat internasional untuk meringankan penderitaan dan mengakhiri keadaan darurat."
 GOE_RAJ_famine.9.a: "Maaf, orang tua. Kami tidak bisa menyisihkan apa pun."
 GOE_RAJ_famine.9.b: "Kami akan mengirimkan bantuan dalam jumlah besar"
 GOE_RAJ_famine.9.c: "Kami akan mengirimkan sejumlah kecil bantuan"
 GOE_RAJ_famine.10.t: "[FROM.GetName] Menolak Membantu kami"
 GOE_RAJ_famine.10.desc: "[FROM.GetName] telah memberi tahu kami bahwa mereka tidak akan memberikan bantuan apa pun kepada kami, dengan menyatakan bahwa mereka menolak anggapan bahwa mereka mempunyai kewajiban terhadap negara kami selama krisis global seperti ini."
 GOE_RAJ_famine.10.a: "Orang Bodoh yang Berhati Dingin"
 GOE_RAJ_famine.11.t: "[FROM.GetName] Memberikan Paket Bantuan Dalam Jumlah Besar"
 GOE_RAJ_famine.11.desc: "[FROM.GetName] telah dengan murah hati memberikan paket bantuan dalam jumlah besar kepada kami, membantu meringankan kelaparan dan mencegah penyebarannya lebih lanjut ke negara-negara tetangga."
 GOE_RAJ_famine.11.a: "Hebat!"
 GOE_RAJ_famine.12.t: "[FROM.GetName] Memberikan Paket Bantuan Kecil"
 GOE_RAJ_famine.12.desc: "[FROM.GetName] telah memberikan paket bantuan kecil kepada kami, membantu meringankan kelaparan dan mencegah penyebarannya lebih lanjut ke negara-negara tetangga. Meskipun mereka tentu saja bisa berbuat lebih banyak, itu lebih baik daripada tidak sama sekali."
 GOE_RAJ_famine.12.a: "Bagus!"
 GOE_RAJ_famine.13.t: "Kelaparan [?global.famine_state.GetName] Hilang"
 GOE_RAJ_famine.13.desc: "Bencana kelaparan terburuk tampaknya sudah berakhir. Panen yang baik telah meringankan penderitaan terburuk dan harga pangan menurun. Meskipun perlu waktu untuk memulihkan keadaan menjadi normal, ini adalah batu loncatan pertama dalam penyembuhan daerah tersebut.\nDengan tragedi besar yang menimpa kita harus bertanya pada diri sendiri, apa sebenarnya harga kemenangan?"
 GOE_RAJ_famine.13.a: "Miles menang dengan penderitaan bersama."
 goe_japan.1.t: "Bose Menawarkan Dukungan untuk Kampanye Burma"
 goe_japan.1.desc: "Subhas Chandra Bose, pemimpin Tentara Nasional India, telah mendekati kami dengan tawaran, pasukannya siap membantu kemajuan kami ke [BRM.GetName]. Ia membayangkan hal ini sebagai langkah pertama menuju pembebasan India dari kekuasaan [ENG.GetAdjective], dan ia percaya bahwa dengan menyerang Burma kita dapat melemahkan Raj Inggris. Orang-orangnya adalah orang-orang nasionalis yang keras kepala, dan pengetahuan mereka tentang wilayah tersebut terbukti sangat berharga. Apakah kita menerimanya?"
 goe_japan.1.a: "Tentu saja"
 goe_japan.1.b: "Tidak"
 #FAMINE
 RAJ_famine_scripted_timeframe_reveal: "[GetFamineTimeframe]\n$RAJ_famine_prevention_stats$"
 RAJ_famine_scripted_timeframe_reveal_desc: "Kami telah menetapkan bahwa kelaparan akan berlangsung selama §Y[?RAJ_famine_spread_times]§! bulan lagi."
 RAJ_famine_scripted_timeframe_non_reveal_desc: "Kami memperkirakan kelaparan akan berlangsung selama §Y[?RAJ_famine_spread_times_min]§! - §Y[?RAJ_famine_spread_times_max]§! bulan lagi."
 RAJ_famine_risk_scripted_gui_desc: "Peluang tindakan pencegahan untuk menghentikan penyebaran kelaparan ke negara bagian yang berdekatan: §G[?RAJ_famine_shield]%§!\nRisiko penyebaran Kelaparan: §R[?RAJ_famine_spreads]%§!"
 RAJ_famine_prevention_stats: "Tindakan pencegahan kami telah\n-Menghentikan penyebaran Kelaparan: §Y[?RAJ_times_shield_has_blocked_spread]§! kali\n-Mengurangi lamanya Kelaparan sebesar: §Y[?RAJ_famine_reduction_from_shield]§! bulan"
 RAJ_famine_shield_tt: "Peluang tindakan pencegahan untuk menghentikan penyebaran kelaparan: §G+$RIGHT|0$%§!"
 #Raj Partition 
 RAJ_partition_1.t: "Protes di [FROM.GetName] berubah menjadi kekerasan."
 RAJ_partition_1.desc: "Apa yang awalnya merupakan protes sipil berubah menjadi kekerasan ketika pasukan polisi setempat melawan masyarakat yang kehilangan haknya. Polisi [ENG.GetAdjective] mengklaim bahwa mereka bertindak di bawah ancaman kekerasan, sementara para pengunjuk rasa bersikukuh bahwa mereka benar-benar berpegang teguh pada pantangan kekerasan.\nTidak ada seorang pun yang terbunuh namun 2 petugas setempat menderita luka ringan dan 1 pengunjuk rasa dipindahkan ke rumah sakit setempat setelah menderita gegar otak."
 RAJ_partition_1.a: "Tidak dapat diterima."
 GOE_RAJ_partition.2.t: "Protes yang meluas di [?unrest_target_state.GetName]"
 GOE_RAJ_partition.2.desc: "Protes terhadap peraturan [ENG.GetAdjective] telah meletus di [?unrest_target_state.GetName], dan penegak hukum setempat melaporkan meningkatnya bentrokan dengan kekerasan antara demonstran dan pihak berwenang."
 GOE_RAJ_partition.2.a: "Polisi harus mundur."
 GOE_RAJ_partition.2.b: "Bubarkan kerumunan."
 GOE_RAJ_partition.3.t: "Kerusuhan di [?unrest_target_state.GetName]"
 GOE_RAJ_partition.3.desc: "Ketegangan di [?unrest_target_state.GetName] telah mencapai tingkat kritis, ketika polisi setempat berjuang untuk menahan massa yang semakin gelisah. Pabrik-pabrik yang terkait dengan pemerintah telah menjadi sasaran utama para agitator, karena seringnya mereka menghadapi tindakan sabotase di tengah meningkatnya kerusuhan."
 GOE_RAJ_partition.3.a: "Kerahkan garda nasional"
 GOE_RAJ_partition.3.b: "Cobalah dan mediasi dengan para agitator"
 GOE_RAJ_partition.4.t: "Kekerasan Beragama"
 GOE_RAJ_partition.4.desc: "Seiring dengan semakin kuatnya dorongan untuk mencapai kemerdekaan, kesenjangan yang semakin dalam dan semakin besar pun muncul. Umat ​​​​Hindu, yang bertekad untuk melestarikan India yang bersatu, semakin berselisih dengan umat Islam, yang takut akan marginalisasi di negara mayoritas Hindu, dan menyerukan pembentukan tanah air yang terpisah. Ketegangan yang meningkat ini telah memicu bentrokan sengit antara faksi-faksi ekstremis dari kedua komunitas, sehingga menempatkan stabilitas negara dalam risiko yang serius."
 GOE_RAJ_partition.4.a: "Apakah ini salah kita?"
 GOE_RAJ_partition.4.b: "Kampanye untuk mengurangi ketegangan"
 GOE_RAJ_partition.4.c: "Penjarakan para agitator"
 GOE_RAJ_partition_become_free_to_stop_the_chaos_tt: "Kita bisa memperkirakan ketidakstabilan akan terus berlanjut sampai kita memperoleh kemerdekaan"
 GOE_RAJ_partition.5.t: "Bentrokan antara umat Hindu dan Islam"
 GOE_RAJ_partition.5.desc: "Ketika suara-suara dari umat Islam di [GetRajName] semakin menyerukan tanah air yang terpisah dari India, kaum nasionalis Hindu turun ke jalan untuk melakukan protes tandingan terhadap meningkatnya pengaruh umat Islam di negara tersebut, yang seringkali berujung pada bentrokan dengan kekerasan."
 GOE_RAJ_partition.5.a: "Situasinya berkembang..."
 GOE_RAJ_partition.5.b: "Meningkatkan Upaya Kepolisian"
 GOE_RAJ_partition.6.t: "Bertemu dengan Takdir"
 GOE_RAJ_partition.6.desc: "Bertahun-tahun yang lalu kita mengadakan pertemuan dengan takdir, dan kini saatnya tiba ketika kita harus menebus janji kita, tidak seluruhnya atau seluruhnya, namun secara substansial. Tepat tengah malam, ketika dunia tertidur, India akan terbangun untuk hidup dan kebebasan. Akan tiba saatnya, yang jarang terjadi dalam sejarah, ketika kita melangkah keluar dari masa lalu menuju masa baru, ketika sebuah zaman berakhir, dan ketika jiwa sebuah bangsa, yang telah lama tertekan, menemukan jawabannya."
 GOE_RAJ_partition.6.a: "Kita semua, apa pun agamanya, adalah anak-anak India."
 GOE_RAJ_partition.7.t: "Sebuah Pertanyaan tentang Kepemimpinan"
 GOE_RAJ_partition.7.desc: "Saat negara kita menutup satu babak yang didominasi oleh penaklukan, babak baru penentuan nasib sendiri pun terbuka"
 GOE_RAJ_partition.7.a: "Nehru adalah pilihan yang jelas"
 GOE_RAJ_partition.7.b: "Orang yang banyak berkorban, Gandhi"
 GOE_RAJ_partition.7.c: "Jinnah layak mendapat kesempatan"
 GOE_RAJ_partition.7.d: "Louis Mountbatten, kita masih membutuhkan bantuan mereka"
 GOE_RAJ_partition.8.t: "Gandhi selamat dari upaya pembunuhan."
 GOE_RAJ_partition.8.desc: "Seorang pria yang diidentifikasi sebagai Nathuram Godse mencoba melakukan upaya pembunuhan terhadap Mahatma Gandhi selama pertemuan doa multi-agama, tetapi ditangkap oleh anggota pengawal presiden sebelum dia dapat menembakkan senjatanya.\nGandhi dipastikan aman dan dibawa ke tempat aman; Juru bicaranya mengatakan bahwa dia terguncang oleh cobaan tersebut dan tampaknya telah memasuki perenungan mendalam tentang masa depan dunia dan posisinya di dalamnya."
 GOE_RAJ_partition.8.a: "Apa yang mungkin dia lihat di jurang yang gelap?"
 GOE_RAJ_partition.9.t: "[ENG.GetName] bersiap untuk terlibat"
 GOE_RAJ_partition.9.desc: "[ENG.GetName] telah menyatakan keprihatinan mendalam tentang permusuhan di anak benua India. Pemerintahannya telah menegaskan kepada kita bahwa mereka tidak ingin melihat kedua negara terlibat dalam perang berdarah, dan akan turun tangan, dengan kekuatan jika diperlukan, untuk mengakhirinya."
 GOE_RAJ_partition.9.a: "Kita hanya mempunyai waktu yang terbatas"
 GOE_RAJ_partition.10.t: "Perang di anak benua India"
 GOE_RAJ_partition.10.desc: "Perang telah pecah di anak benua India. Mungkin kita perlu turun tangan karena kita mempunyai pengaruh besar terhadap kedua negara dan mengakhiri kegilaan ini."
 GOE_RAJ_partition.10.a: "Kami tidak punya waktu"
 GOE_RAJ_partition.10.b: "Kita perlu mengakhirinya"
 #Loyalist Branch
 GOE_RAJ_partition.11.desc: "Selama bertahun-tahun, [RAJ.GetNameDef] sebagian besar dipimpin oleh laki-laki dari kalangan Kerajaan, namun dengan meningkatnya tuntutan akan pemerintahan sendiri, sangatlah penting bagi kita untuk membentuk Parlemen India yang baru. Hal ini akan memungkinkan kepemimpinan pribumi untuk memainkan peran dalam membentuk negara, sekaligus memastikan bangsa tersebut tetap mempertimbangkan kepentingan Kekaisaran. Oleh karena itu, kita harus mengambil keputusan tentang siapa yang harus memimpin pemerintahan baru ini."
 GOE_RAJ_loyalist.01.t: "[FROM.GetAdjective] Ekspor untuk Kekaisaran"
 GOE_RAJ_loyalist.01.desc: "Kami membawa kabar baik hari ini. Pimpinan dalam [RAJ.GetNameDef] mendekati kami dengan proposal untuk meningkatkan produksi dan ekspor barang kebutuhan pokok dari [RAJ.GetNonIdeologyName] ke wilayah Kekaisaran yang lebih luas. Kita bisa berharap toko-toko kita dipenuhi dengan teh, kapas, dan rami India karena [RAJ.GetNameDef] membuktikan dirinya sebagai aset berharga bagi wilayah kekuasaan kita yang melimpah."
 GOE_RAJ_loyalist.01.a: "$NSB_soviet_spanish_civil_war.4.a$"
 GOE_RAJ_loyalist.02.t: "$RAJ_the_empires_workshop$"
 GOE_RAJ_loyalist.02.desc: "Ada beberapa negosiasi menyeluruh mengenai pengembangan jalur produksi di seluruh Kekaisaran. Hal ini memungkinkan kami untuk membangun dan memperluas fasilitas industri di [?RAJ_crown_commodities_civ_built_flag.GetName]. Dengan harapan, hal ini akan memperkuat Kekaisaran dalam menghadapi tuntutan global yang semakin meningkat."
 GOE_RAJ_loyalist.02.a: "$NSB_soviet_civil_war_common.126.a$"
 GOE_RAJ_loyalist.03.t: "Proposal [FROM.GetAdjective] untuk Invasi ke Iran"
 GOE_RAJ_loyalist.03.desc: "Pagi ini, kantor pemerintahan [RAJ.GetNameDef] mendekati kami dengan proposal yang meminta izin untuk melancarkan invasi skala penuh terhadap [PER.GetNameDef]. Mereka mengemukakan berbagai alasan, termasuk melindungi koridor Persia dan terlebih dahulu mengklaim ladang minyak [PER.GetNameDef] sebelum musuh kita dapat menguasainya. Invasi seperti ini dapat memicu kemarahan komunitas global, namun sangatlah bodoh jika kita mengabaikan manfaatnya. Bagaimana kita harus melanjutkannya?"
 GOE_RAJ_loyalist.03.a: "Perang ini bisa bermanfaat bagi kita. Melanjutkan."
 GOE_RAJ_loyalist.03.b: "Perang dengan [PER.GetNameDef]? Tidak, terlalu berisiko."
 GOE_RAJ_loyalist.04.t: "[FROM.GetNameDefCap] Setuju Perang"
 GOE_RAJ_loyalist.04.desc: "Kami telah menerima kabar baik dari utusan kami untuk [ENG.GetNameDef]. Pemerintah [ENG.GetAdjective] telah setuju untuk mengizinkan kami mempersiapkan invasi ke [PER.GetNameDef]. Dengan restu dari Mahkota, kita harus mengerahkan pasukan kita dan bersiap untuk perang."
 GOE_RAJ_loyalist.04.a: "Kami berbaris ke [PER.GetNameDef]."
 GOE_RAJ_loyalist.05.t: "[FROM.GetNameDefCap] Minta Kami Mundur"
 GOE_RAJ_loyalist.05.desc: "Sayangnya, tampaknya permohonan kami untuk melakukan invasi di [PER.GetNameDef] tidak didengarkan. Kerajaan telah memutuskan bahwa kami tidak akan melancarkan operasi militer apa pun, dan meskipun kami mungkin tidak setuju, sebaiknya kami mengikuti perintah pemerintah [ENG.GetAdjective]."
 GOE_RAJ_loyalist.05.a: "Kita harus menghormati keinginan mahkota."
 GOE_RAJ_loyalist.06.t: "Komando Asia Tenggara"
 GOE_RAJ_loyalist.06.desc: "Dengan terbentuknya Komando Asia Tenggara, kita kini berada di persimpangan jalan. Kami memiliki sumber daya terbatas yang dapat kami dedikasikan untuk operasi ini, dan kami harus memutuskan apa yang harus kami fokuskan untuk mendukung upaya perang bersama dengan [ENG.GetNameDef]."
 GOE_RAJ_loyalist.06.a: "Kita harus meningkatkan pendanaan pertahanan kita."
 GOE_RAJ_loyalist.06.b: "Kami harus fokus pada kemampuan ofensif kami."
 GOE_RAJ_loyalist.06.c: "Angkatan udara [RAJ.GetAdjective] membutuhkan dukungan."
 GOE_RAJ_loyalist.06.d: "Mari kita tingkatkan operasi angkatan laut kita."
 GOE_RAJ_loyalist.07.t: "Pertahanan Malaya"
 GOE_RAJ_loyalist.07.desc: "Atas nama perlindungan, [FROM.GetNameDefCap] mengusulkan untuk menempatkan [event_target:RAJ.RAJ_annexing_country_target.GetName] di bawah administrasi [FROM.GetAdjective] untuk memastikan pengembangan pertahanannya. Meskipun skenario ini mungkin tidak ideal dalam kaitannya dengan kedaulatan kita, kita hanya dapat berasumsi bahwa ini hanya bersifat sementara. Atau setidaknya, kami berharap."
 GOE_RAJ_loyalist.07.a: "Kita tidak bisa membiarkan mereka melakukan hal ini."
 GOE_RAJ_loyalist.07.b: "Kita harus berkorban demi pertahanan kita."
 GOE_RAJ_loyalist.77.t: "Pertahanan Burma"
 GOE_RAJ_loyalist.08.desc: "Atas nama perlindungan, [FROM.GetNameDefCap] mengusulkan untuk menempatkan [event_target:RAJ.RAJ_annexing_country_target.GetName] di bawah administrasi [FROM.GetAdjective] untuk memastikan pengembangan pertahanannya. Meskipun skenario ini mungkin tidak ideal dalam kaitannya dengan kedaulatan kita, kita hanya dapat berasumsi bahwa ini hanya bersifat sementara. Atau setidaknya, kami berharap."
 GOE_RAJ_loyalist.08.a: "$GOE_RAJ_loyalist.07.a$"
 GOE_RAJ_loyalist.08.b: "$GOE_RAJ_loyalist.07.b$"
 GOE_RAJ_loyalist.09.t: "[FROM.GetNameDefCap] Menolak Rencana Pertahanan kami"
 GOE_RAJ_loyalist.09.desc: "Sayangnya, meskipun kami telah berupaya sebaik mungkin, [FROM.GetNameDef] telah menolak tawaran perlindungan kami. Tampaknya rencana pertahanan kami tidak cukup untuk menggoda mereka di bawah pengawasan kami."
 GOE_RAJ_loyalist.09.a: "Jadilah itu."
 GOE_RAJ_loyalist.10.t: "[FROM.GetNameDefCap] Transfer [event_target:RAJ.RAJ_annexing_country_target.GetName] Di Bawah Administrasi Kami"
 GOE_RAJ_loyalist.10.desc: "Berita bagus! [FROM.GetNameDefCap] telah setuju untuk mengizinkan kami menempatkan pasukan di wilayah mereka dan berupaya melindungi tanah mereka dari invasi asing. Ini akan sangat membantu upaya perang kita."
 GOE_RAJ_loyalist.10.a: "Luar biasa. Mulailah prosesnya."
 GOE_RAJ_loyalist.11.t: "$RAJ_the_jewel_becomes_the_crown$"
 GOE_RAJ_loyalist.11.desc: "Ini adalah hari yang gelap bagi Kekaisaran [ENG.GetAdjective]. Setelah jatuhnya [ENG.GetNameDef] kita berdiri dalam posisi yang sangat unik untuk menjadi tuan rumah bagi kepemimpinan mereka yang diasingkan. Hal ini sebagian merupakan upaya yang kami lakukan untuk menegaskan kembali kesetiaan kami kepada Kerajaan. $ENG_winston_churchill$ memimpin [ENG.GetNameDef] dengan kemampuan terbaiknya, dan kita harus memutuskan posisi apa yang dapat dia pegang di [RAJ.GetNameDef]."
 GOE_RAJ_loyalist.11.a: "$ENG_winston_churchill$ harus memimpin [RAJ.GetNameDef]."
 GOE_RAJ_loyalist.11.b: "Churchill paling baik bertugas sebagai penasihat."
 GOE_RAJ_loyalist.11.c: "Churchill tidak memiliki tempat di [RAJ.GetNameDef]."
 GOE_RAJ_loyalist.12.t: "$ENG_winston_churchill$ melarikan diri [ENG.GetNameDef]"
 GOE_RAJ_loyalist.12.desc: "Di masa sulit ini, masih ada harapan. Meskipun kami menyerah, $ENG_winston_churchill$ telah berhasil melarikan diri dari pulau dan menuju [RAJ.GetNameDef]. Dari sini, dia dapat mempertahankan kepentingan [ENG.GetAdjective] dan menjalankan operasi perang hingga kami dapat merebut kembali tanah air kami."
 GOE_RAJ_loyalist.12.a: "Perpisahan, $ENG_winston_churchill$."
 GOE_RAJ_loyalist.13.t: "Kembalinya $ENG_winston_churchill$"
 GOE_RAJ_loyalist.13.desc: "Dengan akhirnya tanah air kami kembali berada di bawah kendali kami, kami kini dapat mulai membangun kembali kabinet kami yang lama. $ENG_winston_churchill$ telah menerima pengembaliannya dengan baik dari [RAJ.GetNameDef] dan sekarang saatnya untuk memutuskan bagaimana kami akan melanjutkan."
 GOE_RAJ_loyalist.13.a: "$ENG_winston_churchill$ harus menjadi Perdana Menteri sekali lagi."
 GOE_RAJ_loyalist.13.b: "Kami tidak lagi membutuhkan jasanya."
 GOE_RAJ_loyalist.14.t: "[BRM.GetAdjective] $state_resource_tungsten$ untuk [FROM.GetName]"
 GOE_RAJ_loyalist.14.desc: "Pagi ini kami menerima utusan dari [FROM.GetNameDef]. Pemerintah mereka meminta hak untuk mengeksploitasi [BRM.GetAdjective] $state_resource_tungsten$ di [288.GetName] untuk mendukung upaya perang mereka yang semakin meningkat. Kita harus memutuskan bagaimana kita harus melanjutkan tawaran tersebut, karena tawaran tersebut tidak bisa dianggap enteng."
 GOE_RAJ_loyalist.14.a: "Kami bisa mengizinkan ini."
 GOE_RAJ_loyalist.14.b: "Kami mempunyai rencana lain untuk sumber daya tersebut."
 GOE_RAJ_loyalist.15.t: "[288.GetName] $state_resource_tungsten$ Diberikan kepada [RAJ.GetName]"
 GOE_RAJ_loyalist.15.desc: "Tuan kita [OVERLORD.GetNameDef] telah memberikan hak sumber daya kepada [RAJ.GetNameDef] untuk $state_resource_tungsten$ di [288.GetName], sehingga mereka dapat mendorong industri mereka dan berkontribusi pada upaya perang. Ini adalah kesempatan bagi kami untuk membuktikan kepada [OVERLORD.GetNameDef] bahwa kami berdedikasi mendukung kepentingan mereka di kawasan."
 GOE_RAJ_loyalist.15.a: "Ini bagus untuk diketahui."
 GOE_RAJ_loyalist.16.t: "[FROM.GetName] Memberikan Hak Eksploitasi Sumber Daya"
 GOE_RAJ_loyalist.16.desc: "[FROM.GetNameDefCap] telah memberi kami hak sumber daya untuk $state_resource_tungsten$ di [288.GetName]. Hal ini akan membantu kita dalam upaya perang, dan akan membantu kita untuk terus berjuang atas nama Kerajaan."
 GOE_RAJ_loyalist.16.a: "Sebuah keuntungan besar."
 GOE_RAJ_loyalist.17.t: "$state_resource_tungsten$ Burma Ditolak oleh [FROM.GetName]"
 GOE_RAJ_loyalist.17.desc: "Sayangnya, [FROM.GetNameDef] telah menolak petisi kami untuk mengeksploitasi $state_resource_tungsten$ Burma. Hal ini merupakan sebuah kekecewaan besar, karena sumber daya tersebut bisa saja sangat penting dalam mempertahankan pengembangan mesin perang kita."
 GOE_RAJ_loyalist.17.a: "Mengecewakan sekali."
  #EIC
 GOE_RAJ_eic.2.t: "Tunjuk seorang CEO"
 GOE_RAJ_eic.2.desc: "Sebuah perusahaan membutuhkan keteguhan dalam memandu pertumbuhannya, dan kita perlu memilih pemimpin yang akan memberikan hasil investasi tertinggi. Kepribadian mereka akan menular ke seluruh kelompok kepemimpinan, jadi penting bagi kita untuk melakukan hal ini dengan benar."
 GOE_RAJ_eic.2.a: "Mereka harus fleksibel"
 GOE_RAJ_eic.2.b: "Mereka harus berhemat"
 GOE_RAJ_eic.2.c: "Mereka harus mempunyai hubungan baik dengan pemerintah"
 GOE_RAJ_eic.2.d: "Mereka harus kejam"
 GOE_RAJ_eic.3.t: "[RAJ.GetName] menuntut kita untuk menerima Perdagangan Opium"
 GOE_RAJ_eic.3.desc: "[FROM.GetName] menuntut kita membiarkan Opium mengalir bebas antar negara kita. Jika masyarakat bersedia membayar untuk itu, lalu siapakah kita yang menolak hak konsumsi yang diberikan kepada mereka? Ini mungkin salah secara moral. dan merugikan individu, tapi siapakah kita yang bisa menghentikan mereka jika mereka bersedia membayar?  Satu-satunya masalah adalah bahwa pemerintah [FROM.GetAdjective] juga menuntut adanya pelabuhan perjanjian untuk lebih menyebarkan...barang."
 GOE_RAJ_eic.3.a: "Apakah mereka sudah gila?"
 GOE_RAJ_eic.3.b: "Biarkan teratai biru mengalir"
 GOE_RAJ_eic.4.t: "[FROM.GetName] menolak mentah-mentah"
 GOE_RAJ_eic.4.desc: "[FROM.GetName] terang-terangan menolak tuntutan kami, dan mengingatkan kami bahwa mereka adalah negara berdaulat dengan hukumnya sendiri. Fakta bahwa kami mencoba memaksakan tuntutan kami kepada mereka hampir merupakan penistaan."
 GOE_RAJ_eic.4.a: "Kami mencoba wortelnya, sekarang tongkatnya"
 GOE_RAJ_eic.5.t: "[FROM.GetName] Setuju"
 GOE_RAJ_eic.5.desc: "[FROM.GetName] telah setuju untuk memperdagangkan Opium dalam jumlah besar antar negara kita. Dengan perjanjian pelabuhan baru kami dapat mendistribusikan barang secara langsung ke seluruh dunia. Biarkan konsumsi ini mendekatkan kawan dan lawan."
 GOE_RAJ_eic.5.a: "Kesepakatan Tanpa Hal-Hal Kasar"
 GOE_RAJ_eic.6.t: "[RAJ.GetName] ingin membeli [RAJ_i_want_to_buy_this_land.GetName]"
 GOE_RAJ_eic.6.desc: "[RAJ.GetName], yang ingin memperluas operasi bisnisnya telah memberi kami tawaran agar mereka mengakuisisi [RAJ_i_want_to_buy_this_land.GetName] dengan imbalan sejumlah besar investasi di negara kami."
 GOE_RAJ_eic.6.a: "Kami tidak bersedia menjual tanah ini"
 GOE_RAJ_eic.6.a_tt: "[FROM.GetName] tidak akan dapat meminta negara bagian ini lagi, tetapi dapat meminta negara bagian lain."
 GOE_RAJ_eic.6.b: "Tidak pernah"
 GOE_RAJ_eic.6.b_tt: "[FROM.GetName] tidak dapat meminta tanah lagi kepada kami"
 GOE_RAJ_eic.6.c: "Kedengarannya seperti kesepakatan"
 GOE_RAJ_eic.7.t: "[FROM.GetName] tidak bersedia menyerahkan tanahnya"
 GOE_RAJ_eic.7.desc: "[FROM.GetName] tidak bersedia menyerahkan sebidang tanah tersebut, namun tidak menutup kemungkinan adanya peluang lain di kemudian hari untuk pengalihan hak atas tanah yang berbeda."
 GOE_RAJ_eic.7.a: "Mereka akan datang"
 GOE_RAJ_eic.8.t: "[FROM.GetName] mengesampingkan transfer apa pun"
 GOE_RAJ_eic.8.desc: "[FROM.GetName] telah mengesampingkan segala pengalihan tanah kepada kami, dengan menyatakan bahwa bahkan mengusulkan hal tersebut merupakan penghinaan terhadap kesusilaan umum"
 GOE_RAJ_eic.8.a: "Sikap Aneh"
 GOE_RAJ_eic.9.t: "[FROM.GetName] menerima"
 GOE_RAJ_eic.9.desc: "[FROM.GetName] telah menerima perdagangan tersebut. Kami akan segera mengirimkan uang kepada mereka dan transfer aset akan segera terjadi"
 GOE_RAJ_eic.9.a: "Penawaran hebat!"
  # MUGHAL EMPIRE
 GOE_RAJ_princely.1.t: "Pilih Pangeran untuk memimpin [ROOT.GetNameDef]"
 GOE_RAJ_princely.1.desc: "Kerajaan bersejarah Babur sangat luas dan penuh kebajikan, dan memerintah benua ini selama ratusan tahun. Ada banyak pekerjaan yang harus kita lakukan jika kita ingin menghidupkan warisan ini. Meski banyak dari garis keturunan Gurkani yang bertahan, hanya satu yang bisa membawa kita menuju kejayaan."
 GOE_RAJ_princely.1.a: "Mir Osman Ali Khan akan memimpin kerajaan kita menuju kejayaan"
 GOE_RAJ_princely.1.b: "Mirza Khurshid Jah Bahadur adalah pilihan paling masuk akal"
 GOE_RAJ_princely.1.c: "Ahmad Yar Khan akan melindungi kita!"
 GOE_RAJ_princely.1.d: "Huseyn Shaheed Suhrawardy akan memimpin kita menuju masa depan!"
 GOE_RAJ_princely.2.t: "Pilih Pangeran untuk memimpin [ROOT.GetNameDef]"
 GOE_RAJ_princely.2.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.2.a: "Huseyn Shaheed Suhrawardy akan memimpin kita menuju masa depan!"
 GOE_RAJ_princely.2.b: "Maharaja Hari Singh memiliki keinginan rakyat!"
 GOE_RAJ_princely.2.c: "Bodh Chandra Singh adalah ahli strategi terhebat kami!"
 GOE_RAJ_princely.2.d: "Tak satu pun dari mereka cukup baik."
 GOE_RAJ_princely.3.t: "Pilih Pangeran untuk memimpin [ROOT.GetNameDef]"
 GOE_RAJ_princely.3.desc: "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.3.a: "Umed Singh mempunyai cara yang baik dalam menghadapi masyarakat."
 GOE_RAJ_princely.3.b: "Pratap Singh Rao Gaekwad adalah pilihan yang jelas!"
 GOE_RAJ_princely.3.c: "Maharaja Jayachamarajendra Wadiyar adalah yang terbaik."
 GOE_RAJ_princely.3.d: "Mungkin kita akan mempertimbangkan kembali daftar pertama."
 GOE_RAJ_navy.1.t: "[RAJ.GetNameDefCap] mengusulkan perjanjian angkatan laut"
 GOE_RAJ_navy.1.desc: "[RAJ.GetLeader] telah mengirimkan proposal kepada kami untuk membuat perjanjian perdagangan angkatan laut antara pemerintahan [RAJ.GetAdjective] dan [ENG.GetAdjective].\nHal ini akan memungkinkan terjadinya kolaborasi timbal balik dalam produksi angkatan laut serta membuka pintu bagi perjanjian perdagangan tambahan di masa depan."
 GOE_RAJ_navy.1.a: "Ini akan sangat menguntungkan kita berdua!"
 GOE_RAJ_navy.1.b: "Kami tidak tertarik."
 GOE_RAJ_navy.2.t: "[FROM.GetNameDefCap] Menerima!"
 GOE_RAJ_navy.2.desc: "Pejabat dari [FROM.GetNameDefCap] telah menyetujui usulan perjanjian angkatan laut dan telah menandatangani perjanjian tersebut, hal ini akan sangat bermanfaat bagi kita untuk bergerak maju."
 GOE_RAJ_navy.2.a: "Sempurna"
 GOE_RAJ_navy.3.t: "[ENG.GetNameDefCap] menolak perjanjian perdagangan."
 GOE_RAJ_navy.3.desc: "Pejabat dari [FROM.GetNameDefCap] telah menolak usulan perjanjian angkatan laut kami, dengan menyatakan bahwa perjanjian tersebut tidak memberikan manfaat bagi mereka dan jelas-jelas bersifat sepihak."
 GOE_RAJ_navy.3.a: "Sayang sekali."
 GOE_RAJ_navy.4.t: "[RAJ.GetNameDefCap] meminta pemindahan komandan angkatan laut"
 GOE_RAJ_navy.4.desc: "Pejabat dari [RAJ.GetNameDefCap] telah meminta kami memindahkan salah satu Komandan Angkatan Laut kami untuk bertugas di Angkatan Laut Kerajaan India guna membantu upaya mereka memperluas dan membantu melatih Marinir baru. Ini adalah usaha yang mahal, namun mereka menawarkan bayaran yang besar."
 GOE_RAJ_navy.4.a: "Pengorbanan itu sepadan."
 GOE_RAJ_navy.4.b: "Dalam keadaan apa pun kami tidak akan menyetujui hal ini!"
 GOE_RAJ_navy.5.t: "[ENG.GetNameDefCap] Menerima!"
 GOE_RAJ_navy.5.desc: "Pejabat dari [FROM.GetNameDefCap] telah setuju untuk mengirim salah satu Komandan mereka ke [RAJ.GetNameDefCap] untuk membantu ekspansi angkatan laut kita."
 GOE_RAJ_navy.5.a: "Sempurna"
 GOE_RAJ_navy.6.t: "[ENG.GetNameDefCap] telah menolak tawaran tersebut."
 GOE_RAJ_navy.6.desc: "Pejabat dari [FROM.GetNameDefCap] menolak mengirim salah satu Komandan mereka ke [RAJ.GetNameDefCap], dan bersikeras agar kami melatih komandan kami sendiri."
 GOE_RAJ_navy.6.a: "Sayang sekali."
 GOE_RAJ_navy.7.t: "[RAJ.GetNameDefCap] meminta pembelian kapal kami yang dinonaktifkan"
 GOE_RAJ_navy.7.desc: "[FROM.GetLeader] telah meminta untuk membeli kapal lama kami yang telah dinonaktifkan, kapal tersebut saat ini tidak digunakan, namun [FROM.GetLeader] bersikeras [FROM.GetNameDefCap] dapat menggunakannya. Mereka menawarkan pembayaran yang besar"
 GOE_RAJ_navy.7.a: "Lagipula kami tidak menggunakannya!"
 GOE_RAJ_navy.7.b: "Kami tidak tertarik."
 GOE_RAJ_navy.8.t: "[ENG.GetNameDefCap] menerima tawaran dagang kami!"
 GOE_RAJ_navy.8.desc: "[FROM.GetLeader] telah menerima permintaan kami untuk membeli kapal mereka yang dinonaktifkan, mereka akan segera tiba di India."
 GOE_RAJ_navy.8.a: "Ini adalah kabar baik bagi Angkatan Laut Kerajaan India!"
 GOE_RAJ_navy.9.t: "[ENG.GetNameDefCap] telah menolak tawaran tersebut."
 GOE_RAJ_navy.9.desc: "[FROM.GetLeader] telah menolak tawaran kami untuk membeli kapal mereka, dan kami sekarang harus mencari alternatif untuk memperluas angkatan laut kami."
 GOE_RAJ_navy.9.a: "Sayang sekali."
 GOE_RAJ_navy.10.t: "[RAJ.GetNameDefCap] meminta hak atas kontrak kapal modern."
 GOE_RAJ_navy.10.desc: "Pejabat dari [RAJ.GetNameDefCap] telah meminta untuk membeli hak atas kontrak kapal modern kami, dan meminta hak untuk mengembangkan Kapal Penjelajah 1936 kami untuk Angkatan Laut Kerajaan India. Mereka menawarkan untuk membayar kami dengan mahal untuk kontrak tersebut."
 GOE_RAJ_navy.10.a: "Kesepakatan yang saling menguntungkan!"
 GOE_RAJ_navy.10.b: "Kami tidak tertarik."
 GOE_RAJ_navy.11.t: "[ENG.GetNameDefCap] setuju untuk memberi kami kontrak kapal modern!."
 GOE_RAJ_navy.11.desc: "Pejabat dari [ENG.GetNameDefCap] telah menanggapi permintaan kami dan setuju untuk memberi kami kontrak kapal yang lebih baik, kami telah menerima lima kapal penjelajah yang akan tiba sekarang."
 GOE_RAJ_navy.11.a: "Ini adalah kabar baik bagi Angkatan Laut Kerajaan India!"
 GOE_RAJ_navy.12.t: "[ENG.GetNameDefCap] telah menolak tawaran tersebut."
 GOE_RAJ_navy.12.desc: "Pejabat dari [ENG.GetNameDefCap] telah menanggapi permintaan kami dan menolak memberi kami kontrak kapal yang lebih baik, dengan menyatakan bahwa tawaran kami terlalu rendah untuk mereka pertimbangkan."
 GOE_RAJ_navy.12.a: "Sayang sekali."
 GOE_RAJ_goa.1.t: "[RAJ.GetNameDefCap] menuntut Goa"
 GOE_RAJ_goa.1.desc: "[RAJ.GetLeader] telah menuntut reklamasi Goa. [RAJ.GetLeader] bersikeras bahwa Goa adalah wilayah [RAJ.GetAdjective] dan mengancam akan melakukan tindakan militer jika kita tidak menyerahkannya kepada mereka."
 GOE_RAJ_goa.1.a: "Hal ini tidak sebanding dengan potensi konflik yang ada."
 GOE_RAJ_goa.1.b: "Tentu saja tidak. Goa adalah milik kita!"
 GOE_RAJ_goa.2.t: "[FROM.GetNameDefCap] melepaskan Goa"
 GOE_RAJ_goa.2.desc: "[FROM.GetLeader] telah memutuskan untuk membatalkan masalah ini dan mengizinkan kami mencaplok Goa untuk mencegah konflik."
 GOE_RAJ_goa.2.a: "Goa adalah milik kita!"
 GOE_RAJ_goa.3.t: "[FROM.GetNameDefCap] menolak pemindahan Goa"
 GOE_RAJ_goa.3.desc: "[FROM.GetLeader] telah menanggapi tuntutan kami dan menolak hak kami atas Goa meskipun kami ada ancaman tindakan militer."
 GOE_RAJ_goa.3.a: "Ini berarti perang!"
 GOE_RAJ_goa.3.b: "Setelah dipikir-pikir, mari kita mundur."
 GOE_RAJ_goa.4.t: "[RAJ.GetNameDefCap] mundur."
 GOE_RAJ_goa.4.desc: "[RAJ.GetLeader] telah menanggapi ancaman aksi militer kami dan [RAJ.GetAdjective] tentara telah dipindahkan dari Goa."
 GOE_RAJ_goa.4.a: "Bagus."
 GOE_RAJ_generals.1.t: "Pertukaran Kadet Kolonial"
 GOE_RAJ_generals.1.desc: "[RAJ.GetLeader] telah meminta untuk mengirim pasukan [RAJ.GetAdjective] ke [ENG.GetNameDefCap] untuk dilatih oleh tentara Inggris, dan menawarkan pembayaran yang besar untuk layanan ini."
 GOE_RAJ_generals.1.a: "Tentu saja!"
 GOE_RAJ_generals.1.b: "Kami tidak tertarik."
 GOE_RAJ_generals.2.t: "[ENG.GetNameDefCap] menerima!"
 GOE_RAJ_generals.2.desc: "[ENG.GetLeader] telah menanggapi usulan kami dan setuju untuk mengizinkan kami mengirimkan pasukan kami ke [ENG.GetNameDefCap]"
 GOE_RAJ_generals.2.a: "Hebat!"
 GOE_RAJ_generals.3.t: "[ENG.GetNameDefCap] menolak tawaran kami."
 GOE_RAJ_generals.3.desc: "[ENG.GetLeader] telah menanggapi proposal kami dan menyatakan tidak tertarik."
 GOE_RAJ_generals.3.a: "Sayang sekali."
