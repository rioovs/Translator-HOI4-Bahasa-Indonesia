 #### INDUSTRIAL EVENTS ####
 ###########################
 PER_industrial_events.1.t: "[FROM.GetNameDefCap] Menawarkan Hak Sumber Daya"
 PER_industrial_events.1.desc: "Pemerintah [PER.GetAdjective] hari ini telah mendekati kami dengan tawaran hak sumber daya atas minyak yang baru mereka peroleh di $STATE_413$. Daerah yang dimaksud kaya akan sumber daya yang penting. Mungkin ini tawaran yang patut dipertimbangkan?"
 PER_industrial_events.1.a: "Ini sepertinya kesepakatan bisnis yang bagus"
 PER_industrial_events.1.b: "Kami tidak memerlukan hal ini."
 PER_industrial_events.2.t: "[FROM.GetNameDefCap] Menerima Penawaran Dagang Kami"
 PER_industrial_events.2.desc: "[FROM.GetNameDefCap] telah dengan baik hati menerima tawaran kami mengenai minyak yang baru diperoleh. Hal ini hanya akan mengembangkan kerajaan minyak bumi kita yang luas."
 PER_industrial_events.2.a: "Itu hanya bisnis yang bagus!"
 PER_resource_rights_on_war_tt: "§RJika perang pecah antara negara kita, hak sumber daya dan pabrik Offmap akan dihapus!§!"
 PER_industrial_events.3.t: "[FROM.GetNameDefCap] Menolak Penawaran Dagang Kami"
 PER_industrial_events.3.desc: "Sayangnya, [FROM.GetNameDef] telah menolak kesepakatan perdagangan minyak [PER.GetAdjective] kita yang murah hati. Mungkin lebih baik kita membawa bisnis kita ke tempat lain?"
 PER_industrial_events.3.a: "Itu kerugian mereka!"
 #########################
 #### IMPERIAL EVENTS ####
 #########################
 PER_imperial_events.1.t: "[FROM.GetNameDefCap] Ingin Bernegosiasi Non-Agresi"
 PER_imperial_events.1.desc: "Pagi ini, utusan dari [PER.Capital.GetCapitalVictoryPointName] tiba di [SOU.Capital.GetCapitalVictoryPointName] dengan tawaran dari Shah [PER.GetNameDef] untuk menandatangani pakta Non-Agresi guna menjamin keamanan kedua negara kita. Mengingat kedekatan [PER.GetNameDef] dengan perbatasan selatan kita, hal ini harus kita pertimbangkan."
 PER_imperial_events.1.a: "Kami setuju. Ini yang terbaik."
 PER_imperial_events.1.b: "Kami tidak bisa menyetujui hal ini."
 PER_imperial_events.2.t: "[SOU.GetNameDefCap] Menyetujui Pakta Non-Agresi"
 PER_imperial_events.2.desc: "Kabar baik! Diplomat kami telah kembali dari [SOU.Capital.GetCapitalVictoryPointName] dengan kabar bahwa [SOU.GetNameDef] ingin bergabung dengan kami dalam pakta non-agresi. Hal ini akan memungkinkan kita untuk terus merumuskan rencana perang kita tanpa melibatkan [SOU.GetAdjective] yang mengganggu."
 PER_imperial_events.2.a: "Berita bagus."
 PER_imperial_events.3.t: "[SOU.GetNameDefCap] Menolak Tawaran Kami"
 PER_imperial_events.3.desc: "Sayangnya, kami tidak berhasil meyakinkan [SOU.GetNameDef] untuk menandatangani pakta non-agresi. Ini berarti kita harus waspada terhadap ancaman dari utara jika kita melanjutkan rencana ekspansi kita."
 PER_imperial_events.3.a: "Sebuah peristiwa yang disayangkan..."
 PER_imperial_events.10.t: "[FROM.GetNameDefCap] Menuntut Wilayah Baluchistan"
 PER_imperial_events.10.desc: "Sebuah pesan diterima dari Shah [PER.GetNameDef] hari ini menuntut agar kami menyerahkan kendali kami atas wilayah Baluchistan kepada mereka. Menurut pemerintah [PER.GetAdjective], wilayah ini adalah milik mereka atas hak ilahi. Kita harus hati-hati, kalau kita memprovokasi mereka, bisa-bisa mereka menyatakan perang terhadap kita."
 PER_imperial_events.10.a: "Kami tidak punya pilihan selain menyerah pada mereka."
 PER_imperial_events.10.b: "Mungkin kita bisa membuat mereka membayarnya?"
 PER_imperial_events.10.c: "Mereka dapat mengambilnya dari tangan kita yang dingin dan mati."
 PER_imperial_events.11.t: "[FROM.GetNameDefCap] Setuju Melepaskan Baluchistan"
 PER_imperial_events.11.desc: "Berita bagus. [FROM.GetNameDefCap] telah membuat keputusan cerdas untuk menyerahkan wilayah Baluchistan ke dalam kendali kami. Kami akhirnya memiliki pijakan di wilayah Indus."
 PER_imperial_events.11.a: "Kerja bagus."
 PER_imperial_events.12.t: "[FROM.GetNameDefCap] Penawaran untuk Menjual Baluchistan"
 PER_imperial_events.12.desc: "Tampaknya pemerintah [RAJ.GetAdjective] tidak ingin melepaskan Baluchistan dari wilayahnya tanpa mendapatkan kompensasi apa pun. Kita bisa memenuhi tuntutan mereka atau menyatakan perang terhadap mereka. Pilihan ada di tangan Anda."
 PER_imperial_events.12.a: "Baiklah, jika kita harus melakukannya."
 PER_imperial_events.12.b: "Kalau begitu, kami akan mengambilnya dengan paksa."
 PER_imperial_events.12.c: "Ini semua terlalu beresiko. Batalkan negosiasi."
 PER_imperial_events.13.t: "[FROM.GetNameDefCap] Setuju Membeli Baluchistan"
 PER_imperial_events.13.desc: "Berita bagus! Shah [PER.GetNameDef] telah setuju untuk membayar kami atas pengalihan Baluchistan ke dalam kendali mereka. Kami mungkin kehilangan sebagian kecil wilayah kami, namun uang tersebut akan membantu usaha kami."
 PER_imperial_events.13.a: "Fantastis!"
 PER_imperial_events.14.t: "[FROM.GetNameDefCap] Mengancam Perang"
 PER_imperial_events.14.desc: "Saya khawatir pertaruhan kami tidak membuahkan hasil, karena setelah menerima pemberitahuan kami, Syah [PER.GetNameDef] secara resmi mengancam perang terhadap bangsa kami. Pasukan mereka bersiap menyerbu Indus dan mengambil apa yang mereka inginkan dengan paksa. Ini adalah keadaan yang menyedihkan."
 PER_imperial_events.14.a: "Kumpulkan pasukan kita!"
 PER_imperial_events.15.t: "[FROM.GetNameDefCap] Mundur"
 PER_imperial_events.15.desc: "Tampaknya [PER.GetNameDef] telah memutuskan bahwa mencoba mengambil alih wilayah Baluchistan dari kami tidak sebanding dengan risikonya. Setidaknya kita bisa memiliki kedamaian, untuk saat ini."
 PER_imperial_events.15.a: "Syukurlah untuk itu."
 PER_imperial_events.16.t: "[FROM.GetNameDefCap] Menolak Melepaskan Baluchistan"
 PER_imperial_events.16.desc: "Tampaknya pemerintah [RAJ.GetAdjective] dengan tegas menolak menyerahkan wilayah Baluchistan. Sudah waktunya bagi kita untuk tetap berpegang teguh dan menyatakan perang terhadap [RAJ.GetNameDef]!"
 PER_imperial_events.16.a: "Kalau begitu, peranglah."
 PER_imperial_events.20.t: "Reza Shah Pahlavi Dibunuh!"
 PER_imperial_events.20.desc: "Suara tembakan terdengar di pusat kota Teheran sore ini ketika, saat berpidato di depan umum, Reza Shah Pahlavi terkena peluru dan berada dalam kondisi kritis. Terlepas dari upaya terbaik dari petugas pertolongan pertama, Shah dengan sedih meninggal karena luka-lukanya. Pelakunya terungkap adalah perwira di tentara [PER.GetAdjective], yang tidak setuju dengan kepemimpinan Shah. Putra Reza Shah Pahlavi, Mohammed Reza Pahlavi, akan dilantik sebagai Shah baru [PER.GetNameDef]. Mari kita berharap pemerintahannya tidak terlalu bergejolak."
 PER_imperial_events.20.a: "Hari yang menyedihkan bagi [PER.GetNameDef]..."
 PER_imperial_events.30.t: "Perayaan Kekaisaran Persia"
 PER_imperial_events.30.desc: "Untuk merayakan berdirinya Kekaisaran Achaemenid kuno oleh Cyrus Agung, Shah [PER.GetNameDef] telah mengorganisir demonstrasi mewah untuk menyoroti peradaban dan sejarah kuno [PER.GetNonIdeologyName] serta memamerkan kemajuan kontemporer di bawah pemerintahannya. Para pemimpin besar dari seluruh negara besar di dunia diundang untuk bergabung dalam perayaan ini, namun ketidakpuasan dengan cepat menyebar di kalangan masyarakat miskin di [PER.GetNameDef], yang percaya bahwa pameran tersebut hanya membuang-buang uang. Namun, saat-saat indah dinikmati oleh semua tamu, yang dapat menyantap makanan lezat dan menjadi saksi parade militer terkemuka."
 PER_imperial_events.30.a: "Sungguh waktu yang sangat indah!"
 PER_imperial_events.40.t: "Memilih Syahbanu"
 PER_imperial_events.40.desc: "Dalam masa persiapannya untuk mengambil alih jabatan Shah, Mohammed Reza Pahlavi memiliki banyak kesempatan untuk mencari cinta. Ada tiga wanita yang menarik perhatiannya, tapi hanya satu yang bisa dinobatkan sebagai Shahbanu dan memerintah bersamanya sebagai bupati [PER.GetNameDef]. Ada Fawzia dari Mesir, putri seorang Sultan; Iran Teymourtash, orang pertama yang ditaksir Shah; dan Irandokht, mantan putri Qajar yang bertemu Shah di Swiss."
 PER_imperial_events.40.a: "Shah akan menikahi Fawzia dari Mesir"
 PER_imperial_events.40.b: "Shah akan menikahi Iran Teymourtash"
 PER_imperial_events.40.c: "Shah akan menikahi Irandokht Qajar"
 PER_imperial_events.50.t: "Reza Shah Pahlavi Selamat dari Upaya Pembunuhan!"
 PER_imperial_events.50.desc: "Suara tembakan terdengar di pusat kota Teheran sore ini ketika, saat berpidato di depan umum, Reza Shah Pahlavi hampir terkena peluru dalam upaya pembunuhan yang gagal. Pelakunya segera ditangkap dan diketahui sebagai perwira di tentara [PER.GetAdjective], yang tidak setuju dengan kepemimpinan Shah. Shah telah menggunakan upaya ini dalam hidupnya sebagai cara untuk menggalang rakyat demi tujuannya."
 PER_imperial_events.50.a: "Syukurlah untuk itu!"
 PER_imperial_events.60.t: "[FROM.GetNameDefCap] Ingin Bernegosiasi Non-Agresi"
 PER_imperial_events.60.desc: "Pagi ini, utusan dari [PER.Capital.GetCapitalVictoryPointName] tiba di [GER.Capital.GetCapitalVictoryPointName] dengan tawaran dari Shah [PER.GetNameDef] untuk menandatangani pakta Non-Agresi guna menjamin keamanan kedua negara kita. Mengingat produksi sumber daya penting seperti minyak yang sangat besar di [PER.GetNameDef], hal ini harus kita pertimbangkan."
 PER_imperial_events.60.a: "Kami setuju. Ini yang terbaik."
 PER_imperial_events.60.b: "Kami tidak bisa menyetujui hal ini."
 PER_imperial_events.61.t: "[GER.GetNameDefCap] Menyetujui Pakta Non-Agresi"
 PER_imperial_events.61.desc: "Kabar baik! Diplomat kami telah kembali dari [GER.Capital.GetCapitalVictoryPointName] dengan kabar bahwa [GER.GetNameDef] ingin bergabung dengan kami dalam pakta non-agresi. Dengan mempertimbangkan tujuan [GER.GetNameDef], ini adalah hal terbaik yang dapat kita lakukan untuk menjamin keamanan negara kita."
 PER_imperial_events.61.a: "Berita bagus."
 PER_imperial_events.62.t: "[GER.GetNameDefCap] Menolak Tawaran Kami"
 PER_imperial_events.62.desc: "Sayangnya, kami tidak berhasil meyakinkan [GER.GetNameDef] untuk menandatangani pakta non-agresi. Ini memalukan, tapi mungkin kita masih bisa bergabung dengan faksi mereka di masa depan."
 PER_imperial_events.62.a: "Sebuah peristiwa yang disayangkan..."
 PER_imperial_events.70.t: "Reza Shah Pahlavi Ingin Mengunjungi [GER.GetNameDef]"
 PER_imperial_events.70.desc: "Kami menerima surat pagi ini, dikirimkan kepada kami langsung dari istana Sa'dabad di Teheran, [PER.GetNameDef]. Itu adalah pesan niat baik dari Reza Shah Pahlavi sendiri, yang menyatakan minatnya mengunjungi Berlin dengan harapan dapat meningkatkan hubungan kedua negara. Führer sangat ingin menjaga hubungan baik dengan [PER.GetNameDef]. Apa yang harus kita lakukan?"
 PER_imperial_events.70.a: "Tawaran yang menyenangkan. Sampaikan undangannya."
 PER_imperial_events.70.b: "Kita tidak punya waktu untuk hal-hal sepele seperti itu"
 PER_imperial_events.71.t: "[GER.GetNameDefCap] Menyampaikan Undangan Berkunjung"
 PER_imperial_events.71.desc: "Menanggapi surat niat baik kami kepada [GER.GetNameDef], [GER.GetLeader] telah menyatakan minatnya untuk mengunjungi Berlin dengan harapan dapat meningkatkan hubungan antar negara baru kita. Ini pasti merupakan perjalanan yang singkat, karena ada banyak urusan yang harus kita selesaikan di Teheran, namun ada baiknya kita tetap memihak [GER.GetNameDef], mengingat situasi dunia yang sedang tegang."
 PER_imperial_events.71.a: "Saya mendengar Gerbang Brandenburg indah sepanjang tahun ini!"
 PER_imperial_events.72.t: "[GER.GetNameDefCap] terlalu Sibuk untuk Dihosting"
 PER_imperial_events.72.desc: "Menanggapi surat niat baik kami kepada [GER.GetNameDef], [GER.GetLeader] sayangnya menolak tawaran kami untuk datang dan mengunjungi Berlin. Ini sangat disayangkan, karena ini mungkin merupakan kesempatan bagus untuk bekerja sama dengan pemimpin yang berkuasa. Sayangnya, hal itu tidak terjadi."
 PER_imperial_events.72.a: "Oh baiklah, kalau begitu kembalilah bekerja."
 PER_imperial_events.80.t: "Situasi di [PER.GetNameDef]"
 PER_imperial_events.80.desc: "Sayangnya, dorongan baru-baru ini dari tentara [PER.GetAdjective] telah menimbulkan banyak kerugian di pihak kita, terutama karena mereka menguasai sejumlah wilayah kita. Situasi di [PER.GetNameDef] telah berkembang tidak menguntungkan bagi kami, dan kami mungkin ingin mempertimbangkan untuk mengkonsolidasikan kekalahan kami dan menarik pasukan dari wilayah tersebut. Namun, hal ini akan mengakibatkan kita menyerahkan sebagian wilayah yang hilang kepada [PER.GetAdjective]."
 PER_imperial_events.80.a: "Kami memiliki masalah yang lebih besar di tempat lain. Tarik Pasukan kami"
 PER_imperial_events.80.b: "Tidak! Kita harus terus maju!"
 PER_imperial_events.100.t: "Perjanjian Teheran"
 PER_imperial_events.100.desc: "Setelah berhasil mengusir penjajah dan mengirim mereka kembali ke tanah mereka sendiri, kami dapat menghubungi musuh-musuh kami untuk mengundang diplomat mereka ke Teheran untuk memulai perundingan damai. Untungnya, mereka menerima saran tersebut, dan setelah berdiskusi selama berjam-jam, kami sepakat bahwa mereka akan berhenti menyerang [PER.GetNameDef] sambil menyerahkan wilayah perbatasan mereka sebagai dampaknya."
 PER_imperial_events.100.a: "Semoga mereka tidak pernah mencoba menyerang lagi."
 PER_imperial_events.101.t: "Negosiasi yang Gagal"
 PER_imperial_events.101.desc: "Setelah berhasil mengusir penjajah dan mengirim mereka kembali ke tanah mereka sendiri, kami dapat menghubungi musuh-musuh kami untuk mengundang diplomat mereka ke Teheran untuk memulai perundingan damai. Sayangnya, mereka tidak menerima perundingan damai kami, dan akibatnya perang terus berlanjut."
 PER_imperial_events.101.a: "Kami akan mendorong mereka ke ibukota mereka!"
 PER_imperial_events.110.t: "$PER_imperial_events.80.t$"
 PER_imperial_events.110.desc: "$PER_imperial_events.80.desc$"
 PER_imperial_events.110.a: "$PER_imperial_events.80.a$"
 PER_imperial_events.110.b: "$PER_imperial_events.80.b$"
 PER_imperial_events.111.t: "Mengamankan Negara Penyangga Kita"
 PER_imperial_events.111.desc: "Setelah berhasil mengusir [SOV.GetAdjective] dan mengirim mereka kembali ke tanah mereka sendiri, kami dapat menghubungi musuh-musuh kami untuk mengundang diplomat mereka ke Teheran untuk memulai perundingan damai. Untungnya, mereka menerima saran tersebut, dan setelah berdiskusi selama berjam-jam, kami sepakat bahwa mereka akan menyerahkan wilayah perbatasan mereka sebagai kompromi untuk berperang dalam perang yang berkepanjangan."
 PER_imperial_events.111.a: "Rencana kami berhasil!"
 PER_imperial_events.112.t: "Negosiasi yang Gagal"
 PER_imperial_events.112.desc: "Setelah berhasil mengusir [SOV.GetAdjective] dan mengirim mereka kembali ke tanah mereka sendiri, kami dapat menghubungi musuh-musuh kami untuk mengundang diplomat mereka ke Teheran untuk memulai perundingan damai. Sayangnya, mereka tidak menerima perundingan damai kami, dan akibatnya perang terus berlanjut."
 PER_imperial_events.112.a: "Kami akan mendorong mereka ke ibukota mereka!"
 PER_imperial_events.120.t: "[PER.GetNameDefCap] Menegosiasikan Penyerahan Mereka"
 PER_imperial_events.120.desc: "Pagi ini kami menerima kabar dari pemerintah [PER.GetAdjective] dengan niat untuk menyerah dan memulai proses penyerahan. Sebagai bagian dari hal ini, mereka bersedia mengizinkan kami menduduki tanah mereka sementara mereka tetap mempertahankan monarki sebagai pemimpin boneka. Bagaimana tanggapan kita?"
 PER_imperial_events.120.a: "Ya, kedengarannya menyenangkan"
 PER_imperial_events.120.b: "Sama sekali tidak, dorong ke ibu kota."
 PER_imperial_events.121.t: "[ENG.GetNameDefCap] Menerima Proposal Kami"
 PER_imperial_events.121.desc: "Untungnya, pemerintah [ENG.GetAdjective] telah setuju untuk mengizinkan kami terus menjalankan [PER.GetNameDef] di bawah pengawasan mereka. Semoga ini bisa mengakhiri pertumpahan darah dan kematian."
 PER_imperial_events.121.a: "Ini melegakan..."
 PER_imperial_events.122.t: "[ENG.GetNameDefCap] Menolak Usulan Kami"
 PER_imperial_events.122.desc: "Sayangnya, pemerintah [ENG.GetAdjective] menolak usulan penyerahan kami. Artinya kita harus terus berjuang, tapi kalau kalah, kemungkinan besar kita akan menyerah sesuai syarat mereka."
 PER_imperial_events.122.a: "Ini adalah masa-masa kelam..."
 PER_imperial_events.130.t: "[PER.GetNameDefCap] Menegosiasikan Penyerahan Mereka"
 PER_imperial_events.130.desc: "Pagi ini kami menerima kabar dari pemerintah [PER.GetAdjective] dengan niat untuk menyerah dan memulai proses penyerahan. Sebagai bagian dari hal ini, mereka bersedia menyerahkan wilayah utara mereka kepada kami dan mengizinkan mereka untuk dianeksasi ke dalam tanah kami. Apa yang harus kita lakukan?"
 PER_imperial_events.130.a: "Ya, kedengarannya menyenangkan"
 PER_imperial_events.130.b: "Sama sekali tidak, dorong ke ibu kota."
 PER_imperial_events.131.t: "[SOU.GetNameDefCap] Menerima Proposal Kami"
 PER_imperial_events.131.desc: "Untungnya, pemerintah [SOU.GetAdjective] telah menyetujui usulan kami. Kami mungkin telah kehilangan wilayah utara kami, tetapi setidaknya kami telah mencegah kelanjutan pergerakan Tentara [SOU.GetAdjective]..."
 PER_imperial_events.131.a: "Ini melegakan..."
 PER_imperial_events.132.t: "[SOU.GetNameDefCap] Menolak Usulan Kami"
 PER_imperial_events.132.desc: "Sayangnya, pemerintah [SOU.GetAdjective] menolak usulan penyerahan kami. Artinya kita harus terus berjuang, tapi kalau kalah, kemungkinan besar kita akan menyerah sesuai syarat mereka."
 PER_imperial_events.132.a: "Ini adalah masa-masa kelam..."
 PER_imperial_events.140.t: "[FROM.GetNameDefCap] Menyatakan Kemerdekaan"
 PER_imperial_events.140.desc: "[FROM.GetLeader] telah menyatakan bahwa [FROM.GetNameDef] tidak akan lagi menerima [ROOT.GetAdjective] kekuasaan. [FROM.GetNameDefCap] ingin menjaga hubungan baik dengan [ROOT.GetNameDef] jika memungkinkan, namun [FROM.GetLeader] menyatakan siap mengangkat senjata dan memperjuangkan kemerdekaannya, jika diperlukan."
 PER_imperial_events.140.a: "Mereka perlu diberi pelajaran"
 PER_imperial_events.140.b: "Kami memiliki hal-hal yang lebih penting untuk dipikirkan"
 PER_imperial_events.142.t: "[PER.GetAdjective] Kehormatan Dipulihkan"
 PER_imperial_events.142.desc: "Dalam kejadian yang cukup mengejutkan, [FROM.GetLeader] menerima deklarasi Kemerdekaan [ROOT.GetAdjective]. Sejak saat ini, [FROM.GetNameDef] tidak mempunyai pengaruh terhadap politik [ROOT.GetAdjective], baik internal maupun eksternal. Kerumunan besar yang merayakan kepemimpinan [ROOT.GetLeader] telah berkumpul di alun-alun [ROOT.Capital.GetCapitalVictoryPointName]."
 PER_imperial_events.142.a: "Kuknya hilang"
 PER_imperial_events.141.t: "Perjuangan Dilanjutkan"
 PER_imperial_events.141.desc: "Seperti yang diharapkan, [FROM.getLeader] menolak permintaan kemerdekaan formal dari [ROOT.GetLeader]. Karena kejadian ini merupakan sebuah antisipasi, angkatan bersenjata [ROOT.GetAdjective] telah mengamankan posisi-posisi penting di negara tersebut. Bangsa ini jauh lebih siap saat ini."
 PER_imperial_events.141.a: "Azadi! Kami akan bertarung sampai orang terakhir!"
 PER_imperial_events.150.t: "[FROM.GetNameDefCap] Menuntut Perdamaian Putih"
 PER_imperial_events.150.desc: "Seiring berlangsungnya perang, kami tidak dapat mencapai tujuan kami dalam waktu yang kami tetapkan. Oleh karena itu, kami baru-baru ini menerima kabar dari pemerintah [FROM.GetAdjective] yang menuntut diakhirinya permusuhan. Kami bisa terus maju, namun kami harus memperhitungkan kerugian kami sendiri."
 PER_imperial_events.150.a: "Situasinya tidak menguntungkan kita..."
 PER_imperial_events.150.b: "Kita harus terus maju! Kami akan menang!"
 PER_imperial_events.151.t: "[FROM.GetNameDefCap] Menarik Pasukannya"
 PER_imperial_events.151.desc: "Berita bagus! [FROM.GetNameDefCap] telah menyetujui tuntutan perdamaian kami dan mulai menarik pasukan mereka dari perbatasan kami. Kami berjuang keras dan lama untuk mencegah mereka, dan ini adalah hari yang harus dirayakan selama bertahun-tahun yang akan datang!"
 PER_imperial_events.151.a: "Ini dianggap sebagai kemenangan!"
 PER_imperial_events.152.t: "[FROM.GetNameDefCap] Menolak Mengalah"
 PER_imperial_events.152.desc: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Jika mereka menginginkan perkelahian, maka perkelahianlah yang akan mereka dapatkan."
 PER_imperial_events.152.a: "Mereka akan menyesal jika tidak mengambil kesempatan untuk berhenti!"
 PER_imperial_events.153.t: "[FROM.GetNameDefCap] Menyerukan Perdamaian"
 PER_imperial_events.153.desc: "Pagi ini, kami menerima kabar dari Kabinet Perang bahwa sekutu kami yang memimpin serangan terhadap [PER.GetNameDef] meminta kami mengakhiri permusuhan sambil menunggu negosiasi perdamaian dengan musuh. Ketika kami bergabung dalam konflik untuk membantu pemerintah [FROM.GetAdjective], tidak ada gunanya terus berperang."
 PER_imperial_events.153.a: "Segera tarik semua pasukan."
 PER_imperial_events.160.t: "[FROM.GetNameDefCap] Menuntut kita Menyerah"
 PER_imperial_events.160.desc: "Seiring berlangsungnya perang, kami tidak dapat mencapai tujuan kami dalam waktu yang kami tetapkan. Faktanya, mereka yang kami coba serang telah berhasil mendorong kami kembali ke tanah kami sendiri. Oleh karena itu, kami baru-baru ini menerima kabar dari pemerintah [FROM.GetAdjective] yang menuntut diakhirinya permusuhan. Jika kami menyerah, [PER.GetNameDef] menuntut kami menyerahkan wilayah perbatasan kami kepada mereka sebagai reparasi. Kami bisa terus maju, namun kami harus memperhitungkan kerugian kami sendiri."
 PER_imperial_events.160.a: "Situasinya tidak menguntungkan kita..."
 PER_imperial_events.160.b: "Kita harus terus maju! Kami akan menang!"
 PER_imperial_events.161.t: "[FROM.GetNameDefCap] Menarik Pasukannya"
 PER_imperial_events.161.desc: "Berita bagus! [FROM.GetNameDefCap] telah menyetujui tuntutan perdamaian kami dan mulai menarik pasukan mereka dari perbatasan kami. Mereka juga sudah mulai menyusun proses penyerahan wilayah perbatasan tetangganya kepada kami. Kami berjuang keras dan lama untuk mencegah mereka, dan ini adalah hari yang harus dirayakan selama bertahun-tahun yang akan datang!"
 PER_imperial_events.161.a: "Ini dianggap sebagai kemenangan!"
 PER_imperial_events.162.t: "[FROM.GetNameDefCap] Menolak Mengalah"
 PER_imperial_events.162.desc: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Keengganan mereka untuk membayar pelanggaran mereka merupakan penghinaan terhadap semua yang terjadi di sini. Jika mereka menginginkan perkelahian, maka perkelahianlah yang akan mereka dapatkan."
 PER_imperial_events.162.a: "Mereka akan menyesal jika tidak mengambil kesempatan untuk berhenti!"
 PER_imperial_events.170.t: "[FROM.GetNameDefCap] Menuntut kita Menyerah"
 PER_imperial_events.170.desc: "Seiring berlangsungnya perang, kami tidak dapat mencapai tujuan kami dalam waktu yang kami tetapkan. Faktanya, mereka yang kami coba serang telah berhasil mendorong kami kembali ke tanah kami sendiri. Oleh karena itu, kami baru-baru ini menerima kabar dari pemerintah [FROM.GetAdjective] yang menuntut diakhirinya permusuhan. Jika kami menyerah, kemungkinan besar kami akan menderita selama beberapa tahun karena harus membayar pampasan perang. Kami bisa terus maju, namun kami harus memperhitungkan kerugian kami sendiri."
 PER_imperial_events.170.a: "Situasinya tidak menguntungkan kita..."
 PER_imperial_events.170.b: "Kita harus terus maju! Kami akan menang!"
 PER_imperial_events.171.t: "[FROM.GetNameDefCap] Menarik Pasukannya"
 PER_imperial_events.171.desc: "Berita bagus! [FROM.GetNameDefCap] telah menyetujui tuntutan perdamaian kami dan mulai menarik pasukan mereka dari perbatasan kami. Pelanggaran mereka selama perang ini berarti kita telah mampu mendapatkan ganti rugi atas invasi tersebut. Kami berjuang keras dan lama untuk mencegah mereka, dan ini adalah hari yang harus dirayakan selama bertahun-tahun yang akan datang!"
 PER_imperial_events.171.a: "Ini dianggap sebagai kemenangan!"
 PER_imperial_events.172.t: "$PER_imperial_events.162.t$"
 PER_imperial_events.172.desc: "$PER_imperial_events.162.desc$"
 PER_imperial_events.172.a: "$PER_imperial_events.162.a$"
 PER_imperial_events.180.t: "[FROM.GetNameDefCap] Menawarkan untuk Bersumpah Setia"
 PER_imperial_events.180.desc: "Pagi ini, kami menerima kabar dari pemerintah [PER.GetAdjective] yang menawarkan untuk mengakhiri permusuhan dan sebagai imbalannya, membiarkan diri mereka diperintah sebagai boneka di bawah pengawasan kami. Hal ini akan mengakhiri perang dengan cepat, dan memungkinkan kita untuk fokus pada tujuan yang lebih besar."
 PER_imperial_events.180.a: "Ini menguntungkan semua orang."
 PER_imperial_events.180.b: "Ini bukanlah suatu pilihan, lanjutkan perang."
 PER_imperial_events.181.t: "[FROM.GetNameDefCap] Setuju dengan Ketentuan Kami"
 PER_imperial_events.181.desc: "Tampaknya [FROM.GetAdjective] telah menyetujui tawaran kami, dan mulai menyusun syarat penyerahan kami. Meskipun ini bukan situasi yang paling ideal, kita akan menyelamatkan banyak nyawa dengan membiarkan diri kita berada di bawah beban [FROM.GetNameDef]."
 PER_imperial_events.181.a: "Kemenangan yang sangat dahsyat, namun ini adalah yang terbaik yang kami miliki."
 PER_imperial_events.182.t: "[FROM.GetNameDefCap] Menolak Ketentuan Kami"
 PER_imperial_events.182.desc: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Keengganan mereka untuk mengizinkan kami mengakhiri perang dengan kemenangan mereka sungguh mengecewakan, dan kami tidak punya pilihan selain terus berjuang."
 PER_imperial_events.182.a: "Ini memalukan..."
 PER_imperial_events.190.t: "[FROM.GetNameDefCap] Ingin Menegosiasikan Syarat Penyerahan"
 PER_imperial_events.190.desc: "Pagi ini, kami menerima kabar dari pemerintah [PER.GetAdjective] dengan tawaran untuk mengakhiri permusuhan dan sebagai imbalannya, mereka akan mengizinkan faksi kami mengakses sumber daya alam mereka dalam jumlah besar. Hal ini akan mengakhiri perang dengan cepat, dan memungkinkan kita untuk fokus pada tujuan yang lebih besar. Tidak hanya itu, tapi kita akan berada dalam posisi yang baik untuk melanjutkan upaya perang di masa depan dengan konsesi minyak mereka."
 #PER_imperial_events.190.desc: "[GetROOTMainInvaderOrNot190]"
 MainInvader190: "Pagi ini, kami menerima kabar dari pemerintah [PER.GetAdjective] yang menawarkan untuk mengakhiri permusuhan dan sebagai imbalannya, mereka akan mengizinkan kami mengakses sumber daya alam mereka dalam jumlah besar. Hal ini akan mengakhiri perang dengan cepat, dan memungkinkan kita untuk fokus pada tujuan yang lebih besar. Tidak hanya itu, tapi kita akan berada dalam posisi yang baik untuk melanjutkan upaya perang di masa depan dengan konsesi minyak mereka."
 NotMainInvader190: "Pagi ini, kami menerima kabar dari pemerintah [PER.GetAdjective] dengan tawaran untuk mengakhiri permusuhan. Meskipun tidak ada keuntungan atau imbalan langsung bagi kami, hal ini akan mengakhiri perang dengan cepat, dan memungkinkan kami untuk fokus pada tujuan yang lebih besar."
 PER_imperial_events.190.a: "Kami dapat menyetujui persyaratan ini"
 PER_imperial_events.190.b: "Ini tidak menguntungkan bagi kami, lanjutkan perang."
 PER_imperial_events.191.t: "[FROM.GetNameDefCap] Setuju dengan Ketentuan Kami"
 PER_imperial_events.191.desc: "Tampaknya [FROM.GetAdjective] telah menyetujui tawaran kami, dan mulai menyusun syarat penyerahan kami. Artinya kita akan kehilangan sebagian sumber daya alam kita, namun hal ini jauh lebih menguntungkan dibandingkan menjadi subyek penuh di bawah kendali [FROM.GetNameDef]."
 #PER_imperial_events.191.desc: "[GetROOTMainInvaderOrNot191]"
 MainInvader191: "Tampaknya [FROM.GetAdjective] telah menyetujui tawaran kami, dan mulai menyusun syarat penyerahan kami. Artinya kita akan kehilangan sebagian sumber daya alam kita, namun hal ini jauh lebih menguntungkan dibandingkan menjadi subyek penuh di bawah kendali [FROM.GetNameDef]."
 NotMainInvader191: "Tampaknya [FROM.GetAdjective] telah menyetujui tawaran kami, dan mulai menyusun syarat penyerahan kami. Kami berharap bahwa hal ini tidak akan terjadi, namun mengingat situasinya, hasilnya akan sangat baik"
 PER_imperial_events.191.a: "Ini adalah hal terbaik yang dapat kami lakukan untuk [PER.GetNameDef]"
 PER_imperial_events.192.t: "[FROM.GetNameDefCap] Menolak Ketentuan Kami"
 PER_imperial_events.192.desc: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Keengganan mereka untuk mengizinkan kami mengakhiri perang dan memberi mereka sumber daya sungguh mengecewakan, dan kami tidak punya pilihan selain terus berjuang."
 #PER_imperial_events.192.desc: "[GetROOTMainInvaderOrNot192]"
 MainInvader192: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Keengganan mereka untuk mengizinkan kami mengakhiri perang dan memberi mereka sumber daya sungguh mengecewakan, dan kami tidak punya pilihan selain terus berjuang."
 NotMainInvader192: "Ini adalah hari yang gelap. Musuh kami telah memutuskan untuk terus menyerang wilayah kami meskipun mereka kalah dan meskipun kami menuntut perdamaian. Keengganan mereka untuk mengizinkan kami mengakhiri perang sungguh mengecewakan, dan kami sekarang tidak punya pilihan selain terus berjuang."
 PER_imperial_events.192.a: "Ini memalukan..."
 PER_imperial_events.200.t: "Pakta Saadabad"
 PER_imperial_events.200.desc: "[SSB_leader.GetLeader] telah mendekati [ROOT.GetLeader] dengan saran untuk menandatangani pakta non-agresi bersama, sehingga membuka prospek kerja sama lebih lanjut di masa depan. Para diplomat [event_target:SSB_leader.GetAdjective] bekerja keras dalam upaya mereka, menjelaskan secara rinci tentang sejarah dan kepentingan bersama kedua negara, diikuti dengan seruan yang sungguh-sungguh untuk perdamaian antar negara bersaudara. Negosiasi bolak-balik berjalan menyenangkan, namun pilihan apakah kami menandatangani atau tidak pada akhirnya ada di tangan kami."
 PER_imperial_events.200.a: "Tentu saja kami akan menandatangani perjanjian persahabatan ini!"
 PER_imperial_events.200.b: "Kami bukan saudara, [SSB_leader.GetLeader] : kami tidak mengenal anda."
 PER_imperial_events.210.t: "[FROM.GetName] Menuntut Wilayah Perbatasan Kita!"
 PER_imperial_events.210.desc: "[FROM.GetLeader] menulis surat panjang lebar kepada [ROOT.GetLeader] yang memberitahukan mereka tentang [FROM.GetAdjective] tuntutan agar sebagian wilayah perbatasan diserahkan ke tangan mereka. Meskipun hal ini jelas merupakan upaya mengerikan untuk tidak menghormati kedaulatan kami, hal ini juga dapat berarti bahwa [FROM.GetNameDef] mungkin akan mengambil tindakan drastis untuk mengamankan tanah tersebut jika kami menolak. Bagaimana kita harus melanjutkannya?"
 PER_imperial_events.210.a: "Menyerahkan wilayah..."
 PER_imperial_events.210.b: "Mereka tidak akan pernah mengambil tanah kami."
 PER_imperial_events.211.t: "[FROM.GetName] Menyetujui Permintaan kami!"
 PER_imperial_events.211.desc: "Pagi ini kami menerima kabar dari [FROM.GetNameDef] yang menyatakan bahwa mereka enggan menyetujui tuntutan kami dan karenanya memulai proses penyerahan wilayah perbatasan mereka kepada kami. Mereka tidak tahu bahwa ini hanya akan membantu kita dalam melakukan intrik di kemudian hari."
 PER_imperial_events.211.a: "Orang-orang bodoh itu..."
 PER_imperial_events.212.t: "[FROM.GetName] Menolak Tuntutan Kami!"
 PER_imperial_events.212.desc: "Pagi ini kami menerima kabar dari [FROM.GetNameDef] yang menyatakan bahwa mereka dengan tegas menolak tuntutan kami. Meskipun ini hanya menimbulkan masalah kecil dalam rencana kami, ini berarti kami harus mengambil wilayah itu dengan cara lama."
 PER_imperial_events.212.a: "Mereka akan menyesali hal ini."
 PER_imperial_events.220.t: "Musim Pemilu"
 PER_imperial_events.220.desc: "Karena restrukturisasi massal pemerintahan [PER.GetAdjective], pemilihan umum diadakan untuk memungkinkan rakyat [PER.GetNameDef] memilih Perdana Menteri baru mereka. Ketika banyak warga berbondong-bondong datang ke tempat pemungutan suara di seluruh negeri, ada dua kandidat yang menonjol. Mohammad Mosaddegh dan Mohammad Ali Foroughi. Bagaimana bangsa ini akan memilih pada akhirnya?"
 PER_imperial_events.220.a: "Mosaddegh adalah pilihan yang jelas"
 PER_imperial_events.220.b: "Mungkin Foroughi akan menjadi pilihan yang lebih baik?"
 PER_imperial_events.220.c: "Kashani akan meningkatkan dukungan dari para ulama."
 PER_imperial_events.201.t: "[FROM.GetName] Menandatangani Pakta Saadabad"
 PER_imperial_events.201.desc: "[FROM.GetLeader] sangat antusias ketika kami menerima proposal perjanjian persahabatan dan perjanjian non-agresi, dan tidak membuang waktu untuk menghubungi kami kembali dengan tanda tangan mereka pada perjanjian kami. Dengan persetujuan mereka, kita selangkah lebih dekat untuk mencapai perdamaian di dalam negeri dan perdamaian di dunia!"
 PER_imperial_events.201.a: "Anda akan selalu menjadi teman baik bagi [ROOT.GetNameDef]."
 PER_imperial_events.202.t: "[FROM.GetName] Menolak Pakta Saadabad!"
 PER_imperial_events.202.desc: "[FROM.GetLeader] menulis surat bertele-tele kepada [ROOT.GetLeader] yang memberitahukan mereka bahwa tawaran perjanjian persahabatan dan pakta non-agresi tidak sebanding dengan kertas dan tinta yang digunakan untuk membuat perjanjian tersebut. [FROM.GetLeader]_ selanjutnya menulis bahwa aliansi formal antara [FROM.GetNameDef] dan [ROOT.GetNameDef] hanya membuang-buang waktu saja, dan mereka lebih memilih untuk dikecualikan dari skema [ROOT.GetAdjective] di masa depan mulai sekarang."
 PER_imperial_events.202.a: "...kamu bisa saja mengatakan 'tidak'."
 PER_imperial_events.230.t: "Kembalinya Dinasti Qajar"
 PER_imperial_events.230.desc: "Setelah bertahun-tahun diasingkan di [ENG.GetNameDef], calon pewaris Dinasti Qajar, Mohammad Hassan Mirza, sangat ingin kembali ke tahta [PER.GetNameDef]. Pemerintahan Dinasti Pahlavi tidak memenuhi harapan pemerintahan [ENG.GetAdjective], dan diharapkan dengan menempatkan kembali keluarga penguasa lama di kursi kekuasaan, kepentingan [ENG.GetAdjective] di wilayah tersebut akan terjamin."
 PER_imperial_events.230.a: "Mengapa menunggu? Siapkan penobatannya!"
 PER_imperial_events.230.b: "Adalah bijaksana jika kita menggulingkan Dinasti Pahlavi."
 PER_imperial_events.230.c: "Mengasingkan Dinasti Pahlavi ke [SAF.GetNameDef]."
 PER_imperial_events.231.t: "Keluarga Pahlavi Dicopot Dari Kekuasaan"
 PER_imperial_events.231.desc: "Setelah melalui pertimbangan yang matang, Dinasti Pahlavi dipaksa turun dari tahta [PER.GetNameDef]. Terlepas dari pengabdian mereka selama puluhan tahun kepada negara, penting bagi kita untuk bekerja demi kepentingan pemerintah [ENG.GetAdjective]. Meskipun mereka tidak lagi mempunyai tempat di monarki [PER.GetAdjective], mereka tetap ingin hadir di lingkaran politik dalam negeri."
 PER_imperial_events.231.a: "Luar biasa. Kita sekarang harus menobatkan Qajar Shah yang baru."
 PER_imperial_events.232.t: "Keluarga Pahlavi Diasingkan ke [SAF.GetNameDef]"
 PER_imperial_events.232.desc: "Menyusul rencana untuk mengembalikan Dinasti Qajar ke tahta [PER.GetNameDef], diputuskan bahwa hasil terbaik untuk masa depan negara kita, adalah mengasingkan keluarga Pahlavi ke [SAF.GetNameDef]. Melakukan hal ini akan mendapat dukungan dari [ENG.GetNameDef], yang mungkin bisa kita yakinkan agar kita bisa mendapatkan lebih banyak otonomi di masa depan."
 PER_imperial_events.232.a: "Sayang sekali, tapi sekarang kita harus menobatkan Qajar Shah yang baru."
 PER_imperial_events.233.t: "Penobatan Mohammad Hassan Mirza"
 PER_imperial_events.233.desc: "Pagi ini, dalam upacara penobatan mewah yang diadakan di [FROM.Capital.GetCapitalVictoryPointName], Mohammad Hassan Mirza dinobatkan sebagai Shah baru [PER.GetNameDef]. Setelah beberapa dekade pemerintahan Pahlavi, seorang Qajar sekali lagi menjadi raja yang berkuasa di negara besar ini. Upaya kami untuk mengembalikan dinasti Qajar telah menyenangkan pemerintah [ENG.GetAdjective], yang berharap bahwa hal ini akan memungkinkan mereka untuk lebih memegang kepentingan mereka di [PER.GetNameDef]."
 PER_imperial_events.233.a: "Untuk Shah baru kita!"
 PER_islamic_revolution_events.1.t: "Ketidakstabilan dalam Kalangan Pendeta"
 PER_islamic_revolution_events.1.desc: "Tampaknya beberapa keputusan yang kita ambil sehubungan dengan pembangunan bangsa kita mulai membuat marah sejumlah ulama. Ketika kebencian mereka terus berlanjut, kita harus berhati-hati agar tidak mengucilkan mereka lebih jauh."
 PER_islamic_revolution_events.1.a: "Kita harus berhati-hati dalam melanjutkan."
 PER_islamic_revolution_events.2.t: "Kaum Revolusioner Islam Sedang Bergerak"
 PER_islamic_revolution_events.2.desc: "Tindakan kami terus mengucilkan ulama dan sebagai hasilnya, banyak petinggi Islam mulai mendapatkan dukungan dari masyarakat [PER.GetNameDef]. Waktu kita semakin singkat dan kita mempunyai potensi revolusi di tangan kita. Bagaimana kita harus melanjutkannya?"
 PER_islamic_revolution_events.2.a: "Berusahalah untuk menindak kaum revolusioner ini."
 PER_islamic_revolution_events.2.b: "Segera menenangkan pendeta."
 PER_islamic_revolution_events.2.c: "Biarkan mereka mencoba!"
 PER_foreign_policy_events.1.t: "Tekanan dari [FROM.GetNameDef]"
 PER_foreign_policy_events.1.desc: "Tampaknya pemerintah [FROM.GetAdjective] semakin gelisah dengan situasi diplomatik kita. Selama seminggu terakhir, duta besar [FROM.GetAdjective] telah bertemu dengan [THIS.GetLeader] tidak kurang dari enam kali, dan praktis telah menyampaikan ultimatum pada putaran terakhir perundingan.\n\nEntah kita bergabung dengan [FROM.GetNameDef] dalam pakta pertahanan dan menerima \"konsultasi pada tingkat tertentu dalam urusan dalam negeri\", atau [FROM.GetNameDef] kemungkinan besar akan melakukan intervensi militer di negara kita."
 PER_foreign_policy_events.1.a: "Pertarungan akan sia-sia."
 PER_foreign_policy_events.1.b: "Biarkan mereka datang!"
 PER_foreign_policy_events.2.t: "[FROM.GetNameDefCap] Menolak"
 PER_foreign_policy_events.2.desc: "Upaya kami untuk menyelesaikan masalah yang belum terselesaikan dengan [FROM.GetNameDef] secara diplomatis tampaknya telah gagal. Ketika duta besar kami memanggil [FROM.GetLeader] untuk putaran perundingan berikutnya, dia dengan cepat diberitahu bahwa [FROM.GetAdjective] telah memperjelas posisi mereka, dan tidak ada hal yang perlu didiskusikan lebih lanjut."
 PER_foreign_policy_events.2.a: "Kami tidak akan mendorong mereka lebih jauh... untuk saat ini."
 PER_foreign_policy_events.2.b: "Persiapkan invasi [FROM.GetNameDef]!"
 PER_foreign_policy_events.2.c: "Kita harus mempersiapkan invasi bersama dengan [SOU.GetAdjective]"
 PER_foreign_policy_events.3.t: "Anglo-[SOV.GetAdjective] Invasi Iran"
 PER_foreign_policy_events.3.desc: "Kami telah menerima nota diplomatik dari [FROM.GetNameDef], yang mengusulkan operasi militer gabungan melawan [PER.GetNameDef]. Komando [FROM.GetAdjective] menegaskan bahwa operasi ini akan memungkinkan kami mengamankan ladang minyak Iran dan jalur pasokan kami ke [FROM.GetNameDef], sekaligus mencegah potensi serangan musuh dari [TUR.GetNameDef] melalui [PER.GetName] menuju ladang minyak Baku dan [RAJ.GetNameDef]."
 PER_foreign_policy_events.3.a: "Kita harus mengamankan Koridor Persia!"
 PER_foreign_policy_events.3.b: "Kami akan menghormati kemerdekaan [PER.GetAdjective]."
 PER_foreign_policy_events.4.t: "Anglo-[SOV.GetAdjective] Invasi Iran"
 PER_foreign_policy_events.4.desc: "Duta Besar [FROM.GetAdjective] telah menyampaikan catatan yang menyatakan [FROM.GetNameDef] setuju untuk mengatur dan melaksanakan operasi militer gabungan melawan [PER.GetNameDef]. Baik Komando [ROOT.GetAdjective] dan [FROM.GetAdjective] yakin bahwa ini akan menjadi operasi yang cepat dan efektif melawan musuh yang kalah jumlah dan kalah teknologi yang akan memungkinkan kita mengamankan ladang minyak Iran dan jalur pasokan [FROM.GetAdjective] ke [ROOT.GetNameDef], sekaligus mencegah potensi serangan musuh dari [TUR.GetNameDef] melalui [PER.GetName] menuju ladang minyak Baku dan [RAJ.GetNameDef]."
 PER_foreign_policy_events.4.a: "Mulailah persiapan!"
 PER_foreign_policy_events.5.t: "Pemerintah [FROM.GetAdjective] Menolak."
 PER_foreign_policy_events.5.desc: "Setelah beberapa pertemuan yang menegangkan antara diplomat [ROOT.GetAdjective] dan [FROM.GetAdjective], [FROM.GetNameDef] memutuskan untuk tidak terlibat dalam rencana kami untuk [PER.GetNameDef]. [FROM.GetLeader] sendiri bahkan berani menyatakan bahwa usulan ini tidak lebih dari upaya untuk membenarkan ambisi teritorial kita.\nTampaknya kita harus menangani [PER.GetNameDef] sendiri."
 PER_foreign_policy_events.5.a: "Selalu sangat tidak bisa diandalkan..."
 PER_revolution_events.1.t: "Kudeta Akan Segera Terjadi"
 PER_revolution_events.1.desc: "Pagi ini, partai-partai oposisi membentuk koalisi dan setelah menyusup ke militer kami, mereka kini mengangkat senjata melawan kami! Pasukan mereka bersiap untuk berbaris di kompleks Saadabad! Kita harus bersiap melakukan serangan balik untuk melindungi kedaulatan [PER.GetNameDef]!"
 PER_revolution_events.1.a: "Kumpulkan pasukan!"
 PER_communist_events.1.t: "Aktivitas Radikal Meningkat"
 PER_communist_events.1.desc: "Kaum radikal yang menganjurkan kemerdekaan dari kita semakin aktif dalam beberapa hari terakhir. Belum jelas apa yang memicu peningkatan aktivitas ini, namun pihak berwenang setempat meningkatkan kekhawatiran atas meningkatnya retorika nasionalis dan sosialis yang dianut di jalanan. Jika kita ingin mencegah situasi semakin buruk, kemungkinan besar kita harus melakukan tindakan keras."
 PER_communist_events.1.a: "Perkembangan yang memprihatinkan."
 PER_communist_events_1_tt: "Buka keputusan §Y$PER_anti_gulf_decisions_cat$§! untuk menindak perlawanan."
 PER_communist_events.2.t: "Penindasan terhadap Gerakan Kemerdekaan Kurdi"
 PER_communist_events.2.desc: "Pihak berwenang [FROM.GetAdjective] telah mengatur tindakan keras terhadap gerakan kemerdekaan Kurdi di seluruh wilayah. Oleh karena itu, kontak kami di wilayah tersebut bersembunyi atau melarikan diri melintasi perbatasan ke [ROOT.GetNameDef]."
 PER_communist_events.2.a: "Kami akan melipatgandakan upaya kami."
 PER_communist_events.3.t: "Pemberontakan Kurdi Mungkin Akan Segera Terjadi"
 PER_communist_events.3.desc: "Aktivitas di kalangan separatis dan sosialis Kurdi telah mencapai puncaknya dalam beberapa hari terakhir. Ada juga semakin banyak bukti bahwa senjata didistribusikan ke seluruh negeri sebagai persiapan pemberontakan dalam beberapa minggu mendatang. Jika kita tidak segera bertindak, perang besar-besaran mungkin tidak dapat dihindari."
 PER_communist_events.3.a: "Kita harus mencegah eskalasi ini!"
 PER_communist_events_3_tt: "§RKita harus melakukan tindakan keras terhadap perbedaan pendapat jika kita ingin menghindari pemberontakan dan perang Kurdi!§!"
 PER_communist_events.4.t: "Peningkatan Resistensi di Perbatasan [PER.GetAdjective]"
 PER_communist_events.4.desc: "Ada peningkatan yang nyata dalam perlawanan terhadap pendudukan kami di wilayah sekitar perbatasan [PER.GetAdjective] dalam beberapa hari terakhir. Meskipun pemicunya masih belum diketahui secara pasti, terdapat kekhawatiran yang berkembang bahwa ada seseorang yang menggerakkan sentimen anti-[ROOT.GetAdjective] dengan harapan dapat melemahkan kehadiran kami di wilayah tersebut."
 PER_communist_events.4.a: "Siapa di balik ini?"
 PER_communist_events_4_tt: "§RNegara-negara kita di Teluk Persia mungkin akan mengalami peningkatan perlawanan dalam beberapa bulan mendatang!§!"
PER_communist_events.5.t: "Krisis Teluk Persia"
PER_communist_events.5.desc: "Tampaknya sebagian besar keributan baru-baru ini di Teluk Persia dan sekitarnya kemungkinan besar bersumber dari [FROM.GetNameDef]. Dengan sejumlah kemenangan strategis di kawasan ini, nampaknya mereka kini merasa cukup berani untuk mengambil langkah terbesar mereka. Sebagai peringatan keras kepada pemerintah kami, rezim [FROM.GetAdjective] telah menuntut penarikan penuh kami dari Semenanjung Arab dan Teluk Persia, bahkan menunjukkan kesediaan mereka untuk memblokade Teluk jika kami tidak mematuhinya."
PER_communist_events.5.a: "Kami akan mundur karena protes."
PER_communist_events.5.b: "Mereka dan siapa angkatan lautnya?"
PER_communist_events.6.t: "[FROM.GetNameDefCap] Setuju untuk Mundur"
PER_communist_events.6.desc: "Meskipun terdapat banyak gangguan diplomatik, pasukan [FROM.GetAdjective] telah mulai menarik diri dari wilayah tersebut. Ini adalah kemenangan strategis yang besar bagi pemerintah kita dan disambut baik oleh banyak orang di seluruh dunia sebagai tanda kemunduran kolonial."
PER_communist_events.6.a: "Pekerjaan kita belum selesai!"
PER_communist_events.7.t: "[FROM.GetNameDefCap] Menolak Mundur"
PER_communist_events.7.desc: "Tidak mengherankan, orang-orang bodoh yang keras kepala di [FROM.Capital.GetCapitalVictoryPointName] menolak mundur dari wilayah yang diperebutkan di Teluk Persia dan Arab. Tampaknya mereka menganggap kami tidak mempunyai tekad untuk melaksanakan ancaman pemblokiran jalur laut sebagai konsekuensi atas tindakan mereka."
PER_communist_events.7.a: "Kemudian kami akan menunjukkan tekad kami."
PER_communist_events.7.b: "Kami tidak mampu untuk meningkatkan hal ini."
PER_communist_events.8.t: "[FROM.GetNameDefCap] Memblokade Teluk Persia"
PER_communist_events.8.desc: "Dalam krisis Teluk yang semakin meningkat, [FROM.GetNameDef] telah melaksanakan ancamannya dan mulai memblokir kapal-kapal sipil dan pesawat terbang untuk beroperasi di wilayah tersebut. Lebih jauh lagi, intelijen menunjukkan bahwa militer mereka telah meningkatkan kesiapannya dalam mengantisipasi konflik dengan pasukan kita."
PER_communist_events.8.a: "Siapkan kapal perang."
PER_communist_events.8.b: "Mereka sudah menegaskan maksudnya, mengeluarkan perintah untuk mundur."
PER_communist_events.9.t: "[FROM.GetNameDefCap] Melunakkan Retorika"
PER_communist_events.9.desc: "Tampaknya keberanian [FROM.GetNameDef] baru-baru ini telah dihancurkan oleh komitmen teguh kami untuk membela kepentingan kami di wilayah tersebut. Dalam pidatonya yang merendahkan hati, [FROM.GetLeader] menegaskan keinginan teguh mereka untuk menjaga perdamaian di wilayah tersebut. Sekutu mereka kemungkinan besar akan terguncang karena pengabaian prinsipal [FROM.GetAdjective]."
PER_communist_events.9.a: "Itu akan mengajari mereka."
PER_communist_events.10.t: "[FROM.GetNameDefCap] Mengirim TNI Angkatan Laut"
PER_communist_events.10.desc: "Setiap peluang untuk menemukan penyelesaian diplomatis atas krisis Teluk yang sedang berlangsung telah hilang setelah keputusan [FROM.GetNameDef] untuk mengirimkan satuan tugas angkatan laut untuk mematahkan blokade kami di wilayah tersebut. Jika kita ingin mempertahankan unsur kejutan apa pun, kita harus segera melancarkan serangan pendahuluan. Jika tidak, kita mungkin harus menuruni tangga eskalasi."
PER_communist_events.10.a: "Kami akan menyerang selagi kami memiliki keuntungan."
PER_communist_events.10.b: "Saatnya makan pai sederhana."
PER_communist_events.11.t: "[FROM.GetNameDefCap] Meminta Teknologi Militer"
PER_communist_events.11.desc: "Pemerintah [FROM.GetNonIdeologyName] telah meminta dukungan teknik dalam pengembangan teknologi anti-kapal sehingga mereka dapat mengembangkan tindakan pencegahan yang tepat terhadap ancaman kekuatan kolonial di Teluk Persia. Mereka telah berkomitmen untuk berbagi perkembangan apa pun di masa depan yang mereka buat dengan kami."
PER_communist_events.11.a: "Keamanan mereka penting bagi kita."
PER_communist_events.11.b: "Kami tidak akan memperdagangkan rahasia negara."
PER_communist_events.12.t: "[FROM.GetNameDefCap] Menyetujui Transfer Teknologi"
PER_communist_events.12.desc: "Teknisi kami sangat menantikan kedatangan penelitian dan desain rahasia [FROM.GetAdjective] menyusul keputusan [FROM.GetAdjective] untuk berbagi beberapa teknologi militer dengan kami. Hal ini akan mempercepat desain kami secara signifikan."
PER_communist_events.12.a: "Bagus sekali!"
PER_communist_events.13.t: "[FROM.GetNameDefCap] Menolak Transfer Teknologi"
PER_communist_events.13.desc: "Pemerintah [FROM.GetAdjective] telah menolak permintaan kami akan teknologi yang dapat membantu kami mempertahankan Teluk Persia dengan lebih baik dari kekuatan angkatan laut luar. Ini merupakan pukulan telak bagi para teknisi kami, namun mereka berniat melanjutkan pengembangannya sendiri."
PER_communist_events.13.a: "Kami akan sukses tanpa mereka."
PER_communist_events.14.t: "[FROM.GetNameDefCap] Memberikan Desain"
PER_communist_events.14.desc: "Sesuai perjanjian kami dengan [FROM.GetNameDef], mereka telah mengirimkan desain senjata yang mereka yakini mampu mengusir imperialis dari Teluk Persia. Apakah desain tersebut akan efektif untuk kebutuhan kita masih harus dilihat."
PER_communist_events.14.a: "Baguslah mereka menepati janji mereka."
PER_communist_events.20.t: "Rakyat [KUR.GetAdjective] Menuntut Otonomi"
PER_communist_events.20.desc: "Dalam upaya untuk melawan upaya detribalisasi dan tuntutan otonomi yang lebih luas, Partai Demokrat Kurdistan yang baru dibentuk telah secara resmi meminta agar mereka berfungsi sebagai Republik Sosialis terpisah di dalam [SOU.GetNameDef]. Kita harus membuat pilihan di sini. Kita bisa mempertahankan kendali atas wilayah ini sendiri, atau kita bisa menyerahkannya kepada orang [KUR.GetAdjective]."
PER_communist_events.20.a: "Beri mereka otonomi."
PER_communist_events.20.b: "Tanah-tanah ini harus tetap berada dalam yurisdiksi kami."
PER_fascist_events.1.t: "Dewan Kekaisaran Bersidang"
PER_fascist_events.1.desc: "Dewan Kekaisaran telah bersidang untuk memutuskan siapa yang akan ditawari peran bergengsi Shah. Ada yang menganjurkan pemulihan dinasti Qajar, ada pula yang mengusulkan agar Pahlavi tetap di atas takhta untuk memastikan legitimasi di mata rakyat. Sementara itu para loyalis partai menganjurkan pembentukan dinasti baru."
PER_fascist_events.1.a: "Boneka Pahlavi cocok untuk kita."
PER_fascist_events.1.b: "Dinasti baru untuk Iran baru."
### Iraq Events ###
 IRQ_political_events.10.t: "[FROM.GetNonIdeologyName] Mencabut Perjanjian"
 IRQ_political_events.10.desc: "Perjanjian Anglo-Irak dinegosiasikan pada tahun 1930 untuk memberikan otonomi yang lebih besar kepada negara-negara muda tersebut sekaligus menjaga mereka tetap terikat pada kebijakan luar negeri kita. Namun, pemerintah telah mencabut perjanjian tersebut dan menuntut kami menarik diri sepenuhnya dari wilayah [FROM.GetAdjective]. Karena ketergantungan kita pada minyak dari wilayah tersebut, hal ini dapat membahayakan seluruh keamanan nasional kita jika pemerintah [FROM.GetAdjective] memutuskan untuk menghentikan pasokan kita."
 IRQ_political_events.10.a: "Kami akan melakukan intervensi dan mengembalikan kekuasaan teman-teman kami."
 IRQ_political_events.10.b: "Mengeluarkan protes diplomatik."
 IRQ_political_events.11.t: "[FROM.GetNameDef] Mengeluarkan Protes Diplomatik"
 IRQ_political_events.11.desc: "Yang mengejutkan kami, pemerintah [FROM.GetAdjective] hanya mengeluarkan protes diplomatik dengan kata-kata keras kepada duta besar kami mengenai penarikan kami dari Perjanjian Inggris-Irak. Tampaknya untuk saat ini kita tidak perlu takut akan dampak serius dari [FROM.GetAdjective]."
 IRQ_political_events.11.a: "Kemenangan bagi dunia Arab!"
 IRQ_political_events.12.t: "[FROM.GetNameDefCap] Menuntut Wilayah"
 IRQ_political_events.12.desc: "Pemerintah [FROM.GetNameDef] telah menuntut agar kami menyerahkan wilayah barat kami yang merupakan tempat tinggal minoritas Arab dalam jumlah besar. Mereka berpendapat bahwa hal ini demi melindungi orang-orang Arab di wilayah tersebut. Namun, wilayah yang sama juga memiliki banyak infrastruktur minyak yang kemungkinan besar akan menguntungkan perekonomian mereka. Jika kami menolak ultimatum ini, kemungkinan besar mereka akan berusaha mengambil alih tanah tersebut secara paksa."
 IRQ_political_events.12.a: "Kami akan mempertahankan wilayah kami."
 IRQ_political_events.12.b: "Ini tidak layak untuk diperjuangkan."
 IRQ_political_events.13.t: "[FROM.GetNameDefCap] Setuju Pemindahan Wilayah"
 IRQ_political_events.13.desc: "[FROM.GetNameDefCap] pemerintah telah setuju untuk mentransfer wilayah yang kami minta dari mereka. Meskipun militer kita bersiap untuk berperang di wilayah tersebut, nampaknya kita menang tanpa perlawanan."
 IRQ_political_events.13.a: "Kemenangan lain bagi dunia Arab."
 IRQ_political_events.14.t: "[FROM.GetNameDefCap] Menolak Pindah Wilayah"
 IRQ_political_events.14.desc: "[FROM.GetNameDefCap] pemerintah menolak menyerahkan wilayah yang kami minta dari mereka. Tampaknya kita harus bergantung pada angkatan bersenjata kita jika kita ingin membebaskan wilayah tersebut dari kekuasaan [FROM.GetAdjective]."
 IRQ_political_events.14.a: "Maka kita akan mengambilnya dengan paksa."
 IRQ_political_events.14.b: "Mereka menyebut gertakan kami."
 IRQ_political_events.15.t: "Ketegangan dengan [FROM.GetNameDef] Surut"
 IRQ_political_events.15.desc: "Tampaknya angkatan bersenjata [FROM.GetAdjective] mulai menunjukkan kesiapannya di sepanjang perbatasan. Meskipun kami telah bersiap untuk mempertahankan wilayah kami, kami merasa lega karena perang dapat dihindari untuk saat ini."
 IRQ_political_events.15.a: "Sungguh melegakan."
 IRQ_political_events.16.t: "[FROM.GetNameDefCap] Meminta Pengendalian [455.GetName]"
 IRQ_political_events.16.desc: "Setelah membuktikan kesetiaan mereka kepada kami dengan menghilangkan [GER.GetAdjective] perwira yang condong ke militer, pemerintah [FROM.GetAdjective] telah meminta kesempatan untuk mengintegrasikan negara bagian tetangga mereka, [455.GetName]. Ikatan antara keluarga kerajaan kedua negara sudah ada dan ini akan menghilangkan beban administratif dari kami."
 IRQ_political_events.16.a: "Kami akan memberikan imbalan kepada mereka, selama penduduk setempat tidak mempunyai masalah."
 IRQ_political_events.16.b: "Mereka tidak bisa dipercaya."
 IRQ_political_events.17.t: "[FROM.FROM.GetNonIdeologyName] Ingin Memerintah Kami"
 IRQ_political_events.17.desc: "[FROM.FROM.GetNonIdeologyName] berusaha memperluas tanggung jawabnya dalam lingkup pengaruh [FROM.GetAdjective] dengan mengambil alih administrasi [ROOT.GetNameDef]. Jika kami setuju, kami tidak lagi bertanggung jawab langsung kepada [FROM.GetAdjective], namun kami masih kekurangan sarana untuk bertindak independen di panggung dunia."
 IRQ_political_events.17.a: "Ini adalah perubahan yang disambut baik."
 IRQ_political_events.17.b: "Kami senang dengan pengaturan saat ini."
 IRQ_political_events.18.t: "[FROM.GetNameDefCap] Setuju untuk Transfer"
 IRQ_political_events.18.desc: "Hari ini adalah hari yang menggembirakan bagi bangsa kita karena kita secara resmi mengambil alih pemerintahan [455.GetName]. Hal ini menandai langkah yang berarti menuju penyatuan dunia Arab di bawah pemerintahan kita."
 IRQ_political_events.18.a: "Saatnya merayakan!"
 IRQ_political_events.19.t: "[FROM.GetNameDefCap] Menolak Transfer"
 IRQ_political_events.19.desc: "Karena berbagai komplikasi, [FROM.GetNameDef] telah menolak rencana kami untuk mengambil alih tanggung jawab atas [455.GetName]. Tampaknya segala upaya kami untuk menyenangkan [FROM.GetAdjective], mereka masih memandang kami dengan hina dan tidak percaya."
 IRQ_political_events.19.a: "Hari yang buruk bagi [ROOT.GetNonIdeologyName] dan [455.GetName]."
 IRQ_political_events.20.t: "Administrasi [FROM.GetNameDef] Menolak Usulan"
 IRQ_political_events.20.desc: "Pemerintah [FROM.GetAdjective] telah menolak rencana untuk mengalihkan tanggung jawab negaranya kepada [IRQ.GetNonIdeologyName]. Meskipun kami pikir ini akan menyenangkan mereka, tampaknya mereka akan lebih cepat bertahan dengan iblis yang mereka kenal."
 IRQ_political_events.20.a: "Mengejutkan pastinya."
 IRQ_political_events.21.t: "[FROM.GetNameDefCap] Menuntut Pengendalian [454.GetName]"
 IRQ_political_events.21.desc: "Pemerintah [FROM.GetNameDef] telah meminta kami segera mundur dari [PAL.GetName] menyusul pecahnya kekerasan baru-baru ini di wilayah tersebut. Mereka berpendapat bahwa mereka lebih cocok untuk menangani tata kelola mandat dan bahwa penanganan kami terhadap hal tersebut merugikan sesama warga Arab. Meskipun penarikan pasukan akan bermanfaat bagi militer kita, namun dampak buruknya terhadap kebijakan luar negeri bisa sangat besar."
 IRQ_political_events.21.a: "Buatlah pengaturan untuk transfer, namun konsultasikan terlebih dahulu dengan penduduk setempat."
 IRQ_political_events.21.b: "Mereka lupa tempat mereka."
 IRQ_political_events.22.t: "[FROM.FROM.GetNonIdeologyName] Berencana Mengambil Alih"
 IRQ_political_events.22.desc: "Pemerintah [FROM.GetAdjective] berencana untuk menarik diri dari [ROOT.GetName] dan menyerahkan administrasinya kepada [IRQ.GetNameDef]. Kecuali kami membuat rencana untuk segera menghentikan proses tersebut, kami akan menerima pesanan dari [IRQ.Capital.GetCapitalVictoryPointName] dalam hitungan hari."
 IRQ_political_events.22.a: "Pengaturan yang ada saat ini tidak dapat dipertahankan..."
 IRQ_political_events.22.b: "Kami punya agenda sendiri."
 IRQ_political_events.23.t: "[ENG.GetNameDefCap] Setuju untuk Transfer"
 IRQ_political_events.23.desc: "Memahami bahwa situasi tidak dapat dipertahankan oleh pasukan mereka, pemerintah [ENG.GetAdjective] telah setuju untuk mundur dari [454.GetName] dan telah menyerahkan wewenang wilayah tersebut kepada kami."
 IRQ_political_events.23.a: "Solidaritas Arab menang hari ini."
 IRQ_political_events.24.t: "[FROM.GetNameDefCap] Menolak Transfer"
 IRQ_political_events.24.desc: "Karena berbagai komplikasi, [FROM.GetNameDef] telah menolak rencana kami untuk mengambil alih tanggung jawab atas [454.GetName]. Meskipun menawarkan opsi yang memungkinkan [ENG.GetAdjective] untuk mundur secara damai dari wilayah tersebut, mereka malah memilih untuk melanjutkan pendudukan berdarah dan mahal di wilayah tersebut, apa pun risikonya."
 IRQ_political_events.24.a: "Dunia Arab menangis hari ini."
 IRQ_political_events.24.b: "Kami tidak akan mendukung hal ini. Kolaborasi kami dengan [FROM.GetNameDefCap] telah berakhir."
 IRQ_political_events.25.t: "Administrasi [FROM.GetNameDef] Menolak Usulan"
 IRQ_political_events.25.desc: "Pemerintah [FROM.GetAdjective] telah menolak rencana untuk mengalihkan tanggung jawab negaranya kepada [IRQ.GetNonIdeologyName]. Meskipun kami pikir ini akan menyenangkan mereka, tampaknya mereka akan lebih cepat bertahan dengan iblis yang mereka kenal."
 IRQ_political_events.25.a: "Antek-antek imperialis"
 IRQ_political_events.26.t: "[FROM.GetNameDefCap] Menawarkan Keanggotaan Federasi"
 IRQ_political_events.26.desc: "Diplomat dari [FROM.GetNameDef] telah menghubungi kami dengan tawaran keanggotaan di federasi mereka. Meskipun ada manfaat ekonomi dan keamanan jika kita bergabung, kita harus menyerahkan sebagian besar otonomi kita."
 IRQ_political_events.26.a: "Kita lebih kuat bersama-sama."
 IRQ_political_events.26.b: "Kami tidak tertarik saat ini."
 IRQ_political_events.26.c: "Kami tidak akan pernah menyerahkan kedaulatan kami!"
 IRQ_political_events.27.t: "[FROM.GetNameDefCap] Menyetujui Keanggotaan Federasi"
 IRQ_political_events.27.desc: "[FROM.GetNameDefCap] telah dengan bijak memutuskan untuk menerima keanggotaan federasi. Pegawai negeri sipil dan diplomat kita sedang membuat segala persiapan untuk proses integrasi yang tergesa-gesa."
 IRQ_political_events.27.a: "Kita lebih kuat bersama-sama."
 IRQ_political_events.28.t: "[FROM.GetNameDefCap] Menolak Keanggotaan Federasi"
 IRQ_political_events.28.desc: "[FROM.GetNameDefCap] dengan bodohnya memutuskan untuk menolak keanggotaan federasi. Namun, mereka tidak menunjukkan bahwa mereka menentang bergabung di masa depan karena masyarakat mereka mungkin lebih reseptif."
 IRQ_political_events.28.a: "Mungkin mereka akan berubah pikiran?"
 IRQ_political_events.29.t: "[FROM.GetNameDefCap] Menentang Federasi"
 IRQ_political_events.29.desc: "[FROM.GetNameDefCap] telah menolak keras tawaran kami untuk menjadi anggota federasi. Mereka bersikeras bahwa mereka tidak akan pernah bersedia menerima pengaturan seperti itu karena kekhawatiran akan dampaknya terhadap negara mereka."
 IRQ_political_events.29.a: "Betapa piciknya mereka..."
 rejected_hashemite_federation_tt: "§RKami tidak dapat lagi mengundang [FROM.GetNameDef] ke federasi kami!§!"
 IRQ_regent_turned_down_absolute_powers: "§YAbd Al-Ilah§! telah menolak kesempatan untuk memulihkan monarki absolut"
# Demand Leb
 IRQ_political_events.30.t: "[FROM.GetNameDef] Menuntut Pengendalian [553.GetName]"
 IRQ_political_events.30.desc: "Pemerintah [FROM.GetNameDef] telah mengeluarkan permintaan yang berani agar kami melepaskan kendali atas Lebanon, dengan alasan tugas mereka untuk melindungi dan menyatukan masyarakat Arab di wilayah tersebut. Meskipun mereka membingkai klaim mereka dalam bahasa pan-Arabisme, jelas bahwa lokasi strategis dan potensi ekonomi wilayah tersebut, termasuk pelabuhan dan infrastrukturnya yang berharga, merupakan inti dari ambisi mereka. Jika kami menolak tuntutan mereka, kecil kemungkinannya mereka akan membiarkan masalah ini berakhir dengan damai."
 IRQ_political_events.30.a: "Kita tidak mampu melakukan perang lagi."
 IRQ_political_events.30.b: "Mereka menggertak."
 IRQ_political_events.31.t: "[FROM.GetNameDefCap] Menuntut Pengendalian [553.GetName]"
 IRQ_political_events.31.desc: "Pemerintah [FROM.GetNameDef] telah meminta kami segera mundur dari [PAL.GetName] menyusul pecahnya kekerasan baru-baru ini di wilayah tersebut. Mereka berpendapat bahwa mereka lebih cocok untuk menangani tata kelola mandat dan bahwa penanganan kami terhadap hal tersebut merugikan sesama warga Arab. Meskipun penarikan pasukan akan bermanfaat bagi militer kita, namun dampak buruknya terhadap kebijakan luar negeri bisa sangat besar."
 IRQ_political_events.31.a: "Buatlah pengaturan untuk transfer, namun konsultasikan terlebih dahulu dengan penduduk setempat."
 IRQ_political_events.31.b: "Mereka lupa tempat mereka."
 IRQ_political_events.32.t: "[FROM.FROM.GetNonIdeologyName] Berencana Mengambil Alih"
 IRQ_political_events.32.desc: "Pemerintah [FROM.GetAdjective] berencana untuk menarik diri dari [ROOT.GetName] dan menyerahkan administrasinya kepada [IRQ.GetNameDef]. Kecuali kami membuat rencana untuk segera menghentikan proses tersebut, kami akan menerima pesanan dari [IRQ.Capital.GetCapitalVictoryPointName] dalam hitungan hari."
 IRQ_political_events.32.a: "Pengaturan yang ada saat ini tidak dapat dipertahankan..."
 IRQ_political_events.32.b: "Kami punya agenda sendiri."
 IRQ_political_events.33.t: "[ENG.GetNameDefCap] Setuju untuk Transfer"
 IRQ_political_events.33.desc: "Memahami bahwa situasi tidak dapat dipertahankan oleh pasukan mereka, pemerintah [ENG.GetAdjective] telah setuju untuk mundur dari [454.GetName] dan telah menyerahkan wewenang wilayah tersebut kepada kami."
 IRQ_political_events.33.a: "Solidaritas Arab menang hari ini."
 IRQ_political_events.34.t: "[FROM.GetNameDefCap] Menolak Transfer"
 IRQ_political_events.34.desc: "Karena berbagai komplikasi, [FROM.GetNameDef] telah menolak rencana kami untuk mengambil alih tanggung jawab atas [553.GetName]. Meskipun menawarkan opsi yang memungkinkan [ENG.GetAdjective] untuk mundur secara damai dari wilayah tersebut, mereka malah memilih untuk melanjutkan pendudukan berdarah dan mahal di wilayah tersebut, apa pun risikonya."
 IRQ_political_events.34.a: "Dunia Arab menangis hari ini."
 IRQ_political_events.35.t: "Administrasi [FROM.GetNameDef] Menolak Usulan"
 IRQ_political_events.35.desc: "Pemerintah [FROM.GetAdjective] telah menolak rencana untuk mengalihkan tanggung jawab negaranya kepada [IRQ.GetNonIdeologyName]. Meskipun kami pikir ini akan menyenangkan mereka, tampaknya mereka akan lebih cepat bertahan dengan iblis yang mereka kenal."
 IRQ_political_events.35.a: "Antek-antek imperialis"
 IRQ_political_events.40.t: "[FROM.GetNameDefCap] Permintaan Suriah"
 IRQ_political_events.40.desc: "Pemerintah [FROM.GetNameDef] telah secara resmi meminta agar kami mengalihkan kendali atas Suriah kepada otoritas mereka. Mereka berpendapat bahwa Suriah, sebagai bagian integral dari dunia Arab, harus bersatu dengan [FROM.GetNameDef] di bawah satu pemerintahan untuk menjamin stabilitas dan kemakmuran di kawasan. Meskipun mereka menganggap permintaan mereka sebagai langkah menuju persatuan pan-Arab, menyerahkan Suriah akan secara signifikan mengurangi pengaruh kami di Timur Tengah. Menolak usulan mereka dapat semakin memperburuk hubungan dan berpotensi menyebabkan eskalasi."
 IRQ_political_events.40.a: "Kami tidak punya banyak pilihan."
 IRQ_political_events.40.b: "Sama sekali tidak!"
 IRQ_political_events.41.t: "[FROM.GetNameDefCap] Berniat Mentransfer Kami"
 IRQ_political_events.41.desc: "Dalam perkembangan yang mengejutkan, pemerintah [FROM.GetNameDef] telah setuju untuk mengalihkan wewenang atas kami kepada [FROM.FROM.GetNameDef]. Banyak orang di pemerintahan kita mempertanyakan apakah perjanjian ini benar-benar mencerminkan kepentingan kita atau apakah kita digunakan sebagai pion dalam permainan geopolitik yang lebih besar. Waktunya telah tiba untuk memutuskan apakah kita akan menerima pengalihan ini atau menolak penerapan kendali asing."
 IRQ_political_events.41.a: "Kami akan menjadi lebih baik."
 IRQ_political_events.41.b: "Pengaturan saat ini cocok untuk kita."
 IRQ_political_events.42.t: "[FROM.GetNameDefCap] Menolak Permintaan"
 IRQ_political_events.42.desc: "Pemerintahan [FROM.GetNameDef] telah dengan tegas menolak usulan kami untuk menyerahkan Suriah ke dalam kekuasaan kami, menolak visi kami mengenai persatuan Arab dan stabilitas regional. Penolakan ini melemahkan upaya untuk mengkonsolidasikan dunia Arab dan menghilangkan kesempatan rakyat Suriah untuk bergabung dengan negara yang lebih kuat dan bersatu. Pertanyaannya sekarang adalah apakah akan melanjutkan jalur diplomatik lebih lanjut atau mempersiapkan penyelesaian yang lebih tegas terhadap perselisihan ini."
 IRQ_political_events.42.a: "Kita tidak seharusnya memaksakan masalah ini."
 IRQ_political_events.42.b: "Kami punya cara lain untuk mengambil tanah itu."
 IRQ_political_events.43.t: "[FROM.GetNameDefCap] Setuju dengan Permintaan"
 IRQ_political_events.43.desc: "[FROM.GetNameDef] telah menyetujui proposal kami untuk menyerahkan Suriah ke dalam kekuasaan kami, menandai sebuah langkah signifikan menuju penyatuan dunia Arab. Perjanjian bersejarah ini memperkuat posisi kita sebagai pemimpin di kawasan dan membawa kita lebih dekat untuk mewujudkan visi bangsa Arab yang bersatu dan sejahtera."
 IRQ_political_events.43.a: "Luar biasa!"
 IRQ_political_events.44.t: "[FROM.GetNameDefCap] menuntut Aneksasi kami"
 IRQ_political_events.44.desc: "Pemerintah [FROM.GetNameDef] telah meminta agar kami bergabung dengan mereka. Saatnya telah tiba untuk memutuskan apakah kita akan menerima hal ini atau menolak penerapan kendali asing."
 IRQ_political_events.44.a: "$IRQ_political_events.40.a$"
 IRQ_political_events.44.b: "$IRQ_political_events.40.b$"
 IRQ_political_events.50.t: "[FROM.GetNameDefCap] Permintaan Kuwait"
 IRQ_political_events.50.desc: "Pemerintah [FROM.GetNameDef] telah secara resmi meminta agar kami mengalihkan kendali Kuwait kepada otoritas mereka. Mereka berpendapat bahwa Kuwait, sebagai bagian integral dari dunia Arab, harus bersatu dengan [FROM.GetNameDef] di bawah satu pemerintahan untuk menjamin stabilitas dan kemakmuran di kawasan. Meskipun mereka menganggap permintaan mereka sebagai langkah menuju persatuan pan-Arab, menyerahkan Kuwait akan mengurangi pengaruh kami di Timur Tengah secara signifikan. Menolak usulan mereka dapat semakin memperburuk hubungan dan berpotensi menyebabkan eskalasi."
 IRQ_political_events.50.a: "Kami tidak punya banyak pilihan."
 IRQ_political_events.50.b: "Sama sekali tidak!"
 IRQ_political_events.51.t: "[FROM.GetNameDefCap] Berniat Mentransfer Kami"
 IRQ_political_events.51.desc: "Dalam perkembangan yang mengejutkan, pemerintah [FROM.GetNameDef] telah setuju untuk mengalihkan wewenang atas kami kepada [FROM.FROM.GetNameDef]. Banyak orang di pemerintahan kita mempertanyakan apakah perjanjian ini benar-benar mencerminkan kepentingan kita atau apakah kita digunakan sebagai pion dalam permainan geopolitik yang lebih besar. Waktunya telah tiba untuk memutuskan apakah kita akan menerima pengalihan ini atau menolak penerapan kendali asing."
 IRQ_political_events.51.a: "Kami akan menjadi lebih baik."
 IRQ_political_events.51.b: "Pengaturan saat ini cocok untuk kita."
 IRQ_political_events.52.t: "[FROM.GetNameDefCap] Menolak Permintaan"
 IRQ_political_events.52.desc: "Pemerintah [FROM.GetNameDef] langsung menolak usulan kami untuk menyerahkan Kuwait ke dalam kekuasaan kami, menolak visi kami mengenai persatuan Arab dan stabilitas regional. Penolakan ini melemahkan upaya untuk mengkonsolidasikan dunia Arab dan menghilangkan kesempatan rakyat Kuwait untuk bergabung dengan negara yang lebih kuat dan bersatu. Pertanyaannya sekarang adalah apakah akan melanjutkan jalur diplomatik lebih lanjut atau mempersiapkan penyelesaian yang lebih tegas terhadap perselisihan ini."
 IRQ_political_events.52.a: "Kita tidak seharusnya memaksakan masalah ini."
 IRQ_political_events.52.b: "Kami punya cara lain untuk mengambil tanah itu."
 IRQ_political_events.53.t: "[FROM.GetNameDefCap] Setuju dengan Permintaan"
 IRQ_political_events.53.desc: "[FROM.GetNameDef] telah menyetujui proposal kami untuk menyerahkan Kuwait ke dalam kekuasaan kami, menandai sebuah langkah signifikan menuju penyatuan dunia Arab. Perjanjian bersejarah ini memperkuat posisi kita sebagai pemimpin di kawasan dan membawa kita lebih dekat untuk mewujudkan visi bangsa Arab yang bersatu dan sejahtera."
 IRQ_political_events.53.a: "Luar biasa!"
 IRQ_political_events.60.t: "[FROM.GetNameDefCap] Menawarkan Kedamaian"
 IRQ_political_events.60.desc: "Menghadapi tekanan yang meningkat dari Sekutu, perampas kekuasaan di [FROM.GetNonIdeologyName] telah mengusulkan penyelesaian damai. Mereka menawarkan untuk memulihkan kekuasaan bupati dan menegakkan kembali otoritas kami dengan imbalan diakhirinya permusuhan dan pelestarian integritas wilayah mereka. Meskipun usulan ini mengakui kesia-siaan perlawanan lebih lanjut, hal ini menandai pembalikan ambisi Lapangan Emas dan mungkin menimbulkan keresahan di kalangan pendukungnya."
 IRQ_political_events.60.a: "Baiklah."
 IRQ_political_events.60.b: "Mereka tidak bisa dipercaya."
 IRQ_political_events.61.t: "[FROM.GetNameDefCap] Menerima Kesepakatan Damai"
 IRQ_political_events.61.desc: "[FROM.GetNameDefCap] telah menyetujui usulan perdamaian kita. Persyaratan tersebut mengharuskan kita untuk tunduk pada otoritas [FROM.GetAdjective], sehingga mengakhiri konflik. Ketika perang telah usai, keputusan ini mungkin memicu keresahan internal karena pihak-pihak yang memperjuangkan kedaulatan dan kemerdekaan harus menghadapi penegasan kembali kendali asing atas negara tersebut."
 IRQ_political_events.61.a: "Setidaknya kita bisa mengakhiri pertumpahan darah."
 IRQ_political_events.62.t: "[FROM.GetNameDefCap] Menolak Kesepakatan Damai"
 IRQ_political_events.62.desc: "[FROM.GetNameDefCap] telah menolak usulan perdamaian kami, bersikeras untuk tunduk sepenuhnya tanpa kompromi. Jika negosiasi gagal, konflik akan terus berlanjut, sehingga kita harus menghadapi kekuatan penuh pasukan Sekutu. Jalan ke depan akan penuh dengan tantangan, namun tekad kita untuk merdeka masih belum tergoyahkan."
 IRQ_political_events.62.a: "Lalu kita akan berjuang sampai akhir."
 IRQ_political_events.70.t: "$IRQ_bakr_sidqi$ Selamat dari Percobaan Pembunuhan"
 IRQ_political_events.70.desc: "Di Mosul hari ini, $IRQ_bakr_sidqi$ menjadi sasaran upaya pembunuhan yang dilakukan oleh Kopral Abdullah Al-Talafari, ketika pemuda itu menodongkan pistol ke Sidqi dan tangan kanannya Muhmmad Ali Jawad. Dalam usahanya tersebut, Jawad terluka parah, namun Sidqi berhasil keluar tanpa luka sedikit pun."
 IRQ_political_events.70.a: "Betapa beruntungnya seorang pria?"
 IRQ_political_events.71.t: "Melegitimasi Aturan Kami"
 IRQ_political_events.71.desc: "Banyak orang di negara kami yang masih tidak menerima Lapangan Emas sebagai penguasa mereka yang sah, dan menganggap kami sebagai perampas kekuasaan dan bajingan tidak sah. Untuk mengatasi masalah ini, para menteri kami telah memberikan beberapa solusi. Entah kita mengabaikan seruan masyarakat, dan berharap seruan itu akan memudar seiring berjalannya waktu, atau kita mengangkat Emir Taif sebagai bupati baru untuk Faisal II. Namun selalu ada pilihan untuk melakukan reformasi menjadi sebuah republik, meskipun hal ini mungkin tidak populer di kalangan umat beragama kita..."
 IRQ_political_events.71.a: "Kami sudah cukup sah"
 IRQ_political_events.71.b: "$IRQ_sharaf_bin_rajeh$ cukup"
 IRQ_political_events.71.c: "Kita butuh Presiden, bukan raja!"
 IRQ_political_events.72.t: "Kematian Ghazi I"
 IRQ_political_events.72.desc: "Laporan telah masuk bahwa hari ini raja agung kita, Ghazi I, meninggal secara tragis dalam kecelakaan mobil saat mengendarai mobil sportnya di Bagdad. Ada yang menyatakan bahwa hal itu hanyalah sebuah kecelakaan, sementara ada pula yang berspekulasi bahwa hal itu mungkin terjadi atas perintah Nuri al-Said, karena rencana raja untuk bersatu dengan Kuwait, namun tidak ada yang mengetahui secara pasti. Namun satu hal yang jelas, seseorang harus mengambil obor dan menggantikannya sekarang setelah dia pergi."
 IRQ_political_events.72.a: "Abd Al-Ilah akan mengambil alih Kabupaten"
 IRQ_political_events.72.b: "Faisal II harus langsung menggantikannya!"
 IRQ_political_events.73.t: "Meningkatnya Dukungan untuk Aturan Absolut Hashemite"
 IRQ_political_events.73.desc: "Karena prosesi pemakaman mendiang Ghazi I baru-baru ini, sentimen monarki meningkat seiring dengan duka masyarakat. Hal ini membuka peluang bagi Abd Al-Ilah untuk memerintah dalam kekuasaan perdana menteri yang telah lama menumbangkan kekuasaan absolut kita, sebagai langkah awal yang baik untuk memulihkan sepenuhnya kekuasaan Hashemite di Arab."
 IRQ_political_events.73.a: "Abd Al-Ilah akan merebut kembali Hak Kesulungan Hashemite"
 IRQ_political_events.73.b: "Sangat penting bagi kita untuk mempertahankan sifat konstitusional monarki kita!"
 IRQ_political_events.74.t: "[FROM.GetName] Mengundang Delegasi Perminyakan"
 IRQ_political_events.74.desc: "Teman-teman [FROM.GetAdjective] baru kami mengusulkan misi para raja minyak dan eksekutif industri untuk mengumpulkan investasi di ladang sumber daya mereka yang luas. Perjanjian ini harus dijamin melalui pertukaran senjata dan minyak yang saling menguntungkan."
 IRQ_political_events.74.a: "Waktu yang tepat."
 IRQ_political_events.74.b: "Kami tidak mampu menanggungnya."
 IRQ_political_events.75.t: "Delegasi Diterima"
 IRQ_political_events.75.desc: "Teman [FROM.GetAdjective] kami telah setuju untuk mengirim delegasi dengan maksud untuk investasi masa depan, asalkan kami segera menandatangani kesepakatan pertukaran awal. Hal ini telah berjalan dengan baik."
 IRQ_political_events.75.a: "Luar biasa"
 IRQ_political_events.76.t: "Delegasi Ditolak"
 IRQ_political_events.76.desc: "Sayangnya, pemerintah [FROM.GetAdjective] telah menolak permintaan kami untuk menukar minyak yang berharga dengan senjata. Kerugian mereka adalah keuntungan kita."
 IRQ_political_events.76.a: "Sayangnya"
 IRQ_political_events.77.t: "[IRQ.GetNameDefCap] Menaklukkan [680.GetName]"
 IRQ_political_events.77.desc: "Setelah kampanye cepat di [680.GetName], tentara [IRQ.GetAdjective] telah merebut semua pemukiman besar dan menyatakan wilayah tersebut di bawah kendali mereka."
 IRQ_political_events.77.a: "Kekuatan Kami Tumbuh!"
 IRQ_political_events.77.b: "Oh baiklah"
 IRQ_political_events.78.t: "[IRQ.GetNameDefCap] menarik diri dari [680.GetName]"
 IRQ_political_events.78.desc: "Menghadapi kesulitan yang parah tentara [IRQ.GetAdjective] telah mundur dari kota Deir az-Zur, ini mungkin bukan akhir dari konflik tetapi untuk saat ini wilayah tersebut akan tetap [SYR.GetAdjective]."
 IRQ_political_events.78.a: "Kemunduran Sementara..."
 IRQ_political_events.78.b: "Deir az-Zur berdiri!"
# Kurdistan
 IRQ_kurdistan_events.1.t: "Nasionalis Kurdi Mendekati Kami untuk Bantuan"
 IRQ_kurdistan_events.1.desc: "Kami baru saja menerima komunikasi dari kaum nasionalis Kurdi di [IRQ.GetNameDefCap] yang meminta bantuan untuk revolusi mereka."
 IRQ_kurdistan_events.1.a: "Tentu saja kami akan membantu!"
 IRQ_kurdistan_events.1.b: "Kami tidak tertarik pada revolusi kecil di [IRQ.GetNameDefCap]."
 IRQ_kurdistan_events.2.t: "[FROM.GetNameDefCap] setuju untuk membantu kami"
 IRQ_kurdistan_events.2.desc: "Kontak kami di [FROM.GetNameDefCap] telah menanggapi permintaan bantuan kami dan setuju untuk membantu tujuan kami."
 IRQ_kurdistan_events.2.a: "Ini adalah berita bagus!"
 IRQ_kurdistan_events.3.t: "[FROM.GetNameDefCap] menolak membantu kami"
 IRQ_kurdistan_events.3.desc: "Kontak kami di [FROM.GetNameDefCap] telah menanggapi permintaan bantuan kami dan sayangnya menolak membantu kami, kami sendirian."
 IRQ_kurdistan_events.3.a: "Kita tidak boleh membiarkan hal ini mematahkan semangat kita!"
 IRQ_kurdistan_events.4.t: "Formulir Serikat Pekerja"
 IRQ_kurdistan_events.4.desc: "Sehubungan dengan dorongan industrialisasi baru-baru ini, kita telah melihat munculnya beberapa serikat pekerja yang berbeda. Para pekerja pabrik bersatu menuntut kondisi kerja yang mereka anggap adil. Kita mungkin mendapat manfaat dengan menenangkan mereka, tapi siapa yang tahu bagaimana hal ini akan berdampak pada kita secara politik."
 IRQ_kurdistan_events.4.a: "Para pekerja benar."
 IRQ_kurdistan_events.4.b: "Kita tidak bisa membiarkan praktik-praktik sosialis ini!"
###
### News Events ###
 GOE_IRQ_news.1.t: "Pemberontakan Besar Palestina"
 GOE_IRQ_news.1.d: "Setelah bertahun-tahun merasakan ketidakpuasan atas pemerintahan [ENG.GetAdjective] dan migrasi ke wilayah tersebut sejak Perang Besar, penduduk Arab [PAL.GetName] meletus dalam pemberontakan. Mereka yang terlibat dalam pemberontakan menuntut penarikan pasukan [ENG.GetAdjective] dan kemerdekaan penuh bagi Palestina. Meskipun [ENG.GetAdjective] kemungkinan besar tidak akan menerima tuntutan tersebut, jelas bahwa administrasi wilayah akan menjadi upaya yang semakin memakan biaya bagi mereka."
 GOE_IRQ_news.1.a: "Kami mendukung para pemberontak."
 GOE_IRQ_news.1.b: "Bagaimana reaksi [ENG.GetNameDef]?"
 GOE_IRQ_news.1.c: "Kita harus mendapatkan kembali kendali atas situasi ini."
 the_1936_PAL_revolt_has_happened: "§YPemberontakan Palestina telah terjadi dan [ENG.GetAdjective] telah mengasingkan para pembangkang.§!"
 GOE_IRQ_news.2.t: "[FROM.GetNameDefCap] Menolak Perjanjian Ankara"
 GOE_IRQ_news.2.d: "Dalam sebuah langkah yang berani, pemerintah [FROM.GetNameDef] telah secara resmi menolak Perjanjian Ankara, menganggap perjanjian teritorialnya sebagai peninggalan masa lalu. Keputusan ini secara langsung menantang batas-batas yang telah ditetapkan dan kesepakatan antara [TUR.GetNameDef], [PER.GetNameDef], dan [FROM.GetNonIdeologyName], sehingga menjadikan kawasan ini berada dalam ketidakpastian politik. Baik [TUR.Capital.GetCapitalVictoryPointName] maupun [PER.Capital.GetCapitalVictoryPointName] telah mengalami kemarahan publik atas pembangkangan ini, dan ketegangan meningkat seiring dengan meningkatnya seruan untuk mengambil tindakan tegas terhadap tindakan sepihak [FROM.GetNameDef]."
 GOE_IRQ_news.2.a: "Kita harus mempersiapkannya dengan baik."
 ### Mughal peace Deal
 GOE_RAJ_mughals_peace_deal.1.t: "[UK_INDIA.GetName] Menawarkan Konsesi Teritorial"
 GOE_RAJ_mughals_peace_deal.1.desc: "Akhirnya kesulitan ekonomi akibat perang yang sedang berlangsung terbukti terlalu sulit untuk ditangani oleh pemerintah [UK_INDIA.GetAdjective]. Meskipun tuan mereka keberatan, mereka telah menawarkan konsesi teritorial yang signifikan kepada kami sebagai imbalan atas perdamaian."
 GOE_RAJ_mughals_peace_deal.1.a: "Luar biasa"
 GOE_generic_events.1.t: "[FRA.GetAdjective] Pemerintahan Runtuh"
 GOE_generic_events.1.desc: "Kegagalan tentara [FRA.GetAdjective] mempertahankan Paris telah menyebabkan runtuhnya pemerintahan. Setelah gencatan senjata yang disepakati secara tergesa-gesa, sebuah rezim baru telah didirikan di Vichy. Namun, sejumlah pejabat [FRA.GetAdjective] telah meninggalkan negara tersebut untuk mendirikan pemerintahan di pengasingan dan bersumpah untuk melanjutkan perjuangan sampai [FRA.GetNonIdeologyName] dibebaskan. Kini keputusan sulit telah menimpa pemerintah kita sendiri."
 GOE_generic_events.1.a: "Pemerintahan Vichy adalah otoritas yang sah."
 GOE_generic_events.1.b: "Kami akan membantu pemerintah di pengasingan."
 GOE_generic_events.1.c: "Kita akan melepaskan diri dari [FRA.GetAdjective] bersama-sama!"
 GOE_generic_events_1_tt: "§RVichy Prancis mungkin menyatakan perang terhadap kita!§!"
 GOE_generic_events.2.t: "[FROM.GetAdjective] Administrasi Tetap Setia"
 GOE_generic_events.2.desc: "Pemerintah [FROM.GetNameDef] telah menyatakan dengan jelas komitmennya untuk menghormati wewenang kami sebagai satu-satunya wakil rakyat [FRA.GetAdjective] dan bahwa mereka akan terus mengikuti jejak kami dalam segala hal kebijakan luar negeri."
 GOE_generic_events.2.a: "Keputusan yang bijaksana."
 GOE_generic_events.3.t: "[FROM.GetAdjective] Administrasi Mengkhianati Kita"
 GOE_generic_events.3.desc: "Pemerintahan [FROM.GetNameDef] telah menikam kami dari belakang dengan menolak mengakui otoritas kami sebagai pemerintahan [FRA.GetAdjective] yang sah. Mereka malah menyatakan kesetiaan mereka kepada musuh-musuh kita."
 GOE_generic_events.3.a: "Ini tidak tahan!"
 GOE_generic_events.3.b: "Dampaknya kecil."
 GOE_generic_events.4.t: "[FROM.GetAdjective] Pemerintahan Mendeklarasikan Kemerdekaan"
 GOE_generic_events.4.desc: "Pemerintah [FROM.GetNameDef] telah menggunakan kekacauan yang terjadi baru-baru ini untuk mendeklarasikan kemerdekaan dari kami. Angkatan bersenjata kami, meski belum pulih dari perubahan pemerintahan, percaya bahwa masih mungkin untuk mendapatkan kembali kendali atas situasi dan memaksa wilayah [FROM.GetAdjective] kembali ke bawah kendali kami."
 GOE_generic_events.4.a: "Perilaku oportunistik ini tidak bisa diterima."
 GOE_generic_events.4.b: "Tidak dapat dipungkiri hal seperti ini akan terjadi."
 GOE_generic_events.5.t: "Mempertahankan Kemerdekaan kita"
 GOE_generic_events.5.desc: "Mantan penindas kita sangat marah atas deklarasi kemerdekaan kita dan mulai memobilisasi kekuatan mereka untuk memusnahkan kebebasan baru kita. Tampaknya kemerdekaan kita tidak akan tercapai tanpa pertumpahan darah."
 GOE_generic_events.5.a: "Kami akan menang!"
 PER_ssb_events.1.t: "[SSB_leader.GetNameDefCap] mengundang kami ke Aliansi Saadabad"
 PER_ssb_events.1.desc: "[SSB_leader.GetLeader] telah menjadwalkan pertemuan bersama dengan para pemimpin semua negara penandatangan Saadabad. [SSB_leader.GetLeader] menyatakan bahwa Pakta Saadabad awalnya merupakan pakta non-agresi yang sederhana antara negara-negara kita, namun telah berkembang menjadi jauh lebih besar, dengan kolaborasi ekonomi dan militer kita yang semakin tinggi. Ketika negara kita dikelilingi oleh negara-negara adidaya dari segala penjuru, kita tidak berdaya melawan mereka. [SSB_leader.GetLeader] telah mengusulkan aliansi formal di antara kita untuk memastikan kolaborasi militer total dan kesatuan ekonomi, dengan menyatakan bahwa hal ini penting untuk kelangsungan hidup kita karena kita ditakdirkan untuk gagal melawan kekuatan-kekuatan ini."
 PER_ssb_events.1.a: "Tentu saja, kami akan menandatanganinya!"
 PER_ssb_events.1.b: "Ini bukan demi kepentingan terbaik [THIS.GetNameDefCap]."
 PER_ssb_events.2.t: "[FROM.GetNameDefCap] Bergabung dengan Aliansi Saadabad!"
 PER_ssb_events.2.desc: "Pertemuan telah selesai dan [FROM.GetLeader] telah memperjelas bahwa aliansi formal antara anggota Pakta Saadabad adalah yang paling penting bagi kelangsungan hidup bangsa kita, dan telah setuju untuk bergabung dengan aliansi tersebut."
 PER_ssb_events.2.a: "Luar biasa!"
 PER_ssb_events.3.t: "[FROM.GetNameDefCap] Menolak tawaran aliansi kami."
 PER_ssb_events.3.desc: "Rapat telah selesai, dan sayangnya kami tidak dapat meyakinkan [FROM.GetLeader] untuk bergabung. Kolaborasi militer dan ekonomi kita saat ini akan terus berlanjut, namun [FROM.GetLeader] menyatakan Aliansi Saadabad yang formal bukanlah kepentingan terbaik [FROM.GetNameDefCap]."
 PER_ssb_events.3.a: "Aliansi Saadabad akan hidup tanpa mereka!"
 PER_ssb_events.4.t: "[FROM.GetNameDefCap] mengusulkan integrasi ekonomi"
 PER_ssb_events.4.desc: "[FROM.GetLeader] telah mengadakan pertemuan antara para penandatangan pakta Saadabad untuk membahas proposal pemerintah [FROM.GetAdjective]. [FROM.GetLeader] menyatakan bahwa kita berada dalam posisi berbahaya dimana kita diancam oleh negara-negara besar di segala arah, dan menawarkan untuk mengintegrasikan perekonomian kita secara lebih erat, dengan pemerintah [FROM.GetAdjective] yang menginvestasikan sumber daya untuk memperluas industri kita, dan membagi industri kita bersama-sama."
 PER_ssb_events.4.a: "Ini adalah perjanjian yang saling menguntungkan!"
 PER_ssb_events.4.b: "Ini jelas bukan demi kepentingan terbaik kita."
 PER_ssb_events.5.t: "[FROM.GetNameDefCap] Menerima!"
 PER_ssb_events.5.desc: "Setelah pertemuan selesai, [FROM.GetLeader] menyatakan kegembiraannya dengan gagasan tersebut, dan percaya bahwa ini adalah kesepakatan yang saling menguntungkan."
 PER_ssb_events.5.a: "Luar biasa!"
 PER_ssb_events.6.t: "[FROM.GetNameDefCap] Menolak."
 PER_ssb_events.6.desc: "Setelah pertemuan berakhir, [FROM.GetLeader] menyatakan keraguannya mengenai usulan tersebut, dengan menyatakan bahwa usulan tersebut tampak satu dimensi dan memiliki tujuan akhir yang jelas untuk menjadikan [THIS.GetAdjective] mendominasi wilayah tersebut."
 PER_ssb_events.6.a: "Sayang sekali."
 PER_ssb_events.7.t: "[IRQ.GetNameDefCap] membuka Kereta Api Berlin-Baghdad ke Pakta Saadabad"
 PER_ssb_events.7.desc: "[IRQ.GetNameDefCap] hari ini telah menandatangani undang-undang yang membuka perdagangan melalui jalur kereta api Berlin-Baghdad ke semua negara penandatangan Pakta Saadabad. Hal ini akan memungkinkan perdagangan yang luas, mudah, dan murah dengan seluruh Eropa dan akan menjadi keuntungan bagi perekonomian kita."
 PER_ssb_events.7.a: "Hari ini adalah hari yang menyenangkan untuk menjadi [ROOT.GetAdjective]!"
 PER_ssb_events.8.t: "[FROM.PREV.GetNameDefCap] menyatakan perang terhadap [FROM.PREV.FROM.GetNameDefCap], melanggar Pakta Saadabad!"
 PER_ssb_events.8.desc: "Dalam berita yang mengkhawatirkan, [FROM.PREV.GetNameDefCap] telah menyatakan perang terhadap anggota lain, melanggar ketentuan inti Perjanjian Saadabad. Akibatnya, [FROM.PREV.GetNonIdeologyName] telah dikeluarkan dari Pakta Saadabad. Hanya waktu yang akan membuktikan apa dampaknya terhadap pakta ini ke depan, mungkin hal ini akan menyebabkan anggota yang tersisa bergerak menuju peningkatan solidaritas, atau mungkin ini akan memicu rantai spiral yang berujung pada matinya Pakta Saadabad."
 PER_ssb_events.8.a: "Mudah-mudahan hal ini tidak menyebabkan keruntuhan total perjanjian..."
 PER_ssb_events.9.t: "Awal dari Kerjasama Penelitian Saadabad"
 PER_ssb_events.9.desc: "Kemungkinan perjanjian penelitian bersama dalam Pakta Saadabad telah menjadi diskusi yang berlangsung selama beberapa waktu, namun setelah diskusi yang berkepanjangan, kesepakatan akhirnya tercapai. Semua penemuan dan informasi mengenai penelitian harus dibagikan di antara pakta tersebut, dan sistem kini telah diterapkan untuk memungkinkan proyek penelitian bersama dalam Pakta Saadabad. Hal ini mempunyai kemungkinan untuk memfasilitasi era baru ilmu pengetahuan bagi kita, memungkinkan kita untuk berdiri di antara seluruh dunia sebagai pemimpin dan inovator dalam ilmu pengetahuan."
 PER_ssb_events.9.a: "Luar biasa!"
 SSB_resource_event_scripted_loc_oil: "$state_resource_oil$"
 SSB_resource_event_scripted_loc_chromium: "$state_resource_chromium$"
 PER_ssb_events.10.t: "[PER.GetName] menandatangani kesepakatan ekspor minyak"
 PER_ssb_events.11.t: "[TUR.GetName] menandatangani kesepakatan ekspor kromium"
 PER_ssb_events.10.desc: "Pemerintah [FROM.GetAdjective] telah menyelesaikan perjanjian dengan perusahaan-perusahaan terkemuka di seluruh wilayah Saadabad, menukar [SSB_resource_event_scripted_loc] dalam jumlah besar dengan berbagai sumber daya. Meskipun sebagian besar [SSB_resource_event_scripted_loc] disalurkan langsung ke badan swasta, pemerintah kita tetap menyisihkan sebagian kecilnya sebagai biaya administrasi."
 PER_ssb_events.10.a: "Pakta ini mulai berdampak besar pada perekonomian kita."
 SSB_if_join_tt: "Menerima perjanjian ini akan memungkinkan §YPakta Non Agresi§! dan membuka §YPohon Fokus Bersama§! antara semua negara penandatangan, dan memberi kita semangat nasional §YPakta Saadabad§! yang akan menjadi lebih baik dari waktu ke waktu seiring dengan selesainya fokus dalam pohon fokus bersama."
 SSB_you_will_lose_the_bonus_tt: "§RMenyatakan perang terhadap anggota Pakta Saadabad merupakan pelanggaran terhadap perjanjian dan akan menyebabkan Anda dikeluarkan, kehilangan Semangat Nasional dan kehilangan akses ke pohon fokus bersama secara permanen.§!"
