 CHI_camco_2: "CAMCO - Divisi Tempur"
 CHI_camco_3: "CAMCO - Divisi Pembom"
 PRC_the_long_march: "Setelah Long March"
 PRC_the_long_march_desc: "Mundurnya pasukan kita dalam waktu lama ke Shanxi telah menguras kekuatan kita, dan Daerah Pangkalan Yan'an belum siap untuk mendukung pemberontakan besar. Diperlukan waktu atau bantuan dari luar untuk pulih."
 PRC_the_long_march_2: "Pemulihan dari Long March"
 PRC_low_popular_support: "Dukungan Populer Rendah"
 PRC_low_popular_support_desc: "Para petani sangat menderita akibat perang saudara. Jika kita ingin diterima sebagai pemerintah Tiongkok yang sah, kita harus mendapatkan dukungan mereka."
 PRC_power_struggles: "Perebutan Kekuasaan"
 PRC_power_struggles_desc: "Partai ini terpecah secara internal mengenai cara terbaik untuk melanjutkan. Pertikaian antara berbagai faksi telah meletus dan akan terus berlanjut hingga salah satu dari mereka berkuasa."
 PRC_red_army_weakened: "Tentara Merah Melemah"
 PRC_red_army_weakened_desc: "Kelelahan akibat Long March, Tentara Merah kita belum siap bertempur. Kita harus membentuk unit baru dan membentuk Tentara Pembebasan baru."
