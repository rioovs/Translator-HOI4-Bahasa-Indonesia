 MAN_aisin_gioro_puyi_xuantong_name: "Xuantong"
 MAN_the_kangde_emperor: "Kaisar Kangde"
 MAN_the_kangde_emperor_desc: "Pada tahun 1934 Puyi dinobatkan sebagai Kaisar Manchukuo, mengubah gelarnya dari Kepala Eksekutif menjadi Kaisar, dan dengan demikian nama Era baru diadopsi. Sebelumnya memerintah dengan nama Datong, ia kini memerintah Manchuria sebagai Kaisar Kangde."
