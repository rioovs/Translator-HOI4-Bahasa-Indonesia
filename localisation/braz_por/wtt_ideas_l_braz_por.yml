 CHI_chinese_unity_1: "Persatuan Tiongkok"
 CHI_chinese_unity_1_desc: "Para Panglima Perang telah menyatakan dukungan mereka kepada kami, sehingga pemerintah kami dapat fokus melawan penjajah asing mana pun."
