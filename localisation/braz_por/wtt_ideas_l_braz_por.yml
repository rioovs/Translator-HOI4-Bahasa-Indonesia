 PRC_government_corruption: "Korupsi Pemerintah"
 PRC_government_corruption_desc: "Pemerintahan kita penuh dengan individu-individu korup, dan bukan hal yang aneh jika uang milik negara hilang ke kantong pejabat daerah."
