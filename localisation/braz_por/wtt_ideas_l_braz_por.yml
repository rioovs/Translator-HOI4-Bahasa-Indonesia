 MAN_low_legitimacy: "Legitimasi Rendah"
 MAN_low_legitimacy_5_desc: "Kaisar Puyi adalah keturunan sah kaisar Qing yang memerintah Tiongkok selama tiga ratus tahun. Revolusi Xinhai yang menggulingkannya pada tahun 1911 sangat populer, karena pemerintahan Qing tidak berdaya melawan orang asing yang mencuri tanah Tiongkok dan gubernur regional yang menjadikan diri mereka sebagai panglima perang. Pelantikan Kaisar Puyi oleh Jepang sebagai Kaisar Manchukuo belum diterima oleh masyarakat Manchuria, apalagi seluruh Tiongkok.\n\nKita harus menetapkan kemerdekaan Kaisar dari Jepang untuk menggalang bangsa di bawah kepemimpinannya."
 MAN_low_legitimacy_4_desc: "Kaisar Puyi adalah keturunan sah kaisar Qing yang memerintah Tiongkok selama tiga ratus tahun. Revolusi Xinhai yang menggulingkannya pada tahun 1911 sangat populer, karena pemerintahan Qing tidak berdaya melawan orang asing yang mencuri tanah Tiongkok dan gubernur regional yang menjadikan diri mereka sebagai panglima perang. Pelantikan Kaisar Puyi oleh Jepang sebagai Kaisar Manchukuo belum diterima oleh masyarakat Manchuria, apalagi seluruh Tiongkok.\n\nKita harus menetapkan kemerdekaan Kaisar dari Jepang untuk menggalang bangsa di bawah kepemimpinannya."
