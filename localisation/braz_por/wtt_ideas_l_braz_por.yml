 MAN_mamc_heavy: "Perusahaan Manufaktur Pesawat Manchuria - Divisi Proyek Besar"
 MAN_five_year_plan: "Rencana Lima Tahun"
 CHI_chinese_support: "Dukungan Tiongkok"
 german_chinese_tank_designer: "Misi Teknis Sino-Jerman"
 shanghai_electronics: "Shanghai Elektronik"
 sino_soviet_resource_surveyors: "Survei Sumber Daya Sino-Soviet"
 MAN_arms_seized_1: "Kekurangan Amunisi di Manchuria"
 MAN_arms_seized_1_desc: "Qing telah mengatur serangan mendadak dan menyita sejumlah gudang senjata dan tempat pembuangan amunisi di wilayah mereka. Diperlukan waktu untuk mengatur ulang rantai pasokan kita di wilayah mereka."
 MAN_underground_gun_shops: "Lokakarya Bawah Tanah"
 MAN_underground_gun_shops_desc: "Kami telah mendirikan sejumlah bengkel darurat di halaman belakang dan ruang bawah tanah untuk memproduksi lebih banyak peralatan. Kualitasnya mungkin tidak terlalu bagus, tapi jumlahnya bisa diimbangi dengan jumlah."
