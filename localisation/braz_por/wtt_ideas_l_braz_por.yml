 JAP_militarism: "Militerisme"
 JAP_militarism_desc: "Militerisme mendominasi kehidupan politik dan sosial bangsa, dan keyakinan bahwa kekuatan militer setara dengan kekuatan suatu bangsa sangat menonjol. Dimulai dengan diperkenalkannya wajib militer pada masa Restorasi Meiji, kini wajib militer telah menjadi prinsip inti dalam kepercayaan nasional kita."
 JAP_interservice_rivalry_army_dominant: "Rivalitas Antar Dinas - Dominan Angkatan Darat"
 JAP_interservice_rivalry_army_strengthened: "Rivalitas Antar Dinas - Tentara Diperkuat"
