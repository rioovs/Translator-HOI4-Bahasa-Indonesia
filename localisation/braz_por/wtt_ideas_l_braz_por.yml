l_braz_por:
 CHI_nine_power_treaty: "Perjanjian Sembilan Kekuatan"
 CHI_nine_power_treaty_desc: "Kita masih bekerja di bawah pengaruh Perjanjian yang Tidak Setara yang meresmikan \"Kebijakan Pintu Terbuka\" terhadap Tiongkok. Orang asing masih mempunyai hak ekstrateritorial, dan kita tidak mempunyai kendali penuh atas perekonomian kita."
 CHI_army_corruption: "Korupsi Angkatan Darat"
 CHI_army_corruption_desc: "Angkatan bersenjata kita penuh dengan korupsi dan nepotisme. Jika kita ingin mengubah mereka menjadi kekuatan tempur yang kuat, kita harus melakukan program reformasi militer yang memakan waktu lama dan mahal."
 CHI_ineffective_bureaucracy: "Birokrasi yang Tidak Efektif"
 CHI_ineffective_bureaucracy_desc: "Kekacauan perang saudara telah mengganggu terciptanya aparatur negara yang efektif. Lebih dari sepertiga rekrutmen yang tersedia tidak direkrut, hanya karena tidak ada yang tahu keberadaan mereka. Mereformasi proses ujian akan memastikan bahwa kita merekrut orang-orang yang kompeten."
 CHI_ineffective_bureaucracy_warlord: "Birokrasi yang Tidak Efektif"
 CHI_ineffective_bureaucracy_warlord_desc: "Kekacauan perang saudara telah mengganggu terciptanya aparatur negara yang efektif. Wilayah ini tidak dapat diperintah dengan baik sampai kita melakukan reformasi birokrasi, dengan merekrut orang-orang yang kompeten dan membagi jabatan gubernur dengan cara yang efektif."
 CHI_warlord_state_idea: "Negara Panglima Perang"
 CHI_warlord_state_idea_desc: "Negara kita jauh dari definisi kata. Ini adalah wilayah dan masyarakat yang menjalani kehidupan sehari-hari, di bawah perlindungan tentara independen yang tidak bersumpah setia kepada negara mana pun. Hal ini menyebabkan sangat sedikit hal yang dapat kita lakukan sebagai pemerintah, namun hal ini juga mempunyai keuntungan."
 CHI_warlord_state_idea_tt: "Semangat ini hilang setelah selesainya salah satu fokus §YPerebutan Kekuasaan§!, §YPeristiwa Yan'an§! dan §YMemproklamirkan Pemerintahan Rival§!"
 CHI_incompetent_officers: "Petugas yang tidak kompeten"
 CHI_incompetent_officers_desc: "Perwira kami belum mampu menangani perang modern. Pelajaran yang sulit harus diambil sebelum mereka benar-benar setara dengan rekan-rekan mereka di negara lain. Mendidik mereka akan menjadi bagian dari program reformasi militer yang lebih besar."
 CHI_hyper_inflation_none: "Perekonomian Stabil"
 CHI_hyper_inflation_none_desc: "Perekonomian tidak menunjukkan tanda-tanda masalah."
 CHI_hyper_inflation_1: "Inflasi Rendah"
 CHI_hyper_inflation_1_desc: "Ekonom kami telah memperhatikan sedikit peningkatan inflasi. Kita harus memperhatikan hal itu."
 CHI_hyper_inflation_2: "Inflasi Sedang"
 CHI_hyper_inflation_2_desc: "Inflasi mulai mempengaruhi perekonomian secara signifikan. Kita harus mempertimbangkan tindakan balasan sebelum keadaan menjadi tidak terkendali."
 CHI_hyper_inflation_3: "Inflasi Besar"
 CHI_hyper_inflation_3_desc: "Nilai uang yang dikeluarkan pemerintah semakin berkurang, daya beli menurun dan beberapa barang hanya tersedia bagi orang-orang yang memiliki koneksi yang tepat."
 CHI_hyper_inflation_4: "Hiper Inflasi"
 CHI_hyper_inflation_4_desc: "Nilai mata uang kita sedang menguap. Harga naik drastis dari hari ke hari. Kita harus segera mengambil tindakan balasan sebelum kita benar-benar mengalami kehancuran."
 CHI_hyper_inflation_5: "Keruntuhan Ekonomi"
 CHI_hyper_inflation_5_desc: "Sistem mata uang kita telah runtuh sepenuhnya. Di sebagian besar negara, perdagangan telah kembali ke sistem barter. Kemiskinan tersebar luas. Karyawan kami menggunakan uang kertas yang kami gunakan untuk membayar mereka untuk memanaskan rumah mereka. Program reformasi keuangan dan ekonomi yang agresif diperlukan untuk mengatasi situasi ini."
