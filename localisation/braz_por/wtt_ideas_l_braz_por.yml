 MAN_low_legitimacy_1_desc: "Kaisar Puyi adalah keturunan sah kaisar Qing yang memerintah Tiongkok selama tiga ratus tahun. Revolusi Xinhai yang menggulingkannya pada tahun 1911 sangat populer, karena pemerintahan Qing tidak berdaya melawan orang asing yang mencuri tanah Tiongkok dan gubernur regional yang menjadikan diri mereka sebagai panglima perang. Pelantikan Kaisar Puyi oleh Jepang sebagai Kaisar Manchukuo belum diterima oleh masyarakat Manchuria, apalagi seluruh Tiongkok.\n\nKita harus menetapkan kemerdekaan Kaisar dari Jepang untuk menggalang bangsa di bawah kepemimpinannya."
 MAN_banditry: "Bandit"
 MAN_banditry_desc: "Kita terlibat dalam peperangan berintensitas rendah melawan partisan, pembelot, dan teroris republik. Kita harus fokus menenangkan pedesaan untuk memburu para bandit ini."
 MAN_kwantung_veto: "Veto Kwantung"
 MAN_kwantung_veto_desc: "Setelah Jepang merebut Dalian dari Rusia pada tahun 1905, garnisun Kwantung (Kantō dalam bahasa Jepang) yang ditempatkan di sana menjadi terpolitisasi, dan para jenderal ekspansionis mengambil inisiatif untuk merebut lebih banyak tanah Tiongkok untuk Jepang. Puncaknya adalah Insiden Mukden pada tahun 1932, ketika Kekaisaran Manchukuo terpecah dari para panglima perang kecil di timur laut. Tentara Kwantung terus mendominasi wilayah tersebut dan menempatkan kepentingan jenderal mereka di atas kebutuhan Manchukuo.\n\nKami hanya akan menyelesaikan masalah ini dengan membuat tentara Jepang mengakui kami setara, atau dengan mengusir mereka secara paksa."
 MAN_mamc_light: "Perusahaan Manufaktur Pesawat Manchuria - Divisi Pesawat Tempur"
