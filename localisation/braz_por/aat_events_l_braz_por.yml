 denmark_expansion_event.300.t: "[FROM.GetNameDefCap] Menawarkan Hak Sumber Daya"
 denmark_expansion_event.300.desc: "Pemerintah [DEN.GetAdjective] hari ini telah mendekati kami dengan tawaran hak sumber daya atas wilayah $STATE_666$ yang baru mereka taklukkan. Daerah yang dimaksud kaya akan kekayaan mineral. Mungkin ini tawaran yang patut dipertimbangkan?"
 denmark_expansion_event.300.a: "Kami menerima proposal murah hati ini!"
 denmark_expansion_event.300.b: "Kami tidak memerlukan hal ini."
 denmark_expansion_event.301.t: "[FROM.GetNameDefCap] Menerima Tawaran Kami untuk Hak Sumber Daya"
 denmark_expansion_event.301.desc: "[FROM.GetNameDefCap] telah dengan baik hati menerima tawaran kami mengenai sumber daya [SWE.GetAdjective] yang baru diperoleh. Mungkin ini berarti kedua negara kita dapat memiliki hubungan yang positif di masa depan."
 denmark_expansion_event.301.a: "Luar biasa!"
 denmark_expansion_event.302.t: "[FROM.GetNameDefCap] Menolak Tawaran Kami untuk Hak Sumber Daya"
 denmark_expansion_event.302.desc: "Sayangnya, [FROM.GetNameDef] telah menolak tawaran sumber daya [SWE.GetAdjective] kami. Mungkin lebih baik kita melakukan negosiasi di tempat lain?"
 denmark_expansion_event.302.a: "Kasar sekali."
 denmark_expansion_event.400.t: "Pertanyaan tentang Netralitas"
 denmark_expansion_event.400.desc: "Selama bertahun-tahun, [ROOT.GetNameDef] secara keseluruhan tetap netral dalam banyak konflik yang melanda dunia. Namun ketika ketegangan kembali meningkat di Eropa, kita akhirnya harus mempertanyakan apa artinya bersikap netral. Skandinavia Raya dan Laut Baltik telah menjadi titik fokus bagi negara kita selama beberapa abad terakhir, dan sangat penting bagi kita untuk memutuskan bagaimana kita ingin melanjutkan hubungan kita dengan mereka di masa depan."
 denmark_expansion_event.400.a: "Sekarang mereka tidak lagi fasis, kita bisa memihak [GER.GetNameDef]."
 denmark_expansion_event.400.b: "Mari kita bentuk faksi kita sendiri dan undang yang lain ke dalamnya."
 denmark_expansion_event.400.c: "Mungkin yang terbaik adalah kita menghindari hal ini untuk saat ini..."
 denmark_expansion_event.401.t: "[FROM.GetNameDefCap] Mencari Aliansi"
 denmark_expansion_event.401.desc: "[FROM.GetNameDefCap] tetap netral selama Perang Besar dan tetap seperti itu selama bertahun-tahun setelahnya, namun pagi ini kami menerima delegasi [FROM.GetAdjective] Denmark yang dengan tegas mengindikasikan bahwa mereka sedang mempertimbangkan untuk meninggalkan pendirian ini. Ini bisa menjadi saat yang tepat untuk mengajak mereka bergabung dengan kita."
 denmark_expansion_event.500.t: "Tawaran Aliansi"
 denmark_expansion_event.500.desc: "Dalam upaya untuk berdiri dalam solidaritas serta memberikan keamanan kepada negara-negara kecil di Eropa, [FROM.GetNameDef] telah mendekati kami dengan tawaran aliansi. Maukah kita menyelaraskan diri dengan teman [FROM.GetAdjective] kita? Atau lebih baik kita berdiri sendiri?"
 denmark_expansion_event.500.a: "Kami akan bergabung dengan [FROM.GetNameDef]!"
 denmark_expansion_event.500.b: "Kita tidak memerlukan aliansi saat ini."
 denmark_expansion_event.501.t: "[DEN.GetNameDefCap] Mendapatkan Sekutu"
 denmark_expansion_event.501.desc: "[FROM.GetNameDefCap] telah setuju untuk menerima tawaran aliansi kami dan telah secara resmi menandatangani deklarasi mereka. Mari kita berdiri bersama melawan badai dan memastikan keamanan satu sama lain di tahun-tahun mendatang."
 denmark_expansion_event.501.a: "Luar biasa!"
 denmark_expansion_event.502.t: "[FROM.GetNameDefCap] Menolak Aliansi"
 denmark_expansion_event.502.desc: "Sayangnya, [FROM.GetNameDef] telah menolak tawaran aliansi kami. Tampaknya jaminan keamanan bersama bukanlah kepentingan terbaik mereka."
 denmark_expansion_event.502.a: "Sangat disayangkan."
 denmark_expansion_event.600.t: "[FROM.GetNameDefCap] Meminta Perjanjian Penelitian"
 denmark_expansion_event.600.desc: "Untuk meningkatkan semangat kerja sama kedua negara, pemerintah [FROM.GetAdjective] telah meminta agar kita mengadakan perjanjian penelitian sehingga kita dapat saling berbagi kehebatan teknologi."
 denmark_expansion_event.600.a: "Terima. Ini hanya akan membantu kami berdua tumbuh lebih kuat."
 denmark_expansion_event.600.b: "Kami tidak punya waktu untuk ini."
 denmark_expansion_event.601.t: "[FROM.GetNameDefCap] Bergabung dengan Perjanjian Penelitian Kami"
 denmark_expansion_event.601.desc: "Berita bagus! [FROM.GetNameDefCap] telah setuju untuk mengikuti program berbagi teknologi kooperatif dengan kami. Artinya, kita akan memiliki akses terhadap kemajuan teknologi mereka dan tentunya akan membantu kita dalam menyusun rencana masa depan negara ini."
 denmark_expansion_event.601.a: "Kita berdiri lebih kuat bersama-sama!"
 denmark_expansion_event.602.t: "[FROM.GetNameDefCap] Telah Menolak Usulan Kami"
 denmark_expansion_event.602.desc: "Terlepas dari upaya terbaik kami, pemerintah [FROM.GetAdjective] telah memutuskan untuk merahasiakan teknologinya. Hal ini sangat disayangkan, karena bersama-sama kita bisa mengembangkan kemampuan teknologi kita lebih jauh dari kemampuan kita saat ini."
 denmark_expansion_event.602.a: "Ini sangat disayangkan..."
 denmark_expansion_event.700.t: "[FROM.GetAdjective] Gangguan"
 denmark_expansion_event.700.desc: "Kami telah menemukan bukti akal-akalan [FROM.GetAdjective] di [ROOT.GetNameDef] yang mencoba mempengaruhi opini publik. Membiarkan Denmark melanjutkan kegiatan ini akan berdampak buruk bagi kami."
 denmark_expansion_event.701.t: "[FROM.GetNameDefCap] Menggagalkan Rencana Kami"
 denmark_expansion_event.701.desc: "[FROM.GetAdjective] telah menggagalkan rencana kami untuk mempengaruhi opini publik agar lebih ramah terhadap tujuan kami."
 denmark_expansion_event.800.t: "[FROM.GetNameDefCap] Menawarkan Perlindungan"
 denmark_expansion_event.800.desc: "Delegasi [FROM.GetAdjective] telah mendekati kami, menawarkan seluruh kemampuan militer mereka untuk melindungi kami. Yang mereka minta sebagai balasannya hanyalah kita bertekuk lutut..."
 denmark_expansion_event.801.t: "[FROM.GetNameDefCap] Menerima Perlindungan Kami"
 denmark_expansion_event.801.desc: "Kami telah menerima jawaban dari pemerintah [FROM.GetAdjective] mengenai tawaran kami untuk melindungi mereka dengan baik, dan mereka dengan senang hati menerima perlindungan penuh kami!"
 denmark_expansion_event.802.t: "[FROM.GetNameDefCap] Menolak Perlindungan Kami"
 denmark_expansion_event.802.desc: "Kami telah menerima jawaban dari pemerintah [FROM.GetAdjective] mengenai tawaran kami untuk melindungi mereka dengan baik, dan sayangnya mereka menolak untuk bertekuk lutut. Pada waktunya mereka akan melihat betapa bodohnya kesalahan ini."
 #Fascist Events
 denmark_fascist_event.1.t: "[FROM.GetNameDefCap] Mencari Dukungan Kami"
 denmark_fascist_event.1.desc: "Pagi ini, kami menyambut delegasi dari partai fasis [FROM.GetAdjective] yang meminta dukungan kami dalam upaya mereka untuk meraih kekuasaan di negara mereka. Jika kita memberi mereka bantuan, maka itu berarti negara lain bisa menjadi sekutu yang layak bagi perjuangan kita."
 denmark_fascist_event.1.a: "Kami akan mendukung kebangkitan mereka ke tampuk kekuasaan!"
 denmark_fascist_event.1.b: "Kami memiliki kekhawatiran yang lebih besar saat ini."
 denmark_fascist_event.2.t: "[FROM.GetNameDefCap] Mengirimkan Dukungannya"
 denmark_fascist_event.2.desc: "Tampaknya permohonan kami untuk dukungan eksternal telah terjawab karena [FROM.GetNameDef] telah setuju untuk membantu upaya kami mengambil alih kekuasaan dalam pemerintahan. Ini adalah langkah ke arah yang benar bagi gerakan politik kita."
 denmark_fascist_event.2.a: "Tolong!"
 denmark_fascist_event.3.t: "[FROM.GetNameDefCap] Telah Menolak Permintaan Kami"
 denmark_fascist_event.3.desc: "Sayangnya, pemerintah [FROM.GetAdjective] menolak mengirimkan dukungan mereka dalam upaya kami untuk menggulingkan Rigsdagen. Saat ini, kita sekarang menghadapi potensi perlawanan bersenjata terhadap kudeta yang kita lakukan, sehingga membuat kita semakin sulit meraih kekuasaan. Ini sangat mengecewakan."
 denmark_fascist_event.3.a: "Fordomt!"
 denmark_fascist_event.3.b: "Kami akan menemukan jalan kami sendiri!"
 denmark_fascist_event.20.t: "[FROM.GetNameDefCap] Meminta Perjanjian Penelitian"
 denmark_fascist_event.20.desc: "Untuk meningkatkan semangat kerja sama kedua negara, pemerintah [FROM.GetAdjective] telah meminta agar kita mengadakan perjanjian penelitian sehingga kita dapat saling berbagi kehebatan teknologi."
 denmark_fascist_event.20.a: "Terima. Ini hanya akan membantu kami berdua tumbuh lebih kuat."
 denmark_fascist_event.20.b: "Kami tidak punya waktu untuk ini."
 denmark_fascist_event.21.t: "[FROM.GetNameDefCap] Telah Menerima Proposal Kami"
 denmark_fascist_event.21.desc: "Berita bagus! [FROM.GetNameDefCap] telah setuju untuk mengikuti program berbagi teknologi kooperatif dengan kami. Artinya, kita akan memiliki akses terhadap kemajuan teknologi mereka dan tentunya akan membantu kita dalam menyusun rencana masa depan negara ini."
 denmark_fascist_event.21.a: "Militer kita akan membuat iri orang-orang Nordik!"
 denmark_fascist_event.22.t: "[FROM.GetNameDefCap] Telah Menolak Usulan Kami"
 denmark_fascist_event.22.desc: "Meskipun kami berupaya sebaik mungkin untuk bersikap sopan, pemerintah [FROM.GetAdjective] telah memutuskan untuk merahasiakan teknologi mereka. Hal ini sangat disayangkan, karena bersama-sama kita bisa mengembangkan kemampuan teknologi kita lebih jauh dari kemampuan kita saat ini."
 denmark_fascist_event.22.a: "Baiklah kalau begitu, simpan rahasiamu."
#Trade Events
 denmark_trade_deal.1.t: "[FROM.GetNameDefCap] Menawarkan Proposal Dagang"
 denmark_trade_deal.1.desc: "Delegasi Denmark telah mendekati kami dengan proposal perdagangan. Denmark memproduksi sejumlah besar produk makanan, yang secara historis kami telah mengimpor cukup banyak. Baru-baru ini mereka mendevaluasi mata uang domestik mereka, Krone, sehingga produk pertanian mereka jauh lebih kompetitif. Perjanjian perdagangan ini dapat memberikan keuntungan besar bagi kita karena akan mengamankan pangan bagi penduduk kita dan memperkuat jalur pasokan kita."
 denmark_trade_deal.1.a: "Ini bisa bermanfaat"
 denmark_trade_deal.1.b: "Kami tidak membutuhkan produk Denmark"
 denmark_trade_deal.2.t: "[FROM.GetNameDefCap] Menerima Proposal Perdagangan kami"
 denmark_trade_deal.2.desc: "Delegasi perdagangan kami telah kembali dari [FROM.GetName] dengan hasil yang positif! [FROM.GetAdjective] telah menandatangani usulan perjanjian perdagangan, yang akan memperkuat sektor pertanian kita dan menciptakan lapangan kerja dan peluang baru."
 denmark_trade_deal.2.a: "Keputusan yang bagus untuk kedua belah pihak!"
 denmark_trade_deal.3.t: "[FROM.GetNameDefCap] Menolak Proposal Perdagangan kami"
 denmark_trade_deal.3.desc: "Delegasi perdagangan kami kembali dari [FROM.GetName] dengan kecewa. Tampaknya [FROM.GetAdjective] tidak dapat dibuat untuk melihat manfaat dari proposal perdagangan kami - meskipun jumlahnya banyak. Hal ini akan menjadi kemunduran bagi sektor pertanian, namun tidak ada yang tidak dapat kita atasi."
 denmark_trade_deal.3.a: "Biarkan mereka kelaparan!"
 denmark_trade_deal.4.t: "Permintaan untuk Memperluas Kesepakatan Dagang"
 denmark_trade_deal.4.desc: "[FROM.GetLeader] telah mengirimkan delegasi perdagangan kepada kami, meminta untuk memperluas perjanjian perdagangan kami yang sudah ada untuk produk pertanian. Tampaknya mereka tidak bisa mendapatkan cukup hasil bumi kita. Memperluas kesepakatan ini akan menciptakan lebih banyak lapangan kerja dan semakin memperkuat petani kita."
 denmark_trade_deal.4.a: "Usulan yang bagus!"
 denmark_trade_deal.4.b: "Kami sudah memiliki apa yang kami butuhkan"
 denmark_trade_deal.5.desc: "Delegasi perdagangan kami telah kembali dari [FROM.DetName] dengan berita yang sangat bagus! Pemimpin delegasi mengatakan kepada kami bahwa [FROM.GetLeader] sangat ingin menandatangani proposal perdagangan kami untuk memperluas perjanjian."
 denmark_trade_deal.6.desc: "Delegasi perdagangan kami telah kembali dari [FROM.DetName] dengan berita yang meresahkan. Pemimpin delegasi mengatakan kepada kami bahwa [FROM.GetLeader] cukup meremehkan perluasan perjanjian perdagangan yang sudah ada dan tidak dapat melihat manfaat dari penguatan ikatan antar negara."
 denmark_trade_deal.6.a: "Kesempatan yang sia-sia!"
 denmark_trade_deal.7.t: "[FROM.GetNameDefCap] Membatalkan Perjanjian Dagang"
 denmark_trade_deal.7.desc: "[ROOT.GetLeader] mendapat telegram pribadi dari [FROM.GetLeader] yang menginformasikan kepada kami bahwa perjanjian perdagangan pertanian antara kedua negara akan dihentikan. Tidak ada penjelasan yang diberikan, membuat semua orang menebak-nebak arti di balik keputusan mendadak ini."
 denmark_trade_deal.7.a: "Kalau begitu, lebih banyak lagi untuk kita!"
 denmark_trade_deal.7.b: "Kami akan mengelola tanpa produk mereka"
 denmark_trade_deal.8.t: "[GetCanceledTradeTitle]"
 denmark_trade_deal.8.t_subjugation_cancelation: "Pekerjaan Mengganggu Perdagangan Denmark"
 denmark_trade_deal.8.t_war_cancelation_partner: "Perang Mengganggu Perdagangan Denmark"
 denmark_trade_deal.8.t_war_cancelation_denmark: "Perang Mengganggu [FROM.GetAdjective] Perdagangan"
 denmark_trade_deal.8.desc: "[GetCanceledTradeDesc]"
 denmark_trade_deal.8.desc_subjugation_cancelation: "Semua perdagangan dengan hasil bumi Denmark telah terhenti karena invasi [?DEN.DEN_overlord_nation.GetAdjective] dan penaklukan [DEN.GetNameDef]."
 denmark_trade_deal.8.desc_war_cancelation_partner: "Kesepakatan perdagangan dengan [DEN.GetNameDef] telah terhenti karena permusuhan baru-baru ini antara negara kita."
 denmark_trade_deal.8.desc_war_cancelation_denmark: "Kesepakatan perdagangan dengan [FROM.GetNameDef] telah terhenti karena permusuhan baru-baru ini antara negara kita."
 denmark_trade_deal.8.a: "Peristiwa Malang"
 denmark_trade_deal.8.b: "Bagaimanapun, kesepakatan itu telah berjalan dengan baik"
 denmark_trade_deal.8.c: "Mereka tidak layak mendapatkan hasil kita!"
 denmark_events.1.t: "Akhir Tahun Krisis"
 denmark_events.1.desc: "Akhirnya, setelah bertahun-tahun mengalami kesulitan ekonomi, penderitaan akibat Depresi Besar akhirnya sudah berlalu. Selama tahun-tahun krisis, kami bekerja keras untuk menstabilkan perekonomian [DEN.GetAdjective] dan mengimbangi kerusakan yang ditimbulkan oleh krisis tersebut terhadap negara kami."
 denmark_events.1.a: "Kami sedang menuju ke arah yang benar"
 DEN_end_of_crisis_consumer_goods_modifier_tt: "$DEN_modify_industrial_capability_dynamic_modifier$\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10,0%§!"
 denmark_events.2.t: "Masyarakat Merasa Aman"
 denmark_events.2.desc: "Sejak kami berupaya menyalurkan dana untuk memperkuat perbatasan kami, kami telah menerima laporan dari masyarakat bahwa mereka mulai merasa lebih aman, terutama sehubungan dengan badai yang semakin meningkat di Eropa. Semoga pertahanan ini dapat menahan siapa pun yang berencana menduduki [DEN.GetNameDef] di masa depan."
 denmark_events.2.a: "Keamanan di atas segalanya"
 denmark_events.100.t: "Raja Denmark Mencari Perlindungan!"
 denmark_events.100.desc: "Setelah revolusi total yang melanda [DEN.GetNameDef], kami menerima kabar bahwa Raja Denmark dan keluarganya mencari perlindungan di negara kami. Bukan keputusan yang mudah untuk menjadi tuan rumah bagi raja yang diasingkan, dan karena itu kita harus mempertimbangkan pilihan kita sebelum mengambil keputusan penting. Akankah kita membantu Raja Denmark? Atau akankah kita mengirimnya ke tempat lain?"
 denmark_events.100.a: "Terima dia, kita bisa bekerja untuk memulihkan kerajaannya."
 denmark_events.100.b: "Kami tidak memiliki cinta pada raja di sini."
 denmark_events.200.t: "Thorvald Stauning Meninggal"
 denmark_events.200.desc: "Politisi terkemuka Thorvald Stauning telah meninggal dunia. Ia menjabat sebagai Perdana Menteri Denmark selama beberapa masa jabatan dan dikagumi oleh banyak orang. Menjelang akhir hayatnya, ia semakin khawatir tentang masa depan sosial demokrasi di Eropa."
 denmark_events.200.a: "Baringkan dia untuk beristirahat"
 denmark_events.201.t: "Raja Kristian X Meninggal"
 denmark_events.201.desc: "Raja Kristian X, yang memerintah rakyat Denmark selama tiga puluh lima tahun dan membimbing negara itu melewati masa-masa paling bergejolak di Eropa, meninggal dunia dengan tenang tadi malam. Ia digantikan oleh putranya, Frederik IX."
 denmark_events.201.a: "Hidup Raja"
 denmark_events.300.t: "Perusahaan Baru Didirikan"
 denmark_events.300.desc: "Kami telah berhasil membangun kembali perekonomian kami dan perusahaan-perusahaan baru didirikan hampir setiap hari dan negara ini menjadi makmur. Pergeseran teknologi juga terjadi ketika beberapa perusahaan mulai bereksperimen dengan apa yang dapat mereka lakukan terhadap plastik."
 denmark_events.300.a: "Dewa Kaki"
 denmark_events.666.t: "Denmark Raya Bangkit"
 denmark_events.666.desc: "Kita telah menjalani kehidupan yang semakin memudar untuk waktu yang lama, percaya bahwa hari-hari terbesar kita telah berlalu.  Kami mengabaikan impian apa pun tentang kehebatan tanpa berpikir dua kali - namun tidak lebih. Kita sedang menghadapi Zaman Keemasan baru di hadapan kita! Kekuatan dan pengaruh kami tumbuh dari hari ke hari, dan waktunya telah tiba untuk memproklamirkan Denmark Raya."
 denmark_events.666.a: "Biarkan dunia menikmati kemuliaan kita!"
 denmark_events.666.b: "Itu sepertinya agak berlebihan..."
  # Iceland
 iceland_events.1.t: "Denmark Diserang"
 iceland_events.1.desc: "Pasukan [?ICE.overlord_attacker.GetAdjective] telah menyerang Denmark. [ROOT.getName] telah mengeluarkan pernyataan netralitas yang diharapkan dapat dihormati oleh semua pihak.\n$ICE_sveinn_bjornsson$ telah dinyatakan sebagai bupati tanpa adanya raja, dan secara efektif telah mengambil alih politik luar negeri [ROOT.GetName]. Tentu saja hal ini hanya dianggap sebagai tindakan sementara, sampai keadaan menjadi stabil dan dunia menjadi lebih damai, namun untuk saat ini [ROOT.GetName] bertindak sebagai negara yang berdaulat dalam segala aspek dunia."
 iceland_events.1.a: "Kita lihat saja soal sementara"
  # News Events
 aat_news.1.t: "Islandia Menyatakan Netralitas"
 aat_news.1.desc: "Althing Islandia telah mengeluarkan pernyataan yang menyatakan netralitas Islandia dalam konflik antara Denmark dan [?ICE.overlord_attacker.GetName].\nParlemen juga mendeklarasikan $ICE_sveinn_bjornsson$ sebagai bupati jika tidak ada Raja, dan $ICE_sveinn_bjornsson$ akan mengatur kebijakan luar negeri Islandia. Pernyataan tersebut menunjukkan bahwa ini adalah tindakan sementara, dan hubungan sebelum perang dengan Denmark akan dipulihkan kembali setelah konflik selesai. Namun, hingga saat ini, Islandia secara de facto sudah merdeka."
 aat_news.1.a: "Netralitas tidak menyelamatkan Denmark"
 aat_news.2.t: "[ICE.GetAdjective]-[USA.GetAdjective] Kerjasama"
 aat_news.2.desc: "Dalam langkah yang agak mengejutkan, pemerintah [USA.GetAdjective] telah menyatakan [ICE.GetName] berada dalam lingkup kepentingan mereka, dan atas permintaan dari pemerintah [ICE.GetAdjective] telah setuju untuk mengerahkan pasukan untuk melindungi [ICE.GetName]. Semua politik luar negeri Islandia akan dikelola oleh pemerintah [USA.GetAdjective] mulai saat ini, mengubah [ICE.GetName] menjadi negara boneka [USA.GetAdjective] secara de facto."
 aat_news.2.a: "Langkah yang menarik"
 iceland_events.2.t: "[FROM.GetName] Meminta [ROOT.GetAdjective] Perlindungan"
 iceland_events.2.desc: "Duta Besar [ICE.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName] telah meminta kami mengirimkan pasukan ke [FROM.GetName]. Sebenarnya mereka meminta perlindungan [ROOT.GetAdjective] terhadap kemungkinan invasi. Mereka menawarkan untuk menyerahkan pengelolaan politik luar negeri mereka kepada kami sebagai imbalan atas perlindungan ini."
 iceland_events.2.a: "Peluang Besar"
 iceland_events.2.b: "Tidak, mereka harus mengatasi masalahnya sendiri"
 iceland_events.2.c: "Jangan merusak hubungan [ROOT.GetAdjective]-[FROM.OVERLORD.GetAdjective]"
 iceland_events.3.t: "[FROM.GetNameDefCap] Menerima"
 iceland_events.3.desc: "Pemerintah [FROM.GetAdjective] telah menerima permintaan kami agar mereka mengambil alih pertahanan [ROOT.GetName]. Mudah-mudahan negara kita mendapat manfaat dari hal ini, tidak hanya dengan tidak mengambil risiko invasi, namun juga secara finansial melalui dampak komitmen [FROm.GetAdjective] terhadap pulau tersebut."
 iceland_events.3.a: "Kami mungkin aman untuk saat ini"
 iceland_events.4.t: "[FROM.GetNameDefCap] Menolak"
 iceland_events.4.desc: "Sayangnya, [FROM.GetLeader] tidak mau membela [ROOT.GetName]. Mengutip fakta bahwa [FROM.GetNameDef] sudah cukup banyak masalahnya sebagai alasan utama, [FROM.GetLeader] tidak berani menyatakan [FROM.GetNameDef] sebagai pelindung [ROOT.GetNameDef]."
 iceland_events.4.a: "Kita harus mencari solusi lain."
 iceland_events.5.t: "Perang Spanyol"
 iceland_events.5.desc: "Pecahnya permusuhan di Spanyol telah menurunkan ekspor Islandia ke wilayah tersebut secara drastis. Negara ini dulunya merupakan importir utama ikan kering Islandia. Hal ini sangat disayangkan tidak hanya bagi industri perikanan, namun juga bagi seluruh Islandia, karena sektor ini merupakan salah satu dari sedikit sektor yang mulai pulih setelah perang dan depresi besar."
 iceland_events.5.a: "Itu sebuah Pertanda"
 iceland_events.5.b: "Akhir sudah dekat!"
 iceland_events.5.c: "Ekonomi, bodoh!"
 iceland_events.5.d: "Saya berharap saya hidup di masa yang lebih tercerahkan"
 iceland_events.6.t: "Mitra Setara"
 iceland_events.6.desc: "[FROM.GetLeader] telah membuat deklarasi resmi, yang menyatakan bahwa, karena [FROM.GetName] berperang bersama dengan Denmark, dan melakukan upaya mereka sendiri, tidak diperlukan lagi panduan Denmark mengenai kebijakan luar negeri - atau hal-hal lain terkait politik [FROM.GetAdjective]. Ini tentu saja merupakan deklarasi kemerdekaan secara de facto."
 iceland_events.6.a: "Sejujurnya, tidak banyak yang bisa kami lakukan untuk mengatasinya"
 iceland_events.6.b: "Kurang ajarnya, kami akan menangani mereka setelah perang ini selesai"
 iceland_events.7.t: "[FROM.GetName] Menerima Kemerdekaan kita"
 iceland_events.7.desc: "Terlepas dari beberapa keluhan yang dibuat di parlemen Denmark, deklarasi kami tentang kesetaraan dengan Denmark tidak mendapat tentangan nyata. Denmark memahami posisi kami, dan mengingat fakta bahwa kami berperang bersama, mereka menganggap kerja sama di masa depan lebih penting daripada institusi feodal lama dan kebanggaan nasionalis. Raja Christian telah turun tahta dari perannya sebagai Raja Islandia, seperti yang kami minta. Kita sekarang adalah negara yang berdaulat penuh. Namun, kita perlu memutuskan bagaimana menangani pertanyaan Monarki. Saat ini kita adalah Monarki tanpa Raja..."
 iceland_events.7.a: "Kita tidak membutuhkan seorang Raja"
 iceland_events.7.b: "Ada lebih banyak royalti di Denmark..."
 iceland_events.8.t: "Permintaan dari Islandia"
 iceland_events.8.desc: "Adik lelaki kami di lautan menyadari bahwa monarki tanpa Raja adalah burung yang aneh. Jadi mereka kini kembali kepada kami dengan permintaan agar salah satu Pangeran Kerajaan Denmark dinobatkan sebagai Raja Islandia. Sebagai tanda persahabatan di masa depan, kata mereka."
 iceland_events.8.a: "Sekali lagi - untuk pangeran Knud"
 iceland_events.8.b: "Menurutku itu bukan ide yang bagus"
 iceland_events.9.t: "Raja Denmark Sekali Lagi"
 iceland_events.9.desc: "Negosiasi kami dengan pengadilan [FROM.GetAdjective] telah membuahkan hasil. Pangeran Knud telah ditawari mahkota Islandia dan diterima."
 iceland_events.9.a: "Salam Raja Knud, penguasa [ROOT.GetName]!"
 iceland_events.9.b: "Hebat, kita perlu memastikan bahwa kekuatannya dibatasi"
 iceland_events.10.t: "Tidak Ada Keberuntungan dalam Negosiasi"
 iceland_events.10.desc: "Diskusi kami dengan pengadilan Denmark tidak membuahkan hasil. Mereka masih terluka karena [ROOT.GetName] tidak mau lagi menjadi subjek [DEN.GetName]. Mungkin ini saatnya untuk melanjutkan."
 iceland_events.10.a: "Kalau begitu, saya kira itu adalah sebuah republik"
 iceland_events.11.t: "[FROM.GetName] Kesal"
 iceland_events.11.desc: "Terlepas dari upaya terbaik kami, [FROM.GetName] menolak menerima kenyataan bahwa [ROOT.GetName] tidak lagi ingin diatur dari [FROM.Capital.GetCapitalVictoryPointName]. Mereka bahkan mengancam kami dengan penggunaan kekerasan. Namun, kemungkinan besar mereka tidak akan berhasil sekarang karena [ROOT.GetName] telah mulai membangun kekuatan pertahanan."
 iceland_events.11.a: "Jalan kita ke depan masih tetap"
 iceland_events.12.t: "[FROM.GetLeader] Menginginkan Kompensasi"
 iceland_events.12.desc: "[FROM.GetLeader] telah meminta kompensasi atas upaya [FROM.GetAdjective] untuk membantu [ROOT.GetName] selama bertahun-tahun, dan terutama selama masa-masa sulit baru-baru ini. Menurut [FROM.GetLeader], hal ini akan membantu [FROM.GetNameDef] tumbuh, dan mempertahankan kemampuannya untuk mendukung [ROOT.GetName] di masa depan, serta [FROM.GetName] berada pada posisi yang lebih baik untuk mempertahankan pulau-pulau ini."
 iceland_events.12.a: "Mereka dapat memiliki [101.GetName] dan [337.GetName]"
 iceland_events.12.b: "Tidak, mereka belum melakukan cukup banyak hal untuk mendapatkan ini"
 iceland_events.12.c: "Memberi mereka satu pulau mungkin tidak ada salahnya"
 iceland_events.13.t: "[101.GetName] dan [337.GetName] menjadi [ROOT.GetAdjective]"
 iceland_events.13.desc: "[FROM.GetLeader] sepenuhnya memahami dan mendukung permintaan kompensasi kami yang sah. [FROM.GetName] telah memutuskan untuk menyerahkan [101.GetName] dan [337.GetName] kepada [ROOT.GetName]. Mereka sepakat bahwa kita berada dalam posisi yang lebih baik untuk mempertahankan pulau-pulau tersebut, dan demi kepentingan semua orang, kita perlu menciptakan [ROOT.GetName] yang lebih kuat."
 iceland_events.13.a: "Kerajaan kita berkembang"
 iceland_events.14.t: "[FROM.GetLeader] Menolak"
 iceland_events.14.desc: "Sayangnya permintaan kompensasi kami yang sah dan rendah hati atas semua bantuan yang telah kami berikan [FROM.GetName] selama bertahun-tahun tidak didengarkan. [FROM.GetLeader] menolak memberikan apa pun kepada kami, meskipun hal tersebut adalah demi kepentingan terbaik [FROM.GetName]."
 iceland_events.14.a: "Kita harus mengambil milik kita dengan paksa"
 iceland_events.15.t: "Kompensasi dari [FROM.GetName]"
 iceland_events.15.desc: "Untungnya pemerintah [FROM.GetAdjective] memahami kebutuhan kami, dan menyetujui permintaan kami untuk kompensasi teritorial. [ROOT.GetName] tentu saja perlu membayar sejumlah kecil uang sebagai kompensasi [FROM.GetName] tetapi saat ini hal tersebut tidak terlalu menjadi perhatian."
 iceland_events.15.a: "Ini adalah hari yang membanggakan bagi [ROOT.GetName]"
 iceland_events.17.t: "[FROM.GetNameDefCap] Menyatakan Kemerdekaan"
 iceland_events.17.desc_kingdom: "Parlemen [FROM.getAdjective] telah menyatakan hubungannya dengan Christian X batal dan batal. Mereka tidak lagi menganggap Raja Denmark sebagai Raja Islandia. Sebagai konsekuensinya mereka menyatakan bahwa Denmark tidak lagi mempunyai pengaruh apapun terhadap politik [FROM.getName] baik internal maupun asing."
 iceland_events.17.desc_generic: "Parlemen [FROM.getAdjective] telah mendeklarasikan [FROM.GetNameDef] sebagai negara yang sepenuhnya merdeka dan berdaulat, tanpa ikatan apa pun dengan negara lain. Artinya mereka sudah resmi putus dengan kita dan secara sepihak mendeklarasikan kemerdekaannya."
 iceland_events.17.a: "Kami memiliki kekhawatiran yang lebih mendesak"
 iceland_events.17.b: "Kami akan menangani ini ketika waktunya tepat"
 iceland_events.18.t: "[FROM.GetNameDefCap] Menerima [ROOT.GetAdjective] Kemerdekaan"
 iceland_events.18.desc: "[FROM.GetNameDefCap] hanya mengeluarkan protes kecil. Mereka tidak berani memprovokasi orang [ROOT.GetAdjective] lebih jauh. [ROOT.GetNameDefCap] kini dapat fokus pada isu-isu yang lebih mendesak dibandingkan kaitannya dengan [FROM.GetName]."
 iceland_events.18.a: "Bagus"
 iceland_events.19.t: "[FROM.GetNameDefCap] Menolak Menerima Kemerdekaan [ROOT.GetAdjective]"
 iceland_events.19.desc: "Para penghasut perang [FROM.GetNameDefCap] telah memutuskan untuk tidak meratifikasi perjanjian yang memberi kita kemerdekaan yang diberikan kepada mereka. Sebaliknya mereka bersikeras bahwa [ROOT.GetName] adalah bagian dari [FROM.GetName], dan mengancam akan membangun kembali kesetiaan dengan menggunakan kekerasan. Kita sekarang harus bersiap menghadapi badai yang akan datang."
 iceland_events.19.a: "Mereka bisa mencoba"
 iceland_events.20.t: "[ICE.GetName] Menuntut kami Mengembalikan Greenland"
 iceland_events.20.desc: "[ICE.GetLeader] dari [ICE.GetNameDef] telah mengumumkan pembentukan Kekaisaran Laut Utara baru yang berbasis di sekitar perbatasan Viking lama. Karena Greenland adalah bagian dari wilayah ini, kita sekarang diminta untuk dengan baik hati menyerahkan pulau itu kepada mereka."
 iceland_events.20.a: "Tidak ada gunanya diperebutkan..."
 iceland_events.20.b: "Mereka tidak mempunyai alasan yang kuat untuk menuntutnya!"
 iceland_events.21.t: "Greenland Telah Kembali!"
 iceland_events.21.desc: "Para pemimpin yang lemah di [FROM.GetNameDef] telah memutuskan untuk memberi kita kendali atas Greenland, karena mereka tampaknya tidak ingin mengambil risiko konflik dengan kita. Ini membuktikan bahwa masa kejayaan kita telah tiba lagi!"
 iceland_events.21.a: "Ini adalah berita bagus"
 iceland_events.22.t: "[FROM.GetName] Tetap Menantang"
 iceland_events.22.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menentang masalah Greenland. Karena mereka tampaknya menginginkan kehancuran dengan pedang kita, mereka akan mendapatkan apa yang mereka inginkan."
 iceland_events.22.a: "Mereka akan binasa!"
 iceland_events.23.t: "[ICE.GetName] Mendeklarasikan dirinya sebagai \"Pelindung Lintasan Laut Utara\""
 iceland_events.23.desc: "[ICE.GetLeader] telah secara terbuka mendeklarasikan [ICE.GetNameDef] sebagai pelindung Laut Utara. [ICE.GetNameDefCap] kemudian akan bertindak sebagai penjamin keselamatan penduduk pulau-pulau di Laut Utara.\nOleh karena itu, menurut [ICE.GetLeader], [ROOT.GetNameDef] harus menyerahkan kendali atas harta benda kita di Laut Utara kepada [ICE.GetName]."
 iceland_events.23.a: "Tidak ada gunanya memperebutkan beberapa pulau tandus"
 iceland_events.23.b: "Tidak akan ada hal seperti itu"
 iceland_events.24.t: "[FROM.GetNameDefCap] Menyerah pada Permintaan kami"
 iceland_events.24.desc: "Para pemimpin yang lemah di [FROM.GetNameDef] telah memutuskan untuk memberi kami kendali atas kepemilikan mereka di Laut Utara, karena mereka tampaknya tidak ingin mengambil risiko konflik dengan kami."
 iceland_events.24.a: "Kerajaan Kita Tumbuh"
 iceland_events.25.t: "[FROM.GetName] Tetap Menantang"
 iceland_events.25.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menolak menyerahkan harta benda mereka di Laut Utara kepada kami. Mereka mengejek permintaan kami dan mengatakan bahwa jika kami menginginkan pulau-pulau tersebut, kami harus merebutnya dengan paksa."
 iceland_events.25.a: "Dengan paksa maka itu harus terjadi"
 iceland_events.45.t: "Pemilihan Presiden"
 iceland_events.45.desc: "Waktunya telah tiba bagi [ROOT.GetName] untuk melepaskan belenggu Monarki. Jalan ke depan ada di tangan rakyat dan presiden yang dipilih oleh mereka."
 iceland_events.45.a: "$ICE_sveinn_bjornsson$ adalah pemimpin yang sempurna"
 iceland_events.45.b: "$ICE_hermann_jonasson$ telah memberikan pelayanan yang baik kepada negara di masa lalu"
 iceland_events.45.c: "$ICE_olafur_thors$ dapat membawa kita ke masa depan"
 iceland_events.45.d: "$ICE_brynjolfur_bjarnason$ lah yang mampu mempersatukan umat"
 iceland_events.45.e: "$ICE_gisli_sigurbjornsson$ akan membawa kejayaan bagi [ROOT.GetName]"
 iceland_events.26.t: "Kita Kehabisan Minyak!"
 iceland_events.26.desc: "Kilang lepas pantai kami telah melaporkan bahwa tidak ada lagi minyak yang dapat ditemukan di sekitar [ICE.GetName]. Mereka sudah kehabisan sumber daya, dan memperkirakan tidak akan ada lagi kantong minyak atau gas yang ditemukan di masa depan, dan melanjutkan operasi hanya akan membuang-buang sumber daya."
 iceland_events.26.a: "Ya, memang begitulah adanya..."
 ###############
 ### FINLAND ###
 ###############
 AAT_finland_motti.01.t: "[FROM.GetAdjective] Taktik Motti"
 AAT_finland_motti.01.desc: "Pasukan [FROM.GetAdjective] sudah mulai menerapkan taktik motti di area [FROM.FROM.GetName]. Taktik Motti adalah teknik menghancurkan di mana pasukan [FROM.GetAdjective] mengepung pasukan musuh dan memutus jalur suplai mereka, sehingga mereka rentan terhadap serangan. Hal ini membuat pasukan penyerang sangat rentan terhadap serangan [FROM.GetAdjective], dan kita harus mengambil tindakan cepat untuk mencegah mereka menguasai diri jika kita ingin menyerang Finlandia."
 AAT_finland_motti.01.a: "Tetap waspada dan bersiap untuk bertempur!"
 AAT_finland_motti_tt: "§RMulai sekarang, [FROM.GetNameDefCap] akan dapat mempersiapkan Taktik Motti di negara bagian inti lainnya.§!"
 AAT_finland_national_defense.01.t: "[FROM.FROM.GetAdjective] Tembolok Senjata di [?FIN_state_with_weapon_caches.GetName]"
 AAT_finland_national_defense.01.desc: "Badan intelijen kami melaporkan bahwa simpanan senjata Finlandia disembunyikan di [?FIN_state_with_weapon_caches.GetName]. Kita dapat memperkirakan operasi militer di sana akan terhambat secara signifikan, dan kita harus mewaspadai taktik yang lebih agresif yang dilakukan oleh perlawanan lokal. Bergantung pada keberhasilan operasi ini, kita mungkin menemukan kejutan serupa di negara bagian Finlandia lainnya."
 AAT_finland_national_defense.01.a: "Sebuah tindakan yang sia-sia."
 AAT_finland_national_defense.02.t: "[FIN.GetAdjective] Tembolok Senjata Disita di [FROM.FROM.GetName]"
 AAT_finland_national_defense.02.desc: "Menyusul laporan tentang tempat penyimpanan senjata Finlandia yang tersembunyi di [FROM.FROM.GetName], pasukan kami telah menyapu daerah tersebut. Mereka melaporkan menemukan tempat persembunyian yang terkubur di bawah bangunan, berlindung di pohon tumbang, dan tenggelam di danau yang dibungkus dalam kantong yang sudah diberi minyak. Kami telah menyita barang-barang yang kami temukan, dan kami yakin tidak akan ada lagi barang-barang tersebut, paling tidak dalam jumlah yang perlu kami pedulikan."
 AAT_finland_national_defense.02.a: "Berita bagus."
 AAT_finland_national_defense.02.b: "Bagus, tapi jangan ganggu saya dengan laporan cache lainnya."
 AAT_finland_national_defense.03.t: "[FROM.GetName] Menyita Cache Senjata kami di [FROM.FROM.FROM.GetName]"
 AAT_finland_national_defense.03.desc: "Meskipun kami berupaya semaksimal mungkin untuk menyembunyikan simpanan senjata kami dari musuh di [FROM.FROM.GetName], agen musuh telah berhasil menemukan dan menyitanya. Mungkin masih ada beberapa yang tersisa, namun jumlahnya tidak cukup besar untuk membuat perbedaan yang berarti di bidang ini."
 AAT_finland_national_defense.03.a: "Berita buruk!"
 AAT_finland_national_defense.03.b: "Ada hal-hal yang lebih penting yang harus kita tangani."
 FIN_weapon_caches_in_state_tt: "Cache Senjata akan dihapus setelah §Y4 tahun§! keberadaannya.\nBuka kunci kategori keputusan §Y$FIN_finnish_resistance_category$§!, memungkinkan kita untuk secara aktif mencari tempat penyimpanan senjata dan menyitanya."
 FIN_weapon_caches_seized_event_spam_tt: "Kami akan terus menerima kejadian tentang penyitaan gudang senjata di negara bagian Finlandia lainnya."
 FIN_weapon_caches_seized_event_no_spam_tt: "Kami TIDAK akan menerima lebih banyak peristiwa tentang penyitaan gudang senjata di negara bagian Finlandia lainnya."
 FIN_weapon_caches_seized_by_enemy_event_spam_tt: "Kami akan terus menerima kejadian tentang musuh yang menyita gudang senjata kami di negara bagian lain."
 FIN_weapon_caches_seized_by_enemy_event_no_spam_tt: "Kami TIDAK akan menerima lebih banyak kejadian tentang musuh yang menyita simpanan senjata kami di negara bagian lain."
 AAT_finland_misc_events.01.t: "Evakuasi Anak-anak"
 AAT_finland_misc_events.01.desc: "Ketika [GetFinnishWinterWarOrNot] mengamuk, pemerintah [ROOT.GetAdjective] mengambil keputusan sulit untuk mengevakuasi anak-anak bangsa kita ke [GetFinnishChildrenDestination] demi keselamatan mereka. Keputusan yang menyayat hati ini diambil mengingat bahaya yang terus-menerus dihadapi oleh warga sipil selama konflik.\n\nUpaya evakuasi merupakan upaya besar-besaran, dengan banyaknya keluarga yang terpisah dan anak-anak meninggalkan rumah mereka. Namun kita harus ingat bahwa keselamatan mereka adalah yang paling penting, dan kita harus melakukan segala daya kita untuk melindungi mereka dari bahaya.\n\nSaat masyarakat [ROOT.GetAdjective] menanggung kenyataan pahit perang, kita harus berpegang pada harapan dan keyakinan bahwa anak-anak kita akan aman dan terlindungi selama masa sulit ini. Jalan ke depan mungkin panjang dan menantang, namun kita harus bertahan dan berdiri teguh dalam menghadapi kesulitan."
 FIN_winter_war_name: "Perang Musim Dingin dengan [SOV.GetNameDef]"
 FIN_normal_war: "perang"
 FIN_children_destination_sweden: "[SWE.GetNameDef]"
 FIN_children_destination_norway: "[NOR.GetNameDef]"
 FIN_children_destination_denmark: "[DEN.GetNameDef]"
 FIN_children_destination_iceland: "[ICE.GetNameDef]"
 FIN_children_destination_other: "negara netral yang tidak terlibat dalam konflik militer"
 AAT_finland_misc_events.01.a: "Selamatkan anak-anak kita!"
 AAT_finland_misc_events.02.t: "Larangan Menari"
 AAT_finland_misc_events.02.desc: "Ketika perang terus berlanjut, semakin banyak politisi dan tokoh terkemuka lainnya yang mendorong pelarangan menari di depan umum sebagai upaya untuk menunjukkan rasa hormat dan solidaritas terhadap prajurit kita yang berjuang di garis depan.\n\nOrang-orang ini menganggap tidak pantas untuk menari pada saat krisis ini. Mereka mengatakan bahwa adalah tugas kita untuk mendukung pasukan kita dan menunjukkan komitmen kita terhadap upaya perang dengan menahan diri dari kegiatan-kegiatan tersebut, dan mengklaim bahwa kegagalan untuk melakukan hal tersebut akan berakibat pada denda atau bahkan hukuman penjara.\n\nNamun, banyak orang lain yang menyatakan rasa jijik mereka terhadap usulan tersebut, menyatakan bahwa di negara-negara lain bahkan menari dianjurkan untuk membantu orang-orang bertahan dalam kondisi perang yang keras."
 AAT_finland_misc_events.02.a: "Kita semua harus berkorban selama masa-masa sulit ini, tidak peduli betapa bodohnya hal itu."
 AAT_finland_misc_events.02.b: "Ini jelas-jelas bodoh."
 AAT_finland_misc_events.03.t: "[?FIN_faction_leader_recieving_resource_rights.GetAdjective] Bantuan Proyek Pembangunan"
 AAT_finland_misc_events.03.desc: "Investasi kami yang berkelanjutan pada infrastruktur ekstraksi mineral terus memberikan hasil yang semakin meningkat, namun kami berpikir bahwa kami bisa mendapatkan lebih banyak lagi jika kami memanfaatkan sumber daya dan keahlian dari negara-negara yang lebih besar.\n\nKita harus menghubungi [?FIN_faction_leader_recieving_resource_rights.GetNameDef] dan menawarkan kepada mereka bagian dari materi yang diperoleh jika mereka membantu kami dalam hal investasi dan spesialis untuk membawa operasi penambangan kami ke tingkat berikutnya. Dengan melakukan ini, kita berdua mendapatkan keuntungan."
 AAT_finland_misc_events.03.a: "Ya, kami harus menghubungi [?FIN_faction_leader_recieving_resource_rights.GetNameDef] untuk investasi lebih lanjut."
 AAT_finland_misc_events.03.b: "Tidak, kami tidak ingin terikat pada orang lain."
 AAT_finland_misc_events.03_tt: "Menambahkan +1"
 AAT_finland_misc_events.04.t: "Membayar Kembali Bantuan"
 AAT_finland_misc_events.04.desc: "Setelah putaran awal negosiasi kami dengan [?FIN_faction_leader_recieving_resource_rights.GetNameDef] berjalan dengan baik, kini mereka terhenti pada satu hal penting, yaitu, apa imbalan yang mereka dapatkan? [?FIN_faction_leader_recieving_resource_rights.GetNameDef] mengincar sejumlah perusahaan di seluruh negara kita, kita hanya perlu mengusulkan mana yang mereka dapatkan.\n\nKami dapat menawarkan bagian produksi tambang Makola di Oulu, menyediakan nikel dari tambang Petsamo, mengalihkan sebagian bahan mentah ke galangan kapal Turku kami, atau memberikan hak prospek di Lappi."
 AAT_finland_misc_events.04.a: "Mengalokasikan hak eksploitasi tambang di [929.GetName]."
 AAT_finland_misc_events.04.b: "Memberikan hak pemanfaatan nikel pada [722.GetName]."
 AAT_finland_misc_events.04.c: "Ubah rute hak bahan mentah di [926.GetName]."
 AAT_finland_misc_events.04.d: "Memberikan hak pencarian calon pelanggan di [148.GetName]."
 AAT_finland_misc_events.05.t: "[FROM.GetName] Memberi kami Hak Sumber Daya"
 AAT_finland_misc_events.05.desc: "Kabar baik! Beberapa perusahaan industri secara kolektif menginvestasikan uang, peralatan, dan tenaga ahli ke dalam sektor pertambangan [FROM.GetAdjective], dan investasi ini mulai memberikan keuntungan berupa hak eksploitasi. Kami telah diberikan sebagian dari produksi yang ditemukan di [?FROM.FIN_state_given_for_resource_rights.GetName].\n\nKita harus memanfaatkan sumber daya baru ini dengan sebaik-baiknya sesegera mungkin!"
 AAT_finland_misc_events.05.a: "Bagus"
 AAT_finland_misc_events.06.t: "[FROM.GetAdjective] Investasi Militer di [ROOT.GetName]"
 AAT_finland_misc_events.06.desc: "[FROM.GetName] menyadari bahwa semakin berkembang kawasan Nordik, semakin sejahtera masyarakat kita, dan semakin banyak manfaat yang kita peroleh dari pertahanan dan perdagangan bersama. Langkah pertama untuk mencapai impian ini adalah dengan meningkatkan kemampuan pertahanan kolektif kita untuk menangkis ancaman asing.\n\nSebagai hasilnya, [FROM.GetName] dengan murah hati menawarkan kepada kami peralatan industri dan spesialis untuk membantu meningkatkan produksi militer kami."
 AAT_finland_misc_events.06.a: "Kami akan memanfaatkan ini dengan baik!"
 AAT_finland_misc_events.07.t: "[FROM.GetAdjective] Program Penelitian dan Pengembangan"
 AAT_finland_misc_events.07.desc: "Di dunia yang semakin terperosok dalam kegelapan dan ketidakpastian, [FROM.GetName] telah beralih ke ilmu pengetahuan dan teknologi untuk menerangi jalan tersebut. Negara kecil ini telah mengalami kemajuan pesat dalam beberapa tahun terakhir, begitu pula kita. Mereka menyarankan agar kita menyatukan komunitas ilmiah dan berbagi apa yang kita ketahui, demi kemajuan kita semua. Marilah kita bersinar sebagai terang takdir agar orang lain bisa melewati kegelapan."
 AAT_finland_misc_events.07.a: "Inisiatif yang bagus!"
 AAT_finland_diplomacy.01.t: "[FROM.GetAdjective] Usulan Unifikasi"
 AAT_finland_diplomacy.01.desc: "Kami telah didekati oleh diplomat dari [FROM.GetNameDef], yang demi tujuan perlindungan dan kesejahteraan bersama, sedang membicarakan gagasan unifikasi nasional. Hal ini berarti menggabungkan pemerintah, militer, dan industri untuk membentuk front yang lebih kuat dan bersatu melawan pihak-pihak yang mungkin mengancam keamanan kita.\n\nMungkin ada manfaatnya jika kita bersatu di tengah ketidakstabilan internasional saat ini, namun pilihan ada di tangan kita."
 AAT_finland_diplomacy.01.a: "Kedengarannya ide yang bagus!"
 AAT_finland_diplomacy.01.b: "Kita bisa bekerja sama sambil menjaga otonomi kita."
 #I couldn't get option b to appear in testing
 AAT_finland_diplomacy.01.c: "Tidak tertarik."
 AAT_finland_diplomacy.02.t: "[FROM.GetAdjective]-[ROOT.GetAdjective] Persatuan"
 AAT_finland_diplomacy.02.desc: "Para diplomat kita yang berjaya telah kembali dari misi mereka ke [FROM.capital.GetCapitalVictoryPointName], dan membawa serta berita bahwa [FROM.GetName] melihat perlunya membentuk front yang lebih bersatu melawan saingan kita, dan oleh karena itu usulan kita untuk membentuk serikat pekerja telah diterima.\n\nPejabat pemerintah sudah dalam perjalanan ke ibu kota kita untuk membuat pengaturan demi kelancaran integrasi wilayah baru ini."
 AAT_finland_diplomacy.02.a: "Bersama-sama, kita lebih kuat!"
 AAT_finland_diplomacy.03.t: "[FROM.GetName] Bergabung [ROOT.GetFactionName]"
 AAT_finland_diplomacy.03.desc: "Para diplomat kami telah kembali dari misi mereka ke [FROM.GetName], dan meskipun kebutuhan akan front persatuan telah diakui, mereka tidak bersedia menyerahkan seluruh kedaulatan mereka untuk melakukan hal tersebut. Diskusi berjalan baik pada awalnya, tetapi mengingat sejarah perjuangan kemerdekaan [FROM.GetName], [GetDiplomacyDescriptionNiceNotNice]\n\nAlih-alih membentuk serikat pekerja, mereka memutuskan untuk bergabung dengan faksi kami sebagai negara merdeka."
 FIN_not_nice_desc: "jelas mereka belum belajar dari kesalahan mereka."
 FIN_nice_desc: "keengganan mereka dapat dimengerti."
 AAT_finland_diplomacy.03.a: "Cukup bagus..."
 AAT_finland_diplomacy.04.t: "[FROM.GetName] Menolak Proposal kami"
 AAT_finland_diplomacy.04.desc: "Para diplomat kita telah kembali dari misi mereka ke [FROM.GetName], namun nampaknya mereka tidak mampu membuat pemerintah [FROM.GetAdjective] memahami pentingnya berdiri bersama. Hanya sedikit alasan yang diberikan atas keputusan mereka, dan para pejabat kami bertanya-tanya apa dampak dari keputusan mereka.\n\nMungkin kita harus mulai mencari pembelaan kita sendiri, jika niat mereka menjadi jahat, atau mungkin mencari cara lain untuk mengamankan... kerja sama mereka."
 AAT_finland_diplomacy.04.a: "Kami akan menghormati keputusan mereka."
 AAT_finland_diplomacy.04.b: "Mereka telah memilih nasib mereka."
 AAT_finland_diplomacy.05.t: "[FROM.GetAdjective] Permohonan Pelestarian Sápmi"
 AAT_finland_diplomacy.05.desc: "Tampaknya [FROM.GetName] telah mengambil tindakan untuk melestarikan kebebasan dan budaya masyarakat Sámi, komunitas adat di Eropa utara.\n\n[FROM.GetNameDefCap] mengajukan petisi kepada kami untuk melepaskan kepada mereka wilayah yang secara tradisional dikuasai oleh Sámi, sehingga mereka dapat lebih melindungi kelompok ini sebagai satu bangsa."
 AAT_finland_diplomacy.05.a: "Pengorbanan untuk tujuan mulia!"
 AAT_finland_diplomacy.05.b: "Kepemimpinan [FROM.GetAdjective] telah kehilangannya."
 AAT_finland_diplomacy.06.t: "[FROM.GetAdjective] Konsesi Wilayah Sámi"
 AAT_finland_diplomacy.06.desc: "Berita bagus! [FROM.GetNameDefCap] telah setuju untuk mempercayakan tanah air bersejarah Sámi kepada kami. Sekarang menjadi tanggung jawab kita untuk melindungi dan memelihara masyarakat di wilayah ini. Kami telah menerima surat ucapan selamat dari para pemimpin Sámi, yang juga memperkuat harapan mereka bahwa kami akan terus memperlakukan budaya dan adat istiadat mereka dengan hormat."
 AAT_finland_diplomacy.06.a: "Masyarakat memuji keputusan [FROM.GetLeader]"
 AAT_finland_diplomacy.07.t: "[FROM.GetName] Menolak Petisi kami"
 AAT_finland_diplomacy.07.desc: "Kaum imperialis [From.GetNameDef] telah menolak petisi pencerahan kami untuk menyatukan tanah masyarakat Sámi. Dalam tanggapan resmi mereka, mereka menyatakan keprihatinan atas niat kami untuk menjunjung tinggi budaya dan martabat penduduk setempat, namun kami memahami bahwa motivasi sebenarnya di balik penolakan ini adalah untuk menjadikan negara mereka terlihat lebih besar di peta."
 AAT_finland_diplomacy.07.a: "Tidak ada yang bisa kita lakukan mengenai hal itu."
 AAT_finland_diplomacy.07.b: "Kita harus menjaga masyarakat Sámi!"
 AAT_finland_diplomacy.08.t: "[FROM.GetAdjective] Tekanan untuk Mengontrol Fluks Bijih Besi"
 AAT_finland_diplomacy.08.desc: "[FROM.GetNameDefCap] telah bersandar pada kami terkait produksi bijih besi kami. Mereka prihatin dengan meningkatnya ketegangan global, dan memandang diri mereka sebagai negara militer paling mampu di kawasan Nordik. Oleh karena itu, mereka telah meminta kendali atas negara-negara bagian utara yang kaya akan sumber daya, agar negara-negara tersebut dapat melindungi negara-negara tersebut, namun juga agar sumber daya yang mereka simpan dapat digunakan sebaik-baiknya untuk upaya perang."
 AAT_finland_diplomacy.08.a: "Kami tidak punya cara untuk menentang tuntutan mereka."
 AAT_finland_diplomacy.08.b: "Kami akan mempertahankan kedaulatan [ROOT.GetAdjective] atas wilayah tersebut."
 AAT_finland_diplomacy.09.t: "[FROM.GetName] Wilayah Permintaan Hasil"
 AAT_finland_diplomacy.09.desc: "Kami mendapat kabar baik bahwa [From.GetName] telah dengan bijak memutuskan untuk memberi kami kendali langsung atas negara bagian mereka yang kaya sumber daya. Militer kami sedang bersiap untuk mengambil alih garnisun di wilayah tersebut, dan para pemimpin industri kami telah mulai menyusun rencana tentang cara terbaik untuk memasukkan bahan mentah yang dipasok dari wilayah tersebut ke dalam sistem produksi kami sendiri."
 AAT_finland_diplomacy.09.a: "Kepemimpinan [FROM.GetAdjective] melakukan yang terbaik bagi rakyatnya."
 AAT_finland_diplomacy.10.t: "[FROM.GetName] Menolak Tuntutan kami"
 AAT_finland_diplomacy.10.desc: "Sayangnya, tampaknya pemimpin [FROM.GetAdjective], [FROM.GetLeader] terlalu picik, dan tetap tidak peduli dengan rencana hiu yang berputar-putar untuk merebut kekayaan Skandinavia untuk diri mereka sendiri. Kami telah mendengar kabar dari pemerintah [FROM.GetLeader.GetHerHis] dengan tegas bahwa pasukan kami akan tetap berada di sisi perbatasan kami, dan lebih jauh lagi mereka memperingatkan agar tidak terus-menerus memberikan tekanan mengenai masalah ini.\n\nTentu saja tujuan kami tetap tidak berubah, dan terlepas dari apa yang mereka klaim, kami masih membutuhkan bahan mentah untuk menjamin keamanan kami sendiri dan semua orang di area tersebut."
 AAT_finland_diplomacy.10.a: "Mereka begitu berpikiran tertutup sehingga mereka tidak bisa melihat kesalahan besar mereka."
 AAT_finland_diplomacy.10.b: "Kita harus mengambil kendali secara paksa, mengerahkan pasukan!"
 AAT_finland_diplomacy.11.t: "[FROM.GetAdjective] Usulan Integrasi Kola dan Karelia"
 AAT_finland_diplomacy.11.desc: "Bangsa [FIN.GetAdjective] masih muda, dan masyarakatnya tersebar serta tinggal di perbatasan berbagai negara. Dalam upaya untuk menyatukan lebih banyak masyarakat Finlandia, mereka kini mendekati kami dengan permintaan untuk mengintegrasikan Karelia Timur dan Semenanjung Kola ke dalam negara [FIN.GetAdjective]."
 AAT_finland_diplomacy.11.a: "Kami akan menyerahkan wilayah [ROOT.GetAdjective] untuk tujuan mulia ini."
 AAT_finland_diplomacy.11.b: "[ROOT.GetAdjective] wilayah akan tetap [ROOT.GetAdjective]!"
 AAT_finland_diplomacy.12.t: "[FROM.GetName] Menerima Tuntutan Teritorial kami"
 AAT_finland_diplomacy.12.desc: "[FROM.GetLeader] yang agung telah menyetujui usulan kami untuk bersatu dengan Karelia Timur, dan dengan demikian telah menyerahkan wilayah mereka di wilayah tersebut kepada kami. Orang [FROM.GetAdjective] yang hebat adalah teman baik orang Finlandia!"
 AAT_finland_diplomacy.12.a: "[FROM.GetLeader] melakukan yang terbaik untuk masyarakat Kolan dan Karelia."
 AAT_finland_diplomacy.13.t: "[FROM.GetLeader] Menolak Tuntutan kami"
 AAT_finland_diplomacy.13.desc: "[FROM.GetLeader] telah mengumumkan bahwa mereka tidak akan menyerahkan wilayah Karelia Timur mereka kepada kami, dan mengklaim bahwa permintaan kami atas wilayah tersebut tidak akan memberikan imbalan apa pun kepada mereka, dan hanya membawa kehancuran bagi masyarakat [FROM.GetAdjective] yang tinggal di wilayah tersebut."
 AAT_finland_diplomacy.13.a: "Kami tidak dapat memusuhi [FROM.GetLeader] saat ini..."
 AAT_finland_diplomacy.13.b: "Badut akan membayarnya!"
 AAT_finland_diplomacy.14.t: "[FROM.GetAdjective] Tuntutan Integrasi [ROOT.GetName]"
 AAT_finland_diplomacy.14.desc: "Tuan kami [FIN.GetNameDef] telah menuntut agar kami berintegrasi sepenuhnya ke dalam negara mereka. Mereka mengklaim wilayah Baltik sebagai milik mereka, dan mengklaim bahwa regionalisme kita pada akhirnya akan menyebabkan destabilisasi wilayah mereka."
 AAT_finland_diplomacy.14.a: "Jika mereka berkata begitu..."
 AAT_finland_diplomacy.14.b: "Menurut mereka, siapakah mereka?"
 AAT_finland_diplomacy.15.t: "[FROM.GetName] Menjadi Bagian dari [ROOT.GetNameDef]"
 AAT_finland_diplomacy.15.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui usulan kami untuk berintegrasi ke dalam negara kami, dan telah mulai mengubah undang-undang mereka agar berfungsi sebagai daerah otonom, bukan sebagai negara merdeka."
 AAT_finland_diplomacy.15.a: "Pilihan Cerdas"
 AAT_finland_diplomacy.16.t: "Pimpinan [FROM.GetAdjective] Menolak Tuntutan kami"
 AAT_finland_diplomacy.16.desc: "Pemerintah [FROM.GetAdjective] telah menyatakan bahwa usulan baru kami melanggar perjanjian yang ditandatangani sebelumnya antara negara-negara kita, dan mengacu pada hukum internasional ketika menyatakan bahwa gagasan baru kami tentang unifikasi adalah ilegal dan tidak adil."
 AAT_finland_diplomacy.16.a: "Kami akan menghormati keputusan mereka"
 AAT_finland_diplomacy.16.b: "Mereka tidak menghormati diri mereka sendiri!"
 AAT_finland_diplomacy_nordic: "Nordik"
 AAT_finland_diplomacy_baltic: "Baltik"
 AAT_finland_diplomacy.17.t: "[FROM.GetAdjective] Permintaan untuk [GetBalticOrNordic] Wilayah"
 AAT_finland_diplomacy.17.desc: "[FIN.GetNameDefCap] telah menuntut agar kami menyerahkan wilayah apa pun yang kami miliki di negara-negara [GetBalticOrNordic] tradisional kepada mereka, sebagai bagian dari agenda baru mereka untuk mempertahankan dan menjaga wilayah [GetBalticOrNordic] sebagai bagian dari federasi masyarakat [FIN.GetAdjective] yang lebih besar."
 AAT_finland_diplomacy.17.a: "Tentu saja"
 AAT_finland_diplomacy.17.b: "Kepala mereka menjadi terlalu besar"
 AAT_finland_diplomacy.18.t: "[FROM.GetName] Transfer [GetBalticOrNordic] Wilayah"
 AAT_finland_diplomacy.18.desc: "[FROM.GetLeader] dengan bijak telah setuju untuk menyerahkan wilayah [GetBalticOrNordic] mereka kepada kami, karena mereka merasa kesulitan dalam menggugat klaim kami tidak ada gunanya."
 AAT_finland_diplomacy.18.a: "Mereka membuat pilihan yang tepat"
 AAT_finland_diplomacy.19.t: "Pemerintah [FROM.GetAdjective] Menolak Tuntutan kami"
 AAT_finland_diplomacy.19.desc: "[FROM.GetLeader] telah menolak untuk menyerahkan wilayah [GetBalticOrNordic] mereka kepada kami, dengan menyatakan bahwa jelas bahwa kami tidak memiliki klaim yang lebih kuat atas wilayah tersebut dibandingkan pihak lain. Bagaimana seharusnya kita menyikapi keputusan tercela ini."
 AAT_finland_diplomacy.19.a: "Tidak ada yang bisa dilakukan mengenai hal itu"
 AAT_finland_diplomacy.19.b: "Beritahu mereka bahwa kita akan datang"
 AAT_finland_diplomacy.20.t: "[FROM.GetAdjective] Proposal untuk Pakta Finno-[ROOT.GetAdjective]"
 AAT_finland_diplomacy.20.desc: "[FIN.GetLeader] telah meminta kita untuk menandatangani pakta non-agresi dan perdamaian abadi antar negara kita. Usulan ini datang sebagai bagian dari arahan baru pemerintah [FIN.GetAdjective] untuk berdamai dengan tetangganya dan melakukan pendekatan kembali terhadap bangsa kita."
 AAT_finland_diplomacy.20.a: "Tidak ada salahnya melakukan hal ini"
 AAT_finland_diplomacy.20.b: "Mereka tidak tahu apa yang telah kita rencanakan untuk mereka"
 AAT_finland_diplomacy.21.t: "[FROM.GetName] Setuju untuk Menandatangani Pakta Finno-[FROM.GetAdjective]"
 AAT_finland_diplomacy.21.desc: "[FROM.GetLeader] yang agung dari [FROM.GetNameDef] telah berjanji untuk berupaya mewujudkan perdamaian abadi dan jangka panjang di antara negara-negara kita, untuk tahun-tahun mendatang. Mereka benar-benar sahabat baik orang-orang [FIN.GetAdjective]."
 AAT_finland_diplomacy.21.a: "Masa depan yang lebih cerah menanti kita"
 AAT_finland_diplomacy.22.t: "[FROM.GetLeader] Menolak Proposal kami untuk Pakta Finno-[FROM.GetAdjective]"
 AAT_finland_diplomacy.22.desc: "[FROM.GetLeader] yang tidak dapat dipercaya telah menyatakan bahwa mereka tidak dapat menjamin perdamaian di antara negara-negara kita, dengan jelas merencanakan semacam serangan terhadap negara kita, dan untuk itu kita harus mempersiapkan diri sebaik mungkin."
 AAT_finland_diplomacy.22.a: "Beraninya mereka!"
 AAT_finland_diplomacy.23.t: "[FROM.GetNameDefCap] Mencari Perlindungan Terhadap [SOV.GetNameDef]"
 AAT_finland_diplomacy.23.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah meminta agar kami membantu mereka dalam pertahanan terhadap kemungkinan agresi oleh [SOV.GetNameDef]. Mereka menyatakan bahwa mereka sadar bahwa mereka mungkin akan segera diserang, dan bahwa kita adalah satu-satunya harapan mereka untuk bertahan hidup jika hari seperti itu tiba."
 AAT_finland_diplomacy.23.a: "Kami akan membawa mereka ke bawah sayap kami"
 AAT_finland_diplomacy.23.b: "Dan mengapa kita harus melakukan itu?"
 AAT_finland_diplomacy.24.t: "Pemerintah [FROM.GetAdjective] Bersumpah untuk Melindungi [ROOT.GetNameDef]"
 AAT_finland_diplomacy.24.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui permintaan kami, dan berjanji untuk melindungi kami jika terjadi agresi apa pun yang dilakukan oleh [SOV.GetAdjective]. Kami akhirnya bisa bernapas lega."
 AAT_finland_diplomacy.24.a: "penyelamat kita"
 AAT_finland_diplomacy.25.t: "[FROM.GetNameDef] Menolak Permintaan Perlindungan kami"
 AAT_finland_diplomacy.25.desc: "Pemerintah [FROM.GetAdjective] telah menolak permintaan kami untuk perlindungan dari [SOV.GetAdjective]. Karena skenario yang kita takuti telah terjadi, maka kita harus mempersiapkan pertahanan kita untuk bertahan sekuat tenaga."
 AAT_finland_diplomacy.25.a: "Kita telah ditinggalkan oleh takdir!"
 AAT_finland_diplomacy.26.t: "[FROM.GetName] Mencari [ROOT.GetAdjective] Perlindungan"
 AAT_finland_diplomacy.26.desc: "[FIN.GetLeader] dari [FIN.GetNameDef] mencari perlindungan dari [SOV.GetNameDef], yang baru-baru ini mulai mengawasi tetangga mereka sekali lagi, untuk pertama kalinya sejak perang saudara di Rusia. Sebagai imbalan atas perlindungan dari ancaman ini, mereka menawarkan untuk membayar kami hak atas berbagai sumber daya alam [FIN.GetAdjective]."
 AAT_finland_diplomacy.26.a: "Kami akan membantu mereka!"
 AAT_finland_diplomacy.26.b: "Bukan masalah kita."
 AAT_finland_diplomacy.27.t: "[FROM.GetNameDefCap] akan Melindungi Kita"
 AAT_finland_diplomacy.27.desc: "[GER.GetNameDefCap] telah menerima proposal kami untuk menukar sumber daya demi perlindungan, dan berjanji akan membantu kami jika perang memilih kami. Masyarakat kita akhirnya bisa bernapas lega, karena masa depan mereka kini jauh lebih aman."
 AAT_finland_diplomacy.27.a: "Kami akan berdiri bersama!"
 AAT_finland_diplomacy.28.t: "[ROOT.GetName] Tidak Dapat Mengandalkan [FROM.GetAdjective] Perlindungan"
 AAT_finland_diplomacy.28.desc: "[GER.GetLeader] yang pengkhianat dari [GER.GetNameDef] telah menolak usulan kita untuk mendapatkan sumber daya sebagai imbalan atas perlindungan, dan dengan demikian telah menghancurkan masa depan kita secara tiba-tiba. Kita akan melihat bagaimana sifat egois mereka yang mementingkan diri sendiri bermanfaat bagi mereka di masa depan."
 AAT_finland_diplomacy.28.a: "Kalau begitu, kita sendirian!"
 AAT_finland_winter_war.02.t: "[ROOT.GetAdjective] Tuntutan Perdamaian"
 AAT_finland_winter_war.02.desc: "Kami membawa kabar gembira dari depan! Pasukan kami baru-baru ini memenangkan pengepungan [195.GetName], dan berhasil mengamankan kota. Dengan pukulan telak terhadap [SOV.GetNameDef] ini, kita berada dalam posisi yang kuat untuk membuka perundingan perdamaian.\n\nSalah satu tujuan invasi [SOV.GetAdjective] adalah untuk meningkatkan penyangga di sekitar [195.GetName] dan sekarang mereka tidak hanya gagal mencapai tujuan ini, tetapi juga kehilangan kota itu sendiri. Oleh karena itu, kami membayangkan bahwa mereka akan sangat ingin melepaskan diri dari konflik ini.\n\nSekarang adalah keputusan kita kapan memulai perundingan, kita dapat melanjutkan perjuangan dan melihat apakah kita dapat melakukan lebih banyak hal, atau mengincar perdamaian putih sesegera mungkin."
 AAT_finland_winter_war.02.a: "Mungkin ini saatnya untuk perdamaian..."
 AAT_finland_winter_war.03.t: "[FROM.GetAdjective] Tuntutan Perdamaian"
 AAT_finland_winter_war.03.desc: "Kami baru saja menerima kabar dari musuh kami di [FROM.GetNameDef]. Mereka telah menawarkan syarat-syarat perdamaian putih, dimana pasukan kita segera menghentikan segala tindakan ofensif dan menarik diri ke wilayah perbatasan kita. Teritorialitas, tampaknya [FROM.GetNameDef] puas melihat perbatasan kita kembali ke posisi sebelum perang, dan tidak ada pihak yang memperoleh keuntungan apa pun.\n\nMengingat kekalahan yang kami alami baru-baru ini, kami tidak yakin seberapa besar dukungan penduduk kami untuk melanjutkan perjuangan. Kita mungkin bisa meyakinkan mereka akan kemenangan dalam jangka pendek, namun jika keadaan terus memburuk maka kita mungkin akan menghadapi ketidakpuasan yang meningkat terhadap pemerintahan kita."
 AAT_finland_winter_war.03.a: "Kami tidak punya pilihan lain selain mengakui kekalahan..."
 AAT_finland_winter_war.03.b: "Kami akan membalikkan keadaan perang!"
 AAT_finland_winter_war.04.t: "[FROM.GetNameDefCap] Menerima Tuntutan Perdamaian Kami"
 AAT_finland_winter_war.04.desc: "Mereka telah menerima perjanjian damai! Perayaan spontan terjadi di jalan-jalan seiring dengan tersebarnya berita kemenangan kami. [FROM.GetAdjective] pasukan sudah mulai mundur dari wilayah kami, kembali ke rumah mereka dengan penuh kesengsaraan.\n\nIni tentu menjadi hari yang membanggakan bagi bangsa kita, namun kita tidak boleh berpuas diri karena masih banyak ular di rumput."
 AAT_finland_winter_war.04.a: "Mereka sebaiknya tidak mencoba kita lagi."
 AAT_finland_winter_war.05.t: "[FROM.GetNameDefCap] Menolak Tuntutan Perdamaian Kami"
 AAT_finland_winter_war.05.desc: "Orang-orang bodoh di [FROM.GetNameDef] telah menolak tawaran perdamaian kami. Klaim khayalan mereka adalah bahwa kerugian yang dialami pasukan mereka baru-baru ini adalah pembalikan keberuntungan jangka pendek yang akan segera mereka atasi. Kami tahu bahwa hal ini hanyalah sebuah rekayasa yang bertujuan untuk melindungi pemerintah mereka dari kemarahan rakyatnya, namun kebenarannya akan segera terungkap.\n\nPrajurit kita tetap berada di medan perang, semangat mereka tetap tinggi, yakin bahwa mereka melanjutkan perjuangan yang benar, mempersiapkan diri untuk pertempuran yang akan datang."
 AAT_finland_winter_war.05.a: "Orang bodoh akan membayarnya!"
 AAT_finland_winter_war.06.t: "[FROM.GetAdjective] Tuntutan Teritorial untuk Perdamaian"
 AAT_finland_winter_war.06.desc: "Kami baru saja menerima permintaan untuk menyerah dari saingan kami yang [FROM.GetAdjective]. Sebagai bagian dari ketentuan perdamaian, mereka meminta kami untuk menyerahkan sejumlah wilayah berbeda di wilayah Karelia-Kola, dan mereka mendesak kami untuk mengosongkan tanah tersebut secepat mungkin."
 AAT_finland_winter_war.06.a: "Kami tidak punya pilihan lain selain mengakui kekalahan..."
 AAT_finland_winter_war.06.b: "Beraninya mereka!?"
 AAT_finland_winter_war.07.desc: "Mereka telah menerima perjanjian damai! Perayaan spontan terjadi di jalan-jalan seiring dengan tersebarnya berita kemenangan kami. [FROM.GetAdjective] pasukan sudah mulai mundur dari wilayah kami, kembali ke rumah mereka dengan penuh kesengsaraan.\n\nIni tentu merupakan hari yang akan menjadi salah satu kebanggaan bagi bangsa kita, karena kita tidak hanya berhasil mengalahkan penjajah, kita juga mengalahkan mereka dengan sangat keras sehingga kita dapat memperluas wilayah kita sendiri dengan mengorbankan mereka!"
 AAT_finland_winter_war.07.a: "Mudah-mudahan mereka akhirnya mendapat pelajaran."
 AAT_finland_winter_war.08.desc: "Orang-orang bodoh di [FROM.GetNameDef] telah menolak tawaran perdamaian kami. Pemerintahan mereka yang semakin putus asa berpegang teguh pada gagasan khayalan bahwa mereka masih bisa menang, sadar bahwa jika kebenaran tentang keadaan perang tidak terungkap, mereka harus menghadapi pemberontakan massal dan bahkan mungkin revolusi di dalam negeri.\n\nPrajurit kita tetap berada di medan perang, semangat mereka tetap tinggi, yakin bahwa mereka melanjutkan perjuangan yang benar, mempersiapkan diri mereka untuk pertempuran yang akan datang, yakin bahwa kemenangan sudah dekat."
 AAT_finland_winter_war.08.a: "Orang bodoh akan membayarnya!"
 FIN_winter_war_push_back_tt: "Mendorong kembali [SOV.GetAdjective] dan menduduki §Y[195.GetName]§! akan memungkinkan kita untuk menuntut negosiasi perdamaian.\nJuga mengendalikan §Y[213.GetName]§!, §Y[215.GetName]§! atau §Y[216.GetName]§! akan memungkinkan kita untuk menuntut negara bagian tersebut sebagai konsesi teritorial dari [SOV.GetNameDef]."
 AAT_finland_continuation_war.01.t: "[FROM.GetAdjective] Usulan Perang Berkelanjutan"
 AAT_finland_continuation_war.01.desc: "Anggota lingkaran penguasa [FROM.GetName] telah menghubungi kami mengenai prospek kerja sama militer melawan ancaman [SOV.GetAdjective] di Timur. Usulan mereka akan mengizinkan penempatan aset militer di dalam [FROM.GetName] dengan syarat kita saling melindungi perbatasan satu sama lain, serta bekerja sama dalam setiap serangan agresif ke wilayah [SOV.GetAdjective]."
 AAT_finland_continuation_war.01.a: "Tentu, pastikan saja tidak ada catatan perjanjian ini!"
 AAT_finland_continuation_war.01.b: "[FROM.GetAdjective] hal-hal sepele bukanlah urusan kami."
 AAT_finland_continuation_war.02.t: "Finno-[FROM.GetAdjective] Pakta untuk Perang Berkelanjutan"
 AAT_finland_continuation_war.02.desc: "[FROM.GetLeader] telah memberikan [FROM.GetLeader.GetHerHis] persetujuan atas proposal kerja sama militer kita terhadap [SOV.GetNameDef]. Perwira angkatan bersenjata kita sekarang diundang ke [FROM.Capital.GetCapitalVictoryPointName] untuk memulai koordinasi pasukan gabungan kita."
 AAT_finland_continuation_war.02.a: "Pastikan tidak ada catatan perjanjian ini!"
 AAT_finland_continuation_war.03.t: "[FROM.GetName] Menolak Proposal kami"
 AAT_finland_continuation_war.03.desc: "[FROM.GetLeader] dengan bodohnya menolak proposal kerja sama militer kami. Mungkin saja [FROM.GetAdjective] tidak ingin mengambil risiko atas perjanjian rapuh yang mereka miliki saat ini dengan [SOV.GetAdjective], namun hal ini juga bisa menjadi indikasi bahwa mereka mempunyai rencana alternatif untuk kita. Apa pun yang terjadi, kita harus melanjutkan dengan hati-hati dan mulai mencari dukungan potensial di tempat lain."
 AAT_finland_continuation_war.03.a: "Kesempatan yang sia-sia..."
 AAT_finland_continuation_war.04.t: "Pakta untuk Melanjutkan Perang Dilanggar"
 AAT_finland_continuation_war.04.desc: "Rencana kami untuk bekerja sama dengan [FROM.GetNameDef] melawan [SOV.GetNameDef] kini berantakan karena perubahan geopolitik baru-baru ini. Kita telah berupaya keras untuk membuat rencana operasi gabungan, namun sekarang kita harus kembali ke perencanaan baik secara militer maupun kebijakan luar negeri."
 AAT_finland_continuation_war.04.a: "Kami akan mengatasi ini."
 AAT_finland_continuation_war.05.t: "[FIN.GetAdjective] Perang Lanjutan"
 AAT_finland_continuation_war.05.desc: "Hasil dari manuver diplomatik dan perencanaan militer kita yang cermat sudah dekat ketika [GER.GetNameDef] akhirnya meluncurkan Operasi Barbarossa, invasi [SOV.GetNameDef]. Sekarang kita harus menindaklanjuti komitmen kita dan melaksanakan bagian rencana kita."
 AAT_finland_continuation_war.05.a: "Mari kita bergabung dengan saudara seperjuangan kita!"
 AAT_finland_continuation_war.06.desc: "Pasukan militer [FIN.GetAdjective] telah melancarkan serangan terencana terhadap posisi [SOV.GetAdjective] sesuai dengan perjanjian kerja sama kita. Dengan bantuan saudara-saudara seperjuangan kami yang [FIN.GetAdjective], kami telah berhasil memperluas front Soviet hingga mencapai titik puncaknya."
 AAT_finland_continuation_war.06.a: "Kemenangan sudah dekat!"
 AAT_finland_continuation_war.07.desc: "Meskipun upaya diplomatik kami yang terbaik untuk menghalangi [GER.GetNameDef] dan [FIN.GetNameDef] agar tidak berkolaborasi satu sama lain, upaya kami tampaknya sia-sia. Militer [FIN.GetAdjective] telah melancarkan serangan terhadap kami bersama dengan [GER.GetAdjective] dengan sangat tepat sehingga mereka pasti telah mengoordinasikan operasi ini untuk waktu yang lama."
 AAT_finland_continuation_war.07.a: "Seperti yang kita takutkan..."
 FIN_pact_for_continuation_war_ger_tt: "Dampak ketika [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! menyatakan perang terhadap [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! akan ikut berperang melawan [SOV.GetFlag]§Y[SOV.GetNameDef]§!."
 FIN_pact_for_continuation_war_fin_tt: "Dampak ketika [FROM.GetFlag]§Y[FROM.GetNameDef]§! menyatakan perang terhadap [SOV.GetFlag]§Y[SOV.GetNameDef]§!:\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! akan ikut berperang melawan [SOV.GetFlag]§Y[SOV.GetNameDef]§!."
 FIN_pact_for_continuation_war_broken_tt: "Perjanjian tersebut telah dilanggar dan negara-negara tersebut tidak lagi berkewajiban untuk saling membantu jika terjadi perang melawan [SOV.GetFlag]§Y[SOV.GetNameDef]§!."
 FIN_the_lone_wolf_no_faction_tt: "[FIN.GetFlag]§Y[FIN.GetNameDefCap]§! §Rtidak dapat bergabung dalam faksi mana pun selama memiliki Semangat Kebangsaan§! '§Y$FIN_the_lone_wolf$§!'."
 AAT_finland_continuation_war.08.t: "[FROM.GetName] Keinginan untuk Gencatan Senjata"
 AAT_finland_continuation_war.08.desc: "Pemerintah di [FROM.GetNameDef] telah menghubungi kami untuk meminta agar kami menandatangani gencatan senjata dengan mereka, menjanjikan kami konsesi wilayah lebih lanjut serta memutuskan semua hubungan dengan [GER.GetNameDef]. Dengan menerima hal ini, kita dapat sepenuhnya memusatkan perhatian kita pada [GER.GetAdjective], dan mendorong mereka kembali dari mana mereka berasal."
 AAT_finland_continuation_war.08.a: "Mari kita tandatangani Gencatan Senjata Moskow"
 AAT_finland_continuation_war.08.b: "Mereka tidak akan lolos dengan mudah kali ini!"
 AAT_finland_continuation_war.09.t: "[FROM.GetNameDef] Menolak Tawaran Perdamaian kami"
 AAT_finland_continuation_war.09.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kami, dan menyatakan bahwa kami harus bersiap menghadapi kehancuran, karena tentara [FROM.GetAdjective] tidak akan membiarkan kami dengan mudah kali ini. Ini adalah skenario terburuk!"
 AAT_finland_continuation_war.09.a: "Kita telah ditinggalkan oleh takdir!"
 aat_news.120.t: "Gencatan Senjata Moskow Ditandatangani"
 aat_news.120.desc: "Setelah pembicaraan panjang, petugas dan pejabat yang mewakili [FIN.GetLeader] dan [SOV.GetLeader] telah sepakat untuk segera menandatangani gencatan senjata. Namun gencatan senjata ini harus dibayar mahal bagi [FIN.GetNameDef], dan sekutu [FIN.GetName] pasti hanya merasakan pengkhianatan."
 aat_news.120.a: "Itu harus dilakukan..."
 aat_news.120.b: "Terima kasih karena tidak menunjukkan persaudaraan dalam pelukan!"
 aat_news.120.c: "Kami bergerak maju!"
 aat_news.120.d: "Sebuah perkembangan yang menarik tentunya..."
 AAT_finland_continuation_war.10.t: "Soviet Memaksa kami mengusir Pasukan [GER.GetAdjective]"
 AAT_finland_continuation_war.10.desc: "Perwakilan Soviet telah memperhatikan kurangnya kepatuhan kami terhadap gencatan senjata, karena dengan jelas dinyatakan bahwa kami perlu mengusir pasukan musuh, dan [GER.GetAdjective] menarik persenjataan dan sumber daya kami yang terpaksa kami serahkan kepada Uni. Ketika pasukan kita mulai berusaha melucuti senjata tentara [GER.GetAdjective], baku tembak pun dimulai, dan [GER.GetAdjective] menghanguskan bumi dan menambang perairan kita."
 AAT_finland_continuation_war.10.a: "Kita harus mematuhinya, jangan sampai kita menghadapi perang lagi"
 AAT_finland_continuation_war.11.t: "Petugas Kami Mulai Penarikan dari [FIN.GetNameDef]"
 AAT_finland_continuation_war.11.desc: "Meskipun pada awalnya ragu-ragu, pemerintah [FIN.GetAdjective] kini berada di bawah tekanan dari Soviet yang mulai mengusir dan melucuti tentara kami yang ditempatkan di sana. Petugas kami sudah mulai membuat rencana yang dibuat untuk skenario ini, namun masih ragu untuk melanjutkan rencana yang mana. Apa yang lebih penting?"
 AAT_finland_continuation_war.11.a: "Memulai Operasi Birke"
 AAT_finland_continuation_war.11.b: "Memulai Operasi Nordlicht"
 aat_news.121.t: "Perang Laplandia"
 aat_news.121.desc: "Pertempuran telah pecah antara [FIN.GetNameDef] dan [GER.GetNameDef] ketika pasukan [FIN.GetAdjective] berupaya untuk melucuti senjata dan mengusir tentara [GER.GetAdjective] dari negara mereka, sesuai dengan perjanjian yang ditandatangani dengan [SOV.GetNameDef] selama Gencatan Senjata Moskow. Tidak ada keraguan bahwa [GER.GetAdjective] akan dikeluarkan dari [FIN.GetName] pada waktunya, namun berapa biayanya yang menjadi pertanyaan."
 aat_news.121.a: "Kami akan mengusir mereka!"
 aat_news.121.b: "Mereka telah menunjukkan warna aslinya..."
 aat_news.121.c: "Kemenangan lain bagi kami"
 aat_news.121.d: "Arusnya telah berbalik"
 AAT_finland_continuation_war.12.t: "[FIN.GetName] Ingin Bertukar Sisi"
 AAT_finland_continuation_war.12.desc: "[FIN.GetLeader] dari [FIN.GetNameDef] hari ini telah menghubungi kami dengan tawaran yang sangat menarik. Dia mengklaim bahwa [FIN.GetName] siap untuk mengakhiri perang mereka dengan [SOV.GetNameDef], karena perang semakin berbalik melawan mereka, dan telah menawarkan untuk mengizinkan kami mendarat di Petsamo, dan bergabung dengan faksi kami untuk bersama-sama mengusir [GER.GetAdjective] dari Skandinavia, dan mengakhiri [GER.GetNameDef] untuk selamanya. Bagaimana menurut kita?"
 AAT_finland_continuation_war.12.a: "Baiklah, semoga saja [SOV.GetLeader] baik-baik saja..."
 AAT_finland_continuation_war.12.b: "Kita tidak bisa mengambil risiko memprovokasi Uni Soviet!"
 AAT_finland_continuation_war.13.t: "[FIN.GetName] ingin Bergabung dengan Sekutu"
 AAT_finland_continuation_war.13.desc: "Tampaknya perwakilan dari [FIN.GetNameDef] telah mendekati negara-negara demokrasi besar, mencoba untuk keluar dari perang melawan kita dengan menawarkan untuk bergabung dengan mereka dalam perang melawan [GER.GetAdjective], yang pada dasarnya berpindah pihak. Jika Sekutu menyetujui hal ini, kami tidak bisa berbuat banyak selain mengeluh dan menuntut kompensasi, namun setidaknya hal ini akan berarti mitra baru dalam perjuangan kami melawan fasisme."
 AAT_finland_continuation_war.13.a: "Baiklah, tapi hanya jika kita mendapat kompensasi"
 AAT_finland_political.01.t: "Mosi Tidak Percaya Terhadap [ROOT.GetLeader]"
 AAT_finland_political.01.desc: "Terjadi hari ini bahwa [Root.GetLeader] gagal mendapatkan suara yang dibutuhkan [ROOT.GetLeader.GetSheHe] untuk bertahan dalam pemungutan suara Mosi Tidak Percaya yang menentang mereka di eduskunta, Parlemen [ROOT.GetAdjective].\n\nMeskipun telah menjabat sebagai presiden sejak tahun 1931, dan memiliki rekam jejak pemerintahan yang luas, kedudukan [ROOT.GetLeader.GetHerHis] berkurang secara signifikan karena menolak memasukkan Partai Sosial Demokrat ke dalam kabinet, sehingga melanggar janji [ROOT.GetLeader.GetHerHis] untuk melakukannya. Kecerobohan politik ini meningkat menjadi krisis politik, yang kini menjadi korban [ROOT.GetLeader.GetSheHe]."
 AAT_finland_political.01.a: "Kallio ada pekerjaan yang harus diselesaikan!"
 AAT_finland_political.02.t: "Masa Jabatan Presiden Akan Berakhir"
 AAT_finland_political.02.desc: "Hari ini menandai hari dimana [ROOT.GetLeader] yang diperangi harus mengamankan posisi mereka sebagai presiden sekali lagi.\n\nMeskipun telah menjabat sebagai presiden sejak tahun 1931, dan memiliki rekam jejak pemerintahan yang luas, kedudukan [ROOT.GetLeader.GetHerHis] berkurang secara signifikan karena menolak memasukkan Partai Sosial Demokrat ke dalam kabinet, sehingga melanggar janji [ROOT.GetLeader.GetHerHis] untuk melakukannya. Kecerobohan politik ini sangat merugikan peluang [ROOT.GetLeader.GetHerHis] untuk terpilih kembali, dan kita akan mengetahui hari ini apakah hal tersebut cukup untuk menggulingkan [GetPoliticsDescriptionOldManPete]"
 FIN_reelection_old_man_pete: "Pak Tua Pete."
 FIN_reelection_other_leader: "[ROOT.GetLeader]."
 AAT_finland_political.02.a: "Svinhufvud harus mendapatkan kepercayaan dari massa."
 AAT_finland_political.02.b: "Tunjuk Kyosti Kallio, dia mendapat dukungan dari kaum sentris dan demokrat!"
 AAT_finland_political.03.desc: "Sayangnya, kita harus menghadapi kenyataan nyata bahwa [ROOT.GetLeader] sama sekali tidak sehat. [ROOT.GetLeader] telah menderita stroke di mana [ROOT.GetLeader.GetHerHis] lengan kanan menjadi lumpuh, dan dokter khawatir kesehatan [ROOT.GetLeader.GetHerHis] akan cepat memburuk kecuali [ROOT.GetLeader.GetSheHe] segera diberhentikan dari jabatannya.\n\nDengan demikian, eduskunta, Parlemen Finlandia, telah mengadakan sidang darurat untuk mengajukan Mosi Tidak Percaya untuk memecat Presiden demi kesehatannya sendiri.  Perdana Menteri Risto Ryti telah mengambil alih sejumlah tanggung jawab presiden dan bersiap untuk mengambil alih jabatan tersebut."
 AAT_finland_political.03.a: "Tunjuk Risto Ryti, dia sudah mengambil alih tugas Kallio!"
 AAT_finland_political.04.t: "Kematian [ROOT.GetLeader]"
 AAT_finland_political.04.desc: "Kami mendapat kabar tragis, Presiden [ROOT.GetName], [ROOT.GetLeader] yang sangat kita cintai telah meninggal dunia. [ROOT.GetLeader.GetSheHeCap] telah berada dalam kondisi kesehatan yang buruk selama beberapa waktu, telah menderita stroke yang melumpuhkan [ROOT.GetLeader.GetHerHis] lengan kanan.\n\n[ROOT.GetLeader.GetSheHeCap] sedang dalam perjalanan pulang dari baru saja mengajukan [ROOT.GetLeader.GetHerHis] pengunduran diri karena alasan kesehatan ketika [ROOT.GetLeader.GetSheHe] menderita serangan jantung yang fatal, dan meninggal di sana di Stasiun Kereta Api Pusat Helskini. Penjaga kehormatan memainkan pawai patriotik Finlandia, Porilaisten marssi, untuk mengucapkan selamat tinggal padanya dari kantornya pada saat kematiannya."
 AAT_finland_political.04.a: "Beristirahatlah dengan Damai!"
 AAT_finland_political.05.t: "Pengunduran diri [ROOT.GetLeader]"
 AAT_finland_political.05.desc: "Hari ini kami menerima surat pengunduran diri [ROOT.GetLeader]. Di dalamnya [ROOT.GetLeader.GetSheHe] telah mengindikasikan bahwa ada kekhawatiran yang sedang berlangsung mengenai kesehatan [ROOT.GetLeader.GetHerHis] dan oleh karena itu [ROOT.GetLeader.GetSheHe] memutuskan untuk mengambil keputusan yang bijaksana, dan menawarkan [ROOT.GetLeader.GetHerHis] pengunduran diri.\n\n[GetPoliticsDescriptionKallioWinterWar]"
 FIN_politics_kallio_winter_war: "[ROOT.GetLeader] juga tidak asing dengan perang, dan [ROOT.GetLeader.GetSheHe] merasa khawatir atas meningkatnya ketegangan global. Peringatan [ROOT.GetLeader.GetHerHis] telah ditanggapi dengan serius oleh masyarakat, karena [ROOT.GetLeader.GetSheHe] adalah orang yang bertanggung jawab memimpin negara kita melewati saat-saat paling kelam dalam Perang Musim Dingin."
 FIN_politics_no_kallio_winter_war: "[ROOT.GetLeader.GetSheHeCap] juga menyatakan keprihatinannya atas meningkatnya ketegangan di seluruh dunia, dan menunjukkan harapan yang mendalam dan tulus bagi keselamatan masyarakat [ROOT.GetAdjective] di masa-masa sulit ini."
 AAT_finland_political.05.a: "$FIN_risto_ryti$ adalah yang berikutnya!"
 AAT_finland_political.06.desc: "Yang mengejutkan, pemerintah baru saja menerima surat pengunduran diri dari [ROOT.GetLeader] dengan alasan kesehatan. Namun, [ROOT.GetLeader.GetSheHe] merupakan gambaran kesehatan yang baik, sehingga ada sebagian yang menduga mungkin ada motivasi lain.\n\nPresiden baru-baru ini terlibat dalam skandal politik dimana [ROOT.GetLeader.GetSheHe] diketahui telah mengirimkan surat pribadi kepada [GER.GetLeader] di mana [ROOT.GetLeader.GetSheHe] memohon bantuan militer melawan musuh kita, baik yang nyata maupun yang dianggap.\n\nDapat dimengerti bahwa beberapa elemen kabinet yang lebih nasionalis mengecam serangan nyata terhadap kedaulatan kita, dan mereka mungkin menekan [ROOT.GetLeader.GetHerHim] untuk mengundurkan diri."
 AAT_finland_political.06.a: "Negara tidak lagi membutuhkan orang seperti Ryti."
 AAT_finland_political.07.t: "$FIN_carl_mannerheim$ Diangkat menjadi Presiden"
 AAT_finland_political.07.desc: "Karena keberadaan [ROOT.GetName] terancam oleh perang ini, kita harus mengambil keputusan sulit untuk menggantikan [ROOT.GetLeader] dengan pemerintahan militer yang dipimpin oleh pahlawan Perang Kemerdekaan [ROOT.GetAdjective], Field Marshall Carl G. Mannerheim. Kita memerlukan pengalaman militernya jika kita ingin mempunyai harapan untuk melepaskan diri dari penjajah, dan menyelamatkan tanah air kita.\n\nMannerheim telah mengambil tanggung jawab barunya dengan penuh semangat, menyatakan, 'Perang ini tidak lain adalah kelanjutan dan tindakan terakhir dari Perang Kemerdekaan kita. Kami berjuang untuk rumah kami, iman kami, dan negara kami.'"
 AAT_finland_political.07.a: "Mannerheim akan menangani situasi ini."
 AAT_finland_political.08.t: "Tugas Mannerheim Tercapai"
 AAT_finland_political.08.desc: "Dengan rasa syukur kita mengapresiasi prestasi [ROOT.GetLeader], karena tanpa kepemimpinan [ROOT.GetLeader.GetHerHis] kita tidak akan bisa melewati badai ini dan bangsa kita kini akan hilang.\n\nNamun kita harus mengambil keputusan yang sulit, haruskah kita meminta Marshall untuk tetap pada posisinya, atau melepaskan jabatannya dan menuruti keinginan rakyat dan memperkenalkan kembali pemerintahan sipil?"
 AAT_finland_political.08.a: "Orang [ROOT.GetAdjective] terima kasih atas layanan Anda, Marsekal Baron Mannerheim!"
 AAT_finland_political.08.b: "Mannerheim masih dibutuhkan di posnya!"
 AAT_finland_political.09.desc: "Dengan rasa syukur kita mengapresiasi prestasi [ROOT.GetLeader], karena tanpa kepemimpinan [ROOT.GetLeader.GetHerHis] kita tidak akan bisa melewati badai ini dan bangsa kita kini akan hilang.\n\nNamun, kini saatnya bagi kita untuk melihat lebih jauh dari sekedar perang, menuju perdamaian dan rekonstruksi yang harus diikuti. Untuk menyembuhkan luka dengan baik dan menghadapi masa depan, kita harus memulihkan pemerintahan sipil."
 AAT_finland_political.09.a: "Orang [ROOT.GetAdjective] terima kasih atas layanan Anda, Marsekal Baron Mannerheim!"
 AAT_finland_kinship_war.01.t: "[FROM.GetAdjective] Agitator di Karelia Timur"
 AAT_finland_kinship_war.01.desc: "Di tengah meningkatnya sentimen anti-Soviet di Karelia, warga setia kami di sana menyuarakan kekhawatiran bahwa kami mungkin akan terulangnya Pemberontakan Heimosodat dan Pemberontakan Karelia Timur. Entah tujuannya adalah kemerdekaan Karelia, persatuan rakyat Finlandia, tribalisme sederhana, atau bahkan impian imperialis Finlandia, jelas bahwa agitasi Finlandia adalah penyebabnya."
 AAT_finland_kinship_war.01.a: "Pemberontak mana pun akan ditangani!"
 AAT_finland_kinship_war.02.t: "Pemberontakan Karelia Timur!"
 AAT_finland_kinship_war.02.desc: "Upaya kami untuk menumbuhkan ketidakpuasan terhadap [SOU.GetName] telah membuahkan hasil yang besar. 20.000 warga Karelia Timur melarikan diri ke Finlandia selama Pemberontakan Karelia Timur, dan mereka telah bekerja dengan tekun dalam Komunitas Akademik Karelia untuk mengenang apa yang telah hilang dari mereka. Heimosodat tidak pernah dilupakan, begitu pula perlakuan Karelia di tangan pemerintah Soviet.\n\nSebagai dampaknya, masyarakat Karelia Timur mulai berbicara secara terbuka untuk bangkit melawan penindas mereka. Senjata dan perbekalan telah mengalir ke wilayah tersebut selama beberapa waktu, namun kini mereka menyerukan agar para pengungsi kembali dan mengangkat senjata.\n\nPertanyaannya sekarang, apakah [ROOT.GetName] akan ikut berjuang lagi?"
 AAT_finland_kinship_war.02.a: "Kami sepenuhnya mendukung saudara-saudara Karelia kami!"
 AAT_finland_kinship_war.02.b: "Kami akan mengizinkan agitator Finlandia melintasi perbatasan."
 AAT_finland_kinship_war.03.desc: "Tembakan pertama terdengar pagi ini ketika pemberontak di Karelia Timur, yang dibujuk untuk melakukan tindakan drastis oleh elemen [FIN.GetAdjective], menyerang posisi pemerintah. Masalah telah terjadi di wilayah tersebut selama beberapa waktu, karena senjata telah diselundupkan dari negara tetangga kita yang bermasalah untuk mendukung faksi pemberontak yang ada di sini. [FIN.GetName] tidak pernah senang dengan Perdamaian Tartu yang ditandatangani pada tahun 1920, dan sejak itu mendukung faksi pemberontak di Karelia Timur.\n\nSampai saat ini, keterlibatan mereka masih terbatas, namun sepertinya [FIN.GetName] akhirnya terlibat lebih langsung. Situasi semakin memburuk ketika pasukan [FIN.GetAdjective] melintasi perbatasan sehingga memperluas konflik, dan membawa kedua negara ke dalam keadaan perang."
 AAT_finland_kinship_war.03.a: "Mereka tidak mempunyai peluang melawan kekuatan kita!"
 AAT_finland_kinship_war.04.t: "Pemberontakan Karelia Timur Hancur!"
 AAT_finland_kinship_war.04.desc: "Selama beberapa bulan terakhir, pasukan [FROM.GetAdjective] telah menyelidiki kota-kota di Karelia Timur, berusaha mencari cara untuk mengacaukan wilayah tersebut dan membuat garnisun lokal menjadi kacau, namun perlawanan dari pasukan [SOV.GetAdjective] yang bertahan terlalu kuat.\n\nBanyak agitator Finlandia dan pemberontak Karelia Timur telah ditangkap, dideportasi, atau terpaksa melarikan diri kembali ke Finlandia sebelum pemberontakan sebenarnya dapat direncanakan. Masyarakat ketakutan dan hal ini tidak mungkin lagi terjadi."
 AAT_finland_kinship_war.04.a: "Kita harus membebaskan Karelia Timur dengan cara lain."
 AAT_finland_kinship_war.05.desc: "Selama beberapa bulan terakhir, pasukan [FIN.GetAdjective] telah menyelidiki kota-kota di Karelia Timur, berusaha mencari cara untuk mengacaukan wilayah tersebut dan membuat garnisun lokal kita berada dalam kekacauan, namun perlawanan berani dari pasukan [SOV.Adjective] tentu saja terlalu kuat.\n\nBanyak agitator Finlandia dan pemberontak Karelia Timur telah ditangkap, dideportasi, atau terpaksa melarikan diri kembali ke Finlandia sebelum pemberontakan yang sebenarnya dapat terprovokasi. Masyarakat bersukacita karena perdamaian akhirnya pulih di wilayah tersebut!"
 AAT_finland_kinship_war.05.a: "Semoga Perang Kekerabatan yang lalu, kali ini nyata..."
 AAT_finland_kinship_war_dynamic_modifier_tt: "Sedangkan Pengubah Negara §Y$FIN_anti_soviet_sentiment$§! terdapat pada §Y[215.GetName]§!, §Y[216.GetName]§!, §Y[146.GetName]§! atau §Y[147.GetName]§!, [FROM.GetNameDef] dapat memicu pemberontakan Karelia."
 AAT_finland_kinship_war_rebellion_crushed_fin_tt: "§RPemberontak Karelia telah dihancurkan sebelum pemberontakan dapat diorganisir§!."
 AAT_finland_kinship_war_rebellion_crushed_sov_tt: "§GPemberontak Karelia telah dihancurkan sebelum pemberontakan dapat diorganisir§!."
 AAT_finland_kinship_war.06.t: "Heimosodat Kedua"
 AAT_finland_kinship_war.06.desc: "Ketika lembaga-lembaga sipil di Uni Soviet runtuh, banyak pemerintahan nasionalis lokal yang mendeklarasikan kemerdekaannya, dan [KAR.GetNameDef] adalah salah satunya. Kaum irredentis dan militeris Karelia telah menyatakan bahwa kita akan menghadapi Perang Kekerabatan yang kedua, sementara kaum moderat dan sosialis menyatakan bahwa kita tidak boleh terlibat dalam urusan Soviet."
 AAT_finland_kinship_war.06.a: "Kita harus mengirimkan mereka pasukan dan perlengkapan"
 AAT_finland_kinship_war.06.b: "Seseorang tidak seharusnya membangunkan beruang yang sedang tidur..."
 AAT_finland_the_white_death.1.t: "Penembak Jitu Kami Terbukti Sangat Efektif"
 AAT_finland_the_white_death.1.desc: "Ada laporan yang menyebutkan bahwa penembak jitu kita terbukti sangat efisien dalam melawan pasukan musuh yang menyusup ke dalam hutan kita. Ini adalah kesempatan yang baik untuk propaganda perang, karena istilah Kematian Putih telah bermunculan di kalangan tentara musuh, mengacu pada bahaya yang ditimbulkan oleh alam dan masyarakat Finlandia, dan kita dapat mengaitkan istilah ini pada orang tertentu yang akan menggalang penduduk jika ada yang mendukungnya."
 AAT_finland_the_white_death.1.a: "Erinomaista!"
 AAT_finland_the_white_death.1.b: "Kita harus membagikan lebih banyak senjata kepada para pemburu"
 FIN_our_snipers_will_be_more_deadly_tt: "§YSniper§! kita akan menjadi lebih mematikan"
 aat_news.105.t: "Kematian Putih"
 aat_news.105.desc: "Ketika perang telah mencapai [FIN.GetNameDef], banyak pemburu, milisi Suojeluskunta, dan penembak jitu klub menembak mengangkat senjata untuk melawan penindas mereka. [FIN.GetAdjective] Sisu mengalir melalui mereka saat mereka membendung serangan musuh dengan memanfaatkan sifat [FIN.GetAdjective] untuk keuntungan mereka, sesuatu yang kemudian dikenal oleh tentara musuh sebagai Kematian Putih."
 aat_news.105.a: "Ini adalah kesempatan bagus untuk propaganda!"
 aat_news.105.b: "Kematian telah datang untuk mengambil orang-orang kita, tapi kita tidak akan menyerah tanpa perlawanan!"
 aat_news.105.c: "Mereka pasti tahu cara bertarung"
 AAT_finland_the_white_death.2.t: "[FIN.GetAdjective] Penembak jitu Menaruh Ketakutan di Hati Prajurit kita"
 AAT_finland_the_white_death.2.desc: "Tentara kami melaporkan seluruh barisan pria dikejutkan dan ditembak hingga hancur di hutan [FIN.GetNameDef]. Mereka mulai berbicara tentang Kematian Putih, perwujudan dari dinginnya [FIN.GetNameDef], dan penembak jitu mematikan dari Tentara [FIN.GetAdjective]. Jika kita mau, kita dapat melakukan upaya besar-besaran untuk menghilangkan hambatan-hambatan ini sebelum hal tersebut dapat menyebabkan kerusakan yang lebih besar."
 AAT_finland_the_white_death.2.a: "Tidak perlu khawatir tentang mereka"
 AAT_finland_the_white_death.2.b: "Buru mereka!"
 FIN_we_will_be_more_likely_to_put_down_the_finnish_snipers_tt: "Kemungkinan besar kita akan berhasil memburu §YPenembak Jitu Finlandia§!"
 AAT_finland_the_white_death.4.t: "Simo Häyhä diakreditasi sebagai Kematian Putih"
 AAT_finland_the_white_death.4.desc: "Penembak jitu Viipuri, Simo Häyhä, yang sering disebut oleh tentara kita yang lain sebagai Taika-Ampuja, Sang Penembak Ajaib, karena keahlian menembaknya yang mengesankan, kini juga diakreditasi sebagai Kematian Putih, yang hingga saat ini mengacu pada kekerasan alam Finlandia dan masyarakatnya oleh musuh-musuh kita, dan pers mendorong narasi baru ini dengan kuat. Bagaimana seharusnya sikap resmi kita?"
 AAT_finland_the_white_death.4.a: "Kita harus menyebarkan kisah Pahlawan Finlandia Modern ini"
 AAT_finland_the_white_death.4.b: "Kematian Putih adalah Perwujudan Finlandia, bukan seseorang!"
 AAT_finland_the_white_death.5.t: "Simo Häyhä diakreditasi sebagai Kematian Putih"
 AAT_finland_the_white_death.6.t: "Simo Häyhä diakreditasi sebagai Kematian Putih"
 AAT_finland_the_white_death.7.t: "Kematian Putih Merangkul Kita!"
 AAT_finland_the_white_death.7.desc: "Terlepas dari upaya terbaik prajurit kita, Kematian Putih masih jauh dari tertangkap, dan telah meneror prajurit kita selama berminggu-minggu, dan para perwira kita tidak bisa menunjukkan apa-apa. Saat ini terus berlanjut, prajurit kita goyah dan semangat mereka anjlok..."
 AAT_finland_the_white_death.7.a: "Ini buruk..."
 AAT_finland_the_white_death.8.t: "Meski Kalah Besar, Pasukan Kita Berhasil Menimbulkan Kematian Putih"
 AAT_finland_the_white_death.8.desc: "Laporan dari petugas kami di [FIN.GetNameDef] telah masuk tentang keberhasilan cedera Kematian Putih. Namun hal ini harus dibayar mahal, karena banyak tentara yang terbunuh, dan lebih banyak lagi yang terluka dalam perjalanannya. Meski begitu, kita tidak perlu bertemu dengannya lagi di medan perang."
 AAT_finland_the_white_death.8.a: "Kita sudah terbebas dari lalat yang mengganggu!"
 AAT_finland_the_white_death.9.t: "Meskipun Kerugian Besar, Pasukan Kami berhasil membunuh The White Death!"
 AAT_finland_the_white_death.9.desc: "Laporan dari petugas kami di [FIN.GetNameDef] telah masuk tentang keberhasilan eliminasi penembak jitu [FIN.GetAdjective] yang dikenal sebagai Kematian Putih. Meski menimbulkan banyak korban jiwa, musuh besar [ROOT.GetNameDef] telah berhasil disingkirkan, dan tentara kita kini bisa tenang."
 AAT_finland_the_white_death.9.a: "Kenyataannya, dia tidak punya peluang melawan kami"
 AAT_finland_the_white_death.10.t: "Kematian Putih Terus Mengintai Mangsanya"
 AAT_finland_the_white_death.10.desc: "Meskipun terdapat banyak klaim palsu dan hampir tidak ada, Simo Häyhä tidak tergores, dan akan terus berjuang selama diperlukan darinya. Kematian Putih merangkul musuh kita!"
 AAT_finland_the_white_death.10.a: "Mereka akan mengetahui ketakutan yang sebenarnya"
 AAT_finland_the_white_death.11.t: "Simo Häyhä telah terluka dan dibawa keluar dari medan perang"
 AAT_finland_the_white_death.11.desc: "Ada laporan bahwa Häyhä terluka parah setelah peluru peledak yang ditembakkan oleh tentara musuh mengenai rahang kiri bawahnya, dan meskipun dianggap sudah mati, ia berhasil kembali ke base camp terdekat untuk melaporkan keselamatannya. Namun dia tidak bisa terus berjuang, tapi dia telah melakukan pelayanan yang cukup untuk rasa terima kasih yang abadi dari orang-orang [FIN.GetAdjective]."
 AAT_finland_the_white_death.11.a: "Meski begitu, dia adalah Pahlawan Finlandia sejati!"
 AAT_finland_the_white_death.12.t: "Simo Häyhä telah terbunuh!"
 AAT_finland_the_white_death.12.desc: "Ada laporan bahwa Häyhä terbunuh setelah terkena peluru peledak yang ditembakkan oleh tentara musuh saat terlibat dalam pertempuran. Jenazahnya telah berhasil diambil oleh jaeger kami, dan dia telah dibawa kembali ke ibu kota. Dia akan dikenang selamanya oleh orang-orang [FIN.GetNameDef] yang selalu bersyukur."
 AAT_finland_the_white_death.12.a: "Semoga jiwanya beristirahat di antara para pahlawan masa lalu"
 generic_could_lead_to_tt: "Dapat menyebabkan:"
 ###################
 ### NEWS EVENTS ###
 ###################
 aat_news.100.t: "Perang Lanjutan [FIN.GetAdjective]"
 aat_news.100.desc: "Menyusul kekalahan mereka dalam perang sebelumnya melawan pemerintah [SOV.GetAdjective], masyarakat [FIN.GetAdjective] kini telah memobilisasi dan bersiap untuk merebut kembali wilayah yang mereka hilangkan, dan membebaskan masyarakat [FIN.GetAdjective] dan [KAR.GetAdjective] dari penindasan asing, sebagai penerus spiritual dari Perang Kemerdekaan [FIN.GetAdjective] dan Heimosodat."
 aat_news.100.a: "Maju menuju kemenangan akhir!"
 aat_news.100.b: "Dan mereka tidak akan bertarung sendirian!"
 aat_news.100.c: "Finlandia akan membayarnya!"
 aat_news.100.d: "Namun boneka [GER.GetLeader] lainnya bergabung dalam perang..."
 aat_news.101.t: "Remiliterisasi Kepulauan Åland"
 aat_news.101.desc: "Menyusul kekalahan Rusia dalam Perang Krimea, kepulauan Åland telah didemiliterisasi, dan penduduknya dibebaskan dari segala bentuk wajib militer. Meskipun status ini telah diperebutkan berkali-kali, status ini masih diberlakukan oleh banyak negara besar di dunia. Namun sekarang, setelah Operasi [FIN.GetAdjective] Kilpapurjehdus, pulau-pulau tersebut kembali dimiliterisasi."
 aat_news.101.a: "Ini adalah tindakan yang perlu."
 aat_news.101.b: "Itu tidak akan menghentikan kita."
 aat_news.101.c: "Kedamaian tidak bisa bertahan..."
 aat_news.666.t: "Pemulihan Kekaisaran Laut Utara"
 aat_news.666.desc: "Setelah merebut kembali seluruh wilayah yang pernah dikuasai oleh Cnut Agung, pemerintah [From.GetOldAdjective] kini mulai meningkatkan upaya menuju integrasi wilayah yang baru ditaklukkan. Akibatnya, dalam upaya menggalang rakyat untuk mendukung negara, terjadi peningkatan propaganda pan-nasionalis dengan dukungan jelas dari pemerintah.\n\nPemimpin [FROM.GetOldAdjective] [FROM.GetLeader] telah mendeklarasikan bahwa Persatuan Alam [DEN.GetOldNameDef], [NOR.GetOldNameDef], dan Inggris mulai sekarang akan dikenal sebagai '[From.GetNameDef]'."
 aat_news.666.a: "Tampaknya para Viking telah kembali"
 aat_news.777.t: "Pembentukan Kekaisaran Laut Baltik"
 aat_news.777.desc: "Setelah berhasil menaklukkan sebagian besar wilayah Laut Baltik, pemerintah [From.GetOldAdjective] kini mulai meningkatkan upaya menuju integrasi wilayah yang baru ditaklukkan. Akibatnya, dalam upaya menggalang masyarakat untuk mendukung negara, terjadi peningkatan propaganda pan-nasionalis dengan dukungan jelas dari pemerintah.\n\nPemimpin [FROM.GetOldAdjective] [FROM.GetLeader] memberikan pidato tentang bagaimana [FROM.GetOldNameDef] berhasil melakukan apa yang tidak dapat dilakukan negara lain dan menjadikan Laut Baltik di bawah kekuasaannya. [FROM.GetSheHeCap] mengakhiri pidatonya dengan mengumandangkan pembentukan '[From.GetNameDef]'."
 aat_news.777.a: "Dominium maris baltici"
#######################
###  NARVIK EVENTS  ###
#######################
 AAT_britain_narvik.1.t: "[SWE.GetAdjective] ranjau telah diledakkan"
 AAT_britain_narvik.1.desc: "Kami telah berhasil meledakkan tambang [SWE.GetAdjective] dan merampok [GER.GetNameDef] salah satu sumber daya impor terpentingnya. Meskipun janji bantuan kepada [FIN.GetName] sebagai motivasi utama upaya ini, konflik langsung dengan [SOV.GetNameDef] tidak pernah bisa dilakukan dan kita telah memberikan pukulan telak kepada musuh utama kita. Kami tidak memiliki musuh nyata di [SWE.GetNameDefCap], dan sekarang perlu memutuskan apa yang harus dilakukan selanjutnya."
 AAT_britain_narvik.1.a: "Menarik diri"
 AAT_britain_narvik.1.b: "Lanjutkan kampanye"
 AAT_britain_narvik.2.t: "[ENG.GetName] menyerang [SWE.GetName]"
 AAT_britain_narvik.2.desc: "[ENG.GetAdjective] pasukan telah melintasi perbatasan ke [SWE.GetName]. Dengan tidak adanya deklarasi perang, sikap diam dari pemerintah [ENG.GetAdjective], pihak berwenang [SWE.GetAdjective] marah karena kurangnya rasa hormat terhadap kedaulatan [SWE.GetAdjective]. Penjelasan yang paling mungkin untuk hal ini adalah bahwa pasukan [ENG.GetAdjective] berusaha mencapai tambang di Gällivare dan Kiruna untuk menyabotase mereka guna mencegah bijih bermutu tinggi mencapai [GER.GeName], yang akan menjadi pukulan besar bagi perekonomian [GER.GetAdjective] dan [SWE.GetAdjective] serta pelanggaran besar terhadap netralitas [SWE.GetAdjective]."
 AAT_britain_narvik.2.a: "Beraninya mereka?!"
 AAT_britain_narvik.2.b: "Kita harus menghentikan mereka!"
 AAT_britain_narvik.3.t: "[ENG.GetName] sabotase [SWE.GetAdjective] ranjau"
 AAT_britain_narvik.3.desc: "[ENG.GetNameDefCap] telah menginvasi [SWE.GetName] secara ilegal dan menghancurkan ranjau mereka, tanpa pernyataan perang yang sesuai. Mesin perekonomian utama perekonomian [SWE.GetAdjective] kini hanyalah sebuah tambang yang hancur. Pemerintah [ENG.GetAdjective] telah membela tindakan mereka dengan menyatakan bahwa berdagang dengan [GER.GetNameDefCap] sama buruknya dengan memihak mereka, dan bahwa tindakan tersebut dapat dibenarkan, namun nampaknya bahkan penduduk domestik mereka pun merasa tidak nyaman dengan penjelasan pemerintah mereka."
 AAT_britain_narvik.3.a: "Ini adalah suatu kebiadaban"
 AAT_britain_narvik.4.t: "[ENG.GetName] menarik diri dari [SWE.GetName]"
 AAT_britain_narvik.4.desc: "[ENG.GetName] telah mengumumkan bahwa tujuan strategisnya di [SWE.GetName] telah tercapai dan sedang menarik pasukannya. Pemerintahnya juga menegaskan kembali bahwa mereka tidak mempunyai permusuhan nyata terhadap negara [SWE.GetAdjective], dan bahwa tindakan mereka di [SWE.GetName] adalah murni untuk kepentingan pertahanan demokrasi. Baik kedutaan [GER.GetAdjective] maupun [SWE.GetAdjective] telah menyampaikan surat protes, pihak [GER.GetAdjective] berargumen bahwa [ENG.GetName] melanggar netralitas dan menyerbu negara asing di zona pertempuran, dan [SWE.GetAdjective] mengecam pemerintah [ENG.GetAdjective] yang meskipun memiliki tujuan mulia untuk membantu [FIN.GetName], kini jelas bahwa hal tersebut merupakan taktik yang dibangun dengan buruk untuk mencapai tujuan mereka. kepentingannya sendiri, dengan mengorbankan [SWE.GetAdjective] nyawa."
 AAT_britain_narvik.4.a: "Ini masih merupakan suatu kebiadaban"
