l_braz_por:
#########
        # NORDIC SHARED #
########
 AAT_nordic_shared.1.t: "[FROM.GetName] mengundang kami untuk bergabung dengan mereka di [NORDIC_get_alliance_name]"
 AAT_nordic_shared.1.desc_faction_member: "[FROM.GetNameDefCap] ingin membawa aliansi kita selangkah lebih maju, dan memperdalam kerja sama kita di beberapa tingkatan. Mereka melihat aliansi militer hanya sebagai langkah awal menuju kawasan Nordik yang lebih kuat dan bersatu."
 AAT_nordic_shared.1.desc_non_faction_member: "[FROM.GetNameDefCap] berupaya membangun kerja sama yang mendalam antara semua negara Nordik. Mereka ingin membuat [NORDIC_get_alliance_name] dan mengundang kami untuk bergabung dalam hal ini."
 AAT_nordic_shared.1.a: "Kerja sama yang erat adalah cara untuk bertahan hidup"
 AAT_nordic_shared.1.b: "Kedengarannya terlalu berbahaya, sebaiknya kita menjauh"
 AAT_nordic_shared.2.t: "[FROM.GetName] Mengusulkan Jaminan Bersama"
 AAT_nordic_shared.2.desc: "Ketika ketegangan meningkat di seluruh dunia, menemukan sekutu yang dapat dipercaya menjadi semakin sulit. Pemerintah [FROM.GetAdjective] mengusulkan bahwa, sebagai sesama negara Nordik, kami mengumumkan kepada dunia bahwa [ROOT.GetName] dan [FROM.GetName] akan saling membela jika terjadi invasi asing. Apakah kita nyaman melakukan hal ini?"
 AAT_nordic_shared.2.a: "Ini mungkin satu-satunya cara untuk bertahan hidup"
 AAT_nordic_shared.2.b: "Kami tidak akan membiarkan mereka menyeret kami bersama mereka"
 AAT_nordic_shared.3.t: "[FROM.GetName] akan mendukung kami!"
 AAT_nordic_shared.3.desc: "Kami mendapat kabar bahwa masyarakat [FROM.GetAdjective] akan mempertahankan kemerdekaan [ROOT.GetName], dan kami pada gilirannya akan mempertahankan kemerdekaan mereka. Negara-negara Nordik harus siap untuk menghalau invasi apa pun sebagai kekuatan yang bersatu, bukan sebagai negara-negara kecil yang terpecah-belah."
 AAT_nordic_shared.3.a: "Berita bagus!"
 AAT_nordic_shared.4.t: "Proposisi kami telah ditolak oleh [FROM.GetName]"
 AAT_nordic_shared.4.desc: "Sejarah bersama selama berabad-abad tampaknya tidak banyak berpengaruh dalam meyakinkan pemerintah [FROM.GetAdjective] bahwa rakyat kita harus bersatu melawan tiran asing. Semoga saja mereka berubah pikiran sebelum terlambat."
 AAT_nordic_shared.4.a: "Berita sedih"
 AAT_nordic_cooperation.1.t: "[FROM.GetNameDef] telah melewati batas!"
 AAT_nordic_cooperation.1.desc: "Berkali-kali, kami menemukan bukti bahwa upaya perang kami melawan [?GLOBAL.NORDIC_country_to_defend.GetName] dihalangi oleh dukungan diam-diam [FROM.GetName].\n\nMungkin inilah saat yang tepat untuk memberi mereka pelajaran tentang cara berperang yang sebenarnya."
 AAT_nordic_cooperation.1.a: "Kita tidak bisa membiarkan konflik ini semakin meningkat"
 AAT_nordic_cooperation.1.b: "Mereka sudah mati, hanya saja mereka belum mengetahuinya"
 AAT_nordic_cooperation.2.t: "[FROM.GetName] menawarkan bantuan mereka dalam upaya perang kita"
 AAT_nordic_cooperation.2.desc: "Di masa-masa berbahaya ini, ikatan yang mengikat kita dengan [FROM.GetNonIdeologyName] sangatlah berharga. Mereka telah memberikan dukungannya dalam perang kita melawan [?NORDIC_attacker.GetName], dan sekarang mereka bersedia bekerja lebih keras dan menawarkan diri untuk ikut membela negara kita. Bagaimanapun, serangan terhadap salah satu dari kita adalah serangan terhadap seluruh negara Nordik."
 AAT_nordic_cooperation.2.a: "Bantuan mereka sangat diharapkan"
 AAT_nordic_cooperation.2.b: "Kita bisa mengatasinya tanpa mereka"
 AAT_nordic_cooperation.3.t: "[FROM.GetName] Menolak Tawaran Bantuan Kami"
 AAT_nordic_cooperation.3.desc: "Terlepas dari niat terbaik kami, tampaknya [FROM.GetNameDef] tidak membutuhkan atau menginginkan bantuan kami. Hanya mereka yang mengetahui alasan di balik keputusan yang membingungkan ini.\n\nIni tidak berarti kita harus berhenti mendukung mereka dengan cara lain, atau [?FROM.NORDIC_attacker.GetName] dapat memutuskan untuk menganggap kita sebagai pihak yang berperang."
 AAT_nordic_cooperation.3.a: "Oh baiklah..."
 AAT_nordic_cooperation.4.t: "[FROM.GetName] Mencari Investasi"
 AAT_nordic_cooperation.4.desc: "Tetangga kami di wilayah Nordik telah mengirimkan delegasi untuk mencari investasi guna mengembangkan perekonomian mereka lebih lanjut. Hal ini tentunya juga akan menguntungkan sektor industri kita, namun kita harus memastikan bahwa kita mendukung negara tetangga yang ramah dan bukannya musuh potensial."
 AAT_nordic_cooperation.4.a: "Ini menguntungkan kami berdua"
 AAT_nordic_cooperation.4.b: "Itu tidak sebanding dengan risikonya"
 AAT_nordic_cooperation.5.t: "Investasi [FROM.GetName] Kini Meningkat"
 AAT_nordic_cooperation.5.desc: "Negara-negara tetangga kita di wilayah Nordik telah bermurah hati menerima undangan kita untuk berinvestasi dalam perekonomian kita. Tentu saja mereka akan dihargai atas kepercayaan mereka, namun yang lebih penting, hal ini akan membuat perekonomian kita tumbuh lebih cepat."
 AAT_nordic_cooperation.5.a: "Berita bagus!"
 AAT_nordic_cooperation.6.t: "[FROM.GetName] Menolak Berinvestasi dalam Perekonomian Kita"
 AAT_nordic_cooperation.6.desc: "Meskipun kami telah melakukan upaya terbaik, kami tidak dapat meyakinkan tetangga kami di wilayah Nordik untuk membantu kami mengembangkan perekonomian lebih lanjut. Tentu saja, kami selalu dapat mencoba lagi dengan negara lain."
 AAT_nordic_cooperation.6.a: "Sayangnya"
 AAT_nordic_cooperation.7.t: "[FROM.GetName] Mengupayakan Kerjasama Ekonomi"
 AAT_nordic_cooperation.7.desc: "Negara-negara tetangga kita di kawasan Nordik ingin menemukan titik temu guna membangun perjanjian yang saling menguntungkan untuk kerja sama ekonomi dan industri. Jika dilakukan dengan benar, seperti yang kita harapkan, hal ini akan meningkatkan perekonomian kedua negara secara setara, karena kita akan memasuki kedua negara secara setara.\n\nMengingat sejarah pasang surut permusuhan di wilayah kita, kita harus berhati-hati dalam memberikan keuntungan kepada pesaing kita di masa depan, jika mereka berbalik dari kita."
 AAT_nordic_cooperation.7.a: "Kesepakatan yang adil"
 AAT_nordic_cooperation.7.b: "Tampaknya mencurigakan"
 AAT_nordic_cooperation.8.t: "[FROM.GetName] telah menerima kesepakatan kita"
 AAT_nordic_cooperation.8.desc: "Kami baru saja diberitahu bahwa para pemimpin [FROM.GetAdjective] telah menyetujui kesepakatan yang saling menguntungkan. Hal ini akan berdampak baik bagi perekonomian kita dan kawasan Nordik secara umum."
 AAT_nordic_cooperation.8.a: "Berita Hebat!"
 AAT_nordic_cooperation.9.t: "Para pemimpin [FROM.GetName] telah menolak tawaran kami!"
 AAT_nordic_cooperation.9.desc: "Meskipun tujuan kami adalah menangani [FROM.GetName] secara setara, mereka telah memberi tahu kami bahwa mereka tidak tertarik dengan pengaturan seperti itu.\n\nKami selalu dapat mencoba lagi, atau dengan rekan Nordik lainnya."
 AAT_nordic_cooperation.9.a: "Membingungkan"
  NORDIC_escalation_hostility_reason: "Membantu membela negara Nordik"
#########
        # NORWAY #
########
 AAT_norway.1.t: "Fasis Melecehkan [NOR_lev_trotsky.GetName]"
 AAT_norway.1.desc: "Saat sang revolusioner yang kontroversial sedang pergi memancing bersama tuan rumahnya, kaum fasis yang terkait dengan partai Nasjonal Samling menerobos masuk ke rumah Konrad Knudsen, tempat Trotskij tinggal.\n\nPara pencuri mencari bukti yang memberatkan untuk menyingkirkan komunis yang diasingkan, namun untungnya mereka ditakuti oleh putri Knudsen, Hjørdis, sebelum mereka bisa mengambil apa pun darinya. signifikansi."
 AAT_norway.1.a: "Dia harus dijauhkan dari masalah"
 AAT_norway.1.b: "Kita bisa membunuh dua burung dengan satu batu"
 AAT_norway.1.c: "Berikan orang ini sebuah kantor!"
 AAT_norway.1.d: "Masa lalunya adalah semua bukti yang kita butuhkan, penjarakan dia!"
 AAT_norway.2.t: "Trotskij Ditahan di Rumah di Peternakan"
 AAT_norway.2.desc: "Mengutip pelanggaran perjanjian untuk menghindari partisipasi politik selama pengasingannya, dan sedikit bukti yang dicuri oleh pencuri fasis, kami telah mengirim [NOR_lev_trotsky.GetName] dalam perjalanan ke sebuah peternakan di Hurum, di mana dia akan berada di bawah pengawasan polisi dan diisolasi dari dunia luar.\n\nIni adalah hukuman yang berat, tetapi tekanan dari [SOU.GetNameDef] dan fasis lokal menjadikannya tempat berkumpul yang berbahaya."
 AAT_norway.2.a: "Itu yang terbaik yang bisa kami lakukan saat ini"
 AAT_norway.3.t: "Tindakan keras umum [ROOT.GetLeader.GetName] terhadap perbedaan pendapat"
 AAT_norway.3.desc: "Setelah pertengkaran di vila Knudsen, menjadi jelas bahwa situasi politik penuh dengan bahaya karena Komunis dan Fasis saling serang.\n\nPertengkaran dan kekacauan politik harus diatasi. Kehadiran Trotskij berisiko menimbulkan kemarahan [SOU.GetNameDef] pada kita dan pada saat yang sama, Nasjonal Samling pasti akan menyerahkan negara kepada [FGR.GetLeader] pada kesempatan pertama, sehingga pengaruh mereka perlu dibatasi dengan cara apa pun.\n\nTindakan terbaik adalah mengirimnya ke Meksiko, di mana [MEX.GetLeader] telah setuju untuk mengizinkannya masuk ke negara tersebut."
 AAT_norway.3.a: "Ini demi kelangsungan hidup Norwegia"
 AAT_norway.4.t: "Trotskij bergabung dengan pemerintahan kita!"
 AAT_norway.4.desc: "Solusi terhadap kesengsaraan rakyat [NOR.GetAdjective] sudah ada di depan mata kita. [NOR_lev_trotsky.GetName] bukan hanya salah satu penulis Marxis terhebat di zaman kita, tetapi juga seorang revolusioner karismatik dan seorang jenderal yang luar biasa.\n\nHal ini tentu akan menimbulkan ketegangan dengan [SOV.GetNameDef], tetapi itu akan bermanfaat. Bagaimanapun, pengalamannya dapat membawa bangsa muda kita, dan para pekerja di Skandinavia menuju kejayaan."
 AAT_norway.4.a: "Pengasingan suatu negara adalah penyelamat negara lain!"
 AAT_norway.5.t: "[NOR_lev_trotsky.GetName] dipenjara!"
 AAT_norway.5.desc: "Pihak lain mungkin menyebut bukti yang ditemukan di rumah Knudsen tidak jelas, tidak penting, atau bahkan dibuat-buat, dan bukti tersebut bisa saja benar, namun mungkin pada titik tertentu, dalam kondisi tertentu, hakim akan menerima keabsahan bukti tersebut. Selain itu, faktanya kita tidak bisa mengambil risiko mengasingkan Nasjonal Samling saat ini. Inilah sebabnya mengapa [NOR_lev_trotsky.GetName] ditahan, dan berlaku segera.\n\nKapan, atau bagaimana, dia akan kembali bersinar adalah masalah yang tidak terlalu penting saat ini, tetapi kami akan memastikan dia setidaknya mendapatkan akomodasi yang lebih baik daripada di Siberia."
 AAT_norway.5.a: "Dia harus dihentikan"
 AAT_norway.6.t: "Nasib Trotskij"
 AAT_norway.6.desc: "Sudah lama sejak kami menjadikan [NOR_lev_trotsky.GetName] sebagai tahanan rumah di sebuah peternakan di Hurum, dan sepertinya ini bukan pengaturan yang baik bagi pihak mana pun yang terlibat. [SOV.GetNameDefCap] menginginkan ekstradisi, Nasjonal Samling ingin dia digantung, dan semua orang yang bukan penganut trotskyis ingin dia keluar. Kita perlu memutuskan apa yang harus dilakukan dengan pengasingan yang menyusahkan ini.\n\nPresiden Meksiko [MEX.GetLeader] telah menawarkan untuk menerima dia jika kita memilih untuk membiarkan dia melanjutkan pengasingannya, tapi kita juga bisa mengirim dia ke [SOV.GetLeader] sebagai tanda persahabatan."
 AAT_norway.6.a: "Dia akan menikmati sinar matahari Meksiko"
 AAT_norway.6.b: "Stalin akan menyukai kita karena ini!"
 AAT_norway.7.t: "[get_trotsky_lastname] Tiba di Meksiko"
 AAT_norway.7.desc: "Setelah bertahun-tahun pengasingan yang canggung di negara kita, pengasingan yang merepotkan [NOR_lev_trotsky] telah tiba di Meksiko, di mana ia akan dijamu oleh pelukis Frida Kahlo dan Diego Rivera, yang pasti akan rukun dengan dia dan istrinya.\n\nDia mungkin akan aman dari [SOV.GetNameDef], tetapi yang terpenting, dia tidak akan menjadi masalah kita lagi."
 AAT_norway.7.a: "Akhirnya kedamaian"
 AAT_norway.8.t: "[get_trotsky_lastname] Tiba di Moskow"
 AAT_norway.8.desc_SOV: "Kami telah memimpikan momen ini selama bertahun-tahun. Ular pengkhianat [SOV_lev_trotsky.GetName] ada di tangan kita. Dia akan membayar kejahatannya terhadap Revolusi, dan yang paling penting, terhadap Kamerad Stalin. Bukan berarti ada perbedaan di mata kaum proletar."
 AAT_norway.8.desc_NOR: "Mantan revolusioner bermasalah [NOR_lev_trotsky.GetName] dibawa ke Moskow, di mana dia akan ditahan, atau mungkin dieksekusi tergantung pada keinginan [SOU.GetLeader].\n\nTerlepas dari nasibnya, kita akhirnya bisa lepas tangan dari urusan yang berkepanjangan ini, dengan keuntungan tambahan karena semakin dekat dengan [SOU.GetNameDef]."
 AAT_norway.8.a: "Akhirnya!"
 AAT_norway.8.b: "Pembebasan yang bagus!"
 AAT_norway.9.t: "Kabinet Nygaardsvold"
 AAT_norway.9.desc: "Pemerintahan yang dipimpin oleh Partai Buruh, dengan [NOR_johan_nygaardsvold.GetName] sebagai pemimpinnya, adalah pemerintahan stabil pertama dengan mayoritas yang pernah dimiliki oleh negara muda kita. Kabinet telah bekerja keras selama setahun terakhir, mendorong diambilnya langkah-langkah yang, meskipun perlahan, akan membantu [NOR.GetName] keluar dari krisis ekonomi yang parah yang dialami negara saat ini, menjamin kesejahteraan masyarakat yang tinggal di dalamnya.\n\nTentu saja, langkah-langkah ini mengorbankan persiapan militer apa pun yang mungkin kita perlukan jika kita dilanda perang. Kami hanya bisa berharap ini tidak diperlukan."
 AAT_norway.9.a: "Hanya perdamaian dan stabilitas di depan!"
 AAT_norway.10.t: "Storting Tersandung"
 AAT_norway.10.desc: "Ketika perang di Eropa semakin tak terhindarkan, parlemen [NOR.GetAdjective], atau Storting, diguncang oleh gelombang kekacauan dan perselisihan. Indikasi bahwa kabinet Nygaardsvold akan menghasilkan era stabilitas sudah lama terlupakan, karena para anggota parlemen tampaknya tidak dapat menyepakati langkah-langkah yang koheren untuk mengarahkan [NOR.GetName] dengan aman melewati badai yang akan datang.\n\nSementara itu, musuh-musuh rakyat mengasah pisau mereka untuk berpesta pora, berkembang hingga [NOR.GetName] dilalap api perang."
 AAT_norway.10.a: "Seberapa cepat kejatuhan kita?"
 AAT_norway.11.t: "Masyarakat [ROOT.GetName] Sudah Bangun!"
 AAT_norway.11.desc: "Setelah berabad-abad ditaklukkan oleh negara-negara Skandinavia lainnya, kemudian diserahkan kepada belas kasihan kaum industrialis kapitalis, rakyat [ROOT.GetNonIdeologyName] belajar untuk berdiri bersama melawan penindas mereka dan menolak hegemoni mereka.\n\nSekarang [ROOT.GetAdjective] sedang mencari inspirasi untuk revolusi mereka!"
 AAT_norway.11.a: "Orang-orang di negeri kuno ini tidak lagi tertidur!"
 AAT_norway.12.t: "Tidak Ada Suara Percaya Diri Terhadap Johan Nygaardsvold"
 AAT_norway.12.desc: "Terlepas dari janji awalnya, tampaknya pemerintahan yang dibentuk Johan Nygaardsvold tahun lalu tidak hanya gagal mewujudkannya, tetapi juga sangat ingin melakukan pelucutan senjata. Banyak anggota parlemen percaya bahwa [ROOT.GetName] harus mengembangkan industrinya sedemikian rupa sehingga memungkinkan investasi pada angkatan bersenjata [NOR.GetAdjective] yang masih baru, dengan tujuan untuk menghalangi kekuatan asing melakukan invasi.\n\nDan dengan demikian, mosi tidak percaya dipicu oleh anggota partai konservatif, Høyre. Meskipun ketuanya, industrialis Johan H. Andresen sudah mempertimbangkan untuk pensiun, dia memanfaatkan kesempatan untuk memimpin Norwegia ke arah yang baru; menampilkan dirinya sebagai alternatif pragmatis dan efisien terhadap impian kemajuan sosial Nygaardsvold."
 AAT_norway.12.a: "Nygaardsvold keluar, Andresen masuk"
 AAT_norway.13.t: "Kudeta Quisling"
 AAT_norway.13.desc: "Sementara kita sibuk memajukan perekonomian dan mengawasi kaum fasis di luar negeri, kita membiarkan fasisme dalam negeri memburuk, tepat di depan mata kita. Meskipun basis dukungannya semakin berkurang dan partainya, Nasjonal Samling, tidak pernah mendapatkan satu kursi pun dalam storting, Vidkun Quisling membentuk pemerintahan yang didukung [?NOR.NOR_cw_fascist_attacker.GetAdjective], dan mengklaim telah merebut kekuasaan di [ROOT.GetNonIdeologyName]."
 AAT_norway.13.a: "Waktu Quisling akhirnya tiba!"
 AAT_norway.13.b: "Orang-orang [ROOT.GetNonIdeologyName] tidak akan pernah memaafkanmu, pengkhianat."
 AAT_norway.13.c: "Kita harus melakukan segala daya kita untuk menunda mereka!"
 AAT_norway.14.t: "Kolaborator yang berguna"
 AAT_norway.14.desc: "Vidkun Quisling, yang selama bertahun-tahun menjadi pendukung terbesar Fasisme di [NOR.GetNonIdeologyName], telah menawarkan bantuannya dalam invasi kami ke tanah airnya.\n\nDia ingin melancarkan kudeta di Oslo dengan dukungan kami, dan membangun rezim yang bersahabat dengan [ROOT.GetNameDef]. Setelah diselesaikan, dia akan membuka jalan invasi kita dan melegitimasi pendudukan [ROOT.GetAdjective] di [NOR.GetName]."
 AAT_norway.14.a: "Dia akan berguna"
 AAT_norway.14.b: "Badut ini? Kami akan mengurus [NOR.GetNonIdeologyName] sendiri."
 AAT_norway.15.t: "Kudeta Quisling Tidak Dapat Dihindari Sekarang!"
 AAT_norway.15.desc: "Terlepas dari upaya terbaik kami, Vidkun Quisling telah melancarkan upayanya untuk merebut kekuasaan di Oslo. Dengan dukungan dari kaum fasis yang menyerang, dia menyiarkan proklamasinya tentang pemerintahan baru, yang didedikasikan untuk berkolaborasi dengan musuh-musuh kita.\n\nTidak ada cara untuk mengatasi hal ini, kita telah kalah sebelumnya dan kudeta ini hanya akan memperburuk upaya perang kita."
 AAT_norway.15.a: "Sayangnya, masa depan [NOR.GetName] mungkin menjadi milik Quisling"
 AAT_norway.15.b: "Kami akan terus berjuang!"
 AAT_norway.16.t: "Kami diasingkan tetapi tidak dengan tangan kosong"
 AAT_norway.16.desc: "Terlepas dari kemunduran kita yang tragis dari [NOR.GetName], setidaknya kita dapat menemukan penghiburan dalam kenyataan bahwa para pemimpin kita memiliki pandangan jauh ke depan untuk mempersiapkan sumber daya yang terburuk dan dialihkan untuk membantu kita dalam merebut kembali wilayah [NOR.GetAdjective].\n\nAlat-alat ini seharusnya memudahkan kita untuk memulai pengembaraan ke pantai kita yang dulu."
 AAT_norway.16.a: "Kami akan kembali!"
 AAT_norway.17.t: "[NOR.GetAdjective] Tuntutan Teritorial"
 AAT_norway.17.desc_monarchist: "Mengutip dokumen berusia berabad-abad, mahkota [FROM.GetAdjective] mengklaim bahwa kita mengendalikan wilayah yang merupakan bagian De Jure dari gelar kerajaan yang diwarisi oleh Raja Haakon VII dari Norwegia.\n\nLebih khusus lagi, mereka mengacu pada [GetNorwegianClaims]."
 AAT_norway.17.desc_fascist: "Pemimpin [NOR.GetNameDef] menuntut agar kami menyerahkan sebagian wilayah kami kepada mereka, dan menyebutnya sebagai upaya merebut kembali tanah leluhur masyarakat mereka. Benar saja, mereka mengancam perang jika kami menolak.\n\nTanah yang dimaksud adalah [GetNorwegianClaims]."
 AAT_norway.17.desc_denmark: "Seorang punggawa Raja Haakon VII dari Norwegia, atau seperti yang pernah kita kenal, Pangeran Carl dari Denmark, telah mengajukan permintaan serius kepada kami. Menurut mereka, dan kumpulan dokumen lama yang asal usulnya meragukan membuktikan bahwa Denmark adalah bagian sah dari Kerajaan Norwegia, dan bukan milik Denmark.\n\nMereka juga mengisyaratkan akan mengambilnya dengan paksa jika kami menolak, dengan menyatakan bahwa itu demi keselamatan kami sendiri."
 AAT_norway.17.a: "Kami tidak punya pilihan"
 AAT_norway.17.b: "Tidak masuk akal!"
 GetNorwegianClaims_iceland: "Islandia, bersikeras bahwa mereka secara salah disimpan oleh Kerajaan Denmark ketika Rumah Kerajaan Norwegia saat ini dibentuk"
 GetNorwegianClaims_greenland: "Greenland, atau Tanah Eirik Raudes, begitu mereka menyebutnya. Menurut mereka, itu seharusnya diberikan ketika Raja Haakon diangkat menjadi Raja Norwegia"
 GetNorwegianClaims_faroes: "Kepulauan Faroe, yang mereka anggap sebagai bagian dari gelar mahkota mereka"
 GetNorwegianClaims_sweden: "negara bagian Bohuslän, Dalarna dan Jämtland; yang menurut mereka dicuri oleh mahkota Swedia"
 GetNorwegianClaims_bjarmeland: "wilayah di sekitar laut putih yang mereka klaim pertama kali ditempati oleh nenek moyang viking mereka, dan mereka menyebutnya Bjarmeland"
 GetNorwegianClaims_ireland: "daerah Leinster, yang menurut mereka, dijajah oleh nenek moyang Viking mereka terlebih dahulu"
 GetNorwegianClaims_scotland: "Kepulauan Shetland dan Dataran Tinggi Skotlandia, yang mereka klaim sebagai milik mereka berdasarkan penaklukan nenek moyang Viking mereka"
 GetNorwegianClaims_vinland: "Vinland, yang kita kenal sebagai Newfoundland dan Labrador, bersikeras bahwa fakta bahwa nenek moyang mereka yang viking menemukannya pertama kali memberi mereka klaim untuk memilikinya."
 GetNorwegianClaims_denmark: "sebenarnya seluruh Denmark, sebuah klaim yang berani"
 AAT_norway.18.t: "[FROM.GetName] Telah Menerima Permintaan Kami"
 AAT_norway.18.desc_monarchist: "Kami telah berhasil menunjukkan kepada negara [FROM.GetAdjective] bahwa klaim kami benar, sehingga mereka setuju untuk menyerahkan tanah yang kami klaim kepada mahkota kami."
 AAT_norway.18.desc_fascist: "Pemerintahan [FROM.GetAdjective] yang lemah telah bergeming, dan dengan demikian akan membiarkan kami mengambil alih wilayah yang menjadi milik kami dengan kekerasan atau hak."
 AAT_norway.18.a: "Selamat datang di flip"
 AAT_norway.19.t: "[FROM.GetName] Menolak Permintaan Kami!"
 AAT_norway.19.desc_monarchist: "Prestise mahkota kami mengalami pukulan hebat, karena [FROM.GetName] telah menolak klaim teritorial kami yang sah. Ini sama saja dengan penghinaan terhadap Mahkota [ROOT.GetAdjective] dan tidak boleh ditoleransi."
 AAT_norway.19.desc_fascist: "Jelas sekali, negara bagian [FROM.GetAdjective] tidak tahu siapa yang mereka tolak. Kami tidak akan berdiam diri sementara tanah kami yang sah dikuasai oleh mereka. Satu-satunya pilihan kami sekarang adalah mengambilnya dengan paksa."
 AAT_norway.19.a: "Mereka akan membayar atas kekurangajaran mereka"
 AAT_norway.20.t: "Ratu Kita Telah Meninggal!"
 AAT_norway.20.desc: "Saat mengunjungi keluarganya di Inggris, dia meninggal secara tragis karena gagal jantung saat tidur.\n\nAwalnya bergelar Putri Maud dari Wales, Permaisuri Norwegia tidak hanya meninggalkan Raja Haakon dan Pangeran Olav-yang sudah dalam perjalanan ke Inggris-tetapi juga oleh semua orang Norwegia, karena dia dicintai di seluruh dunia."
 AAT_norway_news.1.desc: "Setelah bertahun-tahun dalam pengasingan yang melelahkan, tokoh revolusioner terkenal Lev Trotsky telah tiba di [MEX.GetNonIdeologyName] dari [NOR.GetNonIdeologyName]. Dia diterima oleh pelukis terkenal Frida Kahlo dan suaminya Diego Rivera, yang akan menjamu dia di rumah mereka di Mexico City, dan pastinya akan menjadi pasangan yang cocok untuk Trotsky dan istrinya.\n\nLebih penting lagi, dia akan jauh dari bahaya apa pun yang ditimbulkan oleh musuh-musuhnya di [SOV.GetNameDef], dan mungkin menikmati pengasingan yang tenang di negara Amerika Latin."
 AAT_norway_news.1.a: "Menarik..."
 AAT_norway_news.1.sov: "Dia harus ditangani!"
 AAT_norway_news.2.t: "Ratu Maud dari Norwegia telah meninggal"
 AAT_norway_news.2.desc: "Saat berkunjung ke Inggris untuk menemui keluarganya dan saudara laki-lakinya Raja George V dari Inggris, Permaisuri Norwegia, dan Putri Wales sebelumnya, telah meninggal karena gagal jantung saat tidur. Komplikasi pasca operasi perut awal pekan ini diyakini menjadi biang keladinya.\n\nDia adalah sosok yang dicintai di Norwegia, dan pasti akan dirindukan oleh putranya Pangeran Olav dan suaminya Haakon VII, raja Norwegia."
 AAT_norway_news.2.a: "Sebuah kerugian bagi kita semua"
 AAT_norway_news.2.b: "Satu lagi yang kurang royal untuk dihadapi!"
 AAT_norway_news.3.t: "Raja Haakon VII dari Norwegia telah meninggal"
 AAT_norway_news.3.desc: "Setelah operasi yang tampak sukses setelah kecelakaan ski, Raja Haakon VII dari Norwegia yang tercinta telah meninggal karena komplikasi medis.\n\nNorwegia kini sedang melalui salah satu periode tergelap dalam sejarahnya, semoga Pangeran Olav naik takhta sesegera mungkin untuk membimbingnya ke pelabuhan yang aman."
 AAT_norway_news.99.t: "Raja Wojtek Membawa Jan Mayen ke dalam kandangnya"
 AAT_norway_news.99.desc: "Meski diabaikan oleh sebagian besar dunia, Raja Wojtek, Pembawa Artileri, dan Tahta, telah melihat potensi pulau Arktik ini.\n\nDengan bantuan beruang kutub lokal dan pendatang baru, Jan Mayen dihuni kembali dan diubah menjadi bangsa yang layak, mampu menghadapi tantangan apa pun. Benar-benar pemandangan yang belum pernah terlihat sejak zaman Victoria.\n\nDi antara warganya, ada satu tokoh yang menjadi polarisasi, yaitu seseorang yang nama lamanya tidak penting, namun selanjutnya akan dikenal sebagai Laksamana Agung Johan Mayen."
AAT_norway_news.99.a: "Ini sudah tidak terkendali!"
 AAT_norway_rikstanken.1.t: "[ROOT.GetAdjective] Program Tangki"
 AAT_norway_rikstanken.1.desc: "Tank tidak pernah menjadi bagian dari persenjataan [ROOT.GetAdjective], dan meskipun mungkin sudah terlambat bagi kita untuk mengejar ketinggalan, itu tidak berarti kita harus meninggalkan mereka sepenuhnya.\n\nLangkah pertama adalah menemukan mitra yang cocok untuk mengakuisisi atau berkolaborasi dalam mengembangkan kekuatan lapis baja kita. Jawaban yang jelas adalah salah satu kekuatan militer besar di Eropa, namun mungkin menemukan penyedia layanan yang lebih dekat dengan negara asal dapat memberikan manfaat jangka panjang."
 AAT_norway_rikstanken.1.a: "Tetangga kita [?NOR_nordic_tank_seller.GetName]"
 AAT_norway_rikstanken.1.b: "[?NOR_communist_tank_seller.GetName] tentu punya sarana"
 AAT_norway_rikstanken.1.c: "[?NOR_fascist_tank_seller.GetAdjective] tank menjanjikan"
 AAT_norway_rikstanken.2.t: "Pendekatan Kami untuk Program Armor [NOR.GetAdjective]"
 AAT_norway_rikstanken.2.desc_NORDIC: "Tetangga kami dan sesama negara Nordik [?NOR_nordic_tank_seller.GetName] tentunya memiliki industri militer yang maju yang dapat kami gunakan untuk memasok pasukan lapis baja kami, namun hal ini akan sangat merugikan negara kecil kami.\n\nKami juga memiliki opsi untuk membeli satu tank dan melihat ke mana kami dapat melanjutkan dari sana."
 AAT_norway_rikstanken.2.desc_SOV: "[?NOR_communist_tank_seller.GetName] telah menguasai alat-alat produksi, yang berarti mereka memiliki kapasitas untuk memproduksi tank dalam jumlah besar, yang memungkinkan kita mengejar musuh-musuh kita.\n\nKita juga dapat menggunakan kesempatan ini untuk menunjukkan kepada para pekerja di negara kita apa yang dapat dilakukan oleh negara komunis, dan meningkatkan dukungan terhadap Komunisme di [ROOT.GetName]."
 AAT_norway_rikstanken.2.desc_GER: "Kekuatan Panzer [?NOR_fascist_tank_seller.GetAdjective] tidak dapat disangkal, dan kekuatan industrinya akan memungkinkan kita membangun kekuatan tank untuk menandingi target apa pun. Kita juga dapat bergabung dengan mereka untuk mengembangkan tank kita sendiri dan membantu para insinyur mereka dengan cara apa pun yang kita bisa.\n\nTentu saja, mereka mengharapkan kita untuk menyelaraskan diri dengan mereka secara ideologis, apa pun pendekatan yang kita pilih untuk melakukan hal ini."
 AAT_norway_rikstanken.2.a: "Kami akan mencelupkan kaki kami dengan satu tangki"
 AAT_norway_rikstanken.2.b: "Kami membutuhkan angka untuk bersaing"
 AAT_norway_rikstanken.2.c: "Pakta perdagangan dapat mendekatkan negara kita secara ideologis"
 AAT_norway_rikstanken.2.d: "Mari kita minta bantuan untuk mengembangkan tank kita sendiri"
 AAT_norway_rikstanken.3.t: "[FROM.GetName] Mau Beli Tangki [ROOT.GetAdjective]"
 AAT_norway_rikstanken.3.desc: "Pemerintah [FROM.GetName] telah menghubungi kami untuk meminta agar kami mengizinkan pembelian tank. Peringatannya adalah karena alasan anggaran, mereka hanya mampu membeli satu tank ringan... Tanpa turret.\n\nTentu saja permintaan yang tidak biasa sehingga menimbulkan kecurigaan, tetapi mereka mengaku ingin mencobanya sebelum memilih cara membangun pasukan lapis baja."
 AAT_norway_rikstanken.3.a: "Tidak ada salahnya dalam satu tangki"
 AAT_norway_rikstanken.3.b: "Ini tidak sepadan dengan waktu kita"
 AAT_norway_rikstanken.4.t: "[FROM.GetName] Ingin Membeli Tank Kami"
 AAT_norway_rikstanken.4.desc: "Pemerintah [FROM.GetAdjective] ingin membeli tank-tank kita untuk terjun pertama kali ke dalam peperangan lapis baja.\n\nIni akan baik bagi perekonomian dan industri senjata kita, namun kita harus memikirkan persediaan tank-tank kita terlebih dahulu, dan apakah kita dapat mempercayai mereka dengan kekuatan lapis baja."
 AAT_norway_rikstanken.4.a: "Mari kita buat Perjanjian Dagang"
 AAT_norway_rikstanken.4.b: "Kami membutuhkan tank-tank ini"
 AAT_norway_rikstanken.5.t: "[FROM.GetName] Mengupayakan Hubungan dan Tank yang Lebih Dekat"
 AAT_norway_rikstanken.5.desc_SOV: "Pemerintah [FROM.GetAdjective] telah mendekati kami dengan permintaan untuk membeli tank ringan dalam jumlah besar dari kami, dan mereka tidak hanya menginginkan perjanjian perdagangan tetapi juga hubungan yang lebih erat antara kedua bangsa kami.\n\nIni adalah kesempatan bagi kami untuk menunjukkan kepada penduduk [FROM.GetName] apa yang dapat dicapai ketika alat-alat produksi disita, dan akan mengarah pada kolaborasi yang lebih erat di masa depan."
 AAT_norway_rikstanken.5.desc_GER: "Perwakilan dari pemerintahan [FROM.GetAdjective] ingin membeli tank ringan unggulan kami dalam jumlah besar.\n\nSelain itu, mereka telah menunjukkan minat pada prinsip-prinsip ideologi kami dan ingin menunjukkan kepada penduduk mereka seperti apa puncak [ROOT.GetRulingIdeologyNoun] untuk menyebarkannya di negara mereka."
 AAT_norway_rikstanken.5.a: "Kami menyambut baik minat mereka"
 AAT_norway_rikstanken.5.b: "Ini tidak sepadan dengan waktu kita"
 AAT_norway_rikstanken.6.t: "[FROM.GetName] Ingin Berkolaborasi dalam Riset Tank"
 AAT_norway_rikstanken.6.desc: "Pemerintah [FROM.GetAdjective] ingin mengembangkan program tank mereka sendiri, dan mereka mengharapkan bantuan dari kami. Mereka mengklaim bahwa mereka tidak hanya dapat memperoleh pengetahuan teknologi dan ideologi, namun program tank kita sendiri juga akan mendapat manfaat dari pengaturan ini."
 AAT_norway_rikstanken.6.a: "Tank mereka tidak akan bisa dihentikan"
 AAT_norway_rikstanken.6.b: "Kami tidak membutuhkan ini"
 AAT_norway_rikstanken.7.t: "Kami Menyambut Tank Nasional Baru Kami"
 AAT_norway_rikstanken.7.desc: "[FROM.GetName], tetangga kami, telah menerima penjualan tangki pertama [ROOT.GetName]. Tentu saja, tank ini tidak memiliki banyak armor, atau bahkan turret, namun dengan beberapa perbaikan, ini bisa menjadi awal dari pasukan tank [ROOT.GetAdjective]."
 AAT_norway_rikstanken.7.a: "Ide terbaik Realm!"
 AAT_norway_rikstanken.8.t: "[FROM.GetNameDefCap] Akan Memberi Kita Tank"
 AAT_norway_rikstanken.8.desc: "Pemerintah [FROM.GetAdjective] telah menerima perjanjian untuk menjual tank dalam jumlah besar ke negara kita. Hal ini akan memungkinkan militer kita untuk benar-benar bersaing dengan negara-negara besar."
 AAT_norway_rikstanken.8.a: "Akhirnya!"
 AAT_norway_rikstanken.9.t: "Negara [ROOT.GetAdjective] dan [FROM.GetAdjective] Semakin Dekat, Dengan Tank"
 AAT_norway_rikstanken.9.desc: "Para pemimpin [FROM.GetAdjective] telah setuju untuk menjual tank mereka kepada kami, dan bersama dengan mereka, muncullah perjanjian formal yang akan membuat [ROOT.GetName] menjadi lebih selaras dengan [FROM.GetAdjective] [FROM.GetRulingIdeologyNoun], dan dengan demikian, menjadi lebih dekat satu sama lain."
 AAT_norway_rikstanken.9.a: "Sekarang [FROM.GetRulingIdeologyNoun] akan menang"
 AAT_norway_rikstanken.10.t: "[FROM.GetNameDefCap] Telah Menerima Kesepakatan Penelitian"
 AAT_norway_rikstanken.10.desc: "Utusan [FROM.GetAdjective] telah mengkonfirmasi bahwa mereka bersedia membantu kita mengembangkan tank kita sendiri, tentu saja, selama negara kita terus menyelaraskan diri secara ideologis. Kami yakin mereka juga akan mendapat manfaat dari pendekatan baru dalam pengembangan tank yang akan dihasilkan oleh kolaborasi kami."
 AAT_norway_rikstanken.10.a: "Terakhir, tank Norwegia!"
 AAT_norway_rikstanken.11.t: "Apa yang Dapat Kita Pelajari dari Rikstanken"
 AAT_norway_rikstanken.11.desc: "Dunia kita telah lama memiliki tank, yang dijuluki Rikstanken, atau tank nasional. Kami telah melihat cara kerjanya dan apa yang dapat kami lakukan dengannya, jadi mungkin kami dapat mengambil langkah lebih jauh dan mencoba membedah tangki tersebut, untuk akhirnya merancang dan memproduksi tangki kami sendiri. Lagi pula, tidak ada banyak keunggulan tempur pada satu tank."
 AAT_norway_rikstanken.11.a: "Lebih banyak tank!"
 AAT_norway_rikstanken.11.b: "Kami tidak membutuhkan tank"
 AAT_norway_rikstanken.12.t: "[FROM.GetName] Menolak Usulan Kami"
 AAT_norway_rikstanken.12.desc: "Meskipun kami sangat ingin memulai program tangki [ROOT.GetAdjective] dengan bantuan [FROM.GetNonIdeologyName], mereka menolak permintaan kami. Ini akan menjadi pukulan bagi harapan kita untuk memodernisasi angkatan bersenjata kita."
 AAT_norway_rikstanken.12.a: "Kami akan mencari cara lain"
 AAT_rikstanken_program_tech_bonus: "Program Tank Norwegia"
 AAT_norway_allied.1.t: "[FROM.GetName] sedang mencari investasi"
 AAT_norway_allied.1.desc: "Pemerintah [NOR.GetAdjective] ingin mengembangkan industri mereka, dengan bantuan kami. Ini akan menjadi peluang besar untuk mendapatkan keuntungan, dan bagi kita untuk mengembangkan mereka menjadi sekutu potensial di masa depan, jika perang pecah."
 AAT_norway_allied.1.a: "Tidak ada salahnya membantu sekutu masa depan"
 AAT_norway_allied.1.b: "Ini mungkin berbahaya"
 AAT_norway_allied.2.t: "[FROM.GetNameDefCap] akan berinvestasi dalam pengembangan kami"
 AAT_norway_allied.2.desc: "Tawaran kami terhadap pemerintah [FROM.GetAdjective] telah berhasil dan mereka setuju untuk berinvestasi dalam perekonomian kami. Hal ini juga berarti bahwa kita akan semakin dekat dengan mereka dan bahkan mungkin menganggap mereka sebagai sekutu kita di masa depan."
 AAT_norway_allied.2.a: "Ini adalah kemajuan"
 AAT_norway_allied.3.t: "[FROM.GetName] Tidak Akan Berinvestasi dalam Perekonomian Kita"
 AAT_norway_allied.3.desc: "Terlepas dari upaya kami, pemerintahan [FROM.GetAdjective] tidak akan membantu kami mengembangkan kapasitas industri yang kami perlukan untuk mempertahankan diri jika terjadi perang.\n\nKita harus mengingat hal ini."
 AAT_norway_allied.3.a: "Kami harus mencari di tempat lain"
 AAT_norway_allied.4.t: "Penggantian Laake"
 AAT_norway_allied.4.desc: "Kristian Laake telah bertugas di Angkatan Darat [NOR.GetAdjective] untuk waktu yang lama, dan diangkat sebagai Komandan Jenderal hampir satu dekade yang lalu, selama masa damai, dan bertahun-tahun sebelum risiko terhadap negara kita menjadi jelas.\n\nKarena kita telah kehilangan kepercayaan pada kemampuannya jika dia harus memimpin upaya di masa perang, dia harus diganti, pertanyaannya adalah, siapa yang akan memimpin pasukan [NOR.GetName] menuju kemenangan?"
 AAT_norway_allied.4.a: "[NOR.NOR_carl_gustav_fleischer.GetName] akan menjadi pilihan yang berani"
 AAT_norway_allied.4.b: "[NOR.NOR_wilhelm_von_tangen_hansteen.GetName] memiliki potensi"
 AAT_norway_allied.4.c: "[NOR.NOR_otto_ruge.GetName] adalah opsi yang aman"
 AAT_norway_fascist.1.t: "Nasjonal Samling [FROM.GetName] Ingin Kita Menyerang Negara Mereka!"
 AAT_norway_fascist.1.desc: "Koalisi [FROM.GetAdjective] nasionalis dan fasis yang selaras dengan perjuangan kami menawarkan bantuan mereka dalam menaklukkan [NOR.GetName]. Mereka telah meletakkan dasar untuk merebut pemerintahan dan mengelola wilayah [FROM.GetAdjective] atas nama kita.\n\nJika ini benar, peluang ini mungkin terlalu bagus untuk dilewatkan, namun kita harus memastikan bahwa kita siap untuk menyerang."
 AAT_norway_fascist.1.a: "[FROM.GetName] akan bergabung dengan kami!"
 AAT_norway_fascist.1.b: "Kami tidak akan berbagi kekuasaan dengan penduduk setempat"
 AAT_norway_fascist.2.t: "[FROM.GetNameDefCap] Telah Menolak Kami!"
 AAT_norway_fascist.2.desc: "Terlepas dari tawaran kami yang murah hati, [FROM.GetAdjective] telah menyampaikan bahwa jika mereka menyerang [ROOT.GetName], mereka tidak membutuhkan atau menginginkan bantuan kami. Tampaknya, misi kami sendirian untuk mengambil kendali pemerintahan [ROOT.GetNameDef]."
 AAT_norway_fascist.2.a: "Mereka akan menyesalinya!"
 AAT_norway_fascist.3.t: "[FROM.GetNameDefCap] Akan Membantu Kami!"
 AAT_norway_fascist.3.desc: "Perwakilan dari partai fasis [FROM.GetAdjective] telah menghubungi kami dan meyakinkan kami bahwa [FROM.GetNameDef] akan memberikan dukungan yang kami perlukan dalam merebut kendali pemerintahan.\n\nHal ini memungkinkan kami keluar dari bayang-bayang dan merebut kekuasaan di [ROOT.GetName]."
 AAT_norway_fascist.3.a: "Sudah waktunya!"
 AAT_norway_fascist.5.a: "$AAT_norway_fascist.3.a$"
 AAT_norway_fascist.4.t: "Rekan [NOR.GetAdjective] Kami Meminta Dukungan Kami"
 AAT_norway_fascist.4.desc: "Perwakilan Fasisme di [NOR.GetName] menceritakan kepada kita perjuangan besar untuk membangun basis dukungan dan mengambil alih kendali Negara [NOR.GetAdjective] meskipun pemerintahan mereka lemah dan kikuk.\n\nMereka jelas membutuhkan bantuan kita untuk memperkuat cengkeraman mereka pada tuas kekuasaan di suatu negara yang bisa menjadi sekutu yang berguna di masa depan."
 AAT_norway_fascist.4.a: "Kami akan membantu sesama fasis"
 AAT_norway_fascist.4.b: "Kami tidak mendapatkan apa pun dari ini"
 AAT_norway_fascist.6.t: "[FROM.GetNameDefCap] Telah Menolak!"
 AAT_norway_fascist.6.desc: "Perwakilan dari partai fasis [FROM.GetAdjective] telah menyampaikan kabar buruk kepada kita. [FROM.GetNameDefCap] telah menolak permohonan bantuan kami.\n\nIni berarti kami sendirian dalam mencari rezim fasis yang kami kendalikan di [ROOT.GetNonIdeologyName]."
 AAT_norway_fascist.6.a: "Kami akan menemukan jalan!"
 AAT_norway_communist.1.t: "[FROM.GetName] ingin menghidupkan kembali Perdagangan Pomor!"
 AAT_norway_communist.1.desc: "Selama berabad-abad sebelum kita mencapai Revolusi, suku Pomor di Rusia Utara menyeberangi Laut Barents untuk melakukan perdagangan penting dengan rekan-rekan [NOR.GetAdjective] kita di Utara negara mereka.\nSekarang mereka mengusulkan agar kita menghidupkan kembali tradisi lama ini, yang tentunya akan saling menguntungkan, dan mendekatkan Bangsa Komunis kita satu sama lain."
 AAT_norway_communist.1.a: "Laut Barents akan ramai dengan pelayaran!"
 AAT_norway_communist.1.b: "Perdagangan adalah konsep borjuis!"
 AAT_norway_communist.2.t: "Perdagangan Pomor Baru"
 AAT_norway_communist.2.desc: "Seperti nenek moyang mereka, kawan-kawan kami di [FROM.GetNameDef] sangat tertarik untuk berdagang dengan kami melalui pesisir paling utara. Ini akan menjadi kesepakatan yang saling menguntungkan yang akan menunjukkan kepada para pekerja di kedua negara manfaat dari persahabatan komunis kita."
 AAT_norway_communist.2.a: "Selanjutnya!"
 AAT_norway_communist.3.t: "[FROM.GetName] Menolak Proposal Perdagangan Kami"
 AAT_norway_communist.3.desc: "Terlepas dari sejarah perdagangan kita yang sama di Laut Barents, [FROM.GetNameDef] merasa hal ini tidak layak untuk dihidupkan kembali. Kita harus mencoba cara lain untuk mengembangkan pesisir paling utara kita."
 AAT_norway_communist.3.a: "Oh baiklah..."
 AAT_norway_communist.4.t: "[FROM.GetName] Ingin Kami Membantu Mereka Mengembangkan Industri Militernya"
 AAT_norway_communist.4.desc: "Rekan-rekan kita di [FROM.GetName] membutuhkan bantuan kita. Karena Revolusi mereka telah membawa mereka lebih dekat dengan kita, masuk akal jika kita mendukung upaya mereka untuk memodernisasi militer mereka.\n\nIni akan menjadi kemenangan politik bagi kita jika kita terlihat mendukung sesama negara komunis, dan menunjukkan kepada para pekerja mereka bagaimana [ROOT.GetNameDef] melakukannya."
 AAT_norway_communist.4.a: "Lengan mereka akan melawan musuh kita!"
 AAT_norway_communist.4.b: "Kita tidak bisa mengambil risiko mereka menggunakan senjatanya pada kita"
 AAT_norway_communist.5.t: "[FROM.GetNameDefCap] telah diterima!"
 AAT_norway_communist.5.desc: "Kawan-kawan kami telah menerima permintaan bantuan kami yang sederhana, dan sekarang mereka akan memungkinkan industri militer kami berkembang untuk memenuhi kebutuhan pertahanan Revolusi kami."
 AAT_norway_communist.5.a: "Kami akan menggunakan senjata ini untuk melawan musuh bersama!"
 AAT_norway_communist.6.t: "[FROM.GetNameDefCap] Menolak permintaan dukungan kami!"
 AAT_norway_communist.6.desc: "Tampaknya kepercayaan mereka terhadap kami terlalu dilebih-lebihkan. [FROM.GetName] tampaknya tidak mau membantu kami meningkatkan produksi militer kami."
 AAT_norway_communist.6.a: "Pengecut!"
 AAT_norway_communist.7.t: "Jatuhnya Keluarga Kerajaan Norwegia"
 AAT_norway_communist.7.desc: "Lewatlah sudah hari-hari ketika Monarki [NOR.GetAdjective] adalah salah satu keluarga kerajaan yang paling dicintai di benua ini. Meskipun desakan Raja Haakon untuk hanya naik takhta setelah referendum dan komitmennya untuk melakukan pengabaian adalah hal yang mulia, monarki tetaplah monarki, dan monarki tidak memiliki tempat dalam masyarakat setara yang ingin kita bangun di [ROOT.GetNonIdeologyName].\n\nRaja Haakon VII dan Pangeran Olav, bersama dengan seluruh Keluarga Kerajaan telah ditangkap dan dikirim secara damai dalam perjalanan mereka, aset mereka yang disita untuk digunakan dalam pembangunan proyek komunis kami.\n\n[NOR_GetExiledMonarchyLastParagraph]"
 NOR_exiled_monarchy_to_desc_DEN: "Kembali ke nama asli Denmarknya, Pangeran Carl, akan diterima di [DEN.GetName] oleh saudaranya, Raja Frederick, di mana dia akan memenuhi peran apa pun yang dimiliki bangsawan dalam masyarakat Denmark."
 NOR_exiled_monarchy_to_desc_ENG: "Sejak kembali ke tanah airnya, [DEN.GetName], bukanlah suatu pilihan, mantan raja Haakon dan keluarganya kini terpaksa menerima pengasingan mereka di [ENG.GetName], tanah yang pernah menjadi tuan rumah pernikahan Pangeran Carl dari Denmark dan Maude dari Wales, mantan pasangan kerajaan."
 NOR_exiled_monarchy_to_desc_SWE: "Karena tidak dapat kembali ke tanah air Raja Haakon atau Ratu Maud, mantan Keluarga Kerajaan terpaksa mencari pengasingan di monarki tetangga yang bersimpati. Ironi dari Kerajaan Norwegia yang bergantung pada kerajaan Swedia segera setelah memperoleh kemerdekaan tidak hilang dari dunia luas."
 NOR_exiled_monarchy_to_desc_NONE: "Dunia saat ini sangat berbeda dengan keadaan pada tahun 1905. Monarki Norwegia yang baru lahir tidak memiliki negara untuk memerintah dan tidak memiliki tujuan yang jelas untuk mengasingkan diri. Monarki di dunia akan segera berakhir."
 AAT_norway_communist.7.a: "Pembebasan yang bagus!"
 AAT_norway_communist.8.t: "Keluarga Kerajaan Norwegia Tiba"
 AAT_norway_communist.8.desc_DEN: "Setelah berangkat untuk membentuk keluarga kerajaannya sendiri di Norwegia, Pangeran Carl kami, atau Haakon VII, begitu ia dipanggil selama bertahun-tahun, telah kembali ke [ROOT.GetName].\n\nDia tiba-tiba digulingkan dan diasingkan setelah Revolusi Komunis yang mengerikan, dan sekarang harus menerima kehidupan pengasingan di negara kami bersama keluarganya."
 AAT_norway_communist.8.desc_ENG: "Keluarga Kerajaan Norwegia telah terikat dengan keluarga kami selama bertahun-tahun, dengan Ratu Victoria yang menjadi tuan rumah pernikahan cucunya Maud, dengan calon Raja Haakon VII, yang saat itu adalah Pangeran Carl dari Denmark.\n\nSayangnya, sebuah Revolusi telah menggulingkan mereka, dan karena Denmark tidak lagi menjadi pilihan, mereka terpaksa mencari suaka di sini pada [ROOT.GetName]."
 AAT_norway_communist.8.desc_SWE: "Keluarga Kerajaan Norwegia telah dikirim ke pengasingan, dan karena mencari suaka bersama kerabat mereka di Denmark dan Inggris saat ini mustahil, mereka memilih untuk meninggalkan harga diri dan mencari tempat bersama kami.\n\nMeskipun kurangnya hubungan kekeluargaan, adalah tugas kami untuk membela sesama monarki Skandinavia dari kepunahan."
 AAT_norway_communist.8.a: "Mereka diterima di sini!"
 AAT_norway_communist.8.b: "Mereka boleh tinggal, tapi mereka tidak diterima."
 AAT_norway_monarchist.1.t: "Pembukaan Bendahara Kerajaan"
 AAT_norway_monarchist.1.desc: "Terlepas dari desakan Raja Haakon dalam menjunjung independensi Storting dan membiarkannya menyelesaikan masalah mereka secara internal, Bendaharanya, Peder Anker Wedel-Jarlsberg, mengusulkan Kerajaan Norwegia untuk campur tangan dalam situasi yang sangat tidak stabil ini.\n\nMengutip ancaman samar dari invasi asing, ia menyerukan rakyat [ROOT.GetName] untuk menunjukkan kepercayaan mereka kepada raja di seluruh negeri, dan menuntut tindakan dari sumpah mereka bawahan.\n\nDia adalah orang kepercayaan terdekat Raja, dan anggota keluarga bangsawan paling kuat yang memiliki koneksi baik di [NOR.GetName], jadi perkembangan ini harus memicu kewaspadaan."
 AAT_norway_monarchist.1.a: "Apa agendanya?"
 AAT_norway_monarchist.2.t: "Raja Sudah Mati!"
 AAT_norway_monarchist.2.desc: "Hal yang tak terbayangkan telah terjadi. Setelah operasi yang tampaknya sukses setelah kecelakaan ski, Raja Haakon VII yang kita sayangi telah meninggal karena komplikasi medis.\n\nNegara kita sekarang sedang melewati salah satu periode paling kelam dalam sejarahnya, mari kita berharap Pangeran Olav naik takhta sesegera mungkin untuk membimbing negara kita ke pelabuhan yang aman."
 AAT_norway_monarchist.2.a: "Tragedi apa lagi yang bisa terjadi di masa depan?"
 AAT_norway_monarchist.3.t: "Suksesi negara kita"
 AAT_norway_monarchist.3.desc: "Saat bangsa kita berduka atas kematian raja tercinta Haakon VII, menjadi jelas bahwa perhatian Pangeran Olav tertuju pada medan perang, dan bahkan jika tidak, dia dilaporkan terlalu putus asa untuk melakukan hal lain selain memimpin pasukan kita menuju kemenangan. Kita bertanya-tanya siapa yang akan membimbing [NOR.GetNameDef] melewati masa-masa penuh gejolak ini. Setidaknya kita bisa berterima kasih kepada Markis Jarlsberg atas ketangguhan tangannya."
 AAT_norway_monarchist.3.a: "Saat-saat sulit membutuhkan tindakan yang tidak lazim"
 AAT_norway_monarchist.3.b: "Kita tidak bisa mengguncang perahu"
 AAT_norway_monarchist.4.t: "Ratu Mathilde I dari Norwegia"
 AAT_norway_monarchist.4.desc: "Kita mungkin tidak pernah tahu apa yang terjadi di balik pintu tertutup di Istana Kerajaan, namun Pemerintah Kerajaan Norwegia telah mengumumkan bahwa Ratu Maude, mendiang Permaisuri Raja Haakon akan memerintah Kerajaan mulai sekarang, dengan menggunakan nama Mathilde I. Hal ini sangat tidak biasa karena Pangeran Olav adalah pewaris takhta berikutnya, namun sepertinya dia lebih memilih pengaturan ini sehingga dia dapat terus memusatkan perhatiannya pada upaya perang. Selain itu, dia adalah cucu Ratu Victoria, jadi dia hanya akan mengikuti langkah-langkahnya, dan hukum suksesi di tanah airnya.\n\nYang perlu diperhatikan, nama Markis Wede-Jarlsberg tidak disebutkan dalam pengumuman publik mana pun, perannya dalam rezim baru tidak diketahui, begitu pula keberadaannya."
 AAT_norway_monarchist.4.a: "Hidup Ratu Mathilde!"
 AAT_norway_monarchist.5.t: "Niat Bupati"
 AAT_norway_monarchist.5.desc: "Dengan mengambil alih kekuasaan sebagai bupati baru kita menggantikan raja, timbul pertanyaan tentang apa sebenarnya niatnya bagi bangsa ini. Apakah dia ingin menggantikan Raja Haakon dalam jangka panjang, atau dia hanya ingin membantunya dalam pemerintahannya? Hanya waktu yang dapat mengetahui apa sebenarnya ambisinya."
 AAT_norway_monarchist.5.a: "Jarlsberg akan memimpin bangsa sebagai raja sejati"
 AAT_norway_monarchist.5.b: "Akan lebih baik jika kita menjaga hubungan baik dengan tetangga kita"
 AAT_norway_monarchist.5.c: "Tujuan utamanya adalah mengembalikan Norwegia ke kejayaannya!"
 illegitimate_norwegian_monarchy: "Raja Norwegia yang Tidak Sah di Tahta"
 friendly_norwegian_monarchy: "Saudara-saudara Nordik kita"
 norwegian_imperial_ambitions: "Ambisi Kekaisaran Norwegia"
 Sweden_rearnament.1.t: "Anggaran tentara"
 Sweden_rearnament.1.desc: "Pasukan kita di lapangan adalah kekuatan utama militer kita, yang bertugas melindungi pantai, kota, dan perbatasan kita.\nNamun mereka juga menimbulkan kerugian finansial sosial yang besar yang mungkin tidak dapat diterima oleh masyarakat awam."
 Sweden_rearnament.1.a: "Melucuti senjata"
 Sweden_rearnament.1.b: "Anggaran rendah"
 Sweden_rearnament.1.c: "Anggaran sedang"
 Sweden_rearnament.1.d: "Anggaran tinggi"
 Sweden_rearnament.2.t: "Anggaran udara"
 Sweden_rearnament.2.desc: "Para ahli dan pakar mengatakan bahwa masa depan peperangan akan terjadi baik di darat dan laut maupun di udara. Jenis peperangan baru ini semakin mendapat perhatian dari negara-negara besar, dan tentunya sangat penting dalam pertahanan di masa depan.\nMeskipun cara berperang seperti ini pasti akan terjadi di masa depan, akankah pekerja pabrik pada umumnya memahami hal ini ketika roti menjadi langka?"
 Sweden_rearnament.3.t: "anggaran Angkatan Laut"
 Sweden_rearnament.3.desc: "Selama berabad-abad negara-negara di sekitar Baltik berusaha menguasai jalur masuknya, begitu pula Swedia. Dengan garis pantai besar yang terus menerus membentang dari ujung utara ke pantai Barat menghadap Samudera Atlantik Utara.\nKita menghadapi ancaman dari Armada Merah di Leningrad dan Kreigsmarine di selatan.\nMeskipun angkatan laut yang kuat sangat penting bagi pertahanan kita, lambung logam besar yang dibutuhkan tidaklah murah. Oleh karena itu, anggaran yang dipertimbangkan dengan cermat sangatlah penting."
 Sweden_rearnament.4.t: "Komite persenjataan kembali saat ini sedang bersidang"
 Sweden_rearnament.4.desc: "Sesuai permintaan, Anda meminta untuk diingatkan kapan komite persenjataan kembali akan bersidang lagi. Saatnya sekarang dan merupakan kesempatan kita untuk menetapkan kebijakan persenjataan untuk tahun depan.\nKehati-hatian dan kejernihan pemikiran diperlukan karena hal ini akan mengunci kita pada rencana masa depan saat dunia menuju titik kritis."
 Sweden_rearnament.4.desc.a: "Kejelasan memang"
 Sweden_rearnament_delta_low: "Perubahan efektif: [?folkhemmet_air_part_delta_low_tooltip]"
  Sweden_rearnament_delta_medium: "Perubahan efektif: [?folkhemmet_air_part_delta_medium_tooltip]"
