  air_budget_event_active: "Komite anggaran udara aktif"
  navy_budget_event_active: "Komite anggaran angkatan laut aktif"
 AAT_Sweden.1.t: "Komisi pemerintah merekomendasikan persenjataan kembali"
 AAT_Sweden.1.desc: "Pada tahun 1930, negara bagian menunjuk penyelidikan parlemen untuk memberikan panduan bagi belanja pertahanan Swedia di masa depan. Partai Petani bersama kelompok moderat mendorong peningkatan belanja sementara Perdana Menteri Per-Albin Hansson dari Partai Sosial Demokrat sangat menentang hal ini, dengan mengatakan bahwa langkah seperti itu akan melumpuhkan visinya mengenai reformasi sosial.\nDi tengah retorika yang semakin mengancam dari negara-negara tetangganya, penyelidikan kini tetap berpihak pada partai-partai berhaluan kanan. Menyatakan bahwa \"kelalaian dalam pertahanan akan merugikan kepentingan negara dan rakyatnya\".\n\nHal ini menyebabkan krisis pemerintahan dengan Per-Albin Hansson mengancam akan mengundurkan diri hingga ia dapat memperkuat basisnya pada pemilu 1936 mendatang.\nSementara itu kita harus menunjuk seseorang untuk memimpin hingga pemilu mendatang."
 AAT_Sweden.1.a: "Partai Tani adalah pilihan terbaik"
 AAT_Sweden.1.c: "Jelas sekali partai oposisi di sayap kanan"
 AAT_Sweden.1.b: "Tidak ada alasan mengapa Per-Albin harus mengundurkan diri"
 AAT_Sweden.1.b_tt: "§RIni akan mempunyai dampak politik yang negatif§!"
 AAT_Sweden.2.t: "Mosi tidak percaya"
 AAT_Sweden.2.desc: "Di tengah penolakan Per-Albin untuk mengalah pada anggaran sekaligus menolak untuk mundur dan mendukung kandidat lain, koalisi partai Petani dan kaum moderat telah memutuskan untuk memberikan mosi tidak percaya kepada Perdana Menteri.\n\nDengan bergabungnya kedua partai ini, Per-Albin tidak punya pilihan lain selain mengundurkan diri, sehingga jabatan Perdana Menteri kosong. Hal ini menyebabkan krisis dalam pemerintahan di mana tidak ada partai yang memiliki kekuatan politik untuk naik ke kekuasaan.\n\nRaja sendiri telah berbicara menentang kekacauan yang terjadi, sebuah langkah luar biasa bagi raja yang tidak memiliki kekuatan politik resmi."
 AAT_Sweden.2.a: "Bagaimana ini akan berakhir?"
 AAT_Sweden.3.a: "Per Albin-Hansson mendapat amanah rakyat."
 AAT_Sweden.3.b: "[AAT_Sweden_3_b_loc]"
 AAT_Sweden.3.axel_is_leader: "Axel telah melakukannya dengan baik sejauh ini, biarkan dia melanjutkan."
 AAT_Sweden.3.axel_is_not_leader: "Partai Tani harusnya punya peluang."
 AAT_Sweden.3.c: "[AAT_Sweden_3_c_loc]"
 AAT_Sweden.3.bagge_is_leader: "Jelas Bagge akan membawa kita ke masa depan."
 AAT_Sweden.3.bagge_is_not_leader: "Kaum Moderat, Kita memerlukan kepemimpinan baru dalam masa-masa sulit ini"
 AAT_Sweden.3.d: "P-A menyebabkan kekacauan ini, Wigforss seharusnya memimpin Partai Sosial Demokrat"
 AAT_Sweden.3.t: "Pemilihan Umum Swedia tahun 1936"
 AAT_Sweden.3.desc: "Saat ini, masyarakat di seluruh [ROOT.GetNameDef] berkumpul untuk memberikan suara mereka dalam pemilu nasional. Partai Sosial Demokrat diperkirakan akan bangkit kembali karena proyeksi menunjukkan bahwa mereka akan memperoleh beberapa kursi di Riksdag.\nNamun, baik Bondeförbundet maupun partai Högern berharap bahwa perubahan yang tidak terduga dapat mengantarkan mereka ke tampuk kekuasaan. Namun dengan semakin banyaknya partai pinggiran yang diperkirakan akan memperoleh sedikit keuntungan di tengah situasi dunia yang tidak menentu, segala sesuatu mungkin saja terjadi."
 AAT_Sweden.4.t: "Politisi menyebut lawannya \"tidak mampu sampai merasa malu\""
 AAT_Sweden.4.desc: "Perdebatan di Riksdag memanas hari ini ketika argumen tentang siapa yang harus menduduki jabatan Perdana Menteri meluas menjadi serangan pribadi. Karl Sjöblom memanggil Glenn Werner selama debat, menyatakan bahwa \"satu-satunya hal yang baik bagi Anda adalah mengajak anjing Anda jalan-jalan\".\n\nSeorang juru bicara Glenn telah mengklarifikasi bahwa dia tidak pernah memiliki seekor anjing."
 AAT_Sweden.4.a: "Semoga kita segera menemukan Perdana Menteri"
 AAT_Sweden.5.t: "Politisi ditemukan bersembunyi di semak-semak"
 AAT_Sweden.5.desc: "Lennart Jansson ditemukan bersembunyi di semak dekat Riksdag hari ini. Ketika terlihat dia bersikeras bahwa dia sebenarnya tidak bersembunyi di semak-semak, melainkan mengagumi kepik cantik tertentu. Dia kemudian segera masuk ke Riksdag.\nAda spekulasi bahwa dia memang bersembunyi di semak-semak, ingin menghindari antagonis politik yang terlihat masuk beberapa detik sebelumnya, untuk pertimbangan Perdana Menteri lebih lanjut."
 AAT_Sweden.5.a: "Itu konyol"
 AAT_Sweden.6.t: "Skandal karena menyeruput"
 AAT_Sweden.6.desc: "Pembicara telah menyerukan aturan baru mengenai makanan di Riksdag setelah Agda Sörlp \"sangat keras\" menyeruput sup saat politisi lain berbicara untuk memilih Perdana Menteri baru. Dia menyebutnya \"pengalih perhatian yang disengaja\", namun Nyonya Sörlp mengatakan bahwa karena pertimbangan yang panjang hingga akhir-akhir ini, tidak ada cukup waktu untuk makan siang pada jam normal."
 AAT_Sweden.6.a: "Tidak perlu lagi menyeruput!"
 AAT_Sweden.7.t: "12 orang ditangkap di luar Riksdag"
 AAT_Sweden.7.desc: "12 orang ditangkap di luar Riksdag hari ini, tampaknya mencoba memaksa masuk. Ketika ditangkap oleh polisi, mereka menyatakan bahwa mereka hanya ingin memaksa penyelesaian agar terjadi lebih cepat, menyatakan bahwa layanan sosial yang mereka andalkan telah menguap dalam kekacauan politik.\nMereka dihentikan di lobi karena salah satu dari 12 orang, Rikard Persson dicari oleh polisi karena penyelundupan tembakau ilegal. Persson harus menggunakan toilet umum, dikenali oleh petugas di toilet dan kemudian ditangkap.\nPersson diperkirakan akan mendapatkan hukuman 2 tahun penjara dengan sisa 11 hingga 6 bulan dan denda pelanggaran ringan."
 AAT_Sweden.7.a: "Ya ampun"
 AAT_Sweden.8.t: "11 orang yang ditangkap di Riksdag dibebaskan"
 AAT_Sweden.8.desc: "Saat ini 11 orang yang ditangkap karena mencoba menyerbu Riksdag dibebaskan dalam masa percobaan, dengan 1 orang masih dipenjara atas tuduhan penyelundupan."
 AAT_Sweden.8.a: "Semoga para gelandangan ini membuka lembaran baru"
 AAT_Sweden.9.t: "Penyelundup Tembakau mengubah kehidupan"
 AAT_Sweden.9.desc: "Rikard Persson ditangkap ketika dia, bersama 11 orang lainnya mencoba menyerbu Riksdag. Menjadi buronan karena penyelundupan tembakau, dia dipenjara selama 2 tahun. Kami menindaklanjuti keberadaannya sekarang, dan dengan senang hati kami laporkan bahwa setelah hukumannya, dia memutuskan untuk mengubah hidupnya dan segera bergabung dengan Angkatan Laut.\nAtasannya di komando tinggi menemukan sosok muda yang bersemangat, dan sejak itu dipromosikan karena kerja keras dan bakat alaminya."
 AAT_Sweden.9.a: "Benar-benar menginspirasi"
 AAT_Sweden.10.t: "Herman Eriksson menyerahkan surat pengunduran diri"
 AAT_Sweden.10.desc: "Hari ini Herman Eriksson menyerahkan surat pengunduran dirinya, menyatakan bahwa ia ingin pensiun untuk mengambil jabatan CEO untuk Vin och Sprit AB\nMeskipun ia berkeinginan, ia mungkin masih dibutuhkan di pemerintahan, tetapi menjadikannya sebagai CEO sebuah produsen minuman keras milik negara mungkin ada manfaatnya."
 AAT_Sweden.10.a: "Dia masih dibutuhkan di pemerintahan"
 AAT_Sweden.10.b: "Biarkan dia pergi"
 AAT_Sweden.11.t: "[GER.GetNameDef] pekerja menguasai pabrik Landsverk"
 AAT_Sweden.11.desc: "Setelah pecahnya permusuhan antara [SWE.GetNameDef] dan [GER.GetNameDef], personel Jerman berhasil merebut sementara pabrik Landsverk dan membarikade diri di dalam kompleks. Meskipun militer diperkirakan akan menguasai kompleks tersebut pada waktunya, beberapa kerusakan diperkirakan akan terjadi selama pertempuran kecil dan pabrik tersebut tidak akan beroperasi penuh untuk beberapa waktu.\nSedikit yang diketahui tentang pabrik Landsverk yang berlokasi di Jerman, namun pihak berwenang Swedia tidak ragu bahwa pabrik tersebut akan disita oleh pemerintah [GER.GetNameDef] sebagai pembalasan."
 AAT_Sweden.11.a: "Mungkin memiliki [GER.GetNameDef] kompleks militer bukanlah ide yang baik"
 AAT_Sweden.12.t: "[?ROOT.GetLeader] meninggal karena serangan jantung"
 AAT_Sweden.12.desc: "Hari ini pihak berwenang [?SWE.bus_capture_tag.GetAdjective] menyiarkan penangkapan dan kematian [?SWE.GetLeader]. Mereka menyatakan bahwa pasukan komando [?SWE.bus_capture_tag.GetAdjective] telah berhasil mengepung sebagian markas keliling perdana menteri yang telah ditembaki di dekat garis depan.\nSetelah bersentuhan dengan bus tempat [?SWE.GetLeader] dan stafnya dikurung, pasukan komando mengklaim bahwa perdana menteri tampak tersandung dan jatuh ke tanah saat keluar dari kendaraan. Meskipun permusuhan terus berlanjut, pihak berwenang [?SWE.bus_capture_tag.GetAdjective] dengan baik hati mengembalikan jenazah mendiang PM untuk dimakamkan secara kenegaraan. Otopsi mengungkapkan bahwa perdana menteri menderita serangan jantung yang diikuti dengan serangan jantung.\nMeskipun terjadi kekacauan, Tage Erlander telah mengambil alih kendali sebagai PM darurat sampai pemilu yang tepat dapat diadakan."
 AAT_Sweden.12.a: "Benar-benar sebuah tragedi"
 AAT_Sweden.13.t: "[SWE.GetNameDefCap] meminta kendali atas Norwegia Utara"
 AAT_Sweden.13.desc: "Pemerintah Swedia telah meminta kendali atas wilayah sekitar Narvik. Mereka mengklaim bahwa hal tersebut hanya bersifat kemanusiaan dan berasal dari keinginan untuk melindungi masyarakat Norwegia dari konflik yang sedang berlangsung. Sebagai jaminan keamanan, mereka menawarkan untuk menjaga zona demiliterisasi, dan mereka akan melakukan aktivitas kepolisian apa pun yang diperlukan hingga konflik berakhir.\nPenduduk Norwegia mungkin akan lebih bahagia di bawah zona pendudukan Swedia, sehingga memberikan lebih banyak sumber daya bagi pasukan kami di garis depan."
 AAT_Sweden.13.a: "Kedengarannya bagus"
 AAT_Sweden.13.b: "Itu semua milik [THIS.GetNameDef]"
 AAT_Sweden.13.tt: "§R[SWE.GetName] mungkin akan meningkat menjadi perang§!"
 AAT_Sweden.14.t: "[FROM.GetNameDefCap] lipatan"
 AAT_Sweden.14.desc: "[FROM.GetNameDefCap] telah menerima proposal kami untuk zona demiliterisasi di sekitar Narvik. Semua pasukan mereka telah meninggalkan daerah itu dan sekarang kami akan menyatakannya sebagai zona non-tempur. Kami memperkirakan pemerintah [NOR.GetAdjective] akan meminta kembali wilayah tersebut pada akhir perang, namun untuk saat ini kami akan menjaga keamanan populasi [NOR.GetAdjective]."
 AAT_Sweden.14.a: "Mari kita mulai dengan mengirimkan bantuan"
 AAT_Sweden.14.a_tt: "§Y[NOR.GetNameDefCap] akan meminta kami mengembalikan wilayah mereka di akhir perang§!"
 AAT_Sweden.15.t: "[FROM.GetNameDefCap] menolak proposal kami"
 AAT_Sweden.15.desc: "[FROM.GetNameDefCap] telah menolak proposal kami untuk zona demiliterisasi di sekitar Narvik. Kita perlu memutuskan bagaimana menanggapinya dengan memaksakan zona tersebut demi kepentingan saudara-saudara kita di Nordik, atau membiarkan mereka dalam kegelapan."
 AAT_Sweden.15.a: "Kita tidak bisa mempertaruhkan negara kita untuk hal ini"
 AAT_Sweden.15.b: "Kita tidak bisa meninggalkan [NOR.GetName] sendirian"
 AAT_Sweden.15.a_tt: "§YIni akan menghasilkan tujuan perang terhadap [FROM.GetNameDef] jika mereka menolak§!"
 AAT_Sweden.16.t: "[SWE.GetNameDef] mengancam permusuhan atas Narvik"
 AAT_Sweden.16.desc: "Setelah menolak untuk menyerahkan wilayah di sekitar Narvik, pemerintah [SWE.GetAdjective] dengan tegas mengancam akan pecahnya permusuhan antar negara kita jika kita menolak untuk menyerahkan wilayah [NOR.GetAdjective] utara"
 AAT_Sweden.16.a: "Kita tidak bisa mengambil risiko lebih banyak musuh"
 AAT_Sweden.16.b: "Biarkan mereka datang"
 AAT_Sweden.17.t: "[FROM.GetNameDefCap] dengan keras kepala menolak menyerahkan Narvik"
 AAT_Sweden.17.desc: "Meskipun ada ancaman permusuhan atas Narvik [FROM.GetName] menolak mengalah pada tuntutan kami. Kami tidak bisa dan tidak akan membiarkan masyarakat [NOR.GetAdjective] diperlakukan seperti hewan ternak dalam kondisi yang tidak manusiawi. Kita harus mengamankan pelabuhan [NOR.GetAdjective] untuk menghentikan kekuatan penyerang dan membebaskan orang [NOR.GetAdjective]."
 AAT_Sweden.17.a: "Sekarang Anda telah melakukan sandiwara itu dengan skåpet [FROM.GetName]"
 AAT_Sweden.18.t: "[NOR.GetName] meminta Narvik kembali"
 AAT_Sweden.18.desc: "Pemerintahan [NOR.GetAdjective] yang dipulihkan meminta penyerahan Narvik dan wilayah sekitarnya setelah kami melindungi mereka dan warganya selama perang. Dalam komunikenya mereka menyatakan bahwa mereka sangat berterima kasih atas tindakan yang dilakukan oleh pemerintah kami selama perang, dan menantikan kerjasama lebih lanjut dengan kami. Sebuah upacara perayaan akan diadakan untuk menghormati orang-orang yang menjunjung kemerdekaan [NOR.GetAdjective] ini selama malam gelap perang."
 AAT_Sweden.18.a: "Tentu saja, Narvik milik [NOR.GetName]"
 AAT_Sweden.18.b: "Kami akan mengklaim Narvik sebagai pembayaran atas usaha kami"
 AAT_Sweden.19.t: "[SWE.GetNameDefCap] mengembalikan Narvik"
 AAT_Sweden.19.desc: "Ini adalah hari yang cerah untuk akhirnya [Nor.GetName] bersatu kembali. [SWE.GetName] telah dengan baik hati menerima permintaan kami agar Narvik dikembalikan kepada kami, sebuah area yang dilindungi oleh pemerintah [SWE.GetAdjective] selama perang. Kami mengucapkan terima kasih yang sebesar-besarnya kepada pemerintah [SWE.GetAdjective], sungguh ini menandai hubungan yang lebih dalam antara negara-negara kita yang akan bertahan lama."
 AAT_Sweden.19.a: "Sekali lagi Norwegia utuh"
 AAT_Sweden.19_tt: "§Y[ROOT.GetNameDefCap]§! sekarang dapat memberikan §YNorwegian Defense Cross of Honor§! kepada §YField Officers§!."
 AAT_Sweden.20.t: "[SWE.GetNameDefCap] menolak mengembalikan Narvik"
 AAT_Sweden.20.desc: "Di bawah perang [SWE.GetNameDef] dengan berani menduduki sebagian negara kami dengan dalih \"menyelamatkan penduduk Norwegia dari pendudukan yang lebih buruk\". Hal ini ternyata hanyalah tipu muslihat pemerintah [SWE.GetAdjective] untuk memperluas ambisi teritorial mereka, karena mereka menolak menyerahkan kembali wilayah yang diduduki dengan alasan \"masalah stabilitas dunia yang sedang berlangsung dan kerusuhan setelah perang\". Kita melihat melalui hal ini, jelas bahwa ini adalah elemen paling mendasar dari oportunisme, sebuah tindakan terang-terangan yang mengancam kebebasan dan integritas negara kita. Narvik adalah orang Norwegia dan akan tetap demikian, dengan kekerasan jika diperlukan."
 AAT_Sweden.20.a: "Peranglah saat itu"
 AAT_Sweden.21.t: "[FROM.GetName] Mengundang kami ke $scandinavian_defense_union$"
 AAT_Sweden.21.desc: "Melihat kekhawatiran atas ketegangan pasca-perang antara negara-negara pemenang, [FROM.GetName] berpendapat bahwa kita tidak boleh kembali ke kebijakan netralitas terisolasi yang gagal, namun kita harus mengoordinasikan kebijakan militer dan luar negeri kita di seluruh kawasan sehingga kita dapat mencegah agresi di masa depan dengan lebih baik."
 AAT_Sweden.21.a: "Proposal ini bukan untuk kepentingan kami."
 AAT_Sweden.21.b: "Sebuah usulan yang bagus."
 AAT_Sweden.22.t: "[FROM.GetName] Menolak Proposal Serikat Pertahanan"
 AAT_Sweden.22.desc: "Para diplomat [FROM.GetAdjective] memberi tahu kami hari ini bahwa pemerintah mereka tidak ingin melanjutkan bergabung dengan $scandinavian_defense_union$. Mereka berpendapat bahwa kepentingan mereka akan lebih baik jika dilayani di luar organisasi tersebut, setidaknya untuk saat ini."
 AAT_Sweden.22.a: "Sangat mengecewakan."
 AAT_Sweden.23.t: "[FROM.GetName] Permintaan untuk Bergabung dengan Aliansi"
 AAT_Sweden.23.desc: "[FROM.GetName] telah meminta untuk bergabung dengan aliansi kami karena kekhawatiran tentang potensi ketegangan pasca perang antara negara-negara pemenang. Memiliki [FROM.GetName] dalam aliansi kita akan memperluas pengaruh kita di wilayah mereka, namun tentu saja akan membuat kita berkomitmen untuk membela mereka jika konflik lebih lanjut muncul."
 AAT_Sweden.23.a: "Mereka akan menjadi beban bagi keamanan kita."
 AAT_Sweden.23.b: "Kami akan senang jika mereka bergabung dengan kami."
 AAT_Sweden.24.t: "[FROM.GetName] Menolak Keanggotaan Aliansi"
 AAT_Sweden.24.desc: "[FROM.GetName] telah menolak untuk menerima keanggotaan kami dalam aliansi mereka untuk saat ini. Mereka mengungkapkan kekhawatiran mereka akan terlibat dalam lebih banyak konflik dengan memperluas aliansi pada saat ini. Untuk saat ini, sepertinya kami sendirian."
 AAT_Sweden.24.a: "Sangat mengecewakan."
 AAT_Sweden.25.t: "Berinvestasi di Pasukan Khusus"
 AAT_Sweden.25.desc: "Setelah banyak diskusi di antara staf senior militer mengenai bagaimana mengalokasikan dana untuk pasukan khusus baru, proses tersebut terhenti. Tampaknya satu-satunya cara untuk memecahkan kebuntuan adalah pemerintah turun tangan dan mendukung salah satu usulan tersebut."
 AAT_Sweden.25.a: "Penjaga hutan akan menjadi yang paling efektif mengingat medan kita."
 AAT_Sweden.25.b: "Marinir bisa membantu kita mendominasi Baltik."
 AAT_Sweden.25.c: "Pasukan terjun payung akan menjadi kekuatan yang paling serbaguna."
 AAT_Sweden.26.t: "[?195.GetName] hilang."
 AAT_Sweden.26.desc: "Hal yang tidak terpikirkan telah terjadi. Angkatan bersenjata kita telah kehilangan kendali atas [195.GetnameDef], monumen utama rakyat Rusia kini berada di tangan musuh. Ini bukan hanya kerugian strategis, tapi kerugian moral yang sangat besar bagi kebanggaan nasional dan tentara kita.  Sudah ada penurunan moral yang signifikan di kalangan prajurit biasa, dan desas-desus tentang desersi pun tersebar luas; jika kita melanjutkan perang ini, kita akan melakukannya terhadap tentara yang tidak lagi percaya bahwa hidup mereka layak untuk disia-siakan dalam perang yang sia-sia."
 AAT_Sweden.26.a: "Kita harus menuntut perdamaian"
 AAT_Sweden.26.b: "Kita tidak sanggup menanggung rasa malu seperti itu"
 AAT_Sweden.27.t: "[SOV.GetNameDefCap] menyerahkan tuntutannya kepada [?146.GetName]"
 AAT_Sweden.27.desc: "Setelah koalisi kami merebut [?146.GetName], kerusakan yang dialami Tentara Merah semakin parah sehingga Moskow terpaksa mempertimbangkan kembali agresi mereka. Mereka telah menyetujui perdamaian putih dan berjanji untuk tidak lagi mempertaruhkan klaim mereka. Baik di Stockholm maupun Helsinki, masyarakat bergembira, siapa sangka Beruang Merah terbuat dari kertas?"
 AAT_Sweden.27.a: "Hal ini tentu akan meningkatkan moral tentara"
 AAT_Sweden.28.t: "[SWE.GetNameDefCap] meminta pengembalian wilayah yang hilang"
 AAT_Sweden.28.desc: "Karena retorika [SWE.GetLeader] menjadi semakin imperialistik, mungkin tidak mengherankan jika [SWE.GetLeader.GetSheHe] kini menuntut pengembalian kepemilikan kekaisaran mereka yang hilang. Klaim apa pun jelas sudah melewati batas waktu dan hanya palsu, namun selama konflik, kita tidak bisa kehilangan sekutu. Mungkinkah sikap niat baik akan membuat pemimpin mereka senang?"
 AAT_Sweden.28.a: "Tentu saja tidak"
 AAT_Sweden.28.b: "Harga yang harus dibayar untuk sekutu"
 AAT_Sweden.29.t: "[FROM.GetNameDefCap] menolak penyerahan wilayah"
 AAT_Sweden.29.desc: "[FROM.GetNameDefCap] telah menolak permintaan kami untuk menyerahkan koloni-koloni lama kami, dengan menyatakan bahwa klaim kami sangat tidak sesuai dengan geopolitik modern sehingga apa pun selain penolakan mentah-mentah akan membuat lelucon ini terlalu lama."
 AAT_Sweden.29.a: "Kami akan menunjukkannya kepada mereka"
 AAT_Sweden.30.t: "[FROM.GetNameDefCap] menyerahkan koloni"
 AAT_Sweden.30.desc: "[FROM.GetNameDefCap] telah menerima permintaan kami dan sekarang menyerahkan koloni lama kami, hal ini sangat mengejutkan pemerintah kami yang memperkirakan akan ada penolakan lebih lanjut. Hal ini telah menimbulkan protes di wilayah baru kami, namun pasti akan mereda seiring berjalannya waktu."
 AAT_Sweden.30.a: "Kesalahan diperbaiki"
 AAT_Sweden.31.t: "[FROM.GetNameDefCap] meminta Bornholm"
 AAT_Sweden.31.desc: "Duta Besar [FROM.GetAdjective] telah menyampaikan pesan suram. Mereka menuntut agar kami mengembalikan Bornholm kepada mereka, dengan menyatakan bahwa pulau tersebut tidak pernah secara sah diserahkan kepada [DEN.GetName] karena hilang dalam pemberontakan. Karena hal ini terjadi pada abad ke-17, hal ini jelas merupakan alasan terselubung untuk ekspansionisme [FROM.GetAdjective]"
 AAT_Sweden.31.a: "Kami tidak mampu bertengkar dengan [FROM.GetName]"
 AAT_Sweden.31.a_tt: "§RHal ini pada akhirnya dapat menyebabkan [FROM.GetName] dapat menjadi boneka kita§!"
 AAT_Sweden.31.b: "Itu sungguh menggelikan"
 AAT_Sweden.32.t: "[FROM.GetName] menyerahkan Bornholm"
 AAT_Sweden.32.desc: "[FROM.GetNameDefCap] telah memberi tahu kami bahwa mereka tidak akan menentang klaim kami atas Bornholm, namun memberi tahu kami bahwa ini adalah tindakan yang belum pernah terjadi sebelumnya yang mengancam stabilitas negara-negara Nordik."
 AAT_Sweden.32.a: "Terkutuklah yang belum pernah terjadi sebelumnya"
 AAT_Sweden.33.t: "[FROM.GetName] menolak menyerahkan Bornholm"
 AAT_Sweden.33.desc: "Pemerintah [FROM.GetAdjective] telah memberi tahu kami bahwa mereka tidak akan menerima klaim kami atas Bornholm, dengan menyatakan bahwa klaim apa pun yang kami pura-pura masih belum optimal sejak berabad-abad yang lalu. Jika mereka tidak mau menyerahkannya, kita harus mengambilnya dengan paksa, seperti yang kita lakukan berabad-abad sebelumnya."
 AAT_Sweden.33.a: "Sekali lagi kita akan menyeberangi selat itu"
 AAT_Sweden.34.t: "[FROM.GetName] menuntut wilayah otonom"
 AAT_Sweden.34.desc: "Duta Besar [FROM.GetAdjective] telah memberi tahu kami bahwa pemerintah [SWE.GetAdjective] berpandangan bahwa ketika tatanan internasional sedang didefinisikan ulang, pemerintah [THIS.GetAdjective] tidak lagi mampu melindungi wilayah luar negerinya dengan baik. Jika [THIS.GetName] tidak dapat mempertahankan wilayahnya dengan baik maka pemerintahnya harus menyerahkan wilayah tersebut kepada seseorang yang mampu; dan [FROM.GetAdjective] akan menjadi pilihan yang lebih disukai."
 AAT_Sweden.34.a: "Kami tidak punya pilihan"
 AAT_Sweden.34.a_tt: "§RHal ini akan membuat [FROM.GetName] dapat menjadi boneka kita§!"
 AAT_Sweden.34.b: "Itu adalah sesuatu yang tidak mampu kami tanggung"
 AAT_Sweden.35.t: "[FROM.GetName] menyerahkan [DEN.GetAdjective] wilayah luar negeri"
 AAT_Sweden.35.desc: "[FROM.GetName] dengan enggan memutuskan untuk menyerahkan wilayah otonominya. Hal ini tentu saja merusak hubungan kita dengan [FROM.GetName], namun dalam jangka panjang hal ini tidak akan menjadi masalah karena mereka akan masuk ke lingkungan kita."
 AAT_Sweden.35.a: "Bagus"
 AAT_Sweden.36.t: "[FROM.GetName] menolak menyerahkan [DEN.GetAdjective] wilayah luar negeri"
 AAT_Sweden.36.desc: "[FROM.GetName] telah memberi tahu kita bahwa hal itu tidak akan memenuhi visi kita untuk tatanan dunia baru. Meskipun mengajukan klaim, pemerintah [FROM.GetAdjective] dengan keras kepala menolak menyerahkan kembali wilayah yang menjadi hak kami."
 AAT_Sweden.36.a: "Lalu kami akan mengambilnya dengan paksa"
 AAT_Sweden.37.t: "Nasib [DEN.GetName]"
 AAT_Sweden.37.desc: "Pemerintahan [DEN.GetAdjective] sudah cukup lemah hingga tidak mampu lagi bertahan melawan upaya terkonsentrasi yang kami lakukan untuk menegaskan dominasi kami terhadap mereka. Karena kami dulunya tunduk pada Denmark, kini mereka juga akan menjadi subjek kami. Kami hanya perlu memutuskan apa yang harus dilakukan terhadap mereka sebelum menyampaikan ultimatum kami."
 AAT_Sweden.37.a: "Kami akan menggunakannya sebagai zona penyangga"
 AAT_Sweden.37.b: "$AAT_Sweden.37.a$"
 AAT_Sweden.38.t: "[FROM.GetName] bergerak ke wayang [DEN.GetName]"
 AAT_Sweden.38.desc: "Dalam tindakan yang belum pernah terjadi sebelumnya, [FROM.GetName] menuntut pemerintah kita menyerahkan seluruh fungsi dan institusinya kepada mereka. Kepala negara kami telah memprotes keras duta besar mereka, namun ternyata kapal perang [SWE.GetAdjective] terlihat tidak jauh dari Kopenhagen. Pemerintah [DEN.GetAdjective] tidak berdaya untuk menanggapi ancaman tersebut, dan penyerahan resmi ditandatangani 6 jam kemudian."
 AAT_Sweden.38.a: "Untuk pulet"
 AAT_Sweden.39.t: "$AAT_Sweden.38.t$"
 AAT_Sweden.39.desc: "Dalam tindakan yang belum pernah terjadi sebelumnya, [FROM.GetName] menuntut pemerintah kita menyerahkan semua fungsi dan institusinya kepada mereka. Kini jelas bahwa alih-alih mencoba membantu kami, pemerintah [FROM.GetAdjective] malah menggerogoti integritas kami hingga pemerintah merasa nyaman untuk mengambil kendali atas kami."
 AAT_Sweden.39.a: "Mereka tidak akan pernah lagi melintasi es!"
 AAT_Sweden.39.b: "$AAT_Sweden.38.a$"
 AAT_Sweden.40.t: "[FROM.GetName] tuntutan [145.GetName]"
 AAT_Sweden.40.desc: "Seperti yang mereka lakukan pada tahun 1919, pemerintah [FROM.GetAdjective] kembali melakukan serangan terhadap pulau Åland. Meskipun Liga Bangsa-Bangsa mengeluarkan keputusan yang menyerahkan kedaulatan pulau-pulau tersebut kepada kita, [FROM.GetName] tampaknya tidak akan bisa dibiarkan begitu saja. Mungkin percaya bahwa kita berada dalam posisi yang lemah, dan dengan runtuhnya Liga mereka mencium bau darah di dalam air; semua oportunis yang disengaja."
 AAT_Sweden.40.a: "Kita tidak bisa melawan [FROM.GetName]"
 AAT_Sweden.40.b: "Kami tidak akan pernah menyerahkannya"
 AAT_Sweden.41.t: "[FROM.GetName] gua!"
 AAT_Sweden.41.desc: "[FROM.GetName] telah menyerah dan menyerahkan kepulauan Åland kepada kami. Pada akhirnya ketidakadilan di masa lalu telah teratasi dan statusnya yang semestinya telah dipulihkan."
 AAT_Sweden.41.a: "Bagus"
 AAT_Sweden.42.t: "[FROM.GetName] menolak menyerahkan [145.GetName]"
 AAT_Sweden.42.desc: "[FROM.GetName] telah memberitahu kami bahwa mereka dengan keras menolak untuk menyerahkan [145.GetName], dengan menyatakan bahwa masalah tersebut telah diselesaikan oleh Liga Bangsa-Bangsa. Jelas sekali [FROM.GetName] melebih-lebihkan pengaruh yang sebenarnya mereka miliki. Kita harus menunjukkan [FROM.GetName] kesalahan atau caranya."
 AAT_Sweden.42.a: "Itu akan menjadi milik kita"
 AAT_Sweden.43.t: "[FROM.GetName] menuntut demiliterisasi [148.GetName]"
 AAT_Sweden.43.desc: "[FROM.GetName] telah menuntut agar kami mendemiliterisasi perbatasan utara kami. Mereka khawatir akan adanya ancaman terhadap operasi pertambangan mereka, dan pada saat yang sama juga menekankan bahwa ancaman apa pun akan datang dari Timur, bukan dari Barat. Hal ini akan menurunkan ketegangan antara [FROM.GetName] dan kami, yang telah meningkat sejak krisis Åland."
 AAT_Sweden.43.a: "Tindakan kecil mungkin bisa meredakan ketegangan"
 AAT_Sweden.43.b: "Itu melanggar kedaulatan kita"
 AAT_Sweden.44.t: "[FROM.GetName] setuju untuk melakukan demiliterisasi [148.GetName]"
 AAT_Sweden.44.desc: "Sebagai tanda niat baik [FROM.GetName] telah setuju untuk melakukan demiliterisasi [148.GetName]. Sebuah batu loncatan besar bagi kami dalam memulihkan kerajaan timur, perlahan-lahan pengaruh kami terhadap [FROM.GetName] tumbuh."
 AAT_Sweden.44.a: "Sesuai rencana"
 AAT_Sweden.45.t: "[FROM.GetName] menolak demiliterisasi [148.GetName]"
 AAT_Sweden.45.desc: "[FROM.GetName] telah menolak demiliterisasi [148.GetName], dengan menyatakan bahwa kami tidak mempunyai yurisdiksi untuk memutuskan apa yang dilakukan [FROM.GetName] di dalam perbatasannya. Tentunya ini berarti mereka secara aktif berkomplot melawan kita? Sangat penting bagi kita untuk menyerang terlebih dahulu."
 AAT_Sweden.45.a: "Koluder?"
 AAT_Sweden.46.t: "Pertanyaan [FIN.GetName]"
 AAT_Sweden.46.desc: "Jelas bagi semua orang bahwa [FIN.GetName] tidak tahan terhadap ancaman [SOV.GetAdjective]. Orang-orang Finlandia berbicara tentang kedaulatan mereka, namun tidak menyadari bahwa apa yang mereka anggap sebagai kemerdekaan tidak diberikan oleh kekuatan politik atau militer apa pun, namun ada sebagai akibat dari kekacauan akibat perang saudara di Rusia. Sejak hari itu, jam terus berdetak dan akan segera mencapai angka nol, dan musuh lama akan muncul kembali. Oleh karena itu, sangat penting bagi kita untuk mengambil kendali atas urusan [FIN.GetAdjective], sebelum [SOV.GetAdjective] bisa melakukannya."
 AAT_Sweden.46.a: "Boneka mereka"
 AAT_Sweden.46.b: "$AAT_Sweden.46.a$"
 AAT_Sweden.47.t: "[FROM.GetName] bergerak untuk membuat kita boneka"
 AAT_Sweden.47.desc: "Jelas bahwa tetangga kita \"kekhawatiran\" demi keselamatan mereka hanyalah tipu muslihat. Karena kehilangan kemauan dan keunggulan strategis, militer kita belum terorganisir dalam menghadapi realitas geografis yang baru. Kapal perang [FROM.GetAdjective] yang buta terlihat di luar ibu kota kami, pasukan [FROM.GetAdjective] telah melintasi zona demiliterisasi di utara dan ultimatum penyerahan telah dikirimkan kepada kami. Komunitas internasional telah meninggalkan kami."
 AAT_Sweden.47.a: "Mari kita berharap tuan baru kita bersikap lunak."
 AAT_Sweden.48.t: "$AAT_Sweden.47.t$"
 AAT_Sweden.48.desc: "Jelas bahwa tetangga kita \"kekhawatiran\" demi keselamatan mereka hanyalah tipu muslihat. Pemerintah [FROM.GetName] kini menuntut agar kita bersekutu dengan mereka melawan musuh bersama dari Timur. Menyerah pada tuntutan mereka akan menempatkan kita kembali ke dalam lingkup [FROM.GetAdjective] dan melemahkan independensi kita. Pertanyaannya tetap, apakah alternatifnya lebih buruk?"
 AAT_Sweden.48.a: "Nasib kita tidak akan lagi ditentukan oleh orang lain"
 AAT_Sweden.48.b: "$AAT_Sweden.47.a$"
 AAT_Sweden.49.t: "[FROM.GetName] menolak untuk membungkuk"
 AAT_Sweden.49.desc: "[FROM.GetName] telah menolak tuntutan kami, langsung menolaknya. Hal ini secara terang-terangan mengabaikan kekhawatiran kami sekaligus mengancam operasi penambangan kami. Hanya ada tanggapan."
 AAT_Sweden.49.a: "Ketika diplomasi gagal..."
 AAT_Sweden.50.t: "[SWE.GetName] tuntutan [144.GetName]"
 AAT_Sweden.50.desc: "[SWE.GetName] menuntut kendali penuh atas pelabuhan Narvik. Pemerintah mereka membenarkan retorika ini karena kekhawatiran bahwa musuh mungkin akan mendarat di Narvik dan menyerang tambang bijih besi Swedia. Perbedaan pendapat dapat menyebabkan eskalasi konflik lebih lanjut."
 AAT_Sweden.50.a: "Itu tidak layak untuk diperjuangkan"
 AAT_Sweden.50.b: "Itu tidak masuk akal"
 AAT_Sweden.50.a_tt: "§RHal ini akan membuat [SWE.GetName] mampu menjadi boneka kita§!"
 AAT_Sweden.51.t: "[FROM.GetName] gua"
 AAT_Sweden.51.desc: "[FROM.GetName] telah menyerah dan menyerahkan Narvik kepada kami. Ini mengamankan bijih besi dari Gällivare dan Kiruna, sekaligus melemahkan [FROM.GetName]"
 AAT_Sweden.51.a: "Luar biasa"
 AAT_Sweden.52.t: "$AAT_Sweden.49.t$"
 AAT_Sweden.52.desc: "$AAT_Sweden.49.desc$"
 AAT_Sweden.52.a: "$AAT_Sweden.49.a$"
 AAT_Sweden.53.t: "Pertanyaan [NOR.GetName]"
 AAT_Sweden.53.desc: "Pemerintah [SWE.GetAdjective] tanpa provokasi telah menuntut agar kami mundur dari pasukan kami dan bersekutu dengan negara Nordik yang baru. Meskipun mereka menyatakan bahwa ini adalah program kerja sama, namun jelas siapa yang tunduk dan siapa yang menjadi tuan. Ini secara efektif merupakan kembalinya ke masa-masa Persatuan sebelumnya."
 AAT_Sweden.53.a: "Tidak pernah! Untuk mempersenjatai"
 AAT_Sweden.53.b: "Kami tidak mempunyai kekuatan untuk melawan"
 AAT_Sweden_ball_bearing.1.t: "Tetapkan ketentuan perdagangan Bantalan Bola untuk [FROM.FROM.GetName]"
 AAT_Sweden_ball_bearing.1.desc: "Ball Bearing kami adalah yang terbaik dan dicari oleh negara-negara besar di dunia untuk mesin perang mereka. Kami sedang melakukan negosiasi dengan [FROM.GetName] untuk memperdagangkan barang-barang berharga ini, namun pertama-tama kami harus memutuskan apa yang kami inginkan sebagai imbalannya."
 AAT_Sweden_ball_bearing.1.a: "Kita perlu mengamankan bahan makanan"
 AAT_Sweden_ball_bearing.1.a_tt: "$we_will_gain_tt$\nStabilitas: §G+2%§!\nTenaga Kerja Mingguan: §G+15§!.\nIni bisa ditumpuk."
 AAT_Sweden_ball_bearing.1.b: "Kami membutuhkan keahlian militer mereka"
 AAT_Sweden_ball_bearing.1.c: "Mintalah berbagi ilmu"
 AAT_Sweden_ball_bearing.1.c_tt: "Jika diterima [SWE.GetNameDef] akan dapat memilih §G+25%§! bonus penelitian untuk §YKapal§!, §YRadar§!, §YSumber daya sintetis§! atau §YDukungan teknologi§!"
 AAT_Sweden_ball_bearing.1.d: "Batalkan negosiasi untuk saat ini"
 AAT_Sweden_ball_bearing.2.t: "[SWE.GetNameDefCap] meminta tukar tambah bahan makanan dengan Ball Bearing"
 AAT_Sweden_ball_bearing.2.desc: "[SWE.GetNameDefCap] telah meminta untuk memperdagangkan Ball Bearing mereka yang sangat berharga, yang akan menjadi sumber daya utama bagi upaya perang kita, melawan impor makanan. Pemerintah [SWE.GetAdjective] tampaknya mencari cara untuk mengamankan impor penting ini dalam potensi konflik di masa depan, karena hal ini merupakan masalah besar selama blokade Perang Besar."
 AAT_Sweden_ball_bearing.2.a: "Perdagangan yang saling menguntungkan"
 AAT_Sweden_ball_bearing.2.b: "Kami tidak mampu menanggungnya"
 AAT_Sweden_ball_bearing.3.t: "[SWE.GetNameDefCap] meminta perdagangan keahlian militer untuk Bantalan Bola"
 AAT_Sweden_ball_bearing.3.desc: "[SWE.GetNameDefCap] telah meminta untuk menukar Ball Bearing mereka yang sangat berharga, yang akan menjadi sumber daya utama bagi upaya perang kita, agar tidak berbagi keahlian militer kita dengan mereka. Pemerintah [SWE.GetAdjective] tampaknya mencari cara untuk menyamakan kedudukan dengan kekuatan militer Eropa yang lebih maju dalam potensi konflik di masa depan."
 AAT_Sweden_ball_bearing.3.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.3.b: "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.4.t: "[SWE.GetNameDefCap] meminta pertukaran pengetahuan untuk Bantalan Bola"
 AAT_Sweden_ball_bearing.4.desc: "[SWE.GetNameDefCap] telah meminta untuk memperdagangkan Ball Bearing mereka yang sangat berharga, yang akan menjadi sumber daya utama bagi upaya perang kita melawan pengetahuan dan kemajuan ilmiah kita. Pemerintah [SWE.GetAdjective] tampaknya mencari cara untuk mengatasi potensi konflik melalui kemajuan ilmu pengetahuan, sesuatu yang tentunya dapat kita bantu."
 AAT_Sweden_ball_bearing.4.a: "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.4.b: "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.5.t: "[FROM.GetNameDefCap] menerima jual beli Ball Bearing"
 AAT_Sweden_ball_bearing.5.desc: "$AAT_Sweden.25.desc$\nKita sekarang perlu fokus pada jenis teknologi apa yang ingin kita miliki lebih banyak wawasan bahkan perbedaan antara kita dan negara-negara besar lainnya."
 AAT_Sweden_ball_bearing.5.a: "Teknologi Pendukung"
 AAT_Sweden_ball_bearing.5.b: "Teknologi Radar"
 AAT_Sweden_ball_bearing.5.c: "Teknologi Oli Sintetis"
 AAT_Sweden_ball_bearing.5.d: "Teknologi Kapal"
 AAT_Sweden_ball_bearing.6.t: "[FROM.GetNameDefCap] menerima jual beli Ball Bearing"
 AAT_Sweden_ball_bearing.6.desc: "[FROM.GetNameDefCap] telah dengan baik hati menerima tawaran dagang kami. Kesepakatan ini pasti akan membawa keuntungan bersama bagi kami berdua. Dalam dunia yang semakin tidak aman, perdagangan menjadi alat penting untuk mengurangi ketegangan antar negara berdaulat."
 AAT_Sweden_ball_bearing.6.a: "Berita bagus"
 AAT_Sweden_ball_bearing.7.t: "[FROM.GetNameDefCap] menolak perdagangan Ball Bearing"
 AAT_Sweden_ball_bearing.7.desc: "[FROM.GetNameDefCap] telah menolak proposal perjanjian perdagangan timbal balik. Mereka mengutip penurunan cepat dalam iklim politik global dan akibatnya setiap kesepakatan militer besar harus ditunda."
 AAT_Sweden_ball_bearing.7.a: "Sayang sekali"
 AAT_Sweden_ball_bearing.8.t: "Perdagangan Bantalan Bola dibatalkan saat pecahnya perang"
 AAT_Sweden_ball_bearing.8.desc: "Tidak mengherankan jika pecahnya perang antar negara, perdagangan Bantalan Bola telah dibatalkan secara paksa oleh kedua pemerintah. Perjanjian perdagangan yang pernah dipuji sebagai batu loncatan dalam mengurangi langkah lambat menuju perang global tidak diragukan lagi telah gagal.\nSekarang alat-alat penting ini akan diubah menjadi mesin perang yang pada akhirnya tidak akan menghasilkan apa-apa selain darah, rasa sakit dan penderitaan."
 AAT_Sweden_ball_bearing.8.a: "Apakah ini suatu keniscayaan?"
 AAT_Sweden_flashpoints.10.t: "[SOV.GetAdjective] Serangan Udara di Utara [SWE.GetName]"
 AAT_Sweden_flashpoints.10.desc: "Warga Pajala, sebuah desa dekat perbatasan [FIN.GetAdjective], hari ini dikejutkan oleh serangkaian ledakan yang menyebabkan hancurnya beberapa bangunan dan kendaraan. Untungnya, tidak ada yang terluka parah. Bukti dengan jelas menunjukkan bahwa ledakan tersebut disebabkan oleh pelaku bom [SOV.GetAdjective] yang salah mengira daerah tersebut sebagai sasaran di [FIN.GetName].\n\nKita perlu mengatasi situasi ini sebelum sentimen publik menjadi tidak terkendali. Namun, kita juga harus berhati-hati agar tidak memicu konflik yang lebih luas dengan [SOV.GetNameDef]."
 AAT_Sweden_flashpoints.10.a: "Dunia harus mendengar tindakan agresi ini."
 AAT_Sweden_flashpoints.10.b: "Kami akan mendekati kedutaan [SOV.GetAdjective] dengan hati-hati untuk menghindari eskalasi."
 AAT_Sweden_flashpoints.10.c: "Tidak banyak manfaat yang dapat diperoleh dari menghadapi Soviet."
 AAT_Sweden_flashpoints.11.t: "[SWE.GetName] Marah dengan Pengeboman Pajala"
 AAT_Sweden_flashpoints.11.desc: "Pilot [SOV.GetAdjective] secara tidak sengaja melakukan serangan udara di desa [SWE.GetAdjective] setelah salah mengira desa tersebut sebagai target di [FIN.GetName]. Pemerintah [SWE.GetAdjective] kini bertindak dengan marah, menarik perhatian dunia terhadap kecelakaan malang tersebut.\n\nKita dapat mengakui kejadian tersebut dan menawarkan untuk membayar ganti rugi atas kerusakan yang terjadi, namun hal ini mungkin akan membuat warga negara kita mempertanyakan tindakan militer kita di [FIN.GetName] dan dianggap sebagai tanda kelemahan oleh negara lain."
 AAT_Sweden_flashpoints.11.a: "Kita tidak bisa mengambil risiko terseret ke dalam konflik yang lebih luas. Kami akan meminta maaf kepada pemerintah [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.11.b: "Tolak keterlibatan dan tuduh [SWE.GetAdjective] yang mendalangi serangan itu sendiri."
 AAT_Sweden_flashpoints.12.t: "[SWE.GetAdjective] Diplomat Tuntut Penjelasan Bom Pajala"
 AAT_Sweden_flashpoints.12.desc: "Pilot [SOV.GetAdjective] secara tidak sengaja melakukan serangan udara di desa [SWE.GetAdjective] setelah salah mengira desa tersebut sebagai target di [FIN.GetName]. Duta Besar dari kedutaan [SWE.GetAdjective] telah menghubungi kami untuk meminta penjelasan atas serangan tersebut, serta bagaimana kami bermaksud memberikan kompensasi kepada mereka.\n\nUntungnya, berita mengenai kecelakaan tersebut belum tersebar luas dan oleh karena itu kita memiliki kesempatan untuk segera menyelesaikan situasi ini sebelum menjadi lebih parah."
 AAT_Sweden_flashpoints.12.a: "Kami akan membayar ganti rugi kepada [SWE.GetName] atas kerusakan tersebut."
 AAT_Sweden_flashpoints.12.b: "Tolak keterlibatan dan tuduh [SWE.GetAdjective] yang mendalangi serangan itu sendiri."
 AAT_Sweden_flashpoints.13.t: "[SOV.GetNameDefCap] Minta Maaf Atas Pengeboman Pajala"
 AAT_Sweden_flashpoints.13.desc: "Pejabat dari [SOV.GetNameDef] telah meminta maaf atas serangan baru-baru ini di Pajala, dan menegaskan bahwa itu adalah kesalahan nyata yang dilakukan pilot mereka. Mereka juga setuju untuk memberikan kompensasi kepada kami atas kerusakan yang ditimbulkan. Tampaknya [SOV.GetAdjective] berusaha untuk bersikap lebih kooperatif dalam hubungan dengan harapan menghindari eskalasi lebih lanjut di antara kita."
 AAT_Sweden_flashpoints.13.a: "Kami akan menganggap masalah ini terselesaikan."
 AAT_Sweden_flashpoints.14.t: "[SOV.GetNameDefCap] Menolak Mengakui Keterlibatan dalam Pajala"
 AAT_Sweden_flashpoints.14.desc: "Upaya diplomat kami untuk melanjutkan insiden Pajala dengan pejabat [SOV.GetAdjective] menemui penolakan atas keterlibatannya. Lebih jauh lagi, mereka berusaha menyalahkan kami atas pemboman tersebut sebagai dalih untuk mengganggu operasi militer mereka di [FIN.GetName]."
 AAT_Sweden_flashpoints.14.a: "Sebuah sikap yang keterlaluan untuk diambil. Kami akan membuat mereka menderita."
 AAT_Sweden_flashpoints.14.b: "Kita tidak bisa mengambil risiko melakukan tindakan yang akan memperburuk situasi."
 AAT_Sweden_flashpoints.15.t: "[SWE.GetName] Mengirim Bantuan Militer"
 AAT_Sweden_flashpoints.15.desc: "Pembom [SOV.GetAdjective] baru-baru ini terlihat melintasi wilayah udara kami menuju [SWE.GetName] dan mengebom sebuah desa, karena diyakini sebagai target [FIN.GetAdjective]. Sejak itu, krisis diplomatik meletus antara [SOV.GetNameDef] dan [SWE.GetName] yang kini meningkat hingga [SWE.GetName] memutuskan untuk secara aktif memasok senjata kepada kami untuk memerangi [SOV.GetAdjective]. Masih harus dilihat bagaimana tanggapan [SOV.GetAdjective]."
 AAT_Sweden_flashpoints.15.a: "Tragisnya, kami berterima kasih kepada tetangga kami yang [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.16.t: "Ketegangan dengan [SWE.GetName] Mengurangi"
 AAT_Sweden_flashpoints.16.desc: "Setelah serangkaian ketegangan yang meningkat antara [SWE.capital.GetCapitalVictoryPointName] dan [SOV.capital.GetCapitalVictoryPointName], ketegangan akhirnya tampak mereda. Pemerintah [SWE.GetAdjective] telah mundur dari retorika agresif mereka seputar insiden Pajala dan nampaknya menerima bahwa tidak banyak yang dapat mereka lakukan agar kita mengakui hal tersebut."
 AAT_Sweden_flashpoints.16.a: "Sudah saatnya mereka mundur."
 AAT_Sweden_flashpoints.17.t: "[SWE.GetName] Meningkatkan Ketegangan dengan Mempersenjatai [FIN.GetName]"
 AAT_Sweden_flashpoints.17.desc: "Dengan kegagalan upaya [SWE.GetName] untuk mencoreng reputasi kami atas pemboman Pajala, mereka kini secara terang-terangan mempersenjatai militer [FIN.GetAdjective] dengan peralatan infanteri. Ini jelas merupakan upaya untuk memeras kami agar menerima tanggung jawab atas serangan tersebut atau berisiko menyebabkan lebih banyak tentara Soviet tewas.\n\nKita harus hati-hati menilai langkah kita selanjutnya untuk mencegah [SWE.GetAdjective] terlibat sepenuhnya dalam perang sebagai sekutu [FIN.GetAdjective]."
 AAT_Sweden_flashpoints.17.a: "Kami akan melakukan eskalasi dengan mengancam perang jika mereka tidak berhenti."
 AAT_Sweden_flashpoints.17.b: "Kita harus menenangkan [SWE.GetAdjective]. Untuk saat ini."
 AAT_Sweden_flashpoints.18.t: "[SOV.GetNameDefCap] Menuntut Diakhirinya Pengiriman Senjata"
 AAT_Sweden_flashpoints.18.desc: "Pengiriman senjata kami yang sengaja dan provokatif ke [FIN.GetName] telah menarik perhatian [SOV.GetNameDef]. Para diplomat dari Moskow telah memberi tahu kami bahwa [SOV.GetLeader] memandang tindakan kami sama saja dengan ikut serta dalam konflik melawan [SOV.GetNameDef] dan bahwa semua langkah yang diperlukan akan diambil terhadap kami."
 AAT_Sweden_flashpoints.18.a: "[SOV.GetLeader] adalah gertakan dan kami tidak akan tertipu. Lanjutkan pengirimannya."
 AAT_Sweden_flashpoints.18.b: "Kita tidak bisa mengambil risiko eskalasi lebih lanjut dengan Soviet."
 AAT_Sweden_flashpoints.19.t: "[SWE.GetName] Menolak Ultimatum"
 AAT_Sweden_flashpoints.19.desc: "Para diplomat [SWE.GetAdjective] telah menegaskan bahwa mereka tidak berniat menghentikan pengiriman senjata mereka sampai kami mengakui keterlibatan kami dalam pemboman Pajala dan membayar ganti rugi. Jika kita tidak bertindak atas ancaman yang kita berikan, negara-negara lain di kawasan ini mungkin akan menganggap kita sebagai sasaran empuk tindakan agresif mereka. Namun, melibatkan banyak negara dalam operasi militer [FIN.GetAdjective] kita mungkin akan menyebabkan konflik meningkat menjadi skala global."
 AAT_Sweden_flashpoints.19.a: "Mereka tidak memberi kita pilihan."
 AAT_Sweden_flashpoints.19.b: "Kita harus menenangkan [SWE.GetAdjective]. Untuk saat ini."
 AAT_Sweden_flashpoints.20.t: "[SWE.GetName] Mengusulkan Aliansi Anti-[SOV.GetAdjective]"
 AAT_Sweden_flashpoints.20.desc: "Dengan meningkatnya ketegangan baru-baru ini antara [SWE.GetName] dan [SOV.GetNameDef] yang berubah menjadi konflik terbuka, para duta besar [SWE.GetAdjective] menyarankan untuk bekerja lebih dekat dengan mereka dalam aliansi militer melawan musuh bersama kita."
 AAT_Sweden_flashpoints.20.a: "Bersama-sama, kita bisa mengatasi ancaman [SOV.GetAdjective]."
 AAT_Sweden_flashpoints.20.b: "Kami mengelolanya sendiri."
  SWE_nordic_defense_pact: "Pakta Pertahanan Nordik"
 AAT_Sweden_flashpoints.21.t: "[SWE.GetAdjective]-[FIN.GetAdjective] Aliansi"
 AAT_Sweden_flashpoints.21.desc: "Dengan meningkatnya ketegangan baru-baru ini antara [SWE.GetName] dan [SOV.GetNameDef] yang berubah menjadi konflik terbuka, para diplomat menyarankan agar kita menjangkau rekan-rekan [FIN.GetAdjective] mereka dan membentuk aliansi militer melawan musuh bersama kita."
 AAT_Sweden_flashpoints.21.a: "Kita harus mendorong lebih banyak kerja sama antar negara."
 AAT_Sweden_flashpoints.21.b: "Kita bisa mengalahkan [SOV.GetLeader] tanpa dukungan [FIN.GetAdjective]."
 AAT_Sweden_flashpoints.22.t: "[FIN.GetName] Menolak Proposal Aliansi"
 AAT_Sweden_flashpoints.22.desc: "Para diplomat [FIN.GetAdjective] telah memberi tahu kita bahwa meskipun mereka mempunyai musuh yang sama di [SOV.GetNameDef], tujuan strategis pemerintah mereka sangat berbeda dengan tujuan kita. Karena itu, sayangnya mereka menolak proposal aliansi kami."
 AAT_Sweden_flashpoints.22.a: "Sebuah keputusan yang disayangkan."
 AAT_Sweden_flashpoints.30.t: "Hak Transit di [SWE.GetName]"
 AAT_Sweden_flashpoints.30.desc: "Meskipun kita telah berhasil memperoleh pijakan di Skandinavia, mengangkut pasukan dan peralatan melalui Sabuk Denmark bisa jadi berbahaya. Konvoi sering kali menjadi korban serangan udara dan laut musuh saat berada di laut terbuka. Oleh karena itu, sebisa mungkin meminimalkan penggunaan jalur laut akan bermanfaat bagi upaya perang kita.\n\nOleh karena itu, mungkin ada baiknya memberikan tekanan pada [SWE.GetName] tetangga untuk mengizinkan kami mengakses kereta api dan jaringan komunikasi mereka. Namun, kita harus bersikap bijaksana dan secara bertahap menghilangkan kenetralan mereka jika kita ingin menghindari mereka menjadi basis operasi musuh kita."
 AAT_Sweden_flashpoints.30.a: "Dekati [SWE.GetName] dengan permintaan transit kemanusiaan melalui jaringan kereta api mereka."
 AAT_Sweden_flashpoints.30.b: "Kami tidak membutuhkan infrastruktur [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.31.t: "[GER.GetName] Meminta Hak Transit Bagi Yang Terluka"
 AAT_Sweden_flashpoints.31.desc: "Kami telah didekati oleh anggota pemerintahan [GER.GetAdjective] dengan permintaan untuk membatasi penggunaan jaringan kereta api kami agar pasukan yang terluka dan mereka yang sedang cuti dapat melakukan perjalanan ke dan dari [GER.GetNameDef] melalui [SWE.GetName] dan [DEN.GetName]. Meskipun mereka bersikeras bahwa permintaan tersebut murni karena alasan kemanusiaan, tidak sulit untuk membayangkan bahwa mereka akan menggunakan hal ini untuk secara bertahap mengikis netralitas kita."
 AAT_Sweden_flashpoints.31.a: "Kelangsungan hidup lebih penting daripada netralitas."
 AAT_Sweden_flashpoints.31.b: "Tolak permintaan tersebut dan ingatkan mereka akan netralitas kita."
 AAT_Sweden_flashpoints.32.t: "[SWE.GetName] Menolak Permintaan"
 AAT_Sweden_flashpoints.32.desc: "[SWE.GetName] dengan keras kepala menolak mengizinkan kami mengakses infrastruktur mereka sambil menyatakan komitmen mereka terhadap netralitas. Mungkin mereka memerlukan tanggapan yang lebih tegas untuk mengingatkan mereka bahwa kelanjutan kemerdekaan mereka hanyalah imbalan dari kita atas kepatuhan mereka ketika kita melakukan reorganisasi di Eropa."
 AAT_Sweden_flashpoints.32.a: "Beritahu mereka bahwa [GER.GetLeader] mulai meragukan netralitas mereka."
 AAT_Sweden_flashpoints.32.b: "Hilangkan masalahnya, kita tidak bisa mengambil risiko mereka bergabung dengan musuh."
 AAT_Sweden_flashpoints.33.t: "[GER.GetLeader] Pertanyaan [SWE.GetAdjective] Netralitas"
 AAT_Sweden_flashpoints.33.desc: "Kami telah menerima telegram tegas dari [GER.Capital.GetCapitalVictoryPointName] yang memberitahukan kami bahwa [GER.GetLeader] kecewa atas penolakan kami atas permintaan mereka baru-baru ini. Tampaknya pemimpin [GER.GetAdjective] mulai mempertanyakan kenetralan kami dan percaya bahwa tindakan kami baru-baru ini merupakan indikasi kemunduran kami dalam memihak musuh [GER.GetName].\n\nTampaknya mereka bersedia untuk meningkatkan situasi menjadi konflik jika diperlukan. Oleh karena itu, mungkin sudah waktunya bagi kita untuk mengevaluasi kembali pendirian kita saat ini."
 AAT_Sweden_flashpoints.33.a: "Kelangsungan hidup lebih penting daripada netralitas."
 AAT_Sweden_flashpoints.33.b: "Kami tidak akan dipaksa oleh [GER.GetLeader], mulailah mengerahkan kekuatan kami."
 AAT_Sweden_flashpoints.34.t: "[SWE.GetName] Tingkatkan Kesiapan Militer"
 AAT_Sweden_flashpoints.34.desc: "Militer [SWE.GetAdjective] telah diatur ke tingkat kesiapan yang tinggi dengan cara yang sengaja dan provokatif, kemungkinan besar untuk menunjukkan kesediaan mereka untuk menolak tekanan yang kita berikan terhadap mereka. Kita harus berhati-hati, atau kita berisiko terlibat dalam konflik lain di Skandinavia."
 AAT_Sweden_flashpoints.34.a: "Mulailah persiapan untuk menyerang [SWE.GetName] dan kirimkan ultimatum kepada mereka."
 AAT_Sweden_flashpoints.34.b: "Ini tidak sebanding dengan risikonya."
 AAT_Sweden_flashpoints.35.t: "[GER.GetName] Mengeluarkan Ultimatum"
 AAT_Sweden_flashpoints.35.desc: "[GER.GetNameDefCap] telah mengeluarkan ultimatum yang keras, di mana mereka menuntut agar kami mengabulkan tuntutan terbaru mereka mengenai akses terhadap infrastruktur kami. Dinyatakan bahwa jika kami gagal melakukan hal tersebut, mereka akan menganggap kami sebagai musuh [GER.GetNameDef] dan menggunakan semua kekuatan yang diperlukan untuk mengamankan kepentingan mereka di Skandinavia."
 AAT_Sweden_flashpoints.35.a: "Kelangsungan hidup lebih penting daripada netralitas."
 AAT_Sweden_flashpoints.35.b: "Jika perang tidak bisa dihindari, kita harus berperang dengan cara kita sendiri."
 AAT_Sweden_flashpoints.35.c: "Kami tidak akan terpengaruh oleh netralitas kami."
 AAT_Sweden_flashpoints.36.t: "Ketegangan dengan [GER.GetNameDef] Menurun"
 AAT_Sweden_flashpoints.36.desc: "Untungnya, ketegangan baru-baru ini dengan [GER.GetNameDef] mulai mereda. Terlepas dari semua gertakan mereka, tampaknya kita berhasil melewati situasi diplomatik yang sangat sulit. Namun, kita harus waspada karena tindakan kita baru-baru ini kemungkinan besar akan menimbulkan kebencian yang besar terhadap kita di [GER.Capital.GetCapitalVictoryPointName]."
 AAT_Sweden_flashpoints.36.a: "Semoga kita bisa menjaga netralitas kita."
 AAT_Sweden_flashpoints.37.t: "[SWE.GetName] Menolak Ultimatum"
 AAT_Sweden_flashpoints.37.desc: "Pemerintah [SWE.GetAdjective] dengan tegas menolak ultimatum kami dengan menyatakan bahwa kita tidak boleh salah menafsirkan netralitas mereka sebagai pengakuan atas kelemahan atau ketidaksiapan mereka. Mereka selanjutnya menyatakan bahwa militer kita harus bersiap menghadapi banyak korban jiwa jika tindakan sembrono diambil terhadap [SWE.GetName].\n\nIni mungkin hanya sebuah gertakan untuk menghalangi tindakan militer, namun pengamatan terhadap pasukan Swedia menunjukkan bahwa mereka bersedia memperjuangkan kemerdekaan mereka."
 AAT_Sweden_flashpoints.37.a: "Kita tidak bisa mengambil risiko menggunakan kekuatan militer secara berlebihan."
 AAT_Sweden_flashpoints.37.b: "Mulailah invasi [SWE.GetName]."
 AAT_Sweden_flashpoints.38.t: "[SWE.GetName] Meluncurkan Serangan Pre-Emptive"
 AAT_Sweden_flashpoints.38.desc: "Tampaknya kita telah salah menilai kesediaan [SWE.GetAdjective] untuk berjuang. Meskipun netral selama lebih dari satu abad, angkatan bersenjata [SWE.GetAdjective] melancarkan serangan pendahuluan terhadap pasukan kita di Norwegia hari ini yang mengejutkan mereka. Meskipun hasil dari konflik ini masih belum pasti, sulit untuk tidak dengan enggan menghormati keberanian rekan-rekan kita yang [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.38.a: "[SWE.GetName] akan menjadi catatan kaki dalam sejarah kita."
 AAT_Sweden_flashpoints.39.t: "[SWE.GetName] Mengizinkan Transit Orang yang Terluka"
 AAT_Sweden_flashpoints.39.desc: "[SWE.GetName] telah mengizinkan pasukan kami yang terluka dan mereka yang sedang cuti untuk melakukan perjalanan melalui jaringan kereta api mereka kembali ke [GER.GetNameDef]. Mereka bersikeras bahwa hanya personel tak bersenjata yang boleh melakukan hal tersebut dan kuota yang ketat akan diberlakukan untuk memastikan jumlah pasukan di Swedia tidak terlalu banyak pada waktu tertentu."
 AAT_Sweden_flashpoints.39.a: "Bagus sekali, kita tidak akan membuat mereka frustrasi lebih jauh lagi."
 AAT_Sweden_flashpoints.39.b: "Terus dorong, kami mungkin bisa mendapatkan akses ke jaringan komunikasi mereka."
 AAT_Sweden_flashpoints.40.t: "[GER.GetName] Meminta Akses ke Jaringan Telepon dan Telegraf"
 AAT_Sweden_flashpoints.40.desc: "Seperti yang kami khawatirkan, permintaan baru-baru ini dari Jerman untuk akses ke jaringan kereta api kami kini telah diperluas. Pemerintah [GER.Adjective] meminta kemampuan untuk menggunakan jaringan telegraf dan telepon kami untuk berkomunikasi langsung antara [NOR.GetName] dan [GER.GetNameDef].\n\nMenyerah pada permintaan ini akan menjadi pukulan lain bagi netralitas kami, namun kami dapat menyelidiki penyadapan jalur komunikasi untuk memata-matai apa yang direncanakan oleh militer [GER.GetAdjective]."
 AAT_Sweden_flashpoints.40.a: "Kelangsungan hidup lebih penting daripada netralitas."
 AAT_Sweden_flashpoints.40.b: "Kita bisa menggunakan ini untuk keuntungan kita."
 AAT_Sweden_flashpoints.40.c: "Kita tidak bisa meninggalkan netralitas kita."
  SWE_spying_on_GER: "Kami memata-matai komunikasi Jerman melalui jaringan kami"
 AAT_Sweden_flashpoints_tt_arne_beurling: "Membuka §YArne Beurling§! ($MODIFIER_DECRYPTION_POWER$: §G+15§!) sebagai penasihat"
 AAT_Sweden_flashpoints.41.t: "[SWE.GetName] Memungkinkan Akses ke Jaringan Telepon dan Telegraf"
 AAT_Sweden_flashpoints.41.desc: "Komunikasi antara [GER.Capital.GetCapitalVictoryPointName] dan pasukan kami di [NOR.GetName] menjadi jauh lebih mudah berkat kerja sama pemerintah Swedia.  Mungkin kita harus menghindari permusuhan lebih jauh dengan mereka sehingga kita tidak mengambil risiko kehilangan konsesi kita."
 AAT_Sweden_flashpoints.41.a: "Luar biasa, kami telah memperoleh sebanyak yang kami bisa dari mereka."
 AAT_Sweden_flashpoints.41.b: "Kita harus melakukan upaya terakhir untuk mendapatkan akses militer penuh."
 AAT_Sweden_flashpoints.42.t: "[GER.GetName] Meminta Akses Militer"
 AAT_Sweden_flashpoints.42.desc: "Tidak puas dengan konsesi yang mereka berikan sebelumnya, pemerintah [GER.GetNameDef] telah meminta akses militer untuk meringankan beban operasi militer mereka di Skandinavia. Tampak jelas bahwa ini selalu merupakan niat [GER.GetAdjective] dan kegagalan untuk mengakui sisa-sisa netralitas kami akan digunakan sebagai pembenaran oleh [GER.GetLeader] untuk melakukan invasi terhadap [SWE.GetName]. Namun, jika kami mengizinkan akses tersebut, tetangga kami dan musuh [GER.GetNameDef] kemungkinan besar akan menganggap kami terlibat dalam pendudukan mereka terhadap [NOR.GetName]."
 AAT_Sweden_flashpoints.42.a: "Kami tidak memiliki kekuatan untuk melawan [GER.GetName]."
 AAT_Sweden_flashpoints.42.b: "Kita harus menolak tuntutan ini agar kita tidak terseret ke dalam perang ini."
 AAT_Sweden_flashpoints.43.t: "[SWE.GetName] Memungkinkan Akses Militer"
 AAT_Sweden_flashpoints.43.desc: "[SWE.GetName] telah memberi kami akses militer penuh ke negara mereka. Hal ini tidak hanya membantu operasi kami di Skandinavia, tetapi juga meningkatkan pengaruh kami terhadap [SWE.GetName] dan mencegah mereka bergabung dengan musuh kami dengan mudah."
 AAT_Sweden_flashpoints.43.a: "Mereka berada di bawah kendali kita kecuali nama."
  SWE_GER_military_access_tt: "§Y[GER.GetFlag][GER.GetNameDefCap]§! §Rakan mendapatkan akses militer ke§! §Y[SWE.GetFlag][SWE.GetName]§!"
 AAT_Sweden_flashpoints.50.t: "Musuh di Dalam"
 AAT_Sweden_flashpoints.50.desc: "Meskipun kita selalu mengawasi aktivitas kelompok sayap kiri, bukan tidak mungkin kita memperkirakan komunis akan menyabotase militer kita atau menabur ketidakpuasan di industri-industri utama untuk mempermudah serangan [SOV.GetAdjective] ke [SWE.GetName]. Oleh karena itu, kita harus mencegah kegiatan tersebut dengan menginternir mereka yang dikenal sebagai simpatisan [SOV.GetNameDefCap] atau yang berhaluan sayap kiri secara umum."
 AAT_Sweden_flashpoints.50.a: "Kita tidak bisa mengambil risiko menyebabkan masalah. Kunci mereka."
 AAT_Sweden_flashpoints.50.b: "Hal ini tidak dapat diterima dalam masyarakat demokratis."
 AAT_Sweden_flashpoints.51.t: "Kemarahan Atas Keputusan Penginterniran"
 AAT_Sweden_flashpoints.51.desc: "Menyusul keputusan kami untuk mulai menginternir kaum kiri radikal di [SWE.GetName], penggerebekan dan penangkapan yang dilakukan oleh polisi untuk memenuhi tujuan tersebut mendapat tentangan keras dari para pekerja. Banyak yang bahkan membantu kelompok radikal untuk melarikan diri dari penangkapan atau langsung menyerang petugas polisi. Mereka menyatakan bahwa penahanan massal seperti itu berarti pembentukan negara polisi. Kita harus berhati-hati dalam melanjutkan, jika tidak segala sesuatunya akan menjadi tidak terkendali dengan sangat cepat."
 AAT_Sweden_flashpoints.51.a: "Kirim tentara untuk mendukung polisi."
 AAT_Sweden_flashpoints.51.b: "Ini adalah sebuah kesalahan, kami harus membebaskan mereka yang telah kami tangkap."
 AAT_Sweden_flashpoints.52.t: "Protes Massal dan Kekerasan Meletus Karena Penangkapan Kelompok Kiri"
 AAT_Sweden_flashpoints.52.desc: "Keputusan kami untuk meminta tentara mendukung polisi dalam menangkap kelompok sayap kiri radikal telah menyebabkan spiral kekerasan yang mengancam akan melanda negara ini dalam perang saudara. Bentrokan antara pekerja dan polisi telah menyebabkan sejumlah kematian dan cedera. Kaum radikal yang gagal kami tangkap sedang menggalang semangat buruh untuk menentang kami dan menyerukan pembubaran total pemerintah. Terlebih lagi, kita telah melihat sejumlah tentara menolak melaksanakan perintah dan bahkan meninggalkan militer sepenuhnya. Ini mungkin merupakan situasi paling mengerikan yang pernah dialami negara ini selama lebih dari satu abad."
 AAT_Sweden_flashpoints.52.a: "Kita tidak bisa membiarkan rakyat jelata ini menghancurkan bangsa kita."
 AAT_Sweden_flashpoints.52.b: "Kita harus menghentikan penangkapan, kita menghancurkan negara."
 AAT_Sweden_flashpoints.53.t: "Perang Saudara [SWE.GetAdjective] Meletus"
 AAT_Sweden_flashpoints.53.desc: "Kekerasan sporadis yang terjadi dalam beberapa minggu terakhir kini menyatu menjadi gerakan-gerakan terorganisir di seluruh negeri. Sebagian besar gerakan ini bersekutu dengan $SWE_communism_party_long$ dan bahkan mungkin berafiliasi dengan [SOV.GetNameDef].\n\nMilisi Komunis telah menguasai sejumlah wilayah perkotaan dan mulai menangkap siapa pun yang berafiliasi dengan rencana kami baru-baru ini untuk menahan kaum kiri. Sementara itu, milisi juga dibentuk oleh kelompok nasionalis, seringkali dengan dukungan polisi setempat, untuk mencegah kota mereka juga jatuh ke tangan komunis. Kekerasan antara kedua kelompok dan militer kita telah meningkat hingga dapat dianggap sebagai perang saudara."
 AAT_Sweden_flashpoints.53.a: "Revolusi ini sudah lama tertunda."
 AAT_Sweden_flashpoints.53.b: "Kami akan menghancurkan agen [SOV.GetNameDef] ini."
 AAT_Sweden_flashpoints.54.t: "Ketegangan di [SWE.GetName] Mengurangi"
 AAT_Sweden_flashpoints.54.desc: "Ketegangan baru-baru ini antara pihak berwenang dan mereka yang menentang penahanan aktivis sayap kiri sudah mulai mereda. Meskipun banyak kepercayaan antara pemerintah dan masyarakat telah hilang, nampaknya kita tidak lagi menghadapi risiko situasi yang akan berubah menjadi konflik sektarian."
 AAT_Sweden_flashpoints.54.a: "Hampir sama dengan bencana."
 AAT_Sweden_flashpoints.56.t: "Proposal Gotland"
 AAT_Sweden_flashpoints.56.desc: "Menyusul sejumlah perwira tinggi militer yang bergabung dengan kelompok revolusioner komunis, kepercayaan pada cabang mana pun kecuali angkatan laut berada pada titik terendah. Dengan aktivitas baru-baru ini yang membahayakan keselamatan Raja, tindakan drastis diusulkan untuk menjamin kelangsungan hidupnya. Angkatan Laut telah mengusulkan rencana berani untuk mendapatkan kembali kendali atas situasi dengan memindahkan Raja ke pulau Gotland dan membentuk pemerintahan loyalis militer untuk memerintah negara dengan lebih efisien dan relatif aman."
 AAT_Sweden_flashpoints.56.a: "Kita tidak bisa meninggalkan daratan."
 AAT_Sweden_flashpoints.56.b: "Sebuah usulan yang bagus."
 AAT_Sweden_flashpoints.57.t: "Raja Swedia terluka dalam upaya evakuasi"
 AAT_Sweden_flashpoints.57.desc: "Pagi harinya pemerintah Swedia memutuskan untuk mengevakuasi raja dari ibu kota dan memindahkannya ke lokasi yang lebih aman di Gotland. Konvoi tersebut dicegat oleh para partisan dan kendaraan raja ditabrak, kaca depan pecah.\nDalam baku tembak berikutnya raja terluka parah, mata kirinya rusak secara permanen. Ketika pemerintah melarikan diri ke pulau itu, mereka bersumpah untuk kembali memegang kendali sebagai pemerintahan sah Swedia, namun banyak rumor yang beredar bahwa raja sendiri telah secara efektif mengambil kendali pemerintahan, mendapatkan semangat baru setelah cederanya."
 AAT_Sweden_flashpoints.57.a: "Benar-benar kekacauan yang rumit"
 AAT_Sweden_flashpoints_civil_war_tt: "§RMengurangi stabilitas [SWE.GetFlag][SWE.GetName] dapat menyebabkan perang saudara jika komunis mempertahankan dukungan yang tinggi!§!"
 AAT_Sweden_flashpoints.60.t: "[SWE.GetName] Merebut Landsverk"
 AAT_Sweden_flashpoints.60.desc: "[SWE.GetName] telah menguasai Landsverk, sebuah perusahaan yang kami operasikan bersama [SWE.GetAdjective] untuk mengembangkan kendaraan lapis baja. Meskipun kegunaan Landsverk bagi kita telah berkurang dalam beberapa tahun terakhir, ini merupakan tanda yang jelas bahwa [SWE.GetName] ingin menjauhkan diri dari [GER.GetNameDef]."
 AAT_Sweden_flashpoints.60.a: "Kemudian kami akan menyita aset [SWE.GetAdjective] di [THIS.GetNameDef]."
 AAT_Sweden_flashpoints.60.b: "Landsverk telah melampaui tujuannya."
 AAT_Sweden_flashpoints.61.t: "[FROM.GetName] Menyita Aset Swedia"
 AAT_Sweden_flashpoints.61.desc: "Dalam peningkatan drastis setelah penyitaan Landsverk, pemerintah [GER.GetNameDef] merespons dengan menyita banyak aset di negara mereka yang memiliki hubungan dengan warga negara [SWE.GetAdjective]. Meskipun kami ingin menjauhkan diri secara perlahan dari [GER.GetNameDef], keputusan ini telah menimbulkan kemarahan di kalangan masyarakat [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.61.a: "Mari kita lihat bagaimana mereka mengelolanya tanpa ada perdagangan dari kami."
 AAT_Sweden_flashpoints.61.b: "Tidak mengherankan, tapi disayangkan."
 AAT_Sweden_flashpoints.62.t: "[FROM.GetName] Mengeluarkan Embargo Perdagangan Terhadap [GER.GetNameDef]"
 AAT_Sweden_flashpoints.62.desc: "[SWE.GetNameDef] telah mendorong ketegangan baru-baru ini ke titik tertinggi baru hari ini dengan mengeluarkan embargo perdagangan terhadap [GER.GetNameDef]. Keputusan ini akan berdampak signifikan terhadap kemampuan kita memproduksi besi untuk industri senjata."
 AAT_Sweden_flashpoints.62.a: "Jika mereka tidak mau berdagang dengan kami, kami tidak akan menghormati perbatasan mereka lagi."
 AAT_Sweden_flashpoints.62.b: "Meningkatnya hal ini hanya akan membuat kita terlihat bergantung pada negara-negara kecil."
 AAT_Sweden_flashpoints.63.t: "[FROM.GetNameDefCap] Mengancam Perang"
 AAT_Sweden_flashpoints.63.desc: "Keputusan kami baru-baru ini untuk mengembargo [GER.GetNameDef] disambut dengan kemarahan di [GER.Capital.GetCapitalVictoryPointName]. Mungkin karena panik karena ketergantungan mereka pada bijih besi [SWE.GetAdjective], mereka mengeluarkan ultimatum. Dinyatakan bahwa jika kami tidak segera mencabut embargo kami, mereka akan terpaksa mengambil tindakan drastis terhadap kami, termasuk perang."
 AAT_Sweden_flashpoints.63.a: "Tolak ultimatum mereka."
 AAT_Sweden_flashpoints.63.b: "Kita tidak bisa mengambil risiko konflik seperti itu."
 AAT_Sweden_flashpoints.64.t: "[FROM.GetNameDefCap] Menolak Ultimatum"
 AAT_Sweden_flashpoints.64.desc: "[SWE.GetNameDef] dengan tegas menolak ultimatum kami. Mereka telah menyatakan bahwa serangan apa pun terhadap mereka tidak akan meningkatkan akses mereka terhadap cadangan bijih [SWE.GetAdjective] karena mereka akan menghancurkan lubang tambang jauh sebelum militer kita dapat mendudukinya."
 AAT_Sweden_flashpoints.64.a: "Mereka sendiri yang menyebabkan hal ini."
 AAT_Sweden_flashpoints.64.b: "Kita bisa mengelolanya tanpa mereka."
 AAT_Sweden_flashpoints.65.t: "[FROM.GetNameDefCap] Mencabut Embargo"
 AAT_Sweden_flashpoints.65.desc: "Pemerintah [SWE.GetAdjective] akhirnya mengambil keputusan dan memutuskan untuk mencabut embargo mereka terhadap kami. Mungkin diperlukan waktu agar perdagangan antar negara kita bisa kembali normal, namun kami telah menjelaskan kepada mereka bahwa kami masih memiliki kapasitas untuk membuat mereka bertekuk lutut jika diperlukan."
 AAT_Sweden_flashpoints.65.a: "Sekarang mereka memahami tempat mereka di dunia."
 AAT_Sweden_flashpoints.70.t: "Kapal yang Dibeli Meninggalkan Pelabuhan [ITA.GetAdjective]"
 AAT_Sweden_flashpoints.70.desc: "Kapal kami yang baru dibeli dari [ITA.GetName] kini telah meninggalkan pelabuhan. Mereka memerlukan waktu kurang lebih satu bulan untuk melakukan perjalanan ke [SWE.GetNameDef] karena harus mengisi bahan bakar dalam perjalanan."
 AAT_Sweden_flashpoints.70.a: "Perjalanan yang aman."
 AAT_Sweden_flashpoints.71.t: "Kapal Bekas [ITA.GetAdjective] Menuju [SWE.GetName]"
 AAT_Sweden_flashpoints.71.desc: "Empat mantan kapal perusak [ITA.GetAdjective] telah tiba di salah satu pelabuhan kita hari ini. Kapal-kapal tersebut dibeli oleh pemerintah [SWE.GetAdjective] dan sedang dalam proses pengalihan ke [SWE.GetName]. Saat mereka mengisi bahan bakar, kita dapat mengendalikan kapal tersebut dan berpotensi menggunakannya sendiri. Meskipun hal ini kemungkinan besar akan merusak hubungan dengan [SWE.GetName]."
 AAT_Sweden_flashpoints.71.a: "Kita bisa memanfaatkan kapal-kapal itu dengan lebih baik."
 AAT_Sweden_flashpoints.71.b: "Kami tidak ingin merusak hubungan dengan [SWE.GetName]"
 AAT_Sweden_flashpoints.72.t: "[ENG.GetName] Menangkap Kapal Baru Kami"
 AAT_Sweden_flashpoints.72.desc: "Saat singgah di pelabuhan yang dikendalikan [ENG.GetAdjective], empat kapal baru kami disita oleh angkatan laut mereka. Tampaknya mereka menggunakan hak 'marah' sebagai alasan penyitaan. Kita harus berhati-hati jika ingin mendapatkan kembali kapal-kapal itu tanpa menimbulkan perang."
 AAT_Sweden_flashpoints.72.a: "Ini adalah tindakan perang. Mereka harus melepaskannya atau menanggung akibatnya."
 AAT_Sweden_flashpoints.72.b: "Kita tidak bisa mengambil risiko perang dengan [ENG.GetName]."
 AAT_Sweden_flashpoints.73.t: "[SWE.GetName] Menuntut Pelepasan Kapal"
 AAT_Sweden_flashpoints.73.desc: "Pemerintah [SWE.GetAdjective] telah menjelaskan bahwa mereka menganggap penyitaan kapal mereka oleh kami sebagai tindakan perang dan mereka akan terpaksa memberikan tanggapan yang sama jika kami tidak segera membebaskan mereka."
 AAT_Sweden_flashpoints.73.a: "Kami tidak punya niat untuk melepaskan mereka."
 AAT_Sweden_flashpoints.73.b: "Tidak banyak manfaat yang dapat diperoleh dari menjaga kapal-kapal tersebut."
 AAT_Sweden_flashpoints.74.t: "[SWE.GetName] Menerima Penginterniran Kapal"
 AAT_Sweden_flashpoints.74.desc: "Pemerintah [SWE.GetAdjective] tampaknya sudah menyerah dalam upaya mendapatkan kembali kapal mereka. Setelah beberapa modifikasi kecil, kapal-kapal tersebut sekarang siap untuk digunakan oleh angkatan laut kita."
 AAT_Sweden_flashpoints.74.a: "Mereka tidak punya pilihan."
 AAT_Sweden_flashpoints.75.t: "[ENG.GetName] Menolak Melepaskan Kapal"
 AAT_Sweden_flashpoints.75.desc: "Pemerintah [ENG.GetAdjective] dengan keras kepala menolak melepaskan kapal-kapal kami yang diinternir. Tampaknya satu-satunya cara kita mendapatkan kembali kapal-kapal tersebut adalah dengan memperjuangkannya."
 AAT_Sweden_flashpoints.75.a: "Mereka telah membuat musuh baru."
 AAT_Sweden_flashpoints.75.b: "Ini tidak layak untuk diperjuangkan."
 AAT_Sweden_flashpoints.76.t: "[ENG.GetName] Merilis Kapal"
 AAT_Sweden_flashpoints.76.desc: "Ketegangan akhirnya mereda antara [ENG.GetName] dan [SWE.GetName] setelah pembebasan kapal kami. Jelas sekali [ENG.GetAdjective] ingin menghindari keterlibatan mereka dalam konflik dengan kami terkait beberapa kapal tua."
 AAT_Sweden_flashpoints.76.a: "Kami menantikan untuk akhirnya melihat mereka."
 AAT_Sweden_flashpoints.77.t: "Kapal Baru Tiba dengan Selamat"
 AAT_Sweden_flashpoints.77.desc: "Kapal yang kami beli dari [ITA.GetNameDef] telah tiba tanpa kendala berarti sepanjang perjalanannya. Meskipun para kru melaporkan bahwa mereka mendapat pengawasan ketat saat mengisi bahan bakar di pelabuhan sepanjang perjalanan."
 AAT_Sweden_flashpoints.77.a: "Mereka akan sangat berguna bagi kita."
  FIN_agree_peace_with_SWE: "Finlandia telah setuju untuk menyerahkan Åland kepada kami dengan imbalan perdamaian"
 AAT_Sweden_flashpoints.78.t: "[SWE.GetName] meminta kendali atas Åland"
 AAT_Sweden_flashpoints.78.desc: "[SWE.GetName] semakin khawatir mengenai letak pulau-pulau Åland yang strategis yang dapat digunakan untuk menegaskan kendali atas laut Baltik.\nMengingat situasi saat ini dan mayoritas penduduk pulau-pulau tersebut adalah [SWE.GetAdjective], pemerintah mereka bertanya apakah kami bersedia menyerahkan pulau-pulau tersebut sampai dunia stabil. Mengutip keinginan mereka untuk mencegah pulau-pulau tersebut jatuh ke tangan musuh dan kebutuhan untuk melindungi warga [SWE.GetAdjective]."
 AAT_Sweden_flashpoints.78.a: "Åland adalah milik kita, dan akan tetap demikian"
 AAT_Sweden_flashpoints.78.b: "Itu adalah pilihan yang tepat"
 AAT_Sweden_flashpoints.78.c: "Jika [SWE.GetName] memberi kompensasi kepada kami"
 AAT_Sweden_flashpoints.79.t: "[FIN.GetName] menolak"
 AAT_Sweden_flashpoints.79.desc: "[FIN.GetName] telah memberi kita jawaban 'tidak' secara langsung sehubungan dengan pertanyaan tentang pengalihan kendali atas kepulauan Åland."
 AAT_Sweden_flashpoints.79.a: "Sayang sekali"
 AAT_Sweden_flashpoints.80.t: "[FIN.GetName] menerima"
 AAT_Sweden_flashpoints.80.desc: "Mengingat situasi mereka yang genting, mereka lebih suka melihat kami mengendalikan pulau-pulau tersebut daripada penjajah asing. Penduduk setempat, yang mayoritas merupakan penutur [SWE.GetAdjective], telah menerima hal ini dengan baik, dan kehidupan mereka berlanjut seperti biasa."
 AAT_Sweden_flashpoints.80.a: "Bagus"
 AAT_Sweden_flashpoints.81.t: "[FIN.GetName] menerima, dengan harga tertentu"
 AAT_Sweden_flashpoints.81.desc: "[FIN.GetName] mengakui bahwa mereka bersedia melepaskan kepulauan Åland, namun menekankan bahwa mereka sedang kekurangan uang saat ini.\nMereka bersedia membiarkan kami menguasai pulau tersebut untuk sejumlah cadangan negara kami sebagai kompensasi atas hilangnya pendapatan mereka."
 AAT_Sweden_flashpoints.81.a: "Itu sangat berharga"
 AAT_Sweden_flashpoints.81.b: "Tidak"
 AAT_Sweden_flashpoints.82.t: "[SWE.GetName] setuju"
 AAT_Sweden_flashpoints.82.desc: "[SWE.GetName] telah setuju untuk memberikan kompensasi finansial kepada kami untuk Åland. Saat transaksi sedang berlangsung, sebuah upacara kecil telah diadakan dan meskipun beberapa warga Åland merasa khawatir tentang masa depan mereka, pihak berwenang [SWE.GetAdjective] telah menyatakan bahwa transisi akan dilakukan semulus mungkin, dan bahwa mereka menghormati cara hidup mereka."
 AAT_Sweden_flashpoints.82.a: "Biaya yang diperlukan"
 AAT_Sweden_flashpoints.83.t: "[SWE.GetName] menurun"
 AAT_Sweden_flashpoints.83.desc: "[SWE.GetName] telah memutuskan bahwa mereka tidak bersedia menghabiskan banyak cadangan mereka untuk pengalihan Åland."
 AAT_Sweden_flashpoints.83.a: "Kemudian mereka tidak cukup menginginkannya"
 AAT_Sweden_BoP.10.t: "Kampanye Pemilu - Kebijakan Ekonomi"
 AAT_Sweden_BoP.10.desc: "Musim pemilu kembali tiba dan partai-partai yang bersaing untuk menguasai Riksdag mulai berkampanye. Isu utama yang tampaknya menyita perhatian para pemilih adalah perekonomian. Meskipun ada yang berpendapat bahwa kebijakan yang ada harus dilanjutkan, ada juga yang menginginkan perubahan radikal, namun hanya ada satu pilihan yang mendapat dukungan dalam isu ini."
 AAT_Sweden_BoP.10.a: "Perekonomian harus dijalankan oleh dan untuk kelas pekerja."
 AAT_Sweden_BoP.10.b: "Kita perlu menemukan jalan tengah antara kapitalisme dan komunisme yang ekstrem."
 AAT_Sweden_BoP.10.c: "Mengapa kita menghambat orang-orang paling sukses di masyarakat dengan pajak yang berlebihan?"
 AAT_Sweden_BoP.10.d: "Perluasan militer akan menurunkan pengangguran dan meningkatkan keamanan nasional."
 AAT_Sweden_BoP.11.t: "Kampanye Pemilu - Kebijakan Sosial"
 AAT_Sweden_BoP.11.desc: "Kampanye pemilu nampaknya telah beralih ke kebijakan sosial, dimana partai-partai kini menyatakan rencana mereka untuk mengatasi permasalahan yang ada di masyarakat. Meskipun beberapa partai menganjurkan pembentukan kembali pemerintahan secara radikal untuk mengatasi masalah ini, partai lain mengambil pendekatan yang lebih hati-hati dan melakukan perubahan sedikit demi sedikit. Namun, hanya satu pesan yang tampaknya diterima oleh para pemilih."
 AAT_Sweden_BoP.11.a: "Kesetaraan sosial tidak akan ada sampai kaum borjuis disingkirkan dari kekuasaan."
 AAT_Sweden_BoP.11.b: "Akses yang lebih baik terhadap pendidikan dan perawatan kesehatan akan membantu mengangkat masyarakat dari kemiskinan."
 AAT_Sweden_BoP.11.c: "Kita perlu berbuat lebih banyak untuk mendukung mereka yang berada di luar kota-kota besar."
 AAT_Sweden_BoP.11.d: "Kami sudah lupa apa artinya menjadi [ROOT.GetAdjective] dan membutuhkan lebih banyak pendidikan patriotik."
 AAT_Sweden_BoP.12.t: "Kampanye Pemilu - Kebijakan Luar Negeri"
 AAT_Sweden_BoP.12.desc: "Dengan semakin dekatnya hari pemilu, perdebatan beralih ke masalah mendesak yaitu keamanan nasional dan kebijakan luar negeri. Banyak pihak yang menganjurkan netralitas dan isolasionisme untuk menjaga keamanan negara, sementara pihak lain mendorong arah kebijakan luar negeri yang lebih tegas. Ketika dunia berada dalam kondisi yang berbahaya, hanya ada satu pesan yang tampaknya bisa memberikan harapan kepada para pemilih."
 AAT_Sweden_BoP.12.a: "Kaum buruh di seluruh dunia harus bersatu melawan perang agresi imperial."
 AAT_Sweden_BoP.12.b: "Kita harus menjaga netralitas sambil mengembangkan pertahanan militer yang kuat."
 AAT_Sweden_BoP.12.c: "Kita lemah dan rentan, kita harus lebih siap menghadapi perang."
 AAT_Sweden_BoP.12.d: "Satu-satunya cara untuk menjamin perdamaian di kawasan ini adalah dengan menegaskan kendali kita atas wilayah tersebut."
 AAT_Sweden_BoP.14.t: "Hasil Pemilu"
 AAT_Sweden_BoP.14.d_socialist: "Hari pemilihan telah tiba dan para pemilih telah menentukan pilihannya. $SWE_communism_party_long$ akan membentuk pemerintahan mayoritas dalam beberapa hari mendatang. Tampaknya kebijakan radikal mereka berupa nasionalisasi, solidaritas kelas, dan penolakan terhadap keterikatan asing telah berhasil memenangkan hati publik. Masih harus dilihat berapa banyak dari janji-janji mereka yang akan dipenuhi."
 AAT_Sweden_BoP.14.d_democratic: "Hari pemilihan telah tiba dan para pemilih telah menentukan pilihannya. $SWE_democratic_party_long$ akan membentuk pemerintahan mayoritas dalam beberapa hari mendatang. Meskipun beberapa orang percaya bahwa janji-janji Folkhemmet sudah tidak berlaku lagi bagi para pemilih, hasil ini membuktikan bahwa mereka salah. Yang tersisa hanyalah menyelesaikan apa yang mereka mulai."
 AAT_Sweden_BoP.14.d_non_aligned: "Hari pemilu telah tiba dan para pemilih telah menentukan pilihannya. $SWE_neutrality_party_long$ akan membentuk pemerintahan mayoritas dalam beberapa hari mendatang. Rencana mereka untuk memperkuat pertahanan nasional dan kebijakan untuk mempengaruhi pemilih di pedesaan jelas berhasil. Kini mereka harus memproduksi versi romantis dari [ROOT.GetName] yang mereka promosikan saat pemilu."
 AAT_Sweden_BoP.14.d_fascist: "Hari pemilu telah tiba dan para pemilih telah menentukan pilihan mereka. $SWE_fascism_party_long$ akan membentuk pemerintahan mayoritas dalam beberapa hari mendatang dan tampaknya tidak ada seorang pun yang terkejut dengan hasil pemilu seperti mereka. Berapa lama aparat demokrasi [ROOT.GetName] akan bertahan di bawah rezim baru masih belum diketahui secara pasti."
 AAT_Sweden_BoP.14.d_left: "Hari pemilihan telah tiba dan meskipun partai-partai telah berupaya sebaik-baiknya, tidak satupun dari mereka yang berhasil memperoleh kursi mayoritas di Riksdag. Namun, Partai Sosialis dan Sosial Demokrat berhasil mencapai kesepakatan untuk membentuk pemerintahan koalisi. Apakah koalisi ini akan bertahan selama masa jabatan penuh masih belum pasti, tapi mungkin ketakutan terhadap kelompok sayap kanan akan membuat koalisi tetap bersatu."
 AAT_Sweden_BoP.14.d_right: "Hari pemilihan telah tiba dan meskipun partai-partai telah berupaya sebaik-baiknya, tidak satupun dari mereka yang berhasil memperoleh kursi mayoritas di Riksdag. Namun, Partai Konservatif dan Fasis berhasil mencapai kesepakatan untuk membentuk pemerintahan koalisi. Apakah koalisi ini akan bertahan selama masa jabatan penuh masih belum pasti, tapi mungkin ketakutan kelompok sayap kiri akan membuat koalisi tetap bersatu."
 AAT_Sweden_BoP.14.a: "Para pemilih telah berbicara."
 SWE_folkhemmet_event_result_tt: "Setelah mengadopsi kebijakan ini semangat Folkhemmet akan memiliki nilai-nilai berikut:"
 AAT_Sweden_strike.1.t: "Kerusuhan di [?SWE.GetNameDef]"
 AAT_Sweden_strike.1.desc: "Potensi blokade pangan seperti yang terjadi selama Perang Besar telah menimbulkan protes di kalangan angkatan kerja [SWE.GetAdjective]. Didorong oleh tokoh-tokoh lokal, kerusuhan telah menyebar dari pabrik-pabrik hingga menjadi isu nasional. Kita perlu menstabilkan situasi dan memastikan pemerintah dianggap sebagai pemimpin yang kuat dalam masa-masa yang tidak menentu ini."
 AAT_Sweden_strike.1.a: "Tidak ada yang bisa kami lakukan saat ini kecuali menunggu"
 AAT_Sweden_strike.1.b: "Kita perlu berinvestasi dalam meningkatkan moral masyarakat dan menenangkan situasi ini"
 AAT_Sweden_strike.2.t: "Kerusuhan di seluruh negeri"
 AAT_Sweden_strike.2.desc: "Sayangnya, upaya kami untuk membendung protes gagal. Hampir setiap pekerja pabrik, penjahit, dan tukang kayu turun ke jalan untuk memprotes kebijakan pemerintah. Yang lebih buruk lagi, banyak protes yang berubah menjadi kekerasan dan melukai warga sipil dan aparat penegak hukum."
 AAT_Sweden_strike.2.a: "Mereka akan datang"
 AAT_Sweden_strike.2.b: "Kita perlu segera membendung hal ini"
 AAT_Sweden_nationalists.1.t: "[SWE.GetAdjective] Sosialis Nasional Meminta Intervensi"
 AAT_Sweden_nationalists.1.desc: "Perwakilan dari partai Sosialis Nasional terkemuka di [SWE.GetName] telah mendekati kami dengan sebuah peluang. Mereka sedang dalam proses menggulingkan pemerintahan mereka saat ini dan telah meminta dukungan kami dalam upaya mereka. Sebagai imbalan atas dukungan militer, mereka sepakat untuk menempatkan negara ini secara tegas dalam lingkup pengaruh kita."
 AAT_Sweden_nationalists.1.a: "Kami tidak dapat menyisihkan pasukan, tetapi kami dapat mengirimkan mereka dukungan."
 AAT_Sweden_nationalists.1.b: "Kami akan mendukung mereka."
 AAT_Sweden_nationalists.2.t: "[FROM.GetNameDefCap] Menolak Usulan"
 AAT_Sweden_nationalists.2.desc: "Pemerintah [GER.GetAdjective] telah menolak usulan kami dengan alasan bahwa mereka tidak ingin menciptakan garis depan baru bagi militer mereka yang sudah kewalahan. Namun, mereka telah mengirimkan sejumlah senapan dan sukarelawan sebagai tanda niat baik."
 AAT_Sweden_nationalists.2.a: "Itu lebih baik daripada tidak sama sekali."
 AAT_Sweden_nationalists.3.t: "[FROM.GetNameDefCap] Menyetujui Usulan"
 AAT_Sweden_nationalists.3.desc: "Kepemimpinan [GER.GetAdjective] telah setuju untuk mendukung kami secara militer dalam mengamankan kendali atas negara. Sebagai imbalan atas dukungan mereka, kami setuju untuk menjadi bagian dari pengaruh mereka yang lebih luas di benua ini. Mudah-mudahan suatu hari nanti mereka akan melihat kita setara."
 AAT_Sweden_nationalists.3.a: "Kita akan bangkit dari abu, lebih kuat dari sebelumnya!"
 AAT_Sweden_nationalists.4.t: "Satukan Gerakan Sosialis Nasional"
 AAT_Sweden_nationalists.4.desc: "Gerakan Sosialis Nasional terlalu terfragmentasi untuk merebut kekuasaan di [SWE.GetName]. Jika hal ini ingin berubah, gerakan ini perlu menghentikan pertikaian kecil-kecilan dan bersatu di belakang pemimpin sejati kita."
 AAT_Sweden_nationalists.4.a: "$SWE_sven_olov_lindholm$ dapat mempersatukan berbagai faksi nasionalis."
 AAT_Sweden_nationalists.4.b: "$SWE_birger_furugard$ ditakdirkan menjadi pemimpin [SWE.GetName]."
 AAT_Sweden_nationalists.5.t: "Stormtrupper March yang membawa bencana di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.5.desc: "Kekhawatiran akan adanya pengunjuk rasa tandingan yang mengganggu pawai Stormtrupper di [FROM.FROM.GetName] muncul hari ini ketika kedua kelompok tersebut bentrok hebat di jalan-jalan. Banyak yang terluka dan terbunuh di kedua sisi, namun pada akhirnya opini publik tampaknya berpihak pada anti-fasis karena Stormtrupper terpaksa berlindung di toko lokal sampai polisi tiba."
 AAT_Sweden_nationalists.5.a: "Mereka kehilangan momentum."
 AAT_Sweden_nationalists.6.t: "Stormtrupper March yang lancar di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.6.desc: "Pawai Stormtrupper hari ini di [FROM.FROM.GetName] ternyata sangat membosankan. Hanya mampu mengumpulkan segelintir anggota, penyelenggara memimpin kru yang beraneka ragam dalam prosesi melalui jalan-jalan raya sementara orang-orang melanjutkan urusan mereka. Meskipun jumlah pemilihnya sedikit, Stormtruppers menjadi bagian penting dalam politik [SWE.GetAdjective]."
 AAT_Sweden_nationalists.6.a: "Mereka perlahan-lahan membangun momentum."
 AAT_Sweden_nationalists.7.t: "Stormtrupper March yang sukses di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.7.desc: "Dengan dukungan polisi setempat untuk menahan para pengunjuk rasa, Stormtruppers berhasil melakukan pawai besar-besaran di [FROM.GetName]. Melewati jalan raya setempat, para pengunjuk rasa mendapat sorak-sorai dari masyarakat yang berjajar di jalan-jalan."
 AAT_Sweden_nationalists.7.a: "Mereka akan membangun kembali [SWE.GetName]"
 AAT_Sweden_nationalists.8.t: "Anggota Aristokrasi Menawarkan Dukungan"
 AAT_Sweden_nationalists.8.desc: "Anggota aristokrasi sudah lama merasa tidak puas karena pengaruh mereka terhadap urusan nasional dibatasi demi kepentingan pejabat terpilih. Oleh karena itu, banyak yang setuju untuk menggunakan sisa sumber daya mereka untuk mendukung gerakan nasionalis kita. Sebagai imbalannya, mereka akan mengharapkan beberapa konsesi politik setelah gerakan tersebut menguasai Riksdag."
 AAT_Sweden_nationalists.8.a: "Sebuah harga kecil untuk mengembalikan bangsa ke kejayaan."
 AAT_Sweden_nationalists.9.t: "Industrialis Menawarkan Dukungan"
 AAT_Sweden_nationalists.9.desc: "Industri [SWE.GetAdjective] menjadi semakin kompetitif dengan pesaing asing karena campur tangan kaum Sosial-Demokrat dan Landsorganisationen. Oleh karena itu, sejumlah industrialis terkemuka setuju untuk mendukung gerakan nasionalis kita jika kita setuju untuk membubarkan serikat buruh untuk selamanya."
 AAT_Sweden_nationalists.9.a: "Serikat pekerja akan dilenyapkan."
 AAT_Sweden_nationalists.10.t: "Perwira Militer Menawarkan Dukungan"
 AAT_Sweden_nationalists.10.desc: "Banyak perwira militer yang kecewa dengan kesalahan pengelolaan pertahanan negara di bawah pemerintahan saat ini. Oleh karena itu, banyak perwira senior angkatan darat dan laut sepakat bahwa mereka akan membantu perjuangan nasionalis dengan imbalan memperkuat anggaran pertahanan ketika kita berkuasa."
 AAT_Sweden_nationalists.10.a: "[SWE.GetName] akan menjadi kekuatan besar sekali lagi."
 AAT_Sweden_nationalists.11.t: "Dukungan Pedesaan Membengkak"
 AAT_Sweden_nationalists.11.desc: "Banyak orang di luar pusat kota [SWE.GetName] merasa tertinggal oleh kebijakan-kebijakan Sosial Demokrat. Selain itu, mereka merasa terancam oleh industrialisasi dan khawatir cara hidup tradisional mereka terkikis. Dengan menabur benih ketidakpuasan di antara mereka, kita telah berhasil menciptakan gelombang dukungan terhadap gerakan nasionalis yang berjanji untuk berinvestasi di pedesaan dan mengembalikan nilai-nilai tradisional."
 AAT_Sweden_nationalists.11.a: "Masyarakat pedesaan adalah tulang punggung bangsa."
 AAT_Sweden_nationalists.16.t: "Kunjungan Kerajaan yang Menghancurkan di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.16.desc: "Bermacam-macam kelompok anti-monarki berhasil mengganggu kunjungan Raja ke [FROM.FROM.GetName] hari ini. Meskipun polisi telah berupaya sebaik-baiknya untuk menahan para pengunjuk rasa, mereka berhasil memblokir rute yang direncanakan untuk mobil Raja, memaksa mereka untuk membatalkan perjalanan karena takut dibawa ke situasi yang lebih berbahaya."
 AAT_Sweden_nationalists.16.a: "Rakyat jelata tidak menghormati atasan mereka."
 AAT_Sweden_nationalists.17.t: "Kunjungan Kerajaan yang lancar di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.17.desc: "Kunjungan kerajaan ke [FROM.FROM.GetName] adalah acara yang agak membosankan. Meskipun Raja berharap masyarakat akan berkumpul untuk menyambutnya, hanya segelintir pendukung yang berbaris di jalan. Raja terdengar sangat tidak puas dan malu dengan situasi ini, dan bersumpah untuk tidak mengambil bagian dalam kegiatan sembrono seperti itu di masa depan."
 AAT_Sweden_nationalists.17.a: "Dia perlu terus melakukan ini untuk membangun dukungan"
 AAT_Sweden_nationalists.18.t: "Kunjungan Kerajaan yang Sukses di [FROM.FROM.GetName]"
 AAT_Sweden_nationalists.18.desc: "Kunjungan kerajaan oleh Raja ke [FROM.FROM.GetName] telah menjadi dorongan besar bagi popularitas raja. Para pendukung yang bergembira berbaris di jalan-jalan, mengibarkan bendera [SWE.GetAdjective] dan melemparkan bunga di depan Raja. Meskipun ada beberapa pencela, mereka dijauhkan dari prosesi oleh kepolisian setempat."
 AAT_Sweden_nationalists.18.a: "Dengan dukungan seperti itu, kita dapat memulihkan wibawa Raja."
 AAT_Sweden_nationalists.19.t: "Fika dengan Raja"
 AAT_Sweden_nationalists.19.desc: "Selama pertemuan rahasia di istana Raja di [SWE.Capital.GetCapitalVictoryPointName], para pemimpin berbagai gerakan nasionalis bertemu dengan raja untuk membahas keinginan mereka untuk melihat [SWE.GetName] dikembalikan ke kejayaannya. Setelah diskusi panjang tentang bagaimana mengkoordinasikan berbagai gerakan menjadi satu gerakan yang kohesif, diputuskan bahwa ketika waktunya tepat, Raja Gustaf harus menegaskan kembali dirinya sebagai penguasa dan bukan sebagai boneka. Raja ragu-ragu untuk berkomitmen terhadap rencana tersebut, namun telah setuju untuk mengambil peran yang lebih aktif dalam urusan politik, dimulai dengan tur keliling dunia untuk mengukur dukungan di antara masyarakat."
 AAT_Sweden_nationalists.19.a: "Kita harus menunjukkan kepada Raja bahwa ini belum terlambat bagi bangsa kita yang besar."
 AAT_Sweden_nationalists.20.t: "[FROM.GetName] ingin memperluas kendalinya"
 AAT_Sweden_nationalists.20.desc: "Subjek setia kami, [FROM.GetName] telah meminta agar kami memperluas tanggung jawab mereka dengan memberi mereka wilayah di [SOV.GetName] utara. Hal ini akan memungkinkan kita untuk meringankan beban pendudukan terhadap rakyat kita, dan memfokuskan upaya kita pada musuh besar."
 AAT_Sweden_nationalists.20.a: "Rencana yang bagus"
 AAT_Sweden_nationalists.20.b: "Semua wilayah adalah milik Reich!"
 AAT_Sweden_nationalists.21.t: "[FROM.GetName] menyerahkan kendali kepada kami"
 AAT_Sweden_nationalists.21.desc: "Berlin telah memutuskan untuk memberi kami lebih banyak tanggung jawab dengan menyerahkan bagian lebih besar wilayah utara, yang secara efektif membentuk Reichskommissariat Nordland yang tepat."
 AAT_Sweden_nationalists.21.a: "Pengaruh kami tumbuh"
 AAT_Sweden_nationalists.22.t: "[FROM.GetName] menolak usulan kami"
 AAT_Sweden_nationalists.22.desc: "Berlin telah memutuskan untuk tidak mengabulkan permintaan kami, dengan alasan bahwa kami tidak siap dengan tanggung jawab besar yang timbul dari pertukaran wilayah yang begitu besar. Mungkin mereka takut memberikan terlalu banyak kekuasaan kepada Reichskommissariat?"
 AAT_Sweden_nationalists.22.a: "Mungkin ini sebuah kesalahan.."
 AAT_Sweden_nationalists.23.t: "Sebuah pisau dalam kegelapan"
 AAT_Sweden_nationalists.23.desc: "Negara boneka [GER.GetAdjective] dari [SWE.GetName] telah mengirim kami utusan dalam misi rahasia tanpa sepengetahuan tuannya. Negara [SWE.GetAdjective] melihat apa yang terjadi di dinding, dan sekarang sedang mencari jalan keluar dari konflik ini dan datang kepada kami dengan sebuah proposal. Saat ini mereka sedang mempersiapkan pembelotan besar-besaran dalam upaya untuk merebut daratan [GER.GetAdjective] sementara pasukannya sibuk di tempat lain, namun mereka menekankan bahwa mereka tidak dapat melakukan perang dua front melawan kami dan tuan mereka. Mereka mengusulkan agar kami tetap melakukan sandiwara tersebut untuk saat ini, namun ketika mereka berbalik arah, kami menandatangani perjanjian perdamaian putih dan bertarung berdampingan.\nTerkadang pisau dalam kegelapan lebih efektif daripada pendobrak di siang hari bolong."
 AAT_Sweden_nationalists.23.a: "Itu ide yang bagus"
 AAT_Sweden_nationalists.23.a_tt: "§Y[SWE.GetName]§! akan memberontak melawan tuan mereka pada waktunya dan bergabung dengan kami dalam pertarungan"
 AAT_Sweden_nationalists.23.b: "Semua fasis harus bertanggung jawab"
 AAT_Sweden_nationalists.24.t: "[FROM.GetName] menerima proposal kami"
 AAT_Sweden_nationalists.24.desc: "[FROM.GetName] telah menerima proposal kami. Ketika waktunya tepat, mereka akan menyepakati perdamaian putih sehingga kita bisa mengalahkan [GER.GetName] bersama-sama."
 AAT_Sweden_nationalists.24.a: "Sebuah tindakan yang sangat mendesak, namun perlu dilakukan."
 AAT_Sweden_nationalists.25.t: "[FROM.GetName] menolak usulan kami"
 AAT_Sweden_nationalists.25.desc: "[FROM.GetName] telah menolak proposal kami. Itu adalah upaya yang sulit, tetapi itu sepadan karena situasi putus asa yang kita hadapi"
 AAT_Sweden_nationalists.25.a: "Sepertinya kita sendirian"
 AAT_Sweden_nationalists.26.t: "[FROM.GetName] pemberontak"
 AAT_Sweden_nationalists.26.desc: "Pagi-pagi sekali kami kehilangan kontak dengan utusan kami di [FROM.GetName] dan beberapa brigade yang bertugas jaga sepertinya semuanya sudah menyerah. Menelepon pemerintah [SWE.GetAdjective] untuk meminta penjelasan tidak ditanggapi dengan sikap diam, kini terbukti bahwa boneka kita yang nakal mempunyai rencana besar untuk dirinya sendiri dan tidak menyertakan kita."
 AAT_Sweden_nationalists.26.a: "Sebenarnya"
 AAT_Sweden_nationalists.27.t: "[FROM.GetName] mengklaim tanah [FIN.GetAdjective]"
 AAT_Sweden_nationalists.27.desc: "Subjek setia kami, [FROM.GetName] telah meminta agar kami memperluas tanggung jawab mereka dengan memberi mereka wilayah di [FIN.GetName]. Hal ini akan memungkinkan kita untuk meringankan beban pendudukan terhadap rakyat kita, dan memfokuskan upaya kita pada musuh besar."
 AAT_Sweden_nationalists.27.a: "Ide bagus"
 AAT_Sweden_nationalists.28.t: "$AAT_Sweden_nationalists.21.t$"
 AAT_Sweden_nationalists.28.desc: "$AAT_Sweden_nationalists.21.desc$"
 AAT_Sweden_nationalists.28.a: "$AAT_Sweden_nationalists.21.a$"
 AAT_Sweden_nationalists.29.t: "$AAT_Sweden_nationalists.22.t$"
 AAT_Sweden_nationalists.29.desc: "$AAT_Sweden_nationalists.22.desc$"
 AAT_Sweden_nationalists.29.a: "$AAT_Sweden_nationalists.22.a$"
 AAT_Sweden_nationalists.30.t: "[FROM.GetName] mengklaim tanah [FIN.GetAdjective]"
 AAT_Sweden_nationalists.30.desc: "Negara boneka [GER.GetAdjective], [SWE.GetName] telah meminta Adolf Hitler untuk mengakui klaim mereka atas tanah kami. Klaim palsu yang hanya menguntungkan kedua belah pihak karena ekspansionisme yang merajalela."
 AAT_Sweden_nationalists.30.a: "Sebuah tipu muslihat yang keji"
 AAT_Sweden_nordic_defense_council.1.t: "Swedia mengundang kami ke dewan pertahanan Nordik"
 AAT_Sweden_nordic_defense_council.1.desc: "Ketika dunia bersiap menghadapi bentrokan yang tak terhindarkan antara negara-negara besar Eropa, negara-negara Nordik berisiko terinjak-injak dalam serangan gencar yang terjadi. Pemerintah [FROM.GetAdjective] menyarankan agar kita sebagai negara Nordik membentuk tentara yang bersatu agar kita bersama-sama dapat membentuk pertahanan yang lebih kohesif."
 AAT_Sweden_nordic_defense_council.1.a: "Kami punya rencana lain"
 AAT_Sweden_nordic_defense_council.1.b: "Kami akan bergabung sebagai anggota faksi"
 AAT_Sweden_nordic_defense_council.1.c: "Kami akan bergabung sebagai anggota dewan terpadu"
 AAT_Sweden_nordic_defense_council.2.t: "[FROM.GetName] bergabung dengan serikat pertahanan Nordik"
 AAT_Sweden_nordic_defense_council.2.desc: "[FROM.GetName] telah memutuskan untuk bergabung dengan kami di serikat kami. Setidaknya sekarang jika hal yang tidak terpikirkan terjadi, kita tidak sendirian."
 AAT_Sweden_nordic_defense_council.2.a: "Bagus"
 AAT_Sweden_nordic_defense_council.3.t: "[FROM.GetName] menolak proposal serikat pertahanan Nordik"
 AAT_Sweden_nordic_defense_council.3.desc: "[FROM.GetName] telah menolak untuk bergabung dengan serikat kami, meskipun ketegangan sedang berlangsung di dunia. Tampaknya mereka lebih memilih kebijakan lain, dan mudah-mudahan tidak akan berdampak negatif terhadap posisi kita di panggung dunia"
 AAT_Sweden_nordic_defense_council.3.a: "Sayang sekali"
 AAT_Sweden_nationalists.12.t: "Kaum Aristokrat Menyambut Reformasi"
 AAT_Sweden_nationalists.12.desc: "Siapa pun selain pakar hukum tidak menyadari bahwa reformasi yang kita lakukan baru-baru ini pada dasarnya adalah pemulihan hak-hak istimewa bangsawan. Tentu saja, dengan media yang berada di bawah kendali kita, para ahli seperti itu tidak mungkin menyebarkan ketidakpuasan di kalangan masyarakat. Sementara itu, anggota aristokrasi sangat gembira atas reformasi yang telah dilakukan dan berharap dapat memperbaiki kesalahan yang terjadi dalam beberapa dekade terakhir."
 AAT_Sweden_nationalists.12.a: "Semoga saja mereka tidak menghalangi kita."
 AAT_Sweden_nationalists.13.t: "Para Industrialis Didorong oleh Reformasi Ekonomi"
 AAT_Sweden_nationalists.13.desc: "Para industrialis terkemuka berharap dapat mencapai rekor keuntungan dan dividen yang luar biasa di tahun-tahun mendatang setelah kriminalisasi serikat pekerja. Dengan dilarangnya serikat pekerja, para industrialis akan mampu memotong birokrasi yang dilakukan oleh Partai Sosial Demokrat dalam beberapa tahun terakhir dan pada gilirannya, meningkatkan pertumbuhan ekonomi."
 AAT_Sweden_nationalists.13.a: "Reformasi seperti ini sudah lama tertunda."
 AAT_Sweden_nationalists.14.t: "Ekspansi Rencana Militer"
 AAT_Sweden_nationalists.14.desc: "Menteri Perang telah mengumumkan bahwa anggaran militer akan ditingkatkan berdasarkan rekomendasi dari para perwira terkemuka yang telah lama berargumentasi bahwa negara ini tidak mempunyai perlengkapan yang memadai untuk mempertahankan diri. Dengan peningkatan anggaran, loyalitas militer terhadap rezim baru kita tampak utuh."
 AAT_Sweden_nationalists.14.a: "Mempertahankan militer di pihak kita akan selalu menjadi prioritas."
 AAT_Sweden_nationalists.15.t: "Pekerja Pedesaan Tetap Mendukung"
 AAT_Sweden_nationalists.15.desc: "Setelah adanya investasi besar-besaran pada infrastruktur pedesaan, para pekerja di pedesaan menjadi kelompok yang paling vokal mendukung pemerintah. Dengan dukungan dan pengaruh mereka terhadap rantai pangan nasional, kita sekarang memiliki blok pendukung yang kuat yang dapat mengendalikan pekerja perkotaan di masa depan."
 AAT_Sweden_nationalists.15.a: "Dukungan seperti ini akan memperkuat cengkeraman kita pada kekuasaan."
 SWE_royal_visit_in_progress: "Kunjungan kerajaan sedang berlangsung."
 SWE_appeal_for_support_in_progress: "Sudah mencari faksi untuk mendapatkan dukungan."
 AAT_Sweden_communism.1.t: "Gumaman kontra-revolusi fasis"
 AAT_Sweden_communism.1.desc: "Akhirnya kita memperoleh kekuasaan di pemerintahan, dan meskipun [ROOT.GetDemocraticParty] telah menerima keinginan para pemilih dengan anggun bahwa demokrasi layak untuk dilakukan, partai-partai sayap kanan jauh kurang menerima proses ini, sehingga mempertanyakan legitimasi pemungutan suara. Saat ini mereka hanyalah orang-orang yang berbeda pendapat, namun kita harus berhati-hati agar hal ini tidak menyebar lebih jauh."
 AAT_Sweden_communism.1.a: "Mengenai"
 AAT_Sweden_communism.2.t: "perbedaan pendapat tentara"
 AAT_Sweden_communism.2.desc: "Investigasi yang dilakukan pemerintah terhadap militer telah menghasilkan dokumen yang menghubungkan beberapa komandan berpangkat tinggi dengan gerakan fasis bawah tanah untuk melemahkan pemerintah terpilih. Laporan tersebut mencatat bahwa retorika militer mengenai arah politik negara ini semakin berani, dan merekomendasikan agar tindakan yang menentang retorika tersebut diatasi."
 AAT_Sweden_communism.2.a: "Bahkan Lebih Peduli"
 AAT_Sweden_communism.3.t: "Persediaan senjata hilang"
 AAT_Sweden_communism.3.desc: "Investigasi pemerintah mengungkapkan bahwa senjata militer bermutu tinggi telah hilang dari persediaan militer. Laporan tersebut mencatat bahwa mereka belum dapat menunjukkan di mana inventaris tersebut berada, namun sebanyak 60% telah hilang sebelum ada yang mengetahuinya."
 AAT_Sweden_communism.3.a: "Ini hanya bisa menjadi pekerjaan orang dalam dari seseorang yang berpangkat tinggi."
 AAT_Sweden_communism.4.t: "[ROOT.GetFascistParty] dan militer menguasai Stockholm"
 AAT_Sweden_communism.4.desc: "Pada [?global.date.GetDateStringShortMonth] beberapa ledakan keras terdengar dari Riksdag dan orang-orang bersenjata tak dikenal dengan kemeja coklat muncul di seluruh ibu kota. Pemerintah dievakuasi dan meminta polisi setempat dan garda nasional untuk memulihkan ketertiban, namun permohonan tersebut tidak ditanggapi. Banyak rumor yang beredar bahwa kelompok fasis berkemeja coklat bersekutu dalam koalisi dengan jenderal-jenderal berpangkat tinggi dalam upaya membentuk pemerintahan sementara. Berkat prajurit individu yang masih setia kepada pemerintah yang sebenarnya, seluruh staf dapat melarikan diri dari ibu kota yang terbakar"
 AAT_Sweden_communism.4.a: "Kami akan kembali."
 AAT_Sweden_communism.5.t: "Pemimpin kelompoknya terungkap"
 AAT_Sweden_communism.5.desc: "Gudang rahasia persenjataan berat telah ditemukan di gudang-gudang di pusat kota di [ROOT.GetName]. Catatan siapa yang membayar gudang-gudang ini semuanya ada hubungannya dengan [ROOT.GetFascistParty] dan para pemimpin paramiliter yang terikat dengan partai Kaos Coklat semuanya telah ditangkap.\nSurat-surat yang ditemukan di salah satu gudang ini juga mengungkap para jenderal dalam komplotan ini, yang menggelapkan senjata-senjata ini sejak awal dan memalsukan nomor inventaris. Kebijaksanaan sangat penting dalam hal ini karena para pemimpin kelompok ini mungkin mempunyai pengaruh terhadap sebagian besar angkatan bersenjata."
 AAT_Sweden_communism.5.a: "Tuntut mereka."
 AAT_Sweden_communism.5.b: "\"Mempromosikan\" pemimpin kelompok keluar dari kekuasaan."
 AAT_Sweden_communism.6.t: "Nasib Rumah Bernadotte."
 AAT_Sweden_communism.6.desc: "Di zaman yang serba terang ini, rasanya aneh untuk tetap berpegang teguh pada sistem monarki, terutama monarki tanpa kekuasaan. Meski begitu, raja tua ini tidak bisa berhenti terjun ke dunia politik, meskipun ada beberapa peringatan bahwa perilaku seperti ini tidak pantas dan inkonstitusional. Yang lebih buruk lagi adalah ia semakin menyelaraskan dirinya dengan spektrum politik sayap kanan, mencari keagungan lama para Tsar, Kaiser, dan Raja. Ini bukanlah masa depan masyarakat dan kita sudah tidak lagi membutuhkan seorang raja; sekarang saatnya untuk merampas aset mereka demi kebaikan rakyat dan membiarkan mereka hidup sebagai orang normal; yang mana mereka."
 AAT_Sweden_communism.6.a: "Sita aset mereka, mereka bisa bekerja seperti orang lain"
 AAT_Sweden_communism.7.t: "Kilbom bergerak untuk mengusir Flyg"
 AAT_Sweden_communism.7.desc: "Karl Kilbom bergerak untuk mengambil alih kendali partai. Hal ini telah memecah belah partai menjadi dua, dengan satu pihak mendukung Flyg dan separuh lainnya mendukung Kilbom. Hal ini berisiko mengganggu stabilitas kemenangan politik yang telah kita capai dan jika hal ini terus berlanjut, kita mungkin akan kehilangan kekuasaan sama sekali. Kita perlu memutuskan siapa yang harus memimpin [SWE.GetName] menuju masa depan yang cerah."
 AAT_Sweden_communism.7.a: "Kilbom akan membawa kita ke masa depan"
 AAT_Sweden_communism.7.b: "Terbang adalah jawabannya"
 AAT_Sweden_communism__7_tt_1: "Hal ini akan menyelaraskan kita dengan sekutu"
 AAT_Sweden_communism__7_tt_2: "Hal ini akan menyelaraskan kita dengan Jerman"
 AAT_Sweden_communism.7.c: "Sebenarnya, Stalinisme mungkin bukanlah ide yang buruk"
  #### DENMARK ####
 denmark_political_events.1.t: "Mosi Tidak Percaya Diri"
 denmark_political_events.1.desc: "Kepemimpinan [Den.GetLeader] akhir-akhir ini mendapat sorotan dan kritik yang tajam, dan Rigsdag menuntut Perdana Menteri untuk mundur."
 denmark_political_events.1.a: "Mosi tidak percaya"
 denmark_political_events.1.b: "Serukan pemilu cepat!"
 DEN_available_candidates_tt: "§YKandidat yang Tersedia:§!"
 denmark_political_events.2.t: "Pilih Kepemimpinan Baru"
 denmark_political_events.2.desc: "Rigsdag telah memutuskan untuk melakukan mosi tidak percaya pada kepemimpinan Perdana Menteri [Den.GetLeader]. Pertanyaannya sekarang, siapa yang harus mengisi tempatnya?"
 denmark_political_events.2.a: "Sosial Demokrat atau Chaos!"
 denmark_political_events.2.b: "Kita memerlukan pemerintahan yang liberal"
 denmark_political_events.2.c: "Revolusi Rakyat tanpa pertumpahan darah"
 denmark_political_events.2.d: "Kita membutuhkan tradisi dan stabilitas"
 denmark_political_events.2.e: "Kita harus mencoba sesuatu yang baru"
 DEN_prime_minister_resigns_tt: "§Y[DEN.GetLeader]§! mengundurkan diri sebagai §YPerdana Menteri§!"
 denmark_political_events.3.t: "Perencanaan Kampanye Pemilu"
 denmark_political_events.3.desc: "[GetElectionCampaignDesc]"
 denmark_political_events.3.desc_annual_election: "Sekali lagi saatnya [DEN.GetNameDef] mengadakan pemilu. Berbagai partai sedang merencanakan kampanye mereka yang akan datang untuk menggalang pengikutnya dan memobilisasi pemilih untuk mendukung tujuan mereka masing-masing."
 denmark_political_events.3.desc_snap_election: "Seruan untuk mengadakan pemilu cepat membuat partai-partai [DEN.GetNameDef] bergegas melakukan kampanye untuk mempengaruhi pemilih agar mendukung tujuan mereka masing-masing."
 denmark_political_events.3.a: "Demokrasi atau Kekacauan"
 denmark_political_events.3.b: "Rencanakan Kampanye Komunis"
 denmark_political_events.3.c: "Rencanakan Kampanye Bondepartiet"
 denmark_political_events.3.d: "Rencanakan Kampanye Fasis"
 denmark_political_events.4.t: "Meluncurkan Kampanye Demokrat"
 denmark_political_events.4.desc: "Tampaknya ada perselisihan umum di antara berbagai partai Demokrat mengenai bagaimana mereka harus menyusun kampanyenya. Beberapa pihak tidak ingin meningkatkan ketegangan yang sudah tinggi dan tetap bersikap sopan sepanjang kampanye. Ada pula yang berpendapat bahwa inilah alasan mengapa mereka perlu melakukan serangan untuk meraih kemenangan telak – untuk mencegah arus bawah yang lebih gelap. Namun ada juga yang berpendapat bahwa mereka harus secara aktif menyerang lawan-lawan mereka untuk menjauhkan mereka dari kekuasaan."
 denmark_political_events.4.a: "Jaga agar tetap sopan"
 denmark_political_events.4.b: "Lakukan serangan"
 denmark_political_events.4.c: "Serang lawan kita"
 denmark_political_events.5.t: "Meluncurkan Kampanye $DEN_communism_party$"
 denmark_political_events.5.desc: "Perselisihan muncul di kalangan $DEN_communism_party_long$ terkait kampanye pemilu mendatang. Beberapa pihak tidak ingin meningkatkan ketegangan yang sudah tinggi dan tetap bersikap sopan sepanjang kampanye. Ada pula yang berpendapat bahwa inilah alasan mengapa kita perlu melakukan serangan – untuk mencegah kejahatan yang ada. Namun pihak lain berpendapat bahwa kita harus secara aktif menyerang lawan kita untuk menjauhkan mereka dari kekuasaan."
 denmark_political_events.6.t: "Meluncurkan Kampanye $DEN_neutrality_party$"
 denmark_political_events.6.desc: "Perselisihan muncul di kalangan $DEN_neutrality_party_long$ terkait kampanye pemilu mendatang. Beberapa pihak tidak ingin meningkatkan ketegangan yang sudah tinggi dan tetap bersikap sopan sepanjang kampanye. Yang lain berargumentasi bahwa agar kita bisa mengimplementasikan visi kita untuk [DEN.GetNameDef] kita perlu melakukan serangan. Namun ada juga yang berpendapat bahwa menyerang lawan adalah satu-satunya cara untuk melemahkan mereka dan memperkuat kita."
 denmark_political_events.7.t: "Meluncurkan Kampanye $DEN_fascism_party$"
 denmark_political_events.7.desc: "Perselisihan muncul dalam $DEN_fascism_party_long$ mengenai kampanye pemilu yang akan datang. Beberapa pihak ragu-ragu untuk meningkatkan ketegangan yang sudah tinggi, dengan alasan untuk tetap menjaga nada bicara yang sopan. Yang lain berargumentasi bahwa agar kita bisa mengimplementasikan visi kita untuk [DEN.GetNameDef] kita perlu melakukan serangan. Namun ada juga yang berpendapat bahwa menyerang lawan adalah satu-satunya cara untuk melemahkan mereka dan memperkuat kita."
 denmark_political_events.8.t: "Membentuk Pemerintahan baru"
 denmark_political_events.8.desc: "Pemilu Denmark telah berakhir. Berbagai partai telah melakukan apa yang mereka bisa untuk meyakinkan masyarakat agar memilih tujuan mereka. Kampanyenya mungkin sudah berakhir – namun beberapa orang berpendapat bahwa bagian tersulit dimulai sekarang; membentuk pemerintahan. Terpilihnya Perdana Menteri akan menentukan jalan ke depan bagi [DEN.GetNameDef] di masa mendatang."
 denmark_political_events.8.a: "Pilih Perdana Menteri Demokrat"
 denmark_political_events.8.b: "$DEN_aksel_larsen$ akan mengantarkan kita ke era baru!"
 denmark_political_events.8.c: "$DEN_knud_bach$ akan mengarahkan kita lurus"
 denmark_political_events.8.d: "Biarkan $DEN_frits_clausen$ Naik"
 denmark_political_events.9.t: "Seorang Perdana Menteri Demokrat"
 denmark_political_events.9.desc: "Dengan berakhirnya pemilu di Denmark, pemenangnya adalah demokrasi. Berbeda dengan Partai Komunis yang berpikiran tunggal atau Partai Fasis yang seragam, partai-partai Demokrat bukanlah sebuah partai yang monolit. Masing-masing pihak memiliki visi mereka sendiri tentang cara terbaik untuk membimbing [Den.GetNameDef] melewati masa-masa penuh gejolak di masa depan. Pertanyaannya, siapa yang boleh membentuk pemerintahan baru?"
 denmark_political_events.9.a: "Sosial Demokrat akan menjauhkan kita dari kekacauan"
 denmark_political_events.9.b: "Venstre akan membuat kita tetap bebas dan bijaksana"
 denmark_political_events.9.c: "Partai Rakyat Konservatif akan melindungi kita"
 denmark_political_events.10.t: "Oposisi Politik"
 denmark_political_events.10.desc: "Setelah kesuksesan kita dalam pemilu lalu, kebohongan keji menyebar untuk melemahkan pemerintahan kita. Sudah jelas siapa dalang dibalik rumor ini, tapi kita tidak bisa berbuat banyak untuk mengatasinya. Kita tidak perlu heran jika oposisi politik mendukung kebohongan ini!"
 denmark_political_events.10.a: "Kebohongan Fasis!"
 denmark_political_events.10.b: "Kebohongan Komunis!"
 denmark_political_events.11.t: "Gerakan Monarki"
 denmark_political_events.11.desc: "Ada sesuatu yang busuk di negara bagian [ROOT.GetNameDef]! Akhirnya ada pemerintahan yang dijalankan oleh rakyat, untuk rakyat, tapi tidak semua orang senang. Sebuah gerakan yang memproklamirkan diri sebagai patriot bermunculan, bersatu di belakang institusi usang yaitu monarki. Mereka mendapatkan daya tarik, namun tampaknya tidak menimbulkan ancaman. Belum."
 denmark_political_events.11.a: "Kembali ke bayangan darimana kamu datang!"
 #Occupation Events
 denmark_occupation_event.1.t: "Lawan atau Lipat"
 denmark_occupation_event.1.desc: "Meskipun kami secara eksplisit menyatakan diri kami netral, perang telah mencapai [DEN.GetNameDef]. Kita mungkin masih bisa melindungi rakyat dari kengerian perang jika kita menyerah sejak dini dan menyerah. Dengan cara ini, kami dapat memperoleh konsesi yang menguntungkan dan terus beroperasi secara semi-independen."
 denmark_occupation_event.1.a: "Kita tidak bisa memenangkan pertarungan ini"
 DEN_denmark_keeps_government_form_tt: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! akan mempertahankan bentuk pemerintahannya saat ini"
 denmark_occupation_event.1.b: "Kita harus berdiri dan bertarung!"
 denmark_occupation_event.2.t: "[DEN.GetNameDefCap] Menyerah"
 denmark_occupation_event.2.desc: "Kami telah menerima telegram dari pemerintah Denmark dan [DEN.GetLeader] yang menguraikan persyaratan penyerahan mereka. Jika kita mau mengakui dan menghormati kedaulatan dan keutuhan wilayah mereka, mereka setuju untuk meletakkan senjata mereka dan menjadi protektorat de facto di bawah kita."
 denmark_occupation_event.2.a: "Kami akan melindungi mereka"
 denmark_occupation_event.2.b: "Ini tidak lebih dari sekadar gundukan kecepatan"
 denmark_occupation_event.3.t: "[FROM.GetNameDefCap] Menerima Penyerahan Kami"
 denmark_occupation_event.3.desc: "Dengan menandatangani perjanjian perdamaian yang menguntungkan dengan [FROM.GetNameDef] di awal perang, kami berhasil mempertahankan sebagian kemerdekaan kami dan mempertahankan bentuk pemerintahan kami. Untuk mempertahankan kebebasan relatif ini sebagai protektorat de facto [FROM.GetAdjective], kita dipaksa untuk berkolaborasi dengan mereka dan menciptakan kebijakan kerjasama politik yang luas. Untuk sementara."
 denmark_occupation_event.3.a: "Setidaknya kita akan menjaga kemerdekaan"
 denmark_occupation_event.5.t: "[FROM.GetNameDefCap] Menolak Proposal Kami"
 denmark_occupation_event.5.desc: "[FROM.GetNameDefCap] menolak tawaran penyerahan diri kami dan memilih kekerasan dan darah. Kami akan menguras habis pasukan [FROM.GetAdjective] dan menunjukkan kepada mereka bahwa kami tidak mudah ditaklukkan!"
 denmark_occupation_event.5.a: "Sampai di sini, ayolah!"
 denmark_occupation_event.6.t: "[DEN.GetDanishIndependenceTitle]"
 denmark_occupation_event.6.t_declares_independence: "[DEN.GetNameDefCap] Menyatakan Kemerdekaan!"
 denmark_occupation_event.6.t_asks_for_independence: "[DEN.GetNameDefCap] Meminta Kemerdekaan"
 denmark_occupation_event.6.desc: "[DEN.GetDanishIndependenceDesc]"
 denmark_occupation_event.6.desc_declares_independence: "Denmark rupanya sudah mendeklarasikan diri mereka merdeka dan menyatakan tidak lagi mengakui hegemoni kita atas mereka.  Kami telah memberi mereka stabilitas dan keamanan di bawah perlindungan kami, dan inikah ucapan terima kasih yang kami terima?"
 denmark_occupation_event.6.desc_asks_for_independence: "Kami telah menerima delegasi dari subjek setia kami [FROM.GetNameDef], dipimpin oleh [FROM.GetLeader] sendiri. Rupanya mereka datang langsung ke [ROOT.GetLeader] untuk membahas akhir penaklukan mereka dan meminta kebebasan mereka kembali."
 denmark_occupation_event.6.a: "Pengkhianat yang tidak tahu berterima kasih"
 denmark_occupation_event.6.b: "Itu tidak ada konsekuensinya"
 denmark_occupation_event.7.t: "Perang Kemerdekaan Denmark"
 denmark_occupation_event.7.desc: "[FROM.GetLeader] sekali lagi menolak nalar dan menolak mengakui kemerdekaan kita. Kita harus mengklaim kebebasan kita dan memperjuangkannya, karena tampaknya hanya ada jalan keluar lain dari perbudakan ini. Darah akan tumpah, tapi [ROOT.GetNameDef] akan bebas sekali lagi!"
 denmark_occupation_event.7.a: "Sampai di sini, ayolah!"
 denmark_occupation_event.7.b: "Kebenaran akan menang!"
 denmark_occupation_event.8.t: "Kemerdekaan Denmark"
 denmark_occupation_event.8.desc: "[FROM.GetLeader] telah melihat alasan dan mengakui kemerdekaan kita. Tampaknya perbudakan kita telah berakhir tanpa pertumpahan darah."
 denmark_occupation_event.8.a: "Itu... Sangat mudah"
 denmark_occupation_event.10.t: "Pemogokan anti-pendudukan pecah"
 denmark_occupation_event.10.desc: "Pemogokan terjadi di seluruh [DEN.GetNameDef] sebagai protes terhadap pendudukan. Ini merupakan cara damai untuk menunjukkan ketidakpuasan dan penolakan, namun tentunya akan merugikan hubungan kita dengan [?DEN.DEN_overlord_nation.GetNameDef]."
 denmark_occupation_event.10.a: "Betapa... tidak terduga"
 denmark_occupation_event.11.t: "Pemogokan Anti-Pendudukan Berakhir"
 denmark_occupation_event.11.desc: "Pemogokan nasional sebagai protes terhadap pendudukan [?DEN.DEN_overlord_nation.GetAdjective] telah berakhir. Rakyat Denmark telah menunjukkan kepada penjajah bahwa keinginan kami untuk kebebasan dan kebebasan masih sangat kuat."
 denmark_occupation_event.11.a: "Ini hanyalah permulaan"
 denmark_occupation_event.20.t: "Serangan Depot Senjata yang Berhasil"
 denmark_occupation_event.20.desc: "Setelah perencanaan yang matang dan operasi yang berani, sekelompok anggota perlawanan telah kembali dari serangan yang sukses dengan senjata yang diperuntukkan bagi penguasa nominal kita. Tindakan ini akan memperkuat perjuangan kita untuk kebebasan!"
 denmark_occupation_event.20.a: "Senjata-senjata ini akan berguna"
 denmark_occupation_event.30.t: "Industri Sipil Berhasil Disabotase"
 denmark_occupation_event.30.desc: "Perencanaan yang cermat dilakukan dalam operasi ini, namun semua persiapan dan penantian panjang hingga munculnya keadaan yang tepat tidak membuahkan hasil. Kami telah berhasil menyabotase infrastruktur industri penting yang memasok [?DEN.DEN_overlord_nation.GetNameDef] barang-barang Denmark. Tindakan berani ini akan membatasi produk yang diterima tuan nominal kita dari kita."
 denmark_occupation_event.30.a: "Sukses Besar!"
 denmark_occupation_event.40.t: "Industri Militer Berhasil Disabotase"
 denmark_occupation_event.40.desc: "Anggota Gerakan Perlawanan telah merencanakan serangkaian sabotase selama berbulan-bulan, dan mereka akhirnya melaksanakan rencana mereka. Menyabotase infrastruktur industri militer yang penting berarti [?DEN.DEN_overlord_nation.GetNameDef] akan menerima lebih sedikit senjata yang diproduksi di tanah Denmark."
 denmark_occupation_event.40.a: "Sukses Besar!"
 denmark_occupation_event.100.t: "Penyelarasan Ulang Denmark"
 denmark_occupation_event.100.desc: "Tampaknya pemerintah Denmark telah menyadari apa yang menjadi kepentingan terbaik mereka dan telah menyelaraskan kebijakan mereka agar selaras dengan kebijakan kami. Kami telah menerima permintaan dari [FROM.GetLeader] untuk diizinkan meningkatkan kemampuan militer mereka dan bergabung dengan kami. Hal ini akan memungkinkan mereka untuk menjalankan kebijakan luar negeri yang lebih agresif dan independen dari kita."
 denmark_occupation_event.100.a: "Selamat datang saudara seperjuangan kita!"
 denmark_occupation_event.100.b: "Kami akan berhasil tanpa militer mereka yang lemah"
 denmark_occupation_event.101.t: "[FROM.GetNameDefCap] Menerima Proposal Aliansi Kami"
 denmark_occupation_event.101.desc: "[FROM.GetLeader] yang bijaksana telah dengan baik hati menerima kami sebagai sekutu dan mengakui kemampuan kami untuk berkontribusi dalam upaya perang. Kami juga telah diberi izin untuk meningkatkan kemampuan militer kami. Semua ini akan memungkinkan kita untuk menerapkan kebijakan luar negeri yang lebih agresif dan mengamankan wilayah Nordik bagi tuan [FROM.GetAdjective] kita."
 denmark_occupation_event.101.a: "Benar-benar hari yang mulia!"
 denmark_occupation_event.102.t: "[FROM.GetNameDefCap] Menolak Proposal Aliansi Kami"
 denmark_occupation_event.102.desc: "[FROM.GetLeader] dengan bodohnya telah menolak uluran tangan kami yang meminta untuk memulai kerja sama yang lebih dalam antar negara kami, di mana kami dapat membantu [FROM.GetNameDef] dan menawarkan bantuan. Tampaknya mereka lebih memilih untuk melakukannya sendiri daripada mengandalkan sekutu mereka."
 denmark_occupation_event.102.a: "Mereka meremehkan kekuatan kita!"
 denmark_occupation_event.110.t: "[FROM.GetNameDefCap] Menjanjikan Kesetiaannya"
 denmark_occupation_event.110.desc: "Delegasi Denmark yang dipimpin oleh [FROM.GetLeader] sendiri telah tiba di ibu kota kami untuk secara pribadi bersumpah setia kepada [ROOT.GetLeadr] dan perjuangan [ROOT.GetAdjective]. Pemerintah Denmark tampaknya bertekad untuk sepenuhnya menerima kolaborasi kami dan memberikan bantuan sebaik mungkin."
 denmark_occupation_event.110.a: "Terimalah mereka dengan tangan terbuka"
 denmark_occupation_event.110.b: "Kami tidak membutuhkan kesetiaan mereka"
 denmark_occupation_event.111.t: "[FROM.GetNameDefCap] Menyambut Kesetiaan Kami"
 denmark_occupation_event.111.desc: "[FROM.GetLeader] menyambut [ROOT.GetLeader] dengan tangan terbuka dan mengakui nilai serta kontribusi yang kami berikan pada kemitraan ini. Hal ini akan mempererat hubungan kedua negara dan menjadikan kita berdua lebih kuat."
 denmark_occupation_event.111.a: "Sebuah tanda kepercayaan yang besar"
 denmark_occupation_event.112.t: "[FROM.GetNameDefCap] Menolak Kesetiaan Kami"
 denmark_occupation_event.112.desc: "[FROM.GetLeader] dengan tidak bijaksana telah menolak [ROOT.GetLeader] dan menolak kesetiaan kami, meremehkan kemampuan dan kekuatan kami yang semakin besar. Hal ini hanya menyisakan satu pilihan jika kita ingin mendapatkan kembali kebebasan kita; perang."
 denmark_occupation_event.112.a: "Kami akan memberi mereka pelajaran tentang kerendahan hati!"
 #Resistance Events
 denmark_resistance_event.1.t: "[DEN.GetNameDefCap] Mencari Dukungan Kami"
 denmark_resistance_event.1.desc: "Kami telah menerima pesan yang disampaikan dengan sangat rahasia dari [DEN.GetNameDef]. Mereka diam-diam mencari sekutu yang dapat mendukung klaim kemerdekaan mereka ketika hari kemerdekaan tiba dan mereka berupaya mendapatkan kembali kedaulatan mereka dari [?DEN.DEN_overlord_nation.GetNameDef]. Apakah kita ingin memihak dalam konflik ini?"
 denmark_resistance_event.1.a: "Untuk [DEN.GetNameDef] gratis!"
 denmark_resistance_event.1.b: "Merekalah yang harus disalahkan"
 DEN_supports_denmark_TT: "Kami setuju untuk mendukung dan bersekutu [DEN.GetFlag]§Y[FROM.GetNameDef]§! jika mereka mendeklarasikan kemerdekaan"
 denmark_resistance_event.2.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 denmark_resistance_event.2.desc: "[FROM.GetLeader] yang pemberani telah memutuskan untuk secara diam-diam memberikan dukungan [FROM.GetAdjective] dalam perjuangan kita untuk mendapatkan kembali kebebasan kita! Hal ini tentu akan sangat membantu ketika tiba saatnya kita mendeklarasikan kemerdekaan dari penguasa kita yang kejam."
 denmark_resistance_event.2.a: "Strålende!"
 denmark_resistance_event.3.t: "[FROM.GetNameDefCap] Menolak Permohonan Bantuan Kami"
 denmark_resistance_event.3.desc: "[FROM.GetLeader] yang penakut telah memutuskan untuk menahan dukungan [FROM.GetAdjective] dalam perjuangan kami untuk mendapatkan kembali kebebasan kami. Kita harus beralih ke tempat lain untuk mendapatkan dukungan yang kita perlukan."
 denmark_resistance_event.3.a: "Fordomt!"
 denmark_resistance_event.4.t: "[DEN.GetNameDefCap] meminta Senjata"
 denmark_resistance_event.4.desc: "Kami telah menerima permintaan dari [DEN.GetNameDef] yang meminta pengiriman senjata untuk mempersenjatai gerakan perlawanan mereka dan membantu perjuangan mereka untuk mendapatkan kembali kebebasan."
 denmark_resistance_event.4.a: "Berikan mereka apa yang kita punya"
 denmark_resistance_event.4.b: "Kita tidak punya apa pun untuk disisihkan..."
 denmark_resistance_event.5.t: "[FROM.GetNameDefCap] Telah Diterima untuk Mengirimkan Senjata"
 denmark_resistance_event.5.desc: "[FROM.GetAdjective] telah memutuskan untuk mengindahkan permohonan kami untuk mendapatkan senjata, dan berencana untuk menjatuhkan material tersebut melalui udara. Anggota Perlawanan telah mengoordinasikan tempat dan waktu pertemuan untuk pengiriman dengan anggota badan intelijen [FROM.GetAdjective]."
 denmark_resistance_event.6.t: "[FROM.GetNameDefCap] Menolak Permintaan Senjata Kami"
 denmark_resistance_event.6.desc: "Permintaan senjata kami dari sekutu [FROM.GetAdjective] kami telah ditolak. Mereka dengan nada meminta maaf mengatakan kepada kami bahwa mereka tidak mempunyai peralatan cadangan saat ini."
 denmark_resistance_event.7.t: "[DEN.GetNameDefCap] Memanggil Dukungan Kami"
 denmark_resistance_event.7.desc: "[DEN.GetNameDefCap] telah mendeklarasikan kemerdekaannya dari penguasa yang menindas. Menurut laporan, pemimpin [?DEN.DEN_overlord_nation.GetAdjective], [?DEN.DEN_overlord_nation.GetLeader], sangat marah dan meneriakkan kata-kata kotor setelah menerima berita tersebut. Denmark kini menyerukan kepada kami untuk menghormati perjanjian kami dan mengizinkan mereka masuk ke dalam aliansi kami."
 denmark_resistance_event.7.a: "Bergabunglah dengan mereka!"
 denmark_resistance_event.7.b: "Keadaan telah berubah..."
 denmark_resistance_event.7.c: "Kami tidak dalam posisi untuk memutuskan hal ini"
 denmark_resistance_event.8.t: "[FROM.GetNameDefCap] Mengundang Kami ke Fraksi mereka"
 denmark_resistance_event.8.desc: "[From.GetLeader] telah menghormati perjanjian kami dan telah menyampaikan undangan kepada kami untuk bergabung dengan aliansi mereka."
 denmark_resistance_event.9.t: "[FROM.GetNameDefCap] Mundur dari Perjanjian Kami"
 denmark_resistance_event.9.desc: "[From.GetLeader] yang tidak terhormat telah mengingkari perjanjian kita dan menolak mengundang kita ke aliansi mereka!"
 denmark_resistance_event.9.a: "Traitorous backstabbers!"
 denmark_resistance_event.10.t: "[FROM.GetNameDefCap] Menuntut [DEN.GetNameDefCap] Bergabung dengan Fraksi Kami"
 denmark_resistance_event.10.desc: "Kami baru saja menerima kabar bahwa [FROM.GetNameDef] rupanya telah menandatangani perjanjian dengan [DEN.GetNameDef] untuk mendukung deklarasi kemerdekaan mereka dan bergabung bersama. [FROM.GetLeader] sekarang menegaskan bahwa kami menghormati dan menjunjung tinggi sisi mereka dalam perjanjian dengan Denmark."
 denmark_resistance_event.10.a: "Hal ini akan memperkuat seluruh aliansi"
 denmark_resistance_event.10.b: "Kami tidak terikat untuk menghormati kesepakatan mereka"
 denmark_resistance_event.11.t: "[DEN.GetNameDefCap] Menawarkan Kecerdasan"
 denmark_resistance_event.11.desc: "Anggota badan intelijen kami telah didekati oleh mitra mereka di Denmark, yang ingin berbagi informasi antar negara kami. Hal ini tidak diragukan lagi akan mendukung operasi rahasia kami dan akan menguntungkan kedua negara."
 denmark_resistance_event.11.a: "Musuh dari musuhku, seperti yang mereka katakan..."
 denmark_resistance_event.11.b: "Kami tidak membutuhkan bantuan mereka"
 denmark_resistance_event.12.t: "[FROM.GetNameDefCap] Menerima Pertukaran Intelijen Kami"
 denmark_resistance_event.12.desc: "Badan intelijen [FROM.GetAdjective] telah melihat manfaat dari berbagi informasi antar negara dan telah menyetujui proposal kami."
 denmark_resistance_event.12.a: "Keputusan yang cerdas"
 denmark_resistance_event.13.t: "[FROM.GetNameDefCap] Menolak Pertukaran Intelijen"
 denmark_resistance_event.13.desc: "Badan intelijen [FROM.GetNameDef] berpandangan sempit dan tidak bijaksana, kepala intelijen [FROM.GetAdjective] gagal melihat manfaat dari berbagi informasi antar negara dan telah menolak usulan kami."
 denmark_resistance_event.13.a: "Keputusan yang tidak cerdas"
 denmark_resistance_event.20.t: "Permintaan Denmark untuk Pasukan Tuan Rumah"
 denmark_resistance_event.20.desc: "Kami telah menerima penyelidikan rahasia dari [DEN.GetLeader] yang mendorong minat kami untuk menampung pasukan Denmark di tanah [ROOT.GetAdjective] untuk melatih dan memperlengkapi mereka dalam persiapan untuk pembebasan total [DEN.GetNameDef]. Kita bisa menyembunyikan jumlah mereka dan tujuan sebenarnya dengan menyebut mereka \"polisi militer\"."
 denmark_resistance_event.20.a: "We will host them"
 denmark_resistance_event.20.b: "Kita tidak mampu membuat marah Tuan mereka"
 denmark_resistance_event.21.t: "[FROM.GetNameDefCap] Menerima Menjadi Tuan Rumah Pasukan Kami"
 denmark_resistance_event.21.desc: "[FROM.GetNameDefCap] telah dengan baik hati menyetujui untuk menampung Brigade Denmark kami di pengasingan, untuk mempersiapkan mereka menghadapi pembebasan [DEN.GetNameDef] ketika saatnya tiba."
 denmark_resistance_event.22.t: "[FROM.GetNameDefCap] Menolak Pasukan Kami"
 denmark_resistance_event.22.desc: "[FROM.GetNameDefCap] dengan memalukan telah menolak untuk menampung Brigade Denmark kita di pengasingan, dan tidak akan mempersiapkan mereka untuk pembebasan [DEN.GetNameDef] ketika waktunya sudah tiba. Kita harus mencari di tempat lain untuk mendapatkan bantuan yang kita perlukan."
 denmark_resistance_event.23.t: "[DEN.GetAdjective] Permintaan Pembelian Kapal Tua"
 denmark_resistance_event.23.desc: "Delegasi Denmark melakukan kunjungan rahasia kepada kami, menanyakan apakah kami bersedia menjual beberapa Kapal Perusak lama kami kepada mereka atau tidak. [DEN.GetNameDefCap] berada di bawah penaklukan [?DEN.DEN_overlord_nation.GetNameDef], dan ini bisa menjadi indikasi jelas bahwa mereka sedang mengumpulkan kekuatan untuk mendeklarasikan kemerdekaan. Apakah kita bersedia membantu mereka mendapatkan kembali kemerdekaannya?"
 denmark_resistance_event.23.a: "Beri mereka beberapa kapal perusak tua"
 denmark_resistance_event.23.b: "Kita tidak mampu membuat marah Tuan mereka"
 denmark_resistance_event.24.t: "[FROM.GetNameDefCap] Telah Setuju untuk Menjual Kapal Perusak kepada Kami"
 denmark_resistance_event.24.desc: "[FROM.GetNameDefCap] dengan bijak telah setuju untuk menjual beberapa Kapal Perusak lama mereka kepada kami! Kita harus menyembunyikannya dari [?DEN.DEN_overlord_nation.GetNameDef], dan hanya menyebarkannya ketika waktu untuk menyerang telah tiba."
 denmark_resistance_event.25.t: "[FROM.GetNameDefCap] Menolak Menjual Kapal Penghancur kepada Kami"
 denmark_resistance_event.25.desc: "[FROM.GetNameDefCap] dengan tidak bijaksana telah menolak permintaan kami untuk menjual beberapa Kapal Perusak lama mereka kepada kami. Tindakan bodoh mereka tidak akan menghalangi kami untuk memperkuat armada kami sehingga kami dapat mengamankan perairan kami. Kami akan mencari negara lain yang lebih bersahabat."
 denmark_resistance_event.30.t: "Perjalanan Harian Raja"
 denmark_resistance_event.30.desc: "Raja mempunyai kebiasaan berkendara melintasi Kopenhagen setiap hari tanpa penjaga sebagai bentuk protes diam-diam terhadap kekuasaan pendudukan dan telah menjadi simbol seluruh bangsa melawan pendudukan [?DEN.DEN_overlord_nation.GetAdjective]."
 denmark_resistance_event.30.a: "Betapa Beraninya!"
 denmark_overlord_events.1.t: "Krisis Telegram"
 denmark_overlord_events.1.desc: "Krisis diplomatik sedang terjadi antara negara kita dan [?DEN.DEN_overlord_nation.GetNameDef], yang berasal dari telegram yang dikirim oleh Raja kita. Pesan tersebut hanya berbunyi 'Ucapkan terima kasih yang terbaik', namun [?DEN.DEN_overlord_nation.GetLeader] dikatakan tersinggung oleh tanggapan Raja yang dianggap begitu saja terhadap ucapan selamat dari pemimpin [?DEN.DEN_overlord_nation.GetAdjective] pada kesempatan ulang tahun Raja.\nHubungan antara negara-negara kita telah tegang selama beberapa waktu sekarang, dan ini mungkin menjadi alasan yang tuan kita cari untuk memperketat cengkeraman mereka terhadap kemerdekaan dan pemerintahan kita."
 denmark_overlord_events.1.a: "Minta maaf dan cobalah menyelamatkan situasi"
 denmark_overlord_events.1.b: "Kirim [?DEN.DEN_overlord_nation.GetLeader] salam kami"
 denmark_overlord_events.2.desc: "Pemimpin kami yang ramah [ROOT.GetLeader] mengirim telegram yang tulus mengucapkan selamat ulang tahun kepada raja [FROM.GetNameDef] tetapi menerima balasan singkat dan dingin sebagai balasannya. Denmark sekarang menyadari betapa parahnya penghinaan mereka dan menyarankan untuk mengirim putra mahkota Frederik untuk meminta maaf kepada [ROOT.GetLeader] secara pribadi.\nNamun, kami dapat menggunakan kesempatan ini untuk menerapkan kontrol yang lebih ketat terhadap subjek kami, yang telah menikmati hak istimewa yang cukup liberal di bawah yurisdiksi kami."
 denmark_overlord_events.2.a: "Terima permintaan maafnya"
 denmark_overlord_events.2.b: "Hukum mereka karena kekasaran mereka"
 denmark_overlord_events.3.t: "[FROM.GetLeader] Menerima Permintaan Maaf Kami"
 denmark_overlord_events.3.desc: "Upaya kami untuk menenangkan [FROM.GetLeader] tampaknya telah membuahkan hasil - untuk saat ini."
 denmark_overlord_events.3.a: "Krisis dapat dihindari"
 denmark_overlord_events.4.t: "[FROM.GetLeader] Menolak Permintaan Maaf Kami"
 denmark_overlord_events.4.desc: "[FROM.GetLeader] menolak untuk melihat alasan dan menganggap balasan telegram singkat Raja atas ucapan selamatnya sebagai penghinaan pribadi dan tampaknya sangat ingin menghukum kami atas kesalahpahaman yang tidak menguntungkan ini."
 denmark_overlord_events.4.a: "Sangat disesalkan"
 denmark_overlord_events.5.desc: "Pemimpin kami yang ramah [ROOT.GetLeader] mengirim telegram yang tulus mengucapkan selamat ulang tahun kepada raja [FROM.GetNameDef] tetapi menerima balasan singkat dan dingin sebagai balasannya. Yang lebih parahnya lagi, Denmark kini menolak mengakui kesalahan rajanya dan meminta maaf secara wajar.\nIni bisa menjadi kesempatan yang baik untuk menempatkan subyek kita pada tempatnya dan mengingatkan mereka bahwa hak istimewa mereka yang unik di bawah yurisdiksi kita tidak boleh dianggap remeh."
 denmark_overlord_events.5.a: "Ada urusan yang lebih mendesak untuk dihadiri..."
 denmark_overlord_events.5.b: "Kekurangajaran ini harus dihukum!"
 denmark_overlord_events.6.t: "Krisis Telegram Terselesaikan dengan sendirinya"
 denmark_overlord_events.6.desc: "Tampaknya penolakan kami untuk meminta maaf atas bagaimana [FROM.GetLeader] memutuskan untuk terhina secara pribadi oleh jawaban Raja kami yang singkat namun langsung pada telegram ulang tahunnya tidak diperhatikan atau diabaikan."
 denmark_overlord_events.6.a: "Mereka pasti mengakui bahwa kesalahannya ada pada mereka sendiri"
 denmark_overlord_events.7.t: "[FROM.GetNameDefCap] Memberlakukan Hukum Baru yang Keras"
 denmark_overlord_events.7.desc: "Sebagai akibat langsung dari apa yang dikenal sebagai 'Krisis Telegram' dan ketidakmampuan [FROM.GetLeader] untuk melihat alasan, undang-undang baru yang keras telah disahkan dan diberlakukan pada kami."
 denmark_overlord_events.7.a: "Undang-undang ini hanya bersifat sementara - kami akan memastikannya!"
 denmark_overlord_events.10.t: "[FROM.GetNameDefCap] Menuntut Pengunduran Diri [ROOT.GetLeader]"
 denmark_overlord_events.10.desc: "Memburuknya hubungan antar negara kita menyebabkan adanya permintaan resmi dari [FROM.GetAdjective] Kementerian Luar Negeri untuk pengunduran diri[ROOT.GetLeader].\nMeskipun kita telah diberikan otonomi unik di bawah ‘perlindungan’ [FROM.GetAdjective], tidak bijaksana jika kita semakin melemahkan hubungan antar negara."
 denmark_overlord_events.10.a: "Kita harus mematuhinya"
 denmark_overlord_events.10.b: "Ini bukan urusan mereka!"
 denmark_overlord_events.11.t: "Pemilihan Perdana Menteri Baru"
 denmark_overlord_events.11.desc: "Waktunya telah tiba bagi kita untuk tidak hanya memilih siapa yang akan menjalankan [ROOT.GetNameDef] tetapi juga siapa yang akan menghadapi kekuasaan pendudukan [FROM.GetAdjective]."
 denmark_overlord_events.11.a: "Seorang pemimpin Demokrat"
 denmark_overlord_events.11.b: "$DEN_knud_bach$"
 denmark_overlord_events.11.c: "$DEN_aksel_larsen$"
 denmark_overlord_events.11.d: "Seorang pemimpin Fasis"
 denmark_overlord_events.12.desc: "Keindahan Demokrasi adalah banyaknya pilihan kepemimpinan yang dihadirkannya."
 denmark_overlord_events.12.a: "Seorang Sosial Demokrat"
 denmark_overlord_events.12.b: "Seorang Liberal"
 denmark_overlord_events.12.c: "Seorang Konservatif"
 denmark_overlord_events.12.d: "Orang Luar"
 denmark_overlord_events.13.desc: "Hanya tangan yang kuat yang dapat membimbing [ROOT.GetNameDef] ke depan."
 denmark_overlord_events.13.a: "$DEN_frits_clausen$"
 denmark_overlord_events.13.b: "$DEN_cay_lembcke$"
 denmark_overlord_events.14.t: "[FROM.GetNameDefCap] Memilih Perdana Menteri Baru"
 denmark_overlord_events.14.desc: "Pemerintah Denmark memenuhi permintaan kami dan memilih Perdana Menteri baru."
 denmark_overlord_events.14.a: "Bagus"
 denmark_overlord_events.15.t: "[FROM.GetLeader] Menolak Mengundurkan Diri"
 denmark_overlord_events.15.desc: "Tampaknya pemerintah Denmark menolak mendengarkan permintaan tulus kami agar [FROM.GetLeader] mundur sebagai Perdana Menteri demi terjalinnya kerja sama yang lebih baik antara kedua negara. Kekurangajaran seperti inilah yang memperburuk hubungan kami dengan rakyat Denmark! Sesuatu perlu dilakukan untuk menyelamatkan kolaborasi yang sedang berlangsung antara pemerintah kita."
 denmark_overlord_events.15.a: "Sekarang bukan waktunya"
 denmark_overlord_events.15.b: "Beri mereka pelajaran"
 denmark_overlord_events.15.c: "Pasang kolaborator setia"
 denmark_overlord_events.16.desc: "Menanggapi penolakan kami untuk menyerah pada tuntutan [FROM.GetAdjective] agar [ROOT.GetLeader] mengundurkan diri, penguasa kami telah memutuskan untuk menerapkan serangkaian undang-undang baru untuk memberi kami pelajaran tentang kerendahan hati dan kepatuhan."
 denmark_overlord_events.16.a: "Suatu hari nanti kita akan mengajari mereka kerendahan hati yang sejati...."
 denmark_overlord_events.17.t: "[FROM.GetAdjective] Berencana untuk Mengangkat Pemerintahan yang Setia"
 denmark_overlord_events.17.desc: "[FROM.GetNameDefCap] telah memperjelas bahwa mereka bertujuan untuk membentuk pemerintahan yang lebih pro-[FROM.GetAdjective] sebagai tanggapan terhadap penolakan [ROOT.GetLeader] untuk mundur sebagai Perdana Menteri. Hal ini berarti berkurangnya kemandirian kita kecuali kita bangkit sekarang – baik kita siap atau tidak…"
 denmark_overlord_events.17.a: "Kami tidak punya pilihan..."
 denmark_overlord_events.17.b: "Baik atau buruk!"
 denmark_overlord_events.20.t: "[FROM.GetnameDefCap] Menuntut Pemerintahan Baru"
 denmark_overlord_events.20.desc: "Bukan rahasia lagi bahwa [FROM.GetnameDef] adalah pendukung kuat [FROM.GetRulingIdeologyNoun], dan memandang [ROOT.GetRulingIdeologyNoun] dengan sangat meremehkan. Oleh karena itu, mungkin bukan kejutan besar jika mereka kini tidak dapat lagi menoleransi salah satu rakyatnya yang menganut ideologi ini. Mereka dengan tegas telah menyatakan dengan sangat jelas bahwa mereka ingin kita meninggalkan [ROOT.GetRulingIdeologyNoun]."
 denmark_overlord_events.20.a: "Kita harus melakukannya - demi kebaikan rakyat..."
 denmark_overlord_events.20.b: "Kami tidak akan pernah menyerah!"
 denmark_overlord_events.21.t: "Pemerintahan Baru"
 denmark_overlord_events.21.desc: "Tidak punya pilihan selain menuruti keinginan tuan kami, kami sekarang harus membentuk pemerintahan baru."
 denmark_overlord_events.21.a: "Demokrasi Akar Rumput"
 denmark_overlord_events.21.b: "Untuk Raja dan Negara"
 denmark_overlord_events.21.c: "Komunisme tanpa Revolusi"
 denmark_overlord_events.21.d: "Fasisme tanpa pertumpahan darah"
 denmark_overlord_events.22.t: "Demokrasi dan Kebebasan berarti banyak Pilihan"
 denmark_overlord_events.22.desc: "Keindahan Demokrasi adalah banyaknya pilihan kepemimpinan yang dihadirkannya."
 denmark_overlord_events.23.t: "[FROM.GetNameDefCap] Hasil dan Perubahan Pemerintahan"
 denmark_overlord_events.23.desc: "Kami telah berhasil membujuk Denmark untuk meninggalkan cara-cara mereka yang salah dan menganut [FROM.GetRulingIdeologyNoun]."
 denmark_overlord_events.23.a: "Bagus. Bagus!"
 denmark_overlord_events.24.t: "[FROM.GetLeader] Menolak Melepaskan Kekuasaan"
 denmark_overlord_events.24.desc: "Pemimpin [FROM.GetRulingIdeology] [FROM.GetLeader] dari [FROM.GetNameDef] menolak untuk mendengarkan alasan dan melakukan yang terbaik untuk negaranya. Perilaku haus kekuasaan seperti ini merupakan indikasi [FROM.GetRulingIdeologyNoun], dan kita tidak perlu terlalu terkejut dengan tanggapan Denmark. Kita mungkin harus membuat contoh dari mereka..."
 denmark_overlord_events.24.a: "Kami akan menanganinya nanti"
 denmark_overlord_events.24.b: "Lalu kami akan memaksa mereka"
 denmark_overlord_events.25.t: "[FROM.GetNameDefCap] Berencana untuk melantik Pemerintahan [FROM.GetRulingIdeology]"
 denmark_overlord_events.25.desc: "Kami dengan tegas menolak permintaan [FROM.GetAdjective] untuk meninggalkan [ROOT.GetRulingIdeologyNoun], namun kami harus memahami bahwa mereka tidak akan puas dengan jawaban kami.  [FROM.GetAdjective] [FROM.GetRulingIdeologyNoun] tidak mengenal batas dan akan selalu berusaha memaksakan jalannya menuju kekuasaan."
 denmark_overlord_events.25.a: "Kita harus mematuhinya – untuk menyelamatkan rakyat dari perang"
 denmark_overlord_events.26.t: "[FROM.GetNameDefCap] Menuntut Kami Melarang Komunisme"
 denmark_overlord_events.26.desc: "Kami telah menerima tuntutan dari [FROM.GetNameDef] untuk melarang segala dan semua kegiatan komunis di seluruh negeri. Mereka menyatakan bahwa membiarkan ideologi berbahaya ini berkembang ketika penguasa [FROM.GetAdjective] kita yang tegas dengan berani membela dirinya sendiri dan dunia bebas melawan negara yang dengan sepenuh hati menganut komunisme adalah sebuah tindakan pengkhianatan."
 denmark_overlord_events.26.a: "Larang Komunisme"
 denmark_overlord_events.26.b: "Kami tidak akan diintimidasi dengan melarang keinginan bebas!"
 denmark_overlord_events.27.t: "[FROM.GetNameDefCap] Melarang Komunisme"
 denmark_overlord_events.27.desc: "Kami telah berhasil membujuk pemerintah Denmark untuk melarang komunisme saat kami berjuang melawan ideologi tersebut dalam perjuangan sampai mati. Hanya ada satu pemenang, dan kita harus menang agar rakyat [ROOT.GetAdjective] bisa sejahtera!"
 denmark_overlord_events.27.a: "Menuju Kemenangan!"
 denmark_overlord_events.28.t: "[FROM.GetNameDefCap] Menolak Melarang Komunisme"
 denmark_overlord_events.28.desc: "Terlepas dari permohonan dan bujukan kami, pemerintah Denmark menolak untuk melihat alasan dan melarang komunisme. Ideologi korup ini tampaknya telah tertanam kuat di hati masyarakat Denmark saat kita berjuang melawan gagasan komunisme dalam perjuangan sampai mati. Hanya ada satu pemenang, dan kita harus menang agar rakyat [ROOT.GetAdjective] bisa sejahtera!"
 denmark_overlord_events.28.a: "Kami akan menang!"
 denmark_overlord_events.29.t: "[FROM.GetNameDefCap] Menuntut Kami Melarang Fasisme"
 denmark_overlord_events.29.desc: "Kami telah menerima tuntutan dari [FROM.GetNameDef] untuk melarang segala dan semua aktivitas fasis di seluruh negeri. Mereka menyatakan bahwa membiarkan ideologi berbahaya ini berkembang ketika penguasa [FROM.GetAdjective] kita yang tegas dengan berani membela dirinya sendiri dan dunia bebas melawan negara yang dengan sepenuh hati menganut fasisme adalah sebuah tindakan pengkhianatan."
 denmark_overlord_events.29.a: "Larangan Fasisme"
 denmark_overlord_events.30.t: "[FROM.GetNameDefCap] Melarang Fasisme"
 denmark_overlord_events.30.desc: "Kami telah berhasil membujuk pemerintah Denmark untuk melarang fasisme saat kami berjuang melawan ideologi tersebut dalam perjuangan sampai mati. Hanya ada satu pemenang, dan kita harus menang agar rakyat [ROOT.GetAdjective] bisa sejahtera!"
 denmark_overlord_events.31.t: "[FROM.GetNameDefCap] Menolak Melarang Fasisme"
 denmark_overlord_events.31.desc: "Terlepas dari permohonan dan bujukan kami, pemerintah Denmark menolak untuk melihat alasan dan melarang fasisme. Ideologi korup ini tampaknya telah tertanam kuat di hati masyarakat Denmark saat kita berjuang melawan gagasan fasisme dalam perjuangan sampai mati. Hanya ada satu pemenang, dan kita harus menang agar rakyat [ROOT.GetAdjective] bisa sejahtera!"
 denmark_overlord_events.32.t: "[FROM.GetNameDefCap] Menuntut Pengiriman Senjata"
 denmark_overlord_events.32.desc: "Tampaknya persediaan [FROM.GetAdjective] semakin berkurang karena mereka meminta kami untuk menyediakan senjata bagi mereka dalam konflik yang sedang berlangsung.\nIni juga bisa saja merupakan tipu muslihat untuk melucuti senjata negara kita dengan cara yang licik agar kita tidak bisa bangkit dan menjatuhkan kuk [FROM.GetAdjective] yang kita miliki."
 denmark_overlord_events.32.a: "Kirimkan senjatanya"
 denmark_overlord_events.32.b: "Sedikit yang kita miliki yang kita perlukan jika perang sampai pada kita..."
 denmark_overlord_events.33.t: "[FROM.GetNameDefCap] Menyediakan Senjata"
 denmark_overlord_events.33.desc: "Permintaan kami untuk pengiriman senjata ke Denmark telah dikabulkan karena kami menerima batch pertama."
 denmark_overlord_events.34.t: "[FROM.GetNameDefCap] Menolak Memberikan Senjata"
 denmark_overlord_events.34.desc: "Permintaan kami untuk pengiriman senjata ke Denmark telah ditolak karena pemerintah Denmark memberikan jawaban yang lemah bahwa mereka hanya membutuhkan sedikit senjata yang mereka miliki untuk berjaga-jaga jika perang sampai ke tangan mereka. Lebih lanjut mereka mengatakan bahwa mereka adalah negara netral dan mengirimkan senjata akan melanggar netralitas tersebut..."
 denmark_overlord_events.34.a: "Kami akan membiarkannya kali ini..."
 denmark_overlord_events.34.b: "Mereka tidak akan bisa membodohi kita semudah itu!"
 denmark_overlord_events.35.desc: "[FROM.GetNameDefCap] menyebut gertakan kami dan memberlakukan undang-undang baru yang menetapkan aliran senjata secara konstan dari pabrik kami langsung ke pabrik tersebut"
 denmark_overlord_events.35.a: "Kami sangat membutuhkan senjata-senjata itu untuk diri kami sendiri"
 denmark_overlord_events.36.t: "[FROM.GetNameDefCap] Menuntut Wajib Militer"
 denmark_overlord_events.36.desc: "Tampaknya jumlah tenaga kerja [FROM.GetAdjective] semakin menipis karena mereka meminta kami untuk menyediakan tenaga kerja bagi mereka untuk memicu konflik yang sedang berlangsung.\nIni juga bisa saja merupakan tipu muslihat untuk melucuti senjata negara kita dengan cara yang licik agar kita tidak bisa bangkit dan menjatuhkan kuk [FROM.GetAdjective] yang kita miliki."
 denmark_overlord_events.36.a: "Kita harus melakukan perintah tuan kita..."
 denmark_overlord_events.36.b: "Tidak ada orang Denmark yang akan mati di negeri asing!"
 denmark_overlord_events.37.t: "[FROM.GetNameDefCap] Menerima untuk Memberikan Wajib Militer"
 denmark_overlord_events.37.desc: "Permintaan kami untuk wajib militer Denmark telah diterima oleh pemerintah mereka karena mereka mengirimkan pasukan pertama untuk membantu kami dalam konflik yang sedang berlangsung."
 denmark_overlord_events.38.t: "[FROM.GetNameDefCap] Menolak Mengirim Wajib Militer"
 denmark_overlord_events.38.desc: "Permintaan kami untuk wajib militer Denmark telah ditolak karena pemerintah Denmark memberikan jawaban lemah bahwa mereka menolak mengirim warganya untuk mati berperang demi negara asing di negeri asing. Mereka juga mengatakan bahwa mereka adalah negara netral dan mengirimkan pasukan akan melanggar netralitas itu..."
 denmark_overlord_events.38.b: "Lalu kami akan mengambilnya dengan paksa!"
 denmark_overlord_events.39.desc: "[FROM.GetNameDefCap] menolak penolakan kami untuk mengirim pria Denmark untuk tewas dalam perang di luar negeri dan memberlakukan undang-undang baru yang menetapkan bahwa sejumlah pria dewasa harus bertugas di angkatan bersenjata [FROM.GetAdjective]."
 denmark_overlord_events.39.a: "Keterlaluan!"
 denmark_overlord_events.40.t: "Seorang [FROM.GetAdjective] Yang Berkuasa Penuh"
 denmark_overlord_events.40.desc: "Arahan dari Kementerian Luar Negeri [FROM.GetAdjective] telah memberi tahu kita bahwa kepemimpinan [FROM.GetAdjective] sudah bosan dengan lemahnya kolaborasi dan hubungan yang erat antara negara kita. Oleh karena itu, mereka memutuskan untuk mengganti pemerintahan sah kita dengan pemerintahan yang berkuasa penuh - gubernur yang setia pada [FROM.GetNameDef].\nHal ini akan sangat membatasi otonomi dan kedaulatan yang kita miliki dan mungkin menyebabkan kerusakan yang tidak dapat diperbaiki."
 denmark_overlord_events.40.a: "Ini akan menjadi pemerintahan [FROM.GetAdjective] kecuali namanya saja"
 denmark_overlord_events.40.b: "[ROOT.GetAdjective] orang tidak akan pernah tunduk pada ini!"
 denmark_overlord_events.41.t: "Yang Berkuasa Penuh [ROOT.GetAdjective] Mengambil Kekuasaan"
 denmark_overlord_events.41.desc: "Seperti yang telah kami perkirakan, pemerintah Denmark menyerah di bawah tekanan kami dan kami telah berhasil melantik pemegang kekuasaan penuh untuk memerintah [FROM.GetNameDef]. Hal ini akan memperkuat cengkeraman kita terhadap negara ini dan mendekatkan mereka pada tujuan kita."
 denmark_overlord_events.41.a: "Semua sesuai rencana"
 denmark_overlord_events.42.t: "Pemerintah Denmark Menolak untuk Mengundurkan Diri"
 denmark_overlord_events.42.desc: "Rencana kami untuk mengangkat pemegang kekuasaan penuh yang setia untuk memerintah [FROM.GetNameDef] telah digagalkan oleh sikap keras kepala dan kebodohan pemerintah Denmark dan rakyatnya! Mendirikan pemerintahan yang setia pada perjuangan kita akan memperketat cengkeraman kita terhadap negara ini dan mendekatkan mereka kepada kita."
 denmark_overlord_events.42.a: "Kami tidak akan memperpanjang masalah ini"
 denmark_overlord_events.42.b: "Perubahan jarang terjadi dengan sukarela"
 denmark_overlord_events.43.t: "[FROM.GetNameDefCap] Memaksakan Pemerintahan Yang Berkuasa Penuh"
 denmark_overlord_events.43.desc: "[FROM.GetNameDefCap] sekali lagi menunjukkan bahwa mereka tidak dapat dipercaya dan berupaya mengakhiri kemerdekaan Denmark. [FROM.GetLeader] telah mengabaikan penolakan kami untuk membiarkan penguasa penuh mengambil alih pemerintahan kami dan tetap menunjuknya."
 denmark_overlord_events.43.a: "Kami tidak berani melanjutkan masalah ini"
 denmark_overlord_events.43.b: "Kami akan berjuang untuk kebebasan kami!"
 denmark_overlord_events.44.t: "[FROM.GetNameDefCap] berupaya mencaplok Jutlandia!"
 denmark_overlord_events.44.desc: "Kami baru saja mengungkap rencana [FROM.GetAdjective] yang keterlaluan untuk mencaplok seluruh Jutlandia. Ini tidak akan bertahan!"
 denmark_overlord_events.45.t: "[FROM.GetNameDefCap] menyerahkan Jutlandia"
 denmark_overlord_events.45.desc: "Tawaran kami untuk mengambil alih perlindungan Jutland rupanya mematahkan sesuatu di dalam [FROM.GetLeader], saat dia merosot ke kursinya setelah menerima permintaan kami dan hanya menganggukkan kepalanya."
 denmark_overlord_events.46.t: "[FROM.GetNameDefCap] menolak menyerahkan Jutlandia"
 denmark_overlord_events.46.desc: "Permintaan kami untuk mengambil alih perlindungan Jutlandia tampaknya membuat [FROM.GetLeader] marah sebelum menolak proposal murah hati kami."
 denmark_overlord_events.46.b: "Ambil saja"
 denmark_overlord_events.47.t: "[FROM.GetNameDefCap] mengklaim sisa tanah kami!"
 denmark_overlord_events.47.desc: "Delegasi dari [FROM.GetCapitalVictoryPointName] telah tiba, menyerahkan pernyataan resmi bahwa seluruh [ROOT.GetNameDef] akan secara resmi dimasukkan ke dalam lingkup [FROM.GetNameDef] yang lebih besar."
 denmark_overlord_events.48.t: "[FROM.GetNameDefCap] Menolak Aneksasi"
 denmark_overlord_events.48.desc: "[FROM.GetLeader] telah mengirimi kami telegram pendek dengan satu kata di dalamnya - 'tidak pernah'. Tampaknya mereka tidak menginginkan perlindungan penuh dari kita."
 denmark_overlord_events.48.b: "Kekuatan lemah mereka tidak sebanding dengan kita!"
 #Rearmament Events
 denmark_protection_event.1.t: "[FROM.GetNameDefCap] Menawarkan Pakta Non-Agresi"
 denmark_protection_event.1.desc: "Pagi ini kami menerima utusan dari pemerintah [FROM.GetAdjective] dengan tawaran untuk menandatangani pakta non-agresi dengan mereka. Memilih untuk menandatangani perjanjian ini berarti mengembangkan kemitraan yang lebih erat dengan [FROM.GetAdjective]."
 denmark_protection_event.1.a: "Kami akan menandatangani perjanjian itu."
 denmark_protection_event.1.b: "Ini bukan kepentingan terbaik kami saat ini."
 denmark_protection_event.2.t: "[FROM.GetNameDefCap] telah Menandatangani Pakta Non-Agresi"
 denmark_protection_event.2.desc: "Utusan yang kami kirim ke [FROM.GetNameDef] telah kembali dengan membawa kabar baik! Pemerintah [FROM.GetAdjective] telah memutuskan untuk menandatangani perjanjian kami dan sekarang kami berdua telah menandatangani perjanjian non-agresi. Ini adalah hari yang luar biasa bagi kedua negara kita."
 denmark_protection_event.2.a: "Fantastis!"
 denmark_protection_event.3.t: "[FROM.GetNameDefCap] telah Menolak Pakta Non-Agresi"
 denmark_protection_event.3.desc: "Utusan yang kami kirimkan ke [FROM.GetNameDef] telah kembali dengan membawa kabar buruk. Pemerintah [FROM.GetAdjective] telah memutuskan bahwa pakta non-agresi bukanlah kepentingan terbaik mereka saat ini. Hal ini sangat disayangkan, namun kami tidak dapat melakukan apa pun untuk meyakinkan mereka."
 denmark_protection_event.3.a: "Buang-buang waktu..."
 denmark_protection_event.4.t: "[FROM.GetNameDefCap] Menawarkan Perjanjian Dagang"
 denmark_protection_event.4.desc: "Kami telah menerima kabar dari [FROM.GetNameDef] bahwa mereka ingin meningkatkan perdagangan antara kedua negara kami. Dengan melakukan hal ini, kami pasti akan mengembangkan hubungan yang lebih dekat dengan [FROM.GetAdjective]."
 denmark_protection_event.4.a: "Peningkatan perdagangan akan menguntungkan kita berdua."
 denmark_protection_event.4.b: "Kami tidak memerlukan hal ini."
 denmark_protection_event.5.t: "[FROM.GetNameDefCap] Menerima Kesepakatan Dagang"
 denmark_protection_event.5.desc: "Kesepakatan yang kami kirimkan ke pemerintah [FROM.GetAdjective] telah diterima! Kami sekarang akan memulai persiapan untuk menerapkan perjanjian perdagangan baru ini."
 denmark_protection_event.5.a: "Mulailah menyusun persyaratannya!"
 denmark_protection_event.6.t: "[FROM.GetNameDefCap] Menolak Kesepakatan Dagang"
 denmark_protection_event.6.desc: "Sayangnya tawaran kami untuk meningkatkan perdagangan ditolak oleh [FROM.GetNameDef] meskipun kami telah berupaya sebaik mungkin. Tampaknya kami harus menerima tawaran kami di tempat lain."
 denmark_protection_event.6.a: "Sangat disayangkan."
 denmark_protection_event.7.t: "[FROM.GetNameDefCap] Menawarkan Perjanjian Penelitian"
 denmark_protection_event.7.desc: "Tawaran telah datang dari [FROM.GetNameDef] bagi kedua negara kita untuk bergabung dalam perjanjian penelitian. Melakukan hal ini berarti kita saling berbagi kemajuan teknologi. Bagaimana kita harus melanjutkannya?"
 denmark_protection_event.7.a: "Tanda tangani perjanjiannya!"
 denmark_protection_event.7.b: "Kami tidak punya waktu untuk ini."
 denmark_protection_event.8.t: "[FROM.GetNameDefCap] Menerima Perjanjian Penelitian"
 denmark_protection_event.8.desc: "Pagi ini kami menerima kabar dari [FROM.GetNameDef] bahwa mereka telah memutuskan untuk menerima kesepakatan penelitian bersama. Ini adalah berita bagus dan berarti bahwa kemajuan teknologi kita akan semakin cepat mulai saat ini."
 denmark_protection_event.8.a: "Tolong!"
 denmark_protection_event.9.t: "[FROM.GetNameDefCap] Menolak Perjanjian Penelitian"
 denmark_protection_event.9.desc: "Pagi ini kami menerima kabar dari [FROM.GetNameDef] bahwa mereka telah memutuskan untuk menolak kesepakatan penelitian bersama kami. Sayangnya hal ini berarti kami tidak akan mendapatkan manfaat dari pembagian teknologi apa pun dengan pemerintah [FROM.GetAdjective]."
 denmark_protection_event.9.a: "Mengecewakan."
 denmark_protection_event.10.t: "[FROM.GetNameDefCap] Penawaran untuk Menjual Wilayah"
 denmark_protection_event.10.desc: "Dalam upaya mendapatkan jaminan, [FROM.GetNameDef] telah menawarkan untuk menjual sebagian wilayahnya kepada kami. Ini adalah tawaran yang bagus dan kami harus mempertimbangkan dengan hati-hati bagaimana kami harus melanjutkan kesepakatan ini."
 denmark_protection_event.10.a: "Terima kesepakatannya."
 denmark_protection_event.10.b: "Kami tidak membutuhkan ini."
 denmark_protection_event.11.t: "[FROM.GetNameDefCap] Menerima Tawaran kami untuk Menjual Wilayah"
 denmark_protection_event.11.desc: "Berita bagus! [FROM.GetNameDefCap] telah menerima tawaran kami untuk menjual wilayah sebagai jaminan. Kita harus melakukan yang terbaik untuk mempertahankan kesepakatan kita dan bersiap untuk mengalihkan kepemilikan akta tersebut ke atas nama pemerintah [FROM.GetAdjective]."
 denmark_protection_event.11.a: "Tolong!"
 denmark_protection_event.12.t: "[FROM.GetNameDefCap] Menolak Tawaran kami untuk Menjual Wilayah"
 denmark_protection_event.12.desc: "Tampaknya tawaran kami untuk menjual wilayah ke [FROM.GetNameDef] ditolak. Mungkin lain kali kita harus mempermanis kesepakatan agar negosiasi kita berhasil."
 denmark_protection_event.12.a: "Kerugian mereka."
 denmark_protection_event.100.t: "[FROM.GetNameDefCap] Mencari Aliansi"
 denmark_protection_event.100.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mendekati kita dengan tawaran untuk bergabung, mengklaim bahwa jika kita berdiri bersama, kita bahkan dapat menyaingi kekuatan-kekuatan besar di dunia. Bagaimana menurut kita?"
 denmark_protection_event.100.a: "Baiklah, kami terima"
 denmark_protection_event.100.b: "Ada yang berbau amis"
 denmark_protection_event.101.t: "[FROM.GetNameDefCap] Menerima Proposal kami"
 denmark_protection_event.101.desc: "Para diplomat yang mewakili [FROM.GetLeader] telah menyampaikan kepada kami tanggapan [FROM.GetNameDef] terhadap proposal aliansi kami baru-baru ini. Mereka menyatakan bahwa sudah jelas bahwa jika kita tidak memperkuat pertahanan dan bekerja sama, kita berdua akan kalah ketika gelombang perang mencapai kita."
 denmark_protection_event.101.a: "Mereka membuat pilihan yang tepat"
 denmark_protection_event.102.t: "[FROM.GetNameDefCap] Menolak Proposal kami"
 denmark_protection_event.102.desc: "Para diplomat yang mewakili [FROM.GetLeader] telah menyampaikan kepada kami tanggapan [FROM.GetNameDef] terhadap proposal aliansi kami baru-baru ini. Mereka menyatakan bahwa jelas bahwa jika mereka bergabung dengan kami, kami akan berupaya secara tidak adil untuk mempengaruhi politik mereka, dan bahwa mereka tidak akan mendapatkan keuntungan apa pun dari usulan ini, sehingga menolak usulan kami."
 denmark_protection_event.102.a: "Mereka tidak menyadari bahwa tindakan mereka mempunyai konsekuensi"
 denmark_protection_event.110.t: "Latihan Angkatan Darat Bersama [ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.110.desc: "Para diplomat [FROM.GetAdjective] telah menghubungi kami dengan permintaan untuk mengadakan latihan militer bersama [ROOT.GetAdjective]-[FROM.GetAdjective] agar [DEN.GetNameDef] dapat lebih mempersiapkan diri menghadapi masa depan, dan untuk memperkuat kerja sama antara kedua negara."
 denmark_protection_event.110.a: "Ini menjadi lebih baik"
 denmark_protection_event.110.b: "Kami tidak punya waktu untuk ini"
 denmark_protection_event.111.t: "Latihan Angkatan Darat Bersama [ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.111.desc: "[FROM.GetNameDefCap] telah menerima proposal kami untuk mengadakan latihan militer [ROOT.GetAdjective]-[FROM.GetAdjective], dan selanjutnya, kami berdua menjadi lebih kuat."
 denmark_protection_event.111.a: "Sempurna!"
 denmark_protection_event.112.t: "Tidak akan ada Latihan [ROOT.GetAdjective]-[FROM.GetAdjective]"
 denmark_protection_event.112.desc: "[FROM.GetNameDefCap] telah menghancurkan harapan kami, dan menggagalkan latihan militer bersama [ROOT.GetAdjective]-[FROM.GetAdjective] kami. Mereka menganggap kami terlalu tidak penting untuk menghabiskan lebih banyak waktu dan upaya..."
 denmark_protection_event.112.a: "Itu kerugian mereka"
 denmark_protection_event.120.t: "[FROM.GetLeader] Harapan untuk Berbagi Teknologi"
 denmark_protection_event.120.desc: "[FROM.GetNameDefCap] mungkin tertinggal di banyak departemen dibandingkan departemen lain, namun di bidang tertentu, mereka unggul. Mereka mengklaim bahwa kerja sama yang lebih besar antara laboratorium kita dapat menghasilkan terobosan yang bermanfaat bagi kedua belah pihak. Apakah kita menerimanya?"
 denmark_protection_event.120.a: "Seorang inisiat yang hebat!"
 denmark_protection_event.120.b: "Mereka ingin melepaskan kita"
 denmark_protection_event.121.t: "[FROM.GetName] Terima Berbagi Teknologi"
 denmark_protection_event.121.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] yang berterima kasih telah dengan senang hati menerima permintaan kami untuk berbagi teknologi, dan para ilmuwan kami telah mulai mengoordinasikan upaya mereka."
 denmark_protection_event.121.a: "Kita lebih kuat bersama-sama"
 denmark_protection_event.122.t: "[FROM.GetName] Menolak Berbagi Teknologi"
 denmark_protection_event.122.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] yang tidak tahu berterima kasih telah menolak tawaran kami untuk berbagi teknologi, dengan menyatakan bahwa mereka tidak akan memperoleh apa pun dari pertukaran tersebut, dan bahwa kami hanya ingin memanfaatkan keahlian ilmiah mereka."
 denmark_protection_event.122.a: "Baiklah Kalau begitu, Jaga Rahasiamu"
 denmark_protection_event.130.t: "[FROM.GetNameDefCap] Undang kami ke Aliansi mereka"
 denmark_protection_event.130.desc: "[FROM.GetAdjective] diplomat mendekati kami dengan tawaran menarik. Mereka mengklaim bahwa kita bisa bergabung dalam sebuah faksi bersama-sama, sehingga menegakkan perdamaian dan saling melindungi, dan memastikan tidak ada kerugian yang menimpa kita semua. Apa yang kita katakan?"
 denmark_protection_event.130.a: "Kami akan berdiri bersama"
 denmark_protection_event.130.b: "Kami berjalan di jalan yang sepi"
 denmark_protection_event.131.t: "[FROM.GetNameDefCap] Bergabung dengan Fraksi kami"
 denmark_protection_event.131.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima permintaan kami untuk bergabung bersama dalam sebuah faksi, dan siap membantu kami jika kami membutuhkannya, asalkan kami melakukan hal yang sama untuk mereka pada saat dibutuhkan."
 denmark_protection_event.131.a: "Sempurna!"
 denmark_protection_event.132.t: "[FROM.GetNameDefCap] Tidak Bergabung dengan Fraksi kami"
 denmark_protection_event.132.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak tawaran kami untuk bergabung dengan faksi kami, dengan menyatakan bahwa mereka hanya mendapat sedikit keuntungan dari berurusan dengan iblis seperti itu. Mereka mengacaukan stabilitas kawasan, dan harus segera ditangani!"
 denmark_protection_event.132.a: "Ya, itu kerugian mereka"
 denmark_protection_event.200.t: "Latihan Angkatan Darat"
 denmark_protection_event.200.desc: "Dalam menghadapi perang, penting untuk mempersiapkan tentara menghadapi apa pun yang akan menimpa mereka. Dengan melakukan latihan ini, pasukan kita akan lebih dari siap untuk mempertahankan perbatasan [DEN.GetNameDef] kapanpun dibutuhkan."
 denmark_protection_event.200.a: "Tolong!"
 denmark_protection_event.201.t: "Latihan Angkatan Laut"
 denmark_protection_event.201.desc: "Dalam menghadapi perang, penting untuk mempersiapkan angkatan laut menghadapi apa pun yang akan menimpa mereka. Dengan melakukan latihan ini, para pelaut kita akan lebih dari siap untuk mempertahankan perairan [DEN.GetNameDef] kapanpun dibutuhkan."
 denmark_protection_event.201.a: "Tolong!"
 denmark_protection_event.202.t: "Latihan Angkatan Udara"
 denmark_protection_event.202.desc: "Dalam menghadapi perang, penting untuk mempersiapkan angkatan udara menghadapi apa pun yang akan menimpa mereka. Dengan melakukan latihan ini, pilot kami akan lebih dari siap untuk mempertahankan langit [DEN.GetNameDef] kapan pun diperlukan."
 denmark_protection_event.202.a: "Tolong!"
 #Conquest Events
 denmark_expansion_event.1.t: "[FROM.GetNameDefCap] Menuntut Aneksasi Kami"
 denmark_expansion_event.1.desc: "Pemerintah [DEN.GetAdjective] telah mengirimkan ultimatum kepada kami yang menuntut agar [ICE.GetNameDef] tunduk kepada mereka dan dimasukkan ke dalam kelompok negaranya. Kita harus berhati-hati, karena tanggapan kita dapat menentukan masa depan [ICE.GetNameDefCap] sebagai negara berdaulat, atau yang paling buruk, mendekatkan kita pada perang."
 denmark_expansion_event.1.a: "Kami tidak punya pilihan selain menerima."
 denmark_expansion_event.1.b: "Kami tidak bisa tunduk pada Denmark!"
 denmark_expansion_event.2.t: "[FROM.GetNameDefCap] Menerima Usulan Reintegrasi Kami"
 denmark_expansion_event.2.desc: "Pagi ini kami menerima kabar bahwa pemerintah [ICE.GetAdjective] telah dengan baik hati menerima usulan kami untuk mengintegrasikan kembali wilayah mereka ke [DEN.GetNameDefCap]. Hal ini akan membantu kedua negara kita berdiri lebih kuat bersama-sama melawan musuh-musuh kita."
 denmark_expansion_event.2.a: "Senang mereka bisa melihat alasannya."
 denmark_expansion_event.3.t: "[FROM.GetNameDefCap] Menolak Usulan Reintegrasi Kami"
 denmark_expansion_event.3.desc: "Sayangnya tampaknya pemerintah [ICE.GetAdjective] menolak usulan reintegrasi kami. Sebuah keputusan yang bodoh, tapi ini tidak akan menghentikan kami untuk menggunakan hak kami atas pulau itu."
 denmark_expansion_event.3.a: "Untuk berperang..."
 denmark_expansion_event.4.t: "[FROM.GetNameDefCap] Tuntutan [ICE.GetNameDef]"
 denmark_expansion_event.4.desc: "Pagi ini, kami menerima kabar bahwa pemerintah [DEN.GetAdjective] ingin kami mengalihkan kepemilikan [ICE.GetNameDef] kepada mereka. Menurut mereka, wilayah kepulauan ini merupakan hak milik mereka."
 denmark_expansion_event.4.a: "Ini menyenangkan."
 denmark_expansion_event.4.b: "Tidak dapat diterima."
 denmark_expansion_event.5.t: "[FROM.GetNameDefCap] Menerima Permintaan Kami untuk [ICE.GetNameDef]"
 denmark_expansion_event.5.desc: "Tampaknya [FROM.GetNameDefCap] telah menerima tuntutan kami yang dapat dimengerti untuk mengendalikan [ICE.GetNameDef]. Sungguh membesarkan hati melihat negara-negara lain bertindak secara wajar."
 denmark_expansion_event.5.a: "Klaim [DEN.GetAdjective] adalah mutlak!"
 denmark_expansion_event.6.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami untuk [ICE.GetNameDef]"
 denmark_expansion_event.6.desc: "Sulit dipercaya bahwa [FROM.GetNameDef] menolak tuntutan kami! Kami berhak mengklaim pulau itu dan jika pulau itu tidak ingin diserahkan kepada kami secara damai, maka kami harus merebutnya dengan paksa!"
 denmark_expansion_event.6.a: "Kumpulkan kekuatan kita!"
 denmark_expansion_event.10.t: "[FROM.GetNameDefCap] Menuntut Penaklukan Kita"
 denmark_expansion_event.10.desc: "Tampaknya pemerintah [DEN.GetAdjective] sangat ingin menekan kita. 'Usulan' mereka menuntut agar kita tunduk sepenuhnya pada aturan mereka berdasarkan perolehan sumber daya. Jika kita ingin menghindari pertumpahan darah, mungkin kita harus tunduk, jika tidak, mereka mungkin menyatakan perang terhadap kita."
 denmark_expansion_event.10.a: "Kita tidak boleh terseret ke dalam perang dengan tetangga kita."
 denmark_expansion_event.10.b: "[DEN.GetNameDefCap] tidak mempunyai hak atas tanah kami."
 denmark_expansion_event.11.t: "[FROM.GetNameDefCap] Menerima Proposal Penaklukan Kami"
 denmark_expansion_event.11.desc: "Berita bagus! Tampaknya [SWE.GetNameDef] memahami bahwa sumber daya mereka sebaiknya dibagikan kepada kami. Setidaknya sekarang, negara mereka dapat dilindungi oleh kekuatan militer modern kita yang baru!"
 denmark_expansion_event.11.a: "[DEN.GetNameDefCap] akan tumbuh lebih besar!"
 denmark_expansion_event.12.t: "[FROM.GetNameDefCap] Menolak Usulan Penaklukan Kami"
 denmark_expansion_event.12.desc: "Orang-orang bodoh di pemerintahan [SWE.GetAdjective] telah memutuskan untuk menolak usulan penaklukan kami yang masuk akal! Nah, jika mereka tidak mau memberi kita sumber dayanya, maka kita harus mengambilnya sendiri."
 denmark_expansion_event.12.a: "Bersiaplah untuk mengarungi selat!"
 denmark_expansion_event.13.t: "[FROM.GetNameDefCap] Tuntutan [SWE.GetNameDef]"
 denmark_expansion_event.13.desc: "Pagi ini kami menerima permintaan dari pemerintah [DEN.GetAdjective] yang meminta agar kami menyerahkan [SWE.GetNameDef] ke dalam kendali mereka. Kami memiliki kesetiaan kepada [DEN.GetNameDef] karena ikatan kekeluargaan antara raja kami, namun kami harus mempertimbangkan bahwa penolakan dapat menyebabkan perang dengan [DEN.GetNameDef] terlepas dari hubungan darah."
 denmark_expansion_event.13.a: "Jangan sampai kita membuat mereka marah."
 denmark_expansion_event.13.b: "[SWE.GetNameDefCap] berada di bawah perlindungan kami!"
 denmark_expansion_event.14.t: "[FROM.GetNameDefCap] Menerima Permintaan Kami untuk [SWE.GetNameDef]"
 denmark_expansion_event.14.desc: "[NOR.GetAdjective] masuk akal dan telah memenuhi tuntutan kami. [SWE.GetNameDefCap] adalah milik kita dan sumber daya mereka sekarang dapat dieksploitasi untuk mendanai militer baru kita."
 denmark_expansion_event.14.a: "[SWE.GetAdjective] logam untuk [DEN.GetAdjective] pengecoran."
 denmark_expansion_event.15.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami untuk [SWE.GetNameDef]"
 denmark_expansion_event.15.desc: "[NOR.GetNameDefCap] telah memutuskan untuk menolak tuntutan kami untuk aneksasi [SWE.GetAdjective]. Hal ini sangat mengecewakan, namun kita tidak boleh membiarkan hal ini menghalangi kita untuk mengklaim sumber daya tersebut secara sah."
 denmark_expansion_event.15.a: "Memang benar perang."
 denmark_expansion_event.20.desc: "Berita suram dari selatan ketika [DEN.GetNameDef] menuntut penaklukan [NOR.GetNameDefCap] dan agar kita kembali berada di bawah pemerintahan [DEN.GetAdjective] untuk pertama kalinya sejak tahun 1814. Kita mungkin telah berjuang keras untuk memperoleh kemerdekaan dari Swedia, tetapi apakah kita benar-benar siap untuk berdiri dan melawan Denmark?"
 denmark_expansion_event.20.a: "Kami tidak punya pilihan selain bertekuk lutut."
 denmark_expansion_event.20.b: "Kami tidak akan pernah diperintah oleh negara lain lagi!"
 denmark_expansion_event.21.desc: "[NOR.GetNameDefCap] telah dengan bijak menerima usulan kami untuk diduduki oleh pasukan kami. Dengan amannya wilayah di utara, kami sekarang dapat fokus memperluas perbatasan kami di tempat lain."
 denmark_expansion_event.21.a: "Front Utara aman."
 denmark_expansion_event.22.desc: "[NOR.GetAdjective] telah menolak tawaran aneksasi kami dengan dalih mengamankan kedaulatan mereka. Alasan ini tidak akan menghalangi kita melakukan apa yang perlu kita lakukan."
 denmark_expansion_event.22.a: "[NOR.GetNameDefCap] akan menjadi [DEN.GetAdjective] sekali lagi!"
 denmark_expansion_event.23.t: "[FROM.GetNameDefCap] Tuntutan [NOR.GetNameDef]"
 denmark_expansion_event.23.desc: "Sebagai penghuni [NOR.GetNameDef] saat ini, hanya masalah waktu sampai [DEN.GetNameDef] mulai memenuhi tuntutan atas tanah tersebut. Mereka mengklaim bahwa [NOR.GetNameDef] secara teknis adalah wilayah [DEN.GetAdjective]. Kita punya pilihan: Biarkan Denmark memiliki [NOR.GetNameDef] atau menolak tuntutan mereka dan bersiap menghadapi kemungkinan perang."
 denmark_expansion_event.23.a: "Kami tidak berselisih dengan [DEN.GetNameDef]. Biarkan mereka memilikinya."
 denmark_expansion_event.23.b: "[NOR.GetNameDefCap] milik kami!"
 denmark_expansion_event.24.t: "[FROM.GetNameDefCap] Menerima Permintaan Kami untuk [NOR.GetNameDef]"
 denmark_expansion_event.24.desc: "Tampaknya pemerintah [SWE.GetAdjective] masuk akal! Mereka telah setuju untuk menyerahkan kepemilikan [NOR.GetNameDef] kepada kami. Kami senang mendengar bahwa mereka juga melihat kami sebagai penguasa yang sah atas negeri tersebut."
 denmark_expansion_event.24.a: "Luar biasa."
 denmark_expansion_event.25.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami untuk [NOR.GetNameDef]"
 denmark_expansion_event.25.desc: "Sayangnya, [SWE.GetNameDef] menolak memenuhi tuntutan kami atas kepemilikan atas [NOR.GetNameDef]. Hal ini sangat mengecewakan, terutama karena kita telah menyerahkan negara ini ke dalam kendali mereka di masa lalu. Kami berharap mereka akan membalas budi."
 denmark_expansion_event.25.a: "Sayangnya, ini perang."
 denmark_expansion_event.100.t: "[FROM.GetNameDefCap] telah Memulai Proses Integrasi"
 denmark_expansion_event.100.desc: "[DEN.GetLeader], telah memberi tahu kami bahwa dia telah memulai proses untuk benar-benar mengintegrasikan negara kami ke dalam wilayah [DEN.GetAdjective] yang lebih luas."
 denmark_expansion_event.100.a: "Kami tidak punya pilihan selain membiarkan hal ini."
 denmark_expansion_event.200.t: "[FROM.GetNameDefCap] Menuntut Harta [ICE.GetAdjective] Kita"
 denmark_expansion_event.200.desc: "[DEN.GetNameDefCap] tampaknya mendapat kesan bahwa mereka memiliki klaim historis atas wilayah [ICE.GetAdjective] kami. Jika kita memperdulikan hal ini, maka kita akan berisiko kehilangan wilayah kita karena ekspansionisme [DEN.GetAdjective]. Jika kita menolak, maka yang terjadi adalah perang habis-habisan."
 denmark_expansion_event.200.a: "Kita harus menuruti tuntutan mereka..."
 denmark_expansion_event.200.b: "[ROOT.GetNameDefCap] tidak akan pernah menyerah pada Denmark!"
 denmark_expansion_event.201.t: "[FROM.GetNameDefCap] Menerima Klaim [ICE.GetAdjective] Kami"
 denmark_expansion_event.201.desc: "[FROM.GetNameDefCap] telah mengambil keputusan bijak dengan menerima klaim sah kami atas wilayah mereka. Sebuah langkah cerdas dari pemerintah mereka, tentu saja."
 denmark_expansion_event.201.a: "Negosiasinya singkat."
 denmark_expansion_event.202.t: "[FROM.GetNameDefCap] Menolak Klaim [ICE.GetAdjective] Kami"
 denmark_expansion_event.202.desc: "Sayangnya bagi mereka, pemerintah [FROM.GetAdjective] telah membantah klaim kami. Tampaknya kita tidak punya pilihan selain melancarkan perang di depan pintu mereka demi mengamankan apa yang menjadi hak [DEN.GetAdjective]."
 denmark_expansion_event.202.a: "Mungkin agresi akan membuat mereka lebih menyenangkan."
 denmark_expansion_event.210.t: "[FROM.GetNameDefCap] Menuntut Harta [SWE.GetAdjective] Kita"
 denmark_expansion_event.210.desc: "[DEN.GetNameDefCap] tampaknya mendapat kesan bahwa mereka memiliki klaim historis atas wilayah [SWE.GetAdjective] kami. Jika kita memperdulikan hal ini, maka kita akan berisiko kehilangan wilayah kita karena ekspansionisme [DEN.GetAdjective]. Jika kita menolak, maka yang terjadi adalah perang habis-habisan."
