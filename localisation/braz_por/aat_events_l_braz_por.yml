 ### MIO EVENTS ###
 AAT_MIO_events.2.t: "$CZE_skoda_works$ Investasi"
 AAT_MIO_events.2.desc: "Para industrialis di $CZE_skoda_works$ sangat ingin berinvestasi, namun kami hanya mampu memasukkan uang ke salah satu dari tiga cabang dalam perusahaan. Hal ini akan memungkinkan mereka untuk memprioritaskan pengembangan kapal, tank, atau peralatan artileri."
 AAT_MIO_events.2.a: "Berinvestasi di $CZE_skoda_shipyards$"
 AAT_MIO_events.2.b: "Berinvestasi di $CZE_skoda_armor$"
 AAT_MIO_events.2.c: "Berinvestasi di $CZE_skoda_artillery$"
 ######################
 ### AMERICA EVENTS ###
 ######################
 AAT_USA_events.01.t: "[USA.GetNameDefCap] Menempati Greenland"
 AAT_USA_events.01.desc: "Pemerintah [USA.GetAdjective] yang dipimpin oleh [USA.GetLeader] telah mengumumkan pendudukan Greenland sebagai bagian dari Patroli Greenland baru mereka, sebuah operasi untuk mengamankan Amerika Utara dari ancaman dan pengaruh asing sebagaimana diputuskan dalam Konferensi Havana. Mereka telah berjanji untuk mengembalikannya kepada kami setelah situasi di dunia sudah tenang."
 AAT_USA_events.01.a: "Setidaknya mereka akan mengembalikannya nanti..."
 AAT_USA_events.02.t: "[FROM.GetNameDefCap] Menempati Faroe"
 AAT_USA_events.02.desc: "[FROM.GetAdjective] telah menyatakan bahwa mereka saat ini sedang menduduki Kepulauan Faroe, milik Denmark dan merupakan titik strategis yang sangat penting. Mereka mengklaim bahwa mereka akan melindungi Kepulauan Faroe dari segala parahnya perang dan menempatkan diri mereka di sana dengan nyaman melalui laut dan udara sampai saatnya tiba ketika pulau-pulau tersebut akan diserahkan kembali kepada kita, terbebas dari perbudakan busuk yang telah menjerumuskan mereka ke dalam agresi [?DEN.DEN_overlord_nation.GetAdjective]."
 AAT_USA_events.02.a: "Setidaknya rakyat kita berada di tangan yang aman..."
 AAT_USA_events.03.t: "[FROM.GetName] Ingin Faroe Kembali"
 AAT_USA_events.03.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyerukan kepada kita untuk menepati janji kita dan sesuai kesepakatan mengembalikan Kepulauan Faroe kepada mereka, setelah mereka sekali lagi bebas dari penindasan."
 AAT_USA_events.03.a: "Kami berjanji"
 AAT_USA_events.03.b: "Sebenarnya, kami telah berubah pikiran"
 AAT_USA_events.04.t: "[FROM.GetName] Menolak Tuntutan kami"
 AAT_USA_events.04.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kami, dengan menyatakan bahwa setelah referendum, masyarakat Kepulauan Faroe jelas tidak ingin berada di bawah kekuasaan lain selain [FROM.getAdjective]."
 AAT_USA_events.04.a: "Lagipula kita tidak bisa menantang mereka"
 AAT_USA_events.04.b: "Mereka sudah mendapatkannya"
 AAT_USA_events.05.t: "[FROM.GetName] Ingin Greenland Kembali"
 AAT_USA_events.05.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] menyerukan kepada kita untuk menepati janji-janji kita dan sebagaimana disepakati, mengembalikan Greenland kepada mereka, setelah mereka sekali lagi bebas dari penindasan."
 AAT_USA_events.06.t: "[FROM.GetName] Menolak Tuntutan kami"
 AAT_USA_events.06.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menolak permintaan kami, mengklaim bahwa setelah referendum, rakyat Greenland jelas tidak ingin berada di bawah kekuasaan lain selain [FROM.getAdjective]."
 AAT_USA_events.07.t: "[FROM.GetName] Mengembalikan Wilayah"
 AAT_USA_events.07.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menepati janji mereka dan setuju untuk mengembalikan wilayah yang mereka pegang untuk dijaga dengan aman, karena sekarang kita sekali lagi bebas dari penindasan."
 AAT_USA_events.07.a: "Greenland Kembali!"
 AAT_USA_events.07.b: "Kepulauan Faroe Kembali!"
 AAT_USA_events.08.t: "[FROM.GetNameDefCap] Meminta Wilayah Denmark"
 AAT_USA_events.08.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengirimkan kepada kami permintaan untuk mengembalikan wilayah Denmark yang dikuasai secara tidak sah kepada pemiliknya yang sah."
 AAT_USA_events.08.a: "Kembalikan wilayahnya"
 AAT_USA_events.08.b: "Kami tidak akan menyerah pada penindas!"
 AAT_USA_events.09.t: "[FROM.GetNameDefCap] Mengembalikan Wilayah Denmark"
 AAT_USA_events.09.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah setuju untuk mengembalikan wilayah Denmark yang dikuasai secara tidak sah kepada pemiliknya yang sah."
 AAT_USA_events.09.a: "Sungguh bijaksana"
