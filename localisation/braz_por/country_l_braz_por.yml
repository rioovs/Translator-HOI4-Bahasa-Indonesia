 AIR_EXPERIENCE_DESC: "Ketika pesawat Anda menghadapi musuh dalam misi atau berlatih dalam §HLatihan Pilot§!, Anda memperoleh Pengalaman Angkatan Udara. Ini berarti Anda dapat memperoleh Pengalaman Angkatan Udara ketika §HSayap Udara§! Anda terlibat dalam pertempuran atau jika Anda memberikan perlengkapan §HLend-Lease§! untuk perang sekutu Anda.\n§HFokus Nasional§! tertentu memberikan pengalaman tambahan dan beberapa §HMenteri§! dapat meningkatkan pengalaman yang diperoleh.\n\nPengalaman Angkatan Udara digunakan untuk mengembangkan varian yang lebih baik dari pesawat yang ada, merancang pesawat baru, serta membuka §HDoktrin§!."
