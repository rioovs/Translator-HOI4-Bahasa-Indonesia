 ARMY_EXPERIENCE_DESC: "Saat perlengkapan Anda digunakan dalam pertempuran, Anda memperoleh Pengalaman Angkatan Darat. Ini berarti Anda dapat memperoleh Pengalaman Angkatan Darat ketika §HDivisi§! Anda terlibat dalam pertempuran atau jika Anda memberikan perlengkapan §HLend-Lease§! untuk perang sekutu Anda.\nAnda juga memperoleh pengalaman dari melakukan §HLatihan Angkatan Darat§! dengan pasukan yang setidaknya berada pada tingkat $UNIT_TRAINING_LEVEL|Y$, serta dari §HFokus Nasional§! tertentu. Beberapa §HMenteri§! dapat meningkatkan pengalaman yang diperoleh.\n\nPengalaman Angkatan Darat diperlukan untuk membuat dan mengubah §HTemplat Divisi§! Anda serta membuka §HDoktrin§!."
