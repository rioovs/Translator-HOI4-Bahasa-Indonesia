  # Democratic Path
 CHI_end_military_primacy: "Akhiri Keutamaan Militer"
 CHI_end_military_primacy_desc: "Militer telah mencapai tujuannya, namun cengkeramannya pada kekuasaan harus dipatahkan. Otoritas sipil harus dipulihkan jika [ROOT.GetName] ingin menjadi negara yang diatur berdasarkan hukum, bukan oleh jenderal."
 CHI_accelerate_the_tutelage: "Mempercepat Pengawasan"
 CHI_accelerate_the_tutelage_desc: "KMT telah gagal memenuhi janji-janji revolusi Xinhai dan kemudian Dr. Sun. Alih-alih mengajarkan masyarakat tentang demokrasi, mereka malah mengeksploitasinya demi keuntungan pribadi. Kita perlu mengganti waktu yang hilang."
 CHI_accelerate_the_tutelage_tt: "Membuka keputusan untuk §YMempercepat Pengawasan Politik§! masyarakat di seluruh §YPedesaan Tiongkok§!"
 CHI_revive_the_new_culture_movement: "Menghidupkan Kembali Gerakan Kebudayaan Baru"
 CHI_revive_the_new_culture_movement_desc: "Sebagian besar kaum revolusioner awal di dalam PKT dan KMT terinspirasi oleh Gerakan Kebudayaan Baru yang menentang Dinasti Qing dan Yuan Shikai. Hanya melalui semangat Gerakan Kebudayaan Baru Tiongkok baru akan bangkit dari abu masa lalu!"
 CHI_revive_the_chinese_action_committee: "Menghidupkan kembali Komite Aksi Tiongkok"
 CHI_revive_the_chinese_action_committee_desc: "KMT telah memonopoli akses terhadap tentara dan menarik kekuasaan ke kelompok kecil. Namun, beberapa penentang militer yang berpengalaman tidak setuju dengan kelompok yang berkuasa, meskipun mereka juga tidak mendukung Komunis."
 CHI_revive_the_chinese_action_committee_tt: "§Y$CHI_jiang_guangnai$§!, §Y$CHI_cai_tingkai$§! dan §Y$CHI_chen_mingshu$§! akan tersedia sebagai §YJenderal§!"
 CHI_ally_the_young_china_party: "Sekutu Partai Muda Tiongkok"
 CHI_ally_the_young_china_party_desc: "Partai Muda Tiongkok didirikan oleh sekelompok mahasiswa Tiongkok di Paris pada tanggal 2 Desember 1923, dan merupakan gerakan kecil yang paling menonjol di negara tersebut setelah KMT dan PKT. Mereka telah membayangkan ide-ide bagus untuk masa depan kita, ide-ide yang tidak bisa kita abaikan begitu saja. Kita harus segera bersekutu dengan mereka!"
 CHI_invite_carsun_chang: "Undang Carsun Chang"
 CHI_invite_carsun_chang_desc: "Meskipun negara-negara Barat telah merugikan kepentingan [ROOT.GetAdjective], ada beberapa ide yang mungkin berguna bagi kita. Ketika Carsun Chang menjembatani kesenjangan antara ide-ide ini dan konteks Konfusianisme kita, dia akan menjadi titik temu bagi gerakan demokrasi."
 CHI_give_protection_of_civil_rights: "Memberikan Perlindungan Hak Sipil"
 CHI_give_protection_of_civil_rights_desc: "Soong Qingling dan Liga Tiongkok untuk Perlindungan Hak Sipil beroperasi pada awal tahun 1930-an, berjuang melawan tindakan otokratis KMT. Pekerjaan yang mereka mulai, akan kami lanjutkan dengan mengabadikan hak-hak rakyat jelata."
 CHI_rural_reconstruction_movement_sea: "Gerakan Rekonstruksi Pedesaan"
 CHI_rural_reconstruction_movement_sea_desc: "Kota-kota kita adalah pusat modernitas yang dinamis, namun hal yang sama tidak berlaku bagi pedesaan. Kita harus melakukan upaya bersama untuk memperluas kesejahteraan ekonomi dan dukungan ideologi di desa kita. Dengan menjangkau seluruh pengaruh kita, kita dapat memanfaatkan area-area yang mungkin masih terabaikan."
 CHI_rural_reconstruction_movement_sea_tt: "Mengurangi waktu penghapusan keputusan §YPengawasan Politik Pedesaan dan Perkotaan§! sebanyak §G10§! hari"
 CHI_rural_reconstruction_movement_sea_2_tt: "Keputusan §YPengawasan Pedesaan§! kini juga berlaku §Y$CHI_local_rural_reconstruction_modifier$§! di negara bagian yang ditargetkan"
 CHI_sino_american_joint_commission_on_rural_reconstruction: "Bantuan Rekonstruksi Pedesaan Amerika"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc: "Kita harus menggunakan kontak kita di Amerika untuk memperluas upaya pedesaan kita dengan memasukkan sekolah-sekolah desa, dan mempromosikan sistem pendidikan yang berfungsi dengan baik di seluruh negeri."
 CHI_a_matter_of_will: "Masalah Kehendak"
 CHI_a_matter_of_will_desc: "Tiongkok bisa mendapatkan keuntungan dari ide-ide asing, namun dengan sejarah yang kita miliki, kita punya jalan sendiri yang harus kita ambil. Kita perlu memulai dengan membangun fondasi sekolah di desa kita, dan membangun persatuan dari awal."
 CHI_glorify_deng_yanda: "Muliakan Deng Yanda"
 CHI_glorify_deng_yanda_desc: "Kuomintang meninggalkan revolusi yang kami mulai pada tahun 1911 melalui pengambilan keuntungan yang egois. Ada satu orang yang membela rakyat jelata dan menciptakan jalan lain selain tirani dan peredaan: Deng Yanda. Dia menjadi martir karena keyakinannya, dan kita tidak akan pernah melupakan dia atau apa yang dia wakili."
 CHI_apply_yandas_work: "Terapkan Karya Yanda"
 CHI_apply_yandas_work_desc: "Deng selalu ingin memobilisasi massa dan memberikan alternatif kepada masyarakat pedesaan. Menyebarkan informasi dari desa ke desa akan memperkuat organisasi kita dan negara secara keseluruhan."
 CHI_apply_yandas_work_tt: "Mengurangi biaya pengambilan keputusan §YPengawasan Politik Pedesaan dan Perkotaan§! sebesar §G10§!"
 CHI_socialize_major_industries: "Nasionalisasi Industri Besar"
 CHI_socialize_major_industries_desc: "Kita telah membiarkan beberapa individu mengumpulkan terlalu banyak kekayaan dan kekuasaan, sehingga menyebabkan industri-industri penting berada di tangan yang salah. Kita harus membawa industri-industri tersebut ke dalam pengawasan negara agar tetap aman."
 CHI_a_burgeoning_welfare_state: "Negara Kesejahteraan yang Berkembang"
 CHI_a_burgeoning_welfare_state_desc: "Negara yang peduli terhadap rakyatnya mempunyai kekuatan dan ketahanan yang tak tertandingi. Mengambil inspirasi dari Jerman sebelum mereka jatuh ke dalam fanatisme, kita akan memulai jalan menuju masa depan yang lebih adil."
 CHI_truly_free_speech: "Pidato yang Benar-Benar Bebas"
 CHI_truly_free_speech_desc: "Meskipun kami melindungi masyarakat dari tuntutan atas pendapat mereka, wacana tersebut masih sempit. Kita perlu mendorong lebih banyak orang untuk mengambil bagian dalam dialog publik sehingga beragam suara dapat didengar dan mengambil sikap."
 CHI_a_control_yuan_with_teeth: "Yuan Kontrol dengan Gigi"
 CHI_a_control_yuan_with_teeth_desc: "Kekuasaan itu korup, jadi kita perlu sesuatu untuk menjaga kejujuran para politisi kita. Di bawah pemerintahan Chiang Kai-Shek, organisasi yang bertugas melakukan hal ini menjadi tidak berdaya. Kami akan membangun kembali organisasi ini sehingga dapat memenuhi misinya secara maksimal."
 CHI_unify_as_the_china_democratic_league: "Bersatu sebagai Liga Demokratik Tiongkok"
 CHI_unify_as_the_china_democratic_league_desc: "Sebagai kelompok kecil yang berbeda-beda, kami tidak bisa melawan Kuomintang, namun jika kami bisa bersatu, kami mungkin punya peluang. Tapi, siapa yang akan memimpin kita?"
 CHI_continue_the_ding_xian_experiment: "Lanjutkan Eksperimen Ding Xian"
 CHI_continue_the_ding_xian_experiment_desc: "Proyek Ding Xian dalam Rekonstruksi Pedesaan sejauh ini disponsori oleh Gerakan Pendidikan Massal James Yen. Digunakan sebagai laboratorium sosial, lembaga ini telah mengembangkan dan mendemonstrasikan cara-cara untuk meningkatkan standar hidup, kesehatan, tanggung jawab politik, dan budaya di desa Tionghoa. Kita harus mendanai program ini untuk membawa modernisasi ke pedesaan."
 CHI_continue_the_ding_xian_experiment_tt: "\n§YElektrifikasi dan Pendidikan Massal§! akan mulai menyebar ke luar §YHebei dan Hunan§! seiring berjalannya waktu, dengan satu negara bagian inti baru yang mendapatkan pengubahnya setiap bulan kedua."
 CHI_minsheng_focus: "Prinsip Minsheng"
 CHI_minsheng_focus_desc: "Negara modern menjaga warganya sehingga pada saat dibutuhkan, warga negara mampu dan mau membela negaranya. Untuk itu, kita harus memberlakukan asas Minsheng dan memastikan kesejahteraan dapat diberikan kepada seluruh warga negara."
 CHI_minzu_focus: "Prinsip Minzu"
 CHI_minzu_focus_desc: "Gagasan untuk menjadi bagian dari suatu bangsa – bukan suatu suku atau agama – itulah yang mengubah sekelompok orang menjadi sebuah negara. Oleh karena itu, asas Minzu harus kita terapkan, dan menjamin seluruh masyarakat bangsa memiliki rasa nasionalisme dan patriotisme yang kuat, serta rasa persatuan di bawah pemerintah pusat."
 CHI_minquan_focus: "Prinsip Minquan"
 CHI_minquan_focus_desc: "Perjalanan yang dimulai oleh Dr. Sun Yat-sen pada akhirnya akan mengarah pada republik bersatu. Tentu saja ini akan menjadi perjalanan yang panjang, namun kami melakukannya selangkah demi selangkah. Yang pertama adalah menerapkan prinsip Minquan dan memastikan bahwa hak suara diberikan kepada semua warga negara Tiongkok."
 CHI_demand_regional_adherence: "Menuntut Kepatuhan Regional"
 CHI_demand_regional_adherence_desc: "Sekarang kita dapat membuktikan kepada penguasa regional Tiongkok bahwa kita telah menerapkan Tiga Prinsip Rakyat dengan benar, kita mempunyai kesempatan untuk memberikan tekanan pada mereka untuk melakukan hal yang sama. Hal ini pada akhirnya akan mengarah pada penaklukan dan integrasi mereka ke dalam republik, di bawah bimbingan otoritas pusat kita."
 CHI_demand_regional_adherence_tt: "Membuka keputusan untuk §YMembangun§! wilayah yang dikuasai panglima perang dan menegakkan kepatuhan mereka terhadap tiga prinsip rakyat, meningkatkan dukungan §YDemokrat§! dan pada akhirnya §YMenundukkan dan Mengintegrasikan§! mereka"
 CHI_zhonghua_minzu_focus: "Zhonghua Minzu"
 CHI_zhonghua_minzu_focus_desc: "Kini setelah para panglima perang dan gubernur regional semuanya kembali berada di bawah kendali kita, inilah saatnya untuk memulai reunifikasi yang tepat dan melihat ke luar. Banyak wilayah yang menjadi hak kita telah hilang dari tangan rakyat jelata nasionalis dan kekuatan asing, dan kita sekarang harus melakukan segala daya kita untuk membawa mereka kembali ke kejayaan republik ini."
 CHI_zhonghua_minzu_focus_tt: "Membuka keputusan untuk [MON.GetFlag] §Y[MON.GetAdjective]§!, [TAN.GetFlag] §Y[TAN.GetAdjective]§! dan [TIB.GetFlag] §Y[TIB.GetAdjective]§! menyatakan"
 CHI_zhonghua_minzu_focus_2_tt: "Ganti §Y$CHI_the_political_tutelage_dm$§! dengan §Y$CHI_the_political_tutelage_upgraded_dm$§!, perubahan yang efektif:"
 CHI_toward_a_socialist_economy: "Menuju Ekonomi Sosialis"
 CHI_toward_a_socialist_economy_desc: "Untuk benar-benar mengubah masyarakat kita menjadi lebih baik, kita harus mengubah cara aliran uang, dan menyingkirkan pimpinan perusahaan yang hanya mendapatkan jabatannya melalui nepotisme. Pekerja sekali lagi akan mempunyai hak untuk bersuara di negaranya, dan semua [ROOT.GetAdjective] akan setara!"
 CHI_enact_georgist_tax_reforms: "Menetapkan Reformasi Pajak Georgist"
 CHI_enact_georgist_tax_reforms_desc: "Georgisme menjadi dasar teori ekonomi Sun Yat Sen, yang ingin menerapkan pajak atas tanah yang dimiliki. 'Satu-satunya cara untuk mendukung pemerintah adalah pajak yang adil, masuk akal, dan merata, yang akan menjadi dasar sistem baru kita'."
 CHI_leverage_contacts: "Manfaatkan Kontak"
 CHI_leverage_contacts_desc: "Rekan senegara kita sudah menyebar ke seluruh dunia, bahkan ada yang sampai di Amerika. Di Amerika Serikat, kontak kami hanya menunggu kami untuk meminta bantuan."
 CHI_reach_out_for_help: "Hubungi Bantuan"
 CHI_reach_out_for_help_desc: "Momok militerisme menghantui Tiongkok dari timur dan kita perlu menghubungi kontak Amerika untuk mendapatkan bantuan. Mereka perlu memahami bahwa kami adalah garis pertahanan pertama mereka melawan ancaman Jepang."
 CHI_reach_out_for_help_tt: "§Y[USA.GetNameDefCap]§! akan lebih cenderung mengirimkan §YLend-Lease§! kepada kami"
 CHI_deal_with_the_shadow_elements: "Berurusan dengan Elemen Bayangan"
 CHI_deal_with_the_shadow_elements_desc: "Kelompok bayangan di negara kita meracuni masyarakat demi keuntungan pribadi. Ini tidak tahan!"
 CHI_utilize_the_albazinian_contact_tt: "Membuka keputusan untuk meminta peningkatan dukungan dari [SOV.GetNameDef]"
 CHI_shifting_the_balance: "Menggeser Keseimbangan"
 CHI_shifting_the_balance_desc: "Meskipun kami mendapat dukungan dari luar negeri, namun sifatnya pasif. Kami akan meminta keterlibatan aktif sehingga kami dapat dibantu dalam mengalahkan ancaman Jepang untuk selamanya."
 CHI_the_german_mission: "Misi Jerman"
 CHI_the_german_mission_desc: "Selama lebih dari satu dekade kami mempunyai hubungan dengan Jerman, dan kami harus secara khusus menggunakan kontak Carsun Chang untuk memperluas kolaborasi kami"
 CHI_reach_out_to_expats: "Hubungi Ekspatriat"
 CHI_reach_out_to_expats_desc: "Orang-orang kami telah tersebar di seluruh dunia dan membangun kehidupan baru untuk diri mereka sendiri. Bagi sebagian orang, hal itu menunjukkan kelemahan, namun bagi kami, itu adalah kekuatan. Kami akan memanggil rekan senegara kami yang terasing pada saat dibutuhkan."
 CHI_reach_out_to_expats_tt: "Membuka keputusan untuk §YMendapatkan Peningkatan Surplus Kapasitas Ekonomi Bulanan§! dari negara-negara asing dengan memanfaatkan kontak dan komunitas ekspatriat kami"
 CHI_invoke_the_nine_powers: "Panggil Sembilan Kekuatan"
 CHI_invoke_the_nine_powers_desc: "Meskipun perjanjian yang tidak setara ditandatangani dan merugikan kita, Sembilan Kekuatan menyetujui status quo di mana tidak ada satu negara pun yang boleh mengambil lebih banyak wilayah Tiongkok. Dengan agresi Jepang yang sedang berlangsung, sekarang saatnya untuk menerapkan klausul tersebut."
 CHI_aeronautical_expertise: "Keahlian Penerbangan"
 CHI_aeronautical_expertise_desc: "Penerbang Tiongkok memang pantas mendapatkan ketenaran di belahan lain Pasifik. Kita bisa memanggil mereka pulang untuk memanfaatkan keahlian mereka."
 CHI_expand_the_faction: "Undang yang Gratis"
 CHI_expand_the_faction_desc: "Seperti halnya gerakan domestik, perjuangan demokrasi di Asia bergantung pada banyak kelompok kecil. Kita perlu menyatukan semua gerakan dalam faksi yang lebih besar untuk mampu melawan mereka yang menindas kita."
 CHI_pacific_entente_faction: "Entente Pasifik"
 CHI_expand_the_faction_tt: "Membuka keputusan untuk mengundang negara-negara §YDemokrat§! §YAsia§! dan §YOceanian§! ke faksi kami"
 CHI_make_a_stand_against_the_colonialists: "Melawan Penjajah"
 CHI_make_a_stand_against_the_colonialists_desc: "Abad kekaisaran telah berakhir dan kita adalah pertanda zaman penentuan nasib sendiri. Kita perlu membuat pernyataan sederhana ini diketahui oleh mereka yang tetap berpegang pada tatanan lama dan jika mereka menolak kita, mereka akan mengetahui kemarahan masyarakat."
 CHI_make_a_stand_against_the_colonialists_tt: "Membuka kunci keputusan §YAnti-Kolonialisme§! untuk membebaskan koloni di §YAsia dan Oseania§! yang dikuasai oleh kekuatan kolonial."
 CHI_spreading_the_light_of_freedom: "Menyebarkan Cahaya Kebebasan"
 CHI_spreading_the_light_of_freedom_desc: "Kebebasan dari ancaman asing hanyalah langkah pertama dalam perjalanan kita. Kita juga perlu memastikan bahwa ancaman dalam negeri tidak menghalangi keinginan bangsa untuk berekspresi."
 CHI_spreading_the_light_of_freedom_tt: "Membuka keputusan untuk §YMenggerakkan Sentimen Partai Republik§! di dalam negara-negara §YAsia dan Oseania§!"
 CHI_correct_a_historical_wrong: "Perbaiki Kesalahan Sejarah"
 CHI_correct_a_historical_wrong_desc: "Perlakuan yang dilakukan bangsa Eropa terhadap dunia sangat tidak adil dan merupakan noda pada peradaban manusia. Kami akan memperbaiki kesalahan ini dan menghukum mereka atas kejahatan mereka."
 CHI_championing_the_cause_of_liberty: "Memperjuangkan Penyebab Kebebasan"
 CHI_championing_the_cause_of_liberty_desc: "Kami telah membawa cahaya kebebasan ke Asia dan menjadi mercusuar bagi semua orang yang menghargai kebebasan dan penentuan nasib sendiri."
 CHI_utilize_the_albazinian_contact: "Manfaatkan Kontak Albazinian"
 CHI_utilize_the_albazinian_contact_desc: "Uskup Symeon Du adalah protodiakon Gereja Ortodoks Tiongkok saat ini. Sebagai seorang Albazinian yang telah melakukan perjalanan ke seluruh Tiongkok, Uskup menjalin kontak dekat dengan banyak anggota pasukan Rusia Putih lama. Mungkin dia bisa membujuk Rusia untuk mengirimkan bantuan ke negara kita?"
  # Wang Jingwei
 CHI_prepare_for_a_change_in_leadership: "Mempersiapkan Perubahan dalam Kepemimpinan"
 CHI_prepare_for_a_change_in_leadership_desc: "Kita sudah memiliki pemerintahan yang sekarang selama satu dekade, dan momok [JAP.GetNameDef] masih menghantui negara [CHI.GetAdjective]. Ada kebutuhan untuk memiliki orang lain yang memegang tampuk kekuasaan."
 CHI_prepare_for_a_change_in_leadership_tt: "§R[CHI_chiang_kaishek.GetName] akan diganti dalam insiden Xi'an untuk [CHI_wang_jingwei.GetName]§!"
 CHI_prepare_for_a_change_in_leadership_tt_2: "§RMengirim Chiang Kai-Shek ke Guangzhou selama Insiden Liangguang akan mengakibatkan kematiannya lebih awal, sehingga $CHI_look_for_allies$ dapat dipilih§!"
 CHI_prepare_for_a_change_in_leadership_dai_li: "§R[CHI_chiang_kaishek.GetName] akan diganti dalam insiden Xi'an untuk [CHI_dai_li.GetName]§!"
 CHI_avoid_another_crisis: "Hindari Krisis Lainnya"
 CHI_avoid_another_crisis_desc: "Pada tahun 1931 kami tidak siap dan dikejutkan oleh tentara [JAP.GetAdjective]. Meskipun setengah dekade telah berlalu, kita belum siap untuk mengalahkan mereka dan harus mendapatkan lebih banyak sumber daya yang berharga, yaitu waktu. Kami dapat menawarkan konsesi token untuk menenangkan [JAP.GetAdjective], sehingga memungkinkan kami bersiap menghadapi badai yang tak terhindarkan dari timur."
 CHI_avoid_another_crisis_tt: "\nAkan memberikan opsi untuk menunda invasi Jepang dengan memberikan konsesi."
 CHI_lay_the_foundation_for_a_united_china: "Meletakkan Fondasi untuk Tiongkok Bersatu"
 CHI_lay_the_foundation_for_a_united_china_desc: "Pemerintahan saat ini adalah sekelompok orang biadab yang hanya mengetahui kekuatan pedang. Sebuah negara yang sehat membutuhkan lebih dari sekedar pemerintahan dengan kekerasan. Institusi yang kuat di bawah pemerintahan sipil adalah landasan bagi kelanjutan revolusi kita."
 CHI_preempt_the_inevitable: "Mencegah Hal yang Tak Terelakkan"
 CHI_preempt_the_inevitable_desc: "Kami tahu bahwa [JAP.GetNameDef] sedang mendekati kami, karena percaya bahwa kami lemah dan siap menghadapinya. Bisa dibayangkan keterkejutan mereka jika kita menyerang lebih dulu."
 CHI_utilize_german_contacts: "Manfaatkan Kontak Jerman"
 CHI_utilize_german_contacts_desc: "Sementara orang-orang barbar timur memiliki haus darah yang tak terpuaskan, ada di antara mereka yang mampu mendengarkan alasan, meski bukan dari kita. Dengan menjangkau kontak-kontak yang ada di Eropa, kita dapat membuat mereka meredam perasaan orang-orang yang lebih panas."
 CHI_utilize_german_contacts_tt: "Jika kami menerima permintaan [GER.GetAdjective] tentang perjanjian anti-Soviet, maka [GER.GetNameDef] akan lebih cenderung menyela atas nama kami."
 CHI_utilize_german_contacts_wang_tt: "Kami akan menggunakan koneksi kami melalui [CHI.GetLeader] untuk mendapatkan:"
 CHI_look_for_allies: "Carilah Sekutu Internal"
 CHI_look_for_allies_desc: "Chiang memiliki waktu hampir satu dekade untuk mengkonsolidasikan kekuasaannya atas partai tersebut, namun masih ada elemen yang menolak untuk mendukungnya. Kita harus mencari mereka dan menyatukan mereka menjadi oposisi yang tepat."
 CHI_infiltrate_the_examination_yuan: "Menyusup ke Pemeriksaan Yuan"
 CHI_infiltrate_the_examination_yuan_desc: "Sebuah negara tidak hanya dijalankan oleh kerja segelintir orang, melainkan kerja keras sejumlah besar pegawai negeri sipil. Jika kami mampu menyusup ke organisasi yang memeriksa kualifikasi para pekerja tersebut, kami akan mendapatkan keuntungan yang besar bagi gerakan kami. Jika kita bisa memastikan bahwa kaum buruh sejalan dengan posisi kita, maka hal ini akan menjadi kekuatan yang tidak dapat dihentikan."
 CHI_take_control_of_the_executive_yuan: "Kendalikan Eksekutif Yuan"
 CHI_take_control_of_the_executive_yuan_desc: "Siapa yang membuat hukum mempunyai kekuasaan, tetapi siapa yang menegakkannya, ia dapat menggantikannya. Dengan orang-orang kami menduduki posisi menteri, kami akan mampu melawan Chiangisme di setiap tingkatan."
 CHI_take_control_of_the_executive_yuan_tt: "Ketika Panglima Perang baru dijadikan boneka, setiap Boneka Panglima Perang yang ada akan memperoleh: §Y[?executive_yuan_autonomy_ratio|%]§! rasio otonomi"
 CHI_our_people_in_the_legislative: "Rakyat Kita di Legislatif"
 CHI_our_people_in_the_legislative_desc: "Sistem yang ada saat ini telah menjadi ompong di bawah pemerintahan Chiang. Orang kuat mencoba menggantikan kekuatan pusat yang kuat, dan kita harus melawannya. Kita harus menulis ulang otonomi beberapa elemen pemerintah untuk memperkuat inti bangsa."
 CHI_clear_out_sycophants: "Singkirkan Penjilat"
 CHI_clear_out_sycophants_desc: "Seorang tiran menghasilkan orang-orang yang selalu bersikap baik dan semakin lama ia memerintah, semakin banyak pula orang-orang yang suka bersikap baik. Meskipun kita memegang kendali legislatif dan eksekutif, masih banyak laki-laki yang menganut gagasan lama. Kita harus melakukan upaya bersama untuk memastikan bahwa mereka yang mendapat manfaat dari rezim sebelumnya mendapatkan tempat yang semestinya."
 CHI_impair_the_control_yuan: "Merusak Kontrol Yuan"
 CHI_impair_the_control_yuan_desc: "Checks and balances merupakan faktor penting dalam berfungsinya pemerintahan, namun hal ini juga dapat memperlambat kemajuan. Akan menguntungkan tujuan kita jika Control Yuan tidak sekuat yang diharapkan beberapa orang, agar tidak menghalangi kita dalam mencapai tujuan kita."
 CHI_impair_the_control_yuan_tt: "Tingkatkan §Ykeputusan Upaya Integrasi§! agar dapat diterapkan:"
 CHI_impair_the_control_yuan_tt_2: "480 hari $instead_of$ 365 hari"
 instead_of: "Dari pada:"
 and_last_for: "Dan Terakhir Untuk:"
 CHI_appoint_sympathetic_judges: "Tunjuk Hakim yang Simpatis"
 CHI_appoint_sympathetic_judges_desc: "Dengan adanya para Hakim di posisi-posisi kunci, kita akan mampu memperluas kekuasaan kita ke bawah dan ke luar hingga ke tingkat provinsi."
 CHI_appoint_sympathetic_judges_tt: "Setiap Subjek Panglima Perang di masa depan akan mendapatkan semangat berikut saat dijadikan boneka:"
 CHI_close_whampoa: "Tutup Whampoa"
 CHI_close_whampoa_desc: "Whampoa selalu dikenal sebagai wilayah kekuasaan pribadi Chiang dan tempat berkembang biaknya kecenderungan ideologisnya. Ini adalah institusi yang tidak mungkin dibiarkan bertahan, jadi kami akan menutupnya dan mengecam semua orang yang diketahui memiliki hubungan dengan institusi tersebut."
 CHI_close_whampoa_tt: "Setiap jenderal yang tersisa akan memperoleh: §G+3§! statistik yang ditetapkan secara acak."
 CHI_censure_the_opposition: "Mengecam pihak Oposisi"
 CHI_censure_the_opposition_desc: "Kontrol Yuan sudah lemah, tapi jika kita mengendalikannya sepenuhnya kita bisa memperbaiki elemen yang tidak diinginkan. Memberikan umpan balik mengenai perilaku yang benar akan berfungsi sebagai tindakan korektif."
 CHI_the_freedom_to_abject: "Kebebasan untuk Menhina"
 CHI_the_freedom_to_abject_desc: "Suatu sistem yang tidak dapat dikritik tidak akan pernah tumbuh dan berkembang. Sudah terlalu lama kita menginjak-injak orang-orang yang menunjukkan unsur-unsur yang memperkaya sebagian orang hingga merugikan masyarakat [CHI.Getadjective]. Kita memerlukan proses yang memungkinkan kita menunjukkan kegagalan sistem selama hal itu tidak mengganggu stabilitas kita."
 CHI_expropriate_industrialists: "Industrialis yang mengambil alih"
 CHI_expropriate_industrialists_desc: "Para antek Chiang mendapat banyak manfaat dengan mengikuti orang korup tersebut dan mengumpulkan banyak kekayaan. Keuntungan pribadi tidak bisa diutamakan daripada partai dan apa yang terjadi perlu diperbaiki. Kami akan mengembalikan apa yang benar menjadi milik negara."
 CHI_politicise_the_process: "Politisasi Prosesnya"
 CHI_politicise_the_process_desc: "Sebagai pegawai negeri, penting untuk memahami tanggung jawab politik seseorang. Tidak semua orang memahami hal ini dan oleh karena itu perlu diajarkan dengan lebih baik. Pendidikan dan pemeriksaan setiap pegawai negeri akan kita rumuskan kembali agar pemahamannya meluas."
 CHI_a_functioning_bureaucracy_first: "Birokrasi yang Berfungsi Terlebih Dahulu"
 CHI_a_functioning_bureaucracy_first_desc: "Meskipun kendali atas aparatur negara sangatlah penting, namun tidak ada gunanya jika tidak ada negara sejak awal. Mengizinkan lembaga-lembaga mengukur tata kelola mandiri dan mendorong orang-orang yang tepat untuk naik pangkat berdasarkan prestasi dan bukan gagasan yang benar akan menguntungkan kita dalam jangka panjang."
 CHI_extend_jurisdiction_to_the_provinces: "Memperluas Yurisdiksi ke Provinsi"
 CHI_extend_jurisdiction_to_the_provinces_desc: "[ROOT.GetRulingParty] telah berhasil mengambil kendali atas kota-kota besar dan lembaga-lembaga pusat, namun kita bisa melakukan yang lebih baik di wilayah pinggiran. Memperluas kekuatan kita akan sangat membantu dalam mempersatukan Tiongkok dan menahan serangan gencar [JAP.GetAdjective]."
 CHI_affirm_civilian_primacy: "Menegaskan Keutamaan Sipil"
 CHI_affirm_civilian_primacy_desc: "Chiang membangun kekuasaannya di belakang tentara, namun kita tahu bahwa pikiran para perwira dapat dengan mudah terpengaruh, dan hanya sedikit dari mereka yang menguntungkan kita. Kita perlu memastikan bahwa angkatan bersenjata memahami bahwa mereka tunduk pada kendali sipil."
 CHI_proclaim_a_new_chapter: "Umumkan Babak Baru"
 CHI_proclaim_a_new_chapter_desc: "Rezim lama selalu mengklaim dirinya sebagai kekuatan yang memperjuangkan kebebasan dan demokrasi, namun kenyataannya mereka hanya haus akan kekuasaan. Dengan konsolidasi kekuasaan Wang Jingwei, kini kita dapat menyatakan bahwa pemerintahan sipil telah merebut kembali tampuk kekuasaan."
 CHI_negotiate_the_nine_powers_treaty: "Negosiasikan Perjanjian Sembilan Kekuatan"
 CHI_negotiate_the_nine_powers_treaty_desc: "Qing setuju untuk tunduk pada kekuatan Barat, dan perjanjian abad ke-19 menghantui kita seperti hantu, dampaknya masih melekat di Tiongkok. Kami akan menghubungi para penandatangan dan melihat apakah kami dapat menyelesaikan perbedaan-perbedaan kami, kali ini bukan sebagai pelayan, namun sebagai kesetaraan."
 CHI_start_looking_outwards: "Mulailah Melihat ke Luar"
 CHI_start_looking_outwards_desc: "Kesalahan yang dilakukan di masa lalu adalah percaya bahwa kita dapat berdiri terpisah dari dunia. Negara-negara kolonialis memisahkan kami dan negara-negara Asia lainnya, sehingga kami tidak dihormati. Hal ini tidak bisa dibiarkan begitu saja. Kami akan mengorganisir seluruh Asia untuk bersatu dalam kekuatan."
 CHI_start_looking_outwards_tt: "Kami akan dapat mengundang negara-negara Asia yang bebas ke faksi kami"
 CHI_liberate_the_peoples_of_asia: "Membebaskan Rakyat Asia"
 CHI_liberate_the_peoples_of_asia_desc: "Seperti pada abad-abad yang lalu, negara-negara Asia lainnya mengharapkan bimbingan dari kami dan kami akan meresponsnya. Kami akan membantu mereka bangkit melawan imperialis dan menemukan kebebasan mereka sendiri, membalaskan dendam saudara-saudara mereka."
 CHI_liberate_the_peoples_of_asia_tt: "Kami akan mencapai tujuan perang terhadap siapa pun yang menguasai negara kolonial atau memiliki boneka di §Y$asia$§!"
 CHI_liberate_the_peoples_of_asia_tt_2: "Membuka keputusan untuk membentuk pemerintahan boneka di sekitar §Y$asia$§!"
 CHI_punish_the_signatories: "Menghukum Para Penandatangan"
 CHI_punish_the_signatories_desc: "Kerusakan yang dilakukan oleh orang-orang Barat terhadap bangsa kita tidak dapat dihitung. Hal ini telah membuat kami tertindas. Mereka perlu dibuat memahami apa yang telah mereka lakukan, dan mulai membayar utang sejarah mereka."
 CHI_bring_the_revolution_further: "Membawa Revolusi Lebih Jauh"
 CHI_bring_the_revolution_further_desc: "Jalan pembebasan kita berjalan lebih jauh dari yang pernah kita bayangkan. Kami akan menyebarkan cahaya kebebasan ke seluruh kawasan Pasifik dan mendorong penjajah mundur lebih jauh lagi."
 CHI_bring_the_revolution_further_tt: "Kami akan mencapai tujuan perang terhadap siapa pun yang menguasai negara kolonial atau memiliki boneka di §Y$Australia$:§!"
 CHI_bring_the_revolution_further_tt_2: "Manifes faksi kami juga akan mencakup §Y$Australia$§!\nMembuka keputusan untuk membentuk pemerintahan boneka di sekitar §Y$Australia$§!"
 CHI_end_the_humiliation: "Akhiri Penghinaan"
 CHI_end_the_humiliation_desc: "Kita akhirnya berdiri, seperti yang telah kita lakukan berabad-abad yang lalu, sebagai sebuah kekuatan besar. Dikagumi, berpengaruh, dan mengesankan, kami telah melampaui yang lain, menyingkirkan para penindas dan memasukkannya ke dalam buku sejarah. Tidak dipermalukan lagi!"
  # Chiang Kai-shek
 CHI_dang_guo: "Dang Guo"
 CHI_dang_guo_desc: "Tujuan partai ini adalah untuk mewujudkan demokrasi di negara kita, namun di masa yang tidak menentu ini, penting bagi Kuomintang untuk bertindak secara efisien. Oleh karena itu, kita harus menempatkan partai di atas negara untuk saat ini."
 CHI_denounce_feudalism: "Tolak Feodalisme"
 CHI_denounce_feudalism_desc: "Sementara kami memproklamirkan karakter revolusioner kami, ada orang-orang di partai kami yang berperilaku seperti tuan tanah dan elit di masa lalu. Para feodal lama ini perlu menghadapi perilaku kontra-revolusioner mereka sebagaimana adanya."
 CHI_denounce_feudalism_tt: "Akan memperoleh: §G+[?warlord_subjects_pp_gain_base] Kekuatan Politik§! setiap bulan untuk setiap subjek panglima perang."
 CHI_one_nation_undivided: "Satu Bangsa, Tidak Terbagi"
 CHI_one_nation_undivided_desc: "Dengan menyatukan provinsi-provinsi di bawah satu kewenangan yang tidak terbagi, kita akan mengatasi perpecahan regional dan meletakkan landasan bagi bangsa yang kuat dan bangga. Dengan demikian kita akan mampu melawan segala ancaman, baik eksternal maupun internal."
 CHI_one_nation_undivided_tt: "Akan mengundang setiap panglima perang ke Fraksi Front Persatuan, kecuali [PRC.GetName] dan [HBC.GetName]"
 CHI_one_nation_undivided_bypass_tt: "§YSetiap Panglima Perang Tiongkok§!: Salah satu dari berikut ini harus benar:\nTidak ada\nSedang berperang dengan §Y[ROOT.GetNameWithFlag]§!\nMerupakan subjek dari §Y[ROOT.GetNameWithFlag]§!\nAdalah dalam faksi dengan §Y[ROOT.GetNameWithFlag]§!\n§Y[ROOT.GetName]§!: memiliki §Ytujuan perang§! melawan mereka."
 CHI_decree_the_end_to_corruption: "Dekrit Diakhirinya Korupsi"
 CHI_decree_the_end_to_corruption_desc: "Korupsi telah menjadi penyakit yang mewabah di pemerintahan kita, mulai dari pejabat tertinggi hingga pejabat terendah di angkatan bersenjata. Kita perlu menyingkirkan pejabat-pejabat yang tamak dan korup agar pemerintahan yang jujur ​​dapat terbentuk."
 CHI_reinforce_connections_with_shanghai_elites: "Perkuat hubungan dengan Elit Shanghai"
 CHI_reinforce_connections_with_shanghai_elites_desc: "Di Shanghai ada sekelompok individu dengan kekayaan dan kekuasaan besar, yang dikumpulkan melalui perpindahan masuk dan keluar dari bayang-bayang. Mengaktifkan individu-individu ini terbukti bermanfaat bagi tujuan kita."
 CHI_introduce_the_baojia_system: "Perkenalkan Sistem Baojia"
 CHI_introduce_the_baojia_system_desc: "Sistem Baojia telah digunakan untuk mengatur masyarakat dan menjamin keselamatan mereka sejak zaman kuno, dan terbukti sangat efisien. Kita harus mengembangkannya menjadi dasar rekrutmen karena hal ini akan menjamin aliran rekrutmen yang stabil."
 CHI_expand_the_tongzi_jun: "Perluas Tongzi Jun"
 CHI_expand_the_tongzi_jun_desc: "Jajaran korps pemuda mampu melahirkan generasi baru warga negara yang setia dan disiplin. Pelatihan militer tertentu juga akan memudahkan mereka masuk ke dalam angkatan bersenjata."
 CHI_demonstrate_our_resolve: "Tunjukkan Tekad kami"
 CHI_demonstrate_our_resolve_desc: "Sudah terlalu lama seluruh dunia memandang rendah kita. Inilah saatnya membuktikan keberanian kita dengan mengalahkan agresi keji ini."
 CHI_arrest_the_seven_gentlemen: "Tangkap Tujuh Pria"
 CHI_arrest_the_seven_gentlemen_desc: "Meskipun hanya sedikit orang di Tiongkok yang setuju dengan agresi Jepang, cara menghadapinya masih menjadi pertanyaan yang memecah belah. Kita tidak bisa membiarkan adanya persaingan dalam pemerintahan kita, oleh karena itu kita harus menunjukkan keunggulan kita dalam hal ini."
 CHI_develop_counterinsurgency_tactics_tt_2: "Akan membuat §Y$CHI_counter_infiltration_measures$§! menghabiskan biaya §G25%§! lebih banyak"
 CHI_take_a_stance_on_illicit_trade: "Ambil Sikap terhadap Perdagangan Gelap"
 CHI_take_a_stance_on_illicit_trade_desc: "Sudah terlalu lama kita bergantung pada racun yang merembes ke dalam masyarakat kita dan orang-orang yang terlibat di dalamnya. Kita perlu menolak godaannya untuk menjadi lebih kuat dan berpikiran jernih menuju abad baru yang penuh kemakmuran."
 CHI_reshuffle_the_green_gang: "Perombakan Geng Hijau"
 CHI_reshuffle_the_green_gang_desc: "Big Eared Du telah melayani kami dengan baik, tetapi juga menjadi terlalu berpengaruh. Saat musuh berputar-putar, kita memerlukan lebih banyak tindakan langsung. Mungkin sudah waktunya bagi orang lain untuk menjalankan Geng Hijau?"
 CHI_legitimise_du: "Melegitimasi Du"
 CHI_legitimise_du_desc: "Ada yang ingin kita menjauh dari orang-orang yang mempunyai cara mencari nafkah yang tidak lazim, tapi mungkin itu hanya berarti membuang sumber daya yang berharga. Kita harus melihat apa yang bisa dilakukan Du Yuesheng jika dia tidak perlu bekerja dalam bayang-bayang."
 CHI_inspect_the_troops: "Periksa Pasukan"
 CHI_inspect_the_troops_desc: "Inspeksi ketat akan dilakukan untuk mengumpulkan pasukan di belakang partai dan [root.GetLeader]. Pasukan kita yang mulia akan membawa kita ke masa depan."
 CHI_secure_the_soviet_border: "Amankan Perbatasan Soviet"
 CHI_secure_the_soviet_border_desc: "Beruang Rusia telah menjadi duri bagi kita, terlalu lama ikut campur dalam urusan kita. Kita harus mengamankan front utara kita dengan membangun hubungan formal dengan [SOV.GetNameDef] dan mungkin mendapatkan manfaat lebih dari mereka."
 CHI_secure_the_soviet_border_tt: "§RKami akan dapat melihat desainer Armor yang dapat kami pilih di acara mendatang.§!"
 CHI_send_the_first_lady_abroad: "Kirim Ibu Negara ke Luar Negeri"
 CHI_send_the_first_lady_abroad_desc: "Masih ada pihak-pihak yang mungkin mendukung kami dalam menghadapi agresi, namun saat ini masih ragu-ragu. Kita harus mengirimkan Ibu Negara untuk meyakinkan mereka bahwa meskipun kita telah menguras lautan dan menanggung beban perang yang berat, kita akan tetap menang."
 CHI_take_advantage_of_dus_contacts: "Manfaatkan Kontak Du"
 CHI_take_advantage_of_dus_contacts_desc: "Pemimpin Geng Hijau mempunyai teman di banyak tempat dan pengetahuan yang hanya dimiliki sedikit orang. Jaringan seperti itu bisa bermanfaat bagi kita jika kita memanfaatkannya dengan benar, bahkan jika itu akan menguntungkan beberapa pihak yang tidak bertanggung jawab."
 CHI_draw_support_from_the_big_families: "Mendapat Dukungan dari Keluarga Besar"
 CHI_draw_support_from_the_big_families_desc: "Tiongkok memiliki sejumlah keluarga yang sangat berpengaruh di berbagai sektor. Meskipun hal ini mungkin tidak membantu dalam menstabilkan negara, hubungan ini masih dapat digunakan untuk mencapai tujuan kita."
 CHI_prosecute_cronyism: "Tuntut Kronisme"
 CHI_prosecute_cronyism_desc: "Sudah terlalu lama kepentingan individu diutamakan dibandingkan kebutuhan negara. Nepotisme, penyuapan, dan penggelapan telah merusak tatanan masyarakat kita. Itu berakhir sekarang, dan era baru kebajikan menanti!"
 CHI_crack_down_on_illicit_goods: "Menindak Barang Haram"
 illicit_good_improvement_increase: "Meningkatkan kecepatan penghapusan §YPerdagangan Gelap§! sebanyak §G+2%§! setiap §Ybulan ke-6§!"
 which_will_give_tt: "Yang akan memberi:"
 CHI_crack_down_on_illicit_goods_desc: "Sudah terlalu lama kita bergantung pada racun yang merembes ke dalam masyarakat kita dan orang-orang yang terlibat di dalamnya. Kita perlu menolak godaannya untuk menjadi lebih kuat dan berpikiran jernih menuju abad baru yang penuh kemakmuran."
 CHI_turn_a_blind_eye: "Tutup Mata"
 CHI_turn_a_blind_eye_desc: "Dapat diakui bahwa beberapa perdagangan tidak resmi telah memberikan dampak buruk pada masyarakat Tiongkok. Namun, keuntungan dari perdagangan ini tidak dapat dipungkiri dan jika dibiarkan saja kita bisa memperoleh kekayaan yang besar."
 CHI_weaponise_the_hongmen: "Persenjatai Geng"
 CHI_weaponise_the_hongmen_desc: "Ada perkumpulan rahasia yang telah dilatih untuk membela diri di wilayah pelabuhan kita sehingga kita dapat melawan musuh kita. Beri mereka dukungan yang cukup, dan mereka bisa mendatangkan malapetaka pada setiap penyerbu yang berani melanggar tanah kita."
 CHI_weaponise_the_hongmen_tt: "Setiap negara bagian pesisir Tiongkok yang diduduki dan negara bagian yang memiliki kota besar:\nPerlawanan: §R+30,0%§!"
 CHI_facilitate_operation_zet: "Memfasilitasi Operasi Zet"
 CHI_facilitate_operation_zet_desc: "Kami memahami bahwa [SOV.GetNameDef] merasa tidak nyaman dengan sikap agresif yang diambil [JAP.GetNameDef] di Asia Timur. Mereka bersedia memberi kami dukungan materi dan sukarelawan. Yang perlu kita lakukan hanyalah mempersiapkan penerimaan bantuannya."
 CHI_from_many_to_one: "Dari Banyak menjadi Satu"
 CHI_from_many_to_one_desc: "Bangsa kita terdiri dari banyak sekali orang, namun akhir-akhir ini kita terpecah belah dan terpecah antara pendapat yang berbeda. Jika kita ingin melawan serangan asing dan akhirnya bertahan, kita perlu bersatu demi satu tujuan bersama."
 CHI_from_many_to_one_tt: "Dapatkan §G+1,5%§! Stabilitas untuk setiap Panglima Perang di faksi kami"
 CHI_from_many_to_one_faction_tt: "Akan menambahkan §G+20.0%§! $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$ ketika pemenuhan manifes faksi rendah.\nAkan menambahkan §G-10.0%§! $MODIFIER_AUTONOMY_GAIN_WARSCORE$ saat pemenuhan manifes faksi tinggi."
 CHI_request_soviet_advisors: "Minta Penasihat Soviet"
 CHI_request_soviet_advisors_desc: "Perang telah berubah secara radikal dalam beberapa dekade terakhir dan kita telah tertinggal. [SOV.GetNameDefCap] telah menawarkan untuk mengirimkan ahli yang berkualifikasi kepada kami untuk mengejar upaya perlindungan kami, dan kami harus menerimanya."
 CHI_the_northwest_highway: "Jalan Raya Barat Laut"
 CHI_the_northwest_highway_desc: "Kita berbagi perbatasan yang panjang dengan [SOV.GetnameDef] sehingga orang akan berpikir bahwa ada banyak peluang untuk mengangkut barang-barang tanpa gangguan di antara kedua rezim kita. Namun, infrastruktur di wilayah tersebut masih kurang. Kita harus fokus membangun rute yang jauh dari garis depan sehingga kita bisa menerima lebih banyak dari teman [SOV.Getadjective] kita."
 CHI_collaborate_with_allied_forces: "Berkolaborasi dengan Sekutu"
 CHI_collaborate_with_allied_forces_desc: "Kami telah berjuang keras dan lama melawan ancaman [JAP.GetAdjective], namun kami tidak lagi sendirian. Untuk dapat mengkoordinasikan upaya-upaya kita, kita harus mengintegrasikan kedua angkatan bersenjata kita lebih lanjut, dan mencapai kemenangan akhir."
 CHI_collaborate_with_allied_forces_tt: "Membuka Keputusan untuk Membentuk Kekuatan X dan Y yang akan menciptakan perpecahan."
 CHI_scout_for_air_experts: "Pramuka Ahli Udara"
 CHI_scout_for_air_experts_desc: "Angkatan udara kita masih dalam tahap awal dan banyak tantangan yang harus dihadapi dengan susah payah. Kami akan memfasilitasi upaya angkatan udara dengan memanfaatkan keahlian pihak lain."
 CHI_sell_lend_lease: "Jual Pinjam-Sewa"
 CHI_sell_lend_lease_desc: "Mendapatkan perlengkapan untuk pasukan kita selalu bermanfaat, namun apa yang ditawarkan tidak selalu sesuai dengan kebutuhan. Namun, selalu ada kebutuhan akan peralatan di suatu tempat, yang berarti selalu ada pasar untuk peralatan tersebut."
 CHI_sell_lend_lease_tt: "Jika kami memiliki keuntungan §Y$CHI_soviet_support$§!: §Y+100 $CIC_BANK_HEADER$§! per bulan\n\nJika kami memiliki §Y$CHI_american_support$§! keuntungan: §Y+150 $CIC_BANK_HEADER$§! per bulan\n\n"
 CHI_international_instructors: "Instruktur Internasional"
 CHI_international_instructors_desc: "Kebutuhan akan pilot dan awak sangat besar, dan kita tidak bisa melatih mereka dengan cukup cepat. Menyambut lebih banyak instruktur asing akan mempercepat upaya kami untuk menerbangkan lebih banyak pesawat."
 CHI_allocate_lend_lease: "Alokasikan Pinjam-Sewa"
 CHI_allocate_lend_lease_desc: "Saat ini terdapat beberapa pusat kekuasaan di Tiongkok, meskipun hanya satu yang dapat mewakili negaranya di luar negeri. Kita dapat menggunakan keuntungan ini untuk memutuskan siapa yang mendapat dukungan, dan siapa yang dapat memberikan pengaruh."
 CHI_allocate_lend_lease_tt: "Membuka keputusan untuk mengurangi Otonomi Subjek Panglima Perang menggunakan §YPeralatan Infanteri§!"
 CHI_burma_campaign: "Kampanye Burma"
 CHI_burma_campaign_desc: "Sekutu kita sedang berjuang. [JAP.GetNameDefCap] telah berkembang pesat dan kini menguasai sebagian Burma. Kami akan menunjukkan bahwa kami bukan hanya pengalih perhatian musuh, namun juga sekutu yang dapat diandalkan yang akan melancarkan serangan mematikan."
 CHI_burma_campaign_trigger: "[BRM.GetName] telah kehilangan setidaknya satu wilayahnya ke tangan musuh"
 CHI_indo_chinese_campaign: "Kampanye Indo-Cina"
 CHI_indo_chinese_campaign_desc: "Kita mempunyai sejarah panjang dengan Asia Tenggara dan hari ini babak baru telah ditulis. Kami akan merebut kembali wilayah tersebut dari [671.controller.GetNameDef] sehingga pasukan sekutu dapat beroperasi dengan bebas."
 CHI_international_squadron: "Undang Macan Terbang"
 CHI_international_squadron_desc: "Teman-teman kami di luar negeri telah mengorganisir kelompok sukarelawan yang terdiri dari pilot dan membeli sejumlah pesawat modern untuk mendukung upaya perang kami. Kita harus menyambut inisiatif mereka dengan tangan terbuka."
 CHI_form_the_chinese_womens_national_war_relief_society: "Sekolah Terbuka untuk Masyarakat Miskin"
 CHI_form_the_chinese_womens_national_war_relief_society_desc: "Banyak pihak yang mengalami kerugian besar dalam perjuangan kita melawan imperialisme dan kita perlu mengakomodasi kebutuhan mereka. Lembaga Bantuan Perang Nasional Wanita Tiongkok telah menunjukkan hasil yang menjanjikan dan harus diperluas untuk meningkatkan kemanjuran."
 CHI_towards_a_professional_army: "Menuju Tentara Profesional"
 CHI_towards_a_professional_army_desc: "Pasukan kita memang besar, namun efektivitasnya masih bisa diperdebatkan. Kelompok Penasihat Militer Jerman merekomendasikan agar kita mengurangi jumlah tentara dan fokus pada penciptaan kekuatan yang lebih kecil, perlengkapan yang lebih baik, semangat tinggi dan efektivitas tempur."
 CHI_towards_a_popular_army: "Menuju Tentara Populer"
 CHI_towards_a_popular_army_desc: "Angkatan bersenjata kita kekurangan peralatan dan pelatihan, namun satu hal yang kita miliki adalah manusia. Kami akan membuat penjajah asing mendobrak tembok tentara yaitu Tentara Revolusioner Nasional."
 CHI_the_hanoi_route: "Rute Hanoi"
 CHI_the_hanoi_route_desc: "Pelabuhan timur kami rentan terhadap [JAP.GetNameDef] dan kami perlu mengambil tindakan pencegahan. Menuruni pegunungan dari Kunming ke dalam hutan di sekitar Hanoi adalah rute yang sulit, namun akan memberikan kelonggaran bagi pengiriman kami."
 CHI_form_saco: "Bentuk SACO"
 CHI_form_saco_desc: "Jika seseorang ingin menang, ia perlu mengetahui musuhnya. Amerika telah mengusulkan untuk membentuk Organisasi Koperasi Sino-Amerika untuk berbagi intelijen dan membantu dalam melatih unit gerilya kita."
 CHI_the_burma_road: "Jalan Burma"
 CHI_the_burma_road_desc: "Sekutu asing kami telah menunjukkan kesediaan mereka untuk mendukung kami secara materi, namun tekanan militer dari [JAP.GetName] membuat pengiriman menjadi sulit. Menetapkan rute melalui Burma akan memungkinkan kita meningkatkan jumlah material yang dapat kita terima dari barat daya."
 CHI_the_hump_sea: "Punuk itu"
 CHI_the_hump_sea_desc: "Kereta api, truk, dan kapal semuanya baik-baik saja dalam hal pengiriman material, tetapi masa depan masih di depan mata. Dengan pilot yang terampil, kami akan mampu terbang melintasi Himalaya dan mendarat di Yunnan, yang berarti tidak ada yang dapat menghentikan pengiriman kami."
 CHI_women_in_the_war_effort: "Wanita Baru dalam Upaya Perang"
 CHI_women_in_the_war_effort_desc: "Sejak Gerakan Keempat Mei, peran perempuan dalam masyarakat telah berubah selamanya. Merangkul modernitas dan cinta tanah air, perempuan juga harus bisa berkontribusi. Mengorganisir batalyon perempuan dan mengintegrasikan mereka ke dalam angkatan bersenjata akan sangat membantu kita."
 CHI_the_sky_cannot_have_two_suns: "Langit Tidak Bisa Memiliki Dua Matahari"
 CHI_the_sky_cannot_have_two_suns_desc: "Subversi komunis mengancam tatanan masyarakat Tiongkok. Hanya dengan membuktikan supremasi kita dan menghancurkan perjuangan mereka, Tiongkok akan bertahan dan bersatu di bawah satu bendera. Dua matahari mungkin terbenam, tapi hanya satu yang terbit saat fajar menyingsing."
 CHI_the_sky_cannot_have_two_suns_tt: "Setiap Panglima Perang di faksi kami yang juga komunis:\nTambahkan: §Y-10.00%§! pengaruh faksi"
 CHI_preemptive_strike: "Serangan Preemptif"
 CHI_preemptive_strike_desc: "Setiap hari musuh internal kita semakin kuat dan bersekongkol melawan otoritas kita. Kita tidak bisa lagi menunggu seseorang mencoba mengambil alih kekuasaan di Tiongkok, kita harus bertindak, kita harus menyerang!"
 CHI_preemptive_strike_tt: "Kami akan mendapatkan §Y$annex_everything$§! wargoal di setiap [CHI.GetAdjective] Warlord yang belum bergabung dengan [ROOT.GetFactionName] atau telah menolak tuntutan kami untuk menjadi subjek."
 CHI_tour_the_north: "Jelajahi Utara"
 CHI_tour_the_north_desc: "Daerah pedalaman pegunungan menjadi pusat agitasi komunis. Hal ini tidak bisa dibiarkan terus berlanjut, dan kita harus menunjukkan kehadiran kita dengan melakukan perjalanan ke berbagai provinsi."
 CHI_unlock_faction_goal_north_subjugated_tt: "Jika ini adalah fokus tur pertama yang diambil maka tujuan faksi §Y$faction_goal_north_subjugated_name$§! akan terbuka."
 CHI_tour_the_west: "Jelajahi Barat"
 CHI_tour_the_west_desc: "Di negeri pegunungan dan gurun pasir, lokasi Jalur Sutra zaman dahulu jauh dari pusat kekuasaan. [SOV.GetNameDefCap] telah menyebarkan pengaruhnya di wilayah ini sehingga kami akan memastikan bahwa para pialang kekuasaan lokal tahu ke mana mereka harus mengalihkan perhatian mereka."
 CHI_unlock_faction_goal_west_subjugated_tt: "Jika ini adalah fokus tur pertama yang diambil maka tujuan faksi §Y$faction_goal_west_subjugated_name$§! akan terbuka."
 CHI_tour_the_south: "Jelajahi Selatan"
 CHI_tour_the_south_desc: "Bagian selatan Tiongkok merupakan tempat yang beragam dan dinamis, sering kali menjadi jendela dunia. Tempat di mana partai kita dibentuk baru-baru ini mendapatkan otonomi yang lebih besar dan ini merupakan tren yang perlu kita kembalikan. Kita harus mengunjungi provinsi-provinsi ini!"
 CHI_unlock_faction_goal_south_subjugated_tt: "Jika ini adalah fokus tur pertama yang diambil maka tujuan faksi §Y$faction_goal_south_subjugated_name$§! akan terbuka."
 CHI_ma_clique_integration_cost: "Mengurangi Biaya Integrasi untuk [XSM.GetNameDef], [GSM.GetNameDef] dan [NXM.GetNameDef] sebesar §G[?ma_clique_integration_cost_reduction|%G0]§!"
 CHI_warlord_integration_cost_reduction: "Mengurangi Biaya untuk §YMenekan Panglima Perang untuk menjadi subjek kami§! sebesar £GFX_influence_texticon §G-5%§! dan £pol_power §G-50§!"
 CHI_shx_integration_cost: "Mengurangi Biaya Integrasi untuk [SHX.GetNameDef] sebesar §G[?shx_integration_cost_reduction|%G0]§!"
 CHI_snd_integration_cost: "Mengurangi Biaya Integrasi untuk [SND.GetNameDef] sebesar §G[?snd_integration_cost_reduction|%G0]§!"
 CHI_khm_integration_cost: "Mengurangi Biaya Integrasi untuk [KHM.GetNameDef] sebesar §G[?khm_integration_cost_reduction|%G0]§!"
 CHI_sik_integration_cost: "Mengurangi Biaya Integrasi untuk [SIK.GetNameDef] sebesar §G[?sik_integration_cost_reduction|%G0]§!"
 CHI_sic_integration_cost: "Mengurangi Biaya Integrasi untuk [SIC.GetNameDef] sebesar §G[?sic_integration_cost_reduction|%G0]§!"
 CHI_yun_integration_cost: "Mengurangi Biaya Integrasi untuk [YUN.GetNameDef] sebesar §G[?yun_integration_cost_reduction|%G0]§!"
 CHI_gxc_integration_cost: "Mengurangi Biaya Integrasi untuk [GXC.GetNameDef] sebesar §G[?gxc_integration_cost_reduction|%G0]§!"
 CHI_gdc_integration_cost: "Mengurangi Biaya Integrasi untuk [GDC.GetNameDef] sebesar §G[?gdc_integration_cost_reduction|%G0]§!"
 CHI_victory_over_the_invaders: "Kemenangan atas Penjajah"
 CHI_victory_over_the_invaders_desc: "Para penjajah asing telah dikalahkan dan Tentara Revolusioner Nasional kita yang agung berdiri sebagai pemenang. Perang ini, dan yang lebih penting lagi, pemimpin kami yang terhormat [root.GetLeader], telah menyatukan berbagai provinsi dan masyarakat menjadi satu negara di bawah sinar matahari putih!"
 CHI_remove_guerilla_decisions_tt: "§RHapus§! §Y$PRC_guerilla_warfare_sea_cat$§! Keputusan"
 CHI_petition_territorial_restoration: "Petisi Pemulihan Wilayah"
 CHI_request_territory_trigger_tt: "Semua negara yang dikontrol:\nMerupakan inti dari §Y[ROOT.GetNameWithFlag]§!\nPengontrol: $is_literally_china_tt_NOT$\nSalah satu hal berikut harus benar:\nTidak dimiliki oleh Pengontrol\nPengontrol:\nPartai yang berkuasa saat ini adalah §Y[ROOT.GetRulingIdeology]§!" #The weird indentations are deliberate and is there to make the tooltip look like the real deal!
 CHI_petition_territorial_restoration_desc: "$PRC_restore_territorial_integrity_desc$"
 CHI_crush_the_communists: "Hancurkan [PRC.GetNameDef]"
 CHI_crush_the_communists_desc: "Waktunya telah tiba untuk menyelesaikan apa yang telah kita mulai sejak lama; kehancuran total [PRC.GetNameDef]! Sudah terlalu lama kita diganggu oleh hal-hal lain, namun kita tidak lagi membiarkan gangguan ini terus berlanjut!"
 CHI_request_handover_of_coastal_cities: "Permohonan Serah Terima Kota Pesisir"
 CHI_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_ncns_request_handover_of_coastal_cities: "$CHI_request_handover_of_coastal_cities$"
 CHI_ncns_request_handover_of_coastal_cities_desc: "$PRC_dare_to_struggle_desc$"
 CHI_a_generalissimo_for_all_of_china: "Generalissimo untuk seluruh Tiongkok"
 CHI_a_generalissimo_for_all_of_china_desc: "Perjuangan kami melawan penjajah asing adalah penyakit kulit, namun ancaman internal kami selalu berupa penyakit jantung. Penyakit yang kini telah kita atasi agar kita dapat memimpikan masa depan."
 CHI_empower_the_mtac: "Memberdayakan MTAC"
 CHI_empower_the_mtac_desc: "Komunitas [ROOT.GetNameDef] sedang menuju keharmonisan, namun upaya tersebut belum selesai. Komisi Urusan Mongolia dan Tibet telah mengawasi hubungan dengan kelompok-kelompok yang ada di negara kami, namun dapat memiliki peran yang lebih luas. Kami akan membawa revolusi kepada saudara-saudara kami di luar negeri!"
 CHI_empower_the_mtac_tt: "Membuka keputusan untuk status inti [MON.GetFlag] §Y[MON.GetAdjective]§! dan [TIB.GetFlag] §Y[TIB.GetAdjective]§!."
 CHI_unify_the_admissions_process: "Satukan Proses Penerimaan"
 CHI_unify_the_admissions_process_desc: "Sistem pendidikan tinggi kami terbagi menjadi beberapa lokasi, dan proses pendaftarannya rumit dan terpecah-pecah. Jika kami merestrukturisasi prosesnya menjadi ujian masuk bersama, kami akan memastikan ada tempat untuk setiap siswa yang kompeten."
 CHI_retreat_to_taiwan: "Mundur ke Taiwan"
 CHI_retreat_to_taiwan_desc: "Konflik kami yang kembali terjadi dengan [PRC.GetNameDef] belum tentu menguntungkan kami dan kami semakin kehilangan arah. Semakin banyak orang menyuarakan keprihatinan mereka dan secara terbuka menganjurkan agar kami mundur secara taktis ke Taiwan, untuk membangun kembali kekuatan kami dan bertahan hidup."
 CHI_joining_the_international_community: "Komunitas Internasional"
 CHI_joining_the_international_community_desc: "Sudah terlalu lama kita mencari ke dalam yang hanya memberi kesempatan kepada orang lain untuk mengeksploitasi kita. Kita sekarang harus keluar ke dunia nyata dan bergabung dengan mereka yang memperjuangkan kebebasan, mereka yang mendukung kita di saat-saat paling sulit!"
 CHI_a_world_freed_from_communism: "Dunia yang Bebas dari Komunisme"
 CHI_a_world_freed_from_communism_desc: "Fasisme membakar dunia, namun fasisme bukanlah satu-satunya ideologi yang mengancam umat manusia. Kita harus menyelesaikan misi yang telah kita mulai di negara kita sendiri, dan menyingkirkan pikiran jahat dari dunia ini!"
 CHI_reclaim_the_north: "Rebut kembali wilayah Utara"
 CHI_reclaim_the_north_desc: "Karena kebutuhan, kami harus melepaskan klaim kami atas sebagian besar wilayah utara di masa lalu. Namun banyak hal telah berubah, dan kita mendapati diri kita berada dalam posisi yang jauh lebih kuat sekarang – cukup kuat untuk sekali lagi merebut kembali wilayah utara kita!"
 CHI_subjugate_korea: "$PRC_subjugate_korea$"
 CHI_subjugate_korea_desc: "$PRC_subjugate_korea_desc$"
  # Fascist Branch
 CHI_strengthening_our_resolve: "Memperkuat Tekad kita"
 CHI_strengthening_our_resolve_desc: "Faksi-faksi lama berselisih dan kepemimpinan saat ini tidak cukup kuat untuk mempersatukan kita. Perubahan arah diperlukan karena Republik harus bertahan, bukan bubar."
 CHI_china_reborn: "Tiongkok Terlahir Kembali"
 CHI_china_reborn_desc: "Ide-ide lama hanya membawa kita pada eksploitasi oleh kaum imperialis. Tentu saja diperlukan perubahan mendasar. Kita perlu membentuk kembali masyarakat kita dengan ideologi baru. Kami akan memulai serangkaian kampanye yang kami sebut Gerakan Hidup Baru."
 CHI_co_opt_the_koh_hsin_movement: "Mengkooptasi gerakan Koh-hsin"
 CHI_co_opt_the_koh_hsin_movement_tt: "Mengurangi biaya pemberantasan infiltrasi komunis sebesar §G25%§!"
 CHI_co_opt_the_koh_hsin_movement_desc: "Partai telah menjadi terlalu birokratis dan korup dan kita perlu membersihkan unsur-unsur busuk tersebut. Garis yang lebih kuat tidak hanya bermanfaat, namun juga penting bagi kelangsungan hidup nasional kita!"
 permanently_protected_from_infiltration: "Negara tidak bisa disusupi oleh kekuatan komunis."
 CHI_mend_the_rift_with_hu: "Perbaiki Keretakan dengan Hu"
 CHI_mend_the_rift_with_hu_desc: "Persaingan lama antara [ROOT.GetLeader] dan Hu Hanmin telah cukup lama melemahkan partai. Mengikuti Hanmin berarti dia mempunyai pengaruh yang besar, yang akan bermanfaat bagi bangsa jika kita bisa bersatu."
 CHI_revive_the_western_hills_group: "Bangkitkan kembali Grup Western Hills"
 CHI_revive_the_western_hills_group_desc: "[ROOT.GetNameDefCap] sudah terlalu lama dipengaruhi oleh kekuatan asing. Diperlukan kembalinya tradisi, yaitu garis yang selama ini dipegang oleh Lin Sen dan Dai Jitao. Hal ini akan memungkinkan kita untuk mewujudkan ide-ide Dr. Sun sebagaimana yang dimaksudkan, bebas dari distorsi."
 CHI_reform_the_blue_shirts: "Reformasi Kaus Biru"
 CHI_reform_the_blue_shirts_desc: "Perkumpulan Praktik Tiga Prinsip Rakyat – Perkumpulan Baju Biru (Blue Shirt Society) – telah aktif selama hampir setengah dekade, namun efektivitasnya masih terbatas. Karena belum menyebar di kalangan rakyat jelata, faksi tersebut belum mencapai potensi maksimalnya. Dengan mereformasi organisasi ini sebagai front kerakyatan, kita akan menantang komunis dalam permainan mereka sendiri."
 modify_blue_shirts: "Akan memodifikasi §Y$CHI_blue_shirt_society$§! dengan:"
 CHI_empower_the_bureau_of_investigation_and_statistics: "Memberdayakan Biro Investigasi"
 CHI_empower_the_bureau_of_investigation_and_statistics_desc: "Sejak dahulu kala, pengetahuan tentang musuh dan diri sendiri telah memenangkan pertempuran. Kami membutuhkan sebuah organisasi yang mampu memberikan informasi yang kami perlukan, dan harus memperluas Biro Investigasi dan Statistik Nasional."
 CHI_revise_the_national_curriculum: "Revisi Kurikulum Nasional"
 CHI_revise_the_national_curriculum_desc: "Dengan negara sebesar kita, tidak mengherankan jika terdapat banyak perbedaan pendapat. Kita dapat membakukan dan mengatur sistem pendidikan kita untuk mendorong perilaku tertentu yang diinginkan."
 CHI_target_upper_society: "Sasaran Masyarakat Atas"
 CHI_target_upper_society_desc: "Masyarakat kelas atas telah meninggalkan nilai-nilai yang pantas dan menjadi terlalu tertarik pada rekreasi kosmopolitan, sementara mereka perlu menjadi contoh kehidupan yang bermoral dan berbudi luhur bagi masyarakat umum. Ketika hal ini terjadi, kita dapat mengangkat seluruh bangsa melalui kebangkitan semangat dan melampaui kekayaan materi belaka."
 CHI_outlaw_opposition_parties: "Partai Oposisi yang Melanggar Hukum"
 CHI_outlaw_opposition_parties_desc: "Kuomintang telah mendominasi selama hampir satu dekade, namun partai oposisi masih diperbolehkan. Kami khawatir negara kami berada di persimpangan jalan dan kami perlu membatasi oposisi sampai kami menyelesaikan [JAP.GetNameDef] dan komunis."
 CHI_seek_out_western_fascist_cooperation: "Carilah Kerjasama Barat"
 CHI_seek_out_western_fascist_cooperation_desc: "Karena campur tangan asing di masa lalu, kita tertinggal dalam perkembangan teknis. Betapapun menjijikkannya hal ini, akan lebih bijaksana jika kita mencari kerja sama dengan negara-negara Barat yang bersimpati pada tujuan kita sehingga kita dapat mengejar ketinggalan, sebelum kita membalikkan keadaan..."
 CHI_a_chapter_in_every_village: "Sebuah Bab di Setiap Desa"
 CHI_a_chapter_in_every_village_desc: "Kaus Biru kita telah meraih kesuksesan di perkotaan, namun sebagian besar masyarakat umum tinggal di pedesaan. Kita perlu memperluas organisasi ini agar terwakili di setiap kota, desa, dan dusun."
 CHI_secure_the_northern_front: "Amankan Front Utara"
 CHI_secure_the_northern_front_desc: "Kita telah kehilangan Manchuria karena Jepang, yang sejauh ini merupakan tetangga kita yang terkuat dan paling berbahaya. Kita harus mengamankan perbatasan utara sehingga kita bisa mengawasi Jepang, dan memastikan mereka tidak punya ide untuk memperluas wilayah lebih jauh ke selatan..."
 CHI_a_party_unified: "Sebuah Partai Bersatu"
 CHI_a_party_unified_desc: "Melalui disiplin, moralitas, dan kebajikan, kami telah menjalin persatuan di dalam partai kami. Pertengkaran kecil dan perpecahan sudah berlalu, dan kita bergerak maju di bawah panji biru dan matahari putih. Maju menuju kemenangan akhir atas semua musuh, baik internal maupun eksternal!"
 CHI_a_party_unified_tt: "§RMengirim Chiang Kai-Shek ke Guangzhou selama Insiden Liangguang akan mengakibatkan kematiannya lebih awal.§!"
 CHI_a_popular_movement: "Sebuah Gerakan Populer"
 CHI_a_popular_movement_desc: "Babak baru dalam sejarah kita memerlukan organisasi baru. Semua orang akan mengetahui bahwa kita sebagai masyarakat adalah sebuah gelombang, yang menyapu masyarakat lama, menjadikan setiap anggotanya menjadi bagian dari keseluruhan yang lebih besar ini."
 CHI_a_popular_movement_trigger: "§YKorupsi di Angkatan Bersenjata§! Faktor Wajib Militer lebih dari §Y0%§!"
 CHI_integrate_the_hongmen: "Integrasikan Kelompok Pertahanan"
 CHI_integrate_the_hongmen_desc: "Tiongkok dipenuhi dengan kelompok-kelompok yang dibentuk untuk mempertahankan diri dari penindasan Qing. Sejak revolusi Xinhai, mereka kehilangan tujuan dan menyimpang ke arah yang berbeda. Kita dapat memberikan mereka tujuan sekali lagi dengan menggabungkan mereka, atau dengan meniru organisasi dan praktik mereka."
 CHI_ban_immoral_entertainment: "Larang Hiburan yang Tidak Bermoral"
 CHI_ban_immoral_entertainment_desc: "Bentuk-bentuk hiburan yang dekaden telah menyebar ke wilayah kita dan mencemari moral kita. Kita harus melarang hal ini demi mendukung bentuk-bentuk domestik yang lebih atletis dan artistik serta membentuk satuan tugas untuk menegakkannya."
 CHI_develop_counterinsurgency_tactics: "Taktik Kontra Pemberontakan"
 CHI_develop_counterinsurgency_tactics_desc: "Gerilyawan beroperasi dengan cara yang tidak lazim dan tidak dapat diprediksi, dan kita perlu belajar cara memerangi mereka. Kita harus mengorganisir komisi dan kelompok untuk mengembangkan teknik dan adaptasi terhadap bentuk peperangan baru."
 CHI_develop_counterinsurgency_tactics_tt: "Akan membuat §Y$CHI_counter_infiltration_measures$§! berharga §Gsetengah§!"
 CHI_a_brotherhood_for_china: "Persaudaraan untuk Tiongkok"
 CHI_a_brotherhood_for_china_desc: "Perkumpulan Kaos Biru bagi banyak orang adalah sekelompok orang biadab yang mengganggu perdamaian. Namun, pemimpinnya, Dai Li, memandangnya sebagai persaudaraan, dan itu adalah sudut pandang yang bisa kita ambil untuk memupuk persatuan."
 CHI_nationalize: "Nasionalisasi!"
 CHI_nationalize_desc: "Kita berada dalam masa kritis bagi partai, bangsa, dan rakyat kita, sehingga kepentingan pribadi harus menyerah pada kebutuhan nasional. Di bawah bimbingan langsung kami, kami akan menggunakan pabrik-pabrik ini dengan efisiensi maksimal!"
 CHI_militarize: "Militerisasi!"
 CHI_militarize_desc: "Masyarakat kita sudah menjadi acuh tak acuh terhadap tempat mereka dalam sejarah dan perlu dibangunkan. Kami akan membuat mereka merasakan semangat revolusi dan mempersiapkan mereka untuk menumpas musuh, baik musuh dalam maupun luar negeri."
 CHI_militarize_tt: "Milisi Blueshirt akan dibentuk di semua negara bagian saat ini dan di masa depan dengan §Y$CHI_infiltrated_state_3$§!"
 CHI_productive: "Produktif!"
 CHI_productive_desc: "Tangan kosong tidak menghasilkan apa-apa! Kemalasan tidak hanya menghambat kita, namun juga membantu musuh. Sikap pasif dan apatis perlu diatasi jika kita ingin menang sebagai sebuah partai!"
 CHI_enforce__virtues: "Menegakkan Kebajikan"
 CHI_enforce__virtues_desc: "Namun, banyak orang yang menyia-nyiakan waktu mereka untuk hal-hal yang tidak berguna dan tidak berarti, padahal mereka bisa memperbaiki diri demi kepentingan partai dan bangsa. Kami terlalu lemah dalam penegakan hukum, dan kami harus melipatgandakan upaya kami."
 CHI_whampoa_ideological_primacy: "Keutamaan Ideologis Whampoa"
 CHI_whampoa_ideological_primacy_desc: "Dari Whampoa, petugas kami tidak hanya membawa senjata, tapi juga prinsip. Berbeda dengan prinsip sekolah lain, prinsip Whampoa bisa dipercaya. Kita harus menyalurkan semua pelatihan ideologi melalui sekolah untuk memperkuat bangsa kita secara keseluruhan."
 CHI_postpone_the_tutelage: "Menunda Pengawasan"
 CHI_postpone_the_tutelage_desc: "Meskipun tujuannya tetap pada demokrasi, namun sekarang bukanlah waktu yang tepat, dan krisis yang terjadi saat ini memerlukan tindakan khusus. Kita harus membimbing bangsa ini melewati bahaya sebelum demokrasi dapat berkembang."
 CHI_postpone_the_tutelage_tt: "Membuka keputusan untuk §YMendidik ulang§! §YJenderal Panglima Perang§! tertentu setelah Klik ditaklukkan"
 CHI_second_father_of_the_nation: "Bapak Bangsa Kedua"
 CHI_second_father_of_the_nation_desc: "Sun Yat-sen mengizinkan kami melepaskan belenggu Qing dan akan selalu menjadi Bapak Pertama bangsa kami. Generalissimo Chiang membersihkan partai komunis, dan karena itu ia akan selalu dikenang sebagai Bapak Kedua."
 CHI_weaponise_the_faithful: "Persenjatai Umat Beriman"
 CHI_weaponise_the_faithful_desc: "Mereka yang beriman paling gigih akan berjuang paling keras. Saat ini kami belum memiliki outlet untuk itu, tapi kami bisa membuatnya dan menempatkannya di peringkat pertama. Pengabdian mereka akan menjadi pedang paling tajam bagi kita, menebas setiap musuh."
 CHI_political_advisors_in_every_division: "Penasihat Politik di Setiap Divisi"
 CHI_political_advisors_in_every_division_desc: "Tentara membela negara, sampai tidak bisa. Seringkali negara jatuh ke tangan mereka yang mempunyai senjata, namun kita tidak akan membiarkan hal itu terjadi pada kita. Pejabat politik akan membantu memotivasi angkatan bersenjata kita untuk mengambil tindakan yang tepat."
 CHI_an_alternative_rooted_in_tradition: "Sebuah Alternatif yang Berakar pada Tradisi"
 CHI_an_alternative_rooted_in_tradition_desc: "Liberalisme dan komunisme merupakan konsep asing yang tidak ada artinya di negara [ROOT.GetAdjective]. Hanya sesuatu yang kita ciptakan sendiri yang dapat mendatangkan kemakmuran dan kebanggaan bagi negara kita."
 CHI_an_alternative_rooted_in_tradition_tt: "Meningkatkan biaya infiltrasi untuk [PRC.GetNameDefCap] sebesar: §G+25%§!"
 CHI_expel_the_occupiers: "$PRC_expel_the_occupiers$"
 CHI_expel_the_occupiers_desc: "$PRC_expel_the_occupiers_desc$"
 CHI_put_an_end_to_PRC: "Akhiri [PRC.GetNameDef]"
 CHI_put_an_end_to_PRC_desc: "Yang benar-benar menghalangi kita untuk menyatukan seluruh Tiongkok adalah para komunis yang bertahan di pegunungan, dipimpin oleh [PRC.GetLeader]. Selama mereka masih ada, tidak akan ada Tiongkok yang bersatu. Musuh dalam negeri membuat kita lemah, kelemahan mengundang agresi asing, dan agresi asing membahayakan kedaulatan kita. Oleh karena itu, adalah tugas kita untuk mengakhiri [PRC.GetNameDef]!"
 CHI_reject_the_nine_powers: "Tolak Sembilan Kekuatan"
 CHI_reject_the_nine_powers_desc: "Perjanjian-perjanjian yang dipaksakan kepada kami oleh orang-orang asing di luar negeri diberlakukan pada saat kita lemah, namun kini kita dapat menolaknya. Beritahukan kepada setiap pihak yang menandatangani: Kami tidak berhutang apapun pada pihak asing!"
 CHI_setting_a_new_standard: "Menetapkan Standar Baru"
 CHI_setting_a_new_standard_desc: "Tentara kami terlalu dipengaruhi oleh pemikiran dan doktrin Barat, tapi kami adalah negara Sun Tzu dan bukan Clausewitz. Melalui perubahan struktural dan kerja ideologis, kita telah membentuk kembali angkatan bersenjata kita sesuai dengan gambaran kita sendiri."
 CHI_eternal_revolution: "Revolusi Abadi"
 CHI_eternal_revolution_desc: "Keberhasilan kami telah menunjukkan kemanjuran sistem kami dibandingkan ide-ide lama dan asing. Api revolusioner berkobar di hati setiap rekan senegaranya dan kita perlu memanfaatkannya untuk menyebarkan revolusi lebih jauh lagi."
 CHI_eternal_revolution_tt: "Mengizinkan §YMendeklarasikan Zona Perang§! di Negara yang Diklaim"
 CHI_reclaim_what_was_lost: "Raih Kembali Apa yang Hilang"
 CHI_reclaim_what_was_lost_desc: "Qing mewarisi kerajaan terbesar yang pernah kita lihat, dan mereka menyia-nyiakannya demi keuntungan kekuatan asing. Hal ini telah mempermalukan kita sebagai bangsa, bangsa, dan partai. Kita perlu memperbaiki parodi ini dan memulihkan martabat Tiongkok."
 CHI_bring_the_wayward_back_into_the_fold: "Bawa Yang Tersesat Kembali ke Kelompok"
 CHI_bring_the_wayward_back_into_the_fold_desc: "Sejak revolusi Xinhai beberapa saudara kita telah disesatkan dan disesatkan. Mereka telah diberitahu bahwa mereka akan lebih baik jika terpisah dari kelompok. Sudah waktunya bagi kita untuk mengembalikan hal itu dan mengembalikan mereka ke dalam kelompok."
 CHI_retake_coastal_cities: "Rebut kembali Kota Pesisir"
 CHI_retake_coastal_cities_desc: "Sudah terlalu lama kaum imperialis Barat memaksakan kehendaknya kepada kita. Waktunya telah tiba bagi kita untuk akhirnya mendapatkan kembali apa yang telah dicuri. [326.GetName], [729.GetName], dan [728.GetName] harus sekali lagi menjadi bagian dari dunia kita!"
 CHI_a_new_middle_kingdom: "Kerajaan Tengah Baru"
 CHI_a_new_middle_kingdom_desc: "Di era sebelumnya, kita adalah titik di mana dunia berputar. Hal ini mengisolasi kita dari dunia, dan membuat era berlalu begitu saja. Kita tidak akan melakukan kesalahan itu lagi, dan kali ini kitalah yang akan menentukan nasib kita sendiri, dan nasib orang lain."
 CHI_remove_infiltration_decisions_tt: "§RHapus§! §Y$PRC_infiltration_sea_cat$§! Keputusan"
 CHI_the_southern_mandate: "Mandat Selatan"
 CHI_the_southern_mandate_desc: "Di sebelah selatan terletak tanah yang kaya akan sumber daya dan masyarakat seperti kita. Kami memegang hak atas tanah ini dari hubungan kuno kami dan inilah saatnya kami bergerak ke selatan."
 CHI_the_northern_mandate: "Mandat Utara"
 CHI_the_northern_mandate_desc: "Di sebelah utara tanah kami terdapat lahan kosong, seperti berlian di tengah kesulitan, yang [SOV.GetNameDef] terbuang sia-sia. Hanya mereka yang mampu melihat potensi sebenarnya dari lahan ini yang boleh memilikinya, dan itulah kami!"
 CHI_the_greater_game: "Permainan Yang Lebih Besar"
 CHI_the_greater_game_desc: "Kaum imperialis memainkan permainan mereka di Asia Tengah, namun hanya memukul kepala mereka di wilayah tersebut. Ini saatnya untuk berjalan ke barat dan membawa pasukan kita melintasi stepa sekali lagi."
 CHI_cradle_of_civilization: "Tempat Lahirnya Peradaban"
 CHI_cradle_of_civilization_desc: "Dari perairan berlumpur Sungai Kuning muncullah sebuah peradaban yang membentuk umat manusia. Kerajaan bangkit dan runtuh, namun kejayaan Tiongkok kuno bersinar di bumi selamanya dan begitu pula supremasi kita."
 CHI_cradle_of_civilization_tt: "Membuka keputusan untuk mengintegrasikan §Ynegara bagian Asia§! yang §YDiklaim§! oleh kami ketika mencapai §YKepatuhan§! yang cukup tinggi"
  # Army Focuses 
 CHI_military_affairs_commission_sea: "Komisi Urusan Militer"
 CHI_military_affairs_commission_sea_desc: "Landasan bagi militer yang efisien adalah komando tinggi yang baik. Karena Komisi Urusan Militer adalah organisasi pertahanan negara tertinggi, kita harus memastikan kompetensinya."
 CHI_set_up_an_nco_school: "Mendirikan Sekolah NCO"
 CHI_set_up_an_nco_school_desc: "Sebagian besar anggota militer kita tidak memiliki pendidikan formal yang mungkin dimaafkan bagi prajurit biasa, namun menjadi masalah ketika naik pangkat. Kita perlu membangun sistem untuk melatih bintara kita sehingga kita bisa memastikan kualitasnya."
 CHI_formalize_field_promotions: "Formalisasikan Promosi Lapangan"
 CHI_formalize_field_promotions_desc: "Idealnya, kita harus memiliki tentara yang terlatih dan terdidik sepenuhnya. Tapi ini bukan dunia itu. Dalam keadaan sulit saat ini, menempatkan pasukan di garis depan adalah prioritas kami, dan semakin cepat kami melakukannya, semakin baik. Kami akan membuat program untuk menemukan orang-orang di antara prajurit biasa yang bisa memimpin rekan-rekan mereka maju."
 CHI_crackdown_on_corruption_in_recruitment: "Pemberantasan Korupsi"
 CHI_crackdown_on_corruption_in_recruitment_desc: "Sejak tentara republik dibentuk, terdapat masalah sistemik dalam perekrutan. Orang-orang telah membayar untuk keluar dari layanan dan akuntansi kreatif telah digunakan untuk menggelapkan gaji. Hal ini harus diakhiri jika kita ingin bertahan dari serangan dunia modern karena tidak ada tempat bagi inefisiensi."
 CHI_crackdown_on_corruption_in_recruitment_tt: "§Y$CHI_he_yingqin$§! tersedia sebagai level §Y3§! Umum"
 CHI_form_the_combined_logistics_command: "Bentuk Komando Logistik Gabungan"
 CHI_form_the_combined_logistics_command_desc: "Kini setelah angkatan bersenjata kita diorganisasi ulang dan secara efisien menghadapi ancaman apa pun terhadap negara kita, kita menghadapi masalah lain. Meskipun situasi logistik kami telah membaik, angkatan bersenjata kami kurang terkoordinasi dalam sistem distribusi logistik. Kita harus segera mengatasi masalah ini!"
 CHI_reorganise_the_train: "Atur Ulang Kereta"
 CHI_reorganise_the_train_desc: "Organisasi pemasok kami tidak pernah berkembang sesuai skala atau kompleksitas yang kami perlukan. Reorganisasi menyeluruh akan memberdayakan kita untuk menempatkan lebih banyak pasukan dalam pertempuran."
 CHI_rely_on_locals: "Andalkan Penduduk Lokal"
 CHI_rely_on_locals_desc: "Mendirikan organisasi penuh yang dapat digunakan oleh pasukan kita adalah hal yang rumit, memakan waktu dan mahal. Sejarah menunjukkan kepada kita sebuah alternatif, mengapa mengirimkan apa yang dapat ditemukan secara lokal. Jika kita mengandalkan petani dan pekerja yang menghuni lahan luas kita, kita bisa mengatasi perbedaan yang ditinggalkan oleh sistem kita."
 CHI_focus_on_meritocratic_principles: "Fokus pada Prinsip Meritokratis"
 CHI_focus_on_meritocratic_principles_desc: "Nepotisme, penyuapan, dan korupsi adalah kutukan bagi militer yang efisien. Kekejian ini sudah terlalu banyak terjadi di pasukan kita, dan hal ini perlu diubah. Mendirikan struktur untuk mempromosikan individu-individu yang paling berjasa ke posisi yang tepat akan menjamin kemenangan."
 CHI_focus_on_meritocratic_principles_tt: "Memungkinkan penghapusan §YWhampoa Primacy§! Roh Tentara secara manual"
 CHI_protracted_warfare: "Peperangan yang Berlarut-larut"
 CHI_protracted_warfare_desc: "Sejak [JAP.GetNameDef] mengalahkan Rusia, masyarakat Rusia percaya bahwa tindakan cepat dan agresif adalah jalan menuju kemenangan. Hal ini menyebabkan mereka mempunyai kekuatan militer yang tidak bisa mempertahankan kekuasaan, jadi jika kita menolak kemenangan cepat mereka, unit mereka akan hancur dalam waktu singkat."
 CHI_decisive_battles: "Pertempuran yang Menentukan"
 CHI_decisive_battles_desc: "Semua kemenangan tidak memiliki bobot yang sama, seperti yang ditunjukkan oleh [JAP.GetNameDef] pada tahun 1905. Kita harus memfokuskan kekuatan kita untuk memenangkan pertempuran penting dengan mengambil inisiatif untuk menyerang Manchuria."
 CHI_invest_in_mountain_guns: "Berinvestasi di Senjata Gunung"
 CHI_invest_in_mountain_guns_desc: "Tanah kami tidak mudah untuk dilintasi, dan memindahkan artileri berat tradisional melalui wilayah tersebut merupakan tantangan bagi sebagian besar orang. Membuat senjata kita dapat dibongkar sesuka hati adalah solusi alami untuk masalah ini, dan patut untuk diselidiki."
 CHI_repurpose_fort_artillery: "Gunakan kembali Artileri Benteng"
 CHI_repurpose_fort_artillery_desc: "Peperangan tidak bisa lagi dibendung oleh benteng-benteng penting, akhir dari perang besar terakhir menunjukkan hal itu. Meskipun strukturnya mungkin tidak memiliki banyak nilai, artileri di dalamnya masih dapat menembaki musuh."
 CHI_repurpose_fort_artillery_tt: "§RAnda tidak mengontrol benteng apa pun untuk dibongkar§!"
 CHI_fund_the_marine_corp: "Mendanai Korps Marinir"
 CHI_fund_the_marine_corp_desc: "Pasukan kita sangat besar dan kekuatannya tidak dapat diragukan, namun bisa menjadi instrumen yang tumpul bila digunakan secara tidak tepat. Korps khusus infanteri angkatan laut profesional yang dilatih untuk mempertahankan garis pantai kita akan bernilai sepuluh kali lipat dari jumlah pasukan biasa, dan ketika saatnya tiba, proyeksikan kekuatan kita atas lautan."
 CHI_the_4_defence_areas: "4 Area Pertahanan"
 CHI_the_4_defence_areas_desc: "Jika kita ingin berhasil mempertahankan negara kita yang besar, maka rencana yang komprehensif adalah hal yang terpenting untuk mencapai kesuksesan. Kami akan membagi negara menjadi empat zona dan menunjuk seorang komandan yang sesuai untuk masing-masing zona, ini akan menjamin keamanan lokal dan perlawanan yang efisien."
 CHI_defence_in_depth: "Pertahanan secara Mendalam"
 CHI_defence_in_depth_desc: "Pertahanan yang tepat tidak boleh bersifat statis dan kita perlu memasukkan hal ini ke dalam strategi kita. Kita tahu bahwa [JAP.GetAdjective] tidak memiliki daya tahan sehingga semakin kita dapat menarik mereka ke arah yang lebih baik. Pasang surutnya pertempuran tidak boleh merusak bendungan angkatan bersenjata kita."
 CHI_prepare_the_war_zones: "Siapkan Zona Perang"
 CHI_prepare_the_war_zones_desc: "Kita perlu mengatur ulang pasukan kita berdasarkan wilayah untuk mengetahui siapa yang bertanggung jawab atas wilayah mana. Hal ini akan memungkinkan kami merencanakan operasi yang tepat untuk area tersebut dan memaksimalkan kemampuan kami untuk menerobos."
 CHI_guerrilla_warfare: "Perang Gerilya"
 CHI_guerrilla_warfare_desc: "Peperangan konvensional memungkinkan kita untuk melawan sampai tingkat tertentu, namun berperang di wilayah kita sendiri memungkinkan kita menggunakan metode yang lebih tidak konvensional. Menyusup ke negara bagian yang dikuasai musuh dan mendatangkan malapetaka pada elemen belakang adalah cara berperang yang [JAP.GetNameDef] sama sekali tidak siap untuk dilakukan."
 CHI_guerrilla_warfare_tt: "Membuka Keputusan §Y$PRC_guerilla_warfare_sea_cat$§!"
 CHI_rapidity_is_the_essence_of_war: "Kecepatan adalah Inti dari Perang"
 CHI_rapidity_is_the_essence_of_war_desc: "Kecepatan dan kejutan adalah senjata terbaik kita, dan mempelajari cara memanfaatkan elemen-elemen ini akan menjadi hal terpenting dalam perang modern. Manuver yang berani dan cepat akan membuat musuh kehilangan keseimbangan sehingga memungkinkan kita menyerang lebih dalam dan dengan perlawanan yang lebih sedikit."
 CHI_organise_the_200th_division: "Atur Divisi ke-200"
 CHI_organise_the_200th_division_desc: "Pasukan lapis baja merupakan inovasi terbesar dalam peperangan abad ini, dan sayangnya kita masih tertinggal. Membentuk divisi lapis baja dan menunjuk seorang komandan yang cocok untuk memimpin serangan akan menjadi pengganda kekuatan yang akan membuka jalan menuju kemenangan."
 CHI_organise_the_200th_division_tt: "Dapatkan satu unit §YArmor§! elit di [ROOT.capital.GetName]"
 CHI_motorise_our_infantry: "Gerakkan Infanteri kita"
 CHI_motorise_our_infantry_desc: "Sumber daya manusia kami sangat banyak dan selalu menjadi sumber kekuatan kami. Transportasi motor modern memberdayakan prajurit biasa, membawanya ke medan tempur lebih cepat dan siap menyerang dengan keras. Seseorang yang berada di tempat yang tepat, dengan senapan di tangan, akan selalu efisien."
 CHI_bog_them_down_in_the_centre: "Bom mereka di tengah"
 CHI_bog_them_down_in_the_centre_modify: "Akan mengubah bonus dari §Y$CHI_bog_them_down$§! untuk memberikan:"
 CHI_bog_them_down_in_the_centre_desc: "Kami tahu bahwa kami tidak dapat menghentikan [JAP.GetNameDef] di perbatasan, dan kami perlu memilih garis pertahanan lain dengan hati-hati. Berpusat di sekitar sungai Yangtze akan menjadi cara yang efisien untuk menghentikan agresor dan menjadikan wilayah tersebut sebagai titik tumpu pertahanan kita secara keseluruhan. Namun, tindakan merencanakan pertahanan kita untuk wilayah tertentu lebih jauh lagi."
 CHI_appear_where_you_are_not_expected: "Muncul di Tempat yang Tidak Anda Harapkan"
 CHI_appear_where_you_are_not_expected_desc: "Tidak ada komandan sukses yang pernah menyerang musuh di tempat dan cara yang diharapkan. Penipuan adalah dasar perang dan kita harus selalu terlihat lemah ketika kita kuat, dan kuat ketika kita lemah."
 CHI_declare_war_zone_modify: "Akan mengubah bonus dari §Y$CHI_declare_war_zone$§! untuk memberikan:"
 CHI_relocate_factories_from_the_coast: "Relokasi Pabrik dari Pesisir"
 CHI_relocate_factories_from_the_coast_desc: "Kita mempunyai teka-teki strategis yang serius. Pusat-pusat industri kita berada di sepanjang garis pantai dan terancam jatuh ke tangan musuh. Tanpa manufaktur, resistensi diperkirakan tidak akan bertahan lama. Kami akan memindahkan produksi kami ke pedalaman agar produksinya dapat disimpan dengan aman."
 CHI_relocate_factories_from_the_coast_tt: "Mengizinkan relokasi §YMIO§! dan §YPabrik§!"
 CHI_relocate_factories_from_the_coast_tt_no_aat: "Mengizinkan relokasi §YPabrik§!"
 CHI_state_aa: "Perisai Menuju Langit"
 CHI_state_aa_desc: "Di dunia baru ini musuh tidak hanya menyerang dari darat dan laut, tapi dari udara juga. Mempersiapkan diri kita menghadapi serangan gencar yang pasti akan datang dari langit dengan mengarahkan senjata kita ke atas sangatlah penting jika kita ingin menahan para penjajah."
 CHI_coastal_forts: "Tembok ke Laut"
 CHI_coastal_forts_desc: "Meskipun penjajah asing dan boneka-bonekanya pertama-tama akan menyerang dari utara, kita dapat yakin bahwa pada akhirnya mereka juga akan menyerang dari laut. Kami siap membuang mereka kembali ke laut begitu mereka berani menginjakkan kaki di tanah kami."
 CHI_salvage_enemy_equipment: "Selamatkan Peralatan Musuh"
 CHI_salvage_enemy_equipment_desc: "Kebutuhan Tentara Revolusioner Nasional tidak dapat dipenuhi oleh industri kita. Unit kami dapat mengkompensasi sebagian perbedaan tersebut dengan menggunakan kembali apa yang kami temukan di kamp musuh."
 CHI_salvage_enemy_equipment_random_generals_tt: "§YLima§! pemimpin militer yang dipilih secara acak akan mendapatkan §Y$Scavenger$§!:\n-$MODIFIER_EQUIPMENT_CAPTURE$: §G+3%§!"
 CHI_commemorate_the_labour_corps: "Memperingati Korps Buruh"
 CHI_commemorate_the_labour_corps_desc: "Rakyat kami pergi ke luar negeri dan bekerja keras demi pengakuan bangsa kami, menunjukkan ketekunan di medan perang besar. Meskipun [ENG.GetAdjective] dan [FRA.GetAdjective] tidak mengingatnya, kami mengingatnya, dan kami akan menghormati karya mereka dengan meningkatkan ingatan mereka dan mencamkan pembelajaran mereka."
 CHI_utilise_the_terrain: "Memanfaatkan Medan"
 CHI_utilise_the_terrain_desc: "Divisi kami tidak dilengkapi dengan peralatan terkini, juga tidak memiliki standar pelatihan yang seragam, tetapi jika ada sesuatu yang kami ketahui secara mendalam, itu adalah tanah kami sendiri. Kita dapat menggunakan setiap saluran air, bukit, dan ladang untuk keuntungan kita, dan dengan demikian menjadikan pengalaman siapa pun yang berani menyerbu neraka."
 CHI_train_for_asymmetry: "Berlatih untuk Asimetri"
 CHI_train_for_asymmetry_desc: "Perang tidak pernah adil dan kita tidak pernah bisa mengharapkan hal itu terjadi. Ada pihak-pihak yang memiliki kekuatan militer yang lebih kuat yang akan mencoba menundukkan kita dan kita perlu menemukan cara untuk menyamakan kedudukan. Melatih militer kita dan para pemimpinnya untuk menemukan cara baru dalam berperang memang sulit, namun manfaatnya tidak dapat disangkal."
 CHI_train_for_asymmetry_guerilla_cost_tt: "§GMembagi dua biaya§! untuk mengambil §Y$PRC_guerilla_warfare_sea_cat$§! Keputusan"
 CHI_train_for_asymmetry_random_generals_tt: "§YTiga§! pemimpin tentara yang dipilih secara acak akan mendapatkan §YPejuang Gerilya§!:\n-$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+50%§!"
 CHI_know_thy_enemy: "Kenali Musuhmu"
 CHI_know_thy_enemy_desc: "Kita perlu mengetahui cara menemukan titik di garis musuh di mana kita dapat menerapkan kekuatan dan memanfaatkan terobosan."
 CHI_know_thy_enemy_tt: "Membuka versi Force Attack yang ditingkatkan yang tidak kehilangan kubu saat menyerang."
 CHI_know_thy_self: "Kenali Dirimu"
 CHI_know_thy_self_desc: "Memahami musuh akan memberi kita kemenangan, namun kemenangan akhir hanya bisa didapat melalui pengetahuan akan kemampuan diri sendiri juga. Melembagakan proses penilaian diri yang ketat akan mengungkap kelemahan kita, tetapi juga kekuatan kita."
 CHI_river_crossing_studies: "Studi Penyeberangan Sungai"
 CHI_river_crossing_studies_desc: "Tiongkok adalah negeri dengan sungai-sungai besar dan tentara mana pun yang akan beroperasi di dalamnya harus belajar cara berperang melintasi sungai-sungai tersebut. Kami berada pada posisi yang tepat untuk belajar dari hal ini dan mempraktikkan pembelajaran tersebut. Pembelajaran yang bermanfaat bagi kita dalam mengusir penjajah dan membawa perlawanan ke luar negeri."
 CHI_armoured_car_tactics: "Taktik Mobil Lapis Baja"
 CHI_armoured_car_tactics_desc: "Sebagian besar tentara mendapatkan unit lapis baja yang semakin berat dalam perlombaan kekuatan industri. Namun, seseorang tidak akan lebih efisien jika menggunakan kapak ketika pisau dibutuhkan."
 CHI_serve_the_country_with_utmost_loyalty: "Melayani Negara dengan Loyalitas Tertinggi"
 CHI_serve_the_country_with_utmost_loyalty_desc: "Kami telah menunjukkan keberanian kami kepada musuh dan menghentikan mereka sampai mati. Karena dedikasi dan pengabdian yang tak tergoyahkan kepada negara kita, tidak ada penjajah yang mampu menundukkan kita!"
 CHI_the_well_timed_swoop_of_a_falcon: "Sapuan Falcon yang Tepat Waktu"
 CHI_the_well_timed_swoop_of_a_falcon_desc: "Kami telah menguasai cara menyerang dan menghancurkan musuh kami. Dari mengusir penjajah hingga menyerang rumah mereka sendiri, pengetahuan lama masih berlaku hingga hari ini ketika kita bergerak menuju kemenangan!"
  # Air Focuses
 CHI_rocaf: "Memperkuat Angkatan Udara Nasionalis" # was Establish the ROCAF
 CHI_rocaf_desc: "Untuk mengamankan langit [ROOT.GetName] dan memproyeksikan kekuatan di luar perbatasan kita, kita harus memperkuat Angkatan Udara. Investasi dalam doktrin dan keahlian teknis meletakkan dasar bagi senjata udara modern yang mampu menantang musuh mana pun."
 CHI_officialize_the_rocaf: "Resmikan Angkatan Udara Republik Tiongkok"
 CHI_officialize_the_rocaf_desc: "Angkatan udara sudah terlalu lama menjadi entitas tidak resmi. Kini dengan perkembangan teknologi dan taktis yang telah kita lakukan, Komisi Urusan Penerbangan dapat direorganisasi menjadi Markas Komando Angkatan Udara. ROCAF harus menjadi cabang dinas yang sepenuhnya terpisah, independen dari angkatan darat dan angkatan laut."
 CHI_bring_the_war_home: "Bawa Pulang Perang"
 CHI_bring_the_war_home_desc: "Musuh-musuh kita harus belajar bahwa tidak ada bagian wilayah mereka yang berada di luar jangkauan. Dengan pengeboman yang ditargetkan dan perang psikologis, kami akan menyerang secara mendalam dan mengganggu keinginan musuh untuk berperang."
 CHI_bring_the_war_home_tt: "Membuka penggerebekan berikut:\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_open_afamf_plants: "Buka Pabrik AFAMF"
 CHI_open_afamf_plants_desc: "Untuk mengembangkan pesawat baru, seperti Chu XP-0 yang diimpikan oleh Mayjen Chu Chia-Jen, kita harus membuka fasilitas yang mampu mendukung dan memproduksi pesawat tempur ringan dan pengebom tukik. Lokasi ideal untuk ini adalah di Kunming, tapi tempat mana pun akan bagus asalkan kita bisa membuat sesuatu yang bisa melawan musuh kita di langit."
 CHI_open_afamf_plants_tt: "Jika kami atau subjek kami mengendalikan §Y[325.GetName]§!, kami akan mendapatkan Pabrik Militer tambahan di sana"
 CHI_projecting_power: "Memproyeksikan Kekuatan"
 CHI_projecting_power_desc: "Dengan memperluas jangkauan udara melampaui garis depan, kami bersiap menyerang kapan pun ada peluang. Proyeksi kekuatan udara bukan lagi sebuah ambisi tetapi sebuah kebutuhan strategis."
 CHI_strike_at_what_is_weak: "Serang Apa yang Lemah"
 CHI_strike_at_what_is_weak_desc: "Kami tidak akan menghadapi kekuatan secara langsung. Sebaliknya, doktrin kita harus menekankan penargetan titik-titik musuh yang paling rentan dengan tepat dan gigih."
 CHI_a_wind_that_rises_in_the_daytime_lasts_long: "Angin yang Meningkat di Siang Hari Berlangsung Lama"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc: "Pengeboman yang berkelanjutan di siang hari menawarkan pendekatan yang stabil dan metodis dalam peperangan udara. Kita harus memanfaatkan visibilitas dan koordinasi untuk memberikan serangan yang efektif."
 CHI_but_a_night_breeze_soon_falls: "Tapi Angin Malam Segera Turun"
 CHI_but_a_night_breeze_soon_falls_desc: "Operasi malam hari mungkin penuh risiko, namun dengan pelatihan yang ditingkatkan, pilot kami dapat meminimalkan kerugian dalam kegelapan. Musuh tidak akan pernah melihat kita datang..."
 CHI_escort_efficiency: "Efisiensi Pengawalan"
 CHI_escort_efficiency_desc: "Pengawalan pesawat tempur adalah perisai bagi pembom kami. Meningkatkan koordinasi dan cakupan memastikan lebih banyak orang kembali ke pangkalan dalam keadaan utuh, siap untuk serangan mendadak berikutnya."
 CHI_controlling_our_skies: "Mengontrol Langit kita"
 CHI_controlling_our_skies_desc: "Sebelum kita mendominasi di luar negeri, kita harus menguasai langit di dalam negeri. Jaringan pertahanan udara yang disiplin merupakan tulang punggung keamanan nasional."
 CHI_interception_detection: "Deteksi Intersepsi"
 CHI_interception_detection_desc: "Deteksi tepat waktu memungkinkan kita menyerang sebelum musuh menyerang. Kami akan meningkatkan radar dan jaringan observasi kami untuk mendapatkan keunggulan kritis tersebut."
 CHI_focus_on_positional_advantage: "Fokus pada Keunggulan Posisi"
 CHI_focus_on_positional_advantage_desc: "Pertempuran udara bukan hanya soal jumlah atau kecepatan. Keunggulannya terletak pada ketinggian, sudut dan kesadaran. Kita harus mengajari pilot kita untuk mengeksploitasi setiap sisi."
 CHI_effectivize_ground_crew_usage: "Mengefisienkan Penggunaan Kru Darat"
 CHI_effectivize_ground_crew_usage_desc: "Efisiensi di lapangan sama pentingnya dengan kinerja di angkasa. Menyederhanakan tugas awak dan logistik akan membuat lebih banyak pesawat tetap mengudara."
 CHI_coordinate_with_the_army: "Berkoordinasi Dengan Angkatan Darat"
 CHI_coordinate_with_the_army_desc: "Kemenangan datang dari kesatuan senjata. Angkatan udara dan darat kita harus beroperasi dengan satu pikiran untuk satu misi."
 CHI_an_appropriate_design: "Desain yang Sesuai"
 CHI_an_appropriate_design_desc: "Pesawat kami harus sesuai dengan doktrin kami. Baik dalam hal jangkauan maupun ketahanan, kami akan mengejar desain yang sesuai dengan kebutuhan operasional kami."
 CHI_an_appropriate_design_3_tt: "Jika §Y$CHI_projecting_power$§! telah diambil:\n"
 CHI_an_appropriate_design_2_tt: "Jika §Y$CHI_controlling_our_skies$§! telah diambil:\n"
 CHI_reorganise_the_central_armys_academy_aviation_corps: "Reorganisasi Korps Penerbangan Akademi"
 CHI_reorganise_the_central_armys_academy_aviation_corps_desc: "Pelatihan harus berkembang seiring dengan teknologi. Kami akan merombak korps penerbangan kami untuk menghasilkan penerbang modern dan berkemampuan yang cocok untuk pertempuran besok."
 CHI_formalise_training_regime: "Formalisasikan Rezim Pelatihan"
 CHI_formalise_training_regime_desc: "Rezim pelatihan yang konsisten dan ketat adalah kunci untuk mengurangi kerugian dan meningkatkan kinerja. Standardisasi dimulai sekarang."
 CHI_conserve_our_pilots: "Lindungi Pilot Kita"
 CHI_conserve_our_pilots_desc: "Pilot tidak mudah diganti. Dengan mengurangi risiko dan meningkatkan kemampuan bertahan hidup, kami melestarikan pengalaman dan mempertahankan kekuatan tempur."
 CHI_camco_primacy: "$CHI_camco_organization_sea$ Keutamaan"
 CHI_camco_primacy_desc: "CAMCO mewakili mitra domestik terbaik kami untuk pengembangan udara. Memprioritaskan kemampuan mereka akan memastikan bahwa produksi sejalan dengan ambisi."
 CHI_SINAW_primacy: "$CHI_sinaw_organization_sea$ Keutamaan"
 CHI_SINAW_primacy_desc: "SINAW menawarkan inovasi teknis yang tidak bisa dilakukan CAMCO. Berinvestasi dalam ekspansi mereka membawa kita semakin setara dengan kekuatan asing."
 CHI_initiate_the_sky_projects: "Memulai Proyek Langit"
 CHI_initiate_the_sky_projects_desc: "Peroketan dan tenaga penggerak canggih membuka opsi strategis baru. Kami akan mendanai inisiatif eksperimental dengan mempertimbangkan manfaat jangka panjang."
 CHI_focus_on_the_Tianlong_project: "Fokus pada Proyek Tianlong"
 CHI_focus_on_the_Tianlong_project_desc: "Propulsi jet adalah masa depan peperangan udara. Proyek Tianlong berada di garis depan evolusi tersebut."
 CHI_VTOL_experiments: "Eksperimen VTOL"
 CHI_VTOL_experiments_desc: "Pesawat lepas landas vertikal menjanjikan fleksibilitas di medan yang tidak terduga. Kami akan memulai uji coba untuk menilai peran mereka dalam pertempuran modern."
 CHI_hongxiang_force: "Pasukan Terjun Payung Yunnan"
 CHI_hongxiang_force_desc: "Melalui kerja sama dengan sekutu dan rekan-rekan kami di bidang penerbangan, kami telah mampu membangun program pelatihan domestik untuk operasi parasut militer."
 # Navy focuses
 CHI_republic_of_china_navy: "Angkatan Laut Republik Tiongkok"
 CHI_republic_of_china_navy_desc: "Angkatan Laut Pusat mempunyai masa lalu yang sulit, dengan pendanaan yang buruk dan kendali wilayah pesisir yang tidak menentu menyebabkan kapal-kapal kita berada dalam kondisi yang buruk. Dengan adanya masalah yang akan terjadi, tujuan kami adalah melupakan tantangan tersebut."
 CHI_foreign_acquisition: "Akuisisi Asing"
 CHI_foreign_acquisition_desc: "Meskipun kami bermaksud menjadikan hal ini sebagai kemunduran sementara, kami harus menyadari bahwa negara-negara lain masih jauh melampaui kami dalam hal kemajuan teknologi angkatan laut. Modernisasi angkatan laut kita harus dimulai dengan pendekatan kepada donatur yang unggul secara teknologi."
 CHI_develop_northern_naval_logistics: "Mengembangkan Logistik Angkatan Laut Utara"
 CHI_develop_northern_naval_logistics_desc: "Secara resmi pulih dari Jepang pada tahun 1922, Qingdao mewakili kota pelabuhan strategis utama yang harus berperan dalam upaya militerisasi angkatan laut kita."
 CHI_develop_southern_naval_logistics: "Mengembangkan Logistik Angkatan Laut Selatan"
 CHI_develop_southern_naval_logistics_desc: "Pesisir Selatan kita, yang penuh dengan wilayah eksklave kolonialis, sangat kurang mendapat pertahanan. Jika kita ingin bertemu dengan negara-negara Barat sesuai keinginan mereka, maka reklamasi dan pengembangan wilayah penting ini adalah suatu keharusan."
 CHI_concerted_push: "Dorongan Terpadu"
 CHI_concerted_push_desc: "Berkali-kali masyarakat Tiongkok menunjukkan kemampuan beradaptasi mereka dalam menghadapi kesulitan. Situasi ini tidak berbeda. Kepemimpinan kita telah menyatakan perlunya angkatan laut untuk menyaingi negara-negara besar, dan perekonomian kita akan mampu menghadapi tantangan tersebut."
 CHI_local_alloy_commission: "Komisi Paduan Lokal"
 CHI_local_alloy_commission_desc: "Tanah kami merupakan sumber kekayaan mineral alam yang melimpah, namun kami belum memanfaatkannya. Menjelajahi kemungkinan-kemungkinan yang kita miliki di sini pasti akan membuahkan hasil di masa depan."
 CHI_deny_the_enemy: "Tolak Musuh"
 CHI_deny_the_enemy_desc: "Meskipun keunggulan kita di darat tidak tertandingi, mungkin hal terbaik yang dapat kita harapkan ketika kita merevitalisasi angkatan laut kita yang sedang lemah adalah penolakan operasi musuh."
 CHI_dominate_the_enemy: "Dominasi Musuh"
 CHI_dominate_the_enemy_desc: "Kami akan menandingi musuh kami dengan syarat yang setara, apa pun risikonya."
 CHI_navy_spooks: "Mengembangkan Badan Intelijen Angkatan Laut"
 CHI_navy_spooks_desc: "Lautan di sekitar Tiongkok merupakan pusat aktivitas perdagangan yang ramai. Di mana ada pedagang, di situ ada rumor. Di mana ada rumor, di situ ada peluang..."
 CHI_promote_admiral: "Promosikan Laksamana"
 CHI_promote_admiral_desc: "Upaya pembangunan angkatan laut kita baru-baru ini pada akhirnya akan membuat kapal perang abad ke-19 kita yang sakit menjadi usang. Namun hal ini merupakan peluang untuk mengubahnya menjadi kapal pelatihan bagi awak dan komandan; dengan program pelatihan yang dioptimalkan berdasarkan arah strategis angkatan laut kita."
 CHI_promote_admiral_tt: "Jika §Y$CHI_deny_the_enemy$§! telah diambil maka semua laksamana akan mendapatkan sifat §Y$green_water_expert$§!\n\nJika §Y$CHI_dominate_the_enemy$§! telah diambil maka semua laksamana akan mendapatkan sifat §Y$blue_water_expert$§!"
 CHI_promote_admiral_dingwen_tt: "Mempromosikan §Y$CHI_jiang_dingwen_admiral$§! menjadi Laksamana"
 CHI_heavy_ship_research: "Penelitian Kapal Berat"
 CHI_heavy_ship_research_desc: "Produksi kapal perang dalam negeri sangat penting untuk mengimbangi kekuatan regional dan kolonial yang telah menjarah negara kita selama ini. Meskipun teknologi kita mungkin merugikan kita, proses manufaktur dan kemauan karyawan kitalah yang akan mampu mengatasinya."
 CHI_strike_from_below: "Serang dari Bawah"
 CHI_strike_from_below_desc: "Jerman telah membuktikan bahwa suatu negara yang berada di bawah ancaman kekuatan angkatan laut yang dominan dapat mengandalkan armada bawah permukaan yang kuat untuk melindungi kepentingannya. Ketika kita berada dalam situasi serupa, kita akan mencari pelajaran di Barat."
 CHI_fund_the_naval_air_establishment: "Mendanai Pendirian Udara Angkatan Laut"
 CHI_fund_the_naval_air_establishment_desc: "Kombinasi keunggulan superioritas angkatan laut dan udara merupakan hadiah yang terlalu besar untuk diabaikan. Memperluas kekuatan angkatan laut kita mengurangi risiko kegagalan komunikasi antar-cabang."
 CHI_early_detections: "Deteksi Dini"
 CHI_early_detections_desc: "Dengan armada yang efektif namun sederhana, kami tidak punya pilihan selain mengoptimalkan keterlibatan kami untuk memanfaatkan kapal dengan sebaik-baiknya. Kecerdasan dan kesadaran mewakili metode terbaik untuk melakukan hal ini."
 CHI_defend_our_coasts: "Pertahankan Pantai kami"
 CHI_defend_our_coasts_desc: "Musuh kita tidak dapat menyerang kita jika mereka tidak dapat menjangkau kita. Minelaying adalah cara pertahanan paling efektif melawan invasi. Kami akan khawatir tentang biayanya nanti..."
 CHI_long_range: "Jarak Jauh"
 CHI_long_range_desc: "Sebuah anak panah yang berbobot baik dapat mengakhiri perang sebelum perang dimulai. Mesin yang lebih besar dan lebih berisik mungkin membahayakan kru kami, namun kemampuan untuk memproyeksikan tenaga lebih jauh juga akan meningkatkan pengaruh kami di panggung dunia."
 CHI_battleship_focus: "Fokus Kapal Perang"
 CHI_battleship_focus_desc: "Saat kita meresmikan pembangunan raksasa lautan pertama kita, sudah sepantasnya kita merayakan Bapak bangsa kita yang agung."
 CHI_coastal_defence: "Pertahanan Pesisir"
 CHI_coastal_defence_desc: "Mengoptimalkan penggunaan ruang di armada bawah permukaan kami berarti kapal selam yang lebih kecil dan lebih cepat. Kami harus menghapus beberapa hal yang tidak penting, seperti tempat tidur susun... atau fasilitas lainnya."
 CHI_heavy_cruiser_focus: "Fokus Penjelajah Berat"
 CHI_heavy_cruiser_focus_desc: "Angkatan laut permukaan kita, meskipun merupakan peninggalan Qing, telah melayani kita dengan baik selama hampir 50 tahun. Ketika dunia sedang berubah, tidaklah bijaksana untuk mengesampingkan pengetahuan institusional yang begitu luas dalam hal pengoperasian kapal penjelajah lapis baja jarak pendek: masa depan kita harus mempertimbangkan masa lalu."
 CHI_mobile_bases: "Pangkalan Seluler"
 CHI_mobile_bases_desc: "Seperti yang dibuktikan oleh seluruh dunia, udara melambangkan masa depan perang. Namun, kemampuan kami untuk menyerang dari jarak jauh dibatasi oleh geografi kami. Mengikuti contoh negara-negara besar, kita harus memfokuskan upaya kita pada platform serangan bergerak."
 CHI_the_seas_of_tomorrow: "Lautan Masa Depan"
 CHI_the_seas_of_tomorrow_desc: "Kami memimpikan masa depan di mana Tiongkok memimpin dunia dalam hal soft power dan kecanggihan teknologi. Kita telah menghabiskan waktu bertahun-tahun untuk mengejar ketertinggalan angkatan laut negara kolonial dan negara-negara pesaing kita di kawasan, namun sekaranglah waktunya untuk menentukan arah masa depan kita sendiri."
 CHI_the_seas_of_tomorrow_tt: "Seorang §YIlmuwan§! yang berspesialisasi dalam bidang yang telah dipilih sebelumnya akan disediakan."
 CHI_long_range_screens: "Layar Jarak Jauh"
 CHI_long_range_screens_desc: "Ketika kita menekankan upaya kita untuk melihat lebih jauh dari konflik dalam negeri, kemampuan untuk mengerahkan kekuatan besar dalam jarak jauh dan berbiaya rendah menjadi hal yang sangat penting."
  # Industrial branch
 CHI_promote_the_national_currency: "Mempromosikan Mata Uang Nasional"
 CHI_promote_the_national_currency_desc: "Penggantian standar perak yang kita lakukan baru-baru ini dengan diperkenalkannya mata uang nasional yang baru telah menunjukkan hasil awal yang baik dalam mengurangi ketergantungan kita pada peristiwa-peristiwa global. Namun, penggunaan mata uang baru ini paling banyak terjadi di kota-kota besar, dan kita harus melakukan upaya bersama untuk memastikan penerapannya di daerah pedesaan."
 CHI_institute_a_national_registry_of_property: "Melembagakan Pendaftaran Properti Nasional"
 CHI_institute_a_national_registry_of_property_desc: "Birokrasi adalah landasan negara, dan birokrasi tidak dapat berfungsi secara efisien jika tidak tersedia informasi yang akurat. Dalam ketidakefisienan inilah agen-agen yang tidak bermoral dapat mengeksploitasi sistem dan memperkaya diri mereka sendiri hingga merugikan seluruh bangsa."
 CHI_the_three_year_plan: "Rencana Tiga Tahun"
 CHI_the_three_year_plan_desc: "Upaya kami sangat tidak fokus dan negara kami kurang bimbingan. Melalui upaya terencana di tahun-tahun mendatang, kami akan memfokuskan energi kami pada satu tujuan besar. Mudah-mudahan tidak ada yang bisa menghentikannya."
 CHI_the_three_year_plan_tt: "§RAkan dihapus saat memasuki perang.§!"
 CHI_extend_compulsory_education: "Perluas Wajib Belajar"
 CHI_extend_compulsory_education_desc: "Populasi yang melek huruf merupakan tulang punggung pembangunan nasional, namun sayangnya upaya pendidikan kita hanya bersifat sepintas dan terlalu terfokus pada wilayah perkotaan. Hal ini menyebabkan populasi yang terabaikan di pedesaan, populasi yang siap menerima orang lain untuk menggantikan posisi negara."
 CHI_extend_compulsory_education_tt: "Setiap §Y[?CHI_improving_neglected_countryside_mission_time]§! hari, §Y$CHI_neglected_countryside$§! akan §GMeningkat§! hingga pengubah negatif hilang."
 CHI_initiate_the_gung_ho_movement: "Memulai Gerakan Gung Ho"
 CHI_initiate_the_gung_ho_movement_desc: "Dengan adanya krisis yang terjadi saat ini, kami memahami betapa kekurangannya situasi kami, baik secara material maupun produktif. Yang tidak kurang dari kami adalah orang-orang yang dapat dipekerjakan jika diorganisasi dengan baik. Kami mendapat ide untuk mendirikan koperasi industri skala kecil yang dapat kami sebarkan ke seluruh negeri."
 CHI_expand_the_bureaucracy: "Memperluas Birokrasi"
 CHI_expand_the_bureaucracy_desc: "Negara kita sangat luas dan pengelolaannya membutuhkan banyak usaha dan manusia. Dengan basis pendidikan yang semakin luas, kami kini dapat mempekerjakan lebih banyak aparatur negara dan memperkuat kendali kami di wilayah-wilayah terpencil di negara ini."
 CHI_send_the_urban_students_to_the_countryside: "Kirim Siswa Perkotaan ke Pedesaan"
 CHI_send_the_urban_students_to_the_countryside_desc: "Meskipun upaya pendidikan kami telah membuahkan hasil, masih terdapat kesenjangan besar antara perkotaan dan pedesaan. Sudah waktunya untuk mengambil pendekatan yang lebih langsung dan menggunakan pengetahuan siswa pendidikan tinggi kita di sekolah desa."
 CHI_find_foreign_financiers: "Temukan Pemodal Asing"
 CHI_find_foreign_financiers_desc: "Meskipun potensi ekonomi kita tidak terbatas, kondisi saat ini menunjukkan bahwa pengembangannya akan memerlukan waktu jika kita melakukannya sendiri. Cara yang lebih cepat untuk meningkatkan perekonomian kita adalah dengan mendatangkan modal eksternal ke dalam negeri melalui usaha patungan. Kita harus mencari orang-orang di luar negeri yang memiliki kemampuan untuk melihat kemungkinan-kemungkinan yang dimiliki bangsa Tiongkok."
 CHI_find_foreign_financiers_tt: "Keuntungan: §Y+1500 $CIC_BANK_HEADER$§! untuk setiap jurusan (kecuali Jepang) yang memiliki setidaknya §G70§! opini [ROOT.GetName].\n\n"
 CHI_naval_separate_defense_plan: "Rencana Pertahanan Terpisah Angkatan Laut"
 CHI_naval_separate_defense_plan_desc: "Chen Shaokuan telah mengusulkan apa yang dia sebut sebagai Rencana Pertahanan Terpisah Angkatan Laut, yang bertujuan untuk membangun setidaknya dua belas kapal induk dalam 30 tahun ke depan. Jika kita ingin mengamankan laut kita, kita harus menerima ide ini, dan memulai produksi armada kapal induk dengan sangat tergesa-gesa!"
 CHI_fund_the_plan_domestically: "Danai Rencana tersebut di Dalam Negeri"
 CHI_fund_the_plan_domestically_desc: "Satu hal yang bisa dipelajari dari abad terakhir ini adalah bahayanya mempercayai modal asing. Jika kita ingin membangun industri di negara kita, bergantung pada pihak asing dan bukan pada bank dan investor lokal merupakan kesalahan besar dan prospek yang berbahaya. Kita sebaiknya mencari sumber pendanaan dalam negeri agar tidak menimbulkan ketergantungan."
 CHI_finance_cooperatives: "Koperasi Keuangan"
 CHI_finance_cooperatives_desc: "Koperasi penuh vitalitas dan kecerdikan, namun tidak mempunyai akses terhadap kredit. Walaupun kami tidak mempunyai sumber daya yang besar, kebutuhan koperasi sangat kecil sehingga kami dapat membiayainya sendiri dan mengambil langkah selanjutnya."
 CHI_introduce_income_tax: "Memperkenalkan Pajak Penghasilan"
 CHI_introduce_income_tax_desc: "Cara kita membiayai negara sudah kuno dan tidak sesuai dengan dunia modern. Meskipun kita telah melakukan upaya untuk menerapkan pajak penghasilan beberapa kali dalam setengah abad terakhir, kali ini kita memiliki pemerintahan yang kuat yang dapat menindaklanjutinya."
 CHI_redistribute_land: "Mendistribusikan kembali Tanah"
 CHI_redistribute_land_desc: "Sebagian besar petani di negara kita bekerja di bawah tuan tanah yang mengambil keuntungan demi keuntungan pribadi. Hal ini tidak bisa dibiarkan, karena akan menurunkan produktivitas negara kita dan membuatnya tetap terbelakang."
 CHI_expand_academica_sinica: "Perluas Academia Sinica"
 CHI_expand_academica_sinica_desc: "Dengan sebagian besar penduduk kita yang mulai mencapai tingkat pendidikan yang memuaskan, inilah saatnya untuk beralih ke pendidikan yang lebih tinggi. Untuk kemampuan yang lebih besar, kami akan mengembangkan institusi yang sudah ada di Academia Sinica, lembaga ilmiah kami yang paling dominan."
 CHI_expand_the_chinese_academy_of_sciences: "Mendirikan Akademi Ilmu Pengetahuan Tiongkok"
 CHI_expand_the_chinese_academy_of_sciences_desc: "Academia Sinica telah memulai inisiatif baru. Ini akan menyatukan para pemikir paling cerdas di negara kita di akademi nasional baru untuk ilmu pengetahuan alam, sains dan teknologi."
 CHI_expand_national_sun_yat_sen_university: "Universitas Nasional Sun Yat-sen"
 CHI_expand_national_sun_yat_sen_university_desc: "Kini setelah perekonomian mampu mendukung pendidikan tinggi bagi masyarakat kita secara finansial, inilah saatnya bagi masyarakat Tiongkok untuk belajar secara ekstensif, melakukan penyelidikan secara akurat, melakukan refleksi dengan hati-hati, melakukan diskriminasi dengan jelas, dan berlatih dengan sungguh-sungguh. Hanya melalui prinsip-prinsip ini, yang diusung oleh Dr Sun Yat-sen, bangsa kita akan mampu menjadi tokoh terdepan dalam penelitian dan pengembangan."
 CHI_expand_academica_sinica_tt: "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$adalah [?CHI_neglected_countryside_academia_sinica_trigger|R%] atau lebih tinggi"
 CHI_expand_the_cooperatives: "Perluas Koperasi"
 CHI_expand_the_cooperatives_desc: "Koperasi telah membuat kami terkesan dengan kemanjurannya, namun skala dan jangkauannya masih kecil. Jika kita meminjamkan mereka jaringan koneksi kita, mereka bisa tumbuh dan berkembang biak lebih jauh lagi."
 CHI_administer_cooperatives: "Mengelola Koperasi"
 CHI_administer_cooperatives_desc: "Sifat koperasi berarti bahwa mereka tumbuh dan menyebar dengan cepat, namun seringkali bekerja secara terpisah. Kantor nasional akan mengoordinasikan dan mendukung jaringan kerja sama di seluruh [ROOT.GetName]."
 CHI_monopolise_resource_extraction: "Memonopoli Ekstraksi Sumber Daya"
 CHI_monopolise_resource_extraction_desc: "Kita telah mengamati di negara-negara lain kekuasaan ada pada organisasi pusat untuk merencanakan perekonomian. Terutama tindakan untuk memastikan bahwa aliran sumber daya tidak berhenti atau dieksploitasi oleh kepentingan swasta harus berada di tangan para teknokrat, atau dalam kasus kami, Komisi Sumber Daya Nasional."
 CHI_invite_foreign_experts: "Undang Pakar Asing"
 CHI_invite_foreign_experts_desc: "Abad terakhir telah menunjukkan bahwa pengetahuan teknis kita tertinggal dibandingkan pengetahuan orang Barat. Meskipun hal ini merugikan kita, kita sekarang dapat memanfaatkan pengetahuan mereka dan mengembangkan perekonomian kita lebih cepat dari sebelumnya."
 CHI_print_money_for_the_army: "Cetak Uang untuk Angkatan Darat"
 CHI_print_money_for_the_army_desc: "Pasukan tidak pernah gratis dan jika seseorang menginginkan pasukan yang besar ada harga yang harus dibayar. Namun terdapat berbagai cara untuk membayar dan kami dapat menginstruksikan staf kami untuk mencetak uang tambahan khusus untuk tujuan ini."
 CHI_maintain_adequate_currency_reserves: "Pertahankan Cadangan Mata Uang yang Memadai"
 CHI_maintain_adequate_currency_reserves_desc: "Pembelanjaan yang sembrono berisiko menyebabkan runtuhnya sistem seperti yang telah berulang kali ditunjukkan. Jika kita ingin berhasil dalam pertumbuhan yang terkendali, kita perlu menahan diri dan mempertahankan cadangan mata uang yang memadai."
 CHI_maintain_adequate_currency_reserves_tt: "Setiap §Y[?CHI_improving_inefficient_economy_mission_time]§! hari, §Y$CHI_inefficient_economy$§! akan meningkat hingga pengubah negatif hilang."
 CHI_develop_the_chemical_industry: "Mengembangkan Industri Kimia"
 CHI_develop_the_chemical_industry_desc: "Salah satu pencapaian terbesar peradaban modern adalah penaklukan alam melalui ilmu kimia. Dari pertanian hingga manufaktur, industri kimia dapat memberdayakan masyarakat – namun sayangnya industri kita masih dalam tahap awal. Jika kita ingin mengembangkan industri-industri ini, kita tidak tahu apa yang bisa kita capai."
 CHI_grow_the_coal_industry: "Mengembangkan Industri Batubara"
 CHI_grow_the_coal_industry_desc: "Batubara menggerakkan pabrik, kereta api, dan tungku pembakaran kita. Untuk terus memberikan tenaga bagi negara dan pada saat yang sama meningkatkan kekuatan ekonomi kita, kita perlu mencari sumber energi baru. Komisi Sumber Daya Nasional telah mengidentifikasi beberapa sumber yang harus kita manfaatkan."
 CHI_grow_the_coal_industry_tt1: "Dapatkan §YBatubara§! tambahan di negara bagian inti kami dan di Negara Panglima Perang yang bersekutu"
 CHI_grow_the_coal_industry_tt2: "Membuka Keputusan Prospeksi untuk §YBatubara§! di Negara-Negara Panglima Perang kita dan sekutunya"
 CHI_tungsten_and_antimony_extraction: "Ekstraksi Tungsten dan Antimon"
 CHI_tungsten_and_antimony_extraction_desc: "Logam strategis menghasilkan kemenangan strategis, dan kita mempunyai simpanan yang sangat besar — simpanan yang dapat dimanfaatkan dengan baik jika kita dapat mengeluarkan bijihnya dari dalam tanah."
 CHI_central_steel_and_machine_works: "Pusat Pekerjaan Baja dan Mesin"
 CHI_central_steel_and_machine_works_desc: "Baja sangat penting bagi industri kita dan sejauh ini kita masih kekurangan produksi yang layak. Meskipun sumber daya tersedia, kita hanya perlu menyusun rencana tersebut dari Komisi Sumber Daya Nasional."
 CHI_empower_those_that_have_lost: "Memberdayakan mereka yang Tersesat"
 CHI_empower_those_that_have_lost_desc: "Ada banyak orang di negara kita yang mengalami banyak kerugian dalam perang ini, seperti pekerjaan atau rumah mereka. Orang-orang ini mungkin tidak tampak sebagai sumber kekuatan, namun jika diberi kemampuan, mereka akan menjadi gelombang yang menghanyutkan para penjajah."
 CHI_found_a_modern_fertiliser_plant: "Menemukan Pabrik Pupuk Modern"
 CHI_found_a_modern_fertiliser_plant_desc: "Untuk memenuhi pangan negara, kita harus merasionalisasi pertanian kita, dan produksi pupuk lokal adalah langkah pertama. Kami akan membangun pabrik untuk tujuan ini, tetapi juga menggunakannya untuk tujuan lain."
 CHI_import_fertilisers: "Impor Pupuk"
 CHI_import_fertilisers_desc: "Meskipun produksi dalam negeri dapat mengatasi kekhawatiran akan ketergantungan, meniru produksi orang lain hanyalah sebuah langkah tambahan. Jika kami menyiapkan pesanan pembelian dari tempat lain, kami dapat fokus pada kekuatan kami yang berbeda."
 CHI_construct_the_banqiao_dam: "Membangun Bendungan Banqiao"
 CHI_construct_the_banqiao_dam_desc: "Sungai-sungai kita yang besar adalah penentu tanah kita, dan pengendalian terhadap sungai merupakan landasan bagi peradaban kita. Di masa depan, sungai-sungai itu akan menjadi penggerak pertumbuhan dan kebesaran bangsa kita!"
#################
## PHILIPPINES ##
#################
#############
# PHI FOCUS #
#############
PHI_commonwealth_of_the_philippines: "Persemakmuran Filipina"
PHI_commonwealth_of_the_philippines_desc: "Didirikan setahun yang lalu, Persemakmuran Filipina adalah langkah pertama menuju Filipina merdeka, yang dijanjikan oleh AS sebagai masa transisi selama 10 tahun. Masih banyak yang harus dilakukan, dan banyak keputusan yang harus diambil agar negara kita yang baru lahir ini bisa berdiri dan berjalan dengan baik."
PHI_align_with_the_usa: "Sejajar dengan Amerika"
PHI_align_with_the_usa_desc: "Amerika Serikat telah terbukti menjadi negara yang penuh kebajikan dan kaya raya. Dengan mendekatkan negara kita, masih banyak yang bisa mereka lakukan untuk mempercepat pembangunan dan memastikan perlindungan kita."
PHI_usa_equipment: "§Y[PHI.GetName]§! akan menggunakan §Y[USA.GetName]§! Organisasi Industri Militer (MIO)."
PHI_usa_equipment_non_aat: "§Y[PHI.GetName]§! akan menggunakan §Y[USA.GetName]§! Perancang Peralatan."
PHI_align_with_japan: "Sejajar dengan Jepang"
PHI_align_with_japan_desc: "Terlepas dari sikap mereka, Amerika Serikat masih merupakan penguasa kolonial, dan sewaktu-waktu dapat mengingkari janji mereka kepada kita. Oleh karena itu, akan lebih bijaksana jika kita mencari teman baru di dunia internasional, dan saat ini Jepang adalah pilihan yang paling bijaksana."
PHI_jap_equipment: "§Y[PHI.GetName]§! akan menggunakan §Y[JAP.GetName]§! Organisasi Industri Militer (MIO)."
PHI_jap_equipment_non_aat: "§Y[PHI.GetName]§! akan menggunakan §Y[JAP.GetName]§! Desainer Peralatan."
PHI_quezon_city: "Kota Quezon"
PHI_quezon_city_desc: "Manila telah melayani kita dengan baik sebagai ibu kota, namun hal ini terhambat oleh permasalahan yang parah seperti kepadatan yang berlebihan, kurangnya perumahan, sanitasi yang buruk dan kemacetan. Apa yang kita perlukan adalah sebuah kota yang direncanakan sejak awal untuk dijadikan sebagai ibu kota kita, dan meskipun hal ini memerlukan waktu bertahun-tahun bahkan puluhan tahun untuk membangun dan mengembangkannya – kita harus memulainya sekarang dan menuai hasil dari pandangan kita ke depan di kemudian hari!"
PHI_peg_the_peso_to_the_dollar: "Pasangkan Peso ke Dolar"
PHI_peg_the_peso_to_the_dollar_desc: "Mata uang kita harus terikat pada Dolar AS sebagai penentu nilainya, hal ini memberikan mata uang kita dasar nilai yang nyata dan memberikan landasan yang dapat diandalkan untuk membangun perdagangan."
PHI_leverage_the_peso: "Manfaatkan Peso"
PHI_leverage_the_peso_desc: "Mata uang kita adalah mata uang kita sendiri, dan kita harus berupaya membedakannya dari Dolar AS. Hal ini akan memungkinkan kita untuk mengambil kebijakan keuangan yang bersifat korektif agar sesuai dengan perkembangan perekonomian kita selanjutnya."
PHI_agricultural_migrants_to_hawaii: "Migran Pertanian ke Hawaii"
PHI_agricultural_migrants_to_hawaii_desc: "Sejumlah pekerja Filipina mendapat keberuntungan bekerja untuk petani Amerika di Hawaii, kita harus mendorong emigrasi ini sehingga mereka dapat terus mengirimkan uang kembali ke keluarga mereka di negara asal, dan dengan demikian meningkatkan perekonomian kita."
PHI_unicameral_legislature: "Badan Legislatif Unikameral"
PHI_unicameral_legislature_desc: "Salah satu langkah terpenting dalam mendirikan negara merdeka kita adalah pengorganisasian pemerintahan merdeka ini. Membangun sesuatu dari ketiadaan sangatlah sulit, jadi kita harus membentuk satu kamar di Kongres Filipina"
PHI_national_fiscal_policy: "Kebijakan Fiskal Nasional"
PHI_national_fiscal_policy_desc: "Ketika bangsa kita berada di jalur menuju kemerdekaan, salah satu hal pertama yang harus kita lakukan adalah memutuskan hubungan keuangan kita dengan Amerika Serikat, mengembangkan anggaran kita – dan mencari cara untuk mengumpulkan dana tersebut melalui perpajakan."
PHI_encourage_foreign_investment: "Mendorong Investasi Asing"
PHI_encourage_foreign_investment_desc: "Amerika Serikat bukan satu-satunya negara yang tertarik untuk mendapatkan bagian dari pasar kita. Kami memiliki banyak bahan mentah dan sektor pertanian yang berkembang. Kita harus memperjelas bahwa negara kita terbuka terhadap investasi bagi mereka yang mempunyai kemampuan dan pandangan jauh ke depan untuk mendapatkan manfaat dari kekayaan Filipina."
PHI_develop_japanese_trade_connections: "Mengembangkan Koneksi Perdagangan Jepang"
PHI_develop_japanese_trade_connections_desc: "Jepang telah menyatakan dengan jelas bahwa mereka haus akan barang dan sumber daya, dan Filipina mempunyai keuntungan dalam perdagangan. Kita harus mendorong perdagangan antar negara demi keuntungan bersama."
PHI_encourage_japanese_investment: "Mendorong Investasi Jepang"
PHI_encourage_japanese_investment_desc: "Saat ini Amerika Serikat menikmati sejumlah keuntungan perdagangan di negara kita, kita harus secara diam-diam mengembangkan hubungan dengan Jepang, sehingga investasi Jepang dapat mengalir ke negara kita, dan melemahkan keserakahan Amerika."
PHI_quezon_city_campus: "Kampus Kota Quezon"
PHI_quezon_city_campus_desc: "Sama seperti kita sedang merencanakan masa depan bangsa kita, merencanakan dan membangun kota masa depan, kita juga harus mempertimbangkan masa depan warga negara Filipina, dan memastikan bahwa keunggulan pendidikan diberikan ruang untuk berkembang di kota yang masih baru ini."
PHI_reduce_unneccessary_expenditure: "Kurangi Pengeluaran yang Tidak Perlu"
PHI_reduce_unneccessary_expenditure_desc: "Sekarang kita sudah mempunyai kebijakan fiskal nasional, kita perlu memastikan bahwa pembukuan kita seimbang. Kami ingin mencapai hal ini bukan dengan menaikkan pajak, atau mengejar orang-orang yang menghindarinya, namun dengan mengurangi lemak yang tidak diperlukan. Lagi pula, jika kita belum memberikan layanan tersebut, siapa yang akan merindukannya?"
PHI_subsidies: "Subsidi"
PHI_subsidies_desc: "Adalah fakta modal bahwa dibutuhkan uang untuk menghasilkan uang. Kita perlu menggunakan anggaran kita untuk menyuntikkan dana ke sektor-sektor yang bisa memberikan keuntungan yang cepat. Memberikan subsidi yang ditargetkan untuk upaya industri dan memperluas infrastruktur untuk menghasilkan sumber daya yang kaya namun sulit dijangkau dan membuat populasi lebih mudah diakses."
PHI_basic_welfare: "Kesejahteraan Dasar"
PHI_basic_welfare_desc: "Kita mempunyai tanggung jawab terhadap masyarakat yang lebih rentan, dan berkewajiban untuk meringankan setidaknya beberapa tantangan yang mereka hadapi. Kita sudah memiliki hal-hal yang sangat penting seperti lembaga-lembaga amal, namun seiring dengan bangkitnya industri, penderitaan para pekerja semakin mengemuka. Kami akan membentuk Dewan Ekonomi Nasional untuk menentukan undang-undang ketenagakerjaan dan menerapkan upah minimum."
PHI_encourage_asian_trade: "Mendorong Perdagangan Asia"
PHI_encourage_asian_trade_desc: "Terdapat hubungan maritim bersejarah yang signifikan antara negara-negara Asia, dan meskipun terdapat upaya terbaik dari negara kolonial untuk membatasi hubungan tersebut, hubungan tersebut tetap kuat. Kita harus memupuk hubungan ini dan mendorong lebih banyak perdagangan antar negara, demi pertumbuhan bersama dan kesejahteraan bagi semua orang."
PHI_pro_hacendados: "Pro Hacendados"
PHI_pro_hacendados_desc: "Kelompok elit pemilik tanah yang kaya yang diwarisi dari era kolonial Spanyol tetap menjadi kekuatan pengaruh dan kekayaan yang signifikan di Filipina. Kita harus merayu keluarga-keluarga tua ini dan sebagai imbalan atas kelanjutan status quo, kita bisa mendapatkan perlindungan dari mereka."
PHI_anti_hacendados: "Anti Hacendado"
PHI_anti_hacendados_desc: "Kelompok elit pemilik tanah yang kaya yang diwarisi dari era kolonial Spanyol telah terlalu lama menindas para penyewa. Kita harus merobohkan institusi kuno ini dan mengembalikan tanahnya kepada mereka yang menggarapnya. Hanya dengan cara inilah kita dapat memodernisasi perekonomian kita dan melepaskan diri dari lintah-lintah ini."
PHI_sugar_barons: "Baron Gula"
PHI_sugar_barons_desc: "Gula adalah tulang punggung perekonomian Filipina. Tanpa sumber daya yang kaya ini, kemakmuran bangsa kita akan hilang dalam sekejap. Kita perlu mendorong mereka yang membudidayakan dan mengekspor tanaman penting ini, sehingga memberi kita lebih banyak uang."
PHI_sugar_barons_unlock_tt: "§YMembuka Keputusan Cukai Gula§!"
PHI_sugar_barons_tt: "§YSatu Jenderal acak§! akan mendapatkan §G+2§! keterampilan perencanaan"
PHI_luzon_transport: "Transportasi Luzon"
PHI_luzon_transport_desc: "Meskipun merupakan bagian paling maju di Filipina, wilayah ini juga merupakan wilayah yang paling padat penduduknya dan merupakan wilayah industri, sehingga jalur transportasinya sangat memerlukan investasi dan perluasan lebih lanjut."
PHI_expand_gold_mining: "Perluas Penambangan Emas"
PHI_expand_gold_mining_desc: "Spanyol selalu sangat cerdik dalam menemukan cadangan emas dan perak, dan mereka tidak kecewa dengan Filipina. Namun mereka akan sangat marah ketika mengetahui bahwa lapisan emas terkaya baru saja disadap, dan ekspor yang meningkat ini menghasilkan pendapatan tertinggi bagi negara kita."
PHI_mindanao_transport: "Transportasi Mindanao"
PHI_mindanao_transport_desc: "Meskipun merupakan pulau terbesar kedua di kepulauan Filipina, tingkat investasi pulau ini belum pernah mendekati tingkat investasi di wilayah utara di Luzon. Kita harus memperbaiki kekeliruan ini!"
PHI_land_reform: "Reformasi Pertanahan"
PHI_land_reform_desc: "Pemilik tanah kaya masih mendominasi sektor pertanian di Filipina. Kita harus menunjukkan bahwa kita adalah bangsa modern, bukan bangsa feodal. Negara akan menerapkan pembelian wajib atas perkebunan yang luas ini, dan menjual bidang tanah kepada petani kecil dan perusahaan untuk budidaya dan penggunaan yang lebih efisien."
PHI_japanese_advisors: "Penasihat Jepang"
PHI_japanese_advisors_desc: "Jepang mencapai hal yang mustahil, berubah dari masyarakat feodal menjadi masyarakat modern dalam waktu singkat. Meskipun hal ini terjadi beberapa waktu yang lalu, mereka masih mempertahankan banyak keahlian industri dan militer, yang mungkin dapat kita manfaatkan dengan hubungan yang semakin baik."
PHI_san_miguel: "San Miguel"
PHI_san_miguel_desc: "Didirikan berdasarkan Piagam Kerajaan Spanyol pada tahun 1890, tempat pembuatan bir San Miguel telah memproduksi bir bergaya Jerman yang luar biasa sejak saat itu. Kini dengan populasi kita yang semakin sejahtera, dan permintaan global yang meningkat, kita harus berupaya untuk memperluas institusi minuman terkenal ini. Bersorak untuk dunia yang lebih baik."
PHI_textile_mills: "Pabrik Tekstil"
PHI_textile_mills_desc: "Saat ini kita berada di tengah-tengah dorongan besar menuju perekonomian yang lebih industrial, dan tulang punggung dari hal ini adalah industri tekstil. Jika kita mampu menghasilkan bahan-bahan dasar sendiri, maka kita tidak akan lagi bergantung atau rentan terhadap pengaruh asing."
PHI_encourage_gold_exports: "Mendorong Ekspor Emas"
PHI_encourage_gold_exports_desc: "Saat ini kita sedang mengalami demam emas, dan hal ini terjadi pada saat yang tepat. Pasokan dalam negeri kita sudah jenuh, untungnya dunia sedang haus akan emas. Populasi global yang baru saja bangkit dari Depresi Hebat sangat haus akan ikon kekayaan mereka yang lebih nyata, dan tidak ada yang lebih nyata daripada emas batangan."
PHI_mineral_prospecting: "Prospek Mineral"
PHI_mineral_prospecting_desc: "Ada yang berpendapat bahwa kita sangat beruntung dalam pencarian mineral karena mudah sekali menemukan simpanan emas dalam jumlah besar. Namun, berbahaya bagi perekonomian jika terlalu bergantung pada satu sumber daya saja, karena Imperium Spanyol terlambat menyadarinya. Kita harus mengerahkan lebih banyak sumber daya untuk penemuan mineral lainnya. Siapa yang tahu apa yang masih disembunyikan oleh tanah kita?"
PHI_bill_of_rights: "RUU Hak Asasi Manusia"
PHI_bill_of_rights_desc: "Jika kita ingin dianggap serius sebagai negara modern, kita harus memasukkan hak-hak rakyat kita ke dalam hukum. Hal ini dapat didasarkan pada [USA.GetName], yang menganggap kebebasan seperti beragama, berbicara, pers dan berkumpul. Namun kita adalah bangsa kita sendiri, dan terdapat beberapa perbedaan yang mencolok, misalnya kita tidak menganggap penting untuk memberikan hak untuk memanggul senjata dalam masyarakat kita."
PHI_nationality_act: "UU Kebangsaan"
PHI_nationality_act_desc: "[USA.GetNameDefCap] sedang memberlakukan Undang-Undang Kebangsaan, yang merevisi undang-undang kewarganegaraan yang ada, termasuk undang-undang yang berkaitan dengan warga Filipina dan status mereka di Amerika Serikat. Undang-undang tersebut mengklarifikasi bahwa warga Filipina diakui sebagai warga negara AS, bukan warga negara AS, sehingga memungkinkan mereka untuk tinggal dan bekerja di [USA.GetNameDef] namun tanpa hak kewarganegaraan penuh."
PHI_open_borders: "Buka Perbatasan"
PHI_open_borders_desc: "Berikan padaku massamu yang lelah, malang, dan berkerumun yang rindu untuk bernapas lega. Meskipun [USA.GetAdjective] berupaya membatasi imigrasi, kami memiliki kendali atas perbatasan kami sendiri. Kita harus berupaya menjadikan diri kita sebagai tempat berlindung yang aman bagi mereka yang teraniaya karena perang, atau karena ras, agama, atau alasan lainnya."
PHI_philippine_american_educational_foundation: "Yayasan Pendidikan Filipina-Amerika"
PHI_philippine_american_educational_foundation_desc: "Berkat hubungan kami yang sangat dekat dengan [USA.GetNameDef], kami telah melahirkan berbagai hubungan akademis. Kita harus membentuk sebuah organisasi yang bertanggung jawab untuk menyelenggarakan program beasiswa pertukaran mata uang asing, yang bertujuan untuk mendorong penelitian bi-nasional, pemahaman budaya dan pertukaran ide secara terbuka antara kedua negara."
PHI_government_filipinization: "Filipinanisasi Pemerintah"
PHI_government_filipinization_desc: "Pemerintahan kita telah didominasi oleh entitas asing selama berabad-abad, pertama Spanyol, kemudian Amerika. Sudah waktunya kita mengambil kendali untuk diri kita sendiri, dan berkuasa di Filipina, oleh orang Filipina dan untuk orang Filipina!"
PHI_improve_trait_tt: "Akan mendapatkan sifat penasihat yang lebih baik"
PHI_bicameral_legislature: "Badan Legislatif Bikameral"
PHI_bicameral_legislature_desc: "Perluasan pemerintahan kita terus berlanjut. Kami telah membuat ruang bawah dan sekarang saatnya membuat ruang atas. Dengan model ini kita dapat membuat undang-undang baru yang terbaik untuk negara kita."
PHI_uncouple_the_peso_and_dollar: "Pisahkan Peso dan Dolar"
PHI_uncouple_the_peso_and_dollar_desc: "Mematapkan Peso terhadap Dolar telah memberikan hasil yang baik bagi kami karena memberikan tingkat stabilitas yang diperlukan pada mata uang kami. Namun dengan independensi yang semakin dekat, kita perlu memisahkan kedua hal tersebut sehingga kita dapat memiliki kontrol dan fleksibilitas yang lebih besar dalam sistem moneter kita, dan menerapkan alat-alat seperti pelonggaran kuantitatif jika diperlukan."
PHI_increase_sugar_exports: "Meningkatkan Ekspor Gula"
PHI_increase_sugar_exports_desc: "Gula telah menjadi tulang punggung perekonomian kita selama berabad-abad, dan gula telah membantu kita melewati masa-masa terburuk Depresi Besar, dengan ekspor yang tetap sehat. Dengan menandatangani kesepakatan perdagangan yang menguntungkan dengan negara lain, kita dapat memastikan bahwa kita berada pada posisi terbaik untuk memanfaatkan pertumbuhan gula sebagai bahan dasar masakan internasional... dan soda."
PHI_break_chinese_monopoly: "Hancurkan Monopoli Tiongkok"
PHI_break_chinese_monopoly_desc: "Para pedagang Tiongkok telah menemukan tempat mereka di masyarakat kita sebagai pemilik toko dan bank, namun dengan begitu banyaknya layanan penting yang dipegang oleh orang asing, demi keamanan kita sendiri, kita harus memastikan distribusi jaringan distribusi yang lebih adil."
PHI_encourage_chinese_immigration: "Mendorong Imigrasi Tiongkok"
PHI_encourage_chinese_immigration_desc: "Pedagang Tiongkok telah terbukti sangat berwirausaha dalam mendirikan usaha kecil dan toko. Kita harus memanfaatkan masuknya sumber daya manusia dan sumber daya manusia ini, dan mendorong lebih banyak pertumbuhan di sektor ini."
PHI_japanese_observers: "Pengamat Jepang"
PHI_japanese_observers_desc: "Dengan semakin dekatnya hubungan antara kami, Jepang setuju untuk mengirimkan detasemen militer ke negara kami. Hal ini dimaksudkan agar mereka dapat belajar secara langsung bagaimana struktur komando gaya Eropa berfungsi dalam suasana bersahabat, sementara kita dapat belajar dari keahlian tempur mereka yang luar biasa dan dengan demikian meneruskan kebijaksanaan ini ke tingkat yang lebih rendah."
PHI_one_observer_advisor_focus_tt: "Efek saat menyelesaikan salah satu dari §Y$PHI_japanese_advisors$§! dan §Y$PHI_japanese_observers$§!:"
PHI_both_observer_advisor_focus_tt: "Efek saat menyelesaikan §Y$PHI_japanese_advisors$§! dan §Y$PHI_japanese_observers$§!:"
PHI_treaty_of_manila: "Perjanjian Manila"
PHI_treaty_of_manila_desc: "[IndependentOrNot]"
PHI_treaty_of_manila_subject_desc: "Perjuangan panjang untuk mencapai kemerdekaan hampir berakhir. Mulai dari revolusi melawan Spanyol, hingga perang sengit melawan Amerika Serikat, dan bertahun-tahun sebagai negara Persemakmuran, Filipina telah bertahan. Dengan ditandatanganinya Perjanjian Manila, negara kita akhirnya berdiri sebagai negara yang bebas dan berdaulat, kemerdekaannya diakui secara resmi oleh dunia."
PHI_treaty_of_manila_independent_desc: "Meski kita sudah merdeka, masih banyak pihak di kancah global yang belum mengakui kemerdekaan kita. Dengan menandatangani Perjanjian Manila, kita mendapatkan pengakuan tersebut, dan dengan demikian mampu berdiri sejajar dengan negara-negara lain di kancah internasional."
PHI_manila_tag_tt: "§Y[PHI.GetName]§! akan dikenal sebagai §YFilipina§!"
PHI_universal_sufferage: "Hak Pilih Universal"
PHI_universal_sufferage_desc: "Setelah konstitusi disahkan, rakyat Filipina diberikan pemungutan suara mengenai apakah akan mengizinkan hak pilih universal di negara Filipina. Hasilnya adalah 91% yang mendukung, dan oleh karena itu hak untuk memilih telah diperluas dengan semestinya."
PHI_modernization: "Modernisasi"
PHI_modernization_desc: "Upaya industri kita sudah terlalu lama tertinggal dibandingkan negara-negara Asia lainnya. Kini setelah kita mandiri, kita harus menunjukkan potensi kita kepada dunia, dan menyediakan sumber daya dan ruang peraturan bagi mereka yang ingin memajukan mekanisasi perekonomian kita."
PHI_revision_of_taxation_laws: "Revisi Undang-Undang Perpajakan"
PHI_revision_of_taxation_laws_desc: "Kini, setelah kita melepaskan diri dari Amerika Serikat, kita perlu mengembangkan aturan perpajakan kita sendiri, sehingga meningkatkan basis pajak kita dan mengarah pada peningkatan pendapatan pemerintah yang kemudian dapat diinvestasikan kembali ke layanan negara seperti infrastruktur, kesejahteraan, militer, dan skema pertumbuhan lainnya."
PHI_bill_of_rights_for_veterans: "Bill of Rights untuk Veteran"
PHI_bill_of_rights_for_veterans_desc: "Banyak warga Filipina yang terlibat selama perang, dan kita harus memastikan bahwa mereka yang kembali ke rumah mendapatkan perawatan yang baik. Jika kita menjaga para veteran kita, kita dapat memastikan aliran tambahan tenaga kerja yang baik di masa depan karena masyarakat melihat bahwa militer adalah pilihan yang tepat untuk berkarir."
PHI_rehabilitation_finance_corporation: "Perusahaan Pembiayaan Rehabilitasi"
PHI_rehabilitation_finance_corporation_desc: "Bangsa kita telah mengalami kerusakan yang parah, mulai dari kota-kota yang hancur dan jalan-jalan yang dibom, kompleks-kompleks industri yang hancur dan jalur kereta api yang disabotase. Dibutuhkan waktu dan uang untuk melakukan pembangunan kembali, namun dampak yang ditimbulkan jika negara kita tidak melakukan pembangunan kembali akan jauh lebih besar."
PHI_department_of_foreign_affairs: "Departemen Luar Negeri"
PHI_department_of_foreign_affairs_desc: "Dengan menempatkan diri kami di panggung internasional sebagai entitas independen, kami kini bertanggung jawab atas tindakan diplomatik kami sendiri. Kita harus membentuk departemen luar negeri yang tugasnya menangani hubungan diplomatik dan mengerahkan staf diplomatik di seluruh dunia."
PHI_economic_nationalism: "Nasionalisme Ekonomi"
PHI_economic_nationalism_desc: "Kini setelah kita mempunyai kendali penuh atas masa depan kita, inilah saatnya untuk mengambil kendali atas perekonomian kita juga. Kita mempunyai banyak alat yang dapat kita gunakan, seperti tarif, peraturan, pergerakan barang dan modal. Kita perlu memanfaatkan semuanya, dan dengan demikian menunjukkan betapa kuatnya perekonomian Filipina."
PHI_bell_trade_act: "Undang-Undang Perdagangan Lonceng"
PHI_bell_trade_act_desc: "Juga dikenal sebagai Undang-Undang Perdagangan Filipina, undang-undang ini mengatur perdagangan antara [PHI.GetName] dan [USA.GetName]. Hal ini mencakup paket investasi keuangan, perdagangan preferensial, dan perjanjian tarif. Hal ini juga mencakup akses signifikan perusahaan-perusahaan AS terhadap sumber daya Filipina yang menimbulkan beberapa kekhawatiran, namun manfaat lainnya telah ditentukan sepadan dengan risikonya."
PHI_pearl_of_the_orient_seas: "Mutiara Laut Timur"
PHI_pearl_of_the_orient_seas_desc: "Diromantiskan oleh Penjelajah Spanyol pertama yang mendeskripsikan daratan yang baru mereka temukan, deskripsi tersebut tetap melekat, dan tetap benar. Terlepas dari semua cobaan dan tragedi yang menimpa pulau-pulau kami, kami tetap menjadi tempat dengan keindahan luar biasa yang hanya dapat ditandingi oleh mutiara yang kami panen di sini."
#PHI_join_co_pro: "Join Co-Prosperity Sphere"
#PHI_join_co_pro_desc: ""
#PHI_join_allies: "Join Allies"
#PHI_join_allies_desc: ""
PHI_united_states_army_forces_in_the_far_east: "Angkatan Darat Amerika Serikat di Timur Jauh"
PHI_united_states_army_forces_in_the_far_east_desc: "Departemen Filipina telah lama menjadi komando Amerika di Filipina, namun dengan meningkatnya ketegangan, inilah saatnya untuk memperluasnya menjadi formasi Angkatan Darat Amerika Serikat yang lebih besar. Hal ini memerlukan pembentukan struktur komando baru dan pemindahan sejumlah besar personel Amerika dari AS."
PHI_send_a_share_of_THIS_navy_to_ROOT_tt: "Kirim sebagian [THIS.GetAdjective] navy ke [ROOT.GetNameDef]."
PHI_military_requisitions: "Permintaan Militer"
PHI_military_requisitions_desc: "Untuk benar-benar memfasilitasi perluasan kekuatan militer yang pesat ini, kita perlu meminta sejumlah besar gudang senjata dan peralatan dari depot pasokan di Amerika Serikat. Hal ini akan memungkinkan kita untuk mempertahankan kekuatan tempur yang solid yang dilengkapi dengan perangkat keras militer Amerika yang terbaik."
PHI_usaffe_headquarters: "Markas Besar USAFFE"
PHI_usaffe_headquarters_desc: "Komando Timur Jauh kita yang baru akan memerlukan bagian markas besar yang memadai, dilengkapi dan dikelola oleh perwira staf utama Angkatan Darat Amerika Serikat. Ada sejumlah pensiunan komandan yang bisa dipanggil, atau calon perwira yang membutuhkan pengalaman nyata."
PHI_permanent_usa_air_bases: "Mendirikan Pangkalan Udara Permanen [USA.GetAdjective]"
PHI_permanent_usa_naval_bases: "Mendirikan Pangkalan Angkatan Laut [USA.GetAdjective] Permanen"
PHI_permanent_usa_land_bases: "Mendirikan Pangkalan Darat [USA.GetAdjective] Permanen"
PHI_small_arms_and_artillery_requisition: "Permintaan Senjata Kecil dan Artileri"
PHI_small_arms_and_artillery_requisition_desc: "Meskipun kebutuhan dasar telah tiba, untuk melengkapi kekuatan yang kita kumpulkan di sini dengan benar, kita perlu meminta lebih banyak senjata, dari semua kaliber, besar dan kecil."
PHI_filipino_repatriation_act: "Undang-undang Repatriasi Filipina"
PHI_filipino_repatriation_act_desc: "Berdasarkan Undang-Undang Tydings-McDuffe yang menetapkan Filipina menuju kemerdekaan, sebuah klausul ditambahkan yang sangat membatasi masuknya orang Filipina ke Amerika Serikat. Kami tidak ingin melihat keluarga terpisah, jadi kami akan menawarkan perjalanan satu arah gratis ke Filipina."
PHI_american_capital_injection: "Injeksi Modal Amerika"
PHI_american_capital_injection_desc: "Amerika terkenal dengan investasinya, jadi mari kita manfaatkan sumber modal ini dan lepaskan pada perekonomian Filipina. Siapa yang tahu keajaiban apa yang bisa diciptakan oleh para pengusaha kapitalis ini tanpa intervensi langsung dari negara."
PHI_appoint_macarthur: "Tunjuk MacArthur"
PHI_appoint_macarthur_desc: "Sejak tahun 1935 Jenderal Douglas MacArthur telah bekerja sebagai penasihat bagi pemerintah Filipina, namun sekarang saatnya kita menggunakan keterampilan dan pengalamannya untuk digunakan dalam kapasitas yang lebih resmi, dan memberinya komando Pasukan Amerika Serikat di Timur Jauh."
PHI_united_states_asiatic_fleet: "Armada Asiatik Amerika Serikat"
PHI_united_states_asiatic_fleet_desc: "Angkatan Darat Amerika Serikat bukan satu-satunya badan militer yang mempunyai kepentingan di Timur Jauh, angkatan laut juga demikian. Teluk Manila adalah basis sempurna untuk menempatkan Armada Asia Amerika Serikat, dan merupakan pusat ideal untuk memperluas kemampuan mereka."
PHI_far_east_air_force: "Angkatan Udara Timur Jauh"
PHI_far_east_air_force_desc: "Meskipun Filipina lebih terbiasa menggunakan angkatan darat dan angkatan laut, tidak ada yang bisa menghentikan ekspansi angkatan udara mereka. Angkatan Udara Timur Jauh harus bermarkas di sini, dan lapangan udara kita diperluas untuk memungkinkan pesawat yang lebih banyak dan lebih besar memberikan kemampuan serangan yang jauh lebih dekat ke pangkalan dari potensi ancaman."
PHI_bring_in_eisenhower: "Bawa masuk Eisenhower"
PHI_bring_in_eisenhower_desc: "Sama halnya dengan MacArthur, Dwight D. Eisenhower telah bekerja sebagai penasihat pemerintah Filipina sejak tahun 1935 dan MacArthur kini dianggap pantas untuk secara resmi memasukkan perwira yang menjanjikan ini ke dalam stafnya. Meski ada laporan antipati di antara keduanya, mungkin perbedaan kepribadian dan gaya kepemimpinan mereka akan menjadi pelengkap yang diperlukan untuk menjaga keamanan bangsa."
PHI_police_chief_eisenhower: "Kepala Polisi Eisenhower"
PHI_police_chief_eisenhower_desc: "Dengan rencana ibu kota baru kami, Kota Quezon, [PHI.GetLeader] telah memutuskan bahwa kota ini memerlukan Kepala Polisi yang memiliki kedudukan tinggi. Presiden Trump mempunyai hubungan kerja yang baik dengan Dwight D. Eisenhower dan percaya bahwa dengan insentif yang tepat, dia dapat dibujuk untuk mengambil peran tersebut, dan dengan demikian mengikatnya secara permanen pada perjuangan Filipina."
PHI_eisenhower_stays_tt: "§YDwight D. Eisenhower§! akan tetap berada di Filipina, dan tidak dapat dipanggil lagi oleh [USA.GetNameDef]"
PHI_mariveles_naval_base: "Pangkalan Angkatan Laut Mariveles"
PHI_mariveles_naval_base_desc: "Manila mempunyai fasilitas dasar angkatan laut, namun mempunyai potensi lebih besar lagi. Hal pertama yang harus kita lakukan adalah memperluas Pangkalan Angkatan Laut Mariveles, yang terletak di sisi teluk Bataan. Pelabuhan perairan dalam ini dapat menampung fasilitas yang lebih signifikan untuk produksi dan pemeliharaan aset angkatan laut."
PHI_gunboat_diplomacy: "Diplomasi Kapal Perang"
PHI_gunboat_diplomacy_desc: "Kita adalah negara kepulauan, dan oleh karena itu kita harus memiliki kemampuan angkatan laut untuk menimbulkan ketakutan di hati mereka yang menentang kepentingan kita – dan jika mereka belum takut kepada kita, mereka akan takut ketika armada Filipina muncul di pelabuhan utama mereka dan mengambil alih kendali pelayaran di sana."
PHI_trucks_and_transport_requisition: "Permintaan Truk dan Transportasi"
PHI_trucks_and_transport_requisition_desc: "Kini setelah senjata mengalir ke Filipina, sekarang saatnya mempertimbangkan logistik untuk mempertahankan pasukan di lapangan. Berkat berkembangnya industri mobil dan kereta api di Amerika Serikat, seharusnya tidak ada masalah untuk meminta sebagian dari mereka untuk keperluan militer."
PHI_investment_fund: "Dana Investasi"
PHI_investment_fund_desc: "Meskipun investasi individual di negara kita sangat dihargai, agar modal ini bisa dimanfaatkan sebaik-baiknya, maka modal tersebut harus disimpan dalam dana terpusat, yang dikelola oleh mereka yang benar-benar mengetahui realitas perekonomian di Filipina, sehingga mereka dapat mengarahkan investasi ini ke tempat yang dapat dimanfaatkan sebaik-baiknya, untuk mendapatkan keuntungan tertinggi."
PHI_subordinate_philippine_department: "Bawahan Departemen Filipina"
PHI_subordinate_philippine_department_desc: "Departemen Filipina adalah kehadiran militer Amerika Serikat di Filipina sebelum USAFFE dibentuk. Meskipun struktur komandonya sudah kuno, namun struktur tersebut harus diperbarui dan dimodernisasi agar pasukan asli Filipina lebih mudah berada di bawah komando dan kendali Amerika."
PHI_expand_us_bases: "Perluas Pangkalan AS"
PHI_expand_us_bases_desc: "Peperangan modern didominasi oleh pesawat terbang, dan hal ini terutama berlaku pada situasi di Filipina. Sejauh ini cara termudah untuk mengamankan pulau-pulau tersebut adalah melalui dominasi udara, dan bahkan lebih baik lagi, hal ini memungkinkan kita untuk berpatroli di lautan sekitarnya juga. Untuk lebih mempersiapkan diri menghadapi operasi udara ini, kita perlu memperluas pangkalan udara kita secara signifikan di sini."
PHI_war_plan_rainbow_five: "Rencana Perang Pelangi Lima"
PHI_war_plan_rainbow_five_desc: "Dengan mempertimbangkan keamanan kita dengan baik, kita bisa mulai mengarahkan pandangan kita pada perang yang lebih luas dan menentukan tempat yang tepat bagi kita di dalamnya. Kita mempunyai banyak hal untuk ditawarkan dalam upaya perang, dan kita harus memastikan bahwa kita menginvestasikan dana tersebut pada tempat yang paling membutuhkan."
PHI_aircraft_requisition: "Permintaan Pesawat"
PHI_aircraft_requisition_desc: "Kita tidak mampu mengembangkan industri pesawat terbang kita sendiri secara signifikan, sehingga kita sepenuhnya bergantung pada pesawat Amerika. Kebutuhan kami semakin meningkat, jadi kami harus meminta lebih banyak pesawat dari sponsor kami di Amerika."
PHI_luce_celler_act: "Undang-Undang Luce-Celler"
PHI_luce_celler_act_desc: "Undang-undang Luce-Celler adalah undang-undang imigrasi di Amerika Serikat yang meningkatkan kuota pelancong Filipina yang diizinkan dan untuk pertama kalinya memungkinkan naturalisasi warga Filipina sebagai warga negara Amerika. Hal ini menandai dimulainya era baru migrasi lintas Pasifik."
PHI_utang_na_loob: "Utang na loob"
PHI_utang_na_loob_desc: "Utang na loob adalah nilai budaya Filipina yang diterjemahkan menjadi 'hutang syukur' atau 'hutang batin'. Ini menandakan kewajiban emosional dan moral yang mendalam untuk membalas seseorang yang telah memberikan bantuan yang berarti, terutama pada saat dibutuhkan. Rasa timbal balik ini biasanya diungkapkan melalui tindakan pelayanan, dukungan, atau loyalitas."
PHI_utang_na_loob_last_stand_tt: "Biaya §G-25%§! dan pertahanan §G+5%§! untuk §YLast Stand§!\n"
PHI_declare_military_emergency: "Deklarasikan Darurat Militer"
PHI_declare_military_emergency_desc: "Negara ini berada di lereng yang licin menuju fasisme, namun tindakan tegas mencegah kejatuhan terakhir. Kini jelas bahwa terdapat ancaman di mana-mana, dan terserah pada kita untuk menggagalkannya. Tidak ada yang di luar batas, tidak ada yang ilegal. Demokrasi harus bertahan."
PHI_military_emergency_flag: "Darurat Militer Diumumkan"
PHI_usa_catchup_tt: "Hal ini dianggap telah menyelesaikan salah satu fokus ekonomi Amerika untuk tujuan permintaan."
PHI_weapons_of_war: "Senjata Perang"
PHI_weapons_of_war_desc: "Untuk mempertahankan cita-cita demokrasi kita, kita harus memastikan bahwa kita dilengkapi dengan senjata yang terbaik dan paling berbahaya. Kami telah mendengar rumor tentang 'Proyek Manhattan' tertentu. Kebetulan ada orang Filipina yang mengerjakan proyek tersebut, dan sebagai orang yang baik dan setia, dia bersedia membantu kami dalam proyek kami sendiri."
PHI_preemptive_strikes: "Serangan Pencegahan"
PHI_preemptive_strikes_desc: "Ada musuh di mana-mana, dan kita terkepung. Oleh karena itu, kita harus bersiap menghadapi hal yang tidak dapat dihindari. Lebih baik lagi, kita harus bersiap untuk menyerang terlebih dahulu sehingga hal yang tidak dapat dihindari tidak lagi dapat dihindari, namun dapat dihindari. Bagaimanapun, satu-satunya cara agar kita aman adalah jika tidak ada lagi yang menyerang kita."
PHI_sunset_empires: "Kerajaan Matahari Terbenam"
PHI_sunset_empires_desc: "Ancaman terbesar bagi kita adalah Kerajaan Matahari Terbit, dan Kerajaan dimana Matahari Tidak Pernah Tenggelam. Oleh karena itu, kita harus memastikan bahwa kita mempunyai peluru yang cukup sehingga kita dapat bertarung di tempat teduh."
PHI_land_of_the_setting_sun: "Negeri Matahari Terbenam"
PHI_land_of_the_setting_sun_desc: "Persiapan kami telah dilakukan. Sekaranglah waktunya untuk menyerang! Saatnya matahari terbenam untuk terakhir kalinya di [JAP.GetNameDef], dan tidak akan pernah terbit lagi."
PHI_sea_of_cobalt: "Laut Kobalt"
PHI_sea_of_cobalt_desc: "Beri saya cukup senjata nuklir dan saya akan menciptakan lautan kobalt sehingga tidak ada musuh yang bisa menyeberang untuk mencapai kita."
PHI_the_sun_has_set: "Matahari Telah Terbenam"
PHI_the_sun_has_set_desc: "Inggris telah lama menjadi ancaman bagi Amerika Serikat dan Filipina. Kami menghancurkan mereka pada tahun 1779 dan mereka tidak pernah memaafkan kami karenanya. Sudah waktunya kita mengingatkan mereka akan tempat mereka di dunia."
PHI_traitors_back_home: "Pengkhianat Kembali ke Rumah"
PHI_traitors_back_home_desc: "[USA.GetNameDef] menjadi lemah dan penuh ketakutan. Tak seorang pun di sana ingin melakukan apa yang harus dilakukan, jadi terserah pada kita untuk membersihkan barisan politisi dan pengecut, dan merebut kembali Kota Cemerlang di Atas Bukit untuk rakyat Amerika."
PHI_end_colonialism: "Akhiri Kolonialisme"
PHI_end_colonialism_desc: "Kolonialisme adalah sebuah penyakit yang dibiarkan membusuk terlalu lama. Semua orang berhak untuk hidup dalam kebebasan dan demokrasi, dan kita harus memaksakannya dengan kekerasan."
PHI_cobalt_supremacy: "Supremasi Kobalt"
PHI_cobalt_supremacy_desc: "Aku menjadi kematian, penghancur dunia."
PHI_subject_surrender: "Perihal... Menyerah"
PHI_subject_surrender_desc: "'Menjadi jelas bahwa garnisun pasukan ini pada akhirnya akan dihancurkan oleh pemboman udara dan artileri, serta infanteri yang didukung oleh tank yang telah membuat kami kewalahan.' Ini adalah siaran yang baru saja datang dari salah satu pertahanan terakhir kami, dan dengan itu jelas bahwa kami telah kehilangan kendali atas [PHI.GetNameDef]."
PHI_subject_surrender_tt: "§RKehilangan kendali atas semua status [327.GetName] akan menyelesaikan fokus ini.§!"
PHI_i_shall_return: "Saya Akan Kembali"
PHI_i_shall_return_desc: "Ini adalah ungkapan yang diucapkan oleh Jenderal Douglas MacArthur ketika dia mengungsi [PHI.GetNameDef], dan merupakan ungkapan yang sering dia ulangi sejak saat itu. Sudah saatnya kita menyediakan alat dan perlengkapan untuk mewujudkan hal ini."
PHI_soldiers_in_hiding: "Tentara Bersembunyi"
PHI_soldiers_in_hiding_desc: "Meskipun kami secara resmi kalah dalam pertarungan di [PHI.GetNameDef], perang belum berakhir. Sejumlah besar pasukan kami tidak mematuhi perintah untuk menyerah, dan terus berjuang sambil bersembunyi. Kita mengenal sejumlah perwira luar biasa yang mampu menghadapi tantangan ini, dan mulai memperluas unit perlawanan di sekitar mereka – dan kita harus memberikan semua yang kita bisa untuk keberhasilan mereka."
PHI_if_any_state_occupied_tt: "Setiap negara bagian inti yang diduduki (Saat ini: 0):"
PHI_hukbalahap: "Hukbalahap"
PHI_hukbalahap_desc: "Hukbo ng Bayan Laban sa Hapon (Tentara Rakyat Melawan Jepang), atau disingkat Hukbalahap, adalah gerakan gerilya komunis yang dibentuk oleh para petani di Luzon Tengah yang telah terbukti menjadi salah satu pejuang perlawanan yang paling cakap di seluruh [PHI.GetNameDef]. Mereka sangat terorganisir dan termotivasi, namun mereka kekurangan senjata. Kita harus memberi mereka beberapa."
PHI_if_communist_tt: "Jika §Y$PHI_partido_komunista_ng_pilipinas_coup$§! telah selesai:"
PHI_local_resistance: "Resistensi Lokal"
PHI_local_resistance_desc: "Para penjajah tidak banyak bersahabat dengan kebijakan mereka, dan ada banyak ketidakpuasan yang bisa kita manfaatkan. Setiap orang dapat melakukan bagiannya, petani menyembunyikan perbekalan dari tentara musuh, nelayan mengangkut pemberontak, tentara melatih orang lain dalam teknik tempur, dan pedagang menyediakan peralatan dan uang, semuanya untuk membantu perlawanan."
PHI_if_chinese_immigration_tt: "Jika §Y$PHI_encourage_chinese_immigration$§! telah selesai:"
PHI_submarine_supplies: "Perlengkapan Kapal Selam"
PHI_submarine_supplies_desc: "Adanya kehadiran angkatan laut musuh dalam jumlah besar sehingga sangat sulit mendapatkan dukungan dari luar negeri. Kita dapat meminta beberapa kapal selam untuk memberikan dukungan rahasia, terdapat banyak tempat persembunyian di kepulauan kita, dan banyak nelayan yang bersedia mengangkut perbekalan ke pulau mana pun yang mereka butuhkan."
PHI_the_hunters: "Para Pemburu"
PHI_the_hunters_desc: "Kadet dari Akademi Militer Filipina melarikan diri ke persembunyian ketika penjajah menutup institusi tersebut. Sejak itu, mereka membentuk 'Para Pemburu' dan memanfaatkan keterampilan mereka dengan baik, melatih penduduk setempat dalam teknik tempur dan pengumpulan intelijen untuk secara aktif melakukan perlawanan terhadap musuh-musuh kita di sekitar Manila."
PHI_will_gain_hunters: "Akan mendapatkan 3 brigade Hunters ROTC setelah menyelesaikan §Y$PHI_grassroot_guerillas$§!."
PHI_the_cry: "Tangisan"
PHI_the_cry_desc: "Teriakan Pugad Lawin adalah seruan yang menandai dimulainya Revolusi Filipina melawan Kekaisaran Spanyol. Ini adalah satu lagi perang demi kebebasan kita, bahkan keberadaan kita sendiri, jadi inilah waktunya sekali lagi untuk menyuarakan seruan kita, dan berjuang!"
PHI_will_gain_hukbalahap: "Akan mendapatkan 3 brigade Hukbalahap setelah menyelesaikan §Y$PHI_grassroot_guerillas$§!."
PHI_juramentado: "Juramentado"
PHI_juramentado_desc: "Juramentado adalah pejuang Moro dan Sulu yang bersumpah untuk berperang sampai mati melawan penjajah. Meskipun ritual-ritual lama telah memudar, semangat pengorbanan yang tak kenal takut masih tetap ada. Dengan menganut tradisi ini, kita dapat menginspirasi para pejuang perlawanan untuk melancarkan serangan dahsyat yang membuat takut penjajah dan menguatkan rakyat kita sendiri."
PHI_will_gain_juramentado: "Akan mendapatkan 3 brigade Juramentado setelah menyelesaikan §Y$PHI_grassroot_guerillas$§!."
PHI_exile_support: "Dukungan Pengasingan"
PHI_exile_support_desc: "Ada banyak warga Filipina yang tinggal di negara lain, dan kita dapat meminta bantuan mereka untuk memberikan dukungan finansial dan material. Dana ini kemudian dapat diselundupkan ke pejuang perlawanan kita yang gagah berani, atau digunakan untuk membentuk unit tempur Filipina untuk digunakan dalam pembebasan kita."
PHI_grassroot_guerillas: "Gerilyawan Akar Rumput"
PHI_grassroot_guerillas_desc: "Ada banyak sekali organisasi perlawanan yang beroperasi di lapangan di seluruh negara kita, namun yang kurang dari mereka adalah komando dan kendali terpusat untuk mengarahkan semua upaya mereka dalam upaya yang lebih terkoordinasi untuk menggulingkan penjajah. Semangat juangnya sudah ada, hanya perlu dimanfaatkan dengan baik dan diarahkan pada sasaran yang paling rentan."
PHI_grassroot_guerillas_tt: "Memunculkan 3 brigade pasukan gerilya untuk setiap fokus prasyarat yang diselesaikan. Negara-negara yang dibebaskan dan kemudian negara-negara dengan sedikit pasukan musuh akan diprioritaskan sebagai lokasi."
PHI_reconquista: "Penaklukan kembali"
PHI_reconquista_desc: "Dari pegunungan Luzon, hingga hutan di Mindanao, rakyat kami telah mengalami pendarahan dan penderitaan di bawah pendudukan. Kini, waktunya telah tiba untuk merebut kembali tanah kami, kota demi kota, pulau demi pulau. Sama seperti nenek moyang kita melawan penjajah, kita sekarang berjuang untuk mengusir penjajah dan memulihkan bangsa kita. Ini adalah Reconquista kita – perjuangan terakhir bagi Filipina."
PHI_rebuild_sakdalistas: "Membangun kembali Sakdalis"
PHI_rebuild_sakdalistas_desc: "Pada malam tanggal 2 Mei 1935, 65.000 petani yang bersenjata sebagian menghancurkan kedamaian Filipina dalam upaya untuk merebut kekuasaan dari pemerintah yang didukung Amerika. Upaya ini gagal, namun kemarahan terhadap kesenjangan kekayaan yang semakin besar antara kaum kaya di perkotaan dan kaum miskin di pedesaan terus membara, menunggu untuk dimanfaatkan."
PHI_slippery_slope: "Lereng Licin"
PHI_slippery_slope_desc: "Meningkatnya pengaruh Jepang terhadap negara kita mulai menimbulkan ketidakpuasan. Yang perlu kita lakukan hanyalah mundur, dan menyaksikan kemarahan terhadap keserakahan yang melekat pada sistem demokrasi dan kapitalis yang korup meledak, meninggalkan kekosongan yang dengan senang hati dapat diisi oleh ideologi radikal."
PHI_assassination_of_quezon: "Pembunuhan Quezon"
PHI_assassination_of_quezon_desc: "Sungguh disayangkan kenyataan bahwa 'Presiden' Quezon telah terlalu lama menahan Filipina. Anjing piaraan Amerika telah melakukan semua yang dia bisa untuk memastikan bahwa keinginan nasional rakyat Filipina belum terwujud. Institusi-institusi yang ia bangun di sekelilingnya telah membuatnya kebal terhadap perubahan demokrasi, jadi sekarang kita harus memajukan politik melalui cara-cara lain."
PHI_assassination_of_quezon_tt: "§RRencana sedang dijalankan untuk berupaya agar Quezon dicopot dari jabatannya. Secara permanen.§!"
PHI_eisenhower_steps_in_flag: "Eisenhower telah melakukan intervensi"
PHI_makapili: "Makapili"
PHI_makapili_desc: "Kebangkitan fasisme di negara Filipina berlangsung sangat cepat, dan sayangnya hal ini juga disertai dengan sejumlah kekacauan. Teman-teman kita di luar negeri telah menawarkan senjata dan pelatihan untuk pembentukan 'Tentara Perdamaian' guna menjaga ketertiban, melawan bandit dan menumpas pemberontakan."
PHI_sakdalista_exiles_returned_flag: "Orang-orang buangan Sakdalista Telah Kembali (Event)"
PHI_form_the_executive_commision: "Bentuk Komisi Eksekutif"
PHI_form_the_executive_commision_desc: "Sebuah komplotan rahasia yang terdiri dari para pemimpin telah melakukan hal-hal yang tidak diinginkan, namun kini setelah cita-cita fasis mulai berkuasa di Filipina, inilah saatnya bagi orang-orang ini untuk mengambil tindakan dan mengambil posisi yang selayaknya sebagai pemimpin pemerintahan."
PHI_aguinaldos_coup: "Perebutan Kepemimpinan"
PHI_aguinaldos_coup_desc: "Ketika kekacauan akibat pengambilalihan pemerintah mulai mereda, tokoh-tokoh di dalam Komisi Eksekutif bersaing untuk mendapatkan kendali. Rezim otoriter memerlukan otoritas yang berbeda untuk memerintah mereka, dan dukungan semakin kuat."
PHI_resolve_interregnum_tt: "§GIni akan menyelesaikan masa peralihan pemerintahan, dan memungkinkan penunjukan pemimpin baru.§!"
PHI_secure_japanese_guarantees: "Jaminan Jepang yang Aman"
PHI_secure_japanese_guarantees_desc: "Jika kita ingin benar-benar mempercepat kemerdekaan kita dari Amerika Serikat, maka kita perlu bersiap menghadapi kemungkinan perang yang sangat nyata karena mereka tidak akan membiarkan antek mereka begitu saja. Kita harus menghubungi sponsor kita di Jepang dan mendapatkan lebih banyak dukungan militer resmi jika terjadi permusuhan."
PHI_war_of_independence: "Perang Kemerdekaan"
PHI_war_of_independence_desc: "Beri aku kebebasan, atau beri aku kematian! Sudah waktunya bagi para penindas kolonial untuk meninggalkan wilayah kita untuk selamanya.\n\nMatahari baru terbit di Filipina."
PHI_will_take_peace_decision: "§Y[USA.GetName]§! akan mengambil keputusan ini jika §Y[ROOT.GetNameDef]§! berhasil mempertahankan diri selama satu tahun, atau lebih cepat jika mereka kehilangan pangkalan di pulau terdekat atau terlibat dalam perang di tempat lain."
PHI_second_philippine_republic: "Republik Filipina Kedua"
PHI_second_philippine_republic_desc: "Meskipun belum tercapai, upaya kita untuk mencapai kemerdekaan semakin dekat. Langkah selanjutnya adalah membentuk republik baru untuk mempromosikan pemisahan kita secara resmi, dan dari sana mulai merancang pemerintahan baru kita – dan tentu saja, bendera baru."
PHI_second_republic_tag_tt: "§Y[PHI.GetName]§! akan dikenal sebagai §YRepublik Filipina Kedua§!"
PHI_election_overturned: "Pemilu Dibatalkan"
PHI_election_overturned_desc: "Pemilu tahun 1935 sebagian besar mendukung Manuel Quezón, namun sedikit terlalu banyak. Emilio Aguinaldo telah menyoroti kekhawatiran yang serius, dan menyampaikannya kepada Amerika Serikat yang telah menjanjikan penyelidikan menyeluruh terhadap kemungkinan manipulasi pemilu."
PHI_hispanidad_filipina: "Hispanidad Filipina"
PHI_hispanidad_filipina_desc: "Meskipun terdapat jurang pemisah yang tercipta akibat Perang Kemerdekaan melawan Kekaisaran Spanyol pada tahun 1896-1898, banyak masyarakat Filipina yang masih menganggap diri mereka sebagai bagian dari diaspora Hispanik, dan ketegangan yang sedang berlangsung di daratan Spanyol telah menjadi suatu hal yang memprihatinkan."
PHI_spanish_refugees: "Pengungsi Spanyol"
PHI_spanish_refugees_desc: "Dengan kerusakan akibat perang saudara di negara asalnya, banyak warga Spanyol mencari perlindungan di tempat lain. Dengan semakin menghangatnya hubungan antara kami dan Spanyol, sejumlah besar masyarakat Spanyol mencari perlindungan di kepulauan kami."
PHI_if_supported_scw_side_lost_tt: "Jika pihak §Yperang saudara Spanyol§! yang kami kirimi sukarelawan dikalahkan:"
PHI_if_supported_scw_side_wins_tt: "Jika salah satu pihak dalam §Yperang saudara Spanyol§! menang setelah menerima sukarelawan dari kami, §Y$PHI_reconciliation_with_spain$§! akan memberikan dampak yang lebih baik."
PHI_reconciliation_with_spain: "Rekonsiliasi dengan Spanyol"
PHI_reconciliation_with_spain_desc: "[ReconciliationWithSpain]"
PHI_reconciliation_with_spain_winner: "Para sukarelawan kita yang berjuang bersama dengan pemerintah Spanyol yang menang telah membentuk ikatan baru yang lebih kuat di antara kedua negara, dan kita harus memanfaatkan hal ini dalam kapasitas yang lebih resmi untuk menyelaraskan negara-negara kita di masa depan."
PHI_reconciliation_with_spain_loser: "Meskipun para sukarelawan kami berjuang melawan mereka, pemerintah Spanyol dengan enggan mengakui ikatan budaya dan teologis yang sama di antara kami, dan menganggap perlu untuk memasukkan hal ini ke dalam propaganda mereka yang menekankan kesatuan global lintas-Hispanik."
PHI_reconciliation_with_spain_neutral: "Spanyol memiliki pengaruh yang tidak diragukan lagi terhadap perkembangan bangsa kita, namun sebagian besar sejarah kita saat ini bersifat antagonis karena ikatan kolonial kita. Meskipun demikian, tidak dapat dipungkiri bahwa kita memiliki lebih banyak kesamaan dengan mereka, kita hanya perlu dipertemukan secara setara."
PHI_hispanic_overtures: "Tawaran Hispanik"
PHI_hispanic_overtures_desc: "Kami bukan satu-satunya negara di dunia yang memiliki koneksi Hispanik, bahkan banyak negara di Amerika Selatan yang memiliki koneksi tersebut, dan kami terus membina hubungan positif dengan beberapa di antaranya. Kita harus menjangkau dan mencoba menjadikan hubungan ini lebih formal."
PHI_revolutionary_regrets: "Penyesalan Revolusioner"
PHI_revolutionary_regrets_desc: "Di bawah Spanyol, kami selalu menjadi subyek atau warga negara Spanyol, namun sekarang di bawah Amerika Serikat, kami hanya menjadi pasar konsumen bagi ekspor mereka, jika bukan paria, karena mereka tidak pernah menjadikan kami warga negara dari negara bagian mana pun di Amerika Serikat."
PHI_royal_exiles: "Orang buangan Kerajaan"
PHI_royal_exiles_desc: "Kerajaan Spanyol telah mengalami serangkaian turun tahta, baik secara paksa maupun sukarela, dan pencabutan hak waris, namun keluarga tersebut masih ada dan mencari perlindungan. Kita bisa mendapatkan prestise yang besar di dunia Hispanik dengan menawarkan perlindungan kepada mereka."
PHI_reino_de_filipinas: "Reino de Filipina"
PHI_reino_de_filipinas_desc: "Semua hal sudah berjalan dengan baik, dan dengan Spanyol yang terpecah belah karena perpecahan internal, Filipina telah bangkit menjadi jantung dunia Hispanik. Kami hanya kekurangan penobatan untuk memperkuat posisi kami, ini akan menjadi momen puncak dalam sejarah kami."
PHI_unlock_unification_decision_tt: "Membuka Keputusan: §YMengusulkan Unifikasi dengan Anggota Fraksi§!"
PHI_unlock_conquer_decision_tt: "Membuka Keputusan: §YMemaksa Integrasi Bangsa Hispanik§!"
PHI_unlock_mutual_assistance_with_spain_tt: "Membuka Keputusan: §YMengusulkan Perjanjian Saling Membantu dengan [SPR.GetNameDef]§!"
PHI_war_for_the_oceans: "Perang untuk Lautan"
PHI_war_for_the_oceans_desc: "Secara historis, kita adalah masyarakat pelaut, dan inilah saatnya untuk mendapatkan kembali hak kesulungan kita, dan mengklaim wilayah yang paling kita kenal. Lautan."
PHI_assume_the_naval_burden: "Asumsikan Beban Angkatan Laut"
PHI_assume_the_naval_burden_desc: "Jepang terlibat konflik di darat, sedangkan spesialisasi kita tetap di laut. Kita harus menawarkan untuk mengambil tanggung jawab atas konflik angkatan laut, sehingga mereka dapat fokus sepenuhnya pada bidang lain."
PHI_develop_naval_infrastructure: "Mengembangkan Infrastruktur Angkatan Laut"
PHI_develop_naval_infrastructure_desc: "Dengan meningkatnya ambisi maritim kita, kemampuan pembuatan kapal kita juga harus meningkat."
PHI_reunite_madagascar: "Menyatukan kembali Madagaskar"
PHI_reunite_madagascar_desc: "Meskipun dipisahkan oleh perbedaan besar, penduduk asli Malagasi adalah keturunan campuran Austronesia-Afrika, yang berarti mereka memiliki hubungan dekat dengan masyarakat kita sendiri. Kita harus menutup jarak ini di antara kita."
PHI_claim_to_core_tt: "Membuka keputusan untuk §YMendapatkan Inti§! setelah kami mengendalikannya."
PHI_take_pacific_islands: "Ambil contoh Kepulauan Pasifik"
PHI_take_pacific_islands_desc: "Filipina sudah menjadi negara kepulauan, jadi hanya diperlukan sedikit imajinasi untuk memperluas perbatasan negara kita lebih jauh ke timur melintasi Pasifik."
PHI_malayo_polynesia: "Malayo-Polinesia"
PHI_malayo_polynesia_desc: "Secara historis, kami memiliki hubungan budaya, sejarah, dan etnis yang erat dengan Semenanjung Malaya dan Hindia. Mengingat hubungan persaudaraan ini, kita harus memberikan kepada mereka hak-hak dan keistimewaan yang sama yang dinikmati oleh rakyat kita sendiri."
PHI_war_for_oceania: "Perang Oseania"
PHI_war_for_oceania_desc: "Oseania ditentukan oleh lautan itu sendiri, namun masyarakat kita telah melakukan perjalanan melintasi perairan ini sejak dahulu kala. Sudah waktunya untuk memasukkan pulau-pulau ini ke dalam negara kita yang sedang berkembang."
PHI_conquest_of_japan: "Penaklukan Jepang"
PHI_conquest_of_japan_desc: "Jepang telah lama menjadi pesaing utama kita dalam hal penguasaan maritim di kawasan ini, jadi inilah saatnya untuk menghentikan persaingan tersebut dan mengerahkan dominasi kita terhadap mereka untuk selamanya."
PHI_filipino_polynesian_reunification: "Penguasa Pasifik"
PHI_filipino_polynesian_reunification_desc: "Wilayah dunia ini didominasi oleh lautan, terdiri dari daratan yang tersebar dan pulau-pulau yang jauh namun kita telah menaklukkan semuanya. Dengan demikian, kita mengamankan tempat yang selayaknya kita sebagai penguasa Pasifik."
PHI_polynesia_tag_tt: "§Y[PHI.GetName]§! akan mendapatkan bendera dan nama baru."
PHI_petition_the_supreme_court: "Ajukan petisi ke Mahkamah Agung"
PHI_petition_the_supreme_court_desc: "Komunisme secara resmi dilarang oleh Mahkamah Agung pada tahun 1932, namun, kita telah menemukan sebuah teknis yang sekali lagi dapat melegalkan gerakan ini, kita hanya perlu menandatangani dan menyerahkan petisi untuk melakukannya."
PHI_legalize_the_communist_party: "Melegalkan Partai Komunis"
PHI_legalize_the_communist_party_desc: "Kini setelah Komunisme sebagai sebuah gerakan kembali legal, langkah berikutnya adalah membawa partai keluar dari bayang-bayang, dan sekali lagi mengumumkan aksi-aksi mereka ke publik, dan memulai upaya untuk mengembangkan gerakan tersebut."
PHI_return_of_the_exiles: "Kembalinya Orang-Orang buangan"
PHI_return_of_the_exiles_desc: "Sejumlah orang penting yang beraliran sayap kiri terpaksa meninggalkan rumah mereka di seluruh Asia Tenggara karena ancaman dari aliran kolonialis dan kapitalis. Kita bisa membuka perbatasan kita bagi mereka, dan menawarkan janji tempat berlindung yang aman."
PHI_support_for_chinese_communists: "Dukungan untuk Komunis Tiongkok"
PHI_support_for_chinese_communists_desc: "Komunis melanjutkan perjuangan mereka di Tiongkok, baik melawan serangan Jepang maupun melawan panglima perang Tiongkok. Kita mempunyai kesempatan untuk menyelundupkan orang-orang dan material mereka ke sepanjang Sungai Kuning, baik untuk mendukung perjuangan mereka secara langsung, atau sekadar menyediakan bahan bakar untuk mengobarkan api konflik di wilayah tersebut."
PHI_the_red_sun_over_manila: "Matahari Merah Di Atas Manila"
PHI_the_red_sun_over_manila_desc: "Sentimen komunis meningkat di seluruh Filipina, dan untuk pertama kalinya peluang tentatif untuk mengambil alih kekuasaan muncul. Pemberontakan Sakdalista yang gagal menjadi pengingat akan kesia-siaan pemberontakan bersenjata melawan pemerintah yang didukung Amerika, dan sebaliknya kita harus mencari cara yang lebih politis untuk mengambil alih kekuasaan."
PHI_partido_komunista_ng_pilipinas_coup: "Partido Komunista ng Pilipinas Kudeta"
PHI_partido_komunista_ng_pilipinas_coup_desc: "Ini dimulai dengan pemogokan umum di kalangan petani, yang kemudian meluas ke rekan-rekan mereka di pabrik. Rakyat telah angkat bicara, dan Majelis Nasional telah jatuh ke tangan Komunis. Kini, serikat pekerja dan kolektif berebut untuk memilih komite pusat yang baru, dan yang paling penting, menentukan siapa yang harus mencalonkan diri sebagai Sekretaris Jenderal yang baru."
PHI_national_confederation: "Konfederasi Nasional"
PHI_national_confederation_desc: "Kini setelah kita berkuasa, sekarang saatnya untuk mulai mengkonsolidasikan kekuasaan kita. Kalipunang Pambansa ng Magbubukid sa Pilipinas (Konfederasi Nasional Petani di Filipina) sebagai organisasi petani terkemuka harus menjadi salah satu pihak pertama yang melakukan pendekatan untuk mencapai tujuan ini."
PHI_anti_intervention_strategies: "Strategi Anti-Intervensi"
PHI_anti_intervention_strategies_desc: "Dengan meningkatnya ketegangan antara AS dan AS, kita harus melakukan apa yang kita bisa untuk memastikan kelangsungan jangka panjang negara Komunis yang baru lahir ini, melalui konsesi yang ditargetkan, atau mengambil apa yang kita bisa dari mereka sebelum ketegangan ini berubah menjadi permusuhan."
PHI_rally_the_fisherfolk: "Kumpulkan Nelayan"
PHI_rally_the_fisherfolk_desc: "Sebagai negara kepulauan, industri perikanan kita besar dan dikelola dengan baik. Oleh karena itu, kita harus memperhatikan para petani laut ini, dan membangkitkan mereka ke dalam gerakan Komunis dan memanfaatkan potensi maritim yang mereka tawarkan."
PHI_smugglers: "Penyelundup"
PHI_smugglers_desc: "Negara kita terdiri dari banyak pulau dan pulau kecil, yang menawarkan banyak pilihan sudut dan celah tersembunyi yang telah digunakan masyarakat kita selama beberapa generasi untuk menyelundupkan barang di luar jangkauan otoritas resmi. Kita harus memanfaatkan pengalaman ini dan mengubahnya menjadi keuntungan kita!"
PHI_struggle_conference: "Konferensi Perjuangan"
PHI_struggle_conference_desc: "Gerakan Komunis kita harus menghadapi banyak konflik dan ketegangan yang berbeda-beda, dan tanggapan kita terhadap hal ini memerlukan reaksi yang lebih terorganisir dan resmi. Oleh karena itu, kita perlu mempertemukan para pemimpin kita dalam Konferensi Perjuangan yang pertama di mana semua permasalahan ini diajukan dan diselesaikan."
PHI_sanction_piracy: "Sanksi Pembajakan"
PHI_sanction_piracy_desc: "Negara kepulauan kita menjadi tuan rumah bagi banyak kapal kecil dan anak-anak muda yang giat, dan oleh karena itu akan menjadi kriminal jika kita tidak memanfaatkan sistem lama 'Letters of Marque' di mana kita memberikan dasar hukum bagi individu-individu bajak laut ini untuk menyerang musuh-musuh kita, hanya untuk melarikan diri kembali ke teluk-teluk kecil mereka dengan hadiah maritim yang baru mereka peroleh."
PHI_infiltrate_chinese_ports: "Menyusup ke Pelabuhan Tiongkok"
PHI_infiltrate_chinese_ports_desc: "Para Pekerja Pelabuhan kami merupakan kelompok pertama yang memanfaatkan peluang yang ditawarkan oleh Komunisme, dan oleh karena itu mereka telah lama menjadi sekutu kami yang paling setia. Kita harus menggunakan sentimen yang sama di pelabuhan-pelabuhan Tiongkok, dan kemudian menggunakannya untuk memberikan batu loncatan menuju intervensi lebih lanjut dalam perjuangan Tiongkok."
PHI_every_non_communist_coastal_warlord: "Setiap panglima perang non-komunis dan pesisir Tiongkok:"
PHI_maritime_communism: "Komunisme Maritim"
PHI_maritime_communism_desc: "Sementara banyak negara Komunis fokus pada mobilisasi rakyatnya menuju gerakan massal militer di darat, kita seharusnya memanfaatkan mobilisasi massal kekuatan maritim kita, dan melepaskan pasukan lintas laut ini ke lautan di dunia dan dengan demikian menyatukan semuanya di bawah Gerakan Komunis Maritim."
PHI_pan_pacific_trade_union_secretariat: "Sekretariat Serikat Buruh Pan Pasifik"
PHI_pan_pacific_trade_union_secretariat_desc: "Meskipun kita telah memperoleh manfaat dari Komunisme bagi diri kita sendiri dan rakyat kita, gerakan ini tidak boleh dibiarkan terisolasi dan terisolasi. Kita harus mengekspor filosofi kita, dan cara untuk mewujudkannya, kepada peserta lain di Asia Tenggara, dan dengan demikian membentuk Sekretariat Serikat Buruh Pan Pasifik untuk perlindungan dan evolusi bersama."
PHI_comitern: "Komintern"
PHI_comitern_desc: "Meskipun hubungan kita dengan [SOV.GetNameDef] sangat lemah, kita tidak dapat menyangkal kekuatan mereka di panggung internasional, dan jika kita ingin eksperimen Komunis kita terus berlanjut dan diekspor ke negara lain, kita harus bersatu dalam satu lingkup demi kemajuan cita-cita Sosialis secara global."
PHI_national_defense_act: "UU Pertahanan Negara"
PHI_national_defense_act_desc: "Undang-Undang Pertahanan Nasional disahkan pada tanggal 21 Desember 1935, dan dengan itu sejumlah 16.000.000 peso dialokasikan untuk angkatan bersenjata Filipina. Yang tersisa sekarang hanyalah menentukan bagaimana dan di mana membelanjakan jumlah tersebut. Setiap cabang militer membutuhkan investasi, begitu pula pertahanan yang penting bagi keamanan kita."
PHI_war_plan_orange: "Rencana Perang Oranye"
PHI_war_plan_orange_desc: "Premis dasar dari War Plan Orange adalah bahwa Filipina harus terus berfungsi sebagai pangkalan operasi garis depan Amerika jika terjadi konflik, dan oleh karena itu aset terpenting yang harus dipertahankan adalah Teluk Manila. Kita harus melaksanakan arahan pertahanan untuk mengatasi hal ini, dan memusatkan pertahanan kita di sekitar wilayah strategis yang kritis ini."
PHI_beach_defense_strategy: "Strategi Pertahanan Pantai"
PHI_beach_defense_strategy_desc: "Dengan senjata yang cukup, dan tentara yang cukup, kita harus mampu mempertahankan perimeter Filipina, dan oleh karena itu kita harus menetapkan strategi pertahanan dengan mempertimbangkan tujuan ini. Dengan cara ini, kita dapat memastikan bahwa Filipina secara keseluruhan tetap berinvestasi dalam potensi kampanye militer jangka panjang."
PHI_fortify_corregidor: "Perkuat Corregidor"
PHI_fortify_corregidor_desc: "Pulau Corregidor berdiri tepat di pintu masuk Teluk Manila, dan dengan demikian merupakan kunci bagi kelanjutan kendali kami atas teluk tersebut dan aset angkatan lautnya di sana. Kita harus meningkatkan benteng di pulau itu sendiri, dan membangun fasilitas bawah tanah untuk membantu menahan pengepungan dan pemboman yang berkepanjangan oleh angkatan udara dan angkatan laut musuh."
PHI_fortify_corregidor_bypass_tt: "Tidak ada lagi §Y$bunker$§! dan §Y$coastal_bunker$s§! yang dapat dibangun di kota Manila."
PHI_bastion_bataan: "Benteng Bataan"
PHI_bastion_bataan_desc: "Semenanjung Bataan adalah lokasi pertahanan alami yang terletak di salah satu sisi Teluk Manila. Selama kita mengamankan lokasi ini, kita akan dapat mengontrol siapa dan apa yang dapat menggunakan Teluk dan fasilitasnya. Untuk memastikan dominasi kami yang berkelanjutan di wilayah ini, kami perlu mengembangkan garis pertahanan di sepanjang sisi darat, dan menempatkan artileri di tempat yang tinggi."
PHI_bastion_bataan_bypass_tt: "Tidak ada lagi §Y$bunker$§! yang dapat dibangun di perbatasan negara bagian Bataan, dan tidak ada §Y$coastal_bunker$s§! yang dapat dibangun di Bataan, maupun di Dagupan."
PHI_coastal_artillery: "Artileri Pesisir"
PHI_coastal_artillery_desc: "Tidak diragukan lagi, di rangkaian pulau, bagian dengan sasaran terbanyak yang tersedia adalah Artileri Pesisir, yang mampu menyerang sasaran di darat dan laut. Investasi dalam memperlengkapi, melatih dan meningkatkan unit-unit ini harus menjadi prioritas."
PHI_the_concrete_battleship: "Kapal Perang Beton"
PHI_the_concrete_battleship_desc: "Fort Drum, benteng pelabuhan Teluk Manila yang paling mengesankan, menyerupai kapal perang. Konstruksi dimulai pada tahun 1909 dan sepanjang karirnya telah menerima peningkatan dalam persenjataan dan struktur pendukung. Benteng yang terhormat, yang dikenal sebagai USS No-Go, sekali lagi dipanggil untuk bertugas di era baru peperangan modern ini."
PHI_philippine_scouts: "Pramuka Filipina"
PHI_philippine_scouts_desc: "Didirikan pada tahun 1901, organisasi Pramuka Filipina terdiri dari kontingen terbesar warga Filipina yang bertugas di militer kita, dan kita harus terus mendukung unit ini dan memastikan mereka diberikan pelatihan dan peralatan terbaik untuk memenuhi peran mereka sebagai pasukan spesialis yang ditugaskan untuk melindungi tanah air kita."
PHI_militarize_the_constabulary: "Militerisasikan Kepolisian"
PHI_militarize_the_constabulary_desc: "Kepolisian Filipina telah digabungkan ke dalam Angkatan Darat Filipina tengah dengan Undang-Undang Pertahanan Nasional, namun jika dipikir-pikir, hal ini mungkin merupakan kesalahan karena pasukan polisi yang menggantikannya terbukti tidak memadai. Kita sebaiknya membangun kembali Kepolisian tetapi membiarkan mereka dilengkapi dengan senjata dan pelatihan militer, sehingga mereka dapat mengabdi dan melindungi negara kita."
PHI_philippine_army_orchestra: "Orkestra Angkatan Darat Filipina"
PHI_philippine_army_orchestra_desc: "Band Polisi Filipina adalah salah satu band militer terkemuka di dunia, dan diberi kehormatan bermain pada pelantikan Presiden AS. Kita harus mengintegrasikan band ini dengan militer untuk lebih memanfaatkan kekuatan musik bagi tentara kita, dan menggunakan energi semangatnya untuk menanamkan semangat nasional, dan untuk membangkitkan mereka menuju prestasi keberanian yang lebih besar."
PHI_philippine_military_academy: "Akademi Militer Filipina"
PHI_philippine_military_academy_desc: "Selama bertahun-tahun, Akademi Kepolisian Filipina berfungsi sebagai sekolah pelatihan perwira pusat di negara kita, namun kita kekurangan tempat belajar militer formal. Kita harus memasukkan lembaga ini ke dalam angkatan bersenjata, dan secara resmi menetapkannya sebagai Akademi Militer Filipina baru yang didedikasikan untuk pendidikan dan pengembangan elit militer masa depan."
PHI_philippine_division: "Divisi Filipina"
PHI_philippine_division_desc: "Divisi Filipina ditugaskan untuk mempertahankan pulau-pulau kami, namun perlengkapannya buruk dan kekurangan staf. Kita harus mencari keahlian dari luar dalam hal kepemimpinan, dan memastikan kita memiliki senjata dan peralatan yang lebih modern untuk pasukan kita."
PHI_10_year_training_plan: "Rencana Pelatihan 10 Tahun"
PHI_10_year_training_plan_desc: "Dengan janji transisi menuju kemerdekaan dalam jangka waktu sepuluh tahun, Undang-Undang Pertahanan Nasional memuat ketentuan untuk melatih kekuatan yang mandiri dan mandiri yang mampu mempertahankan negara kita. Hal ini mencakup peralihan menuju tentara reguler, skema pelatihan perwira, pembentukan pasukan cadangan, dan investasi pada infrastruktur militer."
PHI_battalion_combat_teams: "Tim Tempur Batalyon"
PHI_battalion_combat_teams_desc: "Realitas perang dengan jelas menunjukkan bahwa kita membutuhkan kekuatan yang dikembangkan agar lebih mobile dan fleksibel, mampu beradaptasi dengan situasi apa pun yang muncul. Mereka harus mempertahankan hierarki yang lebih longgar dan diberi wewenang untuk melakukan tindakan-tindakan unit kecil."
PHI_battalion_combat_teams_tt: "§Y$category_all_infantry$§!:\nSerangan Lembut: §G+15%§!\nSerangan Keras: §G+15%§!\nMenembus: §G+15%§!\n§Y$category_cavalry$§!:\nSerangan Lembut: §G+10%§!\nSerangan Keras: §G+10%§!\nMenembus: §G+10%§!"
PHI_mandatory_conscription: "Wajib Militer"
PHI_mandatory_conscription_desc: "Pembelaan [PHI.GetNameDef] adalah tanggung jawab setiap warga negara. Oleh karena itu, warga negara harus diwajibkan wajib militer sehingga mereka dapat diajari dasar-dasar pertempuran, dan oleh karena itu siap dan dilatih jika mereka diharuskan melakukan tugas militer."
PHI_self_reliance_defense: "Pertahanan Kemandirian"
PHI_self_reliance_defense_desc: "Kita selama ini sangat bergantung pada kontribusi negara-negara lain untuk menjaga negara kita, namun hal ini telah memperlihatkan kelemahan strategis yang serius. Kita harus menciptakan sarana kita sendiri untuk melindungi diri kita sendiri, dan hal ini dimulai dengan pengembangan basis industri yang mampu mendukung kekuatan baru kita dengan bahan apa pun yang mereka perlukan."
PHI_army_of_the_philippines: "Tentara Filipina"
PHI_army_of_the_philippines_desc: "Angkatan bersenjata kita telah berkembang secara signifikan hanya dalam beberapa tahun saja, dan inilah saatnya untuk mengesampingkan ketergantungan pada dukungan asing dan bergerak dengan penuh percaya diri menuju masa depan yang baru, cerah dan aman, yang sepenuhnya dilindungi oleh darah dan baja Filipina. Mulai sekarang, keamanan kami adalah perhatian kami sendiri."
PHI_army_air_corps: "Korps Udara Angkatan Darat"
PHI_army_air_corps_desc: "Korps Udara Angkatan Darat, meskipun terbatas dalam ukuran dan sumber daya, tidak kekurangan ambisi. Pulau-pulau kita jarang dan sulit untuk dilintasi sehingga kita harus berinvestasi lebih besar pada kemampuan udara kita agar dapat menjangkau sebanyak mungkin wilayah."
PHI_pilot_training_programme: "Program Pelatihan Percontohan"
PHI_pilot_training_programme_desc: "Pilot adalah sumber daya yang sangat penting, dan kita sangat kekurangan sumber daya tersebut mengingat buruknya kondisi industri penerbangan kita. Kita harus menjadi perantara perjanjian dengan negara-negara lain untuk memungkinkan pelatihan generasi muda kita dalam profesi yang cemerlang ini."
PHI_off_shore_patrol: "Patroli Lepas Pantai"
PHI_off_shore_patrol_desc: "Angkatan udara kita harus mampu melindungi langit baik di darat maupun di laut. Oleh karena itu, kita harus menyediakan pesawat khusus angkatan laut dengan jangkauan lebih luas dan kemampuan anti-kapal sehingga kita dapat menyerang penyerang bahkan sebelum mereka dapat melihat pantai kita."
PHI_expand_airbases: "Perluas Pangkalan Udara"
PHI_expand_airbases_desc: "Bahkan jika sekutu kita ingin mengerahkan angkatan udara ke pulau-pulau kita, atau jika kita mengembangkan kemampuan untuk memproduksinya sendiri, kita tidak mempunyai ruang untuk benar-benar menempatkan mereka! Kita harus segera membuat lapangan terbang dan bandar udara baru agar pesawat lebih mudah ditempatkan di sini."
PHI_develop_domestic_aircraft_industry: "Mengembangkan Industri Pesawat Terbang Dalam Negeri"
PHI_develop_domestic_aircraft_industry_desc: "Mengandalkan teman dan sekutu kita sejauh ini baik-baik saja, namun pada akhirnya jika kita ingin diakui sebagai negara merdeka dengan kemampuan militer kita sendiri di dunia modern ini, maka kita harus mulai berinvestasi di industri penerbangan dalam negeri kita sendiri. Hal ini dapat dimulai dengan memberikan subsidi kepada para inovator dan pengusaha udara di negara kita."
PHI_if_align_with_japan_tt: "Jika §Y$PHI_align_with_japan$§! telah selesai:"
PHI_if_align_with_the_usa_tt: "Jika §Y$PHI_align_with_the_usa$§! telah selesai:"
PHI_philippine_air_force: "Angkatan Udara Filipina"
PHI_philippine_air_force_desc: "Sudah saatnya angkatan udara diakui sebagai entitasnya sendiri, terpisah dari angkatan darat. Dengan begitu terorganisirnya, mereka akan memiliki lebih banyak fleksibilitas dalam pengorganisasian dan perolehan personel dan material. Mereka tidak lagi terikat pada kebutuhan satu layanan, namun bisa terbang untuk melayani keseluruhan."
PHI_thats_not_an_island: "Itu Bukan Pulau!"
PHI_thats_not_an_island_desc: "Meskipun kepulauan kita memberi kita banyak fleksibilitas, hal ini mempunyai beberapa keterbatasan. Misalnya, bagaimana jika kita ingin melakukan operasi jauh dari pulau asal kita? Kalau begitu, kita hanya perlu membawa salah satu pulau itu bersama kita dan dengan demikian mempunyai kemampuan operasional untuk menyerang di mana pun di dunia jika diperlukan."
PHI_offshore_patrol: "Patroli Lepas Pantai"
PHI_offshore_patrol_desc: "Undang-undang Pertahanan Nasional juga memuat ketentuan perlindungan maritim kepulauan Filipina. Hal ini tidak diharapkan menjadi armada samudra biru yang sepenuhnya terbentuk, melainkan armada yang dibangun untuk melindungi pantai asal kita. Hal ini tidak berarti bahwa hal ini tidak bisa menjadi langkah pertama menuju armada yang lebih dominan."
PHI_marine_corps: "Korps Marinir"
PHI_marine_corps_desc: "Kami memiliki banyak pengalaman naik dan turun pantai, banyak orang di komunitas kami bahkan perlu naik feri atau sekadar mendayung antar pulau untuk bekerja atau bertemu keluarga. Kita dapat memanfaatkan pengalaman ini, dan memfokuskannya pada korps marinir terkemuka di dunia, dengan tentara yang mampu melakukan perlawanan di wilayah mana pun, baik di dalam maupun di luar negeri."
PHI_cavite_naval_base: "Pangkalan Angkatan Laut Cavite"
PHI_cavite_naval_base_desc: "Pangkalan angkatan laut di Cavite, terletak di seberang teluk dari kota Manila, memiliki potensi terbesar untuk menjadi pelabuhan perairan dalam dan galangan kapal di Filipina. Negara ini sudah memiliki beberapa fasilitas baru, namun dengan adanya investasi, kapal ini bisa menjadi aset strategis yang serius untuk menempatkan armada yang mampu mengendalikan perairan Asia Tenggara."
PHI_pt_boat_development: "PT Pengembangan Kapal"
PHI_pt_boat_development_desc: "Bangsa kita, yang merupakan kumpulan pulau-pulau besar, akan lebih baik jika menggunakan kapal-kapal kecil yang mampu masuk dan keluar dari perairan sempit di nusantara, untuk mengganggu dan menjatuhkan musuh yang lebih besar. Kita harus membeli keahlian dalam doktrin kapal torpedo, dan menggunakannya untuk mengembangkan aset angkatan laut kita sendiri yang akan disebut Kapal Patroli."
PHI_pt_boat_development_tt: "§G+10%§! Kecepatan Peningkatan Penguasaan untuk §YLayar§!."
PHI_pt_boat_development_2_tt: "§G+20%§! Kecepatan Peningkatan Penguasaan untuk §YKapal Patroli§!."
PHI_mosquito_fleet: "Armada Nyamuk"
PHI_mosquito_fleet_desc: "Sebuah torpedo, atau satu peluru dapat menargetkan dan menenggelamkan satu kapal. Oleh karena itu, kita tidak boleh hanya memiliki satu kapal, tetapi seluruh kawanan. Mereka mungkin bisa mendapatkan satu, sepuluh, bahkan seratus tapi mereka tidak akan mampu menenggelamkan kita semua! Lebih buruk lagi, yang diperlukan hanyalah satu tembakan kita yang berpotensi menjadi kenyataan, dan dengan gerombolan kita, kita juga tidak akan bisa meleset."
PHI_devil_boats: "Perahu Setan"
PHI_devil_boats_desc: "Kapal patroli kami terkenal karena kecepatan dan keberaniannya, dan khususnya karena kemampuannya menyerang dengan keras dan menghilang ke dalam kabut seperti hantu laut. Oleh karena itu, musuh-musuh kita telah belajar untuk menjauh dari pantai kita, agar mereka tidak terjerumus ke dalam 'perahu setan' ini."
PHI_fast_attack_craft: "Kerajinan Serangan Cepat"
PHI_fast_attack_craft_desc: "Evolusi ideal dari Kapal Patroli adalah Kapal Serangan Cepat, dengan kecepatan dan daya tembak yang ditingkatkan secara signifikan, kapal ini dapat berdengung di sekitar pantai kita, dan membawa kehancuran pada musuh kita yang tersesat terlalu dekat, dan melesat lagi sebelum bantuan tiba."
PHI_coastal_defense_ships: "Kapal Pertahanan Pesisir"
PHI_coastal_defense_ships_desc: "Armada kami telah berkembang sedemikian rupa sehingga kami kini memiliki infrastruktur dan sarana untuk merakit dan memelihara kapal yang lebih besar. Tujuan pertama kami tetap melindungi pantai kami sendiri, namun kini kami dapat merancang kapal-kapal yang mampu menghadapi kapal-kapal besar musuh, dengan menggunakan geografi kami sendiri untuk keuntungan mereka."
PHI_philippine_naval_patrol: "Patroli Angkatan Laut Filipina"
PHI_philippine_naval_patrol_desc: "Agar bisa dikenal dengan baik di kancah internasional, khususnya sebagai negara yang terdiri dari banyak pulau, armada kita harus mampu melindungi pantai kita. Untuk mengembangkannya hingga mencapai ukuran dan kemampuan seperti ini, kita harus berupaya meningkatkan dan memperbarui sistem komando dan kendali kita agar sejalan dengan apa yang diharapkan dari armada modern."
PHI_thalassocracy: "Thalassokrasi"
PHI_thalassocracy_desc: "Konsep 'Tentara dengan Negara' sudah dikenal luas, dan sering dipuji oleh Prusia. Namun, kita harus berusaha keras untuk menjadi 'Angkatan Laut dengan Negara', dengan armada yang kemampuannya jauh lebih kecil daripada armada Inggris pada puncak kekuasaannya."
#PHI LOC#
 PHI_warning_american_intervention_tt: "§RPeringatan ini akan membuat marah§! §Y[USA.GetNameDef]§! §Rdan berisiko terhadap Intervensi Amerika kecuali jika dikelola dengan benar§!"
 Pan_pacific_trade_union_secretariat: "Sekretariat Serikat Buruh Pan Pasifik"
 PHI_central_focuses_done_4_tt: "Setidaknya §Y4§! fokus dari tingkat sebelumnya telah diselesaikan"
 PHI_central_focuses_done_5_tt: "Setidaknya §Y5§! fokus dari tingkat sebelumnya telah diselesaikan"
 PHI_usa_focus_done_T1_tt: "Telah menyelesaikan setidaknya satu dari, §YMematok Peso ke Dolar§!, §YPro-Hacendados§! atau §YUndang-undang Kebangsaan§!."
 PHI_usa_focus_done_T2_tt: "Telah menyelesaikan setidaknya dua dari, §YMematok Peso ke Dolar§!, §YPro-Hacendados§! atau §YUndang-undang Kebangsaan§!."
 PHI_usa_focus_done_T3_tt: "Telah menyelesaikan ketiga, §YMematok Peso ke Dolar§!, §YPro-Hacendados§! atau §YUndang-undang Kebangsaan§!."
 PHI_usa_focus_done_T1_alt_tt: "Telah menyelesaikan setidaknya satu dari, §Y$PHI_declare_military_emergency$§!, §YMematok Peso terhadap Dolar§!, §YPro-Hacendados§!, atau §YUndang-undang Kebangsaan§!."
 PHI_usa_focus_done_T2_alt_tt: "Telah menyelesaikan setidaknya dua dari, §Y$PHI_declare_military_emergency$§!, §YMematok Peso terhadap Dolar§!, §YPro-Hacendados§! atau §YUndang-undang Kebangsaan§!."
 PHI_usa_focus_done_T3_alt_tt: "Telah menyelesaikan setidaknya tiga dari, §Y$PHI_declare_military_emergency$§!, §YMematok Peso terhadap Dolar§!, §YPro-Hacendados§! atau §YUndang-undang Kebangsaan§!."
 PHI_focus_time_reduced_T1_tt: "§Y$PHI_leverage_the_peso$§! akan mengurangi waktu yang dibutuhkan untuk fokus ini sebanyak 35 hari."
 PHI_focus_time_reduced_T2_tt: "§Y$PHI_anti_hacendados$§! akan mengurangi waktu yang diperlukan untuk fokus ini sebanyak 35 hari."
 PHI_focus_time_reduced_T3_tt: "§Y$PHI_open_borders$§! akan mengurangi waktu yang dibutuhkan untuk fokus ini sebanyak 35 hari."
############
# WARLORDS #
############
 SIK_six_great_policies: "Enam Kebijakan Besar"
 SIK_six_great_policies_desc: "Enam kebijakan besar Anti-Imperialisme, Persahabatan dengan Uni Soviet, Kesetaraan ras dan nasional, Pemerintahan yang bersih, serta Perdamaian dan rekonstruksi yang dipromosikan melalui Asosiasi Anti-Imperialis Rakyat adalah landasan pemerintahan Sheng Shicai di Klik Sinkiang. Melalui mereka kita akan menjamin provinsi yang makmur dan menghindari jatuh kembali ke dalam kekuasaan feodal."
 SIK_invest_in_the_dushanzi_oil_fields: "Berinvestasi di Ladang Minyak Dushanzi"
 SIK_invest_in_the_dushanzi_oil_fields_desc: "Minyak ditemukan di wilayah Dushanzi pada pergantian abad, dan pada tahun 1909 kita telah memulai ekstraksi pada tingkat tertentu, namun dengan adanya investasi baru-baru ini dari Uni Soviet, terdapat potensi untuk memperluasnya lebih jauh. Kita harus berupaya untuk berinvestasi lebih jauh dalam upaya gabungan Soviet-Sinkiangi untuk memperluas kilang minyak karena kilang tersebut sangat penting baik dalam upaya perang kita maupun dalam perang Soviet."
 SIK_three_year_plan_for_reconstruction: "Rencana Rekonstruksi Tiga Tahun"
 SIK_three_year_plan_for_reconstruction_desc: "Untuk mengamankan pemerintahan kami dan menghindari kekacauan lebih lanjut, kami harus memulai rencana rekonstruksi tiga tahun dengan dukungan Soviet. Dengan mengambil pinjaman, kita untuk sementara akan terikat pada Uni Soviet, namun dalam jangka panjang hal ini akan menjamin kemakmuran ekonomi dan pada akhirnya kemerdekaan kita."
 SIK_a_new_xinjiang: "Xinjiang Baru"
 SIK_a_new_xinjiang_desc: "Kini setelah industri kami dimodernisasi, dan masyarakat kami diajarkan cara membaca, provinsi kami siap mengambil langkah berikutnya menuju masa depan. Sekarang, kita akan memulai proyek besar untuk integrasi Sinkiang dan masyarakatnya dengan dunia modern, seiring kita bersiap untuk mengambil tempat di panggung global!"
 SIK_transformation_of_nature: "Transformasi Alam"
 SIK_transformation_of_nature_desc: "Asia kaya akan sumber daya alam dan tinggal menunggu untuk dimanfaatkan. Dengan komunitas ilmiah kita yang melampaui apa yang sebelumnya dianggap mungkin, bahkan proyek terbesar dan paling invasif pun menjadi mungkin dilakukan. Lingkungan harus dibentuk dan dibentuk dalam skala besar agar dapat menguntungkan masyarakat!"
 SIK_soviet_intervention: "Intervensi Soviet Langsung"
 SIK_soviet_intervention_desc: "Sheng Shicai telah terbukti tidak dapat dipercaya dengan bolak-balik menjajakan kesetiaan yang berbeda. Oleh karena itu, kita harus menggantinya dengan seseorang yang dapat kita percaya untuk memerintah Sinkiang ke arah yang tidak menyimpang dari garis partai."
 SIK_protector_of_the_kyrgiz: "Pelindung Kirghiz"
 SIK_protector_of_the_kyrgiz_desc: "Masyarakat Kirghiz di sisi lain perbatasan Soviet sangat ingin dipimpin oleh seseorang yang memahami mereka. [ROOT.GetLeader] berbagi asal muasalnya dan mengetahui jalannya. Kita harus mengajukan petisi ke [SOV.GetLeader] untuk penyatuan dengan provinsi tersebut."
 SIK_ensure_a_clean_government: "Menjamin Pemerintahan yang Bersih"
 SIK_ensure_a_clean_government_desc: "Salah satu dari enam kebijakan besar memerlukan pemerintahan yang bersih dari korupsi, tetapi juga dari hasutan. Kita harus memastikan pemerintah stabil dalam segala hal, menyingkirkan semua yang mungkin mengancam kekuasaan [ROOT.GetLeader] dengan memanfaatkan bantuan NKVD!"
 SIK_a_new_nationality_policy: "Kebijakan Kebangsaan Baru"
 SIK_a_new_nationality_policy_desc: "Kita harus mengadopsi kebijakan kebangsaan Soviet, dimana tidak hanya satu kelompok yang mendominasi semuanya, namun banyak kelompok yang hidup secara harmonis. Dengan melakukan ini orang Han harus diajari membaca dan menulis Uighur, dan sebaliknya. Kami juga akan menegakkan ateisme di dalam unsur-unsur resmi pemerintah, namun memberikan kebebasan kepada masyarakat untuk menjalankan agama dan beribadah, untuk memungkinkan terciptanya provinsi yang lebih stabil dan bersatu."
 SIK_settle_dzungarian_tribes: "Menetap Suku Dzungaria"
 SIK_settle_dzungarian_tribes_desc: "Kami telah menerima permintaan dari para kepala suku dan pemimpin suku Dungarian untuk menetap di negara bagian kami, karena mereka belum dapat memetik hasil dari hasil panen kami yang baik. Kita harus mengabulkan keinginan mereka."
 SIK_king_of_sinkiang: "Raja Sinkiang"
 SIK_king_of_sinkiang_desc: "Sheng Shicai adalah pemimpin Kelompok Sinkiang yang tak terbantahkan, bahkan ada yang memanggilnya Raja. Namun provinsi ini terletak di persimpangan jalan, dimana beberapa di antaranya ingin mengikuti Pemerintah Pusat sementara yang lain ingin terus mengikuti garis Soviet. Apa pun yang diumumkan oleh Raja akan menentukan masa depan provinsi dan rakyatnya, namun masih belum jelas apa yang akan terjadi."
 SIK_rejoin_the_central_government: "Bergabunglah kembali dengan Pemerintah Pusat"
 SIK_rejoin_the_central_government_desc: "Uni Soviet tidak dapat diandalkan seperti yang kita duga sebelumnya. Tampaknya yang terbaik adalah bertaruh pada pihak yang menang, dan mengubah arah kita untuk bergabung kembali dengan KMT dan segera berintegrasi dengan Pemerintah Pusat."
 SIK_reestablish_the_guominjun: "Membangun kembali Guominjun"
 SIK_reestablish_the_guominjun_desc: "Guominjun adalah faksi militer yang didirikan oleh Feng Yuxiang pada tahun 1920-an. Berkomitmen pada nasionalisme, anti-imperialisme, dan sosialisme Kristen, organisasi ini tampaknya merupakan organisasi yang sempurna untuk dihidupkan kembali jika kita ingin menjadi pihak ketiga dalam perang saudara. Belum lagi fakta bahwa pada akhirnya Sheng Shicai bergabung dengan GMJ, dan kesetiaannya tidak pernah berbohong kepada KMT."
 SIK_reaffirm_soviet_connections: "Menegaskan Kembali Koneksi Soviet"
 SIK_reaffirm_soviet_connections_desc: "Pemerintah Pusat telah mengecewakan Tiongkok, dan hal ini menjadi semakin jelas dari hari ke hari. Kita harus berusaha untuk sepenuhnya memutuskan hubungan kita dengan mereka, dan bergabung dengan [SOV.GetNameDef] dalam perjuangan mereka melawan feodalisme."
 SIK_utilize_asperovs_contacts: "Manfaatkan Kontak Apresov"
 SIK_utilize_asperovs_contacts_desc: "Garegin Apresov, Konsul Jenderal Soviet dengan kekuasaan khusus dan Perwakilan Departemen Timur Kedua Komisariat Luar Negeri Rakyat Uni Soviet di Urumqi memiliki banyak kontak penting dalam [SOV.GetNameDef]. Kita harus menggunakan kekuatan dan koneksinya untuk memaksimalkan kerja sama kita dengan [SOV.GetAdjective]."
 SIK_office_of_sinkiang_border_commissioner: "Kantor Pertahanan Perbatasan Sinkiang"
 SIK_office_of_sinkiang_border_commissioner_desc: "Kantor Komisaris Pertahanan Perbatasan Sinkiang adalah badan yang bertanggung jawab memimpin garnisun regional. Melalui otonomi ini, kita dapat memperkuat pemerintah provinsi dan bertindak independen dari Pemerintah Pusat kapanpun kita mau."
 SIK_cooperate_with_the_nkvd: "Bekerja sama dengan NKVD"
 SIK_cooperate_with_the_nkvd_desc: "Untuk memperkuat hubungan kita dengan [SOV.GetNameDef] sekaligus mengamankan kekuasaan kita dan melindungi Urumqi dari konspirator asing, kita harus bekerja sama dengan NKVD dan membantu mereka membangun kehadiran yang tepat di negara kita."
 SIK_cooperate_with_the_ussr: "Bekerja sama dengan Uni Soviet"
 SIK_cooperate_with_the_ussr_desc: "Hubungan kami dengan Uni Soviet bersifat unik di Tiongkok, dan untuk memastikan integritas teritorial kami, kami harus memanfaatkan hubungan tersebut. Dengan bantuan mereka, kami akhirnya bisa mengusir Kuomintang dari provinsi kami."
 SIK_military_cooperation: "Kerja Sama Militer"
 SIK_military_cooperation_desc: "Kuomintang masih mengerahkan sejumlah besar pasukan di Khotan melalui Divisi ke-36 Baru. Untuk memastikan pengusiran mereka, kita harus meminta bantuan dari Uni Soviet."
 SIK_a_soviet_airforce: "Angkatan Udara Soviet"
 SIK_a_soviet_airforce_desc: "Berkat hubungan kami yang semakin berkembang dengan [SOV.GetNameDef], kami akan dapat memperoleh pesawat dari mereka. Selain itu, mereka juga telah bersiap untuk mendirikan sekolah percontohan di Urumqi, dan mulai mengirimkan penasihat untuk membantu mempersiapkan kita menghadapi masa depan peperangan."
 SIK_march_into_khotan: "Berbaris ke Khotan"
 SIK_march_into_khotan_desc: "Harinya telah tiba! Sebentar lagi seluruh Sinkiang akan berada di bawah kekuasaan kita dan pasukan Ma Hushan akan diusir!"
 we_will_play_as_kum_tt: "Kami akan bermain sebagai [KUM.GetFlag]§Y[KUM.GetNameDef]§!!"
 SIK_march_into_khotan_tt: "Pada waktunya, §YPersediaan Tambahan§! akan tiba dari §Y[SOV.GetNameDef]§!"
 SIK_a_united_sinkiang_clique: "Klik Persatuan Sinkiang"
 SIK_a_united_sinkiang_clique_desc: "Dengan diusirnya Divisi 36 Baru dan Sinkiang kini sepenuhnya berada di bawah kekuasaan kami, kami kini berdiri sebagai kekuatan yang tangguh di wilayah tersebut. Kita sekarang harus mengalihkan pandangan kita ke timur dan memastikan integritas wilayah kawan dan sekutu kita melawan penjajah Jepang."
 SIK_pursue_further_soviet_integration: "Mengejar Integrasi Soviet Lebih Lanjut"
 SIK_pursue_further_soviet_integration_desc: "Dengan berakhirnya pertempuran dan masalah sudah selesai, kita harus mengalihkan perhatian kita pada ancaman-ancaman lain. Di bawah naungan Uni Soviet, kita tidak akan menghadapi ancaman aneksasi dari Pemerintah Pusat, jadi ini jelas merupakan tindakan yang paling masuk akal."
 SIK_establish_the_xinjiangneft: "Mendirikan Xinjiangneft"
 SIK_establish_the_xinjiangneft_desc: "Politbiro [SOV.GetAdjective] telah membahas masalah 'Minyak Xinjiang' dan mengadopsi resolusi yang menyerukan persiapan pengembangan minyak di dekat perbatasan [SOV.GetAdjective] di bawah pengawasan pemerintah kita. Untuk mencapai tujuan ini, perusahaan gabungan Xinjiang-Soviet 'Xinjiangneft' akan didirikan, untuk membantu ekstraksi bersama sumber daya alam di wilayah tersebut."
 SIK_established_the_xinjiangneft_flag: "Mendirikan Xinjiangneft"
 KHM_call_for_aid: "Panggilan untuk Bantuan"
 KHM_call_for_aid_desc: "Dengan kekuatan Sheng Shicai di depan pintu kita, kita harus meminta bantuan dari rekan senegara kita agar kita tidak terpuruk."
 KHM_strike_the_governor: "Pukul Gubernur"
 KHM_strike_the_governor_desc: "Pasukan kita sudah siap, semangat kita tinggi, kita harus memanfaatkan kesempatan ini untuk mengusir boneka soviet dari provinsi kita!"
 KHM_push_them_back: "Dorong Mereka Kembali"
 KHM_push_them_back_desc: "Pertempuran untuk provinsi Sinkiang tidak boleh berakhir dengan kemenangan mereka, kami akan mendorong mereka kembali ke Uni Soviet!"
 KHM_the_sinkiang_ma_clique: "Klik Sinkiang Ma"
 KHM_the_sinkiang_ma_clique_desc: "Dengan kekalahan Sheng Shicai dan Kelompok Sinkiangnya, kami sekarang berdiri sebagai satu-satunya gubernur provinsi tersebut. Kita harus memperkuat posisi kita untuk menjadi kekuatan yang lebih kuat di wilayah tersebut."
 KHM_kumul_rebellion_avenged: "Pemberontakan Kumul Dibalas"
 KHM_kumul_rebellion_avenged_desc: "Dengan kekalahan Sheng Shicai dan Kelompok Sinkiangnya, kami sekarang berdiri sebagai satu-satunya penguasa provinsi tersebut. Pemberontakan Kumul pertama yang ditumpas secara tidak adil kini akhirnya dapat dibalas, dan kita dapat mengalihkan pandangan kita ke arah pembangunan kembali provinsi ini dan memperluas kekuatan kita untuk memastikan kemerdekaan kita tetap ada."
 KHM_utilize_family_contacts: "Manfaatkan Kontak Keluarga"
 KHM_utilize_family_contacts_desc: "Kita harus memanfaatkan hubungan dekat kita dengan Kelompok Ma yang lain untuk mengusir Sheng Shicai dari Sinkiang selamanya."
 KHM_undermine_kmt_rule: "Melemahkan Aturan KMT"
 KHM_undermine_kmt_rule_desc: "Kuomintang telah terlalu lama menjarah provinsi tersebut dan menindas penduduk setempat. Sudah waktunya kita membuat persiapan untuk mengusir Kelompok Ma yang kejam dari Khotan!"
 KHM_establish_the_kashgar_clique: "Bentuklah Kelompok Kashgar"
 KHM_establish_the_kashgar_clique_desc: "Kami telah berupaya menjauhkan diri dari Kuomintang sebelumnya. Jika kita benar-benar ingin mencapai hal ini, kita harus mengambil catatan dari buku keluarga Ma dan membentuk kelompok kita sendiri. Sudah waktunya untuk mewujudkan hal ini, dan membentuknya di bawah Wakil Komandan Militer wilayah Kashgar, Mahmut Muhiti."
 KHM_shizangs_coup: "Kudeta Shizang"
 KHM_shizangs_coup_desc: "Dengan persiapan yang telah dilakukan dan resimen Uyghur ke-24 dan ke-25 di bawah kendali Muhiti sedang dalam perjalanan untuk mengepung Khotan, kita dapat mulai mengambil tindakan dan mengusir kepemimpinan Hui dari kota. Kemuliaan bagi Mahmut Shizhang, dan panjang umur Imarah Khotan!"
 KHM_shizangs_coup_tt: "Banyak §YJenderal Ma§! yang akan §RKeluar§! dan bergabung dengan Kelompok Ma lainnya"
 KHM_take_control_of_zakat_and_waqf: "Kendalikan Zakat dan Wakaf"
 KHM_take_control_of_zakat_and_waqf_desc: "Untuk mendanai pemerintahan baru kita, kita mungkin perlu mengubah beberapa peraturan dan mengambil kendali atas badan amal zakat dan wakaf Khotan, mengalihkan kekayaan tempat-tempat suci setempat ke buku pelajaran, kepolisian, tentara dan guru."
 KHM_implement_jizyah: "Melaksanakan Jizyah"
 KHM_implement_jizyah_desc: "Hak-hak non-Muslim sangat ditentukan di bawah pemerintahan lama. Inilah saatnya untuk menyesuaikan hal-hal ini dengan dunia modern, dan membuktikan kepada semua rakyat kita bahwa kita adalah dunia yang tercerahkan."
 KHM_promote_jadidism: "Mempromosikan Jadidisme"
 KHM_promote_jadidism_desc: "Kaum modernis dan reformis Islam yang merupakan bagian dari gerakan Jadid di [SOV.GetNameDef] secara aktif ditindas oleh pemerintah. Karena Bughra sendiri adalah penganut Jadid yang aktif, akan menjadi bijaksana jika kita memberi mereka perlindungan di negara kita, sambil membiarkan mereka menyampaikan cita-cita reformis mereka kepada kita."
 KHM_revive_the_basmachi_movement: "Menghidupkan kembali Gerakan Basmachi"
 KHM_revive_the_basmachi_movement_desc: "Hingga tahun 1934, Basmachi berjuang melawan kekuatan [SOV.GetAdjective] untuk membebaskan Asia Tengah dari kekuasaan tirani mereka. Meskipun sebagian besar gerakan mereka telah ditumpas, beberapa pemimpin mereka berhasil melarikan diri. Kita harus berusaha menjalin kontak dengan para pejuang kemerdekaan ini, dan mengundang mereka ke pengadilan kita."
 KHM_rally_the_faithful: "Kumpulkan Orang Setia"
 KHM_rally_the_faithful_desc: "Agar berhasil menjamin otonomi kita dari negara-negara asing, kita harus menggalang umat beriman dan membangun tatanan militer baru di ibu kota kita."
 KHM_indian_expeditionary_forces_plan: "Rencana Pasukan Ekspedisi India"
 KHM_indian_expeditionary_forces_plan_desc: "[ENG.GetAdjective] telah mengusulkan rencana untuk mengirimi kami bantuan militer dari [RAJ.GetNameDef] jika mendapat serangan dari pasukan musuh. Mungkin akan lebih bijaksana jika kita memulai hubungan yang lebih dekat dengan mereka."
 KHM_expand_the_madrasas: "Memperluas Madrasah"
 KHM_expand_the_madrasas_desc: "Agar kita bisa mengendalikan masyarakat kita dengan lebih baik dan mengajari mereka cara hidup yang seharusnya, kita harus meningkatkan pendanaan untuk lembaga-lembaga pendidikan Muslim yang ada di negara kita."
 KHM_promote_anti_communism: "Mempromosikan Anti-Komunisme"
 KHM_promote_anti_communism_desc: "Mengusir Sheng Shicai dan kelompok komunisnya adalah prioritas utama jika kita tidak ingin jatuh ke tangan Republik Soviet. Oleh karena itu, kita harus menyingkirkan komunis yang tersisa dari wilayah kita."
 KHM_raise_additional_dungan_regiments: "Naikkan Resimen Dungan Tambahan"
 KHM_raise_additional_dungan_regiments_desc: "Tentara sebagian besar masih terdiri dari orang-orang Hui, yang bersumpah setia mutlak kepada komandan mereka. Meskipun tidak ideal, kita harus memanfaatkan hal ini, karena hal ini akan terbukti sangat berguna di tahun-tahun mendatang."
 KHM_indian_expeditionary_forces_plan_tt: "§Y[ENG.GetNameDefCap]§! dan §Y[RAJ.GetNameDef]§! akan lebih cenderung mengirimkan sukarelawan kepada kami"
 KHM_our_position_remains: "Posisi Kami Tetap"
 KHM_our_position_remains_desc: "Perang mungkin tidak sepenuhnya menguntungkan kita, namun kelompok Khotan masih bertahan dan Divisi 36 Baru kini lebih siap menghadapi konflik yang akan datang."
 CHI_sea_gain_warlord_support: "Dapatkan Dukungan Panglima Perang"
 CHI_sea_gain_warlord_support_desc: "Untuk terlihat sebagai penguasa sah Tiongkok, pertama-tama kita harus mendapatkan dukungan dari panglima perang lainnya."
 CHI_allow_warlord_support_tt: "Membuka keputusan untuk mendapatkan pengaruh faksi dengan imbalan bantuan kepada panglima perang"
 CHI_sea_propaganda_campaigns: "Kampanye Propaganda"
 CHI_sea_propaganda_campaigns_desc: "Melalui penggunaan propaganda yang efektif, kita akan mampu mencuri perhatian dari Pemerintah Pusat dan dalam waktu dekat mereka akan jatuh ke tangan kita."
 CHI_propaganda_decisions_tt: "Membuka keputusan untuk mendapatkan pengaruh faksi melalui kampanye propaganda"
 CHI_sea_unified_army_structure: "Struktur Tentara Terpadu"
 CHI_sea_unified_army_structure_desc: "Untuk secara efektif melawan ancaman asing dan dalam negeri, kita harus mereformasi angkatan bersenjata kita menjadi unit yang profesional. Dengan bantuan dari penasihat Partai Komunis, kita akan mampu membentuk Tentara Merah kita sendiri, dan pada gilirannya akan lebih baik dalam menahan ancaman dari luar."
 CHI_sea_battle_for_china: "Pertempuran untuk Tiongkok"
 CHI_sea_battle_for_china_desc: "Ketika Pemerintah Pusat semakin menyimpang dari garis partai yang benar, semakin jelas bahwa satu-satunya jalan ke depan adalah dengan mengambil kembali kendali. Kita harus berjuang untuk mendapatkan modal dan merebutnya dari negara yang telah mengecewakan kita."
 CHI_sea_rally_the_warlords: "Kumpulkan Panglima Perang"
 CHI_sea_rally_the_warlords_desc: "Para panglima perang adalah bagian penting dalam perebutan kekuasaan di Tiongkok. Dengan mereka di pihak kita, akan lebih mudah untuk mengambil kendali."
 CHI_sea_a_new_expedition: "Ekspedisi Baru"
 CHI_sea_a_new_expedition_desc: "Ketika Pemerintah Pusat melemah, kita harus mengingat warisan Ekspedisi Utara dan merebut ibu kota. Dengan mereka berada di bawah kekuasaan kita, hanya masalah waktu saja sebelum kita diakui sebagai otoritas sah atas Tiongkok."
 PRC_sea_inward_focus: "Fokus pada Interior"
 PRC_sea_inward_focus_desc: "Jalan ke depan tidak terletak pada mengikuti garis Soviet. Kita harus membuktikan kemandirian kita dari mereka dan menentukan jalan kita sendiri untuk memastikan keberhasilan revolusi."
 PRC_sea_rally_the_industry: "Kumpulkan Industri"
 PRC_sea_rally_the_industry_desc: "Tanpa kelas pekerja yang kooperatif dan basis industri yang mendukung revolusi kita, revolusi ini hanya akan gagal. Oleh karena itu, sangatlah penting bagi kita untuk menggalang mereka ke pihak kita."
 PRC_sea_reforming_our_ranks: "Atur Ulang Peringkat kami"
 PRC_sea_reforming_our_ranks_desc: "Untuk memastikan revolusi kita berhasil, kita harus mengatur ulang barisan kita dan pada gilirannya menggalang kelas pedesaan. Tanpa bantuan mereka, kita tidak akan memiliki pasukan yang berfungsi, namun dengan adanya mereka di pihak kita, kita dapat memperoleh keuntungan dibandingkan musuh-musuh kita."
 PRC_sea_forging_our_own_path: "Menempa Jalan kita sendiri"
 PRC_sea_forging_our_own_path_desc: "Semakin jelas bahwa Komintern telah mengecewakan kaum revolusioner Tiongkok dan kita harus membentuk serikat kita sendiri. Dengan ini kami juga akan dapat menegaskan otoritas kami di luar Tiongkok pada waktunya."
 PRC_sea_toe_the_soviet_line: "Ikuti Garis Soviet"
 PRC_sea_toe_the_soviet_line_desc: "Sudah jelas bahwa hanya dengan bantuan Soviet Revolusi Tiongkok dapat berhasil. Meski banyak anggota partai yang mempunyai pendapat berbeda, hanya waktu yang akan membuktikan apakah pendapat mereka benar atau tidak."
 PRC_sea_aid_from_soviet_bolsheviks: "Bantuan dari Bolshevik Soviet"
 PRC_sea_aid_from_soviet_bolsheviks_desc: "Agar revolusi kita berhasil, kita harus mempunyai basis industri yang mendukungnya. Dengan bantuan investor Soviet, kita akan mampu memulai industri kita sendiri."
 PRC_sea_soviet_advisors: "Penasihat Soviet"
 PRC_sea_soviet_advisors_desc: "Soviet memiliki beberapa agen yang aktif di Tiongkok. Kita harus merekrut mereka dan memanfaatkan keahlian mereka jika kita ingin mengalahkan pemerintah Nasionalis."
 PRC_sea_industrialisation_of_nature: "Industrialisasi Alam"
 PRC_sea_industrialisation_of_nature_desc: "Untuk menjamin kondisi sosialisme, pertama-tama kita harus memiliki kelas pekerja industri. Dengan bantuan Soviet kita akan lebih cepat dapat menjamin kondisi tersebut."
 PRC_sea_comintern_integration: "Integrasi Komintern"
 PRC_sea_comintern_integration_desc: "Dengan kondisi yang sekarang sudah tepat, inilah saatnya untuk berintegrasi sepenuhnya ke dalam Komintern."
 PRC_sea_new_economic_direction: "Arah Ekonomi Baru"
 PRC_sea_new_economic_direction_desc: "Dengan diproklamirkannya Republik Rakyat kita dan segala permasalahannya sudah teratasi, inilah waktunya untuk memfokuskan kembali dan merestrukturisasi perekonomian kita. Dengan perencanaan yang matang, pada saatnya nanti kita akan mampu mengungguli perekonomian negara-negara barat dan menjadi kekuatan yang patut diperhitungkan."
 PRC_sea_move_capital: "Pindahkan Ibukota"
 PRC_sea_move_capital_desc: "Setelah terbentuknya $PRC_proclaimed_communism$, wajar saja jika kita memindahkan pusat pemerintahan dan mengembalikan nama kota tersebut menjadi Beijing."
 china_communist_warlord_focus: "Pohon Fokus Komunis Tiongkok"
 china_nationalist_warlord_focus: "Pohon Fokus Nasionalis Tiongkok"
 CHI_sea_develop_capital: "Kembangkan [ROOT.Capital.GetName]"
 CHI_sea_develop_capital_desc: "Tanpa basis industri kita tidak akan pernah mampu mempertahankan posisi kita. Oleh karena itu kita harus berinvestasi pada modal kita."
 CHI_sea_further_industrial_investment: "Investasi Industri Lebih Lanjut"
 CHI_sea_further_industrial_investment_desc: "Meskipun kita mempunyai industri kecil, namun masih belum bisa menandingi industri yang dimiliki oleh Pemerintah Pusat. Oleh karena itu, kita harus berinvestasi lebih lanjut dalam industri kita."
 CHI_sea_develop_capital_arsenal: "Perluas [ROOT.Capital.GetName] Arsenal"
 CHI_sea_develop_capital_arsenal_desc: "Tanpa persenjataan kita tidak akan mempunyai tentara, dan tanpa tentara kita tidak akan mempunyai negara. Oleh karena itu, untuk menjamin kelangsungan hidup kita, kita harus memperluas kemampuan industri kita."
 CHI_sea_small_arms_production: "Produksi Senjata Kecil"
 CHI_sea_small_arms_production_desc: "Senjata kecil adalah tulang punggung industri militer kita. Tanpa mereka, tentara kita tidak akan berguna dan negara kita akan hancur karena tekanan apa pun. Secara logis kita harus berinvestasi lebih jauh ke sektor ini."
 CHI_sea_industrial_research_projects: "Proyek Penelitian Industri"
 CHI_sea_industrial_research_projects_desc: "Tanpa industri modern, kita akan tertinggal dibandingkan industri lain, dan tanpa industri modern kita akan kalah bersaing dengan Pemerintah Pusat. Mendanai penelitian untuk metode dan mesin yang lebih modern akan membantu menjaga industri kita tetap sejajar dengan negara-negara lain di dunia."
 CHI_sea_expand_public_education: "Perluas Pendidikan Masyarakat"
 CHI_sea_expand_public_education_desc: "Tanpa masyarakat yang memiliki akses terhadap pendidikan, kita akan tertinggal dibandingkan negara lain. Oleh karena itu, untuk menjamin kemakmuran bangsa, kita harus berinvestasi dalam pendidikan publik."
 CHI_sea_fund_research_projects: "Mendanai Proyek Penelitian"
 CHI_sea_fund_research_projects_desc: "Untuk mempertahankan keunggulan dibandingkan lawan, penting bagi kita untuk menyadari dan memanfaatkan kemajuan teknologi terkini. Dengan mendanai proyek-proyek penelitian, kita dapat memastikan hal tersebut dan pada saat yang sama juga membantu masyarakat kita."
 CHI_sea_rely_on_our_infantry: "Andalkan Infanteri Kami"
 CHI_sea_rely_on_our_infantry_desc: "Pasukan yang berfokus pada infanteri belum mengecewakan kita, dan mereka tidak akan pernah mengecewakan kita. Secara logis kita harus berinvestasi lebih banyak pada mereka untuk mendapatkan keuntungan melawan musuh potensial."
 CHI_sea_modern_warfare: "Peperangan Moden"
 CHI_sea_modern_warfare_desc: "Masa depan peperangan tidak terletak pada pasukan infanteri yang kita miliki saat ini. Agar tidak dikalahkan dan dihancurkan oleh musuh, kita harus berinvestasi pada teknologi baru."
 CHI_sea_consolidate_our_rule: "Konsolidasikan Aturan Kami"
 CHI_sea_consolidate_our_rule_desc: "Meskipun secara nominal kami mempunyai kendali atas provinsi kami, namun masih terdapat wilayah-wilayah yang wewenangnya lemah. Kita harus mencoba menjangkau tempat-tempat ini untuk memastikan bahwa masyarakat mengetahui siapa yang mengaturnya."
 CHI_sea_fortification_efforts: "Upaya Fortifikasi"
 CHI_sea_fortification_efforts_desc: "Meskipun posisi kita masih aman untuk saat ini, mungkin ada saatnya kita perlu mempertahankan perbatasan kita sampai titik darah penghabisan. Oleh karena itu jelas bahwa kita harus memperkuat perbatasan kita dan memperkuat diri kita sendiri."
 CHI_sea_infantry_efforts: "Upaya Infanteri"
 CHI_sea_infantry_efforts_desc: "Infanteri berfungsi sebagai tulang punggung tentara kita. Dengan meningkatkan metode dan standar pelatihan kami, kami akan dapat memastikan bahwa mereka tampil lebih baik dalam pertempuran aktif."
 CHI_sea_brigade_specialization: "Spesialisasi Brigade"
 CHI_sea_brigade_specialization_desc: "Meskipun memiliki pasukan yang mampu menjalankan sebagian besar tugas merupakan hal mendasar bagi kemenangan kita melawan penjajah, penting juga bagi kita untuk fokus pada tingkat spesialisasi tertentu."
 CHI_sea_the_army: "Tentara [ROOT.GetAdjective]"
 CHI_sea_the_army_desc: "Dengan selesainya reformasi angkatan bersenjata, kami akhirnya dapat mengatakan bahwa kami bukan hanya seorang panglima perang dengan pasukannya, melainkan seorang komandan dengan pasukannya, yang siap menghadapi segala ancaman yang mungkin menghadang kami."
 CHI_crackdown_on_looting: "Tindakan Keras terhadap Penjarahan"
 CHI_crackdown_on_looting_desc: "Agar provinsi kita dapat berkembang dengan baik, kita perlu menghentikan tentara kita yang terus-menerus mengambil makanan dan peralatan untuk penduduk setempat, dan memastikan bahwa hukum dan keadilan dapat ditegakkan oleh pemerintah kita sebagaimana diperlukan untuk menjaga perdamaian."
 XSM_the_military_governor: "Gubernur Militer"
 XSM_the_military_governor_desc: "Meskipun negara kita secara nominal dipimpin oleh Ma Lin, gubernur sipil Qinghai, Gubernur Militer dan keponakan Ma Lin, Ma Bufang telah bersaing untuk mendapatkan kendali penuh atas provinsi tersebut selama beberapa waktu. Apakah dia akan berhasil mengusir pamannya masih belum pasti, namun dengan beberapa manuver, hal itu pasti bisa dilakukan."
 XSM_a_hui_army: "Tentara Hui"
 XSM_a_hui_army_desc: "Tentara, di bawah komando Ma Bufang, sebagian besar terdiri dari orang Hui, yang bersumpah setia mutlak kepada komandan mereka. Mereka akan terbukti sangat berguna jika Ma Bufang harus merebut kekuasaan dengan cara militer."
 XSM_sway_the_people: "Menggoyahkan Rakyat"
 XSM_sway_the_people_desc: "Meskipun tentara mendukung Ma Bufang, rakyat tampaknya lebih memilih Ma Lin. Mencoba mempengaruhi mereka memang penting, tapi kecuali terjadi hal drastis, mereka akan tetap duduk di kubu Ma Lin untuk saat ini."
 XSM_sweep_out_communists: "Menyingkirkan Komunis"
 XSM_sweep_out_communists_desc: "Mengusir Zhang Guotao dan kelompok komunisnya adalah prioritas utama jika kita tidak ingin jatuh ke tangan Republik Soviet. Oleh karena itu, kita harus menyingkirkan komunis yang tersisa dari wilayah kita."
 XSM_send_ma_lin_on_hajj: "Kirimkan Ma Lin untuk berhaji"
 XSM_send_ma_lin_on_hajj_desc: "Ma Lin tahu waktunya sudah habis, namun memecatnya tanpa alasan apa pun akan tetap membuat marah masyarakat. Oleh karena itu kita harus memaksanya untuk meninggalkan jabatannya dengan alasan akan berangkat haji."
 XSM_the_civilian_governor_remains: "Gubernur Sipil Tetap Ada"
 XSM_the_civilian_governor_remains_desc: "Meskipun Ma Bufang menginginkan kekuasaan penuh, kini semakin jelas bahwa hal tersebut tidak akan mungkin terjadi tanpa adanya risiko pemberontakan skala penuh dari rakyat. Namun Ma Lin telah menyarankan kompromi di mana kedua peran tersebut akan dipandang sebagai penguasa bersama, dengan dia mengundurkan diri dari peran yang lebih simbolis sebagai pemimpin dan Bufang secara de facto mengendalikan sebagian besar urusan."
 XSM_solidifying_control: "Memperkuat Kontrol"
 XSM_solidifying_control_desc: "Kini setelah pertikaian internal berakhir, inilah waktunya untuk memperkuat kekuasaan kita di Qinghai untuk menghindari destabilisasi lebih lanjut, baik yang disebabkan oleh kekuatan internal maupun eksternal."
 XSM_sideline_family_conflicts: "Konflik Keluarga Sampingan"
 XSM_sideline_family_conflicts_desc: "Keluarga Ma besar dan menguasai wilayah yang luas. Secara teori, hal ini dapat berarti bahwa bersatu akan menciptakan kekuatan yang besar di wilayah tersebut, namun sebaliknya keluarga tersebut justru diliputi perselisihan dan konflik. Jika kita ingin bersatu, pertama-tama kita harus memastikan bahwa konflik-konflik ini tidak menghalangi kita."
 XSM_strengthening_our_position: "Memperkuat Posisi Kami"
 XSM_strengthening_our_position_desc: "Kita memerlukan kekuatan tempur jika ingin bersatu, karena potensi konflik bersenjata lebih dari nol dan jumlah angkatan bersenjata kita masih terlalu kecil untuk melakukan operasi skala besar."
 XSM_demand_submission: "Pengajuan Permintaan"
 XSM_demand_submission_desc: "Kita harus berusaha menghindari konflik jika diperlukan, jadi cara yang benar adalah dengan mengumumkan niat kita dan memberikan kesempatan kepada pihak lain untuk menyerah sebelum kita menyerang."
 XSM_strike_at_the_detractors: "Serang Pengkhianat"
 XSM_strike_at_the_detractors_desc: "Anggota keluarga yang lain tidak dapat dipercaya, dan mengumumkan niat kita hanya akan memberi mereka kesempatan untuk mempersiapkan diri. Kita harus menyerang dulu, tanya lagi nanti."
 XSM_a_united_ma_state: "Negara Bagian Ma Bersatu"
 XSM_a_united_ma_state_desc: "Dengan seluruh keluarga bersatu di bawah satu bendera, kami kini menjadi kekuatan yang patut diperhitungkan, baik di kancah lokal maupun internasional. Klik Ma akan bertahan seribu tahun!"
 XSM_a_united_ma_state_tt: "Setiap Kelompok Ma boneka kita akan §YAneksasi§! dan §YDibuang§!, dan kita akan mendapatkan §YJenderal§! mereka"
 XSM_ma_qis_natural_successor: "Penerus Alami Ma Qi"
 XSM_ma_qis_natural_successor_desc: "Meskipun putra mantan gubernur Ma Qi, Ma Bufang, adalah seorang ahli strategi militer yang brilian dan haus akan kekuasaan, dia tidak cocok untuk memerintah provinsi tersebut. Sebaliknya, Ma Lin, saudara laki-laki mantan gubernur, masih lebih memenuhi syarat untuk memerintah. Dia akan melihat reformasinya sampai akhir."
 XSM_recruit_salar_officers: "Rekrut Petugas Gaji"
 XSM_recruit_salar_officers_desc: "Orang-orang Turki Salar di provinsi Qinghai menunjukkan potensi dalam seni perang. Petugas akan dikirim ke wilayah Xunhua untuk mencari pemimpin baru yang menjanjikan, dan memastikan mereka diberi pelatihan militer yang tepat."
 XSM_rebuild_the_ninghai_army: "Bangun kembali Tentara Ninghai"
 XSM_rebuild_the_ninghai_army_desc: "Untuk sekali lagi menertibkan provinsi selatan dan mengamankan perbatasan kita, kita harus membangun kembali tentara Ninghai. Dengan melakukan ini, kita seharusnya bisa unggul dalam pertempuran melawan orang-orang Tibet."
 XSM_rebuilt_the_ninghai_army_flag: "Membangun kembali §YTentara Ninghai§!"
 KHM_established_the_kashgar_clique_flag: "Mendirikan §YKashgar Clique§!"
 KUM_victory_in_tihwa: "Kemenangan di Tihwa"
 KUM_victory_in_tihwa_desc: "Dengan jatuhnya [617.GetName], posisi kami di provinsi ini telah semakin kokoh. Hari ini kita menang, panjang umur Khan!"
 KUM_restore_yettishar: "Pulihkan Yettishar"
 KUM_restore_yettishar_desc: "Dengan kendali penuh atas provinsi Xinjiang, kita sekarang harus berupaya memenuhi ambisi Muhammad Yakub Beg dan menyatukan provinsi-provinsi Muslim di Barat Laut."
 MAN_tsr_expand_the_navy: "Perluas Angkatan Laut Kekaisaran Manchukuo"
 MAN_tsr_expand_the_navy_desc: "Meskipun kita masih harus bergantung pada Jepang untuk dukungan mereka di lautan, akan lebih bijaksana jika kita berinvestasi dengan memiliki lebih dari sekedar angkatan laut sungai. Dipimpin oleh kapal andalan kami, Hai Wei, dan dengan kerja sama yang erat dengan sekutu kami, kami akan mampu menghadapi segala upaya untuk menyerang atau menyerang wilayah kami dari laut."
 MAN_tsr_mangyo_tt: "§Y$MAN_showa_steel_works$§! dan §Y$MAN_south_manchuria_railway_company$§! akan digabungkan menjadi §YPerusahaan Pengembangan Industri Manchuria§!"
 MAN_tsr_embrace_state_shintoism_tt: "Membuka keputusan untuk meningkatkan §Y$MAN_state_shintoism_dm$§! Semangat Nasional"
 MAN_tsr_promote_manchu_identity_tt: "Membuka §Y$MAN_incoporate_manchu_nationalism_decision$§!"
 MAN_tsr_strengthen_ties_with_nissan: "Perkuat Hubungan Dengan Nissan"
 MAN_tsr_strengthen_ties_with_nissan_desc: "Nissan adalah mitra penting bagi industri militer dan sipil kami. Kita harus berupaya menjalin hubungan yang lebih erat dengan mereka untuk memastikan bahwa kita dapat mempertahankan dan memperluas kedua sektor tersebut dengan mudah."
 MAN_tsr_mangyo: "Mangyo"
 MAN_tsr_mangyo_desc: "Perusahaan Pengembangan Industri Manchuria atau disingkat Mangyō merupakan upaya Yoshisuke Aikawa, pendiri Nissan Zaibatsu, untuk bersama Pemerintah lebih menjamin kesejahteraan ekonomi bagi Manchuria. Hal ini dilakukan dengan mengembangkan industri strategis tertentu untuk kemudian dikembangkan secara perlahan ke sektor lain."
  MAN_tsr_obedience: "Perkuat Asosiasi Concordia"
  MAN_tsr_obedience_desc: "Beberapa pihak menyebut kami hanya boneka Jepang, namun pada dasarnya mereka salah memahami hubungan dekat dan setara kami dengan Asosiasi Concordia di garis depan. Melawan orang yang dermawan sama saja seperti seorang anak melawan orang tuanya."
  MAN_tsr_trading_illicit_goods: "Perdagangan Barang Haram"
  MAN_tsr_trading_illicit_goods_desc: "Meskipun perdagangan barang haram bukanlah sumber pendapatan utama bagi negara kita, namun hal ini menghasilkan keuntungan yang besar. Akan sangat bodoh jika menutupnya, namun hal ini bisa menimbulkan dampak buruk bagi masyarakat Manchuria dan Tiongkok jika tidak ditangani."
  MAN_tsr_social_research_unit: "Pelajari Gassakusha"
  MAN_tsr_social_research_unit_desc: "Gassakusha adalah organisasi koperasi pertanian yang aktif di Jepang dan Manchuria. Kita harus mempelajari hal ini untuk lebih memahami mengapa hal ini berhasil agar dapat menerapkannya pada konteks lain."
  MAN_tsr_further_mobilization: "Upaya Mobilisasi"
  MAN_tsr_further_mobilization_desc: "Tanpa tentara kita tidak akan mempunyai tentara. Kita harus mendorong mobilisasi dan pelatihan lebih lanjut sehingga kita dapat menurunkan pasukan yang patut diperhitungkan."
  MAN_tsr_strengthen_the_manchukuo_imperial_army: "Perkuat Tentara Kekaisaran Manchu"
  MAN_tsr_strengthen_the_manchukuo_imperial_army_desc: "Kita membutuhkan tentara yang kuat untuk mengalahkan musuh-musuh kita dan mempertahankan kemerdekaan kita. Ketergantungan yang berlebihan pada tentara Kwantung pada akhirnya hanya akan membawa kehancuran bagi kita. Untuk memiliki negara Manchuria yang merdeka, pertama-tama kita harus memiliki tentara."
  MAN_tsr_expand_xingan_army: "Perluas Tentara Xing'an"
  MAN_tsr_expand_xingan_army_desc: "Tentara Xing'an adalah kekuatan penting dalam pasukan kita. Jika kita ingin berhasil dalam pertempuran yang akan datang, maka akan lebih bijaksana jika kita memperluasnya."
  MAN_tsr_request_dalian: "Permintaan Dalian"
  MAN_tsr_request_dalian_desc: "Jepang saat ini menduduki kota pelabuhan Dalian di Manchuria yang terletak di ujung Semenanjung Liaotung sebagai bagian dari Wilayah Sewa Kwantung. Namun kita harus mencoba membujuk mereka untuk menyerahkannya kepada Pemerintah kita karena perbedaannya bagi mereka tidak akan berarti, padahal manfaatnya akan sangat besar bagi kita."
  MAN_tsr_the_question_of_leadership: "Pertanyaan tentang Kepemimpinan"
  MAN_tsr_the_question_of_leadership_desc: "Meskipun kita saat ini berada di bawah pemerintahan perdana menteri Zhang Jinhui dengan Puyi hanya sekedar Kaisar, hal ini tentu saja dapat diubah. Jika Tentara Kwantung menganggap perlu, mereka dapat mengembalikan kekuasaan kepada Kaisar atau bahkan menempatkan Kaisar mereka sendiri dan mengesampingkan Puyi."
  MAN_tsr_empire_of_manchukuo: "Kekaisaran Manchukuo"
  MAN_tsr_empire_of_manchukuo_desc: "Manchukuo, atau Kekaisaran Manchuria Besar seperti yang dikenal secara resmi, sama sekali bukan kekuatan dunia, namun kita masih berhasil mengukir tempat kita di lanskap Asia Timur Raya. Kita harus berusaha untuk mempertahankan posisi ini, tidak terjerumus pada kepura-puraan akan kekayaan dan kemuliaan yang besar, melainkan berusaha menemukan peran kita di dunia ini."
  MAN_tsr_embrace_state_shintoism: "Menerima Shintoisme Negara"
  MAN_tsr_embrace_state_shintoism_desc: "Negara Shinto telah melayani Kekaisaran Jepang dengan baik, berhasil memobilisasi jutaan orang untuk tujuan tersebut. Kita harus berusaha untuk meniru hal ini di wilayah kita sendiri, meskipun pada awalnya hal ini mungkin mendapat penolakan."
  MAN_tsr_work_with_the_kempeitai: "Bekerja dengan Kempeitai"
  MAN_tsr_work_with_the_kempeitai_desc: "Kempeitai, polisi militer Jepang, aktif di Manchuria melawan Bandit dan Pembangkang lainnya. Namun mereka menghadapi kesulitan besar dalam hal ini karena buruknya komunikasi dengan pihak berwenang dan kurangnya pengetahuan tentang lahan tersebut. Kita harus bekerja sama dengan mereka untuk menciptakan unit yang lebih efisien."
  MAN_tsr_promote_manchu_identity: "Promosikan Identitas Manchu"
  MAN_tsr_promote_manchu_identity_desc: "Masyarakat Manchuria bukan sekadar bangsa Tiongkok. Kita harus berusaha untuk menegakkan hubungan ini dengan Tiongkok dan mendorong nasionalisme Manchuria untuk memisahkan kita dari wilayah Tiongkok lainnya. Dengan cara ini kita akan lebih mudah mempertahankan kemerdekaan sekaligus menghubungkan kita lebih dekat dengan negara-negara besar di Asia."
  MAN_tsr_claim_outer_manchuria: "Klaim Manchuria Luar"
  MAN_tsr_claim_outer_manchuria_desc: "Hilangnya Manchuria Luar ke tangan Rusia masih menjadi duri bagi kaum nasionalis Manchuria hingga saat ini. Kita harus berusaha memperbaiki kesalahan sejarah ini dengan mengklaim kembali dan mengintegrasikan kembali wilayah-wilayah ini ke dalam Negara Manchuria yang baru lahir."
  MAN_tsr_reclaim_our_lost_possessions: "Dapatkan Kembali Harta Kita yang Hilang"
  MAN_tsr_reclaim_our_lost_possessions_desc: "Hilangnya Manchuria Luar dalam Perjanjian Aigun dan Peking serta perebutan Mongolia oleh Soviet masih menjadi luka bagi negara kita. Kita harus membalikkan kesalahan sejarah ini dan mengakhiri kekaisaran Soviet untuk selamanya!"
  MAN_tsr_reclaim_our_lost_possessions_tt: "Membuka keputusan untuk mengintegrasikan §YManchuria Luar§!, [MON.GetFlag] §Y[MON.GetAdjective]§! dan [TAN.GetFlag] §Ystatus [TAN.GetAdjective]§!."
  MAN_tsr_a_new_constitution: "Konstitusi Baru"
  MAN_tsr_a_new_constitution_desc: "Kediktatoran kerajaan tidak menguntungkan siapa pun. Kita sebaiknya merancang konstitusi yang memberikan kekuasaan kepada Kaisar namun juga membatasi kekuasaannya pada pemerintahan yang dipilih secara demokratis."
  MAN_tsr_division_of_power: "Pembagian Kekuasaan"
  MAN_tsr_division_of_power_desc: "Dengan disusunnya konstitusi, konstitusi tersebut kini akan mulai berlaku dan noda bentuk pemerintahan yang barbar seperti kediktatoran militer dan kerajaan akan menjadi masa lalu. Kekaisaran Tiongkok akan menjadi negara tidak hanya untuk yang kuat dan perkasa, tapi untuk semua orang."
  MAN_tsr_reestablish_the_qing_army: "Membangun kembali Tentara Qing"
  MAN_tsr_reestablish_the_qing_army_desc: "Tanpa tentara kita tidak akan pernah bisa menyatukan kembali Kekaisaran yang dulu ada. Kita harus mengambil inspirasi dari tentara lama kita tetapi juga tidak terlalu mengakar dalam tradisi. Seni perang sedang berubah dan kita harus mengikutinya."
  MAN_tsr_question_the_emperors_authority: "Pertanyakan Otoritas Kaisar"
  MAN_tsr_question_the_emperors_authority_desc: "Meskipun Puyi masih mendapat cukup banyak dukungan dari mereka yang menentang pemerintah, ia juga banyak dikritik karena tidak bertindak melawan Jepang. Kita harus mengatasi gelombang ini dan menyingkirkannya dari gambaran Manchuria yang merdeka sepenuhnya."
  MAN_tsr_bandit_recruitment: "Perekrutan Bandit"
  MAN_tsr_bandit_recruitment_tt: "Membuka keputusan §YPerekrutan Bandit§!"
  MAN_tsr_bandit_recruitment_desc: "Banyak dari mereka yang disebut bandit yang berkeliaran di wilayah kita pada kenyataannya adalah pejuang gerilya yang terlibat dalam konflik aktif melawan Jepang. Kita harus bersekutu dan memanfaatkan pengalaman mereka jika kita ingin mempunyai peluang melawan Kekaisaran Jepang."
  MAN_tsr_ally_bandit_leaders: "Pemimpin Bandit Sekutu"
  MAN_tsr_ally_bandit_leaders_tt: "Dapatkan 5 unit dengan §Y5 batalyon infanteri§!.\n"
  MAN_tsr_ally_bandit_leaders_desc: "Kehadiran Tentara Kwantung berarti Jepang telah berhasil merebut kekuasaan yang besar atas negara kita. Namun, hal ini juga berarti bahwa terdapat sejumlah besar orang yang bersedia mengangkat senjata untuk mengusir mereka dari tanah kami. Kita harus memanfaatkan kesempatan ini untuk memastikan kemenangan rakyat."
  MAN_tsr_a_new_dawn_over_manchuria: "Fajar Baru Atas Manchuria"
  MAN_tsr_a_new_dawn_over_manchuria_desc: "Waktunya telah tiba. Pasukan kita telah siap dan garnisun Jepang runtuh akibat serangan pemberontak yang kembali terjadi. Jika kita mampu mengusir penjajah, sekaranglah waktunya."
  MAN_kim_il_sung_tt: "Kaum revolusioner Korea tertentu mungkin terdorong untuk ikut berperang"
  MAN_tsr_depose_puyi: "Singkirkan Puyi"
  MAN_tsr_depose_puyi_desc: "Puyi telah memenuhi tujuannya sebagai tokoh, namun kini ia hanya berfungsi sebagai penghambat demokrasi sejati. Berada di bawah kekuasaan raja hanya akan memperkuat negara kita dalam konsepsi aristokrasi dan bangsawan abad pertengahan. Oleh karena itu, sangat penting untuk memecatnya dari jabatannya."
  MAN_tsr_the_new_beiyang_government: "Pemerintahan Beiyang Baru"
  MAN_tsr_the_new_beiyang_government_desc: "Tentara Beiyang pernah memimpin Republik Tiongkok dari tempat kita berdiri. Jika kita ingin mewujudkan demokrasi sejati di Tiongkok, kita harus mengambil peran sebagai penerus mereka, jangan sampai kita hanya dilihat sebagai negara tidak sah yang dijalankan oleh para bandit."
  MAN_cores_beiyang_tt: "Mendapatkan inti di §YTiongkok Utara§! dan §YMongolia Dalam§!"
  MAN_tsr_reform_the_army: "Reformasi Angkatan Darat"
  MAN_tsr_reform_the_army_desc: "Pasukan kita saat ini tidak lebih dari kelompok sampah yang terdiri dari berbagai tentara pemberontak dan sisa-sisa tentara Manchuria. Jika kita ingin menghindari bencana total dalam peperangan yang akan datang, pertama-tama kita harus mengubahnya menjadi seperti dulu."
  MAN_tsr_beiyang_university: "Universitas Beiyang"
  MAN_tsr_beiyang_university_desc: "Tanpa pendidikan yang layak, masyarakat kita akan kekurangan kesempatan dan upaya penelitian kita akan tertinggal dibandingkan negara-negara lain di Tiongkok dan negara-negara lain. Oleh karena itu kita harus mendirikan sebuah universitas untuk menghormati Pan Fu, perdana menteri terakhir dari Pemerintahan Beiyang yang lama."
  MAN_tsr_the_southern_expedition: "Ekspedisi Selatan"
  MAN_tsr_the_southern_expedition_desc: "Ekspedisi Kuomintang ke utara adalah hal yang pernah menghancurkan republik kita yang indah ini. Kita harus membalikkan kesalahan ini dengan meluncurkan ekspedisi ke selatan dan akhirnya mengakhiri negara gagal yang saat ini menduduki Nanjing."
  MAN_tsr_proclaim_the_republic_of_china: "Proklamasikan Republik Tiongkok"
  MAN_tsr_proclaim_the_republic_of_china_desc: "Dengan seluruh ibu kota berada di bawah kendali kami, kami akhirnya dapat memproklamirkan diri sebagai Republik Tiongkok dan penerus sah Pemerintahan Beiyang. Kita masih belum bisa melihat apa yang akan terjadi di masa depan, namun untuk saat ini kita telah membawa demokrasi ke seluruh Tiongkok, dan semoga demokrasi ini akan tetap ada selama seribu tahun."
  MAN_tsr_finish_off_the_japanese_threat: "Selesaikan Ancaman Jepang"
  MAN_tsr_finish_off_the_japanese_threat_desc: "Jepang, penjajah awal kita, sudah terlalu lama dibiarkan begitu saja. Sudah saatnya kita mengakhiri lelucon mereka dan menunjukkan negara mana yang berhak menguasai Asia."
  MAN_tsr_an_industrial_power: "Kekuatan Industri"
  MAN_tsr_an_industrial_power_desc: "Dengan industri yang akhirnya mampu bersaing dengan negara-negara barat, kita harus mendorong untuk mengembangkannya lebih jauh lagi. Dengan ini kita pada waktunya akan menjadi kekuatan industri utama di Asia dan kemudian di Seluruh Dunia."
  MAN_tsr_zhao_shangzhis_coup: "Kudeta Zhao Shangzhi"
  MAN_tsr_zhao_shangzhis_coup_desc: "Dengan meredanya situasi, hilangnya Jepang dan Puyi digulingkan, terjadilah semacam kekosongan kekuasaan di Manchuria. Zhao Shangzhi dan Pasukan Persatuan Anti-Jepang Timur Lautnya dengan cepat mengisi kekosongan ini dan kini menuntut [MAN.GetLeader] untuk mundur."
  MAN_tsr_ally_the_soviet_republic: "Sekutu Republik Soviet"
  MAN_tsr_ally_the_soviet_republic_desc: "Teman-teman kami di CPC di seluruh Tiongkok pasti ingin bergabung dengan kami. Bersama-sama kita akan lebih mampu melawan ancaman asing atau internal."
  MAN_tsr_research_cooperation: "Kerjasama Penelitian dengan BPK"
  MAN_tsr_research_cooperation_desc: "Saat ini terdapat kekurangan komunikasi aktual antara berbagai wilayah yang ditempati oleh partai kami. Oleh karena itu, kita harus mengoordinasikan upaya penelitian kita di dalam CPC untuk memastikan tidak ada pihak yang tertinggal."
  MAN_tsr_the_long_march_south: "Maret Selatan"
  MAN_tsr_the_long_march_south_desc: "Waktunya telah tiba. Dengan memindahkan pasukan melintasi perbatasan, kita akan memulai tahap akhir Perang Saudara di Tiongkok. Masih terlalu dini untuk melihat siapa yang akan menang tetapi dengan manuver yang ahli maka akan sulit bagi musuh kita untuk mengimbanginya."
  MAN_tsr_soviet_aid: "Bantuan Soviet"
  MAN_soviet_volunteers_tt: "[SOV.GetFlag] §YUni Soviet§! kemungkinan besar akan mengirimkan sukarelawan kepada kami"
  MAN_tsr_soviet_aid_desc: "Dengan adanya Uni Soviet di utara dan timur kita, maka tidak akan terlalu sulit untuk mengatur transportasi baik peralatan maupun manusia ke tanah kita. Oleh karena itu, kita harus membujuk mereka untuk membantu sekutu ideologis mereka di Tiongkok."
  MAN_tsr_proclaim_the_peoples_republic: "Proklamasikan Republik Rakyat"
  MAN_tsr_proclaim_the_peoples_republic_desc: "Dengan ibu kota utama Tiongkok berada di bawah kendali kita, sudah tiba waktunya untuk memproklamirkan pembentukan Republik Rakyat Tiongkok. Kita tidak akan lagi menjadi wilayah yang tidak terorganisir di pinggiran yang dipimpin oleh para bandit dan penjahat lainnya di mata Kekuatan Global, namun kita akan menjadi negara yang sepenuhnya maju!"
  MAN_tsr_request_our_lost_territories: "Minta Wilayah Kami yang Hilang"
  MAN_tsr_request_our_lost_territories_tt: "Meminta [SOV.GetFlag] §YUni Soviet§! untuk menyerahkan wilayah yang pernah berada di bawah kendali Tiongkok"
  MAN_tsr_request_our_lost_territories_desc: "Uni Soviet saat ini berada di beberapa wilayah yang dulunya merupakan wilayah Tiongkok dan Manchuria. Jika kita ingin memiliki hubungan yang baik dengan negara mereka, maka akan adil jika kita meminta mereka kembali atau setidaknya menyelesaikan perselisihan ini."
  MAN_tsr_persuade_the_IMPRP: "Bujuk IMPRP"
  MAN_tsr_persuade_the_IMPRP_tt: "Anggota [MEN.Getflag] §YPartai Revolusioner Rakyat Mongolia§! akan memulai perang saudara setelah kami mendeklarasikan kemerdekaan"
  MAN_tsr_persuade_the_IMPRP_desc: "Partai Revolusioner Rakyat Mongolia Dalam bukanlah kekuatan besar di [MEN.GetName] saat ini, namun dengan bujukan dan bantuan dari pihak perbatasan, kita dapat menyeret mereka bersama kita dalam revolusi melawan [JAP.GetNameDef], dan pada gilirannya juga membebaskan mereka."
  MAN_tsr_raise_the_yong_ying: "Angkat Yong Ying"
  MAN_tsr_raise_the_yong_ying_desc: "Yong Ying, yang secara harfiah berarti 'Kamp Pemberani', adalah semacam tentara regional pada masa Kekaisaran Qing. Mereka terdiri dari milisi lokal dan tidak seperti tentara tetap, mereka didanai secara lokal. Milisi-milisi ini sering kali bertujuan untuk membela diri di tingkat lokal di provinsi-provinsi dan sangat membantu kami. Kita harus berusaha untuk menerapkan kembali sistem ini namun membuatnya sesuai untuk perang modern."
  MAN_tsr_raise_the_yong_ying_tt: "Membuka keputusan untuk §YMeningkatkan Milisi§! saat berperang"
  MAN_tsr_a_new_self_strengthening_movement: "Gerakan Penguatan Diri"
  MAN_tsr_a_new_self_strengthening_movement_desc: "Gerakan Penguatan Diri atau Gerakan Urusan Barat adalah periode westernisasi di Kerajaan lama kita. Tujuannya terutama untuk meningkatkan kemampuan industri dan militer kita setelah beberapa krisis yang hampir menghancurkan bangsa kita. Kita harus berupaya untuk melanjutkan modernisasi ini untuk menghindari potensi bencana di masa depan."
  MAN_tsr_reestablish_the_gansu_braves: "Bentuk kembali Gansu Braves"
  MAN_tsr_reestablish_the_gansu_braves_desc: "Gansu Braves adalah kekuatan gabungan tentara Muslim dari Gansu. Dengan wilayah yang dikuasai oleh keluarga Ma akhirnya berada di bawah kendali kami, kami harus membentuk kembali pasukan ini dan merekrut jenderal-jenderal mereka untuk membantu kami mengendalikan wilayah tersebut."
  CHI_sea_one_china_policy_tt: "Membuka keputusan untuk mengintegrasikan negara-negara yang pernah menjadi bagian dari Tiongkok"
  CHI_sea_annex_tuva: "Lampiran Tuva"
  CHI_sea_annex_tuva_desc: "Tuva dulunya merupakan bagian dari negara kami, namun setelah revolusi Rusia mencurinya dari kami. Kita harus berusaha menyatukan kembali mereka dengan saudara-saudara mereka di selatan dan membebaskan mereka dari tangan Rusia."
  CHI_sea_push_into_manchuria: "Dorong ke Manchuria"
  CHI_sea_push_into_manchuria_desc: "Hilangnya Manchuria ke tangan Rusia dalam perjanjian tahun 1858 dan 1860 merupakan hal yang memalukan dan jika kita ingin menjadi kekuatan Kekaisaran, kita harus berusaha membalikkan kesalahan ini."
  CHI_sea_dominate_siam: "Dominasi Siam"
  CHI_sea_dominate_siam_desc: "Siam berdiri sebagai salah satu dari sedikit negara di Asia yang tidak diduduki oleh kekuatan asing. Kita harus lebih melindungi mereka dari kekuatan asing dengan menawarkan perlindungan kita, dan pada gilirannya mengambil kendali atas negara mereka."
  SIC_the_sichuan_clique: "Klik Sichuan"
  SIC_the_sichuan_clique_desc: "Klik Sichuan berada pada posisi yang menarik, karena merupakan wilayah dari beberapa panglima perang yang berpikiran berbeda yang disatukan secara longgar oleh suatu gagasan persatuan provinsi. Kita harus memanfaatkan berbagai kekuatan dari para panglima perang ini untuk tumbuh dan menjadi lebih kuat dari yang sudah kita miliki."
  SIC_the_domain_of_liu_wenhui: "Domain Liu Wenhui"
  SIC_the_domain_of_liu_wenhui_desc: "Liu Wenhui, paman dan mantan saingan Liu Xiang, telah mendirikan kerajaan kecilnya sendiri di provinsi Xikang. Awalnya menjabat sebagai Gubernur Sichuan, ia digulingkan pada tahun 1935 dan sejak itu ia memerintah Xikang sebagai wilayah yang independen secara fungsional, dengan ambisi untuk menyatukan seluruh Xikang di bawah pemerintahannya."
  SIC_develop_xikang: "Kembangkan Xikang"
  SIC_develop_xikang_desc: "Xikang berpenduduk jarang dan bergunung-gunung, sehingga sering kali diabaikan dalam pembangunan provinsi. Kita harus berusaha berinvestasi di bidang ini untuk mendapatkan dukungan masyarakat dan pada gilirannya juga meningkatkan basis ekonomi kita."
  SIC_push_back_the_tibetans: "Dorong Kembali Orang Tibet"
  SIC_push_back_the_tibetans_desc: "Akhirnya tiba saatnya untuk menyerang. Kita harus dengan tegas melewati sungai Jinsha ke Chamdo seperti yang kita ancam pada tahun 1932, dan akhirnya menyatukan Xikang di bawah kekuasaan kita!"
  SIC_the_armies_of_yang_sen: "Tentara Yang Sen"
  SIC_the_armies_of_yang_sen_desc: "Yang Sen adalah seorang jenderal dengan karir militer yang cukup luas, pernah menjadi Gubernur Sichuan pada tahun 1924 hingga 1925 hingga kemudian bentrok dengan Inggris dan bergabung dengan Kuomintang pada tahun 1926. Kita harus berusaha mendapatkan bantuannya untuk meningkatkan kemampuan militer kita."
  SIC_anti_communism: "Anti-Komunisme"
  SIC_anti_communism_desc: "Yang Sen adalah pendukung aktif anti-komunisme, setelah sebelumnya aktif berjuang untuk mencegah infiltrasi komunis di provinsi tersebut. Kita harus menjunjung kebijakan ini untuk menghindari Sichuan jatuh ke tangan yang salah."
  SIC_drive_out_the_japanese: "Usir Orang Jepang"
  SIC_drive_out_the_japanese_desc: "Upaya Jepang untuk menundukkan Tiongkok harus segera diakhiri. Meskipun kemenangan militer sepenuhnya masih terasa tidak realistis, kita harus menghentikan mereka dan membalikkan keadaan untuk selamanya. Kita harus berusaha mengusir mereka dari negara kita yang mulia!"
  SIC_the_governor_of_sichuan: "Gubernur Sichuan"
  SIC_the_governor_of_sichuan_desc: "Liu Xiang, gubernur saat ini dan keponakan Liu Wenhui, menguasai wilayah terkaya dan terpenting di Sichuan. Kita harus berusaha untuk mengembangkannya lebih lanjut sambil meningkatkan kemampuan teknologi kita, dan melanjutkan reformasinya."
  SIC_develop_chongqing: "Kembangkan Chongqing"
  SIC_develop_chongqing_desc: "Chongqing adalah jantung kota Sichuan, dan kita harus berupaya untuk melakukan industrialisasi lebih lanjut. Jika kita ingin melawan ancaman asing atau dalam negeri, kita juga harus mendapat dukungan industri untuk melakukannya."
  SIC_armor_efforts: "Upaya Armor"
  SIC_armor_efforts_desc: "Kemampuan lapis baja dan angkatan udara yang kita miliki terlalu kecil untuk konflik modern. Kita harus berupaya meningkatkan teknologi kita untuk menghadapi ancaman asing."
  SIC_sichuan_still_stands: "Sichuan Masih Berdiri"
  SIC_sichuan_still_stands_desc: "Meskipun Pemerintah Pusat berharap dengan melakukan demonstrasi di Chongqing setelah kematian Liu Xiang berarti kami menyerah, namun kenyataannya tidak demikian. Sebaliknya, kami telah membuktikan diri sebagai kekuatan yang sah di Tiongkok dan mampu melawan Pemerintah Pusat jika diperlukan."
  SND_unlock_loyalty_decision_tt: "§YMembuka keputusan untuk mencoba dan membuktikan kesetiaan Han Fuju atau membelot ke Jepang§!"
  GXC_the_japanese_visit: "Kunjungan Jepang"
  GXC_the_japanese_visit_desc: "Jepang sudah cukup lama menaruh perhatian pada kedua negara kita, dengan harapan bahwa penentangan kita terhadap Pemerintah Pusat akan membuka peluang ekspansi lebih lanjut di Tiongkok. Meskipun kami tidak setuju dengan Jepang dan dengan keras menentang kemajuan mereka ke tanah kami, akan lebih bijaksana jika kami menerima hadiah yang mereka tawarkan sehingga kami dapat menggunakan senjata mereka sendiri untuk melawan mereka jika saatnya tiba."
  GXC_question_chiangs_authority: "Pertanyakan Otoritas Chiang"
  GXC_question_chiangs_authority_desc: "Chiang Kai-Shek baru-baru ini berusaha untuk meningkatkan pengaruhnya terhadap provinsi-provinsi kita untuk mencoba mengendalikan kita. Kita harus mempertanyakan apakah dia benar-benar mempunyai wewenang atas kita, karena kita secara fungsional independen."
  GXC_the_scorched_earth_speech: "Pidato Bumi Hangus"
  GXC_the_scorched_earth_speech_desc: "Pemerintah Pusat bersikap terlalu lunak terhadap Jepang. Kita harus melawan mereka sampai titik darah penghabisan, membakar bumi jika kita terpaksa mundur. Kekaisaran Jepang tidak boleh menguasai seluruh Tiongkok, apa pun risikonya."
  GXC_rumors_of_deposition: "Rumor Deposisi"
  GXC_rumors_of_deposition_desc: "Ada desas-desus yang beredar bahwa Chiang Kai-Shek melihat Chen Jitang terlalu mandiri dan oleh karena itu berusaha mengendalikan provinsi tersebut dengan memaksanya untuk mengundurkan diri. Jika ini benar, maka ini sangat meresahkan dan kita harus segera bertindak!"
  GXC_denounce_chiang: "Kecam Chiang Kai-Shek"
  GXC_denounce_chiang_desc: "Sikap dan ketidakmampuan Chiang Kai-Shek untuk melakukan perlawanan apa pun terhadap Jepang membuktikan bahwa ia lemah dan tidak layak untuk memerintah. Kita harus mengecamnya dan menawarkan solusi alternatif, yang tidak lemah."
  GXC_formation_of_the_nraja: "Pembentukan NRAJA"
  GXC_formation_of_the_nraja_desc: "Kami sekali lagi melihat bahwa kami tidak punya pilihan selain mengorganisir perlawanan bersenjata dan bergerak menuju Nanjing jika kami ingin mencegah Jepang mengambil alih tanah kami secara perlahan. Oleh karena itu kita harus membentuk Tentara Revolusioner Nasional Anti-Jepang dan bersiap untuk bergerak melawan Hunan."
  GXC_declare_opposition: "Nyatakan Oposisi"
  GXC_declare_opposition_desc: "Waktunya telah tiba. Kita harus menyatakan penolakan kita terhadap Pemerintah Pusat dan bergerak ke utara untuk memaksa mereka bernegosiasi atau memecat mereka untuk selamanya. Apa yang mungkin terjadi selanjutnya masih belum pasti, tetapi jika kami gagal, kami tetap mengirimkan pesan yang kuat!"
  MA_develop_inter_province_ties: "Mengembangkan Ikatan Antar Provinsi"
  MA_develop_inter_province_ties_desc: "Agar dapat memerintah dan mengembangkan wilayah kita yang luas dan jarang penduduknya secara lebih efektif, kita harus menjangkau sesama anggota keluarga dan membangun hubungan yang lebih erat antar provinsi yang kita kelola."
  cast_off_ma_ties_or_became_china_flag: "Telah melepaskan Ikatan Ma-keluarga atau Menjadi Pemerintah Pusat yang baru"
  MA_unified_training_program: "Program Pelatihan Terpadu"
  MA_unified_training_program_desc: "Untuk melindungi perbatasan kita dan menjaga kendali ketat di wilayah timur laut, sangat penting bagi kita untuk meningkatkan kualitas pasukan kita serta mengoordinasikan perekrutan untuk memastikan tidak ada rekrutan berharga yang lolos dari pengawasan kita."
  MA_strenghten_regional_trade: "Memperkuat Perdagangan Regional"
  MA_strenghten_regional_trade_desc: "Meskipun tanah kami sangat luas, perekonomian kami masih kekurangan dalam berbagai aspek. Kita harus mengoordinasikan pembangunan perdagangan dan industri untuk mengatasi permasalahan ini."
  MA_strenghten_regional_trade_tt: "Semua anggota mendapatkan §G1§! §YPabrik Sipil§! di modal mereka"
  MA_promises_of_mutual_defense: "Janji Saling Membela"
  MA_promises_of_mutual_defense_desc: "Dengan semua perjanjian sebelumnya yang telah ditandatangani, kita sekarang dapat melanjutkan untuk memberlakukan perjanjian pertahanan bersama yang akan memastikan kita semua saling membantu jika ada kekuatan asing, baik Tiongkok atau bukan, yang mengganggu wilayah kita."
  MA_promises_of_mutual_defense_tt: "Semua Kelompok Ma akan §YMenjamin Kemandirian§! satu sama lain"
  MA_formalize_the_ma_clique_collective: "Formalisasikan Kolektif Ma Clique"
  MA_formalize_the_ma_clique_collective_desc: "Semua landasan kini telah diletakkan untuk mengubah Kolektif Ma Clique dari formasi longgar panglima perang jarak jauh menjadi sesuatu yang lebih bersatu. Kita harus meresmikan entitas ini, dan memastikan kita semua mempunyai kebijakan luar negeri yang sama."
  MA_clique_collective_faction: "Kolektif Klik Ma"
  XIC_northwest_bandit_suppression_headquarters: "Markas Besar Penindasan Bandit"
  XIC_northwest_bandit_suppression_headquarters_desc: "Operasi kami melawan komunis di Shaanxi terhenti, dan pada paruh kedua tahun 1935 saja kami kehilangan divisi infanteri dan resimen di wilayah tersebut. Dengan meningkatnya tekanan dari para perwira dan tentara kita untuk menghentikan pertempuran sia-sia melawan komunis dan fokus pada pemulihan provinsi-provinsi kita yang hilang di timur laut, kita perlu membuat pilihan."
  XIC_discussions_in_luochuan: "Diskusi di Luochuan"
  XIC_discussions_in_luochuan_desc: "Komunis telah mengirim Li Kenong sebagai wakil mereka untuk bertemu $CHI_zhang_xueliang$ di Luochuan. Mereka ingin membahas kemungkinan penghentian permusuhan dan fokus pada apa yang kita berdua anggap sebagai ancaman lebih besar terhadap Tiongkok dan Jepang. Kami akan memanjakan mereka, dan menuju ke lokasi yang ditentukan dengan tergesa-gesa."
  XIC_send_a_representative_to_sheng_shicai: "Kirim Perwakilan ke Sheng Shicai"
  XIC_send_a_representative_to_sheng_shicai_desc: "Li Kenong setuju untuk menjalin kerja sama antara kami dan CPC dengan syarat kedua belah pihak mencari perwakilan [SOV.GetAdjective] dan berupaya mendapatkan bantuan mereka dalam perang melawan Jepang. Kita harus menggunakan kontak kita di [SIK.GetNameDef] untuk mendapatkan dukungan dari [SOV.GetLeader]."
  XIC_non_agression_pact_with_the_cpc: "Non-Agresi dengan BPK"
  XIC_non_agression_pact_with_the_cpc_desc: "Untuk membuktikan komitmen kita terhadap perjuangan anti-Jepang, kita harus berusaha menghentikan permusuhan untuk sementara waktu, meskipun [CHI.GetLeader] yang berpuas diri mungkin merasa kesal dengan keputusan tersebut. Pada waktunya, kita akan mampu meyakinkan pimpinan [CHI.GetAdjective] untuk bekerja sama dengan [PRC.GetNameDef]."
  XIC_the_fushi_conference: "Konferensi Fushi"
  XIC_the_fushi_conference_desc: "Untuk pertemuan kedua, [PRC.GetLeader] telah setuju untuk mengirim Li Kenong dan Zhou Enlai sebagai utusan ke Fushi untuk membahas persyaratan dan tindakan lebih lanjut yang diperlukan untuk meyakinkan [CHI.GetLeader] untuk bergabung dengan Front Persatuan formal. Saatnya untuk mengalahkan [JAP.GetAdjective] dan merebut kembali tanah Kelompok Fengtian semakin dekat..."
  XIC_anti_japanese_national_salvation_agreement: "Perjanjian Keselamatan Nasional Anti-Jepang"
  XIC_anti_japanese_national_salvation_agreement_desc: "Dengan tercapainya kesepakatan formal untuk mengakhiri permusuhan di Shaanxi, sekarang saatnya untuk memperkuat CPC agar mereka mendapatkan kekuatan yang diperlukan untuk meyakinkan [CHI.GetLeader] bahwa diakhirinya perang saudara dan pembentukan Front Persatuan Kedua layak dilakukan oleh Kuomintang. Oleh karena itu kita harus menyelundupkan senjata dan dana yang diberikan oleh KMT ke Wilayah Pangkalan Soviet, untuk membangun kekuatan mereka."
  XIC_withdraw_forces_from_yanan: "Tarik Pasukan dari Yan'an"
  XIC_withdraw_forces_from_yanan_desc: "Untuk memicu kemarahan [CHI.GetLeader] dan memastikan bahwa pimpinan partai KMT melakukan perjalanan ke Xi'an untuk menyelidiki pasukan kita, kita harus menimbulkan insiden dengan menarik pasukan kita dari Yan'an dan membiarkan komunis merebut kota tersebut."
  XIC_form_the_anti_japanese_comrades_association: "Bentuk Asosiasi Kamerad Anti-Jepang"
  XIC_form_the_anti_japanese_comrades_association_desc: "Untuk membangun kekuatan kita dan meyakinkan tentara untuk berhenti melawan PKT, kita harus membentuk sebuah organisasi inti rahasia untuk menyatukan Tentara Timur Laut dan menyerap mereka yang memiliki ide-ide aktif anti-Jepang, sesuatu yang oleh Zhang dijuluki sebagai Asosiasi Kamerad Anti-Jepang. Zhang akan menjabat sebagai ketua asosiasi, bersatu dengan Komunis untuk melawan Jepang dan melatih kader anti-Jepang."
  XIC_invite_chiang_for_troop_inspections: "Undang [CHI.GetLeader] untuk Inspeksi Pasukan"
  XIC_invite_chiang_for_troop_inspections_desc: "Negara kita dilemahkan oleh pertikaian internal sementara Jepang jelas mempunyai rencana di wilayah kita. Meskipun demikian, [CHI.GetLeader] menolak bekerja sama dengan CPC dan terus menuntut kami melanjutkan kampanye pemberantasan bandit meskipun kami sudah memohon dengan putus asa, agar kami tidak dipindahkan ke selatan. Kita harus memaksa kaum Nasionalis dan Komunis untuk melihat akal sehatnya dan membentuk Front Persatuan."
  XIC_sixth_encirclement_campaign: "Kampanye Pengepungan ke-6"
  XIC_sixth_encirclement_campaign_desc: "Meskipun kami mengalami kerugian besar akibat ancaman CPC, kami harus bersiap menghadapi serangan lainnya, karena [CHI.GetLeader] sekali lagi memerintahkan kami untuk melanjutkan kampanye pengepungan. Hanya dengan melakukan hal ini, kepemimpinan [CHI.GetAdjective] akan merasa puas dan memungkinkan kita memusatkan perhatian ke wilayah timur laut."
  XIC_request_relocation_to_northeastern_command: "Minta Relokasi ke Komando Timur Laut"
  XIC_request_relocation_to_northeastern_command_desc: "Dengan selesainya misi pemberantasan bandit di Shaanxi, sekarang saatnya untuk mengusulkan rencana untuk [CHI.GetLeader] yang mana kami akan menyarankan $CHI_zhang_xueliang$ untuk mengambil peran sebagai benteng utara dan penjaga [608.GetName], yang saat ini dipegang oleh [HBC.GetLeader]. Through this, we will be able to further our goals of restoring the once great Fengtian Clique."
  XIC_invite_zuolin_loyalsits: "Undang Loyalis Zuolin"
  XIC_invite_zuolin_loyalsits_desc: "Banyak tentara dan jenderal yang bertugas di pasukan [MAN.GetNameDef] pernah setia kepada ayah [ROOT.GetLeader], Zhang Zuolin. It is time we secretly reach out to them, and invite them to return to [ROOT.GetNameDef]."
  XIC_reestablish_the_zhili_army: "Membangun kembali Tentara Zhili"
  XIC_reestablish_the_zhili_army_desc: "The Fengtian clique's Zhili Army was once the army Zuolin had placed in what is now Hebei province and Beiping. We should reestablish this organization, as a good stepping stone in our path to rebuilding the Clique from the ground up."
  XIC_recruit_mancurian_bandits: "Rekrut Bandit Manchuria"
  XIC_recruit_mancurian_bandits_desc: "Banyak dari bandit yang berkeliaran di Manchuria pada kenyataannya adalah pejuang gerilya yang terlibat dalam konflik aktif melawan [JAP.GetNameDef] dan [MAN.GetNameDef]. We should ally and utilize their experience them if we are to have a realistic chance against the eastern threat."
  XIC_recruit_mancurian_bandits_tt: "Gain 3 units with §Y5 infantry§! battalions and 2 units with §Y5 cavalry§! battalions.\n"
  XIC_restore_the_glory_of_the_fengtian_army: "Kembalikan Kemuliaan Tentara Fengtian"
  XIC_restore_the_glory_of_the_fengtian_army_desc: "Dengan selesainya pembentukan kembali pasukan Zhili, sekarang saatnya kita membangun kembali Tentara Fengtian dengan kekuatan seperti dulu, sebagai kekuatan dominan di Tiongkok utara. Segera, hari-hari kejayaan kita akan dipulihkan!"
  XIC_reclaim_the_lost_birthright: "Raih Kembali Hak Kesulungan yang Hilang"
  XIC_reclaim_the_lost_birthright_desc: "Akhirnya tiba saatnya untuk mengusir [MAN.GetAdjective] dan [JAP.GetAdjective] dari tanah air kita, dan merebut kembali Manchuria untuk diri kita sendiri! We should launch an invasion of the north promptly, and seize the region before their forces know what hit them."
  XIC_restore_the_homeland: "Kembalikan NKRI"
  XIC_restore_the_homeland_desc: "Dengan reklamasi ibu kota lama kita, Mukden, akhirnya tiba waktunya bagi $CHI_zhang_xueliang$ untuk menyandang gelar Panglima Perang Manchuria dan Generalissimo dari Pemerintahan Militer Tiongkok, dan mengembalikan Kelompok Fengtian ke kekuasaan yang pernah mereka pegang. Long live Fengtian, and long live the young marshal!"
  XIC_restore_the_homeland_tt: "Gain §YCores§! on all territory held by the §YFengtian Clique§! at it's largest extent"
  XIC_revive_the_beiyang_government: "Menghidupkan kembali Pemerintahan Beiyang"
  XIC_revive_the_beiyang_government_desc: "Sebagai pewaris sah pemerintahan di pengasingan Pemerintah Beiyang, kami akhirnya dapat memproklamirkan diri sebagai Republik Tiongkok yang sah. Kita masih belum bisa melihat apa yang akan terjadi di masa depan, namun untuk saat ini kita telah membawa demokrasi ke seluruh Tiongkok, dan semoga demokrasi ini akan tetap ada selama seribu tahun."
  CHI_tsr_repoen_the_natioal_assembly: "Buka kembali Majelis Nasional"
  CHI_tsr_repoen_the_natioal_assembly_desc: "Majelis Nasional adalah cabang legislatif pemerintahan Beiyang, yang ditutup selamanya oleh Yuan Shikai dan kemudian digantikan oleh Legislatif Yuan.  Jika kita menginginkan badan legislatif demokratis yang benar-benar bebas di negara ini, kita tidak bisa puas hanya dengan membiarkan Yuan melanjutkan operasinya. Sistem multi-aspek harus diterapkan untuk memastikan keinginan rakyat dapat berkuasa!"
  CHI_tsr_form_a_preparatory_committee: "Membentuk Panitia Persiapan"
  CHI_tsr_form_a_preparatory_committee_desc: "Kecuali kerugian dalam persaingan memperebutkan kepala negara dihilangkan terlebih dahulu, negara tidak akan pernah memiliki perdamaian. Oleh karena itu, seperti yang pernah dilakukan pada tanggal 19 Agustus 1915, harus dibentuk panitia persiapan yang bertujuan untuk mendirikan monarki konstitusional. Hanya dengan cara inilah perselisihan internal dan kekacauan politik kita dapat benar-benar dilenyapkan!"
  CHI_tsr_legacy_of_the_hongxian_emperor: "Warisan Kaisar Hongxian"
  CHI_tsr_legacy_of_the_hongxian_emperor_desc: "Yuan Shikai mungkin telah meninggalkan negaranya dalam kondisi buruk yang penuh dengan panglima perang dan semangat republik, tapi niatnya baik. Oleh karena itu, ia mengambil peran Kaisar Hongxian untuk memberikan Kelimpahan Konstitusional nasional, dan menjadi Pelindung Nasionalnya. Jika ada orang yang layak dihormati, maka dialah orangnya, dan kita harus berusaha menghidupkan kembali warisannya sebelum dia terlupakan oleh waktu."
  CHI_tsr_coronation_at_the_temple_of_heaven: "Penobatan di Kuil Surga"
  CHI_tsr_coronation_at_the_temple_of_heaven_desc: "Untuk membangun otoritas kami, [ROOT.GetLeader] harus berupaya memulihkan unsur-unsur Konfusianisme negara, dan menghidupkan kembali perayaan keagamaan negara Qing. Oleh karena itu, demi kepentingan terbaik [ROOT.GetLeader] adalah berpartisipasi sebagai kaisar dalam ritual yang diadakan di Kuil Surga Qing, dan akhirnya dimahkotai di sana."
  CHI_tsr_outlaw_the_kmt_and_cpc: "Melarang KMT dan CPC"
  CHI_tsr_outlaw_the_kmt_and_cpc_desc: "Republikanisme tidak cocok untuk kondisi nasional Tiongkok. Oleh karena itu, unsur-unsur revolusioner yang pernah menggulingkan Kekaisaran dan bangkit dari abunya tidak boleh dibiarkan berkuasa lagi. Negara ini hanya dapat dikembalikan ke kejayaannya di bawah kepemimpinan yang bersatu, dan oleh karena itu perbedaan pendapat internal harus ditangani dengan cepat."
  CHI_tsr_restoration_of_the_chinese_empire: "Pemulihan Kekaisaran Tiongkok"
  CHI_tsr_restoration_of_the_chinese_empire_desc: "Saatnya telah tiba untuk memulihkan bangsa kita, dan membawanya keluar dari abad penghinaan yang terpaksa mereka tanggung. Inilah saatnya untuk mengklaim tempat kita dalam urusan internasional, dan berdiri secara heroik di alam semesta. Ini saatnya [ROOT.GetLeader] mengambil peran sebagai Kaisar Agung Kekaisaran Tiongkok!"
  CHI_tsr_adopt_the_twelve_symbols: "Adopsi Dua Belas Simbol"
  CHI_tsr_adopt_the_twelve_symbols_desc: "Lambang nasional Dua Belas Simbol adalah lambang negara Kekaisaran Tiongkok, dan akan menjadi lambang negara sekali lagi. Berdasarkan simbol-simbol kuno dari Dua Belas Ornamen, dan melalui kekuatan mereka otoritas kaisar akan dikenal di seluruh negeri. Demi Azure Dragon dan Fenghuang, kehendak Kaisar terlaksana!"
  CHI_tsr_reinstate_the_new_imperial_code: "Aktifkan kembali Kode Kekaisaran Baru"
  CHI_tsr_reinstate_the_new_imperial_code_desc: "Sekitar kenaikannya, penasihat hukum Yuan, Ariga Nagao menyusun Kode Kekaisaran Baru, berdasarkan Model Kekaisaran Jepang. Meskipun kami tidak ingin mengikuti secara mendalam dasar hukum negara nakal tersebut, jelas bahwa hal ini akan memberikan dampak yang diharapkan. Untuk mencapai tujuan tersebut, kita harus merancang konstitusi baru berdasarkan kode etik ini."
  CHI_tsr_reestablish_xinhua_palace: "Membangun kembali Istana Xinhua"
  CHI_tsr_reestablish_xinhua_palace_desc: "Setelah kenaikannya, Yuan Shikai mengganti nama kediaman Zhongnanha di sebelah Kota Terlarang menjadi Istana Tiongkok Baru. Memilih ini sebagai tempat tinggalnya, sepertinya sudah sepantasnya [ROOT.GetLeader] mengambil pendekatan yang sama dan mengikuti jejaknya."
  CHI_tsr_reclaim_the_mandate_of_heaven: "Klaim Mandat Surga"
  CHI_tsr_reclaim_the_mandate_of_heaven_desc: "Kemenangan kita sebelumnya dalam perang untuk merebut kembali Ibukota Kekaisaran telah memperjelas bahwa surga sendiri telah menilai Kaisar dengan adil dan layak mendapatkan Tahta Surgawi. Keraguan bahwa ia bukanlah penguasa sah seluruh Tiongkok harus hilang dengan banyaknya bukti yang ada."
  CHI_tsr_five_races_under_one_union: "Lima Ras di Bawah Satu Persatuan"
  CHI_tsr_five_races_under_one_union_desc: "Jika dinasti baru kita ingin bertahan di tahun-tahun mendatang, kita harus menerapkan prinsip-prinsip Republik tempat Yuan Shikai berkuasa. Melalui prinsip republik lima warna, hidup berdampingan secara harmonis dalam satu bangsa dari berbagai kelompok di kawasan dapat tercapai."
  CHI_tsr_zhonghua_minzu: "Zhonghua Minzu"
  CHI_tsr_zhonghua_minzu_desc: "Untuk terus membangun negara yang sukses, kita harus menerapkan nasionalisme Tiongkok dalam kaitannya dengan konsep pembangunan bangsa dan keakraban, yang secara efektif menunjukkan kepada penduduk kita bahwa mereka memiliki kewajiban untuk setia kepada Kaisar dan pemerintah [ROOT.GetNameDef]."
  CHI_tsr_reestablish_the_beiyang_army: "Membangun kembali Tentara Beiyang"
  CHI_tsr_reestablish_the_beiyang_army_desc: "Tentara Laut Utara didirikan oleh Yuan Shikai pada tahun 1895, dan bertindak sebagai inti dari perombakan umum sistem militer Qing yang sudah ketinggalan zaman. Kita harus melakukan hal yang sama, dan merombak angkatan bersenjata untuk menghindari korupsi dan ketidakefisienan yang melekat dalam sistem yang dibangun oleh Kuomintang."
  CHI_tsr_reestablish_the_wuwei_corps: "Membangun kembali Korps Wuwei"
  CHI_tsr_reestablish_the_wuwei_corps_desc: "Korps Wuwei secara efektif adalah pasukan keamanan Beijing dan Kota Terlarang, yang dibentuk sebagai upaya istana kekaisaran Qing untuk menciptakan pasukan gaya barat yang dilengkapi dengan persenjataan modern setelah kekalahan mereka dalam Perang Tiongkok-Jepang. Untuk melindungi nyawa Kaisar dan kota surga, kita harus mengambil tindakan serupa."
  CHI_tsr_never_another_national_protection_war: "Tidak Pernah Ada Lagi Perang Perlindungan Nasional"
  CHI_tsr_never_another_national_protection_war_desc: "Perang Perlindungan Nasional terjadi antara tahun 1915 dan 1916, dan merupakan upaya para jenderal yang tidak loyal dan kaum republiken untuk menggulingkan kekuasaan sah Kaisar Hongxian. Untuk memastikan bahwa hal ini tidak akan terjadi lagi, kita harus segera menindak panglima perang otonom dan tentara independen, dan memastikan semua kekuasaan ada di tangan putra surga!"
  CHI_tsr_tianxia: "Tianxia"
  CHI_tsr_tianxia_desc: "Semua negeri di muka bumi ini telah ditetapkan menjadi kedaulatan surgawi kita berdasarkan prinsip-prinsip tatanan yang universal dan jelas. Pusat dari negeri ini akan menjadi istana [ROOT.GetAdjective] dan Kaisar. Akhirnya tiba saatnya untuk mengklaim tempat kita sebagai kerajaan tengah, dan sebagai tempat lahirnya peradaban manusia!"
  CHI_tsr_the_reorganied_government: "Pemerintahan yang Direorganisasi"
  CHI_tsr_the_reorganied_government_desc: "Dengan Runtuhnya Rezim [CHI.GetLeader] dan kemunduran mereka yang pengecut ke barat, kami berdiri sebagai negara Tiongkok yang sah. Untuk mengonfirmasi hal ini, [ROOT.GetLeader] telah mengunjungi makam Sun Yat-Sen dan menyatakan bahwa ia akan menjunjung tinggi prinsip-prinsip republik yang pernah ia dirikan."
  CHI_tsr_military_industrial_collaboration: "Kolaborasi Militer"
  CHI_tsr_military_industrial_collaboration_desc: "Tentara kita kekurangan staf dan perlengkapan, dan sebagian besar beroperasi hanya dengan peralatan rampasan. Kita harus berusaha memperbaiki kesalahan ini dengan bekerja sama dengan Jepang dan membangun persenjataan kita sendiri."
  CHI_tsr_industrial_expansion_cooperation: "Ekspansi Industri"
  CHI_tsr_industrial_expansion_cooperation_desc: "Tanpa industri dan sumber daya yang mendukungnya, Tiongkok tidak akan pernah sejahtera sebagai sebuah bangsa. Kita harus berusaha meningkatkan kemampuan industri kita jika ingin melawan Barat."
  CHI_tsr_expand_the_nanjing_army: "Perluas Tentara Nanjing"
  CHI_tsr_expand_the_nanjing_army_desc: "Kita bisa berharap tidak lebih dari sepersepuluh kekuatan nominal kita akan loyal kepada kita, sehingga dalam menghadapi hal tersebut kita harus berusaha menciptakan kekuatan yang benar-benar setia, dipandu oleh pemimpin besar kita."
  CHI_tsr_promote_tridemism: "Merangkul Tridemisme"
  CHI_tsr_promote_tridemism_desc: "Tiga Prinsip Rakyat yang digariskan Sun Yat-Sen adalah Nasionalisme, Demokrasi, dan Penghidupan Rakyat. Kita harus berusaha untuk melanjutkan warisannya sambil mengadopsi prinsip-prinsip kita sendiri untuk lebih mewakili sifat negara kita."
  CHI_tsr_peace: "Perdamaian"
  CHI_tsr_peace_desc: "Kita harus mengupayakan perdamaian dengan cara apa pun, meskipun itu berarti mengkhianati prinsip ini dalam jangka pendek. Kita harus mengalahkan siapa pun yang menghalangi kemakmuran Tiongkok."
  CHI_tsr_anti_communism: "Anti-Komunisme"
  CHI_tsr_anti_communism_desc: "Komunisme adalah momok bagi bangsa kita dan para gerilyawan merupakan penyakit yang merugikan pemerintahan kita. Kita harus melawan ideologi ini dan mengakhirinya, meskipun itu berarti mengorbankan nyawa kita demi tujuan tersebut."
  CHI_tsr_national_construction: "Konstruksi Nasional"
  CHI_tsr_national_construction_desc: "Tiongkok tidak akan pernah benar-benar makmur jika kita tidak melihat gelombang baru ekspansi industri. Tanpa tulang punggung yang mendukungnya, kita tidak akan pernah bisa menjadi bangsa seperti yang diharapkan oleh Tiongkok."
  CHI_tsr_pan_asianism: "Pan-Asianisme"
  CHI_tsr_pan_asianism_desc: "Wajar jika kita mengadopsi cita-cita pan-Asianisme karena kita adalah saudara Jepang dan Sun Yat-Sen pernah menetapkan bahwa negara-negara Asia harus bersatu untuk mengusir penjajah. Perang ini bukan hanya perjuangan di Tiongkok, namun perang yang lebih besar yang bertujuan untuk mengusir orang-orang barat dari negara kita."
  CHI_tsr_establish_the_tewu: "Mendirikan Tewu"
  CHI_tsr_establish_the_tewu_desc: "Kita tidak boleh hanya bergantung pada dinas rahasia Jepang untuk mencari para pembangkang, jadi kita juga harus menciptakan dinas rahasia kita sendiri. Dengan bantuan para penasihat Jepang, kita tidak hanya bisa melatih mata-mata kita sendiri, tapi dalam waktu dekat kita akan bisa memiliki lembaga sendiri."
  CHI_tsr_embrace_japanese_cultural_institutions: "Menerima Institusi Kebudayaan Jepang"
  CHI_tsr_embrace_japanese_cultural_institutions_desc: "Untuk mencapai kerjasama yang lebih baik dengan Jepang dengan tujuan menyatukan Asia melawan penjajah asing, kita harus membentuk budaya yang bersatu, merangkul bagian dari budaya Jepang untuk mendekatkan kita satu sama lain."
  CHI_tsr_embrace_japanese_cultural_institutions_tt: "Membuka keputusan untuk meningkatkan §Y$RNG_state_shintoism_dm$§! Semangat Nasional"
  CHI_tsr_a_new_chinese_identity: "Identitas Tiongkok Baru"
  CHI_tsr_a_new_chinese_identity_desc: "Dengan nasib Tiongkok yang kini berada di tangan kita, kita harus berusaha memperkuat posisi kita dan membuktikan bahwa kita adalah mitra yang layak dan Republik Tiongkok sejati yang diimpikan Sun Yat-Sen."
  CHI_tsr_our_place_in_the_sphere: "Peran Kami di Bidang Ini"
  CHI_tsr_our_place_in_the_sphere_desc: "Setelah menjadi mitra sejati Jepang dan bukan sekadar mitra Jepang, kita harus berupaya menemukan tempat kita dalam Lingkungan Kemakmuran Bersama dan Asia Timur Raya secara keseluruhan. Tiongkok akan menjadi kekuatan global sekali lagi!"
  CHI_tsr_deepen_our_collaboration: "Memperdalam Kolaborasi kami"
  CHI_tsr_deepen_our_collaboration_desc: "Di bawah bimbingan Kekaisaran Jepang kami telah mencapai keberhasilan besar melawan penjajah kami. Kita harus berupaya memperdalam kerja sama dengan mereka untuk memastikan tujuan kita mewujudkan Asia yang bersatu."
 YUN_rally_around_long_yun: "Berkumpul di Sekitar Long Yun"
 YUN_rally_around_long_yun_desc: "Meskipun wilayah utara diperintah oleh diktator radikal yang mengejar ideologi mereka dengan cara apa pun, wilayah kami stabil dan dianggap oleh warga negara kami sebagai benteng demokrasi karena pertumbuhan ekonomi dan reformasi sosial, pendidikan dan politik. Untuk mencapai tujuan tersebut, kita harus mendukung arsitek keajaiban ini, Long Yun!"
 YUN_expand_local_infrastructure: "Perluas Infrastruktur Lokal"
 YUN_expand_local_infrastructure_desc: "Agar provinsi kami dapat dilalui dengan baik, kami perlu berinvestasi pada infrastruktur yang dapat bertahan di daerah pegunungan seperti wilayah kami. Dengan cara ini lebih banyak barang juga dapat ditransfer antar kota kita."
 YUN_strive_for_self_sufficiency: "Berjuang untuk Kemandirian"
 YUN_strive_for_self_sufficiency_desc: "Untuk benar-benar menjaga demokrasi kita tetap berkembang, kita harus memastikan bahwa kita tidak terlalu bergantung pada bantuan para ideolog utara, dan dapat mempertahankan diri kita sendiri di tahun-tahun mendatang."
 YUN_a_land_of_mountains: "Negeri Pegunungan"
 YUN_a_land_of_mountains_desc: "Yunnan adalah negeri pegunungan, dan masyarakat kami telah lama belajar dan beradaptasi untuk hidup dan berjuang di wilayah yang keras seperti itu. Ini pasti akan berguna bagi kita ketika waktunya tepat."
 YUN_political_reforms: "Reformasi Politik"
 YUN_political_reforms_desc: "Untuk menjalankan negara dengan lebih baik, kita harus memastikan proses politik kita bebas dari kemacetan dan korupsi, dan perekonomian kita bisa mendapatkan keuntungan dari para birokrat kita, dan bukan sebaliknya."
 YUN_eduational_reforms: "Mempromosikan Reformasi Pendidikan"
 YUN_eduational_reforms_desc: "Pengasuhan rakyat telah ditunda ke utara, tapi jika kita ingin impian Dokter Sun terwujud kita harus melanjutkannya, meski hanya di sini, di provinsi kita sendiri."
 YUN_the_democratic_fortress: "Benteng Demokrasi"
 YUN_the_democratic_fortress_desc: "Dengan semua reformasi yang telah kami lakukan, dapat dikatakan bahwa kami adalah benteng demokrasi di tengah kondisi politik yang keras di Tiongkok. Sekarang, kita bisa mulai melihat ke luar, dan melihat apakah kita bisa membawa pencerahan kita ke dalam pikiran baru yang segar."
 YUN_strengthen_burmic_ties: "Perkuat Ikatan Burma"
 YUN_strengthen_burmic_ties_desc: "Penduduk lokal kami memiliki banyak ikatan dengan Tiongkok dan Burma melalui populasi berbahasa Lolo-Burma. Sebagai putra seorang Tusi yang agung, Long Yun juga harus membawa demokrasi ke selatan, untuk membebaskan mereka dari belenggu kolonialisme."
