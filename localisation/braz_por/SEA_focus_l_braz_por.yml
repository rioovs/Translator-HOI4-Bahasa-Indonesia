 PRC_bolshevik_shortcut: "Politik: 28 ½ Bolshevik"
 PRC_mao_shortcut: "Politik: Mao"
 #TOOLTIPS
 PRC_winning_border_war_result_tt: "Dengan §Ymemenangkan§! §YPerang Perbatasan§!:"
 PRC_losing_border_war_result_tt: "Dengan §Ykalah§! dalam §YPerang Perbatasan§!, kita akan mendapatkan keuntungan:"
 PRC_has_been_infiltrated_tt: "Telah berhasil §YDisusupi§!"
 PRC_every_allied_warlord_tt: "Setiap §Ysekutu§! Panglima Perang Tiongkok:"
 PRC_this_might_anger_current_china_leader_tt: "Tindakan ini mungkin membuat marah §H[WTT_current_china_leader.GetNameDef]§!"
 PRC_SOV_more_willing_to_send_lend_lease_tt: "§Y[SOV.GetNameWithFlag]§! akan lebih bersedia mengirimkan Lend Lease"
 PRC_USA_more_willing_to_send_lend_lease_tt: "§Y[USA.GetNameWithFlag]§! akan lebih bersedia mengirimkan Lend Lease"
 PRC_unlock_complete_infiltration_tt: "Membuka Keputusan §Ytingkat 3 $PRC_infiltration_sea_cat$§!:"
 PRC_neighboring_SOV_tt: "§Y[ROOT.GetName]§! harus memiliki koneksi perbatasan langsung atau tidak langsung melalui §Yanggota faksi§!, dengan §Y[SOV.GetName]§!"
 PRC_request_territory_tt: "Meminta agar §Ynegara bagian inti dipindahkan§! ke dalam pengawasan kami jika negara bagian tersebut §Ytidak dimiliki§! oleh pengontrolnya saat ini atau jika pemiliknya adalah §Y[ROOT.GetRulingIdeology]§!.\nEfek saat ini:"
 PRC_said_no_to_cuf: "Front Persatuan Kedua yang Ditolak"
  #HISTORICAL
 PRC_put_an_end_to_the_sufan: "Akhiri Sufan"
 PRC_put_an_end_to_the_sufan_desc: "Ketika kami tiba di [622.GetName], pemimpin Komite Sentral Politbiro setempat Liu Zhidan dan para pemimpin lokal lainnya sedang dalam proses pembersihan dalam kampanye anti-kontra-revolusioner. $PRC_bo_gu$ akan ditugaskan untuk mengakhiri omong kosong ini."
 PRC_usurp_control_over_yanan: "Merebut Kendali atas Yan'an"
 PRC_usurp_control_over_yanan_desc: "[1032.GetName] di sebelah selatan kami mewakili langkah logis berikutnya dalam upaya kami untuk membangun kembali area dasar yang kokoh."
 PRC_usurp_control_over_yanan_tt: "Jika [ROOT.GetName] berada §Ydi faksi§! dengan §Y[CHI.GetName]§! dan negara lain mengontrol §Y[1032.GetName]§!, dan salah satu dari §Y[744.GetName]§! dan §Y[283.GetName]§!:"
 PRC_the_westward_expedition: "Ekspansi ke Barat"
 PRC_the_westward_expedition_desc: "[NXM.GetNameDefCap] ke arah barat merupakan peluang besar bagi kami untuk melakukan ekspansi. Jika kami mengadakan pertempuran kecil di sepanjang perbatasan [1045.GetName], kami mungkin dapat memanfaatkan kurangnya perhatian mereka terhadap kami."
 PRC_the_eastward_expedition: "Ekspedisi ke Timur"
 PRC_the_eastward_expedition_desc: "Di sebelah timur kami [SHX.GetLeader] menguasai [615.GetName], tapi kami mungkin bisa menembus pertahanan mereka di seberang Sungai Kuning."
 PRC_develop_yanan_soviet: "Kembangkan Soviet Yan'an"
 PRC_develop_yanan_soviet_desc: "Kami kini telah berhasil menguasai [1032.GetName], yang merupakan peluang bagi kami untuk memperluas wilayah basis kami. Kami sekarang akan menjadikan [1032.GetName] sebagai pusat pemerintahan kami."
 PRC_the_internal_enemy: "Musuh Internal"
 PRC_the_internal_enemy_desc: "Perjuangan melawan [CHI.GetLeader] dan pemerintah [CHI.GetRulingParty] telah berlangsung selama satu dekade. Kita ingat aksi pembersihan yang terjadi pada 12 April 1927, dan kita harus memastikan bahwa penghinaan seperti itu tidak akan terulang lagi."
 PRC_know_the_enemy: "Kenali Musuh"
 PRC_know_the_enemy_desc: "Saat ini negara tetangga kita mungkin bersahabat, namun kita harus mengambil tindakan pencegahan untuk memeriksa pertahanan mereka jika situasi berubah."
 PRC_unlock_border_defense_raids_tt: "Membuka §Y$raid_type_PRC_probe_border_defenses_raid$§! Serangan terhadap §Y$STATE_615$§! dan §Y$STATE_1045$§!"
 PRC_cooperate_ulanhu: "Bekerja sama dengan Ulanhu"
 PRC_cooperate_ulanhu_desc: "Yun Ze, atau Ulanhu, adalah pejuang Komunis yang berkomitmen dari Mongolia, yang saat ini mengorganisir wilayah utara basis kami. Dia telah menawarkan untuk mengerahkan pasukannya untuk bergabung dengan kami di [ROOT.capital.GetName] untuk bertarung di sisi kami."
 PRC_know_the_enemy_tt: "Dengan §Y$PRC_the_westward_expedition$§!, §Y$PRC_the_eastward_expedition$§!, dan §Y$PRC_usurp_control_over_yanan$§! telah selesai:"
 PRC_burn_the_paper_tigers: "Bakar Macan Kertas"
 PRC_burn_the_paper_tigers_desc: "Kami akan menghubungi [CHI.GetName] dan semua pihak lainnya untuk mengupayakan pembentukan Front Persatuan Kedua melawan musuh bersama."
 PRC_rally_the_peasants: "Kumpulkan Para Petani"
 PRC_rally_the_peasants_desc: "Kaum tani merupakan basis kekuatan utama kami, karena kesalahan pengelolaan [CHI.GetNameDef]. Mereka mendapatkan banyak keuntungan dari janji reformasi yang kita lakukan."
 PRC_rally_the_28_bolsheviks: "Kumpulkan 28 ½ Bolshevik"
 PRC_rally_the_28_bolsheviks_desc: "Pengetahuan luas yang dimiliki oleh 28 ½ anggota Bolshevik – yang dilatih di Uni Soviet sebagai pemimpin pemerintahan dan tentara – harus dimanfaatkan sepenuhnya di masa-masa sulit ini."
 PRC_guide_central_committee: "Bimbing Komite Sentral"
 PRC_guide_central_committee_desc: "Kita harus menetapkan arah yang jelas bagi Komite Sentral. Jika kita tidak bisa menjaga persatuan partai kita, kita juga tidak akan pernah bisa berharap untuk menyatukan Tiongkok."
 PRC_leadership_of_mao: "Kepemimpinan $PRC_mao_zedong$"
 PRC_leadership_of_mao_desc: "Mao telah menunjukkan keberaniannya dalam Long March, dan dia menjadi lebih berpengaruh berkat keahliannya mungkin bukan hal yang buruk. Lagi pula, jika kita tidak ingin terkekang oleh batasan kita saat ini, kita memerlukan kepemimpinan yang kuat."
 PRC_expel_the_occupiers: "Usir Penjajah"
 PRC_expel_the_occupiers_desc: "Kapan pun kita mempunyai kekuatan untuk melakukannya, kita harus mengusir pasukan asing dari Tiongkok, karena jika tidak, mereka tidak akan berhenti melemahkan kita demi keuntungan mereka sendiri."
 PRC_restore_territorial_integrity: "Memulihkan Integritas Wilayah"
 PRC_restore_territorial_integrity_desc: "Kami akan meminta mereka yang setia pada tujuan kami untuk melakukan pengalihan tanah secara sederhana."
 PRC_seek_support_from_ussr: "Cari Dukungan dari [SOU.GetNameDef]"
 PRC_seek_support_from_ussr_desc: "Sekutu lama kami, [SOU.GetNameDef], telah memberikan bantuan penting bagi revolusi kami. Namun agar revolusi berhasil, kita harus meminta mereka untuk lebih meningkatkan bantuan ini. Bagaimanapun, keberhasilan revolusi kita akan memungkinkan mereka memfokuskan upaya mereka pada bidang lain."
 PRC_request_guarantees: "Minta Jaminan Teritorial"
 PRC_request_guarantees_desc: "Jalur baru kami, yang terinspirasi oleh Uni Soviet, akan mendapat manfaat besar dari perlindungan mereka. Memberikan jaminan keamanan bukannya tanpa risiko bagi mereka, namun pentingnya hal ini dalam menghalangi calon musuh menjadikan hal ini bermanfaat."
 PRC_request_guarantees_tt: "§R[SOV.GetNameDefCap] mungkin meminta kami untuk menjadi subjek sebagai imbalan atas jaminan...§!"
 PRC_on_guerilla_warfare: "Tentang Perang Gerilya"
 PRC_on_guerilla_warfare_desc: "Sebagai ahli teori dan penulis perang gerilya, Mao dan kekuasaan barunya akan memastikan penggunaan kekuatan kecil dan independen yang tepat."
 PRC_dissent_in_the_united_front: "[GetDissentFocusName]"
 PRC_dissent_in_the_united_front_default: "Menabur Perbedaan Pendapat di Front Persatuan"
 PRC_dissent_in_the_united_front_alt: "Menabur Perbedaan Pendapat di [ROOT.GetFactionName]"
 PRC_dissent_in_the_united_front_desc: "Bahkan saat kita berjuang bersama sekutu kita, kita harus menonjolkan keunggulan ideologi kita sendiri. Dengan melakukan hal ini, kita bisa mendapatkan pendukung, bahkan mungkin di antara tokoh-tokoh yang memainkan peran penting di pihak lain dalam aliansi tersebut."
 PRC_dissent_in_the_united_front_1_tt: "Saat berada dalam §YFraksi§! dengan [CHI.GetNameWithFlag]:"
 PRC_halves_infiltration_cost_tt: "§GMembagi dua biaya§! untuk mengambil §Y$PRC_infiltration_sea_cat$§! Keputusan"
 PRC_establish_friendly_bases: "Membangun Pangkalan di Belakang Garis Musuh"
 PRC_establish_friendly_bases_desc: "Banyaknya warga sipil di wilayah pendudukan membuat penyusup tidak kesulitan berbaur saat mereka melakukan tindakan sabotase."
 PRC_establish_friendly_bases_1_tt: "Membuka Keputusan: §YMenetapkan Operasi Sabotase§!"
 PRC_establish_friendly_bases_2_tt: "§RNegara bagian yang diduduki musuh§! yang memiliki §Y$PRC_guerilla_cells_active_2$§! atau merupakan §Ykeadaan inti§! Subjek dengan Tuan asing kini bisa mendapatkan §Y$PRC_anti_japanese_base$§!"
 PRC_secure_the_peoples_support: "Dapatkan Dukungan Rakyat"
 PRC_secure_the_peoples_support_desc: "Meskipun kita tidak mempunyai kendali atas sebagian besar wilayah Tiongkok, kita harus memastikan kesetiaan rakyatnya terhadap tujuan kita jika perang saudara kembali terjadi."
 PRC_secure_the_peoples_support_tt: "Membuka semua §Y3 tingkatan§! dari §Y$PRC_infiltration_sea_cat$§! Keputusan."
 PRC_rural_recruitment: "Rekrutmen Pedesaan"
 PRC_rural_recruitment_desc: "Penghuni tidak pernah bisa berharap untuk memantau seluruh permukiman pedesaan, sehingga memungkinkan kami merekrut penduduk di sana dengan risiko minimal."
 PRC_rural_recruitment_tt: "Ketika §YMenyusup§! ke negara bagian §Ypedesaan§!, §Ypedesaan maju§! atau §Ypastoral§!, menerima §G[?PRC_rural_recruitment_manpower]§! Tenaga Kerja"
 PRC_raid_weapon_depots: "Depot Senjata Serangan"
 PRC_raid_weapon_depots_desc: "Upaya infiltrasi kami memungkinkan kami memetakan jaringan logistik musuh kami. Kita dapat memanfaatkan ini untuk menyerang jaringan ini, menggunakan peralatan yang ditangkap untuk mengerahkan lebih banyak agen."
 PRC_raid_weapon_depots_tt: "Membuka §Y$raid_type_PRC_weapons_depot_raid$§! di mana pun [ROOT.GetNameWithFlag] telah membentuk §YSel Gerilya§! atau §Y$PRC_anti_japanese_base$§! untuk mendapatkan §Y$infantry_equipment$§! dan §Y$artillery$§!"
 PRC_empower_the_guerillas: "Berdayakan Gerilyawan"
 PRC_empower_the_guerillas_desc: "Ketika pasukan gerilya kita memperoleh pengalaman, kita bisa mulai membiarkan mereka beroperasi secara mandiri. Hal ini akan memungkinkan pasukan untuk menyusup lebih jauh dan mencegah mereka dikompromikan jika kontak kita dengan mereka disadap."
 PRC_empower_the_guerillas_tt: "§GMembagi dua biaya§! untuk mengambil §Y$PRC_guerilla_warfare_sea_cat$§! Keputusan dan Membuka Keputusan untuk menggantikan §Y$PRC_guerilla_cells_active_1$§! dengan §Y$PRC_guerilla_cells_active_2$§!. Perubahan yang efektif:"
 PRC_holding_half_the_sky: "Memegang Separuh Langit"
 PRC_holding_half_the_sky_desc: "Posisi perempuan dalam masyarakat Tiongkok sudah lama tidak setara. Saat kita mengupayakan kesetaraan, kita juga harus mengubahnya. Seperti yang pernah dikatakan Mao, Perempuan memegang separuh dunia, dan kita harus membiarkan mereka berkontribusi pada revolusi."
 PRC_question_the_faction_leadership: "Mempertanyakan Pimpinan Fraksi"
 PRC_question_the_faction_leadership_desc: "Untuk mendapatkan pengaruh lebih jauh, kita harus menyoroti kesalahan yang dibuat oleh kepemimpinan aliansi kita, sekaligus menyoroti keberhasilan kita sendiri."
 PRC_to_unify_a_country: "Untuk Menyatukan Negara"
 PRC_to_unify_a_country_desc: "Dengan menguatnya posisi kita baik secara politik maupun militer di wilayah panglima perang lainnya, kita harus menuntut agar kita mendapatkan sumber daya dan pengakuan yang layak kita dapatkan."
 PRC_to_unify_a_country_tt: "Menyerahkan status apa pun yang telah berhasil §YDisusupi§! oleh §Y[ROOT.GetName]§!"
 PRC_strengthen_the_central_party_school: "Perkuat Sekolah Partai Pusat"
 PRC_strengthen_the_central_party_school_desc: "Melatih pejabat partai baru melalui Sekolah Partai Pusat berarti bahwa 28 ½ Bolshevik dan pendukungnya yang dilatih di Uni Soviet secara bertahap akan kalah jumlah dengan pejabat yang dilatih oleh sekolah ini."
 PRC_propaganda_efforts: "Upaya Propaganda"
 PRC_propaganda_efforts_desc: "Propaganda adalah bagian penting dalam merekrut pengikut untuk revolusi kita, serta menjaga kepercayaan diri para pengikut yang sudah direkrut. Propaganda kami bahkan dapat digunakan oleh sekutu kami ketika mereka mengerahkan penduduknya untuk membela Tiongkok."
 PRC_propaganda_efforts_1_tt: "Dapatkan §G[?PRC_gain_faction_inluence_number|%]§! §YPengaruh Fraksi§! untuk setiap §YPerang Gerilya§! Keputusan dan §YInfiltrasi§! [CHI.GetAdjective] Amerika"
 PRC_propaganda_efforts_2_tt: "Dapatkan §G[?PRC_gain_faction_inluence_number|%]§! §YPengaruh Fraksi§! untuk setiap Keputusan §YPerang Gerilya§!"
 PRC_establish_yanan_university: "Mendirikan Universitas Yan'an"
 PRC_establish_yanan_university_desc: "Jaringan sekolah terpisah untuk seni, ilmu pengetahuan dan pendidikan politik saat ini sangat tidak efisien. Dengan menggabungkan sekolah-sekolah ini, kami dapat mengajar dengan lebih efektif dan memperluas bidang pengetahuan siswa kami dengan mengajak mereka bertukar berbagai pengetahuan."
 PRC_peaceful_reunification: "Mengupayakan Reunifikasi Damai"
 PRC_peaceful_reunification_desc: "Kami adalah pemimpin sejati Tiongkok, dan fakta ini harus diakui selamanya. Kami akan berusaha meyakinkan [WTT_current_china_leader.GetNameDef] tentang fakta ini. Jika mereka menolak... yah... negara akan melihat siapa mereka sebenarnya."
 PRC_adopt_sun_yat_sens_principles: "Mengadopsi Prinsip Sun Yat-sen"
 PRC_adopt_sun_yat_sens_principles_desc: "Prinsip Sun Yat-sen: nasionalisme, demokrasi dan kesejahteraan, sama sekali tidak eksklusif dengan nilai-nilai komunis yang kita perjuangkan. Visinya yang pernah menstabilkan Tiongkok kini dapat diwujudkan lebih lanjut."
 PRC_establish_democratic_socialism: "Membangun Sosialisme Demokrat"
 PRC_establish_democratic_socialism_desc: "Pencapaian besar kita untuk Tiongkok mungkin akan diabadikan dalam buku sejarah, namun ketika masa-masa sulit kembali terjadi, pencapaian tersebut tidak akan berarti banyak. Oleh karena itu, rakyat harus merasa bahwa mereka dapat memimpin revolusi dan meminta pertanggungjawaban pemerintah atas pilihan mereka jika pemerintah gagal menjalankan tugasnya."
 PRC_form_central_social_affairs_department: "Bentuk Departemen Sosial Pusat"
 PRC_form_central_social_affairs_department_desc: "Penyesuaian tujuan revolusi kita pasti akan menimbulkan diskusi antara pendukung dan penentangnya. Namun wacana ideologis ini berisiko mengarah ke topik anti-revolusioner, sehingga kita harus membentuk badan intelijen untuk memantau dampak dari kubu Maoisme."
 PRC_reform_the_republic: "Reformasi Republik"
 PRC_reform_the_republic_desc: "Republik adalah ide yang bagus, namun dilaksanakan dengan buruk. Kami adalah pengikut sejati cita-cita Republik."
 PRC_asian_democratic_union: "Uni Demokratik Asia"
 PRC_asian_democratic_union_desc: "Untuk mendorong kesetaraan, kita harus bekerja sama dengan mitra-mitra kita di Asia untuk memastikan bahwa mereka mempunyai posisi negosiasi yang kuat di panggung dunia."
 PRC_asian_democratic_union_tt: "§Y$PRC_asian_democratic_union_modifier$§! meningkatkan §YKecepatan Penelitian§! sebesar §G+1,00%§! dan §YFaktor Pabrik Barang Konsumsi§! sebesar §Y-2,0%§! untuk setiap pabrik baru anggota fraksi, hingga Kecepatan Penelitian maksimum §G+10,0%§! dan Faktor Pabrik Barang Konsumsi §Y-20,0%§!"
 PRC_yanan_rectification_movement: "Gerakan Rektifikasi Yan'an"
 PRC_yanan_rectification_movement_tt: "Bergantung pada nilai saat ini di §Y$PRC_communist_power_struggle$§!, §Y$PRC_maoism_dynamic_modifier$§! akan mendapatkan pengubah yang berbeda.\nEfek Saat Ini:"
 PRC_yanan_rectification_movement_desc: "Keberhasilan rezim kita sejauh ini dapat dikaitkan dengan Mao, dan kita harus menggunakan prestise ini untuk memperkuat Maoisme di partai kita. Mengubah konstitusi partai untuk memasukkan ide-ide Mao, dan mengklaimnya sebagai bentuk komunisme pertama yang disesuaikan dengan kondisi spesifik Tiongkok, akan membuat perlawanan terhadap ide-ide ini menjadi lebih sulit."
 PRC_enforce_maoism: "Tegakkan Maoisme"
 PRC_enforce_maoism_desc: "Untuk lebih memperkuat posisi Maoisme, kita harus menghubungkan ideologi ini sepenuhnya dengan kepemimpinan negara dan partai, menjadikan Mao sebagai simbol seluruh bangsa."
 PRC_deepen_the_dixie_mission: "Memperdalam Kerjasama Misi Dixie"
 PRC_deepen_the_dixie_mission_desc: "Komitmen yang [USA.GetNameDef] tunjukkan dalam kerja samanya dengan [ROOT.GetNameDef] sangat mengagumkan. Mungkin mereka bersedia memperluas misi Dixie dengan para pakar [USA.GetAdjective] untuk memodernisasi industri kita."
 PRC_invite_the_dixie_mission: "Undang Misi Dixie"
 PRC_invite_the_dixie_mission_desc: "Sebagai kekuatan yang sedang berkembang di Asia, kita harus menyelidiki apakah [USA.GetNameDef] tertarik untuk menjalin hubungan diplomatik. Mungkin mereka, tidak seperti kekuatan imperialis di sekitar kita, bersedia membantu membangun Tiongkok yang dapat mempertahankan diri dari ancaman luar."
 PRC_overthrow_the_ussr: "Gulingkan Komunis Palsu"
 PRC_overthrow_the_ussr_desc: "Perbedaan ideologi antara kami dan negara komunis lainnya tidak semata-mata menjadi penyebab penyesuaian kami terhadap situasi di Tiongkok. Kebijakan reaksioner dan totaliter yang dilakukan negara-negara ini sudah keterlaluan, dan kita harus melakukan intervensi agar proletariat mereka bisa terbebas dari bentuk revolusi mereka yang kacau."
 PRC_overthrow_the_ussr_tt: "Mendapatkan tujuan perang §YAnnex§! melawan setiap negara besar Komunis. Efek saat ini:"
 PRC_two_soviets_together: "Dua Soviet, Bersama"
 PRC_two_soviets_together_desc: "Meskipun ideologi kami telah berubah, kami masih memiliki ikatan ideologis yang kuat dengan [SOV.GetNameDef], dan tentu saja tidak melupakan dukungan material dan politik mereka selama bertahun-tahun."
 PRC_tech_agreement_with_ussr: "Perjanjian tentang Teknologi Pertahanan Baru"
 PRC_tech_agreement_with_ussr_desc: "Kemajuan revolusi kami memungkinkan kami berkontribusi melalui penelitian untuk kemitraan kami dengan [SOV.GetNameDef]. Setelah kami mengetahui perkembangan teknologi mereka di berbagai bidang, kami dapat membagikan evaluasi kami terhadap peralatan mereka, bebas dari bias yang melekat pada pengembangannya."
 PRC_the_end_of_capitalism: "Akhir dari Kapitalisme"
 PRC_the_end_of_capitalism_desc: "Kerja sama erat kami dengan [SOV.GetNameDef] telah cukup memperkuat aliansi kami sehingga kini dapat menantang kekuatan kapitalis. Bersama-sama, kita bisa menyebarkan revolusi dan membebaskan tanah jajahan mereka."
 PRC_purge_the_world_of_fascism: "Bersihkan Dunia Fasisme"
 PRC_purge_the_world_of_fascism_desc: "Meski berjanji untuk menyimpang dari kapitalisme, kebencian kaum fasis terhadap komunisme cukup menjadi bukti bahwa ini hanyalah lelucon. Cara-cara radikal yang kita gunakan untuk membebaskan proletariat digunakan oleh kaum fasis untuk menekannya, dan kita harus melakukan intervensi terhadap hal ini."
 PRC_hundred_regiments_offensive: "Serangan Seratus Resimen"
 PRC_hundred_regiments_offensive_desc: "Perluasan tentara kita dan pengorganisasiannya menjadi banyak kontingen independen akan memungkinkan kita mendatangkan malapetaka pada jalur perbekalan musuh."
 PRC_prepare_for_the_inevitable: "Bersiaplah untuk Hal yang Tak Terelakkan"
 PRC_prepare_for_the_inevitable_desc: "Tawaran ekspansionis dari [JAP.GetNameDef], dan bahkan mungkin sekutu tradisional kita [SOV.GetNameDef] akan segera terjadi. Kita harus mengesampingkan kekhawatiran ideologis dan bersiap untuk membentuk front persatuan melawan ancaman dari luar."
 PRC_ask_for_soviet_lend_lease: "Minta Pinjam-Sewa Soviet"
 PRC_ask_for_soviet_lend_lease_desc: "$PRC_secure_lend_lease_from_soviet_desc$"
 #28 BOLSHEVIKS ALT-HISTORY
 PRC_reclaim_the_grasp_of_power: "Raih Kembali Genggaman Kekuasaan"
 PRC_reclaim_the_grasp_of_power_desc: "Kekuasaan yang beralih ke Mao akibat kepemimpinan militernya dalam Long March akhirnya kembali ke tangan para mantan pemimpin Partai. Dengan berakhirnya Long March, $PRC_wang_ming$ atau $PRC_bo_gu$ bersiap untuk kembali mengambil alih kepemimpinan."
 PRC_playing_both_sides: "Memainkan Kedua Sisi"
 PRC_playing_both_sides_desc: "Kita harus berupaya memastikan kesetiaan rakyat pada panglima perang dan negara-negara [CHI.GetAdjective], jika tiba waktunya untuk pertempuran yang menentukan demi masa depan negara kita."
 PRC_the_fight_of_a_people: "Perjuangan Rakyat"
 PRC_the_fight_of_a_people_desc: "Rakyat kita harus melawan gerak maju musuh-musuh kita, bahkan ketika mereka berada di wilayah yang mereka duduki. Kita harus mengirimkan unit-unit kecil untuk menggalang perlawanan lokal agar secara efektif melemahkan penjajah, dan pada akhirnya membebaskan tanah air."
 PRC_a_stronger_united_front: "Front Persatuan yang Lebih Kuat"
 PRC_a_stronger_united_front_desc: "Kita harus menunjukkan kepada [CHI.GetName] bahwa kita adalah sekutu yang dapat diandalkan sehingga mereka tidak merasa perlu menyimpan sumber daya sebagai cadangan jika kita memutuskan aliansi. Kami akan diizinkan lebih banyak terlibat dalam pengambilan keputusan."
 PRC_sino_allied_pact_of_non_aggression: "Pakta Non-Agresi Sino-Sekutu"
 PRC_sino_allied_pact_of_non_aggression_desc: "Saat kita menghilangkan pengaruh asing dari Tiongkok, kita harus memastikan bahwa negara-negara besar yang kurang ekspansionis tidak terlibat."
 PRC_sino_allied_pact_of_non_aggression_accept_tt: "Mereka akan menandatangani §YPakta Non-Agresi§! dengan §Y[ROOT.GetName]§!"
 PRC_with_inspiration_from_nkvd: "Dengan Inspirasi Dari NKVD"
 PRC_with_inspiration_from_nkvd_desc: "NKVD Soviet yang didengar oleh banyak pemimpin kita melalui koneksi mereka dengan pejabat Soviet harus menjadi contoh bagaimana melindungi diri dari musuh dari dalam."
 PRC_soviet_technological_cooperation: "Kerjasama Teknologi Soviet"
 PRC_soviet_technological_cooperation_desc: "Kami akan menantikan [SOV.GetNameDef] untuk perjanjian penelitian guna memajukan perjuangan kedua negara kita."
 PRC_reestablish_moscow_sun_yat_sen_university: "Membangun kembali Universitas Sun Yat-sen Moskow"
 PRC_reestablish_moscow_sun_yat_sen_university_desc: "Dengan membangun kembali dan meningkatkan pendanaan untuk Universitas Sun Yat-sen Moskow, kami dapat membantu membimbing dan memperbaiki bangsa dengan membina generasi sarjana masa depan yang sejalan dengan usia 28 setengah tahun sebelumnya."
 PRC_a_truly_united_front: "Front yang Benar-Benar Bersatu"
 PRC_a_truly_united_front_desc: "Kita perlu memperkuat korps diplomatik dan meningkatkan posisi Front Persatuan Kedua."
 PRC_a_truly_united_front_tt: "§GMembagi dua biaya§! untuk mengambil keputusan §Y$PRC_28_bolshevik_faction_cat$§!"
 PRC_part_of_the_comintern: "Bagian dari Komintern"
 PRC_part_of_the_comintern_desc: "Dengan kemajuan revolusi di dalam negeri, kita dapat fokus membantu Komintern mencapai tujuan internasionalnya."
 PRC_petition_for_freedom: "Petisi Kemerdekaan"
 PRC_petition_for_freedom_desc: "Kemerdekaan kita sudah terlalu lama berada di tangan pihak lain – inilah saatnya untuk mengubah hal ini, untuk selamanya."
 PRC_petition_for_freedom_not_subject_tt: "§YTidak berpengaruh jika bukan subjek§!"
 PRC_aggressive_pursuit_of_diplomacy: "Pengejaran Diplomasi yang Agresif"
 PRC_aggressive_pursuit_of_diplomacy_desc: "Meskipun kita ingin melakukan bentuk diplomasi yang lebih beradab, terkadang ancaman kekerasan adalah hal yang diperlukan agar keinginan kita bisa menang. Dan jika ancamannya tidak berhasil..."
 PRC_supreme_infiltration: "Infiltrasi Tertinggi"
 PRC_supreme_infiltration_desc: "Melalui pengalaman kami sebelumnya dalam menangani infiltrasi, kami telah mengambil pembelajaran yang kini dapat kami gunakan untuk memperluas operasi tersebut, sehingga membawa lebih banyak warga negara kami ke pihak kami."
 PRC_scholarly_revolution: "Revolusi Ilmiah"
 PRC_scholarly_revolution_desc: "Para pemimpin kita berasal dari kaum intelektual, dan kita harus membentuk masa depan [ROOT.GetAdjective] melalui lensa mereka."
 #COMMON END-FOCUSES
 PRC_towards_one_china: "Menuju Satu Tiongkok"
 PRC_towards_one_china_desc: "Negara-negara panglima perang terlalu banyak mengkompromikan stabilitas Tiongkok untuk tetap eksis sehingga kepemimpinan terpusat harus dibentuk."
 PRC_towards_one_china_bypass_tt: "§YSetiap Bangsa Tiongkok§!: Salah satu dari hal berikut harus benar:\nTidak ada\nSedang berperang dengan §Y[ROOT.GetNameWithFlag]§!\nMerupakan subjek dari §Y[ROOT.GetNameWithFlag]§!\nAda di sebuah faksi dengan §Y[ROOT.GetNameWithFlag]§!\n§Y[ROOT.GetName]§!: memiliki §Ytujuan perang§! melawan mereka."
 PRC_towards_one_china_tt: "Mendapatkan sasaran perang §YAnnex§! terhadap setiap negara Tiongkok yang bukan sekutu. Efek saat ini:"
 PRC_allow_autonomous_regions: "Izinkan Daerah Otonomi"
 PRC_allow_autonomous_regions_desc: "Tuntutan unik setiap wilayah di Tiongkok harus dipenuhi dengan memberikan otonomi pada tingkat tertentu."
 PRC_allow_autonomous_regions_tt: "\nSetiap §Ynegara sekutu Tiongkok§! dapat memilih untuk menjadi subjek §Y[ROOT.GetNameDef]§!. Efek saat ini:"
 PRC_the_peoples_republic: "Republik Rakyat"
 PRC_the_peoples_republic_desc: "Kini setelah revolusi telah kokoh, kita dapat mulai melakukan transisi dari negara revolusioner menuju negara yang dapat memberikan stabilitas dan kesejahteraan kepada warganya melalui reformasi."
 PRC_remove_iniltration_and_guerilla_decisions_tt: "§RHapus§! §Y$PRC_infiltration_sea_cat$§! dan §Y$PRC_guerilla_warfare_sea_cat$§! Keputusan"
 PRC_taiwan: "Amankan Taiwan"
 PRC_taiwan_desc: "Jatuhnya Taiwan ke tangan Jepang oleh pemerintahan Qing sebelumnya harus diatasi, meskipun kebutuhan akan dukungan udara atau laut merupakan tantangan yang unik."
 PRC_reclaim_tibet: "Rebut kembali Tibet"
 PRC_reclaim_tibet_desc: "Ketidakstabilan di Tiongkok memungkinkan [TIB.GetNameDef] melepaskan diri dari kekuasaan Tiongkok, namun hubungan historis antara negara kita tidak dapat diabaikan. Kita harus berusaha untuk bersatu kembali dengan mereka sehingga perbatasan kita dapat kembali mencapai Himalaya."
 PRC_subjugate_korea: "Taklukkan Korea"
 PRC_subjugate_korea_desc: "Pendudukan Korea oleh [JAP.GetNameDef] dan ekspansi mereka selanjutnya ke Manchuria menunjukkan bahwa Korea yang merupakan sekutu sangat penting bagi keselamatan [ROOT.GetAdjective]. Jika saat ini hal tersebut bukan merupakan pilihan, kita harus melakukan intervensi."
 PRC_dare_to_struggle: "Berani Berjuang..."
 PRC_dare_to_struggle_desc: "Dengan negara-negara panglima perang kini berada di pihak kita, inilah saatnya untuk melawan penjajah asing yang telah menjajah sebagian wilayah Tiongkok."
 PRC_dare_to_win: "... Berani Menang"
 PRC_dare_to_win_desc: "Ekspansi pendahulu imperialis [SOV.GetNameDef] ke wilayah Tiongkok telah dimaafkan demi terciptanya hubungan yang lebih baik, namun tidak dilupakan. Kita harus mencoba memulihkan perbatasan kita yang semula sekarang setelah kita mempunyai sarana untuk melakukannya."
 PRC_move_capital: "Pindahkan Ibukota"
 PRC_move_capital_desc: "Setelah terbentuknya $PRC_proclaimed_communism$, wajar saja jika kita memindahkan pusat pemerintahan dan mengembalikan nama kota tersebut menjadi Beijing."
 PRC_beijing_capital_name: "Beijing"
 beijing_winter_capital_name: "Khanbaliq"
 yuan_summer_capital_name: "Shangdu"
 PRC_education_reform: "Reformasi Pendidikan"
 PRC_education_reform_desc: "Kami akan mengambil langkah-langkah untuk memungkinkan reformasi pendidikan nasional yang cepat yang bertujuan untuk mengadopsi pendidikan tinggi gaya Soviet, dengan fokus pada pendidikan teknik dan teknis."
 PRC_the_first_premier: "Perdana Menteri Pertama"
 PRC_the_first_premier_desc: "$PRC_zhou_enlai$ akan ditunjuk sebagai Perdana Menteri pertama $PRC_proclaimed_communism$, sehingga mengukuhkan posisinya sebagai salah satu politisi terkemuka di Partai tersebut."
 PRC_the_party_builds_the_nation: "Partai Membangun Bangsa"
 PRC_the_party_builds_the_nation_desc: "Kini setelah kita menguasai sebagian besar wilayah Tiongkok, inilah saatnya kita memulai kampanye nasional untuk memanfaatkan populasi dan industri yang sedang berkembang."
 PRC_the_chinese_century: "Abad Tiongkok"
 PRC_the_chinese_century_desc: "Pertumbuhan ekonomi yang dipadukan dengan kekuatan politik yang cukup untuk membentuk dunia adalah hal yang selama ini dirindukan dan diterima oleh negara ini. Kebangkitan Tiongkok dimulai sekarang - ini adalah abad kita."
 #UNWILLING DIARCHY ALT-HISTORY
 PRC_the_unwilling_diarchy_focus: "Diarki yang Tidak Diinginkan"
 PRC_the_unwilling_diarchy_focus_desc: "Masa-masa sulit memerlukan tindakan yang mendesak – kita harus mengganti Organ-organ Partai yang ada untuk memastikan bahwa kepemimpinan baru mempunyai lembaga yang dapat bertindak cepat melawan musuh Rakyat.\n\nMao dan Guotao harus mengesampingkan perbedaan mereka dan bekerja sama."
 PRC_the_unwilling_diarchy_focus_tt: "Anda tidak akan dapat membentuk atau bergabung dengan §YFront Persatuan Kedua§!"
 PRC_the_response_to_a_threat: "Respon terhadap Ancaman"
 PRC_the_response_to_a_threat_desc: "Kami akan melakukan apa yang perlu dilakukan untuk menanggapi semua ancaman di sekitar kami. Kita harus bersiap menghadapi serangan itu."
 PRC_promote_regular_army: "Promosikan Tentara Reguler"
 PRC_promote_regular_army_desc: "Hanya melalui cara konvensional kita dapat memastikan bahwa Tentara Merah mampu mempertahankan, dan memperluas, wilayah [ROOT.GetNameDef]."
 PRC_strict_training_regiments: "Regimen Pelatihan Yang Ketat"
 PRC_strict_training_regiments_desc: "Kita harus memperketat disiplin Tentara Merah.\n\nRutinitas pelatihan pagi setiap hari akan menghasilkan tentara profesional dalam waktu singkat, dan meningkatkan kualitas rekrutan yang mencapai unit lini."
 PRC_army_reforms: "Reformasi Angkatan Darat"
 PRC_army_reforms_desc: "Tentara Merah sudah ketinggalan zaman dan didasarkan pada doktrin lama yang tidak lagi berlaku setelah Long March. Kita harus membangun kembali angkatan bersenjata dari awal.\n\nSerangkaian reformasi baru yang dilakukan [ROOT.GetLeader] bersama dengan para jenderal terkemuka akan menghasilkan Tentara Merah baru yang lebih kuat."
 PRC_centralized_army_command: "Komando Angkatan Darat Terpusat"
 PRC_centralized_army_command_desc: "Perintah yang terdesentralisasi tidak akan memberikan manfaat yang baik bagi kita. Semua informasi harus mengalir melalui struktur komando baru untuk meningkatkan perencanaan operasional yang tepat dari tingkat atas hingga rekrutmen paling rendah."
 PRC_soviet_battle_tactics: "Taktik Pertempuran Soviet"
 PRC_soviet_battle_tactics_desc: "Dengan meniru taktik [SOV.GetNameDef], kami dapat menggunakan kekuatan kami sendiri yang sebanding dalam hal jumlah demi keuntungan kami. Kami akan memiliki tim petugas yang ditugaskan untuk mengambil pelajaran dari pengalaman [SOV.GetNameDef]."
 PRC_promote_guerilla_warfare: "Promosikan Perang Gerilya"
 PRC_promote_guerilla_warfare_desc: "Tentara Merah tidak bisa berharap untuk menandingi kekuatan musuh-musuh kita – setidaknya saat ini.\n\nKita harus mengerahkan kekuatan kita dan bertarung di belakang garis musuh, sebelum segera menghilang untuk menyerang lagi."
 PRC_the_battle_behind_the_front_lines: "Pertempuran di Balik Garis Musuh"
 PRC_the_battle_behind_the_front_lines_desc: "Kita harus melipatgandakan upaya kita untuk menyerang agresor asing di belakang mereka. Dengan menghambat pasokan dan kemampuan mereka untuk memperkuat garis depan, kita memaksa musuh mengeluarkan tenaga yang berharga untuk melindungi bagian belakang mereka."
 PRC_gain_the_peoples_trust: "Dapatkan Kepercayaan Rakyat"
 PRC_gain_the_peoples_trust_desc: "Kami akan menyusup ke pedesaan sekitar, menyuap dan mengancam individu terkait untuk menjamin kesetiaan masyarakat di wilayah yang saat ini tidak kami kendalikan. Kami akan membutuhkan dukungan mereka dalam beberapa hari mendatang..."
 PRC_limited_infiltration_efforts: "Upaya Infiltrasi Terbatas"
 PRC_limited_infiltration_efforts_desc: "Kita harus melakukan apa yang kita bisa untuk menyatukan Tiongkok, dengan cara apa pun yang diperlukan. Rakyat Tiongkok harus disadarkan bahwa kita tidak melupakan mereka, dan memberikan dukungan materiil dan immateriil kepada mereka bila saatnya tiba ketika dibutuhkan."
 PRC_secure_the_lands: "Amankan Tanah"
 PRC_secure_the_lands_desc: "Kita semakin dekat dengan pemenuhan tujuan kita - kita tidak perlu ragu sekarang. Kita perlu mengeluarkan lebih banyak sumber daya untuk meyakinkan masyarakat yang berada di bawah kendali pemerintah palsu mengenai keadilan tujuan kita."
 PRC_launch_sabotage_campaigns: "Luncurkan Kampanye Sabotase"
 PRC_launch_sabotage_campaigns_desc: "Operasi sabotase terhadap agresor akan membantu perjuangan Tentara Merah dan menghambat kemajuan musuh."
 PRC_raiding_parties: "Pihak Penyerang"
 PRC_raiding_parties_desc: "Kekurangan kekuatan industri kita – dibandingkan dengan musuh – kita ganti dengan kecerdikan. Mengirimkan pasukan penyerang tidak hanya akan membantu menstabilkan situasi peralatan kita, tetapi juga akan memperburuk situasi mereka."
 PRC_mobilization_of_the_people: "Mobilisasi Rakyat"
 PRC_mobilization_of_the_people_desc: "Di saat krisis, masyarakat akan bangkit.\n\nKami akan membentuk unit milisi yang dipimpin oleh para veteran Long March, dan merekrut serta mempersenjatai penduduk setempat."
 PRC_mobilization_of_the_people_tt: "Bentuk §Y4 unit milisi Tiongkok§!"
 PRC_mao_zedong_ascends: "$PRC_mao_zedong$ Naik"
 PRC_mao_zedong_ascends_desc: "$PRC_mao_zedong$ berdiri sendiri sebagai pemimpin sejati [ROOT.GetNameDef].\n\n$PRC_zhang_guotao$ tidak bisa lagi berada di level yang sama dengan Ketua Mao, hanya ada satu pemimpin."
 PRC_promote_womens_suffrage: "Mempromosikan Hak Pilih Perempuan"
 PRC_promote_womens_suffrage_desc: "'Wanita mengangkat separuh langit'. Kesetaraan gender yang sejati adalah tujuan Partai, dan kita harus mengambil langkah-langkah untuk memastikan partisipasi perempuan di bidang hukum, politik, sosial dan ekonomi di seluruh Tiongkok."
 PRC_zhang_guotao_ascends: "$PRC_zhang_guotao$ Naik"
 PRC_zhang_guotao_ascends_desc: "$PRC_zhang_guotao$ berdiri sendiri sebagai pemimpin sejati [ROOT.GetNameDef].\n\n$PRC_mao_zedong$ tidak bisa lagi berada di level yang sama dengan Ketua Guotao, hanya ada satu pemimpin."
 PRC_consolidate_politcal_power: "Konsolidasikan Kekuatan Politik"
 PRC_consolidate_politcal_power_desc: "Kini hanya ada satu pemimpin yang memegang kendali tertinggi, dan penting bagi kita untuk mengkonsolidasikan hal ini di seluruh struktur Partai. Para pembangkang tidak boleh diizinkan."
 PRC_consolidate_politcal_power_tt: "Memindahkan §Y$PRC_communist_power_struggle$§! menuju sisi terdepan. Efek saat ini:"
 PRC_secure_lend_lease_from_soviet: "Pinjam-Sewa Aman dari [SOV.GetNameDef]"
 PRC_secure_lend_lease_from_soviet_desc: "Upaya sebelumnya untuk menjalin hubungan darat dengan [SOV.GetNameDef] gagal total. Namun kini setelah kita mengatasi hal ini, akan lebih mudah menerima pasokan dari mereka."
 PRC_preemptive_strike: "Serangan Preemptif"
 PRC_preemptive_strike_desc: "Pasca pemberontakan tahun 1927 di Nanchang menunjukkan betapa efektifnya kekuatan nasionalis. Untuk mencegah Long March terulang lagi, kita harus menyerang terlebih dahulu, melakukan pengepungan sendiri dan memanfaatkan posisi kita yang lebih menguntungkan."
 PRC_an_end_to_the_japanese_threat: "Berakhirnya Ancaman [JAP.GetAdjective]"
 PRC_an_end_to_the_japanese_threat_desc: "Kehadiran [JAP.GetAdjective] di depan pintu kami selalu menimbulkan ancaman, karena ambisi imperialis mereka tidak menunjukkan batas. Dengan menyerang lebih dulu, kita mungkin bisa membuat mereka lengah."
 PRC_assume_leadership: "Asumsikan Kepemimpinan"
 PRC_assume_leadership_desc: "[GetAssumeLeaderShipText]"
 PRC_assume_leadership_tt: "Bergantung pada nilai saat ini di §Y$PRC_communist_power_struggle$§!, §Y[ROOT.GetLeader]§! akan mendapatkan sifat yang berbeda.\nEfek Saat Ini:"
 PRC_GetAssumeLeaderShipText_Wentian: "Posisi Ketua baru kita tidak perlu dipertanyakan lagi. Kita harus maju sebagai Partai dan bangsa."
 PRC_GetAssumeLeaderShipText_NotWentian: "Posisi Ketua baru kita tidak perlu dipertanyakan lagi. Mantan Ketua $PRC_zhang_wentian$ telah memainkan perannya dalam menstabilkan Partai, namun sekarang adalah waktunya [ROOT.GetLeader]."
 PRC_emergency_supply_protocols: "Protokol Pasokan Darurat"
 PRC_emergency_supply_protocols_desc: "Sistem pasokan kami tidak dapat dipertahankan. Kita harus mencurahkan seluruh upaya kita untuk memperbaikinya, jangan sampai pasukan kita dibiarkan tanpa senjata, amunisi, dan makanan."
 PRC_emergency_prodction_protocols: "Protokol Produksi Darurat"
 PRC_emergency_prodction_protocols_desc: "Untuk meningkatkan produksi pada masa perang, kita harus menetapkan kuota produksi untuk industri kita. Tindakan seperti itu berisiko mengasingkan pendukung kami, namun saat ini tidak ada alternatif lain."
 PRC_extend_emergency_measures: "Perluas Tindakan Darurat"
 PRC_extend_emergency_measures_desc: "Kita kini semakin dekat untuk menyelesaikan masalah-masalah paling kritis yang kita hadapi, namun kita harus memperluas upaya kita, kalau tidak maka masalah-masalah tersebut akan sia-sia."
 PRC_extend_emergency_measures_1_tt: "Setelah §Y$PRC_emergency_supply_protocols$§! selesai, §Ytambahkan durasi selama [?PRC_emergency_protocol_idea_days] hari§!, atau:"
 PRC_extend_emergency_measures_2_tt: "Setelah §Y$PRC_emergency_prodction_protocols$§! selesai, §Ytambahkan durasi selama [?PRC_emergency_protocol_idea_days] hari§!, atau:"
 PRC_to_support_the_army: "Untuk Mendukung Angkatan Darat"
 PRC_to_support_the_army_desc: "Kami akan melakukan apa yang harus kami lakukan untuk memperluas tindakan yang telah diambil, menjadikan perubahan ini permanen. Angkatan Darat harus mempunyai apa yang dibutuhkannya untuk memimpin Revolusi."
 PRC_to_support_the_army_1_tt: "Setelah §Y$PRC_emergency_supply_protocols$§! selesai:"
 PRC_to_support_the_army_2_tt: "Setelah §Y$PRC_emergency_prodction_protocols$§! selesai:"
 PRC_reach_out_to_the_west: "Jangkau Barat"
 PRC_reach_out_to_the_west_desc: "Meskipun negara-negara Barat berulang kali melakukan tindakan menentang kedaulatan [ROOT.GetAdjective] di masa lalu, Barat memiliki banyak sumber daya untuk ditawarkan yang dapat membantu mengembangkan [ROOT.GetNameDef] menjadi kekuatan dunia."
 PRC_reach_out_to_the_west_tt: "Jika negara non-fasis, §YNegara Besar Barat§! berperang melawan musuh bersama dan tidak ada sekutu yang saling berperang:"
 PRC_closer_ties_to_sov: "Hubungan Lebih Dekat dengan [SOV.GetName]"
 PRC_closer_ties_to_sov_desc: "Kita harus menjalin hubungan yang lebih dekat dengan [SOV.GetNameDef]. Ikatan Sino-Soviet kuat, namun harus diperkuat."
 PRC_demand_warlord_loyalty: "Menuntut Kesetiaan Para Panglima Perang"
 PRC_demand_warlord_loyalty_desc: "Kita harus menyatukan Tiongkok di bawah satu kepemimpinan - dan kita harus menjelaskan kepada semua orang siapa yang akan menjadi pemimpinnya.\n\nKami akan mengirimkan pesan kepada para Panglima Perang - sebuah tawaran untuk membentuk Pemerintahan Pertahanan Nasional. [CHI.GetLeader] mungkin tidak menyetujuinya, namun hal ini diperlukan."
 PRC_bring_war_to_neighboring_warlords: "Membawa Perang ke Panglima Perang di Sekitarnya"
 PRC_bring_war_to_neighboring_warlords_desc: "Hanya ada satu penguasa Tiongkok - langkah pertama untuk menyebarkan Revolusi adalah dengan menundukkan para Panglima Perang."
 PRC_bring_war_to_neighboring_warlords_tt: "Mendapatkan sasaran perang §YAnnex§! melawan semua §YPanglima Perang di dekatnya§!. Efek saat ini:"
 PRC_lessons_of_the_west: "Pelajaran dari Barat"
 PRC_lessons_of_the_west_desc: "Kita akan melihat ke luar negeri untuk melihat pelajaran apa yang bisa diambil dari negara-negara lain, belajar dari negara-negara yang industrinya telah mencapai batas yang belum dicapai oleh negara kita.\n\nKita harus mengejar ketinggalan."
 PRC_the_long_march_towards_progress: "Long March Menuju Kemajuan"
 PRC_the_long_march_towards_progress_desc: "Kita harus terus maju. Kita mungkin tertinggal dalam hal teknologi, namun kita tidak akan terus tertinggal. Sumber daya harus dikerahkan untuk memperkuat sektor pendidikan di [ROOT.GetNameDef]."
 PRC_every_peasant_a_soldier: "Setiap Petani adalah Prajurit"
 PRC_every_peasant_a_soldier_desc: "Setiap orang berbadan sehat yang bekerja keras di ladang juga harus siap mengangkat senjata bila negara memerlukannya.\n\n'Perang revolusioner adalah perang massa; hanya memobilisasi massa dan mengandalkan mereka yang bisa mencapai tujuan tersebut.'"
 PRC_every_peasant_a_soldier_1_tt: "Dengan §Y$PRC_promote_guerilla_warfare$§! Selesai:"
 PRC_every_peasant_a_soldier_2_tt: "Dengan §Y$PRC_promote_regular_army$§! Selesai:"
 PRC_avenge_the_century_of_humiliation: "Membalas Abad Penghinaan"
 PRC_avenge_the_century_of_humiliation_desc: "Tahun 1800-an merupakan abad penghinaan yang dilakukan oleh negara-negara Barat. Sudah saatnya utang dilunasi."
 PRC_avenge_the_century_of_humiliation_tt: "[ROOT.GetNameWithFlag] memperoleh §YTaklukkan (Fokus)§! sasaran perang melawan §YNegara Barat§! tetangganya atau rakyatnya. Efek saat ini:"
 PRC_the_march_to_victory: "Pawai Menuju Kemenangan"
 PRC_the_march_to_victory_desc: "Perjalanan Menuju Kemenangan tidak bisa dihindari. Apa yang awalnya merupakan Diarki yang Tidak Diinginkan telah mengarah pada terciptanya struktur partai yang kuat dan bersatu. Sekarang kita harus melihat ke luar, ke arah musuh-musuh internal kita."
 PRC_a_new_central_committee: "Komite Sentral Baru"
 PRC_a_new_central_committee_desc: "Sudah waktunya untuk perubahan. $PRC_zhang_guotao$ akan memerintahkan peninjauan skala penuh terhadap Komite Sentral dan membangunnya dari awal."
 PRC_a_new_central_committee_tt_1: "Selama §Y180 hari§!:"
 PRC_a_new_central_committee_tt_2: "Kemudian:"
 #COMMON BRANCHES
 PRC_expedite_land_revolution: "Mempercepat Revolusi Tanah"
 PRC_expedite_land_revolution_desc: "Redistribusi tanah dari tuan tanah ke petani telah menghancurkan struktur feodal di pedesaan. Massa pedesaan kini berdiri teguh di belakang revolusi."
 PRC_halt_land_revolution: "Hentikan Revolusi Tanah"
 PRC_halt_land_revolution_desc: "Untuk menjaga stabilitas, program pertanahan revolusioner telah ditunda. Ketika kaum tani menggerutu, elite lokal menjadi tenang, dan kohesi internal jangka pendek tetap terjaga."
 PRC_reestablish_the_state_bank: "Mendirikan kembali Bank Negara"
 PRC_reestablish_the_state_bank_desc: "Untuk mengelola perekonomian kita dengan baik, kita perlu membangun kembali bank sentral kita. Bank Nasional $PRC_communism$ didirikan di Tiongkok Tengah, namun Long March memaksanya untuk berhenti beroperasi. Peralatannya telah dalam perjalanan, dan kini mulai mencapai [ROOT.capital.GetCapitalVictoryPoint.GetName]."
 PRC_promote_the_silver_dollar: "Promosikan Koin Perak"
 PRC_promote_the_silver_dollar_desc: "Mengeluarkan koin tembaga dari peredaran dan digantikan dengan perak akan memungkinkan kita mendaur ulang logam lama untuk produksi amunisi. Nilai intrinsik koin kami juga berarti bahwa mitra dagang kami tidak perlu khawatir tentang kenaikan atau penurunan nilai mata uang kami, karena hal ini terkait dengan nilai perak."
 PRC_promote_paper_bills: "Promosikan Uang Kertas"
 PRC_promote_paper_bills_desc: "Uang kertas dengan biaya produksi yang murah dapat menjadi pengganti yang baik untuk koin tembaga, yang dapat didaur ulang di pabrik amunisi. Namun kelemahan utamanya adalah mitra dagang kami mungkin merasa gugup mengenai mata uang yang dapat dengan mudah kami ubah nilainya hanya dengan mencetak lebih banyak mata uang tersebut."
 PRC_new_currency_established: "Mengambil fokus ini akan mencegah dampak buruk dari §Y$PRC_equipment_from_copper_coins$§! jika belum terjadi."
 PRC_allow_special_goods_trade: "Izinkan Perdagangan Barang Khusus"
 PRC_allow_special_goods_trade_desc: "Perdagangan barang-barang khusus adalah sesuatu yang harus diakui dan dimanfaatkan oleh pemerintah, memastikan kontrol parsial dengan mengenakan pajak atas barang-barang tersebut."
 PRC_ban_special_goods_trade: "Melarang Perdagangan Barang Khusus"
 PRC_ban_special_goods_trade_desc: "Terlepas dari popularitas barang-barang khusus, kecanduan adalah masalah serius yang harus kita atasi dengan pelarangan. Sekalipun reformasi semacam itu pada awalnya tidak populer, hal ini penting dilakukan untuk menjaga agar barang-barang khusus tidak menjadi hambatan bagi revolusi, seperti yang pernah terjadi pada alkohol di [SOV.GetNameDef]."
 PRC_ban_special_goods_trade_tt: "§YSemangat Nasional§! yang ditingkatkan dan berlaku setelah satu tahun adalah:"
 PRC_agricultural_reform: "Reformasi Pertanian"
 PRC_agricultural_reform_desc: "Kini setelah kita yakin bahwa kita dapat mengendalikan sumber daya perekonomian, kita harus melanjutkan reformasi pertanian dengan memberikan tanah dari tuan tanah kepada petani miskin."
 PRC_agricultural_reform_tt: "Mengubah §Y$PRC_agrarian_society$§! menjadi §Y$PRC_agrarian_reform$§! yang memberikan:"
 PRC_eight_points_for_attention: "Delapan Poin untuk Perhatian"
 PRC_eight_points_for_attention_desc: "$PRC_eight_points_for_attention$, sebagaimana ditetapkan oleh $PRC_mao_zedong$ menyatakan pentingnya: Bersikap sopan saat berbicara, jujur saat membeli dan menjual, mengembalikan semua barang pinjaman, membayar ganti rugi atas segala sesuatu yang rusak, tidak memukul atau mengumpat orang lain, tidak merusak tanaman, tidak melecehkan perempuan, tidak menganiaya narapidana."
 PRC_CSCEC_mils: "Spesialisasi CSCEC - Industri Militer"
 PRC_CSCEC_mils_desc: "Kami akan mendesak CSCEC untuk mengkhususkan diri dalam konstruksi militer dan melakukan segala cara untuk mencapai tujuan tersebut. Kita perlu meningkatkan produksi militer kita agar mempunyai peluang di tahun-tahun mendatang."
 PRC_CSCEC_civs: "Spesialisasi CSCEC - Industri Sipil"
 PRC_CSCEC_civs_desc: "Kami akan mendesak CSCEC untuk mengkhususkan diri dalam konstruksi industri, karena di sinilah letak kekuatan CSCEC."
 PRC_industrialization_efforts: "Meluncurkan Upaya Industrialisasi"
 PRC_industrialization_efforts_desc: "Peningkatan hasil pertanian terkini memungkinkan sebagian masyarakat kami bekerja di industri lain. Kita harus memprioritaskan relokasi ke industri-industri yang memungkinkan pertumbuhan lebih lanjut, seperti produksi bahan bangunan atau peralatan pertanian."
 PRC_construct_the_banqiao_dam: "Membangun Bendungan Banqiao"
 PRC_construct_the_banqiao_dam_desc: "Sebuah bendungan di sungai Ru di [602.GetName] dapat menyediakan tenaga listrik untuk wilayah tersebut. Hal ini juga akan membantu mencegah banjir, yang sangat parah dalam beberapa dekade terakhir."
 PRC_resource_extraction_focus: "Ekstraksi Sumber Daya"
 PRC_resource_extraction_focus_desc: "Kita perlu memanfaatkan sumber daya alam di wilayah kita secara lebih komprehensif untuk meningkatkan pertumbuhan industri."
 PRC_connecting_the_country: "Menghubungkan Negara"
 PRC_connecting_the_country_desc: "Perluasan industri kita, dan meningkatnya kebutuhan untuk mendistribusikan barang-barang yang sebelumnya diproduksi oleh masyarakat yang swasembada namun kurang efisien, telah menjadikan infrastruktur menjadi semakin penting dibandingkan sebelumnya."
 PRC_establish_shorter_market_plans: "Tetapkan Rencana Pasar yang Lebih Singkat"
 PRC_establish_shorter_market_plans_desc: "Rencana jangka panjang yang drastis bagi perekonomian kita mungkin menjanjikan manfaat yang besar, namun dengan biaya dan risiko yang besar pula. Sebaliknya, kita harus fokus untuk memastikan bahwa industri yang kita miliki mempunyai kemampuan untuk bekerja secara optimal."
 PRC_initialize_five_year_plan: "Inisialisasi Rencana Lima Tahun Pertama"
 PRC_initialize_five_year_plan_desc: "Tujuan dari Rencana Lima Tahun Pertama adalah untuk meningkatkan produksi industri yang sudah kita miliki, sebelum menggunakan kelebihan produksi untuk membangun industri di sektor-sektor baru."
 PRC_urbanization: "Mempromosikan Urbanisasi"
 PRC_urbanization_desc: "Untuk mendorong pengembangan industri berat, kita harus mendorong para petani yang tadinya mandiri untuk bekerja di industri kita, sementara negara memastikan bahwa petani lain menghasilkan produksi yang cukup untuk didistribusikan ke kota dan pedesaan."
 PRC_rural_region_development: "Pembangunan Kawasan Pedesaan"
 PRC_rural_region_development_desc: "Untuk memfasilitasi peningkatan kualitas hidup di [ROOT.GetNameDef], produksi pangan harus ditingkatkan dengan berinvestasi pada modernisasi pertanian di daerah pedesaan."
 PRC_finalize_industrial_plan: "Menyelesaikan Rencana Industri"
 PRC_finalize_industrial_plan_desc: "Setelah rencana reformasi kami selesai, kami sekarang dapat menyelesaikan rencana industri kami dengan memastikan bahwa pusat penelitian dan fasilitas produksi baru bekerja sama semaksimal mungkin."
 PRC_great_production_movement: "Gerakan Produksi Hebat"
 PRC_great_production_movement_desc: "Kekurangan pangan di [ROOT.GetNameDef], yang diperburuk oleh serangkaian bencana alam, mendorong kami untuk mendorong perubahan pada komunitas yang sebelumnya bergantung pada pemerintah untuk mendapatkan pangan. Mereka telah berkelana ke lahan yang sebelumnya tidak produktif untuk mendirikan pertanian, dan upaya ini sekarang harus diimbangi oleh pasukan kita dalam berbagi pengalaman teknik mereka dengan rekan-rekan mereka."
 PRC_equipment_from_copper_coins: "Peralatan Dari Koin Tembaga"
 PRC_equipment_from_copper_coins_desc: "Karena kita tidak memiliki industri pertambangan yang besar, koin tembaga dapat dilebur dan digunakan untuk membuat peluru atau bahan lainnya."
 PRC_rally_the_industry: "Kumpulkan Industri"
 PRC_rally_the_industry_desc: "Relokasi kami telah membuat industri kami tidak terorganisir. Kita harus mengeksplorasi apa yang bisa kita peroleh dari alat produksi yang kita bawa pada Long March, dan mencoba menggunakan kembali sumber daya yang terlupakan dari basis awal kita."
 PRC_red_army_reborn: "Tentara Merah Terlahir Kembali"
 PRC_red_army_reborn_desc: "Basis baru kami di [622.GetName] harus diperkuat. Sebagian dari kerugian kami dapat dikompensasi dengan merekrut sukarelawan lokal, dan kami harus membuat rencana untuk melindungi rumah baru kami."
 PRC_asymmetric_warfare: "Perang Asimetris"
 PRC_asymmetric_warfare_desc: "Selama berabad-abad, pasukan yang kalah jumlah berupaya mengatasi rintangan yang mustahil dan kita juga harus melakukan hal yang sama, dengan memanfaatkan keunggulan yang tidak dimiliki musuh kita. Pengetahuan yang lebih baik mengenai medan, hubungan dengan warga sipil setempat, dan taktik gerilya semuanya dapat digunakan untuk meraih keunggulan."
 PRC_conventional_warfare: "Peperangan Konvensional"
 PRC_conventional_warfare_desc: "Meskipun berperang dalam perang gesekan yang berlarut-larut mempunyai kelebihan, hal ini bukannya tanpa kekurangan. Dengan membatasi diri terhadap serangan oportunistik, kita menjadi rentan terhadap serangan terhadap fasilitas produksi kita. Akan lebih sulit untuk meningkatkan semangat jika banyak kemenangan kecil, dan dengan menghindari pertempuran besar, kita dapat menunda konflik yang mungkin bisa berakhir lebih cepat."
 PRC_indirect_fire: "Kebakaran Tidak Langsung"
 PRC_indirect_fire_desc: "Kami akan fokus pada penciptaan kekuatan artileri yang lebih baik, dengan fokus memberikan tembakan tidak langsung ke musuh-musuh kami."
 PRC_three_rules_of_discipline: "Tanamkan Tiga Aturan Disiplin"
 PRC_three_rules_of_discipline_desc: "Seperti yang diresmikan Mao pada tahun 1920-an sebagai bagian dari strategi militernya, jika kita ingin mendapatkan lebih banyak dukungan dari masyarakat, sangatlah penting bahwa pasukan kita tidak menggunakan kekuatan mereka untuk mencuri properti. Dan jika kita ingin memanfaatkan sepenuhnya sumber daya kita yang terbatas, penting juga agar barang-barang yang diambil dari musuh diberikan kepada komando tinggi untuk didistribusikan."
 PRC_request_for_aid: "Permintaan Bantuan"
 PRC_request_for_aid_desc: "[SOV.GetNameDefCap] sejak awal berdirinya kami mendukung upaya kami dan juga menghindari keterlibatan langsung. Namun situasi dunia saat ini menuntut lebih dari sekedar dukungan, sehingga sebuah misi harus dikirim untuk meminta peralatan [SOV.GetAdjective] untuk membantu membangun pasukan kita."
 PRC_long_march_to_recovery: "Perjalanan Panjang Menuju Pemulihan"
 PRC_long_march_to_recovery_desc: "Long March ke [622.GetName] menyebabkan banyak korban jiwa di pihak tentara kita. Sudah saatnya kita menata kembali pasukan kita yang tersisa, dan menetapkan arah untuk mengembalikan kejayaan Tentara Merah Buruh dan Tani."
 PRC_best_of_the_best: "Terbaik dari Yang Terbaik"
 PRC_best_of_the_best_desc: "Angkatan bersenjata kita akan fokus pada penanaman kualitas dan profesionalisme tingkat tertinggi. Kita hanya boleh menerima rekrutan yang menunjukkan dedikasi terdalam terhadap perjuangan dan memiliki keterampilan yang sesuai."
 PRC_master_the_terrain: "Penguasa Medan"
 PRC_master_the_terrain_desc: "Berlatih bertarung di pegunungan dan membuat peta medan yang bagus akan memungkinkan kita mengepung musuh dan melarikan diri dengan selamat setelah menyerang."
 PRC_to_steal_an_army: "Untuk Mencuri Tentara"
 PRC_to_steal_an_army_desc: "Karena industri kita yang terbatas tidak dapat memenuhi kebutuhan tentara kita, maka menjadi sangat penting untuk menggunakan peralatan hasil rampasan jika memungkinkan. Hal ini mungkin menimbulkan tantangan logistik, namun dengan persiapan dan tindakan yang tepat seperti memastikan pasokan suku cadang, hal ini dapat diatasi."
 PRC_role_of_kangda: "Peran Kàngdà"
 PRC_role_of_kangda_desc: "Sekolah militer utama kami, [622.GetName] Sekolah Tentara Merah - juga dikenal sebagai Kàngdà - sebelumnya berfokus pada pelatihan. Sekarang akan menjadi pusat inovasi dengan peningkatan pendanaan, dengan fokus pada doktrin dan pengembangan peralatan, baik dalam maupun luar negeri."
 PRC_develop_the_army: "Kembangkan Angkatan Darat"
 PRC_develop_the_army_desc: "Dengan angkatan bersenjata yang telah kita bangun sejauh ini yang telah menunjukkan kemampuan terbaiknya, inilah saatnya kita menyediakan sarana untuk melakukan modernisasi."
 PRC_to_serve_the_people: "Untuk Melayani Rakyat"
 PRC_to_serve_the_people_desc: "Kita harus memastikan bahwa pasukan kita merasa bahwa kita bertujuan untuk memperjuangkan hal-hal yang merupakan kepentingan rakyat kita. Para prajurit harus tetap menghormati kewajibannya terhadap negara, begitu pula mereka yang tidak menjadi tentara."
 PRC_prepare_for_596: "Dalam Persiapan 596"
 PRC_prepare_for_596_desc: "Ancaman senjata nuklir tidak mungkin diatasi tanpa senjata kita sendiri. Oleh karena itu, pemerintah harus merekrut dan mendukung ilmuwan di bidang terkait sehingga mereka dapat mempersiapkan program nuklir."
  GER_unlock_national_nuclear_corporation_tt: "Membuka Kepedulian Industri §Y$PRC_china_national_nuclear_corporation$§!"
 PRC_increase_domestic_production_capacity: "Meningkatkan Produksi Militer Dalam Negeri"
 PRC_increase_domestic_production_capacity_desc: "Meskipun kita telah berhasil memperluas pengaruh kita dengan cara yang terbatas, inilah saatnya kita berinvestasi dalam industri militer kita. Jika kita kembali mengalami perang yang berkepanjangan, persediaan peralatan kita pada akhirnya akan habis atau perlu diperbaiki, dan tidak dapat menawarkan penggantinya akan menjadi bencana."
 PRC_army_tank_research: "Mempersiapkan Produksi Tank Dalam Negeri"
 PRC_army_tank_research_desc: "Dengan industri baru yang kini mampu menyediakan persenjataan yang lebih berat, inilah saatnya kita mengejar ketertinggalan dari kekuatan militer lainnya dan mengembangkan fasilitas produksi tank. Hal ini akan memberi kita keuntungan besar melawan negara-negara tetangga yang tidak memiliki senjata tersebut, dan memperkuat posisi kita melawan negara-negara yang memiliki pasukan lapis baja sendiri."
 PRC_army_doctrines: "Doktrin Menjadi Praktek"
 PRC_army_doctrines_desc: "Doktrin yang telah kita kembangkan dengan susah payah melalui berbagai konflik yang kita ikuti harus disesuaikan dengan organisasi dan persenjataan kita yang baru. Tanpa integrasi, keunggulan mereka akan berkurang."
 PRC_army_doctrines_tt: "Dapatkan bonus berdasarkan §YDoktrin Utama§! yang Anda pilih:"
 PRC_army_doctrines_mobile_warfare_tt: "Untuk memiliki §Y$GRAND_DOCTRINE_MOBILE_WARFARE$§!:"
 PRC_army_doctrines_superior_firepower__tt: "Karena memiliki §Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§!:"
 PRC_army_doctrines_grand_battleplan_tt: "Untuk memiliki §Y$GRAND_DOCTRINE_GRAND_BATTLEPLAN$§!:"
 PRC_army_doctrines_mass_assault_tt: "Untuk memiliki §Y$GRAND_DOCTRINE_MASS_ASSAULT$§!:"
 PRC_appeal_for_foreign_aid: "Permohonan Bantuan Luar Negeri"
 PRC_appeal_for_foreign_aid_desc: "Meminta baju besi dari [SOV.GetNameDef] akan memungkinkan kita membuat cabang lapis baja dalam pasukan kita, serta mempelajari desain mereka untuk meningkatkan kemampuan kita."
 PRC_establish_pla_air_force: "Angkatan Udara Tentara Pembebasan Rakyat"
 PRC_establish_pla_air_force_desc: "Ketika kita memperluas wilayah kita keluar dari benteng pegunungan dan mengambil alih lebih banyak wilayah dataran rendah, kita menjadi lebih rentan terhadap serangan udara. Untungnya, dalam ekspansi kami, kami juga telah mencapai kekuatan industri yang diperlukan untuk melakukan sesuatu mengenai hal ini, dan akan segera mengelola kerentanan dengan membentuk angkatan udara kami sendiri."
 PRC_appoint_chang_qiankun: "Tunjuk Chang Qiankun"
 PRC_appoint_chang_qiankun_desc: "Setelah belajar di Akademi Angkatan Udara Zhukovsky di Uni Soviet, Chang Qiankun kini menjadi kandidat yang tepat untuk mengawasi angkatan udara kita."
 PRC_the_northeast_aviation_university_sea: "Universitas Penerbangan Timur Laut"
 PRC_the_northeast_aviation_university_sea_desc: "Mendirikan pusat pelatihan skala besar untuk angkatan udara kita akan menjadi sebuah langkah maju yang besar. Kita tidak lagi harus bergantung pada sekolah di luar negeri untuk mendidik petugas kita tentang doktrin, cara mengoperasikan peralatan, atau cara mentransfer keterampilan ini kepada pilot pemberani kita."
 PRC_form_the_5th_research_institute: "Bentuk Lembaga Penelitian ke-5"
 PRC_form_the_5th_research_institute_desc: "Berita dari konflik baru-baru ini telah mengilhami rencana untuk membangun fasilitas penelitian yang berfokus pada tenaga jet dan roket. Fasilitas tersebut dapat digunakan untuk menyempurnakan desain pesawat kami, dan kemudian memproduksi rudal dan roket."
 PRC_aviation_infrastructure: "Berinvestasi dalam Infrastruktur Penerbangan"
 PRC_aviation_infrastructure_desc: "Skala [ROOT.GetNonIdeologyName] menunjukkan bahwa untuk mempertahankan wilayah udara kita, memiliki banyak pesawat saja tidaklah cukup. Lapangan terbang di tempat yang tepat, serta pelacakan aktivitas di wilayah udara kita, akan menjadi sangat penting."
 PRC_anti_air_effort: "Upaya Anti Udara"
 PRC_anti_air_effort_desc: "Luasnya wilayah udara membuat sulitnya menyediakan pesawat dan infrastruktur yang cukup untuk mencakup semuanya. Sebaliknya, senjata anti-pesawat dapat dikerahkan untuk memberikan perlindungan dari serangan udara, dan menjadi solusi yang sangat hemat biaya."
 PRC_establish_domestic_aircraft_production: "Membangun Produksi Pesawat Dalam Negeri"
 PRC_establish_domestic_aircraft_production_desc: "Produksi pesawat dalam negeri akan mengurangi ketergantungan kita pada pemasok asing, serta memungkinkan kita menyesuaikan desain dengan kebutuhan negara kita."
 PRC_light_plane_focus: "Perkembangan Pesawat Ringan"
 PRC_light_plane_focus_desc: "Menyempurnakan pesawat ringan dapat membuat kita memperoleh keuntungan dalam pertempuran udara."
 PRC_medium_plane_focus: "Perkembangan Bidang Menengah"
 PRC_medium_plane_focus_desc: "Untuk meningkatkan kemampuan kita dalam menyerang sasaran taktis, kita harus fokus pada desain pesawat menengah."
 PRC_large_plane_focus: "Perkembangan Pesawat Besar"
 PRC_large_plane_focus_desc: "Dengan fokus pada pesawat besar, kita dapat mencapai desain yang mampu membawa muatan berat, dan bahan bakar yang cukup untuk terbang jarak jauh."
 PRC_establish_pla_navy: "Angkatan Laut Tentara Pembebasan Rakyat"
 PRC_establish_pla_navy_desc: "Karena kurangnya akses kami sebelumnya ke pantai, kami menghadapi tugas sulit untuk mengejar kekuatan angkatan laut musuh kami. Angkatan laut tidak hanya akan memungkinkan kita melindungi pesisir dan hubungan dagang baru kita, namun juga menyebarkan pengaruh kita ke seluruh lautan."
 PRC_dockyard_construction_efforts: "Berinvestasi dalam Konstruksi Galangan Kapal"
 PRC_dockyard_construction_efforts_desc: "Ketika kita berupaya untuk membangun angkatan laut, kita perlu melakukan investasi pada beberapa industri untuk memproduksi kapal, sementara pabrik-pabrik lain – seperti pabrik pembuat artileri – harus dibuat untuk bekerja sama dengan sektor baru ini."
 PRC_naval_mio: "Pertajam Industri Angkatan Laut kita"
 PRC_naval_mio_desc: "Mengingat kurangnya industri di sektor angkatan laut, pemerintah harus memastikan bahwa organisasi produksi angkatan laut yang baru dibentuk beroperasi secara efisien."
 PRC_the_pla_naval_school: "Sekolah Angkatan Laut PLA"
 PRC_the_pla_naval_school_desc: "Sebuah pusat pendidikan baru di mana perwira dan pelaut baru dilatih dapat menjadi tempat terpusat untuk mengajarkan banyak keterampilan yang diperlukan di kapal besar, dengan kursus mulai dari navigasi, hingga desain dan pemeliharaan pesawat terbang."
 PRC_reappoint_jinguang_as_admiral: "Menunjuk kembali Jinguang sebagai Laksamana"
 PRC_reappoint_jinguang_as_admiral_desc: "Karena militer kita kurang berpengalaman dalam peperangan laut, kandidat terbaik untuk memimpin angkatan laut baru kita mungkin adalah komandan angkatan darat yang berpengalaman."
 PRC_reappoint_jinguang_as_admiral_tt: "§RHapus [PRC_ziao_jingguang.GetName] sebagai Jenderal§!"
 PRC_naval_infrastructure_effort: "Upaya Infrastruktur Angkatan Laut"
 PRC_naval_infrastructure_effort_desc: "Untuk beroperasi melintasi jarak yang sangat jauh dari garis pantai [ROOT.GetNonIdeologyName], kita harus menyediakan infrastruktur bagi angkatan laut yang memungkinkan mereka mengisi bahan bakar atau memperbaiki kapal mereka dengan cepat, di mana pun posisi mereka."
 PRC_a_modern_army: "Tentara Modern"
 PRC_a_modern_army_desc: "Kini setelah kami menyempurnakan peralatan kami, doktrin kami, pelatihan kami dan banyak lagi, kami akhirnya dapat yakin bahwa kami sudah siap semaksimal mungkin, tidak peduli musuh apa yang mungkin kami hadapi."
 PRC_air_force_capstone: "Angkatan Udara Modern"
 PRC_air_force_capstone_desc: "Investasi kita dalam penelitian peralatan angkatan udara seharusnya memungkinkan kita memproduksi pesawat yang mampu mengungguli pesawat musuh. Hal ini juga akan memfasilitasi kelancaran integrasi kemajuan baru seperti mesin jet."
 PRC_naval_capstone: "Angkatan Laut Modern"
 PRC_naval_capstone_desc: "Dengan angkatan laut kita yang kini diorganisasi ulang oleh [PRC_ziao_jingguang.GetName] dan dengan sumber daya yang diperlukan untuk mengoperasikan segala bentuk senjata angkatan laut, kita dapat memperluas pengaruh kita di Pasifik."
 PRC_peoples_liberation_army_sea: "Angkatan Darat Tentara Pembebasan Rakyat"
 PRC_peoples_liberation_army_sea_desc: "Tentara Merah Buruh dan Tani kita kini mempunyai prajurit-prajurit yang semakin berpengalaman, dan sudah saatnya kita sepenuhnya menerima perubahan karakter ini. Dalam transisi dari kekuatan milisi ke pasukan tentara profesional yang terlatih dan dilengkapi dengan baik, sekarang saatnya untuk membentuk Angkatan Darat Tentara Pembebasan Rakyat."
 PRC_central_military_commision: "Komisi Militer Pusat"
 PRC_central_military_commision_desc: "Dengan adanya reorganisasi dan modernisasi cabang-cabang militer kita, maka sebuah badan dapat dibentuk untuk mengoordinasikan hal-hal tersebut. Hal ini akan memberi kami pengawasan yang lebih baik terhadap pasukan kami, serta meningkatkan kemampuan kami untuk melaksanakan operasi gabungan."
 PRC_prepare_for_third_phase: "Mempersiapkan Diri Untuk Fase Ketiga"
 PRC_prepare_for_third_phase_desc: "Mao menyatakan ada tiga fase perang gerilya. Setelah melakukan dua cara pertama yang bertujuan untuk mendapatkan dukungan dan melemahkan musuh-musuh kita, kini saatnya beralih ke cara-cara konvensional. Kami akan memperluas wilayah kami lebih jauh dengan melancarkan serangan langsung ke kota-kota pada fase ketiga dan terakhir."
 PRC_revolutionary_war_of_the_masses: "Perang Revolusi Massa"
 PRC_revolutionary_war_of_the_masses_desc: "Kita harus memperjelas bahwa partai kita lebih mewakili rakyat jelata dibandingkan negara-negara nasionalis yang korup dan elitis. Tujuan kami adalah melawan kekuatan-kekuatan ini dan menciptakan sistem yang lebih baik."
 PRC_one_with_the_people: "Satu Dengan Rakyat"
 PRC_one_with_the_people_desc: "Komitmen kami untuk memperjuangkan [CHI.GetNonIdeologyName] yang lebih baik harus ditonjolkan semaksimal mungkin, untuk mengumpulkan lebih banyak sukarelawan untuk tentara kami."
 PRC_strengthen_the_air_arsenal: "Perkuat Arsenal Udara"
 PRC_strengthen_the_air_arsenal_desc: "Untuk meningkatkan angkatan udara kita, kita harus berinvestasi dalam meningkatkan peralatan kita berdasarkan pengalaman kita selama ini. Investasi satu kali untuk membuat desain kami lebih andal sekarang bahkan dapat menghemat uang untuk penggantian di kemudian hari."
 PRC_destroyers: "Penghancur Kelas Anshan"
 PRC_destroyers_desc: "Meskipun sudah ketinggalan jaman, kelebihan kapal perusak kelas Gnevny Soviet akan membangun fondasi bagi angkatan laut kita yang tidak memerlukan waktu bertahun-tahun untuk membangun kapal yang lebih besar. Kami juga dapat merombak dan memodernisasi kapal-kapal ini setelah mempelajari kinerjanya."
 PRC_submarines: "Kapal Selam Pesisir"
 PRC_submarines_desc: "Penggunaan kapal selam di perairan pesisir kita akan menjadi cara yang hemat biaya dan dapat bertahan untuk melindungi infrastruktur pesisir kita. Meskipun kapal selam ini tidak dirancang untuk kedalaman yang besar, setidaknya kapal selam ini akan menjadi langkah menuju pengembangan model yang lebih canggih."
 PRC_cruisers: "Kapal Penjelajah Air Hijau"
 PRC_cruisers_desc: "Kapal penjelajah bersenjata ringan namun serba guna seperti kelas Kirov akan memungkinkan kita melindungi laut di sekitar wilayah kita. Mari kita membeli beberapa lambung kapal yang belum lengkap dan menyelesaikan konstruksinya."
 PRC_capital_ships: "Perampokan Pertama Ke Kapal Modal"
 PRC_capital_ships_desc: "Informasi yang kami miliki mengenai desain kapal penjelajah tempur kelas [SOV.GetAdjective] Kronshtadt dapat menjadi dasar yang baik untuk memperluas armada kami dengan kapal-kapal besar. Desain ini sangat modern hingga industri [SOV.GetAdjective] kesulitan menghadapinya, namun bagi angkatan laut kita yang terus berkembang, tantangan ini sepadan dengan hasilnya."
 PRC_carriers: "Kekuatan Proyeksi"
 PRC_carriers_desc: "Pengembangan kapal induk akan memungkinkan kita bersaing dengan kekuatan angkatan laut utama. Kemampuan untuk mengerahkan kekuatan udara di mana pun yang dapat dijangkau oleh angkatan laut kita juga akan meningkatkan kemampuan kita untuk memproyeksikan kekuatan dalam konflik yang jauh dari tanah air."
 PRC_naval_guns: "Meningkatkan Daya Tembak Angkatan Laut"
 PRC_naval_guns_desc: "Landasan yang telah kami buat untuk pembangunan kapal yang lebih besar juga akan memungkinkan kami menggunakan persenjataan yang lebih besar. Senjata-senjata ini memungkinkan kita untuk mengancam bahkan sasaran-sasaran yang memiliki lapis baja berat, dan menyerang sebelum kita berada dalam jangkauan efektif mereka."
 PRC_naval_ocean_navy: "Dari Angkatan Laut Perairan Hijau Menjadi Lautan Biru"
 PRC_naval_ocean_navy_desc: "Reformasi angkatan laut kita sekarang harus memungkinkan mereka beroperasi secara efektif pada jarak yang jauh dari basis pasokan kita. Hal ini akan memungkinkan kita untuk menahan kekuatan musuh bahkan sebelum mereka mencapai laut tetangga."
 PRC_pilot_training: "Mendirikan Akademi Percontohan"
 PRC_pilot_training_desc: "Beberapa pilot berpengalaman yang kita miliki tidak boleh mengambil risiko dalam pertempuran, sebaliknya, mereka harus direkrut sebagai instruktur untuk melatih pilot baru seiring dengan berkembangnya angkatan udara kita."
 PRC_night_attack: "Memanfaatkan Malam"
 PRC_night_attack_desc: "Melatih pasukan kita untuk serangan malam hari akan lebih mengeksploitasi pengalaman kita dalam peperangan asimetris."
 PRC_reorganize_divisions: "Reorganisasi Divisi"
 PRC_reorganize_divisions_desc: "Untuk lebih memodernisasi angkatan bersenjata kita, kita harus mengatur ulang milisi yang tersisa menjadi beberapa divisi dan memastikan kekuatan divisi yang ada tetap konsisten. Hal ini akan memungkinkan kita menciptakan rantai komando yang jelas yang pada gilirannya akan mempermudah koordinasi pasukan kita."
 PRC_rural_region_development_two: "Memperluas Pembangunan Pedesaan"
 PRC_rural_region_development_two_desc: "Modernisasi pertanian kita harus lebih didukung dengan investasi pada infrastruktur di wilayah pedesaan, seperti sekolah dan jalan, yang akan membantu meningkatkan produktivitas pedesaan."
 PRC_urbanization_two: "Perluas Upaya Urbanisasi"
 PRC_urbanization_two_desc: "Perluasan kota-kota kita berarti bahwa kita sekarang dapat mengakomodasi proyek-proyek konstruksi yang lebih besar untuk menciptakan rumah dan lapangan kerja. Kami akan mengizinkan lebih banyak orang untuk pindah ke kota, dan menyediakan lapangan kerja saat pembangunan sedang berlangsung."
 PRC_make_agrarian_to_urban_tt: "Mengubah §Y$PRC_agrarian_reform$§! menjadi §Y$PRC_urban_society$§! yang memberikan:"
 PRC_found_the_academy_of_science: "Menemukan Akademi Sains"
 PRC_reinforce_base_area: "Perkuat Area Pangkalan Baru"
 PRC_reinforce_base_area_desc: "Untuk menghindari kampanye lain yang dilakukan oleh kekuatan nasionalis terhadap basis kita, kita harus mempertimbangkan setiap pilihan yang mungkin untuk melindungi mereka."
 PRC_rebuild_28_bolshevik: "Bangun kembali 28 ½ Bolshevik"
 PRC_rebuild_28_bolshevik_desc: "Dukungan yang diterima oleh kepemimpinan baru kita jelas menunjukkan bahwa mereka dapat dipercaya. Legitimasi ini akan memungkinkan kita untuk lebih mudah mengumpulkan pendukung baik secara internasional maupun di dalam negeri."
 PRC_bolshevik_world_revolution: "Menyebarkan Revolusi Dunia"
 PRC_bolshevik_world_revolution_desc: "Keberhasilan revolusi kita tidak boleh dibatasi oleh batas negara kita. Kita harus membantu proletariat di negara lain."
 PRC_bolshevik_urbanization: "Revolusi Dari Kota"
 PRC_bolshevik_urbanization_desc: "Meskipun basis kekuatan kita saat ini sebagian besar terdiri dari petani pedesaan yang mencari peningkatan kualitas hidup, kita harus menyampaikan pesan kita kepada mereka yang berada di perkotaan, karena mereka juga menghadapi kesenjangan."
 PRC_embrace_stalinism: "Menerima Stalinisme"
 PRC_embrace_stalinism_desc: "Dengan kokohnya kepemimpinan kita, kita bisa mulai menerapkan ideologi Stalinis secara lebih luas. Kolektivisasi lebih lanjut dan industrialisasi yang pesat harus menjadi titik fokus utama kita."
 PRC_embrace_stalinism_tt: "Bergantung pada nilai saat ini di §Y$PRC_communist_power_struggle$§!, §Y$PRC_bolshevik_dominance$§! akan mendapatkan pengubah yang berbeda.\nEfek Saat Ini:"
 PRC_bolshevik_aid: "[GetBolshevikAid]"
 PRC_bolshevik_aid_default: "Bantuan Dari Bolshevik Soviet"
 PRC_bolshevik_aid_alt: "Selamat Datang di Pengasingan Bolshevik"
 PRC_bolshevik_aid_desc: "Kaum Bolshevik Soviet berpengalaman dalam peperangan revolusioner dan mungkin juga bersedia berkontribusi secara finansial untuk tujuan kita."
 PRC_party_control: "Kontrol Partai"
 PRC_party_control_desc: "Keberhasilan kepemimpinan kita sekarang memungkinkan kita untuk mengambil kendali lebih lanjut atas Partai Komunis Tiongkok."
 PRC_invite_pavel_mif: "Undang Pavel Mif"
 PRC_invite_pavel_mif_desc: "Pavel Mif, mentor dari 28 ½ Bolshevik, harus diundang untuk memberi nasihat kepada pemerintah kita. Kehadirannya akan memperkuat hubungan kami dengan [SOV.GetNameDef]."
 PRC_invite_otto_braun: "Undang Otto Braun"
 PRC_invite_otto_braun_desc: "$PRC_otto_braun$ bersama dengan $PRC_bo_gu$ adalah salah satu komandan militer utama kampanye tahun 1934. Memang benar, kampanye tersebut berakhir dengan kekalahan, dan Braun dikesampingkan selama Long March. Namun, kepemimpinan baru kami melihat bahwa ini bukan kesalahan $PRC_otto_braun$, dan berupaya untuk mempekerjakannya kembali."
 PRC_invite_soviet_general: "Undang Jenderal Soviet"
 PRC_invite_soviet_general_desc: "Pengalaman luas $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ dalam Perang Saudara Rusia dan sebagai atase [CHI.GetNameDef] akan membuat keduanya menjadi tambahan yang berharga bagi pasukan kita."
 PRC_invite_soviet_general_tt: "§Y$SOV_vasily_chuykov$§! dan §Y$SOV_aleksandr_cherepanov$§! menjadi Jenderal"
 PRC_bolshevik_urbanization_2: "Meningkatkan Upaya Urbanisasi"
 PRC_bolshevik_urbanization_2_desc: "Menciptakan lapangan kerja di kota-kota untuk mendorong penduduk pedesaan agar pindah ke sana tidak hanya akan menguntungkan perekonomian kita, namun juga akan meningkatkan pengaruh kita di kota-kota yang mempertanyakan revolusi."
 PRC_bolshevik_urban_industrialization: "Industrialisasi Perkotaan"
 PRC_bolshevik_urban_industrialization_desc: "Kita harus berinvestasi di kota-kota kita untuk mendorong pembentukan industri berat."
 PRC_bolshevik_urbanization_completed: "Buruh Proletar, Bersatu!"
 PRC_bolshevik_urbanization_completed_desc: "Investasi kami di wilayah perkotaan telah berhasil meningkatkan pengaruh kami di sana. Kita sekarang dapat menantikan kerja sama yang lebih kuat antara organisasi komunis di pedesaan dan di kota."
 PRC_join_comintern: "Bergabunglah dengan Komintern"
 PRC_join_comintern_desc: "Dengan semakin tersentralisasinya kepemimpinan Partai Komunis, dan akibatnya negara, kita dapat mengajukan permohonan untuk bergabung dengan Komintern sebagai sekutu yang dapat diandalkan."
 PRC_rebuild_28_bolshevik_tt: "Setiap Anggota §Y28 ½ Bolshevik§!:\nMeningkatkan efisiensi sifat mereka"
 PRC_rebuild_28_bolshevik_effect_tt: "Kalah §Y$PRC_28_bolshevik_trait$§! dan Dapatkan §Y$PRC_28_bolshevik_trait_improved$§!.\n§YPerubahan efektif:§!\nPerolehan Kekuatan Politik Harian: §G+0,12§!\nStabilitas: §G+5,00%§!\nOpini bulanan ideologi yang sama: §G+5,00%§!" ## Make sure match values in trait file TODO_ML, change to variables
 PRC_agricultural_reform_boom: "Kebebasan Pertanian"
 PRC_agricultural_reform_boom_desc: "Kita harus memberikan rasa aman bagi para petani agar mereka merasa cukup terdorong untuk menghasilkan tanaman yang dibutuhkan negara kita."
 PRC_he_long_second_army: "He Long dan Tentara Kedua"
 PRC_he_long_second_army_desc: "Pasukan He Long yang sebagian besar masih utuh berarti kita memiliki kekuatan utama baru yang harus dijaga [ROOT.capital.GetName]. Pengalamannya menghindari kekuatan nasionalis juga patut kita manfaatkan."
 PRC_rural_survey: "Survei Pedesaan"
 PRC_rural_survey_desc: "Memetakan populasi dan produksi di daerah pedesaan akan memungkinkan rencana ekonomi kita selanjutnya berjalan dengan lancar, dan juga akan berguna jika wajib militer diperlukan."
 PRC_lessons_learnt: "Pelajaran yang Dipetik"
 PRC_lessons_learnt_desc: "Pengalaman yang kita peroleh sejak Long March harus digunakan untuk menyempurnakan kemajuan yang dicapai dalam doktrin dan pelatihan militer kita."
 PRC_asymmetric_warfare_completed_tt: "Setelah §Y$PRC_asymmetric_warfare$§! selesai:"
 PRC_conventional_warfare_completed_tt: "Dengan §Y$PRC_conventional_warfare$§! selesai:"
 PRC_indirect_fire_completed_tt: "Dengan §Y$PRC_indirect_fire$§! selesai:"
 PRC_appeal_for_foreign_aid_bt7_tt: "[ROOT.GetNameDefCap] akan mendapatkan §YBT-7 Light Tank§!"
 PRC_appeal_for_foreign_aid_bt7_all_tanks_tt: "Dapatkan §Y350§! [SOV.GetAdjective] §YTank Ringan BT-7§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid__bt7_some_tanks_tt: "Dapatkan §Y100§! [SOV.GetAdjective] §YTank Ringan BT-7§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid__bt7_medium_amount_tt: "Dapatkan §Y150§! [SOV.GetAdjective] §YTank Ringan BT-7§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid_tt: "[ROOT.GetNameDefCap] akan mendapatkan §YT34 Medium Tank§!"
 PRC_appeal_for_foreign_aid_all_tanks_tt: "Dapatkan §Y250§! [SOV.GetAdjective] §YT34 Medium Tank§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid__some_tanks_tt: "Dapatkan §Y50§! [SOV.GetAdjective] §YT34 Medium Tank§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid__medium_amount_tt: "Dapatkan §Y150§! [SOV.GetAdjective] §YT34 Medium Tank§!" ##TODO_ML - make sure values are correct
 PRC_appeal_for_foreign_aid_unlock_decision_tt: "Membuka §YKeputusan§! untuk meminta §Y[SOV.GetNameDefCap]§! tentang §YKendaraan Lapis Baja§!"
 PRC_rural_region_development_tt: "Hingga §YTiga§! Negara Bagian Pedesaan akan mendapatkan §G25%§! Pasokan Lokal dan §G15%§! Tenaga Kerja Lokal.\nEfek Saat Ini:" ##TODO_ML - make sure values are correct Slightly hacky but ok, fast is good - save as variables otherwise 
 PRC_rural_region_development_two_tt: "Hingga §YDua§! Negara Bagian Pedesaan akan mendapatkan §G25%§! Pasokan Lokal dan §G15%§! Tenaga Kerja Lokal.\nEfek Saat Ini:" ##TODO_ML - make sure values are correct Slightly hacky but ok, fast is good - save as variables otherwise 
 PRC_initialize_five_year_plan_tt: "§RKegagalan memenuhi target industri sesuai tenggat waktu rencana akan mengakibatkan penalti terhadap efisiensi ekonomi Anda, yang mencerminkan hilangnya kepercayaan perencanaan pusat.§!\n\n§YTotal pabrik yang dibutuhkan untuk mencapai tujuan:\n[GetFiveYearPlanGoalCivFactoriesText] Pabrik Sipil\n[GetFiveYearPlanGoalMilFactoriesText] Pabrik Militer§!"
 PRC_initialize_shorter_market_plans_tt: "§RKegagalan untuk memenuhi target industri sesuai tenggat waktu rencana akan mengakibatkan penalti besar terhadap efisiensi ekonomi Anda, yang mencerminkan hilangnya kepercayaan perencanaan pusat.§!\n\n§YTotal pabrik yang diperlukan untuk mencapai tujuan:\n[GetShorterMarketPlansGoalCivFactoriesText] Pabrik Sipil\n[GetShorterMarketPlansGoalMilFactoriesText] Pabrik Militer§!"
 PRC_naval_infrastructure_effort_tt: "Jika persyaratan terpenuhi, fokus ini akan memberikan §YPangkalan Angkatan Laut§!, §YBenteng Pesisir§!, dan 1 §YMarkas Besar Angkatan Laut§! jika belum ada yang dibangun."
 PRC_dockyard_construction_efforts_tt: "Ketika persyaratan terpenuhi, fokus ini akan memberikan §Ygalangan kapal§!"
 PRC_urbanization_two_tt: "Jika §YXian§! dan §YShanxi§! dikuasai, mereka akan menjadi §YKawasan Perkotaan§!, memberikan\n§G3§! Slot Bangunan\n§G1§! §YPabrik Sipil§!\nTambahkan §YKemajuan Urbanisasi§! yang memberikan:\nKecepatan Konstruksi Lokal: §G+10%§!"
 PRC_reinforce_base_area_tt: "Bangun §G2§! §YBenteng Daratan§! di perbatasan §Y[622.GetName]§! dan §Y[1046.GetName]§!.\nJika ada perang perbatasan yang dimenangkan:\nBangun §G1§! §YBenteng Daratan§! tingkat di perbatasannya"
 PRC_he_long_has_arrived: "He Long telah tiba di Shaanxi"
 PRC_pavel_mif_alive: "Pavel Mif Masih Hidup"
 PRC_zhang_guatao_arrived: "§Y$PRC_zhang_guotao$§! telah tiba di Shaanxi"
 PRC_mediating_secretary_remove_fake_idea_tt: "Hapus §Y$PRC_mediating_general_secretary_idea$§!, yang memberikan\nPerolehan Kekuatan Politik Harian: §R-0,05§!\nStabilitas: §G+10,00%§!" #Make sure values are correct, TODO_ML
 PRC_infiltration_only_level_2_bolshevik_tt: "Hanya keputusan hingga §Ytingkat 2§! yang tersedia. Buka kunci §Ytingkat 3§! dengan mengambil fokus §Y$PRC_supreme_infiltration$§!."
 PRC_infiltration_only_level_2_guomao_tt: "Hanya keputusan hingga §Ytingkat 2§! yang tersedia. Buka kunci §Ytingkat 3§! dengan mengambil fokus §Y$PRC_secure_the_lands$§!."
