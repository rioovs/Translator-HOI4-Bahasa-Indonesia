 JAP_imperial_influence_interference_reset_days_tt: "Beberapa hari hingga $JAP_imperial_influence_ruler_name_text$ dapat mengganggu $JAP_imperial_influence_faction_names_text$ lagi: [?JAP_interfered_in_imperial_influence_flag:days_left|Y0]"
 JAP_imperial_influence_faction_names_text: "§Y[GetImperialInfluenceFactionsName]§!"
 JAP_imperial_influence_factions_names_text_communist: "Fraksi Internal"
 JAP_imperial_influence_factions_names_text_monarchist: "Fraksi Kekaisaran"
 JAP_sea_purge_the_kodoha_faction: "Bersihkan Fraksi Kodoha"
 JAP_sea_purge_the_kodoha_faction_desc: "Kōdōha menyia-nyiakan kesempatan mereka untuk merebut kekuasaan, dan hal ini akan sangat merugikan mereka. Karena pengkhianatan mereka terhadap Yang Mulia Kaisar, kami akan mencabut pangkat mereka, dan mengadili mereka karena pengkhianatan. Waktunya akhirnya tiba bagi Tōseiha untuk mengambil kendali dalam Tentara Kekaisaran!"
 JAP_sea_purge_the_kodoha_faction_tt: "§YSadao Araki§! dan §YShigeru Honjō§! akan pensiun dari dinas aktif"
 JAP_east_asian_cooperative_society: "Masyarakat Koperasi Asia Timur"
 JAP_east_asian_cooperative_society_desc: "Teori Masyarakat Koperasi Asia Timur yang baru-baru ini dikembangkan menganjurkan pembangunan masyarakat koperasi di Asia Timur yang melampaui batas-batas etnis dan negara. Kita harus memanfaatkan gagasan ini untuk memperkuat posisi kita sebagai penjaga Pasifik, dan pemimpin masyarakat Asia Timur."
 JAP_east_asian_cooperative_society_tt: "Membuka keputusan untuk berteman dan berinvestasi pada sumber daya alam §YNegara-negara Asia§!"
 JAP_imperial_headquarters_liasion_conference: "Konferensi Penghubung Kekaisaran"
 JAP_imperial_headquarters_liasion_conference_desc: "Dengan berdirinya kembali Markas Besar Kekaisaran untuk pertama kalinya sejak Perang Rusia-Jepang, sudah saatnya kita mengadakan konferensi antara para pemimpin berbagai faksi untuk meningkatkan kerja sama dan pertukaran informasi antara militer dan pemerintah."
 JAP_promulgate_the_military_ministers_system: "Sistem Atase Menteri Militer"
 JAP_promulgate_the_military_ministers_system_desc: "Periode singkat sejak percobaan kudeta oleh faksi Kōdōha sama sekali tidak stabil. Ketika militer semakin marah terhadap pemerintah, sesuatu perlu dilakukan untuk menenangkan mereka. Untuk mencapai tujuan tersebut, Kōki Hirota telah mengusulkan untuk menjadikan menteri perang sebagai posisi yang hanya dapat diberikan kepada perwira aktif, seperti yang telah terjadi beberapa kali sepanjang sejarah kita."
 JAP_promulgate_the_military_ministers_system_tt: "Langkah ini §RTidak populer§! di kalangan anggota §YPemerintahan Sipil§!, dan pasti akan menyebabkan perselisihan antar faksi di kemudian hari."
 JAP_reprimand_hamada_kunimatsu: "Tegur Hamada Kunimatsu"
 JAP_reprimand_hamada_kunimatsu_desc: "Dalam pidatonya yang mengkritik militer dalam Diet, Hamada Kunimatsu bertindak terlalu jauh. Untuk menjaga agar militer tidak sepenuhnya mengungguli pemerintahan sipil secara politis, kita perlu menegurnya dengan benar, dan menunjukkan bahwa kita masih mempunyai perlawanan yang tersisa."
 JAP_the_harakiri_debate: "Debat Harakiri"
 JAP_the_harakiri_debate_desc: "Menyusul tindakan pembangkangan tercela yang ditunjukkan Hamada Kunimatsu terhadap militer, Hisaichi Terauchi menuntut pengunduran diri kabinet dan pelantikan perdana menteri baru, jika perdana menteri lama masih memiliki sedikit pun kehormatan yang tersisa dalam dirinya. Melalui sedikit manuver yang hati-hati, Senjūrō ​​Hayashi dapat dipasang sebagai boneka militer."
 JAP_konoes_first_cabinet: "Kabinet Pertama Konoe"
 JAP_konoes_first_cabinet_desc: "Senjūrō Hayashi hanya dimaksudkan sebagai perdana menteri interregnum jangka pendek. Pangeran Fumimaro Konoe, apolitis dan dididik oleh Genrō Saionji Kinmochi, dia adalah kandidat yang tepat untuk menstabilkan situasi politik yang kacau dan menyatukan semangat bangsa. Sudah saatnya ia membentuk kabinetnya sendiri, yang secara pribadi dicalonkan menjadi Kaisar Hirohito oleh Saionji sendiri."
 JAP_new_order_in_east_asia: "Orde Baru di Asia Timur"
 JAP_new_order_in_east_asia_desc: "Dalam pernyataan baru-baru ini oleh [ROOT.GetLeader], semakin jelas bahwa ia bermaksud untuk membangun tatanan baru di Asia Timur, yang memiliki enam tujuan utama. Hal tersebut mencakup stabilitas permanen di Asia Timur, persahabatan bertetangga dan keadilan internasional, pertahanan bersama melawan komunisme, penciptaan budaya baru, kohesi dan kerjasama ekonomi, dan akhirnya perdamaian dunia."
 JAP_new_order_in_east_asia_faction: "Orde Baru di Asia Timur"
 JAP_new_order_in_east_asia_tt: "Mengambil fokus $JAP_sea_greater_east_asian_co_properity_sphere$ akan mengubah faksi ini"
 JAP_reiterate_the_three_principles_of_hirota: "Ulangi Tiga Prinsip Hirota"
 JAP_reiterate_the_three_principles_of_hirota_desc: "Melalui manuver pemerintah yang cermat, Hirota berhasil mengangkat penggantinya Kazushige Ugaki menjadi perdana menteri baru. Sudah waktunya untuk secara resmi meratifikasi tiga pernyataan Hirota, yaitu pembentukan blok Jepang-Tiongkok-Manchukuo, pengorganisasian front bersama Tiongkok-Jepang melawan penyebaran komunisme, dan penindasan aktivitas anti-Jepang di Tiongkok."
 JAP_formalize_japan_china_manchukuo_alliance: "Aliansi Jepang - Cina - Manchukuo"
 JAP_formalize_japan_china_manchukuo_alliance_desc: "Karena pemerintah [CHI.GetLeader] telah menerima tuntutan kami untuk menindak aktivitas komunis dan anti-Jepang, kini nampaknya mereka bersedia untuk sementara waktu membentuk aliansi dengan kami untuk mengatasi penyakit yang membusuk jauh di lubuk hati Asia Timur yang dikenal sebagai panglima perang dan komunisme, yang mengancam seluruh Asia dengan kematian yang pasti dan tak terhindarkan."
 JAP_sino_japanese_pact: "Pakta Anti-Komunis Sino-Jepang"
 JAP_sea_national_spiritual_mobliization_movement: "Gerakan Mobilisasi Rohani Nasional"
 JAP_sea_national_spiritual_mobliization_movement_desc: "\"Kemewahan adalah Musuh kita!\" Dengan penghematan, kebersihan, dan kerja keras yang diangkat menjadi kebajikan nasional, lebih banyak tenaga kerja tersedia untuk upaya perang dan kehendak kaisar surgawi disampaikan dengan baik kepada semua rakyat kekaisaran kita."
 JAP_hokushin_ron: "Hokushin-ron"
 JAP_hokushin_ron_desc: "Faksi dalam angkatan bersenjata kita yang menyebut diri mereka sebagai Kelompok Serangan Utara menganjurkan ekspansi ke Siberia dan Mongolia sebagai cara untuk mendapatkan sumber daya alam dan nilai ekonomi yang kita perlukan untuk melanjutkan ambisi kekaisaran kita. Kita harus mendukung gagasan ini, dan mulai mempersiapkan kekuatan kita untuk melaksanakan doktrin tersebut jika waktunya terbukti tepat."
 JAP_strike_north_doctrine: "Serang Doktrin Utara"
 JAP_strenghten_manchukuo_imperial_army: "Perkuat Tentara Kekaisaran Manchu"
 JAP_strenghten_manchukuo_imperial_army_desc: "Tentara Kekaisaran Manchukuo berdiri sebagai garda depan melawan kekuatan [SOV.GetNameDef], dan merupakan pihak yang akan mempertahankan garis depan jika perang pecah. Kita harus membantu memperbesar kekuatan-kekuatan ini, sehingga diharapkan mereka dapat bertahan melawan raksasa [SOV.GetAdjective]."
 JAP_strenghten_manchukuo_imperial_airforce: "Memperkuat Angkatan Udara Kekaisaran Manchu"
 JAP_strenghten_manchukuo_imperial_airforce_desc: "Angkatan Udara Kekaisaran Manchukuo baru saja dibentuk, dan para perwiranya masih harus banyak belajar. Kita harus mengirimkan petugas untuk melatih mereka, serta mengirimkan mereka pesawat tempur Nakajima Army Type 91 dan pesawat pengebom ringan Kawasaki Type 88 untuk memperkuat pasukan mereka."
 JAP_ensure_temporary_peace_with_china: "Menjamin Perdamaian Sementara dengan Tiongkok"
 JAP_ensure_temporary_peace_with_china_desc: "Untuk memusatkan perhatian kita pada [SOV.GetNameDef], kita harus memastikan bahwa [CHI.GetAdjective] yang pengkhianat tidak menusuk kita dari belakang saat pasukan kita terlibat dalam pertempuran di tempat lain. Kita juga harus memastikan bahwa Tentara Kwantung tidak boleh bertindak di luar batas untuk sementara waktu, sehingga mereka tidak memulai perang yang tidak dapat kita menangkan."
 trautmann_agreement_opm: "Perjanjian Trautmann"
 JAP_a_mongol_volunteer_army: "Reformasi Tentara Kemerdekaan Mongolia" # Could also be A Mongol Volunteer Army
 JAP_a_mongol_volunteer_army_desc: "Tentara Manchuria memiliki Tentara Kemerdekaan Mongolia di dalamnya yang terdiri dari orang-orang Mongolia dan bandit, dipimpin oleh penasihat [ROOT.GetAdjective]. Kita harus membentuk pasukan serupa sepenuhnya di bawah kendali kita sendiri, dengan tujuan mengirim mereka ke [MON.GetNameDef] dan membebaskan tanah air mereka dari kekuatan musuh."
 JAP_a_mongol_volunteer_army_tt: "Jika §Y[MAN.GetName]§! atau §Y[MEN.GetName]§! adalah sekutu kita, mereka juga akan mendapatkan semangat ini"
 JAP_a_mongol_volunteer_army_1_tt: "Membuka keputusan untuk §YMenggoyahkan Mongolia§! dengan tujuan membujuk mereka agar memihak kita dan melakukan kudeta terhadap pemerintah"
 JAP_utilize_ainu_expertise: "Memanfaatkan Keahlian Ainu"
 JAP_utilize_ainu_expertise_desc: "Suku Ainu yang berasal dari Jepang Utara sangat ahli dalam menavigasi salju dan medan keras di Hokkaido. Mungkin kita bisa belajar dari teknik mereka untuk membuat invasi kita ke Siberia lebih cepat?"
 JAP_kantokuen: "Kantokuen"
 JAP_kantokuen_desc: "Untuk memanfaatkan perkembangan dunia, Tentara Kwantung telah mempersiapkan Manuver Khusus, sebagai persiapan untuk invasi dan pendudukan Timur Jauh Rusia. Agar serangan dapat berjalan cepat, kita harus melakukan persiapan akhir sebelum mengambil tindakan."
 JAP_a_green_persimmon: "Kesemek Hijau"
 JAP_a_green_persimmon_desc: "Pasukan kita belum sepenuhnya siap untuk berperang dengan [SOV.GetNameDef], dan perhatian mereka belum cukup dialihkan ke arah barat. Terlepas dari semua ini, kita harus menyerang sekarang, atau peluang itu akan hilang dari kita..."
 JAP_the_persimmon_has_ripened: "Kesemek telah matang"
 JAP_the_persimmon_has_ripened_desc: "Buah kemenangan akan segera matang, dan pasukan kita siap sepenuhnya untuk campur tangan dan merebut Siberia dari Kerajaan [SOV.GetAdjective] yang sedang runtuh. Perang akan berlangsung cepat, dan kemenangan kita akan gemilang. Tennoheika Banzai!"
 JAP_peace_out_soviets_dec_tt: "Membuka keputusan untuk menandatangani §YPerdamaian Terpisah§! dengan §Y[SOV.GetNameDef]§! untuk mendapatkan §YSiberia§! dari mereka jika kita mengendalikannya"
 JAG_neutality_pact_focus_days_tt: "Hari saat ini adalah: [?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_soviet_japanese_neutrality_pact_flag: "Telah menyelesaikan fokus §Y$JAP_soviet_japanese_neutrality_pact$§!"
 JAP_chinese_japanese_neutrality_pact_flag: "Telah menyelesaikan fokus §Y$JAP_ensure_temporary_peace_with_china$§!"
 JAG_chinese_neutality_pact_focus_days_tt: "Hari saat ini adalah: [?JAP_chinese_japanese_neutrality_pact_flag:days|Y0]"
 JAP_hokushin_ron_started_flag: "Telah menyelesaikan fokus §Y$JAP_hokushin_ron$§!"
 JAG_hokushin_ron_focus_days_tt: "Hari saat ini adalah: [?JAP_hokushin_ron_started_flag:days|Y0]"
 JAP_nanshin_ron_started_flag: "Telah menyelesaikan fokus §Y$JAP_nanshin_ron$§!"
 JAG_nanshin_ron_focus_days_tt: "Hari saat ini adalah: [?JAP_nanshin_ron_started_flag:days|Y0]"
 JAP_sea_establish_the_northern_resource_area: "Membangun Wilayah Sumber Daya Utara"
 JAP_sea_establish_the_northern_resource_area_desc: "Kini setelah kita berhasil menduduki wilayah utara, limbah Siberia yang melimpah harus dieksploitasi untuk mesin perang kita yang terus berkembang. Oleh karena itu, kita harus membangun tambang baru dan merencanakan kota-kota di lokasi-lokasi penting, sehingga kita dapat mengekstraksi semua yang kita bisa."
 JAP_nanshin_ron: "Nanshin-ron"
 JAP_nanshin_ron_desc: "Meskipun kaya, Tiongkok dan Siberia tidak memiliki semua sumber daya yang kita perlukan. Namun tidak jauh ke selatan, terdapat Filipina, Hindia Belanda, dan koloni Inggris di Malaya dan Kalimantan. Untuk mencapai swasembada yang sejati, kita harus merebut kendali atas wilayah-wilayah ini dari tangan imperialis Eropa."
 JAP_unlocks_pearl_harbor_raid: "Membuka §YRaid§!:\nPearl Harbor Strike di §Y[USA.GetNameWithFlag]§!"
 JAP_soviet_japanese_neutrality_pact: "Pakta Netralitas Soviet-Jepang"
 JAP_soviet_japanese_neutrality_pact_desc: "Perbatasan utara kita harus diamankan jika kita ingin mempunyai kebebasan untuk menyerang ke selatan. Kami akan segera memulai negosiasi dengan [SOV.GetNameDef] untuk memastikan netralitas mereka, sekaligus juga merundingkan hak sumber daya lebih lanjut atas Sakhalin Utara."
 JAP_soviet_japanese_neutrality_pact_tt: "Jika §Y[SOV.GetAdjective]s§! menerima pakta tersebut, lebih banyak pengusaha [ROOT.GetAdjective] akan tertarik untuk berinvestasi pada konsesi kami di §Y[655.GetName]§!"
 JAP_unsinkable_aircraft_carriers: "Kapal Induk yang Tidak Dapat Tenggelam"
 JAP_unsinkable_aircraft_carriers_desc: "Wilayah Laut Selatan berfungsi sebagai pangkalan yang sempurna untuk pengoperasian pesawat kami dalam perjuangan di Pasifik. Kita harus memperkuat pulau-pulau ini, dan membentengi lokasi-lokasi ini sehingga kita dapat menahannya, jangan sampai pulau-pulau tersebut 'tenggelam' seperti kapal induk biasa."
 JAP_isolate_oceania: "Isolasi Oseania"
 JAP_isolate_oceania_desc: "Komando tinggi kami menganggap tidak mungkin untuk mendarat dan menduduki [AST.GetNameDef] dan [NZL.GetNameDef], dan telah mengusulkan solusi yang lebih baik terhadap masalah negara-negara yang bermusuhan ini. Kita harus menduduki pulau-pulau yang kurang terlindungi di sekitar negara-negara ini, dan memisahkan mereka dari sekutu mereka, untuk perlahan-lahan melemahkan keinginan mereka untuk melawan kita."
 JAP_battle_for_australia: "Pertempuran untuk Australia"
 JAP_battle_for_australia_desc: "Kini setelah [AST.GetNameDef] diisolasi, sekarang saatnya untuk mulai berjuang demi langit di benua ini. Jika kita berhasil mengendalikan langit mereka, mungkin menduduki Oseania bukanlah hal yang tidak masuk akal."
 JAP_operation_take_australia: "Operasi AN" # Australia-New Zealand
 JAP_operation_take_australia_desc: "Waktunya akhirnya tiba. Komando Tinggi telah mengizinkan operasi tersebut mendarat di Australia, dengan nama sandi Operasi AN. Kami akan mengalahkan musuh-musuh kami, dan menguasai wilayah terdalam di Asia!"
 JAP_sea_exploit_southern_resource_area: "Memanfaatkan Wilayah Sumber Daya Selatan"
 JAP_sea_exploit_southern_resource_area_desc: "Kini setelah kita berhasil menguasai wilayah selatan, kita harus memperluas eksploitasi sumber daya yang berlimpah di Asia Tenggara dan Hindia Timur untuk memberi makan kekuatan kita dalam perang."
 JAP_demand_tonkinese_bases: "Permintaan Pangkalan Tonkinese"
 JAP_demand_tonkinese_bases_desc: "Wilayah Tonkin tidak hanya kaya akan sumber daya, namun juga merupakan batu loncatan penting untuk ekspansi lebih lanjut kami ke arah selatan. Karena berada di perbatasan dengan Tiongkok, wilayah ini juga dapat berfungsi sebagai basis operasi penting bagi angkatan udara kita untuk menyerang Kanton."
 JAP_demand_tonkinese_bases_tt: "Prancis memiliki §YTonkin§!"
 JAP_demand_tonkinese_bases_2_tt: "Prancis tidak memiliki §YTonkin§!"
 JAP_occupy_indochina: "Menempati Indochina"
 JAP_occupy_indochina_desc: "Rakyat Indochina saat ini sedang ditindas oleh rezim kolonialis dan imperialis yang kurang peduli terhadap kesejahteraan mereka. Kita harus turun tangan dan mengambil kendali atas wilayah ini, untuk melindungi masyarakatnya, dan dalam prosesnya menguasai sumber daya alam di wilayah tersebut."
 JAP_occupy_indochina_tt: "Prancis tidak memiliki §YIndocina§!"
 JAP_occupy_siam: "Menempati Siam"
 JAP_occupy_siam_desc: "Siam, meskipun berpotensi menjadi sekutu kita, mungkin merupakan kelemahan yang pasti akan dieksploitasi oleh lawan kita. Oleh karena itu kita harus turun tangan dan menduduki mereka secara langsung, sehingga mereka tidak mempunyai kesempatan untuk berkolusi dengan musuh kita."
 JAP_sea_pressure_siam: "Tekanan Siam"
 JAP_sea_pressure_siam_desc: "Siam terletak di lokasi utama untuk membantu kita dalam perang yang akan datang dengan kekuatan Barat. Dengan memihak mereka, kita akan sangat memudahkan invasi yang tak terelakkan ke Malaya dan, dengan demikian, ke Hindia Timur. Oleh karena itu, kita harus menjelaskan dengan jelas kepada mereka, bahwa jika mereka tidak bersama kita, berarti mereka melawan kita."
 JAP_strike_the_southern_road: "Serang Jalan Selatan"
 JAP_strike_the_southern_road_desc: "Waktunya telah tiba untuk menjalankan rencana kita. Kami akan menyerang ke selatan dan mengambil alih koloni Barat yang kaya sumber daya. Dengan serangan yang cepat dan tegas ini, kita seharusnya bisa mengurangi kemampuan musuh untuk bertarung bahkan sebelum serangan dimulai dengan benar. Tennoheika Banzai!"
 JAP_occupy_east_timor: "Menduduki Timor Timur"
 JAP_occupy_east_timor_desc: "Masyarakat Timor, meski saat ini tidak ikut berperang dalam perang kita, masih perlu ikut membantu demi masa depan Asia. Pasukan kami bersiap-siap di pulau-pulau tersebut, dan kami siap untuk bergerak cepat tanpa deklarasi perang apa pun, dengan harapan hal ini tidak diketahui."
 JAP_occupy_east_timor_tt: "§RHal ini dapat menyebabkan perang dengan pemilik [721.GetName]!§!"
 JAP_revisit_the_thirteen_demands: "Tinjau kembali Dua Puluh Satu Tuntutan" # Could also be the 13 demands (the revised list)
 JAP_revisit_the_thirteen_demands_desc: "Selama Perang Besar, pemerintah kita mengajukan serangkaian tuntutan kepada Republik Tiongkok agar menguasai jalur kereta api mereka dan banyak lagi. Meskipun pada awalnya termasuk di dalamnya, hal-hal seperti suara yang tegas dalam bidang keuangan, kepolisian, dan urusan pemerintahan ditolak, dan akhirnya ditandatangani dan hanya tersisa tiga belas tuntutan. Kita harus kembali ke gagasan ini, dan menegaskan diri kita sebagai penguasa Asia Timur."
 JAP_invest_in_senbu: "Berinvestasilah di Senbu"
 JAP_invest_in_senbu_desc: "Organisasi Senbu kami, yang sering kali berbentuk sekolah, tim medis, dan pusat distribusi makanan, merupakan jenis operasi perang psikologis yang dimaksudkan untuk menenangkan penduduk lokal di wilayah pendudukan. Sejauh ini mereka terbukti efisien dalam menenangkan Manchuria, dan mungkin kita harus memperluas operasi mereka hingga mencakup wilayah Tiongkok lainnya."
 JAP_unlock_senbu_occupation_law_tt: "Membuka hukum pekerjaan di negara bagian §YTiongkok§!:\n"
 JAP_establish_mongol_military_government: "Mendirikan Pemerintahan Militer Mongol"
 JAP_establish_mongol_military_government_desc: "Pangeran De, keturunan Jenghis Khan Agung, memegang posisi kuat dalam Dewan Pailingmiao, kepemimpinan boneka Kuomintang di Mongolia Dalam. Dia ingin mengembalikan bangsa Mongol ke kejayaannya, dan akan sangat bersedia memihak kita dalam membentuk Pemerintahan Militer Mongol jika kita berjanji untuk memenuhi ambisinya."
 JAP_launch_the_suiyuan_campaign: "Luncurkan Kampanye Suiyuan"
 JAP_launch_the_suiyuan_campaign_desc: "Tentara Mongolia Dalam dan Tentara Benar Grand Han siap melancarkan operasi ke wilayah panglima perang [SHX.GetLeader], asalkan mereka mendapat dukungan udara dan pengawasan kami oleh perwira staf Jepang. Mungkin kita bisa mengamankan lebih banyak wilayah Mongolia Dalam tanpa menimbulkan perang skala besar di Tiongkok."
 JAP_launch_the_suiyuan_campaign_tt: "Dengan dukungan kami, §YTentara Mongolia Dalam§! dan §YTentara Agung Han yang Benar§! akan melancarkan serangan untuk merebut §Y[621.GetName]§! dari pasukan Kuomintang, namun hanya memiliki waktu yang sempit sebelum operasi tersebut perlu dihentikan."
 JAP_reorganize_the_united_autonomous_government: "Pemerintahan Otonomi Bersatu"
 JAP_reorganize_the_united_autonomous_government_desc: "Pemerintahan Militer Mongol saat ini hanya memiliki organisasi politik yang belum sempurna, dan tidak akan bertahan lama tanpa campur tangan kami. Kita harus mengatur kembali mereka menjadi Pemerintahan Otonomi Bersatu Mongol, sehingga mereka dapat memantapkan diri mereka sebagai negara yang berdaulat dengan baik."
 JAP_mengjiang_united_autonomous_government: "Pemerintahan Otonomi Mengjiang"
 JAP_mengjiang_united_autonomous_government_desc: "Untuk melegitimasi klaim Pangeran De atas seluruh Mongolia Dalam, kita harus mengatur ulang pemerintahan negara bagian tersebut menjadi Pemerintahan Otonomi Bersatu Mengjiang sehingga mereka dapat melepaskan ikatan orang-orang Mongol di dalam perbatasan Tiongkok untuk selamanya di bawah satu bendera."
 JAP_mongol_autonomous_state: "Negara Otonomi Mongolia"
 JAP_mongol_autonomous_state_desc: "[MON.GetNameDefCap] mengaku sebagai pemerintah Mongolia yang sebenarnya, namun gagasan ini ditentang keras oleh Pangeran De. Kita harus mengatur ulang lebih lanjut dan mengganti nama wilayah kekuasaannya, sehingga ia dapat memberikan klaim yang lebih sah atas seluruh wilayah Mongol."
 JAP_reinforce_the_beijing_garrison: "Perkuat Garnisun Hebei Timur"
 JAP_reinforce_the_beijing_garrison_desc: "Pemerintahan Otonomi Hebei Timur didirikan setelah kita menaklukkan Tembok Besar Tiongkok, dengan Tentara Hebei Timur mereka hadir untuk menegakkan demiliterisasi wilayah [CHI.GetAdjective]. Kita harus secara proaktif memperkuat unit ini dan garnisun Kwantung di wilayah tersebut, sehingga tidak jatuh ke dalam [CHI.GetAdjective] agresi."
 JAP_reinforce_the_beijing_garrison_tt: "§RDapat menyebabkan perang dengan [CHI.GetNameDef]§!"
 JAP_develop_the_chinese_resources: "Kembangkan Sumber Daya Tiongkok"
 JAP_develop_the_chinese_resources_desc: "Dengan banyaknya wilayah Tiongkok yang telah dikuasai, kita sekarang harus mengembangkan sumber daya Tiongkok yang kaya agar dapat berguna untuk perang berikutnya."
 JAP_form_the_jikyoku_iinkai: "Bentuklah Jikyoku Iinkai"
 JAP_form_the_jikyoku_iinkai_desc: "Untuk lebih mengontrol impor dan ekspor ke dan dari [USA.GetNameDef], serta berupaya meyakinkan masyarakat [USA.GetAdjective] untuk memihak kita selama [CHI.GetNameDef], kita harus membentuk Komite Perdagangan dan Informasi Jepang."
 japanese_committee_on_trade_and_information_pom: "Komite Perdagangan dan Informasi Jepang"
 JAP_strategic_offensives: "Serangan Strategis"
 JAP_strategic_offensives_desc: "[CHI.GetNameDefCap] terbukti sangat sulit untuk ditembus, dan komando tinggi kami telah menyerukan serangan yang lebih terkoordinasi, menargetkan berbagai tempat menarik. Dengan adanya Gekokujo yang menggagalkan kepentingan-kepentingan kita yang lebih tinggi, pertama-tama kita harus membatasi mereka, sehingga kita akhirnya bisa menjalankan operasi ini."
 JAP_strategic_offensives_tt: "Membuka keputusan untuk §YMeluncurkan Serangan§! yang memberikan bonus sementara di §YAmerika Serikat§!"
 JAP_intensify_anti_guerilla_operations: "Mengintensifkan Operasi Anti-Gerilya"
 JAP_intensify_anti_guerilla_operations_desc: "Gerilyawan dan penyusup menghambat kemajuan dan keberhasilan kampanye militer kita di Tiongkok, dan menyerang kita di tempat yang paling menyakitkan. Kita harus bersiap melakukan serangan terkoordinasi terhadap para bandit ini, dan menyingkirkan sel-sel mereka dari wilayah kita, dengan satu atau lain cara!"
 JAP_intensify_anti_guerilla_operations_tt: "Mengurangi separuh biaya pengambilan keputusan §Y$PRC_root_out_guerilla_fighters$§!, dan memungkinkan pengurangan perlawanan untuk sementara di negara-negara di mana Gerilyawan telah dibasmi"
 JAP_reorganized_national_government: "Pemerintahan Nasional yang Direorganisasi"
 JAP_reorganized_national_government_desc: "Telah menjadi perhatian kami bahwa banyaknya pemerintahan lokal yang dibentuk oleh tentara kami, serta pendudukan langsung di pedesaan Tiongkok, sangat merugikan kami. Kita harus menyatukan pemerintah-pemerintah ini, dan membentuk Pemerintahan Nasional yang Direorganisasi."
 JAP_reorganized_national_government_tt: "Membuka keputusan untuk §YMengkonsolidasikan§! §YKepemilikan China§! kami"
 JAP_occupy_macau: "Menempati Makau"
 JAP_occupy_macau_desc: "Makau adalah kota berbahaya yang harus dibiarkan di luar kendali kita jika kita ingin melanjutkan perjuangan kita melawan penjajah di barat. Ini mungkin berfungsi sebagai titik awal untuk memotong pasukan kita dan memasok musuh melalui udara dan laut. Oleh karena itu, kita harus turun tangan dan segera mendudukinya, sebelum hal itu menjadi kehancuran yang tidak terduga."
 JAP_an_expedition_to_tibet: "Ekspedisi ke Tibet"
 JAP_an_expedition_to_tibet_desc: "Untuk lebih memahami apakah kita bisa meyakinkan pemerintah [TIB.GetAdjective] untuk memihak kita dalam konflik yang lebih besar di Asia, kita harus memulai misi intelijen untuk menjalin kontak dengan mereka. Namun karena peraturan mereka yang ketat mengenai siapa yang boleh masuk, kami harus mengirim Jinzō Nomoto yang menyamar sebagai orang Mongolia dan menemani seorang biksu Tibet."
 JAP_an_expedition_to_tibet_tt: "Membuka keputusan untuk §YMempengaruhi Tibet§! dengan tujuan mengubahnya menjadi §YSubjek Bahasa Jepang§!"
 JAP_ally_the_dragon_king: "Sekutu Raja Naga"
 JAP_ally_the_dragon_king_desc: "Raja Naga Bhutan memerintah kerajaan Tibet yang terpencil dan terisolasi, tapi mungkin dia bisa melihat gambaran yang lebih besar. Kita harus berusaha mengirimkan delegasi resmi ke Punakha, untuk meyakinkan dia agar bergabung dengan kita dalam pembebasan Asia."
 JAP_claim_the_raven_crown: "Klaim Mahkota Raven"
 JAP_claim_the_raven_crown_desc: "Kaisar Surgawi kita berdiri di atas segalanya, dan mereka yang tidak melihatnya seperti ini harus dihancurkan. Kita harus menyerang [BHU.GetNameDef] dan mengklaim takhta mereka untuk diri kita sendiri."
 JAP_ally_the_gorkhas: "Sekutu Gorkha"
 JAP_ally_the_gorkhas_desc: "Raja Nepal memerintah kerajaannya di rangkaian pegunungan tertinggi di dunia, dan sebagian besar terputus dari kontak dengan pihak asing. Mungkin dia bisa melihat alasannya. Kita harus berusaha mengirimkan delegasi resmi ke Kathmandu, untuk meyakinkan dia agar bergabung dengan kita dalam pembebasan Asia."
 JAP_claim_the_scripech: "Klaim Shripechnya"
 JAP_claim_the_scripech_desc: "Kaisar Surgawi kita berdiri di atas segalanya, dan mereka yang tidak melihatnya seperti ini harus dihancurkan. Kita harus menyerang [NEP.GetNameDef] dan mengklaim takhta mereka untuk diri kita sendiri."
 JAP_ally_afghanistan: "Sekutu Barakzai"
 JAP_ally_afghanistan_desc: "Raja Afganistan memerintah berbagai suku Afganistan di salah satu wilayah pegunungan yang paling keras di dunia. Mungkin dia bisa melihat alasannya. Kita harus berusaha mengirim delegasi resmi ke Kabul, untuk meyakinkan dia agar bergabung dengan kita dalam pembebasan Asia."
 JAP_best_the_graveyard: "Kuburan Terbaik"
 JAP_best_the_graveyard_desc: "Kaisar Surgawi kita berdiri di atas segalanya, dan mereka yang tidak melihatnya seperti ini harus dihancurkan. Kita harus menyerang [AFG.GetNameDef] dan mengklaim takhta mereka untuk diri kita sendiri."
 JAP_form_the_central_economic_council: "Bentuk Dewan Ekonomi Pusat"
 JAP_form_the_central_economic_council_desc: "Untuk mengatasi kemerosotan ekonomi yang dihadapi negara kita akibat ketidakstabilan politik dan perang, kita harus membentuk badan penasehat khusus kepada Perdana Menteri dengan tujuan untuk menyelidiki dan mempertimbangkan kebijakan ekonomi antara wilayah dalam dan luar negeri serta rencana dasar penerapannya."
 JAP_expand_the_showa_research_association: "Perluas Asosiasi Riset Showa"
 JAP_expand_the_showa_research_association_desc: "Shōwa Kenkyūkai, sebuah wadah pemikir politik yang didirikan untuk menghasilkan ide-ide inovatif untuk reformasi politik dengan meninjau dan menilai isu-isu dalam Konstitusi Meiji, telah memperluas zona kepentingannya dan membentuk subkelompok baru. Kita harus mendorong hal ini, sehingga mereka dapat mengembangkan teknologi dan cara baru untuk mendominasi Asia."
 JAP_form_the_great_japan_industrial_patriotic_association: "Asosiasi Patriotik Industri Besar Jepang"
 JAP_form_the_great_japan_industrial_patriotic_association_desc: "Para industrialis dan serikat pekerja di negara kita terpecah dan tidak efisien, sehingga menghambat pembangunan ekonomi kita. Kita harus menyatukan semua ini di bawah satu payung organisasi, sehingga industri kita dapat berjalan seefisien mungkin, dan mengarah pada perluasan lebih lanjut."
 JAP_sea_guide_the_zaibatsus: "Pandu Zaibatsus"
 JAP_sea_guide_the_zaibatsus_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya. Dengan sedikit kemahiran, kita mungkin dapat mengarahkan upaya mereka demi kepentingan kita, dan mengatur ulang kepemimpinan mereka ke dalam kelompok-kelompok yang berada di bawah kendali kita yang lebih luas."
 JAP_form_cabinet_intelligence_bureau: "Bentuk Biro Intelijen Kabinet"
 JAP_form_cabinet_intelligence_bureau_desc: "Perdana Menteri [ROOT.GetLeader] secara pribadi telah meminta agar organisasi pemerintah fokus pada peningkatan opini publik pro-Jepang dan memastikan bahwa setiap warga negara berkontribusi semaksimal mungkin dalam perang dan pertahanan negara besar kita. Nobuhumi Ito telah menerima permintaannya, dan hanya membutuhkan perintah resmi untuk mendirikan biro tersebut."
 JAP_crackdown_on_foreign_agents: "Tindakan Keras terhadap Agen Asing"
 JAP_crackdown_on_foreign_agents_desc: "Biro Intelijen Kabinet telah menemukan banyak orang mencurigakan yang bersembunyi. Beberapa di antaranya merupakan ideologi yang tidak diinginkan, dan beberapa di antaranya jelas-jelas merupakan agen kekuatan asing. Mungkin ini saatnya bagi biro tersebut untuk mulai mengambil tindakan, dan memulai kampanye untuk melindungi negara kita dan rakyatnya?"
 JAP_crackdown_on_foreign_agents_tt: "§YTokkō§! akan menjadi lebih aktif dalam menangkap para pembangkang dan mata-mata dalam upaya memperkuat keamanan dan stabilitas nasional"
 JAP_found_the_great_japan_press_association: "Mendirikan Asosiasi Pers Besar Jepang"
 JAP_found_the_great_japan_press_association_desc: "Biro Intelijen Kabinet telah menemukan cara untuk mengarahkan masyarakat kita ke arah yang benar dengan lebih efisien. Dengan membentuk Great Japan Press Association (Asosiasi Pers Besar Jepang), kita dapat memiliki satu kantor yang mengontrol semua media di negara ini, secara efektif menyensor informasi apa pun yang kita perlukan, dan menyebarkan propaganda patriotik kepada mereka yang mungkin membutuhkannya."
 JAP_empower_the_thought_police: "Memberdayakan Polisi Pikiran"
 JAP_empower_the_thought_police_desc: "Polisi Tinggi Khusus, ada dengan tujuan melaksanakan penegakan hukum perdata, pengendalian kelompok politik dan ideologi yang dianggap mengancam ketertiban umum Kekaisaran Jepang, kontra intelijen, investigasi kriminal dalam negeri, kepolisian tinggi, dan keamanan publik. Kita harus memperkuat organisasi ini, sehingga mereka dapat melakukan pekerjaan ini dengan lebih efisien."
 JAP_sea_state_general_mobilization_law: "Undang-undang Mobilisasi Umum Negara Bagian"
 JAP_sea_state_general_mobilization_law_desc: "Telah menjadi perhatian kita bahwa kita perlu menempatkan perekonomian nasional pada kondisi perang, sehingga kita tidak ketinggalan dalam pengembangan senjata. Melalui undang-undang baru ini, kita bisa mendapatkan kontrol pemerintah atas organisasi sipil dan serikat buruh, nasionalisasi industri strategis, pengendalian harga dan kemampuan untuk menerapkan penjatahan jika diperlukan."
 JAP_sea_state_general_mobilization_law_tt: "Membuka kemampuan untuk menuju ke §Y$closed_economy$§! meskipun §YNon-Blok§!"
 JAP_issue_the_ten_commandments_for_marriage: "Sepuluh Perintah Pernikahan"
 JAP_issue_the_ten_commandments_for_marriage_desc: "Pejabat kami telah membuat slogan baru 'Berbuahlah dan berkembang biak' sebagai bagian dari kampanye baru mereka untuk meningkatkan populasi [ROOT.GetAdjective], karena jumlah populasi kami yang relatif rendah dibandingkan dengan banyak negara lawan kami. Kita harus mendukung inisiatif ini."
 JAP_enact_religious_organizations_law: "Menetapkan UU Ormas"
 JAP_enact_religious_organizations_law_desc: "Untuk mengarahkan perhatian masyarakat terhadap hal-hal yang benar, dan memastikan dukungan mereka yang tak tergoyahkan untuk mencapai tujuan [ROOT.GetAdjective], kita harus mengumumkan undang-undang yang akan memberikan otoritas negara kendali atas semua organisasi keagamaan di negara ini."
 JAP_new_order_movement: "Gerakan Orde Baru"
 JAP_new_order_movement_desc: "Kita harus membentuk organisasi nasional dalam urusan dalam negeri yang meniru negara satu partai di barat, untuk memobilisasi negara untuk berperang melawan Kekuatan Kolonial dan mencegah komunisme dengan menolak jalur kapitalis modern yang dimulai dengan Restorasi Meiji. Masalah ini kini menjadi lebih mendesak dibandingkan sebelumnya, karena jika kita tidak segera menindaklanjutinya, kita bisa ketinggalan bus."
 JAP_sea_tripartite_pact: "Usulkan Pakta Tripartit"
 JAP_sea_tripartite_pact_desc: "Ketika musuh-musuh kita bersatu melawan kita, tugas untuk mengalahkan mereka menjadi semakin sulit. Kita harus menjangkau negara-negara lain yang memiliki tujuan serupa, sehingga kita dapat terlibat dalam kerja sama."
 JAP_sea_mil_tech_coop_with_germany: "Kerjasama Militer dengan Jerman"
 JAP_sea_mil_tech_coop_with_germany_desc: "Kita membutuhkan teknologi yang lebih baik untuk menyatukan dunia dalam satu atap. Jerman tidak hanya merupakan mitra historis dalam pengembangan teknologi bagi kami, namun juga memiliki banyak kemajuan teknologi militer yang akan sangat berguna bagi upaya perang kami. Kita harus berusaha mendapatkan skema ini, berapa pun biayanya!"
 JAP_imperial_rule_assistance_association: "Asosiasi Bantuan Aturan Kekaisaran"
 JAP_imperial_rule_assistance_association_desc: "Karena adanya ancaman baik dari dalam maupun luar negeri, dan perpecahan dalam pemerintahan sipil, kita harus membentuk Taisei Yokusankai untuk mewujudkan sistem politik yang statis dan para-fasis dengan tujuan menghilangkan sectionalisme dan faksionalisme dari politik dan ekonomi, menciptakan negara satu partai totaliter untuk memaksimalkan efisiensi doktrin perang total kita."
 JAP_form_the_yokusan_sonendan: "Bentuk Yokusan Sonendan"
 JAP_form_the_yokusan_sonendan_desc: "Untuk melindungi kedaulatan negara kita, kita membutuhkan lebih banyak orang yang tidak hanya bersedia berjuang untuk kita, tetapi juga mengambil bagian dalam penjagaan dalam negeri untuk membantu urusan pertahanan sipil di bawah arahan pemerintah resmi setempat. Untuk mencapai tujuan tersebut, kita harus membentuk cabang pemuda paramiliter elit dari Asosiasi Bantuan Pemerintahan Kekaisaran, 'Yokusan Sonendan'."
 JAP_integrate_the_great_japan_youth_party: "Integrasikan Partai Pemuda Besar Jepang"
 JAP_integrate_the_great_japan_youth_party_desc: "Partai Pemuda Besar Jepang, sebuah organisasi pemuda nasionalis yang meniru gerakan pemuda Jerman, belum sepenuhnya berada di bawah kendali kami, dan bertindak sebagai pihak ketiga yang independen di bawah pimpinan Kolonel Kingoro Hashimoto. Kita harus mengendalikan mereka, dan menempatkan mereka di bawah kendali Taisei Yokusankai."
 JAP_sea_national_defense_state: "Negara Bela Negara"
 JAP_sea_national_defense_state_desc: "[ROOT.GetLeader] telah memproklamirkan Shintaisei, menjadikan Jepang sebagai Negara Pertahanan Nasional, yang mana setiap pria, wanita, dan anak-anak harus dimobilisasi untuk melindungi negara. Berdasarkan UU Mobilisasi Nasional, pemerintah juga diberi kekuasaan mutlak atas aset negara. Melalui ini, Kekaisaran akan mampu bertahan selamanya!"
 JAP_gain_national_defense_state_remove_total_mob_tt: "§RHapus§! §Y$tot_economic_mobilisation$§!. Dapatkan §Y$national_defense_state$§!."
 JAP_formalize_the_tonarigumi: "Formalisasikan Tonarigumi"
 JAP_formalize_the_tonarigumi_desc: "Asosiasi Lingkungan telah ada secara informal selama beberapa waktu, membantu mengalokasikan barang-barang jatah, mendistribusikan obligasi pemerintah, pemadaman kebakaran, kesehatan masyarakat, pertahanan sipil, mendistribusikan propaganda mobilisasi spiritual, memberi tahu Tokkō tentang pembangkangan politik dan mengawasi pantai untuk aktivitas mencurigakan. Kita harus memformalkannya, sehingga kita bisa mengalokasikan lebih banyak dana untuk kelompok-kelompok ini."
 JAP_formalize_the_tonarigumi_tt: "Membuka keputusan untuk §YMengatur Tonarigumi§! dalam mata pelajaran kami"
 JAP_ichioku_isshin: "Ichioku Isshin"
 JAP_ichioku_isshin_desc: "Seperti salah satu slogan Taisei Yokusankai, orang-orang [ROOT.GetAdjective] benar-benar 'Seratus Juta, Satu Hati'. Meskipun rakyat kita semua adalah bawahan Kaisar, mereka semua berdiri bersama sebagai satu kesatuan, dengan hati dan pikiran mereka menjadi satu."
 JAP_issue_the_senjinkun_military_code: "Mengeluarkan Kode Militer Senjinkun"
 JAP_issue_the_senjinkun_military_code_desc: "Kode militer berukuran saku 'Petunjuk untuk Medan Perang' harus dikeluarkan untuk setiap prajurit [ROOT.GetAdjective], untuk mempersiapkan mereka menghadapi konflik bertahun-tahun yang akan datang. Mereka harus diajari peraturan militer, kesiapan tempur, semangat korps, kesalehan berbakti, serta penghormatan terhadap kami Shinto dan kokutai. 'Jangan pernah hidup untuk mengalami rasa malu sebagai tahanan, hormatilah sebelum menyerah!'"
 cost_reduced_last_stand_2: "Memungkinkan penggunaan kemampuan perintah §YLast Stand§! dengan biaya yang jauh lebih rendah, sekaligus memperpanjang durasinya §G3§! hari\n"
 JAP_issue_the_shinmin_no_michi_manifesto: "Keluarkan Manifesto 'Shinmin no Michi'"
 JAP_issue_the_shinmin_no_michi_manifesto_desc: "Orang-orang kita perlu diajari cara mempelajari mata pelajaran. Hal ini akan dilakukan melalui sebuah manifesto ideologis yang ditujukan kepada rakyat untuk menjelaskan dengan jelas apa yang diharapkan dari mereka 'sebagai rakyat dan bangsa'. Penerbitan manifesto tersebut akan menjadi tanggung jawab Kementerian Pendidikan."
 JAP_sea_greater_east_asian_co_properity_sphere: "Lingkungan Kemakmuran Bersama Asia Timur Raya"
 JAP_sea_greater_east_asian_co_properity_sphere_desc: "Kita harus membentuk persatuan di Asia untuk menjamin swasembada ekonomi dan kerja sama di antara negara-negara anggota, serta melawan pengaruh imperialisme Barat dan komunisme Soviet. Tentu saja, ini adalah alat propaganda yang efektif untuk menegakkan hegemoni kami di benua ini."
 JAP_CHI_pact_is_active_flag: "Aliansi Tiongkok-Jepang Berlaku"
 JAP_unlock_east_asia_occupation_law_tt: "Membuka hukum pekerjaan di negara bagian §YAsia§!:\n"
 JAP_sea_greater_east_asian_co_properity_sphere_tt: "Menjadi §G25%§! lebih murah untuk membebaskan dan mendalangi negara-negara §YAsia§! dan §YOceanian§!."
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt: "Membuka Keputusan untuk §YMembentuk Rezim Boneka§! di seluruh Asia Tenggara"
 JAP_expand_japan_manchukuo_economic_bloc: "Blok Ekonomi Jepang-Manchukuo"
 JAP_expand_japan_manchukuo_economic_bloc_desc: "Kita harus mengambil inisiatif untuk membangun blok ekonomi antara kita dan rakyat kekaisaran kita, untuk meningkatkan perekonomian kita dan mengamankan bahan-bahan strategis yang cukup, seperti besi, batu bara, kapas, dan garam."
 JAP_develop_the_yen_bloc: "Mengembangkan Blok Yen"
 JAP_develop_the_yen_bloc_desc: "Kita harus lebih menekankan aspek ekonomi dalam Kawasan Kemakmuran Bersama Asia Timur Raya. Perekonomian Asia harus terintegrasi dan semua negara harus mengadopsi Yen sebagai mata uangnya. Hal ini dapat dicapai dengan melanjutkan pengembangan blok yen Jepang–Manchukuo–Tiongkok sekaligus menyempurnakannya."
 JAP_develop_the_yen_bloc_tt: "Membuka keputusan untuk §YMengintegrasikan Perekonomian§! §YSekutu Asia§! kita"
 JAP_east_asia_development_board: "Dewan Pembangunan Asia Timur"
 JAP_east_asia_development_board_desc: "Pembentukan Kōain akan membantu mengoordinasikan kebijakan pemerintah Tiongkok, yang dirancang untuk mensponsori pembangunan industri dan komersial di Tiongkok guna meningkatkan dukungan terhadap pemerintahan Jepang di wilayah pendudukan. Hal ini juga dapat digunakan sebagai alat untuk menjamin ketersediaan tenaga kerja di industri pertambangan dan perang."
 JAP_east_asia_development_board_tt: "Membuka keputusan untuk memulai §YProyek Industri§! di sekutu kami"
 JAP_ministry_of_greater_east_asia: "Kementerian Asia Timur Raya"
 JAP_ministry_of_greater_east_asia_desc: "Dengan mendirikan Daitōashō, kita akan dapat mengelola wilayah luar negeri yang diperoleh di Pasifik dengan lebih efisien, serta mengoordinasikan pembentukan dan pengembangan Lingkungan Kemakmuran Bersama Asia Timur Raya."
 JAP_the_flying_geese: "Angsa Terbang"
 JAP_the_flying_geese_desc: "Perkembangan teknologi di Asia Tenggara hanya dapat dipimpin oleh perkembangan teknologi kita sendiri, dan negara-negara Asia akan mengejar ketertinggalan dari negara-negara Barat sebagai bagian dari hierarki regional di mana produksi barang-barang yang menjadi komoditas akan terus berpindah dari negara-negara yang lebih maju ke negara-negara yang kurang maju. Sama seperti angsa dalam formasi V, kita akan memimpin jalan bagi pembangunan Asia!"
 JAP_greater_east_asia_railroad: "Jalur Kereta Api Asia Timur Raya"
 JAP_greater_east_asia_railroad_desc: "Insinyur terkemuka kami telah mendapatkan ide untuk membangun jalur kereta api yang menghubungkan Jepang dengan daratan Asia dan Eropa, termasuk terowongan atau jembatan yang menghubungkan negara kami dengan wilayah milik Korea. Mendapatkan ide dari Kereta Api Manchuria Selatan, kereta peluru kami akan berangkat dari Tokyo ke Rangoon, dan seterusnya ke Teheran. Semoga kerajaan kita bertahan selamanya!"
 JAP_greater_east_asia_railroad_tt: "Setiap negara bagian yang kita kendalikan atau sekutu kita yang memiliki kurang dari §Y2 Infrastruktur§! akan mendapatkan §G1§! §YInfrastruktur§!"
 JAP_promote_pan_asianism: "Mempromosikan Pan-Asianisme"
 JAP_promote_pan_asianism_desc: "Impian negara Asia yang bersatu kini semakin dekat untuk tercapai dibandingkan sebelumnya, berkat prestasi para prajurit kita yang gagah berani dan inisiatif yang diambil dalam lingkup Kemakmuran Bersama Asia Timur Raya. Sekali lagi, negara-negara barat akan diperlihatkan bahwa Asia bukan sekadar wilayah yang dapat mereka manfaatkan, namun juga wilayah yang akan mampu bersaing dengan kerajaan-kerajaan terbesar sekalipun dalam imajinasi terliar mereka."
 JAP_promote_pan_asianism_tt: "Membuka keputusan untuk §YMengintegrasikan§! negara-negara maju di Asia dengan tujuan §YMenyatukan Asia§! di bawah satu negara"
 JAP_tojos_premiership: "Liga Utama Tojo"
 JAP_tojos_premiership_desc: "Dengan situasi yang terjadi saat ini, sangatlah penting untuk memilih seorang Perdana Menteri yang dapat mendukung IJA, dan memimpin sebagai pemimpin militer dan juga pemimpin sipil. Dengan demikian, Jenderal Hideki Tōjō akan dipilih untuk memimpin bangsa menuju kejayaan."
 JAP_tojos_premiership_tt: "Bukan Negara Tiongkok"
 JAP_yamamotos_premiership: "Liga Utama Yamamoto"
 JAP_yamamotos_premiership_desc: "Dengan situasi yang terjadi saat ini, sangatlah penting untuk memilih seorang Perdana Menteri yang dapat mendukung IJN, dan memimpin sebagai pemimpin militer dan juga sebagai pemimpin sipil. Dengan demikian, Laksamana Isoroku Yamamoto akan dipilih untuk memimpin bangsa menuju kejayaan."
 JAP_yamamoto_shot_down_flag: "Yamamoto ditembak jatuh dan dibunuh"
 JAP_the_crysanthemum_throne: "Tahta Krisan"
 JAP_the_crysanthemum_throne_desc: "Faksi-faksi dalam militer kita terlalu banyak bertengkar, dan tidak dapat mencapai kesepakatan mengenai siapa yang akan dipromosikan menjadi Perdana Menteri berikutnya. Karena situasi sedang bergejolak, mungkin lebih bijaksana jika Kaisar turun tangan dan mengambil kendali langsung atas situasi tersebut."
 JAP_solidify_tohokai_rule: "Perkuat Aturan Tohokai"
 JAP_solidify_tohokai_rule_desc: "Dengan naiknya Nakano menjadi Perdana Menteri, faksi Tōhōkai dalam Asosiasi Bantuan Pemerintahan Kekaisaran menjadi yang terbesar. Sekarang, kita mempunyai kesempatan untuk benar-benar memperkuat kekuasaan di bawah Society of the East, dan mengamankan peran Nakano dalam politik [ROOT.GetAdjective] di tahun-tahun mendatang!"
 JAP_national_defense_brotherhood: "Persaudaraan Pertahanan Nasional"
 JAP_national_defense_brotherhood_desc: "Untuk mendanai upaya perang kita, Nobusuke Kishi dan Hideki Tōjō telah menyusun rencana untuk Gokoku Doshikai, sebuah organisasi politik untuk mengoordinasikan strategi keuangan dan inisiatif industri negara dengan lebih baik. Namun pasangan ini cukup kontroversial, dan banyak masalah yang mungkin terjadi pada Persaudaraan Pertahanan Nasional."
 JAP_supreme_council_for_direction_of_war: "Dewan Tertinggi untuk Pengarahan Perang"
 JAP_supreme_council_for_direction_of_war_desc: "Pemerintah kita telah menyadari bahwa kita perlu segera menyelenggarakan Konferensi Penghubung Markas Besar Umum-Pemerintah Kekaisaran, setelah melihat kebutuhan mendesak untuk memperkuat koordinasi antara urusan negara dan komando. Mungkin ini akan mampu membawa kita menuju kemenangan."
 JAP_found_the_boeitai: "Menemukan Boeitai"
 JAP_found_the_boeitai_desc: "Dengan semakin realistisnya perang defensif di wilayah kita sendiri, kita harus membentuk semacam Korps Pertahanan yang dapat dimobilisasi dengan cepat untuk mempertahankan Kepulauan Asal kita jika ada serangan musuh. Ini juga mencakup individu yang biasanya tidak bertanggung jawab atas dinas militer di bawah sistem wajib militer Jepang."
 JAP_found_the_boeitai_tt: "Membuka kemampuan untuk merekrut §YMilisi Korps Pejuang Relawan§! di Kepulauan Asal"
 JAP_advance_one_hundred_million_fireballs: "Maju, Seratus Juta Bola Api"
 JAP_advance_one_hundred_million_fireballs_desc: "Asosiasi Bantuan Pemerintahan Kekaisaran telah membuat slogan 'Maju, Seratus Juta Bola Api', yang akan digunakan untuk mengungkapkan kemarahan rakyat terhadap barat dan menumbuhkan semangat juang. Jika pengorbanan dilakukan untuk menjatuhkan musuh-musuh kita, maka penduduk kita pasti akan menyerahkan nyawa mereka demi Kekaisaran!"
 JAP_advance_one_hundred_million_fireballs_tt: "Semangat ini akan hilang jika Stabilitas kita turun di bawah §Y40%§!"
 JAP_joshi_teishin_tai: "Memobilisasi Perempuan [ROOT.GetAdjective]"
 JAP_joshi_teishin_tai_desc: "Korps Relawan Wanita akan didirikan untuk memberikan wanita kesempatan untuk mengabdi pada Kekaisaran sebelum menikah, dan memaksa mereka untuk melakukan tugas kerja di masa perang. Melalui hal ini, lebih banyak warga negara yang dapat dimobilisasi untuk membantu industri di masa perang."
 JAP_the_metal_collection_order: "Pesanan Koleksi Logam"
 JAP_the_metal_collection_order_desc: "Bangsa kita dengan cepat kehabisan bahan-bahan strategis, termasuk logam biasa. Oleh karena itu kita harus memberlakukan Peraturan Kekaisaran No. 667, yang bertujuan untuk mengumpulkan logam-logam yang dimiliki oleh sektor publik dan swasta guna mengimbangi semakin intensifnya situasi perang dan kekurangan bahan."
 JAP_form_the_dai_nippon_fujinkai: "Bentuk Dai Nippon Fujinkai"
 JAP_form_the_dai_nippon_fujinkai_desc: "Yamauchi Sachiko telah mengajukan diri untuk mendirikan Asosiasi Perempuan Besar Jepang, sebuah usulan penggabungan tiga Asosiasi Perempuan nasionalis lainnya, dengan tujuan yang diusulkan untuk memobilisasi perempuan dalam pekerjaan perang; memperkuat moral TNI, menjaga pola hidup hemat guna menyelamatkan sumber daya negara, meningkatkan produksi, dan mendukung TNI."
 JAP_found_the_air_defense_surveilance_corps: "Menemukan Korps Pengawasan Pertahanan Udara"
 JAP_found_the_air_defense_surveilance_corps_desc: "Untuk memastikan deteksi dini serangan pesawat musuh, kita harus memobilisasi warga sipil untuk bertugas di pos pengamatan pertahanan udara yang didirikan di seluruh negeri, dan untuk mendeteksi pesawat musuh pada tahap awal dan melaporkannya kepada pihak berwenang terkait. Hal ini akan diselenggarakan dengan memberlakukan Undang-Undang Pertahanan Udara."
 JAP_fund_propaganda_films: "Mendanai Film Propaganda"
 JAP_fund_propaganda_films_desc: "Angkatan Laut kami telah mengusulkan investasi yang lebih besar ke dalam industri film, untuk memotivasi rakyat kami untuk terus berjuang. Oleh karena itu, mereka mengontrak Laboratorium Gambar Bergerak untuk memproduksi film animasi propaganda yang memperkuat narasi IJN, sekaligus melemparkan IJA ke bawah bus dalam prosesnya."
 JAP_fund_propaganda_films_tt: "Menyegarkan Keputusan §Y[ROOT.GetImportOrDomesticFilmIndustry]§!"
 JAP_fund_propaganda_films_2_tt: "§Y[ROOT.GetImportOrDomesticFilmIndustry]§! dapat memakan waktu ekstra"
 JAP_the_eternal_kingdom: "Kekaisaran Abadi"
 JAP_the_eternal_kingdom_desc: "Jepang adalah negara yang diperintah oleh Kaisar ilahi, dan merupakan negara yang dilindungi oleh para dewa. Dengan bantuan mereka, negara ilahi kita abadi, dan akan berdiri kokoh selamanya. Hidup Yang Mulia Kaisar, dan hidup Kekaisaran Besar Jepang!"
 JAP_the_eternal_kingdom_tt: "Semangat ini akan hilang jika kita mencapai §Y50%§! Surrender Progress"
 JAP_revere_the_emperor_destroy_the_traitors: "Hormati Kaisar, Hancurkan Pengkhianat"
 JAP_revere_the_emperor_destroy_the_traitors_desc: "Hari yang kami rencanakan akhirnya tiba. Pasukan kami telah menguasai Tokyo, dan pembicaraan telah dimulai dengan kaisar untuk meyakinkan dia agar mendukung gerakan kami, meskipun awalnya dia bersikap khawatir. Pada akhirnya, kita akan mampu membersihkan negara kita dari dekadensi Barat, dan mengembalikan kejayaan cara-cara lama!"
 JAP_authorize_aid_to_ethiopia: "Otorisasi Bantuan untuk Ethiopia"
 JAP_authorize_aid_to_ethiopia_desc: "Faksi kami telah menjalin kontak dengan [ETH.GetAdjective] selama bertahun-tahun, yang puncaknya adalah kami mempengaruhi pemerintah untuk membantu modernisasi [ETH.GetNameDef]. Kini mereka mendapati diri mereka sedang diserang oleh kekuatan barat. Kita harus segera mengirimkan bantuan kepada mereka!"
 JAP_establish_the_gunbatsu: "Dirikan Gunbatsu"
 JAP_establish_the_gunbatsu_desc: "Untuk melakukan reorganisasi pemerintahan, pertama-tama kita harus membongkar strukturnya dan membangunnya kembali dari awal. Untuk mencapai hal ini, persiapan telah dimulai untuk membentuk kelompok militer, yang akan membantu kaisar dalam mengatur negara sebagai lingkaran tertutup."
 JAP_grand_army_purge: "Pembersihan Besar Tentara"
 JAP_grand_army_purge_desc: "Untuk memastikan bahwa kekuasaan kita terhadap militer bersifat mutlak, kita harus membersihkan negara dari para pengkhianat yang mencoba mendukung ide-ide oligarki Meiji, dan yang akan menentang dan menggagalkan jalan kita menuju kekuasaan, termasuk para perwira Tōseiha yang tercela yang berusaha mengendalikan kaisar demi keuntungan mereka sendiri. Melalui segala cara yang diperlukan, militer harus dibersihkan dari aktor-aktor jahat ini!"
 JAP_grand_army_purge_tt: "§RMembersihkan§! berbagai §YAnggota Toseiha§! dan pejabat §YSilsilah Samurai§! dan §GMempromosikan§! §YPerwira Muda§! yang ikut serta dalam Kudeta. Komandan terkemuka yang §RDihapus§! meliputi:\n"
 JAP_remove_the_weeds_from_the_crop: "Hapus Gulma dari Tanaman"
 JAP_remove_the_weeds_from_the_crop_desc: "Seperti yang dinyatakan dengan jelas oleh kepala teori politik kita, Sadao Araki; jika gulma tidak disingkirkan, hasil panen yang baik akan rusak. Dengan cara ini, kita harus menghilangkan rumput-rumput liar di pemerintahan yang akan menghambat kemajuan bangsa kita, dan merugikan jiwa kita ketika menjual negara kita kepada para kapitalis dan agen asing. Waktu penyiangan telah dimulai!"
 JAP_can_no_longer_manually_promote_civ_government_tt: "Kami tidak lagi dapat §RMendukung Secara Manual§! §YFraksi Sipil§!"
 JAP_sea_the_showa_restoration: "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_key_emperor_showa: "Restorasi Showa"
 JAP_sea_the_showa_restoration_key_emperor_genka: "Restorasi Genka"
 JAP_sea_the_showa_restoration_desc: "[JAP_sea_the_showa_restoration_desc_key]"
 JAP_sea_the_showa_restoration_emperor_showa_desc: "Akhirnya, era Demokrasi liberal Taishō telah berakhir. Sekali lagi, negara ini akan dipimpin oleh sekelompok kecil orang-orang berkualitas yang mendukung Kaisar yang kuat. Hanya melalui ini negara kita pada akhirnya akan mendapat keselamatan."
 JAP_sea_the_showa_restoration_emperor_genka_desc: "Akhirnya, era Demokrasi liberal Taishō telah berakhir. Sekali lagi, negara ini akan dipimpin oleh sekelompok kecil orang-orang berkualitas yang mendukung Kaisar yang kuat. Hanya melalui ini negara kita pada akhirnya akan mendapat keselamatan."
 JAP_kodoha_the_emperor_cooperated_flag: "§YKaisar Showa§! memilih untuk bekerja sama dengan Kōdōha"
 JAP_hirohito_has_been_killed_flag: "§YHirohito§! telah meninggal"
 JAP_emperor_hirohito_has_abdicated_flag: "§YHirohito§! telah turun tahta"
 JAP_emperor_hirohito_under_house_arrest_flag: "§YHirohito§! telah ditempatkan di bawah §YPenahanan Rumah§!"
 JAP_yasuhito_is_the_current_regent_or_emperor_flag: "§YYasuhito§! telah naik takhta"
 JAP_nobuhito_is_the_current_regent_or_emperor_flag: "§YNobuhito§! telah naik takhta"
 JAP_yasuhito_takes_up_the_throne_tt: "§YYasuhito§! akan menggantikan §YHirohito§! di Pengaruh Kekaisaran"
 JAP_nobuhito_takes_up_the_throne_tt: "§YNobuhito§! akan menggantikan §YHirohito§! di Pengaruh Kekaisaran"
 JAP_an_ode_to_showa_restoration: "Sebuah Ode untuk Restorasi Showa"
 JAP_an_ode_to_showa_restoration_desc: "Perwira angkatan laut Mikami Taku menggubah Syair Restorasi Showa, sebuah tema menakjubkan untuk gerakan kami yang memberikan daya tarik kuat pada citra alam dan religius. Kini setelah kita memulihkan kekuasaan dan menobatkan Kaisar Hirohito serta menghapuskan demokrasi liberal Taishō, kita harus menjadikan ini sebagai lagu kebangsaan kedua."
 JAP_ikki_kitas_state_socialist_ideals: "Cita-cita Sosialis Negara Ikki Kita"
 JAP_ikki_kitas_state_socialist_ideals_desc: "Penulis dan filsuf politik Ikki Kita sangat berpengaruh dan terlibat dalam gerakan kami. Dia berkali-kali mengkritik model kapitalis, dan menggambarkan dirinya sebagai seorang sosialis. Kita harus menerima ide-idenya dan mengatur ulang perekonomian agar lebih sesuai dengan cita-cita ini."
 JAP_oppose_the_zaibatsus: "Menentang Zaibatsus"
 JAP_oppose_the_zaibatsus_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya. Kita harus mengingatkan mereka bahwa mereka masih tunduk pada keinginan Kaisar, dan memastikan kebijakan kapitalis mereka yang rakus tidak terus menerus mencemari jiwa bangsa kita."
 JAP_oppose_the_zaibatsus_tt: "Saat semangat habis:\n"
 JAP_give_it_your_all_for_the_emperor: "Berikan Segalanya Untuk Kaisar!"
 JAP_give_it_your_all_for_the_emperor_desc: "Pria [ROOT.GetAdjective] adalah seorang pekerja keras yang sangat percaya pada kaisar agung kita. Kita harus mempropagandakan hal ini, dan mendorong kerja keras dan kerja keras sebagai bagian inti dari masyarakat [ROOT.GetAdjective]."
 JAP_give_it_your_all_for_the_emperor_tt: "Membuka keputusan untuk Membangun §G1§! §YPabrik Sipil§! di negara bagian inti awal dengan tingkat §Y4§! atau §YInfrastruktur§! yang lebih tinggi.\n§RKeputusan ini hanya dapat diambil satu kali per negara bagian§!"
 JAP_revitalize_rural_areas: "Merevitalisasi Kawasan Pedesaan"
 JAP_revitalize_rural_areas_desc: "Banyak perwira muda dalam gerakan kami berasal dari keluarga miskin dan pedesaan. Untuk mempertahankan dukungan mereka, kita harus berusaha menghentikan depopulasi di pedesaan, dan merevitalisasi daerah pedesaan."
 JAP_nationalize_western_corporations: "Nasionalisasi Perusahaan Barat"
 JAP_nationalize_western_corporations_desc: "Para kapitalis barat yang rakus datang ke negara kita untuk mengeksploitasi rakyat dan sumber daya kita, meninggalkan luka di jiwa nasional yang membutuhkan waktu lama untuk disembuhkan. Kita harus segera memberantas korporasi-korporasi tersebut, dan menasionalisasikan pabrik-pabrik mereka, bahkan jika hal itu berarti membuat marah pihak barat."
 JAP_ally_the_league_of_blood: "Sekutu Liga Darah"
 JAP_ally_the_league_of_blood_desc: "Pengkhotbah Buddha radikal Nichirenisme Nisshō Inoue mendirikan Liga Darah dengan tujuan melenyapkan pengusaha kaya dan politisi liberal, yang kemudian dikenal sebagai Insiden Korps Sumpah Darah. Setelah dibebaskan sejak saat itu, kita harus melakukan kontak dengannya, mengingat dia memiliki cita-cita yang sama."
 JAP_integrate_the_kenkokutai: "Integrasikan Kenkokukai"
 JAP_integrate_the_kenkokutai_desc: "National Foundation Society adalah organisasi anti-komunis, yang sangat dipengaruhi oleh Sosialisme Nasional Motoyuki Takabatake, yang berupaya mewujudkan negara rakyat sejati berdasarkan kebulatan suara antara rakyat dan kaisar. Kita harus merekrut mereka ke dalam pemerintahan kita, karena kita mempunyai tujuan yang sama dengan mereka."
 JAP_contact_the_masterless_samurai: "Hubungi Samurai Tanpa Master"
 JAP_contact_the_masterless_samurai_desc: "Rōninkai adalah kelompok politik anti-demokrasi ultra-nasionalis yang banyak anggotanya berbagi dengan organisasi serupa seperti Dark Ocean Society dan Black Dragon Society. Didirikan oleh Tanaka Hiroyuki pada tahun 1908, perkumpulan rahasia ini kini mempengaruhi sebagian besar politisi sayap kanan kita. Kita harus menjangkau mereka dan membangun hubungan antara mereka dan pemerintah kita."
 JAP_contact_former_sakurakai_members: "Hubungi Mantan Anggota Sakurakai"
 JAP_contact_former_sakurakai_members_desc: "Cherry Blossom Society adalah perkumpulan rahasia ultranasionalis yang didirikan oleh perwira muda pada tahun 1930, yang telah dibubarkan sejak Insiden Imperial Colors. Mereka mempunyai tujuan untuk menata ulang negara menurut garis militer totaliter melalui kudeta militer, jika diperlukan. Kini setelah kita berhasil, kita harus berupaya untuk mengundang kembali beberapa mantan anggota ini ke pemerintahan kita."
 JAP_the_great_spiritual_evil: "Kejahatan Spiritual yang Besar"
 JAP_the_great_spiritual_evil_desc: "Pemberlakuan Undang-Undang Pelestarian Perdamaian telah menjadi langkah awal yang baik dalam upaya kita menghentikan degenerasi komunis yang mempengaruhi pikiran masyarakat kita, namun masih banyak pekerjaan yang harus kita lakukan. Kokutai juga berada di bawah ancaman pemikiran sosialis asing, dan kita harus mengambil pendekatan yang lebih proaktif untuk menghentikan pemikiran ini agar tidak menghancurkan bangsa kita."
 JAP_strike_down_the_enemy_of_the_people: "Hancurkan Musuh Rakyat"
 JAP_strike_down_the_enemy_of_the_people_desc: "Musuh besar masyarakat [ROOT.GetAdjective] adalah komunisme, dan fakta ini tidak akan pernah berubah. Pada dasarnya negara ini tidak bisa hidup berdampingan dengan negara kita, dan dengan demikian hanya satu negara yang bisa bertahan di akhir perang terakhir antara peradaban timur dan barat."
 JAP_strike_down_the_enemy_of_the_people_tt: "Dapatkan tujuan perang §YAnnex§! melawan negara §YKomunis Asia§! mana pun. Target saat ini:"
 JAP_prepare_for_the_final_war: "Bersiaplah untuk Perang Terakhir"
 JAP_prepare_for_the_final_war_desc: "Teknologi menentukan sejarah perang, dan sejarah perang menentukan sejarah. Akan segera terjadi perang terakhir, yang akan ditentukan oleh perang udara. Di masa depan, pesawat akan mampu terbang jarak jauh untuk menyerang langsung ibu kota negara lain. Untuk menghindari hal ini, kita harus menerapkan ekonomi komando baru dengan memberlakukan negara pertahanan nasional satu partai."
 JAP_indoctrination_in_the_military_academy: "Indoktrinasi di Akademi Militer"
 JAP_indoctrination_in_the_military_academy_desc: "Penting agar unsur-unsur radikal di kalangan tentara tidak menentang pemerintah seperti dulu. Kita harus memastikan bahwa disiplin tinggi ditegakkan, dan setiap orang bersumpah setia kepada Kaisar, bukan kepada kelompok atau faksi mana pun!"
 JAP_every_kodoha_member_tt: "Setiap §YSimpatisan Kōdōha§!:"
 JAP_sea_supremacy_of_will: "Supremasi Kehendak"
 JAP_sea_supremacy_of_will_desc: "Peralatan paling canggih tidak ada gunanya tanpa orang yang garang yang menggunakannya, dan keganasan dapat mengubah batu yang paling sederhana menjadi senjata yang paling mematikan. Hanya melalui semangat élan, kultus ofensif, perang dapat dimenangkan."
 JAP_tennoheika_banzai: "Tennoheika Banzai!"
 JAP_tennoheika_banzai_desc: "Serangan Banzai adalah perwujudan semangat juang [ROOT.GetAdjective]. Sebagai bagian dari kurikulum militer, setiap orang akan mengetahui teriakan perang, dan dilatih taktik serangan bayonet. Dengan menggunakan ini, orang-orang kita tidak akan hidup sebagai tawanan perang, namun malah keluar dalam kobaran api kejayaan. Hidup Yang Mulia Kaisar!"
 JAP_a_truly_righteous_army: "Tentara yang Benar-benar Adil"
 JAP_a_truly_righteous_army_desc: "[ROOT.GetAdjective] Tentara Kekaisaran tidak sekadar berperang demi penaklukan atau kejayaan. Ia berjuang demi Kaisarnya, bangsanya, cita-citanya, dan rakyatnya. Setiap prajurit harus mengetahui hal-hal ini, dan menyadari bahwa segala sesuatu yang dilakukannya dalam menjalankan tugas mencerminkan Kaisar dan rakyatnya, dan bagi Yang Mulia, pengorbanan apa pun tidak ada gunanya."
 JAP_supremacy_of_the_kempeitai: "Supremasi Kempeitai"
 JAP_supremacy_of_the_kempeitai_desc: "'Prajurit hukum' kita akan mengambil alih peran Tokkō, yang lebih loyal kepada rezim lama. Kempeitai akan ditugaskan di kepolisian nasional, dan meningkatkan kemampuan pemberantasan pemberontakan, kontra intelijen, dan penindasan pembangkang."
 JAP_sonnou_joui: "Tidak, Joi!" # Sonnō Jōi!
 JAP_sonnou_joui_desc: "Kami sekali lagi menghayati cita-cita Kaisar yang berkuasa pada masa Bakumatsu, dan siap menentang imperialisme asing. Sama seperti Keshogunan Tokugawa yang pernah diusir, kami akan mengusir semua orang yang menentang pemerintahan Kaisar Agung. Hormati Kaisar, usir orang barbar! Inilah waktunya untuk mendapatkan kembali takdir surgawi kita."
 JAP_sonnou_joui_tt: "Semangat ini diperbarui ketika merebut ibu kota negara yang telah kita klaim melalui §YTombak Permata Telah Dipukul§!, §Rjika masih aktif pada saat itu§!."
 JAP_subdue_the_kwantung_army: "Taklukkan Tentara Kwantung"
 JAP_subdue_the_kwantung_army_desc: "Tentara Kwantung telah lama menjadi duri bagi kami karena tidak mendengarkan otoritas kelompok militer kami. Kita harus memastikan bahwa mereka sepenuhnya tunduk kepada kita, melalui promosi taktis dan intimidasi. Pada waktunya, Sadao Araki akan menjadi panglima baru Tentara Kwantung."
 JAP_subdue_the_kwantung_army_tt: "§GMemerintah§! §YTentara Kwantung§! dan memastikan mereka tidak dapat bertindak independen dari keinginan pemerintah kita"
 JAP_subdue_the_kwantung_army_2_tt: "Beberapa Jenderal §YTentara Kwantung§! diturunkan pangkatnya dan pensiun dari dinas aktif:"
 JAP_hasten_the_integration_of_taiwan: "Mempercepat Integrasi Taiwan"
 JAP_hasten_the_integration_of_taiwan_desc: "Upaya integrasi kami terhadap Taiwan telah berjalan dengan baik, hanya dengan beberapa kemunduran besar. Pada waktunya, pulau ini akan menjadi bagian inti Jepang seperti halnya Ryukyu. Namun kita harus bergegas, jika kita ingin segera mengalihkan perhatian kita ke wilayah lain."
 JAP_integrate_the_government_general: "Integrasikan Pemerintahan Umum"
 JAP_integrate_the_government_general_desc: "Otonomi Pemerintahan Jenderal Chōsen merupakan kesalahan besar. Mereka telah terlalu lama membiarkan gerakan perlawanan, sehingga menghancurkan industri kita di wilayah tersebut. Kita harus melakukan intervensi langsung dan menempatkan wilayah Korea langsung di bawah pemerintah pusat."
 JAP_integrate_the_government_general_tt: "Membuka keputusan untuk §YMengintegrasikan Negara-negara Korea§! setelah mereka memiliki kepatuhan yang cukup tinggi"
 JAP_align_the_concordia_association: "Sejajarkan Asosiasi Concordia"
 JAP_align_the_concordia_association_desc: "Asosiasi Concordia, partai politik di bawah kendali kami di Manchuria, menganut cita-cita Pan-Asianisme dan pembentukan negara-bangsa multi-etnis serta menciptakan struktur yang secara bertahap akan menggantikan kekuasaan militer atas Manchukuo dengan kendali sipil. Kita harus mengusulkan penyatuan kedua negara demi kemajuan perjuangan Pan-Asia."
 JAP_integrate_the_great_empire_of_manchuria: "Integrasikan Kekaisaran Manchuria Besar"
 JAP_integrate_the_great_empire_of_manchuria_desc: "Dengan Asosiasi Concordia yang berada di pihak kami, Puyi dan loyalisnya tidak memiliki cukup kekuasaan untuk mencegah kami mengakhiri otonomi mereka. Akhirnya tiba waktunya untuk menyatukan kedua negara kita di bawah satu Kaisar sejati!"
 JAP_MAN_accepted_our_proposal_for_integration: "§Y[MAN.GetNameDefCap]§! Menerima proposal kami untuk unifikasi"
 JAP_integrate_the_great_empire_of_manchuria_tt: "Membuka keputusan untuk §YMengintegrasikan Negara-negara Manchuria§! setelah mereka memiliki kepatuhan yang cukup tinggi"
 JAP_embrace_kokutai: "Rangkullah Kokutai"
 JAP_embrace_kokutai_desc: "Identitas, esensi, dan karakter nasional kita telah terlalu lama diabaikan dan dilemahkan oleh pemerintahan masa lalu, dan hampir hilang seiring berjalannya waktu. Kita harus memastikan bahwa setiap warga [ROOT.GetAdjective] memahami bahwa tugas mereka adalah menjalankan tradisi kita, dan hidup sesuai dengan Kokutai."
 JAP_empower_the_shogun: "Berdayakan Shogun"
 JAP_empower_the_shogun_desc: "Kaisar harus tetap menjalankan peran seremonial, dengan perantara kuat yang bertindak atas namanya. Hal ini tentu akan memungkinkan perkataan Kaisar untuk dilaksanakan lebih jauh dan lebih luas."
 JAP_empower_the_emperor: "Berdayakan Kaisar"
 JAP_empower_the_emperor_desc: "Masa kepemimpinan boneka sudah lama berlalu, dan Kaisar sendiri yang harus mengambil kendali langsung atas negara. Hanya dengan cara itulah Kekaisaran kita mampu melawan imperialis Barat."
 JAP_a_worthy_succssor_of_meiji: "Penerus Meiji yang Layak"
 JAP_a_worthy_succssor_of_meiji_desc: "Kini setelah Restorasi Meiji kedua dilaksanakan, Kaisar kita kembali menjadi orang paling berkuasa di negeri ini. Mungkin akan lebih bijaksana untuk mewujudkan cita-cita revolusi nasional ini, dan berupaya memodernisasi industri dan ilmu pengetahuan kita untuk mewujudkan kebangkitan [ROOT.GetAdjective] yang baru."
 JAP_the_art_of_warfare: "Seni Peperangan"
 JAP_the_art_of_warfare_desc: "Ada banyak ahli taktik dan pejuang hebat yang tercatat dalam legenda dalam sejarah Asia Timur, namun hanya sedikit yang bisa menandingi ahli strategi Sun Tzu. Mungkin dia punya satu atau dua hal yang bisa kita pelajari, sehingga rencana kita bisa menjadi lebih kuat seiring berjalannya waktu."
 cost_reduced_staff_office_planning: "Memungkinkan penggunaan kemampuan perintah §YPaket Kantor Staf§! dengan biaya yang jauh lebih rendah, sekaligus memperpanjang durasinya §G2§! hari\n"
 JAP_the_imperial_colors: "Warna Kekaisaran"
 JAP_the_imperial_colors_desc: "Untuk menghormati rekan-rekan kita yang mencoba dan gagal pada tahun 1931 untuk melakukan kudeta terhadap pemerintahan seperti yang kita lakukan sekarang, kita harus mengubah tanggal 21 Oktober menjadi hari libur nasional, di mana kita mengibarkan bendera kekaisaran dan mengenang pengorbanan yang mereka lakukan atas nama Kaisar kita."
 JAP_utilize_our_polish_friendship: "Manfaatkan Persahabatan Polandia kami"
 JAP_utilize_our_polish_friendship_desc: "Bangsa kami telah menjalin hubungan baik dengan Polandia sejak masa Kekaisaran Rusia ketika kami menampung orang-orang Polandia yang diasingkan ke Siberia. Sejak itu kami bertukar informasi intelijen di [SOV.GetNameDef] dan mengadakan persaingan bersama melawan bangsa. Kita harus meresmikan perjanjian pertahanan dengan mereka, sehingga kita berdua bisa merasa terlindungi dari beruang tersebut."
 JAP_return_to_sakoku_ron: "Kembali ke Sakoku-ron"
 JAP_return_to_sakoku_ron_desc: "Negara kita mengakhiri isolasinya berkat Komodor Perry dan diplomasi kapal perang [USA.GetAdjective]. Melihat pengaruh luar yang kini merusak dan menghancurkan jiwa bangsa, kita harus memberlakukan era isolasi yang kedua."
 JAP_japanese_supremacy_faction: "Lingkungan Jepang"
 JAP_eth_is_invited_to_faction_tt: "§Y[ETH.GetNameDefCap]§! diundang ke faksi kami"
 JAP_the_enemy_of_our_enemy: "Musuh dari Musuh kita"
 JAP_the_enemy_of_our_enemy_desc: "Ancaman [SOV.GetSovietThreatName] terhadap perbatasan utara kita harus diatasi. Kita harus memulai persiapan perang dengan [SOV.GetNameDef]. Cara terbaik untuk melakukan hal ini adalah dengan memperkuat hubungan kami dengan [GER.GetNameDef], yang menurut laporan kami sedang mempersiapkan perang melawan [SOV.GetNameDef]."
 JAP_societal_bushido: "Bushido Masyarakat"
 JAP_societal_bushido_desc: "Jenderal Sadao Araki, telah menghubungkan kode samurai Bushido kuno dengan ide-ide yang mirip dengan fasisme Eropa untuk membentuk landasan filosofis ideologinya, yang menghubungkan Kaisar, rakyat, tanah, dan moralitas sebagai satu dan tak terpisahkan. Untuk mencapai tujuan ini, kita harus mempromosikan kode Bushido sebagai sesuatu yang harus selalu dipatuhi oleh setiap warga negara yang baik."
 JAP_politicize_the_education_system: "Politisasi Sistem Pendidikan"
 JAP_politicize_the_education_system_desc: "Tentara telah lama mengendalikan sistem pendidikan nasional, namun upaya yang dilakukan belum cukup untuk meradikalisasi generasi muda agar dapat bergabung dengan perjuangan kami. Kita harus berinvestasi lebih besar pada indoktrinasi politik, dan meningkatkan pendanaan untuk sistem pendidikan."
 JAP_the_spirit_of_the_imperial_nation: "Semangat Bangsa Kekaisaran"
 JAP_the_spirit_of_the_imperial_nation_desc: "Untuk mengarahkan perhatian orang-orang kita terhadap hal-hal yang benar, dan memastikan dukungan mereka yang tak tergoyahkan untuk mencapai takdir [ROOT.GetAdjective], kita harus mempromosikan Kokutai di setiap kuil, dan mengabadikan [ROOT.GetLeader] di kuil di Tokyo."
 JAP_propagandize_the_nihon_shoki: "Mempropagandakan Nihon Shoki"
 JAP_propagandize_the_nihon_shoki_desc: "The Chronicles of Japan adalah bagian penting untuk menjelaskan sejarah kami, dan merinci mitos-mitos pendirian kami. Kita harus memastikan hal ini diajarkan secara mendalam di sekolah, dan bahwa anak-anak mempelajari hubungan antara penaklukan Jimmu saat itu dan nasib masa depan kita."
 JAP_the_yamato_spirit: "Semangat Yamato"
 JAP_the_yamato_spirit_desc: "[ROOT.GetAdjective] hati dan pikiran masyarakat adalah satu, dihubungkan oleh Jiwa Yamato yang merasuki masyarakat kita. Kita harus memastikan bahwa semua warga negara kita mengetahui kejayaan kita di masa lalu, dan mengetahui apa yang perlu dilakukan untuk kembali ke cara hidup tradisional kita."
 JAP_children_of_the_sun: "Anak-anak Matahari"
 JAP_children_of_the_sun_desc: "Bukan hanya garis keturunan bangsawan kita, namun masyarakat [ROOT.GetAdjective] sendiri, adalah anak-anak matahari. Dewi agung Amaterasu pernah memberi kita tanah ini, dan kita harus bersyukur atas hal itu. Sudah waktunya kita membayar kembali apa yang telah dia berikan kepada kita!"
 JAP_the_footsteps_of_jimmu: "Jejak Jimmu"
 JAP_the_footsteps_of_jimmu_desc: "Pendiri legendaris kami, Kaisar Jimmu meluncurkan ekspedisi militer dari Hyūga dekat Laut Pedalaman Seto, merebut Yamato, dan menjadikan tempat ini sebagai pusat kekuasaannya. Dia memulai Ekspedisi Besar Timur yang memperluas wilayah kami, dipandu oleh Yatagarasu sang dewa gagak. Sebagaimana pejuang ilahi ini pernah menaklukkan atas nama para dewa, demikian pula kita."
 JAP_yatagarasus_guidance: "Bimbingan Yatagarasu"
 JAP_yatagarasus_guidance_desc: "Dewa gagak berkaki tiga Yatagarasu membimbing Jimmu dalam penaklukan besarnya atas Yamato dan Nara, sebagai bagian dari campur tangan ilahi dalam urusan manusia. Karena kita sendiri sangat membutuhkan bimbingan, kita harus menamai sistem baru kita dengan nama dewa bimbingan ini."
 JAP_the_jeweled_spear_has_struck: "Tombak Permata telah Dipukul"
 JAP_the_jeweled_spear_has_struck_desc: "Tombak permata surgawi pernah digunakan oleh dewa asal usul Izanagi dan Izanami untuk mengangkat daratan pertama dari laut. Sama seperti mereka pernah menggunakan tombak yang ditanam untuk mengklaim lahan baru, kita juga akan melakukannya. Waktunya telah tiba untuk melihat di mana tombak surgawi akan menyerang lagi."
 JAP_the_jeweled_spear_has_struck_tt: "Membuka keputusan untuk mengklaim negara bagian §YAsia§! dan mendapatkan §YWargoals§! dari pemiliknya. Kita dapat menargetkan suatu negara untuk melakukan klaim pada suatu waktu, sehingga kita perlu menduduki semua negara bagian yang sudah ada untuk mengklaim lebih banyak."
 JAP_hakko_ichiu: "Hakko Ichiu" # Hakkō Ichiu
 JAP_hakko_ichiu_desc: "Seluruh dunia harus bersatu dalam satu atap! Kami memiliki hak ilahi untuk melakukan hal tersebut di bawah pemerintahan kami, sebagaimana ditahbiskan dalam Nihon Shoki. Pada saat kenaikannya, Kaisar Jimmu menyatakan: 'Saya akan melintasi delapan penjuru dan menjadikannya tempat tinggal saya'. Waktunya telah tiba untuk akhirnya memenuhi keinginannya!"
 JAP_hakko_ichiu_tt: "Membuka keputusan untuk mengintegrasikan negara-negara §YAsia§! yang §YDimiliki§! oleh kami, atau §YDikendalikan dan Diklaim§! oleh kami"
 JAP_embodying_empress_jinguu: "Mewujudkan Permaisuri Jingu" # Embodying Empress Jingū
 JAP_embodying_empress_jinguu_desc: "Sama seperti suami Permaisuri Nagako yang dibunuh, begitu pula suami Permaisuri Jingū. Dia melakukan kampanye balas dendam, lalu mengalihkan perhatiannya ke tanah perjanjian. Setelah tiga tahun dia mengalahkan musuh-musuhnya, dan kembali dengan kemenangan. Kita harus melanjutkan legenda ini, dan menyelesaikannya sampai akhir."
 JAP_to_reach_princess_kaguya: "Untuk Mencapai Putri Kaguya"
 JAP_to_reach_princess_kaguya_desc: "Dalam Kisah Pemotong Bambu, Kaguya-hime, seorang putri dari Bulan ditemukan saat masih bayi di dalam batang tanaman bambu yang bersinar. Di akhir cerita, Kaguya-hime mengungkapkan asal usul surgawinya dan kembali ke Bulan. Kini setelah teknologi tersedia bagi kita, kita harus melakukan segala daya kita untuk menjangkaunya sekali lagi."
 JAP_to_rival_zheng_yi_sao: "Untuk Menyaingi Zheng Yi Sao"
 JAP_to_rival_zheng_yi_sao_desc: "Zheng Yi Sao adalah pemimpin bajak laut legendaris Tiongkok yang aktif di Laut Cina Selatan, menjadi bajak laut wanita paling sukses dalam sejarah. Kita harus menghayati dan bahkan melampaui legenda ini, atas nama Permaisuri Nagako yang agung!"
 JAP_amaterasus_aramitama: "Senjata Aramitama Amaterasu"
 JAP_amaterasus_aramitama_desc: "Salah satu dewa yang membantu Jingū dalam kampanyenya melawan kerajaan Korea adalah roh kekerasan Amatereasu, Tsukisakaki Izu no Mitama Amazakaru Mukatsuhime no Mikoto. Semangat ini menyimpan kekuatan besar Dewi Matahari, sesuatu yang harus kita upayakan untuk memanfaatkannya bagi diri kita sendiri!"
 JAP_okadas_military_purge_speech: "Pidato Pembersihan Militer Okada"
 JAP_okadas_military_purge_speech_desc: "Militer sudah bertindak terlalu jauh kali ini. Jika pembunuhan yang tak terhitung jumlahnya dan upaya menggulingkan pemerintah kita oleh elemen-elemen pinggiran belum cukup, mereka kini juga berusaha menggunakan kejadian baru-baru ini untuk memperkuat kekuasaan mereka sendiri dan merebut kendali negara kita dari rakyatnya. Sudah saatnya Okada memperjelas siapa yang mengatur negara, dan mengambil tindakan untuk menentang meningkatnya kekuatan militer."
 JAP_okadas_military_purge_speech_tt: "§RHal ini akan menyebabkan eskalasi konflik antara Pemerintah dan Militer, yang hanya dapat diselesaikan dengan mencabut Undang-Undang Pelestarian Perdamaian!§!"
 JAP_ministry_of_commerce_and_industry: "Kementerian Perdagangan dan Industri"
 JAP_ministry_of_commerce_and_industry_desc: "Untuk mendapatkan gambaran yang lebih baik mengenai keuangan kita, kita harus memperluas Kementerian Perdagangan dan Industri dan memastikan bahwa mereka memiliki semua sumber daya yang mereka perlukan untuk melaksanakan tugas mereka dengan baik."
 JAP_continue_takahashi_korekiyos_policies: "Lanjutkan Kebijakan Takahashi Korekiyo"
 JAP_continue_takahashi_korekiyos_policies_desc: "Viscount Takahashi Korekiyo menyelamatkan negara kita dari Depresi Hebat, dan memastikan bahwa dampaknya tidak lagi terasa pada perekonomian kita. Namun untuk mencapai hal ini, ia melakukan pemotongan anggaran pada keuangan militer, sesuatu yang terbukti merupakan langkah yang tidak populer bagi banyak orang. Kita harus mengikuti jejaknya!"
 JAP_increase_armament_spending: "Meningkatkan Belanja Persenjataan"
 JAP_increase_armament_spending_desc: "Viscount Takahashi Korekiyo mungkin telah berbuat banyak bagi perekonomian kita, namun dia telah membuat kita tidak siap menghadapi perang yang akan datang. Kita harus memperbaiki fakta ini, dan berinvestasi kembali pada industri militer kita yang sedang berkembang."
 JAP_approach_mitsui: "Dekati Mitsui"
 JAP_approach_mitsui_desc: "Mitsui zaibatsu menelusuri asal usulnya kembali ke zaman Edo, saat ini menjadi salah satu perusahaan industri terbesar di negara kita. Kita harus memastikan dukungan mereka terhadap pemerintah kita, sehingga kita dapat memanfaatkan layanan mereka secara efektif."
 JAP_reduce_zaibatsu_focus_cost_tt: "Mengambil §Y$JAP_sea_guide_the_zaibatsus$§! atau §Y$JAP_democratic_work_with_the_zaibatsus$§! akan mengurangi waktu yang dibutuhkan untuk fokus ini menjadi §G35§! hari."
 JAP_approach_mitsubishi: "Dekati Mitsubishi"
 JAP_approach_mitsubishi_desc: "Perusahaan Mitsubishi awalnya didirikan sebagai perusahaan pelayaran pada awal era Meiji. Setelah meluas ke sebagian besar sektor industri, mereka kini menguasai sebagian besar industri militer di negara kita. Kita harus memastikan dukungan mereka terhadap pemerintah kita, sehingga kita dapat memanfaatkan fasilitas mereka secara efektif."
 JAP_approach_sumitomo: "Dekati Sumitomo"
 JAP_approach_sumitomo_desc: "Sejarah Sumitomo zaibatsu dimulai dari sebuah toko buku di Kyoto, meskipun penyulingan tembaga menjadikan perusahaan ini terkenal. Saat ini mereka berspesialisasi dalam ekstraksi mineral, serta perbankan. Kita harus memastikan dukungan mereka terhadap pemerintah kita, sehingga kita dapat memanfaatkan aset mereka secara efektif."
 JAP_approach_yasuda: "Dekati Yasuda"
 JAP_approach_yasuda_desc: "Yasuda zaibatsu menelusuri asal-usulnya hingga era Meiji, dan telah menjalankan perbankan sejak pertama kali didirikan. Sebagai badan dari bank Yasuda, mereka kini secara intrinsik terhubung dengan semua sektor keuangan di negara kita. Kita harus memastikan dukungan mereka terhadap pemerintah kita, sehingga kita dapat memanfaatkan kekayaan mereka secara efektif."
 JAP_fund_the_riken_institute: "Danai Institut RIKEN"
 JAP_fund_the_riken_institute_desc: "Didirikan pada tahun 1917 pada era Taishō, Institut Penelitian Fisika dan Kimia saat ini dikendalikan oleh Riken Concern, sebuah zaibatsu yang saat ini mengendalikan sekitar 121 pabrik dan 63 perusahaan. Di bawah Viscount Masatoshi Ōkōchi, kita harus berusaha untuk memperluas lembaga ini lebih jauh, sehingga kita dapat melakukan program penelitian atom di sana."
 JAP_fund_the_riken_institute_tt: "Jika $JAP_zaibatsu_faction$ setidaknya $JAP_imperial_influence_tier_3$, dapatkan juga §G1§! §YFasilitas Penelitian Nuklir§!"
 JAP_build_the_nishotaki_and_miyanaka_dams: "Membangun Bendungan Nishotaki dan Miyanaka"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc: "Pabrik-pabrik dan fasilitas-fasilitas baru di negara kita memerlukan lebih banyak listrik daripada kemampuan produksi listrik yang terjangkau saat ini. Kita harus membangun bendungan pembangkit listrik tenaga air baru, sehingga kita dapat menghasilkan listrik tanpa membakar cadangan batu bara kita yang berharga."
 JAP_establish_synthetic_fuel_joint_venture: "Mendirikan Usaha Patungan Bahan Bakar Sintetis"
 JAP_establish_synthetic_fuel_joint_venture_desc: "Sejak tahun 20an, kami telah menjalin usaha patungan dengan Jerman untuk mendirikan pusat ekstraksi sumber daya sintetis untuk batu bara dan minyak. Kita harus memperluas wawasan kita, dan berupaya meningkatkan kerja sama dengan negara-negara barat, sehingga kita akhirnya bisa mandiri."
 JAP_establish_synthetic_fuel_joint_venture_tt: "Jika negara §YMayor Barat§! memiliki §Ydijamin§! atau setidaknya memiliki §Y75§! Opini §Y[ROOT.GetNameDef]§!, [ROOT.GetNameDef] menerima <span tambahan Translate=\"no\">$cat_synth_oil$</span> bonus teknologi dan §Y$synthetic_refinery$§!"
 JAP_establish_nippon_hassoden: "Mendirikan Nippon Hassoden"
 JAP_establish_nippon_hassoden_desc: "Untuk meningkatkan kendali pemerintah atas pasokan listrik nasional, dan untuk kemampuan mengatur penggunaannya, kita harus mendirikan Perusahaan Pembangkit dan Transmisi Listrik Jepang untuk mengatur industri ketenagalistrikan. Hal ini dapat dicapai dengan mudah melalui penggabungan perusahaan-perusahaan tenaga listrik yang sudah ada."
 JAP_new_industrial_city_development_policy: "Kebijakan Pembangunan Kota Industri Baru"
 JAP_new_industrial_city_development_policy_desc: "Komite Perencanaan Pertanahan Nasional telah mengembangkan rencana untuk mendirikan kota-kota baru yang berpusat di sekitar fasilitas pasokan militer untuk angkatan darat dan angkatan laut, pengembangan pabrik amunisi dan fasilitas terkait, serta perencanaan kota skala besar untuk mendukung industri-industri ini. Kita harus berinvestasi dalam inisiatif ini."
 JAP_establish_housing_corporation: "Mendirikan Perusahaan Perumahan"
 JAP_establish_housing_corporation_desc: "Untuk menyediakan perumahan di seluruh negeri bagi semua yang membutuhkannya, kita harus mendirikan sebuah perusahaan dengan tujuan membangun puluhan ribu unit rumah bagi para buruh, dan banyak properti sewaan bagi para tukang kayu dan warga negara."
 JAP_central_agricultural_association: "Asosiasi Pertanian Pusat"
 JAP_central_agricultural_association_desc: "Banyaknya organisasi pertanian kita yang tersebar perlu dikonsolidasikan menjadi satu jika kita ingin mengatasi hambatan dalam rantai pasokan kita. Untuk memastikan hal ini terlaksana, kita harus menugaskan Sengoku Kotaro untuk membentuk Asosiasi Pusat Pertanian sebagaimana dituangkan dalam Undang-Undang Organisasi Pertanian."
 JAP_the_five_great_cities: "Lima Kota Besar"
 JAP_the_five_great_cities_desc: "Kota Kyoto, Osaka, Yokohama, Kobe, dan Nagoya telah diberi sebutan khusus yang memberikan berbagai ketentuan khusus yang tidak tersedia bagi kota-kota biasa, untuk membantu proses industrialisasi dan urbanisasi, dengan tujuan akhir menjadi kota khusus yang independen dari prefektur. Kita harus meningkatkan investasi kita dalam inisiatif ini."
 JAP_resource_security: "Keamanan Sumber Daya"
 JAP_resource_security_desc: "Tujuan ambisius kami untuk menjadi mandiri akhirnya membuahkan hasil! Bangsa kita telah menjadi sangat kaya akan sumber daya alam, yang akan semakin memperkuat kita – membuat kita tidak dapat dihentikan!"
 JAP_ship_management_committee: "Komite Manajemen Kapal"
 JAP_ship_management_committee_desc: "Dengan disahkannya Perintah Pengawasan Pengiriman Masa Perang baru-baru ini, kita dapat mengizinkan pembentukan suatu badan hukum khusus yang bertugas mengelola industri pelayaran untuk mengendalikannya dan bekerja sama dalam penerapan kebijakan nasional mengenai pelayaran guna memaksimalkan potensi penuh industri pelayaran di masa perang."
 JAP_convoy_production_cost_tt: "[JAPGetConvoyProductionCostBonusText]"
 JAP_ship_management_committee_tt: "§Y$convoy_1$§!:\n£production_cost Biaya Produksi: §G-15,00%§!."
 JAP_danganressha: "Rencana Kereta Peluru" # Danganressha
 JAP_danganressha_desc: "Kementerian Perkeretaapian telah menyetujui apa yang disebut rencana Danganressha, yang mana jalur kereta api ukuran lebar akan dibangun di samping jalur ukuran standar, sehingga kereta transportasi akan mampu melaju secepat peluru. Perintis perkeretaapian Yasujiro Shima dan putranya telah berjanji untuk membantu pengembangan rencana ini."
 JAP_ministry_of_colonial_affairs: "Kementerian Urusan Kolonial"
 JAP_ministry_of_colonial_affairs_desc: "Dimulai sebagai Kantor Kolonisasi Hokkaidō, pelayanan ini telah berkembang pesat. Kita harus memperluas tanggung jawabnya sehingga dapat mengelola Nan'yō, Chōsen, Karafuto, Kantō dan Taiwan dengan baik. Suatu hari nanti, semoga semua orang menyebut negeri ini sebagai milik Jepang!"
 JAP_manchuria_five_year_plan: "Rencana Lima Tahun Industri Manchuria"
 JAP_manchuria_five_year_plan_desc: "Walaupun pulau-pulau kami kekurangan lahan yang dapat digunakan, namun kepemilikan kami di daratan tidak. Apa yang tidak bisa kita bangun sendiri, bisa kita bangun di daratan. Kami akan memulai program industrialisasi skala besar untuk [MAN.GetNameDef]."
 JAP_establish_manchuria_airplane_manufacturing_company: "Mendirikan Perusahaan Pesawat Manchuria"
 JAP_establish_manchuria_airplane_manufacturing_company_desc: "Untuk memproduksi peralatan kami lebih dekat dengan tempat sumber dayanya diambil, Perusahaan Pesawat Nakajima telah menawarkan untuk membuka anak perusahaan di bawah pengawasan kami di Manchuria yang saat ini mereka sebut sebagai Manshū. Ide cemerlang ini harus kita dukung."
 JAP_eastern_road_and_steel_expansion: "Ekspansi Jalan dan Baja Bagian Timur"
 JAP_eastern_road_and_steel_expansion_desc: "Untuk memfasilitasi perluasan pertambangan dan industri kita di Manchuria, kita harus mendirikan Perusahaan Pengembangan Jalan Timur. Setelah hal ini tercapai, stasiun penambangan akan didirikan di Tiechangzi, Wudaojiang, dan Shirengou, dan kantor penambangan bijih besi akan didirikan di Dalizi dan Qidaogou."
 JAP_sea_promote_japanese_settlement: "Mempromosikan Permukiman Jepang"
 JAP_sea_promote_japanese_settlement_desc: "Dengan menempatkan karyawan kami di Manchuria, kami dapat meningkatkan angkatan kerja dan dengan demikian menciptakan lebih banyak lokasi yang menguntungkan bagi pabrik. Masyarakat yang pindah ke sana juga bisa menghasilkan barang-barang pertanian yang bisa dikirim kembali ke pulau asalnya."
 JAP_construct_the_sui_ho_dam: "Bangun Bendungan Sui-ho"
 JAP_construct_the_sui_ho_dam_desc: "Untuk menyediakan energi yang cukup bagi industri kita di Provinsi Manchuria Liaoning, kita harus membangun bendungan gravitasi Suihō. Teknisi kami telah menyusun rencana untuk apa yang akan menjadi yang terbesar di seluruh Asia, dengan rencana untuk mengontrak Perusahaan Pembangkit Listrik Tenaga Air Yalu dan perusahaan Kereta Api Pyeongbuk untuk mencapai hal ini."
 JAP_the_shuilikeng_power_plant: "Pembangkit Listrik Shuilikeng"
 JAP_the_shuilikeng_power_plant_desc: "Pembangunan kami di Taiwan berjalan sesuai rencana, meskipun masalah pembangkit listrik menjadi semakin mendesak. Hal ini sebagian dapat diatasi dengan pembangunan pembangkit listrik tenaga air seperti PLTA Menpaitan. Kita harus mengambil satu halaman dari buku-buku para insinyur kita di masa lalu, dan terus membangun bendungan-bendungan dan stasiun-stasiun di seluruh pulau."
 JAP_develop_the_south_seas_mandate: "Mengembangkan Mandat Laut Selatan"
 JAP_develop_the_south_seas_mandate_desc: "Mandat Jepang untuk Pemerintahan Kepulauan Laut Selatan, yang diberikan kepada kita oleh Liga Bangsa-Bangsa setelah Perang Besar, merupakan wilayah yang luas dan sebagian besar belum dijelajahi, dan siap untuk dieksploitasi. Jika kita memastikan untuk mengembangkan daerah-daerah ini dan mengkhususkan mereka dalam menyediakan kekayaan bagi rakyat kita, Pemerintahan Nan'yō yang mengatur wilayah tersebut bahkan mungkin dapat mempengaruhi penduduk setempat untuk berintegrasi dengan baik ke dalam negara kita."
 JAP_build_up_korean_industries: "Membangun Industri Korea"
 JAP_build_up_korean_industries_desc: "Kita harus melakukan upaya terkonsentrasi untuk membangun basis industri di semenanjung Korea, khususnya di bidang industri berat dan amunisi. Bagaimanapun, ini akan sangat berharga dalam perang apa pun yang akan datang dengan Tiongkok atau negara-negara Barat. Kebijakan ini awalnya diusulkan oleh Kazushige Ugaki, dan kita harus terus melanjutkannya."
 JAP_increase_agricultural_export: "Meningkatkan Ekspor Pertanian"
 JAP_increase_agricultural_export_desc: "Sejak kami mengakuisisi wilayah tersebut, Korea telah berfungsi sebagai lumbung pangan bagi kerajaan kami. Kita harus meningkatkan upaya kita untuk memperluas bidang ini, sehingga makanan mereka dapat diekspor ke seluruh penjuru dunia."
 JAP_hydroelectric_dams_in_korea: "Bendungan Pembangkit Listrik Tenaga Air"
 JAP_hydroelectric_dams_in_korea_desc: "Industrialisasi dan elektrifikasi Korea akan terhenti secara tiba-tiba kecuali kita melakukan intervensi dan melakukan sesuatu untuk mengatasi situasi tersebut. Kita harus membangun bendungan gravitasi baru di seluruh wilayah, dan teknisi kami di Perusahaan Pembangkit Listrik Tenaga Air Sungai Han telah menyusun rencana rumit untuk pembangunan bendungan yang mereka juluki Bendungan Hwacheon."
 JAP_prepare_for_peninsular_warfare: "Bersiaplah untuk Perang Semenanjung"
 JAP_prepare_for_peninsular_warfare_desc: "Jika kita sedang berperang dan mundur, Semenanjung Korea kemungkinan besar akan menjadi benteng terakhir kita di benua ini. Kita harus melakukan persiapan agar kita mampu mempertahankan wilayah ini, jika skenario terburuk terjadi."
 JAP_establish_the_japanese_korean_army: "Perluas Tentara Korea Jepang"
 JAP_establish_the_japanese_korean_army_desc: "Sejak tahun 1904, Chōsen-gun telah beroperasi sebagai pasukan garnisun di Korea, namun belum banyak bertempur di luar invasi Manchuria pada tahun 1931. Kita harus mencabut perjanjian yang mengikat kegubernuran Korea dalam upaya memperluas pasukan ini, sehingga dapat digunakan sebagai kekuatan tempur yang tepat."
 JAP_increase_crop_yields: "Meningkatkan Hasil Tanaman"
 JAP_increase_crop_yields_desc: "Pulau-pulau di Laut Selatan mempunyai banyak tanaman kelapa, yang merupakan potensi tanaman komersial yang menguntungkan. Kita harus mendorong monopoli yang memadukan inisiatif swasta dengan modal pemerintah. Dengan juga mengontrak Nan'yō Kōhatsu, perkebunan gula, pabrik gula, pisang, nanas, talas, ubi kayu, kopi, dan produk pertanian tropis lainnya dapat ditanam, menjadikan pulau-pulau tersebut setara dengan Taiwan dalam hal produksi."
 JAP_improve_agricultural_output: "Meningkatkan Hasil Pertanian"
 JAP_improve_agricultural_output_desc: "Produksi industri di Taiwan diperkirakan melebihi produksi pertanian di pulau itu. Meskipun hal ini menguntungkan industri kita, hal ini masih jauh dari ideal, mengingat ekspor pertanian dari Taiwan sangat penting untuk membuat rakyat kita bahagia dan memasok kebutuhan militer kita. Kita harus segera memperbaikinya!"
 JAP_upgrade_the_oriental_development_company: "Perluas Perusahaan Pembangunan Oriental"
 JAP_upgrade_the_oriental_development_company_desc: "ODC saat ini memiliki sembilan cabang aktif, yang beroperasi di hampir seluruh wilayah luar negeri kami. Mereka berperan penting dalam mengarahkan kemajuan kawasan ke arah yang sesuai dengan ambisi kita, dan mengarahkan pembangunan industri dan pertanian untuk mencapai efisiensi di atas segalanya. Untuk memperbaiki koloni kita, kita harus memperluas perusahaan ini, dan memastikan perusahaan ini memiliki semua sumber daya yang dibutuhkan."
 JAP_the_imperial_defense_plan: "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_imperial: "Rencana Pertahanan Kekaisaran"
 JAP_the_imperial_defense_plan_national: "Rencana Pertahanan Nasional"
 JAP_the_imperial_defense_plan_desc: "Untuk melindungi negara, kita harus merumuskan rencana baru untuk pertahanan proaktif. Semua perang akan dimenangkan dengan serangan yang menentukan dan berskala besar secara tiba-tiba, menghindari perang yang berkepanjangan dan memaksa musuh untuk menuruti tuntutan kita."
 JAP_first_strike_principle_tt: "Ketika §Y[ROOT.GetNameDef]§! §Rmenyatakan perang§! terhadap §Ynegara tetangga§!, atau negara tetangga suatu subjek, mendapat keuntungan selama §Y90 hari§!:\n§Y$JAP_first_strike_principle_dm$§!\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10,0%§!\n$MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10,0%§!"
 JAP_kantai_kessen_tt: "Saat §Y[ROOT.GetNameDef]§! §Rmenyatakan perang§! terhadap negara dengan §Y$capital_ship$§!, keuntungan selama §Y180 hari§!:\n§Y$JAP_kantai_kessen_dm$§!\nSerangan Kapal Modal Terhadap Negara: §G+10.0%§!\nKecepatan Melihat Terhadap Negara: §G+10.0%§!"
 JAP_first_strike_blocked_due_to_kwantung_army_tt: "Karena §RSerangan Tidak Terencana§! Tentara Kwantung, kami tidak akan mendapatkan bonus §Y$JAP_first_strike_principle_dm$§!"
 JAP_divert_naval_guns_to_the_army: "Alihkan Senjata Angkatan Laut ke Angkatan Darat"
 JAP_divert_naval_guns_to_the_army_desc: "Agar angkatan darat dapat menggunakan persenjataan berat seperti senjata kereta api dan tank, kita harus mengalihkan sebagian produksi senjata angkatan laut kepada tentara."
 JAP_divert_naval_guns_to_the_army_tt: "Buat §Y2 unit $railway_gun_equipment_1$§! di [ROOT.capital.GetName]."
 JAP_expand_kawagoe_army_arsenal: "Perluas Persenjataan Tentara Kawagoe"
 JAP_expand_kawagoe_army_arsenal_desc: "Industri senjata kita saat ini sedang berjuang untuk memenuhi permintaan produksi guna memastikan tentara kita mampu bertempur di medan perang modern. Kita harus memperluas persenjataan tentara Kawagoe di Saitama untuk meningkatkan peluang kita dalam mencocokkan pasokan dengan permintaan."
 JAP_reform_the_army: "Reformasi Angkatan Darat"
 JAP_reform_the_army_desc: "Pangeran Hisaichi Terauchi, seorang jenderal yang dengan cepat naik pangkat di militer kita, telah mengusulkan revisi doktrin tentara kita. Ia memandang doktrin penyerangan besar-besaran sudah ketinggalan zaman, dan mengklaim bahwa jenis peperangan yang lebih mobile akan mendominasi medan perang di masa depan. Kita harus mengindahkan nasihatnya, dan memastikan kita tidak ketinggalan zaman."
 JAP_rely_on_supremacy_of_the_will: "Andalkan Serangan Infanteri"
 JAP_rely_on_supremacy_of_the_will_desc: "Jenderal Hideki Tōjō pernah mengusulkan bahwa perang harus dimenangkan melalui serangan pendahuluan yang tegas, dan pertempuran melalui serangan massal yang hebat dan supremasi kemauan. Kita harus mendukung gagasan ini, karena gagasan ini sesuai dengan doktrin militer kita saat ini."
 JAP_rethink_armor_doctrine: "Memikirkan Kembali Doktrin Armor"
 JAP_rethink_armor_doctrine_desc: "Hisaichi Terauchi sampai pada kesimpulan yang mengerikan. Rancangan kendaraan lapis baja dan kendaraan darat kita saat ini tidak dilengkapi dengan perlengkapan yang memadai untuk melawan apa pun selain infanteri ringan, dan akan hancur jika mereka berhadapan dengan kendaraan lapis baja barat. Kita harus memperbaiki kelalaian ini sesegera mungkin!"
 JAP_foreign_tank_modernization_cooperation: "Inisiatif Modernisasi Tank Asing"
 JAP_foreign_tank_modernization_cooperation_desc: "Untuk mengalahkan negara-negara barat, pertama-tama kita harus mempelajari rancangan mereka, dan melalui hal itu kita harus belajar cara mengatasinya. Kita harus menjalin persahabatan dengan salah satu kekuatan barat, sehingga pada akhirnya kita bisa memproduksi tank yang bahkan mereka kagumi."
 JAP_foreign_tank_modernization_cooperation_tt: "Negara §YMayor Barat§! telah §Ydijamin§! atau berada dalam §YFraksi§! dengan §Y[ROOT.GetNameDef]§!"
 JAP_foreign_tank_modernization_cooperation_2_tt: "Membuka sifat MIO §Y$JAP_mio_trait_foreign_research_and_development_cooperation$§! untuk semua §YTank Designer§!. §RNamun ini hanya dapat diterapkan pada salah satu dari mereka§!."
 JAP_domestic_tank_modernization_program: "Program Modernisasi Tank Domestik"
 JAP_domestic_tank_modernization_program_desc: "Kita harus belajar dari kesalahan kita, dan memastikan bahwa baju besi kita dapat bertahan dari persenjataan anti-tank, jika tidak maka pasukan kita akan menemui kegagalan. Hal ini tidak boleh dilakukan dengan mengandalkan rancangan negara-negara barat, namun pada kecerdikan orang-orang [ROOT.GetAdjective] yang hebat."
 JAP_the_ultimate_tank: "Tank Tertinggi"
 JAP_the_ultimate_tank_desc: "Teknisi kami telah mendapatkan ide cemerlang. Daripada menggunakan kendaraan kecil dalam jumlah besar, kita sebaiknya membangun kendaraan raksasa berbahan logam, yang dapat menghancurkan musuh hanya dengan dukungan minimal. Rancangan pertama mereka adalah kendaraan yang mereka sebut sebagai tank O-I, dan kita harus berupaya mewujudkan visi ini sesegera mungkin."
 JAP_the_ultimate_tank_tt: "\nSetelah teknologi §Y$super_heavy_tank_chassis$§! diteliti:\n"
 JAP_prepare_the_northern_front: "Persiapkan Front Utara"
 JAP_prepare_the_northern_front_desc: "Tentara Kwantung sudah lama ingin melakukan perlawanan yang layak melawan [SOV.GetNameDef], namun mereka kekurangan infrastruktur militer yang diperlukan agar perang ini berhasil. Kita harus berinvestasi dalam perluasan jalan raya dan kereta api di Manchuria, sehingga pada akhirnya kita bisa berhasil mengusir [SOV.GetAdjective] dari Siberia."
 JAP_enact_the_national_conscription_law: "Menetapkan Undang-Undang Wajib Militer Nasional"
 JAP_enact_the_national_conscription_law_desc: "Telah ditetapkan, bahwa setiap pria [ROOT.GetAdjective] yang memenuhi syarat akan dicari dan wajib militer menjadi tentara. Kita harus mengirimkan perekrut ke desa-desa yang paling terpencil sekalipun, sehingga kita dapat dengan cepat merekrut lebih banyak laki-laki."
 JAP_instill_the_spirit_of_bushido: "Tanamkan Semangat Bushido"
 JAP_instill_the_spirit_of_bushido_desc: "Melalui Shinto Negara dan gagasan moralitas tradisional yang dikenal sebagai Bushido, kita akan mampu menanamkan dalam diri masyarakat perlunya mengorbankan diri demi kebaikan negara dan keluarga Kekaisaran."
 JAP_instill_the_spirit_of_bushido_tt: "Mengaktifkan Taktik: §Y$tactic_grand_banzai_charge$§!"
 JAP_adopt_new_assault_doctrine: "Mengadopsi Doktrin Penyerangan Baru"
 JAP_adopt_new_assault_doctrine_desc: "Jenderal Shunroku Hata telah mengusulkan cara baru untuk mengalahkan musuh secara meyakinkan dalam pertempuran. Dengan menggunakan artileri dalam jumlah besar, kita seharusnya mampu menembaki musuh hingga menyerah, dan kemudian hanya perlu menyerang sisa-sisa pasukan yang sudah terdemoralisasi dan hancur untuk mencapai kesepakatan."
 JAP_develop_lethal_infantry_equipment: "Mengembangkan Peralatan Infanteri yang Mematikan"
 JAP_develop_lethal_infantry_equipment_desc: "Tentara telah menjelaskan kepada kami betapa ketinggalan jaman senjata-senjata yang mereka miliki saat ini, dan meminta agar dilakukan tindakan untuk mengatasinya. Kita harus melakukan investasi besar dalam mengembangkan peralatan infanteri yang lebih modern, sehingga kita tidak akan kalah perang lagi."
 JAP_develop_lethal_infantry_equipment_tt: "Jika $JAP_army_faction$ setidaknya $JAP_imperial_influence_tier_3$, dapatkan juga:\n"
 JAP_develop_sophisticated_artillery_equipment: "Mengembangkan Peralatan Artileri yang Canggih"
 JAP_develop_sophisticated_artillery_equipment_desc: "Tentara telah menjelaskan kepada kami betapa ketinggalan jaman senjata-senjata yang mereka miliki saat ini, dan meminta agar dilakukan tindakan untuk mengatasinya. Kita harus melakukan investasi besar dalam mengembangkan senjata artileri yang lebih modern, sehingga kita tidak perlu menyerang musuh sampai mereka sudah menyerah."
 JAP_expand_the_irago_proving_ground: "Perluas Tempat Pembuktian Irago"
 JAP_expand_the_irago_proving_ground_desc: "Untuk mendominasi medan perang dengan lebih baik, kita harus memperluas tempat pembuktian Irago tempat kita menguji senjata baru dan eksperimental. Di sana, kita mungkin bisa mengembangkan alat perang yang akan membuat semua musuh kita menyerah."
 JAP_sea_mountaineers: "Bentuk Resimen Pendaki Gunung"
 JAP_sea_mountaineers_desc: "Tentara kami menyadari bahwa mereka tidak akan mampu menembus daerah pegunungan di Tiongkok selatan dan barat kecuali dilakukan tindakan drastis. Oleh karena itu mereka meminta agar brigade khusus pendaki gunung dibentuk, sehingga mereka dapat memimpin penyerangan dan menembus garis musuh."
 JAP_jungle_adaptation: "Adaptasi Hutan"
 JAP_jungle_adaptation_desc: "Tentara kami menyadari bahwa mereka tidak akan mampu menembus wilayah Burma dan Indonesia Raya yang tertutup hutan kecuali ada tindakan drastis yang dilakukan. Oleh karena itu mereka meminta agar divisi hutan khusus dibentuk, sehingga mereka dapat memimpin penyerangan dan menembus garis musuh."
 JAP_army_weapons_administration_headquarters: "Markas Besar Administrasi Senjata Angkatan Darat"
 JAP_army_weapons_administration_headquarters_desc: "Untuk menyatukan produksi, penyediaan, penelitian, pengembangan, pengujian, dan pelatihan senjata Angkatan Darat, kita harus mendirikan Markas Besar Administrasi Senjata Angkatan Darat. Dengan melakukan hal ini, industri kita diharapkan akan mempunyai peluang melawan raksasa seperti [SOV.GetNameDef] dan [USA.GetNameDef]."
 JAP_army_weapons_administration_headquarters_tt: "Jika $JAP_army_faction$ setidaknya $JAP_imperial_influence_tier_3$, dapatkan juga §G1§! §YFasilitas Perang Darat§!"
 JAP_pivot_towards_defensive_measures: "Berporos Menuju Tindakan Defensif"
 JAP_pivot_towards_defensive_measures_desc: "Perang yang terjadi belum tentu menguntungkan kita. Menjadi semakin masuk akal jika musuh-musuh kita mendarat di negara asal kita, sesuatu yang saat ini kita tidak mampu untuk memeranginya. Kita harus segera menyelesaikan masalah ini, jangan sampai kita mengalami satu abad penghinaan yang kita buat sendiri!"
 JAP_strenghten_the_supply_lines: "Perkuat Jalur Pasokan"
 JAP_strenghten_the_supply_lines_desc: "Jalur pasokan kami menjadi lebih tipis dari yang bisa kami tangani, dan akibatnya pasukan kami menderita kerugian. Kita harus menyelesaikan situasi ini jika kita ingin keberhasilan kita terus berlanjut, karena waktu semakin cepat habis sebelum pasukan kita goyah dan jatuh."
 JAP_ni_go_nuclear_project: "Proyek Nuklir Ni-Go"
 JAP_ni_go_nuclear_project_desc: "Komite Angkatan Darat telah menyiapkan proyek eksperimental di RIKEN, sesuatu yang mereka sebut proyek Ni-Go. Tujuannya adalah untuk memisahkan uranium-235 melalui difusi termal, mengabaikan metode alternatif seperti pemisahan elektromagnetik, difusi gas, dan pemisahan sentrifugal. Mudah-mudahan kita bisa segera belajar bagaimana memanfaatkan ini untuk tujuan militer."
 JAP_establish_showa_aircraft_idnsutry: "Mendirikan Industri Pesawat Showa"
 JAP_establish_showa_aircraft_idnsutry_desc: "Kami telah menerima permintaan izin untuk mendirikan Shōwa Hikōki Kōgyō Kabushiki-gaisha di Akishima, Tokyo. Perusahaan ini ingin membuat pesawat militer untuk disediakan bagi angkatan bersenjata kita. Kita harus menyetujui permintaan mereka, dan meminta mereka segera menyediakan peralatan penerbangan untuk kita."
 JAP_develop_new_fighters: "Kembangkan Pejuang Baru"
 JAP_develop_new_fighters_desc: "Desain baru Mitsubishi mungkin terbukti menjadi pesawat tempur berbasis kapal induk paling mumpuni yang pernah dirancang hingga saat ini. Kemampuan manuver yang tak tertandingi, ditambah dengan jangkauan yang layak, berarti bahwa desain tersebut kemungkinan akan bertahan selama bertahun-tahun. Kita harus segera memulai pembuatan prototipe dan produksi."
 JAP_modern_bombers: "Pembom Modern"
 JAP_modern_bombers_desc: "Kekuatan pembom taktis yang dimodernisasi adalah kunci untuk mendukung militer kita di medan perang. Oleh karena itu kita harus memerintahkan angkatan darat dan angkatan laut untuk memulai pengembangan pesawat yang mampu memberikan dukungan taktis bagi pasukan darat kita."
 JAP_improve_the_type_91_aerial_torpedo: "Tingkatkan Torpedo Udara Tipe 91"
 JAP_improve_the_type_91_aerial_torpedo_desc: "Kita harus berupaya mengembangkan torpedo yang dikhususkan untuk menghantam kapal di perairan dangkal, untuk meningkatkan kemampuan serangan di pelabuhan. Torpedo udara ini akan terinspirasi oleh torpedo tercanggih kita, Long Lance, dan akan memberikan kita buah kemenangan lebih cepat dari yang pernah kita impikan."
 JAP_7075_aluminium_alloy: "Paduan Aluminium 7075"
 JAP_7075_aluminium_alloy_desc: "Jangkauan saja tidak akan ada gunanya jika model kita tidak dapat bersaing dengan musuh ketika mereka tiba. Kita harus menghasilkan kerajinan dengan ketangkasan yang unggul, sehingga mereka tidak akan pernah bisa dikalahkan. Teknisi kami di Mitsubishi telah mengembangkan Paduan Aluminium baru yang akan merevolusi konstruksi pesawat terbang seperti yang kita kenal sekarang."
 JAP_escort_efficiency: "Berinvestasi dalam Pengawalan Udara"
 JAP_escort_efficiency_desc: "Kita harus menjaga keunggulan atas musuh-musuh kita di segala bidang, termasuk peperangan udara, agar pesawat pengebom dan pesawat angkut kita tidak dicegat dan dijatuhkan. Pesawat tempur yang dimodernisasi sangat penting untuk mencapai hal ini, dan merupakan kunci kemenangan di masa depan."
 JAP_sea_sturdy_aircraft: "Pesawat Kokoh"
 JAP_sea_sturdy_aircraft_desc: "Ketangkasan dan jangkauan keduanya penting, namun bukan satu-satunya faktor yang menentukan kesuksesan kita di angkasa. Jika pesawat kita setipis kertas, kita akan kalah sebelum perang dimulai. Oleh karena itu kita harus berinvestasi dalam pengembangan kerangka udara yang lebih kuat dan lapis baja yang lebih tebal, sehingga kita dapat mendominasi angkasa di tahun-tahun mendatang."
 JAP_sea_sturdy_aircraft_tt: "Mengurangi kemungkinan serangan udara yang ditargetkan terhadap karakter tertentu"
 JAP_sea_long_operational_range: "Jangkauan Operasional yang Panjang"
 JAP_sea_long_operational_range_desc: "Meskipun kita menginginkan kemenangan cepat, perang tidak mudah dimenangkan melalui konfrontasi militer langsung saja. Jarak yang terlibat dalam peperangan di kawasan Pasifik sangatlah luas, sehingga kita memerlukan model yang mampu menjembatani jarak tersebut jika kita ingin berhasil."
 JAP_project_z_bomber_project: "Proyek Pembom Z"
 JAP_project_z_bomber_project_desc: "Ibukota musuh kita terletak jauh dari kita, sehingga sulit untuk melakukan serangan awal yang menentukan yang kita perlukan untuk segera mengakhiri perang. Oleh karena itu kita harus membangun kendaraan yang mampu mencapai bahkan Pantai Timur Amerika jika diperlukan, dan berinvestasi pada model pembom strategis baru yang dapat menghancurkan industri musuh di belakang garis pertahanan."
 JAP_adopt_new_air_doctrine: "Mengadopsi Doktrin Udara Baru"
 JAP_adopt_new_air_doctrine_desc: "Kini setelah kita berhadapan dengan musuh yang memiliki kemampuan teknologi yang sama dengan kita, kita menyadari bahwa kita juga harus memodernisasi doktrin tempur kita agar dapat mengimbanginya."
 JAP_the_divine_wind: "Angin Ilahi"
 JAP_the_divine_wind_desc: "Kamikaze, taktik Unit Serangan Khusus, telah mengubah serangan bunuh diri dari tindakan terakhir yang diimprovisasi menjadi doktrin yang sudah mapan. Dengan pesawat-pesawat baru, yang pada dasarnya memiliki rudal berawak, serangan-serangan ini tidak akan dapat dihentikan."
 JAP_sea_unify_the_air_forces: "Satukan Angkatan Udara"
 JAP_sea_unify_the_air_forces_desc: "Sudah terlalu lama kita diganggu oleh penelitian dan pengembangan penerbangan yang terpisah antara angkatan darat dan angkatan laut. Kita harus menyatukan program-program ini untuk memastikan keseragaman persenjataan dan penggunaan sumber daya penelitian kita yang terbatas dengan lebih baik."
 JAP_sea_unify_the_air_forces_tt: "Membuka sifat MIO §Y$JAP_mio_trait_unified_research_and_development$§! untuk semua §YDesainer Pesawat§!. §RNamun ini hanya dapat diterapkan pada salah satu dari mereka§!."
 JAP_sea_unify_the_air_forces_2_tt: "Ganti §Y$JAP_army_and_naval_air_services_dm$§! dengan §Y$JAP_japanese_airforce_dm$§!, perubahan yang efektif:"
 JAP_improved_radio_communications: "Meningkatkan Komunikasi Radio"
 JAP_improved_radio_communications_desc: "Radio kami saat ini berada dalam kondisi yang buruk, dan akibatnya formasi kami sering terpecah karena komunikasi yang buruk dan kurangnya sinyal di hutan lebat dan pulau-pulau terpencil. Kita harus memodernisasi peralatan kita dan membangun menara radio baru agar hal ini tidak terus terjadi."
 JAP_combined_arms: "Senjata Gabungan"
 JAP_combined_arms_desc: "Koordinasi antara angkatan udara dan darat kita adalah kunci keberhasilan. Untuk memberikan dukungan yang lebih baik dan membersihkan medan perang dari segala hambatan yang mungkin dihadapi tentara kita, kita harus berinvestasi dalam taktik senjata gabungan yang memungkinkan pesawat kita bekerja sama dengan cabang-cabang kita yang lain."
 JAP_sea_jet_prototypes: "Senjata Kekaisaran No.2"
 JAP_sea_jet_prototypes_desc: "Masa depan penerbangan tidak terletak pada baling-balingnya. Kita harus melihat tenaga penggerak jet untuk meningkatkan kemampuan pesawat kita. Teknisi kami menjuluki proyek pembuatan pesawat eksperimental baru ini sebagai Imperial Weapon No.2, dan modelnya disebut Kikka."
 JAP_rockets_development: "Perkembangan Roket"
 JAP_rockets_development_desc: "Hideo Iwakuro memiliki banyak ide cemerlang mengenai rudal udara-ke-permukaan dan rudal anti-pesawat permukaan-ke-udara. Kita harus mempromosikan ide-idenya, dan mengembangkan bentuk-bentuk peroketan baru yang dapat membantu kita meraih kemenangan di masa depan."
 JAP_expand_hiratsuka_navy_arsenal: "Perbanyak Gudang Amunisi Angkatan Laut Hiratsuka"
 JAP_expand_hiratsuka_navy_arsenal_desc: "Gudang Amunisi Angkatan Laut Hiratsuka yang didirikan pada tahun 1905 memiliki potensi untuk dikembangkan secara besar-besaran. Mereka akan dapat mengkhususkan pabrik yang berbeda untuk desain dan rekayasa, termasuk amunisi senapan mesin, peluru artileri angkatan laut, pemulihan pelarut, dan produksi nitrogliserin."
 JAP_expand_hiratsuka_navy_arsenal_tt: "Telah meninggalkan §YPerjanjian Angkatan Laut London§!, atau §YKlausul Eskalator telah Diminta§!"
 JAP_expand_navy_technical_department: "Perluas Departemen Teknis Angkatan Laut"
 JAP_expand_navy_technical_department_desc: "Kita harus mengeluarkan perkiraan baru mengenai besarnya peningkatan angkatan laut kita, dan dengan demikian, fasilitas galangan kapal yang akan diperlukan untuk mewujudkan peningkatan ini. Langkah pertama untuk menjadikan fasilitas kami sejalan dengan persyaratan modern adalah dengan memperluas departemen teknis angkatan laut."
 JAP_prepare_the_southern_front: "Persiapkan Front Selatan"
 JAP_prepare_the_southern_front_desc: "Perang di Pasifik akan melibatkan banyak pendaratan angkatan laut. Pasukan Pendaratan Angkatan Laut Khusus memerlukan perluasan jika mereka ingin mampu melaksanakan tugas tersebut. Selain itu, investasi pada pasukan terjun payung laut kita akan terbukti bermanfaat, karena mereka akan mampu merebut lokasi dan pulau-pulau strategis sebelum pasukan utama kita sampai ke lokasi tersebut."
 JAP_prepare_the_southern_front_tt: "Ketika [ROOT.GetNameWithFlag] §Rmenyatakan perang§! terhadap negara yang menguasai §YNegara Asia Tenggara§!:"
 JAP_focus_on_aircraft_carriers: "Fokus pada Kapal Induk"
 JAP_focus_on_aircraft_carriers_desc: "Kapal perang adalah peninggalan zaman dulu. Kita harus menatap masa depan, dan masa depan adalah dunia penerbangan. Kapal induk akan memungkinkan kita memproyeksikan kekuatan udara tersebut melintasi Pasifik."
 JAP_balanced_naval_approach: "Pendekatan Angkatan Laut yang Seimbang"
 JAP_balanced_naval_approach_desc: "Kita harus menghindari membuat diri kita terpojok jika ternyata kapal perang atau kapal induk tidak efektif melawan musuh kita. Oleh karena itu kita harus menjaga pendekatan angkatan laut yang seimbang, dan berinvestasi di kedua sektor tersebut."
 JAP_sea_battleship_initiative: "Inisiatif Kapal Perang"
 JAP_sea_battleship_initiative_desc: "Dengan desain kapal perang kami yang unggul, kami hanya memerlukan satu pertempuran yang menentukan untuk menentukan perang laut. harus memastikan armada perang kita dioptimalkan untuk terlibat secara tegas dan mengamankan kemenangan secepat angin."
 JAP_sea_heavier_naval_guns: "Senjata Angkatan Laut yang Lebih Berat"
 JAP_sea_heavier_naval_guns_desc: "Tampaknya musuh-musuh kita telah berinvestasi besar-besaran pada persenjataan kapal angkatan laut mereka. Kita harus memastikan bahwa kita dapat mengikuti perkembangan mereka dan menembus lambung mereka. Untuk mencapai tujuan tersebut, investasi pada persenjataan angkatan laut yang lebih berat tampaknya merupakan hal yang bijaksana."
 JAP_sea_bigger_better_yamato: "Kapal Perang Kelas Tsushima"
 JAP_sea_bigger_better_yamato_desc: "Karena kita tidak kaya akan sumber daya, kita harus memastikan bahwa kita memanfaatkannya sebaik mungkin. Kami akan membangun kapal perang paling kuat yang pernah ada di permukaan planet ini, yang mampu mengalahkan musuh mana pun dalam pertempuran langsung. Dengan ini, musuh-musuh kita akan tunduk di hadapan kita, atau tidak ada lagi."
 JAP_yokosuka_naval_air_technical_arsenal: "Persenjataan Teknis Udara Angkatan Laut Yokosuka"
 JAP_yokosuka_naval_air_technical_arsenal_desc: "Persenjataan Teknis Angkatan Laut Yokosuka akan menjadi kunci dalam menyediakan pesawat paling modern untuk armada kapal induk baru kami. Ini akan fokus pada pembuatan desain yang lebih baik, untuk diproduksi secara massal oleh perusahaan seperti Aichi kokuki, Kyūshū hikoki Kabushiki-kaisha dan dirakit di Hiro Naval Arsenal."
 JAP_establish_the_mine_warfare_force: "Bentuk Pasukan Perang Ranjau"
 JAP_establish_the_mine_warfare_force_desc: "Telah menjadi perhatian kita bahwa negara-negara barat menggunakan ranjau laut sebagai alat untuk mengendalikan lautan. Kita harus menerapkan ide-ide ini, meskipun bukan tanpa membentuk kekuatan yang juga bertugas mengawasi perairan tersebut dan melakukan penyapuan ranjau kapan pun diperlukan."
 JAP_akizuki_class_destroyers: "Penghancur Kelas Akizuki"
 JAP_akizuki_class_destroyers_desc: "Kami memerlukan kapal platform multiguna berkemampuan tinggi, dengan kemampuan penyaringan anti-pesawat yang kuat untuk ditugaskan pada kelompok kapal induk dan armada tempur kami. Para insinyur kami telah mulai mengerjakan perbaikan pada kapal perusak kelas Yūgumo, dengan kelas baru yang mereka sebut sebagai kelas Akizuki."
 JAP_form_the_kido_butai: "Bentuk Kido Butai" # Form the Kidō Butai
 JAP_form_the_kido_butai_desc: "Untuk memaksimalkan kekuatan serangan ofensif, kami akan menggabungkan konsentrasi kapal induk terbesar yang pernah ada di dunia ke dalam satu kelompok tempur. Dengan mengembangkan doktrin-doktrin yang diperlukan untuk memungkinkan operasi ofensif terpadu dalam bentuk ini, musuh-musuh kita tidak akan mempunyai peluang melawan keunggulan kita dalam penerbangan angkatan laut."
 JAP_form_the_kido_butai_tt: "Peluang keberhasilan §YRaid§! Pearl Harbor di §Y[USA.GetNameWithFlag]§! akan meningkat"
 JAP_nationalize_suzuka_naval_arsenal: "Nasionalisasi Persenjataan Angkatan Laut Suzuka"
 JAP_nationalize_suzuka_naval_arsenal_desc: "Suzuka Naval Arsenal adalah fasilitas produksi persenjataan penerbangan, senjata ringan, dan amunisi untuk angkatan laut. Kita harus menasionalisasi fasilitas ini, sehingga kita dapat mengendalikan perluasannya, dan mendirikan pangkalan perbaikan angkatan laut baru di lokasi tersebut."
 JAP_nationalize_fujinagata_shipyards: "Nasionalisasi Galangan Kapal Fujinagata"
 JAP_nationalize_fujinagata_shipyards_desc: "Galangan Kapal Fujinagata adalah galangan kapal dan produsen gerbong kereta api yang penting di Osaka, yang memiliki kepentingan strategis bagi upaya perang kita. Untuk memperluas fasilitas dan mengerahkan lebih banyak tenaga kerja, kita harus berusaha untuk menasionalisasi galangan kapal ini."
 JAP_naval_armaments_program: "Program Persenjataan Angkatan Laut"
 JAP_naval_armaments_program_desc: "Agar galangan kapal dan industri kita dapat mengimbangi ambisi kita yang terus berkembang, angkatan laut kita telah menyusun rencana ekspansi baru sebagai bagian dari Program Suplemen Persenjataan Angkatan Laut Cepat. Hal ini termasuk kapal perang baru, dan bertujuan untuk memperluas angkatan laut menjadi setidaknya 293 kapal maritim."
 JAP_naval_armaments_program_tt: "Setelah §Y$JAP_focus_on_aircraft_carriers$§! selesai: Membuat §Yvarian§! Pembawa dan §Y4 jalur produksi§! dari §YKelas Shokaku§!\nDengan §Y$JAP_balanced_naval_approach$§! selesai: Membuat §Yvarian§! Kapal Induk dan Super dan §Y2 jalur produksi§! dari §YKelas Shokaku§! dan §YKelas Yamato§!\nDengan §Y$JAP_sea_battleship_initiative$§! selesai: Membuat §Yvarian§! Kapal Perang Super dan §Y4 jalur produksi§! dari §YKelas Yamato§!\n"
 JAP_radio_guided_missiles: "Rudal Pencari Panas"
 JAP_radio_guided_missiles_desc: "Dewan Persenjataan Angkatan Darat Kekaisaran Jepang telah membuat kemajuan besar dalam pengembangan senjata berpemandu. Mereka hampir membuat terobosan mengenai rudal yang jatuh bebas, dipandu infra-merah, dan distabilkan oleh gyro, yang dimaksudkan untuk dijatuhkan dari pesawat ke sasaran pengiriman. Senjata baru ini dijuluki Ke-Go."
 JAP_assure_superior_naval_quality: "Menjamin Kualitas Angkatan Laut yang Unggul"
 JAP_assure_superior_naval_quality_desc: "Meskipun jumlah itu penting, kita tidak boleh membiarkan musuh memiliki kapal yang lebih kuat dari kapal terhebat kita. Yamato merupakan langkah awal yang baik, namun kita harus mengambil ide ini lebih jauh lagi."
 JAP_seek_strength_in_numbers: "Carilah Kekuatan dalam Angka"
 JAP_seek_strength_in_numbers_desc: "Satu kapal tidak cukup untuk memenangkan pertunangan. Kita perlu mendiversifikasi armada kita, dan memperluas jumlah armada kita dibandingkan hanya berfokus pada kualitas. Bagaimanapun, kuantitas adalah kualitas tersendiri."
 JAP_seek_strength_in_numbers_tt: "Membuka sifat MIO §Y$JAP_mio_trait_strength_in_numbers$§! untuk semua §YDesainer Angkatan Laut§!. §RNamun ini hanya dapat diterapkan pada salah satu dari mereka§!."
 JAP_secure_the_sea_lanes: "Amankan Jalur Laut"
 JAP_secure_the_sea_lanes_desc: "Armada kami memerlukan pengawalan paling modern untuk beroperasi tanpa hambatan oleh kapal selam dan kapal torpedo musuh. Hanya dengan berinvestasi pada hal ini, transportasi kita dapat sampai ke tujuannya dengan aman."
 JAP_fix_flawed_naval_designs: "Perbaiki Desain yang Cacat"
 JAP_fix_flawed_naval_designs_desc: "Desain kapal kami terbukti sangat berat, dan kami sering mengalami insiden kapal terbalik begitu meninggalkan pelabuhan. Masalah ini harus segera kita selesaikan agar kapal kita bisa melaut dengan selamat."
 JAP_f_go_nuclear_project: "Proyek Nuklir F-Go"
 JAP_f_go_nuclear_project_desc: "Komando angkatan laut kami ingin memulai program penelitian nuklir dengan harapan dapat memanfaatkan kekuatan teknologi untuk armada kami. Mereka mengusulkan agar hal ini dilakukan di bawah Bunsaku Arakatsu di Universitas Imperial, Kyoto. Timnya termasuk Hideki Yukawa, seorang ahli teori terkemuka yang pasti akan mencapai terobosan yang kita butuhkan."
 JAP_combined_nuclear_research_efforts: "Upaya Penelitian Nuklir Gabungan"
 JAP_combined_nuclear_research_efforts_desc: "Dengan semakin dekatnya pertikaian antara cabang-cabang militer kita, sudah saatnya kita menyatukan proyek-proyek nuklir ambisius mereka menjadi satu, dan menempatkan semua orang yang paling cerdas di negara kita untuk bekerja dalam satu tim."
 JAP_end_the_interservice_rivalry: "Akhiri Rivalitas Antar Dinas"
 JAP_end_the_interservice_rivalry_desc: "Dengan kemenangan kita yang membuktikan bahwa negara kita mampu menjadi kekuatan dunia, pertikaian mengenai sumber daya antara faksi-faksi internal kita tampaknya semakin tidak relevan. Sudah saatnya kita mengakhiri keretakan yang sudah terlalu lama memecah belah kepentingan kita, dan memastikan dominasi [ROOT.GetAdjective] atas Asia selama berabad-abad mendatang."
 JAP_end_the_interservice_rivalry_tt: "Akan mengakhiri §YRivalitas Antar Angkatan§! antara Angkatan Darat dan Angkatan Laut. Mereka §GTidak Lagi Memberikan Maluses§! berdasarkan status mereka dibandingkan dengan yang lain, namun berfungsi seperti yang dilakukan faksi lain"
 JAP_seek_yakuza_support: "Carilah Dukungan Yakuza"
 JAP_seek_yakuza_support_desc: "Ada banyak kelompok yang diam-diam memegang kekuasaan besar, mereka mengontrol dan mempengaruhi tindakan politisi dan jenderal. Kita harus berusaha untuk bersekutu dengan kelompok-kelompok ini, dan meyakinkan mereka untuk bekerja sama dengan kita dalam memastikan militer tidak mendapatkan apa yang mereka inginkan."
 JAP_seek_yakuza_support_tt: "Sebagian besar §YTentara Kekaisaran§! akan terpengaruh ke pihak kita dalam §YPerang Saudara§!"
 JAP_seek_yakuza_support_2_tt: "§G1§! §YJenderal§! akan setia kepada kami"
 JAP_expand_the_metropolitan_police: "Perluas Departemen Kepolisian Metropolitan"
 JAP_expand_the_metropolitan_police_desc: "Kita tahu pasti bahwa kepolisian sipil adalah kelompok siap tempur yang berada di pihak kita, dan tidak berada di bawah kendali militer. Mereka membantu kita menjatuhkan faksi Kōdōha, dan mereka dapat membantu kita sekali lagi, dalam memulihkan ketertiban dalam situasi kacau ini."
 JAP_expand_the_metropolitan_police_tt: "§G2§! §YJenderal§! akan setia kepada kita"
 JAP_expand_the_metropolitan_police_2_tt: "Pemerintahan demokratis akan mendapatkan tambahan §G8§! §YDivisi Polisi§! ketika §YPerang Saudara§! terjadi"
 JAP_secretly_rebuild_the_party: "Diam-diam Membangun Kembali JCP" # Can also be Secretly Rebuild the Party
 JAP_secretly_rebuild_the_party_desc: "Ada banyak kelompok yang kehilangan suara dan keterwakilan politik mereka ketika Undang-Undang Pelestarian Perdamaian ditandatangani pada tahun 1925. Salah satu kelompok tersebut adalah kelompok komunis, yang organisasinya dilarang dan menghadapi penindasan besar di bawah rezim kita yang lalu. Kita harus berusaha untuk melegalkan gerakan mereka, agar mereka menjadi pendukung dalam perjuangan kita melawan militer."
 JAP_secretly_rebuild_the_party_tt: "Membuka keputusan untuk §YMenyusup ke Negara-Negara yang Dikendalikan Oposisi§! untuk memastikan mereka bergabung dengan §YKomunis§! ketika §YPerang Saudara§! terjadi"
 JAP_anti_militarist_speeches_in_the_diet: "Pidato Anti-Militaris dalam Diet"
 JAP_anti_militarist_speeches_in_the_diet_desc: "Dengan meningkatnya sentimen anti-militer di seluruh negeri, akan lebih bijaksana jika kita mengarahkan masyarakat yang kritis terhadap nasionalisme fanatik mereka ke arah kiri, dengan meminta Isoo menyampaikan pidato yang kritis terhadap tradisi kita, dan dengan menyebarkan propaganda komunis di jalan-jalan dengan segenap kemampuan partai."
 JAP_anti_militarist_speeches_in_the_diet_tt: "Membuka keputusan untuk §YMeningkatkan Dukungan Komunis§! di seluruh negeri"
 JAP_sway_disillusioned_young_officers: "Perwira Muda yang Kecewa"
 JAP_sway_disillusioned_young_officers_desc: "Sebagian besar perwira muda yang mengambil bagian dalam kudeta Kōdōha baru-baru ini berasal dari keluarga miskin di pedesaan yang tidak puas dengan struktur militer saat ini, dan sistem promosi melalui sejarah, bukan berdasarkan prestasi. Kita harus memanfaatkan ini dan menjanjikan mereka hari esok yang lebih baik."
 JAP_sway_disillusioned_young_officers_tt: "§YPerwira Muda Kōdōha§! akan bersimpati terhadap tujuan kita"
 JAP_sway_disillusioned_young_officers_2_tt: "Sebagian besar §YTentara Kekaisaran§! akan terpengaruh ke pihak kita dalam §YPerang Saudara§!"
 focus_effects_are_as_follows_tt: "Efek fokusnya adalah sebagai berikut:"
 JAP_organize_the_student_movements: "Mengorganisir Gerakan Mahasiswa"
 JAP_organize_the_student_movements_desc: "Para mahasiswa di universitas-universitas kami tidak puas dengan keadaan negara ini, dan memiliki gagasan yang sejalan dengan beberapa anggota JCP yang paling terkemuka. Kita harus membentuk Komite Perjuangan Bersama Seluruh Kampus dengan tujuan menyebarkan pemikiran sosialis ke seluruh kampus kita."
 JAP_organize_the_student_movements_tt: "Ketika §YPerang Saudara§! terjadi, pihak lawan akan mendapatkan semangat nasional berikut selama §Y365§! hari:"
 JAP_raise_support_within_the_proletarian_class: "Galang Dukungan dalam Kelas Proletar"
 JAP_raise_support_within_the_proletarian_class_desc: "Banyak pemimpin puncak kami berasal dari kelas pekerja, pernah bekerja di galangan kapal dan pabrik baja. Kita harus mendorong proletariat Jepang untuk berserikat, dan melawan mereka yang ingin menginjak-injak hak-hak mereka."
 JAP_raise_support_within_the_proletarian_class_tt: "§Y[529.GetName]§! akan mendukung JCP"
 JAP_raise_support_within_the_proletarian_class_2_tt: "Kita akan memperoleh §Y$JAP_strong_unions_idea$§! jika terjadi §YPerang Saudara§!"
 JAP_organize_underground_resistance: "Atur Perlawanan Bawah Tanah"
 JAP_organize_underground_resistance_desc: "Jika partai kita ingin melawan tidak hanya Angkatan Darat, tetapi bahkan pemerintah pusat, kita memerlukan basis operasi yang jauh dari jangkauan otoritas mereka. Dari sana kita harus bisa mulai membebaskan rekan-rekan kita dari penjara, dan memulai operasi untuk mengamankan senjata untuk revolusi."
 JAP_organize_underground_resistance_tt: "Membuka keputusan untuk §YMenggerebek Depot Senjata Tentara§! dan mendapatkan peralatan di awal revolusi, sambil memberikan malus kecil kepada pihak lawan"
 JAP_mountain_village_operation_units: "Unit Operasi Desa Pegunungan"
 JAP_mountain_village_operation_units_desc: "Sanzō Nosaka telah mengizinkan pembentukan unit paramiliter bawah tanah dan sel klandestin yang akan dibentuk di pedesaan dan desa-desa terpencil dengan tujuan melakukan operasi gerilya melawan pemerintah, dan mempersiapkan revolusi komunis berskala nasional. Untuk memfasilitasi hal ini, buku 'Cara Menanam Umbi Bunga' telah mulai didistribusikan ke seluruh negeri."
 JAP_mountain_village_operation_units_tt: "Membuka keputusan untuk §YMendirikan Unit Gerilya§! di negara bagian yang akan bangkit ketika waktunya tepat"
 JAP_return_of_the_manchukuo_exiles: "Kembalinya Orang-orang buangan Manchukuo"
 JAP_return_of_the_manchukuo_exiles_desc: "Banyak ahli teori dan ekonom sosialis bekerja di berbagai koperasi sindikalis dan industri lain yang didirikan di Manchuria setelah penaklukannya oleh Tentara Kwantung dengan harapan dapat membangun pemikiran revolusioner di sana, meskipun hal itu tidak berlangsung lama. Kita harus meminta PM sementara untuk memfasilitasi kembalinya orang-orang ini, dengan imbalan mengirim beberapa jenderal ke pengasingan."
 JAP_return_of_the_manchukuo_exiles_tt: "Hanya negara bagian dengan §Y$JAP_state_infiltrated_by_the_jcp$§! yang akan bergabung dengan kami pada awal §YPerang Saudara§!"
 JAP_return_of_the_manchukuo_exiles_2_tt: "§G5§! §YJenderal Keturunan Bangsawan yang setia pada IJA§! akan dikirim ke §YManchuria§! sebagai ganti §YIndustrialis Sosialis§!"
 JAP_organize_the_fifth_column: "Atur Kolom Kelima"
 JAP_organize_the_fifth_column_desc: "Saat empat kolom kami mendekati Osaka dan Tokyo, kolom pendukung kelima akan bangkit dari dalam kota dan melemahkan pertahanan musuh dari dalam. Kami akan mengorganisir 'Kolom Kelima' ini di semua kota yang kami dekati, sehingga memberikan kami keuntungan yang menentukan dalam perang demi pembebasan nasional."
 JAP_organize_the_fifth_column_tt: "Membuka keputusan untuk mendorong partisan §YMenghancurkan Unit Musuh§! selama perang saudara"
 JAP_organize_the_fifth_column_2_tt: "Dapatkan 5 unit dengan §Y5 batalion milisi§!.\n"
 JAP_revoke_the_peace_preservation_law: "Cabut UU Pelestarian Perdamaian"
 JAP_revoke_the_peace_preservation_law_desc: "Undang-undang Pelestarian Perdamaian yang keji telah memfasilitasi pembentukan Tokkō, yang telah mendatangkan malapetaka atas nama militer sejak Okada pertama kali berbicara menentang mereka. Hal ini juga menghambat proses demokrasi, karena melanggar hukum berbagai prinsip dan organisasi demokrasi. Sudah waktunya kita memberikan suara kita, dan merobek kertas yang membawa malapetaka ini."
 JAP_revoke_the_peace_preservation_law_requirements_tt: "Gabungan dukungan §YKomunis§! dan §YDemokrat§! mencapai lebih dari 50%"
 JAP_revoke_the_peace_preservation_law_tt: "§RBanyak koloni kita kemungkinan besar akan melihat ini sebagai kesempatan mereka untuk meninggalkan kekaisaran§!"
 JAP_a_red_sun_rises_for_a_new_era: "Matahari Merah Terbit untuk Era Baru"
 JAP_a_red_sun_rises_for_a_new_era_desc: "Revolusi sudah penuh kemenangan, hari sudah dimenangkan! Dengan kekalahan terakhir dari sel-sel anti-revolusioner, kita sekarang harus mulai melakukan reorganisasi negara secara sosialis. Namun ada perbedaan pendapat besar di dalam partai tentang bagaimana hal ini harus dilakukan. Oleh karena itu, kita harus mengadakan perdebatan besar untuk menentukan arah masa depan negara kita."
 JAP_the_lecture_group_ascendant: "Kelompok Dosen Ascendant"
 JAP_the_lecture_group_ascendant_desc: "Dalam perdebatan tersebut, faksi Kōza-ha yang lebih otoriter dan fokus pada proletar muncul sebagai pemenang. Pemimpin faksi ini, Sanzō Nosaka dan Kyūichi Tokuda akan mengambil pekerjaan berat untuk membentuk negara baru. Namun pertanyaannya adalah, siapa yang harus memimpin sebagai Ketua, dan siapa yang akan menjadi Perdana Menteri?"
 JAP_the_labor_farmer_faction_ascendant: "Fraksi Buruh-Petani yang Berpengaruh"
 JAP_the_labor_farmer_faction_ascendant_desc: "Dalam perdebatan tersebut, faksi Rōnō-ha yang lebih idealis dan berfokus pada petani muncul sebagai pemenang, secara ajaib mengalahkan Kōza-ha. Meskipun gerakan payung ini telah meraih kemenangan, pertanyaan utamanya masih tetap ada, siapa yang akan menjadi perdana menteri berikutnya di republik ini?"
 JAP_the_labor_farmer_faction_ascendant_tt: "Pengubah apa pun ditransfer ke §Y$JAP_rounouha_modifier$§!"
 JAP_sea_fate_of_the_imperial_family: "Nasib Keluarga Kekaisaran"
 JAP_sea_fate_of_the_imperial_family_desc: "Waktunya telah tiba untuk melihat dan menghilangkan sisa-sisa terakhir kekuasaan turun-temurun di Jepang. Ada banyak cara yang dapat kita lakukan, meskipun kita harus berhati-hati karena keluarga kekaisaran masih memiliki popularitas yang besar di kalangan rakyat kita. Kita harus memutuskan nasib apa yang akan menimpa mantan Kaisar dan keluarganya."
 JAP_hold_a_peoples_tribunal: "Adakan Pengadilan Rakyat"
 JAP_hold_a_peoples_tribunal_desc: "Ada banyak orang yang telah melakukan kejahatan berat atas nama pemerintahan masa lalu, dan telah berjuang melawan dan menumbangkan revolusi dan pendukungnya. Kita harus mengadili orang-orang ini secara terbuka, dan segera membasmi pembangkang kontra-revolusioner!"
 JAP_hold_a_peoples_tribunal_tt: "Beberapa §YPenasihat Militer§! diadili untuk berkolaborasi dengan pemerintah lama dan pensiun dari dinas aktif:"
 JAP_social_and_cultural_revolution: "Revolusi Sosial dan Budaya"
 JAP_social_and_cultural_revolution_desc: "Kita sekarang harus memulai tugas besar untuk menghilangkan sisa-sisa feodalisme, nasionalisme, dan tradisi konservatif sambil mempromosikan ideologi komunis di seluruh negara bagian. Kita harus menghilangkan Bushido dari pendidikan kita, dan mendorong masyarakat untuk memakai Youfuku, dan membuang pakaian tradisional apa pun demi pakaian barat, untuk menjadikan negara kita setara dengan masyarakat revolusioner lainnya."
 JAP_social_and_cultural_revolution_tt: "Ketika semangat nasional §Y$JAP_reorganization_of_society_idea$§! dihilangkan:\n"
 JAP_overhaul_the_education_system: "Merombak Sistem Pendidikan"
 JAP_overhaul_the_education_system_desc: "Sistem pendidikan masih didominasi oleh ide-ide dan cara-cara lama, serta mengedepankan pemikiran nasionalis dan patriotik. Kita harus segera memperbaiki hal ini, dan merombak sistem pendidikan untuk mendidik generasi muda kita dengan baik bagaimana menjadi pemimpin revolusioner."
 JAP_sea_nationalize_the_zaibatsus: "Nasionalisasikan Zaibatsus"
 JAP_sea_nationalize_the_zaibatsus_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya, namun semuanya berakhir di sini. Kontrol negara tidak akan ditantang. Kita harus menasionalisasi mereka dan menggunakan modal mereka untuk kepentingan rakyat!"
 JAP_can_no_longer_manually_promote_zaibatsus_tt: "Kami tidak lagi dapat §RMendukung Secara Manual§! §YFraksi Zaibatsu§!"
 JAP_a_functionalist_housing_policy: "Kebijakan Perumahan Fungsionalis"
 JAP_a_functionalist_housing_policy_desc: "Para ahli teori kami telah mengeluarkan rencana baru untuk membangun kelompok besar gedung apartemen atau rumah dengan gaya tertentu untuk digunakan sebagai perumahan umum yang akan diawasi oleh otoritas pemerintah. Dengan pembangunan yang mempertimbangkan fungsi, lebih banyak orang akan dapat memperoleh perumahan yang lebih murah di seluruh negara bagian."
 JAP_redistribute_land_and_wealth: "Mendistribusikan Kembali Tanah dan Kekayaan"
 JAP_redistribute_land_and_wealth_desc: "Sebagian besar tanah di seluruh negeri masih dimiliki oleh keluarga-keluarga yang termasuk dalam daimyo zaman dulu, yang menguasai wilayah yang luas. Tanah-tanah ini harus didistribusikan kembali kepada para petani kita, serta disita oleh negara untuk membangun kota-kota dan industri-industri baru."
 JAP_ganbarou: "Ganbarou!"
 JAP_ganbarou_desc: "Laki-laki dan perempuan [ROOT.GetAdjective] adalah pekerja keras yang akan memberikan segalanya untuk menafkahi negara. Kita harus mempropagandakan hal ini, dan mendorong kerja keras dan kerja keras sebagai bagian inti dari masyarakat [ROOT.GetAdjective]."
 JAP_cooperate_with_anarchists: "Bekerja sama dengan kaum Anarkis"
 JAP_cooperate_with_anarchists_desc: "Kaum anarkis disingkirkan oleh faksi-faksi lain di JCP, dan dipaksa berjuang sendiri melawan negara tirani. Kita harus mengundang mereka ke dalam payung gerakan kita, dan memastikan bahwa beberapa cita-cita mereka juga bisa menjadi kenyataan di masa depan yang kita impikan."
 JAP_the_ie_system_and_socialism: "Sistem Ie dan Sosialisme"
 JAP_the_ie_system_and_socialism_desc: "Sistem tradisional yaitu bagaimana keluarga diorganisasikan secara historis telah membentuk struktur sosial, praktik bisnis, dan bahkan organisasi perusahaan di negara kita. Kita harus memastikan bahwa hal ini tetap ada, namun dengan penekanan pada negara sebagai figur otoritas di dalamnya."
 JAP_fukumotoism: "Fukumotoisme"
 JAP_fukumotoism_desc: "Fukumoto Kazuo telah menekankan perlunya perjuangan teoretis dan politik oleh partai pelopor radikal yang akan menyuntikkan kesadaran Marxis ke dalam pekerja dari luar melalui perjuangan teoretis untuk mengembangkan gerakan tersebut menjadi perjuangan politik. Dengan memasukkan hal ini ke dalam tata kelola kita, kita dapat membangun cara yang lebih baik untuk menjangkau masyarakat kita dan menyebarkan ide apa pun yang kita inginkan kepada mereka."
 JAP_fukumotoism_tt: "Membuka keputusan yang dapat diambil hingga §G6§! kali yang memberikan bonus kepada §YPabrik Sipil§! dan §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 JAP_the_modern_ashigaru: "Ashigaru Modern"
 JAP_the_modern_ashigaru_desc: "Infanteri petani yang dipekerjakan oleh panglima perang Jepang untuk melengkapi samurai di pasukan mereka yang menjadi lazim selama periode Muromachi dikenal sebagai Ashigaru, dan tidak memiliki loyalitas tertentu. Untuk menambah kekuatan profesional kita, kita harus berusaha membangun kembali sistem serupa, di mana petani diwajibkan membela negara jika terjadi perang."
 JAP_the_modern_ashigaru_tt: "Membuka keputusan untuk §YMeningkatkan Milisi§! saat berperang"
 JAP_learn_from_the_nkvd: "Belajar dari NKVD"
 JAP_learn_from_the_nkvd_desc: "Polisi rahasia Soviet telah menyempurnakan seni menekan pembangkang dan kontra-revolusi. Meskipun kita tidak ingin bekerja sama dengan mereka, mungkin kita bisa belajar satu atau dua hal dari cara mereka melakukan sesuatu."
 JAP_further_urban_investments: "Investasi Perkotaan Lebih Lanjut"
 JAP_further_urban_investments_desc: "Pusat kota kita sangat membutuhkan investasi. Jika kita ingin industri yang berlokasi di perkotaan mempunyai efisiensi dan pekerja yang dibutuhkan untuk menjaga kuota produksinya, kita harus turun tangan dan membantu mereka."
 JAP_the_first_five_year_plan: "Rencana Lima Tahun Pertama"
 JAP_the_first_five_year_plan_desc: "Untuk menjamin masa depan masyarakat kita, kita harus membentuk sebuah komite yang mampu menghasilkan dan menerapkan model ekonomi baru yang berani untuk [ROOT.GetNameDef]. Rencana Lima Tahun yang baru ini akan membuat kita benar-benar berkembang dan sejahtera!"
 JAP_form_pioneer_organizations: "Membentuk Organisasi Perintis"
 JAP_form_pioneer_organizations_desc: "Partai perlu mendirikan organisasi-organisasi bagi kaum muda di mana mereka dapat mengambil bagian dalam kegiatan-kegiatan untuk menjadi komunis yang baik, mampu membantu negara dan bahkan suatu hari nanti membela negara."
 JAP_war_communism: "Komunisme Perang"
 JAP_war_communism_desc: "Kita harus mengadopsi versi sistem ekonomi dan politik yang ada di Soviet Rusia selama Perang Saudara Rusia dari tahun 1918 hingga 1921, yang mereka sebut sebagai komunisme perang. Hal ini harus memungkinkan kita untuk tetap memegang kendali dan mengambil keputusan yang diperlukan untuk membawa revolusi ke seluruh Asia melalui kekuatan senjata."
 JAP_war_communism_new_economy_law: "Membuka Undang-Undang Ekonomi baru: §Y$JAP_war_communism_idea$§!"
 JAP_the_uno_school_of_economics: "Sekolah Ekonomi Uno"
 JAP_the_uno_school_of_economics_desc: "Ahli teori politik dan ekonomi Kōzō Uno telah mengajukan teori tentang bagaimana mengubah model kapitalis sebelumnya menjadi pembangunan ekonomi aktual dan fasilitas yang diperlukan untuk mewujudkan sosialisme sejati. Inilah saatnya untuk mulai mewujudkan teorinya."
 JAP_the_uno_school_of_economics_tt: "Memulai misi yang akan mengurangi $MODIFIER_CONSUMER_GOODS_FACTOR$ kami sebesar §Y-2,5%§! setiap tahunnya"
 JAP_incorporate_buddhist_socialism: "Menggabungkan Sosialisme Buddha"
 JAP_incorporate_buddhist_socialism_desc: "Inoue Shuten dan Girō Seno'o telah mengajukan teori penerapan sosialisme berdasarkan prinsip-prinsip agama Buddha, dan melihatnya sebagai konsep serupa karena keduanya berupaya memberikan transformasi kesadaran pribadi untuk mengakhiri keterasingan dan keegoisan manusia. Kita harus mengundang para pemikir ini ke dalam gerakan kita."
 JAP_the_spirit_of_the_ikko_ikki: "Merevitalisasi Semangat Ikko Ikki"
 JAP_the_spirit_of_the_ikko_ikki_desc: "Penganut Buddha Jōdo Shinshū yang militeristik di masa lalu membuktikan kepada dunia bahwa para biksu kita harus ditakuti dalam pertempuran, dan melalui keyakinan mereka, jaringan kuil memungkinkan mobilisasi pasukan yang lebih efisien dan efektif ketika diperlukan. Kita harus dengan setia menghidupkan kembali semangat para pejuang Budha ini, saat kita bergerak menuju tanah suci!"
 JAP_achieving_joubukkokudo: "Umumkan Jobukkokudo"
 JAP_achieving_joubukkokudo_desc: "Kami, penyatuan ibu kota negara-negara Mahayana di Asia Timur, upaya kami untuk menciptakan Tanah Suci, di mana melalui cita-cita sosialis Buddhis yang baru, pembebasan spiritual serta emansipasi sosial dan ekonomi kami akan tercapai, telah berakhir. Puji Girō Seno'o, dan panjang umur Jōbukkokudo!"
 JAP_uplift_ainu_revolution_theory: "Mengangkat Teori Revolusi Ainu"
 JAP_uplift_ainu_revolution_theory_desc: "Banyak pemikir politik kita yang berpendapat bahwa lumpenproletariat adalah badan utama revolusi kita, dan masyarakat Ainu juga termasuk dalam kelompok ini. Lebih jauh lagi, mereka percaya bahwa masyarakat Ainu hidup dalam sistem komunis primitif dan menganggap mereka layak menjadi 'pemimpin revolusi Komunis'. Kita harus mendukung gerakan ini secara lebih luas."
 JAP_kikues_new_model: "Model Baru Kikue"
 JAP_kikues_new_model_desc: "Yamakawa Kikue telah lama mempromosikan gagasan untuk mengangkat perempuan Jepang menjadi bagian yang setara dalam masyarakat kita, dan ingin menjamin kesetaraan upah dan hak kerja, sekaligus menghapuskan sistem rumah tangga patriarki. Inilah saatnya untuk mengubah cita-cita ini menjadi kenyataan!"
 JAP_women_in_industry: "Perempuan di Industri"
 JAP_women_in_industry_desc: "Sudah terlalu lama perempuan diharapkan untuk tinggal di rumah dan mengurus keluarga. Jika seorang perempuan mampu menjadi pemimpin negara kita, maka sudah sepantasnya mereka diperbolehkan bekerja di industri lain juga. Hal ini hanya akan membantu masa depan ekonomi [ROOT.GetNameDef], karena hal ini akan memperluas tenaga kerja kita secara signifikan."
 JAP_form_national_cooperatives: "Membentuk Koperasi Nasional"
 JAP_form_national_cooperatives_desc: "Banyak pemikir kami menganjurkan pembentukan lebih banyak koperasi nasional, yaitu organisasi yang dibentuk oleh individu atau perusahaan yang memiliki kebutuhan ekonomi, sosial, atau budaya yang sama. Mereka beroperasi berdasarkan prinsip kepemilikan anggota, kontrol demokratis, dan saling menguntungkan. Kita harus mendorong terciptanya hal-hal ini."
 JAP_further_rural_investments: "Investasi Pedesaan Lebih Lanjut"
 JAP_further_rural_investments_desc: "Daerah pedesaan kita telah lama diabaikan oleh pemerintah pusat, dan pesatnya industrialisasi di kota-kota seperti Tokyo telah menarik orang-orang dari pedesaan, menyebabkan banyak kota dan desa berada dalam kesulitan. Kita harus berinvestasi di bidang-bidang ini, sehingga tenaga kerja yang diperlukan untuk menjaga agar sektor-sektor tersebut tetap beroperasi dapat tetap ada."
 JAP_further_rural_investments_tt: "Membuka keputusan untuk §GMeningkatkan§! §YKategori Negara Bagian§! negara bagian di atas jika negara bagian tersebut memiliki §Y4§! atau lebih §YInfrastruktur§!"
 JAP_adopt_syndicalist_ideas: "Mengadopsi Ide Sindikalis"
 JAP_adopt_syndicalist_ideas_desc: "Kita harus mengadopsi gagasan pembentukan koperasi sindikalis dalam industri kita, dan menggunakan gagasan mereka tentang bagaimana hubungan antara individu dan pemberi kerja berfungsi untuk memperbaiki model industri kita saat ini."
 JAP_raise_the_red_flag_high: "Kibarkan Bendera Merah Tinggi-tinggi"
 JAP_raise_the_red_flag_high_desc: "Bendera merah adalah simbol revolusi kami, dan menunjukkan tekad kami dalam memajukan revolusi, dengan harapan pada akhirnya membebaskan seluruh pekerja Asia dari penindasan borjuis. Saatnya telah tiba untuk dengan bangga mengibarkan bendera tinggi-tinggi, dan mendeklarasikan bahwa revolusi akan terus berjalan, selamanya!"
 JAP_guide_the_lesser_states: "Pandu Negara-negara Kecil"
 JAP_guide_the_lesser_states_desc: "Negara-negara Asia yang kurang berkembang tidak mempunyai prasyarat untuk mewujudkan revolusi dan berhasil mendirikan republik buruh mereka sendiri. Kita harus membimbing mereka, dan menunjukkan kepada mereka bagaimana menjalankan negara dengan baik."
 JAP_pan_asian_revolutuonary_front: "Front Revolusioner Pan-Asia"
 JAP_socialism_in_one_state: "Sosialisme dalam Satu Negara"
 JAP_socialism_in_one_state_desc: "Satu-satunya yang dapat mendidik dan mengangkat semangat masyarakat Asia adalah kami, yang telah menunjukkan bahwa revolusi dapat berhasil. Kita harus mengajak mereka untuk menunjukkan kepada mereka bagaimana menjalani hidup, melalui kekuatan senjata jika perlu."
 JAP_the_courage_to_defend_the_revolution: "Keberanian Membela Revolusi"
 JAP_the_courage_to_defend_the_revolution_desc: "Setiap pria dan wanita harus menunjukkan keberanian dan tekad untuk membela revolusi dari berbagai kekuatan kontra-revolusioner di seluruh dunia. Waktunya telah tiba untuk mempertahankan cita-cita kita dengan semua yang kita miliki!"
 JAP_demand_submission_from_breawakay_states: "Pengajuan Permintaan dari Negara-Negara yang Memisahkan Diri"
 JAP_demand_submission_from_breawakay_states_desc: "Negara-negara yang secara ilegal memisahkan diri dari kita hanya melakukan kesalahan dan tidak menyadari bahwa revolusi rakyat akan berhasil. Kita harus mendekati mereka dan membuat pernyataan tegas, menuntut mereka tunduk pada partai dan membiarkan rakyatnya bebas dari penindasan kapitalis."
 JAP_ignite_the_korean_peninsula: "Nyalakan Semenanjung Korea"
 JAP_ignite_the_korean_peninsula_desc: "Masyarakat [KOR.GetAdjective] belum dibebaskan. Kita harus menjalin kontak dengan kaum revolusioner di [KOR.GetAdjective] selatan, dan meminta mereka memulai revolusinya. Hal ini harus memberikan kesempatan bagi kita untuk turun tangan dan melindungi masyarakat [KOR.GetAdjective] dari perang saudara yang terjadi kemudian."
 JAP_ignite_the_korean_peninsula_tt: "Memulai perang saudara di [KOR.GetNameDef], yang mana pihak komunis menjadi boneka kami"
 JAP_protect_the_manchurians: "Lindungi orang Manchuria"
 JAP_protect_the_manchurians_desc: "Bangsa Manchuria masih berada di bawah penindasan sisa-sisa Tentara Kwantung yang lama. Kita harus membereskan kekacauan kita sendiri, dan bertindak untuk membebaskan masyarakat. Ini saatnya untuk menyelesaikan pertarungan, dan menyelesaikan skor kita dengan Tentara Kekaisaran!"
 JAP_guide_the_chinese: "Untuk Membimbing Orang Cina"
 JAP_guide_the_chinese_desc: "Revolusi masih belum berhasil di Tiongkok. Kita harus turun tangan dan secara pribadi membimbing rakyat Tiongkok menuju kemakmuran, dan membebaskan mereka dari cara hidup mereka yang feodal dan ketinggalan jaman."
 JAP_guide_the_chinese_tt: "Kita akan mendapatkan tujuan perang §YBoneka§! terhadap setiap negara §YTionghoa Non-Komunis§!. Target saat ini:"
 JAP_guide_the_chinese_2_tt: "Setiap §Ynegara Komunis Tiongkok§! diundang ke faksi kami. Target saat ini:"
 JAP_guide_the_mongols: "Bimbing bangsa Mongol"
 JAP_guide_the_mongols_desc: "Revolusi mungkin berhasil di sebagian wilayah Mongolia, namun kini mereka malah berada di bawah penindasan Soviet. Kita harus turun tangan dan secara pribadi membimbing rakyat Mongolia menuju kemakmuran, dan membebaskan mereka dari cara hidup mereka yang feodal, ketinggalan jaman, dan otoriter."
 JAP_spread_the_revolutuon_south: "Sebarkan Revolusi ke Selatan"
 JAP_spread_the_revolutuon_south_desc: "Api revolusi harus segera dipadamkan jika masyarakat Asia ingin dibebaskan. Ini adalah saat yang tepat bagi kita untuk bergerak dan menjamin masa depan yang lebih cerah bagi seluruh masyarakat Asia!"
 JAP_free_asians_from_soviet_opression: "Bebaskan Orang Asia dari Pendudukan Soviet"
 JAP_free_asians_from_soviet_opression_desc: "Kaum Bolshevik Rusia tidak lebih baik dari kaum kapitalis yang berusaha mengendalikan rakyat dan menyangkal masa depan mereka. Kita tidak bisa berpangku tangan ketika mereka terus menindas masyarakat Asia. Saatnya bertindak!"
 JAP_go_after_the_capitalists: "Kejar Kaum Kapitalis"
 JAP_go_after_the_capitalists_desc: "Para kapitalis Barat berusaha mencuri dari masyarakat Asia tanpa memberikan imbalan apa pun. Kita harus menjatuhkan mereka, sebelum mereka mengeksploitasi masyarakat hingga tidak dapat kembali lagi."
 JAP_a_free_asia_pacific: "Asia-Pasifik yang Merdeka"
 JAP_a_free_asia_pacific_desc: "Harinya akhirnya telah tiba, dimana masyarakat di seluruh Asia akan dapat menjalani hidup mereka dengan bebas tanpa dieksploitasi oleh pihak asing dan pemerintah yang tidak begitu peduli terhadap kesejahteraan mereka. Hidup [ROOT.GetNameDef], dan hidup para pekerja di Asia!"
 JAP_the_pan_asian_revolutionary_front: "Front Revolusioner Pan-Asia"
 JAP_the_pan_asian_revolutionary_front_desc: "Untuk membimbing berbagai partai revolusioner di Asia, kita harus mengorganisir sebuah aliansi dan organisasi supranasional yang memberikan arahan kepada negara-negara kurang berkembang, dan yang dapat mengkoordinasikan investasi untuk memperbaiki masyarakat mereka dengan lebih cepat."
 JAP_educate_the_peasants: "Mendidik Petani"
 JAP_educate_the_peasants_desc: "Pendidikan bagi para petani di benua ini sudah terlalu lama diabaikan. Sudah saatnya kita mulai mengkoordinasikan upaya antar anggota aliansi, sehingga kita dapat meningkatkan pengetahuan di dunia kerja."
 JAP_educate_the_peasants_tt: "Bonus kecepatan penelitian dari §Y$JAP_educating_the_peasants_modifier$§! meningkat sebesar §G1%§! untuk setiap anggota faksi baru, hingga maksimum §G10%§!"
 JAP_a_common_currency_for_all_of_asia: "Mata Uang Umum untuk Seluruh Asia"
 JAP_a_common_currency_for_all_of_asia_desc: "Sebagai bagian dari koordinasi internasional, kita harus berupaya agar semua negara revolusioner mengadopsi yen sebagai mata uang resmi mereka, sehingga adat istiadat dan serikat buruh dapat dibentuk dengan baik."
 JAP_the_minitry_of_pan_asian_development: "Kementerian Pembangunan Pan-Asia"
 JAP_the_minitry_of_pan_asian_development_desc: "Untuk meningkatkan kondisi kehidupan di berbagai negara Asia dengan lebih baik, kita harus membentuk kementerian pusat yang mengawasi investasi dalam pembangunan, dan membantu pengorganisasian program industri dan ekonomi."
 JAP_development_for_the_undeveloped: "Pembangunan untuk Masyarakat Terbelakang"
 JAP_development_for_the_undeveloped_desc: "Untuk mewujudkan revolusi yang sebenarnya, kita harus mengembangkan negara-negara kurang berkembang, dan meningkatkan infrastruktur dan kapasitas industri di negara-negara anggota aliansi yang lebih kecil."
 JAP_a_pan_asian_diet: "Diet Pan-Asia"
 JAP_a_pan_asian_diet_desc: "Untuk mendekatkan negara-negara revolusioner di Asia, kita harus membentuk sebuah badan pemerintahan yang mencakup perwakilan dari semua negara anggota, di mana mereka memilih undang-undang dan lembaga mana yang akan diterapkan di republik-republik persaudaraan kita."
 JAP_extensive_navy_maneuvers: "Memulai Manuver Angkatan Laut yang Luas"
 JAP_extensive_navy_maneuvers_desc: "Untuk menjatuhkan negara-negara yang memisahkan diri yang muncul ketika negara kita dilanda perang saudara, kita harus memastikan bahwa angkatan laut kita siap menghadapinya. Oleh karena itu kita harus mengatur manuver skala besar untuk memastikan kita siap berperang."
 JAP_extensive_army_maneuvers: "Memulai Manuver Tentara yang Luas"
 JAP_extensive_army_maneuvers_desc: "Untuk menjatuhkan Tentara Kwantung yang mengambil alih Manchuria ketika negara kita dilanda perang saudara, kita harus memastikan bahwa tentara kita siap dan siap menghadapi mereka. Oleh karena itu kita harus mengatur manuver skala besar untuk memastikan kita siap berperang."
 JAP_reclaim_lost_territories: "Rebut kembali Wilayah yang Hilang"
 JAP_reclaim_lost_territories_desc: "Sudah waktunya untuk kembali ke daerah-daerah yang telah memisahkan diri dari wilayah kita dan membawanya kembali ke dalam republik kita. Hanya melalui intervensi militer kita dapat menjamin bahwa masyarakat di wilayah ini akan bisa sejahtera."
 JAP_conquer_the_army_remnants: "Taklukkan Sisa-sisa Tentara"
 JAP_conquer_the_army_remnants_desc: "Waktunya telah tiba untuk menyelesaikan pertarungan yang kita mulai, dan mengakhiri sisa-sisa terakhir Tentara Kekaisaran dan perang saudara kita. Kita harus menjatuhkan Tentara Kwantung dan merebut kembali Manchuria!"
 JAP_put_an_end_to_chinese_feudalism: "Mengakhiri Feodalisme Tiongkok"
 JAP_put_an_end_to_chinese_feudalism_desc: "Tradisi feodal masih berkuasa di Tiongkok, dan ada jutaan orang yang harus dibebaskan dan dibawa ke republik revolusioner kita. Dekrit akan dikeluarkan, dan rakyat Tiongkok akan dibebaskan untuk selamanya!"
 JAP_mobilize_the_proletariat: "Memobilisasi Proletariat"
 JAP_mobilize_the_proletariat_desc: "Para pekerja telah melakukan tugasnya dengan baik dengan menyediakan senjata untuk militer kita, namun saat-saat sulit memerlukan tindakan yang sangat mendesak. Sudah saatnya kita menambah kuota produksi, meski hanya sementara, agar semua persenjataan yang dibutuhkan tentara bisa tercukupi."
 JAP_the_long_march_to_victory: "Perjalanan Panjang Menuju Kemenangan"
 JAP_the_long_march_to_victory_desc: "Untuk menghancurkan pemerintahan Tiongkok, kita perlu bergerak jauh ke benua Asia. Kita harus melakukan kampanye propaganda yang mengacu pada long march, dengan harapan hal ini akan meningkatkan kemauan prajurit kita untuk terus melakukan long march selama diperlukan!"
 JAP_the_pacific_union_of_soviet_socialist_republics: "Uni Pasifik Republik Sosialis Soviet"
 JAP_the_pacific_union_of_soviet_socialist_republics_desc: "Saat yang kita perjuangkan akhirnya tiba. Waktunya telah tiba untuk mendeklarasikan pembentukan negara Asia baru, yang akan menyatukan berbagai soviet menjadi satu kesatuan."
 JAP_the_pacific_union_of_soviet_socialist_republics_tt: "Kita akan dikenal sebagai §YUni Pasifik Republik Sosialis Soviet§!"
 JAP_the_indochinese_soviet: "Soviet Indochina"
 JAP_the_indochinese_soviet_desc: "Sekarang setelah serikat pekerja didirikan, kita harus mendirikan Republik Soviet yang baru dan menyatukannya. Kita harus membentuk Soviet Indochina untuk membenarkan pendudukan kita di wilayah tersebut."
 JAP_transformation_of_nature: "Transformasi Alam"
 JAP_transformation_of_nature_desc: "Asia kaya akan sumber daya alam dan tinggal menunggu untuk dimanfaatkan. Dengan komunitas ilmiah kita yang melampaui apa yang sebelumnya dianggap mungkin, bahkan proyek terbesar dan paling invasif pun menjadi mungkin dilakukan. Lingkungan harus dibentuk dan dibentuk dalam skala besar agar dapat menguntungkan masyarakat!"
 JAP_the_south_pacific_soviet: "Soviet Pasifik Selatan"
 JAP_the_south_pacific_soviet_desc: "Sekarang setelah serikat pekerja didirikan, kita harus mendirikan Republik Soviet yang baru dan menyatukannya. Kita harus membentuk Soviet Pasifik Selatan untuk membenarkan pendudukan kita di wilayah tersebut."
 JAP_the_oceanian_soviet: "Soviet Oseania"
 JAP_the_oceanian_soviet_desc: "Kini setelah Soviet Pasifik Selatan terbentuk, kita harus mendorong batas wilayah kita lebih jauh ke selatan. Untuk mencapai tujuan ini, kita harus membentuk Soviet Oseania untuk membenarkan pendudukan kita di wilayah tersebut."
 JAP_strike_down_the_great_pretender: "Hancurkan Si Penipu Hebat"
 JAP_strike_down_the_great_pretender_desc: "Kaum Bolshevik di Uni Soviet berpura-pura membela rakyat, dan menguasai sebagian Asia dengan tirani. Kita harus meruntuhkan kediktatoran borjuis yang menyamar sebagai kekuatan revolusioner, dan mendeklarasikan diri kita sebagai satu-satunya pembela revolusi!"
 JAP_a_red_dawn_over_asia: "Fajar Merah di Asia"
 JAP_a_red_dawn_over_asia_desc: "Dengan kemenangan kekuatan kita dan perbatasan kita yang terbentang luas di Samudera Pasifik, revolusi ini semakin dekat dengan kemenangan dibandingkan sebelumnya. Matahari merah menyinari langit, saat fajar mengantarkan era baru bagi Asia!"
 JAP_to_rival_the_comintern: "Untuk Menyaingi Komintern"
 JAP_to_rival_the_comintern_desc: "Sejak berdirinya Internasional Keempat oleh kaum Trotskyis, banyak yang menyerukan pembentukan Internasional Komunis Kelima yang akan bertindak sebagai penyeimbang baik terhadap Internasional Komunis maupun Komintern. Kita harus mengambil jubah ini, dan mendeklarasikan diri kita sebagai pembela revolusi yang sebenarnya!"
 JAP_alternative_communist_international: "Komunis Internasional Kelima"
 JAP_wrestle_mongolia_from_the_soviets: "Bergulat dengan bangsa Mongol keluar dari wilayah Soviet"
 JAP_wrestle_mongolia_from_the_soviets_desc: "Bangsa Mongol telah berada di bawah pengawasan Rusia selama bertahun-tahun dan mendambakan kesempatan untuk menjauhkan diri dari bangsa Eropa. Kita bisa memberi mereka kesempatan itu, dan harus mengundang mereka ke Internasional. Namun hal ini dapat memperburuk ketegangan dengan [SOV.GetNameDef]."
 JAP_wrestle_tuva_from_the_soviets: "Bergulat dengan Tuva dari wilayah Soviet"
 JAP_wrestle_tuva_from_the_soviets_desc: "Masyarakat Tuva telah berada di bawah pengawasan Rusia selama bertahun-tahun dan mendambakan kesempatan untuk menjauhkan diri dari bangsa Eropa. Kita bisa memberi mereka kesempatan itu, dan harus mengundang mereka ke Internasional. Namun hal ini dapat memperburuk ketegangan dengan [SOV.GetNameDef]."
 JAP_spread_revolutionary_flames_to_south_asia: "Sebarkan Api Revolusioner ke Asia Selatan"
 JAP_spread_revolutionary_flames_to_south_asia_desc: "Api revolusi menyebar jauh dan luas, dan keberhasilan kampanye kami menginspirasi kaum proletar di mana pun. Kita harus mulai mendanai kelompok-kelompok revolusioner di Asia Selatan untuk menggoyahkan kawasan ini dan menjadikan mereka internasional kelima."
 JAP_spread_revolutionary_flames_to_south_asia_tt: "Membuka keputusan untuk mengundang negara-negara §YKomunis Asia Selatan§! ke dalam faksi kami"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt: "Membuka keputusan untuk §YMenggerakkan Sentimen Komunis§! di negara-negara §YAsia Selatan§!"
 JAP_spread_revolutionary_flames_to_west_asia: "Sebarkan Api Revolusioner ke Asia Barat"
 JAP_spread_revolutionary_flames_to_west_asia_desc: "Api revolusi menyebar jauh dan luas, dan keberhasilan kampanye kami menginspirasi kaum proletar di mana pun. Kita harus mulai mendanai kelompok-kelompok revolusioner di Asia Barat untuk menggoyahkan kawasan ini dan menjadikan mereka internasional kelima."
 JAP_spread_revolutionary_flames_to_west_asia_tt: "Membuka keputusan untuk mengundang negara-negara §YKomunis Timur Tengah§! ke dalam faksi kami"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt: "Membuka keputusan untuk §YMenggerakkan Sentimen Komunis§! di negara-negara §YTimur Tengah§!"
 JAP_trans_pacific_influence: "Pengaruh Transpasifik"
 JAP_trans_pacific_influence_desc: "Api revolusi menyebar jauh dan luas, dan keberhasilan kampanye kami menginspirasi kaum proletar di mana pun. Kita harus mulai mendanai kelompok-kelompok revolusioner di seberang lautan untuk menggoyahkan kawasan ini dan membawa mereka ke dalam internasional kelima."
 JAP_trans_pacific_influence_tt: "Membuka keputusan untuk mengundang negara-negara §YKomunis Amerika Selatan§! ke dalam faksi kami"
 JAP_build_an_anti_army_coalition: "Membangun Koalisi Anti-Tentara"
 JAP_build_an_anti_army_coalition_desc: "Untuk melawan pengaruh tentara yang sudah kuat, kita tidak bisa melanjutkan pertengkaran antar partai. Kita harus berupaya membentuk koalisi yang bersama-sama dapat mendorong Jepang menuju masa depan yang lebih cerah."
 JAP_ensure_cross_party_support: "Memastikan Kerja Sama Lintas Pihak"
 JAP_ensure_cross_party_support_desc: "Kini, ketika koalisi sedang berjalan, kita harus berusaha keras untuk mendapatkan dukungan dari partai-partai lain juga, agar kita tidak terpuruk saat menghadapi kesulitan. Bersama-sama, kita dapat mengembalikan semangat demokrasi Taishō!"
 JAP_gather_royal_pacifists_support: "Kumpulkan Dukungan Royal Pacificists"
 JAP_gather_royal_pacifists_support_desc: "Ada banyak anggota keluarga kerajaan yang tidak mendukung gagasan dominasi militer atas politik dan doktrin perang total. Kita harus menghubungi Sadako Kujō, Nobuhito dan Koichi Kidō untuk mendapatkan dukungan mereka dalam mengusir elemen militer dari pemerintahan kita."
 JAP_gather_royal_pacifists_support_tt: "Jika §YKaisar Hirohito§! memihak militer selama §YPerang Saudara§!, kita akan dapat mempertahankan §YDukungan Kerajaan§! dari adik laki-lakinya §YNobuhito§! dan ibunya §YSadako Kujō§!"
 JAP_limit_military_power: "Dorongan untuk Membatasi Kekuatan Militer"
 JAP_limit_military_power_desc: "Untuk mencegah terjadinya kudeta lagi, kita harus menurunkan sebanyak mungkin personel militer dari jabatan-jabatan penting tanpa memicu pemberontakan. Dengan melakukan hal ini, kita mungkin bisa menghentikan mereka untuk mematikan obor kebebasan."
 JAP_limit_military_power_tt: "Ketika §YPerang Saudara§! terjadi, pihak lawan akan mendapatkan semangat nasional berikut selama §Y365§! hari:"
 JAP_divert_military_funds: "Alihkan Dana Militer"
 JAP_divert_military_funds_desc: "Karena pemberontakan tampaknya semakin dekat, jika kita ingin melemahkan militer hingga mereka tidak mampu menjatuhkan kita, kita harus mengalihkan pendanaan mereka ke sumber lain. Dengan melakukan hal ini, mereka akan mengalami defisit untuk beberapa waktu ke depan."
 JAP_divert_military_funds_tt: "Setiap negara bagian yang tidak berada di bawah §YKontrol Angkatan Darat§! akan bergabung dengan kita pada awal §YPerang Saudara§!"
 JAP_sway_the_navy_moderates: "Goyangkan Angkatan Laut Moderat"
 JAP_sway_the_navy_moderates_desc: "Ada banyak orang berpangkat tinggi di angkatan laut yang jauh lebih berakal sehat daripada mereka yang berada di tentara. Jika kita mendekati mantan anggota faksi perjanjian, kita mungkin bisa mendapatkan dukungan mereka, dan bahkan mungkin dukungan jika terjadi perang saudara."
 JAP_sway_the_navy_moderates_tt: "Kami akan mempertahankan bagian yang lebih besar dari §YAngkatan Laut Kekaisaran§! dan pasukan mereka untuk §YPerang Saudara§!"
 JAP_sway_the_navy_moderates_2_tt: "§G4§! §YLaksamana§! akan setia kepada kita"
 JAP_bribe_generals: "Jenderal Suap"
 JAP_bribe_generals_desc: "Meski radikal, tidak semua staf militer kita ingin berpihak pada kejahatan. Mereka bergabung dengan rekan-rekan mereka di militer karena tugas dan kehormatan, tapi mungkin mereka bisa diyakinkan untuk mendukung tujuan yang lebih baik, jika diberi waktu dan usaha yang cukup."
 JAP_bribe_generals_tt: "§G4§! §YJenderal§! akan setia kepada kita"
 JAP_appoint_new_generals: "Tunjuk Jenderal Baru"
 JAP_appoint_new_generals_desc: "Kini, karena banyak jenderal yang memutuskan untuk menentang kami, kami menghadapi kekurangan perwira yang kompeten untuk memimpin pasukan kami. Kita harus melakukan semua yang kita bisa untuk memperbaiki hal ini, dan merekrut generasi baru komandan angkatan bersenjata."
 JAP_implement_army_reforms: "Melaksanakan Reformasi Angkatan Darat"
 JAP_implement_army_reforms_desc: "Dengan disingkirkannya staf militer lama, sudah saatnya kita menghapus gagasan-gagasan kuno mereka mengenai peperangan. Tentara perlahan-lahan akan direorganisasi menjadi kekuatan pertahanan diri, dan 'prinsip serangan pertama' akan segera menjadi gagasan lain di masa lalu."
 JAP_implement_army_reforms_tt: "§RMenghilangkan§! kemampuan untuk mendapatkan §YPrinsip Serangan Pertama§! dan pengubah §YKantai Kessen§! yang ditawarkan oleh §YRencana Pertahanan Kekaisaran§! fokus"
 JAP_a_new_take_on_state_shintoism: "Mempromosikan Teori Kuil Sekuler"
 JAP_a_new_take_on_state_shintoism_desc: "Kebijakan agama dan teori politik yang muncul pada masa pemerintahan Meiji, yang disebut sebagai Jinja hishūkyōron, mempromosikan gagasan bahwa Kuil Shinto bersifat sekuler dan bukan religius, dan bahwa Shinto hanyalah seperangkat tradisi nasional Jepang yang sekuler. Kita harus terus mempromosikan teori ini, sehingga kita dapat memanfaatkan gerakan ini untuk keuntungan kita sendiri."
 JAP_crush_the_spirit_of_gekokujo: "Hancurkan Semangat Gekokujo"
 JAP_crush_the_spirit_of_gekokujo_desc: "Selama periode awal Showa, tindakan gekokujō berulang kali terjadi, di mana orang-orang berpangkat lebih rendah di militer mencoba menggulingkan mereka yang memiliki posisi lebih tinggi, sesuatu yang mengancam akan mengganggu rantai komando kita. Kita harus menindak ide-ide ini secepat mungkin!"
 JAP_organize_a_general_election: "Menyelenggarakan Pemilihan Umum"
 JAP_organize_a_general_election_desc: "Kini setelah perselisihan sipil akhirnya berakhir, inilah saatnya kita bersiap untuk membangun kembali dan kembali ke tradisi demokrasi kita. Untuk pertama kalinya sejak Meiji sendiri, kita harus menyelenggarakan pemilu yang bebas dari pengaruh dan korupsi dari pihak militer, dan membiarkan rakyat menentukan masa depan mereka sendiri!"
 JAP_draft_the_showa_constitution: "[JAP_draft_the_showa_constitution_key]"
 JAP_draft_the_showa_constitution_desc: "[JAP_draft_the_showa_constitution_desc_key]"
 JAP_draft_the_showa_constitution_key_emperor_eian: "Draf Konstitusi Eian" # Eian (永安)
 JAP_draft_the_showa_constitution_key_emperor_showa: "Draf Konstitusi Showa"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian: "Kami menerima dan menghormati sejarah kekaisaran bangsa kami. Namun, otoritarianisme tidak mendapat tempat di Jepang yang ingin kita bangun. Kami akan mempertahankan Kaisar baru sebagai pemimpin boneka, namun kami akan membatasi kekuasaannya dalam konstitusi, seperti yang terjadi di banyak negara Barat."
 JAP_draft_the_showa_constitution_desc_key_emperor_showa: "Kami menerima dan menghormati sejarah kekaisaran bangsa kami. Namun, otoritarianisme tidak mendapat tempat di Jepang yang ingin kita bangun. Kami akan mempertahankan Kaisar sebagai pemimpin boneka, namun kami akan membatasi kekuasaannya dalam konstitusi, seperti yang terjadi di banyak negara Barat."
 JAP_form_the_ldp: "Bentuk LDP"
 JAP_form_the_ldp_desc: "Kini Rikken Seiyūkai telah mendapatkan kendali atas diet dan kabinet, sekarang saatnya untuk melakukan reformasi menjadi badan pemerintahan yang lebih efisien. Mengikuti arahan Ichiro Hatoyama, sekarang saatnya untuk mendirikan Partai Demokrat Liberal, yang bertujuan untuk memerintah negara di masa mendatang."
 JAP_rikken_minseito_victory: "Kemenangan Rikken Minseito"
 JAP_rikken_minseito_victory_desc: "Hasil pemilu telah diputuskan. Rikken Minseitō yang liberal-progresif telah meraih kemenangan telak, dan siap menjadi mayoritas di masa depan. Tampaknya rakyat telah memutuskan arah mana yang mereka inginkan untuk negara ini tuju."
 JAP_rikken_minseito_victory_flag: "Rikken Minseitō telah memenangkan Pemilihan Umum"
 JAP_rikken_seiyukai_victory: "Kemenangan Rikken Seiyukai"
 JAP_rikken_seiyukai_victory_desc: "Hasil pemilu telah diputuskan. Rikken Seiyūkai yang berhaluan liberal-konservatif telah meraih kemenangan telak dan diperkirakan akan menjadi mayoritas di masa mendatang. Tampaknya rakyat telah memutuskan arah mana yang mereka inginkan untuk negara ini tuju."
 JAP_rikken_seiyukai_victory_flag: "Rikken Seiyūkai telah memenangkan Pemilihan Umum"
 JAP_minshu_shugi: "Minshu Shugi"
 JAP_minshu_shugi_desc: "Meskipun sampai saat ini kita masih mengikuti doktrin politik Minpon Shugi, demokrasi sejati ada di dalam batasan Minshu Shugi. Lagi pula, 'dalam hukum, kedaulatan negara ada di tangan rakyat', hal ini tidak berlaku dalam doktrin Minpon, karena doktrin ini menekankan kedaulatan monarki di atas segalanya. Kita harus memasukkan ide-ide baru ini ke dalam konstitusi!"
 JAP_minpon_shugi: "Minpon Shugi"
 JAP_minpon_shugi_desc: "Doktrin politik Minpon Shugi yang lahir pada era Taishō dapat diartikan sebagai 'kebijakan dalam menjalankan kekuasaan politik yang menghargai keuntungan, kebahagiaan, dan pendapat rakyat'. Hal ini tidak melanggar institusi kekaisaran, dan bermanfaat bagi rakyat dan kaisar. Kita harus melanjutkan demokrasi kita berdasarkan kedaulatan monarki, dan memasukkannya ke dalam konstitusi baru kita!"
 JAP_promote_meritocracy: "Mempromosikan Meritokrasi"
 JAP_promote_meritocracy_desc: "Suatu negara tidak akan berfungsi secara efisien jika kita tidak mempromosikan orang-orang yang berprestasi ke posisi yang sesuai bagi mereka. Orang yang memiliki pengetahuan di bidang elektronik harus memimpin industri elektronik, bukan politisi yang memiliki koneksi ke kabinet. Sudah waktunya kita menghilangkan tradisi Amakudari, dan menerapkan meritokrasi demi kebaikan bangsa!"
 JAP_experimental_housing_solutions: "Solusi Perumahan Eksperimental"
 JAP_experimental_housing_solutions_desc: "Pembangunan perkotaan harus dipandu oleh empat kategori fungsional: pemukiman, pekerjaan, transportasi, dan rekreasi. Kenzo Tange bersama arsitek pemula lainnya telah mengusulkan cara baru membangun kota, sebagai bagian dari gerakan baru dan mendatang yang mereka sebut sebagai metabolisme. Kita harus mempromosikan gagasan ini, sehingga kita dapat memperbaiki situasi kehidupan seluruh warga negara kita."
 JAP_embrace_amakudari: "Rangkullah Amakudari"
 JAP_embrace_amakudari_desc: "Amakudari, yang secara harfiah berarti turun dari surga, menggambarkan praktik di mana pensiunan birokrat tingkat tinggi mengambil posisi manajemen senior di perusahaan swasta, seringkali dalam industri yang sama dengan yang mereka kelola sebelumnya. Meskipun hal ini mungkin akan memperburuk efisiensi industri kita, hal ini memberikan kita wawasan dan kendali yang signifikan terhadap masyarakat kita."
 JAP_agricultural_protectionism: "Proteksionisme Pertanian"
 JAP_agricultural_protectionism_desc: "Perekonomian dunia semakin memusuhi cara produksi tradisional kita. Jika kita tidak mengambil langkah-langkah untuk melindungi para petani, kita akan segera menghadapi krisis yang sangat besar karena para petani kita tidak akan mampu bersaing dengan bahan pangan yang diproduksi secara massal yang datang dari luar negeri."
 JAP_machida_chuuji_focus: "Liga Utama Machida Chuji"
 JAP_machida_chuuji_focus_desc: "Machida Chūji, pemimpin Rikken Minseitō yang berkuasa saat ini, harus didorong untuk membentuk kabinet baru yang akan mendorong pembentukan konstitusi baru kita. Dengan ini, kita tidak lagi mempunyai perdana menteri sementara, dan tatanan sebelum perselisihan dimulai pada akhirnya akan dipulihkan."
 JAP_abe_isoo_focus: "Liga Utama Abe Isoo"
 JAP_abe_isoo_focus_desc: "Abe Isoo, pemimpin Shakai Taishūtō saat ini dan bapak bisbol Jepang, harus didorong untuk membentuk kabinet baru yang akan mendorong pembentukan konstitusi baru kita. Dengan ini, kita tidak lagi mempunyai perdana menteri sementara, dan tatanan sebelum perselisihan dimulai pada akhirnya akan dipulihkan."
 JAP_uplift_labor_unions: "Mempromosikan Serikat Pekerja"
 JAP_uplift_labor_unions_desc: "Serikat buruh membantu rakyat kita mengatur diri mereka sendiri, dan membantu kita dalam membangun kembali dan memperbaiki industri yang dirusak oleh militer sebelum dan selama perang saudara. Kita harus meningkatkan organisasi-organisasi ini lebih jauh lagi, hingga suatu hari kita dapat membentuk masyarakat sejahtera Jepang."
 JAP_tokugawa_iesato_focus: "Liga Utama Tokugawa Iesato"
 JAP_tokugawa_iesato_focus_desc: "Tokugawa Iesato yang sangat populer, Presiden House of Peers dan pewaris Keshogunan Tokugawa, harus didorong untuk membentuk kabinet baru yang akan mendorong pembentukan konstitusi baru kita. Dengan ini, kita tidak lagi mempunyai perdana menteri sementara, dan tatanan sebelum perselisihan dimulai pada akhirnya akan dipulihkan."
 JAP_ichiro_hatoyama_focus: "Liga Utama Ichiro Hatoyama"
 JAP_ichiro_hatoyama_focus_desc: "Ichiro Hatoyama, pemimpin Rikken Seiyūkai yang berkuasa saat ini, harus didorong untuk membentuk kabinet baru yang akan mendorong pembentukan konstitusi baru kita. Dengan ini, kita tidak lagi mempunyai perdana menteri sementara, dan tatanan sebelum perselisihan dimulai pada akhirnya akan dipulihkan."
 JAP_mitsumasa_yonai_focus: "Liga Utama Mitsumasa Yonai"
 JAP_mitsumasa_yonai_focus_desc: "Mitsumasa Yonai, laksamana moderat yang merupakan bagian penting dari faksi pro-perjanjian barat di angkatan laut, harus didorong untuk membentuk kabinet baru yang akan mendorong pembentukan konstitusi baru kita. Dengan ini, kita tidak lagi mempunyai perdana menteri sementara, dan tatanan sebelum perselisihan dimulai pada akhirnya akan dipulihkan."
 JAP_limit_the_emperors_power: "Batasi Kekuasaan Kaisar"
 JAP_limit_the_emperors_power_desc: "Kaisar tetap menjadi bagian penting dari masyarakat kita, namun masih bisa menjadi ancaman bagi demokrasi kita jika ia mau. Kita harus berusaha keras untuk membatasi kekuasaan raja konstitusional kita, sehingga kita tidak lagi kehilangan nilai-nilai demokrasi."
 JAP_ensure_civil_liberties: "Menjamin Kebebasan Sipil"
 JAP_ensure_civil_liberties_desc: "Dengan kembalinya perdamaian dan kemakmuran ke negara kita, inilah saatnya kita memenuhi beberapa janji yang telah kita buat. Kita harus memastikan bahwa semua kebebasan sipil dapat dipenuhi di Jepang yang baru, dan mulai memproduksi film-film baru untuk mempromosikan demokrasi kita."
 JAP_crush_the_internal_factions: "Hancurkan Fraksi Internal"
 JAP_crush_the_internal_factions_desc: "Persaingan antara faksi-faksi di dalam negeri, yang semuanya bersaing untuk mendapatkan persetujuan kaisar, mempunyai konsekuensi yang menghancurkan. Kini setelah pemerintah kembali memegang kendali penuh atas situasi ini, inilah saatnya kita memperkuat siapa yang memegang kekuasaan sebenarnya, dan menunjukkan kepada faksi-faksi internal lainnya bahwa kita tidak boleh dikacaukan."
 JAP_democratic_war_with_manchukuo: "Selesaikan Pertarungan"
 JAP_democratic_war_with_manchukuo_desc: "Tentara Kwantung telah memutuskan hubungan dengan kami sejak perang saudara, dan telah mengambil kendali atas Manchuria. Masyarakat di sana masih hidup di bawah penindasan otoriter seperti dulu, dan memerlukan keselamatan. Sudah waktunya kita menyelesaikan apa yang kita mulai."
 MAN_kwantung_army_took_control_flag: "Tentara Kwantung menguasai Manchuria"
 JAP_democratic_war_with_china: "Lindungi Permukiman Shanghai"
 JAP_democratic_war_with_china_desc: "Orang-orang di Pemukiman Internasional Shanghai saat ini berada di bawah ancaman rezim Tiongkok yang korup dan kroni-kroninya. Kita harus turun tangan dan menyelamatkan mereka, jangan sampai terjadi pertumpahan darah!"
 JAP_closer_ties_with_the_usa: "Hubungan Lebih Dekat dengan AS"
 JAP_closer_ties_with_the_usa_desc: "Dengan sistem demokrasi yang sudah terjamin di negara kita, para diplomat kita telah bekerja keras memperbaiki hubungan yang telah ternoda oleh militer, dimulai dengan Amerika Serikat. Kita harus mendekati mereka, dan melihat apakah kita bisa mendapatkan kesepakatan yang akan menjamin persahabatan kita di tahun-tahun mendatang."
 JAP_ally_the_philippines: "Sekutu Filipina"
 JAP_ally_the_philippines_desc: "Setelah baru-baru ini membangun kembali hubungan kita dengan mantan penguasa mereka, mungkin inilah saatnya kita memberikan tawaran kepada pemerintah [PHI.GetAdjective] untuk mengundang mereka bergabung dengan aliansi kita. Seperti yang kami lihat, kami berdua akan mendapatkan keuntungan besar dari kesepakatan ini."
 JAP_strike_the_soviets: "Serang Saingan Lama"
 JAP_strike_the_soviets_desc: "Kami berdiri sebagai benteng melawan kaum Bolshevik yang mencuri Karafuto utara dari kami. Sejak Ekspedisi Siberia dan Perang Rusia-Jepang, rakyat kami sekali lagi ingin sekali berperang melawan [SOV.GetNameDef], untuk akhirnya mengusir mereka dari Siberia Timur dan mengamankan wilayah pengaruh kami."
 JAP_free_colonized_asian_countries: "Negara-negara Asia yang Merdeka dan Terjajah"
 JAP_free_colonized_asian_countries_desc: "Ada banyak negara di Asia yang saat ini berada di bawah pendudukan negara-negara Barat. Sebagai penjaga baru Asia, kita harus mendekati orang-orang Barat ini dan mencoba memberikan tawaran yang tidak bisa mereka tolak, sehingga memberi kita kendali atas koloni-koloni ini."
 JAP_free_colonized_asian_countries_tt: "Membuka keputusan untuk §YMenuntut Kekuasaan§! dari §YBangsa-Bangsa Asia§! yang merupakan subjek dari §YBangsa-Bangsa Non-Asia§!"
 JAP_fund_resistance_groups_in_asia: "Kelompok Perlawanan Dana di Asia"
 JAP_fund_resistance_groups_in_asia_desc: "Ada banyak orang di benua kita yang berjuang melawan penindasan asing, dan mereka akan dengan senang hati menerima bantuan kita, jika kita menawarkannya. Kita harus menggunakan ini sebagai kesempatan untuk melemahkan kekuatan barat, dan mempromosikan kebebasan dan kebebasan bagi seluruh Asia!"
 JAP_fund_resistance_groups_in_asia_tt: "Membuka §Ykeputusan§! untuk meningkatkan perlawanan dan mendapatkan bonus serangan di negara-negara Asia yang diduduki"
 JAP_sea_rekindle_the_old_alliance: "Hidupkan kembali Aliansi Lama"
 JAP_sea_rekindle_the_old_alliance_desc: "Peluang terbaik kita untuk sukses terletak pada sekutu lama kita dalam Perang Besar. Kami akan mengaktifkan kembali aliansi lama dan mendukung [ENG.GetNameDef] dalam membela demokrasi."
 JAP_create_greater_east_asian_treaty_organization: "Organisasi Perjanjian Pasifik Barat"
 JAP_create_greater_east_asian_treaty_organization_desc: "Aliansi kita dengan negara-negara Asia lainnya akan memungkinkan kita untuk berdiri teguh melawan potensi ancaman terhadap cara hidup baru kita. Sudah saatnya kita menerima takdir kita sebagai penjaga benua ini, dan mulai memimpinnya menuju masa depan."
 JAP_greater_east_asian_treaty_organization: "Organisasi Perjanjian Asia Timur Raya"
 JAP_create_greater_east_asian_treaty_organization_tt: "Membuka keputusan untuk mengundang negara-negara §YNon-Blok§! dan §YDemokrat§! §YAsia§! dan §YOseania§! ke dalam faksi kami"
 JAP_form_greater_east_asian_customs_union: "Membentuk Serikat Pabean Asia Timur Raya"
 JAP_form_greater_east_asian_customs_union_desc: "Seperti yang telah direncanakan oleh para ahli teori ekonomi kita sejak lama, kita harus berusaha keras untuk membentuk serikat pabean Pasifik, dan perlahan tapi pasti menyatukan perekonomian Asia menjadi satu kekuatan yang paling kuat."
 JAP_form_greater_east_asian_currency_union: "Membentuk Persatuan Mata Uang Asia Timur Raya"
 JAP_form_greater_east_asian_currency_union_desc: "Kita harus beralih ke penggunaan mata uang tunggal di seluruh Asia, sesuatu yang disebut oleh para ahli teori politik lama sebagai blok Yen. Sudah saatnya kita mengambil langkah lain menuju tujuan ini, dan membentuk kesatuan mata uang untuk semua sekutu baru kita."
 JAP_form_greater_east_asian_currency_union_tt: "Membuka keputusan untuk mengundang sekutu kita ke §YCurrency Union§!"
 JAP_an_integrated_union: "Persatuan yang Terintegrasi"
 JAP_an_integrated_union_desc: "Integrasi perekonomian sekutu-sekutu kita dengan perekonomian kita, dan pembentukan bank sentral Asia yang dapat memantau dan membantu situasi perekonomian negara-negara lain, akan sangat bermanfaat bagi kita dalam jangka panjang, tidak hanya memperkuat kita, namun juga meningkatkan ketergantungan mereka pada kita, yang pada akhirnya memungkinkan kita untuk mengendalikan urusan luar negeri mereka."
 JAP_an_integrated_union_tt: "Setiap §YAnggota Fraksi§! akan menerima §YAcara:§! [JAP.GetNameDefCap] Harapan untuk Integrasi Lebih Lanjut Perekonomian kita"
 JAP_an_integrated_union_2_tt: "Membuka keputusan untuk mengundang sekutu agar §YPerekonomian mereka Menjadi Semakin Terintegrasi§! dengan kita, sehingga memungkinkan kita untuk §YMencoba Menundukkan mereka secara Diplomatik§! setelahnya"
 JAP_greater_east_asian_federation: "Federasi Asia Timur Raya"
 JAP_greater_east_asian_federation_desc: "Harinya akhirnya tiba, dimana kita bisa menyatukan bangsa-bangsa Asia di bawah satu negara! Kita harus bergerak cepat untuk mengintegrasikan bagian-bagian konstituen kita, dan membentuk Federasi Asia Timur Raya, menyebarkan demokrasi ke seluruh penjuru Asia."
 JAP_allied_civilian_administration_integration_tt: "Membuka Keputusan untuk: §YMengintegrasikan Administrasi Sipil Subjek kami§!, memungkinkan kami untuk §YMencaplok§! §YBoneka§! kami"
 JAP_greater_east_asian_federation_tt: "Kita akan dikenal sebagai §YFederasi Asia Timur Raya§!"
 JAP_greater_east_asian_federation_2_tt: "Membuka keputusan untuk mengintegrasikan §Ynegara-negara Asia§! yang berada di bawah §YKontrol§! kami"
 JAP_democratic_womens_suffrage: "Hak Pilih Perempuan"
 JAP_democratic_womens_suffrage_desc: "Ichikawa Fusae telah lama menjadi pendukung perluasan pemungutan suara agar mencakup perempuan. Kini dengan stabilnya situasi politik, inilah saatnya kita memberikan hak pilih kepada perempuan Jepang, sehingga mereka juga dapat berkontribusi terhadap kesuksesan kita."
 JAP_launch_the_income_doubling_plan: "Luncurkan Rencana Penggandaan Pendapatan"
 JAP_launch_the_income_doubling_plan_desc: "Osamu Shimomura, seorang ekonom yang baru-baru ini bergabung dengan Dewan Stabilisasi Ekonomi Jepang telah mengusulkan apa yang ia sebut sebagai Rencana Penggandaan Pendapatan, sebuah rencana yang ia klaim akan memainkan peran penting dalam perencanaan ekonomi, membantu meletakkan landasan bagi pertumbuhan ekonomi kita yang berkecepatan tinggi. Kita harus menerima tawarannya, dan melihat ke mana hal itu membawa kita."
 JAP_reform_the_education_system: "Reformasi Sistem Pendidikan"
 JAP_reform_the_education_system_desc: "Sistem pendidikan yang ada saat ini masih menyimpan semua kekurangan yang dimiliki lembaga-lembaga imperial, dan gagal menjangkau anak-anak kita dengan cukup efisien, sehingga menyebabkan kita tertinggal dibandingkan negara-negara barat. Kita harus segera mereformasinya, untuk memastikan hal tersebut tidak terus terjadi."
 JAP_democratic_women_in_the_workforce: "Perempuan dalam Angkatan Kerja"
 JAP_democratic_women_in_the_workforce_desc: "Gender telah lama menjadi faktor penentu di mana seseorang diharapkan untuk mengabdi pada negaranya, baik di garis depan, di pabrik, atau di dalam negeri. Dengan menerapkan pembagian beban yang lebih setara, kita memungkinkan adanya angkatan kerja yang lebih besar, dan angkatan bersenjata yang lebih besar, jika diperlukan."
 JAP_taiheyo_belt: "Sabuk Taiheiyo"
 JAP_taiheyo_belt_desc: "Para ekonom kami mengacu pada rencana baru untuk menciptakan zona urbanisasi yang mereka sebut Sabuk Taiheiyō yang membentang dari Tokyo hingga Fukuoka, menghubungkan wilayah-wilayah di megalopolis yang akan memudahkan pergerakan serta upaya ekonomi dan industri di sebagian besar pulau-pulau di bagian selatan. Kita harus mewujudkannya!"
 JAP_shinkansen: "Proyek Shinkansen"
 JAP_shinkansen_desc: "Kepala teknisi Hideo Shima telah membuat rencana untuk membuat jalur kereta peluru yang ia namakan Tokaido Shinkansen yang akan menghubungkan Tokyo, Nagoya, dan Osaka, memungkinkan transportasi cepat dan mudah baik untuk barang maupun warga sipil antar kota-kota besar. Kita harus berinvestasi dalam proyek ini."
 JAP_shinkansen_tt: "Ketika semangat nasional §Y$JAP_shinkansen_construction_idea$§! dihilangkan:\n"
 JAP_pursue_international_trade: "Mengejar Perdagangan Internasional"
 JAP_pursue_international_trade_desc: "Meskipun kami telah berdagang dengan kekuatan asing sejak Komodor Matthew Perry mengakhiri isolasi kami, hal itu masih jauh dari cukup. Kita harus fokus pada pasar internasional, dan memastikan kita bisa mendapatkan sumber daya yang kita butuhkan melalui diplomasi, bukan melalui perang."
 JAP_seek_foreign_investments: "Mencari Investasi Asing"
 JAP_seek_foreign_investments_desc: "Kini setelah kita semakin terbuka, kita harus memanfaatkan koneksi baru yang kita miliki untuk menarik investasi modal asing, dan dalam prosesnya meningkatkan industri kita sendiri."
 JAP_seek_foreign_investments_tt: "Membuka keputusan untuk §YMenarik Investasi Asing§! guna memperoleh §YPabrik Sipil§! dengan imbalan §YKekuasaan Politik§!"
 JAP_invest_in_foreign_industries: "Berinvestasi di Industri Asing"
 JAP_invest_in_foreign_industries_desc: "Kita harus menggunakan sejumlah besar modal yang telah kita peroleh untuk berinvestasi ke negara-negara asing, memberi mereka bantuan ekonomi sebagai imbalan atas perolehan sebagian dari sumber daya alam mereka, membantu negara-negara Asia lainnya sambil menyelesaikan permasalahan kita sendiri."
 JAP_invest_in_foreign_industries_tt: "Membuka §YKeputusan§! untuk berinvestasi di industri kecil di §Ynegara-negara Asia§! dengan imbalan sumber daya"
 JAP_democratic_foreign_exchange_allocation_policy: "Kebijakan Alokasi Devisa"
 JAP_democratic_foreign_exchange_allocation_policy_desc: "Pasar saham adalah alat yang ampuh. Kita harus memanfaatkan aliran modal asing dan memastikan bahwa para ekonom dan industrialis kita dapat berinvestasi sebanyak mungkin di negara kita yang sedang berkembang."
 JAP_democratic_research_slot: "Reorganisasi Universitas Kekaisaran Tokyo"
 JAP_democratic_research_slot_desc: "Universitas Kekaisaran Tokyo masih beroperasi berdasarkan sistem pendidikan lama kita. Untuk mendapatkan generasi intelektual baru yang dapat membantu negara kita mencapai masa depan yang lebih baik, kita harus berinvestasi di dalamnya dan mengubah kurikulum agar tidak terlalu dikendalikan oleh politik nasional."
 JAP_offshore_coal: "Memperluas Fasilitas Batubara Lepas Pantai"
 JAP_offshore_coal_desc: "Pulau Ikeshima dan Hashima di lepas pantai Nagasaki berfungsi sebagai tambang batu bara yang penting untuk menggalinya dari dasar laut. Kita harus memperluas tambang-tambang ini, dan membangun lebih banyak rumah di pulau-pulau tersebut untuk menampung lebih banyak tenaga kerja tetap."
 JAP_democratic_nationalize_zaibatsus: "Nasionalisasikan Zaibatsus"
 JAP_democratic_nationalize_zaibatsus_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya. Itu berakhir di sini. Kontrol negara tidak akan ditantang. Kita harus menasionalisasi mereka dan menggunakan modal mereka untuk kepentingan rakyat!"
 JAP_split_uo_zaibatsu_monopolies: "Pisahkan Monopoli Zaibatsus"
 JAP_split_uo_zaibatsu_monopolies_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya. Kita harus ingatkan mereka bahwa mereka masih tunduk pada keinginan pemerintah, dan dipecah menjadi konglomerat Keiretsu yang lebih kecil, agar lebih mudah dikelola."
 JAP_democratic_work_with_the_zaibatsus: "Bekerja Dengan Zaibatsus"
 JAP_democratic_work_with_the_zaibatsus_desc: "Perusahaan-perusahaan terbesar di negara kita telah lama mempunyai kekuatan politik dan ekonomi yang belum pernah terjadi sebelumnya. Dengan sedikit kemahiran, kita mungkin bisa bekerja sama dengan mereka dan mengarahkan upaya mereka demi kebaikan kita."
 JAP_lifetime_employment: "Pekerjaan Seumur Hidup"
 JAP_lifetime_employment_desc: "Shūshin koyō telah digunakan oleh perusahaan-perusahaan besar kita selama beberapa waktu, dimulai dengan keberhasilan ekonomi pertama pada tahun 1920an. Kita harus memastikan bahwa ciri khas budaya perusahaan Jepang ini membantu kita mencapai keajaiban ekonomi, sehingga suatu hari nanti kita bahkan bisa melampaui perekonomian negara-negara barat."
 JAP_modernize_agriculture: "Modernisasi Pertanian"
 JAP_modernize_agriculture_desc: "Sektor pertanian kita sama pentingnya dengan sektor industri. Lagi pula, industri kita tidak akan berjalan jika kita tidak bisa memberi makan seluruh mulut di negara kita. Oleh karena itu, kita harus berinvestasi dalam pengembangan peralatan baru dan meningkatkan jaringan jalan yang menghubungkan desa-desa dengan kota-kota besar."
 JAP_civilian_nuclear_reactor_investments: "Investasi Reaktor Nuklir Sipil"
 JAP_civilian_nuclear_reactor_investments_desc: "Sebagaimana telah ditentukan oleh para ilmuwan kami di institut RIKEN, tenaga nuklir akan menjadi energi masa depan. Kita harus berinvestasi pada teknologi baru ini, sehingga kita tidak perlu lagi membakar batu bara."
 JAP_civilian_nuclear_reactor_investments_tt: "Ganti §Y$JAP_early_industrialization_efforts_dm$§! dengan §Y$JAP_the_economic_mirale_dm$§!, perubahan yang efektif:"
 JAP_guardian_of_the_pacific: "Penjaga Pasifik"
 JAP_guardian_of_the_pacific_desc: "Kami akan mengambil peran sebagai penjaga seluruh negara Asia di dalam dan sekitar Pasifik. Setelah terbebas dari imperialisme Barat, negara-negara tersebut memerlukan bimbingan untuk mengangkat negara-negara tersebut menjadi negara demokrasi penuh. Langkah pertama untuk mencapai tujuan ini adalah dengan menawarkan diri untuk menjadi pelindung baru bagi warga kolonial Pasifik [ENG.GetNameDef]."
 JAP_build_diet_building_landmark_tt: "\nGanti §Y$landmark_tokyo_imperial_palace$§! dengan §Y$landmark_national_diet$§!"
 JAP_build_hakko_ichiu_landmark_tt: "Membuat §Y$landmark_hakko_ichiu$§! di [1018.GetName]"
 JAP_the_koiso_cabinet: "Kabinet Koiso"
 JAP_the_koiso_cabinet_desc: "Ketika Kaisar semakin menunjukkan ketidakpercayaannya terhadap kemampuan [ROOT.GetLeader] dan pasukan Kekaisaran Jepang, ia telah menyatakan keinginannya untuk mempersatukan bangsa dan mencari jalan keluar dari perang, untuk menghindari kehancuran total bangsa. Meski tidak populer sebagai kandidat di kalangan politisi dan jenderal, Koiso memiliki kemampuan untuk membawa bangsa keluar dari konflik."
 JAP_the_war_has_not_necessarily_developed_focus: "Oposisi Kuat terhadap Konflik Asia Timur"
 JAP_the_war_has_not_necessarily_developed_focus_desc: "Dengan persaingan antara angkatan bersenjata dan angkatan laut yang masih menjadi duri di pihak kita, dan dengan kegagalan strategi kita untuk mengakhiri perang dengan memberikan pukulan keras terhadap musuh-musuh kita, nampaknya kita hampir kehabisan pilihan. Mungkin ini saatnya menerima aib, dan mewujudkan era yang bebas konflik."
 JAP_the_war_has_not_necessarily_developed_focus_tt: "Bagian radikal dari militer akan berusaha melakukan kudeta terhadap pemerintah dalam upaya menghentikan Kaisar menyiarkan penyerahan negara kita."
 JAP_japans_longest_day: "Hari Terpanjang di Jepang"
 JAP_japans_longest_day_desc: "Perdana menteri yang tidak terhormat dan kroni-kroninya telah ditangani, dan Kaisar yang salah arah telah ditempatkan di bawah tahanan rumah. Sekaranglah waktunya untuk menghidupkan kembali upaya perang, dan membawa bangsa kita kembali ke kejayaan yang telah ditakdirkan."
 JAP_the_surrender_broadcast: "Siaran Penyerahan"
 JAP_the_surrender_broadcast_desc: "Kami telah mempertimbangkan secara mendalam tren umum dunia dan situasi Kekaisaran saat ini, dan kami telah memutuskan untuk mengambil tindakan luar biasa untuk mengakhiri keadaan saat ini. Situasi perang yang berkembang belum tentu menguntungkan Jepang, dan kita harus menerima kenyataan ini."
 JAP_the_surrender_broadcast_tt: "Kemungkinan besar kita akan dapat mempertahankan kendali atas Kepulauan Asal jika kita menyerah secara damai"
