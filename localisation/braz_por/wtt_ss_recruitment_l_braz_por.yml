 ss_recruitment_event.10.t: "Para jenderal memprotes"
 ss_recruitment_event.10.desc: "Dalam pertemuan dengan [GER.GetLeader] hari ini, sejumlah perwira tinggi Wehrmacht di Oberkommando der Wehrmacht menyuarakan keprihatinan mereka tentang apa yang mereka sebut sebagai \"favoritisme politik\" yang mengatasnamakan SS. Secara khusus, mereka menyaksikan perkembangan angkatan bersenjata paralel di Waffen-SS dengan rasa khawatir yang mendalam.\n\nDivisi SS yang memiliki perlengkapan berlimpah, argumen mereka berlanjut, hanya mengambil sumber daya yang sangat dibutuhkan dari militer reguler.\n\nTerakhir, perekrutan independen dapat menyebabkan struktur komando terpisah, yang mengarah pada pemisahan upaya ketika semua kekuatan perlu digabungkan untuk mencapai kemenangan akhir."
 ss_recruitment_event.10.a: "Campur tangan dalam urusan politik ini tidak pantas dilakukan oleh perwira Jerman."
 ss_recruitment_event.10.b: "Yakinkan mereka bahwa OKW mempunyai komando akhir atas seluruh pasukan SS."
 ss_recruitment_event.11.t: "Jenderal mengundurkan diri sebagai protes"
 ss_recruitment_event.11.desc: "Mengutip kesehatan yang buruk, [GER_SS_general_resigns.GetName] telah segera mengundurkan diri dari jabatannya. Namun, sudah menjadi rahasia umum bahwa [GER_SS_general_resigns.GetName] adalah seorang kritikus vokal terhadap kebijakan pemerintah mengenai Waffen-SS, khususnya keputusan untuk mengizinkan sukarelawan asing untuk bertugas di Divisi SS. Kabarnya, [GER_SS_general_resigns.GetName] bersikeras untuk mengucapkan selamat tinggal kepada Führer secara langsung, yang menyebabkan diskusi panas antara keduanya mengenai alokasi sumber daya dalam upaya perang.\n\nBeberapa perwira lain di Wehrmacht telah menyuarakan keprihatinan serupa, dan beberapa mengindikasikan bahwa mereka mungkin mempertimbangkan untuk mengikutinya."
 ss_recruitment_event.11.a: "Bagus, dia pergi sebelum dia bisa menulari orang lain dengan kelemahannya."
 ss_recruitment_event.11.b: "Cobalah untuk meyakinkan dia bahwa tugasnya melebihi segalanya."
 ss_recruitment_event.12.t: "Rumor Plot Wehrmacht"
 ss_recruitment_event.12.desc: "Gestapo telah menghasilkan laporan baru dan sangat meresahkan. Rupanya, sekelompok perwira tinggi Wehrmacht sudah mulai mengadakan pertemuan rutin di sebuah rumah terpencil di suatu tempat di Prusia Timur.\n\nMenyamar sebagai sesi bermain Bridge biasa, pertemuan ini telah berlangsung setidaknya selama beberapa bulan dan tampaknya menampilkan kalangan perwira yang sangat terpilih. Dinas Keamanan sejauh ini belum berhasil mendapatkan orang yang terlibat, namun semua petugas yang dipastikan terkait dengan \"Lingkaran Prusia\" ini sangat blak-blakan mengenai penghinaan mereka terhadap pemerintah sosialis nasional dan khususnya keputusan pemerintah untuk memperluas Waffen-SS.\n\nSaat ini hanya ada sedikit indikasi mengenai tujuan akhir dari komplotan ini, atau apakah memang ada tujuan dari komplotan ini."
 ss_recruitment_event.12.a: "Hanya beberapa prajurit tua yang menggerutu."
 ss_recruitment_event.12.b: "Ceramah OKW tentang pentingnya kesetiaan dalam perjuangan kelangsungan hidup bangsa."
 ss_recruitment_event.13.t: "Upaya pembunuhan pada [GER.GetLeader]"
 ss_recruitment_event.13.desc: "Laporan yang belum dikonfirmasi dari Markas Besar Führer menunjukkan bahwa seseorang meledakkan alat peledak selama pertemuan situasi yang dihadiri [GER.GetLeader]. Informasi masih sangat sedikit, dan ada banyak kebingungan baik di Wehrmacht maupun SS, dengan petugas di kedua belah pihak saling menuduh satu sama lain berusaha melakukan kudeta.\n\nKami harus menunggu informasi lebih lanjut."
 ss_recruitment_event.13.a: "Kami hanya bisa berharap."
 ss_recruitment_event.14.t: "Walküre Unternehmen"
 ss_recruitment_event.14.desc: "Elemen Wehrmacht telah melaksanakan Operasi Valkyrie, rencana darurat untuk kerusuhan sipil besar di Jerman. Unit-unit tentara telah mengepung sejumlah kementerian pemerintah dan berusaha menangkap pejabat tinggi partai tersebut. Pertempuran skala kecil dan baku tembak antara pasukan pengawal SS dan detasemen Angkatan Darat telah dilaporkan di seluruh Berlin. Tampaknya Wehrmacht telah menuntut agar semua unit SS segera mundur dan menyerahkan senjata, namun pimpinan SS langsung menolaknya.\n\nKedua faksi saat ini berjuang untuk menguasai Berlin. Sebagian dari Wehrmacht telah menyatakan kesetiaan mereka kepada [GER.GetLeader] dan mengangkat senjata melawan pemberontak.\n\nKobaran api perang ini hanya akan meluas."
 ss_recruitment_event.14.a: "Benar! Pembalik!"
 ss_recruitment_event.15.t: "[GER.GetLeader] selamat dari upaya pembunuhan"
 ss_recruitment_event.15.desc: "Keberuntungan - atau takdir - tampaknya berpihak pada [GER.GetLeader], karena ledakan bom di markasnya hanya melukainya sedikit. Beberapa orang lain di dekatnya tidak seberuntung itu.\n\nSetelah mendapat perawatan medis untuk beberapa luka bakar ringan dan luka dangkal, [GER.GetLeader] segera bertemu dengan perwakilan partai, SS dan Gestapo untuk membahas langkah selanjutnya."
 ss_recruitment_event.15.a: "Pengkhianat mati sebagai pengkhianat."
 ss_recruitment_event.15.b: "Biarkan mereka menebus diri mereka sendiri melalui pelayanan."
 ss_recruitment_event.20.t: "Protes Himmler"
 ss_recruitment_event.20.desc: "Dalam pertemuan pribadi antara Heinrich Himmler dan [GER.GetLeader], Reichsführer SS dilaporkan mengeluh keras dan berulang kali bahwa organisasinya belum menerima dukungan yang dibutuhkan untuk melakukan pekerjaan yang diperlukan dalam membela partai dan negara. Dia lebih lanjut memperingatkan [GER.GetLeader] agar tidak mempercayai Wehrmacht untuk tetap setia.\n\nHanya SS yang dapat dipercaya untuk mewujudkan Jerman baru."
 ss_recruitment_event.20.a: "Dia lupa tempatnya."
 ss_recruitment_event.20.b: "Kekuatan yang lebih kecil memastikan bahwa hanya orang-orang terbaik yang mengenakan jubah kehormatan ini."
 ss_recruitment_event.21.t: "Ksatria Wewelsburg"
 ss_recruitment_event.21.desc: "Ada laporan bahwa Himmler telah memanggil pimpinan tertinggi SS ke kastil Wewelsburg untuk konsultasi mendesak. Isi sebenarnya dari konsultasi-konsultasi ini tidak diketahui, namun masuk akal bahwa konsultasi-konsultasi tersebut ada hubungannya dengan rasa frustrasi Himmler yang terus berlanjut terhadap pimpinan partai. [GER.GetLeader] tampaknya masih mengikuti saran Wehrmacht ketika menyangkut masalah militer, menghalangi upaya Himmler dalam menciptakan dan memperluas angkatan bersenjata independen sebagai penyeimbang.\n\nRumor mengatakan bahwa Himmler malah mengalihkan perhatiannya untuk menciptakan apa yang disebutnya \"Ordo Ksatria Teutonik baru untuk Jerman baru\". Para \"Ksatria\" ini bersumpah kesetiaan fanatik dan kepatuhan yang tidak perlu dipertanyakan lagi kepada Himmler secara pribadi dan masing-masing dianugerahi pedang yang dibuat sesuai desain Himmler dari baja yang diberkati dalam ritual Jerman kuno - mungkin untuk membunuh musuh Jerman Baru."
 ss_recruitment_event.21.a: "Omong kosong!"
 ss_recruitment_event.21.b: "Ingatkan Himmler kepada siapa dia seharusnya setia."
 ss_recruitment_event.22.t: "SS ikut campur dalam ekonomi perang"
 ss_recruitment_event.22.desc: "Pemerintah telah menerima sejumlah keluhan dari beberapa pengelola pabrik. Mereka menerima pesanan material dari 'Kantor SS Konstruksi dan Pengadaan'. Setelah diserahkan, barang-barang tersebut dikirim ke 'Kantor SS Urusan Keuangan', yang seharusnya membayar mereka, namun malah meneruskannya lebih jauh ke 'Kantor SS untuk Kerjasama Ekonomi', di mana mereka diberitahu bahwa kantor awal seharusnya membayar mereka secara langsung.\n\nMungkin yang lebih mengganggu adalah bahan-bahan yang dipesan - mesin presisi, sejumlah besar bahan kimia yang digunakan untuk membuat pupuk serta sejumlah baja dan lembaran logam.\n\nHimmler menolak membicarakan kejadian ini dengan pejabat pemerintah, namun terdengar berbicara dengan pejabat tinggi penghubung SS di Kementerian Perekonomian, mengatakan bahwa 'jika [GER.GetLeader] tidak mau memberi saya senjata, saya harus membuat senjata sendiri. Saya tidak peduli di mana atau bagaimana saya mendapatkan apa yang saya perlukan untuk itu.'"
 ss_recruitment_event.22.a: "Tentunya ini hanya kesalahan akuntansi."
 ss_recruitment_event.22.b: "Paksa Himmler untuk melakukan penyelidikan penuh dan melaporkan temuannya secara langsung."
 ss_recruitment_event.23.t: "Plot Himmler"
 ss_recruitment_event.23.desc: "Sebuah sumber anonim di kalangan SS telah membocorkan memo internal kepada pemerintah. Isinya tidak lain adalah ledakan. Dokumen setebal puluhan halaman ini merinci bagaimana SS dapat menggunakan kekuasaannya yang berkurang namun masih cukup besar untuk mengambil kendali atas pemerintah 'jika [GER.GetLeader] mengkhianati tujuan sosialis nasional'. Bukti dari pengkhianatan tersebut, lanjut surat kabar tersebut, adalah kurangnya komitmen untuk mengganti organisasi-organisasi yang sudah usang seperti Angkatan Darat dengan formasi baru yang dibangun berdasarkan karakter sosialis nasional yang tepat.\n\nMemo tersebut ditandatangani oleh Heinrich Himmler."
 ss_recruitment_event.23.a: "Kami tidak bisa menantang SS."
 ss_recruitment_event.23.b: "Dia sudah bertindak terlalu jauh kali ini."
 ss_recruitment_event.23.c: "Mungkin semacam akomodasi dapat ditemukan?"
 ss_recruitment_event.24.desc: "Laporan datang dari Markas Besar Führer, mengklaim bahwa semacam keributan terjadi selama pertemuan pribadi antara [GER.GetLeader] dan Heinrich Himmler. Rinciannya masih sedikit, namun dinas intelijen militer, Abwehr, mengklaim telah mencegat kurir rahasia yang membawa perintah ke sejumlah unit SS di seluruh Jerman untuk mempersiapkan sesuatu yang disebut 'Fall Schwarz', yang diduga merupakan operasi untuk merebut kendali titik komunikasi dan infrastruktur penting jika terjadi percobaan kudeta militer."
 ss_recruitment_event.24.a: "Nasib Jerman berada di ujung tanduk."
 ss_recruitment_event.25.desc: "Sekali lagi, takdir telah mengendalikan [GER.GetLeader] dan melindunginya dari bahaya. Seperti yang dikatakan oleh Führer sendiri, Himmler menodongkan senjatanya ke arahnya selama pertemuan pribadi, meneriakkan hinaan dan kata-kata kotor. Jelas dikuasai oleh nafsunya akan kekuasaan, Reichsführer SS mencoba membunuh [GER.GetLeader], tetapi senjatanya macet dan tidak menembak. Di saat kebingungan, Führer berhasil mengalahkan Himmler dan berteriak minta tolong. Dilaporkan, dibutuhkan empat anggota pengawalnya untuk menahan Himmler.\n\nDi tempat lain di Reich, sejumlah ketegangan antara SS dan unit Angkatan Darat reguler terjadi ketika SS berusaha merebut pos komunikasi utama tetapi akhirnya mundur setelah mendengar bahwa [GER.GetLeader] selamat.\n\nUnit Wehrmacht telah mengepung kantor dan gudang SS utama dan sedang menunggu perintah dari Berlin."
 ss_recruitment_event.25.a: "Seharusnya menembak mereka bertahun-tahun yang lalu, seperti yang dilakukan Stalin!"
 ss_recruitment_event.25.b: "Dan tetap saja, mereka tetap tidak tersentuh."
 ss_recruitment_event.26.t: "Himmler-Putsch"
 ss_recruitment_event.26.desc: "Saat asap di Markas Besar Führer hilang, Heinrich Himmler muncul dari baku tembak yang kacau sebagai satu-satunya yang selamat. Menurut kesaksiannya, Führer, yang jelas-jelas diliputi kegilaan, telah menyatakan bahwa dia adalah seorang pria dan tentara yang gagal total, seorang pengkhianat dan mata-mata yang harus ditembak saat fajar. Sadar bahwa ia harus memilih antara kehormatan pribadinya atau kelangsungan hidup bangsa, Himmler memutuskan untuk segera bertindak dan menembaknya. Setelah kejadian itu, anggota pengawal Führer berusaha membunuh Himmler sebagai seorang pembunuh. Hanya kedatangan pengawal Himmler yang tepat waktu yang menyelamatkan Reichsführer SS.\n\nDi seluruh Jerman, berita kematian Führer jelas menjadi sinyal untuk melakukan tindakan yang telah lama dipersiapkan. Baik unit SS maupun unit Angkatan Darat reguler berlomba untuk mengamankan jembatan, sentral telepon, dan persimpangan jalan, dengan pasukan terjun payung Luftwaffe dengan cepat melakukan mobilisasi untuk merebut lapangan udara di seluruh Reich.\n\nJerman berada di ambang perang saudara, dan ketiga faksi akan bergantung pada pemerintah sipil untuk benar-benar menjalankan negara."
 ss_recruitment_event.26.a: "Pemerintah akan mendukung Himmler."
 ss_recruitment_event.26.b: "Pemerintah akan mendukung Göring."
 ss_recruitment_event.26.c: "Minta Wehrmacht untuk memulihkan ketertiban."
