 ss_recruitment_event.1.t: "Kampanye Perekrutan di Denmark"
 ss_recruitment_event.1.desc: "Dalam perjuangan besar demi kelangsungan hidup nasional ini, kita harus menggunakan setiap aset dan keuntungan yang ada. SS percaya bahwa ada banyak orang di Denmark yang dengan senang hati akan mengangkat senjata dan berperang di sisi kita melawan ancaman bolshevisme global.\n\nMeskipun Wehrmacht pada prinsipnya setuju bahwa perekrutan sukarelawan yang sesuai akan berguna, para Jenderal di OKW sangat yakin bahwa setiap sukarelawan asing harus berada di bawah komando militer – bukan SS."
 ss_recruitment_event.1.a: "Kompromi pada kampanye rekrutmen yang moderat."
 ss_recruitment_event.1.b: "Mendanai kampanye perekrutan besar-besaran untuk SS."
 ss_recruitment_event.1.c: "Izinkan OKW merekrut sejumlah kecil spesialis dan personel pendukung."
