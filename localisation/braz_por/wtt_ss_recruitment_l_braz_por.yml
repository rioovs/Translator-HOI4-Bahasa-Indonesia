 SS_recruitment_desc: "SS di bawah Himmler percaya bahwa mereka harus bertanggung jawab merekrut sukarelawan asing untuk memerangi bolshevisme global. Wehrmacht sangat tidak setuju dan tidak akan mentolerir struktur komando paralel. Mendorong salah satu dari mereka terlalu jauh mungkin memiliki konsekuensi yang serius.\n\nSaat ini §YMood§! di OKW: [Root.GetWehrmachtAngerLevel] ([?GER.wehrmacht_anger|-0])\n\nSaat ini §YMood§! di SS Kepemimpinan: [Root.GetSSAngerLevel] ([?GER.SS_anger|-0])"
