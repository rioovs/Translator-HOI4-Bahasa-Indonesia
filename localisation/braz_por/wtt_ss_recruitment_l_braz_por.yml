 ss_recruitment_event.8.desc: "Dalam perjuangan besar demi kelangsungan hidup nasional ini, kita harus menggunakan setiap aset dan keuntungan yang ada. SS percaya bahwa ada banyak orang di Lituania yang dengan senang hati mengangkat senjata dan berperang bersama kita melawan ancaman bolshevisme global.\n\nSementara Wehrmacht pada prinsipnya setuju bahwa perekrutan sukarelawan yang sesuai akan bermanfaat, para Jenderal di OKW sangat yakin bahwa setiap sukarelawan asing harus berada di bawah komando militer – bukan SS.\n\nLaporan dari administrator lokal mengarah pada a boikot yang meluas terhadap aktivitas perekrutan apa pun yang diorganisir oleh para pemimpin lokal."
