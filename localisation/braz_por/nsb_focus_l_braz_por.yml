 SOV_organize_wreckers_tt: "Membuka §Ykeputusan§! untuk menyabotase industri selama §Y[GetSovietCivilWarName]§!."
 SOV_the_eyes_fear_tt: "Merekrut unit-unit yang akan bangkit melawan Komunis setelah §Y[GetSovietCivilWarName]§! dimulai."
 GER_soviet_treaty_research_nsb_tt: "Menyelesaikan penelitian terhadap §YSasis Tangki Menengah Dasar§! akan memungkinkan kita memanfaatkan perjanjian ini dan memanfaatkan dua desain tangki baru:"
 SOV_soviet_civil_war: "Perang Saudara telah dimulai"
 SOV_soviet_civil_war_over: "Perang Saudara telah berakhir"
 SOV_left_opposition_civil_war_name: "Perang Saudara Soviet"
 SOV_right_opposition_civil_war_name: "Perang Saudara Soviet"
 SOV_exiles_civil_war_name: "Perang Saudara Rusia ke-2"
 SOV_soviet_civil_war_name: "Perang Saudara Soviet"
 SOV_left_opposition_name: "Oposisi Kiri"
 SOV_right_opposition_name: "Oposisi Kanan"
 SOV_exiles_name: "Orang buangan Rusia"
 SOV_no_major_purge_tt: "Tidak ada Pembersihan Besar-besaran yang terjadi"
 SOV_the_left_opposition: "Oposisi Kiri"
 SOV_the_left_opposition_desc: "Jelas sekali bahwa Uni Soviet telah menyimpang dari jalur yang dijanjikan. Sekarang bahkan ada pembicaraan untuk membangun Sosialisme di satu negara, membiarkan para pekerja di seluruh dunia menyerah pada nasib mereka dan malah berdiri dalam solidaritas dengan mereka. Jika Kamerad Stalin tidak bertindak, orang lain pasti akan bertindak."
 SOV_the_left_opposition_tt: "Memulai proses menuju §YPerang Saudara§! di [ROOT.GetNameDef]."
 SOV_the_fourth_international: "Internasional Keempat"
 SOV_the_fourth_international_desc: "Boneka-boneka Stalinis yang tergabung dalam Internasional Ketiga telah membuktikan diri mereka tidak mampu memajukan revolusi. Visi mereka mengenai Komunisme tidak ada hubungannya dengan teori-teori yang ditulis oleh Marx dan Lenin, dan malah memutarbalikkan impian negara buruh yang dikontrol secara demokratis menjadi mimpi buruk distopia. Apa yang kita butuhkan adalah Internasional baru yang akan membela revolusi!"
 SOV_bring_old_trotskyists_back: "Bawa Kembali Kaum Trotskis Lama"
 SOV_bring_old_trotskyists_back_desc: "Pada tahun-tahun awal revolusi, banyak terjadi perdebatan sengit antar berbagai faksi di dalam partai. Beberapa orang yang tidak sejalan dengan partai, seperti Karl Radek dan Yevgeny Preobrazhensky, bahkan diusir karena perbedaan pendapat kecil. Mungkin sikap penyesalan dari para anggota partai yang sudah lama menjabat ini sudah cukup untuk membawa mereka kembali ke partainya."
 SOV_bring_old_trotskyists_back_trigger_tt: "§Y$SOV_karl_radek$§! dan §Y$SOV_yevgeny_preobrazhensky$§! telah dibersihkan oleh Stalin."
 SOV_bring_old_trotskyists_back_effect_tt: "§Y$SOV_karl_radek$§! dan §Y$SOV_yevgeny_preobrazhensky$§! tersedia sebagai penasihat."
 SOV_organize_the_wreckers: "Atur Penghancur"
 SOV_organize_the_wreckers_desc: "Jika Stalin dan antek-anteknya memutuskan untuk melakukan perlawanan, alih-alih melakukan yang terbaik bagi revolusi dan mengundurkan diri, kita harus siap untuk melawan. Dalam situasi putus asa seperti ini, sabotase terhadap harta milik rakyat pun harus dipertimbangkan. Kita harus memastikan bahwa hal ini tepat sasaran, dan tidak menghancurkan prestasi besar para pekerja Soviet."
 SOV_organize_the_wreckers_tt: "Membuka §Ykeputusan§! untuk menyabotase industri selama perang saudara."
 SOV_integrate_smirnovs_bloc: "Integrasikan Blok Smirnov"
 SOV_integrate_smirnovs_bloc_desc: "Kita punya segelintir tokoh Trotskis lama, yang baru-baru ini ditangkap dan dipenjarakan karena menentang penindasan Stalinis. Dengan beberapa kata-kata yang dipilih dengan baik, kita dapat melihat mereka dibebaskan dan dikirim ke pengasingan, di mana mereka dapat berorganisasi sambil tetap aman dari Paranoia Politik. Mereka tidak akan melupakan siapa yang membantu mereka melarikan diri."
 SOV_integrate_smirnovs_bloc_tt: "§Y$SOV_ivan_smirnov$§!, §Y$SOV_ivar_smilga$§! dan §Y$SOV_aleksandr_shlyapnikov$§! akan dibebaskan dari penjara dan dikirim ke pengasingan (§Gkarakter di pengasingan tidak dapat dibersihkan§!). Mereka akan tersedia sebagai penasihat ketika Perang Saudara pecah.\nMenambahkan dukungan Oposisi Kiri di dua negara bagian."
 SOV_left_eliminate_right: "Hilangkan Yang Kanan"
 SOV_left_eliminate_right_desc: "Ada faksi-faksi di dalam partai yang sama sekali tidak cocok satu sama lain. Jika kita ingin mengambil alih pemerintahan dan mengarahkan revolusi kembali ke jalurnya, perhatian kita tidak boleh diganggu oleh campur tangan mereka. Tapi jika 'Kamerad' Stalin sedang mencari musuh internal untuk dilawan, kita bisa melibatkan beberapa orang untuk dia lihat..."
 SOV_left_eliminate_right_tt: "§Y$SOV_nikolay_bukharin$§!, §Y$SOV_aleksey_rykov$§!, dan §Y$SOV_mikhail_tomsky$§! menjadi target potensial pembersihan oleh Stalin."
 SOV_eliminate_opposition_factionalism_tt: "Memodifikasi §Y$SOV_factionalism_modifier$§!:\nPerolehan Kekuatan Politik: §G+5%§!."
 SOV_committee_in_exile: "Komite di Pengasingan"
 SOV_committee_in_exile_desc: "Kita tidak pernah bisa yakin kepada siapa tatapan gila Stalin selanjutnya akan tertuju. Kita harus menyiapkan jalur rahasia dan rumah persembunyian untuk menyelundupkan orang ke luar negeri jika kita mengetahui bahwa beberapa pendukung kita menjadi sasaran pembersihan lainnya."
 SOV_committee_in_exile_tt: "Membuka keputusan §Y$SOV_send_supporters_abroad$§!, memungkinkan kami mengirim simpatisan ke pengasingan (§Gkarakter di pengasingan tidak dapat dibersihkan§!). Karakter yang diasingkan akan tersedia saat Perang Saudara pecah."
 SOV_approach_tukhachevsky: "Dekati Tukhachevsky"
 SOV_approach_tukhachevsky_desc: "Mikhail Tukhachevsky tidak diragukan lagi adalah salah satu pemikir militer terbesar kita. Walaupun teorinya tentang unit senjata gabungan yang bergerak cepat menyerang jauh ke belakang musuh bukannya tanpa kritik, ia masih mendapat dukungan dari beberapa Jenderal yang sangat cakap. Jika kita bisa meyakinkan dia untuk mendukung tujuan kita, dia akan menjadi aset yang sangat berharga."
 SOV_approach_tukhachevsky_tt: "§Y$SOV_mikhail_tukhachevsky$§! akan memihak Oposisi Kiri dalam Perang Saudara, membawa pasukan dan jenderal yang setia."
 SOV_approach_primakov: "Dekati Primakov"
 SOV_approach_primakov_tt: "§Y$SOV_vitaly_primakov$§! akan memihak Oposisi Kiri dalam Perang Saudara, membawa pasukan dan jenderal yang setia."
 SOV_approach_primakov_desc: "Vitaly Primakov adalah salah satu komandan kavaleri utama kami, dan dukungannya akan sangat berharga dalam upaya mengamankan negara."
 SOV_funds_for_the_cause: "Dana untuk Tujuan tersebut"
 SOV_funds_for_the_cause_desc: "Memiliki $SOV_lev_trotsky$ dan orang lain yang berbasis di luar negeri tentu dapat menguntungkan kita. Kita harus menyelenggarakan acara penggalangan dana sosialis di seluruh dunia, dan secara diam-diam mencoba meyakinkan pemerintah untuk mendukung kita dengan senjata pada saat yang bersamaan."
 SOV_funds_for_the_cause_tt: "Menambahkan ide §Y$SOV_foreign_funds_idea$§! selama 365 hari saat Perang Saudara dimulai."
 SOV_left_opposition_coup: "Nyalakan Apinya"
 SOV_left_opposition_coup_desc: "Waktunya telah tiba. Mari kita angkat panji melawan tiran. Revolusi akan dimulai lagi!"
 SOV_left_opposition_coup_tt: "Menambahkan dukungan untuk Oposisi Kiri di Angkatan Darat, Angkatan Laut, dan Angkatan Udara.\nMemulai §YPerang Saudara Soviet§!."
 SOV_exiled_advisors_available_tt: "§YKarakter yang diasingkan akan tersedia.§!"
 SOV_the_vanguard_of_the_true_revolution: "Pelopor Revolusi Sejati"
 SOV_the_vanguard_of_the_true_revolution_desc: "Biarkan dunia mendengar revolusi kita. Kami akan menyerukan kepada semua kaum revolusioner di seluruh dunia untuk berbondong-bondong mendukung panji-panji kami. Bersama-sama kita bisa mengalahkan Stalin. Bersama-sama kita bisa membawa revolusi menuju kemenangan."
 SOV_long_live_the_workers_government: "Hidup Pemerintahan Buruh"
 SOV_long_live_the_workers_government_desc: "Sekarang kita telah memulai jalan panjang menuju pembebasan sejati kelas pekerja, kita tidak boleh tergoda untuk mengganti satu pemerintahan elit dengan pemerintahan elit lainnya. Pemerintahan serikat pekerja kita harus selalu menjadi pemerintahan sejati dari para pekerja, oleh para pekerja, dan untuk para pekerja."
 FOURTH_INTERNATIONAL_FACTION: "Internasional ke-4"
 SOV_left_purges: "Singkirkan kaum Kontra-Revolusioner"
 SOV_left_purges_desc: "Ada banyak orang lain yang memendam kebencian terhadap Stalin. Sementara kita masih mengkonsolidasikan kekuasaan kita, kita tidak boleh membiarkan orang-orang ini mulai membentuk sel-sel kontra-revolusioner, kalau tidak kita akan menghadapi perang saudara lagi dalam waktu dekat."
 SOV_left_right_purges_factionalism_tt: "Menghapus Pengubah Kekuatan Politik dari §Y$SOV_factionalism_modifier$§!"
 SOV_left_purges_tt: "Penasihat Oposisi Kanan akan disingkirkan"
 SOV_the_builder_of_the_red_army: "Pembangun Tentara Merah"
 SOV_the_builder_of_the_red_army_desc: "Apa pun yang terjadi saat ini, Tentara Merah akan selalu menjadi gagasan $SOV_lev_trotsky$. Sudah waktunya bagi dia untuk kembali ke posisinya semula, dan memimpin Tentara Merah yang baru dan bangkit kembali ke medan perang."
 SOV_reigniting_the_revolutionary_spirit: "Menghidupkan Kembali Semangat Revolusioner"
 SOV_reigniting_the_revolutionary_spirit_desc: "Pemerintahan Stalinis selama bertahun-tahun telah menumpulkan semangat revolusioner rakyat kita. Para pekerja kita diberitahu bahwa revolusi akan terjadi – pada akhirnya. Kita tahu bahwa hal ini tidak terjadi – dalam tingkat pembangunan global saat ini, revolusi harus dimulai di negara-negara lain yang belum begitu maju. Dan kami akan menyalakannya."
 SOV_the_permanent_revolution: "Revolusi Permanen"
 SOV_the_permanent_revolution_desc: "Teori Marxis mengajarkan bahwa revolusi tidak bisa dihindari jika keadaannya memungkinkan. Namun, situasinya jelas tidak tepat, atau tidak tepat di semua tempat. Kita tidak boleh berpuas diri dan menunggu revolusi dunia yang mungkin akan terjadi berabad-abad lagi. Buruh dan tani di seluruh dunia sedang menderita saat ini, dan pembebasan mereka tidak dapat ditunda lagi."
 SOV_the_permanent_revolution_decisions_tt: "Membuka keputusan §YMengatur Kolumnis Kelima§! untuk memicu pemberontakan revolusioner di negara tetangga musuh di Eropa."
 SOV_the_permanent_revolution_trotsky_trait_tt: "Jika §Y$SOV_lev_trotsky$§! adalah pemimpin negara:"
 SOV_depoliticize_the_military: "Depolitisasi Militer"
 SOV_depoliticize_the_military_desc: "Tujuan utama militer adalah untuk melindungi kelas pekerja. Tentara kita, sebagian besar, sudah menjadi anggota kelas pekerja, dan oleh karena itu tidak memerlukan seseorang untuk mengawasi mereka. Yang lebih penting lagi adalah Tentara Merah fokus pada misi utamanya, dan tidak boleh bermain-main dalam politik."
 SOV_depoliticize_the_military_ns_tt: "$SOV_modify_the_red_army_ns_intro$\nPengganda Peningkatan Kekuatan Perintah Maksimum: §G+10§!"
 SOV_system_decentralization: "Desentralisasi Sistem"
 SOV_system_decentralization_desc: "Stalin memusatkan tidak hanya partainya, tetapi seluruh negara pada dirinya sendiri. Ini jelas merupakan pendekatan kontra-revolusioner, yang mengambil kekuasaan dari kaum buruh dan menyerahkannya ke tangan elit yang korup. Kita perlu membalikkan arah ini, dan membiarkan buruh menentukan nasib mereka sendiri lagi."
 SOV_strengthen_heavy_industry: "Memperkuat Industri Berat"
 SOV_strengthen_heavy_industry_desc: "Industri berat adalah jantung perekonomian kita. Jika kita ingin memastikan bahwa revolusi tidak hanya bertahan, namun juga berkembang, kita harus lebih memperkuat sektor ini."
 SOV_a_global_class_struggle: "Perjuangan Kelas Global"
 SOV_a_global_class_struggle_desc: "Perjuangan untuk membebaskan kelas pekerja pada dasarnya harus merupakan perjuangan global. Selama masih ada satu negara yang mendukung sistem kapitalis, revolusi tidak akan aman. Ketika kaum buruh di seluruh dunia menyadari bahwa revolusi sekali lagi sedang berjalan, mereka akan berbondong-bondong mendukung kami dan mendukung upaya kami."
 SOV_a_global_class_struggle_decision_tt: "Membuka keputusan §YMenggerakkan Proletariat§! untuk menggoyahkan negara-negara tetangga di Eropa dan membenarkan perang melawan mereka."
 SOV_all_power_to_the_soviets: "Semua Kekuatan Untuk Soviet"
 SOV_all_power_to_the_soviets_desc: "Revolusi dimulai dengan ide sederhana - bahwa rakyat harus dibiarkan menentukan nasibnya sendiri, dengan membentuk dewan buruh, tentara, petani. Baru kemudian sistem ini diubah kembali menjadi sistem dimana birokrat yang tidak dipilih mengambil keputusan dari jauh. Ketika keputusan-keputusan ini justru menjadi bumerang, biasanya para pekerjalah yang terkena hukuman. Tidak lagi!"
 SOV_regional_development: "Pembangunan Daerah"
 SOV_regional_development_desc: "Daripada memiliki sejumlah kecil pabrik yang terpusat dan membiarkan seluruh negara kelaparan, kita harus memastikan bahwa perkembangan industri tersebar di seluruh negara."
 SOV_autonomous_soviet_republics: "Republik Soviet yang Otonom"
 SOV_autonomous_soviet_republics_desc: "Pada tahun-tahun setelah revolusi, kaum Stalinis telah bekerja keras untuk menghilangkan identitas regional dan menekan penentuan nasib sendiri para pekerja di beberapa wilayah serikat pekerja. Sifat kontra-revolusioner dari tindakan-tindakan ini sudah jelas. Jika kaum buruh di beberapa republik Soviet menginginkan otonomi yang lebih besar, kita harus mengabulkannya tanpa ragu-ragu."
 SOV_autonomous_soviet_republics_tt: "Memungkinkan negara-negara yang melepaskan."
 SOV_international_union_of_soviet_republics: "Uni Internasional Republik Soviet"
 SOV_international_union_of_soviet_republics_desc: "Pengkhianatan terbesar yang mungkin terjadi terhadap revolusi kita adalah gagasan bahwa sosialisme dapat – atau memang harus – dibangun di satu negara. Entah semua pekerja di semua negara akan bersama-sama mencapai sosialisme, atau tidak satu pun dari mereka yang akan mencapainya. Walaupun revolusi berada pada tahapan yang berbeda di berbagai negara, kami akan berbagi sumber daya kami untuk memastikan bahwa revolusi ini bergerak maju di semua negara sekutu di mana kaum buruh mengendalikan pemerintahannya."
 SOV_international_union_of_soviet_republics_tt: "Memodifikasi §Y$SOV_factionalism_modifier$§!:\nBiaya perdagangan tuan: §G-10%§!\nPengubah Stabilitas Popularitas Partai: §G+10%§!"
 SOV_international_union_of_soviet_republics_puppet_tt: "Tambahkan §Y1 Pabrik Sipil§! di ibukota negara bagian."
 SOV_the_onslaught_on_colonialism: "Serangan terhadap Kolonialisme"
 SOV_the_onslaught_on_colonialism_decision_tt: "Membuka §YMengorganisir Kolumnis Kelima§! dan §YMenggerakkan keputusan Proletariat§! di negara-negara tetangga di Afrika."
 SOV_the_onslaught_on_colonialism_desc: "Imperialisme dan eksploitasi kolonial adalah bagian penting dari kapitalisme tahap akhir. Namun, menjadikan jutaan orang sebagai budak memberikan kita potensi revolusioner yang sangat besar yang dapat kita manfaatkan dengan mudah. Massa tertindas di kerajaan kolonial sangat ingin bernapas lega – dan kami akan memutus rantai mereka."
 SOV_carry_revolution_east: "Bawa Revolusi ke Timur"
 SOV_carry_revolution_east_desc: "Eksploitasi brutal terhadap koloni-koloni di Afrika telah membuat masyarakat tersebut tidak mampu berkembang ke tingkat di mana revolusi dapat dengan mudah berhasil. Hal ini tidak terjadi pada masyarakat yang lebih maju di Asia, dimana terdapat potensi revolusioner yang besar dan menunggu untuk dikembangkan."
 SOV_carry_revolution_east_decision_tt: "Membuka §YMengorganisir Kolumnis Kelima§! dan §YMenggerakkan keputusan Proletariat§! di negara-negara tetangga di Asia."
 SOV_the_end_of_the_imperialist_era: "Berakhirnya Era Imperialis"
 SOV_the_end_of_the_imperialist_era_desc: "Mungkin ekspresi imperialisme yang paling nyata terletak pada apa yang disebut Doktrin Monroe, yang menyatakan bahwa satu negara mendeklarasikan dua benua sebagai wilayah eksklusifnya. Ini tidak akan bertahan. Revolusi akan mendapat pijakan di Amerika, dan para pekerja di belahan bumi barat pada akhirnya akan bisa bernapas lega."
 SOV_the_end_of_the_imperialist_era_decision_tt: "Membuka §YMengorganisir Kolumnis Kelima§! dan §YMenggerakkan keputusan Proletariat§! di negara tetangga Amerika dan Oseania."
 SOV_military_support: "Dukungan Militer"
 SOV_military_support_desc: "Mendapatkan dukungan dari dalam angkatan bersenjata bisa sangat berharga, bahkan jika itu berarti risiko bagi informan Stalin untuk mengetahui rencana kita. Semoga saja sudah terlambat baginya ketika hal itu terjadi."
 SOV_military_support_tt: "Meningkatkan jumlah dukungan dari angkatan bersenjata jika terjadi Perang Saudara.\nMembuka Keputusan untuk merekrut lebih banyak dukungan."
 SOV_divert_attention_towards_military: "Alihkan Perhatian Terhadap Militer"
 SOV_divert_attention_towards_military_desc: "Jika Stalin percaya bahwa angkatan bersenjata tidak senang dengan dia, dia akan menyerang mereka, bukan kita. Dan pada akhirnya, angkatan bersenjata tidak akan senang dengannya..."
 SOV_divert_purge_attention_tt: "Meluncurkan pembersihan acak terhadap militer.\nMembuka §Ykeputusan§! untuk menjebak perwira militer.\nAkan mengabaikan fokus §Y$SOV_the_zinovyevite_terrorist_center$§! untuk Pusat."
 SOV_gain_support_from_party_members: "Dapatkan Dukungan dari Anggota Partai"
 SOV_gain_support_from_party_members_desc: "Beberapa boneka Stalin melakukan hal ini terutama karena mereka takut. Kita harus meyakinkan mereka bahwa rencana kita akan berhasil, dan bahwa mereka bisa menjadi pahlawan tanpa harus melakukan banyak pekerjaan berat. Ada cara..."
 SOV_gain_support_from_party_members_tt: "§Y$SOV_vsevolod_merkulov$§!, §Y$SOV_mikhail_kalinin$§!, dan §Y$SOV_nikita_khrushchyov$§! bergabung dengan oposisi ketika Perang Saudara dimulai.\n§G+10%§! Stabilitas ketika Perang Saudara dimulai"
 SOV_sway_the_railway_workers: "Goyangkan Pekerja Kereta Api"
 SOV_sway_the_railway_workers_desc: "Sebuah revolusi membutuhkan pasokan. Kita harus memenangkan hati para pekerja kereta api untuk mendukung tujuan kita. Hal ini akan memberi kami kesempatan untuk mempersiapkan dan menyembunyikan depot pasokan di sekitar basis operasional kami."
 SOV_sway_the_railway_workers_tt: "Menambahkan §YRailway§! dan §YSupply hubs§! di sekitar negara bagian kantor pusat ketika §Y[GetSovietCivilWarName]§! dimulai."
 SOV_infiltrate_the_nkvd: "Menyusup ke NKVD"
 SOV_infiltrate_the_nkvd_desc: "Para anggota NKVD adalah orang-orang yang melakukan pekerjaan kotor Stalin, dan seringkali bertindak sebagai pelayan setianya. Tapi bahkan tembok pun ada yang retak. Kita harus memastikan bahwa sebanyak mungkin dari mereka bekerja untuk kita, dan memberikan informasi yang salah kepada tiran tersebut."
 SOV_infiltrate_the_nkvd_tt: "Akan membuat beberapa pasukan NKVD bergabung dengan perjuangan Anda dalam §Y[GetSovietCivilWarName]§!.\nMembuka §Ykeputusan§! $SOV_expand_nkvd_opposition$"
 SOV_infiltrate_the_nkvd_coup_tt: "Meningkatkan kemungkinan keberhasilan upaya pembunuhan terhadap Stalin."
 SOV_cooperation_against_stalin: "Kerja Sama Melawan Stalin"
 SOV_cooperation_against_stalin_desc: "Apapun perbedaan kita, pada tahap perjuangan ini kita harus bersatu dalam oposisi melawan Stalin."
 SOV_cooperation_against_stalin_right_tt: "§Y$SOV_karl_radek$§! dan §Y$SOV_yevgeny_preobrazhensky$§! tersedia sebagai penasihat."
 SOV_cooperation_against_stalin_left_tt: "§Y$SOV_nikolay_bukharin$§! dan §Y$SOV_aleksey_rykov$§! tersedia sebagai penasihat."
 SOV_cooperation_against_stalin_other_tt: "Penasihat baru tersedia."
 SOV_cooperation_against_stalin_factionalism_tt: "Memodifikasi §Y$SOV_factionalism_modifier$§! dengan §G-15%§! Biaya Penasihat Politik, §R-10%§! Faktor Stabilitas Popularitas Partai, dan §R-5%§! Faktor Kekuatan Politik."
 SOV_align_the_zinovyevites: "Sejajarkan kaum Zinovyev"
 SOV_align_the_zinovyevites_desc: "$SOV_grigory_zinovyev$ pernah memihak Stalin melawan Trotsky. Segera setelah itu, Stalin mengkhianatinya dan memecatnya dari posisi kekuasaan mana pun. Dia tidak akan melupakan hal itu sedikit pun, dan jika kita memberi $SOV_grigory_zinovyev$ kesempatan untuk membalas dendam, dia akan mengambilnya."
 SOV_align_the_zinovyevites_tt: "§Y$SOV_grigory_zinovyev$§! dan §Y$SOV_lev_kamenev$§! akan dibebaskan dari penjara dan dikirim ke pengasingan (§Gkarakter di pengasingan tidak dapat dibersihkan§!). Mereka akan tersedia sebagai penasihat ketika perang saudara dimulai.\nMembuka §YKeputusan§! untuk menambah partisan di negara-negara utama ketika pecahnya Perang Saudara."
 SOV_align_the_zinovyevites_factionalism_tt: "Memodifikasi §Y$SOV_factionalism_modifier$§! dengan §R-5%§! Faktor Kekuatan Politik."
 SOV_liberate_ryutin: "Bebaskan Ryutin"
 SOV_liberate_ryutin_desc: "Kamerad Ryutin tidak pernah segan-segan menyebut banyak kekurangan dan kekurangan Stalin. Mungkin tidak mengherankan jika Stalin memutuskan untuk menjadikannya contoh. Namun sekarang, kita harus berusaha keras untuk memindahkannya ke luar negeri sampai Stalin disingkirkan, sehingga dia bisa membantu kita menjalankan negara setelah Stalin tiada."
 SOV_liberate_ryutin_tt: "§Y$SOV_martemyan_ryutin$§! akan dibebaskan dari penjara dan dikirim ke pengasingan (§Gkarakter di pengasingan tidak dapat dibersihkan§!). Dia akan tersedia sebagai penasihat setelah perang saudara dimulai, dan para pendukungnya akan bergabung dengan oposisi."
 SOV_return_democracy_to_the_party: "Kembalikan Demokrasi ke Partai"
 SOV_return_democracy_to_the_party_desc: "Ada suatu masa di masa revolusi ketika kita tidak boleh terjebak dalam diskusi tanpa akhir tentang cara terbaik untuk maju. Namun zaman telah berubah, dan telah tiba waktunya untuk memenuhi janji demokrasi dalam segala aspek kehidupan yang diberikan kepada kaum buruh. Hal ini juga berarti bahwa kita sekarang dapat mengizinkan orang-orang kembali bergabung ke dalam partai yang kritiknya yang bertujuan baik pernah dianggap sebagai sabotase."
 SOV_return_democracy_to_the_party_unlock_right_tt: "§YPenasihat Oposisi Kanan§! telah tersedia."
 SOV_return_democracy_to_the_party_unlock_left_tt: "§YPenasihat Oposisi Kiri§! telah tersedia."
 SOV_return_democracy_to_the_party_factionalism_tt: "Memodifikasi §Y$SOV_factionalism_modifier$§! dengan §R-5%§! Faktor Kekuatan Politik."
 SOV_strengthen_the_trade_unions: "Memperkuat Serikat Pekerja"
 SOV_strengthen_the_trade_unions_desc: "Di bawah kepemimpinan Stalin, serikat buruh diselewengkan dari alat untuk mewakili buruh melawan manajemen menjadi alat manajemen untuk mengarahkan buruh. Meskipun ini mungkin tampak seperti salah satu kejahatan yang lebih ringan, hal ini benar-benar membalikkan gagasan kepemimpinan mandiri yang demokratis dari para pekerja dan secara efektif menghalangi para pekerja untuk memperoleh manfaat dari revolusi."
 SOV_the_peoples_revolution: "Revolusi Rakyat"
 SOV_the_peoples_revolution_desc: "Jika revolusi ingin bertahan, revolusi harus mencakup seluruh aspek masyarakat. Hanya jika seluruh rakyat menganggap diri mereka sebagai bagian dan pembawa revolusi maka mereka dapat bertahan menghadapi berbagai ancaman yang mereka hadapi."
 SOV_the_supreme_soviet: "Soviet Tertinggi"
 SOV_the_supreme_soviet_desc: "Memiliki satu orang yang mewakili seluruh negara pada dasarnya tidak demokratis dan karenanya kontra-revolusioner. Sebaliknya, kami akan menghapuskan perilaku pemujaan seperti itu, dan mendeklarasikan bahwa persatuan kami akan selamanya diwakili oleh kemauan kolektif rakyat, yang berkumpul di Soviet Tertinggi."
 SOV_the_right_opposition: "Oposisi Kanan"
 SOV_the_right_opposition_desc: "Kepemimpinan paranoid Stalin sedang menghancurkan negara ini. Terlebih lagi peralihannya ke kolektivisasi massal dan industrialisasi yang keras. Sesuatu harus dilakukan, dan segera. Mereka yang dapat membawa negara ini menuju kejayaan, menyembuhkan luka akibat salah urus, dan memulihkan perekonomian adalah para anggota oposisi sayap kanan yang dipimpin oleh Bukharin."
 SOV_the_right_opposition_tt: "Memulai proses menuju §YPerang Saudara§! di [ROOT.GetNameDef] antara kaum Sentris dan Oposisi Kanan."
 SOV_the_need_for_policy_changes: "Perlunya Perubahan Kebijakan"
 SOV_the_need_for_policy_changes_desc: "Sangat jelas terlihat bahwa negara ini sedang menuju ke arah yang salah. Stalin dan sekutunya telah mencoba terlalu banyak dan terlalu cepat. Kita harus berjalan sebelum kita dapat berlari. Kita harus membawa kembali Kamerad Sokolnikov, yang telah melakukan kerja besar selama tahun-tahun awal Uni Soviet, agar kita kembali ke jalur yang benar."
 SOV_the_need_for_policy_changes_tt: "§Y$SOV_grigory_sokolnikov$§! tersedia sebagai penasihat."
 SOV_reverse_the_collectivization_process: "Membalikkan Proses Kolektivisasi"
 SOV_reverse_the_collectivization_process_desc: "Kolektivisasi telah menjadi bencana besar yang menciptakan kemiskinan dan kelaparan di wilayah-wilayah yang dulunya merupakan lumbung pangan negara. Aturan-aturan tersebut harus segera dibatalkan."
 SOV_reverse_the_collectivization_process_tt: "Menambahkan dukungan dari Petani Milik Sendiri selama Perang Saudara\nMemodifikasi §Y$SOV_factionalism_modifier$§!:\nPabrik Maksimum di negara bagian: §R-10%§!\nFaktor Stabilitas Popularitas Partai: §G+10%§!"
 SOV_organize_uprisings_in_the_country: "Atur Pemberontakan di Negara ini"
 SOV_organize_uprisings_in_the_country_desc: "Jelas bahwa kita tidak akan bisa menyingkirkan Stalin dari kekuasaan tanpa adanya perjuangan bersenjata. Dengan mengalihkan perhatian Stalin dari persiapan kita, kita dapat memastikan bahwa persiapan tersebut berjalan tanpa gangguan."
 SOV_organize_uprisings_in_the_country_tt: "Meluncurkan pemberontakan di berbagai wilayah negara yang akan menghasilkan lebih banyak dukungan dalam Perang Saudara Soviet"
 SOV_dissent_in_the_party: "Perbedaan pendapat di Partai"
 SOV_dissent_in_the_party_desc: "Kita perlu menekan Stalin di beberapa bidang untuk melemahkan kendalinya atas partai. Salah satu pendekatannya adalah dengan menerbitkan sejumlah artikel dan esai kritis di surat kabar partai, menuntut reformasi dan menunjukkan kelemahan dalam keputusannya. Meskipun Stalin menganggap hal ini sangat meresahkan, hal ini juga akan meningkatkan posisi kita di mata berbagai kelompok oposisi."
 SOV_eliminate_the_left: "Hilangkan Kelompok Kiri"
 SOV_eliminate_the_left_desc: "Meskipun lawan utama kita adalah Stalin, kita harus mengakui bahwa ada banyak anggota partai yang hanya menunggu waktu dan akan melemahkan upaya kita untuk mengambil kendali negara dengan perdebatan mereka yang tak henti-hentinya. Ketika Stalin semakin paranoid terhadap tindakan kita, sebuah peluang muncul untuk membunuh dua burung dengan satu batu."
 SOV_eliminate_the_left_tt: "§Y$SOV_karl_radek$§!, §Y$SOV_ivar_smilga$§!, dan §Y$SOV_yevgeny_preobrazhensky$§! menjadi target potensial pembersihan oleh Stalin."
 SOV_concessions_to_foreign_powers: "Konsesi kepada Kekuatan Asing"
 SOV_concessions_to_foreign_powers_desc: "Sangat memalukan bahwa kami diminta untuk meminta bantuan asing dalam perjuangan kami menyelamatkan negara, namun tirani dan paranoia Stalin telah memaksa kami."
 SOV_concessions_to_foreign_powers_tt: "Membuka §YKeputusan§! untuk meminta bantuan dari kekuatan asing sebagai imbalan atas konsesi."
 SOV_covert_support_for_spanish_poum: "Dukungan Terselubung untuk POUM Spanyol"
 SOV_covert_support_for_spanish_poum_desc: "Di Spanyol, kontra-revolusi sedang berjalan lancar. Kekuatan fasis dan reaksioner mendukung Nasionalis Spanyol. Meskipun Partai Republik Spanyol memiliki semangat yang besar, sayangnya hal ini bukanlah pengganti senjata dan amunisi, juga bukan pengganti kesadaran politik yang sudah berkembang dengan baik. Kami dapat menyediakan ketiganya."
 SOV_covert_support_for_spanish_poum_tt: "Memberikan dukungan terselubung akan membuat POUM menjadi faksi dominan selama pemberontakan Anarkis dalam perang saudara Spanyol, menjadikannya pemberontakan §Y$communism$§! bukannya pemberontakan $neutrality$."
 SOV_if_poum_wins_tt: "Jika §YPOUMist $SPC_communism_DEF$§! memenangkan Perang Saudara Spanyol, sejumlah divisi Spanyol akan datang untuk membantu kita dalam perang saudara kita sendiri."
 SOV_undermine_stalins_authority: "Melemahkan Otoritas Stalin"
 SOV_undermine_stalins_authority_desc: "Satu-satunya hal yang membuat Stalin tetap berkuasa adalah ketakutan masyarakat terhadapnya dan apa yang bisa ia lakukan. Kita belum bisa menghilangkan ketakutan masyarakat, tapi kita bisa mengurangi kemampuan Stalin untuk menyakiti orang lain. Jika segala sesuatunya berjalan baik, kita bahkan mungkin akan mengisolasinya sampai pada titik di mana dia sekali lagi hanya seorang laki-laki."
 SOV_undermine_stalins_authority_paranoia_tt: "£SOV_paranoia_text_icon Peningkatan Paranoia Mingguan: §R+1§!"
 SOV_clandestine_cells: "Sel Klandestin"
 SOV_clandestine_cells_desc: "Kaum Stalinis melihat para perusak, mata-mata, dan penyabot di mana-mana. Mereka telah melakukan ini begitu lama sehingga kebanyakan orang tidak lagi mempercayai mereka ketika mereka memanggil serigala. Kita dapat menggunakan hal ini untuk membentuk sel-sel di pabrik-pabrik industri besar untuk melakukan tindakan sabotase jika Stalin menentang pengambilalihan kita."
 SOV_clandestine_cells_tt: "Membuka §Ykeputusan§! untuk menyabotase industri selama perang saudara."
 SOV_the_plan_for_the_coup: "Rencanakan Kudeta"
 SOV_the_plan_for_the_coup_desc: "Perebutan kekuasaan ini tidak harus meledak menjadi kekerasan terbuka. Jika kita memainkan kartu kita dengan benar, dan menempatkan orang yang tepat pada posisi yang tepat, kita mungkin bisa membekukan Stalin dari kekuasaannya dan kemudian menyingkirkannya."
 SOV_the_plan_for_the_coup_tt: "Membuka §Ykeputusan§! untuk menyelaraskan pimpinan NKVD dengan tujuan Anda, sehingga memungkinkan untuk menggulingkan Stalin melalui kudeta tak berdarah."
 SOV_the_socialist_bulwark: "Benteng Sosialis"
 SOV_the_socialist_bulwark_desc: "Kami berdiri berdampingan dengan rekan-rekan Spanyol kami. Sebagai contoh solidaritas internasional, perjuangan mereka adalah perjuangan kita, dan perjuangan kita adalah perjuangan mereka. Bersama-sama, kita akan membentuk dua pusat revolusioner sosialis di ujung Eropa yang berlawanan."
 SOV_the_socialist_bulwark_join_war_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! akan bergabung dengan §Y[SPC.GetFlag]POUM Spanyol§! dalam perang saudara melawan setiap faksi Spanyol lainnya."
 SOV_poum_exists_tt: "§Y$SPC_communism$§!:\nAda\nTelah menyelesaikan fokus §Y$SPR_the_anti_fascist_workers_revolution$§!"
 SOV_coup_detat: "Kudeta"
 SOV_coup_detat_desc: "Saatnya telah tiba untuk mengambil alih negara. Jika semuanya berjalan baik, kami akan menyerang dengan cepat dan menghilangkan hambatan terbesar dalam kudeta tak berdarah. Jika segala sesuatunya tidak berjalan baik, kita harus berjuang untuk negara kita."
 SOV_coup_detat_success_tt: "§YOposisi Kanan§! mengambil kendali melalui kudeta. §Y$SOV_lavrenty_beriya$§! dihapus."
 SOV_coup_detat_civil_war_tt: "Menambahkan dukungan untuk Oposisi Kanan di Angkatan Darat, Angkatan Laut, dan Angkatan Udara.\nMemulai §YPerang Saudara Soviet§!."
 SOV_right_purges: "Musuh Negara"
 SOV_right_purges_desc: "Masih ada segelintir anggota partai yang belum sepenuhnya menerima aturan kami. Kita perlu memberi contoh pada mereka agar yang lain tetap sejalan."
 SOV_right_purges_tt: "Penasihat Oposisi Kiri akan disingkirkan"
 SOV_the_power_of_the_peasantry: "Kekuatan Kaum Tani"
 SOV_the_power_of_the_peasantry_desc: "Meskipun ortodoksi Marxis menempatkan potensi revolusioner pada pekerja industri, namun di negara kita, jelas bahwa kaum tanilah yang merupakan mayoritas dari potensi revolusioner tersebut. Kita perlu mendidik jutaan petani dan mengembangkan kesadaran kelas mereka, sehingga mereka bersemangat membela revolusi ketika revolusi sedang diserang."
 SOV_curtailment_of_the_collective_farms: "Pembatasan Pertanian Kolektif"
 SOV_curtailment_of_the_collective_farms_desc: "Pertanian kolektif yang masif merupakan contoh khas dari gigantisme birokrasi Stalinis. Mereka mengasingkan petani dari hasil kerjanya dan secara efektif mengubahnya menjadi pekerja industri di ladang. Pada saat yang sama, produksi menurun secara signifikan dan gangguan produksi pangan telah menyebabkan bencana. Kita harus segera membalikkan kebodohan ini."
 SOV_curtailment_of_the_collective_farms_tt: "Kunci fokus Rencana Lima Tahun"
 SOV_administrative_reforms: "Reformasi Administrasi"
 SOV_administrative_reforms_desc: "Stalin menghargai kesetiaan di atas segalanya. Akibatnya, orang-orang yang bekerja di pemerintahan kita tidak menunjukkan inisiatif atau pemikiran independen yang dapat membuat mereka mendapat masalah. Nilai-nilai tersebut perlu kita tanamkan pada mereka, atau gantikan dengan orang yang memilikinya."
 SOV_a_new_theory_of_revolution: "Teori Revolusi Baru"
 SOV_a_new_theory_of_revolution_desc: "Teori revolusi Marxis akurat pada abad ke-19, namun realitas abad ke-20 memerlukan revisi terhadap teori tersebut. Revolusi tidak selalu dimulai di negara-negara paling maju, dan karena itu kita harus menyesuaikan pendekatan kita."
 SOV_back_to_the_nep: "Kembali ke NEP"
 SOV_back_to_the_nep_desc: "Sebelum kita dapat membangun masyarakat Sosialis, kita harus menciptakan dasar-dasarnya dan mengembangkan perekonomian kita lebih jauh. Pada tahun-tahun awal Revolusi, kami menerapkan Kebijakan Ekonomi Baru, yang memungkinkan mekanisme pasar bebas menumbuhkan perekonomian. Kebijakan ini dengan cepat dibatalkan, jauh sebelum dapat membuahkan hasil. Kini setelah kita kembali memegang kendali, kita dapat memulai kembali proses yang sempat terhenti ini menuju masyarakat yang lebih baik."
 SOV_back_to_the_nep_new_economy_law: "Membuka Undang-Undang Ekonomi baru: §Y$new_economic_policy$§!"
 SOV_planned_economy: "Perekonomian Terencana"
 SOV_planned_economy_desc: "Walaupun mempunyai kekurangan, jelas bahwa NEP juga mempunyai sejumlah keberhasilan. Kita masih jauh dari mampu beralih ke masyarakat Sosialis seutuhnya, namun kini kita dapat melanjutkan perencanaan perekonomian kita dengan cara yang lebih formal. Secara khusus, kita harus menciptakan kebijakan ekonomi yang mempertimbangkan kemampuan mitra dan sekutu kita serta menciptakan perekonomian yang lebih saling bergantung."
 SOV_planned_economy_subjects_tt: "Setiap negara subjek:"
 SOV_planned_economy_dynamic_modifier_tt: "Tambahkan §Y$SOV_planned_economy_dynamic_modifier$§!, yang memberikan (Output Pabrik: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!, Kurangnya Sumber Daya Penalti: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!)\nUntuk setiap mata pelajaran yang mengadopsi §Y$new_economic_policy$§!, memberikan tambahan:\nHasil Pabrik: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!\nKurangnya Penalti Sumber Daya: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!\n(Bonus tambahan diterapkan hingga maksimum: Output Pabrik: §Y+10.00%§!, Kurangnya Penalti Sumber Daya: §Y-10.00%§!)"
 SOV_paced_industrialization: "Industrialisasi yang serba cepat"
 SOV_paced_industrialization_desc: "Meskipun fokus Stalin pada industri berat telah menyebabkan keterbelakangan yang signifikan di banyak sektor, kita tidak dapat mengabaikan sektor ini dalam perencanaan kita. Untuk memungkinkan sektor lain melakukan modernisasi dan mekanisasi, kita harus memiliki basis industri yang mendukungnya."
 SOV_the_trade_union_as_labor_organizer: "Serikat Pekerja sebagai Pengorganisasi Buruh"
 SOV_the_trade_union_as_labor_organizer_desc: "Di bawah Kapitalisme, serikat pekerja ada untuk menjamin hak asasi manusia bagi para pekerja dan untuk mencegah eksploitasi dari pemilik pabrik. Hal ini jelas tidak lagi diperlukan dalam sistem yang baru, oleh karena itu peran Serikat Buruh harus beralih ke pengorganisasian buruh untuk tujuan optimalisasi produksi."
 SOV_incorporate_local_organizations: "Gabungkan Organisasi Lokal"
 SOV_incorporate_local_organizations_desc: "Organisasi-organisasi lokal sering kali memiliki pemahaman yang lebih baik mengenai permasalahan yang dihadapi para pekerja dibandingkan masyarakat di ibu kota. Kita harus tidak menekankan peran menteri dan anggota senior partai lainnya, dan memberikan lebih banyak kekuasaan kepada masyarakat setempat."
 SOV_for_the_common_good: "Demi Kebaikan Bersama"
 SOV_for_the_common_good_desc: "Prinsip yang mengatur setiap keputusan yang dibuat oleh sekutu kita adalah melakukan yang terbaik bila memungkinkan. Sekalipun pada awalnya, pengorbanan tersebut tidak membuahkan perbaikan langsung, namun harus dijelaskan bahwa dalam jangka panjang hal ini akan membawa dampak yang paling baik."
 SOV_victory_over_devastation: "Kemenangan Atas Kehancuran"
 SOV_victory_over_devastation_desc: "Upaya kolektif rakyat kami telah memungkinkan kami untuk bangkit dari kehancuran yang disebabkan oleh perang saudara. Kecepatan pembangunan kembali negara ini akan selamanya menjadi monumen keterampilan dan dedikasi para pekerja kami."
 SOV_victory_over_devastation_tt: "Ubah §Y$SOV_planned_economy_dynamic_modifier$§! menjadi\nPabrik Barang Konsumsi: §Y-2.0%§!\nPengubah Stabilitas Popularitas Partai: §G+15.00%§!\nBatas Penyerahan Minimum: §G+10.00%§!\nKecepatan Perbaikan Pabrik: §G+10.00%§!"
 SOV_victory_over_devastation_industrial_relocation_tt: "§Y$SOV_industry_relocation$§! durasi keputusan: §G-50%§!"
 SOV_socialist_humanism: "Humanisme Sosialis"
 SOV_socialist_humanism_desc: "Ada beberapa ahli teori Marxis yang percaya bahwa manusia tidak mempunyai hak menentukan nasibnya sendiri dan bahwa kehidupannya sepenuhnya ditentukan oleh faktor material. Hal ini jelas salah dan memang menunjukkan pandangan borjuis terhadap kelas pekerja. Manusia lebih dari sekadar sekumpulan organ, dan kita harus memperlakukannya sebagaimana mestinya."
 SOV_international_revolutionary_marxist_centre: "Marxisme Revolusioner Internasional"
 SOV_international_revolutionary_marxist_centre_desc: "Internasional Ketiga jatuh ke tangan totalitarianisme Stalinis dan mungkin tidak dapat diselamatkan lagi. Kita perlu menawarkan kepada partai-partai komunis di dunia cara baru untuk berkoordinasi dan bekerja sama."
 SOV_international_revolutionary_marxist_centre_faction_name: "Pusat Marxis Revolusioner Internasional"
 SOV_international_revolutionary_marxist_centre_allies_tt: "Setiap negara komunis independen non-Stalinis yang berdamai dengan [ROOT.GetName]:"
 SOV_international_revolutionary_marxist_centre_no_allies_tt: "Setiap negara komunis independen non-Stalinis berdamai dengan [ROOT.GetName]:\nKeuntungan §Y$SOV_international_socialist_association$§! (Pendapat §Y[ROOT.GetFlag][ROOT.GetName]§! §G+40§!.)\nMendapat acara '§Y[ROOT.GetNameDefCap] mengundang kami ke [ROOT.GetFactionName]§!'."
 SOV_international_revolutionary_marxist_centre_stalinists_tt: "Setiap negara Stalinis:"
 SOV_international_revolutionary_marxist_centre_stalinists_lacking_tt: "Setiap negara Stalinis:\nKeuntungan §Y$SOV_international_socialist_association$§! (Pendapat §Y[ROOT.GetFlag][ROOT.GetName]§! §R-40§!.)"
 SOV_international_revolutionary_marxist_centre_marxism_tt: "Pemimpin negara mereka menganut sub-ideologi $marxism$."
 SOV_a_sustainable_economy: "Perekonomian Berkelanjutan"
 SOV_a_sustainable_economy_desc: "Pergeseran ke arah Kebijakan Ekonomi Baru ditandai dengan pergeseran ke arah produksi barang-barang konsumsi, yang mengakibatkan lambatnya laju industrialisasi secara keseluruhan. Jika kita ingin berdaya saing dalam jangka panjang, kita perlu mengubah perekonomian ke arah model yang lebih berkelanjutan."
 SOV_the_enemies_of_the_people: "Musuh Rakyat"
 SOV_the_enemies_of_the_people_desc: "Kekuatan reaksi masih ada di luar sana, merencanakan suatu hari nanti bahwa mereka dapat membatalkan semua yang telah kita capai. Kita dan sekutu kita harus selalu waspada terhadap ancaman ini, dan bersiap menghadapi kemungkinan bahwa kita harus berjuang untuk mempertahankan revolusi."
 SOV_proclaim_soviet_hegemony: "Proklamasikan Hegemoni Soviet"
 SOV_proclaim_soviet_hegemony_desc: "Jelas bahwa sistem pemerintahan Soviet, perekonomian Soviet, dan masyarakat Soviet, jauh lebih unggul dalam segala aspek dibandingkan sistem-sistem yang ada sebelumnya. Meskipun sistem yang sudah ketinggalan zaman ini masih ada di belahan dunia lain, akan selalu ada orang yang ingin menentangnya, dan kita harus memanfaatkannya."
 SOV_first_moscow_trial_flag: "Telah menyelesaikan fokus §Y$SOV_the_zinovyevite_terrorist_center$§!"
 SOV_second_moscow_trial_flag: "Telah menyelesaikan fokus §Y$SOV_the_anti_soviet_trotskyist_center$§!"
 SOV_trial_of_the_generals_flag: "Telah menyelesaikan fokus §Y$SOV_the_military_conspiracy$§!"
 SOV_third_moscow_trial_flag: "Telah menyelesaikan fokus §Y$SOV_the_bloc_of_rights_and_trotskyites$§!"
 SOV_last_purge_focus_days_tt: "Hari-hari saat ini adalah: [?SOV_first_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_military_tt: "Hari-hari saat ini adalah: [?SOV_second_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_rights_tt: "Hari-hari saat ini adalah: [?SOV_trial_of_the_generals_flag:days|Y0]"
 SOV_last_purge_focus_days_cult_tt: "Hari-hari saat ini adalah: [?SOV_third_moscow_trial_flag:days|Y0]"
 SOV_beaten_but_not_defeated: "Dikalahkan, tapi tidak Dikalahkan"
 SOV_beaten_but_not_defeated_desc: "Jelas sekali bahwa Komunis telah membawa negara kita ke jalan yang berbahaya. Cepat atau lambat, negara-negara di perbatasan kita akan merasakan kelemahan yang melekat pada rezim ini dan akan menyerang. Jika kita ingin menyelamatkan tanah air kita tercinta, kita harus menyingkirkan Komunis dari kekuasaan!"
 SOV_beaten_but_not_defeated_tt: "Memulai proses menuju §Y[GetSovietCivilWarName]§! di [ROOT.GetNameDef] antara Komunis dan Oposisi di Pengasingan."
 SOV_unification_of_the_exiles: "Penyatuan Orang-orang buangan"
 SOV_unification_of_the_exiles_desc: "Setelah revolusi dan perang saudara, banyak orang lebih memilih pengasingan dibandingkan keadilan rezim baru. Mereka masih di luar sana, memimpikan suatu hari ketika Rusia akan kembali bebas. Sistem politik Rusia bukanlah hal yang penting bagi mereka. Sebelum kita dapat membentuk pemerintahan yang dibutuhkan negara ini, pertama-tama kita harus mengambil alih kekuasaan, dan kita dapat melakukannya bersama-sama dengan lebih baik."
 SOV_womens_fascist_movement: "Gerakan Fasis Perempuan"
 SOV_womens_fascist_movement_desc: "Meskipun peran perempuan tentu saja adalah menyediakan rumah yang nyaman bagi suaminya untuk beristirahat dan keluarga yang harus diperjuangkan, banyak laki-laki yang lupa akan kewajiban mereka terhadap negara dan rakyatnya. Beberapa wanita yang berdedikasi mungkin dapat dimanfaatkan untuk mengingatkan suami mereka tentang apa yang dipertaruhkan, dan mendorong mereka untuk melakukan apa yang perlu dilakukan."
 SOV_the_true_tsars: "Tsar Sejati"
 SOV_the_true_tsars_desc: "Rakyat Rusia selalu membutuhkan pemimpin yang kuat, atau mereka akan semakin terpecah belah, sampai saudara laki-laki melawan saudara laki-lakinya dan anak laki-lakinya berperang melawan ayah mereka. Namun para Tsar di masa lalu tidak cocok dengan peran mereka, lemah dan ragu-ragu. Di masa depan, kita akan membutuhkan seorang Tsar yang mampu menanggung beban berat yang ditimpakannya."
 SOV_national_unification: "Unifikasi Nasional"
 SOV_national_unification_desc: "Jika kita ingin selamat dari peperangan yang akan datang, kita tidak boleh membiarkan diri kita terpecah belah. Apapun pandangan politik berbeda yang kita miliki, pada akhirnya, kita semua adalah orang Rusia."
 SOV_national_unification_tt: "Menambahkan dua bangunan §Y$arms_factory$§! di ibu kota saat §Y[GetSovietCivilWarName]§! dimulai."
 SOV_covert_operations: "Operasi Terselubung"
 SOV_covert_operations_desc: "Kaum komunis rentan terhadap ketidakpercayaan dan pertikaian. Jika kita memainkan game ini dengan benar, kita mungkin bisa membuat mereka saling melahap satu sama lain."
 SOV_covert_operations_tt: "Membuka §Ykeputusan§! untuk menjebak anggota partai dan personel militer."
 SOV_embrace_the_black_hundreds: "Rangkullah Ratusan Hitam"
 SOV_embrace_the_black_hundreds_desc: "Dahulu kala, sebelum terjadinya kekacauan Revolusi, ada sekelompok orang yang beriman. Mereka percaya pada Rusia yang kuat, Rusia yang bersatu, Rusia yang tidak takut pada dirinya sendiri. Mereka disebut Ratusan Hitam. Meskipun anggota mereka yang masih hidup kini tersebar di berbagai negara, mereka tetap percaya. Dan kita dapat menemukannya dan membawanya kembali."
 SOV_muster_the_old_guard: "Kumpulkan Pengawal Lama"
 SOV_muster_the_old_guard_desc: "Masih banyak yang pernah memperjuangkan Tsar dan negaranya. Mereka semakin tua dan semakin lembut, namun pengalaman yang diajarkan perang tidak tergantikan. Jika kita bisa menjangkau mereka, mereka akan menjadi pasukan inti yang berpengalaman untuk pasukan baru ketika tiba waktunya untuk merebut kembali negara tersebut."
 SOV_approach_semyonov: "Dekati Semyonov"
 SOV_approach_semyonov_desc: "$SOV_grigory_semyonov$ telah menjabat sebagai penasihat di [MAN.GetName]. Dengan perjuangan yang semakin kuat dari waktu ke waktu, kita harus meyakinkan dia untuk kembali. Tugas pertamanya adalah mengorganisir pasukan kavaleri besar untuk Kekaisaran Rusia yang baru."
 SOV_approach_semyonov_tt: "§Y$SOV_grigory_semyonov$§! tersedia sebagai penasihat dan jenderal ketika [GetSovietCivilWarName] dimulai.\nMembuka §Ykeputusan§! untuk merekrut divisi kavaleri tambahan."
 SOV_fascist_youth_union: "Persatuan Pemuda Fasis"
 SOV_fascist_youth_union_desc: "Daripada melihat ke masa lalu, kita harus melihat ke masa depan, ke generasi muda dan ke teknologi modern. Kaum muda Fasis sangat ingin melihat Rusia kembali ke kejayaannya. Kekurangan pengalaman yang mereka miliki akan mereka penuhi dengan semangat belaka."
 SOV_fascist_youth_union_tt: "Rekrut unit infanteri bermotor Persatuan Pemuda untuk bergabung dengan pihak Anda ketika §Y[GetSovietCivilWarName]§! dimulai."
 SOV_tolkachi: "Tolkachi"
 SOV_tolkachi_desc: "Dalam perekonomian Soviet terdapat tipe orang tertentu, yang tugasnya adalah memastikan bahwa jumlah dalam rencana produksi sesuai dengan jumlah yang sebenarnya dapat disediakan oleh industri. Jika kita bisa meyakinkan orang-orang ini untuk bekerja pada kita, kita bisa memberi Soviet satu nomor dan manajer pabrik nomor lain, dan memindahkan selisih produksi ke tempat yang bisa disimpan sampai waktunya tiba."
 SOV_tolkachi_tt: "Menambahkan §Y$infantry_equipment$§!, §Y$support_equipment$§!, dan §Y$artillery_equipment$§! ketika §Y[GetSovietCivilWarName]§! dimulai"
 SOV_organize_wreckers: "Atur Penghancur"
 SOV_organize_wreckers_desc: "Soviet sudah memperkirakan akan banyak sabotase dari mata-mata dan musuh kelas. Ironisnya, ruang keamanan di pabrik baja terkecil sekalipun telah membuat frustrasi banyak pekerja, sehingga kita dapat dengan mudah menemukan beberapa orang yang akan mencoba membalas para tiran kecil di pabrik mereka jika kita memberi mereka sarana untuk melakukan hal tersebut."
 SOV_south_manchuria_railway: "Kereta Api Manchuria Selatan"
 SOV_south_manchuria_railway_desc: "Perusahaan Kereta Api Manchuria Selatan Jepang adalah sebuah negara bagian di negara bagian di [MAN.GetName]. Dengan dukungan mereka, kita harus mampu mempersiapkan jaringan pasokan yang kita perlukan untuk perjuangan mendatang."
 SOV_the_eyes_fear: "Mata Takut..."
 SOV_the_eyes_fear_desc: "Tugas yang ada di depan kita bukanlah tugas yang mudah. Kita harus menghadapi pemerintahan yang memiliki waktu puluhan tahun untuk memperkuat dirinya sendiri, dan yang akan didukung oleh sebagian besar penduduk. Tapi kami tahu apa yang perlu dilakukan, yang perlu kami lakukan hanyalah melakukannya."
 SOV_the_hands_do: "...Tangan Melakukannya"
 SOV_the_hands_do_desc: "Saatnya telah tiba. Kita harus berkomitmen pada tugas suci ini: menghapus sistem pemerintahan Soviet dari Tanah Air kita. Agar anak-anak kita kelak terbebas dari momok Komunisme."
 SOV_the_hands_do_tt: "§Y$SOV_metropolitan_meletius$§! tersedia sebagai penasihat."
 SOV_call_for_aid: "Panggilan untuk Bantuan"
 SOV_call_for_aid_desc: "Perjuangan melawan Komunisme di Rusia adalah bagian dari perjuangan yang lebih besar melawan Komunisme di mana pun. Namun kemenangan melawan Komunisme di Rusia akan menjadi pukulan mematikan bagi gerakan komunis di seluruh dunia, sehingga ada banyak negara yang ingin membantu kita."
 SOV_request_imperial_protection: "Minta Perlindungan Kekaisaran"
 SOV_request_imperial_protection_desc: "Masa-masa sulit menuntut tindakan yang mendesak. Jika satu-satunya cara untuk mengalahkan komunisme adalah dengan tunduk pada Hirohito, biarlah. Akan tiba waktunya ketika Rusia menjadi sebuah kerajaan tersendiri. Namun untuk saat ini, kami membutuhkan bantuan orang lain."
 SOV_request_imperial_protection_tt: "Jika diterima: §Y[JAP.GetNameDef]§! ikut perang. §Y[ROOT.GetNameDefCap]§! menjadi boneka §Y[JAP.GetNameDef]§!."
 SOV_sabotage_behind_enemy_lines: "Sabotase di Balik Garis Musuh"
 SOV_sabotage_behind_enemy_lines_desc: "Kesalahan manajemen yang dilakukan Komunis selama berpuluh-puluh tahun telah menyebabkan banyak orang marah dan kecewa terhadap pemerintah Komunis. Ketika Komunis masih memegang kekuasaan, kita bisa menggunakan orang-orang ini untuk mempercepat kekalahan mereka."
 SOV_aristocratic_investments: "Investasi Aristokrat"
 SOV_aristocratic_investments_desc: "Masih banyak mantan bangsawan Rusia yang tersebar di seluruh dunia, dan banyak di antara mereka yang memiliki kekayaan besar. Sebagian dari kekayaan itu dapat digunakan untuk membeli senjata dan peralatan."
 SOV_consolidate_power: "Konsolidasi Kekuatan"
 SOV_consolidate_power_desc: "Perang yang telah memecah-belah bangsa kita kini telah dimenangkan. Kita harus memperkuat posisi kita, dan secara metodis menyingkirkan mereka yang berani menentang kita."
 SOV_consolidate_power_tt: "§Y$SOV_nikolay_ustryalov$§! tersedia sebagai penasihat."
 SOV_rebuild_the_nation: "Membangun Kembali Bangsa"
 SOV_rebuild_the_nation_desc: "Negara kita yang dilanda perang sekarang harus dibangun kembali. Dengan kampanye propaganda, kami dapat memastikan setiap pria, wanita, dan anak-anak memberikan kontribusinya terhadap upaya pembangunan kembali."
 SOV_bringing_breakaways_back_to_the_fold: "Kembalikan Perpecahan ke dalam Kelompok"
 SOV_bringing_breakaways_back_to_the_fold_desc: "Setelah memenangkan kembali mayoritas negara, kita sekarang harus berurusan dengan negara-negara yang memisahkan diri. Tentunya mereka tidak bisa mengharapkan kita menerima hilangnya wilayah Kekaisaran Rusia selamanya?"
 SOV_offer_autonomy_to_former_soviet_republics: "Menawarkan Otonomi Kepada Republik Bekas Soviet"
 SOV_offer_autonomy_to_former_soviet_republics_desc: "Kami harus menerima hilangnya sebagian wilayah Kekaisaran untuk mencapai tujuan kami, namun semua orang harus menyadari bahwa wilayah ini benar-benar merupakan bagian dari wilayah Kekaisaran Rusia. Namun karena mereka membantu kita merebut kembali kekaisaran, kita harus menawarkan otonomi kepada mereka sebagai bentuk rasa terima kasih kita."
 SOV_restore_the_glory_of_the_motherland: "Kembalikan Kemuliaan Tanah Air"
 SOV_restore_the_glory_of_the_motherland_desc: "Di bawah kepemimpinan baru kami, kami akan memastikan Rusia menjadi lebih mulia dari sebelumnya! Kami akan memulai program pembangunan apa pun yang besar, dan membuat bangsa kami iri di dunia Barat!"
 SOV_article_124: "Pasal 124"
 SOV_article_124_desc: "[SOV.GetArticle124Desc]"
 SOV_ARTICLE_124_DESC_COMMUNIST: "Mungkin saja dalam mengejar cita-cita Marxis-Leninis kita... terlalu bersemangat menganiaya agama. Mungkin hal ini masih mempunyai peran dalam masyarakat Soviet. Konstitusi baru kami akan memuat pasal yang menjamin kebebasan beragama bagi semua warga negara Soviet."
 SOV_ARTICLE_124_DESC_EXILES: "Komunis mengklaim bahwa mereka hanya memisahkan gereja dan negara, namun kenyataannya, mereka bertujuan untuk menghilangkan Gereja dari kehidupan masyarakat. Selama berabad-abad, Gereja telah menjadi bagian integral dari masyarakat Rusia, dan Gereja harus kembali menjadi bagiannya."
 SOV_reopen_novodevichi: "Buka kembali Novodevichi"
 SOV_reopen_novodevichi_desc: "Gereja telah lama tidak diberi kesempatan untuk melatih para imam baru. Untuk merevitalisasi Gereja, kita harus menciptakan tempat yang dapat mendidik generasi pendeta dan biarawan berikutnya. Biara tua Novodevichi sepertinya merupakan pilihan yang tepat."
 SOV_rebuild_the_savior_cathedral: "Bangun kembali Katedral Juru Selamat"
 SOV_rebuild_the_savior_cathedral_desc: "[SOV.GetRebuildtheSaviorCathedralDesc]"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_COMMUNIST: "Pada tahun 1931, Katedral Kristus Sang Juru Selamat yang megah diledakkan untuk memberi ruang bagi \"Istana Soviet\" yang megah. Ketika momok perang membayangi Eropa, kecil kemungkinannya kita memiliki sumber daya untuk membangun raksasa ini. Memulihkan Katedral lama akan menjadi solusi yang cocok bagi sebagian masyarakat kita yang religius."
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_EXILES: "Pada tahun 1931, Katedral Kristus Sang Juru Selamat yang indah diledakkan untuk memberi ruang bagi \"Istana Soviet\" yang megah. Mengapa tepatnya masyarakat yang dibangun berdasarkan gagasan kesetaraan memerlukan Istana masih menjadi pertanyaan terbuka. Kini setelah kita kembali berkuasa, kita harus membalikkan kejahatan mengerikan ini dan memulai rekonstruksi Katedral."
 SOV_the_synod: "Sinode"
 SOV_the_synod_desc: "Dengan dibukanya kembali Seminar di Novodevichi, mereka harus didorong untuk mengadakan Sinode untuk membahas masalah-masalah iman apa saja yang muncul sejak terakhir kali mereka diizinkan mengadakan pertemuan semacam itu."
 SOV_the_declaration: "Deklarasi"
 SOV_the_declaration_desc: "[SOV.GetTheDeclarationDesc]"
 SOV_THE_DECLARATION_DESC_COMMUNIST: "Dalam 'Deklarasi' tahun 1927 yang terkenal, Patriark Sergius bersumpah setia kepada Uni Soviet, meskipun ada perbedaan agama antara gereja dan negara. Mungkin ini saatnya kita memberikan peran yang lebih publik kepada berbagai kota metropolitan yang mendukung deklarasi ini."
 SOV_THE_DECLARATION_DESC_EXILES: "'Deklarasi' tahun 1927 yang terkenal dari Patriark Sergius bersumpah setia kepada Uni Soviet, terlepas dari perbedaan agama mereka. Terlepas dari tindakan pengecut ini, infrastruktur Gereja Ortodoks Rusia bergantung pada orang-orang yang mendukung Deklarasi ini, sehingga kita tidak punya pilihan selain menyambut mereka kembali."
 SOV_the_declaration_tt: "§Y$SOV_patriarch_sergy$§!, §Y$SOV_metropolitan_nikolay$§!, dan §Y$SOV_metropolitan_aleksy$§! tersedia sebagai penasihat."
 SOV_return_of_the_rocor: "Kembalinya ROCOR"
 SOV_return_of_the_rocor_desc: "Gereja Ortodoks Rusia di Luar Rusia terdiri dari orang-orang buangan yang, bukannya meninggalkan keyakinan dan prinsip mereka, memilih mengasingkan diri setelah Perang Saudara Rusia. Kini, dengan kekalahan pemerintah komunis yang memaksa ekspatriasi mereka, akhirnya tiba saatnya untuk menyambut mereka kembali ke tanah air mereka dan mempekerjakan mereka kembali."
 SOV_the_return_of_the_rocor_tt: "§Y$SOV_metropolitan_anastasy$§! tersedia sebagai penasihat."
 SOV_the_third_rome_tt_2: "§YMetropolitan Meletius§! sekarang akan dikenal sebagai §YArch-Patriarch Meletius§!."
 SOV_reformalize_the_role_of_the_patriarchate: "Reformalisasi Peran Patriarkat"
 SOV_reformalize_the_role_of_the_patriarchate_desc: "[SOV.GetReformalizetheRoleofthePatriarchateDesc]"
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_COMMUNIST: "Sejak langkah pertama dibuat dengan Pasal 124, posisi Gereja dalam Persatuan kita telah mengalami kemajuan yang pesat. Jelas bahwa hal ini tidak dapat dihilangkan dari masyarakat Soviet – jadi mungkin kita harus menerimanya dan sekali lagi menjadikannya sebagai tempat sentral dalam kehidupan Pekerja Soviet."
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_EXILES: "Sudah terlalu lama Patriarkat berada dalam bayang-bayang Komunisme. Sudah saatnya negara ini kembali secara formal mengambil tempat yang selayaknya di pusat masyarakat dan budaya Rusia."
 SOV_reconvene_the_zemsky_sobor: "Kumpulkan kembali Zemsky Sobor"
 SOV_reconvene_the_zemsky_sobor_desc: "Di masa lalu, rakyat Rusia berkumpul di parlemen, yang disebut Zemsky Sobor, untuk membahas berbagai hal dan memutuskan berbagai masalah. Sampai kita memutuskan jalan mana yang akan diambil negara kita, kita harus membiarkan masyarakat memutuskan apa yang menjadi kepentingan mereka semua."
 SOV_recognized_country_tt: "§Y[ROOT.GetNameDefCap]§! diakui oleh komunitas internasional:"
 SOV_reconvene_the_zemsky_sobor_tt: "§Y$SOV_aleksandr_kazembek$§! dan §Y$SOV_anastasy_vonsyatsky$§! kembali dari pengasingan."
 SOV_dismantle_the_zemsky_sobor: "Bongkar Zemsky Sobor"
 SOV_dismantle_the_zemsky_sobor_desc: "Zemsky Sobor telah mencapai tujuannya. Terlalu banyak demokrasi bisa menjadi hal yang berbahaya, seperti yang ditunjukkan pada tahun 1917. Kita tidak boleh mengulangi kesalahan di masa lalu."
 SOV_religious_primacy: "Keutamaan Agama"
 SOV_religious_primacy_desc: "Pentingnya agama dalam masyarakat kita tidak dapat diremehkan. Sudah saatnya negara menerima dan mendukung keutamaan ini – dan mengambil langkah pertama menuju penyatuan gereja dan negara."
 SOV_romanov_reconstruction: "Rekonstruksi Romanov"
 SOV_romanov_reconstruction_desc: "Akhirnya bangsa kita sekali lagi memiliki seorang Tsar untuk memimpinnya. Dua dekade setelah penganiayaan terhadap penguasa terakhir yang sah di negara kita, kini saatnya untuk merangkul dinasti pemerintahan kita sekali lagi, dan menghilangkan hambatan-hambatan kecil terhadap pelaksanaan kehendak Tsar kita."
 SOV_church_candidates: "[SOV.GetChurchCandidatesName]"
 SOV_church_candidates_desc: "[SOV.GetChurchCandidatesDesc]"
 SOV_CHURCH_CANDIDATES_NAME_TSARIST: "Calon Gereja"
 SOV_CHURCH_CANDIDATES_NAME_FASCIST: "Keutamaan Agama"
 SOV_CHURCH_CANDIDATES_DESC_TSARIST: "Gereja telah meminta izin untuk mengirimkan kandidat mereka sendiri ke pemilihan Zemsky Sobor mendatang. Sebagai pengakuan atas peran penting yang dimainkan Patriarkat dalam masyarakat Rusia, kami memutuskan untuk menerimanya, membuka jalan menuju kemungkinan perpaduan sejati antara kehendak Tuhan dan kehendak penguasa kami."
 SOV_CHURCH_CANDIDATES_DESC_FASCIST: "Pentingnya agama dalam masyarakat kita tidak dapat diremehkan. Sudah saatnya negara menerima dan mendukung keutamaan ini – dan mengambil langkah pertama menuju penyatuan gereja dan negara."
 SOV_reinstitute_the_mestnichestvo: "Pasang kembali Mestnichestvo"
 SOV_reinstitute_the_mestnichestvo_desc: "Dahulu, keluarga tertua dan terpandang menjalankan urusan kenegaraan. Hal ini memastikan bahwa kaum Elite loyal terhadap negara yang mereka jalankan, dan bahwa setiap generasi baru akan diangkat ke standar yang sama dengan generasi lama. Kita harus melembagakan kembali sistem ini untuk mengamankan rezim baru kita."
 SOV_my_brothers_keeper: "Penjaga Kakakku"
 SOV_my_brothers_keeper_desc: "Dinasti Romanov lama memiliki ikatan dinasti dengan banyak keluarga bangsawan lainnya. Ada di antara mereka yang masih memegang kekuasaan, ada pula yang sudah kehilangan tahta. Kini setelah kita memulihkan monarki kita sendiri, kita harus memastikan bahwa penguasa yang tepat juga ada di negara-negara lain."
 SOV_the_rightful_heir_to_the_empire: "Pewaris Sah Kekaisaran"
 SOV_the_rightful_heir_to_the_empire_desc: "Meskipun Kekaisaran Bizantium lama sudah lama berlalu, masih ada yang perlu melindungi para peziarah ke Tanah Suci. Jelas bahwa Inggris dan Perancis tidak mampu melakukan tugas tersebut, jadi hal itu jelas menjadi tanggung jawab kita."
 SOV_the_third_rome: "Roma Ketiga"
 SOV_the_third_rome_desc: "Dengan terjaminnya peran kita sebagai pelindung Tempat Suci, kita adalah pembela iman yang tak terbantahkan. Wajar jika kita menata diri kita sesuai dengan itu. Setelah Kejatuhan Konstantinopel, Moskow tidak diragukan lagi telah menjadi Roma Ketiga."
 SOV_the_third_rome_tt: "§Y$SOV_metropolitan_meletius$§! tidak lagi tersedia sebagai penasihat."
 SOV_vengeance_for_the_yoke: "Pembalasan untuk Yoke"
 SOV_vengeance_for_the_yoke_desc: "Berabad-abad yang lalu bangsa Mongol melancarkan invasi brutal mereka ke tanah Rusia. Mereka tetap menjadi satu-satunya orang yang dikatakan telah benar-benar menaklukkan Rusia. Mereka mungkin tampak lemah sekarang, tetapi kita harus memastikan bahwa mereka tidak pernah kembali ke kekuatan semula sehingga kita tidak akan pernah lagi merasakan Tatar Yoke."
 SOV_reclaim_uryankhay_krai: "Rebut kembali Uryankhay Krai"
 SOV_reclaim_uryankhay_krai_desc: "Dalam Revolusi Mongolia tahun 1911, Republik Uryankhay dan Bogd Khanate Mongolia memisahkan diri dari Kekaisaran Qing, dan kami turun tangan untuk melindungi mereka, mengubah wilayah Uryankhay menjadi wilayah [ROOT.GetAdjective]. Namun, dengan gejolak perang saudara yang terjadi baru-baru ini, nampaknya mereka menginginkan kemerdekaan dari kita, sesuatu yang tidak boleh kita berikan kepada mereka, agar kekuatan dunia tidak memandang rendah kita selama berabad-abad mendatang!"
 SOV_westward_bound: "Menuju ke Barat"
 SOV_westward_bound_desc: "Sebagian besar harta benda barat kita hilang seiring dengan runtuhnya kekaisaran kita, yang disebabkan oleh revolusi. Waktunya telah tiba untuk membangun infrastruktur kita sebagai persiapan untuk merebut kembali harta benda kita yang sah."
 SOV_the_old_enemy: "Musuh Lama"
 SOV_the_old_enemy_desc: "Selama bertahun-tahun, Swedia menjadi duri bagi Kekaisaran. Mereka berulang kali menyerang Rusia dan mencoba menciptakan koalisi melawan kami. Tsar Peter I pertama kali mulai memukul mundur mereka, memukuli mereka di Poltava. Pada tahun 1809 kita kembali mengalahkan mereka, dan orang akan berpikir bahwa hal itu membuat mereka mengetahui posisi mereka. Namun mereka terus berusaha menentang kepentingan kami di kawasan Baltik. Sudah waktunya untuk menghancurkan negara kecil ini untuk selamanya."
 SOV_secure_finland: "Amankan Finlandia"
 SOV_secure_finland_desc: "Kadipaten Agung Finlandia telah menjaga perbatasan utara kami selama lebih dari satu abad, hingga negara tersebut terpecah dalam perang saudara. Harinya telah tiba untuk menyatukan kembali Finlandia dengan tanah airnya."
 SOV_secure_the_baltics: "Amankan Baltik"
 SOV_secure_the_baltics_desc: "Wilayah Baltik telah lama menjadi bagian integral dari Rusia. Mereka memisahkan diri pada saat nasional melemah, dan harus dipulihkan secepat mungkin."
 SOV_panslavic_nationalism: "Nasionalisme Panslavia"
 SOV_panslavic_nationalism_desc: "Rusia telah lama menjadi saudara terbesar dan tertua dalam keluarga Slavia kami. Jika ada satu pelajaran yang seharusnya kita pelajari sejak lama adalah bahwa bangsa Slavia akan selalu diserang, diintimidasi, dan ditindas kecuali kita tetap bersatu."
 SOV_panslavic_nationalism_tt: "§RNegara harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 SOV_pacify_the_rim: "Tenangkan Rim"
 SOV_pacify_the_rim_desc: "Kita tidak bisa membiarkan terulangnya perang tahun 1905, ketika wilayah timur jauh kita diserang dan sayangnya kita tidak siap menghadapi serangan gencar tersebut. Kita perlu berinvestasi pada infrastruktur lokal, agar dapat dengan cepat memindahkan pasukan jika diperlukan."
 SOV_eastern_expansion: "Ekspansi Timur"
 SOV_eastern_expansion_desc: "Masa Depan Rusia terletak di Timur. Setelah kita menjinakkan Siberia, sudah sepantasnya kita berupaya keras untuk mendapatkan lebih banyak lahan dan sumber daya di sini."
 SOV_restore_the_old_eastern_empire: "Kembalikan Kekaisaran Timur Lama"
 SOV_restore_the_old_eastern_empire_desc: "Suatu masa ketika kerajaan kita yang megah membentang melintasi tepian Pasifik, hingga ke benua Amerika. Keputusan yang tidak dipertimbangkan dengan baik sejak saat itu telah menukar kepemilikan ini demi keuntungan moneter jangka pendek. Namun di bawah kepemimpinan kita, Rusia mungkin akan kembali merebut kembali wilayah kekuasaan Amerika. Kami hanya perlu membuat pemiliknya saat ini menarik diri dari mereka."
 SOV_intervention_in_the_americas: "Intervensi di Amerika"
 SOV_intervention_in_the_americas_desc: "Banyak negara kecil di Karibia dan Amerika Latin pada umumnya telah lama dilanda ketidakstabilan pemerintahan. Sudah saatnya kita mengerahkan kekuatan politik kita dan 'mendorong' evolusi politik dalam negeri mereka ke arah yang kuat dan stabil. Begitu mereka mengembangkan pemerintahan yang serupa dengan kita, mereka akan ditawari tempat dalam aliansi militer kita yang sedang berkembang."
 SOV_intervention_in_the_americas_tt: "Negara-negara yang terpengaruh kemungkinan besar akan menjadi Fasis.\nNegara-negara yang menjadi Fasis akibat pengaruh ini akan diundang ke faksi kami."
 SOV_memories_of_1905: "Kenangan tahun 1905"
 SOV_memories_of_1905_desc: "Perang tahun 1905 masih membekas dalam ingatan kolektif masyarakat kita. Kita harus mengeksploitasi hal ini, dan mendesak para pekerja dalam upaya besar untuk menciptakan armada baru yang dapat kita gunakan untuk mendominasi Pasifik – dan mengobarkan api kebencian mereka sehingga mereka akan menyerukan penggunaan armada tersebut untuk membalas dendam kita terhadap musuh-musuh lama kita."
 SOV_rebuild_the_far_eastern_fleet: "Membangun kembali Armada Timur Jauh"
 SOV_rebuild_the_far_eastern_fleet_desc: "Jika kita ingin mengamankan kepentingan kita di Timur Jauh, apalagi melakukan serangan, kita harus secara drastis memperluas kapasitas pembuatan dan perbaikan kapal kita di wilayah ini."
 SOV_modernize_the_far_eastern_fleet: "Modernisasi Armada Timur Jauh"
 SOV_modernize_the_far_eastern_fleet_desc: "Tsushima mengajari kita bahwa kita tidak bisa mengandalkan angka-angka. Untuk benar-benar melaksanakan tugas di angkatan laut, kita memerlukan kru yang terlatih dan kapal perang modern yang sempurna agar mereka dapat berlayar. Armada baru yang kita bangun harus mampu bersaing dengan armada musuh kita yang berteknologi maju di Pasifik."
 SOV_the_lonely_island: "[SOV.GetLonelyIslandName]"
 SOV_the_lonely_island_desc: "[SOV.GetLonelyIslandDesc]"
 SOV_THE_LONELY_ISLAND_NAME_NORMAL: "Pulau Kesepian"
 SOV_THE_LONELY_ISLAND_NAME_INDEPENDENCE: "Perang Kemerdekaan Patriotik Hebat"
 SOV_THE_LONELY_ISLAND_DESC_NORMAL: "Saatnya telah tiba bagi kita untuk memperbaiki penghinaan yang dilakukan Jepang terhadap kita pada tahun 1905. Kali ini, tidak ada yang bisa menghentikan kita untuk menguasai Laut Jepang dan membuat mereka bertekuk lutut!"
 SOV_THE_LONELY_ISLAND_DESC_INDEPENDENCE: "Harga yang kami bayar untuk bantuan [JAP.GetAdjective] dalam perang saudara sangatlah tinggi. Tidak lagi! Kami akan mendapatkan kembali kemerdekaan kami dengan cara apa pun."
 SOV_an_empire_in_the_pacific: "Sebuah Kerajaan di Pasifik"
 SOV_an_empire_in_the_pacific_desc: "Ketika Kerajaan kita mulai meluas ke seluruh Pasifik, desain kapal kita juga harus mengikuti hal yang sama, agar kita dapat menggunakan kekuatan dan pengaruh kita di wilayah lautan yang luas ini."
 SOV_dismantle_the_zemsky_sobor_tt: "Separuh dari dukungan §Ynon-Fasis§! saat ini diterapkan sebagai hukuman §RStabilitas§!:"
 SOV_an_empire_in_the_pacific_tt: "Dapatkan §Gklaim§! di semua negara bagian di §YTiongkok Raya§!."
 SOV_capital_of_the_tsars: "Ibukota Tsar"
 SOV_capital_of_the_tsars_desc: "Sankt Peterburg sepanjang sejarah telah menjadi ibu kota negara kebanggaan kita. Sekarang, dengan Istana Musim Dingin yang sekali lagi ditempati oleh Romanov, sudah waktunya ibu kota resmi dipindahkan lagi ke kota yang megah ini, dan semua upaya dicurahkan untuk meningkatkan kemegahannya."
 SOV_capital_of_the_tsars_tt: "Yang memberikan:\nKecepatan Konstruksi Lokal: §G+25%§!"
 SOV_the_iron_wall_of_russian_resolve: "Tembok Besi Tekad Rusia"
 SOV_the_iron_wall_of_russian_resolve_desc: "Tsar membayangkan pembangunan legiun senjata perang yang mengerikan yang akan membuat tank-tank yang ada menjadi kerdil dan tidak ada bandingannya di medan perang. Rakyat Rusia tidak terkalahkan; itu tidak dapat dikalahkan! Mesin-mesin ini akan menjadi perwujudan dari tekad itu, dan mesin-mesin ini akan menghancurkan setiap pasukan yang dilemparkan ke arah kita."
 SOV_the_triple_entente: "Membangun kembali Triple Entente"
 SOV_the_triple_entente_desc: "Musuh lama kita di Eropa tengah harus dibendung. Sebuah aliansi pernah ada untuk tujuan ini, meskipun penarikan diri kita dari Perang Besar berarti berakhir. Sekaranglah waktunya untuk memperkuat kembali hubungan tersebut."
 SOV_our_slavic_commitments: "Komitmen Slavia Kami"
 SOV_our_slavic_commitments_desc: "Kami pernah menjadi pelindung seluruh bangsa Slavia, bahkan ikut serta dalam Perang Besar untuk membela saudara-saudara Slavia kami yang lebih lemah. Sudah saatnya kita sekali lagi memikul tanggung jawab ini, dan meminjamkan kekuatan militer kita untuk membela mereka."
 SOV_the_fate_of_romania: "Nasib Rumania"
 SOV_the_fate_of_romania_desc: "Rumania mempunyai minoritas Slavia dalam jumlah besar, dan memblokir akses tanah kami ke masyarakat Slavia di Balkan. Untuk menyelesaikan kedua masalah tersebut dalam satu pukulan, kemerdekaan Rumania harus diakhiri, dengan kekuatan militer, jika diperlukan."
 SOV_russian_corporate_state: "Negara Perusahaan Rusia"
 SOV_russian_corporate_state_desc: "Masa depan Rusia tidak terletak pada konflik kelas, melainkan pada kerja sama kelas. Untuk mencapai tujuan ini, negara harus membentuk serikat pekerja nasional untuk mendamaikan kepentingan buruh dan modal, dan melalui hal ini mengatur produksi."
 SOV_the_berlin_moscow_axis: "Poros Berlin-Moskow"
 SOV_the_berlin_moscow_axis_desc: "Dengan pemerintahan baru kita yang kini sudah mapan mengikuti model Jerman dan Italia, kita harus berusaha memperbaiki hubungan lama dengan negara-negara tetangga kita di wilayah barat. Jika kita fokus pada pandangan yang sama, kita mungkin akan membangun aliansi yang kuat dan langgeng antara diri kita sendiri dan [GER.GetName]."
 SOV_japanese_overtures: "Tawaran Jepang"
 SOV_japanese_overtures_desc: "Sekarang setelah sayap barat kita diamankan, kita harus melihat ke sisi timur. Orang Jepang mempunyai banyak kesamaan dengan orang Jerman, dan lebih banyak kesamaan dengan pemerintahan baru kita daripada yang ingin mereka akui. Mari kita cari tahu apa pendapat orang Jerman tentang menyampaikan undangan kepada mereka."
 SOV_into_central_asia: "Ke Asia Tengah"
 SOV_into_central_asia_desc: "Penaklukan Asia Tengah akan membawa kita pada posisi yang mengancam India, sekaligus memberikan kita akses ke Teluk Persia. Kebutuhan strategisnya jelas, dan kerajaan kita tidak akan menemukan kuburannya di sini."
 SOV_the_last_break_southward: "Istirahat Terakhir ke Selatan"
 SOV_the_last_break_southward_desc: "Serangkaian penaklukan terakhir pada akhirnya akan mengamankan sisa wilayah Asia Barat dan Bosporus, sehingga memungkinkan kita untuk merebut kendali dari India dengan keamanan sayap kita. Kita pada akhirnya akan mendapatkan akses tak terbantahkan ke lautan, dari wilayah sekitar Mediterania hingga ke Samudra Hindia."
 modify_the_red_army_tt: "Ubah §YTentara Merah§! dengan:"
