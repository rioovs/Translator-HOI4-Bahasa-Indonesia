 LAT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LAT_join_the_allies: "[Root.Get_Join_Allies_Focus_Loc]"
 LAT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LAT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LAT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LAT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LAT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LAT_threat_on_our_border: "[Root.Get_Threat_Border_Focus_Loc]"
 LAT_threat_on_our_border_desc: "[Root.Get_Threat_Border_Focus_desc_Loc]"
 LAT_empower_paramilitarists: "Memberdayakan Paramiliter"
 LAT_empower_paramilitarists_desc: "Militer Latvia memang berguna dan tentu saja lebih hebat dibandingkan kelompok paramiliter pinggiran mana pun, namun kita tidak bisa terus mengabaikan orang-orang yang rela mempertaruhkan nyawa demi Latvia tanpa janji imbalan atau pengakuan."
 LAT_the_sun_shines_equally: "Matahari Bersinar Sama"
 LAT_the_sun_shines_equally_desc: "Matahari Latvia menyinari semua orang secara merata, inilah prinsip kediktatoran. Selama bertahun-tahun, kelas sosial Latvia terpecah berdasarkan budaya dan etnis, namun hal ini tidak bisa dibiarkan terus berlanjut; kita harus memperjuangkan kesempatan yang sama bagi semua orang, dan kita tidak bisa mendukung kelompok paramiliter yang menentang cita-cita kita."
 LAT_banish_clemens: "Usir Celmiņš"
 LAT_banish_clemens_desc: "Gustavs Celmiņš adalah seorang fasis berbahaya yang mengancam stabilitas kediktatoran dan keselamatan minoritas Latvia di seluruh negara besar kita. Dia harus diusir dari negaranya sebelum Pērkonkrust-nya dapat menimbulkan kerusakan lebih lanjut pada bangsa kita."
 LAT_aizsargi: "Danai Aizsargi"
 LAT_aizsargi_desc: "Dibentuk oleh pemerintahan sementara pada tahun 1919, Aizsargi adalah organisasi paramiliter resmi pemerintah dan dukungan mereka terhadap kudeta Ulmanis harus dibalas dengan dukungan yang besar."
 LAT_womens_aizsargi: "Perluas Aizsargi Wanita"
 LAT_womens_aizsargi_desc: "Negara-negara kecil akan melarang perempuan untuk ikut dinas militer, namun di Latvia, siapa pun yang mau dan mampu memegang senapan dipersilakan untuk ikut dinas militer."
 LAT_latvia_for_latvians: "Latvia untuk orang Latvia"
 LAT_latvia_for_latvians_desc: "Bangsa kami tidak ada untuk menyenangkan orang Jerman atau Rusia, negara kami ada hanya untuk orang Latvia dan Latvia. Meskipun beberapa orang menganggap Pērkonkrust adalah ultranasionalis, kami tahu bahwa kami harus bekerja sama dengan mereka jika ingin menjamin kelangsungan hidup Latvia."
 LAT_lift_ban_on_perkonkrusts: "Cabut Larangan Pērkonkrusts"
 LAT_lift_ban_on_perkonkrusts_desc: "Secara resmi, kelompok Pērkonkrusts dilarang, namun jumlah mereka terus bertambah setiap hari. Dengan mencabut larangan terhadap kelompok tersebut, kami akan menunjukkan kediktatoran ramah terhadap cita-cita mereka."
 LAT_fanatic_recruitment: "Rekrut Fanatik"
 LAT_fanatic_recruitment_desc: "Di masa lalu, kita akan ragu-ragu untuk mengizinkan kelompok radikal masuk ke dalam angkatan bersenjata kita karena motif mereka lebih disebabkan oleh ideologi mereka dibandingkan dengan Latvia, namun Celmiņš dan para pengikutnya tentu saja ingin mempertahankan Latvia dan kemerdekaannya sama seperti siapa pun."
 LAT_military_industrial_complex: "Kompleks Militer Latvia"
 LAT_military_industrial_complex_desc: "Untuk mempersenjatai Pērkonkrust dengan semua yang mereka butuhkan, Latvia harus lebih menjadi pabrik senjata daripada negara."
 LAT_the_old_ways: "Cara Lama"
 LAT_the_old_ways_desc: "Suku Pērkonkrust tidak mengikrarkan diri mereka kepada Kristus dan ajaran-ajarannya, melainkan bersumpah kepada dewa-dewa lain, yang jauh lebih tua. Kaum konservatif menyebut ketertarikan Celmiņš terhadap dewa-dewa kuno itu mengerikan dan tidak wajar, namun Pērkonkrust berjuang demi Latvia yang lebih sejati; bebas dari pengaruh Dewa asing."
 LAT_anti_german_propaganda: "Propaganda Anti-Jerman"
 LAT_anti_german_propaganda_desc: "Kita harus memperjelas bahwa meskipun bangsa kita menganut cita-cita fasisme, kita bukanlah salah satu mainan [GER.GetLeader] dan kita tidak mempunyai niat untuk bekerja sama dengan orang-orang yang menindas rakyat kita selama berabad-abad."
 LAT_supply_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LAT_supply_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LAT_multicultural_latvia: "Latvia yang Multikultural"
 LAT_multicultural_latvia_desc: "Bangsa kita terdiri dari kelompok dan individu yang tak terhitung jumlahnya; Latvia, Jerman Baltik, Yahudi, dan banyak lainnya. Kita harus memberi semua kelompok ini sebuah rumah yang layak untuk diperjuangkan dan memastikan pelestarian lanskap budaya kita yang beragam."
 LAT_ready_the_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LAT_ready_the_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LAT_prepare_underground_resistance: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LAT_prepare_underground_resistance_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LAT_prepare_covert_resistance: "[Root.Get_Covert_Resistance_Focus_Loc]"
 LAT_prepare_covert_resistance_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LAT_cave_to_enemy_pressure: "[Root.Get_Enemy_Pressure_Focus_Loc]"
 LAT_cave_to_enemy_pressure_desc: "[Root.Get_Enemy_Pressure_Focus_desc_Loc]"
 LAT_alignment_with_germany: "Mencari Keselarasan dengan Jerman"
 LAT_alignment_with_germany_desc: "Orang-orang Jerman juga sama-sama meremehkan segala sesuatu yang berhaluan kiri dan lemah. Meskipun mereka telah melakukan upaya yang salah untuk menundukkan Latvia di masa lalu, kami yakin mereka tidak akan melakukan hal seperti itu lagi jika pemerintah kita selaras."
 LAT_the_thunder_strikes_alone: "Guntur Mengaum Sendirian"
 LAT_the_thunder_strikes_alone_desc: "Kami tidak memerlukan bantuan asing. Latvia lebih dari mampu mempertahankan kemerdekaannya, tetapi hanya di bawah bimbingan Pērkonkrusts."
 LAT_free_the_ugonskrusts: "Bebaskan Ugunskrust"
 LAT_free_the_ugonskrusts_desc: "Sebelum kami menjadi Pērkonkrust, kami adalah Ugunskrust, yang tertindas dan ditundukkan oleh rezim Latvia sebelumnya. Kini setelah kita bebas, kita mungkin bisa membebaskan banyak tahanan politik yang hanya menginginkan negara Latvia yang lebih kuat."
 LAT_lightning_strike: "Sambaran Petir"
 LAT_lightning_strike_desc: "Tetangga kita lemah dan mudah dieksploitasi. Akan lebih bijaksana jika kita membawa Lituania dan Estonia ke dalam tahanan Latvia, tentu saja demi perlindungan mereka sendiri."
 LAT_support_baltic_fascists: "Mendukung Fasis Baltik"
 LAT_support_baltic_fascists_desc: "Negara-negara Baltik adalah saudara, dan saudara harus tetap dekat. Kita semua adalah sasaran agresi asing dan kita tidak bisa membiarkan pemerintah yang berkemauan lemah memerintah rakyat Baltik. Dengan mendukung gerakan sayap kanan di Lithuania, Estonia dan Polandia, kami berdiri untuk menciptakan blok Baltik yang bersatu dan siap melawan dunia."
 LAT_consecrate_the_brotherhood: "Konsekrasikan Persaudaraan"
 LAT_consecrate_the_brotherhood_desc: "Meski berbeda dalam banyak hal, negara-negara Baltik tetap bersaudara. Budaya kita berbeda, namun kita mempunyai musuh yang sama dan masalah yang sama selama berabad-abad. Jika kita ingin mencegah penaklukan, kita harus menyatukan Ikhwanul Muslimin menjadi sebuah koalisi yang bersatu."
 LAT_consecrate_the_brotherhood_custom_tt: "Mendapat acara \"§Y[LAT.GetNameDef]§! mengundang kami ke faksi mereka\"."
 LAT_dievs_keepers: "Penjaga Diev"
 LAT_dievs_keepers_desc: "Para penyembah berhala di Latvia mulai tumbuh semakin militan terhadap perjuangan kami, melihat Celmiņš sebagai pemimpin agama. Umat ​​​​Katolik yang lebih konservatif di pemerintahan kita khawatir bahwa ketertarikan terhadap paganisme Baltik ini akan mulai berubah menjadi sebuah aliran sesat, dengan Celmiņš sebagai pemimpin karismatiknya, namun kita akan mendapat manfaat dengan memberikan senapan kepada para pemuda yang antusias ini."
 LAT_state_paganism: "Paganisme Negara"
 LAT_state_paganism_desc: "Pengaruh \"Dievturība\" di kalangan tentara hampir sepenuhnya mengalahkan keyakinan agama lainnya. Di sekitar Celmiņš terdapat orang-orang fanatik yang mengaku siap bertarung dan mati demi Dewa-Dewa Lama, padahal kenyataannya Celmiņš-lah yang menjadi sasaran fanatisme mereka. Dengan menetapkan Dievturība sebagai agama resmi negara, kita mungkin mulai menyebarkan ideologi Pērkonkrusts di gereja-gereja dan kuil-kuil di seluruh negeri."
 LAT_wrath_of_the_old_gods: "Kemarahan Para Dewa Lama"
 LAT_wrath_of_the_old_gods_desc: "Baltik bukan satu-satunya tempat yang tercemar oleh agama asing. Kebanyakan orang di dunia mengikuti ajaran Kristus, dan hal ini harus diubah. Kita harus mendeklarasikan perang salib kita sendiri; perang salib melawan Susunan Kristen!"
 LAT_ostland: "Ostlandia"
 LAT_ostland_desc: "Jerman mempunyai rencana untuk membentuk satu negara kesatuan di Baltik dan beberapa wilayah di Polandia Timur. Meskipun visi mereka tentang Ostland menempatkan orang-orang Jerman Baltik di puncak hierarki, tidak ada alasan mengapa kita tidak memanfaatkan rencana ini dan menciptakan desain Ostland-Latvia."
 LAT_reorganize_forest_brothers: "Atur ulang Forest Brothers"
 LAT_reorganize_forest_brothers_desc: "Forest Brothers adalah pembela identitas Latvia dan hak kami untuk menentukan nasib sendiri, namun yang mengganggu mereka adalah kegilaan mereka yang juga membela kemerdekaan Lituania dan Estonia. Hal ini tidak dapat dilanjutkan, Forest Brothers of Latvia harus berjanji untuk membela Latvia, Celmiņš, dan Partai Pērkonkrusts!"
 LAT_avenge_the_ancestors: "Membalas Leluhur"
 LAT_avenge_the_ancestors_desc: "Latvia belum mengenal terang kemerdekaan sejak zaman suku-suku Baltik, dan semua itu disebabkan oleh penaklukan yang tiada henti oleh Jerman, Swedia, dan Rusia. Kita tidak bisa mengambil risiko kebrutalan dan penindasan selama ribuan tahun lagi, kita harus membuat semua imperialis asing itu berlutut di hadapan Latvia!"
 LAT_united_baltic_empire: "Kekaisaran Baltik Bersatu"
 LAT_united_baltic_empire_desc: "Meskipun gagasan tentang satu negara Baltik merupakan sebuah konsep yang aneh, tidak dapat disangkal bahwa persaudaraan kita melampaui batas-batas negara saja. Dengan Lituania dan Estonia di bawah kendali kita, kita hanya perlu mengintegrasikan pemerintahan mereka dengan pemerintahan kita dan ambisi kita untuk hegemoni Baltik akan menjadi kenyataan."
 LAT_renew_the_constitution: "Memperbarui Konstitusi Latvia"
 LAT_renew_the_constitution_desc: "Kārlis Ulmanis membawa ke Latvia sebuah pemerintahan yang kuat yang mampu mengatasi badai fasisme dan komunisme yang akan datang, namun kini pemerintahan sipil telah diisi oleh anggota Partai Tani, tidak ada alasan untuk tidak membuka kembali pemilihan umum."
