 #Poland paid content
 POL_KPP_focus: "Bentuk Kabinet Kiri"
 POL_KPP_focus_desc: "KPP adalah partai revolusioner yang siap mengambil tindakan drastis yang diperlukan untuk membawa sosialisme ke Polandia. Meskipun beberapa dari mereka yang setia kepada Sanasi telah mengubah kesetiaan mereka, kita tidak dapat mempercayai mereka untuk mengisi kabinet kita dan mereka harus diganti dengan kawan-kawan revolusioner kita."
 POL_LIT_union: "Pulihkan Persemakmuran"
 POL_LIT_union_desc: "Dengan [Root.GetLeader] sebagai Raja Polandia dan Lituania, yang tersisa hanyalah menggabungkan Seimas dengan Sejm lagi dan Persemakmuran Polandia-Lithuania akan lahir kembali."
 POL_a_leftist_sejm: "Sejm Kiri"
 POL_a_leftist_sejm_desc: "Walaupun Partai Rakyat Polandia lebih memilih Sanasi, kaum sosial demokrat tidak memiliki kekuatan untuk melakukan reformasi radikal yang diperlukan untuk benar-benar membebaskan proletariat Polandia. Hanya melalui kepemimpinan langsung Partai Komunis, rakyat Polandia dapat memutus rantai mereka untuk selamanya."
 POL_anti_imperialism: "Anti-Imperialisme"
 POL_anti_imperialism_desc: "Menentang perang imperialistik adalah sebuah prinsip yang terpuji untuk dipegang, namun tidak cukup hanya dengan mengecam peperangan imperialis saja, sebuah revolusi dunia memerlukan perlawanan terhadap imperialisme itu sendiri!"
 POL_arm_monarchist_militants: "Persenjatai Militan Monarkis"
 POL_arm_monarchist_militants_desc: "Kami tahu ada orang-orang di seberang perbatasan kami yang ingin melihat [Root.GetLeader] membawa ketertiban dan kesejahteraan bagi bangsa mereka seperti yang [Root.GetLeader.GetSheHe] berikan kepada kami! Kita harus bersedia mempersenjatai para militan monarki ini sehingga mereka dapat berjuang untuk membawa raja mereka yang sah naik takhta."
 POL_armia_ludowa: "Armia Ludowa"
 POL_armia_ludowa_desc: "Kita tidak bisa mengalahkan imperialis asing, tapi kita bisa mengorganisir militan sayap kiri yang rela mati dalam perjuangannya. Dengan menetapkan Armia Ludowa sebagai cabang militer partai kami, kami akan memastikan untuk selalu memiliki tentara yang setia pada ambisi revolusi sosialis kami!"
 POL_assert_eastern_claims_pavel: "Tegaskan Klaim Timur"
 POL_assert_eastern_claims_pavel_desc: "Persemakmuran mencakup banyak wilayah bekas Kekaisaran Rusia, dan tidak diragukan lagi, Pavel akan dianggap sebagai pengkhianat jika ia ingin mencaplok wilayah tersebut. Namun, Kekaisaran Rusia sudah tidak ada lagi dan sudah menjadi tugas Pavel sebagai orang kulit putih untuk mengamankan bekas wilayah Rusia dari Soviet."
 POL_assert_western_claims: "Tegaskan Klaim Barat"
 POL_assert_western_claims_desc: "Perbatasan Polandia tampaknya secara kebetulan mengabaikan banyak bekas wilayahnya yang kemudian menjadi pusat industri besar. Akan bermanfaat bagi perjuangan Bermontian jika mereka ingin direbut kembali ke dalam kendali Polandia."
 POL_baltic_socialism: "Menegakkan Sosialisme Baltik"
 POL_baltic_socialism_desc: "Kehendak rakyat Baltik ditindas oleh para diktator, kapitalis, dan fasis. Jika para pekerja ingin membebaskan diri mereka sendiri, hal itu harus dilakukan dengan intervensi langsung Polandia."
 POL_claim_greater_lithuania: "Klaim Lituania Raya"
 POL_claim_greater_lithuania_desc: "Lituania yang kita kenal sekarang hanyalah bayangan dari Kadipaten Agung Lituania yang ada sebelumnya. Persemakmuran menggambarkan lebih dari sekedar persatuan Polandia dan Lituania, ini adalah persatuan Polandia, Lituania, Ukraina, dan Belarusia."
 POL_claim_livonia: "Klaim Livonia"
 POL_claim_livonia_desc: "Di antara negara-negara Baltik terdapat rasa persaudaraan dan persahabatan yang tidak dapat dipatahkan, dan sekarang kami mewakili kepentingan Lituania, kami berdiri untuk mengklaim rasa persaudaraan itu untuk diri kami sendiri dan menyatukan negara-negara Baltik ke dalam kerajaan kami yang sedang berkembang."
 POL_claim_prussia: "Rebut Prusia Timur"
 POL_claim_prussia_desc: "Prusia Timur adalah rumah bagi minoritas Lituania dan Polandia yang tak terhitung jumlahnya, dan sudah saatnya orang-orang ini bersatu dengan rekan-rekan mereka di Persemakmuran."
 POL_claiming_lithuania: "Penggugat Persemakmuran"
 POL_claiming_lithuania_desc: "Ada sejumlah negara yang mengklaim bagian yang setara dengan Polandia dan Lituania, dan akan sangat membantu dalam ambisi setiap Polandia untuk memulihkan Persemakmuran jika kita melakukannya di bawah pemerintahan seorang Raja yang mampu mengklaim hak ilahi atas keduanya."
 POL_com_independence: "Kemerdekaan"
 POL_com_independence_desc: "Kami telah cukup lama dieksploitasi oleh [SOV.GetNameDef]! Waktunya telah tiba bagi kaum revolusioner Polandia untuk mengangkat senjata sekali lagi dan memperjuangkan hak mereka untuk memerintah diri mereka sendiri!"
 POL_committee_of_national_liberation: "Komite Pembebasan Nasional"
 POL_committee_of_national_liberation_desc: "Kita berada dalam posisi genting, terjebak di antara Jerman dan Rusia, yang tunduk pada intrik imperialistik mereka. Dengan terbentuknya Komite Pembebasan Nasional, semua orang Polandia yang terkepung akan mempunyai kewenangan pusat untuk mengatur kegiatan perlawanan."
 POL_complete_the_bermontian_mission: "Selesaikan Misi Bermontian"
 POL_complete_the_bermontian_mission_desc: "Misi kami untuk berperang bersama pihak Putih dan merebut kembali Rusia demi kekuasaan Tsar terhenti karena invasi kami yang gagal ke Lituania, namun kini kami memiliki negara-negara Persemakmuran yang perkasa di bawah komando kami. Kita harus menaiki tunggangan kita dan membakar Uni Soviet menjadi abu!"
 royal_legitimist: "Legitimis Kerajaan"
 POL_cossack_king: "Raja Cossack"
 POL_cossack_king_desc: "Pada tahun 1918, Pangeran, Cossack, dan Panglima Perang Pavel Bermondt-Avalov diperintahkan untuk berperang demi pasukan Putih di Rusia, namun malah mengarahkan pasukan Bermontia melawan Lituania dan Latvia. Meskipun tidak populer dan non-Katolik, Bermondt mendapat dukungan dari Jerman dan prospek tentara Rusia Putih di belakangnya."
 POL_demand_LIT_pavel: "Permintaan Lituania"
 POL_demand_LIT_pavel_desc: "Terakhir kali, orang-orang Bermont terbukti tidak mampu mencaplok Lituania, namun kini dengan dukungan tentara Polandia, Pavel berada dalam posisi yang sangat berkuasa sehingga ia mungkin akan mengintimidasi orang-orang Lituania agar menyerahkan diri mereka secara besar-besaran. Seorang Raja tidak merendahkan diri dan meminta-minta Kerajaannya, ia menganggapnya sebagai haknya."
 POL_demand_slovakia_pavel: "Permintaan Slowakia"
 POL_demand_slovakia_pavel_desc: "Cekoslowakia lemah dan wilayahnya membuat iri tetangga-tetangganya. Jika Jerman bisa merebut Sudeten hanya dengan bertanya, bukankah kita juga bisa merebut Slovakia?"
 POL_demand_slovakia: "Permintaan Slowakia"
 POL_demand_slovakia_desc: "Cekoslowakia lemah dan wilayahnya membuat iri tetangga-tetangganya. Jika Jerman bisa merebut Sudeten hanya dengan bertanya, bukankah kita juga bisa merebut Slovakia?"
 POL_dismantle_capitalist_empires: "Bongkar Kerajaan Kapitalis"
 POL_dismantle_capitalist_empires_desc: "Kapitalisme adalah musuh alami sosialisme dan sekarang revolusi telah berjaya di Polandia, kita harus menggunakan posisi kita sebagai sarana untuk membongkar imperialisme kapitalistik di seluruh dunia, dimulai dengan pembongkaran seluruh kerajaan kolonial."
 POL_dismantle_fascist_empires: "Bongkar Kerajaan Fasis"
 POL_dismantle_fascist_empires_desc: "Fasisme adalah sebuah bencana bagi dunia. Mereka menggunakan bahasa perjuangan kelas untuk membuat kaum proletar melawan kawan-kawan mereka di seberang perbatasan. Mereka adalah musuh bebuyutan KPP dan harus segera dibasmi."
 POL_dismantle_soviet_empire: "Bongkar Kekaisaran [SOV.GetAdjective]"
 POL_dismantle_soviet_empire_desc: "[GetDismantleSovietEmpireDesc]"
 POL_dismantle_soviet_empire_desc_default: "[SOV.GetNameDefCap] menyebut dirinya sebagai federasi republik-republik independen, namun tidak lebih dari Kekaisaran Rusia dengan kilau cat merah. Seperti semua kerajaan, ini adalah musuh Polandia."
 POL_dismantle_soviet_empire_desc_alt: "Cat merah telah hilang dari Uni Soviet dan sekarang kita dapat melihat warna sebenarnya dari [SOV.GetNameDef], sehingga ambisi kekaisaran mereka semakin jelas. Sebagai musuh Polandia, hal ini harus diatasi sebelum terlambat."
 POL_expand_lithuanian_shipyards: "Perluas Galangan Kapal Lituania"
 POL_expand_lithuanian_shipyards_desc: "Kita tidak lagi harus dibatasi pada pelabuhan Gdynia dan Gdansk. Dengan Lituania di bawah kendali kami, kami diberi kesempatan untuk memperluas kapasitas angkatan laut kami dan bersaing untuk mendominasi Laut Baltik."
 POL_anti_capitalist_revolution: "Revolusi Anti-Kapitalis"
 POL_anti_capitalist_revolution_desc: "Meskipun ada godaan untuk mempertahankan keselarasan Polandia dengan Barat demi kepentingan diplomasi, kita tidak bisa menjual keyakinan kita kepada kapitalis asing. Revolusi dunia memerlukan perjuangan melawan kaum borjuis, dan kami bermaksud melakukan hal tersebut, baik mereka menyebut diri mereka \"fasis\" atau \"demokratis\"."
 POL_assemble_the_regency_council: "Bentuk Dewan Kabupaten"
 POL_assemble_the_regency_council_desc: "Undang-undang tanggal 5 November merupakan janji yang dibuat oleh Blok Sentral untuk melepaskan Kerajaan Polandia yang bebas dan merdeka dari sisa-sisa Kekaisaran Rusia. Kabupaten yang dihasilkan gagal menemukan seorang raja sebelum menyerahkan seluruh kekuasaan kepada Piłsudski, namun karena kaum Sanasionis tidak mampu membentuk pemerintahan yang stabil, mungkin inilah saatnya kita membangun kembali kabupaten tersebut untuk menjadikan Polandia sebagai raja yang sah."
 POL_fulfil_fifth_of_november: "Memenuhi UU 5 November"
 POL_fulfil_fifth_of_november_desc: "Dengan berkumpulnya kembali dewan kabupaten, sekarang saatnya untuk membuka pintu bagi semua pelamar kerajaan yang ingin mengklaim takhta Polandia."
 POL_governorate_livonia: "Kegubernuran Livonia"
 POL_governorate_livonia_desc: "Ketika Pavel menginvasi Lituania dan Latvia bertahun-tahun yang lalu, ia berdiri dalam posisi untuk merebut kembali Kegubernuran Livonia sebagai wilayah kekuasaan pribadinya. Sekarang, Latvia lemah dan kekuatan Polandia berada di belakang Pavel, tidak ada yang bisa menghentikan pemulihan Kegubernuran Livonia."
 POL_greater_commonwealth: "Persemakmuran Besar"
 POL_greater_commonwealth_desc: "Ambisi Persemakmuran jauh melampaui batas-batas sejarah Kerajaan yang telah lama hilang. Persemakmuran di hati masyarakat Polandia adalah kekuatan kekaisaran yang besar, sebuah kerajaan multikultural yang bersinar dari laut ke laut!"
 POL_greater_polish_SSR: "RSK Polandia Besar"
 POL_greater_polish_SSR_desc: "Saat ini kami telah membuktikan bahwa kami berguna bagi Uni Soviet dan akan lebih bijaksana jika kami meminta agar kendali atas Polandia Timur dikembalikan kepada negara kami, dengan sejumlah kompensasi atas jasa besar yang telah kami berikan untuk revolusi."
 POL_hohenzollern: "Hohenzollern"
 POL_hohenzollern_desc: "Jerman memimpikan Hohenzollern untuk memerintah Kerajaan Polandia yang baru, dan hubungan diplomatik kami yang erat dengan Rumania menjadikan keluarga kerajaan Rumania sebagai kandidat ideal untuk menjadi raja Polandia."
 POL_institute_royal_guards: "Bentuk Pengawal Kerajaan"
 POL_institute_royal_guards_desc: "Dengan seorang raja yang kini duduk di atas takhta, sangatlah penting bagi kita untuk menemukan hanya orang-orang paling elit di antara jajaran tentara Polandia yang dapat ditugaskan untuk melindungi pribadi raja kita tercinta."
 POL_internal_romanian_support: "Carilah Dukungan Internal Rumania"
 POL_internal_romanian_support_desc: "Raja Rumania membawa negaranya ke ambang kehancuran dengan pengeluaran berlebihan dan korupsinya. Sangat disayangkan, namun Raja Michael mungkin tidak punya pilihan selain bekerja sama dengan para pengkritik ayahnya untuk menjamin kelangsungan hidup Rumania."
 POL_king_michaels_coup: "Kudeta Raja Michael"
 POL_king_michaels_coup_desc: "Waktunya telah tiba bagi Raja Michael untuk merebut pemerintahan Rumania saat ini dan melihat dirinya dinobatkan sebagai Raja, begitu pula hak kesulungannya. Polandia dan Rumania yang dulunya merupakan sekutu kini akan bersatu menjadi satu."
 POL_king_of_lithuania: "Kerajaan Lituania"
 POL_king_of_lithuania_desc: "Waktunya telah tiba; masyarakat Lituania memberontak terhadap [LIT.GetLeader] dan para pendukung monarki siap menyampaikan tuntutan mereka kepada pemerintah. Dengan dukungan Polandia, mereka akan melihat [Root.GetLeader] sebagai penguasa yang ditunjuk oleh Tuhan."
 POL_dabrowszczacy: "Dąbrowszczacy"
 POL_dabrowszczacy_desc: "Ada brigade internasional pasukan sukarelawan Polandia yang berjuang untuk gerakan sosialis dan demokratis di seluruh dunia, dan dengan pemerintahan sosialis yang kini menguasai Polandia, kami dapat memberikan dukungan negara Polandia untuk mendukung para sukarelawan pemberani ini."
 POL_leftist_economics: "Membangun Ekonomi Sosialis"
 POL_leftist_economics_desc: "Dalam perekonomian kapitalis, modal ada untuk melayani kelompok elit. Dengan adanya kaum sosialis yang kini berkuasa di pemerintahan, kita harus menggunakan kembali perekonomian untuk melayani kebutuhan para petani yang berdarah-darah demi revolusi ini."
 POL_lithuanian_rail: "Kereta Api Polandia-Lithuania"
 POL_lithuanian_rail_desc: "Perjalanan antar serikat pekerja harus menjadi masalah sepele jika Polandia dan Lituania ingin benar-benar bersatu. Dengan bergabung dengan perkeretaapian kami, kami akan meningkatkan rantai pasokan dan kapasitas industri kami secara signifikan."
 POL_lower_class_education: "Pendidikan Kelas Bawah"
 POL_lower_class_education_desc: "Sudah terlalu lama akses terhadap pendidikan dibatasi oleh kekayaan dan hak istimewa, namun di bawah sosialisme, kepemilikan modal pribadi menjadi tidak relevan dengan sistem pendidikan."
 POL_merge_civilian_industries: "Gabungkan Industri Sipil"
 POL_merge_civilian_industries_desc: "Dengan negara kita yang kini bersatu, tidak masuk akal bagi Lituania untuk membangun hanya untuk Lituania dan Polandia hanya untuk Polandia. Industri kita harus menjadi industri yang memajukan bangsa."
 POL_merge_internal_governments: "Gabungkan Pemerintahan Internal"
 POL_merge_internal_governments_desc: "Meskipun Polandia dan Rumania sekarang mempunyai raja yang sama sebagai kepala pemerintahan mereka, mereka masih tetap dipisahkan oleh pemerintahan internal mereka. Kita harus menawarkan perwakilan penduduk lokal Rumania di Sejm, dan menggabungkan semua pemerintahan Rumania lainnya dengan pemerintahan Polandia yang setara."
 POL_merge_the_arms_industries: "Gabungkan Industri Senjata"
 POL_merge_the_arms_industries_desc: "Produsen senjata Polandia dan Lituania telah memproduksi senjata secara terpisah selama beberapa dekade, namun kini setelah negara kita menjadi satu, kita memiliki peluang untuk mengkhususkan industri dan menciptakan kolaborasi antara pabrik Polandia dan Lituania."
 POL_non_discriminatory_recruitment: "Hapuskan Rekrutmen yang Diskriminatif"
 POL_non_discriminatory_recruitment_desc: "Umat ​​Katolik Polandia memiliki jumlah perwakilan yang berlebihan dalam angkatan bersenjata kita karena kebijakan Sanasi. Ke depan, kami akan memberikan tempat kepada setiap patriot atau sosialis yang bersedia mengarahkan senjatanya melawan fasisme."
 POL_organize_the_peasants_strike: "Atur Pemogokan Petani"
 POL_organize_the_peasants_strike_desc: "Polandia terpecah belah oleh darah petani. Di seluruh pedesaan Polandia, kaum tani menjadi radikal karena kelalaian pemerintah yang jahat. [POL.GetLeader] pasti akan mendorong pemogokan menuju kekerasan, jadi kita harus mempersiapkan kaum proletar untuk bangkit melawan penindasnya."
 POL_polish_path_to_socialism: "Jalan Polandia Menuju Sosialisme"
 POL_polish_path_to_socialism_desc: "Sejak didirikan pada tahun 1918, Partai Komunis Polandia telah menjadi sasaran Bolshevisasi, dan saat ini banyak anggotanya yang hanya menjadi antek-antek Stalin. Namun, Maria Koszutska dan sejumlah anggota KPP terkemuka lainnya berupaya menyingkirkan elemen Stalinis dari partai dan membuat Polandia menentang Moskow."
 POL_polish_peoples_republic: "Republik Sosialis Soviet Polandia"
 POL_polish_peoples_republic_desc: "[GetSovietPolishPeoplesRepublicDesc]"
 POL_polish_peoples_republic_desc_default: "Polandia adalah salah satu negara anggota Uni Soviet yang paling maju dan independen, sehingga wajar saja jika kita menikmati tingkat otonomi yang lebih tinggi."
 POL_polish_peoples_republic_desc_alt: "Polandia menonjol dari negara-negara lain dalam lingkup pengaruh [SOV.GetAdjective], berkat industrialisasi relatif dan ideologi yang berbeda, jadi wajar saja jika kita menikmati tingkat otonomi yang lebih tinggi."
 POL_preserve_baltic_independence: "Pertahankan Kemerdekaan Baltik"
 POL_preserve_baltic_independence_desc: "Meskipun pemerintahan negara-negara Baltik sebagian besar tidak demokratis dan kapitalis, mereka menghadapi ancaman dari Timur dan Barat sama seperti kita, dan lebih baik kita mempertahankan kediktatoran borjuis mereka daripada melihat mereka jatuh ke dalam ambisi imperialistik Jerman dan Rusia."
 POL_preserve_bougoise_democracy: "Pertahankan Demokrasi Borjuasi"
 POL_preserve_bougoise_democracy_desc: "Meskipun tujuan KPP pada akhirnya adalah menyebarkan sosialisme ke seluruh dunia, di masa-masa sulit ini, meningkatnya fasisme global mengharuskan kita untuk berjuang bersama kaum kapitalis untuk melestarikan demokrasi borjuis. Hanya di dunia yang bebas dari fasisme, kondisi material dapat memfasilitasi revolusi sosialis global."
 POL_press_for_liberia: "Tekan untuk Liberia"
 POL_press_for_liberia_desc: "Pada tahun 1932, pemerintah Polandia dan Liberia sepakat untuk menempatkan Liberia di bawah pengawasan Polandia. Amerika memandang kehadiran kami di Liberia sebagai sebuah penghinaan, namun negara ini rentan dan sangat membutuhkan perlindungan Polandia."
 POL_pressure_for_the_west: "Tekanan bagi Barat"
 POL_pressure_for_the_west_desc: "Perbatasan pasti antara Polandia dan Jerman menjadi bahan perdebatan beberapa dekade setelah Perang Besar. Dalam perdebatan ini, Jerman mempertahankan sebagian besar pusat industrinya, sehingga Polandia hanya memiliki sedikit industri. Dengan penyerahan Timur kepada [SOV.GetNameDef], wilayah ini harus diganti dengan Silesia dan Pomerania."
 POL_pro_allied_government: "Tunjuk Pemerintahan yang Pro-Sekutu"
 POL_pro_allied_government_desc: "Banyak anggota Sejmik yang mendukung kelanjutan keberpihakan Polandia dengan Barat, dan dengan mempromosikan perwakilan-perwakilan ini ke posisi yang lebih tinggi dalam pemerintahan, kita membuat diri kita lebih terbuka terhadap kepentingan Sekutu."
 POL_push_for_ruthenia: "Dorong Melalui Ruthenia"
 POL_push_for_ruthenia_desc: "Jaringan kereta api di Ukraina dan Belarusia sangat terbengkalai, namun wilayah-wilayah ini merupakan bagian dari Persemakmuran seperti halnya wilayah lainnya. Kita harus berinvestasi pada jalur Timur jika kita ingin menembus Uni Soviet dan merebut kembali wilayah yang menjadi milik kita."
 POL_reopen_the_maritime_and_colonial_league: "Buka kembali Liga Kolonial Polandia"
 POL_reopen_the_maritime_and_colonial_league_desc: "Ambisi kehadiran Polandia antarbenua berakhir dengan kegagalan Polandia memperoleh Palestina, namun dengan hubungan dekat kami yang baru dengan Barat dan pemerintahan sosialis, kami dapat menggunakan modal kami untuk membebaskan pekerja di koloni dari penjajah Eropa di bawah pemerintahan Polandia yang baru."
 POL_restoration_of_the_royal_sejm: "Pemulihan Sejm Kerajaan"
 POL_restoration_of_the_royal_sejm_desc: "Di masa lalu Kerajaan Polandia, Sejm adalah pelayan setia masyarakat dan kerajaan. Dengan pemulihan Sejm dan penghancuran Republik Kedua, kita harus memastikan bahwa semua Sejmik setia kepada mahkota dan tidak akan berusaha mengembalikan Polandia ke pemerintahan Sanasi."
 POL_restore_bermontians: "Pulihkan Bermontian"
 POL_restore_bermontians_desc: "Tentara Relawan Rusia Barat adalah kekuatan yang dipimpin oleh Pavel Bermondt Avalov yang berupaya memulihkan monarki dan ketertiban di wilayah barat Rusia. Meskipun Polandia kini menjadi perhatian utama Pavel, penghancuran komunisme Rusia masih menjadi misi Bermontian dan semua orang Rusia berkulit putih harus melihatnya sebagai tugas mereka untuk berperang demi Tentara Bermontian!"
 POL_restore_poland_hungary: "Pulihkan Polandia-Hongaria"
 POL_restore_poland_hungary_desc: "Berabad-abad yang lalu, Polandia dan Hongaria bersatu, dan dominasi Eropa Timur terjamin bagi negara tersebut. Kini, dengan Transilvania dan Nytria berada di bawah kendali Polandia, satu-satunya hal yang menghalangi kita untuk mendapatkan kembali warisan Polandia-Hongaria adalah keberlangsungan keberadaan Hongaria itu sendiri."
 POL_royal_dictatorship: "Melembagakan Kediktatoran Kerajaan"
 POL_royal_dictatorship_desc: "Sejm memegang hak eksekutif untuk memveto keputusan apa pun yang dibuat oleh Raja, dan meskipun hal ini telah memberikan manfaat bagi kita sejauh ini, dunia sedang berubah dan kita tidak dapat membiarkan birokrasi menghalangi hak ilahi Raja kita untuk memerintah."
 POL_seek_german_alignment: "Carilah Keselarasan Jerman"
 POL_seek_german_alignment_desc: "Sebagai pengagum [GER.GetLeader] dan seorang Sosialis Nasional, Pavel telah menjadikan dirinya sebagai sekutu kekuatan fasis di dunia, dan yang tersisa hanyalah mendekati kaum fasis dan melihat apakah mereka akan menyambut Polandia di bawah kendali Bermontian ke dalam Poros mereka."
 POL_social_commonwealth: "Persemakmuran Republik Sosialis"
 POL_social_commonwealth_desc: "Meskipun ambisi apa pun untuk memulihkan Polandia-Lithuania akan bertentangan dengan tujuan revolusi kita, tidak dapat disangkal bahwa Polandia, Lituania, dan banyak negara bekas anggota Persemakmuran memiliki sejarah dan musuh yang sama. Mengingat perjuangan kita bersama, Persemakmuran baru diperlukan; negara yang memprioritaskan keselamatan dan pembebasan pekerjanya di bawah sosialisme."
 POL_soviet_industry: "[GetSovietIndustrialInvestmentTitle]"
 POL_soviet_industry_default: "Investasi Industri Soviet"
 POL_soviet_industry_alt: "Ekspansi Industri"
 POL_soviet_industry_desc: "[GetSovietIndustrialInvestmentDesc]"
 POL_soviet_industry_desc_default: "Salah satu keuntungan bergabung dengan Uni Soviet adalah masuknya kita ke dalam persatuan negara-negara yang kuat dan kita sekarang memiliki kekuatan industri yang memperkaya negara kita dengan investasi. Meskipun sebagian dari industri kami dikhususkan untuk kemajuan Uni Soviet, investasi industri yang kami terima sebagai timbal balik sangat meningkatkan kapasitas produksi kami."
 POL_soviet_industry_desc_alt: "Meskipun kita ditaklukkan oleh [SOV.GetNameDef], kita harus terus mengembangkan industri kita sendiri. Ini mungkin berguna jika kita memutuskan untuk memutus rantai kita."
 POL_soviet_military_staff: "Staf Militer Soviet"
 POL_soviet_military_staff_desc: "Dengan berdirinya Republik Polandia Kedua, banyak jenderal sayap kiri Polandia melarikan diri ke Uni Soviet untuk terus memperjuangkan revolusi dunia. Kini, dengan berkuasanya pemerintahan Uni Soviet, orang-orang buangan yang pemberani ini mungkin akan kembali ke kampung halamannya."
 POL_support_colonial_workers_strikes: "Mendukung Pemogokan Pekerja Kolonial"
 POL_support_colonial_workers_strikes_desc: "Para pekerja di koloni-koloni Eropa menderita dan berjuang, merasa kesal karena beban tuan mereka untuk mempertahankan sebuah kerajaan yang tidak memberi mereka apa-apa. Para pekerja ini tidak memiliki kondisi material yang diperlukan untuk membebaskan diri mereka, dan jika kita ingin benar-benar mewujudkan revolusi global, kita harus mempersenjatai kaum tertindas untuk melawan elit kolonial mereka."
 POL_support_monarchism_in_LIT: "Mendukung Monarki di Lituania"
 POL_support_monarchism_in_LIT_desc: "Sama seperti Polandia, Lituania dimaksudkan untuk memilih dirinya sendiri sebagai Raja baru. Berbeda dengan Polandia, pemilihan umum yang adil dinyatakan tidak sah oleh Jerman, namun kita dapat memberikan rakyat Lituania penguasa yang kuat seperti yang dijanjikan; seseorang yang akan membela Lituania dari imperialisme Jerman."
 POL_warsaw_to_crimea_railway: "Kereta Api Warsawa ke Krimea"
 POL_warsaw_to_crimea_railway_desc: "Dalam ambisi kita untuk memerintah dari laut ke laut, sangat penting bahwa setiap wilayah yang kita ambil menjadi bagian yang terintegrasi penuh dari negara kita. Perbatasan alami kita terbentang dari Utara ke Selatan, Timur ke Barat, dan ambisi untuk menghubungkan Krimea dengan jalur kereta api akan memperkuat pemahaman kita terhadap wilayah tersebut."
 POL_elect_a_PSL_leader: "Pilih Pemimpin PSL"
 POL_elect_a_PSL_leader_desc: "Meskipun Komunis bersaing untuk mendapatkan kekuasaan di pemerintahan kita, militer mendukung PSL. Jika kita memperkuat kepemimpinan kita sekarang, KPP tidak akan berdaya mengambil alih pemerintahan."
 POL_invest_in_the_peasantry: "Berinvestasi pada Komunitas Petani"
 POL_invest_in_the_peasantry_desc: "Para petani memperjuangkan kami dengan janji bahwa kami akan memperbaiki kehidupan di pedesaan, dan kami bermaksud untuk memenuhi janji itu. Jaringan kereta api dan infrastruktur yang baik akan memastikan tidak ada seorang pun yang tertinggal."
 POL_seek_an_alliance_with_kaiser: "Carilah Aliansi dengan Kaiser"
 POL_seek_an_alliance_with_kaiser_desc: "Kerajaan Polandia berdiri karena Undang-undang tanggal 5 November, sebuah deklarasi yang dibuat oleh Kaiser Jerman, yang berjanji untuk membentuk kerajaan Polandia baru dari Kongres Polandia yang diduduki Rusia. Belum diketahui apa rencana Kaiser terhadap Polandia, namun mungkin pengingat akan deklarasi Kekaisaran Jerman dapat menjadi bibit bagi aliansi yang tidak terduga."
 POL_surrender_the_east: "Menyerahkan Timur"
 POL_surrender_the_east_desc: "Uni Soviet memandang Polandia Timur sebagai bagian sah dari Ukraina dan Belarus, yang diklaim oleh Uni Soviet. Mungkin dengan menyerahkan wilayah ini kepada Soviet, kita bisa menjadi sekutu."
 POL_woo_morges_staff: "Undang Morges Depan"
 POL_woo_morges_staff_desc: "Pemberontakan kami tidak akan berhasil tanpa dukungan dari setidaknya beberapa pihak militer. Meskipun sebagian besar tetap setia pada salah satu dari tiga sayap Sanation, Front Morge tertarik untuk memulihkan demokrasi di Polandia dan mungkin bersedia bekerja sama dengan kami untuk mencapai tujuan ini."
 POL_ease_sanationist_tensions: "Meredakan Ketegangan Sanasionis"
 POL_ease_sanationist_tensions_desc: "Banyak anggota Front Morges memegang posisi militer tingkat tinggi di Sanation, dan mungkin kita dapat mempengaruhi mereka untuk menggunakan modal politik mereka untuk mengekang tindakan keras pemerintah terhadap pemogokan tersebut, sehingga memberi kita waktu yang penting untuk mengembangkan gerakan kita di Polandia."
 POL_arm_peasant_militia: "Milisi Petani Persenjataan"
 POL_arm_peasant_militia_desc: "Kaum tani Polandia akan membebaskan diri mereka dari penindas mereka melalui satu cara saja, yaitu dengan mengangkat senjata dan melawan kaum borjuis. Dengan menggunakan modal politik Front Morges untuk mencuri peralatan dari Sanation, kita akan memulai perang dengan kaum tani yang terlatih dan bersenjata lengkap."
 POL_state_national_council: "Dewan Nasional Negara Bagian"
 POL_state_national_council_desc: "Kaum Sanasionis memiliki Konstitusi bulan April untuk menyusun keyakinan mereka, dan kita sudah lama melakukan hal yang sama. Dewan Nasional Negara akan dibentuk untuk mempertemukan politisi sosialis dari seluruh Polandia untuk memperbaiki undang-undang Sanasi yang reaksioner."
 POL_communal_governance: "Pemerintahan Komunal"
 POL_communal_governance_desc: "Perang Tani, meski perlu, mendatangkan malapetaka dan kehancuran di pedesaan kita. Sekaranglah waktunya untuk membangun kembali dan membentuk pemerintahan komunal lokal di komunitas pedesaan kita yang akan menyembuhkan luka akibat perang."
 POL_raise_the_black_madonna: "Angkat Madonna Hitam"
 POL_raise_the_black_madonna_desc: "Black Madonna adalah potret suci Perawan Terberkati yang populer di kalangan kelas bawah Polandia sebagai pelindung Polandia dan kelas bawahnya. Dengan mengadopsi Black Madonna sebagai simbol gerakan kita, masyarakat kita akan mengetahui bahwa Santa Perawan ada di pihak kita, ketika saatnya tiba."
 POL_reassemble_the_sejm: "Pasang kembali Sejm"
 POL_reassemble_the_sejm_desc: "Dengan dibangunnya kembali praktik demokrasi di Polandia, inilah saatnya kita mengundang kembali kaum Sejmik yang diusir oleh Sanasi kembali ke pemerintah."
 POL_empower_the_morges: "Berdayakan Morges"
 POL_empower_the_morges_desc: "Front Morges telah membuktikan diri mereka sebagai sekutu demokrasi dan pencapaian kita hingga saat ini tidak akan mungkin tercapai tanpa dukungan mereka. Mungkin para jenderal ini berhak memimpin cabang militer mereka sendiri."
 POL_ROM_join_allies: "Bergabunglah dengan Sekutu"
 POL_ROM_join_allies_desc: "Dengan bersatunya tahta Polandia dan Rumania, kita harus mengalihkan fokus diplomatik kita kembali ke sekutu kita di Barat."
 POL_anti_blitz_tactics: "Taktik Anti-Blitzkrieg"
 POL_anti_blitz_tactics_desc: "Jerman berusaha untuk menguasai negara kita dengan kekuatan yang cepat dan luar biasa, tapi mungkin mesin perang ini hanyalah meriam kaca belaka. Manusia dapat dipaksa menghadapi bahaya tanpa mundur, dan tank hanya akan menjadi tangguh jika kita tidak mempersiapkannya."
 POL_anti_fascist_military_desc: "Meskipun pemerintahan sosialis membuat masyarakat Polandia terpecah belah, keberpihakan kita dengan Barat memberi kita tujuan bersama di seluruh spektrum politik, dan hal tersebut adalah perlawanan sengit kita terhadap fasisme dan imperialisme Jerman. Dengan dukungan dan propaganda, tentara kita akan menjadi kuat dan bersatu dalam menghadapi meningkatnya fasisme global."
 POL_anti_germans_abroad: "Mendukung Anti-Jerman di Luar Negeri"
 POL_anti_germans_abroad_desc: "Negara-negara Baltik adalah saudara kita dalam perjuangan melawan Bolshevisme dan Naziisme. Meskipun mereka tersebar, menyedihkan, dan lemah, dengan dukungan pemerintah Polandia yang kuat, kita mungkin masih dapat menjadikan negara-negara ini menjadi mesin perang yang berfungsi."
 POL_assert_eastern_claims: "Tegaskan Klaim Timur"
 POL_assert_eastern_claims_desc: "Polandia dalam keadaannya saat ini adalah bayangan dari Kekaisaran yang dulu. Polandia bukan hanya tempat tinggal orang Polandia, Polandia adalah warisan Persemakmuran dan kita harus memulihkan perbatasan lama di Timur."
 POL_assurance_of_loyalty: "Tentukan Perbatasan Pasca Perang"
 POL_assurance_of_loyalty_desc: "Jerman telah merebut banyak wilayah dari kami, dan upaya kami dalam mendukung perang tidak dapat disangkal. Sudah cukup lama kita bersujud, sudah saatnya kita menuntut ganti rugi atas apa yang kita serahkan."
 POL_beck_ribbentrop: "Pakta Beck-Ribbentrop"
 POL_beck_ribbentrop_desc: "Bukan rahasia lagi bahwa Jerman haus akan aneksasi Gdansk dan wilayah bekas Jerman lainnya, namun mungkin hal ini tidak harus melalui konflik berdarah. Mungkin Józef Beck dapat menciptakan solusi diplomatis terhadap perselisihan di perbatasan kita."
 POL_declare_independence: "Deklarasikan Kemerdekaan"
 POL_declare_independence_desc: "Jerman telah menjadi alat yang berguna dalam mengakhiri ancaman [SOV.GetNameDef] tetapi sekarang adalah waktu kita untuk melawan mereka yang ingin melihat Polandia dirantai. Waktunya telah tiba untuk menyerang Reich."
 POL_demand_LIT: "Permintaan Lituania"
 POL_demand_LIT_desc: "Pemerintahan Lituania terpecah, lemah, dan memiliki kepemimpinan ekonomi dan militer yang buruk. Negara Polandia tidak lengkap tanpa rakyatnya, dan mungkin hanya dengan menuntutnya, rakyat Lituania akan menyetujui unifikasi."
 POL_demand_pomerania: "Permintaan Pomerania"
 POL_demand_pomerania_desc: "Pomerania pernah menjadi bagian dari negara Polandia dan kini tetap berada di tangan Jerman. Meskipun hanya sedikit orang yang percaya bahwa kita mempunyai peluang, kita harus membuang dadu dan mengambil apa yang menjadi milik kita."
 POL_divide_lit: "Bagilah Lituania"
 POL_divide_lit_desc: "Kami mengupayakan restorasi Persemakmuran, Jerman mengupayakan Memel, mungkin kami bisa mencapai kesepakatan bersama dan mengeluarkan ultimatum bersama kepada Lituania."
 POL_empower_falangist_militants: "Memberdayakan Militan Falang"
 POL_empower_falangist_militants_desc: "Di antara kaum Falangis terdapat sejumlah organisasi paramiliter yang mempersenjatai diri untuk melawan Komunis. Dengan dukungan pemerintah, para peminat ini akan berkembang menjadi sayap bersenjata yang tangguh dari partai Falang."
 POL_falangist_international: "Falang Internasional"
 POL_falangist_international_desc: "Melawan Naziisme dan Fasisme Italia menempatkan kita pada posisi rentan, namun kita harus mencari sekutu dalam perjuangan kita melawan Jerman. Mungkin dengan menghadirkan Falangisme sebagai alternatif, kita bisa membentuk aliansi negara-negara yang berpikiran sama."
 POL_force_polish_upper_class: "Promosikan Kelas Atas Polandia"
 POL_force_polish_upper_class_desc: "Sebagai negara muda yang baru saja merdeka, banyak warga Polandia yang hanya menempati strata ekonomi bawah. Bangsa kita tidak akan bertahan jika kita tidak menciptakan kelas elit yang dilatih hampir sejak lahir untuk mengelola negara."
 POL_german_staff: "Volksdeutscher Selbstschutz"
 POL_german_staff_desc: "Polandia mempunyai minoritas Jerman yang cukup besar, dan meskipun Jerman berupaya menggunakan pemuda-pemuda ini untuk melawan kami, kolaborasi kami dengan Jerman saat ini mungkin akan membuat komunitas Jerman di Polandia lebih bersahabat dengan perjuangan kami."
 POL_german_training: "Staf Militer Jerman"
 POL_german_training_desc: "\"Mitra\" Jerman kita merahasiakan rahasia militer mereka, tapi mungkin dengan mengundang mereka untuk mengatur beberapa urusan internal militer kita, mereka tidak punya pilihan selain membocorkan beberapa rahasia militer kepada kita."
 POL_integrate_greater_kashubia: "Integrasikan Pomerania"
 POL_integrate_greater_kashubia_desc: "Orang-orang Slavia Kashubia melihat keseluruhan Pomerania sebagai perbatasan sah negara mereka, dan banyak orang Polandia juga melihatnya sebagai wilayah Polandia yang sah. Dengan tanah yang kini berada di tangan kita, yang perlu kita lakukan hanyalah mengintegrasikannya ke dalam pemerintahan kita dan Jerman Timur akan menjadi Polandia Barat."
 POL_integrate_the_endecja: "Integrasikan Endecja"
 POL_integrate_the_endecja_desc: "Meskipun partai Nasional-Demokrat cabang Siódemki berada di meja perundingan untuk membentuk koalisi dengan Sanacja, mayoritas partai masih menentang. Dengan mengundang anggota-anggota penting Endecja ke dalam pemerintahan, kita mungkin masih bisa membentuk pemerintahan yang bersatu di bawah Nasionalisme Polandia."
 POL_integrate_the_falanga: "Integrasikan Falanga"
 POL_integrate_the_falanga_desc: "ONR-Falanga adalah organisasi yang penuh kekerasan dan disruptif, namun meningkatnya nasionalisme di dalam pemerintahan mungkin akan menarik kaum Falangis untuk bersatu dengan kami demi masa depan Polandia."
 POL_invite_the_baltics: "Undang Baltik"
 POL_invite_the_baltics_desc: "Ketika negara-negara mayoritas beragama Katolik menghadapi risiko invasi Bolshevik, negara-negara Baltik adalah sekutu alami gerakan Falang dan harus dilindungi."
 POL_invite_the_lowlands: "Undang Dataran Rendah"
 POL_invite_the_lowlands_desc: "Meskipun Falangisme berada di pinggiran politik di Benelux, investasi waktu dan sumber daya yang moderat dapat membuat falangisme menjadi arus utama sehingga memungkinkan aliansi dengan negara-negara tersebut."
 POL_konfederacja_narodu: "Konfederasi Narodu"
 POL_konfederacja_narodu_desc: "Konfederacja Narodu adalah sekelompok kecil nasionalis Polandia yang menentang segala upaya Jerman untuk menduduki Polandia. Mungkin dengan mengumumkan kepentingan kami untuk menentang Jerman, para militan ini mungkin sejalan dengan tujuan kami."
 POL_nationalist_constitution: "Konstitusi Nasionalis"
 POL_nationalist_constitution_desc: "Konstitusi bulan April belum gagal memperkuat identitas Polandia, namun beberapa anggota Partai Nasional Demokrat dan Partai Falang telah menawarkan dukungan mereka dalam mengamandemen konstitusi untuk menempatkan identitas bangsa kita di atas segalanya."
 POL_polish_shock_battallions: "Batalyon Uderzeniowe Kadrowe"
 POL_polish_shock_battallions_desc: "Batalyon kejutan yang dilatih secara khusus, Batalyon Uderzeniowe Kadrowe adalah sayap bersenjata Konfederacja Narodu yang siap mati untuk menjaga Warsawa dari tangan musuh."
 POL_underground_conscripts: "Wajib Militer Bawah Tanah"
 POL_underground_conscripts_desc: "Wajib militer dari sel-sel Negara Bawah Tanah Polandia akan sangat meningkatkan kemampuan tempur pasukan kita melawan penindas."
 POL_prepare_german_line: "Siapkan Jalur Jerman"
 POL_prepare_german_line_desc: "Perbatasan dengan Jerman adalah bagian paling rentan di negara kita. Jika kita ingin menjauhkan Warsawa dari tangan Jerman, kita harus menemui mereka langsung di perbatasan dan tertawa ketika mereka berusaha melanggar keinginan kita."
 POL_privatize_education: "Rebut Perusahaan Asing"
 POL_privatize_education_desc: "Meskipun investor asing cukup berguna bagi kami, perusahaan yang mereka dirikan akan lebih baik jika ditempatkan di tangan Polandia. Ini akan membuat marah pemilik aslinya, tetapi ini adalah tindakan patriotisme yang perlu."
 POL_radicalize_poles_in_germany: "Radikalisasi Militan Polandia di Jerman"
 POL_radicalize_poles_in_germany_desc: "Ada kelompok minoritas Polandia di seluruh Jerman yang menjadi sasaran radikalisasi. Mungkin jika kita mengungkapkan kepada mereka rencana Jerman terhadap Polandia, mereka akan tergerak menjadi militansi yang siap untuk sejalan dengan tujuan kita."
 POL_reach_out_to_underground_state: "Jangkau Negara Bawah Tanah"
 POL_reach_out_to_underground_state_desc: "Negara Bawah Tanah Polandia beroperasi secara rahasia di balik pintu tertutup. Dengan menjangkau mereka dan memberi mereka dukungan, kita mungkin suatu hari berharap bisa mengalahkan majikan kita yang dulu."
 POL_reassert_silesian_claims: "Menegaskan kembali Klaim Silesia"
 POL_reassert_silesian_claims_desc: "Nasib Silesia menjadi titik perdebatan besar pada masa-masa awal Republik Polandia, dan pemerintah pada saat itu setuju untuk menyerahkan sebagian besar Silesia dan menetap di Silesia Atas yang relatif kecil. Pemerintah yang kuat tidak akan memberikan konsesi seperti itu dan klaim kami harus ditegaskan."
 POL_reopen_national_elections: "Buka kembali Pemilu Nasional"
 POL_reopen_national_elections_desc: "Tujuan Endecja adalah memulihkan demokrasi di Polandia sekaligus memastikan pemerintah melayani kepentingan nasionalisme Polandia. Kita harus membuka kembali pemilu, namun sedemikian rupa sehingga partai-partai yang tidak patriotik tidak bisa ikut serta dalam pemilu."
 POL_request_autonomous_status: "Minta Status Otonom"
 POL_request_autonomous_status_desc: "Kita merasa kesal karena pengaruh Jerman, kita harus meminta otonomi industri yang lebih besar jika kita ingin memiliki masa depan."
 POL_riot_of_37: "Kerusuhan Warsawa"
 POL_riot_of_37_desc: "Sanacja tidak akan pernah setuju untuk mentransfer kekuasaan secara damai untuk mentransfer kekuasaan kepada kaum Falang, namun pengaruh Falang berkembang jauh di luar kendali Sanacja. Satu demonstrasi yang penuh kekerasan di Warsawa mungkin sudah cukup untuk menjadikan Falanga memegang kendali langsung atas negara tersebut."
 POL_sideline_the_sanacja: "Singkirkan Sanacja"
 POL_sideline_the_sanacja_desc: "Falanga dan Endecja telah tumbuh cukup berpengaruh dalam pemerintahan Polandia sehingga jika keduanya berkolaborasi lebih erat, kaum Sanasionis mungkin akan kehilangan modal politik yang signifikan dan menjadikan diri mereka rentan terhadap kudeta..."
 POL_siodemki: "Konsolidasi Konstitusi"
 POL_siodemki_desc: "Sanacja mendukung Konstitusi April, sedangkan Endecja ingin menggantinya dengan Konstitusi mereka sendiri. Dengan kolaborasi partai-partai kita, kita tidak boleh lagi mengalami kebingungan dan kita harus sepakat untuk mengkonsolidasikan visi-visi yang bersaing ini demi masa depan Republik Polandia."
 POL_state_catholicism: "Katolik Negara"
 POL_state_catholicism_desc: "Identitas Katolik merupakan bagian integral dari ideologi Falangis, dan oleh karena itu, Gereja dan Negara haruslah satu dan sama."
 POL_support_falangists_in_the_americas: "Dukung kaum Falangis Amerika"
 POL_support_falangists_in_the_americas_desc: "Benua Amerika penuh dengan gerakan Falang, terutama di negara-negara Amerika Latin. Memperluas aliansi kita ke Amerika diperlukan tidak hanya untuk mengamankan kepentingan Falang di seluruh dunia, namun juga melindungi rekan-rekan kita dari pengaruh Amerika."
 POL_support_global_falangism: "Mendukung Falangisme Global"
 POL_support_global_falangism_desc: "Kita tidak sendirian dalam perjuangan membawa Falangisme ke negara kita. Terdapat sukarelawan di seluruh Polandia yang berupaya mendukung gerakan Falang di seluruh dunia, dan negara harus mendukung individu-individu ini."
 POL_the_national_commonwealth: "Persemakmuran Nasional"
 POL_the_national_commonwealth_desc: "Persemakmuran lama adalah Kekaisaran Polandia yang menguasai wilayah dan masyarakat luas. Dengan Lituania di tangan kita, Kekaisaran Polandia terlahir kembali!"
 POL_romanov: "Romanov"
 POL_romanov_desc: "Meskipun bukan kandidat yang mungkin, wanita muda yang menyebut dirinya Anastasia Romanov mengklaim bahwa raja terakhir Polandia adalah Tsar Nicholas II dan dengan demikian, klaimnya atas Polandia diamanatkan oleh Tuhan."
 POL_invite_exiled_nobility: "Undang Bangsawan yang Diasingkan"
 POL_invite_exiled_nobility_desc: "Meski banyak bangsawan Rusia yang menolak mengakui warisan sah Raja Anastasia, mengundang mereka kembali dengan janji gelar bangsawan mungkin akan membuat mereka mengubah posisi dan mengakuinya sebagai putri kandung Tsar Nicholas II yang masih hidup."
 POL_pan_slavism: "Revanchisme Pan-Slavia"
 POL_pan_slavism_desc: "Gerakan Pan-Slavia sejauh ini hanya sekedar alat yang berguna bagi Rusia untuk mengklaim hegemoni atas seluruh bangsa Slavia, namun juga berguna dalam menyatukan masyarakat Slavia yang berbeda ke dalam negara-negara bersatu seperti Yugoslavia dan Cekoslowakia. Lalu mengapa Polandia harus menjadi pengecualian? Bukankah Polandia juga harus memanfaatkan gelombang Pan-Slavisme ini?"
 POL_demand_yugoslav_subjugation: "Menuntut Subjugasi Yugoslavia"
 POL_demand_yugoslav_subjugation_desc: "Jika keinginan kita untuk penyatuan Pan-Slavia ingin terwujud, kita tidak boleh mengabaikan Slavia Selatan. Meskipun perbatasan negara dan gunung-gunung besar menghalangi kami, kami tetaplah orang Slavia."
 POL_claim_russia: "Klaim Rusia"
 POL_claim_russia_desc: "Raja Anastasia Romanov adalah pewaris terakhir Tsar Nicholas II yang masih hidup, dan dengan demikian klaimnya atas takhta Rusia tidak hanya sah, namun juga merupakan kehendak Tuhan. Dengan dukungan para bangsawan Rusia atas klaimnya, Anastasia siap untuk merebut kembali hak kesulungannya sebagai Permaisuri Rusia."
 POL_proclaim_slavic_unity: "Proklamasikan Persatuan Slavia"
 POL_proclaim_slavic_unity_desc: "Dengan seluruh wilayah Rusia dan Polandia di bawah kendali kami, kami siap mencapai apa yang belum pernah dicapai Tsar sebelum kami. Dengan persetujuan dan persetujuan Rusia dan Polandia, kita dapat memproklamirkan penyatuan bangsa Slavia."
 POL_niech_zyje_opor: "Kami adalah Polski Podziemnej"
 POL_niech_zyje_opor_desc: "Di seluruh Polandia ada bisikan pemberontakan dan kebebasan. Di gereja-gereja kita dan di bawah tanah, orang-orang Polandia yang berani dan patriotik berusaha memulihkan negara Polandia yang merdeka dan dengan provokasi dan peralatan yang tepat, kita mungkin melihat Warsawa membebaskan dirinya sendiri!"
 POL_niech_zyje_opor_no_mtg: "$POL_niech_zyje_opor$"
 POL_niech_zyje_opor_no_mtg_desc: "$POL_niech_zyje_opor_desc$"
 POL_morges_pact: "Pakta Morges"
 POL_morges_pact_desc: "Dengan pulihnya demokrasi di Polandia, ambisi Front Morges hampir tercapai. Yang tersisa hanyalah memperkuat hubungan kami dengan Perancis dan memulihkan aliansi Perancis-Polandia."
 POL_morges_economic_union: "Pakta Ekonomi Perancis-Polandia"
 POL_morges_economic_union_desc: "Dengan menguatnya hubungan antara Perancis dan Polandia, kita dapat memastikan adanya bantuan ekonomi timbal balik pada saat perang."
 POL_invite_romania_to_morges: "Undang Rumania ke Pakta"
 POL_invite_romania_to_morges_desc: "Aliansi Perancis-Polandia saja tidak cukup untuk menahan kekuatan penuh negara Poros. Kita harus memperluas aliansi antar lautan."
 POL_align_with_habsburgs: "Aliansi Habsburg"
 POL_align_with_habsburgs_desc: "Habsburg duduk di atas takhta Polandia dan Hongaria, mungkin sudah saatnya kita meresmikan ikatan kekeluargaan kita menjadi aliansi."
 POL_habsburg: "Habsburg"
 POL_habsburg_desc: "Karl Albrecht von Habsburg adalah seorang patriot Polandia dan untungnya dia adalah seorang bangsawan. Mungkin kita harus mengundang dia untuk naik takhta yang telah dia persiapkan sejak lahir."
 POL_habsburg_monarchist_militants: "Persenjatai Militan Habsburg"
 POL_habsburg_monarchist_militants_desc: "Ada orang-orang di Cekoslowakia yang merindukan kembalinya kekuasaan mutlak yang diwariskan secara turun-temurun atas kehidupan, dan yang perlu kita lakukan hanyalah memberi mereka senjata dan mereka akan mendukung perjuangan Habsburg dengan kekerasan!"
 POL_join_CZE_industry: "Bergabunglah dengan Industri Ceko"
 POL_join_CZE_industry_desc: "Industri di Bohemia dan Polandia tidak terhubung dan tidak kohesif, kita harus berupaya memperbaikinya agar dapat memanfaatkan negara kita yang sekarang bersatu."
 POL_join_CZE_military: "Bergabunglah dengan Militer Ceko"
 POL_join_CZE_military_desc: "Industri militer kita terpisah dan tidak memiliki tujuan yang sama, kita harus menilai dan mengintegrasikan kompleks industri Ceko ke dalam angkatan bersenjata Polandia."
 POL_join_CZE_rails: "Satukan Kereta Api"
 POL_join_CZE_rails_desc: "Melewati perbekalan melalui pegunungan Sudeten adalah urusan yang mahal dan tidak efisien. Kita harus bergabung dalam bidang-bidang utama perkeretaapian kita jika kita ingin mempertahankan keseluruhan negara baru kita."
 POL_king_of_bohemia: "Raja Bohemia"
 POL_king_of_bohemia_desc: "Sentimen monarki tinggi di Cekoslowakia; yang perlu kita lakukan hanyalah menuntut klaim kita atas takhta Bohemia dan pemerintah Ceko pasti akan menuruti tuntutan kita."
 POL_kings_guard: "Pengawal Raja"
 POL_kings_guard_desc: "Raja mempunyai ambisi kepemimpinan militer, dan siapakah yang lebih baik baginya untuk memimpin selain pengawal kerajaan pribadinya?"
 POL_press_the_habsburg_claim: "Tekan Klaim Habsburg"
 POL_press_the_habsburg_claim_desc: "Hongaria sudah terlalu lama tanpa Raja, dan Adipati Agung Otto von Habsburg masih belum memiliki takhta yang bisa disebut miliknya. Kita harus memaksakan klaim kerabat kita atas takhta dan mengamankan kekuasaan Habsburg di Eropa!"
 POL_reclaim_west_slavia: "Rebut kembali Slavia Barat"
 POL_reclaim_west_slavia_desc: "Orang Kashubian, Polabia, dan Sorbia juga merupakan orang-orang Slavia Barat, namun banyak dari mereka yang tetap berada di luar perbatasan kita dan di luar pengaruh kita. Jika kita ingin menjadi pelindung rakyat Slavia Barat, kita harus melindungi seluruh rakyat Slavia Barat."
 POL_restore_the_diet_of_galicia: "Kembalikan Diet Galicia"
 POL_restore_the_diet_of_galicia_desc: "Diet Galicia dan Lodomeria mewakili pemerintahan Habsburg atas Polandia, dan sekarang Habsburg duduk di atas takhta kita, tampaknya tepat jika diet tersebut dikembalikan ke Diet Polandia."
 POL_royal_hussars: "Institut Royal Hussars"
 POL_royal_hussars_desc: "Para prajurit berkuda bersayap adalah salah satu prajurit paling terkenal di Polandia, dan meskipun zaman pertarungan prajurit berkuda sudah lama berakhir, praktik pertarungan kavaleri masih tetap kuat di Polandia dan hanya memerlukan sedikit dukungan untuk membuat dunia iri."
 POL_royal_officer_corps: "Korps Perwira Kerajaan"
 POL_royal_officer_corps_desc: "Sebagai seorang Raja dan seorang jenderal, Karl Albrecht berdiri sebagai contoh cemerlang tentang bagaimana seharusnya seorang pria Polandia. Mungkin semua perwira kita harus dilatih seni perang seperti yang dilakukan Raja kita; di parit."
 POL_soldier_king: "Raja Prajurit"
 POL_soldier_king_desc: "Raja kami ingin sekali berperang demi negaranya di garis depan, namun sebagai penguasa kami, kami tidak bisa membiarkan dia ditempatkan dalam bahaya mematikan seperti itu. Mungkin dengan memberinya posisi sebagai marshal lapangan, dia bisa menjadi simbol pemersatu bangsa kita dalam krisis sambil memuaskan rasa laparnya akan pertempuran."
 POL_support_monarchy_in_CZE: "Mendukung Monarki di Cekoslowakia"
 POL_support_monarchy_in_CZE_desc: "Kekuasaan Habsburg atas Cekoslowakia dengan cepat memudar menjadi kenangan yang jauh, tapi sekarang dengan Habsburg di atas takhta kita dan identitas Polandia berdiri kuat, kita berada dalam posisi untuk mempromosikan identitas Slavia Barat dan menekan klaim Habsburg atas Bohemia."
 POL_trust_in_the_west: "Percaya pada Barat"
 POL_trust_in_the_west_desc: "Meskipun Habsburg di Austria berperang melawan kekuatan barat dalam Perang Besar, Polandia adalah teman Barat. Kita harus percaya bahwa sekutu kita di luar negeri akan terus membantu kita, seperti yang sering mereka lakukan di masa lalu."
 POL_unite_west_slavia: "Bersatu Dengan Bohemia"
 POL_unite_west_slavia_desc: "Dengan Raja kita bertahta di Polandia dan Bohemia, yang perlu kita lakukan hanyalah menyatukan administrasi internal Polandia dan Bohemia dan impian Slavia Barat akan tercapai."
 POL_restore_poland_hungary_tt: "Jika Hongaria setuju, mereka akan bergabung dengan §YPersonal Union§! dengan kami namun tetap independen secara nominal."
