 SOV_infrastructure_effort_nsb: "Upaya Infrastruktur"
 SOV_infrastructure_effort_nsb_desc: "$SOV_infrastructure_effort_desc$"
 SOV_heavy_industry: "Industri Berat"
 SOV_heavy_industry_desc: "Sementara proyek-proyek industrialisasi kita terus bertambah cepat, waktunya telah tiba untuk beralih ke penekanan yang lebih besar pada industri berat sebagai persiapan untuk memproduksi lebih banyak bahan perang."
 SOV_finish_the_five_year_plan: "[GetFinishTheFiveYearPlanName]"
 SOV_finish_the_five_year_plan_default: "Selesaikan Rencana Lima Tahun"
 SOV_finish_the_five_year_plan_alt: "Hapuskan Rencana Lima Tahun"
 SOV_finish_the_five_year_plan_desc: "[GetFinishTheFiveYearPlanDesc]"
 SOV_finish_the_five_year_plan_desc_default: "Rencana Lima Tahun kedua memprioritaskan pengembangan industri berat. Uni Soviet harus berkembang dengan cepat agar bisa menandingi kekuatan Kapitalis dan Fasis di Barat."
 SOV_finish_the_five_year_plan_desc_alt: "Rencana lima tahun rezim Soviet memprioritaskan industrialisasi intensif di negara tersebut dibandingkan dengan hal lainnya, hingga hal ini menjadi salah satu simbol terbesar penindasan Bolshevik. Kita harus memberantas proyek ini dan menyusun rencana nasional baru untuk industrialisasi."
 SOV_third_five_year_plan: "[GetThirdFiveYearPlanName]"
 SOV_third_five_year_plan_default: "Rencana Lima Tahun Ketiga"
 SOV_third_five_year_plan_alt: "Proyek Baru Industrialisasi Nasional"
 SOV_third_five_year_plan_desc: "[GetThirdFiveYearPlanDesc]"
 SOV_third_five_year_plan_desc_default: "Selama perdamaian masih ada, kita harus mendorong industrialisasi kita lebih jauh dan lebih cepat untuk memenuhi kebutuhan rakyat dan militer kita."
 SOV_third_five_year_plan_desc_alt: "Kita telah merancang program industrialisasi nasional yang memungkinkan kita meningkatkan produksi militer dan sipil dalam jangka panjang, tanpa perlu menindas penduduk atau membahayakan kebutuhan dasar mereka."
 SOV_reorganize_the_pc_of_heavy_industry: "[GetReorganizeThePcOfHeavyIndustryName]"
 SOV_reorganize_the_pc_of_heavy_industry_name_default: "Menata ulang PC Industri Berat"
 SOV_reorganize_the_pc_of_heavy_industry_name_alt: "Reorganisasi Kementerian Perindustrian"
 SOV_reorganize_the_pc_of_heavy_industry_desc: "Pergeseran kita sebelumnya ke arah industri berat telah menyebabkan beberapa inefisiensi dalam pemerintahan menjadi nyata. Kita harus memastikan bahwa orang-orang yang tepat ditempatkan di tempat yang tepat agar operasional dapat berjalan lancar kembali."
 SOV_industrial_modernization: "Modernisasi Industri"
 SOV_industrial_modernization_desc: "Negara-negara Barat dengan cepat menerapkan metode produksi baru dan memperkenalkan teknologi baru. Kita tidak bisa puas hanya dengan mengimbangi mereka – kita harus menyusul mereka!"
 SOV_increase_state_reserves: "Meningkatkan Cadangan Negara"
 SOV_increase_state_reserves_desc: "Industri kita yang sedang berkembang membutuhkan lebih banyak sumber daya. Kita tidak selalu dapat memastikan bahwa pertumbuhan produksi sumber daya tetap berjalan, dan kita harus membangun cadangan semampu kita."
 SOV_shift_to_armaments_production: "Peralihan ke Produksi Persenjataan"
 SOV_shift_to_armaments_production_desc: "Perang sedang terjadi. Kita tidak tahu siapa yang akan menyerang lebih dulu, tapi cepat atau lambat kita akan diserang. Kita harus mempersiapkannya sekarang, agar siap ketika saatnya tiba."
 SOV_optimize_production_lines: "Mengoptimalkan Jalur Produksi"
 SOV_optimize_production_lines_desc: "Negara-negara lain telah berhasil menerapkan \"Fordisme\" di pabrik mereka untuk memaksimalkan produksi. Kita harus belajar dari teladan mereka."
 SOV_steel_casting_industry: "Industri Pengecoran Baja"
 SOV_steel_casting_industry_desc: "Industri metalurgi kita telah menjadi yang terdepan dalam pertumbuhan industri kita, namun mereka dapat didorong lebih jauh lagi dengan penerapan metode produksi baru."
 SOV_synthetic_rubber: "Karet Sintetis"
 SOV_synthetic_rubber_desc: "Akan tiba saatnya kita tidak bisa lagi bergantung pada impor karet asing. Jika hari itu tiba, kita harus bersiap untuk memenuhi kebutuhan karet dengan produksi dalam negeri."
 SOV_oil_production: "Produksi Minyak"
 SOV_oil_production_desc: "Langkah logis berikutnya dalam pengembangan industri dan modernisasi militer kita adalah meningkatkan motorisasi. Hal ini akan membutuhkan persediaan pelumas dan bahan bakar dalam jumlah besar. Syukurlah, kita memiliki cadangan minyak yang cukup besar yang dapat digunakan jika kita mengembangkan industri yang diperlukan."
 SOV_restoration_and_development: "Restorasi dan Pembangunan"
 SOV_restoration_and_development_desc: "Kini setelah perang berakhir, kita dapat kembali mengembangkan industri kita dengan damai dan meningkatkan taraf hidup masyarakat kita."
 SOV_fourth_five_year_plan: "[GetFourthFiveYearPlanName]"
 SOV_fourth_five_year_plan_default: "Rencana Lima Tahun Keempat"
 SOV_fourth_five_year_plan_alt: "Awal yang Baru"
 SOV_fourth_five_year_plan_desc: "Masih memerlukan waktu sebelum gangguan akibat perang dapat diatasi sepenuhnya, namun dengan menetapkan tujuan yang tepat, kita sudah dapat memperoleh peningkatan produktivitas."
 SOV_found_the_comecon: "Menemukan COMECON"
 SOV_found_the_comecon_desc: "Perang telah menunjukkan bahwa kita perlu meningkatkan kerja sama dan pembangunan ekonomi teman dan mitra kita. Untuk mencapai tujuan tersebut, kami akan membentuk sebuah organisasi yang mengkoordinasikan perdagangan dan pembangunan ekonomi antar negara."
 SOV_found_the_warsaw_pact: "Menemukan Pakta Warsawa"
 SOV_found_the_warsaw_pact_desc: "Ketika angin perubahan bertiup di Eropa, semakin jelas bahwa kita memerlukan perjanjian pertahanan kolektif untuk mencegah agresi apa pun dari negara-negara barat yang dekaden. Untuk mencapai tujuan ini, kita harus meresmikan Organisasi Pakta Warsawa, yang merupakan pelengkap militer bagi COMECON."
 SOV_warsaw_pact_faction: "Pakta Warsawa"
 SOV_the_common_economic_space_initiative: "Inisiatif Ruang Ekonomi Bersama"
 SOV_the_common_economic_space_initiative_desc: "Menumbuhkan perekonomian kita akan lebih mudah jika kita memiliki akses ke pasar baru untuk barang-barang kita dan mendapatkan sumber daya yang dibutuhkan perekonomian kita dengan lebih sedikit hambatan perdagangan. Kita harus membentuk organisasi untuk mempromosikan hal ini."
 SOV_no_time_for_peace: "Tidak Ada Waktu Untuk Damai"
 SOV_no_time_for_peace_desc: "Betapapun besarnya harapan kita akan hal ini, hanya ada sedikit harapan bagi perdamaian abadi. Senjata dan teknologi baru akan membuat perang menjadi lebih dahsyat dibandingkan sebelumnya, dan, sayangnya, kita harus menginvestasikan sumber daya yang kita peroleh dengan susah payah untuk memastikan bahwa kita dapat mengimbangi musuh-musuh kita."
 SOV_national_specialists: "Spesialis Nasional"
 SOV_national_specialists_desc: "Pembangunan ekonomi kita terutama harus didorong oleh orang-orang yang akrab dengan negara kita. Orang asing akan membutuhkan waktu lama untuk mendapatkan pengetahuan tersebut, dan, mungkin lebih buruk lagi, akan membawanya ketika mereka meninggalkan negara tersebut."
 SOV_foreign_experts: "Pakar Asing"
 SOV_foreign_experts_desc: "Ada banyak pakar asing yang bisa mengajari kita banyak hal tentang bagaimana meningkatkan perekonomian kita. Untungnya, banyak dari mereka adalah kapitalis dan karena itu bisa dibeli."
 SOV_eastern_development: "Pembangunan Timur"
 SOV_eastern_development_desc: "Wilayah Timur Jauh di luar pegunungan Ural menawarkan sumber daya yang luas dan belum dimanfaatkan serta wilayah yang luas untuk pengembangan industri. Kita harus memastikan bahwa mereka siap untuk menjalankan proyek-proyek yang lebih besar."
 SOV_develop_the_urals: "Kembangkan Ural"
 SOV_develop_the_urals_desc: "Ancaman terbesar terhadap bangsa kita mungkin akan datang dari negara di Eropa. Dengan mengembangkan wilayah di luar pegunungan Ural, kita akan menciptakan cadangan kapasitas industri yang bahkan sulit dijangkau oleh pembom jarak jauh sekalipun."
 SOV_the_ussr_academy_of_sciences: "[GetTheUssrAcademyOfSciencesName]"
 SOV_the_ussr_academy_of_sciences_default: "Akademi Ilmu Pengetahuan Uni Soviet"
 SOV_the_ussr_academy_of_sciences_alt: "Akademi Ilmu Pengetahuan Kekaisaran"
 SOV_the_ussr_academy_of_sciences_desc: "Untuk tetap kompetitif dalam bidang ilmu terapan, kita juga harus menjadi yang terdepan dalam ilmu-ilmu teoretis. Kita sudah memiliki akademi ilmu pengetahuan yang mapan, namun dengan tambahan dana, hal ini akan memberi kita infrastruktur penelitian yang benar-benar berkelas dunia."
 SOV_national_academies_of_sciences: "Akademi Ilmu Pengetahuan Nasional"
 SOV_national_academies_of_sciences_desc: "Dengan meniru Akademi Ilmu Pengetahuan kita sendiri, negara-negara mitra kita juga harus didorong untuk mendirikan lembaga serupa guna meningkatkan kemampuan penelitian mereka sendiri."
 SOV_transformation_of_nature: "Transformasi Alam"
 SOV_transformation_of_nature_desc: "Dengan komunitas ilmiah kita yang melampaui apa yang sebelumnya dianggap mungkin, bahkan proyek terbesar dan paling invasif pun menjadi mungkin dilakukan."
 SOV_transformation_of_nature_alt: "$SOV_transformation_of_nature$"
 SOV_transformation_of_nature_alt_desc: "$SOV_transformation_of_nature_desc$"
 SOV_expand_the_aircraft_industry: "Memperluas Industri Pesawat Terbang"
 SOV_expand_the_aircraft_industry_desc: "Dalam perang yang akan datang, angkatan udara kita harus mengamankan langit dari musuh yang dilengkapi dengan peralatan paling modern. Kita harus memastikan bahwa mereka tidak hanya memiliki pesawat yang sebanding, tetapi juga memiliki jumlah pesawat yang cukup."
 SOV_modernize_aircraft_facilities: "Modernisasi Fasilitas Pesawat"
 SOV_modernize_aircraft_facilities_desc: "Pesawat terbaik di dunia akan segera menjadi tidak berguna jika harus lepas landas dari landasan pacu yang bergelombang dan dirawat di gudang yang bocor. Untuk memastikan kinerja terbaik, kita juga harus memiliki infrastruktur terbaik."
 SOV_modernize_aircraft_facilities_tt: "Jika tidak ada §YFasilitas Eksperimental§! lainnya di §Y[260.GetName]§!, kita akan mendapatkan §G1§! §YFasilitas Aerodinamika dan Avionik§! di §Y[260.GetName]§!."
 SOV_merge_aircraft_plants: "Gabungkan Pabrik Pesawat"
 SOV_merge_aircraft_plants_desc: "Meskipun persaingan antar desainer menciptakan insentif alami untuk terus berkembang, hal ini juga menguras sumber daya untuk upaya duplikat yang tidak mampu kita lakukan. Kita harus menggabungkan biro desain kita untuk menghilangkan pemborosan ini."
 SOV_found_the_jet_institute: "Menemukan Institut Jet"
 SOV_found_the_jet_institute_desc: "Mesin piston saat ini hanya bisa dipacu sejauh ini. Pesawat masa depan harus bergantung pada metode propulsi baru. Kita harus mendirikan sebuah lembaga untuk melakukan penelitian terhadap mesin jet untuk memastikan bahwa kita tidak akan dikalahkan oleh perkembangan asing."
 SOV_increase_aircraft_production: "Meningkatkan Produksi Pesawat Terbang"
 SOV_increase_aircraft_production_desc: "Akhir-akhir ini terdapat penekanan yang berlebihan pada keselamatan, yang mulai berdampak negatif pada jumlah produksi pesawat baru. Kita dapat menghemat sejumlah besar sumber daya dengan menghilangkan sistem keselamatan yang paling berlebihan, sambil tetap mempertahankan angkatan udara yang sangat aman dan mumpuni."
 SOV_foster_flying_clubs: "Klub Terbang Asuh"
 SOV_foster_flying_clubs_desc: "Pilot baru membutuhkan biaya pelatihan yang mahal jika mereka belum pernah melihat pesawat sebelum memulai pelatihan. Namun banyak anak muda yang tertarik dengan dunia penerbangan, dan dengan dukungan tertentu, mereka dapat tumbuh menjadi pilot yang sangat cakap dan dapat memahami poin-poin penting dalam pertempuran udara dengan sangat cepat jika mereka sudah mengetahui dasar-dasar mengemudikan pesawat."
 SOV_women_in_aviation: "Wanita dalam Penerbangan"
 SOV_women_in_aviation_desc: "Dulu, elemen masyarakat yang terbelakang menyatakan terbang sebagai bidangnya laki-laki. Namun, perempuan di seluruh dunia mengabaikan hal ini dan menunjukkan bahwa mereka sama baiknya dengan rekan laki-laki mereka. Kita harus mendorong perempuan kita untuk mencoba terbang, untuk memilih pilot yang paling cakap di antara mereka."
 SOV_raskovas_aviation_group: "[GetRaskovasAviationGroupName]"
 SOV_raskovas_aviation_group_default: "Grup Penerbangan Raskova"
 SOV_raskovas_aviation_group_alt: "Grup Penerbangan Kekaisaran yang Seluruhnya Wanita Pertama"
 SOV_raskovas_aviation_group_desc: "[GetRaskovasAviationGroupDesc]"
 SOV_raskovas_aviation_group_desc_default: "Marina Raskova telah membuktikan dirinya sebagai navigator dan pilot yang sangat cakap. Dengan sumber daya yang terbatas dalam perang saat ini, kami tidak bisa membiarkan seseorang yang berpengalaman seperti dia duduk di pinggir lapangan. Kita harus memberinya sumber daya untuk meningkatkan sejumlah unit penerbangan guna mendukung perjuangan."
 SOV_raskovas_aviation_group_desc_alt: "Kita mempunyai navigator dan pilot wanita yang sangat cakap. Dengan sumber daya yang terbatas dalam perang saat ini, kita tidak bisa membiarkan orang-orang berpengalaman seperti itu hanya duduk diam. Kita harus meningkatkan sejumlah unit penerbangan yang semuanya perempuan untuk mendukung perjuangan."
 SOV_intensify_pilot_training_program: "Mengintensifkan Program Pelatihan Percontohan"
 SOV_intensify_pilot_training_program_desc: "Agar berdaya saing, Angkatan Udara kita harus mampu terbang dan berperang dalam segala keadaan. Cara terbaik untuk mencapai hal ini adalah dengan melatih pilot kami dengan standar tertinggi. Apa yang mungkin kurang dalam jumlah atau kecanggihan teknis akan kami penuhi dengan keterampilan belaka."
 SOV_expand_aviation_institutes: "Perluas Institut Penerbangan"
 SOV_expand_aviation_institutes_desc: "Hambatan terbesar dalam meningkatkan jumlah angkatan udara kita adalah kapasitas pelatihan pilot. Dengan memperluas sekolah pilot, kita akan meletakkan dasar bagi angkatan udara yang lebih besar dan lebih kompeten."
 SOV_ground_support: "Dukungan Darat"
 SOV_ground_support_desc: "Misi utama angkatan udara kita haruslah mendukung angkatan darat kita. Fakta mendasar ini harus menjadi dasar setiap keputusan yang diambil."
 SOV_long_range_aircraft: "Pesawat Jarak Jauh"
 SOV_long_range_aircraft_desc: "Teknologi telah maju ke titik di mana pesawat pengebom kita dapat mencapai setiap titik di wilayah musuh dan dapat menghancurkan kemampuan mereka untuk berperang dalam waktu singkat. Tentara ada terutama untuk mempertahankan garis sampai hal ini tercapai."
 SOV_the_modern_war_in_the_skies: "Perang Modern di Langit"
 SOV_the_modern_war_in_the_skies_desc: "Perang Udara telah berkembang pesat sejak zaman biplan yang berduel di parit. Saat ini, bersifat industri, dengan kecepatan operasional yang tinggi untuk menjaga tekanan pada musuh sepanjang waktu. Kita harus mengakui fakta ini dan membuat rencana yang sesuai."
 SOV_expand_the_red_fleet: "Perluas Armada [GetSovietArmyAdjectiveBasedOnIdeology]"
 SOV_expand_the_red_fleet_desc: "[GetExpandTheRedFleetDesc]"
 SOV_expand_the_red_fleet_desc_default: "$SOV_expand_red_fleet_desc$"
 SOV_expand_the_red_fleet_desc_alt: "Armada [GetSovietArmyAdjectiveBasedOnIdeology] sangat lemah dibandingkan angkatan laut negara-negara besar lainnya. Kita harus menjadikan perluasannya sebagai prioritas nasional!"
 SOV_reinforce_western_naval_bases: "Perkuat Pangkalan Angkatan Laut Barat"
 SOV_reinforce_western_naval_bases_desc: "Armada Baltik sangat terekspos di pangkalannya. Kita harus menginvestasikan sejumlah sumber daya untuk melindungi pelabuhannya dan meningkatkan kapasitas perbaikannya."
 SOV_reinforce_northern_naval_bases: "Perkuat Pangkalan Angkatan Laut Utara"
 SOV_reinforce_northern_naval_bases_desc: "Meskipun terletak di utara lingkaran Arktik, ironisnya Murmansk adalah satu-satunya pelabuhan kami yang tetap bebas es sepanjang tahun dan memiliki akses ke lautan terbuka. Kita harus mengembangkannya lebih lanjut untuk memungkinkan akses yang lebih baik ke seluruh dunia."
 SOV_reinforce_southern_naval_bases: "Perkuat Pangkalan Angkatan Laut Selatan"
 SOV_reinforce_southern_naval_bases_desc: "Laut Hitam mungkin terlihat seperti teater sekunder. Namun jika kita kehilangan kendali atas wilayah tersebut, kita akan membuka seluruh wilayah selatan kita terhadap invasi musuh, seperti yang terjadi pada Perang Krimea. Kita tidak boleh membiarkan hal ini terjadi lagi, dan kita harus memperkuat pangkalan angkatan laut di wilayah tersebut."
 SOV_reinforce_eastern_naval_bases: "Perkuat Pangkalan Angkatan Laut Timur"
 SOV_reinforce_eastern_naval_bases_desc: "Bahkan setelah penghinaan pada tahun 1905, Jepang tidak berhenti membuat keributan tentang perambahan wilayah kami. Kita harus siap berperang melawan mereka, dan itu berarti memperkuat pangkalan angkatan laut kita di wilayah tersebut."
 SOV_expand_shipbuilding_plants: "Perluas Pabrik Pembuatan Kapal"
 SOV_expand_shipbuilding_plants_desc: "Geografi kami memaksa kami untuk memiliki galangan kapal yang tersebar luas untuk mendukung berbagai armada kami. Oleh karena itu, segala upaya untuk meningkatkan kapasitas pembuatan kapal harus disebarluaskan."
 SOV_merge_naval_plants: "Gabungkan Pabrik Angkatan Laut"
 SOV_merge_naval_plants_desc: "Konstruksi angkatan laut dan desain kapal adalah proses yang memakan waktu, sehingga persaingan yang berlebihan menjadi tidak efisien. Kita harus menggabungkan biro desain kita untuk menghilangkan upaya yang sia-sia ini."
 SOV_pc_of_the_ussr_navy: "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_ussr_navy_default: "PC Angkatan Laut Uni Soviet"
 SOV_pc_of_the_ussr_navy_alt: "Kementerian Angkatan Laut Rusia"
 SOV_pc_of_the_ussr_navy_desc: "Dengan Angkatan Laut kita yang menjadi lebih modern dan lebih mampu, sekarang saatnya untuk mengenalinya sebagai kekuatan tempur yang setara dengan Angkatan Darat dalam hal pentingnya. Langkah pertama adalah mengizinkan Angkatan Laut untuk membentuk pemerintahan yang terpisah dari Angkatan Darat."
 SOV_surface_warfare: "Peperangan Permukaan"
 SOV_surface_warfare_desc: "Kapal besar memerlukan investasi waktu dan sumber daya yang besar, dan sering kali menjadi usang bahkan sebelum selesai dibangun. Kapal yang lebih kecil dapat dibangun lebih cepat dan akibatnya dapat mengikuti perkembangan teknologi dengan lebih mudah. Kita harus fokus pada pengembangan kekuatan ringan sebagai senjata utama peperangan laut."
 SOV_submarine_warfare: "Perang Kapal Selam"
 SOV_submarine_warfare_desc: "Kapal selam menawarkan keuntungan signifikan dalam pertempuran laut. Kapal selam modern yang dirancang dengan baik praktis tidak dapat terdeteksi sebelum menembakkan torpedonya, sehingga berpotensi melumpuhkan kapal besar yang ukuran dan biayanya berkali-kali lipat. Kita harus fokus mengembangkan kapal-kapal ini sebagai kekuatan ofensif utama angkatan laut kita."
 SOV_offensive_maritime_strategy: "Strategi Maritim Ofensif"
 SOV_offensive_maritime_strategy_desc: "Kita tidak bisa berdiam diri dan menunggu musuh datang kepada kita. Kita harus mengambil inisiatif dan menyerang musuh dimanapun kita bisa."
 SOV_an_oceangoing_navy: "Angkatan Laut Samudera"
 SOV_an_oceangoing_navy_desc: "$SOV_ocean_going_navy_desc$"
 SOV_mine_warfare: "Perang Tambang"
 SOV_mine_warfare_desc: "Tidaklah ekonomis mencoba mempertahankan seluruh garis pantai kita dengan kapal. Dengan meletakkan ladang ranjau di lokasi-lokasi strategis, kita dapat menghalangi atau setidaknya merusak armada musuh yang mencoba mendekati pantai kita."
 SOV_long_range_raiders: "Perampok Jarak Jauh"
 SOV_long_range_raiders_desc: "Dengan jarak dari pangkalan angkatan laut kita ke jalur pelayaran utama, kapal selam kita saat ini akan kesulitan mencapai tempat perburuan yang kaya. Kita harus mengembangkan kapal selam dengan jangkauan lebih jauh untuk memastikan kita dapat menyerang musuh di tempat yang paling menyakitkan."
 SOV_advanced_maneuvers: "Manuver Tingkat Lanjut"
 SOV_advanced_maneuvers_desc: "Memiliki kapal yang besar dan modern tidak ada gunanya jika awak kapalnya tidak tahu cara menggunakannya. Kita harus melakukan latihan angkatan laut secara teratur dan berskala besar untuk melatih awak dan perwira kita dalam peperangan laut modern."
 SOV_expand_the_morskaya_aviatsiya: "Perluas Morskaya Aviatsiya"
 SOV_expand_the_morskaya_aviatsiya_desc: "Pesawat terbang telah mengubah sifat perang darat secara dramatis. Di masa depan, mereka akan menimbulkan bahaya yang signifikan bahkan bagi kapal permukaan paling modern sekalipun. Kita harus memastikan bahwa kita akan selalu memiliki armada penerbangan angkatan laut yang modern untuk mendukung kapal-kapal kita yang lain."
 SOV_naval_infantry: "Infanteri Angkatan Laut"
 SOV_naval_infantry_desc: "[GetNavalInfantryDesc]"
 SOV_naval_infantry_desc_default: "Meskipun kita tidak mempunyai niat untuk menyerang pantai musuh dalam upaya imperialistik, kekuatan infanteri angkatan laut yang berdedikasi bisa sangat berguna untuk menyerang instalasi pantai musuh dan mengancam garis pantai musuh."
 SOV_naval_infantry_desc_alt: "Jika kita ingin memperluas perbatasan kita, kekuatan infanteri angkatan laut yang berdedikasi akan sangat berguna untuk menyerang instalasi pantai musuh, mengancam garis pantai musuh dan mendukung kekuatan invasi utama."
 SOV_found_the_pcdi: "[GetFoundThePcdiName]"
 SOV_found_the_pcdi_name_default: "Menemukan PCDI"
 SOV_found_the_pcdi_name_alt: "Menemukan Kementerian Industri Pertahanan"
 SOV_found_the_pcdi_desc: "[GetFoundThePcdiDesc]"
 SOV_found_the_pcdi_desc_default: "Industri Persenjataan kita telah berkembang sangat besar, dan sekarang memerlukan kantor pemerintah khusus untuk berkoordinasi jika ingin berkembang lebih jauh lagi. Kita akan membentuk Komisariat Rakyat Industri Pertahanan."
 SOV_found_the_pcdi_desc_alt: "Industri Persenjataan kita telah berkembang sangat besar, dan sekarang memerlukan kantor pemerintah khusus untuk berkoordinasi jika ingin berkembang lebih jauh lagi. Kami akan membentuk Kementerian Industri Pertahanan."
 SOV_pc_of_mechanical_engineering: "[GetPcOfMechanicalEngineeringName]"
 SOV_pc_of_mechanical_engineering_name_default: "PC Teknik Mesin"
 SOV_pc_of_mechanical_engineering_name_alt: "Kementerian Teknik Mesin"
 SOV_pc_of_mechanical_engineering_desc: "Industri kita telah mampu menciptakan peralatan mesin dan mesin berat lainnya yang semakin besar dan kompleks, sehingga dibenarkan untuk membentuk badan pemerintah tersendiri untuk mengoordinasikan proyek-proyek ini."
 SOV_superior_war_machines: "Mesin Perang Unggul"
 SOV_superior_war_machines_desc: "Tank dan kendaraan lapis baja telah berkembang secara signifikan selama dekade terakhir. Dengan industri persenjataan yang besar untuk memproduksi dan memasoknya, kita dapat menciptakan kendaraan yang unggul dan menggunakannya secara massal untuk melawan musuh."
 SOV_the_means_to_wage_war: "Sarana untuk Melancarkan Perang"
 SOV_the_means_to_wage_war_desc: "Meskipun pesawat terbang, senjata, dan tank di ketentaraan sering kali menarik perhatian tertinggi dan terlihat paling bagus di parade, prajurit biasa lebih peduli dengan kualitas senapannya dan kenyamanan sepatu botnya. Kita harus mengakui bahwa hal-hal ini setidaknya sama pentingnya dalam melancarkan perang seperti halnya pesawat tempur atau howitzer berat."
 SOV_development_of_tankograd: "Pengembangan Tankograd"
 SOV_development_of_tankograd_desc: "Negara kita terbentang sangat jauh, sehingga pengiriman sub-komponen dari pabrik ke pabrik menjadi tidak praktis. Kita sebaiknya mengintegrasikan pabrik tank kita secara vertikal - baja masuk di satu sisi, tank jadi keluar di sisi lain."
 SOV_pc_of_mortar_armament: "[GetPcOfMortarArmamentName]"
 SOV_pc_of_mortar_armament_name_default: "PC Persenjataan Mortir"
 SOV_pc_of_mortar_armament_name_alt: "Kementerian Persenjataan Mortir"
 SOV_pc_of_mortar_armament_desc: "Mortir sederhana dengan cepat menjadi bentuk utama dukungan tembakan tidak langsung untuk unit kami. Oleh karena itu, kita harus berusaha keras untuk memproduksi mortir dalam berbagai ukuran sebanyak mungkin, dan membentuk lembaga pemerintah yang tujuannya hanya untuk melakukan hal tersebut."
 SOV_soviet_artillery: "[ROOT.GetAdjective] Artileri"
 SOV_soviet_artillery_tech_bonus_name_default: "Artileri Soviet"
 SOV_soviet_artillery_tech_bonus_name_alt: "Artileri Rusia"
 SOV_soviet_artillery_desc: "Peperangan masa kini dimenangkan melalui penerapan senjata secara ilmiah di tempat yang tepat. Kami akan memfokuskan upaya kami untuk mengembangkan tidak hanya senjata yang lebih baik, tetapi juga bagaimana menggunakannya seefektif mungkin."
 SOV_merge_tank_and_materiel_plants: "Gabungkan Pabrik Tangki dan Materiel"
 SOV_merge_tank_and_materiel_plants_desc: "Tank dan artileri mungkin paling cocok untuk produksi massal, dengan memanfaatkan skala ekonomi. Oleh karena itu, kita harus memaksa konsolidasi produsen tangki dan material untuk memanfaatkan hal ini."
 SOV_strengthen_the_mobilization_plan: "Memperkuat Rencana Mobilisasi"
 SOV_strengthen_the_mobilization_plan_desc: "Keuntungan militer terbesar kita adalah luasnya negara kita dan jumlah penduduk yang tinggal di dalamnya. Namun dalam hal menempatkan prajurit di garis depan, kedua hal ini bisa saling bertentangan. Kita harus terus meningkatkan dan memperbarui rencana mobilisasi kita untuk memastikan bahwa jika terjadi perang, kita dapat memusatkan kekuatan kita dengan cepat."
 SOV_military_engineering_university: "Universitas Teknik Militer"
 SOV_military_engineering_university_desc: "Meskipun banyak yang memproklamirkan berakhirnya perang parit setelah pengembangan tank dan pesawat terbang, jelas bahwa teknik militer masih mendapat tempat di medan perang modern. Kita harus membentuk sebuah lembaga untuk mempelajari metode modern dalam membangun benteng pertahanan modern."
 SOV_leningrad_polytechnical_institute: "[195.GetName] Institut Politeknik"
 SOV_leningrad_polytechnical_institute_desc: "Sebagai sekolah teknik terkemuka kami, Institut Politeknik [195.GetName] telah lama membekali negara kami dengan para insinyur dan perancang industri. Kita harus memperluasnya lebih lanjut untuk memastikan bahwa kita akan selalu memiliki orang-orang terbaik yang tersedia untuk mengisi posisi baru di industri kita yang sedang berkembang."
 SOV_soviet_atomic_bomb_project: "[ROOT.GetAdjective] Proyek Bom Atom"
 SOV_soviet_atomic_bomb_project_desc: "Kita tahu bahwa para ilmuwan di negara lain sedang bekerja keras mengembangkan metode untuk mengubah kekuatan paling mendasar di alam semesta menjadi senjata baru. Meskipun kita tertinggal, kita dapat menggunakan upaya mereka untuk memajukan upaya kita, dan memastikan keseimbangan kehancuran tetap ada."
 SOV_soviet_atomic_bomb_project_tt: "Jika tidak ada §YFasilitas Eksperimen§! lainnya di §Y[588.GetName]§!, kami akan mendapatkan §G1§! §YFasilitas Penelitian Nuklir§! di §Y[588.GetName]§!."
 SOV_move_industry_to_the_urals: "Pindahkan Industri ke Ural"
 SOV_move_industry_to_the_urals_desc: "Perang telah menimpa kita, dan tanah air terancam. Meskipun pasukan kami akan berjuang sampai titik terakhir tanpa memberikan perlawanan, kami tidak dapat memastikan bahwa ini akan cukup, mengingat kekuatan yang dikerahkan untuk melawan kami. Kita harus mengevakuasi pabrik ke tempat yang aman sebelum diserbu."
 SOV_the_road_of_life: "Jalan Kehidupan"
 SOV_the_road_of_life_desc: "Ketika beberapa kota kita terancam dan dikepung, kita harus fokus untuk memberikan dukungan yang dibutuhkan pasukan tempur di tempat-tempat tersebut, berapa pun risikonya."
 SOV_improve_the_stalin_line: "[GetImproveTheStalinLineName]"
 SOV_improve_the_stalin_line_name_default: "Perbaiki Garis Stalin"
 SOV_improve_the_stalin_line_name_alt: "Perkuat Garis Pertahanan Barat"
 SOV_improve_the_stalin_line_desc: "Perbatasan barat kita terlalu panjang untuk dibentengi secara keseluruhan. Namun kita dapat membangun serangkaian benteng yang menyalurkan serangan musuh ke wilayah yang dapat diprediksi, sehingga kita dapat dengan mudah melakukan serangan balik dengan kekuatan besar."
 SOV_the_molotov_line: "[GetTheMolotovLineName]"
 SOV_the_molotov_line_name_default: "Garis Molotov"
 SOV_the_molotov_line_name_left: "Garis Trotsky"
 SOV_the_molotov_line_name_right: "Garis Bukharin"
 SOV_the_molotov_line_name_exiles: "Garis Tsar"
 SOV_the_molotov_line_desc: "Perubahan baru-baru ini pada geografi politik Eropa telah memindahkan perbatasan barat kita sedikit lebih jauh ke barat. Rencana benteng lama apa pun sudah ketinggalan zaman. Kita harus membuat garis baru di sepanjang perbatasan baru kita untuk memperlambat serangan musuh sampai kita dapat memobilisasi pasukan kita untuk melakukan serangan balik."
 SOV_the_defense_of_moscow: "Pertahanan Moskow"
 SOV_the_defense_of_moscow_desc: "Musuh berdiri di gerbang Moskow. Di sinilah tempat kita mengambil sikap dan melemparkan mereka ke dalam kemunduran dan kekalahan, seperti yang kita lakukan pada Napoleon!"
 SOV_impregnable_forts: "Benteng yang Tak Tertembus"
 SOV_impregnable_forts_desc: "Teknik [ROOT.GetAdjective] kini mampu menciptakan benteng yang benar-benar menakutkan, mampu bertahan bahkan dari pemboman terberat sekalipun, dan hampir mustahil untuk dilawan. Dengan persediaan amunisi dan perbekalan yang banyak, benteng ini akan bertahan dari serangan musuh selama bertahun-tahun, jika diperlukan."
 SOV_protect_the_white_sea_baltic_canal: "Lindungi Laut Putih - Terusan Baltik"
 SOV_protect_the_white_sea_baltic_canal_desc: "Terusan antara Laut Baltik dan Laut Putih merupakan keajaiban teknik modern dan tidak boleh dibiarkan jatuh ke tangan musuh."
 SOV_far_east_fortification: "Benteng Timur Jauh"
 SOV_far_east_fortification_desc: "Sejak perang dengan Jepang pada tahun 1905, kita terus memperhatikan wilayah ini. Bukan rahasia lagi bahwa unsur-unsur militer Jepang memandang wilayah timur jauh kita dengan keserakahan tanpa rasa malu. Kita harus bersiap menghadapi konfrontasi di wilayah tersebut, dan harus mengambil langkah-langkah untuk memperlambat serangan musuh guna mendapatkan waktu untuk mengerahkan pasukan dari Rusia barat ke wilayah tersebut."
 SOV_restore_cossack_units: "Pulihkan Unit Cossack"
 SOV_restore_cossack_units_desc: "Pada saat dibutuhkan, ibu pertiwi tidak menanyakan secara detail siapa yang mau mengabdi untuk mempertahankannya. Siapa pun yang bersedia mengangkat senjata melawan penjajah dipersilakan, dan akan dipekerjakan sesuai kemampuan terbaiknya."
 SOV_cohesion_first: "Kohesi Pertama"
 SOV_cohesion_first_desc: "Hal terakhir yang kita perlukan dalam situasi ini adalah menurunkan standar kita. Siapa pun yang ingin bertugas di militer dipersilakan - tetapi mereka akan bertugas di unit yang ada, dan dilatih sesuai standar militer yang tepat."
 SOV_rehabilitated_military: "Militer yang Direhabilitasi"
 SOV_rehabilitated_military_desc: "[GetRehabilitatedMilitaryName]"
 SOV_rehabilitated_military_desc_default: "Jelas sekarang bahwa pengawasan ketat yang kami lakukan terhadap militer mungkin sedikit berlebihan. Meskipun hal ini dapat dibenarkan di masa damai, selama perang kita harus membiarkan para profesional membuat penilaian berdasarkan situasi militer, bukan berdasarkan pertimbangan politik. Sudah waktunya untuk sedikit mengekang para pejabat politik dan memberi para komandan lebih banyak keleluasaan dalam menjalankan segala sesuatunya."
 SOV_rehabilitated_military_desc_alt: "Kaum Bolshevik sangat ketat mengawasi militer, dan apa gunanya militer bagi mereka? Walaupun kita harus menjaga sosok perwira politik untuk menjamin pemberantasan pemikiran-pemikiran bernuansa komunis, pada masa perang kita harus membiarkan perwira militer mengambil keputusan berdasarkan situasi militer, bukan berdasarkan pertimbangan politik."
 SOV_military_reorganization: "Reorganisasi Militer"
 SOV_military_reorganization_desc: "Upaya kami untuk membangun pasukan mekanis dalam jumlah besar adalah hal yang mulia, tetapi lebih dari yang kami mampu. Untuk memenangkan perang ini, kita harus fokus pada senjata yang telah membawa tentara Rusia meraih kemenangan selama berabad-abad: Infanteri dan Artileri. Hal ini mengharuskan kita untuk mengganggu formasi yang ada sampai tingkat tertentu."
 SOV_desperate_measures: "Tindakan Putus Asa"
 SOV_desperate_measures_desc: "Dalam situasi yang menyedihkan ini, kita harus mengambil tindakan yang sebelumnya kita anggap mustahil. Apa pun yang dapat dilakukan untuk membendung invasi harus dilakukan."
 SOV_an_adaptable_army: "Tentara yang Dapat Beradaptasi"
 SOV_an_adaptable_army_desc: "Perang ini terjadi di beberapa zona iklim dan berbagai medan. Kita harus mampu berperang di segala medan dan cuaca apapun jika kita ingin memenangkan perang ini."
 SOV_lessons_of_war: "Pelajaran Perang"
 SOV_lessons_of_war_desc: "Apapun rencana yang kita miliki sebelum perang, sebagian besar tidak bertahan dari kontak dengan musuh. Kita harus terbuka terhadap pelajaran yang diberikan perang ini kepada kita, dan tidak berpegang pada dogma yang sudah ketinggalan zaman. Hanya dengan begitu kita dapat menghentikan kemunduran kita dan mulai kembali menyerang."
 SOV_penal_battalions: "Batalyon Pidana"
 SOV_penal_battalions_desc: "Selama retret tersebut, banyak prajurit yang mampu mempermalukan diri mereka sendiri dengan mundur sebelum posisi mereka hilang, atau dengan melakukan tindakan yang bertentangan dengan kelakuan baik tentara kita. Namun dalam situasi ini, hanya dengan memenjarakan atau mengeksekusi mereka akan membuat kita kehilangan pejuang yang sangat cakap. Kita harus membentuk unit khusus di mana orang-orang ini dapat menebus kesalahan mereka melalui pertempuran."
 SOV_organization_of_the_partisans: "Organisasi Partisan"
 SOV_organization_of_the_partisans_desc: "Setelah diserbu, banyak tentara yang tertinggal di belakang garis musuh memilih untuk melanjutkan pertarungan daripada mempermalukan mereka di penawanan. Bersama dengan para petani dan pekerja di wilayah-wilayah pendudukan, mereka melanjutkan perjuangan melawan penjajah. Kita harus mengirimi mereka dukungan agar mereka dapat melumpuhkan lebih banyak unit musuh."
 SOV_smersh: "SMERSH"
 SOV_smersh_desc: "Kita harus menjelaskan kepada setiap warga negara bahwa mata-mata dan agen musuh ada di mana-mana, dan bahwa pembicaraan kosong apa pun dapat memberikan musuh informasi penting yang memberi mereka keuntungan."
 SOV_barrier_troops: "Pasukan Penghalang"
 SOV_barrier_troops_desc: "Pertempuran seringkali kacau, dan dapat dimengerti jika terkadang tentara kehilangan kontak dengan markas yang lebih tinggi. Kita harus membentuk unit-unit jauh di belakang garis depan yang mengumpulkan orang-orang yang tersesat ini dan mengarahkan mereka kembali ke medan pertempuran – dan menangkap siapa pun yang mengkhianati rekan-rekan mereka dengan mencoba menghindari tugas mereka."
 SOV_experts_in_camouflage: "Ahli dalam Kamuflase"
 SOV_experts_in_camouflage_desc: "Untuk mencapai dan mempertahankan elemen kejutan, kita harus benar-benar memastikan bahwa musuh tidak mengetahui posisi atau pergerakan pasukan kita sampai semuanya terlambat. Setiap prajurit harus dilatih seni kamuflase."
 SOV_keep_commissars_organization: "Pertahankan Organisasi Komisaris"
 SOV_keep_commissars_organization_desc: "Bahkan di organisasi baru kami, ada kebutuhan bagi masyarakat untuk memastikan bahwa tentara tetap setia kepada pemerintah. Jika tentara kehilangan kepercayaan pada pemerintah, kita akan kalah dalam perang ini dan kita akan kalah dengan cepat."
 SOV_adjoined_battle_priests: "Pendeta Pertempuran yang Berdampingan"
 SOV_adjoined_battle_priests_desc: "Dengan kekuatan dan pengaruhnya yang semakin meningkat di negara ini, mungkin sudah tiba waktunya untuk mengizinkan Gereja terlibat dalam urusan militer. Dengan mengambil peran sebagai Battle Priest dalam unit militer kita, para pendeta akan memastikan bahwa pasukan mengetahui bahwa Tuhan ada di pihak kita, yang berpotensi meningkatkan moral dan membuat prajurit biasa berjuang lebih keras demi negara mereka."
 SOV_swap_to_political_advisors: "Penasihat Politik Militer"
 SOV_swap_to_political_advisors_desc: "Perang kita bukan sekadar pertarungan antar negara mengenai sumber daya. ini adalah kontes sistem politik. Meskipun kita tidak boleh membiarkan pertimbangan politik mendikte keputusan militer, kita tetap harus memastikan bahwa pertimbangan politik tersebut diperhitungkan ketika keputusan diambil."
 SOV_the_glory_of_the_red_army: "Kemuliaan Tentara [GetSovietArmyAdjectiveBasedOnIdeology]"
 SOV_the_glory_of_the_red_army_desc: "Kami telah berhasil bertahan melawan serangan musuh. Sekaranglah waktunya untuk menyerang, dan membawa perang kembali ke titik asalnya!"
 SOV_the_glory_of_the_red_army_alt: "$SOV_the_glory_of_the_red_army$"
 SOV_the_glory_of_the_red_army_alt_desc: "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_path_of_marxism_leninism: "Jalan Marxisme Leninisme"
 SOV_the_path_of_marxism_leninism_desc: "Ajaran sempurna Marx, Engels, dan Lenin telah mengangkat bangsa kita dari keterbelakangan terdalam menuju kesetaraan teknologi dan industri. Mengubah arah sekarang adalah tindakan yang sangat bodoh. Panji-panji pembebasan buruh yang tak terkalahkan terus bergerak maju!"
 SOV_the_centre: "Pusat"
 SOV_the_centre_desc: "Kamerad Stalin telah menjadi pejuang terhebat bagi bangsa kita. Kita harus menyerahkan masa depan revolusi ke tangannya yang lebih mampu."
 SOV_socialism_in_one_country: "Sosialisme di Satu Negara"
 SOV_socialism_in_one_country_desc: "Meskipun revolusi dunia masih menjadi tujuan akhir kita – dan memang terbukti secara ilmiah sebagai hal yang tidak dapat dihindari – kita harus terlebih dahulu mengamankan Sosialisme di negara kita, agar pembebasan pekerja di belahan dunia lain tidak tertunda karena kita telah dikalahkan."
 SOV_the_stalin_constitution: "Konstitusi Stalin"
 SOV_the_stalin_constitution_desc: "Konstitusi tahun 1924 merupakan upaya yang baik dalam mengorganisir sebuah negara setelah Perang Saudara, namun konstitusi tersebut telah mencapai tujuannya. Konstitusi baru diperlukan. Pertama-tama, kita harus mengakui kerja keras Kamerad Stalin yang tak kenal lelah dalam menjaga Uni Soviet tetap kuat dan aman, serta kejeniusan dan kebijaksanaannya yang berperan dalam memajukan komunisme."
 SOV_the_zinovyevite_terrorist_center: "Pusat Teroris Zinovyevite"
 SOV_the_zinovyevite_terrorist_center_desc: "Pembunuhan Kamerad Kirov pada tahun 1934 menunjukkan bahwa ada anggota partai yang jelas-jelas berkomplot melawan Kamerad Stalin dan Uni Soviet secara keseluruhan. Kami telah memperoleh pengakuan dari beberapa rekan konspirator, yang melibatkan beberapa orang lagi. Plot Zinovyevite ini – tidak diragukan lagi diorganisir oleh Trotsky atau agen-agen Barat, yang mungkin bekerja sama – harus dibasmi, seperti kanker, sebelum menyebar."
 SOV_secure_the_administration: "Amankan Administrasi"
 SOV_secure_the_administration_desc: "Karena terkejut dengan pengakuan teroris Zinovyev dan sekutunya, kita harus mempertanyakan loyalitas anggota partai lainnya. Penting bagi kita untuk mengetahui posisi masing-masing anggota Politbiro."
 SOV_the_collectivization_process: "Proses Kolektivisasi"
 SOV_the_collectivization_process_desc: "Meskipun masih banyak pekerjaan yang harus dilakukan, dan meskipun terdapat kesalahan penanganan yang parah di beberapa wilayah, proses kolektivisasi pertanian di Uni Soviet hampir selesai, dan akan segera menghasilkan peningkatan produksi dari sektor pertanian."
 SOV_the_anti_soviet_trotskyist_center: "Pusat Trotskis Anti-Soviet"
 SOV_the_anti_soviet_trotskyist_center_desc: "Investigasi kami terhadap plot Zinovyevite telah mengungkapkan bahwa terdapat jaringan besar teroris anti-Soviet di pemerintahan kami. Beberapa anggota bahkan tidak sepenuhnya menyadari siapa yang mereka bantu! Konspirasi ini harus dibasmi, dan tindakan drastis mungkin harus diambil untuk mencapai hal ini."
 SOV_the_workers_dictatorship: "Kediktatoran Buruh"
 SOV_the_workers_dictatorship_desc: "Semua kekuasaan di Serikat kita pada akhirnya harus berada di tangan para pekerja. Kita tidak boleh terpecah menjadi faksionalisme, dan oleh karena itu kita harus memastikan bahwa keinginan buruh selalu diungkapkan dalam keputusan-keputusan Politbiro."
 SOV_organization_centralization_discipline: "Sentralisasi dan Disiplin"
 SOV_organization_centralization_discipline_desc: "Di masa yang penuh ketidakpastian ini, masyarakat bergantung pada Politbiro untuk mendapatkan stabilitas dan bimbingan. Kita harus memastikan bahwa badan pengambilan keputusan ini tidak hanya mendukung, namun bersatu mendukung keputusan Kamerad Stalin."
 SOV_war_economy: "Ekonomi Perang"
 SOV_war_economy_desc: "Jelas bahwa negara-negara kapitalis dan reaksioner di perbatasan kita berencana untuk menyerang pada saat kita lemah. Semakin cepat kita mengalihkan perekonomian kita ke kondisi perang, semakin baik."
 SOV_the_military_conspiracy: "Konspirasi Militer"
 SOV_the_military_conspiracy_desc: "Plot Trotskist di negara kita telah mencapai militer. Kita sekarang mempunyai bukti bahwa para jenderal terkemuka dan bahkan Marshall telah bersekongkol dengan badan intelijen asing untuk menggulingkan pemerintah! Kita tidak bisa membiarkan para perwira yang loyalitasnya diragukan, tetap berada pada posisi yang bisa semakin melemahkan militer kita."
 SOV_the_bloc_of_rights_and_trotskyites: "Blok Hak dan Trotskis"
 SOV_the_bloc_of_rights_and_trotskyites_desc: "Akhirnya, kita telah mencapai inti konspirasi yang ada di tengah-tengah kita. Nikolai Bukharin sebenarnya adalah anggota blok Trotskist-Zinovievite, dan kemungkinan besar adalah pemimpin orang-orang di dalam pemerintahan yang berupaya melaksanakan kontra-revolusi. Kami sekarang memiliki bukti yang tak terbantahkan mengenai hal ini, dan dalam satu persidangan terakhir, kami dapat mengungkap fakta-fakta ini."
 SOV_behead_the_snake: "Memenggal Kepala Ular"
 SOV_behead_the_snake_desc: "Menjadi sangat jelas bahwa Uni Eropa tidak akan aman sampai ancaman kudeta Trotskis sepenuhnya dihilangkan. Meskipun akan baik jika Trotsky diadili untuk mengungkap aktivitas anti-Sovietnya, kita tidak memiliki kemewahan itu. Satu-satunya pilihan kita adalah membunuhnya, menghilangkan pemimpin dan penghasut utama rencana melawan pemerintah."
 SOV_stalins_cult_of_personality: "Kultus Kepribadian Stalin"
 SOV_stalins_cult_of_personality_desc: "Setelah terungkapnya rencana mengejutkan yang menentang Uni Soviet, jelas bahwa hanya kepemimpinan Kamerad Stalin yang berpandangan jernihlah yang dapat mencegah terjadinya perang saudara atau lebih buruk lagi. Setiap warga negara Soviet, dan bahkan setiap anggota kelas pekerja global, berhutang budi kepada Kamerad Stalin atas kerja kerasnya yang tak kenal lelah dalam membela revolusi."
 SOV_they_will_know_fear: "Mereka akan Mengetahui Ketakutan"
 SOV_they_will_know_fear_desc: "Musuh-musuh kita telah belajar untuk takut terhadap Tentara Merah dan rakyat Soviet. Kami telah bertahan dari serangan awal dan sekarang saatnya untuk melawan. Kita perlu mengembangkan mesin perang baru yang menakutkan dan mampu menembus garis pertahanan musuh yang paling kuat sekalipun. Mesin perang seperti itu harus menimbulkan teror sampai ke jantung musuh hanya dengan diberi nama..."
 SOV_inheritor_of_the_mantle_of_lenin: "Pewaris Mantel Lenin"
 SOV_inheritor_of_the_mantle_of_lenin_desc: "Kamerad Stalin selalu menjadi rekan terdekat dan murid paling tepercaya Lenin. Sebagai penganut ajaran Lenin yang paling setia, wajar jika ia mewarisi tugas berat membimbing bangsa menuju Komunisme serta mempersiapkan revolusi buruh global yang tak terelakkan."
 SOV_brilliant_genius: "Jenius yang Cemerlang"
 SOV_brilliant_genius_desc: "Tidak diragukan lagi bahwa ia adalah manusia paling cemerlang yang pernah ada, Kamerad Stalin akan membimbing bangsa kita menuju tingkatan baru dalam pengembangan ilmu pengetahuan dan akan mendorong kemajuan seluruh umat manusia dengan pesat."
 SOV_the_faithful_servant_of_lenin: "Hamba Lenin yang Setia"
 SOV_the_faithful_servant_of_lenin_desc: "Lenin memberi kita tugas terbesar dalam sejarah dunia: Membangun masyarakat di mana semua orang benar-benar setara, masyarakat tanpa penindasan atau penderitaan atau kekurangan materi. Tidak ada orang yang lebih baik dalam mewujudkan visi tersebut selain Kamerad Stalin, yang mendampingi Lenin dalam setiap langkahnya dan kini siap mewujudkan janji yang telah dibuat dalam revolusi."
 SOV_ban_excessive_hero_worship: "Larang Pemujaan Pahlawan yang Berlebihan"
 SOV_ban_excessive_hero_worship_desc: "Ada kecenderungan untuk menerbitkan kisah-kisah khayalan dan berlebihan mengenai kehidupan pribadi Kamerad Stalin dan masa kecilnya. Betapapun baik niatnya, laporan-laporan ini bersifat kontra-revolusioner dan bertujuan untuk membangun kultus kepahlawanan di benak rakyat Soviet, dan berupaya menggantikan studi mendalam terhadap teori-teori Kamerad Stalin dengan penyembahan berhala belaka."
 SOV_leader_of_the_party_and_the_people: "Pemimpin Partai dan Rakyat"
 SOV_leader_of_the_party_and_the_people_desc: "Kamerad Stalin telah melaksanakan tugas-tugas beratnya dengan tekun dan terampil, serta menikmati dukungan penuh dan tanpa syarat baik dari partai maupun rakyat. Tanda-tanda kesombongan atau sanjungan terhadap diri sendiri adalah hal yang asing baginya; dia mungkin orang paling rendah hati yang masih hidup."
 SOV_great_commander: "Komandan Agung"
 SOV_great_commander_desc: "Prestasi Kamerad Stalin dalam teori dan kepemimpinan militer terlalu banyak untuk disebutkan. Meskipun pengkhianat Trotsky mungkin mendirikan Tentara Merah, Kamerad Stalin-lah yang mengubahnya menjadi kekuatan yang efektif untuk mempertahankan pencapaian kelas pekerja."
 SOV_architect_of_communism: "Arsitek Komunisme"
 SOV_architect_of_communism_desc: "Komitmen Kamerad Stalin yang tak tergoyahkan terhadap cita-cita revolusi telah memungkinkannya melihat tantangan dalam membangun Sosialisme dalam Satu Negara. Dengan upaya membangun Sosialisme yang berjalan dengan baik, ia dapat beralih ke langkah besar berikutnya: bagaimana beralih dari Sosialisme ke Komunisme sepenuhnya."
 SOV_father_of_nations: "Bapak Bangsa"
 SOV_father_of_nations_desc: "Persatuan kita adalah keluarga besar yang terdiri dari banyak orang yang berbeda, dan setiap keluarga membutuhkan seorang kepala. Kamerad Stalin adalah pemimpinnya, yang memastikan bahwa banyak anak-anaknya dididik dalam pemikiran Sosialis dan yang memandu upaya kita menuju masa depan yang cerah. Dimana harus tegas, tegasnya, namun selalu berpedoman pada rasa keadilan dan kewajaran."
 SOV_freedom_of_debate_unity_of_action: "Kebebasan Berdebat - Kesatuan Aksi"
 SOV_freedom_of_debate_unity_of_action_desc: "Ada banyak kerumitan dalam mengatur suatu negara dan mengarahkannya ke jalur yang benar, sehingga alternatif-alternatifnya harus bisa didiskusikan secara terbuka. Akan tetapi, ketika suatu keputusan telah diambil, adalah tugas setiap anggota politbiro dan bahkan seluruh partai untuk mendukung keputusan tersebut tanpa syarat apapun."
 SOV_the_construction_of_communism: "Konstruksi Komunisme"
 SOV_the_construction_of_communism_desc: "Pembangunan Komunisme akan mempunyai tantangan dan hambatan tersendiri. Dengan berdirinya Politbiro yang bersatu di belakang Kamerad Stalin, kita dapat mengambil langkah pertama untuk membangun Komunisme."
 SOV_addressing_internal_affairs: "Mengatasi Urusan Dalam Negeri"
 SOV_addressing_internal_affairs_desc: "Walaupun revolusi masih memiliki banyak musuh di seluruh dunia, dan jutaan pekerja masih ingin dibebaskan, kita tidak boleh lupa untuk mengalihkan perhatian kita pada banyak permasalahan yang menanti kita di dalam negeri."
 SOV_nkvd_primacy: "Keutamaan NKVD"
 SOV_nkvd_primacy_desc: "Sampai kita dapat yakin bahwa semua musuh negara telah berhasil dikalahkan, kita harus terus mengandalkan NKVD untuk melindungi revolusi."
 SOV_the_new_soviet_woman: "Wanita Soviet Baru"
 SOV_the_new_soviet_woman_desc: "Revolusi politik membawa kebebasan bagi jutaan orang di Uni kita, pertama di antaranya adalah jutaan perempuan yang tidak lagi dibatasi hanya sebagai istri dan ibu, namun kini juga dapat berdiri setara di tempat kerja."
 SOV_expand_the_agitprop: "Perluas Agitprop"
 SOV_expand_the_agitprop_desc: "Untuk menjangkau jutaan pekerja di seluruh Serikat kita, kita harus berbicara dalam bahasa mereka. Kita harus membuat argumen kita sederhana dan mudah dimengerti, sehingga argumen tersebut tetap diingat oleh masyarakat umum. Kita harus lebih memperluas upaya kita di bidang ini."
 SOV_positive_heroism: "Kepahlawanan Positif"
 SOV_positive_heroism_desc: "Meskipun seluruh pencapaian yang dicapai oleh anggota kelas pekerja juga dimiliki oleh semua anggota kelas pekerja, kita tetap dapat menjadikan individu sebagai contoh yang harus ditiru oleh orang lain."
 SOV_revive_the_stakhanovite_movement: "Menghidupkan kembali Gerakan Stakhanovite"
 SOV_revive_the_stakhanovite_movement_desc: "Eksploitasi yang kejam mendorong para pekerja di negara-negara kapitalis untuk bekerja lebih keras dan menghasilkan lebih banyak uang bagi pemilik pabrik. Di negara kita, pekerja seperti Alexei Stakhanov mendorong diri mereka lebih jauh karena mereka tahu bahwa setiap tambahan batu bata, setiap ton batu bara tambahan yang ditambang, setiap pemasangan paku keling tambahan membantu membangun dunia di mana para pekerja bebas dari eksploitasi selamanya."
 SOV_war_heroes: "Pahlawan Perang"
 SOV_war_heroes_desc: "Orang-orang Rusia selalu mampu dan bersedia melakukan tindakan yang sangat berani demi mengalahkan penjajah mana pun di tanah air mereka. Meskipun kita bersatu dalam perjuangan melawan musuh, kita tidak boleh berpura-pura bahwa tidak ada prajurit di militer kita yang telah melampaui tugas mereka."
 SOV_collectivist_propaganda: "Propaganda Kolektivis"
 SOV_collectivist_propaganda_desc: "Banyaknya tantangan yang kita hadapi tidak pernah dihadapi oleh setiap warga negara sendirian. Segala perjuangan kita adalah perjuangan bersama, maka dari itu segala prestasi kita adalah prestasi bersama."
 SOV_socialist_emulation: "Emulasi Sosialis"
 SOV_socialist_emulation_desc: "Di bawah sistem kapitalis, pekerja harus bersaing satu sama lain untuk mendapatkan makanan sehari-hari, sementara pemilik pabrik mendapat keuntungan dari setiap perbaikan yang dilakukan pekerja yang mengarah pada peningkatan produktivitas. Ini adalah tindakan yang sia-sia dan tidak berperikemanusiaan. Sistem sosialis akan memberikan dukungan yang dibutuhkan bagi mereka yang belum menjadi yang terbaik untuk mengembangkan kemampuan mereka dengan belajar dari mereka yang unggul."
 SOV_socialist_realism: "Realisme Sosialis"
 SOV_socialist_realism_desc: "Jalan menuju masa depan Sosialis yang cerah masih panjang dan sering kali berangin. Beberapa orang bahkan mungkin kehilangan harapan bahwa tujuan ini dapat tercapai. Kita harus menunjukkan kepada mereka apa yang sedang mereka upayakan, dengan mempromosikan gaya seni yang menunjukkan seperti apa sebenarnya kehidupan di negara sosialis."
 SOV_the_komsomol: "Komsomol"
 SOV_the_komsomol_desc: "Kami tidak membangun Sosialisme untuk orang-orang dewasa saat ini, kami membangunnya untuk anak-anak dan generasi yang belum lahir. Mereka harus diajari bagaimana meningkatkan dan membangun prestasi yang akan kita raih, sehingga mereka bisa menyelesaikan pekerjaan yang telah kita mulai. Kita harus membentuk organisasi pemuda khusus yang tidak hanya mendidik mereka tetapi juga mengajarkan mereka bagaimana menjadi anggota masyarakat komunis yang baik."
 SOV_patriarch_of_all_russia: "Patriark Seluruh Rusia"
 SOV_patriarch_of_all_russia_desc: "Meskipun tidak ada alasan untuk melakukan takhayul di masyarakat Komunis yang sudah tercerahkan, kita juga harus mengakui bahwa banyak orang telah menemukan kekuatan dan kenyamanan dalam iman mereka selama masa-masa sulit. Membangun masyarakat baru tidaklah mudah, jadi mungkin kita harus membiarkan lembaga-lembaga keagamaan ini terus berfungsi, selama mereka tetap setia kepada negara."
 SOV_the_comintern: "Komintern"
 SOV_the_comintern_desc: "Perjuangan untuk pembebasan buruh tidak terbatas pada negara manapun; ini adalah perjuangan global. Kita harus memberikan bantuan kepada kawan-kawan di negara manapun di dunia, dan melawan kekuatan reaksi dan kontra-revolusi dimanapun mereka berada."
 SOV_development_aid_for_eastern_allies: "Bantuan Pembangunan Untuk Sekutu Timur"
 SOV_development_aid_for_eastern_allies_desc: "Selama berabad-abad, Imperialisme dan Kolonialisme Barat telah mengeksploitasi secara brutal negara-negara di Asia. Investasi kecil dari kami akan memungkinkan sekutu kami di Asia untuk melawan perambahan kapitalis dengan lebih efektif."
 SOV_war_measures_in_the_east: "Tindakan Perang di Timur"
 SOV_war_measures_in_the_east_desc: "Perjuangan global melawan fasisme dan ideologi kontra-revolusioner lainnya pasti akan mencapai Asia dalam waktu dekat. Kita harus menjelaskan kepada sekutu kita bahwa di masa-masa sulit ini, tindakan yang mendesak mungkin diperlukan."
 SOV_fortify_mongolian_border: "Perkuat Perbatasan Mongolia"
 SOV_fortify_mongolian_border_desc: "Meskipun kelompok garis keras Jepang saat ini sedang mengincar Tiongkok, kita tidak dapat mengesampingkan bahwa mereka mungkin ingin memperluas jangkauan mereka dengan menyerang kita. Kita harus memastikan bahwa Sekutu Mongolia kita tidak berubah menjadi sayap terbuka."
 SOV_send_military_advisors_to_spain: "Kirim Penasihat Militer ke Spanyol"
 SOV_send_military_advisors_to_spain_desc: "Kawan-kawan kita di Spanyol, setelah memenangkan pemilu demokratis, kini menghadapi kontra-revolusi yang reaksioner. Kita harus mendukung mereka agar kekalahan mereka tidak mendorong kaum fasis di negara lain."
 SOV_policy_of_collective_security: "Kebijakan Keamanan Kolektif"
 SOV_policy_of_collective_security_desc: "Meskipun mereka kapitalis dan seringkali reaksioner, pemerintahan demokratis di seluruh Eropa tahu bahwa kaum fasis menganggap mereka lemah dan merosot. Jika perang terjadi, merekalah yang akan menjadi pihak pertama yang gugur sebelum kemarahan fasisme sepenuhnya diarahkan ke rumah revolusi. Para politisi yang cukup berpandangan jauh ke depan untuk menyadari hal ini harus tahu bahwa mereka akan mendapat simpati dari Moskow."
 SOV_anti_fascist_policies: "Kebijakan Anti-Fasis"
 SOV_anti_fascist_policies_desc: "Tidak mungkin ada hidup berdampingan secara damai dengan kaum fasis. Kita harus menjangkau sekutu mana pun yang bisa kita temukan dan bersiap menghadapi konfrontasi yang tak terelakkan."
 SOV_seek_a_defense_pact_with_the_allies: "Mencari Pakta Pertahanan Dengan Sekutu"
 SOV_seek_a_defense_pact_with_the_allies_desc: "Meskipun terdapat kontak informal dengan negara-negara demokrasi barat, hanya sedikit kesepakatan yang konkrit dan mengikat secara hukum. Inilah saatnya untuk menuliskan tinta di atas kertas dan menyatakan kepada dunia bahwa negara-negara demokrasi Barat bersedia membentuk Front Gabungan bersama kita melawan ekspansi fasis."
 SOV_the_khakimov_proposal: "Usulan Khakimov"
 SOV_the_khakimov_proposal_desc: "Khakimov telah bekerja tanpa kenal lelah untuk meningkatkan kedudukan kami di mata pemerintah [SAU.GetNameDef]. Para ahli berspekulasi bahwa kawasan ini adalah rumah bagi sejumlah besar sumber daya alam, yang pastinya ingin dieksploitasi oleh para kapitalis. Kita harus terus membangun hubungan saling percaya untuk menjaga [SAU.GetNameDef] keluar dari blok yang bermusuhan dan memberi kita hak pertama atas potensi sumber daya."
 SOV_eradicate_western_fascism: "Memberantas Fasisme Barat"
 SOV_eradicate_western_fascism_desc: "Kita tidak bisa menunggu sampai rezim fasis di Eropa Barat berkenan menyerang kita pada saat yang mereka pilih. Cara terbaik menghadapi fasis adalah dengan memukul terlebih dahulu, lalu memukul dengan keras."
 SOV_policy_of_individual_security: "Kebijakan Keamanan Individu"
 SOV_policy_of_individual_security_desc: "Kita mempunyai sedikit teman di dunia ini, dan banyak musuh. Kita tidak boleh terlalu memikirkan dengan siapa kita membuat kesepakatan – mereka atau kita akan tetap membatalkan kesepakatan tersebut, begitu kesepakatan tersebut telah mencapai tujuannya."
 SOV_approach_germany: "Dekati Jerman"
 SOV_approach_germany_desc: "Tidak ada alasan mengapa kita tidak bisa akomodasi dengan Jerman. Tentu saja kita tidak akan bisa hidup berdampingan secara damai dengan mereka selamanya, tetapi Jerman tidak akan menyerang kita selama Sekutu barat masih mendukung mereka - dan kita harus mendorong Jerman untuk menghadapi mereka terlebih dahulu."
 SOV_liberation_of_the_european_proletariat: "Pembebasan Proletariat Eropa"
 SOV_liberation_of_the_european_proletariat_desc: "Pemerintahan borjuis yang tidak berdaya di Eropa Barat telah menunjukkan keengganan mereka untuk melawan fasisme. Dalam perjuangan besar antara fasisme dan komunisme yang akan datang, mereka tidak akan berperan. Namun para pekerja di negara-negara tersebut bersedia berjuang bersama kita melawan momok fasisme. Kita hanya perlu memberi mereka pemerintah yang bersedia berperang."
 SOV_anti_capitalist_policies: "Kebijakan Anti-Kapitalis"
 SOV_anti_capitalist_policies_desc: "Jelaslah bahwa sebagian besar, jika tidak semua, negara-negara kapitalis sudah cukup puas dengan hanya mengarahkan kaum fasis ke arah lain ketika mereka merencanakan ekspansi mereka. Ketika diberi pilihan, kaum borjuis pada akhirnya akan selalu memilih untuk menindas kaum proletar. Oleh karena itu, kita tidak dapat mempercayai mereka dan kita harus bersiap untuk melakukan perlawanan terhadap mereka."
 SOV_recover_alaska: "Pulihkan Alaska"
 SOV_recover_alaska_desc: "Penjualan Alaska kepada Amerika merupakan pengkhianatan terhadap rakyat Rusia yang dilakukan oleh kepemimpinan mereka. Sudah lama sekali pengkhianatan ini dibatalkan dan tanah kembali pulih. Masyarakat akan jauh lebih bahagia jika menjadi bagian dari serikat pekerja kita dibandingkan menjadi bagian dari sistem eksploitatif yang mereka jalani saat ini."
 SOV_the_fight_for_the_pacific: "Perjuangan Untuk Pasifik"
 SOV_the_fight_for_the_pacific_desc: "Tidak peduli seberapa kuat kita di darat, kita harus menyeberangi perairan untuk menghadapi musuh-musuh kita di kawasan Pasifik. Oleh karena itu, kita harus mengembangkan infrastruktur pesisir dan industri pembuatan kapal sebelum kita dapat melancarkan perang yang efektif di wilayah tersebut."
 SOV_baltic_security: "Keamanan Baltik"
 SOV_baltic_security_desc: "Nasib negara-negara di sekitar Laut Baltik terkait erat dengan nasib kita. Kita tidak bisa membiarkan pemerintahan yang bermusuhan berada di perbatasan kita."
 SOV_respect_baltic_self_determination: "Hormati Penentuan Nasib Sendiri Baltik"
 SOV_respect_baltic_self_determination_desc: "Setiap bangsa harus diperbolehkan untuk memutuskan urusannya sendiri secara demokratis. Tentu saja, di banyak negara demokrasi borjuis di Barat, proses ini langsung diselewengkan oleh uang dalam jumlah besar. Kami akan memastikan bahwa pekerja di Estonia, Latvia dan Lituania memiliki keterwakilan yang adil di pemerintahan mereka."
 SOV_claims_in_baltic: "Klaim di Baltik"
 SOV_claims_in_baltic_desc: "Negara-negara Baltik pernah menjadi bagian tak terpisahkan dari Rusia. Rakyat mereka memerlukan perlindungan negara besar yang dapat melindungi mereka dari eksploitasi. Jika negara-negara Baltik tidak menyetujui persyaratan ini, kita mungkin harus menggunakan kekerasan untuk memastikan perlindungan kita."
 SOV_secure_leningrad: "Amankan [195.GetName]"
 SOV_secure_leningrad_desc: "Perbatasan kami saat ini dengan Finlandia terlalu dekat dengan [195.GetName] untuk kenyamanan. Serangan mendadak dari Finlandia bisa mencapai kota itu dalam beberapa jam. Lokasinya juga sangat memudahkan blokade Armada Baltik kita. Ini adalah keadaan yang tidak dapat diterima dan kita harus menjelaskannya kepada pemerintah Finlandia."
 SOV_control_scandinavia: "Kontrol Skandinavia"
 SOV_control_scandinavia_desc: "Ancaman terakhir yang tersisa terhadap perbatasan utara kita adalah pemerintah di semenanjung Skandinavia. Kita harus menekankan pada mereka fakta bahwa hidup berdampingan secara damai membutuhkan rasa saling percaya, dan kita tidak bisa mempercayai pemerintah yang ideologinya tidak sejalan dengan kita."
 SOV_claims_on_poland: "Klaim terhadap Polandia"
 SOV_claims_on_poland_desc: "Polandia menguasai wilayah yang telah menjadi milik Rusia selama berabad-abad, sehingga membagi Ukraina dan Belarus menjadi negara-negara kita. Ini adalah keadaan yang tidak bisa diterima. Mereka mungkin telah mengalahkan kita pada tahun 1921, namun kita harus mengingatkan mereka bahwa zaman telah berubah."
 SOV_demand_eastern_poland: "Permintaan Polandia Timur"
 SOV_demand_eastern_poland_desc: "Pada akhir perang besar, garis Curzon ditetapkan dan disepakati sebagai perbatasan timur Polandia. Jalur itu membentang sekitar 200 kilometer sebelah barat perbatasan Polandia saat ini. Kita harus mengingatkan mereka akan fakta dasar sejarah ini dan memastikan bahwa perbatasan berada di tempat yang seharusnya."
 SOV_offer_poland_protection: "Tawarkan Perlindungan Polandia"
 SOV_offer_poland_protection_desc: "Polandia dan rakyat Polandia telah menderita banyak kekurangan dan penghinaan selama berabad-abad. Sudah menjadi rahasia umum bahwa Jerman menginginkan wilayah yang diberikan kepada Polandia setelah Perang Besar kembali, dan bersedia menggunakan kekerasan untuk mendapatkannya. Kita harus menawarkan perlindungan kepada pemerintah Polandia, selama mereka bersedia membahas masalah perbatasan bersama kita."
 SOV_claim_on_bessarabia: "Klaim di Bessarabia"
 SOV_claim_on_bessarabia_desc: "Pada tahun 1918, orang-orang Rumania tanpa malu-malu memanfaatkan masalah internal kami dan mencaplok Bessarabia. Ini adalah waktu yang tepat untuk mengingatkan mereka bahwa mereka memiliki tanah yang secara hukum merupakan milik kita, dan jika mereka tidak mau memulihkan perbatasan yang benar, kita akan memaksa mereka keluar melalui cara militer."
 SOV_demand_balkan_submission: "Permintaan Penyerahan Balkan"
 SOV_demand_balkan_submission_desc: "Pengalaman masa lalu menunjukkan bahwa negara-negara di sekitar kita akan mengeksploitasi setiap kelemahan yang kita tunjukkan. Dengan terjadinya perang di Eropa, kita tidak mampu memiliki tetangga yang kesetiaannya dipertanyakan. Negara-negara di Balkan dan Asia Kecil harus memilih apakah mereka ingin mendukung kami atau menentang kami."
 SOV_seek_balkan_cooperation: "Mencari Kerjasama Balkan"
 SOV_seek_balkan_cooperation_desc: "Negara-negara di Semenanjung Balkan dan Asia Kecil dapat menjadi sekutu yang kuat, jika kita dapat membuat mereka lebih menyelaraskan pandangan ideologis mereka dengan pandangan kita."
 SOV_middle_east_diplomacy: "Diplomasi Timur Tengah"
 SOV_middle_east_diplomacy_desc: "Ada banyak peluang untuk meningkatkan posisi kita di semenanjung Arab dan di Asia. Pertandingan hebat melawan Inggris akan mengambil giliran lain."
 SOV_the_southern_thrust: "Dorongan Selatan"
 SOV_the_southern_thrust_desc: "Perbatasan selatan kita adalah sisi terbuka lebar dimana musuh dapat mengeksploitasi kelemahan apapun. Kita tidak bisa mentolerir hal ini, kita juga tidak bisa menunggu perubahan damai di kawasan ini."
 SOV_support_afghan_ideology: "Mendukung Afghanistan [GetIdeologyNameWithCaps]"
 SOV_support_afghan_ideology_desc: "Afghanistan adalah tempat negara-negara yang sombong direndahkan. Operasi militer di negara tersebut akan memakan banyak biaya dan bahkan mungkin tidak akan berhasil. Kami memiliki beberapa kontak di Afghanistan yang ingin membentuk pemerintahan yang secara ideologis lebih selaras dengan kami. Kita harus mendukung upaya ini."
 SOV_preemptive_invasion_of_iran: "Invasi Pencegahan ke Iran"
 SOV_preemptive_invasion_of_iran_desc: "Pemerintah [PER.GetNameDef] tidak dapat dipercaya untuk mendukung kami jika terjadi perang, dan kami juga tidak dapat sepenuhnya mempercayai mereka untuk tidak berperang melawan kami. Daripada menunggu dan melihat, kita harus memaksakan masalah ini dan menjernihkan situasi."
 SOV_the_threat_from_the_land_of_the_rising_sun: "Ancaman dari Negeri Matahari Terbit"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc: "Jelas bahwa Jepang ingin mendominasi Tiongkok. Begitu mereka berhasil mencapai hal ini, mereka pasti akan berbelok ke utara untuk mengambil sumber daya yang sangat besar di Siberia. Selama mereka sibuk di Tiongkok, mereka memilih untuk tidak bergerak melawan kita, jadi kita harus memastikan bahwa perang di Tiongkok berlangsung sampai kita siap melawan Jepang."
 SOV_the_gobi_gambit: "Langkah Gobi"
 SOV_the_gobi_gambit_desc: "Sementara konflik antara Jepang dan Tiongkok sedang memanas, terdapat peluang bagi kita untuk merebut wilayah sekitar Gurun Gobi, agar kita dapat menentukan masa depan Tiongkok dan mendapatkan kursi di meja perundingan."
 SOV_two_red_flags: "Dua Bendera Merah"
 SOV_two_red_flags_desc: "Meskipun revolusi belum sepenuhnya berhasil di Tiongkok, hal ini bukanlah hal yang tidak terduga. Negara ini belum memiliki masyarakat industri yang diperlukan untuk revolusi sosialis yang layak. Namun, partai komunis mewakili peluang terbaik bagi rakyat Tiongkok untuk mencapai masa depan komunis."
 SOV_support_the_kuomintang: "Dukung Kuomintang"
 SOV_support_the_kuomintang_desc: "Komunis Tiongkok lemah secara militer dan tidak memiliki basis industri untuk membangun pasukan yang lebih besar. Jelas bahwa Kuomintang adalah kelompok yang paling cocok untuk mengendalikan Tiongkok dan menciptakan masyarakat borjuis yang diperlukan sebagai prasyarat keberhasilan revolusi komunis."
 SOV_intervention_in_china: "Intervensi Di Tiongkok"
 SOV_intervention_in_china_desc: "Situasi di Tiongkok telah memburuk hingga menjadi ancaman terhadap keamanan kita. Kita harus melakukan intervensi dan menempatkan pemerintahan yang dapat diandalkan di wilayah ini."
 SOV_prepare_a_war_with_japan: "Siapkan Perang Dengan Jepang"
 SOV_prepare_a_war_with_japan_desc: "Sebelum kita menyerang Jepang, kita harus memastikan bahwa tidak ada kejutan yang menunggu kita, dan mengintensifkan upaya pengintaian kita."
 SOV_end_the_khalkhin_gol_conflict: "Akhiri Konflik Khalkhin Gol"
 SOV_end_the_khalkhin_gol_conflict_desc: "Konflik perbatasan dengan Jepang sudah berlangsung cukup lama. Jika kita tidak bisa mempercayai pemerintah Jepang untuk menghormati perbatasan yang diakui, maka kita harus mengganti pemerintahan tersebut."
 SOV_recover_the_kuril_islands: "Pulihkan Kepulauan Kuril"
 SOV_recover_the_kuril_islands_desc: "Kepulauan Kuril hilang setelah bencana tahun 1905. Jika kita menyerang dengan cepat dan keras, kita dapat memulihkannya dan memberikan Jepang situasi di mana peningkatan konflik tidak akan bermanfaat bagi mereka."
 SOV_reconcile_japan: "Rekonsiliasi Jepang"
 SOV_reconcile_japan_desc: "Ancaman utama terhadap kami akan datang dari Eropa. Kita harus menghilangkan semua masalah yang belum terselesaikan dengan Jepang agar kita bisa fokus pada perbatasan barat dan tidak perlu takut akan tikaman dari belakang."
 SOV_spheres_of_influence_in_china: "Lingkup Pengaruh Di Tiongkok"
 SOV_spheres_of_influence_in_china_desc: "Pertikaian terakhir yang tersisa di antara kita adalah situasi di Tiongkok. Kepentingan kami sendiri di kawasan ini terbatas, dan jika kami dapat membeli dukungan Jepang dengan kesepakatan mengenai bidang kepentingan kami, maka kami harus melakukannya tanpa ragu-ragu."
 SOV_soviet_japanese_pact_against_usa_focus: "Pakta Soviet-Jepang Melawan AS"
 SOV_soviet_japanese_pact_against_usa_focus_desc: "Masyarakat Jepang menginginkan ekspansi lebih lanjut untuk mendorong pertumbuhan ekonomi mereka. Adalah kepentingan terbaik kami untuk menunjukkan ekspansi sejauh mungkin dari kami, dan juga mendapatkan dukungan dari kekuatan angkatan laut yang kuat. Bersama-sama, kita bisa menyingkirkan Amerika Serikat dari panggung dunia!"
