 #Latvia
 LAT_suspend_the_constitution: "Tangguhkan Konstitusi Latvia"
 LAT_suspend_the_constitution_desc: "Konstitusi Latvia ditandatangani pada tahun 1922 untuk menyusun hak-hak demokrasi kita menjadi undang-undang. Namun, dengan adanya perang di depan mata, jelas bahwa konstitusi sudah tidak berguna lagi dan harus ditangguhkan jika kita ingin selamat dari krisis ini."
 LAT_appease_democrats: "Tenangkan Demokrat"
 LAT_appease_democrats_desc: "Meskipun metode kami tidak demokratis, motivasi kami adalah untuk republik. Kita harus membuat oposisi demokratis menyadari bahwa kita hanya memikirkan yang terbaik untuk Latvia dan mungkin dengan mengadakan kembali Saeimas dapat membuat mereka sadar akan niat kita yang sebenarnya."
 LAT_renew_kviesis_term: "Perpanjang Masa Berlaku Kviesis"
 LAT_renew_kviesis_term_desc: "Alberts Kviesis sejauh ini terbukti menjadi Perdana Menteri yang kompeten dan meskipun ia merupakan peninggalan pemerintahan demokratis lama, ia tunduk dan setia kepada Ulmanis seperti halnya siapa pun dari kabinetnya sendiri. Partai Demokrat kemungkinan besar akan senang melihat kita memperbarui masa jabatannya."
 LAT_martial_prime_minister: "Seorang Perdana Menteri Bela Diri"
 LAT_martial_prime_minister_desc: "Kviesis berguna pada masa damai, tetapi sekarang perang sudah di depan mata dan kita membutuhkan orang militer untuk memerintah rakyat. Jānis Balodis akan menjadi kandidat ideal untuk peran ini."
 LAT_establish_chambers_of_professions: "Mendirikan Kamar Profesi"
 LAT_establish_chambers_of_professions_desc: "Saeima akan membagi masyarakat berdasarkan poros regional, namun kita tahu bahwa ini bukanlah satu-satunya cara masyarakat dapat terpecah belah. Dengan dibentuknya Kamar Profesi, masyarakat akan terwakili bukan berdasarkan daerahnya, melainkan berdasarkan profesinya."
 LAT_restore_saeima: "Kembalikan Saeima"
 LAT_restore_saeima_desc: "Saeima adalah dewan perwakilan lokal di Latvia dan meskipun tidak lagi menjalankan pemerintahan kami, kami dapat membuka kembali Saeima dalam peran yang lebih memberi nasihat kepada kediktatoran; membiarkan rakyat mempunyai ilusi demokrasi."
 LAT_what_is_socialism: "Sosialisme Latvia"
 LAT_what_is_socialism_desc: "Partai Sosial Demokrat Latvia saat ini merupakan partai yang paling populer di Saeima, dan pengikut Fricis Menders sangat banyak dan vokal. Mungkin dengan memberlakukan beberapa reformasinya, para pekerja Latvia akan diberikan lingkungan kerja yang lebih baik dan produktif."
 LAT_what_is_capitalism: "Kapitalisme Negara"
 LAT_what_is_capitalism_desc: "Dengan kokohnya Kamar Profesi, sudah saatnya kita mengambil kendali langsung atas perekonomian. Meskipun perekonomian kita masih bersifat kapitalis, sudah saatnya kediktatoran mengambil kendali atas industri-industri utama."
 LAT_integrate_farmers_party: "Integrasikan Partai Tani"
 LAT_integrate_farmers_party_desc: "Sandiwara demokrasi ini sudah berlangsung cukup lama. Sudah saatnya kita mengintegrasikan Partai Tani ke dalam Kediktatoran dan menyingkirkan partai-partai lain dari pemerintahan."
 LAT_nationalised_industry: "Industri Nasionalisasi"
 LAT_nationalised_industry_desc: "Perekonomian kapitalis telah mencapai masanya, ini adalah masa perang dan kita harus memastikan bahwa pemerintah mempunyai kendali yang kuat atas perekonomian."
 LAT_merge_presidential_titles: "Gabungkan Gelar Presiden"
 LAT_merge_presidential_titles_desc: "Boladis semakin berpengaruh dalam pemerintahan dan mungkin masa jabatannya sebagai wakil penguasa sudah berakhir. Hanya Ulmanis yang tahu cara mengamankan negara Latvia."
 LAT_improve_military_life: "Meningkatkan Kehidupan Militer"
 LAT_improve_military_life_desc: "Jika kita ingin laki-laki berjuang dan mati demi Latvia, kita harus memberi mereka gaya hidup yang layak untuk diperjuangkan dan diperjuangkan. Hal ini dapat dicapai dengan jatah yang lebih baik, dan janji akan kehidupan yang baik setelah perang dimenangkan."
 LAT_military_diarchy: "Sebuah Diarki Militer"
 LAT_military_diarchy_desc: "Pengaruh Balodis dalam pemerintahan telah berkembang begitu besar sehingga banyak yang percaya bahwa kediktatoran sebenarnya merupakan hasil diarki militer dan Ulmanis. Akan lebih bijaksana jika kita mengaktualisasikan kesalahpahaman ini dan memberikan Boladis kendali yang lebih besar atas pemerintahan."
 LAT_military_dictatorship: "Kediktatoran Militer"
 LAT_military_dictatorship_desc: "Ulmanis adalah tokoh yang berguna dan populer, hal ini tidak dapat disangkal, tapi mungkin di masa konflik yang semakin meningkat ini akan lebih baik jika dia menjadi seperti itu; seorang boneka. Pemerintahan harus diserahkan kepada militer saja."
