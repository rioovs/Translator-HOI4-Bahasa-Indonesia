 #Estonia
 EST_era_of_silence: "Era Keheningan"
 EST_era_of_silence_desc: "Dengan gerakan Vaps ultra-nasionalis yang penuh kekerasan menyebar dari Saaremaa hingga Võrumaa, Penatua Negara harus mengantarkan era baru bagi Estonia; era tanpa pemilu, tanpa perbedaan pendapat, dan tanpa perlawanan. Bangsa ini harus memasuki era keheningan."
 EST_ismaaliit: "Isamaaliit"
 EST_ismaaliit_desc: "Bahkan ketika partai Päts sendiri dilarang menduduki semua jabatan politik di negara tersebut, kediktatoran membutuhkan partai baru untuk mengatur dirinya sendiri. Liga Patriotik akan melindungi bangsa dari segala ancaman; baik di dalam maupun di luar perbatasan Estonia."
 EST_establish_the_rahvuskogu: "Dirikan Rahvuskogu"
 EST_establish_the_rahvuskogu_desc: "Karena Konstitusi Estonia yang lama terbukti tidak mampu melindungi rakyatnya dari fasisme dan tirani, telah diputuskan bahwa konstitusi baru harus dirancang untuk mengamankan negara dan, pada waktunya, memulihkan tradisi demokrasi yang diperjuangkan dan mati oleh rakyat Estonia pada tahun 1918."
 EST_chamber_of_deputies: "Amankan Kamar Deputi"
 EST_chamber_of_deputies_desc: "Dengan Dewan Nasional yang kini berada di bawah kendali Isamaaliit, yang tersisa hanyalah menguasai Dewan Deputi. Dengan seluruh badan pemerintahan sipil berada di bawah mayoritas mutlak partai, kediktatoran akan memperoleh kendali penuh atas negara dan industrinya."
 EST_exploit_the_banks: "Eksploitasi Bank"
 EST_exploit_the_banks_desc: "Konstantin Päts telah lama menjadi tokoh berpengaruh di sektor perbankan Estonia. Meskipun beberapa orang akan membuat pernyataan berkhianat bahwa Päts terlibat dalam korupsi bank dan mengeksploitasi pekerja di Estonia, koneksi Päts di sektor swasta menempatkan kediktatoran kita pada posisi yang tepat untuk mengeksploitasi negara kita sendiri."
 EST_modernize_capital: "Modernisasikan Tallinn"
 EST_modernize_capital_desc: "Kota besar Tallinn telah terlalu lama dikuasai oleh penindasan Jerman dan Rusia dan belum mampu mencapai potensi penuhnya sehingga membuat negara Baltik iri. Kota besar kita tidak pernah dan tidak akan pernah dibakar atau dinodai oleh tentara asing, dan harus dimodernisasi untuk bersaing dengan kota-kota lain di Eropa."
 EST_squash_the_opposition: "Hancurkan Oposisi"
 EST_squash_the_opposition_desc: "Dengan selesainya kendali kita atas pemerintahan sipil, kita harus menghapus semua bibit hitam pengkhianatan dari kabinet dan pemerintah daerah kita. Mereka yang menentang kepemimpinan kita harus segera mengetahui bahwa menentang Isamaali berarti menentang Estonia."
 EST_formalize_baltic_entente: "Meresmikan Entente Baltik"
 EST_formalize_baltic_entente_desc: "Entente Baltik adalah perjanjian antara kami dan saudara-saudara kami di Baltik untuk melindungi satu sama lain pada saat perang, namun ketulusan perjanjian ini patut dipertanyakan. Ketika Jerman dan Soviet menekan kita, dan Inggris jauh dari wilayah kita, kerja sama menjadi sangat penting untuk mempertahankan kemerdekaan kita yang rapuh."
 EST_look_north: "Lihat Utara"
 EST_look_north_desc: "Kami sadar bahwa Negara-negara Baltik saja mungkin tidak cukup untuk melawan ancaman Nazi dan Soviet di perbatasan kami, namun dengan ambisi para agresor kami di Skandinavia, mungkin kami dapat membujuk sekutu utara kami untuk bergabung dengan Entente Baltik."
 EST_beyond_the_baltic: "Di luar Baltik"
 EST_beyond_the_baltic_desc: "Meskipun beberapa orang berpendapat bahwa Entente Baltik sudah cukup untuk melindungi negara kecil kita dari invasi, kita semua tahu bahwa ini adalah sebuah kesalahan. Sekutu membantu kami pada tahun 1918 dalam perjuangan kami untuk menentukan nasib sendiri, dan mungkin tidak terlalu bodoh untuk mengharapkan mereka kembali membantu kami!"
 EST_join_the_allies: "Bergabunglah dengan Sekutu"
 EST_join_the_allies_desc: "Sekutu telah membuktikan diri mereka sebagai sahabat kemerdekaan [ROOT.GetAdjective], dan yang tersisa sekarang hanyalah meresmikan persahabatan tersebut dengan masuknya [ROOT.GetNameDef] secara resmi ke dalam faksi Sekutu."
 EST_national_council: "Amankan Dewan Nasional"
 EST_national_council_desc: "Dewan Nasional adalah cabang pemerintahan kami yang mewakili kotamadya, kota besar, dan kamar perusahaan setempat. Jika kita ingin mewakili kepentingan orang-orang ini dengan baik, kita harus memastikan bahwa perwakilan mereka hanyalah anggota setia partai Isamaaliit dan staf militer saja; karena hanya mereka yang mampu mempertahankan kedaulatan rakyat Estonia."
 EST_new_economic_policy: "Tinjau kembali Kebijakan Ekonomi"
 EST_new_economic_policy_desc: "Perekonomian kita hampir seluruhnya bergantung pada perdagangan dengan Uni Soviet. Rusia adalah musuh nyata bagi penentuan nasib sendiri Estonia dan selama kita bergantung pada mereka untuk hal apa pun, kita tidak benar-benar bebas. Kita harus melepaskan diri dari penindas kita demi perekonomian yang lebih mandiri."
 EST_support_independent_militaries: "Mendukung Militer Independen"
 EST_support_independent_militaries_desc: "Di seluruh negeri, faksi-faksi militer independen bersiap-siap untuk kembali berperang demi melindungi Estonia dari imperialisme asing, namun semangat militer ini tidak dimiliki oleh mereka. Kita harus membekali semua prajurit, baik pejabat maupun bukan, sumber daya yang dibutuhkan untuk membela negara kita yang baik."
 EST_fight_the_vaps: "Lawan Vap"
 EST_fight_the_vaps_desc: "Gerakan sayap kanan Vapsid berupaya mengganggu stabilitas Estonia. Meskipun gerakan ini dimulai sebagai sekelompok veteran dan pahlawan nasional, namun dengan cepat berubah menjadi gerakan ultranasionalis yang [EST.GetLeader] bisa dibandingkan dengan Nazi. Unsur-unsur nakal dalam negara kita ini harus dihilangkan jika kita ingin menciptakan masa depan yang stabil bagi Estonia."
 EST_republican_defence_league: "Liga Pertahanan Republik"
 EST_republican_defence_league_desc: "Dengan berkurangnya signifikansi Vaps, banyak kelompok paramiliter kini hilang dan tidak punya alasan untuk diperjuangkan. Dengan berupaya menyatukan paramiliter ini ke dalam satu kelompok resmi Estonia, kita akan memanfaatkan sumber daya baru berupa orang-orang pemberani yang bersedia berjuang dan mati demi kemerdekaan Estonia."
 EST_womens_defence_league: "Liga Pertahanan Wanita"
 EST_womens_defence_league_desc: "Naiskodukaitse adalah sub-organisasi Liga Pertahanan Republik yang diperuntukkan bagi perempuan patriotik yang bersedia melakukan bagian mereka untuk mempertahankan rumah dan keluarga mereka. Liga Pertahanan Wanita harus dilengkapi dan diinvestasikan dengan baik untuk menyediakan garnisun bagi rumah kita dan staf medis untuk pasukan kita."
 EST_corporate_chambers: "Kamar Perusahaan"
 EST_corporate_chambers_desc: "Kelompok sayap kiri telah lama menentang gagasan korporatisme, namun kini setelah Riigikogu sudah tidak lagi bersuara, kita akhirnya bisa mendirikan Kamar Korporat. Pekerja akan terpecah bukan berdasarkan ideologi namun berdasarkan pekerjaan, dimana pengusaha swasta mewakili kepentingan mereka di bawah kediktatoran. Apa yang salah?"
 EST_cave_to_enemy_pressure: "Gua terhadap Tekanan Musuh"
 EST_cave_to_enemy_pressure_desc: "Sudah menjadi jelas bahwa tidak ada masa depan yang bisa bertahan bagi bangsa dan rakyat kita. Meskipun kita telah melakukan banyak hal untuk melindungi sanak saudara kita, menjadi jelas bahwa tidak mungkin [Root.GetNonIdeologyName] dapat mempertahankan kemerdekaannya tanpa menimbulkan kerugian besar bagi rakyatnya."
 EST_threat_on_our_border: "Ancaman di Perbatasan Kita"
 EST_threat_on_our_border_desc: "Perang sudah di depan mata. Kita tidak tahu untuk apa, dan kita tidak tahu siapa yang akan kita lawan, tapi kita tahu bahwa elang perang sudah siap untuk [Root.Capital.GetName] dan kita harus memutuskan di mana letak kesetiaan kita dalam perjuangan yang akan datang. Rencana harus dibuat, dengan fokus pada Nazi di Selatan atau Soviet di Timur."
 EST_fortify_tallinn: "Perkuat Tallinn"
 EST_fortify_tallinn_desc: "Meskipun banyak yang percaya bahwa kita dapat menguasai seluruh perbatasan Estonia, secara realistis kita tahu bahwa ada wilayah yang harus dikorbankan jika kita ingin bertahan hidup. Benteng di sekitar ibu kota akan memungkinkan kita melindungi inti infrastruktur kita, apa pun risikonya."
 EST_hold_saaremaa: "Tahan Saaremaa"
 EST_hold_saaremaa_desc: "Kita harus bersiap menghadapi perlawanan yang panjang dan sulit. Meskipun kepulauan Estonia tidak mempunyai industri seperti di daratan, mempersiapkan pulau-pulau tersebut untuk pertahanan terakhir akan memberi kita basis operasi yang dapat kita gunakan untuk mendukung pejuang perlawanan dan, pada waktunya, merebut kembali wilayah kita."
 EST_fortify_the_border: "Perkuat Perbatasan"
 EST_fortify_the_border_desc: "Kami akan menghadapi musuh-musuh kami di perbatasan dan yakin bahwa saudara-saudara kami di Latvia dan Lituania tidak akan jatuh. Betapapun ambisiusnya rencana ini, kita tidak boleh membiarkan satu kaki pun wilayah kita diduduki oleh Soviet atau Jerman lagi."
 EST_fight_against_communism: "Jangan Menyerah"
 EST_fight_against_communism_desc: "Kita telah menyaksikan seperti apa kehidupan di bawah pendudukan musuh dan banyak prajurit kita yang tewas dalam pertempuran sehingga kita tidak akan pernah melihatnya lagi. Dengan patriotisme yang tersebar luas di barisan kita, pasukan kita tidak akan jatuh secara diam-diam."
 EST_long_push_east: "Dorongan Panjang"
 EST_long_push_east_desc: "Kami tidak menyangka kampanye kami akan berjalan dengan baik, namun inilah kami; senapan di tangan dan mendorong ke wilayah inti musuh kita. Tanah mereka luas dan tanah kami kecil, dan ini akan menjadi perjalanan sulit yang harus kami persiapkan."
 EST_prepare_for_the_inevitable: "Bersiaplah untuk Hal yang Tak Terelakkan"
 EST_prepare_for_the_inevitable_desc: "Kita tidak bisa bertahan selamanya; sangat penting bagi kita untuk mempersiapkan pemerintah kita untuk pergi ke pengasingan dan mendukung upaya perlawanan [Root.GetAdjective] dari jauh."
 EST_forest_brothers: "Saudara Hutan"
 EST_forest_brothers_desc: "Kita mendengar cerita tentang militan anti-komunis di seluruh Negara Baltik yang bersembunyi di pepohonan pada musim dingin dan melakukan serangan demi serangan terhadap tentara pendudukan. Kita harus menjalin komunikasi dengan para pejuang kemerdekaan ini dan melakukan apa yang kita bisa untuk mendukung upaya mereka di wilayah Baltik."
 EST_prepare_underground_resistance: "Siapkan Perlawanan Industri"
 EST_prepare_underground_resistance_desc: "Pabrik-pabrik besar di seluruh [Root.GetNonIdeologyName] ditutup dan dikuasai oleh musuh sehingga sangat penting bagi kita untuk mencari investasi industri dan peralatan dari luar negeri sehingga kita dapat terus memproduksi senjata untuk perlawanan kita; bahkan jika kita harus bertarung secara rahasia."
 EST_prepare_covert_resistance: "Siapkan Perlawanan Terselubung"
 EST_prepare_covert_resistance_desc: "Perlawanan lebih dari sekedar manusia dan senapan; hal ini menyabotase jalur pasokan, melakukan kontak dengan kelompok perlawanan, dan membuat musuh kita terpencar dan kebingungan sementara peluru kita mengenai sasarannya. Kita harus berinvestasi dalam intelijen [Root.GetAdjective] jika kita ingin merebut kembali tanah air."
 EST_rally_the_nation: "Kumpulkan Bangsa"
 EST_rally_the_nation_desc: "Gerakan Vaps adalah gerakan para veteran perang kemerdekaan Estonia dan kami telah dilumpuhkan secara keliru di bawah rezim Konstantin Päts. Jika kita ingin menciptakan Estonia yang bermanfaat bagi rakyat Estonia, kita harus membuat diri kita dikenal dunia. Kita harus bergerak melintasi negara dan memberi tahu semua orang bahwa kita ada di sini. Kami adalah orang-orang yang memperjuangkan keberadaan Estonia dan kami berhak untuk didengarkan."
 EST_march_on_talinn: "Pawai di Tallinn"
 EST_march_on_talinn_desc: "Dengan banyaknya kelompok veteran dan paramiliter di Estonia yang sudah berpihak pada kami, kami tetap yakin bahwa Konstantin Päts tidak akan mampu melawan kami saat kami tiba di Tallinn. Kami akan berbaris ke Riigikogu dan, dengan tegas, mendeklarasikan pemerintahan Vapsid yang bersatu di bawah Artur Sirk."
 EST_glory_of_war: "Kemuliaan Perang"
 EST_glory_of_war_desc: "Kami adalah pemerintahan yang terdiri dari para veteran, tetapi banyak anggota Vapsid yang terlalu tua atau lelah karena cedera mereka untuk kembali ke dinas aktif. Mungkin anjing perang tua ini dapat menemukan tujuan baru dalam melatih generasi baru tentara Estonia dalam cara berperang."
 EST_mobilize_the_vets: "Memobilisasi para Veteran"
 EST_mobilize_the_vets_desc: "Banyak veteran Estonia tidak diberi hak untuk mendaftar dinas aktif karena hubungan mereka dengan gerakan Vaps. Sekarang setelah kita mengambil alih pemerintahan, kita dapat memberikan hak kepada orang-orang ini untuk mengabdi."
 EST_vapsid_youth: "Pemuda Vapsid"
 EST_vapsid_youth_desc: "Mayoritas masyarakat Vaps sudah jauh melewati masa puncaknya, namun kaum muda sangat terpesona oleh perjuangan bersejarah kemerdekaan yang menjadi ciri khas Estonia beberapa dekade lalu. Dengan mendirikan Vapsid Youth, kami akan memberikan para pemuda yang antusias ini sebuah tempat di mana mereka dapat berharap untuk meraih kembali kejayaan ayah dan kakek mereka."
 EST_veterans_government: "Pemerintahan Veteran"
 EST_veterans_government_desc: "Kabinet menteri sebelumnya berkemauan lemah dan tunduk pada keinginan Konstantin Päts. Kita membutuhkan kabinet menteri baru, mereka yang bersimpati pada perjuangan Vapsid."
 EST_anti_communist_militia: "Milisi Anti-Komunis"
 EST_anti_communist_militia_desc: "Negara ini dipenuhi oleh orang-orang yang bersedia melawan ancaman Bolshevik di wilayah timur, namun ditolak oleh pemerintah lama karena dianggap terlalu radikal. Bagi kaum Vaps, tidak ada pemikiran anti-komunis yang terlalu radikal, dan orang-orang ini layak mendapat tempat di tentara kita sama seperti orang lain."
 EST_reach_out_to_germany: "Jangkau Jerman"
 EST_reach_out_to_germany_desc: "Jika kita bisa melawan Soviet hanya dengan semangat dan kekuatan, besok Uni Soviet akan terpecah belah. Namun sayangnya, Estonia kekurangan tenaga untuk mempertahankan diri dari ancaman yang begitu besar. Mungkin dengan bersekutu dengan Jerman, kita bisa bertahan hingga dekade berikutnya."
 EST_baltic_shield: "Perisai Baltik"
 EST_baltic_shield_desc: "Soviet ingin menghancurkan Estonia di bawah pengaruh imperialisme, tapi kita tidak bisa membiarkan hal itu terjadi. Bunker harus dibangun di sepanjang perbatasan, kita mungkin tidak bisa mengalahkan Soviet, tapi setidaknya kita bisa bertahan cukup lama agar orang lain bisa mengalahkannya."
 EST_join_the_axis: "Bergabunglah dengan Poros"
 EST_join_the_axis_desc: "Kini setelah Jerman yakin akan niat kami, kami tetap yakin bahwa masuknya Estonia ke Poros adalah hal yang wajar."
 EST_the_brotherhood: "Persaudaraan"
 EST_the_brotherhood_desc: "Estonia tidak berada dalam ruang hampa, dan di Selatan kita terdapat dua negara yang sangat rentan dan mungkin akan lebih mampu bertahan hidup jika mereka diintegrasikan ke dalam negara Estonia. Negara-negara Baltik adalah saudara, dan sebagai saudara, kita harus bersatu."
 EST_empower_finnish_militants: "Memberdayakan Militan Finlandia"
 EST_empower_finnish_militants_desc: "Gerakan Vaps tidak akan mungkin terjadi tanpa bantuan para veteran Finlandia di utara. Para sukarelawan Finlandia membantu Estonia untuk memperoleh kemerdekaannya, dan sekarang para veteran ini, seperti kita, berusaha menggulingkan pemerintah mereka yang berkemauan lemah dan mendirikan pemerintahan yang menguntungkan Finlandia."
 EST_national_pride_in_finland: "Pawai Kebanggaan Nasional di Finlandia"
 EST_national_pride_in_finland_desc: "Para veteran Finlandia tidak memiliki organisasi seperti yang kita miliki, jadi mungkin dukungan pasif kita terhadap mereka saja tidak cukup untuk membawa perubahan seperti yang kita lihat di Estonia. Dengan mengorganisir pawai di Finlandia, suatu hari kita mungkin melihat kedua negara kita bersatu di bawah pahlawan perang terakhir."
 EST_finno_estonian_supremacy_league: "Liga Supremasi Finno-Estonia"
 EST_finno_estonian_supremacy_league_desc: "Kini setelah pemerintahan Finlandia yang lama sudah berlalu, kita dapat memanfaatkan hubungan erat yang telah kita buat di pemerintahan Finlandia yang baru untuk menciptakan landasan bagi persahabatan yang langgeng berdasarkan pemerintahan mandiri dan sentimen anti-Bolshevik."
 EST_unite_our_nations: "Satukan Bangsa Kita"
 EST_unite_our_nations_desc: "Dengan Finlandia kini berada di tangan para veterannya, dan pengaruh kita terjalin erat dalam struktur pemerintahan Finlandia yang baru, yang perlu kita lakukan hanyalah melakukan beberapa hal dan kita akan mampu menyatukan rakyat kita menjadi satu negara."
 EST_sieze_swedish_assets: "Rebut Aset Swedia"
 EST_sieze_swedish_assets_desc: "Swedia hanya menggunakan aset mereka dan tidak melakukan apa pun kecuali memasok kekuatan apa pun yang tampaknya paling mengintimidasi mereka. Pemborosan sumber daya alam Skandinavia ini tidak dapat berlangsung lagi, mereka harus ditahan di Estonia."
 EST_secure_the_straits: "Amankan Selat"
 EST_secure_the_straits_desc: "Denmark memblokir perjalanan kami ke Atlantik dan harus disingkirkan jika kapal Estonia ingin melakukan perjalanan di Laut Utara."
 EST_occupy_norway: "Menempati Norwegia"
 EST_occupy_norway_desc: "Dengan Swedia dan Finlandia di kantong kita, yang perlu kita lakukan hanyalah menundukkan Norwegia dan keseluruhan daratan Skandinavia akan berada di bawah kendali Estonia."
 EST_form_scandinavia: "Estonia adalah Skandinavia"
 EST_form_scandinavia_desc: "Banyak orang di wilayah Utara memandang klaim Estonia atas identitas Skandinavia hanya sekedar lelucon, namun dengan seluruh anak benua itu kini berada di bawah kendali kita, siapa yang masih bisa tertawa? Dengan Swedia, Norwegia, dan Denmark berada di bawah kekuasaan Estonia, tidak ada seorang pun di sini yang dapat menghentikan kita untuk mengklaim Skandinavia!"
 EST_proclaim_finno_ugra: "Proklamasikan Finno-Ugria"
 EST_proclaim_finno_ugra_desc: "Dengan Finlandia yang kini berada di bawah kendali kami, kami berdiri dalam posisi unik untuk mengkonsolidasikan identitas Finlandia di negara kami. Ada banyak sekali suku Finno-Ugric di seluruh Eropa Utara dan dengan menyatukan identitas ini, kami siap mendatangkan tentara baru yang tak terhitung jumlahnya untuk berperang demi perjuangan Vapsid."
 EST_unite_the_sami: "Satukan Sámi"
 EST_unite_the_sami_desc: "Suku Sámi adalah kelompok masyarakat yang sangat tertindas dan tersebar di Finlandia, Swedia, Norwegia, dan Rusia. Sudah terlalu lama orang Sámi tidak diberi hak untuk berbicara dalam bahasa Finlandia dan mereka kekurangan tenaga yang dibutuhkan untuk melawan penindas mereka. Kita harus mengkonsolidasikan Sámi di dalam negara kita untuk melindungi mereka dari imperialisme Nordik."
 EST_unite_karelia: "Satukan Karelia"
 EST_unite_karelia_desc: "Karelia penuh dengan orang Finlandia; dari orang Karelia sendiri hingga orang Sámi Timur. Dengan Finlandia di bawah kendali kami, kami mungkin masih mampu memperluas negara kami hingga ke Karelia dan menyatukan rakyat Finlandia di dalamnya."
 EST_unite_the_finnic_identity: "Satukan Identitas Finlandia"
 EST_unite_the_finnic_identity_desc: "Dengan seluruh penduduk utama Finlandia di anak benua Skandinavia berada di bawah kendali kami, kami dapat menyatukan identitas Finlandia dan mendeklarasikan sebuah negara baru yang dapat dijadikan rumah bagi penduduk Estonia, Finlandia, Sámi, Nenets, dan semua orang Finno-Ugric lainnya."
 EST_break_the_silence: "Pecahkan Keheningan"
 EST_break_the_silence_desc: "Konstantin Päts mendirikan kediktatoran ini dengan kedok melindungi Estonia dari fasisme dan komunisme. Kini, setelah ideologi-ideologi ini menjadi tidak relevan lagi, tidak ada lagi alasan bagi kediktatoran untuk terus berlanjut dan pemilihan umum yang bebas harus dibuka kembali."
 #Lithuania
 LIT_secure_a_loyal_cabinet: "Kumpulkan kembali Seimas"
 LIT_secure_a_loyal_cabinet_desc: "Dengan berhasilnya kudeta dan kendali mutlak Antanas Smetona atas pemerintahan, inilah saatnya kita mengumpulkan kembali Seimas untuk memerintah negara dengan lebih efisien, dengan menteri-menteri yang setia di sisi Diktator."
 LIT_rastikis_military_reforms: "Reformasi Militer Rastiki"
 LIT_rastikis_military_reforms_desc: "Militer tidak siap menghadapi ancaman besar dan parah yang akan ditimbulkan oleh invasi Jerman lainnya dan sangat penting bagi pemerintah militer untuk memberikan kepemimpinan yang kompeten kepada orang-orang patriotik di tentara Lituania."
 LIT_patriotic_education: "Pendidikan Patriotik"
 LIT_patriotic_education_desc: "Sektor pendidikan di Lituania telah mengalami masa-masa yang lebih baik, namun kita tidak bisa membiarkan ide-ide merajalela di kalangan generasi muda. Kaum muda harus dididik dengan baik sebagai umat Katolik Lituania yang patriotik di lembaga-lembaga bagus seperti Rytas."
 LIT_soviet_mutual_assistance: "[SOV.GetAdjective] Gotong Royong"
 LIT_soviet_mutual_assistance_desc: "Polandia adalah target utama Soviet dan Jerman, dan semua orang mengetahuinya. Kami telah mendengar bisik-bisik bahwa ada rencana untuk membagi Polandia menjadi dua kekuatan, dan mungkin kami dapat membujuk Soviet untuk mencari dukungan Lituania dalam upaya mereka dengan imbalan kembalinya Vilnius ke pemilik sahnya."
 LIT_victory_in_trust: "Kemenangan dalam Kepercayaan"
 LIT_victory_in_trust_desc: "Tidak ada seorang pun yang dapat kita percayai pada pemerintahan kita; bukan Kazys Grinius, bukan Augustinas Voldemaras, bahkan Rastiki pun tidak. Orang kuat itu pengecut dan pengkhianat, tapi senapan dan orang yang baik menembakkannya? Bahwa kita bisa percaya dan itu akan memberi kita kemenangan."
 LIT_integrate_the_opposition: "Integrasikan Oposisi"
 LIT_integrate_the_opposition_desc: "Meskipun Antanas Smetona memandang pemerintahan sebelumnya sebagai kabinet yang terdiri dari politisi yang tidak kompeten dan simpatisan Soviet, sulit untuk menyangkal bahwa ada sejumlah orang yang kompeten di jajaran mereka dan akan sangat bodoh jika tidak memanfaatkan mereka dalam Seimas yang baru."
 LIT_patriotic_socialism: "Sosialisme Patriotik"
 LIT_patriotic_socialism_desc: "Pemerintahan demokratis sebagian besar terdiri dari kaum Sosial Demokrat dan kaum sentris, dan cita-cita sosialisme mengotori pikiran para pekerja Lituania. Meskipun Kazys Grinius jelas merupakan seorang sosialis, tidak dapat disangkal semangat patriotiknya dan mungkin dengan menerapkan beberapa idenya, pekerja Lituania dapat menjadi lebih produktif dan lebih mendukung Kediktatoran."
 LIT_peace_with_poland: "Perdamaian dengan Polandia"
 LIT_peace_with_poland_desc: "Secara resmi, perang antara Polandia dan Lituania telah berlangsung selama beberapa dekade, namun tidak ada pihak yang terlibat dalam pertempuran selama sebagian besar durasi perang. Meskipun Vilnius masih berada di tangan mereka, kita harus mengubah kebuntuan ini menjadi perdamaian formal untuk fokus pada musuh sejati kita di Timur dan Barat."
 LIT_strength_in_unity: "Kekuatan dalam Persatuan"
 LIT_strength_in_unity_desc: "Kami berdiri teguh ketika kami bersama dan tidak ada dua negara yang memiliki ikatan seperti Polandia dan Lituania. Meskipun kita tidak akan pernah membiarkan diri kita terjebak dalam Persemakmuran lagi, mungkin kedua negara kita dapat bekerja sama sebagai teman, melindungi kemerdekaan mereka yang rapuh."
 LIT_indivisible_power_of_the_state: "Kekuasaan Negara yang Tak Terpisahkan"
 LIT_indivisible_power_of_the_state_desc: "Saya adalah negara, negara adalah saya. Dengan tegasnya hukum dan aturan kediktatoran, yang tersisa hanyalah memastikan bahwa kekuasaan diktator bersifat absolut. Meskipun beberapa orang menginginkan kembalinya demokrasi, kami tahu ini adalah ide yang berbahaya dan bodoh, sementara nafas kolektif beruang dan elang sedang panas-panasnya di leher Lituania."
 LIT_purge_popular_resistance: "Bersihkan Perlawanan Rakyat"
 LIT_purge_popular_resistance_desc: "Ada unsur-unsur jahat di kalangan masyarakat kita yang menentang Smetona dan kediktatorannya. Orang-orang ini adalah musuh kemerdekaan Lituania dan harus dibasmi untuk menjamin keberlangsungan stabilitas dan kelangsungan hidup bangsa kita."
 LIT_anti_communist_militia: "Milisi Anti-Komunis"
 LIT_anti_communist_militia_desc: "Ini adalah ambisi kami untuk membersihkan negara kami dari unsur-unsur sayap kiri, dan untungnya sudah ada sukarelawan di seluruh negeri yang memiliki ambisi yang sama. Yang perlu kita lakukan hanyalah mendukung organisasi-organisasi anti-kiri ini dan mereka akan melakukan semua pekerjaan untuk melindungi kita dari Soviet!"
 LIT_arrest_nazis_in_memel: "Tangkap Nazi di Memel"
 LIT_arrest_nazis_in_memel_desc: "Memel penuh dengan Nazi dan simpatisan fasis dan hal ini menciptakan preseden bagi invasi Jerman. Jika kita ingin menguasai wilayah Memel, maka kita harus menjadikan keanggotaan partai Nazi sebagai kejahatan yang dapat dihukum penjara dan membuat persiapan yang memadai untuk kemungkinan invasi Nazi."
 LIT_reminder_of_true_enemy: "Pengingat akan Musuh Sejati"
 LIT_reminder_of_true_enemy_desc: "Selama perang tahun 1918, kami menghadapi penindasan brutal oleh Tentara Merah dan Freikorps dan dengan perang yang akan segera terjadi, kenangan pahit yang pahit membakar pikiran para menteri Lituania. Kita tidak bisa menunda, kita harus memutuskan kekuatan mana yang merupakan ancaman terbesar kita dan membuat persiapan yang memadai untuk perang!"
 LIT_appease_soviets: "Tenangkan Rusia"
 LIT_appease_soviets_desc: "Meskipun kami telah mencoba segala upaya untuk mempersiapkan perang, kami harus mengakui kekalahan jika ingin menyelamatkan nyawa orang Lituania."
 LIT_appease_nazis: "Tenangkan Jerman"
 LIT_appease_nazis_desc: "Meskipun kami telah mencoba segala upaya untuk mempersiapkan perang, kami harus mengakui kekalahan jika ingin menyelamatkan nyawa orang Lituania."
 LIT_offer_military_basing: "Tawarkan Hak Mendasarkan"
 LIT_offer_military_basing_desc: "Hal terakhir yang kami inginkan adalah perang lagi. Lituania menawarkan kepentingan strategis bagi Jerman dan Soviet, dan mungkin dengan menawarkan akses dan hak mendasarkan diri di negara kita serta kemampuan untuk membangun dan menggunakan bunker, kita dapat menghindari invasi."
 LIT_offer_military_basing_tt_1: "§GTergantung siapa yang ditenangkan:§!"
 LIT_offer_military_basing_tt_2: "§ROR§!"
 LIT_occupation: "Pekerjaan"
 LIT_occupation_desc: "Sudah terlambat bagi kita. Negara ini penuh dengan tentara musuh yang dapat memilih untuk menyerang kita kapan saja. Mungkin sudah waktunya bagi para pemimpin dan pemerintah kita untuk mengundurkan diri dan kita membiarkan musuh kita melakukan apa pun yang mereka inginkan terhadap kita."
 LIT_free_voldemares: "Voldemara gratis"
 LIT_free_voldemares_desc: "Mungkin Smetona terlalu terburu-buru dalam menangkap mantan Perdana Menterinya. Voldemaras jelas merupakan teman kemerdekaan Lituania dan kita akan bodoh jika tidak memanfaatkan keahliannya dan pengikut setianya dalam pemerintahan kita."
 LIT_lithuanian_activist_front: "Front Aktivis Lituania"
 LIT_lithuanian_activist_front_desc: "Terdapat banyak aktivis dan kelompok paramiliter di seluruh Lituania, meskipun mereka berbeda dan dipisahkan oleh ideologi, namun yang mereka miliki adalah semangat untuk memperjuangkan Lituania dan mempertahankan kemerdekaannya. Dengan membentuk Front Aktivis Lituania, kita akan menjadikan Lituania bukan sasaran empuk untuk dijarah oleh kekuatan imperialis."
 LIT_organize_the_iron_wolf: "Atur Serigala Besi"
 LIT_organize_the_iron_wolf_desc: "Serigala Besi tetap terpencar dan tidak terorganisir dan, seperti Voldemaras sendiri, ragu-ragu apakah mereka mendukung pemerintah atau ingin menggulingkannya. Dengan memberikan visi dan tujuan yang pasti kepada Serigala Besi, kami akan menjadikan anak-anak yang hilang ini sebagai manusia."
 LIT_new_kind_of_iron_wolf: "Serigala Besi Jenis Baru"
 LIT_new_kind_of_iron_wolf_desc: "Kini setelah ancaman Serigala Besi telah diatasi, kita dapat memperoleh kembali simbol nasional kita dan menunjukkannya dengan bangga di seluruh angkatan bersenjata kita."
 LIT_lithuanian_youth: "Pemuda Serigala Besi"
 LIT_lithuanian_youth_desc: "Militer membutuhkan laki-laki, namun di era ideologi ini, kita perlu menanamkan ide-ide patriotik ke dalam kepala anak-anak kita sehingga ketika mereka sudah cukup umur, yang mereka perlukan hanyalah senapan dan mereka dengan senang hati akan mati demi satu inci tanah Lituania."
 LIT_rapid_fortifications_in_the_east: "Benteng Cepat di Timur"
 LIT_rapid_fortifications_in_the_east_desc: "Jelas bahwa ancaman paling mendesak terhadap kelanjutan kemerdekaan kita adalah komunis dan kita harus melakukan semua yang kita bisa untuk membela negara kita dari ancaman yang mereka timbulkan."
 LIT_defence_from_above: "Pertahanan Dari Atas"
 LIT_defence_from_above_desc: "Benteng kita sama sekali tidak ada gunanya jika musuh terus membombardirnya dari langit. Kita harus mempersiapkan pertahanan dan membalas tembakan ke udara untuk setiap bom dan peluru yang dijatuhkan dari atas."
 LIT_exile_voldemares: "Pengasingan Voldemaras"
 LIT_exile_voldemares_desc: "Dengan Augustinas Voldemaras yang aman di balik jeruji besi, orang akan mengira ancaman dari Serigala Besi tidak akan berpengaruh, namun organisasinya masih melakukan agitasi untuk pembebasannya dan merupakan ancaman aktif di negara ini. Jika Voldemaras dibebaskan tetapi dilarang memasuki Lituania lagi, gerakan Serigala Besi pasti akan kehilangan daya tariknya dan kita akan terbebas dari ancaman yang mereka timbulkan."
 LIT_root_out_the_iron_wolf: "Singkirkan Serigala Besi"
 LIT_root_out_the_iron_wolf_desc: "Meskipun pengasingan Voldemaras telah menghentikan upaya Serigala Besi di masa depan untuk menggulingkan pemerintah, organisasi tersebut masih tetap ada dan orang-orang ini harus disingkirkan dari pinggiran politik untuk memastikan masa depan yang stabil bagi militer Lituania."
 LIT_prepare_forest_brothers: "[Root.Get_Forest_Focus_Loc]"
 LIT_prepare_forest_brothers_desc: "[Root.Get_Forest_Focus_desc_Loc]"
 LIT_unify_the_military: "Satukan Militer"
 LIT_unify_the_military_desc: "Beberapa militer Lituania sangat terpesona dengan Voldemaras dan kelompok paramiliter Serigala Besi miliknya. Sedemikian rupa sehingga yang diperlukan hanyalah undangan dan hampir seluruh militer Lituania akan berada di bawah pengaruh Iron Wolf. Dengan ini, kami akhirnya bisa menggulingkan Smetona dari pemerintahan dan merebut kembali Lituania!"
 LIT_seek_ties_with_germany: "Mencari Hubungan dengan Jerman"
 LIT_seek_ties_with_germany_desc: "Meskipun secara resmi merupakan musuh bagi negara Lituania, Jerman juga merupakan musuh kita; Polandia. Dengan menjangkau Jerman, mungkin kita bisa mendapatkan kembali saudara-saudara kita di Lituania yang hilang yang saat ini diduduki oleh Polandia."
 LIT_fortify_memel: "Perkuat Memel"
 LIT_fortify_memel_desc: "Jerman tidak bisa dipercaya untuk mempertahankan kedaulatan Lituania seperti halnya seekor rubah tidak bisa dipercaya untuk mempertahankan kudeta! [GER.GetLeader] adalah musuh negara Lituania dan bukan rahasia lagi jika Memel menjadikan kami sasaran agresi Jerman!"
 LIT_proclaim_greater_lithuania: "Proklamasikan Lituania Raya"
 LIT_proclaim_greater_lithuania_desc: "Lituania pernah menjadi salah satu kekuatan terbesar di Eropa, namun sejak kita ditebang dan dikebiri oleh Polandia berabad-abad yang lalu, kita tidak mampu mengembalikan kejayaan kita sebelumnya, tapi sekarang tidak lagi. Lithuania akan menjadi kekuatan terbesar di Eropa sekali lagi!"
 LIT_claim_livonia: "Klaim Livonia"
 LIT_claim_livonia_desc: "Di utara terdapat dua negara muda yang belum merdeka selama berabad-abad. Mereka pasti akan lebih baik dibimbing oleh tangan Lituania…"
 LIT_claim_lithuania_minor: "Mengajukan Klaim ke Lituania Bawah"
 LIT_claim_lithuania_minor_desc: "Wilayah yang diberi nama palsu oleh orang Jerman \"Königsberg\" sebenarnya adalah rumah leluhur orang Lituania. Lituania Kecil telah berada di bawah pendudukan Jerman sejak Perang Salib Baltik dan harus direklamasi."
 LIT_demand_vilnius: "Permintaan Vilnius"
 LIT_demand_vilnius_desc: "Sudah terlalu lama ibu kota tradisional Lituania dikuasai oleh musuh-musuh kita di Polandia dan pemerintah kita terlalu berkemauan lemah untuk berbuat apa pun, namun kini tidak lagi. Vilnius akan menjadi orang Lituania lagi!"
 LIT_support_polish_fascists: "Mendukung Fasis Polandia"
 LIT_support_polish_fascists_desc: "Polandia mempunyai musuh yang sama dengan kita, dan kita tidak boleh melupakan tahun-tahun kekerabatan yang menjadi ciri sejarah Polandia-Lithuania, dan kita harus mendukung fasisme di negara Polandia."
 LIT_invade_poland: "Menyerang Polandia"
 LIT_invade_poland_desc: "Selama berabad-abad, Lituania terbelenggu dalam apa yang disebut \"Persemakmuran\" di mana Polandia memegang kekuasaan mayoritas. Rakyat Polandia sangat ingin kembali ke keadaan seperti ini, dan mungkin inilah saatnya kita memberi mereka Persemakmuran yang mereka idamkan."
 LIT_request_polish_occupation: "Minta Pekerjaan Polandia"
 LIT_request_polish_occupation_desc: "Selama beberapa dekade terakhir, gagasan tentang negara Polandia yang tidak mencakup Lituania digambarkan sebagai hal yang tidak terpikirkan dan kedaulatan Lituania hanya menjadi bahan lelucon bagi para politisi Polandia masa kini, jadi mungkin mereka akan sangat puas dengan pendudukan Lituania atas negara mereka yang menyedihkan."
 LIT_restore_order: "Pulihkan Pesanan"
 LIT_restore_order_desc: "Dahulu kala, Lituania adalah mitra terbesar dalam apa yang disebut \"Persemakmuran\", dan Polandia hanyalah bagian kecil dari sebuah negara di perbatasan kami. Sudah saatnya kita memulihkan dunia seperti seharusnya."
 LIT_restore_greater_lithuania: "Pulihkan Lituania Raya"
 LIT_restore_greater_lithuania_desc: "Dengan banyaknya kolaborator di Timur yang bersemangat untuk menjabat atas nama kami, yang tersisa hanyalah mengisi pemerintah daerah dengan loyalis dan memproklamirkan era baru dominasi Lituania atas Ruthenia!"
 LIT_prepare_resistance: "[Root.Get_Ready_Resistance_Focus_Loc]"
 LIT_prepare_resistance_desc: "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LIT_underground_production_centers: "[Root.Get_Underground_Resistance_Focus_Loc]"
 LIT_underground_production_centers_desc: "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LIT_infiltrate_homeland: "[Root.Get_Covert_Resistance_Focus_Loc]"
 LIT_infiltrate_homeland_desc: "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LIT_a_corporatist_economy: "Ekonomi Korporatis"
 LIT_a_corporatist_economy_desc: "Barat mengharapkan liberalisme ekonomi yang cepat di negara Lituania. Namun Antanas Smetona lebih menyukai kontrol dan sentralisasi yang dibawa oleh model korporatis."
 LIT_a_martial_prime_minister: "Seorang Perdana Menteri Bela Diri"
 LIT_a_martial_prime_minister_desc: "Jabatan Perdana Menteri biasanya dipegang oleh pejabat politik terpilih, namun di masa perang dan dengan bertambahnya kekuasaan Presiden, kita harus memilih pemimpin yang kuat untuk menjadi tangan kanan [ROOT.GetLeader]!"
 LIT_a_priestly_prime_minister: "Seorang Perdana Menteri yang Imam"
 LIT_a_priestly_prime_minister_desc: "Mantan anggota dewan dan sekarang menjadi pendeta, Vladas Mironas adalah kandidat ideal untuk mewakili Partai Nasional sebagai Perdana Menteri. Posisinya di gereja Katolik dan dedikasinya terhadap kaum tani dan pertanian menjadikannya kandidat populer di kalangan kelas bawah Lituania."
 LIT_formalize_baltic_entente: "[Root.Get_Baltic_Entente_Focus_Loc]"
 LIT_formalize_baltic_entente_desc: "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LIT_beyond_the_baltic: "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LIT_beyond_the_baltic_desc: "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LIT_enforce_military_rule: "Menegakkan Aturan Perang"
 LIT_enforce_military_rule_desc: "Lituania tidak sendirian dalam perjuangan kemerdekaannya. Latvia dan Estonia juga dikelilingi oleh musuh yang sama seperti kita, namun pemerintah mereka tidak memiliki kekuatan untuk melakukan apa yang diperlukan untuk membela rakyatnya. Kita harus menegakkan aturan militer di seluruh Baltik."
 LIT_expand_military_budget: "Perluas Anggaran Militer"
 LIT_expand_military_budget_desc: "Keluhan yang umum di kalangan anggota militer adalah upah mereka yang relatif rendah dibandingkan dengan mereka yang bekerja di pemerintahan sipil. Dengan Raštikis menduduki jabatan Perdana Menteri, waktunya telah tiba untuk memberikan anggaran yang dibutuhkan tentara."
 LIT_exploit_the_international_bank: "Memanfaatkan Bank Internasional"
 LIT_exploit_the_international_bank_desc: "Sebagai anggota Bank Internasional, Antanas Smetona berada pada posisi prima untuk mengeksploitasi sektor perbankan untuk kepentingan negara. Di masa perang yang akan datang ini, pilihan apa yang kita miliki?"
 LIT_join_the_allies: "Bergabunglah dengan Sekutu"
 LIT_join_the_allies_desc: "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LIT_lithuanian_preservationism: "Preservasionisme Lituania"
 LIT_lithuanian_preservationism_desc: "Republik Lituania masih muda dan masih menemukan tempatnya di dunia. Banyak orang akan melihatnya tunduk pada Komunisme, Fasisme, atau Liberalisme, namun kita harus menghindari dorongan untuk menyerah pada pengaruh asing tersebut. Lituania yang benar-benar merdeka harus menemukan jalannya sendiri."
 LIT_look_north: "[Root.Get_Look_North_Focus_Loc]"
 LIT_look_north_desc: "[Root.Get_Look_North_Focus_desc_Loc]"
 LIT_martial_law: "Darurat Militer"
 LIT_martial_law_desc: "Kebebasan adalah sebuah kemewahan yang diberikan kepada negara-negara yang menikmati perdamaian, namun dengan adanya musuh di sekitar kita, Lituania mungkin tidak menikmati kemewahan tersebut."
 LIT_merge_the_military_and_civilian_governments: "Gabungkan Pemerintahan Militer dan Sipil"
 LIT_merge_the_military_and_civilian_governments_desc: "Kekuasaan bersama antara militer dan Presiden memang berguna untuk sementara waktu, namun Smetona dengan cepat kehilangan kegunaannya. Hanya pengalihan kekuasaan darurat kepada militer yang dapat menjamin kelangsungan keamanan Lituania."
 LIT_peasants_reform: "Reformasi Petani"
 LIT_peasants_reform_desc: "Kaum tani termasuk kelompok masyarakat termiskin di Lituania, meskipun mereka menyumbang sebagian besar kekayaan ekonomi negara tersebut. Dengan Vladas Mironas sebagai Perdana Menteri dan kepala pertanian, kita dapat memberikan kondisi hidup yang jauh lebih baik kepada kelas petani kita."
 LIT_presidential_reform: "[GetLithuanianPowerIdeaAdj] Reformasi"
 LIT_presidential_reform_desc: "Politik partai telah lama mengganggu negara Lituania, sehingga membatasi kekuasaan [GetLithuanianLeaderTitle]. [GetLithuanianLeaderTitle] Lituania yang baru harus berada di luar pertengkaran partai politik dan hanya menjadi milik Lituania sendiri."
 LIT_restore_public_elections: "Pulihkan Pemilu Umum"
 LIT_restore_public_elections_desc: "Pemerintahan diktator atas Lituania memang berguna selama beberapa waktu, namun dengan kondisi negara yang kini sudah stabil, rakyat berhak untuk didengarkan. Kami sering bertengkar di antara kami sendiri tentang apa artinya menjadi orang Lituania, tapi mungkin kami harus bertanya kepada orang-orang."
 LIT_state_media: "Media Negara"
 LIT_state_media_desc: "Seringkali penerbitan surat kabar dipenuhi dengan propaganda fasis dan komunis. Masyarakat umum harus didorong untuk membaca publikasi yang disetujui negara; satu-satunya sumber kebenaran yang dapat diandalkan."
 LIT_the_nation_and_its_power: "Bangsa dan Kekuasaannya"
 LIT_the_nation_and_its_power_desc: "Pertengkaran para Seima hanyalah penghalang bagi kekuatan [GetLithuanianLeaderTitle]. Jika kita ingin membangun bangsa yang mampu mempertahankan diri, kita harus memberikan kekuasaan absolut kepada [GetLithuanianLeaderTitle]."
 LIT_the_nationalist_council: "Dewan Nasionalis"
 LIT_the_nationalist_council_desc: "Presiden kita sudah resmi bukan bagian dari partai politik mana pun, namun para Seima masih bertengkar satu sama lain seperti anak-anak impoten. Mereka harus didorong untuk berkolaborasi dengan [ROOT.GetRulingParty] jika tidak, mereka akan segera mengundurkan diri."
 LIT_support_monarchism_in_POL: "Mendukung Monarki di Polandia"
 LIT_support_monarchism_in_POL_desc: "Sama seperti Lituania, Polandia dimaksudkan untuk memilih dirinya sendiri sebagai Raja baru. Berbeda dengan Lituania, Polandia gagal menemukan raja yang cocok untuk menduduki takhta mereka, namun kita bisa memberikan rakyat Polandia penguasa kuat yang dijanjikan; seseorang yang akan membela Polandia dari imperialisme Jerman."
 LIT_king_of_poland: "Kerajaan Polandia"
 LIT_king_of_poland_desc: "Waktunya telah tiba; masyarakat Polandia telah tergerak untuk menentang [POL.GetLeader] dan para pendukung monarki siap menyampaikan tuntutan mereka kepada pemerintah. Dengan dukungan Lituania, mereka akan melihat [Root.GetLeader] sebagai penguasa yang ditunjuk oleh Tuhan."
 LIT_arm_monarchist_militants: "Persenjatai Militan Monarkis"
 LIT_arm_monarchist_militants_desc: "Kami tahu ada orang-orang di seberang perbatasan kami yang ingin melihat [Root.GetLeader] membawa ketertiban dan kesejahteraan bagi bangsa mereka seperti yang [Root.GetLeader.GetSheHe] berikan kepada kami! Kita harus bersedia mempersenjatai para militan monarki ini sehingga mereka dapat berjuang untuk membawa raja mereka yang sah naik takhta."
 LIT_POL_union: "Pulihkan Persemakmuran"
 LIT_POL_union_desc: "Dengan [Root.GetLeader] sebagai Raja Polandia dan Lituania, yang tersisa hanyalah menggabungkan Seimas dengan Sejm lagi dan Persemakmuran Polandia-Lithuania akan lahir kembali."
 LIT_expand_lithuanian_shipyards: "Perluas Galangan Kapal Lituania"
 LIT_expand_lithuanian_shipyards_desc: "Dengan Polandia berada di bawah kendali kami, kami diberi kesempatan untuk memperluas kapasitas angkatan laut kami dan bersaing untuk mendominasi Laut Baltik."
 LIT_lithuanian_rail: "Kereta Api Polandia-Lithuania"
 LIT_lithuanian_rail_desc: "Perjalanan antar serikat pekerja harus menjadi masalah sepele jika Polandia dan Lituania ingin benar-benar bersatu. Dengan bergabung dengan perkeretaapian kami, kami akan meningkatkan rantai pasokan dan kapasitas industri kami secara signifikan."
 LIT_push_for_ruthenia: "Dorong Melalui Ruthenia"
 LIT_push_for_ruthenia_desc: "Jaringan kereta api di Ukraina dan Belarusia sangat terbengkalai, namun wilayah-wilayah ini merupakan bagian dari Persemakmuran seperti halnya wilayah lainnya. Kita harus berinvestasi pada jalur Timur jika kita ingin menembus Uni Soviet dan merebut kembali wilayah yang menjadi milik kita."
 LIT_warsaw_to_crimea_railway: "Kereta Api Warsawa ke Krimea"
 LIT_warsaw_to_crimea_railway_desc: "Dalam ambisi kita untuk memerintah dari laut ke laut, sangat penting bahwa setiap wilayah yang kita ambil menjadi bagian yang terintegrasi penuh dari negara kita. Perbatasan alami kita terbentang dari Utara ke Selatan, Timur ke Barat, dan ambisi untuk menghubungkan Krimea dengan jalur kereta api akan memperkuat pemahaman kita terhadap wilayah tersebut."
 LIT_merge_the_arms_industries: "Gabungkan Industri Senjata"
 LIT_merge_the_arms_industries_desc: "Produsen senjata Polandia dan Lituania telah memproduksi senjata secara terpisah selama beberapa dekade, namun kini setelah negara kita menjadi satu, kita memiliki peluang untuk mengkhususkan industri dan menciptakan kolaborasi antara pabrik Polandia dan Lituania."
 LIT_merge_civilian_industries: "Gabungkan Industri Sipil"
 LIT_merge_civilian_industries_desc: "Dengan negara kita yang kini bersatu, tidak masuk akal bagi Lituania untuk membangun hanya untuk Lituania dan Polandia hanya untuk Polandia. Industri kita harus menjadi industri yang memajukan bangsa."
 LIT_claim_livonia_monarchy: "Klaim Livonia"
 LIT_claim_livonia_monarchy_desc: "Di antara negara-negara Baltik terdapat rasa persaudaraan dan persahabatan yang tidak dapat dipatahkan, dan kini setelah kita mempunyai seorang Raja di atas takhta kita, kita berdiri untuk mengklaim rasa persaudaraan itu sebagai hak ilahi kita."
 LIT_claim_greater_lithuania: "Klaim Lituania Raya"
 LIT_claim_greater_lithuania_desc: "Lituania yang kita kenal sekarang hanyalah bayangan dari Kadipaten Agung Lituania yang ada sebelumnya. Persemakmuran menggambarkan lebih dari sekedar persatuan Polandia dan Lituania, ini adalah persatuan Polandia, Lituania, Ukraina, dan Belarusia."
 LIT_greater_commonwealth: "Persemakmuran Besar"
 LIT_greater_commonwealth_desc: "Ambisi Persemakmuran jauh melampaui batas-batas sejarah Kerajaan yang telah lama hilang. Persemakmuran di hati masyarakat Polandia adalah kekuatan kekaisaran yang besar, sebuah kerajaan multikultural yang bersinar dari laut ke laut!"
 LIT_institute_royal_guards: "Bentuk Pengawal Kerajaan"
 LIT_institute_royal_guards_desc: "Dengan seorang raja yang kini duduk di atas takhta, sangat penting bagi kita untuk menemukan hanya orang-orang paling elit di antara jajaran tentara Lituania yang dapat dipercaya untuk melindungi pribadi raja kita tercinta."
 LIT_a_king_for_our_people: "Raja bagi Rakyat Kita"
 LIT_a_king_for_our_people_desc: "Antanas Smetona tidak bisa memerintah Lituania sendirian, dan meski banyak yang mengharapkan Presiden untuk menunjuk seorang Perdana Menteri, ada pilihan lain. Karl Gero von Urach adalah putra sah Mindaugas II dan dengan selubung pemerintahan Jerman tidak lagi menutupi kepala Lituania, tidak ada yang menghentikan kami untuk menobatkan Raja kami."
 LIT_a_new_noble_class: "Kelas Bangsawan Baru"
 LIT_a_new_noble_class_desc: "Bangsa kita sudah terlalu lama diperintah oleh politisi dan oligarki. Agar Raja dapat mengabdi pada Lituania, ia harus memiliki istana bangsawan yang setia untuk memimpinnya."
 LIT_abolish_the_presidency: "Hapuskan Kepresidenan"
 LIT_abolish_the_presidency_desc: "Sejauh ini, Smetona masih mempertahankan kekuasaan negaranya tetapi dengan semakin populernya Mindaugas III, tampaknya bijaksana jika jabatan Kepresidenan dihapuskan dan diganti dengan kekuasaan mutlak Raja. Smetona akan mengundurkan diri dari jabatan Perdana Menteri, dan melayani Mindaugas III muda sebagai penasihatnya."
 LIT_claim_prussia: "Rebut Prusia Timur"
 LIT_claim_prussia_desc: "Prusia Timur adalah rumah bagi minoritas Lituania dan Polandia yang tak terhitung jumlahnya, dan sudah saatnya orang-orang ini bersatu dengan rekan-rekan mereka di [Root.GetNameDef]."
 #Shared Baltic
 BALTIC_rejoin_the_railways: "Bergabunglah kembali dengan Kereta Api"
 BALTIC_rejoin_the_railways_desc: "Orang-orang Rusia dan Jerman yang menduduki kami memandang kami hanya sebagai daerah terpencil di pedesaan, tapi tidak lebih. [ROOT.GetNonIdeologyName] akan diindustrialisasi secara maksimal dimulai dengan peningkatan perkeretaapian dan infrastruktur kita."
 BALTIC_axis_investments: "Carilah [GetBalticAxisInvesmentsAdj] Investasi"
 BALTIC_axis_investments_desc: "[GetBalticAxisInvesmentsDesc]"
 BALTIC_axis_investments_desc_ger: "Pelabuhan perdagangan Jerman terdapat di sepanjang Baltik, dan meskipun kami pernah bermusuhan, tidak dapat disangkal bahwa perdagangan dan investasi Poros akan sangat memperkuat perekonomian [ROOT.GetNonIdeologyAdjective]."
 BALTIC_axis_investments_desc_fasc_eur: "Fasisme mempunyai pengaruh yang kuat di Eropa, dan meskipun ada beberapa keberatan yang dapat dimengerti, tidak dapat disangkal bahwa perdagangan dan investasi Fasis akan sangat memperkuat perekonomian [ROOT.GetNonIdeologyAdjective]."
 BALTIC_axis_investments_desc_fasc_int: "Fasisme mempunyai pengaruh yang kuat di seluruh dunia, dan meskipun ada beberapa keberatan yang dapat dimengerti, tidak dapat disangkal bahwa perdagangan dan investasi Fasis akan sangat memperkuat perekonomian [ROOT.GetNonIdeologyAdjective]."
 BALTIC_axis_investments_desc_jap: "[JAP.GetName] telah membuktikan kekuatan ekonomi dan militer mereka, dan meskipun mereka bukan bertetangga, tidak dapat disangkal bahwa [JAP.GetAdjective] perdagangan dan investasi akan sangat memperkuat perekonomian [ROOT.GetNonIdeologyAdjective]."
 BALTIC_german_war_economics: "Mengadopsi [GetBalticAxisInvesmentsAdj] Ekonomi Perang"
 BALTIC_german_war_economics_desc: "[GetGermanWarEconomicsDesc]"
 BALTIC_german_war_economics_desc_default: "Jerman sedang dalam proses industrialisasi militer yang pesat seperti yang telah terjadi di Eropa beberapa kali sebelumnya dan kita sebaiknya meniru mereka dan mencari investasi dari Reichsbank."
 BALTIC_german_war_economics_desc_alt: "Para dermawan fasis kita sedang dalam proses industrialisasi militer yang pesat, seperti yang telah kita lihat beberapa kali sebelumnya dan kita sebaiknya meniru mereka dan mencari investasi dari mereka."
 BALTIC_autobahn: "[Root.GetAdjective] jalan raya"
 BALTIC_autobahn_desc: "Tidak menjadi masalah seberapa baik [Root.GetNonIdeologyName] industri jika infrastrukturnya tidak memfasilitasi masuknya tenaga kerja secara cepat dan terus-menerus. Dengan memodelkan sektor infrastruktur kita seperti yang dilakukan Jerman, kita dapat mencapai efisiensi yang mereka miliki."
 BALTIC_eastwall: "tembok timur"
 BALTIC_eastwall_desc: "Jerman mengantisipasi serangan dari Timur sama seperti kita dan para pejabat Jerman disarankan untuk membentengi perbatasan kita dengan sekuat tenaga mereka."
 BALTIC_balticwall: "dinding Baltik"
 BALTIC_balticwall_desc: "Benteng di timur tidak ada gunanya jika musuh kita memilih melakukan serangan dari laut! Kita mungkin tidak akan pernah membangun angkatan laut untuk menyaingi Inggris, Jerman, atau Soviet, namun kita bisa melakukan apa yang kita bisa untuk membuat mereka tidak berdaya melawan pertahanan pesisir kita."
 BALTIC_german_tank_licences: "[GetBalticAxisInvesmentsAdj] Lisensi Tangki"
 BALTIC_german_tank_licences_desc: "[GetGermanTankLicencesDesc]"
 BALTIC_german_tank_licences_desc_default: "Tank-tank Jerman telah membuktikan diri mereka mampu membuat musuh-musuhnya tercerai-berai dan kebingungan saat mereka menyerang sasarannya. [Root.GetNonIdeologyName] akan mendapat manfaat besar dengan meniru taktik ini dalam perang yang akan datang di Timur."
 BALTIC_german_tank_licences_desc_alt: "Tank-tank milik para dermawan fasis kita telah membuktikan diri mereka mampu membuat musuh-musuh mereka tercerai-berai dan kebingungan saat mereka menyerang sasaran mereka. [Root.GetNonIdeologyName] akan mendapat manfaat besar dengan meniru taktik ini dalam perang yang akan datang di Timur."
 BALTIC_german_baltic_industry: "Industri Poros-Baltik"
 BALTIC_german_baltic_industry_desc: "[GetGermanBalticIndustryDesc]"
 BALTIC_german_baltic_industry_desc_default: "Bangsa kita sekarang kaya akan investasi Jerman. Sektor swasta di Jerman dan [Root.GetNonIdeologyName] hampir tidak bisa dibedakan, dengan banyak perusahaan yang sama menyediakan pekerjaan untuk [Root.GetNonIdeologyAdjective] dan Jerman."
 BALTIC_german_baltic_industry_desc_alt: "Bangsa kita sekarang kaya akan investasi fasis asing. Sektor swasta dari para dermawan fasis kita dan [Root.GetNonIdeologyName] hampir tidak dapat dibedakan, dengan banyak perusahaan yang sama menyediakan pekerjaan untuk [Root.GetNonIdeologyAdjective] dan masyarakatnya."
 BALTIC_request_german_support: "Minta Dukungan [GetBalticAxisInvesmentsAdj]"
 BALTIC_request_german_support_desc: "[GetRequestGermanSupportDesc]"
 BALTIC_request_german_support_desc_default: "Kita tidak memiliki kapasitas industri seperti Jerman, tapi mungkin kita bisa meyakinkan para pejabat Jerman untuk memberi kita persediaan peralatan tambahan agar kita bisa lebih mempertahankan diri melawan ancaman Komunis yang akan datang di Timur."
 BALTIC_request_german_support_desc_alt: "Kita tidak memiliki kapasitas industri yang sama dengan para dermawan fasis kita, tapi mungkin kita bisa meyakinkan para pejabat mereka untuk memberi kita persediaan peralatan tambahan agar bisa lebih mempertahankan diri kita dari ancaman Komunis yang akan datang di Timur."
 BALTIC_renew_allied_trade: "[GetBalticRenewAlliedTradeTitle]"
 BALTIC_renew_allied_trade_default: "Perbarui Perdagangan Sekutu"
 BALTIC_renew_allied_trade_alt: "Mencari Investasi Asing"
 BALTIC_renew_allied_trade_desc: "[GetBalticRenewAlliedTradeDesc]"
 BALTIC_renew_allied_trade_desc_default: "Kita telah bergantung pada dukungan perdagangan dan militer Inggris sejak awal berdirinya negara kita dan akan sangat bodoh jika kita mengabaikannya sekarang. Kita harus menarik investasi sekutu ke negara kita jika kita ingin sekali lagi selamat dari serangan gencar Jerman dan Rusia yang merambah perbatasan kita."
 BALTIC_renew_allied_trade_desc_allied: "Kita telah bergantung pada Sekutu untuk dukungan perdagangan dan militer sejak awal berdirinya negara kita dan akan sangat bodoh jika kita mengabaikannya sekarang. Kita harus menarik investasi Sekutu ke negara kita jika kita ingin sekali lagi selamat dari serangan gencar Jerman dan Rusia yang melanggar perbatasan kita."
 BALTIC_renew_allied_trade_desc_international: "Kita telah bergantung pada negara-negara lain untuk dukungan perdagangan dan militer sejak awal berdirinya negara kita dan akan sangat bodoh jika kita mengabaikannya sekarang. Kita harus menarik investasi asing ke negara kita jika kita ingin sekali lagi selamat dari serangan gencar Jerman dan Rusia yang merambah perbatasan kita."
 BALTIC_ford_motors: "[Root.Capital.GetName] Industri Ford"
 BALTIC_ford_motors_desc: "Perusahaan motor Ford telah melakukan pekerjaan yang baik dalam menyediakan kendaraan bermotor terjangkau yang diproduksi secara massal kepada Amerika dan negara-negara Sekutu lainnya di seluruh dunia. Jika kita mendirikan pabrik Ford di [Root.Capital.GetName], kita akan mampu menyediakan kendaraan untuk tentara kita sendiri dan mendapat keuntungan besar dengan mengekspornya ke Barat."
 BALTIC_crossley_motors: "[Root.Capital.GetName]-Motor Crossley"
 BALTIC_crossley_motors_desc: "Dengan investasi asing yang kini tersebar luas di negara kita dan produksi mobil dengan efisiensi yang wajar, kita mungkin dapat berkolaborasi dengan Crossley Motor Company untuk membuat desain asli untuk digunakan dalam pasukan [Root.GetNonIdeologyAdjective]!"
 BALTIC_british_designers: "Undang Desainer Inggris"
 BALTIC_british_designers_desc: "Kami telah mempelajari desain Inggris secara menyeluruh, dan dengan [Root.Capital.GetName]-Crossley Motors yang terbukti sukses, kami sebaiknya menyampaikan undangan resmi kepada desainer Inggris untuk bergabung dengan [Root.GetNonIdeologyAdjective] Engineering Company."
 BALTIC_technology_sharing: "Berbagi Teknologi"
 BALTIC_technology_sharing_desc: "Kami telah memproduksi banyak peralatan mitra kami, namun mungkin dengan mempelajari desain mereka, kami akan dapat meningkatkan desain asli [Root.GetNonIdeologyAdjective] secara signifikan."
 BALTIC_british_aircraft: "[GetBritAircraftManufTitle]"
 BALTIC_british_aircraft_default: "Manufaktur Pesawat Inggris"
 BALTIC_british_aircraft_alt: "Manufaktur Pesawat Asing"
 BALTIC_british_aircraft_desc: "[GetBritAircraftManufDesc]"
 BALTIC_british_aircraft_desc_default: "Sejauh ini upaya desain penerbangan domestik masih suam-suam kuku. Sejauh ini angkatan udara mengandalkan pesawat yang disita dari pasukan Jerman dan Soviet, namun kita harus mulai memproduksi pesawat di dalam negeri jika ingin bertahan hidup dan angkatan udara Inggris mungkin menjadi kunci untuk meraih kemenangan…"
 BALTIC_british_aircraft_desc_alt: "Sejauh ini upaya desain penerbangan domestik masih suam-suam kuku. Sejauh ini angkatan udara mengandalkan pesawat yang disita dari pasukan Jerman dan Soviet, namun kita harus memulai produksi pesawat dalam negeri jika ingin bertahan hidup dan bantuan dari angkatan udara asing mungkin menjadi kunci untuk meraih kemenangan…"
 BALTIC_allied_shipments: "Tingkatkan Pengiriman Sekutu"
 BALTIC_allied_shipments_desc: "Sejak tahun 1918, pasukan [Root.GetNonIdeologyAdjective] telah dilengkapi dengan kiriman yang dikirimkan kepada kami dari Inggris Raya dan kami harus melakukan upaya untuk membuat Sekutu memahami bahwa kecuali kiriman ditingkatkan secara drastis, [Root.GetNonIdeologyName] mungkin akan tunduk pada pemerintahan boneka Soviet lainnya."
 BALTIC_baltic_fleet: "Armada Baltik"
 BALTIC_baltic_fleet_desc: "Meskipun armada [Root.GetNonIdeologyAdjective] hampir tidak membuat iri dunia, dengan investasi yang tepat armada tersebut mungkin belum terbukti mampu mempertahankan [Root.GetNonIdeologyName] dari segala upaya invasi di laut."
 BALTIC_attract_workers_to_capital: "Menarik Pekerja ke [Root.Capital.GetName]"
 BALTIC_attract_workers_to_capital_desc: "Para pekerja [Root.GetNonIdeologyName] tersebar di seluruh pedesaan, seringkali bekerja di sektor pertanian yang sudah ketinggalan zaman. Jika kita ingin melakukan industrialisasi bangsa kita untuk perang, kita harus menarik pekerja ke pabrik [Root.Capital.GetName]!"
 BALTIC_rebuild_forts: "Bangun kembali Benteng [Root.Capital.GetName]"
 BALTIC_rebuild_forts_desc: "Selama perang kemerdekaan, [Root.Capital.GetName] lebih merupakan benteng daripada kota. Meskipun sebagian besar benteng telah dibongkar dan dilupakan, benteng tersebut harus dibangun kembali dan dipelihara, siap untuk perang."
 BALTIC_arm_the_nation: "Persenjatai Bangsa"
 BALTIC_arm_the_nation_desc: "Di seluruh [Root.GetNonIdeologyName] terdapat orang-orang yang siap menghadapi ancaman invasi Soviet tetapi tidak memiliki peralatan untuk melakukannya. Kita harus mempersiapkan industri senjata kita untuk produksi peralatan infanteri yang cepat."
 BALTIC_unchain_education: "Lepaskan Rantai Pendidikan Kita"
 BALTIC_unchain_education_desc: "Sistem pendidikan [Root.GetNonIdeologyAdjective] telah lama dibatasi oleh pusat populasi yang berbeda-beda, namun kini dengan semakin banyaknya masyarakat pedesaan yang pindah ke kota, kita akan lebih mampu mendidik generasi muda [Root.GetNonIdeologyAdjective] secara efisien."
 BALTIC_defence_of_our_nation: "Pertahanan Bangsa Kita"
 BALTIC_defence_of_our_nation_desc: "Industri sipil sama pentingnya dengan pertahanan kita seperti halnya industri senjata. Dengungan mesin yang terus-menerus akan terdengar di seluruh [Root.GetNonIdeologyName] saat orang-orang patriotik melakukan tugas mereka untuk melakukan industrialisasi bangsa kita."
 BALTIC_modernize_industry: "Modernkan Industri Kita"
 BALTIC_modernize_industry_desc: "Sudah terlalu lama keluaran [Root.GetNonIdeologyName] hanya ditentukan oleh sektor pertanian saja. Kita harus memusatkan industri kita di sekitar pusat kota besar di setiap negara bagian jika kita ingin mengubah [Root.GetNonIdeologyName] menjadi perekonomian modern."
 BALTIC_domestic_motors: "Perusahaan Motor Dalam Negeri"
 BALTIC_domestic_motors_desc: "Desain luar negeri boleh-boleh saja, tapi kita tidak bisa terus-terusan bergantung pada mereka. [Root.GetNonIdeologyName] adalah bangsa yang membanggakan, dan kita harus menunjukkan kepada dunia bahwa para desainer dan pemikir kita sama hebatnya dengan mereka yang berasal dari Barat."
 BALTIC_school_of_aviation: "Sekolah Penerbangan Baltik"
 BALTIC_school_of_aviation_tech_bonus: "Sekolah Penerbangan"
 BALTIC_school_of_aviation_desc: "Selama perang kemerdekaan, perjuangan untuk menguasai udara dan laut dilakukan oleh Inggris atas nama kita, namun karena Inggris terus memberikan konsesi demi konsesi terhadap ancaman Nazi, kita tidak dapat percaya bahwa mereka akan membela kita lagi. Kita sendiri yang harus mengudara!"
 BALTIC_original_designs: "Desain Asli"
 BALTIC_original_designs_desc: "Sejak negara kita lahir pada tahun 1918 hingga saat ini, [Root.GetNonIdeologyName] telah melengkapi pasukannya dengan senjata dari Inggris, namun tidak lebih. Kita tidak bisa lagi bergantung pada Inggris, kita harus menantikan dan mulai memproduksi persenjataan asal [Root.GetNonIdeologyAdjective]."
 BALTIC_arms_industry: "Lengkapi Persenjataannya"
 BALTIC_arms_industry_desc: "Sekarang setelah modernisasi industri kita selesai dan kita memiliki banyak organisasi industri militer dalam negeri yang beroperasi di negara kita, industri senjata [Root.GetAdjective] akhirnya dapat mencapai potensi sebenarnya!"
 BALTIC_natural_resources: "Mengembangkan Sumber Daya Alam"
 BALTIC_natural_resources_desc: "[Root.GetNaturaResource_BAL] telah membuat negara kita kaya dari perdagangan dengan Soviet, Sekutu, dan sesama negara Baltik dan kita sebaiknya berinvestasi lebih banyak ke dalam industri ini dengan berinvestasi di [Root.GetExtraction_BAL] di seluruh negara!"
 BALTIC_trade_with_neighbors: "Berdagang dengan Tetangga"
 BALTIC_trade_with_neighbors_desc: "Setiap kali kita melakukan investasi perdagangan ke Jerman atau Soviet, kita berkontribusi terhadap kehancuran kita sendiri. Kita tidak bisa membiarkan pasukan musuh menyerang [Root.GetNonIdeologyName] dengan gandum Lituania di ransumnya dan minyak Estonia di tank mereka yang terbuat dari baja Latvia. Kita harus saling membantu untuk mengalahkan musuh bersama."
 BALTIC_invest_in_baltic_trade: "Berinvestasi dalam Perdagangan Baltik"
 BALTIC_invest_in_baltic_trade_desc: "Laut Baltik kaya akan perdagangan dari Skandinavia, Jerman, dan Rusia dan pelabuhan kita hampir tidak dapat menampung semuanya. Kita harus membuka jalur perdagangan baru dengan teman-teman kita yang berbagi laut ini dengan kita untuk [Root.GetNonIdeologyName] yang lebih cerah dan sejahtera!"
 BALTIC_restore_workers_republic: "Pulihkan Republik Pekerja"
 BALTIC_restore_workers_republic_desc: "Selama perjuangan kemerdekaan, Soviet membantu pembentukan Republik Pekerja [Root.GetAdjective]. Meskipun republik ini gagal, para pemimpinnya masih hidup baik di [Root.GetNameDef] maupun [SOV.GetNameDef], oleh karena itu harapan bagi republik buruh tetap ada!"
 BALTIC_seek_support_of_soviets: "Carilah Dukungan dari Soviet"
 BALTIC_seek_support_of_soviets_desc: "Meskipun Tentara Merah menghancurkan [Root.GetNameDef] dan membawa bangsa kita ke era baru imperialisme Rusia, kita tidak mempunyai kesempatan untuk membawa sosialisme ke [Root.GetNameDef] tanpa bantuan mereka."
 BALTIC_soviet_equipment: "Peralatan Soviet"
 BALTIC_soviet_equipment_desc: "Kita tidak bisa berharap untuk menggulingkan pemerintah tanpa terlebih dahulu mendapatkan akses terhadap senjata dan bahan-bahan yang diperlukan untuk mempersenjatai milisi kita. Dengan meminta bantuan Rusia, kita akan mendapatkan persenjataan tambahan untuk mendukung tentara kita, jika pemerintah lama berupaya menghentikan revolusi."
 BALTIC_soviet_volunteer_forces: "Pasukan Relawan Soviet"
 BALTIC_soviet_volunteer_forces_desc: "Uni Soviet dipenuhi dengan orang-orang yang siap berjuang dan mati demi revolusi dunia. Meskipun [Root.GetNameDef] hanyalah batu loncatan dalam perjuangan untuk dunia komunis, tidak ada kekurangan dari kaum sosialis Rusia yang berani dan siap mati demi perjuangan kita."
 BALTIC_soviet_military_staff: "Staf Militer Soviet"
 BALTIC_soviet_military_staff_desc: "Setelah [Root.GetAdjective] Republik Pekerja dibubarkan, sebagian besar staf militer kami diasingkan ke Uni Soviet. Mereka harus dibawa pulang."
 BALTIC_communist_opposition: "Masuki Oposisi"
 BALTIC_communist_opposition_desc: "Uni Soviet telah membuktikan dirinya tidak bersahabat dengan [Root.GetNameDef] maupun rakyatnya dan kita bodoh jika menyerahkan kunci [Root.GetNameDef] kepada para tentara Merah yang hanya ingin menjarah [Root.GetAdjective]. Mereka tidak lebih bisa dipercaya dibandingkan kaum kapitalis, dan jika [Root.GetCommunistParty] ingin berhasil, hal itu harus dilakukan sendiri!"
 BALTIC_forment_disloyalty: "Satukan Oposisi"
 BALTIC_forment_disloyalty_desc: "Ada banyak gerakan baik di dalam maupun di luar pemerintahan [Root.GetAdjective] dan jika kita ingin menggulingkan tirani yang melanda [Root.GetNameDef] saat ini, kita harus menjadi suara pemersatu yang menentang [Root.GetNeutralParty]!"
 BALTIC_concessions_for_catholics: "Konsesi untuk umat Katolik"
 BALTIC_concessions_for_catholics_desc: "Sebagian besar kelas bawah [Root.GetNameDef] adalah penganut Katolik yang taat, dan di Republik Pekerja pertama, praktik keagamaan dibasmi dengan keras oleh Tentara Merah. Hal ini membuat banyak masyarakat miskin [Root.GetNameDef] menentang revolusi, jadi jika kita ingin benar-benar menjadi republik rakyat, kita harus meyakinkan mereka dengan tegas bahwa keyakinan mereka akan dilindungi."
 BALTIC_secure_military_support: "Dukungan Militer yang Aman"
 BALTIC_secure_military_support_desc: "Banyak anggota militer yang berupaya menyingkirkan [Root.GetLeader] negara, yang perlu kita lakukan hanyalah mendekati mereka. Seorang jenderal yang mencari kehormatan dan kemasyhuran pasti akan tertarik pada perjuangan kita dengan janji menjadi pahlawan rakyat."
 BALTIC_overthrow_the_government: "Menggulingkan [Root.GetNeutralParty]"
 BALTIC_overthrow_the_government_desc: "Kami telah mengumpulkan cukup dukungan untuk menggulingkan rezim [Root.GetLeader] dan [Root.GetLeader.GetHerHis]! Yang perlu kita lakukan hanyalah berbaris ke ibu kota dan memproklamirkan Republik Pekerja yang baru!"
 BALTIC_sieze_the_means_of_production: "Rebut Alat Produksi"
 BALTIC_sieze_the_means_of_production_desc: "Pemerintahan lama mengundang investor dari luar negeri untuk mengeksploitasi tenaga kerja masyarakat [Root.GetAdjective]. Kita tidak bisa terus membiarkan tangan proletariat mengabdi pada majikan borjuasi asing mereka dan semua pabrik yang dibangun oleh perusahaan multinasional ini harus diambil alih oleh [Root.GetNameDef]."
 BALTIC_revolutionary_cabinet: "Kabinet Revolusioner"
 BALTIC_revolutionary_cabinet_desc: "Kini setelah kita kembali ke posisi yang seharusnya sebagai penjaga kelas bawah yang setia, kita dapat sekali lagi membentuk kabinet menteri yang selaras dengan ideologi negara baru kita."
 BALTIC_direct_intervention: "Intervensi Soviet Langsung"
 BALTIC_direct_intervention_desc: "Kami telah terbukti tidak mampu merebut kembali pemerintahan sendirian dan kami harus memanggil sekutu kami di [SOV.GetNameDef] untuk membantu perjuangan kami."
 BALTIC_squash_resistance: "Hancurkan Semua Perlawanan"
 BALTIC_squash_resistance_desc: "Masih ada orang yang percaya bahwa sosialisme adalah musuh kedaulatan [Root.GetAdjective], dan orang-orang ini harus dibasmi jika kita ingin memajukan revolusi."
 BALTIC_purge_of_our_own: "Pembersihan Kita Sendiri"
 BALTIC_purge_of_our_own_desc: "Bahkan melalui upaya terbaik kita untuk meredam semua perlawanan, masih ada mereka yang mengorganisir diri secara sembunyi-sembunyi, berkonspirasi melawan proletariat untuk memulihkan kediktatoran kapitalis di [Root.GetNonIdeologyName]. Kita harus melakukan pembersihan massal; membasmi anggota pemerintahan lama dan siapa pun yang mendukung mereka."
 BALTIC_crush_forest_brothers: "Hancurkan Saudara Hutan"
 BALTIC_crush_forest_brothers_desc: "Forest Brothers telah menjadi bencana bagi negara kita sejak pengambilalihan kekuasaan kita; menyabotase industri, jalur kereta api, dan mengganggu demonstrasi resmi pemerintah. Kita harus menjelajah ke dalam hutan [Root.GetNonIdeologyName] dan membasmi individu-individu yang salah arah ini."
 BALTIC_red_army: "[Root.GetAdjective] Penembak Merah"
 BALTIC_red_army_desc: "Tentara kita harus terdiri dari mereka yang bersedia membela sosialisme di dalam [Root.GetNameDef] dan menyebarkannya di antara penduduk dunia, dan ini hanya dapat dicapai dengan memulihkan [Root.GetAdjective] Red Riflemen."
 BALTIC_align_paramilitarists: "Sejajarkan kembali Paramiliter"
 BALTIC_align_paramilitarists_desc: "Ada banyak kelompok paramiliter di seluruh [Root.GetNameDef], yang sebagian besar dikhususkan semata-mata untuk melindungi [Root.GetAdjective] penentuan nasib sendiri. Meskipun mengagumkan, akan lebih baik jika kelompok-kelompok ini melihat kami bukan sebagai boneka [SOV.GetAdjective], namun sebagai kelanjutan logis dari keadaan [Root.GetAdjective]."
 BALTIC_influence_neighbours: "Mempengaruhi Tetangga"
 BALTIC_influence_neighbours_desc: "Meskipun tidak sepopuler sebelum perang kemerdekaan, konsep kemerdekaan Baltik di bawah sosialisme sama tuanya dengan konsep penentuan nasib sendiri Baltik itu sendiri. Negara kita dapat menjadi teladan bagi mereka yang hidup di bawah rezim diktator Baltik yang menindas dan dengan menggunakan hal tersebut, kita dapat menyebarkan Revolusi ke negara-negara tetangga kita tanpa pertumpahan darah."
 BALTIC_arm_baltic_reds: "Lengan Merah Baltik"
 BALTIC_arm_baltic_reds_desc: "Panggung sudah siap, semangat komunis berkobar di seluruh Baltik. Yang dibutuhkan pihak merah saat ini hanyalah sinyal dan sumber daya dari kami dan kami akan memicu revolusi Baltik!"
 BALTIC_belarus_ssr: "[Root.GetNonIdeologyName]-SSR Belarusia"
 BALTIC_belarus_ssr_desc: "Konsep menyatukan Belarus dan Baltik bukanlah konsep yang asing. Dahulu kala, Republik Sosialis Soviet Lituania-Belarus berdiri sebagai perpaduan harmonis antara dua bangsa yang tampaknya berbeda ini. Sosialisme tidak mengenal batasan budaya dan bahasa, dan kami tidak melihat alasan mengapa [Root.GetAdjective] dan pekerja Belarusia tidak bisa hidup berdampingan."
 BALTIC_end_bourgeouis_dictatorships: "Akhiri Kediktatoran Borjuasi"
 BALTIC_end_bourgeouis_dictatorships_desc: "Negara-negara Baltik didominasi oleh mereka yang disebut sebagai diktator \"netral\". Dengan dukungan militer dan tanpa persetujuan rakyat, proletariat Baltik tertindas di bawah kediktatoran kapitalis. Hanya melalui tangan para pekerja [Root.GetAdjective] yang telah dibebaskan, para pekerja yang dipisahkan oleh perbatasan yang tidak adil ini dapat ikut ambil bagian dalam pembebasan kita yang mulia!"
 BALTIC_focus_on_the_interior: "Fokus pada Interior"
 BALTIC_focus_on_the_interior_desc: "Meskipun banyak pekerja yang bersemangat untuk bergerak melawan negara tetangga kita dan membawa revolusi kita yang gemilang ke seluruh masyarakat Baltik, kita harus fokus pada urusan dalam negeri negara kita; menstabilkan rezim setelah revolusi."
 BALTIC_focus_on_the_interior_2: "Bersiaplah untuk Jerman"
 BALTIC_focus_on_the_interior_2_desc: "Sangat penting bagi kita untuk tidak melupakan kebrutalan mutlak yang dibawa oleh Freikorps ke [Root.GetNameDef] bertahun-tahun yang lalu. Petani dan pekerja dibantai seperti binatang, seluruh desa menjadi abu dan hancur, dan kita tidak bisa membiarkan masyarakat [Root.GetAdjective] mengalami kebrutalan seperti itu lagi."
 BALTIC_united_baltic_ssr: "RSS Baltik Bersatu"
 BALTIC_united_baltic_ssr_desc: "Meskipun berbeda dalam budaya, bahasa, dan identitas, telah lama ada persaudaraan dan persahabatan antara ketiga negara Baltik. Harus diakui bahwa tetangga kita adalah kawan seperti halnya sesama [Root.GetAdjective], dan kaum buruh hanya akan rugi jika kita tidak bersatu dalam sebuah republik buruh yang tunggal."
 BALTIC_western_revolution: "Membawa Revolusi ke Barat"
 BALTIC_western_revolution_desc: "Revolusi tidak berhenti di Baltik. Hampir seluruh masyarakat kelas bawah di Eropa menjadi budak di pabrik-pabrik di bawah pengaruh kapitalisme, dan hanya pekerja [Root.GetAdjective] yang mampu membebaskan mereka."
 BALTIC_finnish_invasion: "Invasi Finlandia"
 BALTIC_finnish_invasion_desc: "Finlandia bagi kami adalah saudara hilang yang terikat dalam belenggu kapitalisme. Hanya melalui revolusi yang penuh kekerasan, Finlandia dapat dibebaskan seperti halnya negara-negara Baltik telah dibebaskan."
 BALTIC_path_to_the_north_sea: "Jalan Menuju Laut Utara"
 BALTIC_path_to_the_north_sea_desc: "Sayangnya, Denmark tetap bersikap netral dalam konflik global yang semakin meningkat ini, dan selat Denmark-lah yang memisahkan dunia sosialis dari Laut Utara."
 BALTIC_end_swedish_neutrality: "Akhiri Netralitas Swedia"
 BALTIC_end_swedish_neutrality_desc: "Apa yang orang Swedia sebut sebagai netralitas hanyalah kelemahan; tunduk pada keinginan kekuatan mana pun yang tampaknya paling kuat pada saat itu dan tidak terlalu memperhatikan kesejahteraan masyarakat kelas bawah di negara mereka. Pemerintah yang berkemauan lemah dan lemah seperti itu tidak layak berbagi perbatasan dengan kita dan kita harus menciptakan Swedia baru yang mampu membela rakyatnya dari tirani."
 BALTIC_free_the_workers_of_poland: "Bebaskan Pekerja Polandia"
 BALTIC_free_the_workers_of_poland_desc: "Meskipun Polandia pernah menguasai Baltik, mereka kini menjadi mangsa yang rentan terhadap rezim predator [GER.GetNameDef]. Kita harus membela kawan-kawan kita di Selatan dan menyatukan mereka di bawah Republik Sosialis Polandia!"
 #Baltic Entente
 LIT_baltic_economic_union: "Uni Ekonomi Baltik"
 LIT_baltic_economic_union_desc: "Kini setelah demokrasi liberal telah kembali ke negara kita dan kita menjalin hubungan diplomatik yang erat dengan negara-negara tetangga, masuk akal untuk menjalin persatuan ekonomi dengan sesama negara Baltik. Meskipun perekonomian kita kecil, secara bersama-sama kita bisa tumbuh kuat!"
 LIT_baltic_defence_army: "Tentara Pertahanan Baltik"
 LIT_baltic_defence_army_desc: "Angkatan bersenjata kita bekerja sama namun pada dasarnya merupakan entitas yang terpisah. Dengan semakin kuatnya hubungan antara negara-negara kita, kita mungkin dapat membentuk Angkatan Bersenjata Baltik Bersatu, sebuah entitas berbeda yang secara bersamaan tidak dikendalikan oleh negara-negara Baltik mana pun, namun merupakan sekutu bagi semua negara-negara Baltik."
 LIT_pan_baltic_bank: "Bank Pan-Baltik"
 LIT_pan_baltic_bank_desc: "Dengan adanya kesatuan ekonomi, ada kemungkinan bagi kita untuk mendirikan bank pan-Baltik dan mata uang bersama."
 LIT_propose_baltic_union: "Usulkan Uni Baltik"
 LIT_propose_baltic_union_desc: "Dengan semua entitas berbeda yang kini saling terkait di antara negara-negara kita, tampaknya pembentukan Uni Baltik resmi tidak bisa dihindari. Serikat pekerja akan memberikan hak suara dan hak veto kepada seluruh negara anggota, dan semakin mendekatkan kedua negara."
 LIT_baltic_stronger_together: "Bersatu namun Terpisah"
 LIT_baltic_stronger_together_desc: "Rasa persaudaraan dan persahabatan sudah lama terjalin di antara negara-negara Baltik, namun kita selalu dipisahkan oleh perbatasan dan politik. Kita terikat bersama secara diplomatis oleh kesediaan kita untuk mempertahankan kemerdekaan kita, sehingga kita harus berkomitmen untuk berjuang demi teman-teman kita dan memperluas angkatan bersenjata Baltik yang bersatu!"
 LIT_baltic_unification: "Unifikasi Baltik"
 LIT_baltic_unification_desc: "Rasa persaudaraan dan persahabatan sudah lama terjalin di antara negara-negara Baltik, namun kita selalu dipisahkan oleh perbatasan dan politik. Meskipun identitas independen kami kuat, kesediaan kami untuk berjuang mempertahankan keberadaan kami mengikat kami bersama. Mungkin sudah saatnya Uni Baltik berevolusi menjadi sebuah negara tersendiri."
 LAT_baltic_economic_union: "Uni Ekonomi Baltik"
 LAT_baltic_economic_union_desc: "Kini setelah demokrasi liberal telah kembali ke negara kita dan kita menjalin hubungan diplomatik yang erat dengan negara-negara tetangga, masuk akal untuk menjalin persatuan ekonomi dengan sesama negara Baltik. Meskipun perekonomian kita kecil, secara bersama-sama kita bisa tumbuh kuat!"
