l_braz_por:
##CZECHOSLOVAKIA##
MUN_czech_skoda_priority.t: "Pekerjaan Škoda"
MUN_czech_skoda_priority.d: "Perusahaan Škoda Works memproduksi berbagai macam produk, mulai dari artileri hingga tank, kereta api, dan senjata angkatan laut. Hal ini menghasilkan banyak keserbagunaan dengan mengalihkan sumber daya ke tempat yang permintaannya paling tinggi, yang kini dapat kita arahkan sebagian."
MUN_czech_skoda_priority.1.a: "Menarik"
MUN_czech.2.t.1: "Paramiliter Sudetenland meminta bantuan"
MUN_czech.2.t.2: "Korps Bebas Sudetenland meminta bantuan"
MUN_czech.2.t.3: "Milisi Pekerja Sudeten meminta bantuan"
MUN_czech.2.d.1: "Mengingat berita baru-baru ini mengenai rancangan kami terhadap [CZE.getname], banyak partai politik di Sudetenland dengan cepat membentuk paramiliter di seluruh wilayah dengan harapan dapat melemahkan pemerintahan [CZE.GetAdjective]. Mereka kini meminta dukungan kami dalam melakukan penggerebekan lintas batas dan melakukan tindakan sabotase untuk membantu upaya kami melawan [CZE.getname]."
MUN_czech.2.d.2: "Mengingat berita terbaru tentang rancangan kami pada [CZE.getname], partai politik Sudetenland dengan cepat memobilisasi paramiliter mereka: Korps Bebas Sudeten. Unit Free Corp di seluruh Sudetenland telah membentuk unit dan mulai menyerang [CZE.GetAdjective] properti pemerintah di Sudetenland. Mereka kini meminta dukungan penuh kami dalam membantu mereka melakukan penggerebekan lintas batas dan melakukan tindakan sabotase terhadap [CZE.getname]."
MUN_czech.2.d.3: "Mengingat berita baru-baru ini mengenai rancangan kami terhadap [CZE.getname], partai komunis lokal dengan cepat memobilisasi milisi pekerja. Milisi pekerja ini mulai menyerang [CZE.GetAdjective] properti pemerintah di wilayah tersebut. Mereka sekarang meminta dukungan penuh kami dalam membantu mereka melakukan serangan lintas batas dan melakukan tindakan sabotase terhadap [CZE.getname] dan kelompok kontrarevolusioner lainnya."
MUN_czech.2.a: "Tentu saja kami akan membantu"
MUN_czech.2.b: "Mungkin lebih baik tidak mengaktifkannya lebih lanjut"
MUN_czech.3.t: "Aktivitas Partisan Sudetenland"
MUN_czech.3.d: "Setelah [FROM.getname] baru-baru ini tertarik untuk mencaplok Sudetenland, paramiliter mulai terlibat dalam pertempuran kecil melawan kami. Mereka mulai menyerang gedung-gedung pemerintah dan melemahkan pertahanan kita di beberapa wilayah. Jika kita ingin memperbaiki situasi militer di wilayah tersebut, kita perlu menghadapi kelompok paramiliter ini."
MUN_czech.3.a: "Bagaimana hal ini bisa menjadi lebih buruk?"
MUN_czech.4.t: "Krisis Kepercayaan Diri"
MUN_czech.4.d: "Berita baru-baru ini mengenai agresi militer terhadap kami telah mengguncangkan pemerintah hingga ke akar-akarnya. [CZE.GetLeader] telah kehilangan kepercayaan pada kemampuan pemerintahnya untuk memimpin negara melalui krisis ini. Dia menuntut agar $CZE_jan_syrovy$ mengambil kendali situasi dan memimpin negara. $CZE_jan_syrovy$ telah mengatakan bahwa dia enggan untuk memimpin, namun mengingat hal ini [CZE.GetLeader] telah mengatakan kepadanya bahwa dia tidak punya pilihan selain mengambil alih komando dan memimpin kita melewati krisis ini."
MUN_czech.4.a: "Kami membutuhkanmu lebih dari sebelumnya."
MUN_czech.4.b: "Kita tidak boleh kehilangan akal."
MUN_czech.5.t: "Tomáš Masaryk Meninggal Dunia"
MUN_czech.5.d: "Masaryk adalah tokoh stabilisasi dalam politik Cekoslowakia selama lebih dari dua dekade. Ketika koalisi dianggap mustahil untuk dibangun dan kebuntuan politik terlalu besar untuk diatasi, Masaryk, dari waktu ke waktu, mampu melakukan keajaiban politik untuk membantu memperkuat dan mengembangkan Cekoslowakia hingga menjadi seperti sekarang ini. Kehadirannya akan sangat dirindukan dan akan dirasakan seluruh pelosok tanah air."
MUN_czech.5.a: "Raksasa politik yang tak tergantikan."
MUN_czech.7.t: "Mengevaluasi Kembali Komitmen terhadap [CZE.getnamedef]"
MUN_czech.7.d: "Baru-baru ini kami mendapat berita bahwa [GER.getnamedef] ingin mencaplok Sudetenland, dan bersedia berperang dengan [CZE.getnamedef] untuk mencapai tujuan ini. Saat ini kami memiliki perjanjian defensif dengan [CZE.getnamedef], artinya jika mereka berperang dengan [GER.getnamedef], kami wajib membantu mereka. Jika kita ingin menghindari hal ini, kita harus segera keluar dari perjanjian defensif dengan [CZE.getnamedef]."
MUN_czech.7.a: "Kami mendukung teman-teman kami"
MUN_czech.7.b: "Kami tidak akan memiliki peluang melawan [GER.getnamedef]"
MUN_czech.1001.t: "[FROM.GetNameDefCap] Menuntut Koridor ke [SOV.GetNameDef]"
MUN_czech.1001.d: "Berharap untuk mengoordinasikan aksi militer dengan [SOV.GetNameDef], [FROM.GetNameDef] telah menuntut agar kami menyerahkan wilayah perbatasan [89.GetName] dan [91.GetName] kepada mereka."
MUN_czech.1002.t: "[FROM.GetNameDefCap] Menuntut Pengaruh Terhadap Liga Yugoslavia"
MUN_czech.1002.d: "Setelah berekspansi ke selatan, [FROM.GetName] datang dengan permintaan yang tidak biasa. Mereka tidak menuntut perampasan tanah, namun kendali atas Liga Pertahanan Yugoslavia, menjadi pelindung dan penguasa negara-negara Balkan utara yang saat ini menjadi subyek kami. Mereka bilang mereka akan menjadi pelindung yang lebih mampu dibandingkan kita, tapi tentu saja itu hanya alasan."
MUN_czech.1002.a: "Mungkin mereka benar"
MUN_czech.1002.b: "Tidak, mereka berada di bawah perlindungan kita!"
MUN_czech.1003.t: "[FROM.GetName] Menolak Tuntutan"
MUN_czech.1003.d: "Terlepas dari argumen yang meyakinkan dari para diplomat kami, [FROM.GetNameDef] menolak untuk menyerah pada tuntutan kami."
MUN_czech.1003.a: "Mereka tidak memberi kita pilihan lain"
MUN_czech.1004.t: "[FROM.GetName] Bergerak Melawan Hongaria"
MUN_czech.1004.d: "Berita telah sampai ke [ROOT.capital.GetCapitalVictoryPointName] tentang [FROM.GetAdjective] pasukan maju menuju perbatasan [HUN.GetAdjective]. Meskipun perwakilan [HUN.GetAdjective] pasti akan segera menghubungi kita, kita harus memikirkan apakah akan membantu [HUN.GetNameDef] dan mendapatkan sekutu potensial, atau apakah kita harus membiarkan [FROM.GetNameDef] melanjutkan rencananya saat ini."
MUN_czech.1004.a: "Kita harus melindungi kepentingan kita"
MUN_czech.1004.b: "Mari kita hindari hal ini"
MUN_czech.1005.t: "[FROM.GetName] Menuntut Wilayah Pesisir"
MUN_czech.1005.d: "Dengan [FROM.GetNameDef] wilayahnya terus berkembang, perwakilan dari mereka kini datang untuk menuntut agar kami menyerahkan tanah yang pernah dimiliki para bangsawan [FROM.GetAdjective] kepada mereka. Mereka mengatakan hal ini akan memberi mereka akses potensial ke Laut Adriatik, namun tampaknya mereka tidak begitu tertarik dengan pemikiran kita mengenai masalah tersebut."
MUN_czech.1006.t: "[FROM.GetName] Mengusulkan Kemitraan"
MUN_czech.1006.d: "[FROM.GetNameDef] telah mendekati kita dengan perjanjian pertahanan bersama, berupaya menghalangi penyerang mana pun dengan gabungan kekuatan tentara kita. Namun menariknya, ada juga bagian rahasia dari perjanjian tersebut, yang menguraikan potensi perluasan pengaruh [ROOT.GetAdjective], dan bagaimana [FROM.GetNameDef] dapat membantu."
MUN_czech.1007.t: "[FROM.GetName] Menuntut Penyelarasan"
MUN_czech.1007.d: "Ketidakpercayaan antara kami dan [FROM.GetNameDef] sejak didirikan telah menyebabkan mereka menuntut keberpihakan kami atau mengambil risiko invasi. Namun menariknya, [FROM.GetNameDef] juga mengajukan permohonan terhadap ambisi teritorial kami, dan berjanji bahwa sebagai imbalannya karena tidak lagi mengajukan klaim kami atas tanah mereka, mereka dapat membantu kami mendapatkan tanah lain yang kami klaim."
MUN_czech.1007.b: "Kita harus menjaga kedaulatan kita!"
MUN_czech.1008.t: "[FROM.GetName] Menyarankan Sekutu [CZE_invited_country.GetName]"
MUN_czech.1008.d: "Perwakilan dari [FROM.GetNameDef], jembatan kami ke Eropa tengah, telah mengusulkan perluasan aliansi kami dengan mengundang [CZE_invited_country.GetName]."
MUN_czech.1008.a: "Pencegahan lebih lanjut terhadap serangan terhadap kami"
MUN_czech.1008.b: "Kita tidak bisa diharapkan untuk membela seluruh Eropa"
MUN_czech.1009.t: "[FROM.GetName] Mengundang Kami ke [CZE.GetFactionName]"
MUN_czech.1009.d: "Para diplomat dari [FROM.GetNameDef] telah menyampaikan bahwa kami akan diterima dalam aliansi mereka. Namun di masa lalu, klaim teritorial kami menjadi bahan perdebatan dalam hubungan dengan [FROM.GetNameDef]. Kita sekarang harus memutuskan apakah akan tetap mempertahankan klaim tersebut, atau fokus pada membangun hubungan yang lebih bersahabat."
MUN_czech.1009.a: "Untuk sekutu baru kita!"
MUN_czech.1009.b: "Kami akan bergabung setelah klaim kami diakui"
MUN_czech.1009.c: "Kami tidak tertarik"
MUN_czech.1010.t: "[FROM.GetName] Mengundang Kami Memimpin [CZE.GetFactionName]"
MUN_czech.1010.d: "Setelah baru-baru ini mencoba mengubah perjanjian Entente Kecil menjadi aliansi nyata, [FROM.GetNameDef] datang dengan sebuah proposal: mereka ingin kita memimpin faksi baru ini. Mereka akan menyerahkan kepemimpinannya dan sebagai imbalannya mereka akan menjadikan kita sebagai pelindung yang berharga, sebuah kesepakatan yang akan memperluas lingkup kita, namun berpotensi dengan negara-negara yang berada dalam ancaman."
MUN_czech.1010.a: "Mereka akan menjadi sekutu yang berharga"
MUN_czech.1010.b: "Melindungi [ROOT.GetNameDef] sudah cukup"
MUN_czech.1011.t: "[FROM.GetName] Mengusulkan Perjanjian Perlindungan"
MUN_czech.1011.d: "Sebagai bagian dari upaya untuk mencegah agresi terhadap [FROM.GetNameDef], diplomat mereka telah mendekati kami dengan rancangan perjanjian pertahanan bersama. Sebagai imbalan atas dukungan kami, mereka akan memberikan perlindungan yang sama kepada kami, sehingga memaksa agresor mana pun untuk terlibat dalam perang dua front."
MUN_czech.1011.a: "Itu sepadan dengan risikonya"
MUN_czech.1011.b: "Netralitas lebih aman"
MUN_czech.1012.t: "[FROM.GetName] Menuntut Penaklukan Kita"
MUN_czech.1012.d: "Didorong oleh aliansi baru mereka, [FROM.GetNameDef] telah menyampaikan serangkaian tuntutan yang setara dengan hilangnya kedaulatan kita. Dengan dukungan [SOV.GetName] mengingat ketertarikan mereka terhadap wilayah tersebut, kita sekarang harus memutuskan apakah kita mampu untuk menolaknya."
MUN_czech.1012.a: "Perlawanan akan menyia-nyiakan [ROOT.GetAdjective] nyawa"
MUN_czech.1012.b: "Kematian sebelum aib!"
MUN_czech.1013.t: "[FROM.GetName] Menawarkan Aliansi Bersyarat"
MUN_czech.1013.d: "Setelah mempertimbangkan dengan cermat, pemerintah [FROM.GetNameDef] mengumumkan bahwa mereka mempunyai pandangan yang sama bahwa aliansi akan menguntungkan, namun mereka juga mengumumkan bahwa mereka tidak dapat mengabaikan klaim teritorial mereka. Oleh karena itu mereka datang dengan sebuah proposal: mereka akan bergabung dengan faksi kami, tetapi hanya jika kami menyerahkan wilayah yang mereka klaim kepada mereka."
MUN_czech.1013.a: "Sebuah pengorbanan yang layak dilakukan"
MUN_czech.1013.b: "Kami berusaha melindungi wilayah kami!"
MUN_czech.1014.t: "[FROM.GetName] Meminta Perlindungan"
MUN_czech.1014.d: "Diplomat berpengaruh dari [FROM.GetNameDef] telah mendekati menteri luar negeri, meminta agar kami memperkuat janji perlindungan yang tidak jelas yang digariskan dalam perjanjian Cekoslowakia-Soviet tahun 1935."
MUN_czech.1014.a: "Mungkin kita harus mencoba melindungi sekutu kita"
MUN_czech.1014.b: "Mari kita menepati janji yang tidak jelas"
MUN_czech.1015.t: "[FROM.GetName] Mengusulkan Penggabungan Fraksi Kami"
MUN_czech.1015.d: "Karena kami sekarang mempunyai musuh yang sama, [FROM.GetName] datang kepada kami dengan proposal yang akan memperdalam kerja sama kami dengan mengintegrasikan faksi kami ke dalam faksi mereka."
MUN_czech.1015.a: "Upaya yang terkoordinasi akan menyelamatkan nyawa"
MUN_czech.1015.b: "Kita harus memegang kendali"
MUN_czech.1016.t: "[FROM.GetName] Mengusulkan Pakta Non-Agresi"
MUN_czech.1016.d: "Melanjutkan perundingan sebelumnya yang dibatalkan setelah perubahan rencana kebijakan luar negeri, [FROM.GetNameDef] telah mengusulkan untuk melanjutkan perundingan mengenai pakta non-agresi."
MUN_czech.1016.a: "Kurangnya satu perbatasan yang harus dilindungi"
MUN_czech.1016.b: "Ini akan menghalangi ambisi kita"
MUN_czech.1017.t: "Invasi Bersama terhadap [GER.GetNameDef]?"
MUN_czech.1017.d: "[FROM.GetNameDef] telah mendekati puncak [ROOT.GetAdjective] dengan rencana rahasia untuk menyerang [GER.GetNameDef]. Setelah menunjukkan betapa berkomitmennya mereka untuk menghilangkan ancaman [GER.GetAdjective], mereka meminta agar kami membantu, untuk bersama-sama mengalahkan tentara [GER.GetAdjective] yang perkasa."
MUN_czech.1017.a: "Kami akan menyerang [GER.GetNameDef] dengan mereka"
MUN_czech.1017.b: "Ini terlalu berbahaya"
MUN_czech.1018.t: "Bertarung Sendirian Melawan [GER.GetNameDef]?"
MUN_czech.1018.t.2: "Invasi Bersama [GER.GetNameDef]"
MUN_czech.1018.d: "Meskipun kami telah melakukan upaya diplomasi yang terbaik, kami tidak dapat mengumpulkan dukungan asing untuk invasi pendahuluan terhadap [GER.GetName]. Pertanyaannya sekarang adalah apakah kami akan melanjutkan rencana penyerangan kami atau tidak."
MUN_czech.1018.d.FRA_POL: "Kabar baik datang dari [FRA.GetNameDef] dan [POL.GetNameDef], diplomat kami melaporkan bahwa kedua negara telah berkomitmen untuk membantu kami dalam invasi [GER.GetNameDef]."
MUN_czech.1018.d.FRA: "Para diplomat kita telah kembali dari [FRA.GetNameDef] dengan kabar baik bahwa mereka bersedia mengambil bagian dalam invasi bersama ke [GER.GetNameDef], kita sekarang harus mengevaluasi apakah kekuatan gabungan kita akan mencukupi."
MUN_czech.1018.d.POL: "Para diplomat kita telah kembali dari [POL.GetNameDef] dengan kabar baik bahwa mereka bersedia mengambil bagian dalam invasi bersama ke [GER.GetNameDef], kita sekarang harus mengevaluasi apakah kekuatan gabungan kita akan mencukupi."
MUN_czech.1018.a: "Mereka tidak akan pernah melihatnya datang"
MUN_czech.1018.b: "Kalau dipikir-pikir, ini terlalu berisiko"
MUN_czech.1019.t: "[FROM.GetName] Tuntutan [762.GetName]"
MUN_czech.1019.d: "Mengutip keinginan untuk memulihkan perbatasan Bohemia sebelumnya, dan untuk melegitimasi kendali mereka atas [72.GetName], perwakilan [FROM.GetAdjective] telah menyampaikan ultimatum yang menuntut kami menyerahkan [762.GetName]."
MUN_czech.1019.a: "Mungkin itu akan membuat kita tetap aman"
MUN_czech.1020.t: "[FROM.GetName] Menawarkan Investasi Bersyarat"
MUN_czech.1020.a: "Banyak sekali!"
MUN_czech.1020.b: "Ketentuan-ketentuan ini tidak dapat diterima"
MUN_czech.1020.d: "Para diplomat telah tiba dari [FROM.GetNameDef], menguraikan perjanjian di mana negara mereka akan berinvestasi dalam industri dan infrastruktur kita, sebagai imbalan atas perjanjian sumber daya. Langkah ini, yang dilakukan setelah investasi yang gagal pada tahun-tahun sebelumnya, menunjukkan adanya upaya baru dalam meningkatkan hubungan kita."
CZE_investment_effects_tt: "Dalam §Y100 hari§! kita akan mendapatkan:\n§YInfrastruktur§! di §Y3§! keadaan acak.\n§YPabrik Sipil§! di §Y1§! acak negara bagian."
MUN_czech.1021.t: "Kembalinya Serikat Pabean Austro-Hungaria?"
MUN_czech.1021.d: "[CZE.GetNameDefCap] telah menghubungi kami dengan rancangan perjanjian perdagangan antara negara-negara bekas Austro-Hungaria. Meski senang dengan kemerdekaan mereka, pemerintahan [CZE.GetAdjective] yang baru tampaknya sangat bersedia memulihkan elemen-elemen bermanfaat bagi bangsa Austria-Hongaria."
MUN_czech.1021.a: "Lebih banyak perdagangan terdengar menarik"
MUN_czech.1021.b: "Kita harus melindungi produsen dalam negeri"
MUN_czech.1022.t: "[CZE.GetName] Merebut Silesia"
MUN_czech.1022.d: "Setelah pertempuran sengit di sekitar pegunungan [69.GetName], pasukan [CZE.GetAdjective] akhirnya berhasil menerobos, dan menguasai seluruh Silesia, sebelum pasukan yang bentrok dengan mereka cukup pulih untuk memberikan perlawanan serius."
MUN_czech.1022.a: "Kita harus melakukan intervensi"
MUN_czech.1022.b: "Kita tidak bisa menciptakan musuh lagi"
MUN_czech.1022.c: "Kemenangan besar!"
MUN_czech.1023.t: "[CZE.GetName] Mulai Perjuangan untuk Silesia"
MUN_czech.1023.d: "Mengutip beberapa alasan kuno mengenai kerajaan dan kekaisaran abad pertengahan, [FROM.GetNameDef] telah meningkatkan pertempuran perbatasan menjadi perang terbatas dalam upaya untuk membangun kendali atas [ROOT.GetAdjective] Silesia."
MUN_czech.1023.a: "Siapkan pasukan"
MUN_czech.1024.t: "[CZE.GetName] Mengusulkan Perdamaian"
MUN_czech.1024.d: "Setelah bentrokan perbatasan di Silesia berubah menjadi perang besar-besaran, [FROM.GetNameDef] kini telah mengindikasikan kesediaannya untuk mengakhiri konflik jika tanah yang mereka klaim diserahkan."
MUN_czech.1024.a: "Mungkin kita harus fokus pada bidang lain"
MUN_czech.1024.b: "Situasi masih menguntungkan kami"
MUN_czech.1024.c: "Ini bukan untuk dinegosiasikan!"
MUN_czech.1025.t: "Akhir dari Misi Relawan Spanyol"
MUN_czech.1025.d.1: "Pasukan [ROOT.GetAdjective] yang dikirim ke [CZE_supported_spanish_faction.GetName] kembali ke rumah setelah membantu mereka meraih kemenangan. Pertempuran ini telah memberikan wawasan baru bagi pasukan kita, dan khususnya detasemen medis mereka."
MUN_czech.1025.d.2: "Meskipun pasukan [ROOT.GetAdjective] bertempur dengan gagah berani dalam Perang Saudara Spanyol, pihak yang kami dukung pada akhirnya dikalahkan. Meskipun demikian, pasukan kami dan terutama tim medis mereka mendapatkan pelajaran berharga."
MUN_czech.1025.a: "Semoga saja kita tidak perlu menerapkan pembelajaran ini di rumah"
MUN_czech.1026.t: "[FROM.GetName] Menolak Lamaran"
MUN_czech.1026.a: "Kerugian mereka"
MUN_czech.1026.b: "Perkembangan yang mengkhawatirkan"
MUN_czech.1026.france_refuses_to_lead: "Meskipun peran kepemimpinan [FROM.GetAdjective] ditawarkan sebagai imbalan untuk bergabung dengan aliansi kami, mereka memutuskan untuk tidak melakukannya. Tampaknya [FROM.GetAdjective] sedang mencoba untuk tetap netral, atau sedang menunggu waktu."
MUN_czech.1026.sphere_of_influence: "Meskipun anggota pemerintah [FROM.GetAdjective] meyakinkan kami bahwa partisipasi kami dalam [ROOT.GetFactionName] dihargai, mereka mengatakan bahwa memperluas pengaruh kami ke Balkan akan berdampak buruk dan mungkin menakuti calon sekutu."
MUN_czech.1026.guarantee: "Para diplomat kami melaporkan bahwa meskipun telah berupaya, [FROM.GetNameDef] tidak setuju dengan usulan kami mengenai perjanjian pertahanan bersama. Tampaknya mereka memperkirakan bahwa kita mempunyai risiko yang lebih besar dibandingkan mereka, semoga saja mereka salah."
MUN_czech.1026.faction_merge: "Terlepas dari upaya terbaik kami, diplomat kami dan [FROM.GetAdjective] tidak dapat menyetujui kesepakatan untuk menyatukan [ROOT.GetFactionName] dan [FROM.GetFactionName]."
MUN_czech.1026.non_aggression: "Meskipun ada jaminan atas niat damai mereka, diplomat [FROM.GetAdjective] menolak menandatangani pakta non-agresi dengan negara kita, alasannya masih harus dilihat."
MUN_czech.1026.trade_deal: "Dengan alasan keinginan untuk tetap mandiri secara ekonomi, [FROM.GetNameDef] telah menolak proposal perjanjian perdagangan kami."
MUN_czech.1026.faction_invite: "Meskipun para diplomat kami menyampaikan argumen mengapa [FROM.GetNameDef] akan mendapat manfaat dari aliansi dengan kami, mereka pada akhirnya tidak berhasil menyelaraskan argumen tersebut."
MUN_czech.1026.weapons_sale: "Terlepas dari tawaran kami yang murah hati, [FROM.GetNameDef] telah memutuskan untuk tidak membeli senjata dari kami saat ini."
MUN_czech.1026.unification: "Meskipun mengakui manfaat yang bisa diperoleh dari federasi, [FROM.GetNameDef] telah memilih untuk mempertahankan pemerintahannya di pengasingan sebagai satu-satunya pemerintahan yang sah atas wilayahnya."
MUN_czech.1026.white_peace: "Perwakilan kami kembali dengan berita duka hari ini bahwa meskipun kami menduduki [66.GetName], pimpinan [FROM.GetAdjective] tidak bersedia menandatangani perjanjian damai. Sepertinya kita harus melangkah lebih jauh dalam penaklukan kita, atau berharap bisa membuat mereka lelah."
MUN_czech.1027.t: "Membuat Kesepakatan Dagang [FROM.GetAdjective]-[ROOT.GetAdjective]?"
MUN_czech.1027.d: "Terlepas dari perbedaan ideologi pada awalnya, [FROM.GetNameDef] telah memanfaatkan pragmatisme kami dalam mendekati kami untuk mencapai kesepakatan perdagangan. Sebagai imbalan atas [FROM.GetAdjective] yang diizinkan mengekstraksi sumber daya di [202.GetName], mereka membantu menyediakan peralatan mesin yang sangat kami perlukan untuk memperluas kapasitas industri kami."
MUN_czech.1027.a: "Sangat bagus."
MUN_czech.1027.b: "Kita harus menolak sumber daya tersebut."
MUN_czech.1028.t: "Upaya Fortifikasi yang Tertunda"
MUN_czech.1028.d: "Banyak orang di negara ini kini mempertanyakan mengapa pemerintah tidak melanjutkan proyek benteng yang telah dimulai akhir tahun lalu. Pemerintah telah mengalokasikan dana untuk proyek pembangunan benteng tambahan melalui Dewan Benteng. Karena tidak adanya kemajuan dalam program ini, masyarakat menuntut agar proyek tersebut dilanjutkan atau dananya dikembalikan. Jika kita ingin melanjutkan program fortifikasi, kita tidak boleh membuang-buang waktu untuk memulai kembali proyek-proyek tersebut agar dapat selesai tepat waktu."
MUN_czech.1028.a: "Kita tidak punya waktu untuk kalah!"
CZE_no_time_to_lose_tt: "Jangka waktu kita untuk menyelesaikan Proyek Fortifikasi sebelum ancaman muncul kini sangat sempit."
MUN_czech.1029.t: "Proyek Fortifikasi telah Selesai"
MUN_czech.1029.d: "Proyek benteng terbaru kami telah selesai dan sumber daya tersedia untuk memulai proyek lain. Teknisi kami siap dikerahkan ke lokasi lain dalam waktu singkat untuk memulai pekerjaan dasar pada jalur benteng baru."
MUN_czech.1029.a: "Tuan-tuan kerja yang luar biasa"
MUN_czech.1030.t: "[FROM.GetName] Menuntut Integrasi"
MUN_czech.1030.d: "[FROM.GetNameDefCap] menuntut kami menjadi bagian dari serikat mereka saat mereka berupaya memperluasnya. Meskipun mereka mengajukan banding ke berbagai negara di kawasan dengan berbagai alasan yang berbeda, Pan-Slavisme, Pan-Balkanisme dan berbagi sejarah di kekaisaran Austro-Hungaria untuk negara lain, seruan tersebut juga disertai dengan ancaman tersirat yang jelas jika kita menolak."
MUN_czech.1030.a: "Mungkin itu tidak terlalu buruk"
MUN_czech.1030.b: "Tidak terlalu meyakinkan"
MUN_czech.1031.t: "[FROM.GetName] Mengusulkan Persatuan"
MUN_czech.1031.d: "Meskipun [ROOT.GetNameDef] menyerah, pemerintah [FROM.GetAdjective] telah mengajukan proposal drastis yang memungkinkan kita untuk terus berjuang: menggabungkan sisa-sisa bangsa kita dengan bangsa mereka."
MUN_czech.1031.a: "Bersama-sama kita bisa melindungi tanah air kita dengan lebih baik"
MUN_czech.1031.b: "Perbedaan kita terlalu besar"
MUN_czech.1032.t: "Menjembatani Kesenjangan"
CZE_divide_nation_title_dynamic_sudentenland: "$MUN_czech.1032.t$ di Sudetenland"
CZE_divide_nation_title_dynamic_czech_states: "$MUN_czech.1032.t$ dengan Pekerja Ceko"
CZE_divide_nation_title_dynamic_tesinko_poles: "$MUN_czech.1032.t$ di [72.GetName]"
CZE_divide_nation_title_dynamic_slovakia_states: "$MUN_czech.1032.t$ di [SLO.GetNonIdeologyName]"
CZE_divide_nation_title_dynamic_hungarian_states: "$MUN_czech.1032.t$ di [664.GetName]"
CZE_divide_nation_title_dynamic_ukrainian_states: "$MUN_czech.1032.t$ di [73.GetName]"
MUN_czech.1032.d: "Upaya yang dilakukan baru-baru ini untuk menyelesaikan permasalahan di [FROM.getname] telah berhasil meredakan kemarahan terhadap pemerintah pusat, setidaknya untuk saat ini. Sumber daya pemerintah kita kini dibebaskan untuk berkomitmen pada program sosial atau ekonomi lainnya yang akan terus memerangi isu-isu yang memecah belah negara kita."
MUN_czech.1032.a: "Mari kita melakukannya lagi"
MUN_czech.1033.t: "[FROM.GetAdjective] Pemerintahan Dalam Pengasingan Meminta Pengakuan"
MUN_czech.1033.d: "[FROM.GetAdjective] Pemerintahan Dalam Pengasingan di bawah $CZE_edvard_benesh$ meminta agar kami menampung delegasi mereka saat mereka berjuang untuk mendapatkan kembali kedaulatan [CZE.GetNonIdeologyName]."
MUN_czech.1033.a: "Sekutu lain melawan [GER.GetAdjective]s"
MUN_czech.1033.b: "Mereka tidak sah"
MUN_czech.1034.t: "Kerusuhan di Slowakia"
MUN_czech.1034.d: "Karena kita menyerah pada sentimen nasionalis kelompok lain, anggota Partai Rakyat Slovakia telah membentuk kekuatan paramiliter mereka sendiri yang kini mengupayakan kemerdekaannya sendiri atau setidaknya otonomi bagi Slovakia. Pertanyaannya sekarang adalah apakah kita harus fokus menjaga kesatuan dengan mencegah hal ini, atau mencapainya dengan membiarkannya dan fokus pada negara-negara yang setia kepada pemerintah."
MUN_czech.1034.a: "Kirim tentara ke Slovakia!"
MUN_czech.1034.b: "Tangkap mereka tetapi berikan otonomi"
MUN_czech.1034.c: "Ambil kendali langsung"
MUN_czech.1034.c_tt: "§RKami akan bergantung pada keputusan [GER.GetNameDef] mengenai nasib Cekoslowakia.§!"
MUN_czech.1035.t: "[FROM.GetName] Penawaran Pembuatan Senjata untuk Kami"
MUN_czech.1035.d: "Kemitraan integral kami dengan [CZE.GetNameDef] telah membuat mereka menawarkan kesepakatan unik: mereka akan memproduksi senjata untuk kami yang saat ini kami buat di dalam negeri, tentu saja dengan harga tertentu. Hal ini pada gilirannya akan memungkinkan kami untuk fokus pada sektor lain dalam industri kami."
MUN_czech.1035.a: "Ini berarti lebih sedikit upaya yang diduplikasi"
MUN_czech.1035.b: "Kita tidak bisa membuat tentara kita bergantung pada peralatan asing"
#MUN_czech.1036.t: "" #Event uses MUN_czech.1032.t
MUN_czech.1036.d: "Depresi Besar tidak memberikan manfaat bagi negara kita baik secara ekonomi maupun politik. Banyak permasalahan ekonomi dan politik regional yang menghantui kita, dan tampaknya permasalahan tersebut menjadi semakin buruk bahkan setelah kita mengalami pemulihan yang ajaib dari Depresi Besar. Kita perlu mengatasi permasalahan ini sebelum hal tersebut semakin memecah belah bangsa kita."
MUN_czech.1036.a: "Kita perlu memulihkan bangsa kita"
CZE_divided_nation_event_onbroad_tt: "Membuka §YKeputusan§! yang memungkinkan kita untuk §YMenghapus§! §YPengubah Keadaan§! yang negatif pada Keadaan Inti kita.\n\nMenyelesaikan §YKeputusan§! ini juga akan menurunkan Pengubah Negatif pada §Y$CZE_a_divided_nation_dynamic_modifier$§! Semangat Kebangsaan sampai §YDihapus§!."
MUN_czech.1037.t: "[GER.GetName] Melindungi [HUN.GetName]"
MUN_czech.1037.d: "Setelah memperhatikan perang yang jelas-jelas terjadi di negara kita terhadap [HUN.GetNameDef], perwakilan [GER.GetAdjective] telah menjelaskan bahwa berperang dengan [HUN.GetAdjective] berarti perang dengan [GER.GetNameDef] juga. Apakah akan melanjutkan sekarang, itu terserah kita."
MUN_czech.1037.a: "Rencana kita harus dibatalkan"
MUN_czech.1037.b: "Ini tidak mengubah apa pun"
MUN_czech.1038.t.1: "[FROM.GetName] Menawarkan Lisensi Desain Tangkinya"
MUN_czech.1038.t.2: "[FROM.GetName] Penawaran untuk Menjual Senjata"
MUN_czech.1038.t.3: "[FROM.GetName] Penawaran untuk Menjual Artileri"
MUN_czech.1038.t.4: "[FROM.GetName] Penawaran Jual Tank Ringan"
MUN_czech.1038.t.5: "[FROM.GetName] Penawaran untuk Menjual Pesawat Tempur"
MUN_czech.1038.d: "Perwakilan dari pemerintah [FROM.GetAdjective] dan perusahaan senjatanya telah menghubungi kami dengan proposal penjualan senjata. Harganya terlihat cukup normal, dan [FROM.GetNameDef] juga menawarkan beberapa senjata yang sangat modern."
MUN_czech.1038.a: "Kedengarannya bagus"
MUN_czech.1039.t: "[RUT.getname] Menginginkan Perjanjian Otonomi"
MUN_czech.1039.d: "Sehubungan dengan Perjanjian Otonomi, kami memberikan [SLO.getname], $RUT_augustin_voloshyn$ telah menanyakan tentang wilayahnya yang memiliki perjanjian federalisasi yang sama dengan kami. Hal ini tampaknya tidak masuk akal, namun mengingat kondisi yang ada, kita harus menerima tuntutan ini begitu saja."
MUN_czech.1039.a: "Kita lihat saja nanti"
MUN_czech.1040.t: "[CZE.getname] menawarkan kepada kita Perjanjian Serikat Pabean"
MUN_czech.1040.d: "[CZE.getnameDEFCAP] baru-baru ini meninjau kembali pembicaraan diplomatik mengenai kesatuan pabean antara kedua negara kita. Kesepakatan yang ingin mereka capai nampaknya adil, namun mungkin akan mencakup tuntutan-tuntutan lain di kemudian hari yang mungkin tidak siap kita terima. Perjanjian ini dan apa yang diperdagangkan terkesan sepele dan simbolis, sehingga tidak ada salahnya menandatanganinya."
MUN_czech.1040.a: "Tampaknya tidak berbahaya"
MUN_czech.1040.b: "Ini tidak bisa dipercaya"
MUN_czech.1041.t: "[FROM.getname] Menolak Perjanjian Serikat Pabean"
MUN_czech.1041.d: "Mengutip beberapa alasan mengenai bagaimana perjanjian ini dapat mengganggu perekonomian mereka, [From.getname] telah menolak untuk menandatangani perjanjian serikat pabean antara kedua negara kita. Alasan-alasan ini tampak seperti alasan yang tidak berdasar dan tidak berdasar."
MUN_czech.1041.a: "Mengecewakan"
MUN_czech.1042.t: "[FROM.getname] Menyetujui Perjanjian Serikat Pabean"
MUN_czech.1042.d: "Melihat bahwa Perjanjian tersebut memuaskan, [FROM.getname] telah menyetujui persyaratannya. Mudah-mudahan, ini adalah langkah pertama menuju hubungan yang lebih erat antara kedua negara."
MUN_czech.1042.a: "Luar biasa"
MUN_czech.1043.t: "[FROM.getname] Menuntut Kami Bergabung dengan Federasi Mereka"
MUN_czech.1043.d: "Mengutip hubungan yang lebih erat antara kedua negara dan perkembangan terkini di seluruh dunia. [FROM.getname] mengatakan bahwa akan lebih baik berada di bawah perlindungan mereka daripada sendirian. Tampaknya ini hanyalah taktik mereka untuk menduduki wilayah kita. Apa yang harus kita lakukan?"
MUN_czech.1043.a: "Kami menerima"
MUN_czech.1043.b: "Ide yang buruk"
MUN_czech.1044.t: "[FROM.getname] Menolak Bergabung dengan Federasi"
MUN_czech.1044.d: "Melihat bahwa mereka akan lebih baik sendirian daripada di bawah kita. [FROM.getname] telah menolak kesempatan untuk bergabung dengan federasi kami. Ini merupakan pukulan terhadap tujuan kami untuk memperkuat posisi kami di Eropa. Apa yang harus kita lakukan sekarang agar [FROM.getname] tidak sadar."
MUN_czech.1044.a: "Sayang sekali"
MUN_czech.1044.b: "Kita harus mencoba cara lain"
MUN_czech.1045.t: "[FROM.getname] Setuju untuk Bergabung dengan Federasi"
MUN_czech.1045.d: "Melihat bahwa mereka akan lebih terlindungi di bawah kita daripada sendirian. [FROM.getname] telah dengan bijak bergabung dengan federasi kami. Hal ini akan sangat memperkuat posisi kita di Eropa."
MUN_czech.1045.a: "Luar biasa"
MUN_czech.1046.t: "Menyembuhkan Kesenjangan"
MUN_czech.1046.d: "Setelah mengatasi banyak masalah di negara kita, ketegangan di negara kita tampaknya mulai mereda. Setelah menyelesaikan banyak program ekonomi dan sosial nampaknya kini negara kita mulai pulih."
MUN_czech.1046.a: "Berita bagus"
#MUN_czech.1047 is hidden
MUN_czech.1048.t: "[FROM.GetName] Menerima Permintaan"
MUN_czech.1048.t2: "[FROM.GetName] Menyetujui Usulan"
MUN_czech.1048.d: "Dengan enggan, pejabat [FROM.GetAdjective] telah memberi tahu kami bahwa mereka bermaksud untuk menuruti tuntutan teritorial kami. Pasukan [FROM.GetAdjective] sudah menarik diri dari wilayah tersebut."
MUN_czech.1048.d2: "Setelah berdiskusi panjang lebar, para pejabat kami dan orang-orang dari [FROM.GetNameDef] telah berhasil menyetujui peran baru perekonomian [FROM.GetAdjective] sebagai bagian dari serikat pekerja kami. Pengaturan ini pasti akan membawa kesejahteraan bagi kedua warga negara kita."
MUN_czech.1048.d3: "Proposal kami mengenai pakta non-agresi langsung disambut dengan antusias oleh perwakilan [FROM.GetAdjective], tampaknya ambisi mereka saat ini terfokus pada hal lain."
MUN_czech.1048.d4: "Karena mendapati diri mereka berada di bawah ancaman besar, [FROM.GetNameDef] telah memenuhi tuntutan kami untuk penyelarasan."
MUN_czech.1048.d5: "Setelah diskusi yang panjang, para pejabat kami dan orang-orang dari [FROM.GetNameDef] telah berhasil mencapai kesepakatan di mana sebagian dari industri militer kami akan didedikasikan untuk memproduksi peralatan untuk mereka. Sebagai imbalannya, kami akan menerima barang dagangan untuk pasar dan produksi kami."
#MUN_czech.1049 is a faction joining event so largely reuses generic loc
MUN_czech.1049.d: "Pemerintahan baru [FROM.GetNameDef] telah mendekati kami untuk mengusulkan aliansi. Meskipun pemerintahan militer baru mereka awalnya bersikap anti-Jerman, tampaknya mereka bersikap pragmatis dan menyadari bahwa mitra internasional lama mereka tidak dapat diandalkan."
MUN_czech.1050.d: "Diplomat kami kembali dari [FROM.GetNameDef] dengan berita mengecewakan bahwa permintaan kami untuk bergabung dengan aliansi mereka ditolak. Meskipun alasannya tidak jelas, kita sekarang berada dalam situasi sulit di mana kita mengungkapkan kekhawatiran kita terhadap sekutu tradisional kita, tanpa bisa mendapatkan sekutu baru."
MUN_czech.1050.a: "Maka mungkin kita harus menawarkan persyaratan yang lebih menguntungkan"
MUN_czech.1050.b: "Mari kita mencari sekutu yang lebih baik"
MUN_czech.1051.t: "[FROM.GetName] Meminta Lingkup Pengaruh"
MUN_czech.1051.d: "Sekutu baru kami, [FROM.GetNameDef] telah menyatakan minatnya untuk memperluas pengaruhnya melintasi perbatasan. Akibatnya, perwakilan [FROM.GetAdjective] datang meminta izin dan dukungan untuk perluasan ini, dimana batas yang jelas antara wilayah di bawah pengaruh [ROOT.GetAdjective] dan [FROM.GetAdjective] harus ditetapkan."
MUN_czech.1051.a: "Kita harus memperkuat sekutu utama kita, [FROM.GetAdjective]"
MUN_czech.1052.t: "[FROM.GetName] Permintaan Kami Izinkan Lintasan untuk Pasukan [SOV.GetAdjective]"
MUN_czech.1052.d: "Setelah perjanjian diplomatik baru antara [FROM.GetNameDef] dan [SOV.GetNameDef], [FROM.GetNameDef] merasa yakin bahwa [SOV.GetNameDef] akan melindungi mereka jika terjadi konflik. Satu-satunya kendala adalah kurangnya koneksi darat antara keduanya, akibatnya, diplomat [FROM.GetAdjective] telah mendekati pemerintah kami, meminta agar kami mengizinkan lewatnya pasukan [SOV.GetAdjective] melalui wilayah kami ke [FROM.GetNameDef] jika terjadi konflik."
MUN_czech.1052.a: "Pertarungan mereka akan melindungi kita juga"
MUN_czech.1053.t: "[FROM.GetName] Menekan Kami dengan [HUN.GetAdjective] Klaim"
MUN_czech.1053.d: "Setelah mengubah [HUN.GetNameDef] menjadi status klien, [FROM.GetNameDef] kini menuntut agar kami menerima nasib yang sama. Mereka mengancam jika kami menolak, mereka akan mendukung klaim [HUN.GetAdjective] atas wilayah [ROM.GetAdjective]. Kini kita harus memilih antara kehilangan kedaulatan atau berpotensi membahayakan integritas wilayah kita."
CZE_cancel_anti_hungary_focus_tt: "Membatalkan fokus §Y$CZE_neutralize_the_hungarian_threat$§!"
MUN_czech.1054.t: "Invasi Bersama [LIT.GetName]?"
MUN_czech.1054.d: "Seperti yang telah disepakati sebelumnya, [FROM.GetNameDef] hadir dengan usulan yang dapat membantu memperkuat bangsa kita. Yaitu dengan menyatukan secara paksa dengan [LIT.GetNameDef], ini akan memberi kita akses ke sumber daya tambahan dan akan menyangkal kemungkinan musuh menyerang kita melalui [LIT.GetNameDef]."
MUN_czech.1054.a: "Kita harus melakukan ekspansi untuk melawan ekspansi pihak lain"
MUN_czech.1055.t: "[SOV.GetAdjective] Relawan Tiba"
MUN_czech.1055.d: "Dalam pencapaian logistik udara yang belum pernah terjadi sebelumnya, [SOV.GetNameDef] telah menggunakan angkatan udaranya untuk mengerahkan beberapa divisi sukarelawan ke bandara kami di [73.GetName] untuk mendukung upaya perang kami saat ini."
MUN_czech.1056.t: "[FROM.GetName] Tuntutan [975.GetName]"
MUN_czech.1056.d: "Seperti yang pernah diusulkan dalam Konferensi Perdamaian Paris setelah Perang Besar, [CZE.GetNameDef] telah mengumumkan bahwa mereka menganggap perlu adanya koridor bagi sekutunya, [YUG.GetNameDef], untuk keselamatan aliansi mereka. Untuk mencapai tujuan tersebut, perwakilan [FROM.GetAdjective] telah menyampaikan ultimatum yang menuntut kita menyerahkan [975.GetName]."
#THE FALL OF THE REPUBLIC EVENTS#
MUN_the_fall_of_the_republic.1.t: "Meluasnya Protes"
MUN_the_fall_of_the_republic.1.d: "Keputusan [ROOT.GetLeader] baru-baru ini untuk menyerahkan Sudetenland telah menyebabkan pecahnya protes di seluruh negeri. Meskipun para pemimpin politik dan militer ingin menghindari pertumpahan darah dalam apa yang mereka anggap sebagai perlawanan yang tidak ada gunanya dalam menghadapi rintangan yang tidak mungkin terjadi, banyak orang di negara ini yang merasa bahwa mereka telah mengambil keputusan yang salah. Beberapa gerakan politik kini mengambil keuntungan dari kekacauan ini demi mencapai tujuan mereka."
MUN_the_fall_of_the_republic.1.a: "Kami tidak punya pilihan!"
MUN_the_fall_of_the_republic.2.t.1: "Jatuhnya Republik Pertama"
MUN_the_fall_of_the_republic.2.t.2: "Kekacauan di dalam Pemerintahan"
MUN_the_fall_of_the_republic.2.d: "Setelah keputusan pemerintah untuk Menyerahkan Sudetenland, gelombang besar pengunduran diri para pemimpin junior di angkatan darat dan pemerintahan telah membombardir negara kita. Beberapa dari orang-orang ini dilaporkan telah meninggalkan negara itu dalam semalam. Perubahan besar diperlukan dalam pemerintahan kita untuk membendung keluarnya pejabat yang mengundurkan diri dan memulihkan kepercayaan terhadap kemampuan kita untuk memimpin."
MUN_the_fall_of_the_republic.2.a: "Kita membutuhkan perubahan radikal."
MUN_the_fall_of_the_republic.2.b: "Kita harus tetap berada di jalur yang benar!"
MUN_the_fall_of_the_republic.3.t: "[RUT.getname] meminta Otonomi"
MUN_the_fall_of_the_republic.3.d: "Dengan kekacauan politik baru-baru ini yang menimpa negara kita, wilayah kecil Carpatho Ukraina ingin lebih otonom dari [9.GetCapitalVictoryPointName]. Mengutip perbedaan lama antara wilayah tersebut dan [ROOT.getname] lainnya. Namun, permintaan ini nampaknya seperti para pemimpin lokal yang memanfaatkan peluang untuk memberdayakan diri mereka sendiri. Menolak permintaan ini akan menghabiskan banyak modal politik pada saat kita tidak punya uang lagi."
MUN_the_fall_of_the_republic.3.a: "Tentu, kenapa tidak?"
MUN_the_fall_of_the_republic.3.b: "Sama sekali tidak!"
MUN_the_fall_of_the_republic.3.c: "Potong-potong."
MUN_the_fall_of_the_republic.4.t: "Nasib [RUT.getname]"
MUN_the_fall_of_the_republic.4.d: "Sebagai buntut dari kekacauan yang baru-baru ini menimpa [CZE.getname], wilayah kecil [RUT.getname] telah berada di luar batas negara mana pun. Wilayah kecil ini mengklaim sebagai negara merdeka dan melakukan upaya diplomasi terhadap negara-negara tetangganya. Banyak orang di pemerintahan kita khawatir bahwa wilayah penting yang strategis di perbatasan kita akan jatuh ke tangan orang lain. Tentara telah menyarankan untuk mengeluarkan ultimatum kepada wilayah yang memisahkan diri tersebut, yang menuntut segera aneksasi mereka."
MUN_the_fall_of_the_republic.4.a: "Kirimkan ultimatum kepada mereka segera!"
MUN_the_fall_of_the_republic.4.b: "Ini mungkin berisiko, mari kita tunggu saja."
MUN_the_fall_of_the_republic.5.t: "[FROM.getname] Menuntut Aneksasi kami!"
MUN_the_fall_of_the_republic.5.d: "Setelah kami merdeka, hanya masalah waktu saja sebelum negara tetangga mau memasukkan kami ke dalam wilayah mereka. [FROM.getname] tampaknya menjadi pihak pertama yang melakukan hal tersebut dan menuntut penyerahan diri kami. Apa yang harus kita lakukan?"
MUN_the_fall_of_the_republic.5.a: "Kami akan melawanmu sampai orang terakhir!"
MUN_the_fall_of_the_republic.5.b: "Kami tidak punya pilihan selain mengatakan ya."
MUN_the_fall_of_the_republic.6.t: "[FROM.getname] Menolak Ultimatum kami!"
MUN_the_fall_of_the_republic.6.d: "Secara mengejutkan, [FROM.getname] telah menolak ultimatum kami dan malah berupaya melakukan perlawanan bersenjata terhadap kami. Mereka tidak memberi kami pilihan selain menyerang. Rencana pertempuran dan rute penyerangan sudah dirumuskan, yang harus kita lakukan hanyalah memberi perintah untuk menyerang."
MUN_the_fall_of_the_republic.6.a: "Kami memperingatkan mereka."
MUN_the_fall_of_the_republic.6.a_tt: "Operasi ini tidak akan mempengaruhi §Y$HUN_pal_teleki$§! kecuali [RUT.GetNameDef] memiliki sekutu"
MUN_the_fall_of_the_republic.6.b: "Ini mungkin menjadi bumerang, sebaiknya ditunda."
MUN_the_fall_of_the_republic.7.t: "[FROM.getname] Menyerah pada Permintaan Kami"
MUN_the_fall_of_the_republic.7.d: "Tidak mengejutkan siapa pun, [FROM.getname] telah menerima tuntutan kami dan bersedia dianeksasi ke negara kami dengan imbalan beberapa syarat sepele. Wilayah kecil ini tidak punya peluang untuk melawan negara sekuat negara kita. Perbatasan utara kita sekarang lebih terlindungi dibandingkan sebelumnya, dan pemerintah sangat senang dengan kemenangan mudah yang diraih."
MUN_the_fall_of_the_republic.7.a: "Berita bagus."
#BOP EVENTS#
MUN_czech_bop.1.t: "Kesiapan Armada"
MUN_czech_bop.1.d: "Upaya reformasi pada paruh pertama dekade ini mulai membuahkan hasil. Tentara saat ini adalah salah satu yang paling modern di Eropa. Namun rasa puas diri mulai muncul di kalangan politisi dan pimpinan konglomerat industri. Jika tentara kita ingin tetap dalam kesiapan puncak, kita harus berjuang melawan kemungkinan keraguan akan kemampuan tentara kita untuk berperang dan pihak-pihak yang berupaya melemahkannya demi keuntungan pribadi."
MUN_czech_bop.1.a: "Kami akan siap."
MUN_czech_bop.2.t.1: "Ancaman Persenjataan Kembali Jerman"
MUN_czech_bop.2.t.2: "Ekspansi Militer Negara Tetangga"
MUN_czech_bop.2.d.1: "Remiliterisasi yang dilakukan [GER.getnameDEFcap] baru-baru ini di Rhineland telah membuat takut beberapa pemimpin militer dan politik kita. Meskipun banyak yang percaya pada aliansi yang telah dibuat negara tersebut dan persiapan yang dilakukan tentara saat ini untuk menghadapi kemungkinan ancaman Jerman. Namun ada pula yang tidak begitu yakin bahwa kita mampu melawan ancaman [GER.GetAdjective] apa pun."
MUN_czech_bop.2.d.2: "Berita baru-baru ini bahwa beberapa negara tetangga kita telah mengambil program untuk memperluas militer mereka telah membuat takut beberapa pemimpin militer dan politik kita. Banyak yang percaya pada aliansi yang telah dibuat negara ini dengan negara-negara lain dan persiapan yang dilakukan tentara saat ini untuk menghadapi kemungkinan ancaman asing. Namun, beberapa pihak tidak begitu yakin bahwa kita mampu menghadapi kemungkinan agresi asing."
MUN_czech_bop.2.a: "Kami akan bersiap."
MUN_czech_bop.2.a_tt: "Upaya persenjataan kembali yang dilakukan negara-negara tetangga kita telah menyebabkan beberapa anggota militer kita meragukan kemampuan kita untuk melawan kemungkinan agresi. Kita harus meyakinkan tentara dengan tindakan kita."
MUN_czech_bop.3.t: "[CZE.getname] telah mengirimkan Pengamat ke Negara kita"
MUN_czech_bop.3.d: "[CZE.getname] baru-baru ini mengirimkan individu ke negara kami untuk mengamati konflik yang sedang berlangsung. Pada saat yang sama salah satu produsen senjata kecil mereka telah menghubungi beberapa diplomat kami melalui saluran sekunder dan bertanya-tanya apakah kami tertarik membeli senjata kecil dari mereka. Hal ini akan melibatkan penyelundupan senjata ke negara kita karena pembatasan yang diberlakukan pada kita."
MUN_czech_bop.3.a: "Mari kita lihat ke mana arahnya."
MUN_czech_bop.3.b: "Kita tidak bisa membiarkan mereka melakukan lebih dari sekadar mengamati."
MUN_czech_bop_3_tt: "§Y[CZE.getname]§! Produsen Senjata §Y$CZE_zbrojovka_brno_organization$§! mungkin mencoba menyelundupkan senjata kepada kami."
MUN_czech_bop.4.t: "Skema $CZE_zbrojovka_brno_organization$"
MUN_czech_bop.4.d: "[ETH.getname] telah melakukan kontak dengan perwakilan produsen senjata $CZE_zbrojovka_brno_organization$ dan tertarik untuk menyelundupkan senjata kami ke negara tersebut. Meskipun Liga Bangsa-Bangsa memberikan sanksi terhadap [ETH.GetNameDef], $CZE_zbrojovka_brno_organization$ bersedia melanjutkan skema ini. Melanggar mandat Liga Bangsa-Bangsa akan menjadi tidak populer secara internasional jika kita tertangkap."
MUN_czech_bop.4.a: "Mari kita lakukan"
MUN_czech_bop.4.b: "Ini tidak sebanding dengan kemungkinan reaksi baliknya"
CZE_gun_smuggling_tt: "Penyelundupan Senjata ke Dalam Negeri"
CZE_we_got_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! tertangkap."
CZE_we_dont_get_caught_tt: "§Y$CZE_zbrojovka_brno_organization$§! tidak tertangkap."
MUN_czech_bop.5.t: "$CZE_zbrojovka_brno_organization$ menyetujui Skema Penyelundupan"
MUN_czech_bop.5.d: "Setelah berbicara dengan perwakilan pemerintah Ceko, $CZE_zbrojovka_brno_organization$ telah diberi izin rahasia untuk mulai menyelundupkan sejumlah kecil senjata ringan ke negara tersebut. Keahlian mereka juga akan tersedia bagi kami melalui jalur belakang kami."
MUN_czech_bop.5.a: "Kami akan memanfaatkannya dengan baik."
MUN_czech_bop_5_tt: "§YProdusen§! ini akan §RDihapus§! setelah perang berakhir."
##SLOVAKIA##
MUN_slovakia_little_war.1.t: "Kemenangan di [71.Getname]"
MUN_slovakia_little_war.1.d: "Tentara kami menunjukkan performa yang baik di [71.Getname] dengan mengalahkan pasukan musuh di daerah tersebut. Komandan kami telah memperoleh informasi dan pelajaran berharga dari pertempuran yang dapat mereka gunakan di masa depan."
MUN_slovakia_little_war.1.a: "Kerja bagus."
MUN_slovakia_little_war.2.t: "Kalah di [71.Getname]"
MUN_slovakia_little_war.2.d: "Meskipun kami telah berupaya semaksimal mungkin, pasukan kami dikalahkan di [71.Getname]. Ketidakmampuan untuk mengumpulkan cukup amunisi dan peralatan bermotor pada saat konflik merupakan faktor utama kekalahan kami. Meskipun mengalami kemunduran, para komandan yang terlibat dalam pertempuran telah memetik beberapa pelajaran yang sangat penting."
MUN_slovakia_little_war.2.a: "Performa mengecewakan."
MUN_slovakia_little_war.3.t: "Bentrokan Perbatasan di [71.Getname]"
MUN_slovakia_little_war.3.d: "Bahkan setelah memperoleh wilayah kami di $GER_first_vienna_award$, [HUN.getnamedef] masih berupaya melakukan penyesuaian perbatasan lebih lanjut dengan kami di [71.getname]. Kita perlu menghadapi tantangan ini dengan kekuatan untuk menunjukkan kepada mereka bahwa kita tidak akan menyerahkan tanah kita tanpa perlawanan."
MUN_slovakia_little_war.3.a: "Beraninya mereka!"
MUN_slovakia_little_war.4.t: "Kebuntuan di [71.Getname]"
MUN_slovakia_little_war.4.d: "Meskipun kami telah berupaya sebaik mungkin, pasukan kami tidak mampu memenangkan pertempuran di [71.Getname]. Ketidakmampuan mengumpulkan cukup amunisi dan peralatan bermotor pada saat konflik merupakan faktor kunci ketidakmampuan kami meraih kemenangan. Meskipun mengalami kemunduran, para komandan yang terlibat dalam pertempuran telah memetik beberapa pelajaran yang sangat penting."
MUN_slovakia_little_war.4.a: "Mengecewakan."
##Exile##
MUN_czech_exile.1.t: "[CZE.GetAdjective] Orang buangan Tiba di [ROOT.GetNameDef]"
MUN_czech_exile.1.d: "Setelah [GER.GetNameDef] membubarkan negaranya setelah Konferensi Munich, [CZE.GetAdjective] orang buangan telah tiba di banyak negara, termasuk negara kita. Mereka bersedia mengangkat senjata untuk membantu kami, melakukan hal ini dengan harapan suatu hari nanti mereka dapat membebaskan negara mereka dengan bantuan kami."
MUN_czech_exile.1.a: "Selamat datang."
##NEWS EVENTS##
MUN_czech.news.1.t: "Krisis Sudetenland"
MUN_czech.news.1.desc: "Masyarakat di Sudetenland telah memulai pemberontakan bersenjata melawan [CZE.getnameDef]. Laporan mulai berdatangan bahwa paramiliter mulai menyerang kantor polisi dan gedung-gedung pemerintah di seluruh wilayah. Hal ini dipicu oleh berita baru-baru ini bahwa [FROM.getname] berupaya mencaplok wilayah tersebut.\n\nPemberontakan ini tampaknya merupakan awal dari konflik yang lebih besar antara [FROM.getname] dan [CZE.GetNameDef]. Sebuah konflik yang kini sepertinya tidak bisa dihindari."
MUN_czech.news.1.a: "Hal ini bukan pertanda baik bagi Eropa."
MUN_czech.news.1.b: "Kekacauan adalah sebuah Tangga."
MUN_czech.news.1.c: "Kami akan Menang!"
MUN_czech.news.1.d: "Semoga Diplomasi Menang."
MUN_czech.news.2.t: "[FROM.GetNameDefCap] menyerang [RUT.GetNameDef]"
MUN_czech.news.2.desc: "Dalam rangkaian peristiwa baru-baru ini setelah kekacauan politik di [CZE.getname], wilayah kecil [RUT.getname] telah berada di luar perbatasan negara mana pun. Negara kecil yang memisahkan diri tersebut kemudian mendeklarasikan dirinya sebagai negara merdeka dan mulai membentuk milisi untuk mencoba melindungi negara barunya.\n\n[FROM.getnamedefcap] telah lama mempunyai rencana di wilayah tersebut dan melihat adanya peluang, mereka segera menyerbu negara kecil yang memisahkan diri tersebut. Kemenangan mereka atas [RUT.getname] sepertinya sudah pasti bagi banyak pengamat."
MUN_czech.news.2.a: "Carpathia apa?"
MUN_czech.news.2.b: "Ini akan mudah."
MUN_czech.news.2.c: "Datanglah jika kamu berani!"
MUN_slovakia.news.1.t: "Pertempuran Perbatasan di [71.Getname]"
MUN_slovakia.news.1.desc: "Meskipun mendapatkan kembali [664.Getname] setelah terjadinya $GER_first_vienna_award$, [HUN.getnamedef] masih berusaha untuk membuat penyesuaian tambahan dengan perbatasannya dengan [SLO.getnamedef] di [71.Getname].\n\nKonflik ini tampaknya seperti alasan bagi [HUN.getnamedef] untuk menguji seberapa kuat militernya melawan oposisi yang jauh lebih lemah. Tentara muda [SLO.getnamedef] mungkin belum siap menghadapi tantangan di hadapan mereka."
MUN_slovakia.news.1.a: "Anak-anak yang Bertengkar."
MUN_slovakia.news.1.b: "Kami Siap untuk Tugas tersebut."
