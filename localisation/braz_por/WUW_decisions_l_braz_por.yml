 GER_exploit_the_gombos_treaty: "Memanfaatkan Perjanjian Perdagangan Gömbös"
 GER_exploit_the_gombos_treaty_desc: "Perjanjian perdagangan yang ditandatangani Perdana Menteri Hongaria Gyula Gömbös dengan kami pada tahun 1934 penting untuk menstimulasi perekonomian Hongaria dan membantu pemulihan dari depresi besar, namun juga memiliki kelemahan besar bagi mereka. Meskipun perjanjian tersebut memberi mereka harga yang menguntungkan untuk penjualan gandum, uang yang diperoleh harus tetap berada di rekening di Jerman dan hanya digunakan untuk membeli barang-barang industri Jerman. Oleh karena itu, kita dapat mengosongkan rekening yang telah mereka simpan di negara kita untuk membantu perekonomian kita sendiri, namun dengan konsekuensi kehilangan sekutu potensial."
