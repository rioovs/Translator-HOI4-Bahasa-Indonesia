antilles_category: "Konfederasi Antilla"
antilles_category_desc: "Konfederasi Antilla adalah gagasan kuat Ramón Emeterio Betances tentang perlunya penduduk asli Karibia untuk bersatu menjadi entitas regional yang berupaya menjaga kedaulatan dan kesejahteraan negara-negara Antilla. Dukungan terkuat muncul sejak tahun 1850-an hingga Perang Spanyol-Amerika, dan sejak itu sebagian besar telah memudar, namun tidak semuanya hilang. Dengan menerapkan semangat jalan bersama, kita dapat berupaya mendirikan Konfederasi Antilla untuk selamanya. Antillen untuk Antillen!"
