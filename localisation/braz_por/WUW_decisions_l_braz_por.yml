 GER_mitteleuropa_allied_trade_cat_desc: "Sekutu-sekutu kita mempunyai banyak sumber daya yang dapat berguna bagi negara kita, dan kita akan mendapatkan keuntungan besar dari memperdalam hubungan perdagangan dengan negara-negara ini. Kita akan memastikan aliran sumber daya penting yang stabil, dan pada saat yang sama menghilangkan sumber daya yang sama dari musuh kita – memperkuat kita dan melemahkan mereka."
