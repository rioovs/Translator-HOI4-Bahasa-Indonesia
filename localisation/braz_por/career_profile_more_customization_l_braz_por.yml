 # Ribbons
 CAREER_PROFILE_SYNTHETIC_SECURITY: "Keamanan Sintetis"
 CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Dapatkan lebih dari 30 unit karet dari sumber buatan (kilang sintetis)."
 CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "\"Jika perempuan di pabrik berhenti bekerja selama 20 menit, sekutu akan kalah perang.\"
 CAREER_PROFILE_RUBBER_BARON: "Baron Karet"
 CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Menguasai sedikitnya 1000 unit Karet dan mempunyai Perekonomian Tertutup."
 CAREER_PROFILE_RUBBER_BARON_QUOTE: "\"...pengambilan wilayah penghasil karet utama di Timur Jauh pada tahun 1942 menghilangkan sumber dari 90 persen produksi karet alam dunia.\"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "Truk akan selalu lewat"
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Miliki lebih dari 5000 truk pasokan yang mengirimkan pasokan ke tentara."
 CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "\"Mereka bilang pembom akan selalu lewat. Tapi truk sudah ada di sana.\"
 CAREER_PROFILE_MARE_NOSTRUM: "Mare Nostrum"
 CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Mendapatkan Dominasi Angkatan Laut di enam wilayah laut utama Laut Mediterania, yang setidaknya satu di antaranya sedang diperebutkan."
 CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "\"Ketika saya kehilangan senapan saya, Angkatan Darat menagih saya 85 dolar. Itu sebabnya di Angkatan Laut Kapten turun bersama kapalnya.\"
 CAREER_PROFILE_BLITZ_THIS: "Hancurkan ini..."
 CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Pilih pertahanan elastis sebagai strategi pilihan pada jenderal, marshal lapangan, atau negara."
 CAREER_PROFILE_BLITZ_THIS_QUOTE: "\"Tarik kembali garisnya seperti pemanah menarik busur, lalu lepaskan.\"
 CAREER_PROFILE_SCORCHED_EARTH: "Bumi Hangus"
 CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Meledakkan rel kereta api menggunakan fitur \"Bumi Hangus\" untuk memperlambat gerak maju musuh."
 CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "\"..musuh tidak boleh meninggalkan satu mesin pun, satu gerbong kereta pun, tidak satu pun pon biji-bijian atau satu galon bahan bakar.\"
 CAREER_PROFILE_RULED_BY_FURNITURE: "Diperintah oleh Furnitur!"
 CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "Tidak ada satu orang atau sekelompok orang yang digambarkan bertanggung jawab atas negara Anda."
 CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "\"Khawatir itu seperti kursi goyang, ia memberimu sesuatu untuk dilakukan, namun tidak membawamu kemana-mana.\"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "Obligasi Seribu Tahun"
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Kerahkan seratus batalyon kavaleri atau unta."
 CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "\"Seekor kuda harus sedikit gila untuk menjadi tunggangan kavaleri yang baik, dan penunggangnya harus benar-benar gila.\"
 CAREER_PROFILE_ROCKETS_REIGN: "Pemerintahan Roket"
 CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Bangun lebih dari 10 situs roket."
 CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "\"Roket itu bekerja dengan sempurna kecuali mendarat di planet yang salah.\"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "Baja dengan Kecepatan Tinggi"
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Kerahkan lebih dari 4000 tank dengan Kecepatan Maks lebih dari 12km/jam."
 CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "\"Jika semuanya tampak terkendali, Anda tidak melaju cukup cepat.\"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM: "Orkestra Boom"
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Kerahkan divisi yang berisi setidaknya satu batalion \"Anti-Udara\", \"Artileri\", \"Artileri Roket\" dan \"Anti-Tank\", didukung oleh kompi sinyal."
 CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\"Sungguh suara yang semakin meningkat, begitu terus-menerus hingga menyatu dan menyatu menjadi satu raungan yang memusnahkan, deru kereta api di dalam terowongan diperbesar jutaan kali lipat.\"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "Tugas Gagal Berhasil"
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION: "Gagal dalam serangan saat memiliki peluang sukses 80% atau lebih tinggi."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE: "\"Penggerebekan itu harus dianggap sebagai pengintaian yang berlaku... Kami harus mendapatkan semua informasi yang diperlukan sebelum melancarkan operasi dalam skala yang jauh lebih besar...\"
 CAREER_PROFILE_PUNCH_IT: "Pukulan itu!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION: "Berhasil menyerang fasilitas nuklir, sambil mengendalikan setidaknya satu negara bagian yang berdekatan dengan fasilitas tersebut"
 CAREER_PROFILE_PUNCH_IT_QUOTE: "\"Demi kehidupan bangsa, perlu memulihkan keinginan tentara untuk mati\"
 CAREER_PROFILE_PLAN_L: "Rencana L"
 CAREER_PROFILE_PLAN_L_DESCRIPTION: "Memulai dari negara yang terkurung daratan, menyelesaikan 2 proyek khusus angkatan laut, membangun 10 kapal perusak, 5 kapal penjelajah, 2 kapal perang, dan 1 kapal induk."
 CAREER_PROFILE_PLAN_L_QUOTE: "\"Angkatan Laut membutuhkan waktu tiga tahun untuk membangun sebuah kapal. Dibutuhkan tiga ratus tahun untuk membangun tradisi baru. Evakuasi akan terus berlanjut.\"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "Pemanis Segi Enam"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION: "Riset 16 Teknologi yang dibuka oleh Proyek Khusus"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE: "\"Ketika saya datang kepada Anda dengan perhitungan tersebut, kami pikir kami mungkin akan memulai reaksi berantai yang mungkin menghancurkan seluruh dunia.\"
 CAREER_PROFILE_ISLAND_HOPPER: "Pelompat Pulau"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION: "Kuasai 10 Lokasi Strategis"
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE: "\"Kamu ingin hidup?! Keluar dari pantai\"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW: "Saya Kapten Sekarang"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION: "Sebagai negara kecil, ambil alih kepemimpinan sebuah faksi"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE: "\"Lihat aku, aku kaptennya sekarang.\"
 CAREER_PROFILE_THREE_MUSKETEERS: "Tiga Musketeer"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION: "Bentuk tiga teater faksi yang diawaki oleh petugas Anda"
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE: "\"Semua untuk satu dan satu untuk semua, bersatu kita teguh bercerai kita runtuh.\"
 CAREER_PROFILE_THE_MORE_THE_MERRIER: "Semakin Banyak Semakin Meriah"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION: "Dapatkan bonus berbagi penelitian faksi sebesar 30%"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE: "\"Tidak ada manusia yang merupakan sebuah pulau, keseluruhan pulau itu sendiri, setiap manusia adalah bagian dari benua, bagian dari benua.\"\n\n- John Donne"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "Saya di Sini untuk Menyelamatkan Anda!"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Berhasil menggunakan Serangan untuk menyelamatkan Komandan Anda yang ditangkap"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: "\"Maaf kami terlambat beberapa menit.\"\n\n- Tuan Lovat"
 CAREER_PROFILE_DEJA_VU: "Deja Vu"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Berhasil menggunakan Operasi Mata-Mata untuk menyelamatkan Komandan Anda yang ditangkap"
 CAREER_PROFILE_DEJA_VU_QUOTE: "\"Saya mengajukan pertanyaan [of a rescue] lagi. Kali ini mendorong tindakan.\"\n\n- Mayor Lapham"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "Semakin Banyak Hal Berubah, Semakin Banyak Hal yang Tetap Sama"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Kuasai Sepenuhnya 2 Subdoktrin Pasukan Khusus"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: "\"Kami bisa dibuang. Kami hanya bonus, itu saja.\"\n\n- Mayor Jenderal Colin Gubbins"
 CAREER_PROFILE_FULLY_DECKED_OUT: "Dihiasi Sepenuhnya"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Merancang dan Menyebarkan Divisi yang memiliki 5 Unit Pendukung Divisi dan 5 Unit Pendukung Resimen"
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: "\"Jika ragu, serang\"\n\n- George Patton"
