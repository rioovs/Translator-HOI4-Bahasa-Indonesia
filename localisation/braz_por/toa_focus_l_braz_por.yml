l_braz_por:
 SMB_army_default: "Persenjatai Armada Fuerzas"
 SMB_army_default_desc: "Meskipun mereka tidak bisa dicemooh, angkatan bersenjata kita masih jauh lebih lemah dari yang diharapkan. Mempersenjatai prajurit dengan senjata yang lebih modern serta melatih mereka agar siap bertempur kapan saja, sangatlah penting."
 SMB_military_facilities_default: "Perluas Fasilitas Militer"
 SMB_military_facilities_default_desc: "Untuk mempersenjatai militer dengan baik, kita harus memperbesar industri senjata. Oleh karena itu, membangun fasilitas industri baru yang khusus dirancang untuk produksi peralatan militer adalah suatu keharusan."
 SMB_department_of_propaganda_default: "Departemen Propaganda"
 SMB_department_of_propaganda_default_desc: "Dunia sedang dilanda kebakaran, dan meskipun kita telah berupaya sekuat tenaga, tidak semua warga sipil mendukung gerakan perang. Oleh karena itu, kita harus membentuk sebuah departemen yang berdedikasi untuk meyakinkan rakyat akan manfaat perjuangan bersenjata internasional."
 SMB_logistics_department_default: "Mendirikan Departemen Logistik"
 SMB_logistics_department_default_desc: "Amerika Selatan mungkin adalah rumah kita, namun tetap merupakan benua yang kejam yang harus dilawan oleh pasukan reguler. Untuk mengatasi masalah ini, akan bermanfaat jika dibentuk suatu cabang angkatan bersenjata yang didedikasikan semata-mata untuk pengelolaan dan distribusi logistik yang tepat."
 SMB_support_company_default: "Pentingnya Perusahaan Pendukung"
 SMB_support_company_bra: "Pelatihan Perintis Hutan"
 SMB_jungle_pioneers: "$SMB_support_company_bra$"
 SMB_jungle_pioneers_desc: "$SMB_support_company_default_desc$"
 SMB_jungle_pioneers_tt: "Membuka batalion pendukung §YPionir Hutan:§!\n§YJungle§!:\nGerakan §G+30%§!,\nSerangan §G+10%§!,\nPertahanan §G+20%§!"
 SMB_support_company_default_desc: "Pembentukan departemen logistik kami baru-baru ini telah menghasilkan serangkaian penemuan. Pertama-tama, untuk menjaga aliran persediaan, dan jumlah peralatan serta persediaan yang memadai perlu dibuat, dan material kita saat ini tidak cukup. Kita perlu memodernisasi peralatan pendukung kita jika kita ingin bersaing dengan pesaing kita."
 SMB_department_of_military_intelligence_default: "Departemen Intelijen Militer"
 SMB_department_of_military_intelligence_default_desc: "Meskipun kata-katanya mungkin bertentangan satu sama lain dalam arti, penting untuk dipahami bahwa tanpa pengetahuan yang tepat tentang posisi dan motivasi musuh, akan sulit untuk mengalahkan mereka dalam pertarungan langsung. Oleh karena itu, pembentukan departemen intelijen militer bagi angkatan bersenjata merupakan suatu keharusan."
 SMB_motorized_default: "Berinvestasi di Industri Motor"
 SMB_motorized_default_desc: "Peperangan masa depan melibatkan kendaraan cepat yang bergerak untuk mengepung dan menghancurkan musuh tanpa memberi mereka cukup waktu untuk bereaksi, bukan jalur tembak infanteri abad ke-16 atau ke-17, sebuah strategi yang membuang-buang waktu dan tenaga tanpa memberikan banyak efek."
 SMB_tank_warfare_default_CHL: "Peperangan di Patagonia"
 SMB_tank_warfare_default: "Perang Tank"
 SMB_tank_warfare_default_desc: "Tambahan terbaik untuk pasukan bergerak adalah unit raksasa logam yang kuat, dengan daya tembak untuk mengalahkan hampir semua musuh yang mereka temui. Satu-satunya pertanyaan adalah, apakah produksi tank kita harus difokuskan pada strategi Blitz Jerman, atau haruskah mereka berfungsi sebagai pendukung infanteri?"
 SMB_tank_warfare_tt: "Membuka keputusan untuk §YMengkhususkan§! program persenjataan nasional kita"
 SMB_domestic_production_default: "Fokus pada Produksi Dalam Negeri"
 SMB_domestic_production_default_desc: "Meskipun hal ini jelas lebih sulit dan memakan waktu, akan jauh lebih bermanfaat jika mengembangkan dan memproduksi tank di negara asal kita, untuk menjamin kualitas produk, serta tidak mengambil risiko pengiriman senjata kita dicuri sebelum tiba."
 SMB_mechanized_troops_default: "Mekanisasi Pasukan"
 SMB_mechanized_troops_default_desc: "Untuk menggerakkan angkatan bersenjata kita dan menyambut masa depan peperangan dengan baik, kita akan melakukan upaya ekstensif untuk melakukan mekanisasi pasukan reguler kita, sehingga mereka, bersama dengan resimen tank, dapat mendatangkan malapetaka di medan perang dari balik lapisan baju besi yang aman."
 SMB_army_academy_default: "Memperluas Akademi Angkatan Darat"
 SMB_army_academy_default_desc: "Memiliki senjata yang efektif bukanlah satu-satunya faktor yang menentukan hasil suatu pertempuran. Faktor besar lainnya adalah keterampilan tidak hanya dari masing-masing prajurit, tetapi juga dari komandan umum pasukan. Untuk mencapai tujuan ini, kita harus berinvestasi dalam memperluas operasi departemen militer di akademi militer kita."
 SMB_regular_infantry_default: "Kekuatan Prajurit Biasa"
 SMB_regular_infantry_default_desc: "Meskipun peralatan sama pentingnya dengan hal lainnya, namun setiap prajuritlah yang mempertahankan tanah airnya, melindungi nilai-nilai intinya, dan berjuang demi orang-orang yang dicintainya, yang merupakan kekuatan sebenarnya dari pasukan mana pun. Itulah sebabnya kita harus melakukan yang terbaik untuk meningkatkan moral prajurit biasa, dan memberinya peluang terbaik untuk memenangkan pertempuran terberatnya."
 SMB_artillery_CHL: "Manfaatkan Produksi Nitrat"
 SMB_artillery_default: "Mengkhususkan Industri Senjata Berat"
 SMB_artillery_default_desc: "Perekonomian kita tidak sekuat negara-negara besar seperti Inggris, Prancis, dan Italia. Oleh karena itu, kita perlu mengkhususkan produksi senjata berat jika kita menginginkan peralatan yang lebih kuat dan lebih baik, meskipun kita berharap memiliki uang untuk membayar semua peralatan yang kita inginkan."
 SMB_foreign_designs_default: "Mengakuisisi Desain Asing"
 SMB_foreign_designs_default_desc: "Meskipun kita berharap memiliki ilmuwan dan insinyur yang bisa membuat baju besi kita sendiri, yang terbaik adalah kita menggunakan koneksi yang kita miliki untuk mendapatkan penawaran bagus di pasar internasional, karena ini adalah satu-satunya pilihan yang nyata dan layak untuk memperoleh peralatan khusus pada saat ini."
 SMB_foreign_advisors_default: "Penasihat Asing"
 SMB_foreign_advisors_default_desc: "Meskipun instruktur militer [ROOT.GetAdj] baik, mereka tidak sebaik mereka yang telah berperang dalam berbagai konflik, dan dilatih di akademi militer dengan prestise tertinggi di negara lain. Oleh karena itu, kita harus berupaya untuk menarik penasihat militer asing untuk membantu melatih tentara kita sesuai dengan spesialisasi negaranya, untuk lebih memperkuat angkatan bersenjata kita."
 SMB_army_professionalism_CHL: "Prusianisasi Angkatan Darat"
 SMB_army_professionalism_default: "Lebih Meningkatkan Profesionalisme TNI"
 SMB_army_professionalism_default_desc: "Meskipun mungkin merupakan praktik yang baik untuk menempatkan sebanyak mungkin tentara yang menunggu untuk bergabung dengan angkatan bersenjata, menurut penasihat militer asing kita, jauh lebih penting untuk memastikan bahwa angkatan bersenjata benar-benar bekerja dalam kondisi prima kapan saja."
 SMB_conscription_default: "Tingkatkan Wajib Militer"
 SMB_conscription_default_desc: "Meskipun profesionalisme tentara kita mungkin dipertanyakan, tidak ada keraguan bahwa apa yang sangat dibutuhkan oleh tentara kita saat ini adalah lebih banyak tentara untuk mengisi barisan, karena kita kekurangan orang yang bersedia bergabung dengan angkatan bersenjata kita."
 SMB_conscription_CHL: "Pelajaran dari Perang Besar"
 SMB_experimental_weapons_department_default: "Departemen Senjata Eksperimental"
 SMB_experimental_weapons_department_default_desc: "Jika kita ingin tidak tertinggal dari pesaing kita di bidang teknis, akan lebih baik jika kita mulai berteori dan mencoba mengembangkan senjata ajaib, sehingga kita tidak kalah di medan perang."
 SMB_nuclear_program_default: "Program Nuklir Domestik"
 SMB_nuclear_program_default_desc: "Amerika dan Jerman sedang bekerja keras mengungkap rahasia atom, dan kita tidak bisa membiarkan diri kita tertinggal di belakang mereka. Meskipun mereka memikirkan peperangan, para ilmuwan kita juga menjelaskan cara memanfaatkan pembelahan atom untuk meningkatkan kehidupan sipil."
 SMB_nuclear_program_key_BRA: "Program Paralelo"
 SMB_special_forces_default: "Program Pasukan Khusus"
 SMB_special_forces_default_desc: "Pasukan kita, meskipun kecil, dapat diperkuat secara besar-besaran dengan menggunakan tentara yang terlatih khusus, yang unggul dalam situasi dan tipe pertempuran tertentu. Oleh karena itu, menetapkan program untuk pelatihan dan menampung prajurit-prajurit tersebut harus dianggap sebagai prioritas nomor satu kita."
 SMB_special_forces_option_1_default: "Perkuat Resimen Gunung"
 SMB_special_forces_option_1_default_desc: "Para Pendaki Gunung di tentara harus mendapat perhatian khusus dari komando atas kita, karena mereka melakukan prestasi yang hanya bisa dilakukan oleh pasukan reguler kita. Mereka memungkinkan untuk melakukan pertempuran di Andes yang berbahaya, dan dapat mendukung pasukan tetap kami saat terus maju."
 SMB_special_forces_option_2_default: "Angkatan Laut yang Kuat"
 SMB_special_forces_option_2_default_desc: "Karena angkatan laut adalah salah satu kekuatan kita saat ini, akan sangat bermanfaat jika kita memanfaatkan fakta ini dan memungkinkan mereka memiliki cabang militer sendiri, yang terdiri dari marinir yang sangat terlatih dan sangat efektif."
 SMB_special_forces_option_2_CHL_desc: "[ROOT.GetNameDefCap] memiliki tradisi infanteri angkatan laut yang panjang, tetapi sejak akhir Perang Pasifik, mereka telah dikurangi menjadi unit artileri pantai. Dengan mengubahnya menjadi korps marinir yang dilengkapi perang ekspedisi, [ROOT.GetNameDef] akan kembali dapat memproyeksikan kekuatan di luar negeri seperti yang berhasil dilakukannya pada abad ke-19."
 SMB_special_forces_option_3_default: "Memperluas Cabang Angkatan Darat Angkatan Udara"
 SMB_special_forces_option_3_default_desc: "Karena angkatan udara adalah salah satu kekuatan kita saat ini, akan lebih bermanfaat jika kita memanfaatkan fakta ini dan memungkinkan mereka memiliki cabang militer sendiri, yang terdiri dari pasukan terjun payung yang terlatih secara khusus dan sangat efektif."
 SMB_special_forces_option_1_continuation_default: "Program Pelatihan Penjaga Hutan"
 SMB_special_forces_option_1_continuation_default_desc: "Untuk mendukung para pendaki gunung, kita harus mempekerjakan Rangers, tentara yang dilatih khusus untuk menyerang dan mengintai tidak hanya di sekitar pegunungan, tetapi juga di hutan dan hutan di Amerika Selatan."
 SMB_special_forces_option_2_continuation_default: "Mendukung Marinir"
 SMB_special_forces_option_2_continuation_default_desc: "Agar Marinir kita dapat berfungsi dengan kapasitas dan efektivitas penuh, kita harus mempertimbangkan pengembangan teknologi yang mendukung mereka, seperti kendaraan pendaratan dan teknik distribusi pasokan yang lebih baik ketika mendarat di pantai."
 SMB_special_forces_option_3_continuation_default: "Mendukung Pendaratan Udara"
 SMB_special_forces_option_3_continuation_default_desc: "Agar Pasukan Terjun Payung kita memiliki peluang keberhasilan setinggi mungkin saat melakukan lompatan, kita harus mempertimbangkan pengembangan teknologi yang membantu meningkatkan kemampuan bertahan mereka, baik itu baju besi yang dapat dijatuhkan atau peti persediaan yang disamarkan."
 SMB_air_defense_default: "Pertahanan Udara"
 SMB_air_defense_default_desc: "Kini setelah pesaing kita menunjukkan sifat aslinya dan mulai mengembangkan senjata udara mereka sendiri, kita harus mempersiapkan tanggapan kita. Oleh karena itu, kita harus mulai dengan memerintahkan pembangunan dan penempatan senjata dan senjata anti udara secara cepat."
 SMB_air_force_default: "Persenjatai Fuerzas Aéreas"
 SMB_air_force_default_desc: "Banyak ahli teori berpendapat bahwa bidang yang paling tertinggal saat ini adalah pengembangan angkatan udara modern. Oleh karena itu, kita harus bekerja keras untuk mengatasinya, dengan membangun hanggar dan fasilitas baru, serta melatih pilot tambahan."
 SMB_air_academy_default: "Mendirikan Akademi Udara yang Tepat"
 SMB_air_academy_default_desc: "Bukan hanya prajurit yang akan bertempur di angkatan darat saja yang perlu diajari dengan baik. Pilot kami, meskipun antusias, tidak memiliki pelatihan profesional yang mereka butuhkan untuk unggul dalam pertempuran udara. Untuk mengatasi hal ini, kita harus memperluas akademi militer dengan memasukkan lebih banyak kelas yang melayani angkatan udara."
 SMB_construct_air_bases_default: "Membangun Pangkalan Udara Baru"
 SMB_construct_air_bases_default_desc: "Selain memerlukan pilot-pilot yang profesional, terdidik, dan bermotivasi tinggi, kita juga kekurangan fungsi penting lainnya yang dibutuhkan oleh angkatan udara yang besar, yaitu lapangan udara. Meskipun kita mempunyai beberapa, jumlah tersebut tidak cukup jika kita ingin memperluas angkatan udara ke tingkat yang dapat kompetitif."
 SMB_domestic_designs_default: "Desain Domestik"
 SMB_domestic_designs_default_desc: "Yang terbaik adalah membuat dan memproduksi model dan desain pesawat kita sendiri, karena negara lain tidak dapat dianggap dapat dipercaya dalam merancang atau memproduksi pesawat yang sesuai untuk pilot kita."
 SMB_license_designs_default: "Lisensi Desain Asing"
 SMB_license_designs_default_desc: "Dibutuhkan terlalu banyak waktu dan usaha untuk meneliti dan mengembangkan desain pesawat terbang kita sendiri. Itu sebabnya kita sebaiknya melisensikan peralatan asing, dan fokus memproduksinya di sini di [ROOT.GetNameDef]."
 SMB_purchase_aircraft_default: "Beli Pesawat Asing"
 SMB_purchase_aircraft_default_desc: "Angkatan udara kita telah memutuskan bahwa akan terlalu mahal dan memakan waktu untuk tidak hanya mengembangkan, tetapi juga memproduksi pesawat kita sendiri. Mereka malah menganjurkan pembelian peralatan asing, dan sikap yang harus kita ambil juga."
 SMB_establish_aircraft_industry_default: "Industri Pesawat Terbang Dalam Negeri"
 SMB_establish_aircraft_industry_BRA: "Empresa Brasileira de Aeronautica"
 SMB_establish_aircraft_industry_default_desc: "Jelas bahwa jika kita ingin mempertahankan efisiensi produksi setinggi mungkin, kita harus membangun industri pesawat terbang berskala besar di dalam negeri kita sendiri."
 SMB_flying_fortress_default: "Benteng Terbang"
 SMB_flying_fortress_default_desc: "Satu-satunya cara untuk memanfaatkan angkatan udara dengan baik adalah dengan menggunakannya untuk mengebom musuh agar menyerah, hingga tidak ada lagi yang tersisa di depan cakrawala. Oleh karena itu kita harus membangun pesawat terbang besar, dengan kemampuan membawa bahan peledak sebanyak yang kita perlukan."
 SMB_tactical_air_force_default: "Angkatan Udara Taktis"
 SMB_tactical_air_force_default_desc: "Angkatan udara harus digunakan tidak hanya untuk mendukung angkatan darat, namun juga untuk melakukan banyak tugas yang lebih kompleks, tugas-tugas yang tidak dapat dilakukan oleh angkatan darat saja. Itulah inti sebenarnya yang menjadikan angkatan udara hebat."
 SMB_nimble_air_force_default: "Angkatan Udara yang Cekatan"
 SMB_nimble_air_force_default_desc: "Pesawat harus mampu mengungguli tidak hanya pesawat musuh, namun juga pengawasan senjata anti udara dan kapal angkatan lautnya. Angkatan udara harus terdiri dari pesawat-pesawat yang lebih kecil, yang dilengkapi untuk melakukan dog-fighting dan serangan dengan cara yang cukup efisien, dan tidak menjadi terlalu berat untuk bermanuver dengan cepat dan tegas."
 SMB_strategic_bombing_default: "Fokus pada Pengeboman Strategis"
 SMB_strategic_bombing_default_desc: "Anda memenangkan perang dengan mengalahkan musuh tidak hanya dalam pertempuran, tetapi juga dengan melumpuhkan kemampuan ekonomi dan industri mereka. Itulah sebabnya pengeboman strategis harus dianggap sebagai tujuan nomor satu kita selama perang."
 SMB_army_support_default: "Dukungan Angkatan Darat"
 SMB_army_support_default_desc: "Tentara tidak bisa menang jika diserang secara aktif dari langit. Oleh karena itu, meskipun kita tidak hanya menggunakan angkatan udara kita untuk melindungi mereka dari tindakan semacam itu, pesawat-pesawat tersebut juga harus diarahkan untuk melakukan hal yang sama terhadap lawan-lawan kita."
 SMB_winning_the_air_war_default: "Memenangkan Perang Udara"
 SMB_winning_the_air_war_default_desc: "Meskipun dukungan darat dan pemboman laut dapat dianggap penting, sangat penting untuk menyadari bahwa tanpa kendali atas langit, semua tindakan ini tidak ada artinya. Oleh karena itu, angkatan udara kita harus diarahkan untuk mengendalikan langit semaksimal mungkin."
 SMB_naval_support_default: "Fokus pada Dukungan Angkatan Laut"
 SMB_naval_support_default_desc: "Tujuan nomor satu pesawat kami adalah membantu kami membuka jalan dan melindungi angkatan laut dan konvoi sipil kami. Oleh karena itu, penting untuk merancang pesawat dengan mempertimbangkan peran dukungan dan patroli angkatan laut, dan memastikan bahwa pesawat tersebut dapat menghindari tembakan jatuh oleh meriam anti-udara yang ada di dalamnya."
 SMB_air_modifier_boost_1_default: "Spesialisasi Dukungan Darat"
 SMB_air_modifier_boost_1_default_desc: "Sangat penting untuk memastikan bahwa infanteri selalu dapat mencapai tujuan mereka, dan oleh karena itu penting juga untuk memfokuskan angkatan udara untuk membantu mereka mencapai tujuan, baik melalui dukungan udara langsung, atau dengan melakukan pengeboman di belakang garis musuh."
 SMB_air_modifier_boost_2_default: "Mengembangkan Badan Pesawat Canggih"
 SMB_air_modifier_boost_2_default_desc: "Jika kita ingin pesawat kita selamat dari kontak dengan musuh, yang penting adalah pesawat tersebut tidak hanya mampu menghindari serangan sebanyak mungkin, namun juga dapat bertahan dari satu atau dua serangan, dan mencapai sejauh yang mereka perlukan untuk kembali untuk diperbaiki. Itu sebabnya kita harus mengembangkan rangka dan mesin yang lebih baik untuk pesawat kita, sehingga pilot bisa selamat, apa pun yang terjadi."
 SMB_air_doctrine_default: "Kemajuan Doktrinal"
 SMB_air_doctrine_default_desc: "Penting untuk dicatat bahwa tanpa strategi yang tepat, bahkan pilot dan pesawat terhebat pun tidak akan mampu bertahan dalam pertempuran. Perang adalah tentang perencanaan, strategi, dan penggunaan kekuatan individu suatu negara secara maksimal. Oleh karena itu, kita harus mendedikasikan upaya besar untuk mengembangkan doktrin baru yang dapat diikuti oleh angkatan udara kita."
 SMB_aircraft_carriers_default: "Kapal Induk"
 SMB_joint_operative_command_default: "Komando Operasi Gabungan"
 SMB_joint_operative_command_default_desc: "Kini setelah kita tidak hanya mengembangkan angkatan bersenjata kita, tetapi juga membangun landasan yang kuat bagi angkatan udara kita, sekaranglah waktunya untuk menciptakan koordinasi dan kerja sama antara berbagai cabang angkatan bersenjata ini. Oleh karena itu, kami akan membentuk komando operasi gabungan, yang terdiri dari komandan yang dipilih dari kedua bidang."
 SMB_war_planning_office_default: "Kantor Perencanaan Perang"
 SMB_war_planning_office_default_desc: "Sekarang kita juga perlu memastikan bahwa tentara kita dapat menerima rencana dan perintah yang tepat dan dipikirkan dengan matang, agar tidak ketinggalan dalam perang informasi dan mendapatkan rincian yang ketinggalan jaman yang menyebabkan mereka disergap dan dihancurkan. Oleh karena itu, kita harus mendirikan kantor perencanaan perang, untuk mengoordinasikan upaya ini dengan lebih baik."
 SMB_women_in_aviation_default: "Wanita dalam Penerbangan"
 SMB_women_in_aviation_default_desc: "Meski tidak selalu diperlakukan seperti itu, perempuan selalu memainkan peran penting dalam masyarakat, dan kini saatnya bagi mereka untuk mengambil tindakan dan melakukan apa yang sebelumnya dianggap hanya tugas laki-laki, seperti produksi dan juga uji coba pesawat terbang di negara kita."
 SMB_navy_default: "Angkatan Laut"
 SMB_naval_academy_default: "Perkuat Akademi Angkatan Laut"
 SMB_construct_naval_bases_default: "Bangun Pangkalan Angkatan Laut Baru"
 SMB_naval_foreign_advisors_default: "Undang Penasihat Angkatan Laut"
