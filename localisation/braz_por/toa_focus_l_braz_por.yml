 CHL_expand_mining_prospection_tt: "Menambahkan produksi §Y4£resources_strip|5 §Y$state_resource_steel$§!, £resources_strip|6 §Y$state_resource_chromium$§!, £resources_strip|4 §Y$state_resource_tungsten$§! atau £resources_strip|2 §Y$state_resource_aluminium$§!§!di setiap negara bagian inti telah menyediakan salah satu sumber daya mineral tersebut.\nEfek saat ini:"
 CHL_skip_one_line_tt: "\n"
 chilean_trade_deals_opinion_modifier: "Kesepakatan Dagang yang Menguntungkan"
 CHL_high_quality_nitrate: "Nitrat Berkualitas Tinggi"
 CHL_high_quality_nitrate_desc: "Meskipun industri kami saat ini mungkin bukan yang terkuat, ada hal lain yang membuat kami menonjol dibandingkan yang lain. Hal tersebut adalah kelimpahan nitrat kita, dan sebagian besar produksi dunia berada di dalam wilayah kita. Dengan demikian, kami dapat memastikan bahwa kami sendiri yang mendapatkan akses terhadap bahan dengan kualitas terbaik, sementara kami menjual nitrat yang kurang dimurnikan."
 CHL_contract_efe: "Kontrak EFE"
 CHL_contract_efe_desc: "Empresa de los Ferrocarriles del Estado saat ini menjalankan sistem perkeretaapian kita, dan dengan memastikan bahwa kita memiliki kendali lebih langsung terhadap sistem tersebut, kita dapat memastikan bahwa sumber daya dan prioritasnya disesuaikan dengan kebutuhan kita."
 CHL_public_works: "Proyek Pekerjaan Umum"
 CHL_public_works_desc: "Sejak kehancuran besar yang terjadi ketika Amerika menutup perbatasannya dan menghentikan ekspornya, perekonomian kita telah hancur dan rakyat kita tercerai-berai. Untuk pulih dari bencana ini seefisien mungkin, kita harus mendorong program pekerjaan umum berskala besar, mirip dengan New Deal Amerika, agar masyarakat kita dapat kembali mendapatkan pekerjaan, dan perekonomian dapat berjalan kembali."
 CHL_dissolve_covensa: "Larutkan COVENSA"
 CHL_dissolve_covensa_desc: "Pembentukan perusahaan distribusi sumber daya internal COVENSA adalah sebuah kesalahan, dan kita semua mengetahuinya. Satu-satunya cara yang benar untuk memecahkan masalah ekonomi kita adalah dengan memulai kembali ekspor skala besar kita, dan untuk melakukan hal itu, kita harus melikuidasi organisasi tersebut dan mereformasi organisasi tersebut agar lebih menyerupai COSACH pendahulunya."
 CHL_issue_bonds: "Mendorong Pembelian Obligasi"
 CHL_issue_bonds_desc: "Kenangan akan keruntuhan ekonomi baru-baru ini telah membuat masyarakat kita sangat takut untuk menginvestasikan uang mereka, sehingga menghambat pertumbuhan ekonomi. Dengan mendorong masyarakat kita untuk membeli obligasi yang diterbitkan pemerintah dengan janji menginvestasikan kembali uang tersebut ke dalam negeri, kita dapat membangun [CHL.GetName] yang lebih kuat dengan lebih cepat."
 CHL_expand_the_forestry: "Memperluas Kehutanan"
 CHL_expand_the_forestry_desc: "Wilayah tengah negara kita, khususnya Araucanía, kaya akan kayu. Meskipun ada pihak-pihak yang menentang perluasan industri ini di wilayah tersebut, hal ini merupakan suatu keharusan jika kita ingin negara kita mengalami keamanan ekonomi, dan mendapatkan kayu serta membuka lahan adalah cara tercepat untuk mencapainya."
 CHL_expand_the_forestry_decision_tt: "Membuka keputusan untuk §YMemperluas Kehutanan§! di §Y[950.GetName]§! dan §Y[279.GetName]§!."
 CHL_government_mandated_contracts: "Kontrak Bersubsidi Pemerintah"
 CHL_government_mandated_contracts_desc: "Agar lebih banyak orang dapat bekerja dan melakukan bagian mereka, kita harus mempertimbangkan untuk mensubsidi kontrak industri dan membayar sendiri sebagian gajinya. Dengan cara ini, lebih banyak perusahaan dapat merasa nyaman dalam mempekerjakan lebih banyak orang, dan lebih banyak orang dapat memperoleh uang untuk dibelanjakan dan dimasukkan kembali ke dalam perekonomian."
 CHL_we_must_dig_deeper: "Kita Harus Menggali Lebih Dalam"
 CHL_we_must_dig_deeper_desc: "Tidak ada yang namanya menggali terlalu dalam, bahkan jika kita membuat terowongan di bawah kota kita sendiri, sehingga sedikit merusak fondasinya. Jika kita ingin memulihkan perekonomian kita dengan menggunakan ekspor, kita harus mengambil risiko dan melakukannya dengan cepat, untuk mendapatkan sebanyak mungkin keuntungan dari pertambangan kita."
 CHL_establish_trade_relationships: "Membangun Hubungan Dagang yang Menguntungkan"
 CHL_establish_trade_relationships_desc: "Terdapat beragam persyaratan agar perdagangan dapat berhasil, dan memiliki sumber daya yang dibutuhkan bukanlah satu-satunya persyaratan. Kita juga membutuhkan mitra dagang yang dapat dipercaya, serta kontrak yang tidak menjual tenaga kerja dan sumber daya alam kita terlalu murah. Oleh karena itu, kita harus mendekati saudara-saudari kita di benua Amerika, untuk memastikan bahwa kita mengenal siapa saja yang berdagang dengan kita."
 CHL_international_loans: "Pinjaman Internasional"
 CHL_international_loans_desc: "Mantan presiden kita, Carlos Ibáñez del Campo, berusaha menyelesaikan krisis ekonomi dengan menggunakan pinjaman dari negara asing dan menginvestasikan uangnya ke negara, dengan harapan dapat menghasilkan nilai yang cukup untuk membayar mereka kembali di kemudian hari, dan strategi ini berhasil. Kita harus mencoba mengikuti langkahnya, dan melakukan hal yang sama sekali lagi."
 CHL_CHL_international_loans_tt: "Membuka keputusan untuk §YMengambil Pinjaman§! dari kekuatan asing untuk meningkatkan perekonomian"
 CHL_connect_the_northern_railways: "Hubungkan Kereta Api Utara"
 CHL_connect_the_northern_railways_desc: "Rel kereta api dan jalan raya di wilayah utara, khususnya di Arica, tidak terhubung dengan baik dengan sistem infrastruktur lainnya, dan oleh karena itu upaya harus dilakukan untuk meningkatkan infrastruktur umum di wilayah paling utara."
 CHL_expand_southern_infrastructure: "Perluas Infrastruktur Selatan"
 CHL_expand_southern_infrastructure_desc: "Saat ini hanya ada sedikit atau bahkan tidak ada infrastruktur sama sekali di ujung selatan Chile, dan tidak ada jalur kereta api sama sekali. Oleh karena itu, kita harus berupaya keras untuk menghubungkan kota pelabuhan selatan Punta Arenas dan Punta Delgada dengan jalur kereta api kita."
 CHL_devalue_the_peso: "[CHL_devalue_the_peso_key]"
 CHL_devalue_the_peso_desc: "[CHL_devalue_the_peso_key_desc_key]"
 CHL_devalue_the_peso_peso: "Devaluasi Peso"
 CHL_devalue_the_peso_peso_desc: "Meskipun negara-negara lain membiarkan mata uang mereka menjadi kurang berharga untuk membantu perekonomian mereka, kita belum melakukannya. Akibatnya, kita tertinggal jauh. Jika kita ingin mengejar ketertinggalan kita, kita tidak boleh menunda-nunda untuk mendevaluasi mata uang kita, bahkan jika hal tersebut terbukti merupakan tindakan yang tidak populer."
 CHL_devalue_the_peso_franc: "Devaluasi Franc"
 CHL_devalue_the_peso_franc_desc: "Meskipun negara-negara lain membiarkan mata uang mereka menjadi kurang berharga untuk membantu perekonomian mereka, kita belum melakukannya. Akibatnya, kita tertinggal jauh. Jika kita ingin mengejar ketertinggalan kita, kita tidak boleh menunda-nunda untuk mendevaluasi mata uang kita, meskipun hal tersebut terbukti merupakan tindakan yang tidak populer."
 CHL_utlilize_famae: "Gunakan FAMAE"
 CHL_utlilize_famae_desc: "Industri senjata kita saat ini bergantung pada pembelian internasional dan senapan yang diproduksi secara lokal. Jika kita ingin meningkatkan produksi militer, kita harus memastikan bahwa kita memiliki produsen senjata yang dikendalikan negara, seperti Fábricas y Maestranzas del Ejército yang berusia berabad-abad, yang harus dimodernisasi dengan cepat."
 CHL_they_shall_not_pass: "Mereka Tidak Akan Lulus"
 CHL_they_shall_not_pass_desc: "Negara kita terancam tidak hanya oleh musuh lama kita dalam Perang Pasifik, namun juga oleh tetangga kita, Argentina, yang memiliki perbatasan yang sangat luas dengan kita. Jika kita ingin mempunyai peluang kecil untuk bertahan melawan mereka, kita harus menahan mereka di pegunungan. Mereka tidak akan lewat, dan kita tidak akan pernah menyerah!"
 CHL_domestic_production_of_the_willys_mb: "Produksi Dalam Negeri Willys MB"
 CHL_domestic_production_of_the_willys_mb_desc: "Kita mampu memproduksi banyak senjata ringan dan amunisi di negara asal kita sendiri, namun kita kekurangan keahlian untuk memproduksi kendaraan bermotor dan lapis baja yang memadai. Untuk mengatasi masalah ini, kita harus membeli mobil dari siapa pun yang ingin menjualnya, dan meniru desainnya."
 CHL_strengthen_the_central_bank: "Memperkuat Bank Sentral"
 CHL_strengthen_the_central_bank_desc: "Agar perekonomian kita tidak hanya sekedar membaik, kita harus berupaya memperkuat Banco Central de Chile, yang didirikan oleh presiden Arturo Alessandri. Kami akan memberi mereka lebih banyak kebebasan untuk melakukan apa pun yang mereka anggap perlu, dalam upaya mereka membantu kami dalam jangka panjang."
 CHL_expand_the_naval_arsenal: "Perluas Persenjataan Angkatan Laut"
 CHL_expand_the_naval_arsenal_desc: "Arsenales de Marina adalah produsen kapal kami yang dapat dipercaya, dan mereka juga membantu kami menjaga armada dalam kondisi sebaik yang kami lakukan selama beberapa tahun terakhir, yang jauh melebihi kualitas pemeliharaan yang dikelola negara Amerika Selatan lainnya. Kita sekarang harus meningkatkan pendanaan mereka, untuk mempersiapkan perang."
 CHL_fortify_the_coastlines: "Perkuat Garis Pantai"
 CHL_fortify_the_coastlines_desc: "Garis pantai kita panjang, dan sebanding dengan luas negara kita, mungkin merupakan garis pantai terpanjang di dunia. Dengan demikian, jika kita kalah dalam perang laut, seluruh negara kita akan terekspos, dan kita akan rentan dan terbuka terhadap serangan dari laut. Oleh karena itu, kita harus membangun kompleks besar yang mampu menangkis pendaratan angkatan laut!"
 CHL_invest_in_shipping: "Berinvestasi dalam Pengiriman"
 CHL_invest_in_shipping_desc: "Militer bukanlah satu-satunya manfaat laut. Karena kita adalah negara yang sebagian besar bergantung pada perdagangan, dan juga merupakan negara yang memiliki wilayah lepas pantai, seperti Rapa Nui, kita harus memperluas perdagangan kelautan, dan menginvestasikan dana ke dalam perluasan industri pelayaran."
 CHL_advancements_in_telecommunications: "Kemajuan Telekomunikasi"
 CHL_advancements_in_telecommunications_desc: "Para ilmuwan kami yang bekerja di bidang penelitian dan pengembangan telah mulai mengembangkan teknik-teknik yang lebih baik untuk tidak hanya memanfaatkan radio, namun juga memajukan kemungkinan penggunaan televisi, dan melalui hal ini, kita dapat menyebarkan pengetahuan umum kepada masyarakat dengan lebih mudah, serta mengkomunikasikan temuan-temuan dengan lebih baik antar departemen-departemen laboratorium sains yang letaknya jauh di negara tersebut."
 CHL_protect_the_easter_island_tt: "Kami akan mendapatkan §YTumbangkan Tujuan Perang Pemerintah§! melawan §Y[JAP.GetName]§!, §Y[NZL.GetName]§! atau §Y[AST.GetName]§! jika mereka §YIndependen§! dan §YFasis§! atau §YNon-Blok§!, dan sedang berperang dengan §YDemokrasi Amerika§!"
 CHL_upgrade_central_bank_tt: "Meningkatkan §YBanco Central de Chile§! sebesar:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-10%§!"
 right_wing_tt: "Seorang §YSayap Kanan§! Presiden mengambil alih kekuasaan"
 left_wing_tt: "Seorang §YSayap Kiri§! Presiden mengambil alih kekuasaan"
 propping_up_gustavo_ross_tt: "Ketika §YGustavo Ross§! menjadi Presiden Chile, memperoleh §G+75§! Kekuatan Politik, §G+5%§! Stabilitas dan memberinya sifat §YPopuler di Kalangan Rakyat§! yang memberikan: §G+2%§! Faktor Kecepatan Pertumbuhan Kepatuhan, §G+25%§! Pertahanan Melayang Ideologi dan §G+10%§! Stabilitas."
 CHL_has_idea_near_anarchy: "Belum menghilangkan sepenuhnya semangat kebangsaan §Y$idea_CHL_near_anarchic_society$§!"
 CHL_not_has_idea_near_anarchy: "Telah menghilangkan sepenuhnya semangat kebangsaan §Y$idea_CHL_near_anarchic_society$§!"
 CHL_found_national_steelworks_tt: "Membuka keputusan §Y$CHL_expand_araucanian_steelworks_decision$§! untuk mendapatkan lebih banyak §YSteel§! di §Y[950.GetName]§!"
 denounced_catholicism: "Mencela Katolik"
 embraced_catholicism: "Menganut agama Katolik"
 CHL_dispute_over_tierra_del_fuego_tt: "Hal ini dapat menyebabkan §RPerang§! dengan pemilik Tierra del Fuego"
 CHL_reapproach_america_tt: "Membuka keputusan untuk §YMembeli Senjata§! dari §YAmerika Serikat§!"
 CHL_mapuche_reconcilliation_campaigns_tt: "Membuka keputusan untuk §GMeringankan§! dan §GMemecahkan§! §YKonflik Mapuche§!"
 CHL_use_the_fascist_movement_tt: "Pemberontakan Nacista akan menyebabkan §RPerang Saudara!§! skala kecil"
 CHL_suppress_the_nacistas_tt: "Pemberontakan Nacista akan §GMelemah§!"
 CHL_endorse_the_constitution: "Mengesahkan UUD 1925"
 CHL_endorse_the_constitution_desc: "Pada tahun 1920-an kita mengalami krisis sosial dan ekonomi yang parah yang menyebabkan hilangnya prestise kelas penguasa lama, dan bangkitnya pemerintahan yang dipimpin oleh Arturo Alessandri. Pada tahun 1924 ia digulingkan dalam suatu kudeta, namun dipanggil kembali pada tahun 1925, setelah itu ia menggunakan masa kepresidenannya untuk menyusun konstitusi baru untuk menggantikan Konstitusi tahun 1833. Kita harus berusaha keras untuk mengikuti kata-kata panduannya, sebagai bapak pendiri Chili yang baru."
 CHL_cooperation_with_the_falange: "Kerjasama dengan Falang Nasional"
 CHL_cooperation_with_the_falange_desc: "Falange Nasional adalah Partai Demokrat Kristen yang didirikan pada tahun 1935, dan sebagian besar terdiri dari umat Katolik progresif dan reformis. Karena banyak kebijakan mereka yang sangat mirip dengan kebijakan kita, seharusnya tidak sulit untuk mengundang mereka ke dalam pemerintahan kita."
 CHL_denounce_the_anarchy: "Mengecam Negara yang Hampir Anarki"
 CHL_denounce_the_anarchy_desc: "Fakta bahwa anarki yang dimulai setelah Keruntuhan Wall Street belum terselesaikan merupakan indikator besar kelemahan besar yang melekat pada pemerintahan saat ini dan cita-cita liberal pasifnya. Kita harus secara terbuka menentang mereka, dan meyakinkan masyarakat bahwa masa depan adalah milik mereka jika mereka mendukung kita."
 CHL_look_to_tradition: "Perhatikan Tradisi"
 CHL_look_to_tradition_desc: "Arturo Alessandri sempat menjadi sorotan, dan belum menyelesaikan satu pun masalah besar yang masih menghantui negara ini. Oleh karena itu, kita harus mengambil langkah mundur dari liberalisme, dan melihat kembali nilai-nilai kuno yang dulu kita andalkan."
 CHL_impose_new_taxes: "Kenakan Pajak Baru"
 CHL_impose_new_taxes_desc: "Perbendaharaan negara kita semakin menipis setelah banyaknya upaya yang dilakukan untuk mengembalikan negara ini ke keadaan semula, dan untuk membantu meringankan hal ini, rencana yang baik adalah dengan mengenakan pajak penghasilan baru pada penduduk kita. Mereka mungkin tidak menyukainya pada awalnya, tapi beri waktu, dan mereka akan tenang, karena kita punya lebih banyak uang untuk dibelanjakan."
 CHL_1938_chilean_presidential_election: "Pemilihan Presiden Chile de 1938"
 CHL_1938_chilean_presidential_election_desc: "Pemilihan Presiden tahun 1938 sudah dekat, dan negara harus memilih pemimpinnya dari empat kandidat utama. Di sebelah kiri, kita punya Pedro Aguirre Cerda dan front kerakyatan, di sebelah kanan kita punya Carlos Ibáñez del Campo dan aliansi kebebasan rakyat, di tengah kita punya Gustavo Ross dan kaum liberal, dan di sebelah kiri lebih jauh lagi kita punya Elías Lafertte Gaviño dan kaum komunis. Siapa yang akan menang?"
 CHL_1938_chilean_presidential_election_tt: "Ketika §YPemilihan Presiden§! terjadi pada akhir §YOktober 1938§! maka fokus ini akan otomatis selesai"
 CHL_construct_new_hydroelectric_stations: "Membangun Stasiun Pembangkit Listrik Tenaga Air Baru"
 CHL_construct_new_hydroelectric_stations_desc: "Meskipun ini mungkin merupakan tindakan yang tidak populer di kalangan penduduk asli Mapuche, wilayah Araucanía kaya akan berbagai sumber daya alam, salah satunya adalah danau dan air terjun. Kita dapat memanfaatkannya untuk membangun pembangkit listrik tenaga air, meskipun hal ini mungkin akan mengganggu penduduk di wilayah tersebut."
 CHL_policies_of_arturo_alessandri: "Kebijakan Arturo Alessandri"
 CHL_policies_of_arturo_alessandri_desc: "Alessandri punya banyak kebijakan, dan masa jabatan terakhirnya belum berakhir. Dia telah banyak membantu negara ini, dan masih mempunyai kekuatan untuk membantu lebih banyak lagi. Dia benar-benar bapak inkarnasi terbaru Chile."
 CHL_suppress_the_nacistas: "Menekan Nacista"
 CHL_suppress_the_nacistas_desc: "Movimiento Nacional-Socialista sedang bergerak akhir-akhir ini, dan cukup jelas bahwa mereka akan mencoba sesuatu dalam waktu dekat. Kita harus tetap waspada, dan menindak setiap perbedaan pendapat di mana pun hal itu muncul."
 CHL_use_the_fascist_movement: "Gunakan Gerakan Fasis"
 CHL_use_the_fascist_movement_desc: "Meskipun cukup jelas bahwa kaum fasis sedang merencanakan sesuatu, perlu dipertimbangkan bahwa mereka mempunyai banyak anggota penting yang mungkin berguna bagi pemerintah kita. Oleh karena itu, kita harus mendekati beberapa dari mereka secara rahasia, dan berharap dapat memanfaatkan kekuatan mereka, setidaknya sampai mereka memutuskan untuk mencoba sesuatu."
 CHL_reestablish_the_republican_guard: "Membangun kembali Garda Republik"
 CHL_reestablish_the_republican_guard_desc: "Sekarang kita sekali lagi diserang, Garda Republik harus dibentuk kembali untuk melawan ancaman tingkat tinggi yang memutuskan untuk memburu kita. Untuk mempersenjatai manusia, berjuanglah untuk republikmu!"
 CHL_volunteers_to_the_republicans: "Relawan untuk Partai Republik"
 CHL_volunteers_to_the_republicans_desc: "Saudara-saudara kita di Spanyol saat ini sedang berjuang melawan militer yang ingin menggulingkan republik demokratis mereka. Meskipun intervensi di Chile belum tentu populer, hal ini dapat menunjukkan kekuatan dan kesiapan kita untuk membela demokrasi."
 CHL_volunteers_to_the_republicans_tt: "@SPR Republik Spanyol Ada"
 CHL_volunteers_to_the_republicans_tt_2: "@SPR Republik Spanyol belum menyelesaikan §Y$SPR_regional_defense_council_of_aragon$§!"
 CHL_prop_up_gustavo_ross: "Dukung Gustavo Ross"
 CHL_prop_up_gustavo_ross_desc: "Gustavo Ross adalah murid utama Arturo Alessandri, dan favoritnya untuk memenangkan pemilihan presiden mendatang. Oleh karena itu, Alessandri harus memastikan hal ini diketahui publik, dan berupaya mengangkat Ross sebagai penerus spiritualnya dengan menggunakan propaganda dalam jumlah besar."
 CHL_inflation_control_by_the_central_bank: "Pengendalian Inflasi oleh Banco Central de Chile"
 #CHL_inflation_control_by_the_central_bank_desc: "The Banco Central de Chile was founded by president Arturo Alessandri in 1925. We should task them with making sure that inflation stays on a level that is currently desired, so that the budget can be distributed as desired, and the populace be kept as happy as possible."
 CHL_inflation_control_by_the_central_bank_desc: "Banco Central de Chile didirikan oleh presiden Arturo Alessandri pada tahun 1925. Kita harus menugaskan mereka untuk mengendalikan inflasi guna mendukung pembangunan ekonomi jangka panjang Chile dan mencegah kenaikan harga yang menyebabkan kerusakan ekonomi dan politik."
 CHL_construct_the_estadio_nacional: "Membangun Estadio Nacional"
 CHL_construct_the_estadio_nacional_desc: "Upaya terbesar Alessandri untuk memulihkan perekonomian dan kepercayaan masyarakat adalah melalui pekerjaan umum, dan karya besarnya adalah Estadio Nacional, sebuah stadion nasional megah untuk pertandingan olahraga, yang merupakan pertunjukan luar biasa atas kemampuannya memimpin bangsa."
 CHL_establish_corfo: "Membangun CORFO"
 CHL_establish_corfo_desc: "Kita harus berupaya membentuk sebuah organisasi yang bertanggung jawab atas pengembangan industri, distribusi sumber daya, dan upaya rekonstruksi. Itu bisa disebut Corporación de Fomento de la Producción de Chile."
 CHL_work_towards_laissex_faire: "Bekerja Menuju Laissez-Faire"
 CHL_work_towards_laissex_faire_desc: "Tujuan akhir dari pemerintahan liberal adalah untuk mencapai ekonomi Laissez-Faire, dan oleh karena itu segala daya kita harus dilakukan untuk mencapai hal ini."
 CHL_align_the_marxists: "Sejajarkan kaum Marxis"
 CHL_align_the_marxists_desc: "Ada banyak orang di negara kita yang melihat struktur pemerintahan saat ini lemah, namun banyak dari mereka dapat dengan mudah diyakinkan untuk mendukung pemerintah jika presiden yang berhaluan kiri mau membantu mereka."
 CHL_low_cost_housing: "Perumahan Murah"
 CHL_low_cost_housing_desc: "Ada banyak orang di negara kita yang menjadi pengungsi atau miskin, dan kita harus melakukan yang terbaik untuk mendukung jiwa-jiwa malang ini, yang masih menjadi warga negara kita. Oleh karena itu, kita harus membentuk organisasi perumahan nasional, dan juga membuat kebijakan pemerintah untuk membangun jaring sosial yang dapat menangkap korban yang mengalami nasib malang."
 CHL_align_the_police: "Sejajarkan Investigasi Polisi"
 CHL_align_the_police_desc: "$CHL_expand_the_investigations_police_desc$"
 CHL_privatize_national_industries: "Privatisasi Industri Nasional"
 CHL_privatize_national_industries_desc: "Industri nasional saat ini lemah dan tidak efektif, dan kita harus berusaha untuk menyerahkannya kepada pihak swasta yang dapat mengelola setiap kompleks industri lokal dengan lebih baik."
 CHL_strengthen_instituto_nacional: "Memperkuat Instituto Nacional"
 CHL_strengthen_instituto_nacional_desc: "Meskipun didirikan sejak masa Patria Vieja, Instituto Nacional harus diperluas dan diperkuat untuk memastikan bahwa masyarakat negara kita dapat membaca apa yang mereka butuhkan, dan bahwa kita dapat mencapai kemajuan pada tingkat yang bermanfaat bagi kita."
 CHL_enact_universal_suffrage: "Menetapkan Hak Pilih Universal"
 CHL_enact_universal_suffrage_desc: "Hak untuk memilih adalah dasar dari setiap masyarakat demokratis, dan sangat disayangkan bahwa tidak semua orang di negara kita dapat memilih dengan hak yang sama seperti orang lain. Kita harus mengupayakan kesetaraan, dan memberikan kesempatan kepada perempuan Chile untuk memilih sesegera mungkin."
 CHL_host_spanish_refugees: "Tuan rumah Pengungsi Spanyol"
 CHL_host_spanish_refugees_desc: "Saudara-saudara kita di Spanyol telah bertengkar dengan teman dan keluarga mereka dan hancur secara rohani. Kini setelah berakhirnya perang saudara, banyak orang yang berusaha melarikan diri dari rezim mereka saat ini, dan sebagai saudara Spanyol, kami adalah kandidat utama untuk menerima pengungsi."
 CHL_expand_the_investigations_police: "Polisi Investigasi Chili"
 CHL_expand_the_investigations_police_desc: "Polisi Investigasi Chili didirikan pada tahun 1933, dan merupakan salah satu dari dua badan polisi Chili, bersama dengan polisi penegak hukum: Carabineros de Chile. Polisi Investigasi membagi wilayah penyelidikannya sesuai dengan kejahatan yang diselidiki, termasuk beberapa unit khusus penyelidikan polisi, yang memiliki spesialis Detektif."
 CHL_increase_presidential_powers: "Meningkatkan Kekuasaan Presiden"
 CHL_increase_presidential_powers_desc: "Presiden adalah satu-satunya orang yang dibutuhkan untuk memimpin negara, karena orang yang kuat lebih baik daripada parlemen yang terpecah dan lemah. Presiden adalah parlemen, dan partisipasi politik mereka tidak diperlukan."
 CHL_reapproach_america: "Dekati kembali Amerika"
 CHL_reapproach_america_desc: "AS memutuskan banyak hubungan dengan kita ketika Depresi Besar dimulai, dan hubungan kita belum sepenuhnya terselesaikan. Oleh karena itu, Presiden dan Kongres harus segera melakukan upaya bersama untuk memulihkan hubungan dengan mereka."
 CHL_return_to_the_parliamentary_era: "Kembali ke Era Parlementer"
 CHL_return_to_the_parliamentary_era_desc: "Hanya ada satu kebenaran universal, dan kebenarannya adalah bahwa kekuasaan itu korup, dan kekuasaan yang absolut pasti korup. Oleh karena itu kita harus memastikan bahwa parlemen mempunyai hak suara yang besar sehingga presiden yang tidak waras tidak dapat mengatur masa depan bangsa kita secara keseluruhan."
 CHL_development_inwards: "Perkembangan Ke Dalam"
 CHL_development_inwards_desc: "Seharusnya menjadi kebijakan kita untuk tidak ikut campur dalam urusan dunia dan membangun negara secara internal, tanpa terlalu bergantung pada ekspor."
 CHL_kickstart_the_arsenal_of_democracy: "Memulai Persenjataan Demokrasi"
 CHL_kickstart_the_arsenal_of_democracy_desc: "Tampaknya kita mungkin akan terseret ke dalam konflik besar dalam waktu dekat, dan untuk memastikan bahwa kita tidak terlenyap dalam situasi seperti ini, kita harus segera memperluas organisasi industri militer kita."
 CHL_chilean_anti_communist_action: "Aksi Chilena Anticomunista"
 CHL_chilean_anti_communist_action_desc: "Kaum komunis adalah ancaman yang sama besarnya terhadap bangsa kita seperti halnya negara lain, dan kita harus melakukan segala daya kita untuk memastikan bahwa mereka tidak pernah mendapatkan kesempatan untuk mewujudkan revolusi yang mereka inginkan."
 CHL_chilean_anti_communist_action_dem_version: "Aksi Anti-Komunis Chili"
 CHL_chilean_anti_communist_action_dem_version_desc: "$CHL_chilean_anti_communist_action_desc$"
 CHL_organize_patriotic_leagues: "Atur Liga Patriotik"
 CHL_organize_patriotic_leagues_desc: "Liga patriotik adalah sindikat mafia fasis yang pernah berkeliaran di jalan-jalan Santiago dan Buenos Aires, dan kita harus berupaya untuk membangun kembali mereka, sekaligus memastikan bahwa mereka tetap setia kepada pemerintah kita, daripada bekerja secara independen seperti dulu."
 CHL_preemtively_strike_foreign_revolutionaries: "Lebih Dulu Menyerang Kaum Revolusioner Asing"
 CHL_preemtively_strike_foreign_revolutionaries_desc: "Kita mungkin telah mengamankan negara kita dari ancaman komunis internal, namun masih ada ancaman eksternal. Kita harus terlebih dahulu menjatuhkan mereka sebelum mereka dapat melakukan revolusi kepada kita."
 CHL_preemtively_strike_foreign_revolutionaries_tt: "Dapatkan boneka §Ywargoal§! melawan semua negara §Ykomunis§! di Amerika Selatan"
 CHL_law_of_permanent_defense_of_democracy: "Hukum Pertahanan Permanen Demokrasi"
 CHL_law_of_permanent_defense_of_democracy_desc: "Ancaman komunis tidak hanya menghantui kita, namun juga seluruh dunia. Jika kita ingin bertahan selama perang dingin yang pasti akan terjadi, kita harus memastikan bahwa komunis tidak mungkin menggulingkan rezim kita dan mengancam rakyat kita."
 CHL_law_of_permanent_defense: "Pertahanan Permanen"
 CHL_law_of_permanent_defense_desc: "$CHL_law_of_permanent_defense_of_democracy_desc$"
 CHL_promote_immigration_to_chile: "$BRA_promote_immigration_to_brazil$"
 CHL_promote_immigration_to_chile_desc: "[CHL.GetName] adalah negara yang beragam dengan orang-orang yang nenek moyangnya tersebar di seluruh dunia. Dengan perekonomian kita yang kembali bertumbuh dan melimpahnya sumber daya yang menunggu untuk dimanfaatkan, inilah saatnya kita mendorong lebih banyak orang untuk pindah ke sini dan menyebut diri mereka [CHL.GetAdjective] juga."
 CHL_socialist_youth: "Sebuah Organisasi Pemuda Sosialis"
 CHL_socialist_youth_desc: "Banyak generasi muda yang mengalami radikalisasi ke arah kiri dan kanan. Kaum sosialis khususnya cukup vokal dan bersemangat dalam melindungi nilai-nilai mereka, dan dengan demikian bersedia melawan siapa pun yang mengancam negara kita yang besar ini."
 CHL_counter_operation_bolivar: "Bekerja untuk Melawan Operasi Bolivar"
 CHL_counter_operation_bolivar_desc: "Jerman sedang berusaha mempengaruhi negara-negara Amerika Selatan dengan menggunakan spionase dan sabotase dalam Operasi Bolivar yang keji. Kita harus melakukan segala daya kita untuk melawan upaya mereka."
 CHL_strike_down_south_american_fascism: "Hancurkan Fasisme Amerika Selatan"
 CHL_strike_down_south_american_fascism_desc: "Ada banyak orang di Amerika Selatan yang tertarik pada fasisme, dan kita perlu memastikan bahwa tidak ada seorang pun di kawasan kita yang mengancam keamanan kita, sehingga menyulitkan kita untuk hidup berdampingan dengan mereka. Oleh karena itu, kita harus menjatuhkan mereka sebelum mereka berpikir untuk menyakiti kita."
 CHL_land_reforms: "Reformasi Pertanahan"
 CHL_land_reforms_desc: "Sistem Hacienda - Inquilinaje sudah ketinggalan jaman, dan menyebabkan perpecahan besar antar kelas sosial dalam masyarakat kita. Kita harus berusaha untuk mendistribusikan kembali tanah Hacendados, dan mengakhiri sistem perbudakan yang brutal ini untuk selamanya!"
 CHL_support_the_democracies: "Mendukung Demokrasi"
 CHL_support_the_democracies_desc: "Negara-negara demokrasi di Eropa dan Amerika sedang berada dalam kesulitan, dan merupakan tugas kita sebagai sesama negara demokrasi untuk membantu mereka dalam situasi tersebut, dengan cara apa pun yang memungkinkan. Oleh karena itu, kita harus mengirimkan warga Chile untuk mengamankan kepentingan negara-negara demokrasi lainnya."
 CHL_mapuche_reconcilliation_campaigns: "Kampanye Rekonsiliasi Mapuche"
 CHL_mapuche_reconcilliation_campaigns_desc: "Suku Mapuche telah dianiaya secara kejam oleh pemerintah kita sejak penaklukan Araucanía pada abad ke-19. Kita harus mengambil langkah besar untuk memperbaiki situasi mereka, dan memastikan bahwa mereka dapat hidup damai bersama sesama warga Chili."
 CHL_an_attempt_to_maintain_our_neutrality: "Upaya Menjaga Netralitas Kita"
 CHL_an_attempt_to_maintain_our_neutrality_desc: "Banyak negara yang terlibat dalam konflik dunia ingin menarik kita ke dalam perang yang diakibatkan oleh pertengkaran mereka yang tidak ada gunanya. Kita harus melakukan segala daya kita untuk menghindari konflik mereka dan tidak ikut campur dalam konflik yang tidak seharusnya kita ikuti."
 CHL_embargo_strategies: "Strategi Embargo"
 CHL_embargo_strategies_desc: "Ada lebih banyak cara untuk mendukung negara-negara demokrasi dibandingkan hanya mengirim tentara untuk berperang, dan waktu telah membuktikan bahwa langkah-langkah ekonomi juga bisa memberikan dampak yang sama. Itu sebabnya kita harus mengembargo musuh teman kita, sehingga kita bisa membuat mereka kekurangan tembaga dan nitrat yang mereka perlukan untuk berperang."
 CHL_embargo_strategies_tt: "Kami akan §YEmbargo§! semua negara yang berperang dengan negara-negara §YDemokrat§! utama di dunia."
 CHL_enact_stricter_labor_laws: "Menetapkan Undang-Undang Ketenagakerjaan yang Lebih Ketat"
 CHL_enact_stricter_labor_laws_desc: "Undang-undang ketenagakerjaan saat ini terlalu longgar untuk sebuah masyarakat demokratis yang baik, dan kita harus memastikan bahwa korporasi dan kapitalis tidak dapat mengambil keuntungan dari kelas pekerja miskin di Chile. Untuk masa depan yang lebih setara!"
 CHL_found_national_steelworks: "Ditemukan Pabrik Baja Nasional"
 CHL_found_national_steelworks_desc: "Negara ini sangat membutuhkan baja, dan surveyor kami menemukan bahwa wilayah Araucanía yang subur memiliki kebutuhan tersebut. Oleh karena itu kita harus berusaha keras untuk mendirikan pabrik baja baru sehingga kita dapat memanfaatkan sumber daya nasional yang tersedia."
 CHL_found_the_contraloria_general_de_la_republica: "Menemukan Contraloría Jenderal de la República"
 CHL_found_the_contraloria_general_de_la_republica_desc: "Pengawas Keuangan Umum Chili akan menjadi badan otonom pemerintah Chili secara konstitusional. Ia akan bertanggung jawab atas pengendalian aspek hukum, pengelolaan, fungsi pra-audit dan pasca-audit dari semua kegiatan pegawai negeri sipil yang terpusat dan terdesentralisasi, apa pun bentuk organisasinya, serta wewenang lain yang diberikan oleh undang-undang."
 CHL_establish_the_ministry_of_mining: "Membentuk Kementerian Pertambangan"
 CHL_establish_the_ministry_of_mining_desc: "Kita juga harus membentuk kementerian nasional yang bertanggung jawab atas operasi pertambangan di negara kita, sehingga kita dapat mengontrol secara terpusat di mana tambang dibuat dan bagaimana tambang tersebut dijalankan."
 CHL_the_nationalization_of_copper: "Nasionalisasi Tembaga"
 CHL_the_nationalization_of_copper_desc: "Sebagian besar tembaga di negara kita saat ini dikendalikan oleh perusahaan pertambangan swasta, dan kita harus memastikan bahwa simpanan tersebut berada di tangan pemerintah dan kementerian pertambangan yang lebih bijaksana."
 CHL_enforce_stricter_secularism: "Menegakkan Sekularisme yang Lebih Ketat"
 CHL_enforce_stricter_secularism_desc: "Kita telah menetapkan sekularisme dalam konstitusi liberal, namun gereja masih memegang banyak kekuasaan baik atas masyarakat maupun politisi terpilih. Oleh karena itu, kita harus menuntut adanya jarak dari agama ketika berpolitik, dari siapapun yang ingin berpartisipasi di dalamnya."
 CHL_repeal_the_separation_of_church_an_state: "Mencabut Pemisahan Gereja dan Negara"
 CHL_repeal_the_separation_of_church_an_state_desc: "Perpecahan antara gereja dan negara merupakan kesalahan besar dan harus segera diatasi. Gereja adalah sekutu kita, seperti yang kita semua ketahui dengan baik."
 CHL_a_joint_application_to_the_allies: "Permohonan Bersama kepada Sekutu"
 CHL_a_joint_application_to_the_allies_desc: "Kami dan Argentina selalu memiliki hubungan yang cukup baik dengan Sekutu di masa lalu, dan inilah saatnya untuk bergabung dengan mereka dan bekerja sama demi masa depan yang lebih cerah."
 CHL_dispute_over_tierra_del_fuego: "Sengketa Tierra del Fuego"
 CHL_dispute_over_tierra_del_fuego_desc: "Pemerintah Argentina masih mengklaim bagian timur Tierra del Fuego sebagai milik mereka, meskipun tidak ada hubungan darat dengan wilayah tersebut, dan kami jelas memiliki klaim yang lebih tua dan lebih sah atas wilayah tersebut. Kita harus segera bergerak untuk mengamankannya."
 CHL_protect_the_easter_island: "Lindungi Pulau Paskah"
 CHL_protect_the_easter_island_desc: "Pulau Paskah, yang juga dikenal sebagai Rapa Nui oleh penduduk setempat, terus-menerus diancam oleh kaum fasis di barat. Kita harus bertindak tidak hanya untuk membentengi pulau ini dan membangun pelabuhan-pelabuhannya, namun juga melakukan serangan terlebih dahulu terhadap siapapun yang ingin mengklaim Samudera Pasifik."
 form_country_south_america_required_states_tt: "§Y[ROOT.GetName]§! Mengontrol semua §YNegara Bagian Daratan§! di §YAmerika Selatan§!"
 CHL_joint_research_initiatives_tt: "§YChile§!, dan setiap negara yang berada dalam faksi bersama kami, akan bergabung dengan §YGrup Berbagi Teknologi§!"
 CHL_the_future_of_Chile: "Masa Depan [CHL.GetName]"
 CHL_the_future_of_Chile_desc: "Partai Komunis harus bersidang dengan tujuan untuk memutuskan jalan yang akan diambil di tahun-tahun mendatang, mengingat koalisi besar yang ada saat ini tidak dapat sepenuhnya menyetujui semua poin. Saat ini ia berdiri di antara kaum Marxis Elias Lafertte Gavino, kaum Sosialis Marmaduke Grove Vallejo, kaum Stalinis Carlos Contreras Labarca dan kaum Trotskis Manuel Hidalgo Plaza."
 CHL_support_for_the_international_revolution: "Dukungan untuk Revolusi Internasional"
 CHL_support_for_the_international_revolution_desc: "Ada banyak orang di luar sana yang harus berjuang tidak hanya melawan negara asing yang menyerbu rumah mereka, namun juga pemerintah dan industri korup yang merampas penghidupan mereka. Kita harus melakukan semua yang kita bisa untuk memastikan bahwa masyarakat di dunia dapat merasa aman dan terlindungi dari kejahatan."
 CHL_sponsor_american_revolutions: "Mensponsori Revolusioner Amerika"
 CHL_sponsor_american_revolutions_desc: "Ada banyak orang yang mempunyai potensi untuk berhasil dalam revolusi jika mereka mencobanya, namun mereka tidak memiliki dana atau senjata untuk mencapai tujuan tersebut. Oleh karena itu kita harus memastikan untuk mensponsori kaum revolusioner tersebut, dan mengusir kapitalisme dari Amerika Selatan."
 CHL_sponsor_american_revolutions_tt: "Membuka keputusan untuk §YMensponsori Demonstrasi Ideologi§! di negara-negara §YAmerika Selatan dan Utara§! lainnya"
 CHL_union_of_hispanic_republics: "Persatuan Republik Hispanik"
 CHL_union_of_hispanic_republics_desc: "Kini, setelah seluruh rakyat Hispanik bersatu di bawah satu bendera, inilah saat yang tepat bagi kita untuk menunjukkan kepada dunia apa yang mampu kita lakukan, dan bahwa kita bermaksud untuk membebaskan rakyat kita yang masih berada di bawah kekuasaan imperialis asing."
 CHL_propose_closer_cooperation: "Usulkan Kerjasama Lebih Dekat"
 CHL_propose_closer_cooperation_desc: "Negara-negara komunis di sekitar kita mungkin memiliki ideologi yang sama dengan kita, tetapi mereka tersebar secara strategis dan tidak memiliki koordinasi. kita harus membawa mereka ke bawah pengawasan kita, dan membantu membimbing mereka dengan lebih baik."
 CHL_nationalize_foreign_industries: "Nasionalisasi Industri Asing"
 CHL_nationalize_foreign_industries_desc: "Kaum kapitalis yang masih tersisa di negara kita harus bersusah payah, karena mereka menyadari apa langkah kita selanjutnya. Kita harus menyita semua properti yang mereka miliki, dan mendistribusikannya kembali kepada masyarakat."
 CHL_align_with_the_russian_soviet: "Sejajarkan dengan [SOU.GetNameDef]"
 CHL_align_with_the_russian_soviet_desc: "[SOU.GetNameDefCap] adalah rekan ideologis yang dekat. Kita harus memastikan untuk mendekati mereka dengan tawaran bantuan timbal balik sebagai imbalan untuk bergabung dengan [SOU.GetFactionName]."
 CHL_hub_of_the_world_revolution: "Pusat Revolusi Dunia"
 CHL_hub_of_the_world_revolution_desc: "Ada banyak kaum revolusioner di luar sana yang tidak puas dengan keadaan dunia saat ini, dan yang lebih penting, mereka mungkin kecewa dengan keadaan Uni Soviet. Kita harus berjuang untuk dunia yang lebih besar, bersama-sama!"
 CHL_hub_of_the_world_revolution_tt: "Penasihat komunis dari negara lain akan dipindahkan ke [CHL.GetName] tergantung pada situasi politik negara asal mereka. Saat ini para penasihat ini akan ditransfer ke [CHL.GetName]:"
 CHL_joint_development_programs: "Program Pembangunan Bersama"
 CHL_joint_development_programs_desc: "Sekarang kita adalah sekutu, kita harus berusaha keras untuk bersama-sama membangun pabrik-pabrik baru guna mengembangkan negara kita dengan lebih baik."
 CHL_joint_research_initiatives: "Inisiatif Penelitian Bersama"
 CHL_joint_research_initiatives_desc: "Sekarang kita adalah sekutu, kita harus berusaha untuk saling membangun laboratorium dan program kerja sama penelitian guna memajukan pengembangan senjata yang melampaui kemampuan kaum kapitalis dan imperialis di dunia."
 CHL_one_more_fascist_focus_done_tt: "§GMenurunkan§! dampak negatif kudeta oleh\nDukungan Perang: §G+5%§!\nStabilitas: §G+5%§!"
 CHL_commence_the_counter_revolution_negative_tt: "Kalah Dukungan Perang dan Stabilitas berdasarkan jumlah §YFokus Persiapan§! yang diambil sebelumnya"
 CHL_propose_closer_cooperation_tt: "Mengirimkan acara ke seluruh §YNegara Komunis§! di §YAmerika Selatan dan Tengah§!, menuntut agar mereka tunduk kepada kami"
 CHL_sway_ariosto_hererra_tt: "§YAriosto Hererra§! dan anak buahnya akan bergabung dengan kami dalam kudeta kami"
 CHL_proliferate_national_populism_tt: "Saat menyelesaikan §YMemulai Kontra-Revolusi§! fokus:\nKekuatan Politik §G+75§!."
 CHL_more_funds_or_the_propaganda_department_tt: "Saat menyelesaikan §YMemulai Kontra-Revolusi§! fokus:\nTenaga Kerja §G+5000§!."
 CHL_recruit_young_officers_tt: "Perwira Muda tertentu akan dipromosikan menjadi §YJenderal§!"
 CHL_enforce_the_chilean_identity_tt: "Ketika semangat kebangsaan §Y$CHL_ancestral_mapuche_resistance$§! dihilangkan, kembalikan inti pada [950.GetName]."
 CHL_expand_the_department_of_provinces_change_tt: "Memodifikasi §YSemangat Nasional§! yang diperoleh sebelumnya, dengan efek yang sedikit berbeda bergantung pada §YDepartemen§! mana yang sebelumnya telah diperkuat."
 CHL_expand_the_department_of_provinces_coring_tt: "Membuka keputusan untuk §YIntegrasi Negara§! yang diklaim oleh Irredentist Chili"
 CHL_abide_by_the_francoist_model_tt: "Kami akan §RTidak Bisa Lagi Bergabung dengan Fraksi§!"
 CHL_hipanic_alliance_faction: "Aliansi Hispanik"
 CHL_undo_colonialist_occupations_tt: "Membuka keputusan untuk §YMenempati Belize dan Terusan Panama§!"
 CHL_press_our_demands_tt: "Mengirimkan tuntutan kepada penjajah ilegal di Guyana §YMenegakkan Kepemilikan Kami§! negara bagian"
 CHL_the_latin_american_alliance_tt: "Mengundang negara-negara §YNon-Hispanik Amerika Latin§! ke faksi kami"
 CHL_sponsor_anti_colonialist_rebellions_tt: "Membuka keputusan untuk meningkatkan perlawanan di negara-negara kolonial di §YAmerika Selatan dan Tengah§!"
 CHL_empower_the_preparation_department: "Memberdayakan Departemen Persiapan"
 CHL_empower_the_preparation_department_desc: "Agar kudeta dapat berjalan selancar mungkin, kita tidak hanya perlu memastikan dukungan masyarakat umum, namun juga menyiapkan sumber daya manusia, rencana, dan logistik untuk menghadapi hari yang akan datang."
 CHL_sway_ariosto_hererra: "Goyangkan Ariosto Herrera"
 CHL_sway_ariosto_hererra_desc: "Jenderal Ariosto Herrera terbukti memiliki simpati anti-sosialis yang kuat, namun ia belum tentu setia kepada kita. Adalah bijaksana untuk memastikan dukungan dari dia dan orang-orangnya yang paling setia, karena kita pasti bisa menggunakan orang-orang seperti dia di antara barisan kita."
 CHL_inflitrate_the_carabinieros: "Menyusup ke Carabineros"
 CHL_inflitrate_the_carabinieros_desc: "Carabineros de Chile bertugas melindungi negara dari pemberontak, kami termasuk di antara mereka. Jika kita melawan mereka, itu pasti akan menjadi pertumpahan darah, tapi jika kita mendapatkan kesetiaan mereka, mereka pasti akan menjadi pion yang sangat berguna."
 CHL_unify_the_fascist_movements: "Satukan Gerakan Fasis"
 CHL_unify_the_fascist_movements_desc: "Meskipun Jorge González von Marées mempunyai kendali kuat atas Movimiento Nacional-Socialista de Chile, masih ada kelompok lain dengan gagasan serupa yang tidak mengikutinya. Perlu didesak agar ia memimpin gerakan payung garda depan bagi kaum fasis Chili, agar kudeta bisa berhasil."
 CHL_proliferate_national_populism: "Memperbanyak Populisme Nasional"
 CHL_proliferate_national_populism_desc: "Penduduk sipil sama pentingnya dengan hal lainnya, terutama jika kita ingin menstabilkan negara kita setelah kudeta terjadi. Kita harus mendapatkan dukungan mereka, melalui cara-cara curang jika perlu!"
 CHL_more_funds_or_the_propaganda_department: "Lebih Banyak Dana untuk Departemen Propaganda"
 CHL_more_funds_or_the_propaganda_department_desc: "Departemen propaganda kami bekerja lembur untuk meyakinkan masyarakat bahwa kami adalah penyelamat mereka, namun mereka tidak dapat mempertahankan efisiensi jika kami tidak memberikan dana kepada mereka. Kita harus mencuci dana melalui politisi korup untuk mempersiapkan kudeta."
 CHL_request_foreign_support: "Minta Dukungan Asing"
 CHL_request_foreign_support_desc: "Ada banyak negara yang sudah dikuasai oleh orang-orang yang memiliki kecenderungan ideologis yang sama dengan kita, dan mungkin akan lebih bijaksana jika kita berpihak pada negara-negara tersebut. Melalui itu, kita bisa meminta senjata dan tentara dari mereka untuk membantu kita melakukan kudeta."
 CHL_the_popular_freedom_alliance: "Aliansi Kebebasan Populer"
 CHL_the_popular_freedom_alliance_desc: "Ada beberapa orang di negara ini yang memiliki cita-cita yang sama dengan kita, namun tidak berani menyatakan hal tersebut secara terbuka. Oleh karena itu, kita harus meyakinkan Jenderal Carlos Ibáñez del Campo untuk memimpin koalisi baru, Alianza Popular Libertadora, yang menghimbau nilai-nilai konservatif, namun diam-diam justru memperkuat kita."
 CHL_rally_the_people: "Kumpulkan Rakyat"
 CHL_rally_the_people_desc: "Kudeta telah dipersiapkan dan siap. Yang diperlukan saat ini hanyalah membuat marah masyarakat, dan memberitahukan kepada pemerintah liberal bahwa masa mereka akan segera berakhir. Sudah saatnya kita mengakhiri keadaan menyedihkan ini!"
 CHL_commence_the_counter_revolution: "Memulai Kontra-Revolusi"
 CHL_commence_the_counter_revolution_desc: "Pasukan kami siap siaga, dan tidak sabar menunggu perintah, siap menduduki setiap posisi utama di Santiago, serta balai kota di berbagai kota lainnya. Yang diperlukan sekarang hanyalah melaksanakan rencana tersebut, dan menunggu serta melihat seberapa besar dukungan dari masyarakat yang kita miliki setelah semua ini selesai."
 CHL_promote_broad_anti_americansim: "Mempromosikan Anti-Amerikanisme yang Luas"
 CHL_promote_broad_anti_americansim_desc: "Orang-orang Amerika semuanya bajingan, mereka telah mengeluarkan darah kita sampai kita menjadi putih, mereka telah mengambil segala sesuatu yang kita miliki seolah-olah itu adalah hak mereka, dan kita tidak mendapat imbalan apa pun meskipun mereka membuat banyak keributan, apa yang pernah dilakukan orang-orang Amerika untuk kita? Saya ulangi, apa yang telah dilakukan Amerika untuk kita!?"
 CHL_ban_liberalism: "Melarang Liberalisme"
 CHL_ban_liberalism_desc: "Meskipun kita telah menyingkirkan kaum liberal dari pemerintahan, mereka tetap bertahan, seperti butiran pasir yang tak ada habisnya. Kita harus membasmi kelompok mereka, dan memastikan bahwa mereka tidak cukup kuat untuk mengancam pemerintahan kita."
 CHL_recruit_young_officers: "Rekrut Perwira Muda"
 CHL_recruit_young_officers_desc: "Banyak jenderal yang menduduki posisi tinggi di negara kita memiliki simpati yang lebih berhaluan kiri, dan semuanya, kecuali beberapa, telah mengundurkan diri setelah kita mengambil kendali. Kita harus mengangkat beberapa perwira muda yang patriotik dan fanatik dari pangkatnya, dan meminta mereka menggantikan atasan mereka yang sudah tua dan dekaden."
 CHL_enforce_the_chilean_identity: "Bentuk Identitas Chili Baru"
 CHL_enforce_the_chilean_identity_desc: "Saat ini, masyarakat Chili terpecah belah, dan kita perlu melakukan sesuatu untuk menyatukan mereka di bawah bendera kita. Spanyol, Mapuche, Chile, tidak ada bedanya, karena mereka semua adalah warga negara kita, dan mereka sama. Beberapa orang mungkin menolak pesan kami, namun secara umum identitas baru Chili seharusnya menyenangkan sebagian besar orang."
 CHL_cooperate_with_operation_bolivar: "Bekerja sama dengan Operasi Bolivar"
 CHL_cooperate_with_operation_bolivar_desc: "Namun Jerman telah melakukan banyak hal untuk kami. Saat kami sangat membutuhkannya, pemukim Jerman pindah untuk menjajah Araucanía, dan sekarang, mereka membutuhkan bantuan untuk berurusan dengan Amerika. Adalah tugas kita untuk membantu mereka dalam hal ini, dan membayar hutang kita kepada mereka."
 CHL_abide_by_the_francoist_model: "Patuhi Model Francoist"
 CHL_abide_by_the_francoist_model_desc: "Meskipun Jerman mungkin mempunyai pengaruh yang besar, apa yang benar-benar perlu diperhatikan oleh gerakan kita adalah ide-ide para pemikir Mediterania seperti Mussolini dan Franco. Model merekalah yang harus kita ikuti, dan cita-cita merekalah yang harus kita jadikan milik kita sendiri."
 CHL_host_german_intelligence: "Tuan Rumah Intelijen Jerman"
 CHL_host_german_intelligence_desc: "Dalam Operasi Bolivar, Jerman berusaha memata-matai Amerika dari selatan, dan kami mungkin bisa memberikan banyak informasi menarik kepada mereka, asalkan mereka menempatkan mata-mata dan membiarkan Abwehr bekerja lebih dekat dengan pemerintah kami."
 CHL_militarize_the_state: "Militerisasi Negara"
 CHL_militarize_the_state_desc: "Meskipun kita telah mampu memenangkan perang-perang besar sebelumnya, negara kita saat ini belum siap menghadapi konflik berskala besar lainnya. Oleh karena itu, kita harus memiliterisasi negara terlebih dahulu jika kita ingin pasukan kita kembali siap berperang."
 CHL_the_spirit_of_the_war_of_the_pacific: "Semangat Perang Pasifik"
 CHL_the_spirit_of_the_war_of_the_pacific_desc: "Jika kita ingin pasukan kita kuat, kita harus mengingatkan mereka tentang pencapaian besar kita selama perang pasifik, melawan Peru dan Bolivia. Kami juga dapat mengambil kesempatan ini untuk menegaskan kembali klaim kami atas wilayah tertentu yang mungkin bersedia diberikan oleh sekutu Jerman kami kepada kami."
 CHL_syndicalize_the_production_sector: "Sindikalisasikan Sektor Produksi"
 CHL_syndicalize_the_production_sector_desc: "Sektor produksi saat ini dilanda ketidakefisienan dan kekejaman Hacendados yang hanya memikirkan keuntungannya sendiri. Kita harus mensindikalisasikan industri-industri tersebut, dan melahirkan model korporasi industri yang benar-benar falangis."
 CHL_expand_the_mountain_regiments: "Perluas Resimen Gunung"
 CHL_expand_the_mountain_regiments_desc: "Pasukan paling elit yang kami miliki adalah resimen khusus pendaki gunung, yang cocok untuk pertempuran brutal di mana pun di negara ini. Kita harus mewajibkan para jenderal kita untuk bergilir dan berlatih bersama pasukan ini, dan menyediakan peralatan khusus apa pun yang mungkin mereka perlukan."
 CHL_departemento_de_las_tropas_nacistas_de_asalto: "Departemen las Tropas de Asalto"
 CHL_departemento_de_las_tropas_nacistas_de_asalto_desc: "Pasukan Serangan Nacista departemen kita harus diberanikan dan diperkuat. Kita harus memastikan bahwa mereka hidup sesuai dengan semangat pasukan kejutan Perang Besar, dan memperlengkapi mereka dengan tepat."
 CHL_departamento_de_la_juventad_nacista: "Departemen Juventud Nacista"
 CHL_departamento_de_la_juventad_nacista_desc: "Negara-negara lain seperti Jerman telah berhasil memiliterisasi pemuda mereka, dan kita tidak boleh melakukan hal yang berbeda, karena kita membutuhkan lebih banyak orang di lapangan, dan kita memerlukannya sekarang."
 CHL_expand_the_department_of_provinces: "Memperbesar Departemen Provinsi"
 CHL_expand_the_department_of_provinces_desc: "Departemen provinsi bekerja lembur untuk memastikan bahwa kita mengendalikan seluruh wilayah Chile, namun jika kita sepenuhnya mendukung dan memperluasnya, kita dapat menggunakannya untuk mengatur administrasi yang lebih baik bahkan di wilayah asing dengan lebih efektif."
 CHL_revoke_the_treaty_of_lima: "Cabut Perjanjian Lima"
 CHL_revoke_the_treaty_of_lima_desc: "Tidak ada legitimasi terhadap perjanjian Lima tahun 1929 yang menyerahkan wilayah Tacna kembali ke Peru, dan tidak ada penjelasan lain selain bahwa kami terpaksa melakukan hal tersebut. Sudah saatnya kita memperbaiki keadaan dan menuntut pengembalian wilayah tersebut."
 CHL_demand_the_fireland: "Menuntut Negara Api"
 CHL_demand_the_fireland_desc: "Tierra del Fuego berhak menjadi milik kami, dan Argentina tidak dapat mengklaim legitimasi atas kepemilikannya, mengingat mereka bahkan tidak ada hubungannya dengan kepemilikan tersebut. Kita harus meyakinkan masyarakat bahwa kita tidak bermaksud jahat, dan melepaskan kawasan ini dari cengkeraman Argentina."
 CHL_escalate_the_laguna_del_desierto_issue: "Tingkatkan Masalah Laguna del Desierto"
 CHL_escalate_the_laguna_del_desierto_issue_desc: "Demarkasi di sekitar Laguna del Desierto sangat tidak jelas dan juga bias terhadap masyarakat Argentina. Kita harus bergerak untuk menduduki bagian wilayah yang menjadi hak kita, dan mungkin bahkan melangkah lebih jauh."
 CHL_demand_demilitarization_of_patagonia: "Demiliterisasi Patagonia"
 CHL_demand_demilitarization_of_patagonia_desc: "Argentina terus mengancam rakyat kami dengan kehadiran militer mereka yang terus menerus di Patagonia. Sudah saatnya kita meminta mereka untuk membiarkan kita sendiri, dan berjanji untuk tidak memasukkan pasukan ke wilayah tersebut."
 CHL_enter_patagonia: "Masuk ke Patagonia"
 CHL_enter_patagonia_desc: "Jika masyarakat Argentina memercayai kami sedetik pun, itu adalah bukti bahwa kami telah menipu dan menakuti mereka. Sudah waktunya pasukan kita masuk ke Patagonia, dan menyerang dengan keras bahkan sebelum mereka tahu apa yang menimpa mereka."
 CHL_controlled_education: "Pendidikan yang Dikendalikan Secara Ketat"
 CHL_controlled_education_desc: "Jika anak-anak ingin tumbuh dengan baik, dan berpikir sesuai dengan keinginan kita, kita harus memastikan bahwa pendidikan mereka mengikuti standar dan peraturan yang kita miliki untuk menjadikan mereka sebagai warga negara teladan."
 CHL_promote_pan_hispanic_rhetoric: "Promosikan Retorika Pan-Hispanik"
 CHL_promote_pan_hispanic_rhetoric_desc: "Kita semua adalah individu. Namun demikian, kita dipersatukan dalam semangat dan darah kita sebagai bangsa Hispanik, dan sudah saatnya kita mengklaim hak kesulungan kita dan menggulingkan imperialis yang berusaha memecah belah rakyat kita."
 CHL_military_excercises: "Latihan Militer"
 CHL_military_excercises_desc: "Militer belum sepenuhnya siap untuk berperang, dan harus dilatih secara ekstensif sebelum mereka dapat berguna ketika hari penyatuan Hispanik tiba."
 CHL_cultivate_fanaticism: "Kembangkan Fanatisme"
 CHL_cultivate_fanaticism_desc: "Tanpa unifikasi, masyarakat Amerika Selatan dan Tengah tidak mempunyai masa depan, dan hal ini harus diketahui semua orang. Jika kita tidak melawan Amerika sekarang, kita pasti akan jatuh ke dalam cengkeraman mereka yang manipulatif dan imperialis. Kehormatan itulah yang menjadikan seorang Hispanik, dan keganasan itulah yang akan dialami oleh siapa pun yang menentang kita."
 CHL_the_path_to_conquest: "Penyatuan Melalui Penaklukan"
 CHL_the_path_to_conquest_desc: "Tindakan penaklukan yang gemilang, seperti para penakluk di masa lalu, adalah hal yang akan menyatukan rakyat kita, karena mereka berada di bawah kendali pemerintah nasionalis yang egois dan picik yang tidak dapat melihat gambaran yang lebih besar dimana mereka menjadi bagiannya. Kita harus membebaskan rakyat Hispanik dengan kekerasan!"
 CHL_hispanic_supremacy_pact_faction: "Liga Supremasi Hispanik"
 CHL_the_hispanic_alliance: "Aliansi Hispanik"
 CHL_the_hispanic_alliance_desc: "Rakyat kita harus bersatu, bukan dalam negara, namun dalam persahabatan dan kerja sama, dan hanya melalui aliansi maka persatuan Pan-Hispanik bisa terwujud. Kita harus menjangkau siapa pun yang memiliki cita-cita yang sama dengan kita, dan menjamin kesetiaan mereka terhadap tujuan tersebut."
 CHL_the_latin_american_alliance: "Aliansi Amerika Latin"
 CHL_the_latin_american_alliance_desc: "Meskipun Pan-Hispanisme adalah apa yang kami usahakan dan perjuangkan, masih ada orang-orang di benua kami yang ingin bergabung dengan kami untuk melawan penindasan Imperialis, meskipun mereka hanya orang Latin. Kita harus mengundang mereka, karena orang-orang Latin adalah orang-orang yang kuat."
 CHL_sponsor_anti_colonialist_rebellions: "Mensponsori Pemberontakan Anti-Kolonialis"
 CHL_sponsor_anti_colonialist_rebellions_desc: "Ada orang-orang yang berpikir seperti kita, namun tidak memiliki tekad untuk mengendalikan dan mengarahkan masa depan mereka sendiri. Kita harus membebaskan mereka dari cengkeraman penjajah."
 CHL_joint_development_and_research: "Pengembangan dan Penelitian Bersama"
 CHL_joint_development_and_research_desc: "Kini setelah kita bekerja sama secara lebih erat, kita dapat berinvestasi satu sama lain, dan menjadi tuan rumah laboratorium yang menampung peneliti dari setiap negara anggota untuk bekerja sama dengan lebih baik."
 CHL_push_past_the_darien_gap: "Melewati Celah Darien"
 CHL_push_past_the_darien_gap_desc: "Kesenjangan Darien antara Kolombia dan Panama mungkin sulit untuk diseberangi, namun hal ini diperlukan jika kita ingin mencapai perbatasan Amerika, dan pada akhirnya membebaskan saudara-saudara kita di sana."
 CHL_the_might_to_defend_our_homes: "Kekuatan untuk Mempertahankan Rumah kita"
 CHL_the_might_to_defend_our_homes_desc: "Kehidupan kita terus-menerus terancam oleh kekuatan-kekuatan besar di dunia, dan penting bagi masyarakat kita untuk merasa dilindungi oleh pemerintah. Kita harus memperkuat kekuatan kita, sehingga perang tidak akan pernah sampai di depan pintu kita."
 CHL_undo_colonialist_occupations: "Batalkan Pendudukan Kolonialis"
 CHL_undo_colonialist_occupations_desc: "Kekuatan kolonialis sudah terlalu lama menduduki sebagian wilayah Amerika Hispanik, dan inilah saatnya kita menunjukkan kepada mereka bahwa kita tidak boleh main-main. Kirim tentara!"
 CHL_unite_hispanic_america: "Satukan Amerika Hispanik"
 CHL_unite_hispanic_america_desc: "Waktunya akhirnya tiba! Saat ini kita menyaksikan sejarah, ketika sebagian besar warga Amerika Hispanik bersatu kembali, namun di bawah pemerintahan kita sendiri dan bukan di bawah Kekaisaran Spanyol. Bergembiralah, karena ini adalah datangnya era baru bagi benua ini!"
 CHL_the_true_enemy: "Musuh Sejati"
 CHL_the_true_enemy_desc: "Amerika adalah satu-satunya musuh sejati rakyat kita, dan sudah terlalu lama menindas warga Hispanik di wilayah selatan. Sekarang kita siap untuk dorongan terakhir, yang perlu kita lakukan hanyalah mengambil satu langkah terakhir."
 CHL_demand_the_guayanas: "Minta Guyana"
 CHL_demand_the_guayanas_desc: "Guyana sudah terlalu lama diduduki oleh kekuatan lain. Wilayah yang pernah diklaim sebagai tuan rumah El Dorado mungkin tidak memilikinya dalam kenyataan, namun masih banyak kekayaan lainnya, kekayaan yang sangat kita idam-idamkan untuk kita miliki."
 CHL_liberate_the_caribbean: "Bebaskan Karibia"
 CHL_liberate_the_caribbean_desc: "Karibia mungkin tidak semuanya merupakan wilayah Hispanik, atau bahkan Amerika Latin, namun tetap saja wilayah tersebut harus berada di bawah pengaruh kita, dan kita harus mengambil segala tindakan untuk mengamankan pulau-pulau tersebut bagi diri kita sendiri."
 CHL_press_our_demands: "Tekan Tuntutan Kami"
 CHL_press_our_demands_desc: "Kini setelah kita menguasai seluruh Guyana, kita dapat menegakkan tuntutan kita dan melepaskannya dari genggaman kaum Imperialis, dan berusaha untuk mencapai perdamaian dengan wilayah bekas penjajah."
 CHL_defense_of_the_hemisphere: "Pertahanan Belahan Bumi"
 CHL_defense_of_the_hemisphere_desc: "Ada banyak negara di belahan bumi kita yang akan mendapat manfaat besar jika dilindungi dari Amerika, dan itulah yang bisa kita dan Jerman tawarkan kepada mereka."
 CHL_support_the_colonial_plan: "Mendukung Rencana Kolonial"
 CHL_support_the_colonial_plan_desc: "Kantor Kolonial Jerman pernah menyusun rencana untuk segera merebut kendali aparatur negara di Uruguay, dan melantik pemerintahan boneka kolonial. Kami sekarang mempunyai kekuatan untuk mencoba mewujudkan hal ini, dan harus menuntut Uruguay untuk tunduk pada aliansi kami, dan memilih pihak yang benar dalam sejarah."
 CHL_unite_with_our_brothers_in_hispania: "Bersatu kembali dengan Saudara kita di Hispania"
 CHL_unite_with_our_brothers_in_hispania_desc: "Saudara-saudara kita yang sudah lama hilang di Hispania lama secara ideologis berpura-pura tidak menyukai kita, namun ragu-ragu untuk tidak bergabung dengan pihak Jerman dalam perang apa pun. Kita bisa menjadi dorongan yang mereka perlukan untuk akhirnya menjadi bagian dari faksi Jerman."
 CHL_restore_the_old_kingdom: "Kembalikan Kerajaan Lama"
 CHL_restore_the_old_kingdom_desc: "Kini setelah kita menguasai seluruh wilayah yang diklaim sebagai wilayah irredentist di Kerajaan Chile, yang pernah menjadi bagian dari Raja Muda Peru, kita dapat melakukan upaya untuk mengintegrasikan wilayah-wilayah ini ke dalam wilayah kita, dan bahkan mungkin melangkah lebih jauh dari perbatasan yang diklaim secara historis ini."
 CHL_an_empire_on_the_pacific: "Sebuah Kerajaan di Pasifik"
 CHL_an_empire_on_the_pacific_desc: "Kini setelah masa keemasan kita benar-benar dimulai, inilah saatnya kita memperluas wawasan kita, dan melihat ke arah barat. Kita akan membangun sebuah kerajaan besar, yang mencakup seluruh Samudra Pasifik!"
 CHL_modern_conquistadors: "Penakluk Pedro de Valdivia"
 CHL_modern_conquistadors_desc: "Kini setelah Kerajaan Chile yang lama akhirnya dipulihkan, sekarang saatnya untuk benar-benar menghormati leluhur kita dan mengambil alih jabatan gubernur kerajaan pertama kita, sang penakluk Pedro de Valdivia. Maju, menuju hal yang tidak diketahui!"
 CHL_no_more_advisors_tt: "Mayoritas §YPenasihat§! kami yang tersedia saat ini akan menjadi §RTidak Tersedia§!"
 CHL_indigenous_union: "Persatuan Masyarakat Adat Amerika"
 CHL_carabineros_secured_by_opposition: "Carabineros telah diamankan oleh Oposisi"
 CHL_annex_and_core_all_american_subjects: "§YLampiran§! dan keuntungan §YCores§! di semua §YNegara Subyek Amerindian dan Polinesia§!"
 CHL_unified_in_spirit_tt: "Semua §YNegara Bagian Amerindian dan Polinesia§! juga akan mendapatkan Semangat Nasional ini"
 CHL_avenge_the_pacification_tt: "Berbagai elemen Anti-Mapuche di negara ini akan mengikuti §YCarlos Ibáñez del Campo§! dalam §RPerang Saudara§! melawan kami!"
 CHL_undermine_the_carabineros_de_chile_tt: "Mencegah tim Ibáñez memperoleh §YTambahan Carabineros De Chile§! divisi ketika §YPerang Saudara§! dimulai"
 CHL_crusade_against_imperialism_tt: "Membuka Keputusan untuk §YMembebaskan Amerindian§! dan §YNegara Polinesia§! dari penindasan Imperialis"
 CHL_undermine_the_carabineros_de_chile_bonuses_tt: "§YSaat Perang Kemerdekaan Mapuche§! dimulai:\nPengalaman Tentara: §G+25§!.\nDapatkan Dukungan Perang Pangkalan: §G+5.00%§!."
 CHL_ibanezs_coup: "Kudeta Ibáñez"
 CHL_ibanezs_coup_desc: "Mantan Presiden dan Jenderal Carlos Ibáñez del Campo sangat ingin mendapatkan kembali jabatan kepresidenannya yang hilang, dan bersedia melakukan transaksi gelap jika diperlukan untuk mengamankan hal tersebut. Oleh karena itu, ia bersedia mendukung kudeta bersama yang dilakukan oleh kubu konservatif dan fasis, selama mereka menjanjikannya kepemimpinan negara."
 CHL_address_the_mapuche_conflict: "Mengatasi Konflik Mapuche"
 CHL_address_the_mapuche_conflict_desc: "Negara ini sedang tidak stabil, namun situasinya masih belum membaik bagi masyarakat Mapuche di bawah pemerintahan Ibáñez, dan oleh karena itu kita harus bertindak cepat. Aktivis dan politisi masyarakat adat Manuel Manquilef telah mulai mengumpulkan dan menyatukan banyak organisasi Mapuche yang terpecah belah, untuk menggulingkan negara Chili untuk selamanya."
 CHL_undermine_the_carabineros_de_chile: "Melemahkan Carabineros de Chile"
 CHL_undermine_the_carabineros_de_chile_desc: "Carabineros de Chile pernah didirikan oleh Presiden Carlos Ibáñez del Campo, dan masih sangat setia kepadanya. Jika kita mencoba menciptakan negara yang dipimpin oleh kita, mereka pasti akan bergabung di sisinya dan menghalangi kita. Oleh karena itu, kita harus melakukan segala daya kita untuk memastikan bahwa mereka mempunyai kekuatan sesedikit mungkin di masa depan."
 CHL_la_corporacion_araucania: "La Corporación Araucana"
 CHL_la_corporacion_araucania_desc: "Araucanian Corporation yang dipimpin oleh Venancio Coñuepán Huenchual yang konservatif dan korporativis, cucu seorang panglima perang Abajino yang terkenal, dapat menjadi sekutu yang berguna untuk bersatu melawan negara Chili."
 CHL_la_federacion_araucania: "La Federación Araucana"
 CHL_la_federacion_araucania_desc: "Federasi Araucanian yang dipimpin oleh tradisionalis Mapuche, Manuel Aburto Panguilef, sangat menentang kerja sama dengan masyarakat Chili modern, dan akan mudah untuk dimasukkan ke dalam gerakan kemerdekaan kita."
 CHL_sociedad_caupolican_defensora_de_la_araucania: "Sociedad Caupolican de la Araucanía"
 CHL_sociedad_caupolican_defensora_de_la_araucania_desc: "Caupolicán Defender of Araucanían Society yang dipimpin oleh Manuel Manquilef adalah salah satu organisasi Mapuche terbesar saat ini, dan merupakan landasan bagi keberhasilan revolusi. Mendapatkan dukungan anggota kelompok harus dianggap sebagai prioritas utama."
 CHL_union_araucana: "Unión Araucana"
 CHL_union_araucana_desc: "Unión Araucana adalah salah satu organisasi Mapuche tertua di Chili. Mereka, melalui hubungan dekat dengan para Bapa Kapusin yang hadir di Araucanía, telah mempromosikan agenda evangelisasi Katolik dan integrasi ke dalam masyarakat Chili, namun mereka akan mendukung cara-cara kami jika dibujuk dengan benar."
 CHL_la_moderna_araucania: "La Moderna Araucania"
 CHL_la_moderna_araucania_desc: "La Moderna Araucanía adalah salah satu organisasi Mapuche pertama yang didirikan di Chili, dengan penekanan pada pendidikan dan kemajuan. Kita harus berusaha untuk mengintegrasikan mereka ke dalam gerakan kita, dan memanfaatkan keahlian mereka sebaik mungkin."
 CHL_electing_a_toqui: "Memilih Toqui"
 CHL_electing_a_toqui_desc: "Sejalan dengan tradisi Mapuche, seorang Toqui dipilih sebagai pemimpin selama masa perang, oleh kumpulan Loncos yang memimpin berbagai Rehues dan Aillarehues. Toqui ini memegang peran tertinggi dalam masyarakat Mapuche dan memimpin para pejuang dan Lonco selama masa perang, dan inilah saatnya untuk memilih Toqui baru, yang dapat memimpin Perang Salib Anti-Imperialis kita!"
 CHL_electing_a_toqui_tt: "Kita akan bisa memilih pemimpin yang mempunyai sifat unik"
 CHL_convene_the_araucanian_congress: "Menyelenggarakan Kongres Araucanían"
 CHL_convene_the_araucanian_congress_desc: "Waktunya sudah dekat untuk melancarkan perang kemerdekaan, namun ada perpecahan internal dalam organisasi kami. Ada yang menyatakan bahwa komunis akan menjadi sekutu yang berguna, karena mereka memiliki tujuan yang sama dengan kita, sementara yang lain menyatakan bahwa mereka hanya akan menimbulkan faksionalisme dan mengkhianati kita pada saat-saat klimaks. Siapa yang harus dipercaya?"
 CHL_avenge_the_pacification_of_araucania: "Membalas Ketenangan Araucanía"
 CHL_avenge_the_pacification_of_araucania_desc: "Pendudukan Chili di Araucanía, yang berlangsung dari tahun 1861 hingga 1883 adalah periode kelam dalam sejarah Mapuche, dan inilah saatnya kita membalas dendam atas ketidakadilan dan perang yang dibawa oleh orang Chili kepada kita. Untuk mempersenjatai, para pejuang pemberani! Raih kembali apa yang pernah ada, dan itu akan menjadi milik Anda lagi! Hormatilah warisan Quilapán dan Caupolicán!"
 CHL_revise_the_social_classes: "Merevisi Kelas Sosial"
 CHL_revise_the_social_classes_desc: "Kini setelah kita memiliki masyarakat sendiri lagi, inilah saatnya kita merestrukturisasi kelas sosial agar lebih sesuai dengan pandangan dan cita-cita kita. Era Eropa akan segera berakhir!"
 CHL_adopt_mapundungun: "Mengadopsi Mapudungun"
 CHL_adopt_mapundungun_desc: "Sebuah langkah besar menuju pembentukan kembali negara bagian Mapuche yang layak adalah dengan mengadopsi bahasa Mapudungun sebagai bahasa resmi, setidaknya bahasa yang digunakan di pengadilan, atau bahasa lainnya. Kita juga harus mulai mendidik masyarakat di negara kita agar mereka bisa mempelajari bahasa kita."
 CHL_embrace_indigenous_corporatism: "Rangkullah Korporatisme Pribumi"
 CHL_embrace_indigenous_corporatism_desc: "Gagasan korporatisme Venancio Coñuepán Huenchual yang didasarkan pada cara-cara lama kerajinan tangan dan konstruksi asli Chili harus dianut dan dijadikan kebijakan resmi negara untuk industri di negara kita."
 CHL_expand_the_agricultural_field: "Perluas Lahan Pertanian"
 CHL_expand_the_agricultural_field_desc: "Terlepas dari ide-ide modern Venancio Coñuepán Huenchual, ada banyak orang yang ingin kembali ke cara lama masyarakat berbasis pertanian, hanya saja kali ini ada lebih banyak campur tangan negara bagi mereka yang tidak dapat menghidupi dirinya sendiri. Kita harus mengikuti apa yang diinginkan masyarakat kita, untuk meningkatkan stabilitas nasional."
 CHL_focus_on_cattle_and_wool: "Fokus pada Sapi dan Wol"
 CHL_focus_on_cattle_and_wool_desc: "Dua peternakan terbesar di negara ini saat ini adalah sapi dan domba, dan tidak bijaksana jika kita berupaya mengubahnya. Kita seharusnya mendorong pembelian hewan-hewan tersebut oleh para peternak di seluruh negara."
 CHL_enlarge_the_textile_industries: "Memperbesar Industri Tekstil"
 CHL_enlarge_the_textile_industries_desc: "Tekstil sebagian besar selalu diproduksi di seluruh negeri, dan hal tersebut seharusnya tidak berbeda saat ini. Negara harus mensubsidi pembukaan industri tekstil baru, dan berupaya membangun jalur perdagangan dengan negara-negara yang berpikiran sama."
 CHL_silverworking: "Pengerjaan Perak"
 CHL_silverworking_desc: "Pengerjaan perak selalu menjadi salah satu kerajinan tradisional khas masyarakat Mapuche, dan akan mudah untuk mengekspor pernak-pernik perak mahal kelas atas, karena kami juga memiliki simpanan perak alami dalam jumlah besar, terutama setelah kami mendapatkan Puelmapu dari orang Argentina."
 CHL_incorporate_machi_into_the_army: "Gabungkan Machi ke dalam Angkatan Darat"
 CHL_incorporate_machi_into_the_army_desc: "Suku Machi adalah tabib tradisional dan pemimpin agama dalam agama kami, dan dikenal karena kerajinan pengobatan tradisionalnya. Kita harus memastikan bahwa setiap divisi memiliki setidaknya satu, untuk menjamin kesehatan pasukan kita dalam pertempuran."
 CHL_the_patagonian_giants: "Raksasa Patagonian"
 CHL_the_patagonian_giants_desc: "Patagones atau Raksasa Patagonian adalah ras manusia raksasa yang dikabarkan tinggal di Patagonia dan dijelaskan dalam catatan awal Eropa, dan dikatakan bahwa mereka setidaknya memiliki tinggi dua kali lipat tinggi manusia normal. Meskipun rumor tersebut tidak benar, kita harus berusaha keras agar angkatan bersenjata kita dapat hidup sesuai dengan citra para raksasa ini, dan menyebarkan ketakutan di mata musuh-musuh kita."
 CHL_taking_back_patagonia: "[CHL_taking_back_patagonia_key]"
 CHL_taking_back_patagonia_desc: "[CHL_taking_back_patagonia_desc_key]"
 CHL_honor_the_legacy_of_caupolican: "Hormati Warisan Caupolicán"
 CHL_honor_the_legacy_of_caupolican_desc: "Caupolicán adalah seorang Toqui yang memimpin perlawanan rakyatnya melawan Penakluk Spanyol yang menginvasi wilayah Mapuche pada abad keenam belas. Kita harus mencoba meniru nama-nama seperti Caupolicán dan Lautaro jika kita ingin menyingkirkan imperialis Eropa dari benua kita."
 CHL_union_of_american_indigenous_peoples: "Persatuan Masyarakat Adat Amerika"
 CHL_union_of_american_indigenous_peoples_desc: "Ada banyak orang di seluruh dunia yang menjadi sasaran dan tersiksa secara paksa oleh Imperialisme Eropa. Sudah saatnya kita berupaya menyatukan masyarakat Amerindian, Inuit, dan Polinesia di bawah satu bendera, untuk melawan para penjajah yang tidak bermoral ini!"
 CHL_union_of_american_indigenous_peoples_tt: "Membuka §YQuintín Lame§! sebagai §YUmum§!"
 CHL_crusade_against_imperialism: "Perang Salib Melawan Imperialisme"
 CHL_crusade_against_imperialism_desc: "Akhirnya tiba saatnya kita siap menghadapi dunia yang lebih luas atas nama keadilan! Sudah saatnya kita menunjukkan kepada negara-negara Eropa yang dekaden bahwa kita tidak akan berbohong lagi demi mereka. Untuk mempersenjatai manusia, untuk kali ini, kami akan melakukan perlawanan terhadap mereka!"
 CHL_unified_by_will: "Disatukan oleh Kehendak"
 CHL_unified_by_will_desc: "Rakyat Amerindian dan Polinesia kini telah dipersatukan oleh upaya Anti-Imperialis kami, namun itu tidak cukup. Jika kita ingin mencegah invasi bangsa Eropa selama berabad-abad yang akan datang, kita harus bersatu dan membentuk satu bangsa, untuk semua bangsa kita, bersatu menjadi satu, dengan keinginan kita untuk memiliki negara yang tidak diperintah oleh orang Eropa."
 CHL_unified_in_spirit: "Bersatu dalam Roh"
 CHL_unified_in_spirit_desc: "Karena kita semua memiliki tujuan yang sama, kita dapat bekerja sama dengan baik, seperti peralatan yang diminyaki dengan baik. Oleh karena itu, perlu disebutkan bahwa kita harus, meskipun tidak menggabungkan negara-negara kita menjadi satu, tetap mengupayakan gabungan militer dan koordinasi yang lebih besar. Masyarakat Amerika dan Pasifik bersatu dalam semangat, dan akan selalu berdiri berdampingan!"
 CHL_taking_back_patagonia_kingdom: "Menyatukan kembali Kerajaan"
 CHL_taking_back_patagonia_kingdom_desc: "Meski sudah memproklamirkan diri sebagai Kerajaan baru Araucanía dan Patagonia, nyatanya kita masih kekurangan sebagian besar kerajaan yaitu Patagonia. Kita harus berusaha untuk menyatukan kembali dunia ini sesegera mungkin, jangan sampai kita kehilangan sedikit legitimasi yang kita miliki."
 CHL_taking_back_patagonia_mapuche: "Pulihkan Puelmapu"
 CHL_taking_back_patagonia_mapuche_desc: "Wilayah lama Mapuche di Puelmapu, yang merupakan sebagian besar wilayah Patagonia Argentina saat ini, masih berada di bawah penindasan asing, dan kita tidak dapat membebaskan Masyarakat Amerindian lainnya sampai kita berhasil membebaskan masyarakat kita sendiri terlebih dahulu. Oleh karena itu, karena tidak ada jalan lain, kita harus berperang...."
 CHL_ibanez_as_prime_minister_tt: "Mempekerjakan §YCarlos Ibáñez del Campo§! sebagai penasihat"
 CHL_return_to_the_parliamentary_era_tt: "Mempekerjakan §YMiguel Cruchaga Tocornal§! sebagai penasihat"
 CHL_je_suis_le_deluge_tt: "§YAntoine III§! memperoleh sifat §YKaisar Sejati Perancis dan Amerika§!"
 CHL_the_straight_line_tt: "Línea Recta akan melakukan kudeta §YAntoine III§! dan menyerahkan kerajaan kepada §YCarlos Ibáñez del Campo§!"
 CHL_satellite_kingdoms_tt: "Membuka Keputusan untuk §YMendirikan Kerajaan Satelit§!, yang akan memiliki opsi untuk mendirikan §Y[INC.GetNameDef]§!, §Y[SUR.GetName]§!, atau §Y[HAI.GetName]§! sebagai boneka jika kita mengontrol wilayah bersejarah mereka."
 CHL_rule_by_decree: "Aturan dengan Keputusan"
 CHL_rule_by_decree_desc: "Selama masa kepresidenannya yang pertama, dari tahun 1927 hingga 1931, Ibáñez memerintah melalui dekrit, menjalankan kekuasaan diktator. Kini, dia harus melakukan hal tersebut sekali lagi untuk mengarahkan negaranya ke arah yang benar."
 CHL_strengthen_the_carabinieros: "Perkuat Carabineros de Chile"
 CHL_strengthen_the_carabinieros_desc: "Carabineros de Chile pertama kali didirikan pada tahun 1927 oleh Ibáñez sendiri, dan sebagian besar organisasi masih sangat loyal kepadanya. Oleh karena itu, ada baiknya untuk memastikan bahwa orang-orang yang setia adalah mereka yang mempunyai kekuasaan dalam organisasi."
 CHL_seek_foreign_investments: "Mencari Investasi Asing"
 CHL_seek_foreign_investments_desc: "Ini adalah metode yang teruji dan benar bagi Ibáñez untuk membantu dan membangun kembali industri nasional dengan menggunakan dana pinjaman dari kekuatan asing, dan kali ini pun demikian."
 CHL_increase_spending_on_public_works: "Meningkatkan Belanja pada Pekerjaan Umum"
 CHL_increase_spending_on_public_works_desc: "Jika ada satu hal yang dibuktikan Alessandri selama masa kepresidenannya, pekerjaan umum adalah cara yang bagus untuk meremajakan perekonomian."
 CHL_alianza_popular_libertadora_as_a_vanguard: "Alianza Libertadora Populer"
 CHL_alianza_popular_libertadora_as_a_vanguard_desc: "Karena sulit untuk memerintah sendirian, akan lebih bijaksana jika membentuk pemerintahan koalisi dengan penasihat dari berbagai partai politik sayap kanan untuk mengemukakan pendapat mereka."
 CHL_utilize_national_populism: "Memanfaatkan Populisme Nasional"
 CHL_utilize_national_populism_desc: "Masyarakatnya mudah tertipu, dan apa pun yang menjanjikan mereka tanah, kekayaan, atau kejayaan, tidak peduli seberapa kosongnya, akan membuat mereka memihak Anda, meskipun dukungan mereka tidak menentu."
 CHL_outlaw_socialism: "Sosialisme Penjahat"
 CHL_outlaw_socialism_desc: "Ada banyak orang yang menentang kediktatoran Ibáñez, namun tidak ada yang sekuat kaum sosialis. Oleh karena itu, kita harus segera menyingkirkan mereka dari negara ini."
 CHL_sell_arica_to_peru: "Jual Arica ke Peru"
 CHL_sell_arica_to_peru_desc: "Salah satu cara terbaik untuk mendapatkan aliran dana dalam jumlah besar guna membantu memecahkan masalah ekonomi adalah dengan menjual kembali sebagian tanah yang direbut dari Peru dan Bolivia selama Perang Pasifik."
 CHL_sell_arica_to_peru_civil_war_tt: "§RMenyelesaikan fokus ini dan salah satu dari $CHL_outlaw_socialism$ atau $CHL_utilize_national_populism$ akan menyebabkan perang saudara.§!"
 CHL_sell_arica_to_peru_civil_war_tt_2: "§RMenyelesaikan fokus ini dan $CHL_sell_arica_to_peru$ akan menyebabkan perang saudara§!"
 CHL_crown_antoine_as_sovereign_king: "Mahkota Antoine sebagai Raja Berdaulat"
 CHL_crown_antoine_as_sovereign_king_desc: "Jacques Antoine Bernard telah kembali ke sini dari Perancis dengan bantuan untuk pemerintah kita selama perang saudara, dengan konsekuensi kita harus memberinya kekuasaan dan memberinya gelar Raja Berdaulat Araucanía dan Patagonia. Apa yang mungkin salah?"
 CHL_strike_a_deal_with_the_mapuche: "Buat Kesepakatan dengan Mapuche"
 CHL_strike_a_deal_with_the_mapuche_desc: "Mapuche-lah yang pada suatu waktu memungkinkan Orélie-Antoine I menjadi raja pertama Araucanía dan Patagonia, dan melalui ikatan kita dengan mereka maka kita bisa mendapatkan organisasi Mapuche baru di pihak kita."
 CHL_request_assistance_in_the_war: "Minta Bantuan dalam Perang"
 CHL_request_assistance_in_the_war_desc: "Ada banyak negara di dunia yang akan mendapat manfaat dari pemerintahan ramah Eropa lainnya. Kita harus mencari dukungan mereka dalam mengalahkan musuh-musuh pemerintah kita."
 CHL_request_assistance_in_the_war_tt: "Jika diterima, maka negara tersebut akan dapat mengirimkan sukarelawan kepada kami selama perang saudara, dan akan lebih cenderung untuk melakukannya."
 CHL_mobilize_the_veteran_legionaries: "Memobilisasi Legiun Veteran"
 CHL_mobilize_the_veteran_legionaries_desc: "Legiun Asing Prancis yang dibawa oleh Raja Antoine III untuk melatih dan membantu memobilisasi pasukan baru kini sangat dibutuhkan di garis depan, dan perekrutan mereka ke dalam pasukan standar harus dipertimbangkan secara serius."
 CHL_establish_a_royal_guard: "Bentuk Pengawal Kerajaan"
 CHL_establish_a_royal_guard_desc: "Tidak ada raja yang lengkap tanpa sejumlah besar pelayan dan pengawal di sisinya, dan sayangnya bagi Antoine III, ia kekurangan hal tersebut. Oleh karena itu, pembentukan unit pengawal kerajaan secepat mungkin harus dianggap sebagai prioritas tertinggi."
 CHL_attract_additional_french_investments: "Menarik Investasi Tambahan Perancis"
 CHL_attract_additional_french_investments_desc: "Para pengusaha dan industrialis Perancis yang awalnya mencium peluang besar dalam ekspedisi Antoine ke Chili, kini terkesan dengan prestasi besarnya, dan dengan mudah diyakinkan untuk memberikan lebih banyak bantuan dengan janji lahan di masa depan."
 CHL_invite_french_aristocracy: "Undang Aristokrasi Prancis"
 CHL_invite_french_aristocracy_desc: "Untuk mengatasi permasalahan dalam negeri terkait Sistem Hacienda dan Inquilinaje, kita harus menghadirkan aristokrasi Perancis yang baru dan menata ulang cara kerja kaum bangsawan di negara tersebut."
 CHL_ibanez_as_prime_minister: "Ibáñez sebagai Perdana Menteri"
 CHL_ibanez_as_prime_minister_desc: "Tidak ada keraguan bahwa Antoine III tidak dapat memerintah sepenuhnya sendirian, karena ia tidak memiliki kenegarawanan dan pengetahuan seperti yang dimiliki Ibáñez. Oleh karena itu, monarki harus bersifat konstitusional."
 CHL_no_deluges_tt: "Ini akan §RBlock§! Anda tidak dapat mengambil fokus §YJe Suis Le Deluge§! nanti di pohon"
 CHL_an_absolute_monarchy: "Monarki Absolut"
 CHL_an_absolute_monarchy_desc: "Ada banyak hal yang harus dilakukan, dan satu-satunya yang mampu mengambil kendali dan mengarahkan negara adalah raja. Oleh karena itu, sangat penting untuk memberi tahu kabinet bahwa mereka semua boleh pulang, karena mereka tidak diperlukan."
 CHL_an_absolute_monarchy_tt: "Ini akan §RMemblokir§! Anda tidak dapat mengambil fokus §YMenginjak Garis Lurus§! nanti di pohon"
 CHL_approach_the_moderates: "Dekati kelompok Moderat"
 CHL_approach_the_moderates_desc: "Meskipun mereka tidak menyukai monarki, ada banyak orang di negara ini yang setidaknya akan mengikuti Ibáñez jika dia menyuruh mereka melakukan hal tersebut, dan itulah yang harus dia lakukan."
 CHL_introduce_the_franc: "Perkenalkan Franc"
 CHL_introduce_the_franc_desc: "Peso Chili lemah dan gagal, serta dikaitkan dengan negara Chili lama. Kita harus berusaha keras untuk memperkenalkan Franc untuk menggantikan mata uang ini, demi kebaikan bangsa."
 CHL_strengthen_control: "Perkuat Kontrol"
 CHL_strengthen_control_desc: "Kita harus merebut kembali kendali atas provinsi-provinsi dari para pemberontak yang berpikiran lemah yang tidak dapat melihat kenyataan apa adanya, berjuang melawan rezim besar Antoine."
 CHL_invite_carlist_refugees: "Undang Pengungsi Carlist"
 CHL_invite_carlist_refugees_desc: "Kaum Carlist di Spanyol dekat dengan kita, sebagai sesama penikmat monarki. Melihat mereka diusir dari rumahnya, kita bisa mendapatkan bantuan mereka dengan menawarkan mereka perlindungan di sini."
 CHL_expand_the_officer_corps: "Perluas Korps Perwira"
 CHL_expand_the_officer_corps_desc: "Ada banyak perwira yang setia pada tujuan fasis atau sosialis, dan kemudian meninggalkan dinas kami. Kita harus memperluas korps perwira dan meningkatkan perwira muda untuk mengatasi kekurangan baru ini."
 CHL_the_scouts_monarchist_youth_organization: "Pramuka Kerajaan"
 CHL_the_scouts_monarchist_youth_organization_desc: "Kita harus mendirikan organisasi paramiliter yang dapat mengajari generasi muda bagaimana melakukan tugas masa perang mereka jika diperlukan, dan yang dapat mengajari rakyat kita cara bertahan hidup dan berperang."
 CHL_state_catholicism: "Katolik Negara"
 CHL_state_catholicism_desc: "Pemerintahan liberal lama memisahkan gereja Katolik dari negara, sesuatu yang sekarang kita anggap sebagai dosa besar. Kita harus segera memperbaiki kesalahan besar ini!"
 CHL_invite_french_academia: "Undang Akademisi Perancis"
 CHL_invite_french_academia_desc: "Agar masyarakat negara kita dapat belajar dan mencapai hal-hal besar, dan agar negara kita mencapai terobosan yang dibutuhkan untuk bersaing di panggung global, kita harus mengundang Akademisi Perancis dari daratan untuk membantu mendidik dan berorganisasi."
 CHL_a_new_araucanian_noble_class: "Kelas Bangsawan Araucanian Baru"
 CHL_a_new_araucanian_noble_class_desc: "Meskipun kita sekarang mempunyai banyak bangsawan, kita harus membuat program bagi masyarakat untuk menjadi bangsawan negara dengan imbalan investasi ke negara, atau pengabdian atas nama raja."
 CHL_establish_the_royal_mountaineers: "Bentuklah Royal Mountaineers"
 CHL_establish_the_royal_mountaineers_desc: "Andes bagian selatan adalah ciri khas negara ini, dan para pendaki gunung di negara kita adalah kekuatan elit yang menjadi fondasi negara kita. Kita harus memperluas organisasi ini, dan memastikan mereka mendapatkan semua peralatan yang mungkin mereka perlukan."
 CHL_an_imperial_capital: "Ibukota Kekaisaran"
 CHL_an_imperial_capital_desc: "Saat ini, ibu kota kami adalah Santiago, kota yang sama dengan ibu kota negara bagian Chile yang lama. Setidaknya harus dipertimbangkan apakah yang terbaik adalah memindahkan ibu kota ke lokasi lain."
 CHL_an_imperial_capital_tt: "Kami akan mendapatkan opsi untuk mempertahankan §YSantiago§! sebagai modal kami dan menambahkan §G2§! Slot bangunan atau memindahkannya ke §YTemuco§! dan menambahkan §G4§! slot bangunan."
 CHL_satellite_kingdoms: "Kerajaan Satelit"
 CHL_satellite_kingdoms_desc: "Napoleon Agung adalah inspirasi besar bagi Antoine, dan doktrin-doktrinnya menjadi inspirasi bagi semua negarawan di dunia. Kita harus melakukan apa yang dia lakukan, dan menciptakan negara penyangga yang lebih kecil yang memungkinkan masyarakat lokal untuk tidak terlalu memikirkan tuan baru mereka."
 CHL_secure_the_brazilian_border: "Amankan Perbatasan Brasil"
 CHL_secure_the_brazilian_border_desc: "Negara bagian Brazil adalah salah satu dari sedikit negara di benua ini yang mampu bersaing dengan kita. Kita harus mengamankan perbatasan kita dengan mereka, sehingga serangan dapat dilakukan dengan mudah ketika waktunya tepat."
 CHL_a_new_empire_of_brazil: "Kekaisaran Baru Brasil"
 CHL_a_new_empire_of_brazil_desc: "Kami akan meletakkan Brasil di bawah kami, dan menciptakan Kekaisaran Brasil baru, yang diperintah oleh raja baru, yang bukan berasal dari Portugis!"
 CHL_ruler_of_the_inca: "Penguasa Inca"
 CHL_ruler_of_the_inca_desc: "Kerajaan Inca kuno sangat besar dan tersebar di sebagian besar wilayah Andes. Kita harus menciptakan kembali keadaan ini, tapi di bawah manajemen baru, manajemen kita."
 CHL_a_french_alliance: "Satukan orang-orang Francofon"
 CHL_a_french_alliance_desc: "Ketika teman-teman monarki kita di Perancis telah mengambil alih kekuasaan, akan menjadi bijaksana untuk mencari aliansi dengan mereka, karena mereka memiliki niat dan tujuan yang sama seperti kita, serta warisan dan bahasa yang sama. Bersama-sama, kita tidak dapat dihentikan."
 CHL_return_to_the_continent: "Kembali ke Benua"
 CHL_return_to_the_continent_desc: "Ada kelemahan yang melekat pada sistem Perancis saat ini, dan kami berada di sini untuk mengeksploitasinya. Ini saatnya untuk kembali ke benua ini sekali lagi, dan mendapatkan kembali hak kesulungan kita!"
 CHL_joint_invasion_of_mexico: "Invasi Bersama ke Meksiko"
 CHL_joint_invasion_of_mexico_desc: "Sekarang kita telah mendapatkan aliansi dengan Kekaisaran Perancis yang baru, sekarang saatnya untuk menghidupkan kembali apa yang pernah gagal kita lakukan. Kekaisaran Meksiko harus bangkit kembali, atau kita semua akan jatuh melawan kekuatan Amerika!"
 CHL_claim_the_mexican_throne: "Klaim Tahta Meksiko"
 CHL_claim_the_mexican_throne_desc: "Tahta Meksiko pernah menjadi milik seorang kaisar Perancis, betapapun singkatnya masa itu. Kita harus memanfaatkan fakta ini dan mengklaim bahwa kita adalah keturunan mereka, siap untuk merebut kembali negara ini dalam waktu dekat."
 CHL_the_straight_line: "Menapaki Garis Lurus"
 CHL_the_straight_line_desc: "Antoine III yang gila pernah menjadi sorotan. Sudah waktunya bagi Garis Lurus untuk memulihkan ketertiban di tanah air, dan menobatkan Ibáñez sebagai raja baru Negara Bagian Chili."
 CHL_je_suis_le_deluge: "Je Suis Le Banjir"
 CHL_je_suis_le_deluge_desc: "Dahulu kala, mereka berkata bahwa suatu saat banjir akan datang, dan itulah saatnya sekarang. Kitalah banjirnya, orang-orang yang akan menghancurkan tatanan dunia yang dekaden, dan membawa era baru!"
 CHL_offer_to_protect_pitcairn: "Tawarkan untuk Melindungi Pulau Pitcairn"
 CHL_offer_to_protect_pitcairn_desc: "Pertahanan [270.GetName] saat ini lebih lemah dari yang kita harapkan, dan membuka peluang bagi musuh kita untuk menangkap dan menggunakannya sebagai markas persiapan untuk menyerang Pulau Paskah dan bahkan jantung wilayah kita. Kita harus menawarkan diri untuk melindungi pulau itu, demi keselamatan kita sendiri."
 CHL_a_grand_armada: "Armada Besar"
 CHL_a_grand_armada_desc: "Sama seperti Kekaisaran Besar Spanyol di masa lalu, tempat kita diciptakan, Carlos Ibáñez del Campo menginginkan armada besar, yang cukup kuat untuk menantang angkatan laut kerajaan Inggris, Amerika, dan armada laut lepas Jerman sekaligus, dan biarkan saja!"
 CHL_reclaiming_quebec: "Merebut kembali Québec"
 CHL_reclaiming_quebec_desc: "Saudara-saudara kita yang berbahasa Perancis di Québec perlu dibebaskan dari cengkeraman penindasan dan pendudukan asing, dan harus dihargai sebagai saudara kita yang berperang melawan hegemoni berbahasa Inggris di dunia. Kita harus membebaskan mereka sekarang!"
 CHL_reclaiming_quebec_tt: "Membuka Keputusan: §YIntegrasikan Québec§!"
 CHL_work_on_the_pan_american_highway: "Bekerja di Jalan Raya Pan-Amerika"
 CHL_work_on_the_pan_american_highway_desc: "Selama berbagai konferensi Pan-Amerika yang diadakan beberapa tahun terakhir, kami telah sepakat untuk bekerja sama dengan saudara-saudara kita di Amerika Utara dan Selatan untuk membantu menghubungkan dua benua Amerika dan memenuhi proyek jalan raya Pan-Amerika ini."
 working_on_the_pan_american_highway: "Memulai Pekerjaan di Jalan Raya Pan-Amerika"
 #### Brazil ####
 BRA_defense_spending: "Meningkatkan Belanja Pertahanan"
 BRA_defense_spending_desc: "Dunia telah terbakar, dan tidak ada satu negara pun yang dapat lagi menganggap diri mereka aman. Oleh karena itu, kita harus meningkatkan pengeluaran kita untuk pertahanan negara. Baik itu pabrik yang memproduksi senjata kami, atau pembangunan benteng baru, kami akan mengamankan kedaulatan Brasil meskipun itu adalah hal terakhir yang kami lakukan!"
 BRA_natal_naval_base: "Membangun Bandara Parnamirim"
 BRA_natal_naval_base_desc: "Berkat kerja sama baru kami dengan AS, mereka telah menawarkan pembangunan pangkalan udara di negara kami dengan sebagian besar menggunakan dana mereka sendiri, sebagai imbalannya kami mengizinkan penggunaan bandara tersebut untuk Angkatan Laut AS, Angkatan Darat AS, serta RAF, untuk terbang antara Amerika Selatan dan Afrika Barat."
 natal_airbase_modifier: "Izinkan kami menggunakan Bandara Parnamirim"
 BRA_no_fascism_in_south_america: "Tidak Ada Fasisme di Amerika Selatan"
 BRA_no_fascism_in_south_america_desc: "Dengan sikap kita yang terang-terangan menentang fasisme, inilah saat yang tepat untuk mengambil tindakan atas bahaya yang ada saat ini, dan mengamankan benua kita dari ideologi keji tersebut. Tidak, [BRA.GetNameDef] bukan koloni Anda!"
 BRA_no_fascism_in_south_america_tt: "Dapatkan §Y$puppet_wargoal_focus$§! tujuan perang di semua negara §YFasis§! di §YAmerika Selatan§!"
 BRA_no_communism_in_south_america_tt: "Dapatkan §Y$puppet_wargoal_focus$§! tujuan perang di semua negara §YKomunis§! di §YAmerika Selatan§!"
 BRA_anti_democracy_in_south_america_tt: "Dapatkan §Y$puppet_wargoal_focus$§! tujuan perang di seluruh negara §YDemokrat dan Non-Blok§! di §YAmerika Selatan§!"
 BRA_tribunal_de_seguranca_nacional: "Pengadilan Keamanan Nasional"
 BRA_tribunal_de_seguranca_nacional_desc: "Meskipun Aliansi Pembebasan Nasional gagal menggulingkan pemerintahan kita, para anggotanya terus turun ke jalan, merencanakan dan merekrut orang-orang untuk mendapatkan kesempatan lain untuk melemahkan negara. Penjahat seperti ini akan diadili dan dijatuhi hukuman secara lebih efisien dengan dibentuknya pengadilan militer selama masa keadaan darurat."
 BRA_ensure_continued_military_support: "Pastikan Dukungan Militer"
 BRA_ensure_continued_military_support_desc: "Mempertahankan dukungan militer sangat penting untuk kelangsungan rezim kita. Dengan sedikit janji antara negara dan para pejabat tinggi, tentu saja janji-janji itu bisa tercapai demi tujuan kita."
 BRA_work_with_the_integralists: "Bekerja Dengan Integralis"
 BRA_work_with_the_integralists_desc: "Tujuan gerakan Integralis sebagian besar sejalan dengan tujuan kita, oleh karena itu mungkin bijaksana untuk mendapatkan dukungan mereka guna memperkuat rezim kita melawan pemberontakan komunis lebih lanjut. Dengan kekuatan paramiliter dan nasionalisme yang mengakar, mereka akan menjadi garda depan kontra-revolusi."
 BRA_estado_moderno: "Stadion Moderno"
 BRA_estado_novo_desc: "Setelah bertahun-tahun berada di ambang perang saudara, kita akhirnya dapat menerobos kebuntuan politik selama bertahun-tahun dan membangun negara baru berdasarkan perdamaian, keadilan, dan kerja. Sementara itu, kami akan terus membasmi pihak-pihak yang menentang peraturan baru ini sebelum mereka menyebarkan lebih banyak perbedaan pendapat."
 BRA_estado_moderno_tt: "§Y$BRA_getulio_vargas$§! menjadi pemimpin §Y$BRA_fascism_party_long$§!"
 BRA_estado_moderno_tt_desc: ""
 BRA_estado_novo: "Stadion Baru"
 BRA_estado_moderno_desc: "Dengan tercerai-berai dan dikalahkannya musuh-musuh dalam negeri kita, sudah tiba waktunya untuk menghapus tatanan politik lama dan mendeklarasikan sebuah negara modern, yang mampu menjamin perdamaian dan stabilitas jangka panjang bagi rakyat [BRA.GetName]."
 BRA_cohen_plan: "Rencana Cohen"
 BRA_cohen_plan_desc: "Dengan semakin dekatnya pemilu dan berkurangnya dukungan kita di kalangan pemilih, kita perlu memastikan kelangsungan rezim kita dengan cara lain. Dengan menyusun rencana untuk melakukan kudeta komunis lagi, kita dapat menghidupkan kembali dukungan untuk diri kita sendiri sambil menunda pemilu demi keamanan nasional."
 BRA_cohen_plan_tt: "Membuka misi §Y$BRA_execute_the_cohen_plan$§! yang harus diselesaikan dalam waktu 100 hari setelah menyelesaikan fokus ini. Menyelesaikan misi memerlukan menyelesaikan fokus §Y$BRA_estado_novo$§! atau §Y$BRA_estado_moderno$§!. §RKegagalan menyelesaikan misi akan mengakibatkan kudeta!§!"
 BRA_the_polaca: "Polaca"
 BRA_the_polaca_desc: "Meskipun hanya ada sedikit orang yang mempunyai kapasitas untuk memberikan ancaman serius terhadap rezim kita, hal ini akan meningkatkan legitimasi kita jika kita menyusun konstitusi baru yang menguraikan kekuasaan presiden. Mungkin kita bisa melihat konstitusi Polandia yang baru saja disahkan sebagai inspirasi."
 BRA_anaue: "Anauê!"
 BRA_anaue_desc: "Gerakan kami mengadopsi ungkapan masyarakat Tupi, 'Anauê', sebagai seruan perang. Ungkapan ini merangkum persaudaraan para anggota dan kesetiaan mereka yang teguh terhadap perlindungan negara kita. Anauê!"
 BRA_anaue_tt: "Buka keputusan untuk merekrut divisi milisi Integralis di negara bagian setelah menyelesaikan demonstrasi di sana.\nMerekrut jenderal baru dengan sifat §Y$militias_officer$§!:\nPertahanan Milisi §G+5%§!\nKecepatan Milisi §G+5%§!\nOrganisasi Milisi §G+5%§!"
 BRA_autarky: "Autarki Brasil"
 BRA_autarky_desc: "Gejolak ekonomi setelah Wall Street Crash melanda seluruh dunia dan menghancurkan perekonomian kita. Mulai dari konsumsi kopi hingga produksi baja, kita harus mandiri dalam segala hal dan melindungi diri dari krisis luar negeri di masa depan."
 BRA_corporatism: "Rangkullah Korporatisme"
 BRA_corporatism_desc: "Perselisihan antara buruh dan kapitalis telah terlalu lama melemahkan perekonomian [BRA.GetAdjective]. Untuk mengatasi hal ini, kita akan menerapkan model ekonomi baru berdasarkan kebijakan korporatis yang terlihat di banyak negara Eropa yang lebih sukses dalam beberapa tahun terakhir."
 BRA_departamendo_de_propaganda: "Departemen Propaganda"
 BRA_departamendo_de_propaganda_desc: "Gejolak politik yang terjadi dalam satu dekade terakhir menunjukkan dengan jelas apa yang bisa terjadi jika pandangan pemerintah dan masyarakat tidak sejalan. Untuk mencegah kekacauan lebih lanjut, kami akan membentuk departemen propaganda untuk mendorong masyarakat agar sejalan dengan kebijakan kami."
 BRA_departamento_de_ordem_politica_e_social: "Departemen Ordem Politik dan Sosial"
 BRA_departamento_de_ordem_politica_e_social_desc: "Propaganda dan pemaksaan tidak cukup untuk menghalangi kelompok radikal atau agen asing yang paling setia melakukan aktivitas yang merugikan negara. Oleh karena itu kita memerlukan pasukan polisi rahasia baru untuk menyelidiki ancaman semacam itu."
 BRA_collective_bargaining: "Perundingan Bersama"
 BRA_collective_bargaining_desc: ""
 BRA_cooperation_in_the_americas: "Kebijakan Tetangga yang Baik"
 BRA_cooperation_in_the_americas_desc: "‘Kebijakan tetangga yang baik’ Franklin Roosevelt tetap berpengaruh di belahan bumi Barat. Kita harus menerima kebijakan ini dan berusaha untuk bekerja sama dengan negara-negara di benua Amerika daripada ikut campur dalam urusan satu sama lain."
 BRA_tech_slot_1: "Universitas São Paulo"
 BRA_tech_slot_1_desc: "Universitas São Paulo baru saja didirikan, namun manfaatnya sudah dirasakan di seluruh perekonomian [BRA.GetAdjective]. Kita harus memanfaatkan hal ini dengan berinvestasi lebih banyak pada institusi yang sedang berkembang ini."
 BRA_reject_cosmopolitanism: "Tolak Kosmopolitanisme"
 BRA_reject_cosmopolitanism_desc: "Tren terkini menuju kosmopolitanisme tidak lebih dari kuda trojan bagi campur tangan komunis di negara besar kita. Kami [BRA.GetAdjective], dan kami harus mempertahankan budaya dan cita-cita kami sebelum dihancurkan."
 BRA_ban_political_parties: "Larang Partai Politik"
 BRA_ban_political_parties_desc: "Partai politik terbukti hanya sekedar alat perpecahan dan gangguan. Dengan melarang dan memberantas mereka, kita dapat membatasi kemampuan kelompok radikal untuk berorganisasi melawan kita."
 BRA_decree_no_37: "Surat Keputusan Nomor 37"
 BRA_decree_no_37_desc: "Rezim sebelumnya penuh dengan korupsi dan perselisihan dalam negeri karena beberapa negara mempunyai pengaruh yang tidak proporsional terhadap politik nasional. Oleh karena itu, kita harus menindak segala ekspresi regionalisme dan memusatkan kekuasaan pada pemerintahan nasional."
 BRA_establish_psad: "Membangun DASP"
 BRA_establish_psad_desc: "Mekanisme negara yang memungkinkan penerapan kebijakan pemerintah sudah ketinggalan zaman dan basi. Kami akan membentuk Departamento Administrativo do Serviço Público (DASP) untuk membantu kami mengatur negara secara lebih efektif dan menjaga efisiensi ekonomi."
 BRA_federal_employment_plan: "Rencana Ketenagakerjaan Federal"
 BRA_federal_employment_plan_desc: "Pengangguran massal akan menyebabkan berlanjutnya radikalisme dan kekerasan. Untuk mencegah hal ini, kita akan memperluas kesempatan kerja dengan menciptakan industri yang dikelola negara dan proyek infrastruktur baru."
 BRA_secure_our_borders: "Amankan Perbatasan Kita"
 BRA_secure_our_borders_desc: "Kita dikelilingi oleh musuh-musuh di luar perbatasan kita yang ingin mengisolasi dan menghancurkan negara besar kita. Dengan terkendalinya situasi dalam negeri, sudah saatnya kita mengalihkan perhatian ke luar negeri dan mulai melakukan manuver untuk menjamin keamanan nasional."
 BRA_ethical_internationalism: "Internasionalisme Etis"
 BRA_ethical_internationalism_desc: "Bahkan negara-negara terbesar sekalipun tidak dapat menciptakan dan menyediakan segala sesuatu untuk rakyatnya. Untuk menjamin perdamaian dan kemakmuran bagi rakyat kita, kita harus membangun kebijakan luar negeri kita berdasarkan kemitraan ekonomi yang saling menguntungkan dengan negara-negara yang berpikiran sama."
 BRA_brazil_integral: "Integral Brasil"
 BRA_brazil_integral_desc: "Butuh waktu bertahun-tahun untuk mencapai momen ini, namun kita akhirnya berhasil memperkuat cengkeraman kita pada negara ini dan melepaskan diri dari sisa-sisa cara-cara lama republik yang sudah bobrok."
 BRA_in_vargas_we_trust: "Di Vargas Kami Percaya"
 BRA_in_vargas_we_trust_desc: "$BRA_getulio_vargas$ telah membuktikan dirinya sebagai politisi yang mampu menghadapi badai kepemimpinan. Selain itu, ia telah membuktikan dirinya sebagai pemimpin yang bijaksana melalui penerapan kebijakan partai kami. Banyak orang di partai sekarang percaya bahwa dia ditakdirkan untuk mengangkat bangsa ini ke tingkat yang lebih tinggi."
 BRA_departamento_feminino: "Departemen Feminino"
 BRA_departamento_feminino_desc: "Ada banyak sekali wanita yang patriotik dan setia seperti suami dan ayah mereka. Kita harus memberi mereka kesempatan untuk mengambil bagian dalam gerakan kita dan bekerja sama untuk memulihkan kehebatan [BRA.GetAdjective]."
 BRA_integrity_of_the_fatherland: "Untuk Tanah Air"
 BRA_integrity_of_the_fatherland_desc: "$BRA_getulio_vargas$ telah menjadi sekutu politik yang berguna, namun ia hanya peduli pada kekuasaan dan bukan seorang Integralis sejati. Dengan dukungan kita yang luas di seluruh negeri, kita harus mengambil tindakan untuk menggulingkan Presiden dan mengangkat orang yang benar-benar beriman seperti $BRA_plinio_salgado$ ke dalam jabatan."
 BRA_no_communism_in_south_america: "Tidak Ada Komunisme di Amerika Selatan"
 BRA_no_communism_in_south_america_desc: "Kaum komunis tidak bisa dipercaya, seperti yang kita lihat pada upaya revolusi pada tahun 1935, yang sudah sewajarnya kita hentikan. Untuk menjamin masa depan bangsa kita, kita harus memastikan bahwa segala tindakan subversif asing di sekitar kita akan ditangani, secepatnya!"
 BRA_defense_of_the_fatherland: "Pertahanan Tanah Air"
 BRA_defense_of_the_fatherland_desc: "Ambisi kami jauh melampaui batas negara kami saat ini, namun meskipun demikian, kami harus benar-benar memastikan bahwa tidak ada seorang pun yang dapat mengancam wilayah asal kami. Hidup atau Brasil!"
 BRA_german_subs: "Program Pengembangan Kapal Selam Jerman"
 BRA_german_subs_desc: "Bersekutu dengan Jerman telah memungkinkan kami memanfaatkan teknologi mereka untuk departemen-departemen yang sebelumnya telah kami perjuangkan untuk memodernisasi diri, dan salah satu bidang tersebut adalah di bidang peperangan kapal selam. Kami akan memanfaatkan sekutu baru kami, dan mengendalikan Dataran Tanjung Verde!"
 BRA_german_sub_initiative: "Pertukaran Informasi Kapal Selam Jerman"
 BRA_german_tanks: "Dapatkan Tank Jerman"
 BRA_german_tanks_desc: "Berkat keberpihakan kita pada pihak Jerman, kini kita dapat lebih mudah memperoleh tidak hanya cetak biru dan detail penelitian dan pembuatan tank yang mirip dengan Panzer Jerman, namun kita juga dapat dengan mudah membeli kendaraan tersebut dari mereka. Kobra yang Membara akan menyebarkan ketakutan di hati musuh kita!"
 BRA_german_tanks_tt: "Dapatkan §Y200§! [GER.GetAdjective] §YPanzer IV Ausf. A - Tangki Sedang§!"
 BRA_German_tank_exchange: "Pertukaran Informasi Tank Jerman"
 BRA_italian_trucks: "Pengembangan Motor Bersama Italia"
 BRA_italian_trucks_desc: "Kita harus berupaya untuk tidak hanya memperoleh keahlian Italia dalam pengembangan dan pembuatan kendaraan bermotor yang canggih, namun kita juga harus melakukan pemesanan dan meminta pengiriman segera truk-truk Italia."
 BRA_italian_trucks_mio_tt: "Buka kunci §Y$ITA_fiat_organization$§! Organisasi Industri Militer."
 BRA_italian_air_mio_tt: "Buka kunci §Y$ITA_fiat_aviazione_organization$§! Organisasi Industri Militer."
 BRA_ford_mio_tt: "Buka kunci §Y$USA_ford_motor_company_organization$§! Organisasi Industri Militer."
 BRA_italian_truck_exchange: "Pertukaran Informasi Bermotor Italia"
 BRA_italian_aircraft: "Program Pengembangan Pesawat Italia"
 BRA_italian_aircraft_desc: "Bersekutu dengan Italia telah memungkinkan kami memanfaatkan teknologi mereka untuk departemen-departemen yang sebelumnya telah kami upayakan untuk memodernisasi diri, dan salah satu bidang tersebut adalah di bidang pesawat terbang. Dengan menggunakan teknologi Italia, kita akan menguasai langit Amerika Selatan!"
 BRA_Italian_plane_exchange: "Pertukaran Informasi Pesawat Italia"
 BRA_support_rural_folk: "Bapak Orang Miskin"
 BRA_support_rural_folk_desc: "[BRA.GetAdjective] yang tinggal di daerah pedesaan telah dilupakan oleh para politisi selama beberapa dekade. Dengan berinvestasi di bidang-bidang tersebut, kita dapat meningkatkan lapangan kerja dan infrastruktur sekaligus mendapatkan dukungan dari demografi yang besar."
 BRA_support_the_landowners: "Dukung Sugar Baron"
 BRA_support_the_landowners_desc: "Permintaan global terhadap gula terus meningkat selama beberapa dekade, yang menyebabkan sekelompok pemilik tanah kaya di [ROOT.GetNonIdeologyName] yang bercocok tanam dikenal sebagai ‘Sugar Barons.’ Kita harus berusaha memenangkan hati mereka dengan menghentikan seruan reformasi tanah di kalangan kaum tani."
 BRA_washington_accords: "Kesepakatan [USA.Capital.GetCapitalVictoryPointName]"
 BRA_washington_accords_desc: "Sebagai imbalan atas jaminan militer Amerika, kita akan mengarahkan perekonomian kita pada produksi peralatan perang untuk mendukung mereka dalam membela nilai-nilai bersama kita."
 BRA_washington_accords_tt: "Jika [USA.GetNameDef] menyetujui kesepakatan:"
 BRA_disrupt_operation_bolivar: "Ganggu Operasi Bolivar"
 BRA_disrupt_operation_bolivar_desc: "Negara-negara di dunia lama telah lama ikut campur dalam urusan Amerika Selatan. Dulu mereka mengirim tentara dan kapal tempur, sekarang mereka mengirim agen intelijen. Kita tidak bisa lagi menutup mata terhadap aktivitas-aktivitas tersebut dan harus memburu pelaku-pelaku tersebut di wilayah kita."
 BRA_potenji_river_conference: "Konferensi Sungai Potenji"
 BRA_potenji_river_conference_desc: "Dibutuhkan upaya besar untuk mempersiapkan perekonomian kita menghadapi perang, namun sudah tiba waktunya bagi kita untuk bergabung dengan sekutu [USA.GetAdjective] kita dan berkomitmen penuh terhadap pertahanan belahan bumi barat, bahkan jika hal itu memerlukan penanganan ancaman di seluruh dunia."
 BRA_potenji_river_conference_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap] akan bergabung dengan faksi yang sama dengan [USA.GetFlag][USA.GetNameDef]§! §RIni juga akan menyebabkan kami menyatakan perang terhadap musuh [USA.Getflag][USA.GetAdjective] saat ini!§!"
 BRA_smoking_cobras: "Kobra Fumantes"
 BRA_smoking_cobras_desc: "Banyak yang mengatakan bahwa kemungkinan besar ular akan menghisap pipa dibandingkan pasukan kita benar-benar mencapai garis depan. Kini musuh-musuh kita takut akan kegigihan dan keahlian para prajurit yang telah mengadopsi gelar tersebut sebagai lencana kehormatan."
 BRA_senta_a_pua: "Terima kasih!"
 BRA_senta_a_pua_desc: "Pilot-pilot kami sepertinya baru-baru ini mengembangkan seruan perang, yang memungkinkan mereka menyalurkan keganasan dan dedikasi mereka yang tak tertandingi menuju kemenangan ke dalam satu kalimat. Terima kasih!"
 BRA_reach_out_to_our_neighbors: "Jangkau Tetangga Kita"
 BRA_org_american_states_faction: "Organisasi Negara-negara Amerika"
 BRA_reach_out_to_our_neighbors_desc: "Kami telah lama terisolasi dari tetangga kami karena menjadi satu-satunya negara berbahasa Portugis di benua ini. Mungkin inilah saatnya kita menjangkau dan berusaha membangun hubungan yang lebih baik dengan mereka, daripada memperlakukan mereka dengan kecurigaan."
 BRA_rio_conference: "Protokol Rio"
 BRA_rio_conference_desc: "Konflik-konflik yang terjadi baru-baru ini telah memperburuk sengketa perbatasan yang sudah berlangsung lama di wilayah kita. Sebelum perselisihan ini semakin meningkat, negara-negara Amerika Selatan harus bersatu dan menyelesaikannya secara diplomatis."
 BRA_organization_of_american_unity: "Organisasi Negara-negara Amerika"
 BRA_organization_of_american_unity_desc: "Kebijakan dalam negeri kita telah berhasil dalam beberapa tahun terakhir, sekarang saatnya mengalihkan perhatian kita ke urusan luar negeri dan peningkatan kerja sama di seluruh belahan bumi melalui Organisasi Persatuan Amerika."
 BRA_organization_of_american_unity_tt: "Membuka keputusan §YUndang ke Organisasi Negara-negara Amerika§! untuk mengundang negara lain ke organisasi super-nasional."
 BRA_org_american_unity_warning_tt: "§RNegara-negara anggota organisasi akan diminta untuk membela negara lain yang diserang. Kegagalan membela anggota yang membutuhkan bantuan, atau menyatakan perang terhadap sesama anggota, akan mengakibatkan pengusiran dari organisasi!§!"
 BRA_financial_stimulation_tt: "Keputusan mengizinkan peningkatan §YKecepatan Konstruksi Lokal§!, §YPabrik Maksimum§! dan §YSumber Daya Lokal yang Tersedia§! di negara bagian pedesaan sebesar §G20%§!"
 BRA_coffee_crisis_aftermath: "Pasca Krisis Kopi"
 BRA_coffee_crisis_aftermath_desc: "Depresi Hebat menghancurkan perekonomian Brasil karena ketergantungan yang berlebihan pada ekspor, terutama kopi. Meskipun upaya telah dilakukan untuk memperbaiki perekonomian, kitalah yang harus menyelesaikannya. Kita akan memperkuat kembali industri kita dan menjadi kekuatan ekonomi di benua ini."
 BRA_radio_nacional: "Radio Nasional"
 BRA_radio_nacional_desc: "Banyak negara mulai mendirikan lembaga penyiaran nasional untuk menyediakan konten faktual dan hiburan kepada masyarakat melalui gelombang udara. Kita tidak boleh ketinggalan dalam upaya-upaya tersebut dengan mendirikan Radio Nacional kita sendiri."
 BRA_desenvolvimentismo: "Desenvolvemento"
 BRA_desenvolvimentismo_desc: "Jika kita ingin masyarakat kembali bekerja dan ekspor kembali mengalir, kita perlu memulai pertumbuhan ekonomi. Kami akan melakukannya dengan menciptakan industri baru dan memudahkan masyarakat mengakses layanan keuangan."
 BRA_promote_resource_extraction: "Mempromosikan Ekstraksi Sumber Daya"
 BRA_promote_resource_extraction_desc: "Bangsa kita diberkahi dengan sumber daya alam yang melimpah. Untuk mendorong pertumbuhan ekonomi dan kemandirian yang lebih besar, kami akan berinvestasi pada peralatan ekstraksi modern untuk industri kami."
 BRA_companhia_siderurgica_nacional: "Companhia Siderúrgica Nacional"
 BRA_companhia_siderurgica_nacional_desc: "Baja telah menjadi sumber daya penting di banyak industri, namun produksi domestik kita tidak cukup untuk memenuhi permintaan. Oleh karena itu, kita akan mendirikan perusahaan baja nasional milik negara dengan mesin yang mutakhir, daripada mengimpornya dari luar negeri."
 BRA_stimulate_the_civilian_economy: "Merangsang Perekonomian"
 BRA_stimulate_the_civilian_economy_desc: "Produksi barang-barang dalam negeri masih tidak mencukupi, menyebabkan uang mengalir ke luar negeri untuk membeli barang-barang impor. Kita harus membatasi hal ini dengan memperluas industri kita sendiri."
 BRA_domestic_arms_industry: "Industri Senjata Dalam Negeri"
 BRA_domestic_arms_industry_desc: "Situasi internasional tampak semakin tegang, yang menyebabkan negara-negara produsen senjata besar di dunia membatasi ekspor peralatan mereka. Kita perlu mengembangkan industri senjata kita sendiri dengan cepat jika kita ingin mempertahankan kekuatan militer kita secara penuh."
 BRA_war_production: "Produksi Perang"
 BRA_war_production_desc: "Api perang menyebar dengan cepat ke seluruh dunia. Jika mereka datang ke wilayah kita, kita harus bisa dengan cepat mengubah industri kita dari memproduksi mobil dan pemanggang roti, menjadi tank dan bom."
 BRA_deal_with_the_cangaceiro: "Berurusan dengan Cangaço"
 BRA_establish_trade_relationships: "$CHL_establish_trade_relationships$"
 BRA_establish_trade_relationships_desc: "$CHL_establish_trade_relationships_desc$"
 BRA_reach_out_to_the_great_powers: "$ARG_reach_out_to_the_great_powers$"
 BRA_reach_out_to_the_great_powers_desc: "$ARG_reach_out_to_the_great_powers_desc$"
 BRA_deal_with_the_cangaceiro_desc: "Cangaço tidak lebih dari bandit yang sudah terlalu lama menjadi duri di pihak kita. Sudah saatnya kita mengusir duri dari utara, untuk selamanya."
 BRA_deal_with_the_cangaceiro_tt: "Buka keputusan §Y$BRA_deal_with_the_cangaceiro$§! untuk menghilangkan Cangaço di negara bagian yang terkena dampak."
 BRA_consolidation_of_labor_laws: "Konsolidasi Undang-Undang Ketenagakerjaan"
 BRA_consolidation_of_labor_laws_desc: "Undang-undang ketenagakerjaan kita memberikan sedikit perlindungan bagi pekerja, yang pasti akan menimbulkan perselisihan dengan pemilik usaha dan akhirnya mogok kerja. Pada saat yang berbahaya ini, kita tidak mampu menanggung risiko infiltrasi Bolshevik. Oleh karena itu kami akan mengkonsolidasikan undang-undang kami dan menemukan keseimbangan antara buruh dan kapitalis."
 BRA_consolidation_of_labor_laws_fallback_tt: "Tergantung pada pilihan fokus sebelumnya, akan mengubah semangat nasional §Y$BRA_estado_novo_modifier$§! atau §Y$BRA_estado_moderno_modifier$§! dengan:"
 BRA_promote_immigration_to_brazil: "Promosikan Imigrasi"
 BRA_promote_immigration_to_brazil_desc: "[BRA.GetName] adalah negara yang beragam dengan orang-orang yang nenek moyangnya tersebar di seluruh dunia. Dengan perekonomian kita yang kembali bertumbuh dan melimpahnya sumber daya yang menunggu untuk dimanfaatkan, inilah saatnya kita mendorong lebih banyak orang untuk pindah ke sini dan menyebut diri mereka [BRA.GetAdjective] juga."
 BRA_promote_immigration_to_brazil_tt: "Membuka keputusan §Y$JUNO_promote_immigration_cat$§! untuk memperbaiki keadaan."
 BRA_pact_of_silence: "Pakta Diam"
 BRA_pact_of_silence_desc: "Bangsa-bangsa bangkit dan bangsa-bangsa jatuh. Dengan jatuhnya begitu banyak pulau-pulau tersebut akhir-akhir ini, terdapat banyak sekali ahli di segala bidang yang mencari pantai yang lebih aman untuk dijadikan rumah. Mungkin kita bisa menutup mata terhadap asal usul mereka selama kita bisa memetik manfaat dari keahlian mereka."
 BRA_national_petroleum_council: "Dewan Perminyakan Nasional"
 BRA_national_petroleum_council_desc: "Dari traktor di ladang hingga kapal perang yang mempertahankan pantai kita, minyak telah menjadi sumber kehidupan mesin-mesin modern. Ketergantungan pada sumber daya yang begitu penting merupakan ancaman terhadap keamanan nasional kita. Untuk mengurangi risiko ini, kita akan membentuk dewan perminyakan nasional untuk mengawasi penemuan dan ekstraksi minyak dalam negeri."
 BRA_batalha_do_borracha: "Batalha da Borracha"
 BRA_batalha_do_borracha_desc: "[BRA.GetNameDefCap] pernah mendominasi pasokan karet global, hingga [ENG.GetAdjective] mendirikan perkebunan besar di seluruh kerajaan mereka. Ketika jalur pasokan mereka terancam, dunia sekali lagi bergantung pada kita untuk memasok mereka dengan sumber daya yang berharga."
 BRA_establish_companhia_vale_do_rio_doce: "Companhia Vale do Rio Doce"
 BRA_establish_companhia_vale_do_rio_doce_desc: "Urat bijih besi berukuran besar dan berbagai deposit mineral kaya lainnya telah ditemukan di Minas Gerais, khususnya di wilayah Itabira. Kita harus memastikan negara dapat mengeksploitasi sumber daya ini dan mengembangkan simpanan tersebut, dengan mendirikan perusahaan baru dengan tujuan utama."
 BRA_invest_in_road_infrastructure: "Berinvestasi dalam infrastruktur Jalan"
 BRA_invest_in_road_infrastructure_desc: "Mobil dan truk menjadi semakin penting bagi pembangunan ekonomi. Namun, jaringan jalan raya kita belum cukup berkembang untuk mendukung penggunaan kendaraan secara massal dalam skala nasional. Oleh karena itu, kita perlu berinvestasi dalam program pembangunan jalan raya besar-besaran sebelum perekonomian kita terhambat."
 BRA_invest_in_railways: "Berinvestasi di Kereta Api"
 BRA_invest_in_railways_desc: "Kereta api tetap menjadi metode transportasi massal orang dan barang yang paling ekonomis dalam jarak jauh. Oleh karena itu, kita harus berinvestasi dalam memperluas dan memodernisasi jaringan kereta api kita, serta mengembangkan kereta api kita sendiri."
 BRA_invest_in_ports: "Berinvestasi di Pelabuhan"
 BRA_invest_in_ports_desc: "Kita telah mencapai kemajuan besar dalam memenuhi kebutuhan perekonomian dalam negeri sehingga kita dapat kembali mengandalkan ekspor sebagai sarana untuk mendorong pertumbuhan ekonomi. Untuk melakukan hal ini, kita perlu berinvestasi di pelabuhan-pelabuhan utama negara ini."
 BRA_fabrica_nacional_de_motores: "Fabrika Nacional de Motores"
 BRA_fabrica_nacional_de_motores_desc: "Kendaraan bermotor adalah mesin yang rumit sehingga memerlukan biaya impor yang besar. Hal ini berpotensi menghambat pertumbuhan ekonomi kita dalam jangka panjang. Cara terbaik untuk mencegah hal ini adalah dengan mengembangkan kendaraan produksi dalam negeri sendiri."
 BRA_expand_fordlandia: "Perluas Fordlandia"
 BRA_expand_fordlandia_desc: "Ford Motor Company berinvestasi dalam membangun pemukiman di Amazon yang dapat berfungsi sebagai basis industri untuk produksi karet. Proyek ini terhenti dalam beberapa tahun terakhir karena gejolak ekonomi, namun mungkin sekarang adalah waktu yang tepat untuk memulai kembali proyek tersebut."
 BRA_fordlandia_name: "Fordlandia"
 BRA_banco_do_brasil: "Banco do Brasil"
 BRA_banco_do_brasil_desc: "Manfaat bank sentral dalam menerbitkan dan mengendalikan pasokan mata uang bagi perekonomian telah terlihat jelas sejak terjadinya depresi besar. Banco do Brazil telah bertindak seperti itu sejak lama, namun sudah saatnya kita meresmikan pengaturan tersebut."
 BRA_federal_development: "[BRA_federal_development_key]"
 BRA_imperial_development_key: "Perkembangan Kekaisaran"
 BRA_wealth_redistribution_key: "Redistribusi Kekayaan"
 BRA_land_reform_key: "Reformasi Pertanahan"
 BRA_federal_development_key: "Pembangunan Federal"
 BRA_federal_development_desc: "Pembangunan ekonomi harus disebarluaskan ke seluruh penjuru negeri sehingga semua orang dapat memperoleh manfaat dari kerja keras mereka. Oleh karena itu, kita perlu melakukan diversifikasi tidak hanya pada komoditas industri kita, namun juga lokasinya."
 BRA_centralize_development: "Mendirikan Ibu Kota Baru"
 BRA_centralize_development_desc: "Ibu kota kita saat ini terlalu jauh dari daerah-daerah terpencil di negara ini dan hal ini menimbulkan kebencian dan separatisme. Untuk mendapatkan yang terbaik dari kedua hal tersebut, kita akan membangun ibu kota baru di jantung negara, yang lebih mudah diakses oleh semua orang."
 BRA_new_capital: "Brasilia"
 BRA_centralize_development_tt: "Ibu kota baru akan diberi nama §Y'$BRA_new_capital$'§!"
 BRA_financial_stimulation: "Stimulasi Keuangan"
 BRA_financial_stimulation_desc: "Kami telah meletakkan fondasi perekonomian yang kuat dalam beberapa tahun terakhir dengan pendirian industri baru dan proyek infrastruktur. Untuk mempertahankan pertumbuhan, kita hanya perlu menarik pengaruh bank sentral dan industri nasional."
 BRA_resource_extraction_bonus: "Bonus Ekstraksi Sumber Daya"
 BRA_oil_industry_bonus: "Bonus Industri Minyak"
 BRA_industry_bonus: "Merangsang Bonus Ekonomi"
 BRA_electronics_bonus: "Bonus Elektronik"
 BRA_invest_in_railways_bonus: "Bonus Kereta Api"
 BRA_nacional_de_motores_bonus: "Bonus Nasional Motor"
 BRA_boost_integralist_support_tt: "Membuka keputusan §YIntegralist Rally§! untuk meningkatkan dukungan fasis di kota-kota besar dan kecil di negara ini."
 BRA_domination_of_the_americas: "Dominasi Amerika"
 BRA_domination_of_the_americas_desc: "Kita tidak akan pernah merasa aman sepenuhnya jika ada begitu banyak musuh di depan pintu kita. Satu-satunya jalan menuju keselamatan [BRA.GetAdjective] adalah dengan menjadi kekuatan yang tak terbantahkan di kawasan ini."
 BRA_berlin_accords: "Menetapkan Perjanjian Berlin"
 BRA_berlin_accords_desc: "[USA.GetNameDefCap] telah lama mencampuri urusan negara lain di Amerika. Dengan menyelaraskan diri dengan [GER.GetNameDef], kita dapat memperoleh pencegahan strategis terhadap campur tangan [USA.GetAdjective] di masa depan dalam urusan kita sendiri."
 BRA_accords_tt: "Jika mereka setuju untuk bekerja sama:"
 faction_name_bra_ger: "Pakta Berlin-Rio"
 faction_name_bra_ita: "Pakta Roma-Rio"
 BRA_expand_operation_bolivar: "Perluas Operasi Bolivar"
 BRA_expand_operation_bolivar_desc: "[GER.GetAdjective] telah melakukan operasi intelijen skala besar di Amerika Selatan, baik untuk memantau aktivitas ekonomi maupun politik. Kami diminta membantu mereka memperluas operasi dengan imbalan peningkatan kerja sama intelijen."
 BRA_guyana_crisis: "Krisis Guyana"
 BRA_guyana_crisis_desc: "Dengan diawasi oleh negara-negara Eropa di belahan dunia lain, kita mempunyai kesempatan untuk memaksa mereka agar menyerahkan wilayah mereka di Guyana kepada kita, atau menghadapi front lain dalam perang mereka."
 BRA_provoke_argentina: "Memprovokasi Argentina"
 BRA_provoke_argentina_desc: "Jelas bahwa [ARG.GetName] ingin mengasingkan dan menghancurkan kita, namun jika kita bertindak terlalu tergesa-gesa dalam mencegah mereka melakukan hal tersebut, kita mungkin akan terkena murka [USA.GetName]. Sebaliknya, kita akan memprovokasi [ARG.GetAdjective] untuk menembak terlebih dahulu dan kita akhirnya akan membalas perang Cisalpine!"
 BRA_form_mercosul: "Bentuk Merkosul"
 BRA_faction_mercosul_name: "Merkosul"
 BRA_form_mercosul_desc: "Amerika Selatan telah lama berada di bawah pengaruh kekuatan di luarnya seperti [USA.GetName] atau kerajaan Eropa. Namun jika negara-negara di benua ini bersatu sebagai satu kesatuan ekonomi dan politik, tidak akan ada lagi yang berani melakukan intervensi terhadap benua kita."
 BRA_form_mercosul_focus_tt: "Buka keputusan untuk mengundang negara-negara Amerika Selatan lainnya untuk bergabung dengan Mercosul"
 BRA_uruguay_ultimatum: "Ultimatum Uruguay"
 BRA_uruguay_ultimatum_desc: "[URG.GetNameDefCap] seharusnya sudah lama dimasukkan ke dalam [BRA.GetName], namun nenek moyang kita gagal melakukannya. Sudah waktunya kita memperbaiki kesalahan sejarah ini dan menyatukan masyarakat kita untuk tujuan bersama."
 BRA_paraguay_intervention: "Intervensi di Paraguay"
 BRA_paraguay_intervention_desc: "[PAR.GetNameDefCap] telah menjadi terlalu tidak stabil dan tidak dapat diprediksi. Demi keamanan nasional kita sendiri, kita harus campur tangan dalam urusan nasional mereka dan menstabilkan pemerintahan mereka."
 BRA_rome_accords: "Menetapkan Perjanjian Roma"
 BRA_rome_accords_desc: "Kami telah lama memiliki hubungan yang kuat dengan [ITA.GetName] karena migrasi bersejarah dari sana ke [BRA.GetName]. Ketika dunia mulai berubah dan pemerintahan kita menjadi lebih selaras, masuk akal untuk meresmikan kemitraan antar negara."
 BRA_italian_car_industry: "Kerjasama dengan Industri Mobil Italia"
 BRA_italian_car_industry_desc: "Industri otomotif kita masih dalam masa pertumbuhan, sedangkan teman-teman kita di [ITA.GetName] memiliki industri otomotif yang besar dan sukses. Mungkin inilah saatnya kita mendekati mereka untuk meminta nasihat dalam mengembangkan perusahaan kita yang masih baru."
 BRA_penal_battalions: "Batalhões de Presos"
 BRA_penal_battalions_desc: "Banyak anggota angkatan bersenjata tidak tertarik dengan prospek memperjuangkan monarki yang telah diasingkan selama beberapa dekade. Namun, sejak menerapkan undang-undang keamanan nasional, kita telah menciptakan banyak tahanan yang dapat digunakan dalam batalion hukuman, sehingga memperkuat kekuatan konvensional kita yang mengalami demoralisasi."
 BRA_penal_battalions_tt: "Membuat templat divisi yang dikenal sebagai §YBatalhões de Presos§! yang menggunakan batalyon hukuman. Juga merekrut §Y6 unit§! di §Y[ROOT.Capital.GetCapitalVictoryPointName]§!."
 BRA_end_the_state_of_emergency: "Akhiri Keadaan Darurat"
 BRA_end_the_state_of_emergency_desc: "[BRA.GetLeader] yang dulunya heroik kini menjadi ancaman terbesar bagi demokrasi [BRA.GetAdjective]. Hasratnya akan kekuasaan dan kecenderungan oportunisnya telah memungkinkannya untuk menangguhkan hak-hak yang kita perjuangkan. Semua orang yang menghargai kebebasan harus menentang keadaan darurat yang berbahaya ini."
 BRA_repeal_the_national_security_law: "Mencabut Undang-undang Keamanan Nasional"
 BRA_repeal_the_national_security_law_desc: "Ancaman presiden oportunis lainnya yang akan merusak demokrasi kita akan selalu ada kecuali kita mencabut undang-undang keamanan nasional yang digunakan $BRA_getulio_vargas$ selama keadaan darurat."
 BRA_greater_federalism: "Federalisme yang Lebih Besar"
 BRA_greater_federalism_desc: "Sentralisasi kekuasaan politik tidak sesuai dengan nilai-nilai demokrasi kita. Kita harus mematahkan cengkeraman elit politik di [ROOT.Capital.GetCapitalVictoryPointName] dan mengembalikan kekuasaan ke negara bagian republik."
 BRA_democratic_socialism: "Sosialisme Demokrat"
 BRA_democratic_socialism_desc: "Kegagalan Intentona Comunista pada tahun 1935 dan keadaan darurat yang terjadi kemudian memaksa banyak politisi dan aktivis sayap kiri meninggalkan negara tersebut atau melakukan gerakan bawah tanah, terlepas dari apakah mereka mendukung revolusi dengan kekerasan atau tidak. Dengan kokohnya demokrasi, kaum sosialis demokratis akhirnya mempunyai kesempatan untuk kembali ke kampung halamannya."
 BRA_continue_centralization: "Mempromosikan Sentralisasi"
 BRA_continue_centralization_desc: "[ROOT.GetNameDefCap] adalah bangsa dengan banyak kebudayaan yang tersebar di wilayah yang sangat luas. Jika kita tidak berbuat lebih banyak untuk menyatukan berbagai negara, kita menghadapi risiko perpecahan atau bahkan serangan militer dari negara-negara tetangga. Hanya melalui pemerintah pusat yang kuat kita dapat berharap untuk melindungi rakyat dan demokrasi kita."
 BRA_court_the_military: "Jangkau Badan Militer"
 BRA_court_the_military_desc: "Terlalu idealis untuk mengambil kebijakan yang tidak menyenangkan atau melemahkan kekuatan militer. Satu-satunya harapan kami adalah menemukan titik temu dan bekerja sama dengan mereka demi kebaikan bangsa. Jika kita gagal, hak yang kita miliki akan hilang lagi."
 BRA_implement_a_national_guard: "Menerapkan Garda Nasional"
 BRA_implement_a_national_guard_tt: "Membuat templat divisi yang dikenal sebagai §YGuarda Nacional§! dan merekrut §Y6 unit§! di §Y[ROOT.Capital.GetCapitalVictoryPointName]§!."
 BRA_implement_a_national_guard_desc: "Militer terus membayangi politik negara, bahkan mengancam akan mengakhiri demokrasi jika hal tersebut tidak menyenangkan mereka. Untuk melawan pengaruh mereka, kami akan membentuk garda nasional baru, yang loyal kepada Kongres Nasional."
 BRA_nationalize_the_banks: "Nasionalisasi Bank"
 BRA_nationalize_the_banks_desc: "Perekonomian kita belum pulih dari Depresi Besar, yang menyebabkan banyak warga negara kita berada dalam kemiskinan. Sudah saatnya kita mengalihkan beban pemulihan ekonomi dari para korban depresi, dan kepada para pelaku yang mengoperasikan bank."
 BRA_establish_the_brazilian_investment_bank: "Perpajakan Pro-Bisnis"
 BRA_establish_the_brazilian_investment_bank_desc: "Tidak ada kekurangan perusahaan internasional yang akan mendapatkan manfaat dari pembayaran pajak yang lebih sedikit dibandingkan saat ini. Dengan menetapkan kebijakan perpajakan yang menguntungkan bagi perusahaan-perusahaan tersebut, kita dapat menarik mereka untuk beralih ke [ROOT.GetNameDef], sehingga menguntungkan perekonomian kita."
 BRA_church: "Berkolaborasi dengan Gereja"
 BRA_church_desc: "Gereja Katolik tetap mempunyai pengaruh luas dalam politik kita meskipun pemisahan antara gereja dan negara telah terjadi selama beberapa dekade. Hal ini bermula dari banyaknya umat Katolik taat yang menjadi mayoritas pemilih. Jika kita bisa mendapatkan dukungan dari gereja, kita mungkin bisa mendapatkan dukungan massa terhadap kebijakan kita."
 BRA_implement_article_138: "Menerapkan Pasal 138"
 BRA_implement_article_138_desc: "Pasal 138 UUD 1934 menyatakan bahwa pemerintah hendaknya memberikan bantuan kepada keluarga yang mempunyai keturunan banyak. Pasal yang tidak jelas ini berlaku untuk sebagian besar keluarga, yang berarti bantuan apa pun akan menimbulkan biaya yang besar. Namun, dengan menerapkan sistem kesejahteraan dasar bagi keluarga-keluarga tersebut, kita dapat mengangkat jutaan orang dari kemiskinan dalam satu generasi."
 BRA_tech_slot_2: "Universitas Federal [ROOT.Capital.GetCapitalVictoryPointName]"
 BRA_tech_slot_2_desc: "Teknologi dengan cepat mengubah cara kita menjalani hidup, mulai dari cara kita bekerja hingga cara berperang. Demi kelangsungan kemakmuran dan keamanan negara kita, sangatlah penting bagi kita untuk berinvestasi dalam penelitian dan pengembangan teknologi baru."
 BRA_ban_the_communist_party: "Larang Partai Komunis"
 BRA_ban_the_communist_party_desc: "Gerakan komunis, meskipun upaya pemberontakannya gagal pada tahun 1935, terus menimbulkan ketakutan di kalangan militer dan pemilik bisnis di negara tersebut. Mungkin dengan menekan gerakan ini, kita bisa mendapatkan dukungan lebih besar dari militer untuk kebijakan kita sendiri."
 BRA_ban_the_communist_party_dynamic_tt: "§RPenurunan stabilitas akan meningkat seiring dengan popularitas partai komunis!§!"
 BRA_posts_for_generals: "Jabatan Menteri untuk Jenderal"
 BRA_posts_for_generals_desc: "Dengan menawarkan posisi di Dewan Menteri kepada para perwira militer yang berpengaruh, kita dapat mengurangi kekhawatiran mereka terhadap keputusan-keputusan pemerintah dengan membiarkan mereka mengambil bagian di dalamnya. Hal ini akan mengurangi kecurigaan mereka terhadap motif kami dan mencegah perlunya pertumpahan darah lagi."
 BRA_posts_for_generals_tt: "Aktifkan §Y$BRA_eurico_gaspar_dutra$§! sebagai penasihat politik:\nPopulasi yang Dapat Direkrut: §Y2%§!\nDukungan Perang: §G+10%§!\nDivisi Pertahanan di Wilayah Inti: §G+5%§!\npenerimaan Diplomasi Demokratis: §R-25§!"
 BRA_end_military_interference: "Akhiri Intervensi Militer"
 BRA_end_military_interference_tt: "Perubahan popularitas Non-Blok: §G-§![?.Root.party_popularity@neutrality|%0G]."
 BRA_end_military_interference_desc: "Dengan terbentuknya garda nasional, kita akhirnya mempunyai kemampuan untuk membatasi pengaruh kekuatan militer, dan pada akhirnya menempatkan angkatan bersenjata kita di bawah pengawasan pemerintah sipil."
 BRA_free_speech: "Buka Wacana Politik"
 BRA_free_speech_desc: "Dengan berkurangnya pengaruh kelompok militer terhadap Kongres Nasional, potensi terbentuknya kembali kediktatoran telah berkurang. Kini saatnya kita memberikan perlindungan yang lebih baik terhadap kebebasan berpendapat dan mendorong partisipasi politik yang lebih besar dari warga negara kita."
 BRA_free_speech_tt: "Berikut ini akan tersedia sebagai penasihat politik:"
 BRA_the_international_crisis: "Krisis Internasional"
 BRA_the_international_crisis_desc: "Dunia semakin tidak stabil seiring meningkatnya ketegangan antara negara-negara besar dan sengketa perbatasan lama yang kembali mengemuka dalam urusan luar negeri. Kita harus bertindak hati-hati namun juga menjangkau negara-negara demokratis lainnya di kawasan ini demi keamanan bersama."
 BRA_third_republic: "Ketertiban dan Kemajuan"
 BRA_third_republic_desc: "Dengan akhirnya pulihnya stabilitas negara dan berkurangnya ancaman kudeta militer, kita mempunyai peluang untuk memberlakukan konstitusi yang lebih kuat yang memungkinkan adanya pengawasan dan keseimbangan yang kuat, namun memungkinkan Dewan Menteri untuk bertindak tegas bila diperlukan."
 BRA_united_states_of_brazil: "Amerika Serikat Brasil"
 BRA_united_states_of_brazil_desc: "Meskipun kita telah melakukan banyak hal berdasarkan konstitusi tahun 1934 untuk mendorong kesetaraan politik dan ekonomi, kita masih dibatasi oleh banyak ketentuan di dalamnya. Sekarang merupakan kepentingan bangsa ini untuk melepaskan konstitusi yang tidak bagus ini demi konstitusi yang serupa dengan teman-teman kita di Amerika Serikat."
 BRA_united_states_of_south_america: "Amerika Serikat di Amerika Selatan"
 BRA_united_states_of_south_america_desc: "Bangsa kita telah menjadi mercusuar kebebasan, menarik semua orang yang menganut nilai-nilai yang sama dengan kita untuk datang ke sini dengan harapan akan awal yang baru. Kita harus merangkul keberagaman ini dan memperjelas aspirasi kita untuk masa depan dengan menjadikan diri kita sebagai Amerika Serikat di Amerika Selatan."
 BRA_united_states_of_south_america_tt: "Buka keputusan §Y$BRA_us_of_south_america_cat$§! untuk mengundang anggota faksi §YDemokrat§! atau §YNon-Blok§! di Amerika Selatan untuk §Ybergabung§! dengan [ROOT.GetNameDef]."
 BRA_bonus_tech_slot: "Dana Teknologi Nasional"
 BRA_bonus_tech_slot_desc: "Meskipun industri dan militer kita telah berkembang pesat dalam beberapa tahun terakhir, menjaga keseimbangan teknologi dengan musuh-musuh asing menjadi semakin sulit. Untuk mengatasi hal ini, kita akan membentuk dana nasional untuk berinvestasi pada teknologi baru."
 BRA_address_labor_disputes: "Mengatasi Perselisihan Perburuhan"
 BRA_address_labor_disputes_desc: "Pemerintahan sebelumnya memang prihatin dengan ancaman komunisme, namun tidak berbuat banyak untuk mengatasi permasalahan mendasar yang menyebabkan masyarakat beralih ke radikalisme. Kami tidak akan melakukan kesalahan yang sama dan akan mengambil peran yang lebih aktif dalam menangani perselisihan perburuhan."
 BRA_address_labor_disputes_tt_1: "§YAcara memungkinkan pilihan antara:§!"
 BRA_address_labor_disputes_tt_2: "§YAtau:§!"
 BRA_combat_separatism: "Memerangi Separatisme"
 BRA_combat_separatism_desc: "Setiap kali negara menghadapi gejolak politik, orang-orang yang mempunyai keluhan di luar ibu kota mulai menjalankan agenda separatis yang mengancam akan menghancurkan [ROOT.GetNonIdeologyName]. Kita harus berbuat lebih banyak untuk mempromosikan identitas [ROOT.GetAdjective] bersama di seluruh negeri."
 BRA_war_bonds: "Obligasi Perang"
 BRA_war_bonds_desc: "Kita tidak bisa mengesampingkan kemungkinan terseret ke dalam konflik secara militer atau dengan mendukung negara lain secara ekonomi, oleh karena itu kita harus memulai program penjualan obligasi perang untuk membiayai persenjataan kembali kita."
 BRA_invite_foreign_companies: "Undang Perusahaan Asing"
 BRA_invite_foreign_companies_desc: "Saatnya telah tiba untuk membuka pintu bagi modal asing. Kami akan melakukan hal ini dengan menciptakan insentif bagi perusahaan asing untuk mendirikan operasi di [BRA.GetNonIdeologyName], yang pada gilirannya akan mengurangi pengangguran dan meningkatkan pendapatan pajak."
 BRA_invite_foreign_companies_tt: "Membuka keputusan §Y$BRA_invite_foreign_companies_cat$§!, memungkinkan kami mengundang §YOrganisasi Industri Militer§! ke [BRA.GetNonIdeologyName] dari §Y[ENG.GetFlag][ENG.GetName]§!, §Y[USA.GetFlag][USA.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§! atau §Y[SWE.GetFlag][SWE.GetName]§!\n§GDapatkan 1 pabrik militer atau galangan kapal per MIO yang diundang ke [BRA.GetNonIdeologyName].§!\n§RKami hanya dapat mengundang 1 MIO dari setiap negara!§!\n\n§GPilihan 4 dari berikut ini:§!"
 BRA_pro_labor_agreement: "Kebijakan Pro-Buruh"
 BRA_romanticize_the_old_empire: "Meromantisasi Sejarah Kekaisaran"
 BRA_romanticize_the_old_empire_desc: "Tidak ada kekurangan politisi, pemimpin bisnis atau warga negara yang tidak puas, karena satu dan lain hal, ingin mengakhiri republik yang gagal ini. Mungkin dengan menyatukan sejarah kekaisaran dan kejayaan masa lalu, kita dapat menyatukan semuanya menjadi satu gerakan yang kohesif."
 BRA_vassouras_line: "Mendukung Klaim Pedro Henrique"
 BRA_vassouras_line_desc: "Upaya kami menciptakan gerakan untuk mengganggu status quo politik telah menimbulkan seruan untuk kebangkitan sejarah kekaisaran kami melalui kembalinya keluarga kerajaan kekaisaran. Banyak yang kini mendukung pemimpin Istana Kekaisaran Brasil di pengasingan, Pedro Henrique, sebagai penguasa sah negara tersebut."
 BRA_petropolis_line: "Mendukung Klaim Pedro de Alcântara"
 BRA_petropolis_line_desc: "Pedro de Alcântara pernah menjadi pemimpin Rumah Kekaisaran Brasil di pengasingan, sebelum melepaskan semua klaim takhta sehingga ia dapat menikahi Countess Elisabeth Dobržensk. Dengan semakin maraknya gerakan restorasi, ia kini mengklaim bahwa pengunduran dirinya tidak sah, dan bahwa ia adalah pewaris takhta yang sah."
 BRA_monarch_choice_1_tt: "§YPedro de Alcântara§! akan menjadi pemimpin Rumah Kekaisaran.\n§RJika [ROOT.GetNonIdeologyName] selesai fokus $BRA_constitutional_monarchy$ maka akan ditambah semangat kebangsaan§! sebagai berikut:"
 BRA_monarch_choice_2_tt: "§YPedro Henrique§! akan menjadi pemimpin Rumah Kekaisaran.\n§RJika [ROOT.GetNonIdeologyName] selesai fokus $BRA_constitutional_monarchy$ maka akan ditambah semangat kebangsaan§! sebagai berikut:"
 BRA_restore_the_coffee_barons: "Politik Café Com Leite"
 BRA_restore_the_coffee_barons_desc: "Para cukong kopi yang pernah berkuasa dan mengendalikan politik [ROOT.GetAdjective] selama beberapa dekade disingkirkan dari kekuasaannya pada revolusi tahun 1930. Banyak di antara mereka yang mempunyai pengaruh ekonomi yang besar dan dapat dibujuk untuk mendukung gerakan restorasi kekaisaran dengan imbalan konsesi politik."
 BRA_constitutional_monarchy: "Kompromi Monarki Konstitusional"
 BRA_constitutional_monarchy_desc: "Dengan semakin kuatnya gerakan restorasi kekaisaran dan berkurangnya dukungan terhadap rezim saat ini, seruan terhadap solusi kompromi untuk menstabilkan negara semakin meningkat. Saran yang paling menonjol adalah membentuk monarki konstitusional, sambil tetap mempertahankan kekuasaan politik di Kongres Nasional."
 BRA_constitutional_monarchy_tt: "Tergantung pada pilihan sebelumnya antara §Y$BRA_petropolis_line$§! dan §Y$BRA_vassouras_line$§!, salah satu dari semangat nasional berikut akan diaktifkan:"
 BRA_constitutional_monarchy_tt_2: "§YAtau§!"
 BRA_united_kingdom_of_brazil_and_portugal: "Kerajaan Inggris Brazil dan Portugal"
 BRA_united_kingdom_of_brazil_and_portugal_desc: "Pemulihan Rumah Kekaisaran Brasil juga telah menghidupkan kembali sentimen monarki di Portugal. Mungkin kita harus menggunakan ini sebagai kesempatan untuk sekali lagi menyatukan negara kita di bawah satu raja. Bagaimanapun, kedua negara akan mendapatkan keuntungan dari sumber daya dan keahlian satu sama lain."
 BRA_united_kingdom_of_brazil_and_portugal_tt: "Meminta penyatuan §Y[POR.GetFlag][POR.GetNonIdeologyName]§! dan §Y[BRA.GetFlag][BRA.GetNonIdeologyName]§!. Jika §Y[POR.GetFlag][POR.GetNonIdeologyName]§! menerima, mereka akan menjadi warga negara Brazil. Namun, mereka mungkin menawarkan alternatif atau menolak usulan tersebut."
 BRA_claim_the_french_throne: "Klaim Tahta Prancis"
 BRA_claim_the_french_throne_desc: "Melalui Wangsa Orléans-Braganza, dinasti kami memegang klaim atas takhta Prancis yang belum terpenuhi. Pedro Gastão dari Orléans-Braganza ingin memanfaatkan ini untuk memperluas wilayah kami. Ini adalah keadaan yang harus dieksploitasi!"
 BRA_undermine_democracy: "Melemahkan Kongres Nasional"
 BRA_undermine_democracy_desc: "Para pendukung kami yang paling berpengaruh tidak puas dengan kompromi monarki konstitusional ini. Mereka semakin tidak sabar dan ingin melihat raja menggunakan pengaruh baru mereka untuk mengesampingkan Kongres Nasional dengan menunjuk Dewan Menteri baru."
 BRA_use_the_national_security_law: "Memanfaatkan UU Keamanan Nasional"
 BRA_use_the_national_security_law_desc: "Meskipun terdapat perlawanan lemah dari para anggota Kongres Nasional, Dewan Menteri kita yang baru telah berhasil memantapkan diri mereka sebagai pemerintah negara yang sah. Kini, mereka akan menggunakan undang-undang keamanan nasional, yang disahkan oleh rezim $BRA_getulio_vargas$, untuk menegaskan otoritas absolut atas urusan politik."
 BRA_amazonian_settlement: "Mulai kembali Kolonisasi Amazon"
 BRA_amazonian_settlement_desc: "Amazon kaya akan sumber daya dan lahan, siap untuk dieksploitasi. Untuk merangsang perekonomian dan menciptakan insentif bagi tentara kita untuk berperang, kita harus menawarkan kesempatan kepada mereka yang bergabung dengan militer untuk memperoleh tanah tersebut setelah masa tugas yang sesuai."
 BRA_amazonian_settlement_tt: "Membuka kunci §YPemukiman Militer dalam keputusan Amazon§! untuk mengembangkan negara bagian Amazon."
 BRA_empire_of_brazil: "Membangun kembali Kekaisaran Brasil"
 BRA_empire_of_brazil_desc: "Dengan kekuasaan yang aman di tangan raja dan menteri-menteri yang ditunjuk, inilah saatnya kita mengembalikan negara ini ke kejayaannya. Langkah pertama untuk melakukan hal ini adalah pemulihan Kekaisaran Brasil dan kembali ke nilai-nilai tradisional yang mendasari pembangunannya."
 BRA_reclaim_territory_in_south_america: "Revanchisme Cisplatine"
 BRA_reclaim_territory_in_south_america_desc: "Rasa malu akibat perang Cisplatine membayangi Istana Kekaisaran bahkan satu abad setelah perang yang mahal itu berakhir. Menegaskan kembali klaim kita atas tanah Uruguay akan sangat membantu dalam membangkitkan kembali kebanggaan di antara rakyat kita dan mengingatkan dunia bahwa kita bukan negara yang sudah renta seperti dulu."
 BRA_demand_portugese_territory: "Menuntut Koloni Portugis"
 BRA_demand_portugese_territory_desc: "Negara modern [POR.GetNonIdeologyName] hanyalah seonggok dari sebuah kerajaan yang dulunya besar. Ketika dunia sedang terjebak dalam kekacauan di tempat lain, kita harus melakukan diplomasi kapal perang dan membujuk pemerintah [POR.GetAdjective] untuk menyerahkan wilayah luar negeri mereka kepada kita."
 BRA_demand_portugese_submission: "Menuntut Total Penyerahan Bahasa Portugis"
 BRA_demand_portugese_submission_desc: "Tanah [POR.GetNonIdeologyName] diperintah oleh kekuasaan yang tidak sah, karena hanya Kaisar kita yang memiliki hak yang diberikan dewa untuk memerintah mereka. Kami akan menuntut penyerahan seluruh tanah mereka kepada kami, atau kami akan merebutnya dengan paksa jika perlu."
 BRA_restoration_of_honor: "Memulihkan Kehormatan Brasil"
 BRA_restoration_of_honor_desc: "Meskipun banyak warga negara kita yang skeptis terhadap kembalinya monarki, mayoritas kini merasa puas dengan hasilnya. Dengan diperluasnya perbatasan kita, perekonomian kita membaik dan hierarki alami masyarakat diperkuat, kita akhirnya dapat mengatakan bahwa kehormatan [ROOT.GetAdjective] telah dipulihkan."
 BRA_spirit_of_acre_war: "Nyalakan kembali Perang Acre"
 BRA_spirit_of_acre_war_desc: "Meskipun wilayah Acre sekarang berada di bawah kendali kami, kami dapat menggunakan sejarah konflik perbatasan di sana sebagai alasan untuk membagi lebih banyak wilayah Bolivia. Hal ini dapat memberi kita akses terhadap kekayaan sumber daya alam yang belum dimanfaatkan, yang akan memasok kebutuhan industri kita selama beberapa dekade mendatang."
 BRA_expand_colonial_empire: "Perluas Kerajaan Kolonial"
 BRA_expand_colonial_empire_desc: "Dengan ekspansi kami baru-baru ini di luar negeri, kami sekarang mempunyai pijakan yang dapat memperluas kekuasaan kami ke Afrika. Meskipun sebagian besar benua ini masih berada di bawah kekuasaan negara-negara besar Eropa, terdapat banyak wilayah kaya sumber daya yang siap untuk diambil alih."
 BRA_invest_in_the_armed_forces: "Menyuap Militer"
 BRA_invest_in_the_armed_forces_desc: "Elit militer mempunyai loyalitas yang berubah-ubah dan paranoid terhadap ancaman komunisme, baik dari dalam maupun luar negeri. Kami akan menggunakan ini untuk keuntungan kami dengan menyuap mereka dengan peningkatan anggaran militer sebagai imbalan untuk mendukung pemerintahan kami."
 BRA_royal_colleges: "Mendirikan Royal College [ROOT.Capital.GetCapitalVictoryPointName]"
 BRA_royal_colleges_desc: "Kaisar baru-baru ini menaruh perhatian besar pada kedudukan akademis negara kita dan oleh karena itu telah menetapkan pendirian Royal College baru di ibu kota untuk mendorong inovasi teknologi dalam negeri yang lebih besar."
 BRA_issue_lordships: "Mengeluarkan Gelar Kerajaan"
 BRA_issue_lordships_desc: "Saat kita mulai mengambil kembali kendali atas wilayah yang menjadi hak kita, beban mengendalikan berbagai wilayah menjadi beban bagi raja tercinta kita. Oleh karena itu, ia menyatakan bahwa gelar kerajaan baru akan diberikan kepada mereka yang dianggap dapat dipercaya, untuk membantu pemerintahan kerajaan."
 BRA_promote_agriculture: "Kembalikan Baron Kopi"
 BRA_promote_agriculture_desc: "Apa yang disebut sebagai ‘Coffee Baron’ berperan penting dalam membantu kita mendapatkan dukungan yang cukup untuk memulihkan monarki. Sekarang kita akan memberikan imbalan kepada mereka dengan mengangkat mereka ke dalam pemerintahan untuk mengawasi rekonstruksi perekonomian."
 BRA_promote_agriculture_tt: "§YMembuka kunci penasihat:§!"
 BRA_acceptance_tt: "Jika mereka menerima:"
 BRA_prepare_for_second_intentona: "Komunis Intentona Kedua"
 BRA_prepare_for_second_intentona_desc: "Upaya pertama kami untuk menggulingkan negara borjuasi $BRA_getulio_vargas$ telah gagal. Jika kita tidak bangkit dengan cepat, peluang terjadinya upaya revolusi kedua akan musnah dengan adanya gelombang baru undang-undang anti-kiri yang disahkannya. Kita harus menyalakan kembali api revolusi sebelum hal itu terjadi."
 BRA_seek_soviet_support: "Carilah Dukungan [SOV.GetAdjective]"
 BRA_seek_soviet_support_desc: "Jika kita ingin berhasil dan mengubah negara kita menjadi masyarakat komunis yang layak diterima oleh rakyat kita, kita akan membutuhkan dukungan dari luar.[SOV.GetNameDefCap] telah membantu kita sebelumnya, rasanya sudah sepantasnya kita meminta dukungan mereka sekali lagi untuk menjamin keberhasilan kita."
 BRA_radicalize_the_proletariat: "Radikalisasi Proletariat"
 BRA_radicalize_the_proletariat_desc: "Upaya terakhir kami untuk merebut kekuasaan gagal karena kami tidak mendapat cukup dukungan terkoordinasi dari kaum buruh. Kita harus menyebarkan pesan kita kepada mereka dan memastikan kesetiaan mereka sepenuhnya kepada kita."
 BRA_launch_the_revolution: "Luncurkan Revolusi"
 BRA_launch_the_revolution_desc: "Waktunya telah tiba. Kami akan memperbaiki apa yang gagal kami lakukan pada tahun 1935 pada masa Intentona Comunista. Kita harus bangkit melawan [BRA.GetLeader] dan pemerintahannya yang menindas."
 BRA_launch_the_revolution_tt: "Meluncurkan §YRevolusi Komunis§! di [BRA.GetNameDef]. Banyaknya perpecahan yang akan kita peroleh tergantung seberapa besar dukungan terhadap §Y[BRA.GetCommunistParty]§!.\n§RIni akan berujung pada Perang Saudara Komunis melawan Partai Demokrat!§!"
 BRA_tech_slot_3: "Universitas Rakyat [BRA.GetNonIdeologyName]"
 BRA_tech_slot_3_desc: "Untuk membangun negara yang kuat kita memerlukan sistem pendidikan maju yang memberi kita akses mudah ke para pemikir terhebat dan paling cemerlang di [BRA.GetName]. Terlibat sejak dini akan menjamin pengaruh untuk mengontrol bidang studi di institusi. Mendedikasikan Universitas kepada masyarakat hanyalah sebuah cara untuk memastikan bahwa di tahun-tahun mendatang para intelektual ini akan dengan senang hati tinggal dan membantu perjuangan kita."
 BRA_international_brigades: "Brigade Internasional"
 BRA_international_brigades_desc: "Peperangan sedang berkecamuk di dunia sekitar kita dan meskipun kita tidak berperan aktif di dalamnya, sebagai kawan yang baik adalah tugas kita untuk mengirimkan bantuan kepada mereka yang membutuhkan ketika kita mampu melakukannya. Tidak ada gunanya bagi kita untuk ikut berperang secara sembarangan, karena saat ini kita harus mengirimkan sukarelawan."
 BRA_soviet_economic_aid: "Bantuan Ekonomi Soviet"
 BRA_soviet_economic_aid_desc: "Setelah bertahun-tahun dikelola oleh para pemimpin dengan ide-ide yang berbeda dari kita, perekonomian kita tidak berada pada kondisi yang kita inginkan. Untuk mempercepat proses pemulihannya ke kondisi yang diinginkan, kita harus mempertimbangkan untuk mencari bantuan dari negara lain yang memiliki pola pikir serupa dengan kita."
 BRA_license_soviet_designs: "Perjanjian Lisensi dengan [SOV.GetNameDef]"
 BRA_license_soviet_designs_desc: "Penelitian kami tertinggal dibandingkan negara-negara besar. Membangun kapasitas untuk mengejar ketertinggalan akan memakan waktu lama, namun hingga saat itu tiba, kami mungkin berupaya mendapatkan izin untuk memproduksi peralatan dari [SOV.GetNameDef] di [BRA.GetNameDef]. Mengingat biaya kesepakatan seperti itu, kita harus mencoba menegosiasikan sedikit diskon."
 BRA_license_soviet_designs_tt: "([SOV.GetFlag]§Y[SOV.GetName]§!) Mendapat acara '§Y[BRA.GetNameDefCap] Mencari Kesepakatan Produksi Lisensi§!'\n\nMereka lebih cenderung menerima jika mereka memiliki §YPendapat yang tinggi tentang kami!§!"
 BRA_purchase_soviet_equipment: "Beli Peralatan Soviet"
 BRA_purchase_soviet_equipment_desc: "Tentara kita saat ini sangat membutuhkan peralatan. Untuk mengembangkan pasukan tersebut menjadi lebih besar, kami ingin memiliki kemungkinan untuk membeli peralatan dengan harga yang menguntungkan dari sekutu yang tepercaya. Dengan beberapa negosiasi kita seharusnya bisa mendapatkan kesepakatan dengan [SOV.GetNameDef]."
 BRA_infilitrate_the_military: "Menyusup ke Militer"
 BRA_infilitrate_the_military_desc: "Walaupun para petinggi militer masih menolak ideologi kita, banyak perwira rendahan yang menginginkan kesempatan untuk memecat atasan mereka. Jika kita menyusup ke kelompok mereka, kita bisa mempengaruhi mereka untuk mendukung tujuan kita."
 BRA_infilitrate_the_military_tt: "Proporsi yang lebih besar dari §Ymiliter§! akan bergabung dengan komunis selama §Rperang saudara§! mendatang jika fokus ini diambil."
 BRA_seek_international_support: "Carilah Dukungan Internasional"
 BRA_seek_international_support_desc: "Meskipun upaya besar telah dilakukan untuk memulihkan gerakan komunis, kita masih lemah dibandingkan kekuatan yang harus kita atasi. Oleh karena itu, kita harus mendapatkan dukungan dari individu dan pemerintah yang berpikiran sama di seluruh dunia."
 BRA_join_the_comintern: "Bergabunglah dengan Komintern"
 BRA_join_the_comintern_desc: "Sudah terlalu lama [BRA.GetNameDef] berdiri di luar Komintern, namun tetap mengandalkan dukungannya. Sudah saatnya kita berusaha untuk bergabung dengan benar!"
 BRA_create_faction: "Koperasi Sosialis Amerika Latin"
 BRA_create_faction_desc: "Ada banyak orang lain yang memiliki gagasan yang sama dengan kita tentang bagaimana seharusnya masyarakat komunis. Sudah saatnya kita membuka diri untuk bekerja sama dengan negara-negara ini sehingga kita, bersama-sama, dapat memperjuangkan tujuan kita!"
 BRA_free_prestes: "Bebaskan Prestes dari Penjara"
 BRA_free_prestes_desc: "$BRA_luis_carlos_prestes$ telah berada di garis depan politik [ROOT.GetAdjective] radikal selama beberapa tahun sekarang. Namun, dengan kegagalan Komunista Intentona pertama, ia ditangkap bersama dengan pimpinan gerakan tersebut. Jika kita ingin mempunyai harapan untuk menang, kita harus membebaskan pemimpin kita dari cengkeraman $BRA_getulio_vargas$."
 BRA_free_prestes_tt: "Setelah berhasil menggulingkan pemerintahan saat ini, penasihat pro-[SOU.GetAdjective] §YPartido Communista§! akan tersedia."
 BRA_revive_the_anl: "Bangkitkan kembali Aliança Nacional Libertadora"
 BRA_revive_the_anl_desc: "Meskipun Aliança Nacional Libertadora gagal menggulingkan rezim otoriter $BRA_getulio_vargas$, mereka masih menguasai jutaan [BRA.GetAdjective] yang mengharapkan perubahan nyata. Kita harus menghidupkan kembali gerakan ini sebelum harapan itu benar-benar padam."
 BRA_revive_the_anl_tt: "Selama revolusi komunis mendatang, terimalah §G2§! divisi tambahan dari §Ymilisi komunis.§!"
 BRA_revive_the_anl_tt_2: "Setelah berhasil menggulingkan pemerintahan saat ini, penasihat yang selaras dengan §YAliança Nacional Libertadora§! akan tersedia."
 BRA_align_with_moscow: "Sejajarkan dengan [SOU.Capital.GetCapitalVictoryPointName]"
 BRA_align_with_moscow_desc: "Beberapa anggota partai kami mendapat kehormatan untuk mengunjungi [SOU.Capital.GetCapitalVictoryPointName]. Sekembalinya mereka ke kami, mereka memuji cara [SOU.GetAdjective] dalam menjalankan negara. Kita harus mempertimbangkan untuk menyelaraskan diri lebih dekat dengan [SOU.GetNameDef]."
 BRA_oust_prestes: "Cegah Kultus Kepribadian"
 BRA_oust_prestes_desc: "Masyarakat komunis tidak boleh dijalankan oleh beberapa individu. Meskipun pasti ada negara-negara yang mengatur hal ini, kami khawatir hanya tinggal menunggu waktu sebelum negara-negara tersebut menjadi tidak lain hanyalah pemujaan terhadap kepribadian. Demi mencegah nasib ini menimpa kita, kita harus meminta dewan ANL mengambil alih urusan politik negara."
 BRA_soviet_arms_industry: "Undang Industri Senjata Soviet"
 BRA_soviet_arms_industry_desc: "Kami memiliki industri militer yang kuat di [BRA.GetNameDef] namun baru-baru ini kami mencari cara untuk meningkatkan kekuatannya lebih jauh lagi. Minat untuk memulai operasi di [BRA.GetNameDef] telah diungkapkan oleh beberapa Organisasi Industri Militer [SOV.GetAdjective], kita harus mempertimbangkan untuk mengundang mereka."
 BRA_spread_the_revolution: "Perluas Revolusi"
 BRA_spread_the_revolution_desc: "Revolusi yang kami bawa ke [BRA.GetNameDef] sangat diapresiasi oleh rakyat kami. Kini setelah kita menstabilkan urusan dalam negeri, inilah waktunya bagi kita untuk berpikir lebih besar dan melihat melampaui batas negara kita sendiri."
 BRA_smash_fascism: "Hancurkan Fasisme Amerika Selatan"
 BRA_smash_fascism_desc: "Terdapat negara-negara di benua Amerika Selatan yang belum tercapai oleh revolusi. Kaum proletar di beberapa negara ini masih mengalami penindasan besar di bawah pemerintahan fasis. Kita tidak bisa membiarkan hal ini terjadi, kita harus membebaskan rekan-rekan sekerja kita!"
 BRA_anti_imperialism: "Usir Kekaisaran"
 BRA_anti_imperialism_desc: "Beberapa negara di sekitar kita belum mendapatkan kemerdekaan yang sah. Masih ada Kerajaan di luar sana yang mengklaim kendali atas wilayah ini. Kolonialisme dan Imperialisme sudah berlalu dan sudah lama terlambat bagi kita untuk menjelaskannya kepada Kerajaan-kerajaan tersebut."
 BRA_anti_imperialism_tt: "Membuka keputusan §YAnti-Kolonialisme Amerika Selatan§! untuk membebaskan koloni di Amerika Selatan."
 BRA_jaguar_diplomacy: "Diplomasi Jaguar"
 BRA_jaguar_diplomacy_desc: "[CHI.GetName] baru-baru ini menggunakan salah satu hewan asli mereka sebagai hadiah diplomatik. Terlepas dari perbedaan ideologi, metode ini tampaknya merupakan metode yang berhasil untuk memuluskan hubungan yang buruk dengan pemerintah asing. Mungkin kita bisa menggunakan teknik yang sama untuk mencegah negara-negara besar ikut campur dalam urusan kita sendiri."
 BRA_jaguar_diplomacy_tt: "Membuka keputusan §Y$BRA_jaguar_diplomacy_cat$§! untuk menenangkan negara-negara besar yang menentang Komunisme di Amerika Selatan dengan membuat pakta non-agresi dengan mereka."
 BRA_sway_the_neighbors: "Goyangkan Tetangga"
 BRA_sway_the_neighbors_desc: "Kita harus menggunakan segala cara yang diperlukan untuk meningkatkan kesadaran kelas di antara tetangga kita dan mendukung mereka dalam melepaskan belenggu penindasan borjuis."
 BRA_sway_the_neighbors_tt: "Buka keputusan §Y$BRA_sway_the_neighbors_cat$§! untuk mempromosikan komunisme di negara-negara Amerika Selatan."
 BRA_julieta_soria: "Julieta Soria"
 BRA_union_of_latin_american_socialist_republics: "Membangun ULASR"
 BRA_union_of_latin_american_socialist_republics_desc: "Gerakan revolusioner kami terus mengikis struktur masyarakat borjuis di seluruh benua. Jelas bahwa kita bukan lagi gerakan [ROOT.GetAdjective], kita adalah gerakan Amerika Selatan dan inilah saatnya struktur politik kita mewakili perubahan tersebut dengan lebih baik."
 BRA_smash_democracy: "Akhiri Kapitalisme Amerika Selatan"
 BRA_smash_democracy_desc: "Demokrasi borjuis dan kapitalisme terus mengikis hak-hak dan kondisi kehidupan banyak orang Amerika Selatan. Kita harus melakukan semua yang kita bisa untuk membebaskan kawan-kawan kita di seluruh benua dari para penindasnya."
 BRA_kgbrazil: "[BRA_kgbrazil_key]"
 BRA_create_kgbrazil_with_agents: "Bentuk EICI"
 BRA_kgbrazil_just_add_operatives: "[SOU.GetAdjective] Kerja Sama Intelijen"
 BRA_kgbrazil_no_lar: "Memperkuat Front Informasi"
 BRA_kgbrazil_cangaco: "Rede Coiteiros"
 BRA_kgbrazil_desc: "[BRA_kgbrazil_desc_key]"
 BRA_create_kgbrazil_with_agents_desc: "Intelijen dan informasi mengenai musuh kita merupakan komponen penting dari kemampuan kita untuk membela negara dan kepentingan kita bila diperlukan. Membentuk lembaga yang kuat mungkin membutuhkan waktu, namun kami mendapat dukungan dari lembaga-lembaga asing yang mempunyai ideologi yang sama untuk membantu kami dalam upaya ini."
 BRA_kgbrazil_just_add_operatives_desc: "Intelijen dan informasi mengenai musuh kita merupakan komponen penting dari kemampuan kita untuk membela negara dan kepentingan kita bila diperlukan. Agensi kami telah melakukan banyak pekerjaan akhir-akhir ini, namun akan lebih baik lagi jika kami merekrut beberapa agen Soviet berpengalaman untuk tujuan kami."
 BRA_kgbrazil_no_lar_desc: "Intelijen dan informasi mengenai musuh kita merupakan komponen penting dari kemampuan kita untuk membela negara dan kepentingan kita bila diperlukan. Kita harus memprioritaskan untuk selalu memenuhi kebutuhan teknologi kita, baik untuk mengumpulkan informasi intelijen tentang musuh kita maupun untuk menjaga mereka dari informasi sensitif kita."
 BRA_robert_ivanov: "Robert Ivanov"
 BRA_nadiya_morozova: "Nadiya Morozova"
 BRA_collectivization_of_transport: "Kolektivisasi Transportasi"
 BRA_collectivization_of_transport_desc: "Sistem transportasi kita telah mengalami masa-masa yang lebih baik dan sangat membutuhkan reorganisasi agar kita dapat memanfaatkannya secara lebih efisien untuk memenuhi kebutuhan kita. Kolektivisasi sistem transportasi akan memberikan kekuatan kepada pekerja untuk melakukan reformasi yang sangat diperlukan ini dengan cara yang mereka anggap paling tepat."
 BRA_nationalization_of_industry: "Nasionalisasi Industri"
 BRA_nationalization_of_industry_desc: "Industri sipil kita belum dinasionalisasi. Di tangan pemilik swasta yang mencari keuntungan untuk memenuhi kebutuhan masyarakat dan negara, efisiensinya sangat menderita. Demi kepentingan semua orang di [BRA.GetNameDef] kita perlu menasionalisasi dan memperluas industri kita."
 BRA_rapid_industrialization: "Industrialisasi yang Pesat"
 BRA_rapid_industrialization_desc: "Investasi yang kami lakukan pada industri sipil tampaknya sangat bermanfaat, baik bagi pekerja maupun negara. Mungkin kita harus mempertimbangkan untuk melakukan investasi serupa ke dalam industri militer dalam negeri."
 BRA_collectivization_of_agriculture: "Kolektivisasi Pertanian"
 BRA_collectivization_of_agriculture_desc: "Industri pertanian kita agak terfragmentasi dan tidak bekerja seefisien mungkin. Dengan melakukan kolektivisasi industri dan menyerahkannya kepada para pekerja secara kolektif untuk menangani reformasi yang diperlukan, kita dapat mengatasi masalah ini dan banyak masalah lainnya."
 BRA_allow_the_church_to_operate: "Rangkullah Para Teolog Sosialis yang Selaras"
 BRA_allow_the_church_to_operate_desc: "Sebuah gerakan baru di kalangan pendeta mulai mengakar di Amerika Selatan. Para pemuka agama menganjurkan kebijakan-kebijakan yang selaras dengan sosialis yang akan mengentaskan masyarakat yang paling membutuhkan dari kemiskinan untuk selamanya. Mungkin kita harus merangkul para teolog radikal ini daripada membuat marah kaum proletar yang mendukung mereka."
 BRA_state_atheism: "Negara Atheis"
 BRA_state_atheism_desc: "Untuk memastikan pikiran masyarakat kita tidak dipenuhi dengan pemikiran-pemikiran yang tidak diinginkan, kita harus memastikan bahwa propaganda semacam itu tidak boleh disebarkan ke mana pun. Cara-cara kuno para teolog [BRA.GetAdjective] dan apa yang mereka khotbahkan sangat kontras dengan apa yang kita harapkan dari umat kita. Kita tidak boleh mengaktifkan ini lagi!"
 BRA_support_industrialists: "Mendukung Industrialis"
 BRA_support_industrialists_desc: "Meskipun terdapat lebih banyak pekerja dibandingkan kapitalis dalam populasi kita, kapitalis menguasai lebih banyak kekayaan dan sumber daya. Kita harus memberlakukan kebijakan yang membatasi hak-hak pekerja dan memungkinkan para industrialis beroperasi lebih efisien demi kemajuan perekonomian secara keseluruhan."
 BRA_reward_army_loyalty: "Hadiahi Kesetiaan Tentara"
 BRA_reward_army_loyalty_desc: "Tentara sangat diperlukan tidak hanya dalam upaya kita mencapai kekuasaan, namun juga dalam mempertahankan kekuasaan kita. Sudah saatnya kita menghargai kesetiaan sekutu kita dengan peningkatan alokasi sumber daya untuk proyek infrastruktur militer."
 BRA_reinvigorate_the_navy: "Menguatkan kembali Angkatan Laut"
 BRA_reinvigorate_the_navy_desc: "Para perwira angkatan laut telah lama mendukung gerakan Integralis, meskipun gerakan tersebut tidak populer di kalangan masyarakat. Untuk dukungan jangka panjang mereka, kami akan meningkatkan pendanaan sehingga mereka dapat memulai proses penyegaran kembali armada yang menua."
 BRA_establish_caloi: "Mendirikan Pabrik Caloi"
 BRA_establish_caloi_desc: "Meningkatnya ketegangan di seluruh dunia mempersulit impor sepeda dan suku cadangnya dari Eropa dan Amerika Utara. Dengan banyaknya akses terhadap karet dan baja, mungkin kita harus mendirikan pabrik sepeda sendiri dan memasukkan penggunaannya ke dalam bidang militer."
 BRA_us_brazil_technology_exchange: "[USA.GetAdjective]-[ROOT.GetAdjective] Pertukaran Teknologi"
 BRA_us_brazil_technology_exchange_desc: "Kita telah banyak meningkatkan keahlian teknologi negara kita dalam beberapa tahun terakhir, namun kita harus banyak belajar dari teman-teman kita di [USA.GetNameDef]. Mungkin kita bisa mendorong mereka untuk membagikan pengetahuan mereka sebagai imbalan atas pengetahuan kita."
 BRA_us_brazil_technology_exchange_tt: "Apabila [USA.GetFlag]§Y[USA.GetNameDef]§! menyetujui usulan tersebut:"
 BRA_depose_vargas: "Singkirkan [ROOT.GetLeader]"
 BRA_depose_vargas_desc: "[ROOT.GetLeader] sudah menjadi kewajiban. Meskipun ia adalah seorang politikus yang terampil, masyarakat tidak akan bisa mentolerir banyak hal jika hanya mengandalkan satu orang saja. Jika kita ingin menghindari jatuh kembali ke dalam kemiskinan, kita perlu memecatnya dan menggantinya dengan pemimpin militer yang lebih baik."
 BRA_equality_for_women: "Kesetaraan Proletar"
 BRA_equality_for_women_desc: "Tatanan borjuis yang lama, dengan segala kedoknya, harus dirobohkan. Untuk mencapai tujuan ini, perempuan dan kelompok minoritas di Brasil telah lama diabaikan oleh negara dan inilah saatnya kita mengatasi keluhan historis mereka. Kita juga harus mendorong mereka untuk menggunakan kemampuannya demi pembangunan republik proletar kita."
 BRA_equality_for_women_tt: "Buka §Y$BRA_olga_benario_prestes$§! sebagai pemimpin unit"
 BRA_italian_cooperation: "Pemisahan [ITA.GetAdjective]-[ROOT.GetAdjective] Afrika"
 BRA_italian_cooperation_desc: "Ketika kerajaan-kerajaan lama runtuh, pergolakan baru di Afrika pun muncul. Melalui hubungan khusus kami dengan [ITA.GetNameDef], kami memiliki kesempatan untuk mengukir bagian dari benua ini untuk diri kami sendiri."
 BRA_german_cooperation: "Dominasi Atlantik Selatan"
 BRA_german_cooperation_desc: "Sudah terlalu lama Samudera Atlantik didominasi oleh Angkatan Laut Amerika dan Inggris. Melalui kolaborasi kami dengan [GER.GetNameDef], kami siap mengusir mereka dan mengambil kendali Atlantik untuk diri kami sendiri."
 BRA_german_cooperation_tt: "Dapatkan §Yklaim§! di pulau-pulau di §YSamudera Atlantik Selatan§! yang bukan milik [ROOT.GetNonIdeologyName] atau [GER.GetNonIdeologyName]"
 BRA_german_cooperation_tt_2: "Dapatkan §Y10§! [GER.GetAdjective] §YKapal Selam Awal Tipe IIA.§!"
 BRA_attack_bolivia: "Mengamankan Amazon"
 BRA_attack_bolivia_desc: "Hutan hujan Amazon pada dasarnya adalah [BRA.GetAdjective]. Fakta bahwa [BOL.GetNameDef] terus menempati sebagian wilayahnya tidak dapat lagi ditoleransi."
 BRA_attack_chile: "Serangan Pencegahan"
 BRA_attack_chile_desc: "Sementara [CHL.GetAdjective] tetap berada di belakang pegunungannya, sisi barat kita tidak akan pernah aman sepenuhnya. Oleh karena itu, kita harus melikuidasi negara [CHL.GetAdjective] dan mengintegrasikan wilayahnya ke dalam wilayah kita sendiri."
 BRA_panama_push: "Dorongan Panama"
 BRA_panama_push_desc: "Jika kita ingin mengamankan benua ini untuk diri kita sendiri, kita harus bertindak cepat dan mengalahkan musuh kita sebelum mereka dapat merespons."
 BRA_unify_south_america: "Amerika do Sul"
 BRA_unify_south_america_desc: "Amerika Selatan telah jatuh ke dalam kekuasaan kami karena kekuatan dan keberanian rakyat kami. Sekarang kita harus memulai tugas sulit untuk menyatukan benua ini di bawah kekuasaan dan budaya kita."
 BRA_unify_south_america_tt: "Buka keputusan untuk mendapatkan §Ycore§! di wilayah yang dimiliki di §YAmerika Selatan§!"
 BRA_sway_the_cangaco: "Goyangkan Cangaço untuk Tujuan kita"
 BRA_sway_the_cangaco_desc: "Suku Cangaço telah berjuang selama bertahun-tahun melawan berbagai rezim yang berkuasa di negara ini. Meski bukan penganut paham Marxis, para bandit ini mendapat dukungan kuat dari kaum tani pedesaan untuk mendistribusikan kembali kekayaan lokal. Mungkin kita bisa membawa mereka dan pengalaman mereka ke dalam gerakan revolusioner kita?"
 BRA_sway_the_cangaco_tt: "§RHapus§! §Y$BRA_cangaceiro_decision_cat$§! §Rkeputusan, cegah kami untuk menindak Cangaço di negara bagian yang terkena dampak!§!\n\nDapatkan §G3§! unit unit Milisi Cangaço ketika perang saudara dipicu atau pemerintah menjadi §YKomunis§!"
 BRA_cangaco_coup: "Kudeta Cangaço"
 BRA_cangaco_coup_desc: "Terlepas dari janji-janji revolusi, para pemimpin gerakan ini masih ragu-ragu dan terjebak dalam perdebatan dogmatis mengenai doktrin-doktrin yang pantas untuk dipatuhi. Dengan dukungan yang lebih besar dari masyarakat, sekarang saatnya bagi Cangaço untuk mengambil alih komando negara dan memberantas korupsi di jantungnya untuk selamanya."
 BRA_south_american_defense_cooperation: "Latihan Militer Gabungan Amerika Selatan"
 BRA_south_american_defense_cooperation_desc: "Benua kita beragam baik dari segi manusia maupun geografi. Dengan melakukan latihan militer bersama dengan negara-negara tetangga, masyarakat kita akan mendapatkan wawasan tidak hanya tentang bagaimana satu sama lain berperang, namun juga bagaimana mereka menjalani kehidupan."
 BRA_south_american_defense_cooperation_tt: "Setiap §Ypemimpin tentara§! dari setiap §Yanggota faksi§! akan memiliki peluang §G50%§! untuk mendapatkan §Ysifat medan§! secara acak."
 BRA_foreign_legion: "Legião Strangeira"
 BRA_foreign_legion_desc: "[ROOT.GetName] telah menjadi tempat perlindungan bagi orang asing di masa sulit ini. Tidak ada kekurangan di antara mereka yang bersedia menyerahkan nyawanya demi membela nilai-nilai kita bersama. Kita harus memberi mereka kesempatan untuk melakukan hal tersebut dengan merekrut mereka ke dalam legiun asing."
 BRA_foreign_legion_tt: "Buat template §YLegião Estrangeira§! dan sebarkan unit §G3§! ke [ROOT.Capital.GetCapitalVictoryPointName].\n\nBuka keputusan §Y$BRA_foreign_legion_cat$§! untuk merekrut lebih banyak divisi §YLegião Estrangeira§!."
 BRA_legion_name: "Legião Strangeira"
 BRA_south_american_research_cooperation: "Dewan Riset Amerika Latin"
 BRA_south_american_research_cooperation_desc: "Bukan rahasia lagi bahwa industri dan universitas kita di seluruh Amerika Latin tidak memiliki akses terhadap tingkat pendanaan yang sama dengan banyak pesaing kita. Namun, dengan berkolaborasi melalui lembaga penelitian bersama, kita dapat menghindari duplikasi upaya dan meningkatkan laju inovasi di wilayah kita."
 BRA_south_american_tech_sharing_group_tt: "Jika anggota faksi di Amerika Selatan setuju untuk bergabung:"
### ARGENTINA ###
ARG_preparation_for_the_elections: "Persiapan Pemilu"
ARG_preparation_for_the_elections_desc: "Masa jabatan Agustín Pedro Justo akan segera berakhir dan [ARG.GetName] siap menjadi presiden baru. Meskipun kandidat resmi pemerintah adalah Roberto María Ortiz, partai oposisi yang dipimpin oleh Marcelo T. de Alvear masih memiliki peluang untuk memperjuangkan [ARG.GetName] yang lebih demokratis. Preseden pemilu telah ditetapkan dan sekarang yang tersisa hanyalah melihat bagaimana hasilnya."
ARG_roberto_maria_ortiz: "Roberto Maria Ortiz"
ARG_roberto_maria_ortiz_desc: "Roberto María Ortiz telah memenangkan pemilu dengan suara mayoritas, yang berarti koalisi Concordancia melanjutkan pemerintahannya di [ARG.GetName]. Dalam pidato penerimaannya, ia menekankan pada ratifikasi keyakinannya pada demokrasi, menciptakan janji penghormatan terhadap kebebasan dan jaminan yang diberikan Konstitusi bagi masyarakat [ARG.GetAdjective]."
ARG_roberto_maria_ortiz_tt: "§Y$ARG_roberto_maria_ortiz$§! menjadi pemimpin §Y$ARG_neutrality_party_long$§!"
ARG_coup_imminent_tt: "§RMengambil fokus ini akan memulai misi jangka waktu Perbedaan Pendapat Militer.§!"
ARG_defense_and_democracy: "El Manifikasi ke Concordancia"
ARG_defense_and_democracy_desc: "Pertahanan dan Demokrasi adalah tujuan utama pemerintahan Ortiz, dengan keinginan presiden untuk membangun kembali [ARG.GetName] yang lebih demokratis di bawah pemerintahan Concordancia. Hal ini juga berarti peningkatan belanja militer, memastikan [ARG.GetName] dapat mempertahankan diri dengan baik."
ARG_crack_down_on_corruption: "Pemberantasan Korupsi"
ARG_crack_down_on_corruption_desc: "Meskipun terpilih dalam salah satu pemilu paling curang dalam sejarah [ARG.GetAdjective], Ortiz sepenuhnya berniat untuk menindak tingkat korupsi di dalam pemerintahan. Ironisnya, ini hanya membantu membuat [ARG.GetName] lebih kuat."
ARG_british_cooperation: "Ekonomi Inggris"
ARG_british_cooperation_desc: "Kerjasama yang lebih erat dengan [ENG.GetName] akan membantu meningkatkan perekonomian kita, terutama mengingat seberapa besar pengaruh yang mereka miliki selama pemilu lalu. Meningkatkan hubungan kita dengan [ENG.GetAdjective] akan berarti kesepakatan perdagangan yang lebih baik di masa depan."
ARG_the_castillo_cabinet: "Kabinet Castillo"
ARG_the_castillo_cabinet_desc: "Sayangnya karena penyakitnya semakin parah, Presiden Ortiz sudah bersiap untuk mengajukan pengunduran dirinya. Sebagai gantinya muncul mantan Wakil Presiden, Ramón Castillo. Ketika ketegangan meningkat di dalam faksi militer, Castillo harus memainkan perannya dengan hati-hati untuk memastikan kepresidenannya."
ARG_the_castillo_cabinet_tt: "§Y$ARG_ramon_castillo$§! menjadi pemimpin §Y$ARG_neutrality_party_long$§!"
ARG_import_substitution: "Substitusi Impor"
ARG_import_substitution_desc: "Ketika ketegangan meningkat di seluruh dunia, impor dari Eropa telah berkurang secara signifikan. Meskipun kita mempunyai hubungan dagang yang erat dengan [ENG.GetAdjective], perekonomian [ARG.GetAdjective] harus mulai melakukan substitusi impor dengan peningkatan industrialisasi."
ARG_emphasis_on_public_works: "Penekanan pada Pekerjaan Umum"
ARG_emphasis_on_public_works_desc: "Untuk membangun kembali negara kita dari reruntuhan Depresi Besar, kita perlu menginvestasikan lebih banyak waktu pada proyek pekerjaan umum. Jika kita menyalurkan lebih banyak uang ke infrastruktur lokal, hal ini tidak hanya akan membantu perekonomian kita, namun juga meningkatkan taraf hidup warga [ARG.GetAdjective]."
ARG_towards_a_greater_argentina: "Menuju [ARG.GetName] yang Lebih Besar"
ARG_towards_a_greater_argentina_desc: "Dengan upaya gabungan kami untuk meningkatkan kapasitas industri dan menekankan pendanaan kami pada pekerjaan umum dan infrastruktur, kami telah menciptakan landasan bagi [ARG.GetName] untuk benar-benar bangkit dari abu Depresi Hebat sebagai kekuatan yang sedang berkembang di benua Amerika Selatan!"
ARG_universidad_de_buenos_aires: "Universitas Buenos Aires"
ARG_universidad_de_buenos_aires_desc: "Sejak Reformasi Universitas tahun 1918, Universidad de Buenos Aires telah mampu mempertahankan lembaga dan otoritas yang diatur bersama dan dipilih secara demokratis. Sebagai universitas terbesar di [ARG.GetName], investasi dalam pengembangannya akan terus menghasilkan individu-individu berpendidikan tinggi yang mampu memimpin negara menuju masa depan."
ARG_consolidating_power: "Konsolidasi Kekuatan"
ARG_consolidating_power_desc: "Ramón Castillo menegaskan kepresidenannya dengan kebijakan yang lebih otoriter dibandingkan presiden sebelumnya. Tujuannya adalah untuk mengkonsolidasikan kekuasaannya melalui Partai Nasional Demokrat dan secara perlahan membubarkan Konkordansi. Hal ini tidak luput dari perhatian para pesaing politik dan militer."
ARG_maintain_the_status_quo: "Pertahankan Status Quo"
ARG_maintain_the_status_quo_desc: "Stabil saat dia pergi. Tidak ada kebutuhan langsung untuk terlalu mengguncang situasi setelah baru saja berkuasa. Jika Castillo ingin tetap berada di pemerintahan, ia harus lebih berhati-hati dalam menangani perbedaan pendapat yang tumbuh di faksi-faksi yang bersaing."
ARG_march_to_la_casa_rosada: "Berbaris ke Casa Rosada"
ARG_march_to_la_casa_rosada_desc: "Pemerintahan Castillo akhirnya bertindak terlalu jauh. Ketidakpuasan di kalangan militer mencapai titik kritis ketika presiden memerintahkan pengunduran diri Menteri Perang Pedro Pablo Ramírez karena melakukan pembicaraan dengan partai lawan UCR. Pimpinan militer mengumpulkan loyalisnya dan bersiap untuk berbaris menuju La Casa Rosada."
ARG_march_to_la_casa_rosada_tt: "§Y$ARG_pedro_pablo_ramirez$§! menjadi pemimpin §Y$ARG_militarist_party_long$§!"
ARG_military_coup_happens_tt: "Akan mengakhiri 'Misi Kudeta Militer yang Segera Terjadi' dengan membiarkan Militer mengambil alih."
ARG_intervenciones_federales: "Intervensi Federales"
ARG_intervenciones_federales_desc: "Ketika ancaman kudeta militer terhadap pemerintah kita semakin kuat, kita harus mengambil keputusan untuk memberlakukan Intervenciones Federales. Dengan meluangkan waktu untuk meloloskan badan legislatif ini di setiap negara bagian, [ARG.GetName] dapat lebih siap untuk bertahan melawan pemberontakan."
ARG_balancing_act: "UU Penyeimbang"
ARG_balancing_act_desc: "Dengan militer yang kini memegang kendali pemerintahan, kita bisa mengalihkan perhatian kita pada badai yang sedang terjadi di Eropa. Karena kekuatan Sekutu dan Poros sama-sama mempunyai hubungan dengan [ARG.GetName], kita harus berhati-hati untuk tidak mengasingkan salah satu pihak."
ARG_subdue_dissension: "Menundukkan Pertikaian"
ARG_subdue_dissension_desc: "Cukup sudah. Para pemberontak militer telah lepas kendali, dan kita harus menghentikan kudeta ini dengan tegas sebelum kudeta ini bangkit kembali. Hal ini mungkin akan menghambat pertumbuhan militer kita untuk jangka waktu singkat, namun akan bermanfaat jika kita memiliki pasukan yang loyal di pihak kita."
ARG_subdue_dissension_tt: "Anda harus telah menerapkan Intervenciones Federales setidaknya 3 kali untuk membuka fokus ini!"
ARG_the_american_push: "Dorongan Amerika"
ARG_the_american_push_desc: "Dedikasi kami untuk menyeimbangkan hubungan antara Sekutu dan Poros tidak luput dari perhatian [USA.GetName]. Mereka telah menyatakan dengan jelas bahwa mereka tidak puas dengan pandangan moderat kami dan mungkin meminta kami untuk memutuskan hubungan dengan Poros untuk selamanya."
ARG_juan_peron_elected: "Juan Peron"
ARG_juan_peron_elected_desc: "Setelah masa pergolakan politik, sudah saatnya [ARG.GetNameDef] memiliki pemimpin yang populer dan disukai. Dengan janji-janji yang menimbulkan rasa bangga dan aman pada masyarakat Argentina, Juan Perón telah menjadi pilihan yang jelas untuk presiden baru negara besar kita. Dengan istri tercinta Eva di sisinya, akhirnya tiba saatnya untuk mendukung [ARG.GetNameDef] melawan badai."
ARG_peronism: "Peronisme"
ARG_peronism_desc: "Ketika Perón berkuasa, ada dorongan untuk membentuk gerakan politik baru berdasarkan ide dan pengaruh Presiden sendiri. Peronisme, juga dikenal sebagai Justisialisme, telah menjadi perdebatan di kalangan penentang Perón, beberapa orang menyamakannya dengan fasisme, sementara yang lain menggambarkannya sebagai perpaduan samar antara nasionalisme, buruhisme, dan populisme."
ARG_help_the_allies: "Bantu Sekutu"
ARG_help_the_allies_desc: "Ketika perang semakin meningkat, tekanan dari [USA.GetName] semakin meningkat agar kita meninggalkan netralitas dan secara resmi bergabung dengan Sekutu. Jika kita memilih untuk melakukannya, maka kita secara resmi akan menjadi pemain dalam konflik global ini."
ARG_maintain_neutrality: "Tolak Sekutu"
ARG_maintain_neutrality_desc: "Meskipun ada tekanan dari kekuatan Sekutu, kami tidak berkepentingan untuk terlibat dalam perang mereka. Kita punya cukup hal untuk fokus di benua kita sendiri tanpa harus khawatir tentang konflik di Eropa. Jika ini berisiko menimbulkan embargo dari [USA.GetName] biarlah."
ARG_accept_german_advisors: "Terima Penasihat Jerman"
ARG_accept_german_advisors_desc: "Kami selalu menjaga hubungan dekat dengan [GER.GetName] dan kami tentunya dapat memperoleh manfaat dengan mengundang banyak orang cerdas mereka ke [ARG.GetName] untuk membantu kami mengembangkan tujuan kami lebih lanjut."
ARG_our_own_path: "Jalan Kita Sendiri"
ARG_our_own_path_desc: "Selama beberapa tahun terakhir kita telah berhasil fokus pada diri kita sendiri, menghindari konflik global yang lebih besar yang melanda negara-negara lain. [ARG.GetName] berdiri sendiri, dan kami akan membuat keputusan sendiri mengenai ke mana jalan kami akan membawa kami. Apakah kita akan terus sejahtera dan bertumbuh secara ekonomi atau apakah kita ingin mencapai tujuan ekspansi kita sendiri, masih belum diketahui."
ARG_change_of_course: "Perubahan Haluan"
ARG_align_with_the_monroe_doctrine: "Selaras dengan Doktrin Monroe"
ARG_align_with_the_monroe_doctrine_desc: "Selama bertahun-tahun, Doktrin Monroe telah menjadi kebijakan untuk mencegah campur tangan Eropa di Belahan Barat. Meskipun saat ini kita bersekutu dengan negara-negara Eropa, kita harus sepenuhnya sejalan dengan doktrin ini dan mencegah invasi di Amerika."
ARG_envoy_to_london: "Utusan ke London"
ARG_envoy_to_london_desc: "[ENG.GetName] telah menjadi salah satu sekutu terdekat kita selama bertahun-tahun, dan sekarang kita berdiri bersama mereka melawan musuh-musuh mereka, akan lebih bijaksana jika kita mengirim [ARG.GetAdjective] ke London untuk menjalin hubungan lebih dekat dengan pemerintah [ENG.GetAdjective]."
ARG_study_the_battle_of_the_river_plate: "Pelajari Pertempuran River Plate"
ARG_study_the_battle_of_the_river_plate_desc: "Pertempuran River Plate adalah pertempuran laut pertama dalam perang ini dan terjadi di wilayah Amerika Selatan. Kita harus melakukan yang terbaik untuk mempelajari pertempuran ini dan belajar bagaimana meningkatkan kemampuan angkatan laut kita dari situ."
ARG_islas_del_atlantico_sur: "Pulau Atlantik Sur"
ARG_islas_del_atlantico_sur_desc: "Kepulauan Falkland dan Georgia Selatan adalah wilayah kedaulatan [ENG.GetName] dan telah menjadi wilayah kedaulatan selama bertahun-tahun. Meskipun kami mengklaim pulau-pulau tersebut, yang terletak sangat dekat dengan [ARG.GetName], pulau-pulau tersebut tetap berada di bawah kekuasaan [ENG.GetAdjective]. Dengan aliansi baru kita dengan [ENG.GetName], mungkin kita bisa menegosiasikan pemindahan pulau-pulau tersebut ke dalam kendali kita. Bagaimanapun, kita akan bisa melindungi mereka dengan lebih baik dalam perang ini."
ARG_improving_the_islands: "Memperbaiki Kepulauan"
ARG_improving_the_islands_desc: "Kini setelah kita memiliki kepemilikan atas kepulauan Falkland dan Georgia Selatan, kita harus fokus pada peningkatan infrastruktur militer untuk memastikan bahwa pulau-pulau tersebut tetap berada di bawah kendali kita."
ARG_firmes_volamos: "Perusahaan Volamos"
ARG_firmes_volamos_desc: "Komunitas [ENG.GetAdjective] yang tinggal di [ARG.GetName] telah menawarkan untuk membayar satu skuadron sumbangan untuk Royal Air Force. Dengan mengirimkan skuadron ini ke [ENG.GetName] kita mungkin dapat bekerja sama lebih erat dengan RAF dan meningkatkan kemampuan udara kita sendiri."
ARG_extinguish_south_american_fascism: "Memadamkan Fasisme Amerika Selatan"
ARG_extinguish_south_american_fascism_desc: "Noda yang ditinggalkan oleh fasisme di dunia telah menyebar ke Amerika Selatan. Kita tidak bisa berdiam diri dan membiarkan hal ini terjadi. Kita harus bangkit dan menghadapi negara-negara yang telah meninggalkan demokrasi dan memilih kediktatoran otoriter sebelum demokrasi menyebar ke seluruh benua."
ARG_no_fascism_in_south_america_tt: "Dapatkan §Y$puppet_wargoal_focus$§! tujuan perang di semua negara §YFasis§! di §YAmerika Selatan§!"
ARG_american_allyship: "Sekutu Amerika"
ARG_american_allyship_desc: "Salah satu sekutu terkuat kita adalah raksasa yang kini terbangun di utara. Dalam semangat persatuan Pan-Amerika, kita harus mengirimkan utusan [ARG.GetAdjective] ke Washington D.C. untuk mengembangkan hubungan yang lebih erat dengan pemerintah [USA.GetAdjective]."
ARG_us_marine_program: "Program Pelatihan Kelautan A.S"
ARG_us_marine_program_desc: "Marinir AS adalah pasukan elit dan simbol kekuatan militer [USA.GetAdjective]. Ada banyak hal yang dapat kami pelajari dari mereka, dan kini kami bekerja lebih erat dengan [USA.GetName], kami memiliki peluang untuk melakukan hal tersebut."
ARG_us_marine_program_doctrine: "Pelatihan Marinir AS"
ARG_encourage_the_red_scare: "Ketakutan Merah"
ARG_encourage_the_red_scare_desc: "Tampaknya fasisme bukanlah satu-satunya hal yang harus kita khawatirkan. Pertumbuhan kekuatan [SOV.GetName] juga sama mendesaknya. Komunisme merupakan salah satu antitesis terhadap demokrasi, dan kita harus mewaspadai penyebarannya."
ARG_counter_intelligence_program: "Program Kontra Intelijen"
ARG_counter_intelligence_program_desc: "Tampaknya spionase merupakan pemain penting dalam perang ini, dan kita sangat tertinggal dalam program intelijen kita. Dengan adanya rumor mengenai operasi [GER.GetAdjective] di [ARG.GetName] dan negara-negara Amerika Selatan lainnya, kita harus bersiap untuk melawannya sesegera mungkin."
ARG_end_operation_bolivar: "Akhiri Operasi Bolivar"
ARG_end_operation_bolivar_desc: "Kami telah menemukan aliran misi spionase yang terus menerus disalurkan ke negara ini dari [GER.GetName]. Mereka dengan lucu menamakannya 'Operasi Bolivar'. Hal ini tidak dapat diterima, dan kita harus segera menghentikan semua operasi [GER.GetAdjectives] di [ARG.GetName]."
ARG_extinguish_south_american_communism: "Memadamkan Komunisme Amerika Selatan"
ARG_extinguish_south_american_communism_desc: "Ancaman Merah bukan sekadar hantu yang dibuat untuk menakut-nakuti anak-anak. Komunisme telah menyebar ke Amerika Selatan dan dengan cepat melanggar batas [ARG.GetName]. Demi demokrasi dan kebebasan, kita harus melakukan mobilisasi untuk menghentikan kebangkitan merah ini sebelum menyebar ke seluruh benua."
ARG_no_communism_in_south_america_tt: "Dapatkan §Y$puppet_wargoal_focus$§! tujuan perang di semua negara §YKomunis§! di §YAmerika Selatan§!"
ARG_banco_central_de_la_republica_argentina: "Banco Central de la República Argentina"
ARG_banco_central_de_la_republica_argentina_desc: "Didirikan berdasarkan enam Undang-undang Kongres pada tahun 1935, Banco Central de la República Argentina menggantikan dewan mata uang [ARG.GetName]. Presidennya, Ernesto Bosch, bertujuan untuk mengembangkan bank tersebut dan membantu menghidupkan perekonomian kita untuk membantu kita pada akhirnya mulai pulih secara finansial dari Depresi Besar."
ARG_reach_out_to_the_great_powers: "Jangkau Kekuatan Besar"
ARG_reach_out_to_the_great_powers_desc: "Salah satu pilihan yang kita miliki untuk membantu pertumbuhan ekonomi kita adalah dengan menjangkau negara-negara besar di dunia dan mengambil pinjaman untuk mempercepat pemulihan kita. Namun kita harus berhati-hati, karena kita tidak ingin terlilit hutang lebih banyak dari awal."
ARG_industrial_expansion: "Ekspansi Industri"
ARG_industrial_expansion_desc: "Industri yang kuat adalah tulang punggung perekonomian mana pun. Kita harus fokus pada penelitian untuk mengembangkan lebih banyak pilihan untuk ekspansi industri kita."
ARG_industrial_expansion_bonus: "Peningkatan Teknologi Industri"
ARG_production_initiative: "Inisiatif Produksi"
ARG_production_initiative_desc: "Peralatan produksi kami sudah ketinggalan jaman dan memerlukan perbaikan. Kita harus menyalurkan uang untuk mengembangkan teknologi produksi guna membantu mempercepat pembuatan komponen-komponen yang diperlukan untuk militer kita."
ARG_tech_initiative_bonus: "Inisiatif Teknologi"
ARG_economic_tax_reforms: "Reformasi Pajak Ekonomi"
ARG_economic_tax_reforms_desc: "Infrastruktur pedesaan kami sangat terbelakang. Jika kita melakukan reformasi pada kebijakan perpajakan yang ada saat ini, kita seharusnya bisa lebih menekankan pada pembangunan lahan pertanian yang belum berkembang."
ARG_economic_reactivation_act: "Undang-Undang Reaktivasi Ekonomi"
ARG_economic_reactivation_act_desc: "Tindakan Reaktivasi Ekonomi akan memprioritaskan pembangunan infrastruktur sipil, meningkatkan kecepatan pembangunan pabrik baru di kota-kota."
ARG_immigration_wave: "Gelombang Imigrasi"
ARG_immigration_wave_desc: "[ARG.GetName] adalah negara yang dibangun berdasarkan imigrasi. Meskipun sebagian besar penduduk kami berasal dari Spanyol, kami juga mempunyai populasi orang Jerman dan bahkan Welsh dalam jumlah besar di wilayah kami. Kita dapat meningkatkan perekonomian kita dengan mendorong migrasi dari negara-negara ini ke [ARG.GetName]."
ARG_develop_civilian_economy: "Mengembangkan Ekonomi Sipil"
ARG_develop_civilian_economy_desc: "Seiring dengan semakin fokusnya kami pada kota, penting bagi kami untuk menyediakan fasilitas yang dibutuhkan oleh masyarakat [ARG.GetName]. Jika kita bisa membuat rakyat kita bahagia, hal itu hanya akan membuat kita lebih kuat. Berinvestasi dalam pengembangan segera lebih banyak pabrik adalah jalan ke depan."
ARG_the_argentinian_metropole: "Metropole Argentina"
ARG_the_argentinian_metropole_desc: "Buenos Aires akan berdiri sebagai simbol kehidupan metropolitan sejati di [ARG.GetName]. Perkembangan kota-kota kita telah membantu kita mendorong masyarakat untuk hidup bahagia dan produktif. Dengan demikian, kita kini mengalami ledakan populasi dan tingkat pendidikan yang lebih tinggi di seluruh negeri."
ARG_invest_in_the_roads: "Berinvestasi di Jalan"
ARG_invest_in_the_roads_desc: "Infrastruktur di [ARG.GetName] sangat membutuhkan perbaikan. Jika kita berupaya untuk mendanai jalan-jalan kita, hal ini akan membantu interkonektivitas lokal di setiap provinsi."
ARG_invest_in_the_railways: "Berinvestasilah di Perkeretaapian"
ARG_invest_in_the_railways_desc: "Dengan sejarah perkembangan perkeretaapian sejak [ENG.GetName], masuk akal jika kami melanjutkan proses modernisasi perkeretaapian kami. Hal ini akan membantu menghubungkan seluruh negara melalui satu jaringan, dan menjadikan [ARG.GetName] negara yang lebih bersatu."
ARG_expand_steel_extraction: "Perluas Ekstraksi Baja"
ARG_expand_steel_extraction_desc: "Pertambangan telah menjadi industri besar bagi [ARG.GetName] sejak konsepsinya sebagai negeri Perak. Namun, perhatian kami lebih terfokus pada perluasan ekstraksi baja di wilayah pegunungan kami."
ARG_expand_aluminum_extraction: "Perluas Ekstraksi Aluminium"
ARG_expand_aluminum_extraction_desc: "Aluminium merupakan sumber daya penting untuk pengembangan kekuatan kendaraan kita. Kita harus mengembangkan operasi penambangan dan meningkatkan tingkat ekstraksi logam bermanfaat ini."
ARG_yacimientos_petroliferos_fiscales: "Skala Fiskal Yacimientos Petrolíferos"
ARG_yacimientos_petroliferos_fiscales_desc: "Yacimientos Petrolíferos Fiscales adalah perusahaan energi milik negara [ARG.GetAdjective] yang bergerak dalam eksplorasi, produksi, penyulingan, dan komersialisasi minyak bumi. Kita harus menginvestasikan lebih banyak uang ke perusahaan agar kita bisa mengendalikan produksi minyak dengan lebih baik."
ARG_yacimientos_petroliferos_fiscales_tt: "Membuka Keputusan: §YEksploitasi Vaca Muerta§!"
ARG_rapid_urbanization: "Urbanisasi yang Pesat"
ARG_rapid_urbanization_desc: "Banyak [ARG.GetName] yang tersisa sebagai lahan pedesaan, namun jalan ke depan di abad ke-20 adalah melalui urbanisasi. Dengan mengembangkan kota-kota kita, kita dapat meyakinkan lebih banyak orang untuk pindah ke sana, yang berarti bahwa kita akan memperoleh peningkatan yang signifikan dalam jumlah tenaga kerja di pusat-pusat industri kita."
ARG_agricultural_improvements: "Perbaikan Pertanian"
ARG_agricultural_improvements_desc: "Pertanian telah menjadi bagian integral dari pengembangan [ARG.GetName] selama bertahun-tahun dan banyak orang mengandalkan cara hidup ini untuk mencari nafkah. Ini adalah peluang besar untuk meningkatkan infrastruktur pertanian di komunitas pedesaan kita."
ARG_military_production_lines: "Jalur Produksi Militer"
ARG_military_production_lines_desc: "Dengan meningkatnya krisis di seluruh dunia, merupakan ide cerdas untuk berinvestasi pada masa depan produksi militer kita. Jika kita membangun lebih banyak kompleks pabrik yang diperuntukkan bagi perangkat keras militer, maka kita akan mempersiapkan diri sebaik mungkin menghadapi badai yang akan datang."
ARG_capitalize_the_beef_industry: "Memanfaatkan Industri Daging Sapi"
ARG_capitalize_the_beef_industry_desc: "[ARG.GetAdjective] daging sapi merupakan salah satu ekspor utama kita, khususnya ke [ENG.GetNameDef]. Kita harus memanfaatkan hal ini, memperluas kemampuan peternakan kita dan memastikan bahwa daging lezat kita dikenal di seluruh dunia!"
ARG_revisit_the_roca_runciman_treaty: "Tinjau kembali Perjanjian Roca-Runciman"
ARG_revisit_the_roca_runciman_treaty_desc: "Perjanjian Roca-Runciman telah berlaku sejak tahun 1933, memastikan ekspor daging sapi kita dengan [ENG.GetName]. Namun, dengan perkembangan perekonomian kita saat ini, mungkin sudah waktunya bagi kita untuk menegosiasikan perjanjian baru dengan [ENG.GetAdjective] dan mendapatkan kesepakatan perdagangan yang lebih baik."
ARG_a_new_trading_partner: "Merevisi Perjanjian Roca-Runciman"
ARG_a_new_trading_partner_desc: "Perjanjian Roca-Runciman telah berlaku sejak tahun 1933, memastikan ekspor daging sapi kita dengan [ENG.GetName]. Namun, dengan perkembangan terkini di seluruh dunia, adalah bijaksana untuk membatalkan perjanjian ini dan membuat perjanjian yang lebih menguntungkan dengan sekutu baru kita."
ARG_develop_the_electricity_sector: "Mengembangkan Sektor Ketenagalistrikan"
ARG_develop_the_electricity_sector_desc: "Sektor ketenagalistrikan kita perlu ditingkatkan, oleh karena itu sebaiknya kita memfokuskan sumber daya kita untuk meneliti teknologi lebih lanjut guna membantu pengembangan kelistrikan kita."
ARG_invest_in_construction_guilds: "Berinvestasi di Serikat Konstruksi"
ARG_invest_in_construction_guilds_desc: "Serikat konstruksi adalah tulang punggung pembangunan perkotaan. Tugas kami selanjutnya adalah menyalurkan dana ke serikat [ARG.GetName] untuk memastikan bahwa teknologi konstruksi kami mampu bersaing dengan teknologi konstruksi lainnya di dunia."
ARG_technical_schools: "Sekolah Teknik"
ARG_technical_schools_desc: "Dengan mengembangkan sekolah teknik, kita dapat secara aktif meningkatkan jumlah penasihat teknis yang dapat kita pekerjakan di seluruh pemerintahan. Melanjutkan jenis pendidikan ini hanya akan membantu meningkatkan kemampuan ekonomi kita."
ARG_work_with_the_nationalists: "Bekerja Dengan Kaum Nasionalis"
ARG_work_with_the_nationalists_desc: "Mungkin ini saatnya kita mengambil pendekatan berbeda dalam pemerintahan. Bagaimanapun juga, pertumbuhan korupsi yang telah mengganggu pemilu selama bertahun-tahun jelas tidak menunjukkan tanda-tanda melambat. Jika kita bekerja sama dengan entitas nasionalis di negara ini, maka kita mungkin memiliki peluang lebih besar untuk memulihkan ketertiban di [ARG.GetNameDef]."
ARG_end_the_coup_tt: "§GMengambil fokus ini akan mengakhiri Misi Kudeta Militer.§!"
ARG_cut_ties_with_britain: "Putuskan Hubungan Dengan Inggris"
ARG_cut_ties_with_britain_desc: "Meskipun benar bahwa negara kepulauan [ENG.GetNameDef] telah menjadi mitra dagang terdekat kami, perjanjian mereka mengenai daging sapi hanya menghambat kemampuan kami untuk menafkahi negara mereka. Kita harus mengobarkan sentimen anti-Inggris di seluruh masyarakat dan membuktikan kepada dunia bahwa kita bisa berdiri sendiri tanpa kekuatan kolonial Eropa."
ARG_support_radical_nationalism: "Mendukung Nasionalisme Radikal"
ARG_support_radical_nationalism_desc: "Sejak kami melepaskan belenggu Kekaisaran Spanyol, kami telah berupaya untuk mendefinisikan identitas [ARG.GetAdjective]. Kami telah berkembang dan bertahan di sini dan membuktikan untuk selamanya bahwa tanah ini adalah milik kami. Mari kita memberdayakan identitas [ARG.GetAdjective] dan mengingatkan semua orang siapa pembangkit tenaga listrik Amerika Selatan yang sebenarnya."
ARG_corporatism: "Korporatisme"
ARG_corporatism_desc: "Korporatisme adalah gagasan mendasar fasisme dan merupakan sesuatu yang harus kita terapkan sesegera mungkin. Namun untuk melakukan hal ini, kita harus bergantung pada elit dan talenta lokal serta membuka pintu bagi kemajuan dalam hierarki fasis baru [ARG.GetNameDef]. Inilah cara kita memimpin negara kita menuju masa depan yang penuh loyalitas dan efisiensi."
ARG_reestablish_ligas_patrioticas: "Membangun kembali Ligas Patrióticas"
ARG_reestablish_ligas_patrioticas_desc: "Ligas Patrióticas adalah organisasi sipil parapolisi sayap kanan yang beroperasi di [ARG.GetNameDef] selama tahun 1920-an. Sejak itu, mereka semua telah bubar. Mungkin inilah saatnya untuk menghidupkan kembali gerakan ini untuk membantu kita menegakkan ketertiban di tengah merajalelanya korupsi di negara kita."
ARG_fascist_researchers: "Peneliti Fasis"
ARG_fascist_researchers_desc: "Ketika negara kita perlahan-lahan bergerak menuju jalur fasisme, adalah bijaksana untuk berinvestasi dalam perluasan penelitian nasional kita. Bagaimanapun, membangun ketertiban dan loyalitas di [ARG.GetNameDef] hanyalah permulaan. Jika semua berjalan sesuai rencana, maka kita mungkin memerlukan teknologi militer yang jauh lebih kuat daripada yang kita miliki saat ini."
ARG_support_the_spanish_coup: "Mendukung Kudeta Spanyol"
ARG_support_the_spanish_coup_desc: "Saudara-saudara kita di Spanyol saat ini sedang terlibat dalam perang saudara berdarah demi masa depan negara mereka. Gagasan Franco tentang pemerintahan yang dikendalikan militer sangat sejalan dengan gagasan kita. Kita harus segera mengirimkan bantuan, dan menunjukkan kepada dunia kekeliruan demokrasi."
ARG_demand_spanish_compensation: "Menuntut Kompensasi Dari Spanyol"
ARG_demand_spanish_compensation_desc: "Saudara-saudara kita di Spanyol telah berhasil merebut kembali kekuasaan yang menjadi hak mereka. Sekarang, mungkin kita harus mengingatkan mereka bahwa kita berperan dalam kesuksesan mereka, dan inilah saatnya untuk membayar!"
ARG_demand_spanish_compensation_tt: "Mengirimkan acara ke §Y[SPA.GetNameDef]§! menuntut mereka memberi kami §YEquatorial Guinea§!. Mereka akan lebih mungkin menerima jika mereka mempunyai pendapat §GTinggi§! tentang kita!"
ARG_argentinian_volunteers_in_spain_flag: "§Y[ARG.GetName]§! telah mengirimkan relawan ke §Y[SPA.GetName]§!"
ARG_invite_spanish_nationalists: "Undang Nasionalis Spanyol"
ARG_invite_spanish_nationalists_desc: "Sayangnya, kudeta Franco berhasil digagalkan dan perang saudara secara resmi telah berakhir. Ribuan Nasionalis Spanyol kini berusaha meninggalkan semenanjung Iberia untuk mencari rumah yang lebih sesuai dengan ideologi mereka. Mengingat hubungan historis antara kedua negara, kita harus membuka pintu bagi mereka untuk membantu gerakan nasionalis [ARG.GetNameDef] yang sedang berkembang."
ARG_encourage_german_investments: "Mendorong Investasi Jerman"
ARG_encourage_german_investments_desc: "Meskipun dianggap oleh banyak orang sebagai negara terpinggirkan di Eropa, [GER.GetNameDef] telah menjadi pusat kekuatan industri dan militer. Kami selalu bersahabat dengan [GER.GetAdjective] karena banyaknya [GER.GetAdjective] orang yang tinggal di [ARG.GetNameDef]. Kita harus menjangkau mereka dan melihat apakah mereka bersedia berinvestasi dalam gerakan nasionalis kita yang sedang berkembang."
ARG_german_investments_bonus: "Investasi Jerman"
ARG_encourage_italian_argentine_diplomacy: "Diplomasi Italia-Argentina"
ARG_encourage_italian_argentine_diplomacy_desc: "[ITA.GetAdjective] fasisme telah menjadi model standar yang digunakan oleh partai nasionalis utama [ARG.GetNameDef] dalam mencontohkan kebijakan mereka. Kita harus mengirim utusan ke [ITA.capital.GetCapitalVictoryPointName] dan membuka saluran diplomasi baru antar negara kita. Ini akan menjadi peluang besar untuk membuat perjanjian penelitian sehingga kedua negara dapat memperoleh manfaat dari kemajuan teknologi yang pesat."
ARG_guardia_nacional: "Penjaga Nasional"
ARG_guardia_nacional_desc: "Waktunya telah tiba bagi kita untuk meruntuhkan Concordancia dan sebaliknya menempatkan [ARG.GetNameDef] di bawah perlindungan pemerintah militer. Guardia Nacional memperjuangkan kedaulatan kami selama Perang Kemerdekaan Argentina dan sekarang, di bawah kepemimpinan Pedro Pablo Ramírez, mereka akan membawa [ARG.GetNameDef] menuju era kemakmuran baru."
ARG_union_nacional_fascista: "Persatuan Nasional Fasis"
ARG_union_nacional_fascista_desc: "Melalui korupsi dan pertikaian yang tiada henti, jelas bahwa kepemimpinan Concordancia tidak ada gunanya. Sudah waktunya untuk perubahan besar dalam politik [ARG.GetAdjective]. Nimio de Anquín telah mendapatkan popularitas yang cukup sebagai pemimpin Unión Nacional Fascista dan siap memimpin negara dan mengembalikan rasa bangga nasionalis kepada [ARG.GetNameDef]."
ARG_rapid_militirization: "Militerisasi yang Cepat"
ARG_rapid_militirization_desc: "Kini setelah kita mempunyai pemerintahan militer yang kuat, kita dapat mulai mempertimbangkan tujuan ekspansi kita. Sudah waktunya untuk memperluas model industri militer kita dan meningkatkan produksi senjata dan pasukan. Dunia harus bersiap menghadapi kekuatan [ARG.GetNameDef]."
ARG_argentine_nationalism: "Nasionalisme Argentina"
ARG_argentine_nationalism_desc: "Semangat para penakluk mengalir dalam diri kita dan kita akan pintar jika menjunjung tinggi nama mereka dalam menaklukkan benua Amerika. Mari kita kumpulkan mereka yang ingin berjuang dan mati demi negaranya dan mempersiapkan industri kita untuk produksi massal senjata dan mesin. [ARG.GetNameDefCap] bersiap berperang!"
ARG_war_division: "Divisi Perang"
ARG_war_division_desc: "Semua perang dibangun atas dasar persiapan yang baik. Saat kita membangun kabinet dan memproduksi mesin perang, kita semakin dekat dengan tujuan ekspansionis kita setiap hari."
ARG_argentina_first: "Argentina Pertama"
ARG_argentina_first_desc: "Melalui pertimbangan yang cermat, kami telah memutuskan bahwa tindakan terbaik untuk masa depan [ARG.GetNameDef] adalah dengan menghindari konflik yang berkembang di Eropa dan sebaliknya fokus pada kebutuhan [ARG.GetNameDef] akan pertumbuhan dan stabilitas. Mari kita membentuk faksi kita sendiri dan berdiri sendiri melawan dunia."
ARG_join_the_axis: "Bergabunglah dengan Poros"
ARG_join_the_axis_desc: "Kami berhutang banyak kepada Kekuatan Poros atas kemampuan kami menempatkan [ARG.GetNameDef] di bawah kepemimpinan yang kuat dan stabil. Oleh karena itu, kita harus menjangkau mereka dan meminta untuk bergabung dalam perang mereka, membantu menyebarkan fasisme ke seluruh dunia!"
ARG_dominate_the_south: "Mendominasi Selatan"
ARG_dominate_the_south_desc: "Dengan banyaknya musuh yang mengelilingi kita di benua ini, sangatlah penting bagi kita untuk bertindak dengan tangan besi dan menghancurkan segala potensi ancaman sebelum ancaman tersebut muncul. Mari kita tunjukkan kepada mereka siapa kekuatan paling dominan di Amerika Selatan."
ARG_preparations_for_war: "Persiapan Perang"
ARG_preparations_for_war_desc: "Meskipun kita mungkin siap berperang saat ini juga, situasi pasokan di perbatasan kita menunjukkan hal yang berbeda. Dengan meningkatkan jalur pasokan, kita memastikan musuh kita dikalahkan dengan cepat."
ARG_conquer_paraguay: "Taklukkan [PAR.GetNameDefCap]"
ARG_conquer_paraguay_desc: "Tidak ada ruang untuk negosiasi. Negara [PAR.GetNameDef] menghalangi kita untuk mendominasi Amerika Selatan. Daripada mengirimkan ultimatum, yang terbaik adalah kita mengambil tindakan dan menyatakan perang terhadap tetangga kita."
ARG_paraguayan_ultimatum: "[PAR.GetAdjective] Ultimatum"
ARG_paraguayan_ultimatum_desc: "[PAR.GetNameDefCap] adalah wilayah strategis yang sangat penting untuk tujuan perang kita melawan wilayah lain di benua ini. Mereka bisa saja setuju untuk bekerja di bawah kita atau dipaksa secara militer untuk tunduk di bawah bendera kita. Pilihan ada di tangan mereka. Kirim ultimatumnya."
ARG_uraguayan_ultimatum.tt: "([URG.GetFlag]§Y[URG.GetNameDefCap]§!) Mendapat event '§Y$ARG_political_events.19.t$§!' yang akan menuntut mereka menjadi §Yboneka§! kita. Mereka akan lebih mungkin menerima jika mereka mempunyai §YPendapat yang tinggi tentang kita§!"
ARG_paraguayan_ultimatum.tt: "([PAR.GetFlag]§Y[PAR.GetNameDefCap]§!) Mendapat event '§Y$ARG_political_events.19.t$§!' yang akan menuntut mereka menjadi §Yboneka§! kita. Mereka akan lebih mungkin menerima jika mereka mempunyai §YPendapat yang tinggi tentang kita§!"
ARG_chilean_ultimatum.tt: "([CHL.GetFlag]§Y[CHL.GetNameDefCap]§!) Mendapat event '§Y$ARG_political_events.19.t$§!' yang akan menuntut mereka menjadi §Yboneka§! kita. Mereka akan lebih mungkin menerima jika mereka mempunyai §YPendapat yang tinggi tentang kita§!"
ARG_revive_the_colonial_plan: "Menghidupkan Kembali Rencana Kolonial"
ARG_revive_the_colonial_plan_desc: "Dalam upaya untuk mendapatkan pijakan di Amerika Selatan, [GER.GetNameDef] menjalankan rencana untuk mendirikan koloni di [URG.GetNameDef]. Namun, rencana tersebut tidak pernah membuahkan hasil. Kita harus mengambil tindakan sendiri untuk menghidupkan kembali rencana ini, dan boneka [URG.GetNameDef] atas nama teman-teman fasis kita."
ARG_conquer_uruguay: "Membangun Pijakan"
ARG_conquer_uruguay_desc: "Sementara rezim baru kita berkuasa, kita harus memutuskan bagaimana kita harus bertindak terhadap negara-negara tetangga kita yang lebih kecil. [URG.GetNameDefCap] selalu menjadi wilayah yang diperebutkan, dan merebutnya dengan paksa akan menunjukkan kepada seluruh dunia bahwa kita tidak boleh diremehkan."
ARG_reach_out_to_chile: "Hubungi [CHL.GetNameDefCap]"
ARG_reach_out_to_chile_desc: "[CHL.GetNameDefCap], dibandingkan dengan tetangga dekat kita lainnya, jauh lebih besar dan lebih kuat. Adalah bijaksana untuk menjangkau mereka dan menawarkan kesempatan untuk bersekutu dengan kita. Mungkin jika kita mengembalikan wilayah yang mereka dambakan kepada mereka, kemungkinan besar mereka akan menerimanya"
ARG_reach_out_to_chile_tt: "Mereka akan lebih mungkin menerima jika mereka mempunyai §YPendapat yang tinggi terhadap kita§! dan §YFasis§! atau §YNon-Blok§!"
ARG_reach_out_to_chile_2_tt: "Jika mereka §Ymenerima§!, maka kami akan memberikan §Y[954.GetName]§! dan §Y[953.GetName]§! kepada mereka."
ARG_chilean_ultimatum: "[CHL.GetAdjective] Ultimatum"
ARG_chilean_ultimatum_desc: "Sudah terlalu lama kita mengalami ketegangan perbatasan dengan [CHL.GetNameDef] dan jika kita benar-benar ingin mengamankan diri kita sebagai kekuatan dominan di Amerika Selatan, maka kita perlu menetralisirnya sesegera mungkin. Mereka bisa bergabung dengan kita secara damai, atau kita akan menyerbu tanah mereka dan mengklaim tanah kita."
ARG_the_old_enemy: "Musuh Lama"
ARG_the_old_enemy_desc: "Akhirnya tiba saatnya bagi kita untuk mengalihkan perhatian kita ke wilayah utara, tempat bayang-bayang rival tertua kita membayangi kita. [BRA.GetNameDefCap] selalu menjadi musuh terbesar kita di benua ini. Sudah saatnya kita menyalakan kembali semangat Perang Cisplatine dan membuka jalan penaklukan menuju [BRA.capital.GetCapitalVictoryPointName]."
ARG_south_american_unity: "Persatuan Amerika Selatan"
ARG_south_american_unity_desc: "Sekarang kita telah memperoleh wilayah di seluruh benua, sekarang saatnya kita mengambil nama baru untuk melambangkan fakta bahwa kita bukan hanya [ARG.GetNameDef], tapi Amerika Selatan secara keseluruhan. Kita akhirnya berhasil menyatukan negara-negara yang bertikai ini di bawah satu bendera yang kuat."
ARG_integrate_operation_bolivar: "Integrasikan Operasi Bolivar"
ARG_integrate_operation_bolivar_desc: "Untuk sementara waktu, [GER.GetNameDef] telah menjalankan beberapa misi spionase di seluruh Amerika Selatan. Perintah ini, yang diberi nama 'Operasi Bolivar', telah berlaku di [ARG.GetNameDef]. Kini setelah kita menjalin hubungan baik dengan [GER.GetAdjective], kita dapat berupaya mengintegrasikan program ini dan mendorong penyebarannya ke seluruh benua."
ARG_release_hellmuth: "Lepaskan Hellmuth"
ARG_release_hellmuth_desc: "Osmar Hellmuth adalah [ARG.GetAdjective] asal [GER.GetAdjective] yang, di bawah pemerintahan lama kita, ditangkap setelah diketahui menjadi kolaborator dengan pemerintah fasis di [GER.GetNameDef]. Kita harus segera membebaskannya, dan mempekerjakan dia di badan intelijen kita sendiri."
ARG_anti_american_propaganda: "Propaganda Anti-Amerika"
ARG_anti_american_propaganda_desc: "[USA.GetNameDefCap] adalah benteng demokrasi di Amerika dan tentu saja, menentang segala sesuatu yang telah kita upayakan. Jika kita ingin mengatasi masalah ini, maka kita perlu menggalang dukungan dari masyarakat. Untuk melakukan hal ini, kita dapat mengobarkan sentimen Anti-Amerika di seluruh negeri. Dengan semangat juang yang ada di belakang kita, kita akan bisa membenarkan serangan terhadap raksasa di utara."
ARG_the_war_machine: "Mesin Perang"
ARG_the_war_machine_desc: "Ketika rezim baru kita semakin berkuasa, kita perlu memiliki kekuatan militer yang bisa menandinginya. Penting bagi kita untuk berinvestasi dalam meningkatkan lebih banyak kompleks industri militer di seluruh negeri dan tidak hanya di [ARG.capital.GetCapitalVictoryPointName]. Biarkan mesin perang [ARG.GetAdjective] bangkit!"
ARG_secure_the_borders: "Amankan Perbatasan"
ARG_secure_the_borders_desc: "Adalah bijaksana bagi kita untuk memastikan bahwa perbatasan kita saat ini tetap aman terhadap musuh-musuh kita yang paling berbahaya. Kita harus berupaya memasang garis pertahanan di sepanjang perbatasan bersama kita dengan [CHL.GetNameDef] dan [BRA.GetNameDef] serta melatih para pemimpin militer kita untuk berperang di banyak hutan yang menyelimuti wilayah utara. Perlindungan adalah yang terpenting!"
ARG_argentine_island_sovereignty: "Kedaulatan Pulau Argentina"
ARG_argentine_island_sovereignty_desc: "Sudah terlalu lama Kepulauan Atlantik Selatan dikuasai Inggris meskipun jelas-jelas berada dalam wilayah pengaruh [ARG.GetNameDef]. Kita harus bangkit dan mengklaim apa yang menjadi hak kita, meskipun itu berarti menyatakan perang terhadap [ENG.GetNameDef]. Pulau-pulau ini akan menjadi [ARG.GetAdjective] dengan cara apa pun yang diperlukan!"
ARG_argentine_island_sovereignty.tt: "Jika saat ini tidak berperang dengan ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!), kita akan mendapatkan sasaran perang §YConquer§! melawan mereka."
ARG_a_call_to_reform: "Panggilan untuk Reformasi"
ARG_a_call_to_reform_desc: "Sudah jelas dalam satu dekade terakhir bahwa politik di [ARG.GetNameDef] kacau balau. Demokrasi langsung mati bersama Hipólito Yrigoyen dan hanya menimbulkan kekacauan dan korupsi di dalam pemerintahan [ARG.GetAdjective]. Sudah saatnya kita mulai melakukan reformasi yang cepat dan perlu untuk mengembalikan negara kita ke jalur yang benar."
ARG_invite_ghioldi_back_to_argentina: "Undang Ghioldi Kembali ke Argentina"
ARG_invite_ghioldi_back_to_argentina_desc: "Rodolfo Ghioldi adalah seorang komunis terkemuka di [ARG.GetNameDef] yang sayangnya harus meninggalkan negara itu karena tuntutan dari pemerintah kami. Saat kita mulai mengubah sikap ke arah kiri di [ARG.GetNameDef], mungkin inilah saatnya kita memberikan pengampunan kepada Ghioldi dan mengundangnya kembali ke tanah airnya."
ARG_invite_ghioldi_back_tt: "§YRodolfo Ghioldi§! akan kembali ke [ARG.GetFlag]§Y[ARG.GetNameDef]§! dan tersedia sebagai §YAdvisor§!. Sebagai pemain utama dalam Komunisme Argentina, ia akan mampu memimpin §YRevolution§! di masa depan."
ARG_ghioldi_returns: "Rodolfo Ghioldi telah kembali ke [ARG.GetNameDef]"
ARG_support_the_spanish_republicans: "Dukung Partai Republik Spanyol"
ARG_support_the_spanish_republicans_desc: "Saudara-saudara kita di Spanyol terjebak dalam konflik berdarah di mana mereka melawan rekan senegaranya dalam upaya mencegah rezim fasis mengambil alih tanah mereka. Jatuhnya Spanyol ke dalam fasisme tidak sejalan dengan kepentingan kita dan kita harus melakukan yang terbaik untuk menunjukkan dukungan terhadap hubungan budaya terdekat kita di Eropa."
ARG_legitimize_the_PCA: "Melegitimasi PCA"
ARG_legitimize_the_PCA_desc: "Partido Comunista de la Argentina adalah partai komunis utama di [ARG.GetNameDef]. Sejak awal berdirinya, partai tersebut mempertahankan keselarasan dengan Partai Komunis Uni Soviet, sering kali menimbulkan perselisihan dengan sayap kiri [ARG.GetNameDef] lainnya. Namun, kini kita membutuhkan perubahan drastis untuk mengakhiri Dekade Terkenal, mungkin inilah saatnya untuk melegitimasi partai ini di pemerintahan [ARG.GetAdjective]."
ARG_reach_out_to_the_soviet_union: "Hubungi [SOV.GetNameDef]"
ARG_reach_out_to_the_soviet_union_desc: "Bukan rahasia lagi bahwa kita perlu melepaskan diri dari bentuk pemerintahan lama dan melakukan perubahan cepat untuk membentuk masa depan [ARG.GetNameDef]. Karena hal ini dapat mengakibatkan revolusi berdarah, kita harus menjangkau negara yang pernah mengalami hal ini sebelumnya. Berhubungan dengan [SOV.GetNameDef] dapat menjamin bantuan jika kita naik ke tampuk kekuasaan disertai dengan kekerasan yang disayangkan namun perlu dilakukan."
ARG_reach_out_to_the_soviet_union_tt: "Mengambil fokus ini akan membuka templat divisi §YVanguardia Socialista§! ketika §Yperang saudara§! pecah dan akan merekrut §Ylima§! unit Vanguardia Socialista di §Y[955.GetName]§!."
ARG_unite_the_workers_of_argentina: "Satukan Pekerja Argentina"
ARG_unite_the_workers_of_argentina_desc: "Jika kita ingin mengubah [ARG.GetNameDef] menjadi lebih baik, kita harus meyakinkan kaum proletar di negara kita bahwa perbaikan radikal diperlukan untuk mengakhiri penderitaan mereka. Mari kita satukan pekerja dari semua profesi dan tunjukkan kepada pemerintah bahwa status quo harus diakhiri!"
ARG_viva_la_revolucion: "Viva La Revolusi"
ARG_viva_la_revolucion_desc: "Sudah waktunya bagi kita untuk menyampaikan ultimatum kepada pemerintah [ARG.GetNameDef] dan membawa angin perubahan yang diperlukan untuk mengubah bangsa kita menjadi negara sosialis sejati. Jika semuanya berjalan baik, maka ini akan berakhir dengan damai dan pemerintahan akan berpindah tangan dengan mudah. Namun, selalu ada kemungkinan mereka tidak akan menyerah tanpa perlawanan."
ARG_communist_civil_war_tt: "§RAkan memicu perang saudara di§! §Y[ROOT.GetFlag][ROOT.GetName]§! §Rantara Komunis dan pemerintahan saat ini!§!"
ARG_forge_our_own_future: "Bangun Masa Depan Kita Sendiri"
ARG_forge_our_own_future_desc: "Dengan kesuksesan besar revolusi, sekarang saatnya memutuskan bagaimana kita ingin membentuk masa depan [ARG.GetNameDef]. Kamerad Fanny Edelman telah menjadi pendukung setia PCA selama bertahun-tahun, dan telah mengambil langkah maju dalam memperjuangkan hak-hak perempuan di [ARG.GetNameDef]. Banyak yang melihatnya sebagai orang yang tepat untuk memimpin negara kita mulai saat ini, membawa [ARG.GetNameDef] ke era baru kemakmuran."
ARG_women_in_industry: "Perempuan di Industri"
ARG_women_in_industry_desc: "Sudah terlalu lama perempuan diharapkan untuk tinggal di rumah dan mengurus keluarga. Jika seorang perempuan mampu menjadi pemimpin negara kita, maka sudah sepantasnya mereka diperbolehkan bekerja di industri lain juga. Hal ini hanya akan membantu masa depan perekonomian [ARG.GetNameDef], karena hal ini akan memperluas angkatan kerja kita secara signifikan."
ARG_support_the_farmers: "Dukung Petani"
ARG_support_the_farmers_desc: "[ARG.GetNameDefCap] selalu memiliki sektor pertanian yang kuat, khususnya daging sapi yang populer di seluruh dunia. Di bawah pemerintahan kita sebelumnya, banyak komunitas petani yang tidak mendapat dukungan apa pun. Inilah waktunya untuk melakukan perubahan dan meningkatkan pendanaan pertanian kita serta mendukung pekerja proletariat di pedesaan [ARG.GetNameDef]."
ARG_socialist_volunteers: "Relawan Sosialis"
ARG_socialist_volunteers_desc: "Ada banyak gerakan sosialis lain di seluruh dunia yang berjuang mewujudkan impian revolusi mereka sendiri. Jika diperlukan, kita harus menawarkan kekuatan kita sendiri untuk membantu negara-negara yang ingin mengikuti jalur merah yang sama dengan kita. Menjadi picik bukan berarti kita harus mengabaikan penderitaan kawan-kawan internasional kita."
ARG_the_buenos_aires_conference: "Konferensi Buenos Aires"
ARG_the_buenos_aires_conference_desc: "Kini, setelah kita mulai menstabilkan negara, kita harus berhati-hati agar kepemimpinan kita tidak memicu jebakan kediktatoran seperti yang dialami pemerintahan kita sebelumnya. Oleh karena itu, sebuah konferensi sosialis telah diadakan di Buenos Aires, dengan tujuan untuk membahas dan memilih pemimpin berikutnya untuk [ARG.GetNameDef]."
ARG_the_buenos_aires_conference_1_tt: "Mendapat acara '§YKonferensi Buenos Aires Dimulai§!' yang akan meminta kita untuk mempertahankan §YFanny Edelman§! berkuasa atau beralih ke §YAntonio Soto§!."
ARG_the_buenos_aires_conference_2_tt: "Tetap menggunakan §YFanny Edelman§! akan membuka cabang fokus §YUnify The Continent§! dan §YLiberate The Continent§!. Memilih §YAntonio Soto§! akan membuka cabang fokus §YImprove Patagonia§!."
ARG_align_with_the_soviets: "Sejajar dengan Soviet"
ARG_align_with_the_soviets_desc: "Dengan kesuksesan besar revolusi, sekarang saatnya memutuskan bagaimana kita ingin membentuk masa depan [ARG.GetNameDef]. Kamerad Rodolfo Ghioldi adalah orang yang mempelopori revolusi setelah ia kembali dan ia merupakan kandidat yang baik untuk memimpin [ARG.GetNameDef]. Ghioldi bermaksud untuk menjalin hubungan lebih dekat dengan [SOU.GetNameDef] dan percaya bahwa negara sosialis baru kita akan tumbuh menjadi negara besar dengan meniru mereka."
ARG_soviet_industrial_model: "Model Industri Soviet"
ARG_soviet_industrial_model_desc: "Setelah revolusi di Rusia, [SOU.GetNameDef] membuat kemajuan besar dalam memodernisasi kompleks industri militer mereka. Kita harus mengambil inspirasi dari hal ini dan mengikuti jejak mereka, dengan meningkatkan jumlah pabrik yang berfokus pada militer di negara ini."
ARG_committee_of_state_security: "Komite Keamanan Negara"
ARG_committee_of_state_security_desc: "Ketika ketegangan dunia meningkat, semakin banyak musuh ideologi kita yang mulai mencari jalan keluar. Agar kita tetap berkuasa, kita harus fokus pada pembentukan badan intelijen untuk menegakkan nilai-nilai kita baik di [ARG.GetNameDef] maupun secara internasional."
ARG_russian_manufacturers: "[SOU.GetAdjective] Produsen"
ARG_russian_manufacturers_desc: "Untuk meningkatkan kekuatan industri kita dan menonjol dibandingkan negara-negara lain di benua ini, kita harus menghubungi [SOU.GetNameDef] dan mengundang sejumlah produsen mereka untuk [ARG.GetNameDef]. Bagaimanapun, kita mempunyai ideologi yang sama, dan masuk akal jika kita juga berbagi teknologi militer."
ARG_centralize_power: "Sentralisasi Kekuasaan"
ARG_centralize_power_desc: "Rodolfo Ghioldi telah memimpin kita dengan baik sejauh ini dalam perjalanan kita pasca revolusi. Banyak orang di pemerintahannya percaya bahwa dengan memusatkan kekuasaan kepada Perdana Menteri saja akan membantu menjaga keamanan negara Soviet yang baru dari ancaman baik internal maupun eksternal. Toh, itu atas nama keselamatan dan keamanan [ARG.GetNameDef]."
ARG_workers_rights: "Hak Pekerja"
ARG_workers_rights_desc: "Salah satu prinsip inti revolusi sosialis kita adalah meningkatkan kualitas hidup pekerja proletariat di [ARG.GetNameDef]. Kini setelah kita menguasai alat-alat produksi, kita harus memastikan bahwa kondisi kerja yang buruk tidak lagi mengganggu ladang dan pabrik kita."
ARG_reform_our_industry: "Reformasi Industri Kita"
ARG_reform_our_industry_desc: "Sudah terlalu lama inovasi industri kita tertinggal dibandingkan negara lain di dunia. Sudah saatnya kita memperluas industri [ARG.GetNameDef] dan membawanya ke standar yang lebih modern. Kita bisa memulainya dengan membangun pabrik-pabrik baru dan segera mengoperasikannya."
ARG_empower_the_fjc: "Memberdayakan FJC"
ARG_empower_the_fjc_desc: "Federación Juvenil Comunista adalah organisasi pemuda dan politik revolusioner yang didirikan untuk mempromosikan kebijakan PCA di kalangan pemuda [ARG.GetAdjective]. Untuk mengamankan ideologi sosialis kita di seluruh negeri, adalah bijaksana untuk melibatkan anak-anak di negara kita sedini mungkin."
ARG_state_atheism: "Negara Ateisme"
ARG_state_atheism_desc: "[ARG.GetNameDefCap] telah lama menjadi negara Katolik dan agama telah memainkan peran utama dalam kehidupan sehari-hari bagi banyak warganya. Namun, kita mempunyai pilihan untuk memberlakukan Ateisme negara karena agama cenderung tidak mendapat banyak tempat dalam revolusi sosialis. Namun kita harus ingat bahwa hal ini dapat menimbulkan keresahan di kalangan masyarakat luas, yang telah lama menjadikan agama sebagai bagian dari kehidupan mereka."
ARG_liberation_theology: "Teologi Pembebasan"
ARG_liberation_theology_desc: "Mengingat sejarah panjang agama Katolik di [ARG.GetNameDef] dan pentingnya hal ini bagi kehidupan warganya, banyak pendeta mulai mengadopsi bentuk agama Kristen baru yang dikenal sebagai Teologi Pembebasan sebagai reaksi terhadap pergeseran ideologi dalam [ARG.GetNameDef]. Mengingat gagasan Teologi Pembebasan sejalan dengan gerakan revolusioner kita, maka akan bijaksana jika kita mengadopsi sekte gereja ini sebagai agama negara kita."
ARG_socialist_researchers: "Peneliti Sosialis"
ARG_socialist_researchers_desc: "Seiring dengan pertumbuhan negara kita sebagai negara sosialis, akan lebih bijaksana jika kita berinvestasi dalam perluasan penelitian nasional. Bagaimanapun, merevolusi dan memodernisasi teknologi kita penting bagi pertumbuhan bangsa kita."
ARG_a_red_south_america: "Ocaso Escarlata"
ARG_a_red_south_america_desc: "Pada akhirnya, kita berhasil membawa Amerika Selatan di bawah panji komunis yang sama. Ketika gelombang merah melanda benua ini, kelas pekerja yang tertindas akhirnya bisa bebas menjalani kehidupan yang lebih mandiri di bawah bimbingan kami. Namun, mengapa kita harus berhenti di situ? Sudah waktunya untuk memberlakukan Operasi Ocaso Escarlata dan memberikan akhir yang buruk bagi siapa pun yang menentang revolusi global."
ARG_conquer_south_america: "Bebaskan Benua"
ARG_conquer_south_america_desc: "Tidak ada tempat bagi ideologi dunia lain di benua Amerika Selatan karena mereka merupakan ancaman bagi negara sosialis kita. Jika mereka tidak mau bergabung dengan kita, maka kita harus bergerak untuk membebaskan rakyat mereka secepat mungkin dan menempatkan mereka di bawah panji perlindungan [ARG.GetNameDef]."
ARG_more_communism_in_south_america_tt: "Dapatkan §Y$annex_everything$§! tujuan perang di semua negara §YNon-Komunis§! di §YAmerika Selatan§!"
ARG_unify_south_america: "Menyatukan Benua"
ARG_unify_south_america_desc: "Ada sejumlah negara di benua Amerika Selatan yang telah melakukan gerakan revolusionernya sendiri dan mengamankan pemerintahan komunis. Jika kita ingin tetap kuat, kita harus bersatu. Inilah saatnya untuk menjangkau negara-negara ini dan meminta mereka bergabung dengan dunia internasional kita."
ARG_unify_the_continent_tt: "Mengambil fokus ini akan mengirimkan tawaran kepada negara §YKomunis§! mana pun di §YAmerika Selatan§! untuk bergabung dengan §YFaksi§! kami."
ARG_integrate_the_motherland: "Integrasikan Amerika"
ARG_integrate_the_motherland_desc: "Kelas penguasa di wilayah yang telah kita bebaskan dari kebusukan kapitalis dan fasis mungkin akan terus memberontak melawan kita jika kita tidak mengambil tindakan untuk mengintegrasikan mereka ke dalam koalisi kita yang sedang berkembang."
ARG_eliminate_american_imperialism: "Hilangkan Imperialisme Amerika"
ARG_eliminate_american_imperialism_desc: "Raksasa di utara telah lama menjadi benteng keserakahan dan korupsi korporasi. Karena kita sekarang telah tumbuh menjadi negara adidaya, hanya masalah waktu saja ketika para kapitalis Washington memutuskan bahwa kita adalah ancaman yang harus disingkirkan. Kita tidak bisa membiarkan hal ini terjadi. Saatnya untuk melaksanakan Operasi Ocaso Escarlata dan membawa matahari terbenam yang merah padam di [USA.GetNameDef]."
ARG_improve_patagonia: "Tingkatkan Patagonia"
ARG_improve_patagonia_desc: "Ketika kaum anarko-sindikalis di bawah kepemimpinan Antonio Soto mengambil kendali atas nasib [ARG.GetNameDef], mereka memutuskan bahwa wilayah asal mereka, Patagonia, harus mendapat perhatian yang sangat mereka butuhkan selama beberapa dekade."
ARG_establish_the_free_association: "Bentuk Asosiasi Bebas"
ARG_establish_the_free_association_desc: "Asosiasi Bebas adalah hubungan antar individu di mana tidak ada negara, kelas sosial, hierarki, atau kepemilikan pribadi atas alat-alat produksi. Ini adalah tujuan jangka panjang kaum anarko-sindikalis dan sudah saatnya kita mulai meruntuhkan batasan-batasan ini dan menciptakan masyarakat di mana setiap orang bebas memenuhi kebutuhan masing-masing."
ARG_no_gods_no_masters: "Tidak Ada Dewa Tidak Ada Tuan"
ARG_no_gods_no_masters_desc: "Tidak seorang pun boleh dikendalikan oleh orang-orang yang berusaha menyakiti mereka. Meskipun negara-negara tetangga kita mungkin tidak memahami ideologi kita, kita dapat mengambil tindakan untuk membebaskan mereka dari negara-negara yang suka berperang yang ingin dengan rakus memperluas wilayah pengaruh mereka."
ARG_in_memory_of_yrigoyen: "Untuk Mengenang Yrigoyen"
ARG_in_memory_of_yrigoyen_desc: "[ARG.GetNameDefCap] pernah mengalami situasi seperti ini sebelumnya. Meskipun pemerintahannya bukannya tanpa kesalahan, Hipólito Yrigoyen masih melakukan reformasi yang diperlukan yang masih bermanfaat bagi negara kita hingga saat ini. Kita membutuhkan seseorang untuk mengambil peran dan membawa kita kembali ke jalur demokrasi."
ARG_in_memory_of_yrigoyen_tt: "§YMarcelo T. De Alvear§! menjadi pemimpin §Y$ARG_democratic_party_long$§! dan partai yang berkuasa akan beralih ke §YDemokrat§!"
ARG_promote_urbanization: "Mempromosikan Urbanisasi"
ARG_promote_urbanization_desc: "Meskipun dunia di sekitar kita sedang mengalami industrialisasi dan urbanisasi, [ARG.GetNameDef] tetap sama. Hal ini membuat kita bergantung pada negara lain untuk menopang perekonomian kita. Mengakui hal ini dan mendorong urbanisasi seharusnya mengakhiri ketergantungan ini dengan cepat."
ARG_secure_the_opposition: "Amankan Oposisi"
ARG_secure_the_opposition_desc: "Sejumlah pertentangan sangat baik bagi nilai-nilai demokrasi kita. Lawan yang kami hadapi saat ini cukup kuat, namun permasalahan utama kami adalah mereka tidak bermain secara adil. Kita tidak bisa membiarkan mereka memberikan contoh berbahaya ini, oposisi politik perlu diatur, demi keselamatan semua orang."
ARG_the_clean_election: "Pemilu yang Bersih"
ARG_the_clean_election_desc: "Setelah puluhan tahun melakukan korupsi dan penipuan dalam politik [ARG.GetNameDef], Unión Cívica Radical berhasil meraih kemenangan setelah kampanye gencar yang berfokus pada mengungkap kecurangan pengisian surat suara yang tersebar luas di Concordancia. Kini ada diskusi mengenai siapa yang akan memimpin partai tersebut ke depan."
ARG_anti_corruption_policies: "Kebijakan Anti Korupsi"
ARG_anti_corruption_policies_desc: "Kita harus memastikan bahwa korupsi politik yang telah mencemari negara kita selama satu dekade terakhir tidak boleh kembali terjadi dalam pemilihan umum pemerintahan kita. Dengan menerapkan kebijakan-kebijakan baru yang fokus pada pemberantasan budaya suap, penggelapan dan nepotisme dalam pemerintahan negara kita."
ARG_a_true_democracy: "Demokrasi Sejati"
ARG_a_true_democracy_desc: "[ARG.GetNameDefCap] telah dianggap sebagai negara demokrasi sejak tahun 1861, namun belakangan ini, kondisi sistem politik kita telah mempermalukan konsep republik yang bebas dan demokratis. Sekarang kita akhirnya bisa maju sebagai negara demokrasi sejati. Salah satu yang menghargai stabilitas dan peningkatan perekonomian [ARG.GetAdjective]."
ARG_argentina_for_all: "Argentina untuk Semua"
ARG_argentina_for_all_desc: "Sebagai bekas koloni, [ARG.GetNameDef] adalah rumah bagi banyak orang berbeda dari seluruh dunia. Dalam visi masa depan bangsa kita, kita ingin setiap orang yang tinggal di wilayah negara kita dapat menyebut diri mereka [ARG.GetAdjective] dan bangga menyebut negara ini sebagai rumah mereka. Kita harus berupaya memastikan bahwa [ARG.GetNameDef] diperuntukkan bagi semua orang yang memutuskan untuk tinggal di sini."
ARG_reinforce_the_education_system: "Memperkuat Sistem Pendidikan"
ARG_reinforce_the_education_system_desc: "Pendidikan adalah fondasi negara demokratis. Setiap orang yang tinggal di [ARG.GetNameDef] harus bebas bersekolah untuk tumbuh dan berkembang sebagai warga negara yang jujur ​​dan pekerja keras. Kita harus mengambil kesempatan ini untuk memfokuskan pendanaan kita pada bidang pekerjaan tertentu, dengan harapan bahwa hal ini akan memungkinkan kita mengembangkan kemajuan teknologi dan ekonomi kita sendiri."
ARG_education_electronics_bonus: "Fokus Pendidikan Elektronik"
ARG_education_industrial_bonus: "Fokus Pendidikan Industri"
ARG_education_synthetics_bonus: "Fokus Pendidikan Sintetis"
ARG_university_reforms: "Reformasi Universitas"
ARG_university_reforms_desc: "Ketika sistem pendidikan kita diperkuat, ini akan menjadi peluang besar untuk mereformasi universitas kita juga. Memajukan pendidikan tinggi akan memungkinkan kita untuk lebih memanfaatkan departemen penelitian universitas kita."
ARG_seek_american_support: "Carilah Dukungan Amerika"
ARG_seek_american_support_desc: "Ketika bayang-bayang perang mulai terjadi di seluruh dunia, kita harus bersiap menghadapi konflik apa pun yang dapat mengancam perbatasan kita. [USA.GetNameDefCap] mungkin merupakan raksasa yang sedang tidur di wilayah utara, namun sebagai sesama negara demokratis, ada banyak hal yang dapat kita pelajari dari kebijakan luar negeri dan program pertahanan sipil mereka. Kita harus menjangkau mereka dan memulai hubungan baik dengan tetangga kita di Amerika Utara."
ARG_us_army_training: "Pelatihan Angkatan Darat AS"
ARG_us_army_training_desc: "[USA.GetNameDefCap] telah dengan baik hati menawarkan untuk mengirimkan kepada kami program pelatihan militer mereka sehingga kami dapat mulai mempersiapkan pasukan kami sendiri untuk kemungkinan perang. Hal ini tidak hanya akan menciptakan pasukan yang lebih berpengalaman dan tangguh, kita juga dapat menggunakan apa yang telah kita pelajari untuk meningkatkan program pasukan khusus kita."
ARG_us_army_training_bonus: "$ARG_us_army_training$"
ARG_american_defense_investments: "Investasi Pertahanan Amerika"
ARG_american_defense_investments_desc: "Meskipun memiliki militer yang kuat dengan pasukan yang terlatih adalah hal yang baik, sering kali dikatakan bahwa pertahanan yang kokoh sama baiknya dengan serangan yang kuat. Hubungan kami dengan [USA.GetNameDef] telah mengarahkan kami untuk meningkatkan kemampuan pertahanan di wilayah yang paling rentan, khususnya untuk membantu kami menahan serangan dari udara. Hutan dan gunung melindungi kita di darat dan menara ini akan melindungi langit kita."
ARG_joint_military_exercises: "Latihan Militer Gabungan"
ARG_joint_military_exercises_desc: "Sebagai bentuk niat baik terhadap [USA.GetAdjective], kita harus mengirimkan tawaran latihan militer gabungan yang diadakan dalam [ARG.GetNameDef]. Dengan bekerja sama, kita dapat meningkatkan tingkat pelatihan dan keterampilan angkatan laut dan udara kita."
ARG_join_the_allies: "Bergabunglah dengan Sekutu"
ARG_join_the_allies_desc: "Waktunya telah tiba bagi kita untuk memihak dalam konflik ini. Sebagai negara yang berupaya melindungi kesucian demokrasi, sangatlah penting bagi kita untuk menjangkau Sekutu dan mengamankan tempat kita di dalam faksi tersebut. Kita harus membantu melindungi dunia dari pihak-pihak yang berusaha menaklukkannya."
ARG_bastion_of_democracy: "Benteng Perdamaian"
ARG_bastion_of_democracy_desc: "Kita telah mencapai kemajuan besar dalam menegakkan gagasan negara demokratis dan telah mencapai banyak kemajuan sejak pemilu kita yang sangat korup. Ketika perang terjadi di seluruh dunia, kita harus mengambil sikap sebagai benteng perdamaian, dan berjanji untuk melindungi negara-negara kecil di benua ini."
ARG_regulated_national_salaries: "Gaji Nasional yang Diatur"
ARG_regulated_national_salaries_desc: "Kita telah melihat tren yang mengkhawatirkan di antara perusahaan-perusahaan dalam negeri dan perusahaan-perusahaan yang memberikan gaji rendah kepada karyawannya. Kami tidak berkepentingan untuk mengendalikan anggaran mereka, namun kami berkepentingan untuk memastikan bahwa semua warga negara kami mendapat upah yang adil. Menetapkan upah minimum tentu akan membantu semua orang dalam situasi ini."
ARG_social_welfare_fund: "Dana Kesejahteraan Sosial"
ARG_social_welfare_fund_desc: "Anggaran kami untuk belanja kesejahteraan sosial biasanya sangat rendah. Meskipun melihat kemungkinan keuntungan yang didapat dari peningkatan anggaran untuk kesejahteraan sosial, kami mulai yakin bahwa hal tersebut tidak seharusnya terjadi. Menyiapkan dana untuk belanja kesejahteraan sosial mungkin merupakan upaya yang bermanfaat."
ARG_british_gaurantee: "Hubungan Lebih Dekat Dengan Inggris"
ARG_british_gaurantee_desc: "Secara historis, kami memiliki hubungan erat dengan Inggris dan mereka berinvestasi besar-besaran di negara kami. Kita harus memikirkan cara untuk menghidupkan kembali hubungan ini dan memperkuat ikatan ini, ini mungkin akan bermanfaat bagi kita!"
ARG_royal_airforce_influence: "Pengaruh Angkatan Udara Kerajaan"
ARG_royal_airforce_influence_desc: "Dengan semakin dekatnya hubungan kita dengan Inggris, kita harus melihat apakah kita juga bisa belajar dari upaya militer mereka. Royal Air Force secara luas dihormati dan mempelajari operasi mereka mungkin akan bermanfaat. Selagi kami melakukannya, kami juga harus mempertimbangkan untuk mencoba membeli beberapa pesawat serupa."
ARG_royal_airforce_influence_bonus: "$ARG_royal_airforce_influence$"
ARG_royal_navy_influence: "Pengaruh Angkatan Laut Kerajaan"
ARG_royal_navy_influence_desc: "Dengan semakin dekatnya hubungan kita dengan Inggris, kita harus melihat apakah kita juga bisa belajar dari upaya militer mereka. Angkatan Laut Kerajaan Inggris sangat dihormati dan mempelajari operasi mereka mungkin akan bermanfaat. Sementara kita melakukannya, kita juga harus mempertimbangkan untuk meneliti kapal yang serupa dengan milik mereka."
ARG_royal_navy_influence_bonus: "$ARG_royal_navy_influence$"
ARG_reinforced_alliance: "Memperkuat Kerja Sama"
ARG_reinforced_alliance_desc: "Hubungan dekat kita dengan Inggris terbukti sangat bermanfaat, namun semakin kita mempelajari militer mereka, semakin menjadi jelas bahwa kita tidak siap menghadapi konflik yang mungkin terjadi. Kita harus mempertimbangkan untuk meminta dukungan mereka yang lebih eksplisit dalam bentuk jaminan dan pakta non-agresi."
ARG_reinforced_alliance.tt: "([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) Mendapat acara '§Y$ARG_political_events.73.t$§!' yang akan menawarkan §Ypakta non-agresi§! dan §Yjaminan kemerdekaan§! antara kedua negara kita. Mereka akan lebih mungkin menerima jika mereka mempunyai §YPendapat yang tinggi tentang kita§!"
ARG_internal_focus: "Fokus Internal"
ARG_internal_focus_desc: "Meskipun ada pilihan untuk menjangkau negara-negara demokrasi utama, banyak orang di pemerintahan kita yang percaya bahwa lebih bijaksana untuk fokus pada [ARG.GetNameDef] secara internal daripada memperluas sumber daya kita ke tempat lain. Untuk saat ini, kita harus membatasi perdagangan negara kita dengan dunia untuk memastikan bahwa [ARG.GetNameDef] mempunyai apa yang dibutuhkan untuk menahan serangan perang."
ARG_alvears_democracy: "Demokrasi Alvear"
ARG_alvears_democracy_desc: "Banyak yang menganggap [ARG.GetLeader] sebagai orang yang keras dengan kebijakan yang ketat, namun seiring berjalannya waktu, menjadi jelas bahwa dia benar-benar mengutamakan kepentingan [ARG.GetNameDef]. Ia benar-benar mampu meneruskan warisan Hipólito Yrigoyen, dan patut dipandang sebagai Bapak Demokrasi Argentina."
ARG_south_american_alliance: "Kerja Sama Pan-Amerika"
ARG_south_american_alliance_desc: "Dengan terbentuknya faksi baru kita dan berdedikasi untuk menjaga perdamaian di benua Amerika Selatan, kita harus menjangkau negara-negara demokratis lainnya di sekitar kita dan meminta mereka bergabung dengan kita dalam janji kita menuju perdamaian dan kebebasan. Bersama-sama kita berdiri lebih kuat dan kecil kemungkinannya untuk terjatuh."
ARG_bolstering_the_army: "Dorongan Perekrutan"
ARG_bolstering_the_army_desc: "Perang terus memanas, dan kita harus siap menjawab seruannya. Di seluruh [ARG.GetNameDef], laki-laki dan perempuan bersedia mempertaruhkan nyawa mereka untuk memperjuangkan dan membela hak kebebasan mereka dari pihak-pihak yang berupaya merampasnya. Kita harus membuka upaya rekrutmen, dan mendorong masyarakat di negara besar kita untuk mengangkat senjata dan bersiap berjuang demi tanah air mereka."
ARG_the_second_argentine_republic: "Republik Argentina Kedua"
ARG_the_second_argentine_republic_desc: "Setelah bertahun-tahun mengalami korupsi dan penipuan, kita akhirnya bangkit dari abu negara kita yang lama dan bangkit sebagai benteng demokrasi baru di belahan bumi barat. Mulai hari ini, untuk memisahkan kita dari kesalahan masa lalu, kita akan dikenal sebagai Republik Argentina Kedua. Persatuan dan kebebasan!"
ARG_the_second_argentine_republic_tt: "([ARG.GetFlag]§Y[ARG.GetNameDefCap]§!) akan memberikan §Yjaminan§! kepada semua negara demokratis di §YAmerika Selatan§!"
ARG_hitler_1: "Pesona Keempat Kalinya"
ARG_hitler_1_desc: "Dengan adanya presiden baru kita di pemerintahan, ada dorongan segera untuk melakukan perubahan drastis pada [ARG.GetNameDef] untuk meniru kekuatan masa lalu yang dimiliki [GER.GetNameDef]. Señor Hilter tampaknya bersikeras untuk mendirikan The Fourth Reich di Amerika Selatan. Apa yang salah kali ini?"
ARG_hitler_2: "Guerra Relamago"
ARG_hitler_2_desc: "Guerra Relámpago - juga dikenal sebagai 'Perang Petir' adalah cara kita menggunakan kekuatan senjata mekanis yang luar biasa untuk mengalahkan musuh kita. Presiden kami ingin melakukan ekspansi secepatnya, dengan menyatakan bahwa ia 'mengganti waktu yang hilang'. Untuk beberapa alasan, rencana ini juga meluas ke tanah lama [GER.GetNameDef]."
ARG_hitler_2_tt: "Dapatkan §Y$annex_everything$§! tujuan perang di semua negara §YNon-Fasis§! di §YAmerika Selatan§!"
ARG_hitler_2_core_tt: "Dapatkan §YCores§! di semua negara bagian §YJerman§! sebelumnya."
ARG_hitler_3: "Arma Maravillosa"
ARG_hitler_3_desc: "Arma Maravillosa - juga dikenal sebagai 'Senjata Ajaib' adalah program di mana kami berupaya mengembangkan roket dan senjata yang lebih kuat yang dapat mengubah jalannya perang. Presiden kami mendekati kami dengan serangkaian dokumen yang rusak akibat air dengan ide-ide luar biasa yang dapat kami terapkan segera."
ARG_arma_maravillosa_bonus: "Arma Maravillosa"
ARG_worst_timeline_flag: "§YSeñor Hilter§! adalah pemimpin §Y[ARG.GetNameDef]§!"
ARG_hitler_4: "Pulihkan Kapal"
ARG_hitler_4_desc: "Menurut Señor Hilter, yang paling penting adalah kita memulihkan bangkai kapal Graf Spee, kapal perang [GER.GetAdjective] pertama yang tenggelam selama perang. Ketika ditanya tentang hal ini, dia menggumamkan sesuatu tentang 'martabat' dan 'jangan tanya saya' dalam bahasa Spanyol yang terpatah-patah. Apa pun yang terjadi, ayo tingkatkan Graf Spee!"
ARG_ligas_patrioticas_tt: "Membuka templat divisi Ligas Patrióticas dan merekrut §Ylima§! unit di §Y[ROOT.capital.GetCapitalVictoryPointName]§!"
ARG_guardia_nacional_tt: "§Y$ARG_pedro_pablo_ramirez$§! menjadi pemimpin §Y$ARG_gen_nazism_party_long$§! dan partai yang berkuasa akan beralih ke §YFasisme§!"
ARG_union_nacional_fascista_tt: "§YNimio de Anquín§! menjadi pemimpin §Y$ARG_fascism_party_long$§! dan partai yang berkuasa akan beralih ke §YFasisme§!"
ARG_nationalist_faction: "Konfederasi Fasis"
ARG_communist_faction: "Sudamericana Internasional"
ARG_democratic_faction: "Aliansi Monroe"
#GUAY#
GUAY_disperse_military_power: "Membubarkan Kekuatan Militer"
GUAY_disperse_military_power_desc: "Untuk mengamankan masa depan kabinet kita, kita perlu memastikan bahwa militer tidak dapat merebut kekuasaan untuk diri mereka sendiri."
GUAY_nationalize_foreign_owned_companies: "Nasionalisasi Perusahaan Milik Asing"
GUAY_nationalize_foreign_owned_companies_desc: "Sudah terlalu lama perusahaan asing mengeksploitasi sumber daya kita demi keuntungan mereka, tidak lebih."
GUAY_urbanization: "Urbanisasi"
GUAY_urbanization_desc: "Untuk membawa warga kami keluar dari kemiskinan, kami akan membawa mereka ke kota besar dimana akses terhadap kekayaan dan pendidikan yang lebih besar dapat ditemukan."
GUAY_abolish_low_level_income_tax: "Hapuskan Pajak Penghasilan Tingkat Rendah"
GUAY_abolish_low_level_income_tax_desc: "Memungut pajak terhadap masyarakat termiskin di masyarakat kita tidak masuk akal, hal ini harus dihapuskan"
GUAY_free_seconday_schools: "Sekolah Menengah Gratis"
GUAY_free_seconday_schools_desc: "Pendidikan adalah landasan perekonomian yang berfungsi dengan baik. Kami akan berinvestasi dalam hal ini demi generasi mendatang."
GUAY_the_stuff_of_legends: "Barang Legenda"
GUAY_the_stuff_of_legends_cores_tt_arg: "Mengontrol semua inti §YArgentinian§! awal"
GUAY_the_stuff_of_legends_cores_tt_bra: "Mengontrol semua inti §YBrazilian§! awal"
GUAY_the_stuff_of_legends_cores_tt_bol: "Mengontrol semua inti §YBolivian§! awal"
GUAY_the_stuff_of_legends_cores_tt_urg: "Mengontrol semua inti §YUruguayan§! awal"
GUAY_the_stuff_of_legends_cores_tt_par: "Mengontrol semua inti §YParaguay§! awal"
GUAY_the_stuff_of_legends_desc: "Apa yang awalnya hanya mimpi kini menjadi kenyataan. Di bawah kepemimpinan kami, kami telah menguasai benua ini dengan kuat dan membentuk identitas yang unik. Ini akan dicatat dalam buku sejarah dan menjadi legenda."
GUAY_meet_with_the_old_powers: "Bertemu dengan Kekuatan Lama"
GUAY_meet_with_the_old_powers_tt: "Membuka keputusan untuk menyelaraskan dengan satu kekuatan besar dunia lama, memberi Anda pilihan satu bonus yang bergantung pada kekuatan yang selaras."
GUAY_meet_with_the_old_powers_desc: "Negara kita kecil namun mempunyai ambisi yang besar, oleh karena itu kita memerlukan pengetahuan dari negara besar mengenai bagaimana kita bisa unggul dibandingkan negara tetangga kita."
GUAY_dam_construction: "Konstruksi Bendungan"
GUAY_dam_construction_desc: "Negara kita memiliki banyak peluang untuk membangun bendungan pembangkit listrik tenaga air, namun tidak memiliki cukup cadangan untuk melaksanakan proyek mahal tersebut. Mungkinkah ada mitra yang bersedia meminjamkan kita pinjaman?"
GUAY_dam_construction_desc_tt: "Kami diharapkan membayar kembali investasi tersebut setelah §Y720 hari§!. Pembayaran kembali akan batal jika kita berperang dengan negara sebelum pembayaran jatuh tempo."
GUAY_not_at_war_with_old_power: "Tidak berperang dengan kekuatan lama yang dipilih dan bersekutu"
GUAY_has_picked_old_power: "Telah memilih kekuatan lama untuk disejajarkan"
GUAY_old_world_power_faction: "Kekuatan Dunia Lama berada dalam faksi atau pemimpin faksi"
GUAY_old_world_power_scope: "§YMitra Kekuatan Dunia Lama§!:"
GUAY_tag_the_economic_miracle: "Keajaiban Ekonomi Amerika Selatan"
GUAY_beef_and_hide_industry: "Industri Daging Sapi dan Kulit"
GUAY_beef_and_hide_industry_desc: "Inti perekonomian negara kita berkisar pada daging sapi dan kulit, maka masuk akal untuk mengembangkannya."
GUAY_protect_domestic_industries_beef: "Menyelesaikan $GUAY_beef_and_hide_industry$ akan\nTambahkan: §G1§! §YPabrik Sipil.§!\nTambahkan: §G1§! Slot Bangunan."
GUAY_protect_domestic_industries_agricultural: "Menyelesaikan $GUAY_agricultural_colonization$ akan\nTambahkan: §G1§! §YPabrik Sipil.§!\nTambahkan: §G1§! Slot Bangunan."
GUAY_protect_domestic_industries_cash_crop: "Menyelesaikan $GUAY_cash_crop_exports$ akan\nTambahkan: §G1§! §YPabrik Sipil.§!\nTambahkan: §G1§! Slot Bangunan."
GUAY_protect_domestic_industries_wool_makers: "Menyelesaikan $GUAY_wool_makers$ akan\nTambahkan: §G1§! §YPabrik Sipil.§!\nTambahkan: §G1§! Slot Bangunan."
GUAY_cash_crop_exports: "Ekspor Hasil Tunai"
GUAY_cash_crop_exports_desc: "Negara kita memiliki prasyarat sempurna untuk menjual hasil panen dalam jumlah besar ke negara lain. Ekspor barang berharga ini akan membawa peningkatan kesejahteraan bagi kita."
GUAY_export_focus: "Ekspor Fokus"
GUAY_export_focus_desc: "Kita harus memastikan bahwa semua orang tahu tentang negara kita, untuk meningkatkan permintaan segala hal mulai dari pariwisata hingga ekspor daging sapi ke dunia yang lebih luas. Beri tahu mereka tentang [FROM.GetNameDefCap]!"
GUAY_agricultural_colonization: "Kolonisasi Pertanian"
GUAY_agricultural_colonization_desc: "Pertanian selalu menjadi bagian besar perekonomian kita. Memperluasnya melalui pembukaan lahan akan menghasilkan keuntungan lebih lanjut."
GUAY_wool_makers: "Pembuat Wol"
GUAY_wool_makers_desc: "Wol adalah komoditas penting bagi semua orang, dan kami siap menyediakannya. Bagaimanapun, setiap orang perlu tetap hangat selama musim dingin."
GUAY_form_ties_with_the_military: "Bentuk Hubungan Dengan Militer"
GUAY_form_ties_with_the_military_desc: "Pemerintah saat ini telah gagal memberikan stabilitas yang dibutuhkan negara. Kami akan menggunakan militer untuk mengambil tindakan tegas dan menggulingkan rezim yang gagal ini."
GUAY_place_opposition_leaders_in_house_arrest: "Tempatkan Pemimpin Oposisi dalam Tahanan Rumah"
GUAY_place_opposition_leaders_in_house_arrest_desc: "Kita perlu bergerak cepat untuk memperkuat kendali kita atas negara ini. Kami akan menempatkan oposisi dalam tahanan rumah sampai kudeta selesai."
GUAY_enact_martial_law: "Menetapkan Darurat Militer"
GUAY_enact_martial_law_desc: "Kerusuhan semakin meningkat. Kita perlu mengendalikan narasi dan mengawasi masyarakat untuk menghindari pertumpahan darah yang tidak perlu yang dapat menggagalkan situasi."
GUAY_coup_detat: "Setelah Kudeta"
GUAY_coup_detat_desc: "Pemerintahan lama telah jatuh! Kami telah memperoleh kendali atas semua institusi meskipun sempat terjadi kebuntuan dengan kekuatan yang bersekutu dengan pemerintah. Senjata mereka dilucuti tanpa korban dan senjata mereka telah ditambahkan ke persediaan kami."
GUAY_cult_of_personality: "Kultus Kepribadian"
GUAY_cult_of_personality_desc: "Untuk memperkuat bangsa, kita harus mendukung pemimpin kita tercinta dan membentuk sekte kepribadian. Sebuah boneka bagi rakyat jelata untuk bersatu dan mati dibelakang."
GUAY_appease_the_generals: "Tenangkan para Jenderal"
GUAY_appease_the_generals_tt: "Jenderal akan mendapatkan statistik tambahan dan satu sifat yang ditetapkan secara acak."
GUAY_appease_the_generals_desc: "Para jenderal yang mengizinkan kami mengambil alih negara mengharapkan kami membalasnya dengan setimpal. Lebih baik tidak berlama-lama atau mereka akan berbalik melawan kita."
GUAY_appease_the_generals_eq_trigger_tt: "Lebih dari §Y2500§! peralatan infanteri di angkatan darat"
GUAY_a_domestic_arms_factory: "Pabrik Senjata Dalam Negeri"
GUAY_a_domestic_arms_factory_desc: "Meskipun perekonomian kita tidak dapat bersaing dengan negara-negara besar di Eropa, kita tidak dapat sepenuhnya bergantung pada perdagangan senjata luar negeri. Kita akan memulai proses pembuatan senjata dalam negeri jika kita terisolasi."
GUAY_penal_battalions: "Batalyon Pidana"
GUAY_penal_battalions_tt: "Menambah §Y6 Batalyon Pidana§! dengan tenaga penuh. Membuka §YBatalyon Penal§!"
GUAY_penal_battalions_desc: "Tentara kita berada dalam kondisi yang mengerikan dengan hanya sedikit orang yang mendaftar. Mengizinkan wajib militer dari penjara mungkin merupakan solusinya."
GUAY_rekindle_old_gripes: "[GUAY_rekindle_old_gripes]"
GUAY_rekindle_old_gripes_desc: "[GUAY_rekindle_old_gripes_desc]"
GUAY_rekindle_old_gripes_URG: "Nyalakan Kembali Keluhan Lama"
GUAY_rekindle_old_gripes_URG_desc: "Baik [ARG.GetName] maupun [BRA.GetName] secara historis telah memanfaatkan kita untuk tujuan mereka sendiri, dengan konsekuensi yang sangat buruk bagi masyarakat kita. Kita perlu melakukan ekspansi ke luar untuk mencegah kekuatan musuh mendekati Montevideo lagi."
GUAY_rekindle_old_gripes_PAR: "Di Bawah Bayangan Aliansi Tiga"
GUAY_rekindle_old_gripes_PAR_desc: "60% populasi tewas selama perang Triple Alliance dan negara kita tidak pernah pulih. Hanya ekspansi yang dapat membawa stabilitas dan kesejahteraan bagi rakyat kita; kita tidak lagi hidup di bawah bayang-bayang aliansi terkutuk itu."
GUAY_rekindle_old_gripes_ARG_PAR_tt: "Jika kita mengendalikan §Y[957.GetName]§! dalam waktu §Y365 hari§! sejak pecahnya perang [ARG.GetName] kita harus mengakhiri perdamaian atau menghadapi kerugian moral yang sangat besar."
GUAY_rekindle_old_gripes_BRA_PAR_tt: "Jika kita mengendalikan §Y[504.GetName]§! dalam waktu §Y365 hari§! sejak pecahnya perang [BRA.GetNameDef] kita harus mengakhiri perdamaian atau menghadapi kerugian moral yang sangat besar."
GUAY_rekindle_old_gripes_ARG_URG_tt: "Jika kita mengendalikan §Y[510.GetName]§! dalam waktu §Y365 hari§! sejak pecahnya perang [ARG.GetName] kita harus mengakhiri perdamaian atau menghadapi kerugian moral yang sangat besar."
GUAY_rekindle_old_gripes_BRA_URG_tt: "Jika kita mengendalikan §Y[502.GetName]§! dalam waktu §Y365 hari§! sejak pecahnya perang [BRA.GetNameDef] kita harus mengakhiri perdamaian atau menghadapi kerugian moral yang sangat besar."
GUAY_mobalize_the_economy: "Memobilisasi Perekonomian"
GUAY_mobalize_the_economy_desc: "Kita perlu memulai mobilisasi perekonomian agar siap menghadapi segala kemungkinan. Orang mungkin mengeluh tetapi mereka perlu tahu bahwa mereka mempunyai tujuan yang lebih tinggi."
GUAY_adopt_minority_languages: "Mengadopsi Bahasa Minoritas"
GUAY_adopt_minority_languages_desc: "Untuk memperkuat moral dan mengurangi risiko kesalahan intelijen militer, kita akan menggunakan bahasa kita sendiri di seluruh jajaran militer."
GUAY_mythologize_the_father_of_the_nation: "Mitologikan Bapak Bangsa"
GUAY_mythologize_the_father_of_the_nation_desc: "[GUAY_mythologize_the_father_of_the_nation_desc]"
GUAY_mythologize_the_father_of_the_nation_urg: "José Artigas dipandang sebagai bapak bangsa yang memperjuangkan kemerdekaan kita melawan tetangga yang bermusuhan dan kekuatan Eropa. Warisan dan cita-citanya akan dilembagakan dan menjadi bagian dari makna menjadi orang Uruguay."
GUAY_mythologize_the_father_of_the_nation_par: "Francisco López memimpin negaranya melawan Triple Alliance, menolak untuk menyerah meskipun menghadapi serangan gencar dari tiga negara. Tekad dan kemauan seperti itu harus diabadikan dalam setiap prajurit."
GUAY_the_permanent_leader: "Pemimpin Permanen"
GUAY_the_permanent_leader_desc: "[ROOT.GetLeader] adalah pemimpin negara, dan oleh karena itu kita akan menempatkan dia sebagai pemimpin sehingga prajurit biasa mempunyai sesuatu untuk didukung. Dia akan menjadi pemimpin tetap negara kita."
GUAY_long_term_contracts: "Kontrak Senjata Jangka Panjang"
GUAY_long_term_contracts_desc: "Kita tidak bisa berharap untuk bersaing dengan negara tetangga kita dalam hal menjadi yang terdepan dalam pembuatan senjata. Namun mendapatkan kontrak lisensi jangka panjang dengan negara-negara besar akan memungkinkan kita memproduksi barang-barang ini dengan harga diskon."
GUAY_clamp_down_on_new_territories: "Menekan Wilayah Baru"
GUAY_clamp_down_on_new_territories_desc: "Kita tidak boleh melakukan anarki di wilayah baru kita. Kita perlu meredam perlawanan dan menghukum musuh-musuh negara."
GUAY_develop_new_territories: "Kembangkan Wilayah Baru"
GUAY_develop_new_territories_desc: "Cara terbaik untuk memperlancar pertukaran wilayah adalah dengan memberikan masyarakat kualitas hidup yang lebih tinggi dibandingkan sebelumnya. Itu akan menjadi kebijakan kami."
GUAY_a_deal_with_devil: "Kesepakatan Dengan Iblis"
GUAY_a_deal_with_devil_desc: "Jelas bahwa kita tidak dapat bertahan hidup tanpa sekutu di dunia yang penuh ketidakpastian. Kami akan berusaha untuk bergabung dengan mitra senior kami dan membentuk ikatan yang lebih erat; semoga mereka tidak membuat kita terlupakan."
GUAY_no_second_american_colonization: "Tidak Ada Kolonisasi Amerika Kedua"
GUAY_no_second_american_colonization_desc: "Benua kita berada dalam pendulum antara Poros dan Sekutu dan sementara tetangga kita hanya melihat diri mereka berada di bawah kekuasaan pihak lain. Amerika Selatan berhak mendapatkan nasib yang lebih baik tanpa terkekang oleh kekuatan-kekuatan lama, untuk membentuk nasib kita sendiri tanpa dibatasi oleh warisan penjajahan dan jika kita harus menginjak-injak mereka yang memiliki visi yang lebih buruk untuk mencapainya, biarlah."
GUAY_demand_a_seat_at_the_high_table: "Minta Kursi di Meja Tinggi"
GUAY_demand_a_seat_at_the_high_table_desc: "Kita masih dipandang hanya sebagai sekutu kelas dua oleh negara-negara besar meskipun kita telah berkontribusi. Kami akan menuntut agar kami bisa duduk semeja dengan yang lain dan menjadi pengurus wilayah selatan dalam tatanan dunia baru ini."
GUAY_laissez_faire: "Laissez-Faire"
GUAY_laissez_faire_desc: "Pemerintah tidak punya alasan untuk campur tangan dalam perekonomian di luar keadaan luar biasa. Pasar bebas akan menang!"
GUAY_laissez_faire_tt: "Pemilik Tanah akan mulai membangun gedung di negara kita."
GUAY_land_reforms: "Perbaikan Lahan"
GUAY_land_reforms_desc: "Kita perlu meningkatkan infrastruktur di negara kita karena ini adalah langkah pertama dari setiap masyarakat modern."
GUAY_empower_the_land_owners: "Memberdayakan Pemilik Tanah"
GUAY_empower_the_land_owners_desc: "Pemilik tanah merupakan kelompok yang paling kuat di negara ini. Kami akan memberdayakan mereka dengan memberi mereka lebih banyak lahan dan pada gilirannya kami akan mendapatkan dukungan mereka."
GUAY_empower_the_land_owners_desc_tt: "Pemilik lahan akan lebih cenderung membangun bangunan bernilai tinggi seperti §YPabrik Sipil§!, §YPabrik Militer§!, §Ygalangan kapal§! dan §YSelot Bangunan Tambahan§!"
GUAY_river_trade: "Perdagangan Sungai"
GUAY_river_trade_desc: "Negara kita adalah salah satu sungai. Memindahkan feri di sepanjang sungai-sungai ini telah menjadi andalan selama negara ini berdiri. Adalah masuk akal untuk memperluas jenis perdagangan ini jika negara-negara tetangga kita bersedia."
GUAY_river_trade_tt: "Tambahkan: §G+1§! §YPabrik Sipil§! jika pendapat dengan [THIS.GetNameDef] diatas §Y49§!."
GUAY_the_tag_economic_miracle: "Keajaiban Ekonomi [THIS.GetAdjective]"
GUAY_the_tag_economic_miracle_desc: "Negara kita sedang mengalami apa yang oleh beberapa analis disebut sebagai keajaiban ekonomi. Kami telah mengalami pertumbuhan pesat dalam beberapa tahun terakhir yang memungkinkan kami melakukan industrialisasi dengan pesat; investor dari berbagai penjuru berbondong-bondong berinvestasi pada perekonomian yang semakin mendorong pertumbuhan ini."
GUAY_heavy_industry: "Industri Berat"
GUAY_heavy_industry_desc: "Meskipun perekonomian kita sebagian besar bergantung pada barang-barang kebutuhan pokok, kita tidak bisa mengabaikan industri berat. Menjadi terlalu bergantung pada barang-barang buatan luar negeri menempatkan kita pada titik rentan jika terjadi sesuatu yang mengganggu perdagangan."
GUAY_exploit_mineral_wealth: "Memanfaatkan Kekayaan Mineral"
GUAY_exploit_mineral_wealth_desc: "Kekayaan mineral yang kita miliki tidak banyak, namun sedikit yang kita miliki akan kita manfaatkan semaksimal mungkin."
GUAY_protect_domestic_industries: "Melindungi Industri Dalam Negeri"
GUAY_protect_domestic_industries_desc: "Saat terlibat dalam perdagangan luar negeri, kita harus sangat berhati-hati agar tidak mengalahkan industri dalam negeri kita dengan barang-barang luar negeri yang murah. Kita perlu menerapkan pajak impor untuk melindungi perekonomian domestik kita terlebih dahulu."
GUAY_national_academy_of_sciences: "Akademi Ilmu Pengetahuan Nasional"
GUAY_national_academy_of_sciences_desc: "Investasi tambahan dalam penelitian akan memungkinkan kita mengembangkan senjata perang baru dengan lebih cepat, dan mengejar ketertinggalan dari negara-negara besar."
GUAY_national_academy_of_sciences_2: "[THIS.GetAdjective] Universitas Mekanik"
GUAY_national_academy_of_sciences_2_desc: "Masa depan peperangan terletak pada peperangan berteknologi tinggi. Kita perlu mengeluarkan beberapa orang dari pertanian dan terjun ke bidang teknik militer."
GUAY_national_academy_of_sciences_3: "Universitas Tinggi Amerika Selatan"
GUAY_national_academy_of_sciences_3_desc: "Setiap orang Amerika Selatan berhak mendapatkan pendidikan tinggi. Mengontrol benua memberi kita banyak sumber daya yang dapat diberikan kepada setiap pria dan wanita."
GUAY_cooperation_in_the_americas: "$BRA_cooperation_in_the_americas$"
GUAY_cooperation_in_the_americas_desc: "$BRA_cooperation_in_the_americas_desc$"
GUAY_defense_force: "[THIS.GetAdjective] Angkatan Pertahanan"
GUAY_defense_force_desc: "Untuk melindungi warga negara kita, kita perlu membentuk kekuatan pertahanan untuk mencegah potensi agresi dari tetangga kita."
GUAY_specialized_terrain_training: "Pelatihan Medan Khusus"
GUAY_specialized_terrain_training_desc: "Militer kita memang kecil, namun kekurangan kita dalam hal sumber daya manusia dan peralatan dapat kita penuhi dengan kualitas. Divisi khusus dapat memberikan kekuatan melebihi beban mereka dan bertindak sebagai pencegah."
GUAY_volunteers: "[THIS.GetAdjective] Relawan"
GUAY_volunteers_desc: "Kita dapat menghindari konflik langsung dan potensi kehancuran dengan mengirimkan relawan dibandingkan terlibat langsung dalam urusan luar negeri. Mungkinkah itu bisa mengubah skala?"
GUAY_mass_drafts: "Draf Massal"
GUAY_mass_drafts_desc: "Jelas bahwa pengawasan di perbatasan tidak bisa lagi diserahkan kepada kekuatan kecil. Ketika dunia menjadi semakin tidak menentu, kita harus siap untuk menegaskan batas-batas yang diberikan Tuhan kepada kita."
PAR_mass_drafts: "$GUAY_mass_drafts$"
PAR_mass_drafts_desc: "$GUAY_mass_drafts_desc$"
GUAY_workers_rights: "Hak Pekerja"
GUAY_workers_rights_desc: "Pekerja yang hidup lebih lama dan lebih bahagia juga bekerja lebih keras. Penerapan hak-hak pekerja demi kesehatan dan perekonomian negara adalah sebuah solusi yang saling menguntungkan."
GUAY_military_licenses: "Lisensi Militer"
GUAY_military_licenses_desc: "Kita perlu menjalin hubungan dengan negara-negara maju secara militer dan melisensikan senjata perang mereka. Kita tidak bisa hanya mengandalkan produksi dalam negeri saja."
one_of_the_options_tt: "Dimana salah satu opsi kejadian akan mempunyai efek sebagai berikut:"
PAR_reach_out_to_european_contacts: "Hubungi [USA.GetAdjective] Kontak untuk Bantuan"
PAR_reach_out_to_european_contacts_desc: "Tentara terlalu kuat dibandingkan dengan kekuatan gabungan kita. Kita perlu menelan harga diri kita dan menghubungi [USA.GetName] untuk meminta bantuan dan meyakinkan mereka bahwa negara komunis di wilayah mereka bukanlah pilihan yang baik."
PAR_ban_vouchers: "Larang Voucher sebagai Pembayaran"
PAR_ban_vouchers_desc: "Kita harus menghentikan majikan membayar pekerja dengan apa yang disebut \"uang putih\". Voucher yang diberikan pengusaha kepada pekerja sebagai pengganti uang, melanggengkan kesenjangan dan menciptakan ketergantungan pada pekerja. Ini harus dihentikan."
PAR_allow_unions_to_strike: "Izinkan Serikat Pekerja untuk Melakukan Pemogokan"
PAR_allow_unions_to_strike_desc: "Serikat pekerja yang kuat diperlukan untuk melindungi pekerja. Sebelumnya pemerintah mensterilkan kekuasaan serikat pekerja, tidak lagi."
PAR_allow_women_workers: "Izinkan Pekerja Perempuan"
PAR_allow_women_workers_desc: "Setelah perang Aliansi Tiga yang membawa bencana dan perang Chaco berikutnya, kita sangat kekurangan angkatan kerja yang efektif karena kurangnya laki-laki usia kerja."
PAR_order_italian_planes: "Pesan Pesawat [ITA.GetAdjective]"
PAR_order_italian_planes_desc: "Kita perlu memodernisasi militer kita. Kami akan mendekati [ITA.GetName] untuk memastikan bahwa angkatan udara kami siap untuk mencegah ancaman apa pun dari tetangga kami."
PAR_a_call_out_for_aid: "Panggilan Untuk Bantuan"
PAR_a_call_out_for_aid_desc: "Kami akan menggunakan istri presiden yang [FRA.GetAdjective] untuk melobi pemerintah [FRA.GetAdjective] agar mengizinkan sukarelawan membantu perjuangan kami."
PAR_request_weapons: "Minta Senjata dari [USA.GetName]"
PAR_request_weapons_desc: "Kita tidak bisa memenangkan pertarungan ini dengan persediaan senjata ringan yang kita miliki sekarang. Kita perlu menjangkau [USA.GetName] dan meyakinkan mereka bahwa pemerintahan komunis di tengah pengaruh mereka bukanlah sesuatu yang mereka inginkan terjadi."
PAR_to_cross_a_river: "Untuk Menyeberangi Sungai"
PAR_to_cross_a_river_desc: "Sungai Paraguay merupakan hambatan utama bagi kami dan menghalangi sebagian besar penyeberangan secara alami. Kita harus mendekati kekuatan yang berpengalaman secara militer dan memiliki kekuatan laut yang kuat untuk membantu kita dalam upaya ini."
PAR_ask_for_bankroll: "Minta Bankroll"
PAR_ask_for_bankroll_desc: "Kita tidak bisa menanggung perang ini ketika perekonomian sedang amburadul. Jelas bahwa kita memerlukan kekuatan asing untuk membiayai agar seluruh negara tidak jatuh ke dalam anarki."
PAR_assasinate_rafael_franco: "Bunuh Rafael Franco"
PAR_assasinate_rafael_franco_desc: "Jika kita bisa memenggal kepala ular itu bisa menurunkan moral musuh secara drastis. Kami akan menghubungi para pembangkang lokal di Chaco dan memberi mereka alat untuk menyelesaikannya."
PAR_goad_bolivia: "Ya ampun Bolivia"
PAR_goad_bolivia_desc: "Jika kita bisa melibatkan Bolivia dalam konflik ini maka para pemberontak akan jauh lebih lemah. Meskipun berisiko, kami akan menyebarkan telegram palsu yang menyiratkan keinginan Franco untuk memperluas penaklukannya ke Bolivia setelah perang saudara berakhir, yang diharapkan akan mendorong pemerintah [BOL.GetAdjective] untuk ikut terlibat."
PAR_revenge_for_the_chaco_war: "Balas dendam atas Perang Chaco"
PAR_revenge_for_the_chaco_war_desc: "[BOL.GetName] masih mengincar wilayah Chaco, dan hanya masalah waktu saja sebelum mereka mencoba mengklaimnya lagi. Kita harus proaktif dan menyerang terlebih dahulu."
PAR_access_the_sea: "Akses Laut"
PAR_access_the_sea_desc: "Negara kita tidak pernah memiliki pelabuhan air asin, namun jelas bahwa negara besar mana pun memerlukannya demi keamanan nasionalnya. Kita perlu mendapatkannya dengan cara apa pun."
PAR_by_all_means_which_to_win: "Dengan Segala Cara Untuk Menang"
PAR_by_all_means_which_to_win_desc: "Hingga perang berakhir, kita perlu seluruh perekonomian fokus pada konflik yang terjadi saat ini. Masyarakat akan menderita sebagai akibatnya, namun jika kita kalah perang, keadaan mereka akan menjadi lebih buruk, karena berada di bawah kekuasaan komunis..."
PAR_military_pensions: "Pensiun Militer"
PAR_military_pensions_desc: "Pemerintahan lama menolak memberikan pensiun militer bagi para veteran perang Chaco. Kami tidak akan melakukan kesalahan yang sama."
PAR_rebuild_humaita: "Bangun kembali Humaita"
PAR_rebuild_humaita_desc: "Benteng Humaitá dihancurkan selama Perang Paraguay, tetapi benteng ini berdiri sebagai benteng melawan serangan dari selatan. Kita akan membangun kembali benteng yang kokoh ini, sebagai tanda ketahanan dan sebagai ludah dalam menghadapi musuh."
PAR_a_great_charter: "Piagam yang Hebat"
PAR_a_great_charter_desc: "Konstitusi kita perlu dihapuskan dan sebuah piagam besar baru harus ditulis. Masa depan baru bagi negara ini!"
PAR_pull_back_troops_from_the_chaco: "Tarik Kembali Pasukan Dari Chaco"
PAR_pull_back_troops_from_the_chaco_desc: "Pasukan yang ditempatkan di Chaco harus ditarik kembali agar tidak meningkatkan ketegangan dengan [BOL.GetName], terlepas dari apa yang dikatakan militer."
PAR_central_bank_of_paraguay: "Bank Sentral Republik Paraguay"
PAR_central_bank_of_paraguay_desc: "Kita akan membentuk bank sentral yang akan menjadi satu-satunya saluran perdagangan luar negeri."
PAR_emergency_powers: "Kekuatan Darurat"
PAR_emergency_powers_desc: "Keadaan negara yang genting secara internal dan eksternal memerlukan pemimpin yang kuat untuk menyatukan kita. Hal itu hanya bisa dilakukan jika pemimpin tersebut diberi kewenangan untuk bertindak cepat dan tegas."
PAR_chaco_war_decoration: "Dekorasi Perang Chaco"
PAR_chaco_war_decoration_desc: "Para veteran perang Chaco berhak mendapatkan penghargaan perang yang tidak pernah mereka dapatkan dari pemerintahan sebelumnya. Biaya kecil untuk menenangkan militer."
PAR_invite_japanese_settlers: "Undang Pemukim Jepang"
PAR_invite_japanese_settlers_desc: "Dengan [BRA.GetName] menghentikan imigrasi Jepang, ada banyak peluang untuk mengundang mereka ke sini. Para pemukim akan menjadi pendorong bagi pertanian dan perekonomian secara umum."
PAR_suspend_elections: "Tunda Pemilu"
PAR_suspend_elections_desc: "Pemilu harus ditunda dalam kondisi saat ini. Pengunduran diri para menteri liberal di pemerintahan membuat hampir tidak ada lagi yang menentang kami."
PAR_discipline_hierarchy_and_order: "Disiplin, Hierarki dan Ketertiban"
PAR_discipline_hierarchy_and_order_desc: "Dengan dibubarkannya pemilu, kami akan mengumumkan kebijakan baru \"Disiplin, Hierarki, dan Ketertiban\". Serangkaian prinsip yang akan mengatur negara kita, dan orang-orang yang menyebarkan ide-ide subversif akan dikurung"
PAR_get_rid_of_colonel_peredes: "Singkirkan Kolonel Paredes"
PAR_get_rid_of_colonel_peredes_desc: "Menteri Dalam Negeri Paredes berpotensi menjadi saingan karena pengaruhnya. Kami akan menyingkirkannya untuk memperkuat otoritas kami"
PAR_ban_the_liberal_party: "Larang Partai Liberal"
PAR_ban_the_liberal_party_desc: "Partai Liberal berkonspirasi dengan Bolivia. Pengasingan para pemimpin mereka adalah satu-satunya hukuman yang pantas. Kami akan mengumpulkan kekuatan kami dari Colorado"
PAR_ensure_army_loyalty: "Pastikan Loyalitas Tentara"
PAR_ensure_army_loyalty_desc: "Perbedaan pendapat semakin meningkat, dan masyarakat melakukan perlawanan luas dan melakukan pemogokan umum. Untuk menghindari kudeta yang sama seperti pendahulu kami, militer akan mendapat sebagian besar PDB negara kami"
PAR_fedrerista_land_reforms: "Reformasi Tanah Febrerista"
PAR_fedrerista_land_reforms_desc: "Kita perlu melakukan reformasi pertanahan yang serius untuk memberdayakan petani dan mendistribusikan kembali tanah mereka dari pemilik tanah yang berkuasa"
PAR_align_with_the_guion_rojo: "Sejajarkan dengan Guión Rojo"
PAR_align_with_the_guion_rojo_desc: "Kita perlu membawa organisasi paramiliter Partai Colorado dan pemimpin mereka, Juan Natalicio González di bawah sayap kita. Kami akan menggunakannya untuk mengancam dan melecehkan oposisi politik kami."
PAR_nazify_the_army: "Nazisasi Angkatan Darat"
PAR_nazify_the_army_desc: "Simbolisme Nazi sudah menyebar luas di kalangan militer. Apa pun selain menerima hal ini, dan bahkan mendorongnya, berarti militer. Kita dapat memanfaatkan hal ini untuk semakin mendekatkan diri pada [GER.GetName] sekaligus menumbuhkan identitas militer yang lebih kuat."
PAR_radicalize_the_police: "Radikalisasi Polisi"
PAR_radicalize_the_police_desc: "Polisi sangat penting dalam menjaga perdamaian internal sementara tentara fokus pada ancaman eksternal, namun mereka bisa menjadi alat yang lebih hebat dalam menopang negara. Kita akan memberi mereka sumber daya yang lebih besar dan sebagai imbalannya menempatkan mereka di tangan pemerintah, dan jika militer atau polisi menjadi terlalu kuat, kita selalu bisa mengadu domba mereka."
PAR_neuter_the_guion_rojo: "Netralkan Guión Rojo"
PAR_neuter_the_guion_rojo_desc: "Kelompok paramiliter radikal di Colorado, Guión Rojo, merupakan ancaman keamanan bagi pemerintah dan terus menjadi duri bagi kami. Kita perlu menetralisir dan melucuti kelompok tersebut sebelum mereka pecah menjadi konflik besar-besaran."
PAR_get_rid_of_obsolete_guns: "Singkirkan Senjata Usang"
PAR_get_rid_of_obsolete_guns_desc: "Persenjataan tentara kita terdiri dari senjata-senjata usang. Kita perlu melakukan modernisasi dengan membuang sisa-sisa logam yang menghambat kita dan memodernisasi penyimpanan kita."
PAR_liga_nacional_independiente: "Liga Nasional Independiente"
PAR_liga_nacional_independiente_desc: "Untuk melanjutkan agenda para pemimpin kami, kami akan memperkuat kelompok progresif LNI untuk memperkuat legitimasi pemerintah dan menghentikan pembangkangan."
PAR_union_nacional_revolucionaria: "Partido Revolucionario Februari"
PAR_union_nacional_revolucionaria_desc: "Partai baru kita akan menjadi satu-satunya partai yang sah di negara ini. Sebuah awal baru bagi Persatuan Nasional Revolusioner di mana kekuasaan dan institusi negara berasal dari kepemimpinan partai."
PAR_accept_american_loans: "Terima Pinjaman Amerika"
PAR_accept_american_loans_desc: "Amerika menekan kita untuk tidak bergabung dengan kekuatan Poros dan bersedia berinvestasi besar-besaran di negara kita untuk mencegah kita semakin dekat dengan musuh-musuh mereka."
PAR_agricultural_technical_assistence: "Bantuan Teknis Pertanian dan Medis"
PAR_agricultural_technical_assistence_desc: "Amerika yang bersedia memberi kita modernisasi teknologi Pertanian dan Medis harus menunda rencana apa pun yang mengancam kepentingan mereka."
PAR_put_estigarribia_on_a_pedestal: "Letakkan Estigarribia di atas tumpuan"
PAR_put_estigarribia_on_a_pedestal_desc: "José Félix Estigarribia secara luas dipandang sebagai pahlawan perang Chaco dan sekarang sebagai tokoh kunci yang memenangkan perang saudara. Kami akan menggunakan dia untuk tujuan propaganda dalam meredakan gejolak perang saudara dan mempersatukan negara serta menghargai jasanya."
PAR_purge_the_military_of_dissent: "Bersihkan militer dari Perbedaan Pendapat"
PAR_purge_the_military_of_dissent_desc: "Estigarribia telah setuju untuk membasmi sisa-sisa perbedaan pendapat di kalangan tentara dan membersihkan hubungan dengan revolusi Franco."
PAR_aftermath_of_the_coup: "Setelah Perang Saudara"
PAR_aftermath_of_the_coup_desc: "Negara ini hancur setelah mengalami hantaman palu demi hantaman. Perang Triple Alliance, konflik Chaco dan sekarang perang saudara kedua telah menyebabkan tanah kami hancur, tapi apa yang bisa kami lakukan selain bertahan? Hari ini dimulailah rekonstruksi besar-besaran, ¡Paz y justicia! Untuk Paraguay!"
PAR_soliders_for_prisoners: "Tahanan sebagai Tentara"
PAR_soliders_for_prisoners_desc: "Tentara kita kekurangan personel setelah perang saudara yang membuat negara kita rentan. Dengan [BOL.GetName] menunggu saat yang tepat untuk mengambil kembali Chaco, kita memerlukan gelombang besar pasukan sebagai penghalang. Kami akan mengampuni para tahanan jika mereka setuju untuk bergabung dengan tentara dan memperkuat pasukan kami sampai pasukan yang tepat dapat dibentuk."
PAR_brazilian_road_finance: "[BRA.GetAdjective] Pembiayaan Jalan"
PAR_brazilian_road_finance_desc: "[USA.GetName] telah meyakinkan pemerintah [BRA.GetAdjective] untuk berinvestasi dalam perluasan infrastruktur jalan kita"
par_has_accepted_american_funds: "Telah Menerima @USA American Funds"
par_has_accepted_american_funds_tt: "Akan menerima dana @USA§Y[USA.GetAdjective]§!, mencegah bergabung dengan faksi lain selama §Y210 hari§!"
PAR_join_the_allies: "Bergabunglah dengan Sekutu"
PAR_join_the_allies_desc: "[USA.GetName] telah menekan kami untuk bergabung dengan sekutu, dan kami tidak melihat alternatif lain yang tidak mengarah pada embargo yang signifikan."
PAR_join_the_axis: "Bergabunglah dengan Poros"
PAR_join_the_axis_desc: "Jelas bahwa sekutu ideologis kita adalah [GER.GetAdjective] dan sekutunya. Kita akan bergabung dengan Poros dan menikmati tatanan dunia baru ini."
PAR_join_the_cominterm: "Bergabunglah dengan Komintern"
PAR_join_the_cominterm_desc: "Baik Poros maupun Sekutu tidak mengarah pada alternatif apa pun yang sejalan dengan ideologi kita, namun [SOV.GetName] jelas merupakan alternatif terhadap dua kejahatan lainnya."
PAR_mythologize_the_father_of_the_nation: "$GUAY_mythologize_the_father_of_the_nation$"
PAR_mythologize_the_father_of_the_nation_desc: "$GUAY_mythologize_the_father_of_the_nation_desc$"
PAR_cult_of_personality: "$GUAY_cult_of_personality$"
PAR_cult_of_personality_desc: "$GUAY_cult_of_personality_desc$"
PAR_nationalize_foreign_owned_companies: "$GUAY_nationalize_foreign_owned_companies$"
PAR_nationalize_foreign_owned_companies_desc: "$GUAY_nationalize_foreign_owned_companies_desc$"
PAR_adopt_minority_languages: "$GUAY_adopt_minority_languages$"
PAR_adopt_minority_languages_desc: "$GUAY_adopt_minority_languages_desc$"
PAR_free_seconday_schools: "$GUAY_free_seconday_schools$"
PAR_free_seconday_schools_desc: "$GUAY_free_seconday_schools_desc$"
PAR_the_permanent_leader: "$GUAY_the_permanent_leader$"
PAR_the_permanent_leader_desc: "$GUAY_the_permanent_leader_desc$"
PAR_specialized_terrain_training: "$GUAY_specialized_terrain_training$"
PAR_specialized_terrain_training_desc: "$GUAY_specialized_terrain_training_desc$"
PAR_urbanization: "$GUAY_urbanization$"
PAR_urbanization_desc: "$GUAY_urbanization_desc$"
idea_PAR_emergency_powers: "Negara di bawah kekuasaan darurat"
idea_PAR_emergency_powers_desc: "Negara ini berada di bawah tindakan darurat yang memungkinkan pemerintahnya untuk menindak pembangkang dan menggunakan kekuatan politik luar negeri yang lebih besar."
URG_terras_dictatorship: "Kediktatoran Terra"
URG_terras_dictatorship_desc: "Gabriel Terra menguasai sebagian besar negara melalui kudeta mandiri 2 tahun yang lalu, namun kita masih harus berupaya untuk lebih memperkuat kendali atas institusi-institusi di negara tersebut."
URG_prohibition_of_usury: "Larangan Riba"
URG_prohibition_of_usury_desc: "Kita tidak bisa lagi membiarkan pemberi pinjaman memberikan pinjaman yang memberikan manfaat yang tidak proporsional kepada pemberi pinjaman. Undang-undang riba perlu diberlakukan untuk mencegah hal-hal seperti itu."
URG_womens_vote: "Suara Perempuan"
URG_womens_vote_desc: "Negara mana pun yang ingin memasuki abad baru perlu mengakui hak-hak perempuan, dan persamaan hak antar jenis kelamin."
URG_break_relations_with_the_ussr: "Putuskan Hubungan Dengan [SOV.GetName]"
URG_break_relations_with_the_ussr_desc: "[SOV.GetName] adalah konstruksi yang tidak wajar. Jelas bahwa jika ada tatanan dunia di masa depan, hal itu terletak pada Eropa Tengah dan [USA.GetName], namun kami tidak melihat alasan untuk mempertahankan hubungan dengan negara paria."
URG_pay_of_all_external_debts: "Lunasi Semua Hutang Luar Negeri"
URG_pay_of_all_external_debts_desc: "Kita masih memiliki sejumlah utang luar negeri ke berbagai negara, dan dalam kondisi saat ini, negara tidak perlu mempunyai tunggakan pembayaran."
URG_import_substitution: "Substitusi Impor"
URG_import_substitution_desc: "Kita akan mendasarkan perekonomian modern kita pada model substitusi impor Belgia untuk mewujudkan perekonomian modern."
URG_la_teja_refinery: "Kilang La Teja"
URG_la_teja_refinery_desc: "Mendirikan kilang minyak modern akan memungkinkan kita menjadi kompetitif di panggung dunia dan mendiversifikasi perekonomian kita."
URG_revaluation_law: "Hukum Revaluasi"
URG_revaluation_law_desc: "Undang-undang revaluasi tahun 1935 perlu diperluas lebih lanjut karena Departemen Penerbitan memonopoli seluruh aktivitas perbankan."
URG_brou: "Kawan"
URG_brou_desc: "Bank Republik Timur Uruguay perlu mendapatkan tanggung jawab tambahan dan menyiapkan dana mata uang untuk melikuidasi utang luar negeri kita."
URG_right_to_food_housing_and_health: "Hak atas Pangan, Perumahan dan Kesehatan"
URG_right_to_food_housing_and_health_desc: "Kami akan menjadikan hak atas pangan, perumahan dan kesehatan sebagai landasan utama dalam konstitusi, dan memberikan bantuan kepada warga negara kami yang paling miskin."
URG_conaprole: "Conaprole"
URG_conaprole_desc: "Susu merupakan produk yang baik, penuh nutrisi, dan tersedia berlimpah, dan kita adalah negara terbaik untuk mengeksploitasinya. Koperasi Produsen Susu Nasional akan memonopoli produk susu dan infrastruktur terkait yang akan mendorong pertumbuhan negara."
URG_ministry_of_public_works: "Bantuan Kementerian Pekerjaan Umum"
URG_ministry_of_public_works_desc: "Untuk mendorong upaya industrialisasi di negara kita, kita akan membuat program pembangunan jalan dan perumahan pekerja secara besar-besaran melalui Kementerian Pekerjaan Umum"
URG_rapid_industrialization: "Industrialisasi yang Pesat"
URG_rapid_industrialization_desc: "Semuanya sudah siap untuk membawa negara kita memasuki era baru. Kita akan memulai perjalanan industrialisasi yang pesat dan membawa negara kita memasuki abad ke-20."
URG_pluna: "Pluna"
URG_pluna_desc: "Pluna adalah maskapai penerbangan yang sedang naik daun untuk kargo dan layanan charter. Berinvestasi dalam hal ini dapat membawa industri penerbangan kita memasuki era modern."
URG_mercado_modelo: "Pasar Modelo"
URG_mercado_modelo_desc: "Sudah waktunya untuk meninggalkan pasar pertanian lama dan meresmikan Mercado Modelo, pasar pertanian terbesar di negara ini."
URG_tour_to_italy: "Tur ke [ITA.GetName]"
URG_tour_to_italy_desc: "Pemimpin kami akan melakukan tur ke [ITA.GetName] untuk memperkuat hubungan ekonomi antar negara kami."
URG_recognize_francoist_spain: "Kenali Spanyol Francoist"
URG_recognize_francoist_spain_desc: "Jelas bahwa Spanyol Francoist adalah negara Spanyol yang sah. Kami akan segera mengenalinya sebagai Spanyol yang sebenarnya."
URG_rincon_del_bonete_hydroelectric_power_station: "Pembangkit Listrik Rincón del Bonete"
URG_rincon_del_bonete_hydroelectric_power_station_desc: "Elektrifikasi negara kita adalah kunci modernisasi. Negara [GER.GetAdjective] bersedia mendanai pembangunan proyek semacam itu, memperkuat hubungan kita."
URG_allow_nazi_movements_among_german_uruguayan: "[GER.GetAdjective]-[URG.GetAdjective] Gerakan Nazi"
URG_allow_nazi_movements_among_german_uruguayan_desc: "Ada Gerakan Nazi kecil di antara minoritas [GER.GetAdjective]-[URG.GetAdjective] di negara ini, yang tidak diragukan lagi dipengaruhi oleh kebijakan luar negeri tanah air mereka. Beberapa pihak menyerukan untuk menghentikan retorika ini, namun hal ini dapat digunakan untuk menyebarkan agenda kita lebih lanjut."
URG_merge_falangist_movements: "Gabungkan Gerakan Falang"
URG_merge_falangist_movements_desc: "Kecuali revisionisme Uruguay yang dipicu oleh Adolfo Agorio, Falangisme adalah gerakan otoriter paling populer di negara ini, namun mereka terpecah menjadi beberapa kelompok. Kita akan menyatukan mereka menjadi sebuah gerakan yang lebih besar dibandingkan jika mereka berdiri sendiri-sendiri."
 URG_accion_revisionista_del_uruguay: "Aksi Revisionista del Uruguay"
 URG_accion_revisionista_del_uruguay_desc: "Adolfo Agorio adalah salah satu tokoh utama fasisme Uruguay. Pengaruhnya dan sejenisnya bisa menjadi batu loncatan untuk gerakan yang lebih besar yang akan melanda [URG.GetName]. Kami akan mengundang mereka ke dalam pemerintahan dan memberi mereka legitimasi yang tepat."
 URG_force_through_corporatism: "Kekuatan Melalui Korporatisme"
 URG_force_through_corporatism_desc: "Pemerintah sudah pernah mencoba menerapkan Korporatisme, namun hal ini dilawan dengan gigih oleh para politisi pada saat itu dan gagasan tersebut dibatalkan. Saat ini tidak akan ada kompromi, kami akan mendorong undang-undang ini ke tingkat yang sangat tinggi"
 URG_establish_the_german_uruguayan_cultural_center: "Memberdayakan Pusat Kebudayaan Fuhrmann"
 URG_establish_the_german_uruguayan_cultural_center_desc: "Pusat Kebudayaan [GER.GetAdjective]-[URG.GetAdjective] didirikan oleh Arnulf Fuhrmann untuk menyebarkan propaganda pro-Nazi di negara tersebut, yang terus berkembang sejak tumbuhnya Poros. Sementara pemerintah mencoba untuk menindak hal ini, kami akan mendanai upaya ini, menyuap orang-orang yang tepat agar tetap utuh."
 URG_the_fuhrmann_plan: "Rencana Fuhrmann"
 URG_the_fuhrmann_plan_desc: "Arnulf Fuhrmann menyarankan agar [URG.GetName] menjadi koloni [GER.GetName], bertindak sebagai batu loncatan bagi front Poros di Amerika Selatan. Mungkin bukan sebagai koloni, tapi sebagai pengurus Poros Amerika Selatan?"
 URG_the_american_springboard: "Batu loncatan Amerika"
 URG_the_american_springboard_desc: "Dengan kekuatan yang terjamin dan pendukung yang kuat di belakang kita, kita siap untuk mulai menaklukkan tetangga-tetangga kita."
 URG_food_for_the_warmachine: "Makanan untuk Mesin Perang"
 URG_food_for_the_warmachine_desc: "Dengan sebagian besar lahan pertanian di bawah kendali kita, kita bisa mulai mengirimkan makanan ke sekutu kita, sehingga memperkuat kekuatan kita."
 URG_colorado_victory: "Kemenangan Pemilu Colorado"
 URG_colorado_victory_desc: "Tidak ada keraguan bahwa Colorado akan terus berkuasa [URG.GetName]"
 URG_terra_election: "Pemilu tahun 1938 telah terjadi"
 URG_blanco_victory: "Kemenangan Pemilu Blanco"
 URG_blanco_victory_desc: "Kegaduhan yang mungkin disebabkan oleh Kediktatoran Gabriel Terras telah menyebabkan para pemilih terasing dari Colorado, sehingga membuat Blanco berkuasa."
URG_declare_neutrality: "Deklarasikan Netralitas"
URG_declare_neutrality_desc: "Kami tidak punya urusan untuk terlibat dalam urusan Eropa."
URG_legalize_the_pool: "Legalkan Kolam Renang"
URG_legalize_the_pool_desc: "Melegalkan kelompok tersebut akan meningkatkan pendapatan negara bagian sekaligus menjadi sangat populer di kalangan masyarakat."
URG_break_diplomatic_relations_with_the_axis: "Putuskan Hubungan Diplomatik dengan Poros"
URG_break_diplomatic_relations_with_the_axis_desc: "Meskipun sudah menyatakan netralitas, namun menjadi jelas bahwa Poros kejahatan tidak lagi dapat ditoleransi. Angin perang sangat berpihak pada Sekutu, dan kita tidak perlu berada di pihak yang kalah."
URG_join_the_allies: "Bergabunglah dengan Sekutu"
URG_join_the_allies_desc: "Setelah mendapat tekanan dari [USA.GetName], jelas bahwa kita tidak bisa lagi menghindari perang. Sedikit yang bisa kita lakukan sekarang akan diperjuangkan."
URG_a_new_constitution: "Konstitusi Baru"
URG_a_new_constitution_desc: "Konstitusi saat ini tidak bisa dijalankan. Kita membutuhkan sesuatu yang baru untuk mendorong negara ini memasuki era baru."
URG_the_good_coup: "Kudeta \"Baik\""
URG_the_good_coup_desc: "Konstitusi telah mendapat perlawanan sengit. Kita tidak bisa berlama-lama dengan politik yang sia-sia jika kita ingin membawa Uruguay ke masa depan. Seperti yang dilakukan Terra sebelumnya, kami akan melakukan kudeta mandiri, namun alih-alih melakukan penangkapan besar-besaran dan kekerasan, kami akan melakukannya tanpa pertumpahan darah dan penganiayaan."
URG_law_no_9914: "UU No.9914"
URG_law_no_9914_desc: "Dengan [FIN.GetName] diserang oleh [SOV.GetNameDef] pemerintah telah menyetujui UU 9914 yang memperbolehkan Peso disisihkan untuk membantu Finlandia. Kami telah mengumpulkan Wol dan 10.600.000 gram daging sapi kaleng, yang masing-masing kaleng bertuliskan \"dari rakyat Uruguay hingga tentara heroik Finlandia\"."
URG_investigate_german_and_italian_cultural_organization: "Selidiki Organisasi Jerman dan Italia"
URG_investigate_german_and_italian_cultural_organization_desc: "Organisasi kebudayaan dan olahraga yang terkait dengan Italia dan Jerman diduga menampung simpatisan fasis. Kita perlu mengawasi dan menyelidiki mereka jika ada pelanggaran apa pun."
URG_american_air_bases: "Pangkalan Udara Amerika"
URG_american_air_bases_desc: "Amerika mendesak kita untuk mengizinkan mereka mendirikan pangkalan udara di wilayah kita. Hal ini tentunya akan membantu kita melindungi diri kita dari segala ancaman Axis"
URG_law_no_9943: "UU No.9943"
URG_law_no_9943_desc: "Meskipun bersikap netral, jelas bahwa dunia sedang berada dalam ketidakpastian. Kita perlu mempersiapkan pasukan kita dan memberlakukan wajib militer di seluruh negeri untuk mempertahankan perbatasan kita."
URG_herrerismo: "Herrerismo"
URG_herrerismo_desc: "Pemimpin kita telah menciptakan Herrerismo, perpaduan antara nasionalisme, konservatisme, dan populisme. Dengan ini ia berharap bisa membangun basis politik yang kuat."
URG_traditionalism: "Tradisionalisme"
URG_traditionalism_desc: "Kembali ke tradisi adalah jalan menuju masa depan. Apa yang berhasil sebelumnya akan berhasil sekarang."
URG_ruralism: "Pedesaan"
URG_ruralism_desc: "Basis pemilih kami berada di wilayah pedesaan di negara ini dan sangat penting bagi kami untuk berinvestasi besar-besaran di wilayah tersebut."
URG_americanism: "Amerikanisme"
URG_americanism_desc: "Kita perlu memastikan bahwa fokus kita sebagai sebuah negara adalah pada nilai-nilai Amerika Selatan dan melindunginya dalam urusan luar negeri."
URG_anti_imperialism: "Anti-Imperialisme"
URG_anti_imperialism_desc: "Kita perlu mengambil sikap yang jelas terhadap imperialisme dan gangguan kekuatan asing di Amerika Selatan."
URG_anticentralism: "Anti-Sentralisme"
URG_anticentralism_desc: "Jelas bahwa upaya untuk memusatkan negara di sekitar Montevideo tidaklah masuk akal. Lebih baik menjunjung tinggi nilai-nilai masyarakat pedesaan dimana mereka berada, dan masyarakat perkotaan dimana mereka berada, sehingga semua dapat berkembang bersama."
URG_legacy_of_batlle: "Warisan Batlle"
URG_legacy_of_batlle_desc: "Ke mana pun masa depan membawa kita, jelas bahwa partai Colorado selamanya terikat pada warisan José Batlle y Ordóñez. Kami akan selalu menganut gagasan keadilan sosial universal"
URG_statism: "Statisme"
URG_statism_desc: "Negara yang jelas dan kuat dengan kendali terpusat atas urusan sosial dan ekonomi adalah suatu keharusan di masa sekarang ini."
