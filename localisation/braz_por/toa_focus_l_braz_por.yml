 SMB_enlarge_naval_facilities_default: "Memperbesar Fasilitas Angkatan Laut"
 SMB_merchant_marine_default: "Pedagang Laut yang Kuat"
 SMB_fortification_effort_default: "Upaya Fortifikasi"
