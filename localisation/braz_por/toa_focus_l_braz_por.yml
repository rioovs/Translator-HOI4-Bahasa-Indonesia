 SMB_army_URG: "Ejército Nacional del Uruguay"
 SMB_air_force_URG: "Fuerza Aérea Uruguaya"
 SMB_navy_URG: "Armada Nasional del Uruguay"
 SMB_mountain_guns: "Berinvestasi di Senjata Gunung"
 SMB_mountain_guns_desc: "Tentara kami telah mencatat bahwa meskipun mereka mungkin sangat kuat, artileri saat ini hampir tidak dapat digunakan di daerah pegunungan Chile. Oleh karena itu, mereka memesan senjata gunung yang dibuat agar lebih mudah digunakan di pegunungan, agar kita dapat terus menggunakan senjata mematikan tersebut."
 SMB_tierra_del_fuego_training: "Berlatih di Tierra del Fuego"
 SMB_tierra_del_fuego_training_desc: "Prajurit kita perlu dilatih dengan baik jika kita ingin mereka bertempur secara efektif di wilayah selatan yang dingin dan di pegunungan. Oleh karena itu, kita harus memastikan untuk mendirikan kamp pelatihan bagi pasukan di Tierra del Fuego, agar mereka dapat menyesuaikan diri dengan dingin dengan lebih baik."
 SMB_atacama_training: "Berlatih di Gurun Atacama"
 SMB_atacama_training_desc: "Prajurit kita perlu dilatih dengan baik jika kita ingin mereka bertempur secara efektif di tengah panasnya daerah tropis dan gurun. Cara terbaik untuk mengatasi masalah ini adalah dengan mendirikan kamp pelatihan di gurun Atacama, agar mereka dapat menyesuaikan diri dengan suhu panas dengan lebih baik."
 SMB_a_land_of_mountains: "Negeri Pegunungan"
 SMB_a_land_of_mountains_desc: "[ROOT.GetName] telah lama memiliki tradisi kuat dalam memanfaatkan medan pegunungan untuk keuntungannya saat berperang, dan masa depan pun demikian. Kami adalah masyarakat yang terbiasa tinggal di pegunungan, dan kami akan menggunakan keahlian kami untuk mengalahkan raksasa apa pun yang kami hadapi."
 SMB_navy_desc: "[SMB_navy_desc_key]"
 SMB_navy_desc_default: "Angkatan Laut kita telah mengalami stagnasi sejak Perang Besar sehingga banyak kapal kita tidak lagi dapat digunakan. Sudah saatnya kita berinvestasi pada armada dan memulai program modernisasi besar-besaran."
 SMB_CHL_navy_desc: "Meskipun armada kita mempunyai tradisi yang panjang dan membanggakan, prestise Angkatan Laut kita rusak parah akibat pemberontakan angkatan laut tahun 1931. Dengan berinvestasi pada Armada de Chile kita dapat membantu membangun kembali kepercayaan masyarakat terhadap Angkatan Laut kita."
 SMB_naval_academy_desc: "[SMB_naval_academy_desc_key]"
 SMB_naval_academy_default_desc: "Memproduksi dan memelihara kapal saja tidak cukup untuk membentuk angkatan laut. Kami membutuhkan perwira dan spesialis yang sangat terlatih dalam memanfaatkan aset angkatan laut dalam pertempuran. Oleh karena itu, kami akan mendirikan akademi angkatan laut [ROOT.GetAdjective] untuk melatih perwira angkatan laut generasi berikutnya."
 SMB_naval_academy_CHL_desc: "Angkatan Laut Escuela kami memiliki sejarah panjang dalam melatih perwira angkatan laut yang terampil, namun investasi berkelanjutan sangat penting untuk memastikan laksamana dan kapten kami siap menghadapi peperangan laut modern."
 SMB_construct_naval_bases_desc: "Fasilitas angkatan laut kita sudah kuno dan sangat membutuhkan modernisasi. Dengan berinvestasi pada fasilitas-fasilitas tersebut, kita akan mampu membangun dan mendukung aset-aset angkatan laut yang jauh lebih mampu."
 SMB_naval_foreign_advisors_desc: "Perwira angkatan laut kita baru-baru ini memiliki sedikit kesempatan untuk menguji kemampuan mereka dalam pertempuran. Oleh karena itu, kita dapat memperoleh manfaat dengan mengundang perwira angkatan laut asing untuk melatih perwira kita sendiri dalam taktik angkatan laut modern."
 SMB_reescalate_the_naval_arms_race_desc: "Meskipun kami tidak memiliki kesepakatan resmi dengan negara-negara tetangga mengenai jumlah angkatan laut kami, kami telah menahan diri untuk tidak memperluas angkatan laut kami secara berlebihan sejak Perang Besar. Namun, perang akan segera terjadi lagi dan akan lebih baik bagi kita untuk lebih dulu melakukan persenjataan dibandingkan negara tetangga kita."
 SMB_blue_water_fleet_desc: "Proyeksi kekuatan angkatan laut sangat penting bagi negara mana pun yang ingin bergabung dengan negara-negara besar atau mempertahankan pertahanan yang kuat terhadap musuh. Oleh karena itu kita harus memastikan angkatan laut kita mempunyai peralatan dan pelatihan yang tepat untuk beroperasi secara efektif bahkan ketika jauh dari pelabuhan asal."
 SMB_coastal_fleet_desc: "Kita mempunyai sedikit aspirasi untuk berperang di seluruh dunia. Oleh karena itu, tujuan utama armada kita adalah untuk melindungi garis pantai kita dan mencegah musuh mendaratkan pasukan di pantai kita."
 SMB_purchase_cruisers_and_dreadnoughts_desc: "Meskipun kekuatan industri kita terus bertumbuh, waktu tidak berpihak pada kita. Untuk memperkuat angkatan laut kita secara memadai, kita membutuhkan lebih banyak kapal besar sesegera mungkin. Oleh karena itu, kita akan menghubungi negara-negara besar untuk melihat apakah mereka bersedia menjual kapal penempur dan kapal penjelajah mereka yang sudah tidak digunakan lagi."
 SMB_minelaying_desc: "Mempertahankan jumlah kapal yang cukup untuk mempertahankan garis pantai kita yang luas setiap saat bisa jadi sangat mahal. Ranjau menawarkan solusi yang lebih murah yang dapat membantu menghalangi atau memperlambat pasukan musuh hingga armada tiba."
 SMB_escort_fleet_desc: "Hari-hari armada pertempuran besar telah berakhir, peperangan laut modern membutuhkan armada kapal yang lebih kecil dalam formasi pengawalan bersama dengan sejumlah kapal besar. Oleh karena itu angkatan laut perlu mengubah orientasi rencana mereka untuk mengakomodasi taktik semacam itu."
 SMB_raiding_fleet_desc: "Jalur pasokan angkatan laut sangat penting bagi berfungsinya sebagian besar perekonomian. Menggunakan aset angkatan laut kita untuk mengganggu jalur pasokan bisa menjadi cara untuk membuat negara-negara paling kuat sekalipun bertekuk lutut."
 SMB_degaussing_desc: "Kami akan mulai melakukan degauss pada lambung kapal kami, mengurangi sifat magnetisnya. Hal ini melindungi mereka dari ranjau magnet dan mengurangi profil elektronik kapal."
 SMB_naval_invasion_desc: "Berurusan dengan negara musuh sering kali membutuhkan tentara yang mendarat di pantainya. Untuk memaksimalkan kemampuan kami dalam melaksanakan operasi tersebut, kami akan mulai melatih angkatan darat dan angkatan laut dalam latihan gabungan."
 SMB_cruiser_subs_desc: "Samudera Atlantik dan Pasifik sangat luas dan membutuhkan kapal selam yang dapat beroperasi secara efisien untuk jangka waktu yang lama. Oleh karena itu kita perlu berinvestasi dalam pengembangan kapal selam penjelajah kita sendiri."
 SMB_midget_subs_desc: "Mengoperasikan kapal selam mandiri di lautan luas akan menjadi usaha yang sia-sia. Kita dapat memanfaatkan sumber daya kita dengan lebih baik dengan membangun kapal-kapal kecil yang beroperasi di perairan dangkal di garis pantai kita."
 SMB_expand_repair_yards_desc: "Bahkan kapal paling kuat dengan awak paling efisien pun pada akhirnya memerlukan perbaikan sebelum kembali bertugas aktif. Kita harus berinvestasi pada tempat perbaikan angkatan laut untuk memastikan prosesnya berlangsung secepat mungkin."
 SMB_enlarge_naval_facilities_desc: "Perkembangan terkini di seluruh dunia telah memperjelas bahwa angkatan laut kita harus diperluas jika ingin mempertahankan armada yang memadai. Langkah pertama untuk mencapai hal ini adalah memperluas fasilitas angkatan laut yang ada."
 SMB_merchant_marine_desc: "Pengangkutan sumber daya melalui laut sangat penting bagi keamanan nasional banyak negara, termasuk negara kita. Oleh karena itu, kita harus membentuk armada laut niaga profesional yang mampu mendukung militer kita di saat krisis."
 SMB_aircraft_carriers_desc: "Untuk menghindari tertinggal dari musuh, kita perlu memasukkan pesawat ke dalam angkatan laut kita. Untuk melakukan hal tersebut, kita perlu memproduksi kapal induk sendiri. Memanfaatkan lambung kapal kita yang lebih besar dan sudah ketinggalan zaman mungkin merupakan salah satu cara untuk mempercepat produksi kapal tersebut."
 SMB_fortification_effort_desc: "Meskipun angkatan laut dan udara adalah sarana utama kita untuk mencegah pasukan musuh mencapai pantai kita, kita tetap harus mempertahankan serangkaian benteng pantai yang kokoh sebagai garis pertahanan terakhir terhadap penyerang mana pun."
