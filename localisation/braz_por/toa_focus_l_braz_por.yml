 SMB_jungle_warfare_training: "Membangun CIGS"
 SMB_jungle_warfare_training_desc: "Sejumlah perwira militer kami mendesak kami untuk berinvestasi dalam pendirian fasilitas pelatihan khusus di Amazon. Tujuan dari fasilitas ini adalah untuk mempersiapkan pasukan kita menghadapi peperangan tidak konvensional di hutan dan mempromosikan penggunaan medan sebagai sekutu selama pertempuran."
 SMB_brown_water_navy: "Angkatan Laut Air Coklat"
 SMB_brown_water_navy_desc: "Sungai-sungai yang mengalir melalui hutan-hutan Amerika Selatan tidak dimanfaatkan secara memadai oleh militer kita. Kami akan memperluas armada perairan coklat kami dengan sejumlah perahu penyerang sungai kecil untuk membantu dukungan tentara kami ketika mereka jauh dari bala bantuan atau pasokan."
