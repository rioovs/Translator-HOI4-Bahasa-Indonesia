 SMB_carrier_conversion: "Kapal Induk yang Dikonversi"
 SMB_carrier_conversion_desc: "Kekuatan angkatan laut dan udara kita tidak cukup untuk membela kepentingan nasional kita. Meskipun kita tidak mampu membangun kapal induk yang dirancang khusus, kita dapat membeli kapal penjelajah yang sudah dinonaktifkan dan mengubahnya menjadi kapal induk sederhana sebagai tindakan sementara."
