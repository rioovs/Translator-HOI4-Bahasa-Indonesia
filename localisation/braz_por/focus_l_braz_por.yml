 remove_political_advisor:0 "§RDihapus§! sebagai §YPenasihat Politik§!:\n"
 remove_chief_of_army:0 "§RDihapus§! sebagai §YKepala Staf Angkatan Darat§!:\n"
 remove_chief_of_navy:0 "§RDihapus§! sebagai §YKepala Staf Angkatan Laut§!:\n"
