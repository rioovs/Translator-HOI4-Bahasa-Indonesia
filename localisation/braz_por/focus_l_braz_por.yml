 purge_2_group_b:0 "Dibersihkan oleh Stalin"
 counter_purge:0 "Dibersihkan oleh Trotsky"
 SOV_war_since_purge:0 "Telah mengalami perang sejak menyelesaikan Pembersihan Besar"
 FRA_metropolitan_france:2 "Investasi di Prancis Metropolitan"
 FRA_metropolitan_france_tt:0 "Slot bangunan tidak cukup untuk §YInfrastruktur§! di Prancis Metropolitan."
 FRA_metropolitan_france_desc:0 "La Métropole harus selalu diutamakan. Kita dapat memulainya dengan memperbaiki jaringan jalan kereta api dan infrastruktur industri di seluruh Prancis daratan."
 FRA_algerie_france:2 "Investasi di Aljazair Prancis"
 FRA_algerie_france_tt:0 "Slot bangunan tidak cukup untuk §YInfrastruktur§! di Aljazair Prancis"
 FRA_algerie_france_desc:0 "Aljazair bukan sekadar koloni; ia adalah tiga departemen resmi Prancis. Berinvestasi di sana akan memperkuat ikatan dan membuka cadangan mineral baru."
 FRA_industrial_expansion:0 "Ekspansi Industri"
 FRA_industrial_expansion_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Sipil§! di Prancis Metropolitan"
 FRA_industrial_expansion_desc:0 "Kita membutuhkan basis industri yang lebih kuat di tanah air. Kita memiliki banyak tenaga kerja terampil untuk menggerakkan pabrik-pabrik baru."
 FRA_colonial_industry:0 "Industri Kolonial"
 FRA_colonial_industry_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Sipil§! di Prancis Kolonial"
 FRA_colonial_industry_desc:1 "Imperium kolonial Prancis yang luas di Afrika dan Indocina harus dikembangkan untuk menyumbang pabrik dan bahan mentah bagi tanah air."
 FRA_military_factories:0 "Pabrik Militer"
 FRA_military_factories_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Militer§! di Prancis Metropolitan"
 FRA_military_factories_desc:1 "Kapasitas mesin perang kita tertinggal dari para tetangga. Kita harus berfokus membangun pabrik senjata dan amunisi baru."
 FRA_colonial_military_factories:0 "Pabrik Militer Kolonial"
 FRA_colonial_military_factories_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Militer§! di Prancis Kolonial"
 FRA_colonial_military_factories_desc:0 "Menempatkan sebagian produksi militer kita di luar Eropa menjamin bahwa jika daratan utama diserbu, perjuangan kita dapat terus berlanjut dari koloni seberang laut."
 FRA_extra_research_slot:2 "Dukung Grandes Écoles"
 FRA_extra_research_slot_desc:0 "Generasi muda berbakat bermunculan di politeknik dan universitas kita. Memberi mereka dana riset yang memadai akan melahirkan inovasi militer baru."
 FRA_nuclear_effort:0 "Upaya Nuklir"
 FRA_nuclear_effort_desc:0 "Penelitian awal oleh Frédéric Joliot-Curie telah menunjukkan potensi luar biasa fisi nuklir. Menguasai sains atom akan mengangkat Prancis ke tingkat kekuatan baru."
 FRA_jet_effort:0 "Upaya Pesawat Jet"
 FRA_jet_effort_desc:0 "Pertempuran udara menuntut kecepatan dan mobilitas ekstrem. Mesin jet adalah lompatan teknologi yang harus kita kuasai."
 FRA_extra_research_slot_2:2 "Bentuk Pusat Riset Nasional (CNRS)"
 FRA_extra_research_slot_2_desc:0 "Mendirikan Centre National de la Recherche Scientifique akan mengoordinasikan seluruh upaya ilmiah bangsa demi pertahanan negara."
 FRA_defensive_focus:0 "Fokus Defensif"
 FRA_defensive_focus_desc:0 "Di masa rawan seperti ini, pilihan paling bijaksana adalah memperkuat pertahanan tanah air dan membiarkan musuh kehabisan darah di benteng kita."
 FRA_aggressive_focus:0 "Fokus Agresif"
 FRA_aggressive_focus_desc:0 "Kita tidak bisa hanya berdiam diri saat musuh mendekati perbatasan kita. Doktrin serangan cepat harus dihidupkan kembali."
 FRA_fortification_focus:0 "Fokus Benteng Pertahanan"
 FRA_fortification_focus_desc:0 "Mengingat betapa krusialnya benteng bagi strategi nasional kita, kita harus menemukan cara untuk membangun kubah baja dan bunker beton secara lebih cepat dan hemat biaya."
 FRA_alpine_forts:0 "Benteng Pegunungan Alpen"
 FRA_alpine_forts_desc:0 "Pasukan Italia tidak akan bisa menyeberangi perbatasan dengan mudah begitu kita selesai menutup celah-celah Alpen dengan bunker beton tebal."
 FRA_extend_the_maginot_line:0 "Perluas Garis Maginot"
 FRA_extend_the_maginot_line_desc:0 "Garis Maginot yang megah mengamankan perbatasan timur kita dengan Jerman, namun sayap utara di sepanjang Belgia masih terbuka. Kita harus memperluas benteng pertahanan hingga ke pantai Laut Utara."
 FRA_infantry_focus:0 "Levée en masse"
 FRA_infantry_focus_desc:0 "Semua warga yang mampu mengangkat senjata akan dikerahkan. Memproduksi senapan dan seragam secara massal adalah kunci tentara rakyat."
 FRA_artillery_focus:0 "Grande Batterie"
 FRA_artillery_focus_desc:0 "Artileri kita akan dipusatkan dalam baterai-baterai tembak raksasa untuk menghujani posisi musuh dengan rentetan peluru pemusnah."
 FRA_heavy_armor_focus:0 "Char de Bataille"
 FRA_heavy_armor_focus_desc:0 "Tank tempur berat seperti Char B1 bis adalah masa depan Angkatan Darat Prancis. Mereka akan menghancurkan setiap kubu pertahanan musuh."
 FRA_motorized_focus:0 "Fokus Bermotor"
 FRA_motorized_focus_desc:0 "Menemukan metode yang lebih baik untuk memproduksi truk dan kendaraan infanteri akan meningkatkan mobilitas pasukan divisi kita di medan tempur."
 FRA_mechanized_focus:0 "Fokus Mekanis"
 FRA_mechanized_focus_desc:0 "Kendaraan lapis baja memainkan peran yang semakin penting dalam perang modern. Kita harus mempersenjatai infanteri kita dengan pengangkut personel lapis baja."
 FRA_light_medium_armor:0 "Automitrailleuses"
 FRA_light_medium_armor_desc:0 "Menurut undang-undang, kavaleri dan infanteri membutuhkan kendaraan lapis baja tempur (automitrailleuses) untuk pengintaian dan serangan cepat."
 FRA_army_reform:0 "Reformasi Angkatan Darat"
 FRA_army_reform_desc:0 "Tidak ada satu jenis senjata pun yang dapat memenangkan perang sendirian tanpa doktrin komando yang fleksibel. Kita harus merombak staf umum dan doktrin usang kita."
 FRA_navy_focus:0 "Fokus Angkatan Laut"
 FRA_navy_focus_tt:0 "Slot bangunan tidak cukup untuk §YPangkalan Angkatan Laut§!"
 FRA_navy_focus_desc:0 "Jika kita berencana memperluas angkatan laut kita, langkah pertama adalah memperbesar pangkalan laut utama kita di Toulon dan Brest."
 FRA_improved_screen_ships:0 "Kapal Pengawal yang Disempurnakan"
 FRA_improved_screen_ships_desc:0 "Kapal perusak dan kapal penjelajah ringan memainkan peran kunci dalam melindungi kapal tempur dan jalur suplai Mediterania kita."
 FRA_capital_ship_focus:0 "Fokus Kapal Utama"
 FRA_capital_ship_focus_desc:0 "Menyempurnakan desain kapal tempur kelas Richelieu dan Dunkerque akan memberi keunggulan taktis mutlak atas armada Italia."
 FRA_carrier_focus:0 "Fokus Kapal Induk"
 FRA_carrier_focus_desc:0 "Para teoretikus angkatan laut telah mengingatkan kita akan usangnya kapal induk Béarn. Kita harus merancang kapal induk modern kelas Joffre."
 FRA_initiate_government_reform:0 "Reformasi Pemerintahan"
 FRA_initiate_government_reform_desc:0 "Dunia semakin berbahaya. Republik Ketiga tidak boleh lagi dilumpuhkan oleh krisis kabinet yang terus berganti setiap beberapa bulan."
 FRA_support_the_left:0 "Dukung Sayap Kiri"
 FRA_support_the_left_desc:0 "Kekuatan kaum buruh dan sosialis semakin menguat. Saatnya membuktikan bahwa kepentingan rakyat jelata adalah prioritas negara."
 FRA_leftist_rhetoric:0 "Retorika Sayap Kiri"
 FRA_leftist_rhetoric_desc:0 "Tujuan kita jelas: keadilan sosial dan kesetaraan bagi semua, mengakhiri eksploitasi oleh para oligarki industri."
 FRA_scw_intervention_republicans:0 "Intervensi untuk Republikan"
 FRA_scw_intervention_republicans_desc:0 "Spanyol Republik membutuhkan bantuan kita! Kirimkan senjata, pesawat, dan sukarelawan untuk membela demokrasi dari pemberontakan fasis."
 FRA_national_mobilization:0 "Mobilisasi Nasional"
 FRA_national_mobilization_desc:0 "Kita akhirnya memiliki pemerintahan yang mampu bertindak tegas. Saatnya memobilisasi seluruh sumber daya bangsa untuk menghadapi krisis."
 FRA_humanite_unie:0 "Humanité Unie"
 FRA_humanite_unie_desc:0 "Para demagog fasis dan bankir tamak terus menindas kaum pekerja. Persatuan umat manusia yang tertindas akan menjadi kekuatan pembebas."
 FRA_join_comintern:0 "Bergabung dengan Komintern"
 FRA_join_comintern_desc:0 "Dengan ancaman fasisme di sekeliling kita, mempererat hubungan dengan Uni Soviet adalah aliansi strategis terkuat bagi keselamatan kita."
 FRA_support_status_quo:0 "Dukung Status Quo"
 FRA_support_status_quo_desc:0 "Prancis adalah buaian dan pelindung kebebasan dan harus tetap demikian. Menjaga stabilitas institusi republik adalah tugas suci kita."
 FRA_little_entente:0 "Entente Kecil"
 FRA_little_entente_desc:0 "Membentuk aliansi erat dengan Cekoslowakia, Rumania, dan Yugoslavia akan mengelilingi Jerman dan memelihara tatanan pasca-Perang Besar di Eropa Tengah."
 FRA_go_with_britain:0 "Bersama Britania"
 FRA_go_with_britain_desc:0 "Menjaga Entente Cordiale dengan Inggris adalah jaminan terbaik bagi kelangsungan hidup Prancis dalam menghadapi ancaman Poros."
 FRA_strengthen_government_support:0 "Perkuat Pemerintahan"
 FRA_strengthen_government_support_desc:0 "Rencana pembangunan nasional yang matang akan memenuhi harapan rakyat dan memulihkan wibawa negara."
 FRA_defensive_strategems:0 "Strategi Defensif"
 FRA_defensive_strategems_desc:0 "Jika kita ingin rakyat Prancis berjuang bersama kita, sangat penting untuk meyakinkan mereka bahwa pertahanan tanah air kokoh tak tergoyahkan."
 FRA_invite_yugoslavia:0 "Undang Yugoslavia"
 FRA_invite_yugoslavia_desc:0 "Yugoslavia membutuhkan perlindungan dari agresi revisionis Italia. Mengundang mereka ke faksi kita akan memperkuat persekutuan Balkan."
 FRA_invite_romania:0 "Undang Rumania"
 FRA_invite_romania_desc:0 "Demokrasi Rumania rapuh di tengah tekanan internal dan eksternal. Menjamin kemerdekaan mereka akan mengamankan sayap timur Eropa."
 FRA_polish_guarantee:0 "Jaminan Polandia"
 FRA_polish_guarantee_desc:0 "Para diplomat Polandia sangat khawatir akan ketegangan di perbatasan mereka. Prancis harus menegaskan kembali komitmen aliansi militer kita dengan Warsawa."
 FRA_czech_guarantee:0 "Jaminan Cekoslowakia"
 FRA_czech_guarantee_desc:0 "Ketegangan meningkat di Sudetenland. Kita tidak boleh membiarkan Hitler meremukkan sekutu demokrasi setia kita di Cekoslowakia."
 FRA_revise_versailles:0 "Revisi Versailles"
 FRA_revise_versailles_desc:0 "Klausul-klausul usang dari Perjanjian Versailles perlu disesuaikan melalui diplomasi rasional demi menciptakan perdamaian abadi di Eropa."
 FRA_support_the_right:0 "Dukung Sayap Kanan"
 FRA_support_the_right_desc:0 "Prancis selalu menjadi bangsa yang kuat dan bangga, namun kelemahan parlementer telah melumpuhkan kemauan nasional. Saatnya memulihkan ketertiban, otoritas, dan tradisi."
 FRA_right_wing_rhetoric:0 "Retorika Sayap Kanan"
 FRA_right_wing_rhetoric_desc:0 "Kita harus menjangkau setiap warga Prancis dan membangkitkan kebanggaan nasionalis mereka untuk melawan ancaman komunisme dan kebobrokan moral."
 FRA_scw_intervention_nationalists:0 "Intervensi untuk Nasionalis"
 FRA_scw_intervention_nationalists_desc:0 "Kaum Nasionalis akhirnya meraih kemenangan di Spanyol. Mendukung Franco akan mengamankan perbatasan Pirenia kita dari revolusi merah."
 FRA_army_of_aggression:0 "Tentara Penyerang"
 FRA_army_of_aggression_desc:0 "Kita tidak bisa lagi hanya berdiam diri di balik benteng usang sementara musuh-musuh kita mempersenjatai diri. Kita harus membangun kembali doktrin serangan yang berani."
 FRA_france_first:0 "Prancis yang Utama"
 FRA_france_first_desc:0 "Kita adalah Prancis! Pemenang Perang Besar! Penyelamat Eropa! Kita tidak akan menjadi pengikut siapa pun dan akan menegakkan kembali takdir kejayaan bangsa kita sendiri."
 FRA_woo_italy:0 "Dekati Italia"
 FRA_woo_italy_desc:0 "Italia memiliki potensi menjadi sekutu berharga di Mediterania jika kita dapat menyelesaikan sengketa kolonial secara damai."
 FRA_dismantle_the_democracies:0 "Bongkar Negara-Negara Demokrasi"
 FRA_dismantle_the_democracies_desc:0 "Demokrasi liberal terbukti lemah dan korup. Era baru ketertiban otoriter harus menggantikannya."
 FRA_join_germany:0 "Bergabung dengan Jerman"
 FRA_join_germany_desc:0 "Reich Jerman sedang menjadi kekuatan dominan di benua ini. Menyelaraskan diri dengan Berlin akan menjamin tempat kita dalam tatanan Eropa baru."
 FRA_naval_doctrine:0 "Doktrin Angkatan Laut"
 FRA_naval_doctrine_desc:0 "Kemajuan desain kapal membuka opsi baru dalam taktik pertempuran armada di Mediterania dan Atlantik."
 FRA_air_focus:0 "Fokus Udara"
 air_focus_bypass_tt:0 "Slot bangunan tidak cukup untuk §YPangkalan Udara§!"
 FRA_air_focus_desc:0 "Waktunya telah tiba untuk memperluas angkatan udara kita! Armée de l'Air harus dilengkapi dengan ratusan pesawat tempur modern."
 FRA_cas_focus:0 "Fokus CAS"
 FRA_cas_focus_desc:0 "Pesawat serang darat yang memberikan dukungan langsung bagi infanteri dan tank kita telah terbukti sangat menentukan di medan tempur."
 FRA_fighter_focus:0 "Fokus Pesawat Tempur"
 FRA_fighter_focus_desc:0 "Inovasi teknik penerbangan sipil mutakhir dapat diterapkan pada pesawat tempur Morane-Saulnier dan Dewoitine kita."
 FRA_bomber_focus:0 "Fokus Pesawat Pengebom"
 FRA_bomber_focus_desc:0 "Dukungan pengeboman adalah bagian penting dari operasi defensif maupun serangan balasan kita."
 FRA_heavy_fighter_focus:0 "Fokus Pesawat Tempur Berat"
 FRA_heavy_fighter_focus_desc:0 "Pesawat tempur berat jarak jauh bermesin ganda Potez 630 harus mampu mengawal formasi pengebom kita menembus pertahanan musuh."
 FRA_air_doctrine:0 "Doktrin Udara"
 FRA_air_doctrine_desc:0 "Kita telah mengumpulkan cukup pengalaman untuk menguji teori-teori baru perang udara gabungan."
 FRA_heavy_bomber_focus:0 "Fokus Pengebom Berat"
 FRA_heavy_bomber_focus_desc:0 "Pengebom berat modern akan dipersenjatai meriam pertahanan untuk mampu membalas serangan pencegat musuh."
 FRA_naval_bomber_focus:0 "Fokus Pengebom Angkatan Laut"
 FRA_naval_bomber_focus_desc:0 "Kapal perang musuh terbukti sangat rentan terhadap torpedo yang diluncurkan dari udara. Kita harus melatih skuadron serang maritim."
 limited_rearmament_focus:0 "Persenjataan Kembali Terbatas"
 limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "Pergolakan terkini dari Jerman dan kekuatan fasis lainnya di seluruh dunia mengharuskan kita memulai kembali program persenjataan militer secara bertahap."
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "Pendekatan baru kita terhadap politik luar negeri menuntut peningkatan kesiapsiagaan angkatan bersenjata kita."
 ENG_motorized_focus:0 "Tentara Bermotor"
 ENG_motorized_focus_desc:0 "Baru-baru ini Angkatan Darat telah bereksperimen dengan formasi infanteri bermotor penuh untuk memastikan reaksi kilat terhadap serangan musuh."
 ENG_tank_focus:1 "[Root.GetRoyalTankRegimentName]"
 ENG_tank_focus_desc:1 "[Root.GetRoyalTankRegimentDesc]"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Resimen Tank Kerajaan"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "Resimen Tank Garda Republik"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "Britania adalah penemu tank di Perang Besar, dan Resimen Tank Kerajaan harus tetap menjadi yang terdepan dalam doktrin perang lapis baja modern."
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "Britania adalah penemu tank di Perang Besar, dan Resimen Tank Garda Republik harus menggunakan senjata ini untuk membela revolusi rakyat dari kaum reaksioner."
 ENG_vickers_experimental_facility_focus: "Fasilitas Eksperimen Vickers"
 ENG_vickers_experimental_facility_focus_desc: "Untuk memajukan penelitian dan pengembangan teknologi khusus kita, kita harus mendirikan fasilitas eksperimen rahasia Vickers."
 ENG_vickers_experimental_facility_focus_tt: "Jika tidak ada §YFasilitas Eksperimen§! lain di §Y[126.GetName]§!."
 ENG_expand_the_secret_intelligence_service_focus: "Perluas Dinas Intelijen Rahasia"
 ENG_expand_the_secret_intelligence_service_focus_desc: "Dinas Intelijen Rahasia (Secret Intelligence Service), yang biasa disebut MI6, membantu melindungi kepentingan Britania di seluruh dunia melalui jaringan spionase dan kontra-intelijen."
 uk_empire_focus:0 "Perkuat Imperium"
 uk_empire_focus_desc:0 "Imperium kita sangat luas, dan terlepas dari kekuatan kita, pertahanannya masih renggang. Kita harus mengerahkan divisi pertahanan ke wilayah-wilayah koloni terpencil."
 uk_service_focus:0 "Dinas Seberang Laut"
 uk_service_focus_desc:0 "Dengan merotasi personel angkatan bersenjata ke pos-pos kolonial dan kembali ke tanah air, pasukan kita akan terbiasa bertempur di segala iklim dan medan."
 uk_mediterranean_focus:0 "Benteng Mediterania"
 uk_mediterranean_focus_desc:0 "Rute melalui Mediterania adalah jalan pintas yang sangat vital menuju India dan ladang minyak Timur Tengah. Kita harus mempertahankan setiap pangkalan di sepanjang rute ini."
 uk_rock_focus:0 "Bentengi Gibraltar"
 uk_rock_focus_desc:0 "Selain mengendalikan pintu masuk barat ke Mediterania, Gibraltar menyediakan pelabuhan terlindung bagi armada Atlantik kita."
 uk_greece_focus:0 "Paksa Yunani"
 uk_greece_focus_desc:0 "Sangat penting bagi kepentingan kita untuk memiliki hak pangkalan di Yunani guna mengawasi pergerakan Poros di Mediterania timur."
 uk_malta_focus:0 "Bentengi Malta"
 uk_malta_focus_desc:0 "Malta menempati posisi yang sangat strategis di Mediterania tengah, sebuah 'kapal induk yang tak dapat ditenggelamkan' untuk memutus rute pasokan Poros ke Afrika Utara."
 ENG_mot_focus_tooltip:0 "Kita kini dapat mengerahkan Divisi Infanteri Bermotor."
 uk_canada_focus:0 "Pembangunan di Kanada"
 uk_canada_focus_desc:0 "Investasi pada industri manufaktur dan galangan kapal Kanada akan memberikan dorongan besar bagi jalur pasokan trans-Atlantik kita."
 uk_australia_focus:0 "Pembangunan di Australia"
 uk_australia_focus_desc:0 "Investasi pada galangan kapal dan pabrik amunisi Australia akan memperkuat sayap timur pertahanan persemakmuran di Pasifik."
 uk_protect_suez: "Lindungi Terusan Suez"
 uk_protect_suez_desc:0 "Mengendalikan Terusan Suez adalah kunci bagi kelangsungan jalur komunikasi kekaisaran Britania dengan Asia dan Oseania."
 uk_balkan_strategy:0 "Strategi Balkan"
 uk_balkan_strategy_desc:0 "Banyak negara di Balkan bersimpati pada Britania dan melihat ancaman yang sama dari fasisme. Kita harus menggalang front bersama di sana."
 uk_new_zealand_focus:0 "Kembangkan Selandia Baru"
 uk_new_zealand_focus_desc:0 "Selandia Baru mempertahankan hubungan yang sangat erat dengan bangsa kita. Kita harus membantu memodernisasi infrastruktur pertahanan mereka."
 uk_south_africa_focus:0 "Kembangkan Afrika Selatan"
 uk_south_africa_focus_desc:0 "Situasi politik di Afrika Selatan sangat rumit, namun posisi Tanjung Harapan adalah rute alternatif vital jika Terusan Suez ditutup."
 FRA_strengthen_government_support_tooltip:0 "Gagasan 'Perkuat Pemerintahan' telah habis masa berlakunya."
 ITA_victoryinETH:0 "Kemenangan di Afrika"
 ITA_victoryinETH_desc:0 "Kegagalan dalam Perang Italia-Etiopia Pertama telah menjadi noda pada kehormatan militer Italia selama puluhan tahun. Penaklukan gemilang kita atas Addis Ababa akhirnya menghapus aib tersebut dan membuktikan ketangguhan bangsa fasis!"
 USA_reinforce_monroe_doctrine_tt:0 "Meningkatkan Opini Perdagangan dengan semua negara di benua Amerika.\n"
 1939_bookmark_threat:0 "Ekspansi Fasis Terkini"
 USA_civil_war_fired:0 "Perang Saudara Amerika Kedua telah pecah."
 USA_anti_imperialism:0 "Anti-Imperialisme"
 USA_anti_imperialism_desc:0 "Amerika selalu menjadi penentang para penindas imperialis, dan sekarang saatnya menegakkan prinsip tersebut di panggung global."
 USA_fascist_menace:1 "Ancaman Militerisme Prusia"
 USA_fascist_menace_desc:1 "Perjanjian Versailles dan sanksi ekonomi tidak mampu menghentikan rearmamen agresif Jerman. Kita harus mempersiapkan diri menghadapi kekuatan tiran ini."
 USA_crusade_against_communism:0 "Perang Salib Melawan Komunisme"
 USA_crusade_against_communism_desc:0 "Teror Merah adalah ancaman terburuk yang pernah dihadapi dunia. Nilai-nilai kebebasan dan kepemilikan individu harus dipertahankan dari bahaya Marxis."
 USA_strike_at_the_empire:0 "Hantam Sang Imperium"
 USA_strike_at_the_empire_desc:0 "Ancaman sejati bagi kebebasan di dunia adalah imperium kolonial Eropa yang menindas ratusan juta orang di seluruh dunia demi keuntungan segelintir bangsawan."
 USA_defense_of_the_pacific:0 "Pertahanan Pasifik"
 USA_defense_of_the_pacific_desc:0 "Pemerintah militeris Jepang tidak lagi dapat diajak berdiplomasi; ekspansionisme mereka mengancam Filipina, Hawaii, dan seluruh rute perdagangan kita."
 ENG_home_defence:0 "Pertahanan Tanah Air"
 ENG_home_defence_desc:0 "Imperium yang luas tidak ada gunanya jika kita tidak dapat melindungi rakyat Britania di pulau ini. Kita harus bersiap menghadapi kemungkinan invasi pantai."
 ENG_home_defence_tt: "Membuka keputusan untuk §YMempertahankan Tanah Air§! jika terjadi invasi musuh."
 ENG_issue_gasmasks:0 "Bagikan Masker Gas"
 ENG_issue_gasmasks_desc:0 "Dunia semakin berbahaya setiap harinya. Kita harus membagikan masker gas kepada setiap warga sipil untuk mencegah terulangnya kengerian perang kimia."
 ENG_military_training_act:0 "Undang-Undang Pelatihan Militer"
 ENG_military_training_act_desc:0 "Meskipun Perang Besar meninggalkan trauma mendalam, kita harus memberlakukan wajib militer terbatas bagi pemuda kita demi mempertahankan kebebasan."
 ENG_embargo_germany:0 "Embargo Jerman"
 ENG_embargo_germany_desc:0 "Persenjataan kembali Jerman adalah ancaman nyata bagi perdamaian dunia. Kita akan memutus perdagangan komoditas penting ke Jerman."
 ENG_war_with_germany:0 "Perang dengan Jerman"
 ENG_war_with_germany_desc:0 "Pihak Jerman tidak memberi kita pilihan lain. Demi membela kebebasan bangsa-bangsa di Eropa, kita menyatakan perang terhadap Jerman!"
 ENG_swedish_intervention:0 "Intervensi Swedia"
 ENG_swedish_intervention_desc:0 "Gerakan anti-demokrasi di Swedia semakin mengkhawatirkan dan mengancam pasokan bijih besi. Kita harus bersiap bertindak."
 ENG_norwegian_intervention:0 "Intervensi Norwegia"
 ENG_norwegian_intervention_desc:1 "Garis pantai Norwegia yang panjang tidak boleh jatuh ke tangan musuh untuk dijadikan pangkalan kapal selam U-boat."
 ENG_danish_intervention:0 "Intervensi Denmark"
 ENG_danish_intervention_desc:0 "Dukungan di Denmark terhadap agresi Jerman harus dihentikan demi mengamankan selat masuk ke Laut Baltik."
 ENG_benelux_intervention:0 "Intervensi Benelux"
 ENG_benelux_intervention_desc:0 "Situasi di kawasan Benelux semakin genting. Kita harus memastikan pantai seberang Selat Inggris tetap berada di tangan kawan."
 ENG_belgium_security:0 "Amankan Belgia"
 ENG_belgium_security_desc:0 "Peringatan diplomatik terbukti tidak cukup. Kita harus bersiap mendaratkan British Expeditionary Force untuk mengamankan Belgia."
 ENG_dutch_security:0 "Amankan Belanda"
 ENG_dutch_security_desc:0 "Kita harus mengamankan pelabuhan-pelabuhan Belanda agar tidak dijadikan batu loncatan serangan ke daratan Britania."
 ENG_war_with_japan:0 "Perang dengan Jepang"
 ENG_war_with_japan_desc:0 "Semua jalur diplomasi telah buntu dan Jepang menolak menghentikan invasinya di Asia. Kita harus menggunakan kekuatan senjata."
 ENG_war_with_italy:0 "Perang dengan Italia"
 ENG_war_with_italy_desc:0 "Mussolini menolak menghentikan rencananya untuk mendominasi Mediterania. Kita harus mematahkan ambisinya dengan kekuatan Royal Navy."
 ENG_embargo_ussr:1 "Embargo [SOV.GetNameDefCap]"
 ENG_embargo_ussr_desc:1 "[SOV.GetNameDefCap] semakin kuat dan berpotensi mengekspor revolusi merah. Kita harus menghentikan pengiriman teknologi dan mesin ke sana."
 ENG_war_with_ussr: "Operasi Unthinkable"
 ENG_war_with_ussr_desc:1 "Ancaman [SOV.GetNameDef] di Eropa Timur semakin mendesak. Kita harus bersiap untuk opsi militer terberat demi membebaskan bangsa-bangsa tertindas."
 kamikaze_focus_tooltip:1 "Mengizinkan misi udara §YSerangan Kamikaze§!, serangan bunuh diri terhadap kapal perang musuh."
 AST_additional_militia_training:0 "Pelatihan Milisi Tambahan"
 AST_additional_militia_training_desc:0 "Sebagian besar milisi kita belum siap tempur karena kurangnya latihan terpadu. Kita harus meningkatkan standar instruksi militer di seluruh negara bagian."
 AST_royal_australian_artillery:0 "Artileri Kerajaan Australia"
 AST_royal_australian_artillery_desc:0 "Artileri adalah ratu medan pertempuran. Kita harus memperbanyak meriam 25-pounder untuk mendukung infanteri kita di garis depan."
 AST_promote_reservists:0 "Promosikan Pasukan Cadangan"
 AST_promote_reservists_desc:0 "Meskipun kita membutuhkan pertahanan tanah air, mempromosikan prajurit cadangan terbaik ke dalam dinas aktif akan memperkuat Brigade AIF kita."
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_daimler_dingo_desc:0 "Mobil lapis baja lincah buatan lokal dan persemakmuran ini akan meningkatkan mobilitas pengintaian pasukan kita di medan berat."
 AST_hmas_assault:0 "HMAS Assault"
 AST_hmas_assault_desc:0 "Perang di Pasifik adalah perang amfibi. Fasilitas pelatihan pendaratan pantai HMAS Assault di Port Stephens akan melatih pasukan amfibi kita."
 AST_specialize_equipment:0 "Spesialisasi Perlengkapan"
 AST_specialize_equipment_desc:0 "Perlengkapan standar Britania tidak selalu cocok untuk kondisi hutan tropis dan semak belukar Australia. Kita harus menyesuaikannya."
 AST_australian_womens_army_service:0 "Dinas Tentara Wanita Australia"
 AST_australian_womens_army_service_desc:0 "Setiap pria dibutuhkan di garis depan pertempuran; peran pengemudi, juru sinyal, dan staf logistik dapat dijalankan dengan gemilang oleh para wanita patriotik kita."
 AST_australian_army_catering_corps:0 "Korps Katering Angkatan Darat Australia"
 AST_australian_army_catering_corps_desc:0 "Kebugaran dan moral prajurit sangat bergantung pada nutrisi makanan di garis depan rimba. Membentuk korps logistik pangan terpadu akan menekan angka sakit."
 AST_fund_owen_gun_research:0 "Danai Riset Senapan Owen"
 AST_fund_owen_gun_research_desc:0 "Evelyn Owen telah merancang senapan submesin baru yang tahan lumpur, pasir, dan air hutan tropis. Senjata ini akan menjadi andalan prajurit Digger kita."
 AST_sentinel_tank_project:0 "Proyek Tank Sentinel"
 AST_sentinel_tank_project_desc:0 "Australia harus merancang tank buatannya sendiri: Cruiser Tank Sentinel AC1 dengan lambung cor tunggal yang kokoh."
 AST_airborne_defence:0 "Pertahanan Udara"
 AST_airborne_defence_desc:0 "Kita harus melindungi langit Australia dengan meriam anti-udara Bofors dan skuadron pencegat tempur garis depan."
 AST_introduce_unconventional_warfare:0 "Perkenalkan Perang Inkonvensional"
 AST_introduce_unconventional_warfare_desc:0 "Rimba belantara Nugini menuntut taktik perang gerilya dan penyusupan mendalam yang belum pernah dipelajari di akademi militer biasa."
 AST_z_special_unit:0 "Unit Khusus Z"
 AST_z_special_unit_desc:0 "Z Special Unit akan menjadi pasukan komando rahasia kita untuk operasi pengintaian, penyusupan pantai, dan sabotase di balik garis musuh di kepulauan Melayu."
 AST_m_special_unit:0 "Unit Khusus M"
 AST_m_special_unit_desc:0 "M Special Unit dan para pengintai pantai (Coastwatchers) akan menjadi mata dan telinga kita di pulau-pulau Pasifik yang diduduki lawan."
 AST_expand_the_raaf:0 "Perluas RAAF"
 AST_expand_the_raaf_desc:0 "Angkatan Udara Kerajaan Australia (RAAF) harus diperbesar secara dramatis dengan melipatgandakan skuadron dan lapangan udara."
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "Pesawat Boomerang adalah pesawat tempur rancangan darurat pertama Australia, siap mempertahankan langit tanah air saat jalur impor terputus."
 AST_expand_northern_presence:0 "Perluas Kehadiran di Utara"
 AST_expand_northern_presence_desc:0 "Dengan sebagian besar populasi di selatan, pantai utara kita rentan terhadap serbuan musuh. Kita harus membangun pangkalan militer kokoh di Darwin."
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "Pesawat pengebom serang darat dan torpedo bermesin ganda CAC Woomera akan memberikan daya pukul udara jarak jauh."
 AST_volunteer_air_observers_corps:0 "Korps Pengamat Udara Sukarelawan"
 AST_volunteer_air_observers_corps_desc:0 "Awas langit! Warga sipil sukarelawan di seluruh pelosok pantai dilatih untuk mengidentifikasi siluet pesawat dan memberikan peringatan dini."
 AST_naval_bombers:0 "Pengebom Angkatan Laut"
 AST_naval_bombers_desc:0 "Sebagai benua kepulauan, kemampuan menenggelamkan konvoi invasi musuh sebelum mendarat adalah kunci keselamatan kita."
 AST_death_from_down_under:0 "Maut dari Belahan Bumi Selatan"
 AST_death_from_down_under_desc:0 "Tidak ada pengebom musuh yang akan mampu menyentuh kota-kota kita tanpa menghadapi sambutan maut dari para penerbang tempur Australia."
 AST_womens_auxilliary_australian_air_force:0 "Angkatan Udara Wanita Pembantu Australia"
 AST_womens_auxilliary_australian_air_force_desc:0 "Setengah dari populasi bangsa kita siap berkontribusi langsung sebagai teknisi radio, mekanik instrumen, dan pengawas lalu lintas udara."
 AST_dominate_the_skies:0 "Kuasai Langit"
 AST_dominate_the_skies_desc:0 "Mencapai keunggulan udara mutlak di atas Pasifik Barat Daya adalah jaminan mutlak bagi kemenangan pasukan darat dan laut kita."
 AST_cockatoo_island_shipyards:0 "Galangan Kapal Pulau Cockatoo"
 AST_cockatoo_island_shipyards_desc:0 "Ekspansi galangan kapal di Pelabuhan Sydney akan memungkinkan perbaikan kapal perang besar dan pembangunan kapal pengawal baru."
 AST_kangaroo_point_shipyards:0 "Dok Kering Kangaroo Point"
 AST_kangaroo_point_shipyards_desc:0 "Membangun dok kering besar di Sungai Brisbane akan memberi fasilitas perawatan penting bagi kapal perang Sekutu yang rusak akibat pertempuran Pasifik."
 AST_protect_overseas_commerce:0 "Lindungi Perdagangan Seberang Laut"
 AST_protect_overseas_commerce_desc:0 "Australia mengandalkan impor minyak dan pengapalan gandum serta wol ke luar negeri. Korvet kelas Bathurst akan menjaga jalur ini."
 AST_fly_the_jolly_roger:0 "Kibarkan Bendera Jolly Roger"
 AST_fly_the_jolly_roger_desc:0 "Dari pangkalan Fremantle, armada kapal selam kita akan memburu kapal-kapal kargo dan tanker musuh hingga ke Laut Jawa dan Laut Tiongkok Selatan."
 AST_scrap_iron_flotilla:0 "Flotila Besi Tua"
 AST_scrap_iron_flotilla_desc:0 "Kapal-kapal perusak tua kelas V/W kita yang dijuluki 'Scrap Iron Flotilla' oleh Goebbels telah membuktikan kehebatannya di Mediterania dan Pasifik."
 AST_royal_australian_submarine_service:0 "Dinas Kapal Selam Australia"
 AST_royal_australian_submarine_service_desc:0 "Mengembangkan armada kapal selam modern kita sendiri adalah investasi strategis terbaik untuk memblokade pulau-pulau musuh."
 AST_naval_auxiliary_patrol:0 "Patroli Pembantu Angkatan Laut"
 AST_naval_auxiliary_patrol_desc:0 "Ratusan perahu motor dan kapal nelayan swasta dimobilisasi untuk menjaga pintu masuk teluk dan pelabuhan dari kapal selam mini musuh."
 AST_cruisers:0 "Kapal Penjelajah"
 AST_cruisers_desc:0 "Kapal penjelajah berat seperti HMAS Canberra dan Australia adalah tulang punggung kehadiran armada kita di lautan lepas."
 AST_pacific_area_navy:0 "Armada Kawasan Pasifik"
 AST_pacific_area_navy_desc:0 "Meskipun pertempuran berkecamuk di Eropa, prioritas mutlak RAN adalah mengamankan perairan di utara benua kita sendiri."
 AST_standard_gauge_railway:0 "Standardisasi Jalur Rel Kereta Api"
 AST_standard_gauge_railway_desc:0 "Selama beberapa dekade, perbedaan lebar rel antar-negara bagian menjadi hambatan logistik besar. Menyatukannya ke ukuran standar akan mempercepat pemindahan divisi."
 AST_industries_assistance_corporation:0 "Korporasi Bantuan Industri"
 AST_industries_assistance_corporation_desc:0 "Bantuan keuangan negara akan memacu industrialisasi manufaktur logam berat, tekstil militer, dan bahan kimia."
 AST_western_australian_government_railways:0 "Kereta Api Pemerintah Australia Barat"
 AST_western_australian_government_railways_desc:0 "Memperluas kapasitas rel di barat akan menghubungkan tambang dan pelabuhan Fremantle dengan pusat manufaktur di timur."
 AST_south_australian_housing_trust:0 "Lembaga Perumahan Australia Selatan"
 AST_south_australian_housing_trust_desc:0 "Membangun pemukiman pekerja di dekat pabrik amunisi Salisbury dan galangan kapal Whyalla akan menjamin pasokan tenaga kerja industri."
 AST_department_of_supply_and_development:0 "Departemen Suplai dan Pembangunan"
 AST_department_of_supply_and_development_desc:0 "Kementerian khusus diperlukan untuk mengoordinasikan pengadaan bahan baku strategis, alokasi mesin perkakas, dan pesanan militer."
 AST_expand_lithgow_small_arms_factory:0 "Perluas Pabrik Senjata Lithgow"
 AST_expand_lithgow_small_arms_factory_desc:0 "Pabrik senjata Lithgow di New South Wales adalah produsen utama senapan Lee-Enfield dan senapan mesin Bren kita. Kapasitasnya harus dilipatgandakan."
 AST_allied_works_council:0 "Dewan Pekerjaan Sekutu"
 AST_allied_works_council_desc:0 "Semua proyek konstruksi militer, pangkalan udara terpencil, dan jalan raya pedalaman akan dikoordinasikan secara efisien oleh dewan gabungan ini."
 AST_expand_the_northern_railway:0 "Perluas Jalur Rel Utara"
 AST_expand_the_northern_railway_desc:0 "Jalur rel dan jalan raya dari Alice Springs menuju Darwin sangat vital untuk memasok garis depan pertahanan utara kita."
 AST_australian_arms_production:0 "Produksi Senjata Australia"
 AST_australian_arms_production_desc:0 "Jarak konvoi yang sangat jauh dari Inggris menuntut kita untuk mampu memproduksi amunisi dan persenjataan secara mandiri di dalam negeri."
 AST_uranium_mining:0 "Pertambangan Uranium"
 AST_uranium_mining_desc:0 "Deposit uranium di Australia Selatan memiliki nilai strategis luar biasa bagi proyek penelitian atom sekutu."
 AST_establish_advisory_war_council:0 "Bentuk Dewan Penasihat Perang"
 AST_establish_advisory_war_council_desc:0 "Para politisi Australia harus mengesampingkan perbedaan partisan dan bersatu dalam kabinet perang penasihat demi kelangsungan hidup bangsa."
 AST_national_security_act:0 "Undang-Undang Keamanan Nasional"
 AST_national_security_act_desc:0 "Pemerintah federal diberi wewenang luas untuk mengendalikan industri, mencegah spionase, dan memobilisasi tenaga kerja bagi kepentingan perang."
 AST_volunteer_defence_corps:0 "Korps Pertahanan Sukarelawan (VDC)"
 AST_volunteer_defence_corps_desc:0 "Para veteran Perang Dunia Pertama dan pekerja pabrik membentuk 'Home Guard' Australia untuk menjaga fasilitas vital."
 AST_civil_construction_corps:0 "Korps Konstruksi Sipil"
 AST_civil_construction_corps_desc:0 "Memobilisasi tenaga kerja sipil untuk membangun landasan pacu, jalan raya militer, dan instalasi radar di seluruh benua."
 AST_army_inventions_directorate:0 "Direktorat Penemuan Angkatan Darat"
 AST_army_inventions_directorate_desc:0 "Menampung dan menguji ribuan gagasan dan prototipe inovatif dari para penemu dan ilmuwan lokal untuk memenangkan perang."
 AST_invest_in_victory:0 "Investasi untuk Kemenangan"
 AST_invest_in_victory_desc:0 "Melalui pinjaman perang nasional dan obligasi rakyat, tabungan warga sipil dialirkan langsung untuk membiayai armada perang."
 AST_citizen_military_forces:0 "Pasukan Militer Warga (CMF)"
 AST_citizen_military_forces_desc:0 "Mempersiapkan tentara milisi cadangan yang tangguh untuk mempertahankan daratan Australia dan wilayah mandat Papua Nugini."
 AST_rats_of_tobruk:0 "Tikus Tobruk"
 AST_rats_of_tobruk_desc:0 "Prajurit Divisi ke-9 kita bertahan dengan gagah berani di bawah pengepungan sengit Rommel di Tobruk, membuktikan ketangguhan prajurit Australia di mata dunia."
 AST_rats_of_tobruk_effect_1:0 "Mendapatkan unit elit di Tobruk"
 AST_rats_of_tobruk_effect_2:0 "Mendapatkan unit elit di Sydney"
 AST_fight_work_or_perish:0 "Berjuang, Bekerja, atau Binasa"
 AST_fight_work_or_perish_desc:0 "Ketika musuh mengancam kedaulatan tanah air kita, Perdana Menteri Curtin menegaskan bahwa seluruh bangsa harus berjuang, bekerja, atau binasa!"
 AST_research_collaboration:0 "Kolaborasi Riset"
 AST_research_collaboration_desc:0 "Berbagi kemajuan teknologi dengan sekutu Persemakmuran dan Amerika Serikat akan mempercepat modernisasi persenjataan kita."
 AST_fund_australian_defense_research:0 "Danai Riset Pertahanan Australia"
 AST_fund_australian_defense_research_desc:0 "Sebagai bangsa berdaulat, kita harus membangun kapasitas riset pertahanan mandiri di laboratorium dan universitas kita sendiri."
 AST_squash_the_squanderbugs:0 "Basmi Serangga Pemboros"
 AST_squash_the_squanderbugs_desc:0 "Kampanye hemat publik untuk menghentikan pemborosan barang konsumsi yang memicu inflasi, demi menghemat setiap sen untuk pengadaan amunisi."
 AST_rationing_and_recycling:0 "Penjatahan dan Daur Ulang"
 AST_rationing_and_recycling_desc:0 "Setiap ons logam, karet, dan bensin sangat berharga. Program daur ulang nasional akan menutup defisit bahan baku kita."
 AST_classify_aliens:0 "Klasifikasikan Orang Asing"
 AST_classify_aliens_desc:0 "Memeriksa dan mengawasi warga negara dari negara-negara musuh untuk mencegah sabotase internal di masa perang."
 AST_strengthen_ties_with_uk:0 "Pererat Hubungan dengan Inggris"
 AST_strengthen_ties_with_uk_desc:0 "Kesetiaan kita berakar pada Negeri Induk. Kita akan berdiri teguh bersama Britania di masa-masa tergelap mereka."
 AST_support_the_policy_of_appeasement:0 "Dukung Kebijakan Pengalah"
 AST_support_the_policy_of_appeasement_desc:0 "Trauma korban jiwa Perang Besar membuat kita berupaya menjaga perdamaian melalui konsesi diplomatik di Eropa."
 AST_the_singapore_strategy:0 "Strategi Singapura"
 AST_the_singapore_strategy_desc:0 "Singapura terlalu jauh dari London; Australia harus memikul tanggung jawab lebih besar dalam memperkuat garnisun di sana."
 AST_adopt_westminster:0 "Adopsi Statuta Westminster"
 AST_adopt_westminster_desc:0 "Meratifikasi Statuta Westminster secara resmi akan menegaskan kedaulatan legislatif parlemen Australia sebagai bangsa merdeka seutuhnya."
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "Dewan Riset Ilmiah dan Industri Persemakmuran (CSIR) akan memimpin penelitian biologi, kimia, dan teknik pertahanan kita."
 AST_swpa_protector:0 "Pelindung Pasifik Barat Daya"
 AST_swpa_protector_desc:0 "Australia harus mengambil peran kepemimpinan utama sebagai pelindung kawasan Pasifik Barat Daya."
 AST_empire_air_training_scheme:0 "Skema Pelatihan Udara Imperium"
 AST_empire_air_training_scheme_desc:0 "Australia akan melatih ribuan penerbang, navigator, dan penembak udara untuk diterbangkan ke medan tempur global."
 AST_commonwealth_aircraft_corporation:0 "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_desc:0 "CAC adalah produsen pesawat terkemuka yang memasok pesawat tempur dan latih bagi RAAF."
 AST_sever_ties_with_uk:0 "Putuskan Hubungan dengan Inggris"
 AST_sever_ties_with_uk_desc:0 "Waktunya telah tiba bagi Australia untuk melepaskan diri dari bayang-bayang London dan menentukan arah kebijakan luar negeri secara mandiri."
 AST_protect_the_homeland:0 "Lindungi Tanah Air"
 AST_protect_the_homeland_desc:0 "Menarik kembali pasukan kita dari seberang laut untuk memusatkan seluruh daya tempur demi mempertahankan pantai tanah air dari invasi musuh."
 AST_the_swpa_menace:0 "Ancaman Pasifik Barat Daya"
 AST_the_swpa_menace_desc:0 "Ekspansi militer Jepang membahayakan keselamatan Australia; kita harus bersiap mempertahankan garis pulau terluar."
 AST_never_another_gallipoli:0 "Jangan Ada Gallipoli Lain"
 AST_never_another_gallipoli_desc:0 "Satu-satunya cara memastikan prajurit Australia tidak lagi dikorbankan secara sia-sia dalam operasi ceroboh jenderal Inggris adalah dengan mengendalikan pasukan kita sendiri."
 AST_woo_usa:0 "Dekati Amerika Serikat"
 AST_woo_usa_desc:0 "Sekutu sejati kita dalam perang samudra ini adalah Amerika Serikat. Kita harus mengundang Jenderal MacArthur dan armada AS untuk berpangkalan di Australia."
 AST_protect_the_dutch_colonies:0 "Lindungi Koloni Belanda"
 AST_protect_the_dutch_colonies_desc:0 "Hindia Belanda terlalu rentan dan jauh dari Den Haag. Australia harus mengirim garnisun ke Ambon dan Timor untuk mengamankan perisai utara kita."
 AST_the_south_west_pacific_initiative:0 "Inisiatif Pasifik Barat Daya"
 AST_the_south_west_pacific_initiative_desc:0 "Membentuk aliansi pertahanan regional di bawah komando Australia untuk menjaga perdamaian di Pasifik Selatan."
 AST_preemptive_intervention:0 "Intervensi Preemptif"
 AST_preemptive_intervention_desc:0 "Menunggu musuh mendarat di pantai kita adalah bunuh diri; kita harus menyerang pangkalan garis depan mereka terlebih dahulu."
 AST_research_cooperation:0 "Kerja Sama Riset"
 AST_research_cooperation_desc:1 "Bekerja sama dengan laboratorium-laboratorium Amerika akan memberi kita akses ke teknologi radar dan persenjataan mutakhir."
 AST_abandon_the_westminster_system:0 "Tinggalkan Sistem Westminster"
 AST_abandon_the_westminster_system_desc:0 "Sistem parlementer lama tidak lagi mampu menjawab krisis zaman ini; kita membutuhkan kepemimpinan yang lebih terpusat dan berani."
 AST_support_the_centre_party:0 "Dukung Partai Tengah"
 AST_support_the_centre_party_desc:0 "Mendukung gerakan konservatif radikal 'New Guard' dan Partai Tengah untuk memberantas komunisme dan memulihkan ketertiban."
 AST_supply_indonesian_nationalists:0 "Pasok Nasionalis Indonesia"
 AST_supply_indonesian_nationalists_desc:0 "Kita harus mendukung perjuangan kemerdekaan rakyat Indonesia melawan penjajahan Belanda dengan mengirimkan senjata dan bantuan diplomatik."
 AST_support_indonesian_uprising:0 "Dukung Pemberontakan Indonesia"
 AST_support_indonesian_uprising_desc:0 "Kini setelah rakyat Indonesia mengangkat senjata, dukungan militer kita akan mengamankan sekutu merdeka yang bersahabat tepat di utara perbatasan kita."
 AST_demand_new_zealand:0 "Tuntut Selandia Baru"
 AST_demand_new_zealand_desc:0 "Bangsa Kiwi adalah saudara terdekat kita. Demi keselamatan bersama di Pasifik Selatan, Selandia Baru harus bergabung ke dalam federasi Australasia."
 AST_protect_the_south_west_pacific:0 "Lindungi Pasifik Barat Daya"
 AST_protect_the_south_west_pacific_desc:0 "Menjadikan seluruh kepulauan di Pasifik Barat Daya sebagai protektorat di bawah panji kepemimpinan Australia."
 AST_a_deal_with_japan:0 "Kesepakatan dengan Jepang"
 AST_a_deal_with_japan_desc:0 "Mencapai kompromi pembagian wilayah pengaruh dengan Kekaisaran Jepang demi menjamin keamanan benua kita."
 AST_our_own_empire:0 "Kekaisaran Kita Sendiri"
 AST_our_own_empire_desc:0 "Waktunya telah tiba bagi bekas koloni ini untuk berdiri di atas kaki sendiri dan memproklamasikan Kekaisaran Australia Raya!"
 AST_japan_tech_sharing:0 "Berbagi Teknologi dengan Jepang"
 AST_japan_tech_sharing_desc:0 "Bekerja sama dengan para insinyur angkatan laut Jepang untuk memodernisasi kapal perang dan pesawat kita."
 AST_war_on_japan:0 "Perang terhadap Jepang"
 AST_war_on_japan_desc:0 "Agresi dan kekejaman militeris Jepang tidak boleh dibiarkan. Kita akan melawan mereka dengan segenap daya tempur bangsa!"
 AST_empower_the_workers:0 "Berdayakan Kaum Pekerja"
 AST_empower_the_workers_desc:0 "Australia didirikan oleh kaum buruh, peternak, dan pekerja dermaga. Saatnya menyerahkan kekuasaan politik ke tangan serikat buruh!"
 AST_delegation_to_china:0 "Delegasi ke Tiongkok"
 AST_delegation_to_china_desc:0 "Rakyat Tiongkok yang berjuang melawan imperialisme membutuhkan sahabat sejati. Kita akan menjalin hubungan erat dengan kaum revolusioner di sana."
 AST_commitment_to_the_cause:0 "Komitmen pada Perjuangan"
 AST_commitment_to_the_cause_desc:0 "Waktunya telah tiba untuk mematahkan belenggu monarki asing dan mendirikan Republik Sosialis Australia."
 AST_indirect_support:0 "Dukungan Tak Langsung"
 AST_indirect_support_desc:0 "Membantu para pejuang anti-imperialis di Asia dengan pasokan gandum, mineral, dan bahan mentah."
 AST_direct_support:0 "Dukungan Langsung"
 AST_direct_support_desc:0 "Kirimkan brigade sukarelawan buruh dan pesawat tempur untuk bertempur bersama saudara-saudara kita di daratan Asia."
 AST_join_comintern:0 "Bergabung dengan Komintern"
 AST_join_comintern_desc:0 "Masa depan kemanusiaan terletak pada sosialisme internasional; Australia dengan bangga bergabung dalam barisan Komintern."
 AST_workers_paradise:0 "Surga Kaum Pekerja"
 AST_workers_paradise_desc:0 "Membangun model sosialisme demokratis sejati yang bebas dari birokrasi otoriter, menjamin kesejahteraan penuh bagi seluruh rakyat pekerja."
 AST_research_city_excursions:0 "Kunjungan ke Kota Riset Soviet"
 AST_research_city_excursions_desc:0 "Mengirim ilmuwan kita untuk belajar di laboratorium sains canggih Uni Soviet."
 AST_nz_puppet:0 "Bawahkan Selandia Baru"
 AST_nz_puppet_desc:0 "Kaum buruh Selandia Baru harus bergabung dengan rekan-rekan mereka di Australia untuk membentuk front persatuan pekerja Pasifik Selatan."
 AST_the_threat_against_the_people:0 "Ancaman terhadap Rakyat"
 AST_the_threat_against_the_people_desc:0 "Fasisme militeris Jepang adalah musuh bebuyutan kaum buruh internasional. Kita harus menghancurkan mesin perang mereka."
 AST_new_general_tt:0 "Jenderal baru §YKemampuan 3§! bernama §YIven Mackay§! akan muncul."
 AST_homeland_defense_tt:0 "Bentengi Tanah Air dengan §Ybenteng pesisir dan benteng darat§! yang menjaga titik pendaratan kritis.\n"
 AST_swpi_research_tt:0 "Kita akan mengadakan §Yperjanjian berbagi teknologi§! dengan AS atau anggota faksi lainnya.\n"
 AST_deal_with_japan_tt:1 "Kita akan mengusulkan pengalihan pertuanan atas §YMalaya§! kepada Jepang sebagai imbalan jaminan keselamatan.\n"
 CAN_rowell_sirois_commission:0 "Komisi Rowell-Sirois"
 CAN_rowell_sirois_commission_desc:0 "Komisi Kerajaan Rowell-Sirois merekomendasikan perombakan hubungan keuangan antara pemerintah federal Ottawa dan provinsi demi pemerataan ekonomi."
 CAN_crown_corporations:0 "Korporasi Mahkota"
 CAN_crown_corporations_desc:0 "Mendirikan korporasi milik negara untuk menggerakkan industri vital seperti kimia, karet sintetis, dan produksi amunisi perang."
 CAN_war_bonds:0 "Obligasi Perang"
 CAN_war_bonds_desc:0 "Menggalang 'Pinjaman Kemenangan' (Victory Loans) dari tabungan rakyat Kanada untuk membiayai angkatan darat dan pabrik tanpa bergantung pada utang luar negeri."
 CAN_defence_of_canada_regulations:0 "Peraturan Pertahanan Kanada"
 CAN_defence_of_canada_regulations_desc:0 "Peraturan darurat masa perang untuk mengamankan fasilitas industri dari ancaman spionase, sabotase, dan unsur-unsur subversif."
 CAN_national_housing_act:0 "Undang-Undang Perumahan Nasional"
 CAN_national_housing_act_desc:0 "Membangun ribuan perumahan murah bagi para pekerja industri perang di kota-kota manufaktur Kanada."
 CAN_dollar_a_year_men:0 "Orang Bergaji Satu Dolar Setahun"
 CAN_dollar_a_year_men_desc:0 "Industri Kanada memiliki kendala efisiensi, tetapi sejumlah pengusaha kaya menawarkan jasa dan nasihat mereka dengan imbalan jumlah simbolis semata. Dewan penasihat ini akan memajukan kita."
 CAN_canada_pacific_railway:0 "Jalur Kereta Api Pasifik Kanada"
 CAN_canada_pacific_railway_desc:0 "Canadian Pacific Railway telah menyediakan seluruh sumber dayanya untuk mendukung upaya perang. Ribuan ton pasokan dan perbekalan akan melintasi Dominion agung kita dari samudera ke samudera tanpa henti."
 CAN_maritime_colonial_railway:0 "Jalur Kereta Api Kolonial Maritim"
 CAN_maritime_colonial_railway_desc:0 "Provinsi timur kita kurang terlayani oleh jalur kereta sejak penjualan Intercolonial Railway. Kita akan membangun Jalur Kereta Api Kolonial Maritim baru untuk memperluas hubungan antara provinsi tengah dan Atlantik."
 CAN_retool_angus_shops:0 "Peralihan Pabrik Angus"
 CAN_retool_angus_shops_desc:0 "Tentara modern membutuhkan kendaraan lapis baja, dan Bengkel Angus milik CPR sangat cocok untuk pembangunannya. Alihkan dan perbaiki infrastruktur ini untuk memproduksi tank."
 CAN_imperial_oil:0 "Minyak Kekaisaran (Imperial Oil)"
 CAN_imperial_oil_desc:0 "Imperial Oil bersedia mendanai eksplorasi minyak di Kanada Barat. Hal ini akan meningkatkan cadangan minyak bumi kita dan melumasi mesin perang."
 CAN_department_of_munitions_and_supply:0 "Departemen Amunisi dan Pasokan"
 CAN_department_of_munitions_and_supply_desc:0 "Kita akan menyerahkan kendali dan pengelolaan sumber daya nasional Kanada di bawah arahan C.D. Howe di Departemen Amunisi dan Pasokan."
 CAN_national_resources_mobilization_act:0 "Undang-Undang Mobilisasi Sumber Daya Nasional"
 CAN_national_resources_mobilization_act_desc:0 "Kanada sangat luas dengan populasinya tersebar di berbagai pelosok. Sebuah sistem harus dikembangkan untuk melacak status ketenagakerjaan dan memastikan siapa saja yang memenuhi syarat penugasan luar negeri dapat dicatat."
 CAN_wartime_prices_and_trade_board:0 "Dewan Harga dan Perdagangan Masa Perang"
 CAN_wartime_prices_and_trade_board_desc:0 "Untuk mencegah penimbunan dan pencatutan laba, pengendalian harga diperkenalkan guna memastikan barang kebutuhan tetap terjangkau bagi sebagian besar rakyat Kanada."
 CAN_bits_and_pieces_program:0 "Program Potongan Kecil (Bits and Pieces)"
 CAN_bits_and_pieces_program_desc:0 "Program 'Bits and Pieces' akan memobilisasi ratusan bengkel kerja kecil di kota-kota terpencil untuk memproduksi komponen dan baut bagi senjata besar."
 CAN_fund_the_national_research_council:0 "Danai Dewan Riset Nasional"
 CAN_fund_the_national_research_council_desc:0 "Dewan Riset Nasional (NRC) akan memimpin penelitian radar gelombang mikro, bahan peledak RDX, dan perlengkapan cuaca dingin ekstrem."
 CAN_mine_the_shield:0 "Tambang Perisai Kanada"
 CAN_mine_the_shield_desc:0 "Kawasan Perisai Kanada kaya akan nikel, tembaga, emas, dan besi. Membuka tambang baru akan memasok kebutuhan logam keras Sekutu."
 CAN_canada_wheat_board:0 "Dewan Gandum Kanada"
 CAN_canada_wheat_board_desc:0 "Menstabilkan harga gandum dari provinsi-provinsi padang rumput barat untuk memberi pasokan pangan berlimpah bagi Britania yang terkepung."
 CAN_victory_aircraft_limited:0 "Victory Aircraft Limited"
 CAN_victory_aircraft_limited_desc:0 "Pabrik pesawat milik negara Victory Aircraft di Malton akan memproduksi pengebom berat Avro Lancaster dalam jumlah besar."
 CAN_alberta_coal_towns:0 "Kota-Kota Batu Bara Alberta"
 CAN_alberta_coal_towns_desc:0 "Menambang cadangan batu bara melimpah di kaki Pegunungan Rocky untuk menggerakkan pembangkit listrik dan kereta api barang."
 CAN_commit_to_the_war:0 "Berkomitmen pada Perang"
 CAN_commit_to_the_war_desc:0 "Dunia terbakar dan Kanada siap memainkan perannya. Kita bersumpah mempertahankan kebebasan bersama bangsa-bangsa merdeka."
 CAN_john_inglis_and_company:0 "John Inglis and Company"
 CAN_john_inglis_and_company_desc:0 "Pabrik John Inglis di Toronto akan dikonversi menjadi produsen senapan mesin Bren dan pistol Browning berkapasitas terbesar di dunia."
 CAN_polymer_corporation:0 "Polymer Corporation"
 CAN_polymer_corporation_desc:0 "Didirikan di Sarnia, Ontario, Polymer Corporation akan memproduksi karet sintetis dan senyawa kimia canggih untuk menggantikan karet alam yang hilang."
 CAN_national_steel_car:0 "National Steel Car"
 CAN_national_steel_car_desc:0 "Pabrik gerbong National Steel Car di Hamilton akan beralih memproduksi ribuan badan pesawat dan cangkang peluru artileri."
 CAN_send_in_the_zombies:0 "Kirim Para 'Zombi'"
 CAN_send_in_the_zombies_desc:0 "Saatnya mengirim prajurit wajib militer NRMA—yang sering dijuluki 'Zombi' karena hanya bertugas di dalam negeri—untuk bertempur di garis depan Eropa."
 CAN_if_day:0 "Hari Seandainya (If Day)"
 CAN_if_day_desc:0 "Mementaskan simulasi invasi Nazi palsu di kota Winnipeg untuk menyadarkan masyarakat akan bahaya kedudukan fasis dan merangsang penjualan obligasi perang."
 CAN_defense_research_grants:0 "Hibah Riset Pertahanan"
 CAN_defense_research_grants_desc:0 "Sebagai negara berdaulat penuh, kita harus menyediakan dana riset mandiri bagi universitas dan laboratorium militer Kanada."
 CAN_uranium_mining:0 "Pertambangan Uranium"
 CAN_uranium_mining_desc:0 "Tambang Eldorado di Great Bear Lake memasok bijih uranium murni yang sangat krusial bagi Proyek Manhattan."
 CAN_long_branch_arsenal:0 "Gudang Senjata Long Branch"
 CAN_long_branch_arsenal_desc:0 "Pabrik Long Branch di barat Toronto akan menjadi pusat pembuatan senapan Lee-Enfield No. 4 dan senapan submesin Sten."
 CAN_independent_command:0 "Komando Mandiri"
 CAN_independent_command_desc:0 "Dalam Perang Besar, pasukan Kanada tunduk pada jenderal Britania. Sekarang, Angkatan Darat Kanada Pertama harus berada di bawah komando perwira Kanada sendiri!"
 CAN_forced_quebec_conscription:0 "Wajib Militer Paksa Quebec"
 CAN_forced_quebec_conscription_desc:0 "Sebagaimana krisis 1917, warga Quebec menolak wajib militer seberang laut. Kita harus menegakkannya demi memenangkan perang, apa pun risiko politiknya."
 CAN_compromise_with_quebec:0 "Kompromi dengan Quebec"
 CAN_compromise_with_quebec_desc:0 "Ketegangan antara penutur bahasa Inggris dan Prancis di Kanada mengancam persatuan nasional. Kita harus mencapai kompromi yang adil dengan Quebec demi kesatuan bangsa."
 CAN_war_fueled_economy:0 "Ekonomi Didorong Perang"
 CAN_war_fueled_economy_desc:0 "Permintaan luar biasa dari sekutu atas amunisi, truk, dan logam telah mengubah Kanada menjadi kekuatan industri manufaktur raksasa."
 CAN_army_modernization:0 "Modernisasi Angkatan Darat"
 CAN_army_modernization_desc:0 "Memodernisasi doktrin taktis dan persenjataan divisi-divisi kita agar setara dengan tentara terbaik di dunia."
 CAN_canadian_infantry_corps:0 "Korps Infanteri Kanada"
 CAN_canadian_infantry_corps_desc:0 "Membentuk formasi tingkat korps terpadu dengan standar pelatihan tempur tertinggi."
 CAN_cmp_truck:0 "Truk CMP"
 CAN_cmp_truck_desc:0 "Truk standar Canadian Military Pattern yang diproduksi oleh Ford dan GM Kanada akan menjadi tulang punggung mobilitas seluruh pasukan Sekutu."
 CAN_royal_regiment_of_canadian_artillery:0 "Resimen Kerajaan Artileri Kanada"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "Melatih para penembak artileri kita untuk koordinasi tembakan baterai berkecepatan tinggi yang mematikan."
 CAN_a_motorized_army:0 "Tentara Bermotor"
 CAN_a_motorized_army_desc:0 "Pengalaman Kanada dalam manufaktur otomotif memberi kita keunggulan untuk memotorkan seluruh formasi infanteri kita."
 CAN_red_deer_training_camp:0 "Kamp Pelatihan Red Deer"
 CAN_red_deer_training_camp_desc:0 "Pusat pelatihan militer Red Deer di Alberta akan melatih para pengemudi dan mekanik divisi lapis baja kita."
 CAN_the_walkie_talkie:0 "Walkie-Talkie"
 CAN_the_walkie_talkie_desc:0 "Donald Hings telah menemukan pemancar radio portabel nirkabel 'walkie-talkie' yang merevolusi komunikasi peleton di medan pertempuran."
 CAN_1st_canadian_parachute_battalion:0 "Batalion Parasut ke-1 Kanada"
 CAN_1st_canadian_parachute_battalion_desc:0 "Membentuk pasukan lintas udara elit penerjun payung untuk terjun di garis belakang pertahanan musuh di Normandia."
 CAN_the_black_devils:0 "Iblis Hitam (The Black Devils)"
 CAN_the_black_devils_desc:0 "Pasukan komando gabungan First Special Service Force yang ditakuti musuh karena keberanian dan serangan malam mereka yang senyap."
 CAN_the_valentine_tank:0 "Tank Valentine"
 CAN_the_valentine_tank_desc:0 "Pabrik lokomotif Angus Shops di Montreal akan memproduksi ratusan tank Valentine yang tangguh untuk dikirim ke garis depan."
 CAN_the_rocky_mountain_rangers:0 "The Rocky Mountain Rangers"
 CAN_the_rocky_mountain_rangers_desc:0 "Pertahanan wilayah barat Kanada dan Kepulauan Aleut akan diamanahkan kepada resimen pegunungan Rocky Mountain Rangers."
 CAN_strengthen_the_commonwealth_ties:0 "Pererat Hubungan Persemakmuran"
 CAN_strengthen_the_commonwealth_ties_desc:0 "Sesama Dominion adalah sahabat terdekat kita; bersama-sama kita berdiri demi kemenangan Mahkota dan kebebasan."
 CAN_shadow_factories:0 "Pabrik Bayangan"
 CAN_shadow_factories_desc:0 "Membangun bengkel suku cadang pesawat yang tersebar di wilayah pedalaman agar aman dari potensi serangan musuh."
 CAN_montreal_laboratory_collaboration:0 "Kolaborasi Laboratorium Montreal"
 CAN_montreal_laboratory_collaboration_desc:1 "Laboratorium Montreal menjadi pusat riset nuklir terkemuka bagi para ilmuwan Britania, Prancis, dan Kanada."
 CAN_the_plan:0 "Rencana Itu (The Plan)"
 CAN_the_plan_desc:0 "British Commonwealth Air Training Plan (BCATP) di Kanada akan melatih lebih dari 130.000 awak pesawat Sekutu di langit Kanada yang aman dan luas."
 CAN_camp_x:0 "Camp X"
 CAN_camp_x_desc:0 "Fasilitas rahasia Camp X di tepi Danau Ontario akan melatih para agen spionase SOE dan OSS dalam seni perang rahasia."
 CAN_supply_the_empire:0 "Pasok Sang Imperium"
 CAN_supply_the_empire_desc:0 "Kanada kaya akan kayu, besi, nikel, dan batu bara; konvoi kita akan terus mengalirkan bahan mentah ini ke pelabuhan Britania."
 CAN_aluminium_company_of_canada:0 "Perusahaan Aluminium Kanada (Alcan)"
 CAN_aluminium_company_of_canada_desc:0 "Pabrik peleburan raksasa Alcan di Arvida, Quebec, ditenagai oleh PLTA dan memproduksi sebagian besar aluminium untuk pesawat tempur Sekutu."
 CAN_turner_valley_oilfield:0 "Ladang Minyak Turner Valley"
 CAN_turner_valley_oilfield_desc:0 "Ladang minyak Turner Valley di Alberta menjadi produsen minyak mentah dan bahan bakar penerbangan terbesar di imperium."
 CAN_patriation:0 "Patriasi Konstitusi"
 CAN_patriation_desc:0 "Saatnya bagi Kanada untuk mengurangi ketergantungannya pada parlemen Westminster dan mengukuhkan kemandirian hukum nasional."
 CAN_permanent_joint_defense_board:0 "Dewan Pertahanan Bersama Permanen"
 CAN_permanent_joint_defense_board_desc:0 "Deklarasi Ogdensburg membentuk dewan pertahanan bersama permanen dengan Amerika Serikat untuk menjaga benua Amerika Utara."
 CAN_north_american_alliance:0 "Aliansi Amerika Utara"
 CAN_north_american_alliance_desc:0 "Membentuk kemitraan militer dan industri permanen yang kokoh dengan Amerika Serikat."
 CAN_habakkuk_carrier:0 "Kapal Induk Habakkuk"
 CAN_habakkuk_carrier_desc:0 "Proyek Habakkuk: membangun kapal induk anti-kapal selam raksasa berbahan dasar 'pykrete' (campuran es dan pulp kayu) yang tahan torpedo di danau-danau Kanada."
 CAN_refuge_for_scientists:0 "Suaka bagi Ilmuwan"
 CAN_refuge_for_scientists_desc:0 "Jauh dari kancah perang, Kanada menjadi tempat perlindungan yang tenang bagi para peneliti dan akademisi pelarian Eropa."
 CAN_swastika_clubs:0 "Klub Swastika"
 CAN_swastika_clubs_desc:0 "Gelombang baru gerakan fasis telah melanda Kanada dalam bentuk Klub Swastika. Mereka dapat digunakan untuk memaksakan ketertiban di jalanan dan memperkuat posisi politik kita."
 CAN_support_the_blue_shirts:0 "Dukung Baju Biru"
 CAN_support_the_blue_shirts_desc:0 "Partai Sosialis Nasional Kristen pimpinan Adrien Arcand dan milisi Baju Biru siap merebut kendali pemerintahan."
 CAN_join_germany:0 "Bergabung dengan Jerman"
 CAN_join_germany_desc:0 "Menyelaraskan kebijakan luar negeri kita dengan Poros untuk mengakhiri pengaruh kaum kapitalis Anglo-Amerika."
 CAN_support_a_synarchist_baja:0 "Dukung Sinarkis Baja"
 CAN_support_a_synarchist_baja_desc:0 "Mendukung gerakan nasionalis konservatif Sinarkis di Meksiko untuk mengimbangi pengaruh Washington."
 CAN_pinion_the_eagle:0 "Koyak Sayap Sang Elang"
 CAN_pinion_the_eagle_desc:0 "Perbatasan panjang kita dengan Amerika Serikat tidak boleh lagi dibiarkan terbuka. Kita harus membentenginya dari potensi agresi."
 CAN_skewer_the_eagle:0 "Tusuk Sang Elang"
 CAN_skewer_the_eagle_desc:0 "Kita akan membentuk aliansi pertahanan dengan Meksiko untuk mengepung dan mengekang kekuatan militer Amerika Serikat."
 CAN_defence_scheme_no_1:1 "Rencana Pertahanan No. 1"
 CAN_defence_scheme_no_1_desc:1 "Sudah waktunya membersihkan debu dari Rencana Pertahanan No. 1, rencana masa antarperang kita untuk melancarkan serangan balasan ke Amerika Serikat jika perang pecah."
 CAN_demand_labrador_and_newfoundland:0 "Tuntut Labrador dan Newfoundland"
 CAN_demand_labrador_and_newfoundland_desc:0 "Newfoundland adalah Dominion yang gagal dan terpaksa kembali ke status koloni. Tempat semestinya adalah bersatu bersama Kanada."
 CAN_burn_the_royal_portraits:0 "Bakar Potret Kerajaan"
 CAN_burn_the_royal_portraits_desc:0 "Cukup sudah monarki! Kita tidak akan lagi tunduk pada kekuasaan boneka asing dan parlemen seberang lautan. Kanada akan merdeka dan setara. Rakyat akan bangkit."
 CAN_communist_labor_total_war_committee:0 "Komite Perang Total Buruh Komunis"
 CAN_communist_labor_total_war_committee_desc:0 "Komunis Kanada juga patriot! Dalam perang global melawan Fasisme, kita dapat bekerja sama dengan kaum borjuis liberal untuk memobilisasi seluruh bangsa demi perang."
 CAN_defence_scheme_no_2:0 "Rencana Pertahanan No. 2"
 CAN_defence_scheme_no_2_desc:0 "Rencana Pertahanan No. 2 adalah rencana kontinjensi kita jika terjadi perang di Pasifik antara Amerika Serikat dan Kekaisaran Jepang. Idealnya kita tetap netral, tetapi bagaimanapun situasinya, pertahanan kokoh di pantai barat harus dibangun."
 CAN_supply_the_red_army:0 "Pasok Tentara Merah"
 CAN_supply_the_red_army_desc:0 "Saat Uni Soviet berperang melawan musuh rakyat, Kanada harus membantu Moskwa dengan senjata dan perbekalan."
 CAN_canada_united:1 "Kanada Bersatu"
 CAN_canada_united_desc:0 "Meskipun populasi kita tersebar dalam garis tipis melintasi benua, kita bersatu dalam krisis dunia ini untuk membela nilai-nilai Kanada dan melindungi yang lemah."
 CAN_join_comintern:0 "Bergabung dengan Komintern"
 CAN_join_comintern_desc:0 "Uni Soviet telah membuktikan itikad baik dan kekuatannya. Kanada harus bergabung dengan aliansi Soviet."
 CAN_support_the_world_revolution:0 "Dukung the World Revolution"
 CAN_support_the_world_revolution_desc:0 "Apakah Anda mendengar nyanyian rakyat? Itu adalah lagu Internasionale! Kanada akan berikhtiar membebaskan kaum proletar dari belenggu mereka."
 CAN_rcaf_station_borden:0 "RCAF Station Borden"
 CAN_rcaf_station_borden_desc:0 "Korps penerbangan Kanada lahir di Borden, Ontario, dan pangkalan tersebut harus dimanfaatkan untuk melatih generasi pilot penerbang baru."
 CAN_we_have_the_hurricane:0 "We Have the Hurricane"
 CAN_we_have_the_hurricane_desc:0 "Inggris Raya telah memberi izin kepada kita untuk memproduksi lini pesawat tempur Hurricane. Pesawat-pesawat ini akan menjadi tulang punggung sayap udara kita."
 CAN_the_pacific_coast_air_defence_radar_system:0 "The Pacific Coast Air Pertahanan Radar System"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "Pesisir British Columbia berbatu dan jarang penduduknya, kecuali di bagian selatan. Kita harus mengandalkan sistem peringatan dini berupa rangkaian stasiun radar untuk mendeteksi ancaman tak lazim yang datang melintasi Samudra Pasifik."
 CAN_commonwealth_air_training_plan:0 "Commonwealth Air Training Plan"
 CAN_commonwealth_air_training_plan_desc:0 "Pelatihan tempur udara akan dikoordinasikan bersama sekutu Persemakmuran dan Dominion kita. Langkah ini jauh lebih efisien serta dapat dilakukan secara massal dan aman di pangkalan udara kita."
 CAN_fund_fairchilds_development:0 "Fund Fairchild's Development"
 CAN_fund_fairchilds_development_desc:0 "Pabrik pesawat Fairchild di Quebec harus diberikan sumber daya yang dibutuhkan untuk meningkatkan produksi suku cadang pengebom. Kita akan mampu menambah ribuan lapangan kerja di fasilitas tersebut."
 CAN_cookie_carriers:0 "Cookie Carriers"
 CAN_cookie_carriers_desc:0 "Perang udara strategis membutuhkan pengebom berat untuk menghujankan kejutan dahsyat ke garis pertahanan musuh kita."
 CAN_the_sabre_project:0 "The Sabre Project"
 CAN_the_sabre_project_desc:0 "Pesawat jet akan mendominasi langit masa depan, sehingga kita harus berinvestasi pada produksi varian mandiri dari rancangan pesawat jet asing."
 CAN_halifax_shipyards:0 "Halifax Shipyards"
 CAN_halifax_shipyards_desc:0 "Berada di lokasi strategis berhadapan langsung dengan Eropa, galangan kapal Halifax telah membangun kapal-kapal baru dalam kecepatan rekor. Pertempuran Atlantik dapat kita menangkan."
 CAN_destroyer_effort:0 "Destroyer Upaya"
 CAN_destroyer_effort_desc:0 "Ancaman serangan kapal selam terhadap konvoi pasokan dan pasukan mengharuskan kita memusatkan pembangunan kapal perusak guna memburu dan menghancurkan bahaya bawah laut tersebut."
 CAN_light_cruiser_effort:0 "Light Cruiser Upaya"
 CAN_light_cruiser_effort_desc:0 "Kita tidak akan pernah bisa membangun banyak kapal tempur utama, namun penjelajah ringan yang diproduksi secara massal tetap mampu memberikan hantaman mematikan."
 CAN_heavy_cruiser_effort:0 "Heavy Cruiser Upaya"
 CAN_heavy_cruiser_effort_desc:0 "Kita dapat menyusun armada tempur kita di sekitar kapal penjelajah berat, dan memiliki pelabuhan yang lebih dari cukup untuk menjalankan strategi ini."
 CAN_escort_fleet:0 "Escort Fleet"
 CAN_escort_fleet_desc:0 "Lautan memisahkan kita dari sebagian besar pergolakan dunia; jika tentara kita hendak bertempur dan terus terpasok, kita harus memprioritaskan formasi pengawal dan peperangan antikapal selam."
 CAN_fleet_in_being:0 "Fleet In Being"
 CAN_fleet_in_being_desc:0 "Dengan membangun kekuatan angkatan laut yang besar, keberadaannya saja sudah menjadi ancaman bagi musuh meski tak pernah dikerahkan. Bayangan armada kita berlayar menyerang jalur laut mereka akan memaksa mereka bertindak hati-hati."
 CAN_degauss_ship_hulls:0 "Degauss Ship Hulls"
 CAN_degauss_ship_hulls_desc:0 "Kita akan mulai menerapkan demagnetisasi (degaussing) lambung kapal kita untuk mengurangi jejak magnetiknya, melindungi kapal dari ranjau magnetik dan mereduksi profil deteksi elektronik kapal."
 CAN_trade_fleet:0 "Trade Fleet"
 CAN_trade_fleet_desc:0 "Kanada adalah negara maritim yang bertumpu pada perdagangan. Kita harus membangun lebih banyak kapal kargo dan konvoi niaga."
 CAN_united_shipyards:1 "United Shipyards"
 CAN_united_shipyards_desc:0 "Galangan United Shipyards di Montreal telah menjadi tumpuan utama pembuatan kapal pendarat dan armada kargo kita."
 CAN_mend_relations_with_the_trotskyites:0 "Mend Relations with the Trotskyites"
 CAN_mend_relations_with_the_trotskyites_desc:0 "Perpecahan lama di dalam tubuh partai telah memecah belah rakyat kita terlalu lama. Sudah saatnya merangkul kembali para eksil ini dan menyatukan tujuan kita sebagai lentera sejati kehendak rakyat."
 CAN_trotsky_loves_us:0 "Brothers in Arms"
 CAN_stalin_and_friends_hate_us_now:0 "Dissident Suspicions"
 CAN_reject_authoritarianism:0 "Introspective Communism"
 CAN_reject_authoritarianism_desc:0 "Seiring menghebatnya konflik dan polarisasi di sekitar kita, kondisi geografis dan sosial kita yang unik menjauhkan kita dari jebakan otoritarianisme yang mencemari gerakan sosialis luas. Gerakan kedaulatan rakyat harus dimulai kembali—bersama kita."
 CAN_reactivate_farmers_unity_league:0 "Reactivate the Farmer's Unity League"
 CAN_reactivate_farmers_unity_league_desc:0 "Liga Persatuan Petani mengemban peranan vital menjelang revolusi kita yang gemilang. Kini, di tengah masa kritis ini, kita harus memanggil kembali para loyalis pedesaan untuk membantu negara semampu mungkin."
 CAN_liberate_the_workers_of_the_world:0 "Spirit of the True Revolution"
 CAN_liberate_the_workers_of_the_world_desc:0 "Begitu teguhnya keyakinan kita pada tatanan adil yang kita bangun, para pemuda dan pemudi kita berbondong-bondong memanggul panji perjuangan agar kawan-kawan kita yang tertindas di negeri asing dapat mencicipi kebebasan sejati."
 CAN_canadian_citizenship_act: "The Canadian Citizenship Undang-Undang"
 CAN_canadian_citizenship_act_desc: "Hingga saat ini, penetapan kewarganegaraan Kanada masih didasarkan pada hukum Inggris, di mana warga Kanada tak ubahnya kawula Kemaharajaan Britania. Kita harus memastikan bahwa warga negara Kanada bukan lagi kelas bawahan dari status kawula Inggris."
 CAN_newfoundland_act: "The Newfoundland Undang-Undang"
 CAN_newfoundland_act_desc: "Wilayah Newfoundland dan Labrador sangat dekat dengan kita secara budaya maupun geografis, namun masih berada di bawah kekuasaan langsung Inggris. Sudah saatnya kita mengajukan permohonan untuk menyatukan wilayah tersebut ke dalam federasi kita."
 CAN_dominion_rifle_association: "Dominion of Canada Rifle Association"
 CAN_dominion_rifle_association_desc: "Asosiasi Senapan Dominion Kanada didirikan pada tahun 1868 dan diresmikan melalui undang-undang parlemen pada tahun 1900. Kita harus mendukung perluasan organisasi ini agar semakin banyak rakyat Kanada mahir menggunakan senjata api."
 SAF_support_axis_interests_effect_tt:0 "Build §YInfrastructure§! and add §YBuilding Slots§! in occupied states located in southern and mid parts of Africa.\n"
 SAF_a_king_for_our_people_trigger_tt:0 "King Edward has been exiled"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "The branches are mutually exclusive."
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Mutually exclusive with"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "This focus currently has no effect. Changes in the world situation may affect this."
 SAF_war_measures_act:0 "War Measures Undang-Undang"
 SAF_war_measures_act_desc:0 "Kini setelah kita berada dalam kondisi perang, pemerintah harus memiliki wewenang khusus yang dapat dimobilisasi demi menjaga keamanan garis belakang, kelancaran pelabuhan, dan keterjaminan pasokan tentara."
 SAF_emergency_workers:0 "Emergency Workers"
 SAF_emergency_workers_desc:0 "Pemerintah harus mengesahkan undang-undang yang memungkinkan perekrutan kaum perempuan dan warga non-kulit putih ke dalam industri yang mengalami kelangkaan tenaga kerja masa perang."
 SAF_csir:0 "CSIR"
 SAF_csir_desc:0 "Dewan Riset Ilmiah dan Industri (CSIR) akan menjadi laboratorium yang didanai negara dengan fokus pada penelitian industri. Kumpulkan para pakar terbaik kita untuk memodernisasi pertambangan, pelabuhan, dan manufaktur kita."
 SAF_cape_garrison_artillery:0 "Cape Garrison Artillery"
 SAF_cape_garrison_artillery_desc:0 "Tanjung Harapan tetap menjadi jalur laut vital bagi banyak negara sekaligus gerbang menuju jantung Afrika Selatan. Perluasan pertahanan pesisir dan artileri garnisun harus menjadi prioritas utama kita."
 SAF_reconstitute_the_cape_corps:0 "Reconstitute the Cape Corps"
 SAF_reconstitute_the_cape_corps_desc:0 "Secara historis, kita dapat mengerahkan sebagian penduduk Kulit Berwarna untuk membela Afrika Selatan. Kebijakan ini memang memicu perdebatan, namun akan membebaskan warga kulit putih Afrika Selatan untuk bertugas di seberang lautan."
 SAF_expand_the_cape_corps:0 "Perluas the Cape Corps"
 SAF_expand_the_cape_corps_desc:0 "Meskipun kita membentuk kembali Korps Cape sebagian besar sebagai pasukan non-kombatan, ancaman invasi mengharuskan kita memberi korps ini sumber daya, pelatihan, dan akses persenjataan yang lebih besar."
 SAF_work_for_all_poor:0 "Work for All Poor"
 SAF_work_for_all_poor_desc:0 "Warga Afrikaner miskin dari pedesaan membanjiri kota-kota demi mencari nafkah selama beberapa tahun terakhir, dan kita belum banyak membantu mereka. Melalui industrialisasi dan perlindungan akses kerja oleh negara, taraf hidup mereka akan terangkat."
 SAF_outlaw_strikes:0 "Outlaw Strikes"
 SAF_outlaw_strikes_desc:0 "Penghentian kerja dan gangguan perburuhan adalah tindakan tidak patriotik di masa krisis. Aksi mogok kerja dengan ini dinyatakan ilegal, dan pemerintah akan memaksa pekerja kembali beroperasi."
 SAF_support_the_policy_of_appeasement:0 "Dukung Kebijakan Pasifikasi"
 SAF_support_the_policy_of_appeasement_desc:0 "Perang lain di Eropa akan menjadi malapetaka. Kita harus mendukung upaya Neville Chamberlain untuk menjaga perdamaian."
 SAF_police_windhoek:0 "Police Windhoek"
 SAF_police_windhoek_desc:0 "Kita memegang mandat atas bekas koloni Jerman di Afrika Barat Daya sejak perang dunia lalu berakhir. Sangat penting bagi kita untuk menjalankan kewajiban mengamankan dan membangun kota utama Windhoek."
 SAF_joint_air_training_scheme:0 "Joint Air Training Scheme"
 SAF_joint_air_training_scheme_desc:0 "Negara-negara Persemakmuran menghimpun sumber daya dan pengalaman mereka untuk memfasilitasi dan mempercepat pelatihan pilot serta awak udara."
 SAF_desert_equipment:0 "Desert Equipment"
 SAF_desert_equipment_desc:0 "Perang di Afrika Utara membutuhkan perlengkapan khusus; karena pasukan kita dapat dipanggil bertugas di front tersebut, pengadaan dan pasokan peralatan gurun menjadi kebutuhan logistik yang sangat mendesak."
 SAF_suppress_the_stormjaers:0 "Suppress the Stormjaers"
 SAF_suppress_the_stormjaers_desc:0 "Organisasi fasis pro-Jerman Ossewabrandwag (OB) memiliki sayap paramiliter yang meniru milisi sayap kanan Eropa. Mereka merongrong upaya pemerintah dalam merekrut prajurit dan menjalankan kebijakan perang yang terpadu. Satuan Stormjaers harus dibubarkan."
 SAF_secure_interests_in_africa:0 "Secure Interests in Africa"
 SAF_secure_interests_in_africa_desc:0 "Uni Afrika Selatan berbatasan dengan sejumlah koloni Inggris yang dapat diserahkan ke bawah administrasi kita. Kita juga harus berupaya mengamankan status mandat kita atas Afrika Barat Daya secara permanen."
 SAF_native_laws_amendment_act:0 "Native Laws Amendment Undang-Undang"
 SAF_native_laws_amendment_act_desc:0 "Demi menjamin lapangan kerja bagi populasi Afrikaner, kita harus membatasi permukiman warga kulit hitam Afrika Selatan di perkotaan. Hanya mereka yang telah lama menetap di kotamadya yang berhak memiliki izin tinggal."
 SAF_encourage_segregation:0 "Encourage Segregation"
 SAF_encourage_segregation_desc:0 "Kita harus mempertegas pemisahan hukum antaretnis demi memperkokoh dominasi politik dan persatuan kelas penguasa kita."
 SAF_abandon_westminster:0 "Abandon Westminster"
 SAF_abandon_westminster_desc:0 "Peralihan jalur laut ke Terusan Suez serta pengalaman pahit Perang Boer telah menempa identitas Afrika Selatan yang terpisah dari Dominion lainnya. Kita harus menjauhkan diri dari Raja Inggris dan merintis jalan kedaulatan kita sendiri."
 SAF_support_the_afrikaner_broederbond:0 "Dukung the Afrikaner Broederbond"
 SAF_support_the_afrikaner_broederbond_desc:0 "Afrikaner Broederbond terus menggalang dukungan demi memperjuangkan aspirasi bangsa Afrikaner dan pemisahan ras yang lebih ketat. Memori pahit penindasan Inggris semasa Perang Boer masih membekas, dan Broederbond dapat membantu membentuk Afrika Selatan yang baru."
 SAF_support_ossewabrandwag:0 "Dukung Ossewabrandwag"
 SAF_support_ossewabrandwag_desc:0 "Paramiliter fasis Ossewabrandwag harus diberdayakan sebagai benteng pertahanan dalam meredam agitasi asing dan pemberontakan domestik yang menargetkan kelas penguasa."
 SAF_celebrate_the_great_trek:0 "Celebrate the Great Trek"
 SAF_celebrate_the_great_trek_desc:0 "Satu abad lalu, para leluhur Afrikaner kita memisahkan diri dari cengkeraman kolonial Inggris dan mendirikan negara Boer di timur laut. Semangat pantang menyerah mereka melambangkan keteguhan nilai luhur Afrika Selatan."
 SAF_voortrekker_monument:0 "Voortrekker Monument"
 SAF_voortrekker_monument_desc:0 "Monumen bagi kaum Voortrekker yang menempuh Perjalanan Akbar (Groot Trek) akan mengobarkan kembali jiwa kebangsaan dan persatuan di masa-masa penuh ujian ini."
 SAF_support_nazification_of_south_west_africa:0 "Dukung Nazification of South-West Africa"
 SAF_support_nazification_of_south_west_africa_desc:0 "Sebagai bekas koloni Jerman, sudah sepantasnya kita mendorong perkembangan gagasan-gagasan politik Jerman di wilayah Afrika Barat Daya."
 SAF_south_africa_first:0 "Afrika Selatan yang Utama"
 SAF_south_africa_first_desc:0 "Kepentingan rakyat Afrika Selatan harus ditempatkan di atas kepentingan Kekaisaran Inggris."
 SAF_support_the_german_coup:0 "Dukung the German Coup"
 SAF_support_the_german_coup_desc:0 "Pemerintah Jerman telah lama memandang Afrika Selatan sebagai ladang pengaruh strategis sejak abad lalu. Masa depan kita berada di pihak Reich, bukan Imperium Britania; mari lanjutkan rencana untuk menggulingkan rezim saat ini."
 SAF_reclaim_boer_colonies:0 "Reclaim Boer Colonies"
 SAF_reclaim_boer_colonies_desc:0 "Bekas wilayah Boer di Transvaal dan sekitarnya secara sah merupakan hak milik mutlak para pewaris merdeka dari bangsa pelopor tersebut."
 SAF_commemorate_the_battle_of_blood_river:0 "Commemorate the Battle of Blood River"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "Pada tahun 1838, benteng kereta pedati pemukim Boer berhasil memukul mundur puluhan ribu laskar Zulu dan melumpuhkan kekuatan mereka di Natal. Ini adalah bukti nyata kebenaran perjuangan suci kita."
 SAF_german_scientists:0 "German Scientists"
 SAF_german_scientists_desc:0 "Para ilmuwan Jerman termasuk yang terbaik di dunia dan memiliki banyak pengetahuan maju untuk dibagikan kepada kita."
 SAF_support_axis_interests:0 "Dukung Axis Interests"
 SAF_support_axis_interests_desc:0 "Negara-negara Poros memiliki tekad dan ideologi yang mampu membantu Afrika Selatan menegakkan martabatnya di panggung internasional. Kita harus memberikan dukungan diplomatik penuh."
 SAF_a_king_for_our_people:0 "A King for Our People"
 SAF_a_king_for_our_people_desc:0 "Afrika Selatan berhak memiliki rajanya sendiri, dan untungnya ada pangeran wangsa Windsor yang tengah terasing. Mantan Raja Edward VIII, Adipati Windsor, dapat dinobatkan ke atas takhta kita."
 SAF_empower_the_workers:0 "Empower the Workers"
 SAF_empower_the_workers_desc:0 "Kita adalah negeri kaum tambang dan petani. Kaum pekerja Afrika Selatan adalah satu-satunya representasi sejati dari kehendak seluruh bangsa."
 SAF_support_spain:0 "Dukung Spain"
 SAF_support_spain_desc:0 "Fasisme kian merajalela di Eropa, dan kita dapat menghentikannya di Spanyol—atau setidaknya memperlambat penyebarannya. Pasukan dan perbekalan militer harus dikirim demi membela perjuangan Republik."
 SAF_repeal_the_native_representation_act:0 "Repeal the Native Representation Undang-Undang"
 SAF_repeal_the_native_representation_act_desc:0 "Diskriminasi rasial bertentangan dengan nilai-nilai revolusi rakyat di Afrika Selatan. Hak suara warga kulit hitam harus dipulihkan dalam daftar pemilih umum dan diberi hak politik setara."
 SAF_burn_the_kings_portraits:0 "Burn the King's Portraits"
 SAF_burn_the_kings_portraits_desc:0 "Tumbangkan Keluarga Kerajaan! Tindakan simbolis ini akan menegaskan secara terbuka pemutusan total kita dari takhta penjajah asing."
 SAF_join_comintern:0 "Bergabung dengan Comintern"
 SAF_join_comintern_desc:0 "Uni Soviet telah berdiri di garda terdepan dalam membela kaum buruh melawan fasisme. Kita akan bergabung ke dalam aliansi perkasa mereka."
 SAF_support_the_world_revolution:0 "Dukung the World Revolution"
 SAF_support_the_world_revolution_desc:0 "Satu-satunya cara agar kaum buruh meraih kemenangan adalah menyatukan seluruh penjuru dunia dalam satu derap langkah. Revolusi harus bersifat universal, dan oleh karenanya, harus disebarluaskan."
 SAF_equal_opportunity_employment:0 "Equal Opportunity Employment"
 SAF_equal_opportunity_employment_desc:0 "Jika kita ingin mengangkat derajat kaum pekerja di negeri kita, kita harus memulainya dengan memastikan semua buruh diperlakukan setara, tanpa memandang warna kulit."
 SAF_demand_madagascar:0 "Demand Madagascar"
 SAF_demand_madagascar_desc:1 "Dengan perubahan drastis situasi di Eropa, sudah saatnya meninjau ulang seluruh sistem kolonialisme. Mengapa Madagaskar harus terus terbelenggu pada imperium yang tengah runtuh?"
 SAF_invite_soviet_advisers:0 "Invite Soviet Advisors"
 SAF_invite_soviet_advisers_desc:4 "Jika kita hendak menyokong Uni Soviet dalam memperjuangkan pembebasan buruh sedunia, kita harus meningkatkan mutu militer kita dengan belajar langsung dari mereka."
 SAF_south_african_soviet_research_treaty:0 "Research Treaty with USSR"
 SAF_south_african_soviet_research_treaty_desc:1 "Setelah memetik banyak pelajaran berharga dari kawan-kawan Soviet kita, saatnya memperdalam kemitraan ini dengan menandatangani perjanjian riset bilateral resmi."
 SAF_anti_colonialist_crusade:0 "Anti-Colonialist Crusade"
 SAF_anti_colonialist_crusade_desc:1 "Kolonialisme merupakan jantung dari sistem imperialisme yang menindas kaum tertindas sedunia. Kita berada pada posisi unik untuk menghancurkan sistem itu dan membebaskan rakyat Afrika dari eksploitasi berabad-abad."
 SAF_Union_of_the_African_People:0 "Union of the African People"
 SAF_Union_of_the_African_People_desc:1 "Sekian lama rakyat Afrika tidak memiliki suara dalam menentukan takdir mereka sendiri. Masa-masa kelam itu telah berakhir. Kita akan membentuk faksi perkasa yang mampu menangkis segala upaya kaum revanchis dunia. Afrika akan bebas dari kolonialisme."
 SAF_liberate_portugese:0 "Liberate Portuguese Colonies"
 SAF_liberate_portugese_desc:1 "Koloni Angola dan Mozambik berbatasan langsung dengan tanah air kita. Sudah saatnya mengakhiri penghisapan dan penindasan atas rakyat mereka."
 SAF_liberate_british:0 "Liberate British Colonies"
 SAF_liberate_british_desc:1 "Imperium Britania adalah contoh kolonialisme paling eksploitatif dalam sejarah manusia. Kita akan mengakhirinya untuk selamanya."
 SAF_liberate_belgian:0 "Liberate Belgian Colonies"
 SAF_liberate_belgian_desc:1 "Kongo Belgia dikenal luas sebagai salah satu babak eksploitasi dan penindasan paling kejam. Kita akan menuliskan babak penutup bagi kisah tirani tersebut."
 SAF_south_african_railways:0 "South African Railways"
 SAF_south_african_railways_desc:0 "Perusahaan Kereta Api Afrika Selatan perlu diperluas. Kelompok pemuda dapat dilatih di sana dan dibekali keterampilan teknis untuk membangun negeri maupun bertugas di luar negeri."
 SAF_expand_the_mining_industry:0 "Perluas the Mining Industry"
 SAF_expand_the_mining_industry_desc:0 "Kekayaan mineral Afrika Selatan melegenda, dan kita baru saja mulai mengeksploitasi cadangan emas, kromium, dan platinum yang melimpah di perut bumi kita."
 SAF_heavy_engineering:0 "Heavy Engineering"
 SAF_heavy_engineering_desc:0 "Sangat penting bagi Afrika Selatan untuk terus menguasai teknik rekayasa modern. Meski basis industri kita terbatas, investasi pada alat berat dan permesinan akan mempercepat kita menyamai negara maju."
 SAF_infrastructure_effort:0 "Infrastructure Upaya"
 SAF_infrastructure_effort_desc:0 "Sebagian besar wilayah Afrika Selatan masih berupa pedesaan yang belum terjamah. Jalur jalan raya dan rel kereta api tambahan akan mengalirkan hasil bumi ke pelabuhan-pelabuhan utama kita."
 SAF_armament_effort:0 "Armament Upaya"
 SAF_armament_effort_desc:0 "Afrika Selatan relatif aman dari ancaman invasi langsung, namun terpisah jauh dari sekutunya. Sangat mendesak untuk mengembangkan industri persenjataan mandiri agar persatuan kita tak pernah tanpa pertahanan."
 SAF_south_african_steel:0 "South African Steel"
 SAF_south_african_steel_desc:0 "Kita memiliki batu bara dan bijih besi; kini kita memiliki alasan kuat. Perluasan pabrik baja Iscor di Pretoria akan menyediakan pelat baja tebal yang mutlak dibutuhkan untuk persenjataan modern."
 SAF_pretoria_arms:0 "Pretoria Arms"
 SAF_pretoria_arms_desc:0 "Pabrik baja Pretoria sebelumnya berfokus pada pelat berat. Namun dengan tambahan perkakas mesin, kita dapat mengonversi sebagian pabrik menjadi pusat pembuatan senjata ringan."
 SAF_expand_the_rand_mines:0 "Perluas the Rand Mines"
 SAF_expand_the_rand_mines_desc:0 "Tambang Rand termasuk tambang emas terdalam di dunia—bahkan sejak era teknologi abad ke-19. Kini kemampuan kita berlipat ganda; mari menggali lebih dalam dan manfaatkan sepenuhnya kekayaan ini!"
 SAF_fund_the_university_of_south_africa:0 "Fund the University of South Africa"
 SAF_fund_the_university_of_south_africa_desc:0 "Universitas Afrika Selatan di Pretoria adalah salah satu institusi pendidikan terbaik di benua ini. Melalui investasi terarah, kita dapat memupuk cendekiawan lokal tanpa harus bergantung pada pendidikan di luar negeri."
 SAF_establish_the_atomics_energy_board:0 "Establish the Atomics Energy Dewan"
 SAF_establish_the_atomics_energy_board_desc:0 "Senjata atom akan menjadi lompatan militer terbesar sejak penemuan bubuk mesiu, belum lagi manfaat energi damainya. Himpun ilmuwan terkemuka kita untuk meneliti pemanfaatan atom."
 SAF_the_cape_defense_institute:0 "The Cape Pertahanan Institute"
 SAF_the_cape_defense_institute_desc:0 "Kini setelah Afrika Selatan berdaulat penuh, kita tidak lagi mendapatkan cetak biru dan prototipe canggih dari Inggris. Kita harus memastikan diri tetap unggul dari musuh dan tidak tertinggal dalam teknologi."
 SAF_defense_collaboration_initiative:0 "Pertahanan Collaboration Initiative"
 SAF_defense_collaboration_initiative_desc:0 "Inggris telah membuktikan manfaat pertukaran riset ilmiah antarsekutu dekat. Seluruh faksi kita akan mampu melaksanakan litbang perang secara efisien jika kita mengoordinasikan langkah ini bersama."
 SAF_special_service_battalion:0 "Special Service Battalion"
 SAF_special_service_battalion_desc:0 "Afrika Selatan dipenuhi pemuda pengangguran yang butuh arahan produktif. Batalion Dinas Khusus akan menanamkan kedisiplinan dan keterampilan organisasi militer yang sangat dibutuhkan."
 SAF_improve_the_three_oh_three:0 "Tingkatkan the Three Oh Three"
 SAF_improve_the_three_oh_three_desc:0 "Pasukan Afrika Selatan akan bertempur di berbagai medan dan iklim; senapan Lee-Enfield beruntung sangat fleksibel untuk dimodifikasi. Kaliber amunisi .303 dapat disesuaikan demi memaksimalkan daya tembak di garis depan."
 SAF_q_services_corps:0 "Q Services Corps"
 SAF_q_services_corps_desc:0 "Korps Dinas Perbekalan (Q Services Corps) akan menjadi otoritas terpusat yang bertanggung jawab atas logistik dan perbekalan tentara reguler, mendistribusikan bahan bakar, ransum, amunisi, dan seragam."
 SAF__south_african_military_college:0 "South African Military College"
 SAF__south_african_military_college_desc:0 "Afrika Selatan harus memiliki akademi militer yang setara dengan West Point di Amerika Serikat demi melahirkan korps perwira profesional yang setia kepada persatuan negara."
 SAF_expand_the_south_african_artillery:0 "Perluas the South African Artillery"
 SAF_expand_the_south_african_artillery_desc:0 "Korps artileri telah dipersatukan pada tahun 1934. Kini telah tiba saatnya melipatgandakan kekuatan personel dan daya gempurnya."
 SAF_sa_engineer_corps:0 "SA Engineer Corps"
 SAF_sa_engineer_corps_desc:0 "Korps Zeni Afrika Selatan hanya beranggotakan sekitar 600 prajurit berseragam. Hal ini tidak dapat diterima dalam tentara modern. Kita membutuhkan lebih banyak personel terlatih untuk tugas krusial ini."
 SAF_equipment_effort:0 "Equipment Upaya"
 SAF_equipment_effort_desc:0 "Kita tidak boleh mengabaikan pengadaan perlengkapan pendukung tentara kita. Senjata dan tank memang penting, namun seragam, radio komunikasi, kotak perbaikan, dan alat logistik lainnya sama krusialnya."
 SAF_south_african_special_forces:0 "South African Special Forces"
 SAF_south_african_special_forces_desc:0 "Afrika Selatan membutuhkan satuan komando mandiri untuk menjalankan misi-misi paling berbahaya di medan tempur yang sulit dijangkau."
 SAF_mechanization_effort:0 "Mechanization Upaya"
 SAF_mechanization_effort_desc:0 "Perang mekanis dan bermotor telah tiba. Perjalanan akbar masa depan akan dipandu oleh deru armada rantai dan kendaraan tempur lapis baja beroda."
 SAF_armor_effort:0 "Armor Upaya"
 SAF_armor_effort_desc:0 "Tank telah berkembang pesat meninggalkan sosok lamban dari era perang dunia sebelumnya. Riset dan doktrin kavaleri lapis baja kita tidak boleh tertinggal dari kawan maupun lawan."
 SAF_commit_to_the_five_year_plan:0 "Commit to the Five-Year Plan"
 SAF_commit_to_the_five_year_plan_desc:0 "Kita telah menyusun Rencana Lima Tahun untuk modernisasi dan ekspansi angkatan udara Afrika Selatan. Pemerintah harus berkomitmen penuh agar target strategis ini tidak meleset."
 SAF_improve_the_hawker_hartbees:0 "Tingkatkan the Hawker Hartbees"
 SAF_improve_the_hawker_hartbees_desc:0 "Hawker Hartbees yang kita miliki memang bukan pesawat paling modern di dunia, namun kita akan memaksimalkannya. Peningkatan mekanik dan jam terbang pilot akan mendongkrak performa pesawat sayap ganda ini."
 SAF_replace_the_blenheim:0 "Replace the Blenheim"
 SAF_replace_the_blenheim_desc:0 "Bristol Blenheim telah mengabdi dengan baik sebagai pengebom ringan bagi RAF dan Dominion. Namun kini saatnya beralih ke pesawat yang lebih kokoh dengan daya jelajah lebih jauh."
 SAF_perfect_the_cab_rank_technique:0 "Perfect the \"Cab-Rank\" Technique"
 SAF_perfect_the_cab_rank_technique_desc:0 "Taktik antrean serang \"Cab-Rank\" mengerahkan formasi pengebom untuk menghantam sasaran secara bertubi-tubi dalam garis beruntun, memberikan tekanan tanpa henti kepada musuh."
 SAF_desert_air_force:0 "Desert Air Force"
 SAF_desert_air_force_desc:0 "Langit padang pasir begitu terik, dan badai pasir menuntut perawatan ekstra bagi mesin pesawat kita. Ketahanan tempur berharga dapat ditempa di lingkungan ekstrem ini."
 SAF_secure_the_cape_sea_route:0 "Secure the Cape Sea Route"
 SAF_secure_the_cape_sea_route_desc:0 "Jika Terusan Suez jatuh ke tangan musuh, rute Tanjung Harapan akan kembali menjadi satu-satunya gerbang laut menuju belahan Timur. Amankan rute ini berapapun harganya!"
 SAF_retain_experienced_pilots:0 "Retain Experienced Pilots"
 SAF_retain_experienced_pilots_desc:0 "Kerap kali penerbang berpengalaman kita berpindah ke RAF alih-alih memperkuat angkatan sendiri. Kita harus mempertahankan para pilot andal ini di tanah air untuk mendidik dan menginspirasi kader penerbang muda kita."
 SAF_seaward_defence_force:0 "Seaward Pertahanan Force"
 SAF_seaward_defence_force_desc:0 "Pasukan Pertahanan Lautan (Seaward Defence Force) telah menjadi garda bahari kita selama dua dasawarsa. Alokasi anggarannya harus dilipatgandakan demi memperkokoh armada kita."
 SAF_protect_the_trade:0 "Protect the Trade"
 SAF_protect_the_trade_desc:0 "Perang lalu membuktikan betapa vitalnya konvoi dan kapal pengawal. Afrika Selatan terletak di persimpangan rute dagang utama dunia dan harus menjamin keselamatan kapal kargo hingga ke tujuan."
 SAF_disrupt_the_trade:0 "Disrupt the Trade"
 SAF_disrupt_the_trade_desc:0 "Perang lalu membuktikan betapa rentannya jalur pasokan laut. Posisi Afrika Selatan sangat ideal untuk mencegat dan menenggelamkan konvoi perkapalan musuh."
 SAF_expand_the_simons_town_base:0 "Perluas the Simon's Town Base"
 SAF_expand_the_simons_town_base_desc:0 "Simon's Town di Tanjung Harapan telah menjadi pangkalan laut terpenting di Afrika bagian selatan sejak tahun 1790-an. Pangkalan ini harus diperluas agar mampu menampung kapal-kapal perang berbobot besar."
 SAF_anti_submarine_tactics:0 "Anti Submarine Tactics"
 SAF_anti_submarine_tactics_desc:0 "Kapal selam musuh mengancam pelayaran yang melintasi Tanjung Harapan. Kita harus melacak, memburu, dan menenggelamkan mereka."
 SAF_submarine_warfare:0 "Submarine Warfare"
 SAF_submarine_warfare_desc:0 "Konvoi dagang musuh terus memanfaatkan jalur pelayaran Tanjung Harapan. Kita akan menyerang dan memusnahkan mereka dari kedalaman laut."
 SAF_prepare_overseas_offensive:0 "Prepare Overseas Offensive"
 SAF_prepare_overseas_offensive_desc:0 "Dengan ribuan mil garis pantai, Afrika Selatan sangat ideal untuk melatih prajurit dalam operasi amfibi. Ini adalah taktik yang sangat menantang, namun prajurit kita siap menguasainya."
 SAF_strengthen_the_cape_garrison_artillery:0 "Perkuat the Cape Garrison Artillery"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "Meriam garnisun di Tanjung Harapan harus dimodernisasi dan diperbanyak jumlahnya demi melindungi perairan Tanjung dari serangan armada musuh."
 SAF_civil_war_tt:1 "§RA civil war will break out§! between §Yfascist Nationalists§! in South West Africa and §Ydemocratic Unionists§! in the rest of the country."
 SAF_german_research_tt:0 "We will enter into a tech sharing agreement with Germany."
 scw_in_progress_tt:0 "Spain is in a civil war."
 NZL_transfer_the_new_zealand_division:0 "Transfer the New Zealand Division"
 NZL_transfer_the_new_zealand_division_desc:0 "Divisi Selandia Baru ke-2 telah dimobilisasi untuk bertempur, jadi kita harus mengirimkannya ke medan laga paling sengit. Sama seperti pendahulunya dalam Perang Dunia Pertama, divisi baru ini akan diperbantukan ke palagan Mediterania."
 NZL_form_the_rnzn:0 "Bentuk the RNZN"
 NZL_form_the_rnzn_desc:0 "Patroli pesisir kita yang dulunya kecil kini telah berkembang mencakup kapal-kapal yang mampu beroperasi mandiri lepas dari kendali Angkatan Laut Kerajaan Inggris. Selandia Baru akan memiliki angkatan lautnya sendiri."
 NZL_expand_devonport_naval_base:0 "Perluas Devonport Naval Base"
 NZL_expand_devonport_naval_base_desc:0 "Pangkalan Angkatan Laut Devonport akan menjadi markas utama armada kita, namun harus diperluas untuk menjawab tuntutan perang total."
 NZL_purchase_old_ships: "$SMB_purchase_destroyers_and_subs$"
 NZL_purchase_old_ships_desc: "$SMB_purchase_destroyers_and_subs_desc$"
 NZL_coastal_defense:0 "Coastal Pertahanan"
 NZL_coastal_defense_desc:0 "Selandia Baru adalah negara kepulauan yang jauh dari ancaman langsung, namun kita tetap harus bersiap menghadapi kemungkinan serbuan amfibi di sepanjang garis pantai kita."
 NZL_destroyer_effort:0 "Destroyer Upaya"
 NZL_destroyer_effort_desc:0 "Dengan kapasitas industri yang terbatas, kapal perusak adalah sarana paling efisien bagi Selandia Baru untuk memproyeksikan kekuatan laut: meronda pantai, memburu kapal selam, dan menjadi pos pengintai dini."
 NZL_submarine_effort:0 "Submarine Upaya"
 NZL_submarine_effort_desc:0 "Karena setiap invasi musuh harus datang melalui laut, serigala samudra dapat menjadi garis pertahanan yang tangguh. Bergerak senyap dan berburu secara berkelompok, armada kapal selam akan menjaga jalur laut kita."
 NZL_light_cruiser_effort:0 "Light Cruiser Upaya"
 NZL_light_cruiser_effort_desc:0 "Kapal berukuran sedang sangat cocok bagi kekuatan menengah seperti kita. Penjelajah ringan mampu memberikan hantaman keras, namun memiliki kecepatan tinggi untuk meloloskan diri dari pertempuran yang tidak menguntungkan."
 NZL_capital_ship_effort:0 "Capital Ship Upaya"
 NZL_capital_ship_effort_desc:0 "Jika Selandia Baru ingin memiliki angkatan laut kelas wahid, kita harus memiliki kapal-kapal tempur kelas utama. Kita harus berinvestasi pada kapal tempur dan penjelajah berat."
 NZL_expand_the_nzpaf:0 "Perluas the NZPAF"
 NZL_expand_the_nzpaf_desc:0 "Angkatan Udara Permanen Selandia Baru membutuhkan pesawat patroli maritim baru dan pengebom laut. Bangsa modern tidak boleh mengabaikan supremasi udara."
 NZL_form_the_rnzaf:0 "Bentuk the RNZAF"
 NZL_form_the_rnzaf_desc:0 "Telah tiba saatnya menjadikan angkatan udara sebagai matra mandiri. Angkatan Udara Kerajaan Selandia Baru (RNZAF) akan memiliki struktur komando sendiri sembari tetap bekerja sama erat dengan RAF Inggris."
 NZL_fighter_focus:0 "Fighter Focus"
 NZL_fighter_focus_desc:0 "Pesawat tempur sangat efektif untuk mencegat ancaman musuh dan mengawal armada pengebom yang menjadi instrumen penentu kemenangan bagi sekutu kita."
 NZL_bomber_focus:0 "Bomber Focus"
 NZL_bomber_focus_desc:0 "Pengebom ringan dapat secara efektif melindungi perairan pantai kita dan sangat dibutuhkan dalam pertempuran seberang lautan melawan musuh-musuh kita."
 NZL_defend_our_islands:0 "Defend Our Islands"
 NZL_defend_our_islands_desc:0 "Kita harus bersiap menghadapi serangan terhadap kepulauan kita dari arah laut. Pengebom laut dapat mencegat armada pendarat musuh atau bahkan menenggelamkan kapal tempur utama mereka."
 NZL_modern_fighters:0 "Modern Fighters"
 NZL_modern_fighters_desc:0 "Sudah saatnya memutakhirkan rancangan pesawat tempur kita menjadi armada yang lebih cepat dengan radius tempur lebih jauh, mengadopsi kemajuan teknologi sekutu kita."
 NZL_heavy_bombers:0 "Heavy Bombers"
 NZL_heavy_bombers_desc:0 "Perang hanya dapat dimenangkan dengan menghantam langsung jantung wilayah musuh. Pengebom berat mutlak diperlukan untuk melancarkan serangan dahsyat ke pabrik dan kota-kota musuh."
 NZL_the_plan: "British Commonwealth Air Training Plan"
 NZL_the_plan_desc: "Kita telah bergabung dengan para sekutu untuk bertukar pengalaman dalam melatih penerbang. Perang dapat dimenangkan dari udara, dan Rencana Pelatihan Udara Persemakmuran bisa menjadi kunci kemenangan kita."
 NZL_national_roads_board:0 "National Roads Dewan"
 NZL_national_roads_board_desc:0 "Medan Selandia Baru yang terjal kerap menghambat sistem jaringan jalan raya, namun kita harus memodernisasinya: merintis jalur bebas hambatan, mengaspal jalan, dan menembus pegunungan."
 NZL_new_zealand_steel:0 "New Zealand Steel"
 NZL_new_zealand_steel_desc:0 "Selandia Baru dikaruniai cadangan pasir besi yang melimpah, terutama di Pulau Utara. Dengan metode ekstraksi khusus, sumber daya ini akan menjadi fondasi industri baja nasional kita untuk masa depan."
 NZL_taranaki_oil:0 "Taranaki Oil"
 NZL_taranaki_oil_desc:0 "Kawasan Taranaki di Pulau Utara kaya akan mineral dan minyak bumi. Kita perlu menyuntikkan modal negara pada pengeboran dan kilang pengolahan agar cadangan minyak ini terkelola maksimal."
 NZL_wairarapa_sheep_farms:0 "Wairarapa Sheep Farms"
 NZL_wairarapa_sheep_farms_desc:0 "Industri wol di Wairarapa adalah pilar ekonomi Selandia Baru. Seiring dunia bangkit dari Depresi Besar, permintaan ekspor wol kita akan melonjak tajam."
 NZL_bureau_of_industry:0 "Bureau of Industry"
 NZL_bureau_of_industry_desc:0 "Selandia Baru berakar pada masyarakat agraris dan peternakan. Biro Industri harus mendorong investasi besar-besaran ke infrastruktur modal dan industri manufaktur."
 NZL_department_of_scientific_and_industrial_research:0 "Department of Scientific And Industrial Research"
 NZL_department_of_scientific_and_industrial_research_desc:0 "Negara-negara Persemakmuran dan Dominion lain berinvestasi gencar dalam riset ilmiah dan industri; sudah seharusnya kita melakukan hal yang sama."
 NZL_industrial_conscription:0 "Industrial Conscription"
 NZL_industrial_conscription_desc:0 "Tiada alasan bagi pria yang berbadan sehat untuk tidak berdinas di militer atau bekerja di industri perang. Undang-undang baru kita akan mengerahkan segenap tenaga rakyat demi mobilisasi dan produksi."
 NZL_think_big:0 "Think Big"
 NZL_think_big_desc:0 "Kita terbiasa menganggap diri kita sebagai Dominion yang lebih kecil dibanding Australia atau Kanada. Namun Selandia Baru sepenuhnya mampu meraih keagungan industri mandiri."
 NZL_project_seal:0 "Project Seal"
 NZL_project_seal_desc:0 "Proyek Seal adalah inisiatif rahasia bersama Amerika Serikat untuk mengembangkan senjata pemantik tsunami guna menenggelamkan pesisir musuh, didukung riset bom pemantul yang sangat menjanjikan."
 NZL_national_defense_institute:0 "National Pertahanan Institute"
 NZL_national_defense_institute_desc:0 "Kini setelah Selandia Baru berdaulat penuh, kita tidak lagi menerima cetak biru senjata mutakhir dari Inggris. Kita harus memastikan kemampuan pertahanan mandiri agar tidak tertinggal teknologi."
 NZL_expand_the_university_of_auckland:0 "Perluas the University of Auckland"
 NZL_expand_the_university_of_auckland_desc:0 "Universitas Auckland adalah institusi pendidikan tinggi terpenting di negeri kita. Memperluas fasilitas risetnya akan menjaga putra-putri terbaik bangsa tetap mengabdi di tanah air."
 NZL_army_reforms:0 "Angkatan Darat Reforms"
 NZL_army_reforms_desc:0 "Kita harus memodernisasi sistem pelatihan dan jenjang promosi angkatan darat agar siap menghadapi gejolak apa pun dalam krisis global yang sedang berlangsung."
 NZL_charlton_automatic_rifle:0 "Charlton Automatic Rifle"
 NZL_charlton_automatic_rifle_desc:0 "Salah seorang warga kita berhasil memodifikasi senapan standar Lee-Enfield menjadi senapan otomatis penuh. Ini adalah puncak inovasi kecerdikan Selandia Baru yang harus kita dukung dan produksi."
 NZL_bob_semple_tank:0 "Tank Bob Semple"
 NZL_bob_semple_tank_desc:1 "Jika kita tidak dapat mengimpor tank dari luar negeri, kita akan membangun tank kita sendiri dari traktor bergigi lapis baja!"
 NZL_domestic_arms_industry:0 "Domestic Arms Industry"
 NZL_domestic_arms_industry_desc:0 "Kita harus mengalihkan sebanyak mungkin fasilitas industri untuk memproduksi senjata ringan, amunisi, suku cadang senjata, dan perbekalan tempur secara mandiri di dalam negeri."
 NZL_schofield_tank:0 "Schofield Tank"
 NZL_schofield_tank_desc:0 "Jika Tank Semple belum memenuhi harapan kita, tank bersenjatakan meriam tempur layak mungkin menjadi solusinya. Sistem kombinasi roda dan rantai Schofield sangat orisinal dan membuka wawasan baru bagi rancang bangun tank."
 NZL_long_range_patrol:0 "Long Range Patrol"
 NZL_long_range_patrol_desc:0 "Patroli Jarak Jauh (Long Range Patrol) dibentuk untuk menjelajahi bentang luas padang pasir Afrika Utara, menjalankan operasi pengintaian dan komando khusus di medan terkeras di bumi."
 NZL_artillery_focus:0 "Artillery Focus"
 NZL_artillery_focus_desc:0 "Artileri adalah tumpuan utama dalam mendukung gerak maju infanteri kita. Tingkatkan riset balistik dan laras meriam berkaliber lebih besar."
 NZL_big_bob_tank:0 "Big Bob Tank"
 NZL_big_bob_tank_desc:0 "Medan perang Eropa menuntut lapisan baja yang lebih tebal untuk menandingi tank-tank raksasa musuh. 'Big Bob' akan menjadi sumbangsih Selandia Baru dalam rekayasa tank berat."
 NZL_research_collaboration:0 "Research Collaboration"
 NZL_research_collaboration_desc:0 "Inggris membuktikan manfaat pertukaran riset teknologi antarsekutu dekat. Seluruh faksi kita akan mampu melaksanakan litbang perang secara efisien bila langkah ini dikoordinasikan terpadu."
 NZL_the_first_labor_government:0 "The First Labour Government"
 NZL_the_first_labor_government_desc:0 "Pemerintahan Partai Buruh Pertama di Selandia Baru memiliki kesempatan emas mewujudkan agenda sosial-ekonomi progresif: regulasi industri, hak-hak pekerja, jaminan sosial, dan standardisasi upah layak."
 NZL_ratana_alliance:0 "Ratana Alliance"
 NZL_ratana_alliance_desc:0 "Aliansi dengan gerakan Rātana akan merangkul warga Maori Selandia Baru ke dalam pemerintahan dan mulai memulihkan luka masa lalu akibat penaklukan kolonial Inggris."
 NZL_maori_affairs_act:0 "Maori Affairs Undang-Undang"
 NZL_maori_affairs_act_desc:0 "Sebagian tanah ulayat Maori dinilai belum produktif secara ekonomi. Dengan mengonsolidasikannya di bawah pengawasan pemerintah, lahan-lahan ini dapat diubah menjadi pusat industri dan perniagaan yang bermanfaat."
 NZL_social_security_act:0 "Undang-Undang Jaminan Sosial"
 NZL_social_security_act_desc:0 "Memastikan seluruh rakyat Selandia Baru terlindungi dari kemiskinan dan kesulitan hidup di masa perang."
 NZL_the_manpower_act:0 "The Manpower Undang-Undang"
 NZL_the_manpower_act_desc:0 "Sejak perang berkecamuk, warga Maori berbondong-bondong mendatangi perkotaan. Undang-Undang Tenaga Kerja (Manpower Act) memungkinkan kita mengarahkan energi mereka ke pabrik-pabrik industri kita."
 NZL_amend_the_maori_affairs_act:0 "Amend the Maori Affairs Undang-Undang"
 NZL_amend_the_maori_affairs_act_desc:0 "Kita harus mengamendemen Undang-Undang Urusan Maori guna mendongkrak produktivitas lahan tanpa harus menggusur warga Maori dari tanah leluhur mereka."
 NZL_waitangi_tribunal:0 "Waitangi Tribunal"
 NZL_waitangi_tribunal_desc:0 "Warga keturunan Inggris harus mengakui ketidakadilan masa lalu terhadap suku Maori: perang berdarah, perampasan tanah, dan pengabaian hak asasi. Mengakui warisan kelam ini adalah langkah awal rekonsiliasi sejati."
 NZL_maori_conscription:0 "Maori Conscription"
 NZL_maori_conscription_desc:0 "Keberanian luar biasa Batalion Maori dalam Pasukan Ekspedisi membuktikan bahwa kita harus mendayagunakan seluruh potensi bangsa dengan memberlakukan wajib militer bagi seluruh pemuda Maori."
 NZL_maori_volunteers:0 "Maori Volunteers"
 NZL_maori_volunteers_desc:0 "Menunjukkan jiwa patriotisme yang tinggi, ratusan pemuda Maori secara sukarela mendaftarkan diri untuk berdinas dalam angkatan bersenjata Selandia Baru."
 NZL_strengthen_the_commonwealth:0 "Perkuat the Commonwealth"
 NZL_strengthen_the_commonwealth_desc:0 "Sebagai wilayah Dominion yang lebih kecil, sangat penting untuk tetap berdekatan dengan kerabat sekutu kita. Kita akan memperkuat ikatan persaudaraan dengan sesama wilayah Persemakmuran Inggris."
 NZL_statute_of_westminster:0 "Statute of Westminster"
 NZL_statute_of_westminster_desc:0 "Statuta Westminster menganugerahkan kedaulatan legislatif yang lebih luas di bawah Mahkota tanpa memutus keanggotaan kita di dalam Imperium Britania."
 NZL_2nzef:0 "2NZEF"
 NZL_2nzef_desc:0 "Meski dibayangi kengerian perang dunia lalu, Selandia Baru siap kembali bertempur. Pasukan Ekspedisi Selandia Baru ke-2 (2NZEF) sedang dibentuk untuk dikerahkan ke palagan perang."
 NZL_arrest_pacifist_leaders:0 "Arrest Pacifist Leaders"
 NZL_arrest_pacifist_leaders_desc:0 "Sekarang bukan saatnya membiarkan pembangkangan dalam negeri. Semua pihak harus bersatu memenangkan perang; jika itu berarti menahan tokoh-tokoh pasifis antiperang, maka tindakan tegas harus diambil."
 NZL_technology_sharing_with_britain:0 "Technology Sharing With Britain"
 NZL_technology_sharing_with_britain_desc:0 "Kapasitas ilmiah dan industri Inggris Raya jauh melampaui kemampuan kita, namun sebagai sesama keluarga kerajaan, mereka bersedia membagikan pengetahuan canggihnya kepada kita."
 NZL_the_lee_affair:0 "The Lee Affair"
 NZL_the_lee_affair_desc:0 "John Lee, anggota parlemen untuk Grey Lynn, terus memicu kegaduhan di dalam kaukus Partai Buruh dengan mendesakkan agenda radikal. Langkah tegas harus diambil guna meredam pembangkangannya."
 NZL_empower_the_working_class:0 "Empower the Working Class"
 NZL_empower_the_working_class_desc:0 "Partai Buruh telah membela kaum pekerja sejak hari pendiriannya. Mari kita perluas perlindungan ketenagakerjaan dan beri serikat buruh kekuasaan nyata di ranah politik."
 NZL_join_comintern:0 "Bergabung dengan Comintern"
 NZL_join_comintern_desc:0 "Telah tiba saatnya bersatu dalam aliansi bersama kawan-kawan sosialis sedunia. Melalui Komintern, kita akan mewujudkan surga bagi kaum pekerja."
 NZL_technology_sharing_with_soviet_union:0 "Technology Sharing With Soviet Union"
 NZL_technology_sharing_with_soviet_union_desc:0 "Uni Soviet memiliki deretan ilmuwan dan inovator teknologi terkemuka dunia. Mereka bersedia membagikan pengetahuan mutakhir mereka kepada kita sebagai kawan seperjuangan."
 NZL_in_the_darkness:0 "In the Darkness"
 NZL_in_the_darkness_desc:0 "Ada kebobrokan mendasar dalam sistem demokrasi yang diagungkan oleh negeri induk kita. Kekuatan sejati tak akan pernah dapat diraih melalui kompromi politik yang lemah."
 NZL_befriend_japan:0 "Befriend Japan"
 NZL_befriend_japan_desc:0 "Sebagai negara di kawasan Pasifik, keamanan nasional kita menuntut persekutuan dengan kekuatan terkuat di kawasan. Jepang dan armadanya yang perkasa dapat melindungi kita dari mara bahaya dunia."
 NZL_rule_them_all:0 "Rule Them All"
 NZL_rule_them_all_desc: "Negara-negara di belahan Pasifik Selatan seharusnya dipersatukan di bawah satu kepemimpinan tangguh. Australia harus mempertimbangkan untuk tunduk pada keunggulan etos kita."
 NZL_technology_sharing_with_japan:0 "Technology Sharing With Japan"
 NZL_technology_sharing_with_japan_desc:0 "Kekaisaran Jepang memiliki para ilmuwan dan perancang teknologi tempur jempolan. Mereka bersedia berbagi terobosan teknologi militer dengan kita sebagai saudara seperjuangan."
 NZL_constitution_amendment_act:0 "Constitution Amendment Undang-Undang"
 NZL_constitution_amendment_act_desc:0 "Telah tiba saatnya Selandia Baru melepaskan diri dari dominasi Inggris. Kita akan mengamendemen konstitusi demi menegakkan kedaulatan mutlak atas urusan negeri kita sendiri."
 NZL_independent_new_zealand:0 "Independent New Zealand"
 NZL_independent_new_zealand_desc:0 "Kini kita adalah sebuah Republik! Selandia Baru tidak berutang apa pun kepada Inggris selain rasa terima kasih selayaknya anak kepada ibu yang merawatnya. Namun kita harus meninggalkan sarang Persemakmuran dan menatap dunia demi kepentingan nasional kita sendiri."
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap] transfers §Y2 Light Cruisers§! to us."
 RAJ_provincial_elections:0 "Provincial Elections"
 RAJ_provincial_elections_desc:0 "Undang-Undang Pemerintah India yang baru mengamanatkan pemilihan umum di tingkat provinsi, membentuk pemerintahan lokal yang bertanggung jawab kepada rakyat India. Kita akan melihat dampaknya terhadap kekuasaan Inggris."
 RAJ_swaraj:0 "Swaraj"
 RAJ_swaraj_desc:0 "Konsep pemerintahan mandiri dari Gandhi—Swaraj—kian populer di seantero India, menuntut pemutusan total dari institusi dan tatanan Inggris, serta menggerakkan pemuda di sekolah-sekolah India."
 RAJ_indian_national_congress:0 "Indian National Congress"
 RAJ_indian_national_congress_desc:0 "Kongres Nasional India telah mendulang sukses besar dalam pemilu di seluruh anak benua. Mereka menjadi corong paling lantang bagi kemerdekaan India, atau setidaknya otonomi yang jauh lebih luas di dalam Imperium."
 RAJ_quit_india_movement:0 "Quit India Movement"
 RAJ_quit_india_movement_desc:0 "Perjuangan kemerdekaan India pimpinan Gandhi mencapai puncaknya dengan seruan agar Inggris segera angkat kaki dari India. Situasi di lapangan kian memanas dari hari ke hari seiring desakan kemerdekaan."
 RAJ_all_india_forward_bloc:0 "All India Forward Bloc"
 RAJ_all_india_forward_bloc_desc:0 "All India Forward Bloc menilai pelepasan kekuasaan Inggris atas India berjalan terlalu lamban. Sikap yang lebih tegas—bahkan militan—harus segera diambil."
 RAJ_seek_help_from_soviet:0 "Seek Help From Soviet"
 RAJ_seek_help_from_soviet_promised:0 "The Soviet Union pledged their help"
 RAJ_seek_help_from_soviet_desc:0 "Uni Soviet adalah penyeimbang alami bagi kekuatan imperialis Inggris. Mereka mengklaim sebagai motor penggerak revolusi buruh, dan kita harus mendorong mereka menyebarkan api revolusi ke India."
 RAJ_indian_peoples_army:0 "Indian Peoples Army"
 RAJ_indian_peoples_army_effect:0 "The communist supporters start a civil war for freedom. The size depends on party support and autonomy progress."
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap] will support their cause."
 RAJ_indian_peoples_army_desc:0 "Kita harus mengorganisasi kekuatan militer rakyat yang menimba ilmu dari doktrin komunis dan bersekutu dengan perjuangan revolusi proletar."
 RAJ_research_city_excursions:0 "Research City Excursions"
 RAJ_research_city_excursions_desc:0 "Kota-kota riset rahasia Soviet begitu mengagumkan, dan India dipenuhi pemuda cerdas bersemangat. Mengirim insinyur muda kita ke sana akan mempercepat terbangunnya basis riset dan industri mandiri."
 RAJ_combined_arms_academy:0 "Combined Arms Academy"
 RAJ_combined_arms_academy_desc:0 "Pelatihan militer Soviet dapat diadopsi lebih efisien melalui Akademi Senjata Gabungan yang baru. Kita dapat memutakhirkan doktrin tempur modern matra darat, laut, dan udara secara terpadu."
 RAJ_rani_of_jhans:0 "Rani of Jhansi"
 RAJ_rani_of_jhans_desc:0 "Rani dari Jhansi adalah pahlawan besar Pemberontakan India 1857. Keteladanan keberaniannya menjadi inspirasi bagi kaum wanita India untuk memanggul senjata dan membentuk resimen tempur mereka sendiri."
 RAJ_rebuilding_the_nation:0 "Rebuilding the Nation"
 RAJ_rebuilding_the_nation_desc:0 "Setelah penjajah imperialis berhasil diusir dan segenap rakyat India bangkit bersatu, kini telah tiba saatnya memulihkan kerusakan akibat dua abad pendudukan asing."
 RAJ_seek_help_from_germany:0 "Seek Help From Germany"
 RAJ_seek_help_from_germany_promised:0 "The German Reich pledged their help"
 RAJ_seek_help_from_germany_desc:0 "Jerman tidak pernah menjajah kita seperti yang dilakukan Inggris, dan Reich adalah penantang paling nyata bagi supremasi Inggris. Kita harus menjalin kemitraan erat dengan kekuatan Poros."
 RAJ_indian_national_army:0 "Indian National Army"
 RAJ_indian_national_army_effect:0 "The fascist supporters start a civil war for freedom. The size depends on party support and autonomy progress."
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] will support their cause."
 RAJ_indian_national_army_desc:0 "Tentara Nasional India (INA), yang terpisah dari komando kolonial Inggris, telah dibentuk. Kita dapat membangunnya bebas dari campur tangan Inggris untuk melawan Sekutu dan merebut loyalitas prajurit India dari Raj."
 RAJ_battaglione_azad_hindoustan:0 "Battaglione Azad Hindoustan"
 RAJ_battaglione_azad_hindoustan_desc:0 "Italia telah membentuk Battaglione Azad Hindoustan dari mantan tawanan perang asal India. Dilatih dalam sabotase, penerjunan payung, dan infiltrasi, satuan ini menjadi kebanggaan nasional."
 RAJ_german_technology:1 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_german:0 "German Technology"
 RAJ_german_technology_japan:0 "Japanese Technology"
 RAJ_german_technology_desc:0 "Para ilmuwan Jerman diakui keunggulannya di dunia, dan mesin perang mereka bertumpu pada teknik rekayasa modern mutakhir. Mereka bersedia mentransfer kemajuan teknologi ini kepada kita."
 RAJ_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_german:0 "Luftwaffe Udara Training School"
 RAJ_japanese_army_air_force_academy_japan:0 "Japanese Angkatan Darat Udara Force Academy"
 RAJ_japanese_army_air_force_academy_desc:0 "Akademi Angkatan Udara Angkatan Darat Jepang telah bersedia menerima kadet-kadet asal India yang ingin berjuang mengakhiri dominasi kolonial Eropa di Asia."
 RAJ_cripps_mission:0 "Cripps' Mission"
 RAJ_cripps_mission_desc:0 "Kita harus menjaga India tetap setia kepada kubu Sekutu di tengah gelombang nasionalisme. Sir Stafford Cripps adalah negosiator ulung yang mampu meyakinkan para pemimpin nasionalis bahwa aspirasi mereka akan dipenuhi."
 RAJ_two_nation_theory:0 "Two-Nation Theory"
 RAJ_two_nation_theory_effect:0 "Pakistan will be released when India gains freedom.\n"
 RAJ_two_nation_theory_desc:0 "Meski sekian lama diperintah dalam satu kesatuan, tak dapat dimungkiri bahwa India terbagi menjadi dua bangsa—Hindu dan Muslim. Partisi wilayah mungkin bukan satu-satunya jalan, namun realitas ganda ini harus diakomodasi."
 RAJ_princely_state_donations:0 "Princely State Donations"
 RAJ_princely_state_donations_desc:0 "Negara-negara Kepangeranan India telah sekian lama menyumbangkan prajurit yang menjadi inti kekuatan tentara di bawah perwira Inggris. Sumbangan dana dari para penguasa lokal ini menegaskan dukungan mereka kepada Imperium."
 RAJ_imperial_service_troops:0 "Imperial Service Troops"
 RAJ_imperial_service_troops_desc:0 "Pasukan Dinas Kekaisaran (Imperial Service Troops) direkrut oleh para pangeran India dan berkekuatan ratusan ribu prajurit. Di masa sulit ini, Baginda Raja dapat mengandalkan loyalitas para maharaja."
 RAJ_raf_funding:0 "RAF Funding"
 RAJ_raf_funding_desc:0 "Angkatan Udara Kerajaan di India akan diberikan kucuran dana dan alokasi armada pesawat tambahan dari Inggris Raya."
 RAJ_navy_funding:0 "Angkatan Laut Funding"
 RAJ_navy_funding_effect:0 "§Y2 Light Cruisers§! will be added to your navy if you already have the technology.\n"
 RAJ_navy_funding_effect_mtg:0 "§Y2 Light Cruisers§! of this type will be added to our navy.\n"
 RAJ_navy_funding_desc:0 "Angkatan Laut Kerajaan di India akan menerima tambahan anggaran dan perkuatan armada tempur laut dari Inggris Raya."
 RAJ_british_army_support:0 "British Angkatan Darat Support"
 RAJ_british_army_support_desc:0 "Tentara Kerajaan Inggris memahami betul kondisi geografis India setelah dua abad pendudukan, dan mampu memberikan pelatihan taktis bagi prajurit India untuk menjaga keamanan tanah air."
 RAJ_red_eagle_division:0 "Red Eagle Division"
 RAJ_create_unit_red_eagles_tt:0 "Gain an elite infantry division in Delhi.\n"
 RAJ_red_eagle_division_desc:0 "Divisi Rajawali Merah (Red Eagle Division) akan menjadi divisi India pertama yang dilatih khusus untuk bertempur di seberang lautan dalam medan dan iklim paling ekstrem."
 RAJ_chindits:0 "Chindits"
 RAJ_orde_wingate_tt:0 "A §Y4 Skill General§! named §YOrde Wingate§! will appear.\n"
 RAJ_chindits_desc:0 "India membutuhkan pasukan komando khusus; oleh karenanya kita membentuk Chindits untuk beroperasi jauh di belakang garis pertahanan musuh di rimba belantara Asia demi menyabotase gerak maju mereka."
 RAJ_jungle_training:0 "Jungle Training"
 RAJ_jungle_training_effect:0 "Enables §HJungle Training§!\n§HMarines\nJungle§!\nAttack: §G+5%§!\nMovement: §G+10%§!\n§HMountaineers\nJungle§!\nAttack: §G+5%§!\nMovement: §G+10%§!\n§HParatroopers\nJungle§!\nAttack: §G+5%§!\nMovement: §G+10%§!\n"
 RAJ_jungle_training_desc:0 "Wilayah India, Burma, dan Indochina dipenuhi hutan lebat; pelatihan taktik perang hutan khusus mutlak diperlukan agar prajurit kita mampu bertempur mematikan di medan berbahaya ini."
 RAJ_lessons_of_the_great_war:0 "Lessons of the Great War"
 RAJ_lessons_of_the_great_war_desc:0 "Prajurit kolonial India turut bertempur dalam Perang Dunia Pertama; pengalaman berharga dari palagan tersebut harus diterapkan dalam modernisasi doktrin dan struktur angkatan darat kita."
 RAJ_indianisation_of_army:0 "Indianisation of Angkatan Darat"
 RAJ_indianisation_of_army_desc:0 "Demi mempertahankan India dalam perang total, segenap rakyat harus dimobilisasi. Ini berarti bukan hanya merekrut lebih banyak prajurit pribumi, melainkan juga menempatkan perwira India di pucuk rantai komando."
 RAJ_indian_gurkhas:0 "Indian Gurkhas"
 RAJ_indian_gurkhas_desc:0 "Laskar Gurkha dari dataran tinggi Nepal dan Punjab termasyhur akan ketangkasan tempurnya. Mereka telah mengabdi dengan setia dan sangat mahir dalam segala bentuk peperangan infanteri."
 RAJ_an_indian_sandhurst:0 "An Indian Sandhurst"
 RAJ_an_indian_sandhurst_desc:0 "India telah lama menuntut akademi militernya sendiri sejak perang lalu, dan akhirnya didirikan pada tahun 1932. Akademi Militer India telah melahirkan perwira-perwira pribumi tangguh sebagai inti kepemimpinan tentara kita."
 RAJ_lions_of_the_great_war:0 "Singa-Singa Perang Besar"
 RAJ_lions_of_the_great_war_desc:0 "Mengingat kembali kepahlawanan resimen India di medan tempur Eropa dan Timur Tengah dalam Perang Dunia Pertama."
 RAJ_indian_gentlemen_officers:0 "Perwira Pribumi India"
 RAJ_indian_gentlemen_officers_desc:0 "Membuka akademi militer bagi pemuda pribumi India untuk memegang komando pasukan tempur kita sendiri."
 RAJ_the_bangalore_torpedo:0 "The Bangalore Torpedo"
 RAJ_the_bangalore_torpedo_desc:0 "Salah satu sumbangsih terbesar India bagi seni perang modern adalah Torpedo Bangalore, pipa peledak bersambung untuk menerobos barikade kawat berduri di bawah berondongan peluru musuh."
 RAJ_vickers_berthier_gun:0 "Vickers-Berthier Gun"
 RAJ_vickers_berthier_gun_desc:0 "Senapan mesin Vickers-Berthier memang sedikit canggung, namun memiliki keunggulan proses perakitan yang sangat cepat dan mudah diproduksi secara massal bagi kebutuhan pertahanan India."
 RAJ_royal_indian_artillery:0 "Royal [ROOT.GetAdjective] Artillery"
 RAJ_royal_indian_artillery_desc:0 "Artileri Kerajaan India telah berkiprah sejak kongsi dagang EIC membentuk batalion meriam pribumi pada 1748. Pengalaman berabad-abad ini menjadi landasan kekuatan daya tembak artileri kita."
 RAJ_army_motorization:0 "Angkatan Darat Motorization"
 RAJ_army_motorization_desc:0 "Wilayah India terlampau luas untuk hanya mengandalkan kereta api dan kuda. Tentara harus dilengkapi dengan divisi bermotor serta armada truk pengangkut logistik reguler."
 RAJ_revive_the_screw_guns:0 "Revive the Screw Guns"
 mountain_guns_tt: "Enables §HMountain Gun§!\n§HArtillery (Mountains)§!\nAttack: §G+8%§!\nMovement: §G+15%§!\n§HAnti-Tank (Mountains)§!\nAttack: §G+8%§!\nMovement: §G+15%§!"
 RAJ_revive_the_screw_guns_desc:0 "Medan pegunungan terjal di India Utara mendorong pemanfaatan meriam gunung (screw guns) yang dapat dibongkar-pasang dan diangkut keledai. Meriam 7 pon ini tetap sangat berharga untuk pertempuran di puncak bukit."
 RAJ_indian_armor:0 "Indian Armor"
 RAJ_indian_armor_desc:0 "India harus memusatkan perhatian pada rekayasa kendaraan lapis baja dan pembentukan divisi tank mandiri di dalam negeri."
 RAJ_modernizing_army:0 "Modernizing Angkatan Darat"
 RAJ_modernizing_army_desc:0 "Terlalu lama angkatan bersenjata India hanya dipandang sebagai garnisun kolonial kelas dua. Sudah saatnya memodernisasi persenjataan dan doktrin tentara di anak benua ini setara dengan tentara di Eropa."
 RAJ_indian_defense_research:0 "Indian Pertahanan Research"
 RAJ_indian_defense_research_desc:0 "Kini setelah India menjadi bangsa berdaulat penuh, kita tidak lagi bergantung pada cetak biru persenjataan dari Inggris. Kita harus memastikan diri tetap unggul dari musuh dalam teknologi militer."
 RAJ_british_pilot_training:0 "British Pilot Training"
 RAJ_british_pilot_training_desc:0 "Angkatan Udara Kerajaan Inggris bersedia menerima penerbang India untuk menjalani pelatihan tempur intensif, yang akan sangat mempercepat pengembangan sayap udara kita sendiri."
 RAJ_expand_air_bases:0 "Perluas Udara Bases"
 RAJ_expand_air_bases_desc:0 "Bentang alam India yang begitu masif menuntut peningkatan kapasitas landasan dan fasilitas di pangkalan-pangkalan udara di seantero anak benua guna menjaga kedaulatan ruang udara."
 RAJ_air_support_effort:0 "Udara Dukung Upaya"
 RAJ_air_support_effort_desc:0 "Peperangan senjata gabungan adalah doktrin perang masa kini; kita harus melatih penerbang dan memproduksi armada pesawat pendukung taktis darat dan laut."
 RAJ_fighter_effort:0 "Fighter Upaya"
 RAJ_fighter_effort_desc:0 "Kita membutuhkan pesawat tempur buru-sergap untuk mengawal formasi pengebom kita dan merontokkan pesawat musuh yang mengancam langit tanah air."
 RAJ_royal_indian_air_force:0 "Royal Indian Udara Force"
 RAJ_royal_indian_air_force_desc:0 "Telah tiba saatnya mentransformasi satuan penerbangan kecil kita menjadi matra angkatan bersenjata mandiri dengan komando independen demi menjaga kedaulatan dirgantara."
 RAJ_the_smiling_buddha:0 "The Smiling Buddha"
 RAJ_the_smiling_buddha_desc:0 "Para ilmuwan kian dekat mengungkap rahasia energi atom yang membuka jalan bagi terciptanya bom mahadahsyat. Kita tidak boleh tertinggal dalam perlombaan penguasaan senjata nuklir."
 RAJ_great_indian_peninsula_railway:0 "Great Indian Peninsula Railway"
 RAJ_great_indian_peninsula_railway_desc:0 "Pengambilalihan Jalur Kereta Api Semenanjung India Raya oleh pemerintah pada tahun 1925 menugaskan kita untuk memperluas dan memodernisasi infrastruktur transportasi vital ini bagi mobilitas rakyat dan logistik militer."
 RAJ_industrial_expansion:0 "Industrial Expansion"
 RAJ_industrial_expansion_desc:0 "Ratusan juta jiwa mendiami India; tiada alasan mengapa populasi sebesar ini tidak dijadikan fondasi kokoh bagi kebangkitan raksasa industri dunia."
 RAJ_tata_steel:0 "Tata Steel"
 RAJ_tata_steel_desc:0 "Tata Steel sedang melesat menjadi produsen baja terbesar di dalam Imperium. Peningkatan produksinya akan menggerakkan modernisasi industri dan persenjataan India."
 RAJ_assam_oil:0 "Assam Oil"
 RAJ_assam_oil_desc:0 "Assam adalah pusat produksi minyak bumi India, terutama kilang di Digboi. Pengeboran dan kapasitas penyulingan minyak ini harus ditingkatkan secara maksimal."
 RAJ_indian_institute_of_science:0 "Indian Institute of Science"
 RAJ_indian_institute_of_science_desc:0 "Institut Sains India di Bangalore mewadahi cendekiawan paling cemerlang di anak benua untuk melahirkan kemajuan riset sains dan rekayasa terdepan."
 RAJ_institute_of_fundamental_research:0 "Institute of Fundamental Research"
 RAJ_institute_of_fundamental_research_desc:0 "Para ilmuwan dan tokoh industri terkemuka kita memelopori pendirian Institut Penelitian Fundamental demi memanfaatkan penemuan termutakhir dalam fisika nuklir dan sains terapan."
 RAJ_research_collaboration:0 "Research Collaboration"
 RAJ_research_collaboration_desc:0 "Inggris membuktikan manfaat pertukaran riset ilmiah antarsekutu. Seluruh faksi kita akan mampu melaksanakan litbang pertahanan secara efisien dengan adanya koordinasi sains yang terpadu."
 RAJ_expand_mazagon_dock:0 "Perluas Mazagon Dock"
 RAJ_expand_mazagon_dock_desc:0 "Galangan Mazagon di Mumbai adalah fasilitas pembuat kapal terpenting kita di Pantai Barat. Kapasitas doknya harus diperluas untuk menghadapi krisis perang global."
 RAJ_found_scindia_shipyard:0 "Found Scindia Shipyard"
 RAJ_found_scindia_shipyard_desc:0 "Kita membutuhkan galangan kapal modern di Pantai Timur, sehingga pendirian Galangan Kapal Scindia di Visakhapatnam menjadi langkah strategis bagi masa depan maritim kita."
 RAJ_royal_indian_navy:0 "Royal [ROOT.GetAdjective] Angkatan Laut"
 RAJ_royal_indian_navy_desc:0 "Angkatan Laut Kerajaan [ROOT.GetAdjective] harus segera diperluas secara kilat. Taktik pertempuran laut baru dan peremajaan armada kapal harus menjadi prioritas utama."
 RAJ_screening_effort:0 "Screening Upaya"
 RAJ_screening_effort_desc:0 "India mengemban peranan vital dalam mengamankan jalur pelayaran selatan menuju Terusan Suez. Misi pengawalan dan tabir kapal perusak akan memastikan konvoi tentara dan logistik tiba selamat di teater perang."
 RAJ_cruiser_effort:0 "Cruiser Upaya"
 RAJ_cruiser_effort_desc:0 "Kapal penjelajah akan menjadi tulang punggung yang memadai untuk saat ini dalam pengembangan kekuatan angkatan laut [ROOT.GetAdjective]."
 RAJ_submarine_effort:0 "Submarine Upaya"
 RAJ_submarine_effort_desc:0 "Seiring menguatnya armada permukaan laut Jepang di Asia, sangat masuk akal bagi kita untuk memusatkan kekuatan tempur bawah laut dan menyerang dari kapal selam."
 RAJ_capital_ship_effort:0 "Capital Ship Upaya"
 RAJ_capital_ship_effort_desc:0 "India telah menyaksikan betapa perkasanya kapal tempur utama dalam mendominasi samudra. Kita harus merancang dan membangun kapal penjelajah berat dan kapal tempur kita sendiri."
 RAJ_modernizing_navy:0 "Modernizing Angkatan Laut"
 RAJ_modernizing_navy_desc:0 "Mesin yang lebih bertenaga, ruang awak yang lebih lapang, laju lebih kencang, dan meriam kaliber lebih besar: angkatan laut India akan segera sejajar dengan kekuatan terbaik di benua ini."
 RAJ_east_india_railways:0 "East India Railways"
 RAJ_east_india_railways_desc:0 "Pengambilalihan kendali atas East India Railway menempatkan seluruh keputusan perluasan dan peremajaan rel kereta api ke tangan kementerian pemerintah kita."
 RAJ_integrate_princely_railways:0 "Integrate Princely Railways"
 RAJ_integrate_princely_railways_desc:0 "Sebagian penguasa monarki lokal membiayai jaringan kereta mereka sendiri, namun belum terhubung mulus dengan jalur nasional. Kita harus menyatukan seluruh rel demi kelancaran mobilitas bangsa."
 RAJ_ishapore_arsenal:0 "Ishapore Arsenal"
 RAJ_ishapore_arsenal_desc:0 "Pabrik Senjata dan Senapan Ishapore telah beroperasi sejak abad ke-18 dan menjadi pusat inovasi rancang bangun senjata ringan serta tumpuan produksi persenjataan nasional kita."
 RAJ_clamp_down_on_corruption:0 "Clamp Down On Corruption"
 RAJ_clamp_down_on_corruption_desc:0 "Meskipun proyek rel kereta gencar dibangun, rakyat India hanya menikmati sedikit manfaatnya akibat korupsi endemik dan kongkalikong di sektor transportasi. Kita harus bertindak tegas memberantasnya."
 RAJ_strengthen_ties_with_british_investors:0 "Strengthen Ties With British Investors"
 RAJ_strengthen_ties_with_british_investors_desc:0 "Demi memperluas pabrik dan mengolah sumber daya, kita masih bergantung pada permodalan Inggris. Hingga sektor perbankan kita kuat, kita harus menjalin kemitraan erat dengan para pemodal di London."
 RAJ_british_rail_investors:0 "British Rail Investors"
 RAJ_british_rail_investors_desc:0 "Infrastruktur sipil dan perkeretaapian di India membutuhkan suntikan investasi modal masif dari lembaga-lembaga keuangan Inggris."
 RAJ_british_arms_investors:0 "British Arms Investors"
 RAJ_british_arms_investors_desc:0 "Jika kita ingin mempercepat produksi pabrik senjata kita, kita perlu menarik bank-bank Inggris untuk mendanai infrastruktur industri militer kita."
 RAJ_indian_sandhurst_tt:0 "A §Y4 Skill General§! named §YKodandera Madappa Cariappa§! will appear.\nA §Y3 Skill General§! named §YKodandera Subayya Thimayya§! will appear.\nA §Y3 Skill General§! named §YJayanto Nath Chaudhuri§! will appear."
 RAJ_create_unit_gurkas_tt:0 "Gain an elite unit of Gurkhas in Delhi."
 RAJ_create_unit_rani_tt:0 "Gain an infantry unit in Delhi."
 RAJ_create_unit_sikh_tt:0 "Gain an infantry unit in Delhi."
 RAJ_create_general_rani_tt:1 "\nA §Y5 Skill General§! named §YLakshmi Sahgal§! will appear"
 RAJ_administrative_oversight:0 "Administrative Oversight"
 RAJ_administrative_oversight_desc:0 "Dengan teratasinya korupsi dan terjaminnya kedaulatan kita, saatnya merangkul para kepala suku dan pejabat lokal ke dalam sistem administrasi negara demi kemaslahatan seluruh rakyat di masa genting ini."
 RAJ_enable_local_industrialization:0 "Enables §HRural Industrialization§! decisions, allowing for modification of the §HAgrarian Society§! Spirit."
 RAJ_land_clearance:0 "Land Clearance"
 RAJ_land_clearance_desc:0 "Melalui pengaruh yang terjalin dengan para pemuka lokal, kita dapat membuka dan mendayagunakan lahan serta kekayaan alam secara optimal demi kepentingan negara."
 RAJ_workforce_integration:0 "Workforce Integration"
 RAJ_workforce_integration_desc:0 "Memanfaatkan wibawa para tokoh adat dan pemimpin daerah, kita dapat mengintegrasikan tenaga kerja ke dalam program-program pembangunan produktif di wilayah pedesaan."
 RAJ_land_clearance_effect_tt:0 "§H$RAJ_population_decisions$§! decisions now add §G1§! Building Slot.\n$apply_integration_effects_retroactively$"
 RAJ_integration_tooltip:0 "§H$RAJ_population_decisions$§! decisions now add:"
 RAJ_integration_tooltip_post:0 "$apply_integration_effects_retroactively$"
 apply_integration_effects_retroactively:0 "\nThis will be applied §Hretroactively§! to all states upon which this decision has been taken previously."
 continuous_naval_production:0 "Produksi Angkatan Laut Berkelanjutan"
 continuous_naval_production_desc:0 "Memfokuskan galangan kapal untuk mempercepat penyelesaian armada tempur laut."
 continuous_air_production:0 "Produksi Udara Berkelanjutan"
 continuous_air_production_desc:0 "Mengarahkan sumber daya industri untuk mempercepat produksi pesawat militer."
 continuous_non_factory_construct:0 "Construction Engineering"
 continuous_non_factory_construct_desc:0 "Masih terdapat banyak kapasitas menganggur di industri konstruksi kita. Dengan memfokuskan perhatian ke sektor ini, kita dapat mempercepat laju pembangunan secara signifikan, meski industri berat tidak terdampak langsung karena keterbatasan alat perkakas."
 continuous_reduce_training_time:0 "Angkatan Darat Training"
 continuous_reduce_training_time_desc:0 "Dengan membentuk satuan pelatihan lanjutan khusus di setiap divisi, kita dapat segera mengerahkan divisi-divisi ke garis depan tanpa harus menunggu seluruh siklus pelatihan reguler selesai."
 continuous_suppression:0 "Peredaman Perlawanan Berkelanjutan"
 continuous_suppression_desc:0 "Mengerahkan unit militer untuk meredam aktivitas gerilya dan perlawanan di wilayah pendudukan."
 continuous_repair:0 "Perbaikan Infrastruktur Berkelanjutan"
 continuous_repair_desc:0 "Menugaskan divisi zeni dan konstruksi untuk memperbaiki pabrik dan infrastruktur yang rusak akibat perang."
 continuous_tech_share:0 "Berbagi Teknologi Berkelanjutan"
 continuous_tech_share_desc:0 "Membuka kerja sama riset yang lebih erat dengan para sekutu dalam faksi kita."
 continuous_boost_freedom:0 "Increase Autonomy"
 continuous_boost_freedom_desc:0 "Dengan mereorganisasi birokrasi kolonial dan merekrut administrator pribumi, kita pada akhirnya akan mampu mengelola urusan pemerintahan kita secara berdaulat."
 continuous_restrict_freedom:0 "Suppress Subjects"
 continuous_restrict_freedom_desc:0 "Rakyat di daerah koloni kita mulai terpengaruh gagasan gegabah mengenai \"hak menentukan nasib sendiri\" atau \"kemerdekaan nasional\". Sudah saatnya menyadarkan mereka dari ilusi tersebut."
 continuous_special_facility: "Facility Construction"
 continuous_special_facility_desc: "Kita berkesempatan meningkatkan fasilitas riset guna menampung lebih banyak ilmuwan demi melahirkan terobosan mutakhir yang dapat mengubah jalannya peperangan masa depan."
 subject_autonomy_mod_tt:0 "Autonomy in subjects: §G-0.5§!"
 unlocks_decision:0 "Unlocks Decision:"
 USA_continue_the_new_deal:1 "Continue the New Deal"
 USA_continue_the_new_deal_desc:1 "Kebijakan New Deal telah terbukti membuahkan hasil. Kita tidak boleh kehilangan arah sekarang."
 USA_suspend_the_presecution:0 "Suspend the Persecution"
 USA_suspend_the_presecution_desc:0 "Penganiayaan warga negara Amerika karena pandangan politik mereka—seburuk apa pun kelihatannya—secara mendasar bertentangan dengan nilai-nilai luhur republik ini. Hal itu harus segera dihentikan."
 USA_desegregate_the_armed_forces:1 "Desegregate the Armed Forces"
 USA_desegregate_the_armed_forces_desc:1 "Menyandang senjata di jajaran militer negara mungkin menjadi kewajiban yang berat—namun juga merupakan hak yang mulia. Sebuah hak yang selama ini diingkari dari banyak warga kita semata-mata karena garis keturunan mereka."
 USA_full_desegregation:1 "Full Desegregation"
 USA_full_desegregation_desc:1 "Terlalu lama beberapa negara bagian kita memperlakukan warga secara diskriminatif berdasarkan kriteria kuno dan tidak manusiawi. Dalam sebuah republik yang merdeka, setiap warga negara harus diperlakukan setara—tanpa pemisahan."
 USA_democratic_socialism:1 "Democratic Socialism"
 USA_democratic_socialism_desc:1 "Tiada orang yang berpikiran jernih dapat menyangkal bahwa sosialisme adalah masa depan peradaban manusia. Pada saat yang sama, tiada patriot sejati yang mendukung pemerintahan yang bukan dari dan oleh rakyat. Mengikuti jejak para pendiri bangsa, kita akan memadukan keduanya dalam tatanan baru."
 USA_liberty_for_the_philippines:1 "Liberty for the Philippines"
 USA_liberty_for_the_philippines_desc:1 "Rakyat Filipina telah membuktikan kemampuannya mengelola urusan negeri mereka sendiri, dan sudah saatnya sisa-sisa kendali Amerika atas tanah air mereka dihapuskan secara resmi."
 USA_pacific_decolonisation:1 "Pacific Decolonisation"
 USA_pacific_decolonisation_desc:1 "Tiada pembenaran apa pun bagi kelanjutan keberadaan kekuatan kolonial Eropa di Pasifik, maupun bagi perbudakan bangsa-bangsa Kepulauan Pasifik. Amerika tidak akan lagi tinggal diam menyaksikan ketidakadilan ini berlanjut."
 USA_union_representation_act:1 "Union Representation Undang-Undang"
 USA_union_representation_act_desc:1 "Bekerja adalah hakikat dasar kehidupan, dan berhimpun dalam serikat adalah pilar masyarakat demokratis. Sudah selayaknya kita mengakui hak ini dan memastikan serikat buruh memiliki keterwakilan wajib di Kongres."
 USA_old_age_pension_act:1 "Old Age Pension Undang-Undang"
 USA_old_age_pension_act_desc:1 "Setelah seumur hidup membanting tulang, rakyat kita berhak menikmati jaminan keuangan dan kehormatan di hari tua. Peraturan yang ada saat ini jelas sangat tidak memadai."
 USA_accumulated_wealth_tax_act:1 "Accumulated Wealth Tax Undang-Undang"
 USA_accumulated_wealth_tax_act_desc:1 "Segelintir orang di negeri kita telah menimbun kekayaan modal dalam jumlah luar biasa yang hanya mengendap pasif di rekening bank atau kemewahan nirfaedah. Melalui pajak kekayaan baru, kita akan memaksa modal tersebut kembali mengalir ke dalam roda ekonomi produktif."
 USA_guarantee_the_american_dream:1 "Guarantee the American Dream"
 USA_guarantee_the_american_dream_desc:0 "Sebagian besar rakyat kita tidak meminta banyak: pekerjaan tetap, kesehatan yang baik, dan rumah layak untuk membina keluarga. Tiada alasan mengapa mereka tidak berhak mendapatkannya."
 USA_worker_management_act:1 "Worker Management Undang-Undang"
 USA_worker_management_act_desc:1 "Terlalu sering pabrik dan kantor dikelola oleh mereka yang tak pernah menginjakkan kaki di lantai produksi dan menetapkan target yang mustahil. Demi menyelamatkan perekonomian kita, kita akan menegakkan manajemen dari buruh, oleh buruh, untuk buruh!"
 USA_militia_organization_act:1 "Militia Organization Undang-Undang"
 USA_militia_organization_act_desc:1 "Republik kita memiliki tradisi luhur prajurit rakyat. Jika tanah air kita diserbu penyerang asing, mereka akan berhadapan dengan milisi rakyat terorganisasi dan bersenjata lengkap yang siap membela rumah mereka hingga titik darah penghabisan."
 USA_communal_property_act:1 "Communal Property Undang-Undang"
 USA_communal_property_act_desc:1 "Kepentingan orang banyak tidak boleh dikalahkan oleh ketamakan segelintir orang. Kita akan mengesahkan undang-undang baru yang memudahkan komunitas lokal menerapkan hak milik komunal demi kepentingan umum."
 USA_reintegration:1 "Reintegration"
 USA_reintegration_desc:1 "Perang telah mencabik-cabik bangsa kita, namun mereka yang memberontak tetap dapat diampuni. Setelah rakyat menyadari kekeliruan masa lalu mereka, mereka harus diizinkan kembali bergabung ke dalam proses politik republik kita."
 USA_reach_out_to_the_ware_group:1 "Reach out to the Ware Group"
 USA_reach_out_to_the_ware_group_desc:1 "Ada sekelompok kader komunis setia di dalam birokrasi pemerintahan kita. Mereka merasa bergerak secara rahasia, namun kita mengetahui jati diri mereka. Kita dapat merangkul mereka karena cita-cita perjuangan kita sejalan."
 USA_us_ussr_economic_cooperation:1 "US-USSR Economic Cooperation"
 USA_us_ussr_economic_cooperation_desc:1 "Terlepas dari awal berdirinya yang bergolak, Uni Soviet telah meraih kemajuan pesat dalam membangun peradaban industri modern. Kita harus mengambil bagian untuk mempererat kerja sama ekonomi dengan mereka."
 USA_secure_china:1 "Secure China"
 USA_secure_china_desc:1 "Tiongkok dicekam perang saudara yang berlarut-larut; rezim Nasionalis sangat korup dan telah kehilangan mandat rakyat. Sudah saatnya kita mendukung satu-satunya kekuatan yang mampu menyatukan dan mendamaikan negeri itu: Partai Komunis."
 USA_end_monarchism:1 "End Monarchism"
 USA_end_monarchism_desc:1 "Monarki-monarki Eropa telah menjerumuskan dunia ke dalam kobaran perang dahsyat; kita tidak boleh membiarkan hal itu terulang. Leluhur kita memerangi Raja Inggris demi kemerdekaan—kini giliran kita membebaskan dunia dari tirani itu selamanya!"
 USA_shatter_the_empires:1 "Shatter the Empires"
 USA_shatter_the_empires_desc:1 "Kita dahulu adalah koloni dari imperium global hingga kita menebus kemerdekaan dengan tumpahan darah. Republik kita takkan pernah merasa aman sebelum para pemburu takhta dunia ini dilumpuhkan kekuasaannya."
 USA_agricultural_adjustment_act:1 "Agricultural Adjustment Undang-Undang"
 USA_agricultural_adjustment_act_desc:1 "Para petani kita menderita pukulan terberat akibat depresi ekonomi. Kita harus memastikan kaum penyedia pangan bangsa tidak gulung tikar akibat gejolak pasar bebas yang liar."
 USA_fair_labour_standards_act:1 "Fair Labor Standards Undang-Undang"
 USA_fair_labour_standards_act_desc:1 "Seiring tanda-tanda awal pemulihan ekonomi, kaum pekerja harus turut merasakan kesejahteraannya. Praktik eksploitasi seperti lembur tanpa upah harus dilarang dan standar upah minimum layak harus diberlakukan."
 USA_federal_housing_act:1 "Federal Housing Undang-Undang"
 USA_federal_housing_act_desc:1 "Sebagai bagian dari upaya berkelanjutan memberantas kemiskinan di Amerika Serikat, kita akan mencanangkan program perumahan bersubsidi dari pemerintah federal."
 federal_housing_tt:0 "(§YFive random states§!): Add §G1§! Building Slots."
 USA_office_of_scientific_research_and_development:1 "Scientific Research & Development Office"
 USA_office_of_scientific_research_and_development_desc:1 "Dengan membayangnya ancaman perang di cakrawala, kita harus memadukan segenap potensi riset ilmiah demi menjamin keunggulan teknologi kita tidak diungguli oleh lawan mana pun."
 USA_focus_on_europe:1 "Focus on Europe"
 USA_focus_on_europe_desc:1 "Kekuatan-kekuatan Besar Eropa kembali bersiap menjerumuskan dunia ke dalam perang global. Kita tidak boleh menunggu hingga petaka itu menghantam kita. Kita harus siap campur tangan secara tegas jika perdamaian terancam."
 USA_focus_on_asia:1 "Focus on Asia"
 USA_focus_on_asia_desc:1 "Saat perhatian tertuju ke Eropa, kita menghadapi ketidakpastian dan instabilitas di seberang Pasifik. Menjadi kepentingan nasional kita untuk bertindak di luar negeri sebelum kita diserang di dekat perairan kita sendiri."
 USA_magic:1 "MAGIC"
 USA_magic_desc:1 "Angkatan Laut meyakini mampu memecahkan sandi enkripsi militer Jepang, yang memungkinkan kita membaca seluruh lalu lintas transmisi pesan mereka, termasuk pergerakan armada tempur laut."
 USA_neutrality_act:1 "Neutrality Undang-Undang"
 USA_neutrality_act_desc:1 "Perang di Eropa tampak kian tak terhindarkan. Pada Perang Dunia Pertama, korporasi Amerika meraup keuntungan besar dari penjualan senjata ke Sekutu. Kali ini, tidak boleh ada pihak yang mengambil laba perang secara licik."
 USA_lend_lease_act_neutrality_tt:0 "\n\nPassing the Neutrality Undang-Undang will §Rdrastically increase§! the requirements to pass the Lend Lease Undang-Undang"
 USA_lend_lease_act:1 "Lend Lease Undang-Undang"
 USA_lend_lease_act_desc:1 "Negara-negara demokrasi dunia sedang digempur. Jika mereka tumbang, perang akan segera menghampiri pantai kita. Kita harus menyokong mereka dengan segenap daya, bahkan jika mereka belum sanggup membayar persenjataan itu seketika."
 USA_reestablish_the_gold_standard:1 "Reestablish the Gold Standard"
 USA_reestablish_the_gold_standard_desc:1 "Tanpa standar emas, uang hanyalah secarik kertas tak bernilai nyata, sementara inflasi liar menggerus tabungan rakyat dan menurunkan nilai kerja keras mereka. Kita harus meninggalkan kebijakan fiskal yang sembrono ini."
 USA_adjusted_compensation_act:1 "Adjusted Compensation Undang-Undang"
 USA_adjusted_compensation_act_desc:1 "Para veteran Perang Dunia Pertama telah dijanjikan uang pensiun yang layak. Banyak di antara mereka hidup terlunta-lunta diterpa depresi ekonomi. Kita harus menolong para pejuang yang telah membela Republik di masa genting."
 USA_labour_management_relations_act:1 "Labor-Management Relations Undang-Undang"
 USA_labour_management_relations_act_desc:1 "Dunia usaha di seantero Amerika terancam oleh berbagai aksi serikat buruh—pemogokan, unjuk rasa, dan tuntutan upah berlebihan. Kita tidak boleh membiarkan anarki ini terus berlanjut."
 USA_protectionist_tariffs:1 "Protectionist Tariffs"
 USA_protectionist_tariffs_desc:1 "Perdagangan bebas telah membuka pasar kita bagi pesaing asing yang justru memproteksi pasarnya sendiri. Industri kita menghadapi persaingan timpang di tanah air sendiri; ketidakadilan ini harus segera dihentikan."
 USA_income_tax_reform:2 "Income Tax Reform"
 USA_income_tax_reform_desc:1 "Pajak penghasilan menguras isi dompet rakyat Amerika—uang yang seharusnya dapat mereka belanjakan untuk menggerakkan ekonomi lokal. Kita akan mengembalikan kedaulatan finansial ke tangan rakyat."
 USA_institute_of_american_sciences:1 "American Institute of Sciences"
 USA_institute_of_american_sciences_desc:1 "Universitas dan laboratorium riset di seluruh negeri selama ini berjalan sendiri-sendiri tanpa arah terpadu. Kita akan mendirikan lembaga baru untuk mengoordinasikan seluruh karya ilmuwan kelas dunia kita."
 USA_america_first:0 "America First"
 USA_america_first_desc:2 "Sebagian kalangan mendesak kita menghamburkan kekayaan dan darah pemuda kita dalam perang di negeri asing. Kita tidak boleh terhasut oleh para pemburu perang; semboyan kita tegas: Utamakan Amerika—Bangsa Lain Nomor Dua."
 USA_extend_the_chinese_exclusion_acts:1 "Extend the Chinese Exclusion Undang-Undangs"
 USA_extend_the_chinese_exclusion_acts_desc:2 "Dengan Tiongkok yang porak-poranda akibat perang, kita harus memperpanjang pembatasan imigrasi agar tanah air kita tidak dibanjiri gelombang pengungsi tanpa kendali."
 USA_empower_the_huac:1 "Empower the Huac"
 USA_empower_the_huac_desc:1 "Komite Aktivitas Anti-Amerika (HUAC) memegang fungsi krusial dalam menjaga kemurnian tatanan negara. Kita tidak boleh membiarkan anasir pembangkang menyusup dan merongrong proses politik nasional."
 USA_voter_registration_act:1 "Voter Registration Undang-Undang"
 USA_voter_registration_act_desc:1 "Pemilu adalah pilar terpenting dalam negara. Sangat tidak masuk akal membiarkan pemilu tanpa verifikasi pemilih yang ketat, atau barangkali mereka yang menolaknya berniat curang memanipulasi kotak suara."
 USA_ally_with_the_silver_shirts:1 "Ally With the Silver Shirts"
 USA_ally_with_the_silver_shirts_desc:1 "Demi mengembalikan kejayaan bangsa dan mewujudkan takdir kepemimpinan kita, penataan ulang tatanan politik secara radikal mutlak diperlukan. Milisi Kemeja Perak (Silver Shirts) akan membantu mewujudkannya."
 USA_national_prosperity_program:1 "National Prosperity Program"
 USA_national_prosperity_program_desc:1 "Kunci pemulihan kilat dan kemakmuran abadi tidak terletak pada pasar bebas tak terkendali, melainkan pada program strategis yang memadukan sektor swasta dan badan usaha negara."
 USA_privatize_the_TVA:1 "Privatize the TVA"
 USA_privatize_the_TVA_desc:1 "Otoritas Lembah Tennessee (TVA) telah memonopoli proyek konstruksi dan mematikan persaingan usaha swasta. Bukan urusan negara untuk mengurusi sektor yang terbukti dikelola lebih baik oleh swasta."
 USA_de_regulate_the_banking_sector:1 "De-Regulate the Banking Sector"
 USA_de_regulate_the_banking_sector_desc:1 "Menanggapi siklus koreksi pasar wajar, pemerintahan sebelumnya memberlakukan kekangan berlebihan pada sektor perbankan yang terbukti mematikan likuiditas. Deregulasi perbankan harus segera diterapkan."
 USA_national_employment_strategy:1 "National Employment Strategy"
 USA_national_employment_strategy_desc:1 "Pengangguran terjadi karena ketidakcocokan keterampilan dengan lapangan kerja. Kita akan meluncurkan strategi ketenagakerjaan nasional baru untuk menjamin industri memperoleh tenaga kerja tepat guna."
 USA_invite_foreign_support:1 "Invite Foreign Support"
 USA_invite_foreign_support_desc:1 "Menerima laporan mengkhawatirkan mengenai keraguan loyalitas sebagian militer dan pemerintah negara bagian, kita mungkin terpaksa mencari dukungan politik dan perkuatan dari luar negeri."
 USA_send_lindbergh_to_germany:1 "Send Lindbergh To Germany"
 USA_send_lindbergh_to_germany_desc:1 "Penerbang kenamaan Charles Lindbergh bersedia melawat ke Jerman guna mempelajari kebangkitan industri militer mereka pascaperang. Laporannya akan memberi kita wawasan berharga bagi pertahanan."
 USA_work_with_the_bund:1 "Work With the Bund"
 USA_work_with_the_bund_desc:1 "Organisasi German-American Bund menawarkan bantuan untuk menyosialisasikan visi kita kepada jutaan warga keturunan Jerman, mengamankan basis massa yang solid di negara-negara bagian kunci."
 USA_work_with_the_bund_tt:0 "Ensures that the following states remain with the government in the event of a civil war: Ohio, Missouri, Wisconsin, Illinois, Indiana and Michigan"
 USA_recruit_the_free_corps:1 "Recruit the Free Corps"
 USA_recruit_the_free_corps_desc:1 "Seiring merosotnya kepercayaan pada komando militer reguler, kita harus merangkul para veteran perang untuk membentuk korps sukarelawan tangguh yang setia membela rezim kita saat krisis melanda."
 USA_honor_the_confederacy:1 "Honor the Confederacy"
 USA_honor_the_confederacy_desc:1 "Terlalu lama sejarah Perang Saudara hanya dinarasikan dari kacamata kaum Utara semata. Sudah saatnya warisan pengorbanan dan kepahlawanan kaum Konfederasi Selatan turut dihormati secara adil."
 USA_war_powers_act:1 "War Powers Undang-Undang"
 USA_war_powers_act_desc:1 "Di era perang kilat berteknologi bom udara dan kapal selam mematikan, mengekang Presiden harus menunggu izin Kongres sebelum bertindak sama saja mengundang malapetaka. Wewenang perang darurat harus diberikan."
 USA_seize_cuba:1 "Seize Cuba"
 USA_seize_cuba_desc:1 "Tepat di depan pintu gerbang pantai kita terbentang kapal induk tak tenggelam yang dapat dijadikan pangkalan penyerbu asing. Kita tidak boleh membiarkan Kuba jatuh ke tangan musuh!"
 USA_eliminate_the_southern_threat:1 "Eliminate the Southern Threat"
 USA_eliminate_the_southern_threat_desc:1 "Meksiko dilanda kekacauan politik berkepanjangan. Tak peduli apakah anarki itu merembes ke perbatasan atau ada rezim yang menyerang ke utara, kita harus melumpuhkan potensi ancaman di sayap selatan kita."
 USA_the_canadian_corridor:1 "The Canadian Corridor"
 USA_the_canadian_corridor_desc:1 "Jalur darat wilayah Kanada memisahkan Alaska dari daratan utama Amerika, membuat pertahanannya bergantung pada itikad baik Ottawa. Mengingat ancaman yang ada, ketergantungan ini tidak boleh dibiarkan."
 USA_north_american_dominion:1 "North American Dominion"
 USA_north_american_dominion_desc:1 "Setelah perbatasan kita aman, kita harus meluaskan jangkauan untuk menangkis segala ancaman di benua Amerika Utara. Kita tidak akan mentoleransi adanya rezim pembangkang di kawasan ini."
 USA_strategic_interests:1 "Strategic Interests"
 USA_strategic_interests_desc:1 "Dunia saling terhubung; ancaman di satu belahan bumi dapat cepat menjalar menjadi petaka global. Kita harus membangun jaringan pangkalan militer di seluruh dunia demi merespons krisis dengan kilat."
 USA_protect_south_america:1 "Protect South America"
 USA_protect_south_america_desc:1 "Benua Amerika Selatan telah sekian lama menjadi arena permainan imperium kolonial. Sudah saatnya kita mengambil tanggung jawab untuk melindungi dan membimbing bangsa-bangsa tersebut menuju masa depan yang aman."
 USA_pacific_pacification:1 "Pacific Pacification"
 USA_pacific_pacification_desc:1 "Australia dan Selandia Baru terletak terlalu jauh untuk dapat dilindungi oleh Inggris. Kita tidak boleh membiarkan wilayah itu jatuh ke tangan kekuatan yang memusuhi [USA.GetNameDef]."
 USA_secure_asia:1 "Secure Asia"
 USA_secure_asia_desc:1 "Negara-negara kolonial Eropa tampak tak berdaya mempertahankan jajahannya di Asia. Kita harus mengambil alih tanggung jawab ini agar kawasan Asia tidak dijadikan batu loncatan bagi agresi musuh."
 USA_global_hegemony:1 "Global Hegemony"
 USA_global_hegemony_desc:1 "Kita berada di ambang hegemoni global yang memungkinkan kita mencegah pecahnya konflik dunia semata-mata lewat wibawa kita, memastikan Negara-negara Besar lain tunduk mengakui kedudukan adidaya kita."
 USA_war_plans_division:1 "War Rencanas Division"
 USA_war_plans_division_desc:1 "Kendati kita mendambakan perdamaian, kita wajib bersiap siaga menghadapi peperangan."
 USA_intervention_in_the_americas:1 "Intervention in the Americas"
 USA_intervention_in_the_americas_desc:1 "Tugas utama kita adalah memastikan kesiapan militer menghadapi segala kemungkinan darurat di belahan bumi kita sendiri."
 USA_war_plan_green:1 "Rencana Perang Green"
 USA_war_plan_green_desc:1 "Menyusul instabilitas tiada henti pascarevolusi Meksiko, kita harus bersiap melancarkan intervensi militer secara tegas dan cepat."
 USA_war_plan_crimson:1 "Rencana Perang Crimson"
 USA_war_plan_crimson_desc:1 "Meskipun Kanada saat ini menjadi tetangga yang bersahabat, keadaan politik bisa berubah sewaktu-waktu."
 USA_war_plan_gray:1 "Rencana Perang Gray"
 USA_war_plan_gray_desc:1 "Sejarah membuktikan negara-negara di Karibia sangat rentan bergolak. Kita harus siap bergerak kilat mengamankan kepentingan Amerika bila kekacauan merebak di sana."
 USA_hemisphere_defense:1 "Hemisphere Pertahanan"
 USA_hemisphere_defense_desc:1 "Terlepas dari keterlibatan di belahan dunia lain, kita pertama-tama harus menjaga dan mengamankan kawasan sekitar kita sendiri."
 USA_intervention_in_europe:1 "Intervention in Europe"
 USA_intervention_in_europe_desc:1 "Belum genap dua dekade sejak Perang Dunia Pertama usai, bangsa-bangsa Eropa kembali bersiap saling gempur. Kita harus bersiap jika situasi menuntut intervensi kilat pasukan kita."
 USA_war_plan_gold:1 "Rencana Perang Gold"
 USA_war_plan_gold_desc:1 "Prancis dirundung perpecahan internal dan radikalisasi politik, namun tetap menjadi salah satu kekuatan militer terbesar Eropa; kombinasi yang mengkhawatirkan bagi stabilitas dunia."
 USA_war_plan_silver:0 "Rencana Perang Silver"
 USA_war_plan_silver_desc:0 "Italia secara terbuka menyatakan ambisinya menguasai Laut Mediterania. Jika ambisi kekaisaran mereka berbenturan dengan kepentingan kita, kita harus siap bertindak."
 USA_anti_bolshevist_aid:2 "Anti [GetSovietThreatNameAlt] Aid"
 USA_anti_bolshevist_aid_desc:2 "Setiap senapan, peluru, selongsong artileri, dan sepatu bot yang kita salurkan kepada pihak yang memerangi Ancaman [GetSovietThreatNameAlt] pada akhirnya akan membentengi pertahanan kita sendiri."
 USA_war_plan_ruby:1 "Rencana Perang Ruby"
 USA_war_plan_ruby_desc:1 "India dihuni oleh ratusan juta jiwa yang kekuatannya harus siap kita hadapi seandainya kita terlibat dalam konflik bersenjata."
 USA_war_plan_scarlet_garnet:1 "Rencana Perang Scarlet Garnet"
 USA_war_plan_scarlet_garnet_desc:1 "Di Pasifik, Australia dan Selandia Baru niscaya akan membela negeri induk mereka. Setiap rencana operasi terhadap Inggris wajib memperhitungkan perlawanan wilayah koloninya."
 USA_intervention_in_asia:1 "Intervention In Asia"
 USA_intervention_in_asia_desc:1 "Kerap kali tertutupi oleh gejolak di Eropa, kawasan Asia memiliki titik-titik konflik membara yang memaksa kita bersiap melancarkan intervensi."
 USA_war_plan_yellow:1 "Rencana Perang Yellow"
 USA_war_plan_yellow_desc:1 "Tiongkok telah terbelenggu perang saudara selama lebih dari satu generasi. Situasi ini dapat memburuk sewaktu-waktu hingga menuntut campur tangan militer kita."
 USA_war_department:1 "War Department"
 USA_war_department_desc:1 "Di era perang berbasis industri, kita harus memiliki birokrasi pertahanan yang mampu mendayagunakan segenap sumber daya bangsa kita hingga potensi puncaknya."
 USA_selective_training_act:1 "Selective Training Undang-Undang"
 USA_selective_training_act_desc:1 "Amerika Serikat secara historis lambat memberlakukan wajib militer, bahkan di masa perang. Kita tidak lagi mampu membiarkan kelonggaran seperti ini berlanjut."
 USA_louisiana_maneuvers:1 "Louisiana Maneuvers"
 USA_louisiana_maneuvers_desc:1 "Keterbatasan anggaran sempat memaksa kita hanya mengamati perkembangan doktrin militer dari kejauhan. Kini saatnya menguji teori tempur modern kita lewat latihan manuver lapangan nyata."
 USA_airborne_divisions:1 "Udaraborne Divisions"
 USA_airborne_divisions_desc:1 "Peningkatan jangkauan dan muatan pesawat membuka peluang revolusioner: menerjunkan satu divisi pasukan lintas udara ke belakang garis pertahanan musuh untuk memporak-porandakan mereka."
 USA_army_of_the_united_states:1 "Angkatan Darat of the United States"
 USA_army_of_the_united_states_desc:1 "Untuk pertempuran akbar di masa depan, AD Amerika Serikat terlalu ramping. Kita harus membentuk struktur organisasi militer baru guna memimpin perluasan personel secara masif."
 USA_womens_armed_service_integration_act:1 "Women's Armed Service Integration Undang-Undang"
 USA_womens_armed_service_integration_act_desc:1 "Kita tidak boleh menolak siapa pun yang bertekad mengabdi. Setiap perempuan yang berdinas berseragam akan membebaskan seorang pria untuk maju bertempur di garis depan."
 USA_tank_experiments:1 "Tank Experiments"
 USA_tank_experiments_desc:1 "Tank adalah instrumen mutlak dalam medan tempur modern. Kita harus menemukan formula taktis terbaik untuk mendayagunakan kekuatan lapis baja ini."
 USA_tank_destroyer_doctrine:1 "Tank Destroyer Doctrine"
 USA_tank_destroyer_doctrine_desc:1 "Doktrin pemusnah tank yang dirumuskan perwira artileri: senjata terampuh membendung terobosan lapis baja musuh adalah kendaraan lincah berpelindung ringan namun bersenjatakan meriam berat."
 USA_main_battle_tanks:1 "Main Battle Tanks"
 USA_main_battle_tanks_desc:1 "Pengalaman di medan tempur membuktikan bahwa tank harus mampu mengemban berbagai peran serbaguna, dari menyokong infanteri hingga duel antartank, sehingga menyederhanakan rantai perakitan kita."
 USA_armored_infantry:1 "Armored Infantry"
 USA_armored_infantry_desc:1 "Tank saja tak mampu memenangkan pertempuran; infanteri mutlak dibutuhkan untuk menduduki wilayah. Membekali mereka dengan kendaraan lapis baja membuat mereka mampu mengimbangi laju tank dan selamat dari tembakan musuh."
 USA_build_the_pentagon:1 "Build the Pentagon"
 USA_build_the_pentagon_desc:1 "Ekspansi dahsyat angkatan bersenjata kita membutuhkan sebuah markas komando global terpadu yang megah untuk mengendalikannya."
 USA_department_of_defense:1 "Department of Pertahanan"
 USA_department_of_defense_desc:1 "Mengubah nama Departemen Perang menjadi Departemen Pertahanan menegaskan komitmen bahwa kita harus senantiasa waspada dan siaga menjaga kedaulatan tanah air setiap saat."
 USA_escort_fighters:1 "Escort Fighters"
 USA_escort_fighters_desc:1 "Meskipun pengebom dapat menerobos pertahanan lawan, awaknya takkan bertahan lama tanpa kawalan ketat dari pesawat tempur pengawal bersahabat."
 USA_us_army_airforce:1 "US Angkatan Darat Udara Force"
 USA_us_army_airforce_desc:1 "Tujuan utama kekuatan udara militer adalah memfasilitasi pasukan darat merebut dan mempertahankan medan tempur. Segala peran lainnya hanyalah pendukung."
 USA_us_air_force:1 "US Udara Force"
 USA_us_air_force_desc:1 "Tujuan utama kekuatan dirgantara adalah memenangkan perang secara mandiri: pengeboman strategis berdaya hancur tinggi akan meremukkan kehendak tempur musuh dan melumpuhkan kapasitas industrinya."
 USA_two_ocean_navy_act:1 "Undang-Undang Angkatan Laut Dua Samudera"
 USA_two_ocean_navy_act_desc:1 "Membangun armada tempur laut berkekuatan ganda yang mampu mendominasi Samudera Atlantik dan Pasifik secara bersamaan."
 USA_maritime_commission:1 "Maritime Commission"
 USA_maritime_commission_desc:1 "Sementara orang awam terpukau oleh kapal perang, para ahli memahami bahwa kapal kargo bersahajalah yang memenangkan perang. Kita membentuk komisi khusus untuk mengoordinasikan perakitan kapal dagang secara masif."
 USA_advanced_basing:1 "Advanced Basing"
 USA_advanced_basing_desc:1 "Semakin jauh kita dapat menahan armada musuh dari pantai tanah air kita, semakin terjamin keselamatan bangsa kita."
 USA_naval_radar:1 "Naval Radar"
 USA_naval_radar_desc:1 "Radar angkatan laut melenyapkan tirai kegelapan malam bagi musuh dan memungkinkan kita mendeteksi armada mereka di tengah cuaca paling buruk sekalipun."
 USA_fleet_submarines:1 "Fleet Submarines"
 USA_fleet_submarines_desc:1 "Lawan-lawan laut potensial kita sangat bergantung pada jalur niaga luar negeri yang rentan serangan bawah laut. Kita membutuhkan kapal selam penjelajah jarak jauh yang mampu beroperasi langsung di perairan musuh."
 USA_unrestricted_submarine_warfare:1 "Unrestricted Submarine Warfare"
 USA_unrestricted_submarine_warfare_desc:1 "Sejarah membuktikan perjanjian yang membatasi perang kapal selam tak lebih dari secarik kertas tak bermakna. Kita tidak boleh merasa terikat oleh aturan yang pasti akan dilanggar oleh musuh-musuh kita."
 can_degaussing_tech:0 "Gain the Degaussing technology"
 USA_great_depression_cooldown:0 "New Legislation is still being drafted"
 USA_great_depression_cooldown_tt:0 "After this law is passed, it will take §Y230 days§! until further New Deal legislation is drafted and ready to be signed.\n\n"
 USA_limited_intervention_tt:0 "\n\nPassing this law will make it §Rsignificantly harder§! to mobilize your economy.\n\n"
 britain_enforced_our_loyalty:0 "Britain enforced our loyalty."
 sirte_oil_developed:0 "Sirte Oil Fields Developed"
 benghazi_oil_developed:0 "Benghazi Oil Fields Developed"
 TREE_FILTER_TOGGLE:0 "§GClick§! to toggle showing of more filters"
 confirm_cancel_national_focus:0 "Cancel National Focus"
 confirm_cancel_national_focus_progress_loss_singular:0 "You will lose §R$LOST_DAYS$§! day of progress."
 confirm_cancel_national_focus_progress_loss_plural:0 "You will lose §R$LOST_DAYS$§! days of progress."
 confirm_cancel_national_focus_desc:0 "Apakah Anda yakin ingin membatalkan fokus nasional §H$FOCUS_NAME$§!?"
 SOV_THE_USSR_NAME_COMMUNIST:0 "the USSR"
 SOV_THE_USSR_NAME_EXILES:0 "Russia"
 SOV_RUSSIANS_DEMONYM_SOVIETS:0 "Soviets"
 SOV_RUSSIANS_DEMONYM_RUSSIANS:0 "Russians"
 SWI_add_forts_bordering:0 "[ROOT.GetNameDef] gains §H2 Land Forts§! in every neighboring province.\n\n"
 ROM_white_squadron_focus:0 "The White Squadron"
 ROM_white_squadron_focus_desc:0 "Skuadron Putih, yang digagas oleh Marina Ştirbei—seorang pilot bangsawan berbakat—adalah satuan ambulans udara yang seluruhnya diterbangkan oleh kaum perempuan. Harapan akan adanya evakuasi medis cepat di garis depan akan membangkitkan moral tempur prajurit kita."
 HUN_protect_czechoslovakia_tt: "\nThey will be more likely to submit if:\n- §HWorld Tension§! is high\n- They are not in a §Hfaction§!\n- They have a §Hhigh opinion§! of us\n- They have a §Hnon-aggression pact§! with us\n- Their §Hmilitary is weaker§! than ours"
 HUN_unify_with_austria_tt: "\nThey will be more likely to submit if:\n- They have less than §H50% War Support§!\n- They are not in a §Hfaction§!\n- They have a §Hhigh opinion§! of us\n- Their §Hmilitary is weaker§! than ours"
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§! will be §Rvery unlikely§! to accede to our demands unless they are in a desperate situation.\n\n"
 CAN_offer_concessions_for_labrador_tooltip:1 "§H[ENG.GetName]§! are more likely to consider this request than an outright demand. They will be §Gmore likely§! to accede to our request if they are:\n- At war\n- Have a high opinion of us\n- Have greater than §H25%§! Surrender Progress\n- Have the same ideology as us\n\nIf they accept:\n"
 tfv_canada.63.t:0 "[CAN.GetNameDef] Offers Concessions for Newfoundland"
 tfv_canada.63.d:0 "The new government of the [CAN.GetAdjective] state offer us an intriguing proposal for the concession of our territories in Newfoundland. While it is true that the laws of our nation acknowledge an indivisible state, our advisors urge us to consider the possibility of a new front that may distract from the situation in Europe."
 tfv_canada.63.a:0 "Indeed."
 tfv_canada.63.b:0 "Never!"
 CAN_offer_concessions_for_labrador_and_newfoundland:0 "Concessions for Labrador and Newfoundland"
 CAN_offer_concessions_for_labrador_and_newfoundland_desc:0 "Inggris mengklaim kedaulatan atas wilayah yang berdampingan dengan jantung negeri kita. Meski kita tidak menginginkan perang dengan lawan yang lebih kuat, mereka mungkin bersedia mempertimbangkan kompromi wilayah jika situasi mereka mendesak."
 AST_central_bureau:0 "Coordinate Central Bureau"
 AST_central_bureau_desc:0 "Biro Sinyal & Intelijen yang terkoordinasi dengan Amerika Serikat menjanjikan keunggulan strategis dalam menghadapi badai perang. Keahlian kita dalam bidang ini harus diakui secara penuh."
 HUN_a_new_flagship:0 "Pride of the Fleet"
 HUN_a_new_flagship_desc:0 "Sejarah panjang tradisi maritim kita sarat akan cobaan, kepedihan, dan pengkhianatan. Demi memulihkan kebanggaan warisan leluhur kita, para laksamana mengusulkan kapal bendera baru untuk menginspirasi seluruh bangsa."
 HUN_dockyards:0 "Renew the Shipping Industry"
 HUN_dockyards_desc:0 "Dengan tekad bulat memulihkan batas-batas wilayah bersejarah kita, kita harus mulai membangun armada Mediterania untuk menandingi kejayaan masa lampau."
 if_no_depression_get_stuff_TT:0 "\nIf the §H$CAN_great_depression_1$§! has been removed, a different bonus will be applied.\n\n"
 BEL_luxembourg_war_goal: "Luxembourg's Integration"
 BEL_luxembourg_war_goal_desc: "Luksemburg memiliki banyak kesamaan dengan Belgia, baik bahasa, budaya, maupun letak geografis. Wajar jika kedua bangsa ini dipersatukan!"
