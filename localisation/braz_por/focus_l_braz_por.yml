 usa_focus:0 "Fokus Nasional Amerika Serikat"
 USA_issue_war_bonds:0 "Terbitkan Obligasi Perang"
 USA_issue_war_bonds_desc:0 "Dengan obligasi perang, kita mengandalkan patriotisme rakyat untuk membiayai pengeluaran militer raksasa tanpa memicu inflasi."
 USA_office_of_strategic_services:0 "Kantor Layanan Strategis (OSS)"
 USA_office_of_strategic_services_desc:0 "Membentuk badan intelijen terpadu OSS tidak hanya membantu upaya perang, namun juga memungkinkan operasi sabotase dan pengumpulan data intelijen di wilayah pendudukan musuh."
 USA_wartime_industry:0 "Industri Masa Perang"
 USA_wartime_industry_desc:0 "Kita memiliki industri sipil terkuat di dunia, namun kita harus mengonversinya secara terencana untuk memproduksi tank, senjata, dan amunisi dalam skala massal."
 USA_first_special_service_force:0 "Pasukan Layanan Khusus Pertama"
 USA_first_special_service_force_desc:0 "Operasi di belakang garis musuh di medan yang keras menuntut pasukan komando elit gabungan AS-Kanada: Devil's Brigade."
 USA_rubber_reserve_company:0 "Perusahaan Cadangan Karet"
 USA_rubber_reserve_company_desc:0 "Dengan pecahnya perang di Asia Pasifik, kita kehilangan sebagian besar sumber impor karet alam. Kita harus menimbun cadangan dan membiayai pabrik karet sintetis."
 USA_manifest_destiny:0 "Takdir Nyata (Manifest Destiny)"
 USA_manifest_destiny_desc:0 "Keadaan khusus seputar pendirian bangsa kita memberi kita tanggung jawab moral untuk menyebarkan kebebasan dan membasmi tirani di seluruh benua."
 USA_manifest_destiny_tt:0 "§YMemberikan tujuan perang terhadap semua negara Fasis dan Komunis.§!\n"
 USA_scientist_haven:0 "Suaka Ilmuwan"
 USA_scientist_haven_desc:0 "Sebagai benteng kebebasan dunia, kita dapat menarik para ilmuwan dan peraih Nobel Eropa yang melarikan diri dari penindasan fasis."
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "Works Progress Administration (WPA) akan mempekerjakan jutaan warga Amerika yang menganggur untuk membangun jalan raya, jembatan, bandara, dan fasilitas publik di seluruh negeri."
 USA_committee_on_technocracy:0 "Komite Teknokrat"
 USA_committee_on_technocracy_desc:0 "Kita harus melibatkan para insinyur dan ilmuwan terkemuka dalam perencanaan ekonomi dan alokasi sumber daya material strategis negara."
 USA_support_rock_island:0 "Dukung Rock Island"
 USA_support_rock_island_desc:0 "Mendukung pabrik persenjataan Rock Island Arsenal adalah kunci untuk mempercepat perancangan dan standarisasi senjata artileri dan tank bagi prajurit kita."
 USA_military_construction:0 "Konstruksi Militer"
 USA_military_construction_desc:0 "Dengan negara-negara agresor yang mengancam perdamaian dunia, proyek pekerjaan umum kita harus diarahkan untuk membangun barak militer, pangkalan logistik, dan lapangan udara."
 USA_USACE_projects:0 "Proyek USACE"
 USA_USACE_projects_desc:0 "Korps Zeni Angkatan Darat AS (USACE) akan dikerahkan untuk membangun bendungan hidroelektrik raksasa, kanal navigasi, dan benteng pertahanan pesisir."
 USA_arsenal_of_democracy:0 "Gudang Senjata Demokrasi"
 USA_arsenal_of_democracy_desc:0 "Terlepas dari apakah kita memilih campur tangan militer langsung atau tidak, industri manufaktur Amerika harus menjadi gudang senjata utama bagi bangsa-bangsa merdeka yang melawan tirani."
 USA_liberty_ships:0 "Kapal Liberty"
 USA_liberty_ships_desc:0 "Produksi massal kapal kargo terstandarisasi yang dibangun dengan metode pengelasan cepat akan memastikan kita dapat mengirimkan jutaan ton pasokan melintasi samudra."
 USA_war_propaganda:0 "Propaganda Perang"
 USA_war_propaganda_desc:0 "Rakyat kita enggan mengirim anak-anak mereka berperang di luar negeri, namun kita harus menyadarkan mereka akan bahaya nyata yang mengancam tanah air."
 USA_war_plan_black:0 "Rencana Perang Hitam"
 USA_war_plan_black_desc:0 "Jelas terlihat bahwa fasisme Jerman mengancam tatanan dunia. Kita harus menyusun rencana operasi militer untuk menghadapi kemungkinan perang dengan Reich."
 USA_embargo_germany:0 "Embargo Jerman"
 USA_embargo_germany_desc:0 "Jerman bergantung pada bahan mentah impor. Menutup pasar dan pasokan Amerika akan melumpuhkan mesin perang mereka."
 USA_destroyers_for_bases:0 "Kapal Perusak Ditukar Pangkalan"
 USA_destroyers_for_bases_desc:0 "Inggris sangat membutuhkan kapal pengawal untuk melawan kapal selam, dan kita membutuhkan pangkalan strategis di Karibia dan Newfoundland untuk melindungi pantai kita."
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!:\n"
 USA_war_plan_white:0 "Rencana Perang Putih"
 USA_war_plan_white_desc:1 "Ancaman [GetSovietThreatName] tidak boleh dibiarkan meluas tanpa hambatan. Kita harus mempersiapkan rencana kontinjensi untuk melawan ekspansi Soviet."
 USA_embargo_USSR:0 "Embargo Uni Soviet"
 USA_embargo_USSR_desc:0 "Menghentikan perdagangan dengan Uni Soviet akan menahan penyebaran komunisme internasional."
 USA_war_plan_red:0 "Rencana Perang Merah"
 USA_war_plan_red_desc:0 "Jika terjadi perselisihan tak terduga dengan Imperium Inggris, kita harus memiliki rencana operasi untuk mengamankan perbatasan utara dan rute Atlantik."
 USA_embargo_the_empire:0 "Embargo Imperium Inggris"
 USA_embargo_the_empire_desc:0 "Meskipun telah lama bersahabat, jika perselisihan terjadi kita dapat menekan ekonomi imperium mereka melalui pembatasan perdagangan."
 USA_war_plan_orange:0 "Rencana Perang Oranye"
 USA_war_plan_orange_desc:0 "Tidak ada ancaman yang lebih nyata di Pasifik selain ambisi imperialistik Jepang. Kita harus bersiap menghadapi kampanye lompat pulau melintasi samudra."
 USA_unlock_contain_japan_tt: "Imbalan yang saat ini tidak aktif yang akan diberikan jika §Y[JAP.GetNameDef]§! melancarkan agresi."
 USA_embargo_japan:0 "Embargo Jepang"
 USA_embargo_japan_desc:0 "Kita harus menunjukkan kepada Tokyo bahwa agresi mereka di Asia tidak akan ditoleransi atau dibantu oleh pasokan minyak dan besi tua dari Amerika!"
 USA_prepare_intervention:0 "Siapkan Intervensi"
 USA_prepare_intervention_desc:0 "Melalui langkah diplomasi dan perdagangan yang terukur, posisi kita di panggung internasional harus dipersiapkan untuk keterlibatan aktif saat krisis pecah."
 USA_extra_tech_team:0 "Tim Riset Tambahan"
 USA_manhattan_project:0 "Proyek Manhattan"
 USA_manhattan_project_desc:0 "Kita harus mengumpulkan para ilmuwan paling cemerlang di dunia di fasilitas rahasia untuk merancang senjata fisi nuklir pertama sebelum musuh kita berhasil menemukannya."
 USA_unholy_alliance:0 "Aliansi Tak Suci"
 USA_unholy_alliance_desc:0 "Terkadang dalam geopolitik kita harus memilih musuh yang lebih kecil untuk menghadapi bahaya yang lebih mematikan."
 USA_unholy_alliance_tt:1 "Meningkatkan opini dan hubungan dagang dengan [SOV.GetNameDef] atau Jerman jika kondisi terpenuhi."
 USA_limited_intervention:0 "Intervensi Terbatas"
 USA_limited_intervention_desc:0 "Dibutuhkan agresi luar biasa untuk menyeret kita ke perang skala penuh, namun kita dapat mulai memberikan bantuan material dan pinjaman kepada para sekutu."
 USA_the_giant_wakes:0 "Sang Raksasa Terbangun"
 USA_the_giant_wakes_desc:0 "Bangsa-bangsa merdeka berpaling kepada kita. Raksasa industri Amerika akhirnya bangkit dari tidur panjang isolasionismenya!"
 USA_pearl_harbor_gambit:0 "Manuver Pearl Harbor"
 USA_pearl_harbor_gambit_desc:0 "Menempatkan armada di Pearl Harbor adalah umpan berbahaya bagi Jepang. Jika mereka menyerang, seluruh rakyat Amerika akan bersatu dalam kemarahan yang membara."
 USA_pearl_harbor_gambit_tt:0 "§YSelama fokus ini berjalan, Jepang akan memiliki kesempatan untuk melancarkan serangan kejutan ke Pearl Harbor.§!\n"
 USA_cancel_pearl_harbor_gambit:0 "Batalkan Manuver Pearl Harbor"
 USA_cancel_pearl_harbor_gambit_desc:0 "Menempatkan armada di perairan Hawaii terlalu membahayakan nyawa para pelaut kita. Lebih baik menarik mereka ke pangkalan pantai barat yang aman."
 USA_air_war_plans_division:0 "Divisi Rencana Perang Udara (AWPD)"
 USA_air_war_plans_division_desc:0 "Untuk menetapkan prioritas yang tepat dalam riset penerbangan dan produksi pesawat, kita harus menyusun doktrin strategis yang komprehensif untuk melumpuhkan kapasitas industri musuh."
 USA_air_support:0 "Dukungan Udara"
 USA_air_support_desc:0 "Perang udara pertama-tama harus digunakan bersamaan dengan operasi pasukan darat untuk menghancurkan posisi pertahanan musuh di garis depan."
 USA_strategic_bombing:0 "Pengeboman Strategis"
 USA_strategic_bombing_desc:0 "Kapasitas untuk melancarkan pengeboman presisi di siang hari dengan pembidik bom Norden akan memungkinkan kita melumpuhkan pabrik, kilang, dan jalur rel musuh."
 USA_TAC:0 "Upaya Pesawat Pengebom Taktis"
 USA_TAC_desc:0 "Membangun pesawat pengebom bermesin ganda yang lincah akan memberi fleksibilitas taktis luar biasa bagi komandan lapangan kita."
 USA_combined_bomber_offensive:0 "Serangan Pengebom Gabungan"
 USA_combined_bomber_offensive_desc:0 "Bekerja sama erat dengan RAF, kita dapat melancarkan serangan pengeboman tanpa henti selama 24 jam ke jantung wilayah musuh: Amerika di siang hari, Inggris di malam hari."
 USA_fund_the_navy:0 "Danai Angkatan Laut"
 USA_fund_the_navy_desc:0 "Samudra adalah garis pertahanan pertama Amerika. Kita harus menyalurkan dana yang melimpah ke galangan kapal untuk memperluas armada permukaan."
 USA_bureau_of_ships:0 "Biro Kapal (Bureau of Ships)"
 USA_bureau_of_ships_desc:1 "Menggabungkan Biro Konstruksi dan Perbaikan dengan Biro Rekayasa Uap akan memangkas birokrasi dan mempercepat inovasi desain kapal perang kita."
 USA_battleship_primacy:0 "Keutamaan Kapal Tempur"
 USA_battleship_primacy_desc:0 "Dengan pembatalan perjanjian pembatasan angkatan laut oleh Jepang, kita bebas membangun kapal tempur raksasa kelas Iowa dan Montana."
 USA_advanced_mahanian_doctrine:0 "Doktrin Mahanian Lanjutan"
 USA_advanced_mahanian_doctrine_desc:0 "Pengaruh Alfred Thayer Mahan pada doktrin perang laut Amerika menegaskan bahwa pemusatan armada tempur utama adalah kunci kemenangan di samudra."
 USA_carrier_primacy:0 "Keutamaan Kapal Induk"
 USA_carrier_primacy_desc:0 "Pertempuran masa depan di Pasifik akan ditentukan oleh kekuatan udara di laut. Kita harus menempatkan kapal induk cepat kelas Essex sebagai ujung tombak armada kita."
 USA_bureau_of_aeronautics:0 "Biro Aeronautika"
 USA_bureau_of_aeronautics_desc:0 "Untuk memenuhi kebutuhan perang udara laut, BuAer akan mengoordinasikan perancangan pesawat tempur Wildcat, Hellcat, dan pengebom tukik Dauntless."
 USA_escort_effort:0 "Upaya Kapal Pengawal"
 USA_escort_effort_desc:0 "Kapal selam musuh merupakan bahaya mematikan bagi konvoi kita. Berfokus pada kapal perusak pengawal (DE) akan melindungi jalur logistik Atlantik."
 USA_convoy_tactics:0 "Taktik Konvoi"
 USA_convoy_tactics_desc:0 "Melindungi kapal dagang bukan hanya soal jumlah pengawal, namun juga integrasi radar udara dan formasi zig-zag yang disiplin."
 USA_amphibious_operations:0 "Operasi Amfibi"
 USA_amphibious_operations_desc:0 "Perang ini tidak akan dimenangkan di wilayah Amerika. Kita harus mampu mendaratkan pasukan di pantai-pantai berbenteng musuh di seberang samudra."
 USA_expand_the_USMC:0 "Perluas Korps Marinir (USMC)"
 USA_expand_the_USMC_desc:0 "Korps Marinir Amerika Serikat telah terbukti menjadi kekuatan penyerang amfibi terhebat. Kita harus melipatgandakan ukuran divisi marinir kita."
 USA_reinforce_monroe_doctrine:0 "Tegaskan Kembali Doktrin Monroe"
 USA_reinforce_monroe_doctrine_desc:0 "Berasal dari seabad lalu, Doktrin Monroe menyatakan bahwa setiap campur tangan kekuatan luar di Belahan Bumi Barat adalah ancaman langsung bagi Amerika Serikat."
 USA_carribean_sphere:0 "Lingkup Karibia"
 USA_carribean_sphere_desc:0 "Kepulauan Karibia adalah perisai pelindung Terusan Panama. Kita harus mengamankan pangkalan di seluruh kawasan ini."
 USA_central_america:0 "Amerika Tengah"
 USA_central_america_desc:0 "Sangat mustahil membiarkan kekuatan asing menancapkan pengaruhnya di dekat Terusan Panama. Kita harus mempererat hubungan dengan negara-negara Amerika Tengah."
 USA_the_neighbors:0 "Para Tetangga"
 USA_the_neighbors_desc:0 "Keamanan Kanada dan Meksiko adalah keamanan kita sendiri. Kita harus mengoordinasikan pertahanan bersama benua Amerika Utara."
 USA_south_america:0 "Amerika Selatan"
 USA_south_america_desc:0 "Imperium kolonial fasis tidak boleh dibiarkan memperluas pengaruhnya ke Amerika Selatan. Kita harus menawarkan bantuan militer dan investasi ekonomi."
 USA_pax_americana:0 "Pax Americana"
 USA_pax_americana_desc:0 "Perdamaian di benua Amerika harus dijaga oleh kekuatan dan kepemimpinan Amerika Serikat."
 USA_pax_americana_tt:0 "@USA §YAmerika Serikat§! dapat campur tangan dalam perang antaranegara di benua Amerika."
 USA_black_chamber:0 "Operasi Black Chamber"
 USA_black_chamber_complete:0 "§RDIRAHASIAKAN§!"
 USA_black_chamber_desc:0 "Kita memiliki informasi kegiatan subversif di sejumlah negara benua Amerika. Operasi sandi rahasia ini akan mengamankan stabilitas kawasan."
 USA_preemptive_intervention:0 "Intervensi Preemptif"
 USA_preemptive_intervention_desc:0 "Kita tidak bisa lagi hanya berdiam diri menyaksikan kediktatoran tetangga membangun senjata dan bersekutu dengan musuh kita."
