l_braz_por:
 WHILE_FOCUSING:0 "Saat berfokus pada hal ini, akan ada dampak berikut:\n$EFF$"
 generic_focus:0 "Fokus Nasional"
 army_effort:0 "Upaya Angkatan Darat"
 army_effort_desc:0 "Meskipun kemungkinan perang udara dan laut semakin meningkat, pertempuran darat tetap menjadi kunci dalam perang masa depan. Dengan persiapan yang matang, kita dapat menghindari terulangnya neraka parit."
 equipment_effort:0 "Upaya Perlengkapan"
 equipment_effort_desc:0 "Batas kemampuan perlengkapan yang dapat dibawa oleh infanteri terus berkembang. Kita akan berfokus memberikan prajurit kita peralatan terbaik yang tersedia."
 motorization_effort:0 "Upaya Motorisasi"
 motorization_effort_desc:0 "Mobilitas dan perlindungan sangat krusial untuk membawa infanteri masuk dan keluar dari medan tempur dengan selamat. Berfokus pada pengembangan ini akan memungkinkan kita mengambil tindakan dengan cepat."
 doctrine_effort:0 "Upaya Doktrin"
 doctrine_effort_desc:0 "Doktrin militer yang mendefinisikan pertempuran darat pada Perang Besar sudah usang. Kita harus mengerahkan pemikir terbaik kita untuk membentuk pemikiran militer masa depan."
 equipment_effort_2:0 "Upaya Perlengkapan II"
 equipment_effort_2_desc:0 "Kita akan melanjutkan upaya kita untuk memastikan infanteri dan pasukan pendukung kita dipersenjatai dengan perlengkapan terbaik di zaman kita."
 mechanization_effort:0 "Upaya Mekanisasi"
 mechanization_effort_desc:0 "Memikirkan kembali potensi infanteri bermotor, kita dapat melampaui batasan kendaraan yang dapat dibangun saat ini."
 doctrine_effort_2:0 "Upaya Doktrin II"
 doctrine_effort_2_desc:0 "Medan pertempuran telah berubah tidak hanya pada tahun-tahun antarperang, namun juga sepanjang konflik terkini. Kita harus terus mengevaluasi ulang doktrin kita untuk mencerminkan hal ini."
 equipment_effort_3:0 "Upaya Perlengkapan III"
 equipment_effort_3_desc:0 "Alih-alih meniru atau membeli perlengkapan asing, kita harus bertujuan menjadi yang terdepan di dunia dalam persenjataan infanteri."
 armor_effort:0 "Upaya Lapis Baja"
 armor_effort_desc:0 "Menerapkan apa yang telah kita pelajari dari memodernisasi infanteri mekanis, kita juga dapat menyempurnakan kendaraan lapis baja kita."
 special_forces:0 "Pasukan Khusus"
 special_forces_desc:0 "Kita membutuhkan pasukan elit; pasukan gunung dan penerjun payung harus menjadi prioritas kita."
 aviation_effort:0 "Upaya Penerbangan"
 aviation_effort_tt:0 "Slot bangunan tidak cukup untuk §YPangkalan Udara§!"
 aviation_effort_desc:0 "Kemajuan teknologi tidak ada yang lebih pesat dibandingkan dalam perang udara. Penerbangan adalah bidang yang harus dikuasai oleh setiap bangsa modern."
 fighter_focus:0 "Fokus Pesawat Tempur"
 fighter_focus_desc:0 "Pertarungan udara (dogfight) dari Perang Besar belum berakhir. Tetap unggul dalam pengembangan pesawat tempur akan memberi kita keunggulan di masa depan."
 bomber_focus:0 "Fokus Pengebom"
 bomber_focus_desc:0 "Ketika orang-orang di masa depan berbicara tentang kengerian perang masa kini, hujan api dari langit akan menjadi kisah utama. Kita akan memastikan kisah-kisah itu diceritakan oleh musuh-musuh kita."
 aviation_effort_2:0 "Upaya Penerbangan II"
 aviation_effort_2_desc:0 "Kemajuan lebih lanjut dalam penerbangan akan diperlukan untuk mengintegrasikan angkatan udara kita dengan cabang militer lainnya."
 CAS_effort:0 "Upaya CAS"
 CAS_effort_desc:0 "Tentara modern membutuhkan dukungan kendaraan tidak hanya di darat, namun juga di udara."
 rocket_effort:0 "Upaya Roket"
 rocket_effort_desc:0 "Mesin roket dan jet membuka kecepatan yang belum pernah ada sebelumnya untuk wahana tanpa awak maupun berawak. Memelopori teknologi ini akan membuat kita mampu mengejutkan musuh."
 NAV_effort:0 "Upaya NAV"
 NAV_effort_desc:0 "Sebagaimana perang laut baru berlangsung sebagian di bawah permukaan air, sebagian lagi berlangsung di udara di atas lautan."
 naval_effort:0 "Upaya Angkatan Laut"
 naval_effort_tt:0 "Slot bangunan tidak cukup untuk §YGalangan Kapal Angkatan Laut§!"
 naval_effort_desc:0 "Ekspansi angkatan laut kita harus menjadi prioritas utama. Alokasikan semua sumber daya yang tersedia untuk galangan kapal baru dan riset kapal permukaan ringan."
 GER_naval_effort2:0 "Perluas Fasilitas Galangan Kapal"
 GER_naval_effort2_desc:0 "Untuk benar-benar membangun kembali angkatan laut yang disegani, kita harus memperluas kapasitas pembuatan kapal kita secara besar-besaran."
 GER_naval_effort2_tt: "Membangun §Y2 Galangan Kapal Angkatan Laut§! di §Y2§! negara bagian pesisir yang saat ini dikendalikan oleh §Y[ROOT.GetFlag][ROOT.GetNameDef]§!"
 flexible_navy:0 "Angkatan Laut Fleksibel"
 flexible_navy_desc:0 "Menciptakan kembali perang laut dengan memperhitungkan kemajuan teknologi kapal selam akan memungkinkan kita menyerang konvoi musuh secara efisien."
 large_navy:0 "Angkatan Laut Besar"
 large_navy_desc:0 "Mengadaptasi doktrin angkatan laut kita untuk mengakomodasi kapal-kapal besar dan memastikan keselamatan konvoi perdagangan kita akan memberi banyak pelajaran tentang jenis kapal apa yang kita butuhkan."
 submarine_effort:0 "Upaya Kapal Selam"
 submarine_effort_desc:0 "Perang kapal selam adalah perkembangan angkatan laut paling menarik sejak penemuan kapal torpedo. Sangat bijaksana bagi kita untuk tidak hanya bertahan dari kapal selam, namun juga menggunakannya untuk melawan perkapalan musuh."
 cruiser_effort:0 "Upaya Penjelajah"
 cruiser_effort_desc:0 "Sebelum merambah ke penelitian kapal tempur tingkat lanjut, kapal penjelajah yang lebih kecil perlu segera diganti."
 destroyer_effort:0 "Upaya Perusak"
 destroyer_effort_desc:0 "Mempelajari desain dan penggunaan strategis kapal selam, kita juga telah belajar cara menangkal strategi tersebut. Kapal perusak akan sangat krusial untuk hal ini."
 capital_ships_effort:0 "Upaya Kapal Utama"
 capital_ships_effort_desc:0 "Bangsa dengan kapal tempur terbanyak akan menguasai samudra. Kapal tempur dan kapal induk mewakili keunggulan laut gaya lama dan baru."
 industrial_effort:0 "Upaya Industri"
 industrial_effort_desc:0 "Fokuskan seluruh upaya politik kita untuk membangun industri sipil dalam sebuah lompatan besar ke depan."
 industrial_effort_2:0 "Upaya Industri II"
 industrial_effort_2_desc:0 "Dengan tekad sekuat baja dan etos kerja tanpa henti, kita dapat memobilisasi rakyat dalam upaya industri besar lainnya."
 construction_effort:0 "Upaya Konstruksi"
 construction_effort_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Sipil§!"
 construction_effort_desc:0 "Kapasitas industri sipil tidak boleh diremehkan bahkan ketika bayang-bayang perang menyelimuti dunia."
 production_effort:0 "Upaya Persenjataan"
 production_effort_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Militer§!"
 production_effort_desc:0 "Jika Anda bisa membuat traktor, Anda bisa membuat tank! Kita tidak boleh membiarkan kapasitas produksi militer kita tertinggal."
 construction_effort_2:0 "Upaya Konstruksi II"
 construction_effort_2_desc:0 "Terus memperluas pabrik-pabrik kita akan mempercepat produksi barang untuk perdagangan dan upaya pembangunan lebih lanjut."
 production_effort_2:0 "Upaya Persenjataan II"
 production_effort_2_desc:0 "Mencoba mengadaptasi pabrik sipil untuk memproduksi perlengkapan militer terbukti tidak efisien. Kita harus berfokus menyiapkan produksi militer sekarang."
 production_effort_3:0 "Upaya Persenjataan III"
 production_effort_3_desc:0 "Upaya berkelanjutan untuk memperluas pabrik militer sangat diperlukan guna memenuhi permintaan perlengkapan baru."
 infrastructure_effort:0 "Upaya Infrastruktur"
 infrastructure_effort_desc:0 "Negara tanpa infrastruktur yang memadai tidak dapat menjalankan proyek atau pembangunan tingkat lanjut."
 infrastructure_effort_tt:0 "Slot bangunan tidak cukup untuk §YInfrastruktur§!"
 synth_oil_effort_tt:0 "Slot bangunan tidak cukup untuk §YKilang Sintetis§!"
 infrastructure_effort_2:0 "Upaya Infrastruktur II"
 infrastructure_effort_2_desc:0 "Memperluas infrastruktur kita lebih jauh akan mendukung transportasi dan komunikasi yang diperlukan untuk proyek-proyek rahasia berteknologi tinggi."
 construction_effort_3:0 "Upaya Konstruksi III"
 construction_effort_3_desc:0 "Perluasan jaringan infrastruktur kita telah meningkatkan kapasitas konstruksi secara signifikan."
 nuclear_effort:0 "Upaya Nuklir"
 nuclear_effort_desc:0 "Berdiri di ambang penemuan yang mengubah dunia, kita tidak boleh membiarkan pihak lain menyalakan api yang suatu hari nanti dapat melahap Bumi."
 extra_tech_slot:0 "Slot Riset Tambahan"
 extra_tech_slot_desc:0 "Ekspansi industri dan kemajuan terkini memungkinkan kita melakukan lebih banyak Litbang secara paralel."
 extra_tech_slot_2:0 "Slot Riset Tambahan II"
 extra_tech_slot_2_desc:0 "Industrialisasi yang cepat di negara kita telah membuka peluang baru dalam Litbang yang harus kita manfaatkan."
 technology_sharing:0 "Berbagi Teknologi"
 technology_sharing_desc:0 "Dengan berbagi kemajuan teknologi kepada sekutu kita, seluruh faksi kita akan dapat melakukan Litbang di masa perang secara lebih efisien."
 secret_weapons:0 "Senjata Rahasia"
 secret_weapons_desc:0 "Sangat menggoda untuk menghabiskan semua sumber daya ekstra demi membuat tank dan pesawat, namun rahasia memenangkan perang terletak pada bidang sains baru: elektronik, peroketan, dan riset nuklir."
 political_effort:0 "Upaya Politik"
 political_effort_desc:0 "Untuk membawa perubahan di dunia, kita harus mampu membawa perubahan di negara kita sendiri. Memperkuat posisi politik kita harus diutamakan."
 collectivist_ethos:0 "Etos Kolektivis"
 collectivist_ethos_desc:0 "Musuh kita mungkin dapat memecah belah bangsa-bangsa yang lebih lemah, namun rakyat kita akan tetap bersatu. Satu untuk semua dan semua untuk satu."
 liberty_ethos:0 "Etos Kebebasan"
 liberty_ethos_desc:0 "Di masa para fanatis ideologi berusaha membungkam jiwa manusia, kita akan menjaga kebebasan dan kemerdekaan individu."
 militarism:0 "Militerisme"
 militarism_desc:0 "Mereka yang memandang militer sebagai kejahatan yang tak terhindarkan ditakdirkan untuk ragu-ragu di hadapan perang. Kita akan menanamkan militerisme ke dalam budaya kita untuk menjadi bangsa prajurit."
 political_correctness:0 "Kelayakan Politik"
 political_correctness_desc:0 "Orang-orang yang memegang pandangan kontroversial tampak khawatir bahwa ada konspirasi luas yang menentang mereka. Ini tampaknya ide yang sangat bagus."
 neutrality_focus:0 "Fokus Netralitas"
 neutrality_focus_desc:0 "Keterlibatan dalam urusan asing di masa lalu hanya membawa penderitaan bagi rakyat kita. Kita harus memegang teguh komitmen kita terhadap netralitas bersenjata."
 interventionism_focus:0 "Fokus Intervensionisme"
 interventionism_focus_desc:0 "Mengisolasi diri dari panggung dunia bukanlah pilihan yang layak. Kita harus siap campur tangan demi membela kepentingan kita dan sekutu kita."
 military_youth:0 "Pemuda Militer"
 military_youth_desc:0 "Menanamkan nilai-nilai militer sejak usia dini akan mempersiapkan pemuda kita untuk tuntutan dinas militer."
 deterrence:0 "Pencegahan"
 deterrence_desc:0 "Untuk memastikan perdamaian, kita harus siap menghadapi perang. Dengan membuat diri kita menjadi sasaran yang terlalu berat, kita dapat mencegah potensi penyerang."
 volunteer_corps:0 "Korps Sukarelawan"
 volunteer_corps_desc:0 "Mengirim sukarelawan ke konflik luar negeri memungkinkan kita mendukung sekutu tanpa harus terlibat dalam perang skala penuh, sekaligus memberi pasukan kita pengalaman berharga."
 paramilitarism:0 "Paramiliterisme"
 paramilitarism_desc:0 "Membentuk organisasi paramiliter akan melengkapi angkatan bersenjata reguler kita dan memperkuat ketertiban internal."
 indoctrination_focus:0 "Indoktrinasi"
 indoctrination_focus_desc:0 "Dengan menyelaraskan sistem pendidikan kita dengan tujuan negara, kita dapat memupuk generasi baru yang loyal dan berbakti."
 foreign_expeditions:0 "Ekspedisi Luar Negeri"
 foreign_expeditions_desc:0 "Dengan mempersiapkan militer kita untuk operasi di luar negeri, kita dapat memproyeksikan kekuatan ke seluruh dunia."
 why_we_fight:0 "Mengapa Kita Berperang"
 why_we_fight_effect:0 "Jika kita tidak memiliki semangat §YKebijakan Luar Negeri Netral§!, kita akan dapat membentuk faksi.\n"
 why_we_fight_desc:0 "Moral rakyat kita sangat krusial. Melalui propaganda dan pendidikan, kita akan memastikan setiap warga memahami dan meyakini perjuangan kita."
 political_commissars:0 "Komisaris Politik"
 political_commissars_desc:0 "Untuk memastikan kebijakan kita dipatuhi dalam praktik militer, kita akan menempatkan pejabat yang ditunjuk secara politik ke dalam jajaran militer."
 internationalism_focus:0 "Fokus Internasionalisme"
 internationalism_focus_desc:0 "Perjuangan kita melampaui batas-batas negara. Kita harus bekerja sama dengan gerakan yang sepaham di seluruh dunia."
 nationalism_focus:0 "Fokus Nasionalisme"
 nationalism_focus_desc:0 "Bangsa kita adalah yang terpenting. Kita harus mendahulukan kepentingan kita sendiri di atas segalanya."
 ideological_fanaticism:0 "Fanatisme Ideologis"
 ideological_fanaticism_desc:0 "Keyakinan yang tak tergoyahkan pada ideologi kita akan memberikan prajurit dan warga kita kekuatan untuk menghadapi kesulitan apa pun."
 air_innovation:0 "Inovasi Udara"
 air_innovation_desc:0 "Perang modern tidak dapat dimenangkan tanpa menguasai angkasa. Kita harus mengerahkan segala upaya untuk mengembangkan angkatan udara!"
 air_innovation_2:0 "Inovasi Udara II"
 air_innovation_2_desc:0 "Setiap keunggulan yang bisa kita raih di angkasa sangatlah berharga. Kita harus memfokuskan seluruh upaya kita untuk mengembangkan pesawat tempur."
 naval_air_effort:0 "Upaya Udara Angkatan Laut"
 naval_air_effort_desc:0 "Kemanjuran serangan udara terhadap sasaran angkatan laut telah dibuktikan oleh pihak Amerika sejak tahun 1921. Kita tidak boleh mengabaikan cabang Angkatan Udara ini jika kita berniat berperang melawan kekuatan laut."
 german_focus:0 "Fokus Nasional Jerman"
 GER_autobahn:0 "Reichsautobahn"
 GER_autobahn_tt:0 "Tambahkan maksimal §YInfrastruktur§! di §YBrandenburg§!, §YHannover§!, §YThüringen§!, dan §YFranken§!"
 GER_autobahn_desc: "Sejak dimulai pada tahun 1933, proyek [GetAutobahnName] telah menjadi keberhasilan yang gemilang. Upaya pembangunan telah mengurangi pengangguran, dan jalan-jalan yang luas berdiri sebagai monumen pemulihan ekonomi [GER.GetName]. Namun, masih banyak pekerjaan yang harus diselesaikan."
 GER_west_wall:0 "Tembok Barat (Westwall)"
 GER_west_wall_desc:0 "Kita harus mengamankan perbatasan barat kita dari kemungkinan agresi Prancis. Garis pertahanan Siegfried akan membuat perbatasan barat kita tak tertembus."
 GER_west_wall_tt:0 "§RJika Rhineland diremiliterisasi, Anda juga akan mendapatkan:§!\n"
 GER_west_wall_forts:0 "Tambahkan §Y12 Benteng Darat§! di perbatasan Prancis.\n"
 GER_tactical_air_effort:0 "Upaya Udara Taktis"
 GER_tactical_air_effort_desc:0 "Kemenangan akan diraih dengan menghancurkan pasukan darat musuh. Kita harus berfokus mendukung tentara kita sendiri dengan serangan taktis terhadap sasaran jarak dekat dan jauh."
 GER_long_range_escorts:0 "Pengawal Jarak Jauh"
 GER_long_range_escorts_desc:0 "Pengebom taktis dan strategis kita membutuhkan pengawal jarak jauh untuk memberikan perlindungan sepanjang perjalanan menuju area sasaran dan kembali."
 GER_strategic_air_effort:0 "Upaya Udara Strategis"
 GER_strategic_air_effort_desc:0 "Kemenangan akan diraih dengan menghancurkan industri musuh. Kita harus memfokuskan upaya kita pada perancangan dan produksi pengebom strategis."
 GER_army_innovation:0 "Inovasi Angkatan Darat"
 GER_army_innovation_desc:1 "Heinz Guderian dan para teoretikus radikal lainnya mendorong doktrin baru yang berani yang menekankan komunikasi, identifikasi 'schwerpunkte' (titik fokus), dan konsentrasi lokal pasukan gabungan. Memberi mereka kebebasan bertindak dapat membantu menghindari kengerian pembantaian di Perang Besar."
 GER_soviet_treaty:1 "Perjanjian dengan [GER.GetTheUSSRName]"
 GER_soviet_treaty_desc:1 "Kita dapat mengupayakan perjanjian riset baru dengan [SOV.GetNameDef] untuk mengembangkan, terutama, tank yang lebih baik. Jika mereka setuju, kita dapat membuka kembali sekolah tank yang kita tutup di Kama pada tahun 1933. Kerja sama dengan [SOV.GetAdjective], tentu saja, berarti mereka juga akan memetik manfaat dari inovasi yang dibuat..."
 GER_air_innovation_2:0 "Inovasi Udara II"
 GER_air_innovation_2_desc:0 "Tugas Kementerian Udara Reich sangatlah penting. Luftwaffe harus menjadi Angkatan Udara paling maju di dunia!"
 GER_army_innovation_2:0 "Inovasi Angkatan Darat II"
 GER_army_innovation_2_desc:0 "Pelajaran yang dipetik di fasilitas kita di Uni Soviet akan memungkinkan kita untuk lebih menyempurnakan doktrin dan perlengkapan kita. Namun, kali ini kita akan menyimpan kemajuan tersebut untuk diri kita sendiri!"
 GER_rocketry_focus:0 "Peroketan"
 GER_rocketry_focus_desc:0 "Penggerak roket memegang kunci inovasi besar di ketiga cabang militer."
 GER_wunderwaffe:0 "Senjata Ajaib (Wunderwaffe)"
 GER_wunderwaffe_desc:0 "Heisenberg dan von Braun sangat bersemangat untuk mengeksplorasi gagasan tertentu yang mereka miliki untuk senjata pemusnah mutlak. Yang mereka butuhkan hanyalah sumber daya tambahan..."
 GER_mol_rib_pact:1 "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc:1 "Perjanjian persahabatan dan non-agresi dengan [GER.GetTheUSSRName] mungkin terasa berat di hati, namun itu akan memungkinkan minyak berharga mereka tetap mengalir ke Jerman. Klausul rahasia akan membagi wilayah Rumania, Polandia, Lituania, Latvia, Estonia, dan Finlandia ke dalam zona pengaruh [GER.GetAdjective] dan [SOV.GetAdjective]..."
 GER_mol_rib_pact_tt:1 "Menandatangani §Ypakta non-agresi§! dengan §YUni Soviet§! dan menyetujui untuk §Ymembagi Polandia§! antara [SOV.GetName] dan Jerman\n"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST: "Pakta [GetMolotovInMRPact]-[GetRibbentropInMRPact]"
 SOV_MOLOTOV_RIBBENTROP_NAME_EXILES:0 "Pakta Pembagian Polandia"
 GER_soviet_ally:1 "Aliansi dengan [GER.GetTheUSSRName]"
 GER_soviet_ally_desc:1 "Mungkin kita bisa mengesampingkan perbedaan [GER.GetUSSRAllianceDesc] kita dengan bangsa [GER.GetRussiansDemonym] dan sebaliknya menekankan apa yang menyatukan kita: kebencian terhadap liberalisme egois dan Barat yang dekaden. Dengan [GER.GetTheUSSRName] sebagai sekutu, kita akan memiliki akses ke semua sumber daya yang kita butuhkan - di samping kekuatan militer mereka, tentu saja..."
 SOV_USSR_ALLIANCE_DESC_COMMUNIST:0 "ideologis"
 SOV_USSR_ALLIANCE_DESC_EXILES:0 "nasionalis"
 GER_turkey_puppet:0 "Bawahkan Turki"
 GER_turkey_puppet_desc:0 "Turki terjepit di antara kita dan Uni Soviet. Jika ditekan, pihak Turki kemungkinan besar akan tunduk pada kehendak kita dan menjadi negara bawahan. Sebagai bagian dari kesepakatan, Uni Soviet akan mendapatkan sejumlah wilayah di Turki timur. Namun, jika mereka menolak tuntutan kita, itu berarti perang."
 GER_rhineland:0 "Rhineland"
 GER_rhineland_desc:0 "Rhineland telah didemiliterisasi sejak akhir Perang Besar, namun penghinaan ini tidak boleh dibiarkan lebih lama lagi! Jerman adalah bangsa yang berdaulat dan bebas memindahkan pasukannya ke mana saja di dalam perbatasannya sendiri!"
 GER_rhineland_ultimatum:0 "§RRemiliterisasi dapat dibatalkan jika Anda dikonfrontasi dan memutuskan mundur.§!\n"
 GER_japan_friend:0 "Berteman dengan Jepang"
 GER_japan_friend_desc:0 "Kita telah lama menjalin hubungan yang bermanfaat dengan Tiongkok, namun ambisi kita mungkin akan lebih terlayani jika kita bersekutu dengan budaya prajurit serumpun di Jepang, bahkan jika itu berarti mengorbankan Tiongkok..."
 GER_japan_friend_tt:0 "Menarik kembali von Falkenhausen.\n"
 GER_china_friend:0 "Berteman dengan Tiongkok"
 GER_china_friend_desc:0 "Mari kita memperdalam persahabatan jangka panjang kita dengan Tiongkok. Melakukan hal itu akan menjauhkan Jepang, namun apa arti Jepang selain sekadar Italia-nya wilayah Timur?"
 GER_anti_comintern_pact: "Pakta Anti-Komintern"
 GER_anti_comintern_pact_desc: "Campur tangan Komintern dalam urusan internal bangsa-bangsa tidak hanya membahayakan perdamaian internal dan kesejahteraan sosial mereka, namun juga merupakan ancaman bagi perdamaian dunia! Kita akan mengajak banyak negara non-Komunis menandatangani pakta ini, dan memastikan bahaya merah tetap terkendali."
 GER_anti_soviet_pact: "Pakta Anti-[SOV.GetAdjective]"
 GER_anti_soviet_pact_desc:0 "Kita dapat melangkah lebih jauh dari Pakta Anti-Komintern dan meminta semua anggota untuk berkomitmen membentuk koalisi melawan Uni Soviet. Jika ada penandatangan yang terlibat perang dengan Uni Soviet, semua anggota lain juga harus menyatakan perang."
 GER_anti_soviet_pact_tt:0 "§YMengirimkan tawaran kepada semua anggota Pakta Anti-Komintern untuk bergabung dalam aliansi defensif melawan Uni Soviet.§!"
 GER_anti_soviet_pact_tt_2: "§YAliansi pertahanan akan memanggil para anggota untuk berperang jika salah satu dari mereka diserang oleh Komintern§!"
 GER_anti_soviet_pact_tt_3:0 "Mendapatkan Semangat Nasional §YPakta Anti-Soviet§!.\n"
 GER_ussr_war_goal:1 "Perang dengan [GER.GetTheUSSRName]"
 GER_ussr_war_goal_desc:1 "Kita dapat memfokuskan upaya propaganda kita untuk mempersiapkan rakyat Jerman - dan dunia - menghadapi perang suci melawan [SOV.GetNameDef]."
 GER_turkey_friend:0 "Berteman dengan Turki"
 GER_turkey_friend_desc:0 "Turki di bawah Atatürk berada pada jalur modernisasi yang mengagumkan, dan negara ini mengendalikan akses ke Laut Hitam melalui Bosporus dan Dardanelles. Membawa Turki ke dalam lingkup pengaruh kita harus menjadi prioritas pertama!"
 GER_anschluss_old:0 "Anschluss"
 GER_anschluss_desc_old:0 "Anschluss, atau penyatuan dengan Austria, adalah cita-cita lama bangsa Jerman. Meskipun dilarang oleh Perjanjian Versailles, waktunya akhirnya tiba untuk mewujudkannya. Mari kita tawarkan kepada rakyat Austria kesempatan untuk berbagi takdir kejayaan kita!"
 GER_anschluss_eq_trigger_tt:0 "Lebih dari §Y50.000§! perlengkapan infanteri di angkatan darat"
 #anschluss_mefo_bills_tt:0 "Uses Austrian gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 anschluss_mefo_bills_double_reduction:0 "Memodifikasi §YSurat MEFO§! sebesar §G+0.10§! Perolehan Kekuatan Politik Harian\n"
 GER_demand_memel:0 "Tegaskan Kembali Klaim Timur"
 GER_demand_memel_desc:0 "Perang Besar menyaksikan hilangnya banyak wilayah Jerman di Timur dengan bangkitnya kembali Polandia dan penyerahan Memel ke Lituania. Ultimatum akan dikirimkan ke kedua negara, namun Polandia kemungkinan besar tidak akan tunduk hanya pada kata-kata."
 GER_demand_memel_threat:0 "Jerman Menegaskan Kembali Klaim Timur"
 GER_danzig_or_war:0 "Danzig atau Perang"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName] harus menyetujui kesepakatan agar bonus berlaku. Mereka akan meninggalkan [Root.GetFactionName] jika perang dideklarasikan.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName] harus menyetujui kesepakatan agar bonus berlaku. Anda akan meninggalkan faksi [Root.GetFactionName] jika perang dideklarasikan.§!\n"
 GER_danzig_or_war_desc:0 "Danzig dulunya adalah milik Jerman, Danzig tetap milik Jerman, dan Danzig akan menjadi milik Jerman mulai sekarang! Jika Polandia tidak menyerahkan wilayah tersebut, kita harus mempersiapkan rakyat Jerman untuk perang yang tak terhindarkan. Danzig dan tanah sekitarnya akan kembali ke Jerman!"
 GER_czech_friend:0 "Berteman dengan Cekoslowakia"
 GER_czech_friend_desc:0 "Membawa Cekoslowakia ke pihak kita akan mengamankan sayap selatan kita dan memberi kita akses ke persenjataan Skoda yang terkenal di dunia."
 GER_demand_sudetenland:0 "Tuntut Sudetenland"
 GER_demand_sudetenland_desc:0 "Jutaan warga Jerman tinggal di bawah kekuasaan Ceko di Sudetenland, menderita penindasan dan diskriminasi. Penderitaan mereka harus diakhiri! Wilayah Sudetenland harus diserahkan kepada Reich!"
 GER_demand_sudetenland_threat:0 "Jerman Menuntut Sudetenland"
 GER_first_vienna_award:0 "Penghargaan Wina Pertama"
 GER_first_vienna_award_desc:0 "Kita dapat menengahi sengketa perbatasan antara Cekoslowakia dan Hungaria. Memberikan konsesi teritorial kepada Hungaria akan membuat mereka berutang budi kepada kita."
 GER_end_of_czechoslovakia:0 "Nasib Cekoslowakia"
 GER_end_of_czechoslovakia_desc:0 "Tanpa Sudetenland, Cekoslowakia tidak berdaya. Saatnya tiba untuk membubarkan negara artifisial ini sepenuhnya. Bohemia dan Moravia akan menjadi protektorat kita, sementara Slowakia dapat diberikan kemerdekaan nominal di bawah perlindungan kita."
 #end_of_czechoslovakia_mefo_bills_tt:0 "Uses Czechoslovak gold to reduce the cost of §Y$GER_mefo_bills$§!.\n"
 GER_second_vienna_award:0 "Penghargaan Wina Kedua"
 GER_second_vienna_award_desc:0 "Transilvania memiliki mayoritas penduduk Hungaria dan seharusnya menjadi hak milik kawan-kawan kita di Hungaria. Namun, sulit untuk mengetahui bagaimana rezim dan rakyat Rumania akan bereaksi terhadap tuntutan ini."
 GER_italy_ally:0 "Aliansi dengan Italia"
 GER_italy_ally_desc:0 "Bangsa Italia mungkin kurang dapat dipercaya - sebagaimana yang mereka buktikan dalam Perang Besar - namun Mussolini dan gerakan Fasisnya telah menunjukkan bahwa masih ada harapan bagi Italia. Tentu saja, Jerman hanya akan diuntungkan dengan bersekutu bersama Italia, bukan?"
 GER_nationalist_spain_ally:0 "Aliansi dengan Spanyol"
 GER_nationalist_spain_ally_desc:0 "Kemenangan kaum nasionalis dalam perang saudara Spanyol telah membuka jalan bagi hubungan yang lebih erat antara kedua negara kita. Franco memegang kunci menuju Mediterania."
 GER_nationalist_spain_ally_tt:0 "Meningkatkan hubungan diplomatik dengan §YSpanyol Nasionalis§!"
 GER_danzig_vs_slovakia:0 "Danzig Ditukar Slowakia"
 GER_danzig_vs_slovakia_desc:0 "Bangsa Polandia menghalangi rencana kita untuk Lebensraum. Meski begitu, belum terlambat untuk mengubah prioritas jangka panjang kita dan mengupayakan persahabatan dengan mereka. Satu-satunya cara yang mungkin untuk mewujudkannya adalah melalui pertukaran wilayah: Danzig ditukar Slowakia. Polandia telah menunjukkan minat di kawasan itu dengan menduduki Zaolzie."
 GER_poland_friend:0 "Berteman dengan Polandia"
 GER_poland_friend_desc:0 "Meskipun Polandia tidak lagi memiliki akses ke laut, kita telah membuktikan niat baik kita dengan memberi mereka Slowakia. Mungkin kita bisa membawa mereka lebih dekat lagi dengan menjanjikan perolehan wilayah yang samar di timur pada masa depan."
 GER_war_with_france:0 "Perang dengan Prancis"
 GER_war_with_france_desc:0 "Kini setelah Jerman menemukan solusi yang memuaskan untuk masalah perbatasan timurnya, untuk sementara waktu, sudah saatnya mengalihkan perhatian kita ke barat. Hilangnya Alsace-Lorraine adalah noda pada kehormatan rakyat Jerman dan hanya melalui perang yang adil dan benar kita dapat membalas ini."
 GER_war_with_france_threat:0 "Klaim atas wilayah Prancis"
 GER_operation_tannenbaum:0 "Operasi Tannenbaum"
 GER_operation_tannenbaum_desc:0 "Swiss memiliki rakyat dan sistem politik yang paling menyedihkan. Kita akhirnya memiliki waktu untuk menangani musuh bebuyutan dari Jerman baru ini."
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Reintegrasi Luksemburg dan Alsace-Lorraine"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "Dengan keberhasilan penaklukan kembali wilayah bersejarah Jerman, kini kita dapat memulai proses reintegrasi mereka ke dalam [Root.GetName]. Penduduk mereka harus diizinkan untuk menunaikan kewajiban patriotik mereka bagi tanah air."
 GER_naval_rearmament:0 "Persenjataan Kembali Angkatan Laut"
 GER_naval_rearmament_desc:0 "Perjanjian Angkatan Laut Anglo-Jerman yang kita peroleh pada tahun 1935 memungkinkan kita untuk memperluas angkatan laut kita secara besar-besaran. Kita tidak boleh menyia-nyiakan upaya untuk melakukannya."
 GER_plan_z:0 "Rencana Z"
 GER_plan_z_desc:0 "Laksamana Raeder meyakini bahwa Inggris paling baik dikalahkan melalui kebijakan perampokan permukaan (surface raiding). Membangun cukup kapal tempur dan kapal induk untuk mencapainya akan menjadi tugas raksasa, dan akan memakan waktu; mungkin terlalu banyak waktu... Di sisi lain, angkatan laut permukaan kita saat ini sangat tidak memadai."
 GER_u_boat_effort:0 "Upaya U-Boat"
 GER_u_boat_effort_desc:0 "Komodor Dönitz menganjurkan strategi perang kapal selam tanpa batas sebagai cara terbaik untuk menundukkan Inggris. Dengan cukup U-boat, kita mungkin mampu membuat industri dalam negeri Inggris kelaparan dari semua sumber daya yang dibutuhkan dari imperiumnya yang luas."
 GER_trade_interdiction_old:0 "Pencegatan Perdagangan"
 GER_trade_interdiction_desc_old:0 "Galangan kapal kita berkomitmen untuk memproduksi U-boat, namun kita perlu mengembangkan cara yang lebih baik untuk memanfaatkan 'kawanan serigala' (wolf packs) ini. Berikan para laksamana segala yang mereka butuhkan untuk melakukan simulasi dan latihan perang..."
 GER_modular_construction:0 "Konstruksi Modular"
 GER_modular_construction_desc:0 "Dengan membangun bagian-bagian kapal selam kita di berbagai fasilitas konstruksi, perakitan dan kecepatan konstruksi akan meningkat pesat."
 GER_denmark_friend:0 "Berteman dengan Denmark"
 GER_denmark_friend_desc:0 "Denmark mengendalikan selat menuju Laut Baltik. Memastikan persahabatan mereka akan melindungi pantai utara kita."
 GER_norway_friend:0 "Berteman dengan Norwegia"
 GER_norway_friend_desc:0 "Norwegia sangat penting untuk rute pengiriman bijih besi dari Swedia. Menjalin hubungan baik akan mengamankan jalur pasokan ini."
 GER_dutch_friend:0 "Berteman dengan Belanda"
 GER_dutch_friend_desc:0 "Belanda tahu betul berapa lama mereka akan bertahan jika terjadi Perang Besar lagi. Jika mereka dapat diyakinkan bahwa Jerman dapat mengancam Inggris secara serius, ada kemungkinan mereka akan memilih bersekutu dengan kita untuk menghindari pendudukan yang keras."
 GER_sweden_friend:0 "Berteman dengan Swedia"
 GER_sweden_friend_desc:0 "Negara-negara Skandinavia bagaikan kartu domino; mereka berdiri dan tumbang bersama. Dengan Norwegia dan Denmark di kubu kita, Swedia pasti akan mengikuti."
 GER_improve_national_spirit:0 "Tingkatkan Semangat Nasional"
 GER_improve_national_spirit_desc:0 "Dengan ibu kota para pemenang Perang Besar berada di tangan kita, kita akhirnya dapat menepis bayang-bayang kekalahan kita. Era baru sedang fajar bagi Jerman!"
 GER_improve_national_spirit_tooltip:0 "Kita, atau anggota Faksi kita, harus mengendalikan London dan Paris beserta wilayah di mana kota-kota tersebut berada."
 needs_approval:0 "§R[This.GetName] harus menyetujui kesepakatan agar bonus berlaku.§!\n"
 GER_demand_slovenia:0 "Tuntut Slovenia"
 GER_demand_slovenia_threat:0 "Jerman Menuntut Slovenia"
 GER_demand_slovenia_desc:0 "Perjanjian Saint-Germain-en-Laye membagi-bagikan banyak wilayah bersejarah Austria kepada negara-negara penerus. Dengan Austria yang kini kembali bersatu dengan bangsa Jerman, sudah waktunya untuk mengakhiri ketidakadilan ini. Provinsi bersejarah Carniola dan Styria, yang kini dikenal sebagai Slovenia, harus dipulangkan."
 GER_first_ljubljana_award:0 "Penghargaan Ljubljana Pertama"
 GER_first_ljubljana_award_desc:0 "Kekuatan barat yang munafik mengkhotbahkan penentuan nasib sendiri bangsa-bangsa sembari menyerahkan banyak minoritas untuk diperintah oleh orang Serbia. Kita berada dalam posisi untuk memperbaiki kesalahan sejarah itu dan sekaligus menjalin pertemanan. Bagi mereka yang ingin memihak kita dalam tatanan Eropa, kita bisa bersikap sangat murah hati."
 GER_first_ljubljana_award_tt:0 "Semua negara bagian inti asli [YUG.GetAdjective] dimiliki oleh §Y[YUG.GetName]§! atau salah satu negara bawahannya.\n"
 GER_fate_of_yugoslavia:0 "Nasib Yugoslavia"
 GER_fate_of_yugoslavia_desc:0 "Negara Yugoslavia selalu merupakan ciptaan artifisial, dan otoritas pusat mulai runtuh. Kita harus turun tangan untuk memulihkan ketertiban. Satu-satunya pertanyaan yang kita hadapi adalah apa cara terbaik untuk melakukan ini."
 #yugoslavia_mefo_bills_tt:0 "Uses Yugoslav gold to reduce the cost of §YMEFO bills§!.\n"
 GER_second_ljubljana_award:0 "Penghargaan Ljubljana Kedua"
 GER_second_ljubljana_award_tt:0 "Peristiwa memberikan kemungkinan untuk menuntut wilayah bagi [Root.GetName] atau sekutu yang layak."
 GER_second_ljubljana_award_desc:0 "Dengan masalah Yugoslavia terselesaikan, kini saatnya mengalihkan perhatian kita ke Yunani. Mereka juga telah diperluas secara tidak adil oleh Sekutu. Saatnya melihat siapa teman sejati kita."
 GER_war_with_greece:0 "Perang dengan Yunani"
 GER_war_with_greece_desc:0 "Dengan Yunani yang sudah terlibat perang, akan sangat disayangkan bagi Jerman jika melewatkan pangkalan di Mediterania Timur."
 GER_fate_of_greece:0 "Nasib Yunani"
 GER_fate_of_greece_desc:0 "Yunani telah terbukti tidak dapat mengatasi kekuatan baru yang muncul di Eropa. Saatnya menawarkan perlindungan yang hanya bisa diberikan oleh Jerman."
 GER_weserubung:0 "Operasi Weserübung"
 GER_weserubung_desc:0 "Norwegia adalah titik strategis yang kritis dan akan menjadi sasaran empuk serangan bagi musuh mana pun yang ingin mengganggu perdagangan baja kita dengan Swedia. Kita tidak boleh mengambil risiko musuh kita mendirikan pangkalan di kawasan ini. Untuk mendapatkan landasan yang baik bagi invasi ke Norwegia, kita harus bergerak mengamankan Denmark terlebih dahulu."
 GER_weserubung_tt: "\nMenguasai sepenuhnya §Y[144.GetName]§! akan mengirimkan bijih berkualitas tinggi dari §Y[SWE.GetName]§! melalui §YNarvik§! setiap bulan. Ini akan menghasilkan satu §Ypabrik sipil lepas pantai§! tambahan setiap 6 bulan, hingga maksimum 8 total §Ypabrik sipil lepas pantai§!. Pengiriman ini dapat terhenti jika kendali atas §Y[144.GetName]§! hilang. Jika [ENG.GetNameDefCap] berhasil menginvasi [SWE.GetName] dan menyabotase tambang tersebut, atau jika [SWE.GetNameDef] meledakkannya, pabrik sipil akan hilang secara permanen. Pengiriman dapat dilanjutkan jika tambang beroperasi kembali."
 GER_weserubung_tt_complete: "§YPabrik sipil lepas pantai§! yang diperoleh saat ini dari mengendalikan §YNarvik§!: §G[?GER_narvik_civs]§!\nKemajuan pengiriman menuju pabrik berikutnya: [?GER_narvik_shipments]/6"
 GER_around_maginot:0 "Putari Maginot"
 GER_around_maginot_desc:0 "Jika kita ingin memastikan keunggulan taktis melawan Prancis, kita harus mampu menyerang mereka dari segala penjuru. Mereka tidak akan menduga serangan dari Utara, yang persis merupakan tempat kita akan menyerang mereka, begitu kita menyingkirkan beberapa rintangan."
 italian_focus:0 "Fokus Nasional Italia"
 GER_danzig_or_war_POL_civil_war:0 "Ambil Danzig sebagai imbalan dukungan"
 GER_danzig_trigger_polish_civil_war:0 "Polandia berada dalam perang saudara dan salah satu dari hal berikut harus terpenuhi\nJerman telah mengirim sukarelawan untuk mendukung salah satu pihak\nSalah satu pihak berada dalam faksi bersama Jerman"
 GER_alone_or_peace_faction_tt:0 "tidak berada dalam faksi, atau berada dalam faksi yang berdamai dengan [GER.GetNameDef]."
 GER_four_year_plan:0 "Rencana Empat Tahun"
 GER_four_year_plan_desc:0 "Kita membutuhkan rencana ambisius untuk mempersiapkan persenjataan kembali dan kemandirian mutlak bangsa ini. Hal ini harus dicapai dalam kurun waktu empat tahun ke depan."
 GER_atlantikwall:0 "Tembok Atlantik (Atlantikwall)"
 GER_atlantikwall_desc:0 "Kini setelah kita menaklukkan Eropa Barat, kita harus memperkuat diri dari kemungkinan serangan dahsyat dari seberang Samudra Atlantik. Jaringan benteng pertahanan raksasa di sepanjang pesisir Eropa akan memberikan perlindungan yang memadai bagi kita."
 atlantikwall_tooltip:1 "Tempatkan §YBenteng Pesisir§! di setiap negara bagian pesisir Atlantik berikut yang Anda kendalikan sepenuhnya:\n"
 atlantikwall_tooltip_2:0 "§YAquitaine§!\n§YPoitou§!\n§YLoire§!\n§YBrittany§!\n§YNormandy§!\n§YPas de Calais§!\n§YVlaanderen§!\n§YHolland§!\n§YFriesland§!\n§YWeser-Ems§!\n§YHannover§!\n§YSchleswig-Holstein§!\n§YJutland§!\n§YOstlandet§!\n§YVestlandet§!\n§YTrondelag§!\n§YNord-Norge§!\n"
 GER_ostwall:0 "Tembok Timur (Ostwall)"
 GER_ostwall_desc:0 "Meskipun kita meraih wilayah di Timur, kita harus memastikan bahwa jika situasi berbalik, kita dapat menahan laju musuh. Kita harus membangun garis benteng pertahanan, garis Panther-Wotan, di sepanjang sungai Dnieper, dari Laut Hitam hingga Baltik."
 GER_ostwall_forts:1 "Tempatkan §YBenteng Darat§! di sepanjang sungai Dnieper hingga ke Baltik, di setiap negara bagian berikut yang dikendalikan penuh oleh faksi Anda:\n"
 GER_ostwall_forts_2:0 "§YTartu§!\n§YPskov§!\n§YNevel§!\n§YVitebsk§!\n§YMinsk§!\n§YBobruysk§!\n§YMozyr§!\n§YKiev§!\n§YCherkasy§!\n§YDnipropetrovsk§!\n§YZaporozhe§!\n"
 GER_ostwall_tt:0 "Di bawah kendali anggota faksi kita.\n"
 GER_autarky:0 "Autarki"
 GER_autarky_desc:0 "Agar Jerman benar-benar berjaya, ia harus mampu berswasembada. Kita harus memanfaatkan sumber daya kita dengan lebih baik, dan menjadi lebih efisien dalam konstruksi kita."
 GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc:0 "Kita harus membebaskan diri dari pengaruh para kapitalis swasta yang plin-plan. Oleh karena itu, kita akan membentuk konglomerat industri di bawah kendali kita untuk mengawasi pertumbuhan di sektor pertambangan dan baja, karena ini akan menjadi tulang punggung industri militer kita."
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Hermann Göring-Werke"
 GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "Kaiser-Werke"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "VEB Vereinigte Maschinenwerke"
 GER_HERMANN_GORING_WERKE_NAME:0 "Industri yang Dikelola Negara"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc:0 "Kita akan mengizinkan warga kita membeli 'mobil rakyat' masa depan mereka melalui skema tabungan, yang pada gilirannya akan kita gunakan untuk membiayai pembangunan pabrik-pabrik yang pada akhirnya akan berkontribusi dalam pembuatan mobil-mobil ini."
 GER_KDF_WAGEN_NAME:0 "KdF-Wagen"
 GER_KAISER_WAGEN_NAME:0 "Wilhelm-Wagen"
 GER_VOLKS_WAGEN_NAME:0 "Volkswagen"
 GER_coal_liquidization:0 "Pencairan Batu Bara"
 GER_coal_liquidization_desc:0 "Jerman kekurangan minyak, sehingga kita harus melipatgandakan upaya kita di bidang minyak sintetis."
 GER_synthetic_rubber:0 "Karet Sintetis"
 GER_synthetic_rubber_desc:0 "Sama seperti kita kekurangan minyak, kita juga kekurangan karet, yang sangat dibutuhkan untuk ban pesawat dan kendaraan militer kita. Kita harus mengembangkan karet sintetis yang dapat diproduksi di dalam negeri."
 GER_german_war_economy:0 "Ekonomi Perang Jerman"
 GER_german_war_economy_desc:0 "Rakyat bangsa kita yang besar harus dimanfaatkan demi kepentingan upaya perang. Kita akan beralih ke ekonomi perang penuh, di mana setiap pria diharapkan memainkan perannya."
 GER_grosraumwirtschaft:0 "Großraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "Kita harus mempersiapkan Jerman untuk takdirnya sebagai pusat Eropa. Infrastruktur kita akan mengikat Barat dengan Timur, dan Selatan dengan Utara."
 GER_align_hungary:0 "Selaraskan Hungaria"
 GER_align_hungary_desc:0 "Dukungan berkelanjutan untuk ambisi revisionis Hungaria akan menjamin kesetiaan mereka pada Jerman."
 GER_align_romania:0 "Selaraskan Rumania"
 GER_align_romania_desc:0 "Kita harus meningkatkan tekanan politik dan ekonomi pada Rumania untuk memastikan mereka tetap berada di orbit kita."
 GER_integrate_war_economies:0 "Integrasikan Ekonomi Perang"
 GER_integrate_war_economies_desc:0 "Negara-negara di lingkup pengaruh kita telah memiliki ketergantungan ekonomi yang ekstrem pada kita. Kita dapat menggunakan ini untuk meningkatkan kendali kita atas ekonomi mereka dan pengaruh kita pada kebijakan luar negeri mereka."
 GER_integrate_war_economies_tt:2 "Jika §Y[HUN.GetName]§! berada dalam faksi dengan §Y[Root.GetName]§!, tambahkan masing-masing §Y4 Pabrik Militer§! ke §Y[Root.GetName]§! dan §Y[HUN.GetName]§!, dan §Y[HUN.GetName]§! menjadi negara bawahan §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt2:2 "Jika §Y[ROM.GetName]§! berada dalam faksi dengan §Y[Root.GetName]§!, tambahkan masing-masing §Y4 Pabrik Militer§! ke §Y[Root.GetName]§! dan §Y[ROM.GetName]§!, dan §Y[ROM.GetName]§! menjadi negara bawahan §Y[Root.GetName]§!.\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] harus menyetujui kesepakatan agar bonus berlaku.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] harus menyetujui kesepakatan agar bonus berlaku.§!\n"
 GER_uplift_the_rosenberg_office: "Angkat Derajat Kantor Rosenberg"
 GER_uplift_the_rosenberg_office_desc: "Ada banyak hal yang perlu dikoordinasikan dengan baik di dalam Reich, termasuk tata kelola dan kendali wilayah pendudukan, serta pengawasan internal dan seluruh pendidikan intelektual dan ideologis Partai Nazi. Semua hal ini harus diputuskan secara terpusat dan dikendalikan dari Kantor Rosenberg, mengingat Rosenberg adalah teoretikus dan ideolog partai yang penting."
 GER_reichskommissariats_tt: "Memungkinkan pembentukan §YNegara Bawahan Khusus§! dan §YDivisi Administratif§! di wilayah yang ditaklukkan, seperti §YReichskommissariat§! dan §YProtektorat§!. Juga memungkinkan pembagian Eropa ke dalam proyeksi wilayah pengaruh.\n"
 GER_oppose_hitler:0 "Lawan Hitler"
 GER_oppose_hitler_desc:0 "Pemerintahan tirani Hitler membawa Jerman menuju kehancuran total. Para perwira militer dan kaum konservatif yang setia pada bangsa harus bangkit dan menggulingkan rezim Nazi sebelum terlambat!"
 GER_oppose_hitler_civil_war:0 "§RPara pendukung fasis akan memulai perang saudara.§!\n"
 GER_secure_the_new_state:0 "Amankan Negara Baru"
 GER_secure_the_new_state_desc:0 "Mengingat perang saudara yang melahirkannya, pemerintahan sementara kekurangan kekuatan. Kita harus memastikan bahwa negara ini diamankan dan tidak dapat digulingkan dengan mudah."
 GER_clamp_down_on_fascism:0 "Tumpas Fasisme"
 GER_clamp_down_on_fascism_desc:0 "Dalam beberapa tahun terakhir di bawah rezim Nazi, sifat menindas, diktator, dan anti-royalis dari pemerintah serta ideolog dan pendukung fasis mereka menjadi sangat jelas. Kita harus memastikan cara berpikir mereka dilenyapkan di mana pun ia muncul kembali."
 GER_revive_the_kaiserreich:0 "Hidupkan Kembali Kaiserreich"
 GER_revive_the_kaiserreich_desc:0 "Peristiwa dalam dekade terakhir telah menunjukkan bahwa demokrasi terlalu lemah untuk membendung unsur-unsur jahat internal. Kita harus kembali ke kepemimpinan kuat seorang Kaiser, dan untuk mempersiapkan kepulangannya, kita akan mengembalikan konstitusi ke Deutsches Kaiserreich."
 GER_revive_the_kaiserreich_tt:0 "§YJunta Militer Jerman§! akan dikenal sebagai §YKekaisaran Jerman§!.\n"
 GER_mackensen_dead:0 "Von Mackensen gugur."
 GER_rebuild_the_nation:0 "Bangun Kembali Bangsa"
 GER_rebuild_the_nation_desc:1 "Setelah kehancuran akibat perang saudara, kita harus berupaya membangun kembali bangsa kita. Kita akan meminta rakyat untuk mengesampingkan kenyamanan pribadi untuk sementara waktu, sehingga kita dapat memfokuskan semua sumber daya kita untuk mencapai tujuan ini."
 GER_fan_the_prussian_militarism:0 "Kobarkan Militerisme Prusia"
 GER_fan_the_prussian_militarism_desc:0 "Untuk menggantikan korban dalam perang saudara kita, kita harus memanfaatkan semangat militerisme Prusia guna meningkatkan perekrutan dan pelatihan prajurit baru. Fakta bahwa militer kita telah membebaskan kita dari kediktatoran Nazi memastikan cita-cita Prusia ini kini lebih populer dari sebelumnya."
 GER_a_new_and_better_germany:0 "Jerman yang Baru dan Lebih Baik"
 GER_a_new_and_better_germany_desc:0 "Selagi kita membangun kembali bangsa kita, kita harus bertekad untuk melampaui apa yang sekadar diperlukan, sehingga apa yang kita bangun sekarang akan bertahan dalam ujian waktu."
 GER_bulwark_against_bolshevism:1 "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc:1 "Bangsa kita berdiri sebagai perisai melawan [GER.GetBulwarkBolshevismDesc], melindungi Barat dari pengaruh [GER.GetBulwarkCommunismDesc]. Kita harus memikul amanat ini dengan bangga, dan bersiap mengangkat senjata jika diperlukan."
 GER_bulwark_against_bolshevism_tt:1 "§RSemangat Nasional ini akan hilang jika berada dalam satu faksi dengan, atau berperang di pihak yang sama dengan, [SOV.GetNameDef].§!\n"
 SOV_BULWARK_NAME_COMMUNIST:0 "Benteng Melawan Bolshevisme"
 SOV_BULWARK_NAME_FASCISM:0 "Benteng Melawan Fasisme"
 SOV_BULWARK_NAME_NEUTRALITY:0 "Kubu Pertahanan Melawan Rusia"
 SOV_BULWARK_BOLSHEVISM_DESC_COMMUNIST:0 "Bolshevisme"
 SOV_BULWARK_BOLSHEVISM_DESC_FASCISM:0 "fasisme"
 SOV_BULWARK_BOLSHEVISM_DESC_NEUTRALITY:0 "imperialisme Rusia"
 SOV_BULWARK_COMMUNISM_DESC_COMMUNIST:0 "komunisme"
 SOV_BULWARK_COMMUNISM_DESC_FASCISM:0 "fasisme"
 SOV_BULWARK_COMMUNISM_DESC_NEUTRALITY:0 "Rusia"
 GER_return_of_the_kaiser:0 "Kembalinya Sang Kaiser"
 GER_return_of_the_kaiser_desc:0 "Kaiserreich membutuhkan seorang kaiser, dan Wilhelm II masih hidup, diasingkan di Belanda. Kita akan mencabut pengasingannya dan mengundangnya kembali untuk naik takhta, apa pun pendapat negara-negara Demokrasi Barat."
 GER_focus_on_the_true_enemy:0 "Fokus pada Musuh Sejati"
 GER_focus_on_the_true_enemy_desc:0 "Bukan di internal, melainkan di eksternal musuh kita berada. Kejahatan berkepanjangan atas monopoli kolonial Barat hanya disaingi oleh ketidakadilan Perjanjian Versailles yang ditimpakan kepada kita setelah kita berusaha meraih tempat kita di bawah matahari. Itu berakhir sekarang."
 GER_rebuild_the_high_seas_fleet:0 "Bangun Kembali Armada Laut Lepas"
 GER_rebuild_the_high_seas_fleet_desc:0 "Kita membutuhkan program pembangunan angkatan laut besar-besaran untuk membangun kembali Armada Laut Lepas (High Seas Fleet) kita yang dulu jaya, jika kita ingin menantang Barat dengan sukses."
 GER_our_place_in_the_sun:0 "Tempat Kita di Bawah Matahari"
 GER_our_place_in_the_sun_desc:0 "Biarkan semua orang tahu bahwa Kekaisaran Jerman sekali lagi menegaskan haknya untuk mengambil tempat di bawah matahari! Rakyat kita tidak akan lagi dipermalukan dalam kegelapan."
 GER_pride_of_the_modern_germany:0 "Kebanggaan Jerman Modern"
 GER_pride_of_the_modern_germany_desc:0 "Akan butuh bertahun-tahun untuk menandingi ukuran Angkatan Laut Kerajaan Inggris. Jadi, kita harus melampauinya dalam kualitas. Kapal-kapal kita akan menjadi yang paling modern dan kuat yang pernah mengarungi lautan!"
 GER_prepare_for_the_next_blockade:0 "Bersiap untuk Blokade Berikutnya"
 GER_prepare_for_the_next_blockade_desc:0 "Blokade Inggris terkutuk itulah yang membuat kita kalah dalam perang terakhir. Kita tidak akan melakukan kesalahan yang sama lagi. Kali ini, kita akan berusaha lebih keras lagi untuk mempersiapkan populasi menghadapi apa yang akan datang."
 GER_break_the_anglo_french_colonial_hegemony:0 "Hancurkan Hegemoni Kolonial Anglo-Prancis"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Waktunya telah tiba untuk menghancurkan monopoli yang dipegang Barat atas kolonialisme, yang sudah berlangsung terlalu lama."
 flag_franco_british_union:0 "Uni Prancis-Inggris"
 GER_schlieffen_once_more:0 "Rencana Schlieffen Sekali Lagi"
 GER_schlieffen_once_more_desc:0 "Garis Maginot harus dihindari. Kita akan sekali lagi melewati Belgia dan Luksemburg, dalam serangan kilat menuju kemenangan."
 GER_reinstate_imperial_possessions:0 "Pulihkan Wilayah Kekaisaran"
 GER_reinstate_imperial_possessions_desc:0 "Dengan keberhasilan penaklukan kembali wilayah-wilayah bersejarah Jerman, kini kita dapat memulai proses memulihkan mereka ke dalam [Root.GetName] sebagai provinsi seutuhnya. Aib terakhir Versailles akhirnya terhapuskan!"
 GER_crossing_the_atlantic:0 "Menyeberangi Atlantik"
 GER_crossing_the_atlantic_desc: "Dengan tumbangnya semua perlawanan di daratan Eropa terhadap kekuasaan kita, kita harus mengalihkan kembali upaya produksi kita untuk menciptakan angkatan laut raksasa, sehingga kita dapat membawa pertempuran kepada pihak Inggris dan Amerika. Kita tidak akan beristirahat, sampai pada saat yang ditentukan Tuhan, Dunia Lama, dengan segala kekuatan dan keperkasaannya, melangkah maju untuk menaklukkan dan mempermalukan Dunia Baru."
 GER_crossing_the_atlantic_trigger_tt: "Bukan: Negara Musuh Mana Pun:\nDianggap sebagai Negara Utama\nNegara bagian mana pun yang dikendalikan:\nBerada di §YEropa§!"
 GER_crossing_the_atlantic_2_factories_tt:0 "Hapus §Y2 Pabrik Militer§! dari negara bagian pedalaman untuk setiap negara bagian pesisir yang menerima galangan kapal ini.\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "Hapus §Y1 Pabrik Militer§! dari negara bagian pedalaman untuk setiap negara bagian pesisir yang menerima galangan kapal ini.\n"
 GER_the_central_powers:0 "Blok Poros Tengah"
 GER_the_central_powers_desc:0 "Kita membutuhkan sekutu jika kita ingin berdiri melawan Barat. Kita akan membentuk faksi kita sendiri untuk melawan penindasan negara-negara demokrasi."
 GER_prepare_italian_coup:0 "Siapkan Kudeta Italia"
 GER_prepare_italian_coup_desc:0 "Kejatuhan Italia ke dalam fasisme harus dibatalkan. Kita akan mendekati kaum royalis Italia dengan usulan kudeta yang didukung oleh kita."
 GER_prepare_italian_coup_tt:0 "Jika mereka menerima tawaran kita:\n"
 GER_assassinate_mussolini:0 "Bunuh Mussolini"
 GER_assassinate_mussolini_desc:0 "Waktunya telah tiba untuk memastikan akhir dari poros utama fasisme Italia. Tangan-tangan Jerman akan membunuh sang pemimpin, setelah itu kaum royalis Italia akan merebut kekuasaan dalam satu gerakan cepat."
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! belum menolak usulan pembunuhan kita"
 GER_rekindle_imperial_sentiment:0 "Bangkitkan Kembali Sentimen Kekaisaran"
 GER_rekindle_imperial_sentiment_desc:0 "Meskipun Kekaisaran Austria-Hungaria hancur setelah Perang Besar, mereka yang meratapi kepergian Kekaisaran masih dapat ditemukan. Kita akan memupuk sentimen kekaisaran ini dengan harapan bahwa negara-negara penerus dapat memutuskan untuk bergabung kembali demi kekuatan mereka sendiri."
 GER_rekindle_imperial_sentiment_tt:0 "Ketika dukungan non-blok cukup tinggi, mengaktifkan keputusan bagi negara-negara ini untuk membentuk kembali Kekaisaran Austria-Hungaria dan bergabung dengan Blok Poros Tengah.\n"
 GER_rekindle_imperial_sentiment_tt_2: "Ketika dukungan non-blok cukup tinggi, mengaktifkan keputusan bagi negara-negara ini untuk membentuk kembali Kekaisaran Austria-Hungaria dan bergabung dengan Mitteleuropa.\n"
 GER_expatriate_the_communists:0 "Usir Kaum Komunis"
 GER_expatriate_the_communists_desc:0 "Ancaman internal komunisme terus menghantui bangsa kita. Kita harus membebaskan diri darinya, ke mana pun para pengikutnya melarikan diri."
 GER_accept_british_naval_dominance:0 "Terima Dominasi Angkatan Laut Inggris"
 GER_accept_british_naval_dominance_desc:0 "Kita membutuhkan sekutu untuk memerangi komunisme, dan Inggris adalah kandidat utama. Kita akan meredakan kekhawatiran mereka dengan menerima keunggulan angkatan laut mereka dan menolak pembangunan angkatan laut besar-besaran, demi meningkatkan hubungan."
 GER_ally_the_shade:0 "Aliansi dengan Sang Bayangan"
 GER_ally_the_shade_desc:0 "Jika kita tidak dapat mengambil tempat mereka di bawah matahari, maka kita akan bersekutu dengan mereka yang menebarkan bayangan di atas kita."
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Kuasa Penuh atas Alsace dan Koloni Prancis"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Kita harus memohon kepada sekutu baru kita untuk memberi kita kebebasan penuh dalam merebut kembali wilayah sah kita di Alsace-Lorraine, serta bagian koloni Afrika kita yang adil."
 GER_bypass_maginot_in_the_south:0 "Putari Maginot di Selatan"
 GER_bypass_maginot_in_the_south_desc:0 "Inggris memiliki kepentingan di Negara-Negara Rendah, sehingga kita harus mencari rute alternatif memutari Maginot. Jalur selatan, meskipun bergunung-gunung dan sulit dilalui, harus mencukupi. Kecerdikan Jerman akan membawa kita melewatinya."
 GER_see_to_the_eastern_front:0 "Urus Front Timur"
 GER_see_to_the_eastern_front_desc:0 "Jika kita mempelajari sesuatu dari Perang Besar, itu adalah bahwa kita harus bersiap menghadapi serangan terhadap wilayah terluar timur kita. Wilayah-wilayah ini harus dipulihkan dan dibentengi dari invasi."
 GER_see_to_the_eastern_front_tt:1 "Tambahkan 6 §YBenteng Darat§! di 3 provinsi di perbatasan timur.\n"
 GER_see_to_the_eastern_front_tt2:1 "Tambahkan 8 §YBenteng Darat§! di 4 provinsi di perbatasan timur.\n"
 GER_danzig_for_guarantees:0 "Danzig Ditukar Jaminan"
 GER_danzig_for_guarantees_desc:2 "Bangsa Polandia tentu harus merasakan bahaya dari [GER.GetDanzigGuaranteesBolsheviksDesc] di timur. Kita akan menawarkan untuk menjamin kemerdekaan mereka, dengan syarat mereka menyerahkan kendali atas Danzig kepada kita."
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_COMMUNIST:0 "kaum Bolshevik"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_FASCISM:0 "kaum Fasis di Timur"
 SOV_DANZIG_GUARANTEES_BOLSHEVIKS_DESC_NEUTRALITY:0 "kekaisaran Rusia"
 SOV_DANZIG_GUARANTEES_REDS_DESC_COMMUNIST:0 "dari kaum Merah"
 SOV_DANZIG_GUARANTEES_REDS_DESC_NEUTRALITY:0 "dari Timur"
 GER_safeguard_the_baltic:0 "Lindungi Wilayah Baltik"
 GER_safeguard_the_baltic_desc:1 "Negara-negara Baltik adalah bagian dari Kekaisaran Rusia hingga beberapa dekade lalu, dan masih tetap berada di bawah bayang-bayang panjangnya. Kita akan menawarkan untuk menjamin kemerdekaan mereka, agar mereka tidak ditelan oleh beruang Rusia."
 GER_support_the_finns:0 "Dukung Bangsa Finlandia"
 GER_support_the_finns_desc:1 "Bangsa Finlandia mendapati diri mereka berada di garis tembak [GER.GetRussiansDemonym]. Kita harus menawarkan bantuan militer dan material untuk memastikan mereka dapat mempertahankan kedaulatan mereka."
 GER_anti_comintern_pact_unaligned:0 "Pertahanan Ideologis"
 GER_anti_comintern_pact_unaligned_desc:0 "Ancaman militer bukanlah satu-satunya bahaya yang kita hadapi. Kita harus memperkuat benteng ideologis kita dari racun propaganda komunis."
 GER_anti_soviet_pact_unaligned:1 "Resmikan Perjanjian"
 GER_anti_soviet_pact_unaligned_desc:1 "Kita harus bersiap menghadapi konflik militer dengan komunisme dengan mengundang semua penandatangan untuk membentuk koalisi pertahanan bersama."
 GER_tackle_the_communist_threat:1 "Hadapi Ancaman [GER.GetTackleCommunistThreatName]"
 GER_tackle_the_communist_threat_desc:1 "Selama [SOV.GetNameDef] masih ada, ia akan selalu menjadi ancaman bagi kita. Daripada menunggu mereka menyerang, kita harus mengambil inisiatif untuk melenyapkan bahaya ini."
 SOV_TACKLE_COMMUNIST_THREAT_NAME_COMMUNIST:0 "Komunis"
 SOV_TACKLE_COMMUNIST_THREAT_NAME_EXILES:0 "Timur"
 GER_the_iberian_problem:0 "Masalah Iberia"
 GER_the_iberian_problem_desc:0 "Benteng komunisme masih tersisa di Eropa Barat Daya. Kita harus memastikan semua ancaman ini dicabut hingga ke akarnya, dimulai dari semenanjung Iberia."
 GER_spain_wargoal_tt:0 "Mendapatkan tujuan perang §YAneksasi§! terhadap §YSpanyol Republik§!.\n"
 GER_reestablish_free_elections:0 "Pulihkan Pemilu Bebas"
 GER_reestablish_free_elections_desc:0 "Kita akan kembali ke cita-cita demokrasi dengan memulihkan pemilihan umum yang bebas, guna mengembalikan kedaulatan sejati kepada rakyat Jerman."
 GER_the_monarchy_compromise:0 "Kompromi Monarki"
 GER_the_monarchy_compromise_desc:0 "Militer yang memperjuangkan kebebasan kita dari tirani Nazi memiliki kecenderungan royalis yang jelas. Kita dapat mencapai kompromi dengan mempertahankan monarki konstitusional yang dibatasi oleh hukum."
 GER_the_great_red_menace:1 "Ancaman Besar Kaum [GER.GetGreatRedMenaceName]"
 GER_the_great_red_menace_desc:1 "Tindakan kita dalam perang sebelumnya masih segar dalam ingatan banyak pihak. Kita harus meyakinkan tetangga kita bahwa ancaman terbesar bagi Eropa saat ini datang dari [GER.GetGreatRedMenaceDesc]."
 SOV_GREAT_RED_MENACE_NAME_COMMUNIST:0 "Merah"
 SOV_GREAT_RED_MENACE_NAME_EXILES:0 "Timur"
 SOV_GREAT_RED_MENACE_DESC_COMMUNIST:0 "ancaman komunis"
 SOV_GREAT_RED_MENACE_DESC_EXILES:0 "ancaman imperialisme Rusia"
 GER_central_european_alliance:0 "Aliansi Eropa Tengah"
 GER_central_european_alliance_desc:0 "Kini setelah kita memusatkan perhatian benua ini pada masalah utama, kita harus memimpin pembentukan Aliansi Eropa Tengah untuk menjaga perdamaian dan kemakmuran bersama."
 GER_central_european_alliance_tt:0 "Jika tidak berada dalam faksi:\n"
 GER_danubian_membership:0 "Keanggotaan Donau"
 GER_danubian_membership_desc:1 "Negara-negara penerus lembah Donau dari Kekaisaran Austria-Hungaria belum melupakan bahaya ekspansi dari timur. Kita harus mengundang mereka bergabung dalam aliansi kita."
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST:0 "komunisme"
 SOV_DANUBIAN_MEMBERSHIP_DESC_EXILES:0 "agresi timur"
 GER_danubian_expansion:0 "Perluasan Donau"
 GER_danubian_expansion_desc:1 "Kita harus berupaya memperluas pengaruh kita ke negara-negara Balkan yang rentan terhadap agresi [SOV.GetAdjective]."
 invite_non_fascist_communist_only_TT:1 "Mengharuskan calon negara anggota untuk tidak berideologi fasis atau komunis dan tidak berada dalam faksi lain."
 GER_no_balkan_communism:0 "Tolak Komunisme Balkan"
 GER_no_balkan_communism_desc:0 "Pengaruh komunis telah merayap ke wilayah Balkan, yang tidak boleh kita biarkan. Pengaruh ini harus dibersihkan demi stabilitas benua."
 GER_no_balkan_communism_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap negara-negara komunis di Balkan.\n"
 GER_no_balkan_communism_HUN_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YRepublik Rakyat Hungaria§!.\n"
 GER_no_balkan_communism_ROM_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YRepublik Rakyat Rumania§!.\n"
 GER_no_balkan_communism_YUG_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YRSF Yugoslavia§!.\n"
 GER_no_balkan_communism_BUL_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YRepublik Rakyat Bulgaria§!."
 GER_low_countries_membership:0 "Keanggotaan Negara-Negara Rendah"
 GER_low_countries_membership_desc:0 "Meskipun jauh dari perbatasan timur Eropa, Negara-Negara Rendah menyadari pentingnya keamanan kolektif dalam menghadapi potensi konflik global."
 GER_no_reds_in_western_europe:0 "Tolak Kaum Merah di Eropa Barat"
 GER_no_reds_in_western_europe_desc:0 "Pengaruh komunis telah merayap ke Eropa Barat, yang tidak boleh kita biarkan. Komunisme harus diberantas dari perbatasan barat kita."
 GER_no_reds_in_western_europe_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap negara-negara komunis di Negara-Negara Rendah dan Prancis.\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YKomune Prancis§!.\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YProvinsi Bersatu Rakyat§!.\n"
 GER_no_reds_in_western_europe_BEL_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YKoperasi Belgia§!.\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "Mendapatkan tujuan perang §YGulingkan Pemerintah§! terhadap §YRosa Luksemburg§!.\n"
 GER_scandinavian_membership:0 "Keanggotaan Skandinavia"
 GER_scandinavian_membership_desc:1 "Gunung dan dinginnya cuaca bukanlah perlindungan mutlak dari ancaman [GER.GetGreatRedMenaceName]. Kita harus mengundang negara-negara Skandinavia ke dalam barisan kita."
 GER_baltic_membership:0 "Keanggotaan Baltik"
 GER_baltic_membership_desc:1 "Selama dua dekade, negara-negara Baltik hidup di bawah bahaya mematikan aneksasi ulang oleh [SOV.GetBalticMembershipDesc]. Bergabung dengan aliansi kita adalah jaminan terbaik bagi kelangsungan hidup mereka."
 SOV_BALTIC_MEMBERSHIP_DESC_COMMUNIST:0 "komunisme"
 SOV_BALTIC_MEMBERSHIP_DESC_EXILES:0 "imperialisme [SOV.GetAdjective]"
 GER_polish_membership:0 "Keanggotaan Polandia"
 GER_polish_membership_desc:1 "Bangsa Polandia memiliki banyak alasan untuk mencurigai para tetangganya, namun mereka tahu ancaman terbesar bagi kedaulatan mereka datang dari Timur. Bersama-sama, kita dapat berdiri teguh."
 GER_finnish_membership:0 "Keanggotaan Finlandia"
 GER_finnish_membership_desc:1 "Jauh dari pusat Eropa, bangsa Finlandia berisiko menghadapi [GER.GetFinnishMembershipDesc] sendirian. Kita harus merangkul mereka ke dalam aliansi kita."
 SOV_FINNISH_MEMBERSHIP_DESC_COMMUNIST:0 "kaum Merah"
 SOV_FINNISH_MEMBERSHIP_DESC_EXILES:0 "orang-orang Rusia"
 GER_strike_at_the_source:0 "Serang ke Sumbernya"
 GER_strike_at_the_source_desc:1 "Hidup dalam ketakutan bukanlah kehidupan yang sejati; kita harus mengakhiri ancaman ini terhadap cara hidup kita dengan menyerang langsung ke sarang musuh."
 GER_swedish_trade_agreement: "Perjanjian Dagang Jerman-Swedia"
 GER_swedish_trade_agreement_desc: "Baja kita berkualitas rendah, dan untuk menggerakkan industri kita membutuhkan bahan baku terbaik yang dapat ditawarkan oleh tambang-tambang Swedia."
 SOV_STRIKE_AT_THE_SOURCE_DESC_COMMUNIST:0 "pengaruh komunis"
 SOV_STRIKE_AT_THE_SOURCE_DESC_EXILES:0 "imperialisme Rusia"
 GER_reverse_the_brain_drain:0 "Balikkan Eksodus Intelektual"
 GER_reverse_the_brain_drain_desc:0 "Kini setelah rezim tiran disingkirkan, kita dapat mengajak kembali para ilmuwan, pemikir, dan akademisi terbaik kita yang melarikan diri ke luar negeri."
 GER_shared_rd_programs:0 "Program Litbang Bersama"
 GER_shared_rd_programs_desc:0 "Demi kebaikan bersama, kita harus menyatukan pengetahuan ilmiah kita dan berbagi kemajuan teknologi dengan para sekutu."
 GER_the_mannheim_project:0 "Proyek Mannheim"
 GER_the_mannheim_project_desc:1 "Dengan pabrik Air Berat di Norwegia kini berada dalam jangkauan kerja sama kita, kita dapat melipatgandakan upaya untuk membuka rahasia tenaga atom."
 GER_the_mannheim_project_tt:0 "Fokus ini memberikan imbalan berbeda tergantung pada tingkat Riset Atom saat ini."
 GER_pool_technical_know_how:0 "Kumpulkan Keahlian Teknis"
 GER_pool_technical_know_how_desc:0 "Setiap bangsa memiliki metode unik dalam mengelola industri dan merawat perlengkapan. Menyatukan keahlian ini akan menguntungkan seluruh aliansi."
 GER_pool_technical_know_how_tt: "Setiap §YBangsa§! di §YFaksi§! kita juga akan menerima §YSemangat Nasional§! ini."
 ITA_ethiopian_war_logistics:0 "Logistik Perang Etiopia"
 ITA_ethiopian_war_logistics_desc:0 "Kita mungkin meremehkan situasi logistik untuk penaklukan gemilang kita atas Etiopia. Kita harus segera menyelesaikan pasokan dan infrastruktur di Afrika Timur."
 ITA_fortification_effort:0 "Upaya Benteng Pertahanan"
 ITA_fortification_effort_desc:0 "Kita harus mempertahankan pantai dan perbatasan kita dari agresi kekaisaran kolonial yang memudar dan dekaden."
 ITA_fortification_effort_forts:0 "Tambahkan §Y15 Benteng Darat§! di perbatasan Prancis.\n"
 ITA_army_primacy:0 "Keutamaan Angkatan Darat"
 ITA_army_primacy_desc:0 "Secara industri, Italia masih tertinggal di belakang imperium kolonial dekaden. Kita harus berfokus memodernisasi tentara darat kita terlebih dahulu."
 ITA_modernized_artillery:0 "Artileri Termodernisasi"
 ITA_modernized_artillery_desc:0 "Regio Esercito, secara teori, adalah salah satu tentara terbesar di dunia. Sayangnya, banyak artileri kita yang masih berasal dari sisa Perang Besar. Saatnya memperbaruinya."
 ITA_modernized_army:0 "Angkatan Darat Termodernisasi"
 ITA_modernized_army_desc:0 "Artileri yang lebih baik akan meningkatkan efisiensi tempur kita secara signifikan, namun kita juga harus memodernisasi taktik infanteri dan doktrin komando."
 ITA_armored_effort:0 "Upaya Kendaraan Lapis Baja"
 ITA_armored_effort_desc:0 "Bertempur di Etiopia memang berjalan lancar, namun tanket kita sama sekali tidak memenuhi standar perang modern Eropa. Kita membutuhkan tank sungguhan."
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Sumber daya kita terbatas dan kita harus membuat pilihan sulit, namun Imperium Inggris telah mengurung kita di Mediterania. Mendobrak keluar akan membutuhkan angkatan laut yang mampu menyaingi armada mereka..."
 ITA_carrier_effort:0 "Upaya Kapal Induk"
 ITA_carrier_effort_desc:0 "Armada tempur modern akan berpusat pada kapal induk, bukan kapal tempur. Kita harus mulai merancang kapal induk pertama kita."
 ITA_capital_ships:0 "Upaya Kapal Utama"
 ITA_capital_ships_desc:0 "Bangsa dengan kapal tempur paling perkasa akan menguasai Mediterania. Kita tidak boleh membiarkan Royal Navy mendominasi laut kita sendiri."
 ITA_bomber_effort:0 "Upaya Pesawat Pengebom"
 ITA_bomber_effort_desc:0 "Era di mana tentara dapat memenangkan perang tanpa memandang ke angkasa telah berlalu. Kita harus membangun armada pengebom yang ditakuti musuh."
 ITA_atlantic_fleet:0 "Armada Atlantik"
 ITA_atlantic_fleet_desc:0 "Begitu kita berhasil mendobrak keluar dari kurungan Inggris di Mediterania, kita harus mampu memproyeksikan kekuatan kita melintasi Samudra Atlantik."
 ITA_marines_and_landing_craft:0 "Marinir dan Kapal Pendarat"
 ITA_marines_and_landing_craft_desc:0 "Perang laut tidak dapat dimenangkan hanya dengan kapal perang; kita juga harus mampu mendaratkan pasukan kita di pantai-pantai pulau musuh."
 ITA_jet_engine_effort:0 "Upaya Mesin Jet"
 ITA_jet_engine_effort_desc:0 "Italia harus menjadi yang terdepan dalam pengembangan mesin jet berkat kecerdikan para insinyur penerbangan kita seperti Campini."
 ITA_light_ship_effort:0 "Upaya Kapal Ringan"
 ITA_light_ship_effort_desc:0 "Konvoi menuju wilayah seberang laut kita membutuhkan perlindungan ketat. Kita perlu mengembangkan kapal perusak dan kapal torpedo baru yang lincah."
 ITA_escort_effort:0 "Upaya Kapal Pengawal"
 ITA_escort_effort_desc:0 "Kita harus meningkatkan upaya untuk melindungi konvoi rentan kita di perairan Mediterania dari serangan bawah air musuh."
 ITA_sea_wolves:0 "Serigala Laut"
 ITA_sea_wolves_desc:0 "Sekutu Jerman kita telah mengembangkan kapal selam yang luar biasa efisien dan taktik 'kawanan serigala'. Kita harus belajar dari keberhasilan mereka."
 ITA_slovenia_dalmatia_claims:0 "Klaim atas Yugoslavia"
 ITA_slovenia_dalmatia_claims_desc:0 "Masih terdapat populasi Italia yang signifikan di Dalmatia dan pantai Adriatik, sejak zaman Republik Venesia. Wilayah-wilayah ini harus kembali ke pangkuan Italia."
 ITA_slovenia_dalmatia_claims_threat:0 "Klaim Italia atas Yugoslavia"
 ITA_yugoslavia_friend:0 "Berteman dengan Yugoslavia"
 ITA_yugoslavia_friend_desc:0 "Daripada memusuhi Yugoslavia sekarang, kita dapat menunda penaklukannya dan membujuk mereka masuk ke lingkaran pengaruh kita untuk mengamankan Adriatik."
 ITA_support_nationalist_spain:0 "Dukung Spanyol Nasionalis"
 ITA_support_nationalist_spain_desc:0 "Spanyol tengah berada di tengah perang saudara yang akan menentukan apakah mereka akan menjadi sekutu fasis atau musuh komunis di sayap barat kita. Kita harus mengirim bantuan penuh kepada Franco."
 ITA_demand_balearic_islands:0 "Tuntut Kepulauan Balears"
 ITA_demand_balearic_islands_desc:0 "Setelah membuktikan dukungan militer kita bagi rezim Franco, kita berada dalam posisi untuk meminta kendali atas Kepulauan Balears sebagai pangkalan laut strategis."
 ITA_bulgaria_friend:0 "Berteman dengan Bulgaria"
 ITA_bulgaria_friend_desc:0 "Bulgaria berada dalam lingkup pengaruh tradisional kita. Keselarasan mereka dengan Roma adalah kunci dominasi kita di kawasan Balkan."
 ITA_albania_war_goal:1 "Pendudukan Albania"
 ITA_albania_war_goal_desc:1 "Albania adalah sasaran empuk untuk diduduki pasukan kita. Ini akan memberi kita batu loncatan yang tak ternilai harganya menuju Balkan dan Yunani."
 ITA_pact_of_steel:0 "Pakta Baja"
 ITA_pact_of_steel_desc:0 "Hubungan kita dengan Jerman Nasional Sosialis diperkuat oleh kedekatan ideologi dan musuh bersama. Aliansi militer formal akan menggetarkan seluruh Eropa."
 ITA_germ_italy_same_tt:0 "§YItalia§! dan §YJerman§! memiliki §YIdeologi§! yang sama."
 ITA_german_millitary_cooperation:0 "Kerja Sama Militer Jerman"
 ITA_german_millitary_cooperation_desc:0 "Melalui kerja sama erat dengan militer Jerman yang kuat, kita dapat memadukan keunggulan taktis dan perindustrian kedua bangsa Poros."
 ITA_claims_on_france:0 "Klaim atas Prancis"
 ITA_claims_on_france_desc:0 "Rebut wilayah dari Prancis Vichy. Dengan penaklukan Paris oleh Jerman dan pemerintahan baru yang lemah di Prancis, sudah saatnya kita menuntut Nice, Savoy, dan Korsika."
 ITA_claims_on_france_tt:0 "§YPrancis Vichy§! ada dan mengendalikan §YSavoy§! dan §YKorsika§!"
 ITA_go_after_france:0 "Hajar Prancis"
 ITA_go_after_france_desc:0 "Prancis... satu lagi demokrasi reaksioner di Barat yang selalu berusaha menghalangi kebangkitan bangsa Italia. Saatnya menuntaskan perhitungan sejarah."
 ITA_claims_on_turkey:0 "Klaim atas Turki"
 ITA_claims_on_turkey_desc:0 "Perjanjian London 1915 menjanjikan wilayah Anatolia di Turki kepada Italia sebagai imbalan keterlibatan dalam perang. Janji itu tidak pernah ditepati, dan sekarang saatnya menuntut hak kita."
 ITA_italy_first:0 "Italia yang Utama"
 ITA_italy_first_desc:1 "Duce kita yang mulia tidak akan pernah menjadi bawahan Hitler! Kita harus memimpin faksi kita sendiri dan mengejar takdir kekaisaran Romawi secara mandiri."
 ITA_romania_friend:0 "Berteman dengan Rumania"
 ITA_romania_friend_desc:0 "Sangat menguntungkan bagi kita untuk merangkul saudara Latin kita yang jauh di Rumania ke dalam orbit diplomatik Roma."
 ITA_german_rd_treaty:0 "Perjanjian Riset dengan Jerman"
 ITA_german_rd_treaty_desc:0 "Kita harus mengajak Jerman bertukar rahasia teknologi demi keuntungan persenjataan kedua negara."
 ITA_spanish_italian_faction:0 "Aliansi Spanyol-Italia"
 ITA_spanish_italian_faction_desc:0 "Franco dan kaum nasionalis Spanyol adalah sekutu alami kita, disatukan oleh agama, budaya Latin, dan penolakan terhadap komunisme."
 ITA_italian_highways:0 "Jalan Raya Italia"
 ITA_italian_highways_desc:0 "Kita perlu memperluas jaringan jalan tol Autostrada untuk memastikan mobilitas pasukan dan logistik yang cepat di seluruh semenanjung."
 ITA_libyan_infrastructure:0 "Infrastruktur Libya"
 ITA_libyan_infrastructure_desc:0 "Wilayah kita yang luas di Afrika Utara masih tertinggal. Kita harus membangun jalan raya pesisir 'Via Balbia' dan pelabuhan modern di Tripoli dan Tobruk."
 ITA_greece_war_goal:0 "Perang dengan Yunani"
 ITA_greece_war_goal_desc:0 "Kekaisaran Romawi macam apa yang kita pulihkan jika tidak mencakup Yunani? Wilayah mereka harus tunduk di bawah kekuasaan Roma."
 ITA_greece_friend:0 "Berteman dengan Yunani"
 ITA_greece_friend_desc:0 "Bangsa Yunani adalah sesama bangsa kuno dan buaian peradaban Barat. Lebih baik membawa mereka ke faksi kita secara damai."
 ITA_turkey_friend:0 "Berteman dengan Turki"
 ITA_turkey_friend_desc:0 "Orang-orang Turki mungkin mewaspadai kita, namun kerja sama diplomatik yang pragmatis dapat mengamankan sayap timur laut Mediterania kita."
 ITA_portugal_friend:0 "Berteman dengan Portugal"
 ITA_portugal_friend_desc:0 "Portugal di bawah Salazar memiliki pandangan korporatis yang selaras dengan kita. Kita harus merangkul mereka ke dalam tatanan Mediterania kita."
 ITA_anti_uk_war_goals:0 "Perang dengan Inggris"
 ITA_anti_uk_war_goals_desc:0 "Imperium Inggris yang membusuk mengurung kita di dalam Mediterania melalui Gibraltar dan Suez. Mereka tidak akan pernah melepaskannya secara sukarela; kita harus merebutnya dengan senjata!"
 ITA_japan_friend:0 "Berteman dengan Jepang"
 ITA_japan_friend_desc:0 "Bangsa Jepang sangat mirip dengan kita; kekuatan muda yang haus ekspansi dengan semangat juang tinggi. Aliansi dengan mereka akan mengalihkan perhatian musuh-musuh kita di Asia."
 soviet_focus:0 "Fokus Nasional Soviet"
 #SOV_finish_five_year_plan:0 "Finish the Five Year Plan"
 #SOV_finish_the_five_year_plan_desc:0 "The second Five Year Plan prioritizes the development of heavy industry. The Soviet Union must develop quickly in order to match the Capitalist and Fascist powers of the West."
 SOV_move_industry_to_urals:0 "Pindahkan Industri ke Pegunungan Ural"
 SOV_move_industry_to_urals_desc:0 "Kaum Hitleris pengkhianat tidak boleh dibiarkan merebut pabrik-pabrik berharga kita di barat. Kita harus mengevakuasi seluruh kompleks industri ke balik Pegunungan Ural yang aman."
 SOV_defense_of_moscow:0 "Pertahanan Moskow"
 SOV_defense_of_moscow_desc:0 "Kaum Fasis sudah mengetuk gerbang ibu kota! Moskow tidak boleh jatuh dengan cara apa pun; setiap jengkal tanah akan dipertahankan hingga tetes darah terakhir!"
 SOV_defense_of_moscow_forts:0 "Tambahkan §Y28 Benteng Darat§! di dalam dan sekitar Moskow.\n"
 SOV_infrastructure_effort:0 "Upaya Infrastruktur"
 SOV_infrastructure_effort_desc:1 "[ROOT.GetNameDefCap] sangat luas namun sebagian besar belum terbangun. Kita harus memastikan jalur transportasi ke seluruh penjuru negeri berjalan lancar."
 SOV_tranformation_of_nature:0 "Transformasi Alam"
 SOV_tranformation_of_nature_desc:0 "Rencana Besar Stalin untuk Transformasi Alam harus dijalankan. Pembangunan kanal, irigasi, dan penanaman hutan penahan angin akan menundukkan alam di bawah kehendak sosialisme."
 SOV_stalin_constitution:0 "Konstitusi Stalin"
 SOV_stalin_constitution_desc:0 "Sudah saatnya memperbarui konstitusi lama kita dan memukau dunia dengan hak-hak progresif kaum buruh di bawah payung Sosialisme."
 #SOV_collectivist_propaganda:0 "Collectivist Propaganda"
 #SOV_collectivist_propaganda_desc:0 "In the Soviet Union, there is no room for individual glory. Our propaganda should strongly emphasize collective efforts; surpassed production goals, successful expeditions and massive construction projects."
 SOV_militarized_schools:0 "Sekolah Termiliterisasi"
 SOV_militarized_schools_desc:0 "Anak-anak Soviet harus ditanamkan disiplin militer dan kebajikan Sosialis sejak bangku sekolah demi kesiapan mempertahankan tanah air."
 SOV_workers_culture:0 "Kebudayaan Buruh"
 SOV_workers_culture_desc:0 "Sosialisme bukan sekadar sistem ekonomi dan Marxisme bukan sekadar sains; kita harus menciptakan kebudayaan proletariat baru yang membebaskan jiwa rakyat dari dekadensi borjuis."
 SOV_new_soviet_man:0 "Manusia Soviet Baru"
 SOV_new_soviet_man_desc:0 "Manusia Soviet Baru adalah sosok yang tanpa pamrih, terpelajar, berdisiplin baja, dan berbadan sehat; perwujudan hidup dari kemenangan komunisme atas kelemahan manusiawi."
 #SOV_positive_heroism:0 "Positive Heroism"
 #SOV_positive_heroism_desc:0 "It is time to move on from the old Leninist collectivist propaganda and transform various exceptional individuals into larger-than-life Heroes of Socialism!"
 SOV_progress_cult:0 "Pemujaan Kemajuan"
 SOV_progress_cult_desc:0 "Kita harus mengagungkan inovasi para ilmuwan teladan Soviet dan mendorong rakyat untuk memecahkan rekor produksi baru demi kejayaan Ibu Pertiwi."
 SOV_socialist_science:0 "Sains Sosialis"
 SOV_socialist_science_desc:0 "Dunia, sebagaimana pikiran, terus bergerak. Alam berada dalam kondisi perubahan terus-menerus, dan sains sosialis kita akan memimpin kemanusiaan menuju pemahaman materi yang sejati."
 SOV_aviation_cult:0 "Kultus Penerbangan"
 SOV_aviation_cult_desc:0 "Uni Soviet akan memukau dunia dengan pencapaian penerbangan yang mencengangkan. Elang-elang Soviet kita akan terbang lebih tinggi, lebih cepat, dan lebih jauh daripada siapa pun!"
 SOV_women_pilots:0 "Perempuan dalam Penerbangan"
 SOV_women_pilots_desc:0 "Kamerad Raskova, penerbang jarak jauh kita yang heroik, harus diberi wewenang untuk membentuk resimen tempur khusus wanita untuk menghajar musuh dari angkasa."
 SOV_night_witches_tt:0 "Resimen Pengebom Malam ke-588 menjadi aktif di Moskow."
 #SOV_socialist_realism:0 "Socialist Realism"
 #SOV_socialist_realism_desc:0 "All works of art in the Soviet Union must strive to educate the people in the goals and meaning of Communism, depicting the proletariat in realistic and typical scenes of everyday life. Soviet artists are the engineers of souls!"
 SOV_improve_railway_network:0 "Tingkatkan Jaringan Kereta Api"
 SOV_improve_railway_network_desc:0 "Rencana Lima Tahun Pertama kita terbukti terlalu berhasil. Ekspansi industri berat yang masif menuntut rel kereta api ganda dan lokomotif yang lebih bertenaga untuk mengangkut jutaan ton muatan."
 SOV_transpolar_flights:0 "Penerbangan Transpolar"
 SOV_transpolar_flights_desc:0 "Para penerbang paling berani kita membuktikan bahwa rute berbahaya melintasi kutub utara dapat ditaklukkan oleh ketangguhan teknologi dan manusia Soviet."
 SOV_ocean_going_navy:0 "Angkatan Laut Samudra"
 SOV_ocean_going_navy_desc:0 "Meskipun Uni Soviet memiliki luas daratan yang lebih besar dari negara mana pun di bumi, samudra dunia belum dikuasai oleh kapal-kapal kita. Kapal tempur berlapis baja tebal akan menjadi bagian dari armada samudra masa depan kita."
 SOV_peoples_commissariat:0 "Bentuk PCDI"
 SOV_peoples_commissariat_desc:0 "Komisariat Rakyat untuk Industri Pertahanan Uni Soviet (PCDI) akan menjadi kementerian industri berat yang berfokus pada proyek-proyek militer kita. Dalam jangka panjang, beban kerja mungkin memerlukan pembagian kementerian lebih lanjut."
 SOV_anti_fascist_diplomacy:0 "Diplomasi Anti-Fasis"
 SOV_anti_fascist_diplomacy_desc:0 "Meskipun semua rezim Barat represif dan korup, tidak ada yang lebih berbahaya daripada para monster fasis di Berlin dan Roma. Kita harus membangun front bersama untuk membendung mereka."
 SOV_operation_zet:0 "Operasi Zet"
 SOV_operation_zet_desc:0 "Meskipun Kuomintang bersifat reaksioner, perlawanan mereka terhadap imperialisme Jepang sangat penting. Kita harus mengirimkan pesawat tempur, persenjataan, dan penasihat militer untuk membantu mereka."
 SOV_annex_tannu_tuva:0 "Aneksasi Tannu Tuva"
 SOV_annex_tannu_tuva_desc:0 "Meskipun secara ekonomi tidak begitu berpengaruh, secara politik dan teritorial kita harus secara resmi mengintegrasikan Tannu Tuva ke dalam Uni Soviet."
 SOV_improve_stalin_line:0 "Tingkatkan Garis Stalin"
 SOV_improve_stalin_line_desc:0 "Perbatasan barat kita harus terlindungi lebih baik dari agresi kaum fasis. Garis pertahanan Stalin harus diperkuat dengan bunker beton dan artileri berat."
 #SOV_far_east_fortification:0 "Far East Fortification"
 #SOV_far_east_fortification_desc:0 "The Japanese are constantly making incursions across the border with Manchuria. We must improve our defenses along that frontier in order to deter them permanently."
 SOV_far_east_fortification_forts_1:0 "Tambahkan §Y6 Benteng Darat§! di perbatasan Jepang.\n"
 SOV_far_east_fortification_forts_2:0 "Tambahkan §Y8 Benteng Darat§! di perbatasan Jepang.\n"
 SOV_far_east_fortification_forts_3:0 "Tambahkan §Y4 Benteng Darat§! di perbatasan Jepang.\n"
 SOV_xian_incident:0 "Insiden Xi'an"
 SOV_xian_incident_desc:0 "Melalui kontak kita dengan para pejabat penting di Tiongkok, kita harus mendorong gencatan senjata dan pembentukan Front Persatuan Nasional antara Nasionalis dan Komunis untuk melawan penjajah Jepang."
 SOV_xian_incident_tt:0 "Jika kedua pihak setuju, akan memaksakan gencatan senjata antara Tiongkok Nasionalis dan Komunis."
 SOV_anti_capitalist_diplomacy:0 "Diplomasi Anti-Kapitalis"
 SOV_anti_capitalist_diplomacy_desc:0 "Penghalang utama bagi revolusi global tidak diragukan lagi adalah para bankir gendut dan imperialis Barat di London, Paris, dan New York."
 SOV_expand_red_fleet:0 "Perluas Armada Merah"
 SOV_expand_red_fleet_desc:0 "Armada Merah saat ini masih sangat lemah dibandingkan angkatan laut negara-negara imperialis. Kita harus membangun kapal perang modern untuk melindungi perairan Soviet."
 SOV_anti_colonialist_rebels:0 "Komintern"
 SOV_anti_colonialist_rebels_desc:0 "Dengan sistem kapitalis yang memasuki keruntuhan akhirnya, strategi yang benar adalah mengobarkan perang pembebasan nasional dan pemberontakan anti-kolonial di seluruh dunia."
 SOV_southern_thrust:0 "Serbuan ke Selatan"
 SOV_southern_thrust_desc:0 "Mengamankan Iran dan Irak tidak hanya akan menjamin cadangan minyak raksasa bagi Revolusi, namun juga memberi kita akses langsung yang telah lama didambakan ke Samudra Hindia."
 #SOV_reconcile_japan:0 "Reconcile Japan"
 #SOV_reconcile_japan_desc:0 "Our relations with Japan have always been troubled, but there are bigger fish to fry. By exploiting their desperate lack of natural resources, the Japanese could be led by the nose... Their anachronistic feudal regime is bound to fall soon anyway."
 SOV_claim_on_sinkiang:0 "Klaim Sinkiang"
 SOV_claim_on_sinkiang_desc:0 "Di bawah kepemimpinan Kamerad Sheng Shicai, Sinkiang sudah menjadi sekutu dekat Soviet. Sudah saatnya meresmikan hubungan ini demi keamanan perbatasan timur."
 SOV_claim_on_sinkiang_threat:0 "Soviet Mengklaim Sinkiang"
 SOV_pan_slavic_rhetoric:0 "Retorika Pan-Slavia"
 SOV_pan_slavic_rhetoric_desc:0 "Kita dapat memanfaatkan ikatan persaudaraan Slavia di Eropa Timur untuk menggalang solidaritas melawan penindasan asing dan menyatukan bangsa-bangsa di bawah kepemimpinan Soviet."
 SOV_claims_on_baltic:0 "Klaim di Baltik"
 SOV_claims_on_baltic_desc:0 "Pyotr yang Agung benar dalam upayanya mencari akses pelabuhan air hangat di barat. Negara-negara Baltik harus dikembalikan ke dalam pangkuan kita untuk mengamankan Leningrad."
 SOV_claim_bessarabia:0 "Klaim atas Bessarabia"
 SOV_claim_bessarabia_desc:0 "Laut Hitam sangat vital bagi perekonomian dan keamanan kita. Bessarabia yang dicaplok secara tidak sah oleh Rumania harus dikembalikan ke tanah air Soviet."
 SOV_claims_on_turkey:0 "Klaim atas Turki"
 SOV_claims_on_turkey_desc:0 "Pihak Turki berulang kali menolak tuntutan sah kita untuk kendali bersama atas Selat Bosporus. Kita harus bersiap menegakkan hak strategis kita dengan paksa."
 #SOV_baltic_security:0 "Baltic Security"
 #SOV_baltic_security_desc:0 "The Baltic is our front yard and must be protected at all costs. Karelia must be seized to give Leningrad a secure buffer zone, and the self-rule of Estonia is just ridiculous!"
 #SOV_claims_on_poland:0 "Claims on Poland"
 #SOV_claims_on_poland_desc:0 "The display of incompetence and embarrassment that was the Soviet-Polish war must be avenged and eastern Poland reintegrated into the USSR!"
 #SOV_demand_eastern_poland:0 "Demand Eastern Poland"
 #SOV_demand_eastern_poland_desc:0 "Having reasserted our right to Poland's eastern territories, we should make clear that they can only save themselves from another partition by handing them over peacefully."
 #SOV_offer_poland_protection:0 "Offer Poland Protection"
 #SOV_offer_poland_protection_desc:0 "Although we could simply seize eastern Poland, it would be much preferable if they joined our Comintern in the process. We would need to offer something in return for our claims, however. If we promise them eastern Germany, they might be interested."
 SOV_offer_poland_protection_tt:0 "§YPolandia akan diberikan negara bagian yang diklaim melalui perjanjian ini jika Uni Soviet menang.§!\n"
 SOV_great_purge:0 "Pembersihan Besar (The Great Purge)"
 SOV_great_purge_bypass_tt:0 "Trotsky menjadi pemimpin Uni Soviet"
 SOV_great_purge_desc:0 "Ada konspirasi berbahaya pengikut Trotsky yang merayap di kalangan perwira; bahkan di jajaran tertinggi militer dan partai! Kita harus membersihkan unsur-unsur pengkhianat ini tanpa ampun demi keselamatan negara buruh."
 SOV_great_purge_tt:0 "Serangkaian §Ypengadilan terbuka§! akan diadakan untuk membersihkan para menteri dan jenderal yang dicurigai sebagai pengikut Trotsky."
 SOV_great_purge_tt2:3 "Jumlah pembersihan yang diselesaikan akan memengaruhi kemungkinan meletusnya kembali §Yperang saudara§!."
 SOV_permanent_revolution:0 "Revolusi Permanen"
 SOV_permanent_revolution_tt:0 "Trotsky telah kembali"
 SOV_permanent_revolution_tt2:0 "§YTrotsky§! memperoleh sifat pemimpin yang lebih baik."
 SOV_permanent_revolution_desc:0 "Demagog tiran telah tiada! Kekuasaan sejati telah dipulihkan kepada dewan-dewan soviet buruh dan prajurit, dan api revolusi dunia siap dikobarkan kembali!"
 #SOV_rehabilitated_military:0 "Rehabilitated Military"
 #SOV_rehabilitated_military_desc:0 "With the taint of Trotskyism finally cleansed from the officer corps, it might be possible to allow the military some freedom from political interference again."
 #SOV_military_reorganization:0 "Military Reorganization"
 #SOV_military_reorganization_desc:0 "The Purge has not left the military in a good state. The new leadership is green and ineffective, and no work has been done to develop our doctrines. We must rectify this situation immediately!"
 #SOV_nkvd_primacy:0 "NKVD Primacy"
 #SOV_nkvd_primacy_desc:0 "The military has shown that it can never be trusted. Therefore, the NKVD will need to be expanded and given greater powers, with more political commissars to keep an eye on the officers."
 SOV_nkvd_divisions:0 "Divisi NKVD"
 SOV_nkvd_divisions_desc:0 "NKVD harus memiliki divisi tempur khususnya sendiri untuk bertindak sebagai Pasukan Internal, menjaga keamanan garda belakang, dan memberantas sabotase kontra-revolusi."
 #SOV_lessons_of_war:0 "Lessons Of War"
 #SOV_lessons_of_war_desc:0 "With the experiences gained fighting limited wars, we should be able to make some breakthroughs in armored warfare, and perhaps even finally whip the depleted officer corps into shape!"
 #SOV_smersh:0 "SMERSH"
 #SOV_smersh_desc:0 "SMERSH, or 'Death to Spies', is a proposed counter-intelligence initiative that would serve a dual purpose; rooting out enemy spies and executing deserters and partisans within the ranks of the Red Army."
 SOV_smersh_tt:0 "§YMenghilangkan risiko kudeta.§!\n"
 SOV_partisan_suppression:0 "Penindasan Partisan"
 SOV_partisan_suppression_desc:0 "SMERSH harus diperluas untuk mampu menyusup dan menindak tegas mata-mata musuh, desertir, dan kelompok gerilyawan anti-Soviet di wilayah garis belakang."
 SOV_war_with_germany:0 "Perang dengan Jerman"
 SOV_war_with_germany_desc:0 "Ancaman Jerman fasis terus membesar. Kita mampu dan harus menghancurkan mesin perang Wehrmacht sebelum mereka sempat melancarkan serangan kejutan ke tanah air kita."
 SOV_war_with_germany_tt:0 "Pakta Molotov-Ribbentrop tidak berlaku"
 SOV_war_with_japan:0 "Perang dengan Jepang"
 SOV_has_not_officers_purged_tt:0 "Tidak memiliki semangat nasional §YPerwira Dibersihkan§!"
 SOV_war_with_japan_desc:0 "Tampaknya kaum militeris Jepang tidak berniat mundur di perbatasan timur. Satu-satunya pencegah yang efektif adalah kekerasan senjata; kita harus membalas kekalahan 1905!"
 SOV_war_with_uk:0 "Perang dengan Inggris"
 SOV_war_with_uk_desc:0 "Kaum imperialis Inggris tidak pernah menghormati negara kaum buruh. Tidak diragukan lagi bahwa konfrontasi akhir antara kapitalisme dan sosialisme tidak dapat dihindarkan."
 SOV_claim_on_the_straits:0 "Klaim atas Selat Turki"
 SOV_claim_on_the_straits_desc:0 "Selat yang menghubungkan Laut Hitam ke Laut Aegea adalah titik strategis paling krusial bagi Armada Laut Hitam. Kita harus menuntut hak lintas bebas dan pangkalan di sana."
 SOV_ultimatum_to_greece:0 "Ultimatum kepada Yunani"
 SOV_ultimatum_to_greece_desc:0 "Kepulauan Aegea adalah bidak strategis terakhir yang kita butuhkan untuk memastikan Armada Merah dapat mengamankan rute keluar ke Mediterania."
 SOV_diversify_the_programme:0 "Diversifikasi Program Riset"
 SOV_diversify_the_programme_desc:0 "Kita telah belajar banyak dalam beberapa tahun terakhir dan kemajuan telah dicapai dalam bidang-bidang mutakhir yang membutuhkan fokus institusional baru."
 SOV_research_city_experiment:0 "Eksperimen Kota Riset"
 SOV_research_city_experiment_desc:0 "Salah satu ilmuwan terkemuka kita, Kurchatov, telah mengamati bahwa pemisahan isotop nuklir dan proyek rahasia lainnya membutuhkan fasilitas ilmiah terpadu berskala besar."
 SOV_closed_city_network:0 "Jaringan Kota Tertutup"
 SOV_closed_city_network_desc:0 "Kita harus mendirikan kota-kota tertutup (Naukograd) untuk penelitian rahasia militer dan nuklir yang tidak tercatat di peta umum."
 strike_usa_focus:0 "Serang Amerika Serikat!"
 strike_usa_focus_desc:0 "Orang-orang Amerika yang licik mengurung kita dengan embargo minyak dan bahan mentah. Kita harus melancarkan serangan dahsyat mendadak untuk melumpuhkan armada pasifik mereka!"
 chinese_puppet_focus:0 "Boneka Tiongkok"
 chinese_puppet_focus_desc:1 "Para pemimpin Tiongkok mungkin bersedia bekerja sama jika diberi ilusi otonomi di bawah pemerintahan boneka yang setia kepada Tokyo."
 chinese_war_focus:0 "Perang dengan Tiongkok"
 chinese_war_focus_desc:0 "Insiden Jembatan Marco Polo membuktikan bahwa kaum Nasionalis Tiongkok menolak ketertiban baru Asia. Kekuatan militer Kekaisaran harus menaklukkan mereka dengan tegas."
 subdue_warlords_focus:0 "Tundukkan Para Panglima Perang"
 subdue_warlords_focus_desc:0 "Kelemahan Tiongkok diperparah oleh para panglima perang regional yang terpecah belah. Kita dapat menundukkan atau membeli kesetiaan mereka satu per satu."
 oust_germans_focus:0 "Putuskan Hubungan Tiongkok-Jerman"
 oust_germans_focus_desc:0 "Para penasihat militer Jerman seperti von Falkenhausen telah membantu tentara Chiang Kai-shek. Kita harus menekan Berlin untuk segera menarik mereka kembali."
 found_own_faction_focus:0 "Bentuk Faksi Sendiri"
 found_own_faction_focus_desc:1 "Kita telah memulai langkah menuju pembentukan Kawasan Kemakmuran Bersama Asia Timur Raya, di bawah kepemimpinan agung Kekaisaran Jepang."
 axis_leanings_focus:0 "Condong ke Blok Poros"
 axis_leanings_focus_desc:0 "Kita memiliki banyak kesamaan kepentingan dan nilai dengan Jerman dan Italia yang baru, yang sedang merombak tatanan lama dunia."
 subvert_india_focus:0 "Tentara Nasional India"
 subvert_india_focus_desc:0 "Jika Inggris menentang pembentukan kekaisaran kita, kita akan membakar halaman belakang mereka dengan mendanai dan mempersenjatai para pejuang kemerdekaan India pimpinan Subhas Chandra Bose."
 jap_improved_sprit_focus:0 "Semangat Nasional yang Disempurnakan"
 jap_improved_sprit_focus_desc:0 "Kebanggaan nasionalis dan kesetiaan mutlak kepada Kaisar berkobar dalam jiwa setiap rakyat Kekaisaran Jepang."
 befriend_siam_focus:0 "Berteman dengan Siam"
 befriend_siam_focus_desc:0 "Siam telah menghindari penjajahan Eropa dan mendambakan kembali wilayah mereka yang hilang. Aliansi erat akan memberi kita akses darat strategis menuju Malaya dan Burma."
 army_primancy_focus:0 "Keutamaan Angkatan Darat"
 army_primancy_focus_desc:0 "Dari dua cabang angkatan bersenjata utama kita, Angkatan Darat Kekaisaran (IJA) adalah lengan perkasa yang akan menaklukkan daratan Asia."
 JAP_army_primancy_focus_bypass_tt:0 "Slot bangunan tidak cukup untuk §YPabrik Militer§! di wilayah tanah air."
 jap_sia_love:0 "Diplomasi Jepang-Siam"
 jap_sia_love_desc:0 "Jepang telah memfokuskan upaya diplomatiknya untuk mempererat hubungan kerja sama pertahanan dengan Siam."
 navy_primancy_focus:0 "Keutamaan Angkatan Laut"
 JAP_navy_primancy_focus_bypass_tt:0 "Slot bangunan tidak cukup untuk §YGalangan Kapal Angkatan Laut§! di wilayah tanah air."
 navy_primancy_focus_desc:0 "Dari dua cabang angkatan bersenjata utama kita, Angkatan Laut Kekaisaran (IJN) adalah perisai dan tombak yang akan menguasai seluruh Samudra Pasifik."
 army_innovations_focus:0 "Inovasi Angkatan Darat"
 army_innovations_focus_desc:0 "Kini setelah Angkatan Darat diakui sebagai dinas utama Kekaisaran, sudah menjadi kewajiban kita untuk mengembangkan taktik pertempuran darat modern."
 army_air_innovations_focus:0 "Inovasi Udara Angkatan Darat"
 army_air_innovations_focus_desc:0 "Misi utama dinas penerbangan haruslah memberikan dukungan tembakan langsung dan perlindungan udara bagi pasukan infanteri kita!"
 army_motorization_focus:0 "Motorisasi Angkatan Darat"
 army_motorization_focus_desc:0 "Fokus yang lebih besar pada motorisasi akan meningkatkan kecepatan gerak infanteri melintasi medan tempur Asia yang luas dan menantang."
 air_base_expansion_focus:0 "Perluasan Pangkalan Udara"
 air_base_expansion_focus_desc:0 "Untuk mendukung Angkatan Darat dengan lebih baik, dinas penerbangan membutuhkan pangkalan udara garis depan yang lebih besar dan lengkap."
 armor_innovations_focus:0 "Inovasi Lapis Baja"
 armor_innovations_focus_desc:0 "Dengan Angkatan Darat yang semakin berjaya, sejumlah jenderal menyarankan agar kita berinvestasi pada tank medium yang lebih tahan banting dan bersenjata kuat."
 naval_innovations_focus:0 "Inovasi Angkatan Laut"
 naval_innovations_focus_desc:0 "Kini setelah Angkatan Laut diakui sebagai dinas utama Kekaisaran, kita harus melipatgandakan riset taktik pertempuran laut dan kapal perang generasi baru."
 naval_air_innovations_focus:0 "Inovasi Udara Angkatan Laut"
 naval_air_innovations_focus_desc:0 "Misi utama penerbangan angkatan laut adalah menguasai langit samudra dan menghancurkan armada kapal induk musuh dari jarak jauh!"
 convoy_protection_focus:0 "Perlindungan Konvoi"
 convoy_protection_focus_desc:0 "Meskipun merupakan taktik pengecut, musuh kita pasti akan mencoba menyerang kapal dagang kita. Kita harus menyempurnakan taktik anti-kapal selam."
 advanced_torpedoes_focus:0 "Torpedo Mutakhir"
 advanced_torpedoes_focus_desc:0 "Dengan menggunakan oksigen murni terkompresi pada sistem penggerak torpedo Tipe 93 'Long Lance', senjata kita akan memiliki daya jelajah, kecepatan, dan daya ledak tak tertandingi tanpa meninggalkan jejak gelembung."
 shbb_focus:0 "Kapal Tempur Super Berat"
 shbb_focus_desc:0 "Dalam jangka pendek kecil kemungkinan kita dapat mengungguli jumlah kapal Inggris atau Amerika. Oleh karena itu, kita harus membangun kapal tempur terbesar dan terkuat di dunia: kelas Yamato!"
 naval_base_focus:0 "Perluasan Pangkalan Angkatan Laut"
 naval_base_focus_desc:0 "Ekspansi armada laut membutuhkan pangkalan laut, dok kering, dan fasilitas perbaikan yang lebih luas di kepulauan pasifik."
 carrier_focus:0 "Fokus Kapal Induk"
 carrier_focus_desc:0 "Jepang membutuhkan angkatan laut yang dahsyat, dan Kapal Induk harus menjadi tulang punggung kekuatan serang Armada Gabungan kita."
 battleship_focus:0 "Fokus Kapal Tempur"
 battleship_focus_desc:0 "Jepang membutuhkan angkatan laut yang dahsyat, dan Kapal Tempur meriam raksasa harus menjadi inti pemukul dalam 'Pertempuran Penentuan' (Kantai Kessen)."
 spiritual_mobilization_focus:0 "Mobilisasi Spiritual"
 spiritual_mobilization_focus_desc:0 "Seluruh bangsa kita, bukan hanya para prajurit, harus dipersiapkan secara rohani untuk menghadapi pengorbanan perang suci."
 warrior_traditions_focus:0 "Tradisi Ksatria (Bushido)"
 warrior_traditions_focus_desc:0 "Sepanjang sejarah, Jepang mempertahankan kode etik kehormatan Bushido yang unik. Menghidupkan kembali semangat ini akan membuat prajurit kita tak kenal takut."
 divine_wind_focus:0 "Angin Dewa (Kamikaze)"
 divine_wind_focus_desc:0 "Menghadapi kematian tanpa gentar adalah kewajiban setiap samurai. Namun, jika situasi menuntut, pengorbanan jiwa demi Kaisar akan menjadi badai penolong bangsa bagaikan Kamikaze."
 imperial_glory_focus:0 "Kejayaan Kekaisaran"
 imperial_glory_focus_effect:0 "Mengaktifkan produksi §HYokosuka MXY7 Ohka§!"
 imperial_glory_focus_desc:0 "Taktik serangan khusus Kamikaze telah mengubah serangan bunuh diri menjadi senjata presisi yang mematikan bagi kapal perang musuh."
 student_movement_focus:0 "Gerakan Mahasiswa"
 student_movement_focus_desc:0 "Kementerian Pendidikan adalah bagian yang sama pentingnya dalam Mobilisasi Spiritual untuk mengarahkan pemikiran generasi muda demi kejayaan bangsa."
 extra_tech_focus:0 "Riset Tambahan"
 synth_oil_focus:0 "Fokus Minyak Sintetis"
 synth_oil_focus_desc:0 "Produksi minyak kita sendiri sangat terbatas dan impor membuat kita berada di bawah belas kasihan kekuatan asing. Kita harus memajukan industri minyak sintetis."
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan tersedia sebagai konsorsium industri"
 secret_weapon_focus:0 "Senjata Mutakhir"
 secret_weapon_focus_desc:0 "Sebagai kekaisaran maritim, kita harus selalu berada di garis depan sains militer, termasuk penelitian radar, roket, dan senjata rahasia."
 industrial_effort_focus:0 "Penghematan Kekaisaran"
 industrial_effort_focus_desc:0 "Setiap rakyat Kaisar harus berhemat dan berkorban demi membiayai kebutuhan industri perang negara."
 industrial_effort_focus2:0 "Upaya Industri"
 industrial_effort_focus2_desc:0 "Jepang baru saja mengalami industrialisasi, dan kita harus terus mengejar kapasitas manufaktur raksasa-raksasa Barat."
 infra_effort_focus:0 "Upaya Infrastruktur"
 infra_effort_focus_desc:0 "Membangun infrastruktur di kepulauan bergunung-gunung kita memang tidak mudah, namun jaringan transportasi modern sangat krusial."
 fortress_japan_focus:0 "Benteng Jepang"
 fortress_japan_focus_desc:0 "Jika musuh berhasil menembus barisan armada kita, benteng-benteng pesisir pulau utama akan membuat setiap upaya pendaratan musuh berakhir dengan pertumpahan darah."
 crypto_bomb_focus:0 "Bom Kriptologi"
 crypto_bomb_focus_desc:0 "Para matematikawan Polandia telah mengembangkan mesin cemerlang yang mereka sebut 'Bomba Kriptologi' untuk memecahkan kode Enigma. Kita harus mempelajari prinsip ini untuk memecahkan sandi musuh kita."
 tizard_mission_focus:0 "Misi Tizard"
 tizard_mission_focus_desc:0 "Kita telah menghasilkan banyak terobosan ilmiah seperti magnetron rongga yang tidak dapat kita produksi secara massal sendirian. Misi Tizard ke Amerika Serikat akan menukar rahasia teknologi ini dengan kapasitas manufaktur raksasa mereka."
 maud_focus:0 "Komite MAUD"
 maud_focus_desc:0 "Komite 'Military Application of Uranium Detonation' yakin bahwa bom atom berbasis fisi uranium dapat dibangun sebelum perang berakhir. Kita harus mendanai penelitian perintis ini."
 general_rearmament_focus:0 "Persenjataan Kembali Umum"
 general_rearmament_focus_desc:1 "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "Tampaknya Perang Besar berikutnya tidak dapat dihindari. Jika bukan Hitler di Jerman, maka ancaman di tempat lain yang akan memicu konflik. Kita harus segera mempersenjatai kembali angkatan bersenjata kita."
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "Para pendahulu kita telah terlalu lama mengabaikan kesiapan militer bangsa. Kita harus segera memulai program persenjataan kembali secara menyeluruh."
 air_defense_focus:0 "Pertahanan Udara"
 air_defense_focus_tt:1 "Tambahkan maksimal §YAnti-Udara§! di §YEast Anglia§!, §YSussex§!, dan §YSouth-West England§!"
 air_defense_focus_bypass_tt:0 "Slot bangunan tidak cukup untuk §YAnti-Udara§!"
 air_defense_focus_desc:0 "Tidak ada keraguan dari mana pesawat musuh akan datang; kita harus melindungi langit Inggris Selatan dan kepulauan Britania dengan meriam penangkis serangan udara terpadu."
 radar_focus:0 "RADAR"
 radar_focus_desc:0 "Kemampuan mendeteksi pesawat pengebom musuh dari jauh sebelum mereka mencapai pantai kita akan sangat krusial bagi pertahanan nasional. Kita harus mendirikan stasiun Chain Home di sepanjang pesisir."
 royal_ordinance_focus:2 "[Root.GetRoyalOrdnanceFactoriesName]"
 royal_ordinance_focus_desc:1 "[Root.GetRoyalOrdnanceFactoriesDesc]"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "Pabrik Persenjataan Kerajaan"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Pabrik Persenjataan Revolusioner"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "Gudang Senjata Kerajaan di Woolwich sama sekali tidak memadai untuk memproduksi semua amunisi yang dibutuhkan angkatan darat kita yang berkembang pesat. Kita harus mendirikan pabrik-pabrik amunisi baru yang tersebar di wilayah yang aman."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "Gudang Senjata Revolusioner di Woolwich sama sekali tidak memadai untuk memproduksi semua amunisi yang dibutuhkan angkatan darat rakyat kita yang berkembang pesat. Kita harus mendirikan pabrik-pabrik persenjataan rakyat yang baru."
 shadow_scheme_focus:0 "Skema Pabrik Bayangan (Shadow Scheme)"
 shadow_scheme_focus_desc:0 "Kementerian Udara telah mengajukan gagasan cemerlang untuk membiayai pabrik-pabrik sipil otomotif agar siap beralih secara instan memproduksi mesin pesawat tempur saat perang pecah."
 shadow_scheme_focus_tt:1 "Memberikan §G4§! Slot Bangunan dan §Y4 Pabrik Militer§! secara total di dua negara bagian pedalaman Inggris."
 uk_small_arms_focus:0 "Perusahaan BSA"
 uk_small_arms_focus_desc:1 "[Root.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Pabrik Persenjataan Kerajaan tidak memproduksi cukup senjata ringan, namun seperti yang kita lakukan di masa lalu, kita dapat mengontrak pabrik swasta seperti Birmingham Small Arms Company untuk memproduksi senapan Lee-Enfield dan senapan mesin."
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Pabrik Persenjataan Revolusioner tidak memproduksi cukup senjata ringan, namun kita dapat memobilisasi bengkel-bengkel kerja seperti Birmingham Small Arms untuk memenuhi kebutuhan senjata rakyat."
 UK_secret_focus:0 "Senjata Rahasia"
 UK_secret_focus_desc:0 "Kita kini memiliki pengetahuan dan infrastruktur untuk berfokus pada pengembangan teknologi mutakhir di bidang komputasi, elektronik radar, dan propulsi roket."
 air_rearmament_focus:0 "Persenjataan Kembali Udara"
 air_rearmament_focus_desc:1 "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "Dalam perang apa pun dengan musuh di daratan Eropa, Royal Air Force akan menjadi kunci kemenangan. Kita harus memprioritaskan pembaruan pesawat-pesawat kita."
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "Dalam perang apa pun dengan musuh di daratan Eropa, Angkatan Udara Rakyat akan menjadi kunci kemenangan kita. Kita harus memodernisasi sayap udara revolusi."
 fighter_command_focus:0 "Komando Pesawat Tempur (Fighter Command)"
 fighter_command_focus_desc:0 "Prioritas utama kita adalah menguasai langit kita sendiri! Pesawat Spitfire dan Hurricane yang dipandu oleh radar akan mematahkan serangan musuh."
 bomber_command_focus:0 "Komando Pengebom (Bomber Command)"
 bomber_command_focus_desc:0 "Sebagaimana pepatah doktrin Douhet: 'Pengebom akan selalu berhasil menembus!'. Kita harus membalas setiap serangan ke tanah air kita dengan menghancurkan kota dan pabrik musuh."
 coastal_command_focus:0 "Komando Pesisir (Coastal Command)"
 coastal_command_focus_desc:1 "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Industri kita digerakkan oleh bahan mentah yang dikapalkan ke Britania dari berbagai penjuru imperium yang jauh. Pesawat patroli maritim jarak jauh sangat vital untuk melindungi jalur pelayaran ini dari U-boat."
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "Industri kita digerakkan oleh sumber daya yang dikapalkan ke Britania dari berbagai penjuru dunia. Komando Pesisir harus mengamankan jalur pasokan laut kita dari ancaman kapal selam kapitalis."
 aircraft_production_focus:0 "Grup Produksi Pesawat"
 aircraft_production_focus_desc:0 "Produksi pesawat terbang tetap menjadi prioritas tertinggi kita. Grup Produksi Pesawat London dan dewan produksi nasional akan mengoordinasikan standardisasi suku cadang."
 uk_jet_focus:0 "Pesawat Jet"
 uk_jet_focus_desc:0 "Tampaknya hampir pasti bahwa mesin jet rancangan Frank Whittle akan menggantikan mesin baling-baling pada pesawat tempur masa depan. Kita harus menjadi yang pertama menerbangkannya ke medan tempur."
 naval_rearmament_focus:0 "Persenjataan Kembali Angkatan Laut"
 naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "Meskipun kita mencoba mencegah perlombaan senjata angkatan laut dengan Perjanjian London Kedua, kegagalan Jepang dan Italia untuk menandatanganinya berarti kita harus memperluas Royal Navy."
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "Meskipun kita mencoba mencegah perlombaan senjata angkatan laut dengan Perjanjian London Kedua, kegagalan Jepang dan Italia untuk menandatanganinya berarti kita harus memperluas Angkatan Laut Republik."
 uk_destroyer_focus:0 "Fokus Kapal Perusak"
 uk_destroyer_focus_desc:0 "Kapal tempur modern memang mengagumkan, namun kita tidak boleh mengabaikan kapal perusak serbaguna yang melindungi armada dan konvoi kita."
 uk_convoy_focus:0 "Fokus Pengawalan Konvoi"
 uk_convoy_focus_desc:0 "Tidak bisa dipungkiri lagi, konvoi pelayaran adalah urat nadi kehidupan bangsa kepulauan kita. Kita harus memastikan kapal-kapal dagang kita dikawal dengan aman."
 uk_waves_focus:0 "Britannia Menguasai Samudra"
 uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "Di laut lepas, tidak ada bangsa yang mampu menandingi keperkasaan Royal Navy. Kita akan menegaskan kembali supremasi maritim kita."
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "Di laut lepas, armada rakyat akan mengakhiri dominasi para imperialis dan memastikan kebebasan lautan bagi semua bangsa."
 uk_carrier_focus:0 "Fokus Kapal Induk"
 uk_carrier_focus_desc:0 "Terdapat perdebatan sengit di antara para teoretikus angkatan laut mengenai kelangsungan kapal tempur versus kapal induk. Kita harus berinvestasi pada kapal induk modern seperti kelas Illustrious."
 uk_spain_focus:0 "Paksa Spanyol"
 uk_spain_focus_desc:0 "Bangsa Spanyol memahami betul kekuatan Royal Navy, namun mungkin mereka perlu diingatkan kembali. Tekanan diplomatik dan ekonomi akan memastikan mereka tetap netral atau condong kepada kita."
 uk_battleship_focus:0 "Fokus Kapal Tempur"
 uk_battleship_focus_desc:0 "Meskipun para teoretikus berdebat, tidak ada yang dapat menandingi keagungan dan daya hancur kapal tempur meriam raksasa kelas King George V."
 uk_turkey_focus:0 "Paksa Turki"
 uk_turkey_focus_desc:0 "Mereka tidak harus mencintai kita, namun pihak Turki harus cukup gentar terhadap kekuatan armada kita agar mematuhi konvensi selat."
 uk_amphibious_focus:0 "Perang Amfibi"
 uk_amphibious_focus_desc:0 "Menguasai samudra memang hebat, namun terkadang kita harus mendaratkan pasukan di pantai musuh. Kita harus mengembangkan kapal pendarat dan pasukan komando."
 singapore_focus:0 "Strategi Singapura"
 singapore_focus_desc:0 "Singapura harus tetap menjadi pangkalan angkatan laut utama kita di Timur. Mengamankannya adalah jaminan keselamatan dominion kita di Pasifik."
 sp_landward_forts_focus:0 "Benteng Sisi Darat"
 sp_landward_forts_focus_desc:0 "Pertahanan saat ini di Pulau Singapura tidak memadai dari arah utara. Kita harus membangun benteng pertahanan menghadap daratan Malaya."
 peninsular_focus:0 "Perang Semenanjung"
 peninsular_focus_desc:0 "Kita harus mencegah dan memperlambat musuh yang datang dari utara melalui Semenanjung Malaya."
 hongkong_focus:0 "Pertahankan Hong Kong"
 hongkong_focus_desc:0 "Meskipun berada dalam posisi rentan di depan pintu Tiongkok, Hong Kong adalah permata mahkota imperium. Kita harus memperkuat garis pertahanan Gin Drinkers."
 hk_landward_forts_focus:0 "Benteng Sisi Darat"
 hk_landward_forts_focus_desc:0 "Hong Kong harus menjadi kota benteng agar mampu menahan pengepungan dari daratan Tiongkok."
 hk_air_focus:0 "Pertahanan Udara"
 hk_air_focus_desc:0 "Kita harus memperluas dan meningkatkan penempatan meriam anti-udara di Hong Kong secara besar-besaran."
 uk_embargo_focus:0 "Kebijakan Embargo"
 uk_embargo_focus_desc:0 "Cara terbaik untuk mengalahkan para diktator - baik merah maupun cokelat - adalah dengan memutus perdagangan internasional mereka."
 uk_sanction_italy_focus:0 "Sanksi Italia"
 uk_sanction_italy_focus_desc:0 "Mussolini memimpikan Kekaisaran Romawi baru dan mungkin akan menyerang tetangganya. Kita harus memimpin Liga Bangsa-Bangsa untuk memberlakukan sanksi ekonomi."
 uk_sanction_japan_focus:0 "Sanksi Jepang"
 uk_sanction_japan_focus_desc:0 "Pihak Jepang berkomitmen membentuk 'Kawasan Kemakmuran Bersama Asia Timur Raya' dengan menaklukkan tetangga mereka. Kita harus menghentikan pengiriman material strategis ke sana."
 uk_burma_focus:0 "Jalan Burma (Burma Road)"
 uk_burma_focus_desc:0 "Kita harus membantu Tiongkok dalam perjuangan mereka melawan agresi Jepang dengan membangun dan mengamankan Jalan Burma sebagai jalur pasokan vital."
 uk_scandinavian_focus:0 "Intervensi Skandinavia"
 uk_scandinavian_focus_desc:0 "Skandinavia memiliki nilai strategis vital karena pengiriman bijih besi Swedia ke Jerman melalui Narvik. Kita harus bersiap melakukan intervensi jika perlu."
 uk_iraq_focus:0 "Amankan Irak"
 uk_iraq_focus_desc:0 "Mengingat situasi global saat ini, kita harus mengamankan ladang minyak Mosul dan pangkalan udara Habbaniya di Irak dari pengaruh Poros."
 uk_iran_focus:0 "Amankan Iran"
 uk_iran_focus_desc:0 "Iran tidak hanya kaya akan minyak yang tidak boleh jatuh ke tangan musuh, namun juga merupakan koridor pasokan darat vital ke Uni Soviet."
 uk_free_india_focus:0 "Kemerdekaan India"
 uk_free_india_focus_desc:0 "Menghadapi ancaman perang, kita harus menawarkan jalur menuju status Dominion atau kemerdekaan bertahap kepada para pemimpin India demi menjamin kerja sama penuh mereka."
 uk_colonial_focus:0 "Dorong Elit Kolonial"
 uk_colonial_focus_desc:0 "Imperium kita yang luas menampung beberapa pemikir dan pemimpin terbaik. Kita harus melibatkan elit lokal untuk memperkuat kesetiaan dan ketertiban."
 uk_asia_focus:0 "Bentengi Asia Timur"
 uk_asia_focus_desc:0 "Banyak koloni lama kita di timur terancam oleh meningkatnya militerisme Jepang. Kita harus segera memperkuat pertahanan pos-pos terdepan kita."
 uk_china_focus:0 "Pengaruhi Tiongkok"
 uk_china_focus_desc:0 "Meskipun kaum nasionalis Tiongkok sering mengkritik pengaruh Barat, mereka membutuhkan bantuan kita dalam menghadapi invasi Jepang. Kita dapat memanfaatkan jalur Burma Road."
 uk_commonwealth_focus:0 "Ikatan Persemakmuran"
 uk_commonwealth_focus_desc:0 "Disatukan oleh kesetiaan bersama pada Mahkota dan nilai-nilai kebebasan, negara-negara Persemakmuran akan berdiri bahu-membahu dalam menghadapi bahaya apa pun."
 uk_india_focus:0 "Kembangkan Raj"
 uk_india_focus_desc:0 "Status India tetap menjadi perdebatan politik, namun potensi industri dan sumber daya manusianya sangat raksasa. Memodernisasi perkeretaapian dan pabrik di sana akan menguntungkan upaya perang kita."
 northern_expansion_focus:0 "Ekspansi ke Utara"
 northern_expansion_focus_desc:0 "Doktrin Ekspansi ke Utara yang didukung oleh Angkatan Darat Kekaisaran mendikte bahwa musuh utama kita adalah Uni Soviet dan bahwa kita harus merebut Siberia."
 southern_expansion_focus:0 "Ekspansi ke Selatan"
 southern_expansion_focus_tt:0 "Tambahkan §Ypakta non-agresi§! dengan §YUni Soviet§! saat dipilih\n"
 southern_expansion_focus_desc:0 "Doktrin Ekspansi ke Selatan yang didukung oleh Angkatan Laut mendikte bahwa sasaran utama kita adalah kepulauan kaya minyak di Asia Tenggara dan Pasifik."
 new_ideas:0 "Menteri Baru tersedia.\n"
 available_political_advisor:0 "§GTersedia§! sebagai §YPenasihat Politik§!:\n"
 available_chief_of_army:0 "§GTersedia§! sebagai §YKepala Staf Angkatan Darat§!:\n"
 available_chief_of_navy:0 "§GTersedia§! sebagai §YKepala Staf Angkatan Laut§!:\n"
