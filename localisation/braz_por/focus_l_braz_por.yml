 SOV_nkvd_upgrade_tooltip:1 "§YNKVD§! kini terintegrasi lebih erat dalam tentara kita, memastikan pengawasan politik yang ketat.\n"
 ger_sov_buddies_tooltip_2:0 "Ini akan membubarkan [Root.GetFactionName] dan membentuk §YPoros Berlin-Moskow§!.\n"
 ger_sov_buddies_tooltip:2 "§RJika bangsa [SOV.GetAdjective] menerima tawaran kita, kita akan mengalami sedikit kehilangan prestise diplomatik.§!"
 purged_kalinin:0 "Dibersihkan oleh Stalin"
 purged_khrushchev:0 "Dibersihkan oleh Stalin"
 purged_yezhov:0 "Dibersihkan oleh Stalin"
 purged_beria:0 "Dibersihkan oleh Stalin"
