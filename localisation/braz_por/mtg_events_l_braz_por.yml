l_braz_por:
 flag_mexico_cedillo_has_revolted: "Jenderal Cedillo telah memberontak melawan pemerintah"
 mexico.1.title: "Pemberontakan Jenderal Cedillo"
 mexico.1.desc: "Selama beberapa waktu, para jenderal dan gubernur telah melihat kekuatan pribadi mereka menghilang karena pemerintah pusat menjadi lebih baik dalam mengendalikan caudillo yang sulit diatur. Sejarah pemberontakan di Meksiko yang dilakukan oleh panglima perang regional tampaknya akan segera berakhir. Sayangnya, kita gagal mengambil tindakan terhadap Jenderal Cedillo dari San Luis Potosi, dan dia telah mempertahankan cukup banyak pemberontak dan bandit kejam yang telah diampuni untuk mencoba menggulingkan pemerintah pusat, menggulingkan [Root.GetLeader], dan mencegah kekuasaan lagi lolos dari genggamannya."
 mexico.1.a: "Pengkhianat!"
 mexico.2.title: "[From.GetAdjective] Minyak Nasionalisasi"
 mexico.2.desc: "[From.GetLeader] telah mengobarkan omong kosong populis yang ditujukan terhadap kepentingan ekonomi kita di Meksiko, dan sekarang [From.GetRulingPartyLong] telah mengeluarkan undang-undang untuk menasionalisasi aset Royal Dutch Shell, Standard Oil of California, dan banyak perusahaan minyak internasional lainnya! Meskipun Konstitusi mereka mengizinkan tindakan ini, keadilan internasional menuntut kompensasi atas kerugian yang diderita oleh perusahaan-perusahaan tersebut. Para raja minyak menuntut kita bertindak."
 mexico.2.a: "Ini adalah sebuah fait accompli, tidak ada yang bisa kita lakukan."
 mexico.2.b: "Kami akan mengembargo perdagangan dengan Meksiko sampai mereka sadar."
 mexico.2.c: "Pilihan kita terbatas, dan kekuatan senjata harus dipertimbangkan."
 mexico.3.title: "[From.GetAdjective] Embargo"
 mexico.3.desc: "Menanggapi nasionalisasi kami atas konsesi minyak mereka, [From.GetLeader] telah memutuskan untuk menerima tuntutan perusahaan minyak dan telah melakukan embargo terhadap negara kami. [From.GetNameDef] tidak akan lagi membeli atau menjual sumber daya dengan kami. Kita harus mempertimbangkan untuk memberikan kompensasi kepada perusahaan-perusahaan minyak, atau meninggalkan status quo internasional dan mencari peruntungan bersama musuh-musuh kapitalisme liberal."
 mexico.3.a: "Rakyat Meksiko tidak akan menerima hal ini!"
 mexico.4.title: "[From.GetAdjective] Kompensasi"
 mexico.4.desc: "Pemerintah [From.GetLeader] telah menyetujui tuntutan kompensasi dari Royal Dutch Shell dan Standard Oil of California sebagai imbalan atas kerugian yang diderita perusahaan-perusahaan tersebut selama nasionalisasi ladang minyak. Meskipun [From.GetNameDef] tidak akan mengembalikan konsesi minyak apa pun, setidaknya prestise nasional dan kepentingan finansial kita terpuaskan."
 mexico.4.a: "Bagus, kita bisa berdagang dengan persyaratan ini."
 mexico.4.b: "Pertahankan embargo, kami menunggu kesepakatan yang lebih baik."
 mexico.8.title: "[From.GetAdjective] Masuk Ke [Root.GetFactionName]"
 mexico.8.desc: "[From.GetLeader] telah mengajukan permintaan untuk bergabung dengan [Root.GetFactionName]. Entah apakah ia mencari perlindungan bersama atau melakukan ekspansi ke luar negeri, masih belum diketahui, namun minyak Meksiko adalah aset yang menguntungkan bagi kita."
 mexico.8.a: "Kami akan mensponsori masuknya Meksiko ke [Root.GetFactionName]."
 mexico.8.b: "Kami punya rencana lain untuk Meksiko."
 mexico.9.title: "Masuknya Meksiko ke [Root.GetFactionName]"
 mexico.9.desc: "[From.GetLeader] telah mensponsori permintaan dari Meksiko untuk masuk ke [Root.GetFactionName]. Belum diketahui apakah Meksiko ingin saling melindungi atau melakukan ekspansi ke luar negeri, namun minyak Meksiko adalah aset yang menguntungkan bagi kita."
 mexico.9.a: "Kami akan mensponsori masuknya Meksiko ke [Root.GetFactionName]."
 mexico.9.b: "Kami punya rencana lain untuk Meksiko."
 mexico.10.title: "[From.GetFactionName]"
 mexico.10.desc: "[From.GetLeader] telah mengundang [Root.GetNameDef] untuk bergabung dengan [From.GetFactionName]. Blok negara-negara sayap kanan ini akan membela Amerika Latin dari infiltrasi Komunis, sambil mengambil jalur independen dari Yanquis yang dekaden."
 mexico.10.a: "[Root.GetLeader] menerima usulan tersebut."
 mexico.10.b: "Amerika tidak akan mendukung rencana seperti itu."
 mexico.11.title: "[From.GetFactionName]"
 mexico.11.desc: "[From.GetLeader] telah mengundang [Root.GetNameDef] untuk bergabung dengan [From.GetFactionName]. Blok negara-negara sayap kiri ini akan membela Amerika Latin dari tirani Fasis, sambil mengambil jalan independen dari Yanquis yang menindas."
 mexico.11.a: "[Root.GetLeader] menerima usulan tersebut."
 mexico.11.b: "Amerika tidak akan mendukung rencana seperti itu."
 mexico.12.title: "Penjualan Honduras Inggris"
 mexico.12.desc: "[From.GetLeader] telah meminta agar [Root.GetNameDef] menjual wilayah kecil Honduras Britania, terkadang disebut Belize. Kerajaan Spanyol mengklaim wilayah tersebut tetapi tidak pernah menduduki wilayah tersebut, sehingga Meksiko hanya mempunyai sedikit klaim nyata atas wilayah tersebut. Namun, kami dapat menjual wilayah tersebut kepada teman-teman Meksiko kami sebagai bentuk itikad baik."
 mexico.12.a: "[Root.GetLeader] menerima usulan tersebut."
 mexico.12.b: "Wilayah itu berguna sebagai pangkalan angkatan laut."
 mexico.13.title: "Inggris Menyerahkan Belize"
 mexico.13.desc: "[From.GetLeader] telah setuju untuk menyerahkan kendali atas bekas jajahan Inggris Honduras kepada kami sebagai bentuk itikad baik. Negara bagian ini kecil, belum berkembang dan kekurangan sumber daya alam selain kayu, namun hal ini menunjukkan peningkatan posisi Meksiko di kancah internasional."
 mexico.13.a: "[From.GetNameDef] benar-benar teman kami."
 mexico.14.title: "Inggris Menolak Penjualan Belize"
 mexico.14.desc: "[From.GetLeader] telah menolak menjual koloni British Honduras kepada kami. Mengutip kegunaannya sebagai pangkalan angkatan laut, pemerintah [From.GetAdjective] menyatakan preferensinya untuk mempertahankan koloni tersebut. Sebagian besar penduduknya adalah penutur bahasa Inggris sehingga penolakan tersebut dapat dimengerti, meskipun mengecewakan."
 mexico.14.a: "Mungkin [From.GetAdjective] bukanlah teman kita."
 mexico.15.title: "Uskup Agung Pascual Díaz Meninggal Dunia"
 mexico.15.desc: "Yang Terhormat Pascual Díaz y Barreto, Uskup Agung Mexico City, meninggal dunia hari ini karena radang usus besar. Ia berusia 59 tahun. Warisannya adalah oposisi garis keras terhadap kebijakan sosialis pemerintah, serta upaya kompromi menjelang akhir Perang Cristero.\n\nPenggantinya adalah Luis María Martínez, seorang reformis sosial dan teman pribadi Presiden Cárdenas. Penggantinya mungkin dipilih oleh Paus untuk memastikan kelanjutan perdamaian antara Gereja dan pemerintah di Meksiko."
 mexico.15.a: "Requiescat dalam kecepatan."
 mexico.15.b: "Terbakar di Neraka, pengkhianat."
 mexico.16.title: "Pemogokan Pekerja Minyak"
 mexico.16.desc: "Para pekerja minyak berserikat pada tahun 1935 dengan restu Presiden Cárdenas, membentuk Sindicato Único de Trabajadores Petroleros. Mereka segera mencoba menegosiasikan upah yang lebih tinggi dan kondisi kerja yang lebih baik, namun ditolak oleh perusahaan minyak internasional yang kuat seperti Royal Dutch Shell dan Standard Oil of California. Permasalahan ini diteruskan ke komite arbitrase dan akhirnya dibawa ke pengadilan, dengan pertanyaan yang paling mendesak adalah apakah perusahaan-perusahaan minyak mampu membayar upah yang lebih tinggi.\n\nMenurut penyelidikan baru-baru ini, anak-anak perusahaan di Meksiko memperoleh keuntungan lebih besar daripada perusahaan-perusahaan minyak di Amerika Serikat, namun masih menolak untuk mencapai kesepakatan dengan para pekerja. Tampaknya mereka mendapat dukungan dari negara-negara kuat di kawasan dan menganggap diri mereka kebal hukum."
 mexico.16.a: "Keterlaluan! Eksploitasi ini tidak etis dan harus diakhiri!"
 mexico.16.b: "Itu kapitalisme."
 mexico.17.title: "Trotsky Tiba"
 mexico.17.desc: "Diasingkan dari Uni Soviet karena menentang kebangkitan Stalin, disalahkan atas segala macam masalah mulai dari kemunduran militer hingga kecelakaan industri, dan diusir dari satu negara ke negara lain karena tekanan politik, Lev Trotsky, seorang revolusioner dan penulis Komunis, telah tiba di Meksiko setelah melakukan perjalanan dari Norwegia dengan kapal tanker minyak."
 mexico.17.a: "Kami bukan boneka Stalin, beri dia suaka."
 mexico.17.b: "Ekstradisi dia ke Uni Soviet untuk diadili atas kejahatannya."
 mexico.17.c: "Dia jenius dalam berorganisasi, ajak dia bergabung dengan pemerintahan."
 mexico_extradited_trotsky: "Trotsky yang diekstradisi"
 mexico_communist_menace: "Ancaman Komunis"
 mexico_snubbed_stalin: "Menghina Stalin"
 mexico_trotskyite_wreckers: "Penghancur Trotskis"
 flag_mexico_invited_trotsky_to_government: "Trotsky telah diundang untuk bergabung dengan pemerintah"
 flag_trotsky_dead: "Trotsky telah dibunuh oleh agen-agen Stalinis"
 mexico.18.title: "Kampanye Pemilu Dimulai"
 mexico.18.desc: "Kampanye pemilihan Presiden berikutnya akan dimulai dalam beberapa hari mendatang. Reformasi konstitusi tahun 1933 diperkenalkan sebagai tanggapan atas kemarahan terhadap gagasan Calles menjadi presiden untuk masa jabatan kedua, dan setelah pembunuhan langsung terhadap pendahulu Calles, Álvaro Obregón, yang menginginkan masa jabatan kedua. Reformasi ini mencegah pejabat terpilih untuk menjabat dua kali, meskipun ia hanya menjabat sebagai pejabat sementara atau sementara. Hal ini membantu mencegah terulangnya peristiwa Porfiriato, yang menyebabkan diktator Porfirio Díaz menjalani tujuh masa jabatan dalam jangka waktu tiga puluh tahun dan mengilhami Revolusi Meksiko pada tahun 1910, yang menjerumuskan negara tersebut ke dalam satu dekade perselisihan sipil.\n\nUndang-undang ini memiliki keuntungan karena membuat jaringan patronase di luar partai menjadi lebih sulit untuk dipertahankan, namun juga mencegah para pejabat untuk bertanggung jawab secara langsung kepada para pemilih, karena mereka akan berpindah ke tingkat pemerintahan yang berbeda setelah masa jabatan mereka, sehingga membuat mereka bergantung pada patronase di dalam partai."
 mexico.18.a: "Reformasi konstitusi ini penting untuk stabilitas negara."
 mexico.18.b: "Konyol! [Root.GetLeader] tahu yang terbaik, dia akan menjalani masa jabatan kedua!"
 mexico.19.title: "[Root.GetRulingParty] Penerus"
 mexico.19.desc: "Penerus [Root.GetLeader] sedang dibahas di internal partai. Pemilu yang kompetitif masih belum stabil di Meksiko, dan [Root.GetRulingPartyLong] yang berkuasa, berkoordinasi dengan tentara dan pasukan keamanan, pasti akan memenangkan pemilu."
 mexico.19.a: "Francisco Múgica, Jenderal revolusioner dan reformis sosial."
 mexico.19.b: "Manuel Ávila Camacho, Kepala Staf veteran."
 mexico.19.c: "Saturnino Cedillo, caudillo sayap kanan."
 mexico.19.d: "Juan Andreu Almazán, pengusaha sayap kanan."
 mexico.19.e: "Vicente Lombardo, anggota serikat pekerja radikal."
 mexico.19.f: "Francisco Múgica, Jenderal revolusioner dan reformis sosial."
 mexico.19.g: "Manuel Ávila Camacho, Kepala Staf veteran."
 mexico.19.h: "Juan Andreu Almazán, pengusaha sayap kanan dan jenderal."
 mexico.19.i: "Vicente Lombardo, anggota serikat pekerja radikal."
 mexico.19.j: "Francisco Múgica, Jenderal revolusioner dan reformis sosial."
 mexico.19.k: "Dionisio Encina, loyalis partai Stalinis."
 mexico.19.l: "Hernán Laborde, pemimpin partai Trotskis."
 mexico.19.m: "Lev Trotsky, pahlawan Revolusi Oktober."
 mexico.19.n: "Saturnino Cedillo, Jeneral revolusioner dan calon kesinambungan."
 mexico.19.o: "Juan Andreu Almazán, pengusaha sayap kanan dan jenderal Revolusioner."
 mexico.19.p: "Jesús Degollado Guízar, Jenderal Cristero."
 mexico.19.q: "Salvador Abascal, pemimpin Sinarkis garis keras."
 mexico.19.r: "Valentín Campa, seorang sindikalis kereta api yang dekat dengan Laborde."
 mexico.20.title: "Juan Andreu Mengecam Pemilu"
 mexico.20.desc: "Pengusaha sayap kanan dan jenderal Revolusioner Juan Andreu Almazán mengecam hasil pemilu baru-baru ini. Dia mengklaim dukungannya lebih besar dan [Root.GetLeader] hanya menang karena memanipulasi hasil. Meskipun ini mungkin benar, Juan Andreu tentu saja bertindak seperti pecundang. Dia telah mengasingkan diri ke Amerika dan mencoba mengorganisir upaya kudeta terhadap [Root.GetRulingPartyLong]. Tetap menjaga hubungan baik dengan Amerika adalah tindakan yang bijaksana."
 mexico.20.a: "Ayo, lari ke Yanquis."
 mexico.21.title: "Meksiko Ekstradisi Trotsky"
 mexico.21.desc: "Meskipun dijanjikan suaka oleh pemerintah Meksiko beberapa bulan yang lalu, setibanya di negara tersebut Lev Trotsky mendapati dirinya ditangkap oleh keamanan negara dari [From.GetRulingPartyLong] dan segera berangkat kembali ke Uni Soviet untuk diadili atas banyak kejahatannya terhadap negara revolusioner. [From.GetLeader] juga mengungkapkan harapannya agar Meksiko dan Uni Soviet dapat menikmati hubungan yang lebih erat di masa depan."
 mexico.21.a: "Kalahkan pengakuannya dan tembak dia! Hubungi Mayor Jenderal Blokhin!"
 mexico.22.title: "Lev Trotsky Kembali ke Uni Soviet"
 mexico.22.desc: "Setelah meningkatnya sentimen anti-Stalinis di Uni Soviet, kelompok penguasa di negara tersebut memutuskan untuk memanggil kembali Trotsky dari pengasingan dan menempatkannya sebagai pemimpin mereka di puncak pemerintahan. Staf intelijen kami berpendapat bahwa sebagian besar keinginannya adalah boneka kekuatan lain di Rusia, namun Lev Trotsky bersikeras untuk kembali ke tempat kelahiran Revolusi Oktober."
 mexico.22.a: "Dasvidaniya."
 flag_trotsky_has_returned_to_ussr_from_mexico: "Trotsky telah kembali ke Uni Soviet"
 mexico.23.title: "Peperangan Kapal Selam Tanpa Batas"
 mexico.23.desc: "Dengan perlindungan konvoi musuh yang terbatas dan kapal selam kita berkeliaran di lautan tanpa gangguan, kita mampu menghancurkan kapal dagang yang terisolasi hampir sesuka hati. Kapten kapal selam kami menyebut ini sebagai 'Saat-saat Bahagia'. Ada banyak target yang menggiurkan untuk dipilih, seperti kapal tanker minyak Meksiko yang netral. Laksamana kami meminta izin untuk menggunakan kapal tanker ini, meskipun kantor luar negeri memperingatkan bahwa hal itu dapat menimbulkan konsekuensi negatif terhadap hubungan dengan Meksiko."
 mexico.23.a: "Berdagang dengan musuh sama saja dengan permusuhan terbuka."
 mexico.23.b: "Sebaiknya kita tidak membuat musuh lebih banyak dari yang seharusnya."
 mexico.24.title: "Serangan U-Boat Jerman"
 mexico.24.desc: "Kapal tanker minyak Meksiko 'Potrero del Llano' dan 'Faja de Oro' telah dikirim ke dasar Karibia oleh kelompok serigala Jerman yang beroperasi berdasarkan doktrin 'perang kapal selam tanpa batas'. Serangan terhadap kapal netral ini merupakan tindakan perang. Kami berhak menyerang kapal-kapal Jerman yang kami temui di laut.\n\nKita juga harus mempertimbangkan untuk bergabung dengan faksi Amerika yang melawan Jerman. Hal ini akan membuat Yanquis berhutang budi dan menunjukkan kepada dunia bahwa Meksiko adalah pemain internasional."
 mexico.24.a: "Anda akan mendapatkan apa yang akan terjadi, [From.GetLeader]."
 mexico.24.b: "Apa yang bisa kita lakukan?"
 mexico.25.title: "Meksiko Mencari Aliansi"
 mexico.25.desc: "[From.GetLeader] berusaha untuk ikut berperang melawan Jerman setelah kebijakan perang kapal selam tak terbatas Jerman mengakibatkan u-boat menenggelamkan beberapa kapal tanker minyak netral Meksiko yang berlayar di lepas pantai Meksiko."
 mexico.25.a: "Setiap hal kecil membantu."
 mexico.25.b: "Kita pasti bisa menemukan sekutu yang lebih baik daripada orang-orang Meksiko."
 mexico.26.title: "Meksiko Bergabung dengan [From.GetFactionName]"
 mexico.26.desc: "[From.GetLeader] menyambut baik tawaran dukungan Presiden Meksiko dalam perang melawan Jerman. Kelompok serigala Jerman baru-baru ini menenggelamkan kapal tanker minyak netral Meksiko 'Potrero del Llano' dan 'Faja de Oro', sebuah tindakan perang yang mengakibatkan hilangnya nyawa warga sipil, dan pemerintah Meksiko telah menyatakan keinginannya untuk melihat aktivitas u-boat Jerman di Karibia berakhir untuk selamanya.\n\nPemerintah Meksiko telah mencari pengakuan yang lebih besar dari kekuatan dunia selama beberapa waktu, dan mereka percaya bahwa memberikan dukungan kepada Amerika dan [From.GetFactionName] akan membuktikan bahwa mereka memang benar. seorang pemain internasional."
 mexico.26.a: "Meksiko berhak berperang demi hal ini."
 mexico.26.b: "Apakah Meksiko punya tentara?"
 mexico.26.c: "Serangan terhadap kapal netral adalah kejahatan berat menurut hukum perang."
 mexico.27.title: "Firmissimam Constantiam"
 mexico.27.desc: "Paus Pius XI telah mengeluarkan Ensiklik Kepausan yang membahas situasi Meksiko. Meskipun Cristiada telah diselesaikan di meja perundingan dan pertumpahan darah terbuka telah berakhir, Gereja masih khawatir mengenai arah yang akan diambil Meksiko.\n\nEnsiklik tersebut mendesak para pemilih Meksiko untuk berpihak pada calon-calon agama dalam pemilu, dan menyerukan partai-partai keagamaan Meksiko seperti Catholic Action untuk mengatasi masalah-masalah sosial, seperti kemiskinan, untuk mencegah kekerasan yang lebih revolusioner."
 mexico.27.a: "Adalah baik bahwa kekerasan anti-Gereja telah berakhir."
 mexico.27.b: "Propaganda takhayul, cegah publikasi pengkhianatan ini!"
 mexico.28.title: "Pemberontakan Agama"
 mexico.28.desc: "Serangan kami terhadap Gereja pengkhianat jelas tidak dilakukan dengan kekuatan yang cukup. Para pengkhianat sibuk menggunakan kebebasan yang kami berikan kepada mereka untuk mengorganisir upaya kudeta. Mengingat Perang Cristero yang sia-sia yang kita kalahkan bertahun-tahun yang lalu, orang-orang bodoh yang percaya takhayul ini telah mengibarkan panji-panji salib mereka dan bersatu di belakang para pendeta yang berbohong dan sekarang berusaha untuk membatalkan kemajuan yang telah kita capai menuju modernisasi."
 mexico.28.a: "Kita seharusnya memberantas pengkhianatan ini lebih awal!"
 mexico.29.title: "Cristiada Kedua"
 mexico.29.desc: "Kekuatan Gereja dan Revolusi sekali lagi berkonflik di Meksiko. Ketika pemerintah kembali melancarkan serangan terhadap Gereja, partai-partai Katolik dan gerakan sosial yang menjadi sasaran perlawanan melancarkan pemberontakan bersenjata untuk menguasai Meksiko. Milisi Cristero melakukan reformasi setelah satu dekade tidak aktif, ditambah dengan pembelot dari militer federal. Mereka telah mengambil alih beberapa negara bagian pedesaan dan menggunakannya sebagai basis untuk beroperasi.\n\nCristiada pertama berakhir dengan negosiasi penyelesaian antara pejabat senior Revolusioner dan Gereja berkat perantaraan pemerintah Amerika, namun tampaknya kekerasan ini hanya akan berakhir dengan kehancuran total salah satu pihak yang berperang."
 mexico.29.a: "Akan mudah untuk membantai orang-orang idiot yang mudah tertipu dan dipimpin oleh para pendeta yang pikun."
 mexico.29.b: "'Hidup Kristus Raja dan Santa Maria dari Guadalupe!'"
 mexico.29.c: "Situasi di Meksiko nampaknya terlalu rumit untuk dipahami oleh pihak luar."
 mexico.30.title: "Pemberontakan Atheis"
 mexico.30.desc1: "Orang-orang jahat yang kita pikir telah kita kalahkan telah bersatu untuk pertempuran terakhir yang sia-sia melawan para Hamba Tuhan. Agen-agen Setan seperti Plutarco Calles dan antek-anteknya yang 'revolusioner' yang kejam berhamburan keluar dari sarang kejahatan mereka dengan bersenjatakan senapan dan bayonet untuk menusuk Umat Beriman. Kita harus menghentikan serangan terhadap Tubuh Kristus ini, atau pekerjaan yang telah kita lakukan untuk tetap hidup dan meningkatkan api kesalehan akan berakhir dan pengetahuan selama dua puluh abad tentang hukum Penebus dan Raja Kita akan dilupakan."
 mexico.30.desc2: "Orang-orang jahat yang kita pikir telah kita kalahkan telah bersatu untuk pertempuran terakhir yang sia-sia melawan para Hamba Tuhan. Agen-agen Setan seperti Vicente Lombardo dan antek-anteknya yang 'revolusioner' yang kejam berhamburan keluar dari sarang kejahatan mereka dengan bersenjatakan senapan dan bayonet untuk menusuk Umat Beriman. Kita harus menghentikan serangan terhadap Tubuh Kristus ini, atau pekerjaan yang telah kita lakukan untuk tetap hidup dan meningkatkan api kesalehan akan berakhir dan pengetahuan selama dua puluh abad tentang hukum Penebus dan Raja Kita akan dilupakan."
 mexico.30.a: "'Inilah saatmu, dan kekuatan kegelapan.'"
 mexico.31.title: "Revolusi Meksiko Kedua"
 mexico.31.desc: "Kekuatan Gereja dan Revolusi sekali lagi berkonflik di Meksiko. Dengan semakin kuatnya partai-partai Katolik dan gerakan-gerakan sosial, kekuatan sekuler melancarkan pemberontakan bersenjata untuk mengambil kembali kendali pemerintah. 'Brigade Merah' sedang melakukan reformasi setelah satu dekade tidak aktif, sementara para pembelot dari militer federal berkumpul di negara-negara bagian yang masih dikuasai oleh gubernur-gubernur yang anti-Gereja.\n\nCristiada berakhir dengan sebuah penyelesaian yang dinegosiasikan antara para pejabat senior Revolusioner dan Gereja berkat perantaraan pemerintah Amerika, namun nampaknya kekerasan ini akan berakhir hanya dengan kehancuran total salah satu pihak yang berperang."
 mexico.31.a: "Hidup Kristus Raja dan Santa Maria dari Guadalupe!"
 mexico.31.b: "Akan mudah untuk membantai orang-orang idiot yang mudah tertipu dan dipimpin oleh para pendeta yang pikun."
 mexico.31.c: "Situasi di Meksiko nampaknya terlalu rumit untuk dipahami oleh pihak luar."
 mexico.32.title: "Kerusuhan 'Zoot Suit'"
 mexico.32.desc: "Pemuda Hispanik yang mengenakan pakaian mewah - 'zoot suit' - telah menjadi sasaran kerusuhan rasial di kota-kota perbatasan di Selatan, yang berasal dari pemberitaan sensasional atas kematian seorang remaja di Los Angeles. Sembilan pemuda Meksiko-Amerika telah dihukum karena pembunuhan atas insiden tersebut.\n\nAgen intelijen telah mengumpulkan laporan yang menyatakan bahwa pelaku zoot sebenarnya adalah agen fasis, yang berkolaborasi dengan Sinarquista ultra-Katolik di Meksiko untuk membantu invasi Jepang-Jerman di Amerika."
 mexico.32.a: "Kedengarannya tidak mungkin. Berapa kita membayar agen-agen ini?"
 mexico.32.b: "Tangkap saja para penggugat zoot. Kerusuhan adalah ancaman bagi upaya perang kita."
 mexico.33.title: "Kerusuhan 'Zoot Suit'"
 mexico.33.desc: "Pemuda Hispanik yang mengenakan pakaian mewah - 'zoot suit' - telah menjadi sasaran kerusuhan rasial di kota-kota perbatasan di Utara, yang berasal dari pemberitaan sensasional atas kematian seorang remaja di Los Angeles. Sembilan pemuda Meksiko-Amerika telah dihukum karena pembunuhan atas insiden tersebut.\n\nAgen intelijen Amerika telah mengumpulkan laporan yang menyatakan bahwa pelaku zoot sebenarnya adalah agen fasis, yang berkolaborasi dengan Sinarquista ultra-Katolik di Meksiko untuk membantu invasi Jepang-Jerman di Amerika."
 mexico.33.a: "Sinarquista merupakan ancaman bagi Amerika dan Meksiko."
 mexico.33.b: "Mereka hanyalah anak-anak! Ini adalah sebuah ketidakadilan!"
 mexico.34.title: "Pertukaran Sumber Daya Meksiko"
 mexico.34.desc: "[From.GetLeader] telah menawarkan kesepakatan perdagangan dengan Jerman jika [Root.GetLeader] setuju untuk mengirimkan desain tank ringan dan menengah terbaru yang kami kembangkan ke Meksiko. Hal ini nampaknya merupakan tahap pertama dalam mendekatkan hubungan Meksiko-Jerman sehingga meskipun hal ini tidak memiliki tujuan militer, hal ini mungkin berguna bagi kita secara geopolitik. Tentu saja, desain tank canggih ini bisa saja jatuh ke tangan musuh di masa depan..."
 mexico.34.a: "Perjanjian ini akan membantu Jerman dan Meksiko."
 mexico.34.b: "Orang Amerika kemungkinan besar akan mendapatkan desain apa pun yang kami kirimkan."
 mexico.35.title: "Desain Tank Jerman"
 mexico.35.desc: "[From.GetLeader] telah setuju untuk memberi kami lisensi untuk desain tank ringan dan menengah Jerman terbaru. Mudah-mudahan ini akan menjadi tahap pertama dalam hubungan Meksiko-Jerman yang lebih erat serta menjadi pengetahuan militer yang berguna."
 mexico.35.a: "Sangat bagus."
 mexico.36.title: "Jerman Menolak Tawaran"
 mexico.36.desc: "Mengutip kemungkinan desain tank canggih Jerman jatuh ke tangan musuh, [From.GetLeader] telah menolak tawaran pertukaran sumber daya kami. Kita harus mengembangkan desain tank asli, atau membayar lisensi mereka kepada Jerman..."
 mexico.36.a: "Berengsek."
 mexico.40.title: "Operasi Hanya Menyebabkan Berhasil"
 mexico.40.desc: "Serangan mendadak kami terhadap pangkalan Yanqui di Panama telah berhasil. Kita telah mengusir kaum imperialis dan sekarang menunggu tanggapan dari kekaisaran Utara yang sudah bobrok. Jika mereka memilih untuk menyerang pertahanan kita, kita akan membuat mereka membayarnya."
 mexico.40.a: "Centroamérica akan aman dari agresi Amerika."
 mexico.41.title: "[From.GetAdjective] Perebutan Terusan Panamá"
 mexico.41.desc: "Diktator Meksiko, [From.GetLeader], memiliki keberanian untuk melancarkan serangan besar-besaran terhadap pasukan Terusan Panamá dari lokasi pertempuran terdekat. 'Operasi Just Cause' mereka berhasil dan pasukan kita mundur dalam kebingungan. Orang-orang Meksiko tidak menyeberang ke benua Amerika, jadi ini bukanlah awal dari invasi besar-besaran, namun serangan tersebut telah melemahkan kemampuan kita untuk mengerahkan kekuatan di seluruh dunia dan mempermalukan kita di panggung internasional."
 mexico.41.a: "Sayangnya, kami memiliki kekhawatiran yang lebih mendesak. Embargo seharusnya sudah cukup."
 mexico.41.b: "Kedaulatan kita terancam. Hal ini memerlukan respons militer."
 mexico.42.title: "Operasi Hanya Menyebabkan Gagal"
 mexico.42.desc: "Serangan mendadak kami terhadap pangkalan Yanqui di Panamá menjadi kacau. Mungkin kami tidak mengerahkan cukup pasukan, atau komandannya tidak kompeten. Apa pun yang terjadi, kita telah diusir oleh kaum imperialis dan sekarang menunggu tanggapan dari kerajaan Utara yang sudah bobrok. Jika mereka memilih untuk menyerang pertahanan kita, kita akan membuat mereka membayarnya."
 mexico.42.a: "Centroamérica masih terancam oleh agresi Amerika."
 mexico.43.title: "[From.GetAdjective] Serangan di Terusan Panama"
 mexico.43.desc: "Diktator Meksiko, [From.GetLeader], memiliki keberanian untuk melancarkan serangan besar-besaran terhadap pasukan Terusan Panamá dari lokasi pertempuran terdekat. Untungnya, pasukan pemberani kita berhasil mengusir 'Operasi Just Cause' mereka dan memukul mundur para penjajah. Orang-orang Meksiko tidak menyeberang ke benua Amerika, jadi ini bukanlah awal dari invasi besar-besaran, namun serangan tersebut telah menunjukkan bahwa kita tidak lagi menguasai benua Amerika, sehingga mempermalukan kita di panggung internasional."
 mexico.43.a: "Sayangnya, kami memiliki kekhawatiran yang lebih mendesak. Embargo seharusnya sudah cukup."
 mexico.43.b: "Kedaulatan kita terancam. Hal ini memerlukan respons militer."
 mexico.44.title: "Meksiko Merebut Terusan Panama"
 mexico.44.desc1: "Menyusul serangan [From.GetAdjective] ke pangkalan militer Amerika di Terusan Panamá, pasukan di kedua sisi perbatasan telah dimobilisasi untuk berperang. Meskipun pihak Meksiko menyerang lebih dulu, merebut Zona Terusan yang penting secara strategis, tampaknya pihak Amerikalah yang melancarkan serangan untuk menghukum tetangga mereka yang kurang ajar tersebut. 'Pers selokan' mengecam [From.GetRulingPartyLong] sebagai kelompok bandit yang tidak menghormati hukum internasional, dan menyerukan perubahan rezim.\n\nJika Perang Meksiko-Amerika Kedua pecah, perang tersebut akan terjadi di medan pegunungan dan gurun yang keras dan tak kenal ampun, dengan korban jiwa yang jauh lebih besar daripada perkelahian kecil pada tahun 1847 yang mendahului Penyerahan Meksiko."
 mexico.44.desc2: "Laporan mengenai pasukan [From.GetAdjective] yang memasuki pangkalan militer Amerika di Terusan Panamá telah dikonfirmasi oleh [From.GetLeader], yang mengklaim telah bertindak untuk menjaga kepentingan [From.GetAdjective] di Centroamérica menyusul pergolakan domestik di Amerika Serikat. Kementerian propaganda [From.GetRulingPartyLong] telah meminta agar semua tentara Amerika yang tersisa di wilayah tersebut menyerahkan senjata mereka dan menghormati 'penyerahan kekuasaan secara damai' di Zona Terusan. Presiden Amerika telah banyak dikritik oleh 'pers selokan' karena tidak berjuang lebih keras untuk menjaga kepentingan nasional di wilayah tersebut, dan karena gagal menindaklanjuti serangan [From.GetAdjective] dengan mobilisasi umum melawan [From.GetNameDef]."
 mexico.44.a: "Datang dan ambillah!"
 mexico.44.b: "Sebuah serangan keterlaluan terhadap kedaulatan Amerika."
 mexico.44.c: "Sedikit berani... Meksiko?"
 mexico.45.title: "[MEX.GetAdjective]-Bentrokan Perbatasan Amerika"
 mexico.45.desc1: "Pasukan Amerika di perbatasan Selatan telah disiagakan, karena agresi [From.GetAdjective] baru-baru ini terhadap pangkalan militer Amerika di Terusan Panamá meningkatkan kemungkinan perang skala besar antara kedua tetangga tersebut. Meskipun serangan mendadak [From.GetLeader] gagal, presiden Amerika dilaporkan telah memutuskan untuk menghukum tetangganya di Selatan yang kurang ajar itu. 'Pers selokan' mencela [From.GetRulingPartyLong] sebagai kelompok bandit yang tidak menghormati hukum internasional, dan menyerukan perubahan rezim.\n\nJika Perang Meksiko-Amerika Kedua pecah, perang tersebut akan terjadi di medan pegunungan dan gurun yang keras dan tak kenal ampun, dengan korban jiwa yang jauh lebih besar daripada perkelahian kecil pada tahun 1847 yang mendahului Penyerahan Meksiko."
 mexico.45.desc2: "Pasukan Amerika di perbatasan Selatannya telah ditempatkan dalam siaga tinggi, karena agresi [From.GetAdjective] baru-baru ini terhadap pangkalan militer Amerika di Terusan Panamá mengejutkan sebagian besar pengamat, meskipun beberapa ahli di Amerika Latin telah memperingatkan bahwa serangan [From.GetAdjective] di negara-negara Centroamérican pada akhirnya akan berakhir dengan bentrokan dengan Amerika karena menentang kepentingan di wilayah tersebut. [USA.GetLeader] telah mengembargo Meksiko setelah perebutan Terusan namun sebaliknya menahan diri dari tindakan militer. Tindakan seperti ini dapat membantu mendamaikan pemerintah [From.GetRulingPartyLong] yang agresif, atau mungkin mendorong mereka untuk mengambil tindakan lebih lanjut."
 mexico.45.a: "Datang dan ambillah!"
 mexico.45.b: "Sebuah serangan keterlaluan terhadap kedaulatan Amerika."
 mexico.45.c: "Meksiko mengambil risiko besar dengan pertaruhan itu."
 mexico.46.title: "[From.GetFactionName]"
 mexico.46.desc: "Presiden [From.GetLeader] dari [From.GetRulingPartyLong] Meksiko telah mengumumkan pembentukan blok negara baru di Belahan Barat. [From.GetFactionName] telah menyatakan bahwa agitasi sayap kiri dan campur tangan asing akan dikalahkan dengan membentuk aliansi revanchis yang terdiri dari orang-orang kuat otokratis yang akan menata ulang wilayah tersebut untuk menciptakan penyeimbang yang kuat terhadap faksi-faksi lainnya."
 mexico.47.title: "[From.GetFactionName]"
 mexico.47.desc: "Presiden [From.GetLeader] dari [From.GetRulingPartyLong] Meksiko telah mengumumkan pembentukan blok negara baru di Belahan Barat. [From.GetFactionName] mengambil namanya dari Simón Bolívar, seorang pejuang kemerdekaan yang membantu memenangkan kebebasan bagi banyak negara Amerika Latin yang kini bergabung dalam sebuah aliansi. Tujuan yang mereka nyatakan adalah mengakhiri dominasi kekaisaran lama Eropa dan Amerika di benua ini dengan membangun negara-negara sosialis yang kuat dan terhubung secara ekonomi dan diplomatis."
 mexico.46.a: "Dengan sekutu setia, Tanah Air tidak akan terkalahkan!"
 mexico.46.b: "Sekadar angka tidak akan menyelamatkan orang-orang bodoh yang sok ini."
 mexico.46.c: "Apakah ini awal dari pertarungan yang lebih seru lagi?"
 mexico.50.title: "Pengiriman Senjata Meksiko"
 mexico.50.desc: "Setelah menyatakan dukungan mereka terhadap tujuan kami, sepupu ideologis kami di [From.GetRulingPartyLong] telah mengirimkan kiriman senapan kepada kami untuk membantu perjuangan kami melawan musuh yang kami benci."
 mexico.50.a: "[From.GetLeader] adalah sahabat sejati masyarakat Spanyol."
 mexico.51.title: "Pengiriman Senjata Hilang"
 mexico.51.desc: "Laut di sekitar pantai Spanyol dipatroli oleh kapal-kapal loyalis dan pemberontak Spanyol, dan oleh kapal penjelajah Italia, kapal selam Rusia, dan bahkan kapal-kapal Liga Bangsa-Bangsa yang dikirim untuk menegakkan larangan senjata yang dimaksudkan untuk mencegah Perang Saudara menyebar ke seluruh Eropa. Tidak heran pengiriman senjata kami baru-baru ini dilarang dan hilang."
 mexico.51.a: "Sayang sekali."
 mexico.52.title: "[MEX.GetLeader] Memproklamirkan Persatuan Semua Gerakan Komunis"
 mexico.52.desc_not_trotsky: "Pada kongres [MEX.GetFactionName], [MEX.GetLeader] memproklamirkan supremasi penafsiran Trotsky terhadap Marx, Engels dan Lenin atas penafsiran yang salah mengenai Revolusi seperti Stalinisme. Dengan runtuhnya Internasional ke-3 (juga dikenal sebagai Komintern), para pemimpin komunis di seluruh dunia diundang untuk melakukan kritik diri. Setelah mengakui kebutaan politik mereka terhadap semangat revolusioner sejati, mereka akan diundang ke Internasional ke-4 dan membantu munculnya revolusi sosialis dunia."
 mexico.52.desc_trotsky: "Pada kongres [MEX.GetFactionName], [MEX.GetLeader] memproklamirkan supremasi penafsirannya terhadap Marx, Engels dan Lenin atas penafsiran yang salah terhadap teori-teori Revolusi, seperti Stalinisme. Dengan runtuhnya Internasional ke-3 (juga dikenal sebagai Komintern), semua pemimpin komunis diajak untuk melakukan kritik diri. Setelah mengakui kebutaan politik mereka terhadap semangat revolusioner sejati, mereka akan diundang ke Internasional ke-4 dan membantu munculnya revolusi sosialis dunia."
 mexico.52.a: "Kami akhirnya melihat kesalahan kami."
 mexico.52.b: "Penafsiran kami terhadap visi Marx adalah satu-satunya penafsiran yang sah."
 mexico.53.title: "[MEX.GetLeader] Memproklamirkan Persatuan Semua Gerakan Komunis"
 mexico.53.desc: "Kita sudah lama percaya bahwa para pemimpin kita saat ini menyebarkan penafsiran yang benar atas Marx, Engels, dan Lenin, namun kini mereka terpaksa menjalani 'kritik diri' dan secara terbuka mengakui bahwa penafsiran Trotskis terhadap Lenin adalah satu-satunya jalan yang benar menuju kemenangan Sosialisme. Akibatnya, kita tiba-tiba mendapati diri kita terisolasi. Aliansi kita telah runtuh dan kita menghadapi dilema Cornelian: mengakui kebenaran pandangan Trotskis atau menjadi terisolasi dan bertentangan dengan [MEX.GetFactionName]."
 mexico.53.a: "Kami akhirnya melihat kesalahan kami."
 mexico.53.b: "Penafsiran kami terhadap visi Marx adalah satu-satunya penafsiran yang sah."
 mexico.54.title: "[MEX.GetLeader] Menuntut Penarikan Kami dari Karibia"
 mexico.54.desc: "Dalam pidato penuh semangat yang berlangsung lebih dari 4 jam, [MEX.GetLeader] menuntut agar kita meninggalkan semua koloni kita di kawasan Karibia sebagaimana menurutnya \"Bukti paling nyata dari penindasan imperialis kita atas kawasan\". Meskipun beberapa orang berpendapat bahwa kita tidak boleh membuat marah Meksiko saat ini, para penasihat yang lebih tegas menekankan bahwa kita benar-benar mampu melawan mereka dan bahwa integritas wilayah kita tidak boleh dikompromikan."
 mexico.54.a: "Setujui tuntutannya."
 mexico.54.b: "Kami tidak bernegosiasi dengan kaum revolusioner!"
 mexico.55.title: "[From.GetNameDef] Mundur dari Karibia!"
 mexico.55.desc: "Menghadapi kontradiksi Imperialisnya, pemerintah [From.GetAdjective] telah melakukan dekolonisasi dari wilayah Karibia. Ini adalah hari yang luar biasa bagi para pekerja namun perjuangan masih jauh dari selesai. Proses tersebut belum memberikan kebebasan total bagi buruh karena mereka masih menjadi subyek institusi yang menindas."
 mexico.55.a: "Perjuangan untuk kebebasan Proletariat dunia terus berlanjut."
 mexico.56.title: "[From.GetNameDef] Menolak Tuntutan kami"
 mexico.56.desc: "Dalam respon arogan yang merupakan ciri khas para penindas Imperialis, [From.GetNameDef] menolak tuntutan kami untuk melepaskan cengkeraman serakah mereka di Karibia! Proletariat mereka sekarang harus menghadapi kontradiksi dalam pemerintahan mereka dan memastikan bahwa mereka bekerja untuk kaum Tiran."
 mexico.56.a: "Mereka akan menanggung murka proletariat bersenjata!"
 mtg_usa_civil_war_fascists.1.t: "Protes Legiun Perak"
 mtg_usa_civil_war_fascists.1.desc: "Dipimpin dan diorganisir oleh Silver Legion of America, sejumlah organisasi berhaluan tengah dan sayap kanan hari ini melakukan demonstrasi di ibu kota dalam salah satu demonstrasi terbesar yang pernah disaksikan Washington sejauh ini. Pertemuan-pertemuan lain juga dilaporkan terjadi di seluruh negeri.\n\nPawai berakhir di depan Capitol, di mana massa menuntut agar \"Komunis di Kongres berkumpul\" diserahkan kepada mereka untuk diadili di hadapan \"Juri Agung Rakyat\" atas tuduhan pengkhianatan terhadap Amerika Serikat.\n\nSecara pribadi, beberapa anggota pemerintahan juga memiliki kekhawatiran yang sama dengan para pengunjuk rasa mengenai supremasi hukum dan kepatuhan terhadap konstitusi checks and balances. Namun, sebagian lainnya menyarankan tindakan tegas terhadap mereka. Dengan lebih banyak demonstrasi yang direncanakan dalam beberapa minggu mendatang, kita harus mengambil keputusan dengan cepat."
 mtg_usa_civil_war_fascists.1.a: "Kita harus menghindari memperburuk situasi."
 mtg_usa_civil_war_fascists.1.b: "Kita tidak boleh tunduk pada massa."
 mtg_usa_civil_war_fascists.2.t: "Protes meningkat menjadi kekerasan"
 mtg_usa_civil_war_fascists.2.desc: "Ketegangan meningkat pada protes lain di ibu kota hari ini, ketika protes massal lainnya diserukan, antara lain, oleh Silver Legion of America. Mengulangi tuntutan mereka sebelumnya agar sejumlah Anggota Kongres ditangkap dan diserahkan kepada mereka, para pengunjuk rasa mengeluarkan ultimatum satu jam sebelum mereka menyerbu Capitol dan menyingkirkan orang-orang dalam daftar mereka dengan paksa.\n\nKetika ultimatum disahkan tanpa reaksi, pasukan kecil Legiuner Perak menyerbu barisan Polisi Capitol. Perkelahian berdarah pun terjadi, yang dengan cepat menyebar hingga melibatkan pengunjuk rasa lainnya. Karena polisi sibuk, kelompok lain berhasil masuk ke dalam gedung. Bergerak dari ruangan ke ruangan, mereka berhasil menemukan beberapa korban yang dituju, namun dihentikan oleh polisi bersenjata. Dalam baku tembak berikutnya, beberapa penyerang tewas, sementara dua anggota kongres terluka.\n\nSuasana hati yang buruk telah terjadi di ibu kota, dengan kedua belah pihak saling menyalahkan atas eskalasi yang terjadi. Beberapa minggu ke depan akan menunjukkan apakah insiden yang sekarang dikenal sebagai Pertempuran Capitol Hill adalah akhir dari protes, atau hanya awal dari konflik yang lebih besar."
 mtg_usa_civil_war_fascists.2.a: "Darah telah tumpah. Kita harus memperkirakan akan lebih banyak lagi yang akan tertumpah sebelum masalah ini selesai."
 mtg_usa_civil_war_fascists.10.t: "Gudang Senjata Digerebek"
 mtg_usa_civil_war_fascists.10.desc: "Gudang senjata Angkatan Darat AS di [GetCSAState] diserang dan diambil alih sebentar kemarin. Detasemen kecil penjaga mendapati diri mereka ditentang oleh gerombolan besar bersenjata yang meminta kunci ruang penyimpanan. Ketika bala bantuan dari garnisun terdekat tiba, para penyerang sudah mundur, membawa serta sejumlah besar senjata kecil.\n\nMengingat para penjaga sama sekali tidak terluka dan bala bantuan membutuhkan waktu yang sangat lama untuk tiba, beberapa pihak di pemerintahan berspekulasi bahwa ini adalah serangan terkoordinasi."
 mtg_usa_civil_war_fascists.10.a: "Berita yang sangat meresahkan."
 mtg_usa_civil_war_fascists.11.t: "Negara Mengganggu Pengumpulan Pajak"
 mtg_usa_civil_war_fascists.11.desc: "Pemerintah [GetCSAState] telah mengirimkan polisi negara bagian untuk menutup semua operasi pengumpulan dan penilaian pajak di negara bagian tersebut. Selain itu, gubernur menyatakan segala pajak dan bea atas tembakau dan alkohol batal demi hukum dan memerintahkan dunia usaha untuk tidak membayar bea atau bea apa pun kepada Departemen Keuangan.\n\nNamun, ia juga memerintahkan agar badan usaha dan perorangan harus terus mengajukan pajak kepada otoritas pajak negara, termasuk pajak yang terhutang ke Departemen Keuangan."
 mtg_usa_civil_war_fascists.11.a: "serakah."
 mtg_usa_civil_war_fascists.12.t: "Umum [From.GetName] Mengundurkan Diri"
 mtg_usa_civil_war_fascists.12.desc: "Mengutip kesehatan yang buruk, Jenderal [From.GetName] telah menyerahkan pengunduran dirinya. Namun, sudah menjadi rahasia umum bahwa ia secara pribadi telah menyuarakan keprihatinan mendalam mengenai arah politik negaranya, bahkan mengklaim bahwa Perang Saudara Amerika akan segera terjadi.\n\nDaripada mempertimbangkan kesetiaannya sendiri, ia tampaknya telah memutuskan untuk tidak mengangkat senjata sama sekali terhadap sesama warga negaranya."
 mtg_usa_civil_war_fascists.12.a: "Dia akan dirindukan."
 mtg_usa_civil_war_fascists.13.t: "Gubernur memobilisasi Garda Nasional"
 mtg_usa_civil_war_fascists.13.desc: "Gubernur [usa_ng_mobilized.GetName] telah mengumumkan bahwa dia telah memobilisasi Garda Nasional negara bagian untuk apa yang disebutnya \"pelatihan dan latihan dalam jangka waktu yang lama\". Departemen perang mengklaim bahwa mereka tidak mengetahui adanya manuver yang direncanakan di [usa_ng_mobilized.GetName].\n\nTampaknya unit Garda Nasional juga membawa seluruh perbekalan dan amunisi ketika mereka berbaris, sehingga menimbulkan pertanyaan tentang apa yang sedang mereka persiapkan."
 mtg_usa_civil_war_fascists.13.a: "Sangat meresahkan."
 mtg_usa_civil_war_fascists.14.t: "Gurun Tentara"
 mtg_usa_civil_war_fascists.14.desc: "Laporan yang mengkhawatirkan datang dari beberapa unit bahwa tentara tidak kembali dari cuti atau meninggalkan pos mereka. Mungkin yang lebih mengkhawatirkan adalah kenyataan bahwa banyak dari tentara ini berasal dari wilayah geografis yang sama, dan banyak dari mereka menerima surat dari rumah hanya beberapa hari sebelum mereka menghilang.\n\nTampaknya ada upaya bersama untuk membuat tentara dari negara bagian selatan kembali ke rumah."
 mtg_usa_civil_war_fascists.14.a: "Ketidaksetiaan seperti itu."
 mtg_usa_civil_war_fascists.15.t: "Industrialis memindahkan Pabrik Senjata"
 mtg_usa_civil_war_fascists.15.desc: "Mengutip iklim politik yang tidak cocok untuk bisnis, pemilik sebuah perusahaan senjata besar hari ini mengumumkan bahwa ia akan memindahkan produksinya ke lokasi yang lebih sesuai. Dia secara khusus mencatat peningkatan aktivitas serikat pekerja yang menurutnya menurunkan produksi dan mengurangi kepercayaan investor. Sebaliknya, perusahaan akan membangun pabrik baru di lokasi yang dirahasiakan di negara bagian selatan."
 mtg_usa_civil_war_fascists.15.a: "Itu seharusnya tidak terlalu menjadi masalah."
 mtg_usa_civil_war_fascists.16.t: "Industrialis memindahkan Pabrik Sipil"
 mtg_usa_civil_war_fascists.16.desc: "Menurut dukungan rahasia dari Departemen Perdagangan, semakin banyak pengusaha di bagian utara AS yang membuat rencana untuk memindahkan produksi ke negara bagian lain setelah sejumlah pemogokan diserukan oleh serikat pekerja, menuntut upah yang lebih tinggi dan hari kerja yang lebih pendek. Iklim kekhawatiran yang mendalam telah terjadi di kalangan dunia usaha, dengan banyak orang berpendapat bahwa semakin sulit untuk menghasilkan keuntungan yang wajar di negara-negara yang tidak akan bertindak untuk menekan para pemogok ini."
 mtg_usa_civil_war_fascists.16.a: "Sebuah posisi yang absurd dan tidak lazim."
 mtg_usa_civil_war_fascists.20.t: "Pemisahan!"
 mtg_usa_civil_war_fascists.20.desc: "Pada pukul 08.00 hari ini, utusan khusus dari [CSAcapital.GetName] tiba di Gedung Putih untuk menyampaikan kepada Presiden [USA.GetLeader] catatan dari Legislasi Negara yang mengumumkan bahwa [CSAcapital.GetName] tidak lagi menganggap dirinya sebagai bagian dari republik. Mengklaim bahwa hal ini merupakan hak dasar setiap masyarakat beradab - dan mengutip secara ekstensif Deklarasi Kemerdekaan - catatan tersebut juga menyatakan dengan tegas bahwa pemisahan diri secara damai adalah demi kepentingan semua orang dan bahwa negara baru hanya ingin menjalankan urusannya sendiri sebagai tetangga yang baik bagi [USA.GetNameDef]."
 mtg_usa_civil_war_fascists.20.a: "Sebut saja apa adanya: Pengkhianatan."
 mtg_usa_civil_war_fascists.21.t: "Sebuah Rumah Terbagi"
 mtg_usa_civil_war_fascists.21.desc: "Hanya beberapa jam setelah negara bagian pertama memutuskan hubungannya dengan [USA.GetNameDef], negara bagian lain mengikuti dengan deklarasi yang terdengar hampir sama. Harapan pemisahan damai dengan cepat pupus ketika beberapa demonstrasi di negara-negara yang terkena dampak mendukung kelanjutan keanggotaan di [USA.GetNameDef] berubah menjadi berdarah dan sejumlah pejabat federal diserang. Dalam beberapa kasus, para pendukung Presiden [USA.GetLeader] - atau sekadar orang-orang yang dituduh kurang bersemangat untuk merdeka - digantung oleh massa. Presiden Sementara [CSA.GetLeader] menyebut peristiwa ini sebagai \"tindakan pembalasan sipil yang patut disesalkan namun dapat dimengerti terhadap tindakan pemerintah yang berlebihan\", dan menjanjikan pengampunan presiden bagi para pelakunya jika mereka melapor.\n\nIa lebih lanjut menuntut penarikan seluruh pasukan federal dari wilayah negara bagian baru serta zona demiliterisasi di perbatasan untuk menghindari \"kesalahpahaman lebih lanjut\". Presiden [USA.GetLeader] bahkan menolak untuk menerima gagasan tersebut dan memerintahkan militer untuk memulihkan ketertiban di negara-negara bagian yang sedang memberontak."
 mtg_usa_civil_war_fascists.21.a: "Kita sudah pernah ke sini sebelumnya, bukan?"
 mtg_usa_civil_war_fascists.22.t: "Bentuk Blok Netral"
 mtg_usa_civil_war_fascists.22.desc: "Menyusul pecahnya permusuhan antara [USA.GetNameDef] dan [CSA.GetNameDef], sejumlah badan legislatif negara bagian telah mengeluarkan mosi non-intervensi. Undang-undang ini memerintahkan gubernur untuk menjaga keutuhan wilayah negara dan mencegah masuknya pasukan tempur dari kedua sisi. Perjanjian-perjanjian tersebut selanjutnya melarang segala jenis upaya perekrutan oleh kedua belah pihak, namun yang terpenting, tidak membatasi penjualan senjata dan amunisi kepada salah satu pihak yang berkonflik dengan syarat pembayaran telah diberikan terlebih dahulu.\n\nMosi tersebut juga menekankan bahwa negara-negara bagian menganggap dirinya sebagai bagian dari [USA.GetNameDef] dan tidak ingin membentuk pemerintahan permanennya sendiri."
 mtg_usa_civil_war_fascists.22.a: "Mereka memang pengecut, tapi setidaknya bukan musuh."
 mtg_usa_civil_war_fascists.22.b: "Mereka telah memilih pihak mereka."
 mtg_usa_civil_war_fascists.23.t: "Blok Netral bubar"
 mtg_usa_civil_war_fascists.23.desc: "Dengan berakhirnya perang, negara-negara di blok netral telah mengumumkan bahwa mereka akan mengakhiri berbagai undang-undang dan tindakan yang diberlakukan untuk menjaga netralitas mereka. Mulai hari ini dan seterusnya, pasukan tempur dapat kembali memasuki wilayah mereka dengan bebas. Milisi yang dibentuk selama perang telah dibubarkan secara damai."
 mtg_usa_civil_war_fascists.23.a: "Bagaimanapun juga, mereka tidak sebanding dengan harga darahnya."
 mtg_usa_civil_war_fascists.201.t: "Relawan dari [CSA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.201.desc: "Ketika pasukan kami maju ke [CSA_liberated_state.GetName], mereka bertemu dengan sejumlah besar warga yang simpatik yang telah lama memendam simpati tersembunyi terhadap kami. Tersapu gelombang semangat patriotik, mereka meminta untuk bergabung dengan militer kami."
 mtg_usa_civil_war_fascists.201.a: "Bentuklah mereka menjadi unit-unit terpisah."
 mtg_usa_civil_war_fascists.201.b: "Integrasikan mereka ke dalam Angkatan Darat."
 mtg_usa_civil_war_fascists.202.t: "Relawan dari [USA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.202.desc: "Ketika pasukan kami maju ke [USA_liberated_state.GetName], mereka bertemu dengan sejumlah besar warga yang simpatik yang telah lama memendam simpati tersembunyi terhadap kami. Tersapu gelombang semangat patriotik, mereka meminta untuk bergabung dengan militer kami."
 mtg_usa_civil_war_fascists.203.t: "Pemberontak menciptakan pemerintahan kolaborasi di [USA_state_government_created.GetName]"
 mtg_usa_civil_war_fascists.203.desc: "Sebuah kelompok yang menamakan diri mereka Dewan Warga [USA_state_government_created.GetName] telah mengumumkan bahwa mereka telah mengambil alih administrasi [USA_state_government_created.GetName] dari otoritas militer [CSA.GetAdjective]. Meskipun mereka mengaku tidak berafiliasi dengan konflik yang sedang berlangsung, mereka juga mengumumkan bahwa mereka akan menerapkan beberapa undang-undang baru yang mengatur perekrutan anggota militer [CSA.GetAdjective].\n\nSebagai bagian dari pengumuman tersebut, mereka telah menyatakan bahwa delegasi kongres mana pun yang masih berada di ibu kota tidak lagi mewakili rakyat [USA_state_government_created.GetName]."
 mtg_usa_civil_war_fascists.203.a: "Pengkhianat satu dan semua."
 mtg_usa_congress_remove_state_tt: "Dua Senator dicopot dari Kongres."
 mtg_usa_congress_add_state_tt: "Dua Senator ditambahkan ke Kongres. Mereka awalnya akan §Gmendukung pemerintah§!."
 mtg_usa_civil_war_democrats.1.t: "Protes di Ibu Kota"
 mtg_usa_civil_war_democrats.1.desc: "Gelombang protes massal lainnya kembali melanda ibu kota, dengan demonstrasi yang menyumbat setiap jalan utama di dalam dan sekitar Gedung Capitol. Diorganisir oleh \"Komite Aksi Pelestarian Republik\", para pengunjuk rasa menuntut penyelidikan independen atas tuduhan korupsi dan pelanggaran dalam pemerintahan Presiden [USA.GetLeader]. Secara khusus, mereka menuntut Presiden untuk mengecam Legiun Perak dan meyakinkan mereka secara terbuka bahwa hak-hak mereka sebagai pemilih akan dihormati.\n\nPresiden [USA.GetLeader] menolak berkomentar mengenai masalah ini."
 mtg_usa_civil_war_democrats.1.a: "Biarkan mereka protes, kita punya negara yang harus dijalankan."
 mtg_usa_civil_war_democrats.2.t: "Sepuluh Juta-Maret"
 mtg_usa_civil_war_democrats.2.desc: "Di seluruh negeri, protes yang rutin menentang kebijakan Presiden [USA.GetLeader] semakin besar, dan kini mencapai beberapa juta pengunjuk rasa. Saat ini, lebih dari satu juta orang melakukan unjuk rasa di jalan-jalan Washington, dan jumlah serupa dilaporkan terjadi di setidaknya sembilan lokasi lainnya. Jumlah ini belum termasuk unjuk rasa yang lebih kecil di ibu kota negara bagian dan kota-kota kecil, yang masing-masing masih menarik ribuan orang, bahkan ada yang mencapai ratusan ribu orang. Protes ini terjadi setelah serangkaian keputusan kebijakan yang tidak populer oleh pemerintah, yang menurut para penyelenggara telah merusak tatanan demokrasi di republik ini.\n\nJika sebelumnya para pengunjuk rasa menuntut agar Presiden menjauhkan diri dari ideologi yang lebih radikal, mereka kini menuntut agar Presiden segera dicopot dari jabatannya."
 mtg_usa_civil_war_democrats.2.a: "Dan bagaimana mereka mengusulkan untuk menegakkan tuntutan tersebut?"
 mtg_usa_civil_war_democrats.10.desc: "Sebuah gudang senjata AS di bagian terpencil [GETUSASTATE] menjadi sasaran serangan oleh pasukan tak dikenal pada tadi malam. Sekelompok kecil pria bersenjata memaksa beberapa penjaga ke dalam sebuah gudang, di mana mereka dikurung di dalamnya. Ketika para prajurit berhasil melarikan diri setelah fajar, mereka menemukan gudang senjata telah dijarah seluruhnya. Tampaknya pada malam hari, para penyerang memindahkan sejumlah besar material ke lokasi yang tidak diketahui."
 mtg_usa_civil_war_democrats.11.t: "Bentuk Milisi Warga"
 mtg_usa_civil_war_democrats.11.desc: "Selama rangkaian unjuk rasa dan demonstrasi terakhir yang menentang kebijakan Presiden [USA.GetLeader], sejumlah besar pengunjuk rasa secara terbuka membawa senjata dan mengenakan ban lengan yang mengidentifikasi mereka sebagai bagian dari gerakan \"Milisi Warga\" yang sedang berkembang. Ketika ditantang oleh polisi, para pengunjuk rasa mengklaim bahwa mereka hanya menggunakan hak mereka berdasarkan Amandemen ke-2, namun FBI telah menemukan tanda-tanda bahwa kelompok-kelompok ini tidak hanya mempromosikan kepemilikan senjata secara pribadi.\n\nInforman telah melaporkan bahwa kelompok-kelompok bersenjata ini mengadakan pertemuan rutin dan mencoba mendapatkan akses ke manual pelatihan infanteri."
 mtg_usa_civil_war_democrats.11.a: "Tidak ada yang salah dengan itu."
 citizen_militia_tt: "Warga negara di Negara membentuk Unit Milisi yang akan aktif ketika perang pecah."
 mtg_usa_civil_war_democrats.14.t: "Pekerja mogok"
 mtg_usa_civil_war_democrats.14.desc: "Pemogokan massal telah dilaporkan terjadi di seluruh AS, dan berbagai serikat pekerja menyerukan tindakan. Hanya layanan yang paling penting saja yang dikecualikan. Perkelahian telah terjadi di banyak tempat antara pemogok dan pemecah pemogokan.\n\nTidak seperti biasanya, para buruh tidak menuntut kenaikan upah atau kelonggaran lainnya melainkan tidak lain adalah pengunduran diri Presiden [USA.GetLeader]."
 mtg_usa_civil_war_democrats.14.a: "Apa lagi yang diharapkan dari para pengkhianat komunis ini?"
 mtg_usa_civil_war_democrats.15.t: "Para industrialis memindahkan Pabrik Senjata"
 mtg_usa_civil_war_democrats.15.desc: "Dengan meningkatnya ketidakstabilan di seluruh negeri, banyak pengusaha diam-diam mulai mencari tempat yang lebih aman untuk mendirikan usaha. Secara khusus, negara-negara bagian selatan AS telah menikmati kebangkitan produksi industri, dengan beberapa perusahaan memindahkan seluruh pabriknya ke wilayah lain di negara tersebut."
 mtg_usa_civil_war_democrats.15.a: "Mereka dipersilakan."
 mtg_usa_civil_war_democrats.16.t: "Migrasi ekonomi"
 mtg_usa_civil_war_democrats.16.desc: "Setelah puluhan tahun melakukan migrasi dari daerah pedesaan menuju pusat industri di timur laut, laporan pemerintah baru-baru ini menunjukkan perubahan yang dramatis. Semakin banyak perusahaan di sektor sipil pindah ke negara-negara bagian selatan dan menetap di daerah-daerah yang sebelumnya terbelakang, sehingga membuka ratusan lapangan kerja baru. Banyak pemilik pabrik menyebut iklim yang \"tidak bersahabat\" di wilayah utara, yang sering dilanda pemogokan dan serikat pekerja yang semakin agresif, sebagai salah satu penyebabnya."
 mtg_usa_civil_war_democrats.16.a: "Ini membuktikan kebijakan Presiden berhasil!"
 mtg_usa_civil_war_democrats.20.t: "Pemberontakan Boston"
 mtg_usa_civil_war_democrats.20.desc: "Rangkaian protes terhadap Presiden akhirnya mencapai klimaks. Kemarin, setelah unjuk rasa mencapai tujuannya di pusat kota Boston, para pengunjuk rasa tidak bubar untuk pulang. Sebaliknya, mereka pecah menjadi kelompok-kelompok kecil dan merebut lokasi-lokasi penting di sekitar kota. Saat malam tiba, mereka menguasai penuh kota. Sebagian besar polisi telah menangani para pengunjuk rasa, dan gubernur Massachusetts menolak mengirimkan Garda Nasional.\n\nSebuah \"Komite Warga Boston\" telah mengambil alih kendali kota dan dilaporkan bekerja sama dengan para pemberontak. Negara bagian lain di New England telah memberikan mosi dukungan, menyatakan bahwa mereka tidak lagi menganggap diri mereka terikat oleh undang-undang apa pun yang ditandatangani oleh Presiden [USA.GetLeader]. Sebaliknya, mereka menyerukan kepada semua pemerintah negara bagian lain di Amerika Serikat untuk mendeklarasikan Presiden digulingkan, Kongres dibubarkan dan menyelenggarakan pemilu baru.\n\nSementara sebagian dari militer tetap berada di pihak kita, seluruh formasi telah memberi tahu perwira mereka bahwa mereka tidak akan mematuhi perintah untuk menumpas pemberontakan."
 mtg_usa_civil_war_democrats.20.a: "Tidak ada yang akan menganggapnya serius. Ini akan reda."
 mtg_usa_civil_war_democrats.21.t: "Pemberontakan menyebar ke Pantai Barat"
 mtg_usa_civil_war_democrats.21.desc: "Pemerintah negara bagian California, Oregon, dan Washington semuanya telah menyatakan dukungan mereka terhadap Pemerintah Boston dan memerintahkan semua pejabat federal untuk mengundurkan diri dari jabatan mereka atau segera meninggalkan wilayah negara bagian tersebut. Meskipun ada laporan mengenai adanya kelompok-kelompok perlawanan yang tersebar terhadap tindakan ini, tampaknya gerakan ini mendapat dukungan dari masyarakat."
 mtg_usa_civil_war_democrats.21.a: "Kami masih memegang pusat negara."
 mtg_usa_civil_war_democrats.22.t: "Midwest menyatakan untuk pemerintah"
 mtg_usa_civil_war_democrats.22.desc: "Dengan semakin banyaknya negara bagian yang menolak untuk mengikuti arahan dari pemerintah yang sah, gubernur Ohio, Missouri, Wisconsin, Illinois, Indiana dan Michigan bersama-sama menyatakan bahwa mereka tidak akan mentolerir perilaku hasutan apa pun di antara penduduknya. Perang saudara yang baru, menurut mereka, akan membuat Amerika semakin lemah dalam menghadapi agresi asing."
 mtg_usa_civil_war_democrats.22.a: "Mereka juga harus melakukannya."
 mtg_usa_civil_war_democrats.23.t: "Pantai Timur bergabung dengan Pemberontakan"
 mtg_usa_civil_war_democrats.23.desc: "Pasukan pemberontak yang bergerak ke selatan dari New England disambut secara luas sebagai pembebas di Maryland, New York, Pennsylvania dan New Jersey, dan gubernur setempat memerintahkan polisi negara bagian dan garda nasional untuk tidak ikut campur. Segala upaya untuk menggalang kekuatan loyalis di sekitar ibu kota telah gagal. Presiden [USA.GetLeader] dievakuasi dari Washington hanya beberapa jam sebelum pasukan pemberontak menutup semua pintu keluar. Kolom motornya telah sampai ke Richmond, Virginia, dan kemungkinan akan berlanjut lebih jauh ke selatan."
 mtg_usa_civil_war_democrats.23.a: "Kami akan kembali."
 mtg_usa_civil_war_democrats.25.t: "Pemisahan Barat Laut"
 mtg_usa_civil_war_democrats.25.desc: "Gubernur Wyoming, Idaho dan Montana telah bersama-sama menyatakan dukungannya kepada pemerintah Boston. Pasukan pemberontak dari Washington dan Oregon telah menjalin hubungan dengan rekan seperjuangan mereka di negara bagian tersebut."
 mtg_usa_civil_war_democrats.25.a: "Lagipula, sebagian besar lahannya kosong."
 mtg_usa_civil_war_democrats.26.t: "North-West menyatakan untuk pemerintah"
 mtg_usa_civil_war_democrats.26.desc: "Badan legislatif negara bagian Wyoming, Idaho dan Montana telah mengesahkan serangkaian undang-undang anti-hasutan, yang memberikan lembaga penegak hukum setempat kewenangan luas untuk menangkap dan menahan siapa pun yang kedapatan menentang pemerintah federal selama masa darurat saat ini. Namun, kehadiran pasukan pemberontak di dekat Washington dan Oregon akan memerlukan dukungan cepat dari pasukan loyalis."
 mtg_usa_civil_war_democrats.26.a: "Ini adalah wilayah yang strategis."
 mtg_usa_civil_war_democrats.27.t: "Bagian Barat Daya Memisahkan"
 mtg_usa_civil_war_democrats.27.desc: "Nevada, Arizona, Utah, New Mexico dan Colorado semuanya telah mendeklarasikan Pemberontakan. Pejabat negara bagian yang menolak mengikuti perintah untuk mengizinkan lewatnya pasukan pemberontak dari Kalifornia telah dicopot dari jabatannya dan dalam banyak kasus dipenjarakan."
 mtg_usa_civil_war_democrats.27.a: "Gurun yang luar biasa dan tidak berguna untuk dipertahankan."
 mtg_usa_civil_war_democrats.28.t: "Barat Daya mendeklarasikan untuk pemerintah"
 mtg_usa_civil_war_democrats.28.desc: "Gubernur Nevada, Arizona, Utah, New Mexico dan Colorado telah mengumumkan keadaan darurat menyusul demonstrasi yang meluas untuk mendukung Pemerintah Boston. Dalam beberapa kasus, polisi negara bagian dan unit Garda Nasional menembaki para pengunjuk rasa, yang melarikan diri dengan panik, menyeret korban tewas dan terluka bersama mereka."
 mtg_usa_civil_war_democrats.28.a: "Waktu untuk unjuk rasa dan pidato sudah lama berlalu."
 mtg_usa_civil_war_democrats.29.t: "West Mid-West Memisahkan"
 mtg_usa_civil_war_democrats.29.desc: "Pemerintah negara bagian Dakota, Iowa, Minnesota dan Nebraska digulingkan dari jabatannya karena pemberontakan yang terkoordinasi dan dilaksanakan dengan baik, didukung oleh aparat penegak hukum setempat dan pengawal nasional yang simpatik. Gubernur Sementara yang dipilih dengan tergesa-gesa telah menyatakan dukungan mereka terhadap Pemerintah Boston."
 mtg_usa_civil_war_democrats.29.a: "Wilayah itu dapat direbut kembali dengan mudah."
 mtg_usa_civil_war_democrats.30.t: "West Mid-West mendeklarasikan untuk pemerintah"
 mtg_usa_civil_war_democrats.30.desc: "Pemerintah negara bagian Dakota, Iowa, Minnesota dan Nebraska hari ini berhasil mengalahkan upaya kudeta yang tampaknya terencana dengan baik oleh elemen sayap kiri, yang didukung oleh penegak hukum dan Garda Nasional yang memberontak. Warga negara yang loyal berhasil melindungi badan legislatif negara bagian dan mencegah penangkapan beberapa gubernur, namun menderita korban dalam beberapa baku tembak sengit yang terjadi di ibu kota negara bagian."
 mtg_usa_civil_war_democrats.30.a: "Pahlawan satu dan semua."
 mtg_usa_civil_war_democrats.31.t: "Bagian Barat Tengah Memisahkan"
 mtg_usa_civil_war_democrats.31.desc: "Mengutip kurangnya dukungan dari pemerintah dan \"kurangnya kepemimpinan dari Mantan Presiden [USA.GetLeader]\", gubernur Ohio, Missouri, Wisconsin, Illinois, Indiana dan Michigan telah mendeklarasikan diri untuk Pemerintah Boston. Hubungan di dalam kubu pemberontak kemungkinan besar akan tegang karena semua gubernur ini sebelumnya dianggap kuat di kubu Presiden."
 mtg_usa_civil_war_democrats.31.a: "Mereka hanyalah pengkhianat terakhir dari barisan panjang pengkhianat yang harus ditangani."
 mtg_usa_civil_war_democrats.40.t: "MacArthur menawarkan untuk memimpin Pemerintahan"
 mtg_usa_civil_war_democrats.40.desc: "Ketika pemerintah mundur sepenuhnya dan sebagian besar negara berpihak pada pemberontakan, Jenderal MacArthur telah mendekati kami dengan sebuah tawaran. Menunjukkan bahwa hanya dia yang benar-benar memahami pola pikir Amerika dan memberikan stabilitas dan kepemimpinan di saat krisis ini, MacArthur telah menawarkan untuk memimpin 'Pemerintah Pertahanan Nasional' sampai pemberontakan berhasil dikalahkan. Menurut MacArthur, hal ini untuk mengurangi gesekan antara pimpinan sipil dan komandan militer dengan menempatkan Jenderal MacArthur sebagai penanggung jawab.\n\nBeberapa orang di pemerintahan merasa tidak nyaman dengan kenyataan bahwa ia terus menyebut dirinya sebagai orang ketiga."
 mtg_usa_civil_war_democrats.40.a: "Saat-saat yang sulit memerlukan tindakan yang mendesak."
 mtg_usa_civil_war_democrats.40.b: "Itu akan menjadi akhir dari republik ini."
 mtg_usa_civil_war_democrats.41.t: "William Dudley Pelley menantang [USA.GetLeader]"
 mtg_usa_civil_war_democrats.41.desc: "Dengan berakhirnya pemberontakan di Boston, banyak orang di pemerintahan tidak yakin bagaimana melanjutkannya. Pemerintahan Pertahanan Nasional MacArthur awalnya diperkirakan hanya akan bertahan hingga perang berakhir. Namun, dunia di sekitar [USA.GetNameDef] kini semakin bermusuhan, dan kita mungkin akan segera kembali berperang. Pemimpin fasis William Dudley Pelley secara terbuka menyerukan kembalinya 'pemerintahan yang sah dan tertib', sambil berterima kasih kepada MacArthur atas jasanya. Merujuk pada lonjakan dukungan terhadap gerakannya selama perang, Pelley dengan jelas menganggap dirinya ditakdirkan untuk menduduki posisi Presiden dan Pemimpin Amerika.[USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\nDalam sebuah pertunjukan kerendahan hati yang tidak seperti biasanya, [USA.GetLeader] telah menawarkan untuk mundur jika opini publik menuntutnya. Rakyat Amerika memandang kami untuk melihat bagaimana seluruh pemerintahan mempertimbangkan masalah ini."
 USA_hilt_candidate: "Yang menambah kebingungan adalah Tuan Adam Hilt yang sebelumnya tidak dikenal secara politik, kepala firma arsitektur Hilt & Partner yang terkenal di dunia - sebelumnya berasal dari Berlin tetapi dievakuasi ke Brownow, Arkansas, selama Perang Saudara Jerman - yang baru-baru ini secara terbuka mengumumkan kesediaannya untuk mengabdi pada negara tempat ia dilahirkan. Beberapa pengkritik mengajukan pertanyaan tentang aksen Jerman yang diucapkan Hilt, sesuatu yang menurut Mr. Hilt berasal dari pengalaman bertahun-tahun bekerja dan belajar seni di Jerman. Menurut Hilt, detail-detail kecil seperti itu hanya berfungsi untuk mengalihkan perhatian dari isu-isu besar dan tidak lebih dari upaya pengecut untuk mencoreng nama baik seorang patriot dan warga negara yang dilahirkan secara alami."
 USA_lindbergh_candidate: "Mengutip jasanya kepada negara menjelang perang baru-baru ini dan terhadap penerbangan secara umum, penerbang terkenal Charles Lindbergh juga telah melemparkan topinya ke dalam ring. Mengingat sifat dua kandidat utama yang memecah belah, Lindbergh yakin dia adalah orang terbaik yang bisa bersatu dan menginspirasi negara untuk mengatasi perbedaan dan kembali ke kejayaannya."
 mtg_usa_civil_war_democrats.41.d: "Minta Charles Lindbergh untuk membentuk pemerintahan."
 mtg_usa_civil_war_democrats.41.a: "Dia telah melakukan tugasnya."
 mtg_usa_civil_war_democrats.41.b: "Republik masih membutuhkannya."
 mtg_usa_civil_war_democrats.41.c: "Tuan Hilt tampaknya merupakan kandidat terbaik untuk membangun kembali negara ini."
 mtg_usa_canadian_corridor.1.t: "Koridor Kanada"
 mtg_usa_canadian_corridor.1.desc: "Duta Besar kami di [USA.GetNameDef] dipanggil ke Departemen Luar Negeri hari ini dan diberikan ultimatum. Menurut catatan yang diserahkan kepadanya, pemerintah [USA.GetNameDef] tidak dapat lagi menerima kedaulatan Kanada atas wilayah antara Washington dan Alaska.\n\nSaran untuk merundingkan perjanjian yang mengizinkan lewatnya pasukan dan pengecualian dari kontrol perbatasan tertentu ditolak mentah-mentah. Pemerintah [USA.GetAdjective] mengharapkan jawaban pada tengah malam."
 mtg_usa_canadian_corridor.1.a: "Mereka akan memilikinya."
 mtg_usa_canadian_corridor.1.b: "Tidak pernah!"
 mtg_usa_canadian_corridor.2.t: "[CAN.GetNameDefCap] menerima"
 mtg_usa_canadian_corridor.2.desc: "Pemerintah [CAN.GetLeader] telah menyetujui tuntutan kami dan menarik diri dari wilayah yang diperebutkan. Pasukan kita telah bergerak maju untuk membangun kendali atas pos-pos peradaban yang ada di luar kota."
 mtg_usa_canadian_corridor.2.a: "Mereka memilih dengan bijak."
 mtg_usa_canadian_corridor.3.t: "[CAN.GetNameDefCap] Menolak"
 mtg_usa_canadian_corridor.3.desc: "Menyebut proposal kami \"tidak lain adalah menawarkan 'Vancouver atau Perang!', dan mengharapkan kami menyerah seperti pengecut\", [CAN.GetLeader] secara terbuka mengecam upaya diplomasi lebih lanjut. Pasukan [CAN.GetAdjective] dilaporkan bersiaga tinggi dan menduduki posisi bertahan di sepanjang perbatasan."
 mtg_usa_canadian_corridor.3.a: "Kami menawarkan perdamaian dan mereka memilih perang."
 mtg_usa_canadian_corridor.3.b: "Kita tidak mampu berperang demi sekumpulan batu dan pepohonan."
 mtg_usa_southern_threat.1.t: "[USA.GetNameDefCap] menuntut Perjanjian Musyawarah dan Persahabatan"
 mtg_usa_southern_threat.1.desc: "Presiden [USA.GetLeader] telah memanggil duta besar kami untuk menyerahkan serangkaian tuntutan dari pemerintah AS. Diantaranya adalah hak konsultasi khusus bagi Duta Besar [USA.GetAdjective]. Akibatnya, hak-hak ini akan memberikan hak veto kepada pemerintah [USA.GetAdjective] atas keputusan apa pun yang kita buat.\n\nJika kita menolak, lanjut catatan tersebut, pemerintah [USA.GetAdjective] akan terpaksa \"mengambil tindakan yang dianggap perlu untuk menjamin keamanan nasional\"."
 mtg_usa_southern_threat.1.a: "Kita harus menerima hal-hal yang tidak dapat diterima untuk menghindari pertumpahan darah."
 mtg_usa_southern_threat.1.b: "Tidak pernah!"
 mtg_usa_southern_threat.2.t: "[MEX.GetLeader] menerima"
 mtg_usa_southern_threat.2.desc: "Menyadari posisi mereka yang tidak ada harapan, pemerintah [MEX.GetLeader] telah menerima usulan kami dan setuju untuk berkonsultasi dengan kami sebelum mengambil keputusan kebijakan besar."
 mtg_usa_southern_threat.2.a: "Pershing akan bangga."
 mtg_usa_southern_threat.3.t: "[MEX.GetLeader] menolak."
 mtg_usa_southern_threat.3.desc: "Dalam pidato panjang lebar, mengenang kepahlawanan generasi Meksiko di masa lalu dalam menghadapi \"agresi Amerika yang terang-terangan\", [MEX.GetLeader] bahkan menolak untuk mempertimbangkan permintaan kami dan mengatakan kepada duta besar kami bahwa rakyat Meksiko tidak akan pernah tunduk pada penjajah asing."
 mtg_usa_southern_threat.3.a: "Kita tidak bisa membiarkan penghinaan ini dibiarkan begitu saja."
 mtg_usa_southern_threat.3.b: "Perang saat ini bukanlah kepentingan terbaik kita."
 mtg_usa_north_american_dominion.1.t: "[USA.GetNameDefCap] menuntut Pengendalian Kebijakan Luar Negeri"
 mtg_usa_north_american_dominion.1.desc: "Dalam apa yang tampaknya merupakan bagian dari serangan diplomatik terpadu di seluruh Amerika Utara dan Karibia, duta besar [USA.GetAdjective] telah menyerahkan sebuah catatan dari Presiden [USA.GetLeader] yang memberi tahu kita bahwa pemerintahannya mengharapkan kita untuk berkonsultasi dengan mereka dalam setiap pengambilan kebijakan luar negeri di masa depan, \"demi kepentingan perdamaian dan niat baik yang berkelanjutan di antara bangsa kita\"."
 mtg_usa_north_american_dominion.1.a: "Kami tidak punya pilihan."
 mtg_usa_north_american_dominion.2.t: "[From.GetNameDefCap] menerima penaklukan"
 mtg_usa_north_american_dominion.2.desc: "Pemerintah [From.GetLeader] telah menyetujui permintaan kami dan akan mengizinkan duta besar kami untuk memveto keputusan kebijakan besar apa pun yang mereka buat."
 mtg_usa_north_american_dominion.2.a: "Sebuah pilihan yang bijaksana."
 mtg_usa_north_american_dominion.3.t: "[From.GetNameDefCap] Menolak"
 mtg_usa_north_american_dominion.3.desc: "[From.GetLeader] bereaksi dengan sangat cemas terhadap nota diplomatik kami. Dalam jawabannya, ia menyatakan bahwa [From.GetNameDef] mempunyai sejarah kemerdekaan dan kedaulatan yang panjang dan membanggakan serta tidak akan pernah mengizinkan kekuatan asing untuk memaksakan kehendaknya terhadap mereka.\n\nIa selanjutnya memohon kepada Presiden [USA.GetLeader] untuk mempertimbangkan konsekuensi perang dalam masalah ini, yang tentunya akan membuat [USA.GetNameDef] dicap sebagai ancaman terbesar bagi perdamaian dan akan memiliki konsekuensi yang tidak terbayangkan."
 mtg_usa_north_american_dominion.3.a: "Kata-kata berani dari seseorang yang begitu lemah."
 mtg_usa_north_american_dominion.3.b: "Mungkin dia benar."
 mtg_usa_strategic_interests.1.t: "AS menuntut Wilayah"
 mtg_usa_strategic_interests.1.desc: "Presiden [USA.GetLeader] telah tiba di London untuk membahas sejumlah usulan terkait kepemilikan beberapa lokasi strategis di seluruh dunia. Menurut pemerintah [USA.GetAdjective], [ENG.GetNameDef] tidak memiliki sumber daya dan kemauan untuk mempertahankan wilayah tersebut dengan cara yang menjamin bahwa kepentingan [USA.GetAdjective] terpenuhi. Kecuali pemerintah [ENG.GetAdjective] dapat memberikan jaminan yang memadai bahwa komitmen ini dipenuhi, para analis yakin bahwa [USA.GetLeader] akan menuntut agar kita menyerahkan kendali atas wilayah ini kepada [USA.GetNameDefCap]."
 mtg_usa_strategic_interests.1.a: "Mereka dipersilakan untuk itu."
 mtg_usa_strategic_interests.1.b: "Ini adalah wilayah yang strategis!"
 mtg_usa_strategic_interests.2.t: "[From.GetNameDefCap] menyerahkan wilayah"
 mtg_usa_strategic_interests.2.desc: "Setelah perdebatan internal yang panjang, pemerintah [ENG.GetAdjective] memutuskan untuk menerima proposal kami. Jadwal telah disepakati oleh kedua belah pihak untuk mengalihkan kepemilikan wilayah yang diminta."
 mtg_usa_strategic_interests.2.a: "Hebat!"
 mtg_usa_strategic_interests.3.t: "[From.GetNameDefCap] Menolak Bekerjasama"
 mtg_usa_strategic_interests.3.desc: "Hanya beberapa menit setelah pertemuan, [ENG.GetLeader] dan [USA.GetLeader] menghentikan negosiasi karena jawaban [ENG.GetAdjective] adalah \"Tidak\" yang sangat sederhana. Catatan resmi yang lebih luas kemudian menyusul, namun hal ini hanya memperkuat penolakan untuk membahas persyaratannya."
 mtg_usa_strategic_interests.3.a: "Kalau begitu mari kita lihat apakah mereka bisa mempertahankannya dengan baik!"
 mtg_usa_strategic_interests.3.b: "Wilayah-wilayah ini tidak sebanding dengan harganya."
 mtg_usa_pacific_pacification.1.t: "[USA.GetNameDefCap] menuntut kepemilikan kolonial"
 mtg_usa_pacific_pacification.1.desc_a: "Delegasi pemerintah [USA.GetAdjective] telah tiba untuk membahas keamanan kepemilikan kita di Pasifik. Memperhatikan ketidakstabilan yang terus berlanjut di Tiongkok dan situasi di Jepang, Presiden [USA.GetLeader] bersedia memikul tanggung jawab untuk membela [GET_AUSTRALIA_NEW_ZEALAND_STATUS], dengan imbalan sejumlah hak istimewa dan hak cadangan.\n\nMeskipun [USA.GetAdjective] mengklaim bahwa hak-hak ini hanya akan digunakan untuk menjamin keamanan [GET_AUSTRALIA_NEW_ZEALAND_STATUS], banyak orang di pemerintahan percaya bahwa hal itu akan membuat [GET_AUSTRALIA_NEW_ZEALAND_STATUS] tidak lebih dari boneka."
 mtg_usa_pacific_pacification.1.desc_b: "Delegasi pemerintah [USA.GetAdjective] telah tiba untuk membahas rencana pertahanan kita bersama. Tampaknya Presiden [USA.GetLeader] menganggap bagian kecil dari dunia ini sangat penting bagi keamanan [USA.GetNameDef]. Namun, selain jaminan sederhana untuk membantu kami, pemerintah [USA.GetAdjective] ingin memastikan bahwa kami sendiri tidak dapat menjadi ancaman. Oleh karena itu, perjanjian ini dilengkapi dengan sejumlah ketentuan yang memungkinkan [USA.GetNameDef] memberikan suara yang signifikan mengenai bagaimana kita menjalankan urusan internal kita.\n\nMeskipun ancaman perang belum disampaikan dalam perundingan sejauh ini, jelas bahwa Presiden [USA.GetLeader] akan menganggap penolakan kami sebagai tindakan yang sangat bermusuhan."
 AST_NZL_PUPPET: "Australia dan Selandia Baru"
 AST_NZL_NO_PUPPET_FALLBACK: "negara-negara di Kawasan Pasifik Selatan"
 mtg_usa_pacific_pacification.1.a: "Tentunya mereka tidak akan ikut campur dalam urusan internal."
 mtg_usa_pacific_pacification.1.b: "Kami bisa mempertahankan area tersebut dengan baik."
 mtg_usa_pacific_pacification.2.t: "[From.GetNameDefCap] menerima"
 mtg_usa_pacific_pacification.2.desc: "Pemerintah [From.GetLeader] telah menerima proposal kami. Sebuah komite gabungan khusus telah dibentuk untuk mengkoordinasikan pelaksanaan rinciannya."
 mtg_usa_pacific_pacification.2.a: "Kerja bagus."
 mtg_usa_pacific_pacification.3.t: "[From.GetNameDefCap] Menolak"
 mtg_usa_pacific_pacification.3.desc: "Pemerintah [From.GetNameDef] bahkan menolak untuk bertemu dengan delegasi kami, dengan alasan bahwa tidak ada masalah yang belum terselesaikan di antara negara kami. Namun, atase militer di [GET_AUSTRALIA_NEW_ZEALAND_STATUS] telah melaporkan peningkatan signifikan dalam manuver militer akhir-akhir ini."
 mtg_usa_pacific_pacification.3.a: "Kami tidak punya pilihan selain menggunakan kekerasan."
 mtg_usa_pacific_pacification.3.b: "Kita tidak mampu melakukan perang."
 mtg_usa_secure_asia.1.t: "[USA.GetNameDefCap] memberikan tekanan"
 mtg_usa_secure_asia.1.desc: "Presiden [USA.GetLeader] telah mengirimkan perwakilan khusus ke ibu kota untuk bertemu dengan [This.GetLeader] dan membahas minat baru [USA.GetNameDef] di daerah tersebut. [This.GetNameDefCap] jelas merupakan kunci utama strategi [USA.GetAdjective] di wilayah ini. Oleh karena itu, telah dikomunikasikan kepada pemerintah kita bahwa [USA.GetNameDef] tidak dapat mentolerir pemerintahan yang tidak bersahabat atau bahkan bermusuhan di [This.GetNameDef]."
 mtg_usa_secure_asia.1.a: "Lebih baik hidup berlutut."
 mtg_usa_secure_asia.1.b: "Lebih baik mati berdiri."
 mtg_usa_secure_asia.2.t: "[From.GetLeader] menerima"
 mtg_usa_secure_asia.2.desc: "Setelah negosiasi ekstensif dan jaminan keselamatan pribadinya, [From.GetLeader] telah menerima untuk memberikan hak konsultasi ekstensif kepada Utusan Khusus kami, sehingga kami dapat memiliki pengaruh yang signifikan terhadap masalah internal mereka."
 mtg_usa_secure_asia.2.a: "Luar biasa."
 mtg_usa_secure_asia.3.t: "[From.GetNameDefCap] Menantang"
 mtg_usa_secure_asia.3.desc: "Sebuah pesan telah tiba dari pemerintah [From.GetAdjective]: \"Kebebasan, sekali dimenangkan, tidak boleh dilepaskan.\" Tidak ada komunikasi lebih lanjut yang diterima, dan duta besar kami di [From.GetNameDef] telah menyerahkan paspornya."
 mtg_usa_secure_asia.3.a: "Berani. Bodoh, tentu saja, tapi berani."
 mtg_usa_secure_asia.3.b: "Bagaimanapun juga, mereka tidak penting."
 mtg_usa_secure_asia.4.t: "AS menuntut Kontrol atas Koloni"
 mtg_usa_secure_asia.4.desc: "Dalam konferensi pers baru-baru ini, Presiden [USA.GetLeader] mengumumkan pandangan strategis baru untuk kawasan Indo-Tiongkok dan Asia Tenggara. Pemerintahannya tidak akan lagi menerima kekosongan kekuasaan di wilayah tersebut. Kendali apa pun yang ada di Indonesia masih terlalu lemah untuk menjamin keamanan kepentingan [USA.GetAdjective] di wilayah tersebut. Pemerintahannya bertujuan untuk mengubah hal ini.\n\nSaat dipanggil oleh [This.GetLeader] untuk menjelaskan komentarnya, duta besar [USA.GetAdjective] menyerahkan catatan yang menguraikan posisi [USA.GetAdjective] secara rinci. Tuntutan tersebut tidak lain hanyalah penyerahan kendali atas Kepulauan Indonesia kepada kendali [USA.GetAdjective]."
 mtg_usa_secure_asia.4.a: "Mereka dipersilakan untuk itu."
 mtg_usa_secure_asia.4.b: "Sebuah usulan yang tidak masuk akal."
 mtg_usa_secure_asia.5.t: "[From.GetLeader] menerima proposal kami."
 mtg_usa_secure_asia.5.desc: "Berbicara di hadapan pers, [From.GetLeader] hari ini mengumumkan bahwa pemerintahnya telah menandatangani perjanjian dengan [USA.GetNameDef] mengenai kedaulatan bersama di Hindia Timur.\n\nPerjanjian tersebut berisi sejumlah ketentuan rahasia yang pada dasarnya akan mengalihkan kendali kepada kami segera setelah administrator kami menjabat. Departemen Luar Negeri telah mengirim sejumlah pejabat ke wilayah tersebut."
 mtg_usa_secure_asia.5.a: "Hasil terbaik yang mungkin."
 mtg_usa_secure_asia.6.t: "[From.GetNameDefCap] keluar"
 mtg_usa_secure_asia.6.desc: "Negosiasi dengan [From.GetNameDef] telah gagal segera setelah dimulai. Kabinet [From.GetAdjective] membahas nota kami kurang dari satu jam sebelum akhirnya menolaknya. Menteri Luar Negeri [From.GetAdjective] telah memberi tahu duta besar kami bahwa kecuali proposal tersebut diubah secara substansial, tidak ada yang perlu dibahas."
 mtg_usa_secure_asia.6.a: "Mereka mempunyai kesempatan untuk menyelesaikan masalah ini secara damai. Mereka memilih untuk tidak melakukannya."
 mtg_usa_secure_asia.6.b: "Mereka mungkin mempertahankan wilayahnya...untuk saat ini."
 mtg_usa_secure_asia.7.t: "[USA.GetNameDefCap] menuntut Indochina"
 mtg_usa_secure_asia.7.desc: "Sebagai bagian dari serangan diplomatik yang lebih besar, Presiden [USA.GetLeader] telah secara terbuka mengidentifikasi Vietnam dan Indochina sebagai wilayah yang sangat penting bagi [USA.GetNameDef]. Oleh karena itu, [USA.GetNameDef] bertujuan untuk meningkatkan kehadiran mereka di wilayah tersebut.\n\nSecara pribadi, [USA.GetNameDef] telah membuat pernyataan yang sangat agresif tentang Indochina. Selain memberikan tekanan pada [SIA.GetNameDef], mereka juga menuntut hak untuk menempatkan pasukan di wilayah jajahan kita dan 'mengarahkan' pemerintahan kolonial.\n\nPada dasarnya, hal ini berarti menyerahkan wilayah tersebut ke dalam kendali mereka."
 mtg_usa_secure_asia.7.a: "Biarkan mereka memiliki Vietnam."
 mtg_usa_secure_asia.7.b: "Ini adalah wilayah [This.GetAdjective] yang penting!"
 mtg_usa_secure_asia.8.t: "[From.GetNameDefCap] menyerahkan Indochina"
 mtg_usa_secure_asia.8.desc: "pemerintah [From.GetAdjective] telah menyetujui tuntutan kami dan menginstruksikan pemerintah daerah untuk bekerja sama sepenuhnya sampai kami dapat menempatkan orang-orang kami di tempatnya."
 mtg_usa_secure_asia.8.a: "Keterlibatan kami di Vietnam menandai era baru perdamaian dan kemakmuran di kawasan."
 mtg_usa_secure_asia.9.t: "[From.GetNameDefCap] Menolak"
 mtg_usa_secure_asia.9.desc: "Setelah perundingan yang berkepanjangan dan semakin memanas, pemerintah [From.GetAdjective] akhirnya menolak usulan kami. Duta Besar kami di [From.GetNameDef] melaporkan bahwa dia bahkan tidak bisa lagi membuat janji dengan [From.GetLeader]."
 mtg_usa_secure_asia.9.a: "Kami tidak akan berkompromi dengan keamanan nasional."
 mtg_usa_secure_asia.9.b: "Terlibat di Vietnam adalah kesalahan besar."
 mtg_usa_protect_south_america.1.t: "KTT Keamanan Amerika Selatan"
 mtg_usa_protect_south_america.1.desc: "Pada pertemuan puncak di ibu kota [USA.GetAdjective], Presiden [USA.GetAdjective] [USA.GetLeader] telah menyerukan arsitektur keamanan baru di Amerika Selatan. Meskipun dikemas dalam istilah diplomatik, pemerintah [USA.GetAdjective] dengan jelas membayangkan dirinya sebagai kekuatan utama di belakang keamanan benua ini, dan sebagai imbalannya mengharapkan kita untuk mengikuti panduan politik mereka.\n\nFaktanya, para diplomat [USA.GetAdjective] telah mendorong hal ini di belakang layar dan menerjemahkan proposal ini ke dalam poin-poin tindakan nyata seperti hak konsultasi khusus dan hak veto untuk duta besar AS – dan hanya AS duta besar.\n\nYang lebih mengerikan adalah kenyataan bahwa menolak menerima hal ini, menurut Presiden, akan dianggap sebagai tindakan bermusuhan dan mengganggu stabilitas, dengan konsekuensi yang 'sangat disayangkan'."
 mtg_usa_protect_south_america.1.a: "Konsekuensinya terlalu berat untuk ditanggung."
 mtg_usa_protect_south_america.1.b: "Kami akan mempertahankan kebebasan kami!"
 mtg_usa_protect_south_america.2.t: "[From.GetNameDefCap] menerima Panduan kami"
 mtg_usa_protect_south_america.2.desc: "Presiden [From.GetLeader] telah menerima usulan kami dan menginstruksikan Menteri Luar Negeri [From.GetAdjective] untuk merundingkan rincian lebih lanjut."
 mtg_usa_protect_south_america.2.a: "Seorang pemimpin sejati."
 mtg_usa_protect_south_america.3.t: "[From.GetNameDefCap] Menolak Panduan kami"
 mtg_usa_protect_south_america.3.desc: "Delegasi dari [From.GetNameDef] sudah buru-buru meninggalkan puncak untuk melakukan perjalanan pulang. Sejauh ini Duta Besar [From.GetAdjective] menolak berkomentar mengenai hal tersebut dan mengaku masih menunggu instruksi dari dalam negeri."
 mtg_usa_protect_south_america.3.a: "Kita tidak bisa membiarkan para pemberontak ini mengancam kawasan."
 mtg_usa_protect_south_america.3.b: "Perang hanya akan mempercepat destabilisasi kawasan."
 mtg_usa_foreign_support.1.t: "Donasi untuk [USA.GetNameDef]"
 mtg_usa_foreign_support.1.desc: "Beberapa anggota terkemuka dari Silver Legion of America telah mengikuti tur ceramah melalui [This.GetNameDef], berbicara panjang lebar tentang ancaman yang dihadapi negara mereka dari komunis yang sudah mengakar kuat di semua tingkat pemerintahan. Cara hidup orang Amerika sedang diserang, dan dukungan apa pun yang dapat kami berikan akan sangat kami hargai dan mungkin dapat membuat perbedaan dalam perjuangan yang sangat diperlukan di masa depan."
 mtg_usa_foreign_support.1.a: "Kita harus melakukan apa yang kita bisa."
 mtg_usa_foreign_support.1.b: "Kami tidak mampu membeli apa pun."
 mtg_usa_foreign_support.2.t: "[From.GetNameDefCap] menyetujui sumbangan"
 mtg_usa_foreign_support.2.desc: "Delegasi yang kami kirimkan ke [From.GetNameDef] telah melaporkan keberhasilan yang baik dalam penggalangan donasi mereka. Kontribusi besar dilaporkan dibuat oleh [From.GetLeader] sendiri."
 mtg_usa_foreign_support.2.a: "Ini akan berguna di masa depan."
 mtg_usa_foreign_support.3.t: "[From.GetNameDefCap] menolak mengizinkan sumbangan"
 mtg_usa_foreign_support.3.desc: "Delegasi kami di [From.GetNameDef] kurang berhasil, berbicara di depan ruangan kosong dan bahkan tidak mungkin bertemu dengan para pemimpin politik. Mereka kembali dengan tangan kosong."
 mtg_usa_foreign_support.3.a: "Itu terlalu buruk."
 mtg_usa_foreign_support.4.t: "Senjata untuk [USA.GetNameDef]"
 mtg_usa_foreign_support.4.desc: "Dengan menggunakan jalur belakang, sejumlah anggota Silver Legion telah mendekati kami untuk menegosiasikan pembelian senjata. Mereka sangat yakin bahwa negara mereka sedang menuju perang saudara melawan elemen komunis yang memutarbalikkan cara hidup Amerika, mungkin dengan dukungan dari luar.\n\nMereka hanya ingin menyamakan kedudukan sedikit dan bertanya apakah kami dapat menyisihkan peralatan apa pun."
 mtg_usa_foreign_support.4.a: "Kirim beberapa Senapan"
 mtg_usa_foreign_support.4.b: "Kirim beberapa senjata lapangan"
 mtg_usa_foreign_support.4.c: "Kirim beberapa tank tua"
 mtg_usa_foreign_support.4.d: "Mereka harus mengurus diri mereka sendiri."
 mtg_usa_foreign_support.5.t: "[From.GetNameDefCap] mengirimkan Senapan"
 mtg_usa_foreign_support.5.desc: "Koneksi kami ke [From.GetNameDef] telah membuahkan hasil. Dengan persetujuan eksplisit dari [From.GetLeader], perusahaan [From.GetAdjective] telah mulai menjual senapan kepada kami secara kredit. Senjata-senjata tersebut akan disimpan di negara-negara netral sampai perang tiba."
 mtg_usa_foreign_support.5.a: "Mereka akan berguna."
 mtg_usa_foreign_support.6.t: "[From.GetLeader] menolak dukungan"
 mtg_usa_foreign_support.6.desc: "Upaya kami untuk mendapatkan senjata baru dari [From.GetNameDef] telah ditolak dengan kasar. [From.GetLeader] menyatakan bahwa pemerintahnya tidak akan pernah membiarkan sumber daya masyarakat [From.GetAdjective] disia-siakan dalam upaya bodoh seperti itu."
 mtg_usa_foreign_support.6.a: "Kasar sekali."
 mtg_usa_foreign_support.7.t: "[From.GetNameDefCap] mengirimkan senjata lapangan"
 mtg_usa_foreign_support.7.desc: "Delegasi kami di [From.GetNameDef] melaporkan terobosan signifikan dalam upaya mereka untuk mendapatkan lebih banyak dukungan untuk tujuan kami. Militer [From.GetAdjective] telah setuju untuk menyerahkan sejumlah senjata lapangan lama dan menyediakannya untuk kami. Untuk menghindari peringatan musuh, mereka akan disimpan di lokasi rahasia sampai waktunya tiba."
 mtg_usa_foreign_support.7.a: "Luar biasa!"
 mtg_usa_foreign_support.8.t: "[From.GetNameDefCap] mengirimkan tank"
 mtg_usa_foreign_support.8.desc: "Agen kami di [From.GetNameDef] melaporkan kesuksesan yang menakjubkan. Saat makan malam pribadi, [From.GetLeader] setuju untuk menjual sejumlah kendaraan lapis baja kepada kami secara kredit. [From.GetNameDefCap] mengamati perkembangan di [USA.GetNameDef] dengan penuh minat, dan dengan senang hati akan membantu kami semampu mereka.\n\nNamun, pemerintah [From.GetAdjective] tidak boleh terlihat terang-terangan mendukung partai yang belum berkuasa, jadi tank-tank tersebut akan dikirimkan saat perang pecah."
 mtg_usa_foreign_support.8.a: "Biarkan musuh kita waspada!"
 mtg_usa_foreign_support.9.t: "Silver Legion ingin membangun kamp pelatihan"
 mtg_usa_foreign_support.9.desc: "Silver Legion of America telah menghubungi kami dengan permintaan untuk membangun sejumlah kamp pelatihan untuk melatih sukarelawan. Dengan situasi politik di negara asal mereka yang memburuk dengan cepat, mereka ingin memastikan bahwa mereka siap menghadapi perang yang mereka yakini akan terjadi."
 mtg_usa_foreign_support.9.a: "Kami akan menjadikan mereka laki-laki!"
 mtg_usa_foreign_support.9.b: "Mereka bisa berperan sebagai tentara di tempat lain."
 mtg_usa_foreign_support.10.t: "[From.GetNameDefCap] menyetujui Kamp Pelatihan"
 mtg_usa_foreign_support.10.desc: "Sebuah pesan telah tiba dari delegasi kami di [From.GetNameDef]. Pemerintah [From.GetAdjective] telah menyetujui pembangunan beberapa kamp pelatihan untuk melatih anggota Legiun Perak dalam taktik infanteri. Mereka akan mengasah keterampilannya hingga perang pecah."
 mtg_usa_foreign_support.10.a: "Pahlawan [USA.GetAdjective] Sejati"
 mtg_usa_foreign_support.11.t: "[From.GetNameDefCap] menolak membantu"
 mtg_usa_foreign_support.11.desc: "Sebuah pesan telah tiba dari delegasi kami di [From.GetNameDef]. Mereka tidak bisa mendapatkan izin untuk kamp pelatihan yang kami usulkan dari [From.GetLeader], dan meminta instruksi lebih lanjut."
 mtg_usa_foreign_support.11.a: "Kami akan mengingat ini."
 mtg_usa_foreign_support.12.t: "Silver Legion ingin melatih pilot"
 mtg_usa_foreign_support.12.desc: "Fasis Amerika dari Silver Legion telah bertemu dengan [This.GetLeader] untuk diizinkan mengirim sejumlah sukarelawan untuk pelatihan pilot. Para kandidat akan dipilih dengan cermat berdasarkan keterampilan dan landasan ideologis yang benar sebelum disetujui oleh kami. Tampaknya legiun tersebut percaya bahwa banyak pilot profesional di angkatan bersenjata saat ini tidak akan menerima pemerintahan fasis di AS dan mendukung pemberontakan."
 mtg_usa_foreign_support.12.a: "Mereka akan mendapatkan sayapnya."
 mtg_usa_foreign_support.12.b: "Kita tidak punya waktu untuk omong kosong ini."
 mtg_usa_foreign_support.13.t: "[From.GetNameDefCap] menyetujui pelatihan pilot"
 mtg_usa_foreign_support.13.desc: "Pemerintah [From.GetAdjective] telah menyetujui sejumlah kecil Legiun Perak untuk pelatihan pilot. Negosiasi lebih lanjut telah mengamankan penjualan sejumlah kecil pesawat tempur secara kredit, yang akan dikirimkan ketika perang pecah."
 mtg_usa_foreign_support.13.a: "Mereka akan sangat dinantikan."
 mtg_usa_foreign_support.14.t: "[From.GetNameDefCap] Menolak Melatih Pilot"
 mtg_usa_foreign_support.14.desc: "Dengan alasan kekhawatiran besar atas kesesuaian kandidat, pemerintah [From.GetAdjective] telah menolak izin untuk program pelatihan percontohan yang kami usulkan."
 mtg_usa_foreign_support.14.a: "Menerbangkan pesawat tidaklah sulit bukan?"
 us_pilot_training_tt: "Satu skuadron kecil yang terdiri dari 25 pejuang akan dipindahkan ketika perang pecah."
 mtg_usa_foreign_support.15.t: "Silver Legion berupaya memperoleh kapal"
 mtg_usa_foreign_support.15.desc: "Perwakilan dari Silver Legion telah datang untuk meminta bantuan dalam mendapatkan pendanaan untuk sejumlah proyek pembangunan kapal di [USA.GetNameDef]. Legiun Perak - dengan dukungan dari orang-orang di pemerintahan [USA.GetAdjective] - ingin agar kapal-kapal ini tidak terdaftar dan harus mencari sumber pendanaan alternatif."
 mtg_usa_foreign_support.15.a: "Sebuah investasi yang berharga"
 mtg_usa_foreign_support.15.b: "Itu akan membuang-buang uang"
 mtg_usa_foreign_support.16.t: "[From.GetNameDefCap] menyetujui Pendanaan"
 mtg_usa_foreign_support.16.desc: "Pemerintah [From.GetAdjective] telah menyetujui dana yang diperlukan untuk pembelian kapal. Rencana saat ini adalah membeli kapal dan persenjataan secara terpisah dan menggabungkannya ketika perang dimulai. Proses itu pasti akan memakan waktu."
 mtg_usa_foreign_support.16.a: "Anda tidak dapat membangun kapal dalam sehari."
 mtg_usa_foreign_support.17.t: "[From.GetNameDefCap] menolak Pendanaan"
 mtg_usa_foreign_support.17.desc: "Meskipun mengadakan pertemuan pribadi dengan [From.GetLeader], agen kami di [From.GetNameDef] telah diberitahu bahwa pemerintah [From.GetAdjective] tidak dapat menyisihkan uang untuk membantu kami membeli kapal."
 mtg_usa_foreign_support.17.a: "Sayangnya."
 mtg_usa_diplomatic_protest.1.t: "[USA.GetNameDefCap] mengirimkan nota protes"
 mtg_usa_diplomatic_protest.1.desc: "Surat pribadi dari [USA.GetAdjective] Presiden [USA.GetLeader] telah tiba. Dengan kata-kata yang keras, Presiden mengecam \"tindakan tidak dapat ditoleransi baru-baru ini\" yang menyebabkan ketidakstabilan di kawasan. [From.GetNameDefCap] tetap berkomitmen terhadap perdamaian dan stabilitas di wilayah tersebut, demikian isi surat tersebut, dan akan dipaksa untuk mempertimbangkan tindakan lebih lanjut, termasuk tindakan militer, jika kita tetap pada jalur yang kita pilih saat ini."
 mtg_usa_diplomatic_protest.1.a: "Mereka menggertak. Mungkin."
 mtg_usa_diplomatic_protest.2.t: "[USA.GetNameDefCap] menuntut pengalihan kepemilikan Amerika"
 mtg_usa_diplomatic_protest.2.desc: "Dalam pidatonya di depan kedua majelis Kongres, Presiden [USA.GetLeader] telah mengumumkan bahwa pemerintahannya tetap berkomitmen pada Doktrin Monroe, yang menyatakan bahwa tidak ada kekuatan luar yang boleh menguasai wilayah di Amerika. Meskipun, dalam praktiknya, pemerintah [USA.GetAdjective] telah menoleransi negara [USA.GetRulingIdeology] lain yang menguasai wilayah kecil, pemerintah tidak dapat menerima apa yang disebutnya sebagai \"pendudukan ilegal dan ancaman langsung terhadap keamanan [USA.GetNameDef]\".\n\nTak lama kemudian, duta besar [USA.GetAdjective] menyerahkan catatan yang berisi ultimatum dari Presiden untuk menyerahkan kendali atas kepemilikan kita di Amerika kepada [USA.GetNameDef]."
 mtg_usa_diplomatic_protest.2.a: "Wilayah-wilayah ini tidak sebanding dengan perang."
 mtg_usa_diplomatic_protest.2.b: "Beritahu Presiden untuk mengurus urusannya sendiri."
 mtg_usa_diplomatic_protest.3.t: "[From.GetNameDefCap] mengembalikan Wilayah"
 mtg_usa_diplomatic_protest.3.desc: "Mengutip keinginan untuk menghindari pertumpahan darah, pemerintah [From.GetLeader] telah setuju untuk menyerahkan kendali kepemilikan mereka di Amerika kepada kami. Apakah kita harus segera memberikan kedaulatan penuh kepada wilayah-wilayah tersebut atau mempertahankannya di bawah pemerintahan langsung kita, masih menjadi perdebatan di Departemen Luar Negeri."
 mtg_usa_diplomatic_protest.3.a: "Kami akan mempertimbangkan pilihan kami."
 mtg_usa_diplomatic_protest.4.t: "[From.GetNameDefCap] Menolak Ultimatum"
 mtg_usa_diplomatic_protest.4.desc: "Menyebut catatan kami sebagai \"intrusi yang tidak dapat diterima terhadap urusan internal [From.GetNameDef]\", pemerintah [From.GetAdjective] dengan tegas menolak untuk membahas kedaulatan mereka atas wilayah Amerika mereka."
 mtg_usa_diplomatic_protest.4.a: "Mereka diperingatkan. Mereka memutuskan untuk tidak mengindahkan peringatan itu."
 mtg_usa_diplomatic_protest.4.b: "Hal ini tidak akan diselesaikan dengan kekerasan."
 mtg_exile_leader_added.1.t: "[exile_nation.GetAdjective] Pemimpin Pengasingan Menawarkan Layanan"
 mtg_exile_leader_added.1.desc: "Setelah perjalanan panjang dan berbahaya melalui wilayah yang dikuasai musuh dan beberapa negara netral, [From.GetName] akhirnya tiba di ibu kota. Setelah masa pemulihan yang singkat, [From.GetSheHe] telah menawarkan layanan [From.GetHerHis] dalam perjuangan kita bersama.\n\nDilaporkan, [From.GetSheHe] cukup bersemangat untuk \"kembali ke bisnis membunuh orang dan menghancurkan barang-barang\"."
 mtg_exile_leader_added.1.a: "Perjuanganmu belum berakhir."
 mtg_news.1.t: "Perang Saudara Amerika Kedua"
 mtg_news.1.desc: "Ketegangan di Amerika Serikat sudah mencapai titik didih. Tidak senang dengan kebijakan Presiden [USA.GetLeader], badan legislatif di beberapa negara bagian AS telah memilih untuk memisahkan diri dari Persatuan.\n\nHarapan untuk penyelesaian konflik secara damai telah pupus, dan permusuhan telah terjadi di mana-mana. Tampaknya sebagian besar anggota pemerintah telah memutuskan untuk tetap berada di pemerintahan yang sah, namun laporan menunjukkan lonjakan sukarelawan di seluruh negara bagian yang memisahkan diri.\n\nDengan tidak adanya pihak yang mau mundur, para pengamat memperkirakan perjuangan yang panjang dan pahit akan terjadi."
 mtg_news.1.a: "Sejarah terulang kembali."
 mtg_news.1.b: "Eksperimen Amerika gagal di depan mata kita."
 mtg_news.1.c: "Setiap langkah kemajuan harus dibeli dengan darah."
 mtg_news.1.d: "Keseimbangan kekuasaan bergeser ke arah ekstremis."
 mtg_news.2.desc: "Setelah berbulan-bulan protes dan meningkatnya ketegangan antara pendukung Presiden [USA.GetLeader] dan lawan-lawannya di kubu yang disebut \"Konstitusionalis\", politisi Konstitusionalis telah mendeklarasikan pemerintahan baru yang berbasis di Boston, rumah bagi revolusi Amerika pertama. Perpecahan dalam masyarakat terjadi langsung melalui keluarga dan institusi. Tampaknya mayoritas militer telah memutuskan untuk memihak kaum Konstitusionalis, karena pemerintah negara bagian di seluruh benua Amerika menyatakan kesetiaan mereka pada satu pihak atau pihak lainnya."
 mtg_news.2.a: "Musuh domestik tetaplah musuh."
 mtg_news.2.b: "Perjuangan untuk jiwa Amerika telah terjadi secara terbuka."
 mtg_news.2.c: "Itulah yang terjadi jika Anda terlalu lama mengabaikan fasis."
 mtg_news.2.d: "Republik Amerika sedang berjuang untuk hidupnya!"
 mtg_news.3.t: "Kongres AS mengesahkan Undang-Undang Netralitas"
 mtg_news.3.desc: "Dengan meningkatnya ketegangan di seluruh dunia, Kongres AS telah menjadi tempat diskusi yang intens mengenai peran yang harus dimainkan oleh [USA.GetNameDef] di panggung dunia. Banyak anggota khawatir bahwa Presiden [USA.GetLeader] mungkin diam-diam berencana melakukan intervensi dalam perang Eropa atau Asia. Beberapa orang masih ingat peran yang dimainkan negara ini dalam Perang Besar dan sangat ingin menjaga [USA.GetNameDef] dari keterlibatan asing.\n\nIngin menggalang dukungan bagi usulan program reformasi ekonominya, Presiden [USA.GetLeader] telah menandatangani Undang-Undang Netralitas menjadi undang-undang, yang membatasi perdagangan dengan negara-negara yang sedang berperang dan secara khusus melarang Presiden untuk memberikan dukungan apa pun kepada negara lain."
 mtg_news.3.a: "Anak-anak kita tidak akan dikirim ke perang asing."
 mtg_news.3.b: "Biarkan raksasa itu tidur."
 mtg_news.3.c: "Kalau begitu, mereka mendukung fasis dengan tidak bertindak."
 mtg_news.3.d: "Tanyakan kepada orang-orang Belgia seberapa baik Netralitas membela mereka pada tahun 1914."
 mtg_news.3.e: "Mereka tahu pentingnya tetap netral."
 mtg_news.3.f: "Netralitas harus didukung dengan kekerasan."
 mtg_news.3.g: "Namun dukungan mereka terhadap kami tidak tergoyahkan!"
 mtg_news.3.g_tt: "Jaminan mereka terhadap kami adalah §Rtidak§! terpengaruh oleh ini!"
 mtg_news.4.t: "[USA.GetNameDefCap] menjalankan kebijakan intervensionis"
 mtg_news.4.desc: "Gerakan perdamaian di [USA.GetNameDef] telah mengalami kemunduran yang parah ketika Kongres mengeluarkan resolusi bersama yang mendorong Presiden [USA.GetLeader] untuk menggunakan kekuatan militer, jika perlu, untuk melindungi kepentingan [USA.GetAdjective] di seluruh dunia.\n\nTampaknya banyak orang di Kongres telah memutuskan bahwa [USA.GetAdjective] keragu-raguanlah yang membuat Perang Besar berlarut-larut begitu lama dan memakan banyak korban hidup. Mereka menunjukkan bahwa dalam beberapa bulan setelah pasukan AS memasuki Eropa, Perang Besar telah berakhir. Intervensi lebih awal, menurut mereka, bisa menyelamatkan ratusan ribu nyawa."
 mtg_news.4.a: "Kami akan melawan mereka di sana jadi kami tidak perlu melawan mereka di sini."
 mtg_news.4.b: "Mereka harus menjauhi urusan orang lain."
 mtg_news.4.c: "Tidak diragukan lagi, hal ini didorong oleh Kompleks Industri-Militer."
 mtg_news.4.d: "Raksasa itu tidak akan tidur kali ini."
 mtg_news.5.t: "[USA.GetNameDefCap] mengesahkan Undang-Undang Kekuatan Perang"
 mtg_news.5.desc: "Setelah pemungutan suara dengan berdiri proklamasi di ruang Senat, Presiden [USA.GetLeader] segera menandatangani Undang-Undang Kekuatan Perang menjadi undang-undang. Undang-undang ini memberikan keleluasaan yang jauh lebih besar kepada jabatan Presiden dalam penggunaan militer dibandingkan sebelumnya. Presiden sekarang dapat mengerahkan pasukan untuk membela kepentingan [USA.GetAdjective] kapanpun dan dimanapun ia anggap perlu, untuk jangka waktu yang tidak terbatas.\n\nMeskipun Presiden [USA.GetLeader] menyatakan bahwa kekuatan baru ini hanya akan digunakan dalam keadaan yang paling mengerikan, sumber di dalam Departemen Luar Negeri menyatakan bahwa ini hanyalah langkah pertama dalam program skala besar untuk membentuk kembali keseimbangan kekuatan global."
 mtg_news.5.a: "Kata-kata kita akan lebih berbobot sekarang."
 mtg_news.5.b: "Selama mereka tetap berada dalam lingkup pengaruhnya."
 mtg_news.5.c: "Akhirnya kaum fasis menunjukkan wajah aslinya."
 mtg_news.5.d: "Kita berdiri di awal zaman baru."
 mtg_news.6.t: "Kaum Buruh Menang dalam Perang Saudara Amerika Kedua!"
 mtg_news.6.desc: "Setelah berbulan-bulan pertumpahan darah dan ribuan korban jiwa, Perang Saudara Amerika Kedua telah berakhir. Upaya negara-negara selatan untuk memisahkan diri telah gagal. Banyak pengamat menunjukkan kesamaannya dengan Perang Saudara Amerika yang pertama. Sekali lagi, kekuatan industri di negara-negara bagian utara terbukti lebih unggul dibandingkan negara-negara bagian selatan.\n\nPemerintah [USA.GetLeader] kini menghadapi tugas sulit untuk mengintegrasikan kembali negara-negara yang memisahkan diri ke [USA.GetNameDef]. Dengan dua pemberontakan yang hanya berjarak sekitar 80 tahun, banyak pihak di pemerintahan yang mendorong hukuman yang lebih berat terhadap para pemberontak dibandingkan setelah perang pertama."
 mtg_news.6.a: "Akhirnya semuanya berakhir."
 mtg_news.6.b: "Tempat lain yang harus dibebaskan dari kuk Bolshevisme."
 mtg_news.6.c: "Revolusi bergerak menuju kemenangan yang tak terelakkan!"
 mtg_news.6.d: "Kami hanya bisa berharap pihak kanan menang."
 mtg_news.7.t: "[USA.GetNameDefCap] Pemerintahan Tertinggi!"
 mtg_news.7.desc: "Setelah berbulan-bulan pertumpahan darah dan ribuan korban jiwa, Perang Saudara Amerika Kedua telah berakhir. Presiden [USA.GetLeader] telah menyatakan operasi tempur besar telah berakhir. Meskipun beberapa sisa pemerintahan pemberontak masih melakukan kampanye perlawanan yang tidak efektif, sebagian besar telah ditangkap oleh pemerintah atau dilebur kembali menjadi penduduk sipil.\n\nMenurut Presiden [USA.GetLeader], perang tersebut jelas merupakan ulah pengaruh asing yang berupaya menggoyahkan dan memecah belah negara. Pada waktunya, ia berjanji, mereka yang bertanggung jawab akan membayar kembali utang mereka kepada negara Amerika yang sedang memulihkan diri dengan penuh darah."
 mtg_news.7.b: "Keadilan telah menang!"
 mtg_news.7.c: "Para pekerja Amerika, pada waktunya, akan bernapas lega kembali."
 mtg_news.7.d: "Masa depan demokrasi semakin tidak menentu."
 mtg_news.8.t: "Bangkitnya [Root.GetNameDef]"
 mtg_news.8.desc: "Dalam menghadapi ancaman global, pemerintah Inggris telah membuat pernyataan bersama dengan pemerintah [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef], dan [NZL.GetNameDef] bahwa Bangsa-Bangsa Persemakmuran Inggris akan diresmikan dengan struktur pemerintahan federal yang baru.\n\nDengan penolakan pemerintah [RAJ.GetAdjective] sebelumnya terhadap proposal ini, dan dengan penerapan struktur federal untuk negara-negara tersebut saat ini Persemakmuran, [RAJ.GetNameDef] telah memilih untuk tidak tetap berafiliasi dengan Superstate baru.\n\nMeskipun demikian, langkah ini pasti akan menimbulkan konsekuensi yang belum pernah terjadi sebelumnya di kancah global."
 mtg_news.8.a: "Sebuah langkah maju yang besar bagi masyarakat kita."
 mtg_news.8.b: "Negara adikuasa baru muncul..."
 mtg_news.9.desc: "Dalam menghadapi ancaman global, pemerintah Inggris telah membuat pernyataan bersama dengan pemerintah [CAN.GetNameDef], [SAF.GetNameDef], [RAJ.GetNameDef], [AST.GetNameDef], dan [NZL.GetNameDef] bahwa Bangsa-Bangsa Persemakmuran Inggris akan diresmikan dengan struktur pemerintahan federal yang baru.\n\nJelas bahwa penyatuan Kerajaan Inggris dalam skala ini tidak diragukan lagi akan menimbulkan konsekuensi yang belum pernah terjadi sebelumnya bagi dunia. kancah global."
 mtg_news.10.t: "[HOL.GetName] Gua ke Jerman"
 mtg_news.10.desc: "Upaya [HOL.GetAdjective] untuk mempertahankan netralitas perdagangan telah gagal, dan langkah-langkah baru-baru ini yang diterapkan oleh pemerintah [HOL.GetAdjective] memperjelas bahwa mereka akan memulai kebijakan perdagangan yang mendukung [GER.GetName]. Kemungkinan besar hal ini akan mengakibatkan peningkatan pengaruh [GER.GetAdjective] terhadap [HOL.GetNameDef]."
 mtg_news.10.a: "Lalu kita harus memblokade mereka juga."
 mtg_news.10.b: "Mereka ada di lingkungan kita saat ini."
 mtg_news.10.c: "Kami tidak punya pilihan..."
 mtg_news.10.d: "[GER.GetAdjective] pengaruh tumbuh..."
 mtg_news.11.t: "[HOL.GetName] Gua ke Inggris"
 mtg_news.11.desc: "Upaya [HOL.GetAdjective] untuk mempertahankan netralitas perdagangan telah gagal, dan langkah-langkah baru-baru ini yang diterapkan oleh pemerintah [HOL.GetAdjective] memperjelas bahwa mereka akan memulai kebijakan perdagangan yang mendukung [ENG.GetName]. Kemungkinan besar hal ini akan mengakibatkan peningkatan pengaruh [ENG.GetAdjective] terhadap [HOL.GetNameDef]."
 mtg_news.11.a: "Mereka bergabung dengan blokade..."
 mtg_news.11.d: "Jerman semakin terisolasi..."
 mtg_news.12.t: "[HOL.GetName] Menjaga Netralitas Perdagangan"
 mtg_news.12.desc: "Upaya\n[HOL.GetAdjective] untuk mempertahankan netralitas perdagangan telah berhasil, dan, yang membuat kecewa pihak Inggris dan Jerman, Belanda tampaknya semakin memperkuat tekad mereka dalam menghadapi tekanan [ENG.GetAdjective] dan [GER.GetAdjective]."
 mtg_news.12.a: "Orang-orang yang memiliki keinginan yang melekat pada keuntungan pribadi layak untuk dikalahkan dan diperbudak!"
 mtg_news.12.b: "Sebuah keputusan yang sangat tidak bijaksana."
 mtg_news.12.c: "Kita adalah tuan atas nasib kita sendiri."
 mtg_news.12.d: "Mereka bermain api..."
 mtg_britain.1.t: "Krisis Pengunduran Diri Edward VIII"
 mtg_britain.1.d: "Untuk beberapa waktu Raja Edward VIII memiliki harapan untuk menikah dengan Wallis Simpson dari Amerika. Krisis konstitusional kini muncul karena Ny. Simpson tidak hanya bercerai dari suami sebelumnya, namun pada kenyataannya masih menikah dengan suaminya saat ini, dan saat ini sedang mengupayakan perceraian kedua. Kemarahan umum terjadi dengan alasan bahwa, sebagai Raja, dan sebagai kepala Gereja Inggris, Edward tidak dapat menikahi seorang janda.\n\nRaja, bagaimanapun, telah memperjelas bahwa dia sangat mencintai Nyonya Simpson, dan bermaksud untuk menikahinya terlepas dari pendapat pemerintah atau rakyatnya. Oleh karena itu, hanya ada tiga pilihan yang terbuka baginya.\n\nPemerintah Inggris dan pemerintahan Dominion telah menyatakan bahwa alternatif apa pun selain turun tahta tidak dapat diterima, dan dampak dari upaya memaksakan pernikahan, bahkan upaya kompromi, kemungkinan besar akan sangat buruk, tidak hanya bagi Inggris sendiri, tetapi juga bagi hubungannya dengan Persemakmuran. Ketika para penasihat terdekat Raja melanjutkan upaya mereka untuk meyakinkannya, masyarakat menunggu dengan napas tertahan penyelesaian konflik antara Raja dan kabinetnya."
 mtg_britain.1.a: "Bersikeras pernikahan kerajaan."
 mtg_britain.1_tt: "Mulailah persiapan pernikahan."
 mtg_britain.1.b: "Kompromi pada pernikahan morganatik."
 mtg_britain.1.c: "Jika dia tidak berubah pikiran, Raja harus turun tahta."
 edward_viii_refused_to_abdicate_flag: "Edward VIII Menolak Turun tahta"
 mtg_britain.2.t: "Formulir Dukungan untuk Edward VIII"
 mtg_britain.2.d: "Di tengah kemarahan luar biasa akibat keputusan Raja, ada beberapa suara yang muncul untuk mendukung Raja Edward. Meskipun terisolasi dari partai-partai politik utama, nama-nama mereka tetap mempunyai pengaruh besar: Winston Churchill, Oswald Mosley, dan David Lloyd George.\n\nMeskipun pada awalnya masih ragu-ragu, kelompok sekutu politik yang tidak terduga ini mulai mendapatkan daya tarik di kalangan masyarakat, dan mengikuti jejak mereka semakin berani untuk secara terbuka mendukung keputusan Edward.\n\nDengan semakin kuatnya tekadnya, Raja telah menegaskan bahwa dia tidak mempunyai niat untuk berubah pikirannya dalam hal ini. Pernikahan akan berjalan sesuai rencana."
 mtg_britain.2.a: "Bagus. Kami akan menetapkan tanggalnya."
 mtg_britain.2_tt: "Lanjutkan persiapan pernikahan."
 mtg_britain.2.b: "Mungkin rakyatnya benar - Raja harus turun tahta."
 mtg_britain.3.t: "Kabinet Mengundurkan Diri"
 mtg_britain.3.d: "Karena Raja tidak menunjukkan niat untuk mendengarkan pemerintahannya, [Root.GetLeader] tidak melihat solusi lain selain membubarkannya. Dalam sebuah pernyataan, ia mengatakan \"terbukti bahwa kabinet tidak dapat berfungsi tanpa kepercayaan dari rajanya. Dengan berulang kali menolak saran bulat dari para menterinya, sudah jelas bahwa saran ini tidak diinginkan atau dipatuhi, dan karena itu nanti malam saya akan bertemu dengan Yang Mulia untuk menawarkan pengunduran diri kabinet.\""
 mtg_britain.3.a: "Selamat jalan. Mereka tidak akan menghentikan Raja."
 mtg_britain.4.t: "Dominasi Putus dengan Mahkota"
 mtg_britain.4.d: "Perwakilan dari pemerintahan Dominion telah memberi tahu kita bahwa mereka akan secara sepihak memutuskan hubungan dengan Kerajaan. Mereka mengutip sikap Raja yang secara terang-terangan mengabaikan pendapat dan keinginan pemerintah Dominion dan rakyatnya sebagai alasan utama mengapa hubungan Inggris-Persemakmuran tidak dapat dilanjutkan lagi.\n\nSeperti yang dinyatakan oleh salah satu pejabat Persemakmuran dalam sebuah wawancara yang memanas: \"Seorang Raja yang tidak mampu mendahulukan Kewajiban di atas perasaan pribadinya tidak dapat dipercaya untuk bertindak demi kepentingan terbaik rakyatnya. Berdasarkan peristiwa baru-baru ini, kita dapat menyimpulkan bahwa Raja tidak peduli sama sekali terhadap opini publik dalam negeri, dan jika ini adalah sifat hubungannya dengan rakyat Inggris, maka situasinya hanya akan menjadi lebih buruk bagi rakyatnya di Persemakmuran. Oleh karena itu, untuk melindungi kepentingan rakyat kita, kita tidak melihat alternatif selain menyingkirkan Raja sebagai kepala negara kita.\""
 mtg_britain.4.a: "Kami tidak berdaya untuk menghentikan mereka – untuk saat ini."
 mtg_britain.5.t: "Pernikahan Kerajaan Edward VIII"
 mtg_britain.5.d: "Akhirnya tanggal yang menggembirakan bagi Pernikahan Kerajaan telah tiba. Ribuan orang berkumpul di sepanjang rute yang dilalui pasangan tersebut dari Istana Buckingham ke Westminster Abbey.\n\nPerlawanan dalam negeri terhadap pernikahan tersebut semakin menunjukkan impotensi, melalui pengunduran diri secara simbolis dan protes sia-sia lainnya, dan kini tampaknya tidak lagi terdengar. Tindakan yang terakhir adalah pensiunnya Uskup Agung Canterbury, Cosmo Lang, dan penggantian berikutnya dengan seseorang yang lebih... menyetujui keinginan Raja.\n\nDalam menghadapi kekacauan politik yang disebabkan oleh krisis ini, perayaan yang sedang berlangsung saat ini sangat diperlukan untuk mengembalikan keadaan ke keadaan normal dalam urusan publik, dan sebagai titik awal untuk menyelesaikan masalah politik saat ini."
 mtg_britain.5.a: "Namun apakah hal ini akan memperbaiki perpecahan di negara kita?"
 mtg_britain.7.t: "Surat Kabar Mendukung Pernikahan"
 eng_newspaper_daily_express: "Ekspres Harian"
 eng_newspaper_daily_mail: "Surat Harian"
 eng_newspaper_the_times: "Waktu"
 eng_newspaper_the_morning_post: "Pos Pagi"
 eng_newspaper_daily_herald: "Harian Herald"
 eng_newspaper_the_daily_telegraph: "Telegraf Harian"
 mtg_britain.7.d: "Sebuah artikel baru-baru ini di [GETUKPROKINGNEWSPAPER] telah menekankan hak kebahagiaan Raja, dan berpendapat bahwa jika peraturan tidak mengizinkan dia menikahi seorang janda, maka mungkin sudah saatnya peraturan tersebut dimodernisasi."
 mtg_britain.7.a: "Hal ini merupakan bentuk dukungan terhadap Raja."
 mtg_britain.8.t: "Surat Kabar Menentang Pernikahan"
 mtg_britain.8.d: "Sebuah artikel baru-baru ini di [GETUKANTIKINGNEWSPAPER] mengutip tanggung jawab Raja terhadap negara dan rakyatnya, menyatakan bahwa status dan hak istimewanya disertai dengan beban tugas, sehingga ia harus mengorbankan pernikahannya, atau mahkotanya."
 mtg_britain.8.a: "Sebuah pukulan yang disayangkan terhadap Raja."
 mtg_britain.9.t: "Perdana Menteri Membatasi Raja"
 mtg_britain.9.d: "Karena takut bahwa Raja yang membuat pernyataan di radio publik akan memberinya terlalu banyak dukungan di kalangan rakyat, Perdana Menteri [Root.GetLeader] kini menolak untuk mengizinkan hal ini. Karena tidak mampu melawan Perdana Menterinya dalam hal ini, Raja tidak punya pilihan selain menyimpan 'ceritanya' untuk dirinya sendiri, untuk saat ini."
 mtg_britain.9.a: "Krisis ini telah menyebar ke eselon tertinggi pemerintahan."
 mtg_britain.10.t: "Parlemen Menentang Pernikahan"
 mtg_britain.10.d: "Berbagai anggota parlemen hari ini dengan tegas menentang rencana Raja untuk menikahi Ny. Simpson, sehingga membangkitkan semangat sejumlah rekan mereka untuk mendukung perjuangan mereka. Penentangan politik terhadap pernikahan Raja semakin meningkat."
 mtg_britain.10.a: "Apa yang diketahui politisi tentang cinta?"
 mtg_britain.11.t: "Kelas Atas Menentang Pernikahan"
 mtg_britain.11.d: "Orang-orang terkemuka di kalangan bangsawan, dengan cara yang tidak terlalu lembut, menunjukkan rasa jijik mereka terhadap kemungkinan Raja menikahi seseorang yang mereka anggap sebagai 'pelacur biasa'. Penghinaan yang tampaknya dia berikan terhadap tradisi dan upacara tampaknya telah menyinggung banyak orang paling berkuasa di negara ini."
 mtg_britain.11.a: "Mereka hanya iri dia telah menemukan cinta."
 mtg_britain.12.t: "Kelas Pekerja Mendukung Pernikahan"
 mtg_britain.12.d: "Dukungan terhadap Raja tampaknya tumbuh di kalangan masyarakat kelas bawah. Mereka tidak hanya melihat ada yang salah jika Raja menikahi 'rakyat jelata', tapi mereka bahkan tampak menyukai kisah dongeng tentang 'wanita biasa' yang memenangkan hati Raja dan menikah dengan bangsawan."
 mtg_britain.12.a: "Sebuah formula kemenangan untuk sebuah novel, tentunya."
 mtg_britain.13.t: "Edward VIII Mengadakan Pidato Radio"
 mtg_britain.13.d: "Raja Edward akhirnya berhasil membujuk pemerintah untuk mengizinkannya menyampaikan pidato di radio, yang menggambarkan apa yang ia sebut sebagai 'cerita dari sisinya'. Ia menyatakan harapannya bahwa hal ini akan memungkinkan masyarakat untuk lebih memahami mengapa ia merasa harus bertindak seperti yang ia lakukan."
 mtg_britain.13.a: "Ternyata 'cerita dari sisinya' cukup meyakinkan."
 mtg_britain.15.t: "Krisis Pengunduran Diri Edward VIII"
 mtg_britain.15.d: "Pemerintah Inggris sangat terguncang dengan pengumuman bahwa Raja ingin menikahi seorang janda cerai dari kalangan rendahan, Wallis Simpson. Hal ini mengakibatkan kemarahan baik di kalangan anggota parlemen maupun masyarakat, karena para penentang berpendapat bahwa tugas Raja adalah yang pertama dan terpenting bagi rakyat dan negaranya, dan yang terpenting adalah kebahagiaannya sendiri. Dikatakan bahwa Raja, sebagai pemimpin Gereja Inggris, yang tidak memperbolehkan orang yang bercerai untuk menikah, oleh karena itu tidak dapat menikahi Nyonya Simpson.\n\nPerdebatan kini telah meluas ke Dominion, dan karena Raja tidak memberikan indikasi untuk mendengarkan nasihat kabinetnya, kita harus berasumsi bahwa rencana pernikahan tersebut tidak akan diubah. Jika dia memaksakan kehendaknya, bagaimana tanggapan kita?"
 mtg_britain.15.a: "Tidak ada Raja kita yang boleh menikah dengan rakyat jelata yang telah bercerai."
 mtg_britain.15_tt: "Kita akan merdeka dan meninggalkan Sekutu jika Edward VIII tidak berubah pikiran."
 mtg_britain.15.b: "Dia akan menjadi Raja kita, apa pun yang terjadi."
 mtg_britain.15_tt_2: "Kami akan tetap bersama Inggris meskipun Edward VIII menikahi Wallis Simpson."
 ENG_staying_loyal_tt: "§RKami akan terkunci di cabang loyalis pohon fokus kami!§!"
 mtg_britain.16.t: "Edward VIII Mendorong Pernikahan"
 mtg_britain.16.d: "Seperti yang kami khawatirkan, Raja Edward VIII telah memutuskan untuk melanjutkan pernikahannya dengan Wallis Simpson, yang sekarang dikenal sebagai Wallis, Duchess of Windsor."
 mtg_britain.16.a: "Maka kita harus memutuskan hubungan dengan Mahkota."
 mtg_britain.17.t: "Dipandu oleh Inggris"
 mtg_britain.17.d: "Dalam upaya mempersiapkan kita menuju kemerdekaan, [ENG.GetNameDef] telah memutuskan untuk membimbing kita selama masa transisi. Kami akan dapat mengandalkan dukungan mereka sampai kami dapat berdiri sendiri."
 mtg_britain.17.a: "Mari kita manfaatkan bantuan mereka sebaik-baiknya."
 mtg_britain.18.t: "Menuju Kemerdekaan Dominion"
 mtg_britain.18.d: "Transisi awal telah selesai, dan pemerintah [ENG.GetAdjective] telah memberitahu kita bahwa mereka sekarang memulai persiapan untuk penyerahan kedaulatan penuh."
 mtg_britain.18.a: "Berita paling bagus!"
 mtg_britain.19.t: "Yayasan untuk Negara Bagian India"
 mtg_britain.19.d: "Dalam upaya mempersiapkan kita menuju kemerdekaan, [ENG.GetNameDef] telah memutuskan untuk membimbing kita selama masa transisi. Kita akan dapat mengandalkan dukungan mereka dalam mendewasakan pemerintahan kita serta meningkatkan tingkat industrialisasi di negara ini, hingga kita bisa berdiri sendiri."
 mtg_britain.20.t: "Solusi Tiga Negara"
 mtg_britain.20.d: "Demi kepentingan perdamaian, pemerintah [ENG.GetAdjective] telah memutuskan untuk membagi benua ini berdasarkan perbedaan agama dan budaya. Proposal yang dihasilkan akan mencakup tiga negara bagian yang terpisah; India, Pakistan, dan Bangladesh, dan solusi ini diharapkan dapat mencegah potensi perang saudara yang merusak."
 mtg_britain.20.a: "Kemungkinan besar hal ini tidak akan memuaskan pihak mana pun yang terlibat."
 mtg_britain.21.t: "Menuju Kemerdekaan India"
 mtg_britain.22.t: "Mosi Tidak Percaya Diri"
 mtg_britain.22.d: "Pada mosi tidak percaya hari ini, House of Commons menegaskan bahwa mereka telah kehilangan kepercayaan terhadap pemerintahan saat ini. Setelah mengajukan pengunduran dirinya kepada Raja, [Root.GetLeader] telah mengajukan Winston Churchill sebagai usulan penggantinya.\n\nPerdana Menteri yang baru diharapkan akan menjauh dari kebijakan Peredaan yang kontroversial, bahkan berpotensi menanggapi tantangan lebih lanjut dengan kekuatan militer."
 mtg_britain.22.a: "Hidup Churchill!"
 mtg_britain.23.t: "Isolasi Ancaman Mediterania"
 mtg_britain.23.d: "[From.GetNameDefCap] telah menghubungi kami dengan permintaan agar kami mengisolasi orang Italia secara diplomatis. Jika kami terbuka terhadap hal ini, mereka menunjukkan kesediaan mereka untuk mempertimbangkan kemungkinan aliansi di masa depan dengan kami."
 mtg_britain.23.a: "Ini mempunyai potensi."
 mtg_britain.23.b: "Kita tidak akan diberitahu apa yang harus dilakukan oleh Inggris!"
 mtg_britain.24.t: "[From.GetName] Meninggalkan [ITA.GetName]"
 mtg_britain.24.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka telah memutuskan hubungan diplomatik dengan [ITA.GetNameDef]."
 mtg_britain.24.a: "Ini akan sangat menguntungkan kita."
 mtg_britain.25.t: "Pemulihan Hubungan Jerman-Inggris"
 mtg_britain.25.d: "[From.GetNameDefCap] memberi tahu kami bahwa, atas dorongan [ENG.GetAdjective], mereka telah memutuskan hubungan diplomatik dengan kami."
 mtg_britain.25.a: "Beraninya mereka?!"
 mtg_britain.26.t: "[From.GetName] Mendukung [ITA.GetName]"
 mtg_britain.26.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka telah memutuskan untuk tidak memutuskan hubungan diplomatik dengan [ITA.GetNameDef]."
 mtg_britain.26.a: "Hal ini tentu membuat segalanya menjadi lebih bermasalah..."
 ENG_germany_rejected_isolate_the_italian_threat: "Jerman menolak untuk mengisolasi ancaman Mediterania."
 mtg_britain.27.t: "Aliansi dengan [From.GetName]"
 mtg_britain.27.d: "Seperti yang mereka sebutkan sebelumnya, [From.GetNameDef] kini telah menawarkan untuk bergabung dengan aliansi kami, untuk melanjutkan kerja sama kami dan semakin mengisolasi orang Italia."
 mtg_britain.27.a: "Ide yang sangat bagus!"
 mtg_britain.27.b: "Ini tidak menarik bagi kami."
 mtg_britain.28.t: "[From.GetName] Menerima Aliansi"
 mtg_britain.28.d: "[From.GetNameDefCap] telah menerima tawaran aliansi kami. Mulai saat ini kami akan menguasai Laut dan Darat dengan cara yang sama."
 mtg_britain.29.t: "[From.GetName] Menolak Aliansi"
 mtg_britain.29.d: "[From.GetNameDefCap] telah menolak tawaran aliansi kami. Apa yang mereka rencanakan hanyalah dugaan siapa pun..."
 mtg_britain.30.t: "[From.GetName] Meminta Non-Intervensi"
 mtg_britain.30.d: "[From.GetNameDefCap] mengusulkan perjanjian non-intervensi, yang memungkinkan kita bebas memerintah di benua ini, jika kita menutup mata terhadap keterlibatan Inggris dengan Kerajaan mereka, dan dengan Italia."
 mtg_britain.30.a: "Ini bisa diterima."
 mtg_britain.30.b: "Kami tidak ingin tangan kami terikat seperti ini."
 mtg_britain.31.t: "[From.GetNameDefCap] Menerima Non-Interferensi"
 mtg_britain.31.d: "[From.GetAdjective] pejabat memberi tahu kami bahwa mereka telah menerima proposal perjanjian non-intervensi kami. Mereka akan menutup mata terhadap urusan kita dengan Kekaisaran dan Italia, sementara kita akan membiarkan mereka mengatur urusan mereka di benua ini."
 mtg_britain.32.t: "[From.GetNameDefCap] Menolak Non-Intervensi"
 mtg_britain.32.d: "[From.GetAdjective] pejabat memberi tahu kami bahwa mereka telah menolak usulan perjanjian non-intervensi kami. Jika mereka ingin tetap membuka pilihan, kita harus berhati-hati..."
 mtg_britain.33.t: "Kekerasan Politik Meningkat menjadi Perang Saudara"
 mtg_britain.33.d: "Pawai baru-baru ini menyaksikan kekerasan lebih lanjut antara kelompok Kaus Hitam dan pengunjuk rasa komunis dan sosialis mereka. Namun, kekerasan ini tidak dapat diatasi di sana. Bagaikan sebuah percikan api, hal ini telah memicu situasi yang semakin tegang yang terjadi di negara kita beberapa bulan terakhir ini.\n\nDi seluruh negeri, milisi mulai bentrok, merebut kendali atas kota-kota besar dan kecil serta wilayah lokalnya, memaksa militer untuk membuat pilihan untuk setia. Meskipun Dominion dan angkatan laut masih sepenuhnya mendukung apa yang mereka sebut pemerintahan demokratis yang 'sah', situasi di angkatan darat masih kurang jelas, dan banyak unit telah bergabung dengan tujuan kami.\n\nSaat garis depan mulai terbentuk, Oswald Mosley telah mengumumkan pembentukan pemerintahan krisis sementara di bawah kepemimpinannya. Ini akan menangani hal-hal penting sampai akhir perang saudara ini."
 mtg_britain.33.a: "Masa depan bangsa kita dipertaruhkan!"
 mtg_britain.34.t: "Akhir Perang Saudara Inggris"
 mtg_britain.34.d: "Daripada melanjutkan perang saudara yang tidak ada harapan dari koloni-koloni, kurangnya dukungan rakyat telah menyebabkan pemerintahan demokratis menerima kemenangan kita dan menuntut perdamaian. Menyusul keputusan ini, Angkatan Laut Kerajaan Inggris sekali lagi menempatkan diri di bawah komando kami.\n\nNamun, Dominion telah memperjelas bahwa mereka tidak berniat mengikuti pemerintahan non-demokratis, dan malah bertujuan untuk terus menjadi negara anggota Persemakmuran yang independen."
 mtg_britain.34.a: "Biarkan pembangunan kembali dimulai."
 mtg_britain.35.t: "Berbaris di Downing Street"
 mtg_britain.35.d: "Pawai kami di Downing Street sukses luar biasa, dan di bawah tekanan langsung dari masyarakat, [Root.GetLeader] tidak punya pilihan selain menyerukan pemilihan segera. Ini merupakan kemenangan nyata bagi kelompok sayap kanan, dan, dengan restu Raja, Oswald Mosley saat ini sedang membentuk kabinetnya. Dalam sebuah pernyataan hari ini, Perdana Menteri baru telah mengumumkan reformasi ekonomi besar-besaran dan pendekatan baru terhadap diplomasi Eropa.\n\nSementara itu, perbedaan pendapat di antara negara-negara Dominion tampaknya berada pada titik tertinggi sepanjang masa, dan seruan untuk kemerdekaan semakin keras. Beberapa bulan ke depan akan menjadi momen yang sangat penting bagi Kekaisaran."
 mtg_britain.35.a: "Di bawah Mosley kita akan mengatasi badai!"
 mtg_britain.36.t: "[From.GetName] Meminta Aliansi"
 mtg_britain.36.d: "[From.GetAdjective] diplomat telah menghubungi kami dengan usulan licik. Mereka mengusulkan pembentukan aliansi yang mungkin menentang pihak-pihak yang menginginkan hegemoni Eropa, dan sebagai imbalannya mereka menawarkan untuk meninggalkan hubungan diplomatik apa pun yang mereka miliki dengan Prancis."
 mtg_britain.36.a: "Ide yang bagus! Kami menerima."
 mtg_britain.36.b: "Kita tidak membutuhkan sekutu yang menusuk dari belakang seperti ini."
 mtg_britain.37.t: "[From.GetName] Menerima Aliansi"
 mtg_britain.37.d: "[From.GetNameDefCap] memberi tahu kami bahwa, karena tertarik dengan tawaran kami, mereka telah memutuskan untuk menerimanya. Kami akan berdiri bersama dengan sekutu ideologis kami dan menghadapi ancaman dunia bersama-sama."
 mtg_britain.38.t: "[From.GetName] Menolak Aliansi"
 mtg_britain.38.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka menganggap tawaran kami sangat pengecut, dan karenanya tanpa ragu menolaknya."
 mtg_britain.39.t: "[From.GetName] Tinggalkan Kami"
 mtg_britain.39.d: "[From.GetNameDefCap] memberi tahu kami bahwa kami tidak lagi relevan dengan kepentingan mereka saat ini, dan mereka telah memutuskan untuk 'mempertimbangkan kembali' ikatan yang kami jalin dalam Perang Besar. Sebaliknya, mereka kini bersekutu dengan Italia."
 mtg_britain.39.a: "Pengkhianatan seperti itu!"
 mtg_britain.40.t: "[From.GetName] Menawarkan Aliansi"
 mtg_britain.40.d: "Pemerintah [From.GetAdjective] telah mendekati kami dengan tawaran mengembalikan Gibraltar kepada kami sebagai imbalan agar kami bergabung dengan aliansi mereka."
 mtg_britain.40.a: "Ini ide yang bagus!"
 mtg_britain.40.b: "Menurut kami tidak."
 mtg_britain.41.t: "[From.GetName] Menerima Aliansi"
 mtg_britain.41.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka telah memutuskan untuk menerima tawaran aliansi kami dengan imbalan Gibraltar."
 mtg_britain.42.t: "[From.GetName] Menolak Aliansi"
 mtg_britain.42.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka telah memutuskan untuk menolak tawaran aliansi kami - kami mungkin mempertahankan Gibraltar."
 mtg_britain.43.t: "Nasib Keluarga Kerajaan"
 mtg_britain.43.d: "Ditahan dalam tahanan rumah tidak resmi di kemegahan Istana Buckingham sejak peralihan kekuasaan, kini tiba saatnya apa yang harus dilakukan Keluarga Kerajaan. Opini publik telah memperjelas bahwa mereka harus pergi, yang tersisa hanyalah memutuskan dengan cara apa, dan apa yang harus dilakukan dengan kekayaan mereka setelah kita menyita kekayaannya..."
 mtg_britain.43.a: "Mengasingkan mereka ke Kanada!"
 mtg_britain.43.b: "Mereka akan diadili dan dihukum."
 mtg_britain.44.t: "Keluarga Kerajaan di Pengasingan"
 mtg_britain.44.d: "Pemerintah [From.GetAdjective] telah menunjukkan 'kelonggaran' mereka terhadap Keluarga Kerajaan dengan mengasingkan mereka. Mereka sekarang telah datang ke pantai kami dan meminta suaka."
 mtg_britain.44.a: "Mereka diterima di sini."
 mtg_britain.45.t: "Hilangkan Kelas Atas"
 mtg_britain.45.d: "Kini setelah kita mendapatkan tempat bagi komunisme di negara kita, kita dapat mulai mempertimbangkan untuk mendistribusikan kembali kekayaan yang dimiliki oleh warga negara kita. Kelas atas harus sendok peraknya... disingkirkan secara paksa."
 mtg_britain.45.a: "Sekarang giliran Rubah Merah."
 mtg_britain.46.t: "[From.GetName] Menuntut Dekolonisasi"
 mtg_britain.46.d: "[From.GetNameDefCap] telah mengeluarkan ultimatum yang menuntut agar kita segera mencontoh mereka dan memberikan kemerdekaan penuh kepada wilayah jajahan kita. Jika tidak, mereka mengatakan mereka bertekad untuk mendukung tuntutan mereka dengan kekuatan militer..."
 mtg_britain.46.a: "Maka kita tidak punya pilihan."
 mtg_britain.46.b: "Biarkan mereka mencoba."
 mtg_britain.47.t: "[From.GetName] Mendekolonisasi"
 mtg_britain.47.d: "[From.GetNameDefCap] telah didekolonisasi, sesuai tuntutan kami."
 mtg_britain.47.a: "Mereka membantu emansipasi pekerja."
 mtg_britain.48.t: "[From.GetName] Menolak Tuntutan"
 mtg_britain.48.d: "[From.GetNameDefCap] menolak tuntutan kami untuk melakukan dekolonisasi."
 mtg_britain.48.a: "Kalau begitu, peranglah."
 mtg_britain.49.t: "Inggris Menyarankan Kerja Sama"
 mtg_britain.49.d: "[From.GetNameDefCap] menyarankan kerjasama dengan menyerang [GER.GetNameDef] dari dua arah. Dengan asumsi mereka mempertahankan kesepakatan mereka dan memulai serangan kedua dengan cepat, ini mungkin merupakan peluang yang sangat baik."
 mtg_britain.49.a: "Ide yang bagus - mari kita lakukan."
 mtg_britain.49.b: "Ini sepertinya bunuh diri. Sebaiknya kita menunggu saja."
 mtg_britain.50.t: "[From.GetName] Menerima Penawaran"
 mtg_britain.50.d: "[From.GetNameDefCap] telah menerima tawaran kami, dan mereka siap menyerang Jerman."
 mtg_britain.50.a: "Kami akan menghancurkan Jerman."
 mtg_britain.51.t: "[From.GetName] Menolak Tawaran"
 mtg_britain.51.d: "[From.GetNameDefCap] telah menolak tawaran kami. Mereka mengatakan mereka tidak mempunyai niat bermusuhan terhadap Jerman."
 mtg_britain.51.a: "Sangat disayangkan."
 mtg_britain.52.t: "[From.GetName] Meminta Aliansi"
 mtg_britain.52.d: "[From.GetNameDefCap] telah menghubungi kami dengan permintaan untuk bergabung dengan Komintern."
 mtg_britain.52.a: "Mereka adalah sesama komunis – mereka berada di pihak kita."
 mtg_britain.52.b: "Komunisme mereka bukanlah jalan Stalin."
 mtg_britain.53.t: "[From.GetName] Permintaan Hibah"
 mtg_britain.53.d: "[From.GetNameDefCap] telah mengizinkan kami menjadi anggota Komintern. Kami sekarang berdiri di sisi mereka untuk membela para pekerja di dunia."
 mtg_britain.54.t: "[From.GetName] Menolak Permintaan"
 mtg_britain.54.d: "[From.GetNameDefCap] telah menolak permintaan kami untuk bergabung dengan Komintern. Kami berdiri sendiri."
 mtg_britain.55.t: "Perang Saudara Komunis"
 mtg_britain.55.d: "Beberapa elemen dalam partai kami telah lama menuduh kami hanya berbasa-basi terhadap cita-cita komunis mengenai kebebasan dan kesetaraan. Unsur-unsur ini kini telah memulai upaya kudeta. Kita berhasil mempertahankan kekuasaan, namun situasi kini meningkat menjadi perang saudara besar-besaran."
 mtg_britain.55.a: "Pengkhianat!"
 mtg_britain.56.t: "Perang Saudara Komunis Berakhir"
 mtg_britain.56.d: "Setelah perang saudara yang melelahkan, kita berhasil mendapatkan kembali kendali atas situasi tersebut. Kita sekarang mungkin mulai membersihkan unsur-unsur pengkhianat di negara kita..."
 mtg_britain.56.a: "Jangan tunjukkan belas kasihan pada mereka."
 mtg_britain.57.t: "Pawai Damai di [ENG_blackshirt_march_state.GetName]"
 mtg_britain.57.d: "Pawai di [ENG_blackshirt_march_state.GetName] sukses luar biasa; protes balasan minimal, dan Kaus Hitam kami berperilaku patut dicontoh. Lonjakan popularitas yang dihasilkan dari hal ini telah memungkinkan kami memperoleh keuntungan politik yang signifikan demi kepentingan gerakan kami."
 mtg_britain.57.a: "Berbaris tanpa henti menuju kemenangan!"
 mtg_britain.58.t: "Maret di [ENG_blackshirt_march_state.GetName]"
 mtg_britain.58.d: "Meskipun ada protes balasan dan bentrokan kecil, demonstrasi di [ENG_blackshirt_march_state.GetName] sukses. Kaum Blackshirts telah menjunjung tinggi kehormatan partai, dan kami terus bergerak maju menuju kemenangan politik total."
 mtg_britain.58.a: "Tidak ada seorang pun yang dapat menghalangi kemajuan."
 mtg_britain.59.t: "Pawai yang penuh kekerasan di [ENG_blackshirt_march_state.GetName]"
 mtg_britain.59.d: "Pawai di [ENG_blackshirt_march_state.GetName] mengakibatkan protes balasan besar-besaran dan perkelahian jalanan yang ekstensif. Meskipun banyak yang terluka dan bahkan ada yang meninggal, Blackshirts kami berhasil bertahan melawan para pemecah masalah sampai polisi turun tangan."
 mtg_britain.59.a: "Apa sajakah pecah telur dalam menghadapi masa depan bangsa?"
 mtg_britain.60.t: "Pidato Mosley menentang [GER.GetName]"
 mtg_britain.60.d: "Menantang tuduhan bahwa dia hanyalah anjing piaraan [GER.GetLeader], Oswald Mosley menyampaikan pidato yang meriah hari ini. Di dalamnya, ia menegaskan keunikan dan individualitas Fasisme Inggris, dan menekankan perbedaan antara kebijakannya dan kebijakan diktator Jerman. Dia melanjutkan dengan menyimpulkan dengan kata-kata yang kuat: \"tidak seorang pun kecuali warga Inggris yang bisa menguasai Inggris!\""
 mtg_britain.60.a: "Penerimaan masyarakat tampaknya cukup baik."
 mtg_britain.61.t: "[From.GetName] Mendukung Loyalis Kekaisaran"
 mtg_britain.61.d: "Telah menjadi perhatian kami bahwa [From.GetNameDef] mendukung Loyalis Kekaisaran di negara kami. Jika tidak dilawan, aktivitas subversif mereka mungkin akan berujung pada perang saudara besar-besaran!"
 mtg_britain.61.a: "Kita harus waspada."
 mtg_britain.62.t: "[From.GetName] Bergerak untuk Mengamankan Dominasi"
 mtg_britain.62.d: "Pemerintahan [From.GetAdjective] yang baru telah mengumumkan niat mereka untuk menghancurkan perbedaan pendapat di antara Dominion mereka dengan kekuatan militer, jika perlu. Meskipun pasukan mereka akan dikerahkan terlalu sedikit untuk melakukan hal ini di seluruh Kekaisaran, mereka jelas berniat untuk mencobanya."
 mtg_britain.62.a: "Mereka mungkin datang untuk kita."
 mtg_britain.63.t: "[From.GetName] Menegakkan Darurat Militer"
 mtg_britain.63.d: "Setelah mengerahkan pasukannya di daratan kami, pemerintah [From.GetAdjective] kini mengumumkan darurat militer, dan menangguhkan pemerintahan untuk sementara waktu."
 mtg_britain.63.a: "Beraninya mereka?!"
 mtg_britain.64.t: "[From.GetName] Menyebarkan Propaganda"
 mtg_britain.64.d: "Pemerintah [From.GetAdjective] kini mulai menyebarkan propaganda ideologis secara luas, menggunakan darurat militer untuk menekan media."
 mtg_britain.64.a: "Kami hanya bisa berharap hal ini tidak terlalu berdampak pada masyarakat."
 mtg_britain.65.t: "[From.GetName] Menggantikan Pemerintah"
 mtg_britain.65.d: "[From.GetNameDefCap], dengan dukungan rakyat kami, kini telah membubarkan pemerintahan kami sama sekali, dan menyerukan pemilihan umum baru. Ini hanyalah sebuah lelucon, dimana pemerintahan loyalis meraih kemenangan telak."
 mtg_britain.65.a: "Berani sekali-- Maksudku, Rule Britannia!"
 mtg_britain.66.t: "Loyalitas kepada Inggris"
 mtg_britain.66.d: "Pemerintahan [ENG.GetAdjective] telah mengalami perubahan politik yang luar biasa. Kita harus memutuskan apakah akan tetap setia sekarang karena pandangan ideologis kita sangat berbeda."
 mtg_britain.66.a: "Kami melihat tidak ada yang salah dengan keadaan ini."
 mtg_britain.66.b: "Ini tidak bisa diterima! Kami akan mendeklarasikan kemerdekaan!"
 mtg_britain.66.c: "Pemerintah kita mungkin belum menganut keyakinan [ENG.GetAdjective], namun keadaan mulai berubah."
 mtg_britain.67.t: "[From.GetName] Memproklamirkan Kemerdekaan"
 mtg_britain.67.d: "[From.GetNameDefCap] telah memberi tahu kami bahwa mereka tidak setuju dengan jalur ideologis yang kami pilih, dan oleh karena itu mereka tidak melihat pilihan lain selain memisahkan diri dari Kekaisaran."
 mtg_britain.67.a: "Kita akan lihat berapa lama hal itu berlangsung."
 ENG_dominions_stayed_with_fascist_britain_flag: "Tinggal bersama Fasis Inggris."
 mtg_britain.68.t: "Komunisme di Kanada"
 mtg_britain.68.d: "[ENG.GetNameDefCap] dipaksakan melalui pemerintahan Komunis di [FROM.GetNameDef]. Kita tentu tidak bisa membiarkan ancaman ideologis seperti itu muncul di perbatasan kita?!"
 mtg_britain.68.a: "Kami akan sangat keberatan."
 mtg_britain.68.b: "Tidak ada yang bisa kami lakukan."
 mtg_britain.69.t: "[USA.GetName] Keberatan terhadap [CAN.GetAdjective] Komunisme"
 mtg_britain.69.d: "[From.GetNameDefCap] telah mengeluarkan ultimatum, menuntut agar kita segera menghentikan penyebaran komunisme di [CAN.GetNameDef]."
 mtg_britain.69.a: "Biarkan mereka mencoba untuk menegakkan permintaan itu."
 mtg_britain.69.b: "Maka kita tidak punya pilihan selain menurutinya."
 mtg_britain.70.t: "[From.GetName] Menolak untuk Mundur"
 mtg_britain.70.d: "[From.GetNameDefCap] telah menolak tuntutan kami, dan memberi tahu kami bahwa kami tidak mempunyai wewenang atas pekerja [CAN.GetAdjective]."
 mtg_britain.70.a: "Maka kita harus mendapatkan otoritas kita melalui cara militer."
 mtg_britain.70.b: "Mereka menyebut gertakan kami - kami harus mundur."
 mtg_britain.71.t: "[From.GetName] Mundur"
 mtg_britain.71.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka akan menahan diri untuk tidak menyebarkan komunisme di [CAN.GetNameDef]."
 mtg_britain.71.a: "Mereka tahu apa yang terbaik bagi mereka."
 ENG_ditched_the_italians_flag: "Menjauhkan diri dari Italia demi Inggris."
 ENG_ditched_by_the_germans_flag: "Ditinggalkan oleh Jerman demi Inggris."
 ENG_democratic_civil_war_tt: "Pendukung demokrasi memulai perang saudara."
 mtg_britain.34_tt: "Angkatan Laut Kerajaan kembali ke kendali kami."
 ENG_communist_civil_war_tt: "Pendukung komunis memulai perang saudara."
 mtg_britain.62_tt: "Inggris akan mampu mengubah kita ke ideologi mereka selama 180 hari ke depan."
 mtg_britain.68_tt: "Abaikan semua upaya untuk mengamankan Kanada."
 mtg_britain.72.t: "Kerusuhan Sipil di India Utara"
 mtg_britain.72.d: "Upaya untuk mempertahankan satu negara bagian di anak benua India terbukti menimbulkan banyak perselisihan. Perbedaan agama mulai menyebabkan keresahan dan bentrokan masyarakat, terutama di wilayah barat laut dan timur laut negara tersebut, sementara tokoh-tokoh terkemuka semakin menggunakan retorika yang bermusuhan. Krisis ini tidak menunjukkan tanda-tanda melambat, dan bahkan di Burma, orang-orang berbicara tentang pemisahan diri..."
 mtg_britain.72.a: "Tidak menyenangkan... Sebaiknya kita bersiap menghadapi kemungkinan terburuk."
 mtg_britain.73.t: "Perang Saudara India"
 mtg_britain.73.d: "Ketegangan di wilayah utara negara itu akhirnya mencapai titik puncaknya, dan kekerasan antara penduduk Muslim dan Hindu telah meningkat menjadi perang saudara. Sebuah pemerintahan Muslim sementara telah terbentuk, mendeklarasikan kemerdekaan penuh Pakistan, dan mengumumkan tekad mereka untuk mempertahankannya dengan cara militer."
 mtg_britain.73.a: "Kita tidak bisa membiarkan mereka melepaskan diri begitu saja!"
 mtg_britain.73.b: "Ini tidak layak untuk diperjuangkan."
 mtg_britain.74.t: "Perang Saudara dengan [PAK.GetName] Kios"
 mtg_britain.74.d: "Perang kita melawan [PAK.GetNameDef] telah terhenti dan opini publik memburuk karena hilangnya nyawa yang tidak masuk akal, dan perang tidak akan berakhir. Mungkin ini saat yang tepat untuk memulai perundingan perdamaian?"
 mtg_britain.74.a: "Sudah waktunya untuk menerima kemerdekaan mereka."
 mtg_britain.74.b: "Kami tidak akan pernah menerima kemerdekaan mereka!"
 mtg_britain.75.t: "[RAJ.GetName] Mengakui Kemandirian Kita"
 mtg_britain.75.d: "[RAJ.GetNameDef] sudah pasrah menerima kemerdekaan kita. Menghadapi anjloknya dukungan dalam negeri, mereka merasa tidak ada gunanya melanjutkan perang yang melelahkan ini."
 mtg_britain.75.a: "Akhirnya."
 mtg_britain.76.t: "Perang Saudara Pakistan"
 mtg_britain.76.d: "Perbedaan budaya antara [PAK.GetName] Timur dan Barat telah menyebabkan meningkatnya ketegangan, dan kini masyarakat Bangladesh melakukan pemberontakan terbuka melawan apa yang mereka anggap sebagai 'penindasan kami'. Kecil kemungkinannya kita akan mampu mengendalikan wilayah tersebut tanpa menumpahkan darah..."
 mtg_britain.76.a: "Maka kita harus menumpahkan darah."
 mtg_britain.76.b: "Ini tidak masuk akal – kita harus menerima kemerdekaan mereka."
 mtg_britain.77.t: "Perang Saudara dengan [BAN.GetName] Kios"
 mtg_britain.77.d: "Perang kita melawan [BAN.GetNameDef] telah terhenti dan opini publik memburuk karena hilangnya nyawa yang tidak masuk akal, dan perang tidak akan berakhir. Mungkin ini saat yang tepat untuk memulai perundingan perdamaian?"
 mtg_britain.77.a: "Sudah waktunya untuk menerima kemerdekaan mereka."
 mtg_britain.77.b: "Kami tidak akan pernah menerima kemerdekaan mereka!"
 mtg_britain.78.t: "[PAK.GetName] Mengakui Kemandirian Kita"
 mtg_britain.78.d: "[PAK.GetNameDef] sudah pasrah menerima kemerdekaan kita. Menghadapi anjloknya dukungan dalam negeri, mereka merasa tidak ada gunanya melanjutkan perang yang melelahkan ini."
 mtg_britain.79.t: "[From.GetNameDefCap] Menuntut Kepatuhan"
 mtg_britain.79.d: "[From.GetNameDefCap] memberi tahu kami bahwa mereka harus melewati tanah kami untuk menyerang musuh mereka, [SOV.GetNameDef]. Mereka menuntut kepatuhan kita segera, serta pengawasan pemerintah yang luas. Jika tidak, mereka mengatakan mereka tidak punya pilihan selain meneruskan pasukan mereka melalui wilayah kami TANPA persetujuan kami..."
 mtg_britain.79.a: "Setidaknya dengan cara ini kita tidak akan melawan Soviet sendirian."
 mtg_britain.79.b: "Mereka harus merebut kepatuhan kita dari tangan kita yang mati dan dingin!"
 mtg_britain.80.t: "[From.GetNameDefCap] Menerima Permintaan"
 mtg_britain.80.d: "[From.GetNameDefCap] telah menerima tuntutan kami, dan memberi kami kendali luas atas wilayah mereka."
 mtg_britain.80.a: "Bagus - melalui Kaukasus dan ke Stalingrad!"
 mtg_britain.81.t: "[From.GetName] Menolak Tuntutan"
 mtg_britain.81.d: "[From.GetNameDefCap] telah menolak tuntutan kami. Perwakilan mereka mengatakan: \"Jika kita ingin mereka patuh, kita harus merebutnya dari tangan mereka yang dingin dan mati!\""
 mtg_britain.81.a: "Mereka memintanya."
 mtg_britain.82.t: "Konferensi Kekaisaran [?global.year|0]"
 mtg_britain.82.d: "Selama dua bulan ke depan, perwakilan dari pemerintah Inggris dan Dominion akan berkumpul di London untuk membahas masalah-masalah yang menyangkut seluruh Kekaisaran. Ini adalah waktu yang tepat untuk membahas masalah-masalah seperti pertahanan, perdagangan, atau Penenangan, yang diharapkan dapat memberikan kesempatan terbaik bagi Kekaisaran untuk bertahan dari krisis saat ini.\n\nSelain itu, ini mungkin waktu terbaik untuk menyelesaikan secara final masalah Federasi Kekaisaran, yang telah diangkat berulang kali dalam Konferensi Kekaisaran sebelumnya. Apakah masa depan Persemakmuran Inggris akan menjadi sebuah asosiasi longgar yang terdiri dari negara-negara yang independen dan berdaulat, atau sebuah federasi yang bersatu dan dapat berdiri kokoh dalam menghadapi gejolak global, mungkin akan ditentukan dalam beberapa bulan mendatang."
 mtg_britain.82.a: "Mari kita dorong agenda kita."
 mtg_britain.82.b: "Biarkan suara kami didengar!"
 mtg_britain.82_tt: "Pengubah opini ini akan dihapus ketika konferensi selesai. Semakin tinggi pendapat peserta, semakin besar kemungkinan mereka menyetujui usulan Anda."
 mtg_britain.83.t: "Konferensi Kekaisaran: Pertahanan"
 mtg_britain.83.d: "Mengingat krisis global saat ini, jelas bahwa kita tidak dapat lagi memikul tanggung jawab pertahanan Kekaisaran sepenuhnya, sehingga kita harus lebih bergantung pada Dominion kita. Setiap negara harus meningkatkan belanja pertahanannya masing-masing, sehingga seluruh negara dapat berdiri lebih kuat dalam menghadapi apa pun yang mungkin terjadi di dunia."
 mtg_britain.83.a: "Mari kita berharap Dominion setuju."
 mtg_britain.83.b: "Menghabiskan upaya diplomatik untuk membujuk Dominion agar setuju."
 mtg_britain.83.c: "Menghabiskan upaya diplomatik yang luar biasa untuk membujuk Dominion agar setuju."
 mtg_britain.84.d: "Perwakilan [From.GetAdjective] di konferensi tersebut telah mengindikasikan keinginan mereka agar Kekaisaran secara keseluruhan mengeluarkan lebih banyak dana untuk persenjataan dan pertahanan. Jika kita setuju, kita menerima beban untuk lebih menjaga pertahanan lokal kita sendiri, dan tidak terlalu bergantung pada dukungan [From.GetAdjective]."
 mtg_britain.84.a: "Pertahanan Kekaisaran bergantung pada kita semua."
 mtg_britain.84.b: "Anggaran kami tidak memungkinkan hal ini."
 mtg_britain.85.t: "Konferensi Kekaisaran: Pertahanan - [From.GetName] Menerima"
 mtg_britain.85.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui usulan kami untuk meningkatkan pengeluaran pertahanan. Mereka berjanji akan segera melakukannya."
 mtg_britain.85.a: "Mereka melakukan tugas mereka kepada Kekaisaran."
 mtg_britain.86.t: "Konferensi Kekaisaran: Pertahanan - [From.GetName] Ditolak"
 mtg_britain.86.d: "Pemerintah [From.GetAdjective] memberi tahu kita bahwa mereka tidak mempunyai sarana untuk meningkatkan pengeluaran pertahanan. Oleh karena itu, mereka terpaksa menolak usulan kami."
 mtg_britain.86.a: "Mereka merampas perlindungan kita!"
 mtg_britain.87.t: "Konferensi Kekaisaran: Perdagangan"
 mtg_britain.87.d: "Jika Kekaisaran ingin berkembang, kita harus memperluas perjanjian perdagangan preferensial yang sudah ada. Kami mengusulkan agar Dominion meningkatkan ekspor mereka ke pusat industri di Kepulauan Inggris, sehingga kami dapat memberikan bahan bakar bagi industri kami dengan cara yang paling efisien."
 mtg_britain.88.d: "Pemerintah [From.GetAdjective] telah menyatakan keinginannya untuk memperluas perjanjian perdagangan preferensial yang sudah ada, untuk meningkatkan impor yang tersedia ke jantung industri Inggris. Mereka berpendapat bahwa Inggris yang lebih kuat akan berarti kerajaan yang lebih kuat secara keseluruhan."
 mtg_britain.88.a: "Kelangsungan hidup Kekaisaran bergantung padanya."
 mtg_britain.88.b: "Kami akan berdagang dengan cara apa pun yang kami suka."
 mtg_britain.89.t: "Konferensi Kekaisaran: Perdagangan - [From.GetName] Menerima"
 mtg_britain.89.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui usulan kami untuk meningkatkan ekspor. Mereka akan segera mengubah peraturan perdagangannya."
 mtg_britain.89.a: "Bersama-sama kita akan sejahtera."
 mtg_britain.90.t: "Konferensi Kekaisaran: Perdagangan - [From.GetName] Ditolak"
 mtg_britain.90.d: "Pemerintah [From.GetAdjective] telah menolak usulan kami untuk meningkatkan ekspor dan memperluas program perdagangan preferensial. Mereka khawatir hal ini akan berdampak negatif terhadap situasi perekonomian dalam negeri mereka."
 mtg_britain.90.a: "Mereka hanya memikirkan diri mereka sendiri!"
 mtg_britain.91.t: "Konferensi Kekaisaran: Ekonomi"
 mtg_britain.91.d: "Perekonomian yang kuat adalah tulang punggung yang menopang seluruh Kekaisaran. Sangat penting bagi negara-negara Dominion untuk tidak mengabaikan pembangunan industri dalam negeri mereka, namun berinvestasi besar-besaran dalam kemajuan industrialisasi yang berkelanjutan."
 mtg_britain.92.d: "Para pemimpin [From.GetAdjective] telah menyampaikan argumen yang kuat mengenai pentingnya pembangunan industri dalam negeri. Mereka menginginkan agar kita meningkatkan investasi pemerintah di sektor ini."
 mtg_britain.92.a: "Perekonomian kita harus kuat untuk menghadapi badai yang akan datang."
 mtg_britain.92.b: "Kami tidak mempunyai dana untuk itu saat ini."
 mtg_britain.93.t: "Konferensi Kekaisaran: Ekonomi - [From.GetName] Menerima"
 mtg_britain.93.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui permintaan kami untuk meningkatkan investasi pada industri dalam negeri mereka. Mereka akan segera mencairkan dana tersebut."
 mtg_britain.93.a: "Investasi mereka akan membuahkan hasil yang besar."
 mtg_britain.94.t: "Konferensi Kekaisaran: Ekonomi - [From.GetName] Ditolak"
 mtg_britain.94.d: "Pemerintah [From.GetAdjective] telah menolak permintaan kami untuk meningkatkan investasi ke industri dalam negeri mereka. Mereka mengklaim bahwa pertumbuhan alami akan lebih menguntungkan sektor ini dalam jangka panjang."
 mtg_britain.94.a: "Mereka mengambil kekayaan kita!"
 mtg_britain.95.t: "Konferensi Kekaisaran: Ketenangan"
 mtg_britain.95.d: "Kebijakan Peredaan bukannya tanpa kritik di kalangan Kekaisaran. Kita harus sekali lagi mengemukakan hal ini untuk didiskusikan, dan mengakui bahwa mungkin diperlukan perubahan dalam nada diplomasi, namun hal ini memerlukan dukungan dari Kekaisaran."
 mtg_britain.96.d: "Para pemimpin [From.GetAdjective] mengakui bahwa kebijakan Peredaan mungkin memiliki kelemahan, dan mereka bersedia mengajukan hal ini untuk didiskusikan. Mereka terbuka untuk mengubah sikap diplomatik mereka, namun hanya akan melakukannya jika mereka mendapat dukungan dari Kekaisaran."
 mtg_britain.96.a: "Mungkin kita harus menerima kegagalan Peredaan."
 mtg_britain.96.b: "Kita harus tetap setia pada kebijakan Penenangan kita."
 mtg_britain.97.t: "Konferensi Kekaisaran: Ketenangan - [From.GetName] Menerima"
 mtg_britain.97.d: "Pemerintah [From.GetAdjective] telah memberitahu kita bahwa mereka setuju bahwa upaya peredaan telah berjalan dengan baik, dan bahwa sikap yang lebih kuat diperlukan untuk membela kepentingan global kita, bahkan jika hal ini dapat menyebabkan perang."
 mtg_britain.97.a: "Mereka melihat ancamannya."
 mtg_britain.98.t: "Konferensi Kekaisaran: Ketenangan - [From.GetName] Ditolak"
 mtg_britain.98.d: "Pemerintah [From.GetAdjective] tidak setuju dengan keraguan kami terhadap Peredaan, dengan alasan bahwa kami tidak boleh terjebak dalam perang, dan bahwa kami harus mempertahankan kebijakan kami untuk menenangkan mereka yang ingin menguji kami."
 mtg_britain.98.a: "Mereka tidak punya tulang punggung!"
 mtg_britain.99.t: "Konferensi Kekaisaran: Federasi"
 mtg_britain.99.d: "Konsep negara super federal yang mencakup seluruh Kerajaan Inggris sudah berusia lebih dari setengah abad, namun Konferensi Kekaisaran sebelumnya tidak dapat mencapai keputusan mengenai masalah tersebut. Kami memiliki satu kesempatan terakhir, sebelum kami menjadi terlalu siap untuk menjadi tuan rumah bagi Dominion. Kita harus membuat mereka memahami bahwa ini adalah solusi terbaik bagi rakyat mereka, dan bagi Persemakmuran Bangsa-Bangsa secara keseluruhan."
 mtg_britain.100.d: "Pemerintah [From.GetAdjective] sekali lagi mengusulkan pembentukan negara super federal yang mencakup seluruh Kerajaan Inggris, di mana semua negara anggota mempunyai hak untuk menentukan kebijakan luar negeri dan dalam negeri. Menurut mereka, hal ini akan menjadi alternatif yang layak terhadap konsep 'pemerintahan dalam negeri', yang pada akhirnya akan membuat kita menjadi mandiri sepenuhnya."
 mtg_britain.100.a: "Kita akan menjadi lebih kuat bersama-sama."
 mtg_britain.100_tt: "§RJika diterima,§!§Y[FROM.GetNameDef]§!§Rdapat membentuk§!§YFederasi Kekaisaran§!§Rdan mencaplok us§!\n\nJika resolusi disahkan, Anda akan menerima:"
 mtg_britain.100.b: "Kami tidak akan pernah menyerahkan kemerdekaan kami!"
 mtg_britain.101.t: "Konferensi Kekaisaran: Federasi - [From.GetName] Menerima"
 mtg_britain.101.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui usulan kami untuk membentuk Federasi Kekaisaran. Mereka sepenuhnya mendukung kami, dan akan berusaha mempersiapkan integrasi jika usulan tersebut berhasil."
 mtg_britain.101.a: "Kita akan menjadi lebih kuat sebagai satu kesatuan."
 mtg_britain.102.t: "Konferensi Kekaisaran: Federasi - [From.GetName] Menolak"
 mtg_britain.102.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka telah menolak usulan kami untuk membentuk Federasi Kekaisaran. Mereka menganggap konsep tersebut sebagai pelanggaran yang tidak dapat diterima terhadap hak-hak rakyatnya. Dalam upaya mencapai hak menentukan nasib sendiri yang tidak dapat dicabut, pemerintahan dalam negeri adalah satu-satunya jalan ke depan."
 mtg_britain.102.a: "Mereka tidak melihat masa depan..."
 mtg_britain.103.t: "Konferensi Kekaisaran: Federasi - Sukses"
 mtg_britain.103.d: "Mosi Federasi Kekaisaran sukses dengan suara bulat. Saat ini, semua pihak yang terlibat harus memulai proses panjang untuk membentuk kembali dan mengintegrasikan pemerintahan mereka di tingkat federal, yang pada akhirnya akan memfasilitasi integrasi penuh wilayah kita."
 mtg_britain.103.a: "Sebuah peristiwa penting bagi Kekaisaran!"
 mtg_britain.104.t: "Konferensi Kekaisaran: Federasi - Sukses Sebagian"
 mtg_britain.104.d: "Mosi Federasi Kekaisaran menemui jalan buntu. Meskipun [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef], dan [NZL.GetNameDef] telah menerima, pemerintah [RAJ.GetAdjective] telah menyebutkan perbedaan budaya yang mendasar, serta kurangnya rasa hormat terhadap hak-hak negara bagian India sebagai alasan untuk menolak mosi kami.\n\nKita sekarang harus memutuskan apakah akan melanjutkan Dominion yang menerima, dan dengan demikian memberikan hibah [RAJ.GetNameDef] independensinya, atau mengesampingkan proposal tersebut sama sekali."
 mtg_britain.104.a: "Maka jalan kita harus berbeda di sini."
 mtg_britain.104.b: "Tanpa India kita bukan apa-apa."
 mtg_britain.105.t: "Konferensi Kekaisaran: Federasi - Kegagalan"
 mtg_britain.105.d: "Tanpa dukungan bulat, mosi Federasi Kekaisaran telah dikalahkan. Karena tampaknya minat terhadap alternatif pemerintahan dalam negeri ini semakin menurun, bukannya meningkat, usulan tersebut sekarang pasti akan dihapuskan sebagai topik Konferensi Kekaisaran di masa depan. Sebaliknya, kami akan terus berupaya mewujudkan kemerdekaan penuh."
 mtg_britain.105.a: "Kalau begitu, mari kita fokus pada tujuan yang lebih bisa dicapai."
 mtg_britain.106.t: "[From.GetName] Menuntut Kepatuhan terhadap Perjanjian"
 mtg_britain.106.d: "[From.GetNameDefCap] telah mengeluarkan ultimatum, menuntut agar kita segera mengurangi jumlah kapal modal agar kita kembali sesuai dengan ketentuan Perjanjian Angkatan Laut Washington. Mereka menambahkan bahwa jika kami tidak mematuhinya dalam waktu 60 hari, mereka bersedia mengurangi jumlah kapal modal kami melalui penggunaan kekuatan militer."
 mtg_britain.106.a: "Mereka takut pada kita."
 mtg_britain.107.t: "[From.GetName] Mematuhi Perjanjian"
 mtg_britain.107.d: "Perwakilan [From.GetAdjective] telah meminta maaf sebesar-besarnya atas pelanggaran yang mereka lakukan terhadap Perjanjian Angkatan Laut Washington, dan mereka meyakinkan kita bahwa mereka telah mengurangi jumlah kapal besar agar kembali sesuai dengan ketentuan perjanjian."
 mtg_britain.107.a: "Jangan biarkan hal itu terjadi lagi."
 mtg_britain.108.t: "[From.GetName] Menentang Perjanjian"
 mtg_britain.108.d: "[From.GetAdjective] tidak banyak bicara mengenai kewajiban perjanjian mereka. Tidak ada indikasi yang diberikan untuk mengurangi jumlah kapal modal mereka."
 mtg_britain.108.a: "Mereka tidak akan menentang kita lagi."
 mtg_britain.200.t: "[FROM.GetNameDefCap] Upaya Memasang Rezim [FROM.GetRulingIdeology]"
 mtg_britain.200.d: "Dalam peristiwa yang menakjubkan, pemerintah [FROM.GetLeader] telah berupaya menggalang dukungan di [ROOT.GetName] untuk mengubah partai berkuasa menjadi [FROM.GetRulingIdeology]."
 mtg_britain.200.a: "Lebih aman untuk menyetujuinya."
 mtg_britain.200.b: "Atas mayat kita!"
 mtg_britain.200.tt: "§RIni mungkin mempunyai konsekuensi yang mengerikan§!"
 mtg_britain.201.t: "[FROM.GetNameDefCap] Menolak Perubahan Rezim"
 mtg_britain.201.d: "Dalam tampilan ketidaksetiaannya yang menakjubkan, [FROM.GetLeader] telah mengumumkan penolakan mereka untuk menuruti keinginan [ROOT.GetLeader] mengenai topik peran [ROOT.GetRulingIdeology] dalam pemerintahan mereka. Satu-satunya cara kami untuk mencapai perubahan rezim saat ini adalah melalui konflik bersenjata dengan [FROM.GetNameDef]."
 mtg_britain.201.a: "Mari kita tinggalkan topik ini, persatuan lebih penting."
 mtg_britain.201.b: "Ini adalah perang."
 mtg_britain.202.t: "[FROM.GetNameDefCap] Menyatakan Perang"
 mtg_britain.202.d: "Tampaknya [FROM.GetLeader] tidak menerima penolakan kami dengan baik, bahkan sampai mengumumkan deklarasi perang resmi!"
 mtg_britain.202.a: "Beberapa hal memang patut diperjuangkan."
 mtg_britain.203.t: "[FROM.GetNameDefCap] Mencabut Topik Perubahan Rezim"
 mtg_britain.203.d: "Dalam catatan dari [FROM.GetLeader], mereka telah mengumumkan penerimaan mereka atas penolakan kami, dengan alasan perlunya menjaga persatuan Persemakmuran."
 mtg_britain.203.a: "Tidak ada perang dengan ibu negara."
 panay_inc_opinion_modifier: "Insiden Panay"
 panay_inc2_opinion_modifier: "Serangan terhadap HMS Kepik"
 panay_incident.2.t: "USS Panay tenggelam di Tiongkok!"
 panay_incident.2.d: "Kapal perang USS Panay diserang hari ini ketika mengevakuasi warga sipil dari garis depan dalam perang antara [JAP.GetName] dan [CHI.GetName], meskipun ditandai dengan jelas dengan bendera [USA.GetAdjective]. Dihantam dengan dua bom, dia tenggelam pada hari itu juga dengan tiga warga AS tewas dan banyak lagi yang terluka. Korban selamat dijemput oleh kapal perang [USA.GetAdjective] dan [ENG.GetAdjective] di daerah tersebut.\n\n[JAP.GetNameDef] dengan cepat mengklaim bahwa itu adalah kecelakaan dan menawarkan permintaan maaf, namun beberapa orang berpikir bahwa serangan itu disengaja dan sejumlah penasihat menyerukan perang. Namun, dukungan masyarakat terhadap perang masih rendah dan deklarasi apa pun kemungkinan besar akan menimbulkan perpecahan. Bagaimana seharusnya kita menanggapinya?"
 panay_incident.2.e: "Kapal perang USS Panay diserang hari ini ketika mengevakuasi warga sipil dari garis depan dalam perang antara [JAP.GetName] dan [CHI.GetName], meskipun ditandai dengan jelas dengan bendera [USA.GetAdjective]. Dihantam dengan dua bom, dia tenggelam pada hari itu juga dengan tiga warga AS tewas dan banyak lagi yang terluka. Korban selamat dijemput oleh kapal perang [USA.GetAdjective] dan [ENG.GetAdjective] di daerah tersebut.\n\n[JAP.GetNameDef] dengan cepat mengklaim bahwa itu adalah kecelakaan dan menawarkan permintaan maaf, namun beberapa orang berpikir bahwa serangan itu disengaja dan sejumlah penasihat menyerukan perang. Bagaimana seharusnya kita menanggapinya?"
 panay_incident.2.a: "Tarik pasukan kami dari Tiongkok"
 panay_incident.2.a.tt: "Masyarakat sangat prihatin dengan keterlibatan asing. Kejadian ini tidak akan pernah terjadi jika prajurit kita tidak berada di [CHI.GetName]. Penarikan sejumlah kecil kapal perang dan personel di Tiongkok akan membantu meningkatkan stabilitas dalam negeri, meskipun hal ini juga akan semakin menjauhkan kita dari intervensi militer di masa depan."
 panay_incident.2.e.tt: "Dengan meningkatnya dukungan perang, penarikan diri dari [CHI.GetName] saat ini akan merusak upaya kita untuk membenarkan tindakan militer di masa depan, meskipun meyakinkan publik akan keinginan kita untuk perdamaian akan membantu stabilitas dalam negeri."
 panay_incident.2.b: "Menuntut kompensasi"
 panay_incident.2.b.tt: "Tuntutan kami akan disampaikan kepada Pemerintah Jepang, dan kami harus menunggu tanggapan mereka."
 panay_incident.2.c: "Perang!"
 panay_incident.2.c.tt: "Meskipun basis industri kita yang jauh lebih kuat merupakan keuntungan utama, rendahnya dukungan publik akan membuat perang menjadi sebuah hal yang berisiko, dan membatasi kapasitas kita untuk terlibat dalam pembangunan global lainnya."
 panay_incident.3.t: "[USA.GetName] menuntut permintaan maaf dan kompensasi"
 panay_incident.3.d: "Menanggapi tenggelamnya USS Panay awal pekan ini, [USA.GetNameDef] menuntut permintaan maaf, hukuman bagi petugas yang terlibat, dan kompensasi. Meskipun serangan tersebut tidak diperintahkan oleh Pemerintah kita, tidak sepenuhnya jelas apakah ini merupakan kesalahan pilot yang terlalu antusias atau upaya kelompok militer garis keras untuk mendorong [USA.GetNameDef] dan [ENG.GetName] untuk menarik pasukan mereka keluar dari [CHI.GetName]. Beberapa orang di Pemerintahan tidak akan menyukai kita menyetujui persyaratan [USA.GetAdjective], namun penolakan dapat berarti perang."
 panay_incident.3.a: "Setuju dengan Persyaratan [USA.GetAdjective]"
 panay_incident.3.b: "Kami tidak akan pernah tunduk pada orang-orang Barat yang dekaden!"
 panay_incident.3.b.tt: "Menolak ketentuan [USA.GetAdjective] akan dilihat sebagai unjuk kekuatan dalam negeri, meningkatkan dukungan terhadap Pemerintah kita, namun apakah hal ini sepadan dengan risiko perang dengan [USA.GetNameDef]?"
 panay_incident.4.t: "[JAP.GetName] setuju untuk memberikan kompensasi"
 panay_incident.4.d: "Kami telah menerima tanggapan dari duta besar [JAP.GetAdjective] yang menyetujui permintaan kami mengenai kompensasi atas tenggelamnya USS Panay.  Meskipun sikap masyarakat di [USA.GetNameDef] terhadap [JAP.GetName] akan dipengaruhi oleh peristiwa ini untuk beberapa waktu ke depan, perang telah\ndapat dihindari."
 panay_incident.4.a: "Untungnya [JAP.GetName] melihat alasannya"
 panay_incident.5.t: "[JAP.GetName] menolak kompensasi"
 panay_incident.5.d: "Jelas bahwa permintaan maaf [JAP.GetAdjective] atas tenggelamnya USS Panay hanyalah basa-basi, karena mereka secara blak-blakan menolak permintaan kompensasi kami. Hal ini membuat kita berada dalam situasi yang sulit, karena negara ini belum siap menghadapi perang yang tidak populer, namun mundurnya negara ini akan merugikan kita secara politik dan memperkuat sikap anti-intervensi masyarakat. Namun, mundur dari perang akan meyakinkan para pemilih bahwa Pemerintah bersungguh-sungguh dalam menghindari keterlibatan pihak asing."
 panay_incident.5.a: "Perang tidak akan mengembalikan USS Panay"
 panay_incident.5.b: "Kami akan membayar [JAP.GetName]!"
 panay_incident.6.t: "[USA.GetName] menarik diri dari Tiongkok"
 panay_incident.6.d: "Hilangnya USS Panay telah menimbulkan kekhawatiran akan terjadinya perang di [USA.GetNameDef]. Jelas tidak memiliki keinginan untuk berkonfrontasi, para politisi [USA.GetAdjective] telah berhasil melobi untuk penarikan semua kapal perang dan personel [USA.GetAdjective] yang tersisa dari Tiongkok."
 panay_incident.6.a: "Kelemahan mereka adalah kekuatan kita"
 mtg_netherlands.1.t: "Venezuela Menawarkan untuk 'Melindungi' Kepulauan ABC"
 mtg_netherlands.1.d: "Mengutip kelemahan militer kita saat ini setelah invasi ke tanah air kita, pemerintah [VEN.GetAdjective] telah mengajukan proposal untuk 'membantu melindungi' Kepulauan ABC dari serangan musuh. Dipertanyakan apakah mereka akan bersedia untuk pergi setelah bantuan mereka tidak lagi diperlukan..."
 mtg_netherlands.1.a: "Ini tidak ideal, tapi kami tidak punya pilihan."
 mtg_netherlands.1.b: "Tidak! Mereka hanya menginginkan pulau itu untuk mereka sendiri."
 mtg_netherlands.1.c: "Sebaliknya, berikan kendali kepada Inggris - jangan sampai situasi menjadi lebih buruk."
 mtg_netherlands.1.e: "Sebaliknya, berikan Amerika kendali – jangan sampai situasi menjadi lebih buruk."
 mtg_netherlands.2.t: "[From.GetNameDefCap] Menerima Penawaran kami"
 mtg_netherlands.2.d: "Pemerintah [HOL.GetAdjective] telah menerima tawaran kami untuk memberikan mereka 'perlindungan' bagi Kepulauan ABC."
 mtg_netherlands.2.a: "Taktik kami telah berhasil."
 mtg_netherlands.3.t: "[From.GetNameDefCap] Menolak Tawaran kami"
 mtg_netherlands.3.d: "Pemerintah [HOL.GetAdjective] telah menolak tawaran kami untuk memberikan mereka 'perlindungan' bagi Kepulauan ABC."
 mtg_netherlands.3.a: "Kami tidak akan membiarkan ini berlalu!"
 mtg_netherlands.4.t: "[From.GetNameDefCap] Meminta Perlindungan kami di Kepulauan ABC"
 mtg_netherlands.4.d: "Pemerintah [HOL.GetAdjective] telah meminta agar kami mengambil alih perlindungan Curaçao. Mereka telah dihubungi oleh Venezuela dengan kedok 'menawarkan perlindungan', dan takut akan terjadinya permusuhan jika mereka menolak 'tawaran' [VEN.GetAdjective]."
 mtg_netherlands.4.a: "Kami akan menerima beban ini."
 mtg_netherlands.4.b: "Kita tidak bisa terlibat dalam sengketa wilayah lokal."
 mtg_netherlands.5.t: "[From.GetNameDefCap] Menerima Perlindungan Kepulauan ABC"
 mtg_netherlands.5.d: "[From.GetNameDefCap] telah memutuskan untuk menerima pengambilalihan tanggung jawab atas Kepulauan ABC."
 mtg_netherlands.5.a: "Ini lebih baik daripada alternatifnya."
 mtg_netherlands.6.t: "[From.GetNameDefCap] Menolak Melindungi Kepulauan ABC"
 mtg_netherlands.6.d: "[From.GetNameDefCap] telah memutuskan untuk menolak mengambil alih tanggung jawab atas Kepulauan ABC. Mereka mengatakan mereka tidak bisa terlibat dalam apa yang mereka sebut 'sengketa wilayah lokal'."
 mtg_netherlands.6.a: "Kalau begitu, kami tidak punya pilihan selain menerima tawaran [VEN.GetAdjective]."
 mtg_netherlands.6.b: "Bagaimanapun, rakyat Venezuela tidak akan mendapatkannya!"
 ven_claims_abc_islands: "§YVenezuela§! telah menawarkan untuk 'melindungi' §YCuraçao§!."
 mtg_netherlands.7.t: "[From.GetNameDefCap] Meminta Rencana Penjelajah Tempur"
 mtg_netherlands.7.d: "[From.GetNameDefCap] telah meminta agar kami membagikan rencana kami untuk kapal penjelajah tempur kelas Scharnhorst. Mereka ingin menggunakan ini untuk membuat \"Penjelajah Tempur Desain 1047\" mereka sendiri, yang memungkinkan mereka memproyeksikan kekuatan di koloni mereka di Hindia Timur."
 mtg_netherlands.7.a: "Kenapa tidak."
 mtg_netherlands.7.b: "Tidak. Mereka bisa merancang kapalnya sendiri."
 mtg_netherlands.8.t: "[From.GetNameDefCap] Membagikan Rencana Penjelajah Tempur"
 mtg_netherlands.8.d: "[From.GetNameDefCap] telah memutuskan untuk berbagi rencana mereka untuk Penjelajah Tempur kelas Scharnhorst dengan kami."
 mtg_netherlands.8.a: "Kabar baik!"
 mtg_netherlands.9.t: "[From.GetNameDefCap] Menolak Membagikan Rencana Penjelajah Tempur"
 mtg_netherlands.9.d: "[From.GetNameDefCap] telah memutuskan untuk tidak membagikan rencana mereka untuk Penjelajah Tempur kelas Scharnhorst kepada kami."
 mtg_netherlands.9.a: "Itu sangat disayangkan..."
 mtg_netherlands.10.t: "Bentuk Pemerintahan Baru"
 mtg_netherlands.10.d: "Kabinet kelima Colijn sekali lagi, seperti pendahulunya, jatuh, dan Menteri Negara Dirk Jan de Geer diminta untuk mengambil tanggung jawab membentuk pemerintahan baru. Terakhir bertugas pada tahun 1933, ia telah membuktikan kemampuannya mengabdi pada negaranya di masa damai. Namun, dengan meningkatnya ketegangan dunia, tidak jelas bagaimana Menteri-Presiden yang baru akan memimpin negara dalam perang yang tampaknya semakin mungkin terjadi."
 mtg_netherlands.10.a: "Semoga saja ini lebih stabil dari sebelumnya."
 mtg_netherlands.11.t: "Ketertarikan Jepang pada Hindia Timur"
 mtg_netherlands.11.d: "Bukan rahasia lagi bahwa Jepang mempunyai kepentingan yang sangat besar terhadap sumber daya di Hindia Timur. Ada dua pilihan yang tersedia bagi kita: memberikan hak eksklusif kepada Jepang atas sumber daya yang mereka inginkan di koloni kita, atau memberi mereka kendali penuh atas koloni tersebut. Jika kita ingin menjaga hubungan damai dengan [JAP.GetNameDef], kita harus membuat pilihan."
 mtg_netherlands.11.a: "Beri mereka kendali atas pulau-pulau itu."
 mtg_netherlands.11.b: "Menjanjikan mereka impor sumber daya penting dalam skala besar."
 mtg_netherlands.12.t: "[From.GetNameDefCap] Menawarkan Kontrol atas Hindia Timur"
 mtg_netherlands.12.d: "Demi kepentingan perdamaian yang berkelanjutan, dan mengetahui kepentingan kami terhadap wilayah yang kaya sumber daya, [From.GetNameDefCap] telah menawarkan untuk menyerahkan seluruh Hindia Timur ke dalam kendali kami."
 mtg_netherlands.12.a: "Ini akan menjadi solusi yang bisa diterima untuk kesulitan kita."
 mtg_netherlands.12.b: "Mereka mungkin mempertahankan koloninya - kami punya solusi alternatif."
 mtg_netherlands.13.t: "[From.GetNameDefCap] Menawarkan Impor Hindia Timur"
 mtg_netherlands.13.d: "Demi kepentingan perdamaian yang berkelanjutan, dan mengetahui kepentingan kita terhadap wilayah yang kaya sumber daya, [From.GetNameDefCap] telah memberikan solusi. Daripada memberi kami kendali langsung atas wilayah tersebut, mereka malah mengusulkan untuk memberi kami hak tunggal atas sumber daya yang ditemukan di sana."
 mtg_netherlands.13.a: "Ini adalah kompromi yang bisa diterima."
 mtg_netherlands.13.b: "'Kompromi' ini tidak cukup baik."
 mtg_netherlands.14.t: "Ratu Memecat Menteri yang Mengalahkan"
 mtg_netherlands.14.d: "Bosan dengan sikap mengalah yang meluas dalam pemerintahan, Ratu Wilhelmina telah mendorong pemecatan menteri-menteri yang bersalah. Menteri-Presiden De Geer, daripada kehilangan muka di depan umum, malah diizinkan mundur karena 'alasan kesehatan'. Diharapkan dia tidak menimbulkan masalah lagi bagi kita di kemudian hari...\n\nPenggantinya, Pieter Sjoerds Gerbrandy, telah menonjol dalam penolakannya terhadap sikap mengalah de Geer. Jika dia mempertahankan sikap ini selama perang, dia akan menjadi contoh yang baik bagi anggota kabinet lainnya."
 mtg_netherlands.14.a: "Andai saja lebih banyak orang yang berbagi tekadnya."
 mtg_netherlands.15.t: "[From.GetNameDefCap] Mengusulkan Belanda Bersatu"
 mtg_netherlands.15.d: "[From.GetNameDefCap] telah mengajukan proposal untuk membentuk kembali negara penyangga Belanda Bersatu yang ada setelah Perang Napoleon. Mereka mengutip kontribusi mereka terhadap upaya perang, dibandingkan dengan ketidakbergunaan yang dilakukan oleh Belgia dan Luksemburg, sebagai alasan mengapa mereka tidak hanya diberi imbalan, tetapi juga mengapa rencana ini akan membantu menjaga perdamaian benua di masa depan."
 mtg_netherlands.15.a: "Ide bagus."
 mtg_netherlands.15.b: "Menurut kami tidak."
 mtg_netherlands.16.t: "[From.GetNameDefCap] Mendukung Proposal Bersatu Belanda"
 mtg_netherlands.16.d: "Inggris bereaksi positif terhadap usulan kami untuk menyatukan Negara-Negara Rendah. Kami mungkin memulai persiapan untuk integrasi tanah setelah pembebasannya."
 mtg_netherlands.16.a: "Berita paling bagus."
 mtg_netherlands.17.t: "[From.GetNameDefCap] Menolak Proposal Bersatu Belanda"
 mtg_netherlands.17.d: "Inggris telah menegaskan bahwa mereka tidak terlalu memikirkan usulan kami untuk mempersatukan Negara-Negara Rendah."
 mtg_netherlands.17.a: "Rasa tidak berterima kasih mereka sangat besar..."
 mtg_netherlands.18.d: "Telah menjadi perhatian kami bahwa Inggris telah menerima usulan Belanda untuk menyatukan Negara-Negara Rendah di bawah bendera Belanda. Perwakilan pemerintah kita tidak diajak berkonsultasi..."
 mtg_netherlands.18.a: "Apakah dengan cara ini api kebebasan padam?"
 mtg_netherlands.19.t: "[From.GetNameDefCap] Undangan ke Benelux"
 mtg_netherlands.19.d: "Perwakilan [HOL.GetAdjective] telah menghubungi kami dengan proposal kerjasama yang erat antara negara-negara yang membentuk Negara-Negara Rendah. Mereka sekarang ingin mendapatkan dukungan resmi kami untuk proyek ini."
 mtg_netherlands.19.a: "Ini adalah ide yang sangat bagus!"
 mtg_netherlands.19.b: "Kami tidak tertarik."
 mtg_netherlands.20.t: "[From.GetNameDefCap] Undangan ke Uni Eropa"
 mtg_netherlands.20.d: "Perwakilan [HOL.GetAdjective] telah menghubungi kami dengan proposal untuk kerja sama yang erat antara negara-negara kecil yang demokratis di Eropa. Mereka sekarang ingin mendapatkan dukungan resmi kami untuk proyek ini."
 mtg_netherlands.21.t: "[From.GetNameDefCap] Mengupayakan Integrasi Kolonial"
 mtg_netherlands.21.d: "Dari interaksi kami menjadi jelas bahwa [From.GetNameDefCap] berusaha untuk mengamankan kendali mereka atas urusan kami... Beberapa cabang pemerintahan duplikat kecil tertentu telah dianggap 'tidak perlu', dan selanjutnya dikelola langsung dari Amsterdam."
 mtg_netherlands.21.a: "Jika menurut mereka itu lebih baik..."
 mtg_netherlands.22.t: "[From.GetNameDefCap] Memindahkan Ibu Kota ke Batavia"
 mtg_netherlands.22.d: "Wakil-wakil dari Pemerintahan dalam Pengasingan telah memberitahu kami bahwa pemerintah akan dipindahkan ke Batavia, dan untuk selanjutnya mengatur wilayah jajahan langsung dari sana. Layanan kami tidak lagi diperlukan."
 mtg_netherlands.22.a: "Mungkin kita bisa melayani pemerintahan baru dengan cara lain..."
 mtg_netherlands.23.t: "[From.GetNameDefCap] Menerima Transfer Hindia Timur"
 mtg_netherlands.23.d: "[From.GetNameDefCap] menerima usulan kami untuk mengambil alih seluruh Hindia Timur."
 mtg_netherlands.23.a: "Kedamaian telah terjamin."
 mtg_netherlands.24.t: "[From.GetNameDefCap] Menerima Sumber Daya Hindia Timur"
 mtg_netherlands.24.d: "[From.GetNameDefCap] menerima usulan kami untuk menerima hak eksklusif atas sumber daya Hindia Timur"
 mtg_netherlands.25.t: "[From.GetNameDefCap] Menolak Usulan Kami"
 mtg_netherlands.25.d: "[From.GetNameDefCap] telah memberi tahu kami bahwa proposal kami tidak menarik bagi mereka."
 mtg_netherlands.25.a: "Aneh sekali... Dan memprihatinkan..."
 mtg_netherlands.26.t: "[From.GetNameDefCap] Meminta Perlindungan AS terhadap Hindia Barat"
 mtg_netherlands.26.d: "Pemerintah [HOL.GetAdjective] telah meminta perlindungan kami di Hindia Barat. Mereka takut akan serangan dari pihak ketiga, karena saat ini mereka sedang mengalami masa kelemahan militer, dan mereka berpendapat bahwa mungkin bukan kepentingan terbaik kita jika konflik berada dalam lingkup kepentingan kita."
 mtg_netherlands.26.a: "Kita tidak bisa membiarkan campur tangan asing di Karibia."
 mtg_netherlands.26.b: "Mereka seharusnya tidak berani memberitahukan kepentingan kita."
 mtg_netherlands.27.t: "[From.GetNameDefCap] Menerima Perlindungan Hindia Barat"
 mtg_netherlands.27.d: "[From.GetNameDefCap] telah memutuskan untuk melindungi Hindia Barat. Koloni kita harus aman dari serangan."
 mtg_netherlands.27.a: "Dengan AS di pihak kita, sulit melihat ada pihak yang mengancam mereka."
 mtg_netherlands.28.t: "[From.GetNameDefCap] Menolak Perlindungan Hindia Barat"
 mtg_netherlands.28.d: "[From.GetNameDefCap] telah memberi tahu kami bahwa Hindia Barat bukan urusan mereka, dan mereka tidak ingin memberikan jaminan apa pun mengenai pertahanan koloni kami."
 mtg_netherlands.28.a: "Ini yang paling mengecewakan..."
 mtg_netherlands.29.t: "[From.GetNameDefCap] Meminta Peralatan"
 mtg_netherlands.29.d: "Pemerintah [HOL.GetAdjective] telah menghubungi kami untuk meminta pengiriman peralatan. Mereka memberi tahu kami bahwa tanpa bantuan mereka tidak akan dapat memperlengkapi pasukannya tepat pada waktunya untuk melakukan invasi."
 mtg_netherlands.29.a: "Beri mereka perlengkapan infanteri."
 mtg_netherlands.29.b: "Beri mereka peralatan pendukung."
 mtg_netherlands.29.c: "Beri mereka peralatan artileri."
 mtg_netherlands.29.e: "Mereka harus melakukannya sendiri."
 mtg_netherlands.30.t: "[From.GetNameDefCap] Mengirim Peralatan"
 mtg_netherlands.30.d: "[From.GetNameDefCap] telah mengirimi kami kiriman peralatan untuk membantu remiliterisasi kami."
 mtg_netherlands.30.a: "Bantuan mereka tidak akan dilupakan."
 mtg_netherlands.31.t: "[From.GetNameDefCap] Menolak Mengirim Peralatan"
 mtg_netherlands.31.d: "[From.GetNameDefCap] menolak mengirimkan peralatan kepada kami, mereka menyarankan agar kami memfokuskan industri kami sendiri untuk memproduksi lebih banyak jika kami membutuhkannya."
 mtg_netherlands.31.a: "Mereka melebih-lebihkan kapasitas industri kita..."
 mtg_netherlands.32.t: "[From.GetNameDefCap] Mengusulkan Rencana Staf Gabungan"
 mtg_netherlands.32.d: "Perwakilan [HOL.GetAdjective] telah mengusulkan untuk menyusun rencana staf rahasia, yang memungkinkan kami mengoordinasikan pertahanan jika mereka diserang. Mereka memberi tahu kami bahwa hal ini sangat penting untuk tidak dipublikasikan, karena mereka khawatir pelanggaran terhadap netralitas mereka akan menyebabkan perang..."
 mtg_netherlands.32.a: "Ide yang bagus!"
 mtg_netherlands.32_tt: "§Y[From.GetNameDefCap]§! akan menerima bonus pertahanan divisi di wilayah inti selama 180 hari setelah diserang oleh mayor Eropa Barat."
 mtg_netherlands.32.b: "Jika mereka menginginkan perlindungan kami, mereka harus bergabung dengan kami secara formal."
 mtg_netherlands.33.t: "[From.GetNameDefCap] Menerima Rencana Staf Gabungan"
 mtg_netherlands.33.d: "[From.GetNameDefCap] menerima proposal kami tentang rencana staf gabungan."
 mtg_netherlands.33.a: "Luar biasa!"
 mtg_netherlands.33_tt: "Kami akan menerima bonus pertahanan divisi di wilayah inti selama 180 hari setelah diserang oleh besar Eropa Barat."
 mtg_netherlands.34.t: "[From.GetNameDefCap] Menolak Rencana Staf Gabungan"
 mtg_netherlands.34.d: "[From.GetNameDefCap] telah menolak usulan kami mengenai rencana staf gabungan - jika kami menginginkan bantuan mereka, kami harus memintanya secara resmi."
 mtg_netherlands.34.a: "Itu tidak mungkin."
 mtg_netherlands.35.t: "[From.GetNameDefCap] Permintaan Pertukaran Intelijen"
 mtg_netherlands.35.d: "[From.GetNameDefCap] mengusulkan untuk bertukar intelijen tentang kemungkinan musuh yang mungkin kita hadapi dalam pertempuran saat bertarung bersama."
 mtg_netherlands.35.a: "Itu ide yang bagus!"
 mtg_netherlands.35_tt: "§Y[From.GetNameDefCap]§! akan menerima bonus yang ditargetkan untuk menyerang dan bertahan melawan agresor mereka selama 180 hari setelah diserang oleh mayor Eropa Barat."
 mtg_netherlands.35_tt_2: "Kami akan menerima bonus yang ditargetkan untuk menyerang dan bertahan melawan negara besar Eropa Barat lainnya jika berperang dengan mereka."
 mtg_netherlands.35.b: "Kami tidak bisa memberi mereka informasi intelijen yang telah kami kumpulkan."
 mtg_netherlands.36.t: "[From.GetNameDefCap] Setuju untuk Pertukaran Intelijen"
 mtg_netherlands.36.d: "[From.GetNameDefCap] telah setuju untuk bertukar informasi intelijen tentang kemungkinan musuh yang mungkin kita hadapi dalam pertempuran saat bertarung bersama."
 mtg_netherlands.36.a: "Ini akan sangat membantu pertahanan kita."
 mtg_netherlands.36_tt: "§Y[From.GetNameDefCap]§! akan menerima bonus yang ditargetkan untuk menyerang dan bertahan melawan agresor mereka selama 180 hari setelah berperang dengan negara besar Eropa Barat."
 mtg_netherlands.36_tt_2: "Kami akan menerima bonus yang ditargetkan untuk menyerang dan bertahan melawan agresor kami selama 180 hari setelah diserang oleh negara besar Eropa Barat."
 mtg_netherlands.37.t: "[From.GetNameDefCap] Menolak Pertukaran Intelijen"
 mtg_netherlands.37.desc: "[From.GetNameDefCap] menolak untuk membagikan intelijen mereka."
 mtg_netherlands.37.a: "Sepertinya kita tidak cukup bisa dipercaya..."
 mtg_netherlands.41.t: "[From.GetNameDefCap] Meminta Berbagi Pengetahuan Militer"
 mtg_netherlands.41.d: "[From.GetNameDefCap] meminta agar kami membagikan sebagian pengetahuan militer kami, sehingga memungkinkan mereka membuat kemajuan besar dalam doktrin militer."
 mtg_netherlands.41.a: "[From.GetName] yang kuat adalah [From.GetName] yang berguna."
 mtg_netherlands.41.b: "[From.GetName] yang lemah adalah [From.GetName] yang lebih baik."
 mtg_netherlands.42.t: "[From.GetNameDefCap] Berbagi Pengetahuan Militer"
 mtg_netherlands.42.d: "[From.GetNameDefCap] telah membagikan beberapa doktrin dan pengetahuan militer mereka kepada kami."
 mtg_netherlands.42.a: "Hal ini akan sangat membantu dalam memodernisasi militer kita."
 mtg_netherlands.43.t: "[From.GetNameDefCap] Menolak Berbagi Pengetahuan Militer"
 mtg_netherlands.43.d: "[From.GetNameDefCap] menolak untuk membagikan pengetahuan militernya kepada kami."
 mtg_netherlands.43.a: "Apakah mereka ingin kita tetap lemah?"
 mtg_netherlands.45.t: "Pangeran Bernhard Terlibat Skandal"
 mtg_netherlands.45.d: "Tampaknya Pangeran Bernhard terlibat dalam skandal yang meresahkan. Meskipun sifatnya yang berjiwa bebas kadang-kadang bisa menjadi berkah, tampaknya hal itu juga bisa menjadi kutukan... Pemerintah kini terpaksa mengeluarkan sumber daya yang berharga untuk memuluskan reputasi Pangeran di mata publik."
 mtg_netherlands.45.a: "Sangat disayangkan."
 mtg_netherlands.46.t: "Pangeran Bernhard Memberikan Kesan Baik"
 mtg_netherlands.46.d: "Pangeran Bernhard baru-baru ini memberikan kesan yang luar biasa di depan umum, membangkitkan semangat dan memberikan harapan untuk kemenangan akhir kemanapun dia pergi. Meskipun secara teknis bukan merupakan representasi pemerintah, hal ini tidak menghentikan kami untuk mengambil keuntungan dari keberhasilan yang tidak terduga ini."
 mtg_netherlands.46.a: "Scion of Orange yang sebenarnya."
 mtg_netherlands.47.t: "Pangeran Bernhard Memberikan Teladan yang Baik"
 mtg_netherlands.47.d: "Dalam hubungannya dengan sesama pilot, Pangeran Bernhard telah memberikan contoh yang baik dalam berperilaku dan terbang dalam pertempuran. Dengan mengingat contoh ini, para komandan sudah dapat melihat peningkatan kecil namun nyata dalam kinerja dogfighting di angkasa."
 mtg_netherlands.47.a: "Dia terbang dengan baik."
 mtg_netherlands.48.t: "Pangeran Bernhard Memberikan Contoh Buruk"
 mtg_netherlands.48.d: "Karena terlalu percaya diri, Pangeran Bernhard tampaknya telah memberikan 'beberapa petunjuk' kepada rekan-rekan pilotnya, yang dari sudut pandang taktis bersifat kontraproduktif, dan sering kali berbahaya. Tindakan keberanian yang sembrono telah meningkatkan kerugian."
 mtg_netherlands.48.a: "sembrono..."
 mtg_netherlands.48.b: "Kita harus mendiskreditkan 'petunjuk' Pangeran untuk menyelamatkan situasi."
 mtg_netherlands.49.t: "Pangeran Bernhard Mencampuri Strategi Secara Positif"
 mtg_netherlands.49.d: "Tampaknya Pangeran Bernhard telah banyak ikut campur dalam rencana pertempuran baru-baru ini. Untungnya, tampaknya saran tersebut masuk akal, dan rencana tersebut tampaknya membuahkan hasil yang sangat baik."
 mtg_netherlands.49.a: "Dia memiliki pikiran yang hebat."
 mtg_netherlands.50.t: "Pangeran Bernhard Mencampuri Strategi Secara Negatif"
 mtg_netherlands.50.d: "Tampaknya Pangeran Bernhard telah banyak ikut campur dalam rencana pertempuran baru-baru ini. Dengan menggunakan posisi dan jabatannya, serta dengan keberanian dan kepercayaan dirinya yang biasa, dia membungkam orang-orang yang tidak setuju dengan usulannya. Sejumlah rencana pertempuran kini tampaknya menunjukkan kelemahan mendasar ketika diterapkan."
 mtg_netherlands.50.a: "Sudah terlambat untuk bertindak..."
 mtg_netherlands.50.b: "Jenderal kita harus mengabaikan 'nasihatnya', meskipun itu mencoreng reputasi Pangeran."
 mtg_netherlands.51.t: "Pangeran Bernhard Ingin Mengumpulkan Intelijen"
 mtg_netherlands.51.d: "Intelijen yang ada tidak mencukupi untuk merumuskan rencana pertempuran yang tepat dalam beberapa minggu terakhir, dan ketika mengetahui hal ini dalam rapat staf baru-baru ini, Pangeran Bernhard bersikeras untuk menggunakan koneksi pribadinya di [GER.GetNameDef] untuk memberikan kami informasi intelijen yang sangat kami butuhkan."
 mtg_netherlands.51.a: "Ide yang bagus!"
 mtg_netherlands.51.b: "Kita tidak bisa mengandalkan apa pun yang dia temukan!"
 mtg_netherlands.52.t: "Pangeran Bernhard Mengumpulkan Kecerdasan yang Baik"
 mtg_netherlands.52.d: "Tampaknya informasi intelijen yang dikumpulkan oleh Pangeran sangat berguna di lapangan. Berbagai keberhasilan dapat dikaitkan langsung dengan informasi yang disampaikan dari kontaknya."
 mtg_netherlands.52.a: "Dia adalah penghargaan bagi dinas rahasia."
 mtg_netherlands.53.t: "Pangeran Bernhard Mengumpulkan Kecerdasan Buruk"
 mtg_netherlands.53.d: "Tampaknya informasi intelijen yang dikumpulkan oleh Pangeran bukanlah yang paling akurat... Musuh telah berulang kali menyerang di tempat-tempat yang kita tidak punya pasukan untuk memperkuat titik-titik lain di mana kita memperkirakan serangan akan terjadi."
 mtg_netherlands.53.a: "Itu adalah pertaruhan yang kami ambil..."
 mtg_netherlands.54.t: "Pangeran Bernhard Berusaha Mengorganisir Perlawanan"
 mtg_netherlands.54.d: "Ketika perbincangan dalam rapat staf baru-baru ini beralih ke kurangnya perlawanan di tanah air kami yang diduduki, Pangeran Bernhard tampaknya telah mengambil keputusan sendiri untuk 'menyesuaikannya' secara pribadi. Dia sudah bersiap untuk terjun payung di belakang garis musuh."
 mtg_netherlands.54.a: "Dia harus melakukan apa yang menurutnya benar."
 mtg_netherlands.54.b: "Terlalu berbahaya, kita harus melarangnya!"
 mtg_netherlands.55.t: "Pangeran Bernhard Mengorganisir Perlawanan"
 mtg_netherlands.55.d: "Setelah dievakuasi dengan kapal selam, upaya sang Pangeran sudah bisa dirasakan. Perlawanannya jauh lebih efektif dan lebih aktif."
 mtg_netherlands.55.a: "Sebuah pencapaian yang luar biasa."
 mtg_netherlands.56.t: "Pangeran Bernhard Terluka Mengorganisir Perlawanan"
 mtg_netherlands.56.d: "Dalam usahanya mengorganisir perlawanan, serangan penjajah telah menyebabkan dia terluka. Dia telah dievakuasi dengan kapal selam, tetapi perlu waktu sebelum dia kembali ke kekuatan tempur penuh."
 mtg_netherlands.56.a: "Keberaniannya kali ini tidak dibalas dengan kesuksesan."
 mtg_netherlands.58.t: "Pangeran Bernhard Menyebabkan Perselisihan Diplomatik"
 mtg_netherlands.58.d: "Dalam pertemuan baru-baru ini dengan pejabat asing, tampaknya Pangeran Bernhard telah menciptakan pertikaian diplomatik. Perwakilan [HOL_bernhard_row_target.GetAdjective] menuduhnya ikut campur dalam urusan dalam negeri, dan dengan cara yang tidak terlalu halus."
 mtg_netherlands.58.a: "Ini yang paling memalukan..."
 mtg_netherlands.59.t: "Barisan Diplomatik dengan [From.GetName]"
 mtg_netherlands.59.d: "Pada pertemuan baru-baru ini dengan beberapa pejabat kami, Pangeran Belanda Bernhard terlibat perselisihan diplomatik dengan salah satu perwakilan kami. Tampaknya dia menuduh Pangeran 'mencampuri urusan dalam negeri'."
 mtg_netherlands.59.a: "Ini memprihatinkan... Semoga saja hal ini tidak bertambah parah."
 mtg_netherlands.60.t: "[From.GetNameDef] Meningkatkan Pertikaian Diplomatik"
 mtg_netherlands.60.d: "[HOL.Adjective] pihak berwenang telah meningkatkan pertikaian diplomatik, menuntut dengan cara yang cukup bermusuhan agar kami mengeluarkan permintaan maaf sepenuhnya."
 mtg_netherlands.60.a: "Biarkan mereka membawanya."
 mtg_netherlands.60.b: "Kita harus meredakan ketegangan."
 mtg_netherlands.61.t: "[From.GetNameDef] Meningkatkan Baris Lebih Lanjut"
 mtg_netherlands.61.d: "[From.GetNameDef] belum mundur, dan menolak mengeluarkan permintaan maaf atas tuduhan menghina dan fitnah yang ditujukan kepada Pangeran Bernhard. Apakah pernyataan tersebut benar dan Pangeran telah ikut campur dalam masalah dalam negeri atau tidak, itu tidak penting - kita sekarang telah mencapai titik puncaknya dalam hubungan internasional."
 mtg_netherlands.61.a: "Kalau begitu, peranglah."
 mtg_netherlands.62.t: "[From.GetNameDef] Meredakan Ketegangan"
 mtg_netherlands.62.d: "Pemerintah [From.GetAdjective] kini telah mundur dan mengeluarkan permintaan maaf penuh atas tuduhan yang mereka tujukan kepada Pangeran Bernhard. Apakah dia telah ikut campur dalam urusan internal mereka atau tidak, masih harus dilihat, tapi dia, setidaknya untuk saat ini, memutuskan untuk tidak terlibat dalam hal ini."
 mtg_netherlands.62.a: "Baiklah."
 mtg_netherlands.63.t: "Cadangan Emas Dievakuasi"
 mtg_netherlands.63.d: "Sebelum kami menyerah, ketika pertarungan sudah jelas kalah, kami berhasil melaksanakan rencana kami untuk mengevakuasi cadangan emas kami ke sekutu baru kami. Emas tersebut, yang telah disimpan di kapal dan siap untuk berlayar kapan saja, kini telah tiba dengan selamat di negara tuan rumah kita, dan akan sangat membantu pemerintah kita di pengasingan."
 mtg_netherlands.63.a: "Beruntung kami memiliki pandangan ke depan untuk mempersiapkan hal ini."
 mtg_netherlands.64.t: "Zuiderzee Works Memicu Kemajuan Infrastruktur"
 mtg_netherlands.64.d: "Pengerjaan Flevopolder telah dimulai dengan baik, dan meskipun masih ada waktu bertahun-tahun sebelum proyek ini selesai sepenuhnya, kami sudah dapat memetik hasil dari kerja keras kami.\n\nDalam memperoleh pengalaman praktis dengan proyek reklamasi lahan sebesar ini, para insinyur telah mengembangkan metode baru untuk pembangunan jalan raya, kereta api, dan saluran air. Jika kita berinvestasi pada kemajuan-kemajuan ini, kita dapat memperoleh kemajuan yang signifikan dalam bidang-bidang ini di masa mendatang."
 mtg_netherlands.64.a: "Ini sepertinya ide yang bagus!"
 mtg_netherlands.64.b: "Kami tidak mempunyai dana untuk itu saat ini."
 mtg_netherlands.65.t: "Zuiderzee Works Memicu Kemajuan Industri"
 mtg_netherlands.65.d: "Seiring dengan kemajuan yang terus berlanjut pada Flevopolder, industri yang memasok proyek besar ini juga tumbuh. Para insinyur yang berdedikasi untuk memasok proyek dengan bahan-bahan konstruksi yang diperlukan kini telah memperoleh wawasan baru dalam pengembangan industri dan pembangunan pabrik dan galangan kapal. Jika kita berinvestasi pada kemajuan ini, kita dapat memperoleh kemajuan yang signifikan dalam bidang ini di masa mendatang."
 mtg_germany.1.t: "[From.GetName] Menuntut Kepatuhan"
 mtg_germany.1.d: "Ketika kita baru-baru ini menyerah pada tuntutan perdagangan mereka, [From.GetNameDef] kini telah mengeluarkan ultimatum: kita harus segera bergabung dengan mereka, atau menghadapi kekuatan militer mereka."
 mtg_germany.1.a: "Lalu kita akan bergabung dengan mereka."
 mtg_germany.1.b: "Lalu kita akan menghadapi mereka."
 mtg_germany.2.t: "[From.GetName] Sesuai"
 mtg_germany.2.d: "Pemerintah [From.GetAdjective] telah menanggapi tuntutan kami dengan baik, dan akan memberikan bantuannya dalam perang kami."
 mtg_germany.3.t: "[From.GetName] Menolak Kepatuhan"
 mtg_germany.3.d: "Pemerintah [From.GetAdjective] telah menolak tuntutan kami, meskipun kami mengancam akan menggunakan kekuatan militer."
 mtg_germany.3.a: "Kemudian mereka memilih kematian."
 mtg_exile_government.2.title: "Pemerintahan [From.GetAdjective] di Pengasingan"
 mtg_exile_government.2.desc: "[From.GetLeader] telah secara resmi meminta izin dari pemerintah [Root.GetAdjective] untuk kembali ke [From.GetNameDef] dan membentuk kembali kabinet [From.GetRulingPartyLong] sementara sebagai persiapan untuk perdamaian pasca perang."
 mtg_exile_government.2.a: "Sudah saatnya mereka kembali ke wilayahnya masing-masing."
 mtg_exile_government.2.b: "Waktunya belum tiba."
 mtg_exile_government.3.title: "[From.GetName] Meminta Integrasi Angkatan Laut"
 mtg_exile_government.3.desc: "Pimpinan angkatan laut [From.GetAdjective] telah memberi kami rencana untuk mengintegrasikan angkatan laut kami ke dalam angkatan laut mereka. Mereka berpendapat bahwa, dengan memberikan wewenang kepada perencana angkatan laut [From.GetAdjective] untuk memiliki kendali penuh atas kapal-kapal kita, efektivitas mereka akan meningkat secara drastis dibandingkan dengan tindakan independen mereka saat ini."
 mtg_exile_government.3.a: "Kami setuju."
 mtg_exile_government.3.b: "Kami tidak akan mengabdi di bawah mereka."
 mtg_exile_government.4.title: "[From.GetName] Menerima Integrasi Angkatan Laut"
 mtg_exile_government.4.desc: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui usulan kami, dan selanjutnya kapal mereka akan beroperasi di bawah komando kami."
 mtg_exile_government.5.title: "[From.GetName] Menolak Integrasi Angkatan Laut"
 mtg_exile_government.5.desc: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa angkatan laut mereka tidak akan pernah bertugas di bawah komando kekuatan asing. Mereka bermaksud membantu kita, tapi mereka akan melakukannya secara mandiri."
 mtg_exile_government.5.a: "Mereka menempatkan harga diri mereka di atas kepentingan aliansi."
 mtg_generic.1.title: "[From.GetName] Menegakkan Perubahan Pemerintah"
 mtg_generic.1.desc: "Mengutip kurangnya dukungan elektoral terhadap pemerintahan kita saat ini, [From.GetNameDef] menuntut perubahan dalam politik."
 mtg_generic.1.a: "Kami tidak punya pilihan selain menerima."
 mtg_news.13.desc: "Pemerintah [From.GetAdjective] telah mengumumkan Konferensi Kekaisaran kedua belas. Selama dua bulan ke depan, perwakilan dari pemerintahan [From.GetAdjective] dan Dominion akan berkumpul di London untuk membahas masalah-masalah yang menyangkut seluruh Kekaisaran.\n\nApa dampaknya bagi urusan global masih belum jelas, namun ada kemungkinan diskusi akan mencakup topik Federasi Kekaisaran, yang pembentukannya kemungkinan besar akan berdampak signifikan bagi negara-negara adidaya di dunia."
 mtg_news.13.a: "Nasib Kekaisaran berada di ujung tanduk."
 mtg_news.13.b: "Ada banyak hal yang perlu kita diskusikan."
 mtg_news.13.c: "Kami akan mengikuti perkembangannya dengan cermat."
 mtg_news.14.t: "[From.GetName] Meninjau Kembali Kebijakan Kolonial"
 mtg_news.14.desc: "Pada pidatonya hari ini, [From.GetLeader] mengumumkan perubahan kebijakan kolonial bangsa. \"Mengakui hak semua orang untuk menentukan nasib sendiri, pemerintah [From.GetAdjective] telah memutuskan untuk mengarahkan semua rakyat Kekaisaran menuju kemerdekaan, yang kesimpulannya dimaksudkan untuk terjadi dalam waktu dekat.\""
 mtg_news.14.a: "Itu adalah hal yang benar untuk dilakukan."
 mtg_news.14.b: "Kemerdekaan kita menanti."
 mtg_news.14.c: "Mereka sudah gila."
 mtg_news.14.d: "Semoga omong kosong ini tidak mempengaruhi harta benda kita!"
 mtg_news.15.t: "Dekolonisasi Kerajaan Inggris"
 mtg_news.15.desc: "Pada tengah malam hari ini, penyerahan kedaulatan penuh yang telah lama ditunggu-tunggu bagi berbagai negara yang tunduk pada Kerajaan Inggris telah tercapai. Meskipun pemerintah [From.GetAdjective] mengundang mantan warga negaranya untuk bergabung dengan [From.GetFactionName], banyak yang memilih untuk menempuh jalannya sendiri.\n\nLangkah ini terus menjadi kontroversi di dalam negeri, namun mendapat tepuk tangan meriah dari kaum sosialis di dunia internasional. Kelemahan apa yang diakibatkan oleh hal ini terhadap posisi [From.GetNameDef] di dunia masih harus dilihat, begitu pula dengan situasi negara-negara yang memilih untuk mengambil jalan mereka sendiri."
 mtg_news.15.a: "Masa depan tidak bisa dihindari, jadi kami menjadikannya saat ini."
 mtg_news.15.b: "Akhir dari sebuah era."
 mtg_news.16.t: "[From.GetName] Menolak Peredaan"
 mtg_news.16.desc: "Dalam pernyataan publik hari ini, Perdana Menteri [From.GetAdjective] yang baru [From.GetLeader] telah mengumumkan niat pemerintah baru untuk menjauhi program Penenangan yang telah dipertahankan dengan setia oleh pendahulu mereka. Dengan tegas, [From.GetLeader] dengan jelas menyatakan bahwa tujuan [From.GetNameDef] adalah untuk \"menghentikan gerakan tirani, di mana pun hal itu akan terjadi\".\n\nApakah ancaman perang akan berfungsi untuk menghentikan ekspansionisme negara-negara tertentu masih harus dilihat, namun program perekrutan sudah berjalan dengan baik di [From.GetNameDef], sehingga pernyataan mereka dapat dipercaya."
 mtg_news.16.a: "Waktu untuk menenangkan diri sudah berakhir. Kami sekarang telah menarik garis batasnya."
 mtg_news.16.b: "Inggris telah memberikan tantangan."
 mtg_news.17.t: "[From.GetName] Menegakkan Perjanjian Angkatan Laut"
 mtg_news.17.desc: "Pemerintah [From.GetAdjective] hari ini mengumumkan niatnya untuk menindak pelanggaran Perjanjian Angkatan Laut Washington sejak tahun 1922. Negara penandatangan mana pun yang melanggar rasio kapal modal 5:5:3:1,75:1,75 yang disebutkan di dalamnya kemungkinan akan segera menerima [From.GetAdjective] ultimatum yang menuntut mereka mengurangi jumlah mereka sesuai kuota yang diberikan kepada mereka dalam perjanjian.\n\nSejauh ini, Tanggapan global adalah keraguan bahwa Inggris akan berperang mengenai hal ini."
 mtg_news.17.a: "Tapi kami akan melakukannya."
 mtg_news.17.b: "Kita harus mengharapkan ultimatum mereka kapan saja sekarang..."
 mtg_news.17.c: "Inggris memandang supremasi angkatan laut mereka dengan sangat serius..."
 mtg_news.18.t: "[From.GetName] Mempertimbangkan Intervensi Kontinental"
 mtg_news.18.desc: "Pemerintah [From.GetAdjective] hari ini mengumumkan niatnya untuk \"memulihkan keseimbangan kekuatan di Eropa\", jika perlu dengan menggunakan kekuatan militer. Imperialisme Eropa Kontinental \"merupakan ancaman terhadap keamanan nasional Inggris, dan oleh karena itu harus diatasi\", kata Perdana Menteri [From.GetLeader].\n\nApa sebenarnya maksud dari hal ini masih belum jelas, namun negara tersebut telah melakukan mobilisasi dan tampaknya bersiap untuk perang."
 mtg_news.18.a: "Kita tidak bisa menunggu mereka menjadi lebih kuat lagi."
 mtg_news.18.b: "Mereka datang untuk kita."
 mtg_news.18.c: "Garis telah dilewati."
 mtg_news.19.t: "[From.GetLeader] Memberdayakan Partai Raja"
 mtg_news.19.desc: "Menyusul pernikahan kerajaan antara Raja [From.GetLeader] dan Wallis Simpson, Raja kini telah menunjuk para pemimpin \"Partai Raja\" yang pro-monarkis yang baru dibentuk, Winston Churchill, Oswald Mosley, dan David Lloyd George, untuk membentuk pemerintahan baru setelah negara tersebut lama tidak memiliki pemerintahan.\n\nPendukung [From.GetLeader] memuji pembentukan pemerintahan yang setia, tetapi para kritikus menunjukkan bahwa pemerintahan baru sangat mendukung keinginan Raja sehingga kita bisa menganggap Raja, secara de facto, adalah raja yang absolutis."
 mtg_news.19.a: "Tuhan selamatkan Raja!"
 mtg_news.19.b: "Sebuah langkah ke masa lalu."
 mtg_news.20.t: "[ITA.GetAdjective] Isolasi Diplomatik"
 mtg_news.20.desc: "Hubungan diplomatik antara [ITA.GetNameDef] dan [GER.GetNameDef] telah memburuk baru-baru ini, dengan serangkaian insiden diplomatik kecil yang dimanfaatkan oleh pemerintah [GER.GetAdjective] untuk memicu retorika permusuhan. Meskipun hubungan Italia-Jerman mulai membaik dalam beberapa tahun terakhir, perkembangan baru ini tampaknya secara efektif menghalangi kerja sama di masa depan antara kedua kekuatan Eropa tersebut.\n\nKritik menunjukkan perbaikan yang terjadi bersamaan dalam hubungan Inggris-Jerman, serta 'kenyamanan' isolasi diplomatik [ITA.GetAdjective] ini bagi Inggris, yang mungkin mengindikasikan adanya kesepakatan yang tidak menguntungkan antara kedua negara."
 mtg_news.20.a: "Jerman telah memberikan pelayanan yang luar biasa kepada kami."
 mtg_news.20.b: "Jalur ini memberi kita prospek yang lebih baik."
 mtg_news.20.c: "Intrik jahat Inggris yang patut disalahkan!"
 mtg_news.20.d: "Inggris telah merencanakan..."
 mtg_news.21.t: "Aliansi Inggris-Jerman"
 mtg_news.21.desc: "Pemerintah [ENG.GetAdjective] dan [GER.GetAdjective] telah mengumumkan pakta bantuan militer timbal balik, serta menunjukkan niat mereka untuk \"menghormati kepentingan pihak lain\". Mungkin tidak semua orang akan terkejut melihat perkembangan ini setelah retorika [GER.GetNameDef] yang semakin pro-[ENG.GetAdjective] dalam beberapa bulan terakhir, namun terminologi perjanjian ini telah mengejutkan banyak ahli, dan bahkan menyebabkan beberapa orang mengeluarkan peringatan mengenai dampaknya bagi Eropa."
 mtg_news.21.a: "Tidak ada yang bisa menghalangi kita saat ini."
 mtg_news.21.b: "Lautan telah diamankan."
 mtg_news.21.c: "Kita harus berhati-hati..."
 mtg_news.22.t: "Pakta Inggris-Jerman"
 mtg_news.22.desc: "Pemerintah [ENG.GetAdjective] dan [GER.GetAdjective] telah mengumumkan pakta non-agresi dan non-intervensi. Ketentuan lebih lanjut mencakup klausul yang menunjukkan niat mereka untuk \"menghormati bidang kepentingan pihak lain\". Mungkin tidak semua orang akan terkejut melihat perkembangan ini setelah retorika [GER.GetNameDef] yang semakin pro-[ENG.GetAdjective] dalam beberapa bulan terakhir, namun para kritikus masih memperingatkan apa dampaknya bagi Eropa."
 mtg_news.22.a: "Daratan diamankan."
 mtg_news.22.b: "Sisi kami diamankan."
 mtg_news.22.c: "Mereka membagi-bagi dunia..."
 mtg_news.23.t: "Blackshirts Berorganisasi di [From.GetName]"
 mtg_news.23.desc: "Di bawah kepemimpinan Oswald Mosley, Persatuan Fasis Inggris telah memulai kampanye unjuk rasa yang terorganisir di seluruh negeri, sehingga berupaya meningkatkan jumlah pendukung fasis di seluruh [From.GetNameDef].\n\nNamun, reaksi balasan yang keras dari elemen masyarakat anti-fasis telah menyebabkan sejumlah perkelahian jalanan, dan tidak pasti apakah stabilitas akan tetap terjaga atau apakah kerusuhan politik akan menjadi lebih buruk. B.U.F. Kepemimpinan, pada bagian mereka, telah berjanji untuk tidak berhenti \"sampai mereka melakukan demonstrasi di Downing Street dan menuntut perubahan pemerintahan\"."
 mtg_news.23.a: "Kita akan keluar dari krisis dengan lebih kuat dari sebelumnya."
 mtg_news.23.b: "Mari kita lihat apakah mereka berhasil menghindari perang saudara."
 mtg_news.24.t: "Aliansi Inggris-Italia"
 mtg_news.24.desc: "Dalam sebuah langkah yang belum pernah terjadi sebelumnya, pemerintahan [Root.GetAdjective] yang baru telah menjauhkan diri dari sekutu Perang Besar mereka di [FRA.GetNameDef], dan kini malah mengumumkan aliansi dengan Italia. Pergeseran kesetiaan yang drastis ini telah menyebabkan gelombang kejutan di seluruh kancah diplomatik Eropa, dan terutama menimbulkan kecurigaan di [FRA.GetNameDef] dan [GER.GetNameDef], yang terakhir ini telah menjadi sasaran retorika permusuhan berulang kali dari [From.GetLeader]."
 mtg_news.24.a: "Lagipula orang Prancis tidak berguna."
 mtg_news.24.b: "Kami kaum fasis sejati harus berdiri bersama."
 mtg_news.24.c: "Jangan pernah mempercayai Rosbif!"
 mtg_news.24.d: "Kami protes!"
 mtg_news.24.e: "Ini adalah manuver diplomatik Inggris yang signifikan..."
 mtg_news.25.t: "Gibraltar Kembali ke Spanyol Nasionalis"
 mtg_news.25.desc: "[Root.GetAdjective] dan pemerintah Spanyol hari ini mengeluarkan pernyataan bersama, mengumumkan kembalinya Gibraltar ke tangan Nasionalis Spanyol, sekaligus memperkuat perjanjian kerja sama militer baru antara kedua kekuatan tersebut."
 mtg_news.25.a: "Itu adalah perdagangan yang diperlukan."
 mtg_news.25.b: "Hadiahnya tidak sia-sia."
 mtg_news.25.c: "Perkembangan yang menarik..."
 mtg_news.26.t: "Perang Saudara Imperialis di [From.GetName]"
 mtg_news.26.desc: "Unsur-unsur Pro-Imperial di [From.GetName] telah bangkit dalam pemberontakan terbuka melawan pemerintah, menuntut kembalinya negara tersebut sebagai Dominion Kerajaan Inggris. Situasi kini telah meningkat menjadi perang saudara yang berkepanjangan, dan pemerintah [From.GetAdjective] menuduh [ENG.GetNameDef] memasok para pemberontak dengan senjata modern dan amunisi yang mereka perlukan, namun pemerintah [ENG.GetAdjective] dengan tegas membantahnya."
 mtg_news.26.a: "Mereka bisa menuduh kita sesuka mereka."
 mtg_news.26.b: "Campur tangan Inggris terkutuk!"
 mtg_news.26.c: "Mereka datang untuk kita semua."
 mtg_news.26.d: "Taktik licik..."
 mtg_news.27.t: "[ENG.GetName] Sekutu [From.GetAdjective] Loyalis Kekaisaran"
 mtg_news.27.desc: "Pemerintah [ENG.GetAdjective] hari ini mengumumkan bahwa mereka akan melindungi pemerintahan Loyalis Kekaisaran yang masih muda di [From.GetNameDef]. [From.GetNameDefCap] saat ini sedang dalam pergolakan perang saudara, dan hal ini nampaknya menunjukkan bahwa [ENG.GetNameDef] selanjutnya akan mengambil bagian yang lebih aktif dalam gejolak politik internal negara."
 mtg_news.27.a: "Kita harus menyambut mereka kembali."
 mtg_news.27.b: "Beraninya mereka?!"
 mtg_news.27.c: "Kita harus berdiri bersama melawan Inggris."
 mtg_news.27.d: "Taktik yang licik."
 mtg_news.28.t: "[From.GetName] Dikirim ke [ENG.GetName]"
 mtg_news.28.desc: "Menanggapi ultimatum [ENG.GetAdjective] yang menuntut agar unit militer [ENG.GetAdjective] diperbolehkan melewati wilayah mereka, serta kendali luas atas urusan dalam negeri mereka, pemerintah [From.GetAdjective] kini mengumumkan akan menyerah. [ENG.GetAdjective] pejabat sudah berada di lokasi untuk melakukan pengawasan terhadap urusan dalam negeri negara."
 mtg_news.28.a: "Mereka membuat keputusan yang tepat."
 mtg_news.28.b: "Kami tidak punya pilihan..."
 mtg_news.28.c: "Kami dipaksa."
 mtg_news.28.d: "Inggris telah mempersenjatai mereka dengan kuat..."
 mtg_news.29.t: "[From.GetName] Menolak [ENG.GetAdjective] Ultimatum"
 mtg_news.29.desc: "Pemerintah [From.GetAdjective] telah menolak ultimatum [ENG.GetAdjective] yang menuntut agar unit militer [ENG.GetAdjective] bisa lewat secara bebas melalui wilayah mereka, serta kendali luas atas urusan dalam negeri mereka. [From.GetLeader] telah menyatakan bahwa pemerintah sepenuhnya mengharapkan [ENG.GetAdjective] pembalasan, dan kini telah menempatkan militer mereka dalam siaga tinggi."
 mtg_news.29.a: "Dan mereka takut akan hal itu."
 mtg_news.29.b: "Biarkan mereka datang."
 mtg_news.29.c: "Mereka tidak memberi kami alternatif lain."
 mtg_news.29.d: "Inggris berada di jalur perang."
 mtg_news.30.t: "[From.GetName] Bergerak untuk Mengamankan Dominasi"
 mtg_news.30.desc: "Tindakan baru-baru ini yang dilakukan oleh pemerintah [From.GetAdjective] telah memperjelas bahwa mereka semakin menekan otonomi Dominion. Dengan pasukan yang dipersiapkan untuk dikirim ke luar negeri, pengerahan unit militer pun diperkirakan dapat digunakan untuk menghalangi gagasan untuk melepaskan diri dari pemerintahan baru."
 mtg_news.30.a: "Mereka sebaiknya tidak mendapatkan ide-ide lucu..."
 mtg_news.30.b: "Mereka datang untuk kita."
 mtg_news.30.c: "Tindakan drastis..."
 mtg_news.31.t: "[ENG.GetName] Memberlakukan Darurat Militer di [From.GetName]"
 mtg_news.31.desc: "Sebelumnya hari ini, unit militer [ENG.GetAdjective] ditempatkan di seluruh [From.GetNameDef], dan pemerintah [ENG.GetAdjective] telah mengumumkan darurat militer di wilayah kekuasaannya. Pemerintahan daerah telah ditangguhkan, dan urusan sehari-hari, setidaknya untuk saat ini, ditangani langsung dari London.\n\nMasih belum jelas berapa lama situasi baru ini akan berlangsung, namun para kritikus telah menyebut posisi [ENG.GetAdjective] 'tidak dapat dipertahankan' dalam jangka panjang."
 mtg_news.31.a: "Ini adalah langkah yang perlu."
 mtg_news.31.b: "Beraninya mereka?!"
 mtg_news.31.c: "Kami punya hak!"
 mtg_news.31.d: "Inggris semakin menekan Dominion mereka."
 mtg_news.32.t: "[ENG.GetName] Pasang Loyalis [From.GetAdjective] Pemerintah"
 mtg_news.32.desc: "Dalam sebuah langkah yang belum pernah terjadi sebelumnya [ENG.GetNameDef] telah mengadakan pemilu baru di [From.GetNameDef], yang menghasilkan kemenangan telak bagi partai loyalis pro-[ENG.GetAdjective].\n\nKritikus mempertanyakan hasil pemilu, dan berpendapat bahwa mungkin telah terjadi kecurangan pemilu yang meluas. Tuduhan ini telah ditolak mentah-mentah oleh pemerintahan [ENG.GetAdjective], sementara pemerintahan baru [From.GetAdjective] sudah berkuasa dan menerapkan kebijakan yang jelas-jelas pro-Inggris."
 mtg_news.32.a: "Sudah selesai."
 mtg_news.32.b: "Penipuan! FRAU-- Ahem. Sungguh hasil yang luar biasa dari pemilu yang demokratis dan bebas."
 mtg_news.32.c: "Apakah kita sendirian melihat tirani menimpa kita?!"
 mtg_news.32.d: "Ini adalah masalah internal."
 mtg_news.33.t: "[From.GetName] Mengakui Serikat Pekerja"
 mtg_news.33.desc: "Seolah-olah dalam upaya untuk mendapatkan lebih banyak dukungan bagi program persenjataan mereka, pemerintah [From.GetAdjective] kini telah melakukan pembicaraan dengan Serikat Pekerja, mengusulkan untuk memberikan konsesi sebagai imbalan atas dukungan mereka. Hal ini diperkirakan akan meningkatkan pengaruh sosialis terhadap pemerintah."
 mtg_news.33.a: "Kami melakukan apa yang harus kami lakukan."
 mtg_news.33.b: "Mengenai perkembangan..."
 mtg_news.33.c: "Berita bagus untuk pekerja [From.GetAdjective]!"
 mtg_news.34.t: "[ENG.GetName] Mengusir Keluarga Kerajaan"
 mtg_news.34.desc: "Dalam apa yang disebut sebagai keputusan 'murah hati', seluruh Keluarga Kerajaan [ENG.GetAdjective] telah diusir dari negara tersebut. Tidak ada komentar lebih lanjut yang diberikan oleh juru bicara pemerintah, atau oleh perwakilan Keluarga Kerajaan sendiri. Tadi hari, mereka tiba di [From.GetNameDef] dan meminta suaka di sana yang sudah diterima."
 mtg_news.34.a: "Selamat jalan."
 mtg_news.34.b: "Tirani sosialis disingkapkan agar dapat dilihat semua orang."
 mtg_news.34.c: "Kemenangan perjuangan kelas!"
 mtg_news.35.t: "Hilangnya [ENG.GetAdjective] Keluarga Kerajaan"
 mtg_news.35.desc: "Seminggu telah berlalu sejak penampilan publik terakhir dari anggota Keluarga Kerajaan [From.GetAdjective], banyak rumor yang beredar tentang kemungkinan nasib mereka. Pemerintah telah menolak untuk mengomentari masalah ini sepenuhnya, dan telah mulai menindak laporan media apa pun yang dapat menarik perhatian terhadap masalah ini.\n\nKeheningan pemerintah semakin terlihat mengingat akun-akun anonim yang dibuat oleh individu-individu tertentu yang mengaku sebagai anggota rumah tangga Keluarga Kerajaan, berbicara tentang \"melihat Keluarga Kerajaan diusir secara paksa dari Istana Buckingham oleh pria-pria bertopeng\" beberapa minggu yang lalu."
 mtg_news.35.a: "Itu harus dilakukan."
 mtg_news.35.b: "Kaum sosialis tidak menghormati kehidupan manusia!"
 mtg_news.35.c: "Mereka mendapatkan haknya."
 mtg_news.36.t: "Alternatif Komunis Inggris"
 mtg_news.36.desc: "[From.GetNameDefCap] telah mengumumkan 'alternatif komunis' baru terhadap Komintern, dimana, dalam kata-kata [From.GetLeader] \"semua negara sosialis yang menginginkan kemerdekaan dari Moskow dapat bergabung dengan kami dalam membela hak-hak Pekerja di seluruh dunia\". Masih harus dilihat apakah faksi sosialis baru ini akan mampu berdiri teguh melawan Moskow."
 mtg_news.36.a: "Kami telah membuka tangan terhadap rekan-rekan kami."
 mtg_news.36.b: "Mereka adalah pengkhianat sosialisme sejati!"
 mtg_news.36.c: "Perpecahan lain terjadi di kalangan The Reds."
 mtg_news.37.t: "[From.GetName] Menuntut Dekolonisasi"
 mtg_news.37.desc: "Pemerintah [From.GetAdjective] telah mengeluarkan ultimatum kepada kekuatan kolonial lainnya, menuntut penarikan segera dari koloni mereka dan memberikan kemerdekaan penuh, seperti yang telah dilakukan oleh Inggris sendiri. Mereka telah mengindikasikan kesediaannya untuk mendukung tuntutan tersebut dengan menggunakan kekuatan militer, jika diperlukan."
 mtg_news.37.a: "Dan kami akan melakukannya."
 mtg_news.37.b: "Kami harus mengambil keputusan..."
 mtg_news.37.c: "Inggris sedang mengembangkan kekuatan globalnya."
 mtg_news.38.t: "[From.GetName] Tantangan [SOV.GetAdjective] Sosialisme"
 mtg_news.38.desc: "[From.GetNameDefCap] telah menuduh [SOV.GetNameDef] \"mengkhianati nilai-nilai yang dipegang teguh Marx\", dan sekarang mengumumkan bahwa mereka telah memutuskan untuk \"membersihkan sosialisme dari para pengkhianatnya\". Negara ini telah menempatkan militernya pada kewaspadaan tertinggi, karena apa yang tampaknya hanya sebuah tantangan terhadap kepemimpinan sosialisme tampaknya akan berkobar menjadi perang skala penuh."
 mtg_news.38.a: "Kami adalah sosialis sejati!"
 mtg_news.38.b: "Biarkan mereka mencoba, pengkhianat!"
 mtg_news.38.c: "The Reds terpaksa melakukan pertikaian..."
 mtg_news.39.t: "[From.GetName] Menantang Fasisme"
 mtg_news.39.desc: "Retorika baru-baru ini dari pemerintah [From.GetAdjective] semakin bermusuhan dan anti-fasis. Bersamaan dengan disahkannya berbagai undang-undang anti-fasis, hal ini diyakini merupakan tanda bahwa negara tersebut sedang bersiap untuk melakukan konfrontasi militer dengan musuh ideologisnya, dalam waktu yang tidak lama lagi."
 mtg_news.39.a: "Memang benar."
 mtg_news.39.b: "Kami tidak takut pada mereka."
 mtg_news.39.c: "Perang sedang terjadi."
 mtg_news.40.t: "[From.GetName] Menantang Kapitalisme"
 mtg_news.40.desc: "Retorika baru-baru ini dari pemerintah [From.GetAdjective] semakin bermusuhan dan anti-kapitalis. Bersamaan dengan disahkannya berbagai undang-undang anti-Amerika, hal ini diyakini merupakan tanda bahwa negara tersebut sedang bersiap untuk melakukan konfrontasi militer dengan musuh ideologisnya di Dunia Baru, dalam waktu yang tidak lama lagi."
 mtg_news.40.a: "Kami datang untuk mereka."
 mtg_news.40.b: "Biarkan mereka mencoba."
 mtg_news.40.c: "Itu merupakan upaya yang berani."
 mtg_news.41.t: "Perang Saudara di [From.GetName]"
 mtg_news.41.desc: "Ketegangan yang meningkat yang dipicu oleh demonstrasi Kaus Hitam yang terus menerus di [From.GetNameDef] kini telah mencapai titik didih. Serangkaian perkelahian jalanan yang terjadi akibat aksi unjuk rasa ini semakin tidak terkendali, dan kini telah meningkat hingga ke titik di mana militer ikut terlibat.\n\nSementara Angkatan Laut Kerajaan Inggris tetap setia kepada pemerintahan resmi [From.GetAdjective], situasinya sangat berbeda di kalangan tentara, dengan berbagai unit menjanjikan dukungan baik kepada loyalis maupun fasis. Dengan terbentuknya pemerintahan fasis sementara, konflik berkepanjangan di Kepulauan Inggris akan terjadi."
 mtg_news.41.a: "Kami akan menang."
 mtg_news.41.b: "Inggris menghancurkan diri mereka sendiri..."
 mtg_news.42.t: "Perang Saudara di [From.GetName] Berakhir"
 mtg_news.42.desc: "Dengan jatuhnya pemerintahan demokratis [From.GetAdjective], situasi di Kepulauan Inggris menjadi stabil. Ketika pemerintah menolak untuk melarikan diri ke Dominion dalam menghadapi kemajuan fasis, Angkatan Laut Kerajaan Inggris kini telah menjanjikan dukungannya kepada satu-satunya pemerintahan yang tersisa. Masih belum pasti apakah loyalitas ini akan dianggap remeh, atau apakah unsur-unsur yang tidak loyal kini akan disingkirkan dari jajarannya."
 mtg_news.42.a: "Kemenangan akhirnya!"
 mtg_news.42.b: "Mereka telah melemahkan diri mereka sendiri secara signifikan..."
 mtg_news.43.t: "Perang Saudara Komunis di [From.GetName]"
 mtg_news.43.desc: "Elemen-elemen dalam partai sosialis [From.GetAdjective] telah berulang kali menyuarakan keprihatinan mengenai penolakan pemerintah untuk melakukan dekolonisasi. Kini, karena muak dengan kelambanan pemerintah dalam masalah ini, mereka mulai menuduh pemerintah melakukan \"pengkhianatan tingkat tinggi terhadap nilai-nilai Sosialisme\", dan mengangkat senjata untuk menggulingkannya. Upaya kudeta kini telah meningkat dengan cepat, dan tidak dapat disangkal bahwa negara ini berada dalam cengkeraman perang saudara yang berkepanjangan."
 mtg_news.43.a: "Kami akan mengembalikan persatuan pada bangsa kami!"
 mtg_news.43.b: "Mereka telah dituduh berbohong!"
 mtg_news.43.c: "The Reds saling menyerang..."
 mtg_news.44.t: "Perang Saudara India"
 mtg_news.44.desc: "Sebagai akibat dari cara [RAJ.GetNameDef] yang tidak terorganisir dengan baik dalam memperoleh kemerdekaan, ketegangan agama di anak benua tersebut telah meningkat ke permukaan sejak saat itu. Sekarang, hal ini terjadi secara tiba-tiba dan tiba-tiba dengan bentrokan kekerasan di kota-kota besar di Barat Laut dan Timur Laut negara tersebut.\n\nPemerintah lokal terbukti tidak berhasil menjaga situasi agar tidak semakin memburuk, dan sekarang milisi dan bahkan unit militer telah bersatu di belakang Liga Muslim, mendeklarasikan kemerdekaan bagi Pakistan, serta niat mereka untuk melawan India sampai mereka mengamankannya."
 mtg_news.44.a: "Kami akan memperoleh kemerdekaan kami atau mati saat mencoba!"
 mtg_news.44.b: "Kita tidak akan melihat benua ini terbelah dua!"
 mtg_news.44.c: "Apakah ini salah kita?"
 mtg_news.44.d: "Inggris seharusnya melihat hal ini terjadi..."
 mtg_news.45.t: "Perang Saudara Pakistan"
 mtg_news.45.desc: "Kelahiran [From.GetNameDefCap] yang penuh kekerasan terus menyebabkan ketidakstabilan di negara yang masih baru ini, dengan milisi bersenjata yang memegang kekuasaan besar terutama di daerah-daerah terpencil. Perbedaan budaya antara berbagai populasi Muslim di India Barat Laut dan Timur Laut juga menjadi semakin jelas, dengan sikap meremehkan orang-orang Pakistan Barat terhadap rekan-rekan mereka di Timur yang menyulut kemarahan yang masih belum sepenuhnya tenang sejak perang saudara.\n\nSekarang, Timur telah mengangkat senjata lagi, mengklaim \"sudah cukup\", dan bahwa mereka, juga, kini menginginkan kemerdekaan penuh."
 mtg_news.45.a: "Para pemula kecil!"
 mtg_news.45.b: "Mereka tidak akan menahan kita lagi!"
 mtg_news.45.d: "Ini semua bisa dengan mudah dicegah..."
 mtg_news.46.t: "[From.GetName] Memindahkan Pemerintahan ke Batavia"
 mtg_news.46.desc: "Dengan hilangnya wilayah benua Eropa, pemerintah [From.GetAdjective] kini memutuskan untuk pindah ke kota Batavia di pulau Jawa, Indonesia. Pemerintah kolonial di sana harus digantikan, dan sebaliknya pemerintah [From.GetAdjective] yang mengelolanya secara langsung.\n\nDari basis kolonial ini, mereka bersumpah untuk melanjutkan perang melawan agresor mereka."
 mtg_news.46.a: "Kami akan terus berjuang!"
 mtg_news.46.b: "Mereka menantang."
 mtg_news.47.t: "[From.GetName] Melanjutkan Pekerjaan Zuiderzee"
 mtg_news.47.desc: "Proyek reklamasi lahan skala besar telah dilakukan di [From.GetNameDef], melanjutkan serangkaian proyek yang secara kolektif dikenal sebagai \"Pekerjaan Zuiderzee\". Setelah penutupan IJsselmeer dengan Afsluitdijk, reklamasi Wieringermeer dan Noordoostpolder, proyek ini kini fokus pada reklamasi Flevopolder, wilayah terluas yang belum direklamasi dari laut.\n\nMeskipun keseluruhan proyek pasti akan memakan waktu bertahun-tahun, pengeringan telah berlangsung cukup lama sehingga wilayah yang lebih kecil kini sudah dapat diakses, dan manfaatnya bagi [From.GetAdjective] industri terlihat jelas."
 mtg_news.47.a: "Ini akan menjadi Keajaiban Dunia modern."
 mtg_news.47.b: "Sebuah pertaruhan yang berani."
 mtg_news.48.t: "[JAP.GetName] Memperoleh Hindia Timur"
 mtg_news.48.desc: "Pemerintah [From.GetAdjective] dan [JAP.GetAdjective] telah mengeluarkan pernyataan bersama yang mengumumkan penyerahan penuh Hindia Belanda ke kendali [JAP.GetAdjective]. Penyesuaian teritorial yang drastis di Timur Jauh ini akan segera berlaku, meskipun mendapat protes dari berbagai pihak ketiga seperti Amerika dan Inggris."
 mtg_news.48.a: "Itu adalah kejahatan yang perlu dilakukan."
 mtg_news.48.b: "Kejutan yang sangat disambut baik."
 mtg_news.48.c: "Mengenai."
 mtg_news.49.t: "[JAP.GetName] Memperoleh Sumber Daya Hindia Timur"
 mtg_news.49.desc: "Pemerintah [From.GetAdjective] dan [JAP.GetAdjective] telah mengeluarkan pernyataan bersama yang mengumumkan kesepakatan perdagangan eksklusif antara kedua negara. Sejak saat itu, Jepang akan diberikan hak eksklusif atas semua sumber daya yang dieksploitasi di kepulauan Indonesia.\n\nPerjanjian perdagangan yang belum pernah terjadi sebelumnya ini tidak diragukan lagi merupakan upaya pemerintah [From.GetAdjective] untuk mencegah ancaman apa pun dari Jepang, meskipun hal ini telah menyebabkan kekhawatiran besar di antara negara-negara lain yang berkepentingan seperti [USA.GetNameDef] dan [ENG.GetNameDef]."
 mtg_news.49.a: "Kompromi yang bisa diterima."
 mtg_news.49.b: "Kami hanya peduli pada sumber dayanya."
 mtg_news.49.c: "Mereka bersekutu satu sama lain."
 mtg_news.50.t: "[From.GetName] Mendekolonisasi"
 mtg_news.50.desc: "Pemerintahan [From.GetAdjective] yang baru dengan cepat menepati janji kampanyenya untuk memberikan kemerdekaan kepada berbagai daerah yang masih termasuk wilayah jajahan [From.GetAdjective].\n\nSegera, negara-negara ini akan menerima kemerdekaan total, dan Tentara Kerajaan Hindia Belanda (KNIL) akan kembali memperkuat tentara [From.GetAdjective] benua Eropa."
 mtg_news.50.a: "Kami sekarang mungkin fokus pada daratan."
 mtg_news.50.b: "Mereka benar-benar menganjurkan kebebasan."
 mtg_news.51.t: "Penciptaan Negara Penyangga Benelux"
 mtg_news.51.desc: "Dengan lemahnya negara-negara Luksemburg dan Belgia saat ini, [ENG.GetNameDef] kini tampaknya telah menyerah pada seruan [From.GetAdjective] untuk memulihkan \"negara penyangga\" pasca-Napoleon di negara-negara dataran rendah. Inggris telah menyetujui pemberian wilayah yang dibebaskan secara langsung kepada [From.GetNameDef]. Apakah Belanda akan lebih beruntung dalam menjaga stabilitas internal kali ini masih harus dilihat."
 mtg_news.51.a: "Kami akan melakukannya."
 mtg_news.51.b: "Beberapa manuver diplomatik [From.GetAdjective] yang luar biasa."
 mtg_news.52.t: "[USA.GetName] Melindungi [From.GetAdjective] Hindia Barat"
 mtg_news.52.desc: "Atas permintaan pemerintah [From.GetAdjective], [USA.GetNameDef] telah mengeluarkan proklamasi yang menyatakan bahwa mereka menganggap Hindia Barat Belanda sebagai bagian integral dari wilayah kepentingan mereka. Mereka telah bersumpah untuk melindungi wilayah tersebut dari siapa pun yang mungkin menyerang pemilik sahnya."
 mtg_news.52.a: "Barat aman."
 mtg_news.52.b: "Lebih baik [From.GetAdjective] daripada orang lain."
 mtg_news.52.c: "Mereka menganggap serius \"bidang minat\" mereka."
 mtg_news.53.t: "Formulir Benelux"
 mtg_news.53.desc: "Di bawah kepemimpinan pemerintahan [From.GetAdjective], aliansi baru yang terdiri dari berbagai Negara Rendah telah terbentuk. Para pemimpin mereka telah menyuarakan harapan bahwa aliansi yang masih baru ini \"akan tetap netral dalam menghadapi krisis dunia yang semakin meningkat\", dan bahwa negara-negara lain pada akhirnya dapat bergabung untuk memperkuat kekuatan \"blok netralitas dan rasionalitas dalam menghadapi kegilaan yang mencengkeram dunia saat ini\"."
 mtg_news.53.a: "Kami menyambut semua orang yang sudah bosan dengan pertengkaran Kekuatan Besar."
 mtg_news.53.b: "Inisiatif yang berani."
 mtg_news.54.t: "Bentuk Uni Eropa"
 mtg_news.54.desc: "Sejak pembentukan Benelux, pemerintah Negara-Negara Rendah telah berupaya untuk menarik minat lebih lanjut terhadap \"blok kewarasan yang kuat dan netral\". Kini, sejumlah negara baru telah diundang untuk bergabung dalam aliansi ini, dan untuk mengakomodasi masuknya negara-negara anggota baru ini, telah diputuskan untuk mengganti namanya menjadi \"Uni Eropa\"."
 mtg_news.54.a: "Kami semakin kuat."
 mtg_news.54.b: "Persatuan tumbuh."
 MTG_naval_treaty.1.t: "[From.GetNameDefCap] ingin membatasi Persenjataan Angkatan Laut"
 MTG_naval_treaty.1.desc: "Upaya kami baru-baru ini untuk membangun armada yang lebih besar telah mendorong kami menjadi salah satu kekuatan angkatan laut utama. [From.GetNameDefCap] jelas merasa terancam dengan perluasan armada kami dan telah mengirimkan delegasi ke ibu kota kami untuk merundingkan perjanjian pembatasan senjata bersama.\n\nPerjanjian tersebut akan mencontoh Perjanjian Angkatan Laut London Kedua dan membatasi ukuran kapal modal kami serta membatasi ukuran keseluruhan armada kapal modal kami agar tidak melebihi armada [ENG.GetNameDef]."
 MTG_naval_treaty.1.a: "Persyaratan ini dapat diterima."
 MTG_naval_treaty.1.b: "Kami tidak akan dibatasi dalam ambisi kami!"
 MTG_naval_treaty.2.t: "[From.GetNameDefCap] menandatangani Perjanjian Perlucutan Senjata Angkatan Laut"
 MTG_naval_treaty.2.desc: "Pemerintah [From.GetLeader] telah menyetujui pembatasan bersama mengenai persenjataan kembali angkatan laut. Ketika tinta perjanjian hampir habis, Komisi Pengendalian telah mulai bekerja untuk memastikan bahwa semua konstruksi baru mematuhi batasan perjanjian."
 MTG_naval_treaty.2.a: "Perlombaan senjata lainnya dapat dihindari."
 MTG_naval_treaty.3.t: "[From.GetNameDefCap] menghentikan negosiasi"
 MTG_naval_treaty.3.desc: "Delegasi dari [From.GetNameDef] telah keluar dari perundingan, dengan alasan \"penolakan sepenuhnya oleh pihak lain untuk mengakui realitas politik dan strategis yang dihadapi [From.GetNameDef].\""
 MTG_naval_treaty.3.a: "\"Shambles\" adalah kata yang sangat kuat."
 MTG_naval_treaty.4.t: "[From.GetNameDefCap] mengeluarkan peringatan keras"
 MTG_naval_treaty.4.desc: "Duta Besar [From.GetAdjective] untuk negara kita hari ini meminta [This.GetLeader] untuk menyampaikan pesan dari pemerintahnya. Mereka menyaksikan ekspansi angkatan laut kita yang terus berlanjut dengan penuh keprihatinan, dan sekarang menganggap angkatan laut kita sebagai \"faktor yang mengganggu stabilitas di kawasan\".\n\nJika kita melanjutkan program perluasan angkatan laut yang ada saat ini, lanjut catatan tersebut, pemerintah [From.GetAdjective] akan terpaksa mempertimbangkan semua tindakan yang mungkin dilakukan."
 MTG_naval_treaty.4.a: "Kami lebih suka tidak mencari tahu apa saja tindakan-tindakan tersebut."
 MTG_naval_treaty.4.b: "Gertakan transparan."
 MTG_naval_treaty.5.t: "[From.GetNameDefCap] berkomitmen untuk perlucutan senjata"
 MTG_naval_treaty.5.desc: "Pesan tegas kami kepada pemerintah [From.GetAdjective] ternyata membuahkan hasil yang diinginkan. Setelah diskusi internal yang panjang sepanjang malam, duta besar kami diyakinkan oleh [From.GetLeader], di hadapan menteri angkatan laut, bahwa kabinet telah menyetujui pengurangan belanja angkatan laut yang akan memaksa [From.GetNameDef] untuk membuang sejumlah kapal besar dan hanya mendanai penggantian kapal-kapal yang sudah usang di masa depan."
 MTG_naval_treaty.5.a: "Sekarang mari kita lihat apakah mereka menindaklanjutinya."
 MTG_naval_treaty.6.t: "[From.GetNameDefCap] menolak Peringatan"
 MTG_naval_treaty.6.desc: "Pertemuan dengan Menteri Luar Negeri [From.GetNameDef] tidak berjalan semulus yang kita harapkan. Menurut duta besar kami, Pemerintah [From.GetAdjective] telah memutuskan untuk menolak peringatan apa pun yang mungkin kami keluarkan. Oleh karena itu, ia diberikan sebuah catatan sederhana yang menyatakan bahwa pemerintah [From.GetLeader] saat ini tidak yakin ada sesuatu yang perlu dibicarakan."
 MTG_naval_treaty.6.a: "Mari kita lihat seberapa baik kapal [From.GetAdjective] mengapung tanpa baja [Root.GetAdjective]."
 MTG_naval_treaty.6.b: "Perjanjian hanya sekuat kemauan untuk mempertahankannya..."
 MTG_naval_treaty.7.t: "[From.GetNameDefCap] meninggalkan Perjanjian Angkatan Laut"
 broken_naval_treaty_opinion_mod: "Sanksi Perjanjian yang Diabaikan"
 MTG_naval_treaty.7.desc: "[From.GetLeader] hari ini mengumumkan bahwa [From.GetNameDef] tidak lagi menganggap dirinya terikat oleh perjanjian angkatan laut yang telah dia tandatangani. Situasi dunia, katanya, membuat pilihan tersebut tidak bisa dihindari. [From.GetNameDefCap] tampaknya telah menerima laporan yang dapat dipercaya bahwa beberapa negara tetangga telah memulai program ekspansi angkatan laut yang agresif yang mengancam kepentingan [From.GetAdjective] yang sah di wilayah tersebut.\n\nAngkatan Laut [From.GetAdjective] menolak mengomentari rumor bahwa beberapa kapal yang saat ini sedang dibangun telah direncanakan tanpa mempertimbangkan batasan perjanjian."
 MTG_naval_treaty.7.a: "Kita harus meninjau kembali partisipasi kita dalam perjanjian tersebut."
 MTG_naval_treaty.8.t: "Berakhirnya Perjanjian Angkatan Laut London"
 MTG_naval_treaty.8.desc: "Dengan hanya dua negara yang masih mematuhi Perjanjian Angkatan Laut London, hanya masalah waktu sebelum salah satu dari mereka meninggalkan perjanjian tersebut, sehingga mengakhiri perjanjian tersebut sepenuhnya. Pemerintah [From.GetNameDef] jelas memutuskan bahwa perjanjian tersebut tidak lagi efektif sesuai dengan tujuan yang dinyatakan dan bahwa membatasi persenjataan angkatan laut mereka merupakan ancaman terhadap keamanan nasional.\n\nBanyak ahli di seluruh dunia kini memperkirakan peningkatan pesat dalam anggaran angkatan laut karena banyak negara ingin menebus pembatasan perjanjian yang ketat selama beberapa dekade."
 MTG_naval_treaty.8.a: "Sebuah ide sudah gagal sejak awal."
 MTG_naval_treaty.8.b: "Kami membuat pilihan yang tepat."
 MTG_naval_treaty.8.c: "Apakah ini awal dari Balapan Dreadnought yang baru?"
 MTG_naval_treaty.9.t: "Perjanjian Angkatan Laut London Kedua ditandatangani"
 MTG_naval_treaty.9.desc: "Delegasi dari Inggris, Perancis, Italia, Jepang dan Amerika bertemu pada bulan Desember 1935 untuk membahas pembaruan perjanjian Angkatan Laut London Pertama, yang membatasi jumlah dan ukuran kapal penjelajah dan kapal selam. Negosiasi menjadi cukup panas sehubungan dengan perang Italia di Ethiopia dan keinginan Jepang untuk dianggap setara dengan Inggris dan AS.\n\nDengan berakhirnya negosiasi, negara-negara penandatangan telah menyepakati batasan ukuran kapal perang dan kapal induk dengan harapan dapat mencegah perlombaan senjata yang merusak."
 MTG_naval_treaty.9.a: "Ini akan menjaga perdamaian lebih baik daripada Kapal Perang Super mana pun!"
 MTG_naval_treaty.9.b: "Mengapa mereka membatasi diri seperti ini?"
 MTG_naval_treaty.9.c: "Kalau begitu, lebih banyak uang untuk tentara."
 MTG_naval_treaty.9.d: "Siapa yang peduli dengan angkatan laut..."
 MTG_naval_treaty.11.t: "Perjanjian Angkatan Laut Dibatalkan"
 MTG_naval_treaty.11.desc: "Dengan pecahnya perang, pemerintah [From.GetAdjective] telah secara resmi memberi tahu para penandatangan Perjanjian Angkatan Laut London yang tersisa bahwa, berdasarkan Pasal 24, pemerintah menganggap pembatasan Perjanjian Angkatan Laut tidak lagi menjadi kepentingan nasional. Oleh karena itu, duta besar [From.GetAdjective] telah mengumumkan bahwa Perjanjian Angkatan Laut akan ditangguhkan selama perang. Apakah pembatasan ini akan kembali berlaku setelah perang usai masih belum diketahui, namun untuk saat ini, kita harus menganggap diri kita tidak lagi terikat oleh kewajiban perjanjian ketika merancang dan membuat kapal."
 MTG_naval_treaty.11.a: "Ini adalah upaya mulia untuk menjaga perdamaian."
 mtg_britain.999.t: "Istana Buckingham Dibom - Raja Edward Mati"
 mtg_britain.999.d: "Pengeboman strategis yang ekstensif di wilayah ibu kota kini telah menimbulkan korban jiwa yang besar. Pada 15:41. kemarin sore, Taman St. James dan Istana Buckingham dilanda serangan yang dilakukan oleh beberapa pembom musuh. Meskipun tim penyelamat tiba di lokasi kejadian dalam beberapa menit, mereka terpaksa menyimpulkan bahwa Raja Edward dan istrinya Wallis tewas seketika ketika sebuah bom meledak dan menjatuhkan langit-langit ruang bawah tanah ke arah mereka.\n\nMeskipun kematian Raja telah membuat seluruh negeri berduka, persiapan telah dilakukan untuk penobatan penggantinya. Sebagai hasil dari pernikahan morganatik Raja, garis suksesi kini melewati saudaranya, Albert, yang telah memilih nama pemerintahan George VI saat ia mempersiapkan penobatannya."
 mtg_britain.999.a: "Raja sudah mati. Hidup Raja!"
 mtg_britain.1000.t: "Raja George VI Meninggal"
 mtg_britain.1000.d: "Pagi ini tersiar kabar meninggalnya Raja George VI. Baru-baru ini, tekanan akibat perang semakin berdampak buruk pada kesehatan Raja, dan akhirnya kebiasaan merokoknya yang berat serta berkembangnya arteriosklerosis dan penyakit Buerger menyebabkan putrinya Elizabeth sudah mengambil alih banyak tugas kerajaan ayahnya.\n\nSekarang, Elizabeth akan naik takhta ayahnya, menyandang nama pemerintahan Elizabeth II. Meskipun masih muda, dia telah bersiap menghadapi momen ini sejak pernikahan morganatik pamannya memperjelas garis suksesi di masa depan, dan diharapkan menjadi Ratu yang baik meskipun usianya sudah lanjut."
 mtg_britain.1000.a: "Raja sudah mati. Hidup Ratu!"
 mtg_news.55.t: "Raja Edward Dibunuh"
 mtg_news.55.desc: "Pemboman baru-baru ini di London kini telah mengakibatkan kematian Raja Edward dan istrinya Wallis. Sekitar pukul 3, serangan bom mendadak memaksa pasangan tersebut berlindung di ruang bawah tanah istana. Satu bom menghantam gedung di atasnya dan menjatuhkan langit-langit ruang bawah tanah ke arah Raja dan rombongannya.\n\nSementara negara berduka atas kehilangan rajanya, saudara laki-laki Raja, Albert, kini bersiap untuk menggantikannya, mengambil nama pemerintahan George VI."
 mtg_news.55.a: "Meski enggan, dia akan mengabdi pada negaranya dengan baik."
 mtg_news.55.b: "Mereka membayar harga tertinggi."
 mtg_news.56.t: "[From.GetName] Memasang Monarki Amerika"
 mtg_news.56.desc: "Menyusul penaklukan mereka baru-baru ini atas daratan Amerika, [From.GetLeader] kini telah mengeluarkan Dekrit Kerajaan yang menghapuskan jabatan Presiden Amerika Serikat, dan menggantinya dengan struktur pemerintahan monarki yang serupa dengan [From.GetNameDef]. Untuk menduduki takhta ini, Raja Edward tidak lain memilih istrinya, Ratu Wallis, yang selanjutnya akan dikenal dengan nama pemerintahan Wallis I dan memerintah Britania Raya atas nama suaminya.\n\nMasih harus dilihat bagaimana masyarakat Amerika akan menyesuaikan diri dengan bentuk pemerintahan baru ini."
 mtg_news.56.a: "Apa jadinya suatu bangsa tanpa Raja? Atau Ratu, dalam hal ini."
 mtg_news.56.b: "\"Pembalas Pesta Teh Boston\", serius?!"
 mtg_news.56.c: "Cinta sang Raja tidak mengenal batas."
 mtg_news.57.t: "Penciptaan Dominion Amerika Utara"
 mtg_news.57.desc: "Menyusul penaklukan mereka baru-baru ini atas daratan Amerika, [From.GetLeader] kini telah mengeluarkan Dekrit Kerajaan yang memasukkan bekas Amerika Serikat ke dalam Dominion Kanada, dan mengganti namanya menjadi Dominion Amerika Utara."
 mtg_news.57.a: "Ini akan sangat menguntungkan pengelolaan Kekaisaran."
 mtg_news.57.b: "Sebuah tanggung jawab yang besar."
 mtg_news.57.c: "Mereka sedang mengkonsolidasikan kekuatan mereka."
 mtg_news.59.t: "Raja George VI Meninggal"
 mtg_news.59.desc: "Pemerintah [ENG.GetAdjective] hari ini telah mengkonfirmasi kematian Raja George VI. Selama beberapa waktu, kebiasaan merokok berat sang Raja, kemungkinan besar disebabkan oleh tekanan perang, telah mengakibatkan menurunnya kesehatan, dan akhirnya menyebabkan berkembangnya kanker paru-paru, arteriosklerosis, dan penyakit Buerger.\n\nPersiapan telah dilakukan untuk penobatan putri Raja, Elizabeth, yang akhir-akhir ini sudah menjalankan banyak tugas kerajaan ayahnya."
 mtg_news.59.a: "Usianya yang masih muda memungkiri kekuatannya."
 mtg_netherlands.66.t: "[ENG.GetName] Mendominasi [HOL.GetAdjective] Negosiasi Perdagangan"
 mtg_netherlands.66.d.a: "Inggris telah memperluas pengaruhnya terhadap kita hingga kita terpaksa memihak mereka dalam negosiasi perdagangan saat ini."
 mtg_netherlands.66.d.b: "Inggris telah memperluas pengaruhnya terhadap [HOL.GetNameDef] hingga pada titik di mana pemerintah [HOL.GetAdjective] merasa terpaksa untuk mendukung mereka dalam negosiasi perdagangan saat ini."
 mtg_netherlands.66.a: "Mengenai."
 mtg_netherlands.66.b: "Kita tidak bisa membiarkan mereka masuk ke dalam lingkup pengaruh [ENG.GetAdjective]!"
 mtg_netherlands.67.t: "[GER.GetName] Mendominasi [HOL.GetAdjective] Negosiasi Perdagangan"
 mtg_netherlands.67.d.a: "Jerman telah memperluas pengaruhnya terhadap kita hingga kita terpaksa memihak mereka dalam negosiasi perdagangan saat ini."
 mtg_netherlands.67.d.b: "Jerman telah memperluas pengaruhnya terhadap [HOL.GetNameDef] hingga pada titik di mana pemerintah [HOL.GetAdjective] merasa terpaksa untuk mendukung mereka dalam negosiasi perdagangan saat ini."
 mtg_netherlands.67.b: "Kita tidak bisa membiarkan mereka masuk ke dalam lingkup pengaruh [GER.GetAdjective]!"
 mtg_netherlands.69.t: "Penduduk Lokal Menentang Banjir yang 'Tidak Masuk Akal'"
 mtg_netherlands.69.d: "Karena tidak adanya kebutuhan mendesak untuk membanjiri Saluran Air Belanda, penduduk setempat mulai menyerukan pengeringan daerah pedesaan agar mereka dapat kembali ke kehidupan sehari-hari. Menolak tuntutan mereka kemungkinan besar hanya akan menimbulkan lebih banyak keresahan di kemudian hari."
 mtg_netherlands.69.a: "Mereka harus menerimanya lebih lama lagi."
 mtg_netherlands.69.b: "Mari kita keringkan tanahnya."
 mtg_netherlands.70.t: "Divisi Bentuk Pembelot Jerman"
 mtg_netherlands.70.d: "Sejumlah besar pembelot Jerman kini telah membentuk unit yang lengkap, hanya perlu dilengkapi dengan peralatan sebelum kami dapat mengirim mereka ke medan perang atas nama kami."
 mtg_netherlands.71.t: "Prajurit Membelot ke [HOL.GetName]"
 mtg_netherlands.71.d: "Ratu Wilhelmina dari [HOL.GetNameDef] telah mengumumkan kesediaannya untuk memastikan kembalinya Kaiser Wilhelm II ke atas takhta Jerman, setelah perang berakhir. Pernyataan ini menghasilkan optimisme yang tidak beralasan dan sentimen kesetiaan yang salah arah di antara prajurit kita, yang mulai membelot dan berusaha mencapai [HOL.GetNameDef] untuk berperang atas nama Ratu.\n\nAkan sangat sulit untuk menghentikan gerakan ini jika kita tidak dapat mengakhiri perang dengan tegas..."
 mtg_netherlands.71.a: "Pengkhianat! Mereka semua!"
 mtg_netherlands.72.d: "Tadi malam Kaiser Wilhelm II, yang tetap berada di bawah perawatan kami sampai akhir hayatnya, meninggal dunia dengan damai dalam tidurnya. Putranya, Friedrich Wilhelm, kini menjadi kepala Wangsa von Hohenzollern, dan kini memilih nama pemerintahan Wilhelm III."
 mtg_netherlands.72.a: "Perjanjian kami dengan ayahnya sekarang diteruskan padanya."
 mtg_netherlands.73.t: "[HOL_kaiserreich_germany.GetLeader] Memimpin Perang Saudara Jerman"
 mtg_netherlands.73.d: "Dengan pembebasan tanah Jerman pertama, Ratu Wilhelmina telah memenuhi janji awalnya dan mengizinkan Kaiser [HOL_kaiserreich_germany.GetLeader] untuk membentuk pemerintahan sementara di wilayah pendudukan. [HOL_kaiserreich_germany.GetLeader] sekarang dapat memimpin perangnya untuk membebaskan seluruh negara dari tanah Jerman, menarik lebih banyak orang untuk berperang atas namanya."
 mtg_netherlands.73.a: "Sebuah langkah maju yang besar menuju Eropa yang monarki!"
 mtg_netherlands.74.t: "[HOL_kaiserreich_germany.GetLeader] Mengusulkan Aliansi"
 mtg_netherlands.74.d: "Dengan berakhirnya perang, [HOL_kaiserreich_germany.GetLeader] merasa pantas untuk mengingatkan kita akan perjanjian kita, dan mengusulkan aliansi dengan syarat setara antara kedua negara dalam menghadapi oposisi Barat yang tak terelakkan terhadap Eropa Monarki baru ini."
 mtg_netherlands.74.a: "Kami akan memenuhi kewajiban kami."
 mtg_netherlands.75.t: "Wilhelmina Tawar-menawar dengan Wilhelm II"
 mtg_netherlands.75.d: "Dalam apa yang hanya dapat digambarkan sebagai penghinaan terhadap kita, [HOL.GetAdjective] Ratu Wilhelmina telah mengumumkan tekadnya untuk mengembalikan Wilhelm II ke takhta Jerman setelah berakhirnya perang saat ini. Dia telah mengundang warga Jerman mana pun yang ingin memperjuangkan Kaiser lama mereka untuk pergi ke wilayah yang dikuasai [HOL.GetAdjective], jelas dalam upaya untuk melemahkan posisi [GER.GetAdjective] dan memperkuat posisi mereka sendiri."
 mtg_netherlands.75.a: "Tercela - kita akan menghadapinya nanti."
 mtg_netherlands.76.t: "Legiun Jerman Yang Mulia Dibubarkan"
 mtg_netherlands.76.d: "Dengan berakhirnya perang, tentara Jerman yang berperang atas nama kita kini telah kembali ke tanah air mereka, dan bersiap untuk berperang langsung demi Kaiser mereka."
 mtg_netherlands.76.a: "Hal itu tidak bisa dihindari. Pelayanan mereka sangat berharga."
 mtg_news.58.desc: "Dengan janji [HOL.GetAdjective] Ratu Wilhelmina untuk memastikan kembalinya dinasti von Hohenzollern ke tahta Jerman, dan pembebasan wilayah pertama Jerman, Kaisar kini telah kembali ke wilayah Jerman untuk memimpin apa yang secara efektif menjadi perang saudara penuh untuk menguasai tanah airnya.\n\nSementara itu, pembelot Jerman terus berbondong-bondong ke wilayah yang dikuasai [HOL.GetAdjective] untuk berperang atas nama Ratu dan Kaiser mereka, perlahan tapi bertahap menggeser keseimbangan kekuatan. Pernyataan resmi dari Kekuatan Entente Perang Besar belum dikeluarkan, namun laporan menunjukkan ketidaksetujuan yang besar di antara pemerintah mereka."
 mtg_news.58.a: "Sebuah langkah menuju kemenangan total."
 mtg_news.58.b: "Beraninya mereka?!"
 mtg_news.58.c: "Sederhananya... Belanda akan mendapatkan haknya."
 mtg_news.58.d: "Keahlian diplomatis atau kegilaan belaka?"
 mtg_britain.109.t: "Burma Memisahkan Diri"
 mtg_britain.109.d: "Mengingat peristiwa-peristiwa yang terjadi baru-baru ini, rakyat Burma telah mendeklarasikan kemerdekaan mereka, dan sepenuhnya mengharapkan kita untuk terlibat penuh dengan rakyat Pakistan dan karena itu tidak mampu menghadapi mereka."
 mtg_britain.109.a: "Kami tidak punya pilihan selain menerima."
 mtg_britain.113.t: "[From.GetName] Bergabung kembali dengan Kekaisaran"
 mtg_britain.113.d: "Setelah memenangkan perang saudara dan menyatukan kembali tanah air mereka, para pemimpin [From.GetNameDef] kini telah meminta untuk bergabung kembali dengan Kekaisaran, menginginkan bimbingan dan perlindungan kami untuk apa yang mungkin terjadi."
 mtg_britain.113.a: "Kami menyambut mereka kembali."
 mtg_news.62.desc: "Perwakilan dari pemerintahan Dominion hari ini mengumumkan bahwa mereka secara sepihak akan memutuskan hubungan dengan Kerajaan. Mereka mengutip ketidakpedulian Raja terhadap pendapat dan keinginan pemerintah Dominion dan rakyatnya sebagai alasan utama mengapa hubungan Inggris-Persemakmuran tidak dapat dilanjutkan lagi. Krisis ini, yang disebabkan oleh niat Raja untuk menikahi Wallis Simpson, kini telah mengakibatkan terbentuknya Negara-Negara Persemakmuran baru dengan berbagai Dominion, dan tampaknya kelumpuhan pemerintah Inggris saat ini akan menghalangi tindakan apa pun untuk mengambil tindakan dalam menanggapi langkah ini. Tidak diragukan lagi inilah yang diharapkan oleh para Dominion."
 mtg_news.62.b: "Kekaisaran sedang dalam krisis."
 mtg_news.63.t: "[Root.GetName] Menyatakan Kemerdekaan"
 mtg_news.63.desc: "Pemerintah [Root.GetAdjective] hari ini mengumumkan bahwa mereka secara sepihak akan memutuskan hubungan dengan pemerintah [ENG.GetAdjective]. Mereka menyebutkan ketidakmampuan mereka untuk menyelaraskan pandangan politik mereka dengan perkembangan politik yang terjadi di [ENG.GetName] sebagai alasan utama terjadinya hal ini."
 mtg_netherlands.77.t: "[From.GetNameDef] Mengusulkan Federasi"
 mtg_netherlands.77.d: "Pemerintah [From.GetAdjective] telah mendekati kita dengan proposal untuk menyatukan Negara-Negara Rendah menjadi satu negara bagian. Mereka berpendapat bahwa krisis global saat ini memerlukan kerja sama dan persatuan yang lebih erat di antara masyarakat kita, yang hanya dapat dicapai melalui persatuan yang utuh. Jika kita menerimanya, persiapan akan dilakukan untuk penyerahan kedaulatan segera kepada negara supranasional baru, di bawah kepemimpinan [From.GetAdjective]."
 mtg_netherlands.77.a: "Sebuah ide yang luar biasa – kita tidak akan mempunyai peluang tanpanya."
 mtg_netherlands.77.b: "Kedaulatan kita adalah yang terpenting – kita akan melangkah jauh dalam kerja sama kita, namun tidak sejauh itu."
 mtg_netherlands.78.t: "[From.GetNameDef] Menerima Federasi"
 mtg_netherlands.78.d: "Pemerintah [From.GetAdjective] telah memberi tahu kami bahwa mereka menyetujui proposal kami untuk negara kesatuan di Negara-Negara Rendah. Jika semua pihak menerima, kami dapat melanjutkan implementasi rencana kami."
 mtg_netherlands.79.t: "[From.GetNameDef] Menolak Federasi"
 mtg_netherlands.79.d: "Perwakilan [From.GetAdjective] telah memberi tahu kami bahwa mereka saat ini tidak melihat perlunya negara bersatu di Negara-Negara Rendah. Mereka berharap dapat melanjutkan kerja sama dengan kami, namun tetap mempertahankan kedaulatan penuh."
 mtg_news.64.t: "Negara-Negara Rendah Bersatu"
 mtg_news.64.desc: "Mengutip ancaman eksternal yang parah terhadap keamanan nasional mereka, pemerintah Negara-Negara Rendah telah mengumumkan penyatuan segera pemerintah dan angkatan bersenjata mereka untuk memperkuat posisi masyarakat mereka. Di bawah kepemimpinan [From.GetOldAdjective], investasi industri dan perencanaan pertahanan militer kini akan diutamakan dibandingkan urusan dalam negeri lainnya, yang bertujuan untuk memastikan kesiapan militer cukup untuk bereaksi terhadap tindakan apa pun yang mungkin mengancam kedaulatan negara baru."
 mtg_news.64.a: "Seluruh rakyat kami bersatu untuk mempertahankan tanah air kami."
 mtg_news.64.b: "Bersatu lagi? Ambil keputusan!"
