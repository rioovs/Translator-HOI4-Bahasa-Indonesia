l_braz_por:
 MEX_focus_national_bank: "Bank Nasional"
 MEX_focus_national_bank_desc: "Dibentuk pada tahun 1925 untuk membangun kembali perekonomian yang hancur akibat perang saudara, Banco de México adalah pemberi pinjaman pilihan terakhir, penerbit mata uang, dan investor dalam segala bentuk usaha untuk kepentingan negara."
 MEX_focus_military_budget_review: "Tinjauan Anggaran Militer"
 MEX_focus_military_budget_review_desc: "Militer rezim Díaz yang memiliki dana besar runtuh ketika milisi Revolusioner mulai membebaskan kota-kota dan memutus pendanaan bagi mereka. Mari kita tinjau keuangan militer untuk memastikan umur panjangnya di masa perang."
 tooltip_military_budget_review: "Tinjauan Anggaran Militer"
 MEX_focus_gulf_coast_naval_yards: "Lapangan Angkatan Laut Pantai Teluk"
 MEX_focus_gulf_coast_naval_yards_desc: "Pesisir Teluk kami berhadapan dengan Eropa dan Pesisir Timur Amerika Serikat, yang merupakan mitra dagang utama kami. Industri minyak kita yang sedang berkembang akan terlayani dengan baik oleh perluasan galangan kapal di Veracruz."
 MEX_focus_pacific_coast_naval_yards: "Lapangan Angkatan Laut Pantai Pasifik"
 MEX_focus_pacific_coast_naval_yards_desc: "Perdagangan di kawasan Pasifik dengan Jepang dan California tidak sepenting perdagangan di Atlantik bagi kita, namun kita harus melindungi kepentingan kita dan membuka lebih banyak kemungkinan. Memperluas galangan kapal di Pasifik memberi kita lebih banyak kelonggaran jika Teluk diblokade."
 MEX_focus_brown_water_navy: "Angkatan Laut Air Coklat"
 MEX_focus_brown_water_navy_desc: "Meksiko bergantung pada kapal-kapal kuno sebelum Perang Besar untuk melindungi perdagangan kita di dekat pantai. Kami telah berusaha membeli lebih banyak kapal modern dari Spanyol dan negara-negara lain, namun kemajuannya lambat. Kita perlu mengembangkan strategi angkatan laut jika perang melanda Eropa dan meluas ke Belahan Barat."
 tooltip_escort_ships: "Kapal Pengawal"
 MEX_focus_blue_water_navy: "Angkatan Laut Air Biru"
 MEX_focus_blue_water_navy_desc: "Meksiko tidak pernah menjadi kekuatan angkatan laut. Di masa kolonial, penguasa Spanyol membutuhkan semua kapalnya untuk menghadapi Inggris. Pada masa perjuangan kemerdekaan dan perang saudara setelahnya, semua perhatian kita terfokus ke dalam. Setelah Amerika mengambil alih posisi kita dan menjadi Kekuatan Besar, tidak ada gunanya mencoba bersaing di lautan. Namun mungkin di masa penuh gejolak ini, Meksiko membutuhkan angkatan laut yang kuat."
 tooltip_capital_ships: "Kapal Modal"
 MEX_focus_raiding_navy: "Menyerang Angkatan Laut"
 MEX_focus_raiding_navy_desc: "Kita tidak bisa berharap untuk bisa mengejar kekuatan angkatan laut utama dunia dalam bersaing di permukaan melawan kapal perang dan kapal induk. Kita sebaiknya mencoba melarang angkutan pasukan musuh sebelum mereka tiba untuk melindungi Meksiko dari invasi."
 MEX_focus_heroic_military_college: "Perguruan Tinggi Militer Pahlawan"
 MEX_focus_heroic_military_college_desc: "Colegio Militar didirikan pada tahun 1823 dan memperoleh gelar kehormatan Heroico setelah lima tarunanya bertempur sampai mati melawan Marinir Amerika selama perang Meksiko-Amerika tahun 1847. Seorang kadet keenam membungkus dirinya dengan bendera Meksiko dan melemparkan dirinya dari tembok untuk menghindari penangkapan."
 tooltip_mexico_stability_hit_for_peacetime_expansion: "Kami masih damai, memperluas angkatan bersenjata kami akan sangat tidak populer!"
 MEX_focus_tank_workshops: "Bengkel Tangki"
 MEX_focus_tank_workshops_desc: "Perancang pesawat kami, TNCA, bereksperimen dengan kendaraan tempur lapis baja selama Perang Besar, menciptakan prototipe berdasarkan desain belah ketupat Inggris. Kita harus memulai kembali eksperimen ini dan membuat bengkel tangki."
 MEX_focus_weapons_modernisation: "Modernisasi Senjata"
 MEX_focus_weapons_modernisation_desc: "Meksiko memiliki industri senjata kecil yang luar biasa sebelum Revolusi. Diktator Díaz yang dibenci, dengan segala kesalahannya, sangat tertarik pada pengembangan senjata. Eksperimen senapan otomatis pada era Díaz perlu diselidiki."
 MEX_focus_aviation_workshops: "Bengkel Penerbangan"
 MEX_focus_aviation_workshops_desc: "TNCA sempat terhenti karena kekurangan dana setelah Revolusi, namun dengan semakin meningkatnya daya bunuh pesawat sejak saat itu, kita harus terus mengikuti kemajuan di bidang penerbangan."
 MEX_focus_military_aviation_specialists: "Spesialis Penerbangan Militer"
 MEX_focus_military_aviation_specialists_desc: "Escuela Militar de Mecánicos Especialistas de Aviación akan melatih korps staf teknis yang terampil untuk memperbaiki pesawat kami. Semakin baik perawatan pesawat, semakin lama pilot berada di udara untuk memperoleh pengalaman."
 MEX_focus_army_expansion_programme: "Program Perluasan Angkatan Darat"
 MEX_focus_army_expansion_programme_desc: "Meksiko memiliki kapasitas yang besar untuk memperluas angkatan bersenjatanya, dengan program pembangunan bangsa melalui Revolusi yang menyatukan provinsi-provinsi yang mementingkan diri sendiri menjadi satu Tanah Air. Warga negara kita yang patriotik akan datang membantu negara jika keadaan sulit."
 MEX_focus_heavy_artillery: "Artileri Berat"
 MEX_focus_heavy_artillery_desc: "Kekuatan membunuh artileri lapangan tidak dapat disangkal. Perang Besar menunjukkan kepada dunia betapa pentingnya artileri untuk mendukung kemajuan dan menghancurkan serangan musuh. Kita harus mengembangkan artileri konvensional kita."
 MEX_focus_aerial_artillery: "Artileri Udara"
 MEX_focus_aerial_artillery_desc: "Kami bereksperimen dengan penggunaan pesawat pengebom terhadap sasaran 'lunak' selama Perang Cristero, dan sejumlah pemberontakan lain yang dilakukan oleh para jenderal nakal. Para pemberontak tidak mampu bersaing di udara, dan dengan demikian dukungan pembom akan sangat penting untuk menjaga negara Meksiko."
 MEX_focus_agricultural_credit_bank: "Bank Kredit Pertanian"
 MEX_focus_agricultural_credit_bank_desc: "Banco de Crédito Agricola akan membantu mempercepat program reformasi pertanahan dengan memberikan pinjaman kepada petani ejido untuk membeli mesin dan barang modal lainnya. Alberto J. Pani adalah seorang veteran industri keuangan yang dapat memimpin bank ini dan membantu Meksiko meningkatkan kapasitas produktifnya."
 MEX_focus_rural_infrastructure: "Infrastruktur Pedesaan"
 MEX_focus_rural_infrastructure_desc: "Sistem kereta api di Meksiko diperluas selama era Díaz, tetapi sebagian besar terkonsentrasi di kota-kota di Utara untuk memfasilitasi perdagangan dengan Amerika. Kita harus mendorong jalur kereta api lebih jauh ke selatan."
 MEX_focus_peripheral_infrastructure: "Infrastruktur Periferal"
 MEX_focus_peripheral_infrastructure_desc: "Sebagian besar wilayah pedesaan kami hanya mengalami sedikit perbaikan infrastruktur selama beberapa dekade. Ada sejumlah petani subsisten miskin yang bersedia menerima pekerjaan di pabrik dan mendapatkan pendidikan jika kita memperluas sistem jalan raya."
 MEX_focus_rural_schools: "Sekolah Pedesaan"
 MEX_focus_rural_schools_desc: "Sekolah adalah tempat kita mengubah bahan mentah dari petani yang buta huruf menjadi warga negara yang patriotik dan bersedia melawan ketidakadilan dan memperkuat Tanah Air. Escuelas Regionales Campesinas akan merevolusi para petani, mengajari mereka keterampilan teknis dan membuat mereka mandiri."
 MEX_focus_rent_freeze: "Sewa Beku"
 MEX_focus_rent_freeze_desc: "Buruh perkotaan adalah unsur utama dalam Meksiko baru yang sedang kita bangun. Mereka dimobilisasi ke dalam Batalyon Merah selama Revolusi dan sekarang mencari kompensasi yang dijanjikan kepada mereka. Salah satu bidang yang harus segera menjadi perhatian adalah para tuan tanah parasit yang mengambil uang sewa dari para pencipta kekayaan yang bekerja keras ini."
 MEX_focus_confederation_of_mexican_workers: "Konfederasi Pekerja Meksiko"
 MEX_focus_confederation_of_mexican_workers_desc: "Elit politik di Meksiko selalu berusaha mengendalikan aktivitas serikat pekerja. CTM akan menggantikan CROM, karena CROM dianggap korup dan didiskreditkan karena berhubungan dengan para pemimpin rezim di masa lalu yang tidak populer."
 MEX_focus_ejido_worker_militias: "Milisi Pekerja Ejido"
 MEX_focus_ejido_worker_militias_desc: "Reformasi pertanahan yang dijanjikan dalam UUD 1917 mengalami kemajuan yang lambat. Seringkali, tuan tanah menggunakan preman dan tentara swasta untuk mengintimidasi penyewa mereka guna mencegah redistribusi. Mari kita mengorganisir para petani, petani dan buruh ke dalam milisi komunal untuk melindungi keuntungan yang kita peroleh dari ketidakadilan."
 MEX_focus_party_of_the_revolution: "Partai Revolusi"
 MEX_focus_party_of_the_revolution_desc: "Presiden Cárdenas terpilih dengan platform reforma agraria berkat dukungan organisasi buruh dan tani. Kita telah melaksanakan reformasi dan kini kita memiliki negara sosialis yang bangga dan siap melawan ketidakadilan di panggung internasional."
 MEX_focus_liberalize_the_banking_sector: "Liberalisasikan Sektor Perbankan"
 MEX_focus_liberalize_the_banking_sector_desc: "Ada banyak kebijakan pemerintah yang keras yang menghambat transformasi pasar di Meksiko. Undang-Undang Umum Lembaga Perkreditan tahun 1925, misalnya, melarang bank memiliki saham di bank lain. Konyol! Semakin bebas pasar, semakin bebas masyarakatnya. Luis Montes de Oca, seorang penganjur Sekolah Ekonomi Austria, akan membantu kita mereformasi sistem perbankan."
 MEX_focus_strike_breaking: "Pemogokan Melanggar"
 MEX_focus_strike_breaking_desc: "Berserikat adalah hak mendasar yang dilindungi oleh Konstitusi tahun 1917, namun penyerangan terhadap properti adalah tindakan kriminal dan harus diperlakukan seperti itu. Menarik tenaga kerja dari industri yang kritis bahkan dapat dianggap sebagai pengkhianatan pada saat krisis."
 MEX_focus_urban_development: "Pembangunan Perkotaan"
 MEX_focus_urban_development_desc: "Kota-kota adalah pusat kegiatan ekonomi dan oleh karena itu kebutuhannya harus diprioritaskan dibandingkan negara-negara pedesaan yang tertinggal. Kami akan membangun sistem jalan raya dan kereta api di Mexico City dan wilayah perkotaan besar lainnya, dan dengan melakukan hal tersebut, kekayaan Meksiko akan semakin meningkat."
 MEX_focus_cientifico_camarilla: "Científico Camarilla"
 MEX_focus_cientifico_camarilla_desc: "Rezim Díaz didukung oleh sekelompok teknokrat di kabinet dan bisnis swasta. Sistem klientelisme dan patronase yang tidak populer yang mereka bangun adalah salah satu alasan runtuhnya rezim tersebut. Namun, kami mendapat cinta dan dukungan dari masyarakat, dan Científicos memiliki beberapa keterampilan yang sangat dibutuhkan..."
 MEX_focus_end_land_reform: "Akhiri Reformasi Pertanahan"
 MEX_focus_end_land_reform_desc: "Program reformasi pertanahan telah lama disalahgunakan oleh orang-orang kuat lokal yang memiliki koneksi politik atau kekuatan militer. Seorang petani kaya yang mencuri lahan publik demi keuntungannya sendiri tidak membantu Meksiko menjadi lebih kuat atau lebih bersatu. Tanah itu seharusnya dijual kepada penawar tertinggi. Mungkin beberapa tuan tanah memang menyalahgunakan penyewa mereka, tapi itu adalah urusan pengadilan."
 MEX_focus_privatization: "Privatisasi"
 MEX_focus_privatization_desc: "Sistem ejido membatasi penggunaan lahan, tergantung pada penggunaan yang dimaksudkan oleh pemerintah. Mengapa negara harus memaksa petani untuk hidup subsisten dibandingkan menanam tanaman komersial untuk diekspor? Kita bisa menjadikan Meksiko lebih kaya jika kita memecah pertanian komunal dan membiarkan pembangunan nyata terjadi. Gagasan kuno tentang kemandirian hanya menghalangi kemajuan dan globalisasi."
 MEX_focus_caudillo_private_armies: "Tentara Swasta Caudillo"
 MEX_focus_caudillo_private_armies_desc: "Para gubernur, pengusaha, dan komandan garnisun di suatu wilayah cenderung adalah orang yang sama – seorang jenderal Revolusioner yang memperoleh kekuasaan dengan menunjuk bawahan setianya pada posisi-posisi berpengaruh. Caudillo ini adalah fakta kehidupan yang harus kita kembangkan, bukan melawannya."
 MEX_focus_support_general_cedillo: "Dukung Jenderal Cedillo"
 MEX_focus_support_general_cedillo_desc: "Jenderal Utara Saturnino Cedillo dan caudillo lain seperti dia memerlukan jaminan bahwa otonomi mereka akan dihormati oleh pemerintah. Sentralisasi kekuasaan yang cepat di bawah kepemimpinan Presiden Calles dan Cárdenas telah memungkinkan kita untuk memberikan beban besar dalam mengatasi permasalahan yang dihadapi negara ini, sehingga perampasan caudillo tidak diperlukan lagi."
 tooltip_mexico_cedillo_will_be_placated: "Jenderal Cedillo akan §Gtenang§!."
 MEX_focus_oil_field_expansion: "Perluasan Ladang Minyak"
 MEX_focus_oil_field_expansion_desc: "Kebutuhan Amerika akan minyak tidak pernah terpuaskan. Meskipun mereka memproduksi sebagian besar minyak dunia, mereka juga mengimpor sumber daya tersebut. Meksiko memiliki ladang minyak yang belum dikembangkan di sepanjang Gulf Coast yang dapat kita manfaatkan untuk ekspor."
 MEX_focus_northern_steel_plants: "Pabrik Baja Utara"
 MEX_focus_northern_steel_plants_desc: "Wilayah paling maju di Meksiko di luar ibu kota adalah perbatasan utara dengan Amerika. Kota-kota di sepanjang Rio Grande seperti Matamoros dan Ciudad Juarez menikmati hubungan ekonomi yang erat dengan kota-kota di perbatasan seperti Brownsville dan El Paso. Kita harus memanfaatkan infrastruktur unggul di wilayah tersebut untuk lebih mengembangkan industri berat kita."
 MEX_focus_capital_reserves: "Cadangan Modal"
 MEX_focus_capital_reserves_desc: "Uang tunai yang kami kumpulkan dengan menjual minyak memungkinkan kami untuk melenturkan kekuatan ekonomi kami. Kalau kita perlu membeli teknologi dari Amerika atau Inggris, misalnya, kita sekarang punya sarananya. Kami dapat merekayasa balik atau memproduksi secara massal desain ini sesuai keinginan kami."
 MEX_focus_oil_revenue_reinvestment: "Reinvestasi Pendapatan Minyak"
 MEX_focus_oil_revenue_reinvestment_desc: "Karena kami sekarang mendapatkan lebih banyak keuntungan dari penjualan minyak, anggaran kami meningkat dengan cepat dan kami harus merencanakan cara yang berguna untuk menggunakan dana baru tersebut. Agar dapat memperoleh manfaat dari hal ini dalam jangka panjang, menginvestasikan kembali pendapatan tersebut ke dalam stimulasi ekonomi tampaknya merupakan pilihan yang paling tepat."
 MEX_focus_royal_dutch_shell: "Cangkang Kerajaan Belanda"
 MEX_focus_royal_dutch_shell_desc: "Royal Dutch Shell adalah perusahaan Inggris dan Belanda yang memegang 60% konsesi minyak Meksiko. Dengan berkompromi dengan perusahaan minyak asing mengenai perselisihan perburuhan, kita bisa mencapai kesepakatan yang menguntungkan kita berdua."
 MEX_focus_community_of_nations: "Komunitas Bangsa-Bangsa"
 MEX_focus_community_of_nations_desc: "Ketergantungan ekonomi kita pada perdagangan Inggris bukanlah suatu kutukan. Dengan menerima status quo, kita dapat terlibat dalam diplomasi internasional dengan dukungan negara adidaya."
 anglo_mexican_diplomacy: "Diplomasi Anglo-Meksiko"
 MEX_focus_purchase_belize: "Beli Belize"
 MEX_focus_purchase_belize_desc: "Wilayah kecil ini telah lama diklaim oleh Kerajaan Spanyol pada masa kolonial, meskipun tidak pernah dihuni oleh semenanjung. Setelah hilangnya kerajaan kolonial Spanyol selama Perang Napoleon, Inggris secara bertahap memperkuat kekuasaannya di wilayah tersebut, yang berpuncak pada pembentukan koloni Inggris Honduras pada tahun 1862. Wilayah tersebut harus diserahkan ke Meksiko sebagai tanda itikad baik."
 MEX_focus_nationalize_the_oil_fields: "Nasionalisasi Ladang Minyak"
 MEX_focus_nationalize_the_oil_fields_desc: "Konsesi minyak asing mendominasi perekonomian Meksiko dan memberikan pengaruh yang terlalu besar terhadap urusan-urusan kita, baik dalam maupun luar negeri. Inggris dan Amerika lebih memperhatikan Royal Dutch Shell dan Standard Oil dibandingkan pemerintah kita!"
 tooltip_mexico_they_may_declare_war: "§RMereka mungkin dibujuk untuk menyatakan perang oleh para cukong minyak!§!"
 MEX_focus_german_resource_exchange: "Pertukaran Sumber Daya Jerman"
 MEX_focus_german_resource_exchange_desc: "Mesin perang Jerman bersiap kembali dan membutuhkan minyak Meksiko agar dapat berfungsi dengan baik. Daripada bersujud di hadapan Amerika atau menjual negara kita kepada Rusia, kita bisa mencoba mengeksploitasi kebutuhan minyak Jerman untuk meningkatkan kekuatan militer kita."
 mexico_german_resource_exchange: "Pertukaran Sumber Daya Meksiko-Jerman"
 MEX_focus_new_world_order: "Tatanan Dunia Baru"
 MEX_focus_new_world_order_desc: "Jerman jelas merupakan penguasa Eropa. Kita pasti akan mendapat tempat di Tatanan Dunia Baru mereka jika kita membantu mereka melawan Inggris dan Amerika. Telegram Zimmermann lama dikirimkan karena suatu alasan: Amerika hanya dapat dihancurkan melalui invasi darat..."
 german_mexican_diplomacy: "Diplomasi Jerman-Meksiko"
 MEX_focus_oppose_yanqui_imperialism: "Menentang Imperialisme Yanqui"
 MEX_focus_oppose_yanqui_imperialism_desc: "Setelah secara sah mengambil kembali sumber daya alam negara kami, pihak asing kini menuntut kompensasi, namun konsesi tersebut pada dasarnya dicuri dari rakyat Meksiko pada masa kelemahan mereka di bawah diktator Díaz. Mengapa kita harus membayar pencuri untuk mengembalikan barang curian?"
 MEX_focus_international_proletarianism: "Proletarisme Internasional"
 MEX_focus_international_proletarianism_desc: "Uni Soviet telah menunjukkan bahwa sosialisme mereka akan mengubah planet ini. Revolusi yang kami perjuangkan dengan susah payah hanyalah satu langkah menuju pembebasan rakyat: pertama di Meksiko, dan sekarang di seluruh dunia."
 russo_mexican_diplomacy: "Diplomasi Rusia-Meksiko"
 MEX_focus_interior_defence_plan: "Rencana Pertahanan Dalam Negeri"
 MEX_focus_interior_defence_plan_desc: "Memang benar bahwa Yanqui memiliki keunggulan numerik dan teknologi dibandingkan kami, tetapi kami memiliki pengetahuan tentang medan, dukungan dari masyarakat, serta waktu dan ruang untuk membangun pertahanan yang kuat. Kami akan mengeluarkan darah musuh di gurun dan pegunungan menggunakan taktik tabrak lari, pertahanan mendalam, dan titik kuat tersembunyi."
 MEX_focus_compensation: "Kompensasi"
 MEX_focus_compensation_desc: "Konsesi minyak tersebut dijual secara legal kepada Royal Dutch Shell dan Standard Oil. Kita tidak bisa menyalahkan perusahaan asing yang mencari keuntungan. Kita harus menjaga integritas sistem hukum kita dengan memberikan kompensasi kepada pihak asing yang melakukan nasionalisasi konsesi."
 MEX_focus_liberty_and_justice_for_all: "Kebebasan dan Keadilan Untuk Semua"
 MEX_focus_liberty_and_justice_for_all_desc: "Amerika kini menjadi kekuatan ekonomi terbesar dalam sejarah. Uni Soviet mungkin melakukan industrialisasi dengan cepat, dan Jerman mungkin memahami perang dengan lebih baik, namun keunggulan Amerika dipuji oleh penekanannya pada kebebasan individu dan ketergantungan pada institusi dibandingkan kekerasan. Memperluas hubungan ekonomi kita ke aliansi militer adalah hal yang wajar."
 american_mexican_diplomacy: "Diplomasi Amerika-Meksiko"
 MEX_focus_aztec_eagles: "Elang Aztec"
 MEX_focus_aztec_eagles_desc: "Kami adalah salah satu negara paling berpengaruh di Amerika Latin. Kita harus menunjukkan komitmen kita terhadap keamanan dunia dengan membantu Amerika dalam perjuangannya melawan penghasut perang asing yang mengancam perdamaian umum dengan ekspansionisme mereka."
 aztec_eagles_opinion: "Elang Aztec"
 MEX_focus_international_peacekeepers: "Penjaga Perdamaian Internasional"
 MEX_focus_international_peacekeepers_desc: "Kekuatan demokrasi di dunia berencana untuk membentuk aliansi yang sederajat, Perserikatan Bangsa-Bangsa, untuk menjamin keamanan internasional dengan memberikan tempat bagi negara-negara di dunia untuk mendamaikan perbedaan mereka dan menengahi perselisihan. Kami akan terlibat dalam proyek semacam ini untuk membantu negara-negara Amerika Latin mempertahankan kemerdekaannya."
 MEX_focus_march_southwards: "Berbaris ke Selatan"
 MEX_focus_march_southwards_desc: "Meksiko kehilangan provinsi di selatannya setelah perjuangan kemerdekaan. Kerajaan Meksiko yang tidak kompeten merupakan sebuah kerusakan dalam sejarah kita, namun kita dapat memperbaiki kesalahan-kesalahannya. Negara-negara bagian Selatan sangat penting bagi pertahanan kami dan kami akan merebutnya kembali."
 threat_mexico_marching_southwards: "Meksiko Berbaris ke Selatan"
 MEX_focus_unify_centroamerica: "Satukan Centroamérica"
 MEX_focus_unify_centroamerica_desc: "Republik pisang kecil di Nikaragua, Panamá, dan Kosta Rika terlalu kecil untuk menjadi negara yang layak. Kita harus menyerap mereka ke dalam negara kita sendiri dan dengan demikian membawa kejayaan bagi Meksiko dan rakyat Meksiko."
 threat_mexico_unify_centroamerica: "Meksiko Mengupayakan Unifikasi Centroamérican"
 MEX_focus_push_past_the_darien_gap: "Dorong Melewati Celah Darién"
 MEX_focus_push_past_the_darien_gap_desc: "Setelah kampanye penyatuan Amerika Tengah, kita sekarang harus menerobos hutan antara Panama dan Kolombia yang dikenal sebagai 'Darién Gap' untuk menginjakkan kaki di Amerika Selatan."
 threat_mexico_push_south_of_the_darien_gap: "Ancaman Meksiko di Selatan Celah Darién"
 MEX_focus_andean_offensive: "Serangan Andes"
 MEX_focus_andean_offensive_desc: "Sekarang kita telah menempatkan diri di utara Pegunungan Andes, sudah menjadi takdir kita untuk melanjutkan serangan melalui medan sulit di wilayah tropis dan menyelesaikan penyatuan Amerika Latin."
 threat_mexico_andean_offensive: "Ancaman Meksiko terhadap Negara-negara Andean"
 MEX_focus_seize_the_panama_canal: "Rebut Terusan Panama"
 MEX_focus_seize_the_panama_canal_desc: "Salah satu titik sempit yang paling kritis di dunia, kanal ini digali dengan pengorbanan yang besar bagi para pekerja Latin yang berdarah dan mati di bawah cambukan Amerika demi keuntungan para industrialis. Setelah menguasai daerah sekitarnya, kami dapat melancarkan serangan kilat ke garnisun kanal kecil, memaksa Yanquis untuk memilih antara melancarkan perang berdarah melawan kami atau menyerahkan kendali atas kanal."
 MEX_focus_fortify_the_canal: "Perkuat Kanal"
 MEX_focus_fortify_the_canal_desc: "Dengan akhirnya Terusan Panama berada di tangan kita, kita harus mengamankan kunci dan tepiannya agar menjadi benteng yang tak tertembus."
 MEX_focus_integrate_the_south: "Integrasikan Selatan"
 MEX_focus_integrate_the_south_desc: "Persatuan masyarakat Meksiko merupakan sebuah proses yang lambat, namun hal ini tidak akan berhenti pada perbatasan regional atau pegunungan. Kami telah mengatasi hambatan seperti ini di masa lalu dan kami akan melakukannya lagi di provinsi-provinsi Selatan."
 MEX_focus_plan_of_agua_prieta: "Rencana Agua Prieta"
 MEX_focus_plan_of_agua_prieta_desc: "Revolusi melawan Díaz dan pertikaian sengit setelahnya berlangsung selama satu dekade. Ketika keadaan sudah tenang, para jenderal Utara yang menang bertemu di Agua Prieta, Sonora, untuk memaparkan rencana mereka bagi masa depan Meksiko. Mereka adalah kelompok populis yang terdiri dari kaum modernis dan sekularisasi, atau sebuah 'konfederasi pemimpin politik' yang sedikit lebih baik daripada para penguasa bandit yang membagi harta rampasan mereka, tergantung pada sudut pandang masing-masing."
 MEX_focus_exile_calles: "Pengasingan Calles"
 MEX_focus_exile_calles_desc: "Mantan presiden Plutarco Calles menjalani masa jabatannya antara tahun 1924 dan 1928. Kesalahan pemerintahannya memicu Perang Cristero dan pemberontakan kecil yang tak terhitung jumlahnya. Sekarang dia berusaha untuk mendominasi Presiden Cárdenas ketika dia mengendalikan beberapa presiden boneka terakhir. Cárdenas memiliki mandat demokrasinya sendiri, rencananya sendiri untuk masa depan, dan Calles harus pergi demi stabilitas Meksiko."
 MEX_focus_institutional_revolution: "Revolusi Institusional"
 MEX_focus_institutional_revolution_desc: "Warisan demokrasi masih lemah di Meksiko, namun kami telah memperkuatnya. Komitmen kami terhadap supremasi hukum mengalami kemajuan dan masyarakat mulai mempercayai pemilu kami, yang di masa lalu dimanipulasi oleh pemerintah."
 MEX_focus_jefe_maximo: "Jefe Máximo"
 MEX_focus_jefe_maximo_desc: "Meksiko akan semakin terjerumus ke dalam kekacauan jika Plutarco Calles kehilangan pengaruhnya terhadap negara tersebut. Dia menciptakan pemerintahan Portes, Ortiz, Rodríguez dan sekarang Cárdenas, dan musuh-musuh politiknya mencela dia sebagai 'el Jefe Maximo', seperti seorang kepala suku bandit! Sebenarnya, Calles hanyalah seorang negarawan tua yang hanya memikirkan niat terbaiknya untuk Meksiko. Kehilangan dia pada tahap Revolusi ini akan menjadi sebuah parodi."
 MEX_focus_purge_the_bureaucracy: "Bersihkan Birokrasi"
 MEX_focus_purge_the_bureaucracy_desc: "Keluarga Callista disingkirkan dari posisi pengaruh mereka yang tidak pantas mereka dapatkan. Kami mempunyai banyak pengganti yang cocok dalam pikiran kami, orang-orang yang berkemampuan dan cerdas yang akan bersyukur atas kesempatan untuk melayani Meksiko..."
 MEX_focus_arrest_general_cedillo: "Tangkap Jenderal Cedillo"
 MEX_focus_arrest_general_cedillo_desc: "Caudillo adalah sebuah ancaman. Mereka membagi Meksiko menjadi wilayah kekuasaan kecil dimana penunjukan pejabat memberi mereka kekuasaan atas perekonomian, militer dan pemerintahan. Mereka menjarah kekayaan Meksiko, dan hal ini paling benar terjadi di provinsi Jenderal Saturnino Cedillo. Kemandiriannya dari pemerintah pusat benar-benar tidak dapat ditoleransi, dan para pemberontak yang ia kumpulkan tidak akan memanfaatkannya."
 tooltip_mexico_cedillo_will_be_neutralised: "Jenderal Cedillo akan §Gdinetralkan§!."
 MEX_focus_control_the_army: "Kendalikan Angkatan Darat"
 MEX_focus_control_the_army_desc: "Tentara mungkin merupakan daerah pemilihan yang paling penting di Meksiko. Dua puluh tahun terakhir telah menunjukkan bahwa keinginan rakyat hanya dapat ditegakkan dengan bayonet. Oleh karena itu, para jenderal nakal merupakan ancaman terhadap eksistensi negara, apalagi legitimasinya."
 MEX_focus_repeal_the_calles_law: "Cabut Hukum Calles"
 MEX_focus_repeal_the_calles_law_desc: "Calles menghasut Cristeros untuk memberontak dengan menerapkan pasal-pasal anti-agama dalam Konstitusi secara keras. UU Calles mempermalukan ulama dengan melarang penggunaan pakaian ulama di depan umum dan hukuman penjara bagi tokoh agama yang mengkritik pemerintah. Kami setuju bahwa pengaruh politik Gereja perlu dibatasi namun hal ini merupakan serangan terhadap kebebasan individu, bukan kekuasaan Gereja."
 MEX_focus_abolish_capital_punishment: "Hapuskan Hukuman Mati"
 MEX_focus_abolish_capital_punishment_desc: "Ketidakstabilan yang terjadi akibat pemberontakan militer, pemberontakan petani, dan Perang Cristero, serta respons berdarah pemerintah terhadap hal-hal tersebut dan terhadap 'kejahatan' yang lebih kecil, telah menimbulkan suasana ketakutan yang menyelimuti Meksiko. Masyarakat tidak bisa lagi berbicara bebas karena takut dizalimi negara. Kita harus menghapuskan hukuman mati secara bertahap. Dengan melonggarkan cengkeraman kita, orang tidak lagi merasa harus melepaskan diri darinya."
 MEX_focus_enforce_the_calles_law: "Menegakkan Hukum Calles"
 MEX_focus_enforce_the_calles_law_desc: "Para prajurit Cristero mungkin tidak dihancurkan di lapangan, namun pada tahun-tahun setelah pemberontakan mereka yang sia-sia, kami memburu para pemimpin dan simpatisan mereka yang tersisa di dalam Gereja, memenggal gerakan mereka dan memastikan tidak ada kebangkitan kembali. Gereja tidak punya pilihan selain menerima tuntutan kami terhadap mereka. Mereka akan menjadi instrumen kekuasaan negara atau kita akan terus memenggal kepala mereka."
 MEX_focus_triumph_over_the_cristeros: "Kemenangan atas Cristeros"
 MEX_focus_triumph_over_the_cristeros_desc: "Banyak individu berbakat yang mencapai puncak selama kampanye anti-Cristero. Memerangi pemberontak dengan taktik unit kecil dan dukungan udara memberikan kesempatan bagus bagi para jenderal kita untuk menguji kemampuan mereka. Kampanye penindasan juga membuat kita melihat siapa yang ingin melakukan pekerjaan yang lebih berantakan."
 MEX_focus_state_education: "Pendidikan Negara"
 MEX_focus_state_education_desc: "Pendidikan sosialis di Meksiko berarti fokus pada rasionalisme dan patriotisme, dibandingkan kepatuhan terhadap dogma dan diktat Paus. Kita hanya perlu memberikan satu generasi pemuda Meksiko pendidikan anti-Gereja yang baik dan dukungan populer mereka akan hilang dalam sekejap. Orang-orang tidak akan mentolerir pendeta yang bersifat parasit ketika mereka tahu bahwa dunia yang berbeda mungkin terjadi."
 MEX_focus_xefo: "XEFO"
 MEX_focus_xefo_desc: "Pemerintah telah membangun tiang radio dan mendirikan stasiun di seluruh negeri. Hal ini berguna untuk menyebarkan propaganda tetapi juga mendekatkan masyarakat pedesaan satu sama lain. XEFO adalah salah satu stasiun radio yang dijalankan oleh Partido Nacional Revolucionario."
 MEX_focus_law_on_industrial_promotion: "Undang-undang tentang Promosi Industri"
 MEX_focus_law_on_industrial_promotion_desc: "Selama bertahun-tahun, negara bagian dan pemerintah federal Meksiko berupaya mendorong pengembangan industri baru melalui pembebasan pajak. Seringkali peraturan daerah bertentangan dengan kepentingan nasional karena mengalihkan modal ke bidang yang tidak penting atau tidak efisien. Kita perlu merasionalisasi pendekatan kita terhadap pembangunan industri dengan rencana terpusat."
 MEX_focus_nafinsa: "NAFINSA"
 MEX_focus_nafinsa_desc: "Nacional Financiera adalah bank pembangunan yang didirikan untuk mendorong industrialisasi Meksiko. Hal ini sangat penting dalam pembangunan pabrik-pabrik baru di negara bagian Meksiko tengah, seperti pabrik kimia dan pabrik logam di Mexico City."
 MEX_focus_engineering_school: "Sekolah Teknik"
 MEX_focus_engineering_school_desc: "Bagian dari Institut Politeknik Nasional di Mexico City, Escuela Superior de Ingenería Mecánica y Eléctrica sedang melatih generasi baru pionir di bidang teknik mesin dan elektronik."
 MEX_focus_television_innovators: "Inovator Televisi"
 MEX_focus_television_innovators_desc: "Meksiko memiliki industri elektronik yang sangat maju. Guillermo González Camarena dan anggota 'League of Radio Experiments' lainnya sedang bereksperimen dengan transmisi televisi berwarna. Kita bisa menjadi pemimpin dunia dalam teknologi komunikasi jika kita fokus pada perkembangan ini."
 MEX_focus_antidisestablishmentarianism: "Antidisbuildingtarianisme"
 MEX_focus_antidisestablishmentarianism_desc: "Iman Sejati telah disalahgunakan oleh junta 'Revolusioner' selama beberapa dekade. Gereja, biara, dan relikwi secara resmi dimiliki oleh negara, dan para pendeta memerlukan izin dari pemerintah untuk merawat umat mereka. Beberapa negara bagian memiliki satu imam untuk puluhan ribu umat. Mari kita hilangkan persyaratan ini dan izinkan Gereja untuk memiliki properti sekali lagi."
 MEX_focus_rewrite_the_constitution: "Menulis ulang UUD 1917"
 MEX_focus_rewrite_the_constitution_desc: "Konstitusi yang ditulis oleh para jenderal yang kejam menempatkan negara di atas Gereja, menjadikan pernikahan sebagai tindakan sipil, menghalangi para pendeta untuk mendukung kandidat politik, dan menolak mengakui Gereja Katolik sebagai sumber otoritas moral di Meksiko. Kita harus mengatasi ketidakkonsistenan ini dengan secara formal menetapkan Iman Katolik sebagai agama negara."
 MEX_focus_legion_of_christ: "Legiun Kristus"
 MEX_focus_legion_of_christ_desc: "Kami sedang memperbaiki kesalahan 'Revolusi' dengan semangat tak kenal lelah yang sesuai dengan agen-agen Kristus, namun kami baru saja memulainya. Kami membutuhkan sebuah organisasi untuk mencari dan menghukum para penjahat yang menyerang Gereja Suci. Seperti yang dikatakan dalam Kitab Keluaran: mata ganti mata, hidup ganti hidup."
 MEX_focus_crusade_against_atheism: "Perang Salib Melawan Atheisme"
 MEX_focus_crusade_against_atheism_desc: "Sebagian besar pemimpin Cristero diburu dan dibunuh oleh pemerintah pada awal tahun 1930an. Namun, ada beberapa yang lolos dari pembersihan dan siap memimpin Umat Beriman Meksiko sekali lagi. Hidup Kristus Raja dan Santa Maria dari Guadalupe!"
 MEX_focus_knights_of_columbus: "Ksatria Columbus"
 MEX_focus_knights_of_columbus_desc: "Selama Perang Cristero, ketika pelanggaran dilakukan oleh kedua belah pihak, persaudaraan internasional Knights of Columbus turun tangan untuk membantu kami. Awalnya mereka diam-diam mengumpulkan sumbangan untuk mendanai dan mempersenjatai Cristeros. Setelah para uskup Meksiko mengingkari pemberontakan tersebut, para Ksatria melobi pemerintah Amerika untuk mengadakan negosiasi yang akhirnya mengakhiri perang."
 MEX_focus_catholic_politics: "Politik Katolik"
 MEX_focus_catholic_politics_desc: "Sebagian besar partai politik di Meksiko didominasi oleh kelompok antiklerikal yang memperoleh kekuasaan setelah revolusi tahun 1911. Jika kita, umat Katolik, ingin mengambil dan mempertahankan kekuasaan secara legal, maka pembentukan partai Misa yang saleh akan diperlukan."
 MEX_focus_social_catholicism: "Katolik Sosial"
 MEX_focus_social_catholicism_desc: "Sebuah doktrin agama politik yang berasal dari awal tahun 1900-an, Katolik Sosial menekankan pada meringankan beban masyarakat miskin dengan menyerang penyebab kemiskinan. Ketidakadilan yang disebabkan oleh kapitalisme industri yang tidak terkekang memerlukan tanggapan yang koheren dari Gereja, dan para pemimpin agama progresif di Meksiko akan melakukan yang terbaik untuk menyelesaikannya."
 MEX_focus_church_schools: "Sekolah Gereja"
 MEX_focus_church_schools_desc: "Para jenderal Revolusioner berupaya mencuci otak kaum muda di kamp-kamp pendidikan ulang sosialis yang mereka sebut sekolah. Kita harus sekali lagi menempatkan agama di kelas, dengan para pendeta dan biarawati mendidik anak-anak kita."
 MEX_focus_triumph_of_synarchism: "Kemenangan Sinarkisme"
 MEX_focus_triumph_of_synarchism_desc: "Benar-benar dikalahkan, musuh-musuh kita bersembunyi di balik bayang-bayang seperti kaki tangan Setan. Kita sekarang mempunyai kebebasan untuk menjamin rekonstruksi negara sedemikian rupa sehingga menjamin kesatuan baik dalam keyakinan maupun kemauan politik."
 MEX_focus_reform_the_cristero_guard: "Reformasi Pengawal Cristero"
 MEX_focus_reform_the_cristero_guard_desc: "Keluarga Cristeros dengan gagah berani membela Gereja dari penindasan Calles sang tiran dan banyak dari mereka mati sebagai martir di bawah panji Kristus. Sekarang setelah kekuatan Gereja Suci dipulihkan, mereka harus diorganisasi kembali untuk menjadi pelindung bersenjata Kristus."
 tooltip_mexico_reform_the_cristero_guard: "Reformasi §YCristero Guard§!:\nSebarkan §Y8 Divisi§! dari §Y10 batalyon Infanteri§! dan Dukungan §YArtileri§!"
 MEX_focus_synarchist_youth: "Pemuda Sinarkis"
 MEX_focus_synarchist_youth_desc: "Generasi muda adalah masa depan bangsa kita. Jika mereka dididik dengan baik, mereka akan menjadi perwujudan cita-cita kita - kekuatan, kesetiaan, dan kesalehan."
 MEX_focus_synarchist_communes: "Komune Sinarkis"
 MEX_focus_synarchist_communes_desc: "Kini setelah pikiran masyarakat diselamatkan dari 'kaum Revolusioner' dan umat beriman berbondong-bondong kembali ke gereja-gereja yang telah dikonsekrasikan kembali, rencana ekonomi kita dapat dilaksanakan. Unit-unit produksi baru akan memungkinkan umat beriman untuk melayani tujuan nasional dan Gereja sambil merasakan kesatuan dalam iman dan pikiran."
 MEX_focus_revolutionary_women: "Wanita Revolusioner"
 MEX_focus_revolutionary_women_desc: "Secara tradisional dikaitkan dengan pekerjaan rumah tangga, perempuan juga telah melakukan pekerjaan industri selama beberapa dekade di Meksiko. Industri tembakau, kopi, dan pakaian jadi cenderung mempekerjakan sebagian besar perempuan, meskipun hal ini menimbulkan perselisihan dengan gerakan serikat buruh yang didominasi laki-laki. Laki-laki sudah mempunyai hak atas upah yang sama, pekerjaan yang sama, dan upah minimum – kita juga harus menegakkan hak ini bagi perempuan."
 MEX_focus_womens_suffrage: "Hak Pilih Perempuan"
 MEX_focus_womens_suffrage_desc: "Banyak legislator dan menteri kabinet pada pemerintahan Revolusioner menentang perluasan hak memilih perempuan karena mereka yakin perempuan akan lebih mudah terpengaruh oleh argumen para ulama dan akan mengakhiri program sekularisasi. Apa pun yang terjadi di masa lalu, kita tidak bisa menghalangi kemajuan."
 MEX_focus_soldaderas: "Soldadera"
 MEX_focus_soldaderas_desc: "Sebagai bagian ikonik dari Revolusi, tentara wanita bertempur secara reguler dan beberapa diantaranya dipromosikan ke posisi perwira junior. Mereka sangat penting untuk logistik pasukan Revolusioner yang mempunyai persediaan terbatas."
 MEX_focus_ban_political_militias: "Larang Milisi Politik"
 MEX_focus_ban_political_militias_desc: "Kelompok paramiliter sayap kiri dan kanan mengaku sebagai patriot yang memerangi pengkhianat nasional, namun sebenarnya mereka adalah pion kekuatan asing yang berupaya mengacaukan negara untuk tujuan jahat. Pemerintah harus menindak milisi fasis dan komunis."
 MEX_focus_depoliticised_army: "Tentara yang Didepolitisasi"
 MEX_focus_depoliticised_army_desc: "Para jenderal tidak punya hak atas kesetiaan prajuritnya. Sumber legitimasi utama adalah negara bagian Meksiko. Kita harus mencegah para jenderal memikirkan pemberontakan dengan merotasi mereka antar provinsi sehingga mereka tidak dapat membangun jaringan patronase atau menjamin kesetiaan pribadi prajurit mereka."
 MEX_focus_professional_army: "Escuela Superior de Guerra"
 MEX_focus_professional_army_desc: "Kita tidak bisa mengandalkan tentara ad hoc untuk menyediakan pasukan di lapangan, kita memerlukan depot pasokan dan korps logistik. Di Sekolah Militer, panglima dan perwira militer kita akan memperoleh pengetahuan militer tingkat lanjut yang memungkinkan mereka mengembangkan sistem pasokan yang efisien.\nPada titik ini, bahkan keledai saja sudah lebih baik dibandingkan membiarkan pasukan mencari perbekalan untuk diri mereka sendiri."
 MEX_focus_legacy_of_revolution: "Warisan Revolusi"
 MEX_focus_legacy_of_revolution_desc: "Hasil Revolusi harus dipertahankan dan pengkhianat nasional harus dibasmi. Para jenderal berada di garis depan perjuangan ini. Mereka melihat kesulitan yang dihadapi pemerintah setiap hari di lapangan. Kita harus memberi mereka keleluasaan lebih dalam menegakkan aturan negara."
 MEX_focus_the_gold_shirts: "Kemeja Emas"
 MEX_focus_the_gold_shirts_desc: "Jenderal Nicolás Rodríguez Carrasco membentuk Kaos Emas pada tahun 1933 untuk mengalahkan pengkhianat komunis yang bekerja melawan pemerintah. Kelompok paramiliter harus menjadi sayap pemerintah karena tujuan mereka mengagumkan dan metode mereka diperlukan."
 MEX_focus_revanchist_revolution: "Revolusi Revankis"
 MEX_focus_revanchist_revolution_desc: "Rakyat Meksiko telah lama dianiaya oleh agresi Yanqui dan infiltrasi komunis, namun kami telah mengatasi hambatan-hambatan terhadap persatuan nasional dan membentuk negara yang kuat dengan pemimpin yang kuat. Kita sekarang harus memperbaiki kesalahan yang diderita Meksiko di masa lalu."
 trotsky_not_welcome_in_mexico: "Iklim Politik Tidak Menguntungkan Trotsky"
 MEX_focus_the_red_shirts: "Kaos Merah"
 MEX_focus_the_red_shirts_desc: "Gubernur Tomás Garrido Canabal membentuk Kaos Merah pada tahun 1930 untuk membela Revolusi melawan Gereja Katolik dan para pendeta reaksionernya. Mencari dan menghancurkan musuh-musuh rakyat adalah tujuan yang baik, jadi kita harus memasukkan Kaus Merah ke dalam militer dalam kapasitas tertentu."
 MEX_focus_communist_revolution: "Revolusi Komunis"
 MEX_focus_communist_revolution_desc: "Revolusi melawan Díaz telah berubah menjadi Revolusi Sosial sejati yang akan menyelesaikan kontradiksi kapitalisme dengan menghapuskan produksi untuk pertukaran dan membuka cara hidup yang baru."
 MEX_focus_hispanic_culture: "Budaya Hispanik"
 MEX_focus_hispanic_culture_desc: "Negara-negara Amerika Latin memiliki budaya yang kuat, yang terbentuk dari penaklukan dan kelangsungan hidup, pemberontakan dan pemerintahan yang tegas. Budaya bersama kita adalah sumber kebanggaan dan cahaya penuntun bagi kemajuan kita di masa depan."
 MEX_focus_revolutionary_class_war: "Perang Kelas Revolusioner"
 MEX_focus_revolutionary_class_war_desc: "Hanya kaum Proletariat, yang dipersenjatai dan diorganisir sebagai tentara kelas, yang akan mampu mempertahankan dan menyebarkan cita-cita Revolusi."
 faction_mexico_4th_international: "Internasional ke-4"
 MEX_focus_smash_the_bureaucrats: "Hancurkan Birokrat"
 MEX_focus_smash_the_bureaucrats_desc: "Setelah kematian Lenin, birokrasi korup yang dipimpin oleh Stalin membentuk rezim Bonapartis di Uni Soviet dan mencuri kekuasaan dari kaum pekerja. Oleh karena itu, Uni Soviet telah berubah menjadi negara buruh yang merosot dan memutarbalikkan cita-cita Revolusi."
 MEX_focus_liberate_the_antilles: "Bebaskan Antilles"
 MEX_focus_liberate_the_antilles_desc: "Banyak kepulauan Karibia yang masih diduduki oleh kekuatan imperialis yang terus melakukan eksploitasi opresif yang terus berlanjut sejak ditemukannya benua Amerika. Kami akan mengakhiri ketidakadilan kolonialisme selamanya!"
 MEX_focus_one_world_government: "Satu Pemerintahan Dunia"
 MEX_focus_one_world_government_desc: "Kini setelah tirani Stalin dilenyapkan, kita dapat meyakinkan sebagian pendukungnya untuk melakukan kritik diri dan bergabung dengan komunitas bangsa yang benar-benar terbebas dari penindasan reaksioner."
 tooltip_socialist_marine_corps: "Korps Marinir Sosialis"
 MEX_focus_international_struggle: "Perjuangan Internasional"
 MEX_focus_international_struggle_desc: "Kita tidak sendirian dalam perjuangan melawan musuh ideologis kita. Kita mempunyai banyak sekutu potensial di luar negeri yang bisa kita hubungi. Kita harus membantu mereka merebut kekuasaan untuk menciptakan blok besar sekutu potensial yang pada gilirannya akan membantu kita."
 MEX_focus_spanish_civil_war_refugees: "Pengungsi Perang Saudara Spanyol"
 MEX_focus_spanish_civil_war_refugees_desc: "Kebakaran besar yang melanda Spanyol menyebabkan puluhan ribu warga Spanyol mengungsi. Banyak dari mereka adalah para intelektual Spanyol, atau personel teknis yang berketerampilan tinggi. Dengan memberi mereka perlindungan, kami akan memenuhi tugas kemanusiaan kami dan pada saat yang sama memberikan manfaat bagi Meksiko."
 tooltip_spanish_civil_war_technical_knowledge: "Pengetahuan teknis Perang Saudara Spanyol"
 scw_over: "Perang Saudara Spanyol telah berakhir"
 MEX_focus_falangist_veterans: "Veteran Falang"
 MEX_focus_falangist_veterans_desc: "Falangist adalah organisasi paramiliter fasis di Spanyol. Mereka berjuang demi Tuhan dan Bangsa, meski banyak dari mereka adalah penganut paham monarki, dan hal ini sangat disesalkan. Namun demikian, kita harus menjalin kontak dengan para veteran Falangis dalam Perang Saudara Spanyol dan belajar dari pengalaman mereka."
 tooltip_falangist_veterans_doctrine_knowledge: "Pengetahuan doktrin Veteran Falang"
 falangist_veterans_opinion: "Veteran Falang"
 MEX_focus_support_spains_loyalists: "Dukung Loyalis Spanyol"
 MEX_focus_support_spains_loyalists_desc: "Pemerintahan Republik di Spanyol telah dipilih secara demokratis dan kini menghadapi pemberontakan oleh para pengkhianat 'nasionalis', yang hanya mencari kekuasaan pribadi dan jelas-jelas membenci rakyat biasa di Spanyol. Kita harus mendukung kaum Loyalis dengan mengirimkan bantuan kepada mereka dan membela mereka di Liga Bangsa-Bangsa, yang sedang berusaha mengembargo pemerintah Republik yang sedang diperangi."
 loyalist_spanish_government_support_opinion: "Dukungan untuk Pemerintah Republik Spanyol"
 MEX_focus_liberate_the_caribbean: "Bebaskan Karibia"
 MEX_focus_liberate_the_caribbean_desc: "Seperti negara-negara Amerika Latin lainnya, negara-negara Karibia dieksploitasi dengan kejam oleh imperialis Eropa sebelum melepaskan belenggu mereka. Meskipun masih lemah, negara-negara ini layak mendapatkan perlindungan kita. Kebanggaan nasional Meksiko menuntut kita mengamankan Karibia untuk mencegah eksploitasi oleh imperialis!"
 threat_mexico_pressure_the_caribbean: "Ancaman Meksiko terhadap Karibia"
 MEX_focus_integrate_the_caribbean: "Integrasikan Karibia"
 MEX_focus_integrate_the_caribbean_desc: "Republik-republik kecil di Karibia sedang diserap ke dalam negara bagian Meksiko, dan sekarang giliran masyarakat Karibia. Mereka akan menjadi warga negara Meksiko yang setia karena mereka menjunjung tinggi tradisi kami dan pada gilirannya menerima manfaat menjadi bagian dari komunitas bangsa Meksiko."
 MEX_focus_hispanic_alliance: "Aliansi Hispanik"
 MEX_focus_hispanic_alliance_desc: "Penguasa kami adalah keturunan semenanjung, penjajah yang membawa peradaban ke Dunia Baru. Spanyol, dengan tradisi kekuasaan Gereja yang kuat dan elite yang memiliki tanah, pernah menjadi sumber legitimasi. Saat ini, Spanyol semakin tidak terlihat seperti pemimpin dunia Latin. Kita harus mengambil tanggung jawab ini dan menciptakan ikatan yang lebih kuat di seluruh benua dengan menggunakan Hispanik sebagai landasannya."
 faction_mexico_hispanic_alliance: "Aliansi Hispanik"
 faction_mexico_synarchist_pact: "Pakta Sinarkis"
 MEX_focus_propaganda_pact: "Pakta Propaganda"
 MEX_focus_propaganda_pact_desc: "Ancaman Komunisme semakin besar di benak para patriot Hispanik yang setia. Dengan sekutu baru kami, kami akan memberikan tembok bayonet terhadap ancaman berbahaya Bolshevik. Mari kita pamerkan persatuan dan persaudaraan kita di hadapan rakyat Meksiko untuk meyakinkan mereka akan kepastian kemenangan total atas musuh yang mereka benci!"
 MEX_focus_invite_brazil: "Undang Brasil"
 MEX_focus_invite_brazil_desc: "Meskipun, sebagai bekas jajahan Portugis, sejarah Brasil tidak sepenuhnya mencerminkan sejarah Meksiko, secara budaya mereka masih lebih dekat dengan kita dibandingkan dengan imperialis Eropa yang penuh dendam atau pengusaha Yanqui yang rakus. Kita harus mendekatkan mereka ke lingkungan kita agar dapat memperoleh manfaat dari perlindungan timbal balik."
 MEX_focus_realpolitik: "Realpolitik"
 MEX_focus_realpolitik_desc: "Kami mempunyai keyakinan ideologis, namun Meksiko sebagai sebuah negara mempunyai kepentingannya sendiri yang terpisah dari perjuangan internasional. Kita perlu mengambil langkah yang hati-hati dalam masa-masa penuh gejolak di masa depan. Satu langkah yang salah dapat menjatuhkan beban penuh pada calon imperialis dan tiran."
 MEX_focus_bolivarian_alliance: "Aliansi Bolivarian"
 MEX_focus_bolivarian_alliance_desc: "Simón Bolívar memimpin koloni Spanyol di Amerika Selatan menuju kemerdekaan, menciptakan Gran Colombia. Dia dianggap sama di Selatan dengan pejuang kemerdekaan seperti Miguel Hidalgo dan Mariano Matamoros di Meksiko. Salah satu mimpinya adalah penyatuan negara-negara Amerika Latin melawan eksploitasi imperialis Eropa dan Yanqui. Kita bisa mewujudkan mimpi itu."
 faction_mexico_bolivarian_alliance: "Aliansi Bolivarian"
 MEX_focus_coastal_defence_plan: "Rencana Pertahanan Pesisir"
 MEX_focus_coastal_defence_plan_desc: "Amerika menunjukkan kepada kita pada tahun 1846 bahwa, meskipun kita memiliki gurun dan pegunungan yang memberi kita kedalaman strategis di utara, sisi pesisir kita rentan terhadap invasi amfibi. Kita harus menambahkan pertahanan pesisir ke pelabuhan dan kota di Teluk dan Pasifik."
 MEX_focus_rescind_the_mexican_cession: "Membatalkan Penyerahan Meksiko"
 MEX_focus_rescind_the_mexican_cession_desc: "Luasnya wilayah yang dikuasai agresor Utara pada tahun 1848 terus menggoda sejumlah nasionalis Meksiko. Saat ini terdapat jutaan orang Hispanik yang tinggal di Amerika Serikat, sebagian merupakan keturunan penduduk asli Meksiko, sebagian lagi merupakan migran baru. Kita harus menebus kehormatan Meksiko dengan menghancurkan agresor Yanqui dan menyatukan rakyat Meksiko!"
 threat_mexico_rescind_cession: "Meksiko Membatalkan Penyerahan ke Amerika"
 MEX_focus_redeem_aztlan: "Tebus Aztlan"
 MEX_focus_redeem_aztlan_desc: "Masyarakat Meksiko yang tinggal di wilayah-wilayah pembebasan di Amerika Serikat memimpikan sebuah pemerintahan yang tidak menindas mereka karena nenek moyang, tempat lahir atau bahasa yang mereka gunakan di rumah. Mimpi itu telah menjadi kenyataan."
 ENG_parachute_regiments: "Depot Pasukan Lintas Udara"
 ENG_parachute_regiments_desc: "Menyusul keberhasilan operasi lintas udara awal di wilayah musuh, jelas bahwa resimen parasut adalah masa depan. Pembentukan fasilitas dan peralatan pelatihan khusus akan membantu kami mengadopsi teknologi baru ini ke dalam strategi kami secara keseluruhan."
 ENG_special_air_service: "Layanan Udara Khusus"
 ENG_special_air_service_desc: "Seorang perwira bernama David Stirling mengemukakan gagasan bahwa unit komando kecil mungkin mampu mengganggu musuh di belakang garis mereka, dan menyebabkan kerusakan yang sangat besar. Menamakan mereka 'Layanan Udara' memiliki manfaat tambahan karena membuat musuh percaya bahwa mereka juga harus bertahan melawan pasukan terjun payung. Ide ini mungkin ada manfaatnya."
 ENG_chiefs_of_staff_committee: "Ketua Komite Staf"
 ENG_chiefs_of_staff_committee_desc: "Kita harus memberdayakan para pemimpin berbagai cabang militer untuk melakukan perang ini sesuai dengan apa yang mereka anggap terbaik. Kepala Staf Gabungan, yang awalnya dibentuk pada tahun 1923, kini akan diberikan sarana untuk mengoordinasikan operasi di seluruh dunia, dan melapor langsung ke Kabinet Perang. Hal ini akan sangat menyederhanakan perencanaan operasi militer."
 ENG_revisit_colonial_policy: "Tinjau Kembali Kebijakan Kolonial"
 ENG_revisit_colonial_policy_desc: "Waktu sedang berubah. Jelas bahwa gerakan kemerdekaan hanya akan terus bermunculan di seluruh kekaisaran, dan dalam perwujudan yang semakin kuat. Jika kita tidak ingin dipaksa untuk mengerahkan sumber daya yang semakin besar untuk menekan gerakan-gerakan ini, maka kita harus mengakui bahwa Kerajaan kita telah mencapai tujuannya, dan sekarang kita harus diizinkan untuk menemukan jalannya sendiri ke dunia ini."
 ENG_guide_the_colonies: "Pandu Koloni"
 ENG_guide_the_colonies_desc: "Mengambil langkah pertama menuju kemerdekaan penuh, setelah sekian lama berada di bawah kendali kita, tidaklah mudah. Dominion kami membutuhkan bantuan kami dalam merestrukturisasi pemerintahan mereka, sehingga mereka dapat berfungsi dengan baik ketika mereka benar-benar independen seperti sekarang, di bawah bimbingan kami."
 ENG_towards_dominion_independence: "Menuju Kemerdekaan Dominion"
 ENG_towards_dominion_independence_desc: "Setelah melakukan restrukturisasi pemerintahan Dominion, kita sekarang harus membantu negara kita dalam mengambil langkah terakhir menuju pemutusan hubungan resmi mereka dengan Westminster. Kemungkinan besar kita akan melihat periode migrasi massal, karena mereka yang lebih memilih untuk terus menjadi bagian dari [Root.GetNameDef] akan berimigrasi."
 ENG_foundations_for_an_indian_state: "Yayasan untuk Negara Bagian India"
 ENG_foundations_for_an_indian_state_desc: "Jika ingin berfungsi sebagai negara merdeka, kita harus berupaya meningkatkan industrialisasi India, serta merestrukturisasi pemerintahan mereka secara drastis. Tantangan dalam mengatur seluruh anak benua, seperti yang telah kami temukan, bukanlah tantangan yang sederhana, dan India harus siap jika ingin berhasil."
 ENG_the_three_nation_solution: "Solusi Tiga Negara"
 ENG_the_three_nation_solution_desc: "Perbedaan budaya dan agama sangat ekstrim di seluruh anak benua India. Sudah ada pertentangan antara berbagai kelompok dengan loyalitas berbeda. Daripada mengelompokkan semuanya ke dalam satu negara bagian, mungkin solusi yang lebih baik adalah dengan membagi anak benua tersebut menjadi tiga negara bagian. Hindu India, Muslim Pakistan di barat laut, dan Muslim Bangladesh di timur laut."
 ENG_towards_indian_independence: "Menuju Kemerdekaan India"
 ENG_towards_indian_independence_desc: "Waktunya telah tiba untuk membawa India menuju kemerdekaan. Kami akan mulai secara bertahap mengalihkan tugas-tugas pemerintahan, meningkatkan otonomi mereka sebagai persiapan menuju kemerdekaan penuh."
 ENG_withdraw_from_contested_territories: "Mundur dari Wilayah yang Diperebutkan"
 ENG_withdraw_from_contested_territories_desc: "Sejumlah wilayah di seluruh dunia, yang dianggap sebagai bagian dari Wilayah Luar Negeri Inggris, diklaim oleh negara-negara tetangga. Hal ini menyebabkan ketegangan diplomatik, sehingga mungkin lebih baik untuk menilai kembali status mereka sebagai wilayah yurisdiksi Inggris."
 ENG_self_government_for_the_mediterranean: "Pemerintahan Sendiri Untuk Mediterania"
 ENG_self_government_for_the_mediterranean_desc: "Negara-negara di Mediterania siap menerima otonomi luas sebagai persiapan kemerdekaan penuh. Hal ini kemungkinan besar akan mengakibatkan masuknya imigran yang ingin memperoleh kewarganegaraan Inggris sebelum kemerdekaan diresmikan."
 ENG_self_government_for_africa: "Pemerintahan Sendiri Untuk Afrika"
 ENG_self_government_for_africa_desc: "Negara-negara di Afrika siap menerima otonomi luas sebagai persiapan kemerdekaan penuh. Hal ini kemungkinan besar akan mengakibatkan masuknya imigran yang ingin memperoleh kewarganegaraan Inggris sebelum kemerdekaan diresmikan."
 ENG_self_government_for_the_middle_east: "Pemerintahan Sendiri Untuk Timur Tengah"
 ENG_self_government_for_the_middle_east_desc: "Negara-negara di Timur Tengah siap menerima otonomi luas sebagai persiapan kemerdekaan penuh. Hal ini kemungkinan besar akan mengakibatkan masuknya imigran yang ingin memperoleh kewarganegaraan Inggris sebelum kemerdekaan diresmikan."
 ENG_self_government_for_the_americas: "Pemerintahan Sendiri Untuk Amerika"
 ENG_self_government_for_the_americas_desc: "Negara-negara di benua Amerika siap menerima otonomi luas sebagai persiapan kemerdekaan penuh. Hal ini kemungkinan besar akan mengakibatkan masuknya imigran yang ingin memperoleh kewarganegaraan Inggris sebelum kemerdekaan diresmikan."
 ENG_self_government_for_asia: "Pemerintahan Sendiri Untuk Asia"
 ENG_self_government_for_asia_desc: "Negara-negara di Asia siap menerima otonomi luas sebagai persiapan kemerdekaan penuh. Hal ini kemungkinan besar akan mengakibatkan masuknya imigran yang ingin memperoleh kewarganegaraan Inggris sebelum kemerdekaan diresmikan."
 ENG_decolonization: "Dekolonisasi"
 ENG_decolonization_desc: "Ini adalah akhir dari sebuah era, tapi akhir dari pilihan kita. Daripada menderita penghinaan karena sia-sia berjuang melawan kebangkitan gerakan kemerdekaan yang tak terbendung, kami justru menjunjung tinggi kepala dan, dengan bangga, telah membimbing mereka yang berada di bawah perlindungan kami sejauh yang kami bisa. Sekarang, yang tersisa hanyalah memutus ikatan yang tersisa dan menyambut ketergantungan kita pada kancah dunia dengan setara."
 ENG_decolonized: "Inggris telah melakukan dekolonisasi"
 ENG_the_winds_of_change: "Angin Perubahan"
 ENG_the_winds_of_change_desc: "Kini dengan dekolonisasi yang mendekati puncaknya, angin perubahan bertiup semakin kencang di seluruh dunia. Jika kita ingin mengamankan masa depan pulau-pulau kita, kita harus melakukan upaya untuk mengevakuasi dan mengambil aset-aset bekas kolonial kita dan membawanya pulang."
 ENG_royal_malay_regiment_focus: "Perluas Resimen Kerajaan Melayu"
 ENG_royal_malay_regiment_focus_desc: "Pada tahun 1920, penguasa lokal di seluruh wilayah Melayu kami mendesak kantor kolonial kami untuk membentuk resimen infanteri dari penduduk kolonial. Meskipun pasukan ini telah disetujui dan kompi pertama telah didirikan, pasukan ini masih terlalu kecil untuk dianggap sebagai kekuatan tempur. Kita harus memperluas resimen, dan memastikan kita dapat melindungi Singapura dan Malaya secara memadai pada saat perang."
 ENG_territorial_army_of_malaysia_focus: "Menyatukan Tentara Teritorial Malaysia"
 ENG_territorial_army_of_malaysia_focus_desc: "Kekuatan protektorat Melayu kita sangat terdesentralisasi dan tidak efisien. Kita harus mengubahnya dengan menyatukan berbagai Korps Senapan Relawan, pasukan militer lokal, dan resimen federasi menjadi satu struktur tentara yang bersatu."
 ENG_south_east_asia_air_command_focus: "Membentuk Komando Udara, Asia Tenggara"
 ENG_south_east_asia_air_command_focus_desc: "RAF Singapura tidak mempunyai perlengkapan yang memadai untuk melindungi langit di seluruh koloni kami di Timur Jauh. Kapten Grup Henry Cave-Browne-Cave telah meminta kami memperluas fasilitas di wilayah tersebut dan mendirikan cabang udara baru yang berkantor pusat di RAF Changi di Singapura."
 ENG_sarawakrangers_focus: "Perkuat Rangers Sarawak"
 ENG_sarawakrangers_focus_desc: "Penjaga Sarawak yang bertugas melindungi Raj Sarawak, dipimpin oleh Charles Vyner Brooke, terampil bertarung di medan hutan yang berat. Kita harus memanfaatkan pengetahuan mereka, serta memperkuat kekuatan mereka sehingga kita dapat mempertahankan kendali atas Kalimantan Utara."
 ENG_east_indies_fleet_focus: "Membentuk Armada Hindia Timur"
 ENG_east_indies_fleet_focus_desc: "Pada tahun 1904 Penguasa Laut Pertama, Laksamana Sir John Fisher, memerintahkan agar tiga komando utama di Timur Jauh, Skuadron Hindia Timur, Stasiun China, dan Skuadron Australia, semuanya harus berada di bawah satu komando yang disebut Armada Timur yang berbasis di Singapura jika terjadi perang. Dengan meningkatnya ketegangan di kawasan ini, tampaknya bijaksana untuk memulai persiapan guna mewujudkan hal ini."
 ENG_steady_as_she_goes: "Mantap Saat Dia Pergi"
 ENG_steady_as_she_goes_desc: "Krisis yang kian memuncak adalah alasan mengapa kita harus tetap setia pada akar permasalahan kita. Kami akan melanjutkan jalur yang telah kami tempuh dalam beberapa tahun terakhir, daripada melakukan perubahan politik drastis yang dapat menyebabkan ketidakstabilan internal ketika kami tidak mampu menanggungnya."
 ENG_global_defense: "Pertahanan Global"
 ENG_global_defense_desc: "Melindungi rakyat Inggris dimulai dengan mencegah penyebaran penyakit yang dapat mengancamnya. Kita harus menemukan sumber konflik dan memadamkannya sebelum menjadi konflik yang menyebar jauh dan luas, membakar rumah kita."
 ENG_every_man_will_do_his_duty: "Setiap Orang Akan Melakukan Tugasnya"
 ENG_every_man_will_do_his_duty_desc: "Sesuai dengan semangat kata-kata Nelson yang terkenal, kita harus menanamkan rasa tanggung jawab pada masyarakat. Suka atau tidak suka, bangsa ini membutuhkan jasa mereka dalam menghadapi krisis yang akan datang."
 ENG_motion_of_no_confidence: "Mosi Tidak Percaya Diri"
 ENG_motion_of_no_confidence_desc: "Pemerintah saat ini telah gagal dalam upayanya meredakan krisis dunia yang sedang terjadi. Upaya lebih lanjut untuk melakukan hal tersebut hanyalah tanda kelemahan. Kita memerlukan kepemimpinan yang lebih kuat agar kita dapat menghadapi badai yang akan datang."
 ENG_no_further_appeasement: "Tidak Ada Ketenangan Lebih Lanjut"
 ENG_no_further_appeasement_desc: "Upaya untuk meredakan ketegangan telah gagal, dan melanjutkan kebijakan ini sekarang adalah sebuah kebodohan. Jelas bahwa musuh-musuh kita tidak akan mundur dan terus menuntut lebih banyak lagi. Kita harus menghentikan mereka sekarang, sebelum kita memberi mereka lebih banyak keuntungan."
 ENG_no_further_appeasement_tt: "Tetapkan aturan: £trigger_yes£Can membenarkan dan menyatakan perang terhadap negara yang mempunyai kelompok ideologi yang sama.\nTetapkan aturan: £trigger_yes£Can boneka suatu negara."
 ENG_kickstart_the_war_industry: "Memulai Industri Perang"
 ENG_kickstart_the_war_industry_desc: "Waktu sangatlah penting, dan kita tidak bisa menunggu pertumbuhan alami dalam industri perang kita. Kita harus melakukan investasi besar untuk pembangunan pabrik tambahan secara cepat, jika kita ingin siap berperang."
 ENG_secure_the_oil_imports: "Amankan Impor Minyak"
 ENG_secure_the_oil_imports_desc: "Kita tidak bisa bergantung pada sifat perjanjian dagang yang berubah-ubah dengan pemerintah asing untuk impor minyak kita. Lebih baik kita merebut kendali atas ladang minyak, sehingga kita dapat mempertahankan kendali penuh atas ladang minyak tersebut, terlepas dari kepemimpinan politik di negara lain."
 ENG_maintaining_imperial_integrity: "Mempertahankan Integritas Kekaisaran"
 ENG_maintaining_imperial_integrity_desc: "Pertahanan Kekaisaran kita dimulai dengan penguasaan lautan dan kesetiaan Dominion kita. Kekuatan angkatan laut lainnya harus diperingatkan agar tidak mengancam keunggulan angkatan laut kita, dan pada saat yang sama kita harus meningkatkan kendali atas rakyat kita sehingga kita kuat di seluruh dunia."
 ENG_enforce_the_naval_treaties: "Menegakkan Perjanjian Angkatan Laut"
 ENG_enforce_the_naval_treaties_desc: "Telah menjadi perhatian kami bahwa negara-negara tertentu telah memilih untuk mengabaikan ketentuan Perjanjian Angkatan Laut Washington. Hal ini tidak bisa dibiarkan begitu saja. Jika kita ingin mempertahankan keunggulan, dan jangan sampai orang lain mempunyai pemikiran yang sama, kita harus segera menyerang dan memberi contoh kepada mereka yang menentang keinginan kita."
 ENG_enforce_the_naval_treaties_tt: "Hal ini dapat digunakan untuk menuntut negara-negara yang memiliki §YKapal Modal§! terlalu banyak dibandingkan dengan kita §GMengurangi§! jumlah §YKapal Modal§! mereka, dan akan memberi kita §YTujuan Perang Boneka§! jika mereka menolak."
 ENG_maintaining_the_balance_of_power: "Menjaga Keseimbangan Kekuatan"
 ENG_maintaining_the_balance_of_power_desc: "Kekuatan Kekaisaran terletak pada kelemahan dan kelumpuhan Eropa. Jika kita ingin fokus pada permasalahan global, kita harus memastikan bahwa Eropa terlalu sibuk dengan urusannya sendiri sehingga tidak bisa memikirkan urusan kita sendiri. Kami akan tetap menjauhkan diri dari urusan-urusan Eropa, kecuali bertindak melawan rezim ekspansionis yang mungkin mengancam keseimbangan kekuatan yang kami inginkan."
 ENG_continental_intervention: "Intervensi Kontinental"
 ENG_continental_intervention_desc: "Jelas bahwa kita tidak akan mampu menjaga keseimbangan kekuatan di benua Eropa tanpa tindakan. Kita harus menghancurkan rezim ekspansionis yang muncul baru-baru ini, memastikan bahwa kita tidak akan pernah dihadapkan pada ancaman kesatuan Eropa yang mampu mempersiapkan invasi ke Kepulauan Inggris tanpa gangguan."
 ENG_continental_intervention_tt: "Memberikan tujuan perang melawan negara-negara besar Eropa yang telah menyebabkan lebih dari §R10§! §YKetegangan Dunia§!:"
 ENG_prepare_for_the_inevitable: "Bersiaplah untuk Hal yang Tak Terelakkan"
 ENG_prepare_for_the_inevitable_desc: "Tampaknya negara kita akan kembali terlibat dalam konflik dunia lainnya. Kita harus meningkatkan pengeluaran industri untuk meningkatkan tingkat persenjataan kita."
 ENG_mi6_ns: "MI6"
 ENG_a_change_in_course: "Perubahan Arah"
 ENG_a_change_in_course_desc: "Ketika ketegangan dunia meningkat, jelas bahwa kepemimpinan politik kita saat ini tidak mampu melindungi kepentingan negara. Saatnya telah tiba untuk perubahan drastis dari politik pada beberapa dekade terakhir."
 ENG_the_kings_party: "Pesta Raja"
 ENG_the_kings_party_desc: "Sekarang setelah krisis selesai dan pemerintahan telah jatuh, para pendukung Raja yang paling bersemangat mungkin dapat membentuk pemerintahan mereka sendiri, lebih... menyetujui... keinginan Raja. Partai Raja ini akan terdiri dari David Lloyd George, Winston Churchill, dan Oswald Mosley, sehingga menjangkau seluruh partai politik dan membantu memperbaiki persatuan bangsa kita."
 edward_viii_married_wallis_simpson: "Edward VIII menikah dengan Wallis Simpson"
 ENG_reassess_continental_commitments: "Menilai Kembali Komitmen Kontinental"
 ENG_reassess_continental_commitments_desc: "Meskipun sikap politik kita baru-baru ini terhadap Eropa adalah berkomitmen pada sekutu kita dalam Perang Besar, menentang kebangkitan [GER.GetName] dan [SOV.GetName] yang akan datang, perbedaan politik antara kita dan sekutu lama kita menjadi lebih menonjol. Mungkin sudah waktunya untuk mempertimbangkan kembali di mana letak kesetiaan kita."
 ENG_isolate_the_mediterranean_threat: "Isolasi Ancaman Mediterania"
 ENG_isolate_the_mediterranean_threat_desc: "Angkatan Laut [ITA.GetAdjective] mengancam pengiriman kami melalui Mediterania. Kita harus memulai kampanye isolasi diplomatis untuk membendung ancaman tersebut."
 ENG_alliance_with_germany: "Aliansi dengan Jerman"
 ENG_alliance_with_germany_desc: "Kepentingan kami selaras dengan kepentingan Jerman - meskipun mereka menginginkan hegemoni di benua Eropa, kami menginginkan Eropa yang tidak akan mengancam Kepulauan Inggris sementara kami menjaga Imperium global kami. Mungkin aliansi, sesuai keinginan Raja, bukanlah kerja sama yang aneh."
 ENG_alliance_with_germany_tt: "Setengah dari dukungan §YDemokrat§! saat ini diterapkan sebagai penalti §RStabilitas§!:"
 ENG_noninterference_treaty_with_germany: "Perjanjian Non-Intervensi dengan Jerman"
 ENG_noninterference_treaty_with_germany_desc: "Ambisi Kekaisaran kita bergantung pada tidak perlu khawatir tentang Eropa. Mungkin hal ini mudah dicapai dengan memberikan [GER.GetNameDef] kekuasaan penuh di Eropa, sebagai imbalan atas kelanjutan hubungan damai dan janji mereka untuk tidak ikut campur dalam urusan yang menyangkut Kerajaan Inggris."
 ENG_take_out_the_regia_marina: "Keluarkan Regia Marina"
 ENG_take_out_the_regia_marina_desc: "Saatnya telah tiba untuk mengatasi ancaman di Mediterania. Kami akan mengamankan rute pelayaran yang melewati Suez, jalur kehidupan Kerajaan kami, dengan menghilangkan angkatan laut yang melintasinya."
 ENG_organize_the_blackshirts: "Atur Kaos Hitam"
 ENG_organize_the_blackshirts_map_category_name: "Pilih tempat untuk mengatur pawai Blackshirt Anda."
 ENG_organize_the_blackshirts_desc: "Keberhasilan Persatuan Fasis Inggris bergantung pada citra publiknya. Kita dapat menunjukkan semangat persatuan dan kekuatan pribadi gerakan kita dengan mengadakan pawai yang terinspirasi oleh militer di seluruh negeri. Kami akan menarik lebih banyak pengikut, sekaligus menakut-nakuti pihak oposisi agar tidak mengambil tindakan. Tujuan akhirnya adalah unjuk rasa di Downing Street, menyerukan perubahan kepemimpinan."
 ENG_organize_the_blackshirts_tt: "Membuka §YMengatur Keputusan Blackshirts§!."
 ENG_the_british_path_to_fascism: "Jalan Inggris Menuju Fasisme"
 ENG_the_british_path_to_fascism_desc: "Jalan kita menuju fasisme akan menjadi milik kita sendiri, dan kita tidak akan tunduk pada mereka yang menganggap diri mereka sebagai superior ideologis kita. Rakyat mengingat perang yang lalu, dan kerja sama apa pun dengan rezim yang ada di [GER.GetName] pasti akan menimbulkan kemarahan mereka."
 ENG_secure_the_italian_alliance: "Amankan Aliansi Italia"
 ENG_secure_the_italian_alliance_desc: "Mussolini memiliki pendekatan yang lebih cocok terhadap fasisme, dan telah lama dikagumi oleh Mosley. Wajar jika kedua negara menjalin hubungan yang lebih erat dan saling menguntungkan bagi kedua bangsa."
 ENG_gibraltar_for_spanish_support: "Gibraltar untuk Dukungan Spanyol"
 ENG_gibraltar_for_spanish_support_desc: "Meskipun sudah lama dianggap sebagai bagian integral dari negara kita, mungkin ada gunanya mengatur kembalinya Gibraltar ke tangan Spanyol, sebagai imbalan atas dukungan Franco terhadap perjuangan kita."
 ENG_pre_empt_spanish_alignment: "Penyelarasan Spanyol Pra-Empt"
 ENG_pre_empt_spanish_alignment_desc: "Ada risiko bahwa Spanyol akan memihak Jerman jika kita mengambil tindakan ofensif terhadap Jerman. Hal ini tidak boleh dibiarkan terjadi - kita harus mengatasi potensi ancaman ini sebelum melanjutkan ke [GER.GetName]."
 ENG_prevent_a_continental_hegemony: "Mencegah Hegemoni Kontinental"
 ENG_prevent_a_continental_hegemony_desc: "Jelas bahwa [GER.GetNameDef] mempunyai rancangan di seluruh benua Eropa. Hal ini tidak bisa dibiarkan terjadi. Bersama sekutu kita, kita harus menghadapi Jerman sebelum mereka memberikan tantangan yang terlalu besar."
 ENG_enact_the_mosley_manifesto: "Menetapkan Manifesto Mosley"
 ENG_enact_the_mosley_manifesto_desc: "Pada tahun-tahun sebelumnya, Mosley telah menyiapkan manifesto reformasi ekonomi untuk mengentaskan kemiskinan. Sekarang saatnya untuk menerapkan usulan Pemimpin."
 ENG_god_save_the_king: "Tuhan Selamatkan Raja"
 ENG_god_save_the_king_desc: "Di atas segalanya adalah tugas kita kepada Raja dan Mahkota. Sebuah simbol perlawanan dan harapan bagi rakyat, dan kesatuan Kekaisaran terhadap rakyat dan musuh kita, Raja harus disanjung di dalam dan ditakuti di luar. Kami akan mewujudkannya."
 ENG_ceylon_forward_operating_base: "Pangkalan Operasi Ceylon Forward"
 ENG_ceylon_forward_operating_base_desc: "Sebagai persiapan menghadapi invasi besar-besaran yang diperlukan untuk mengembalikan kendali Kerajaan atas India, kita harus memperluas fasilitas di pulau Ceylon."
 ENG_reclaim_the_jewel_in_the_crown: "Raih kembali Permata di Mahkota"
 ENG_reclaim_the_jewel_in_the_crown_desc: "Masa kemerdekaan India yang singkat kini harus berakhir. Pasukan kita sudah siap, siap mengembalikan Permata Mahkota."
 ENG_reclaim_burma: "Merebut kembali Burma"
 ENG_reclaim_burma_desc: "Masa kemerdekaan [BRM.GetName] yang singkat kini harus berakhir. Pasukan kita sudah siap, siap mengembalikan negara kepada penguasa yang sah"
 ENG_pre_empt_the_ideological_threat: "Mencegah Ancaman Ideologis"
 ENG_pre_empt_the_ideological_threat_desc: "Kekaisaran dilanda secara internal oleh mereka yang berpikiran berbeda. Kita tahu bahwa kolumnis kelima ini menerima perintah dari Moskow, sehingga kita dapat membungkam suara mereka dengan menyerang sumber kejahatan ini."
 ENG_expose_the_belly_of_the_bear: "Paparkan Perut Beruang"
 ENG_expose_the_belly_of_the_bear_desc: "Melawan Soviet tanpa landasan merupakan tantangan yang luar biasa. Kami akan menuntut perjalanan melalui negara-negara [PER.GetName] dan [AFG.GetName], dan menyerang Soviet di tempat yang paling tidak mereka duga; darat dan ke perut mereka yang terbuka."
 ENG_imperial_conscription: "Wajib Militer Kekaisaran"
 ENG_imperial_conscription_desc: "Kita telah lama mengabaikan kekayaan sumber daya manusia yang disediakan Kerajaan kita. Sudah waktunya kita secara drastis meningkatkan wajib militer di seluruh Kekaisaran, dan memastikan bahwa kita memiliki banyak tenaga untuk berperang. Semua harus melakukan tugas mereka kepada Mahkota!"
 ENG_consolidate_the_british_isles: "Konsolidasikan Kepulauan Inggris"
 ENG_consolidate_the_british_isles_desc: "Rakyat Irlandia terus mengusung gagasan konyol mereka tentang kemerdekaan, dan toleransi kita sudah berakhir. Sudah waktunya kita menghancurkan perlawanan mereka dan mengembalikan seluruh negara ke dalam kesatuan sebagai bagian integral dari Inggris."
 ENG_unite_the_anglosphere: "Satukan Anglosfer"
 ENG_unite_the_anglosphere_desc: "Warisan Zaman Keemasan kita adalah salah satu budaya dan bahasa kita hadir di seluruh dunia. Daripada menderita penghinaan dan rasa tidak berterima kasih karena wilayah-wilayah ini tetap merdeka, kita harus sekali lagi menyatukan mereka di bawah kekuasaan kita."
 ENG_appeal_to_imperial_loyalists: "Himbauan kepada Loyalis Kekaisaran"
 ENG_appeal_to_imperial_loyalists_desc: "Meskipun Dominion sudah merdeka secara nominal, masih banyak warganya yang setia kepada Kerajaan. Jika kita bisa menjangkau mereka, kita mungkin bisa menumbangkan pemerintahan Dominion sebelum melakukan invasi yang diperlukan untuk mendapatkan kembali kendali atas mereka."
 ENG_appeal_to_imperial_loyalists_tt: "Membuka Keputusan §YBanding kepada Loyalis Kekaisaran§!, yang memungkinkan terjadinya perang saudara pro-Inggris di bekas Dominion."
 ENG_bring_the_dominions_back_into_the_fold: "Bawa Dominion Kembali ke Kelompoknya"
 ENG_bring_the_dominions_back_into_the_fold_desc: "Papan sudah diatur, dan potongan-potongannya sudah pada posisinya. Sekarang adalah waktunya untuk menjalankan rencana kita dan 'mengoreksi' gagasan kemerdekaan yang ada di benak para pemimpin Dominion."
 ENG_bring_the_dominions_back_into_the_fold_tt: "Membuka Keputusan §YSekutu Pemberontakan Imperialis§!."
 ENG_the_sun_never_sets: "Matahari Tidak Pernah Terbenam"
 ENG_the_sun_never_sets_desc: "Dikatakan bahwa Kerajaan Inggris sangat luas sehingga matahari tidak pernah terbenam di atasnya. Kekuatannya terletak pada Angkatan Laut Kerajaan Inggris, yang mengamankan jalur perdagangan dan pasokan yang menghubungkannya dan sangat penting bagi kemakmuran kita. Angkatan laut ini harus belajar melintasi jarak yang sangat jauh ini dengan tergesa-gesa, sehingga kita dapat bereaksi dengan cepat terhadap ancaman apa pun, di mana pun."
 ENG_the_sun_never_sets_tt: "Bonus ini akan berlaku untuk semua jenis kapal yang baru diteliti."
 ENG_pre_empt_the_strategic_threat: "Mencegah Ancaman Strategis"
 ENG_pre_empt_the_strategic_threat_desc: "Kekaisaran diserang secara eksternal oleh mereka yang menginginkan kekayaan sumber daya kita. Kita tahu siapa dan mengapa, jadi tidak ada yang menghalangi kita untuk melakukan perlawanan terhadap mereka sebelum mereka menyerang kita pada saat kita berada dalam kelemahan yang tidak menguntungkan."
 ENG_concessions_to_the_trade_unions: "Konsesi kepada Serikat Pekerja"
 ENG_concessions_to_the_trade_unions_desc: "Upaya kami untuk mempersenjatai kembali terus menerus dirusak oleh konflik dengan serikat pekerja. Transisi kita mungkin akan lebih lancar jika kita memilih untuk bekerja sama dengan mereka, dibandingkan terus berjuang melawan mereka."
 ENG_concessions_to_the_trade_unions_tt: "Membuka §YKonsesi kepada Serikat Pekerja§! Keputusan, yang harus diselesaikan untuk menjadi Komunis."
 ENG_concessions_to_the_trade_unions_tt_3: "Membuka §YDukungan Serikat Pekerja§! Keputusan."
 ENG_concessions_to_the_trade_unions_tt_2: "§RJika Dekolonisasi tidak tercapai dalam waktu 2 tahun setelah menjadi Komunis, perang saudara akan dimulai!§!"
 ENG_move_to_secure_the_dominions: "Pindah untuk Mengamankan Dominion"
 ENG_move_to_secure_the_dominions_desc: "The Dominion mengamati perubahan ideologi kita dengan pandangan curiga. Bukan tidak mungkin mereka akan mempertimbangkan kembali hubungan mereka dengan Westminster jika kita mengizinkannya... Oleh karena itu, kita tidak boleh melakukannya. Dengan bertindak cepat, kita mungkin bisa secara paksa melakukan perubahan dalam pemerintahan sebelum hubungan diplomatik menjadi terlalu tegang."
 ENG_move_to_secure_the_dominions_tt: "Mengaktifkan Keputusan §YPindah untuk Mengamankan Dominion§!."
 ENG_the_fate_of_the_royal_family: "Nasib Keluarga Kerajaan"
 ENG_the_fate_of_the_royal_family_desc: "Gagasan bahwa seseorang lebih berharga daripada orang lain, semata-mata karena kelahirannya, membuat kita muak. Kekayaan luar biasa yang terus dipamerkan oleh Keluarga Kerajaan merupakan duri di mata kita, dan tidak diragukan lagi akan lebih bermanfaat jika digunakan untuk persenjataan kembali dan perluasan industri. Mungkin ini saatnya kita membunuh dua burung dengan satu batu..."
 ENG_eliminate_the_upper_class: "Hilangkan Kelas Atas"
 ENG_eliminate_the_upper_class_desc: "Kaum buruh harus bangkit dan mematahkan penindasan kelas atas. Kami akan menangani mereka, dan menyita perusahaan mereka untuk negara."
 ENG_eliminate_the_upper_class_tt: "Menghapus bangsawan Field Marshals, Jenderal, dan Laksamana."
 ENG_for_the_good_of_the_revolution: "Demi Kebaikan Revolusi"
 ENG_for_the_good_of_the_revolution_desc: "Semua harus rela berkorban demi kenyamanan negara. Rakyat Inggris akan tetap tegar menghadapi penjatahan ini, yakin bahwa hal ini akan memastikan kemenangan kita pada akhirnya."
 ENG_the_british_communist_alternative: "Alternatif Komunis Inggris"
 ENG_the_british_communist_alternative_desc: "Daripada memihak Moskow, kami akan memulai kerja sama kami sendiri dengan negara-negara komunis. Inggris tidak ada duanya di kancah dunia, dan kami tidak akan tunduk pada Moskow, baik sekarang maupun selamanya."
 ENG_enforce_decolonization: "Menegakkan Dekolonisasi"
 ENG_enforce_decolonization_desc: "Sebagaimana kita telah melakukan dekolonisasi, demikian pula negara-negara lain di dunia. Kami akan mengeluarkan ultimatum, dan mereka yang tidak melihat hikmah dari kata-kata kami akan dibuat melihat hikmah tersebut."
 ENG_reach_out_across_the_channel: "Jangkau Seluruh Saluran"
 ENG_reach_out_across_the_channel_desc: "Komunisme telah menyebar di negara-negara di seberang Selat Inggris. Kami akan menjangkau mereka, dan menawarkan mereka bimbingan dan bantuan yang jauh lebih dekat daripada Moskow yang jauh."
 ENG_reach_out_across_the_channel_tt: "Undang §Y[FRA.GetName]§! atau §YNegara Rendah§! ke faksi kami, jika mereka komunis."
 ENG_soviet_cooperation: "Kerja Sama Soviet"
 ENG_soviet_cooperation_desc: "Meskipun kami mempunyai perbedaan, kami juga mempunyai musuh yang sama. Kami akan mengusulkan serangan dari kedua belah pihak, menghancurkan Jerman sebelum mereka menyadari apa yang telah terjadi."
 ENG_the_one_true_revolution: "Revolusi Sejati"
 ENG_the_one_true_revolution_desc: "Tidak ada kerja sama yang dapat dilakukan dengan [SOU.Capital.GetCapitalVictoryPointName]. Korupsi merajalela di [SOU.GetNameDef], dan satu-satunya harapan adalah menyingkirkan korupsi dan mengambil alih kepemimpinan global dalam Perjuangan Pekerja."
 ENG_follow_moscow: "Ikuti [SOU.Capital.GetCapitalVictoryPointName]"
 ENG_follow_moscow_desc: "Pada akarnya, komunisme di Inggris selalu mengikuti perintah [SOU.Capital.GetCapitalVictoryPointName]. Untuk terus melakukan hal tersebut sekarang tidak hanya logis, tetapi juga perlu. Antara Tentara Merah dan Angkatan Laut kita, kita akan menyebarkan ajaran Marx secara luas, dan tidak ada yang bisa menghentikan kita."
 ENG_tackle_fascism: "Atasi Fasisme"
 ENG_tackle_fascism_desc: "Fasisme adalah ancaman utama bagi Perjuangan Buruh. Kita harus fokus menghilangkan penyakit ini dari muka Eropa."
 ENG_preparing_the_second_front: "Mempersiapkan Front Kedua"
 ENG_preparing_the_second_front_desc: "Ketika perang dimulai, kita harus membuka front kedua untuk membantu sekutu Soviet kita. Persiapan untuk hal ini harus dimulai sekarang."
 ENG_tackle_capitalism: "Mengatasi Kapitalisme"
 ENG_tackle_capitalism_desc: "Kapitalisme adalah musuh utama Perjuangan Buruh, dan kita tidak bisa berdiam diri seiring berkembangnya kapitalisme, bahkan di lautan yang jauh sekalipun. Kita harus bersiap untuk menghadapinya di wilayah inti."
 ENG_bermuda_invasion_launch_point: "Titik Peluncuran Invasi Bermuda"
 ENG_bermuda_invasion_launch_point_desc: "Invasi ke Amerika Utara bukanlah tugas yang mudah. Kita harus membangun wilayah kekuasaan kita di Bermuda agar mampu menampung pasukan invasi selama jangka waktu yang diperlukan, sebelum pasukan tersebut dapat dikirim untuk menyebarkan Revolusi langsung ke wilayah Amerika."
 ENG_crush_the_dream: "Hancurkan Mimpi itu"
 ENG_crush_the_dream_desc: "Orang Amerika suka membicarakan Impian mereka; bahwa siapa pun bisa 'berhasil' di Amerika, asalkan mereka mau melakukannya tanpa bantuan rekan-rekan mereka. Kami menganggap ini tercela; tidak seorang pun boleh didorong untuk memangsa orang lain demi keuntungannya sendiri. Kami akan membebaskan masyarakat mereka dari pemikiran konyol ini, menghancurkan mimpi ini hingga tidak ada jejak yang tersisa."
 ENG_socialist_science_pool: "Kelompok Sains Sosialis"
 ENG_socialist_science_pool_desc: "Kita harus mengoordinasikan pertukaran pengetahuan teknologi sehingga semua sekutu kita dapat memperoleh manfaat dari kemajuan kita, dan agar kita juga dapat memperoleh manfaat dari kemajuan mereka. Hanya dengan cara inilah perjuangan buruh akan berhasil."
 ENG_liberate_the_home_of_marx: "Bebaskan Rumah Marx"
 ENG_liberate_the_home_of_marx_desc: "Tempat kelahiran Karl Marx telah dipenuhi oleh fasisme, tidak hanya mencemari ingatannya, namun juga menjadi penghinaan abadi terhadap seluruh sosialisme. Ini saatnya untuk memusnahkan kekuatan jahat dari tanah Jerman, membebaskan masyarakat dari nabi-nabi palsu yang memimpin mereka."
 ENG_spirit_of_the_industrial_revolution: "Semangat Revolusi Industri"
 ENG_spirit_of_the_industrial_revolution_desc: "Kepulauan Inggris adalah tempat lahirnya Revolusi Industri. Dengan semangat ini, kami akan menunjukkan kepada dunia apa yang dapat dicapai oleh para pekerja yang terbebaskan dalam perekonomian yang dikendalikan oleh negara."
 ENG_british_commonwealth_air_training_plan: "Rencana Pelatihan Udara Persemakmuran Inggris"
 ENG_british_commonwealth_air_training_plan_desc: "Keberhasilan militer kita bergantung pada penguasaan kita di udara, dan juga keterampilan awak udara kita. Kami akan memulai program pelatihan penerbangan terbesar yang pernah ada di dunia untuk memastikan kami memiliki semua pilot dan awak terlatih yang kami perlukan untuk menguasai dimensi peperangan baru ini."
 ENG_indian_autonomy: "Otonomi India"
 ENG_indian_autonomy_desc: "Daripada menjanjikan kemerdekaan penuh, ada kemungkinan kita bisa melemahkan gerakan kemerdekaan India dengan memberi mereka otonomi yang luas, seperti yang sudah dinikmati oleh Dominion lain."
 ENG_indian_autonomy_tt: "§RTanpa otonomi atau Lord Halifax sebagai pemimpin negara, [RAJ.GetNameDef] tidak akan menerima proposal apa pun untuk Federasi Kekaisaran.§!"
 ENG_imperial_conference_defense_dominion: "Perjanjian Pertahanan Konferensi Kekaisaran"
 ENG_imperial_conference_economy_dominion: "Perjanjian Ekonomi Konferensi Kekaisaran"
 ENG_federal_integration: "Integrasi Federal"
 ENG_imperial_conference: "Adakan Konferensi Kekaisaran"
 ENG_imperial_conference_desc: "Terakhir kali berbagai pemimpin pemerintahan dari semua koloni dan wilayah kekuasaan kita bertemu untuk membahas masalah-masalah yang berkaitan dengan kepentingan Kekaisaran adalah pada tahun 1932. Sudah saatnya kita mengadakan konferensi lagi, terutama jika kita ingin memperkuat Kekaisaran dalam waktu dekat."
 ENG_imperial_conference_tt: "Membuka Keputusan §YKonferensi Kekaisaran§! selama 60 hari.\n§RPastikan Anda mempunyai Kekuatan Politik yang tersimpan untuk memanfaatkan keputusan ini!§!"
 ENG_imperial_federation: "Federasi Kekaisaran"
 ENG_imperial_federation_desc: "Federasi Kekaisaran telah lama dianggap sebagai alternatif dari pemerintahan mandiri. Setelah persiapan yang panjang, kini saatnya tiba untuk menyatukan pemerintahan kita dengan pemerintahan Dominion kita, dan merebut kembali posisi kita sebagai negara adidaya yang unggul di dunia. Kuasai Britania!"
 ENG_dominions_accepted_federation: "Dominion Menyetujui Federasi Kekaisaran"
 ENG_a_s_warfare: "Perang A/S"
 ENG_a_s_warfare_desc: "Atlantik adalah jalur kehidupan kita, dan kita harus memastikan perairan tersebut bebas dari musuh yang akan memangsa pelayaran kita yang rentan, baik yang berada di atas permukaan maupun di bawahnya. Kami akan fokus pada pengembangan mutakhir di bidang peperangan anti-kapal selam, memastikan pengawal kami dilengkapi dengan persenjataan dan alat deteksi terbaik yang dapat kami sediakan."
 ENG_anti_submarine_training_school: "Sekolah Pelatihan Anti Kapal Selam"
 ENG_anti_submarine_training_school_desc: "Salah satu keunggulan kami adalah kemampuan untuk memanfaatkan sejumlah besar perwira terampil dengan pengalaman dari perang terakhir untuk melatih kru baru. Dengan penanggung jawab pakar ASW, Komodor Gilbert Stephenson, pendirian sekolah pelatihan anti-kapal selam baru di Tobermory akan memastikan kru kami memperoleh keterampilan yang mereka butuhkan sebelum memulai tugas konvoi Atlantik dan menghadapi ancaman U-boat."
 ENG_expand_the_repair_yards: "Perluas Tempat Perbaikan"
 ENG_expand_the_repair_yards_desc: "Meskipun angkatan laut kita termasuk yang terbesar di dunia, kita juga harus mempunyai sarana untuk segera memperbaiki kapal kita jika kapal tersebut mengalami kerusakan akibat pertempuran, atau musuh kita akan melemahkan kita karena gesekan. Memperluas tempat perbaikan kami tidak hanya akan mencapai hal ini, namun juga memungkinkan kami mereparasi beberapa model lama kami secara tepat waktu."
 ENG_vanguard: "Barisan depan"
 ENG_vanguard_desc: "[Root.GetVanguardDesc]"
 ENG_VANGUARD_DESC_HISTORICAL: "Kita tidak boleh kalah jumlah dengan musuh-musuh kita di lautan. Kami masih memiliki sejumlah senjata 15 inci dalam penyimpanan yang dapat digunakan untuk menggantikan senjata 16 inci yang memakan waktu lama dan diperlukan untuk rencana kapal perang berikutnya, yang akan sangat mempercepat pembangunan kapal utama di kelasnya: HMS Vanguard."
 ENG_VANGUARD_DESC_COMMUNIST: "Kita tidak boleh kalah jumlah dengan musuh-musuh kita di lautan. Kami masih memiliki sejumlah senjata 15 inci dalam penyimpanan yang dapat digunakan untuk menggantikan senjata 16 inci yang memakan waktu lama dan diperlukan untuk rencana kapal perang berikutnya, yang akan sangat mempercepat pembangunan kapal utama di kelasnya: WLNS Vanguard."
 ENG_vanguard_tt_hms: "Buat HMS Vanguard."
 ENG_vanguard_tt_communism: "Buat WLNS Vanguard."
 ENG_anti_non_contact_committee: "Komite Anti-Non-Kontak"
 ENG_anti_non_contact_committee_desc: "Pakar teknis kami dalam perang ranjau menyarankan bahwa jenis ranjau baru, yang diaktifkan oleh medan magnet, suara, dan cara lain, kemungkinan besar akan memainkan peran penting dalam perang berikutnya. Dengan menunjuk Komite Anti-Non-Kontak Angkatan Laut khusus untuk meneliti cara-cara untuk menyapu mereka sekarang, kita dapat membantu menjaga kapal kita tetap aman, dan bahkan mungkin membuat beberapa kemajuan dalam teknologi tambang kita sendiri dalam prosesnya."
 ENG_secure_the_imperial_shipping_routes: "Amankan Rute Pengiriman Kekaisaran"
 ENG_secure_the_imperial_shipping_routes_desc: "Kohesi kerajaan kolonial kita bergantung pada kemampuan kita untuk melindungi pelayaran dagang yang menyatukannya, dan untuk mengerahkan kekuatan kita kapan pun diperlukan. Kami selalu mengandalkan armada kapal penjelajah ringan yang besar untuk melakukan hal ini, dan kami harus memastikan bahwa kami terus memiliki jumlah kapal yang diperlukan agar kami dapat berada di mana pun sekaligus."
 HOL_obtain_foreign_colonial_investments: "Dapatkan Investasi Kolonial Asing"
 HOL_obtain_foreign_colonial_investments_desc: "Meskipun mereka sangat anti-kolonialis, Amerika sudah lama mempunyai kepentingan ekonomi di wilayah jajahan kita, khususnya di Hindia Barat. Bersama dengan Inggris dan Jepang, mereka sangat ingin melakukan investasi dalam pembangunan kolonial kita, baik di Barat maupun di Timur. Kita harus mendorong hal ini."
 HOL_obtain_foreign_colonial_investments_tt: "Hal ini memungkinkan adanya bonus sementara untuk §YBarang Konsumsi§! dan §YKecepatan Konstruksi§!, serta peningkatan permanen dalam produksi §YMinyak§! di Hindia Timur dan Barat."
 HOL_the_western_possessions: "Kepemilikan Barat"
 HOL_the_western_possessions_desc: "Hindia Barat sering diabaikan dibandingkan negara-negara Timur, padahal mereka kaya akan sumber daya alam. Memastikan infrastruktur memadai adalah langkah pertama menuju potensi peningkatan industri dan ekstraksi sumber daya di wilayah tersebut."
 HOL_expand_curacao_oil_refineries: "Perluas Kilang Minyak Curaçao"
 HOL_expand_curacao_oil_refineries_desc: "Karena kedalaman Danau Maracaibo yang dangkal, sejak tahun 1918 hampir semua minyak Venezuela diangkut melalui angkutan pantai dengan aliran dangkal untuk diproses di Aruba dan Curaçao, dan dari sana dikirim ke seluruh dunia dengan kapal tanker laut. Kilang penyulingan kami saat ini merupakan yang terbesar di dunia, namun krisis dunia yang akan datang mungkin memerlukan perluasan fasilitas lebih lanjut."
 HOL_expand_curacao_oil_refineries_tt: "Membuka §YRoyal Dutch Shell§! sebagai Perusahaan Industri."
 HOL_open_second_paranam_bauxite_mine: "Buka Tambang Bauksit Paranam Kedua"
 HOL_open_second_paranam_bauxite_mine_desc: "Bauksit dari Suriname sangat penting dalam produksi aluminium untuk industri pesawat terbang negara-negara besar. Dengan adanya pembangunan militer di seluruh dunia saat ini, permintaan akan aluminium telah meningkat secara dramatis, dan oleh karena itu kita pasti dapat meningkatkan ekspor jika kita membuka tambang bauksit kedua di Paranam."
 HOL_antilles_defenses: "Pertahanan Antillen"
 HOL_antilles_defenses_desc: "Mengingat pentingnya kilang minyak kita di Aruba dan Curaçao, tidak aneh jika pihak asing yang memiliki kepentingan terhadap kilang tersebut tampak sangat khawatir dengan lemahnya pertahanan kita di sini. Jika kita ingin menghindari pihak-pihak ini merasa perlu mempertahankan kepulauan ini untuk kita, mungkin kita harus meningkatkan pertahanan kita sendiri..."
 HOL_pre_empt_venezuelan_aggression_tt: "Tidak memiliki semangat kebangsaan §YPenonton Perang Besar yang terkejut§!"
 HOL_pre_empt_venezuelan_aggression: "Mencegah Agresi Venezuela"
 HOL_pre_empt_venezuelan_aggression_desc: "Venezuela telah membuat rencana mereka terhadap Antillen kita dengan lebih dari jelas. Mereka mungkin hanya mencoba 'menawarkan perlindungan' kali ini, namun kita tidak tahu apa yang akan mereka lakukan jika situasi kita memburuk. Kita harus menyerang sebelum mereka melakukan serangan, dan menjamin keamanan kilang minyak kita."
 HOL_the_crown_jewel_colony: "Koloni Permata Mahkota"
 HOL_the_crown_jewel_colony_desc: "Sebagaimana India bagi Inggris, demikian pula Hindia Timur bagi kita. Namun, infrastruktur yang sudah ketinggalan zaman di Hindia Timur tidak akan berfungsi di zaman modern ini. Kebanggaan Nasional kita harus diperlakukan seperti itu, sehingga infrastruktur harus dimodernisasi agar lebih sesuai dengan apa yang diharapkan dari bagian penting bangsa kita."
 HOL_java: "Jawa"
 HOL_java_desc: "Ibu kota Hindia Timur kita harus banyak diinvestasikan, sehingga kita bisa menjadikannya lebih sejalan dengan tingkat industrialisasi yang tepat pada saat itu."
 HOL_reinforce_java: "Perkuat Jawa"
 HOL_reinforce_java_desc: "Pulau Jawa merupakan rumah bagi sebagian besar populasi dan industri di kepulauan Hindia Timur, serta ibu kotanya dan semua pangkalan dan markas militer utama. Oleh karena itu, pulau ini merupakan pulau paling penting di Hindia Timur, dan kita harus meningkatkan pertahanannya untuk memastikan bahwa kita dapat tetap mengendalikan pulau tersebut meskipun seluruh pulau telah hilang."
 HOL_the_foundations_of_defense: "\"Fondasi Pertahanan\""
 HOL_the_foundations_of_defense_desc: "\"Defensiegrondslagen van Nederlands-Indië\" adalah sebuah laporan yang disusun pada tahun 1927, menganalisis pertahanan koloni kita. Dengan meningkatnya agresi Jepang baru-baru ini, dan mengetahui sepenuhnya rencana mereka di Hindia Timur, mungkin dokumen ini harus dihapuskan, dan titik lemah pertahanan yang diidentifikasi diprioritaskan dalam alokasi sumber daya kita yang baru dibebaskan."
 HOL_the_foundations_of_defense_tt: "Tetapkan §YPangkalan Angkatan Laut§! ke level maksimum di Soerabaja."
 HOL_sumatra: "Sumatera"
 HOL_sumatra_desc: "Meskipun merupakan pulau terbesar yang seluruhnya merupakan bagian dari Hindia Timur, Sumatera, tetangga sebelah utara Pulau Jawa, masih tertinggal jauh dalam hal industrialisasi dan infrastruktur. Kita harus segera memperbaikinya."
 HOL_borneo_and_the_grote_oost: "Kalimantan dan Grote Oost"
 HOL_borneo_and_the_grote_oost_desc: "Pulau besar Kalimantan, dan pulau-pulau lain yang secara kolektif dikenal sebagai 'De Grote Oost' ('Timur Besar'), seperti Sulawesi dan Maluku, harus dibuat lebih mudah diakses oleh populasi kita yang terus bertambah, sehingga memungkinkan lebih banyak industri untuk menetap di wilayah tersebut."
 HOL_curtail_colonial_autonomy: "Membatasi Otonomi Kolonial"
 HOL_curtail_colonial_autonomy_desc: "Ada kemungkinan besar bahwa benua Belanda akan dikuasai meskipun kita sudah melakukan persiapan terbaik. Dalam hal ini, kita harus mencari alternatif lain, dan salah satu kemungkinannya adalah merelokasi pemerintahan ke ibu kota Hindia Belanda, di kota Batavia di Jawa. Kita harus menjelaskan kepada pemerintahan kolonial kita bahwa kita akan segera mengambil kendali langsung atas urusan mereka."
 HOL_continue_the_war_in_batavia: "Lanjutkan Perang di Batavia"
 HOL_continue_the_war_in_batavia_desc: "Invasi yang kita takuti telah terjadi, dan pertahanan kita telah dikesampingkan. Pemerintah telah berhasil melarikan diri dan sekarang berada di pengasingan, ditampung oleh sekutu kami. Meskipun Ratu kami lebih suka pemerintah tetap berada di pengasingan dan 'hampir beraksi' di Eropa, kami pikir sudah waktunya untuk pindah ke Hindia Timur, dan dari sana melanjutkan perang sebagai negara yang berdaulat."
 HOL_continue_the_war_in_batavia_tt: "Yang memberi:"
 HOL_a_western_capital: "Ibukota Barat"
 HOL_a_western_capital_desc: "Industri sipil di Jawa harus diperluas untuk menyediakan industri perang yang kita perlukan untuk membebaskan tanah air kita."
 HOL_expand_the_colonial_army: "Perluas Tentara Kolonial"
 HOL_expand_the_colonial_army_desc: "Satu hal yang tidak dimiliki Hindia Timur adalah tenaga kerja. Apapun konsesi dan janji yang harus kita buat, kita harus membuat dinas militer menjadi lebih menarik, dan pada saat yang sama juga memperjelas bahwa rekrutan baru dari pihak kolonial adalah satu-satunya pertahanan yang dimiliki pulau ini terhadap keserakahan Jepang."
 HOL_colonial_shipbuilding: "Pembuatan Kapal Kolonial"
 HOL_colonial_shipbuilding_desc: "Dengan jatuhnya Belanda, galangan kapal kontinental kita pun hilang. Kita harus menyisihkan sumber daya untuk menciptakan galangan kapal baru di Timur, jika kita ingin membangun kekuatan angkatan laut kita."
 HOL_the_east_indies_war_machine: "Mesin Perang Hindia Timur"
 HOL_the_east_indies_war_machine_desc: "Kita tidak bisa terus bergantung pada sekutu kita dalam hal perlengkapan dan amunisi. Kita mempunyai kekayaan sumber daya yang melimpah; kita sekarang harus membangun industri untuk menggunakan sumber daya ini untuk memasok mesin perang kita."
 HOL_prepare_for_our_return: "Bersiaplah untuk Kepulangan Kami"
 HOL_prepare_for_our_return_desc: "Kami memerlukan pengiriman dalam jumlah besar untuk mengangkut pasukan kami kembali ke benua ini jika kami ingin membantu pembebasan tanah air kami. Lebih banyak galangan kapal dan penyempurnaan keahlian membangun kapal kargo harus memenuhi kebutuhan ini."
 HOL_liberation: "Pembebasan"
 HOL_liberation_desc: "Tanah air kami telah dibebaskan, dan tentara yang menyerah setelah kami menyerah telah dibebaskan dan sangat ingin membalas dendam. Semangat melonjak ketika massa yang bergembira menyambut para pembebas, dan rakyat tidak akan menganggap remeh penjajah lainnya."
 HOL_abandon_the_gold_standard: "Abaikan Standar Emas"
 HOL_abandon_the_gold_standard_desc: "Menolak untuk menghapuskan Standar Emas telah menghabiskan banyak sumber daya dalam beberapa tahun terakhir. Kini Perancis telah meninggalkan Blok Emas, yang tersisa hanyalah Swiss dan kami sendiri. Saatnya telah tiba untuk melakukan devaluasi Gulden, dan menggunakan sumber daya yang tersedia untuk memperbaiki kondisi pertahanan kita yang menyedihkan."
 HOL_continue_the_public_works: "Lanjutkan Pekerjaan Umum"
 HOL_continue_the_public_works_desc: "Kita harus melanjutkan pekerjaan umum besar yang dimulai pada akhir tahun 1920an. Reklamasi lahan dan pembangunan kanal, jalan, dan terowongan baru tidak hanya menciptakan lapangan kerja, tetapi juga bermanfaat bagi kemajuan bangsa."
 HOL_finish_the_noordoostpolder: "Selesaikan Noordoostpolder"
 HOL_finish_the_noordoostpolder_desc: "Setelah menutup Zuiderzee dengan membangun Afsluitdijk, dan dengan demikian menciptakan danau buatan IJsselmeer, kini kita harus menyelesaikan proyek reklamasi lahan di Noordoostpolder. Hal ini akan memberi kita infrastruktur yang lebih baik dan lebih banyak ruang untuk ekspansi industri dan pertanian."
 HOL_the_maastunnel: "Terowongan Maastun"
 HOL_the_maastunnel_desc: "Sungai-sungai besar kita merupakan hambatan yang sangat besar, namun dengan menggali terowongan di bawahnya kita dapat meningkatkan infrastruktur kita secara drastis. Maastunnel akan menjadi yang pertama, yang secara signifikan meningkatkan aksesibilitas ke kota Rotterdam dari selatan."
 HOL_expand_the_artillerieinrichtingen: "Perluas Artillerieinrichtingen"
 HOL_expand_the_artillerieinrichtingen_desc: "Artillerie-Inrichtingen memproduksi amunisi dan sejumlah kecil senjata ringan (di bawah lisensi) untuk pasukan kita. Hal ini harus diperluas jika kita ingin meningkatkan kekuatan militer kita."
 HOL_expand_the_artillerieinrichtingen_tt: "Membuka §YA. I. Hembrug§! sebagai Perancang Materiel."
 HOL_philips_focus: "Philips"
 HOL_philips_focus_desc: "Philips telah lama menjadi pemimpin pasar di bidang radio dan elektronik lainnya. Mungkin dengan mengontrak dan mendanai perusahaan elektronik Belanda ini, kita bisa mencapai beberapa terobosan dalam jenis peralatan militer yang semakin penting ini."
 HOL_philips_focus_tt: "Membuka §YPhilips§! sebagai Kepedulian Industri."
 HOL_expand_RD_facilities: "Memperluas Fasilitas Litbang"
 HOL_expand_RD_facilities_desc: "Ekspansi industri kami dan kemajuan terkini lainnya memungkinkan kami melakukan lebih banyak penelitian dan pengembangan secara paralel, terutama jika kami memperluas fasilitas Philips yang sudah ada."
 HOL_the_zuiderzee_works: "Lanjutkan Pekerjaan Zuiderzee"
 HOL_the_zuiderzee_works_desc: "Tahap reklamasi lahan selanjutnya adalah Flevopolder, dinamai berdasarkan nama danau Flevo kuno yang pertama kali disebutkan pada zaman Romawi. Ini adalah proyek luar biasa yang membutuhkan waktu bertahun-tahun untuk diselesaikan sepenuhnya, namun bahkan dalam jangka pendek, hal ini akan memberi kita banyak manfaat."
 HOL_develop_the_randstad: "Kembangkan Randstad"
 HOL_develop_the_randstad_desc: "Dengan mengembangkan kota-kota terbesar kita dan wilayah-wilayah yang menghubungkannya lebih jauh lagi, kita dapat meletakkan fondasi dari apa yang oleh sebagian orang sudah mulai disebut sebagai 'Kota Lingkar'; kawasan perkotaan berbentuk lingkaran yang menghubungkan kota-kota besar Amsterdam, Den Haag, Rotterdam, dan Utrecht, mengelilingi 'Groene Hart' atau 'Green Heart' di tengah 'rim'."
 HOL_expand_the_ijmuiden_steel_mill: "Perluas Pabrik Baja IJmuiden"
 HOL_expand_the_ijmuiden_steel_mill_desc: "Industri perang kita membutuhkan banyak baja, dan kita harus memperluas fasilitas yang sudah ada di IJmuiden."
 HOL_fokker: "Foker"
 HOL_fokker_desc: "Fokker, pemimpin dunia dalam produksi pesawat sipil, telah memanfaatkan peluang untuk memproduksi lebih banyak pesawat militer. Mungkin kita harus membiarkan mereka, dan mendukung perluasan industri yang memerlukan hal ini."
 HOL_fokker_tt: "Membuka §YFokker§! sebagai Perancang Pesawat."
 HOL_domestic_jet_engine_designs: "Desain Mesin Jet Domestik"
 HOL_domestic_jet_engine_designs_desc: "Pembuat pesawat inovatif kita harus didorong untuk bereksperimen dengan desain futuristik. Meskipun hasilnya mungkin tidak serta merta berupa pesawat bermesin jet yang dapat berfungsi dengan baik, hal ini tentu saja akan menghasilkan perbaikan dalam produksi pesawat secara umum."
 HOL_develop_the_zandstad: "Kembangkan Zandstad"
 HOL_develop_the_zandstad_desc: "Daripada memfokuskan semua upaya kita dalam membangun kota-kota terbesar, kita harus mendistribusikan industri baru lebih banyak ke daerah-daerah terpencil."
 HOL_friesland_agricultural_impetus: "Dorongan Pertanian Friesland"
 HOL_friesland_agricultural_impetus_desc: "Meningkatkan hasil pertanian di negara kecil kita akan sangat membantu dalam meningkatkan swasembada, dan dengan demikian mengurangi kebutuhan impor."
 HOL_daf: "DAF"
 HOL_daf_desc: "Industri mobil dalam negeri kita bukannya tidak ada, dan bisa saja dikontrak untuk memproduksi kendaraan militer. Dengan bantuan negara, Aanhangwagen Fabriek (DAF) pimpinan Van Doorne, bisa menyediakan semua peralatan bermotor dan mekanis yang mungkin dibutuhkan militer kita."
 HOL_daf_tt: "Membuka §YDAF§! sebagai Desainer Materiel."
 HOL_domestic_vehicle_designs: "Desain Kendaraan Domestik"
 HOL_domestic_vehicle_designs_desc: "Memberikan lebih banyak kebebasan kepada industri otomotif kita dalam menangani desainnya mungkin juga mempunyai efek samping dalam meningkatkan efisiensi produksi."
 HOL_continental_shipbuilding: "Pembuatan Kapal Kontinental"
 HOL_continental_shipbuilding_desc: "Galangan kapal kami di Holland, Zeeland, dan Friesland harus diperluas secara besar-besaran untuk memungkinkan rencana pembangunan angkatan laut skala besar."
 HOL_domestic_innovation: "Inovasi Dalam Negeri"
 HOL_domestic_innovation_desc: "Pesatnya industrialisasi di negara kita telah membuka peluang baru dalam penelitian dan pengembangan yang patut kita kejar."
 HOL_make_use_of_our_riches: "Manfaatkan Kekayaan Kita"
 HOL_make_use_of_our_riches_desc: "Bangsa kita memiliki sumber daya yang dimiliki oleh negara besar, namun tetap mengenakan pakaian negara kecil. Mungkin jika kita memanfaatkan kekayaan yang tersedia dengan lebih baik, kita bisa naik ke level menengah, atau bahkan kembali menjadi salah satu kekuatan dominan di dunia."
 HOL_the_ultimate_deterrent: "Pencegah Utama"
 HOL_the_ultimate_deterrent_desc: "Angkatan udara yang kuat dan angkatan laut yang kuat semuanya baik-baik saja, tetapi yang benar-benar dapat menghalangi siapa pun untuk menyerang koloni kita, atau melanggar netralitas kita, adalah pengembangan bom atom."
 HOL_overturn_military_budget_cuts: "Membatalkan Pemotongan Anggaran Militer"
 HOL_overturn_military_budget_cuts_desc: "Perekonomian secara mengejutkan mulai pulih dengan cepat setelah kita meninggalkan Standar Emas... Pemotongan anggaran militer yang terpaksa kita terapkan untuk menjaga agar Gulden tidak mengalami devaluasi kini dapat dibatalkan."
 HOL_prepare_the_inundation_lines: "Siapkan Jalur Genangan"
 HOL_prepare_the_inundation_lines_desc: "Sejak perang kemerdekaan kita melawan Spanyol pada abad ke-16, penggenangan, atau banjir yang disengaja, telah menjadi bagian integral dari pertahanan kita. Jika dipersiapkan dengan baik, ini pasti akan menyelamatkan kita lagi: kita belum pernah melihat tangki yang bisa melintasi air."
 HOL_prepare_the_inundation_lines_tt: "Hal ini memungkinkan terjadinya §YFlooding§! dan §YDraining§! di provinsi tertentu di sekitar Fortress Holland, sehingga memberikan bonus pertahanan."
 HOL_protect_against_britain: "Lindungi Terhadap Inggris"
 HOL_protect_against_britain_desc: "Netralitas sejati berarti bahwa kita harus mempertahankan kedaulatan kita terhadap siapa pun yang melanggarnya... Sekalipun pihak tersebut adalah pihak Inggris, dalam upaya yang salah arah untuk melindungi pelabuhan dan lapangan udara kita dari pihak Jerman."
 HOL_further_reinforce_the_ports: "Lebih Memperkuat Pelabuhan"
 HOL_further_reinforce_the_ports_desc: "Kita harus lebih memperkuat pertahanan pesisir kita, untuk mencegah gagasan Inggris untuk \"meminjamkan bantuan mereka\" tanpa izin tertulis dari kita."
 HOL_southward_defenses: "Pertahanan ke Selatan"
 HOL_southward_defenses_desc: "Kita harus membangun garis pertahanan di sepanjang sungai Meuse, untuk menggagalkan setiap serangan ke utara melalui Belgia. Penguatan terakhir pertahanan pesisir kita akan menghancurkan potensi rencana Inggris untuk mendaratkan pasukan ekspedisi di pelabuhan kita."
 HOL_germany_is_the_greater_threat: "Jerman adalah Ancaman Lebih Besar"
 HOL_germany_is_the_greater_threat_desc: "Mengingat agresi Jerman yang semakin meningkat, kita harus mengarahkan pertahanan kita ke arah timur, kalau-kalau mereka kurang menghargai netralitas kita dibandingkan pada perang terakhir..."
 HOL_fortress_holland: "Benteng Belanda"
 HOL_fortress_holland_desc: "Kita harus mempertaruhkan segalanya pada Fortress Holland. Wilayah utara sungai-sungai besar dan barat IJsselmeer mencakup sebagian besar populasi dan industri kita. Mengorbankan wilayah lain di negara ini mungkin akan membuat kita bisa bertahan cukup lama di kawasan industri agar sekutu yang lebih kuat bisa datang membantu kita pada waktunya."
 HOL_modernize_the_grebbeline: "Modernisasi Jalur Grebbe"
 HOL_modernize_the_grebbeline_desc: "Bagian depan selatan Benteng Holland dilindungi dengan baik oleh sungai besar Rhine dan Meuse. Hal ini hanya menyisakan celah di sebelah timur Amsterdam, antara IJsselmeer di utara dan Sungai Rhine di selatan. Garis pertahanan yang terletak di sini, Garis Grebbe, harus dimodernisasi dan diperkuat jika ingin menahan serangan yang gigih."
 HOL_war_on_pacifism: "Perang Melawan Pasifisme"
 HOL_war_on_pacifism_desc: "Sejak Perang Besar, pasifisme telah merajalela di kalangan masyarakat Belanda, sehingga mustahil untuk membentuk militer modern. Sudah terlalu lama 'Keinginan Rakyat' menghalangi alokasi penuh dana yang diperlukan untuk militer. Mereka tidak mengetahui bahaya yang mereka hadapi... Kami akan mendeklarasikan perang terhadap Pasifisme, dan membuang sentimen tidak produktif ini dari benak masyarakat kami!"
 HOL_war_on_pacifism_tt: "Keputusan ini memungkinkan §Gpengurangan/penghapusan§! dari §YPenonton Perang Besar yang terkejut§!."
 HOL_appoint_new_supreme_commander: "Tunjuk Panglima Tertinggi Baru"
 HOL_appoint_new_supreme_commander_desc: "Panglima tertinggi kita terbukti keras kepala dalam menjalankan rencana pertahanan yang mustahil dilakukan. Dia harus diganti. Henri Winkelman dapat dipanggil kembali dari masa pensiunnya, dan kemungkinan besar akan menjadi alternatif yang lebih... setuju."
 HOL_appoint_new_supreme_commander_tt: "§YHenri Winkelman§! menjadi Marsekal Lapangan."
 HOL_modernize_our_infantry_equipment: "Modernkan Peralatan Infanteri Kami"
 HOL_modernize_our_infantry_equipment_desc: "Peralatan infanteri kami sudah ketinggalan zaman. Jika kita ingin mempunyai kesempatan yang baik untuk menghentikan invasi apa pun, hal ini harus diatasi."
 HOL_modernize_our_infantry_equipment_tt: "Hal ini akan menyebabkan kami fokus pada pengembangan peralatan internal dibandingkan produksi lisensi di masa depan."
 HOL_production_under_license: "Produksi Di Bawah Lisensi"
 HOL_production_under_license_desc: "Karena kita tidak mempunyai industri senjata dalam negeri, kita harus melihat model senjata kecil dan artileri yang lebih baru di luar negeri. Jika beruntung, kami bisa memperoleh hak untuk memproduksinya di dalam negeri, dengan lisensi."
 HOL_production_under_license_tt: "Hal ini akan menyebabkan kami fokus pada produksi lisensi dibandingkan pengembangan peralatan internal di masa depan."
 HOL_light_tanks_for_the_colonies: "Tank Ringan untuk Koloni"
 HOL_light_tanks_for_the_colonies_desc: "Tank ringan akan sangat cocok untuk mempertahankan medan koloni pulau kita yang luas dan sulit dari pendaratan infanteri amfibi."
 HOL_light_tanks_for_the_colonies_tt: "Bergantung pada apakah Anda memilih untuk fokus pada modernisasi atau produksi lisensi, fokus ini memberikan salah satu hal berikut:"
 HOL_light_tanks_for_the_colonies_2tt: "Atau:"
 HOL_secret_staff_talks: "Pembicaraan Staf Rahasia"
 HOL_secret_staff_talks_desc: "Meskipun kami secara resmi netral, kami tetap harus mempertimbangkan pembicaraan rahasia staf dengan tetangga kami. Rencana pertahanan terpadu yang dilakukan bersama salah satu negara tetangga kita, meskipun tidak resmi, bisa menjadi sangat penting jika kita diserang oleh negara lain."
 HOL_secret_staff_talks_tt: "Hal ini memungkinkan untuk memperoleh §YPeralatan§!, §YSerangan§! dan §YPertahanan§! bonus tempur, §YDoktrin Tanah§! bonus penelitian, dan Pemerintahan di Pengasingan £legitimacy §YLegitimasi§!."
 HOL_anti_tank_guns_for_the_continent: "Senjata Anti Tank untuk Benua"
 HOL_anti_tank_guns_for_the_continent_desc: "Sejak Perang Besar, kita telah melihat negara-negara tetangga kita meningkatkan desain tank mereka. Jika invasi datang, mesin-mesin ini pasti akan menjadi bagian integral darinya. Kita harus mempersiapkannya dengan baik."
 HOL_lessons_from_the_last_war: "Pelajaran dari Perang Terakhir"
 HOL_lessons_from_the_last_war_desc: "Meskipun kami mungkin tidak terlibat, kami memiliki tempat utama untuk mengamati intrik dan kegagalan Rencana Schlieffen di depan pintu kami. Kita harus menarik kesimpulan dari pengamatan ini."
 HOL_expand_the_mld: "Perluas MLD"
 HOL_expand_the_mld_desc: "Sejauh ini, bagian terpenting dari angkatan udara kita adalah cabang penerbangan angkatan laut: Marine Luchtvaart Dienst atau MLD. Kita harus memperluas cabang ini, meningkatkan basis operasi utamanya di Hindia Timur, dan mengembangkan taktik dan strategi baru untuk penggunaannya."
 HOL_protect_the_mainland: "Lindungi Daratan"
 HOL_protect_the_mainland_desc: "Untuk melindungi benua Belanda kita harus memperoleh armada pesawat tempur modern, untuk mempertahankan superioritas udara di langit kita."
 HOL_protect_the_colonies: "Lindungi Koloni"
 HOL_protect_the_colonies_desc: "Kita harus menempatkan sejumlah besar pembom angkatan laut modern di koloni-koloni untuk mencegah segala upaya invasi angkatan laut, dan untuk melindungi diri dari invasi jika diperlukan."
 netherlands_has_no_colonies_tt: "§YBelanda§! tidak memiliki atau memiliki subjek yang memiliki §Ywilayah kolonial§! awal mereka."
 HOL_modernize_the_air_fleet: "Modernisasi Armada Udara"
 HOL_modernize_the_air_fleet_desc: "Kita harus secara drastis mempercepat perolehan model pesawat yang kita butuhkan untuk pertahanan kita. Waktunya singkat!"
 HOL_strategic_bombing_defense: "Pertahanan Bom Strategis"
 HOL_strategic_bombing_defense_desc: "Jika perang terjadi di Belanda, hal itu pasti akan melibatkan pemboman strategis dalam skala terbesar yang bisa dibayangkan. Kita harus mengembangkan doktrin-doktrin baru untuk menghadapi ancaman ini, dan kita harus memperluas pangkalan udara kontinental kita untuk memungkinkan adanya angkatan udara dalam jumlah besar yang dibutuhkan oleh doktrin-doktrin ini."
 HOL_longer_range_models: "Model Jarak Jauh"
 HOL_longer_range_models_desc: "Dominasi atas lautan sangat penting bagi integritas kerajaan kolonial kita. Namun, lautan sangat luas sehingga kita memerlukan pesawat terbang dengan jangkauan yang memadai."
 HOL_unsinkable_aircraft_carriers: "Kapal Induk yang Tidak Dapat Tenggelam"
 HOL_unsinkable_aircraft_carriers_desc: "Dengan munculnya peperangan dimensi ketiga, kita harus memastikan perlindungan udara yang memadai bagi armada kita. Namun, kapal induk baja yang dapat tenggelam merupakan investasi yang mudah berubah... Sebaliknya, ribuan pulau yang tersebar di seluruh Hindia Timur dapat berfungsi sebagai \"kapal induk yang tidak dapat tenggelam\", jika saja kita menempatkan beberapa lapangan udara di sana."
 HOL_aviatic_aspirations: "Aspirasi Penerbangan"
 HOL_aviatic_aspirations_desc: "Udara adalah medan perang yang baru, namun kita tidak bisa menguasainya. Kita sudah menunjukkan kemampuannya di industri penerbangan sipil, tentunya tidak akan sulit untuk mentransfernya ke ranah militer."
 HOL_prepare_naval_expansion: "Mempersiapkan Ekspansi Angkatan Laut"
 HOL_prepare_naval_expansion_desc: "Kita harus mempersiapkan perluasan angkatan laut kita tepat pada waktunya, dan oleh karena itu kita harus mulai mengerahkan sumber daya untuk perluasan pembuatan kapal Belanda SEKARANG."
 HOL_expand_the_amsterdam_petroleum_harbor: "Perluas Pelabuhan Minyak Amsterdam"
 HOL_expand_the_amsterdam_petroleum_harbor_desc: "Peningkatan jumlah angkatan laut kita memerlukan peningkatan jumlah cadangan bahan bakar yang sebanding, agar kita tidak mempunyai kapal yang tidak mampu kita gunakan. Pelabuhan minyak bumi Amsterdam sudah menjadi pusat impor bahan bakar; kami akan meningkatkan kapasitas penyimpanannya lebih jauh lagi."
 HOL_cornerstone_of_colonial_defense: "Landasan Pertahanan Kolonial"
 HOL_cornerstone_of_colonial_defense_desc: "Armada adalah pilar pertahanan terpenting bagi kerajaan kolonial kita. Kita harus mencari cara terbaik untuk memanfaatkan apa yang kita miliki."
 HOL_rely_on_submarines: "Andalkan Kapal Selam"
 HOL_rely_on_submarines_desc: "Bahkan kapal penjelajah modern pun tidak akan membantu melawan angkatan laut besar yang mungkin harus kita lawan. Sebagai gantinya, kita akan berinvestasi pada kapal selam modern untuk menunda kemajuan musuh hingga armada sekutu yang lebih kuat dapat tiba."
 HOL_modernize_the_cruiser_fleet: "Modernisasi Armada Kapal Penjelajah"
 HOL_modernize_the_cruiser_fleet_desc: "Kapal penjelajah kami sangat penting bagi rencana pertahanan kami di Hindia Timur, namun kapal yang kami miliki saat ini sudah berumur tua. Kami akan merancang kapal perang generasi baru yang dapat mulai kami bangun sesegera mungkin."
 HOL_the_battlecruiser_plan: "Rencana Kapal Penjelajah Pertempuran"
 HOL_the_battlecruiser_plan_desc: "Suara-suara mulai bermunculan yang mendukung penciptaan trio Penjelajah Tempur; kapal yang lebih besar dari apa pun yang pernah kami buat atau rancang sebelumnya. Dengan niat baik Jerman, mereka mungkin akan memberi kita rencana untuk kapal penjelajah tempur Jerman Scharnhorst, sehingga memungkinkan kita menggunakannya sebagai dasar untuk membuat desain kita sendiri. Kapal-kapal ini pasti akan mencegah serangan apa pun terhadap koloni kita."
 HOL_the_battlecruiser_plan_tt: "§R[GER.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 HOL_air_cover_for_the_new_fleet: "Perlindungan Udara untuk Armada Baru"
 HOL_air_cover_for_the_new_fleet_desc: "Jika kita berinvestasi pada kapal penjelajah tempur besar maka kita juga harus menjamin perlindungan udara yang memadai bagi mereka, agar kapal-kapal tersebut tidak terbuang percuma. Kami akan melihat desain kapal induk."
 HOL_escorts_for_the_new_fleet: "Pengawal untuk Armada Baru"
 HOL_escorts_for_the_new_fleet_desc: "Kapal penjelajah tempur kami memerlukan pengawalan yang cukup untuk melindungi dari kapal torpedo dan kapal selam. Kita harus memastikan bahwa setiap pengawalan yang kita bangun memiliki desain paling modern."
 HOL_naval_heritage: "Warisan Angkatan Laut"
 HOL_naval_heritage_desc: "Dari Piet Hein hingga Michiel de Ruyter, sejarah negara kita dipenuhi dengan pahlawan angkatan laut dan keberhasilan mereka melawan kekuatan angkatan laut utama pada zaman mereka. Kekeluargaan dengan lautan mengalir dalam darah kita, dan kita perlu merangkulnya untuk menghidupkan kembali kebanggaan dan warisan angkatan laut kita."
 HOL_form_new_government: "Bentuk Pemerintahan Baru"
 HOL_form_new_government_desc: "Pemerintahan kita saat ini lemah dan berada di ambang kejatuhan lagi. Kami akan memberikan tugas kepada Perdana Menteri baru untuk membentuk kabinet yang lebih kuat."
 HOL_gateway_to_europe: "Gerbang ke Eropa"
 HOL_gateway_to_europe_desc: "Belanda adalah pintu gerbang perdagangan ke Eropa, sebuah fakta yang dipahami dengan baik oleh mitra dagang kami. Meskipun posisi kami memberi kami kekuatan, hal ini juga menempatkan kami dalam kesulitan yang tidak menyenangkan: ketika Inggris bertujuan untuk memblokade musuh-musuh mereka di benua ini, Jerman ingin agar kami meningkatkan arus perdagangan ke negara mereka melalui kami, dan menggunakan kami sebagai pintu belakang untuk menghindari blokade."
 HOL_gateway_to_europe_tt: "Hal ini memungkinkan untuk memberikan poin Pengaruh Perdagangan kepada §Y[GER.GetName]§! dan §Y[ENG.GetName]§!."
 HOL_cave_to_the_germans: "Gua bagi Jerman"
 HOL_cave_to_the_germans_desc: "Karena berbagi perbatasan darat dengan Jerman, kita dapat memperkirakan akan terjadi invasi jika kita menolak tuntutan mereka untuk meningkatkan arus perdagangan melalui negara kita. Biarkan mereka menggunakan kita sebagai pintu belakang untuk menghindari blokade Inggris, jika itu berarti keselamatan kita!"
 HOL_trade_influence_tt: "Menerima sejumlah §YKekuatan Politik§! sama dengan jumlah total yang diinvestasikan oleh semua peserta §YGateway ke Eropa§!. Saat ini berjumlah:"
 HOL_cave_to_the_germans_tt: "@GER§Y[GER.GetName]§! memiliki setidaknya §Y15§! poin Pengaruh Perdagangan lebih banyak daripada @ENG§Y[ENG.GetName]§!."
 HOL_cave_to_the_germans2_tt: "@GER§Y[GER.GetName]§! memiliki setidaknya §Y25§! poin Pengaruh Perdagangan."
 HOL_maintain_trade_neutrality: "Menjaga Netralitas Perdagangan"
 HOL_maintain_trade_neutrality_desc: "Kita harus menolak tuntutan perdagangan dari kedua belah pihak, dan mempertahankan kebijakan perdagangan kita seperti sekarang. Memilih salah satu pihak kemungkinan besar akan menyebabkan perang dengan pihak lain..."
 HOL_maintain_trade_neutrality_tt: "Baik @GER§Y[GER.GetName]§! maupun @ENG§Y[ENG.GetName]§! tidak memiliki lebih dari §Y5§! poin Pengaruh Perdagangan lebih banyak dari yang lain."
 HOL_maintain_trade_neutrality2_tt: "@GER§Y[GER.GetName]§! dan @ENG§Y[ENG.GetName]§! memiliki setidaknya §Y50§! poin Pengaruh Perdagangan."
 HOL_cave_to_the_british: "Gua bagi Inggris"
 HOL_cave_to_the_british_desc: "Inggris terlibat dalam negosiasi dagang yang sengit dengan kami, menuntut agar kami mengurangi arus perdagangan melalui negara kami ke Jerman, karena mereka takut Jerman akan menggunakan kami sebagai pintu belakang untuk menghindari blokade Inggris. Jika kami menolak, Inggris juga akan memblokade kami... Hal ini akan menjadi bencana besar bagi perekonomian kami yang belum pulih, sehingga kami tidak punya pilihan selain menuruti keinginan mereka."
 HOL_cave_to_the_british_tt: "@ENG§Y[ENG.GetName]§! memiliki setidaknya §Y15§! poin Pengaruh Perdagangan lebih dari @GER§Y[GER.GetName]§!"
 HOL_cave_to_the_british2_tt: "@ENG§Y[ENG.GetName]§! memiliki setidaknya §Y25§! poin Pengaruh Perdagangan."
 HOL_volk_en_vaderland: "Volk en Vaderland"
 HOL_volk_en_vaderland_desc: "Keputusan kita untuk memihak salah satu negara tetangga berarti kita telah benar-benar mengabaikan kenetralan kita. Meningkatnya suara pro-Jerman dan retorika nasionalis akibat keputusan kami baru-baru ini mulai terlihat jelas dalam politik internal kami, seperti dalam bentuk surat kabar sayap kanan 'Rakyat dan Tanah Air'."
 HOL_de_jeugdstorm: "De Jeugdstorm"
 HOL_de_jeugdstorm_desc: "Menjauhkan masyarakat dari paham pasifisme dan menanamkan budaya militerisme dalam waktu beberapa tahun bukanlah hal yang mudah. Namun dengan propaganda, retorika, dan dimulai dari generasi muda yang mudah dipengaruhi, kita akan mengelolanya semaksimal mungkin."
 HOL_strength_over_blood: "Kekuatan Atas Darah"
 HOL_strength_over_blood_desc: "Darah seharusnya tidak ada hubungannya dengan apakah seseorang menjadi pemimpin atau tidak. Biarkan mereka yang menunjukkan kekuatannya memimpin bangsa kita, daripada mereka yang darahnya biru saat lahir."
 HOL_join_germany: "Bergabunglah dengan Jerman"
 HOL_join_germany_desc: "Kita yang memiliki semangat yang sama harus bersatu melawan Dunia. Sudah saatnya kita meminta keanggotaan Axis."
 HOL_german_technological_exchange: "Pertukaran Teknologi Jerman"
 HOL_german_technological_exchange_desc: "Dengan akses terhadap teknologi Jerman, kita akan mampu memikul beban yang sama dalam membentuk Tatanan Dunia Baru dengan lebih baik."
 HOL_beginnings_of_a_dutch_blitzkrieg: "Awal dari Blitzkrieg Belanda"
 HOL_beginnings_of_a_dutch_blitzkrieg_desc: "Dengan bantuan Jerman mungkin kita bisa bergabung dalam Blitzkrieg dengan pasukan tank kita sendiri."
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_1: "Mendapatkan §YLisensi Produksi§! untuk model §YMedium Tank§! terbaik yang saat ini dikembangkan oleh §Y[GER.GetNameDef]§!."
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_2: "Mendapatkan bonus penelitian untuk semua model §YMedium Tank§! yang saat ini dikembangkan oleh §Y[GER.GetNameDef]§!."
 HOL_placate_the_japanese: "Tenangkan orang Jepang"
 HOL_placate_the_japanese_desc: "Diketahui bahwa Jepang mempunyai rencana terhadap koloni kita yang kaya di Timur. Mungkin sudah tiba saatnya untuk memutuskan apakah akan memberi mereka hak eksklusif atas sumber daya nusantara, atau bahkan mengendalikan koloni secara langsung, demi kepentingan perdamaian dan kerja sama yang berkelanjutan."
 HOL_assume_the_naval_burden: "Asumsikan Beban Angkatan Laut"
 HOL_assume_the_naval_burden_desc: "Meskipun sekutu kita ahli dalam perang darat, mungkin sejarah angkatan laut kita memberi kita kesempatan lebih baik untuk mengambil bagian dalam perang di angkatan laut."
 HOL_the_netherlands_first: "Belanda Pertama"
 HOL_the_netherlands_first_desc: "Belanda memiliki seluruh kekayaan sumber daya alam yang menjadi Kekuatan Besar tersendiri. Jika kita memanfaatkannya dengan baik, dan terus memiliterisasi masyarakat kita, kita tidak memerlukan bantuan Jerman untuk membangun tempat kita sendiri di dunia ini."
 HOL_implement_the_program: "Melaksanakan \"Program\""
 HOL_implement_the_program_desc: "Kini bangsa sudah aman di bawah kepemimpinan Pemimpin kita, sekarang saatnya melaksanakan 'Program' partai. Pemerintahan yang kuat, reformasi ekonomi dan sosial, serta penghapusan kebebasan pers dan hak pilih hanyalah beberapa hal yang akan membuat masyarakat kita lebih kuat. Semua harus melakukan tugasnya untuk Tanah Air!"
 HOL_taking_back_french_flanders: "Mengambil Kembali Flanders Prancis"
 HOL_taking_back_french_flanders_desc: "Luasnya sejarah negara-negara rendah telah dipecah-pecah oleh negara-negara besar yang mengelilinginya. Dari jumlah tersebut, Prancis masih memiliki sejumlah besar wilayah yang dianggap sebagai bagian dari Flanders yang bersejarah. Kami sekarang cukup kuat untuk mengambilnya kembali, dan memang seharusnya begitu."
 HOL_the_united_netherlands: "Belanda Bersatu"
 HOL_the_united_netherlands_desc: "Masyarakat kita menjadi lebih kuat jika bersatu. Bahkan Inggris mengetahui hal ini ketika mereka menciptakan negara penyangga Belanda Bersatu setelah perang Napoleon. Meskipun berumur pendek, hal ini berarti diperlukan kepemimpinan yang lebih kuat agar proposal tersebut berhasil. Kami akan mengembalikan Belgia dan Luksemburg ke dalam kelompok, untuk kemudian berdiri teguh melawan siapa pun yang datang."
 HOL_taking_back_our_old_colonies: "Mengambil Kembali Koloni Lama Kami"
 HOL_taking_back_our_old_colonies_desc: "Kelemahan sementara kita akibat penaklukan Napoleon hampir 150 tahun yang lalu membuat kita kehilangan sebagian besar wilayah jajahan kita ke tangan Inggris. Sebagian besar populasinya masih memiliki budaya dan warisan Belanda yang sama. Kita harus mengambil kembali harta kolonial lama kita!"
 HOL_imperial_ambitions: "Ambisi Kekaisaran"
 HOL_imperial_ambitions_desc: "Saat rakyat kita menikmati kejayaan yang sesuai dengan status kita sebagai kekuatan Kekaisaran, yang tersisa hanyalah merebut kembali koloni lama kita di Nieuw Nederland di Amerika Serikat bagian timur laut."
 HOL_legacy_of_the_de_zeven_provincien_mutiny: "Warisan Pemberontakan \"De Zeven Provinciën\"."
 HOL_legacy_of_the_de_zeven_provincien_mutiny_desc: "Pemberontakan di kapal penjelajah \"De Zeven Provinciën\" pada bulan Februari 1933 telah menjadi topik tabu sejak saat itu. Kita harus menjadikan topik ini bisa didiskusikan lagi, jangan sampai kita melupakan pengorbanan yang telah dilakukan oleh orang-orang pemberani demi perjuangan Buruh. Kita semua harus mengambil contoh dari tindakan mereka, dan bangkit membela cita-cita kita!"
 HOL_decolonization: "Dekolonisasi"
 HOL_decolonization_desc: "Tanah air kita mempunyai banyak masalah, dan daripada mengirimkan sumber daya kita ke luar negeri untuk mengurus koloni kita, sambil menindas penduduk asli, kita harus memberikan kebebasan kepada mereka sehingga mereka dapat bangkit sebagai anggota komunitas global yang penuh dan setara, sambil menarik pasukan kita kembali ke daratan."
 HOL_decolonization_tt1: "Semua negara bagian di §YIndonesia§!: Dikendalikan sepenuhnya oleh §Y[INS.GetNameDef]§!"
 HOL_decolonization_tt2: "Semua negara bagian di §YIndonesia§!: Dikendalikan sepenuhnya oleh §Y[HOL.GetNameDef]§!"
 HOL_decolonization_tt: "Membentuk 8 unit KNIL dengan batalyon §Y9 Infanteri§! di §YHolland§!."
 HOL_red_is_the_new_orange: "Merah adalah Oranye Baru"
 HOL_red_is_the_new_orange_desc: "Kesetaraan tidak memberikan ruang bagi siapa pun untuk ditinggikan di atas yang lain, bahkan jika ini adalah sebuah keluarga yang sangat terkait dengan sejarah bangsa kita. Hak milik mereka harus dicabut, dan sumber daya mereka disita demi kepentingan bersama."
 HOL_affirm_loyalty_to_moscow: "Tegaskan Kesetiaan Kepada [SOU.Capital.GetCapitalVictoryPointName]"
 HOL_affirm_loyalty_to_moscow_desc: "Partai kami telah lama mengikuti instruksi dari [SOU.Capital.GetCapitalVictoryPointName], dan wajar saja jika kami bergabung dengan mereka dalam perjuangan menyebarkan komunisme ke seluruh dunia."
 HOL_soviet_technical_teams: "Tim Teknis Soviet"
 HOL_soviet_technical_teams_desc: "Sekutu kita telah menguasai seni memaksimalkan produksi peralatan perang. Dengan menerima beberapa tim ahli, kami dapat menyempurnakan lini produksi kami untuk memanfaatkan inovasi mereka."
 HOL_making_the_ends_of_europe_meet: "Memenuhi Tujuan Eropa"
 HOL_making_the_ends_of_europe_meet_desc: "Komunisme kini merangkul Eropa dari kedua sisi. Inilah saatnya untuk memenuhi tujuan-tujuan tersebut, dan menghilangkan kekuatan yang ada di antara keduanya."
 HOL_join_the_french: "Bergabunglah dengan Prancis"
 HOL_join_the_french_desc: "Gerakan komunis di Perancis semakin sukses, dan kini mereka memilih untuk berdiri terpisah dari Komintern. Karena mereka secara geografis lebih dekat dengan kita, maka menyelaraskan diri dengan mereka akan jauh lebih bermanfaat bagi komunisme dibandingkan bergantung pada Soviet yang jauh."
 HOL_french_military_mission: "Misi Militer Prancis"
 HOL_french_military_mission_desc: "Militer Perancis terkenal di seluruh benua. Kami akan mengundang misi militer, untuk mendidik para pemikir militer kami dan meningkatkan organisasi tentara kami."
 HOL_socialist_industrial_support: "Dukungan Industri Sosialis"
 HOL_socialist_industrial_support_desc: "Sekutu kita mempunyai kapasitas industri yang jauh lebih besar dibandingkan kita. Kita akan membutuhkan bantuan mereka jika kita ingin menghadapi badai yang akan datang."
 HOL_for_the_common_good: "Demi Kebaikan Bersama"
 HOL_for_the_common_good_desc: "Demi kebaikan bersama bagi seluruh Komunisme, kita harus saling berbagi kemajuan teknologi."
 HOL_for_the_common_good_tt: "§Y[HOL.GetName]§! dan seluruh anggota fraksi bergabung §YPertukaran Teknologi Komunis§!."
 HOL_mobilize_the_masses: "Memobilisasi Massa"
 HOL_mobilize_the_masses_desc: "Satu-satunya yang bisa membela pekerja adalah pekerja. Rakyat harus bangkit membela negara dan keyakinan mereka!"
 HOL_bastion_of_true_communism: "Benteng Komunisme Sejati"
 HOL_bastion_of_true_communism_desc: "Kami berdiri sendiri di Eropa Barat dalam penafsiran kami terhadap komunisme. Kita tidak punya siapa pun untuk dijadikan sandaran, jadi kita harus mengandalkan diri kita sendiri untuk mencapai kemenangan akhir bagi perjuangan komunis."
 HOL_bring_socialism_south: "Bawa Sosialisme ke Selatan"
 HOL_bring_socialism_south_desc: "Kita harus mendukung kawan-kawan ideologis kita di Selatan, jika perlu dengan kekerasan. Karena kita begitu jauh dari Moskow, dan dilanda ideologi permusuhan dari semua pihak, kita sendiri harus membentuk Benteng Komunisme yang kuat di wilayah barat Eropa."
 HOL_enemies_on_all_fronts: "Musuh di Semua Front"
 HOL_enemies_on_all_fronts_desc: "Negara kita kecil dan tidak memiliki kedalaman strategis. Satu-satunya harapan kami untuk bertahan hidup adalah bahwa setiap pria dan wanita melakukan tugas mereka, dan bahwa setiap penyerbu akan berhadapan dengan banyak orang yang tidak dapat mereka atasi."
 HOL_haven_of_tolerance: "Surga Toleransi"
 HOL_haven_of_tolerance_desc: "Semangat Belanda bersinar bahkan dalam komunisme. Kami menyambut siapa saja yang dijauhi oleh tanah air mereka. Kami tidak bertanya tentang masa lalu mereka, hanya saja mereka melakukan tugas mereka untuk melindungi Eden yang baru lahir ini dari kekuatan yang akan menghambatnya."
 HOL_pre_empt_western_intervention: "Mencegah Intervensi Barat"
 HOL_pre_empt_western_intervention_desc: "Ketika ideologi kita mulai berkembang, ada kekuatan-kekuatan yang akan melihat ideologi kita gagal dalam masa pertumbuhannya. Kita tidak bisa membiarkan hal ini terjadi, dan daripada menunggu sampai terjadinya bencana, kita harus bertindak cepat dan menghilangkan ancaman ini terhadap kelangsungan hidup kita."
 HOL_oranje_boven: "Oranje Boven!"
 HOL_oranje_boven_desc: "Sejarah negara kita terkait dengan keluarga kerajaan Orange-Nassau. Oleh karena itu, warna oranye telah menjadi simbol nasional, tercermin baik dalam kebiasaan menambahkan panji oranye pada bendera pada hari perayaan nasional, maupun lagu-lagu patriotik pendek seperti 'Oranje Boven', atau 'Orange Above', yang merayakan Ratu dan keluarga kerajaan secara keseluruhan."
 HOL_symbol_of_resistance: "Simbol Perlawanan"
 HOL_symbol_of_resistance_desc: "Sejak William the Silent mengamankan kemerdekaan kita dari Spanyol dalam Perang 80 Tahun, keluarga kerajaan telah menjadi simbol kemerdekaan Belanda dan perlawanan terhadap penjajah asing. Tentu saja, jika perbatasan kita dilanggar lagi, hal yang sama tidak akan terjadi."
 HOL_replace_the_defeatist_government: "Gantikan Pemerintahan yang Mengalah"
 HOL_replace_the_defeatist_government_desc: "Pemerintahan kita penuh dengan pengecut yang tidak melihat gunanya terus melawan agresor. Kita harus mengganti orang-orang ini dengan orang-orang yang bersedia melakukan apa yang harus dilakukan agar perjuangan ini dapat berakhir dengan sukses."
 HOL_the_only_man_in_the_dutch_government: "Satu-satunya Orang di Pemerintahan Belanda"
 HOL_the_only_man_in_the_dutch_government_desc: "Seperti yang pernah dikatakan Churchill sendiri, Ratu Wilhelmina yang kita banggakan adalah 'satu-satunya orang di pemerintahan Belanda'; satu-satunya yang memiliki tulang punggung untuk melakukan apa yang harus dilakukan. Daripada bergantung pada mereka yang lemah, mungkin dia harus mengambil kendali langsung atas pemerintahan dan memerintah sesuai keinginannya."
 HOL_de_vernieuwing: "De Vernieuwing"
 HOL_de_vernieuwing_desc: "Sebagai bagian dari program Ratu, 'vernieuwing' atau 'pembaruan' akan menghapuskan konsep partai politik yang cacat. Ketidaksukaan Ratu terhadap politisi sudah diketahui umum, dan jika dia yakin kita akan lebih baik tanpa mereka, mungkin memang demikian. Hal ini tentu akan mempermudah pengambilan keputusan."
 HOL_depillarization: "Depillarisasi"
 HOL_depillarization_desc: "Masyarakat Belanda terbagi dalam berbagai strata yang disebut 'zuilen' atau 'pilar'. Sebagai bagian dari mandat baru Ratu, dia bertujuan untuk menghilangkan 'pilarisasi' yang telah melanda negara kita selama bertahun-tahun. Mereka yang menganut satu agama, ideologi, atau status sosial kini dapat berinteraksi secara bebas dengan penganut agama, ideologi, atau status sosial lain, sehingga meningkatkan stabilitas."
 HOL_a_new_dutch_unity: "Persatuan Belanda Baru"
 HOL_a_new_dutch_unity_desc: "Dengan berjalannya mandat Ratu dengan baik, kita dapat menumbuhkan rasa baru kebanggaan nasional dan persatuan di antara masyarakat. Hanya bersama-sama kita bisa menjadi kuat, dan kita tidak perlu menundukkan kepala di antara negara-negara besar di dunia karena negara kita yang kecil. Sebagai sebuah bangsa, kita melakukan tindakan yang jauh lebih keras daripada yang ditunjukkan oleh ukuran kita yang kecil."
 HOL_revive_the_buffer_state_proposal: "Menghidupkan Kembali Proposal Negara Penyangga"
 HOL_revive_the_buffer_state_proposal_desc: "Karena Jerman dan Prancis tampaknya tidak dapat menahan diri untuk saling menyerang berulang kali, mungkin inilah saatnya untuk sekali lagi memperdebatkan kasus negara penyangga Negara Rendah yang kuat. Jika Belgia dan Luksemburg tidak menginginkan hal ini, mungkin mereka seharusnya berbuat lebih banyak untuk berkontribusi dalam upaya perang, seperti yang kita lakukan?"
 HOL_revive_the_buffer_state_proposal_tt1: "§Y[HOL.GetName]§!: Memiliki £legitimacy §YLegitimasi§! lebih tinggi dibandingkan §Y[BEL.GetName]§!"
 HOL_revive_the_buffer_state_proposal_tt2: "§Y[HOL.GetName]§!: Memiliki £legitimacy §YLegitimasi§! lebih tinggi dibandingkan §Y[LUX.GetName]§!"
 HOL_royal_arms_purchases: "Pembelian Senjata Kerajaan"
 HOL_royal_arms_purchases_desc: "Karena kepentingannya sekarang semakin terikat dengan kepentingan negara secara keseluruhan, Ratu telah mengusulkan untuk menggunakan kekayaan pribadinya yang besar untuk membiayai pembelian peralatan baru dari luar negeri."
 HOL_develop_the_south: "Kembangkan Selatan"
 HOL_develop_the_south_desc: "Setelah memperoleh sisa dari wilayah Belanda Bersatu, kita sekarang harus berupaya memastikan lahan-lahan tersebut menerima investasi yang sama untuk pembangunan industri seperti yang diterima oleh wilayah Belanda, agar tidak tertinggal dibandingkan wilayah lain di negara ini."
 HOL_wilhelminism: "Wilhelminisme"
 HOL_wilhelminism_desc: "[Root.GetWilhelminismDesc]"
 HOL_WILHELMINISM_FASCISM: "Ikatan dinasti antara keluarga kerajaan kita dan Kaiser Jerman, yang tinggal di Huis Doorn sejak akhir Perang Besar, masih kuat. Mungkin kita bisa menggunakan popularitas yang masih dia nikmati di militer Jerman untuk keuntungan kita sendiri, dan, dengan melakukan hal itu, menciptakan negara kuat yang punya alasan untuk berterima kasih kepada kita ketika perang berakhir."
 HOL_WILHELMINISM_NEUTRALITY: "Ikatan dinasti antara keluarga kerajaan kita dan Kaiser Jerman, yang hingga saat ini tinggal di pengasingan di Huis Doorn di Belanda, masih kuat. Kami yang sekeluarga harus berdiri bersama, dan pihak Jerman tentunya punya alasan untuk berterima kasih kepada kami yang telah menjadi tuan rumah bagi Kaiser mereka selama ini."
 HOL_wilhelminism_tt: "Mendapatkan Semangat Nasional §YPembelot Jerman§!, yang secara berkala akan menghasilkan unit dengan §Y7 Infanteri§! dan §Y2 Artileri§! batalyon dan §YInsinyur§!, §YRecon§!, dan §YArtileri§! Dukungan."
 HOL_unity_through_democracy: "\"Persatuan Melalui Demokrasi\""
 HOL_unity_through_democracy_desc: "'Gerakan Belanda untuk Persatuan melalui Demokrasi' ('Eenheid door Democratie') dibentuk pada tahun 1935, dan sejak itu menjadi suara ekstra-parlementer yang menentang demagog dari semua ideologi lain. Mendukung gerakan ini pada gilirannya dapat memberikan manfaat dengan mempertahankan demokrasi dan memperkuat pemerintahan kita."
 HOL_go_with_britain: "Pergilah bersama Inggris"
 HOL_go_with_britain_desc: "Inggris telah membela cita-cita demokrasi dalam krisis yang terjadi saat ini, dan mereka juga mempunyai kepentingan yang sama dengan kita terhadap integritas kerajaan kolonial kita. Wajar jika kita ikut serta dalam perjuangan mereka."
 HOL_de_vaarplicht: "De Vaarplicht"
 HOL_de_vaarplicht_desc: "Setelah 150 tahun bersikap netral, dan berpuluh-puluh tahun meningkatnya sikap pasifisme, kita harus membuktikan kepada sekutu baru kita tekad kita untuk berperang. Daripada mengandalkan angkatan laut pedagang yang berbasis sukarelawan seperti negara-negara lain, kami akan menandatangani undang-undang Vaarplicht, atau 'Kewajiban Berlayar'. Semua warga negara Belanda yang belum wajib militer selanjutnya wajib melakukan dinas untuk, atau untuk kepentingan, angkatan laut pedagang."
 HOL_request_allied_favors: "Minta Bantuan Sekutu"
 HOL_request_allied_favors_desc: "Kami mungkin kekuatan kecil, tapi kami telah menunjukkan dedikasi kami untuk memenangkan perang ini. Namun, untuk melakukan hal tersebut, kami memerlukan bantuan, dan diharapkan kami dapat memperoleh sedikit bantuan melalui kontribusi kami..."
 HOL_request_allied_favors_tt: "Ini memungkinkan untuk memperoleh §YOffmap Industry§!, §YManpower§!, §YEquipment§!, dan lainnya dari sekutu Anda."
 HOL_the_singapore_conferences: "Konferensi Singapura"
 HOL_the_singapore_conferences_desc: "Inggris telah mengundang kami, bersama dengan Amerika dan Australia, ke serangkaian konferensi yang membahas peningkatan agresi Jepang dalam beberapa tahun terakhir, yang mengancam seluruh kepentingan kami di Asia Tenggara. Bersama-sama, kita akan mengembangkan rencana pertahanan yang, meskipun tidak mengikat, akan memberi kita wawasan berharga mengenai dukungan yang mungkin kita harapkan dari rencana tersebut jika terjadi serangan Jepang."
 HOL_ship_a_day_sinking_quotas: "Kuota Tenggelam Kapal Sehari"
 HOL_ship_a_day_sinking_quotas_desc: "Sekalipun kita tidak bisa langsung mempertahankan Hindia Timur dari serangan yang gigih, kita tidak boleh membuatnya mudah. Pasukan kapal selam kita harus terus-menerus menyerang jalur suplai musuh, dan mereka harus diperlengkapi untuk melakukan hal tersebut, serta dipimpin oleh komandan yang agresif dan cakap."
 HOL_allied_technological_developments: "Perkembangan Teknologi Sekutu"
 HOL_allied_technological_developments_desc: "Kemenangan terletak pada keunggulan teknologi. Kita harus memberikan bagian kita pada sumber daya besar yang disalurkan ke dalam program penelitian dan pengembangan Sekutu, sehingga kita juga dapat mengambil keuntungan dari sumber daya tersebut."
 HOL_american_west_indies_protectorate: "Protektorat Hindia Barat Amerika"
 HOL_american_west_indies_protectorate_desc: "Kita harus meminta perlindungan Amerika terhadap wilayah-wilayah barat kita yang terpencil. Mereka tentu tidak ingin melihat ada kekuatan lain yang ikut campur dalam Doktrin Monroe."
 HOL_american_west_indies_protectorate_tt: "§R[USA.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 HOL_combined_chiefs_of_staff_representation: "Perwakilan Kepala Staf Gabungan"
 HOL_combined_chiefs_of_staff_representation_desc: "Kontribusi kami telah diperhatikan, dan dengan tekanan politik tertentu, dimungkinkan untuk mendapatkan perwakilan, atau bahkan partisipasi, dalam kelompok perencana strategis Anglo-Amerika yang eksklusif, yaitu Kepala Staf Gabungan."
 HOL_the_fourth_ally: "Sekutu Keempat"
 HOL_the_fourth_ally_desc: "Meskipun permulaan kami sederhana, kontribusi kami tidak dapat disangkal. Sudah saatnya kita mengambil posisi sebagai sekutu keempat dalam perang melawan fasis – bersama Inggris, Amerika Serikat, dan Uni Soviet."
 HOL_zandery_military_airport: "Bandara Militer Zandery"
 HOL_zandery_military_airport_desc: "Karena pentingnya bauksit Suriname dan minyak Curaçao bagi upaya perang Sekutu, Amerika telah mengusulkan untuk membantu pertahanan mereka dengan mendirikan pos radar di Curaçao, dan membangun bandara dan infrastruktur di Zandery di Suriname. Setelah selesai, bandara ini akan menjadi bandara militer terbesar di Amerika Selatan."
 HOL_lead_the_minor_democracies: "Pimpin Negara Demokrasi Kecil"
 HOL_lead_the_minor_democracies_desc: "Ketika negara-negara besar di masa kini nampaknya sangat ingin kembali berperang, maka negara-negara demokrasi kecil di Eropalah yang harus menjaga agar dunia tidak terbakar, seperti kerumunan orang yang menjauhkan dua pejuang dari satu sama lain. Kami akan memimpin negara-negara lain dalam membentuk blok netralitas melawan para penghasut perang."
 HOL_form_the_benelux: "Bentuk Benelux"
 HOL_form_the_benelux_desc: "Kami, negara-negara kecil di Eropa Barat, yang terhimpit selama berabad-abad oleh kekuatan-kekuatan seperti Inggris, Perancis, dan sekarang Jerman, sudah muak dengan konflik yang menghancurkan benua kami. Amerika Serikat di Eropa suatu hari nanti mungkin bisa mencegah terjadinya bencana seperti Perang Besar, namun dengan membentuk kesatuan yang longgar dengan negara-negara tetangga di wilayah selatan, kita sudah bisa menjadi inti dari organisasi tersebut saat ini."
 HOL_form_the_benelux_bel_tt: "Mendapat acara '§YBelanda mengundang [BEL.GetName] ke Benelux§!'."
 HOL_form_the_benelux_lux_tt: "Mendapat acara '§YBelanda mengundang [LUX.GetName] ke Benelux§!'."
 HOL_responsibility_for_our_own_defense: "Tanggung Jawab Untuk Pertahanan Kita Sendiri"
 HOL_responsibility_for_our_own_defense_desc: "Tanpa negara-negara besar yang bisa diandalkan, kita tidak punya pilihan selain menjaga pertahanan kita sendiri, dan mengambil tanggung jawab penuh untuk memastikan bahwa pertahanan mereka mampu menghadapi tantangan apa pun yang mungkin menghadang mereka."
 HOL_lessons_from_the_low_countries: "Pelajaran dari Negara-negara Rendah"
 HOL_lessons_from_the_low_countries_desc: "Sebagai wilayah netral antara dua negara besar, Negara-Negara Rendah telah mengalami peperangan yang sama. Kita harus mengambil pelajaran dari hal ini, dan bersiap menghadapi invasi yang lebih besar lagi, karena salah satu negara tetangga berupaya untuk meratakan kita sekali lagi agar bisa menjangkau negara lain."
 HOL_foundations_for_a_european_union: "Yayasan untuk Uni Eropa"
 HOL_foundations_for_a_european_union_desc: "Dari awal yang sederhana di Benelux, kita harus membentuk Persatuan Bangsa-Bangsa di seluruh benua, berdiri bahu-membahu dalam menghadapi gencarnya penghasutan perang dari negara-negara besar. Uni Eropa akan menjamin perdamaian dan kesejahteraan bagi semua."
 HOL_the_continents_best_and_brightest: "Benua Terbaik dan Tercerah"
 HOL_the_continents_best_and_brightest_desc: "Meskipun masing-masing dari kita hanya mempunyai sumber daya yang kecil, jika kita menggabungkannya, kita dapat mencapai apa pun yang mampu dicapai oleh jurusan-jurusan tersebut."
 HOL_the_best_defense: "Pertahanan Terbaik"
 HOL_the_best_defense_desc: "Kita tidak boleh lengah seperti yang terjadi pada perang-perang sebelumnya. Jika tetangga kita tidak mau mendengarkan alasan dan menerima perdamaian, maka kita harus mewujudkannya."
 ENG_fortify_the_empire: "Perkuat Kekaisaran"
 mtg_usa_civil_war_warning_tt: "§RIni akan membuat Anda semakin dekat dengan Perang Saudara!§!"
 fascists_uprising_tt: "Elemen-elemen fasis dalam masyarakat akan memulai persiapan untuk pemberontakan."
 USA_intervention_mandate_tt: "§YMandat Intervensi§! memungkinkan kami meminta Kongres untuk mengizinkan tindakan militer terhadap negara lain."
 USA_honor_the_confederacy_tt: "Keputusan-keputusan ini memungkinkan kita membangun kembali kepercayaan masyarakat terhadap pemerintah jika terjadi perang saudara dengan menghubungkan kembali masa lalu."
 USA_foreign_support_tt: "Keputusan-keputusan ini memungkinkan kita untuk mendekati negara-negara besar untuk melobi untuk mendapatkan dukungan material."
