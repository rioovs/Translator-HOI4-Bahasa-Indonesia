 state_serves_the_military_spirit_desc: "Tujuan negara adalah berperang melawan negara lain. Apa pun yang lain adalah untuk mendukung hal itu atau gangguan yang tidak berguna.\n\n§GSemangat ini ada karena ideologi kita.§!"
 mobile_warfare_army_spirit: "Penggerak Motorisasi"
