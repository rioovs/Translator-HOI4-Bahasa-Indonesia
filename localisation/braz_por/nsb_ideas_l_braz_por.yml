 grand_battleplan_army_spirit: "Ujung Tombak"
 grand_battleplan_army_spirit_desc: "Belati di malam hari seringkali lebih efektif dibandingkan pedang panjang di siang hari."
 mass_assault_army_spirit: "Kekuatan Bayonet"
 mass_assault_army_spirit_desc: "Ketika semua sudah dikatakan dan dilakukan, sebuah tank atau pesawat tidak dapat bertahan sebidang tanah pun."
 political_connections_spirit: "Koneksi Politik"
 political_connections_spirit_desc: "Baiklah, kita lihat saja apa kata menteri mengenai hal itu!"
 entrenched_old_guard_spirit: "Penjaga Lama yang Berakar"
