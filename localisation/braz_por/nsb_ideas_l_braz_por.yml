 signals_training_spirit: "Pelatihan Sinyal"
 signals_training_spirit_desc: "Agar setiap orang dapat melaksanakan tugasnya, ia harus mengetahui apa tugasnya."
 signals_training_spirit_tt: "Laksamana: §G50% peluang§! untuk mendapatkan §Y+1 Manuver dan Koordinasi§! saat naik level."
 fleet_in_being_academy_spirit: "Armada Besar"
