 brave_commanders_spirit: "Komandan Pemberani"
 brave_commanders_spirit_desc: "Sialan torpedonya, maju dengan kecepatan penuh!"
 brown_water_spirit: "Pertarungan Pesisir"
 brown_water_spirit_desc: "Bernavigasi dan berperang di nusantara memerlukan keahlian khusus."
 green_water_spirit: "Air Hijau"
