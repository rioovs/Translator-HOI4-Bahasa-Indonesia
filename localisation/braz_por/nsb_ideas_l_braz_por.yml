 SOV_factionalism_modifier: "Faksionalisme"
 SOV_factionalism_modifier_tt: "§LFaksionalisme dalam partai selalu menjadi masalah, dan dengan semakin vokalnya oposisi, perbedaan pendapat membuat partai menjadi kurang efisien. Namun jika dikelola dengan baik, perbedaan pendapat dalam jangka panjang dapat menjadi kekuatan dan bukan kelemahan.§!"
 SOV_opposition_popular_support: "Dukungan Rakyat untuk Oposisi"
 SOV_opposition_popular_support_tt: "§LDengan sebagian besar anggota partai, dan opini publik, mendukung oposisi, mempertahankan kekalahan perang jauh lebih sulit.§!"
 SOV_workers_government_idea: "Pemerintahan Buruh"
 SOV_workers_government_idea_desc: "Hidup pemerintahan buruh. Elit Penguasa telah digulingkan dari kekuasaan. Kaum buruh sekali lagi menguasai negara."
 SOV_revolutionary_spirit_idea: "Semangat Revolusioner"
 SOV_revolutionary_spirit_idea_desc: "Semangat revolusioner telah dihidupkan kembali dengan kemenangan atas Stalin. Inilah saatnya untuk membawa api revolusioner kepada kaum buruh di seluruh dunia."
 SOV_trotskyist_revolutionary_agitation: "Agitasi Revolusioner Trotskis"
 SOV_trotskyist_revolutionary_agitation_desc: "Simpatisan Trotskis dan elemen komunis lainnya yang bersekutu dengan Partai Bolshevik [SOV.GetAdjective] menghasut massa [ROOT.GetAdjective], mempromosikan ideologi Marxis di kalangan kelas pekerja dan menyerukan perjuangan bersenjata melawan pemerintah kita."
 SOV_trotskyist_revolutionary_agitation_tt: "Mengaktifkan keputusan §Y$ban_communist_party$§! akan mengurangi dampak semangat kebangsaan tersebut."
 SOV_politicized_military: "Militer yang Dipolitisasi"
 SOV_politicized_military_desc: "Para komisaris militer sering kali menyampaikan pidato-pidato ideologis dan diskusi politik yang berapi-api di antara jajarannya, namun dalam banyak kasus mereka juga terlibat dalam administrasi yang berlebihan, pengawasan yang berlebihan terhadap para perwira militer, dan bahkan menghalangi perintah para komandan satuan."
 SOV_politicized_military_swap: "Penasihat Politik Militer"
 SOV_politicized_military_swap_desc: "Meskipun kita tidak boleh membiarkan pertimbangan politik mendikte keputusan militer, kita tetap harus memastikan bahwa pertimbangan politik tersebut diperhitungkan ketika keputusan diambil."
 SOV_politicized_military_battle_priests: "Pertempuran Priest di Angkatan Darat"
 SOV_politicized_military_battle_priests_desc: "Dengan mengambil peran sebagai Battle Priest dalam unit militer kita, para pendeta kini bertugas menjaga moral tetap tinggi di antara para prajurit, dan memastikan bahwa pasukan mengetahui bahwa Gereja, dan Tuhan, ada di pihak kita."
 SOV_for_the_common_good_allies: "Demi Kebaikan Bersama"
 SOV_for_the_common_good_allies_desc: "Setiap keputusan yang diambil oleh kita atau sekutu kita harus ditujukan untuk mengambil langkah maju menuju kebaikan bersama."
 SOV_for_the_common_good_subjects: "$SOV_for_the_common_good_allies$"
 SOV_for_the_common_good_subjects_desc: "Setiap keputusan yang diambil oleh sekutu kita bertujuan untuk mengambil langkah maju menuju kebaikan bersama. Oleh karena itu, kita harus mendukung keputusan-keputusan ini dan memastikan untuk mengikuti pedoman yang diberikan kepada kita, bahkan jika pengorbanan kita tidak membuahkan perbaikan dalam waktu dekat."
