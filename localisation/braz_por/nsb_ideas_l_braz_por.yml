 veteran_air_instructors_spirit: "Instruktur Udara Veteran"
 veteran_air_instructors_spirit_desc: "Membiarkan yang terbaik melatih sisanya."
 steel_wings_steel_hearts_spirit: "Sayap Baja, Hati Baja"
 steel_wings_steel_hearts_spirit_desc: "Dibutuhkan keberanian tertentu untuk berperang di ketinggian 10.000 kaki.\n\n§GSemangat ini ada karena ideologi kita.§!"
 home_defence_spirit: "Pahlawan Lintas Udara"
 home_defence_spirit_desc: "Hamparan langit yang luas menyimpan janji yang tak terhitung bagi mereka yang mencari warisan."
 centralized_control_spirit: "Kontrol Terpusat"
 centralized_control_spirit_desc: "Pengelolaan sumber daya yang efektif memastikan pesawat mencapai lokasi yang paling membutuhkannya."
 air_power_projection_spirit: "Proyeksi Kekuatan Udara"
 air_power_projection_spirit_desc: "Keberanian khusus diperlukan saat bertarung jauh dari rumah."
 massed_strike_spirit: "Serangan Massal"
 massed_strike_spirit_desc: "Mengganggu pasukan darat musuh adalah cara terbaik untuk mengalahkan mereka."
 continuous_strike_spirit: "Serangan Berkelanjutan"
 continuous_strike_spirit_desc: "Penghancuran perlengkapan utama musuh sangatlah penting."
 strategic_strike_spirit: "Kehancuran Total"
