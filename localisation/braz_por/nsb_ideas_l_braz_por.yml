 efficient_communications_spirit: "Komunikasi yang Efisien"
 efficient_communications_spirit_desc: "Komunikasi, komunikasi, dan komunikasi."
 discrete_valor_spirit: "Keberanian Terpisah"
 discrete_valor_spirit_desc: "Bertahan untuk bertarung di hari lain."
 surface_raiders_spirit: "Perampok Permukaan"
