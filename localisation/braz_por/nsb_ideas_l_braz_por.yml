 doctrinal_orthodoxy_spirit: "Ortodoksi Doktrinal"
 doctrinal_orthodoxy_spirit_desc: "Itu bukanlah cara yang biasa kami lakukan pada zaman saya."
 excessive_parade_drill_spirit: "Latihan Parade yang Berlebihan"
 excessive_parade_drill_spirit_desc: "Tujuan utama seorang prajurit adalah tampil bagus dalam parade."
 static_warfare_spirit: "Perang Statis"
 static_warfare_spirit_desc: "Tidak ada pekerjaan parit yang terlalu banyak. Yang ada hanya ‘tidak cukup’ dan ‘hampir tidak cukup’."
 flexible_organization_spirit: "Organisasi yang Fleksibel"
