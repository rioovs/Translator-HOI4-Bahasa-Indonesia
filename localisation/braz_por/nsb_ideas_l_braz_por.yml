 SOV_grigory_semyonov_man_tt: "§Y[SOV.GetName]§! belum menyelesaikan fokus §Y$SOV_approach_semyonov$§!\n§Y[GetSovietCivilWarName]§! belum dimulai.\n§Y$SOV_grigory_semyonov$§! juga tersedia sebagai §YUmum§! ketika diangkat sebagai Penasihat."
