 SOV_anti_soviet_military_thinking_banned_army: "Pemikiran Militer Anti-Soviet Dilarang"
 SOV_anti_soviet_military_thinking_banned_army_desc: "Studi dan diskusi dokumen-dokumen dan ide-ide dari para ahli teori yang dipermalukan dan reaksioner sekarang dilarang bagi para perwira Angkatan Darat kita di Akademi, dan lulusan baru diperiksa dengan cermat untuk memastikan bahwa tidak ada musuh rakyat yang mengakses jajaran Tentara Merah."
 SOV_training_activities_curtailed: "Kegiatan Pelatihan Dibatasi"
 SOV_training_activities_curtailed_desc: "Sebagian besar kendaraan mengalami kerusakan mekanis dan beberapa anggota terluka dalam latihan militer baru-baru ini. Sampai kami menemukan alasan sebenarnya dari kerusakan mekanis ini, kami telah membatasi latihan besar-besaran untuk menghindari kerusakan lebih lanjut baik pada rekrutan maupun aset militer kami."
 SOV_purged_junior_army_officers_1: "Perwira Muda Angkatan Darat Dibersihkan"
 SOV_purged_junior_army_officers_1_desc: "Sejumlah besar perwira junior Angkatan Darat telah ditangkap oleh NKVD atas tuduhan penghasutan, sabotase, dan pemikiran anti-Soviet. Hilangnya begitu banyak perwira dan veteran berpengalaman dari perang masa lalu telah membuat Tentara Merah berada dalam kekacauan yang berbahaya."
 SOV_anti_soviet_military_thinking_banned_navy: "Pemikiran Militer Anti-Soviet Dilarang"
 SOV_anti_soviet_military_thinking_banned_navy_desc: "Studi dan diskusi dokumen dan ide-ide dari para ahli teori yang dipermalukan dan reaksioner sekarang dilarang bagi perwira Angkatan Laut kita di Akademi, dan lulusan baru diperiksa dengan cermat untuk memastikan bahwa tidak ada musuh rakyat yang mengakses jajaran Armada Merah."
 SOV_shipyard_staff_purged: "Staf Galangan Kapal Dibersihkan"
 SOV_shipyard_staff_purged_desc: "Setelah penyelidikan besar-besaran terhadap berbagai tuduhan sabotase dan aktivitas mencurigakan lainnya di Angkatan Laut, NKVD telah melakukan banyak penangkapan, menyebabkan beberapa galangan kapal dan pangkalan angkatan laut kami kekurangan staf."
 SOV_purged_junior_navy_officers_1: "Perwira Muda Angkatan Laut Dibersihkan"
 SOV_purged_junior_navy_officers_1_desc: "Sejumlah besar perwira junior Angkatan Laut telah ditangkap oleh NKVD atas tuduhan penghasutan, sabotase, dan pemikiran anti-Soviet. Hilangnya begitu banyak perwira dan veteran berpengalaman dari perang masa lalu telah menyebabkan Armada Merah berada dalam kekacauan yang berbahaya."
 SOV_anti_soviet_military_thinking_banned_airforce: "Pemikiran Militer Anti-Soviet Dilarang"
 SOV_anti_soviet_military_thinking_banned_airforce_desc: "Studi dan diskusi dokumen dan ide-ide dari para ahli teori yang dipermalukan dan reaksioner sekarang dilarang bagi para perwira Angkatan Udara kita di Akademi, dan lulusan baru diperiksa dengan cermat untuk memastikan bahwa tidak ada musuh rakyat yang mengakses jajaran Angkatan Udara Soviet."
 SOV_ground_based_training: "Pelatihan Berbasis Darat"
 SOV_ground_based_training_desc: "Setelah serangkaian kecelakaan udara dan kecelakaan dilaporkan selama latihan, NKVD telah memulai inspeksi di Angkatan Udara dan, mengikuti instruksi dari agen yang ditugaskan untuk menangani kasus tersebut, tidak ada lagi latihan penerbangan yang akan dilakukan selama penyelidikan sedang berlangsung."
 SOV_purged_junior_army_officers_1_tt: "§YSemua kendaraan darat§!: Bonus keandalan: §R-10%§!"
 SOV_purged_junior_army_officers_2_tt: "§YSemua kendaraan darat§!: Bonus keandalan: §R-20%§!"
 SOV_purged_junior_army_officers_3_tt: "§YSemua kendaraan darat§!: Bonus keandalan: §R-30%§!\n§Y$politically_connected$§! akan menjadi satu-satunya sifat yang tersedia untuk Jenderal baru."
 SOV_purged_junior_navy_officers_3_tt: "§Y$politically_connected$§! akan menjadi satu-satunya sifat yang tersedia untuk Laksamana baru."
 SOV_mig_design_bureau_dissolved_flag: "Biro Desain telah dibubarkan"
 SOV_ilyushin_design_bureau_dissolved_flag: "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_tupolev_design_bureau_dissolved_flag: "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_yakovlev_design_bureau_dissolved_flag: "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_anti_capitalist_campaign_generic: "Kampanye Anti-Kapitalis"
 SOV_anti_capitalist_campaign_generic_desc: "Kaum kapitalis tidak bisa dipercaya. Ketika diberi pilihan, kaum borjuis akan selalu memilih untuk menindas kaum proletar. Kita harus bersiap untuk melakukan perlawanan terhadap mereka."
 SOV_anti_fascist_campaign_generic: "Kampanye Anti-Fasis"
 SOV_anti_fascist_campaign_generic_desc: "Tidak mungkin ada hidup berdampingan secara damai dengan kaum fasis. Kita harus bersiap menghadapi konfrontasi yang tak terhindarkan."
 SOV_young_builders_of_communism: "Pembangun Muda Komunisme"
 SOV_young_builders_of_communism_desc: "Kami tidak membangun Sosialisme untuk orang-orang dewasa saat ini, kami membangunnya untuk anak-anak dan generasi yang belum lahir. Mereka harus diajari bagaimana meningkatkan dan mengembangkan prestasi yang telah kita capai, sehingga mereka dapat menyelesaikan pekerjaan yang telah kita mulai."
 SOV_broken_peace_dreams_attacker: "Mimpi Kedamaian yang Rusak"
 SOV_broken_peace_dreams_attacker_desc: "Perang baru yang kita alami ini, tidak lama setelah kita secara terbuka berjanji untuk menerapkan kebijakan perdamaian, menyebabkan ketidakstabilan dan ketidakpercayaan di antara masyarakat."
 SOV_broken_peace_dreams_defender: "$SOV_broken_peace_dreams_attacker$"
 SOV_broken_peace_dreams_defender_desc: "$SOV_broken_peace_dreams_attacker_desc$"
 SOV_restoration_and_development_idea: "Restorasi dan Pembangunan"
 SOV_restoration_and_development_idea_desc: "$SOV_restoration_and_development_desc$"
 SOV_no_time_for_peace_idea: "Tidak Ada Waktu untuk Damai"
 SOV_no_time_for_peace_idea_desc: "$SOV_no_time_for_peace_desc$"
 SOV_support_in_china_generic: "[SOU.GetAdjective] Dukungan di Tiongkok"
 SOV_support_in_china_generic_desc: "Pemerintah [SOU.GetAdjective] mendukung [ROOT.GetNameDef] dalam perang kita melawan [JAP.GetAdjective], dengan harapan dapat mengembangkan hubungan yang lebih dekat dengan kita dan juga mempengaruhi politik kita."
 SOV_preparations_for_soviet_japanese_war: "Persiapan Perang Soviet-Jepang"
 SOV_preparations_for_soviet_japanese_war_desc: "$SOV_prepare_a_war_with_japan_desc$"
 SOV_soviet_japanese_reckoning: "Perhitungan Soviet-Jepang"
 SOV_soviet_japanese_reckoning_desc: "Ini adalah waktunya untuk membawa perang ke [JAP.GetAdjective] dan membalas banyak kesalahan yang mereka sebabkan kepada kita."
 SOV_soviet_japanese_anti_usa_pact: "Pakta Anti-AS Soviet-Jepang"
 SOV_soviet_japanese_anti_usa_pact_desc: "Bersama-sama, kita akan menghapus [USA.GetNameDef] dari panggung dunia!"
 SOV_stakhanovite_movement: "Gerakan Stakhanovite"
 SOV_stakhanovite_movement_desc: "$SOV_revive_the_stakhanovite_movement_desc$"
 SOV_military_advisors_in_spain: "Penasihat Militer di Spanyol"
 SOV_military_advisors_in_spain_desc: "$SOV_send_military_advisors_to_spain_desc$"
 SOV_soviet_advisors_spr: "Penasihat Militer Soviet"
 SOV_soviet_advisors_spr_desc: "Penasihat militer dan personel militer terampil lainnya telah tiba dari [SOV.GetNameDef] untuk mendukung perjuangan kami melawan fasisme dan kontra-revolusi reaksioner."
 SOV_face_western_fascism_ns: "Hadapi Fasisme Barat"
 SOV_face_western_fascism_ns_desc: "$SOV_eradicate_western_fascism_desc$"
 SOV_liberation_of_the_european_proletariat_ns: "Pembebasan Proletariat Eropa"
 SOV_liberation_of_the_european_proletariat_ns_desc: "$SOV_liberation_of_the_european_proletariat$"
 SOV_soviet_atomic_bomb_project_ns: "Proyek Bom Atom Soviet"
 SOV_soviet_atomic_bomb_project_ns_desc: "$SOV_soviet_atomic_bomb_project_desc$"
 SOV_stolen_vital_nuclear_information: "Informasi Nuklir Penting yang Dicuri"
 SOV_stolen_vital_nuclear_information_desc: "$NSB_soviet_atomic_bomb_project.1.desc$"
 SOV_central_headquarters_of_the_partisan_movement: "Markas Pusat Gerakan Partisan"
 SOV_central_headquarters_of_the_partisan_movement_desc: "$SOV_organization_of_the_partisans_desc$"
 SOV_national_academy_of_sciences_puppet: "Akademi Ilmu Pengetahuan Nasional"
 SOV_national_academy_of_sciences_puppet_desc: "Mencontoh [GetTheUssrAcademyOfSciencesName], [SOV.GetNameDef] telah mendirikan lembaga penelitian baru di negara kita untuk meningkatkan perkembangan ilmu pengetahuan kita dan mereka."
 SOV_rehabilitated_military_ns: "$SOV_rehabilitated_military$"
 SOV_rehabilitated_military_ns_desc: "Sudah waktunya untuk sedikit mengekang para pejabat politik dan memberi para komandan lebih banyak keleluasaan dalam menjalankan segala sesuatunya."
 SOV_military_reorganization_ns: "Reorganisasi Militer"
 SOV_military_reorganization_ns_desc: "Tentara [GetSovietArmyAdjectiveBasedOnIdeology] sedang menjalani reorganisasi besar-besaran, yang memerlukan gangguan terhadap formasi yang ada sampai batas tertentu dalam jangka waktu yang diharapkan singkat."
 SOV_expanded_exploitation_of_gold_mines: "Eksploitasi Tambang Emas yang Diperluas"
 SOV_expanded_exploitation_of_gold_mines_desc: "Investasi [SOV.GetAdjective] dalam infrastruktur dan bantuan industri di wilayah utara [ROOT.GetNameDef] telah memungkinkan kami meningkatkan efisiensi dalam eksploitasi tambang emas kami di wilayah tersebut."
 SOV_ambassador_karim_khakimov: "Duta Besar Soviet Karim Khakimov"
 SOV_ambassador_karim_khakimov_desc: "$NSB_soviet_foreign_politics_events.211.desc$"
 SOV_shocked_by_surprise_attack: "Terkejut dengan Serangan Kejutan"
 SOV_shocked_by_surprise_attack_desc: "Operasi militer musuh terhadap negara kita, dengan nama sandi Operasi Countenance, telah mengejutkan pemerintah dan militer kita. Pasukan kita kewalahan, komunikasi kita terputus, dan memanggil diplomat musuh untuk meminta penjelasan ternyata sia-sia. Ketika kami mencoba mengatasi kekacauan ini, hubungan luar negeri kami secara efektif dinetralkan."
 SOV_shocked_by_surprise_attack_cant_join_factions_tt: "Tetapkan aturan: £trigger_no Dapat bergabung dengan faksi."
 SOV_soviet_commandos_poum: "Komando Soviet"
 SOV_soviet_commandos_poum_desc: "Oposisi Kanan terhadap Stalinisme di [SOV.GetNameDef] telah mengirimkan agen-agen terlatih ke negara kami untuk melakukan operasi khusus dan mengajari rakyat kami cara berperang."
 SOV_popular_speeches_poum: "Pidato Populer"
 SOV_popular_speeches_poum_desc: "Dengan bantuan organisasi lokal dan anggota oposisi anti-Stalinis yang berpengaruh di luar negeri, kami melakukan kampanye informasi dan agitasi besar-besaran di wilayah yang kami kuasai untuk menyalakan kembali api revolusi di kalangan massa."
 SOV_agents_in_the_stalinist_command_poum: "Agen di Komando Stalinis"
 SOV_agents_in_the_stalinist_command_poum_desc: "Oposisi Kanan Soviet berhasil menyusup ke beberapa agen di antara kelompok penasihat militer terbaru yang dikirim ke Republik Spanyol oleh [SOU.GetLeader]. Agen-agen ini telah menciptakan jaringan informan yang memungkinkan kita mengetahui rencana musuh sebelum rencana itu dilaksanakan."
 SOV_organized_wreckers_idea: "Penghancur"
 SOV_organized_wreckers_idea_desc: "Musuh-musuh negara telah merekrut para perusak di kalangan kelas pekerja, yang mengganggu industri penting dan mempersulit pencapaian kebutuhan produksi."
 SOV_organized_wreckers_idea_tt: "Musuh dapat menjalankan misi sabotase"
 SOV_arms_purchases_idea: "Pembelian Senjata"
 SOV_arms_purchases_idea_desc: "Mempersenjatai oposisi Soviet akan memakan biaya yang tidak sedikit, namun dalam jangka panjang, keuntungan yang diperoleh akan lebih dari sekedar menutupi biaya sementara."
 SOV_covert_military_buildup_idea: "Penumpukan Militer Terselubung"
 SOV_covert_military_buildup_idea_desc: "Saat ini kami diam-diam membantu Oposisi Soviet dengan membangun fasilitas produksi senjata dan amunisi rahasia."
 SOV_covert_ukrainian_military_buildup_idea: "Pelatihan Terselubung Milisi Ukraina"
 SOV_covert_ukrainian_military_buildup_idea_desc: "Dengan menggunakan kamp pelatihan rahasia, kami melatih milisi Ukraina untuk menciptakan pemberontakan melawan kaum Stalinis."
 SOV_the_fourth_international_idea: "Internasional Keempat"
 SOV_the_fourth_international_idea_desc: "Sebagai pemimpin Internasional yang sebenarnya, kita sekarang dapat memandu perjuangan komunis di dunia."
 SOV_foreign_funds_idea: "Pendanaan Asing"
 SOV_foreign_funds_idea_desc: "Sumbangan besar dari individu dan organisasi asing membantu mendanai revolusi kita."
 SOV_support_from_farmers: "Dukungan dari Petani Milik Sendiri"
 SOV_support_from_farmers_desc: "Dengan mendapatkan dukungan dari para petani, kita dapat mendukung tentara kita dengan lebih baik."
 SOV_system_decentralization_idea: "Desentralisasi Sistem"
 SOV_system_decentralization_idea_desc: "Kekuasaan telah berpindah dari Politbiro pada umumnya dan Sekretaris pada khususnya, dan kembali ke partai itu sendiri."
 SOV_the_local_soviets_idea: "Soviet Lokal"
 SOV_the_local_soviets_idea_desc: "Beberapa otoritas Soviet regional dan lokal telah dipulihkan. Ini berarti bahwa mereka dapat lebih mudah mengambil keputusan dalam hal-hal yang mendesak bagi mereka, dengan mengorbankan kendali politik oleh politbiro."
 SOV_strong_trade_unions_idea: "Serikat Pekerja yang Kuat"
 SOV_strong_trade_unions_idea_desc: "Serikat pekerja yang kuat berarti para pekerja dapat mempengaruhi produksi dengan lebih baik."
 SOV_the_peoples_revolution_idea: "Revolusi Rakyat"
 SOV_the_peoples_revolution_idea_desc: "Revolusi harus diusung oleh rakyat agar bisa benar-benar berhasil."
 SOV_puppet_international_of_soviet_republics_idea: "Republik Soviet Internasional"
 SOV_puppet_international_of_soviet_republics_idea_desc: "Menjadi bagian dari keseluruhan yang lebih besar memberikan manfaat besar bagi negara kita."
 SOV_support_of_the_peasants_idea: "Dukungan Kelas Petani"
 SOV_support_of_the_peasants_idea_desc: "Dukungan kuat dari para petani di seluruh negeri memungkinkan untuk merekrut dan mempertahankan pasukan yang lebih besar."
 SOV_curtailment_collective_farms_idea: "Pembatasan Pertanian Kolektif"
 SOV_curtailment_collective_farms_idea_desc: "Peternakan skala kecil dan menengah jauh lebih efisien dalam hal output dibandingkan peternakan besar."
 SOV_administrative_reforms_idea: "Reformasi Administrasi"
 SOV_administrative_reforms_idea_desc: "Pemerintahan Soviet yang lama terhambat oleh inefisiensi yang sebagian disebabkan oleh besarnya pemerintahan, namun terutama karena aparat kontrol yang terlalu ketat. Dengan menguranginya sedikit saja, banyak hal yang didapat."
 SOV_local_organizations_idea: "Organisasi Lokal"
 SOV_local_organizations_idea_desc: "Dengan menggabungkan lebih baik organisasi-organisasi lokal ke dalam pemerintahan suatu negara, kita mendapatkan akses ke semua talenta yang tersedia di negara ini."
 SOV_enemies_of_the_people_idea: "Musuh Rakyat"
 SOV_enemies_of_the_people_idea_desc: "Akan selalu ada pihak yang ingin menggulingkan pemerintahan rakyat. Kita harus tetap waspada terhadap ancaman, baik internal maupun eksternal."
 SOV_soviet_hegemony_idea: "Hegemoni Soviet"
 SOV_soviet_hegemony_idea_desc: "Sistem pemerintahan kita telah membuktikan dirinya lebih unggul dibandingkan sistem lainnya. Kita harus menggunakan kesempatan ini untuk menyebarkan ide-ide kita, memberikan pencerahan kepada mereka yang tertindas oleh sistem lain, serta mereka yang cukup beruntung untuk diikutsertakan dalam serikat pekerja."
 SOV_fascist_womens_movement_idea: "Gerakan Perempuan Fasis"
 SOV_fascist_womens_movement_idea_desc: "Inti dari gerakan nasionalis adalah perempuan [ROOT.GetAdjective]. Ibu, istri, dan putri prajurit pemberani kita, terorganisir dan siap mendukung perjuangan menuju kebesaran."
 SOV_the_true_tsars_idea: "Tsar Sejati"
 SOV_the_true_tsars_idea_desc: "Tsar adalah pemimpin sah [ROOT.GetNameDef]. Bersatu di belakang Tsar, dibandingkan individu atau ideologi lain, memungkinkan kita menarik lebih banyak pendukung untuk tujuan kita."
