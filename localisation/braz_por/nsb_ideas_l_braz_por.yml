 best_of_the_best_spirit_desc: "Hanya sedikit orang yang memiliki kemampuan untuk memimpin tentara ke medan perang. Masih sedikit orang yang memiliki apa yang diperlukan untuk memenangkan pertempuran itu."
 academy_scholarships_spirit: "Beasiswa Akademi"
