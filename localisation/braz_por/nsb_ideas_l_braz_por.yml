 trait_SOV_foreign_military_advisor_desc: "Waktu yang dihabiskan di luar negeri adalah kesempatan untuk mempelajari taktik yang suatu hari nanti mungkin akan kita hadapi."
 trait_SOV_monarchist_sympathizer_desc: "Simpati terhadap cara-cara lama bisa sangat mendalam. Seringkali bersamaan dengan kebencian."
 trait_SOV_determined_desc: "Kegigihan individu tertentu jauh melampaui apa yang dianggap masuk akal oleh orang lain."
 heritage_of_accomplishment: "Warisan yang Tercapai"
 heritage_of_accomplishment_desc: "Sejarah dan prestasi resimen kami merupakan bukti kepahlawanan prajurit kami. Dengan terbiasa mengakui perbuatan-perbuatan besar, setiap orang mungkin mendambakan kebesaran yang sama."
