 SOV_soviet_german_trade_agreement: "Perjanjian Perdagangan Soviet-Jerman"
 SOV_soviet_german_trade_agreement_desc: "Sebagaimana disepakati dalam perjanjian perdagangan kami dengan [SOU.GetNameDef], mereka mengirimi kami bahan mentah seperti biji-bijian, kapas, minyak, bijih logam, dan karet."
 SOV_soviet_imports: "Impor Soviet"
 SOV_development_of_eastern_allies_tt: "Semangat Nasional ini akan dihilangkan setelah selesainya fokus '§YBantuan Pembangunan untuk Sekutu Timur§!'"
 SOV_face_western_fascism_ns_tt: "Bonus serangan terhadap §Ynegara-negara fasis utama di Eropa§!: §G+10.0%§!, Bonus pertahanan terhadap §Ynegara-negara fasis besar di Eropa§!: §G10.0%§!."
