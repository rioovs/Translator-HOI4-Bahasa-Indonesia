l_braz_por:
 independent_air_force_spirit: "Angkatan Udara Independen"
 independent_air_force_spirit_desc: "Angkatan Udara adalah cabang independen, dan sama pentingnya dengan Angkatan Darat atau Angkatan Laut."
 industrial_destruction_spirit: "Kehancuran Industri"
 industrial_destruction_spirit_desc: "1000 pembom dapat mengubah jalannya perang dalam satu serangan."
 dive_bombing_spirit: "Bom Selam"
 dive_bombing_spirit_desc: "Gores satu bagian atas yang rata."
 material_destruction_spirit: "Penghancuran Materi"
 material_destruction_spirit_desc: "Penghancuran peralatan dan gangguan jalur komunikasi musuh akan memastikan kemenangan lebih cepat daripada jumlah korban jiwa yang ditimbulkan."
 air_modernizers_spirit: "Modernisasi Udara"
 air_modernizers_spirit_desc: "Belum lama ini Fokker E.III menjadi petarung terbaik di dunia. Segalanya berubah dengan cepat."
 industry_liasons_spirit: "Penghubung Industri"
 industry_liasons_spirit_desc: "Hanya kerja sama tanpa hambatan antara industri pesawat terbang, militer, dan pemerintah yang akan menjamin kualitas tertinggi."
 air_crew_surveys_spirit: "Survei Awak Udara"
 air_crew_surveys_spirit_desc: "Lagipula, merekalah yang menggunakan peralatan tersebut, jadi mengapa tidak bertanya kepada mereka?"
 maritime_patrol_spirit: "Patroli Maritim"
 maritime_patrol_spirit_desc: "Jika mengapung, kita bisa menemukannya."
 long_range_patrol_spirit: "Patroli Jarak Jauh"
 long_range_patrol_spirit_desc: "Mendominasi ruang udara jauh dari rumah."
 efficient_ground_crews_spirit: "Semangat Kru Darat yang Efisien"
 efficient_ground_crews_spirit_desc: "Pilot-pilot Ace semuanya baik-baik saja, tetapi yang paling penting adalah membuat pesawat mengudara secepat mungkin."
 effective_training_programs_spirit: "Program Pelatihan yang Efektif"
 effective_training_programs_spirit_desc: "Tidak ada yang mengalahkan pendidikan yang baik."
 branch_independence_spirit: "Semangat Kemandirian Cabang"
 branch_independence_spirit_desc: "Tidak ada tentara atau angkatan laut yang bisa memerintah kita. Kami melakukan segala sesuatunya dengan cara kami."
 air_theory_spirit: "Semangat Teori Udara"
 air_theory_spirit_desc: "Ada ilmu pengetahuan tentang pertempuran udara."
 subservience_to_army_spirit: "Ketaatan Kepada Tentara"
 subservience_to_army_spirit_desc: "Ini adalah deskripsi pekerjaan yang sederhana, bom di mana para Jenderal menyuruh Anda untuk mengebom."
 subservience_to_navy_spirit: "Ketaatan Kepada Angkatan Laut"
 subservience_to_navy_spirit_desc: "Pesawat terbang hanya benar-benar berguna sebagai senjata pendukung dan pengintaian angkatan laut."
 no_focus_on_training_spirit: "Tidak Fokus pada Pelatihan"
 no_focus_on_training_spirit_desc: "Latihan? Mengapa kita harus melakukan itu? Ini mudah! Juga; menghemat bahan bakar."
 disorganized_ground_crews_spirit: "Kru Darat yang Tidak Terorganisir"
 disorganized_ground_crews_spirit_desc: "Kru darat? Siapa mereka? Mengapa hal itu penting?"
 conflicting_branches_spirit: "Cabang yang Bertentangan"
 conflicting_branches_spirit_desc: "Tapi mereka bilang..."
 elite_fighter_pilots_spirit: "Pilot Pesawat Tempur Elit"
 elite_fighter_pilots_spirit_desc: "Ingat kawan, tidak ada poin untuk posisi kedua."
 long_range_navigation_spirit: "Navigasi Jarak Jauh"
 long_range_navigation_spirit_desc: "Mereka bisa lari, tapi tidak bisa bersembunyi."
 dogfighting_training_spirit: "Pelatihan Adu Anjing"
 dogfighting_training_spirit_desc: "Itu bukan giliran Immelman, itu setengah putaran."
 expert_marksmen_spirit: "Ahli Penembak Jitu"
