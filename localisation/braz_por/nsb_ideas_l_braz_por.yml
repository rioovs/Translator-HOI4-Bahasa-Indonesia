 political_loyalty_spirit: "Loyalitas Politik"
 political_loyalty_spirit_desc: "Militer yang tidak dapat diandalkan adalah ancaman bagi negara yang seharusnya dilindungi.\n\n§GSemangat ini ada karena ideologi kita.§!"
 political_loyalty_spirit_tt: "Pejabat Baru: mulai dengan sifat §Y\"Terhubung Secara Politik\"§! atau §Y\"Kepribadian Media\"§!."
 inventive_leadership_spirit: "Kepemimpinan Inventif"
 inventive_leadership_spirit_desc: "Jenderal yang mudah ditebak adalah Jenderal yang kalah."
 inventive_leadership_spirit_tt: "Petugas Baru: §G50% peluang§! untuk memulai dengan sifat §Y\"Commando\"§!, §Y\"Trickster\"§!, atau §Y\"Invader\"§!."
 mobile_warfare_academy_spirit: "Rangkullah Masa Depan"
 mobile_warfare_academy_spirit_desc: "Di mana pun pertempuran di masa depan terjadi, pasukan lapis baja akan memainkan peran yang menentukan."
 mobile_warfare_academy_spirit_tt: "Perwira Baru: Dapatkan kesempatan untuk memulai dengan sifat §Y\"Petugas Armor\"§!."
 superior_firepower_academy_spirit: "Sekolah Teknik"
 superior_firepower_academy_spirit_desc: "Ada banyak ilmu pengetahuan yang terlibat dalam menggali parit yang tepat."
 superior_firepower_academy_spirit_tt: "Petugas Baru: Dapatkan kesempatan untuk memulai dengan sifat §Y\"Petugas Insinyur\"§!."
 theatre_training_spirit: "Pelatihan Teater"
 theatre_training_spirit_desc: "Beberapa perwira mungkin 'menjadi penduduk asli', tetapi penduduk asli sangat pandai bertempur di medan pilihan mereka."
 theatre_training_academy_spirit_tt: "§G50% kemungkinan§! bahwa perwira baru akan diciptakan dengan sifat §Y\"Ahli Strategi Cemerlang\"§! atau §Y\"Ahli Strategi Tidak Fleksibel\"§!."
 mass_assault_academy_spirit: "Ratu Pertempuran"
 mass_assault_academy_spirit_desc: "Infanteri adalah Ratu Pertempuran, dan Ratu pergi kemanapun dia mau."
 underfunded_academy_spirit: "Akademi yang kekurangan dana"
 underfunded_academy_spirit_desc: "Ada hal-hal yang lebih baik untuk dibelanjakan uang daripada mengajari orang cara membunuh satu sama lain dengan lebih efisien."
 nepotism_academy_spirit: "Nepotisme"
 nepotism_academy_spirit_desc: "Paman saya yang menjalankan ketentaraan dan dia bilang saya bisa mendapatkan komando divisi sendiri kapan pun saya mau!"
 professional_officer_corps_spirit: "Korps Perwira Profesional"
 professional_officer_corps_spirit_desc: "Kami profesional, dan perang adalah profesi kami."
 elevated_engineering_corps_spirit: "Korps Insinyur Tinggi"
 elevated_engineering_corps_spirit_desc: "Penilaian terbaik atas kemampuan dan karakter seseorang adalah dengan memberinya sekop dan satu hari untuk melakukan sesuatu yang berguna dengannya."
 proper_heritage_spirit: "Warisan yang Layak"
 proper_heritage_spirit_desc: "Jendral yang baik mungkin bisa dilatih, tapi Jendral yang hebat harus dididik. Seperti kuda, di satu sisi."
 quick_improvisation_spirit: "Improvisasi Cepat"
 quick_improvisation_spirit_desc: "Memahami lebih cepat, berpikir lebih cepat, bertindak lebih cepat – itulah kunci kemenangan."
 adaptable_modernizers_spirit: "Modernisasi yang Dapat Beradaptasi"
 adaptable_modernizers_spirit_desc: "Suatu doktrin yang tidak dapat diubah bisa juga disebut dogma."
 relief_of_command_spirit: "Bantuan Komando"
 relief_of_command_spirit_desc: "Tentara tidak ada untuk memberi makan ego para Jenderalnya.\n\n§GSemangat ini ada karena ideologi kita.§!"
 ideological_loyalty_spirit: "Loyalitas Ideologis"
 ideological_loyalty_spirit_desc: "Seseorang yang tidak mempunyai ideologi yang benar tidak dapat diharapkan mencapai hasil yang benar dalam pertempuran.\n\n§GSemangat ini ada karena ideologi kita.§!"
