l_braz_por:
 MEX_callistas: "Callista"
 MEX_callistas_desc: "Para pendukung Calles memperkaya diri mereka sendiri dan menyalahgunakan kekuasaan mereka. Diangkat karena kesetiaan dan bukan karena kemampuan, mereka melanggengkan sistem patronase yang merusak setiap jabatan dan pangkat di negara ini. Kecuali jika mereka bisa berkuasa, rakyat biasa di Meksiko akan terus mencemooh pemerintah yang berkuasa sebagai 'robolucionarios', perampok-revolusioner."
 MEX_church_power_5: "Negara Katolik"
 MEX_church_power_5_desc: "UUD 1917 yang dibenci telah dibatalkan. Setelah puluhan tahun melakukan pelecehan terhadap martabat Iman Sejati, kami akhirnya menetapkan Gereja Suci sebagai otoritas tertinggi, baik secara moral maupun hukum, di Meksiko!"
 MEX_church_power_4: "Gereja yang Kuat"
 MEX_church_power_4_desc: "Kita telah mengurangi penindasan terhadap Iman Sejati dengan memulihkan kepemilikan mereka atas seminari dan gereja, namun masih banyak pekerjaan yang harus dilakukan."
 MEX_church_power_3: "Gereja Asertif"
 MEX_church_power_3_desc: "Kami telah mengakhiri upaya untuk membasmi Gereja Katolik di Meksiko. Dengan memberikan sedikit otonomi kepada para pendeta, mereka akan menghormati kendali kita atas negara dan menahan diri dari upaya untuk menggoyahkan kita."
 MEX_church_power_2: "Gereja yang Lemah"
 MEX_church_power_2_desc: "Konstitusi tahun 1917 mensyaratkan tindakan yang ditujukan untuk melawan pengaruh Gereja Katolik di Meksiko. Keluarga Cristeros memberontak pada tahun 1920-an karena upaya untuk menegakkan undang-undang tersebut, namun masyarakatnya sekarang mungkin siap untuk membentuk negara sekuler."
 MEX_church_power_1: "Negara Atheis"
 MEX_church_power_1_desc: "Gereja Katolik di Meksiko akan menjadi masa lalu. Para pendeta adalah kaum kontra-revolusioner dan penjaja takhayul yang tidak masuk akal. Kami akan berusaha lebih keras lagi untuk mengubah Meksiko menjadi benteng rasionalisme dan ilmu pengetahuan!"
 MEX_cedillo_tension: "Ketegangan Caudillo Rendah"
 MEX_cedillo_tension_desc: "Jenderal Saturnino Cedillo dan para caudillo yang bersekutu dengannya telah kehilangan sebagian besar kekuasaan mereka, namun mereka pasti berusaha untuk mendapatkannya kembali."
 MEX_cedillo_tension_2: "Ketegangan Caudillo Sedang"
 MEX_cedillo_tension_2_desc: "Jenderal Saturnino Cedillo dan para caudillo yang bersekutu dengannya dengan cemburu menjaga pengaruh mereka. Kita mungkin harus mengambil tindakan melawan mereka jika mereka menghalangi pemerintah."
 MEX_cedillo_tension_3: "Ketegangan Caudillo Tinggi"
 MEX_cedillo_tension_3_desc: "Jenderal Saturnino Cedillo dan caudillo yang bersekutu dengannya bertindak secara independen dari pemerintah. Mereka harus diasumsikan berhubungan dengan musuh, internal dan eksternal, [Root.GetLeader] dan rakyat Meksiko!"
 MEX_cedillo_tension_4: "Ketegangan Caudillo Sangat Tinggi"
 MEX_cedillo_tension_4_desc: "Jenderal Saturnino Cedillo dan caudillo yang bersekutu dengannya secara terbuka mengumpulkan pasukan untuk mempersiapkan pemberontakan mereka melawan pemerintah sah [Root.GetLeader]. Kita harus segera bertindak untuk mengakhiri ancaman terhadap persatuan Meksiko!"
 MEX_brown_water_navy: "Angkatan Laut Air Coklat"
 MEX_brown_water_navy_desc: "Kita mempunyai kekuatan pertahanan pantai yang mampu mengancam kapal selam dan penyerang permukaan, namun armada permukaan musuh yang berdedikasi akan mampu menyingkirkan kita."
 MEX_blue_water_navy: "Angkatan Laut Air Biru"
 MEX_blue_water_navy_desc: "Tujuan kami sekarang adalah angkatan laut permukaan yang mampu bertahan melawan armada negara-negara besar dunia."
 MEX_raiding_navy: "Menyerang Angkatan Laut"
 MEX_raiding_navy_desc: "Mencoba mengalahkan angkatan laut negara-negara besar di dunia akan sia-sia. Kami malah akan berusaha menghancurkan perdagangan dan konvoi musuh untuk melindungi Meksiko dari invasi."
 MEX_heavy_artillery: "Artileri Berat"
 MEX_heavy_artillery_desc: "Kami fokus pada artileri lapangan konvensional untuk dukungan tembakan."
 MEX_aerial_artillery: "Artileri Udara"
 MEX_aerial_artillery_desc: "Kami fokus pada pembom ringan dan taktis untuk dukungan tembakan."
 MEX_politicised_army: "Tentara yang Dipolitisasi"
 MEX_politicised_army_desc: "Para penguasa Meksiko berasal dari perwira tentara revolusioner selama hampir tiga dekade. Masa-masa penuh gejolak yang kita lalui menuntut kepemimpinan yang tegas. Pertanyaannya adalah: apakah turbulensi sudah berlalu atau justru semakin parah? Haruskah kita memprofesionalkan angkatan bersenjata atau membiarkan orang-orang kuat di kawasan – pemimpin politik dan caudillo – membentuk wilayah kekuasaan kecil? Jenderal seperti Saturnino Cedillo di San Luis Potosí membentuk milisi swasta untuk melindungi kekuasaan mereka. Banyaknya pemberontakan yang dilancarkan oleh para pejabat yang tidak puas di masa lalu kemungkinan besar akan terus berlanjut kecuali kita bertindak."
 MEX_politicised_army_2: "Tentara yang Dipolitisasi"
 MEX_politicised_army_2_desc: "Kami telah berhasil mengurangi kecenderungan yang lebih eksentrik dari orang-orang kuat di kawasan dengan melarang penggunaan milisi politik, seperti Jenderal Kaos Merah Jenderal Garrido dan Jenderal Kaos Emas Nicolás Rodríguez."
 MEX_revolutionary_army: "Tentara Revolusioner"
 MEX_revolutionary_army_desc: "Revolusi Meksiko diperjuangkan dan dimenangkan oleh para pahlawan dan patriot yang kita butuhkan untuk menjamin kemerdekaan negara kita."
 MEX_left_wing_paramilitaries: "Paramiliter Sayap Kiri"
 MEX_left_wing_paramilitaries_desc: "Kelompok-kelompok seperti Kaos Merah Jenderal Garrido dari Tabasco akan membantu kita menghancurkan musuh-musuh rakyat yang berupaya menumbangkan Revolusi dengan mengeksploitasinya demi keuntungan pribadi. Mereka akan membantu kita membasmi para pendukung rahasia Gereja Katolik, kaum kontra-revolusioner yang ingin Meksiko kembali ke Abad Kegelapan."
 MEX_right_wing_paramilitaries: "Paramiliter Sayap Kanan"
 MEX_right_wing_paramilitaries_desc: "Kelompok seperti Kaos Emas Jenderal Nicolás Rodríguez Carrasco akan membantu kita memastikan persatuan negara melawan pengkhianat dan pengalah sayap kiri."
 MEX_ejido_worker_militias: "Milisi Pekerja Ejido"
 MEX_ejido_worker_militias_desc: "Para petani pekerja keras dalam sistem ejido komunal bersatu untuk melindungi kepentingan mereka di Meksiko baru yang sedang kita bangun."
 MEX_caudillo_private_armies: "Tentara Swasta Caudillo"
 MEX_caudillo_private_armies_desc: "Para gubernur, pengusaha, dan komandan garnisun di suatu wilayah cenderung adalah orang yang sama – seorang jenderal Revolusioner yang memperoleh kekuasaan dengan menunjuk bawahan setianya pada posisi-posisi berpengaruh. Caudillo ini adalah fakta kehidupan yang harus kita kembangkan, bukan melawannya."
 MEX_strike_breaking: "Pemogokan Melanggar"
 MEX_strike_breaking_desc: "Aksi industrial merupakan tindakan pengkhianatan pada saat krisis. Dengan menguasai tenaga kerja di industri strategis kita, kita bisa meningkatkan output untuk kepentingan Tanah Air."
 MEX_international_struggle: "Perjuangan Internasional"
 MEX_international_struggle_desc: "Kami akan membantu mereka yang kami anggap layak dibantu dalam perjuangan ideologi dan pembebasan. Ini adalah tanggung jawab yang berat, namun rakyat Meksiko cukup kuat untuk melakukan tugas tersebut."
 MEX_synarchist_influence: "Pengaruh Sinarkis"
 MEX_synarchist_influence_desc: "Sinarkis Meksiko mencoba menyebarkan propaganda mereka di wilayah kami. Mereka berusaha menyembunyikan tujuan penindasan mereka di balik apa yang disebut \"solidaritas Hispanik\"."
 MEX_oil_concessions: "Konsesi Minyak"
 MEX_oil_concessions_desc: "Untuk mengeksploitasi minyak di Meksiko, perusahaan asing telah menandatangani kontrak konsesi yang memastikan bahwa mereka dapat dengan bebas mengekstraksi minyak di wilayah tertentu untuk jangka waktu yang lama dengan imbalan pembayaran. Namun jumlah yang dibayarkan oleh perusahaan-perusahaan tersebut jauh di bawah nilai minyak yang diekstraksi dan memungkinkan mereka memperoleh margin keuntungan yang jauh lebih tinggi dibandingkan negara-negara seperti AS, sekaligus menempatkan cadangan minyak Meksiko secara tidak langsung di bawah kendali asing."
 MEX_bolivarian_agitation: "Agitasi Bolivarian"
 MEX_hispanic_culture: "Budaya Hispanik"
 MEX_hispanic_culture_desc: "Negara-negara Amerika Latin memiliki budaya yang kuat, yang terbentuk dari penaklukan dan kelangsungan hidup, pemberontakan dan pemerintahan yang tegas. Budaya bersama kita adalah sumber kebanggaan dan cahaya penuntun bagi kemajuan kita di masa depan."
 MEX_proletarian_class_army: "Tentara Kelas Proletar"
 MEX_proletarian_class_army_desc: "Hanya kaum Proletariat, yang dipersenjatai dan diorganisir sebagai tentara kelas, yang akan mampu mempertahankan dan menyebarkan cita-cita Revolusi."
 MEX_idea_vanguard_of_the_4th_international: "Pelopor Internasional ke-4"
 MEX_idea_vanguard_of_the_4th_international_desc: "Revolusi kita telah menjadi angin kebebasan yang mendorong para pekerja di dunia untuk lebih berani. Internasional ke-4 akan membebaskan umat manusia dari rantai reaksi fasis, borjuis dan Bonapartis."
 MEX_luis_montes_de_oca: "Luis Montes de Oca"
 MEX_luis_montes_de_oca_desc: "Luis Montes de Oca adalah seorang bankir Meksiko terkemuka dan penganjur Sekolah Ekonomi Austria."
 MEX_alberto_pani: "Alberto J.Pani"
 MEX_alberto_pani_desc: "Alberto J. Pani adalah arsitek industri keuangan Meksiko dan salah satu kepala Bank Nasional dan Bank Kredit Pertanian."
 MEX_luis_farell: "Luis Farell Cubillas"
 MEX_luis_farell_desc: ""
 MEX_abelardo_rodriguez: "Abelardo L. Rodríguez"
 MEX_abelardo_rodriguez_desc: "Abelardo L. Rodríguez bergabung dengan Revolusi pada tahun 1913, dipromosikan naik pangkat berkat kecerdasan dan ketekunannya. Kesetiaannya terhadap Revolusi dihargai pada tahun 1932 ketika ia diangkat menjadi Presiden Meksiko selama dua tahun terakhir masa jabatan Álvaro Obregón setelah pembunuhannya."
 MEX_jose_gonzalo_escobar: "José Gonzalo Escobar"
 MEX_jose_gonzalo_escobar_desc: "Jenderal Escobar berperang melawan pemberontak Pancho Villa selama kekacauan dan pertikaian Revolusi, memimpin pasukan kavaleri melawan musuh-musuh pemerintah. Dia bertabrakan dengan Presiden Calles dan diasingkan setelah upaya pemberontakannya sendiri pada tahun 1929, namun dengan reorganisasi kabinet, dia dapat kembali."
 MEX_pablo_gonzalez: "Pablo González Garza"
 MEX_pablo_gonzalez_desc: "Pablo González adalah seorang jenderal angkatan darat dengan bakat mengorganisir 'pekerjaan basah'. Dia membantu mengatur penyergapan yang menewaskan pemberontak populer dan caudillo Emiliano Zapata pada tahun 1919."
 MEX_plutarco_calles: "Plutarco E. Calles"
 MEX_plutarco_calles_desc: "Presiden antara tahun 1924 dan 1928, Calles terus menjalankan kekuasaan yang besar atas negara bagian Meksiko berkat jaringan patronasenya yang kuat. Dia dijuluki 'Jefe Máximo' (Pemimpin Besar) oleh musuh-musuh politiknya sebagai cara untuk membandingkannya dengan Presiden Díaz yang diktator seumur hidup. Istilah ini sudah mulai digunakan secara umum, meskipun ia bersikeras bahwa ia hanyalah seorang pensiunan negarawan yang memberikan nasihat demi kepentingan negara."
 MEX_vicente_lombardo: "Vicente Lombardo"
 MEX_vicente_lombardo_desc: "Seorang anggota serikat buruh radikal yang memperjuangkan hak-hak pekerja setelah Revolusi, membawa buruh ke dalam aliansi dengan partai berkuasa di Cárdenas."
 MEX_jose_vasconcelos: "José Vasconcelos"
 MEX_jose_vasconcelos_desc: "Seorang penulis budaya, mantan menteri kabinet dan calon presiden, Vasconcelos memadukan konsep agama Pribumi, Katolik, dan nasionalisme sipil untuk membentuk ideologi sinkretis Meksiko. Dia mendukung penaklukan kembali Penyerahan Meksiko dari Amerika."
 MEX_bartolome_garcia_correa: "Bartolomé García Correa"
 MEX_bartolome_garcia_correa_desc: "Penduduk asli Maya dari Yucatan yang pernah menjabat sebagai gubernur dan senator, menerapkan kebijakan populis yang menyelaraskan adat istiadat penduduk asli dengan kekuasaan negara."
 MEX_aaron_saenz: "Aaron Saenz Garza"
 MEX_aaron_saenz_desc: "Seorang pengusaha dan gubernur sayap kanan, Aarón Sáenz dijuluki 'Bayangan Calles' karena kemampuannya menjaga kabinet presiden boneka sejalan dengan tujuan el Jefe Máximo."
 MEX_manuel_perez_trevino: "Manuel Pérez Treviño"
 MEX_manuel_perez_trevino_desc: "Manuel Pérez Treviño adalah seorang jenderal Revolusioner dengan keahlian di bidang teknik dan artileri. Dia berpengaruh secara politik, menjadi pendiri Partido Nacional Revolucionario."
 MEX_saturnino_cedillo: "Saturnino Cedillo Martínez"
 MEX_saturnino_cedillo_desc: "Seorang gubernur Utara yang kaya dan pemimpin militer, Jenderal Cedillo menjalankan kekuasaan berkat sistem patronase yang didasarkan pada kesetiaan pribadi. Memudarnya pengaruh caudillo dan sentralisasi negara menjadi perhatian besarnya karena mengancam independensinya dari pemerintah."
 MEX_othon_blanco: "Othón P. Blanco Núñez de Cáceres"
 MEX_othon_blanco_desc: "Othón Blanco adalah anggota senior Sekretariat Angkatan Laut, yang menjabat sebagai perwira angkatan laut sejak sebelum Revolusi. Bidang keahliannya adalah memastikan angkatan laut memiliki akses yang baik terhadap dukungan logistik, termasuk membangun pemukiman baru."
 MEX_heriberto_corona: "Heriberto Jara Corona"
 MEX_heriberto_corona_desc: "Heriberto Corona adalah seorang jenderal Revolusioner yang diangkat ke Angkatan Laut untuk memastikan kesetiaannya."
 MEX_manuel_avila: "Manuel Avila Camacho"
 MEX_manuel_avila_desc: "Seorang jenderal Revolusioner yang ditunjuk di Sekretariat Pertahanan Nasional untuk mempersiapkan Meksiko menghadapi masalah yang akan datang."
 MEX_leon_trotsky: "Leo Trotsky"
 MEX_leon_trotsky_desc: "Bertanggung jawab untuk membentuk Tentara Merah hampir dari awal selama Perang Saudara Rusia, pemimpin Liga Komunis Internasional ini akan membantu mengorganisir tentara."
 MEX_tga: "Talleres Generales de Arma"
 MEX_tga_desc: "Sebuah cabang dari bengkel aeronautika Meksiko, TNCA, yang didedikasikan untuk kendaraan tempur lapis baja."
 MEX_germano_mexican_tanks: "Desain Tank Jerman-Meksiko"
 MEX_germano_mexican_tanks_desc: ""
 MEX_russo_mexican_tanks: "Desain Tank Rusia-Meksiko"
 MEX_russo_mexican_tanks_desc: ""
 MEX_american_mexican_tanks: "Chrysler Meksiko"
 MEX_american_mexican_tanks_desc: ""
 MEX_astimar_gulf: "Golf ASTIMAR"
 MEX_astimar_gulf_desc: "Astilleros de la Secretaría de Marina del Golfo"
 MEX_astimar_pacific: "ASTIMAR Pasifiko"
 MEX_astimar_pacific_desc: "Astilleros de la Secretaría de Marina del Pacifico"
 MEX_tnca: "Talleres Nacionales de Construcciones Aeronáuticas"
 MEX_tnca_desc: "Lokakarya Nasional untuk Konstruksi Penerbangan didirikan sebelum Revolusi dan merupakan perancang inovatif sebelum gangguan perang saudara."
 MEX_royal_dutch_shell: "Cangkang Kerajaan Belanda"
 MEX_royal_dutch_shell_desc: "Sebuah perusahaan Inggris dan Belanda memegang 60% konsesi minyak Meksiko."
 mexican_ford: "Ford Meksiko"
 mexican_ford_desc: "Waralaba lokal dari Ford Motor Company."
 MEX_pemex: "Pemex"
 MEX_pemex_desc: "Petróleos Mexicanos dibentuk dari nasionalisasi aset lokal yang sebelumnya dimiliki oleh Royal Dutch Shell, Standard Oil of California, dan perusahaan asing lainnya."
 MEX_banco_de_mexico: "Banco de México"
 MEX_banco_de_mexico_desc: "Dibentuk pada tahun 1925 untuk membangun kembali perekonomian yang hancur akibat perang saudara, Bank Nasional kita adalah pemberi pinjaman pilihan terakhir, penerbit mata uang, dan investor dalam segala bentuk usaha untuk kepentingan negara."
 MEX_escuela_de_ingeneria_electrica: "Escuela de Ingeneria"
 MEX_escuela_de_ingeneria_electrica_desc: "Escuela Superior de Ingenería Mecánica y Eléctrica, Universitas Teknik Mesin dan Elektronik, adalah salah satu institusi pendidikan terbaik kami, yang terdepan dalam penelitian gelombang elektromagnetik dan televisi."
 MEX_capital_reserves: "Cadangan Modal"
 MEX_capital_reserves_desc: "Kekayaan yang mengalir dari industri minyak kita yang berkembang akan memungkinkan kita melakukan pembelian peralatan militer asing yang berkualitas tinggi."
 MEX_knights_of_columbus: "Ksatria Columbus"
 MEX_knights_of_columbus_desc: "Sebuah persaudaraan umat Katolik internasional, Knights of Columbus akan membantu kita mencapai perdamaian dan rekonsiliasi setelah perselisihan sipil selama beberapa dekade. Sebagaimana dikatakan dalam Kitab Matius: 'Kamu telah mendengar pepatah, 'mata ganti mata dan gigi ganti gigi'. Tetapi Aku berkata kepadamu, jangan melawan orang yang jahat. Jika ada yang menampar pipi kananmu, berikan juga pipi kirimu kepadanya.'"
 MEX_social_catholicism: "Katolik Sosial"
 MEX_social_catholicism_desc: "Revolusi industri telah menempatkan pekerja pada situasi yang tidak manusiawi. Untuk melawan tuntutan sosialis, penekanan khusus diberikan pada perlunya manajemen untuk menunjukkan kasih sayang kepada karyawannya. Hal ini melahirkan varian sosialisme Kristen non-revolusioner: sosial Katolik."
 MEX_legion_of_christ: "Legiun Kristus"
 MEX_legion_of_christ_desc: "Teroris atheis telah dikalahkan! Penindasan brutal mereka harus dihukum setimpal. Seperti yang dikatakan dalam Kitab Keluaran: mata ganti mata, hidup ganti hidup. Untuk menjadi tangan pendendam Yang Maha Kuasa, Legiun Kristus akan memastikan bahwa ketidaksetiaan setan akan hilang dari negeri kita."
 MEX_triumph_of_synarchism: "Kemenangan Sinarkisme"
 MEX_triumph_of_synarchism_desc: "Benar-benar dikalahkan, musuh-musuh kita bersembunyi di balik bayang-bayang seperti kaki tangan Setan. Kita sekarang mempunyai kebebasan untuk menjamin rekonstruksi negara dengan cara yang menjamin kesatuan baik dalam keyakinan maupun kemauan politik."
 MEX_womens_suffrage: "Hak Pilih Perempuan"
 MEX_womens_suffrage_desc: "Dalam beberapa tahun terakhir, banyak elit Meksiko khawatir bahwa perempuan akan menumbangkan cita-cita Revolusi dengan memihak Gereja Katolik melawan Konstitusi sekuler tahun 1917, namun kesetaraan di bawah hukum jauh lebih penting dan akan memungkinkan masyarakat kita untuk berkembang."
 MEX_professional_army: "Escuela Superior de Guerra"
 MEX_professional_army_desc: "Berkat Sekolah Militer kami, para jenderal kami telah belajar bagaimana mengembangkan sistem pasokan yang efisien untuk menjaga pasukan kami bertempur dengan efisiensi maksimum."
 MEX_international_peacekeepers: "Penjaga Perdamaian Internasional"
 MEX_international_peacekeepers_desc: "Kekuatan demokrasi di dunia berencana untuk membentuk aliansi yang sederajat, Perserikatan Bangsa-Bangsa, untuk menjamin keamanan internasional dengan memberikan tempat bagi negara-negara di dunia untuk mendamaikan perbedaan mereka dan menengahi perselisihan. Kami akan terlibat dalam proyek semacam ini untuk membantu negara-negara Amerika Latin mempertahankan kemerdekaannya."
 mexico_hispanic_diplomacy: "Diplomasi Hispanik"
 mexico_hispanic_diplomacy_desc: "Jika kita ingin mewujudkan ambisi kontinental kita, kita harus meyakinkan banyak negara di Amerika Latin."
 mexico_german_submarine_happy_time: "Waktu Bahagia Kapal Selam"
 mexico_german_submarine_happy_time_desc: "Kapten kapal selam kami sedang menikmati Happy Time ('Glückliche Zeit') dengan menenggelamkan kapal netral yang tidak terlindungi di lepas pantai Amerika."
 synarchist_youth: "Pemuda Sinarkis"
 synarchist_youth_desc: "Generasi muda adalah masa depan bangsa kita. Jika mereka dididik dengan baik, mereka akan menjadi perwujudan cita-cita kita - kekuatan, kesetiaan, dan kesalehan."
 ENG_trade_union_factory_demands: "Tuntutan Pabrik Serikat Pekerja"
 ENG_construction_safety_regulations: "Peraturan Keselamatan Konstruksi"
 ENG_mandatory_union_days: "Hari Persatuan Wajib"
 ENG_trade_union_factory_worker_support: "Dukungan Serikat Pekerja Pabrik"
 ENG_trade_union_dockyard_worker_support: "Dukungan dari Serikat Pekerja Galangan Kapal"
 ENG_trade_union_construction_worker_support: "Dukungan Serikat Pekerja Konstruksi"
 ENG_trade_union_war_propaganda_support: "Dukungan Propaganda Perang Serikat Buruh"
 ENG_dominion_fascist_propaganda: "Propaganda Fasis Inggris"
 ENG_dominion_communist_propaganda: "Propaganda Komunis Inggris"
 ENG_restoring_public_order: "Memulihkan Ketertiban Umum"
 ENG_support_for_the_king_idea: "Dukungan untuk Raja"
 ENG_exiled_royal_family: "Keluarga Kerajaan yang Diasingkan"
 ENG_confiscated_royal_wealth: "Kekayaan Kerajaan yang Disita"
 ENG_raymond_briggs: "Raymond Briggs"
 HOL_wilhelmina: "Wilhelmina"
 HOL_wilhelmina_desc: "Selama berabad-abad keluarga Orange-Nassau telah terjalin dengan sejarah Belanda sendiri. Seperti nenek moyangnya William yang Pendiam dalam Perang Delapan Puluh Tahun, Ratu saat ini, Wilhelmina, tidak diragukan lagi akan menjadi inspirasi bagi orang-orang Belanda yang bersatu untuk membela tanah air mereka, jika negara mereka diserang."
 HOL_aloof_neutrality: "Netralitas Menyendiri"
 HOL_aloof_neutrality_desc: "Kebijakan Netralitas yang ketat telah menjauhkan Belanda dari peperangan dengan negara-negara tetangganya selama hampir 150 tahun, dan yang lebih penting lagi, telah menjauhkan mereka dari Perang Besar. Oleh karena itu, kepercayaan masyarakat terhadap \"jimat perlindungan\" mereka semakin kuat, dan pemerintah Belanda yang lemah mendapati dirinya tidak mampu melawan keinginan rakyat dan mengambil sikap yang kuat dalam politik internasional. Sebaliknya, negara ini memutuskan untuk menaruh kepercayaannya pada Liga Bangsa-Bangsa, dan sebaliknya bersikap acuh tak acuh terhadap peristiwa-peristiwa dunia."
 HOL_shell_shocked_spectator: "Penonton Perang Besar yang terkejut"
 HOL_shell_shocked_spectator_desc: "Karena Belanda yang netral merupakan tempat perlindungan terdekat bagi para pengungsi dari Front Barat, Belanda hanya menjadi penonton dekat dengan kengerian Perang Besar. Akibatnya, gerakan pasifis yang kuat telah berkembang dan menyebar ke sebagian besar masyarakat, dan menyebabkan pemerintah mengalami kesulitan besar dalam menerapkan peningkatan belanja militer. Hanya angkatan laut yang masih menikmati prestise tertentu di mata publik.\n\nPerang defensif atau \"perang melawan pasifisme\" diperlukan untuk benar-benar menghilangkan sentimen ini dari negara."
 HOL_de_crisisjaren: "De Krisisjaren"
 HOL_de_crisisjaren_desc: "Karena kekhasan perekonomian global, Depresi Besar melanda Belanda jauh lebih lambat dibandingkan negara lain. Keputusan Belanda untuk mempertahankan Standar Emas, sementara negara-negara lain segera meninggalkannya, semakin memperburuk \"tahun-tahun krisis\" di Belanda. Untuk menjaga agar Guilder tidak mengalami devaluasi, tidak ada dana yang tersisa untuk membantu perekonomian Belanda yang sedang lemah, apalagi memperbaiki kondisi pertahanan nasional yang buruk.\n\nKrisis ini dapat dikurangi dengan berinvestasi pada pekerjaan umum, dan akan menjadi tidak relevan jika kita menyerah dan kehilangan kendali atas daratan yang dilanda krisis."
 HOL_weak_government: "Pemerintahan yang Lemah"
 HOL_weak_government_desc: "Pemerintah Belanda dalam beberapa tahun terakhir dirusak oleh kelemahan. Tidak perlu banyak waktu untuk menjatuhkannya lagi."
 HOL_shared_intelligence_eng: "Berbagi Intelijen Inggris"
 HOL_shared_intelligence_fra: "Berbagi Intelijen Prancis"
 HOL_shared_intelligence_ger: "Berbagi Intelijen Jerman"
 HOL_shared_intelligence_hol: "Berbagi Intelijen Belanda"
 HOL_staff_plan_eng: "Rencana Staf Gabungan Inggris"
 HOL_staff_plan_fra: "Rencana Staf Gabungan Prancis"
 HOL_staff_plan_ger: "Rencana Staf Gabungan Jerman"
 HOL_de_vaarplicht_idea: "De Vaarplicht"
 HOL_de_vaarplicht_idea_desc: "\"Berdasarkan Keputusan Kerajaan A5, semua warga negara Belanda dan warga negara Belanda, yang belum wajib militer, atau, jika sudah, belum dipanggil untuk dinas aktif, wajib melakukan dinas untuk, atau untuk kepentingan, angkatan laut pedagang.\""
 HOL_caved_to_the_germans_idea: "Menyerah pada Jerman"
 HOL_caved_to_the_germans_idea_desc: "Daripada menghadapi ancaman invasi, Belanda memilih untuk menuruti tuntutan Jerman dalam negosiasi perdagangan mereka. Akibatnya, kebebasan demokratis mulai terpuruk, dan hal ini dapat dilihat sebagai langkah pertama menuju netralitas."
 HOL_caved_to_the_british_idea: "Menyerah ke Inggris"
 HOL_caved_to_the_british_idea_desc: "Daripada menghadapi ancaman blokade total, yang tentunya akan menyebabkan bencana ekonomi, Belanda memilih untuk menuruti tuntutan Inggris dalam negosiasi perdagangan mereka. Sentimen anti-Jerman dan pro-Inggris semakin terlihat dalam politik internal negara tersebut, dan hal ini dapat dilihat sebagai langkah tentatif pertama untuk menjauh dari netralitas."
 HOL_prince_bernhard: "Pangeran Bernhard"
 HOL_bernhard_air_example: "Contoh Pangeran Bernhard untuk Penerbang"
 HOL_bernhard_strategy_meddling: "Pangeran Bernhard ikut campur dalam Strategi"
 HOL_bernhard_intelligence: "Pangeran Bernhard Mengumpulkan Intelijen"
 HOL_bernhard_organized_resistance: "Pangeran Bernhard Mengorganisir Perlawanan"
 HOL_redirected_investments: "Investasi yang Diarahkan"
 idea_weapons_for_the_resistance: "Senjata untuk Perlawanan"
 idea_weapons_for_the_resistance_desc: "Sekutu kita mengirimkan amunisi kepada para pejuang kemerdekaan yang berani melawan musuh yang dibenci di tanah air kita."
 political_turmoil: "Gejolak Politik"
 political_turmoil_desc: "Pemerintahan negara ini baru-baru ini dilantik secara paksa setelah kepemimpinan sebelumnya tidak lagi disukai oleh penguasa asing."
 HOL_domestic_aircraft_production: "Produksi Pesawat Dalam Negeri"
 HOL_preparing_evacuation_of_gold_reserves: "Mempersiapkan Evakuasi Cadangan Emas"
 HOL_zuiderzee_infrastructure_advancements: "Kemajuan Infrastruktur Zuiderzee"
 HOL_zuiderzee_industrial_advancements: "Kemajuan Industri Zuiderzee"
 HOL_german_defectors_1: "Pembelot Jerman"
 HOL_german_defectors_1_desc: "Sejumlah pembelot Jerman secara teratur membentuk unit-unit yang bersemangat berperang atas nama kita, untuk mengembalikan Kaiser mereka."
 HOL_german_defectors_2: "Pembelot Pro-Kaiser"
 HOL_german_defectors_2_desc: "Kesetiaan yang salah arah kepada Kaiser lama telah mendorong sejumlah tentara untuk membelot dan berperang demi Belanda, dalam upaya yang sia-sia untuk mengembalikan Kaiser ke takhta.\n\nHanya kekalahan total Belanda, dan aliansi di mana mereka menjadi bagiannya, kemungkinan besar akan menghentikan gerakan ini sepenuhnya."
 ENG_joint_air_training_scheme: "Skema Pelatihan Udara Gabungan"
 ENG_joint_air_training_scheme_desc: "Pemerintah Inggris telah melaksanakan program pelatihan di seluruh Persemakmuran untuk awak pesawat anggotanya. Kita akan mendapat banyak manfaat dari hal ini."
