 medium_plane_airframe_0: "Badan Pesawat Sedang Antar-Perang"
 medium_plane_airframe_0_desc: "Meskipun mampu membawa muatan bom signifikan melintasi jarak jauh, potensi pengembangan rangka pesawat ini sangat terbatas."
 medium_plane_airframe_1: "Badan Pesawat Sedang Dasar"
 medium_plane_airframe_1_desc: "Menggabungkan sejumlah teknologi baru yang dikembangkan baru-baru ini, badan pesawat ini secara signifikan lebih kapabel dibandingkan pesawat berukuran serupa sebelumnya."
 medium_plane_airframe_2: "Badan Pesawat Sedang Ditingkatkan"
 medium_plane_airframe_2_desc: "Memanfaatkan teknologi produksi modern, rangka pesawat ini memungkinkan pesawat membawa muatan lebih besar pada jarak tempuh yang lebih jauh."
 medium_plane_airframe_3: "Badan Pesawat Sedang Mutakhir"
 medium_plane_airframe_3_desc: "Dirancang untuk memaksimalkan performa dan muatan senjata, rangka pesawat ini mewakili puncak pesawat bertenaga piston konvensional."
 medium_plane_airframe_4: "Badan Pesawat Sedang Modern"
 medium_plane_airframe_4_desc: "Dengan pesawat bermesin jet yang kemungkinan besar akan mendominasi angkasa, para insinyur mulai merancang rangka pesawat yang secara khusus disesuaikan dengan propulsi jet."
 medium_plane_fighter_airframe_0: "Pesawat Tempur Berat Antar-Perang"
 medium_plane_fighter_airframe_0_desc: "$medium_plane_airframe_0_desc$"
