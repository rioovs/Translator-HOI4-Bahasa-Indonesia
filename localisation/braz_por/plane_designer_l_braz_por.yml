 engine_1_1x: "1x Mesin I"
 engine_1_1x_desc: "Mesin dasar ini andal dan murah, tetapi tidak terlalu bertenaga."
 engine_1_2x: "2x Mesin I"
 engine_1_2x_desc: "Dua mesin memberikan peningkatan daya dorong yang signifikan pada pesawat, namun dengan biaya lebih tinggi."
 engine_1_3x: "3x Mesin I"
 engine_1_3x_desc: "Tiga mesin memberikan lebih banyak daya dorong daripada sepasang mesin, tanpa biaya tambahan dari mesin keempat."
 engine_1_4x: "4x Mesin I"
 engine_1_4x_desc: "Empat mesin memberikan daya dorong yang cukup untuk mengangkat pesawat berat dan memungkinkannya membawa muatan bom yang signifikan."
 engine_1_6x: "6x Mesin I"
 engine_1_6x_desc: "Dengan enam mesin, pesawat apa pun dapat dibuat untuk membawa muatan besar melintasi jarak jauh pada kecepatan yang memadai."
 engine_2_1x: "1x Mesin II"
 engine_2_1x_desc: "Mesin yang lebih besar dan lebih bertenaga memungkinkan kecepatan lebih tinggi dan daya angkut muatan lebih besar."
 engine_2_2x: "2x Mesin II"
 engine_2_2x_desc: "$engine_1_2x_desc$"
 engine_2_3x: "3x Mesin II"
 engine_2_3x_desc: "$engine_1_3x_desc$"
 engine_2_4x: "4x Mesin II"
 engine_2_4x_desc: "$engine_1_4x_desc$"
 engine_2_6x: "6x Mesin II"
 engine_2_6x_desc: "$engine_1_6x_desc$"
 engine_3_1x: "1x Mesin III"
 engine_3_1x_desc: "Menggabungkan fitur-fitur mutakhir seperti injeksi metanol dan pencampuran bahan bakar otomatis, mesin ini mampu menghasilkan daya yang jauh lebih besar."
 engine_3_2x: "2x Mesin III"
 engine_3_2x_desc: "$engine_1_2x_desc$"
 engine_3_3x: "3x Mesin III"
 engine_3_3x_desc: "$engine_1_3x_desc$"
 engine_3_4x: "4x Mesin III"
 engine_3_4x_desc: "$engine_1_4x_desc$"
 engine_3_6x: "6x Mesin III"
 engine_3_6x_desc: "$engine_1_6x_desc$"
 engine_4_1x: "1x Mesin IV"
 engine_4_1x_desc: "Dengan rekayasa ekstensif untuk memanfaatkan setiap potensi peningkatan performa, mesin ini mewakili puncak mutlak teknologi mesin piston."
 engine_4_2x: "2x Mesin IV"
 engine_4_2x_desc: "$engine_1_2x_desc$"
 engine_4_3x: "3x Mesin IV"
 engine_4_3x_desc: "$engine_1_3x_desc$"
 engine_4_4x: "4x Mesin IV"
 engine_4_4x_desc: "$engine_1_4x_desc$"
 engine_4_6x: "6x Mesin IV"
 engine_4_6x_desc: "$engine_1_6x_desc$"
 jet_engine_1x: "1x Mesin Jet"
 jet_engine_1x_desc: "Dengan pendekatan yang sepenuhnya baru untuk menggerakkan pesawat terbang, mesin yang kompleks dan temperamental ini menawarkan peningkatan besar dalam daya dorong dan kecepatan."
 jet_engine_2x: "2x Mesin Jet"
 jet_engine_2x_desc: "$engine_1_2x_desc$"
 jet_engine_3x: "3x Mesin Jet"
 jet_engine_3x_desc: "$engine_1_3x_desc$"
 jet_engine_4x: "4x Mesin Jet"
 jet_engine_4x_desc: "$engine_1_4x_desc$"
 jet_engine_6x: "6x Mesin Jet"
 jet_engine_6x_desc: "$engine_1_6x_desc$"
 rocket_engine_1: "Mesin Roket I"
 rocket_engine_1_desc: "Memanfaatkan bahan bakar yang sangat volatil dan oksidator yang tidak stabil, mesin ini mampu menghasilkan daya dorong yang luar biasa untuk melesatkan pesawat ke kecepatan tinggi, dengan mengorbankan jarak jangkau."
 rocket_engine_2: "Mesin Roket II"
 rocket_engine_2_desc: "Peningkatan ruang pembakaran dan sedikit perubahan campuran bahan bakar memberikan performa yang lebih tinggi lagi, dengan penurunan jarak tempuh yang sepadan."
 rocket_engine_3: "Mesin Roket III"
 rocket_engine_3_desc: ""
 light_mg_2x: "2x Senapan Mesin Ringan"
 light_mg_2x_desc: "Dua senapan mesin kaliber senapan memberikan tambahan daya tembak ringan terhadap target udara dengan biaya yang sangat terjangkau."
 light_mg_4x: "4x Senapan Mesin Ringan"
 light_mg_4x_desc: "Kekurangan daya rusak dari rangkaian empat senjata kaliber senapan ini dikompensasi oleh banyaknya volume tembakan yang dilontarkan."
 aircraft_cannon_1_1x: "1x Meriam I"
 aircraft_cannon_1_1x_desc: "Meriam otomatis menawarkan daya tembak yang signifikan terhadap sasaran udara, namun tambahan bobotnya membuat pesawat lebih lambat dan kurang lincah bermanuver."
 aircraft_cannon_1_2x: "2x Meriam I"
 aircraft_cannon_1_2x_desc: "Dua meriam otomatis memberi pesawat persenjataan tembak depan yang menakutkan terhadap sasaran udara dan sasaran darat lunak, dengan pengurangan signifikan pada kelincahan dan bobot."
 bomb_locks: "Gantungan Bom"
 bomb_locks_desc: "Dudukan untuk bom kecil di bawah sayap atau badan pesawat memungkinkan pesawat menyerang sasaran darat dengan peluang keberhasilan yang baik."
 heavy_bomb_locks: "Gantungan Bom Berat"
 heavy_bomb_locks_desc: "Dudukan untuk bom besar di bawah sayap atau badan pesawat memungkinkan pesawat menyerang sasaran darat dengan dampak kerusakan besar."
 armor_piercing_bomb_locks: "Gantungan Bom Penembus Baja"
 armor_piercing_bomb_locks_desc: "Dudukan untuk bom penembus baja besar di bawah sayap atau badan pesawat memungkinkan pesawat menyerang sasaran laut dengan efektivitas luar biasa."
 torpedo_mounting: "Dudukan Torpedo Ringan"
 torpedo_mounting_desc: "Titik tumpu yang memungkinkan torpedo berbobot ringan dipasang di bawah badan pesawat. Ini memberikan pesawat senjata ampuh untuk menghadapi kapal perang musuh."
 torpedo_mounting_2: "Dudukan Torpedo Sedang"
 torpedo_mounting_2_desc: "Titik tumpu yang memungkinkan torpedo berbobot sedang dipasang di bawah badan pesawat. Ini memberikan pesawat senjata ampuh untuk menghadapi kapal perang musuh."
 torpedo_mounting_3: "Dudukan Torpedo Berat"
 torpedo_mounting_3_desc: "Titik tumpu yang memungkinkan torpedo berbobot berat dipasang di bawah badan pesawat. Ini memberikan pesawat senjata ampuh untuk menghadapi kapal perang musuh."
 armor_plate_small: "Pelat Lapis Baja"
 armor_plate_small_desc: "Pelat baja di belakang kursi pilot dan di sekitar mesin memberikan pesawat ketahanan hidup yang lebih baik terhadap tembakan dari darat dan serangan dari arah belakang."
 heavy_mg_2x: "2x Senapan Mesin Berat"
 heavy_mg_2x_desc: "Sepasang senapan mesin berat memungkinkan menembus kulit luar pesawat modern yang diperkuat."
 heavy_mg_4x: "4x Senapan Mesin Berat"
 heavy_mg_4x_desc: "Empat senapan mesin berat menawarkan daya tembak yang mengerikan, baik dalam kinerja per peluru maupun volume tembakan."
 aircraft_cannon_2_1x: "1x Meriam II"
 aircraft_cannon_2_1x_desc: "Meriam modern yang menembakkan proyektil besar pada kecepatan tinggi, senjata ini dapat menjatuhkan pesawat tempur maupun pengebom strategis dengan mudah."
 aircraft_cannon_2_2x: "2x Meriam II"
 aircraft_cannon_2_2x_desc: "Meriam kembar memberikan pukulan mematikan pada pesawat, sementara peningkatan volume tembakan memudahkan menghasilkan tembakan telak yang melumpuhkan."
 large_aircraft_cannon_1x: "1x Meriam Kaliber Besar"
 large_aircraft_cannon_1x_desc: "Menembakkan proyektil yang lebih besar dan bertenaga dibandingkan meriam otomatis sebelumnya namun dengan kecepatan lebih lambat, senjata ini dapat merontokkan badan pesawat besar dalam satu tembakan langsung."
 large_aircraft_cannon_2x: "2x Meriam Kaliber Besar"
 large_aircraft_cannon_2x_desc: "Meriam kembar memberikan pukulan mematikan pada pesawat, sementara peningkatan volume tembakan memudahkan menghasilkan tembakan telak yang melumpuhkan."
 small_bomb_bay: "Kompartemen Bom Kecil"
 small_bomb_bay_desc: "Kompartemen kecil di dalam badan pesawat untuk membawa bom. Berada di dalam badan pesawat mengurangi hambatan aerodinamis (drag), namun modifikasi struktural ini membuat pesawat tidak dapat melakukan manuver ekstrem dalam duel udara."
 medium_bomb_bay: "Kompartemen Bom Sedang"
 medium_bomb_bay_desc: "Kompartemen bom berukuran sedang memungkinkan membawa persenjataan yang cukup untuk menyerang beragam target."
 large_bomb_bay: "Kompartemen Bom Besar"
 large_bomb_bay_desc: "Kompartemen bom besar untuk membawa munisi yang cukup guna merusak atau menghancurkan pabrik-pabrik besar dan sasaran keras lainnya."
 tank_buster_1: "Meriam Anti-Tank I"
 tank_buster_1_desc: "Diadaptasi dari meriam anti-tank yang digunakan Angkatan Darat, senjata ini dapat menghancurkan tank modern dengan tembakan tepat. Namun, bobotnya yang berat dan strukturnya yang canggung sangat membatasi kinerja terbang pesawat."
 tank_buster_2: "Meriam Anti-Tank II"
 tank_buster_2_desc: "Tank yang lebih berat kini membutuhkan meriam yang jauh lebih besar untuk ditembus. Kendati sangat berat dan menyulitkan manuver, senjata ini sangat mematikan untuk menyerang posisi kendaraan musuh."
 fuel_tanks_small: "Tangki Bahan Bakar Tambahan"
 fuel_tanks_small_desc: "Menyediakan lebih banyak ruang internal badan pesawat untuk bahan bakar menambah jarak jangkau pesawat, tetapi juga membuatnya jauh lebih mudah terbakar."
 self_sealing_fuel_tanks_small: "Tangki Bahan Bakar Swatutup"
 self_sealing_fuel_tanks_small_desc: "Dengan menambahkan lapisan karet khusus di sekitar tangki bahan bakar, tembakan yang mengenai tangki tidak akan melumpuhkan pesawat karena tangki akan menutup bocorannya secara otomatis dari waktu ke waktu, mencegah kehilangan bahan bakar."
 armor_plate_medium: "$armor_plate_small$"
 armor_plate_medium_desc: "Lapisan baja di sekitar mesin dan bagian badan pesawat yang lebih rapuh memberikan ketahanan hidup yang jauh lebih baik, dengan sedikit mengorbankan jarak tempuh."
 fuel_tanks_medium: "$fuel_tanks_small$"
 fuel_tanks_medium_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_medium: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_medium_desc: "$self_sealing_fuel_tanks_small_desc$"
 armor_plate_large: "$armor_plate_small$"
 armor_plate_large_desc: "Pelat baja ekstensif melindungi mesin, tangki bahan bakar, dan kompartemen awak, memungkinkan pesawat menahan hampir semua tembakan kecuali hantaman langsung dari meriam pertahanan udara berat, sekaligus menjadikannya sasaran yang sangat tangguh bagi pesawat tempur pemburu."
 fuel_tanks_large: "$fuel_tanks_small$"
 fuel_tanks_large_desc: "$fuel_tanks_small_desc$"
 self_sealing_fuel_tanks_large: "$self_sealing_fuel_tanks_small$"
 self_sealing_fuel_tanks_large_desc: "$self_sealing_fuel_tanks_small_desc$"
 lmg_defense_turret: "Kubah Pertahanan Senapan Mesin Ringan"
 lmg_defense_turret_desc: "Meskipun agak kurang bertenaga untuk duel udara modern, senapan mesin ringan di dalam kubah akan membuat setiap serangan musuh terhadap pesawat ini menjadi upaya yang lebih berisiko."
 lmg_defense_turret_2x: "Kubah Pertahanan Senapan Mesin Ringan 2x"
 lmg_defense_turret_2x_desc: "Rangkaian dua senapan mesin ringan di dalam kubah bertenaga listrik mencakup sudut tembak lebih luas dan menjadikan pesawat target yang jauh lebih sulit diserang."
 hmg_defense_turret: "Kubah Pertahanan Senapan Mesin Berat"
 hmg_defense_turret_desc: "Senapan mesin berat di dalam kubah berputar memungkinkan pihak yang bertahan membalas tembakan pesawat tempur musuh yang bersenjata serupa dengan harapan berhasil merontokkannya."
 hmg_defense_turret_2x: "Kubah Pertahanan Senapan Mesin Berat 2x"
 hmg_defense_turret_2x_desc: "Sepasang kubah bertenaga dengan senapan mesin berat menyajikan ancaman berbahaya bagi setiap pesawat tempur yang mencoba menyerang."
 cannon_defense_turret: "Kubah Pertahanan Meriam"
 cannon_defense_turret_desc: "Meriam modern di dalam kubah putar secara signifikan mengubah keseimbangan kekuatan antara bertahan dan menyerang dalam duel udara. Hanya sedikit pesawat tempur yang mampu bertahan dari hantaman langsung peluru meriam modern dan terus bertarung."
 cannon_defense_turret_2x: "Kubah Pertahanan Meriam 2x"
 cannon_defense_turret_2x_desc: "Dua kubah bersenjatakan meriam otomatis memberikan daya pertahanan yang menakutkan, membuat serangan pesawat musuh menjadi pertaruhan yang sangat berbahaya."
 rocket_rails: "Rel Peluncur Roket"
 rocket_rails_desc: "Proyektil tanpa kendali yang dipasang di bawah sayap. Karena ditembakkan ke arah depan pesawat penyerang, jauh lebih mudah bagi pilot untuk mengarahkannya ke target dibandingkan menjatuhkan bom."
 bomb_sights_1: "Pembidik Bom I"
 bomb_sights_1_desc: "Komputer mekanis kompleks yang memperhitungkan hembusan angin, kecepatan terminal, dan ketinggian, memungkinkan juru bom menjatuhkan bom dengan tingkat akurasi tinggi."
 bomb_sights_2: "Pembidik Bom II"
 bomb_sights_2_desc: "Bila pembidik bom generasi sebelumnya membutuhkan proses penyetelan yang memakan waktu sebelum menghasilkan solusi penargetan, pembidik bom terstabilisasi penuh ini hanya membutuhkan beberapa detik dan bahkan dapat mengompensasi manuver tukik landai."
 radio_navigation_1: "Navigasi Radio I"
 radio_navigation_1_desc: "Penerima radio yang mendeteksi perpotongan dua berkas navigasi radio sederhana, memungkinkan menemukan sasaran bahkan dalam kegelapan total."
 radio_navigation_2: "Navigasi Radio II"
 radio_navigation_2_desc: "Penerima radio yang juga menyertakan alat pengukur jarak, memberi tahu juru bom saat yang tepat bom harus dilepaskan, bahkan jika target tidak terlihat secara visual."
 air_ground_radar_1: "Radar Udara-ke-Darat I"
 air_ground_radar_1_desc: "Perangkat radar airborne yang memberikan navigator gambaran akurat tentang permukaan bumi di bawah pesawat, memungkinkan navigasi presisi bahkan dalam kegelapan atau cuaca buruk."
 air_ground_radar_2: "Radar Udara-ke-Darat II"
 air_ground_radar_2_desc: "Dengan resolusi lebih tinggi dari model sebelumnya, perangkat radar ini memungkinkan pemboman presisi bahkan menembus tutupan awan tebal."
 air_air_radar_1: "Radar Udara-ke-Udara I"
 air_air_radar_1_desc: "Serangkaian antena radar pada pesawat memungkinkan operator terlatih menemukan sasaran udara bahkan dalam kegelapan malam."
 air_air_radar_2: "Radar Udara-ke-Udara II"
 air_air_radar_2_desc: "Dengan pemancar yang lebih bertenaga, radar ini dapat mendeteksi sasaran pada jarak yang lebih jauh."
 non_strategic_materials_small: "Penggunaan Material Non-Strategis"
 non_strategic_materials_small_desc: "Dengan mengganti aluminium dengan kayu atau kain olahan khusus sebisa mungkin, kita dapat mengurangi penggunaan material strategis secara drastis. Namun, kayu dan kain kurang tahan terhadap senjata modern."
 drop_tanks: "Tangki Bahan Bakar Lepas"
 drop_tanks_desc: "Tangki kecil sekali pakai yang menampung bahan bakar ekstra memberi pesawat tempur jarak jangkau tambahan saat menjalankan misi ofensif. Karena dilepaskan sebelum bertempur, tangki ini tidak menghambat kinerja tempur."
 dive_brakes_small: "Rem Tukik"
 dive_brakes_small_desc: "Rangkaian spoiler di sepanjang tepi belakang sayap terbuka saat pesawat menukik, mengurangi kecepatan keseluruhan dan memungkinkan pesawat keluar dari manuver tukik tajam tanpa merusak sayap. Ini memungkinkan serangan dari sudut tukik hampir vertikal, meningkatkan akurasi secara drastis."
 non_strategic_materials_medium: "$non_strategic_materials_small$"
 non_strategic_materials_medium_desc: "$non_strategic_materials_small_desc$"
 non_strategic_materials_large: "$non_strategic_materials_small$"
 non_strategic_materials_large_desc: "$non_strategic_materials_small_desc$"
 floats: "Pelampung"
 floats_desc: "Perangkat pelampung yang dipasang di bawah badan pesawat memungkinkan pesawat mendarat di air. Hal ini memudahkan misi pengintaian armada laut musuh, namun secara drastis menurunkan kelincahan manuver."
 flying_boat_medium: "Pesawat Amfibi (Flying Boat)"
 flying_boat_medium_desc: "Alih-alih roda pendarat konvensional, bagian bawah pesawat dibentuk menyerupai lambung kapal agar dapat mendarat di atas air. Hal ini membuat misi pengintaian maritim jauh lebih mudah."
 flying_boat_large: "$flying_boat_medium$"
 flying_boat_large_desc: "$flying_boat_medium_desc$"
 guided_anti_ship_missile: "Rudal Anti-Kapal Terpandu"
 guided_anti_ship_missile_desc: "Pada dasarnya merupakan bom anti-kapal dengan mesin roket dan pemandu radio, senjata perang baru ini menjadi ancaman serius bagi semua kapal yang berlayar."
 bouncing_bomb_release: "Mekanisme Pelepasan Bom Memantul"
 bouncing_bomb_release_desc: "Rak bom untuk membawa dan melepaskan bom pantul khusus yang meluncur di atas permukaan air hingga menabrak sasaran. Mekanisme ini memutar bom ke belakang saat dilepaskan, meningkatkan kemungkinan bom mencapai target struktural yang diinginkan."
 earthshaker_bomb_release: "Mekanisme Pelepasan Bom Earthshaker"
 earthshaker_bomb_release_desc: "Rak dan mekanisme pelepasan untuk bom raksasa 'earthshaker' yang dirancang untuk menembus tanah saat menghantam dan meledak di bawah tanah, menimbulkan kerusakan struktural masif pada sasarannya."
 rocket_propelled_bombs: "Bom Bertenaga Roket"
 rocket_propelled_bombs_desc: "Bom tanpa kendali yang didorong roket mampu menimbulkan kerusakan parah pada kapal perang dan target besar berlapis baja serupa."
 improved_rocket_propelled_bombs: "Bom Bertenaga Roket Berat"
 improved_rocket_propelled_bombs_desc: "Bom roket tanpa kendali yang lebih besar dengan muatan peledak lebih berat, mampu menembus sasaran dengan efektivitas lebih tinggi."
 fixed_explosive_charge: "Muatan Bahan Peledak Tetap"
 fixed_explosive_charge_desc: "Muatan bahan peledak terarah tetap mengubah pesawat menjadi bom terbang. Jika pesawat diarahkan menabrak kapal musuh, ini akan menyebabkan kehancuran dahsyat, namun mengorbankan pesawat dan awaknya sekaligus."
 recon_camera: "Kamera Pengintai"
 recon_camera_desc: "Kamera dengan lensa khusus memungkinkan pesawat mengambil foto akurat mengenai formasi dan instalasi musuh bahkan dari ketinggian jelajah yang sangat tinggi."
 airdropped_mines: "Ranjau Laut Udara"
 airdropped_mines_desc: "Ranjau laut yang dilengkapi parasut, memungkinkannya ditebarkan dari udara oleh pesawat."
 demining_coil: "Kumparan Penyapu Ranjau"
 demining_coil_desc: "Kumparan besar yang dipasang pada badan pesawat memungkinkan memproyeksikan medan magnet yang kuat, memicu ranjau magnetik di jalur penerbangannya meledak secara aman."
 small_plane_airframe_0: "Badan Pesawat Kecil Antar-Perang"
 small_plane_airframe_0_desc: "Sejak masa-masa awal Perang Besar, dunia penerbangan telah maju pesat. Rangka pesawat ini merupakan kulminasi dari perkembangan tersebut, namun potensi pengembangannya sangat terbatas."
 small_plane_airframe_1: "Badan Pesawat Kecil Dasar"
 small_plane_airframe_1_desc: "Dalam beberapa tahun terakhir, sejumlah teknologi baru bermunculan, memungkinkan pembuatan pesawat kecil yang sangat kapabel. Rangka pesawat ini mewakili langkah pertama di jalan tersebut."
 small_plane_airframe_2: "Badan Pesawat Kecil Ditingkatkan"
 small_plane_airframe_2_desc: "Dengan aerodinamika yang lebih baik dan konstruksi yang lebih kokoh, rangka pesawat ini merupakan langkah maju yang nyata dibandingkan model dasar."
 small_plane_airframe_3: "Badan Pesawat Kecil Mutakhir"
 small_plane_airframe_3_desc: "Dioptimalkan sepenuhnya untuk performa tinggi, rangka pesawat ini mewakili pencapaian maksimal yang dapat dilakukan dengan pesawat bertenaga mesin piston."
 small_plane_airframe_4: "Badan Pesawat Kecil Modern"
 small_plane_airframe_4_desc: "Rangka pesawat ini dirancang untuk memanfaatkan kecepatan tinggi dari mesin jet modern dan mengatasi masalah struktural akibat terbang pada kecepatan mendekati kecepatan suara (subsonik tinggi)."
 small_plane_airframe_5: "Badan Pesawat Kecil Supersonik"
 small_plane_airframe_5_desc: "Rangka pesawat canggih yang mampu melakukan penerbangan supersonik Mach 1 ini mewakili puncak rekayasa teknik manusia."
