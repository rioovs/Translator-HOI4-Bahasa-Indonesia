 AIR_TITLE_MOTHERSHIP: "Pesawat Induk (Mothership)"
 AIR_TITLE_MOTHERSHIP_DESC: "Pesawat induk adalah pesawat berbadan besar yang dirancang untuk membawa dan mengerahkan pesawat yang lebih kecil ke dalam pertempuran, secara signifikan memperluas jarak jangkau operasional mereka melampaui apa yang dapat dicapai oleh masing-masing pesawat tempur secara mandiri."
