 early_bombs: "Bom"
 early_bombs_desc: "Sejak masa-masa awal Perang Besar, pesawat terbang semakin sering digunakan untuk menjatuhkan bahan peledak ke sasaran musuh. Seiring waktu, hal ini berkembang menjadi aspek fundamental dari peperangan udara."
 heavy_bombs: "Bom Berat"
 heavy_bombs_desc: "Peperangan Modern menuntut pesawat untuk semakin sering menggunakan bom yang lebih besar terhadap sasaran musuh. Seiring waktu, ini telah berkembang menjadi aspek mendasar dari perang udara."
 armor_piercing_bombs: "Bom Penembus Baja"
 armor_piercing_bombs_desc: "Kapal perang terus meningkatkan ketebalan lapis baja geladak mereka. Untuk mengatasinya, bom khusus harus dikembangkan untuk menembus lapis baja tersebut."
 air_torpedoe_1: "Torpedo Luncur Udara"
 air_torpedoe_1_desc: "Torpedo berbobot ringan dapat dibawa oleh pesawat yang mumpuni untuk memperluas kemampuan kita menyerang di lautan."
 air_torpedoe_2: "Torpedo Luncur Udara Ditingkatkan"
 air_torpedoe_2_desc: "Dudukan standar dan peringkat bobot memungkinkan pengembangan torpedo yang lebih besar dan bertenaga serta meningkatkan kegunaan umumnya."
 air_torpedoe_3: "Torpedo Luncur Udara Mutakhir"
 air_torpedoe_3_desc: "Pengembangan dudukan ringan yang dirancang untuk lepas saat memasuki air memberi torpedo udara akurasi yang jauh lebih besar serta meningkatkan keselamatan pesawat saat menjatuhkannya."
 photo_reconnaisance: "Pengintaian Foto"
 photo_reconnaisance_desc: "Tujuan militer nyata pertama dari pesawat terbang adalah menemukan musuh dan melaporkan posisi mereka kepada para Jenderal di darat. Ini tetap menjadi salah satu tugas paling umum dari penerbangan militer."
 aa_lmg: "Senapan Mesin Ringan"
 aa_lmg_desc: "Senapan mesin kaliber senapan telah menjadi andalan persenjataan duel udara sejak masa-masa Perang Besar."
 survivability_studies: "Kajian Kelangsungan Hidup"
 survivability_studies_desc: "Dengan menganalisis secara cermat kerusakan akibat pertempuran pada pesawat yang berhasil kembali, kita dapat secara akurat menentukan bagian pesawat mana yang benar-benar vital."
 aircraft_construction: "Konstruksi Pesawat"
 aircraft_construction_desc: "Kita telah menempuh perjalanan panjang sejak zaman kayu lapis dan kain dalam pembuatan pesawat. Teknologi baru memungkinkan terciptanya pesawat yang lebih cocok untuk peran tertentu."
 aa_hmg: "Senapan Mesin Berat"
 aa_hmg_desc: "Pesawat modern mampu menahan kerusakan yang jauh lebih besar daripada model lama, sekaligus memberikan lebih sedikit kesempatan untuk menembak telak. Setiap tembakan harus menimbulkan kerusakan maksimal, membutuhkan kaliber yang lebih besar."
 aa_cannon_1: "Meriam I"
 aa_cannon_1_desc: "Peluru meriam dapat menembus bahkan pesawat paling tangguh sekalipun, sembari membawa cukup banyak bahan peledak untuk melumpuhkan saat mengenainya."
 aa_cannon_2: "Meriam Kaliber Besar"
 aa_cannon_2_desc: "Dengan kaliber lebih tinggi dan proyektil lebih besar, meriam ini dapat menjatuhkan bahkan pesawat bertubuh besar dalam satu tembakan langsung."
 aa_cannon_3: "Meriam II"
 aa_cannon_3_desc: "Dengan meriam modern yang menembakkan proyektil besar pada kecepatan tinggi, kita dapat merontokkan bahkan pesawat terkuat musuh."
 engines_1: "Mesin I"
 engines_1_desc: "Mesin pesawat harus bertenaga, tetapi ringan dan andal. Tipe mesin ini menyediakan daya yang cukup untuk menerbangkan pesawat, tetapi agak membatasinya dari mencapai potensi penuhnya."
 engines_2: "Mesin II"
 engines_2_desc: "Pesatnya perkembangan bobot pesawat membutuhkan peningkatan tenaga mesin yang sepadan."
 engines_3: "Mesin III"
 engines_3_desc: "$engine_3_1x_desc$"
 engines_4: "Mesin IV"
 engines_4_desc: "$engine_4_1x_desc$"
 range_improvements: "Peningkatan Jangkauan"
 range_improvements_desc: "Meskipun tampak jelas bahwa menambah kapasitas bahan bakar akan meningkatkan jarak jangkau pesawat, menambahkan kapasitas tersebut tanpa terlalu memengaruhi performa terbang bukanlah hal yang sepele."
 sp_centrifugal_jet_tech: "Jet Sentrifugal"
 sp_centrifugal_jet_tech_desc: "Mesin jet sentrifugal menggunakan kompresor satu tahap untuk memampatkan udara masuk, sebelum menyemburkannya untuk menciptakan daya dorong. Hal ini menghasilkan mesin yang lebih kecil dan lebih mudah dirawat."
 jet_engine_axial_1x: "1x Mesin Jet Aksial"
 jet_engine_axial_1x_desc: "Dengan memasang beberapa kompresor secara berurutan satu demi satu, Mesin Aksial mampu melipatgandakan jumlah daya dorong yang dihasilkan dibandingkan mesin jet satu tahap sederhana."
