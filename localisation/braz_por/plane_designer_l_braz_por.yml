 large_plane_airframe_0: "Badan Pesawat Besar Antar-Perang"
 large_plane_airframe_0_desc: "Badan pesawat yang sangat besar ini memiliki banyak ruang untuk membawa bom atau tangki bahan bakar. Namun, jelas bahwa potensi pengembangannya sangat terbatas. Generasi baru pengebom strategis sudah di depan mata."
 large_plane_airframe_1: "Badan Pesawat Besar Dasar"
 large_plane_airframe_1_desc: "Rangka pesawat ini dirancang untuk menguji potensi pengebom strategis sejati, yang mampu menyerang sasaran industri jauh di pedalaman wilayah musuh dan membawa awaknya pulang dengan selamat."
 large_plane_airframe_2: "Badan Pesawat Besar Ditingkatkan"
 large_plane_airframe_2_desc: "Dengan konsep pengebom strategis yang kini terbukti ampuh, rangka pesawat ini dirancang untuk meningkatkan muatan bom dan jangkauan, sembari memiliki potensi pengembangan yang cukup untuk masa depan."
 large_plane_airframe_3: "Badan Pesawat Besar Mutakhir"
 large_plane_airframe_3_desc: "Dioptimalkan untuk penerbangan jarak sangat jauh pada ketinggian sangat tinggi, badan pesawat ini mampu membawa muatan bom besar jauh ke jantung wilayah musuh."
 large_plane_airframe_4: "Badan Pesawat Besar Modern"
 large_plane_airframe_4_desc: "Propulsi jet menawarkan lompatan kinerja luar biasa. Rangka pesawat ini dirancang untuk memanfaatkan potensi tersebut sepenuhnya."
 large_plane_maritime_patrol_plane_airframe_0: "Pesawat Patroli Maritim Antar-Perang"
 large_plane_maritime_patrol_plane_airframe_0_desc: "Armada membutuhkan pesawat jarak jauh untuk menemukan musuh jauh dari pantai. Meskipun agak ketinggalan zaman, rangka pesawat ini menawarkan jangkauan yang diperlukan untuk menjelajahi bentangan samudra yang luas."
 large_plane_maritime_patrol_plane_airframe_1: "Pesawat Patroli Maritim Dasar"
 large_plane_maritime_patrol_plane_airframe_1_desc: "Munculnya pesawat kapal induk yang lebih bertenaga menuntut kemampuan mendeteksi dan menghancurkan armada musuh jauh dari garis pantai. Langkah pertama adalah mendeteksi mereka jauh di lautan lepas, yang membutuhkan tipe pesawat baru."
 large_plane_maritime_patrol_plane_airframe_2: "Pesawat Patroli Maritim Ditingkatkan"
 large_plane_maritime_patrol_plane_airframe_2_desc: "Ancaman ganda dari kapal selam dan kapal penjelajah penyerbu menuntut patroli di bentangan samudra yang luas. Rangka pesawat ini dioptimalkan untuk tugas ini."
 large_plane_maritime_patrol_plane_airframe_3: "Pesawat Patroli Maritim Mutakhir"
 large_plane_maritime_patrol_plane_airframe_3_desc: "Radar dan sensor lainnya memungkinkan menemukan armada musuh bahkan dalam cuaca buruk atau malam hari yang gelap, namun seluruh perlengkapan baru tersebut memerlukan badan pesawat yang lebih besar untuk membawanya."
 large_plane_maritime_patrol_plane_airframe_4: "Badan Pesawat Patroli Maritim Modern"
 large_plane_maritime_patrol_plane_airframe_4_desc: "Dengan fajar era peluru kendali, pesawat patroli maritim harus mampu beroperasi lebih jauh lagi dari pantai, dan dalam durasi patroli yang lebih lama."
 cv_small_plane_airframe_0: "Badan Pesawat Kapal Induk Antar-Perang"
 cv_small_plane_airframe_0_desc: "Dilengkapi dengan pengait penahan (arresting hook) dan roda pendarat yang diperkuat, badan pesawat ini mampu beroperasi dari kapal induk."
 cv_small_plane_airframe_1: "Badan Pesawat Kapal Induk Dasar"
 cv_small_plane_airframe_1_desc: "Menggabungkan teknologi baru yang dikembangkan untuk pesawat berbasis darat, rangka pesawat ini sama mampunya, tetapi dapat diluncurkan dari geladak kapal induk."
 cv_small_plane_airframe_2: "Badan Pesawat Kapal Induk Ditingkatkan"
 cv_small_plane_airframe_2_desc: "Untuk mengimbangi perkembangan penerbangan berbasis darat, badan pesawat ini dirancang dengan teknologi baru untuk meningkatkan jarak jangkau dan performa."
 cv_small_plane_airframe_3: "Badan Pesawat Kapal Induk Mutakhir"
 cv_small_plane_airframe_3_desc: "Karakteristik operasi kapal induk yang ketat membatasi seberapa besar dan kapabel badan pesawat. Rangka pesawat ini mewakili performa maksimum mutlak yang dapat dicapai dengan pesawat bertenaga konvensional."
 cv_small_plane_airframe_4: "Badan Pesawat Kapal Induk Modern"
 cv_small_plane_airframe_4_desc: "Rangka pesawat ini dirancang untuk memanfaatkan peningkatan daya dorong mesin jet dan menerapkannya dalam penerbangan angkatan laut."
