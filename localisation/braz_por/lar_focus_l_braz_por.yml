l_braz_por:
 autonomous_state: "Negara Otonom"
 semi_autonomous_state: "Negara Semi-Otonomi"
 SPA_a_great_spain: "Spanyol yang Hebat"
 SPA_a_great_spain_desc: "Republik Kedua yang masih muda telah gagal dalam tugasnya melindungi agama, keluarga, dan harta benda. Ketika kaum Kiri mengepung peradaban Kristen kita, Confederación Española de Derechas Autónomas akan membelanya dan memberikan Spanyol persatuan sejati dan semangat baru. Parlemen akan menuruti keinginan rakyat, atau kita akan menghilangkannya."
 SPA_hand_over_the_ceda_campaign_chest: "Serahkan Peti Kampanye CEDA"
 SPA_hand_over_the_ceda_campaign_chest_desc: "Kami memiliki sisa dana yang cukup setelah kampanye pemilu kami. Jika Parlemen menolak suara kami, kami harus bersiap untuk menghilangkannya. Kami akan menyerahkan peti kampanye Confederación Española de Derechas Autónomas kepada bagian militer yang tercerahkan, sehingga mereka dapat mempersiapkan pemberontakan melawan kaum Kiri."
 SPA_negotiate_carlist_support: "Negosiasikan Dukungan Carlist"
 SPA_negotiate_carlist_support_desc: "Perjuangan kita mempunyai sekutu yang perlu kita jangkau. Sentimen anti-ulama dari kelompok Kiri telah membuat marah kaum Carlist, yang telah lama mempersiapkan konfrontasi dengan Republik. Jika kami mendapat dukungan mereka, pemberontakan kami akan semakin kuat."
 SPA_negotiate_carlist_support_tt: "Setelah dimulainya perang saudara, dapatkan 5 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPA_negotiate_carlist_support_tt_2: "§RUnit-unit ini akan disingkirkan setelah berakhirnya Perang Saudara jika Spanyol belum menjadi Carlist!§!"
 SPA_the_army_of_africa: "Tentara Afrika"
 SPA_the_army_of_africa_desc: "Kunci kemenangan dalam perjuangan mendatang adalah Tentara Afrika yang berpengalaman. Kita harus memastikan kesetiaan mereka terhadap perjuangan kita, menyusun rencana untuk pendudukan kilat di Afrika Utara, dan kemudian mempersiapkan pemindahan pasukan yang tangguh dalam pertempuran ini ke daratan di mana mereka dapat memberikan keseimbangan demi keuntungan kita."
 SPA_the_army_of_africa_tt: "Setelah dimulainya perang saudara, dapatkan 5 unit terlatih dengan §Y7 infanteri§! dan §Y2 artileri§! batalyon dan §YRecon§! dan §YEngineer§! Dukungan, serta jaminan kendali atas §Y[290.GetName]§!."
 SPA_secure_the_northern_garrisons: "Amankan Garnisun Utara"
 SPA_secure_the_northern_garrisons_desc: "Dengan menggunakan 'dorongan' yang tepat, kita akan mendapatkan dukungan dari komandan garnisun di Utara. Dengan pemberontakan yang dilakukan pada saat yang bersamaan, hal ini akan memberi kita basis kekuatan yang kuat untuk melancarkan perang melawan kaum Kiri, jika upaya kudeta awal kita gagal."
 SPA_secure_the_northern_garrisons_tt: "Meningkatkan §YKontrol Garnisun§! menjadi §GTotal§! di §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§!, dan §Y[172.GetName]§!.\n\nKaum Nasionalis akan memulai perang saudara menguasai provinsi-provinsi ini selama §YPengendalian Garnisun§! di dalamnya paling sedikit §OLemah§!."
 SPA_sin_paquito: "Dosa Paquito"
 SPA_sin_paquito_desc: "Pemerintah, karena takut akan potensi ketidaksetiaannya, telah mengirim Francisco Franco untuk memimpin pasukan di Canarias. Namun, meskipun kami mengundangnya, dia juga tidak menjanjikan dukungannya kepada kami, dan hanya menunda kami karena keragu-raguannya. Jika Miss Canary Islands 1936 tidak memutuskan untuk bergabung dengan kami, maka kami akan melanjutkan tanpa dia."
 SPA_con_paquito: "Dengan Paquito"
 SPA_con_paquito_desc: "Perjuangan kita membutuhkan pemimpin yang kuat, dan Francisco Franco memerintahkan kesetiaan Tentara Afrika yang dibanggakan. Agar pemberontakan kita berhasil, dan meskipun dia lamban dalam mengambil keputusan, kita harus mendapatkan dukungannya, meskipun hal ini mungkin harus dibayar mahal..."
 SPA_con_paquito_tt: "Setelah dimulainya perang saudara, §YFrancisco Franco§! menjadi Marsekal Lapangan Nasionalis."
 SPR_the_popular_front: "Front Populer"
 SPR_the_popular_front_desc: "Bahaya yang ditimbulkan oleh Fasisme dan takhayul agama terhadap kebebasan pribadi kita adalah hal yang paling penting, dan kita harus membentuk front luas dari partai-partai politik yang bersatu dalam menentang kelompok sayap kanan. Hanya jika kita bersatu kita dapat menghentikan kemajuan mereka dan menyelamatkan republik kita."
 SPR_secure_the_guardia_de_asalto: "Amankan Guardia de Asalto"
 SPR_secure_the_guardia_de_asalto_desc: "Polarisasi masyarakat semakin meningkat dan disertai dengan kekerasan. Kita harus memastikan loyalitas dari Assault Guards, polisi cadangan kita yang terlatih dengan baik. Bantuan ini akan sangat berharga jika kekerasan terus meningkat."
 SPR_secure_the_guardia_de_asalto_tt: "Setelah dimulainya perang saudara, dapatkan 3 unit terlatih dengan batalyon §Y6 infanteri§!. Kaum Nasionalis mendapatkan 6 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!."
 SPR_secure_the_guardia_de_asalto_tt_2: "Setelah dimulainya perang saudara, dapatkan 5 unit terlatih dengan batalyon §Y6 infanteri§!. Kaum Nasionalis memperoleh 10 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!."
 SPR_secure_the_guardia_get_both_types_tt: "§RJika tidak ada fokus yang diambil, maka Nasionalis akan menerima kedua jenis tersebut!§!"
 SPR_secure_the_guardia_civil: "Amankan Guardia Civil"
 SPR_secure_the_guardia_civil_desc: "Unsur-unsur ekstremis terus mengganggu ketertiban umum, dan garda depan dalam memerangi kerusuhan sipil adalah Guardia Civil. Memastikan loyalitas kepolisian nasional harus menjadi prioritas kita jika kita ingin membendung kekerasan dan mempertahankan kendali."
 SPR_secure_the_guardia_civil_tt: "Setelah dimulainya perang saudara, dapatkan 6 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!. Kaum Nasionalis memperoleh 3 unit terlatih dengan §Y6 batalyon infanteri§!."
 SPR_secure_the_guardia_civil_tt_2: "Setelah dimulainya perang saudara, dapatkan 10 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!. Kaum Nasionalis mendapatkan 5 unit terlatih dengan §Y6 batalyon infanteri§!."
 SPR_train_the_union_youth: "Latih Persatuan Pemuda"
 SPR_train_the_union_youth_desc: "Gemuruh ketidaksetiaan datang dari pihak militer, dan kita harus bersiap menghadapi kemungkinan terburuk. Kami akan memberikan kursus kilat dalam penggunaan senjata dan taktik dasar militer kepada pendukung muda kami yang berdedikasi dan berkomitmen, sehingga mereka dapat dipersenjatai jika terjadi hal terburuk."
 SPR_train_the_union_youth_tt: "Setelah dimulainya perang saudara, dapatkan 5 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPR_enlarge_the_weapon_caches: "Perbesar Cache Senjata"
 SPR_enlarge_the_weapon_caches_desc: "Bahkan sejak sebelum Pemogokan Penambang Asturias tahun 1934, gudang senjata telah dibuat secara diam-diam di seluruh negeri, sebagai persiapan menghadapi kebutuhan yang tak terelakkan untuk mempertahankan kebebasan kita dengan senjata militer. Di masa krisis ini, kita sebaiknya memperluasnya lebih jauh."
 SPR_enlarge_the_weapon_caches_tt: "Setelah dimulainya perang saudara, pertahankan §Y80%§! peralatan, bukan §Y50%§!."
 SPR_distribute_arms_to_the_people: "Bagikan Senjata kepada Rakyat"
 SPR_distribute_arms_to_the_people_desc: "Ketidaksetiaan di kalangan militer kini sudah pasti terjadi, dan jelas kita tidak bisa mengandalkan mereka untuk mempertahankan nilai-nilai Republik. Kita harus mulai menyebarkan senjata kepada mereka yang mempunyai kepentingan terbaik bagi Republik, sehingga mereka dapat membentuk pertahanan pertama terhadap kemungkinan pemberontakan."
 SPR_distribute_arms_to_the_people_tt: "Setelah dimulainya perang saudara, dapatkan 10 unit tak terlatih dengan §Y3 batalyon infanteri§!."
 SPR_disband_the_army: "Bubarkan Angkatan Darat"
 SPR_disband_the_army_desc: "Kita tidak bisa lagi mengabaikan tanda-tanda ketidaksetiaan di kalangan militer. Bahkan jika hal ini dapat memicu para komplotan untuk mengambil tindakan, kita tidak punya pilihan selain berusaha membubarkan tentara dengan segera, dan mengambil inisiatif."
 SPR_disband_the_army_tt: "§GMengurangi proporsi tentara yang akan memihak faksi Nasionalis pada awal perang saudara dari §Y50%§! menjadi §Y20%§!, dan mengurangi jumlah divisi Angkatan Darat Afrika dari §Y5§! menjadi §Y3§!.§!\nLoyalis §Y80%§! porsinya §Rdibubarkan§!, namun peralatannya dikembalikan ke timbunan.\n\nJika fokus ini tidak diambil, pemerintah akan membubarkan diri secara reaktif tentara pada awal perang saudara, tanpa keuntungan tambahan.\n\n§RSisa-sisa tentara yang tidak loyal akan segera memicu dimulainya perang saudara!§!"
 SPA_the_phalanx_ascendant: "Pewaris Phalanx"
 SPA_the_phalanx_ascendant_desc: "Kebangkitan Falange sekarang. Republik yang sudah tidak berfungsi ini sedang berada di ambang kehancuran, dan meskipun perjuangannya akan panjang dan sulit, kami telah mengambil langkah pertama menuju kelahiran kembali Kekaisaran Spanyol."
 SPA_bolster_offensive_infrastructure: "Memperkuat Infrastruktur Serangan"
 SPA_bolster_offensive_infrastructure_desc: "Hambatan terbesar dalam perencanaan ofensif kami adalah ketidakmampuan kami menyediakan pasokan yang cukup untuk unit-unit garis depan. Dengan fokus pada peningkatan infrastruktur di sektor-sektor ini, operasi ofensif kita harus diperkuat secara signifikan."
 SPA_bolster_offensive_infrastructure_tt: "Membutuhkan Perang Saudara Spanyol.\nTambahkan §Y1 Infrastruktur§! ke 3 negara bagian garis depan acak."
 SPA_the_fifth_column: "Kolom Kelima"
 SPA_the_fifth_column_desc: "Seperti kata-kata Emilio Mola: \"Saat empat kolom saya mendekati Madrid, kolom pendukung kelima akan muncul dari dalam kota dan melemahkan pertahanan Partai Republik dari dalam\". Kami akan mengatur 'Kolom Kelima' ini di semua kota yang kami dekati, sehingga memberikan kami keuntungan yang menentukan."
 SPA_the_fifth_column_tt: "Membuka §YAktifkan Kolumnis Kelima§! Keputusan, memungkinkan terciptanya pemberontakan kecil di wilayah musuh."
 SPA_emergency_munitions_corporations: "Perusahaan Amunisi Darurat"
 SPA_emergency_munitions_corporations_desc: "Upaya perang memerlukan penguatan segera jika kita ingin mempertahankan tingkat pasokan yang cukup bagi pasukan pemberani kita. Kami akan mengorganisir mereka yang tidak ikut berperang ke bengkel-bengkel darurat yang akan menyediakan kebutuhan paling mendasar bagi pasukan kami."
 SPA_the_corpo_truppe_volontarie: "Corpo Truppe Volontarie"
 SPA_the_corpo_truppe_volontarie_desc: "Pendukung kami di [ITA.GetNameDef] telah mengirimkan Corpo Truppe Volontarie untuk membantu kami dalam perjuangan kami, namun jika kami ingin berhasil maka hal itu harus diperluas secara signifikan. Kami akan mengirimkan utusan diplomatik ke [ITA.GetNameDef] untuk memperjuangkan tujuan kami dan mendapatkan bantuan militer lebih lanjut atas nama kami."
 SPA_the_condor_legion: "Legiun Condor"
 SPA_the_condor_legion_desc: "Pendukung kami di [GER.GetNameDef] telah mengirimkan Legiun Condor untuk membantu kami dalam perjuangan kami, namun jika kami ingin berhasil maka pasukan ini harus diperluas secara signifikan. Kami akan mengirimkan utusan diplomatik ke [GER.GetNameDef] untuk memperjuangkan tujuan kami dan mendapatkan bantuan militer lebih lanjut atas nama kami."
 SPA_equipment_shipments: "Pengiriman Peralatan"
 SPA_equipment_shipments_desc: "Pasukan bukanlah satu-satunya hal yang kita butuhkan untuk mengamankan kemenangan kita. Pendukung kami di luar negeri harus dibuat memahami kebutuhan mendesak kami akan peralatan, dan bagaimana mereka dapat membantu kami dalam hal ini."
 SPA_obtain_training_staff: "Dapatkan Staf Pelatihan"
 SPA_obtain_training_staff_desc: "Meskipun hal ini mungkin melukai harga diri kita, kita harus mengakui pengalaman superior yang dimiliki pendukung asing kita dalam seni peperangan. Kita harus mengundang pakar militer mereka ke Spanyol untuk mendidik para perwira kita dan membantu melatih pasukan kita, sehingga memberi kita keunggulan dibandingkan Partai Republik."
 SPA_doctrinal_advancements: "Kemajuan Doktrinal"
 SPA_doctrinal_advancements_desc: "Pendukung asing kami telah mencapai banyak kemajuan dalam pemikiran dan doktrin militer dalam beberapa dekade terakhir. Mungkin kita bisa membujuk mereka untuk berbagi idenya dengan kita, sehingga kita bisa mengujinya dalam perang kita saat ini."
 SPA_secure_the_national_defense_council: "Amankan Dewan Pertahanan Nasional"
 SPA_secure_the_national_defense_council_desc: "Tanpa pemimpin, perjuangan kami dipimpin oleh Junta pemimpin militer dan sipil dengan tujuan yang tidak selaras. Jika kita ingin mewujudkan keinginan kita dan mencapai kelahiran kembali yang layak diterima Spanyol, kita harus mengamankan dominasi atas organisasi yang beragam dan terkadang penuh pertengkaran ini."
 SPA_suspend_the_constitution: "Tangguhkan Konstitusi"
 SPA_suspend_the_constitution_desc: "Kita tidak akan mencapai kemajuan selama kita berpegang pada konstitusi yang telah berulang kali terbukti salah dan lemah. Kita akan menangguhkannya, membuka jalan bagi pemerintahan transisi militer yang dapat membimbing kita melalui pembunuhan saudara yang diperlukan ini, yang pada akhirnya akan membuka jalan bagi pemerintahan baru yang kuat dan otoriter."
 SPA_primo_de_rivera_prisoner_exchange: "Pertukaran Tahanan Primo De Rivera"
 SPA_primo_de_rivera_prisoner_exchange_desc: "Pendiri Falange, José Antonio Primo de Rivera, putra diktator lama Miguel Primo de Rivera, dipenjarakan bahkan sebelum dimulainya perang saudara. Partai Republik telah mengindikasikan kesediaannya untuk melakukan pertukaran tahanan dengan kami, dan jika kami ingin mendapatkan kembali pemimpin ideologis kami, kami harus setuju."
 SPA_eliminate_the_carlists: "Hilangkan Carlist"
 SPA_eliminate_the_carlists_desc: "Visi kami untuk Spanyol tidak sejalan dengan visi Carlist. Berpegang teguh pada dinasti yang sedang sekarat, dengan pemimpin yang lemah dan fanatisme agama, mereka merupakan ancaman bagi masa depan Spanyol sendiri. Kita harus membasmi para pembangkang ini, sehingga para pemimpin yang benar-benar kuat dapat mengambil tindakan dan mempersatukan negara dengan tangan besi."
 SPR_carlist_uprising_flag: "Kaum Carlist telah bangkit."
 SPA_absorb_carlist_remnants: "Menyerap Sisa-sisa Carlist"
 SPA_absorb_carlist_remnants_desc: "Dengan kekalahan Carlisme, elemen faksi yang kurang fanatik mungkin masih berguna di garis depan. Kita tidak boleh membiarkan kesempatan ini berlalu begitu saja - setiap orang yang mampu kita kumpulkan akan memajukan tujuan Falange secara keseluruhan."
 SPA_establish_the_directory: "Buat Direktori"
 SPA_establish_the_directory_desc: "Emilio Mola, arsitek utama pemberontakan, telah memperoleh dukungan yang cukup dari Junta dan para pemimpin politik Falange untuk memulai tahap berikutnya dari rencananya: pembentukan Direktori yang akan mengelola semua aspek perang saudara hingga negara aman."
 SPA_establish_the_directory_tt: "§Y[ROOT.GetName]§! akan dikenal sebagai §YDirektori Spanyol§!"
 SPA_a_one_party_state: "Negara Satu Partai"
 SPA_a_one_party_state_desc: "Demokrasi, bukannya tujuan akhir, seperti yang diyakini oleh Partai Republik, pada kenyataannya hanyalah sebuah sarana untuk merebut kendali penuh atas negara dari pihak yang lemah dan tidak layak. Kami akan menyingkirkan semua partai politik lainnya, sehingga partai-partai yang memiliki visi kuat tidak akan terhambat dalam upaya mereka mencapai Spanyol Raya."
 SPA_a_one_party_state_tt: "Setengah dari gabungan dukungan §Ynon-Fasis§! saat ini diterapkan sebagai penalti §RStabilitas§!:"
 SPA_expand_conscription: "Perluas Wajib Militer"
 SPA_expand_conscription_desc: "Perang saudara membawa dampak buruk bagi negara kita, namun kita tidak bisa mengurangi tekanan terhadap Partai Republik. Dibutuhkan dorongan baru, yang dipicu oleh upaya rekrutmen yang diperbarui."
 SPA_safeguard_the_freedom_of_worship: "Jaga Kebebasan Beribadah"
 SPA_safeguard_the_freedom_of_worship_desc: "Partai Republik mengancam iman kepada Tuhan itu sendiri, dan kita harus menjelaskan kepada semua orang bahwa kita adalah benteng terakhir Kekristenan. Kami akan melindungi hak dan kebebasan beribadah umat Kristiani, dan siapa pun yang ingin bergabung dalam perjuangan kami untuk membela mereka."
 SPA_prepare_the_pyrenees_defenses: "Siapkan Pertahanan Pyrenees"
 SPA_prepare_the_pyrenees_defenses_desc: "Rumor telah sampai kepada kami bahwa Partai Republik telah menghubungi [FRA.GetNameDef] dengan permohonan bantuan mereka. Meskipun kecil kemungkinannya, kita tidak bisa mengambil risiko bahwa hal ini benar dan membiarkan perbatasan utara kita tidak dijaga. Persiapan defensif harus dimulai segera jika ada kemungkinan intervensi [FRA.GetAdjective]."
 SPA_prepare_the_pyrenees_defenses_tt: "Tempatkan level 2 §YBenteng§! di provinsi-provinsi di perbatasan Perancis di §YPaís Vasco§!, §YNavarre§!, §YWestern Aragón§!, §YEastern Aragón§!, dan §YCataluña§!."
 SPA_develop_all_talent: "Kembangkan Semua Bakat"
 SPA_develop_all_talent_desc: "Semua orang yang berhak mendapatkan hak tersebut harus diberikan jaminan akses terhadap pendidikan tinggi, serta pendanaan yang diperlukan untuk mewujudkan gagasan-gagasan yang mungkin menarik bagi negara. Berinvestasi dalam pembangunan fasilitas penelitian dan pengembangan baru tidak diragukan lagi akan memberi kita banyak manfaat di berbagai bidang."
 SPA_regional_agrarian_commissions: "Komisi Agraria Daerah"
 SPA_regional_agrarian_commissions_desc: "Pedesaan telah dirusak oleh perang. Untuk memastikan masyarakat tidak kelaparan, kami akan membentuk komisi pertanian di setiap daerah, yang akan segera berlaku. Hal ini akan memaksimalkan produktivitas lahan subur yang tidak rusak dan memungkinkan kami memberi makan masyarakat."
 SPA_the_national_syndicalist_state: "Negara Sindikalis Nasional"
 SPA_the_national_syndicalist_state_desc: "Perang saudara telah berakhir, dan telah tiba waktunya bagi pemerintahan militer sementara untuk melepaskan kendali dan bagi para pemimpin Falange yang sebenarnya untuk maju dan mengantarkan era baru bagi Spanyol."
 SPA_the_national_syndicalist_state_tt: "§Y[ROOT.GetName]§! akan dikenal sebagai §YKekaisaran Spanyol§!"
 SPA_syndicalize_production: "Sindikalisasi Produksi"
 SPA_syndicalize_production_desc: "Gerakan kami memisahkan diri dari kapitalisme dan komunisme. Sebaliknya, kami akan menciptakan sindikat nasional di mana pekerja dan pengusaha dapat bekerja sama untuk memaksimalkan produktivitas demi kemajuan seluruh Spanyol."
 SPA_strengthen_the_supreme_reality_of_spain: "Memperkuat Realitas Tertinggi Spanyol"
 SPA_strengthen_the_supreme_reality_of_spain_desc: "Sudah terlalu lama separatisme, perbedaan pendapat, dan otonomi daerah melemahkan negara Spanyol. Kami akan menyingkirkan anggapan konyol ini, dan menghadirkan realitas baru bagi Spanyol yang bersatu sehingga semua orang, tidak peduli kelompok atau kelasnya, dapat memahami dan berkontribusi."
 SPR_recovering_from_civil_war_focus_tt: "Membuka keputusan §YPemulihan dari Perang Saudara§!, sehingga memungkinkan negara bagian Spanyol yang dimiliki dikembalikan ke status §YNegara Bagian Inti§! jika negara bagian tersebut memiliki §YKepatuhan§!.\nyang cukup tinggi"
 SPA_glory_and_wealth_on_the_sea_lanes: "Kemuliaan Dan Kekayaan di Jalur Laut"
 SPA_glory_and_wealth_on_the_sea_lanes_desc: "Nasib Spanyol selalu berada di seberang lautan. Kemuliaan dan kekayaan menanti kita, kita perlu memperbarui kendali kita atas jalur laut, seperti yang kita lakukan di masa lalu."
 SPA_improve_domestic_naval_facilities: "Meningkatkan Fasilitas Angkatan Laut Dalam Negeri"
 SPA_improve_domestic_naval_facilities_desc: "Angkatan laut yang hebat membutuhkan infrastruktur yang besar. Galangan kapal dan fasilitas baru diperlukan, dan kita harus memulai pembangunannya sekarang."
 SPA_a_great_maritime_power: "Kekuatan Maritim yang Besar"
 SPA_a_great_maritime_power_desc: "Kekuatan Spanyol pernah ditakuti di seberang lautan. Meskipun kekayaan kita telah berkurang selama berabad-abad, hubungan kita dengan lautan tetap ada. Kami akan merangkul warisan maritim kami dan memperbarui kehadiran kami di perairan dunia."
 SPA_commerce_protection: "Perlindungan Perdagangan"
 SPA_commerce_protection_desc: "Perdagangan global, lebih dari sebelumnya, adalah kunci menuju perekonomian yang sehat. Kemampuan untuk melindungi pelayaran dagang kita sendiri akan memperkuat posisi kita dalam konflik apa pun di masa depan yang mungkin kita hadapi."
 SPA_exemplify_the_art_and_science_of_warfare: "Contohkan Seni Dan Ilmu Peperangan"
 SPA_exemplify_the_art_and_science_of_warfare_desc: "Peperangan adalah ilmu sekaligus seni, dan kita harus memberikan alat dan fasilitas yang diperlukan bagi mereka yang menekuninya untuk mengeksplorasi ide-ide mereka."
 SPA_the_will_to_empire: "Keinginan untuk Kekaisaran"
 SPA_the_will_to_empire_desc: "Kami memiliki tekad untuk membangun Kekaisaran. Kami menegaskan bahwa pemenuhan sejarah Spanyol terletak pada Kekaisaran. Kami mengklaim Spanyol memiliki posisi unggul di Eropa, dan menyatakan bahwa Spanyol akan terus menjadi poros spiritual yang menyatukan dunia Hispanik."
 SPA_unite_iberia: "Satukan Iberia"
 SPA_unite_iberia_desc: "Portugal dan Spanyol pernah bersatu, dan beberapa orang mengatakan mereka harus bersatu lagi. Kami setuju. Penyatuan Iberia akan memperkuat posisi kita di dunia secara signifikan."
 SPA_absorb_the_portuguese_empire: "Serap Kekaisaran Portugis"
 SPA_absorb_the_portuguese_empire_desc: "Sudah saatnya kita tidak hanya menguasai daratan Portugis, tapi juga benar-benar mempersatukan bangsa kita. Salah satu langkahnya adalah integrasi penuh mereka ke dalam wilayah kita, dan langkah kedua adalah penaklukan kerajaan kolonial Portugis, yang juga merupakan bagian dari hegemoni Iberia baru kita, meskipun mereka mungkin belum melihatnya seperti itu. Hal ini mudah diatasi."
 SPA_claim_the_aragonese_possessions: "Klaim Kepemilikan Aragon"
 SPA_claim_the_aragonese_possessions_desc: "Kerajaan Aragon pernah terbentang luas di Mediterania. Spanyol, sebagai kelanjutan sejarah Kerajaan Aragon, berhak mendapatkan wilayah-wilayah ini kembali ke kendalinya. Kami akan menegaskan hal ini dengan benar."
 SPA_reclaim_spanish_africa: "Perluas Afrika Spanyol"
 SPA_reclaim_spanish_africa_desc: "Tidak ada alasan mengapa perbatasan wilayah kita di Afrika Utara harus ditetapkan secara tegas. Dengan kelemahan Perancis saat ini, mungkin tidak ada waktu yang lebih baik untuk mempertaruhkan klaim kita atas wilayah tersebut selain saat ini."
 SPA_reassert_american_dominance: "Tegaskan Kembali Dominasi Amerika"
 SPA_reassert_american_dominance_desc: "Dalam satu abad sejak kemerdekaannya, berbagai negara di Amerika Latin hanya berselisih dan bertengkar satu sama lain. Mereka telah melupakan kekuatan yang ada pada kesatuan budaya kita, maka kita harus mengingatkan mereka bahwa kita adalah poros di mana mereka berputar."
 SPA_reassert_american_dominance_tt: "Membuka keputusan §YMenegaskan kembali Dominasi Amerika§!, memungkinkan penaklukan damai terhadap negara-negara Amerika yang lebih lemah."
 SPA_retake_the_americas: "Rebut kembali benua Amerika"
 SPA_retake_the_americas_desc: "Negara-negara Amerika Latin yang lebih besar tidak mempunyai niat untuk menerima kepemimpinan kita dengan sukarela – kita juga tidak akan mendapatkan kembali harta lama kita dari [USA.GetNameDef] tanpa perlawanan. Meskipun tantangannya besar, realisasi ambisi kekaisaran kita sudah dekat, kalau saja kita bisa mengatasinya."
 SPA_embrace_the_spanish_destiny: "Rangkullah Takdir Spanyol"
 SPA_embrace_the_spanish_destiny_desc: "Spanyol menantikan takdir tunggal: memberikan kebebasan kepada semua warga Spanyol untuk menjadi bagian dari negara yang kuat dan bebas; untuk kembali mengambil posisi unggul di dunia meskipun ada keberatan dari musuh-musuh kita; dan untuk membela cara hidup Kristen."
 SPA_the_national_and_popular_army_of_spain: "Tentara Nasional dan Populer Spanyol"
 SPA_the_national_and_popular_army_of_spain_desc: "Kekuatan militer negara Spanyol yang baru akan diorganisir dalam tentara nasional dan rakyat di mana semua laki-laki berbadan sehat akan mendapat kehormatan untuk didaftarkan."
 SPA_mandatory_pre_military_training: "Pelatihan Pra-Militer Wajib"
 SPA_mandatory_pre_military_training_desc: "Untuk mempersiapkan wajib militer, semua pria harus menerima pelatihan pra-militer wajib."
 SPA_all_shall_serve: "Semua Akan Melayani"
 SPA_all_shall_serve_desc: "Spanyol Baru adalah ekspresi dari keinginan semua orang Spanyol, dan oleh karena itu semua orang harus diizinkan melakukan tugas mereka dalam membela Spanyol. Standar perekrutan harus diperluas."
 SPA_the_army_of_africa_model: "Model \"Tentara Afrika\"."
 SPA_the_army_of_africa_model_desc: "Keberhasilan Tentara Afrika dalam perang saudara tidak luput dari perhatian. Tentara baru kita harus memenuhi standar yang ditetapkan oleh mereka, jadi kita akan mencontoh mereka."
 SPA_equipment_modernization: "Modernisasi Peralatan"
 SPA_equipment_modernization_desc: "Hanya persenjataan terbaik yang bisa digunakan untuk pasukan baru kita, dan kita harus mengembangkan persenjataan baru yang sesuai."
 SPA_artillery_modernization: "Modernisasi Artileri"
 SPA_artillery_modernization_desc: "Artileri adalah bagian penting dari peperangan modern, oleh karena itu kita harus memodernisasi senjata lama kita dengan model yang baru dan lebih kuat."
 SPA_expand_the_air_branch: "Perluas Cabang Udara"
 SPA_expand_the_air_branch_desc: "Perang saudara telah menunjukkan kepada kita dengan jelas betapa pentingnya peran kekuatan udara. Jika kita ingin menjadi kekuatan yang patut diperhitungkan, kita perlu mengembangkan bidang ini."
 SPA_expand_the_special_forces: "Perluas Pasukan Khusus"
 SPA_expand_the_special_forces_desc: "Segelintir spesialis dapat mencapai apa yang tidak dapat dicapai oleh banyak prajurit infanteri biasa. Kami akan memulai pelatihan khusus untuk tugas-tugas tertentu, memastikan kami memiliki alat yang diperlukan jika diperlukan."
 SPA_motorization: "Motorisasi"
 SPA_motorization_desc: "Motorisasi massal suatu angkatan bersenjata membuka berbagai peluang taktis dan strategis baru. Ini adalah keuntungan yang tidak bisa kita lewati."
 SPA_an_armored_corps: "Korps Lapis Baja"
 SPA_an_armored_corps_desc: "Spanyol membutuhkan pasukan lapis baja jika tidak mau kalah dengan tetangganya."
 SPA_join_the_axis: "Bergabunglah dengan Poros"
 SPA_join_the_axis_desc: "Masa depan Spanyol terletak pada penggulingan tatanan dunia yang sudah mapan. Kita harus bersekutu dengan mereka yang mempunyai pemikiran yang sama, sehingga kita dapat menyatukan kekuatan kita dengan kekuatan mereka."
 SPA_fascist_economic_aid: "Bantuan Ekonomi Fasis"
 SPA_fascist_economic_aid_desc: "Perang saudara telah menghancurkan negara kita, namun mungkin sekutu baru kita mungkin bersedia membantu program pembangunan kembali kita."
 SPA_facilitate_pyrenees_freight_transports: "Memfasilitasi Transportasi Barang Pyrenees"
 SPA_facilitate_pyrenees_freight_transports_desc: "Pasokan material baru dari utara harus lebih difasilitasi untuk memenuhi permintaan, oleh karena itu kami akan memperluas jalur kereta api yang melewati Pyrenees."
 SPA_facilitate_pyrenees_freight_transports_tt: "Tambahkan maksimum §YInfrastruktur§! di §YMadrid§!, §YGuadalajara§!, §YEastern Aragón§!, §YCataluña§!, §YBurgos§!, dan §YPaís Vasco§!."
 SPA_improve_cross_country_railways: "Meningkatkan Perkeretaapian Lintas Negara"
 SPA_improve_cross_country_railways_desc: "Perluasan jaringan kereta api nasional kita tidak hanya akan menyediakan lapangan kerja yang sangat dibutuhkan, tetapi juga memfasilitasi pergerakan pasukan, perbekalan, dan menjadi kebanggaan nasional bagi seluruh rakyat Spanyol."
 SPA_support_the_war_industry: "Mendukung Industri Perang"
 SPA_support_the_war_industry_desc: "Sebelum kita dapat memperluas industri perang kita, pertama-tama kita harus memperluas industri tambahan yang menjadi sandaran industri tersebut."
 SPA_italian_shipbuilding_expertise: "Keahlian Pembuatan Kapal Italia"
 SPA_italian_shipbuilding_expertise_desc: "Dengan mengundang para ahli dari Italia, kita seharusnya dapat meningkatkan kemampuan pembuatan kapal kita, sehingga memungkinkan kita untuk memperluas angkatan laut kita dengan lebih mudah, terutama dalam hal kapal-kapal terbesar."
 SPA_the_duty_to_work: "Kewajiban Untuk Bekerja"
 SPA_the_duty_to_work_desc: "Semua orang Spanyol mempunyai kewajiban terhadap negara. Jika tugas tersebut tidak mengharuskan mereka untuk berperang di garis depan, maka mereka harus melakukan apa yang mereka bisa untuk membekali dan memperlengkapi mereka yang berada di garis depan."
 SPA_expand_the_war_industry: "Perluas Industri Perang"
 SPA_expand_the_war_industry_desc: "Sebuah negara yang kuat membutuhkan industri perang yang besar jika ingin menunjukkan kekuatan tersebut – dan negara kita bisa saja menjadi lebih besar."
 SPA_national_recovery: "Pemulihan Nasional"
 SPA_national_recovery_desc: "Saatnya telah tiba untuk melakukan upaya nasional bersama untuk pulih dari kehancuran akibat perang saudara."
 SPA_autarky: "Autarki"
 SPA_autarky_desc: "Agar posisi kita tidak terancam oleh pihak lain, kita harus memastikan perekonomian kita sepenuhnya mampu mencukupi kebutuhan sendiri."
 SPA_spanish_austerity: "Penghematan Spanyol"
 SPA_spanish_austerity_desc: "Meskipun tidak diinginkan, kebijakan penghematan diperlukan untuk membebaskan dana yang kita perlukan untuk pemulihan negara kita."
 SPA_reduce_reliance_on_foreign_resources: "Mengurangi Ketergantungan pada Sumber Daya Asing"
 SPA_reduce_reliance_on_foreign_resources_desc: "Ketergantungan pada orang lain adalah kelemahan yang hanya bisa dimanfaatkan oleh musuh potensial kita. Kita harus mendorong kemandirian dalam sumber daya apa pun yang kita bisa."
 SPA_reduce_reliance_on_foreign_resources_tt: "Membuka keputusan §YProspek Sumber Daya§! yang unik, memungkinkan perluasan simpanan sumber daya daratan baru yang sudah ada dan pengembangan."
 SPA_expand_the_axis_gold_trade: "Perluas Perdagangan Emas Poros"
 SPA_expand_the_axis_gold_trade_desc: "Kekuatan Poros sangat membutuhkan perdagangan, dan mereka mengalami kesulitan akibat blokade Sekutu. Emas mereka mengalir ke negara kita, yang melaluinya mereka dapat memperoleh sumber daya alam baik dari negara kita maupun negara netral lainnya. Kami mendapatkan keuntungan besar dari hal ini, dan mungkin kami harus mendorongnya lebih jauh lagi..."
 SPA_ensure_agricultural_self_sufficiency: "Menjamin Swasembada Pertanian"
 SPA_ensure_agricultural_self_sufficiency_desc: "Kita harus membebaskan diri dari impor pangan dari luar negeri – pertanian kita harus diperluas hingga dapat memberi makan seluruh bangsa."
 SPA_unify_the_nationalist_front: "Satukan Front Nasionalis"
 SPA_unify_the_nationalist_front_desc: "Pemberontak, atau \"Nasionalis\" sebagaimana mereka mulai menyebut diri mereka sendiri, adalah sekelompok kelompok yang bersatu hanya dalam keinginan mereka untuk menggulingkan Republik. Jalan menuju sukses terletak pada menghindari pertikaian dan fokus pada perjuangan melawan musuh bersama"
 SPA_save_the_alcazar: "Selamatkan Alcazar!"
 SPA_save_the_alcazar_desc: "Alcázar di Toledo masih dikuasai oleh pasukan yang setia pada tujuan kita, namun mereka dikepung! Membebaskan mereka, meskipun tidak penting secara strategis, akan menjadi kemenangan propaganda yang besar, dan memperkuat posisi Francisco Franco sebagai pemimpin de facto junta militer."
 SPA_martyrdom_for_primo_de_rivera: "Kemartiran untuk Primo De Rivera"
 SPA_martyrdom_for_primo_de_rivera_desc: "José Antonio Primo de Rivera, pendiri partai Falange, telah dipenjara sejak sebelum dimulainya perang saudara. Meskipun kami telah ditawari pertukaran tahanan, mungkin saingan politik potensial ini akan lebih membantu perjuangan kami sebagai seorang martir yang dieksekusi... Kami akan memastikan negosiasi pertukaran tahanan 'gagal'."
 SPA_caudillo_of_spain: "Caudillo dari Spanyol"
 SPA_caudillo_of_spain_desc: "Prestasi Francisco Franco telah membuktikan dirinya, dan calon pesaingnya menemui ajalnya sebelum waktunya. Dukungan di kalangan junta kian meningkat untuk menunjuk dia sebagai pemimpin resmi kami, dan yang tersisa hanyalah membuat deklarasi resmi."
 SPA_extol_the_martyrs_of_the_war: "Pujilah Para Martir Perang"
 SPA_extol_the_martyrs_of_the_war_desc: "Mereka yang telah menyerahkan nyawanya demi tujuan kita harus dikenang dan dihormati atas pengorbanan mereka. Tindakan mereka patut menjadi contoh bagi kita semua."
 SPA_consolidate_the_north: "Konsolidasikan Utara"
 SPA_consolidate_the_north_desc: "Langkah pertama menuju kemenangan adalah penaklukan dan konsolidasi wilayah utara. Setelah hal ini selesai, kita dapat beralih ke area rentan lainnya di lini depan Partai Republik."
 SPA_foment_a_carlist_split: "Mendorong Perpecahan Carlist"
 SPA_foment_a_carlist_split_desc: "Kalangan Carlist secara internal terpecah seperti halnya Front Nasionalis itu sendiri. Dengan mengadu domba berbagai pemimpin Carlist, kita dapat melemahkan kekuatan mereka, membuka jalan bagi kita untuk membuat kesepakatan terpisah dengan kelompok Carlist yang berbeda."
 SPA_a_methodical_approach: "Pendekatan Metodis"
 SPA_a_methodical_approach_desc: "Kunci keberhasilan dalam perang saudara ini tidak terletak pada manuver yang berani dan serangan yang sembrono, namun pada perencanaan yang cermat dan metodis serta serangan yang disengaja dan tepat."
 SPA_tackle_the_vulnerable_fronts: "Atasi Front yang Rentan"
 SPA_tackle_the_vulnerable_fronts_desc: "Kerentanan telah diamati di beberapa bagian garis depan musuh. Kita harus fokus pada area ini untuk memaksimalkan efek serangan kita."
 SPA_tackle_the_vulnerable_fronts_tt: "Meningkatkan keputusan §YSerangan Perang Saudara§! dengan memberikan bonus tempur sementara melawan musuh pada awal serangan."
 SPA_integrate_the_requetes: "Integrasikan Requetés"
 SPA_integrate_the_requetes_desc: "Carlist Requetés yang lebih menerima cara berpikir kita harus diintegrasikan lebih erat ke dalam angkatan bersenjata kita. Pengalaman dan pelatihan mereka akan sangat berharga dalam perjuangan ke depan."
 SPA_portuguese_aid: "Bantuan Portugis"
 SPA_portuguese_aid_desc: "Kita harus menerima bantuan dari mana pun bantuan itu datang. Portugal, yang menampung banyak pemimpin kita yang terpaksa mengungsi setelah pemberontakan yang gagal pada tahun 1932, mungkin bersedia memberikan bantuan materi jika kita memintanya, dan hal ini mungkin menjadi dasar bagi kolaborasi yang lebih erat di masa depan."
 SPA_the_iberian_pact: "Pakta Iberia"
 SPA_the_iberian_pact_desc: "Integritas kedua negara kita bergantung pada hubungan baik di antara mereka. Kita harus mengusulkan perjanjian bahwa Spanyol dan Portugal akan selalu berada di pihak yang sama dalam perang global apa pun yang mereka ikuti, atau aliansi apa pun yang mereka ikuti. Iberia yang bersatu adalah Iberia yang kuat!"
 SPA_the_iberian_pact_tt: "Perjanjian ini mewajibkan salah satu pihak untuk bergabung dengan faksi mana pun atau pihak yang sama dalam perang apa pun yang diikuti pihak lain."
 SPA_the_iberian_pact_tt_2: "§R[POR.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 SPA_the_latin_bloc: "Blok Latin"
 SPA_the_latin_bloc_desc: "Blok-blok kekuatan besar sedang terbentuk di dunia. Daripada terlibat dalam ketegangan yang semakin meningkat di antara mereka, kita harus membangun blok kekuatan kita sendiri dengan negara-negara yang secara budaya dan ideologi sama dengan kita: negara-negara Latin di sekitar Mediterania."
 SPA_utilize_the_intellectuals: "Memanfaatkan Intelektual"
 SPA_utilize_the_intellectuals_desc: "Mereka yang diberkahi dengan kemampuan intelektual yang unggul harus diberikan sumber daya yang mereka butuhkan untuk memberikan pelayanan terbaik kepada negara mereka dengan cara yang tidak dapat dilakukan oleh pasukan kita."
 SPA_banish_the_party_leaders: "Usir Pimpinan Partai"
 SPA_banish_the_party_leaders_desc: "Kepemimpinan masing-masing partai Falange dan Carlist semakin berusaha untuk memaksakan agenda mereka sendiri, dan terbukti menjadi duri di pihak kita. Dengan mengeksploitasi perpecahan mereka untuk melemahkan posisi mereka, kita dapat membenarkan pengusiran para pemimpin bandel ini dari negara tersebut, dan menggantikan mereka dengan boneka-boneka yang setia kepada Franco."
 SPA_fuse_the_parties: "Gabungkan Para Pihak"
 SPA_fuse_the_parties_desc: "Landasan yang diperlukan telah diletakkan, dan waktunya telah tiba untuk menyatukan Falange dan Carlist menjadi satu partai, yang dipimpin oleh Francisco Franco."
 SPA_fuse_the_parties_tt: "§GMenghapus§! §YMendatang Pemberontakan Carlist§! §Gmisi.§!"
 SPA_join_the_allies: "Bergabunglah dengan Sekutu"
 SPA_join_the_allies_desc: "Jelas bagi kita ke arah mana pendulum ini berayun – kita akan bergabung dengan Sekutu, menerima bantuan ekonomi mereka yang kuat dan memastikan kita berada di pihak yang baik ketika mereka memenangkan perang."
 SPA_the_stabilization_plan: "Rencana Stabilisasi"
 SPA_the_stabilization_plan_desc: "Kita harus menjauhi impian kaum Falangis yang tidak masuk akal tentang autarki dan kebijakan ekonomi yang tidak dapat dipertahankan yang diterapkan dalam mewujudkannya. Untuk mencapai kesetaraan ekonomi dengan negara-negara lain di dunia, kita harus mempertimbangkan liberalisasi ekonomi, yang diharapkan akan memicu ledakan ekonomi yang akan menguntungkan seluruh rakyat Spanyol."
 SPA_expand_spanish_bases: "Perluas Pangkalan Spanyol"
 SPA_expand_spanish_bases_desc: "Kaum imperialis yang bersekutu dengan kita menginginkan penggunaan basis kita untuk menyebarkan pengaruh mereka ke seluruh dunia. Untuk mengakomodasi mereka, kita harus memperluas pangkalan udara dan angkatan laut di benua kita."
 SPA_capitalist_economic_aid: "Bantuan Ekonomi Kapitalis"
 SPA_capitalist_economic_aid_desc: "Bantuan ekonomi Barat seharusnya terbukti sangat berharga dalam pemulihan negara kita setelah mengalami cobaan berat."
 SPA_improve_living_standards: "Meningkatkan Standar Hidup"
 SPA_improve_living_standards_desc: "Semua orang harus diberi kesempatan untuk ikut merasakan manfaat yang diperoleh dari kemajuan ekonomi negara kita, apapun status mereka."
 SPA_domestic_industrial_developments: "Perkembangan Industri Dalam Negeri"
 SPA_domestic_industrial_developments_desc: "Inovasi Barat dapat diadaptasi untuk pekerja Spanyol, mengambil yang terbaik dari kedua dunia dan meningkatkan pemulihan bangsa."
 SPA_the_spanish_miracle: "Keajaiban Spanyol"
 SPA_the_spanish_miracle_desc: "Rencana Stabilisasi telah membuahkan hasil melebihi impian terliar kita; ledakan ekonomi yang kita alami hanyalah sebuah keajaiban!"
 SPA_adopt_the_26_points: "Adopsi 26 Poin"
 SPA_adopt_the_26_points_desc: "Setelah dengan mudah menghapus ketentuan yang melarang penggabungan partai politik dari \"27 Poin\" Falange, maka \"26 Poin\" yang dihasilkan menjadi sebuah manifesto partai yang baik yang dapat kita gunakan sebagai inspirasi dalam kebijakan pemerintah."
 SPA_direct_the_universities: "Mengarahkan Universitas"
 SPA_direct_the_universities_desc: "Bakat yang saat ini bekerja di bidang akademis tidak diragukan lagi dapat dimanfaatkan dengan lebih baik untuk penelitian terarah untuk tujuan militer. Kami akan menginstruksikan universitas sebagaimana mestinya."
 SPA_dictator_for_life: "Diktator Seumur Hidup"
 SPA_dictator_for_life_desc: "Franco telah melayani negaranya dengan baik. Kami melihat tidak ada kebutuhan untuk mengubah keadaan ini, dan tentunya tidak kembali ke monarki lama yang lemah."
 SPA_invest_in_naval_infrastructure: "Berinvestasi dalam Infrastruktur Angkatan Laut"
 SPA_invest_in_naval_infrastructure_desc: "Spanyol membutuhkan fasilitas angkatan laut baru untuk mendukung perluasan armada kami."
 SPA_expand_the_slipways: "Perluas Slipways"
 SPA_expand_the_slipways_desc: "Sebelumnya kami telah membeli kapal terbesar dari negara lain. Kita harus menambah ukuran slipways kita sehingga kita mempunyai kebebasan untuk membuat kapal ini sendiri."
 SPA_the_plan_imperial: "\"Rencana Kekaisaran\""
 SPA_the_plan_imperial_desc: "Kami akan memulai program besar untuk mengembalikan status angkatan laut Spanyol sebagai salah satu yang terbesar di dunia."
 SPA_restart_small_scale_shipbuilding: "Mulai Kembali Pembuatan Kapal Skala Kecil"
 SPA_restart_small_scale_shipbuilding_desc: "Angkatan Laut kita akan membutuhkan banyak kapal pengawal dengan ukuran yang dapat dibangun oleh galangan kapal domestik yang lebih kecil. Kita harus mendorong pengembangan desain baru di pekarangan ini."
 SPA_la_division_azul: "La División Azul"
 SPA_la_division_azul_desc: "Meskipun kita telah mengalahkan ancaman Komunis di Iberia, akar kejahatan masih membayangi di Timur. Sementara negara-negara lain menanggung beban terbesar dalam pertempuran ini, kita harus mengirimkan satu divisi sukarelawan untuk melakukan bagian kita dalam memerangi ancaman ini."
 SPA_the_tangiers_enclave: "Daerah Kantong Tangier"
 SPA_the_tangiers_enclave_desc: "Kota Tangier dijadikan zona internasional pada tahun 1923, di bawah pemerintahan bersama Perancis, Spanyol, dan Inggris. Melihat bagaimana dua rekan administrator kita saat ini terlibat dalam perang, kita harus turun tangan dan mengambil tanggung jawab sendiri untuk melindungi kota."
 SPA_the_tangiers_enclave_tt: "§RIni mungkin membuat marah rekan-rekan pengelola zona internasional!§!"
 SPA_demand_french_north_africa: "Permintaan Perancis di Afrika Utara"
 SPA_demand_french_north_africa_desc: "Koloni [FRA.GetAdjective] menjadi lemah seiring jatuhnya negara induknya. Kita harus menawarkan perlindungan, dengan pemahaman diam-diam bahwa penolakan bukanlah suatu pilihan."
 SPA_restore_the_monarchy: "Kembalikan Monarki"
 SPA_restore_the_monarchy_desc: "Pemerintahan sementara telah mencapai tujuannya dengan menggulingkan komunis dan mengakhiri Republik Kedua. Sekarang saatnya pemulihan monarki Spanyol!"
 SPA_restore_the_monarchy_tt: "§Y[ROOT.GetName]§! akan dikenal sebagai §YKerajaan Spanyol§!"
 SPA_stamp_out_the_maquis: "Hancurkan Maquis"
 SPA_stamp_out_the_maquis_desc: "Suku Maquis, sisa-sisa musuh kita, terus melancarkan perang gerilya dalam upaya untuk melawan kendali kita atas daratan Spanyol. Seiring berjalannya waktu, pengaruh mereka semakin berkurang, dan kini saatnya telah tiba untuk membasmi mereka untuk selamanya."
 SPA_defenses_against_strategic_bombing: "Pertahanan Terhadap Pengeboman Strategis"
 SPA_defenses_against_strategic_bombing_desc: "Jika kita ikut serta dalam konflik global, kita harus memastikan kota-kota kita terlindungi secara memadai dari pemboman strategis berskala besar yang pasti akan dilakukan oleh musuh-musuh kita."
 SPA_defenses_against_invasion: "Pertahanan Terhadap Invasi"
 SPA_defenses_against_invasion_desc: "Garis pantai Spanyol terbentang jauh dan luas, dan kita harus melakukan semua yang kita bisa untuk membuat kemungkinan invasi menjadi sesuatu yang tidak menyenangkan bagi musuh. Benteng yang kuat semoga membuat hadiahnya tidak sebanding dengan biayanya."
 SPA_defenses_against_invasion_tt: "Tempatkan §Y1 Benteng§! dan §Y2 Benteng Pesisir§! di provinsi inti benua dengan §YPangkalan Angkatan Laut§!."
 SPA_retake_gibraltar: "Rebut kembali Gibraltar"
 SPA_retake_gibraltar_desc: "Sudah lebih dari dua abad sejak Gibraltar terkoyak dari Spanyol. Penyakit Inggris di muka Iberia ini tidak bisa terus ada."
 SPA_claim_west_africa: "Klaim Afrika Barat"
 SPA_claim_west_africa_desc: "Dominasi Perancis di Afrika Barat sama sekali tidak pantas diterima. Daerah ini membentuk hubungan geografis alami dengan koloni kami di Guinea Khatulistiwa, dan dengan demikian harus dianggap sebagai bagian integral dari Kekaisaran Kolonial Spanyol."
 SPA_supremacy_of_the_communion: "Supremasi Komuni"
 SPA_supremacy_of_the_communion_desc: "Sama yakinnya dengan Tuhan yang menciptakan Langit dan Bumi, begitu pula Komunitas Tradisionalis memegang kunci masa depan kesatuan Spanyol. Pemberontakan Carlist pada abad ke-19 mungkin dapat dihalangi, namun semangat mereka tidak pernah patah: mereka yang setia pada Iman siap bangkit melawan Republik sekali lagi."
 SPA_prepare_the_carlist_insurrection: "Siapkan Pemberontakan Carlist"
 SPA_prepare_the_carlist_insurrection_desc: "Aliansi kita dengan Falange adalah sebuah kebutuhan, dan harapan hidup mereka dapat dihitung dalam hitungan minggu. Kita harus menyerang sekutu-sekutu kita sebelum mereka menyerang kita, dan menghilangkan ideologi mereka yang cacat sebelum ideologi tersebut mempunyai kesempatan untuk mengakar di benak masyarakat umum."
 SPA_prepare_the_carlist_insurrection_tt: "Membuka keputusan §YMempersiapkan Pemberontakan Carlist§!, yang memungkinkan untuk mengamankan negara-negara yang dikendalikan untuk pihak Carlist dalam pemberontakan.\n\nSelain itu, mengamankan §YBurgos§! dan §YNavarra§! untuk pihak Carlist, jika ini dikendalikan."
 SPA_contact_the_union_militar_espanola: "Hubungi Unión Militar Española"
 SPA_contact_the_union_militar_espanola_desc: "Unión Militar Española, sebuah perkumpulan rahasia perwira yang berkonspirasi melawan Republik, memiliki banyak orang yang mungkin bersimpati terhadap perjuangan kita. Kita harus menghubungi mereka dan mendapatkan dukungan dari sebanyak mungkin pemimpin ini, ketika saatnya tiba."
 SPA_head_the_junta_nacional: "Ketua Junta Nasional"
 SPA_head_the_junta_nacional_desc: "Eksekutif tertinggi mesin perang Carlist pada masa perang, Junta Nacional Carlista de Guerra, membutuhkan seorang pemimpin untuk menyatukan berbagai junta regional Carlist. Manuel Fal Conde bisa menjadi pemimpin itu."
 SPA_unite_the_requetes: "Satukan Requetés"
 SPA_unite_the_requetes_desc: "Sudah terlalu lama junta Carlist regional mampu beroperasi secara independen satu sama lain. Kita harus menyatukan mereka dan milisi mereka; Requetés, untuk mengatur upaya perang Carlist dengan lebih baik dan menghilangkan perbedaan pendapat internal."
 SPA_the_war_in_the_north: "Perang di Utara"
 SPA_the_war_in_the_north_desc: "Wilayah Utara selalu menjadi pusat gerakan Carlist. Pemberontakan apa pun harus fokus pada pengamanan wilayah ini sebagai basis operasi kami."
 SPA_revive_the_spirit_of_the_carlist_wars: "Bangkitkan Semangat Perang Carlist"
 SPA_revive_the_spirit_of_the_carlist_wars_desc: "Perang Carlist pada abad ke-19 mungkin merupakan kerugian yang patut disesalkan bagi perjuangan kita, namun semangat perlawanan tetap hidup hingga saat ini. Kami tidak akan berhenti sampai ahli waris yang sah duduk di atas takhta Spanyol dan menjaga iman Kristen bagi seluruh warga Spanyol."
 SPA_arms_modernization: "Modernisasi Senjata"
 SPA_arms_modernization_desc: "Pasukan kita mungkin yang paling berdedikasi, setia, taat, bersemangat, dan paling terlatih, namun mereka tetap memerlukan senjata yang memadai untuk membela agama Kristen. Kami akan memastikan mereka mendapatkan apa yang mereka butuhkan."
 SPA_no_compromise_on_carlist_ideals: "Tidak Ada Kompromi pada Cita-cita Carlist"
 SPA_no_compromise_on_carlist_ideals_desc: "Meskipun kami bekerja sama dengan Falange dalam pemberontakan awal kami, kini jelas bagi kami bahwa mengkompromikan cita-cita kami sama saja dengan pengkhianatan. Jika Falange tidak menerima tuntutan kami, maka kami tidak punya pilihan selain menghilangkannya juga."
 SPA_no_compromise_on_carlist_ideals_tt_2: "§Y[ROOT.GetName]§! akan dikenal sebagai §YCarlist Spanyol§!"
 SPA_no_compromise_on_carlist_ideals_tt: "§RPendukung Fasis akan memulai perang saudara!§!"
 SPA_the_crusade_against_democracy: "Perang Salib Melawan Demokrasi"
 SPA_the_crusade_against_democracy_desc: "Hanya ahli waris Carlist yang sah yang telah diberikan, oleh Tuhan sendiri, hak ilahi untuk memerintah. Demokrasi bukan hanya merupakan penghinaan terhadap Raja, namun juga merupakan penghujatan terhadap Kehendak Tuhan. Penyakit busuk ini tidak boleh dibiarkan terjadi lagi di dunia ini."
 SPA_the_crusade_against_democracy_timer_tt: "Setidaknya 70 hari sejak §YPerang Salib Melawan Demokrasi§! terakhir diubah."
 SPA_expand_the_requetes: "Perluas Requetés"
 SPA_expand_the_requetes_desc: "Sejauh ini kami mengandalkan kekuatan pasukan penyerang yang relatif kecil, namun relatif terlatih dengan baik. Namun, ambisi kami memerlukan lebih banyak hal. Kita harus memperluas Requetés ini dan memberikan pelatihan yang diperlukan bagi semua orang yang menjawab panggilan berburu."
 SPA_militarize_the_masses: "Militerisasi Massa"
 SPA_militarize_the_masses_desc: "Nilai-nilai yang kami junjung tidak dapat dipertahankan hanya dengan Requetés kami saja. Semua orang yang setia kepada Kerajaan dan mempunyai cinta Tuhan di dalam hatinya harus melakukan tugas militernya untuk mempertahankan cita-citanya."
 SPA_defenders_of_catholicism: "Pembela Katolik"
 SPA_defenders_of_catholicism_desc: "Seperti empat ratus tahun yang lalu, Spanyol harus kembali menjadi pembela iman Katolik. Lebih jauh lagi, prajurit biasa harus menjadi pedang dan perisai keyakinannya, dan mengingat tugas suci ini ke mana pun Rajanya mengirimnya untuk berperang."
 SPA_battle_rites: "Ritus Pertempuran"
 SPA_battle_rites_desc: "Peperangan untuk membela negara adalah tugas suci. Pendeta kami akan menemani para prajurit di medan perang dan melaksanakan upacara terakhir di tempat bagi siapa pun yang memberikan pengorbanan tertinggi bagi Raja dan Iman, memastikan bahwa semua diberi pahala di Surga."
 SPA_cultivate_fanaticism: "Kembangkan Fanatisme"
 SPA_cultivate_fanaticism_desc: "Ciri-ciri prajurit Carlist yang paling mengagumkan adalah kegigihannya dan tekadnya yang tak tergoyahkan dalam menghadapi bahaya dan kesulitan, dengan kesadaran bahwa Tuhan akan memberi imbalan atas tugas mereka jika mereka gagal. Dedikasi dan pengorbanan mereka yang gugur ini harus dijadikan contoh untuk diperjuangkan bagi semua anggota baru."
 SPA_the_third_dimension_of_warfare: "Dimensi Ketiga Peperangan"
 SPA_the_third_dimension_of_warfare_desc: "Semangat gigih Carlist sudah menguasai daratan; ia sekarang harus menaklukkan langit juga."
 SPA_a_modern_fighter_fleet: "Armada Tempur Modern"
 SPA_a_modern_fighter_fleet_desc: "Pilot kita harus diberikan mesin terbaik yang dapat dikerahkan oleh negara kita. Kekurangan kita dalam hal jumlah harus kita ganti dengan keterampilan, keberanian, dan perlengkapan."
 SPA_confirm_the_fueros: "Konfirmasikan Fuero"
 SPA_confirm_the_fueros_desc: "Pemerintahan suatu negara berada di bawah wewenang Raja, namun hak-hak istimewa kuno menjaga hak pemerintahan sendiri untuk wilayah-wilayah yang mencakup Kerajaan secara keseluruhan. Hak-hak tersebut, atau disebut fueros, harus ditegaskan agar loyalitas berbagai daerah dapat dipertahankan."
 SPA_encourage_local_industrialization: "Mendorong Industrialisasi Lokal"
 SPA_encourage_local_industrialization_desc: "Industrialisasi harus didorong oleh berbagai pemerintah daerah, karena inisiatif lokal seperti ini tentu akan memperkuat bangsa secara keseluruhan."
 SPA_encourage_local_mining: "Mendorong Penambangan Lokal"
 SPA_encourage_local_mining_desc: "Industri kita memerlukan sumber daya dan sudah puas dengan perannya sebagai importir bersih. Kita harus mendorong upaya menuju perluasan perusahaan pertambangan di negara kita, untuk memanfaatkan kekayaan semenanjung Iberia dan mengurangi ketergantungan kita pada pemasok asing."
 SPA_settle_the_succession_question: "Selesaikan Pertanyaan Suksesi"
 SPA_settle_the_succession_question_desc: "Perjuangan Carlist terpecah antara kubu yang mendukung klaim takhta yang berbeda. Alfonso Carlos, pewaris Carlist, meninggal tanpa keturunan pada akhir tahun 1936, tetapi sebelumnya menunjuk Xavier dari Bourbon-Parma sebagai ahli warisnya. Namun, ada pula yang malah mendukung klaim raja konstitusional lama Alfonso XIII yang diasingkan."
 SPA_dios_patria_rey: "Dios, Patria dan Rey!"
 SPA_dios_patria_rey_desc: "Seruan Carlist bergema sepanjang sejarah dan menjadi contoh keyakinan yang kita yakini benar. Hal ini menjadi pengingat bahwa kita semua hanya memainkan peran kecil dalam membela agama Katolik, komunitas lokal kita dan bangsa Spanyol secara keseluruhan, dan kedaulatan tertinggi Raja kita. Tuhan, Tanah Air, dan Raja!"
 SPA_restore_the_empire: "Kembalikan Kekaisaran"
 SPA_restore_the_empire_desc: "Kekaisaran kita menunggu! Kita hanya perlu membangun industri militer agar kita bisa menguasainya."
 SPA_strengthen_the_empire: "Perkuat Kekaisaran"
 SPA_strengthen_the_empire_desc: "Perekonomian Kekaisaran Spanyol yang masih baru masih mengalami kesulitan, dan lebih banyak perbendaharaan harus dialokasikan untuk memastikan industri kita pulih lebih cepat dari kehancuran akibat Perang Saudara."
 SPA_prosperity_of_the_empire: "Kemakmuran Kekaisaran"
 SPA_prosperity_of_the_empire_desc: "Pemulihan dan kemakmuran Kekaisaran adalah hal yang terpenting, dan melalui fokus tambahan pada peningkatan infrastruktur negara kami, sehingga mendorong pengembangan perdagangan dan industri, kami akan memastikan tujuan ini tercapai dalam waktu singkat."
 SPA_press_the_gibraltar_claim: "Tekan Klaim Gibraltar"
 SPA_press_the_gibraltar_claim_desc: "Penghinaan terhadap Raja kita yang merupakan keberadaan daerah kantong Gibraltar harus dibalas."
 SPA_claim_the_french_throne: "Klaim Tahta Prancis"
 SPA_claim_the_french_throne_desc: "Tahta Spanyol dan Perancis telah terhubung secara dinasti selama lebih dari setengah abad. Raja kita saat ini pun demikian, dan juga merupakan pengklaim sah takhta Prancis. Ini adalah keadaan yang harus dieksploitasi."
 SPA_retake_the_spanish_netherlands: "Rebut kembali Spanyol Belanda"
 SPA_retake_the_spanish_netherlands_desc: "Kekaisaran kita pernah meluas hingga ke perbatasan Jerman. Tidak ada alasan bagi kita untuk tidak melakukan hal ini sekali lagi, dan memungkinkan kita untuk membalas Perang 80 Tahun yang sedang berlangsung."
 SPA_restore_the_iberian_union: "Pulihkan Uni Iberia"
 SPA_restore_the_iberian_union_desc: "Hampir empat abad telah berlalu sejak Spanyol dan Portugal terakhir kali mengalami nasib yang sama, yang berlangsung namun hanya sebentar. Iberia bersama-sama menjadi lebih kuat, sehingga kami akan memastikan klaim baru atas takhta Portugis 'ditemukan'..."
 SPA_the_war_of_vengeance: "Perang Pembalasan"
 SPA_the_war_of_vengeance_desc: "Perang Spanyol-Amerika tahun 1898 masih terus diingat, dan dampak besar yang ditimbulkannya terhadap jiwa nasional orang Spanyol dapat dicontohkan dengan baik dalam tulisan Generasi '98. Rasa malu nasional atas hilangnya koloni kita harus dibalas. Amerika harus ditundukkan."
 SPA_found_the_academia_vazquez_de_mella: "Menemukan Akademisi Vázquez De Mella"
 SPA_found_the_academia_vazquez_de_mella_desc: "Kita harus membangun pusat pemikiran Tradisionalis yang besar, yang juga dapat digunakan oleh para pemikir Carlist untuk membuat kemajuan dan perkembangan baru yang dapat menguntungkan monarki Spanyol yang baru."
 SPA_a_fleet_worthy_of_a_king: "Armada yang Layak Menjadi Raja"
 SPA_a_fleet_worthy_of_a_king_desc: "Angkatan Laut kita harus diperluas secara signifikan jika raja ingin dapat menegaskan keinginannya melintasi lautan. Infrastruktur angkatan laut yang baru akan segera dibangun."
 SPA_rebuild_the_battlefleet: "Bangun kembali Battlefleet"
 SPA_rebuild_the_battlefleet_desc: "Selama empat dekade setelah Perang Spanyol-Amerika, angkatan laut kita lesu dan penakut. Penambahan kapal-kapal perang besar baru yang mampu menghadapi musuh apa pun akan menanamkan rasa kelahiran kembali di jajaran kapal tersebut, serta memungkinkan kita untuk bersaing di laut dengan negara-negara tetangga kita."
 SPA_imperial_security: "Keamanan Kekaisaran"
 SPA_imperial_security_desc: "Keamanan Kekaisaran tidak terletak pada kapal-kapal besar, melainkan pada kapal penjelajah dalam jumlah yang cukup. Pengembangan model-model baru dan doktrin-doktrin perlindungan perdagangan baru harus segera dimulai, sehingga kami dapat mengamankan penyediaan pasokan ke perusahaan-perusahaan kami di luar negeri."
 SPR_regional_defense_council_of_aragon: "Dewan Pertahanan Regional Aragon"
 SPR_regional_defense_council_of_aragon_desc: "Untuk tujuan peperangan, dan hanya jika diperlukan, komune anarkis otonom yang muncul akibat Perang Saudara harus disatukan di bawah Dewan Pertahanan tunggal yang dapat mengoordinasikan upaya kita. Kami akan mulai dengan mendirikannya di Aragon."
 SPR_appropriate_the_means_of_production: "Alat Produksi yang Sesuai"
 SPR_appropriate_the_means_of_production_desc: "Lewatlah sudah hari-hari ketika kita bekerja untuk orang kaya. Lewatlah sudah hari-hari ketika kerja keras kita tidak membuahkan hasil. Kita akan merebut pabrik-pabrik dan bengkel-bengkel, lahan pertanian dan pertokoan, melenyapkan kelas dan menempatkan pekerja untuk menentukan nasib mereka sendiri."
 SPR_autogestion: "Gerakan otomatis"
 SPR_autogestion_desc: "Kami akan memaksimalkan hasil dengan mengizinkan pekerja melakukan manajemen mandiri di tempat kerja sesuai dengan prinsip autogestión. Hal ini akan memberikan banyak manfaat dalam hal otonomi pekerja, moral, dan, sebagai hasilnya, produktivitas secara keseluruhan."
 SPR_collectivization_and_workers_control: "Kolektivisasi Dan Kontrol Pekerja"
 SPR_collectivization_and_workers_control_desc: "Untuk aspek-aspek penting dalam pemerintahan daerah, kami akan mengandalkan dewan pekerja, memberikan kebebasan berpendapat kepada setiap pekerja dan juga memungkinkan kerja sama dalam skala yang lebih besar."
 SPR_arm_the_people: "Persenjatai Rakyat"
 SPR_arm_the_people_desc: "Tentara nasional dapat dengan mudah digunakan sebagai cara bagi pemerintah untuk mempertahankan kendali atas rakyatnya, sehingga tidak ada jalan lain untuk melakukan pertahanan komunal. Rakyatlah yang harus diberi senjata untuk membela komunitasnya."
 SPR_the_maximum_concession: "Konsesi Maksimum"
 SPR_the_maximum_concession_desc: "Dalam semangat melawan fasisme, kami telah memberikan konsesi sebesar mungkin: kerja sama dengan kaum kapitalis dan komunis otoriter. Konsesi ini adalah sejauh yang kami bersedia lakukan, dan tidak dapat bertahan selamanya. Kami akan memanfaatkannya semaksimal mungkin."
 SPR_seize_public_transport: "Rebut Angkutan Umum"
 SPR_seize_public_transport_desc: "Semua orang ingin mengambil bagian dalam perjuangan kebebasan. Sekutu kita banyak yang bekerja di sektor transportasi umum, dan mereka sangat ingin menggunakan kendaraan mereka untuk melayani tentara pemberani kita. Hal ini mungkin memberi kita keuntungan taktis yang tidak lazim dalam menghadapi musuh."
 SPR_seize_public_transport_tt: "§RSemangat ini akan hilang setelah Perang Saudara berakhir!§!"
 SPR_agrarian_collectivization: "Kolektivisasi Agraria"
 SPR_agrarian_collectivization_desc: "Organisasi pertanian kita yang kolektif akan memastikan semua orang yang tinggal di komune mendapatkan makanan yang mereka perlukan, dibandingkan menjual hasil panen di tempat yang paling menguntungkan bagi mereka."
 SPR_mujeres_libres: "Mujeres Libres"
 SPR_mujeres_libres_desc: "Revolusi sosial hanya berhasil sebagian saja. Langkah selanjutnya adalah pembebasan, pemberdayaan, dan pendidikan perempuan kelas pekerja. Kesetaraan akan menguntungkan masyarakat secara keseluruhan."
 SPR_literacy_programs: "Program Literasi"
 SPR_literacy_programs_desc: "Buta huruf tersebar luas di kalangan pekerja, namun dengan program yang tepat, hal ini dapat diperbaiki dengan cepat, sehingga tidak diragukan lagi akan memungkinkan munculnya bakat-bakat tersembunyi."
 SPR_shared_burdens: "Beban Bersama"
 SPR_shared_burdens_desc: "Perjuangan untuk kebebasan kita dari otoritarianisme, kapitalisme, dan takhayul agama akan memakan waktu lama dan sulit. Kita semua harus melakukan bagian kita dalam menanggung kesulitan yang pasti menanti kita, sebelum kita semua dapat memetik hasil dari kerja keras kita."
 SPR_international_brigades: "Brigade Internasional"
 SPR_international_brigades_desc: "Perjuangan kami telah menarik banyak perhatian internasional, dan orang-orang datang dari seluruh dunia untuk melawan ancaman fasis bersama kami. Tidak seorang pun akan ditolak, selama mereka melakukan bagiannya demi kesehatan masyarakat. Kami akan mengatur mereka dalam brigade internasional."
 SPR_international_brigades_tt: "§YMáté Zalka§! tersedia sebagai level 2 §YField Marshal§!"
 SPR_seize_the_gold_reserves: "Rebut Cadangan Emas"
 SPR_seize_the_gold_reserves_desc: "Cadangan emas Republik berada dalam risiko jatuh ke tangan Fasis, atau bahkan lebih buruk lagi, ke tangan Stalinis. Dengan menyita senjata-senjata tersebut, kita pasti berisiko menimbulkan kemarahan pemerintah, namun hal ini mungkin akan memungkinkan kita untuk membiayai upaya perang kita dengan mendanai pembelian senjata asing dari pasar gelap."
 SPR_gold_reserves_flag: "Cadangan Emas telah disita atau direlokasi"
 SPR_foreign_arms_purchases: "Pembelian Senjata Asing"
 SPR_foreign_arms_purchases_desc: "Cadangan emas yang kami 'bebaskan' dapat digunakan untuk memperoleh senjata asing, yang sangat kami butuhkan. Pendapat internasional belum tentu mendukung kita, jadi kita mungkin harus melalui jalur yang tidak lazim untuk menerima hal ini, namun..."
 SPR_foreign_arms_purchases_tt: "Membuka keputusan §YPembelian Senjata Asing§!, memungkinkan pembelian berbagai jenis peralatan."
 SPR_masters_of_our_own_fate: "Penguasa Nasib Kita Sendiri"
 SPR_masters_of_our_own_fate_desc: "Kaum Stalinis dan boneka Partai Republik mereka semakin melanggar kebebasan kita, secara sistematis melemahkan upaya kita dan menghilangkan pendukung utama perjuangan kita. Cukup sudah. Kitalah yang menentukan nasib kita sendiri, meskipun itu berarti harus melawan mereka juga."
 SPR_anarchist_uprising_flag: "Kaum Anarkis telah bangkit."
 SPR_masters_of_our_own_fate_tt_2: "§Y[ROOT.GetName]§! akan dikenal sebagai §YDewan Pertahanan Regional Aragon§!"
 SPR_masters_of_our_own_fate_tt_3: "§Y[ROOT.GetName]§! akan dikenal sebagai §YKomune Spanyol§!"
 SPR_masters_of_our_own_fate_tt_4: "Menteri POUM menjadi §Gtersedia§!, tetapi menteri Demokrat dan Stalinis §Rdihapus§!."
 SPR_masters_of_our_own_fate_tt: "§RPendukung Komunis dan Demokrat akan memulai perang saudara!§!"
 SPR_all_must_bear_the_torch: "Semua Harus Memikul Obor"
 SPR_all_must_bear_the_torch_desc: "Setiap orang adalah sebuah revolusi tersendiri; jika bukan karena keberanian dan keganasan individu maka kolektif tersebut akan kalah menghadapi musuh-musuhnya. Pesan ini harus disampaikan kepada semua pendukung kami; setiap orang dari kita harus membantu mengangkat obor anarkisme."
 SPR_the_threats_abound: "Ancamannya Berlimpah"
 SPR_the_threats_abound_desc: "Jelas sekali dunia tidak setuju dengan keberadaan kita. Ke mana pun kita berpaling, kita akan ditanggapi dengan sikap dingin, atau bahkan sikap bermusuhan. Kini jelas bagi kita: kita tidak punya sekutu yang bisa diandalkan. Kita harus bersiap menghadapi perang dengan masing-masing negara yang sudah mati ini."
 SPR_portuguese_anarchism: "Anarkisme Portugis"
 SPR_portuguese_anarchism_desc: "Perang kemerdekaan kita telah meluas hingga ke perbatasan Portugal, dan pemerintahan menjadi tidak stabil. Dengan dukungan yang tepat, bukan tidak mungkin terjadi pemberontakan anarkis besar-besaran di wilayah mereka. Kita harus menyalakan api ini!"
 SPR_regional_defense_council_of_iberia: "Dewan Pertahanan Regional Iberia"
 SPR_regional_defense_council_of_iberia_desc: "Dengan pembebasan wilayah yang dulunya Portugal, kita dapat membentuk dewan pertahanan baru yang mewakili keinginan semua komune yang ada di semenanjung Iberia."
 SPR_regional_defense_council_of_iberia_tt: "§Y[ROOT.GetName]§! akan dikenal sebagai §YDewan Pertahanan Regional Iberia§!"
 SPR_a_new_way_of_warfare: "Cara Peperangan Baru"
 SPR_a_new_way_of_warfare_desc: "Keberanian infanteri kita tidak diragukan lagi, namun realitas perang telah melampaui kemampuan infanteri. Kita harus memulai pengembangan mesin peperangan baru, baik di darat maupun di udara, untuk mempertahankan komune kita."
 SPR_communal_military_strategies: "Strategi Militer Komunal"
 SPR_communal_military_strategies_desc: "Mengorganisir peperangan skala besar sambil tetap setia pada prinsip anarkisme merupakan sebuah tantangan besar. Hal ini juga merupakan hal yang harus kita hadapi, karena tanpa hal tersebut semua yang kita perjuangkan akan sia-sia."
 SPR_maintaining_the_fire: "Mempertahankan Api"
 SPR_maintaining_the_fire_desc: "Kelelahan berperang adalah pertanda kehancuran. Kita harus tetap kuat dan menghidupkan kembali api yang mendorong mereka untuk melakukan yang terbaik."
 SPR_freedom_of_thought: "Kebebasan Berpikir"
 SPR_freedom_of_thought_desc: "Ketertutupan pikiran tidak mempunyai tempat di komunitas kita. Semua diperbolehkan, apa pun idenya, asalkan mereka menerima landasan dasar masyarakat kita."
 SPR_torchbearers_of_tomorrow: "Pembawa Obor Masa Depan"
 SPR_torchbearers_of_tomorrow_desc: "Mereka yang melakukan bagiannya dalam mendukung tujuan kita, baik melalui upaya intelektual atau militer, adalah inkarnasi masa depan. Kesadaran ini mungkin bisa menjadi kekuatan pendorong yang kuat, sehingga kita harus memastikan mereka sadar akan pentingnya pekerjaan mereka."
 SPR_the_inevitable_counterblow: "Serangan Balik yang Tak Terelakkan"
 SPR_the_inevitable_counterblow_desc: "Permusuhan internasional terhadap cara hidup komunal kita semakin meningkat. Hanya masalah waktu sebelum pukulan itu dijatuhkan, dan kita harus siap menerimanya."
 SPR_improve_military_infrastructure: "Memperbaiki Infrastruktur Militer"
 SPR_improve_military_infrastructure_desc: "Untuk mencapai komune yang terkepung pada waktunya, kita harus meningkatkan infrastruktur antarkomunal kita. Hal ini akan memungkinkan Dewan Pertahanan secara keseluruhan untuk dengan cepat menanggapi setiap ancaman dari luar yang mungkin tidak mampu dihadapi oleh komune mana pun."
 SPR_fortify_the_pyrenees: "Perkuat Pyrenees"
 SPR_fortify_the_pyrenees_desc: "Jalur serangan yang paling jelas adalah dari arah utara. Pyrenees harus dibentengi dari segala serangan yang menimpanya atau di sepanjang garis pantainya."
 SPR_fortify_the_pyrenees_tt: "Tempatkan level 3 §YBenteng§! di provinsi-provinsi di perbatasan Perancis di §YPaís Vasco§!, §YNavarre§!, §YWestern Aragón§!, §YEastern Aragón§!, dan §YCataluña§!."
 SPR_fortify_la_linea_de_la_concepcion: "Perkuat La Línea de la Concepción"
 SPR_fortify_la_linea_de_la_concepcion_desc: "La Línea de la Concepción adalah benteng pertama melawan musuh yang ada di luarnya. Dengan pertahanan yang memadai kita harus mampu menghadapi serangan apa pun yang datang dari Gibraltar secara langsung."
 SPR_fortify_la_linea_de_la_concepcion_tt: "Tempatkan level 3 §YBenteng§! di provinsi di perbatasan Gibraltar di §YSevilla§! dan §YGranada§!."
 SPR_fortify_the_coastlines: "Perkuat Garis Pantai"
 SPR_fortify_the_coastlines_desc: "Kita tidak bisa mengabaikan kemungkinan invasi angkatan laut. Pertahanan yang diperluas akan membuat situasi ini menjadi kurang menyenangkan bagi musuh dibandingkan jika kita tetap tidak berdaya di perbatasan ini."
 SPR_fortify_the_coastlines_tt_1: "Tempatkan §Y1 Benteng Pesisir§! di provinsi pesisir di §YGalicia§!, §YAsturias§! dan §YPaís Vasco§!."
 SPR_fortify_the_coastlines_tt_2: "Tempatkan §Y1 Benteng§! dan §Y2 Benteng Pesisir§! di provinsi inti benua dengan §YPangkalan Angkatan Laut§!."
 SPR_militarize_the_industry: "Militerisasikan Industri"
 SPR_militarize_the_industry_desc: "Komunitas harus didorong untuk meningkatkan produksi perlengkapan militer, atau kita berisiko membuat tentara pemberani kita kekurangan peralatan yang mereka perlukan untuk mempertahankan rumah kita."
 SPR_communal_autarky: "Autarki Komunal"
 SPR_communal_autarky_desc: "Dunia telah menjauhi kita, jadi kita harus puas dengan sumber daya alam yang kita temukan di wilayah kita sendiri. Ini adalah latihan pengoptimalan yang akan kita pelajari agar bisa unggul."
 SPR_faith_in_the_cause: "Keyakinan pada Penyebabnya"
 SPR_faith_in_the_cause_desc: "Tidak ada ruang untuk berpikir mengalah ketika seluruh dunia menentang Anda. Kita akan tetap mempertahankan keyakinan kita yang tak tergoyahkan dalam mencapai masa depan yang damai, atau kita akan gagal."
 SPR_militarize_the_people: "Memiliterisasi Rakyat"
 SPR_militarize_the_people_desc: "Kita tidak mempunyai kemewahan untuk menjaga tangan kita tetap bersih dari darah. Semua orang harus diajari untuk menggunakan senjata untuk membela diri, sehingga ketika saatnya tiba mereka dapat berjuang demi masa depan mereka."
 SPR_anarchism_knows_no_borders: "Anarkisme Tidak Mengenal Batas"
 SPR_anarchism_knows_no_borders_desc: "Jika negara-negara di dunia tidak ingin menoleransi kita berada di tengah-tengah mereka, maka satu-satunya jalan bagi kita di masa depan agar kita dapat bersatu secara damai adalah dengan menghapuskan semua negara-bangsa itu sendiri."
 SPR_plant_the_seeds_of_revolution: "Tanam Benih Revolusi"
 SPR_plant_the_seeds_of_revolution_desc: "Mereka yang mempunyai sentimen serupa dengan kita telah lama dibungkam oleh pemerintahan mereka yang menindas. Kami akan memberikan senjata yang mereka butuhkan kepada kelompok-kelompok ini, sehingga mereka dapat menggulingkan negara mereka dari dalam, dan bergabung dengan kami ketika kami mengalahkan musuh-musuh kami dan bergabung dengan mereka."
 SPR_plant_the_seeds_of_revolution_tt: "Membuka keputusan §YBenih-Benih Revolusi§!, yang memungkinkan terciptanya pemberontakan Anarkis di negara-negara tetangga musuh."
 SPR_global_defense_council: "Dewan Pertahanan Global"
 SPR_global_defense_council_desc: "Perbatasan kita telah meluas melampaui geografi semenanjung Iberia, dan jabatan yang kita berikan kepada dewan pertahanan sementara tidak lagi mewakili semua yang menjadi bagian dari dewan tersebut. Kami akan mengganti nama organisasi kami menjadi organisasi yang inklusif bagi semua orang di planet ini."
 SPR_global_defense_council_tt: "§Y[ROOT.GetName]§! akan dikenal sebagai §YDewan Pertahanan Global§!"
 SPR_global_defense_council_tt_2: "Membuka keputusan §YBenih-Benih Revolusi§!, yang memungkinkan pemindahan dan pembuangan negara-negara yang dikuasai asing yang memiliki §YKepatuhan§!.\nyang cukup tinggi"
 SPR_the_anti_fascist_workers_revolution: "Revolusi Pekerja Anti-Fasis"
 SPR_the_anti_fascist_workers_revolution_desc: "Sekaranglah waktunya bagi buruh Spanyol untuk bangkit melawan musuh fasis! Kita bahu-membahu dengan kaum borjuasi, namun hanya selama diperlukan untuk memastikan ancaman ini dapat diatasi. Revolusi dimulai sekarang!"
 SPR_strengthen_the_euzko_gudarostea: "Perkuat Euzko Gudarostea"
 SPR_strengthen_the_euzko_gudarostea_desc: "Wilayah Basque memiliki industri yang penting dan harus dipertahankan dengan lebih baik. Memperluas pasukan yang dihimpun oleh pemerintah daerah akan berdampak besar dalam memperkuat garis depan di sana."
 SPR_strengthen_the_euzko_gudarostea_tt: "Dapatkan 6 unit dengan §Y3 batalyon Infanteri§! di §YPaís Vasco§!."
 SPR_remove_after_civil_war_tt: "§RUnit-unit ini akan disingkirkan setelah Perang Saudara berakhir!§!"
 SPR_fortify_the_iron_ring: "Perkuat Cincin Besi"
 SPR_fortify_the_iron_ring_desc: "Kota terbesar di Negara Basque, Bilbao, akan menerima benteng 'Cincin Besi' sendiri, yang memungkinkan Basque menjadi penghalang yang tangguh untuk mempertahankannya dari musuh fasis."
 SPR_arm_the_workers_militias: "Persenjatai Milisi Pekerja"
 SPR_arm_the_workers_militias_desc: "Kita telah mengorganisir milisi dari angkatan kerja, dan sekarang harus memastikan bahwa mereka mempunyai perlengkapan yang memadai sehingga mereka dapat membentuk garda depan melawan musuh fasis dan tentara yang tidak loyal."
 SPR_hinder_nkvd_interference: "Menghambat Interferensi NKVD"
 SPR_hinder_nkvd_interference_desc: "NKVD Soviet sudah terlalu lama mencampuri urusan dalam negeri Spanyol. Para kritikus vokal terhadap Stalin telah menghilang, para politisi kita terisolasi, dan upaya-upaya kita untuk memerangi kaum fasis kadang-kadang lebih ditentang oleh pihak-pihak yang dianggap sebagai sekutu kita dibandingkan oleh musuh-musuh kita. Cukup sudah. Kami akan melawan kaum Stalinis."
 SPR_hinder_nkvd_interference_tt: "Mengganti misi §YMendatang Pemberontakan Anarkis§! dengan misi §YMendatang Penindasan Pemerintah§!."
 SPR_demand_ministerial_positions: "Menuntut Jabatan Menteri"
 SPR_demand_ministerial_positions_desc: "Jika Republik menginginkan dukungan kami yang berkelanjutan, mereka harus memberikan posisi kepada politisi kami di pemerintahan. Hanya dengan cara ini mereka akan memperjelas bahwa mereka melihat kita sebagai sekutu yang berharga dalam perjuangan kita bersama."
 SPR_the_stalinist_doctrine: "Doktrin Stalinis"
 SPR_the_stalinist_doctrine_desc: "Ada di antara aliansi kelompok anti-fasis kita yang menafsirkan kata-kata Marx secara independen dari Stalin. Hal ini merupakan duri bagi seluruh Sosialisme dan tidak dapat dibiarkan berlanjut. Agar perjuangan buruh tidak terancam, kita harus menghilangkan suara-suara yang berbeda pendapat dan bersatu di bawah satu pemimpin."
 SPR_subvert_the_stalinists: "Tumbangkan kaum Stalinis"
 SPR_subvert_the_stalinists_desc: "Kami tidak memulai pertengkaran ini, tapi jika kaum Stalinis bersikeras, kami akan memainkan permainan mereka. Kita akan melemahkan basis kekuatan mereka dari dalam dengan mempengaruhi pendukung mereka dan menyedot pasokan mereka. Ke mana pun mereka pergi, mereka akan menemukan kita menentang mereka."
 SPR_class_war: "Perang Kelas"
 SPR_class_war_desc: "Konsep Front Populer mempunyai kelemahan; pekerja tidak akan pernah benar-benar bebas selama mereka dipaksa bekerja sama dengan kaum borjuis. Hanya perang kelas tanpa kompromi yang bisa memberi kita kebebasan yang kita inginkan, meskipun hal ini berarti melawan kaum kapitalis dan fasis pada saat yang bersamaan."
 SPR_secularize_the_new_state: "Sekularisasi Negara Baru"
 SPR_secularize_the_new_state_desc: "Masyarakat baru yang kita bangun tidak memiliki ruang bagi agama. Hal ini hanya berfungsi untuk memperkuat struktur kelas atau menenangkan pekerja agar patuh. Hanya dengan membebaskan pikiran kita dari takhayul ini kita bisa benar-benar bebas."
 SPR_appropriate_church_riches: "Kekayaan Gereja yang Sesuai"
 SPR_appropriate_church_riches_desc: "Kekayaan yang dikumpulkan oleh Gereja Katolik bisa lebih baik digunakan untuk mendanai perjuangan kita. Kami akan menggunakannya untuk meningkatkan pabrik-pabrik yang sudah ada dan mendirikan pabrik-pabrik baru, yang semuanya akan berperan dalam pencapaian tujuan akhir kami."
 SPR_an_army_of_all_classes: "Pasukan dari Semua Kelas"
 SPR_an_army_of_all_classes_desc: "Dalam menghadapi ancaman fasis, kelas tidaklah relevan. Kami akan membentuk pasukan yang semua orang dipersilakan untuk mengabdi, dan pada saat yang sama memaparkan mereka pada nilai-nilai sosialis yang sehat yang dianut oleh rekan-rekan mereka."
 SPR_relocate_the_gold_reserves: "Relokasi Cadangan Emas"
 SPR_relocate_the_gold_reserves_desc: "Cadangan emas kita adalah kunci dalam pembelian bahan perang dari luar negeri. Kita harus memastikannya disimpan di lokasi yang aman, yang sayangnya harus dipindahkan ke luar negeri."
 SPR_relocate_the_gold_reserves_tt: "§RCadangan Emas kita akan bergantung pada negara tuan rumah!§!"
 SPR_reaffirm_the_popular_front_strategy: "Menegaskan kembali Strategi Front Populer"
 SPR_reaffirm_the_popular_front_strategy_desc: "Perbedaan antara kita dan sekutu kita harus segera dilupakan, sehingga kita semua dapat fokus pada perjuangan yang lebih penting: melawan kaum fasis."
 SPR_anti_fascist_unity: "Persatuan Anti-Fasis"
 SPR_anti_fascist_unity_desc: "Perbedaan pendapat antara sekutu anarkis dan anti-Stalinis dan diri kita sendiri semakin memburuk. Kita tidak boleh membiarkan hal ini terjadi tanpa kendali. Kita harus memfokuskan kembali perhatian kita pada musuh yang sebenarnya, meskipun harga dari perdamaian internal adalah konsesi di tingkat pemerintah terhadap sekutu kita yang tidak patuh."
 SPR_anti_fascist_unity_tt: "Membuka keputusan §YPersatuan Anti-Fasis§!, sehingga memungkinkan untuk menunda pemberontakan Anarkis dengan imbalan konsesi."
 SPR_crush_the_revolution: "Hancurkan Revolusi"
 SPR_crush_the_revolution_desc: "Cara independen yang dilakukan oleh komune-komune anarkis telah menjadi duri bagi kita, dan, sejujurnya, lemahnya pertahanan mereka merupakan kelemahan kritis di garis depan kita. Kita akan lebih baik tanpa mereka, dan sudah saatnya revolusi ini dihancurkan untuk selamanya."
 SPR_crush_the_revolution_tt: "§RPendukung Non-Blok akan memulai perang saudara!§!"
 SPR_united_under_socialism: "Bersatu di Bawah Sosialisme"
 SPR_united_under_socialism_desc: "Meskipun kita berasal dari berbagai wilayah dan latar belakang, kita harus melupakan perbedaan-perbedaan ini dan fokus pada upaya bersama untuk mencapai sosialisme."
 SPR_wealth_redistribution: "Redistribusi Kekayaan"
 SPR_wealth_redistribution_desc: "Kini setelah properti milik orang-orang kaya telah dirampas, kita akan memastikan semua pihak ikut ambil bagian dalam kemenangan ini dengan mendistribusikan kembali kekayaan ini sehingga seluruh masyarakat dapat memetik manfaatnya secara merata."
 SPR_collective_recovery_efforts: "Upaya Pemulihan Kolektif"
 SPR_collective_recovery_efforts_desc: "Komunitas Spanyol secara keseluruhan harus bersatu dalam satu upaya besar untuk memperbaiki kerusakan akibat perang saudara yang kejam. Pabrik-pabrik kami harus dibangun kembali sehingga masyarakat dapat kembali bekerja, dan infrastruktur baru harus dibangun untuk memfasilitasi interaksi antar komunitas lokal."
 SPR_repair_and_expand_the_dockyards: "Perbaiki dan Perluas Galangan Kapal"
 SPR_repair_and_expand_the_dockyards_desc: "Galangan kapal besar tidak kebal terhadap kehancuran akibat perang saudara. Sambil memperbaikinya, kita juga harus mempertimbangkan untuk memperluasnya, sehingga kita siap untuk program perluasan angkatan laut di masa depan."
 SPR_the_peoples_fleet: "Armada Rakyat"
 SPR_the_peoples_fleet_desc: "Kehendak rakyat terwujud baik di darat maupun di lautan. Kehendak ini harus didukung oleh armada baru yang akan segera kita bangun."
 SPR_land_redistribution: "Redistribusi Tanah"
 SPR_land_redistribution_desc: "Semua orang yang ingin menggarap lahan harus diperbolehkan melakukannya. Tanah yang dimiliki sebelum perang oleh mereka yang tidak dapat menggunakannya dengan baik sekarang akan dialokasikan untuk digunakan oleh mereka yang mampu menggunakannya dengan baik."
 SPR_expand_the_means_of_production: "Perluas Alat Produksi"
 SPR_expand_the_means_of_production_desc: "Kesehatan kolektif bergantung pada kekuatan industrinya. Dengan memperluas wilayah kita, kita dapat memastikan stabilitas di dalam dan memperkuat pertahanan kita terhadap musuh di luar."
 SPR_invite_socialist_intellectuals: "Undang Intelektual Sosialis"
 SPR_invite_socialist_intellectuals_desc: "Masyarakat kita akan menjadi surga bagi semua intelektual yang memiliki dedikasi yang sama terhadap perjuangan sosialis. Orang-orang ini harus diundang dari berbagai belahan dunia, sehingga kejeniusan mereka dapat memberikan kemajuan bagi kita semua."
 SPR_solidify_government_control: "Perkuat Kontrol Pemerintah"
 SPR_solidify_government_control_desc: "Negara-negara otonom di seluruh negeri harus dibatasi kebebasannya demi kebaikan bersama. Kita tidak bisa membiarkan mereka melemahkan persatuan kita dalam menghadapi ancaman fasis di luar negeri."
 SPR_reeducate_the_bourgeoisie: "Mendidik kembali kaum borjuis"
 SPR_reeducate_the_bourgeoisie_desc: "Front Populer telah mencapai tujuannya, dan waktunya telah tiba bagi kaum borjuis untuk dididik kembali dan dibebaskan dari kesalahpahaman ekonomi dan sosial mereka. Kami masih akan mengubah mereka menjadi warga negara yang layak."
 SPR_the_spanish_red_army: "Tentara Merah Spanyol"
 SPR_the_spanish_red_army_desc: "Tentara baru dan setia akan dibentuk untuk membela kepentingan pekerja Spanyol dari ancaman asing. Kami akan mencontoh hal ini seperti yang terjadi di Uni Soviet."
 SPR_expand_soviet_aid: "Perluas Bantuan Soviet"
 SPR_expand_soviet_aid_desc: "Kita tidak bisa menangani perang ini sendirian; kita harus mendapatkan bantuan internasional. [SOV.GetNameDefCap] harus dibuat memahami bahwa perjuangan kritis melawan fasisme sedang terjadi di Iberia, dan di sinilah kemajuan mereka harus dihentikan."
 SPR_expand_soviet_aid_tt: "§RBantuan Soviet akan memakan biaya yang besar, harus dibayar setelah perang saudara berakhir!§!"
 SPR_soviet_equipment_shipments: "Pengiriman Peralatan Soviet"
 SPR_soviet_equipment_shipments_desc: "Apa yang tidak dapat disediakan oleh industri dalam negeri kita harus dipenuhi dengan pengiriman senjata dari [SOV.GetNameDef]."
 SPR_soviet_military_advisors: "Penasihat Militer Soviet"
 SPR_soviet_military_advisors_desc: "Penasihat militer Soviet mungkin bisa memberikan pasukan dan pemimpin kita keunggulan yang mereka perlukan dalam menghadapi musuh."
 SPR_soviet_industrial_aid: "Bantuan Industri Soviet"
 SPR_soviet_industrial_aid_desc: "Pengiriman senjata saja tidak akan memenuhi kuota yang dibutuhkan pasukan garis depan kita. Bantuan Soviet dalam mengembangkan industri dalam negeri mungkin akan memungkinkan kita mengatasi perbedaan tersebut untuk saat ini, dan mungkin bahkan mencapai swasembada penuh pada akhirnya."
 SPR_soviet_technological_advancements: "Kemajuan Teknologi Soviet"
 SPR_soviet_technological_advancements_desc: "[SOV.GetNameDefCap] memiliki teknologi yang tidak kami miliki. Dengan tujuan mengalahkan fasisme, tentunya mereka bersedia berbagi kemajuan tersebut dengan kita?"
 SPR_soviet_recovery_aid: "Bantuan Pemulihan Soviet"
 SPR_soviet_recovery_aid_desc: "Dengan dimenangkannya perang, [SOV.GetNameDef] siap membantu kami dalam upaya pembangunan kembali."
 SPR_all_must_do_their_part: "Semua Harus Melakukan Bagiannya"
 SPR_all_must_do_their_part_desc: "Agar perjuangan sosialis berhasil, setiap orang harus berkontribusi terhadap perjuangan tersebut. Kami tidak mempunyai ruang untuk perpecahan internal di antara berbagai komune kami."
 SPR_the_red_tide: "Gelombang Merah"
 SPR_the_red_tide_desc: "Masyarakat kita tahu bahwa tujuan kita adil dan benar, dan yang harus kita lakukan hanyalah memanfaatkan sentimen ini untuk memastikan adanya perekrutan yang terus-menerus untuk merekrut anggota militer kita. Bagaikan gelombang merah, kekuatan kita akan menyapu siapapun yang menentang kita."
 SPR_arm_the_tide: "Persenjatai Gelombang"
 SPR_arm_the_tide_desc: "Tanpa peralatan yang memadai, semangat individu pekerja sosialis tidak akan berhasil dalam pertempuran. Kami akan memberi mereka alat perang yang mereka perlukan."
 SPR_against_fascism: "Melawan Fasisme"
 SPR_against_fascism_desc: "Musuh fasis mungkin telah dikalahkan di semenanjung Iberia, namun mereka masih ada di luar perbatasan kita. Kita harus bergabung dalam perjuangan internasional untuk memadamkannya untuk selamanya."
 SPR_doctrinal_advancements: "Kemajuan Doktrinal"
 SPR_doctrinal_advancements_desc: "Pembelajaran yang kita peroleh dari perang saudara dapat dikembangkan lebih lanjut menjadi doktrin militer baru yang lebih sesuai dengan realitas peperangan saat ini."
 SPR_lessons_from_the_civil_war: "Pelajaran dari Perang Saudara"
 SPR_lessons_from_the_civil_war_desc: "Perjuangan dalam perang saudara telah memberi kita banyak pelajaran tentang seni berperang. Bodoh sekali jika kita tidak menerapkan hal ini pada tentara model baru kita."
 SPR_nationalize_the_industry: "Nasionalisasi Industri"
 SPR_nationalize_the_industry_desc: "Daripada membiarkan industri kita terbuang sia-sia di tangan investor dan perusahaan, kita akan menempatkannya di bawah kendali negara, untuk mengarahkan dan mengatur produksi mereka dengan lebih baik."
 SPR_beacon_of_socialism: "Suar Sosialisme"
 SPR_beacon_of_socialism_desc: "Negara kita adalah mercusuar sosialisme yang cemerlang, yang pasti akan menarik para ilmuwan yang memiliki pemikiran serupa dan mempunyai keinginan untuk mengabdi pada perjuangan buruh."
 SPR_increase_arms_production: "Meningkatkan Produksi Senjata"
 SPR_increase_arms_production_desc: "Untuk mempertahankan cita-cita Komunisme, tentara kita memerlukan senjata. Kapasitas industri bangsa kita yang besar ini harus ditingkatkan agar kita bisa menyediakan senjata-senjata tersebut."
 SPR_exploit_spains_riches: "Eksploitasi Kekayaan Spanyol"
 SPR_exploit_spains_riches_desc: "Semenanjung Iberia kaya akan sumber daya alam. Eksploitasi hal-hal ini akan sangat memperkuat industri perang kita, sekaligus menghasilkan kekayaan yang dapat digunakan untuk membangun kembali negara kita."
 SPR_unify_the_london_bureau: "Satukan Biro London"
 SPR_unify_the_london_bureau_desc: "Sebagai reaksi terhadap pembentukan Internasional Ketiga dan perebutan kekuasaan antara Trotsky dan Stalin, Biro Internasional Persatuan Sosialis Revolusioner dibentuk, menolak kedua interpretasi Marxisme. Kami akan menghubungi kontak-kontak kami di sana untuk membentuk front persatuan Sosialisme melawan Trotskisme dan Stalinisme."
 SPR_against_trotskyism_and_stalinism: "Melawan Trotskisme dan Stalinisme"
 SPR_against_trotskyism_and_stalinism_desc: "Sudah terlalu lama perselisihan antara Trotsky dan Stalin serta pendukung mereka merusak persatuan dan integritas perjuangan sosialis. Jika mereka tidak bisa mengesampingkan perbedaan mereka, maka kita harus menghilangkan pengaruh mereka."
 SPR_against_trotskyism_and_stalinism_tt: "Mendapatkan §Y$puppet_wargoal_focus$§! tujuan perang melawan §YStalinis§! atau §YTrotskyis Uni Soviet§! atau §YMeksiko§!."
 SPR_red_bulwark_in_the_west: "Benteng Merah di Barat"
 SPR_red_bulwark_in_the_west_desc: "Posisi geografis kami terisolasi dari sekutu kami. Jika kami diserang, terutama oleh kekuatan angkatan laut yang kuat, kami tidak akan dapat mengandalkan bantuan dari [SOV.GetNameDef]. Oleh karena itu, kita harus memastikan bahwa pertahanan kita sedemikian rupa sehingga kita dapat bertindak sebagai benteng sosialisme; jangkar baratnya di Eropa."
 SPR_appeal_for_increased_autonomy: "Seruan untuk Peningkatan Otonomi"
 SPR_appeal_for_increased_autonomy_desc: "Harga dari bantuan [SOV.GetAdjective] yang memungkinkan kemenangan kami adalah sikap tunduk. Kami telah terbukti menjadi pembela sosialisme yang loyal dan cakap, dan hal ini tentunya diakui di Moskow. Mungkin kita bisa meyakinkan mereka untuk melonggarkan kendali."
 SPR_modernize_the_armed_forces: "Modernisasi Angkatan Bersenjata"
 SPR_modernize_the_armed_forces_desc: "Posisi kita yang lemah di Eropa Barat akan semakin diperkuat dengan pengembangan senjata dan peralatan baru untuk angkatan bersenjata kita."
 SPR_a_red_iberia: "Iberia Merah"
 SPR_a_red_iberia_desc: "Waktunya telah tiba untuk menyatukan seluruh semenanjung Iberia di bawah panji sosialisme."
 SPR_support_french_communists: "Mendukung Komunis Perancis"
 SPR_support_french_communists_desc: "[FRA.GetNameDefCap] memiliki sejarah sentimen komunis baru-baru ini. Jika mereka melihat kebijaksanaan dalam kerja sama kita dalam mencapai tujuan buruh maka kita akan menggabungkan kekuatan, namun jika mereka tidak begitu paham, maka kita harus membawa sosialisme kepada mereka dengan paksa."
 SPR_avenge_foreign_interference: "Membalas Campur Tangan Asing"
 SPR_avenge_foreign_interference_desc: "Kekuatan asing ikut campur dalam perang saudara melawan kami, mendukung musuh-musuh fasis kami. Kami tidak melupakan hal ini, dan jawaban kami akhirnya sudah dekat."
 SPR_avenge_foreign_interference_tt: "Memberikan tujuan perang pada semua negara yang mengirimkan sukarelawan ke Nasionalis selama perang saudara."
 SPR_provide_for_the_people: "Menyediakan untuk Rakyat"
 SPR_provide_for_the_people_desc: "Hal pertama yang harus dilakukan adalah memastikan pasokan makanan bagi masyarakat kita. Kemenangan kita tidak boleh dibayangi oleh bencana kelaparan."
 SPR_collectivize_industry: "Kolektivisasi Industri"
 SPR_collectivize_industry_desc: "Kolektivisasi industri akan berfungsi untuk lebih meningkatkan produktivitas dan semangat kerja pekerja."
 SPR_connect_the_country: "Hubungkan Negara"
 SPR_connect_the_country_desc: "Sebuah proyek infrastruktur besar yang mencakup seluruh negeri akan memastikan pergerakan barang yang cepat antara daerah-daerah paling terpencil di semenanjung. Ini hanya akan menguntungkan kita dalam jangka panjang."
 SPR_transplant_soviet_industry: "Transplantasi Industri Soviet"
 SPR_transplant_soviet_industry_desc: "Soviet telah menunjukkan diri mereka sangat mahir dalam merelokasi seluruh pabrik, bahkan dalam jarak ribuan kilometer. Untuk memulai industri militer dalam negeri, kami akan meminta pemindahan beberapa pabrik mereka yang kurang penting ke semenanjung Iberia."
 SPR_the_five_year_plan: "Rencana Lima Tahun"
 SPR_the_five_year_plan_desc: "Sebuah rencana baru yang berani akan mewujudkan transformasi negara Spanyol menjadi pusat industri lokal dalam jangka waktu tidak lebih dari lima tahun."
 SPR_slipway_enlargement: "Pembesaran Slipway"
 SPR_slipway_enlargement_desc: "Untuk membangun kapal militer yang lebih besar, kita harus mempertimbangkan perluasan fasilitas galangan kapal."
 SPR_a_red_fleet: "Armada Merah"
 SPR_a_red_fleet_desc: "Angkatan laut yang kuat diperlukan untuk melakukan bagian kita dalam menyebarkan sosialisme ke seluruh dunia. Pembangunan Armada Merah kita dimulai hari ini."
 SPR_maintain_the_second_republic: "Pertahankan Republik Kedua"
 SPR_maintain_the_second_republic_desc: "Militer yang memberontak belum berhasil dalam upaya kudetanya, dan pemerintah kami mempertahankan kemampuannya untuk memerintah dengan bebas. Republik Kedua akan menang melawan ancaman dari kelompok Kanan, sama seperti yang menang atas pemogokan para penambang pada tahun 1934."
 SPR_new_leadership: "Kepemimpinan Baru"
 SPR_new_leadership_desc: "Kepemimpinan baru diperlukan agar Republik dapat bertahan dalam masa-masa sulit ini. Kami akan menghadirkan para penasihat dan menteri dengan perspektif baru tentang cara terbaik memerangi ancaman fasis, sehingga memungkinkan kami menjaga prinsip dan keyakinan kami dengan lebih baik."
 SPR_the_future_of_the_republic: "Masa Depan Republik"
 SPR_the_future_of_the_republic_desc: "Perjuangan saat ini tidak diragukan lagi akan dilihat sebagai hal yang menentukan dampaknya terhadap masa depan Republik. Kita tidak boleh menyia-nyiakan upaya atau biaya apa pun untuk memastikan kita membentuk masa depan ini dengan tepat."
 SPR_petition_for_french_aid: "Petisi untuk Bantuan Perancis"
 SPR_petition_for_french_aid_desc: "Negara-negara tetangga kami di utara ragu-ragu dalam keinginan mereka untuk memberikan bantuan kepada kami, karena takut akan kemungkinan terjadinya kerusuhan internal jika mereka mengambil tindakan apa pun. Kita tidak bisa membiarkan mereka tetap ragu-ragu; kelangsungan hidup kita bergantung pada kesediaan mereka untuk bertindak."
 SPR_petition_for_french_aid_tt: "§R[FRA.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 SPR_ensure_loyalty: "Pastikan Loyalitas"
 SPR_ensure_loyalty_desc: "Pemerintah telah dikhianati secara brutal oleh militernya. Langkah pertama untuk memperbaiki luka ini adalah memastikan loyalitas semua petugas yang selanjutnya kami tunjuk."
 SPR_enlist_the_carabineros: "Daftarkan Carabineros"
 SPR_enlist_the_carabineros_desc: "Sebagai tindakan sementara untuk menjaga garis depan, kita harus beralih ke solusi yang tidak lazim. Tanpa militer, Carabineros, pasukan penjaga perbatasan paramiliter dan pasukan bea cukai, akan berfungsi sebagai kekuatan yang sama baiknya untuk menjaga parit."
 SPR_enlist_the_carabineros_tt: "Dapatkan 1 unit dengan §Y3 batalyon Infanteri§! di 5 negara bagian acak."
 has_hired_juan_negrin_tt: "§YJuan Negrín§!: Dipekerjakan sebagai penasihat"
 SPA_embrace_pan_hispanism: "Rangkullah Nasionalisme Pan-Hispanik"
 SPA_embrace_pan_hispanism_desc: "Dalam beberapa tahun terakhir, telah terjadi lonjakan Panhispanisme di seluruh koloni lama kita, dan sekarang dengan keberhasilan kampanye penaklukan kembali kita, inilah saatnya untuk menerima ide-ide mereka, sehingga Kekaisaran Spanyol dapat bertahan selama seribu tahun lagi!"
 SPA_embrace_pan_hispanism_tt: "Kami mengontrol setiap status inti §Y[CHL.GetName]§!, §Y[ARG.GetName]§!, §Y[ECU.GetName]§!, §Y[PRU.GetName]§!, §Y[URG.GetName]§!, §Y[PAR.GetName]§!, §Y[BOL.GetName]§!, §Y[COL.GetName]§!, §Y[VEN.GetName]§!, §Y[PAN.GetName]§!, §Y[COS.GetName]§!, §Y[NIC.GetName]§!, §Y[HON.GetName]§!, §Y[ELS.GetName]§!, §Y[GUA.GetName]§!, §Y[MEX.GetName]§!, §Y[DOM.GetName]§!, §Y[CUB.GetName]§! dan §Y[PUE.GetName]§!."
 SPA_absorb_the_portuguese_empire_tt: "Kami akan mendapatkan inti pada §YPortugis§! inti apa pun yang kami kendalikan"
 SPR_the_popular_army: "Tentara Populer"
 SPR_the_popular_army_desc: "Tentara baru kita akan terdiri dari mereka yang tidak ternoda oleh pengkhianatan militer; mereka yang berada di antara masyarakat yang bersemangat dalam membela prinsip-prinsip yang mendasari Republik ini dibangun, namun mungkin belum pernah mengabdi sebelumnya. Ditambah dengan reorganisasi ini, kami juga akan mengembangkan senjata dan doktrin baru untuk membantu pasukan baru ini dalam perjuangan mereka."
 SPR_take_the_initiative: "Ambil Inisiatif"
 SPR_take_the_initiative_desc: "Kita tidak bisa berdiam diri sementara musuh memilih kapan dan di mana menyerang kita. Perang dimenangkan dengan menunjukkan inisiatif, dan itulah yang harus kita lakukan."
 SPR_no_pasaran: "¡Tidak ada Pasaran!"
 SPR_no_pasaran_desc: "Biarlah keyakinan anti-fasis bergema dari setiap rumah di setiap kota; dari setiap atap hingga setiap jalan; dari setiap barikade hingga setiap parit: \"¡Tidak Ada Pasarán!\" - mereka tidak akan lewat!"
 SPR_no_pasaran_tt: "Tempatkan §Y1 Fort§! di semua provinsi dengan §Y1 Victory Point§! di negara bagian yang dikontrol.\nTempatkan §Y2 Forts§! di semua provinsi dengan §Y3 Victory Points§! di negara bagian yang dikontrol.\nTempatkan §Y3 Benteng§! di semua provinsi dengan §Y10 Poin Kemenangan§! di negara bagian yang dikuasai.\nTempatkan §Y4 Benteng§! di semua provinsi dengan §Y30 Poin Kemenangan§! atau lebih terkendali negara bagian."
 SPR_a_frontline_suited_for_intellectuals: "Garis Depan yang Cocok untuk Intelektual"
 SPR_a_frontline_suited_for_intellectuals_desc: "Sungguh sia-sia bagi pikiran kita yang paling cerdas untuk memerangi fasis di garis depan – mereka dapat dimanfaatkan dengan lebih baik jauh di belakang garis; menciptakan alat perang baru yang akan memberi manfaat lebih besar bagi perjuangan kita daripada yang bisa diberikan oleh beberapa tentara tambahan."
 SPR_strengthen_the_anti_fascist_coalition: "Memperkuat Koalisi Anti-Fasis"
 SPR_strengthen_the_anti_fascist_coalition_desc: "Kita telah menghilangkan pihak-pihak yang berbeda pendapat dalam koalisi kita - semoga ini berarti kita sekarang dapat fokus pada penguatan tekad bersatu dalam memberantas fasisme."
 SPR_oppose_the_communists: "Menentang Komunis"
 SPR_oppose_the_communists_desc: "Komunis hanyalah sekutu penting dalam perjuangan melawan fasisme. Setelah itu selesai, kita harus menghadapinya dengan cara kita sendiri."
 SPR_fortify_the_central_government: "Memperkuat Pemerintah Pusat"
 SPR_fortify_the_central_government_desc: "Kita harus memperkuat pemerintah terhadap pengaruh komunis, jangan sampai mereka secara diam-diam mengambil kendali Republik dari dalam."
 SPR_secure_democratic_principles: "Mengamankan Prinsip Demokrasi"
 SPR_secure_democratic_principles_desc: "Kita tidak bisa membiarkan pengaruh komunis mengubah atau bahkan menghancurkan prinsip-prinsip yang mendasari berdirinya Republik Kedua – tidak peduli hubungan kita dengan komunis atau [SOV.GetNameDef], prinsip-prinsip ini harus tertanam dalam hati kita, atau bahkan secara terbuka."
 SPR_subvert_soviet_control: "Menumbangkan Kontrol Soviet"
 SPR_subvert_soviet_control_desc: "Harga dari bantuan [SOV.GetAdjective] yang memungkinkan kemenangan kami adalah sikap tunduk, sehingga tampaknya penderitaan kami belum berakhir. Kami akan mulai melemahkan upaya [SOV.GetAdjective] untuk menyebarkan pengaruh komunis di negara kami, sebagai persiapan untuk perjuangan terakhir demi kebebasan dan kemerdekaan kami."
 SPR_subvert_soviet_control_tt: "§R[SOV.GetNameDefCap] kemungkinan besar akan mengambil tindakan hukuman akibat ketidaktaatan kita!§!"
 SPR_war_of_independence: "Perang Kemerdekaan"
 SPR_war_of_independence_desc: "Waktunya telah tiba bagi kita untuk berpaling dari sekutu lama kita, jangan sampai kita berubah menjadi negara anggota Uni Eropa yang lain. Upaya besar terakhir diperlukan dari rakyat kita untuk mencapai hadiah akhir berupa kebebasan dari otoritarianisme kiri dan kanan."
 SPR_war_of_independence_tt: "§RJika mereka tidak menerima tuntutan kita maka akan terjadi perang!§!"
 SPR_those_who_would_not_help_us: "Mereka yang Tidak Mau Membantu Kami"
 SPR_those_who_would_not_help_us_desc: "Kita ditinggalkan oleh Barat dalam perjuangan kita melawan kaum fasis, namun keadaan telah berubah sejak saat itu, dan mereka mendapati diri mereka dalam perang mereka sendiri. Kini kami kembali membutuhkan bantuan mereka, dan mungkin kali ini mereka telah belajar untuk memperhatikan kami ketika kami membentuk garda depan melawan musuh baru."
 SPR_those_who_would_not_help_us_tt: "§RNegara harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 SPR_ideological_allies: "Sekutu Ideologis"
 SPR_ideological_allies_desc: "Spanyol telah ditempa kembali dalam wadah perang saudara - kami akan berdiri bersama sekutu ideologis kami melawan ekstremisme sayap kanan dan sayap kiri."
 SPR_enemies_of_our_enemy: "Musuh dari Musuh Kita"
 SPR_enemies_of_our_enemy_desc: "Meskipun mereka telah membantu musuh-musuh kita selama perang saudara, kita sekarang mempunyai musuh yang sama. Mungkin inilah saatnya untuk mengesampingkan perbedaan-perbedaan kita sampai pertarungan yang lebih besar dapat dimenangkan."
 SPR_deal_with_the_devil: "Berurusan Dengan Iblis"
 SPR_deal_with_the_devil_desc: "Jerman memiliki banyak pengalaman melawan Soviet, dan meskipun kita tidak pernah bisa menyetujui aliansi formal, mungkin pertukaran pengetahuan militer mereka dapat memberi kita keuntungan yang jelas dalam upaya perang kita melawan musuh bersama."
 SPR_deal_with_the_devil_tt: "§R[GER.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!"
 SPR_foreign_industrial_aid: "Bantuan Industri Asing"
 SPR_foreign_industrial_aid_desc: "Dengan berlakunya pakta baru ini, kita akan menarik pengusaha asing untuk berinvestasi di negara kita dan membantu rekonstruksi kita."
 SPR_stabilize_the_nation: "Stabilkan Bangsa"
 SPR_stabilize_the_nation_desc: "Kita telah berhasil keluar dari perang saudara dengan penuh kemenangan, namun sekarang kita harus memastikan bahwa stabilitas telah kembali dan hal ini tidak dapat terjadi lagi."
 SPR_end_fascism_at_all_costs: "Akhiri Fasisme Dengan Segala Cara"
 SPR_end_fascism_at_all_costs_desc: "Tidak ada yang lebih penting selain kehancuran total kaum fasis – jika kita harus menjual jiwa kita kepada komunisme untuk mencapai hal ini, biarlah."
 SPR_communists_in_the_government: "Komunis di Pemerintahan"
 SPR_communists_in_the_government_desc: "Pengaruh komunis dalam pemerintahan telah berkembang sedemikian rupa sehingga mereka kini menuntut perubahan total dalam kepemimpinan untuk mencerminkan realitas baru di Republik ini."
 SPR_communists_in_the_government_tt: "Para menteri Stalinis menjadi §Gtersedia§!, namun para menteri Partai Demokrat §Rdicopot§!."
 SPR_restore_higher_education: "Pulihkan Pendidikan Tinggi"
 SPR_restore_higher_education_desc: "Institusi-institusi pendidikan tinggi yang rusak selama perang harus dibangun kembali dan diperluas, untuk memastikan pasokan orang-orang cerdas bagi industri kita."
 SPR_engineering_advances: "Kemajuan Teknik"
 SPR_engineering_advances_desc: "Kemajuan baru di bidang teknik memungkinkan pembangunan industri yang lebih baik, serta jenis pesawat dan baju besi baru."
 SPR_rebuild_the_nation: "Membangun Kembali Bangsa"
 SPR_rebuild_the_nation_desc: "Setelah Perang Saudara yang mengerikan, stabilitas telah kembali dan perlahan-lahan kita mendapatkan kembali pijakan industri kita. Periode investasi besar-besaran dalam program perluasan industri tidak diragukan lagi akan memberikan dorongan yang dibutuhkan perekonomian kita untuk kembali memperoleh daya tarik."
 SPR_reprofessionalize_the_military: "Memprofesionalkan kembali Militer"
 SPR_reprofessionalize_the_military_desc: "Sesuai kebutuhan, tentara kita telah dibangun kembali dari mereka yang tidak terdidik dalam disiplin kehidupan militer yang ketat. Untuk mengubah tentara kita dari kekuatan darurat sementara menjadi militer nasional yang sesungguhnya, kita harus memprofesionalkannya kembali dan menanamkan disiplin dan struktur komando yang tepat."
 SPR_experiences_from_the_civil_war: "Pengalaman dari Perang Saudara"
 SPR_experiences_from_the_civil_war_desc: "Pengalaman militer kita selama perang saudara telah menghasilkan kemajuan baru yang dramatis dalam pemikiran militer dan pengembangan peralatan."
 SPR_a_new_military_academy: "Akademi Militer Baru"
 SPR_a_new_military_academy_desc: "Untuk mencapai tujuan kita untuk membentuk militer nasional yang benar-benar profesional, kita harus mendirikan akademi baru, yang memastikan bahwa para perwira kita adalah yang terbaik yang mereka bisa."
 SPR_revive_the_republican_navy: "Bangkit kembali Angkatan Laut Republik"
 SPR_revive_the_republican_navy_desc: "Angkatan laut kita sama terguncangnya dengan dimulainya perang saudara seperti halnya tentara kita, dan pembangunan kembali angkatan laut kita harus menjadi prioritas bagi keamanan nasional negara kita. Hal ini memerlukan pembangunan infrastruktur baru, yang akan segera kami mulai."
 SPR_navy_modernization: "Modernisasi Angkatan Laut"
 SPR_navy_modernization_desc: "Salah satu manfaat dari kerugian yang kita alami adalah kita tidak punya alasan untuk menahan diri dalam membangun model kapal baru dan modern. Kita harus menanyakan tentang desain yang sesuai dan segera memastikan konstruksinya."
 SPR_expand_the_naval_academy: "Perluas Akademi Angkatan Laut"
 SPR_expand_the_naval_academy_desc: "Perang saudara telah menunjukkan kekurangan dalam kepemimpinan angkatan laut kita. Peningkatan kualitas akademi angkatan laut kita, serta peningkatan ukurannya, akan memastikan kesalahan taktis dan strategis yang merugikan ini menjadi jauh lebih kecil kemungkinannya di masa depan."
 SPR_prepare_for_the_next_war: "Bersiaplah untuk Perang Berikutnya"
 SPR_prepare_for_the_next_war_desc: "Industri militer kita harus diperluas jika kita ingin berdiri kokoh melawan berbagai ancaman asing terhadap negara kita yang dilanda perang. Kita harus bersiap menghadapi apa pun yang mungkin terjadi."
 SPR_wartime_industry: "Industri Masa Perang"
 SPR_wartime_industry_desc: "Kita sekali lagi berada dalam kondisi perang, sehingga kita harus memastikan ekspansi industri kita terfokus pada pemenuhan kebutuhan militer dibandingkan kebutuhan sipil."
 SPR_fuel_for_the_war_machine: "Bahan Bakar untuk Mesin Perang"
 SPR_fuel_for_the_war_machine_desc: "Sumber daya sangat penting bagi industri perang kita, dan semakin kita mampu memenuhi kebutuhan ini secara mandiri, semakin baik. Dengan membangun tambang baru, pabrik baja, dan pabrik peleburan aluminium di seluruh negeri, kita akan mampu mencapai swasembada."
 SPR_join_the_global_fight_against_fascism: "Bergabunglah dalam Perjuangan Global Melawan Fasisme"
 SPR_join_the_global_fight_against_fascism_desc: "Kita telah mengalahkan fasisme di Spanyol, namun fasisme masih ada di negara-negara lain di seluruh dunia. Adalah tugas kita untuk melihat pertarungan ini sampai akhir."
 SPR_the_anti_fascist_crusade: "Perang Salib Anti-Fasis"
 SPR_the_anti_fascist_crusade_desc: "Spanyol memerangi kaum fasis jauh sebelum orang lain menyadari bahayanya. Perjuangan ini adalah perjuangan kita, dan kita tidak akan berhenti sampai kita memenangkannya."
 FRA_devalue_the_franc_desc: "Meskipun negara-negara lain membiarkan mata uang mereka menjadi kurang berharga untuk membantu perekonomian mereka, kami dengan tegas menolaknya. Akibatnya, perekonomian kita tertinggal dibandingkan negara lain. Jika kita ingin menjadi lebih kompetitif dan mampu menghadapi badai yang akan datang, kita tidak boleh mengabaikan devaluasi mata uang kita, bahkan jika hal tersebut terbukti merupakan tindakan yang tidak populer."
 FRA_autoroutes: "Rute Otomatis"
 FRA_autoroutes_desc: "Jerman telah memukau dunia dengan konsep jalan berkecepatan tinggi dan akses terbatas yang menghubungkan berbagai wilayah di negara mereka. Kita bisa menunjukkan kepada dunia bahwa kita juga bisa melakukannya."
 FRA_invest_in_the_metropole: "Mengembangkan Metropole"
 FRA_invest_in_the_metropole_desc: "Langkah pertama kita dalam membangun kembali industri kita adalah dengan meningkatkan basis industri di wilayah kontinental kita."
 FRA_invest_in_the_colonies: "Kembangkan Koloni"
 FRA_invest_in_the_colonies_desc: "Pusat industri kita di Eropa tidak memiliki populasi dan sumber daya untuk menopang ekspansi industri besar-besaran. Jika perekonomian kita ingin bersaing dengan negara-negara lain di dunia, kita harus memanfaatkan wilayah jajahan kita."
 FRA_colonial_industry_effect_tt: "Menambahkan dua §YPabrik Sipil§! ke setiap negara kolonial yang sebelumnya berinvestasi di."
 FRA_industrial_expansion_effect_tt: "Menambahkan dua §YPabrik Sipil§! ke negara bagian metropolitan yang sebelumnya diinvestasikan di."
 FRA_military_factories_effect_tt: "Menambahkan dua §YPabrik Militer§! ke setiap negara bagian yang sebelumnya diinvestasikan di."
 FRA_invest_in_west_africa: "Berinvestasi di Afrika Barat"
 FRA_invest_in_west_africa_desc: "Cadangan pekerja dan sumber daya yang sangat besar di Afrika bagian barat menjadikannya kandidat yang tepat untuk investasi."
 FRA_invest_in_indochina: "Berinvestasi di Indochina"
 FRA_invest_in_indochina_desc: "Jarak yang jauh antara kepemilikan kami di Indochina dan wilayah inti kami mungkin tampak seperti sebuah kelemahan, namun hal ini juga melindungi industri mana pun di sana dari serangan musuh."
 FRA_invest_in_syria: "Berinvestasi di Suriah"
 FRA_invest_in_syria_desc: "Suriah berada pada posisi yang tepat untuk memasok kebutuhan kita jika terjadi perang di Eropa atau Afrika. Meningkatkan potensi industrinya juga akan mendukung posisi kami di kawasan tersebut."
 FRA_global_integration: "Integrasi Global"
 FRA_global_integration_desc: "Kerajaan Inggris adalah sistem bagian-bagian yang saling mendukung yang disesuaikan dengan baik. Tidak ada yang mengatakan bahwa kita tidak bisa berbuat baik terhadap koloni kita."
 FRA_begin_rearmament: "Mulailah Persenjataan Kembali"
 FRA_begin_rearmament_desc: "Gencatan senjata selama 20 tahun yang diramalkan Marshall Foch pada tahun 1919 akan segera berakhir, dan dunia tampaknya semakin mungkin akan dilanda perang dalam beberapa tahun mendatang. Kami harus siap."
 FRA_firepower_kills: "Daya Tembak Membunuh"
 FRA_firepower_kills_desc: "Pelajaran dari Perang Besar sangatlah sederhana dan kejam: hari-hari di mana manusia saling bertarung demi memperebutkan tempat terbuka telah berakhir. Saat ini, pembunuhan dilakukan dalam skala massal dengan senjata paling modern dan jarak jauh."
 FRA_methodical_battle: "Pertempuran Metodis"
 FRA_methodical_battle_desc: "Beberapa orang menyatakan bahwa pertempuran adalah kekacauan, namun mereka bodoh. Pertarungan tidak lain adalah penerapan metodis dari alat yang tepat berdasarkan rencana keseluruhan. Rencanakan dengan baik, dan niat musuh mungkin juga menjadi catatan sejarah."
 FRA_division_cuirassee: "Divisi Cuirassée"
 FRA_division_cuirassee_desc: "Seorang perwira yang giat bernama de Gaulle telah mengusulkan divisi jenis baru, menggabungkan lapis baja berat dengan infanteri dan tank menengah untuk bertarung sebagai satu kesatuan."
 FRA_infantry_tanks: "Tank Infanteri"
 FRA_infantry_tanks_desc: "Apa pun yang lainnya, tugas pertama dan terakhir tank adalah memungkinkan infanteri mengambil alih dan mempertahankan wilayah. Oleh karena itu, kita harus selalu melengkapi unit infanteri kita dengan tank yang modern dan mumpuni."
 FRA_special_forces: "Pasukan Khusus"
 FRA_special_forces_desc: "Di masa depan, perang akan semakin sering terjadi di wilayah di mana pasukan infanteri biasa akan mencapai batas kemampuannya. Kita harus menciptakan formasi baru yang lebih mumpuni dan mampu tampil dalam kondisi seperti ini."
 FRA_fusiliers_marine: "Marinir Fusiliers"
 FRA_fusiliers_marine_desc: "Masa-masa pesisir sebagai pertahanan yang tidak dapat ditembus telah berakhir. Di masa depan, kita harus mampu melakukan perlawanan terhadap musuh, di mana pun mereka berada, dan merebut tempat pendaratan melawan oposisi apa pun."
 FRA_battle_of_maneuver: "Pertempuran Manuver"
 FRA_battle_of_maneuver_desc: "Gagasan lama tentang medan perang sebagai area kecil tempat terjadinya bentrokan tentara sudah mati. Dengan motorisasi massal, pesawat terbang, dan komunikasi radio yang cepat, pertempuran berlangsung cepat dalam jarak ratusan kilometer. Semakin cepat kita mempersiapkan hal ini, semakin baik."
 FRA_air_dominance_desc: "Perkembangan pesawat terbang telah menciptakan sayap ketiga yang perlu dikhawatirkan oleh tentara. Kita harus mengamankan sisi ini atau menghadapi bencana."
 FRA_air_ground_cooperation: "Kerjasama Udara- Darat"
 FRA_air_ground_cooperation_desc: "Pertempuran di udara hanya akan memberikan hasil militer yang nyata jika dilakukan untuk mencapai tujuan di darat. Semakin baik kita mengintegrasikan pertempuran di udara dan pertempuran di darat, maka kita akan semakin efektif."
 FRA_flying_artillery_desc: "Dalam pertempuran yang bergerak cepat saat ini, artileri lambat di darat mungkin tidak mampu mengimbanginya. Pesawat terbang yang membawa bom dapat mengambil alih peran mereka."
 FRA_form_the_popular_front: "Bentuk Front Populer"
 FRA_form_the_popular_front_desc: "Dengan bangkitnya fasisme di Jerman dan Italia, menjadi jelas bahwa pertikaian di kalangan sayap kiri harus dihentikan jika perjuangan kita ingin bertahan. Front kerakyatan yang luas dan terdiri dari semua partai sayap kiri akan mempunyai mandat kerakyatan untuk pada akhirnya mengatasi kondisi ekonomi yang menciptakan fasisme."
 FRA_ban_communism_desc: "Meskipun tidak dapat dibayangkan bahwa ada orang yang benar-benar ingin melihat kekacauan dan pertumpahan darah akibat revolusi komunis di tanah air mereka sendiri, nampaknya ada beberapa di antara kita yang mau melakukan hal tersebut. Kita tidak bisa lagi membiarkan mereka bersekongkol melawan negara. Tindakan paling keras harus diambil."
 FRA_invite_communist_ministers: "Undang Menteri Komunis"
 FRA_invite_communist_ministers_desc: "Ketakutan akan reaksi balik dari sayap kanan radikal menghalangi masuknya komunis ke dalam pemerintahan yang sebenarnya. Tapi rasa takut adalah penasihat yang buruk. Jika kita harus menghadapi bentrokan ini, biarkan mereka datang."
 FRA_strengthen_the_unions: "Perkuat Serikat Pekerja"
 FRA_strengthen_the_unions_desc: "Sudah terlalu lama hak pekerja untuk bersatu dengan kawan-kawannya untuk melakukan perundingan bersama dibiarkan terbuka untuk diserang. Tidak lebih."
 FRA_celebrate_the_commune: "Rayakan Komune"
 FRA_celebrate_the_commune_desc: "Meskipun berumur pendek, Komune Paris adalah upaya pertama untuk menciptakan masyarakat komunis di tanah Prancis."
 FRA_womens_suffrage_desc: "Sungguh tidak masuk akal sekaligus memalukan bahwa perempuan pekerja keras di Perancis, yang berkali-kali berjuang di barikade untuk mendapatkan hak-hak mereka, tidak diizinkan untuk memberikan suara mereka dalam pemilu. Kami akan memberantas ketidakadilan ini."
 FRA_legal_equality: "Kesetaraan Hukum"
 FRA_legal_equality_desc: "Dalam segala hal, perempuan masih dianggap sebagai warga kelas dua dan selalu tunduk pada kehendak laki-laki. Omong kosong ini berakhir sekarang."
 FRA_industrial_collectivization: "Kolektivisasi Industri"
 FRA_industrial_collectivization_desc: "Perekonomian Perancis saat ini terdiri dari perusahaan-perusahaan kecil dengan sedikit karyawan, yang selalu bersaing satu sama lain dan menyedot sumber daya dalam produksi skala kecil yang tidak efisien. Perusahaan-perusahaan kecil ini akan kita gabungkan hingga akhirnya tercipta perusahaan yang mampu bersaing di kancah dunia."
 FRA_agricultural_collectivization_desc: "Apa yang berlaku bagi industri juga berlaku bagi para petani di seluruh Perancis. Peternakan kecil tidak mampu membeli peralatan modern, dan sebagian besar bekerja seperti yang dimiliki kakek buyut mereka. Dengan menggabungkannya ke dalam unit produksi pertanian, kita akan meningkatkan efisiensi dan output."
 FRA_force_the_issue: "Paksa Masalahnya"
 FRA_force_the_issue_desc: "Kita telah mencapai kemajuan sejak kita membentuk Front Populer. Tapi kita tidak bisa membiarkan pekerjaan kita setengah selesai. Sudah waktunya bagi semua orang di sayap kiri untuk membuat pilihan dan mengambil sikap – baik mendukung revolusi atau menentangnya."
 FRA_force_the_issue_tt: "Hukuman stabilitas tergantung pada popularitas Partai §YDemokrat§!."
 FRA_reconciliation: "Rekonsiliasi"
 FRA_reconciliation_desc: "Di masa lalu, revolusi Perancis sering kali menjerumuskan negara ini ke dalam teror revolusioner dan kontra-revolusioner yang tiada habisnya. Mungkin inilah waktunya untuk membangun sebuah republik di mana setiap orang mempunyai tempatnya masing-masing, baik mereka mendukung revolusi atau tidak."
 FRA_constitutional_convention: "Konvensi Konstitusi"
 FRA_constitutional_convention_desc: "Pergeseran mendasar dalam sifat republik kita tidak dapat dilakukan dalam semalam, dan tidak dapat dilakukan tanpa merundingkan konstitusi baru."
 FRA_anti_fascist_coalition: "Koalisi Anti-Fasis"
 FRA_anti_fascist_coalition_desc: "Ancaman terbesar terhadap kemajuan adalah penyebaran fasisme reaksioner. Kita harus mendukung setiap negara yang bersedia memerangi ancaman ini, atau tidak akan ada hari esok bagi kita semua."
 FRA_invite_anti_fascist_emigrants: "Undang Imigran Anti-Fasis"
 FRA_invite_anti_fascist_emigrants_desc: "Langkah pertama yang diambil setiap rezim fasis adalah mengasingkan para pengkritiknya dan orang-orang yang dapat memberikan visi alternatif tentang bagaimana negara ini dapat diorganisir. Namun, orang-orang ini juga sangat cocok untuk membentuk pemerintahan di pengasingan untuk mempersiapkan hari pembebasan negara mereka."
 FRA_reconnect_to_the_balkans: "Hubungkan kembali ke Balkan"
 FRA_reconnect_to_the_balkans_desc: "Prancis telah lama berupaya menyeimbangkan kekuatan Eropa tengah dengan menjangkau negara-negara Balkan. Koneksi ini masih ada, meskipun baru-baru ini dibiarkan terputus."
 FRA_pre_empt_the_fascist_attack: "Cegah Serangan Fasis"
 FRA_pre_empt_the_fascist_attack_desc: "Mengapa kita harus membiarkan musuh bersiap dengan damai dan memilih momen di mana serangan yang tak terhindarkan akan terjadi pada saat yang paling menguntungkan bagi mereka? Kami akan menyerang lebih dulu, dan menghancurkan ancaman ini sebelum ada waktu untuk bersiap."
 FRA_loyalty_to_moscow: "Loyalitas Kepada Moskow"
 FRA_loyalty_to_moscow_desc: "Model Sosialisme yang dipraktikkan di Uni Soviet mungkin tidak sempurna, namun tidak ada keraguan bahwa Uni Soviet telah mencapai tingkat tertinggi penerapan ide-ide sosialis. Bodoh jika kita mencoba dan menemukan jalan kita sendiri."
 FRA_league_of_french_bolshevist_volunteers_desc: "Ketika satu negara sosialis berada di bawah ancaman penjajah asing, semua negara sosialis berada di bawah ancaman. Kita tidak boleh duduk diam sementara rekan-rekan kita berjuang untuk hidup mereka."
 FRA_host_the_german_exiles: "Tuan rumah bagi orang-orang buangan Jerman"
 FRA_host_the_german_exiles_desc: "Jerman, tempat lahirnya Marx dan Engels, pernah menjadi garda depan pemikiran dan praktik komunis. Banyak komunis Jerman yang melarikan diri ketika Nazi mengambil alih kekuasaan. Jika kita memberi mereka rumah, mereka dapat membantu kita mengatur pemerintahan yang lebih efektif di wilayah-wilayah yang telah dibebaskan."
 FRA_revolution_to_the_utmost: "Revolusi Semaksimal mungkin"
 FRA_revolution_to_the_utmost_desc: "Sebuah revolusi yang dibiarkan setengah jadi bukanlah sebuah revolusi sama sekali. Kita tidak boleh berhenti sampai tindakan tersebut selesai dan sistem politik baru aman. Berapa pun biayanya."
 FRA_destroy_the_counter_revolution: "Hancurkan Kontra-Revolusi"
 FRA_destroy_the_counter_revolution_desc: "Bahkan sekarang, beberapa orang di Prancis bersiap untuk menusukkan belati ke punggung rakyatnya sendiri ketika mereka menunjukkan kelemahan sedetik pun. Kami tidak akan membiarkan mereka, dan akan menyerang terlebih dahulu."
 FRA_revolutionary_zeal_desc: "Rakyat Perancis selalu mempunyai semangat khusus untuk memberantas tatanan lama dan membangkitkan tatanan baru. Hal ini tidak perlu dikecilkan."
 FRA_loyalty_to_the_cause: "Loyalitas Pada Tujuan"
 FRA_loyalty_to_the_cause_desc: "Negara-negara lain mungkin merumuskan visi Komunisme mereka sendiri, namun tidak ada alasan mengapa kita harus berkompromi dengan visi kita sendiri. Mereka mungkin berhenti di tengah jalan, diliputi keraguan apakah tujuan yang mereka ambil bisa dibenarkan. Kami tidak akan melakukannya."
 FRA_carry_the_revolution_north: "Membawa Revolusi ke Utara"
 FRA_carry_the_revolution_north_desc: "Di seberang Selat Inggris terdapat tempat lahirnya revolusi industri, dan bersamanya, rumah bagi kapitalisme modern. Kita tidak bisa membiarkan tempat ini menjadi batu loncatan bagi musuh kontra-revolusioner."
 FRA_carry_the_revolution_west: "Membawa Revolusi ke Barat"
 FRA_carry_the_revolution_west_desc: "Rezim-rezim di semenanjung Iberia sedang bergantung pada seutas benang, siap untuk disapu bersih oleh revolusi kerakyatan. Kami akan memutuskan thread itu."
 FRA_carry_the_revolution_east: "Bawa Revolusi ke Timur"
 FRA_carry_the_revolution_east_desc: "Di perbatasan timur kita terdapat ancaman terbesar terhadap tatanan baru kita. Kekuatan-kekuatan reaksioner yang berkumpul di sana akan menyerang ketika kita tidak mampu lagi melakukan serangan – tetapi hanya jika kita memberi mereka waktu untuk bersiap menghadapinya."
 FRA_carry_the_revolution_south: "Membawa Revolusi ke Selatan"
 FRA_carry_the_revolution_south_desc: "Negara pertama yang jatuh ke tangan fasisme adalah Italia. Alhasil, ideologi tersebut mengakar kuat di Italia. Pandangan dunia kita tidak bisa hidup berdampingan secara damai. Mereka mengetahui hal ini sebaik kita, dan pasti akan bersiap untuk bertindak. Kita juga harus melakukannya."
 FRA_egalite_liberte_solidarite_desc: "Revolusi Perancis yang pertama menyapu bersih rezim-rezim yang telah berkuasa selama ribuan tahun, dan mengubah lanskap Eropa selamanya. Kami akan menyelesaikan apa yang mereka mulai."
 FRA_reform_the_labour_laws: "Reformasi Undang-Undang Ketenagakerjaan"
 FRA_reform_the_labour_laws_desc: "Para pekerja di Perancis bekerja dalam kondisi yang keras, dengan upah rendah dan sedikit tunjangan. Sudah waktunya untuk menerapkan serangkaian reformasi yang komprehensif untuk memperbaiki nasib mereka."
 FRA_nationalize_key_industry: "Nasionalisasi Industri Utama"
 FRA_nationalize_key_industry_desc: "Dalam situasi saat ini, kita tidak boleh menghindar dari restrukturisasi ekonomi secara radikal untuk menghadapi ancaman yang akan datang. Waktunya singkat – kita tidak bisa menunggu pasar bebas menyelesaikan masalah ini."
 FRA_reorganize_the_aviation_industry: "Menata Kembali Industri Penerbangan"
 FRA_reorganize_the_aviation_industry_desc: "Terbagi menjadi puluhan perusahaan kecil, industri penerbangan kita tertinggal beberapa dekade dibandingkan industri di Jerman dan Amerika. Restrukturisasi radikal diperlukan."
 FRA_form_the_state_arsenals: "Bentuk Gudang Senjata Negara"
 FRA_form_the_state_arsenals_desc: "Untuk memasok senjata modern kepada tentara kita, kita tidak bisa menunggu sampai perusahaan swasta telah mengembangkan kapasitas produksi yang diperlukan."
 FRA_general_work_council: "Dewan Pekerjaan Umum"
 FRA_general_work_council_desc: "Kami akan membentuk sebuah badan nasional untuk menangani perselisihan antara pengusaha dan pekerja, dan untuk memastikan bahwa pekerja kami dipekerjakan dengan cara yang seefisien mungkin."
 FRA_national_champions: "Juara Nasional"
 FRA_national_champions_desc: "Dengan memilih beberapa perusahaan yang mempunyai potensi bersaing di tingkat global dan mendukung mereka semaksimal mungkin, kita dapat menciptakan perekonomian modern yang setara dengan perekonomian lainnya."
 FRA_dirigisme_desc: "Meskipun perekonomian terencana penuh model Soviet jelas merupakan upaya yang terlalu ekstrem, diperlukan perencanaan dan arahan tertentu untuk mengoptimalkan perekonomian kita."
 FRA_ban_the_leagues: "Larang Liga"
 FRA_ban_the_leagues_desc: "Liga sayap kanan telah diizinkan untuk berorganisasi tanpa terkendali. Meskipun mereka saat ini terlalu lemah untuk melakukan kudeta, tidak ada yang tahu apa yang bisa mereka lakukan di masa depan. Yang terbaik adalah membubarkannya sekarang."
 FRA_the_blum_viollette_proposal: "Proposal Blum-Viollette"
 FRA_the_blum_viollette_proposal_desc: "Kewarganegaraan Republik Perancis harus terbuka bagi siapa saja yang memenuhi syarat. Banyak rakyat setia kami di Aljazair ingin menjadi warga negara penuh, namun belum diizinkan untuk melakukannya. Dengan menjadikan mereka warga negara penuh, kita akan mendekatkan Aljazair dengan Prancis."
 FRA_expand_the_citizenship: "Memperluas Kewarganegaraan"
 FRA_expand_the_citizenship_desc: "Tidak dapat ditoleransi bagi sebuah republik jika beberapa orang yang tinggal di wilayahnya tidak diizinkan menjadi warga negaranya, namun keadaan ini dibiarkan terus berlanjut di negara kita. Kita harus segera memperbaikinya."
 FRA_france_undividable_desc: "Perancis harus dibentuk menjadi satu kesatuan, di bawah satu bendera. Sudah saatnya kita mengakui hal ini secara terbuka, untuk menghilangkan ketakutan akan perpecahan."
 FRA_french_union: "Uni Perancis"
 FRA_french_union_desc: "Inilah waktunya untuk memproklamirkan Perancis yang baru, Perancis yang mencakup seluruh dunia, di mana seluruh wilayah kita bersatu. Kami akan mengadakan referendum di semua wilayah untuk menegaskan keinginan rakyat untuk menjadi bagian dari Perancis yang baru dan lebih besar ini."
 FRA_french_union_tt: "Referendum di berbagai wilayah kerajaan kolonial kita akan diadakan. Beberapa bagian mungkin memilih untuk menjadi independen sepenuhnya."
 FRA_encourage_immigration: "Mendorong Imigrasi"
 FRA_encourage_immigration_desc: "Tanah air kita sangat membutuhkan pekerja untuk menutupi kerugian yang terjadi dalam Perang Besar. Dengan mempermudah menetap di Perancis, kita dapat menarik imigran terampil yang dapat menutupi kekurangan ini."
 FRA_review_foreign_policy: "Tinjau Kebijakan Luar Negeri"
 FRA_review_foreign_policy_desc: "Tatanan benua yang didirikan pada tahun 1919 nampaknya semakin terancam. Sudah saatnya kita meninjau kembali pilihan-pilihan kebijakan luar negeri kita untuk mendapatkan aliansi baru guna menghadapi badai yang akan datang."
 FRA_intervention_in_spain: "Intervensi di Spanyol"
 FRA_intervention_in_spain_desc: "Perang saudara di Spanyol telah membawa pertikaian antar ideologi ke depan pintu kita. Kita harus berhati-hati, jangan sampai konflik meluas ke negara kita."
 FRA_support_the_finns: "Dukung Finlandia"
 FRA_support_the_finns_desc: "Orang Finlandia berjuang untuk hidup mereka. Kita harus membantu mereka."
 FRA_confirm_eastern_commitments: "Konfirmasikan Komitmen Timur"
 FRA_confirm_eastern_commitments_desc: "Setelah Perang Besar, kami membangun jaringan aliansi di Eropa Timur, sebagai penyeimbang kebangkitan Jerman dan Uni Soviet yang ekspansionis. Sekutu-sekutu kami di wilayah ini kini bertanya-tanya apakah kami akan benar-benar membantu mereka jika kami dipanggil. Kita harus meyakinkan mereka sebelum mereka memutuskan untuk mencari bantuan di tempat lain."
 FRA_strengthen_the_little_entente: "Perkuat Entente Kecil"
 FRA_strengthen_the_little_entente_desc: "Entente Kecil mengikat kita untuk membantu sekutu kita di Eropa Timur dan Balkan. Kita telah membiarkan aliansi ini berakhir, namun hal ini sangat dibutuhkan saat ini dibandingkan sebelumnya. Ini adalah waktu untuk menghidupkannya kembali."
 FRA_invest_in_our_weaker_allies: "Berinvestasilah pada Sekutu Kita yang Lebih Lemah"
 FRA_invest_in_our_weaker_allies_desc: "Jika kita ingin mempunyai sekutu yang cakap jika terjadi perang, kita harus memungkinkan mereka memenuhi kebutuhan militer mereka sendiri. Sebuah program investasi moderat pada industri mereka akan memungkinkan mereka memproduksi amunisi yang mereka perlukan secara lokal."
 FRA_invest_in_our_weaker_allies_trigger_tt: "Memiliki lebih sedikit pabrik militer daripada kita"
 FRA_coordinate_rearmament: "Koordinasikan Persenjataan Kembali"
 FRA_coordinate_rearmament_desc: "Untuk mengimbangi proses pembangunan terpadu yang dilakukan Jerman dan lawan-lawan kita yang lain, kita juga harus mengoordinasikan upaya kita dengan sekutu kita."
 FRA_foreign_guest_workers: "Pekerja Tamu Asing"
 FRA_foreign_guest_workers_desc: "Kurangnya pekerja merupakan hambatan besar dalam perluasan industri dan peningkatan jumlah angkatan bersenjata. Mengundang pekerja terampil dari sekutu kita untuk bekerja di pabrik kita akan membebaskan tenaga kerja untuk dikirim ke tentara."
 FRA_join_the_ententes: "Bergabunglah dengan Entente"
 FRA_join_the_ententes_desc: "Perancis tidak dapat mempertahankan dua komitmen pertahanan bersama pada saat yang bersamaan. Kecuali kita bisa membuat Inggris setuju untuk menghormati komitmen kita, kita harus memilih. Dengan menggabungkan jaringan aliansi kami yang berbeda-beda menjadi satu kesatuan, kami meningkatkan faktor pencegahan aliansi kami dengan besaran yang besar."
 unlocks_espionage_operation_tt: "Membuka §YOperasi Spionase§!:"
 FRA_revive_the_franco_polish_alliance: "Menghidupkan kembali Aliansi Perancis-Polandia"
 FRA_revive_the_franco_polish_alliance_desc: "Prancis selalu mendukung Polandia yang merdeka. Dalam beberapa tahun terakhir, hubungan antar negara kita sedikit mendingin. Dengan adanya ancaman dari Jerman, sekarang saatnya untuk menghidupkan kembali perjanjian kita."
 FRA_revive_the_franco_polish_alliance_tt: "Polandia akan diundang ke dalam faksi kami jika kami menjadi pemimpin faksi kami sendiri."
 FRA_buy_time: "Beli Waktu"
 FRA_buy_time_desc: "Kami belum siap menghadapi Jerman di lapangan. Sekutu kita lemah, militer kita sudah ketinggalan zaman. Kita mungkin harus berkorban jika ingin bertahan hidup."
 FRA_arms_purchases_in_the_us: "Pembelian Senjata di AS"
 FRA_arms_purchases_in_the_us_desc: "Industri militer kita tidak mampu menyediakan senjata modern yang diperlukan bagi pasukan kita. Namun Amerika masih mempunyai kapasitas produksi yang tersisa. Kecuali jika mereka memutuskan untuk kembali ke isolasionisme, tampaknya mereka dapat dibujuk untuk menjual senjata yang kami butuhkan."
 FRA_france_leads: "Perancis Memimpin"
 FRA_france_leads_desc: "Negara dengan sejarah yang membanggakan Perancis tidak bisa membiarkan negara lain mendikte kebijakan luar negerinya. Kami akan membuat pilihan kami sendiri, dipandu oleh kepentingan kami sendiri."
 FRA_concessions_to_italy: "Konsesi ke Italia"
 FRA_concessions_to_italy_desc: "Italia masih memimpikan sebuah kerajaan di Afrika. Jika kita menawarkan beberapa konsesi – dan menyetujui penaklukannya atas Ethiopia – kita mungkin mencegah pembentukan poros antara Roma dan Berlin."
 FRA_ratify_the_stresa_front: "Ratifikasi Front Stresa"
 FRA_ratify_the_stresa_front_desc: "Italia telah mengindikasikan bahwa dia akan bergabung dengan faksi kami dengan imbalan wilayah di Afrika. Sekarang saatnya untuk menandatangani dan meratifikasi perjanjian-perjanjian yang diperlukan."
 FRA_franco_soviet_treaty: "Perjanjian Perancis-[SOV.GetAdjective]"
 FRA_franco_soviet_treaty_desc: "Kelompok [SOV.GetAdjective] sama khawatirnya dengan kebangkitan fasisme di Eropa seperti halnya kita. Mungkin kami bisa meyakinkan mereka untuk mendukung kami jika saatnya tiba."
 FRA_revive_the_national_bloc: "Bangkitkan Kembali Blok Nasional"
 FRA_revive_the_national_bloc_desc: "Lanskap politik semakin hari semakin radikal. Kaum kiri berbisik-bisik untuk mempunyai tujuan yang sama dengan komunis. Yang dibutuhkan saat ini adalah kepemimpinan yang kuat dan stabil."
 FRA_laissez_faire: "Laissez-Faire"
 FRA_laissez_faire_desc: "Kaum Komunis secara terbuka berbicara tentang merombak struktur ekonomi negara kita dengan cara yang radikal, tentang merampas hak milik pekerja keras. Terhadap hal ini, kami akan menetapkan gagasan sederhana tentang kebebasan. Perekonomian yang dinamis akan selalu mengalahkan mimpi buruk sayap kiri yang menghambat birokrasi."
 FRA_protect_the_rights_of_man: "Melindungi Hak Asasi Manusia"
 FRA_protect_the_rights_of_man_desc: "Mereka mungkin tidak pernah mengatakannya secara terbuka, namun hal ini jelas bagi siapa pun yang mau melihat: membatasi hak atas properti hanyalah langkah pertama untuk menghilangkan semua hak yang diperjuangkan dengan susah payah oleh nenek moyang kita yang bangga. Kami tidak akan memilikinya!"
 FRA_freedom_front: "Front Kebebasan"
 FRA_freedom_front_desc: "Ketika dihadapkan dengan kekacauan dan pergolakan yang dijanjikan oleh komunis, seseorang harus bersedia untuk membuat aliansi dengan partai-partai lain, bahkan dengan partai-partai yang secara pribadi mungkin dianggap tercela."
 FRA_stimulate_the_dynamic_market: "Merangsang Pasar Dinamis"
 FRA_stimulate_the_dynamic_market_desc: "Pasar yang dinamis telah terbukti menjadi bentuk organisasi ekonomi yang paling efisien. Namun tetap dijalankan oleh manusia, dan manusia terkadang membutuhkan kepastian bahwa kerja kerasnya tidak akan sia-sia. Dengan menghapuskan beberapa pembatasan dan memberikan jaminan, kita dapat membantu investor mengatasi ketakutan mereka dan membantu menstimulasi perekonomian kita."
 FRA_agricultural_protectionism_desc: "Perekonomian dunia semakin memusuhi cara produksi tradisional kita. Jika kita tidak mengambil langkah-langkah untuk melindungi para petani, kita akan segera menghadapi krisis yang sangat besar karena para petani kita tidak akan mampu bersaing dengan bahan pangan yang diproduksi secara massal yang datang dari luar negeri."
 FRA_economic_devolution: "Devolusi Ekonomi"
 FRA_economic_devolution_desc: "Tidak masuk akal untuk berpikir bahwa beberapa birokrat di Paris tahu apa yang terbaik bagi sebuah perusahaan di Bordeaux. Kita harus memercayai wirausahawan kita dan memberdayakan mereka untuk menciptakan solusi mereka sendiri."
 FRA_promote_entrepeneurship: "Mempromosikan Kewirausahaan"
 FRA_promote_entrepeneurship_desc: "Jantung dari pasar yang dinamis adalah individu yang, ketika melihat peluang, bergerak cepat untuk memanfaatkannya. Dalam beberapa tahun terakhir, semangat ini telah diredam dengan peraturan yang tidak diperlukan. Kita harus mengembalikannya."
 FRA_utilize_the_leagues: "Manfaatkan Liga"
 FRA_utilize_the_leagues_desc: "Merupakan fakta yang menyedihkan bahwa kekerasan politik telah menjadi hal biasa di Perancis. Jika negara ini ingin selamat dari ancaman revolusi komunis, kita tidak boleh menghindar dari bantuan orang-orang yang bisa dan akan menemui preman komunis di jalan jika hal tersebut terjadi."
 FRA_national_regeneration: "Regenerasi Nasional"
 FRA_national_regeneration_desc: "Demokrasi yang berlebihan dan republikanisme yang salah arah telah meracuni negara kita dan memecah belah rakyat kita. Butuh waktu lama untuk menyembuhkan luka ini, namun akhirnya langkah pertama telah diambil."
 FRA_national_regeneration_trigger_tt: "Total gabungan dukungan Unaligned dan Fasis lebih dari 50%"
 FRA_destroy_decadence: "Hancurkan Dekadensi"
 FRA_destroy_decadence_desc: "Tidak ada negara yang menjadi hebat jika membiarkan dirinya memperdebatkan masalah terkecil sekalipun selama berbulan-bulan. Beberapa negara, yang merasa aman di balik lautan dan didukung oleh kerajaan global, mungkin percaya bahwa mereka mampu mendapatkan kemewahan ini. Kami tidak bisa."
 FRA_integralism: "Integralisme"
 FRA_integralism_desc: "Ideologi integralisme menyatakan bahwa seluruh aspek masyarakat harus bersatu dan bekerja seolah-olah merupakan satu bagian kecil dari keseluruhan yang lebih besar. Masyarakat ini harus ditata dengan baik, untuk memastikan bahwa semua bagiannya bekerja sama secara harmonis."
 FRA_work: "Bekerja"
 FRA_work_desc: "Pengrajin adalah komponen perekonomian yang paling penting. Jika dibimbing oleh orang-orang yang tepat, tidak ada panggilan yang lebih mulia selain mengabdi pada negara."
 FRA_family: "Keluarga"
 FRA_family_desc: "Unit terkecil dalam masyarakat bukanlah individu, melainkan keluarga. Menyangkal fakta yang sederhana dan jelas ini merupakan kelemahan terbesar republik lama."
 FRA_fatherland: "Tanah Air"
 FRA_fatherland_desc: "Kewajiban setiap [FRA.GetAdjective] laki-laki, perempuan, dan anak-anak adalah membela dan membantu sesamanya. Satu-satunya cara untuk mencapai hal ini adalah melalui ketertiban dan kesetiaan tanpa syarat kepada bangsa. Tidak ada keraguan mengenai hal ini, atau kita akan mengalami nasib yang sama seperti republik lama. Kami akan melakukan semua yang diperlukan untuk menjaga ketertiban dan keamanan nasional. Pada akhirnya, masyarakat akan memahami bahwa hal ini adalah demi kepentingan terbaik mereka."
 FRA_political_unity: "Persatuan Politik"
 FRA_political_unity_desc: "Sejarah Perancis sejak jatuhnya absolutisme adalah kisah pertikaian politik. Ketika ada persatuan, Prancis menang. Ketika terjadi perselisihan internal, Prancis dikalahkan. Oleh karena itu, kita tidak boleh membiarkan ambisi segelintir orang merugikan penghidupan banyak orang."
 FRA_diplomatic_freedom: "Kebebasan Diplomatik"
 FRA_diplomatic_freedom_desc: "Pemerintahan republik telah membelenggu diri mereka sendiri pada konstruksi buatan di Eropa Timur yang akan runtuh saat kita menarik bantuan kita. Itu adalah liabilitas, bukan aset, dan karena itu kami akan melepaskan diri darinya."
 FRA_latin_entente: "Entente Latin"
 FRA_latin_entente_desc: "Persaudaraan yang terjalin antara negara-negara penerus Kekaisaran Romawi tidak dapat disangkal. Orang-orang Jerman di Eropa sudah terlalu lama menguasai benua ini. Sudah saatnya kita mendapatkan kembali hak kesulungan nasional kita."
 FRA_reach_out_to_spain: "Jangkau Spanyol"
 FRA_reach_out_to_spain_desc: "Baru saja pulih dari perang saudara, Spanyol adalah sekutu alami kami dalam upaya membentuk kembali benua ini."
 FRA_invite_portugal: "Undang Portugal"
 FRA_invite_portugal_desc: "Meskipun kerajaan kolonialnya sudah sangat berkurang, api penjelajahan dan penaklukan masih berkobar di hati setiap orang Portugis."
 FRA_compensate_italy: "Kompensasi Italia"
 FRA_compensate_italy_desc: "Di masa lalu, konflik mengenai hamparan kecil gurun pasir telah menyeret negara kita ke dalam konflik. Omong kosong seperti itu dapat dengan mudah dihentikan, dan hasil yang disepakati bersama dapat segera ditemukan."
 FRA_intervention_in_greece: "Intervensi di Yunani"
 FRA_intervention_in_greece_desc: "Yunani menguasai beberapa wilayah paling berharga di Mediterania. Kita tidak bisa membiarkan pemerintah yang bermusuhan menguasai wilayah tersebut, oleh karena itu kita harus bertindak terlebih dahulu."
 FRA_the_congress_of_paris: "Kongres Paris"
 FRA_the_congress_of_paris_desc: "Di Kongres Berlin, perbatasan Afrika dibentuk. Namun peta saat ini terlihat seperti tambal sulam. Sudah waktunya untuk menggambar ulang peta, dan dengan demikian membentuk dasar bagi sebuah kerajaan kolonial baru."
 FRA_the_natural_borders_of_france: "Perbatasan Alam Perancis"
 FRA_the_natural_borders_of_france_desc: "Wajar jika suatu negara mengutamakan kepentingannya sendiri. Kita tidak bisa hidup berdampingan secara damai dengan Jerman dalam perjuangan kita, sehingga kita harus mengamankan perbatasan alam untuk mempertahankan wilayah inti kita."
 FRA_towards_a_new_europe: "Menuju Eropa Baru"
 FRA_towards_a_new_europe_desc: "Prancis berada di persimpangan jalan. Kita bisa membelenggu diri kita pada tatanan lama, atau kita bisa menerima tatanan baru. Ketika Jerman siap untuk merombak benua ini, akan bermanfaat bagi kita untuk berada di sisi baik mereka."
 FRA_establish_spheres_of_influence: "Tetapkan Lingkup Pengaruh"
 FRA_establish_spheres_of_influence_desc: "Selama berabad-abad, masyarakat kami hidup dalam keyakinan bahwa kami adalah musuh bebuyutan dan turun-temurun. Keyakinan ini didasarkan pada gagasan bahwa kepentingan kami tidak sejalan. Tapi kita pasti bisa mencapai kesepakatan jika kita mendefinisikan lingkup pengaruh kita dan dengan sungguh-sungguh menahan diri untuk tidak ikut campur."
 FRA_split_belgium: "Berpisah Belgia"
 FRA_split_belgium_desc: "Dengan Belgia yang kini berada dalam wilayah pengaruh kita, sekarang saatnya untuk menyebut wilayah berbahasa Prancis sebagai kampung halamannya. Sisanya akan dibentuk menjadi negara baru."
 FRA_align_belgium: "Sejajarkan Belgia"
 FRA_align_belgium_desc: "Masyarakat Belgia berhutang budi pada kita, dan kita tidak bisa membiarkan mereka melupakan fakta itu. Jika kita membiarkan mereka tetap independen, paling tidak kita akan memastikan terbentuknya pemerintahan yang bersahabat."
 FRA_grow_the_empire: "Kembangkan Kekaisaran"
 FRA_grow_the_empire_desc: "Tidak masuk akal jika negara sebesar Belgia dibiarkan mempertahankan koloni yang berkali-kali lipat ukurannya. Kita jauh lebih cocok untuk mengelola wilayah seperti itu."
 FRA_bring_home_quebec: "Bawa Pulang Quebec"
 FRA_bring_home_quebec_desc: "Provinsi yang hilang sejak lama, pada saatnya nanti, akan menjadi milik kita kembali. Seluruh masyarakat berbahasa Perancis di dunia pada akhirnya akan dipertemukan kembali dengan tanah airnya."
 FRA_expand_to_the_suez: "Perluas ke Suez"
 FRA_expand_to_the_suez_desc: "Pembagian kendali antara AS dan Inggris di Levant adalah sebuah kompromi yang tidak bisa dijalankan dan, untungnya, kini tidak lagi harus kita patuhi."
 FRA_dominate_the_middle_east: "Mendominasi Timur Tengah"
 FRA_dominate_the_middle_east_desc: "Negara-negara Timur Tengah adalah konstruksi buatan, yang diukir dari mayat Kesultanan Ottoman. Mereka tidak lebih berdaulat dibandingkan rata-rata desa di Prancis, dan inilah saatnya mengingatkan mereka akan fakta tersebut."
 FRA_the_council_of_rambouillet: "Dewan Rambouillet"
 FRA_the_council_of_rambouillet_desc: "Ketika negara berada dalam kekacauan, rakyat mencari pemimpin yang kuat. Sudah jelas bahwa Republikanisme telah mengecewakan rakyat Perancis, dan sudah waktunya bagi penguasa alami Perancis untuk kembali. Namun pertama-tama, landasan harus diletakkan untuk pemulihan monarki."
 FRA_revise_the_constitution: "Merevisi Konstitusi"
 FRA_revise_the_constitution_desc: "Konstitusi republik selalu dimaksudkan sebagai tindakan sementara yang dibiarkan berlangsung terlalu lama. Sekarang, kami akan menulis ulang agar raja bisa kembali."
 FRA_repeal_the_law_of_exile: "Mencabut Hukum Pengasingan"
 FRA_repeal_the_law_of_exile_desc: "Tidak ada kepala keluarga kerajaan Prancis, maupun ahli warisnya, yang diizinkan berada di tanah Prancis tanpa izin tertulis. Sebelum kita dapat memperoleh kembali kejayaan monarki, kita harus mengatasi hambatan kecil yang mengganggu ini."
 FRA_orleanist_restoration: "Restorasi Orléanist"
 FRA_orleanist_restoration_desc: "House of Orléans mendapat dukungan besar dari kaum royalis di Prancis. Meskipun beberapa pihak yang menentangnya lebih memilih calon takhta yang berbeda, tidak ada keraguan bahwa pewaris Orleanis tersebut memiliki peluang terbaik untuk menyatukan negara secara damai di belakangnya."
 FRA_guarantee_the_constitution: "Menjamin Konstitusi"
 FRA_guarantee_the_constitution_desc: "Sebelum pers republik dapat melancarkan kampanye tidak berdasarnya melawan legitimasi pemerintahan kerajaan, kita harus mengikis kedudukan mereka dengan memberikan jaminan tegas untuk menghormati hak-hak individu masyarakat."
 FRA_the_first_citizen_of_the_state: "Warga Negara Pertama"
 FRA_the_first_citizen_of_the_state_desc: "Raja, meskipun mempunyai kekuasaan yang besar, tidak boleh dilihat sebagai penguasa tiran atau absolutis seperti yang sudah lama ada. Sebaliknya, seorang raja modern harus menghormati hukum dan menjadi garis pertahanan pertama melawan pihak-pihak yang ingin merebut kekuasaan secara ilegal."
 FRA_counter_action_desc: "Action Française telah lama menjadi pendukung terkuat kembalinya monarki. Sayangnya, pandangan mereka terhadap topik lain kurang sesuai. Ini adalah waktu untuk memberi tahu mereka bahwa mereka telah memenuhi tujuannya dan membuangnya."
 FRA_no_further_humiliations: "Tidak Ada Penghinaan Lebih Lanjut"
 FRA_no_further_humiliations_desc: "Selama bertahun-tahun, pemerintahan republik berturut-turut telah membiarkan Jerman bertindak sewenang-wenang terhadap perjanjian internasional, beberapa di antaranya secara berani dilanggar bahkan sebelum tintanya kering. Ini berakhir sekarang."
 FRA_slum_clearing: "Pembersihan Permukiman Kumuh"
 FRA_slum_clearing_desc: "Meskipun berada di salah satu negara adidaya di dunia, pekerja sederhana asal Perancis sering kali hidup dalam kondisi kemelaratan yang sangat memprihatinkan. Tidak ada raja yang layak menyandang gelar tersebut yang dapat mentolerir rakyatnya yang hidup dalam keadaan seperti itu."
 FRA_public_welfare: "Kesejahteraan Masyarakat"
 FRA_public_welfare_desc: "Seorang raja yang tidak bekerja untuk rakyatnya sama sekali bukan raja."
 FRA_the_legitimate_heir: "Ahli Waris yang Sah"
 FRA_the_legitimate_heir_desc: "Kaum Legitimis menganggap cabang Carlist sebagai pewaris sah takhta Prancis. Mengangkat kandidat mereka untuk naik takhta membuka kemungkinan yang menggiurkan untuk memerintah Spanyol dan Prancis dalam sistem monarki ganda."
 FRA_secure_the_crown_of_spain: "Amankan Mahkota Spanyol"
 FRA_secure_the_crown_of_spain_desc: "Langkah pertama untuk mengklaim hak kesulungan raja adalah mengamankan Spanyol dari berbagai pemerintahan palsu yang bermunculan. Pertengkaran kecil mereka telah membawa negara ini ke dalam perang saudara yang berdarah - kita tidak boleh membiarkan mereka melakukannya lagi."
 FRA_unite_the_crowns: "Satukan Mahkota"
 FRA_unite_the_crowns_desc: "Dengan diamankannya Spanyol, kita sekarang dapat menyatukan mahkota dan menciptakan kerajaan baru, Kerajaan Perancis-Spanyol."
 FRA_two_countries_two_crowns: "Dua Negara, Dua Mahkota"
 FRA_two_countries_two_crowns_desc: "Tidak ada cara yang memungkinkan untuk menyatukan negara-negara yang salah satu negaranya tidak menganggap dirinya sebagai subjek negara lain. Kami malah akan menyarankan raja untuk memerintah keduanya secara personal, namun tidak secara hukum."
 FRA_proclaim_the_third_empire: "Proklamasikan Kekaisaran Ketiga"
 FRA_proclaim_the_third_empire_desc: "Kaum Bonapartis mungkin dianggap sebagai pihak luar dalam perebutan takhta, namun mereka membawa serta impian suatu masa ketika seluruh Eropa tunduk pada Kaisar Prancis."
 FRA_avenge_waterloo: "Balas dendam Waterloo"
 FRA_avenge_waterloo_desc: "Sejarah Napoleon yang Pertama selamanya akan ditentukan oleh kekalahan terbesarnya. Jika kita ingin sukses, kita harus menunjukkan bahwa kita bisa menang meski dia kalah."
 FRA_reorganize_the_dutch: "Atur ulang Belanda"
 FRA_reorganize_the_dutch_desc: "Belanda juga pernah menjadi bagian dari Kekaisaran Perancis. Sekarang setelah mereka dikalahkan, sekarang saatnya untuk kembali ke keadaan alamiah ini."
 FRA_retribution_for_sedan: "Retribusi Untuk Sedan"
 FRA_retribution_for_sedan_desc: "Selama lebih dari setengah abad, Jerman merayakan Pertempuran Sedan dan kemenangan mereka atas Napoleon Ketiga di sana. Nantinya, setiap orang Jerman akan belajar mengutuk nama tempat itu."
 FRA_disunite_germany: "Pecah belah Jerman"
 FRA_disunite_germany_desc: "Kemenangan atas Prancis memungkinkan Prusia menyatukan negara-negara kecil Jerman di bawah panjinya. Memang benar jika proses ini dibalik, karena Jerman telah dikalahkan."
 FRA_disunite_germany_tt: "Ganti nama §YSistem Kontinental§! menjadi §YConfédération du Rhin§!"
 FRA_return_to_borodino: "Kembali ke Borodino"
 FRA_return_to_borodino_desc: "Di Borodino, Napoleon hampir mencapai kemenangannya di Eropa. Tentara Rusia sudah hancur, dan seandainya dia sedikit lebih cepat, dia bisa membuat Rusia berdamai. Kami akan menunjukkan kepada dunia bahwa hal itu bisa dilakukan."
 FRA_je_suis_la_deluge: "Je Suis Le Déluge"
 FRA_je_suis_la_deluge_desc: "Revolusi Perancis adalah banjir yang menyapu bersih rezim-rezim lama dan lemah yang telah sekian lama menguasai Eropa. Kini banjir baru datang."
 FRA_coordinate_rearmament_tt: "Mengurangi biaya lisensi produksi untuk anggota faksi kami."
 invite_to_faction_tt: "Diundang ke faksi kami."
 VIC_emergency_powers_to_petain: "Kekuatan Darurat Untuk Mempertahankan"
 VIC_emergency_powers_to_petain_desc: "Dengan kekalahan Perancis, jelas bahwa tindakan radikal harus diambil untuk mengamankan negara. Presiden tidak dapat dibatasi dalam melakukan apa yang diperlukan."
 VIC_the_national_revolution: "Revolusi Nasional"
 VIC_the_national_revolution_desc: "Kekalahan kita tidak diragukan lagi disebabkan oleh kelemahan mendasar bangsa kita. Butuh waktu lama untuk memperbaiki kelemahan ini, tapi mungkin kejutan dari kekalahan kita akan membuat kita kembali lebih kuat."
 VIC_long_term_economic_planning: "Perencanaan Ekonomi Jangka Panjang"
 VIC_long_term_economic_planning_desc: "Meskipun kita tergoda untuk melihat situasi saat ini sebagai hal yang sangat penting sehingga bisa mengatasi semua kekhawatiran lainnya, kita tidak boleh lupa bahwa ada beberapa hal yang membutuhkan waktu lama untuk diterapkan. Dengan membuat serangkaian rencana ekonomi, kita dapat mengembangkan perekonomian kita secara efisien."
 VIC_aid_small_businesses: "Membantu Usaha Kecil"
 VIC_aid_small_businesses_desc: "Banyak perusahaan kecil yang membentuk perekonomian kita telah terpukul keras oleh penjatahan dan tindakan perang lainnya. Kita harus mencoba memperbaiki hal ini untuk membantu mereka bertahan hidup."
 VIC_venerate_the_craftsman: "Hormatilah Pengrajin"
 VIC_venerate_the_craftsman_desc: "Sudah terlalu lama pembahasan mengenai ketenagakerjaan terfokus pada pekerja industri, yang bekerja di sebuah pabrik besar di sebuah perusahaan besar. Saatnya menunjukkan prestasi pengrajin terampil, bekerja di bengkelnya sendiri, menafkahi keluarganya."
 VIC_down_with_marianne: "Turun Dengan Marianne"
 VIC_down_with_marianne_desc: "Pemujaan pseudo-religius terhadap Marianne, simbol republikanisme Perancis, telah memutarbalikkan pikiran masyarakat kita. Sama seperti Republik tidak berharga yang diwakilinya, semua jejak dirinya harus dihilangkan."
 VIC_up_with_jean_darc: "Bersama Jeanne d'Arc"
 VIC_up_with_jean_darc_desc: "Jeanne d'Arc bertempur dengan gagah berani melawan musuh yang tampaknya sangat kuat, mengorbankan semua yang dimilikinya demi kebaikan tanah air, dan menggalang bangsa di bawah panjinya untuk mengusir penjajah. Tentunya dia adalah simbol yang jauh lebih baik untuk dicita-citakan oleh generasi muda kita daripada Marianne?"
 VIC_celebrate_motherhood: "Rayakan Keibuan"
 VIC_celebrate_motherhood_desc: "Sudah jelas bahwa kedudukan perempuan adalah dalam rumah tangga, sama seperti kedudukan laki-laki di meja kerja atau di lapangan. Masyarakat kita harus diingatkan bahwa pekerjaan perempuan sama pentingnya bagi kelangsungan hidup bangsa seperti halnya pekerjaan laki-laki."
 VIC_prosecute_the_losers: "Tuntut yang Pecundang"
 VIC_prosecute_the_losers_desc: "Prancis bertahan selama bertahun-tahun melawan tentara Kaiser, namun terpuruk dalam perang saat ini. Hal ini pasti ada alasannya, dan kita tidak boleh berhenti sampai hal ini terungkap dan orang-orang yang bertanggung jawab diadili."
 VIC_concessions_to_the_germans: "Konsesi kepada Jerman"
 VIC_concessions_to_the_germans_desc: "Kenyataan yang ada menuntut kita untuk mencapai kesepakatan dengan musuh-musuh kita sebelumnya. Harus ada cara untuk mengurangi beban yang melumpuhkan yang menimpa kita."
 VIC_mandatory_work_service: "Pelayanan Pekerjaan Wajib"
 VIC_mandatory_work_service_desc: "Kami telah berhasil mendapatkan janji dari Jerman bahwa biaya pendudukan kami akan berkurang jika kami memasok mereka dengan tenaga kerja. Namun, nampaknya hanya sedikit di antara masyarakat yang bersedia melakukan pekerjaan yang diperlukan untuk membantu tanah air mereka pada saat dibutuhkan. Ketika insentif gagal, kita harus menggunakan paksaan."
 VIC_a_nation_reborn: "Suatu Bangsa yang Terlahir Kembali"
 VIC_a_nation_reborn_desc: "Di akhir proses panjang dan menyakitkan dalam membangun kembali bangsa kita yang terhina dan kalah, berdirilah Perancis yang baru dan terlahir kembali, terbebas dari kanker republikanisme dan perpecahan internalnya."
 VIC_end_the_occupation: "Akhiri Pekerjaan"
 VIC_end_the_occupation_desc: "Di akhir revolusi nasional, kami siap untuk mengambil posisi bersama musuh-musuh kami sebelumnya dan berjuang untuk Eropa baru, Eropa yang aman dari ancaman Bolshevisme dan bebas dari godaan republikanisme yang memecah belah."
 VIC_the_national_bureau_of_statistics: "Biro Statistik Nasional"
 VIC_the_national_bureau_of_statistics_desc: "Jika kita ingin memimpin masyarakat menuju masa depan yang lebih baik, kita memerlukan data yang kuat sebagai dasar pengambilan keputusan. Kita harus membentuk lembaga baru yang bertugas menghasilkan data ini."
 VIC_the_legionary_service_order: "Perintah Pelayanan Legiun"
 VIC_the_legionary_service_order_desc: "Dengan sebagian besar militer kita yang dilucuti dan bahkan terlalu sedikit untuk melindungi seluruh Perancis, kita memerlukan organisasi patriot baru untuk mendukung rezim."
 VIC_form_the_milice: "Bentuk Milice"
 VIC_form_the_milice_desc: "Dengan semakin kuatnya perlawanan di seluruh Perancis, kita perlu menciptakan kekuatan yang mampu melawan mereka. Kami hanya akan merekrut anggota yang paling patriotik dan memberi mereka kebebasan bertindak sesuai keinginan mereka untuk mengalahkan para teroris ini."
 VIC_anti_bolshevist_volunteers: "Relawan Anti-Bolshevis"
 VIC_anti_bolshevist_volunteers_desc: "Perjuangan terbesar dalam sejarah manusia sedang terjadi saat ini antara kekuatan peradaban barat dan kekuatan Komunisme. Kita tidak bisa berdiam diri sementara pertempuran besar ini sedang berlangsung."
 VIC_rebuild_the_military: "Membangun kembali Militer"
 VIC_rebuild_the_military_desc: "Tentara Perancis telah benar-benar dikalahkan dan dipermalukan, dibutuhkan upaya yang panjang untuk mengembalikannya ke kekuatan tempur penuh."
 VIC_finish_the_naval_buildup: "Selesaikan Pembangunan Angkatan Laut"
 VIC_finish_the_naval_buildup_desc: "Mendiang republik ini meletakkan sejumlah kapal untuk memodernisasi armadanya. Dimulai terlambat dan dikejar terlalu lambat, tidak dapat selesai tepat waktu. Namun kapal ini mungkin masih berfungsi sebagai inti Angkatan Laut Perancis yang baru."
 VIC_hidden_materials: "Bahan Tersembunyi"
 VIC_hidden_materials_desc: "Jerman tidak akan mampu membangun kembali pasukannya secepat yang mereka lakukan jika mereka tidak melanggar ketentuan perjanjian mereka. Oleh karena itu, wajar dan pantas jika kita melakukan hal yang sama."
 VIC_analyze_our_defeat: "Analisis Kekalahan Kami"
 VIC_analyze_our_defeat_desc: "Kekalahan kami tidak bisa dihindari. Banyak orang yang gagal dalam menjalankan tugasnya, karena rasa berpuas diri yang tercela. Kami akan mencari tahu penyebab pastinya, dan memastikan kami lebih siap ke depannya."
 VIC_modernize_the_airforce: "Modernisasi Angkatan Udara"
 VIC_modernize_the_airforce_desc: "Mungkin bagian paling memalukan dari kekalahan kami adalah ketidakmampuan kami bersaing di udara. Kami memiliki terlalu sedikit pesawat modern. Ketika perang terus berlanjut di sekitar kita, pesawat-pesawat baru dengan cepat mulai diproduksi. Kita tidak boleh membiarkan hal serupa terjadi lagi."
 VIC_learn_from_the_enemy: "Belajar dari Musuh"
 VIC_learn_from_the_enemy_desc: "Cara tercepat untuk memahami bagaimana dan mengapa kami gagal adalah dengan memahami apa yang dilakukan lawan kami dengan benar."
 VIC_buy_from_the_enemy: "Beli dari Musuh"
 VIC_buy_from_the_enemy_desc: "Industri militer kita tidak mampu menyediakan senjata modern yang cukup, dan sampai saat ini masih belum mampu. Kita harus berupaya memperoleh senjata modern dari semua sumber yang tersedia."
 FRA_appeal_to_the_french_nation: "Himbauan Kepada Bangsa Perancis"
 FRA_appeal_to_the_french_nation_desc: "Prancis mungkin kalah dalam pertempuran, namun mereka tidak kalah perang. Adalah tugas setiap orang Prancis yang patriotik untuk melawan."
 FRA_appeal_to_overseas_territories: "Banding Ke Wilayah Luar Negeri"
 FRA_appeal_to_overseas_territories_desc: "Meskipun wilayah metropolitan Perancis mungkin telah jatuh ke tangan musuh, sebagian besar kerajaannya masih tetap bebas. Jika kita bisa mengerahkan mereka untuk membantu kita, kita bisa membalas serangan musuh."
 FRA_appeal_to_overseas_territories_tt: "Wilayah kolonial di berbagai belahan dunia berpeluang beralih ke pihak kita."
 FRA_intervention_in_north_africa: "Intervensi Di Afrika Utara"
 FRA_intervention_in_north_africa_desc: "Afrika Utara merupakan tempat yang terbaik untuk melakukan invasi guna merebut kembali tanah air mereka. Memihak kami adalah hal yang penting dalam kampanye pembebasan kami."
 FRA_intervention_in_west_africa: "Intervensi Di Afrika Barat"
 FRA_intervention_in_west_africa_desc: "Afrika Barat menampung jutaan penduduk, yang dapat direkrut menjadi tentara baru untuk merebut kembali tanah air kita."
 FRA_intervention_in_syria: "Intervensi Di Suriah"
 FRA_intervention_in_syria_desc: "Menyangkal musuh atas wilayah strategis di Suriah akan melindungi terusan Suez dan secara dramatis memperbaiki situasi kita di Mediterania timur."
 FRA_intervention_in_indochina: "Intervensi Di Indochina"
 FRA_intervention_in_indochina_desc: "Jauh dari peperangan di Eropa, koloni kami di Indochina adalah wilayah yang ideal untuk membantu kami mempertahankan kepentingan kami di wilayah tersebut."
 FRA_intervention_in_central_africa: "Intervensi Di Afrika Tengah"
 FRA_intervention_in_central_africa_desc: "Afrika Tengah sangat penting bagi upaya perang sekutu, dan dapat dianggap sebagai kudeta propaganda yang penting bagi kita."
 FRA_intervention_in_madagascar: "Intervensi Di Madagaskar"
 FRA_intervention_in_madagascar_desc: "Jika musuh dibiarkan menguasai dan membentengi Madagaskar, kita akan menghadapi bencana di Samudera Hindia. Tindakan yang cepat dan tegas dapat memastikan bahwa pulau ini tetap berada di pihak kita."
 FRA_form_the_national_committee: "Membentuk Komite Nasional"
 FRA_form_the_national_committee_desc: "Hanya sedikit orang yang percaya bahwa tujuan kami akan berhasil. Tapi sekarang kita akhirnya cukup kuat untuk mendeklarasikan pembentukan pemerintahan di pengasingan yang berfungsi penuh, siap untuk mengambil kendali atas wilayah Perancis yang dibebaskan dari musuh."
 FRA_form_the_provisional_government_of_the_republic: "Bentuk Pemerintahan Sementara"
 FRA_form_the_provisional_government_of_the_republic_desc: "Dengan pembebasan Paris, kita bukan lagi pemerintahan dalam pengasingan. Inilah waktunya untuk memulai kerja keras membangun kembali negara kita."
 FRA_continue_the_fight: "Lanjutkan Pertarungan"
 FRA_continue_the_fight_desc: "Hanya sedikit tentara yang memilih untuk bergabung dengan kami sejauh ini, namun mereka yang kami miliki harus dipersenjatai dan diperlengkapi."
 FRA_the_free_french_navy: "Angkatan Laut Prancis Merdeka"
 FRA_the_free_french_navy_desc: "Sekutu kita sedang berjuang mati-matian untuk bertahan hidup, yang mana jalur laut sangat penting. Kita harus melakukan bagian kita untuk membantu mereka."
 FRA_colonial_recruitment_desc: "Karena tanah air kita tidak bisa direkrut, kita harus beralih ke koloni kita untuk mendapatkan bantuan. Banyak rakyat kita yang bersedia mengangkat senjata untuk berperang demi kita."
 FRA_the_regiment_normandie: "Resimen Normandie"
 FRA_the_regiment_normandie_desc: "Sangat penting bagi kami, orang Prancis, untuk terlihat berjuang di semua lini. Ketika Soviet kini terlibat dalam pertempuran melawan musuh bersama, kita dapat mengirimkan sekelompok kecil pilot pesawat tempur untuk membantu mereka."
 FRA_refus_absurde: "Tolak Absurd"
 FRA_refus_absurde_desc: "Bahkan di saat-saat kekalahan, keinginan untuk melawan masih kuat di hati sebagian orang. Mereka akan menjadi landasan gerakan perlawanan di wilayah pendudukan."
 FRA_the_maquis: "Maquis"
 FRA_the_maquis_desc: "Daerah pedesaan di Perancis menawarkan perlindungan bagi siapa saja yang ingin melarikan diri dari penjajah atau antek-antek kolaborator mereka. Kita harus mendukung orang-orang yang menolak melakukan perlawanan terhadap musuh, sehingga pada waktunya kita dapat mengubah wilayah tersebut menjadi sarang perlawanan."
 FRA_reach_out_to_trade_unions: "Menjangkau Serikat Pekerja"
 FRA_reach_out_to_trade_unions_desc: "Jika kita ingin menyerang industri-industri yang kini telah dimanfaatkan oleh musuh, maka menjalin komunikasi yang baik dengan para pekerja di sana sepertinya merupakan cara terbaik. Mereka dapat menunda atau menyabotase produksi apa pun yang sedang berlangsung, jauh lebih efisien dibandingkan kekuatan luar."
 FRA_cooperation_with_the_communists: "Kerja Sama Dengan Komunis"
 FRA_cooperation_with_the_communists_desc: "Dalam perjuangan kita bersama, kita tidak boleh menolak sekutu mana pun yang menawarkan diri – bahkan jika mereka menyebut diri mereka kawan."
 FRA_connections_to_industrialists: "Koneksi Dengan Industrialis"
 FRA_connections_to_industrialists_desc: "Meskipun kerja sama dengan para pekerja di industri perang memang membantu, kerja sama dengan orang-orang yang menjalankan pabrik mempunyai manfaat tersendiri."
 FRA_the_civil_and_military_organization: "Organisasi Sipil dan Militer"
 FRA_the_civil_and_military_organization_desc: "Banyaknya kelompok kecil yang melakukan aksi perlawanan bersatu untuk membentuk organisasi yang lebih besar. Kita harus memberikan restu kita pada hal ini."
 FRA_national_council_of_the_resistance_desc: "Perlawanan semakin kuat di Perancis, dan menjadi begitu kuat sehingga memerlukan komite pengarah baru untuk mengkoordinasikan kegiatannya."
 FRA_national_uprising_desc: "Saatnya telah tiba. Sekaranglah waktunya untuk mengangkat senjata dan keluar dari bayang-bayang yang telah menyelubungi Anda selama bertahun-tahun!"
 FRA_french_forces_of_the_interior: "Pasukan Dalam Negeri Prancis"
 FRA_french_forces_of_the_interior_desc: "Perlawanan mempunyai ribuan orang bersenjata, di seluruh Perancis. Saat kami dan sekutu kami maju ke seluruh negeri, kami akan menyapu bersih mereka dan mengubah mereka menjadi tentara di pasukan kami."
 FRA_french_forces_of_the_interior_tt: "Menciptakan unit infanteri yang lemah di setiap negara inti yang dibebaskan."
 FRA_naval_rearmament: "Persenjataan Kembali Angkatan Laut"
 FRA_naval_rearmament_desc: "Industri pembuatan kapal kita dibiarkan lesu sementara kita fokus untuk mengikuti perkembangan di bidang lain. Akibatnya, kita kini berada dalam bahaya dikalahkan oleh pesaing kita di kawasan Mediterania dan Atlantik. Kita harus berinvestasi lebih banyak untuk mengganti waktu yang hilang."
 FRA_colonial_naval_bases: "Pangkalan Angkatan Laut Kolonial"
 FRA_colonial_naval_bases_desc: "Kunci dari proyeksi kekuatan global adalah kemampuan untuk mempertahankan armada yang jauh dari perairan asal. Kita sudah mempunyai wilayah kolonial yang besar, sekarang kita harus mengembangkannya untuk dijadikan pangkalan pengisian bahan bakar dan perbaikan armada kita."
 FRA_develop_colonial_dockyards: "Mengembangkan Galangan Kapal Kolonial"
 FRA_develop_colonial_dockyards_desc: "Dengan perluasan dan modernisasi pangkalan angkatan laut di berbagai bagian Kekaisaran kita, kita dapat mempertimbangkan untuk menyelesaikan industri berat yang diperlukan dan membangun dermaga besar yang diperlukan untuk membangun kapal di luar negeri."
 FRA_the_old_school: "Sekolah Tua"
 FRA_the_old_school_desc: "Terlepas dari semua kemajuan dalam teknologi angkatan laut, elemen kunci dari kekuatan laut tetaplah kapal besar yang bertindak dengan dukungan unit armada lainnya. Apakah kapal modal ini masih berupa kapal perang atau kapal induk baru, kita harus lebih meningkatkan ukuran industri pembuatan kapal untuk memastikan kita dapat mengimbangi kekuatan angkatan laut lainnya."
 FRA_carrier_planes: "Pesawat Pengangkut"
 FRA_carrier_planes_desc: "Sebuah kapal induk hanya sebaik pesawatnya. Tanpa pesawat modern, maskapai penerbangan mana pun hanyalah investasi yang sia-sia."
 FRA_rush_the_richelieus: "Terburu-buru Richelieus"
 FRA_rush_the_richelieus_desc: "Dengan situasi di Eropa yang semakin menyedihkan, kita tidak punya waktu untuk membangun unit permukaan baru melalui cara konvensional. Kami harus memprioritaskan material agar kapal perang baru kami dapat digunakan sesegera mungkin."
 FRA_prioritize_the_joffre: "Prioritaskan Joffre"
 FRA_prioritize_the_joffre_desc: "Armada kapal induk kita saat ini sudah ketinggalan jaman dan kalah bersaing dengan musuh potensial mana pun. Kita harus memastikan bahwa proyek kapal induk baru mendapat prioritas utama."
 FRA_the_young_school: "Sekolah Muda"
 FRA_the_young_school_desc: "Perkembangan di bidang penerbangan, kapal selam, dan torpedo telah membuat kapal induk menjadi usang. Dengan terbatasnya industri angkatan laut, kita tidak boleh membuang waktu dan uang untuk membangun benteng terapung raksasa yang tidak berdaya melawan ancaman medan perang angkatan laut modern. Kita sebaiknya fokus pada peningkatan efisiensi agar kita bisa membangun lebih banyak kapal kecil."
 FRA_undersea_combat: "Pertempuran Bawah Laut"
 FRA_undersea_combat_desc: "Kapal selam ini telah mencapai kematangan dalam dekade terakhir. Kini ia menjadi ancaman mematikan bagi semua kapal permukaan, dan semakin sulit dideteksi dan dihancurkan."
 FRA_surface_combat: "Pertempuran Permukaan"
 FRA_surface_combat_desc: "Dengan kemajuan dalam bidang meriam, menjadi mustahil untuk membangun sebuah kapal yang dapat bertahan dalam pertarungan slugging yang berkepanjangan dengan kapal besar lainnya. Jauh lebih baik jika memiliki armada kapal perusak dan kapal torpedo modern untuk mengalahkan musuh dengan tembakan torpedo dalam jumlah besar."
 FRA_prioritize_the_joffre_tt: "Menambahkan §YCarrier§! modern dengan penyelesaian 40% ke antrean konstruksi."
 POR_infrastructure_in_angola_tt: "Tambahkan §Y2 Pangkalan Angkatan Laut§! di provinsi Cabinda di Angola.\nTambahkan §Y3 Pangkalan Angkatan Laut§! di provinsi Luanda di Angola."
 FRA_SNCAN_formed: "SNCAN terbentuk"
 FRA_SNCAO_formed: "Membentuk SNCAO"
 FRA_SNCASE_formed: "Terbentuk SNCASE"
 FRA_SNCASO_formed: "Membentuk SNCASO"
 vichy_french_focus: "Pohon Fokus Perancis Vichy"
 POR_colonial_assimilation_policy_desc: "Berbeda dengan negara-negara lain, bangsa Portugis tidak ditentukan oleh ras, namun oleh budaya bersama dan misi peradaban. Daripada berprasangka rasial, kita perlu miscegenation."
 POR_colonial_army_desc: "Untuk memiliki bangsa yang kuat, kita tidak bisa hanya mengandalkan Tentara Metropolitan saja. Kita harus meningkatkan unit-unit kolonial, mempersenjatai mereka dan melatih mereka untuk berperang dalam peperangan modern."
 POR_luso_tropicalism: "Luso-Tropikalisme"
 POR_luso_tropicalism_desc: "Kita harus mengakui sifat multikultural Portugal sejak abad ke-15 dan menekankan persatuan nasional, mengintegrasikan koloni-koloni Afrika ke dalam wilayah kita dan memberikan kewarganegaraan kepada penduduk lokal. Tentu saja akan ada pencela, tapi kita harus melakukan apa yang benar bagi masyarakat yang tinggal di wilayah kita."
 POR_limited_self_rule: "Pemerintahan Sendiri yang Terbatas"
 POR_limited_self_rule_desc: "Dengan meningkatkan otonomi koloni-koloni kita di Afrika, dan memungkinkan mereka membentuk pemerintahan sendiri, kita dapat berkonsentrasi pada hal-hal yang lebih mendesak. Dekolonisasi ini dapat membawa kita lebih dekat dengan negara-negara demokrasi di seluruh dunia."
 POR_restart_investment_into_timor: "Memulai Kembali Investasi ke Timor"
 POR_restart_investment_into_timor_desc: "Timor dipandang sebagai beban ekonomi selama masa Depresi Besar, dan oleh karena itu hanya menerima sedikit dukungan atau pengelolaan dari kami sejak krisis pertama kali terjadi. Dengan adanya investasi perusahaan pengembang Jepang Nan'yō Kōhatsu di wilayah tersebut, mungkin inilah saatnya untuk melanjutkan investasi kami di sana juga."
 POR_revert_the_local_autonomy_policies: "Mengembalikan Kebijakan Otonomi Daerah"
 POR_revert_the_local_autonomy_policies_desc: "Setelah Pemberontakan Manufahi pada tahun 1911, kebijakan kolonial kita telah beralih kembali ke penggunaan penguasa pribumi sebagai pemimpin, dan mengabaikan upaya-upaya sebelumnya untuk melakukan integrasi lebih lanjut di wilayah tersebut. Mungkin kita harus mengembalikan hal ini, dan merangkul multikulturalisme di negara kita."
 POR_invest_in_sandalwood_and_coffee_production: "Berinvestasi dalam Produksi Kayu Cendana dan Kopi"
 POR_invest_in_sandalwood_and_coffee_production_desc: "Perusahaan perkebunan utama kami di Timor, SAPT, akan memperoleh keuntungan besar dari tambahan investasi pemerintah. Jika kita mendanai mereka sekarang, produk mereka mungkin akan memberi kita keuntungan besar di masa depan."
 POR_haven_of_neutrality_macau: "Makau, Surga Netralitas"
 POR_haven_of_neutrality_macau_desc: "Dengan sikap netral kami saat ini dan konflik yang sedang berkecamuk di seluruh Asia, Makau telah menjadi mercusuar harapan dan stabilitas selama masa-masa penuh gejolak ini. Kita harus berinvestasi dalam memperluas provinsi ini."
 POR_infrastructure_in_angola: "Infrastruktur di Angola"
 POR_infrastructure_in_angola_desc: "Angola memiliki banyak kekayaan yang belum dijelajahi. Kita harus mengembangkan infrastruktur di wilayah ini untuk memanfaatkan sumber dayanya di masa depan."
 POR_develop_north_angola: "Kembangkan Angola Utara"
 POR_develop_north_angola_desc: "Kita telah menemukan sumber besi di Angola Utara, kita harus membangun industri ekstraksi yang diperlukan untuk memanfaatkan sumber daya yang berharga ini."
 POR_develop_south_angola: "Kembangkan Angola Selatan"
 POR_develop_south_angola_desc: "Pencarian sumber daya di Angola selatan telah berhasil. Sekarang kita dapat mengembangkan industri eksploitasi yang dibutuhkan."
 POR_portuguese_oil: "Minyak Portugis"
 POR_portuguese_oil_desc: "Sebuah negara tanpa minyak tidak akan mampu mempertahankan perekonomiannya jika terjadi konflik. Kita harus mencari ladang minyak yang layak secara komersial di Angola."
 POR_develop_mozambique: "Kembangkan Mozambik"
 POR_develop_mozambique_desc: "Dengan mengembangkan infrastruktur dan industri di Mozambik, kita akan dapat memanfaatkan sumber aluminiumnya untuk keuntungan kita."
 POR_continue_the_public_works: "Lanjutkan Pekerjaan Umum"
 POR_continue_the_public_works_desc: "Berkat peraturan negara yang diterapkan pemerintah kami setelah bertahun-tahun mengalami situasi keuangan yang sulit, kami telah berhasil menstabilkan situasi ekonomi kami dan kami harus terus berinvestasi dalam proyek-proyek publik untuk merangsang infrastruktur kami."
 POR_instituto_superior_tecnico: "Instituto Superior Técnico"
 POR_instituto_superior_tecnico_desc: "Portugal membutuhkan sekolah Teknik yang maju dengan fasilitas pengajaran dan penelitian yang canggih agar tidak ketinggalan dalam perjuangan yang semakin dekat."
 POR_ogme: "OGME"
 POR_ogme_desc: "Dengan berinvestasi di Oficinas Gerais de Material de Engenharia kami akan dapat memasok peralatan modern dan berkualitas tinggi kepada tentara kami dengan lebih cepat."
 POR_ogma: "OGMA"
 POR_ogma_desc: "Meningkatkan fasilitas Oficinas Gerais de Material Aeronáutico akan meningkatkan produksi pesawat kami secara signifikan."
 POR_roads_bridges_and_dams: "Jalan, Jembatan, dan Bendungan"
 POR_roads_bridges_and_dams_desc: "Kita harus berinvestasi dalam proyek konstruksi publik yang berfokus pada peningkatan infrastruktur dan sistem jalan."
 POR_extraction_industries: "Industri Ekstraksi"
 POR_extraction_industries_desc: "Banyak kekayaan kami yang terletak di dalam tanah, namun tambang kami sudah tua dan buatan tangan. Kita harus membangun Industri Ekstraksi Modern."
 POR_hydroelectricity: "pembangkit listrik tenaga air"
 POR_hydroelectricity_desc: "Dengan investasi besar yang dilakukan di Portugal Utara dan Tengah, kini dimungkinkan untuk membangun jaringan bendungan yang akan menghasilkan listrik dan mengatur aliran sungai."
 POR_military_vehicles: "Kendaraan Militer"
 POR_military_vehicles_desc: "Tentara kita membutuhkan kendaraan modern untuk pertempuran yang akan datang. Jika kita ingin menang dalam konflik di masa depan, kita harus memastikan mereka mendapatkan pasokan yang cukup dan berkualitas tinggi."
 POR_portuguese_artillery: "Artileri Portugis"
 POR_portuguese_artillery_desc: "Artileri lapangan sangat penting di medan perang modern. Kita harus berinvestasi dalam membangun fasilitas baru yang memungkinkan kita meningkatkan produksi senjata artileri."
 POR_advanced_artillery: "Artileri Tingkat Lanjut"
 POR_advanced_artillery_desc: "Kita harus mengembangkan artileri baru dan melatih pasukan dengan cara yang lebih efisien untuk melakukan serangan dan mendukung gerak maju infanteri."
 POR_military_research_facilities: "Fasilitas Penelitian Militer"
 POR_military_research_facilities_desc: "Upaya kita untuk meningkatkan industri persenjataan harus dibarengi dengan investasi penelitian yang memadai jika kita ingin mempertahankan angkatan bersenjata yang modern dan kompeten."
 POR_armor_focus: "Fokus Armor"
 POR_armor_focus_desc: "Untuk mendominasi medan perang kita membutuhkan mesin perang terbaik. Kita harus memperluas fasilitas produksi kendaraan lapis baja dan berinvestasi dalam penelitian lebih lanjut."
 POR_mechanized_focus: "Fokus Mekanis"
 POR_mechanized_focus_desc: "Kendaraan mekanis jauh lebih cocok dibandingkan kendaraan beroda lainnya untuk melindungi prajurit infanteri kita ketika mereka berada di bawah serangan musuh. Penelitian dan produksi kendaraan semacam ini terbukti penting."
 POR_light_aircraft_focus: "Fokus Pesawat Ringan"
 POR_light_aircraft_focus_desc: "Penerbangan terus berkembang dan kita harus mengembangkan industri pesawat terbang yang tepat untuk mendukung tentara kita."
 POR_advanced_light_aircraft: "Pesawat Ringan Canggih"
 POR_advanced_light_aircraft_desc: "Koordinasi antara penerbangan dan cabang angkatan bersenjata lainnya sangatlah penting. Mengembangkan pesawat modern untuk mendukung pasukan kita akan secara drastis meningkatkan keberhasilan kita dalam pertempuran."
 POR_jet_research: "Penelitian Jet"
 POR_jet_research_desc: "Jika kita ingin mendominasi angkasa, kita harus menerapkan kemajuan terbaru pada pesawat kita. Penelitian tentang cara-cara baru untuk menggerakkan pesawat kita, seperti mesin jet, tampaknya merupakan jalur yang paling menjanjikan untuk dilakukan."
 POR_industrial_modernization: "Modernisasi Industri"
 POR_industrial_modernization_desc: "Sebagian besar industri sipil kita masih ketinggalan zaman. Ini akan menjadi jauh lebih efisien jika kita meluangkan waktu dan sumber daya untuk berinvestasi pada peningkatannya."
 POR_a_new_industry_desc: "Berkat kemajuan teknologi terkini dalam produksi otomatis, kami dapat terus meningkatkan dan memperluas fasilitas sipil untuk mencapai tingkat efisiensi baru."
 POR_food_industries: "Industri Makanan"
 POR_food_industries_desc: "Sudah waktunya bagi Portugal untuk melangkah maju dan memperkuat industri manufakturnya. Kita bisa memulainya dengan mengembangkan pabrik pangan di wilayah utara."
 POR_textile_industry: "Industri Tekstil"
 POR_textile_industry_desc: "Untuk mencapai potensi penuh industri tekstil kita, kita harus membangun pabrik baru yang memungkinkan kita memproses kapas dalam jumlah besar yang diproduksi di wilayah kita."
 POR_second_navy_reequipment: "Peralatan Angkatan Laut Kedua"
 POR_second_navy_reequipment_desc: "Tahap pertama program Peralatan Angkatan Laut telah selesai. Sekarang kita harus melanjutkan ke tahap kedua, memperbaiki Galangan Kapal Angkatan Laut kita dan membuka tender pembelian sejumlah kapal modern di luar negeri."
 POR_a_powerful_merchant_marine: "Pedagang Laut yang Kuat"
 POR_a_powerful_merchant_marine_desc: "Kita perlu membangun armada pedagang besar yang mampu mengangkut semua sumber daya yang dibutuhkan perekonomian kita. Hal ini dapat dilakukan dengan membangun kapal dagang di Galangan Kapal yang lebih kecil."
 POR_merchant_marine_protection: "Perlindungan Laut Pedagang"
 POR_merchant_marine_protection_desc: "Pengalaman kami dalam Perang Besar telah mengajarkan kami bahwa kapal dagang harus dilindungi dari ancaman kapal selam."
 POR_submarine_effort: "Upaya Kapal Selam"
 POR_submarine_effort_desc: "Kita harus memulai penelitian dan produksi kapal selam modern. Ini akan memberi kita keuntungan besar setelah kita bergabung dalam peperangan bawah air."
 POR_fuzileiros: "Fuzileiros"
 POR_fuzileiros_desc: "Angkatan Laut yang terlatih sangat penting bagi keamanan harta benda kita di luar negeri."
 POR_naval_research_institute: "Lembaga Penelitian Angkatan Laut"
 POR_naval_research_institute_desc: "Dengan investasi yang tepat, Escola Naval kami dapat meningkatkan upaya penelitiannya dan memberikan pendidikan berkualitas lebih tinggi bagi perwira masa depan."
 POR_air_naval_research: "Penelitian Angkatan Laut Udara"
 POR_air_naval_research_desc: "Kita harus mengumpulkan pilot dan perwira angkatan laut terbaik kita untuk merancang cara-cara baru dalam mengoordinasikan angkatan udara dan angkatan laut kita yang sedang berkembang."
 POR_arsenal_do_alfeite: "Arsenal melakukan Alfeite"
 POR_arsenal_do_alfeite_desc: "Prioritas utama kita adalah membangun Angkatan Laut yang kuat dan mampu melindungi kerajaan kita yang sangat luas. Kita harus mempunyai kapasitas dan pengetahuan untuk membangun kapal yang lebih besar. Galangan Kapal Angkatan Laut utama di Lisbon harus diperbesar dan para ahli di bidang pembuatan kapal harus dipekerjakan."
 POR_national_cruiser_production: "Produksi Kapal Penjelajah Nasional"
 POR_national_cruiser_production_desc: "Kita harus terus fokus pada pembangunan kapal besar. Kapal penjelajah modern akan memberi angkatan laut kita daya tembak yang besar."
 POR_battleship_effort: "Upaya Kapal Perang"
 POR_battleship_effort_desc: "Jika kita ingin menguasai lautan, kita harus meningkatkan produksi kapal perang modern yang kuat yang akan membuat angkatan laut banyak negara gemetar ketika memikirkannya."
 POR_carrier_effort: "Upaya Pembawa"
 POR_carrier_effort_desc: "Dengan meningkatnya ancaman yang ditimbulkan oleh pesawat modern, kapal induk menjadi semakin penting dalam pertempuran di lautan."
 POR_atlantic_defense_strategy: "Strategi Pertahanan Atlantik"
 POR_atlantic_defense_strategy_desc: "Pulau-pulau kita yang terisolasi di tengah lautan bisa dengan mudah direbut satu per satu. Namun, dengan investasi yang tepat, mereka dapat diubah menjadi kapal induk yang tidak dapat tenggelam!"
 POR_endless_sea_desc: "Daerah kantong kita di Asia rentan terhadap permusuhan dari kerajaan-kerajaan yang mengelilinginya. Kita harus fokus memperkuat pertahanan mereka sehingga mereka dapat melawan potensi invasi apa pun."
 POR_popular_front: "Front Populer"
 POR_popular_front_desc: "Front Populer Spanyol menunjukkan jalannya. Kita harus menyatukan kaum Komunis, Sosialis, dan Anarkis dalam sebuah front luas yang akan menjadi ujung tombak perlawanan terhadap Fasisme dan Revolusi Dunia."
 POR_nation_in_arms_desc: "Rakyat Portugal perlu bersiap melawan kejahatan Fasisme dan Imperialisme. Kita harus menyerahkan senjata kepada mereka dan memulai pelatihan militer sehingga ketika saatnya tiba, bangsa kita siap berperang!"
 POR_unify_leftist_youth_wings: "Satukan Sayap Pemuda Kiri"
 POR_unify_leftist_youth_wings_desc: "Kami akan mendirikan sayap pemuda PCP, menyatukan organisasi-organisasi yang ada saat ini dan menarik calon anggota untuk bergabung. Hal ini akan mengarah pada terciptanya sebuah platform di mana anggota-anggota muda kita dapat bertemu, berdiskusi dan mengambil langkah pertama mereka dalam kegiatan politik kita."
 POR_nationalize_industry: "Nasionalisasi Industri"
 POR_nationalize_industry_desc: "Modal swasta telah terlalu lama menguras perekonomian kita dan menghambat kemajuan masyarakat kita. Kita harus menghilangkannya dengan menasionalisasi perusahaan-perusahaan swasta dan mengambil alih produksi setiap pabrik, demi kepentingan rakyat Portugal."
 POR_reorganization_of_the_communist_party: "Reorganisasi Partai Komunis"
 POR_reorganization_of_the_communist_party_desc: "Selama rezim diktator Salazar, banyak anggota partai kami ditangkap. Kami akan membawa mereka kembali dan mengatur ulang struktur partai kami, memastikan bahwa setiap departemen dikelola oleh orang-orang yang memiliki kualifikasi terbaik."
 POR_potential_civil_war_low_requirement_tt: "§RJika §YStabilitas§! §Rberada di bawah §Y40%§Rpada saat fokus ini selesai, perang saudara akan dimulai!§!§!§!§!"
 POR_potential_civil_war_high_requirement_tt: "§RJika §YStabilitas§! §Rberada di bawah §Y60%§Rpada saat fokus ini selesai, perang saudara akan dimulai!§!§!§!§!"
 POR_join_the_comintern: "Bergabunglah dengan Komintern"
 POR_join_the_comintern_desc: "Uni Soviet telah membuka jalan bagi negara-negara lain untuk mengikuti jejak Sosialis mereka. Akan bermanfaat bagi kita untuk bekerja sama dengan rekan-rekan Soviet kita, karena kita semua mempunyai tujuan yang sama."
 POR_research_collaboration: "Kolaborasi Penelitian"
 POR_research_collaboration_desc: "Kawan-kawan kita di Uni Soviet mempunyai program penelitian dan pengembangan yang ambisius dan didanai dengan baik. Kesepakatan untuk berbagi kemajuan teknologi mereka dengan kita akan saling menguntungkan dalam perang proletar kita."
 POR_support_the_spanish_republic: "Mendukung Republik Spanyol"
 POR_support_the_spanish_republic_desc: "Rakyat Spanyol sedang berjuang melawan kudeta Nasionalis yang mengancam akan mengambil alih seluruh negara mereka. Kita harus mendukung Partai Republik sekarang karena jika mereka binasa, kita akan menghadapi musuh baru yang potensial di hadapan kita."
 POR_workers_of_iberia_unite: "Pekerja Iberia, Bersatu!"
 POR_workers_of_iberia_unite_desc: "Kita harus memproklamasikan persatuan proletariat Iberia melawan segala jenis tirani dan bergabung dengan kawan-kawan Spanyol kita dalam Perang Saudara, menjadi benteng melawan Fasisme.\nPengorbanan kita tidak akan dilupakan, karena pengorbanan kita adalah tujuan yang adil!"
 POR_workers_of_iberia_unite_civil_war_tt: "§RPendukung §YNon-Blok§! akan memulai perang saudara§!"
 POR_the_iberian_socialist_union: "Kesatuan Sosialis Iberia"
 POR_the_iberian_socialist_union_desc: "Perjuangan kita bersama dengan Partai Republik Spanyol selama perang menunjukkan kepada kita bahwa inilah saatnya untuk menyatukan Semenanjung Iberia di bawah pemerintahan Sosialis Populer.\nBersama kita akan mengalahkan musuh kita untuk selamanya!"
 POR_visit_the_front: "Kunjungi Bagian Depan"
 POR_visit_the_front_desc: "Beberapa perwira Portugis akan dikirim untuk mengunjungi front Spanyol. Mereka akan melakukan inspeksi yang berfokus pada penggunaan teknik-teknik baru oleh angkatan udara."
 POR_they_need_our_help: "Mereka Membutuhkan Bantuan Kita"
 POR_they_need_our_help_desc: "Situasi di Spanyol sangat kritis. Kita harus bertindak sekarang jika ingin mencegah kemenangan kaum Nasionalis. Kami akan bergabung dengan saudara kami di Spanyol dalam perjuangan mereka; bersama-sama kita akan mengalahkan pemberontak!"
 POR_intervention_in_spain: "Intervensi di Spanyol"
 POR_intervention_in_spain_desc: "Keberpihakan pemerintah Spanyol tidak dapat kami terima. Ambisi mereka telah menjadi ancaman terhadap cita-cita kita dan rakyat kita, jadi kita harus mengambil tindakan dan memberantas sikap bermusuhan ini dengan kekerasan."
 POR_intervention_in_spain_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nKeuntungan §YMenggulingkan Pemerintah§! tujuan perang melawan [GetSpanishRepublicFlagAndNameDef]."
 POR_securing_the_free_world: "Mengamankan Dunia Bebas"
 POR_securing_the_free_world_desc: "Jika kita ingin menjadi kekuatan besar, akan lebih baik jika kita mulai bertindak seperti itu. Kami akan melindungi negara-negara kecil yang memiliki cita-cita dan kepentingan yang sama dengan kami terhadap potensi ancaman asing."
 portugal_guarantees_freedom_tt: "Menjamin kemerdekaan semua negara kecil §YDemokrat§! atau §YNon-Blok§! yang independen di Eropa."
 POR_protect_chinese_civilians: "Lindungi Warga Sipil Tiongkok"
 POR_protect_chinese_civilians_desc: "Laporan mengenai manuver militer asing di dekat wilayah Portugis di Makau mulai menimbulkan kegelisahan di kalangan penduduk sipil. Kami tidak akan mentolerir segala ancaman terhadap warga negara atau tanah kami; kita harus bertindak sekarang demi kejayaan bangsa kita!"
 POR_strict_neutrality_in_the_spanish_civil_war: "Netralitas Ketat dalam Perang Saudara Spanyol"
 POR_strict_neutrality_in_the_spanish_civil_war_desc: "Perang Saudara Spanyol telah pecah, namun kita tidak boleh terseret ke dalam konflik internasional saat ini. Kita harus menyatakan kebijakan netralitas yang ketat sambil memperkuat bangsa kita dan meningkatkan hubungan diplomatik kita."
 POR_british_investment_in_mines: "Investasi Inggris di Pertambangan"
 POR_british_investment_in_mines_desc: "Pemerintah Inggris telah menunjukkan minatnya untuk berinvestasi dalam eksploitasi sumber daya di negara kita. Ini bisa menjadi peluang berharga untuk meningkatkan fasilitas ekstraksi dan kemajuan kami dalam penelitian dan pengembangan."
 POR_british_industrial_investments: "Investasi Industri Inggris"
 POR_british_industrial_investments_desc: "Industri sipil kita perlu diperluas untuk memenuhi tuntutan pertumbuhan ekonomi kita. Pemerintah Inggris tertarik untuk melakukan investasi baru di negara kita, selama kita sejalan dengan cita-cita mereka..."
 POR_allow_free_elections: "Izinkan Pemilu yang Bebas"
 POR_allow_free_elections_desc: "Pengaruh Inggris akhirnya berkembang di Portugal, dan rakyat kita menuntut hak untuk memilih pemerintahan yang paling mewakili kepentingan mereka."
 POR_join_the_allies: "Bergabunglah dengan Sekutu"
 POR_join_the_allies_desc: "Inilah saatnya untuk mengikuti jejak negara-negara demokrasi besar di Eropa dan bergabung dengan mereka dalam perjuangan mereka. Bersama-sama kita akan bertahan melawan musuh apa pun!"
 POR_research_sharing: "Berbagi Penelitian"
 POR_research_sharing_desc: "Saudara seperjuangan kita dari Inggris jauh lebih maju dari kita dalam hal penelitian teknologi. Perjanjian berbagi penelitian akan memperkuat kita dan, oleh karena itu, aliansi kita."
 POR_oppose_germany: "Menentang Jerman"
 POR_oppose_germany_desc: "Permusuhan Jerman benar-benar tidak dapat ditoleransi, namun sejauh ini belum ada yang mampu menghentikannya. Kini setelah tentara kita akhirnya siap berperang, Portugal akan ikut berjuang dan menghadapi semua orang yang berusaha merampas kebebasan negara mereka."
 POR_british_guns: "Senjata Inggris"
 POR_british_guns_desc: "Industri militer kita tidak siap memproduksi senjata perang modern. Kita bisa menandatangani perjanjian untuk membelinya di Inggris."
 POR_estado_novo_desc: "Kami telah mengikuti prinsip-prinsip Korporatisme dan Autarki sejak konstitusi kami tahun 1933. Jalan paling pasti menuju penguatan nasional yang lebih besar adalah dengan lebih menekankan pendekatan ini, dengan membangun negara baru yang lebih kuat."
 POR_support_the_spanish_nationalists: "Dukung Nasionalis Spanyol"
 POR_support_the_spanish_nationalists_desc: "Kita harus menunjukkan dukungan kita kepada kaum Nasionalis Spanyol, yang berjuang demi kejayaan negara mereka melawan ancaman Komunis dan Anarkis."
 POR_portuguese_legion: "Legiun Portugis"
 POR_portuguese_legion_desc: "Menanggapi pecahnya Perang Saudara Spanyol, polisi militer telah dikirim ke perbatasan. Kita harus menciptakan milisi bersenjata yang bersifat sukarela dan patriotik yang mampu menjalankan tugas kepolisian mereka."
 POR_observation_mission: "Misi Observasi"
 POR_observation_mission_desc: "Misi Pengamatan Militer akan dikirim ke Spanyol untuk memeriksa taktik baru dan sistem senjata yang digunakan."
 POR_send_assistance: "Kirim Bantuan"
 POR_send_assistance_desc: "Nasib kaum Nasionalis dalam Perang Saudara Spanyol berada di ujung tanduk ketika garis depan tampaknya telah berkonsolidasi. Kita harus ikut berjuang dan membantu pemberontak untuk mengalahkan pemerintah republik, memberantas ancaman Komunis di Iberia untuk selamanya."
 POR_nationalist_intervention: "Intervensi Nasionalis"
 POR_nationalist_intervention_desc: "Ambisi pemerintah Spanyol mengancam kepentingan kami, dan hal ini tidak dapat kami toleransi. Jika tetangga kita tidak mau sejalan dengan tujuan kita, maka kita harus memaksa mereka untuk melakukan hal tersebut dengan cara yang lebih persuasif."
 POR_nationalist_intervention_tt: "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\nKeuntungan §YMenggulingkan Pemerintah§! tujuan perang melawan [SPA.GetFlag][SPA.GetNameDefCap]."
 POR_national_syndicalism_desc: "Kami akan memperbaiki kesalahan Salazar yang membubarkan Gerakan Sindikalis Nasional dan mengasingkan Francisco Rolão Preto. Kita harus melegitimasi gerakan ini sekali lagi dan mengembalikan Preto."
 POR_camisas_azuis: "Camisas Azuis"
 POR_camisas_azuis_desc: "Camisas Azuis adalah milisi bersenjata Sindikalis Nasional, namun kelompok tersebut dikutuk dan dibubarkan karena cita-cita mereka. Kita harus mengizinkan pembentukan organisasi ini sekali lagi, karena mobilisasi Kaus Biru akan memberikan sumber tenaga kerja yang berharga bagi tentara kita."
 POR_join_the_axis: "Bergabunglah dengan Poros"
 POR_join_the_axis_desc: "Kita harus menyelaraskan diri dengan Jerman dan mendukung mereka dalam konflik yang akan datang. Jerman mungkin merupakan kekuatan utama di Eropa tengah, namun Portugal akan menjadi Kekaisaran luar negeri yang paling kuat!"
 POR_research_agreements: "Perjanjian Penelitian"
 POR_research_agreements_desc: "Kita harus mencapai kesepakatan dengan Jerman yang memberi kita akses terhadap teknologi militer canggihnya, yang akan meningkatkan penelitian kita dan memungkinkan kita mengerahkan peralatan yang lebih baik di medan perang."
 POR_the_fifth_empire_desc: "Kekaisaran Kelima mewakili perpaduan tertinggi antara pengetahuan intelektual dan spiritual, Iman dan Kekaisaran. Hanya Bangsa Portugis yang dapat memimpin jalan menuju kenyataan ini, menyatukan seluruh dunia tidak hanya dalam wilayah, namun juga dalam semangat dan budaya."
 POR_expand_the_chinese_territories: "Perluas Wilayah Tiongkok"
 POR_expand_the_chinese_territories_desc: "Kini, ketika negara-negara Asia melemah karena perang, sudah waktunya bagi kita untuk memperluas wilayah kita dari Makau hingga Tiongkok. Tentara Tiongkok dan Jepang yang kelelahan bukanlah tandingan kami!"
 POR_expand_the_chinese_territories_tt: "Mendapatkan §YAnnex§! tujuan perang melawan negara yang memiliki:\n[592.GetName] ([592.Owner.GetFlag]§Y[592.Owner.GetName]§!)\n[594.GetName] ([594.Owner.GetFlag]§Y[594.Owner.GetName]§!)\n[325.GetName] ([325.Owner.GetFlag]§Y[325.Owner.GetName]§!)\n[613.GetName] ([613.Owner.GetFlag]§Y[613.Owner.GetName]§!)\n[622.GetName] ([622.Owner.GetFlag]§Y[622.Owner.GetName]§!)\n[604.GetName] ([604.Owner.GetFlag]§Y[604.Owner.GetName]§!)\n[615.GetName] ([615.Owner.GetFlag]§Y[615.Owner.GetName]§!)\n[611.GetName] ([611.Owner.GetFlag]§Y[611.Owner.GetName]§!)\n[328.GetName] ([328.Owner.GetFlag]§Y[328.Owner.GetName]§!)"
 POR_deal_with_the_japanese_threat: "Menghadapi Ancaman Jepang"
 POR_deal_with_the_japanese_threat_desc: "Tentara Jepang mengancam wilayah kekuasaan kita di Pasifik, menduduki wilayah-wilayah kantong di sekitar kita dan mengisolasi wilayah jajahan kita. Kita harus mengantisipasi potensi permusuhan mereka dengan membawa perang ke tanah air Jepang sekarang yang tidak mereka duga."
 POR_refuse_the_naval_blockade: "Tolak Blokade Laut"
 POR_refuse_the_naval_blockade_desc: "Kita bisa memanfaatkan blokade laut yang diberlakukan pada negara-negara yang berperang dengan [ENG.GetNameDef]. Para diplomat kami akan menegosiasikan perjanjian yang mudah untuk meminjamkan kapasitas pengiriman kami ke negara-negara yang memerangi [ENG.GetAdjective], dengan imbalan atas dukungan ekonomi mereka."
 POR_mapa_cor_de_rosa: "Mapa Cor-de-Rosa"
 POR_mapa_cor_de_rosa_desc: "Ini saatnya membalas penghinaan yang kita derita akibat Ultimatum Inggris pada tahun 1890. Koloni kita di Afrika Barat dan Timur pada akhirnya akan bersatu!"
 POR_recover_the_east_indies: "Pulihkan Hindia Timur"
 POR_recover_the_east_indies_desc: "Kita harus mengklaim apa yang menjadi milik kita dengan benar. Hindia Timur akan kembali berada di bawah kendali Portugis."
 POR_recover_brazil: "Pulihkan Brasil"
 POR_recover_brazil_desc: "Untuk memulihkan kejayaan Kerajaan Portugis lama, kita harus fokus pada bekas jajahan Amerika. Tanah Brazil adalah milik Portugal, dan oleh karena itu harus direbut kembali dengan paksa."
 POR_army_reorganization: "Reorganisasi Angkatan Darat"
 POR_army_reorganization_desc: "Kita perlu melakukan reorganisasi angkatan bersenjata, mengurangi jumlah perwira dan unit-unit yang tidak efisien, dan menerapkan sistem rancangan yang tepat. Hal ini akan menciptakan fondasi tentara modern."
 POR_metropolitan_army: "Tentara Metropolitan"
 POR_metropolitan_army_desc: "Bahaya paling besar bagi Portugal adalah terseret ke dalam perang Eropa dan daratan kami diserbu. Hanya tentara modern yang kuat yang dapat menghalangi musuh kita!"
 POR_standardization: "Standardisasi"
 POR_standardization_desc: "Kami perlu menerapkan sistem standardisasi yang memungkinkan peralatan kami mencapai tingkat kompatibilitas dan efisiensi yang tinggi dalam produksinya."
 POR_defend_the_borders: "Pertahankan Perbatasan"
 POR_defend_the_borders_desc: "Bahaya invasi selalu ada dan kita mempunyai perbatasan panjang yang harus dipertahankan di seluruh wilayah kita. Kita perlu membangun benteng yang memadai untuk melawan kemungkinan invasi."
 POR_rebuild_the_lines_of_torres_vedras: "Bangun kembali Garis Torres Vedras"
 POR_rebuild_the_lines_of_torres_vedras_desc: "Sejumlah perwira di kalangan petinggi menyatakan bahwa perbatasan kita terlalu luas untuk dipertahankan, dan menyarankan agar kita membangun kembali Linhas de Torres Vedras, menyesuaikan kembali benteng lama untuk peperangan modern. Jika ada musuh yang melanggar garis pertahanan kita, kita akan mundur ke Lisbon, mengikuti strategi yang sama yang membantu kita melawan invasi Perancis selama Perang Napoleon."
 POR_corpo_do_estado_maior: "Corpo do Estado Maior"
 POR_corpo_do_estado_maior_desc: "Reformasi Militer melembagakan kembali Kepala Staf Angkatan Darat (Corpo do Estado Maior) sebagai lembaga elit untuk mempelajari peperangan modern. Kita harus berinvestasi pada fasilitas baru untuk meningkatkan efisiensinya."
 POR_staff_wargames: "Permainan Staf"
 POR_staff_wargames_desc: "Kita harus fokus pada mempersiapkan petugas kita sehingga mereka dapat memanfaatkan sepenuhnya doktrin, organisasi, pelatihan, dan peralatan modern."
 POR_a_royal_wedding: "Pernikahan Kerajaan"
 POR_a_royal_wedding_desc: "Pernikahan antara Dom Duarte Nuno de Braganza, pewaris sah takhta Portugis, dan Putri Maria Francisca dari Orléans, putri calon takhta Brasil, akan menyenangkan elemen Monarki di Portugal dan Brasil."
 POR_the_return_of_duarte: "Kembalinya Duarte"
 POR_the_return_of_duarte_desc: "Mengizinkan D. Duarte Nuno de Braganza kembali ke Portugal tidak akan diterima oleh Partai Republik, tetapi ini merupakan langkah penting untuk pemulihan Monarki."
 POR_support_a_spanish_monarchy_in_the_war: "Mendukung Monarki Spanyol dalam Perang"
 POR_support_a_spanish_monarchy_in_the_war_desc: "Bukan berarti kita terlalu mengapresiasi kaum Carlist, tapi tentu saja monarki Spanyol akan jauh lebih baik daripada kehadiran rezim fasis atau komunis di semenanjung tersebut. Kita harus mendukung kejahatan yang lebih kecil..."
 POR_assist_the_requetes: "Bantu Requetés"
 POR_assist_the_requetes_desc: "Beberapa anggota angkatan darat dan udara Portugis akan dikirim ke Spanyol untuk mengawasi upaya perang kaum Carlist dan memberi nasihat kepada para pemimpin mereka. Saat berada di sana, mereka juga akan mengumpulkan informasi tentang taktik pertempuran yang digunakan oleh masing-masing pihak."
 POR_join_the_carlist_fight: "Bergabunglah dengan Pertarungan Carlist"
 POR_join_the_carlist_fight_desc: "Cara terbaik untuk memastikan kemenangan Carlist dalam perang saudara Spanyol adalah dengan memperjuangkan Requetés dan mengalahkan sendiri faksi Spanyol lainnya."
 POR_the_royal_iberian_alliance: "Aliansi Kerajaan Iberia"
 POR_the_royal_iberian_alliance_desc: "Kita harus mengupayakan kolaborasi monarki Spanyol untuk menghadapi ancaman yang ada di Eropa dan sekitarnya. Hanya dengan bersatu kita dapat meraih kemenangan di masa yang penuh gejolak ini."
 POR_monarchist_uprising_in_brazil: "Pemberontakan Monarki di Brazil"
 POR_monarchist_uprising_in_brazil_desc: "Menghimbau kaum monarki Brasil akan membantu membuka jalan bagi pemulihan takhta Brasil. Kita harus memastikan bahwa mereka menang melawan oposisi apa pun."
 POR_the_empire_of_brazil: "Kekaisaran Brasil"
 POR_the_empire_of_brazil_desc: "Panggung telah disiapkan bagi Pangeran Pedro untuk mengklaim takhta Brasil dan dinobatkan sebagai Kaisar Brasil."
 POR_the_empire_of_brazil_potential_civil_war_tt: "§RJika §YBrasil§Radalah §RBUKAN §YNon-Blok§Rdan memiliki kurang dari §Y50% Stabilitas§Ratau §Y70% Netralitas§Rketika fokus ini selesai, kaum Monarki Brasil akan memulai perang saudara, menyeret kita ke dalamnya!§!§!§!§!§!§!§!§!§!§!"
 POR_restoration_of_the_monarchy: "Pemulihan Monarki"
 POR_restoration_of_the_monarchy_desc: "Kami akan memproklamirkan pemulihan Monarki Portugis, di bawah pemerintahan D. Duarte Nuno de Braganza.\nViva o Rei de Portugal!"
 POR_the_kingdom_reunited: "Kerajaan Bersatu Kembali"
 POR_the_kingdom_reunited_desc: "Menyusul pemulihan tahta Portugis dan Brasil, kita harus melakukan penyatuan negara kita sebelum kenangan perjuangan kita bersama hilang.\nKami akan mengajukan proposal kepada pemerintah Brasil, menjelaskan bahwa jika mereka tidak menandatanganinya secara sukarela, kami akan terpaksa melanjutkan masalah tersebut dengan cara lain..."
 POR_remember_olivenca: "Ingat Olivenca"
 POR_remember_olivenca_desc: "Orang-orang Spanyol sudah lama menolak kedaulatan kami atas Olivença. Sekarang kami akan mengambilnya kembali, serta wilayah lain di sekitarnya..."
 POR_deal_with_fascism: "Menangani Fasisme"
 POR_deal_with_fascism_desc: "Fasisme adalah sebuah penyakit yang membawa kesedihan dan kesengsaraan bagi umat manusia. Sudah waktunya bagi kita untuk menentangnya, dan menyerang langsung sumbernya. Begitu kita menang, kita akan membentuk kembali dunia sesuai keinginan kita, dan ini akan menjadi lebih baik."
 POR_deal_with_fascism_tt: "Keuntungan §YAnnex§! tujuan perang melawan negara-negara Fasis besar atau tetangga:"
 POR_latin_america: "Amerika Latin"
 POR_latin_america_desc: "Kini setelah Kekaisaran kita terkonsolidasi, kita dapat melihat wilayah di sekitar wilayah kekuasaan Amerika dan merebut kembali tanah yang pernah dikuasai Kekaisaran Brasil."
 POR_the_communist_threat: "Ancaman Komunis"
 POR_the_communist_threat_desc: "Komunis secara halus menyebarkan cita-cita mereka yang menipu di kalangan masyarakat, tidak hanya di Portugal tetapi juga di seluruh dunia. Kita harus fokus memberantas ancaman global ini sebelum ancaman itu melahap kita dari dalam."
 POR_the_communist_threat_tt: "Mendapatkan §Y[GetWargoalBasedOnGovernment]§! tujuan perang melawan negara-negara Komunis besar atau tetangga:"
 POR_puppet_wargoal: "Boneka (Fokus)"
 POR_topple_government_wargoal: "Menggulingkan Pemerintahan"
 POR_annex_wargoal: "Lampiran"
 POR_promote_the_monarchist_cause_in_portugal: "Mempromosikan Perjuangan Monarki di Portugal"
 POR_promote_the_monarchist_cause_in_portugal_desc: "Kita harus mendorong dan mendukung kaum monarki dalam menyebarkan sentimen monarki di kalangan masyarakat Portugal."
 POR_kingdom_reunited_tooltip_tt: "§Y[POR.GetNameDefCap]§! dan §Y[BRA.GetNameDef]§! sekarang akan dikenal sebagai §YKekaisaran Portugal dan Brasil§!."
 POR_spr_tooltip_country_exist_tt: "[SPR.GetFlag]§YRepublik Spanyol§! ada"
 POR_spr_tooltip_at_peace_tt: "Berdamai dengan [SPR.GetFlag]§YRepublik Spanyol§!"
 POR_fascist_portugal_joins_scw_tt: "§YFasis Portugal§! bergabung dengan [SPA.GetFlag]§Y[SPA.GetNameDef]§! dalam perang mereka melawan [GetSpanishRepublicFlagAndNameDef]."
 POR_iberian_workers_effect_tooltip_tt: "[POR.GetFlag]§Y[POR.GetNameDef]§! dan [GetSpanishRepublicFlagAndNameDef] mendapat acara §Y'Iberian Workers United'§!."
 POR_spanish_republic_tt: "[GetSpanishRepublicFlagAndNameDef]:"
 POR_support_the_spanish_republic_effect_tooltip_tt: "Kirim §Y2000§! dari §YPeralatan Infanteri§! ke [GetSpanishRepublicFlagAndNameDef]. Yang lama duluan."
 POR_Spanish_Republic_SPD: "[SPD.GetFlag]§Y[SPD.GetNameDef]§!"
 POR_Spanish_Republic_SPR: "[SPR.GetFlag]§YRepublik Spanyol§!"
 POR_republican_spain_exists_tooltip_tt: "[SPR.GetFlag]§YRepublik Spanyol§! ada."
 POR_the_iberian_socialist_union_tt: "([SPR.GetFlag]§YRepublik Spanyol§!) Mendapat acara §Y'Persatuan Sosialis Iberia'§!."
 POR_the_iberian_socialist_union_cores_tt: "§YPersatuan Sosialis Iberia§! mendapatkan inti di seluruh Iberia, Islas Canarias dan Islas Baleares."
 POR_the_iberian_socialist_union_annex_puppets_tt: "Setiap boneka Spanyol akan dianeksasi."
 POR_the_iberian_socialist_union_cosmetic_name_tt: "§YPortugal§! akan dikenal sebagai §YPersatuan Sosialis Iberia§!."
 POR_the_popular_front_bloc: "Blok Depan Populer"
 POR_the_popular_front_bloc_desc: "Sekarang kita telah menekankan identitas Iberia dan mengkonsolidasikan bangsa kita sebagai [Root.GetNameDef], kita harus menyebarkan Komunisme ke luar negeri dan mencari sekutu yang bersedia bergabung dengan perjuangan kita dan berjuang bersama melawan tirani dan penindasan."
 POR_the_popular_front_bloc_tt: "Mendapat acara §Y'Portugal mengundang kami ke Blok Front Populer'§!."
 POR_the_popular_front_bloc_explanatory_tt: "Negara §YKomunis§! mana pun di Eropa akan mendapatkan acara §Y'Portugal mengundang kita ke Blok Front Populer'§!."
 POR_latin_american_communism: "Komunisme Amerika Latin"
 POR_latin_american_communism_desc: "Kita harus menjangkau masyarakat Amerika Latin. Dengan menghimbau unsur-unsur Komunis yang hadir di sana dan mendukung upaya mereka dalam menyebarkan gagasan blok internasional yang bersatu, kami akan menciptakan fondasi aliansi antara kaum Sosialis Amerika dan Eropa."
 POR_our_comrades_overseas: "Rekan Kami di Luar Negeri"
 POR_our_comrades_overseas_desc: "Kami akan menyelenggarakan konferensi antara negara-negara Amerika Latin yang bersedia menjadi bagian dari blok kami. Ini saatnya menunjukkan kepada dunia persatuan antara masyarakat Amerika Latin dan Iberia."
 POR_our_comrades_overseas_tt: "Negara §YKomunis§! mana pun di Amerika Latin akan mendapatkan acara §Y'Portugal mengundang kita ke Blok Front Populer'§!."
 POR_cooperate_with_french_militants: "Bekerja sama dengan Militan Prancis"
 POR_cooperate_with_french_militants_desc: "Kawan-kawan kita di Perancis sangat membutuhkan bantuan dalam perjuangan mereka melawan negara-negara Fasis yang menyerang negara mereka. Kita harus membekali mereka dengan senjata, peralatan, dan amunisi agar mereka mempunyai peluang dalam perjuangan mereka."
 POR_anti_fascism: "Anti-Fasisme"
 POR_anti_fascism_desc: "Fasisme adalah ancaman besar bagi perjuangan kita dan hal ini perlu diatasi. Kita harus berjuang dengan segala cara untuk membebaskan dunia dari cengkeraman kejahatannya."
 POR_anti_fascism_tt: "Keuntungan §YMenggulingkan Pemerintah§! tujuan perang melawan negara-negara Fasis besar atau tetangga:"
 french_focus: "Pohon Fokus Perancis"
 free_french_focus: "Pohon Fokus Perancis Gratis"
 POR_strengthen_the_regime: "Perkuat Rezim"
 POR_strengthen_the_regime_desc: "Masih banyak pembangkang yang berkomplot melawan rezim. Kami akan memperkuat polisi rahasia, memberi mereka sarana untuk membasmi organisasi-organisasi subversif."
 POR_the_capital_of_espionage: "Ibukota Spionase"
 POR_the_capital_of_espionage_desc: "Ada banyak agen dan komplotan di Lisbon: mata-mata yang mengumpulkan informasi tentang pengiriman trans-Atlantik, pengkhianat yang bekerja sama dengan musuh mereka sebelumnya, dan agen ganda yang mengirimkan intelijen palsu kepada musuh. Kita dapat mengambil keuntungan dari situasi ini, mengumpulkan potongan-potongan informasi yang bergerak melalui wilayah kita dan meningkatkan kontra intelijen kita sendiri."
 POR_appease_monarchists: "Tenangkan kaum Monarki"
 POR_appease_monarchists_desc: "Untuk mendapatkan dukungan dari unsur-unsur monarki di negara kita, kita harus mengkooptasi mereka dalam pemerintahan dan memberikan kesan bahwa pemulihan monarki adalah sebuah kemungkinan di masa depan. Kompromi-kompromi ini dapat memberi kita stabilitas dan dukungan yang dibutuhkan oleh rezim."
 POR_national_gold_reserves: "Cadangan Emas Nasional"
 POR_national_gold_reserves_desc: "Ada keuntungan yang bisa diperoleh dalam perang ini sambil tetap netral. Kedua belah pihak bersaing untuk mendapatkan persahabatan dan barang-barang kita dan, jika kita berhasil memenuhi permintaan mereka, cadangan emas kita dapat meningkat secara signifikan."
 POR_concordat_with_the_holy_see: "Konkordat dengan Tahta Suci"
 POR_concordat_with_the_holy_see_desc: "Kami akan merundingkan perjanjian dengan Vatikan, mendorong peran sosial Gereja dan mencegahnya mencampuri urusan politik Portugal.\n\n\"Deus, Pátria e Família\" - António de Oliveira Salazar"
 POR_honor_anglo_portuguese_alliance: "Hormatilah Aliansi Inggris-Portugis"
 POR_honor_anglo_portuguese_alliance_desc: "Aliansi Inggris-Portugis, yang berasal dari abad keempat belas, adalah aliansi tertua di dunia. Di masa yang menentukan ini, kita akan menghormati perjanjian ini dan membantu [ENG.GetNameDef] dalam perang.\nBersama kita akan menang!"
 POR_proudly_alone: "Bangga Sendirian"
 POR_proudly_alone_desc: "Bergabung dalam perang berpotensi mengakibatkan invasi ke negara kita dan hilangnya wilayah luar negeri kita. Selain itu, memasuki konflik akan mengganggu stabilitas Semenanjung Iberia dan menempatkan Portugal pada risiko diduduki oleh Spanyol juga. Kita harus tetap netral dan mengupayakan keamanan tanah kita, karena ada ancaman lain yang mengintai..."
 POR_the_eastern_menace: "Ancaman Timur"
 POR_the_eastern_menace_desc: "Keberhasilan [JAP.GetNameDef] di Tiongkok dan Asia Tenggara terutama disebabkan oleh buruknya kondisi pasukan musuh yang mereka hadapi. Kita harus mencegah hal serupa terjadi di wilayah timur kita. Kami akan memperkuat koloni kami dan melakukan serangan pertama sebelum [JAP.GetAdjective] melakukannya."
 POR_ditadura_militar: "Militar Ditadura"
 POR_ditadura_militar_desc: "Kami akhirnya mendapatkan dukungan yang diperlukan untuk menyingkirkan Salazar dari kekuasaan dan memulihkan Kediktatoran Militer. Kami akan meninggalkan Negara Baru dan mengambil langkah-langkah yang dibutuhkan Portugal untuk mencapai kesejahteraan di masa-masa sulit ini."
 POR_field_maneuvers: "Manuver Lapangan"
 POR_field_maneuvers_desc: "Corpo do Estado Maior telah mengembangkan manuver baru yang akan membantu mengevaluasi kembali dan memperbarui doktrin tertua kita; langkah yang diperlukan untuk menciptakan tentara modern."
 POR_tropas_paraquedistas: "Tropas Paraquedista"
 POR_tropas_paraquedistas_desc: "Kami akan membentuk pasukan penyerang infanteri elit, yang mampu diluncurkan di belakang pasukan musuh, memberikan keuntungan taktis yang sangat berharga."
 POR_regimento_de_comandos: "Resimen Komando"
 POR_regimento_de_comandos_desc: "Kami membutuhkan pasukan elit, terlatih untuk berbagai situasi pertempuran dan mampu bekerja dalam kondisi paling keras.\n\n\"Audaces Fortuna Juvat\""
 FRA_laissez_faire_tt: "Perekonomian kita akan menjadi lebih efisien setelah jangka waktu sekitar dua tahun."
 FRA_carry_the_revolution_west_tt: "Memberikan tujuan perang §YTopple Government§! melawan §YSpanyol§! atau faksi nonkomunis mana pun yang masih hidup dalam Perang Saudara Spanyol."
 nationalist_victory: "Spanyol yang nasionalis telah memenangkan Perang Saudara Spanyol"
 republican_victory: "Republik Spanyol telah memenangkan Perang Saudara Spanyol"
