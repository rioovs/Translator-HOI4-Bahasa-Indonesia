 NSB_soviet_five_year_plan.01.t: "Rencana Lima Tahun Ketiga Terganggu"
 NSB_soviet_five_year_plan.01.desc: "Dengan serangan yang terjadi saat ini terhadap tanah air, jelas bahwa rencana pertumbuhan ekonomi kita sebelumnya tidak lagi dapat dilaksanakan. Kita mungkin akan kembali kepada mereka setelah perdamaian pulih, namun untuk saat ini kita harus fokus pada produksi militer."
 NSB_soviet_five_year_plan.01.a: "Terkutuklah mereka!"
 NSB_soviet_five_year_plan_tt: "Setiap fokus industri yang terkait dengan §Y$SOV_third_five_year_plan$§! sudah tidak tersedia lagi."
 NSB_soviet_great_patriotic_war.01.t: "Nikolay Ivanovich Kuznetsov meminta Penugasan"
 NSB_soviet_great_patriotic_war.01.desc: "Setelah invasi [?ROOT.SOV_invader_of_ukraine.GetAdjective] ke Ukraina, Nikolay Kuznetsov secara resmi meminta untuk bergabung dengan NKVD untuk mempertahankan tanah airnya. Dengan bakat uniknya, ia akan menjadi aset besar untuk mendukung operasi partisan di wilayah tersebut."
 NSB_soviet_great_patriotic_war.01.a: "Selamat datang, Kamerad!"
 NSB_soviet_propaganda_capmaign_events.1.t: "Pembangun Muda Komunisme"
 NSB_soviet_propaganda_capmaign_events.1.desc: "Teman-teman dan pemandu kami di [SOV.GetNameDef] telah memulai program untuk memastikan bahwa generasi yang sedang tumbuh memahami sepenuhnya apa yang diharapkan dari mereka. Seorang komunis yang baik harus kuat secara fisik, mampu melakukan pekerjaan yang diperlukan untuk membangun dunia yang lebih baik, dan berpendidikan tinggi untuk memahami sepenuhnya apa yang harus dilakukan.\n\nAnak-anak muda yang antusias di negara kita telah memahami hal ini, dan sekarang cobalah untuk meniru pendekatan ini sebanyak mungkin."
 NSB_soviet_propaganda_capmaign_events.1.a: "Mereka akan membangun masa depan mereka sendiri yang lebih cerah."
 NSB_soviet_propaganda_capmaign_events.2.t: "Janji Perdamaian Rusak"
 NSB_soviet_propaganda_capmaign_events.2.desc: "Keputusan kami untuk mengambil langkah proaktif dalam memastikan keselamatan kami yang berkelanjutan telah menempatkan kami pada posisi yang canggung sehubungan dengan beberapa pernyataan yang kami buat baru-baru ini. Meskipun kebanyakan orang tidak mempertanyakan situasi ini secara terbuka, polisi rahasia kami melaporkan bahwa banyak yang secara pribadi bertanya mengapa kami menjanjikan perdamaian padahal kami jelas-jelas sedang mempersiapkan perang.\n\nTidak ada yang berani menyebut apa yang kami lakukan sebagai kebohongan, namun jelas bahwa kami telah kehilangan banyak kepercayaan dari masyarakat umum."
 NSB_soviet_propaganda_capmaign_events.2.a: "Waktunya sangat disayangkan."
 NSB_soviet_propaganda_capmaign_events.3.desc: "Pecahnya perang telah menempatkan posisi kita di mata masyarakat pada posisi yang agak sulit. Meskipun sebagian besar setuju bahwa kami adalah pihak yang dirugikan, dan kemarahan masyarakat memang seharusnya terfokus pada para penjajah, banyak yang secara pribadi bertanya-tanya mengapa [THIS.GetLeader] tidak mengantisipasi serangan ini. Polisi rahasia kami melaporkan bahwa dalam beberapa kasus, orang-orang telah melangkah lebih jauh dan menyebut [THIS.GetLeader] \"sangat naif atau tidak kompeten secara kriminal\"."
 NSB_soviet_propaganda_capmaign_events.3.a: "Tapi kami tidak pernah menginginkan perang ini!"
 NSB_soviet_foreign_politics_events.1.t: "[FROM.GetAdjective] Tekanan pada Pemerintah"
 NSB_soviet_foreign_politics_events.1.desc: "Menteri Luar Negeri [FROM.GetAdjective] telah tiba di ibu kota untuk konsultasi mendesak dengan [THIS.GetLeader]. Delegasi [FROM.GetAdjective] datang dengan membawa daftar panjang permasalahan yang belum terselesaikan, mulai dari keamanan perbatasan hingga beberapa pemberitaan yang tidak menyenangkan tentang [FROM.GetLeader] di media lokal. Dalam siaran persnya, Menteri Luar Negeri menekankan pentingnya kerja sama dan kolaborasi damai, namun mencatat bahwa [FROM.GetLeader] \"akan sulit menerima [THIS.GetNameDef] yang bermusuhan atau tidak bersahabat\"."
 NSB_soviet_foreign_politics_events.1.a: "Kami bersedia bergabung dengan faksi mereka, jika kami bisa menjaga konstitusi kami."
 NSB_soviet_foreign_politics_events.1.b: "Kita harus menyelaraskan pemerintahan kita dengan pemerintahan mereka."
 NSB_soviet_foreign_politics_events.1.c: "Kami tidak akan menyerah satu inci pun."
 NSB_soviet_foreign_politics_events.2.t: "[FROM.GetAdjective]-Reli yang Disponsori di Ibu Kota"
 NSB_soviet_foreign_politics_events.2.desc: "Sejumlah kelompok politik telah mengumumkan demonstrasi di ibu kota minggu ini. Tampaknya mereka tidak mempunyai keluhan khusus yang ingin mereka sampaikan, di luar pengertian umum bahwa kita harus mencoba memperbaiki hubungan kita dengan [FROM.GetNameDef], dan menyingkirkan politisi mana pun yang kritis terhadap pemerintahan [FROM.GetAdjective] dari posisi kekuasaan mana pun.\n\nMeskipun mungkin saja demonstrasi-demonstrasi ini hanyalah manifestasi spontan dari opini populer, setidaknya patut dicatat bahwa sejumlah penyelenggara utama melakukan perjalanan ke [FROM.GetCapitalVictoryPointName] baru-baru ini, dan sepertinya mulai melakukan agitasi setelah mereka kembali."
 NSB_soviet_foreign_politics_events.2.a: "Ya, itu tentu saja merupakan hak mereka."
 NSB_soviet_foreign_politics_events.2.b: "Kirim polisi untuk memukul beberapa kepala!"
 NSB_soviet_foreign_politics_events.10.t: "[FROM.GetNameDefCap] Ingin Berinvestasi dalam Perekonomian kita"
 NSB_soviet_foreign_politics_events.10.desc: "Pemerintah [FROM.GetAdjective] telah memulai program investasi ekstensif dalam perekonomian. Sebagai bagian dari program tersebut, mereka telah menyisihkan dana untuk pembangunan jaringan jembatan, terowongan, dan jalan di ibu kota dan di tempat lain. Peningkatan kapasitas yang terkait dengan industri konstruksi kita pasti akan terus memberikan keuntungan di masa depan.\n\nNamun, beberapa orang di pemerintahan khawatir bahwa mengundang insinyur dan pendanaan [FROM.GetAdjective] hanya akan membuat kita semakin bergantung pada keahlian mereka di masa depan."
 NSB_soviet_foreign_politics_events.10.a: "Terima kasih, kawan!"
 NSB_soviet_foreign_politics_events.10.b: "Ini hanya akan meningkatkan ketergantungan kita pada [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.11.t: "[FROM.GetNameDefCap] Menuntut Tindakan Perang"
 NSB_soviet_foreign_politics_events.11.desc: "Dengan kemungkinan terjadinya perang yang semakin besar, pemerintah [FROM.GetAdjective] mulai memberikan tekanan kepada kami untuk meningkatkan kemampuan tempur kami. Mereka ingin kami meningkatkan cadangan tenaga kerja secara drastis, sekaligus memangkas waktu pelatihan, agar lebih banyak divisi tersedia untuk tugas garis depan dan membebaskan [FROM.GetAdjective] divisi."
 NSB_soviet_foreign_politics_events.11.a: "Mereka tentu ada benarnya."
 NSB_soviet_foreign_politics_events.11.b: "Kami akan memutuskan cara terbaik untuk membela diri."
 NSB_soviet_foreign_politics_events.12.t: "[FROM.GetNameDefCap] Ingin Memperluas Benteng Perbatasan"
 NSB_soviet_foreign_politics_events.12.desc: "Memperhatikan meningkatnya ancaman dari [JAP.GetNameDef], pemerintah [FROM.GetAdjective] sangat menyarankan agar kita segera mulai membentengi perbatasan kita dengan [JAP.GetNameDef]. Mereka telah menjanjikan dukungan material dan logistik untuk hal ini, guna mengurangi komitmen tenaga kerja yang perlu mereka buat untuk pertahanan kita."
 NSB_soviet_foreign_politics_events.12.a: "Kami menyambut baik inisiatif ini."
 NSB_soviet_foreign_politics_events.12.b: "Ini akan menjadi sebuah eskalasi yang tidak perlu."
 NSB_soviet_foreign_politics_events.13.t: "[FROM.GetNameDef] Menolak Pedoman [ROOT.GetAdjective]"
 NSB_soviet_foreign_politics_events.13.desc: "Tanpa diduga, pemerintah [FROM.GetAdjective] telah menolak pedoman kami dan menolak untuk mengikuti rencana yang disampaikan oleh pejabat kami. Sepertinya [FROM.GetLeader] memiliki niat bermusuhan terhadap [ROOT.GetNameDef]..."
 NSB_soviet_foreign_politics_events.13.a: "Serius, apa yang salah dengan [FROM.GetLeader]?"
 NSB_soviet_foreign_politics_events.20.t: "[FROM.GetNameDefCap] Mengirim Penasihat Militer"
 NSB_soviet_foreign_politics_events.20.desc: "Untuk mendukung perjuangan putus asa kami dalam melestarikan demokrasi, [FROM.GetLeader] telah mengirimkan sekelompok [FROM.GetAdjective] penasihat militer. Dengan membawa segudang pengalaman dari berbagai konflik, tidak diragukan lagi mereka akan sangat berharga dalam membangun kembali militer kita. Dengan peralatan dan taktik yang mereka miliki, mereka juga akan mampu menghadapi apa yang disebut sebagai divisi sukarelawan dari berbagai kekuatan fasis di lapangan."
 NSB_soviet_foreign_politics_events.20.a: "Kami berdiri bahu membahu!"
 NSB_soviet_foreign_politics_events.30.t: "[FROM.GetNameDefCap] Menuntut Kembalinya Alaska"
 NSB_soviet_foreign_politics_events.30.desc: "Beberapa minggu yang lalu, propaganda [FROM.GetAdjective] dan media yang berpihak pada [FROM.GetAdjective] memulai dorongan yang jelas dan terpadu untuk mengangkat kembali isu Alaska. Pada prinsipnya, mereka menuduh bahwa pembelian Alaska pada tahun 1867 merupakan penipuan atau dilakukan di bawah tekanan. Mereka selanjutnya menyatakan bahwa penduduk Alaska, baik penduduk asli maupun pemukim, jelas akan lebih baik jika menjadi warga negara [FROM.GetNameDef].\n\nHari ini, duta besar [FROM.GetAdjective] menyampaikan catatan resmi, yang menyatakan bahwa apa yang disebut \"Pemerintah Republik Otonomi Alaska di Pengasingan\" telah secara resmi meminta untuk menjadi bagian dari [FROM.GetNameDef], dan bahwa [FROM.GetLeader] telah menyetujui permintaan mereka. Yang tersisa, menurut dia, hanyalah merundingkan detail peralihan kekuasaan."
 NSB_soviet_foreign_politics_events.30.a: "Mereka dapat memiliki gurun beku itu."
 NSB_soviet_foreign_politics_events.30.b: "Itu lelucon yang sangat bagus."
 NSB_soviet_foreign_politics_events.31.t: "Alaska Kembali"
 NSB_soviet_foreign_politics_events.31.desc: "Dalam upacara resmi di Fort Sitka, [FROM.GetNameDef] menyerahkan kedaulatan atas Alaska kembali kepada kami. Meskipun sebagian besar penduduk Alaska tampaknya memiliki perasaan campur aduk tentang perpindahan ini, penduduk di negara mereka sendiri justru merayakannya."
 NSB_soviet_foreign_politics_events.31.a: "Kesalahan lain yang diberantas oleh Tsar."
 NSB_soviet_foreign_politics_events.32.t: "[FROM.GetNameDefCap] menolak"
 NSB_soviet_foreign_politics_events.32.desc: "Sekretaris Negara [FROM.GetAdjective] tidak mau repot-repot menanggapi tuntutan kami secara langsung. Sebaliknya, sebuah surat telah dikirimkan ke kedutaan kami, yang ditandatangani oleh Wakil Menteri Pembangunan Kebudayaan, yang menyatakan bahwa meskipun mereka menghormati ambisi kami dalam menulis fiksi sejarah yang lengkap, mereka akan menghargai jika kami tidak menggunakan jalur resmi untuk melakukannya."
 NSB_soviet_foreign_politics_events.32.a: "Oh, mereka mengira kami hanya menggertak?"
 NSB_soviet_foreign_politics_events.32.b: "Hal terakhir yang kita butuhkan adalah lebih banyak kotoran beku."
 NSB_soviet_foreign_politics_events.150.t: "[FROM.GetNameDefCap] dikirimkan"
 NSB_soviet_foreign_politics_events.150.desc: "Setelah sidang kabinet yang berlangsung hingga dini hari, [FROM.GetLeader] telah secara resmi menerima tuntutan kami. Duta Besar kami untuk [FROM.GetNameDef] akan memastikan bahwa pemerintah [FROM.GetAdjective] berkoordinasi erat dengan kami mengenai segala masalah kebijakan luar negeri atau dalam negeri."
 NSB_soviet_foreign_politics_events.150.a: "Sangat bijaksana."
 NSB_soviet_foreign_politics_events.151.t: "[FROM.GetNameDefCap] bergabung dengan Fraksi kami"
 NSB_soviet_foreign_politics_events.151.desc: "Setelah negosiasi di dalam pemerintahan [FROM.GetAdjective] menemui jalan buntu, [FROM.GetLeader] telah menyarankan solusi kompromi: meskipun mereka bersedia menerima pasukan [THIS.GetAdjective] di wilayah [FROM.GetAdjective], mereka tidak akan menerima campur tangan apa pun dalam sistem pemerintahan mereka.\n\nSelanjutnya, militer [FROM.GetAdjective] akan tetap aktif, dikelola oleh perwira dan pangkat [FROM.GetAdjective], dan hanya bertanggung jawab kepada pemerintah [FROM.GetAdjective]. Namun, [FROM.GetLeader] bersedia mendiskusikan rencana pertahanan bersama."
 NSB_soviet_foreign_politics_events.151.a: "Setidaknya mereka akan bertarung di sisi kanan."
 NSB_soviet_foreign_politics_events.152.t: "[FROM.GetNameDefCap] Menolak"
 NSB_soviet_foreign_politics_events.152.desc: "Upaya kami untuk menyelesaikan masalah yang belum terselesaikan dengan [FROM.GetNameDef] secara diplomatis tampaknya telah gagal. Ketika duta besar kami meminta [FROM.GetLeader] untuk melakukan putaran perundingan lagi, dia dengan kasar diberitahu bahwa [FROM.GetAdjective] telah menyatakan posisi mereka dengan jelas, dan tidak ada hal yang perlu dibicarakan lebih lanjut."
 NSB_soviet_foreign_politics_events.152.a: "Mereka telah memilih nasib yang lebih buruk."
 NSB_soviet_foreign_politics_events.152.b: "Kami tidak akan mendorong mereka lebih jauh... untuk saat ini."
 NSB_soviet_foreign_politics_events.152.c: "Persiapkan invasi [FROM.GetNameDef]!"
 NSB_soviet_foreign_politics_events.152.d: "Kita harus mempersiapkan invasi bersama dengan [ENG.GetAdjective]"
 NSB_soviet_foreign_politics_events.153.t: "Anglo-[SOV.GetAdjective] Invasi Iran"
 NSB_soviet_foreign_politics_events.153.desc: "Kami telah menerima nota diplomatik dari [FROM.GetNameDef], yang mengusulkan operasi militer gabungan melawan [PER.GetNameDef]. Komando [FROM.GetAdjective] menegaskan bahwa operasi ini akan memungkinkan kami mengamankan ladang minyak Iran dan jalur pasokan kami ke [FROM.GetNameDef], sekaligus mencegah potensi serangan musuh dari [TUR.GetNameDef] melalui [PER.GetName] menuju ladang minyak Baku dan [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.153.a: "Kita harus mengamankan Koridor Persia!"
 NSB_soviet_foreign_politics_events.153.b: "Kami akan menghormati kemerdekaan [PER.GetAdjective]."
 NSB_soviet_foreign_politics_events.153_soviets_alone_tt: "[FROM.GetAdjective] harus berurusan dengan [PER.GetNameDef] sendiri."
 NSB_soviet_foreign_politics_events.154.t: "Anglo-[SOV.GetAdjective] Invasi Iran"
 NSB_soviet_foreign_politics_events.154.desc: "Duta Besar [FROM.GetAdjective] telah menyampaikan catatan yang menyatakan [FROM.GetNameDef] setuju untuk mengatur dan melaksanakan operasi militer gabungan melawan [PER.GetNameDef]. Baik Komando [ROOT.GetAdjective] dan [FROM.GetAdjective] yakin bahwa ini akan menjadi operasi yang cepat dan efektif melawan musuh yang kalah jumlah dan kalah teknologi yang akan memungkinkan kita mengamankan ladang minyak Iran dan jalur pasokan [FROM.GetAdjective] ke [ROOT.GetNameDef], sekaligus mencegah potensi serangan musuh dari [TUR.GetNameDef] melalui [PER.GetName] menuju ladang minyak Baku dan [RAJ.GetNameDef]."
 NSB_soviet_foreign_politics_events.154.a: "Commence preparations!"
 NSB_soviet_foreign_politics_events.155.t: "Pemerintah [FROM.GetAdjective] Menolak."
 NSB_soviet_foreign_politics_events.155.desc: "Setelah beberapa pertemuan yang menegangkan antara diplomat [ROOT.GetAdjective] dan [FROM.GetAdjective], [FROM.GetNameDef] memutuskan untuk tidak terlibat dalam rencana kami untuk [PER.GetNameDef]. [FROM.GetLeader] sendiri bahkan berani menyatakan bahwa usulan ini tidak lebih dari upaya untuk membenarkan ambisi teritorial kita.\nTampaknya kita harus menangani [PER.GetNameDef] sendiri."
 NSB_soviet_foreign_politics_events.155.a: "Always so unreliable..."
 NSB_soviet_foreign_politics_events.200.t: "[FROM.GetNameDefCap] makes demands"
 NSB_soviet_foreign_politics_events.158.t: "Pemerintahan [FROM.GetAdjective] Baru"
 NSB_soviet_foreign_politics_events.158.desc: "Setelah negosiasi yang gagal dengan duta besar kami, dan di bawah tekanan besar dari media dan masyarakat, mantan pemimpin pemerintahan [FROM.GetAdjective] memutuskan untuk mengundurkan diri dari jabatannya dan mengadakan pemilihan umum baru. Seperti yang diharapkan, pemilu ini dimenangkan oleh partai yang lebih dekat dengan kepentingan kita, [FROM.GetRulingParty], dengan [FROM.GetLeader] sebagai pemimpinnya."
 NSB_soviet_foreign_politics_events.158.a: "akhirnya kita dapat mengharapkan lebih banyak kerja sama dari [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.200.desc: "Duta Besar [FROM.GetAdjective] telah menyampaikan pesan yang menuntut konsultasi segera dengan [THIS.GetLeader]. Menurut catatan tersebut, pemerintah [FROM.GetAdjective] tidak lagi bersedia menoleransi \"situasi keamanan yang tidak menentu\" di negara kita. Tidak jelas apa yang dimaksud dengan hal ini, namun jelas bahwa kita secara efektif diberikan tiga pilihan: Menyetujui penempatan pasukan [FROM.GetAdjective] di wilayah kita; mengganti pemerintahan kita dengan pemerintahan yang lebih sesuai dengan kebutuhan [FROM.GetNameDef], atau mungkin serangan militer oleh [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.200.a: "Kami tidak punya pilihan."
 NSB_soviet_foreign_politics_events.200.b: "Mungkin kita bisa berkompromi?"
 NSB_soviet_foreign_politics_events.200.c: "Kami akan berjuang untuk kebebasan kami!"
 NSB_soviet_foreign_politics_events.210.t: "Tekanan dari [FROM.GetNameDef]"
 NSB_soviet_foreign_politics_events.210.desc: "Tampaknya pemerintah [FROM.GetAdjective] semakin gelisah dengan situasi diplomatik kita. Selama seminggu terakhir, duta besar [FROM.GetAdjective] telah bertemu dengan [THIS.GetLeader] tidak kurang dari enam kali, dan praktis telah menyampaikan ultimatum pada putaran terakhir perundingan.\n\nEntah kita bergabung dengan [FROM.GetNameDef] dalam pakta pertahanan dan menerima \"konsultasi pada tingkat tertentu dalam urusan dalam negeri\", atau [FROM.GetNameDef] kemungkinan besar akan melakukan intervensi militer di negara kita."
 NSB_soviet_foreign_politics_events.210.a: "Pertarungan akan sia-sia."
 NSB_soviet_foreign_politics_events.210.c: "Biarkan mereka datang!"
 NSB_soviet_foreign_politics_events.211.t: "Usulan Khakimov"
 NSB_soviet_foreign_politics_events.211.desc: "Konsul Jenderal Soviet Karim Khakimov menggandakan upaya untuk mengembangkan hubungan Soviet-Arab yang lebih hangat. Seorang Muslim Soviet keturunan Tatar, Khakimov mendapatkan rasa hormat dan persahabatan dari Ibn Saud ketika ia mengendarai mobil pribadinya melewati tembakan dari Jeddah ke kediaman sultan di padang pasir untuk menyampaikan surat resmi yang mengakui dia sebagai Raja Hijaz dan Sultan Najd pada bulan Februari 1926. Sejak saat itu, pria ini menjadi promotor utama hubungan Soviet-Arab. Lawrence sejati dari Arab."
 NSB_soviet_foreign_politics_events.211.a: "Usulan Khakimov mungkin ramah, tapi kita harus waspada terhadap ambisi Soviet."
 NSB_soviet_foreign_politics_events.250.t: "[FROM.GetNameDefCap] mengirimkan Bantuan Militer"
 NSB_soviet_foreign_politics_events.250.desc: "Konvoi [FROM.GetAdjective] telah mencapai garis kami, membawa banyak senapan dan perbekalan lainnya. Tidak ada yang tahu kapan konvoi berikutnya dapat berangkat, jadi kita harus menjadikan ini sebagai yang terakhir."
 NSB_soviet_foreign_politics_events.251.t: "[FROM.GetNameDefCap] bersiap berperang dengan [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.251.desc: "Tampaknya [FROM.GetLeader] telah sampai pada kesimpulan bahwa perang dengan [JAP.GetNameDef] tidak dapat dihindari dan kemungkinan besar akan pecah dalam waktu dekat. Oleh karena itu, perwakilan [FROM.GetAdjective] di ibu kota kami telah mendesak kami untuk menyiagakan pasukan perbatasan dan memobilisasi tentara kami untuk persiapan menghadapi serangan [JAP.GetAdjective] yang akan segera terjadi."
 NSB_soviet_foreign_politics_events.251.a: "Kami akan siap."
 NSB_soviet_foreign_politics_events.252.t: "Perang dengan [JAP.GetNameDef]"
 NSB_soviet_foreign_politics_events.252.desc: "Perang yang telah lama dinanti dengan [JAP.GetNameDef] telah tiba. Sebelumnya hari ini, pasukan [FROM.GetAdjective] mulai menyerang posisi [JAP.GetAdjective] di seluruh Tiongkok, dan sekarang telah tiba waktunya bagi kita untuk bergabung dengan mereka. Berdampingan dengan sekutu [FROM.GetAdjective] kami, kami akan menyapu pasukan [JAP.GetAdjective] dari tanah kami!"
 NSB_soviet_foreign_politics_events.252.a: "Hari perhitungan telah tiba!"
 NSB_soviet_foreign_politics_events.260.t: "[FROM.GetNameDefCap] menawarkan Kedamaian"
 NSB_soviet_foreign_politics_events.260.desc: "Setelah menguasai Kuril dan Sakhalin Selatan, komandan [FROM.GetAdjective] telah menawarkan gencatan senjata di garis pertahanan saat ini, sebagai persiapan untuk perjanjian damai. Tidak disebutkan bahwa perjanjian damai ini kemungkinan besar akan mengakui setidaknya pulau-pulau di utara sebagai perbatasan baru, sehingga secara efektif menyerahkan wilayah Kuril dan Sakhalin Selatan ke [FROM.GetNameDef]."
 NSB_soviet_foreign_politics_events.260.a: "Itu menyakitkan, tapi bisa ditanggung."
 NSB_soviet_foreign_politics_events.260.b: "Perang mungkin masih menguntungkan kita."
 NSB_soviet_foreign_politics_events.261.desc: "Setelah menguasai Kuril dan Sakhalin Selatan, serta melakukan pendaratan di Hokkaido, komandan [FROM.GetAdjective] telah menawarkan gencatan senjata di garis saat ini, sebagai persiapan untuk perjanjian damai. Tampaknya perjanjian damai ini akan mengakui kepemilikan [FROM.GetAdjective] atas wilayah Kuril dan Sakhalin, dan menempatkan Hokkaido di bawah administrasi [FROM.GetAdjective]."
 NSB_soviet_foreign_politics_events.262.b: "Saran yang tidak masuk akal!"
 NSB_soviet_foreign_politics_events.263.t: "[FROM.GetNameDefCap] menawarkan Aliansi"
 NSB_soviet_foreign_politics_events.263.desc: "Utusan dari [FROM.GetLeader] telah mendekati kami dengan tawaran yang berani - pemerintah [FROM.GetAdjective] bersedia menandatangani perjanjian aliansi dengan kami! Meskipun rinciannya masih harus diselesaikan, jelas bahwa aliansi ini terutama bertujuan untuk mengurangi atau menghilangkan pengaruh [USA.GetNameDef] di Samudera Pasifik. Dalam satu gerakan, hal ini akan menghilangkan ancaman terbesar terhadap posisi kita di Tiongkok, sekaligus membebaskan banyak pasukan untuk dipekerjakan di tempat lain.\n\nMeskipun sebagian besar perwira di Angkatan Laut sangat antusias dengan prospek ini, banyak perwira Angkatan Darat yang sangat curiga terhadap usulan tersebut, khawatir bahwa [FROM.GetNameDef] akan menusuk kita dari belakang segera setelah kita membalikkan badan."
 NSB_soviet_foreign_politics_events.263.a: "Hal ini secara dramatis akan mengubah keseimbangan kekuasaan."
 NSB_soviet_foreign_politics_events.263.b: "Kita tidak bisa mempercayai mereka untuk menepati janjinya."
 NSB_soviet_foreign_politics_events.264.t: "[FROM.GetNameDef] Mematuhi Ketentuan Perdamaian kami"
 NSB_soviet_foreign_politics_events.264.desc: "Setelah [GetAppropriateSovietProgressInJapan], [FROM.GetLeader] telah menerima tawaran perdamaian kami, memenuhi tuntutan teritorial kami dengan imbalan penghentian segera permusuhan antar negara kami.\nMereka sekarang akan memindahkan pemerintahan regional [537.GetName], [555.GetName] dan [536.GetName] ke [ROOT.GetNameDef]."
 NSB_soviet_foreign_politics_events.264.desc_default: "[ROOT.GetAdjective] pendudukan [FROM.GetAdjective] pulau-pulau Utara oleh [GetAppropriateRedArmyNsName],"
 NSB_soviet_foreign_politics_events.264.desc_hokkaido: "kemajuan [GetAppropriateRedArmyNsName] di [FROM.GetAdjective] wilayah Utara, termasuk [536.GetName],"
 NSB_soviet_foreign_politics_events.264.a: "Keputusan bijak oleh [FROM.GetLeader]."
 NSB_soviet_foreign_politics_events.265.t: "[FROM.GetNameDef] Menolak Ketentuan Perdamaian kami"
 NSB_soviet_foreign_politics_events.265.desc: "[From.GetNameDef] telah menolak tawaran perdamaian kami, bersumpah untuk terus berperang sampai [ROOT.GetAdjective] pendudukan wilayah [FROM.GetAdjective] dihilangkan dan perang kembali terjadi di wilayah kami."
 NSB_soviet_foreign_politics_events.265.a: "Tidak bisakah [FROM.GetLeader] melihat bagaimana hal ini akan berakhir bagi negaranya?"
 NSB_soviet_foreign_politics_events.266.t: "[ROOT.GetAdjective]-[FROM.GetAdjective] Pakta Persahabatan"
 NSB_soviet_foreign_politics_events.266.desc: "Pemerintah [FROM.GetAdjective] telah puas dengan sikap rekonsiliasi kami, dan telah menerima usulan kami.\nBaru beberapa jam yang lalu, diplomat [FROM.GetAdjective] dan [ROOT.GetAdjective] menandatangani Pakta Non-Agresi yang, menurut kata-kata duta besar [FROM.GetAdjective], dapat membuka era baru kerja sama di Timur."
 NSB_soviet_foreign_politics_events.266.a: "Kompromi kita akan membuahkan hasil di masa depan."
 NSB_soviet_foreign_politics_events.267.t: "[FROM.GetNameDef] Menolak Proposal Kami untuk Pakta Pertahanan"
 NSB_soviet_foreign_politics_events.267.desc: "Pemerintah [FROM.GetAdjective] tidak terkesan dengan tawaran rekonsiliasi kami dan dengan tegas menolak usulan kami.\nNampaknya kita harus tetap waspada terhadap ambisi [FROM.GetLeader] di Timur Jauh..."
 NSB_soviet_foreign_politics_events.267.a: "Kami harus menyesuaikan kembali rencana kami..."
 NSB_soviet_foreign_politics_events.268.t: "[ROOT.GetAdjective]-[FROM.GetAdjective] Pakta Melawan [USA.GetNameDef]"
 NSB_soviet_foreign_politics_events.268.desc: "Pemerintah [FROM.GetAdjective] telah menunjukkan minat yang tulus terhadap proposal kami untuk pakta ofensif terhadap [USA.GetNameDef], dan diplomat [FROM.GetLeader] baru saja menandatangani perjanjian yang disampaikan kepada mereka. Angkatan bersenjata [FROM.GetAdjective] saat ini sedang menyesuaikan diri dengan situasi baru, dan Komando Tinggi mereka yakin bahwa, bersama-sama, kita akan mengalahkan [USA.GetNameDef] dan mengakhiri pengaruh mereka di kancah internasional untuk selamanya."
 NSB_soviet_foreign_politics_events.268.a: "Kami akan mengekang [USA.GetAdjective] imperialisme!"
 NSB_soviet_foreign_politics_events.269.t: "[FROM.GetNameDef] Menolak Proposal Kami untuk Pakta Ofensif"
 NSB_soviet_foreign_politics_events.269.desc: "Pemerintah [FROM.GetAdjective] telah menolak usulan kami. Tampaknya [FROM.GetLeader] tidak tertarik dengan perjanjian yang kami usulkan untuk bergabung dengan pasukan [ROOT.GetAdjective] dan [FROM.GetAdjective] dalam perjanjian ofensif melawan [USA.GetNameDef]."
 NSB_soviet_foreign_politics_events.269.a: "Itu sangat disayangkan..."
 SOV_decision_will_be_locked_tt: "Keputusan tidak dapat diambil lagi. Kami hanya dapat mengirimkan ultimatum kepada suatu negara satu kali."
 SOV_decision_will_remain_available_tt: "Keputusan tetap ada."
 NSB_soviet_foreign_politics_events.270.t: "Perluasan Kereta Api Trans-Kaspia [FROM.GetAdjective]"
 NSB_soviet_foreign_politics_events.270.desc: "Jalur kereta api Trans-Kaspia Rusia melintasi Asia Tengah dengan ujung timur di Tashkent. Pemerintah [FROM.GetAdjective] sekarang bermaksud untuk memperluasnya dan telah mengirimkan proposal untuk menghubungkan jalur tersebut ke ibu kota kita guna membangun hubungan perdagangan yang lebih baik. Tampaknya para pejabat [FROM.GetAdjective] tertarik untuk melakukan ekspansi ke pasar Sinkiang dan mengklaim bahwa hal ini dapat menjadi langkah pertama menuju jalur yang saling menguntungkan menuju pembangunan dan pertukaran."
 NSB_soviet_foreign_politics_events.270.a: "Kami mendukung inisiatif ini!"
 NSB_soviet_foreign_politics_events.270.b: "[SOV.GetAdjective] pedagang tidak boleh ikut campur di negara kami."
 NSB_soviet_foreign_politics_events.271.t: "[FROM.GetNameDefCap] Menyetujui Usulan kami"
 NSB_soviet_foreign_politics_events.271.desc: "Konsul [SIK.GetAdjective] yang ditempatkan di Semipalatinsk telah menghubungi diplomat kami untuk menyampaikan bahwa pemerintah [SIK.GetAdjective] bersedia menerima inisiatif [ROOT.GetAdjective] untuk memperluas jalur Trans-Kaspia, mengkomunikasikan Urumqi dengannya. Beliau juga menyatakan bahwa pemerintah provinsi [SIK.GetNameDef] terbuka untuk mengembangkan hubungan ekonomi dan diplomatik baru dengan negara kita."
 NSB_soviet_foreign_politics_events.271.a: "Pintu terbuka menuju pasar ekonomi baru!"
 NSB_soviet_foreign_politics_events.272.t: "[FROM.GetNameDefCap] Menolak Proposal kami"
 NSB_soviet_foreign_politics_events.272.desc: "Konsul [SIK.GetAdjective] yang ditempatkan di Semipalatinsk telah menghubungi diplomat kami untuk menyampaikan bahwa pemerintah [SIK.GetAdjective] telah memutuskan untuk menolak inisiatif [ROOT.GetAdjective] untuk memperluas jalur Trans-Kaspia dan menghubungkan ibu kota [SIK.GetAdjective], Urumqi, dengannya."
 NSB_soviet_foreign_politics_events.272.a: "Ini adalah kejadian yang tidak terduga dan sangat disayangkan."
 NSB_soviet_foreign_politics_events.272.b: "Mereka sedang bermain api!"
 NSB_soviet_foreign_politics_events.273.t: "[FROM.GetAdjective] Prospeksi Mineral di [619.GetName]"
 NSB_soviet_foreign_politics_events.273.desc: "Perwakilan [FROM.GetAdjective] di Dihua telah memberikan kami proposal baru untuk mencari sumber daya di [619.GetName] dan meningkatkan infrastruktur wilayah untuk memfasilitasi eksploitasi. Sebagai imbalannya, mereka meminta agar [FROM.GetAdjective] entitas perdagangan dibayar kembali dalam bentuk ekspor komoditas seperti emas dan mineral langka dari Altay."
 NSB_soviet_foreign_politics_events.273.a: "Ini adalah kesepakatan yang menguntungkan kedua belah pihak."
 NSB_soviet_foreign_politics_events.273.b: "Mereka hanya ingin meningkatkan pengaruh [FROM.GetAdjective] di negara kita."
 NSB_soviet_foreign_politics_events.274.t: "[FROM.GetNameDefCap] Menyetujui Usulan kami"
 NSB_soviet_foreign_politics_events.274.desc: "Perwakilan [ROOT.GetAdjective] di Dihua telah diberitahu oleh diplomat [SIK.GetAdjective] bahwa mereka telah menerima proposal kami untuk mencari sumber daya di [619.GetName] dan meningkatkan infrastruktur wilayah untuk memfasilitasi eksploitasi. Sebagai imbalannya, entitas perdagangan [SIK.GetAdjective] akan dibayar kembali dalam bentuk ekspor komoditas seperti emas dan mineral langka dari Altay."
 NSB_soviet_foreign_politics_events.274.a: "Ini membuka peluang perdagangan baru!"
 NSB_soviet_foreign_politics_events.275.t: "[FROM.GetNameDefCap] Menolak Proposal kami"
 NSB_soviet_foreign_politics_events.275.desc: "Perwakilan [ROOT.GetAdjective] di Dihua telah diberitahu oleh diplomat [SIK.GetAdjective] bahwa pemerintah mereka telah menolak proposal kami untuk berinvestasi di negara tersebut. Nampaknya [SIK.GetNameDef] sudah tidak tertarik lagi untuk membuka perdagangan dan mengembangkan hubungan bisnis dan diplomasi yang lebih baik dengan [ROOT.GetNameDef]."
 NSB_soviet_foreign_politics_events.275.a: "Keputusan yang tidak bijaksana..."
 NSB_soviet_foreign_politics_events.275.b: "Kami sebenarnya tidak meminta izin."
 NSB_soviet_foreign_politics_events.276.t: "[FROM.GetAdjective] Prospeksi Mineral di [618.GetName]"
 NSB_soviet_foreign_politics_events.276.desc: "Proposal [FROM.GetAdjective] baru telah disampaikan kepada diplomat kami. Tampaknya [FROM.GetNameDefCap] telah mengembangkan minat yang besar untuk menemukan sumber mineral dan minyak di bagian utara negara kita, dan mereka mengusulkan untuk melakukan prospek mineral dan perluasan fasilitas infrastruktur di wilayah tersebut, dengan imbalan hak eksploitasi sumber daya. Perwakilan [FROM.GetAdjective] menegaskan bahwa investasi industri ini secara alami akan meningkatkan eksploitasi nasional terhadap emas dan perak di wilayah tersebut."
 NSB_soviet_foreign_politics_events.276.a: "Sumber daya tersebut tidak penting bagi kami. Kami membutuhkan emas!"
 NSB_soviet_foreign_politics_events.276.b: "Sumber daya di tanah [ROOT.GetAdjective] adalah milik [ROOT.GetName]!"
 NSB_soviet_foreign_politics_events.277.t: "$NSB_soviet_foreign_politics_events.274.t$"
 NSB_soviet_foreign_politics_events.277.desc: "[ROOT.GetAdjective] diplomat di [SIK.GetNameDef] melaporkan bahwa proposal kami untuk mencari cadangan mineral dan minyak di bagian utara [SIK.GetNameDef] telah diterima. Pemerintah provinsi [SIK.GetName] sangat ingin melihat perluasan fasilitas infrastruktur di [618.GetName], yang secara alami akan meningkatkan eksploitasi emas dan perak di wilayah tersebut, sehingga mereka setuju untuk memberikan kami hak untuk mengeksploitasi sumber daya strategis apa pun yang kami temukan di [618.GetName] sebagai sarana untuk membayar kembali investasi [ROOT.GetAdjective]."
 NSB_soviet_foreign_politics_events.277.a: "Mereka tidak bisa menolak tawaran seperti itu!"
 NSB_soviet_foreign_politics_events.278.t: "[FROM.GetAdjective] Bantuan Militer"
 NSB_soviet_foreign_politics_events.278.desc: "Surat dari duta besar [FROM.GetAdjective] telah dikirimkan kepada diplomat kita di mana tetangga kita, yang tampaknya prihatin dengan kemampuan militer [ROOT.GetName], menawarkan bantuan militer untuk melaksanakan rekonstruksi tentara [ROOT.GetAdjective] dengan mengirimkan peralatan dan instruktur ke negara kita. Kami akan menerima pesawat dan peralatan untuk penerbangan, senapan dan senapan mesin untuk pasukan kami, bengkel artileri dan benteng akan dibangun dan sekolah pilot akan dibuka untuk melatih penerbang lokal. Sebagai imbalannya, pemerintah [FROM.GetAdjective] berupaya mengurangi hambatan perdagangan dan meningkatkan [ROOT.GetAdjective] ekspor barang komoditas seperti wol, kapas, bulu dan kulit."
 NSB_soviet_foreign_politics_events.278.a: "Ini benar-benar tawaran yang murah hati."
 NSB_soviet_foreign_politics_events.278.b: "Kita harus menolak pendudukan ekonomi [FROM.GetAdjective]!"
 NSB_soviet_foreign_politics_events.279.t: "[FROM.GetNameDefCap] Menerima Bantuan Militer kami"
 NSB_soviet_foreign_politics_events.279.desc: "Diplomat kami di [SIK.GetNameDef] telah memberi tahu kami bahwa proposal kami untuk memberikan bantuan militer kepada [SIK.GetName] telah diterima oleh [SIK.GetLeader]. Tampaknya, pemimpin Tiongkok tersebut sangat ingin memperkuat tentara dan pertahanan militernya, dan percaya bahwa, dengan bantuan [ROOT.GetAdjective], [SIK.GetNameDef] akan mampu melawan kekuatan musuh yang datang dari timur."
 NSB_soviet_foreign_politics_events.279.a: "Keputusan yang bijaksana!"
 NSB_soviet_foreign_politics_events.280.t: "[FROM.GetAdjective] Dukungan untuk Perluasan Wilayah"
 NSB_soviet_foreign_politics_events.280.desc: "Setelah perluasan wilayah kami ke timur, pemerintah [FROM.GetAdjective] telah menunjukkan minat untuk mendukung pertumbuhan kami dan membantu pembangunan infrastruktur dan pertahanan militer di wilayah yang baru kami peroleh. [FROM.GetNameDefCap] juga tertarik untuk mengembangkan ladang minyak di [756.GetName], yang menurut mereka mungkin merupakan kunci dalam dorongan militer kita ke timur.\nSekali lagi, pemerintah [FROM.GetAdjective] meminta keuntungan finansial lebih lanjut bagi entitas perdagangan mereka di pasar kita dan meningkatkan ekspor sebagai pembayaran."
 NSB_soviet_foreign_politics_events.280.a: "Itu tawaran yang adil."
 NSB_soviet_foreign_politics_events.280.b: "Sudah cukup, kita tidak membutuhkannya!"
 NSB_soviet_foreign_politics_events.281.t: "[FROM.GetNameDefCap] Menerima Bantuan Kami"
 NSB_soviet_foreign_politics_events.281.desc: "[SIK.GetLeader] telah menerima usulan kami untuk memberikan bantuan logistik dan militer untuk perluasan wilayahnya ke timur. Kami akan diizinkan untuk membangun infrastruktur dan pertahanan militer di wilayah yang baru mereka peroleh, serta mengembangkan ladang minyak di [756.GetName]. Sebagai imbalannya, pemerintah [SIK.GetAdjective] akan memberikan keuntungan finansial yang lebih besar kepada entitas perdagangan kita di pasar mereka dan akan meningkatkan jumlah ekspor ke negara kita."
 NSB_soviet_foreign_politics_events.281.a: "Kami selalu senang membantu!"
 NSB_soviet_foreign_politics_events.282.t: "[SOV.GetNameDefCap] Menuntut Formalisasi Republik Soviet [ROOT.GetNameDef]"
 NSB_soviet_foreign_politics_events.282.desc: "Kami telah menerima komunike resmi dari [FROM.GetNameDef] yang menuntut integrasi [ROOT.GetNameDef] sebagai Republik Sosialis Soviet Independen, yang berada di bawah pemerintahan [FROM.GetNameDef]. [FROM.GetLeader] sendiri telah berjanji bahwa negara kita akan menikmati otonomi sampai batas tertentu, dan Tentara Merah akan siap mempertahankan Sinkiang seolah-olah itu adalah tanah Soviet. Menurutnya, ini adalah langkah-langkah yang diperlukan untuk memastikan kerja sama yang efisien antara negara-negara kita di masa-masa sulit ini.\nMengingat besarnya investasi [FROM.GetNameDef] di negara kita dan meningkatnya pengaruh [FROM.GetAdjective] terhadap perekonomian kita, sebaiknya pikirkan baik-baik sebelum mengajukan tanggapan."
 NSB_soviet_foreign_politics_events.282.a: "Kami tidak punya pilihan lain."
 NSB_soviet_foreign_politics_events.282.b: "Kita harus menghentikan sandiwara ini!"
 NSB_soviet_foreign_politics_events.283.t: "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.283.desc: "Kami telah menerima komunike resmi dari [FROM.GetLeader] yang menerima integrasi provinsi Sinkiang di Tiongkok sebagai Republik Sosialis Soviet Merdeka, yang berada di bawah pemerintahan [ROOT.GetNameDef]. Proyek pembangunan besar kami di kawasan ini telah menunjukkan itikad baik [ROOT.GetAdjective] dalam menjalin hubungan baik dengan sekutu kami dan memberikan bantuan bila diperlukan. Tindakan-tindakan ini telah membantu [FROM.GetLeader] memahami bahwa tuntutan kami hanyalah tindakan yang diperlukan untuk memastikan kerja sama yang efisien antara negara-negara kita di masa-masa sulit ini."
 NSB_soviet_foreign_politics_events.283.a: "Selamat datang di Persatuan, kawan!"
 NSB_soviet_foreign_politics_events.284.t: "[FROM.GetNameDefCap] Menolak Tuntutan kami"
 NSB_soviet_foreign_politics_events.284.desc: "Kami telah menerima komunike resmi dari [FROM.GetLeader] yang menolak tuntutan kami untuk integrasi [FROM.GetNameDef] sebagai Republik Sosialis Soviet yang Merdeka. Tampaknya investasi besar yang kami lakukan untuk mengembangkan kawasan dan membantu tetangga kami di Tiongkok tidak berarti apa-apa bagi [FROM.GetLeader], yang masih memandang [ROOT.GetNameDef] dengan pandangan curiga."
 NSB_soviet_foreign_politics_events.284.a: "Mereka menghambat kerja sama antar negara kita."
 NSB_soviet_foreign_politics_events.284.b: "Kami tidak akan membiarkan pelanggaran ini dibiarkan begitu saja!"
 NSB_soviet_foreign_politics_events.285.t: "[SOV.GetName] di Ambang Keruntuhan"
 NSB_soviet_foreign_politics_events.285.desc: "Setelah menderita kerugian besar dalam perang, nampaknya keruntuhan [SOV.GetNameDef] mungkin akan terjadi lebih cepat dari yang kita kira. Beberapa anggota pemerintahan kami menegaskan bahwa negara kami pasti terancam oleh kejadian ini dan menyarankan agar kami segera membatalkan perjanjian [SOV.GetAdjective] dan mulai berupaya memperkuat hubungan dengan pejabat Tiongkok. Mereka menyatakan bahwa jika kita ingin memastikan keselamatan [ROOT.GetNameDef], kita harus melakukan apa pun untuk menemukan sekutu kuat yang dapat mendukung kita, dan bahwa [SOV.GetNameDef] kemungkinan tidak akan mampu melakukan tindakan pembalasan apa pun, mengingat keadaan saat ini."
 NSB_soviet_foreign_politics_events.285.a: "Kami melawan musuh kami bersama-sama!"
 NSB_soviet_foreign_politics_events.285.b: "Saatnya mencari teman baru di tempat lain!"
 NSB_soviet_foreign_politics_events.286.t: "Sinkiang Terancam Kerugian Soviet dalam Perang"
 NSB_soviet_foreign_politics_events.286.desc: "Kemarin, dalam keterangan resminya, [SIK.GetLeader] menegaskan kembali kesetiaan Sinkiang kepada [ROOT.GetNameDef] dan keinginan pribadinya untuk melanjutkan kerja sama antar negara kita. Namun, jelas bahwa unsur-unsur yang mengkhawatirkan di [SIK.GetNameDef] telah merusak citra [ROOT.GetNameDef] dan bahwa dukungan [SIK.GetLeader] di dalam [SIK.GetRulingParty] telah terkena dampak yang parah."
 NSB_soviet_foreign_politics_events.286.a: "Situasi yang menyedihkan..."
 NSB_soviet_foreign_politics_events.286.b: "Kita harus menghadapi pengkhianat yang banyak bicara itu!"
 NSB_soviet_foreign_politics_events.287.t: "[SIK.GetNameDefCap] Meninggalkan [ROOT.GetFactionName]"
 NSB_soviet_foreign_politics_events.287.desc: "Kemarin, dalam pernyataan resmi, [SIK.GetLeader] mengumumkan pemisahan Sinkiang dari [ROOT.GetFactionName], membatalkan semua perjanjian [ROOT.GetAdjective] dengan segera.\nMenurut pidatonya, dengan [ROOT:GetName] di ambang kehancuran dan dikelilingi musuh di timur dan barat, sudah saatnya Sinkiang memperkuat hubungan dengan tetangga dan saudaranya di Tiongkok timur untuk menghadapi penjajah asing."
 NSB_soviet_foreign_politics_events.287.a: "Biarkan mereka pergi! Ada banyak hal yang harus kita tangani."
 NSB_soviet_foreign_politics_events.287.b: "Kita harus membuat mereka membayar untuk ini!"
 SOV_sinikiang_influence_cg_tt_sik: "§Y[SOV.GetFlag][SOV.GetNameDefCap]§! akan menerima §Y-1,0%§! bonus Barang Konsumsi berdasarkan perjanjian ini."
 SOV_sinikiang_influence_cg_tt_sov: "$SOV_modify_fyp_ns_intro$\nPabrik Barang Konsumsi: §Y-1,0%§!"
 SOV_sinkiang_when_project_finishes_tt: "Efek ketika proyek selesai:"
 NSB_soviet_soviet_german_trade_agreement.1.t: "Perjanjian Perdagangan Soviet-Jerman"
 NSB_soviet_soviet_german_trade_agreement.1.desc: "Duta Besar [FROM.GetAdjective] telah menghubungi diplomat kami untuk mengusulkan perjanjian perdagangan antara negara kami. Berdasarkan usulan, [FROM.GetNameDef] akan mengirimkan bahan mentah seperti biji-bijian, kapas, minyak, bijih logam dan karet kepada kami. Sebagai imbalannya, [FROM.GetAdjective] akan menerima kapal penjelajah Kelas Hipper yang tidak lengkap, rencana untuk kapal militer lainnya, senjata angkatan laut yang berat, dan sampel pesawat [ROOT.GetAdjective].\nPerjanjian ini pasti akan membantu kita dalam upaya perang melawan negara-negara musuh di Eropa, memungkinkan kita menemukan cara untuk menghindari blokade [GetTradeAgreementBlockadeWarPeace]."
 NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng: "[ENG.GetAdjective]"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war: "musuh"
 NSB_soviet_soviet_german_trade_agreement.1.desc_peace: "musuh potensial"
 NSB_soviet_soviet_german_trade_agreement.1.a: "Kami membutuhkan bahan mentah"
 NSB_soviet_soviet_german_trade_agreement.1.b: "Kami tidak akan membagikan rahasia angkatan laut kami kepada mereka!"
 NSB_soviet_soviet_german_trade_agreement.2.t: "[GER.GetNameDefCap] menandatangani $NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.2.desc: "[FROM.GetAdjective] diplomat telah memberi tahu kami bahwa mereka telah menyetujui proposal kami. Negara kita telah menandatangani pakta perdagangan dimana [ROOT.GetNameDef] akan mengirimkan bahan mentah seperti biji-bijian, kapas, minyak, bijih logam dan karet ke [FROM.GetNameDef]. Sebagai imbalannya, kami akan menerima kapal penjelajah kelas Hipper yang tidak lengkap, rencana untuk kapal militer lainnya, senjata angkatan laut yang berat, dan sampel pesawat [FROM.GetAdjective].\nPerjanjian ini tentunya akan membantu kita dalam pengembangan teknologi militer modern."
 NSB_soviet_soviet_german_trade_agreement.2.a: "Armada Merah akan mendapatkan keuntungan dari hal ini."
 NSB_soviet_soviet_german_trade_agreement.3.t: "[GER.GetNameDefCap] menolak $NSB_soviet_soviet_german_trade_agreement.1.t$"
 NSB_soviet_soviet_german_trade_agreement.3.desc: "Setelah beberapa upaya dari duta besar kami untuk meyakinkan pejabat [FROM.GetAdjective] tentang manfaat timbal balik dari perjanjian perdagangan antara negara kami, diplomat [FROM.GetAdjective] baru saja memberi tahu kami bahwa mereka tidak tertarik untuk membuat perjanjian perdagangan dengan [ROOT.GetNameDef]."
 NSB_soviet_soviet_german_trade_agreement.3.a: "Dasar bodoh!"
 NSB_soviet_policies_of_collective_security.1.t: "[FROM.GetNameDefCap] Mengusulkan Pakta Gotong Royong"
 NSB_soviet_policies_of_collective_security.1.desc: "Memperhatikan ancaman yang dihadapi kedua negara, pemerintah [FROM.GetAdjective] telah mengusulkan pakta gotong royong. Berdasarkan ketentuan tersebut, kami tidak akan melakukan tindakan permusuhan terhadap satu sama lain.\n\nMasalah yang belum terselesaikan adalah kenyataan bahwa [POL.GetNonIdeologyName] berada di antara negara-negara kita. Upaya apa pun dari kedua belah pihak untuk membantu pihak lain harus dilakukan melalui Polandia. Beberapa anggota dinas diplomatik sangat yakin bahwa kita harus menyertakan Polandia dalam perjanjian ini untuk memastikan bahwa kita benar-benar dapat saling mendukung secara langsung."
 NSB_soviet_policies_of_collective_security.1.a: "Kami akan menyetujui persyaratan aslinya."
 NSB_soviet_policies_of_collective_security.1.b: "Kita harus menjangkau Polandia."
 NSB_soviet_policies_of_collective_security.1.c: "Ini bukan kepentingan kami."
 NSB_soviet_policies_of_collective_security.2.t: "[FROM.GetNameDefCap] Setuju untuk menandatangani Pakta"
 NSB_soviet_policies_of_collective_security.2.desc: "Pemerintah [FROM.GetNameDef] pada prinsipnya telah menyetujui usulan Pakta Gotong Royong. Delegasi diplomat telah tiba untuk memutuskan rincian penerapannya."
 NSB_soviet_policies_of_collective_security.2.a: "Kami berdiri bersama."
 NSB_soviet_policies_of_collective_security.3.t: "[FROM.GetNameDefCap] Menolak Proposal kami"
 NSB_soviet_policies_of_collective_security.3.desc: "Setelah perundingan yang menegangkan selama beberapa malam yang panjang, delegasi [FROM.GetAdjective] telah berangkat, tanpa perjanjian yang ditandatangani. Meskipun beberapa anggota dinas diplomatik masih berharap bahwa perjanjian tersebut dapat diselamatkan, tampaknya pemerintah [FROM.GetAdjective] menganggap masalah tersebut sudah selesai."
 NSB_soviet_policies_of_collective_security.3.a: "Sebuah keputusan yang sangat picik."
 NSB_soviet_policies_of_collective_security.4.t: "[FROM.GetNameDefCap] Mendorong Penyertaan [POL.GetAdjective] dalam Pakta"
 NSB_soviet_policies_of_collective_security.4.desc: "Meskipun pada dasarnya terbuka terhadap pakta bantuan timbal balik, pemerintah [FROM.GetAdjective] mempunyai beberapa kekhawatiran mengenai posisi Polandia. Tampaknya posisi pemerintah [FROM.GetAdjective] adalah bahwa Polandia harus diikutsertakan dalam pakta tersebut.\n\nIni adalah masalah yang membuat delegasi [FROM.GetAdjective] tidak mau mengalah, dan telah meminta agar kami secara resmi mengundang [POL.GetNonIdeologyName] ke dalam pakta tersebut."
 NSB_soviet_policies_of_collective_security.4.a: "Mereka ada benarnya."
 NSB_soviet_policies_of_collective_security.4.b: "Lamaran itu hanya ada di antara kami, karena suatu alasan."
 NSB_soviet_policies_of_collective_security.5.t: "[FROM.GetNameDefCap] menolak memasukkan [POL.GetNameDef] ke dalam Pakta"
 NSB_soviet_policies_of_collective_security.5.desc: "Upaya kami untuk meyakinkan delegasi [FROM.GetAdjective] tentang perlunya memasukkan [POL.GetNonIdeologyName] ke dalam Pakta tampaknya tidak membuahkan hasil.\n\nMenurut mereka, masalah [POL.GetNonIdeologyName] tidak relevan dengan perjanjian yang ada, dan dengan tegas menolak untuk membahasnya lebih lanjut. Kita sekarang perlu memutuskan apakah akan mengakhiri negosiasi di sini atau melanjutkan solusi perjanjian \"kecil\"."
 NSB_soviet_policies_of_collective_security.5.a: "Hal ini tidak seharusnya membatalkan perjanjian."
 NSB_soviet_policies_of_collective_security.5.b: "Maka kesepakatannya batal."
 NSB_soviet_policies_of_collective_security.6.t: "[FROM.GetNameDefCap] setuju untuk memasukkan [POL.GetNameDef] ke dalam Pakta"
 NSB_soviet_policies_of_collective_security.6.desc: "Setelah putaran perundingan tambahan, delegasi [FROM.GetAdjective] telah setuju untuk memasukkan [POL.GetNonIdeologyName] ke dalam pakta tersebut. Segera setelah rinciannya diselesaikan, kami akan mengirimkan pesan kepada pemerintah [POL.GetAdjective] yang menawarkan mereka untuk bergabung dengan Pakta tersebut dengan persyaratan yang sama seperti yang kami miliki."
 NSB_soviet_policies_of_collective_security.6.a: "Sekarang, mari kita pergi dan berbicara dengan orang Polandia."
 NSB_soviet_policies_of_collective_security.7.t: "[SOV.GetAdjective]-[FROM.GetAdjective] Pakta Gotong Royong"
 NSB_soviet_policies_of_collective_security.7.desc: "Duta Besar [FROM.GetAdjective] telah memberi tahu kami bahwa negaranya baru saja menandatangani perjanjian gotong royong dengan [SOV.GetNameDef]. Berdasarkan ketentuan perjanjian, tidak ada pihak yang akan menyerang pihak lain, dan akan mencoba mendukung pihak lain pada saat perang.\n\nDia lebih lanjut menyatakan bahwa pemerintahnya hanya menandatangani perjanjian ini berdasarkan ketentuan tegas bahwa kami diizinkan untuk bergabung dengan perjanjian tersebut jika kami menginginkannya."
 NSB_soviet_policies_of_collective_security.7.a: "Kami dengan senang hati akan menjadi pihak ketiga dalam hal itu."
 NSB_soviet_policies_of_collective_security.7.b: "Tidakkah mereka tahu bahwa Anda tidak bisa mempercayai Soviet?"
 NSB_soviet_policies_of_collective_security.8.t: "[FROM.GetNameDefCap] menolak menandatangani Pakta kecuali [POL.GetNameDef]"
 NSB_soviet_policies_of_collective_security.8.desc: "Upaya kami untuk menegosiasikan perjanjian dengan [FROM.GetNameDef] berakhir dengan kegagalan. Tampaknya isu [POL.GetNonIdeologyName] dan pencantumannya dalam pakta tersebut merupakan isu kritis yang tidak dapat dikompromikan."
 NSB_soviet_policies_of_collective_security.8.a: "Loyalitas yang salah tempat."
 NSB_soviet_policies_of_collective_security.9.t: "[FROM.GetNameDefCap] Setuju untuk Menandatangani Pakta"
 NSB_soviet_policies_of_collective_security.9.desc: "Setelah negosiasi lebih lanjut, pemerintah [FROM.GetAdjective] telah setuju untuk menandatangani pakta tersebut meskipun sebelumnya mereka ragu tentang pengecualian Polandia. Meskipun masih ada keluhan di antara delegasi [FROM.GetAdjective], mereka tampaknya bersedia untuk terus meratifikasi perjanjian tersebut."
 NSB_soviet_policies_of_collective_security.9.a: "Mereka melihat alasannya."
 NSB_soviet_policies_of_collective_security.10.t: "[FROM.GetNameDefCap] menolak Pakta tersebut"
 NSB_soviet_policies_of_collective_security.10.desc: "Dalam kejadian yang tidak terduga, pemerintah [POL.GetLeader] menolak untuk bergabung dengan pakta yang diusulkan. Meskipun alasan resmi yang diberikan adalah kurangnya ancaman yang dapat dipercaya, secara pribadi, pemerintah [POL.GetAdjective] menunjukkan bahwa Soviet mungkin ingin bergerak ke Polandia untuk mempertahankannya - namun mereka juga enggan untuk pergi setelahnya."
 NSB_soviet_policies_of_collective_security.10.a: "Setidaknya mereka mendapat tawaran itu."
 NSB_soviet_policies_of_collective_security.11.t: "[POL.GetNameDefCap] Menolak untuk Bergabung dengan Pakta Gotong Royong kita"
 NSB_soviet_policies_of_collective_security.11.desc: "Pemerintah [POL.GetAdjective] telah menolak untuk bergabung dengan Pakta Gotong Royong, dengan alasan kurangnya ancaman yang dapat dipercaya terhadap mereka, dan tidak mau terlibat dalam aliansi.\n\nBanyak desas-desus di kalangan diplomatik bahwa ini hanyalah tindakan penyelamatan muka, dan alasan sebenarnya adalah mereka tidak mempercayai kita."
 NSB_soviet_policies_of_collective_security.11.a: "Buang-buang waktu saja."
 NSB_soviet_policies_of_collective_security.12.t: "[FROM.GetNameDefCap] setuju untuk bergabung dengan Pakta Gotong Royong kami"
 NSB_soviet_policies_of_collective_security.12.desc: "Pemerintah [FROM.GetAdjective] pada prinsipnya telah setuju untuk bergabung dengan Pakta tersebut. Meskipun masih ada beberapa rincian yang harus diselesaikan, hal ini tidak akan menghalangi ratifikasi perjanjian tersebut."
 NSB_soviet_policies_of_collective_security.12.a: "Hal ini akan membuat aliansi semakin kuat."
 NSB_soviet_policies_of_collective_security.13.desc: "Dengan terselesaikannya permasalahan [POL.GetNonIdeologyName], pemerintah [FROM.GetAdjective] bersedia untuk meratifikasi perjanjian tersebut secara formal, berdasarkan ketentuan yang telah disepakati sebelumnya."
 NSB_soviet_policies_of_collective_security.13.a: "Sekarang, mari kita tuangkan tinta ke kertas!"
 NSB_soviet_academy_of_sciences.1.t: "Pendirian Akademi Ilmu Pengetahuan [THIS.GetAdjective]"
 NSB_soviet_academy_of_sciences.1.desc: "Dalam upacara mewah hari ini, [THIS.GetLeader] dan duta [SOV.GetAdjective] meresmikan Akademi Ilmu Pengetahuan [THIS.GetAdjective]. Mencontoh Akademi Ilmu Pengetahuan [SOV.GetAdjective], lembaga baru ini akan memungkinkan kita melakukan penelitian lanjutan pada tingkat yang sangat tinggi, dipandu oleh para ahli dari [SOV.GetNameDef]."
 NSB_soviet_academy_of_sciences.1.a: "Sebuah langkah maju yang besar!"
 NSB_soviet_atomic_bomb_project.1.t: "Agen kembali dengan rahasia nuklir"
 NSB_soviet_atomic_bomb_project.1.desc: "Salah satu agen kami yang ditugaskan untuk menyusup ke program penelitian nuklir asing telah kembali ke kedutaan kami, membawa sejumlah besar dokumen rahasia dari berbagai item berbeda yang sedang dikerjakan para ilmuwan, mulai dari desain sentrifugal hingga perhitungan dimensi hulu ledak. Data ini tidak diragukan lagi akan sangat berharga dalam memajukan program senjata nuklir kita."
 NSB_soviet_atomic_bomb_project.1.a: "Kemenangan lain untuk perdamaian."
 NSB_soviet_atomic_bomb_project.2.t: "Agen tertangkap di Fasilitas Nuklir"
 NSB_soviet_atomic_bomb_project.2.desc: "Salah satu Agen kami yang bertugas menyusup ke program senjata nuklir ditangkap hari ini ketika mencoba meninggalkan fasilitas yang aman. Penggeledahan di tasnya menghasilkan sejumlah dokumen rahasia. Sayangnya, dia jelas-jelas mengaku bekerja untuk kami, karena duta besar kami dipanggil untuk konsultasi mendesak dan dihadapkan dengan bukti-bukti."
 NSB_soviet_atomic_bomb_project.2.a: "Tidak masuk akal! Kami tidak memiliki hubungan dengan orang ini."
 NSB_soviet_atomic_bomb_project.3.t: "Pelanggaran Keamanan di Fasilitas Penelitian Nuklir"
 NSB_soviet_atomic_bomb_project.3.desc: "Sebelumnya hari ini, seorang karyawan di salah satu fasilitas penelitian nuklir kami dihentikan dalam pemeriksaan rutin. Pencarian menyeluruh terhadap barang-barangnya menemukan kompartemen tersembunyi di tasnya. Di dalam kompartemen itu terdapat sejumlah dokumen rahasia terkait teknologi nuklir.\n\nTersangka telah diserahkan ke kontra intelijen dan telah memberikan pengakuan penuh. Tampaknya dia berhubungan dengan kedutaan [SOV.GetAdjective], dan ditugaskan untuk menyusup ke program penelitian nuklir kita untuk mencuri cetak biru dan data penelitian lainnya."
 NSB_soviet_atomic_bomb_project.3.a: "Setidaknya tidak ada yang dicuri."
 NSB_soviet_policies_of_collective_security_agreed_effects_tt: "Jika pakta tersebut membuahkan hasil, kami akan menyetujui ketentuan berikut:"
 NSB_soviet_policies_of_collective_security_condition_effects_tt: "Jika pemerintah [FROM.GetAdjective] dan [POL.GetAdjective] setuju untuk memasukkan [POL.GetNameDef] ke dalam Pakta, dampak yang sama akan diterapkan pada [POL.GetNameDef]."
 NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt: "Kami akan menolak usulan [FROM.GetAdjective] untuk memasukkan [POL.GetNameDef] ke dalam pakta. [FROM.GetNameDefCap] harus memilih antara menerima usulan awal kami atau meninggalkan gagasan kesepakatan bersama tentang gotong royong."
 NSB_soviet_policies_of_collective_security_tt: "Jika [POL.GetAdjective] pemerintah menyetujui, [POL.GetNameDef] akan dimasukkan dalam kesepakatan bersama tentang gotong royong bersama dengan [FROM.GetNameDef] dan [ROOT.GetNameDef]."
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! dan [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! akan melepaskan klaim atau tujuan perang apa pun terhadap satu sama lain, menandatangani pakta non-agresi, dan memberikan jaminan satu sama lain."
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! dan [POL.GetFlag]§Y[POL.GetNameDefCap]§! akan melepaskan klaim atau tujuan perang apa pun terhadap satu sama lain, menandatangani pakta non-agresi, dan memberikan jaminan satu sama lain."
 NSB_soviet_comecon.1.t: "[FROM.GetAdjective] Proyek Industrialisasi di [ROOT.GetNameDef]"
 NSB_soviet_comecon.1.desc: "Sebagai bagian dari organisasi koordinasi ekonomi COMECON, pemerintah [FROM.GetAdjective] telah mulai berinvestasi dalam perekonomian kita. Hal ini akan memungkinkan kita untuk menumbuhkan perekonomian kita secara substansial dalam beberapa bulan ke depan."
 NSB_soviet_comecon.1.a: "Seperti inilah bentuk gotong royong dalam praksis!"
 NSB_soviet_comecon.2.t: "[FROM.GetAdjective] Program Pengembangan Militer untuk Negara COMECON"
 NSB_soviet_comecon.2.desc: "Pemerintah [FROM.GetAdjective] telah memutuskan serangkaian manuver dan latihan yang ekstensif. Hal ini akan meningkatkan kemampuan militer kami dan memungkinkan kami bekerja sama dengan sekutu kami yang lain. Kita harus menggunakan pengalaman yang kita peroleh dari latihan ini untuk melaksanakan reformasi militer yang diperlukan."
 NSB_soviet_comecon.2.a: "Kami akan siap bertarung bersamamu, kawan!"
 NSB_soviet_comecon_effect_duration_tt: "Efek ini akan bertahan selama §Y180§! hari, setelah itu Semangat Nasional kita akan ditukar kembali ke versi sebelumnya."
 NSB_soviet_spanish_civil_war.1.t: "[?SOV.SOV_spanish_general.GetName] Bergabung [ROOT.GetNameDef]"
 NSB_soviet_spanish_civil_war.1.desc: "Sebuah kapal tiba di Kronstadt kemarin, penuh dengan pengungsi Spanyol yang melarikan diri dari negara tersebut karena pemerintahan mereka akan segera jatuh dalam perang saudara. Mereka diterima oleh delegasi kami dari [ROOT.Capital.GetName], yang mengurus kelompok tersebut, yang sebagian besar terdiri dari anak-anak tetapi juga oleh beberapa politisi dan militer Spanyol.\nDi antara mereka, ada pejuang besar Komunis [?SOV.SOV_spanish_general.GetName] yang mengadakan pembicaraan dengan perwakilan kami. Mantan perwira militer Spanyol tersebut menyatakan bahwa orang-orang Spanyol datang ke [ROOT.GetNameDef] untuk menyembuhkan luka mereka dan untuk mencari solidaritas atas tugas mereka membebaskan rakyat Spanyol, dan meminta pemerintah [ROOT.GetAdjective] untuk mengakui pangkat militernya dan mengembalikannya ke dinas sehingga ia dapat melanjutkan perjuangan melawan fasisme dan imperialisme."
 NSB_soviet_spanish_civil_war.1.a: "Kami menyambut semua pengungsi Spanyol."
 NSB_soviet_spanish_civil_war.2.t: "Brigade Marxis Internasional Tiba di [ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.2.desc: "Para simpatisan Uni Soviet telah mengorganisir mobilisasi dan pelatihan ratusan anggota brigade internasional yang mendukung perjuangan kita untuk memenangkan perang tanpa meninggalkan revolusi. Para anggota proletariat dan kaum tani internasional yang pemberani ini siap memberikan hidup mereka dalam perang melawan fasisme dan borjuasi."
 NSB_soviet_spanish_civil_war.2.a: "Ini adalah awal dari revolusi global!"
 NSB_soviet_spanish_civil_war.3.t: "Komando Soviet Tiba di [ROOT.capital.GetName]"
 NSB_soviet_spanish_civil_war.3.desc: "Pasukan komando anti-Stalinis Soviet secara diam-diam telah tiba di Barcelona bersama dengan sejumlah agen dan agen terlatih yang bersimpati pada tujuan kami. Berdasarkan kontak kami di Uni Soviet, penguatan ini akan memungkinkan kami membentuk brigade elit yang dapat digunakan untuk mematahkan garis musuh atau menghentikan serangan musuh, serta memasukkan agen dan perwira terampil ke dalam rantai komando kami."
 NSB_soviet_spanish_civil_war.3.a: "Kami akan memanfaatkannya dengan baik."
 NSB_soviet_spanish_civil_war.4.t: "Pidato Populer yang Diorganisir Soviet"
 NSB_soviet_spanish_civil_war.4.desc: "Anggota gerakan oposisi sayap kanan yang karismatik di Uni Soviet, bersama dengan orator lokal dari POUM, CNT dan FAI, telah melakukan kampanye informasi dan agitasi untuk mengobarkan semangat revolusioner massa proletar dan tani [ROOT.GetNameDef]. Melalui pidato-pidato yang berapi-api di berbagai tempat, massa telah mengembangkan kesadaran kelas yang kuat dan kini lebih bersedia untuk berkomitmen pada perjuangannya."
 NSB_soviet_spanish_civil_war.4.a: "Bersatu, kita akan menang!"
 NSB_soviet_spanish_civil_war.5.t: "Agen Soviet Menyusup ke Komando Stalinis"
 NSB_soviet_spanish_civil_war.5.desc: "Sejumlah atase dan penasihat militer Soviet baru-baru ini tiba di Spanyol untuk membantu pemerintah republik borjuis.\nDi antara kelompok ini terdapat beberapa agen anti-Stalinis Soviet yang disusupi sebagai asisten penasihat militer yang dikirim oleh [FROM.GetLeader].\nAgen-agen ini telah menghubungi dan merekrut sejumlah pejabat, tentara, Brigadir internasional dan milisi yang bersimpati pada POUM yang saat ini berperang di unit-unit pihak republik borjuis, menciptakan jaringan informan yang mengesankan yang memungkinkan kita mendapatkan informasi langsung mengenai gerakan-gerakan yang direncanakan oleh rantai komando musuh."
 NSB_soviet_spanish_civil_war.5.a: "Ini adalah waktu untuk melakukan pukulan terakhir!"
 NSB_soviet_spanish_civil_war.6.t: "Revolusi Kemenangan di Spanyol"
 NSB_soviet_spanish_civil_war.6.desc_1: "Surat yang ditulis oleh [SPC.GetLeader] sendiri telah dikirimkan ke organisasi kami pagi ini. Dalam surat ini, pemimpin Spanyol menyatakan bahwa rakyat Spanyol tidak akan pernah melupakan dukungan yang diterima oleh kaum revolusioner Soviet yang sebenarnya dan bahwa, ketika saatnya tiba ketika kita harus menghadapi monolit tirani yaitu Stalinisme, kita dapat yakin bahwa POUM akan melakukan segala daya mereka untuk membantu rakyat Soviet dalam perjuangan mereka demi kebebasan dan revolusi sejati."
 NSB_soviet_spanish_civil_war.6.desc_2: "Setelah mengalahkan musuh-musuh fasis dan borjuis di Spanyol, dan menyadari situasi rakyat Soviet dalam perjuangan mereka melawan kontra-revolusi Stalinis, POUM telah mengorganisir operasi yang mengesankan untuk membawa sejumlah besar brigade sukarelawan ke markas besar kami. Pria dan wanita pemberani ini tidak hanya berasal dari Spanyol tetapi juga dari seluruh dunia, dan kebanyakan dari mereka adalah veteran Perang Saudara Spanyol yang berpengalaman, yang pengalaman dan keterampilannya dapat membantu menyeimbangkan perjuangan Soviet demi kepentingan kita."
 NSB_soviet_spanish_civil_war.6.a: "Revolusi juga akan menang di Rusia!"
 NSB_soviet_spanish_civil_war.6.b: "Revolusi atau Kematian!"
 SOV_poum_aid_in_case_of_civil_War_tt: "POUM Spanyol akan mengorganisir berbagai divisi sukarelawan untuk membantu kami jika terjadi perang saudara melawan [ROOT.GetLeader] dan doktrin Stalinis."
 NSB_soviet_planned_economy.1.t: "[SOV.GetAdjective] Program Perekonomian Terencana"
 NSB_soviet_planned_economy.1.desc: "[SOV.GetLeader] telah menyajikan skema baru untuk perekonomian bersama dan terencana.\nMeskipun tidak sempurna, pemerintah [FROM.GetAdjective] percaya bahwa NEP juga meraih sejumlah keberhasilan, dan bertekad untuk membangun model perekonomian terencana, menciptakan perekonomian yang lebih saling bergantung antara [FROM.GetNameDef] dan mitra-mitranya, dan membuka jalan menuju masyarakat Sosialis seutuhnya."
 NSB_soviet_planned_economy.1.a: "Kita harus mematuhinya"
 nsb_news.100.desc: "Lev Trotsky, yang pernah menjadi letnan tertinggi dan pewaris Vladimir Ilich Lenin, hari ini diserang di rumahnya oleh kelompok bersenjata yang melakukan penggerebekan di vilanya. Para penyerang menerobos masuk ke ruangan tempat Bolshevik berada, segera melepaskan tembakan sebelum menghilang dengan tergesa-gesa. Mereka meninggalkan Trotsky yang terluka parah, yang meninggal beberapa jam kemudian di sebuah rumah sakit di Mexico City.\n\nSetelah perebutan kekuasaan yang gagal dengan $SOV_iosif_stalin$ dan sekutunya untuk menguasai Partai Komunis Uni Soviet, Trotsky menghabiskan tahun tiga puluhan di pengasingan, tinggal di Turki, Prancis dan Norwegia sebelum akhirnya menetap di Meksiko.\nDia terus-menerus mengkritik Stalin dan 'negara pekerja' Uni Soviet yang merosot."
 nsb_news.101.desc: "Bolshevik lama, Lev Trotsky, hari ini diserang di rumahnya oleh kelompok bersenjata yang melakukan penggerebekan di vilanya. Para penyerang menyerbu ke dalam ruangan di mana dia berada, menembak dengan liar dan tanpa tujuan dan buru-buru menghilang, meninggalkan Trotsky tanpa cedera, yang berhasil bersembunyi di balik tempat tidur bersama istri dan cucunya.\n\nTrotsky pernah menjadi letnan tertinggi dan pewaris Vladimir Lenin, tetapi setelah perebutan kekuasaan yang gagal ia terpaksa diasingkan dari Uni Soviet oleh $SOV_iosif_stalin$. Berbicara kepada pers, Trotsky mengecam upaya pembunuhan terhadap dirinya sebagai 'rencana pengecut lainnya yang dibuat oleh Stalin untuk membungkam para pengkritiknya.'"
 nsb_news.102.t: "[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot] Pakta"
 nsb_news.102.desc_default: "Pakta bantuan timbal balik antara [SOV.GetNameDef] dan [SOV_collective_security_pact_integrant.GetNameDef] ditandatangani kemarin di [SOV.Capital.GetCapitalVictoryPointName] oleh diplomat dari kedua negara.\n\nPerjanjian ini merupakan bagian dari kebijakan Keamanan Kolektif yang diusulkan oleh [SOV.GetAdjective] Komisaris Rakyat Luar Negeri, [SOV.SOV_maksim_litvinov.GetName]. Berdasarkan perjanjian ini, [SOV.GetNameDef] dan [SOV_collective_security_pact_integrant.GetNameDef] telah berjanji untuk membela satu sama lain jika terjadi agresi oleh kekuatan musuh."
 nsb_news.102.desc_poland: "Perjanjian bantuan timbal balik antara [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] dan [POL.GetNameDef] ditandatangani kemarin di [SOV.Capital.GetCapitalVictoryPointName] oleh diplomat dari ketiga negara.\n\nPerjanjian ini merupakan bagian dari kebijakan Keamanan Kolektif yang diusulkan oleh [SOV.GetAdjective] Komisaris Rakyat Luar Negeri, [SOV.SOV_maksim_litvinov.GetName]. Berdasarkan perjanjian ini, [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] dan [POL.GetNameDef] telah melepaskan klaim teritorial apa pun di antara mereka, dan berjanji untuk membela satu sama lain jika terjadi agresi oleh kekuatan musuh."
 nsb_news.102.a: "Aliansi yang tidak biasa..."
 nsb_news.102.b: "Demi keamanan kolektif."
 SOV_collective_security_news_poland_included: "-[POL.GetAdjective]"
 SOV_collective_security_news_poland_no: ""
 nsb_news.103.t: "[SOV.GetAdjective]-[GER.GetAdjective] Perjanjian Dagang"
 nsb_news.103.desc: "[SOV.GetNameDef] dan [GER.GetNameDef] telah menandatangani perjanjian komersial di antara mereka. Dengan perjanjian ini, [SOV.GetAdjective] berupaya meningkatkan pengembangan industri dan penelitian militer, sedangkan [GER.GetAdjective] mencari impor bahan mentah yang sangat dibutuhkan seperti biji-bijian, minyak, dan bijih besi."
 nsb_news.103.a: "Ini akan menguntungkan [ROOT.GetNameDef]"
 nsb_news.103.b: "Berapa lama itu akan bertahan?"
 nsb_news.104.t: "Anglo-[SOV.GetAdjective] Invasi [PER.GetName]"
 nsb_news.104.desc: "Setelah perencanaan berminggu-minggu, [ENG.GetNameDef] dan [SOV.GetNameDef] telah melancarkan operasi militer gabungan di [PER.GetName], dengan tujuan melakukan pendudukan cepat melawan musuh yang kalah jumlah dan kalah teknologi. Menurut [ENG.GetLeader], operasi ini akan memungkinkan mereka mengamankan ladang minyak [PER.GetAdjective] dan jalur suplai [ENG.GetAdjective] ke [SOV.GetNameDef], sekaligus mencegah potensi serangan musuh dari [TUR.GetNameDef] melalui [PER.GetName] menuju ladang minyak Baku dan [RAJ.GetNameDef]."
 nsb_news.104.a: "Ini adalah tindakan yang perlu."
 nsb_news.104.b: "Korban lain dari [ENG.GetLeader] dan [SOV.GetLeader]."
 nsb_news.104.c: "Bukan pertarungan yang adil..."
 NSB_Soviet_fascist_civil_war.001.t: "[GetSovietCivilWarName]!"
 NSB_Soviet_fascist_civil_war.001.desc: "Waktu untuk melakukan manuver politik sudah berakhir. Perjuangan bersenjata melawan komunis telah dilanjutkan. Sebuah komite telah dibentuk yang akan memandu kita melewati perang ini. Kali ini kita akan berjuang bersatu sampai akhir. Kali ini tidak akan ada kekalahan. Kali ini kita akan merebut kembali kekaisaran!"
 NSB_Soviet_fascist_civil_war.001.a: "Untuk mempersenjatai!"
 NSB_Soviet_fascist_civil_war.002.t: "Rekrutan Kami Siap"
 NSB_Soviet_fascist_civil_war.002.desc: "Divisi Ruki siap bangkit dan melawan penindas Komunis."
 NSB_Soviet_fascist_civil_war.002.a: "Sempurna"
 NSB_Soviet_fascist_civil_war.003.t: "$SOV_grigory_semyonov$ Daun [ROOT.GetName]"
 NSB_Soviet_fascist_civil_war.003.desc: "Perang Saudara Rusia kembali pecah. $SOV_grigory_semyonov$, yang telah tinggal di sini sejak melarikan diri dari serangan merah, telah memutuskan untuk sekali lagi meninggalkan [ROOT.GetName] untuk bergabung dalam perjuangan melawan komunis di [SOV.GetNameDef]."
 NSB_Soviet_fascist_civil_war.003.a: "Dia harus pergi, kurasa"
 NSB_soviet_communist_civil_war.001.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.001.desc: "Kawan-kawan, sekali lagi telah tiba waktunya untuk mengibarkan panji-panji dan berperang demi revolusi. Sebelum kita bisa menyelamatkan proletariat, kita harus mendapatkan kembali kendali atas [ROOT.GetNameDef]. Sama seperti kita mengalahkan tentara kulit putih, kita sekarang harus mengalahkan mereka yang menghalangi revolusi sejati di tanah air.\nKita juga harus memutuskan siapa pemimpin kita dalam perjuangan ini."
 NSB_soviet_communist_civil_war.001.a: "Trotsky selalu menjadi musuh utama Stalin"
 NSB_soviet_communist_civil_war.001.b: "Smirnov akan memimpin rakyat menuju kemenangan"
 NSB_soviet_communist_civil_war.001.c: "Kami membutuhkan seseorang dengan pengalaman militer"
 NSB_soviet_communist_civil_war.001.d: "Zinoviev adalah pemimpin alami"
 NSB_soviet_communist_civil_war.001.e: "Kamenev akan menjadi tokoh yang baik"
 NSB_soviet_communist_civil_war.002.t: "Beriya Ditangkap oleh Tentara"
 NSB_soviet_communist_civil_war.002.desc: "$SOV_lavrenty_beriya$ telah ditangkap oleh perwira militer dan ditahan menunggu persidangannya. Divisi tentara telah bergerak ke ibu kota untuk mengamankannya dari segala upaya bangkit oleh para pendukungnya. Penangkapan terhadap rekan terdekat Beriya saat ini sedang dilakukan. Waktunya telah tiba untuk mencari pemimpin baru untuk [ROOT.GetNameDef]."
 NSB_soviet_communist_civil_war.002.a: "Bukharin adalah kandidat yang tepat"
 NSB_soviet_communist_civil_war.002.b: "Itu pasti Rykov"
 NSB_soviet_communist_civil_war.002.c: "Seseorang yang bisa menjamin kesetiaan tentara"
 NSB_soviet_communist_civil_war.002.d: "Zinoviev adalah pemimpin alami"
 NSB_soviet_communist_civil_war.002.e: "Kamenev akan menjadi tokoh yang baik"
 NSB_soviet_communist_civil_war.003.t: "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.003.desc: "Perang sekali lagi menimpa kita. Kita harus mengangkat senjata melawan diktator yang telah menyesatkan negara ini. Stalin sudah terlalu lama mengarahkan Uni Soviet ke arah yang salah. Sangat disayangkan hal ini harus dilakukan dengan cara ini, namun kita tidak punya pilihan."
 NSB_soviet_communist_civil_war.003.a: "Bukharin akan memimpin kita"
 NSB_soviet_communist_civil_war.003.b: "Rakyat bisa mendukung Rykov"
 NSB_soviet_communist_civil_war.003.c: "Kami membutuhkan seseorang dengan pengalaman militer"
 NSB_soviet_communist_civil_war.003.d: "Zinoviev adalah pemimpin alami"
 NSB_soviet_communist_civil_war.003.e: "Kamenev akan menjadi tokoh yang baik"
 NSB_soviet_communist_civil_war.004.t: "Seruan untuk Brigade Revolusi Internasional"
 NSB_soviet_communist_civil_war.004.desc: "[FROM.GetLeader] telah menyerukan relawan dalam perjuangan melawan [SOS.GetLeader]. Seruan tersebut telah dijawab oleh berbagai kelompok, dan brigade internasional mulai terbentuk."
 NSB_soviet_communist_civil_war.004.a: "Hal ini harus didorong"
 NSB_soviet_communist_civil_war.004.b: "Ini harus dihentikan!"
 NSB_soviet_communist_civil_war.004.c: "Oh"
 NSB_soviet_communist_civil_war.005.t: "Brigade Internasional Tiba"
 NSB_soviet_communist_civil_war.005.desc: "Kaum revolusioner dari seluruh dunia telah datang untuk melawan musuh-musuh revolusi yang sebenarnya. Para sukarelawan sedang dibentuk menjadi brigade internasional yang akan segera dikerahkan untuk melawan musuh [ROOT.GetNameDef]."
 NSB_soviet_communist_civil_war.005.a: "Tambahan yang disambut baik"
 NSB_soviet_communist_civil_war.006.t: "Protes Massal di [?SOV_uprising_state.GetName]"
 NSB_soviet_communist_civil_war.006.desc: "Para pekerja di [?SOV_uprising_state.GetName] turun ke jalan dalam unjuk rasa massal. Seruan untuk meningkatkan pengaruh terhadap serikat pekerja merupakan hal yang lazim, namun slogan-slogan dan tanda-tanda protes lainnya juga umum terjadi. Bahkan ada beberapa laporan mengenai nyanyian anti-Stalin secara langsung."
 NSB_soviet_communist_civil_war.006.a: "Biarkan mereka protes"
 NSB_soviet_communist_civil_war.006.b: "Hal ini harus dihentikan sebelum menjadi tidak terkendali"
 NSB_soviet_communist_civil_war.008.t: "Stalin Selamat dari Upaya Pembunuhan"
 NSB_soviet_communist_civil_war.008.desc: "Ada upaya yang gagal untuk membunuh Stalin. Seorang pria bersenjata telah membobol datcha Stalin tetapi ditemukan sebelum dia sempat sampai ke kamar sekretaris jenderal. Calon pembunuh itu ditembak mati di tempat oleh pengawal Stalin. Ibu kota kini dipenuhi rumor tentang siapa yang mungkin berada di balik tindakan tersebut."
 NSB_soviet_communist_civil_war.008.a: "Segalanya mungkin menjadi buruk"
 NSB_soviet_communist_civil_war.009.t: "Kematian Stalin"
 NSB_soviet_communist_civil_war.009.desc: "Pemimpin [SOV.GetNameDef] yang tak terbantahkan, $SOV_iosif_stalin$, telah dibunuh oleh pembunuh tak dikenal. Rupanya, pemimpin [SOV.GetNameDef] sedang sendirian di datchanya ketika akta tersebut dilakukan.\nSebuah troika, dipimpin oleh wali Stalin, $SOV_lavrenty_beriya$ yang tidak disukai secara universal, telah mengambil alih kendali negara, namun situasinya tidak stabil, dan masa depan [SOV.GetNameDef] tidak pasti."
 NSB_soviet_communist_civil_war.009.a: "Masa depan yang menarik."
 NSB_soviet_communist_civil_war.010.t: "[?SOS.SOV_general_to_desert.GetName] Cacat"
 NSB_soviet_communist_civil_war.010.desc: "Tidak senang dengan perlakuan Stalin, [?SOS.SOV_general_to_desert.GetName] telah memutuskan untuk meninggalkan diktator dan bergabung dalam perjuangan yang sah. Sejumlah kecil unit telah memutuskan untuk mengikuti jenderal mereka, daripada tetap menggunakan [SOS.GetLeader]."
 NSB_soviet_communist_civil_war.010.a: "Mereka sangat diterima!"
 NSB_soviet_civil_war_common.001.t: "Kemenangan"
 NSB_soviet_civil_war_common.001.desc_left: "Perang melawan Stalin telah berakhir. Diktator telah digulingkan. [ROOT.GetLeader] telah membawa kita menuju kemenangan.\nSaatnya menyalakan kembali api revolusioner dan memberikan kebebasan kepada kelas pekerja di seluruh dunia."
 NSB_soviet_civil_war_common.001.desc_right_concessions: "Negara telah dimenangkan, [ROOT.GetLeader] telah membawa kita menuju kemenangan. Sekaranglah waktunya untuk mulai memulihkan dan membentuk kembali negara ini. Kami telah menunjukkan bahwa kami siap melakukan apa yang diperlukan untuk menang. Kemenangan selalu membutuhkan pengorbanan, dan terlepas dari pengorbanan prajurit kita yang heroik, kita juga mempunyai hutang yang harus dibayar sebelum sejarah kita dapat dikuburkan."
 NSB_soviet_civil_war_common.001.desc_right_no_concessions: "Tentara kita yang menang berparade melewati Kremlin. Kemenangan ada di tangan kita!\nEra baru [ROOT.GetNameDef] dimulai hari ini. Di bawah kepemimpinan yang bijaksana dari [ROOT.GetLeader] negara ini akan dibangun kembali, dan menjadi lebih kuat dari sebelumnya."
 NSB_soviet_civil_war_common.001.desc_exiles: "Rezim komunis telah jatuh. Pasukan kita yang menang menguasai ibu kota. Rakyat akhirnya terbebas dari tirani merah. Rusia yang baru akan bangkit dari kehancuran yang disebabkan oleh dua perang saudara dan bertahun-tahun pemerintahan yang salah di antara keduanya."
 NSB_soviet_civil_war_common.001.a: "Saatnya untuk melanjutkan"
 NSB_soviet_civil_war_common.002.t: "Ibukota [ROOT.GetNameDef]"
 NSB_soviet_civil_war_common.002.desc: "Perang sudah berakhir. Keputusan perlu diambil mengenai ibu kota negara di masa depan."
 NSB_soviet_civil_war_common.002.a: "Moskow adalah kota terpenting"
 NSB_soviet_civil_war_common.002.b: "Leningrad adalah tempat revolusi dimulai"
 NSB_soviet_civil_war_common.002.c: "Itu pasti Petrograd"
 NSB_soviet_civil_war_common.002.d: "Ayo pertahankan [?SOV_civil_war_start_state.GetName]"
 NSB_soviet_civil_war_common.002.e: "Vladivostok akan menjadi Ibu Kota Timur kami yang baru"
 NSB_soviet_civil_war_common.002.f: "Sankt Peterburg adalah ibu kota Kekaisaran"
 SOV_petrograd: "Petrograd"
 SOV_StPetersburg: "Sankt Peterburg"
 NSB_soviet_civil_war_common.003.t: "[ROOT.GetLeader] Memobilisasi TNI"
 NSB_soviet_civil_war_common.003.desc: "Operasi kami tidak bisa lagi dilakukan secara sembunyi-sembunyi. [ROOT.GetLeader] telah memobilisasi tentara dan NKVD, dan mulai menangkapi semua orang yang dicurigai berkomplot melawan negara. Jika kita tidak bertindak sekarang, semua yang telah kita perjuangkan akan sia-sia."
 NSB_soviet_civil_war_common.003.a: "Peranglah saat itu"
 NSB_soviet_civil_war_common.006.t: "Partisan Bergabung dalam Pemberontakan"
 NSB_soviet_civil_war_common.006.desc: "Kekuasaan [SOS.GetLeader] di negara ini sedang goyah. Di seluruh [SOS.GetNameDef], masyarakat bangkit melawan tirani [SOS.GetLeader]. Unit-unit partisan sedang dibentuk yang akan membantu kita dalam perjuangan kita."
 NSB_soviet_civil_war_common.006.a: "Bagus"
 SOV_popular_uprising_units_tt: "Unit partisan bergabung dengan [ROOT.GetNameDef]."
 NSB_soviet_civil_war_common.010.t: "De-Stalinisasi"
 NSB_soviet_civil_war_common.010_right_opposition: "Diktator telah jatuh. Ini adalah waktu yang tepat untuk membongkar kultus terhadap Stalin, menghilangkan ikon-ikon yang mereka hargai dari para pengikutnya yang tersisa, dan menunjukkan kepada masyarakat bahwa masa lalu sudah tidak ada lagi. Monumen harus disingkirkan dan kota harus diganti namanya. Mungkin permata Stalin yang paling berharga adalah kota Stalingrad."
 NSB_soviet_civil_war_common.010_left_opposition: "Revolusi penuh kemenangan. Diktator telah jatuh, dan sekali lagi proletariat menguasai negara ini. Perilaku pemujaan Stalin harus dihentikan dan semua simbolnya harus disingkirkan. Kota-kota yang diberi nama Stalin dan para pengikutnya perlu diganti namanya menjadi kota yang lebih cocok. Hal ini terutama berlaku untuk kota Stalingrad."
 NSB_soviet_civil_war_common.010_exiles: "Kaum Bolshevik mencoba mengubah agama negara menjadi komunisme dan menciptakan aliran sesat di sekitar para pemimpinnya. Mereka bahkan sampai mengganti nama kota-kota di Rusia. Ketertiban harus dipulihkan di seluruh kekaisaran, dan tidak ada tempat yang lebih tepat untuk memulainya selain dari kota tua Tsaritsyn, yang berganti nama menjadi Stalingrad."
 NSB_soviet_civil_war_common.010.a: "Volgograd akan menjadi nama yang pas"
 NSB_soviet_civil_war_common.010.b: "Itu Tsaritsyn, seharusnya Tsaritsyn"
 NSB_soviet_civil_war_common.010.c: "Trotsky adalah pahlawan revolusi yang sebenarnya"
 NSB_soviet_civil_war_common.010.d: "Kita harus mengganti namanya untuk mengenang Bukharin"
