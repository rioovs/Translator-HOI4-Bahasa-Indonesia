 NSB_soviet_civil_war_common.100.t: "Vladivostok sebagai Imbalan atas Dukungan"
 NSB_soviet_civil_war_common.100.desc: "Kelompok oposisi di [FROM.GetNameDef] merencanakan pemberontakan melawan [FROM.GetLeader]. Kepala perunding mereka telah menawarkan untuk menyerahkan Vladivostok setelah mereka mengalahkan [FROM.GetLeader], sebagai imbalan atas dukungan jika terjadi perang saudara."
 NSB_soviet_civil_war_common.100_exiles.desc: "Kelompok oposisi Rusia di Manchuria merencanakan pemberontakan melawan [FROM.GetLeader]. Kepala perunding mereka, $SOV_konstantin_rodzayevsky$, telah menawarkan untuk menyerahkan Vladivostok setelah mereka mengalahkan [FROM.GetLeader], sebagai imbalan atas dukungan Jepang kepada kekuatan putih selama perang saudara."
 NSB_soviet_civil_war_common.100.a: "Ini sempurna"
 NSB_soviet_civil_war_common.100.b: "Kami tidak bisa menyisihkan tenaga kerja"
 vladivostock_concession_tt: "Pasukan ekspedisi [ROOT.GetAdjective] yang dipimpin oleh §Y[?SOV.SOV_japanese_general.GetName]§! akan dikirim untuk mendukung pasukan oposisi.\n§Y[408.GetName]§! akan dipindahkan ke §Y[ROOT.GetName]§! pada akhir Perang Saudara di [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.101.t: "[FROM.GetName] Mendukung Tujuan Kami"
 NSB_soviet_civil_war_common.101.desc: "Rezim [FROM.GetAdjective] telah menyetujui permintaan kami dan akan mendukung perjuangan kami melawan kaum Stalinis dengan kekuatan ekspedisi yang kuat jika ada upaya yang mendesak. Vladivostok akan menjadi milik mereka setelah pertempuran berakhir."
 NSB_soviet_civil_war_common.101.desc_exiles: "Teman-teman [FROM.GetAdjective] kami telah menyetujui permintaan kami dan akan mendukung perjuangan kami melawan Bolshevik dengan kekuatan ekspedisi yang kuat setelah kami bangkit. Menyerahkan Vladivostok adalah harga mahal yang harus dibayar, namun terkadang Anda harus berkorban - setidaknya untuk sementara."
 NSB_soviet_civil_war_common.101.a: "Itu seharusnya mengamankan punggung kita."
 NSB_soviet_civil_war_common.102.t: "Orang Jepang Menolak Vladivostok"
 NSB_soviet_civil_war_common.102.desc: "Dalam peristiwa yang agak tidak terduga, pemerintah [FROM.GetAdjective] telah menolak tawaran untuk mendapatkan pelabuhan dan wilayah di sekitar Vladivostok sebagai imbalan atas dukungan aktifnya terhadap Stalin."
 NSB_soviet_civil_war_common.102.a: "Ini adalah saat-saat yang menarik"
 NSB_soviet_civil_war_common.103.t: "Sakhalin Utara sebagai Imbalan Senjata"
 NSB_soviet_civil_war_common.103.desc: "Sebagai imbalan atas dukungan peralatan mereka terhadap pemberontakan melawan Stalin, oposisi Soviet siap menyerahkan kembali seluruh pulau yang mereka sebut Sakhalin kepada [ROOT.GetName]."
 NSB_soviet_civil_war_common.103.desc_exiles: "Perwakilan dari komunitas Emigran Rusia di Manchuria telah menghubungi kami dengan permintaan pasokan jika terjadi Perang Saudara Rusia yang kedua. Sebagai imbalannya, mereka mengatakan bahwa mereka siap untuk mengakui hak [ROOT.GetNameDef] atas keseluruhan pulau Karafuto."
 NSB_soviet_civil_war_common.103.a: "Jika mereka ingin mendapat kesempatan, mereka memerlukan semua bantuan yang bisa mereka dapatkan"
 NSB_soviet_civil_war_common.103.b: "Kita mungkin bisa menyisihkan sesuatu"
 NSB_soviet_civil_war_common.103.c: "Setidaknya kita bisa membeli beberapa senjata untuk mereka"
 NSB_soviet_civil_war_common.103.d: "Risiko terseret ke dalam konflik tersebut tidak sebanding"
 sakhalin_concession_tt: "[655.GetName] akan ditransfer ke [ROOT.getName] pada akhir Perang Saudara di [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.104.t: "[FROM.GetNameDefCap] akan Memasok Senjata"
 NSB_soviet_civil_war_common.104.desc: "Negosiasi dengan [FROM.GetAdjective] telah berhasil. [FROM.GetName] telah berjanji untuk memasok senjata kepada kita sebagai imbalan atas kendali atas bagian utara Sakhalin."
 NSB_soviet_civil_war_common.104.a: "Harga yang mahal, tapi semoga sepadan"
 NSB_soviet_civil_war_common.105.t: "[FROM.GetNameDefCap] Menolak Pasokan Senjata"
 NSB_soviet_civil_war_common.105.desc: "Meskipun menawarkan [FROM.GetLeader] kesepakatan yang tentunya akan menguntungkan [FROM.GetAdjective], delegasi tersebut pulang dengan tangan kosong."
 NSB_soviet_civil_war_common.105.a: "Ini buruk"
 NSB_soviet_civil_war_common.106.t: "Bantuan Terselubung sebagai Pengembalian Ladang Minyak Baku"
 NSB_soviet_civil_war_common.106.desc_right_opp_before: "Kelompok oposisi di [FROM.GetNameDef] merencanakan kudeta terhadap Stalin. Mereka telah mendekati kami, meminta bantuan untuk membangun militer secara rahasia sebagai imbalan atas hak minyak di ladang minyak Baku di masa depan."
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war: "[SOV.GetNameDefCap], dipimpin oleh [SOV.GetLeader] telah bangkit melawan [SOS.GetLeader] dan berperang dalam perang saudara yang menyedihkan. Para pemberontak telah mendekati kami, menawarkan hak masa depan atas ladang minyak Baku sebagai imbalan atas bantuan dalam membangun kapasitas militer mereka."
 NSB_soviet_civil_war_common.106.desc_exiles_before: "Kelompok anti-komunis di Manchuria berencana melawan [SOV.GetLeader]. Mereka berencana untuk menggulingkan kaum Bolshevik dengan perang saudara lainnya. Perwakilan dari kelompok ini telah mendekati kami, meminta bantuan untuk membangun militer secara terselubung sebagai imbalan atas hak minyak di ladang minyak Baku di masa depan."
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war: "Pasukan kulit putih Rusia telah bangkit melawan [SOS.GetLeader], memulai perang saudara lainnya di Rusia. Para pemberontak telah mendekati kami, menawarkan hak masa depan atas ladang minyak Baku sebagai imbalan atas bantuan dalam membangun kapasitas militer mereka."
 NSB_soviet_civil_war_common.106.a: "Apa pun yang mengganggu stabilitas Uni Soviet adalah hal yang baik"
 NSB_soviet_civil_war_common.106.b: "Kedengarannya sangat bagus. Kita bahkan harus mengirimkan beberapa penasihat militer"
 NSB_soviet_civil_war_common.106.c: "Mari kita tidak terlibat"
 SOV_baku_oil_fields_tt: "[ROOT.GetNameDefCap] akan membantu membangun industri militer dalam persiapan perang saudara di [FROM.GetNameDef]. Sebagai imbalannya, [ROOT.GetNameDef] akan menerima §Yhak sumber daya§! atas ladang Minyak Baku setelah Perang Saudara Soviet berakhir"
 SOV_german_advisors_tt: "Dua pemimpin militer akan berperang untuk oposisi selama Perang Saudara Soviet"
 NSB_soviet_civil_war_common.107.t: "[FROM.GetNameDefCap] Setuju untuk Membantu Sebagai Imbalan untuk Ladang Minyak Baku"
 NSB_soviet_civil_war_common.107.desc_normal: "Permintaan bantuan kami untuk membangun kemampuan militer telah diterima dengan baik oleh [FROM.GetNameDef]. Pemerintah [FROM.GetAdjective] akan membantu membangun pabrik militer dengan imbalan hak minyak di Kaukasus di masa depan."
 NSB_soviet_civil_war_common.107.desc_advisors: "Pemerintah [FROM.GetAdjective] telah setuju untuk membantu membangun industri militer dengan imbalan hak atas minyak di masa depan. Selain itu, mereka juga setuju untuk mengirimkan beberapa \"penasihat\" militer yang akan tinggal bersama kami selama perang saudara berlangsung."
 NSB_soviet_civil_war_common.107.a: "Kabar baik"
 NSB_soviet_civil_war_common.108.t: "[FROM.GetNameDefCap] Menolak Membantu"
 NSB_soviet_civil_war_common.108.desc: "Negosiasi kami dengan [FROM.GetNameDef] tidak membuahkan hasil. Meskipun menawarkan hak atas minyak di masa depan, mereka tidak akan membantu kita membangun lebih banyak industri militer."
 NSB_soviet_civil_war_common.108.a: "Kalau begitu, kita harus mengurusnya sendiri"
 NSB_soviet_civil_war_common.109.t: "Mengirim \"Penasihat\" ke [SOV.GetNameDef]"
 NSB_soviet_civil_war_common.109.desc: "Perang saudara kembali terjadi di Rusia. [SOV.GetLeader] memimpin perang melawan [SOS.Getleader] dan jika pemberontak berhasil, kita akan mendapatkan banyak keuntungan. Kami menjanjikan dukungan kepada mereka, dan [?ROOT.SOV_foreign_military_advisor_1.GetName] dan [?ROOT.SOV_foreign_military_advisor_2.GetName] siap berangkat ke [SOV.GetName] untuk membantu merencanakan perang, dan mendapatkan wawasan berharga tentang kemampuan militer [SOV.GetAdjective]."
 NSB_soviet_civil_war_common.109.a: "Ini akan menjadi hal yang paling menarik"
 NSB_soviet_civil_war_common.110.t: "Bantuan untuk Menghasut Pemberontakan Ukraina"
 NSB_soviet_civil_war_common.110.desc: "Oposisi Soviet telah meminta bantuan kami dalam perebutan kekuasaan. Mereka ingin kita diam-diam melatih milisi Ukraina dengan imbalan sumber daya masa depan di Ukraina yang merdeka."
 NSB_soviet_civil_war_common.110.a: "Itu tawaran yang terlalu bagus untuk ditolak"
 NSB_soviet_civil_war_common.110.b: "Jangan terlibat di dalamnya"
 SOV_ukraine_insurrection_tt: "[ROOT.GetName] akan melatih Milisi Ukraina sebagai imbalan atas §Yhak sumber daya§! di Ukraina."
 NSB_soviet_civil_war_common.111.t: "[FROM.GetNameDefCap] akan melatih Milisi Ukraina"
 NSB_soviet_civil_war_common.111.desc: "[FROM.GetNameDefCap] telah setuju untuk memulai pelatihan milisi Ukraina. Unit-unit tersebut kemudian akan diselundupkan ke Ukraina jika mereka sudah siap dan melancarkan pemberontakan melawan rezim Stalinis."
 NSB_soviet_civil_war_common.111.a: "Ini mempunyai hasil yang lebih baik"
 NSB_soviet_civil_war_common.112.t: "[FROM.GetNameDefCap] Menolak Proposal Ukraina"
 NSB_soviet_civil_war_common.112.desc: "Setelah beberapa hari berdiskusi, [FROM.GetLeader] tiba-tiba memutuskan untuk tidak mendukung pemberontakan Ukraina, sehingga para perunding kami tidak tahu mengapa usulan mereka ditolak."
 NSB_soviet_civil_war_common.112.a: "Sayang sekali"
 NSB_soviet_civil_war_common.113.t: "Milisi Ukraina Siap"
 NSB_soviet_civil_war_common.113.desc_before: "Kontak kami di Jerman melaporkan bahwa milisi Ukraina yang mereka latih siap menyerang. Unit-unit tersebut telah dilengkapi dan dilatih dan akan dikerahkan secara diam-diam di Ukraina, menunggu pecahnya perang."
 NSB_soviet_civil_war_common.113.desc_started: "Kontak kami di Jerman melaporkan bahwa milisi Ukraina yang mereka latih siap menyerang. Unit-unit tersebut telah dilengkapi dan secara diam-diam diangkut ke lokasi-lokasi strategis. Perintah untuk pergi telah diberikan dan pemberontakan akan dimulai kapan saja."
 NSB_soviet_civil_war_common.113.a: "Satu musuh lagi untuk [SOS.GetLeader]"
 NSB_soviet_civil_war_common.113.b: "Senang mengetahuinya"
 NSB_soviet_civil_war_common.113.c: "Tunggu, apa?"
 NSB_soviet_civil_war_common.114.t: "Pemberontakan Ukraina"
 NSB_soviet_civil_war_common.114.desc: "Tentara Ukraina terlatih Jerman telah menguasai kota-kota penting di seluruh Ukraina. Pemerintahan awal yang dipimpin oleh [UKR.GetLeader] telah dibentuk dan [UKR.GetNameDef] telah mendeklarasikan dirinya sebagai negara merdeka."
 NSB_soviet_civil_war_common.114.a: "Ini tidak bisa diterima!"
 NSB_soviet_civil_war_common.114.b: "Ya, kami memang menyetujui hal ini"
 NSB_soviet_civil_war_common.114.c: "Ini akan memberikan pukulan telak bagi [SOS.GetLeader]"
 NSB_soviet_civil_war_common.115.t: "Kemerdekaan Belarus di Masa Depan sebagai Imbalan atas Dukungan"
 NSB_soviet_civil_war_common.115.desc: "Oposisi Soviet telah mendekati kami dengan permintaan dukungan rahasia. Sebagai imbalan atas perbekalan dan bantuan pembangunan militer, mereka siap menerima kembalinya pemerintahan [BLR.GetAdjective] di pengasingan."
 NSB_soviet_civil_war_common.115.a: "Ide yang bagus"
 NSB_soviet_civil_war_common.115.b: "Kita sudah mempunyai cukup banyak masalah sendiri"
 SOV_belarus_tt: "[BLR.GetNameDefCap] akan dibebaskan sebagai negara merdeka pada akhir [GetSovietCivilWarName]"
 NSB_soviet_civil_war_common.116.t: "[FROM.GetNameDefCap] Dukung Tujuan kami"
 NSB_soviet_civil_war_common.116.desc: "Negosiasi kami dengan [FROM.GetAdjective] telah berhasil. Sebagai imbalan karena mengizinkan kembalinya pemerintah [BLR.GetAdjective] di pengasingan setelah perang, pemerintah [FROM.GetAdjective] akan mendukung kami dengan pembangunan dan peralatan militer."
 NSB_soviet_civil_war_common.116.a: "Bagus"
 NSB_soviet_civil_war_common.117.t: "Tidak Ada Dukungan dari [FROM.GetNameDef]"
 NSB_soviet_civil_war_common.117.desc: "Negosiasi kami dengan [FROM.GetAdjective] belum menghasilkan sesuatu yang konkrit. [FROM.GetLeader] menolak tawaran kami, jadi tidak ada bantuan yang akan datang dari [FROM.GetName]."
 NSB_soviet_civil_war_common.117.a: "Kita harus menyelesaikannya tanpa bantuan mereka"
 NSB_soviet_civil_war_common.118.t: "Oposisi Soviet Meminta Dukungan"
 NSB_soviet_civil_war_common.118.desc: "Anggota oposisi Soviet yang anti-Stalinis saat ini berkampanye melawan rezim Stalinis. Sejumlah unjuk rasa anti-Stalin telah diorganisir dan mereka menjalankan kampanye penggalangan dana di sini di [ROOT.GetName].\nSelain menggalang dukungan rakyat untuk tujuan mereka, mereka diam-diam mendekati kami dengan permintaan senjata untuk mendukung pemberontakan."
 NSB_soviet_civil_war_common.118.a: "Mari kita suplai mereka dengan senapan"
 NSB_soviet_civil_war_common.118.b: "Setidaknya kita bisa menyisihkan beberapa senapan"
 NSB_soviet_civil_war_common.118.c: "Kami tidak punya, tapi mungkin jika kami membelikannya untuk mereka"
 NSB_soviet_civil_war_common.118.d: "Tidak ada gunanya terlibat"
 NSB_soviet_civil_war_common.119.t: "[FROM.GetNameDefCap] Mendukung Tujuan kami"
 NSB_soviet_civil_war_common.119.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk diam-diam memasok senjata kepada kami."
 NSB_soviet_civil_war_common.119.a: "Bagus"
 NSB_soviet_civil_war_common.120.t: "Pemerintah [FROM.GetAdjective] tidak akan mendukung kami"
 NSB_soviet_civil_war_common.120.desc: "Penggalangan dana kami di [FROM.GetNameDef] berhasil. Namun, pemerintah menolak memasok senjata kepada kami."
 NSB_soviet_civil_war_common.120.a: "Sayang sekali"
 NSB_soviet_civil_war_common.121.t: "[FROM.GetName] Meminta Perlindungan kami"
 NSB_soviet_civil_war_common.121.desc: "[FROM.GetLeader] telah mengirimkan delegasi yang meminta dukungan kami terhadap [SOS.GetNameDef].\nPemerintah [FROM.GetAdjective] bersedia menyerahkan kedaulatannya sebagai imbalan atas masuknya [ROOT.GetAdjective] ke dalam perang."
 NSB_soviet_civil_war_common.121.a: "Inilah yang kami tunggu-tunggu"
 NSB_soviet_civil_war_common.121.b: "Jangan sampai kita terlibat dalam hal itu"
 NSB_soviet_civil_war_common.122.t: "[FROM.GetName] Menerima Penawaran kami"
 NSB_soviet_civil_war_common.122.desc: "Sungguh disayangkan hal ini harus terjadi. Namun untuk mendapatkan kembali kendali atas apa yang telah hilang, kita harus berkorban. Ini hanyalah tindakan darurat sementara.\nSetelah kaum Bolshevik lenyap, kami akan berusaha mencapai kemerdekaan total."
 NSB_soviet_civil_war_common.122.a: "Untuk kemenangan"
 NSB_soviet_civil_war_common.123.t: "[FROM.GetName] Tinggalkan Kami"
 NSB_soviet_civil_war_common.123.desc: "Di saat yang paling sulit bagi kami, [FROM.GetLeader] memutuskan untuk menarik dukungan yang telah dijanjikan [FROM.GetNameDef], meskipun kami siap melakukan apa pun untuk mengamankannya."
 NSB_soviet_civil_war_common.123.a: "Ini tidak akan terlupakan!"
 NSB_soviet_civil_war_common.124.t: "[FROM.GetAdjective] Pabrik Selesai"
 NSB_soviet_civil_war_common.124.desc: "Pabrik yang dibangun pada [?SOV_civil_war_start_state.GetName] siap untuk dimulai. Ini akan sangat membantu upaya perang kita, baik saat ini maupun di masa depan."
 NSB_soviet_civil_war_common.124.a: "Bagus"
 NSB_soviet_civil_war_common.125.t: "Desersi Musuh"
 NSB_soviet_civil_war_common.125.desc: "Setelah kami menangkap [?SOV.SOV_defections_army_state.GetName], pasukan [SOS.GetLeader] putus asa. Tentara melakukan desersi secara massal, beberapa hanya meletakkan senjata mereka, sementara yang lain benar-benar bergabung dengan perjuangan kita."
 NSB_soviet_civil_war_common.125.a: "Bagus"
 SOS_army_desertions_tt: "Pasukan §Y[SOS.GetNameWithFlag]§! kehilangan §Yperalatan§!, §Ytenaga kerja§!, dan §Yorganisasi§!, dan beberapa unit membelot ke §Y[ROOT.GetNameWithFlag]§!."
 NSB_soviet_civil_war_common.126.t: "Persediaan Tentara Ditangkap di [?SOV.SOV_captured_stockpile_state.GetName]"
 NSB_soviet_civil_war_common.126.desc: "Depo tentara [SOS.GetAdjective] direbut oleh pasukan kita yang menang di [?SOV.SOV_captured_stockpile_state.GetName]. [SOS.GetAdjective] yang mundur telah mencoba menghancurkannya, namun tentara kami berhasil merebut beberapa peralatan."
 NSB_soviet_civil_war_common.126.a: "Kita bisa memanfaatkannya dengan baik"
 NSB_soviet_civil_war_common.127.t: "Pembelotan Angkatan Laut"
 NSB_soviet_civil_war_common.127.desc: "Setelah kemenangan kami di [?SOV.SOV_defections_navy_state.GetName], beberapa perwira angkatan laut menyadari bahwa mereka berjuang untuk tujuan yang sia-sia. Akibatnya, sejumlah kapal telah meninggalkan Armada Merah dan awaknya menawarkan diri untuk bergabung dengan kami."
 NSB_soviet_civil_war_common.127.a: "Seseorang seharusnya tidak melihat hadiah kuda di mulutnya"
 SOS_navy_desertions_tt: "Unit angkatan laut dari §Y[SOS.GetNameWithFlag]§! membelot ke §Y[ROOT.GetNameWithFlag]§!."
 NSB_soviet_civil_war_common.128.t: "Kerusuhan di [SOS.GetNameDef]"
 NSB_soviet_civil_war_common.128.desc: "Laporan menunjukkan bahwa kemenangan terbaru kami di lapangan, seperti penangkapan [?SOV.SOV_civilian_unrest_state.GetName], telah menyebabkan protes di seluruh [SOS.GetNameDef]. Tentu saja, kroni-kroni [SOS.GetLeader] menyerang protes ini dengan brutal, namun bagaimanapun juga, hal ini pasti akan berdampak negatif pada upaya perang [SOS.GetAdjective]."
 NSB_soviet_civil_war_common.128.a: "Kami akan memenangkan ini"
 SOS_civilian_unrest_tt: "Industri di §Y[SOS.GetNameWithFlag]§! mengalami kerusakan.\nBatas penyerahan §Y[SOS.GetLeader]§! berkurang."
 NSB_soviet_civil_war_common.129.t: "[?SOV.SOV_japanese_general.GetName] Berangkat"
 NSB_soviet_civil_war_common.129.desc: "Ketika perang saudara berkecamuk di Rusia, inilah saatnya bagi kita untuk memenuhi janji kita. [?SOV.SOV_japanese_general.GetName] akan memimpin pasukan ekspedisi [ROOT.GetAdjective] menuju kemenangan dan kejayaan, serta melindungi kehormatan [ROOT.GetNameDef]."
 NSB_soviet_civil_war_common.129.a: "Seseorang harus melakukan tugasnya"
 NSB_soviet_nationalist.001.t: "Pemberontakan nasionalis di [?SOV.SOV_nationalist_country.GetNameDef]"
 NSB_soviet_nationalist.001.desc: "[?SOV.SOV_nationalist_country.GetLeader] telah mendeklarasikan [?SOV.SOV_nationalist_country.GetName] mandiri. [SOS.GetLeader] menyebut tindakan ini sebagai tindakan makar dan memerintahkan para pemberontak ditangkap dan ditembak. Akibatnya, [SOS.GetNameDef] dan [?SOV.SOV_nationalist_country.GetNameDef] kini dalam keadaan perang.[GetFinnishCommittmentInKareliaOrNot]"
 FIN_karelian_uprising_supported_by_finland: "Situasi semakin meningkat ketika pasukan [FIN.GetAdjective] melintasi perbatasan sehingga memperluas konflik dan membawa [FIN.GetNameDef] ke dalam konflik melawan [SOS.GetNameDef]."
 SOV_breakaway_country_flag: "Mendeklarasikan Kemerdekaan dari Uni Soviet"
 NSB_soviet_nationalist.001.a: "Musuh dari musuh kita adalah teman kita"
 NSB_soviet_nationalist.001.b: "Ini adalah wilayah [ROOT.GetAdjective] yang sah!"
 indepence_war_threat: "Memproklamirkan Kemerdekaan"
 NSB_soviet_nationalist.002.t: "[FROM.GetNameDefCap] Menuntut Penaklukan"
 NSB_soviet_nationalist.002.desc: "Duta Besar [FROM.GetAdjective] telah mendekati pemerintah kami dengan \"permintaan\" agar kami mengakui [FROM.GetNameDef] sebagai pemerintahan [ROOT.GetName] yang sebenarnya dan tertinggi. Sebagai imbalannya, mereka menawarkan \"otonomi pada tingkat tertentu\"."
 NSB_soviet_nationalist.002.a: "Kita mengalahkan Uni Soviet, kita juga bisa mengalahkan mereka."
 NSB_soviet_nationalist.002.b: "Mungkin itu yang terbaik."
 NSB_soviet_nationalist.003.t: "[FROM.GetNameDefCap] Menerima"
 NSB_soviet_nationalist.003.desc: "[FROM.GetLeader] tidak melihat alasan untuk tidak menerima tuntutan kami yang sah. [FROM.GetNameDef] akan kembali ke Kekaisaran, dengan hak untuk memerintah sendiri."
 NSB_soviet_nationalist.003.a: "Hari yang menyenangkan bagi Rusia"
 NSB_soviet_nationalist.004.t: "[FROM.GetNameDefCap] Menolak"
 NSB_soviet_nationalist.004.desc: "Meskipun ada tekanan, dan meskipun menyadari sepenuhnya situasi genting negara [FROM.GetLeader.GetHerHis], [FROM.GetLeader] menolak untuk menerima tawaran otonomi kami yang murah hati di dalam Kekaisaran Rusia yang telah dibangun kembali."
 NSB_soviet_nationalist.004.a: "Kita harus membuat mereka tunduk!"
 NSB_soviet_nationalist.004.b: "Saya kira kita harus menunggu sebentar"
 NSB_soviet_permanent_revolution.1.t: "Kaum Revolusioner Trotskis Mengagitasi Massa"
 NSB_soviet_permanent_revolution.1.desc: "Kaum Trotskis dari [FROM.GetNameDef] membangkitkan massa dengan propaganda revolusioner. Mereka bahkan berjanji untuk membantu proletariat [ROOT.GetAdjective] jika mereka bangkit melawan negara. Situasinya terancam tidak terkendali."
 NSB_soviet_permanent_revolution.1.a: "Ini pada dasarnya adalah tindakan agresi"
 NSB_soviet_for_the_common_good.1.t: "Demi Kebaikan Bersama"
 NSB_soviet_for_the_common_good.1.desc: "Kolektif lebih kuat dibandingkan individu. Hal ini juga berlaku bagi perekonomian. [SOV.GetNameDefCap] telah memutuskan untuk mengatur kembali perekonomian semua negara sekutunya, agar dapat memberikan pelayanan yang lebih baik kepada kolektif, dibandingkan kepada masing-masing negara. Hal ini berarti perubahan pada cara kita melakukan sesuatu saat ini, dan mungkin akan mengalami beberapa kesulitan pada awalnya, namun pada akhirnya hal ini akan memberikan manfaat yang lebih baik bagi semua orang."
 NSB_soviet_for_the_common_good.1.a: "Demi kebaikan bersama!"
 NSB_soviet_fascist_tsarist.1.t: "Keanggotaan Uni Pan-Slavia"
 NSB_soviet_fascist_tsarist.1.desc: "Saat dunia di sekitar kita mengalami kekerasan, [FROM.GetNameDef] telah mengambil tindakan dan bersumpah untuk membela semua bangsa Slavia dari pihak-pihak yang ingin mencelakakan kita. Mereka telah menyampaikan undangan kepada kami untuk menjadi anggota \"Persatuan Pan-Slavia\" yang baru, di mana mereka mengklaim semua bangsa Slavia akan terwakili secara adil dan adil, dilindungi oleh tentara besar [FROM.GetAdjective]."
 NSB_soviet_fascist_tsarist.1.a: "Kami akan berpartisipasi dalam penyatuan besar bangsa Slavia!"
 NSB_soviet_fascist_tsarist.1.b: "Perlindungan mereka tidak sebanding dengan kemerdekaan kita."
 NSB_soviet_fascist_tsarist.2.t: "Persatuan Pan-Slavia: [FROM.GetNameDef] Menerima"
 NSB_soviet_fascist_tsarist.2.desc: "Kami baru saja menerima kabar dari pemerintah [FROM.GetAdjective]: [FROM.GetNameDef] telah menerima undangan kami untuk menjadi anggota Persatuan Pan-Slavia."
 NSB_soviet_fascist_tsarist.2.a: "Keputusan yang bijaksana."
 NSB_soviet_fascist_tsarist.3.t: "Persatuan Pan-Slavia: [FROM.GetNameDef] Menolak"
 NSB_soviet_fascist_tsarist.3.desc: "Perwakilan dari pemerintah [FROM.GetAdjective] telah memberi tahu kami bahwa mereka dengan tegas menolak segala kemungkinan partisipasi sukarela mereka dalam Persatuan Pan-Slavia kami."
 NSB_soviet_fascist_tsarist.3.a: "Persatuan Pan-Slavia akan menjadi kenyataan - dengan atau tanpa persetujuan mereka."
 NSB_soviet_fascist_tsarist.4.t: "[FROM.GetNameDef] Mempengaruhi Politik kita"
 NSB_soviet_fascist_tsarist.4.desc: "Laporan-laporan yang meresahkan telah sampai kepada kita mengenai [FROM.GetAdjective] agitator yang menyebarkan propaganda fasis di negara kita, serta [FROM.GetAdjective] uang yang menyubsidi aktivitas partai fasis dalam negeri dan pengeluaran politik."
 NSB_soviet_fascist_tsarist.4.a: "Kita harus waspada, jangan sampai kita ditaklukkan tanpa perlawanan."
 NSB_soviet_fascist_tsarist.5.t: "Undangan untuk Bergabung [FROM.GetFactionName]"
 NSB_soviet_fascist_tsarist.5.desc: "Menyadari kesamaan pandangan dunia kita, [FROM.GetNameDef] telah mengundang kita ke [FROM.GetFactionName], menawarkan dukungan militer dan ekonomi saat kita mencari masa depan yang gemilang bagi bangsa kita!"
 NSB_soviet_fascist_tsarist.5.a: "Di bawah kepemimpinan [FROM.GetAdjective] kami lebih kuat."
 NSB_soviet_fascist_tsarist.5.b: "Kita tidak membutuhkan Rusia untuk menjadi kuat!"
 NSB_soviet_fascist_tsarist.6.t: "[FROM.GetNameDef] Bergabung [ROOT.GetFactionName]"
 NSB_soviet_fascist_tsarist.6.desc: "[FROM.GetNameDef] telah menerima tawaran aliansi kami, dan segera bergabung dengan faksi kami!"
 NSB_soviet_fascist_tsarist.6.a: "Mereka sekarang menjadi tempat berpijak kita di Amerika."
 NSB_soviet_fascist_tsarist.7.t: "[FROM.GetNameDef] Menolak Undangan"
 NSB_soviet_fascist_tsarist.7.desc: "Pemerintah [FROM.GetAdjective] telah memberi tahu kami bahwa mereka menolak tawaran aliansi kami. Mereka lebih suka berdiri sendiri di benua Amerika."
 NSB_soviet_fascist_tsarist.7.a: "Bodoh!"
 NSB_soviet_fascist_tsarist.8.desc: "Menyadari bahwa kita sekarang akhirnya memiliki pandangan dunia yang sama, [FROM.GetNameDef] telah mengundang kita ke [FROM.GetFactionName], menawarkan kepada kita dukungan militer dan ekonomi yang berkelanjutan ketika kita mencari masa depan yang gemilang bagi bangsa kita, sama seperti mereka mendukung naiknya partai kita ke tampuk kekuasaan di [ROOT.GetNameDef]!"
 NSB_soviet_fascist_tsarist.9.desc: "[FROM.GetNameDef] akhirnya menjadi kekuatan fasis. Oleh karena itu, mereka telah ditawari, dan telah menerima, keanggotaan dalam aliansi kami."
 NSB_soviet_fascist_tsarist.10.desc: "[FROM.GetNameDef] akhirnya menjadi kekuatan fasis. Namun, meskipun kita telah memberikan bantuan dalam membawa partai fasis mereka ke tampuk kekuasaan, dan menawarkan mereka keanggotaan dalam aliansi kita, mereka menolak undangan kita dan memilih untuk berdiri sendiri."
 NSB_soviet_fascist_tsarist.11.t: "[FROM.GetAdjective] Pembangunan Angkatan Laut"
 NSB_soviet_fascist_tsarist.11.desc: "Kami mendapat laporan bahwa [FROM.GetNameDef] terlihat memperluas infrastruktur angkatan laut mereka secara besar-besaran di Timur Jauh. Hal ini menjadi pertanda buruk bagi status quo di Timur Jauh..."
 NSB_soviet_fascist_tsarist.11.a: "Mereka pasti berupaya menantang hegemoni kita."
 NSB_soviet_fascist_tsarist.12.t: "[FROM.GetAdjective] Propaganda Anti-Jepang"
 NSB_soviet_fascist_tsarist.12.desc: "Surat kabar [FROM.GetAdjective] terlihat semakin banyak mencetak artikel yang kritis terhadap eksploitasi [ROOT.GetAdjective] di Timur Jauh, dan para politisi mereka menggunakan bahasa yang semakin menghasut untuk mencela kita dan mengingatkan [FROM.GetAdjective] atas kekalahan mereka dalam perang tahun 1905. Para agitator yang paling vokal sudah menyerukan untuk \"membalas Tsushima\"!"
 NSB_soviet_fascist_tsarist.12.a: "Sebaiknya kita mempersiapkan perang dengan musuh lama kita..."
 NSB_soviet_fascist_tsarist.13.t: "[FROM.GetAdjective] Pembangunan Kamchatka"
 NSB_soviet_fascist_tsarist.13.desc: "Laporan menunjukkan bahwa [FROM.GetNameDef] sedang dalam proses memperluas infrastruktur militer mereka secara besar-besaran di Kamchatka. Analis militer berpendapat bahwa instalasi ini hanya dimaksudkan untuk meningkatkan proyeksi kekuatan [FROM.GetAdjective] terhadap pasukan kita di Alaska - dan dalam kasus terburuk sebagai batu loncatan untuk melakukan invasi!"
 NSB_soviet_fascist_tsarist.13.a: "Kami sebaiknya mengambil tindakan berdasarkan informasi ini..."
 NSB_soviet_fascist_tsarist.14.t: "Kembalinya Tsar"
 NSB_soviet_fascist_tsarist.14.desc: "Ketidakadilan yang menimpa negara kita beberapa dekade yang lalu, akhirnya, telah teratasi. Dalam sebuah upacara yang megah dan megah di dalam Katedral Dormition, Adipati Agung Vladimir Kirillovich dimahkotai sebagai Tsar Vladimir I, yang disambut dengan kegembiraan yang tak terkendali dari orang banyak.\n\nDari sini, Tsar melakukan tindakan pertamanya dengan memimpin prosesi keluar dari gerbang Kremlin, menyapa massa yang bergembira, dan menghadiri pawai militer yang mengesankan untuk menghormatinya, secara pribadi.\n\nDengan megah Dalam pidatonya, Tsar yang baru memuji kebaikan rakyat Rusia, dan bersumpah untuk sekali lagi memimpin bangsa ini menuju kembali kejayaannya."
 NSB_soviet_fascist_tsarist.14.a: "Mulia!"
 NSB_soviet_fascist_tsarist.15.t: "Penobatan Patriark Meletius"
 NSB_soviet_fascist_tsarist.15.desc: "Karena pentingnya agama semakin dirasakan di seluruh bangsa kita, dan status gereja sekali lagi mencapai - bahkan melampaui - seperti dulu, wajar saja jika kita memperkuat komitmen kita kepada Tuhan dengan mengangkat wakil-Nya yang paling utama ke posisi pemimpin nasional.\n\nHari ini, dalam dua upacara besar di Katedral Penyelamat dan Katedral Dormition di Moskow, Meletius dari Harbin dan Manchuria, dipilih untuk menghormati pengabdiannya pada Pengasingan sebab, keduanya dinobatkan sebagai Patriark Moskow dan Seluruh Rusia, serta dinobatkan sebagai Tsar seluruh Rusia.\n\nDengan penyatuan terakhir dan akhir antara gereja dan negara, tidak ada lagi hambatan yang tersisa bagi pelaksanaan Kehendak Tuhan di teater duniawi ini..."
 NSB_soviet_fascist_tsarist.15.a: "Fiat voluntas tua, sicut di caelo, dan di terra."
 NSB_soviet_fascist_tsarist.16.t: "Entente Tiga"
 NSB_soviet_fascist_tsarist.16.desc: "Setelah keluar dari kekacauan internal mereka untuk membentuk pemerintahan baru yang bersahabat dengan kami, [SOV.GetNameDef] kini telah memberikan tawaran kepada kami untuk mereformasi aliansi lama kami, mencegah agresi [GER.GetAdjective] di Eropa."
 NSB_soviet_fascist_tsarist.16.a: "Ide yang bagus!"
 NSB_soviet_fascist_tsarist.16.b: "Kami belum melupakan betapa berharganya janji mereka terakhir kali."
 NSB_soviet_fascist_tsarist.17.t: "Triple Entente - Penawaran Diterima"
 NSB_soviet_fascist_tsarist.17.desc: "[FROM.GetNameDefCap] memberi tahu kami bahwa mereka menerima tawaran aliansi kami, dan telah segera mengambil langkah untuk memperluas hubungan diplomatik mereka dengan kami."
 NSB_soviet_fascist_tsarist.17.a: "Hal ini akan membuat Jerman khawatir."
 NSB_soviet_fascist_tsarist.18.t: "Triple Entente - Penawaran Ditolak"
 NSB_soviet_fascist_tsarist.18.desc: "[FROM.GetNameDef] telah memberi tahu kami bahwa mereka tidak melihat manfaat apa pun dalam aliansi dengan kami saat ini."
 NSB_soviet_fascist_tsarist.18.a: "Kegagalan diplomasi yang menyedihkan..."
 NSB_soviet_fascist_tsarist.19.desc: "Pemerintah [FROM.GetAdjective] dan [SOV.GetAdjective] telah membuka pembicaraan untuk menciptakan kembali aliansi Triple Entente yang pernah ada di antara kekuatan kita. Mereka kini bermaksud meneruskan rencana ini, dan mengirimkan undangan kepada kami untuk bergabung dengan mereka."
 NSB_soviet_fascist_tsarist.19.a: "Kami setuju, demi stabilitas Eropa di masa depan."
 NSB_soviet_fascist_tsarist.19.b: "Sayangnya \"Triple Entente\" mereka akan menjadi Entente ganda."
 NSB_soviet_fascist_tsarist.20.a: "Bersama-sama kita berdiri terkuat!"
 NSB_soviet_fascist_tsarist.21.a: "Setidaknya kita punya orang Rusia."
 NSB_soviet_fascist_tsarist.22.t: "Poros Berlin-Moskow"
 NSB_soviet_fascist_tsarist.22.desc: "Perwakilan [SOV.GetAdjective] telah menghubungi kami dengan proposal aliansi. Mereka menyarankan bahwa, karena pemerintahan baru mereka dan kita mempunyai pandangan dan kepentingan dunia yang serupa, akan lebih bijaksana jika kita bekerja sama lebih erat dalam bidang ekonomi dan militer."
 NSB_soviet_fascist_tsarist.22.a: "Axis baru inilah yang akan membuat dunia berputar!"
 NSB_soviet_fascist_tsarist.22.b: "Aliansi? Menurut kami tidak."
 NSB_soviet_fascist_tsarist.23.t: "Poros Berlin-Moskow: Proposal Diterima"
 NSB_soviet_fascist_tsarist.23.desc: "Pemerintah [SOV.GetAdjective] memberi tahu kami bahwa mereka dengan senang hati akan berpartisipasi dalam pembentukan Poros diplomatik baru kami. Mereka sudah melakukan persiapan pengiriman penghubung diplomatik dan militer."
 NSB_soviet_fascist_tsarist.24.t: "Poros Berlin-Moskow: Proposal Ditolak"
 NSB_soviet_fascist_tsarist.24.desc: "[SOV.GetAdjective] diplomat hari ini memberi tahu kami tentang penolakan pemerintah mereka terhadap proposal kami."
 NSB_soviet_fascist_tsarist.24.a: "Sangat disayangkan... Tentunya bukan pertanda niat buruk?"
 NSB_soviet_fascist_tsarist.25.t: "Poros Tokyo"
 NSB_soviet_fascist_tsarist.25.desc: "Perwakilan [SOV.GetAdjective] telah mengajukan proposal untuk memasukkan [JAP.GetNameDef] ke dalam aliansi kita. Mengingat sejarah hubungan yang tegang antara [SOV.GetName] dan [JAP.GetName], mereka menyarankan agar kitalah yang harus menghubungi mereka dan menjadi penengah antara kedua kekuatan tersebut."
 NSB_soviet_fascist_tsarist.25.a: "Kami akan segera mengirim utusan."
 NSB_soviet_fascist_tsarist.25.b: "Kami khawatir kepentingan kami tidak sejalan dengan kepentingan Jepang."
 NSB_soviet_fascist_tsarist.26.t: "Poros Tokyo - [JAP.GetName] Diterima"
 NSB_soviet_fascist_tsarist.26.desc: "Kami sekarang telah mendengar kabar dari pemerintah [GER.GetAdjective]: mereka memberi tahu kami bahwa mereka telah melakukan mediasi antara kami dan Jepang, dan Jepang telah menerima proposal tersebut!"
 NSB_soviet_fascist_tsarist.26.a: "Berita bagus - sisi timur kita aman!"
 NSB_soviet_fascist_tsarist.27.t: "Poros Tokyo - [JAP.GetName] Ditolak"
 NSB_soviet_fascist_tsarist.27.desc: "Pemerintah [GER.GetAdjective] memberi tahu kita bahwa, meskipun telah berupaya sebaik-baiknya, Jepang dengan sedih menolak proposal aliansi kita."
 NSB_soviet_fascist_tsarist.27.a: "Sebuah kemunduran besar..."
 NSB_soviet_fascist_tsarist.28.t: "Poros Tokyo - [GER.GetName] Ditolak"
 NSB_soviet_fascist_tsarist.28.desc: "Pemerintah [GER.GetAdjective] telah mempertimbangkan proposal kami untuk keanggotaan Jepang dalam aliansi kami, namun dengan menyesal mereka memberi tahu kami bahwa mereka tidak melihat aliansi tersebut sebagai kepentingan mereka saat ini."
 NSB_soviet_fascist_tsarist.28.a: "Sayang sekali! Mereka pasti punya alasan bagus untuk itu."
 NSB_soviet_fascist_tsarist.29.desc: "[GER.GetAdjective] telah menghubungi kami dengan apa yang mereka katakan sebagai proposal aliansi [SOV.GetAdjective] antara tiga kekuatan kami. Mereka berpendapat bahwa, dengan bersatunya kami bertiga, seluruh dunia tidak bisa melawan kami."
 NSB_soviet_fascist_tsarist.29.a: "Biarkan aliansi ini menjadi kata terakhir dalam diplomasi!"
 NSB_soviet_fascist_tsarist.29.b: "Sejarah memberitahu kita tentang nasib tiga serangkai... Kami menolak."
 NSB_soviet_fascist_tsarist.30.desc: "[JAP.GetName] memberi tahu kami bahwa mereka telah memilih untuk menerima proposal [SOV.GetAdjective], dan siap untuk bergabung dengan aliansi kami sesegera mungkin."
 NSB_soviet_fascist_tsarist.30.a: "Mulia!"
 NSB_soviet_fascist_tsarist.31.desc: "[JAP.GetName] dengan menyesal memberi tahu kami bahwa mereka yakin proposal [SOV.GetAdjective] saat ini tidak sesuai dengan kepentingan terbaik mereka, sehingga terpaksa menolaknya."
 NSB_soviet_fascist_tsarist.31.a: "Kami akan berhasil tanpa mereka."
 NSB_soviet_fascist_tsarist.32.t: "Vlasov Ditangkap"
 NSB_soviet_fascist_tsarist.32.desc: "Saat musuh mundur baru-baru ini, seorang jenderal [SOV.GetAdjective] berpangkat tinggi telah ditangkap oleh pasukan kami. Dalam tahanan kami, jenderal ini, Andrey Vlasov, telah menyatakan sikapnya yang \"anti-Bolshevisme\" dan sekarang mengusulkan untuk membentuk beberapa divisi dari orang-orang Rusia yang ditangkap untuk berperang bersama kami melawan \"Stalinisme\"."
 NSB_soviet_fascist_tsarist.32.a: "Setiap sekutu yang menentang Bolshevisme diterima."
 NSB_soviet_fascist_tsarist.32.b: "Kita tidak bisa mempercayainya!"
 NSB_soviet_fascist_tsarist.33.desc: "Kami telah menerima kabar bahwa jenderal kami [SOV_andrey_vlasov.GetName] telah ditangkap oleh pasukan musuh. Kita hanya bisa menebak nasibnya..."
 NSB_soviet_fascist_tsarist.33.a: "Sayangnya, ada hal yang lebih besar yang perlu kita khawatirkan saat ini!"
 nsb_news.301.t: "Republik Pegunungan Bersatu"
 nsb_news.301.d: "Dalam semangat Tapa Tchermoeff, Republik Pegunungan sekali lagi bersatu di bawah kepemimpinan [FROM.GetLeader]. Mereka menyatakan bahwa mereka akan melawan setiap penjajah asing yang memasuki wilayah Kaukasia Utara, dan bahwa mereka akan mencatatkan tempat mereka dalam catatan sejarah. Dan dengan demikian, lahirlah Republik Pegunungan Kaukasus Utara!"
 nsb_news.301.a: "Kita tidak lagi terpecah belah!"
 nsb_news.301.b: "Menarik"
 nsb_news.302.t: "Transcaucasia Bersatu Lagi"
 nsb_news.302.d: "Pertama kali terjadi pada awal Perang Saudara Rusia yang dengan cepat berantakan. Kedua kalinya sebagai Republik Soviet, yang terpecah setelah Konstitusi Soviet tahun 1936. Kini untuk ketiga kalinya, [FROM.GetLeader] berupaya menyatukan kembali negara-negara Transkaukasia, dan sekali lagi mereka siap untuk tidak hanya mempertahankan wilayahnya, tetapi juga memperluas ke wilayah lain. Hanya waktu yang dapat menentukan apa yang akan mereka lakukan."
 nsb_news.302.a: "Ketiga kalinya Mantra"
 nsb_news.302.b: "Lagi?"
 nsb_news.303.t: "Siberia Bersatu"
 nsb_news.303.d: "Setelah berabad-abad berada di bawah kekuasaan Rusia, Siberia kini bukan hanya sebuah wilayah yang dikuasai kekuatan asing, namun juga sebuah entitas politik yang bersatu dan siap memperjuangkan hak-haknya dengan cara apa pun. Rakyat Siberia bersukacita, karena zaman Imperialisme sudah tidak ada lagi, karena mereka bisa hidup dalam negara merdeka, tanpa campur tangan pihak asing. Namun Republik telah menyatakan bahwa mereka tidak akan tinggal diam, karena ada lebih banyak orang di Siberia yang perlu dilindungi dan dibebaskan, apa pun risikonya!"
 nsb_news.303.a: "Akhirnya Siberia terbebas dari kendali Imperialisme!"
 nsb_news.303.b: "Cengkeraman Rusia di Timur Berkurang..."
 nsb_news.304.t: "Idel-Ural Kembali"
 nsb_news.304.d: "Untuk pertama kalinya sejak Perang Saudara Rusia, negara-negara di wilayah Volga Ural bersatu kembali menjadi negara yang mereka sebut Idel-Ural. Kali ini, mereka menyatakan bahwa mereka tidak akan digagalkan oleh Rusia, dan bahwa mereka akan mempertahankan kemerdekaan mereka dengan cara apa pun. Hanya masa depan yang akan menentukan apakah negara ini ditakdirkan untuk bertahan atau tidak..."
 nsb_news.304.a: "Kali ini akan tetap bersama!"
 nsb_news.304.b: "Jadi uh, dimana itu lagi?"
 nsb_news.400.t: "Penobatan Vladimir III"
 nsb_news.400.desc: "Setelah hampir tiga dekade diperintah oleh kaum Bolshevik, [SOV.GetName] hari ini menyaksikan kembalinya Kerajaan Tsar dengan penobatan Tsar Vladimir III dalam sebuah upacara akbar di Katedral Dormition di Moskow. Setelah prosesi kerajaan melewati kerumunan orang, Tsar yang baru berbicara kepada orang-orang yang datang untuk menyaksikannya, memuji semangat rakyat Rusia dan bersumpah untuk 'mengembalikan bangsa ke kejayaannya semula'."
 nsb_news.400.a: "Sebuah peristiwa yang luar biasa!"
 nsb_news.400.b: "Penghasut perang!"
 nsb_news.400.c: "Sebuah parodi!"
 nsb_news.401.t: "Zemsky Sobor Dibongkar"
 nsb_news.401.desc: "Kurang dari beberapa bulan setelah melegitimasi pemerintahan mereka melalui kembalinya Zemsky Sobor, elemen fasis di pemerintahan [SOV.GetAdjective] telah membubarkan parlemen baru dan menempatkan negara di bawah kendali [SOV.GetLeader]. Sampai saat ini, Tsar yang baru dinobatkan masih memainkan peran figuran, namun jelas bahwa hanya ada sedikit kekuasaan nyata yang tersisa padanya.\n\nSetelah pergantian rezim, retorika nasionalis telah meningkat secara signifikan, dengan pidato-pidato yang memuji persaudaraan 'masyarakat Slavia' serta mengecam 'pelanggaran' masa lalu yang dilakukan oleh negara-negara tetangga."
 nsb_news.401.a: "Bangsa kita yang mulia membutuhkan pemimpin yang kuat!"
 nsb_news.401.b: "Apakah hal ini memperbaiki situasi masih harus dilihat."
 nsb_news.401.c: "Sekutu baru bangkit?"
 nsb_news.402.t: "Poros Berlin-Moskow"
 nsb_news.402.desc: "Dalam pernyataan bersama hari ini, juru bicara [GER.GetNameDef] dan [SOV.GetNameDef] mengumumkan pembentukan 'Poros Berlin-Moskow'. Kedua kekuatan tersebut akan bekerja sama secara ekonomi, politik, dan militer untuk 'menjaga kepentingan mereka', dengan menyatakan bahwa mereka mengutamakan 'stabilitas Eropa Timur dan Tengah'.\n\nApakah hal ini mencerminkan motivasi mereka yang sebenarnya masih harus dilihat."
 nsb_news.402.a: "Aliansi kita yang mulia bangkit!"
 nsb_news.402.b: "Sebuah ide bagus dari sekutu baru kita di Timur."
 nsb_news.402.c: "Apakah mereka sedang membentuk Tatanan Dunia Baru?"
 nsb_news.402.d: "Mereka sekarang menguasai Eropa sesuai keinginan mereka..."
 nsb_news.403.t: "[SOV.GetAdjective] Campur tangan di Amerika"
 nsb_news.403.desc: "Bukti-bukti telah muncul mengenai campur tangan [SOV.GetAdjective] yang meluas dalam urusan politik dalam negeri di banyak negara di Amerika Selatan dan Tengah. Melalui pendanaan organisasi-organisasi politik berhaluan kanan dan kelompok paramiliter, suap, bujukan, dan penyebaran informasi yang salah, stabilitas internal negara-negara ini menjadi semakin berbahaya.\n\nJika aktivitas [SOV.GetAdjective] rahasia ini tidak dihentikan, para ahli sepakat bahwa tidak dapat dihindari bahwa setidaknya beberapa dari negara-negara ini akan menjadi pijakan ideologis bagi [SOV.GetName] di Amerika. Kemungkinan besar dukungan [SOV.GetAdjective] untuk negara-negara ini akan meningkat dan menjadi lebih terbuka jika hal ini terjadi."
 nsb_news.403.a: "Sayangnya keterlibatan kami terungkap."
 nsb_news.403.b: "Mereka ikut campur di depan pintu kita?!"
 nsb_news.403.c: "Mereka akan segera melihat keuntungan dari kepemimpinan yang kuat."
 nsb_news.403.d: "Penyebaran fasisme sudah di luar kendali!"
 nsb_news.404.t: "Kebangkitan Roma Ketiga"
 nsb_news.404.desc: "Sejak perang saudara terbaru melanda negara itu, Gereja Ortodoks di Rusia terus memperoleh kekuasaan. Sekarang, setelah penaklukan mereka atas Byzantium lama selesai, mereka telah mengambil langkah terakhir menuju penyatuan penuh gereja dan negara.\n\nSetelah penobatan ganda sebagai Patriark Tertinggi dan penobatan sebagai Tsar seluruh Rusia, [SOV.GetLeader] kini memimpin negara yang diberi nama '[SOV.GetNameDef]' dalam mengejar apa yang disebutnya 'kehendak Tuhan'."
 nsb_news.404.a: "Luar biasa!"
 nsb_news.404.b: "Mereka tidak mungkin serius!"
 nsb_news.405.t: "[SOV.GetNameDefCap]"
 nsb_news.405.desc: "Setelah sekali lagi mengambil peran sebagai 'Pembela Seluruh Bangsa Slavia', Rusia telah memutuskan bahwa cara terbaik untuk melakukan hal tersebut adalah dengan mengikutsertakan seluruh masyarakat Slavia dalam satu negara.\n\nDengan akhirnya penyatuan tersebut tercapai, [SOV.GetLeader] kini telah mengumumkan pembentukan [SOV.GetNameDef], dan bersumpah bahwa \"semua sumber daya yang tersedia bagi negara baru ini akan digunakan untuk memberi manfaat bagi rakyatnya, dan melindunginya dari ancaman luar.\""
 nsb_news.405.a: "Bersatu, Slavia tidak bisa dikalahkan!"
 nsb_news.405.b: "Sebuah kekuatan yang harus diperhitungkan."
 nsb_news.406.t: "Pembela Slavia"
 nsb_news.406.desc: "Sekali lagi, [SOV.GetNameDef] mengambil peran sebagai \"Pembela Slavia\", memberikan jaminan kepada bangsa Slavia lainnya di Eropa. Dalam sebuah pernyataan, [SOV.GetLeader] telah berjanji bahwa \"semua sumber daya yang tersedia untuk [SOV.GetNameDef] akan dimanfaatkan demi kepentingan semua masyarakat Slavia, dan melindungi mereka dari ancaman luar.\"
 nsb_news.406.a: "Kita menepati janji kita kepada saudara-saudara kita."
 nsb_news.406.b: "Selama mereka menghormati kemerdekaan kita..."
 nsb_news.406.c: "Kakak Slavia telah kembali..."
 nsb_news.407.t: "Entente Tiga?"
 nsb_news.407.desc: "[From.GetNameDefCap] dan [SOV.GetNameDef] telah mengumumkan pembaruan kerja sama militer, tiga dekade setelah berakhirnya Triple Entente yang lama.\n\nMeskipun tidak dinyatakan secara terbuka, kemungkinan besar aliansi baru ini terbentuk dalam upaya untuk mengekang perluasan kekuatan tertentu di Eropa Tengah. Apakah aliansi ini akan terus berkembang masih harus dilihat."
 nsb_news.407.a: "Sebuah langkah menuju Eropa yang stabil."
 nsb_news.407.b: "Peninggalan dari masa lalu..."
 nsb_news.408.t: "Entente Tiga"
 nsb_news.408.desc: "[From.GetNameDefCap] kini telah mengumumkan keputusannya untuk bergabung dengan bekas sekutunya dalam Triple Entente yang diperbarui – yang ditujukan untuk melawan kekuatan ekspansionis di Eropa Tengah."
 nsb_news.408.a: "Kami berdiri bersama sekali lagi."
 nsb_news.408.b: "Mari kita lihat berapa lama hingga patah."
 nsb_news.409.t: "Poros Berlin-Moskow: Tokyo Bergabung"
 nsb_news.409.desc: "Dalam pernyataan trilateral pemerintah [GER.GetNameDef], [SOV.GetNameDef], dan [JAP.GetNameDef] telah mengumumkan bahwa [JAP.GetNameDef] akan menjadi anggota aliansi Poros berikutnya.\n\nMeskipun tidak terduga mengingat ketegangan baru-baru ini antara pemerintah [SOV.GetAdjective] dan [JAP.GetNameDef] (dan kemungkinan besar merupakan akibat dari banyak konflik [GER.GetAdjective]), perkembangan baru ini pada dasarnya akan mengamankan sisi timur [SOV.GetAdjective], sekaligus memungkinkan [JAP.GetNameDef] memusatkan perhatian mereka di Pasifik."
 nsb_news.409.a: "Sebuah langkah diplomatik yang kuat."
 nsb_news.409.b: "Perkembangan yang tidak terduga!"
