 generic_operation_1: "Kontinjensi 1"
 generic_operation_2: "Kontingensi 2"
 generic_operation_3: "Kontingensi 3"
 generic_operation_4: "Kontingensi 4"
 nsb_coup.2.t: "Upaya Kudeta Gagal"
 nsb_coup.2.desc: "Setelah perencanaan berminggu-minggu, tadi malam sekelompok petugas memerintahkan eksekusi [Root.GetOperationName], sebuah rencana untuk merebut kendali pemerintah.\n\nTampaknya mereka harus melaksanakan rencana mereka sebelum waktunya, karena operasi mereka terkesan terburu-buru dan tidak terkoordinasi dengan baik. Tampaknya tidak menyadari perubahan jadwal penjagaan, sekelompok tentara yang setia pada kudeta muncul di kantor [Root.GetLeader] dengan perintah untuk menangkap atau membunuh - tepat ketika penjaga sedang dilonggarkan, sehingga menghadapi penjagaan dua kali lipat dari yang mereka harapkan. Baku tembak berikutnya berlangsung singkat dan brutal, menyebabkan beberapa tentara di kedua sisi tewas atau terluka sementara [Root.GetLeader] berhasil melarikan diri.\n\n[Root.GetLeader] sejak itu muncul di depan umum dan juga di radio, menunjukkan bahwa upaya pembunuhan tersebut tidak berhasil. Dengan runtuhnya kudeta, sejumlah perwira di militer kita melakukan bunuh diri untuk menghindari penangkapan atau memutuskan untuk berperang ketika unit dikirim untuk menangkap mereka, sementara komandan berbagai garnisun telah berjanji setia kepada [Root.GetLeader]."
 nsb_coup.2.a: "Dan orang-orang ini ingin menjalankan negara?"
 nsb_coup.3.t: "Petugas Mencoba Kudeta"
 nsb_coup.3.desc: "Setelah perencanaan berminggu-minggu, tadi malam sekelompok petugas memerintahkan eksekusi [Root.GetOperationName], sebuah rencana untuk merebut kendali pemerintah.\n\nTampaknya mereka harus melaksanakan rencana mereka sebelum waktunya, dan kejadian-kejadian dengan cepat menjadi tidak terkendali. Upaya untuk menangkap atau membunuh [Root.GetLeader] juga gagal, dan jaringan penghalang jalan di sekitar ibu kota belum ditutup ketika banyak pejabat pemerintah melarikan diri.\n\nPemerintah [Root.GetNameDef] masih bisa berperang di lain hari, dan [Root.GetLeader] telah berjanji untuk membawa para pengkhianat ke pengadilan - dengan cara apa pun yang diperlukan."
 nsb_coup.3.a: "Kami akan menghancurkan pemberontakan ini!"
 LAT_events.2.t: "[From.GetNameDefCap] Menuntut [Root.GetAdjective] Aneksasi"
 LAT_events.2.d: "Mengutip meningkatnya tekanan di Baltik, [From.GetLeader] telah menyatakan bahwa penyatuan Baltik adalah kebutuhan mutlak untuk kelangsungan hidup ketiga negara tersebut. Namun, tuntutan Menteri Luar Negeri [From.GetNameDef] tidak hanya akan mendorong [Root.GetLeader] keluar dari jabatannya, tetapi pada dasarnya akan membuat seluruh partai [Root.GetRulingParty] sepenuhnya tunduk pada pemerintahan [From.GetLeader] dan [From.GetLeader.GetHerHis]."
 LAT_events.2.a: "Apakah kita punya pilihan?"
 LAT_events.2.b: "Sama sekali tidak!"
 LAT_events.3.t: "[From.GetNameDefCap] Mendukung [Root.GetAdjective] Nasionalisme"
 LAT_events.3.d: "Dalam pidatonya yang menggugah mengenai sifat solidaritas Baltik, [From.GetLeader] memuji [Root.GetLeader] atas komitmen [Root.GetLeader.GetHerHis] terhadap nasionalisme dalam menghadapi meningkatnya ancaman Bolshevik. Meskipun [From.Getleader.GetSheHe] mengklaim menghormati identitas individu [From.GetAdjective] dan [Root.GetAdjective], [From.Getleader.GetSheHe] telah menyerukan kerja sama antara [From.GetNonIdeologyName] dan [Root.GetNonIdeologyName] dalam tujuan bersama untuk mempertahankan independensi mereka. Meskipun hal ini tidak berarti apa-apa saat ini, banyak yang berspekulasi bahwa proposal aliansi akan segera terwujud."
 LAT_events.3.a: "Menarik."
 LAT_events.5.t: "[From.GetLeader] Mengupayakan Unifikasi Ostlandia"
 LAT_events.5.d: "Dengan Belarus Barat yang kini berada di bawah kendali [Root.GetFactionName], diktator [From.GetNonIdeologyName] telah mengumumkan minatnya untuk mendirikan zona pendudukan Ostland di bawah pemerintahan [From.GetAdjective]. Alasan dibalik usulan tersebut adalah untuk mempromosikan ideologi fasis di seluruh Baltik dan Belarus, dan memajukan kepentingan [Root.GetFactionName] di Timur."
 LAT_events.5.a: "Terinspirasi!"
 LAT_events.5.b: "Tidak."
 LAT_events.501.t: "[From.GetNameDefCap] Menyerahkan Ostland"
 LAT_events.501.d: "Penyerahan wilayah Ostland ke tangan [Root.GetAdjective] berhasil, dan [From.GetNameDef] telah menyetujui bahwa pendudukan negara-negara Baltik dan Belarus bagian barat harus menjadi satu-satunya kekuasaan [Root.GetNameDef]."
 LAT_events.501.a: "Luar biasa!"
 LAT_events.502.t: "[From.GetNameDefCap] Menolak"
 LAT_events.502.d: "Permintaan [Root.GetAdjective] untuk menguasai pendudukan Ostlandia ditanggapi dengan penolakan langsung dari [From.GetNameDef]. Upaya untuk mengambil kendali atas pendudukan Ostland telah diabaikan sebagai upaya atas nama [Root.GetLeader] untuk mengendalikan pusat-pusat populasi utama di Timur, dan melemahkan [From.GetNameDef]."
 LAT_events.502.a: "Hari yang menyedihkan bagi Latvia."
 LAT_events.6.t_both: "[From.GetNameDefCap] Meminta Masuknya Baltik ke [Root.GetFactionName]"
 LAT_events.6.d_both: "[From.GetNameDefCap] hari ini telah meminta untuk menyampaikan undangan ke [Root.GetFactionName] untuk semua negara bagian Baltik. Mengutip keberhasilan nasionalisme yang luar biasa di [LIT.GetNameDef] dan [EST.GetNameDef] serta keinginan bawaan untuk kerja sama Baltik, [From.GetLeader] telah membuat proposal yang penuh semangat agar pemerintah [Root.GetAdjective] mempertimbangkan [LIT.GetLeader] dan [EST.GetLeader] sebagai sekutu perjuangan nasionalis."
 LAT_events.6.t_estonia: "[From.GetNameDefCap] Permintaan [EST.GetAdjective] Masuk ke [Root.GetFactionName]"
 LAT_events.6.d_estonia: "[From.GetNameDefCap] hari ini telah meminta untuk menyampaikan undangan ke [Root.GetFactionName] untuk [EST.GetNonIdeologyName]. Mengutip keberhasilan nasionalisme yang luar biasa di [EST.GetNameDef] serta keinginan bawaan untuk kerja sama Baltik, [From.GetLeader] telah membuat proposal yang penuh semangat agar pemerintah [Root.GetAdjective] menganggap [EST.GetLeader] sebagai sekutu perjuangan nasionalis."
 LAT_events.6.t_lithuania: "[From.GetNameDefCap] Permintaan [LIT.GetAdjective] Masuk ke [Root.GetFactionName]"
 LAT_events.6.d_lithuania: "[From.GetNameDefCap] hari ini telah meminta untuk menyampaikan undangan ke [Root.GetFactionName] untuk [LIT.GetNonIdeologyName]. Mengutip keberhasilan nasionalisme yang luar biasa di [LIT.GetNameDef] serta keinginan bawaan untuk kerja sama Baltik, [From.GetLeader] telah membuat proposal yang penuh semangat agar pemerintah [Root.GetAdjective] menganggap [LIT.GetLeader] sebagai sekutu perjuangan nasionalis."
 LAT_events.6.a: "Ide yang bagus!"
 LAT_events.6.b: "Omong kosong."
 LAT_events.601.t: "[From.GetNameDefCap] Menolak Masuknya Baltik ke [From.GetFactionName]"
 LAT_events.601.d: "Meskipun [Root.GetNameDef] telah diterima di [From.GetFactionName] dengan tangan terbuka, tampaknya [From.GetLeader] tidak menaruh belas kasihan di hati [From.GetLeader.GetHerHis] terhadap hak saudara-saudara kita di Baltik untuk membela diri. Undangan kami kepada sesama warga Baltik telah ditolak dan tampaknya negara kami akan tetap terpisah untuk saat ini."
 LAT_events.601.a: "Oh baiklah."
 LAT_events.7.t: "[Root.GetFascistParty] Berbaris di [Root.Capital.GetName]!"
 LAT_events.7.d: "Menerima dukungan besar dari pemerintah fasis [From.GetNameDef], para pendukung [Root.GetFascistParty] berkumpul di jalan-jalan [Root.Capital.GetName] dengan niat kekerasan. Para perusuh akhirnya mencapai gedung parlemen [Root.Capital.GetName] selama sesi yang diadakan oleh [Root.GetLeader] dan beberapa anggota penting Partai [Root.GetRulingParty], meneriakkan pengunduran diri [Root.GetLeader]."
 LAT_events.7.a: "Bubarkan rakyat jelata ini!"
 LAT_events.7.b: "Mungkin [Root.GetLeader] harus mengundurkan diri."
 EST_events.1.t: "[From.GetNameDefCap] Mencari Perjanjian Persahabatan"
 EST_events.1.d: "Takut akan invasi [SOV.GetAdjective], [From.GetLeader] telah mengeluarkan permintaan resmi untuk perjanjian antara [Root.GetNameDef] dan [From.GetNameDef]. Perjanjian tersebut akan mencakup jaminan non-agresi serta sejumlah pengaturan ramah yang dimaksudkan untuk membangun kerja sama antara [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName]."
 EST_events.1.a: "Saran yang bagus."
 EST_events.1.b: "Kami punya rencana lain untuk [From.GetNameDef]."
 EST_events.101.t: "[From.GetNameDefCap] Setuju"
 EST_events.101.d: "[From.GetLeader] dengan jelas melihat nilai dari potensi aliansi di masa depan antara [Root.GetNameDef] dan [From.GetNameDef] dan telah setuju untuk menjalin hubungan baik dengan negara kita."
 EST_events.101.a: "Luar biasa."
 EST_events.102.t: "[From.GetNameDefCap] Menolak"
 EST_events.102.d: "Terlepas dari upaya terbaik [Root.GetLeader], tampaknya [From.GetNameDef] tetap menjadi musuh bagi [Root.GetNonIdeologyName]. Meskipun penolakan mereka tidak berarti apa-apa, hal ini mungkin berarti bahwa jika terjadi invasi [SOV.GetAdjective], [From.GetNameDef] tidak akan berbuat apa-apa selain hanya berjaga-jaga."
 EST_events.102.a: "Sial."
 EST_events.2.t: "[From.GetNameDefCap] Mengupayakan Unifikasi"
 EST_events.2.d: "[From.GetLeader] hari ini telah mengajukan usulan untuk penyatuan [From.GetNameDef] dan [Root.GetNameDef]. Tidak dapat disangkal bahwa pemerintahan [From.GetAdjective] dan [Root.GetNameDef] merupakan satu kesatuan yang tidak dapat dipisahkan. Tanpa Vaps, [Root.GetFascistParty] hampir tidak mungkin mengambil alih [Root.GetNonIdeologyName], dan bahkan sekarang, simpati Vapsid tetap kuat di militer kita. [From.GetLeader] mengklaim bahwa persatuan Finlandia dan Estonia akan lebih memperlengkapi negara kita untuk bertahan melawan invasi [SOV.GetAdjective] yang akan datang."
 EST_events.2.a: "Kami tidak punya pilihan."
 EST_events.2.b: "Segera usir Vap!"
 EST_events.201.t: "[From.GetNameDefCap] Menerima Unifikasi"
 EST_events.201.d: "[From.GetLeader] telah mengambil keputusan bijak untuk memungkinkan penyatuan kedua negara kita. [From.GetLeader] telah mengundurkan diri sebagai kepala pemerintahan [From.GetAdjective] dan digantikan oleh [Root.GetLeader] dan mengambil peran lebih sebagai wakil dalam pemerintahan [Root.GetAdjective]-[From.GetAdjective] yang baru bersatu."
 EST_events.201.a: "Luar biasa!"
 EST_events.202.t: "[From.GetNameDefCap] Menolak [Root.GetAdjective] Unifikasi"
 EST_events.202.d: "Terlepas dari pengaruh besar yang dimiliki pemerintahan Vapsid [Root.GetNonIdeologyName] terhadap [From.GetNameDef], [From.GetLeader] telah menolak upaya [Root.GetAdjective] untuk unifikasi."
 EST_events.202.a: "Tidak lama!"
 EST_events.4.t: "[From.GetNameDefCap] Mencari Penyatuan Baltik"
 EST_events.4.d: "Negara-negara Baltik sering kali mengalami penindasan di bawah kekuasaan asing; Polandia, Jerman, Rusia, tapi [From.GetLeader] tidak lagi menyatakan hal ini! Meskipun nilai-nilai nasionalisme dan penentuan nasib sendiri berkobar di hati semua bangsa Baltik, [From.GetLeader] membuat klaim yang meyakinkan bahwa sejarah pemerintahan asing kita dapat disebabkan oleh kurangnya persatuan, dan juga rasa haus akan kemerdekaan, meningkatnya ancaman invasi [SOV.GetAdjective] memerlukan bentuk pan-nasionalisme yang harus diadopsi oleh pemerintah kita.\n\n[From.GetLeader.GetSheHeCap] mengusulkan sebuah [BAL_UNIFIED_fascism] agar rakyat kita tetap aman dan kuat menghadapi pihak asing yang berani memperbudak kita."
 EST_events.4.a: "Mungkin kita lebih mirip daripada berbeda."
 EST_events.4.b: "Identitas Pan-Baltik? Tidak ada hal seperti itu!"
 EST_events.401.t: "[From.GetNameDefCap] Menerima!"
 EST_events.401.d: "[From.GetLeader] telah berhasil dibujuk oleh upaya [Root.GetAdjective] untuk menanamkan identitas nasional pan-Baltik dan telah setuju untuk menggabungkan Partai [From.GetFascistParty] dengan [Root.GetFascistParty]. Kemenangan telak dalam tujuan [Root.GetLeader] untuk menyatukan Baltik, [Root.GetNameDef] pasti akan berada dalam posisi yang jauh lebih baik untuk mempertahankan diri dari invasi [SOV.GetAdjective]."
 EST_events.401.a: "[From.GetNonIdeologyName] hanyalah permulaan."
 EST_events.402.t: "[From.GetNameDefCap] Menolak Unifikasi"
 EST_events.402.d: "Tidak terpengaruh oleh retorika [Root.GetLeader] tentang solidaritas Baltik, [From.GetNameDef] telah menolak untuk bersatu dengan [Root.GetNameDef] percaya bahwa penyatuan kita tidak lebih dari tindakan imperialisme yang dimaksudkan untuk menghalangi hak rakyat [From.GetAdjective] atas [From.GetNonIdeologyName] untuk [From.GetNonIdeologyAdjective]s."
 EST_events.402.a: "Apakah mereka lebih suka bergabung dengan [SOV.GetAdjective]s? Pengkhianat!"
 EST_events.5.t: "[From.GetNameDefCap] Pelanggaran terhadap [Root.GetAdjective] Kemerdekaan"
 EST_events.5.d: "[From.GetLeader] hari ini mengumumkan serangan langsung terhadap pemerintah [Root.GetAdjective], mengklaim bahwa pemerintah tersebut lemah dan tidak efektif dalam membela rakyatnya sendiri dari imperialis asing. Meskipun hal ini tidak berarti apa-apa saat ini, kita dapat mengantisipasi bahwa invasi [From.GetAdjective] akan segera terjadi."
 EST_events.5.a: "[From.GetLeader] hanyalah sebuah pukulan keras."
 EST_events.6.t: "[From.GetNameDefCap] Permintaan [FIN.GetAdjective] Masuk ke [Root.GetFactionName]"
 EST_events.6.d: "[From.GetNameDefCap] hari ini telah meminta untuk menyampaikan undangan ke [Root.GetFactionName] untuk [FIN.GetNonIdeologyName]. Mengutip keberhasilan nasionalisme yang luar biasa di negara mereka dan keinginan bawaan untuk kerja sama Finno-Estonia, [From.GetLeader] telah membuat proposal yang penuh semangat agar pemerintah [Root.GetAdjective] menganggap [FIN.GetLeader] sebagai sekutu perjuangan nasionalis."
 EST_events.6.a: "Ide yang bagus!"
 EST_events.6.b: "Omong kosong."
 EST_events.601.t: "[From.GetNameDefCap] Menolak [FIN.GetAdjective] Masuk ke [From.GetFactionName]"
 EST_events.601.d: "Meskipun [Root.GetNameDef] telah diterima di [From.GetFactionName] dengan tangan terbuka, nampaknya [From.GetLeader] tidak menaruh belas kasihan di hati [From.GetLeader.GetHerHis] terhadap hak [FIN.GetNameDef] untuk membela diri. Undangan kami ke Kepulauan Fins telah ditolak dan tampaknya negara kami akan tetap terpisah untuk saat ini."
 EST_events.601.a: "Apakah [From.GetLeader] gila atau tidak kompeten?"
 EST_events.7.t: "Perang Saudara Vapsid"
 EST_events.7.d: "Pawai dan demonstrasi yang terus-menerus di seluruh kota akhirnya memecah persatuan kecil yang masih ada di [Root.GetNonIdeologyName] dan negara ini telah terpecah menjadi perang saudara habis-habisan. Apa yang dimaksudkan sebagai tindakan keras pemerintah yang sepele terhadap kelompok [Root.GetFascistParty] berubah menjadi bentrokan keras dengan pengunjuk rasa kemarin, dengan para veteran bentrok dengan anggota tentara [Root.GetAdjective] yang pernah mereka perjuangkan. Dengan anggota [Root.GetFascistParty] di satu sisi dan loyalis pemerintah di sisi lain, yang masih harus dilihat hanyalah siapa yang akan duduk di [Root.Capital.GetName] pada akhir hari; [Root.GetLeader] atau [neutral_EST_civil_war.GetLeader]..."
 EST_events.7.a: "Untuk [Root.GetNonIdeologyName]!"
 EST_events.9.b: "Mungkin yang terbaik adalah kita pasrah saja..."
 EST_events.701.t: "[Root.GetLeader] Mundur"
 EST_events.701.d: "Pawai di seluruh negeri yang dilakukan oleh para demonstran Vapsid hari ini telah mencapai titik didih karena bentrokan antara perwakilan pemerintah [Root.GetLeader] dan Vaps berakhir dengan kekerasan. Mendengar suara Artur Sirk, para pengunjuk rasa mendobrak gerbang Riigikogu dan dengan cepat memasang barikade darurat, mencegah penegak hukum memasuki gedung\nBanyak warga Estonia mengira [Root.GetLeader] akan membalas para pengunjuk rasa dengan kekerasan, namun yang mengejutkan negara ini, gedung Riigikogu hari ini menerima surat pengunduran diri [Root.GetLeader], yang menyerahkan posisinya sebagai diktator kepada Artur Pak."
 EST_events.701.a: "Estonia berdiri lebih kuat."
 EST_events.801.t: "Pawai yang kacau di [?ROOT.vaps_from.GetName]"
 EST_events.801.d: "Demonstrasi [Root.GetFascistParty] di [?ROOT.vaps_from.GetName] mendapat tanggapan beragam dari masyarakat dan reaksi keras dari otoritas setempat. Hanya sedikit di antara massa yang mampu mengetahui apa maksud unjuk rasa tersebut, dan kekerasan antara pengunjuk rasa dan kontra-pengunjuk rasa menjadi pusat perhatian dalam demonstrasi tersebut. Pemerintah [Root.GetAdjective] sudah berupaya untuk memberantas [Root.GetFascistParty], dan kejadian hari ini kemungkinan besar mempercepat proses tersebut namun tidak berbuat banyak untuk memenangkan hati massa."
 EST_events.801.a: "Ini adalah bencana."
 EST_events.801.b: "Kita harus segera menumpas para pemberontak ini!"
 FIN_putting_down_insurgents_tt: "Negara tidak akan setia kepada §YPemberontak Vapsid§!"
 EST_events.802.t: "Pawai di [?ROOT.vaps_from.GetName]"
 EST_events.802.d: "Pawai [Root.GetFascistParty] melintasi [?ROOT.vaps_from.GetName] berlangsung relatif tanpa insiden. Dengan menghindari pusat-pusat populasi yang besar dan lebih berfokus pada daerah pedesaan di [?ROOT.vaps_from.GetName], [Root.GetFascistParty] mampu menunjukkan kepada masyarakat [Root.GetName] apa yang diperjuangkan gerakan ini sambil menghindari retribusi dari pejabat [Root.GetAdjective]."
 EST_events.802.a: "Menarik."
 EST_events.803.t: "Pawai Fasis yang Luar Biasa di [?ROOT.vaps_from.GetName]"
 EST_events.803.d: "Di seluruh negara bagian [?ROOT.vaps_from.GetName], [Root.GetFascistParty] demonstran berbondong-bondong turun ke jalan untuk menunjukkan dukungan mereka terhadap negara nasionalis yang kuat. Meskipun para pejabat berusaha mencegah para demonstran bergerak ke pusat-pusat pemukiman besar, para petugas ini meletakkan senjata mereka dan membiarkan para anggota [Root.GetFascistParty] berbaris dengan damai di jalan-jalan. Tanpa adanya pengunjuk rasa tandingan yang besar, ini merupakan kemenangan besar bagi gerakan [Root.GetFascistParty]."
 EST_events.803.a: "Sangat menarik."
 EST_events.901.t: "[?FIN.EST_previous_finnish_leader.GetName] Mundur"
 EST_events.901.d: "Anehnya, ketika pasukan [FROM.GetFascistParty] maju ke ibu kota [From.GetAdjective] hari ini, alih-alih memicu perang saudara seperti yang diharapkan, pemerintahan [From.GetAdjective] sebelumnya menyatakan bahwa mereka akan menyerahkan kekuasaannya dan turun tahta ke otoritas partai [FROM.GetFascistParty]."
 EST_events.901.a: "Ya, itu tidak terduga!"
 EST_events.10.t: "Pertanyaan tentang Intervensi"
 EST_events.10.d: "Perang saudara telah dimulai pada [FIN.GetNonIdeologyName], namun pertanyaannya tetap apa peran [Root.GetNameDef] dalam konflik ini. Saat ini, kerja sama Vapsid dengan fasis [FIN.GetNonIdeologyAdjective] hanyalah untuk mempersenjatai dan mengorganisir mereka untuk merebut kekuasaan bagi diri mereka sendiri, namun sama seperti mereka berjuang untuk mengamankan kemerdekaan [EST.GetAdjective] di masa lalu, mungkin [Root.GetLeader] akan melihat ini sebagai peluang untuk membayar hutang [EST.GetNonIdeologyName] kepada Fins."
 EST_events.10.a: "Para veteran bertarung berdampingan lagi!"
 EST_events.10.b: "Pasukan sukarelawan yang cukup besar sudah cukup."
 EST_events.11.t: "Vaps dan [Root.GetFascistPartyName]"
 EST_events.11.d: "Sekarang diberdayakan di Estonia, Vaps telah setuju untuk menandatangani perjanjian kolaborasi dengan [Root.GetFascistPartyName]. Vaps sudah mendukung kelompok fasis Finlandia dengan propaganda dan demonstrasi nasional, namun tindakan cepat dan tegas dari pemerintah untuk melarang elemen fasis ini mungkin dapat memberantas masalah ini selamanya."
 EST_events.11.a: "Tidak ada pemula yang baik."
 NSB_poland_communist_events.1.a: "[POL.GetNameDefCap] berdiri sendiri."
 NSB_poland_communist_events.1.b: "Polandia termasuk dalam Uni Soviet."
 NSB_poland_communist_events.1.desc: "Partai komunis Polandia telah menjadi tuan rumah bagi konflik berkepanjangan antara mereka yang ingin melihat Polandia bersekutu dengan Uni Soviet dan mereka yang percaya bahwa Uni Soviet sama imperialistiknya dengan rezim monarki yang mendahuluinya.\nMewakili kelompok anti-Soviet adalah Maria Koszutska, yang diduga [Root.GetStalinistOrTrotskyite], yang menuduh rekan-rekannya yang pro-Soviet sebagai orang yang \"tidak memiliki tulang\" dan musuh dari Uni Soviet. revolusi.\nBertindak sebagai pemimpin de-facto, Władysław Gomułka mewakili sayap partai yang pro-Soviet. Meskipun sudah populer di dalam partai, Gomułka semakin tidak populer di kalangan masyarakat Polandia karena sikap diplomatiknya yang pro-Rusia.\nMeskipun kini menguasai Polandia, partai ini terpecah mengenai kandidat mana yang harus mewakili kepemimpinan mereka. Setelah keragu-raguan mereka, ada tekanan yang meningkat dari Moskow untuk tidak hanya melarang Koszutska memimpin, namun juga mengadili dia sebagai seorang [Root.GetStalinistOrTrotskyite] dan anti-revolusioner."
 NSB_poland_communist_events.1.nosov.desc: "Partai komunis Polandia telah menjadi tuan rumah bagi konflik berkepanjangan antara mereka yang ingin melihat Polandia bersekutu dengan Uni Soviet dan mereka yang percaya bahwa Uni Soviet sama imperialistiknya dengan rezim monarki yang mendahuluinya.\nNamun, sejak jatuhnya Uni Soviet, pertanyaan ini telah menjadi topik yang diperdebatkan. Setelah jatuhnya Stalin dari kekuasaan, pemimpin pro-Soviet Władysław Gomułka kehilangan relevansinya, sehingga tidak ada lagi yang bisa membuktikan penunjukan Maria Koszutska yang anti-Soviet sebagai pemimpin partai."
 NSB_poland_communist_events.1.t: "Pertikaian di KPP"
 NSB_poland_events.1.a: "Kami tidak punya pilihan."
 NSB_poland_events.1.b: "Kami tidak akan gemetar ketakutan di hadapan Polandia!"
 NSB_poland_events.1.desc: "Mengutip kurangnya kemampuan pertahanan [Root.GetNameDef], pejabat dari [From.GetNameDef] menuntut agar seluruh wilayah Slovakia berada di bawah pendudukan langsung Polandia. Mereka menuntut dengan tegas bahwa jika kita tidak tunduk, invasi tidak bisa dihindari. Bagaimana seharusnya kita menanggapinya?"
 NSB_poland_events.1.t: "[From.GetNameDefCap] Menuntut Slowakia"
 NSB_poland_events.101.a: "Saya tidak percaya itu berhasil!"
 NSB_poland_events.101.desc: "[From.GetNameDefCap] telah menerima permintaan kami baru-baru ini untuk menyerahkan seluruh wilayah Slovakia. Pasukan [Root.GetAdjective] sudah membanjiri wilayah tersebut untuk menekan perlawanan lokal sebelum perlawanan itu muncul. Meskipun kemenangan ini kecil, ini menandakan bahwa dunia setidaknya takut terhadap mesin perang [Root.GetAdjective]!"
 NSB_poland_events.101.t: "[From.GetNameDefCap] Menerima!"
 NSB_poland_events.102.a: "Ya, perang!"
 NSB_poland_events.102.desc: "Yang mengejutkan, pemerintah [From.GetAdjective] menolak permintaan kami untuk menyerahkan wilayah Slovakia. Upaya kami untuk menemukan solusi diplomatik telah gagal, dan hal ini kini menjadi urusan militer."
 NSB_poland_events.102.t: "[From.GetNameDefCap] Menolak!"
 NSB_poland_events.2.a: "Saya kira kita harus menerimanya."
 NSB_poland_events.2.b: "\"Klaim\" ini tidak ada artinya."
 NSB_poland_events.2.d: "Tampaknya kabupaten yang sudah lama berdiri di [Root.GetNameDef] telah memberanikan [From.GetLeader] untuk mendeklarasikan [From.GetLeader.GetHerselfHimself] Raja Hongaria. Klaim ini didasarkan pada kerajaan abad pertengahan Polandia-Hongaria dan jelas merupakan upaya terang-terangan untuk memperluas wilayah."
 NSB_poland_events.2.t: "[From.GetLeader] Mengklaim Tahta [Root.GetAdjective]!"
 NSB_poland_events.201.a: "Luar biasa."
 NSB_poland_events.201.desc: "Saat ini tampaknya semua orang yang mengaku takhta Hongaria telah dipecat, karena [Root.GetLeader] diangkat menjadi Raja Hongaria. Dengan [Root.GetLeader] yang kini menjadi Raja Polandia dan Hongaria, ambisi [Root.GetAdjective] untuk hegemoni Balkan semakin terwujud."
 NSB_poland_events.201.t: "Hongaria Menyerah"
 NSB_poland_events.202.a: "Mereka tidak memberi kita pilihan."
 NSB_poland_events.202.desc: "Para pemimpin pemerintahan [From.GetAdjective] telah mengumumkan bahwa mereka tidak akan mengakui klaim [Root.GetLeader] atas takhta [From.GetAdjective]. Meskipun hal ini mengakhiri kemungkinan aneksasi [From.GetNameDef] secara damai, hal ini berarti bahwa klaim tersebut masih dapat diajukan melalui perang."
 NSB_poland_events.202.t: "[From.GetNameDefCap] Menolak Klaim [Root.GetLeader]"
 NSB_poland_events.3.a: "Kami menerima!"
 NSB_poland_events.3.b: "[From.GetNonIdeologyName] masih menjadi musuh kita."
 NSB_poland_events.3.c: "Transfer Danzig dan mereka sepakat!"
 NSB_poland_events.3.desc: "Pejabat dari [From.GetNameDef] telah mengumumkan minatnya untuk menandatangani aliansi dengan Kekaisaran Jerman yang baru. Percaya bahwa Kaiser [Root.GetLeader] lebih bersahabat dengan kemerdekaan [From.GetAdjective] daripada [Root.GetHerHis] pendahulunya, dan mengutip bahwa inkarnasi modern [From.GetNameDef] dapat secara langsung dikaitkan dengan Undang-undang tanggal 5 November yang ditandatangani oleh Blok Sentral, [From.GetNameDef] mengusulkan agar kedua negara menandatangani aliansi formal.\nPenerimaan akan menandai sebuah anomali besar dalam hubungan sejarah hubungan [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] dan menandai potensi masa depan cerah bagi kedua negara."
 NSB_poland_events.3.t: "[From.GetNameDefCap] Mengusulkan Aliansi"
 NSB_poland_events.301.a: "Hari yang menyenangkan bagi Polandia!"
 NSB_poland_events.301.desc: "Yang mengejutkan, [From.GetNameDef] telah setuju untuk menandatangani aliansi formal dengan [Root.GetNameDef]! Meskipun pernah menjadi musuh seumur hidup, tampaknya konflik antara [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName] akhirnya berakhir, dan kedua negara kini dapat bergerak maju sebagai sekutu melawan gelombang ideologi ekstremis.\nApa yang dimulai dengan Undang-undang tanggal 5 November di mana Jerman setuju untuk melepaskan wilayah [Root.GetAdjective] mereka sebagai kerajaan merdeka kini telah berkembang menjadi aliansi bersejarah yang selanjutnya dikenal sebagai \"Aliansi November\"."
 NSB_poland_events.301.t: "Kaiser Setuju!"
 NSB_poland_events.302.a: "Sangat mengecewakan."
 NSB_poland_events.302.desc: "Terlepas dari upaya diplomasi terbaik kami dan kepentingan negara kami yang tampaknya selaras, Kaiser menolak menandatangani aliansi formal apa pun. Tampaknya, apakah Jerman berada di tangan kerajaan atau fasis, Jerman tetap memandang bangsa kita sebagai musuh alaminya."
 NSB_poland_events.302.t: "Seorang Kaiser yang Berperang"
 NSB_poland_events.303.a: "Memperdagangkan kota bermasalah itu dengan tentara tampaknya bermanfaat."
 NSB_poland_events.303.desc: "[From.GetNameDefCap] telah kembali kepada kami dengan tawaran bersyarat yang mereka klaim akan saling menguntungkan kedua belah pihak. Mereka mengklaim bahwa Undang-Undang tanggal 5 November tidak pernah secara resmi menyetujui penyerahan wilayah Gdansk dan Gdynia yang diperebutkan kepada kerajaan [Root.GetAdjective] yang baru didirikan. Mereka mengklaim bahwa mereka akan setuju untuk menandatangani aliansi, tetapi hanya jika apa yang mereka klaim sebagai pelanggaran terhadap persyaratan yang disetujui Jerman dapat diperbaiki."
 NSB_poland_events.303.t: "Danzig untuk Jaminan"
 NSB_poland_events.304.a: "Kami akan mengambilnya dengan paksa."
 NSB_poland_events.304.desc: "Sayangnya tampaknya tidak ada kesepakatan yang dapat dibuat dengan Polandia dan mereka menolak tawaran kami untuk menyerahkan Danzig sebagai imbalan atas aliansi. Ketegangan sudah meningkat di perbatasan [From.GetAdjective] dan beberapa pihak khawatir akan terjadi perang."
 NSB_poland_events.304.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_events.4.a: "Mereka akan memilikinya!"
 NSB_poland_events.4.b: "[POL_colony_purchase.GetName] adalah bagian integral dari Kekaisaran [Root.GetAdjective]!"
 NSB_poland_events.4.desc: "Liga Maritim dan Kolonial Polandia hari ini mendekati duta besar [Root.GetAdjective] di [From.Capital.GetName] dengan tawaran untuk membeli wilayah luar negeri [POL_colony_purchase.GetName]. Pertukaran [POL_colony_purchase.GetName] dengan Polandia tentunya akan memberikan surplus anggaran yang cukup besar bagi [Root.GetNameDef] namun akan membuat [From.GetNameDef] berdaulat atas seluruh [POL_colony_purchase.GetName] dan sumber daya mentah serta penduduk sipilnya yang berharga."
 NSB_poland_events.4.t: "Polandia Meminta untuk Membeli [POL_colony_purchase.GetName]"
 NSB_poland_events.401.a: "Selamat datang, warga [POL_colony_purchase.GetName]"
 NSB_poland_events.401.desc: "[From.GetNameDefCap] kembali kepada kami hari ini dan setuju untuk menjual wilayah luar negeri [POL_colony_purchase.GetName]. Yang tersisa sekarang hanyalah melunasi hutang kita kepada [From.GetNameDef], dan koloni tersebut akan menjadi bagian integral dari kerajaan kolonial [Root.GetAdjective] yang sedang berkembang."
 NSB_poland_events.401.desc.com: "[From.GetNameDefCap] kembali kepada kami hari ini dan setuju untuk menjual wilayah luar negeri [POL_colony_purchase.GetName]. Tinggal melunasi hutang kita kepada [From.GetNameDef], namun masyarakat [POL_colony_purchase.GetName] sudah lepas dari cengkraman kolonialisme [From.GetAdjective]."
 NSB_poland_events.401.desc.dem: "[From.GetNameDefCap] kembali kepada kami hari ini dan setuju untuk menjual wilayah luar negeri [POL_colony_purchase.GetName]. Meskipun kami sekarang berhutang kepada [From.GetNameDef], penjualan ini mungkin terjadi pada saat [Root.GetNameDef] sangat dibutuhkan. Dengan [POL_colony_purchase.GetName] yang sekarang berada di bawah kendali langsung kami, kami telah diberikan benteng lain di mana pemerintah kami dapat terus bertahan di pengasingan."
 NSB_poland_events.401.t: "Penjualan [POL_colony_purchase.GetName] yang Berhasil"
 NSB_poland_events.402.a: "Itu patut dicoba."
 NSB_poland_events.402.desc: "Sayangnya, pemerintah [From.GetAdjective] sama sekali tidak tertarik untuk menyerahkan [POL_colony_purchase.GetName] saat ini. Meskipun hal ini tidak mengakhiri ambisi [Root.GetAdjective] di luar negeri, kegagalan ini membuat segala kemungkinan pemindahan [POL_colony_purchase.GetName] secara damai sama sekali tidak mungkin dilakukan."
 NSB_poland_events.402.t: "[From.GetNameDefCap] Menolak Menjual [POL_colony_purchase.GetName]"
 NSB_poland_events.6.a: "Saran yang cerdas."
 NSB_poland_events.6.b: "Tidak."
 NSB_poland_events.6.desc: "Pada musim gugur tahun 1932, Polandia diakui oleh Liga Bangsa-Bangsa sebagai satu-satunya pelindung Liberia, namun mosi tersebut tidak pernah dilaksanakan karena campur tangan Amerika Serikat. Meskipun demikian, negara kita dipenuhi dengan pemukiman dan bisnis yang dijalankan oleh Liga Maritim dan Kolonial Polandia.\nPengaturan ini menguntungkan kedua negara, namun sekarang tampaknya [From.GetNameDef] semakin tegas dan [From.GetLeader] secara resmi meminta agar [Root.GetNameDef] menjadi protektorat [From.GetAdjective].\nJika kita menerimanya, kita akan menjadi protektorat [From.GetAdjective] tunduk dengan segala keuntungan dan kerugian yang mungkin ditimbulkannya, namun jika kita menolaknya, nampaknya [From.GetLeader] dapat memaksakan ambisi [From.GetLeader.GetHerHis] dengan paksa."
 NSB_poland_events.6.t: "[From.GetNameDefCap] Menawarkan Status Protektorat"
 NSB_poland_events.601.a: "Maka kita akan mengambilnya dengan paksa."
 NSB_poland_events.601.b: "Jangan membesar-besarkan masalah ini lebih jauh."
 NSB_poland_events.601.desc: "Meskipun menyetujui status protektorat pada tahun 1932, tampaknya pemerintah [From.GetAdjective] tidak lagi tertarik untuk mempertahankan kepentingan [Root.GetAdjective] terhadap negaranya."
 NSB_poland_events.601.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_events.7.a: "Saran yang bagus!"
 NSB_poland_events.7.b: "Ini terdengar seperti jebakan maut."
 NSB_poland_events.7.desc: "Dengan pulihnya demokrasi di Polandia, pemerintahan baru Polandia berupaya memperkuat hubungan Perancis-Polandia dan menciptakan aliansi di kedua sisi perbatasan Jerman. Meskipun Polandia masih melemah akibat konflik sipil baru-baru ini, tidak ada keraguan bahwa [GER.GetNameDef] akan berjuang dalam perang yang terjadi di kedua sisi perbatasan mereka."
 NSB_poland_events.7.t: "Polandia Mengusulkan Pakta Morges"
 NSB_poland_events.701.a: "Mungkin Inggris akan membawa kita."
 NSB_poland_events.701.desc: "Pemerintah [From.GetNameDef] saat ini menolak menandatangani aliansi formal dengan kami. Kekalahan diplomatik yang pahit ini menjadikan rencana Front Morges untuk membentuk aliansi Perancis-Polandia hanya sekedar khayalan belaka, dan kita harus mencari dukungan dari pihak lain."
 NSB_poland_events.8.t: "Nasib Anastasia Romanova"
 NSB_poland_events.8.d: "Setelah Moskow direbut oleh [From.GetNameDefCap] dan sekutunya, agen kami menemukan catatan dari arsip NKVD yang mengungkap nasib mengerikan keluarga Romanov. Laporan tersebut menyimpulkan bahwa seluruh Keluarga Kekaisaran, termasuk Anastasia, dieksekusi pada bulan Juli 1918 oleh kaum Bolshevik. Jika kita tidak bertindak cepat, dunia akan segera mengetahui bahwa ratu kita tidak seperti yang dia bayangkan."
 NSB_poland_events.8.a: "Kubur buktinya, dunia tidak akan pernah tahu"
 NSB_poland_events.8.b: "Orang lain harus menyandang mahkota Polandia!"
 NSB_poland_monarchist_events.1.t: "[From.GetNameDefCap] Mengklaim Takhta Kami"
 NSB_poland_monarchist_events.2.a: "Oh baiklah."
 NSB_poland_monarchist_events.2.desc: "Sayangnya, kami tidak dapat lagi menantang klaim kami atas [From.GetNonIdeologyName]. Pemerintahan [From.GetAdjective] saat ini telah memenangkan perang propaganda sampai pada titik di mana setiap pembicaraan mengenai klaim [Root.GetLeader] akan ditanggapi dengan tawa dan cemoohan."
 NSB_poland_monarchist_events.2.t: "Klaim [Root.GetNameDefCap] Ditolak"
 NSB_poland_monarchist_events.3.a: "sial!"
 NSB_poland_monarchist_events.3.desc: "[From.GetLeader] hari ini telah dinobatkan sebagai Raja baru [Root.GetNonIdeologyName]. Serangkaian kampanye propaganda yang panjang telah membuat banyak menteri [Root.GetAdjective] menentang rezim lama dan menyebabkan kudeta tak berdarah. Kudeta ini telah menjadikan [Root.GetNonIdeologyName] tidak lebih dari sekadar boneka [From.GetNameDef], dan masa depan otonomi [Root.GetAdjective] tampak suram."
 NSB_poland_monarchist_events.3.t: "Kudeta [From.GetLeader]!"
 NSB_poland_monarchist_events.4.a: "Pengkhianat!"
 NSB_poland_monarchist_events.4.desc: "Jalanan [Root.GetNonIdeologyName] telah dibakar hari ini karena milisi pro dan anti monarki telah menjerumuskan negara ini ke dalam perang saudara! Pendukung [Root.GetLeader] dan [From.GetLeader] terlibat dalam bentrokan di seluruh negeri, dan para menteri dari [From.GetNameDef] menolak untuk mengakui keterlibatan mereka dalam pemakzulan kedaulatan nasional kita. Kini tinggal menunggu dan melihat pihak mana yang akan menang dalam konflik ini."
 NSB_poland_monarchist_events.4.t: "Perang Saudara Monarki"
 NSB_poland_monarchist_events.5.t: "[From.GetLeader] Pendukung Menuntut Turun Takhta"
 NSB_poland_monarchist_events.5.desc: "Menyusul kampanye panjang propaganda kerajaan yang dipicu oleh pemerintah [From.GetLeader] dan [From.GetLeader.GetHerHis], ketegangan antara loyalis [Root.GetLeader] dan mereka yang berupaya untuk menyatukan [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] telah mencapai titik di mana hidup berdampingan secara damai tidak lagi menjadi pilihan. Dengan tegas, para pendukung monarki telah menuntut agar [Root.GetLeader] turun tahta dan mengakui [From.GetLeader] sebagai satu-satunya Raja sejati dari [Root.GetNonIdeologyName].\n\nPenerimaan akan membuat [Root.GetNonIdeologyName] tidak lebih dari sekedar negara subjek [From.GetAdjective], namun penolakan tersebut hampir pasti akan mengakibatkan perang saudara."
 NSB_poland_monarchist_events.5.a: "Kami menyerah!"
 NSB_poland_monarchist_events.5.b: "Daripada perang daripada boneka [From.GetAdjective]."
 NSB_poland_royal_election.1.a: "Dia adalah Raja kita!"
 NSB_poland_royal_election.1.b: "Tidak, kami punya pemikiran lain..."
 NSB_poland_royal_election.1.desc: "Margrave Meissen dan Pangeran Saxony, Albert Leopold Friedrich Christian Sylvester Anno Macarius berupaya menambahkan Raja Polandia ke dalam banyak gelar bergengsinya. Banyak raja besar Persemakmuran yang merupakan anggota House of Wettin dan Saxon electors, dan dengan negara kita yang sekarang sedang mencari seorang Raja, Friedrich Christian nampaknya merupakan kandidat Raja yang paling jelas dan sah.\nDengan klaim atas Persemakmuran di pihaknya, terpilihnya Friedrich tidak diragukan lagi akan memperkuat klaim pemerintah kita atas semua bekas wilayah Persemakmuran. Sebagai penggugat Lituania, anggota keluarga kerajaan Polandia yang bersejarah, dan memiliki garis keturunan bergengsi di belakangnya, Friedrich Christian membawa serta klaim kuat atas Kerajaan Polandia."
 NSB_poland_royal_election.1.t: "Friedrich Christian Mengklaim Tahta"
 NSB_poland_royal_election.2.a: "Menyatukan takhta kita? Ide yang bagus!"
 NSB_poland_royal_election.2.b: "Kami tidak bisa mengambil risiko hubungan kami dengan Rumania."
 NSB_poland_royal_election.2.desc: "Klaim Hohenzollern atas Polandia sudah ada sejak keberadaan negara Polandia saat ini. Kini, dengan semakin pentingnya hubungan Polandia-Rumania bagi kelangsungan hidup kedua negara, masuk akal untuk menawarkan tahta kita kepada mantan Raja dan pewaris Rumania, Michael I.\nDigulingkan pada tahun 1930 demi ayahnya sendiri, Raja Michael menghadirkan peluang bagi potensi penyatuan takhta Polandia dan Rumania. Dengan pengaruh gedung Garda Besi yang fasis di Rumania, kita mungkin dapat mempersenjatai sentimen anti-fasis sebagai sarana untuk menggulingkan Raja Carol sekali lagi dan menggantikannya dengan Michael sebagai Raja. Prestasi seperti itu akan menciptakan persatuan yang tak terpisahkan di antara bangsa-bangsa kita, dan gabungan kemauan kita akan menjadi kekuatan yang kuat untuk dihadapi oleh musuh-musuh kita di [SOV.GetNameDef] dan [GER.GetNameDef]."
 NSB_poland_royal_election.2.t: "Putra Mahkota Michael dari Rumania"
 NSB_poland_royal_election.3.a: "Ide yang gila, tapi ini adalah masa yang gila. Kami memiliki Raja kami!"
 NSB_poland_royal_election.3.b: "Paulus bagaimana sekarang?"
 NSB_poland_royal_election.3.desc: "Seorang kandidat yang tidak biasa telah mengajukan dirinya ke dewan kabupaten hari ini. Pangeran Georgia, cossack, dan mantan jenderal Rusia berkulit putih Pavel Bermondt-Avalov telah mendekati dewan yang mengklaim tidak hanya Kerajaan Polandia, tetapi juga Persemakmuran Polandia-Lithuania.\nBertahun-tahun sebelumnya, cossack telah berusaha menyerang Baltik untuk alasan yang tidak diketahui, dan tampaknya ambisi sang pangeran semakin meningkat sejak saat itu.\nMeskipun tidak populer di kalangan kebanyakan orang Polandia sehari-hari, kandidat yang tidak terduga untuk mahkota ini akan membawa pasukan Orang kulit putih yang diasingkan mendukungnya, menentang [SOV.GetNameDef], namun memperkuat jumlah kita dan berpotensi menyelaraskan kita dengan kekuatan fasis di Eropa."
 NSB_poland_royal_election.3.t: "Raja Cossack"
 NSB_poland_royal_election.4.a: "Raja kita akan menjadi Romanov terakhir. Mungkin."
 NSB_poland_royal_election.4.desc: "\"Kastil Warsawa, lukisan elang, ya, aku ingat. Akulah satu-satunya Raja Polandia yang sejati.\" Penggugat terkenal atas nama Anastasia Romanov telah tiba di Kastil Warsawa hari ini bersama dengan humasnya untuk mengklaim bahwa keluarga Romanov masih mengklaim takhta Polandia, dan sebagai Romanov terakhir dia secara logis adalah Raja. Klaim Anastasia tidak hanya bertumpu pada kekuatan klaim Romanov atas Polandia, namun juga pada legitimasi garis keturunannya.\nMeskipun banyak mantan bangsawan Rusia yang membuktikan bahwa dia memang Anastasia yang sebenarnya, banyak yang melihatnya sebagai seorang eksentrik yang mendapat banyak liputan media.\nMeskipun klaimnya mungkin diragukan, dia adalah yang terakhir dalam daftar kandidat dan jika menolaknya sekarang maka Polandia akan kembali ke tempat dia memulai; takhta kosong yang mengumpulkan debu."
 NSB_poland_royal_election.4.t: "Anastasia Romanov Tiba di Polandia"
 NSB_poland_royal_election.5.t: "Kandidat Habsburg"
 NSB_poland_royal_election.5.desc: "Seorang bangsawan, seorang Habsburg, dan seorang patriot Polandia, Karl Albrecht von Habsburg telah mengabdi pada militer Polandia hampir selama organisasi tersebut masih ada. Meskipun garis keturunannya bukan berasal dari tanah ini, kesediaannya untuk berjuang dan mati demi Polandia membuatnya menjadi kandidat yang ideal untuk takhta.\n\nMeskipun tampaknya Archduke memiliki sedikit ambisi untuk berkuasa, mungkin dia dapat dibujuk untuk mengabdi pada Polandia bukan dengan senjata, namun dalam kepemimpinan."
 NSB_poland_royal_election.5.a: "Habsburg Polandia lahir!"
 NSB_poland_royal_election.5.b: "Kami menginginkan yang lain..."
 pavel_events.1.a: "Don Cossack harus mandiri."
 pavel_events.1.b: "Mereka akan menjawab langsung kepada kita."
 pavel_events.1.desc: "Dengan seluruh Lembah Don kini berada di bawah kendali pasukan [Root.GetLeader] dan [Root.GetLeader.GetHerHis], kami berada dalam posisi untuk mengembalikan Republik Don dan mengundang para pemimpinnya kembali untuk sekali lagi memimpin Don Cossack melawan Tentara Merah!\nSatu-satunya pertanyaan yang tersisa sekarang adalah apakah tuan rumah dapat dipercaya untuk tetap setia sebagai negara merdeka, atau apakah negara tersebut harus bertindak sebagai pemerintahan boneka langsung [Root.GetLeader]."
 pavel_events.1.t: "Pemulihan Republik Don"
 pavel_events.2.a: "Baiklah."
 pavel_events.2.b: "Mereka tidak bisa dipercaya, mereka akan menjadi subyek kita."
 pavel_events.2.desc: "Ketika Republik Rakyat Kuban, sebuah negara pengkhianat yang berjuang untuk Partai Putih dan kemudian Partai Merah, [Root.GetLeader] telah memutuskan untuk mengembalikan Republik Kuban dengan kepemimpinan baru yang berpihak pada kelompok kulit putih.\nMeskipun rakyat Kuban pernah mengkhianati perjuangan Putih, kepemimpinan baru meyakinkan kita bahwa mereka akan melakukan apa pun yang bisa mereka lakukan untuk meredam dukungan apa pun terhadap pemerintahan lama."
 pavel_events.2.t: "Pemulihan Republik Kuban"
 NSB_poland_democratic_events.1.t: "Pertanyaan tentang Kepemimpinan"
 NSB_poland_democratic_events.1.desc: "Kini setelah kaum Sanasionis disingkirkan dari pemerintahan, pertanyaan yang tersisa adalah siapa yang harus menjadi pemimpin Partai Tani Polandia yang baru. Pendukung kaum tani yang paling bersemangat dan vokal, Stanisław Mikołajczyk, saat ini memegang peran ini, namun tidak dapat diabaikan bahwa kemenangan dalam perang saudara tidak akan mungkin terjadi tanpa dukungan dari Front Morges.\n\nMewakili para jenderal yang mendukung pemulihan pemilihan umum yang bebas di Polandia, Front Morges mendukung mantan Perdana Menteri Polandia, Wincenty Witos.\n\nMeskipun menunjuk Witos sebagai pemimpin partai akan menenangkan Front Morges, mencopot Mikołajczyk dari jabatannya mungkin akan membuat banyak petani yang berjuang di garis depan demi perjuangan demokrasi merasa kehilangan haknya dan dikhianati oleh partai."
 NSB_poland_democratic_events.1.a: "Witos punya pengalaman, dia pemimpin kami."
 NSB_poland_democratic_events.1.b: "Mikołajczyk adalah pembela rakyat, dia adalah pemimpin kita."
 NSB_poland_communist_events.2.a: "Ini adalah peluang terbaik yang kami miliki."
 NSB_poland_communist_events.2.b: "Tidak!"
 NSB_poland_communist_events.2.desc: "[From.GetNameDefCap] telah menawarkan untuk memberi kami perlindungan militer total sebagai imbalan atas kekuasaan [Root.GetNonIdeologyName]. Mengutip ancaman langsung dan seumur hidup yang ditimbulkan oleh Rusia dan Jerman terhadap [Root.GetNonIdeologyName], politisi dari [From.GetNameDef] menawarkan kami posisi protektorat. Menerima akan membuat [Root.GetNonIdeologyName] menjadi boneka, namun sepertinya [From.GetNonIdeologyName] tidak akan menerima jawaban tidak."
 NSB_poland_communist_events.2.t: "[From.GetNameDefCap] Menawarkan Perlindungan"
 NSB_poland_communist_events.201.a: "Luar biasa."
 NSB_poland_communist_events.201.desc: "[From.GetNameDefCap] telah menjadi subjek negara [Root.GetNameDef]. Dengan pemerintahan [From.GetAdjective] yang sekarang menjawab langsung [Root.Capital.GetName], tujuan hegemoni Baltik menjadi tidak bisa dihindari."
 NSB_poland_communist_events.201.t: "[From.GetNameDefCap] Menerima!"
 NSB_poland_communist_events.202.a: "Kita selalu bisa mengandalkan militer."
 NSB_poland_communist_events.202.desc: "[From.GetNameDefCap] telah menolak tawaran perlindungan kami dan bersikeras mempertahankan independensinya. Komando tinggi [Root.GetAdjective] telah memulai persiapan untuk menyukseskan kegagalan kantor luar negeri, dan [Root.GetLeader] hanya perlu memberikan perintah, dan serangan penuh terhadap [From.GetNameDef] akan dimulai."
 NSB_poland_communist_events.202.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_communist_events.3.a: "Pekerja [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName] Bersatu!"
 NSB_poland_communist_events.3.b: "Itu tidak bisa diterima."
 NSB_poland_communist_events.3.desc: "[From.GetNameDefCap] menuntut agar [Root.GetNameDef] segera dianeksasi. Aneksasi ini merupakan bagian dari ambisi [From.GetLeader] untuk membentuk \"Persemakmuran Republik Sosialis\". Menerima berarti segera meninggalkan kemerdekaan kita, meninggalkan [Root.GetNonIdeologyName] sebagai bagian langsung dari negara bagian [From.GetAdjective]."
 NSB_poland_communist_events.3.t: "[From.GetNameDefCap] Mencari Integrasi [Root.GetAdjective]"
 NSB_poland_communist_events.301.a: "Sayang sekali."
 NSB_poland_communist_events.301.desc: "[From.GetNameDefCap] telah menolak untuk dianeksasi ke dalam Persemakmuran Republik Sosialis. Meskipun hal ini tidak berarti akhir dari ambisi [Root.GetAdjective] di wilayah tersebut, namun hal ini berarti bahwa hubungan damai dengan [From.GetNameDef] menjadi mustahil."
 NSB_poland_communist_events.301.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_communist_events.302.a: "Luar biasa."
 NSB_poland_communist_events.302.desc: "Ambisi [Root.GetLeader] untuk melihat [From.GetNameDef] memasuki Persemakmuran Republik Sosialis telah membuahkan hasil karena pemerintah [From.GetAdjective] telah setuju untuk menyerahkan diri kepada kepemimpinan langsung [Root.GetAdjective]."
 NSB_poland_communist_events.302.t: "[From.GetNameDefCap] Menerima Aneksasi"
 NSB_poland_communist_events.4.a: "Kami menerima."
 NSB_poland_communist_events.4.b: "Mereka belum siap."
 NSB_poland_communist_events.4.desc: "[From.GetNameDefCap] telah menawarkan untuk menyerahkan Polandia Timur kepada kami dengan imbalan status protektorat dan integrasi erat dengan Uni Soviet. Jika kita menerimanya, [From.GetNameDef] akan menjadi negara boneka [Root.GetNameDef], dan negara-negara Belorusia dan Ukraina yang saat ini diduduki oleh Polandia akan diserahkan ke Uni Soviet.\n\nMeskipun ini tampak seperti pilihan yang jelas, ambisi Jerman di Polandia dapat berarti perang antara [Root.GetNameDef] dan [GER.GetNameDef] mungkin tidak dapat dihindari."
 NSB_poland_communist_events.4.t: "[From.GetNameDefCap] Menawarkan Timur"
 NSB_poland_communist_events.401.a: "Pengorbanan yang diperlukan."
 NSB_poland_communist_events.401.desc: "[From.GetNameDefCap] telah setuju untuk menjadikan kami sebagai protektorat, dan kami telah diintegrasikan ke dalam Uni Soviet sebagai negara subjek. Meskipun banyak orang di seluruh negeri merasa dikhianati oleh keputusan kami, [Root.GetLeader] telah meyakinkan rakyat Polandia bahwa [From.GetLeader] adalah teman Polandia, dan setiap etnis yang sekarang terintegrasi langsung ke dalam Uni Soviet akan sangat puas dengan [From.GetAdjective] penguasa mereka yang baru."
 NSB_poland_communist_events.401.t: "[From.GetNameDefCap] Menerima!"
 NSB_poland_communist_events.402.a: "Baiklah."
 NSB_poland_communist_events.402.desc: "[From.GetLeader] telah menolak untuk menerima [Root.GetNameDef] ke dalam Uni Soviet, dengan menyatakan bahwa [Root.GetLeader] \"belum siap\". Meskipun alasan tersebut masih menjadi alasan resmi, banyak yang menduga bahwa ambisi Jerman di Polandia adalah penyebab sebenarnya dari penolakan ini."
 NSB_poland_communist_events.402.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_communist_events.5.a: "Kemerdekaan bukanlah suatu pilihan."
 NSB_poland_communist_events.5.b: "Kami memiliki kekhawatiran yang lebih besar."
 NSB_poland_communist_events.5.desc: "[From.GetNameDefCap] bukan lagi boneka [Root.GetAdjective] dan negara kecil ini telah mendeklarasikan dirinya sebagai republik sosialis yang merdeka. Untuk saat ini situasi aman dan [From.GetNameDef] tetap menjadi anggota [Root.GetFactionName]."
 NSB_poland_communist_events.5.t: "[From.GetNameDefCap] Menyatakan Kemerdekaan!"
 NSB_poland_communist_events.501.a: "Maka peranglah!"
 NSB_poland_communist_events.501.desc: "Seperti yang sudah diperkirakan, [From.GetLeader] tidak menyukai deklarasi kemerdekaan [Root.GetAdjective] dan menyatakannya sebagai tindakan perang."
 NSB_poland_communist_events.501.t: "[From.GetNameDefCap] Menyatakan Perang"
 NSB_poland_communist_events.502.a: "Kami akan tetap di [From.GetFactionName]"
 NSB_poland_communist_events.502.b: "Kami mendeklarasikan kemerdekaan penuh kami."
 NSB_poland_communist_events.502.desc: "[From.GetNameDefCap] telah menerima deklarasi kemerdekaan kami dan tampaknya saat ini terdapat perdamaian di antara negara-negara kami. Meskipun sekarang sudah sepenuhnya independen, kami dapat tetap bergabung dengan [From.GetNameDef] atau keluar dari faksi dan mencari opsi alternatif."
 NSB_poland_communist_events.502.t: "[From.GetNameDef] Menerima [Root.GetAdjective] Kemerdekaan"
 NSB_poland_communist_events.6.a: "Konsekuensinya kecil."
 NSB_poland_communist_events.6.b: "Itu adalah tanah kami."
 NSB_poland_communist_events.6.desc: "Meskipun Polandia bagian timur adalah bagian dari perjanjian yang memasukkan [From.GetNameDef] ke dalam [Root.GetFactionName], negara kecil tersebut telah memintanya kembali dengan alasan kesetiaan negara mereka terhadap tujuan internasional. Mereka mengklaim bahwa masyarakat Belarus bagian barat dan Ukraina telah menjadi bagian dari negara Polandia selama beberapa dekade dan berperan penting dalam pemogokan petani yang menyebabkan bangkitnya sosialisme di Polandia."
 NSB_poland_communist_events.6.t: "[From.GetNameDefCap] Permintaan Polandia Timur"
 NSB_poland_communist_events.601.a: "Bangsa kita utuh kembali."
 NSB_poland_communist_events.601.desc: "Polandia Timur telah dikembalikan sebagai bagian inti dari [Root.GetNameDef]. Wilayah-wilayah tersebut telah diintegrasikan kembali dengan pemerintahan [Root.GetAdjective] dan wilayah yang sangat penting dalam menggulingkan rezim lama telah dipersatukan kembali dengan negara yang diperjuangkan rakyatnya."
 NSB_poland_communist_events.601.t: "[From.GetNameDefCap] Mengembalikan Polandia Timur!"
 NSB_poland_communist_events.602.a: "Baiklah."
 NSB_poland_communist_events.602.b: "Maka kemerdekaan itu adalah!"
 NSB_poland_communist_events.602.desc: "[From.GetNameDefCap] telah menolak menyerahkan Polandia Timur kembali ke [Root.GetNameDef]. Meskipun hasil ini dapat diprediksi, namun banyak warga Polandia yang kecewa, dan sentimen untuk berpisah dari [From.GetNameDef] semakin meningkat."
 NSB_poland_communist_events.602.t: "[From.GetNameDefCap] Menolak"
 NSB_poland_monarchist_events.1.a: "Kita harus melawan."
 NSB_poland_monarchist_events.1.desc: "Dengan [From.GetLeader] yang kini dinobatkan sebagai Raja [From.GetNonIdeologyName], nampaknya pemerintah [From.GetAdjective] menggunakan hal ini untuk memanfaatkan klaim atas [Root.GetNonIdeologyName]! Melalui perang propaganda dan sikap, [From.GetNameDef] akan berusaha mempersenjatai oposisi terhadap rezim [Root.GetLeader] dan mendukung kudeta internal.\nJika propaganda ini terbukti efektif, [Root.GetLeader] mungkin akan menghadapi kudeta dan [Root.GetNonIdeologyName] akan direduksi menjadi boneka [From.GetAdjective]."
 NSB_poland_royal_election.4.b: "Mungkin kita terlalu cepat memecat Friedrich Christian..."
 NSB_polish_fascist_events.1.a: "Mengapa menyerang ketika mereka menyerahkan diri?"
 NSB_polish_fascist_events.1.b: "Kami memiliki desain lain untuk Polandia."
 NSB_polish_fascist_events.1.desc: "[From.GetAdjective] pemerintah telah mengusulkan pakta untuk mendukung tujuan hegemoni global. Jelas sekali, [From.GetLeader] menyadari bahwa [Root.GetLeader] tidak puas dengan pembagian perbatasan yang dibuat antara Polandia dan Jerman, dan dengan demikian Menteri Luar Negeri Polandia Józef Beck telah dikirim untuk mengusulkan amandemen terhadap perjanjian ini.\n\nPolandia setuju untuk menyerahkan wilayah barat Poznan, Danzig, dan Silesia Atas dengan imbalan pakta non-agresi bersama dan perlindungan serta bimbingan Jerman terhadap segala upaya [SOV.GetAdjective] invasi. Pakta tersebut pada dasarnya akan menjadikan Polandia hanya sekedar boneka Jerman dan juga menyerahkan wilayah sengketa di perbatasan kita. Haruskah kita setuju?"
 NSB_polish_fascist_events.1.t: "Pakta Beck-Ribbentrop"
 NSB_polish_fascist_events.101.a: "Aman, tapi berapa biayanya?"
 NSB_polish_fascist_events.101.desc: "[From.GetNameDefCap] telah menyetujui persyaratan kami dan [Root.GetNameDef] sekarang secara resmi berada di bawah perlindungan [From.GetAdjective]. Tentara [From.GetAdjective] sudah membanjiri pedesaan [Root.GetAdjective] dengan tentara dan para menteri kita bertanggung jawab langsung ke Berlin."
 NSB_polish_fascist_events.101.t: "[From.GetNameDefCap] Menandatangani Pakta"
 NSB_polish_fascist_events.102.a: "Saatnya untuk perubahan tentu saja."
 NSB_polish_fascist_events.102.desc: "Meskipun tawaran kami secara efektif menyerahkan kunci negara kami langsung kepada [From.GetLeader], tampaknya pemerintah [From.GetAdjective] mempunyai rencana lain dan dengan tegas menolak tawaran kami."
 NSB_polish_fascist_events.102.t: "[From.GetNameDefCap] Menolak Pakta tersebut"
 NSB_polish_fascist_events.2.a: "Keluarkan ultimatum."
 NSB_polish_fascist_events.2.b: "Baiklah."
 NSB_polish_fascist_events.2.c: "Tidak."
 NSB_polish_fascist_events.2.desc: "Terlepas dari posisi mereka saat ini sebagai bawahan [Root.GetAdjective], [From.GetNameDef] tampaknya masih memiliki ambisi untuk hegemoni Persemakmuran. Mengakui klaim kami di Memel, [From.GetLeader] mengusulkan agar kami memecah negara, dengan wilayah Memel berada di bawah kendali [Root.GetAdjective], dan wilayah lainnya menjadi [From.GetAdjective]."
 NSB_polish_fascist_events.2.t: "[From.GetNameDefCap] Berusaha Membagi Lituania"
 NSB_polish_fascist_events.201.a: "Kami tidak punya pilihan."
 NSB_polish_fascist_events.201.b: "Kami menolak!"
 NSB_polish_fascist_events.201.desc: "Tuntutan bersama untuk melakukan aneksasi datang dari aliansi yang tidak terduga antara [POL.GetNameDef] dan [GER.GetNameDef]. Mereka menuntut agar wilayah Memel diserahkan ke Jerman dan seluruh wilayah negara kita dianeksasi sepenuhnya oleh Polandia."
 NSB_polish_fascist_events.201.t: "Jerman dan Polandia Menuntut Aneksasi Lituania"
 NSB_polish_fascist_events.202.a: "Sangat disayangkan."
 NSB_polish_fascist_events.202.desc: "Tampaknya Jerman mempunyai rencana lain untuk Lituania karena usulan aneksasi kami ditolak dengan suara bulat."
 NSB_polish_fascist_events.202.t: "[From.GetNameDefCap] Menolak"
 NSB_polish_fascist_events.203.a: "Luar biasa."
 NSB_polish_fascist_events.203.desc: "[From.GetNameDefCap] telah menyetujui tuntutan kami dan bekas wilayah Lituania telah dibagi antara Polandia dan Jerman. Tanpa melepaskan satu tembakan pun, Lituania kini menjadi milik kita."
 NSB_polish_fascist_events.203.t: "[From.GetNameDefCap] Setuju"
 NSB_polish_fascist_events.204.a: "Kami akan mengambilnya dengan paksa."
 NSB_polish_fascist_events.204.desc: "Tampaknya Lituania menolak tuntutan kami yang masuk akal. Meskipun diplomasi mungkin gagal, hal ini kini menjadi urusan militer."
 NSB_polish_fascist_events.204.t: "[From.GetNameDefCap] Menantang!"
 NSB_polish_fascist_events.3.a: "Hal ini tampaknya masuk akal."
 NSB_polish_fascist_events.3.b: "Tidak. Polandia adalah milik kita."
 NSB_polish_fascist_events.3.desc: "Mengklaim bahwa penggunaan pabrik Polandia oleh kami merupakan penghalang upaya perang, para menteri dari [From.GetNameDef] telah meminta agar kami melonggarkan tuntutan kami terhadap negara mereka. Meskipun perjanjian tersebut akan mempertahankan status Polandia sebagai protektorat [Root.GetAdjective], perjanjian ini akan sangat meningkatkan kemandirian politik dan ekonomi Polandia."
 NSB_polish_fascist_events.3.t: "[From.GetNameDefCap] Minta Otonomi"
 NSB_polish_fascist_events.301.a: "Luar biasa"
 NSB_polish_fascist_events.301.desc: "[From.GetNameDefCap] telah setuju untuk meningkatkan otonomi yang dinikmati oleh negara kita. Meskipun kita masih menjadi subyek [From.GetAdjective], kita sekarang sudah lebih mandiri secara industri dan diplomatis."
 NSB_polish_fascist_events.301.t: "[From.GetNameDefCap] Memberikan Otonomi"
 NSB_polish_fascist_events.302.a: "Sayangnya."
 NSB_polish_fascist_events.302.b: "Mungkin Negara Bawah Tanah bisa membantu..."
 NSB_polish_fascist_events.302.desc: "Permohonan kami untuk otonomi ditolak secara agresif oleh [From.GetNameDef], dan para penasihat [From.GetAdjective] bahkan tersinggung hanya dengan usulan seperti itu. Mereka mengklaim bahwa penaklukan kami yang berkelanjutan adalah bagian penting dari upaya perang dan tampaknya kami akan tetap menjadi sasaran mereka di masa mendatang."
 NSB_polish_fascist_events.302.t: "[From.GetNameDefCap] Mengencangkan Kendali"
 NSB_polish_fascist_events.4.a: "Kita harus merebut Baltik."
 NSB_polish_fascist_events.4.b: "Belarus dan Ukraina akan menjadi rumah kami."
 NSB_polish_fascist_events.4.c: "Kita harus menyelesaikan Intermarium."
 NSB_polish_fascist_events.4.desc.first: "Kita telah banyak berkorban dalam upaya melenyapkan Bolshevisme; perbatasan barat kita, kemerdekaan kita, dan nyawa tentara yang tak terhitung jumlahnya. Sekaranglah waktunya untuk meminta imbalan. Dengan perang kita dengan [SOV.GetNameDef] yang pasti akan berakhir dengan kemenangan, di Timur kita melihat peluang yang tak terhitung jumlahnya untuk ekspansi Polandia."
 NSB_polish_fascist_events.4.desc.rejected: "[From.GetNameDefCap] telah menolak usulan kami mengenai perbatasan pascaperang, namun hal ini tidak berdampak apa-apa jika terdapat begitu banyak visi lain untuk negara Polandia pascaperang."
 NSB_polish_fascist_events.4.t: "Polandia Pasca Perang"
 NSB_polish_fascist_events.401.a: "Ini memuaskan."
 NSB_polish_fascist_events.401.b: "Tidak."
 NSB_polish_fascist_events.401.desc.baltics: "Polandia telah mendekati kami dengan proposal mengenai perbatasan mereka di masa depan setelah perang. Mengutip wilayah yang mereka kalahkan dari [Root.GetNameDef] dalam pakta Beck-Ribbentrop, pemerintah [From.GetAdjective] yakin bahwa mereka berhak atas beberapa revisi wilayah setelah perang dimenangkan.\n\nMereka berusaha untuk pindah ke utara menuju Negara Baltik, dengan mengutip bekas negara satelit Persemakmuran Kurland sebagai pembenarannya."
 NSB_polish_fascist_events.401.desc.ukraine: "Polandia telah mendekati kami dengan proposal mengenai perbatasan mereka di masa depan setelah perang. Mengutip wilayah yang mereka kalahkan dari [Root.GetNameDef] dalam pakta Beck-Ribbentrop, pemerintah [From.GetAdjective] yakin bahwa mereka berhak atas beberapa revisi wilayah setelah perang dimenangkan.\n\nMereka berusaha untuk pindah ke arah timur menuju Belarus dan Ukraina, mengutip bekas wilayah Persemakmuran di Timur."
 NSB_polish_fascist_events.401.desc.blacksea: "Polandia telah mendekati kami dengan proposal mengenai perbatasan mereka di masa depan setelah perang. Mengutip wilayah yang mereka kalahkan dari [Root.GetNameDef] dalam pakta Beck-Ribbentrop, pemerintah [From.GetAdjective] yakin bahwa mereka berhak atas beberapa revisi wilayah setelah perang dimenangkan.\n\nMereka berusaha untuk pindah ke selatan menuju Krimea, dengan alasan ambisi lama Polandia yang membentang dari laut ke laut."
 NSB_polish_fascist_events.402.a: "Masa depan Polandia aman."
 NSB_polish_fascist_events.402.desc: "Proposal kami untuk perbatasan Polandia di masa depan telah diterima oleh [From.GetNameDef] dan wilayah yang kami klaim sudah terintegrasi dengan pemerintahan sipil kami. Meskipun kita mungkin tidak akan pernah melihat kembalinya negara-negara Barat, wilayah-wilayah baru ini telah memberikan lebih dari sekedar kompensasi atas tanah fisik yang diambil dari kita beberapa tahun sebelumnya."
 NSB_polish_fascist_events.5.a: "Inisiatif yang luar biasa."
 NSB_polish_fascist_events.5.b: "Menurutku tidak."
 NSB_polish_fascist_events.5.desc: "Sebuah aliansi yang didasarkan pada prinsip-prinsip Falangisme dan identitas Katolik, [From.GetNameDef] telah mengundang kami ke Falangist International. Menerima hal ini berarti kedua negara kita akan berjuang bersama di masa perang, dan juga akan memperkuat dan memberdayakan elemen-elemen Falangis dalam pemerintahan kita. Haruskah kita menerimanya?"
 NSB_polish_fascist_events.5.t: "[From.GetNameDefCap] Mengundang Kami ke Falangist International"
 NSB_polish_fascist_events.6.t: "Kerusuhan Warsawa"
 NSB_polish_fascist_events.6.desc: "Pemberdayaan dan agitasi yang terus-menerus dari kaum Falangis telah meletus menjadi serangkaian kerusuhan nasionalis di jalan-jalan Warsawa. Jelas terdorong oleh kesediaan [Root.GetLeader] untuk berkolaborasi dan mendukung ekstremis sayap kanan, para perusuh berbaris di jalan-jalan Warsawa, berakhir dengan kebuntuan di Kastil Warsawa. Perwira militer yang setia kepada faksi Sanacja di pemerintahan terbukti tidak mampu menghentikan massa saat mereka menyerbu ibu kota dan secara fisik mengusir [Root.GetLeader] dari gedung.\n\nKastil sudah dikosongkan dari seluruh kepemimpinan Sanacja, dan Bolesław Piasecki telah mendeklarasikan dirinya sebagai pemimpin negara Polandia yang baru."
 NSB_polish_fascist_events.6.a: "Semua sesuai rencana."
 NSB_polish_fascist_events.7.t: "Pemilu Nasional Polandia"
 NSB_polish_fascist_events.7.desc: "Dengan semakin banyaknya Sanacja yang mengadopsi kebijakan dan keyakinan Partai Nasional-Demokrat, banyak yang melihatnya hanya tinggal menunggu waktu saja sebelum republik ini kembali membuka pemilu nasional. Dengan ditandatanganinya Konstitusi Nasional Polandia yang ketiga, pemilihan umum telah dilanjutkan sekali lagi, namun dengan syarat bahwa partai-partai yang dianggap tidak patriotik tidak boleh memerintah.\n\nPartai-partai yang \"tidak patriotik\" mencakup PSL serta sebagian besar partai-partai besar sayap kiri dan tengah lainnya, sehingga para pemilih hanya mempunyai sedikit pilihan selain Partai Nasional-Demokrat. Partai Nasional-Demokrat menang dalam pemilu, dengan partai-partai pesaing seperti Sanacja hanya menerima sebagian kecil suara, sehingga ND memberikan kendali penuh atas Republik kepada ND."
 NSB_polish_fascist_events.7.a: "Saya suka demokrasi."
 nsb_news.1.a: "Buruh Polandia bangkit!"
 nsb_news.1.b: "Kami akan menghancurkan para pemula ini!"
 nsb_news.1.c: "Madonna, lindungi kami."
 nsb_news.1.d: "Perhatikan bagaimana Polandia memecah belah dirinya sendiri."
 nsb_news.1.e: "Apa dampaknya bagi Polandia?"
 nsb_news.1.desc: "Negara muda Polandia telah dilanda perang saudara! Pertikaian pemerintah selama beberapa dekade dan kurangnya investasi infrastruktur di wilayah pedesaan Polandia Timur berujung pada pemogokan umum dari kalangan kelas bawah pada awal tahun ini, dan perlakuan brutal yang terus berlanjut terhadap para pemogok oleh polisi dan militer telah memecah belah negara ini menjadi dua.\n\nPemerintahan kaum tani, dipimpin oleh [peasant_poland_target.GetLeader], didukung oleh faksi demokratis Front Morges dari militer Polandia dan koalisi kaum Marxis, sosialis, dan kaum liberal.\n\nDengan kekuatan loyalis yang terkonsolidasi di jantung industri Polandia, dan kaum tani di pedesaan Timur, Polandia terpecah belah oleh darah kaum tani."
 nsb_news.1.t: "Pemberontakan Petani di [peasant_poland_target.Capital.GetName]"
 nsb_news.2.a: "Ini merupakan penghinaan!"
 nsb_news.2.b: "Saya, misalnya, menyambut tuan Polandia kami yang baru."
 nsb_news.2.c: "Liberia hanyalah permulaan."
 nsb_news.2.d: "Polandia di Afrika?"
 nsb_news.2.f: "Satu lagi tindakan imperialisme yang tidak masuk akal."
 nsb_news.2.e: "Ini… tentu saja terlihat seperti imperialisme."
 nsb_news.2.desc.dem: "Polandia kini telah mengambil alih kekuasaan atas Liberia! Sejak tahun 1932, Liberia memandang Polandia sebagai mitra investasi pilihannya, karena percaya bahwa negara tersebut tidak mempunyai ambisi kolonial. Namun, perjanjian yang ditandatangani antara Polandia, Liberia, dan Liga Bangsa-Bangsa kini telah menjadikan Liberia tidak lebih dari sekedar boneka Polandia.\n\nPejabat AS mengecam keputusan tersebut, melihat kemerdekaan Liberia sebagai komponen penting dari prinsip-prinsip pendirian negara tersebut.\n\nLiga Maritim dan Kolonial Polandia memandang hal ini sebagai kemenangan luar biasa bagi ambisi kolonial Polandia, dan menyatakan bahwa hal ini bahkan tidak mendekati ambisi penuh Polandia Polandia di Afrika."
 nsb_news.2.desc.com: "Polandia kini telah mengambil alih kekuasaan atas Liberia! Sejak tahun 1932, Liberia memandang Polandia sebagai mitra investasi pilihannya, karena percaya bahwa negara tersebut tidak mempunyai ambisi kolonial. Namun, perjanjian ini kini telah membuat Liberia tidak lebih dari sekadar boneka Polandia.\n\nPejabat AS telah mengecam keputusan tersebut, melihat kemerdekaan Liberia sebagai komponen penting dari prinsip-prinsip pendirian negara tersebut.\n\n[POL.GetLeader] telah dituduh oleh sesama anggota KPP terlibat dalam kolonialisme, [POL.GetLeader.GetSheHe] bersumpah bahwa hal ini hanya untuk melindungi Liberia dari calon penjajah, meskipun banyak yang masih tidak yakin."
 nsb_news.2.t: "[LIB.GetAdjective] Protektorat Diumumkan"
 nsb_news.3.t: "Turkistan Bersatu!"
 nsb_news.3.desc: "Dengan seluruh wilayah Asia Tengah berada di bawah kendali [From.GetOldAdjective], masyarakat Turki telah bersatu di bawah kepemimpinan [From.GetLeader]. Pemerintahan Turki yang baru telah menyatakan bahwa [From.GetOldNameDef] sekarang akan dikenal sebagai [From.GetNameDef] dan merupakan rumah sah bagi semua masyarakat Turki.\n\nBahkan di luar perbatasan negara baru ini, banyak masyarakat Turki mulai menganggap [From.GetNameDef] sebagai rumah mereka yang sebenarnya dan [From.GetLeader] dapat mengambil kesempatan ini untuk memperluas negara mereka yang sedang berkembang."
 nsb_news.3.a: "Kita tidak lagi terpecah belah."
 nsb_news.3.b: "Menarik."
 nsb_news.4.t: "[POL.GetNameDefCap] Rebut Danzig!"
 nsb_news.4.desc: "Didirikan berdasarkan Perjanjian Versailles pada tahun 1920, Kota Bebas Danzig, hingga saat ini, merupakan negara merdeka di bawah perlindungan negara Polandia. Namun, dengan meningkatnya ketegangan di sekitar perbatasan Jerman-Polandia dan penolakan pemerintah Danzig untuk mengizinkan perdagangan Polandia melalui pelabuhan kota, pemerintah Polandia hari ini menyatakan bahwa Danzig bukan lagi kota bebas.\n\nJalan-jalan di Danzig sudah dipenuhi oleh tentara Polandia dengan misi tunggal untuk meningkatkan kekuasaan negara atas kota tersebut. Albert Forster dan banyak anggota partai Nazi lainnya bersembunyi, dan ada pembicaraan tentang pemberontakan dan akhirnya membelot ke [GER.GetNameDef]."
 nsb_news.4.a: "Tidak ada lagi kota yang ‘bebas’."
 nsb_news.4.b: "Apa selanjutnya? Remiliterisasi Rhineland?"
 nsb_news.4.c: "Kami mengharapkan yang lebih baik dari Polandia."
 nsb_news.4.d: "Mereka tidak akan bertahan lama di kota ini."
 nsb_news.4.e: "Menarik."
 nsb_news.5.t: "[POL.GetNameDefCap] Mahkota Raja!"
 nsb_news.5.desc.saxon: "Pada tanggal 5 November 1916, Wilhelm II dari Jerman dan Franz Joseph dari Austria menandatangani deklarasi bersama bahwa dari wilayah pendudukan Polandia di Rusia, sebuah Kerajaan baru akan lahir; Kerajaan Polandia. Namun, negara muda tersebut gagal menemukan Raja pada masanya dan Presiden saat itu mendeklarasikan Republik Polandia Kedua.\n\nNamun, tampaknya Polandia akhirnya menemukan dirinya sebagai Raja di [POL.GetLeader]! Margrave Meissen sekarang menjadi Raja Friedrich I dari Polandia. Meskipun ada kekhawatiran akan terjadinya perang dengan Jerman, dewan kabupaten Polandia menawarkan takhta kepada Margrave karena hubungan sejarah yang sudah lama ada antara Polandia dan kaum bangsawan Saxony."
 nsb_news.5.desc.romania: "Pada tanggal 5 November 1916, Wilhelm II dari Jerman dan Franz Joseph dari Austria menandatangani deklarasi bersama bahwa dari wilayah pendudukan Polandia di Rusia, sebuah Kerajaan baru akan lahir; Kerajaan Polandia. Namun, negara muda tersebut gagal menemukan Raja pada masanya dan Presiden saat itu mendeklarasikan Republik Polandia Kedua.\n\nNamun, tampaknya Polandia akhirnya menemukan dirinya sebagai Raja di [POL.GetLeader]! Dengan persahabatan dan aliansi yang sudah terjalin lama antara Polandia dan Rumania, nampaknya dewan kabupaten Polandia mempunyai ambisi untuk menjalin hubungan yang lebih erat dengan [ROM.GetNameDef]. Sebagai pewaris takhta Rumania, hanya masalah waktu saja sebelum kedua negara ini saling terkait erat."
 nsb_news.5.desc.cossack: "Pada tanggal 5 November 1916, Wilhelm II dari Jerman dan Franz Joseph dari Austria menandatangani deklarasi bersama bahwa dari wilayah pendudukan Polandia di Rusia, sebuah Kerajaan baru akan lahir; Kerajaan Polandia. Namun, negara muda tersebut gagal menemukan Raja pada masanya dan Presiden saat itu mendeklarasikan Republik Polandia Kedua.\n\nNamun, tampaknya Polandia akhirnya menemukan dirinya sebagai Raja di [POL.GetLeader]! Seorang Cossack, seorang bangsawan, dan seorang panglima perang, [POL.GetLeader] bukanlah seorang yang berhak atas takhta Polandia, namun tidak diragukan lagi ambisinya yang tak pernah padam untuk sebuah wilayah kekuasaan pribadi di Baltik sangat menarik bagi para menteri Polandia yang masih memegang ambisi pemulihan Persemakmuran di dalam hati mereka."
 nsb_news.5.desc.romanov: "Pada tanggal 5 November 1916, Wilhelm II dari Jerman dan Franz Joseph dari Austria menandatangani deklarasi bersama bahwa dari wilayah pendudukan Polandia di Rusia, sebuah Kerajaan baru akan lahir; Kerajaan Polandia. Namun, negara muda tersebut gagal menemukan Raja pada masanya dan Presiden saat itu mendeklarasikan Republik Polandia Kedua.\n\nNamun, tampaknya Polandia akhirnya menemukan dirinya sebagai Raja di [POL.GetLeader]! Sama seperti Jadwiga sebelumnya, Ratu telah memilih untuk mengadopsi 'Raja' sebagai gelarnya. Meskipun banyak yang meragukan bahwa dia adalah putri sebenarnya dari Tsar Nicholas II, dia tetap saja dinobatkan di Warsawa sebagai Raja Anastasia Romanov dari Polandia."
 nsb_news.5.desc.habsburg: "Pada tanggal 5 November 1916, Wilhelm II dari Jerman dan Franz Joseph dari Austria menandatangani deklarasi bersama bahwa dari wilayah pendudukan Polandia di Rusia, sebuah Kerajaan baru akan lahir; Kerajaan Polandia. Namun, negara muda tersebut gagal menemukan Raja pada masanya dan Presiden saat itu mendeklarasikan Republik Polandia Kedua.\n\nNamun, tampaknya Polandia akhirnya menemukan dirinya sebagai Raja di [POL.GetLeader]! Lahir dari keluarga bangsawan Habsburg, Karl Albrecht telah berjuang untuk militer Polandia hampir selama negara Polandia berdiri, dan hari ini, diiringi sorak-sorai orang banyak, ia terpilih sebagai Raja Habsburg Polandia yang pertama."
 nsb_news.5.a: "Hidup Raja!"
 nsb_news.5.b: "Sebuah kerajaan telah datang."
 nsb_news.5.c: "Kegilaan apa ini?"
 nsb_news.6.t: "Nasionalis Merebut Pemerintah Polandia"
 nsb_news.6.desc: "Endecja dan Falanga telah lama menjalin hubungan dengan pemerintah Polandia, namun kerja sama berkelanjutan Ignacy Mościcki dengan elemen sayap kanan ini akhirnya menjadi kejatuhannya. Dengan semakin besarnya pengaruh mereka dalam pemerintahan Polandia, [POL.GetLeader] kini telah menggantikan Mościcki sebagai Presiden Polandia yang baru.\n\nMasih harus dilihat apakah pemerintah nasionalis baru ini percaya bahwa mereka dapat menenangkan kekuatan asing yang bersaing untuk wilayahnya, atau mungkin akan ada aliansi baru yang akan segera hadir di Polandia."
 nsb_news.6.a: "Polandia terlahir kembali, lebih kuat."
 nsb_news.6.b: "Mengerikan sekali."
 nsb_news.7.t: "Mahkota [POL.GetAdjective] dan [From.GetAdjective] menyatu"
 nsb_news.7.desc: "Anehnya, [From.GetNameDef] dan [POL.GetNameDef] keduanya berada di bawah kekuasaan [POL.GetLeader]. Meskipun kedua negara masih terpisah untuk saat ini, adanya kepala negara yang sama berarti bahwa mereka terikat secara diplomatis.\n\nTampaknya persatuan pribadi ini akan segera berkembang menjadi penyatuan negara bagian [FROM.GetAdjective] dan [POL.GetAdjective], namun untuk saat ini persatuan tersebut tetap murni bersifat diplomatis."
 nsb_news.7.a: "Sebentar lagi kita akan menjadi satu."
 nsb_news.7.b: "Menarik."
 nsb_news.8.t: "Kerajaan Lituania"
 nsb_news.8.desc: "Pada tanggal 4 Juni 1918, Wilhelm Karl von Urach terpilih secara demokratis sebagai Raja Lituania dengan dukungan yang sangat besar, namun campur tangan Kekaisaran Jerman menyebabkan referendum dinyatakan batal dan Lituania tidak pernah bersatu dengan Rajanya. Meskipun demikian, Presiden Lituania hari ini telah menghapuskan kantornya sendiri dan mendeklarasikan Raja Mindaugas III sebagai kepala negara Kerajaan Lituania yang baru.\n\nDengan Antanas Smetona yang kini menjabat sebagai Perdana Menteri Lituania, negara ini telah menjadi monarki absolut dan tampaknya gelombang baru patriotisme dan jingoisme Lituania menyebar ke seluruh negara."
 nsb_news.8.a: "Negara lain jatuh ke dalam monarki."
 nsb_news.8.b: "Apa artinya ini bagi kita?"
 nsb_news.8.c: "Kerajaan hidup kembali!"
 nsb_news.8.d: "Menarik."
 nsb_news.9.t: "[GetSovietCivilWarName]!"
 nsb_news.9.desc_left: "Perang saudara kembali terjadi di Rusia. Dengan kenangan perang saudara terakhir yang masih segar dalam ingatan semua orang, agak mengejutkan jika hal ini bisa terjadi. Setelah bertahun-tahun pertikaian politik antara faksi Stalinis dan Trotskis, pemerintah Soviet akhirnya terpecah, dan kedua kelompok tersebut kini bertempur di jalanan untuk menguasai negara.\n\n[SOV.GetLeader] telah mendeklarasikan [SOV.GetLeader.GetHerselfHimself] sebagai pemimpin dari apa yang [SOV.GetLeader.GetSheHe] sebut [SOV.GetNameDef], dan memimpin perang melawan [SOS.Getleader] dari markas [SOV.GetLeader.GetHerHis] di [SOV.Capital.GetName]."
 nsb_news.9.desc_right: "Sekali lagi terjadi pertempuran terbuka di Soviet Rusia. Namun kali ini, yang terjadi bukanlah perang antara Bolshevik dan Kulit Putih, melainkan perang antara faksi-faksi yang bersaing di dalam partai komunis. [SOS.GetLeader] menguasai ibu kota, sedangkan pemberontak yang dipimpin oleh [SOV.GetLeader] bermarkas di sekitar [SOV.Capital.GetName]. Rumor beredar bahwa pemberontakan [SOV.GetLeader] disponsori oleh kekuatan asing, namun validitas rumor tersebut masih harus dilihat."
 nsb_news.9.desc_exiles: "Tanpa disangka-sangka, kekuatan kulit putih kembali bangkit melawan kaum Bolshevik. Perjuangan mereka mungkin tampak sia-sia, namun selama beberapa bulan terakhir ada beberapa laporan mengenai peningkatan kekuatan militer di Manchuria dan Siberia, dan dini hari tadi, pemerintahan sementara Rusia diproklamasikan di [SOV.capital.GetName].\n\nPemerintah [SOS.GetAdjective] segera memobilisasi Tentara Merah, dan sekali lagi Rusia terlibat dalam perang saudara. Negara-negara Barat sejauh ini tidak menunjukkan minat untuk melakukan intervensi dalam konflik tersebut. Namun masih harus dilihat bagaimana reaksi Jepang terhadap kejadian ini."
 nsb_news.9.a: "Menuju kemenangan!"
 nsb_news.9.b: "Bahwa hal itu akan menjadi seperti ini."
 nsb_news.9.c: "Komunis menghancurkan diri mereka sendiri."
 nsb_news.9.d: "[SOS.GetLeader] pasti akan menang."
 nsb_news.9.e: "Apa dampaknya bagi perjuangan komunis?"
 nsb_news.9.f: "Sekarang kita melihat kekerasan yang melekat dalam sistem ini!"
 nsb_news.9.g: "Kali ini mereka sendirian."
 nsb_news.9.h: "Mereka dipukul sekali, niscaya mereka akan hancur!"
 nsb_news.9.i: "Sebuah tujuan mulia, tapi bisakah mereka memenangkannya?"
 nsb_news.10.t: "Akhir dari [GetSovietCivilWarName]!"
 nsb_news.10.desc_stalinist: "Dengan menyerahnya unit pemberontak terakhir, [GetSovietCivilWarName] secara resmi berakhir. Dalam pidatonya yang bombastis kepada bangsa, [SOS.GetLeader] menyatakan dirinya sebagai insinyur kemenangan ini dan memuji keberanian dan kesetiaan Tentara Merah.\n\nDengan musuh internal yang dihancurkan untuk selamanya, [SOV.Getleader] dapat mulai mencari di tempat lain. Dampak jangka panjang dari kehancuran industri yang meluas dan hilangnya nyawa masih belum terlihat."
 nsb_news.10.desc_communist_opposition: "Penyerahan unit terakhir yang setia kepada [SOS.GetLeader] menandai berakhirnya [GetSovietCivilWarName]. [SOV.GetLeader] telah menyatakan [SOV.GetLeader.GetHerselfHimself] sebagai pemenang dan bersumpah akan membuat [SOV.GetNameDef] bangkit dari abu perang saudara dan kehancuran. Tugas ke depan sangat besar, dan situasi dunia masih belum jelas, namun [SOV.GetLeader.GetSheHe] bersikukuh bahwa era baru bagi [SOV.GetNameDef] dan dunia baru saja dimulai. Masih harus dilihat apakah [SOV.GetLeader.GetSheHe] dapat memenuhi deklarasi tersebut."
 nsb_news.10.desc_exiles: "Apa yang tampaknya mustahil dilakukan, yaitu pembaruan perjuangan melawan Bolshevik yang dilakukan oleh gerakan kulit putih di pengasingan, telah berubah menjadi kemenangan meskipun ada banyak rintangan. [SOV.GetLeader] menyatakan [SOS.GetNameDef] dikalahkan dan bersumpah untuk mengembalikan Rusia ke kejayaannya. Perang telah menghancurkan sebagian besar wilayah Rusia, dan sangat merugikan negara tersebut.\n\nKeberadaan [SOS.GetLeader] sejauh ini tidak diketahui. Rumor mengatakan bahwa [SOS.GetLeader.GetSheHe] melarikan diri dari negara itu beberapa hari sebelum penyerahan diri dan [SOS.GetLeader.GetSheHe] mungkin bersembunyi di suatu tempat di Amerika Selatan."
 nsb_news.10.desc_exiles_puppet: "Dengan bantuan Jepang, pemerintahan sementara Rusia berhasil mengalahkan [SOS.GetLeader] dan meraih kemenangan di [GetSovietCivilWarName]. Menjadi negara yang tunduk pada [JAP.GetNameDef] adalah harga yang mahal yang harus dibayar, dan membuat banyak orang bertanya-tanya apakah ini benar-benar merupakan kemenangan bagi kelompok kulit putih."
 nsb_news.10.a: "Kami menang!"
 nsb_news.10.b: "Sebuah pukulan telak bagi revolusi komunis."
 nsb_news.10.c: "Benar-benar mengejutkan."
 nsb_news.10.d: "Rusia di bawah kepemimpinan Stalin runtuh seperti rumah kartu."
 nsb_news.10.e: "Menyingkirkan Stalin mungkin adalah yang terbaik."
 nsb_news.10.f: "Sulit mempercayai para pemimpin baru ini."
 nsb_news.10.g: "Mungkin [SOV.GetLeader] lebih mudah untuk dipikirkan."
 nsb_news.11.t: "$SOV_iosif_stalin$ Dibunuh"
 nsb_news.11.desc: "Meskipun memiliki aparat keamanan yang ekstrim di sekelilingnya, pemimpin [SOV.GetNameDef], $SOV_iosif_stalin$ telah ditemukan tewas, mungkin dibunuh, di vilanya.  Ibu kota [SOV.GetAdjective] dipenuhi dengan rumor, dan tampaknya troika yang dipimpin oleh $SOV_lavrenty_beriya$ setidaknya telah mengambil alih kekuasaan untuk sementara waktu. Namun pemimpin baru ini tidak terlalu populer, sehingga masih harus dilihat apakah ia berhasil mempertahankan kekuasaan jika posisinya terancam. NKVD dilaporkan sedang melakukan penyelidikan ke segala arah, dan Beriya telah bersumpah untuk menemukan mereka yang bertanggung jawab atas pembunuhan tersebut."
 nsb_news.11.a: "Mungkinkah NKVD sebenarnya terlibat?"
 nsb_news.11.b: "Oh tidak!"
 nsb_news.12.t: "[SOV.GetAdjective] Kudeta"
 nsb_news.12.desc: "Dalam gerakan secepat kilat, oposisi [SOV.GetAdjective] telah menangkap dan menggulingkan troika pimpinan Beriya. Pasukan Tentara Merah mengepung ibu kota pada dini hari, sementara pasukan khusus secara diam-diam menangkap $SOV_lavrenty_beriya$ dan menyelundupkannya ke tempat yang aman sebelum pengawal pribadinya mengetahui apa yang terjadi. Pemerintahan baru telah dideklarasikan dengan [SOV.GetLeader] sebagai pemimpin negara yang baru, dan $SOV_lavrenty_beriya$ telah dituduh melakukan makar terhadap [SOV.GetNameDef]."
 nsb_news.12.a: "Ini adalah saat-saat yang menarik."
 nsb_news.12.b: "Segalanya berubah dari buruk menjadi lebih buruk."
 pavel_events.3.a: "Jika menghindari perang..."
 pavel_events.3.b: "Apakah ini semacam lelucon? TIDAK!"
 pavel_events.3.desc: "Sebuah telegram yang mengkhawatirkan telah tiba dari [From.GetNameDef] menuntut pemisahan segera \"bekas wilayah Polandia\". Wilayah yang mereka maksud antara lain Pomerania, Prusia, dan Silesia.\n\nNegara Polandia sedikit tidak dapat diprediksi sejak tahta diambil alih oleh [From.GetLeader], namun hanya sedikit yang dapat memperkirakan bahwa [From.GetLeader.GetSheHe] akan begitu berani untuk menuntut wilayah dari [Root.GetNameDef]."
 pavel_events.3.t: "[From.GetNameDefCap] Menuntut Jerman Timur!"
 pavel_events.301.a: "Tunggu, benarkah?"
 pavel_events.301.desc: "Akibat peristiwa yang tidak dapat diperkirakan sebelumnya, [From.GetNameDef] telah menyerah pada tuntutan [Root.GetLeader] dan menyerahkan wilayah Silesia, Pomerania, dan Prusia kepada [Root.GetNameDef]."
 pavel_events.301.t: "[From.GetNameDefCap] Lipatan"
 pavel_events.302.a: "Tuntutan kami akan dipenuhi di medan perang."
 pavel_events.302.desc: "Seperti yang diperkirakan, Jerman telah menolak tuntutan [Root.GetLeader], dan percaya bahwa tuntutan tersebut hanyalah lelucon belaka. Karena diplomasi gagal mempengaruhi [From.GetNameDef], [Root.GetLeader] telah menaiki kudanya dan melaju menuju perbatasan, secara pribadi membawa masalah ini ke tangan militer."
 pavel_events.302.t: "[From.GetNameCap] Menolak Menyerahkan Wilayah"
 NSB_poland_monarchist_events.6.t: "[From.GetNameDefCap] Menuntut Aneksasi kami"
 NSB_poland_monarchist_events.6.desc: "Mengutip kurangnya kemampuan pertahanan [Root.GetNameDef], pejabat dari [From.GetNameDef] menuntut agar keseluruhan [Root.GetNameDef] berada di bawah pendudukan langsung Polandia. Jelas didorong oleh ocehan tidak masuk akal dari Raja mereka \"Anastasia\", negara Polandia jelas telah memperoleh ambisi yang tidak pernah terpuaskan untuk penyatuan Slavia. Mereka menyatakan dengan tegas bahwa jika kita tidak menyerah, invasi tidak bisa dihindari. Bagaimana seharusnya kita menanggapinya?"
 NSB_poland_monarchist_events.6.a: "Kita harus menyerah."
 NSB_poland_monarchist_events.6.b: "Konyol! Kami menolak!"
 NSB_poland_monarchist_events.601.desc: "[From.GetNameDefCap] telah menerima permintaan terbaru kami untuk bergabung [Root.GetNameDef]. Pasukan [Root.GetAdjective] sudah membanjiri wilayah tersebut untuk menekan perlawanan lokal sebelum perlawanan terjadi. Melalui kemenangan besar ini, kami semakin dekat dengan ambisi kami untuk menyatukan Slavia."
 NSB_poland_monarchist_events.601.t: "[From.GetNameDefCap] Menerima!"
 NSB_poland_monarchist_events.602.desc: "Yang mengejutkan, pemerintah [From.GetAdjective] telah menolak permintaan kami untuk menyerahkan kendali wilayah Balkan kepada [Root.GetNameDef]. Upaya kami untuk menemukan solusi diplomatik telah gagal, dan hal ini kini menjadi urusan militer."
 NSB_poland_monarchist_events.601.a: "Itu benar-benar berhasil?"
 NSB_poland_monarchist_events.602.t: "[From.GetNameDefCap] Menolak!"
 NSB_poland_monarchist_events.602.a: "Peranglah saat itu."
 POL_habsburg_events.1.t: "[From.GetNameDefCap] Menuntut Aturan Habsburg!"
 POL_habsburg_events.1.desc: "Dengan [From.GetLeader] di atas takhta Polandia, Raja hari ini mengeluarkan ultimatum kepada [Root.GetLeader] untuk mundur sebagai penguasa Hongaria dan mendukung Otto von Habsburg. Meskipun keputusan tersebut dapat dianggap sebagai pelanggaran terhadap Perjanjian Trianon, tampaknya [From.GetLeader] tidak berniat menerima jawaban tidak."
 POL_habsburg_events.1.a: "Kita akan memiliki raja Habsburg."
 POL_habsburg_events.1.b: "Kami menolak."
 POL_habsburg_events.101.t: "[From.GetNameDefCap] Mahkota Habsburg"
 POL_habsburg_events.101.desc: "Tampaknya ultimatum kami kepada [From.GetNameDef] telah meyakinkan mereka untuk menobatkan Otto von Habsburg sebagai Raja Hongaria! Dengan Habsburg yang kini menguasai Hongaria dan Polandia, era baru pemerintahan Habsburg di seluruh Eropa sudah dekat."
 POL_habsburg_events.101.a: "Oh ya, semuanya datang bersamaan."
 POL_habsburg_events.102.t: "[From.GetNameDefCap] Menolak"
 POL_habsburg_events.102.desc: "Pemerintah Hongaria tampaknya sama sekali tidak terpengaruh dengan ultimatum untuk mengangkat Otto von Habsburg sebagai Raja Hongaria. Meskipun ultimatum kami mungkin gagal, masalah ini kini berada di tangan militer."
 POL_habsburg_events.102.a: "Saatnya untuk beberapa negosiasi agresif."
 POL_habsburg_events.2.t: "[From.GetNameDefCap] Mengusulkan Aliansi"
 POL_habsburg_events.2.desc: "Karena kedua negara kita diperintah oleh keluarga Habsburg, [From.GetLeader] telah mengusulkan agar [Root.GetNameDef] dan [From.GetNameDef] bergabung untuk melindungi kepentingan keluarga kerajaan Habsburg di seluruh Eropa."
 POL_habsburg_events.2.a: "Tentu saja kami akan bergabung."
 POL_habsburg_events.2.b: "Kami tidak tertarik."
 POL_habsburg_events.201.t: "[From.GetLeader] Menolak Pakta tersebut"
 POL_habsburg_events.201.desc: "Terlepas dari ikatan kekeluargaan kami, tampaknya [From.GetNameDef] sama sekali tidak tertarik untuk beraliansi dengan [Root.GetNameDef]."
 POL_habsburg_events.201.a: "Mungkin kita harus beralih ke Sekutu."
 NSB_soviet_paranoia_system_events.01.t: "[Root.GetLeader] prihatin dengan Faksionalisme"
 NSB_soviet_paranoia_system_events.01.desc: "Dalam sesi Komite Sentral baru-baru ini, Kamerad [Root.GetLeader] mencatat meningkatnya faksionalisme di dalam partai. Meskipun seluruh anggota komite dengan cepat meyakinkannya akan dukungan penuh dan tanpa syarat mereka, hal ini tampaknya tidak banyak meredakan kekhawatirannya. Menurut Kamerad [Root.GetLeader], kita harus selalu waspada terhadap para penyabot dan perusak yang berkomplot melawan negara, apapun posisi mereka.\n\nBerita ini mengejutkan banyak orang di partai, yang percaya bahwa ancaman perpecahan partai berakhir dengan pengasingan Trotsky."
 NSB_soviet_paranoia_system_events.01.a: "Apakah memang ada kekhawatirannya?"
 SOV_paranoia_system_intro_tt: "£SOV_paranoia_text_icon Sistem paranoia sekarang aktif."
 SOV_paranoia_system_nkvd_trait_tt: "Penasihat Politik dengan sifat §Y$head_of_the_nkvd$§! akan meningkatkan £SOV_paranoia_text_icon Paranoia Politik setiap minggunya."
 NSB_soviet_paranoia_system_events.11.t: "Penasihat Dituduh Melakukan Pengkhianatan"
 NSB_soviet_paranoia_system_events.11.desc: "Berdasarkan informasi anonim, NKVD telah menangkap [?ROOT.SOV_purged_character_for_loc.GetName] atas tuduhan spionase, sabotase, dan konspirasi melawan negara. Meskipun pria tersebut terus menyatakan dirinya tidak bersalah, para penyelidik yakin bahwa mereka dapat mengajukan kasus terhadapnya dalam beberapa minggu lagi. Entah dia akan melakukan interogasi, atau bukti yang cukup dapat dikumpulkan dari orang-orang di sekitarnya yang bersedia bersaksi tentang kejahatannya. Bagaimanapun juga, hukuman atas tuduhan ini pastilah berupa kematian atau kerja paksa seumur hidup."
 NSB_soviet_paranoia_system_events.11.a: "Tumor yang begitu dekat dengan jantung harus dipotong tanpa ampun."
 NSB_soviet_paranoia_system_events.11.b: "Kita tidak bisa menghukum seseorang hanya dengan bukti yang lemah!"
 NSB_soviet_paranoia_system_events.12.t: "Konspirasi di kalangan PNS"
 NSB_soviet_paranoia_system_events.12.desc: "NKVD telah menemukan bukti adanya konspirasi skala besar di dalam pemerintahan sipil. Tampaknya beberapa birokrat di Komite Perencanaan Negara bersikap sangat akrab dengan beberapa manajer pabrik dan menurunkan jumlah produksi dalam rencana lima tahun. Hal ini, menurut NKVD, adalah bukti nyata adanya sabotase anti-Soviet dan pelemahan sistem Soviet yang disengaja.\n\nPara konspirator yang ditangkap dengan cepat mengungkap lebih banyak anggota konspirasi saat diinterogasi."
 NSB_soviet_paranoia_system_events.12.a: "Korupsi ini harus diberantas."
 NSB_soviet_paranoia_system_events.12.b: "Ini adalah reaksi berlebihan yang tidak masuk akal."
 NSB_soviet_paranoia_system_events.13.t: "Ketidaksetiaan di NKVD?"
 NSB_soviet_paranoia_system_events.13.desc: "Sekelompok perwira junior NKVD telah mendekati [Root.GetLeader] dengan bukti bahwa ketua NKVD saat ini telah membuat rencana untuk mengambil alih kendali ibu kota 'jika terjadi kerusuhan besar'. Mereka percaya bahwa ini hanyalah tipu muslihat, dan rencana ini sebenarnya bertujuan untuk mengambil alih pemerintahan dengan kekerasan.\n\nSaat dihadapkan pada bukti tersebut, Ketua NKVD awalnya mencoba menjelaskan bahwa ini adalah rencana rutin yang sudah ada selama bertahun-tahun dan baru dimutakhirkan belakangan ini. Namun, setelah penyelidikan lebih lanjut dan interogasi menyeluruh, ia mengungkap keberadaan jaringan besar agen asing di dalam NKVD, yang bersekongkol dengan lembaga asing untuk menggulingkan pemerintah."
 NSB_soviet_paranoia_system_events.13.a: "Kejahatan yang tidak dapat diungkapkan dengan kata-kata ini harus dihukum berat."
 NSB_soviet_paranoia_system_events.13.b: "Tuduhan ini jelas dibuat-buat."
 NSB_soviet_paranoia_system_events.19.t: "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.19.desc_1: "Investigasi terhadap pembunuhan Kamerad Kirov pada tahun 1934 telah mengungkap banyak petunjuk yang mengarah pada konspirasi antara Zinoviev dan Trotsky. Setelah serangkaian penangkapan dan interogasi, bukti-bukti yang ada semakin kuat.\n\nSetelah pertemuan dengan [Root.GetLeader], Zinoviev dan Kamenev akhirnya mengaku bekerja dengan Trotsky untuk menggulingkan pemerintah, membunuh para pemimpin Soviet dan pada akhirnya memulihkan kapitalisme di Uni Soviet. Mereka kini diadili bersama 14 rekan konspiratornya. Tuduhan terhadap mereka sangat berat – hukuman berarti kematian."
 NSB_soviet_paranoia_system_events.19.desc_2: "Setelah persidangan kelompok pertama Trotskis dan teroris, penyelidikan oleh NKVD terus berlanjut dan mengungkap lebih banyak bukti. Karl Radek ditangkap dan akhirnya dibobol saat diinterogasi. Ia telah mengungkapkan adanya jaringan luas orang-orang yang sepenuhnya atau sebagian bekerja dengan Trotsky di hampir semua bidang pemerintahan, termasuk militer. Para pemimpinnya telah ditangkap dan mengaku saat diinterogasi.\n\nPara pemimpin ini, termasuk Radek, kini diadili. Kejahatan yang mereka lakukan lebih sedikit dibandingkan dengan apa yang didakwakan dalam persidangan terakhir – namun hukuman mati tentu saja bisa saja terjadi."
 NSB_soviet_paranoia_system_events.19.desc_3: "Investigasi sebelum Pengadilan Moskow Kedua juga mengungkap jaringan besar kaum Trotskis di kalangan militer dan pimpinan partai atas, yang dipimpin oleh Bukharin. Orang-orang ini telah ditangkap dan diinterogasi, di mana mereka telah mengakui kejahatan yang paling serius dan keji - mulai dari sabotase terencana hingga percobaan pembunuhan, berkonspirasi dengan kekuatan asing dan bahkan mencampurkan paku ke dalam mentega untuk melukai atau membunuh warga negara Soviet.\n\nJika terbukti bersalah, hukuman atas kejahatan ini hampir pasti adalah hukuman mati dengan cara ditembak."
 NSB_soviet_paranoia_system_events.19.desc_4: "Agen NKVD telah mengungkap konspirasi baru yang meresahkan yang melibatkan beberapa anggota partai kami. Yang lebih mengkhawatirkan lagi adalah, setelah beberapa kali penangkapan dan interogasi yang mendalam, nama-nama beberapa mantan anggota Bolshevik terungkap. Penyelidikan lebih lanjut telah mengungkapkan bukti bahwa sejumlah orang yang diduga sebagai konspirator memang terlibat dalam tindakan sabotase, faksionalisme, dan tindakan anti-Soviet. Orang-orang ini telah diadili dan sekarang menunggu keputusannya. Dilihat dari dakwaan terhadap mereka, hukuman tidak diragukan lagi berarti hukuman yang sangat berat."
 NSB_soviet_paranoia_system_events.19.a: "Sekelompok pengkhianat lainnya diadili."
 NSB_soviet_paranoia_system_events.19.b: "Revolusi tidak boleh dibiarkan menghancurkan dirinya sendiri."
 NSB_soviet_paranoia_system_events.21.t: "Jenderal [?ROOT.SOV_purged_character_for_loc.GetName] Dituduh Makar"
 NSB_soviet_paranoia_system_events.21.desc: "Sebagai bagian dari penyelidikan terhadap kaum Trotskyis di militer, NKVD telah menemukan bukti bahwa Jenderal [?ROOT.SOV_purged_character_for_loc.GetName], di masa lalu, telah membuat beberapa komentar kritis terhadap Kamerad [Root.GetLeader] dan menunjukkan kontribusi besar yang diberikan Lev Trotsky terhadap revolusi selama perang saudara. Selama interogasi, [?ROOT.SOV_purged_character_for_loc.GetName] awalnya menyatakan kekaguman dan kesetiaannya kepada [ROOT.GetLeader], namun akhirnya retak dan mengungkapkan bahwa dia telah dihubungi oleh agen Trotskis untuk membentuk sel kontra-revolusioner di dalam militer, yang akan melakukan tindakan sabotase terhadap Tentara Merah."
 NSB_soviet_paranoia_system_events.21.a: "Tidak ada tempat di Angkatan Darat untuk orang-orang seperti itu."
 NSB_soviet_paranoia_system_events.21.b: "Jelas sekali ada semangat yang berlebihan dalam penyelidikan."
 NSB_soviet_paranoia_system_events.22.t: "Konspirasi di Akademi"
 NSB_soviet_paranoia_system_events.22.desc: "Seorang informan anonim mengungkap keberadaan sekelompok mahasiswa di salah satu akademi militer paling bergengsi kita. Kelompok ini, nampaknya, telah memutuskan untuk mempelajari lebih dari sekedar tugas kuliah yang disetujui dan telah mendiskusikan ide-ide para ahli teori yang dipermalukan dan reaksioner. Masih belum jelas dari mana mereka mendapatkan tulisan orang-orang ini, namun penyelidikan menyeluruh dan interogasi terhadap para pemimpinnya pasti akan segera menghasilkan nama."
 NSB_soviet_paranoia_system_events.22.a: "Kita perlu memastikan loyalitas semua pemimpin masa depan."
 NSB_soviet_paranoia_system_events.22.b: "Akademi adalah tempat untuk bertanya, dan kita tidak boleh mencegahnya."
 NSB_soviet_paranoia_system_events.23.t: "Kampanye Anti-Sabotase"
 NSB_soviet_paranoia_system_events.23.desc: "Laporan dari latihan besar terbaru menunjukkan persentase kendaraan yang terjatuh secara signifikan karena kerusakan mekanis, serta cedera pada anggota baru. Laporan-laporan ini telah sampai ke meja Kamerad [Root.GetLeader], yang sangat prihatin dengan kemungkinan sabotase yang dilakukan oleh anggota angkatan bersenjata. Dia ingin mengetahui bagaimana tank baru ini bisa mengalami kerusakan mekanis hanya setelah beberapa hari berada di lapangan tanpa perawatan."
 NSB_soviet_paranoia_system_events.23.a: "Kita perlu melakukan penyelidikan penuh untuk menangkap pelakunya!"
 NSB_soviet_paranoia_system_events.23.b: "Ini adalah kejadian umum di militer modern."
 NSB_soviet_paranoia_system_events.24.t: "[?ROOT.SOV_accuser_character_for_loc.GetName] Menuduh [?ROOT.SOV_accused_character_for_loc.GetName]"
 NSB_soviet_paranoia_system_events.24.desc: "Sebuah laporan telah sampai ke komando tinggi Angkatan Darat. Dalam laporan tersebut, [?ROOT.SOV_accuser_character_for_loc.GetName] menuduh rekannya Jenderal [?ROOT.SOV_accused_character_for_loc.GetName] melakukan kelalaian tugas yang sangat serius. Menurut [?ROOT.SOV_accuser_character_for_loc.GetName], [?ROOT.SOV_accused_character_for_loc.GetName] telah bersekongkol dengan unsur asing dan reaksioner untuk menyampaikan informasi kepada intelijen asing. Dia lebih lanjut mencatat banyaknya kecelakaan pelatihan yang terjadi di bawah komando [?ROOT.SOV_accused_character_for_loc.GetName], dan menyatakan bahwa ini sebenarnya adalah tindakan sabotase yang dilakukan oleh jenderal penipu dan rekan konspiratornya di Angkatan Darat. Para konspirator tersebut telah membuktikan tuduhan tersebut setelah interogasi ekstensif."
 NSB_soviet_paranoia_system_events.24.a: "[?ROOT.SOV_accused_character_for_loc.GetName] harus menghadapi keadilan."
 NSB_soviet_paranoia_system_events.24.b: "Ini adalah taktik transparan yang dilakukan [?ROOT.SOV_accuser_character_for_loc.GetName] untuk menyelamatkan dirinya sendiri."
 NSB_soviet_paranoia_system_events.24.c: "Akhiri penyelidikan tanpa putusan."
 NSB_soviet_paranoia_system_events.28.t: "Pembersihan Besar-besaran Perwira Muda Angkatan Darat"
 NSB_soviet_paranoia_system_events.28.desc: "Laporan berdatangan dari jaringan luas perwira yang sangat kritis terhadap penanganan [Root.GetLeader] dalam urusan militer. Mereka yang ditangkap atas tuduhan penghasutan, sabotase, dan pemikiran anti-Soviet dengan cepat mengungkapkan nama-nama orang lain dalam jaringan tersebut selama interogasi. Meskipun sudah lama ada kecurigaan mengenai kesetiaan para Jenderal, hal ini menunjukkan bahwa mungkin bahkan Mayor dan Kolonel pun tidak bisa dipercaya."
 NSB_soviet_paranoia_system_events.28.a: "Kita tidak bisa membiarkan kebusukan terjadi."
 NSB_soviet_paranoia_system_events.28.b: "Tuduhan-tuduhan ini hanya melebih-lebihkan masalah-masalah kecil."
 NSB_soviet_paranoia_system_events.29.t: "Pembersihan Besar-besaran - Pengadilan Para Jenderal"
 NSB_soviet_paranoia_system_events.29.desc: "Bukti bahwa terdapat jaringan Trotskis yang besar di Angkatan Darat semakin berkembang dengan cepat. Setiap hari, NKVD menangkap tersangka baru yang terlibat dalam pengakuan sebelumnya. Orang-orang ini sering kali mengungkapkan nama-nama rekan konspirator selanjutnya. Butuh waktu untuk melacak semua Jenderal yang menjadi bagian dari konspirasi ini, namun jelas bahwa daftar di bawah ini mewakili sebagian besar dari mereka, yang kesalahannya telah dibuktikan dengan pengakuan mereka."
 NSB_soviet_paranoia_system_events.29.a: "Semua pengkhianat harus membayar harga tertinggi."
 NSB_soviet_paranoia_system_events.29.b: "Ini adalah penjagalan yang tidak masuk akal!"
 NSB_soviet_paranoia_system_events.30.t: "Pembersihan Reguler Angkatan Laut"
 NSB_soviet_paranoia_system_events.31.t: "Laksamana [?ROOT.SOV_purged_character_for_loc.GetName] Dituduh Melakukan Pengkhianatan"
 NSB_soviet_paranoia_system_events.31.desc: "Seorang perwira staf Laksamana [?ROOT.SOV_purged_character_for_loc.GetName] telah menghubungi NKVD untuk melaporkan sejumlah aktivitas mencurigakan. Menurut perwira tersebut, [?ROOT.SOV_purged_character_for_loc.GetName] disambut dengan sangat hangat oleh perwira angkatan laut selama kunjungan pelabuhan baru-baru ini di luar negeri dan mungkin menggunakan kesempatan ini untuk menyampaikan informasi rahasia kepada mereka. Selain itu, terdapat bukti adanya sel-sel Trotskyis di beberapa pelabuhan yang dikunjungi Laksamana, yang memungkinkan dia berkonspirasi dengan Trotsky melawan negara jika dia mau."
 NSB_soviet_paranoia_system_events.31.a: "Tidak ada tempat di Angkatan Laut untuk orang-orang seperti itu."
 NSB_soviet_paranoia_system_events.33.desc: "Laporan berdatangan dari berbagai pangkalan angkatan laut, mencatat adanya sedikit peningkatan dalam jumlah suku cadang yang diminta untuk perbaikan mendesak pada beberapa kapal kami. Meskipun laporan-laporan menyatakan bahwa kerusakan-kerusakan ini disebabkan oleh keausan rutin serta saat latihan, NKVD tidak begitu yakin. [Root.GetLeader] memiliki kepentingan pribadi dalam masalah ini dan menginginkan penyelidikan menyeluruh atas tuduhan sabotase apa pun."
 NSB_soviet_paranoia_system_events.38.t: "Pembersihan Besar-besaran Perwira Muda Angkatan Laut"
 NSB_soviet_paranoia_system_events.38.desc: "Menyusul laporan dari para pejabat politik tentang aktivitas yang tidak biasa di armada tersebut, NKVD telah meluncurkan penyelidikan penuh dan menemukan bukti adanya jaringan besar perwira yang sangat kritis, bahkan bermusuhan, terhadap sistem Soviet. Meskipun sebagian besar dari mereka menyatakan kesetiaannya kepada [Root.GetLeader] dan Uni Soviet, jelas bahwa mereka dapat dengan mudah diubah menjadi mata-mata oleh lembaga asing. Memang benar, interogasi telah mengungkapkan bahwa beberapa dari mereka telah dipekerjakan oleh negara-negara kapitalis untuk memata-matai kita, dan mereka dengan cepat mengungkapkan lebih banyak nama."
 NSB_soviet_paranoia_system_events.39.t: "Pembersihan Besar-besaran - Pengadilan Para Laksamana"
 NSB_soviet_paranoia_system_events.39.desc: "Penyelidikan terhadap pusat Trotskis di dalam militer telah dengan jelas menunjukkan bahwa kelompok ini sangat mengakar di Angkatan Laut. Sebagian besar, jika tidak semua, Laksamana di Angkatan Laut sangat curiga karena mereka mempunyai kesempatan untuk berkonspirasi dengan unsur asing saat ditugaskan di luar negeri. Sejauh ini, setiap Laksamana berpangkat tinggi yang ditangkap oleh NKVD telah mengakui kejahatan yang sangat berat, termasuk spionase dan sabotase, hanya setelah beberapa hari diinterogasi. Dengan semakin banyaknya perwira Angkatan Laut yang terlibat dalam konspirasi ini, jelas bahwa untuk memberantasnya memerlukan penyelidikan yang sangat menyeluruh."
 NSB_soviet_paranoia_system_events.42.desc: "Inspeksi baru-baru ini di Angkatan Udara mengungkapkan serangkaian kecelakaan dan kecelakaan yang mengejutkan selama pelatihan. Selain itu, sejumlah besar pesawat paling modern kita tidak sepenuhnya mampu menjalankan misi dan sedang menunggu perawatan. Bagaimana keadaan ini bisa terjadi masih belum jelas, namun [Root.GetLeader], karena khawatir akan adanya sabotase, menuntut penyelidikan penuh."
 NSB_soviet_paranoia_system_events.48.t: "Bubarkan Biro Desain"
 NSB_soviet_paranoia_system_events.48.desc: "NKVD telah menemukan bukti bahwa anggota pimpinan di salah satu biro desain kami telah menyampaikan informasi kepada lembaga asing. Selain itu, karya desain terbaru mereka penuh dengan kekurangan sehingga prototipe memerlukan pengerjaan ulang dan pengulangan yang ekstensif agar dapat terbang, sehingga menimbulkan spekulasi bahwa ini adalah tindakan sabotase. NKVD saat ini sedang menginterogasi para perancang dan insinyur, dan penyelidik utama yakin bahwa dia akan mendapat pengakuan dalam beberapa hari."
 NSB_soviet_paranoia_system_events.48.a: "Kita tidak bisa membiarkan unsur-unsur subversif berkumpul dengan cara ini."
 NSB_soviet_paranoia_system_events.48.b: "Pekerjaan mereka terlalu penting."
 NSB_soviet_paranoia_system_events.49.t: "Jenderal Angkatan Udara terlibat"
 NSB_soviet_paranoia_system_events.49.desc: "Peningkatan pengawasan terhadap Angkatan Udara telah membuahkan hasil. Penyelidik NKVD berhasil mendapatkan pengakuan dari sejumlah perwira junior yang menunjuk pada Jenderal berpangkat tinggi yang telah memerintahkan pelatihan berulang kali dalam cuaca buruk, yang menyebabkan kecelakaan yang dapat diprediksi dan peningkatan pemeliharaan yang mengurangi kesiapan Angkatan Udara secara keseluruhan. Alasan mereka melakukan hal tersebut masih belum jelas, namun penyelidik NKVD yakin bahwa mereka akan mendapatkan jawabannya dalam beberapa hari."
 NSB_soviet_paranoia_system_events.49.a: "Mereka harus bertanggung jawab."
 NSB_soviet_paranoia_system_events.49.b: "Mereka hanya melakukan pekerjaan mereka."
