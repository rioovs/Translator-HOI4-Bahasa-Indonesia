l_braz_por:
 BALTIC_events.1.t: "[From.GetNameDefCap] Mencari Jaminan"
 BALTIC_events.1.d: "Sebuah telegram dari [From.GetNameDef] dikirimkan ke [Root.GetLeader] pagi ini meminta agar [Root.GetNameDef] memperbarui jaminan kemerdekaan [From.GetAdjective]. Mengutip persahabatan lama antara [Root.GetNameDef] dan [From.GetNameDef] sejak berdirinya negara ini pada tahun 1918, [From.GetLeader] menegaskan bahwa kelangsungan hidup negara [From.GetLeader.GetHerHis] sangat penting untuk melanjutkan perdamaian di Eropa Timur.\n\nDengan ketegangan yang muncul antara [From.GetNameDef] dan [SOV.GetNameDefCap], menerima Usulan [From.GetLeader] dapat menyebabkan [Root.GetNameDef] bertentangan dengan [SOV.GetAdjective]…"
 BALTIC_events.1.a: "Kami akan membela teman [From.GetAdjective] kami."
 BALTIC_events.1.b: "Kami tidak mendukung pemerintah [From.GetLeader] atau [From.GetLeader.GetHerHis]."
 BALTIC_events.101.t: "[From.GetNameDefCap] Menerima!"
 BALTIC_events.101.d: "[From.GetLeader] telah mengumumkan dukungan [From.GetHerHis] untuk kelanjutan kemerdekaan [Root.GetAdjective] dan akan bergabung dalam konflik apa pun yang mengancam keberlangsungan [Root.GetNameDef]."
 BALTIC_events.101.a: "Kami aman."
 BALTIC_events.102.t: "[From.GetNameDefCap] Menolak!"
 BALTIC_events.102.d: "Yang membuat [Root.GetLeader] kecewa, kantor luar negeri [From.GetAdjective] telah memutuskan untuk tidak menjalin hubungan militer dengan [Root.GetNameDef]."
 BALTIC_events.102.a: "Kita harus mencari solusi lain."
 BALTIC_events.2.t: "[From.GetNameDefCap] Mencari Kerjasama Baltik"
 BALTIC_events.2.d_baltic: "Kabinet [From.GetLeader] dan [From.GetHerHis] telah mendekati pemerintah [Root.GetAdjective] dengan proposal untuk meresmikan Entente Baltik yang terorganisir secara longgar menjadi aliansi militer. Menandatangani perjanjian ini berarti bahwa, pada masa perang, militer kita akan bersatu dan menghadapi ancaman terhadap kedaulatan kita bersama-sama.\n\nMeskipun bersifat defensif, [From.GetLeader] berharap untuk pada akhirnya memformalkan Entente Baltik menjadi sebuah faksi yang terbentang dari Riga hingga Oslo, meskipun ambisi seperti itu tampaknya tidak mungkin terjadi."
 BALTIC_events.2.d_scandi: "Kabinet [From.GetLeader] dan [From.GetHerHis] telah mendekati pemerintah [Root.GetAdjective] dengan proposal untuk meresmikan Entente Baltik yang terorganisir secara longgar menjadi aliansi militer. Menandatangani perjanjian ini berarti bahwa, pada saat perang, militer kita akan bersatu dan menghadapi ancaman terhadap kedaulatan kita bersama-sama.\n\n[From.GetLeader] menegaskan bahwa ketika ancaman di perbatasan mereka telah mengalahkan apa yang mereka inginkan dari negara-negara Baltik, Skandinavia pasti akan menjadi target perang berikutnya dan kita sebaiknya tetap bersatu dalam masa konflik global seperti ini."
 BALTIC_events.2.a: "Kami akan bergabung!"
 BALTIC_events.2.b: "Saya pikir kami memiliki pilihan yang lebih baik."
 BALTIC_events.202.a: "Beraninya mereka menolak kita!"
 BALTIC_events.203.t: "Entente Baltik Ditinggalkan!"
 BALTIC_events.203.d: "Gagal mengumpulkan cukup dukungan untuk menahan invasi [SOV.GetAdjective], [From.GetLeader] telah memutuskan untuk meninggalkan gagasan Entente Baltik dan mencari opsi lain. Yang sangat mengecewakan bangsa kita adalah impian untuk melawan tentara [SOV.GetAdjective] bersama teman-teman kita di [From.GetNameDef] akan tetap seperti itu; sebuah mimpi."
 BALTIC_events.203.a: "Mengecewakan."
 BALTIC_events.3.t: "[From.GetNameDefCap] Meminta Intervensi Langsung"
 BALTIC_events.3.d: "Perang saudara antara tentara rakyat [From.GetLeader] dan proletariat sesat yang berjuang demi kediktatoran borjuis [From.GetNonIdeologyName] terus berkecamuk, namun nampaknya [From.GetLeader] terbukti tidak mampu memimpin revolusi menuju kemenangan sendirian. Sebuah pesan dikirimkan ke meja [Root.GetLeader] dari duta besar [Root.GetAdjective] di [From.GetNonIdeologyName], mengungkapkan keprihatinan tentang masa depan kaum revolusioner [From.GetAdjective]. Ia percaya bahwa jika perang saudara ini dikalahkan, maka ini akan mengakhiri harapan keberhasilan sosialisme di [From.GetNonIdeologyName]."
 BALTIC_events.3.a: "Tindakan langsung diperlukan!"
 BALTIC_events.3.b: "Kaum proletar hanya bisa membebaskan diri mereka sendiri."
 BALTIC_events.301.t: "[From.GetNameDefCap] Menolak Intervensi"
 BALTIC_events.301.d: "Teman dan sekutu kita di [From.GetNameDef] telah menjawab permohonan [Root.GetLeader] untuk melakukan intervensi langsung dengan menolak masuk. [From.GetLeader] mengklaim bahwa jika pekerja [Root.GetAdjective] ingin dibebaskan, mereka harus melakukannya sendiri dan intervensi langsung apa pun atas nama [From.GetNameDef] akan dianggap sebagai tindakan imperialisme."
 BALTIC_events.301.a: "[From.GetLeader.GetSheHeCap] ada benarnya."
 BALTIC_events.4.t: "Komunis Berbaris pada [Root.Capital.GetName]!"
 BALTIC_events.4.d: "Masyarakat [Root.GetAdjective] semakin frustrasi terhadap pemerintah dan saat ini, di jalanan [Root.Capital.GetName], ketegangan telah mencapai titik didih. Protes yang menyuarakan ketidakpuasan terhadap rezim dan perlakuan terhadap warga kelas bawah menyebabkan beberapa bentrokan dengan polisi militer [Root.GetAdjective], dan para pengunjuk rasa akhirnya mencapai gedung parlemen [Root.Capital.GetName] selama sesi yang diadakan oleh [Root.GetLeader] dan beberapa anggota penting Partai [Root.GetRulingParty]. Tuntutan para pengunjuk rasa cukup jelas; menggulingkan [Root.GetLeader] dan [Root.GetLeader.GetHerHis] [Root.GetRulingParty] Partai dari pemerintahan, atau menghadapi revolusi yang penuh kekerasan."
 BALTIC_events.4.a: "Kami tidak punya pilihan."
 BALTIC_events.4.b: "Turun tahta? Tidak pernah!"
 BALTIC_events.5.t: "[From.GetNameDefCap] Berusaha Mendirikan [From.GetNonIdeologyName]-Belarus"
 BALTIC_events.5.d: "Mengambil inspirasi dari RSK Lituania-Belarusia yang berumur pendek di masa lalu, [From.GetLeader] berupaya menyatukan [From.GetNameDef] dengan RSK Belarusia. [From.GetLeader.GetSheHeCap] mengklaim bahwa penyatuan kedua negara akan memperluas kemampuan [From.GetNameDef] untuk mendukung revolusi global dengan menghilangkan penghalang antara Timur dan Barat."
 BALTIC_events.5.a: "Ide yang menginspirasi!"
 BALTIC_events.5.b: "Belarus akan tetap [Root.GetAdjective]."
 BALTIC_events.501.t: "[From.GetNameDefCap] Setuju!"
 BALTIC_events.501.d: "Kabar telah kembali dari [From.GetNameDef] sehubungan dengan permintaan [Root.GetAdjective] untuk membentuk [Root.GetNonIdeologyName]-SSR Belarusia yang bersatu. [From.GetLeader] sangat antusias dengan peluang yang muncul dari penyatuan antara Eropa Timur daratan dan negara Baltik, dan mengklaim bahwa penyatuan tersebut pasti akan menjembatani kesenjangan antara Timur dan Barat, sehingga mengurangi kemampuan untuk menyebarkan revolusi ke seluruh benua."
 BALTIC_events.501.a: "[Root.GetNonIdeologyName] tumbuh lebih besar!"
 BALTIC_events.502.t: "[From.GetNameDefCap] Menolak!"
 BALTIC_events.502.d: "Meskipun RSK Lituania-Belarusia yang asli didirikan untuk menjembatani kesenjangan antara Timur dan Barat, tampaknya [From.GetLeader] tidak lagi menganggap hal seperti itu perlu dan mengklaim bahwa Belarus adalah bagian integral dari Uni Soviet yang tidak dapat diserahkan kepada [Root.GetNameDef]."
 BALTIC_events.502.a: "Setidaknya kami mencoba."
 BALTIC_events.503.t: "Perang Propaganda di Belarus"
 BALTIC_events.503.d: "Mencoba untuk merebut kembali warisan RSK Lituania-Belarus, [From.GetNameDef] berupaya untuk menggoyahkan pemerintahan di Belarus dengan mendorong anggota pemerintah Belarusia untuk membelot ke [From.GetNonIdeologyName]!"
 BALTIC_events.503.a: "Kami akan segera membereskannya."
 BALTIC_events.6.t: "[From.GetNameDefCap] Mencari Penyatuan Baltik"
 BALTIC_events.6.d: "Negara-negara Baltik telah lama mengalami penderitaan dan penindasan bersama di bawah pengaruh imperialisme asing, namun sekarang tidak lebih dari itu. [Root.GetNameDefCap] dan [From.GetNameDef] sama-sama dibebaskan di bawah sosialisme, namun [From.GetLeader] mengklaim bahwa hal ini tidak menjamin kelangsungan kelangsungan hidup negara-negara Baltik. [From.GetLeader.GetSheHeCap] mengklaim bahwa meskipun negara-negara Baltik masih terpecah belah berdasarkan garis nasional, kita menjadikan diri kita lemah dan rentan terhadap imperialisme dan kapitalisme, dan hanya dengan bersatu menjadi Republik Baltik Bersatu kita dapat menahan serangan gencar penjajah asing."
 BALTIC_events.6.a: "[From.GetLeader] benar, kita harus bersatu!"
 BALTIC_events.6.b: "Tidak mungkin! [Root.GetNonIdeologyName] tetap [Root.GetAdjective]!"
 BALTIC_events.601.t: "[From.GetNameDefCap] Menolak!"
 BALTIC_events.601.d: "[From.GetLeader] telah menanggapi permintaan [Root.GetAdjective] untuk bersatu dengan rasa jijik dan penolakan. Meskipun banyak yang menghormati hak [From.GetNameDef] untuk memiliki pemerintahan sendiri, tidak dapat disangkal bahwa negara-negara Baltik akan lebih baik jika bersatu dibandingkan negara yang terpecah belah."
 BALTIC_events.601.a: "Kami akan menyelamatkan mereka dari diri mereka sendiri."
 BALTIC_events.601.b: "Bagaimanapun, mereka punya hak untuk menentukan nasib sendiri."
 BALTIC_events.7.t: "[From.GetNameDefCap] Meminta Invasi [baltic_wargoal_target.GetAdjective]"
 BALTIC_events.7.d: "[From.GetNameDefCap], pintu gerbang [Root.GetAdjective] ke Eropa Barat hari ini mengusulkan rencana untuk menyerang [baltic_wargoal_target.GetNameDef] atas nama [Root.GetNameDefCap]. [From.GetLeader] mengklaim bahwa invasi [baltic_wargoal_target.GetAdjective] akan sangat berharga dalam upaya bersama kita untuk menyebarkan revolusi ke seluruh Eropa dan akan membuka lebih banyak peluang untuk ekspansi setelah pemerintahan [baltic_wargoal_target.GetAdjective] dibubarkan."
 BALTIC_events.7.a: "Terinspirasi!"
 BALTIC_events.7.b: "Revolusi bisa menunggu."
 BALTIC_events.701.t: "[From.GetNameDefCap] Memblokir [baltic_wargoal_target.GetAdjective] Invasi"
 BALTIC_events.701.d: "Permintaan [Root.GetAdjective] untuk menyerang [baltic_wargoal_target.GetNonIdeologyName] telah diblokir oleh [From.GetNameDef]. Mengutip bahwa invasi akan memakan biaya besar dan sama sekali tidak sebanding dengan nyawa [From.GetAdjective] dan [Root.GetAdjective], [baltic_wargoal_target.GetNameDef] tidak akan menghadapi kekuatan revolusioner komunis saat ini."
 BALTIC_events.701.a: "Oh baiklah..."
 BALTIC_events.11.t: "Propaganda Saudara Hutan"
 BALTIC_events.11.d: "Sejumlah publikasi anti-komunis telah sampai ke tangan warga [Root.GetAdjective] di seluruh negara kita. Propaganda ini menyerang karakter [Root.GetLeader], mengkarakterisasi [Root.GetLeader.GetHerHim] sebagai pengkhianat dan aset [SOV.GetAdjective]. Sifat publikasi ini mengagungkan nasionalisme [Root.GetAdjective], menolak nilai-nilai internasional dari revolusi komunis. Tidak diragukan lagi, sentimen nasionalis akan diperkuat oleh distribusi bawah tanah dari publikasi-publikasi ini."
 BALTIC_events.11.a: "Pengkhianat!"
 BALTIC_events.12.t: "Penggerebekan Saudara Hutan Besar di [forest_brothers_raid_state_target.GetName]"
 BALTIC_events.12.d: "Mereka datang entah dari mana, menyerang beberapa kawasan industri besar di [forest_brothers_raid_state_target.GetName], menyebabkan kerusakan parah pada peralatan di dalamnya. Untungnya, penyerangan tersebut terjadi pada malam hari saat pabrik-pabrik tutup, namun kerugian terhadap properti negara sangat besar."
 BALTIC_events.12.a: "Pengkhianat kelas, semuanya."
 BALTIC_events.13.t: "Pertempuran dengan Forest Brothers"
 BALTIC_events.13.d: "Saat berpatroli di [forest_brothers_raid_state_target.GetName], pasukan garnisun disergap oleh serangan Forest Brother. Meskipun kerusakan yang dialami oleh pihak kami tidak terlalu besar, berita tentang pertempuran tersebut dengan cepat menyebar di kalangan penduduk setempat, dan banyak yang mulai melihat Forest Brothers sebagai pejuang nasionalisme [Root.GetAdjective], yang menantang legitimasi [Root.GetLeader] sebagai pemimpin."
 BALTIC_events.13.a: "Bingungkan mereka!"
 BALTIC_events.14.t: "Peralatan Siphon Saudara Hutan"
 BALTIC_events.14.d: "Selama beberapa minggu terakhir, sejumlah senapan dan peralatan militer lainnya telah hilang dari jalur produksi, keluar dari pabrik tanpa pernah sampai ke tangan Tentara Merah [Root.GetAdjective]. Sumber peralatan yang hilang ini terungkap adalah Forest Brothers. Meskipun pemerintah kini sudah mengetahui pelaku kejahatan ini, diperlukan waktu beberapa minggu untuk memperketat kendali jalur produksi dan memastikan tidak ada satu peluru pun yang masuk ke dalam laras senapan Forest Brother."
 BALTIC_events.14.a: "Kami akan mengakhiri para pengkhianat ini!"
 BALTIC_events_7_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Finlandia§!'."
 BALTIC_events_8_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Denmark§!'."
 BALTIC_events_9_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Swedia§!'."
 BALTIC_events_10_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Polandia§!'."
 BALTIC_events_15_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Lituania§!'."
 BALTIC_events_16_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Latvia§!'."
 BALTIC_events_17_tt: "Mendapat acara '§Y[Root.GetNameDefCap] Meminta Invasi Estonia§!'."
 BALTIC_events.18.t: "Perang Propaganda"
 BALTIC_events.18.d: "[From.GetNameDefCap] telah mulai mempengaruhi politik [Root.GetAdjective], menyebarkan propaganda komunis melalui jalan-jalan dan mempersenjatai para pembangkang. Hanya dengan melawan propaganda ini kita bisa mempunyai harapan untuk langsung melarangnya dan menghilangkan ancaman [From.GetAdjective]."
 BALTIC_events.18.a: "[Root.GetNameDefCap] tidak akan pernah menjadi komunis!"
 BALTIC_events.19.t: "[SOV.GetNameDefCap] mempercayakan [BALTIC_country_to_transfer.GetNonIdeologyName] kepada kami."
 BALTIC_events.19.desc: "Ini adalah hari yang menyenangkan untuk [ROOT.GetNameDef]! Setelah kampanye gagah berani yang dilakukan oleh kamerad-kamerad kita, [SOV.GetNameDefCap] telah dengan tepat menyatakan bahwa [BALTIC_country_to_transfer.GetNonIdeologyName] yang baru dibebaskan, bersama dengan para pekerjanya yang berani, akan berada di bawah yurisdiksi kita.[GetExtraBalticTerritories]\n\nHal ini membawa kita selangkah lebih dekat ke Negara Baltik yang bersatu dan cukup kuat untuk melawan musuh-musuh kelas pekerja."
 BALTIC_events.19.extra: "Selain itu, mereka juga telah mengalihkan kendali atas wilayah [BALTIC_loose_territory_country.GetNonIdeologyAdjective] yang mereka duduki kepada kami, sehingga kami harus terus membuktikan bahwa kami layak menjadi pengawas tetap [BALTIC_loose_territory_country.GetNonIdeologyName]."
 BALTIC_events.19.a: "Itu pilihan yang wajar!"
 BALTIC_entente_events.1.t: "[From.GetNonIdeologyName] Berinvestasi di Uni Baltik"
 BALTIC_entente_events.1.d: "Sebagai pemimpin Uni Baltik, [From.GetNameDef] telah mendanai inisiatif baru untuk negara-negara anggota serikat tersebut. Pendanaan ini saling menguntungkan bagi [Root.GetNameDef] dan [From.GetNameDef] dan menunjukkan komitmen terhadap kelanjutan kebebasan dan pembangunan bangsa kita!"
 BALTIC_entente_events.1.a: "Kita tumbuh lebih kuat bersama-sama."
 BALTIC_entente_events.1.b: "Kesempatan untuk memulihkan demokrasi!"
 BALTIC_entente_events.6.t: "[From.GetNonIdeologyName] Mengusulkan Unifikasi"
 BALTIC_entente_events.6.d: "Entente Baltik telah berkembang cukup pesat sejak awal berdirinya sebagai aliansi longgar antara negara-negara Baltik. Kini, negara-negara Baltik begitu saling terkait secara politik sehingga mereka menjadi satu negara yang hampir sama. Tampaknya [From.GetLeader] mengusulkan agar persatuan ini berkembang menjadi sebuah negara yang utuh, menyatukan Negara-negara Baltik dalam pemerintahan militer dan sipil."
 BALTIC_entente_events.6.a: "Inisiatif yang luar biasa!"
 BALTIC_entente_events.6.b: "Sama sekali tidak!"
 LIT_events.1.t: "Partisi [SOV.GetAdjective]-[LIT.GetAdjective] dari [POL.GetNameDef]"
 LIT_events.1.d: "Sangat jelas bahwa [LIT.GetLeader] berupaya menyatukan kembali negara bagian [LIT.GetAdjective] dengan ibu kota lamanya, Vilnius. Jelas tidak memberikan ancaman yang besar terhadap [POL.GetNameDef], [LIT.GetAdjective] berusaha untuk membagi negara dengan [Root.GetNameDef], dengan [POL.GetAdjective] Ukraina dan Belarus bergabung dengan [Root.GetNameDefCap] dan Vilnius kembali ke [LIT.GetNameDef].\n\n[POL.GetNameDefCap] tentu saja dapat menolak ultimatum bersama dan penolakan tersebut akan mengakibatkan dalam keadaan perang antara [POL.GetNameDef] dan [Root.GetNameDef]."
 LIT_events.1.a: "Saran yang bagus!"
 LIT_events.1.b: "Kami tidak akan menandatangani perjanjian apa pun dengan [LIT.GetLeader]."
 LIT_events.101.t: "Ultimatum [SOV.GetAdjective]-[LIT.GetAdjective]"
 LIT_events.101.d: "Sejak tahun 1920, Wilno berada di bawah kendali [Root.GetNameDef], yang membuat [LIT.GetNameDef] semakin kesal karena menganggap kota tersebut sebagai ibu kota negara mereka yang sah. Namun ketegangan telah mencapai titik didih dan dengan bantuan dari [SOV.GetLeader], pihak Lituania kini menuntut agar Polandia Timur dibagi antara [SOV.GetAdjective] dan Lituania. Jika kami menerima, kami akan menyerahkan keseluruhan Polandia Timur, namun jika kami menolak; kita akan menjadi target utama koalisi [SOV.GetAdjective]-[LIT.GetAdjective]."
 LIT_events.101.a: "Kami menyerah!"
 LIT_events.101.b: "Bukan tanpa perlawanan!"
 LIT_events.102.t: "[From.GetNameDefCap] Menerima!"
 LIT_events.102.d: "[SOV.GetNameDefCap] telah setuju untuk bergabung dengan kami dalam pembagian [POL.GetNameDef], dan yang tersisa sekarang hanyalah menyampaikan tuntutan kami ke [POL.GetAdjective]."
 LIT_events.102.a: "Vilnius ada dalam genggaman kita!"
 LIT_events.103.t: "[From.GetNameDefCap] Menolak!"
 LIT_events.103.d: "[SOV.GetNameDefCap] telah menolak untuk bergabung dengan kami dalam pembagian [POL.GetNameDef], dan meskipun kami masih bebas untuk berperang dengan [POL.GetNameDef], para menteri kami yakin perang seperti itu akan mengakibatkan kekalahan."
 LIT_events.103.a: "Bingungkan mereka!"
 LIT_events.104.t: "[POL.GetNameDefCap] Menolak!"
 LIT_events.104.d: "Meskipun ada banyak rintangan yang menghadang mereka, [POL.GetNameDef] menolak untuk tunduk pada tuntutan kami!"
 LIT_events.104.a: "Perang itu!"
 LIT_events.104.b: "Ini adalah upaya yang lebih besar daripada manfaatnya."
 LIT_events.2.t: "[From.GetNameDefCap] Meminta Perdamaian"
 LIT_events.2.d: "Meskipun tidak ada konflik bersenjata selama beberapa tahun, [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName] secara teknis tidak pernah menandatangani perjanjian damai formal apa pun. [From.GetLeader] hari ini meminta agar [From.GetNameDef] dan [Root.GetNameDef] mengakhiri permusuhan mereka dan terus maju sebagai sekutu melawan meningkatnya ancaman di perbatasan bersama mereka. Meskipun [From.GetLeader] masih mengklaim Wilno sebagai ibu kota [From.GetNonIdeologyName] yang sah, [From.GetLeader.GetSheHe] telah menyatakan bahwa demi kepentingan terbaik kedua negara untuk secara resmi meletakkan senjata mereka dan mendeklarasikan keadaan damai."
 LIT_events.2.a: "[From.GetLeader.GetSheHeCap] ada benarnya."
 LIT_events.2.b: "Saya rasa tidak."
 LIT_events.201.d: "[From.GetLeader] tampaknya setuju dengan sentimen yang dianut oleh para menteri [Root.GetAdjective] dan telah memutuskan untuk memasuki keadaan damai dengan [Root.GetNameDef] untuk saat ini. Bersamaan dengan perdamaian ini muncul pula jaminan kemerdekaan bersama. Di masa perang, kita dapat mengandalkan teman-teman kita di [From.GetNameDef] untuk membantu kita!"
 LIT_events.201.a: "Luar biasa!"
 LIT_events.202.d: "[From.GetNameDefCap] telah menolak menandatangani perjanjian damai formal apa pun dengan [Root.GetNameDef]. Perang dingin ini tampaknya akan terus berlanjut tanpa batas waktu."
 LIT_events.202.a: "Yah, mungkin kita tidak akan menerima jawaban tidak."
 LIT_events.3.t: "[From.GetNameDefCap] Meminta Perdamaian Permanen"
 LIT_events.3.d: "Inti perselisihan antara [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName] selama dekade terakhir adalah pendudukan [Root.GetAdjective] di ibu kota tradisional [From.GetNonIdeologyName], Vilnius. Kini kedua negara berada dalam hubungan baik, [From.GetLeader] mengusulkan keadaan perdamaian abadi dengan syarat [Root.GetNameDef] menyerahkan kendali atas Vilnius dan melepaskan semua klaim atas wilayah [From.GetAdjective]. Penolakan akan mengecewakan, namun tidak akan mengakibatkan [From.GetNonIdeologyName] berperang dengan [Root.GetNameDef], klaim [From.GetLeader]."
 LIT_events.3.a: "Kedengarannya masuk akal."
 LIT_events.3.b: "Sungguh tidak masuk akal."
 LIT_events.301.d: "Akhirnya, kesepakatan damai telah dicapai antara [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName], dan konflik yang sering kali berlangsung tanpa suara sejak dimulainya [Root.GetNameDef] tampaknya telah berakhir. Meskipun ambisi Persemakmuran masih ada di hati banyak [From.GetAdjective], kami yakin ini adalah Persemakmuran jenis baru; yang didasarkan pada rasa saling menghormati antar sekutu."
 LIT_events.301.a: "Damai di zaman kita!"
 LIT_events.302.d: "[From.GetLeader] telah menolak untuk mengakui klaim [Root.GetNameDef] atas ibu kota bersejarah [Root.GetAdjective]. Meskipun hal ini tidak akan mengakhiri hubungan damai antara kedua negara, tidak diragukan lagi bahwa hal ini telah menghidupkan kembali rasa ketidakpercayaan [Root.GetNameDef] terhadap mantan musuhnya."
 LIT_events.302.a: "Mengecewakan."
 LIT_events.4.t: "[From.GetNameDefCap] Menawarkan Hak Mendasarkan!"
 LIT_events.4.d: "Takut akan invasi, para menteri [From.GetNameDef] telah menawarkan untuk mengizinkan pasukan [Root.GetAdjective] menempatkan diri mereka di dalam perbatasan [From.GetNonIdeologyName]. Sebagai imbalannya, pemerintah [From.GetAdjective] mengharapkan [Root.GetNameDef] untuk melindungi mereka dari siapa pun yang dapat mengancam kedaulatan mereka, meskipun dengan pasukan yang sudah berada di dalam perbatasan mereka, [From.GetNameDef] tidak akan berdaya untuk menolak tuntutan [Root.GetAdjective]…"
 LIT_events.4.a: "Kedengarannya seperti peluang emas!"
 LIT_events.4.b: "Saya rasa tidak."
 LIT_events.401.d: "[From.GetNameDefCap] telah menolak tawaran murah hati kami dengan alasan bahwa mereka tidak ingin terlibat dalam konflik apa pun atas nama [Root.GetNonIdeologyName]."
 LIT_events.5.t: "[From.GetNameDefCap] Tuntutan [784.GetName]"
 LIT_events.5.desc: "Sejak serangan Vilna pada tahun 1919, ibu kota tradisional Lituania telah berada di tangan [Root.GetNameDef], dan hal ini telah menjadi titik pertikaian antara kedua negara dalam beberapa dekade berikutnya.\n\nPerang dingin telah terjadi di kota ini, dan saat ini [From.GetLeader] telah mengancam bahwa jika kota ini tidak diserahkan kepada [From.GetNameDef], maka akan terjadi perang tak terelakkan.\n\nKota ini hanya berguna bagi kita, namun kota ini mewakili nafas terakhir Persemakmuran di masa lalu, dan apakah kita benar-benar bersedia menyerahkan impian Polandia-Lithuania demi perdamaian?"
 LIT_events.5.a: "Ini adalah kota yang tidak berguna. Ambillah."
 LIT_events.5.b: "Kami tidak akan pernah menyerah."
 LIT_events.501.t: "Vilnius Kembali!"
 LIT_events.501.desc: "[From.GetNameDefCap] telah menyetujui pengembalian Vilnius secara damai, menandai berakhirnya secara resmi perang dingin yang telah berlangsung selama beberapa dekade antara kedua negara. Dengan kembalinya Vilnius, Lituania akhirnya kembali utuh."
 LIT_events.502.desc: "Tidak mengherankan, [From.GetNameDef] telah menolak tuntutan [Root.GetLeader] untuk menyerahkan Vilnius kembali ke [Root.GetNameDef]. Meskipun diplomasi telah gagal, [Root.GetLeader] belum mengesampingkan kemungkinan terjadinya perang, dan dengan meningkatnya ketegangan di perbatasan, perang tampaknya tidak dapat dihindari."
 LIT_events.502.a: "Perang? Saya menyebutnya negosiasi agresif."
 LIT_events.6.t: "[From.GetNameDefCap] Mengusulkan Liga Supremasi Polandia-Lithuania"
 LIT_events.6.d: "Sebuah telegram tiba dari [From.Capital.GetName] hari ini menyampaikan proposisi bahwa [Root.GetNonIdeologyName] dan [From.GetNonIdeologyName] bersatu menjadi faksi baru, yang mampu menyaingi [GER.GetNameDef] dan [SOV.GetNameDef]. Ketika negara-negara nasionalis terjebak di antara dua kekuatan ini, kedua negara secara diplomatis terisolasi dari kekuatan-kekuatan besar di Eropa, dan kekuatan-kekuatan demokratis di barat akan enggan untuk ikut dalam konflik demi membela dua negara fasis.\n\n[From.GetLeader] mengusulkan alternatif terhadap konflik bertahun-tahun yang menjadi ciri hubungan [Root.GetAdjective]-[From.GetAdjective] sejak awal berdirinya negara mereka. [From.GetLeader.GetSheHeCap] mengusulkan agar negara kita bersatu menjadi Liga Supremasi Polandia-Lithuania; sebuah aliansi yang didirikan berdasarkan prinsip-prinsip Persemakmuran, tetapi menghargai nilai-nilai nasionalisme."
 LIT_events.6.a: "Sungguh terinspirasi!"
 LIT_events.6.b: "Saya rasa tidak."
 LIT_events.601.t: "[From.GetNameDef] Bergabung dengan Liga"
 LIT_events.601.d: "Tidak mengherankan jika Polandia setuju untuk bergabung dengan Liga Supremasi Polandia-Lituania. Meskipun ini bukan visi terakhir Lituania mengenai nasib Polandia, hal ini menandai langkah penting pertama dalam mengamankan masa depan Baltik."
 LIT_events.601.a: "Semuanya datang bersamaan."
 LIT_events.602.t: "[From.GetNameDefCap] Menolak Liga"
 LIT_events.602.d: "Yang mengejutkan para menteri [Root.GetAdjective], [From.GetNameDef] telah menolak untuk bergabung dengan Liga Supremasi Polandia-Lituania. Tampaknya ketegangan antara kedua negara masih belum bisa diredakan, dan penolakan untuk bekerja sama ini kemungkinan besar akan mengakibatkan kembalinya konflik kekerasan dalam waktu dekat."
 LIT_events.602.a: "Mungkin mereka harus diyakinkan."
 LIT_events.7.t: "[From.GetNameDefCap] Permintaan [POL.GetAdjective] Masuk ke [Root.GetFactionName]"
 LIT_events.7.d: "Aktif dalam upaya kerja sama [From.GetAdjective]-[POL.GetAdjective], menteri luar negeri [From.GetAdjective] hari ini telah mendekati pejabat [Root.GetAdjective] untuk meminta agar [POL.GetNameDef] diundang ke [Root.GetFactionName]."
 LIT_events.7.a: "Saran yang bagus!"
 LIT_events.7.b: "Kami punya rencana lain untuk Polandia."
 LIT_events.701.t: "[From.GetNameDefCap] Blok [POL.GetAdjective] Masuk ke [From.GetFactionName]"
 LIT_events.701.d: "Sedihnya, nampaknya para pemimpin [From.GetFactionName] memandang masuknya [POL.GetAdjective] ke dalam [From.GetFactionName] secara aktif menghalangi kepentingan terbaik fraksi. Jelas, [From.GetNameDef] punya rencana lain untuk [POL.GetNameDef]."
 LIT_events.701.a: "Oh baiklah."
 LIT_events.8.t: "[From.GetNameDefCap] Seruan untuk Unifikasi"
 LIT_events.8.d: "Para pejabat [Root.GetAdjective] telah lama berusaha untuk menciptakan kembali Persemakmuran lama, tetapi mereka selalu ditolak oleh orang Lituania. Namun, [From.GetLeader] hari ini telah membuat keputusan bersejarah untuk mengusulkan reunifikasi Polandia dan Lituania. Namun yang membingungkan, usulan ini tidak menempatkan warga Polandia dan Lituania pada posisi yang sama, bahkan usulan tersebut akan menjadikan [From.GetLeader] sebagai diktator mutlak bagi kedua negara."
 LIT_events.8.a: "Ini adalah pengorbanan yang ingin saya lakukan."
 LIT_events.8.b: "Tidak mungkin."
 LIT_events.801.t: "[From.GetNameDefCap] Menerima!"
 LIT_events.801.d: "[From.GetLeader] telah menanggapi permintaan reunifikasi [Root.GetAdjective] dengan mundur sebagai diktator Polandia dan menyerahkan kekuasaan kepada [Root.GetLeader]. Persemakmuran bersatu kembali, ini menandai evolusi bersejarah dalam masa depan bersama [From.GetNameDef] dan [Root.GetNameDef]."
 LIT_events.801.a: "Luar biasa."
 LIT_events.802.t: "[From.GetNameDefCap] Menolak"
 LIT_events.802.d: "Tampaknya Polandia belum siap untuk bersatu kembali dengan [Root.GetNameDef]. Terlepas dari upaya [Root.GetNameDefCap] untuk membingkai serikat pekerja sebagai pemulihan Persemakmuran lama, para menteri [From.GetAdjective] tampaknya sama sekali tidak tergerak."
 LIT_events.802.a: "Mungkin pihak Polandia harus diyakinkan."
 LIT_events.9.t: "[From.GetNameDefCap] Meminta Pekerjaan Polandia"
 LIT_events.9.d: "Mengutip sejarah kerja sama yang panjang antara Polandia dan Lituania, [From.GetLeader] menyatakan bahwa pendudukan [Root.GetFactionName] di Polandia tidak akan terjadi apa-apa jika berada di bawah administrasi tunggal [From.GetNameDef]. Melakukan hal ini berarti mengorbankan sumber daya berharga yang disediakan Polandia, namun hal ini berarti perlawanan Polandia akan menjadi masalah Lituania."
 LIT_events.9.a: "Saya tidak mengerti mengapa tidak."
 LIT_events.9.b: "Kami tidak setuju."
 LIT_events.901.t: "[From.GetNameDefCap] Menyerahkan Pekerjaan Polandia"
 LIT_events.901.d: "Permintaan [Root.GetAdjective] untuk menguasai pendudukan Polandia disambut dengan sukses dari [From.GetNameDef]. [From.GetAdjective] jenderal dan tentara kembali ke [From.GetNonIdeologyName] untuk didistribusikan kembali ke seluruh upaya perang saat tentara [Root.GetAdjective] mengambil tempat di garnisun di wilayah yang sebelumnya dikuasai Polandia."
 LIT_events.901.a: "Kemuliaan bagi Lituania!"
 LIT_events.902.t: "[From.GetNameDefCap] Menolak"
 LIT_events.902.d: "Permintaan [Root.GetAdjective] untuk menguasai pendudukan Polandia ditanggapi dengan penolakan langsung dari [From.GetNameDef]. Upaya untuk mengambil kendali atas pendudukan Polandia telah diabaikan sebagai upaya atas nama [Root.GetLeader] untuk mengendalikan zona industri utama Polandia, dan melemahkan klaim [From.GetAdjective] atas wilayah Polandia."
 LIT_events.902.a: "Itu patut dicoba."
 LIT_events.10.t: "Perang Saudara Falang"
 LIT_monarchy_events.1.t: "Dilema Dua Raja"
 LIT_monarchy_events.1.desc: "Dengan raja-raja yang duduk di atas takhta Polandia dan Lituania, ambisi penyatuan Persemakmuran secara damai tampaknya sangat tidak mungkin terjadi. Namun, dengan kedua negara yang kini selaras secara ideologis, mungkin ada jalan lain ke depan. Jika kami memilih untuk melakukannya, kami dapat menawarkan [POL_or_LIT_target.GetLeader] aliansi kedua negara kami sebagai semacam upaya diplomasi ulang terhadap Persemakmuran. Bersama-sama, kita mungkin maju sebagai teman, tetapi jika kita berpisah, kita harus jatuh sebagai musuh."
 LIT_monarchy_events.1.a: "Aliansi sepertinya lebih baik."
 LIT_monarchy_events.1.b: "Hanya ada satu!"
 LIT_monarchy_events.101.t: "[From.GetLeader] Menolak Perdamaian"
 LIT_monarchy_events.101.desc: "Terlepas dari upaya kami untuk mencapai solusi damai, [From.GetLeader] menolak untuk menjalin hubungan baik dengan negara kami, dengan menyatakan \"Hanya ada satu Raja [From.GetNonIdeologyName]\". Tampaknya perang dengan [From.GetNameDef] kini tidak bisa dihindari."
 LIT_monarchy_events.101.a: "Sangat tidak beradab."
 LIT_monarchy_events.2.t: "Raja Mindaugas III"
 LIT_monarchy_events.2.desc: "Pada tanggal 4 Juni 1918, Wilhelm Karl von Urach terpilih secara demokratis sebagai Raja Lituania dengan dukungan yang sangat besar, namun campur tangan Kekaisaran Jerman menyebabkan referendum dinyatakan batal dan Lituania tidak pernah bersatu dengan Rajanya. Namun, mendiang Raja memiliki seorang putra dan dengan pemerintahan Jerman atas Lituania kini tinggal kenangan, [Root.GetLeader] telah mengundang Karl Gero von Urach untuk menjadi raja baru Lituania!\n\nKerajaan muda ini telah dinobatkan sebagai Mindaugas III dan meskipun ia saat ini hanya menjalankan peran seremonial, terdapat rencana untuk memberdayakan monarki Lituania yang baru."
 LIT_monarchy_events.2.a: "Hidup Raja!"
 LIT_monarchy_events.2_tt: "§YMindaugas III§! menjadi Raja [Root.GetNonIdeologyName]. Sedangkan §Y[Root.GetLeader]§! akan tetap menjadi ketua [Root.GetRulingParty]"
 LAT_events.1.t: "Musuh Sejati"
 LAT_events.1.d: "Meski merdeka, [Root.GetNameDef] tidak pernah benar-benar berhasil melepaskan diri dari rantai imperialisme di negaranya. [GER.GetAdjective] dan [SOV.GetAdjective] sama-sama memiliki ambisi dan rencana untuk menjebak [Root.GetNameDef] ke dalam kerajaannya masing-masing tanpa peduli terhadap hak [Root.GetNameDef] untuk menentukan nasib sendiri. Meskipun banyak pihak yang ingin berperang di semua lini untuk mempertahankan kemerdekaan [Root.GetAdjective], kita harus memutuskan siapa di antara kedua kekuatan ini yang merupakan ancaman paling mendesak dan mengambil tindakan yang tepat untuk mempersiapkan invasi."
 LAT_events.1.a: "[SOV.GetNameDefCap] adalah ancaman sebenarnya!"
 LAT_events.1.b: "Kami tidak bisa mempercayai [GER.GetNameDef]."
 LAT_events.8.t: "Latvia dalam Api"
 LAT_events.8.d: "Keputusan pemerintah untuk mencabut larangan terhadap kelompok fasis Thunder Cross telah membuat Gustavs Celmiņš dan para pendukungnya semakin berani dan semakin aktif dan melakukan kekerasan di seluruh Latvia. Saat ini, kekerasan ini memuncak ketika Pērkonkrust mempersenjatai diri dan bergerak menuju Rīga, menuntut pemerintah Latvia segera menyerah.\n\nMeskipun jelas bahwa pemerintah berniat bekerja sama dengan Pērkonkrust, tampaknya kelompok tersebut tidak berniat memasukkan [Root.GetLeader] ke dalam rezim mereka."
 LAT_events.8.a: "Kami akan menghancurkan para pengkhianat ini!"
 LAT_events.8.b: "Untuk Latvia yang lebih kuat!"
 nsb_coup.0.t: "Konspirasi di Korps Perwira?"
 nsb_coup.0.desc: "Meskipun sudah menjadi rahasia umum bahwa beberapa Jenderal kita tidak senang dengan situasi di [Root.GetNameDef], nampaknya beberapa dari mereka mungkin sudah mulai mempertimbangkan langkah-langkah yang lebih drastis untuk menyelesaikan perbedaan kita. Telah terjadi sejumlah pertemuan antara berbagai petugas di lokasi yang tidak diketahui, diyakini berada di suatu tempat di [?.Root.meeting_location.GetName].\n\nDetailnya jarang, tapi kami punya alasan untuk meyakini bahwa [coup_member_1.GetName] dan [coup_member_2.GetName] termasuk di antara kelompok tersebut. Yang terakhir ini diyakini berhubungan dengan [coup_member_3.GetName], meskipun sifat pasti dari hubungan mereka tidak jelas."
 nsb_coup.0.a: "Kita harus menyelesaikan masalah ini sampai tuntas."
 nsb_coup.1.t: "[Root.GetLeader] mengambil alih Pemerintahan"
 nsb_coup.1.desc: "Setelah berminggu-minggu melakukan perencanaan yang cermat, sekelompok petugas di bawah [Root.GetLeader] hari ini telah melaksanakan [Root.GetOperationName], sebuah rencana untuk mengambil kendali pemerintah.\n\nPeriode persiapan yang panjang telah membuahkan hasil, karena unit yang setia kepada [Root.GetLeader] dapat dengan cepat menguasai semua gedung penting pemerintah. Penjaga setempat dan satuan polisi, yang menghadapi rintangan besar, menyerah tanpa melepaskan tembakan. Penghalang jalan di sekitar ibu kota membuat menteri-menteri pemerintah berusaha melarikan diri.\n\nDengan pemerintahan sebelumnya kini aman dalam tahanan, [Root.GetLeader] menyerahkan [Root.GetNameDef] lainnya dengan fait accompli. Diharapkan pemerintah daerah akan segera mengambil tindakan."
 nsb_coup.1.a: "Saya, misalnya, menyambut penguasa baru kita."
 #translation notes: these are names and shouldn't be translated - non-latin alphabets may however transcribe them
 GER_operation_1: "Walküre Unternehmen"
 GER_operation_2: "Unternehmen Schleifstein"
 GER_operation_3: "Unternehmen Stierkampf"
 GER_operation_4: "Unternehmen Erzengel"
 USA_operation_1: "Operasi Sengatan Matahari"
 USA_operation_2: "Operasi Karnaval"
 USA_operation_3: "Operasi Tempat Tinta"
 USA_operation_4: "Operasi Kucing Liar"
 ENG_operation_1: "Operasi Rapier"
 ENG_operation_2: "Operasi Ikan Manis"
 ENG_operation_3: "Operasi Pelawak"
 ENG_operation_4: "Keunggulan Operasi"
