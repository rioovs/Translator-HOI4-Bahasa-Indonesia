l_braz_por:
 # News events 
 bba_news.0.t: "Berakhirnya Liga Bangsa-Bangsa"
 bba_news.0.desc: "Dengan deklarasi perang terhadap [?global.LoN_defender_country.GetNameDef] oleh [?global.LoN_attacker_country.GetNameDef], Liga Bangsa-Bangsa telah gagal dalam upayanya menjaga perdamaian. [?global.LoN_attacker_country.GetLeader] secara terbuka mengejek ketidakmampuan Liga untuk melakukan apa pun, dan dengan itu mengeluarkan [?global.LoN_attacker_country.GetHerHis] negara dari Liga. Ketika para pemimpin dunia lainnya juga mempertanyakan tujuan Liga Bangsa-Bangsa jika Liga Bangsa-Bangsa tidak dapat mencegah konflik, hari-hari Liga secara de facto sudah berakhir.\nSementara dewan terus melakukan pertemuan, tidak ada seorang pun yang berharap dewan dapat mencapai hasil apa pun lagi. Otoritas apa pun yang pernah dimiliki dewan kini sudah lama hilang."
 bba_news.0.a: "Tidak sepenuhnya tidak terduga"
 # Italo-Ethiopian War events 
 BBA_italo_ethiopian_war_events.01.t: "Akhiri Serangan Natal"
 BBA_italo_ethiopian_war_events.01.desc: "Pasukan kita terhenti dalam perang melawan Abyssinia, bahkan didesak mundur di tempat-tempat tertentu. \"Serangan Natal\" ini membuat Mussolini secara pribadi memarahi komando tinggi militer karena ketidakmampuan mereka. Duce menginginkan hasil. Sekarang.\n\nOleh karena itu, Dia telah mengizinkan segala cara yang diperlukan untuk mengusir bangsa Abyssinia dan mengakhiri perang ini dengan cepat - apa pun yang diperlukan."
 BBA_italo_ethiopian_war_events.01.a: "Dengan cara apapun yang diperlukan"
 BBA_italo_ethiopian_war_events.01.b: "Kita harus metodis dan berhati-hati"
 BBA_italo_ethiopian_war_events.02.t: "Serangan Besar Italia"
 BBA_italo_ethiopian_war_events.02.desc: "Italia berusaha mendapatkan kembali inisiatif dalam perang. Mereka melancarkan serangan besar-besaran, dalam upaya untuk menghancurkan barisan kami dan menghancurkan Kekaisaran [ROOT.GetAdjective] dalam satu pukulan.\nPasukan kami harus bertahan. Penting bagi pasukan kita untuk bertahan cukup lama dalam menghadapi pemboman hebat dan serangan tank dan artileri, sehingga kita mempunyai waktu untuk meyakinkan komunitas internasional untuk bertindak atas nama kita."
 BBA_italo_ethiopian_war_events.02.a: "Hancurkan penjajah!"
 BBA_italo_ethiopian_war_events.03.t: "Penumpukan Italia"
 BBA_italo_ethiopian_war_events.03.desc: "Serangan kami telah memukul mundur Italia, tetapi gagal mencapai tujuannya. Pasukan kita sudah kehabisan momentum, dan pihak Italia mulai pulih dari keterkejutan akibat serangan kita.\nLaporan intelijen menunjukkan bahwa mereka sedang mempersiapkan serangan baru, lebih siap dibandingkan sebelumnya. Kekuatan kita harus bertahan. Semakin lama kita bisa menjauhkan mereka dari negara kita, semakin besar komitmen mereka, dan semakin mudah untuk meyakinkan Liga Bangsa-Bangsa bahwa ini bukanlah \"pertempuran kolonial\" kecil, melainkan agresi brutal yang dilakukan oleh satu negara anggota terhadap negara anggota lainnya."
 BBA_italo_ethiopian_war_events.03.a: "Taruhannya semakin meningkat."
 BBA_italo_ethiopian_war_events.10.t: "Resolusi Embargo Liga Bangsa-Bangsa"
 BBA_italo_ethiopian_war_events.10.desc: "Dewan Liga Bangsa-Bangsa telah memutuskan untuk memberlakukan embargo habis-habisan terhadap perdagangan [ITA.GetNameDef] sebagai respons terhadap agresi ilegal negara tersebut terhadap [ETH.GetNameDef]. Sanksi tersebut mencakup segala sumber daya yang dapat digunakan untuk produksi peralatan perang. Ketentuan ini harus segera diberlakukan dan tetap berlaku sampai negara tersebut menghentikan permusuhan terhadap [ETH.GetNameDef]."
 BBA_italo_ethiopian_war_events.10.a: "Itu adalah hal yang benar untuk dilakukan"
 BBA_italo_ethiopian_war_events.10.b: "Kita tidak bisa mengambil risiko terhadap perekonomian kita"
 BBA_italo_ethiopian_war_events.10.c: "Tidak, [ITA.GetName] adalah teman kita"
 leave_the_league_of_nations_tt: "§Y[ROOT.GetName]§! meninggalkan Liga Bangsa-Bangsa"
 BBA_italo_ethiopian_war_events.11.t: "Liga Bangsa-Bangsa menuntut penutupan Suez"
 BBA_italo_ethiopian_war_events.11.desc: "Delegasi [ETH.GetName] di Liga Bangsa-Bangsa meminta agar Terusan Suez ditutup untuk [ITA.GetName] sebagai peningkatan sanksi terhadap [ITA.GetNameDef]. Setelah perdebatan panjang di dewan, dewan memutuskan untuk memenuhi permintaan tersebut. Jadi [ROOT.GetNameDef] telah ditugaskan untuk memblokir lalu lintas [ITA.GetAdjective] yang melalui kanal."
 BBA_italo_ethiopian_war_events.11.a: "Hal ini akan merugikan upaya perang mereka"
 BBA_italo_ethiopian_war_events.11.b: "Kami tidak akan melakukannya"
 suez_blocked_sanctions_tt: "§Y[ITA.GetName]§! akan diblokir untuk menggunakan Terusan Suez."
 BBA_italo_ethiopian_war_events.12.t: "[FROM.GetName] Menolak Menutup Suez"
 BBA_italo_ethiopian_war_events.12.desc: "[FROM.GetLeader] telah memberitahu Dewan Liga Bangsa-Bangsa bahwa [FROM.GetNameDef] tidak akan menutup Terusan Suez untuk [ITA.GetName]. Hal ini jelas merupakan pelanggaran terhadap perjanjian internasional, dan ketika didesak untuk mematuhinya, [FROM.GetName] hanya mengumumkan bahwa mereka meninggalkan Liga Bangsa-Bangsa."
 BBA_italo_ethiopian_war_events.12.a: "Anda tidak bisa mempercayai siapa pun, bukan?"
 BBA_italo_ethiopian_war_events.13.t: "[FROM.GetName] Menutup Suez untuk [ITA.GetName]"
 BBA_italo_ethiopian_war_events.13.desc: "Menyusul resolusi Liga Bangsa-Bangsa, [FROM.GetLeader] secara terbuka mengumumkan bahwa [ITA.GetAdjective] pelayaran melalui Terusan Suez tidak lagi diperbolehkan. Setiap kapal [ITA.GetAdjective] yang mencoba melewati terusan tersebut akan disita, dan muatannya akan disita, sampai [ITA.GetName] menghentikan agresinya terhadap [ETH.GetNameDef]."
 BBA_italo_ethiopian_war_events.13.a: "Ini merupakan pukulan bagi mereka!"
 BBA_italo_ethiopian_war_events.14.t: "Resolusi Liga Bangsa-Bangsa untuk Mendukung [ETH.GetName]"
 BBA_italo_ethiopian_war_events.14.desc: "Dewan Liga Bangsa-Bangsa memperdebatkan permintaan [ETH.GetName] untuk intervensi militer dalam perang dengan Italia. Pada akhirnya, dewan tersebut tidak menyerukan intervensi skala penuh, namun mengeluarkan pernyataan yang merekomendasikan negara-negara anggota untuk mendukung [ETH.GetName] dengan cara apa pun, termasuk kemungkinan mengizinkan sukarelawan untuk mengambil bagian di pihak [ETH.GetName] dalam konflik."
 BBA_italo_ethiopian_war_events.14.a: "Kita harus mengatur ini dengan benar"
 BBA_italo_ethiopian_war_events.14.b: "Jika orang ingin pergi..."
 BBA_italo_ethiopian_war_events.14.c: "Tidak ada gunanya mengirim warga negara kita untuk mati di negara lain"
 BBA_italo_ethiopian_war_events.14.d: "Kita mempunyai perang sendiri yang harus kita lawan"
 ETH_volunteers_leave_3000: "Selain ekspedisi terorganisir, 3000 warga [ROOT.GetAdjective] berangkat untuk bergabung dengan pasukan [ETH.GetAdjective]."
 ETH_volunteers_leave_2000: "2000 warga [ROOT.GetAdjective] berangkat untuk bergabung dengan pasukan [ETH.GetAdjective]."
 ETH_volunteers_leave_200: "Terlepas dari sikap resmi tersebut, sekitar 200 warga [ROOT.GetAdjective] keluar untuk bergabung dengan pasukan [ETH.GetAdjective]."
 BBA_italo_ethiopian_war_events.15.t: "Panggilan Kami untuk Bantuan Internasional"
 BBA_italo_ethiopian_war_events.15.desc_a: "Sebagai hasil dari resolusi Liga Bangsa-Bangsa yang mengizinkan dukungan [ROOT.GetName], para sukarelawan telah berdatangan dari seluruh dunia. Brigade internasional sedang dibentuk dari para sukarelawan ini. Semoga kemampuan bertarung mereka setara dengan semangat mereka."
 BBA_italo_ethiopian_war_events.15.desc_b: "Bahkan setelah resolusi Liga Bangsa-Bangsa yang mengizinkan dukungan [ROOT.GetName], sayangnya jumlah sukarelawan yang datang untuk membantu upaya perang masih sangat sedikit. Semoga kemampuan berjuang para pejuang kemerdekaan yang gagah berani ini setara dengan semangat mereka."
 BA_italo_ethiopian_war_events.15.desc_b: "Sayangnya Liga Bangsa-Bangsa tidak setuju untuk mengerahkan kekuatan militer untuk membantu kita. Sebaliknya mereka hanya mendorong negara-negara anggota untuk membantu kami, yang pada akhirnya tidak menghasilkan dukungan besar sama sekali. Hanya segelintir relawan baru yang telah tiba."
 BBA_italo_ethiopian_war_events.15.a: "Bagus"
 BBA_italo_ethiopian_war_events.15.b: "Sayang sekali"
 BBA_italo_ethiopian_war_events.16.t: "Bantuan sedang dalam perjalanan?"
 BBA_italo_ethiopian_war_events.16.desc: "Liga Bangsa-Bangsa tidak berusaha menciptakan kekuatan militer untuk mengusir [ITA.GetName] dari [ROOT.GetName]. Namun, mereka mendorong negara-negara anggota untuk mengirimkan pasukan guna membantu memulihkan status quo. Terdapat indikasi bahwa beberapa negara sedang menyelenggarakan ekspedisi, termasuk negara-negara seperti [FROM.GetName]. Masih harus dilihat apakah ini hanya sekedar pembicaraan, atau apakah mereka benar-benar datang untuk membantu kami."
 BBA_italo_ethiopian_war_events.16.a: "Kita harus menunggu dan melihat."
 BBA_italo_ethiopian_war_events.20.t: "[ETH.GetLeader] Menolak Menyerah"
 BBA_italo_ethiopian_war_events.20.desc: "Meskipun pasukan [ETH.GetAdjective] menyerah, [ETH.GetLeader] menolak untuk menyerah. Rumor mengatakan bahwa [ETH.GetLeader.GetSheHe] telah diizinkan untuk mendirikan Pemerintahan di Pengasingan di [?ETH.host_nation.GetNameDef]. Protes resmi telah dikeluarkan kepada pemerintah [?ETH.host_nation.GetAdjective]."
 BBA_italo_ethiopian_war_events.20.a: "Perjuangan terus berlanjut"
 ITA_occupation_tt: "[ITA.GetName] secara teknis akan terus berperang dengan pemerintah Pengasingan [ETH.GetName] sampai [ETH.GetName] tidak lagi memiliki negara bagian mana pun."
 BBA_italo_ethiopian_war_events.100.t: "Permintaan dari [FROM.GetNameDef]"
 BBA_italo_ethiopian_war_events.100.desc: "Duta Besar [FROM.GetAdjective] telah mendekati pemerintah dengan permintaan resmi dari [FROM.GetLeader] untuk diizinkan membentuk Pemerintahan sementara di Pengasingan di sini di [ROOT.GetName] jika perang melawan [ITA.GetName] berjalan buruk. Menerima pasti akan membuat menjaga hubungan baik dengan [ITA.GetName] menjadi lebih sulit."
 BBA_italo_ethiopian_war_events.100.a: "Mereka diterima di sini"
 BBA_italo_ethiopian_war_events.100.b: "Kita tidak bisa membiarkan hal ini terjadi"
 BBA_italo_ethiopian_war_events.101.t: "[FROM.GetNameDefCap] Menerima Permintaan untuk Menjadi Tuan Rumah Pemerintahan"
 BBA_italo_ethiopian_war_events.101.desc: "Pemerintah [FROM.GetAdjective] telah menanggapi dengan baik permintaan untuk bertindak sebagai negara tuan rumah bagi [ROOT.GetLeader] jika diperlukan."
 BBA_italo_ethiopian_war_events.101.a: "Satu masalah lagi yang perlu dikhawatirkan"
 change_focus_to_from_tt: "Menambahkan fokus baru untuk §Y[ROOT.GetNameDef]§! yang dapat digunakan saat diasingkan di §Y[FROM.GetNameDef]§!."
 BBA_italo_ethiopian_war_events.102.t: "[FROM.GetNameDefCap] Menolak Permintaan [ROOT.GetAdjective]"
 BBA_italo_ethiopian_war_events.102.desc: "Sayangnya, pemerintah [FROM.GetAdjective] tidak berani membuat marah [ITA.GetLeader]. Mereka menolak permintaan kami untuk membentuk Pemerintahan sementara di sana jika [ETH.GetName] jatuh."
 BBA_italo_ethiopian_war_events.102.a: "Kalau begitu, kita harus mencoba di tempat lain"
 BBA_italo_ethiopian_war_events.110.t: "Liga Bangsa-Bangsa Menuntut Perdamaian"
 BBA_italo_ethiopian_war_events.110.desc: "Liga Bangsa-Bangsa menuntut segera diakhirinya permusuhan antara [ROOT.GetName] dan [FROM.GetName]. Resolusi dewan memberikan negara-negara anggota hak untuk menyatakan perang terhadap [ROOT.GetDameDef] jika kita menolak untuk mematuhinya."
 BBA_italo_ethiopian_war_events.110.a: "Kami harus menerimanya, untuk saat ini"
 BBA_italo_ethiopian_war_events.110.b: "Mereka tidak akan berani berbuat apa pun"
 BBA_italo_ethiopian_war_events.111.t: "[FROM.GetLeader] Setuju Perdamaian"
 BBA_italo_ethiopian_war_events.111.desc: "Setelah resolusi dewan Liga Bangsa-Bangsa, pemerintahan [FROM.GetAdjective] yang dipimpin oleh [FROM.GetLeader] akhirnya mulai sadar. Perjanjian Perdamaian yang dibuat oleh Liga Bangsa-Bangsa mengembalikan perbatasan sebelum perang. Sayangnya, hal ini tidak mencakup kompensasi apa pun untuk [ROOT.GetName] atas semua kerusakan yang terjadi, namun hal ini akan memberi kita waktu untuk mulai membangun kembali negara ini."
 BBA_italo_ethiopian_war_events.111.a: "Semacam kemenangan"
 BBA_italo_ethiopian_war_events.112.t: "[FROM.GetName] Menentang Liga Bangsa-Bangsa"
 BBA_italo_ethiopian_war_events.112.desc: "Meskipun ada ancaman perang dari anggota dewan Liga Bangsa-Bangsa, [FRON.GetLeader] tetap berniat menghancurkan [ROOT.GetName]. Dewan telah memerintahkan penghentian segera permusuhan, namun [FROM.GetName] secara terang-terangan menolak untuk mematuhinya."
 BBA_italo_ethiopian_war_events_wargoal_tt: "Negara-negara Besar di Liga Bangsa-Bangsa bisa mendapatkan tujuan perang di [ROOT.GetName]"
 BBA_italo_ethiopian_war_events.112.a: "Kami harus berjuang lebih keras lagi"
 BBA_italo_ethiopian_war_events.113.t: "[FROM.GetName] Menolak Mematuhi Resolusi Liga Bangsa-Bangsa"
 BBA_italo_ethiopian_war_events.113.desc: "Liga Bangsa-Bangsa menuntut agar [FROM.GetNameDef] segera membatalkan agresi mereka terhadap [ETH.GetName]. Namun, [FROM.GetLeader] tetap menentang dan menolak untuk mematuhinya. Hal ini merupakan pelanggaran terang-terangan terhadap peraturan internasional, dan dewan tersebut telah menyerukan tindakan internasional terhadap [FROM.GetNameDef]."
 BBA_italo_ethiopian_war_events.113.a: "Jika kekerasan adalah satu-satunya bahasa yang mereka gunakan"
 BBA_italo_ethiopian_war_events.113.b: "Kita tidak bisa membiarkan Liga Bangsa-Bangsa mendikte Kebijakan Luar Negeri kita"
 BBA_italo_ethiopian_war_events.120.t: "Bencana di [FROM.GetName]"
 BBA_italo_ethiopian_war_events.120.desc: "Perang di [FROM.GetName] tidak berjalan sesuai harapan. Bangsa kebanggaan kita dengan cepat menjadi bahan tertawaan Eropa, dan massa di [ROOT.GetCapitalVictoryPointName] menjadi gelisah. Revolusi mungkin sudah dekat. Sekarang [FROM.GetLeader] mendekati kami dengan tawaran perdamaian."
 BBA_italo_ethiopian_war_events.120.a: "Kita harus fokus pada sesuatu yang lebih mudah"
 ETH_peace_treaty_tt: "§YPersyaratan perjanjian damai§!:"
 ETH_peace_treaty_part_2_tt: "[ETH.GetFlag][ETH.GetName]:"
 BBA_italo_ethiopian_war_events.120.b: "Kami masih bisa memenangkan ini!"
 BBA_italo_ethiopian_war_events.121.t: "Kemenangan!"
 BBA_italo_ethiopian_war_events.121.desc: "Perjuangan panjang dan pahit akhirnya usai. [FROM.GetLeader] telah menerima tuntutan kami dan menghentikan agresi terhadap [ROOT.GetName]. [ROOT.GetLeader] adalah pahlawan hari ini. [ROOT.GetLeader.GetSheHeCap] telah membimbing [ROOT.GetNameDef] dengan mantap melewati masa-masa sulit ini dan berhasil memukul mundur kekuatan kolonialis Eropa."
 BBA_italo_ethiopian_war_events.121.a: "Ini menandakan awal baru bagi Afrika"
 ETH_gets_the_following_states_tt: "[ETH.GetNameDefCap] akan menerima status berikut:"
 BBA_italo_ethiopian_war_events.122.t: "[FROM.GetLeader] Keras Kepala Menolak"
 BBA_italo_ethiopian_war_events.122.desc: "Meskipun [ROOT.GetAdjective] sukses dalam perang, pemimpin [FROM.GetAdjective] menolak menerima kekalahan. [ROOT.GetLeader] telah menunjukkan kepada dunia bahwa sebuah negara di Afrika dapat melawan penjajah Eropa, dan itu merupakan sebuah kemenangan tersendiri. Sekarang kita perlu membuat seseorang bertekuk lutut."
 BBA_italo_ethiopian_war_events.122.a: "Perang memasuki fase baru."
 ethiopia_recognized_flag: "Ethiopia dapat mengajak sekutunya untuk berperang"
 BBA_italo_ethiopian_war_events.200.t: "Reputasi Internasional Tumbuh"
 BBA_italo_ethiopian_war_events.200.desc: "Simpati publik terhadap perjuangan [ROOT.GetName] selalu kuat. Namun, tidak ada yang benar-benar memperkirakan negara ini akan bertahan lebih dari satu bulan atau lebih. Perlawanan kita yang gigih terhadap penjajah [ITA.GetAdjective] berhasil memenangkan hati masyarakat di seluruh dunia, dan para pemimpin negara mulai menganggap [ROOT.GetName] dengan lebih serius."
 BBA_italo_ethiopian_war_events.200.a: "Andai saja mereka bisa berbuat lebih dari sekadar bicara"
 BBA_italo_ethiopian_war_events.201.t: "Peningkatan Moral Angkatan Darat"
 BBA_italo_ethiopian_war_events.201.desc: "Dengan bertahan selama ini, melawan rintangan-rintangan ini, moral para prajurit mulai bangkit kembali. Ketika antusiasme awal sudah padam, banyak yang mulai menganggap remeh kekalahan, namun kini ada pembicaraan tentang kemungkinan kemenangan lagi. Ada juga tanda-tanda jelas unit beradaptasi dengan gaya bertarung baru."
 BBA_italo_ethiopian_war_events.201.a: "Kita harus mengembangkan ini untuk mendorong musuh keluar dari [ROOT.GetName]"
 ETH_morale_boost_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!"
 BBA_italo_ethiopian_war_events.202.t: "Desersi Musuh"
 BBA_italo_ethiopian_war_events.202.desc: "Awalnya hanya sedikit saja, beberapa unit tak beraturan musuh kami mulai kehilangan kepercayaan, dan beberapa dari mereka datang untuk berperang demi kami. Sekarang para prajurit melakukan desersi secara massal, dan bukan hanya para laskar saja. Beberapa desertir bahkan membawa alat berat."
 BBA_italo_ethiopian_war_events.202.a: "Arusnya sedang berbalik"
 BBA_italo_ethiopian_war_events.203.t: "Bertahan Hidup Melawan Segala Rintangan"
 BBA_italo_ethiopian_war_events.203.desc: "Yang disebut ahli tidak akan memberi kami waktu satu bulan bahkan ketika perang dimulai. Kita telah bertahan melawan apa yang disebut sebagai tentara modern lebih lama dari itu. Kami tahu cara mereka bertarung dan kami telah beradaptasi dengannya. Kepercayaan masyarakat telah kembali, dan para rekrutan berbondong-bondong menuju spanduk dari dekat dan jauh."
 BBA_italo_ethiopian_war_events.203.a: "Kami akan mengusir penjajah ke laut"
 ETH_for_the_duration_of_the_war_tt: "Selama Perang:"
 BBA_italo_ethiopian_war_events.204.t: "Perang Rakyat"
 BBA_italo_ethiopian_war_events.204.desc: "Di mana-mana, rakyat bangkit melawan penjajah, baik tua maupun muda bergabung dengan gerakan perlawanan, memaksa [ITA.GetName] untuk bekerja lebih keras lagi demi mendapatkan keuntungan apa pun. Penduduk setempat yang tidak bisa berperang membuat senjata dan perlengkapan untuk tentara."
 BBA_italo_ethiopian_war_events.204.a: "Kemenangan sudah dekat sekarang"
 BBA_italo_ethiopian_war_events.300.t: "Publik Italia Peduli"
 BBA_italo_ethiopian_war_events.300.desc: "Tentara kami berjuang untuk membuat kemajuan apa pun di [ETH.GetName], dan kurangnya kemajuan dapat dirasakan bahkan di [ITA.GetName]. Penduduk [ITA.GetAdjective] mulai kehilangan kepercayaan pada perang, dan bahkan pada kepemimpinan kita untuk mengamankan kemenangan pada akhirnya."
 BBA_italo_ethiopian_war_events.300.a: "Betapa kecilnya iman mereka!"
 BBA_italo_ethiopian_war_events.301.t: "Tentara Afrika Kecewa"
 BBA_italo_ethiopian_war_events.301.desc: "Tentara kita di [ETH.GetName] hanya membuat sedikit kemajuan dan memakan banyak korban. Perlawanannya sangat sengit dan kami harus berjuang keras untuk setiap inci yang kami peroleh. Semangat seluruh angkatan bersenjata berada pada titik terendah sepanjang masa, dan kami bahkan menerima laporan bahwa beberapa perusahaan menolak melaksanakan perintah langsung."
 BBA_italo_ethiopian_war_events.301.a: "Kita harus membalikkan keadaan perang!"
 BBA_italo_ethiopian_war_events.302.t: "Kerusuhan di Koloni"
 BBA_italo_ethiopian_war_events.302.desc: "Perjuangan kami di [ETH.GetName] mulai berdampak di tempat lain; kami menerima laporan dari koloni bahwa rakyat kami mulai tidak mematuhi otoritas lokal dalam hal-hal kecil dan besar. Mereka rupanya memandang kurangnya kemajuan kita dalam perang sebagai kelemahan dan sedang menguji kekuatan kita."
 BBA_italo_ethiopian_war_events.302.a: "Berita yang meresahkan!"
 ITA_colonial_unrest_tt: "Kerusuhan Kolonial: §R+15%§!"
 BBA_italo_ethiopian_war_events.303.t: "Publik Italia Mempertanyakan Upaya Perang"
 BBA_italo_ethiopian_war_events.303.desc: "Bencana [ETH.GetAdjevtive] telah membuat [ITA.GetAdjective] menentang perang. Semakin banyak orang yang secara terbuka mengkritik pemerintah dan kepemimpinannya, dan bahkan bisikan mengenai alternatif lain pun sering terjadi."
 BBA_italo_ethiopian_war_events.303.a: "Pengkhianat!"
 BBA_italo_ethiopian_war_events.304.t: "Desersi Massal"
 BBA_italo_ethiopian_war_events.304.desc: "Situasi di [ETH.GetName] sangat buruk karena semangat para prajurit terus menurun! Tentara terjebak di beberapa tempat dan menghadapi desersi massal, sehingga jumlah kami berkurang bahkan tanpa bantuan dari [ETH.GetAdjective]! Kami bahkan mendapat laporan ada petugas yang tertabrak truk. Kami telah menamakannya sebagai kecelakaan."
 BBA_italo_ethiopian_war_events.304.a: "Pengecut mereka semua!"
 ITA_desertions_east_africa_tt: "Tentara di Afrika Timur menderita karena desersi."
 BBA_italo_ethiopian_war_events.305.t: "Kegaduhan di Koloni"
 BBA_italo_ethiopian_war_events.305.desc: "Apa yang awalnya merupakan pembangkangan sipil di wilayah jajahan kini hampir meningkat menjadi pemberontakan! Kegagalan kami dalam mengatasi perjuangan yang terus berlanjut di [ETH.GetName] telah meyakinkan masyarakat bahwa kami lemah dan bahwa mereka akan lebih baik tanpa pemerintahan kami."
 BBA_italo_ethiopian_war_events.305.a: "Kurang ajar sekali!"
 ITA_colonial_uproar_tt: "Kerusuhan Besar Kolonial: §R+80%§!"
 BBA_italo_ethiopian_war_events.400.t: "Saatnya berurusan dengan [AFA.GetNameDef]"
 BBA_italo_ethiopian_war_events.400.desc: "[AFA.GetLeader], sultan [AFA.GetNameDef], telah lama berada di bawah pengaruh [ROOT.GetAdjective] yang kuat. Sama seperti perang terakhir, dia tetap netral, meskipun secara resmi menjadi bagian dari kerajaan [ETH.GetAdjective]. Faktanya, satu-satunya alasan sultan masih berkuasa adalah karena niat baik [ROOT.GetAdjective]. Negara ini mungkin telah menjual garis pantainya kepada [ROOT.GetName], namun hal tersebut masih menjadi kendala bagi penaklukan kita. Perebutan [?ITA.ITA_capture_state.GetName] mungkin cukup untuk meyakinkan Sultan agar menyerahkan sisa tanahnya."
 BBA_italo_ethiopian_war_events.400.a: "Kirimkan ultimatum, menuntut penaklukan total"
 BBA_italo_ethiopian_war_events.400.b: "Kita bisa menangani [AFA.GetNameDef] nanti. Sekarang bukan waktunya."
 BBA_italo_ethiopian_war_events.401.t: "Ultimatum Dari [FROM.GetName]"
 BBA_italo_ethiopian_war_events.401.desc: "Pihak Italia telah meminta agar kami menempatkan seluruh negara bagian di bawah kendali mereka, untuk digunakan sebagai area persiapan perang mereka melawan [ETH.GetName]. Menerima secara efektif akan mengakhiri kemerdekaan [ROOT.GetNAme], namun menolak berarti invasi."
 BBA_italo_ethiopian_war_events.401.a: "Tidak ada gunanya menolak"
 BBA_italo_ethiopian_war_events.401.b: "Jika mereka menginginkan tanah kami, mereka harus mengambilnya dengan paksa"
 BBA_italo_ethiopian_war_events.402.t: "[FROM.GetLeader] Lipatan"
 BBA_italo_ethiopian_war_events.402.desc: "[FROM.GetNameDefCap] telah menerima tuntutan kami untuk mengizinkan kami menggunakan tanah [FROM.GetAdjective] sebagai basis operasi melawan [ETH.GetName]. Hal ini secara efektif mengakhiri kemerdekaan [FROM.GetName]."
 BBA_italo_ethiopian_war_events.402.a: "Bagus, ayo masuk dan menduduki tanah itu."
 BBA_italo_ethiopian_war_events.403.t: "[FROM.GetNameDefCap] Tetap Menantang"
 BBA_italo_ethiopian_war_events.403.desc: "Sayangnya tekanan diplomatik belum cukup untuk mengamankan kekuasaan Italia atas [FROM.GetNameDef]. [FROM.GetLeader] tetap bersikukuh bahwa negaranya mampu melawan kekuatan militer [ROOT.GetName]."
 BBA_italo_ethiopian_war_events.403.a: "Kami harus melakukan ini dengan cara yang sulit"
 BBA_italo_ethiopian_war_events.500.t: "Tuntutan Perdamaian"
 BBA_italo_ethiopian_war_events.500.desc: "[GetItaloEthiopianPeaceDemands]"
 BBA_italo_ethiopian_war_events.500.desc_guarantees: "[FROM.GetAdjective] menuntut kami untuk menuntut perdamaian dengan [ETH.GetName] jika kami ingin bantuan mereka melawan Jerman. Jika kita menandatangani perjanjian dengan orang Etiopia, kita harus bersedia membagi sebagian wilayah yang telah kita taklukkan, sambil mempertahankan wilayah lainnya. Perdamaian seperti itu pasti akan menjadi pil pahit yang harus ditelan oleh kedua negara, namun mungkin akan bermanfaat ketika menghadapi Jerman."
 BBA_italo_ethiopian_war_events.500.desc_territories: "Untuk memberi kita sebagian wilayah jajahannya, Inggris ingin mengakhiri perang kita dengan Ethiopia. Jika kita menandatangani perjanjian dengan mereka, kita harus rela berpisah dengan sebagian wilayah yang telah kita taklukkan, sambil tetap mempertahankan wilayah lainnya. Perdamaian seperti ini tentunya akan menjadi pil pahit yang harus ditelan oleh kedua negara mengingat semua darah, keringat, dan air mata yang telah kita tumpahkan."
 BBA_italo_ethiopian_war_events.500.a: "Sungguh kedamaian yang pahit"
 BBA_italo_ethiopian_war_events.500.b: "Kami membutuhkan dukungan mereka"
 BBA_italo_ethiopian_war_events.500.c: "Kami telah berjuang terlalu keras!"
 BBA_italo_ethiopian_war_events.500_tt: "Perang Berlanjut"
 BBA_italo_ethiopian_war_events.501.t: "Dipaksa ke Meja Perdamaian"
 BBA_italo_ethiopian_war_events.501.desc: "Negara tuan rumah kami yang ramah, yang menerima kami setelah negara kami dikuasai oleh [ITA.GetNameDefCap], tampaknya sudah bosan dengan kami. Mereka membuat rencana di belakang kami untuk memaksa kami menandatangani perjanjian damai dengan penjajah Italia yang jahat. Sayangnya, tidak banyak yang bisa kita lakukan untuk mengatasinya."
 BBA_italo_ethiopian_war_events.501.a: "Kami tidak punya pilihan"
 BBA_italo_ethiopian_war_events.501.b: "Kami akan terus berjuang!"
 BBA_ethiopia_is_expelled_tt: "Pemerintahan §Y[ETH.GetNameWithFlag]§! dikeluarkan dari §Y[ENG.GetNameWithFlag]§! dan dapat mendirikan pemerintahannya di pengasingan di tempat lain."
 BBA_italo_ethiopian_war_events.502.t: "Tidak Ada Perjanjian Damai"
 BBA_italo_ethiopian_war_events.502.desc: "[GetItalyRefusesPeaceTalks]"
 BBA_italo_ethiopian_war_events.502.desc_guarantees: "Pemerintah Italia telah menolak permintaan kami agar mereka berdamai dengan [ETH.GetNameDefCap] sebagai imbalan atas bantuan kami melawan Jerman. Mereka harus menghadapi serangan gencar ini sendirian."
 BBA_italo_ethiopian_war_events.502.desc_territories: "Pemerintah Italia telah menolak permintaan kami agar mereka berdamai dengan [ETH.GetNameDefCap] dengan imbalan sebagian wilayah kolonial kami. Ini hanya menunjukkan bahwa tidak ada kesepakatan dengan penjahat seperti itu!"
 BBA_italo_ethiopian_war_events.502.a: "Sayang sekali"
 BBA_italo_ethiopian_war_events.503.t: "[ETH.GetNameDefCap] Menolak Pembicaraan Damai"
 BBA_italo_ethiopian_war_events.503.desc: "Pemerintah Ethiopia menolak permintaan Inggris untuk menandatangani perjanjian damai dengan kami. Hal ini menyebabkan [ENG.GetLeader] mengeluarkan warga Etiopia dari [ENG.GetNameDef], sehingga memberikan sinyal yang jelas kepada semua orang tentang kerja sama negara mana yang lebih mereka hargai. Hal ini memberi kita peluang untuk lebih memperkuat kepemilikan kita di Afrika!"
 BBA_italo_ethiopian_war_events.503.a: "Kami akan menaklukkan mereka"
 BBA_italo_ethiopian_war_events.510.t: "[ITA.GetNameDef] Merongrong Otoritas Ethiopia"
 BBA_italo_ethiopian_war_events.510.desc: "Kami telah menerima laporan bahwa pemerintah Italia telah meluncurkan kampanye disinformasi untuk melemahkan kekuasaan dan legitimasi kami di negara asal kami. Kebohongan keji ini mungkin mempengaruhi sebagian rakyat kita untuk mendukung perjuangan [ITA.GetNameDef] dan melemahkan klaim kita atas takhta. Kita harus memulihkan kekuasaan kita atas Ethiopia sebelum mereka menimbulkan kerugian lebih lanjut!"
 BBA_italo_ethiopian_war_events.510.a: "Mereka akan membayar kebohongan mereka!"
#Ethiopia - Balance of Power
 BBA_ethiopia_balance_of_power_events.01.t: "Aturan Ditantang"
 BBA_ethiopia_balance_of_power_events.01.desc_fascism: "Meningkatnya desentralisasi [THIS.GetName] ditambah dengan kurangnya dukungan luas terhadap pemerintahan yang berkuasa dan ketidakstabilan yang lebih luas di wilayah tersebut telah meluas menjadi pemberontakan terbuka terhadap pemerintah pusat. Pendukung $haile_selassie_gugsa$ telah mengangkat senjata dengan tujuan untuk mengangkatnya ke takhta [THIS.GetAdjective]."
 BBA_ethiopia_balance_of_power_events.01.desc_neutrality: "Meningkatnya desentralisasi [THIS.GetName] ditambah dengan kurangnya dukungan luas terhadap pemerintahan yang berkuasa dan ketidakstabilan yang lebih luas di wilayah tersebut telah meluas menjadi pemberontakan terbuka terhadap pemerintah pusat."
 BBA_ethiopia_balance_of_power_events.01.desc_communism: "Meningkatnya sentralisasi [THIS.GetName] ditambah dengan kurangnya dukungan luas terhadap pemerintahan yang berkuasa dan ketidakstabilan yang lebih luas di kawasan ini telah meluas menjadi pemberontakan terbuka terhadap pemerintah pusat. Kaum anarkis telah menyatakan bahwa mereka akan membebaskan negara ini dari pemerintahan kita."
 BBA_ethiopia_balance_of_power_events.01.a: "Kami akan mengalahkan mereka"
 BBA_ethiopia_balance_of_power_events.01.b: "Hancurkan orang yang berpura-pura"
 BBA_ethiopia_balance_of_power_events.01.c: "Hancurkan pengkhianat kelas."
 ETH_alternate_fascist_party: "Pendukung Hayamot"
 ETH_alternate_fascist_party_long: "Pendukung $ETH_hailu_tekle_haymanot$"
 ETH_alternate_neutrality_party: "Pendukung Selassie"
 ETH_alternate_neutrality_party_long: "Pendukung $ETH_haile_selassie$"
 BBA_ethiopia_balance_of_power_events.10.t: "[ROOT.GetName] berantakan"
 BBA_ethiopia_balance_of_power_events.10.desc: "Desentralisasi bertahap [THIS.GetNameDef] tidak mengherankan telah menyebabkan pemerintah pusat kehilangan sebagian besar wewenangnya. Kini berbagai daerah sudah melangkah jauh untuk mendeklarasikan kemerdekaannya dari [THIS.GetNameDef]. Kita perlu bertindak cepat jika ingin mendapatkan kembali kendali atas wilayah ini."
 BBA_ethiopia_balance_of_power_events.10.a: "Saya kira tidak ada hubungannya dengan hal itu"
 BBA_ethiopia_balance_of_power_events.10.b: "Hancurkan mereka"
 ETH_breakup_tt: "§RMenjadi mandiri dari [ROOT.GetName]§!"
 ETH_breakup_fight_tt: "§RMenjadi mandiri dari [ROOT.GetName] dan [ROOT.GetName] menyatakan perang melawan mereka.§!"
#BBA_ethiopia_balance_of_power_events.20.t: "Education Reforms" 
#BBA_ethiopia_balance_of_power_events.20.desc: "As we begin to reform [ETH.GetNameDefCap], the issue of the education system has come to the forefront. Making sure the next generation are able to join the workforce is of course our priority. However, we have an opportunity to nudge that generation in a more acceptable moral direction."
#BBA_ethiopia_balance_of_power_events.20.a: "Implementing [ETH.GetLeader]’s plans are their only concern."
#BBA_ethiopia_balance_of_power_events.20.b: "Religion is the opiate of the masses."
#
#BBA_ethiopia_balance_of_power_events.21.t: "[ETH.GetAdjective] Road Improvements"
#BBA_ethiopia_balance_of_power_events.21.desc: "[ETH.GetNameDefCap]’s road network remains limited and hinders the economic development of the country. We now have the budget to implement improvements to the road network, but there is a split over whether we should prioritize expanding the existing network to the benefit of people in their local area, or create highways around the capital to concentrate economic development."
#BBA_ethiopia_balance_of_power_events.21.a: "Prioritize local road expansion in the regions."
#BBA_ethiopia_balance_of_power_events.21.b: "We need to concentrate economic development."
 BBA_ethiopia_balance_of_power_events.22.t: "Reformasi Perwira Militer"
 BBA_ethiopia_balance_of_power_events.22.desc: "Pengalaman baru-baru ini menunjukkan bahwa banyak perwira militer kita tidak memiliki perlengkapan yang memadai untuk menangani peperangan modern. Alasan yang paling mungkin atas kelemahan ini adalah kecenderungan historis kita yang menawarkan pangkat militer berdasarkan gelar turun-temurun atau politik, dan bukan berdasarkan prestasi orang yang bersangkutan. Dengan gelombang reformasi yang terjadi baru-baru ini di [ETH.GetNameDef], sekarang saatnya untuk membuat keputusan tentang masa depan hierarki militer."
 BBA_ethiopia_balance_of_power_events.22.a: "Rakyat jelata tidak mampu memimpin."
 BBA_ethiopia_balance_of_power_events.22.b: "Meritokrasi di militer sangatlah penting."
 BBA_ethiopia_balance_of_power_events.23.t: "Reformasi Pendidikan Standar"
 BBA_ethiopia_balance_of_power_events.23.desc: "Gelombang reformasi pendidikan yang kita lakukan baru-baru ini sudah terbukti berhasil. Generasi muda tidak hanya terbukti semakin loyal terhadap [ETH.GetLeader], namun mereka juga tampaknya memberikan tekanan pada orang tua mereka untuk mematuhi peraturan tersebut."
 BBA_ethiopia_balance_of_power_events.23.a: "Rezim ini semakin hari semakin aman."
 BBA_ethiopia_balance_of_power_events.24.t: "Reformasi Pendidikan"
 BBA_ethiopia_balance_of_power_events.24.desc: "Gelombang reformasi pendidikan yang kita lakukan baru-baru ini sudah terbukti berhasil. Hirarki kuno [ETH.GetNameDef] semakin dipertanyakan seiring dengan tuntutan generasi muda agar mereka membuktikan legitimasinya. Meskipun hal ini telah menimbulkan ketegangan antara generasi muda dan tua, tampaknya sikap pada akhirnya akan berubah ke arah yang menguntungkan kita."
 BBA_ethiopia_balance_of_power_events.24.a: "Waktu ada di pihak kita."
 BBA_ethiopia_balance_of_power_events.25.t: "Perwira Militer Politik"
 BBA_ethiopia_balance_of_power_events.25.desc: "Ketika kita semakin memusatkan kendali politik dan ekonomi terhadap [ETH.GetName], masih terdapat kekhawatiran yang besar terhadap pihak militer. Jika mereka menentang kami, kecil kemungkinan kami menolak tuntutan mereka. Oleh karena itu, kami mulai memasukkan perwira politik ke dalam angkatan bersenjata untuk memastikan bahwa pasukan tersebut tidak mendapatkan ide yang tidak disetujui."
 BBA_ethiopia_balance_of_power_events.25.a: "Ini demi kebaikan mereka sendiri."
 BBA_ethiopia_balance_of_power_events.26.t: "Meritokrasi di Militer"
 BBA_ethiopia_balance_of_power_events.26.desc: "Pengalaman baru-baru ini menunjukkan bahwa banyak perwira militer kita tidak memiliki perlengkapan yang memadai untuk menangani peperangan modern. Alasan yang paling mungkin atas kelemahan ini adalah kecenderungan historis kita yang menawarkan pangkat militer berdasarkan gelar turun-temurun atau politik, dan bukan berdasarkan prestasi orang yang bersangkutan. Dengan gelombang reformasi yang terjadi baru-baru ini di [ETH.GetName], sudah sepantasnya kita memastikan meritokrasi adalah faktor penentu dalam menjadi pemimpin militer."
 BBA_ethiopia_balance_of_power_events.26.a: "Meritokrasi di militer sangatlah penting."
 BBA_ethiopia_balance_of_power_events.30.t: "$ETH_balcho_safo$ Pengembalian"
 BBA_ethiopia_balance_of_power_events.30.desc: "Mantan Shum dari Sidamo, dan pernah menjadi Dejazmach dari tentara [FROM.GetAdjective], telah menerima panggilan dari [FROM.GetLeader] untuk sekali lagi mengangkat senjata untuk negaranya. Pahlawan Adwa membawa serta rekrutan dari wilayah pribadinya. Semoga ini dapat membantu mengusir kembali invasi [ITA.GetAdjective]."
 BBA_ethiopia_balance_of_power_events.30.a: "Kembalinya pahlawan sejati"
 BBA_ethiopia_balance_of_power_events.51.t: "Penguasa Lokal Menawarkan untuk Meningkatkan Unit Tentara Bayaran"
 BBA_ethiopia_balance_of_power_events.51.desc: "Seorang penguasa lokal di [?ROOT.ETH_bop_state.GetName] telah menawarkan untuk membentuk sebuah unit dan menyerahkannya kepada tentara kekaisaran. Orang-orang tersebut akan direkrut dari perampok lokal dan sukarelawan asing, sehingga mereka akan datang dengan perlengkapan lengkap dan siap berperang. Kehilangan otoritas saat ini tentu saja beresiko, namun menambah pasukan tentu akan meningkatkan peluang memenangkan perang."
 BBA_ethiopia_balance_of_power_events.51.a: "Negara ini membutuhkan semua bantuan yang dapat diperolehnya"
 BBA_ethiopia_balance_of_power_events.51.b: "Kita perlu mengurangi jumlah tentara swasta, bukan menambahnya"
 BBA_ethiopia_balance_of_power_events.52.t: "Tuan Lokal Ingin Memperluas Domain"
 BBA_ethiopia_balance_of_power_events.52.desc: "Seorang penguasa lokal di [?ROOT.ETH_bop_state.GetName] berencana memperluas basis kekuasaannya, dan memperluas wilayah kekuasaannya. Hal ini sampai batas tertentu akan bermanfaat bagi negara secara keseluruhan, karena negara ini banyak berinvestasi pada kemampuan produksi lokal. Pada saat yang sama, jika hal ini tidak dihentikan maka pemerintah pusat akan kehilangan kendali atas [?ROOT.ETH_bop_state.GetName]."
 BBA_ethiopia_balance_of_power_events.52.a: "Ini semua bagus"
 BBA_ethiopia_balance_of_power_events.52.b: "Ini perlu dihentikan"
 BBA_ethiopia_balance_of_power_events.53.t: "Penguasa Daerah Ingin Produksi Senjata"
 BBA_ethiopia_balance_of_power_events.53.desc: "Salah satu penguasa di [?ROOT.ETH_bop_state.GetName] menginginkan dukungan untuk menyiapkan produksi senapan dan amunisi lokal di [?ROOT.ETH_bop_state.GetName]. Hal ini dapat membantu angkatan bersenjata kita mendapatkan perlengkapan yang lebih baik dan meningkatkan kemampuan tempur tentara [ROOT.GetAdjective]."
 BBA_ethiopia_balance_of_power_events.53.a: "Mendapatkan lebih banyak senapan lebih penting daripada kendali saat ini"
 BBA_ethiopia_balance_of_power_events.53.b: "Produksi senjata di tangan swasta terdengar terlalu berbahaya"
 BBA_ethiopia_balance_of_power_events.54.t: "Kekurangan Persediaan di [?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_balance_of_power_events.54.desc: "Masyarakat [?ROOT.ETH_bop_state.GetName] meminta bantuan pemerintah pusat. Peristiwa yang terjadi baru-baru ini telah menyebabkan kekurangan pasokan dan kawasan ini perlu melakukan sejumlah investasi untuk mengatasi situasi tersebut."
 BBA_ethiopia_balance_of_power_events.54.a: "Kita perlu melakukan sesuatu"
 ETH_investments_in_state_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! oleh:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+5%§!"
 BBA_ethiopia_balance_of_power_events.54.b: "Sayangnya tidak banyak yang bisa kami lakukan saat ini"
 ETH_decline_in_state_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! oleh:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R-5%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §R-5%§!"
 BBA_ethiopia_balance_of_power_events.54.c: "Pemerintah daerah di [?ROOT.ETH_bop_state.GetName] harus mengatasi masalah ini"
 BBA_ethiopia_balance_of_power_events.55.t: "Penduduk Setempat Mengeluh tentang Penganiayaan"
 BBA_ethiopia_balance_of_power_events.55.desc: "Ada beberapa kasus pengaduan terhadap penguasa lokal [?ROOT.ETH_bop_state.GetName]. Rakyat merasa diperlakukan buruk oleh bangsawan. Investigasi awal terhadap masalah ini menunjukkan bahwa setidaknya ada dasar yang sah atas keluhan mereka. Namun, intervensi pemerintah pusat tidak akan dipandang baik oleh bangsawan lain."
 BBA_ethiopia_balance_of_power_events.55.a: "Kita perlu memberi contoh di sini"
 BBA_ethiopia_balance_of_power_events.55.b: "Pemerintah pusat tidak berhak mencampuri urusan daerah."
 BBA_ethiopia_balance_of_power_events.56.t: "Boom Ekonomi di [?ROOT.ETH_bop_state.GetName]"
 BBA_ethiopia_balance_of_power_events.56.desc: "Upaya yang dilakukan oleh pemerintah pusat untuk memperbaiki administrasi [ROOT.GetName] dan mengintegrasikan berbagai daerah telah menyebabkan ledakan ekonomi di [?ROOT.ETH_bop_state.GetName]. Wilayah ini menarik imigran dari wilayah lain di negara ini dan industrinya pun berkembang."
 BBA_ethiopia_balance_of_power_events.56.a: "Kita harus memanfaatkan peluang ini untuk mendorong proses sentralisasi lebih jauh lagi"
 BBA_ethiopia_balance_of_power_events.56.b: "Investasi ulang di kawasan ini agar lebih berkembang harus menjadi fokus kami"
#Imperial Ethiopia
 BBA_ethiopia_exile_events.01.t: "[FROM.GetLeader] siap mengikuti kembali [FROM.GetName]"
 BBA_ethiopia_exile_events.01.desc: "Pemimpin [FROM.GetAdjective] di pengasingan,[FROM.GetLeader], lebih dari siap untuk melancarkan kampanye besar-besaran untuk merebut kembali negara [FROM.GetLeader.GetHerHis]. Dukungan masyarakat terhadap upaya tersebut sangat kuat, sehingga mungkin inilah saat yang tepat."
 BBA_ethiopia_exile_events.01.a: "Penyebab [FROM.GetName] adalah milik kita"
 ETH_can_call_allies_tt: "§Y[ETH.GetNameWithFlag]§! dapat memanggil sekutu untuk berperang."
 BBA_ethiopia_exile_events.02.t: "Peningkatan Aktivitas Perlawanan di [ETH.GetName] Utara"
 BBA_ethiopia_exile_events.02.desc: "[ETH.GetLeader] telah meninggalkan negara tersebut, namun masih mendorong para pendukungnya untuk menyerang tentara [ROOT.GetAdjective] yang menang. Pidato-pidato ini telah menyebabkan meningkatnya aktivitas perlawanan di bagian Utara dan Tengah [ETH.GetName]."
 BBA_ethiopia_exile_events.02.a: "Kita harus waspada"
 BBA_ethiopia_exile_events.03.t: "Gerilyawan Komunis di Selatan [ETH.GetName]"
 BBA_ethiopia_exile_events.03.desc: "Ada beberapa laporan serangan terhadap pasukan [ROOT.GetAdjective] di [ETH.GetName] Selatan. Sebuah organisasi yang menamakan dirinya Black Lions, diyakini berada di balik serangan tersebut."
 BBA_ethiopia_exile_events.03.a: "Para pemberontak itu"
 BBA_ethiopia_exile_events.04.t: "$RAJ_orde_wingate$ teringat"
 BBA_ethiopia_exile_events.04.desc: "[ENG.GetNameDefCap] telah memutuskan untuk menarik kembali $RAJ_orde_wingate$. Mereka mengklaim bahwa dia ditugaskan untuk membentuk kekuatan baru untuk membantu [ETH.GetLeader] dalam perang di [ETH.GetName]. Indikasinya, masa tinggal akan dibatasi, dan $RAJ_orde_wingate$ akan diperbolehkan kembali setelah operasi selesai."
 BBA_ethiopia_exile_events.04.a: "Mari berharap ini bisa dilakukan dengan cepat"
 BBA_ethiopia_exile_events.05.t: "$RAJ_orde_wingate$ Ditransfer ke Burma"
 BBA_ethiopia_exile_events.05.desc: "Pemerintah [ENG.GetAdjective] memberi tahu kita bahwa $RAJ_orde_wingate$ akan segera dipindahkan ke Burma, di mana dia akan ditugaskan untuk mengorganisir kekuatan baru."
 BBA_ethiopia_exile_events.05.a: "Sayang sekali"
 BBA_ethiopia_exile_events.06.t: "[FROM.GetName] Meminta Kekuasaan [550.GetName]"
 BBA_ethiopia_exile_events.06.desc: "[FROM.GetLeader] telah meminta kekuasaan atas [550.GetName] seandainya kami berhasil menangkapnya dari [550.Owner.GetNameDef]. Wilayah tersebut telah berada di bawah kendali [ETH.GetAdjective], sehingga klaim tersebut memiliki preseden historis. [FROM.GetLeader] juga menyatakan bahwa seluruh masyarakat Habesha harus bersatu di bawah satu penguasa, lebih lanjut mengutip fakta bahwa sejak [ITA.GetAdjective] menduduki [550.GetName], [FROM.GetNameDef] tidak memiliki akses ke Laut."
 BBA_ethiopia_exile_events.06.a: "Ini masuk akal"
 BBA_ethiopia_exile_events.06.b: "Kita tidak bisa mencapai lahan yang menjanjikan pada tahap ini"
 BBA_ethiopia_exile_events.07.t: "[FROM.GetNameDefCap] Menyetujui Permintaan kami"
 BBA_ethiopia_exile_events.07.desc: "Pemerintah [FROM.GetAdjective] menganggap klaim kami atas seluruh tanah Habesha sebagai sah, dan telah menyetujui permintaan kami untuk menjadi penguasa atas [550.GetName]."
 BBA_ethiopia_exile_events.07.a: "Kabar baik"
 BBA_ethiopia_exile_events.08.t: "Pemerintah [FROM.GetAdjective] Menolak"
 BBA_ethiopia_exile_events.08.desc: "Terlepas dari klaim kami yang sah atas wilayah [550.GetName], pemerintah [FROM.GetAdjective] menolak memberikan janji atau pernyataan jelas apa pun yang mendukung klaim [ROOT.GetAdjective]. Hanya waktu yang akan membuktikan apakah mereka pada akhirnya akan membiarkan kita mengambil kendali atas garis pantai."
 BBA_ethiopia_exile_events.08.a: "Mari kita menangkan perang dan kita lihat saja nanti"
 BBA_ethiopia_exile_events.10.t: "[FROM.GetName] Meminta Kekuasaan atas seluruh Tanah Somalia"
 BBA_ethiopia_exile_events.10.desc: "Dalam pertemuan dengan Menteri Luar Negeri [ROOT.GetAdjective] di kediaman sementara [FROM.GetLeader], [FROM.GetLeader] meminta agar [FROM.GetName] diberikan kekuasaan tertinggi atas seluruh wilayah Somalia, karena sudah terdapat banyak penduduk Somalia di Etiopia, dan sengketa perbatasan adalah salah satu alasan yang digunakan untuk memulai konflik. Memberikan semua wilayah ini kepada [FROM.GetNameDef], menurut [FROM.GetLeader], akan menghilangkan alasan konflik di masa depan."
 BBA_ethiopia_exile_events.10.a: "Itu memang akan memberi kita sekutu yang kuat"
 BBA_ethiopia_exile_events.10.b: "Mereka dapat menguasai negara musuh"
 BBA_ethiopia_exile_events.10.c: "Tuntutan ini sudah keterlaluan"
 BBA_ethiopia_exile_events.11.t: "Somalia adalah milik kita!"
 BBA_ethiopia_exile_events.11.desc: "[FROM.GetAdjective] telah setuju untuk memberi kami kendali atas seluruh tanah Somalia. Artinya [ROOT.GetName] kemungkinan besar akan menguasai sebagian besar wilayah Tanduk Afrika setelah perang usai."
 BBA_ethiopia_exile_events.11.a: "Ini adalah Berita Hebat!"
 BBA_ethiopia_exile_events.12.t: "Sukses Parsial"
 BBA_ethiopia_exile_events.12.desc: "[FROM.GetAdjective] mengatakan kita bisa memiliki sebagian tanah Somalia. Lebih tepatnya mereka atau kita berhasil merebutnya dari musuh. Namun mereka menolak untuk menyerahkan apa pun yang saat ini mereka anggap sebagai bagian dari kerajaan mereka."
 BBA_ethiopia_exile_events.12.a: "Saya kira lebih mudah untuk memberikan negara bagian lain"
 BBA_ethiopia_exile_events.13.t: "Tidak beruntung"
 BBA_ethiopia_exile_events.13.desc: "Permintaan kami untuk kepemilikan masa depan atas seluruh tanah Somalia ditolak oleh [FROM.GetNameDef]. Sayangnya mereka malah menolak menjanjikan penguasaan wilayah yang diambil dari musuh."
 BBA_ethiopia_exile_events.13.a: "Membuatmu bertanya-tanya"
 BBA_ethiopia_exile_events.14.t: "[FROM.GetLeader] Meminta Pengendalian [454.GetName]"
 BBA_ethiopia_exile_events.14.desc: "Dalam pertemuan baru-baru ini di Downing Street, [FROM.GetLeader] berbicara dengan Perdana Menteri [ROOT.GetAdjective] tentang [454.GetName]. [FROM.GetLeader] menyatakan bahwa [FROM.GetLeader.GetSheHe] mendapat sambutan yang sangat hangat ketika melewati sana dalam perjalanan [FROM.GetLeader.GetHerHis] menuju [ROOT.GetNameDef]. Percakapan secara bertahap beralih ke permintaan dari [FROM.GetLeader] untuk menggunakan [454.GetName] sebagai dasar untuk penaklukan kembali [ETH.GetNameDef], menggunakan jalur langsung yang diklaimnya kepada Raja Salomo sebagai pengaruh, sehingga secara de facto meminta Perdana Menteri untuk menyerahkan [454.GetName] kepada [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.14.a: "Mungkin kita bisa menggunakan ini"
 BBA_ethiopia_exile_events.14.b: "Tidak mungkin!"
 BBA_ethiopia_exile_events.15.t: "[FROM.GetNameDefCap] Setuju"
 BBA_ethiopia_exile_events.15.desc: "Mungkin secara tidak terduga, [FROM.GetAdjective] telah setuju untuk mengizinkan kami menggunakan [454.GetName] sebagai basis. Kita harus bergerak cepat untuk mengatur pemerintahan kita di sana. Suatu hari nanti kita akan membangun kuil Sulaiman yang baru."
 BBA_ethiopia_exile_events.15.a: "Ini adalah awal dari era baru"
 BBA_ethiopia_exile_events.16.t: "[FROM.GetNameDefCap] Menolak"
 BBA_ethiopia_exile_events.16.desc: "Sayangnya, pemerintah [FROM.GetAdjective] menolak permintaan kami untuk menggunakan [454.GetName] sebagai basis dan mempertanyakan keabsahan klaim kami atas wilayah tersebut."
 BBA_ethiopia_exile_events.16.a: "Sungguh menghina."
 BBA_ethiopia_exile_events.17.t: "[ROOT.GetLeader] Menjanjikan [FROM.GetLeader] Kapal"
 BBA_ethiopia_exile_events.17.desc: "Dalam pertemuan pribadi antara [ROOT.GetLeader] dan [FROM.GetLeader], [ROOT.GetLeader] berjanji bahwa [ROOT.GetNameDef] akan mendukung [FROM.getNameDef] dengan kapal. Kata-kata yang ceroboh, mungkin, tapi tetap merupakan sesuatu yang harus dihormati oleh Angkatan Laut [ROOT.GetAdjective]."
 BBA_ethiopia_exile_events.17.a: "Kita pasti bisa menyelamatkan beberapa kapal perusak"
 ETH_destroyers_tt: "[ETH.GetName] menerima 5 kapal perusak dari [JAP.GetName]."
 BBA_ethiopia_exile_events.17.b: "Mari kita beri mereka sebuah kapal penjelajah dengan beberapa pengawal"
 ETH_cruiser_tt: "[ETH.GetName] menerima sebuah kapal penjelajah berat dan 3 kapal perusak dari [JAP.GetName]."
 BBA_ethiopia_exile_events.17.c: "[FROM.GetLeader] membutuhkan andalan yang mengesankan"
 ETH_battleship_tt: "[ETH.GetName] menerima kapal perang [JAP.GetAdjective]."
 BBA_ethiopia_exile_events.17.d: "Kita tidak bisa menyisihkan kapal mana pun, tapi setidaknya kita bisa memberi mereka pengetahuan"
 BBA_ethiopia_exile_events.18.t: "[FROM.GetAdjective] Penghancur"
 BBA_ethiopia_exile_events.18.desc: "Angkatan Laut [FROM.GetAdjective] telah dengan baik hati memasok kami unit kapal perusak sesuai dengan janji [FROM.GetLeader] untuk memasok [ROOT.GetName] dengan angkatan laut."
 BBA_ethiopia_exile_events.18.a: "Setidaknya itu sesuatu"
 BBA_ethiopia_exile_events.19.t: "Awal Mula Angkatan Laut [ROOT.GetAdjective]"
 BBA_ethiopia_exile_events.19.desc: "Mengikuti janji [FROM.GetLeader] untuk memasok [ROOT.GetName] dengan beberapa kapal, [FROM.GetAdjective] telah memindahkan sebuah kapal penjelajah dan beberapa kapal perusak ke kendali [ROOT.GetAdjective]. Mungkin bukan armada besar, tapi armadanya besar. Awal era baru untuk [ROOT.GetName]"
 BBA_ethiopia_exile_events.19.a: "Ini hanyalah permulaan"
 BBA_ethiopia_exile_events.20.t: "Sebuah Kapal Perang [ROOT.GetAdjective]"
 BBA_ethiopia_exile_events.20.desc: "Setelah kunjungan [ROOT.GetLeader] ke [FROM.GetLeader], [FROM.GetName] memerintahkan agar kapal perang dipindahkan ke [ROOT.GetName]. Oleh karena itu, [ROOT.GetNavy] kini memiliki andalan baru. Kita perlu membangun pengawalan, tapi dengan bantuan [FROM.GetAdjective], hal itu seharusnya bisa dilakukan."
 BBA_ethiopia_exile_events.20.a: "Berita bagus"
 BBA_ethiopia_exile_events.21.t: "Tidak Ada Kapal"
 BBA_ethiopia_exile_events.21.desc: "Terlepas dari janji [FROM.GetLeader] kepada [ROOT.GetLeader] kapal, keadaan angkatan laut [FROM.GetAdjective] berarti bahwa [FROM.GetName] tidak dapat berpisah dengan kapal mana pun saat ini. Sebagai kompensasinya, angkatan laut [FROM.GetAdjective] telah mengizinkan [ROOT.GetName] untuk mempelajari desain kapal [FROM.GetAdjective], dan metode produksi, untuk mentransfer pengetahuan pembuatan kapal ke [ROOT.GetName]."
 BBA_ethiopia_exile_events.21.a: "Bagaimanapun, ini lebih baik daripada tidak sama sekali"
 BBA_ethiopia_exile_events.22.t: "[ROOT.GetLeader] Menjanjikan [FROM.GetLeader] sebuah Pulau"
 BBA_ethiopia_exile_events.22.desc: "Rupanya, [ROOT.GetLeader], telah menjanjikan [FROM.GetLeader] salah satu pulau [ROOT.GetName] untuk digunakan sebagai basis pemerintahan, dan untuk memulai penaklukan kembali [FROM.GetName]. Ini merupakan pengakuan resmi [FROM.GetLeader] sebagai penguasa [FROM.GetNameDef], dan akan dianggap sebagai pernyataan perang oleh [ITA.getName]. Namun, ini juga merupakan peluang untuk memperluas pengaruh [ROOT.GetNameDef]."
 BBA_ethiopia_exile_events.22.a: "Bagaimana dengan [647.GetName]?"
 BBA_ethiopia_exile_events.22.b: "[524.GetName] akan menjadi basis yang bagus"
 BBA_ethiopia_exile_events.22.c: "[543.GetName] itu sebuah pulau ya?"
 BBA_ethiopia_exile_events.22.d: "Mereka dapat memiliki [?ETH.japanese_island.GetName]"
 BBA_ethiopia_exile_events.22.e: "Mereka dapat memiliki salah satu pulau [ENG.GetAdjective]"
 BBA_ethiopia_exile_events.23.t: "Pulau Etiopia"
 BBA_ethiopia_exile_events.23.desc: "Sebagai tawaran niat baik, dan sebagai pengakuan terhadap [ROOT.GetLeader] sebagai penguasa sah [ROOT.GetNameDef], [FROM.GetLeader] telah memberikan [ROOT.GetLeader] pulau [?ETH.japanese_island.GetName] sebagai tempat persiapan untuk reklamasi [ROOT.GetName].\n\n[FROM.GetNameDef] akan membantu [ROOT.GetName] dalam penaklukan kembali dari wilayah yang hilang. Sebagai imbalan atas bantuan ini, [ROOT.GetLeader] telah bersumpah setia kepada [FROM.GetLeader], yang mempererat hubungan kedua negara dalam perjuangan mereka melawan imperialisme Eropa."
 BBA_ethiopia_exile_events.23.a: "[?ETH.japanese_island.GetName] adalah milik kita"
 BBA_ethiopia_exile_events.24.t: "Basis Operasi untuk Ethiopia"
 BBA_ethiopia_exile_events.24.desc: "Dalam perjanjian rahasia yang dibuat oleh kepala negara [ROOT.GetNameDef] dan [FROM.GetNameDef], sejumlah negara bagian di jazirah Arab telah dijanjikan untuk [FROM.GetNameDef] jika jatuh ke tangan pemerintah [ROOT.GetAdjective]. Wilayah tersebut akan diserahkan pada saat yang tepat, namun tentunya perlu diamankan terlebih dahulu."
 BBA_ethiopia_exile_events.24.a: "Hal ini akan membuat mereka menjadi sekutu yang lebih kuat"
 ETH_transfer_states_tt: "Akan ditransfer ke §Y[ETH.GetNameWithFlag]§! bila dimiliki oleh §Y[ROOT.GetNameWithFlag]§!"
 BBA_ethiopia_exile_events.30.t: "Aplikasi Reksa Fraksi"
 BBA_ethiopia_exile_events.30.desc: "[FROM.GetNameDefCap] menyarankan agar kita menyerahkan permohonan keanggotaan bersama kepada faksi yang menentang [ITA.GetNameDef]. Hal ini bertentangan dengan kebijakan historis kami, namun sekali lagi, membiarkan pemimpin [FROM.GetAdjective] tetap berada di [ROOT.GetName] sudah melanggar kebijakan tersebut."
 BBA_ethiopia_exile_events.30.a: "Ini adalah peningkatan yang alami"
 BBA_ethiopia_exile_events.30.b: "Tidak, ini satu langkah terlalu jauh"
 BBA_ethiopia_exile_events.31.t: "[FROM.GetName] Menolak Proposal kami"
 BBA_ethiopia_exile_events.31.desc: "Pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk mengajukan permohonan keanggotaan bersama. Sayangnya hal ini berarti kita harus berjuang sebagai negara masing-masing, dibandingkan mendapat dukungan dari aliansi yang lebih besar."
 BBA_ethiopia_exile_events.31.a: "Setidaknya kami mencoba"
 BBA_ethiopia_exile_events.32.t: "Aplikasi Keanggotaan Bersama dari [FROM.GetName] dan [FROM.FROM.GetName]"
 BBA_ethiopia_exile_events.32.desc: "[FROM.GetLeader] dan [FROM.FROM.GetLeader] telah menghubungi kami dengan permintaan untuk bergabung dengan [ROOT.GetFactionName]. Hal ini akan menempatkan kekuatan [FROM.GetNameDef] dan [FROM.FROM.GetNameDef] di tangan [ROOT.GetFactionName] dalam perang melawan [ITA.GetName]."
 BBA_ethiopia_exile_events.32.a: "Ini sepertinya ide yang bagus"
 BBA_ethiopia_exile_events.32.b: "Kita lebih baik tanpa mereka"
 BBA_ethiopia_exile_events.33.t: "[FROM.GetName] Menolak"
 BBA_ethiopia_exile_events.33.desc: "Sayangnya, [FROM.GetName] menolak permintaan gabungan [SWE.GetAdjective]-[ETH.GetAdjective] untuk bergabung dengan [FROM.GetFactionName]. Untuk beberapa alasan yang aneh mereka menolak untuk melihat manfaat dari kekuatan gabungan melawan [ITA.GetLeader]."
 BBA_ethiopia_exile_events.33.a: "Mengganggu"
 BBA_ethiopia_exile_events.34.t: "[FROM.GetNameDefCap] Setuju"
 BBA_ethiopia_exile_events.34.desc: "[FROM.GetNameDefCap] telah mengizinkan kami bergabung dengan [FROM.GetFactionName]. Kami sekarang memiliki peluang lebih besar untuk mengalahkan [ITA.GetName]."
 BBA_ethiopia_exile_events.34.a: "Berita Hebat"
 BBA_ethiopia_exile_events.40.t: "[FROM.GetName] Meminta Mediasi"
 BBA_ethiopia_exile_events.40.desc: "Kaisar [FROM.GetName], [FROM.GetLeader] yang diasingkan telah meminta mediasi [ROOT.GetAdjective] dalam perang Italia-Ethiopia. [GetGermanCountryLeaderTitle] telah menyatakan minat pribadinya untuk menyelesaikan konflik yang gagal diselesaikan oleh Liga Bangsa-Bangsa. Pencapaian ini akan meningkatkan status [ROOT.GetName] di kancah dunia."
 BBA_ethiopia_exile_events.40.a: "[ITA.GetName] harus keluar dari [FROM.GetName]"
 BBA_ethiopia_exile_events.40.b: "[ITA.GetLeader] harus ditawari sesuatu"
 BBA_ethiopia_exile_events.40.c: "Kita harus membuat perbatasan baru yang lebih stabil"
 BBA_ethiopia_exile_events.41.t: "[FROM.GetAdjective] Mediasi"
 BBA_ethiopia_exile_events.41.desc_back_off: "[FROM.GetLeader] jelas telah memihak musuh kita. [?global.ETH_peace_country.GetLeader] telah diizinkan untuk tinggal, dan berpura-pura masih berkuasa, di [FROM.GetNameDef] selama beberapa waktu sekarang. Kebohongan mantan pimpinan [?global.ETH_peace_country.GetNameDef] jelas mempengaruhi [FROM.GetLeader] dan merendahkan opini [FROM.GetLeader.GetHerHis] terhadap [ROOT.GetNameDef]. Sekarang [FROM.GetNameDef] menuntut kita untuk menarik diri dari [?global.ETH_peace_country.GetName], dan mengesampingkan perbedaan-perbedaan kita."
 BBA_ethiopia_exile_events.41.desc_offered_compensation: "Sebagai konsekuensi alami dari mengizinkan pemimpin musuh kita yang diasingkan, [?global.ETH_peace_country.GetLeader], untuk tinggal di [FROM.GetNameDef], [FROM.GetLeader] sekarang ingin menengahi konflik antara [ROOT.GetName] dan [?global.ETH_peace_country.GetName]. [FROM.GetLeader] menyatakan bahwa [FROM.GetLeader.GetSheHe] telah berhasil meyakinkan [?global.ETH_peace_country.GetLeader] untuk memberikan konsesi kecil kepada [ROOT.GetName] sebagai imbalan atas perdamaian dan kemungkinan kerja sama di masa depan."
 BBA_ethiopia_exile_events.41.desc_redraw_map: "Pemimpin [FROM.GetAdjective], [FROM.GetLeader] telah mengusulkan solusi terhadap perang Italia-Ethiopia, dimana [ROOT.GetName] menerima sebagian besar wilayah [?global.ETH_peace_country.GetAdjective], sebagai imbalan atas perdamaian, dan kerja sama di masa depan melawan musuh eksternal. [?global.ETH_peace_country.GetName] akan, seandainya [ROOT.GetName] menerima usulan ini, diberi kompensasi sebesar [550.GetName], sehingga mereka juga memperoleh sesuatu. Hal ini akan mengkonsolidasikan kepemilikan [ROOT.GetAdjective] di Afrika, sekaligus memberikan [?global.ETH_peace_country.GetName] akses ke laut."
 BBA_ethiopia_exile_events.41.a: "Ini mungkin yang terbaik"
 BBA_ethiopia_exile_events.41.b: "Ini hanyalah sebuah permulaan, namun orang-orang [ROOT.GetAdjective] perlu menunjukkan lebih banyak upaya mereka"
 BBA_ethiopia_exile_events.41.c: "Menurut [FROM.GetLeader.GetSheHe] siapa [FROM.GetLeader.GetSheHe] itu?"
 BBA_ethiopia_exile_events.42.t: "[FROM.GetLeader] menginginkan lebih"
 BBA_ethiopia_exile_events.42.desc: "Proposal perdamaian yang diajukan oleh [GetGermanCountryLeaderTitle] tidak langsung ditolak oleh [FROM.GetLeader]. Namun, pemerintah [FROM.GetAdjective] merasa perlu lebih banyak upaya untuk menunjukkan upaya mereka meredam oposisi publik terhadap rezim dan oleh karena itu meminta kami untuk mempertimbangkannya kembali."
 BBA_ethiopia_exile_events.42.a: "Dapat dimengerti"
 BBA_ethiopia_exile_events.42.b: "Beraninya mereka mempertanyakan perintah kita?"
 BBA_ethiopia_exile_events.43.t: "[FROM.GetName] Menerima Permintaan kami"
 BBA_ethiopia_exile_events.43.desc: "[FROM.GetLeader] memahami perlunya [ETH.GetName] menyerahkan wilayah untuk mengakhiri konflik dengan cara yang memungkinkan kita menyelamatkan muka masyarakat. Kita akan segera dapat melupakan kekacauan invasi ini dengan kepala tegak."
 BBA_ethiopia_exile_events.43.a: "Bagus"
 BBA_ethiopia_exile_events.44.t: "[FROM.GetLeader] Marah dengan Permintaan kami"
 BBA_ethiopia_exile_events.44.desc: "Argumen yang dikemukakan oleh [ROOT.GetLeader] tidak didengarkan. [FROM.GetLeader] melontarkan kata-kata kasar, mengklaim bahwa proposal yang diajukan adalah demi kepentingan terbaik semua pihak, dan bahwa [ROOT.GetLeader] gagal, karena [ROOT.GetLeader.GetHerHis] gagal menang di Afrika. [FROM.GetAdjective] pasti akan menghancurkan tentara [ROOT.GetAdjective] dalam hitungan minggu, [FROM.GetLeader] melanjutkan dengan berseru."
 BBA_ethiopia_exile_events.44.a: "Ini tidak seperti mereka akan menyatakan perang atau apa pun..."
 BBA_ethiopia_exile_events.45.t: "Mediasi Berhasil"
 BBA_ethiopia_exile_events.45.desc_white_peace: "Mediasi [FROM.GetAdjective] terbukti berhasil. [FROM.FROM.GetLeader] diperintahkan oleh [FROM.GetLeader] untuk menarik pasukan [FROM.FROM.GetLeader.GetHerHis] dari wilayah [ROOT.GetAdjective].\nPerjanjian tersebut tidak menawarkan kompensasi apa pun kepada [ROOT.GetName] namun mudah-mudahan kita dapat menggunakan sekutu baru kita untuk membawa negara ini ke era modern. [FROM.GetAdjective] [GetGermanCountryLeaderTitle], [FROM.GetLeader], telah membuat janji yang tidak jelas tentang memulihkan kejayaan kerajaan [ROOT.GetAdjective]."
 BBA_ethiopia_exile_events.45.desc_redraw_map: "[FROM.GetLeader] telah menjadi perantara perdamaian dengan [FROM.FROM.GetNameDef]. [ROOT.GetNameDefCap] harus menyerahkan seluruh wilayah selatan kepada [FROM.FROM.GetName]. Sebagai kompensasinya [550.GetName] akan diberikan kepada [ROOT.GetName], untuk menjamin bahwa [ROOT.GetName] mempunyai akses ke laut. Hal ini juga, menurut [FROM.GetLeader] membagi wilayah menjadi satu kesatuan yang menurut [FROM.GetLeader] akan mengurangi risiko konflik di masa depan antara kedua negara."
 BBA_ethiopia_exile_events.45.desc_cede_territory: "[FROM.GetLeader] telah menjadi perantara perdamaian dengan [FROM.FROM.GetNameDef]. Sayangnya, kedua pemimpin telah memutuskan di atas kepala kita bahwa [FROM.FROM.GetName] akan mendapatkan bagian dari [ROOT.GetName]. Sebenarnya tidak ada yang bisa kita lakukan untuk mengatasinya."
 BBA_ethiopia_exile_events.45.a: "Setidaknya semacam kedamaian"
 BBA_ethiopia_exile_events.46.t: "Gagal Mediasi"
 BBA_ethiopia_exile_events.46.desc: "Sayangnya, upaya [FROM.GetLeader] untuk menjadi perantara perjanjian damai dengan [FROM.FROM.GetNameDef] tidak membuahkan hasil. [FROM.FROM.GetLeader] menolak untuk melihat alasannya. Harapan kami sekarang adalah kami dapat mengajak [FROM.GetNameDef] untuk bergabung dengan kami dalam perang."
 BBA_ethiopia_exile_events.46.a: "Kami mempunyai harapan yang lebih tinggi untuk ini"
 BBA_ethiopia_exile_events.47.t: "[FROM.GetLeader] Menolak Bekerjasama"
 BBA_ethiopia_exile_events.47.desc: "Balasan [FROM.GetAdjective] jauh dari memuaskan. [FROM.GetLeader] menolak mengalah. [FROM.GetName] tidak akan menghentikan perang sampai mereka menang, atau dihancurkan saat mencoba."
 BBA_ethiopia_exile_events.47.a: "Kita harus memberi pelajaran pada [FROM.GetLeader.GetHerHim]"
 BBA_ethiopia_exile_events.48.t: "[FROM.GetLeader] Telah Menerima Mediasi kami"
 BBA_ethiopia_exile_events.48.desc: "Seperti yang diharapkan, [ROOT.GetNameDef] telah berhasil sedangkan yang lainnya gagal. [FROM.GetLeader] telah menerima persyaratan yang dibuat oleh [ROOT.GetLeader]. Akan ada perdamaian antara [FROM.GetNameDefCap] dan [?global.ETH_peace_country.GetNameDef]. Bersama-sama kita semua kini dapat beralih ke hal-hal yang lebih penting."
 BBA_ethiopia_exile_events.48.a: "[ROOT.GetLeader] adalah penjamin perdamaian di zaman kita"
 BBA_ethiopia_exile_events.50.t: "Insiden Perbatasan"
 BBA_ethiopia_exile_events.50.desc: "Sebuah pos perbatasan [ROOT.GetAdjective] diserang dari sisi [ITA.GetAdjective]. [ROOT.GetAdjective] membalas tembakan ke arah penembak jitu [ITA.GetAdjective] dan baku tembak yang panjang pun terjadi. Tentara terluka di kedua sisi. Protes resmi telah disampaikan kepada pemerintah [ITA.GetAdjective]. Namun mereka mengaku tidak bersalah, malah menuduh pasukan kita yang memulai insiden tersebut."
 BBA_ethiopia_exile_events.50.a: "Ini jauh dari perilaku yang dapat diterima"
 BBA_ethiopia_exile_events.51.t: "Insiden Perbatasan yang Mencurigakan"
 BBA_ethiopia_exile_events.51.desc: "Pemerintah [GER.GetAdjective] telah menyampaikan protes dengan kata-kata marah setelah insiden di perbatasan Italia-Jerman. Seseorang melepaskan tembakan. Laporan yang ada sangat kontradiktif, beberapa menyatakan baku tembak dimulai dari pihak Italia, sementara tidak ada penjaga perbatasan yang selamat yang mengaku menembak sebelum Jerman membuka diri terhadap mereka. Fakta bahwa tentara Italia tidak berada di balik perlindungan apa pun semakin memperkuat kesaksian ini."
 BBA_ethiopia_exile_events.51.a: "Ini jelas merupakan plot [GER.GetAdjective]"
 BBA_ethiopia_exile_events.52.t: "Diplomasi Ruang Belakang"
 BBA_ethiopia_exile_events.52.desc: "Pesta yang diadakan baru-baru ini di kediaman Yang Mulia [ETH.GetLeader] terbukti sukses besar. Sementara para tamu berbaur dan menikmati makanan lezat yang diimpor dari seluruh dunia, para politisi [?ETH.host_nation.GetAdjective] mendengar dari [ETH.GetAdjective] orang buangan tentang pendudukan brutal [ITA.GetAdjective] di tanah air. Banyak yang tergerak untuk mendukung komitmen yang lebih besar terhadap sumber daya [?ETH.host_nation.GetAdjective] dalam membantu kami membebaskan [ETH.GetNameDef] suatu hari nanti."
 BBA_ethiopia_exile_events.52.a: "Satu langkah lebih dekat untuk pulang."
 BBA_ethiopia_exile_events.53.t: "Upaya Lobi yang Berhasil"
 BBA_ethiopia_exile_events.53.desc: "Beberapa bulan terakhir telah terlihat berbagai upaya untuk melobi dukungan di antara tuan rumah kami untuk membantu kami dalam membebaskan [ETH.GetNameDef]. Yang Mulia telah menulis surat kepada anggota pemerintahan dan militer untuk mempromosikan tujuan kita. Sementara itu, warga pengasingan lainnya melakukan wawancara dan artikel di banyak surat kabar untuk menggalang dukungan dari masyarakat [?ETH.host_nation.GetAdjective]. Meski sulit, nampaknya suasana bangsa kini beralih ke dukungan militer langsung untuk membebaskan [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.53.a: "Usahanya sepadan!"
 BBA_ethiopia_exile_events.54.t: "Upaya Penggalangan Dana"
 BBA_ethiopia_exile_events.54.desc: "Upaya penggalangan dana kami baru-baru ini terbukti sangat menguntungkan. Perbendaharaan kekaisaran telah menyaksikan aliran masuk uang tunai yang sangat besar dari para donor di seluruh dunia. Tampaknya ada banyak orang yang merasakan kemarahan yang sama atas pendudukan [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.54.a: "Kita tidak akan melupakan kontribusi mereka terhadap tujuan ini."
 BBA_ethiopia_exile_events.55.t: "[?ETH.host_nation.GetAdjective] Perekrutan Tentara Bayaran"
 BBA_ethiopia_exile_events.55.desc: "Upaya baru-baru ini dalam mempromosikan tujuan kami telah menunjukkan masuknya [?ETH.host_nation.GetAdjective] tentara bayaran yang menawarkan layanan mereka kepada kami dalam pertempuran mendatang. Tentu saja dengan harga tertentu."
 BBA_ethiopia_exile_events.55.a: "Kekuatan kami tumbuh semakin kuat setiap hari."
 BBA_ethiopia_exile_events.56.t: "[?ETH.host_nation.GetAdjective] Pilot Menjawab Panggilan"
 BBA_ethiopia_exile_events.56.desc: "Kami telah melihat sejumlah pilot [?ETH.host_nation.GetAdjective] menjawab panggilan untuk membantu kami dalam pembebasan tanah air kami yang akan datang. Mereka membawa serta segudang pengalaman yang sedang mereka bagikan kepada calon pilot kami."
 BBA_ethiopia_exile_events.56.a: "Kami akan mengambil semua bantuan yang kami bisa dapatkan."
 BBA_ethiopia_exile_events.57.t: "Armada Bantu [ETH.GetName]"
 BBA_ethiopia_exile_events.57.desc: "Seruan baru-baru ini agar para pelaut dan kapal [?ETH.host_nation.GetAdjective] bersedia menghadapi perairan yang dipenuhi musuh telah dipenuhi oleh sejumlah sukarelawan yang bersedia. Pensiunan personel angkatan laut, pelaut sipil, dan sukarelawan muda yang hanya mencari petualangan telah melangkah maju untuk mengawaki armada kapal kargo beraneka ragam yang telah kami kumpulkan dari pangkalan pemutus [?ETH.host_nation.GetNameDef]."
 BBA_ethiopia_exile_events.57.a: "Semoga saja kapal-kapal tersebut masih layak berlayar..."
 BBA_ethiopia_exile_events.58.t: "Pengiriman Senapan Dikirim"
 BBA_ethiopia_exile_events.58.desc: "Senapan yang dibeli dari produsen [?ETH.host_nation.GetAdjective] telah dikirim ke pasukan kami yang berada di [?ETH.host_nation.GetName]. Peralatan baru ini sekarang sedang diuji di lapangan tembak dan latihan."
 BBA_ethiopia_exile_events.58.a: "Uang dibelanjakan dengan baik."
 BBA_ethiopia_exile_events.59.t: "Peralatan Pendukung Dikirim"
 BBA_ethiopia_exile_events.59.desc: "Pembelian peralatan pendukung pasukan kami baru-baru ini telah dikirimkan. Meskipun ini mungkin bukan peralatan paling mutakhir di dunia, namun tetap akan sangat membantu di garis depan."
 BBA_ethiopia_exile_events.59.a: "Setiap hal kecil membantu."
 BBA_ethiopia_exile_events.60.t: "Tank Dikirim"
 BBA_ethiopia_exile_events.60.desc: "Tank-tank yang dibeli dari surplus tentara [?ETH.host_nation.GetAdjective] kini telah dipindahkan ke angkatan bersenjata kita. Tank-tank tersebut adalah model lama yang tidak digunakan lagi dalam beberapa tahun terakhir. Namun, mereka masih berfungsi penuh dan sekarang digunakan untuk melatih kru, siap untuk ditempatkan di garis depan."
 BBA_ethiopia_exile_events.60.a: "Tangki apa pun lebih baik daripada tidak ada tangki."
#Imperial Events, non-exile stuff
 BBA_ethiopia_imperial_events.1.t: "[FROM.GetName] ingin membeli Djibouti"
 BBA_ethiopia_imperial_events.1.desc: "[FROM.GetLeader] ingin membeli koloni [ROOT.GetAdjective] dari [268.GetName]. Pembelian tersebut akan memberikan [FROM.GetNameDef] akses ke laut melalui pelabuhan Djibouti, yang sudah terdapat sambungan kereta api dari Addis Ababa. Mereka menawarkan jumlah yang layak untuk sebuah koloni kecil."
 BBA_ethiopia_imperial_events.1.a: "Kita bisa memanfaatkan uang itu dengan baik"
 BBA_ethiopia_imperial_events.1.b: "Ini adalah [ROOT.GetAdjective], dan akan tetap demikian!"
 BBA_ethiopia_imperial_events.2.t: "[FROM.GetNameDefCap] Setuju Jual Djibouti"
 BBA_ethiopia_imperial_events.2.desc: "Negosiasi dengan pemerintah [FROM.GetAdjective] mengenai potensi pembelian koloni [268.GetName], telah berakhir dengan sukses. [FROM.GetNameDefCap] telah setuju untuk segera mengubah pelabuhan Djibouti dan wilayah sekitarnya menjadi [ROOT.GetName], sehingga keduanya memberi kita akses ke pelabuhan, menyatukan orang-orang Afar di bawah satu penguasa."
 BBA_ethiopia_imperial_events.2.a: "Berita bagus"
 BBA_ethiopia_imperial_events.3.t: "[FROM.GetName] Menolak Menjual Djibouti"
 BBA_ethiopia_imperial_events.3.desc: "Sayangnya, pemerintah [FROM.GetAdjective] telah menolak permintaan kami untuk membeli pelabuhan Djibouti dari mereka. Alih-alih melihat keuntungan bersama, mereka mati-matian mempertahankan koloni mereka dan menolak menyerahkan satu inci pun tanah yang telah mereka rampas."
 BBA_ethiopia_imperial_events.3.a: "Kami harus mempertimbangkan metode lain"
 BBA_ethiopia_imperial_events.4.t: "[FROM.GetNameDefCap] Permintaan [689.GetName]."
 BBA_ethiopia_imperial_events.4.desc: "Gerakan Rastafarian di [689.GetName] mengklaim bahwa $ETH_haile_selassie$ adalah Mesias atau Jah, nama mereka untuk dewa, yang bereinkarnasi. Secara tidak terduga, $ETH_haile_selassie$ telah mendapatkan reputasi tersebut dan pemerintah [FROM.GetAdjective] telah meminta agar tanah air gerakan tersebut, yaitu [689.GetName] dimasukkan ke dalam kerajaan [FROM.GetAdjective]."
 BBA_ethiopia_imperial_events.4.a: "Permintaan yang aneh, tapi kenapa tidak?"
 BBA_ethiopia_imperial_events.4.b: "Kami akan menjadi bagian dari kerajaan Sion"
 BBA_ethiopia_imperial_events.4.c: "Tidak mungkin!"
 BBA_ethiopia_imperial_events.5.t: "[FROM.GetNameDefCap] telah Menerima Permintaan kami"
 BBA_ethiopia_imperial_events.5.desc: "Permintaan kami yang sederhana untuk pengalihan kendali [689.GetName] telah diterima oleh [FROM.GetNameDef]. Ini menandai dimulainya era baru. Kemuliaan bagi $ETH_haile_selassie$. Mudah-mudahan ini berarti kami dapat menarik pengikut dari seluruh Amerika."
 BBA_ethiopia_imperial_events.5.a: "Mereka telah melihat cahayanya"
 BBA_ethiopia_imperial_events.6.t: "[FROM.GetNameDefCap] Menolak Menyerahkan [689.GetName]"
 BBA_ethiopia_imperial_events.6.desc: "Meskipun kami telah berupaya sebaik mungkin, kami belum berhasil meyakinkan pemerintah [FROM.GetAdjective] bahwa [689.GetName] adalah bagian dari [ROOT.GetAdjective]. Mereka menertawakan permintaan kami, bahkan menimbulkan keraguan akan keilahian pemimpin besar kami."
 BBA_ethiopia_imperial_events.6.a: "Beraninya mereka!"
 BBA_ethiopia_imperial_events.7.t: "[FROM.GetLeader] Permintaan Pengajuan"
 BBA_ethiopia_imperial_events.7.desc: "Gerakan Rastafarian di [689.GetName] mengklaim bahwa $ETH_haile_selassie$ adalah Mesias atau Jah, nama mereka untuk dewa, yang bereinkarnasi. Di luar dugaan, $ETH_haile_selassie$ telah mendapatkan reputasi tersebut. Sebagai konsekuensinya, [FROM.GetLeader.GetSheHe] sekarang meminta agar [ROOT.GetNameDef] secara resmi bergabung dengan [FROM.GetAdjective] dan menciptakan basis kekuatan baru di Karibia, yang darinya pengaruhnya dapat menyebar ke seluruh dunia."
 BBA_ethiopia_imperial_events.7.a: "Ini sepertinya ide yang bagus"
 BBA_ethiopia_imperial_events.7.b: "Mereka benar-benar kehilangannya"
 BBA_ethiopia_imperial_events.8.t: "[FROM.GetNameDefCap] Menyerahkan"
 BBA_ethiopia_imperial_events.8.desc: "[FROM.GetLeader] telah mengambil keputusan bijak untuk menerima kekuasaan kami. [FROM.GetName] akan menjadi subjek setia [ROOT.GetLeader]."
 BBA_ethiopia_imperial_events.8.a: "Kemuliaan bagi [ROOT.GetLeader]"
 BBA_ethiopia_imperial_events.9.t: "[FROM.GetNameDefCap] Menolak untuk Menyerah"
 BBA_ethiopia_imperial_events.9.desc: "Sayangnya, [FROM.GetNameDef] menolak tawaran baik untuk menjadi subjek [ROOT.GetLeader]. Meskipun kami telah berupaya semaksimal mungkin, kami gagal meyakinkan pemerintah [FROM.getName] bahwa hal ini memang menguntungkan kedua belah pihak."
 BBA_ethiopia_imperial_events.9.a: "Anda tidak bisa memenangkan semuanya"
 BBA_ethiopia_imperial_events.10.t: "[FROM.GetNameDefCap] Mengirimkan Ultimatum"
 BBA_ethiopia_imperial_events.10.desc: "[FROM.GetNameDefCap] telah menuntut penaklukan dan integrasi kita ke dalam negara mereka. Jika kita menuruti tentu saja ini akan menjadi akhir dari [THIS.GetName] sebagai bangsa yang merdeka. Tidak jelas sejauh mana [FROM.GetLeader] bersedia melakukan upaya untuk mencapai integrasi, namun kemungkinan terjadinya konflik bersenjata belum dapat dikesampingkan."
 BBA_ethiopia_imperial_events.10.a: "Kami tidak punya pilihan..."
 BBA_ethiopia_imperial_events.10.b: "Kami tidak akan diancam."
 BBA_ethiopia_imperial_events.11.t: "[FROM.GetNameDefCap] Tolak Ultimatum"
 BBA_ethiopia_imperial_events.11.desc: "[FROM.GetNameDefCap] telah menolak tuntutan kami untuk reintegrasi. Berkali-kali [FROM.GetName] rela mengkhianati kita demi melindungi diri, kita tidak bisa membiarkan hal itu terjadi lagi."
 BBA_ethiopia_imperial_events.11.a: "Kami akan mengakhiri ini."
 BBA_ethiopia_imperial_events.11.b: "Ada hal-hal yang lebih penting yang harus kita tangani."
 BBA_ethiopia_imperial_events.12.t: "[FROM.GetNameDefCap] Menerima Permintaan"
 BBA_ethiopia_imperial_events.12.desc: "[FROM.GetNameDefCap] telah menerima perlunya reintegrasi dengan [THIS.GetName]. [FROM.GetLeader] kini telah bersumpah setia kepada Yang Mulia, [THIS.GetLeader]."
 BBA_ethiopia_imperial_events.12.a: "Satu hal lagi yang perlu dikhawatirkan."
 BBA_ethiopia_imperial_events.20.t: "Kudeta Tak Berdarah oleh $ETH_ras_imru_haile_selassie$"
 BBA_ethiopia_imperial_events.20.desc: "Setelah mengumpulkan dukungan dari kelas menengah dan kaum tani [ETH.GetName], Ras $ETH_ras_imru_haile_selassie$ mengumumkan pencopotan resmi $ETH_haile_selassie$ dan diadakannya pemilihan umum di [ETH.GetNameDef]. Secara umum dianggap oleh rakyat, dan yang lebih penting lagi dalam hal ini, tentara [ETH.GetAdjective], sebagai pahlawan sejati dalam Perang Italia-Ethiopia kedua ia telah berhasil mengamankan kesetiaan militer dan dukungan terhadap ketidakhadiran kaisar gagal terwujud."
 BBA_ethiopia_imperial_events.20.a: "Ras Merah harus memerintah [ETH.GetNameDef]"
 BBA_ethiopia_imperial_events.20.b: "Mengangkat Putra Mahkota sebagai raja konstitusional lebih aman"
 BBA_ethiopia_imperial_events.21.t: "Perlawanan di [ETH.GetName]"
 BBA_ethiopia_imperial_events.21.desc: "Pasukan kami terus menerobos pasukan [ETH.GetAdjective], memberi jalan bagi kekuasaan superior kami. Namun, kami melihat peningkatan aktivitas perlawanan di wilayah kekuasaan baru kami. Tampaknya perkataan mantan penguasa, $ETH_haile_selassie$, yang berbicara kepada Liga Bangsa-Bangsa telah membuat banyak rakyat baru kita menjadi heboh. Tampaknya selama kaisar mereka masih hidup, perlawanan akan menjadi duri bagi pemerintahan kolonial kita."
 BBA_ethiopia_imperial_events.21.a: "Mereka akan tunduk pada peraturan kita, dengan satu atau lain cara."
 ETH_imperial_event_21_tt: "Semua negara bagian §Y[ETH.GetFlag][ETH.GetAdjective]§! yang dikontrol mendapatkan:\nKepatuhan: §R-10%§!"
# Military and technology events 
 BBA_ethiopia_military_and_tech_events.1.t: "Kelas pertama [GetEthiopianMilitaryAcademyName]"
 BBA_ethiopia_military_and_tech_events.1_war.desc: "Kelas pertama yang menyelesaikan [GetEthiopianMilitaryAcademyName] harus langsung berangkat dari sekolah ke medan perang. Berhasil membangun sekolah ini, dan menyelesaikan pendidikan taruna kelas satu, sekaligus berperang, sungguh merupakan prestasi besar.\nInilah dimulainya era baru bagi militer [ROOT.GetAdjective]!"
 BBA_ethiopia_military_and_tech_events.1_peace.desc: "Dengan berakhirnya perang, kita sekarang memiliki kesempatan untuk menyelesaikan pembangunan akademi militer kita. Kadet kelas satu dapat membantu negara kita memenangkan perang di masa depan, dan memastikan kita memanfaatkan pengalaman kita melawan Italia sebaik mungkin."
 BBA_ethiopia_military_and_tech_events.1.a: "Sekolah akan mempertahankan fokus kami pada serangan"
 ETH_ecole_attack_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$modifier_army_sub_unit_infantry_attack_factor$: §G+10%§!\n$modifier_army_sub_unit_irregular_infantry_attack_factor$: §G+10%§!"
 BBA_ethiopia_military_and_tech_events.1.b: "Sekolah akan membantu kita beralih ke pola pikir yang lebih defensif"
 ETH_ecole_defense_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 BBA_ethiopia_military_and_tech_events.1.c: "Sekolah akan memastikan kita tidak pernah siap menghadapi perang"
 ETH_ecole_learn_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!"
# Anti colonialism 
 BBA_ethiopia_anti_colonialism_events.2.t: "[?global.african_supporting_country.GetNameDef] Meminta Pengakuan [?global.african_revolt_country.GetNameDef]"
 BBA_ethiopia_anti_colonialism_events.2.desc: "[?global.african_supporting_country.GetLeader], pemimpin [?global.african_supporting_country.GetNameDef], telah meminta agar perang dengan pemberontak [?global.african_revolt_country.GetAdjective] segera diakhiri. Para diplomat [?global.african_supporting_country.GetAdjective] mendorong [ROOT.GetName] untuk mengakui kemerdekaan [?global.african_revolt_country.GetNameDef]. Mereka tidak secara eksplisit menyatakan bahwa [?global.african_supporting_country.GetNameDef] akan berperang jika kami memutuskan untuk menolak, namun mereka dengan jelas mengisyaratkan kemungkinan tersebut."
 BBA_ethiopia_anti_colonialism_events.2.a: "Mereka benar, kita harus mengakhiri konflik kolonial ini sekarang"
 BBA_ethiopia_anti_colonialism_events.2.b: "Perang akan berakhir ketika [?global.african_revolt_country.GetNameDef] dikalahkan"
 BBA_ethiopia_anti_colonialism_events.3.t: "[?global.african_supporting_country.GetAdjective] Mediasi Berhasil!"
 BBA_ethiopia_anti_colonialism_events.3.desc: "[?global.african_supporting_country.GetLeader], pemimpin [?global.african_supporting_country.GetNameDef], telah berhasil bernegosiasi dengan [?global.african_colonial_country.GetLeader] atas nama kami. [?global.african_colonial_country.GetLeader] telah setuju untuk mengakui kemerdekaan [ROOT.GetAdjective] dan memerintahkan penghentian permusuhan antara [?global.african_colonial_country.GetNameDef] dan [ROOT.GetNameDef]. [ROOT.GetNameDefCap] akan selalu berhutang budi kepada [?global.african_supporting_country.GetNameDef] atas bantuannya dalam perjuangan kita."
 BBA_ethiopia_anti_colonialism_events.3.a: "Akhirnya kebebasan"
 BBA_ethiopia_anti_colonialism_events.4.t: "[FROM.GetNameDefCap] Menolak Mengakui [?global.african_revolt_country.GetAdjective] Kemerdekaan"
 BBA_ethiopia_anti_colonialism_events.4.desc: "Meskipun ada tekanan dari kami, pemerintah [?global.african_colonial_country.GetAdjective] menolak mengakui [?global.african_revolt_country.GetNameDef] dan menghentikan permusuhan. [?global.african_colonial_country.GetAdjective] tampaknya ingin menghancurkan gerakan kemerdekaan. Ini mungkin sejauh yang bisa kita capai hanya dengan diplomasi."
 BBA_ethiopia_anti_colonialism_events.4.a: "Setidaknya kami mencoba"
 BBA_ethiopia_anti_colonialism_events.4.b: "Lalu kita harus membuatnya"
 BBA_ethiopia_anti_colonialism_events.5.t: "[FROM.GetName] Bergabung dalam Perang Melawan [?global.african_colonial_country.GetName]"
 BBA_ethiopia_anti_colonialism_events.5.desc: "Setelah mencoba melakukan mediasi dalam perang kita melawan [?global.african_colonial_country.GetNameDef] dan gagal, [?global.african_supporting_country.GetNameDef] memutuskan untuk secara aktif mulai mendukung perjuangan [ROOT.GetAdjective]. Duta [?global.african_colonial_country.GetAdjective] untuk [?global.african_supporting_country.GetName] telah diberitahu bahwa [?global.african_supporting_country.GetNameDef] menganggap dirinya berperang dengan [?global.african_colonial_country.GetName] mulai saat ini, hingga saat [?global.african_colonial_country.GetNameDef] melepaskan ambisi imperialis dan kolonialnya di Afrika dan di tempat lain."
 BBA_ethiopia_anti_colonialism_events.5.a: "Kekuatan [ROOT.GetName] dan [?global.african_supporting_country.GetName] bersatu!"
 BBA_ethiopia_anti_colonialism_events.6.t: "Kebebasan untuk [FROM.GetNameDef]"
 BBA_ethiopia_anti_colonialism_events.6.desc: "Setelah tekanan diplomatik yang berat dari [ROOT.GetName], termasuk pertemuan langsung antara [ROOT.GetLeader] dan [?global.african_colonial_country.GetLeader], pemerintah [?global.african_colonial_country.GetAdjective] memutuskan untuk mundur, dan mengakui kemerdekaan [?global.african_revolt_country.GetAdjective].\nBerkat intervensi langsung [ROOT.GetAdjective], perang kemerdekaan [?global.african_revolt_country.GetAdjective] akhirnya berakhir. [?global.african_revolt_country.GetNameDefCap] adalah negara bebas, dan [ROOT.GetLeader] pasti akan selamanya menjadi pahlawan di [?global.african_revolt_country.GetNameDef]."
 BBA_ethiopia_anti_colonialism_events.6.a: "Negara lain yang terbebas dari imperialis"
# Industrial and Financial Events
 BBA_ethiopia_industrial_financial_events.2.t: "[FROM.GetNameDefCap] Menuntut Integrasi"
 BBA_ethiopia_industrial_financial_events.2.desc: "Mengutip fakta bahwa perekonomian [ROOT.GetName] dan [FROM.GetName] saling terkait, dan sebagian besar industri di [ROOT.GetName] sudah dikendalikan oleh [FROM.GetName], [FROM.GetLeader] menuntut agar stasiun perbatasan antara kedua negara dihapus. Pengendalian seluruh politik luar negeri ditempatkan di bawah kendali [FROM.Getname] untuk menjamin perlindungan, koordinasi, dan efisiensi yang maksimal. Hal ini sebenarnya berarti berakhirnya kemerdekaan [ROOT.GetAdjective].\nSemua ini akan dilakukan dengan mempertimbangkan kepentingan terbaik kedua negara, [FROM.GetLeader] memastikan."
 BBA_ethiopia_industrial_financial_events.2.a: "Mereka tidak punya hak untuk melakukan ini!"
 BBA_ethiopia_industrial_financial_events.2.b: "Selama kita bisa mempertahankan semacam otonomi"
 BBA_ethiopia_industrial_financial_events.2.c: "Ini benar-benar demi kebaikan kedua negara kita"
 BBA_ethiopia_industrial_financial_events.3.t: "[FROM.GetName] Menolak Bekerjasama"
 BBA_ethiopia_industrial_financial_events.3.desc: "Meskipun kami berupaya sebaik mungkin untuk menjelaskan situasi ini, [FROM.GetLeader] menolak memenuhi tuntutan kami untuk membawa integrasi perekonomian kami ke tingkat berikutnya. [FROM.GetLeader] menyatakan bahwa independensi [FROM.GetName] tidak boleh dirusak, dan tidak boleh menjadi bagian dari pembahasan apapun."
 BBA_ethiopia_industrial_financial_events.3.a: "Kita mungkin harus menggunakan kekuatan untuk melindungi kepentingan kita"
 BBA_ethiopia_industrial_financial_events.4.t: "[FROM.GetName] Ingin Mempertahankan Kendali Sebagian"
 BBA_ethiopia_industrial_financial_events.4.desc: "[FROM.GetLeader] telah melihat kebutuhan untuk lebih meningkatkan kerja sama dan mengoordinasikan kebijakan luar negeri dan keuangan dibandingkan saat ini. Namun, [FROM.GetLeader.GetSheHe] ingin [FROM.GetNAme] mempertahankan otonomi tertentu dalam federasi baru."
 BBA_ethiopia_industrial_financial_events.4.a: "Hal ini tentu bisa diakomodasi"
 BBA_ethiopia_industrial_financial_events.5.t: "[FROM.GetLeader] Setuju"
 BBA_ethiopia_industrial_financial_events.5.desc: "[FROM.GetLeader] telah menandatangani dokumen yang menyatukan [ROOT.GetName] dan [FROM.GetName]. Kebijakan ekonomi akan diselaraskan, kantor-kantor luar negeri akan digabungkan menjadi satu. Sistem peradilan akan digabungkan untuk mempermudah kerja sama penuh.\n[FROM.GetNameDefCap] mulai hari ini akan menjadi bagian integral dari [ROOT.GetName]."
 BBA_ethiopia_industrial_financial_events.5.a: "Ini demi kepentingan semua orang"
#Fascist Ethiopia
 BBA_ethiopia_fascist_events.01.t: "Sebuah Peluang untuk Perubahan"
 BBA_ethiopia_fascist_events.01.desc: "Pendekatan konfrontatif $ETH_haile_selassie$ terhadap Italia, ditambah dengan kepercayaannya pada Liga Bangsa-Bangsa, tidak membuahkan hasil. Jelas bagi semua orang bahwa ini akan menjadi malapetaka bagi [ROOT.GetName].\n\nPerang adalah peluang untuk perubahan, bahkan membuat perubahan tentu saja menjadi suatu keharusan. Tindakan pertama yang harus dilakukan adalah mengirim duta besar ke Italia untuk merundingkan perjanjian damai yang dapat mereka terima."
 BBA_ethiopia_fascist_events.01.a: "$ETH_haile_selassie_gugsa$ adalah pilihan yang jelas"
 ETH_start_civil_war: "§Y$ETH_haile_selassie_gugsa$§! akan memulai §Yperang saudara§! melawan §Y$ETH_haile_selassie$§! ketika fokus §Y$ETH_declare_for_italy$§! selesai."
 ETH_cede_states_tt: "Ketika perang usai, §Y[ITA.GetNameWithFlag]§! akan menerima negara bagian berikut:"
 ETH_cede_south_tt: "§Y[835.GetName]\n[836.GetName]\n[837.GetName]§!"
 ETH_ethiopia_italian_puppet_tt: "§Y[ETH.GetNameDef]§! akan menjadi mata pelajaran §Y[ITA.GetNameDef]§!"
 ETH_italy_refuse_cooperation: "Fokus §Y$ETH_reach_out_to_the_italians$§! akan dibatalkan, fokus §Y$ETH_rally_around_the_emperor$§! akan dilengkapi secara otomatis."
 BBA_ethiopia_fascist_events.01.b: "Kirim $ETH_hailu_tekle_haymanot$ dari $gojjam$"
 ETH_start_civil_war_gojjam: "§Y$ETH_hailu_tekle_haymanot$§! dari $gojjam$ akan memulai §Yperang saudara§! melawan §Y$ETH_haile_selassie$§! ketika fokus §Y$ETH_declare_for_italy$§! selesai."
 ETH_gojjam_italian_puppet_tt: "§Y$gojjam$§! akan menjadi mata pelajaran §Y[ITA.GetNameWithFlag]§!"
 ETH_cede_south_west_tt: "§Y[838.GetName]\n[836.GetName]\n[837.GetName]§!"
 BBA_ethiopia_fascist_events.01.c: "Mungkin $ETH_abba_jofir$ memiliki peluang terbaik untuk sukses"
 ETH_start_civil_war_jimma: "§Y$ETH_abba_jofir$§! dari $jimma$ akan memulai §Yperang saudara§! melawan §Y$ETH_haile_selassie$§! ketika fokus §Y$ETH_declare_for_italy$§! selesai."
 ETH_cede_north_tt: "§Y[841.GetName]\n[842.GetName]\n[843.GetName]§!"
 ETH_jimma_italian_puppet_tt: "§Y$jimma$§! akan menjadi mata pelajaran §Y[ITA.GetNameWithFlag]§!"
 BBA_ethiopia_fascist_events.02.t: "Pelaku Mencari Kedamaian"
 BBA_ethiopia_fascist_events.02.desc: "Salah satu bangsawan [ETH.GetAdjective], $ETH_haile_selassie_gugsa$, yang juga berhak atas takhta, telah mendekati komando tinggi [ROOT.GetAdjective] di [ETH.GetName]. Bangsawan menawarkan bantuan melawan [ETH.GetLeader] sebagai imbalan atas kendali atas sebagian negara setelah perang. $ETH_haile_selassie_gugsa$ tentu saja akan bersumpah setia kepada $ITA_vittorio_emanuele_iii$, menggantikannya di [ETH.GetName]."
 BBA_ethiopia_fascist_events.02.a: "Hal ini sebenarnya cukup menguntungkan"
 BBA_ethiopia_fascist_events.02.b: "Tidak, kami tidak memerlukan bantuan apa pun, terima kasih"
 BBA_ethiopia_fascist_events.03.t: "$gojjam$ Otonom?"
 BBA_ethiopia_fascist_events.03.desc: "Perwakilan dari $gojjam$ yang berpura-pura dipenjara, $ETH_hailu_tekle_haymanot$ menawarkan untuk mendukung [ROOT.GetName] penaklukan [ETH.GetName] dengan imbalan pengangkatan kembali $ETH_hailu_tekle_haymanot$ sebagai pemimpin $gojjam$ semi-otonom. Pemberontakan bersenjata di utara pasti akan melumpuhkan pasukan [ETH.GetAdjective] dan membawa kemenangan cepat."
 BBA_ethiopia_fascist_events.03.a: "Hal ini sebenarnya cukup menguntungkan"
 BBA_ethiopia_fascist_events.03.b: "Tidak, kami tidak memerlukan bantuan apa pun, terima kasih"
 BBA_ethiopia_fascist_events.04.t: "Pemimpin $jimma$ yang Digulingkan Menawarkan Bantuan"
 BBA_ethiopia_fascist_events.04.desc: "$ETH_abba_jofir$, putra sultan terakhir $jimma$ telah menawarkan untuk bekerja sama dengan [ROOT.getName] sebagai imbalan atas [ROOT.GetAdjective] pengakuan status $ETH_abba_jofir$ sebagai penguasa $jimma$. $jimma$ tentu saja akan menjadi bagian dari kerajaan [ROOT.GetAdjective], dan $ETH_abba_jofir$ akan bersumpah setia kepada mahkota [ROOT.GetAdjective], jika [ROOT.getName] menerima tawaran tersebut."
 BBA_ethiopia_fascist_events.04.a: "Seorang sultan boneka bisa melayani kita dengan baik"
 BBA_ethiopia_fascist_events.04.b: "Tidak, kami tidak memerlukan bantuan apa pun, terima kasih"
 BBA_ethiopia_fascist_events.05.t: "[FROM.GetName] Menerima Penawaran kami"
 BBA_ethiopia_fascist_events.05.desc: "Misi ke markas [FROM.GetAdjective] disambut dengan sukses besar. [ITA.GetLeader] telah menyetujui rencana pemberontakan dan menerima kelangsungan negara semi-otonom setelah perang. Kita harus segera memulai pemberontakan, sebelum mereka berubah pikiran."
 BBA_ethiopia_fascist_events.05.a: "Awal dari era baru"
 BBA_ethiopia_fascist_events.06.t: "Orang Italia Menolak Bekerja Sama"
 BBA_ethiopia_fascist_events.06.desc: "Sayangnya, [FROM.GetLeader] tampaknya sangat ingin menaklukkan seluruh Etiopia. [FROM.GetNameDefCap] langsung menolak untuk membahas perjanjian damai apa pun, sehingga secara efektif mematikan semua upaya untuk menemukan solusi damai terhadap konflik tersebut. Satu-satunya harapan kami sekarang adalah bersatu di belakang kaisar dan berusaha meraih kemenangan militer."
 BBA_ethiopia_fascist_events.06.a: "Sangat disayangkan"
 BBA_ethiopia_fascist_events.07.t: "Perang Saudara Ethiopia"
 BBA_ethiopia_fascist_events.07.desc: "[ROOT.GetEthiopianCollaboratorName] telah secara terbuka menyatakan untuk Italia, menentang kaisar, dengan menyatakan bahwa ini adalah kelahiran [ROOT.GetName] baru. Meski dalam posisi terdesak, namun $ETH_haile_selassie$ tak mau menerima kekalahan. Pertarungan telah dimulai, dan meskipun sebagian besar pengawal lama masih berpihak pada kaisar, kemungkinan besar pertarungan hanya akan berjalan satu arah."
 BBA_ethiopia_fascist_events.07.a: "Maju menuju kemenangan"
 BBA_ethiopia_fascist_events.50.t: "[ETH.GetAdjective] Pasukan Pendudukan [ROOT.GetAdjective] Somaliland"
 BBA_ethiopia_fascist_events.50.desc: "Karena fokus kami pada urusan dalam negeri, pemerintah [ETH.GetAdjective] telah mengambil keuntungan dari situasi ini dan mengklaim [ROOT.GetAdjective] Somaliland sebagai milik mereka. Terputus dan dengan sedikit harapan untuk melawan, pihak berwenang [Root.GetAdjective] di wilayah tersebut hanya menuruti penyerahan wilayah tersebut. Kita harus memutuskan apakah akan secara resmi mengakui penghinaan ini, atau memutuskan untuk merebut kembali wilayah yang menjadi hak kita."
 BBA_ethiopia_fascist_events.50.a: "Kita harus mengertakkan gigi dan menerima kehilangan."
 BBA_ethiopia_fascist_events.50.b: "Kami tidak akan menerima penghinaan seperti itu!"
 BBA_ethiopia_fascist_events.51.t: "[FROM.GetName] Menerima [ETH.GetAdjective] Kontrol Somaliland"
 BBA_ethiopia_fascist_events.51.desc: "Negara bagian [FROM.GetName] telah secara resmi menerima kendali kami atas bekas wilayah [FROM.GetAdjective] Somaliland. Dengan sedikitnya cara untuk merebut kembali wilayah tersebut, nampaknya mereka lebih memilih untuk tetap fokus pada urusan dalam negeri, daripada terjebak dalam konflik dengan angkatan bersenjata kita yang heroik."
 BBA_ethiopia_fascist_events.51.a: "[ETH.GetName] tumbuh lebih kuat!"
 BBA_ethiopia_fascist_events.52.t: "[FROM.GetName] Menolak [ETH.GetAdjective] Penguasaan Somaliland"
 BBA_ethiopia_fascist_events.52.desc: "Dalam peristiwa yang mengejutkan, negara bagian [FROM.GetName] telah menolak klaim kepemilikan kami atas bekas wilayah [FROM.GetAdjective] Somaliland. Meskipun tidak punya banyak cara untuk merebut kembali wilayah tersebut, nampaknya mereka bertekad untuk mengirimkan prajurit mereka yang tersisa untuk mati melawan angkatan bersenjata kita yang heroik."
 BBA_ethiopia_fascist_events.52.a: "Mereka telah kalah dalam satu perang baru-baru ini, dan akan kalah dalam perang lainnya."
 BBA_ethiopia_fascist_events.53.t: "Minta Peralatan [ITA.GetAdjective]"
 BBA_ethiopia_fascist_events.53.desc: "Meskipun kita mengalami kemajuan besar dalam mereformasi perekonomian dan memperkuat militer, kita masih dapat memperoleh manfaat dari beberapa dukungan dalam tugas-tugas ini. Karena hubungan kami yang semakin erat dengan [ITA.GetAdjective], mereka mungkin bersedia mengirimkan kelebihan perlengkapan mereka kepada kami. Kita hanya perlu memutuskan apa yang harus kita minta."
 BBA_ethiopia_fascist_events.53.a: "Setiap prajurit membutuhkan senapan."
 BBA_ethiopia_fascist_events.53.b: "Artileri akan menghalangi musuh kita."
 BBA_ethiopia_fascist_events.54.t: "[FROM.GetName] Meminta Peralatan Militer"
 BBA_ethiopia_fascist_events.54.desc: "Kami telah menerima permintaan dari [FROM.GetName] untuk peralatan militer. Hal ini akan sangat membantu militer [FROM.GetAdjective] dalam melakukan modernisasi. Ini juga akan membantu kami membersihkan beberapa kelebihan peralatan lama kami."
 BBA_ethiopia_fascist_events.54.a: "Tentunya kita bisa menyisihkan beberapa peralatan lama."
 BBA_ethiopia_fascist_events.54.b: "Tidak, kami tidak ingin [FROM.GetName] menjadi lebih kuat."
 BBA_ethiopia_fascist_events.55.t: "[ITA.GetName] Menolak Mengirim Peralatan Militer"
 BBA_ethiopia_fascist_events.55.desc: "Dengan jawaban blak-blakan yang tidak perlu, pemerintah [ITA.GetAdjective] menolak permintaan peralatan militer kami. Belum jelas apa alasan dibalik keputusan tersebut. Kita harus mengandalkan industri kita sendiri untuk melanjutkan rencana modernisasi."
 BBA_ethiopia_fascist_events.55.a: "Kami tahu mereka tidak bisa dipercaya."
 BBA_ethiopia_fascist_events.56.t: "[ITA.GetName] Setuju Kirim Peralatan Militer"
 BBA_ethiopia_fascist_events.56.desc: "Pemerintah [ITA.GetAdjective] telah menyetujui permintaan peralatan militer kami. Meskipun jelas bukan peralatan terbaik mereka, hal ini tentu akan mempercepat rencana modernisasi kami."
 BBA_ethiopia_fascist_events.56.a: "Kami tidak pernah meragukan mereka."
 BBA_ethiopia_fascist_events.10.t: "Musuh Ditangkap"
 BBA_ethiopia_fascist_events.10.desc: "Dengan menyerahnya pasukan musuh, beberapa perwira tinggi telah jatuh ke tangan kita. Mereka akan dipenjara untuk saat ini, tapi mudah-mudahan kami bisa meyakinkan beberapa dari mereka untuk bergabung dengan perjuangan kami nanti."
 BBA_ethiopia_fascist_events.10.a: "Bagus"
 captured_ethiopian_commanders_tt: "$ETH_seyoum_mengesha$, $ETH_ayalew_birru$, dan $ETH_ras_kassa$ akan dipenjara"
 captured_ethiopian_commanders_jimma_tt: "$ETH_seyoum_mengesha$, $ETH_ayalew_birru$, $ETH_balcho_safo$, $ETH_tadesse_birru$, dan $ETH_ras_kassa$ akan dipenjarakan"
 BBA_ethiopia_fascist_events.20.t: "[FROM.GetNameDefCap] Menyatakan Kemerdekaan"
 BBA_ethiopia_fascist_events.20.desc: "[FROM.GetLeader] telah menyatakan bahwa [FROM.GetNameDef] tidak akan lagi menerima [ROOT.GetAdjective] kekuasaan. [FROM.GetNameDefCap] ingin menjaga hubungan baik dengan [ROOT.GetNameDef] jika memungkinkan, namun [FROM.GetLeader] menyatakan siap mengangkat senjata dan memperjuangkan kemerdekaannya, jika diperlukan."
 BBA_ethiopia_fascist_events.20.a: "Mereka perlu diberi pelajaran"
 BBA_ethiopia_fascist_events.20.b: "Kami memiliki hal-hal yang lebih penting untuk dipikirkan"
 BBA_ethiopia_fascist_events.21.t: "[ETH.GetAdjective] Kehormatan Dipulihkan"
 BBA_ethiopia_fascist_events.21.desc: "Dalam kejadian yang cukup mengejutkan, [FROM.GetLeader] menerima deklarasi Kemerdekaan [ROOT.GetAdjective]. Sejak saat ini, [FROM.GetNameDef] tidak mempunyai pengaruh terhadap politik [ROOT.GetAdjective], baik internal maupun eksternal. Kerumunan besar yang merayakan kepemimpinan [ROOT.GetLeader] telah berkumpul di alun-alun [ROOT.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_fascist_events.21.a: "Kuknya hilang"
 BBA_ethiopia_fascist_events.22.t: "Perjuangan Dilanjutkan"
 BBA_ethiopia_fascist_events.22.desc: "Seperti yang diharapkan, [FROM.getLeader] menolak permintaan kemerdekaan formal dari [ROOT.GetLeader]. Karena kejadian ini merupakan sebuah antisipasi, angkatan bersenjata [ROOT.GetAdjective] telah mengamankan posisi-posisi penting di negara tersebut. Bangsa ini jauh lebih siap saat ini."
 BBA_ethiopia_fascist_events.22.a: "Kami akan memenangkan kebebasan kami"
 BBA_ethiopia_fascist_events.23.t: "Pejuang Perlawanan"
 BBA_ethiopia_fascist_events.23.desc: "Kelompok pejuang perlawanan yang terorganisir telah bangkit di belakang garis musuh. Para laskar ini berperang bersama kami melawan penindas [ITA.GetAdjective] mereka. Nilai tempurnya mungkin bukan yang tertinggi, namun pasti akan menimbulkan kebingungan dan gangguan pada angkatan bersenjata musuh."
 BBA_ethiopia_fascist_events.23.a: "Bantuan yang sangat kami harapkan"
 BBA_ethiopia_fascist_events.57.t: "[FROM.GetName] Meminta Perjanjian Pengalihdayaan Senjata"
 BBA_ethiopia_fascist_events.57.desc: "[FROM.GetName] telah meminta perjanjian outsourcing senjata dimana perusahaan [ITA.GetAdjective] akan mendirikan pabrik di negara mereka untuk produksi peralatan militer. Pimpinan korporat dari perusahaan-perusahaan terpilih pasti akan berterima kasih atas kesempatan untuk berkembang ini. Namun, jika [FROM.GetName] memberontak, kita akan melawan musuh yang mengetahui banyak kelemahan kita."
 BBA_ethiopia_fascist_events.57.a: "Memperkuat [FROM.GetName] akan membebaskan kekuatan kita di daerah tersebut."
 BBA_ethiopia_fascist_events.57.b: "Kita tidak bisa mengambil risiko rancangan kita jatuh ke tangan musuh."
 BBA_ethiopia_fascist_events.58.t: "[ITA.GetName] Menerima Perjanjian Pengalihdayaan"
 BBA_ethiopia_fascist_events.58.desc: "Terima kasih kepada para diplomat kami, [ITA.GetLeader] telah memberikan izin kepada perusahaan [ITA.GetAdjective] untuk mendirikan pabrik di negara kami. Hal ini akan dengan cepat mempercepat kemampuan kita untuk meneliti dan memproduksi peralatan militer kita sendiri."
 BBA_ethiopia_fascist_events.58.a: "Hari yang menyenangkan untuk [ETH.GetName]"
 BBA_ethiopia_fascist_events.59.t: "[ITA.GetName] Menolak Perjanjian Pengalihdayaan"
 BBA_ethiopia_fascist_events.59.desc: "Para diplomat kita yang tercela telah gagal meyakinkan [ITA.GetLeader] tentang perlunya perjanjian outsourcing senjata kita. Ini merupakan pukulan telak bagi perkembangan militer dan industri kita."
 BBA_ethiopia_fascist_events.59.a: "Sebuah peluang yang terlewatkan."
 BBA_ethiopia_fascist_events.60.t: "Produksi Senjata Outsourcing"
 BBA_ethiopia_fascist_events.60.desc: "Para [ITA.GetAdjective] tidak akan bersedia membagikan semua rahasia industrinya kepada kita karena takut jatuh ke tangan musuh. Oleh karena itu, kita harus memikirkan dengan hati-hati aspek militer kita yang mana yang dapat memperoleh manfaat paling besar dari outsourcing produksi ke desainer [ITA.GetAdjective]."
 BBA_ethiopia_fascist_events.60.a: "Tentara membutuhkan modernisasi di atas segalanya."
 BBA_ethiopia_fascist_events.60.b: "Angkatan udara akan menjadi lebih penting dalam perang di masa depan."
 BBA_ethiopia_fascist_events.61.t: "[FROM.GetName] Meminta Senjata untuk Menggulingkan Aturan [ITA.GetAdjective]"
 BBA_ethiopia_fascist_events.61.desc: "[ETH.GetAdjective] diplomat datang kepada kami dengan permintaan rahasia untuk pasokan senjata. Tampaknya segalanya tidak berjalan baik di wilayah [ITA.GetName] yang baru saja diakuisisi dan pemerintah setempat sedang mencari bantuan asing agar mereka dapat menggulingkan penguasa mereka. Sekalipun pemberontakan tersebut gagal, hal ini pasti akan mengalihkan perhatian dan melemahkan militer [ITA.GetAdjective]. Namun, mungkin ada dampaknya jika diketahui bahwa kami mempunyai andil dalam mendukung pemberontakan."
 BBA_ethiopia_fascist_events.61.a: "Ini akan membuat [ITA.GetAdjective] sibuk."
 BBA_ethiopia_fascist_events.61.b: "Kami tidak akan membantu musuh potensial."
 BBA_ethiopia_fascist_events.62.t: "[FROM.GetName] Menyetujui Permintaan Senjata"
 BBA_ethiopia_fascist_events.62.desc: "Para diplomat [FROM.GetAdjective] telah memberi isyarat bahwa mereka bersedia untuk mulai mengirimkan senjata kepada kami saat kami bersiap untuk menggulingkan pasukan [ITA.GetAdjective]. Tentu saja kami telah diinstruksikan untuk sepenuhnya menyangkal keterlibatan mereka jika pasukan [ITA.GetAdjective] menemukan senjata tersebut."
 BBA_ethiopia_fascist_events.62.a: "Kemenangan sudah di depan mata."
 BBA_ethiopia_fascist_events.63.t: "[FROM.GetName] Menolak Permintaan Senjata"
 BBA_ethiopia_fascist_events.63.desc: "[FROM.GetAdjective] diplomat telah menghindari upaya kami untuk memperoleh pasokan senjata rahasia. Tampaknya mereka tidak yakin seberapa dapat dipercayanya kami saat masih berada di bawah pengaruh [ITA.GetAdjective]. Mereka mungkin juga ragu mengambil risiko membuat marah rezim [ITA.GetAdjective] selama masa-masa penuh gejolak ini."
 BBA_ethiopia_fascist_events.63.a: "Betapa piciknya mereka."
 BBA_ethiopia_fascist_events.64.t: "[FROM.GetName] Meminta Pengendalian [550.GetName]"
 BBA_ethiopia_fascist_events.64.desc: "[ETH.GetLeader] telah meminta kendali atas [550.GetName] sebagai hadiah, atau kompensasi tergantung pada sudut pandangnya, atas kesetiaannya yang berkelanjutan kepada [ITA.GetName]. [ETH.GetLeader] sangat penting dalam memecahkan kebuntuan ketika menginvasi Ethiopia dan ini akan sangat membantu dalam menjaga hubungan baik. Namun, masyarakat [ITA.GetAdjective] mungkin tidak begitu memahami alasan kami memberikan wilayahnya."
 BBA_ethiopia_fascist_events.64.a: "Kami akan menghargai kesetiaan mereka."
 BBA_ethiopia_fascist_events.64.b: "Mereka tidak dalam posisi untuk mengajukan tuntutan."
 BBA_ethiopia_fascist_events.65.t: "[FROM.GetName] Meminta Pengendalian [559.GetName] dan [844.GetName]"
 BBA_ethiopia_fascist_events.65.desc: "[ETH.GetLeader] telah meminta kendali atas [559.GetName] dan [844.GetName] sebagai hadiah, atau kompensasi tergantung pada sudut pandangnya, atas kesetiaannya yang berkelanjutan kepada [ITA.GetName]. [ETH.GetLeader] sangat penting dalam memecahkan kebuntuan ketika menginvasi Ethiopia dan ini akan sangat membantu dalam menjaga hubungan baik. Namun, masyarakat [ITA.GetAdjective] mungkin tidak begitu memahami alasan kami memberikan wilayahnya."
 BBA_ethiopia_fascist_events.65.a: "Kami akan menghargai kesetiaan mereka."
 BBA_ethiopia_fascist_events.65.b: "Mereka tidak dalam posisi untuk mengajukan tuntutan."
 BBA_ethiopia_fascist_events.66.t: "[ITA.GetName] Menyetujui Kompensasi Teritorial"
 BBA_ethiopia_fascist_events.66.desc: "[ITA.GetName] telah dengan baik hati menerima permintaan kami untuk menguasai wilayah yang diminta. Ini menandai dimulainya babak baru dalam hubungan Italia-[ETH.GetAdjective]."
 BBA_ethiopia_fascist_events.66.a: "Masa depan adalah milik rakyat [ETH.GetAdjective]."
 BBA_ethiopia_fascist_events.67.t: "[ITA.GetName] Menolak Kompensasi Teritorial"
 BBA_ethiopia_fascist_events.67.desc: "[ITA.GetAdjective] diplomat menanggapi dengan marah atas permintaan kami untuk kompensasi teritorial. Mereka berpendapat bahwa tidak enak bagi masyarakat [ITA.GetAdjective] untuk menyerahkan wilayahnya kepada siapa pun yang sudah dibayar dengan darahnya, apalagi menyerahkannya kepada mantan musuhnya."
 BBA_ethiopia_fascist_events.67.a: "Mereka sedang menguji kesetiaan kita..."
 BBA_ethiopia_fascist_events.68.t: "[ITA.GetAdjective] Depo Digerebek"
 BBA_ethiopia_fascist_events.68.desc: "Tadi malam, gudang senjata [ITA.GetAdjective] berhasil digerebek dan senjatanya dilucuti. Pihak berwenang Italia dengan marah menuduh pemerintah kami mendalangi insiden tersebut meskipun hanya memiliki sedikit bukti. Meskipun mereka mungkin curiga terhadap tentara kita yang mengacungkan senapan [ITA.GetAdjective] baru yang mengilap..."
 BBA_ethiopia_fascist_events.68.a: "Tuduhan yang sangat keterlaluan."
 BBA_ethiopia_fascist_events.69.t: "[FROM.GetName] Meminta Penasihat Militer"
 BBA_ethiopia_fascist_events.69.desc: "Pimpinan [ETH.GetName] telah mengakui kelemahan militer mereka dan oleh karena itu meminta dukungan kami. Mereka penasaran apakah kami akan mengizinkan beberapa perwira kami untuk bergabung dengan staf umum mereka dan memberi saran kepada mereka tentang cara terbaik menggunakan alat perang modern."
 BBA_ethiopia_fascist_events.69.a: "[FROM.GetName] yang lebih kuat akan memungkinkan kita untuk fokus pada wilayah yang lebih dekat dengan wilayah kita."
 BBA_ethiopia_fascist_events.69.b: "Petugas kami dibutuhkan di tempat lain."
 ETH_send_ita_generals_tt: "§Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! dan §Y$ITA_alessandro_pirzio_biroli$§! akan ditransfer ke Etiopia."
 BBA_ethiopia_fascist_events.70.t: "[FROM.GetName] Setuju Kirim Petugas"
 BBA_ethiopia_fascist_events.70.desc: "[FROM.GetName] telah setuju untuk mengizinkan beberapa perwira militer mereka bergabung dengan staf umum kami di masa mendatang. Mudah-mudahan kita akan belajar cara terbaik memanfaatkan peralatan baru kita di medan perang modern."
 BBA_ethiopia_fascist_events.70.a: "Luar biasa."
 BBA_ethiopia_fascist_events.71.t: "[FROM.GetName] Menolak Kirim Petugas"
 BBA_ethiopia_fascist_events.71.desc: "[FROM.GetName] telah menolak mengizinkan perwira militer mereka untuk bergabung dengan staf umum kami. Kami telah diberitahu bahwa mereka dibutuhkan di tempat lain saat ini. Namun, kami telah mengirimkan kiriman tambahan perlengkapan infanteri sebagai tanda dukungan."
 BBA_ethiopia_fascist_events.71.a: "Ini lebih baik daripada tidak sama sekali."
#Communist Ethiopia
 BBA_ethiopia_communist_events.01.t: "[ETH.GetAdjective] Komunis Meminta Bantuan"
 BBA_ethiopia_communist_events.01.desc: "Kepemimpinan komunis [ETH.GetName] telah menghubungi kami untuk meminta bantuan dalam perjuangan mereka melawan fasis Italia. Rezim baru di [ETH.Capital.GetCapitalVictoryPointName] masih mengkonsolidasikan kekuasaan dan mungkin terbuka untuk menyelaraskan diri dengan ambisi kebijakan luar negeri kita jika kita menawarkan dukungan kita kepada mereka. Namun, kita berisiko meningkatkan perang dan kita pasti akan membuat marah [ITA.GetName] dalam prosesnya."
 BBA_ethiopia_communist_events.01.a: "Kami akan mendukung rekan komunis kami dalam perjuangan mereka."
 BBA_ethiopia_communist_events.01.b: "Kami tidak tertarik dengan keterikatan kolonial di Afrika."
 BBA_ethiopia_communist_events.02.t: "[SOV.GetName] Menolak Permintaan Bantuan"
 BBA_ethiopia_communist_events.02.desc: "Meskipun kami sangat membutuhkan bantuan, [SOV.GetNameDef] telah mengabaikan kami. Meskipun ini merupakan sebuah kemunduran, kami akan terus melawan kekuatan fasisme. Kita sekarang harus mengalihkan perhatian kita untuk mendapatkan dukungan dari jaringan anti-fasis yang lebih luas di seluruh dunia."
 BBA_ethiopia_communist_events.02.a: "Begitu banyak untuk solidaritas kelas."
 BBA_ethiopia_communist_events.03.t: "[SOV.GetName] Mengirim Bantuan ke [ETH.GetName]"
 BBA_ethiopia_communist_events.03.desc: "Dalam beberapa hari terakhir terdapat laporan yang meresahkan tentang pasukan [ETH.GetAdjective] yang berbicara bahasa Rusia dan menggunakan persenjataan [SOV.GetAdjective]. Kita hanya dapat berasumsi bahwa [SOV.GetName] mengirimkan 'sukarelawan' untuk memperjuangkan [ETH.GetLeader] dengan harapan mendapatkan pengaruh di Afrika dan melemahkan dukungan terhadap pemerintahan [ITA.GetLeader] di [ITA.GetName]."
 BBA_ethiopia_communist_events.03.a: "Mereka akan menderita akibat tindakan agresi ini."
 BBA_ethiopia_communist_events.04.t: "[SOV.GetName] Setuju untuk Membantu Kami"
 BBA_ethiopia_communist_events.04.desc: "[SOV.GetName] telah setuju untuk mengirimkan bantuan material kepada kami dalam beberapa bulan mendatang serta mengizinkan 'sukarelawan' dari militer [SOV.GetAdjective] untuk berperang bersama kami dalam perjuangan melawan [ITA.GetName]. Hal ini tentu saja akan menguntungkan kita, namun, tidak jelas bagaimana reaksi [ITA.GetAdjective] terhadap pasukan [SOV.GetAdjective] yang berperang melawan mereka."
 BBA_ethiopia_communist_events.04.a: "Bersama-sama, kita akan mengalahkan fasisme di Afrika."
 BBA_ethiopia_communist_events.05.t: "Kudeta Melawan [ROOT.GetLeader]"
 BBA_ethiopia_communist_events.05.desc: "Saat ini, anggota militer dan organisasi anti-fasis yang dikenal sebagai Black Lions mengatur kudeta terhadap pemerintah [ROOT.GetLeader]. Kaisar dijadwalkan untuk memeriksa pasukan ketika sekelompok tentara yang tidak puas menyerang dia dan perwira mereka, dan menahan mereka.\n\nSementara itu di [ROOT.Capital.GetCapitalVictoryPointName], Singa Hitam merebut infrastruktur utama kota, termasuk kediaman kaisar. Banyak loyalis militer dan polisi yang tewas dalam bentrokan kecil, namun sisa [ETH.GetName] kini berada di bawah kendali pemerintahan sementara. Mayoritas rakyat, yang kelelahan akibat perang dengan [ITA.GetName], menerima begitu saja wewenang pemerintahan baru mereka. Sekarang, keputusan pertama pemerintahan baru adalah menentukan nasib [ROOT.GetLeader]."
 BBA_ethiopia_communist_events.05.a: "Kita tidak bisa mengambil risiko kehilangan dukungan rakyat. Mengasingkan dia."
 BBA_ethiopia_communist_events.05.b: "Semua musuh rakyat harus mempertanggungjawabkan kejahatannya. Kunci dia."
 BBA_ethiopia_communist_events.06.t: "Pemerintahan Sementara Dibubarkan"
 BBA_ethiopia_communist_events.06.desc: "Perwira militer yang didukung oleh [SOV.GetName] telah membubarkan pemerintahan sementara [ETH.GetAdjective]. Para petugas menyatakan bahwa mereka diberikan bukti oleh badan intelijen [SOV.GetAdjective] yang membuktikan bahwa pemerintah, yang dipimpin oleh [ROOT.GetLeader], telah mengkhianati rakyat. Berdasarkan bukti, anggota pemerintah sedang berdiskusi untuk mengizinkan pasukan [ITA.GetAdjective] menduduki negara sepenuhnya dengan imbalan kekayaan pribadi dalam jumlah besar. Setelah baku tembak dengan Black Lions, mantan anggota pemerintahan sementara diyakini tewas atau ditahan.\n\nMiliter kini telah mengambil alih kepemimpinan negara untuk memulihkan ketertiban dan membasmi para konspirator [ROOT.GetLeader]. Masih belum jelas seberapa permanen dewan administratif militer yang baru dibentuk tersebut."
 BBA_ethiopia_communist_events.06.indy_desc: "Perwira militer telah membubarkan pemerintahan sementara [ETH.GetAdjective]. Para petugas menyatakan bahwa mereka diberikan bukti oleh badan intelijen yang membuktikan bahwa pemerintah, yang dipimpin oleh [ROOT.GetLeader], telah mengkhianati rakyat. Berdasarkan bukti, anggota pemerintah sedang berdiskusi untuk mengizinkan pasukan [ITA.GetAdjective] menduduki negara sepenuhnya dengan imbalan kekayaan pribadi dalam jumlah besar. Setelah baku tembak dengan Black Lions, mantan anggota pemerintahan sementara diyakini tewas atau ditahan.\n\nMiliter kini telah mengambil alih kepemimpinan negara untuk memulihkan ketertiban dan membasmi para konspirator [ROOT.GetLeader]."
 BBA_ethiopia_communist_events.06.a: "Para pengkhianat mendapatkan apa yang pantas mereka dapatkan."
 BBA_ethiopia_communist_events.07.t: "[SOV.GetNameDefCap] Menuntut Diakhirinya Perang dengan [ETH.GetName]"
 BBA_ethiopia_communist_events.07.desc: "[SOV.GetNameDefCap] telah menuntut diakhirinya permusuhan antara kami dan [ETH.GetAdjective]. [SOV.GetAdjective] banyak terlibat dalam mendukung rezim komunis di [ETH.Capital.GetCapitalVictoryPointName] dan sekarang melihatnya sebagai bagian dari pengaruh mereka. Uni Soviet mengancam akan mengambil tindakan lebih jauh dengan terlibat dalam konflik tersebut secara militer.  Kita berisiko dipermalukan di dalam negeri jika kita menyetujui tuntutan Soviet. Namun, kita berisiko menimbulkan konflik yang lebih luas jika kita menolaknya."
 BBA_ethiopia_communist_events.07.a: "Kami tidak akan bernegosiasi dengan komunis."
 BBA_ethiopia_communist_events.07.b: "Kita tidak bisa mengambil risiko konflik yang lebih luas saat ini."
 BBA_ethiopia_communist_events.08.t: "[ETH.GetName] Permintaan Peralatan Infanteri"
 BBA_ethiopia_communist_events.08.desc: "[ETH.GetName] telah meminta peralatan infanteri untuk membantu konflik mereka dengan Italia. Tanpa masuknya peralatan dasar, kecil kemungkinan militer [ETH.GetAdjective] akan mampu mempersenjatai pasukannya secara memadai. Namun, jika kita memilih untuk memasok mereka dengan peralatan kita, hal ini pasti akan semakin merusak hubungan kita dengan [ITA.GetName]."
 BBA_ethiopia_communist_events.08.a: "Kami tidak dapat menyisihkan peralatan apa pun."
 BBA_ethiopia_communist_events.08.b: "Tentu saja kami akan membantu mereka."
 BBA_ethiopia_communist_events.09.t: "[SOV.GetNameDefCap] Mengirim Peralatan Infanteri"
 BBA_ethiopia_communist_events.09.desc: "[SOV.GetName] telah mengirimi kami peralatan infanteri yang diminta untuk membantu perjuangan kami melawan [ITA.GetName]. Hal ini tentu akan membantu kita meraih kemenangan melawan fasis."
 BBA_ethiopia_communist_events.09.a: "Perang kembali menguntungkan kita."
 BBA_ethiopia_communist_events.10.t: "[SOV.GetNameDefCap] Menolak Mengirim Peralatan"
 BBA_ethiopia_communist_events.10.desc: "[SOV.GetName] telah menolak mengirimkan peralatan infanteri kepada kami. Meskipun delegasi kami telah berupaya sebaik-baiknya untuk [SOV.capital.GetCapitalVictoryPointName], tampaknya mereka terlalu sibuk dengan masalah mereka sendiri sehingga tidak menyisihkan apa pun untuk kami."
 BBA_ethiopia_communist_events.10.a: "Mereka telah mengkhianati kita."
 BBA_ethiopia_communist_events.11.t: "[ETH.GetName] Meminta Penasihat Militer"
 BBA_ethiopia_communist_events.11.desc: "Kepemimpinan baru [ETH.GetNameDefCap] telah mengakui kelemahan militer mereka dalam menghadapi peperangan modern. Oleh karena itu mereka meminta dukungan kami dalam mengatur kembali militer mereka. Ini akan menjadi kesempatan besar untuk memberikan petugas kami pengalaman di lingkungan yang berbeda, namun juga merupakan kesempatan bagi kami untuk mempengaruhi keseimbangan kekuatan internal dalam [ETH.GetName]."
 BBA_ethiopia_communist_events.11.a: "Ini adalah kesempatan yang tidak boleh kita lewatkan."
 BBA_ethiopia_communist_events.11.b: "Kita tidak bisa mengambil risiko kekuatan asing mengetahui taktik kita."
 BBA_ethiopia_communist_events.12.t: "[SOV.GetAdjective] Peralatan Tiba"
 BBA_ethiopia_communist_events.12.desc: "Peralatan yang dijanjikan oleh [SOV.GetName] telah tiba di depot militer kita dan sekarang didistribusikan ke pasukan kita."
 BBA_ethiopia_communist_events.12.a: "Luar biasa!"
 BBA_ethiopia_communist_events.14.t: "[ETH.GetNameDefCap] Meminta Bantuan Pembuatan Angkatan Udara"
 BBA_ethiopia_communist_events.14.desc: "[ETH.GetNameDefCap] telah meminta dukungan kami dalam pengembangan angkatan udara mereka sendiri. Usulan mereka termasuk mengirimkan sukarelawan untuk berlatih bersama pilot kami di pesawat yang lebih tua dan berlebih. Ini akan menjadi kesempatan luar biasa bagi pilot kami untuk mendapatkan lebih banyak pengalaman dan menguji peralatan kami melawan [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.14.a: "Sebuah usulan yang bagus."
 BBA_ethiopia_communist_events.14.b: "Kita perlu menjaga persediaan pesawat kita."
 BBA_ethiopia_communist_events.15.t: "[SOV.GetNameDefCap] Mengirim Penasihat Militer"
 BBA_ethiopia_communist_events.15.desc: "Jenderal dari [SOV.GetNameDef] tiba di [ROOT.Capital.GetCapitalVictoryPointName] hari ini. Para penasihat diberikan gambaran umum tentang struktur angkatan bersenjata kita saat ini dan keadaan perang saat ini dengan [ITA.GetName]. Mudah-mudahan mereka mampu membantu memodernisasi kekuatan kita."
 BBA_ethiopia_communist_events.15.a: "Hal ini sudah lama tertunda."
 BBA_ethiopia_communist_events_15_tt: "§Y$SOV_semyon_budyonny$§! dan §Y$SOV_vasily_kuznetsov$§! akan menjadi jenderal yang tersedia."
 BBA_ethiopia_communist_events.16.t: "[SOV.GetNameDefCap] Menolak Mengirim Penasihat Militer"
 BBA_ethiopia_communist_events.16.desc: "Teman-teman kami di [SOV.Capital.GetCapitalVictoryPointName] telah menolak mengirimkan penasihat militer untuk membantu kami dalam upaya modernisasi militer. Meskipun mengalami kemunduran, kita akan mengalahkan kaum fasis dan melanjutkan modernisasi kita sendiri."
 BBA_ethiopia_communist_events.16.a: "[SOV.GetAdjective] tidak dapat diandalkan."
 BBA_ethiopia_communist_events.17.t: "[ETH.GetNameDefCap] Meminta Dukungan Terhadap [ITA.GetAdjective] Armor"
 BBA_ethiopia_communist_events.17.desc: "Delegasi dari [ETH.GetNameDef] telah mendesak para menteri dan militer kita untuk mengirimkan kelebihan kendaraan lapis baja untuk membantu mereka dalam perang melawan [ITA.GetName]. [ETH.GetAdjective] jelas berada pada posisi yang kurang menguntungkan ketika menggunakan armor [ITA.GetAdjective]. Jika kami mengirimkan peralatan kami, hal ini tentu akan membantu mereka memukul mundur [ITA.GetAdjective], namun hal ini juga akan meningkatkan ketegangan antara [SOV.GetNameDef] dan [ITA.GetName]."
 BBA_ethiopia_communist_events.17.a: "Kesempatan bagus untuk menguji peralatan kami."
 BBA_ethiopia_communist_events.17.b: "Kami tidak akan mengambil risiko eskalasi lebih lanjut."
 BBA_ethiopia_communist_events.18.t: "[SOV.GetNameDefCap] Menolak Mengirim Kendaraan Lapis Baja"
 BBA_ethiopia_communist_events.18.desc: "[SOV.GetNameDefCap] telah menolak mengirimkan kendaraan lapis baja kepada kami untuk melawan [ITA.GetAdjective]. Tampaknya kelompok [SOV.GetAdjective] khawatir akan meningkatnya ketegangan antara mereka dan [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.18.a: "Kita harus mencari cara lain."
 BBA_ethiopia_communist_events.19.t: "[SOV.GetNameDefCap] Mengirim Kendaraan Lapis Baja"
 BBA_ethiopia_communist_events.19.desc: "[SOV.GetNameDefCap] telah mengirimi kami kendaraan lapis baja untuk membantu perjuangan kami melawan [ITA.GetAdjective]. Meski bukan desain terbarunya, kendaraan tersebut pasti akan terbukti berharga di lini depan, meski hanya untuk mendongkrak semangat."
 BBA_ethiopia_communist_events.19.a: "Luar biasa!"
 BBA_ethiopia_communist_events.20.t: "[SOV.GetNameDefCap] Menolak Melatih Pilot"
 BBA_ethiopia_communist_events.20.desc: "[SOV.GetNameDefCap] telah menolak proposal untuk melatih pilot kami. Hal ini diharapkan dapat mempercepat perluasan angkatan udara kita, namun tampaknya Soviet memiliki prioritas lain saat ini. Namun, kami telah diberikan desain untuk membuat pesawat kami sendiri."
 BBA_ethiopia_communist_events.20.a: "Pasti kita bisa mengetahuinya."
 BBA_ethiopia_communist_events.21.t: "[SOV.GetNameDefCap] Setuju untuk Melatih Pilot"
 BBA_ethiopia_communist_events.21.desc: "Rekan-rekan kami di [SOV.GetName] telah setuju untuk membantu kami dalam pelatihan pilot. Mereka juga dengan murah hati menyediakan sejumlah pesawat untuk kami gunakan. Hal ini akan dengan cepat mempercepat rencana kami untuk menciptakan angkatan udara yang mampu melawan [ITA.GetAdjective]."
 BBA_ethiopia_communist_events.21.a: "Kami berterima kasih kepada rekan-rekan [SOV.GetAdjective] kami!"
 BBA_ethiopia_communist_events.22.t: "[ITA.GetNameDefCap] Menolak Mengakhiri Perang Dengan [ETH.GetNameDefCap]"
 BBA_ethiopia_communist_events.22.desc: "[ITA.GetAdjective] sejauh ini mengabaikan tuntutan kami untuk mengakhiri perang mereka melawan [ETH.GetName]. Menjadi jelas bahwa satu-satunya bahasa yang mereka pahami adalah kekerasan. Jika kita melanjutkan jalur yang ada saat ini, perang antara [SOV.GetName] dan [ITA.GetName] tidak akan terhindarkan. Jika kita mundur sekarang, pada akhirnya kita akan kehilangan semua yang kita peroleh dalam mendukung [ETH.GetName] dan pengaruh diplomasi kita di panggung dunia akan sangat berkurang."
 BBA_ethiopia_communist_events.22.a: "Mereka akan menyesali hal ini."
 BBA_ethiopia_communist_events.22.b: "Kami belum siap berperang."
 BBA_ethiopia_communist_events.23.t: "[SOV.GetNameDefCap] Mundur"
 BBA_ethiopia_communist_events.23.desc: "Uni Soviet telah membatalkan retorika perang mereka baru-baru ini dan kembali menyatakan keberatan keras terhadap tindakan kami di Ethiopia. Tampaknya ancaman mereka untuk berperang hanyalah sebuah gertakan."
 BBA_ethiopia_communist_events.23.a: "Kemenangan untuk [ITA.GetName]!"
 BBA_ethiopia_communist_events.24.t: "[SOV.GetNameDefCap] Mengambil Kendali Kebijakan Luar Negeri"
 BBA_ethiopia_communist_events.24.desc: "Konfrontasi diplomatik antara [ITA.GetName] dan [SOV.GetNameDef] kini telah berkembang menjadi konflik terbuka. [SOV.GetAdjective] telah menjamin kemerdekaan kami dan sekarang akan membantu kami di medan perang untuk mengusir [ITA.GetAdjective]. Namun tampaknya hal ini akan mengorbankan kemerdekaan kita. Mulai sekarang, kita perlu memastikan bahwa kebijakan luar negeri kita sepenuhnya selaras dengan kebijakan [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.24.a: "Itu perlu. Untuk saat ini."
 BBA_ethiopia_communist_events.25.t: "[ETH.GetNameDefCap] Minta Mediasi"
 BBA_ethiopia_communist_events.25.desc: "[ETH.GetNameDefCap] telah menghubungi kami dengan harapan kami dapat menjadi perantara antara mereka dan [ITA.GetAdjective]. [ITA.GetAdjective] tidak terpengaruh oleh keberatan keras dari Liga Bangsa-Bangsa, oleh karena itu setiap mediasi dari kami kemungkinan besar memerlukan ancaman kekerasan. Kita harus memikirkan matang-matang seberapa besar kita bersedia mengambil risiko demi [ETH.GetNameDef]."
 BBA_ethiopia_communist_events.25.a: "Kami akan membantu mereka mengakhiri perang ini."
 BBA_ethiopia_communist_events.25.b: "Kami akan membantu mereka. Untuk harga tertentu."
 BBA_ethiopia_communist_events.25.c: "Ini terlalu berisiko."
 BBA_ethiopia_communist_events.26.t: "[SOV.GetNameDefCap] Menolak Memediasi Konflik"
 BBA_ethiopia_communist_events.26.desc: "[SOV.GetNameDefCap] telah mengesampingkan kemungkinan mediasi antara kami dan [ITA.GetAdjective]. Mereka menyebutkan keengganan [ITA.GetName] untuk mendengarkan Liga Bangsa-Bangsa dan oleh karena itu mereka harus mengancam akan menggunakan kekerasan. Risiko eskalasi perang antara kedua negara dianggap terlalu berbahaya oleh [SOV.GetLeader]."
 BBA_ethiopia_communist_events.26.a: "Mereka menggunakan kita untuk mengeluarkan darah [ITA.GetAdjective]"
 BBA_ethiopia_communist_events.27.t: "[SOV.GetNameDefCap] Gagal Menghentikan [ITA.GetAdjective] Agresi"
 BBA_ethiopia_communist_events.27.desc: "[SOV.GetNameDefCap] telah membatalkan komitmennya untuk mengakhiri perang agresi [ITA.GetName]. Nampaknya kesediaan mereka untuk berperang hanyalah sebuah gertakan belaka. Kini kita menghadapi tugas sulit untuk mengakhiri perang ini sendirian."
 BBA_ethiopia_communist_events.27.a: "Mereka telah mengkhianati kita."
 BBA_ethiopia_communist_events.28.t: "[SOV.GetNameDefCap] Menuntut Penyelarasan Kebijakan Luar Negeri"
 BBA_ethiopia_communist_events.28.desc: "Konfrontasi diplomatik antara [ITA.GetName] dan [SOV.GetNameDef] kini telah mereda dengan [ITA.GetAdjective] setuju untuk mengakhiri perang mereka melawan kami. [SOV.GetAdjective] telah menjamin kemerdekaan kami dan menegaskan bahwa mereka menganggap serangan terhadap kami sebagai serangan terhadap mereka. Namun, tampaknya harga atas bantuan mereka dalam mengakhiri perang ini adalah kemerdekaan kita. Mulai sekarang, kita perlu memastikan bahwa kebijakan luar negeri kita sepenuhnya selaras dengan kebijakan [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.28.a: "Kita harus mengizinkannya. Untuk saat ini."
 BBA_ethiopia_communist_events.29.t: "[SOV.GetNameDefCap] Berhasil Memediasi Konflik"
 BBA_ethiopia_communist_events.29.desc: "Konfrontasi diplomatik antara [ITA.GetName] dan [SOV.GetNameDef] kini telah mereda dengan [ITA.GetAdjective] setuju untuk mengakhiri perang mereka melawan kami. Ini adalah kemenangan besar melawan fasisme, namun sepertinya ini bukan akhir dari perjuangan. Semoga kita bisa terus menjalin kerjasama dengan teman-teman di [SOV.Capital.GetCapitalVictoryPointName]."
 BBA_ethiopia_communist_events.29.a: "Kami berterima kasih selamanya."
 bba_news.1.t: "[SOV.GetName] Menuntut Diakhirinya Perang Italia-Ethiopia"
 bba_news.1.desc: "Ancaman pecahnya perang besar telah mengagetkan para pemimpin di seluruh dunia saat ini. Pemimpin Soviet [SOV.GetLeader] telah menuntut agar [ITA.GetLeader] mengakhiri perang ilegal [ITA.GetName] melawan [ETH.GetNameDef]. [SOV.GetLeader] telah menegaskan bahwa jika [ITA.GetName] tidak memenuhi tuntutan ini, [SOV.GetLeader.GetSheHe] akan bersedia menggunakan kekerasan untuk memaksa mereka melakukan hal tersebut. Dalam beberapa bulan terakhir, [SOV.GetAdjective] sangat antusias membantu [ETH.GetNameDef] dengan peralatan dan nasihat. Semakin jelas bahwa mereka kini menganggap negara tersebut sebagai bagian dari wilayah pengaruh mereka."
 bba_news.1.a: "Tentunya mereka menggertak?"
 bba_news.2.t: "[ITA.GetName] Menyetujui Kesepakatan Damai dengan [ETH.GetNameDefCap]"
 bba_news.2.desc: "Dalam peristiwa yang luar biasa, [ITA.GetName] telah menyetujui gencatan senjata dengan [ETH.GetName]. Pasukan [ITA.GetAdjective] juga mulai mundur ke perbatasan aslinya dengan [ETH.GetNameDef], menyerahkan segala wilayah yang telah mereka capai. Kesediaan [SOV.GetNameDefCap] untuk berperang demi Etiopia tidak diragukan lagi berperan dalam keputusan [ITA.GetLeader] untuk mundur. Masih harus dilihat bagaimana reaksi masyarakat [ITA.GetAdjective] terhadap penghinaan ini."
 bba_news.2.a: "Akankah [ITA.GetLeader] selamat dari ini?"
 bba_news.3.t: "Perjanjian Gencatan Senjata Italia-[ETH.GetAdjective]"
 bba_news.3.desc: "Dengan perang di [ETH.GetName] yang berubah menjadi perang gesekan, [ITA.GetAdjective] terpaksa melakukan negosiasi gencatan senjata. Sebagian besar memperkirakan militer [ETH.GetAdjective] akan bubar begitu saja setelah pemberontakan komunis baru-baru ini di negara tersebut, namun [ETH.GetLeader] telah berhasil membalikkan keadaan perang, menyelamatkan sebagian besar negara dari pendudukan [ITA.GetAdjective]. Namun, karena sebagian besar wilayah Afrika Timur masih berada di bawah kekuasaan [ITA.GetAdjective], tidak jelas apakah perdamaian yang tidak menentu ini akan bertahan lama."
 bba_news.3.a: "Ini tidak akan bertahan lama."
 bba_news.4.t: "Kudeta Komunis di Ethiopia"
 bba_news.4.desc: "Anggota militer dan organisasi anti-fasis yang dikenal sebagai Black Lions telah mengatur kudeta terhadap pemerintahan kekaisaran $ETH_haile_selassie$. Kaisar dijadwalkan untuk memeriksa pasukan ketika dia disergap oleh mereka dan ditahan.\n\nSementara itu di [ROOT.Capital.GetCapitalVictoryPointName], Singa Hitam merebut infrastruktur utama kota, termasuk kediaman kaisar. Banyak loyalis militer dan polisi yang tewas dalam bentrokan kecil, namun negara yang tersisa kini berada di bawah kendali pemerintahan sementara yang berhaluan komunis.\n\nMayoritas rakyat, yang kelelahan akibat perang dengan [ITA.GetName], menerima begitu saja kewenangan pemerintahan baru mereka."
 bba_news.4.a: "Revolusi sedang menyebar!"
 bba_news.4.b: "Ancaman komunis sedang terjadi."
 bba_news.5.t: "Kekaisaran Sulaiman Didirikan"
 bba_news.5.desc_owns_454: "[ETH.GetLeader] telah menyatakan bahwa karena garis keturunan bangsawannya, yang diperkirakan berasal dari Raja Salomo dalam Alkitab, dia adalah penguasa sah [454.GetName]. Dia kemudian mendeklarasikan kelahiran kembali Etiopia sebagai Kekaisaran Sulaiman. Setelah merebut kendali [454.GetName] dari negara-negara besar, [ETH.GetLeader] bermaksud memindahkan ibu kota kerajaannya ke wilayah tersebut. Masih harus dilihat apakah akan ada dampak geopolitik terhadap restrukturisasi Solomon di Ethiopia."
 bba_news.5.desc_does_not_own_454: "[ETH.GetLeader] telah menyatakan bahwa karena garis keturunan bangsawannya, yang diperkirakan berasal dari Raja Salomo dalam Alkitab, dia adalah penguasa sah [454.GetName]. Kekhawatiran akan kembalinya wilayah teritorial tidak diragukan lagi akan memicu ketakutan di ibu kota wilayah tersebut, namun masih harus dilihat apakah akan ada dampak geopolitik terhadap restrukturisasi Solomon di Ethiopia."
 bba_news.5.a: "Kemuliaan bagi pewaris sejati Salomo!"
 bba_news.5.b: "Ini adalah kegilaan."
 bba_news.6.t: "Kekaisaran Sion Didirikan"
 bba_news.6.desc: "Dalam kejadian yang benar-benar aneh, Kaisar Ethiopia, [ETH.GetLeader] telah menganut gerakan keagamaan pinggiran di Karibia yang dikenal sebagai ‘Rastafarianisme.’ Jelas tidak puas hanya dengan menjadi seorang kaisar, [ETH.GetLeader] kini dipuja oleh kaum Rastafarian sebagai perwujudan literal tuhan atau lebih khusus lagi ‘Jah.’ Ethiopia sendiri telah direorganisasi menjadi ‘Kekaisaran Zion.’ Masih harus dilihat apakah pergolakan agama ini terjadi. akan menyebabkan perubahan kebijakan luar negeri Ethiopia atau ketidakstabilan geopolitik."
 bba_news.6.a: "Kemuliaan bagi Jah!"
 bba_news.6.b: "Ini adalah kegilaan."
 bba_news.7.t: "[ITA.GetName] Pindah ke Lampiran [AFA.GetNameDef]"
 bba_news.7.desc: "Rumor beredar bahwa aneksasi [AFA.GetNameDef] oleh pasukan [ITA.GetAdjective] mungkin akan segera terjadi. Pasukan [ITA.GetAdjective] terlihat berkumpul di perbatasan negara yang terisolasi dan sumber menunjukkan bahwa tekanan dilakukan secara diplomatis di [AFA.Capital.GetCapitalVictoryPointName] untuk memaksakan penyerahan diri tanpa pertumpahan darah. Masih harus dilihat apakah [AFA.GetLeader] dapat menahan tekanan [ITA.GetAdjective], namun situasinya tampaknya tidak menjanjikan."
 bba_news.7.a: "Mengerikan sekali."
 bba_news.7.b: "Kita harus bersiap menghadapi hal yang tak terhindarkan."
 bba_news.7.c: "Hal ini tidak bisa dihindari."
 bba_news.8.t: "[AFA.GetName] Mengajukan Permintaan [ITA.GetAdjective]"
 bba_news.8.desc: "Mungkin tidak mengherankan bagi banyak orang, [AFA.GetNameDef] telah menerima tuntutan [ITA.GetAdjective] untuk penaklukan. Meskipun pemerintah [AFA.GetAdjective] mempunyai harapan untuk menghindari pendudukan, menjadi semakin jelas bahwa kekuatan kolonial di wilayah tersebut tidak akan memberikan bantuan, dan negara tetangga [ETH.GetName] juga tidak akan mampu menyediakan personel militer untuk mendukung mereka. Dengan situasi yang begitu suram, pemerintah tunduk pada tekanan [ITA.GetAdjective] agar masyarakat tidak menjadi korban pertumpahan darah yang tidak perlu. Pasukan\n\n[ITA.GetAdjective] sekarang bergerak ke negara kecil untuk mengambil posisi baru di perbatasan dengan [ETH.GetNameDef]. Tidak jelas apakah pendudukan ini akan bersifat permanen, atau bagaimana dampaknya terhadap konflik [ITA.GetAdjective] yang lebih luas dengan [ETH.GetName]."
 bba_news.8.a: "Sayangnya, tidak mengherankan."
 bba_news.8.b: "Ini akan semakin memperluas kekuatan kita."
 bba_news.8.c: "Mereka memilih dengan bijak."
 BBA_ethiopia_communist_events.30.t: "[ETH.GetNameDefCap] Meminta Gencatan Senjata"
 BBA_ethiopia_communist_events.30.desc: "Perwakilan dari [ETH.GetNameDefCap] telah meminta gencatan senjata dalam konflik kami saat ini dengan mereka. Perang belum berakhir secepat yang kita harapkan dan hal ini akan memberi kita kesempatan untuk memperkuat posisi kita di kawasan atau menangani masalah-masalah mendesak lainnya."
 BBA_ethiopia_communist_events.30.a: "Kami akan menghentikan pertempuran. Untuk saat ini."
 BBA_ethiopia_communist_events.30.b: "Kemenangan ada dalam genggaman kami, kami tidak akan berhenti sekarang."
 BBA_ethiopia_communist_events.31.t: "[ITA.GetNameDefCap] Setuju Gencatan Senjata"
 BBA_ethiopia_communist_events.31.desc: "[ITA.GetAdjective] telah menyetujui gencatan senjata dalam konflik kita saat ini. Mudah-mudahan ini akan memberikan kita kesempatan untuk membangun perdamaian abadi antara bangsa kita. Namun, kita harus tetap waspada karena konflik bisa kembali terjadi kapan saja."
 BBA_ethiopia_communist_events.31.a: "Akhirnya, berakhirnya pertumpahan darah."
 BBA_ethiopia_communist_events.32.t: "[ITA.GetNameDefCap] Menolak Tawaran Gencatan Senjata"
 BBA_ethiopia_communist_events.32.desc: "[ITA.GetAdjective] menolak ikut serta dalam gencatan senjata. Tampaknya mereka berniat menghancurkan [ETH.GetNameDefCap] sepenuhnya. Rakyat sekarang akan tahu bahwa kaum fasis tidak dapat diajak bernalar dan bahwa kebebasan kita bergantung pada upaya setiap orang untuk menggandakannya."
 BBA_ethiopia_communist_events.32.a: "Kami akan terus membuat mereka menderita."
 BBA_ethiopia_communist_events.33.t: "Kemerdekaan Eritrea"
 BBA_ethiopia_communist_events.33.desc: "Selama konflik kami dengan [ITA.GetAdjective], kami berhasil membebaskan Eritrea dari kaum fasis. Kami sekarang memiliki kesempatan untuk memberikan kemerdekaan kepada masyarakat di wilayah tersebut. Namun, [ITA.GetAdjective] pasti akan frustrasi dengan tindakan ini dan hal ini dapat mengganggu stabilitas perdamaian kita yang rapuh dengan mereka."
 BBA_ethiopia_communist_events.33.a: "Kebebasan untuk semua!"
 BBA_ethiopia_communist_events.33.b: "Ini terlalu berisiko."
 BBA_ethiopia_communist_events.34.t: "Kemerdekaan Somalia"
 BBA_ethiopia_communist_events.34.desc: "Selama konflik kami dengan [ITA.GetAdjective] kami berhasil membebaskan Somalia dari kaum fasis. Kami sekarang memiliki kesempatan untuk memberikan kemerdekaan kepada masyarakat di wilayah tersebut. Namun, [ITA.GetAdjective] pasti akan frustrasi dengan tindakan ini dan hal ini dapat mengganggu stabilitas perdamaian kita yang rapuh dengan mereka."
 BBA_ethiopia_communist_events.34.a: "Kebebasan untuk semua!"
 BBA_ethiopia_communist_events.34.b: "Ini terlalu berisiko"
 BBA_ethiopia_communist_events.35.t: "[ETH.GetNameDefCap] Meminta Penarikan Dari Afrika"
 BBA_ethiopia_communist_events.35.desc: "Setelah membantu kami dalam perang saudara, perwakilan dari [ETH.GetNameDef] telah meminta agar kami sekarang memulai proses dekolonisasi. Mereka menyatakan bahwa jika kita setia pada nilai-nilai yang kita perjuangkan dalam perang saudara, kita harus mendukung penentuan nasib sendiri bagi rakyat Afrika. [ETH.GetLeader] telah mengusulkan kerja sama untuk mendirikan Republik Rif yang merdeka di Maroko utara."
 BBA_ethiopia_communist_events.35.a: "Kami mendukung rakyat Afrika."
 BBA_ethiopia_communist_events.35.b: "Mereka tidak punya hak untuk menguliahi kita."
 BBA_ethiopia_communist_events.36.t: "[SPC.GetNameDefCap] Setuju untuk Membebaskan Rif"
 BBA_ethiopia_communist_events.36.desc: "[SPC.GetNameDefCap] telah menyetujui proposal kami untuk mendirikan Republik Rif yang merdeka di Maroko utara. Ini merupakan langkah positif dalam perjuangan kemerdekaan di seluruh Afrika dan dunia yang lebih luas."
 BBA_ethiopia_communist_events.36.a: "Mendukung mereka telah membuahkan hasil."
 BBA_ethiopia_communist_events.37.t: "[SPC.GetNameDefCap] Menolak Usulan Dekolonisasi"
 BBA_ethiopia_communist_events.37.desc: "[SPC.GetNameDefCap] menanggapi dengan marah atas saran kami bahwa mereka harus kehilangan wilayah di Afrika. Mereka telah menunjukkan diri mereka tidak lebih baik dibandingkan kaum fasis atau imperialis yang tampaknya mereka lawan."
 BBA_ethiopia_communist_events.37.a: "Lalu kita akan membebaskan mereka dengan paksa."
 BBA_ethiopia_communist_events.37.b: "Kita tidak boleh memaksakan masalah ini."
 BBA_ethiopia_communist_events.38.t: "[ETH.GetNameDefCap] Menawarkan Dukungan"
 BBA_ethiopia_communist_events.38.desc: "Baru-baru ini berperang melawan fasisme di tanah air mereka, sukarelawan dari [ETH.GetNameDef] telah tiba di Spanyol untuk membantu perjuangan kami. [ETH.GetLeader] telah menjanjikan dukungan [ETH.GetLeader.GetHerHis] untuk tujuan kami dan menjanjikan bantuan materi dalam beberapa bulan mendatang."
 BBA_ethiopia_communist_events.38.a: "Terima kasih, kawan."
 BBA_ethiopia_communist_events.39.t: "Rif Dibebaskan"
 BBA_ethiopia_communist_events.39.desc: "Dengan dibebaskannya wilayah Rif dari [SPC.GetNameDef], kita mempunyai peluang untuk memaksa mereka melakukan perundingan damai. Setelah mengkhianati kepercayaan kami terhadap isu dekolonisasi, kami dapat melanjutkan perang hingga ke [SPC.GetNameDef] itu sendiri."
 BBA_ethiopia_communist_events.39.a: "Kami telah mencapai tujuan kami."
 BBA_ethiopia_communist_events.39.b: "Kami akan memastikan mereka tidak lagi menjadi ancaman."
 BBA_ethiopia_communist_events.40.t: "[ETH.GetNameDefCap] Meminta Diakhirinya Permusuhan"
 BBA_ethiopia_communist_events.40.desc: "Kami telah gagal mempertahankan kendali atas wilayah kami di Afrika. Pemerintah [ETH.GetName], setelah mencapai tujuannya, telah menghubungi kami dengan harapan dapat merundingkan perdamaian di antara kami."
 BBA_ethiopia_communist_events.40.a: "Kami tidak punya pilihan."
 BBA_ethiopia_communist_events.41.t: "[ETH.GetNameDefCap] Menuntut Penarikan Penasihat"
 BBA_ethiopia_communist_events.41.desc: "[ETH.GetNameDefCap] telah memberi tahu kami bahwa semua penasihat militer kami harus segera meninggalkan negara tersebut. Tampaknya [ETH.GetLeader] bermaksud membawa negara ini ke arah yang lebih mandiri. Jika kita tidak segera bertindak, kita mungkin kehilangan kendali atas rezim di [ETH.Capital.GetCapitalVictoryPointName]"
 BBA_ethiopia_communist_events.41.a: "Setelah semua yang telah kita lakukan untuk mereka."
#SUD Peace
 BBA_ethiopia_communist_events.46.t: "[ETH.GetNameDefCap] Menawarkan Kedamaian"
 BBA_ethiopia_communist_events.46.desc: "[ETH.GetAdjective] diplomat telah mendekati kami dengan tawaran perdamaian. Tawaran ini bergantung pada persetujuan kita untuk melepaskan klaim atas wilayah [SUD.GetAdjective] yang telah hilang dari [ETH.GetNameDef] selama konflik ini. Para diplomat juga menyatakan bahwa pemerintahan [SUD.GetAdjective] akan dibentuk di wilayah tersebut. Independensi pemerintah masih harus dilihat."
 BBA_ethiopia_communist_events.46.a: "Kami tidak akan menyerahkan wilayah kami."
 BBA_ethiopia_communist_events.46.b: "Kami tidak punya pilihan selain setuju."
