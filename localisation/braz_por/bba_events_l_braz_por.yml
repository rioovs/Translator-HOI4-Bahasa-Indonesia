 BBA_ethiopia_communist_events.51.b: "Kami tidak punya pilihan selain setuju."
 BBA_ethiopia_communist_events.52.t: "[ETH.GetNameDefCap] memutuskan hubungan dengan [SOV.GetNameDef]"
 BBA_ethiopia_communist_events.52.desc: "Pemerintahan [ETH.GetAdjective] telah mengatur sebuah operasi untuk mematahkan kendali kita atas urusan negara. [SOV.GetAdjective] personel di seluruh [ETH.Capital.GetCapitalVictoryPointName] dikawal oleh pasukan [ETH.GetAdjective] ke pusat penahanan darurat sebelum [ETH.Getleader] memberi tahu duta besar kami bahwa [ETH.GetLeader.GetSheHe] akan mengambil kendali penuh atas urusan [ETH.GetAdjective] di masa mendatang. Jika kita bertindak cepat, kita mungkin bisa mengendalikan situasi kembali. Namun, peluang untuk melakukan tindakan tersebut semakin berkurang."
 BBA_ethiopia_communist_events.52.a: "Ada hal-hal yang lebih penting yang harus kita tangani."
 BBA_ethiopia_communist_events.52.b: "Kami akan mengajari mereka kesalahan-kesalahan mereka."
 BBA_ethiopia_communist_events.53.t: "[SOV.GetNameDefCap] Menolak Mengirim Penasihat"
 BBA_ethiopia_communist_events.53.desc: "Dalam kejadian yang mengecewakan, diplomat [SOV.GetAdjective] telah memberi tahu kita bahwa mereka tidak dapat menyisihkan satu pun personel militer saat ini. Mereka menyebut masalah keamanan di dekat perbatasan mereka sendiri harus menjadi prioritas. Namun, sebagai isyarat niat baik, mereka telah mengirimkan perlengkapan infanteri kepada kami."
 BBA_ethiopia_communist_events.53.a: "Ini lebih baik daripada tidak sama sekali."
 BBA_ethiopia_communist_events.54.t: "Bantuan rahasia dari [JAP.GetNameDef]"
 BBA_ethiopia_communist_events.54.desc: "Dengan masuknya relawan [JAP.GetAdjective] baru-baru ini yang bergabung dalam perjuangan kami, kami diberitahu bahwa pemerintah di [JAP.Capital.GetCapitalVictoryPointName] sedang dalam proses mengirimkan bantuan material dalam bentuk peralatan infanteri. Masuknya peralatan akan menjadi dorongan besar bagi revolusi. Namun, pemerintah [JAP.GetAdjective] ingin kita tetap merahasiakan asal muasal peralatan tersebut untuk menghindari dampak diplomatik dari negara-negara besar lainnya."
 BBA_ethiopia_communist_events.54.a: "Terima kasih kami, kawan!"
 BBA_ethiopia_communist_events.55.t: "[JAP.GetAdjective] subversif melarikan diri dari Kekaisaran"
 BBA_ethiopia_communist_events.55.desc: "Kenpeitai melaporkan bahwa sejumlah kelompok subversif telah keluar dari yurisdiksi kekaisaran dengan menaiki kapal kargo menuju Afrika Timur. Rumornya, di antara mereka adalah $IA_sakutaro_iwasa$ dan $IA_sanshiro_ishikawa$. Kemungkinan besar mereka berniat bergabung dengan gerakan revolusioner di [ETH.GetNameDef]."
 BBA_ethiopia_communist_events.55.a: "Ya, masalah itu teratasi dengan sendirinya."
 BBA_ethiopia_communist_events.55.b: "Para pengkhianat itu harus segera diekstradisi ke [JAP.GetName]!"
 BBA_ethiopia_communist_events.56.t: "[JAP.GetAdjective] relawan berangkat ke Afrika Timur"
 BBA_ethiopia_communist_events.56.desc: "Badan intelijen telah memberi tahu kami bahwa mereka membantu sejumlah sukarelawan untuk mendapatkan perjalanan yang aman ke Afrika Timur sehingga mereka dapat membantu gerakan revolusioner di sana. Di antara relawan tersebut adalah $IA_sakutaro_iwasa$ dan $IA_sanshiro_ishikawa$."
 BBA_ethiopia_communist_events.56.a: "Ganbare, kawan!"
 BBA_ethiopia_communist_events.56.b: "Mungkin kita bisa berbuat lebih banyak untuk mendukung perjuangan [ETH.GetNameDef]..."
 BBA_ethiopia_communist_events.57.t: "[JAP.GetNameDefCap] menuntut ekstradisi $IA_sakutaro_iwasa$ dan $IA_sanshiro_ishikawa$"
 BBA_ethiopia_communist_events.57.desc: "Kami telah menerima permintaan resmi dari pemerintah [JAP.GetName] yang menuntut ekstradisi warga [JAP.GetAdjective] yang tiba di negara tersebut dengan tujuan bergabung dengan gerakan revolusioner kami. Meskipun tidak jelas apa yang ingin mereka lakukan, permintaan tersebut menjelaskan bahwa akan ada dampak jika tidak memenuhi permintaan tersebut."
 BBA_ethiopia_communist_events.57.a: "Kami tidak akan tunduk pada ancaman reaksioner. Dan tentang kaisar mereka..."
 BBA_ethiopia_communist_events.58.t: "[ETH.GetNameDef]–[JAP.GetName] Hubungan Rusak"
 BBA_ethiopia_communist_events.58.desc: "Seperti yang diharapkan, massa revolusioner yang menjalankan [ETH.GetNameDef] telah menolak mengekstradisi para pembangkang [JAP.GetAdjective] yang tiba di negara tersebut. Karena kurangnya protokol diplomatik yang vulgar, jawaban mereka juga mengandung banyak ancaman terhadap kaisar kita yang mulia!"
 BBA_ethiopia_communist_events.58.a: "Apa lagi yang bisa kita harapkan dari orang bodoh yang merusak warisannya."
 BBA_ethiopia_communist_events.58.b: "Kami tidak akan menerima penghinaan seperti itu!"
 BBA_ethiopia_communist_events.59.t: "[JAP.GetAdjective] Embargo"
 BBA_ethiopia_communist_events.59.desc: "Tampaknya penolakan kami baru-baru ini terhadap tuntutan [JAP.GetAdjective] telah membuat marah pemerintah mereka. Telah diumumkan bahwa mereka bermaksud untuk mengembargo kami di masa mendatang karena apa yang mereka sebut sebagai ‘aktivitas ideologis yang berbahaya’ di wilayah Afrika Timur."
 BBA_ethiopia_communist_events.59.a: "Lagipula kita tidak membutuhkan perdagangan mereka."
 BBA_ethiopia_communist_events.60.t: "[FROM.GetName] Menolak Usulan Perdamaian"
 BBA_ethiopia_communist_events.60.desc: "Duta Besar dari [FROM.GetNameDef] telah menolak proposal perdamaian kami. Mereka berpendapat bahwa serangan kami terhadap mereka sama sekali tidak beralasan dan oleh karena itu, mereka tidak akan menerima apa pun kecuali penyerahan tanpa syarat dari kami karena dianggap sebagai ancaman terhadap perdamaian regional."
 BBA_ethiopia_communist_events.60.a: "Betapa munafiknya, kekerasan kekaisaran mereka hanya bisa dihentikan dengan kekerasan."
 BBA_ethiopia_communist_events.61.t: "[FROM.GetNameDefCap] Menawarkan Kedamaian untuk [?ETH.ETH_disputed_colony.GetAdjective] Kemerdekaan"
 BBA_ethiopia_communist_events.61.desc: "[FROM.GetAdjective] diplomat telah mendekati kami dengan tawaran perdamaian. Tawaran ini bergantung pada persetujuan kita untuk melepaskan klaim atas wilayah [?ETH.ETH_disputed_colony.GetAdjective] yang telah hilang dari [FROM.GetNameDef] selama konflik ini. Para diplomat juga menyatakan bahwa pemungutan suara akan diadakan di wilayah [?ETH.ETH_disputed_colony.GetAdjective] yang telah diserahkan untuk memilih pemerintahan baru. Seberapa independen pemilu tersebut masih belum jelas."
 BBA_ethiopia_communist_events.61.a: "Kami tidak akan menyerahkan wilayah kami."
 BBA_ethiopia_communist_events.61.b: "Kami tidak punya pilihan selain setuju."
 BBA_ethiopia_communist_events.62.t: "[FROM.GetName] Menyetujui Tawaran Perdamaian"
 BBA_ethiopia_communist_events.62.desc: "Para diplomat dari [FROM.GetNameDef] telah memberi tahu kami bahwa pemerintah mereka bersedia melepaskan klaim atas wilayah [?ETH.ETH_disputed_colony.GetAdjective] yang telah kami bebaskan. Mereka kini menarik pasukannya ke perbatasan yang baru ditetapkan di wilayah tersebut."
 BBA_ethiopia_communist_events.62.a: "Kemenangan heroik melawan imperialisme!"
 BBA_african_union_events.1.t: "Organisasi Persatuan Afrika Menawarkan Keanggotaan"
 BBA_african_union_events.1.desc: "Organisasi Persatuan Afrika telah memilih untuk menawarkan kami status keanggotaan. Organisasi ini dimaksudkan untuk menyatukan negara-negara Afrika untuk berdiskusi dan bekerja sama dalam isu-isu yang menjadi kepentingan bersama. Jika kita bergabung, hal ini dapat mengarah pada perjanjian pertahanan bersama antara negara-negara anggota. Namun, kami juga harus mematuhi aturan organisasi."
 BBA_african_union_events.1.a: "Keanggotaan akan menguntungkan kita."
 BBA_african_union_events.1.b: "Kami tidak tertarik dengan klub mereka."
 BBA_african_union_events.2.t: "[FROM.GetNameDefCap] Bergabung dengan Organisasi Persatuan Afrika"
 BBA_african_union_events.2.desc: "[FROM.GetNameDefCap] telah menerima tawaran keanggotaan untuk Organisasi Persatuan Afrika. Semoga ini menjadi awal dari hubungan yang lebih kooperatif antar bangsa kita."
 BBA_african_union_events.2.a: "Kita lebih kuat bersama-sama."
 BBA_african_union_events.3.t: "[FROM.GetNameDefCap] Menolak Keanggotaan Organisasi Persatuan Afrika"
 BBA_african_union_events.3.desc: "[FROM.GetNameDefCap] telah menolak tawaran keanggotaan kami untuk Organisasi Persatuan Afrika. Masih belum jelas apakah hal ini hanya disebabkan oleh politik dalam negeri atau merupakan tanda bahwa ambisi kebijakan luar negeri mereka di Afrika tidak sesuai dengan ambisi kita. Mungkin mereka bersedia bergabung di masa depan."
 BBA_african_union_events.3.a: "Sayang sekali."
 BBA_african_union_events.4.t: "[ETH_GetCentralBankName] Keanggotaan"
 BBA_african_union_events.4.desc: "Organisasi Persatuan Afrika telah membentuk [ETH_GetCentralBankName] dengan mandat untuk mengelola mata uang untuk organisasi yang sedang berkembang. Tujuannya adalah agar semua anggota dapat berbagi mata uang dan mulai mengintegrasikan perekonomian kita bersama. Hal ini diharapkan akan memberikan manfaat ekonomi di masa depan, namun bergabung dengan negara ini akan menimbulkan banyak masalah dalam jangka pendek karena masyarakat sudah terbiasa dengan mata uang baru tersebut."
 BBA_african_union_events.4.a: "Rasa sakit jangka pendek akan sia-sia."
 BBA_african_union_events.4.b: "Hal ini akan merugikan perekonomian kita."
 BBA_african_union_events.5.t: "[FROM.GetNameDefCap] Menolak Keanggotaan [ETH_GetCentralBankName]"
 BBA_african_union_events.5.desc: "Pemerintahan [FROM.GetNameDefCap] telah menolak untuk bergabung dengan [ETH_GetCentralBankName], dan lebih memilih untuk mempertahankan kendali atas mata uang mereka sendiri dan tarif perdagangan di masa mendatang."
 BBA_african_union_events.5.a: "Sebuah keputusan jangka pendek."
 BBA_african_union_events.6.t: "[FROM.GetNameDefCap] Bergabung dengan [ETH_GetCentralBankName]"
 BBA_african_union_events.6.desc: "[FROM.GetNameDefCap] telah setuju untuk bergabung dengan [ETH_GetCentralBankName] dan kini telah memulai proses menyelaraskan mata uang mereka dengan mata uang kita. Sebentar lagi, perdagangan antar negara akan menjadi jauh lebih mudah."
 BBA_african_union_events.6.a: "Keputusan yang bijaksana."
 BBA_african_union_events.7.t: "Organisasi Dewan Eksekutif Persatuan Afrika"
 BBA_african_union_events.7.desc: "Organisasi Persatuan Afrika telah membentuk dewan eksekutif untuk mengatur urusan politik para anggotanya. Dewan ini terdiri dari perwakilan negara-negara anggota dan berupaya mengarahkan kebijakan luar negeri dan dalam negeri ke arah yang terpadu. Bergabungnya mereka akan menjadi langkah menuju integrasi politik dan ekonomi penuh dengan negara-negara anggota lainnya. Namun, hal ini jelas akan mengakibatkan hilangnya independensi politik kita saat ini jika kita bergabung."
 BBA_african_union_events.7.a: "Kami berkomitmen untuk integrasi yang lebih dalam."
 BBA_african_union_events.7.b: "Kami tidak mendaftar untuk ini."
 BBA_african_union_events.8.t: "[FROM.GetNameDefCap] Bergabung dengan Dewan Eksekutif"
 BBA_african_union_events.8.desc: "Pemerintah [FROM.GetNameDef] telah setuju untuk bergabung dengan dewan eksekutif Organisasi Persatuan Afrika. Saat ini mereka sedang dalam proses penandatanganan perjanjian yang mengakui kewenangan dewan dalam semua masalah hukum."
 BBA_african_union_events.8.a: "Selangkah lebih dekat menuju integrasi penuh."
 BBA_african_union_events.9.t: "[FROM.GetNameDefCap] Menolak Bergabung dengan Dewan Eksekutif"
 BBA_african_union_events.9.desc: "Pemerintah [FROM.GetNameDef] telah menolak untuk bergabung dengan dewan eksekutif Organisasi Persatuan Afrika. [FROM.GetLeader] mengutip [FROM.GetLeader.GetHerHis] kekhawatiran tentang kedaulatan dan keinginan untuk membuat perjanjian dengan negara-negara di luar organisasi tanpa persetujuan dewan."
 BBA_african_union_events.9.a: "Mengapa mereka bahkan menjadi negara anggota?"
 BBA_african_union_events.10.t: "[FROM.GetNameDefCap] Mempromosikan Organisasi Persatuan Afrika"
 BBA_african_union_events.10.desc: "[FROM.GetNameDefCap] telah memulai kampanye propaganda di negara kita untuk mencoba meningkatkan persepsi terhadap Organisasi Persatuan Afrika. Hal ini tidak diragukan lagi memberikan tekanan pada kami untuk melakukan integrasi yang lebih besar ke dalam organisasi."
 BBA_african_union_events.10.a: "Mereka seharusnya tidak ikut campur dalam urusan kita."
 BBA_african_union_events.11.t: "[FROM.GetAdjective] Tekanan"
 BBA_african_union_events.11.desc: "[FROM.GetNameDefCap] telah mengancam anggota pemerintahan kita secara pribadi jika kita tidak mulai menyelaraskan tujuan kebijakan kita dengan tujuan mereka. Hal ini tidak diragukan lagi memberikan tekanan pada kita untuk mengupayakan integrasi yang lebih besar ke dalam Organisasi Persatuan Afrika."
 BBA_african_union_events.11.a: "Kami akan lebih berhati-hati di masa depan."
 BBA_african_union_events.11.b: "Kami tidak akan diganggu oleh [ETH.GetLeader]."
 BBA_african_union_events.12.t: "Proses Integrasi Penuh Dimulai"
 BBA_african_union_events.12.desc: "Uni Afrika telah memulai proses mengintegrasikan kami sepenuhnya ke dalam serikat mereka. Mudah-mudahan hal ini akan membawa babak sejarah yang lebih positif bagi rakyat kita, namun masih harus dilihat apa tujuan akhir dari Uni Afrika."
 BBA_african_union_events.12.a: "Kami tahu hari ini akan tiba."
 BBA_african_union_events.13.t: "[FROM.GetNameDefCap] Meninggalkan Organisasi Persatuan Afrika"
 BBA_african_union_events.13.desc: "[FROM.GetLeader] telah mengumumkan penarikan [FROM.GetNameDef] dari Organisasi Persatuan Afrika. Mereka menyatakan kekhawatirannya terhadap arah organisasi dan menuduh kami mengkhianati nilai-nilai yang mendasari organisasi tersebut."
 BBA_african_union_events.13.a: "Kami Setuju untuk Tidak Setuju"
 BBA_african_union_events.14.t: "[FROM.GetNameDefCap] Meninggalkan Organisasi Persatuan Afrika"
 BBA_african_union_events.14.desc: "[FROM.GetLeader] telah mengumumkan penarikan [FROM.GetNameDef] dari Organisasi Persatuan Afrika. Mereka menyatakan kekhawatirannya terhadap arah organisasi dan menuduh kami mengkhianati nilai-nilai yang mendasari organisasi tersebut."
 BBA_african_union_events.14.a: "Kami setuju untuk tidak setuju."
 BBA_african_union_events.14.b: "Ini sungguh keterlaluan!"
 BBA_african_union_events.15.t: "Organisasi Perjanjian Pertahanan Persatuan Afrika"
 BBA_african_union_events.15.desc: "Organisasi Persatuan Afrika telah mengusulkan perjanjian pertahanan bersama antara negara-negara anggota. Artinya, serangan terhadap anggota mana pun akan dianggap sebagai serangan terhadap seluruh negara anggota. Hal ini diharapkan dapat mencegah agresor asing menyerang anggota organisasi dan mencegah perang antar anggota."
 BBA_african_union_events.15.a: "Ini akan mencegah konflik."
 BBA_african_union_events.15.b: "Kami tidak tertarik dengan pengaturan seperti itu."
 BBA_african_union_events.16.t: "[FROM.GetNameDefCap] Menolak Perjanjian Pembelaan"
 BBA_african_union_events.16.desc: "[FROM.GetNameDefCap] telah menolak perjanjian pertahanan Organisasi Persatuan Afrika. Masih harus dilihat apakah hal ini menandai perubahan sikap jangka panjang mereka terhadap organisasi tersebut, atau apakah usulan tersebut tidak tepat waktu karena politik dalam negeri."
 BBA_african_union_events.16.a: "Sangat mencurigakan."
 BBA_african_union_events.17.t: "[FROM.GetNameDefCap] Bergabung dengan Pakta Pertahanan"
 BBA_african_union_events.17.desc: "[FROM.GetNameDefCap] telah setuju untuk bergabung dengan pakta pertahanan Organisasi Persatuan Afrika. Kami sekarang berkewajiban untuk melindungi satu sama lain jika terjadi serangan terhadap salah satu pihak."
 BBA_african_union_events.17.a: "Berita bagus."
 BBA_african_union_events.18.t: "Perjanjian Pertahanan Organisasi Persatuan Afrika Diminta"
 BBA_african_union_events.18.desc: "Penandatangan perjanjian pertahanan bersama Organisasi Persatuan Afrika telah diserang. Sebagai sesama penandatangan, kita kini berkewajiban membantu mereka secara militer. Jika kami menolak, kami pasti akan dikeluarkan dari perjanjian tersebut dan berpotensi merusak hubungan diplomatik dengan sesama penandatangan perjanjian."
 BBA_african_union_events.18.a: "Tentu saja kami akan membela mereka."
 BBA_african_union_events.18.b: "Mungkin penandatanganan adalah sebuah kesalahan."
 BBA_african_union_events.19.t: "[FROM.GetNameDefCap] Datang untuk Pembelaan kami"
 BBA_african_union_events.19.desc: "[FROM.GetName] telah setuju untuk menjunjung tinggi komitmen pertahanan mereka sebagai sesama penandatangan perjanjian pertahanan bersama Organisasi Persatuan Afrika."
 BBA_african_union_events.19.a: "Bersama-sama, kita akan menjadi pemenang."
 BBA_african_union_events.20.t: "[FROM.GetNameDefCap] Melanggar Perjanjian Pertahanan"
 BBA_african_union_events.20.desc: "[FROM.GetName] telah menolak untuk menjunjung komitmen pertahanan mereka meskipun mereka adalah sesama penandatangan perjanjian pertahanan bersama Organisasi Persatuan Afrika. Kami sekarang sedang dalam proses untuk menghapusnya dari perjanjian."
 BBA_african_union_events.20.a: "Mereka telah mengkhianati kita semua."
 BBA_african_union_events.21.t: "[THIS.GetAdjective] Pertumbuhan Ekonomi"
 BBA_african_union_events.21.desc: "Output ekonomi kita baru-baru ini terpukul dengan adaptasi mata uang baru [ETH_GetCentralBankName]. Namun, produksi dan output kami kini mulai meningkat lagi, bahkan melampaui rekor sebelumnya. Para ekonom mengaitkan pertumbuhan ini dengan penghapusan hambatan perdagangan antara [THIS.GetNameDef] dan anggota lain yang menggunakan mata uang bersama sehingga memungkinkan integrasi ekonomi yang lebih dalam."
 BBA_african_union_events.21.a: "Akhirnya terbayar."
 BBA_african_union_events.22.t: "Upaya Intimidasi di [FROM.GetNameDef] Tidak Berhasil"
 BBA_african_union_events.22.desc: "Pimpinan [FROM.GetNameDef] menanggapi dengan marah upaya kami mengintimidasi mereka. Tampaknya kecil kemungkinan mereka bersedia bekerja sama dalam waktu dekat."
 BBA_african_union_events.22.a: "Mereka tidak bisa terus melakukan hal ini selamanya."
 BBA_african_union_events.23.t: "Upaya Intimidasi di [FROM.GetNameDef] Berhasil"
 BBA_african_union_events.23.desc: "Kepemimpinan [FROM.GetNameDef] telah melakukan upaya bersama untuk meredakan kekhawatiran kami tentang penyelarasan kebijakan dalam Organisasi Persatuan Afrika. Mereka bahkan berjanji untuk berkonsultasi dengan duta besar kita sebelum mengambil keputusan terburu-buru di masa depan."
 BBA_african_union_events.23.a: "Luar biasa."
####### ITALY ######
 BBA_italy_second_italo_ethiopian_war.1.t: "[FROM.GetAdjective] Penawaran Perdamaian"
 BBA_italy_second_italo_ethiopian_war.1.desc: "Kami memiliki [FROM.GetName] dalam pelarian! Tentara kita yang perkasa telah menimbulkan kerugian besar sehingga [FROM.GetAdjective] merangkak berlutut, memohon perdamaian. Negara kami sedang dilanda perang dan perdamaian akan sangat kami sambut, namun ini mungkin juga menjadi kesempatan besar untuk semakin menekankan kemenangan kami – untuk memastikan bahwa tidak ada negara Eropa bodoh lainnya yang mencoba untuk menaklukkan Ethiopia yang tak tertaklukkan lagi!"
 BBA_italy_second_italo_ethiopian_war.1.a: "Damai itu!"
 BBA_italy_second_italo_ethiopian_war.1.b: "Jangan pernah, teruslah mendorong!"
 BBA_italy_second_italo_ethiopian_war.2.t: "[FROM.GetName] Menerima [ROOT.GetAdjective] Tawaran Perdamaian"
 BBA_italy_second_italo_ethiopian_war.2.desc: "Tawaran perdamaian kami yang murah hati telah diterima oleh bangsa Abyssinia. Kemenangan ini jauh dari kemenangan gemilang yang kita bayangkan pada awal perang, namun mungkin kita dapat merasa terhibur dengan kenyataan bahwa perang telah berakhir. Kami akan mengatasi penghinaan ini seperti yang telah kami lakukan berkali-kali sebelumnya, dan kami akan bangkit – lebih kuat dari sebelumnya!"
 BBA_italy_second_italo_ethiopian_war.2.a: "Suatu urusan yang memalukan..."
 BBA_italy_second_italo_ethiopian_war.3.t: "[FROM.GetName] Menolak [ROOT.GetAdjective] Tawaran Perdamaian"
 BBA_italy_second_italo_ethiopian_war.3.desc: "Jika yang mereka inginkan adalah perang, kami akan menurutinya! Bangsa Abyssinia telah menolak tawaran perdamaian kami dan bertekad untuk terus berjuang. Kami akan menunjukkan kepada orang-orang bodoh yang tidak tahu berterima kasih itu terbuat dari apa pasir Italia yang sebenarnya! Ini hanyalah sebuah kemunduran. Kami akan mendorong mereka kembali ke pegunungan dan kemudian menguasai mereka sepenuhnya."
 BBA_italy_second_italo_ethiopian_war.3.a: "Kami akan membalikkan keadaan perang!"
#1st Missiolini localized at the beginning of the file along with Italo-Ethiopian War events
 BBA_italy_missiolinis.02_north.t: "Kios Front Utara"
 BBA_italy_missiolinis.02_north.desc: "Keberhasilan yang diharapkan dari serangan balasan kami di Abyssinia Utara tidak terlihat. Duce bersumpah bahwa seluruh dunia menertawakannya dan kurangnya kemajuan dalam perang. Dia setengah berpikir untuk secara pribadi mengambil alih serangan di utara untuk memastikan pasukannya termotivasi dan dipimpin dengan baik."
 BBA_italy_missiolinis.02_north.a: "Kami akan menang – pada akhirnya"
 BBA_italy_missiolinis.02_north.b: "Kita perlu pergantian kepemimpinan!"
 BBA_italy_missiolinis.02_north.c: "Sebuah kegagalan yang mengejutkan!"
 BBA_italy_missiolinis.04_south.t: "Kios Front Selatan"
 BBA_italy_missiolinis.04_south.desc: "Serangan balasan pihak Selatan di Abyssinia belum mencapai tujuan yang diinginkan Duce, yang membuatnya bertele-tele selama berjam-jam karena dikelilingi oleh ketidakmampuan dan kebodohan. Dia tampaknya yakin bahwa komando tinggi militer sedang menentangnya dan bahwa para Jenderal ingin melihat seluruh perang gagal."
 BBA_italy_missiolinis.04_south.a: "Kami akan menang – pada akhirnya"
 BBA_italy_missiolinis.04_south.b: "Kita perlu pergantian kepemimpinan!"
 BBA_italy_missiolinis.04_south.c: "Sebuah kegagalan yang mengejutkan!"
 BBA_italy_missiolinis.03_north.t: "Sukses di Ethiopia Utara"
 BBA_italy_missiolinis.03_north.desc: "Mussolini hanya memuji dan mengagumi tentara di Abyssinia utara dan keberhasilan mereka dalam memukul mundur lawan-lawan sengit mereka. Dia tentu saja tidak pernah meragukan kehebatan pasukan kita - selama mereka mendapat motivasi yang tepat dari Duce dan alatnya untuk menang."
 BBA_italy_missiolinis.03_north.a: "Kami sedang mengejar mereka sekarang!"
 BBA_italy_missiolinis.05_south.t: "Sukses di Ethiopia Selatan"
 BBA_italy_missiolinis.05_south.desc: "Sangat gembira dengan kemajuan baru-baru ini di Abyssinia Selatan, Mussolini memuji keberanian pasukan Italia dan dedikasi mereka untuk mengakhiri konflik ini. Dia tidak pernah merasa was-was dan sepenuhnya memercayai pasukan kita untuk mengalahkan musuh di medan perang - begitu mereka mendapat dukungan yang tepat dari Duce mereka."
 BBA_italy_missiolinis.05_south.a: "Kami telah memukul mundur musuh!"
 BBA_italy_missiolinis.11.t: "Akhiri Perang"
 BBA_italy_missiolinis.11.desc: "Duce sekarang menginginkan perang di Abyssinia segera diakhiri, sehingga Italia dapat beralih ke negara lain untuk meraih kejayaan lebih lanjut. Menaklukkan wilayah kuno Axum akan memperkuat posisi Italia sebagai salah satu kerajaan besar di dunia.\n\nApa pun benteng Abyssinian yang tersisa harus ditangani dan seluruh wilayah Abyssinian harus berada di tangan Italia."
 BBA_italy_missiolinis.11.a: "Musuh akan dikalahkan!"
 BBA_italy_missiolinis.12.t: "Perang Berlanjut"
 BBA_italy_missiolinis.12.desc: "Fakta bahwa Abyssinia masih bebas dan menolak pendudukan telah membuat Duce mengamuk selama berjam-jam, menyebutnya sebagai hal yang memalukan; tidak hanya untuknya secara pribadi tetapi juga untuk Italia dan rakyatnya. Kalau saja dia bisa mengawasi sendiri tahap-tahap terakhir perang, hal itu pasti sudah terjadi sekarang, keluhnya kepada semua orang di sekitarnya."
 BBA_italy_missiolinis.12.a: "Bangsa Abyssinia sedang melakukan perlawanan keras"
 BBA_italy_missiolinis.13.t: "Penaklukan Etiopia"
 BBA_italy_missiolinis.13.desc: "Mussolini sangat gembira dan membual kepada siapa pun yang mau mendengarkan atau sebaliknya tentang kemenangan kami baru-baru ini. Dia tidak pernah ragu bahwa Italia akan menang dan menang di Abyssinia, meskipun ada berbagai kemunduran yang kami hadapi. Kami akhirnya membalas kegagalan perang Italia-Abyssinian yang pertama!\n\nThe Duce memuji penaklukan tersebut sebagai kemenangan bagi sistem fasis dan pemerintahannya, menyebut rakyat Italia lebih kuat dan lebih bersatu dari sebelumnya."
 BBA_italy_missiolinis.13.a: "Hanya darah yang menggerakkan roda sejarah"
 BBA_italy_missiolinis.21.t: "Tenangkan Etiopia"
 BBA_italy_missiolinis.21.desc: "Duce secara terbuka menyatakan bagaimana bangsa Abyssinia dihancurkan dan melarikan diri, keinginan mereka hancur setelah kekalahan mereka. Namun secara pribadi, dia mengutuk bangsa Abyssinia karena ketangguhan dan perlawanan mereka terhadap kekuasaan Italia. Duce telah memberikan perintah untuk menindak oposisi lokal dengan kekerasan dan menerapkan undang-undang untuk mengendalikan populasi. Dia ingin seluruh negeri tenang dan bergabung dengan Italia sesegera mungkin."
 BBA_italy_missiolinis.21.a: "Kami akan membawa perdamaian dan stabilitas"
 BBA_italy_missiolinis.22.t: "Ethiopia masih menolak"
 BBA_italy_missiolinis.22.desc: "Abyssinia masih belum bisa ditenangkan, dan perlawanan terhadap pendudukan Italia masih tetap kuat. Duce tidak memiliki kata-kata baik baik untuk rakyat Abyssinian maupun upaya untuk memadamkan oposisi dan menyebut operasi tersebut sebagai hal yang memalukan secara nasional. Dia mengeluh bahwa penjajah Italia memiliki penampilan yang kasar dan perilaku yang kasar, yang tidak memberikan rasa hormat pada penduduk setempat."
 BBA_italy_missiolinis.22.a: "Bangsa Abyssinian lebih tangguh dari perkiraan"
 BBA_italy_missiolinis.23.t: "Pengamanan Ethiopia"
 BBA_italy_missiolinis.23.desc: "Kami akhirnya berhasil memadamkan perlawanan di Abyssinia, dari puncak gunung yang tinggi hingga dataran gurun yang rendah, penduduknya mendapatkan tempat mereka di wilayah Italia. Dengan senang hati, Mussolini menyatakan bahwa ia akhirnya dapat mengalihkan perhatiannya ke hal-hal lain sehingga Italia bisa sejahtera dan mengklaim apa yang menjadi haknya."
 BBA_italy_missiolinis.23.a: "Italia berkuasa"
 BBA_italy_missiolinis.31.t: "Program Industrialisasi"
 BBA_italy_missiolinis.31.desc: "Agar Italia benar-benar berkembang, Duce mempunyai rencana untuk memperluas kemampuan produksi kami. Untuk mencapai visi negara yang makmur ini, kita memerlukan lebih banyak pabrik yang dapat menopang pertumbuhan kerajaan kita yang sibuk ini."
 BBA_italy_missiolinis.31.a: "Perluas Industri"
 BBA_italy_missiolinis.32.t: "Kemajuan Industrialisasi yang Tertinggal"
 BBA_italy_missiolinis.32.desc: "Duce merasa terganggu dengan kurangnya kemajuan dalam membangun kapasitas industri di negaranya. Dia menyesali kendala yang menimpanya - bukan karena kesalahannya sendiri - yang membuat visinya tentang Italia yang makmur jauh lebih sulit untuk diwujudkan."
 BBA_italy_missiolinis.32.a: "Kita harus berusaha lebih keras"
 BBA_italy_missiolinis.33.t: "Program Industrialisasi yang Sukses"
 BBA_italy_missiolinis.33.desc: "Pabrik-pabrik yang baru dibangun ini dipuji oleh Mussolini sebagai langkah pertama dalam modernisasi industri Italia. Duce sangat senang dengan cara hal ini meningkatkan kapasitas produksi negaranya dan memungkinkannya mewujudkan visinya untuk Italia yang lebih besar."
 BBA_italy_missiolinis.33.a: "Langkah pertama menuju kehebatan"
 BBA_italy_missiolinis.41.t: "Perkuat Militer"
 BBA_italy_missiolinis.41.desc: "Seperti Kekaisaran Romawi di masa lalu, kerajaan kita yang sedang berkembang ini membentang jauh dan luas dan membutuhkan pasukan yang kuat untuk melindunginya dari gerombolan orang barbar di luar perbatasan. Duce yakin bahwa agar Italia dapat bersaing dengan negara-negara besar lainnya, kita harus mampu memberikan kekuatan di balik kata-kata kita - atau tidak ada yang akan menganggap kita serius!"
 BBA_italy_missiolinis.41.a: "Untuk Italia!"
 BBA_italy_missiolinis.42.t: "Ekspansi Militer yang Gagal"
 BBA_italy_missiolinis.42.desc: "Kurangnya tentara Italia adalah kembalinya kekhawatiran Duce yang melihat perbatasan panjang kita dengan saingan kita sebagai titik kerentanan. Duce merasa digagalkan setelah upaya kami baru-baru ini yang gagal untuk menambah jumlah pasukan dan mulai mempertanyakan pengabdian rakyat terhadap perjuangannya memulihkan kebesaran Italia."
 BBA_italy_missiolinis.42.a: "Italia akan terlindungi - entah bagaimana caranya"
 BBA_italy_missiolinis.43.t: "Militer Italia yang Diperluas"
 BBA_italy_missiolinis.43.desc: "Mussolini secara pribadi telah memeriksa beberapa pasukan baru yang akan melindungi perbatasan kita - dan memperluasnya jika Duce menganggap perlu. Dia sangat senang dengan peningkatan jumlah divisi dan membanggakan bahwa hanya dengan pandangan ke depannya Italia sekarang memiliki pasukan terhormat yang bahkan musuh kita tidak dapat menyangkal kekuatannya."
 BBA_italy_missiolinis.43.a: "Italia berdiri aman"
 BBA_italy_missiolinis.51.t: "Memperluas Armada Truk Pasokan"
 BBA_italy_missiolinis.51.desc: "Konflik-konflik yang terjadi baru-baru ini telah memperlihatkan kekurangan-kekurangan tertentu dalam dukungan logistik kita kepada tentara. Duce telah diyakinkan oleh komando tinggi Italia untuk memesan armada truk pasokan baru. Awalnya dia ingin 5.000 truk Italia baru dirakit, tapi dia dibujuk untuk menerima lebih sedikit - setelah diyakinkan bahwa itu sudah cukup."
 BBA_italy_missiolinis.51.a: "Setidaknya bukan 5000 truk"
 BBA_italy_missiolinis.52.t: "Terlalu Sedikit Truk Pendukung"
 BBA_italy_missiolinis.52.desc: "Kegagalan pengiriman truk-truk baru untuk tentara telah membuat Duce mengkritik kekuatan-kekuatan industri yang mendukung upaya tersebut, dan mengeluhkan kurangnya visi. Ia yakin bahwa tidak ada seorang pun kecuali dirinya yang benar-benar dapat melihat potensi besar Italia dan rakyatnya."
 BBA_italy_missiolinis.52.a: "Tentara kita harus hidup tanpanya"
 BBA_italy_missiolinis.53.t: "Armada Truk Pendukung Diperkuat"
 BBA_italy_missiolinis.53.desc: "Mussolini secara pribadi mengucapkan selamat kepada pabrik-pabrik yang terlibat dalam produksi truk baru untuk tentara – dan menyebut para pekerja sebagai tulang punggung Italia. Ia kini mengantisipasi kekuatan militer yang lebih mobile yang dapat bergerak cepat di wilayah yang luas tanpa harus terkendala oleh keterbelakangan logistik."
 BBA_italy_missiolinis.53.a: "Pastinya hal ini akan membuat pasukan kita tidak terkalahkan"
 BBA_italy_missiolinis.61.t: "Program Cadangan Bahan Bakar"
 BBA_italy_missiolinis.61.desc: "Tentara modern tidak hanya bergerak dengan perutnya tetapi juga dengan bahan bakarnya, dan jika tidak ada maka seluruh mesin perang akan terhenti. Komando tinggi Italia akhirnya meyakinkan Duce bahwa militer modern akan terhenti karena kekurangan bahan bakar. Semua cabang militer membutuhkannya, dan kita harus mampu menyediakan gas dalam jumlah besar jika ingin sukses di medan perang."
 BBA_italy_missiolinis.61.a: "Kita harus menimbun bahan bakar"
 BBA_italy_missiolinis.62.t: "Cadangan Bahan Bakar Tidak Memadai"
 BBA_italy_missiolinis.62.desc: "Kurangnya cadangan bahan bakar selalu menjadi kekhawatiran bagi komando tinggi militer, yang khawatir bahwa pesawat terbang akan dilarang terbang, kapal perang akan berlabuh, dan tentara tidak akan bergerak. Duce yakin bahwa Italia akan bertahan - seperti biasa - namun ia marah karena perintah eksplisitnya belum dipenuhi."
 BBA_italy_missiolinis.62.a: "Kami harus mengaturnya"
 BBA_italy_missiolinis.63.t: "Ekspansi Cadangan Bahan Bakar yang Berhasil"
 BBA_italy_missiolinis.63.desc: "Mussolini yakin sepenuhnya bahwa militer Italia siap melancarkan perang skala penuh sekarang dan tidak akan segera kehabisan bahan bakar. Komando tinggi militer mungkin tidak begitu yakin, namun mereka bisa diringankan dengan cadangan yang telah dikumpulkan sejauh ini."
 BBA_italy_missiolinis.63.a: "Cadangan kami pasti akan berguna"
 BBA_italy_missiolinis.71.t: "Perluas Angkatan Udara"
 BBA_italy_missiolinis.71.desc: "Sejak Duce pertama kali membentuk Regia Aeronautica, pesawat ini telah menjadi simbol kebanggaan nasional dan salah satu angkatan udara terbesar di dunia. Satu-satunya masalah adalah ukurannya yang terlalu kecil, dan Duce kini telah diyakinkan untuk memproduksi pesawat tambahan untuk memperkuat Aeronautica."
 BBA_italy_missiolinis.71.a: "Aeronautica adalah kebanggaan kami"
 BBA_italy_missiolinis.72.t: "Angkatan Udara yang Sedikit"
 BBA_italy_missiolinis.72.desc: "Produksi pesawat baru telah direncanakan sebagai propaganda besar oleh Duce, yang kini harus mengurangi niat awalnya. Kurangnya jumlah pesawat baru dalam jumlah besar membuat Duce marah dan mencari pihak yang bisa disalahkan atas kegagalan ini."
 BBA_italy_missiolinis.72.a: "Sayangnya"
 BBA_italy_missiolinis.73.t: "Angkatan Udara Berhasil Diperkuat"
 BBA_italy_missiolinis.73.desc: "Mussolini menaruh minat pribadi dalam memperkuat angkatan udara dan menggunakan produksi pesawat baru sebagai kesempatan untuk menunjukkan industrialisme Italia. Dengan Regia Aeronautica sebagai pusatnya, beberapa propaganda telah dibuat untuk merayakan penerbangan dan teknik Italia."
 BBA_italy_missiolinis.73.a: "Aeronautica akan menang!"
 BBA_italy_missiolinis.81.t: "Inovasi Teknologi"
 BBA_italy_missiolinis.81.desc: "Duce telah memutuskan untuk menunjukkan keunggulan sistem fasis, dan bagaimana sistem ini dapat memfokuskan sumber daya dan upaya secara lebih efektif. Ia bertujuan untuk menunjukkan kepada masyarakat Italia – dan seluruh dunia – betapa cepatnya fasisme dapat mencapai lompatan besar dalam bidang teknologi. Ia juga berharap hal ini akan mempersatukan dan menyatukan masyarakat Italia yang secara historis terpecah di bawah fasisme."
 BBA_italy_missiolinis.81.a: "Seluruh dunia akan melihatnya"
 BBA_italy_missiolinis.82.t: "Kemajuan Teknologi yang Tidak Memuaskan"
 BBA_italy_missiolinis.82.desc: "Mencoba menunjukkan kekuatan sistem fasis telah menjadi bumerang bagi Duce, yang mengutuk siapa pun yang berada dalam jangkauan pendengarannya. Alih-alih mengajak masyarakat mendukung fasisme, masyarakat malah bersikap skeptis dan saling berbisik-bisik tentang betapa bodohnya Mussolini. Setidaknya begitulah yang diyakini Duce."
 BBA_italy_missiolinis.82.a: "Hanya kemunduran kecil"
 BBA_italy_missiolinis.83.t: "Inovasi Teknologi Hebat"
 BBA_italy_missiolinis.83.desc: "Lompatan teknologi yang diiklankan oleh sistem fasis telah membuahkan hasil, dan Mussolini tidak ragu untuk menunjukkan inovasi yang dihasilkan di bawah kepemimpinannya. Pesannya adalah tentang fasisme dan juga tentang Mussolini dan visinya untuk Italia. Apakah hal ini akan menggalang dan menyatukan rakyat Italia seperti yang diharapkan Duce, masih harus dilihat."
 BBA_italy_missiolinis.83.a: "Untuk Duce dan negaranya!"
 BBA_italy_missiolinis.91.t: "Perluasan Badan Intelijen"
 BBA_italy_missiolinis.91.desc: "Duce telah terpengaruh untuk meningkatkan sumber daya tambahan untuk Badan Intelijen kita, dengan janji bahwa mereka akan menjadi salah satu yang terbaik di dunia. Hal ini kemudian membuatnya secara terbuka membual tentang bagaimana agen-agen kami telah menyusup ke setiap aspek masyarakat Italia untuk menyeret komunis, penjahat, dan unsur-unsur berbahaya lainnya ke permukaan dan membawa ke pengadilan, sehingga menjadikan Italia lebih aman."
 BBA_italy_missiolinis.91.a: "Perluas Badan Intelijen"
 BBA_italy_missiolinis.92.t: "Kegagalan Badan Intelijen"
 BBA_italy_missiolinis.92.desc: "Alih-alih memperkuat Badan Intelijen, beberapa dokumen rahasia malah dibocorkan – meninggalkan kesan buruk bagi agen kami. Meski dokumen-dokumen itu tidak mengandung rahasia yang sangat penting, namun hal itu memalukan bagi Duce yang belum lama ini menyombongkan aparat intelijen kita. Hal ini tidak hanya akan membuat marah Duce tetapi juga menimbulkan keraguan di benak rakyat Italia dan musuh-musuh kita mengenai kemampuan kita."
 BBA_italy_missiolinis.92.a: "Sungguh memalukan"
 BBA_italy_missiolinis.93.t: "Upaya Badan Intelijen yang Hebat"
 BBA_italy_missiolinis.93.desc: "Kompetensi badan intelijen kami telah terbukti tanpa keraguan setelah beberapa warga negara yang berbeda pendapat ditangkap karena berencana merusak pemerintah fasis Italia dengan bantuan asing. Mussolini menggunakan keberhasilan ini untuk menggambarkan bagaimana bimbingannyalah yang membuat Italia bisa menang dan mengatasi kesulitan apa pun yang mungkin terjadi di masa depan."
 BBA_italy_missiolinis.93.a: "Benar-benar sebuah prestasi"
 BBA_italy_missiolinis.101.t: "Menempati Albania"
 BBA_italy_missiolinis.101.desc: "Ikatan kuat antara Italia dan Albania sudah ada sejak ribuan tahun lalu, hingga masa Kekaisaran Romawi. Ada hubungan historis yang kuat antara kedua negara kita, hubungan yang ingin diperdalam oleh Duce. Dia ingin memasukkan Albania ke dalam Italia dan menuntut pendudukan cepat atas negara tersebut sehingga kami sepenuhnya mengontrol jalan masuk ke Laut Adriatik. Hal ini akan membawa kejayaan dan prestise bagi Italia, yang sudah terlalu lama dipandang sebagai negara yang lebih lemah oleh banyak negara lain – atau begitulah pendapatnya."
 BBA_italy_missiolinis.101.a: "Kemuliaan bagi Italia!"
 BBA_italy_missiolinis.102.t: "Kegagalan di Albania"
 BBA_italy_missiolinis.102.desc: "Fakta bahwa tentara kita berjuang untuk mencapai kemajuan di Albania telah membingungkan Duce dan menyebutnya sebagai hal yang memalukan secara nasional. Secara pribadi, dia dengan marah bergumam tentang bagaimana hal ini seharusnya menjadi momen yang mulia bagi Italia – dan dirinya sendiri – dan bagaimana hal ini akan membenarkan penarikan diri kita yang memalukan dari sana hampir 20 tahun yang lalu. Sebaliknya, katanya, kita dikhianati oleh ketidakmampuan dan kepengecutan."
 BBA_italy_missiolinis.102.a: "Memalukan"
 BBA_italy_missiolinis.103.t: "Pendudukan Albania"
 BBA_italy_missiolinis.103.desc: "Mussolini dengan gembira menyatakan bahwa pasukan kami menang di Albania, di hadapan banyak orang yang antusias. Beliau melanjutkan dengan bagaimana seluruh negara kini berada dalam genggaman kita dan bagaimana hal ini akan membawa Italia menuju kebesaran dan kejayaan lebih lanjut. Hari-hari kerajaan lama sudah tinggal menghitung hari dan hari-hari Italia masih di depan, ujarnya."
 BBA_italy_missiolinis.103.a: "Untuk kemuliaan yang akan datang!"
 BBA_italy_missiolinis.111.t: "Taklukkan Dalmatia"
 BBA_italy_missiolinis.111.desc: "Meskipun kami termasuk pemenang Perang Besar dan telah dijanjikan Dalmatia melalui Pakta London, kami dikhianati oleh pihak yang mengaku sekutu. Kami tidak pernah menerima apa yang dijanjikan kepada kami, jadi sekarang kami harus mengambilnya dengan paksa, tegas Duce. Dia lebih lanjut menyatakan bahwa sudah menjadi takdir Italia untuk mengambil apa yang menjadi hak kita – tidak peduli apa yang dikatakan negara-negara lama."
 BBA_italy_missiolinis.111.a: "Dalmatia adalah hak kita"
 BBA_italy_missiolinis.112.t: "Invasi yang Terhenti di Dalmatia"
 BBA_italy_missiolinis.112.desc: "Apa yang seharusnya merupakan invasi cepat ke pantai Adriatik kini berubah menjadi sebuah kerja keras. Pasukan kami telah terjebak di Dalmatia dan belum mampu melaksanakan penaklukan besar yang dijanjikan kepada rakyat Italia. Duce telah ditemukan dalam beberapa kesempatan dalam keadaan hampir katatonik sambil bergumam tentang bagaimana Dalmatia berhak menjadi milik kita. Ini bukanlah unjuk kekuatan yang diharapkan Duce."
 BBA_italy_missiolinis.112.a: "Hal ini hanya akan memperparah ketidakadilan terhadap kami"
 BBA_italy_missiolinis.113.t: "Penaklukan Dalmatia"
 BBA_italy_missiolinis.113.desc: "Ketidakadilan yang parah akhirnya diperbaiki! Pesisir Dalmatian adalah milik kita. Mussolini sangat gembira dan menyebut kemenangan ini sebagai momen besar bagi Italia dan rakyatnya. Dia menyatakan bahwa keluhan besar telah lama diperbaiki. Masyarakat turun ke jalan untuk merayakan peristiwa penting ini."
 BBA_italy_missiolinis.113.a: "Ketidakadilan telah teratasi"
 BBA_italy_missiolinis.121.t: "Taklukkan Yunani"
 BBA_italy_missiolinis.121.desc: "Dalam pidatonya baru-baru ini, Duce menguraikan visinya untuk Italia yang lebih besar, di mana salah satu poin yang ia sampaikan adalah bagaimana kita harus mendobrak pengekangan yang dilakukan oleh negara-negara besar lainnya. Dia menyatakan Yunani sebagai titik penting bagi Italia dan ekspansinya, sebuah hambatan yang harus diatasi agar kita dapat melakukan ekspansi melampaui ikatan yang menimpa kita."
 BBA_italy_missiolinis.121.a: "\"Putuskan ikatannya"
 BBA_italy_missiolinis.122.t: "Rasa malu di Yunani"
 BBA_italy_missiolinis.122.desc: "Daerah pegunungan Yunani terbukti menjadi hambatan yang tidak dapat diatasi bagi pasukan kita. Mereka mendapati diri mereka dihalangi dan ditembaki. Duce masih yakin bahwa kemenangan akan menjadi milik kita – harus menjadi milik kita – dan menolak untuk mengakui kemunduran apa pun. Dia berargumentasi dengan sungguh-sungguh bahwa superioritas kita pada akhirnya akan menang."
 BBA_italy_missiolinis.122.a: "Perlawanan sangat sengit"
 BBA_italy_missiolinis.123.t: "Penaklukan Yunani"
 BBA_italy_missiolinis.123.desc: "Seperti legiun Romawi sebelum kita, kita kini telah mengalahkan pasukan musuh dan menaklukkan seluruh Yunani. Mussolini menyampaikan pidato yang meriah di bawah bayang-bayang Parthenon, menyatakan bangsa Italia dan Yunani bersaudara dengan sejarah yang sama selama berabad-abad, dan bagaimana mereka sekarang bebas menentukan arah mereka sendiri sepanjang sejarah."
 BBA_italy_missiolinis.123.a: "\"Untuk kejayaan masa lalu dan masa depan"
 BBA_italy_missiolinis.131.t: "Bebaskan Ticino"
 BBA_italy_missiolinis.131.desc: "Sejak Hannibal melintasi Pegunungan Alpen dengan gajah-gajahnya, pegunungan tersebut telah menjadi jalan raya bagi orang-orang barbar yang langsung menuju jantung Italia. Duce telah lama ingin mengamankan jalur pegunungan utara dan ingin mengambil kesempatan untuk memasukkan penutur bahasa Italia di Ticino ke dalam Tanah Air mereka - menyatukan masyarakat Italia di mana pun mereka berada."
 BBA_italy_missiolinis.131.a: "Selamatkan orang-orang Italia di Ticino!"
 BBA_italy_missiolinis.132.t: "Pembebasan Ticino yang Gagal"
 BBA_italy_missiolinis.132.desc: "Duce tahu bahwa Ticino akan diperebutkan dengan keras oleh Swiss, namun kurangnya kemajuan membuatnya terguncang. Tidak lama setelah serangan kami terhenti, Duce mulai mencampuri rencana sang Jenderal dan mempertanyakan kompetensi mereka, yang tidak luput dari perhatian publik Italia."
 BBA_italy_missiolinis.132.a: "Kurangnya kemajuan sangat mengganggu"
 BBA_italy_missiolinis.133.t: "Pembebasan Ticino yang Berhasil"
 BBA_italy_missiolinis.133.desc: "Mussolini secara pribadi telah melakukan perjalanan ke Ticino untuk menyambut para penutur bahasa Italia di sana ke komunitas Italia yang lebih luas, memastikan bahwa masa depan cerah menanti mereka dan Italia secara keseluruhan. Dia juga menyatakan bahwa perbatasan utara sekarang telah diamankan dan Italia dapat mencegah orang-orang barbar yang mencoba melewati Pegunungan Alpen."
 BBA_italy_missiolinis.133.a: "Sebuah kemenangan gemilang"
 BBA_italy_missiolinis.201.t: "Memperkuat Kabinet Politik"
 BBA_italy_missiolinis.201.desc: "Menemukan orang yang tepat untuk tempat yang tepat selalu sulit dilakukan - terutama jika orang yang tepat tidak ada. Duce yakin bahwa agar Italia – dan fasisme – berhasil, ia harus mencari orang-orang yang cakap dan memenuhi syarat untuk mengisi Kabinet dan akan menunjuk seseorang untuk mencari orang-orang ini secara luas."
 BBA_italy_missiolinis.201.a: "Tidak ada kebutuhan bisnis yang terlewat"
 BBA_italy_missiolinis.202.t: "Kabinet Politik yang Disfungsional"
 BBA_italy_missiolinis.202.desc: "Kegagalan untuk memperluas kabinet politik secara memadai telah membuat Duce marah dan menyebut kabinet politik tersebut tidak berfungsi. Dia menuduh semua orang yang berada di dekatnya melakukan kebodohan dan kejahatan karena bekerja melawannya dan kehebatan yang ingin dia wujudkan untuk Italia."
 BBA_italy_missiolinis.202.a: "Sulit untuk dikelilingi oleh ketidakmampuan"
 BBA_italy_missiolinis.203.t: "Kabinet Politik yang Sukses"
 BBA_italy_missiolinis.203.desc: "Dalam pidatonya baru-baru ini di depan Kabinet Politik, Mussolini mengatakan bahwa hanya orang-orang Italia yang paling unggul yang layak bertugas di sana. Dia kemudian membual bagaimana dia tidak melakukan apa pun yang terlewat dalam pencarian untuk menemukan orang yang tepat untuk memperkuat Kabinet, dan ketabahannya akan bermanfaat bagi Italia dalam jangka panjang."
 BBA_italy_missiolinis.203.a: "Hanya yang terpintar dan terpintar"
 BBA_italy_missiolinis.211.t: "Perkuat Komando Tinggi Militer"
 BBA_italy_missiolinis.211.desc: "Kurangnya kompetensi dan pengalaman dalam komando tinggi militer adalah sesuatu yang cenderung ditunjukkan oleh Duce sejak Perang Italia-Abyssinian. Beliau ingin memperbaiki hal ini dengan mempromosikan kandidat-kandidat yang layak untuk menempati posisi teratas di militer guna memperkuat pemikiran strategis dan taktis kita dalam konflik-konflik yang akan datang."
 BBA_italy_missiolinis.211.a: "Ini harus diubah"
 BBA_italy_missiolinis.212.t: "Kurangnya Kompetensi Militer"
 BBA_italy_missiolinis.212.desc: "Khawatir perhatiannya akan berkurang jika dia harus mengambil alih tindakan militer secara pribadi, Duce tidak segan-segan mengeluh tentang kurangnya orang yang kompeten di militer. Ia yakin persoalan ini akan menjadi kejatuhan Italia jika keadaan semakin memburuk."
 BBA_italy_missiolinis.212.a: "Sulit untuk menemukan orang yang kompeten saat ini"
 BBA_italy_missiolinis.213.t: "Komando Tinggi Militer yang Efektif"
 BBA_italy_missiolinis.213.desc: "Dengan promosi jabatannya baru-baru ini di komando tinggi militer, Mussolini merasa lebih percaya diri terhadap kemampuan militer Italia, kata Duce dalam serangkaian pidatonya. Saat berbicara kepada berbagai cabang angkatan bersenjata, ia memuji keberanian dan kemampuan mereka, dan mengatakan kepada pasukan bahwa ia yakin akan keberhasilan mereka di masa depan."
 BBA_italy_missiolinis.213.a: "Kepemimpinan yang kompeten adalah kunci kesuksesan"
 BBA_italy_missiolinis.council: "Dewan Agung memiliki kekhawatiran yang lebih besar..."
 ITA_missiolinis_reroll_tt: "Dewan Agung Fasisme akan memastikan Mussolini berubah pikiran dan segera mengeluarkan perintah baru."
 BBA_italy_local_rulers.1.t: "$ETH_haile_selassie_gugsa$ Mendekati Pejabat Italia"
 BBA_italy_local_rulers.1.desc: "Haile Selassie Gugsa, seorang komandan tentara Abyssinian dan juga anggota keluarga Kekaisaran, telah mendekati kami dengan harapan dapat membuat kesepakatan. Ini sungguh momen yang luar biasa bagi kami dan momen yang memalukan bagi masyarakat Abyssinia. Meskipun kita dapat memanfaatkan kesempatan ini dan memanfaatkannya untuk keuntungan kita sendiri, sebaiknya kita ingat bahwa orang ini adalah pengkhianat di mata banyak orang Abyssinian; mendukungnya akan disertai dengan peringatan tertentu."
 BBA_italy_local_rulers.1.a: "Memberikan sejumlah konsesi mungkin akan memuaskan penduduk setempat."
 BBA_italy_local_rulers.1.b: "Menjadikan $ETH_haile_selassie_gugsa$ sebagai gubernur wilayah tersebut."
 BBA_italy_local_rulers.1.c: "$ETH_haile_selassie_gugsa$ dan pengikutnya harus ditundukkan."
 BBA_italy_local_rulers.1.d: "Tidak akan ada negosiasi dengan penguasa lokal mana pun."
 BBA_italy_local_rulers.2.t: "$ETH_abba_jofir$ Mendekati Pejabat Italia"
 BBA_italy_local_rulers.2.desc: "Selama penaklukan kami atas Addis Ababa, kami membebaskan mantan raja Jimma, Abba Jofir, yang bekerja sama dengan kami sebelum pecahnya perang. Dia kini datang kepada kami untuk mencari dukungan guna memulihkan sebagian kekuasaannya yang dulu. Ini mungkin bermanfaat bagi kita karena dia masih mempunyai pengaruh, tapi karena dia diketahui berkonspirasi dengan kita, banyak yang memandang dia sebagai pengkhianat juga."
 BBA_italy_local_rulers.2.a: "Memberikan sejumlah konsesi mungkin akan memuaskan penduduk setempat."
 BBA_italy_local_rulers.2.b: "Menjadikan $ETH_abba_jofir$ sebagai gubernur wilayah tersebut."
 BBA_italy_local_rulers.2.c: "$ETH_abba_jofir$ dan pengikutnya harus ditundukkan."
 BBA_italy_local_rulers.2.d: "Tidak akan ada negosiasi dengan penguasa lokal mana pun."
 BBA_italy_local_rulers.3.t: "$ETH_hailu_tekle_haymanot$ Mendekati Pejabat Italia"
 BBA_italy_local_rulers.3.desc: "Seorang bangsawan Abyssinian yang digulingkan, Hailu Tekle Haymanot, telah menghubungi kami dan menyatakan bahwa kami dapat memberikan manfaat satu sama lain. Dia menawarkan jasanya kepada kami sebagai imbalan atas posisi di pemerintahan kami di Abyssinia. Sebagai seorang mantan penguasa, hal ini mungkin bisa memenuhi tujuan kita, namun dengan menjadi seorang mantan penguasa, hal ini juga akan berdampak pada penduduk setempat, yang mungkin akan menentang pemerintahannya."
 BBA_italy_local_rulers.3.a: "Memberikan sejumlah konsesi mungkin akan memuaskan penduduk setempat."
 BBA_italy_local_rulers.3.b: "Menjadikan $ETH_hailu_tekle_haymanot$ sebagai gubernur wilayah tersebut."
 BBA_italy_local_rulers.3.c: "$ETH_hailu_tekle_haymanot$ dan pengikutnya harus ditundukkan."
 BBA_italy_local_rulers.3.d: "Tidak akan ada negosiasi dengan penguasa lokal mana pun."
 BBA_italy_local_rulers.4.t: "$ETH_seyoum_mengesha$ Mendekati Pejabat Italia"
 BBA_italy_local_rulers.4.desc: "Dalam kemenangan menakjubkan kami atas bangsa Abyssinia, kami berhasil menangkap salah satu komandan tentara terkemuka dan anggota keluarga Kekaisaran; Seyoum Mengesha. Kita diberitahu bahwa Kaisar Abyssinian Haile Selassie sangat menghormati pria ini. Kita bisa menggunakan tahanan ini untuk semakin mempermalukan kaisar dan mungkin menjamin kesetiaan rakyat. Dia tentu saja tidak mempunyai kekuatan nyata tetapi akan melakukan apa yang diperintahkan."
 BBA_italy_local_rulers.4.a: "Memberikan sejumlah konsesi mungkin akan memuaskan penduduk setempat."
 BBA_italy_local_rulers.4.b: "Menjadikan $ETH_seyoum_mengesha$ sebagai gubernur wilayah tersebut."
 BBA_italy_local_rulers.4.c: "$ETH_seyoum_mengesha$ dan pengikutnya harus ditundukkan."
 BBA_italy_local_rulers.4.d: "Tidak akan ada negosiasi dengan penguasa lokal mana pun."
 ITA_ends_event_chain_tt: "§RMengakhiri rantai acara§!."
 BBA_italy_air_accident.01.t: "Kematian Tragis $ITA_italo_balbo$"
 BBA_italy_air_accident.01.desc: "Marsekal Lapangan Italo Balbo telah ditembak jatuh oleh tembakan ramah di langit Libya. Kesalahan identifikasi menyebabkan baterai anti-udara melepaskan tembakan dan menembak jatuh pesawatnya dari langit. Jenderal Giuseppe Tellera, yang melakukan perjalanan dengan pesawat berbeda, selamat dari kecelakaan tersebut namun merasa bingung dengan pengalaman tersebut."
 BBA_italy_air_accident.01.a: "Sebuah pukulan telak..."
 BBA_italy_air_accident.02.t: "Kematian Tragis $ITA_giuseppe_tellera$"
 BBA_italy_air_accident.02.desc: "Setelah kesalahan identifikasi, pesawat Marsekal Italo Balbo diserang oleh baterai anti-udara di atas langit Libya. Untungnya, dia lolos tanpa cedera, tetapi Kepala Stafnya, Jenderal Giuseppe Tellera tidak seberuntung itu dan ditembak jatuh serta dibunuh. Marah, Balbo mendisiplinkan seluruh kompi - termasuk para petugas - dengan agak kasar."
 BBA_italy_air_accident.02.a: "Tragis..."
 BBA_italy_air_accident.03.t: "Tragedi Kebakaran Persahabatan Dapat Dihindari"
 BBA_italy_air_accident.03.desc: "Marsekal Lapangan Italo Balbo mendapat serangan dari baterai anti-udara setelah kesalahan identifikasi di langit Libya. Berhasil menghubungi pasukan darat dan menghindari serangan, Balbo membujuk awak antipesawat untuk berhenti menembak dan berhasil mendaratkan pesawatnya. Marsekal Lapangan dipuji karena keberaniannya dan tetap tenang dalam situasi panas."
 BBA_italy_air_accident.03.a: "Keberanian Balbo menyelamatkan hari ini!"
 BBA_italy_air_accident.11.t: "Kecelakaan Udara Tragis"
 BBA_italy_air_accident.11.desc: "Saat dalam perjalanan untuk memeriksa perbatasan Prancis, pesawat milik Panglima Angkatan Udara Aldo Pellegrini dan Jenderal Pietro Pintor mengalami masalah mesin. Pesawat itu jatuh, tidak meninggalkan seorang pun yang hidup di dalamnya."
 BBA_italy_air_accident.11.a: "[ROOT.GetNameDefCap] telah kehilangan dua petugas denda."
 BBA_italy_air_accident.12.t: "Kecelakaan Udara"
 BBA_italy_air_accident.12.desc: "Saat terbang menuju perbatasan Prancis, pesawat milik Panglima Angkatan Udara Aldo Pellegrini dan Jenderal Pietro Pintor mengalami masalah mesin dan mulai kehilangan ketinggian dengan cepat. Menghadapi kematian, Pellegrini mengambil kendali dan berhasil mendaratkan pesawat tersebut berkat keakrabannya dengan pesawat Savoia-Marchetti. Semua orang di dalamnya selamat, meski mengalami memar."
 BBA_italy_air_accident.12.a: "Keberuntungan ada bersama mereka!"
 ITA_pellegrini_promotion_tt: "Sifat\n$air_chief$ ditingkatkan dari §YSpecialist§! menjadi §YExpert§!."
 BBA_italy_naval_cooperation_programs.01.t: "Program Kerjasama Angkatan Laut Italia"
 BBA_italy_naval_cooperation_programs.01.desc: "Kami telah menerima tawaran dari [From.GetName] untuk mengikuti Program Kerjasama Angkatan Laut dengan mereka. Program semacam itu mungkin sangat berguna bagi kami, tetapi juga bermanfaat bagi angkatan laut [FROM.GetAdjective]."
 BBA_italy_naval_cooperation_programs.01.a: "Kesepakatan yang menguntungkan!"
 BBA_italy_naval_cooperation_programs.01.b: "Orang Italia tidak punya apa pun untuk ditawarkan kepada kita."
 BBA_italy_naval_cooperation_programs.02.t: "[FROM.GetNameDefCap] Bergabung dengan $ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.02.desc: "Tampaknya [From.GetName] telah membuat keputusan yang masuk akal dan memutuskan untuk bergabung dengan Program Kerja Sama Angkatan Laut kami. Hal ini tentunya akan menguntungkan kedua belah pihak dan memperkuat kemampuan kita!"
 BBA_italy_naval_cooperation_programs.02.a: "Mari kita manfaatkan para ahlinya!"
 BBA_italy_naval_cooperation_programs.03.t: "[FROM.GetNameDefCap] Menolak $ITA_naval_cooperation_program_research_group_name$"
 BBA_italy_naval_cooperation_programs.03.desc: "[FROM.GetName] dengan bodohnya menolak bergabung dengan Program Kerja Sama Angkatan Laut kita, mengira kesendirian adalah kekuatan, padahal orang bijak tahu bahwa kekuatan ada dalam jumlah."
 BBA_italy_naval_cooperation_programs.03.a: "Sebuah pilihan bodoh yang tidak disangka-sangka."
 BBA_italy_naval_cooperation_programs.04.t: "Manuver Gabungan dengan Angkatan Laut [FROM.GetAdjective]"
 BBA_italy_naval_cooperation_programs.04.desc: "[FROM.GetAdjective] menawarkan kita untuk ikut serta dalam latihan angkatan laut gabungan, dengan mengatakan bahwa hanya dengan mempersiapkan perang kita akan siap menghadapi musuh jika mereka datang."
 BBA_italy_naval_cooperation_programs.04.a: "Avanti!"
 BBA_italy_naval_cooperation_programs.04.b: "Orang Italia tidak punya apa pun untuk ditawarkan kepada kita."
 BBA_italy_naval_cooperation_programs.05.t: "[ROOT.GetAdjective]-[FROM.GetAdjective] Manuver Sedang Berlangsung"
 BBA_italy_naval_cooperation_programs.05.desc: "[FROM.GetName] telah menerima tawaran kami untuk melakukan manuver angkatan laut gabungan, menyadari perlunya bersiap dan siap jika musuh menyerang kami."
 BBA_italy_naval_cooperation_programs.05.a: "Luar biasa!"
 BBA_italy_naval_cooperation_programs.06.t: "[FROM.GetNameDefCap] Menolak Proposal kami"
 BBA_italy_naval_cooperation_programs.06.desc: "Kepicikan [FROM.GetName] sungguh mencengangkan! Menolak tawaran latihan angkatan laut gabungan untuk mempersiapkan armada kita dengan lebih baik hanya menunjukkan kesombongan mereka."
 BBA_italy_naval_cooperation_programs.06.a: "[FROM.GetLeader] belum memikirkan hal ini dengan baik..."
 BBA_italy_naval_cooperation_programs.07.t: "[ROOT.GetAdjective]-[FROM.GetAdjective] Manuver"
 BBA_italy_naval_cooperation_programs.07.desc: "Laksamana kami dengan senang hati melaporkan bahwa latihan angkatan laut kami baru-baru ini sukses besar! Kami memperoleh banyak wawasan baru dan lebih siap untuk operasi masa depan di laut lepas."
 BBA_italy_naval_cooperation_programs.07.a: "Saatnya mempraktikkan pembelajaran kita!"
 ITA_joint_maneuvers_with_country_remove_effect_tt: "Akibat setelah selesainya program manuver gabungan, dalam §Y[?ITA.ITA_joint_maneuvers_with_country_days]§! hari:"
 BBA_italy_naval_cooperation_programs.08.t: "[FROM.GetAdjective] Penawaran Pembelian Kapal Pendamping"
 BBA_italy_naval_cooperation_programs.08.desc: "[FROM.GetAdjective] telah mendekati kami dengan tawaran untuk menjual beberapa kapal pengawal mereka kepada kami. Beberapa dari kapal ini sudah agak tua dan usang, tapi mungkin kita masih bisa menggunakannya di angkatan laut kita."
 BBA_italy_naval_cooperation_programs.08.a: "Ini akan memperkuat armada [ROOT.GetAdjective]!"
 BBA_italy_naval_cooperation_programs.08.b: "Kami tidak membutuhkan potongan [ITA.GetAdjective]."
 BBA_italy_naval_cooperation_programs.09.t: "[FROM.GetNameDefCap] Setuju untuk Membeli Kapal Pengawal kami"
 BBA_italy_naval_cooperation_programs.09.desc: "[FROM.GetName] telah setuju untuk membeli beberapa kapal pengawal kami yang sudah tua dan usang. Mereka pasti sangat putus asa jika memilih kapal-kapal kuno ini. Namun demikian, menjual dan menghapusnya dari layanan kami akan memperkuat kemampuan armada kami secara keseluruhan dengan membuatnya lebih cepat dan lincah."
 BBA_italy_naval_cooperation_programs.09.a: "Banyak sekali!"
 BBA_italy_naval_cooperation_programs.10.t: "[FROM.GetNameDefCap] Menolak Kapal Pengawal kami"
 BBA_italy_naval_cooperation_programs.10.desc: "[FROM.GetName] tidak begitu mudah diyakinkan untuk membeli kapal pengawal kami yang tua dan usang seperti yang kami harapkan. Kita harus beralih ke tempat lain untuk melepaskan diri dari kapal-kapal usang ini."
 BBA_italy_naval_cooperation_programs.10.a: "Kami akan mencari pembeli lain."
 ITA_cooperation_programs_deal_others_tt: "([ROOT.GetEscortShipsSender]): Memindahkan §Y2 Kapal Perusak Kelas Curtatone§! dan §Y2 Kapal Perusak Kelas Maestrale§! ke [ROOT.GetEscortShipsReceiver]."
 ITA_cooperation_programs_deal_root_tt: "[ROOT.GetFlag]§Y[ROOT.GetName]§!"
 ITA_cooperation_programs_deal_from_tt: "[FROM.GetFlag]§Y[FROM.GetName]§!"
 BBA_italy_naval_cooperation_programs.11.t: "[ITA.GetNameDefCap] Menawarkan Penghancur"
 BBA_italy_naval_cooperation_programs.11.desc: "[FROM.GetAdjective] telah menawarkan dua Kapal Perusak lama mereka kepada kami. Gratis. Meskipun kapal-kapal ini mungkin sudah ketinggalan zaman, mereka masih bisa melayani angkatan laut kita dengan baik. Ini sungguh sebuah sikap yang murah hati."
 BBA_italy_naval_cooperation_programs.11.a: "Kami menghargai sikapnya!"
 BBA_italy_naval_cooperation_programs.12.t: "Kapal Perusak Kelas Aquila Kami Tiba di Spanyol"
 BBA_italy_naval_cooperation_programs.12.desc: "Angkatan Laut [FROM.GetAdjective] telah menerima Kapal Penghancur kami, yang dengan murah hati kami berikan kepada mereka. Gratis. Mudah-mudahan bisa dimanfaatkan dengan baik."
 BBA_italy_naval_cooperation_programs.12.a: "Tiba!"
 BBA_italy_naval_cooperation_programs.13.t: "[FROM.GetNameDefCap] Menolak Penghancur kami"
 BBA_italy_naval_cooperation_programs.13.desc: "[FROM.GetAdjective] dengan agak angkuh menolak pemberian kami berupa dua Penghancur. Gratis. Sungguh hebat armada mereka untuk menolak tawaran seperti itu!"
 ITA_cede_aquila_class_destroyers_tt: "([ROOT.GetEscortShipsSender]): Memindahkan §Y2 Kapal Penghancur Kelas Aquila§! ke [ROOT.GetEscortShipsReceiver]."
 BBA_italy_naval_cooperation_programs.14.t: "[ITA.GetName] Ekspor Kapal Selam Cebol"
 BBA_italy_naval_cooperation_programs.14.desc: "[FROM.GetAdjective] telah menanyakan minat kami untuk membeli lima kapal selam cebol. Mereka memiliki kegunaan yang terbatas namun dapat memenuhi kebutuhan kita dan memperluas kemampuan angkatan laut kita."
 BBA_italy_naval_cooperation_programs.14.a: "Mereka terbukti berguna bagi angkatan laut kita."
 BBA_italy_naval_cooperation_programs.14.b: "Tidak tertarik, lanjutkan."
 BBA_italy_naval_cooperation_programs.15.t: "[FROM.GetName] Membeli Kapal Selam Cebol kami"
 BBA_italy_naval_cooperation_programs.15.desc: "Angkatan Laut [FROM.GetAdjective] melihat beberapa keuntungan dengan kapal selam cebol kami dan memutuskan untuk membelinya. Ini sungguh merupakan momen yang luar biasa baik bagi para insinyur negara kita maupun bagi Angkatan Laut kita sendiri."
 BBA_italy_naval_cooperation_programs.15.a: "Luar biasa!"
 BBA_italy_naval_cooperation_programs.16.t: "[FROM.GetName] Menolak tawaran kami"
 BBA_italy_naval_cooperation_programs.16.desc: "Angkatan Laut [FROM.GetAdjective] tidak melihat manfaat apa pun dengan membeli kapal selam cebol kami. Ini karena mereka berpikiran sempit dan sejujurnya berpikiran sederhana karena kapal selam kita memiliki kualitas terbaik."
 BBA_italy_naval_cooperation_programs.17.t: "[ITA.GetAdjective] Kapal Selam Cebol Tiba di [ROOT.GetName]"
 BBA_italy_naval_cooperation_programs.17.desc: "Kapal selam cebol [FROM.GetAdjective] akhirnya tiba untuk meningkatkan kemampuan angkatan laut kita! Ini pasti akan menjadi tambahan yang bagus untuk armada kami dan kami akan memanfaatkannya dengan baik."
 BBA_italy_naval_cooperation_programs.17.a: "Mari kita manfaatkan mereka!"
 BBA_italy_human_torpedo_raid.1.t: "Serangan Terhadap [?ITA.ITA_raided_state_var.GetName]"
 BBA_italy_human_torpedo_raid.1.desc: "Orang Italia berhasil menghindari pertahanan pelabuhan kami di [?ITA.ITA_raided_state_var.GetName] dan menyusup ke pangkalan angkatan laut di sana dengan kapal yang sangat kecil untuk melakukan serangan terhadap kapal kami yang berlabuh di sana. Meskipun penyerbuan tersebut tidak menenggelamkan satu pun kapal, namun berhasil merusak kapal-kapal tersebut sehingga memerlukan waktu beberapa saat untuk memperbaikinya."
 BBA_italy_human_torpedo_raid.1.a: "Sangat disayangkan"
 ITA_human_torpedo_raid_tt: "Penggerebekan ini hanya dapat dilakukan satu kali saja."
 ITA_human_torpedo_effect_tt: "Akan merusak unit angkatan laut musuh yang berlabuh di negara bagian tersebut."
 ITA_human_torpedo_target_effect_tt: "Unit angkatan laut yang rusak berlabuh di [?ITA.ITA_raided_state_var.GetName]."
 BBA_italy_colonial_management.1.t: "Polisi Kolonial"
 BBA_italy_colonial_management.1.desc: "Kepemilikan kolonial kita telah berkembang pesat sejak terbentuknya negara kita, kurang dari satu abad yang lalu. Namun, pertumbuhan ini mulai membebani tenaga kerja kami. Namun ada cara untuk mengatasi keterbatasan ini, dengan menggunakan pasukan polisi setempat seperti Meharisti, Savari, Spahi, dan lainnya. Merekrut kelompok-kelompok ini akan mengurangi beban pasukan kita dan mereka mendapat keuntungan karena merupakan penduduk asli tanah mereka, dengan semua hal yang diperlukan."
 BBA_italy_colonial_management.1.a: "Rekrut mereka!"
 BBA_italy_colonial_management.1.b: "Kami punya rencana lain"
 BBA_italy_colonial_management.1_do_not_apply_tt: "Hukum pekerjaan §Y$colonial_police$§! akan tersedia di [GetAfricanStates][GetAndOrNothing][GetAlbanianStates] terkontrol."
 BBA_italy_colonial_management_african_states: "negara-negara Afrika"
 BBA_italy_colonial_management_albanian_states: "negara bagian Albania"
 BBA_italy_colonial_management_and: "dan"
 BBA_italy_bop.1.t: "Jatuhnya [?ITA.ITA_lost_core.GetName]"
 BBA_italy_bop.1.desc: "Kami telah kehilangan [?ITA.ITA_lost_core.GetName] dari musuh! Hal ini tentu saja mengguncang kepercayaan masyarakat Italia terhadap upaya perang kami dan bahkan meningkatkan suara untuk perundingan damai. Pergantian peristiwa ini telah membuat banyak orang kesal, dan orang-orang mencari seseorang, siapa pun, untuk disalahkan. Kita harus mengambil kembali inisiatif dan mengusir kekuatan musuh dari Italia!"
 BBA_italy_bop.1.a: "Ini adalah sebuah bencana!"
 ITA_losing_cores_tt: "Efek akan diterapkan setiap kali [ROOT.GetName] kehilangan kendali atas §Ystatus inti§! kepada musuh."
 BBA_italy_bop.2.t: "Jatuhnya [?ITA.ITA_lost_colony.GetName]"
 BBA_italy_bop.2.desc: "Pasukan musuh telah menguasai [?ITA.ITA_lost_colony.GetName], mengejutkan orang Italia di mana pun! Masyarakat mendapat kesan bahwa gelombang perang akan menguntungkan kita, atau setidaknya dalam waktu dekat akan menguntungkan kita. Meskipun ini jelas merupakan sebuah kemunduran, dengan perencanaan dan ketabahan yang baik kita pasti akan mendapatkan kembali [?ITA.ITA_lost_colony.GetName]!"
 BBA_italy_bop.2.a: "Kami akan bangkit kembali!"
 ITA_losing_colonies_tt: "Efek akan diterapkan setiap kali [ROOT.GetName] kehilangan kendali atas §Ystatus non-inti§! kepada musuh, selama nilainya lebih rendah dari §Y30%§! terhadap §Y$ITA_grand_council_side$§!."
 BBA_italy_bop.3.t: "Kami telah merebut kembali [?ITA.ITA_reclaimed_core.GetName]"
 BBA_italy_bop.3.desc: "Pasukan kita yang menang telah merebut kembali [?ITA.ITA_reclaimed_core.GetName], meningkatkan semangat masyarakat Italia di mana pun! Ini bisa menjadi momen ketika kita membalikkan keadaan perang dan mendorong musuh keluar dari [ITA.GetNameDef] yang kita cintai."
 BBA_italy_bop.3.a: "Arus pasang surut menguntungkan kita!"
 ITA_reclaiming_cores_tt: "Efek akan diterapkan setiap kali [ROOT.GetName] mendapatkan kembali §Ystatus inti§! dari musuh."
 BBA_italy_council_deposes_duce.1.t: "Menggulingkan [?ITA.ITA_var_deposed_leader.GetName]"
 BBA_italy_council_deposes_duce.1.desc: "Untuk menyelamatkan Italia dari kehancuran, dan untuk melestarikan sistem fasis, kita harus melakukan hal yang tidak terpikirkan; hapus [?ITA.ITA_var_deposed_leader.GetName] dari kekuasaan! Ketidakmampuan dan ketidakmampuannya telah lama membebani negara kita dan kemajuannya. Adalah tugas kita untuk menjaga masyarakat [FROM.GetAdjective] dan masa depan mereka!"
 BBA_italy_council_deposes_duce.1.a: "Demi kebaikan yang lebih besar"
  BBA_italy_council_deposes_duce.2.t: "Dewan Besar mempertimbangkan Intervensi Langsung"
  BBA_italy_council_deposes_duce.2.desc: "Karena cobaan dan kesengsaraan yang dihadapi oleh [ROOT.GetLeader] baru-baru ini, Dewan Agung telah mulai merencanakan untuk mengambil alih kekuasaan dan merebutnya untuk mereka sendiri, sebuah langkah tidak populer yang pada akhirnya bahkan dapat menyebabkan perang saudara di negara kita. Kita harus melakukan segala daya kita untuk memitigasi risiko terjadinya hal ini."
  BBA_italy_council_deposes_duce.2.a: "Kita harus mengambil tindakan drastis untuk memastikan hal ini tidak terjadi!"
  ITA_grand_council_considers_intervention_tt: "Jika kekuasaan semakin berpindah ke tangan §YDewan Besar§!, mereka dapat sepenuhnya §RMerebut Kekuasaan§! dari §Y[ROOT.GetLeader]!§!"
 BBA_italy_civil_war.1.t: "Perang Saudara Italia"
 BBA_italy_civil_war.1.desc: "Italia kita tercinta telah terpecah belah akibat tekanan Perang! Pihak-pihak yang berseberangan kini mulai terbentuk, untuk memperebutkan apa yang tersisa dari bangsa kita dan untuk memperebutkan cita-cita apa yang akan dipegang Italia di masa depan. Pilihan sulit akan menghadang kita semua, namun kita harus bertahan dan tekun agar kita bisa berkembang lagi."
 BBA_italy_civil_war.1.a: "Kami membutuhkan tangan yang teguh!"
 BBA_italy_civil_war.1.b: "Kita membutuhkan stabilitas dan tradisi!"
 BBA_italy_civil_war.1.c: "Rangkullah revolusi rakyat!"
 BBA_italy_civil_war.1.d: "Biarkan Kebebasan berkuasa!"
 BBA_italy_civil_war.2.t: "$ITA_fronte_militare_clandestino$"
 BBA_italy_civil_war.2.desc: "Tampaknya kelompok perlawanan yang baru terbentuk menyebabkan kerusakan di belakang garis depan kita. Dari sedikit yang dapat kami ketahui tentang kelompok tersebut, tampaknya sebagian besar mereka terdiri dari mantan perwira Angkatan Darat yang telah berpindah pihak. Upaya untuk memancing mereka keluar sedang dilakukan, namun saat ini kita hanya memiliki sedikit informasi yang dapat mengantisipasi langkah mereka selanjutnya."
 BBA_italy_civil_war.2.a: "Mereka tidak bisa bersembunyi selamanya"
 BBA_italy_civil_war.3.t: "$ITA_gappisti$"
 BBA_italy_civil_war.3.desc: "Kami telah menerima informasi bahwa beberapa kelompok kecil partisan komunis, yang menamakan diri mereka Gappisti, telah melakukan beberapa operasi tabrak lari yang berhasil di wilayah kami. Mereka terlatih dan bersenjata, sehingga kami menduga mereka didanai oleh [FROM.GetName]."
 BBA_italy_civil_war.3.a: "Komunitas Pengkhianat!"
 BBA_italy_civil_war.4.t: "Tindakan Anti-Partisan di [FROM.GetName]"
 BBA_italy_civil_war.4.desc: "Kelompok perlawanan dan partisan di [FROM.GetName] yang bekerja tanpa kenal lelah untuk membebaskan seluruh Italia telah sukses! Faktanya, rezim jahat yang masih memegang kekuasaan di sana terpaksa melancarkan serangkaian tindakan anti-partisan yang keras. Hal ini akan mempersulit agen kami untuk beroperasi di [FROM.GetName], namun perjuangan untuk Italia yang merdeka terus berlanjut!"
 BBA_italy_civil_war.4.a: "Morto per la liberta!"
 BBA_italy_civil_war.5.t: "[FROM.GetAdjective] Tuntutan Kemerdekaan"
 BBA_italy_civil_war.5.desc: "Sekutu dan warga Italia kami telah meminta agar kami dibebaskan dari pemerintahan kami dan diberikan kemerdekaan penuh. Kami pertama-tama mengambil kendali atas [FROM.GetName] untuk memastikan bahwa front Italia tidak runtuh sepenuhnya, tapi mungkin sudah tiba waktunya untuk memberi mereka kebebasan."
 BBA_italy_civil_war.5.a: "Beri mereka kemerdekaan"
 BBA_italy_civil_war.5.b: "Tolak permohonan mereka untuk kebebasan"
 BBA_italy_civil_war.6.t: "Kemerdekaan untuk [ROOT.GetNameDef]"
 BBA_italy_civil_war.6.desc: "Sekutu kami - dan tuan sementara -, [FROM.GetName], telah mendengarkan seruan kami untuk kebebasan dan setuju untuk mengembalikan kemerdekaan kami! Ini adalah peristiwa penting bagi negara kita yang dilanda perang. Sekarang kita dapat mulai membangun kembali dengan sungguh-sungguh dan jalan menuju unifikasi dapat dimulai."
 BBA_italy_civil_war.6.a: "Penguasa atas nasib kita sendiri sekali lagi"
 BBA_italy_civil_war.7.t: "[FROM.GetName] Menolak Tuntutan Kemerdekaan Kami"
 BBA_italy_civil_war.7.desc: "Tuan [FROM.Adjective] kami yang kejam telah menolak permintaan kemerdekaan kami yang jujur! Meskipun mereka berguna dalam memenangkan perang saudara, mereka tidak punya hak untuk mengatur nasib kita atau ikut campur dalam politik kita lagi. Ketika waktunya tepat, tugas kita adalah menyingkirkan mereka dari tanah kita dan merampas kebebasan kita sendiri!"
 BBA_italy_civil_war.7.a: "Mereka akan menyesalinya!"
 BBA_italy_civil_war.7.b: "Kami akan puas..."
 ITA_we_will_transfer_the_following_states_tt: "Negara bagian berikut akan ditransfer ke §Y[RDS.GetFlag][RDS.GetNameDef]§!:"
 ITA_we_keep_our_occupied_states_tt: "Kami akan tetap memegang kendali atas negara-negara yang kami duduki saat ini."
 BBA_italy_civil_war_fascist_tt: "Kami akan tetap mengontrol §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!. §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! menjadi §Y$RSI_DEF$§!. [GetRsiOverlord]"
 BBA_italy_civil_war_monarchist_tt: "Kami akan menjadi §Y$RDS_DEF$§!, pihak pemberontak dalam perang saudara dengan ideologi §Y$neutrality$§!. [GetRdsOverlord]"
 BBA_italy_civil_war_communist_tt: "Kami akan menjadi §Y$RDS_DEF$§!, pihak pemberontak dalam perang saudara dengan ideologi §Y$communism$§!. [GetRdsOverlord]"
 BBA_italy_civil_war_democratic_tt: "Kami akan menjadi §Y$RDS_DEF$§!, pihak pemberontak dalam perang saudara dengan ideologi §Y$democratic$§!. [GetRdsOverlord]"
 ITA_rsi_overlord_tt: "Kita akan menjadi subjek §Y[?ITA_rsi_overlord.GetFlag][?ITA_rsi_overlord.GetNameDef]§!."
 ITA_rds_overlord_tt: "Kita akan menjadi subjek §Y[?ITA_rds_overlord.GetFlag][?ITA_rds_overlord.GetNameDef]§!."
 BBA_italy_civil_war.100.t: "Wilayah Italia yang diduduki"
 BBA_italy_civil_war.100.desc: "Kita mendapati diri kita mengendalikan wilayah Italia, berjuang bersama sekutu Italia. Kita bisa membebaskan lebih banyak pasukan kita dan mengarahkan mereka ke tempat lain dengan menyerahkan wilayah ini kepada [RDS.GetName]."
 BBA_italy_civil_war.100.a: "Pindahkan wilayahnya"
 BBA_italy_civil_war.100.b: "Pertahankan wilayah yang diduduki"
 BBA_italy_civil_war.101.t: "[FROM.GetName] Menyerahkan Wilayah Italia"
 BBA_italy_civil_war.101.desc: "Pemimpin [FROM.GetName] yang bijaksana, [FROM.GetLeader], telah dengan murah hati mengembalikan kendali atas wilayah Italia kepada kami! Hal ini tidak hanya merupakan dorongan besar bagi moral pasukan, tetapi juga akan meningkatkan kemampuan kita dan memperkuat upaya kita untuk membebaskan seluruh Italia."
 BBA_italy_civil_war.101.a: "Avanti!"
 BBA_italy_civil_war.300.desc: "Upaya kami untuk menyatukan masyarakat [FROM.Adjective] melawan fasisme telah mencapai puncaknya! Kita tidak bisa lagi berdiam diri dan menyaksikan negara kita yang indah ini mengering. Dengan kekuatan yang kita kumpulkan, kita sekarang mempunyai sarana untuk menggulingkan rezim fasis untuk selamanya dan membebaskan seluruh Italia dari tiraninya!"
 BBA_italy_interaction_events.1.t: "[ITA.GetLeader] Tuntutan [846.GetName]"
 BBA_italy_interaction_events.1.desc: "Dalam tindakan yang benar-benar tidak terduga dan keterlaluan, pemimpin Italia [ITA.GetLeader] telah mencemarkan netralitas kita yang sudah lama ada dengan memberikan ultimatum kepada kita. Dalam dua minggu, kita harus menyerahkan wilayah [846.GetName] kepada Italia, atau kita akan berperang. Bagaimana seharusnya kita menanggapinya?"
 BBA_italy_interaction_events.1.a: "Itu adalah satu titik lemah yang perlu kita pertahankan"
 BBA_italy_interaction_events.1.b: "Kami ingin melihat mereka mencobanya!"
 BBA_italy_interaction_events.2.t: "Lipatan [SWI.GetName] Pengecut"
 BBA_italy_interaction_events.2.desc: "Presiden [SWI.GetNameDef] hari ini mengumumkan berakhirnya sebuah era di negara ini. Mereka akan menyerahkan wilayah Italia [846.GetName] kepada kami, dan melepaskan klaim mereka atas kota-kota berbahasa Italia mana pun di wilayah tersebut. Hari ini menandai pengurangan ukuran dan nilai-nilai multi-etnis [SWI.GetName], karena mereka juga kemudian mencabut bahasa Italia sebagai bahasa resmi."
 BBA_italy_interaction_events.2.a: "Sempurna!"
 BBA_italy_interaction_events.3.t: "[SWI.GetNameDef] Berdiri Menantang!"
 BBA_italy_interaction_events.3.desc: "Negara [SWI.GetName] hari ini mengumumkan bahwa mereka akan mencabut netralitas mereka dengan menentang tuntutan kami untuk mengembalikan [846.GetName] ke dunia Italia. Karena pilihan bodoh ini, kita tidak punya pilihan selain menghancurkan sistem Kanton Swiss secara menyeluruh."
 BBA_italy_interaction_events.3.a: "Mobilisasi Divisione Alpini!"
 BBA_italy_interaction_events.4.t: "Tuntutan untuk Menobatkan Pangeran Italia"
 BBA_italy_interaction_events.4.desc: "Kami telah menerima tuntutan dari [ITA.GetLeader] untuk secara resmi menobatkan pangeran Italia yang dikenal sebagai pangeran Aimone, raja Tomislav II dari Kroasia. Jika kami menerima tuntutan ini, kami pasti akan kehilangan sebagian kemerdekaan kami, namun mungkin ada baiknya jika kami mencegah agresi Italia dalam waktu dekat."
 BBA_italy_interaction_events.4.a: "Dan dia akan menjadi Raja Tomislav!"
 BBA_italy_interaction_events.4.b: "Orang Italia akan menemui ajalnya di tepi Dalmatia"
 BBA_italy_interaction_events.5.t: "Penobatan Pangeran Aimone"
 BBA_italy_interaction_events.5.desc: "Lonceng berbunyi di Zagreb hari ini, saat orang Italia yang sebelumnya dikenal sebagai pangeran Aimone dinobatkan sebagai Tomislav yang kedua dari Kroasia. Pengaruh kami kini akan meluas hingga ke Balkan, seiring dengan semakin dekatnya masa kejayaan kami."
 BBA_italy_interaction_events.5.a: "Bellissimo!"
 BBA_italy_interaction_events.6.t: "Aimone Berhenti di Perbatasan Kroasia"
 BBA_italy_interaction_events.6.desc: "Pangeran Aimone telah kembali kepada kami, dan melaporkan bahwa dia dihentikan dan ditolak di perbatasan Kroasia dalam perjalanan menuju penobatannya di Zagreb. Jelas bagi kami bahwa Kroasia tidak punya apa-apa untuk ditawarkan kepada kami, dan pendudukan militer adalah satu-satunya pilihan bagi mereka di masa depan."
 BBA_italy_interaction_events.6.a: "Perang itu!"
 BBA_italy_interaction_events.7.t: "Ketua Komite Nasional yang Baru"
 BBA_italy_interaction_events.7.desc: "Italia telah menugaskan [MNT.GetLeader] sebagai Ketua Komite Nasional yang baru. Ini pasti akan memperkuat rezim kita."
 BBA_italy_interaction_events.7.a: "Memang"
 BBA_italy_interaction_events.8.t: "[ITA.GetName] Menuntut Pendudukan Dalmatia"
 BBA_italy_interaction_events.8.desc: "[ITA.GetLeader] dari [ITA.GetNameDef] hari ini telah mengirimkan ultimatum kepada kami yang menuntut kami untuk memberikan [ITA.GetName] pendudukan wilayah Dalmatia. Jika kita tidak mematuhi tuntutan [ITA.GetLeader], kemungkinan besar kita akan menghadapi konflik militer."
 BBA_italy_interaction_events.8.a: "Mereka bisa memilikinya"
 BBA_italy_interaction_events.8.b: "Menurut mereka, siapakah mereka?"
 BBA_italy_interaction_events.9.t: "[FROM.GetName] Menerima Permintaan kami"
 BBA_italy_interaction_events.9.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah dengan senang hati menerima tuntutan kami untuk menduduki Dalmatia, dan kemudian menyerahkan wilayah tersebut kepada kami. Mereka lebih suka menenangkan kami daripada melawan kami, yang hanya akan membantu memajukan tujuan Italia di Balkan."
 BBA_italy_interaction_events.9.a: "Semua sesuai rencana"
 BBA_italy_interaction_events.10.t: "[FROM.GetLeader] yang Bodoh Telah Menolak Ultimatum kami"
 BBA_italy_interaction_events.10.desc: "[FROM.GetLeader] yang bodoh dari [FROM.GetNameDef] telah menyangkal hak kita untuk mendapatkan tanah liat, dan sekarang saatnya untuk menjatuhkan [FROM.GetName], dalam satu serangan cepat. Ini pasti akan mengamankan klaim kami atas Dalmatia dalam waktu dekat."
 BBA_italy_interaction_events.10.a: "Lalu paksakan"
 BBA_italy_interaction_events.11.t: "[ITA.GetName] Mengklaim Tahta Montenegro"
 BBA_italy_interaction_events.11.desc: "[ITA.GetLeader] telah menuntut agar takhta Montenegro diserahkan kepada negara Italia, dan agar mahkota-mahkota tersebut disatukan di bawah satu bendera. Jelas ini sedikit khayalan, meski tidak terlalu jauh dari kenyataan, karena Ratu Italia adalah orang Montenegro. Bagaimana kita harus menjawabnya?"
 BBA_italy_interaction_events.11.a: "Mereka bisa memilikinya"
 BBA_italy_interaction_events.11.b: "Menurut mereka, apa yang memberi mereka hak?"
 BBA_italy_interaction_events.12.t: "[FROM.GetName] Berikan kami Mahkota Montenegro"
 BBA_italy_interaction_events.12.desc: "[FROM.GetLeader] telah menyatakan bahwa mereka tidak punya alasan untuk menolak keinginan kami, dan bahwa wilayah Montenegro akan segera diserahkan kepada kami. Hari ini adalah hari yang menyenangkan bagi bangsa Italia!"
 BBA_italy_interaction_events.12.a: "Sempurna!"
 BBA_italy_interaction_events.13.t: "[FROM.GetName] Menolak Menyerahkan Montenegro"
 BBA_italy_interaction_events.13.desc: "[FROM.GetLeader] telah mengumumkan bahwa mereka tidak akan menjalin hubungan diplomatik lebih lanjut dengan kami, dan bahwa kami harus segera mencabut klaim kami atas takhta Montenegro. Tidak bisa dimaafkan, tidak bisa diterima!"
 BBA_italy_interaction_events.13.a: "Menyedihkan!"
 BBA_italy_interaction_events.14.t: "[ITA.GetName] Menuntut Demiliterisasi Penuh di Anatolia Barat"
 BBA_italy_interaction_events.14.desc: "[ITA.GetLeader] telah mengeluarkan tuntutan jaminan keamanan antara kedua negara, dan hal ini cukup adil. Bagian yang lebih keterlaluan adalah bahwa [ITA.GetLeader] juga mengharuskan kita melakukan demiliterisasi sepenuhnya baik [342.GetName] maupun [339.GetName], yang dapat membahayakan keamanan kita, karena ini berarti kita tidak dapat menyiapkan posisi pertahanan awal jika kita diserang oleh [ITA.GetName] atau sekutunya."
 BBA_italy_interaction_events.14.a: "Lagipula kami tidak ada gunanya menempatkan pasukan di sana"
 BBA_italy_interaction_events.14.b: "Ini berarti kita tidak bisa membela diri!"
 BBA_italy_interaction_events.15.t: "[FROM.GetName] Sesuai dengan Permintaan kami"
 BBA_italy_interaction_events.15.desc: "[FROM.GetName] telah menyetujui tuntutan kami dan memilih untuk mendemiliterisasi Anatolia bagian barat sepenuhnya. Ini berarti bahwa mereka akan jauh lebih lemah, dan tidak mempunyai cara untuk melakukan perlawanan awal jika kita menyerang mereka."
 BBA_italy_interaction_events.15.a: "Mereka tidak akan pernah melihatnya datang"
 BBA_italy_interaction_events.16.t: "[FROM.GetName] Menyangkal Hak Kami untuk Merasa Aman!"
 BBA_italy_interaction_events.16.desc: "[FROM.GetName] telah menolak permintaan persahabatan kami untuk jaminan keamanan, dan menolak demiliterisasi [342.GetName] dan [339.GetName]. Hal ini sangat keterlaluan dan harus ditangani dengan caranya sendiri."
 BBA_italy_interaction_events.16.a: "Mereka tidak memberi kita pilihan"
 BBA_italy_interaction_events.17.t: "[ITA.GetName] Menyerahkan [45.GetName] ke [HUN.GetName]"
 BBA_italy_interaction_events.17.desc: "Tuan kami [ITA.GetName] hari ini memutuskan untuk menyerahkan wilayah [45.GetName] kepada Hongaria, yang kami kendalikan. Hal ini untuk memperkuat hubungan antara negara Italia dan Hongaria, dan tidak banyak yang dapat dilakukan mengenai hal ini. Namun kami akan mengajukan protes diplomatik kecil-kecilan, meskipun para petinggi tidak mau membacanya."
 BBA_italy_interaction_events.17.a: "Kami tidak bisa berbuat banyak mengenai hal ini..."
 BBA_italy_interaction_events.18.t: "Italia Mendekati kami dengan Penawaran"
 BBA_italy_interaction_events.18.desc: "[ITA.GetNameDef] telah mendekati kami dengan tawaran yang menggiurkan. Mereka menawarkan kita kepemilikan atas Rhodes dan pulau-pulau Dodecanese sebagai imbalan atas aliansi dengan mereka. Ini adalah tawaran yang sepertinya terlalu bagus untuk menjadi kenyataan, namun sebenarnya tidak. Apa yang harus kita lakukan?"
 BBA_italy_interaction_events.18.a: "Kita selangkah lebih dekat menuju reunifikasi Yunani!"
 BBA_italy_interaction_events.18.b: "Kami tidak akan tunduk pada orang Italia, apa pun kondisinya!"
 BBA_italy_interaction_events.19.t: "[GRE.GetNameDef] Menerima Penawaran kami"
 BBA_italy_interaction_events.19.desc: "Pemerintah Yunani hari ini mengumumkan bahwa mereka telah menerima tawaran kami dan akan memulai kerja sama militer sesegera mungkin, dengan imbalan kepemilikan pulau Dodecanese. Kita akan melihat ke mana hal ini membawa kita."
 BBA_italy_interaction_events.19.a: "Dan aliansi yang akan kita miliki"
 BBA_italy_interaction_events.20.t: "[GRE.GetNameDef] Dengan tidak berterima kasih telah Menolak Tawaran kami"
 BBA_italy_interaction_events.20.desc: "Para pengkhianat Yunani telah menolak tawaran kami untuk menjual pulau-pulau itu kepada mereka sebagai imbalan atas aliansi. Hal ini hanya menunjukkan ketidakmampuan dan kelemahan pemerintah mereka."
 BBA_italy_interaction_events.20.a: "Kita lebih baik tanpa mereka"
 BBA_italy_interaction_events.21.t: "Italia Mendekati kami dengan Penawaran"
 BBA_italy_interaction_events.21.desc: "[ITA.GetNameDef] telah mendekati kami dengan tawaran yang menggiurkan. Mereka menawarkan kita kepemilikan atas Rhodes dan pulau-pulau Dodecanese sebagai imbalan atas aliansi dengan mereka. Ini adalah tawaran yang sepertinya terlalu bagus untuk menjadi kenyataan, namun sebenarnya tidak. Apa yang harus kita lakukan?"
 BBA_italy_interaction_events.21.a: "Ambillah itu, Yunani! Kami mendapatkannya terlebih dahulu!"
 BBA_italy_interaction_events.21.b: "Kami tidak akan tunduk pada orang Italia, apa pun kondisinya!"
 BBA_italy_interaction_events.22.t: "[TUR.GetNameDef] Menerima Penawaran kami"
 BBA_italy_interaction_events.22.desc: "Pemerintah Turki hari ini mengumumkan bahwa mereka telah menerima tawaran kami dan akan memulai kerja sama militer sesegera mungkin, dengan imbalan kepemilikan pulau Dodecanese. Kita akan melihat ke mana hal ini membawa kita."
 BBA_italy_interaction_events.22.a: "Dan aliansi yang akan kita miliki"
 BBA_italy_interaction_events.23.t: "[TUR.GetNameDef] Dengan tidak berterima kasih telah Menolak Tawaran kami"
 BBA_italy_interaction_events.23.desc: "Para pengkhianat Turki telah menolak tawaran kami untuk menjual pulau-pulau tersebut kepada mereka sebagai imbalan atas aliansi. Hal ini hanya menunjukkan ketidakmampuan dan kelemahan pemerintah mereka."
 BBA_italy_interaction_events.23.a: "Kita lebih baik tanpa mereka"
 BBA_italy_interaction_events.24.t: "Upaya Jerman untuk Anschluss Austria"
 BBA_italy_interaction_events.24.desc: "Negara Jerman yang keji sedang mencoba untuk ikut campur dalam politik Austria dan memasukkan negara tersebut ke dalam wilayah mereka sendiri. Kami sebelumnya telah memberikan jaminan kepada mereka, dan oleh karena itu masyarakat kami mengharapkan kami untuk membela Jerman demi mereka. Kami mungkin juga bisa meminta bantuan Inggris dan Prancis. Apa yang harus kita lakukan?"
 BBA_italy_interaction_events.24.a: "Kita bisa mengalahkan mereka sendirian!"
 BBA_italy_interaction_events.24.b: "Mungkin ada baiknya untuk meminta bantuan"
 BBA_italy_interaction_events.24.c: "Tidak ada yang bisa kami lakukan. Cabut jaminannya!"
 BBA_italy_interaction_events.25.t: "Orang Italia Melawan Kita"
 BBA_italy_interaction_events.25.desc: "Departemen Pertahanan Italia telah mengeluarkan peringatan kepada kami mengenai upaya kami untuk memasukkan orang Austria ke dalam negara kami. Mereka menyatakan bahwa jika kami bergerak melawan Austria, kami akan menghadapi tindakan balasan yang serius dari tentara Italia. Bagaimana seharusnya kita menanggapi provokasi yang jelas ini?"
 BBA_italy_interaction_events.25.a: "Kepala mereka menjadi terlalu besar"
 BBA_italy_interaction_events.25.b: "Kita tidak bisa menangani bentuk konfrontasi seperti ini"
 BBA_italy_interaction_events_news.1.t: "Jerman Mundur"
 BBA_italy_interaction_events_news.1.desc: "Outlet berita di seluruh dunia telah menerima laporan melalui departemen pertahanan Italia yang menyatakan bahwa Jerman telah memilih untuk mundur setelah memaksakan klaim mereka atas wilayah Austria. Ini adalah hari bersejarah bagi Eropa, dan hanya waktu yang akan membuktikan apa yang akan terjadi jika negara Jerman hancur."
 BBA_italy_interaction_events_news.1.a: "Sayangnya tidak ada pilihan lain"
 BBA_italy_interaction_events_news.1.b: "Hal ini membuktikan kelemahan yang melekat pada sistem Jerman"
 BBA_italy_interaction_events.26.t: "[ITA.GetNameDef] Mundur"
 BBA_italy_interaction_events.26.desc: "Italia telah mengumumkan bahwa mereka tidak akan menentang kami, karena mereka telah terbukti bahwa mereka akan terus melakukan tekanan jika mereka tidak mundur. Hari ini adalah hari yang mulia bagi tanah air!"
 BBA_italy_interaction_events.26.a: "Hal ini seharusnya mendesak [AUS.GetAdjective] untuk mempertimbangkan kembali"
 BBA_italy_interaction_events.27.t: "Italia Meminta Kami Membantu Mereka Membendung Jerman"
 BBA_italy_interaction_events.27.desc: "[GetItalyAsksEngland]"
 BBA_italy_interaction_events.27.desc_hosting_ethiopia: "Italia meminta kami untuk membantu mereka membendung kekuatan ekspansionis Jerman, dan ingin kami menjamin kemerdekaan Austria, untuk membantu melindungi mereka. Meskipun kami telah berperang berdampingan sebelumnya, kami sekarang menjadi tuan rumah bagi pemerintah Ethiopia di pengasingan, yang telah diusir oleh Italia. Jika [ITA.GetNameDef] menginginkan bantuan kita dalam perang yang akan datang, mereka harus menerima perdamaian terlebih dahulu."
 BBA_italy_interaction_events.27.desc_standard: "Hal ini pernah dilakukan selama perang besar, namun kini, lagi-lagi, Italia meminta kita membantu mereka membendung kekuatan ekspansionis Jerman. Mereka ingin kita menjamin kemerdekaan Austria untuk membantu melindungi mereka. Apa tindakan kita?"
 BBA_italy_interaction_events.27.a: "Baiklah kawan, kita masuk lagi"
 BBA_italy_interaction_events.27.b: "Jika mereka berdamai dengan [ETH.GetNameDef]"
 BBA_italy_interaction_events.27.c: "Astaga, tidak, mengapa kita harus peduli dengan benua ini?"
 ITA_if_Italy_accepts_tt: "Jika §Y[ITA.GetName]§! menerima:"
 BBA_italy_interaction_events_news.2.t: "Inggris Menjamin Kemerdekaan Austria"
 BBA_italy_interaction_events_news.2.desc: "Pemerintah Inggris hari ini mengumumkan bahwa mereka akan mendukung kemerdekaan Austria dan mendukung Italia melawan segala ancaman terhadap kedaulatan negara."
 BBA_italy_interaction_events_news.2.a: "Luar biasa"
 BBA_italy_interaction_events.28.t: "Italia Meminta Kami Membantu Mereka Membendung Jerman"
 BBA_italy_interaction_events.28.desc: "Tetangga kami di tenggara telah meminta kami untuk membantu mereka menangkis potensi serangan Jerman terhadap negara Austria, yang kemerdekaannya saat ini mereka jamin. Mereka meminta kami untuk melakukan hal yang sama sekarang. Bagaimana tanggapan kita?"
 BBA_italy_interaction_events.28.a: "Ya ampun, tuangkan kebebasanmu!"
 BBA_italy_interaction_events.28.b: "Jika mereka berdamai dengan [ETH.GetNameDefCap]"
 BBA_italy_interaction_events_news.3.t: "Negara Perancis Menjamin Kemerdekaan Austria"
 BBA_italy_interaction_events_news.3.desc: "Sesuai permintaan Italia, Prancis memutuskan untuk mendukung Austria dalam perjuangan mereka untuk kemerdekaan, dan berjanji untuk menyerang setiap calon agresor yang mungkin mencoba campur tangan dalam kedaulatan negara."
 BBA_italy_interaction_events_news.3.a: "Tidak terlalu Perancis..."
 BBA_italy_interaction_events.29.t: "Italia Mengambil [802.GetName] Dari Kita!"
 BBA_italy_interaction_events.29.desc: "Italia berusaha menghapus [802.GetName] dari kami, dengan menambahkannya ke kerajaan mereka sendiri, Albania. Jika kami tidak melakukan apa pun, klaim kami atas wilayah tersebut akan hilang selamanya."
 BBA_italy_interaction_events.29.a: "Tidak ada yang bisa kita lakukan untuk menghentikan mereka"
 BBA_italy_interaction_events.29.b: "Kita harus menjauh dari mereka"
 BBA_italy_interaction_events.30.t: "Italia Menawarkan [45.GetName] sebagai imbalan atas Jaminan Bersama"
 BBA_italy_interaction_events.30.desc: "[ITA.GetName] telah menawarkan untuk mendukung klaim kami terhadap [45.GetName] dengan imbalan jaminan bersama dan perjanjian kerja sama. Ini tampaknya merupakan hal yang bagus bagi kita, haruskah kita menerimanya?"
 BBA_italy_interaction_events.30.a: "Kedengarannya bagus!"
 BBA_italy_interaction_events.30.b: "Dan mengapa kita harus mempercayai orang Italia?"
 BBA_italy_interaction_events.31.t: "[NegotiatingItalianClaimsTitle]"
 BBA_italy_interaction_events.31.t_negotiate_claims: "[ITA.GetNameDefCap] Ingin Bernegosiasi Klaimnya ke Somalia"
 BBA_italy_interaction_events.31.t_refused_peace: "[ETH.GetNameDefCap] Menolak Pembicaraan Damai"
 BBA_italy_interaction_events.31.desc: "[GetRatifyStresaFrontEventDesc]"
 BBA_italy_interaction_events.31.desc_no_war: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun agar mereka dapat menandatanganinya, mereka menuntut konsesi teritorial, saat ini [269.GetName] dan [903.GetName]. Bagaimana seharusnya kita menanggapinya? Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.31.desc_peace_signed: "[ITA.GetNameDefCap] dan [ETH.GetNameDefCap] telah mengesampingkan perbedaan mereka dan menandatangani perjanjian damai, sebagian besar berkat keahlian diplomasi kita. Pemerintah Italia telah mengingatkan kami tentang kesepakatan yang kami buat di mana mereka akan menerima [269.GetName] dan [903.GetName] untuk meratifikasi Front Stresa."
 BBA_italy_interaction_events.31.desc_no_peace_deal: "Meskipun kami mendesak mengenai masalah ini, [ETH.GetLeader] yang tidak tahu berterima kasih telah menolak untuk melakukan perundingan damai dengan pemerintah [ITA.GetAdjective], karena berpikir bahwa ia lebih unggul dalam perang. Hal ini membuat kita tidak punya pilihan selain mengusir pemimpin Ethiopia dari negara kita, sehingga kita bisa fokus pada proposisi Italia, yang lebih sejalan dengan kepentingan nasional kita."
 BBA_italy_interaction_events.31.a: "Tentu saja mereka dapat memilikinya"
 BBA_italy_interaction_events.31.b: "Astaga, tidak"
 BBA_italy_interaction_events.32.t: "[ITA.GetName] Ingin Menegosiasikan Klaimnya ke Djibouti"
 BBA_italy_interaction_events.32.desc: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun agar mereka dapat menandatanganinya, mereka menuntut konsesi teritorial, yaitu [268.GetName]. Bagaimana seharusnya kita menanggapinya? Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.32.a: "Tuangkan ke Paix"
 BBA_italy_interaction_events.32.b: "Tidak!"
 BBA_italy_interaction_events.33.t: "[ITA.GetName] Ingin Menegosiasikan Klaimnya ke [906.GetName]"
 BBA_italy_interaction_events.33.desc: "[GetItalyWantsSocotra]"
 BBA_italy_interaction_events.33.desc_first_negotiation: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun agar mereka dapat menandatanganinya, mereka menuntut konsesi teritorial, yaitu [906.GetName]. Bagaimana seharusnya kita menanggapinya? Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.33.desc_continued_negotiation: "Orang Italia telah kembali kepada kami dengan tuntutan lain. Mereka sekarang menginginkan kepemilikan atas pulau [906.GetName]. Mereka menyatakan bahwa hal ini dilakukan agar mereka dapat lebih mudah mengatur arus barang dagangan yang diimpor dan diekspor di Afrika Timur Italia, dan mengendalikan salah satu saluran masuk ke Laut Merah, sebagaimana kita mengontrol yang lain. Jika kami memberikannya kepada mereka, mereka menyatakan bahwa mereka akan membayar kami untuk sementara atas usaha kami."
 BBA_italy_interaction_events.33.a: "Sebuah harga kecil yang harus dibayar untuk perdamaian"
 BBA_italy_interaction_events.33.b: "Dan mengapa mereka harus memilikinya?"
 BBA_italy_interaction_events.34.t: "[ITA.GetName] Ingin Menegosiasikan Klaimnya ke Tunisia"
 BBA_italy_interaction_events.34.desc: "[GetItalyWantsTunisia]"
 BBA_italy_interaction_events.34.desc_first_negotiation: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun agar mereka dapat menandatanganinya, mereka memerlukan konsesi wilayah, yaitu [458.GetName] dan [665.GetName]. Bagaimana seharusnya kita menanggapinya? Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.34.desc_continued_negotiation: "Orang Italia telah kembali kepada kami dengan tuntutan lain. Mereka sekarang menginginkan kepemilikan [458.GetName] dan [665.GetName]. Mereka menyatakan bahwa hal ini bertujuan agar mereka dapat memperoleh bagian yang lebih adil di Afrika Utara, dibandingkan dengan kita dan Inggris. Jika kami memberikannya kepada mereka, mereka menyatakan bahwa mereka akan membayar kami untuk sementara atas usaha kami."
 BBA_italy_interaction_events.34.a: "Ya ampun"
 BBA_italy_interaction_events.34.b: "Keterlaluan"
 BBA_italy_interaction_events.35.t: "[ITA.GetName] Ingin Menegosiasikan Klaimnya ke Malta"
 BBA_italy_interaction_events.35.desc: "[GetItalyWantsMalta]"
 BBA_italy_interaction_events.35.desc_first_negotiation: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun agar mereka dapat menandatanganinya, mereka menuntut konsesi teritorial, yaitu [116.GetName]. Bagaimana seharusnya kita menanggapinya? Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.35.desc_continued_negotiation: "Orang Italia telah kembali kepada kami dengan tuntutan lain. Mereka sekarang menginginkan kepemilikan atas pulau [116.GetName]. Mereka menyatakan hal itu agar mereka lebih mudah menguasai laut Mediterania. Jika kami memberikannya kepada mereka, mereka menyatakan bahwa mereka akan membayar kami untuk sementara atas usaha kami."
 BBA_italy_interaction_events.35.a: "Mereka lebih memanfaatkannya"
 BBA_italy_interaction_events.35.b: "Tidak masuk akal"
 BBA_italy_interaction_events.36.t: "[ITA.GetName] Ingin Merundingkan Klaimnya terhadap Balkan"
 BBA_italy_interaction_events.36.desc: "[GetItalyClaimsBalkan]"
 BBA_italy_interaction_events.36.desc_first_negotiation: "Pemerintah Italia hari ini telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Mereka ingin kami meratifikasi klaim mereka atas Balkan. Hal ini sebenarnya bukan merupakan kepentingan kami, dan oleh karena itu pemerintah kami tidak terlalu ingin menyangkal hal ini."
 BBA_italy_interaction_events.36.desc_continued_negotiation: "[ITA.GetName] sekarang hanya memiliki satu permintaan terakhir dari kami, sebelum perjanjian dapat ditandatangani. Mereka ingin kami meratifikasi klaim mereka atas Balkan. Hal ini sebenarnya bukan merupakan kepentingan kami, dan oleh karena itu pemerintah kami tidak terlalu ingin menyangkal hal ini."
 BBA_italy_interaction_events.36.a: "Tidak ada gunanya memperdebatkan hal ini"
 BBA_italy_interaction_events.37.t: "Negosiasi Wilayah Selesai"
 BBA_italy_interaction_events.37.desc: "Para diplomat kami telah bekerja keras di Prancis dan Inggris selama beberapa minggu terakhir untuk mengamankan perolehan teritorial Italia dalam waktu dekat. Namun negosiasi telah selesai, dan surat-suratnya telah ditandatangani."
 BBA_italy_interaction_events.37.a: "Tidak semua yang kami inginkan, tapi kami akan mengambilnya"
 BBA_italy_interaction_events.37.b: "Luar biasa!"
 BBA_italy_interaction_events.38.t: "Kekuasaan Paus"
 BBA_italy_interaction_events.38.desc: "Dengan kekuasaan Kepausan yang melebihi monarki Italia, banyak pendukung setia gereja Katolik saat ini menuntut Paus untuk mengambil alih kepemimpinan negara tersebut. Beliau sudah menerima peran yang diusung masyarakat, dan menyatakan bahwa apa yang terjadi saat ini memang merupakan kehendak Tuhan sendiri. Tidak banyak yang bisa dilakukan monarki untuk menghentikannya saat ini."
 BBA_italy_interaction_events.38.a: "Tuhan menghendakinya!"
 BBA_italy_interaction_events.39.t: "Pembayaran untuk Koloni Afrika"
 BBA_italy_interaction_events.39.desc: "Kami akhirnya melakukan pembayaran terakhir atas kepemilikan baru kami di Afrika. Perjanjian ini telah memperluas wilayah kolonial kami, mempersatukan dan memperkuatnya, serta memperkuat posisi kami di sana. Secara keseluruhan, ini merupakan pengaturan yang sangat bermanfaat bagi semua peserta."
 BBA_italy_interaction_events.39.a: "Era baru dimulai!"
 BBA_italy_interaction_events.40.t: "Ratifikasi Front Stresa"
 BBA_italy_interaction_events.40.desc: "Kini setelah konsesi teritorial diputuskan, [ITA.GetName] telah memulai proses yang akan membawa Italia dan Prancis ke dalam aliansi militer yang disebut Front Stresa. Sekarang bukan waktunya untuk berdiam diri, karena Prancis harus bertindak demi kepentingan terbaiknya dan bergabung dengan Italia melawan ancaman Jerman."
 BBA_italy_interaction_events.40.a: "Kondisinya bisa diterima"
 BBA_italy_interaction_events.40.b: "Prancis tidak akan pernah berdiri selain Italia"
 stresa_front_ita: "Stres depan"
 BBA_italy_interaction_events.41.t: "[FROM.GetName] Memberi kita Perlindungan"
 BBA_italy_interaction_events.41.desc: "[FROM.GetLeader] telah mendekati kami dengan tawaran untuk menempatkan kami di bawah naungan mereka, guna melindungi kami dari kekuatan asing dan kekeringan ekonomi. [FROM.GetName] tampaknya bermusuhan, dan kemungkinan besar akan menyerang kita jika kita menolak tuntutan mereka."
 BBA_italy_interaction_events.41.a: "Tawaran yang terlalu bagus untuk ditolak"
 BBA_italy_interaction_events.41.b: "Rakyat menginginkan kemerdekaannya!"
 BBA_italy_interaction_events.42.t: "[FROM.GetName] Menerima Penawaran kami"
 BBA_italy_interaction_events.42.desc: "Negara [FROM.GetName] dengan rendah hati menerima tawaran perlindungan kami dan tunduk kepada penguasa sah lautan Mediterania. Hari ini menyinari Iberia dan [ITA.GetNameDef]."
 BBA_italy_interaction_events.42.a: "Luar biasa"
 BBA_italy_interaction_events.43.t: "[FROM.GetName] Menolak Tawaran kami"
 BBA_italy_interaction_events.43.desc: "Negara [FROM.GetName] telah dengan kasar menolak tawaran perlindungan kami, dan kami akan menunjukkan kepada mereka apa artinya melawan kami dalam arti sebenarnya. Mereka akan sujud di hadapan kita!"
 BBA_italy_interaction_events.43.a: "Mereka akan menyesali hari ini!"
 BBA_italy_interaction_events.44.t: "[FROM.GetName] Mengundang kami ke Aliansi"
 BBA_italy_interaction_events.44.desc: "[FROM.GetLeader] telah memulai inisiatif untuk bersekutu dengan negara-negara Amerika Selatan dan menyatukan budaya Latin di bawah satu wilayah kekuasaan. Ini sepertinya merupakan peluang bagus untuk perlindungan dari [USA.GetNameDef]. Bagaimana seharusnya kita menanggapinya?"
 BBA_italy_interaction_events.44.a: "Kedengarannya bagus untukku"
 BBA_italy_interaction_events.44.b: "Mengapa kita harus bertemu dengan kaum imperialis?"
 BBA_italy_interaction_events.45.t: "[FROM.GetName] menerima tawaran kami"
 BBA_italy_interaction_events.45.desc: "Negara [FROM.GetName] dengan rendah hati menerima tawaran aliansi kami dan bergabung dengan kami untuk melawan musuh bersama sebagai satu kesatuan. Hari ini menyinari cahaya terang baru di Amerika Selatan dan [ITA.GetNameDef]."
 BBA_italy_interaction_events.45.a: "Bagus"
 BBA_italy_interaction_events.46.t: "[FROM.GetName] Menolak Tawaran kami"
 BBA_italy_interaction_events.46.desc: "Negara [FROM.GetName] telah dengan kasar menolak tawaran aliansi kami, dan oleh karena itu kami harus hidup tanpa mereka. Mereka akan terisolasi di benua mereka."
 BBA_italy_interaction_events.46.a: "Kita tidak bisa berbuat banyak untuk mengubah pikiran mereka..."
 BBA_italy_interaction_events.50.t: "Proposisi Italia"
 BBA_italy_interaction_events.50.desc: "Pemerintah Italia telah mendekati kami dengan proposal yang menarik. Mereka mengatakan mereka ingin meratifikasi Front Stresa, mendapatkan dukungan mereka bagi pihak kami jika terjadi perang di Eropa. Namun mereka menuntut konsesi teritorial, saat ini [269.GetName] dan [903.GetName] - dan mereka sedang berperang dengan [ETH.GetName], yang pemerintahannya kita pimpin. Setidaknya mereka akan membayar kita untuk sementara jika kita menerimanya."
 BBA_italy_interaction_events.50.a: "Mereka harus menandatangani perjanjian damai terlebih dahulu!"
 BBA_italy_interaction_events.50.b: "Tidak akan ada kesepakatan dengan para penjahat ini!"
 BBA_italy_interaction_events.51.t: "Inggris Menolak Bernegosiasi"
 BBA_italy_interaction_events.51.desc: "Usulan kami yang masuk akal untuk meratifikasi Front Stresa dengan imbalan sejumlah wilayah kolonial kecil dari Inggris telah ditanggapi dengan sangat meremehkan. Mereka memang harus merasa kuat dan percaya diri jika menolak kekuatan besar kita."
 BBA_italy_interaction_events.51.a: "Mereka akan menyesalinya!"
 BBA_italy_interaction_events.60.t: "[ITA.GetName] Menandatangani Perjanjian Damai"
 BBA_italy_interaction_events.60.desc: "Italia telah menandatangani perjanjian damai dengan Ethiopia, mengembalikan sebagian tanah yang mereka taklukkan. Pemerintah Italia kini meminta kami untuk menjunjung tinggi kesepakatan kami dan menjamin kemerdekaan Austria dalam menghadapi ekspansionisme Jerman."
 BBA_italy_interaction_events.70.t: "Menunggu Jawaban"
 BBA_italy_interaction_events.70.desc: "Kami telah mengirim utusan ke pemimpin [GetAdjective] untuk menanyakan apakah mereka bersedia mengesampingkan perbedaan kami dan membentuk pemerintahan baru di bawah pengawasan Italia."
 BBA_italy_interaction_events.70.a: "Kami akan menunggu"
 BBA_italy_interaction_events.71.t: "Proposal Italia"
 BBA_italy_interaction_events.71.desc: "Seorang utusan dari [ITA.GetNameDef] telah mendekati kami, menanyakan apakah kami bersedia mengesampingkan perbedaan kami dan membentuk pemerintahan baru di bawah pengawasan Italia. Utusan tersebut telah memberi tahu kami bahwa mereka akan melanjutkan pembentukan pemerintahan baru di tanah air kami, dengan atau tanpa kerja sama kami. Jika kita menolak tawaran ini, kita akan diabaikan oleh seluruh dunia dan tidak mendukung pemerintahan baru ini."
 BBA_italy_interaction_events.71.a: "Tidak banyak yang bisa kami lakukan"
 ITA_create_puppet_tt: "§Y[ROOT.GetNameWithFlag]§! akan mendapatkan §YPohon Fokus§! baru"
 BBA_italy_interaction_events.71.b: "Kami masih memiliki harga diri kami!"
 BBA_italy_interaction_events.72.t: "[FROM.GetAdjective] Daun"
 BBA_italy_interaction_events.72.desc: "[FROM.GetLeader], pemimpin [FROM.GetAdjective] yang diasingkan, melakukan kunjungan diam-diam ke kediaman pribadi [ROOT.GetLeader] tadi malam untuk secara diam-diam menginformasikan keputusannya untuk menerima tawaran Italia untuk membentuk pemerintahan baru di bawah rezim mereka. Ia mengucapkan terima kasih atas kemurahan hati kami di masa-masa sulit ini, namun ia juga mengatakan bahwa ia perlu memikirkan apa yang terbaik bagi rakyatnya."
 BBA_italy_interaction_events.72.a: "Sudah lama mereka menolak"
 BBA_italy_interaction_events.666.t: "[454.GetName] atau Perang"
 BBA_italy_interaction_events.666.desc: "Yang Mulia, Paus [From.GetLeader], meminta agar kami menyerahkan status [454.GetName]. Utusan-utusannya menyatakan bahwa tempat suci tersebut hanya boleh diatur oleh Kepausan, dan menolak permintaan tersebut merupakan tindakan sesat. Kepatuhan akan sangat bermanfaat bagi hubungan kita dengan [FROM.GetName], namun [454.GetName] terletak di persimpangan antara Eropa, Asia, dan Afrika - yang menjadikannya tempat yang sangat penting dan strategis, seperti halnya sepanjang sejarah."
 BBA_italy_interaction_events.666.a: "Kita harus memenuhi tuntutan Yang Mulia..."
 BBA_italy_interaction_events.666.b: "Orang tua itu bisa terbakar di neraka!"
 BBA_italy_interaction_events.667.t: "[FROM.GetName] Penyerahan [454.GetName]"
 BBA_italy_interaction_events.667.desc: "Ini bukan hanya hari besar bagi Kepausan, tetapi juga bagi seluruh umat Kristen! Pemimpin [FROM.GetAdjective], [FROM.GetLeader], dengan bijak mendengarkan permintaan kami dan setuju untuk mentransfer [454.GetName] ke pemerintahan kami. Hal ini akan membawa stabilitas dan kemakmuran bagi kawasan dan masa depan baru yang cerah bagi [ROOT.GetName]."
 BBA_italy_interaction_events.667.a: "Terberkatilah kepemimpinan [FROM.GetAdjective]!"
 BBA_italy_interaction_events.668.t: "[FROM.GetName] Menolak Usulan Yang Mulia"
 BBA_italy_interaction_events.668.desc: "[FROM.GetLeader] sombong sekaligus cuek! Dia menolak melihat sensibilitas dalam menyerahkan [454.GetName] kepada kami. Memenuhi tuntutan kami akan membawa keamanan dan stabilitas di kawasan ini, namun tindakannya hanya akan menyebabkan perang dan kesengsaraan!"
 BBA_italy_interaction_events.668.a: "Suatu Penghinaan terhadap Tuhan!"
 BBA_italy_purge_the_party.1.t: "Bersihkan Partito Nazionale Fascista"
 BBA_italy_purge_the_party.1.desc: "Ada sekutu-sekutu Mussolini yang masih berkuasa dan mencoba mempengaruhi masyarakat agar mengembalikan Duce yang lama. Jika kita ingin mempertahankan kendali kita atas pemerintah, kita perlu memberi contoh dan memecat orang-orang bodoh ini dari jabatannya."
 BBA_italy_purge_the_party.1.a: "Bersihkan Penasihat"
 BBA_italy_purge_the_party.1.b: "Bersihkan Jenderal"
 BBA_italy_purge_the_party.1.c: "Simpan semuanya"
 BBA_italy_purge_the_party.1.d: "Bersihkan semua orang"
 ITA_characters_will_be_spared_tt: "§YKarakter berikut akan terhindar dari pembersihan:§!"
 BBA_italy_decide_the_fate_of_mussolini.1.t: "Nasib Mussolini"
 BBA_italy_decide_the_fate_of_mussolini.1.desc: "Setelah mengatasi perebutan kekuasaan internal dan memperkuat cengkeraman kita pada Partito Nazionale Fascista, kita akhirnya bisa mengalihkan perhatian kita pada Duce lama - Mussolini. Kehadirannya yang selalu mengancam melemahkan posisi kita dan perlu ditangani."
 BBA_italy_decide_the_fate_of_mussolini.1.a: "Biarkan dia diadili"
 BBA_italy_decide_the_fate_of_mussolini.1.b: "Eksekusi dia"
 BBA_italy_decide_the_fate_of_mussolini.1.c: "Bunuh dia"
 BBA_italy_decide_the_fate_of_mussolini.2.t: "Pengadilan Mussolini"
 BBA_italy_decide_the_fate_of_mussolini.2.desc: "Persidangan abad ini akan segera dimulai, di mana Benito Mussolini dituduh atas berbagai tuduhan korupsi dan pengkhianatan - antara lain. Persidangan ini hanyalah sebuah teater bagi publik untuk memberikan legitimasi. Pada kenyataannya, kami memegang hasil di tangan kami sendiri."
 BBA_italy_decide_the_fate_of_mussolini.2.a: "Bebaskan dia"
 BBA_italy_decide_the_fate_of_mussolini.2.b: "Biarkan dia membusuk di penjara"
 BBA_italy_decide_the_fate_of_mussolini.3.t: "Kematian Mussolini"
 BBA_italy_decide_the_fate_of_mussolini.3.desc: "Ada rencana untuk membunuh mantan Duce, tapi kita harus hati-hati mempertimbangkan bagaimana reaksi masyarakat Italia. Pertanyaannya adalah bagaimana kita memutarnya?"
 BBA_italy_decide_the_fate_of_mussolini.3.a: "Salahkan Komunis!"
 BBA_italy_decide_the_fate_of_mussolini.3.b: "Buatlah cerita sampul"
 ITA_mussolini_stands_trial_tt: "Biarlah Pengadilan yang mengatur nasibnya - selama kita yang mengatur Pengadilan."
 ITA_mussolini_is_assassinated_tt: "Kita bisa memutarbalikkan kematiannya demi keuntungan kita."
 ITA_mussolini_walks_free_tt: "Mussolini berjalan dan bisa menjalani hidupnya sebagai warga negara yang bebas."
 BBA_italy_research_agreement.1.t: "[FROM.GetNameDefCap] Menyarankan Program Kerjasama Militer Gabungan"
 BBA_italy_research_agreement.1.desc: "[FROM.GetAdjective] mengusulkan program penelitian bersama untuk memperkuat tidak hanya kemampuan militer kita tetapi juga ikatan antar negara kita. Hal ini akan memungkinkan kita untuk berbagi teknologi dan penelitian dengan lebih mudah dan akan mendekatkan kedua negara."
 BBA_italy_research_agreement.1.a: "Ini bisa bermanfaat bagi kita."
 BBA_italy_research_agreement.1.b: "Kami tidak membutuhkan program seperti itu."
 BBA_italy_research_agreement.2.t: "[FROM.GetNameDefCap] Menolak Proposisi Militer kami"
 BBA_italy_research_agreement.2.desc: "[FROM.GetNameDefCap] dengan tidak bijaksana telah menolak usulan kerja sama militer kami. Program bersama ini akan memperkuat kemampuan militer kedua negara, namun tampaknya [FROM.GetAdjective] tidak tertarik pada kesepakatan tersebut. Untungnya, kita tidak membutuhkan bantuan mereka untuk mencapai tujuan kita!"
 BBA_italy_research_agreement.2.a: "Keputusan yang buruk"
 BBA_italy_pact.1.t: "[FROM.GetNameDefCap] Mengusulkan Pakta Non-Agresi"
 BBA_italy_pact.1.desc: "[FROM.GetAdjective] siap menyampaikan deklarasi persahabatan dan kerja sama bersama antar negara kita. Pakta non-agresi dengan mereka akan mengamankan perbatasan kita dan membebaskan sumber daya untuk dikirim ke tempat lain. Sekalipun kita belum tentu menganggap mereka dapat dipercaya, hal ini akan memungkinkan kita untuk menunggu dan membangun kekuatan kita."
 BBA_italy_pact.1.a: "Ini akan cocok untuk kita."
 BBA_italy_pact.1.b: "Kita tidak bisa mempercayai mereka!"
 BBA_italy_pact.2.t: "[FROM.GetNameDefCap] Menolak Ranting Zaitun kami"
 BBA_italy_pact.2.desc: "[FROM.GetNameDefCap] telah menolak usulan pakta non-agresi kami, dan menyebut perjanjian tersebut tidak jujur dan sepihak. Mereka jelas-jelas mengalami delusi dan tidak memahami apa yang terbaik bagi mereka."
 BBA_italy_pact.2.a: "Bodoh!"
 BBA_italy_recognize_the_empire.1.t: "Kenali Kekaisaran Italia"
 BBA_italy_recognize_the_empire.1.desc: "[FROM.GetLeader] telah mendeklarasikan permulaan Kekaisaran Italia! Meskipun duta besar kami untuk Roma menyarankan agar kami hanya mengakui fakta ini dan membiarkan [FROM.GetAdjective] mewujudkan impian mereka akan keagungan, namun ada juga yang khawatir dengan kejadian ini. Mereka berargumen bahwa menenangkan kelompok [FROM.GetAdjective] hanya akan menghasilkan lebih banyak konsesi dan kita harus menahan impian berbahaya akan kerajaan tersebut."
 BBA_italy_recognize_the_empire.1.a: "Akui Kekaisaran Italia"
 BBA_italy_recognize_the_empire.1.b: "Abaikan proklamasi itu"
 BBA_italy_recognize_the_empire.2.t: "Pengakuan Kekaisaran"
 BBA_italy_recognize_the_empire.2.desc: "[FROM.GetNameDefCap] dengan bijak mengakui aspirasi kekaisaran kami dan melihat kami setara dengan mereka - sebagaimana mestinya! Pamor dan kejayaan kami terus tumbuh."
 BBA_italy_recognize_the_empire.2.a: "Kekuatan kita semakin besar!"
 BBA_italy_recognize_the_empire.3.t: "Penolakan Kekaisaran"
 BBA_italy_recognize_the_empire.3.desc: "[FROM.GetNameDefCap] dengan bodohnya mencemooh ambisi kekaisaran kita, menyatakan bahwa mimpi dan angan-angan saja tidak dapat membangun sebuah kerajaan. Mereka harus membayar harga atas kekurangajaran seperti itu! Kami akan menunggu waktu kami - untuk saat ini - tetapi kami siap untuk menunjukkan kepada mereka yang tidak punya akal tentang kekuatan sebenarnya dari Kekaisaran Italia."
 BBA_italy_recognize_the_empire.3.a: "Mereka akan hidup untuk menyesali ini...."
 BBA_italy_sends_military_support.1.t: "[FROM.GetNameDefCap] Mengirim Dukungan Militer"
 BBA_italy_sends_military_support.1.desc: "[FROM.GetAdjective] ingin mendukung kami dalam upaya perang dan telah mengirimkan beberapa peralatan. Ini adalah pengiriman yang agak kecil tetapi bantuan apa pun dapat diterima."
 BBA_italy_sends_military_support.1.a: "Ini pasti akan berguna"
 BBA_italy_communist_events.01.t: "Kepemimpinan Republik"
 BBA_italy_communist_events.01.desc: "Dengan amannya Republik kita yang baru lahir dari cengkeraman kaum fasis, kita akhirnya dapat menetapkan arah baru bagi negara kita! Yang dibutuhkan saat ini adalah pemimpin yang teguh, yang bijaksana dan berkomitmen terhadap tujuan kita. Seseorang yang dapat mengarahkan kita melewati masa-masa sulit di masa depan dan tidak goyah dalam keyakinannya untuk masa depan yang lebih cerah."
 BBA_italy_communist_events.01.a: "Antonio Gramsci adalah pemimpin yang sah."
 BBA_italy_communist_events.01.b: "Kita harus mengikuti Palmiro Togliatti."
 BBA_italy_communist_events.01.c: "Sandro Pertini akan memimpin kita maju."
 BBA_italy_communist_events.02.t: "[FROM.GetAdjective] Panggilan Bantuan"
 BBA_italy_communist_events.02.desc: "Kawan-kawan kami di [FROM.GetName] yang baru dibentuk telah meminta kami untuk memberikan bantuan. Rakyat [FROM.GetAdjective] telah terpecah belah dalam perang saudara untuk mengamankan pemerintahan Komunis mereka, dan kini beralih ke pemerintahan lain yang berpikiran sama sehingga mereka dapat membangun kembali dan melindungi republik baru."
 BBA_italy_communist_events.02.a: "Kami akan mendukung mereka!"
 BBA_italy_communist_events.02.b: "Bukan menjadi perhatian bagi orang [ROOT.GetAdjective]."
 BBA_italy_communist_events.03.t: "Dukungan Internasional untuk [ROOT.GetNameDef]"
 BBA_italy_communist_events.03.desc: "Pemerintah di [FROM.GetName] telah mendengarkan seruan kami untuk meminta dukungan dari sesama komunis dan memutuskan untuk membantu kami! Hal ini tidak hanya akan memperkuat hubungan kita dengan mereka tetapi juga kemampuan pertahanan kita sehingga kita dapat melindungi republik kita tercinta."
 BBA_italy_communist_events.03.a: "Bersatu kita tidak akan pernah terkalahkan!"
 BBA_italy_communist_events.04.t: "Tidak Ada Dukungan Internasional yang Diterima"
 BBA_italy_communist_events.04.desc: "Belum ada yang menjawab permintaan bantuan! Tampaknya komunis di seluruh dunia telah meninggalkan kita dan tidak terlalu bersemangat membantu rekan-rekan mereka. Kita hanya bisa mengandalkan diri kita sendiri di dunia yang keras ini - namun revolusi kita akan menang!"
 BBA_italy_communist_events.04.a: "[ROOT.GetNameDefCap] akan menang apapun yang terjadi!"
 ITA_country_supports_new_italian_government_tt: "[FROM.GetNameDefCap] akan menerima sejumlah dukungan dari kami dalam bentuk §Yperalatan§! dan bonus kecil §Ybarang konsumsi§! sementara."
 ITA_international_support_arrives_tt: "Kami akan menerima manfaat berikut dari rekan-rekan kami di luar negeri:"
 ITA_international_support_consumer_goods_tt: "Mendapatkan '§Y$ITA_international_aid$§!' yang memberikan ($MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ITA_consumer_goods_from_leftist_aid|%]§!) selama §Y730§! hari."
 BBA_italy_communist_events.05.t: "Kerjasama Militer dengan Tentara [FROM.GetAdjective]"
 BBA_italy_communist_events.05.desc: "Kami baru saja menyelesaikan latihan bersama dengan militer [FROM.GetAdjective]. Para jenderal dan laksamana kami dengan senang hati melaporkan bahwa ini sukses besar dan kinerja militer kami sangat baik. Hal ini akan memperkuat hubungan kita dengan [FROM.GetName] dan kemampuan kita sendiri."
 BBA_italy_communist_events.05.a: "Ini memperkuat [ROOT.GetFactionName]!"
 BBA_italy_communist_events.06.t: "[FROM.GetAdjective] Usulan Kerjasama"
 BBA_italy_communist_events.06.desc: "Kawan-kawan seperjuangan kita dari [FROM.GetName] telah mengusulkan Komisi Besar yang beranggotakan Spanyol dan negara-negara lain agar kita dapat memperluas kerja sama di antara kita. Mereka berargumentasi bahwa kita perlu bersama-sama melawan kapitalisme dan fasisme, sehingga suatu hari nanti kita bisa meruntuhkan mereka."
 BBA_italy_communist_events.06.a: "Kita akan berdiri bersama!"
 BBA_italy_communist_events.06.b: "[FROM.GetAdjective] urusan bukan urusan kami."
 BBA_italy_communist_events.07.t: "[FROM.GetName] Menerima Proposal kami"
 BBA_italy_communist_events.07.desc: "Kawan-kawan kami di [FROM.GetName] telah setuju untuk bergabung dengan kami dan membentuk Komisi Besar Kerja Sama! Bersama-sama kita akan mampu menahan serangan kapitalisme dan fasisme, dan membalikkan keadaan untuk membawa revolusi kita yang gemilang ke seluruh penjuru dunia!"
 BBA_italy_communist_events.08.t: "[FROM.GetName] Menolak Proposal kami"
 BBA_italy_communist_events.08.desc: "[FROM.GetAdjective] yang bodoh terlalu picik untuk melihat apa yang terbaik bagi mereka! Bersama-sama akan lebih mudah untuk menahan kapitalisme dan fasisme, namun kita akan berhasil!"
 BBA_italy_communist_events.08.a: "Mereka belum memikirkan hal ini dengan matang..."
 BBA_italy_communist_events.09.t: "Antonio Gramsci Sembuh"
 BBA_italy_communist_events.09.desc: "Antonio Gramsci akhirnya pulih dari penyakit parah yang dideritanya saat dipenjara secara tidak adil. Dia siap membantu perjuangan kita dengan cara apa pun yang dia bisa dengan keyakinan dan semangat yang lebih kuat dari sebelumnya!"
 BBA_italy_communist_events.09.a: "Dipulihkan oleh optimisme kemauannya."
 BBA_italy_democratic_events.01.t: "$BBA_italy_communist_events.01.t$"
 BBA_italy_democratic_events.01.desc: "Dengan perjuangan yang telah kita lalui akhir-akhir ini, inilah saatnya untuk bersatu dan bersatu, memperbaiki luka kita, dan memulai perjalanan panjang menuju pemulihan. Demokrasi kita masih muda dan rapuh, sehingga kita memerlukan tangan yang kuat namun lembut untuk membimbing kita maju."
 BBA_italy_democratic_events.01.a: "Ferruccio Parri adalah pemimpin yang paling cakap."
 BBA_italy_democratic_events.01.b: "Pengalaman Ivanoe Bonomi sangat berharga."
 BBA_italy_democratic_events.02.t: "Program Italia untuk Kerja Sama Ilmiah"
 BBA_italy_democratic_events.02.desc: "[FROM.GetName] telah mengundang kami untuk bergabung dalam inisiatif berbagi penelitian baru dengan mereka. Hal ini akan memperluas dan memperdalam hubungan dan kerja sama antar negara kita."
 BBA_italy_democratic_events.02.a: "Inisiatif yang bagus!"
 BBA_italy_democratic_events.03.t: "Mafia Italia Bangkit Lagi"
 BBA_italy_democratic_events.03.desc: "Perang Saudara telah menyebabkan banyak pertumpahan darah dan kesedihan serta telah mengguncang fondasi [FROM.GetName]. Kekacauan ini juga meninggalkan kekosongan kekuasaan, yang kini diisi oleh kebangkitan Mafia di [?ROOT.ITA_mafia_epicenter_state.GetName]. Menekan Mafia mungkin satu-satunya hal baik yang berhasil dilakukan kaum Fasis."
 BBA_italy_democratic_events.03.a: "Masalah lain yang harus ditangani"
 BBA_italy_democratic_events.05.t: "Mafia Italia Meningkat"
 BBA_italy_democratic_events.05.desc: "Wabah Mafia sedang menyebar! Kekacauan yang terjadi baru-baru ini di [FROM.GetName] telah menjadi tempat berkembang biaknya para penjahat dan sejenisnya, dan karena tidak adanya peraturan daerah yang kuat, jumlah orang-orang yang tidak diinginkan ini semakin bertambah. Mereka telah memanfaatkan kekosongan kekuasaan akibat Perang Saudara dan sekali lagi menegaskan otoritas mereka di seluruh [FROM.GetName]."
 BBA_italy_democratic_events.05.a: "Sampah adalah apa adanya!"
 generic_states_affected_tt: "Negara bagian yang terkena dampak:"
 generic_states_affected_no_prev_line_tt: "Negara bagian yang terkena dampak:"
 BBA_italy_anti_colonialism_events.01.t: "$ITA_the_ethiopian_question$"
 BBA_italy_anti_colonialism_events.01.desc: "Setelah urusan dalam negeri kita beres, kita bisa sekali lagi melihat ke luar. Kita mewarisi banyak sekali persoalan dari kaum fasis, persoalan-persoalan yang kini harus kita selesaikan. Salah satu pertanyaan yang paling penting adalah mengenai Etiopia. Ini adalah perang yang tidak adil dan brutal, dimulai oleh Mussolini yang selalu mendambakan gengsi, dan kini setelah kepergiannya, nasib Ethiopia bergantung pada kita."
 BBA_italy_anti_colonialism_events.01.a: "Kita harus menghentikan sandiwara ini sekarang!"
 BBA_italy_anti_colonialism_events.01.b: "Kami akan membebaskan para pekerja di Ethiopia!"
 BBA_italy_anti_colonialism_events.01.c: "Kita harus mengintegrasikan wilayah Ethiopia."
 BBA_italy_anti_colonialism_events.01.d: "Kita harus berinvestasi di Etiopia dan masyarakat Etiopia."
 BBA_italy_anti_colonialism_events.01.e: "Kami akan mempertahankan status quo."
 BBA_italy_anti_colonialism_events.01.f: "Kita harus mengakhiri aturan menindas [ETH.GetLeader]!"
 BBA_italy_anti_colonialism_events.01.g: "Kami akan memperkuat hubungan dengan rakyat Ethiopia."
 BBA_italy_anti_colonialism_events.02.t: "Proposal Gencatan Senjata dari [FROM.GetName]"
 BBA_italy_anti_colonialism_events.02.desc: "Pemerintahan baru [FROM.GetName] telah mendatangi kami, meminta gencatan senjata terhadap permusuhan. Tampaknya setelah Perang Saudara, mereka sudah muak dengan pertumpahan darah dan pertempuran."
 BBA_italy_anti_colonialism_events.02.a: "Kedengarannya masuk akal."
 BBA_italy_anti_colonialism_events.02.b: "Kita harus menyerah..."
 BBA_italy_anti_colonialism_events.02.c: "Terlambat, mereka akan bertekuk lutut!"
 BBA_italy_anti_colonialism_events.03.t: "Akhir Perang Italia-Ethiopia"
 BBA_italy_anti_colonialism_events.03.desc: "[FROM.GetName] [FROM.GetLeader] telah menyetujui usulan gencatan senjata kami dan bersedia memberikan kesempatan perdamaian. Kita akhirnya bisa melupakan salah satu kekejaman terbesar Mussolini dan memulai yang baru."
 BBA_italy_anti_colonialism_events.03.a: "Damai itu!"
 BBA_italy_anti_colonialism_events.04.t: "[FROM.GetLeader] Menolak Proposal kami"
 BBA_italy_anti_colonialism_events.04.desc: "[FROM.GetLeader] yang haus darah rupanya mencium bau darah setelah Perang Saudara kita, dan menganggap kita lemah. [FROM.GetSheHeCap] telah menolak tawaran perdamaian kami dan bertekad untuk terus berjuang. Kami akan menunjukkan kepada [FROM.GetHerHim] bahwa kami jauh dari kata lemah!"
 BBA_italy_anti_colonialism_events.04.a: "[FROM.GetLeader] akan menyesali ini!"
 BBA_italy_anti_colonialism_events.05.t: "[FROM.GetAdjective] Tuntutan Integrasi [ROOT.GetAdjective]"
 BBA_italy_anti_colonialism_events.05.desc: "Pemerintah di [FROM.GetName] berupaya untuk mengambil kendali langsung atas wilayah kami dan mengintegrasikan kami ke dalam pemerintahan [FROM.GetAdjective] yang lebih besar. Bagaimana hal ini akan berdampak pada masyarakat, budaya, dan tradisi kita, belum ada yang tahu."
 BBA_italy_anti_colonialism_events.05.a: "Kami dengan senang hati akan menyampaikannya."
 BBA_italy_anti_colonialism_events.05.b: "Kami tidak akan melepaskan otonomi kami yang terbatas!"
 BBA_italy_anti_colonialism_events.06.t: "[FROM.GetAdjective] Integrasi ke [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.06.desc: "Pemerintah [FROM.GetAdjective] telah menyadari bahwa integrasi ke dalam pemerintahan [ROOT.GetAdjective] yang lebih luas akan bermanfaat dan memperkuat kita semua."
 BBA_italy_anti_colonialism_events.06.a: "Favoloso!"
 BBA_italy_anti_colonialism_events.07.t: "[FROM.GetName] Menolak Proposal kami"
 BBA_italy_anti_colonialism_events.07.desc: "Tampaknya [FROM.GetAdjective] menganggap mereka lebih cocok untuk memerintah diri mereka sendiri dan telah menolak tawaran kami untuk menjadi bagian dari pemerintahan kami yang lebih luas."
 BBA_italy_anti_colonialism_events.07.a: "Itu terlalu berlebihan..."
 BBA_italy_anti_colonialism_events.08.t: "[FROM.GetAdjective] Investasi dalam Pembangunan [ROOT.GetAdjective]"
 BBA_italy_anti_colonialism_events.08.desc: "Tampaknya pemerintahan baru di [FROM.GetName] ingin mengubah beberapa perlakuan yang kurang baik dari pendahulunya terhadap masyarakat [ROOT.GetAdjective], dan telah memutuskan untuk berinvestasi di negara kita demi perubahan."
 BBA_italy_anti_colonialism_events.08.a: "[ROOT.GetCapitalVictoryPointName] berkembang!"
 BBA_italy_anti_colonialism_events.09.t: "[FROM.GetAdjective] Tekanan Pemerintah [ROOT.GetName]"
 BBA_italy_anti_colonialism_events.09.desc: "Rasa lapar [FROM.GetAdjective] akan ekspansi sepertinya tidak mengenal batas! Kami telah menerima delegasi dari [FROM.GetName] yang menawarkan penaklukan kepada kami. Mereka mengklaim tidak akan ada perubahan; kami akan tetap mengatur tanah kami sesuai keinginan kami, namun dengan manfaat perlindungan ekstra dari [FROM.GetAdjective] dan kepatuhan sesekali."
 BBA_italy_anti_colonialism_events.09.a: "Kami akan mengikuti rekan-rekan Italia kami!"
 BBA_italy_anti_colonialism_events.09.b: "Kita membutuhkan perubahan dalam pemerintahan!"
 BBA_italy_anti_colonialism_events.09.c: "Orang Eropa yang lancang!"
 BBA_italy_anti_colonialism_events.10.t: "[FROM.GetAdjective] Pekerja Bergembiralah!"
 BBA_italy_anti_colonialism_events.10.desc: "Pemerintah [FROMGetAdjective] telah dengan bijak memutuskan untuk menerima tawaran kami untuk menggabungkan kekuatan dan menikmati perlindungan kami. Hal ini tidak diragukan lagi akan memperkuat dan menguntungkan kedua negara!"
 BBA_italy_anti_colonialism_events.11.t: "[FROM.GetAdjective] Pekerja Mengambil Kekuasaan"
 BBA_italy_anti_colonialism_events.11.desc: "Meskipun pimpinan [FROM.GetAdjective] tidak menerima usulan perlindungan dan kerja sama kami, mereka telah menemui kami di tengah jalan dan mengganti pemerintahan mereka dengan pemerintahan yang serupa dengan kami dan lebih ramah terhadap kami."
 BBA_italy_anti_colonialism_events.11.a: "Masa depan cerah menanti orang-orang [FROM.GetAdjective]!"
 BBA_italy_anti_colonialism_events.12.desc: "Pemimpin [FROM.GetName] [FROM.GetLeader] dengan tegas menentang usulan kami mengenai perlindungan dan kerja sama dan dengan kata-kata yang tidak baik memerintahkan delegasi kami untuk pulang secepat mungkin."
 BBA_italy_anti_colonialism_events.12.a: "Waktu akan mengajari mereka betapa salahnya mereka."
 BBA_italy_anti_colonialism_events.12.b: "Itu adalah permintaan, bukan usulan."
 BBA_italy_anti_colonialism_events.13.t: "[FROM.GetName] Berusaha Mempererat Ikatan"
 BBA_italy_anti_colonialism_events.13.desc: "Tampaknya [FROM.GetAdjective] telah mendapatkan cukup banyak rasa hormat terhadap kekuatan dan kemampuan kita selama perang mereka dengan kita. Faktanya, mereka ingin menawarkan kita kesepakatan bersama mengenai non-agresi dan jaminan dalam menghadapi perang."
 BBA_italy_anti_colonialism_events.13.a: "Kedengarannya bagus!"
 BBA_italy_anti_colonialism_events.13.b: "Tidak di Bumi ini!"
 BBA_italy_anti_colonialism_events.14.desc: "[FROM.GetLeader] dengan bijak telah setuju untuk menandatangani pakta non-agresi bersama yang kami usulkan antara [FROM.GetName] dan [ROOT.GetName] serta jaminan bersama - jika salah satu dari kita menghadapi agresor."
 BBA_italy_anti_colonialism_events.15.desc: "[FROM.GetLeader] dengan tidak bijaksana telah menolak usulan pakta pertahanan antara [FROM.GetName] dan [ROOT.GetName]. Jaminan ini akan membawa stabilitas dan keamanan bagi kedua negara, namun kini kita harus menghadapi dunia ini sendirian."
 BBA_italy_anti_colonialism_events.15.a: "Kerugian mereka!"
 BBA_italy_anti_colonialism_events.15.b: "Jika mereka tidak bersama kita, mereka melawan kita!"
 BBA_italy_anti_colonialism_events_war_will_continue_tt: "Perang akan terus berlanjut."
 BBA_italy_anti_colonialism_events.20.t: "[FROM.GetNameDefCap] Mengecam Kolonialisme"
 BBA_italy_anti_colonialism_events.20.desc: "Tampaknya [FROM.GetName] yang baru dibentuk mempunyai kesadaran akan kebajikan dan tujuan baru dan telah mengambil tindakan untuk membongkar kerajaan kolonial milik orang lain. Delegasi Italia telah meminta kita untuk menolak cara-cara imperialisme kita dan menyambut masa depan yang penuh kerja sama dan kebebasan, bukannya penindasan dan penaklukan."
 BBA_italy_anti_colonialism_events.20.a: "Saatnya untuk memperbaikinya!"
 BBA_italy_anti_colonialism_events.20.b: "Apakah [FROM.GetAdjective] sudah kehilangan akal?!"
 BBA_italy_anti_colonialism_events.21.t: "Dekolonisasi Afrika"
 BBA_italy_anti_colonialism_events.21.desc: "[GetDecolonizationEventDesc]"
 BBA_italy_anti_colonialism_events.21.desc_accepted: "Ketika kami mulai mengutuk dan membubarkan kerajaan kolonial di Afrika, kami tidak yakin bagaimana tindakan tersebut akan ditanggapi. Mengingat betapa kerasnya negara-negara mempertahankan apa yang mereka anggap sebagai milik mereka, kita harus memandang upaya kita sebagai suatu keberhasilan. Bahkan pembebasan satu negara pun merupakan pencapaian yang luar biasa!"
 BBA_italy_anti_colonialism_events.21.desc_rejected: "Tampaknya upaya kami untuk mendekolonisasi benua Afrika dan memberikan kebebasan kepada masyarakat yang tertindas selalu dikesampingkan. Negara-negara kolonial lama jelas-jelas menyangkal cara mereka memperlakukan rakyatnya dan menolak mendengarkan alasan. Mereka harus bertanggung jawab!"
 BBA_italy_anti_colonialism_events.21.a: "Pekerjaan kita di sini sudah selesai."
 BBA_italy_anti_colonialism_events.21.b: "Baik itu cara yang sulit!"
 BBA_italy_anti_colonialism_events.52.t: "Afrika Utara Memilih untuk Bergabung [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.52.desc: "Masyarakat Afrika Utara telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.52.a: "Selamat datang saudara dan saudari!"
 BBA_italy_anti_colonialism_events.53.t: "Afrika Utara Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.53.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Afrika Utara telah menolak gagasan untuk tunduk pada kekuasaan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 BBA_italy_anti_colonialism_events.53.a: "Kami mengucapkan selamat tinggal pada mereka"
 BBA_italy_anti_colonialism_events.54.t: "Afrika Timur Memilih untuk Bergabung [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.54.desc: "Masyarakat Afrika Timur telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.55.t: "Afrika Timur Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.55.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Afrika Timur telah menolak gagasan untuk tunduk pada kekuasaan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 BBA_italy_anti_colonialism_events.56.t: "Afrika Barat Memilih untuk Bergabung [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.56.desc: "Masyarakat Afrika Barat telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.57.t: "Afrika Barat Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.57.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Afrika Barat telah menolak gagasan untuk tunduk pada kekuasaan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 BBA_italy_anti_colonialism_events.58.t: "Afrika Tengah Memilih untuk Bergabung dengan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.58.desc: "Masyarakat Afrika Tengah telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.59.t: "Afrika Tengah Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.59.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Afrika Tengah telah menolak gagasan untuk tunduk pada kekuasaan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 BBA_italy_anti_colonialism_events.60.t: "Afrika Selatan Memilih untuk Bergabung dengan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.60.desc: "Masyarakat Afrika Selatan telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.61.t: "Afrika Selatan Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.61.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Afrika Selatan telah menolak gagasan untuk tunduk pada peraturan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 BBA_italy_anti_colonialism_events.62.t: "Timur Tengah Memilih untuk Bergabung dengan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.62.desc: "Masyarakat Timur Tengah telah melihat betapa baik dan efisiennya kami mengatur tanah mereka dan telah memilih untuk bergabung dengan pemerintahan kami! Tampaknya investasi dan kepedulian kami terhadap provinsi mereka telah membuahkan hasil. Hal ini tentunya akan memberikan manfaat bagi kita semua."
 BBA_italy_anti_colonialism_events.63.t: "Timur Tengah Memilih untuk Meninggalkan [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.63.desc: "Meskipun mungkin bukan hal yang mengejutkan, kami sangat menyesal telah diberitahu bahwa masyarakat Timur Tengah telah menolak gagasan untuk tunduk pada kekuasaan kami lebih lama lagi. Mereka merasa diabaikan dan dieksploitasi selama beberapa waktu dan karena itu memilih untuk meninggalkan pemerintahan kita."
 ITA_release_colonies_north_africa_tt: "Koloni-koloni di Afrika Utara akan dibebaskan."
 ITA_release_colonies_east_africa_tt: "Koloni-koloni di Afrika Timur akan dibebaskan."
 ITA_release_colonies_west_africa_tt: "Koloni-koloni di Afrika Barat akan dibebaskan."
 ITA_release_colonies_central_africa_tt: "Koloni-koloni di Afrika Tengah akan dibebaskan."
 ITA_release_colonies_south_africa_tt: "Koloni di Afrika Selatan akan dibebaskan."
 BBA_italy_anti_colonialism_events.100.t: "[FROM.GetAdjective] Pejabat Menghubungi Kami"
 BBA_italy_anti_colonialism_events.100.desc: "Kami telah menerima delegasi dari [FROM.GetName] yang mencari hubungan lebih dekat dengan kami. Mereka telah berbicara panjang lebar tentang sejarah kita bersama dan betapa kuatnya kita jika kita bersatu satu sama lain. Tidak ada keraguan bahwa mereka melihat diri mereka sebagai pemimpin dari pakta potensial ini. Meskipun perjanjian seperti itu akan bermanfaat pada tingkat tertentu, kita akan kehilangan seluruh otonomi."
 BBA_italy_anti_colonialism_events.100.a: "Masyarakat Albania dan Italia akan bersatu!"
 BBA_italy_anti_colonialism_events.100.b: "Kami akan mengikuti pemerintahan baru Italia!"
 BBA_italy_anti_colonialism_events.100.c: "Omong kosong!"
 BBA_italy_anti_colonialism_events.101.t: "[FROM.GetNameDefCap] Terintegrasi ke [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.101.desc: "[FROM.GetLeader] yang hebat dan bijaksana dari [FROM.GetAdjective] orang telah setuju untuk bergabung dengan kami dan bersatu menjadi satu negara! Ini adalah hari yang penting bagi [ROOT.GetName] dan [FROM.GetName] keduanya!"
 BBA_italy_anti_colonialism_events.101.a: "Meraviglioso!"
 BBA_italy_anti_colonialism_events.102.t: "[FROM.GetAdjective] Pemerintah Mengupayakan Kerja Sama"
 BBA_italy_anti_colonialism_events.102.desc: "Pemerintah [FROM.GetAdjective] telah dengan bijak memilih untuk bergabung dengan kami, meskipun tidak bergabung menjadi satu negara tetapi dengan menerima kepemimpinan dan bimbingan [ROOT.GetAdjective]. Meskipun bukan hasil yang kami harapkan, hal ini akan memperkuat posisi kami di Mediterania tanpa menumpahkan darah."
 BBA_italy_anti_colonialism_events.102.a: "Kemenangan lain dari kelas pekerja!"
 BBA_italy_anti_colonialism_events.103.t: "[FROM.GetLeader] Menolak Pejabat kami"
 BBA_italy_anti_colonialism_events.103.desc: "Terlihat jelas bahwa masyarakat [FROM.GetAdjective] dipimpin oleh pemimpin yang tidak bijaksana dan egois. [FROM.GetLeader] menolak untuk melihat alasan dan bergabung dengan kami, yang akan memperkuat kedua negara dan menjamin perdamaian abadi di antara masyarakat kami."
 BBA_italy_anti_colonialism_events.103.a: "Akankah masyarakat [FROM.GetAdjective] menerima hal ini?"
 BBA_italy_anti_colonialism_events.103.b: "Hari-hari [FROM.GetLeader] mungkin akan segera berakhir."
 bba_news.107.t: "Kematian Paus"
 bba_news.107.desc: "Paus Pio XI meninggal dunia setelah memimpin Gereja Katolik selama hampir 20 tahun. Pada gilirannya sebagai Pontifex Maximus Pio XI mengakhiri perselisihan panjang antara Kepausan dan pemerintah Italia dan sangat penting dalam membangun Vatikan sebagai negara merdeka sekali lagi."
 bba_news.107.a: "Seorang Paus baru akan dibentuk"
 bba_news.107.b: "Tuhan bekerja dengan cara yang misterius"
 ITA_pope_dies_tt: "§Y$ITA_papa_pio_xii$§! menjadi Paus baru."
 bba_news.108.d: "Diplomat dari pemerintahan baru di Italia telah dikirim untuk bernegosiasi dengan penguasa Albania, Raja Zog, berupaya memperkuat hubungan antara kedua negara dan berusaha menekan Zog agar menerapkan kebijakan yang lebih sosialis di Albania.\n\nMungkin merasa bahwa masa Monarki Albania akan segera berakhir, atau mungkin hanya karena alasan sosialisme, Raja Zog menolak untuk berbicara dengan para pejabat Italia, dan mendesak rakyat Albania untuk menolak tekanan dari [ITA.GetNameDef].\n\nNamun demikian, pakar militer asing sepakat bahwa [ALB.GetNameDef] memiliki peluang kecil untuk melawan invasi jika pemerintah Italia mengambil tindakan."
 bba_news.108.b: "Monarki sudah usang!"
 bba_news.109.t: "[?ITA.ITA_var_deposed_leader.GetName] Digulingkan"
 bba_news.109.desc: "Dalam sebuah tindakan yang belum pernah terjadi sebelumnya, Dewan Besar Fasisme [FROM.GetName] telah merebut kekuasaan dan memecat [?ITA.ITA_var_deposed_leader.GetName] serta menjadikannya tahanan rumah. Tindakan ini dilatarbelakangi oleh upaya untuk menyelamatkan negara dari kegagalan militer dan ketidakmampuan Duce, yang telah menyebabkan ketegangan di dalam [FROM.GetName] dan beberapa pihak khawatir hal ini dapat menyebabkan Perang Saudara kecuali jika diambil langkah-langkah untuk meredakan situasi."
 bba_news.109.a: "Mengkhawatirkan!"
 bba_news.109.b: "Luar biasa!"
 bba_news.110.t: "[FROM.GetName] Perpecahan dalam Perang Saudara!"
 bba_news.110.desc: "Pemimpin [FROM.GetName] yang baru diangkat, [FROM.GetLeader], tidak mampu mengatasi meningkatnya ketegangan yang memecah belah [FROM.GetAdjective] baru-baru ini. Hal ini menyebabkan meletusnya Perang Saudara yang menghancurkan negara dari dalam. Berbagai kelompok, mulai dari komunis, royalis, hingga demokrat, semuanya bersaing untuk mendapatkan kekuasaan dan menciptakan aliansi yang berubah-ubah, sementara kaum fasis bertekad untuk mempertahankan kekuasaan mereka.\n\nMeskipun hasil dari Perang Saudara masih belum pasti, bantuan dari luar pasti akan memainkan peran utama dalam kemenangan di masa depan."
 bba_news.110.a: "Berita yang meresahkan memang."
 bba_news.110.b: "Kita harus menstabilkan situasi!"
 bba_news.110.c: "Ini memberikan peluang bagi kita!"
 bba_news.111.t: "Proklamasi Konfederasi Anarkis"
 bba_news.111.desc: "[GetAnarchistConfederationEventDesc]"
 bba_news.111.desc_joint_proclamation: "[From.GetName] dan [SPC.GetName] telah membuat proklamasi bersama tentang pembentukan Konfederasi Anarkis, di mana mereka berjanji untuk saling membantu dan saling membantu jika mereka diserang oleh kekuatan asing. Deklarasi bersama ini telah menyaksikan ribuan kaum anarkis berbondong-bondong ke Italia untuk mendukung proklamasi ini."
 bba_news.111.desc_single_proclamation: "Ribuan anarkis dari seluruh dunia berbondong-bondong ke [FROM.GetName] setelah pemerintah memproklamirkan berdirinya Konfederasi Anarkis. Dalam proklamasinya, mereka membuat pernyataan besar-besaran tentang menghancurkan kapitalisme dan mengalahkan fasisme di mana pun kejahatan ini ditemukan."
 bba_news.111.a: "Kita akan lihat berapa lama hal ini berlangsung"
 bba_news.666.t: "Paus Naik ke Kekuasaan"
 bba_news.666.desc: "Paus [FROM.GetLeader] telah mengejutkan para pemimpin dunia dengan menggulingkan raja [?ITA.ITA_var_deposed_leader.GetName] dari [FROM.GetName] dan mengambil alih kekuasaan untuk dirinya sendiri, mengklaim bahwa Tuhan menghendakinya. Meskipun banyak warga Italia yang juga terkejut, Kepausan mempunyai dukungan luas di negara tersebut dan beberapa orang memuji perubahan mendadak dalam pemerintahan ini sebagai awal dari era baru dan kejayaan bagi [FROM.GetNameDefCap]."
 bba_news.666.a: "Tentu saja tidak disangka-sangka"
 bba_news.200.t: "Hitler Mati"
 bba_news.200.desc: "Radio [GER.GetAdjective] telah menyiarkan berita bahwa Führer, Adolf Hitler, telah meninggal dunia. Berita ini muncul setelah pertempuran sengit di [GER.Capital.GetCapitalVictoryPointName] dan serangan yang lebih luas ke wilayah jantung [GER.GetAdjective] oleh pasukan sekutu dan [SOV.GetAdjective]. Berita tersebut diumumkan oleh [GER.GetLeader], yang dianggap sebagai penerus pilihan Führer, yang mengungkapkan kesedihan bangsa atas kehilangan Hitler dan merinci kematiannya di sebuah pos komando tempat dia mengatur pertahanan negara. Baik kematian Hitler maupun bagaimana kejadiannya tidak dapat diverifikasi. Namun, pengumuman tersebut pasti akan berdampak pada moral masyarakat [GER.GetAdjective]."
 bba_news.200.a: "Akankah [GER.GetAdjective] terus bertarung?"
 bba_news.200.b: "Jadi bajingan itu sudah mati? Sayang sekali kami tidak menangkapnya hidup-hidup!"
 bba_news.200.c: "Bisakah kita yakin dia sudah mati?"
 bba_news.200.d: "Ini tidak mengubah apa pun. Kami akan bertarung sampai orang terakhir."
 bba_news.201.t: "[POL.GetAdjective] Pemerintah Sejalan dengan [SOV.GetNameDef]"
 bba_news.201.desc: "Meskipun pemerintahan [POL.GetAdjective] di pengasingan beroperasi dari London selama perang, Sekutu telah memilih untuk mengakui [SOV.GetAdjective] komunis yang dipersiapkan sebagai pemerintahan sah [POL.GetName]. Sumber-sumber diplomatik menunjukkan bahwa kesepakatan telah dibuat antara Sekutu dan [SOV.GetName] mengenai pembagian Eropa pascaperang menjadi wilayah pengaruh. Sayangnya bagi pemerintahan [POL.GetAdjective] di London, batu sandungan utama terhadap perjanjian [SOV.GetAdjective] adalah keinginan [SOV.GetLeader] agar Polandia menjadi bagian dari wilayah pengaruh [SOV.GetAdjective].\n\nMeskipun banyak yang menganggap hal ini sebagai pengkhianatan terhadap [POL.GetName], yang lain berpendapat bahwa dengan pasukan [SOV.GetAdjective] sudah menduduki negara tersebut, maka terdapat tidak ada alasan untuk menolak ultimatum mereka dan membahayakan stabilitas masa depan Eropa."
 bba_news.201.a: "Pengorbanan yang disayangkan demi perdamaian di masa depan."
 bba_news.201.b: "Sekutu tidak bisa dipercaya."
 bba_news.201.c: "Kita tidak akan pernah lagi membiarkan diri kita rentan terhadap agresi fasis dari Eropa."
 ###ITALYS NEWS EVENTS####
 #PURGE THE PARTY
 bba_news.100.t: "[GetPurgeEventTitles]"
 bba_news.100.a: "[GetPurgeEventOptions]"
 bba_news.100.t_some_purged: "Pembersihan Partito Nazionale Fascista"
 bba_news.100.desc_some_purged: "Beberapa pendukung terdekat Mussolini telah disingkirkan dari partai fasis karena [ROOT.GetLeader] memperkuat cengkeramannya pada partai tersebut. Pembersihan ini tidak separah yang ditakutkan beberapa orang, namun membuat [ROOT.GetLeader] berada pada posisi yang lebih kuat untuk menjalankan agendanya sendiri di Italia."
 bba_news.100.a_some_purged: "Pembebasan yang bagus"
 bba_news.100.t_many_purged: "Pembersihan Besar-besaran Partito Nazionale Fascista"
 bba_news.100.desc_many_purged: "Beberapa petinggi partai fasis baru-baru ini digulingkan dari kekuasaan ketika [Root.GetLeader] muncul sebagai pemimpin absolut [ROOT.GetNameDefCap]. Pembersihan ini menghilangkan sekutu potensial dari Duce lama, Benito Mussolini, dan harapan untuk diangkat kembali sebagai pemimpin Italia."
 bba_news.100.a_many_purged: "Sebuah unjuk kekuatan"
 bba_news.100.t_none_purged: "Pembersihan yang Tidak Pernah Ada"
 bba_news.100.desc_none_purged: "Desas-desus tentang pembersihan besar-besaran untuk mengusir anggota setia Mussolini dari Partito Nazionale Fascista telah beredar akhir-akhir ini, namun tampaknya amnesti di seluruh partai justru ditawarkan. Hal ini mungkin membuat Partai lebih kuat namun melemahkan posisi [ROOT.GetLeader] sebagai pemimpinnya."
 bba_news.100.a_none_purged: "[ROOT.GetLeader] Yang Maha Penyayang memiliki kesan yang bagus."
 #FATE OF MUSSOLINI
 bba_news.101.t: "Mantan Pemimpin Italia Benito Mussolini Dieksekusi"
 bba_news.101.desc: "Setelah digulingkan dari kekuasaan di Italia, Benito Mussolini dimasukkan ke dalam tahanan rumah karena ketidakmampuan kriminal dan pengkhianatan karena tidak bertindak, menunggu nasibnya - yang akhirnya menyusulnya. Dini hari tadi, mantan pemimpin Italia itu menghadapi regu tembak di depan sekelompok kecil perwakilan pemerintah dan dimakamkan pada hari yang sama dalam sebuah upacara pribadi yang dihadiri oleh keluarga terdekatnya."
 bba_news.101.a: "Dan berakhirlah kehidupan Mussolini."
 bba_news.102.t: "[GetTrialOfMussoliniTitles]"
 bba_news.102.t_innocent: "Mussolini Dibebaskan karena Semua Alasan"
 bba_news.102.t_guilty: "Mussolini Dihukum Penjara"
 bba_news.102.desc: "[GetTrialOfMussoliniDesc]"
 bba_news.102.desc_innocent: "Yang mengejutkan semua orang, mantan Duce dinyatakan tidak bersalah atas semua tuduhan dan dibebaskan dalam segala hal. Mussolini kini bebas menjalani sisa hidupnya sebagai warga negara bebas [ROOT.GetNameDefCap]. Meskipun dia belum mengungkapkan rencana lebih lanjut, kita tidak bisa mengabaikan pengaruh Duce lama yang masih menguasai hati dan pikiran banyak orang."
 bba_news.102.desc_guilty: "Mungkin tidak mengejutkan siapa pun, mantan pemimpin Italia itu dinyatakan bersalah atas semua tuduhan. Mantan Duce mengaku tidak bersalah tetapi dijatuhi hukuman seumur hidup di penjara. Kita hanya bisa berasumsi bahwa rezim baru mempengaruhi persidangan tersebut dan pastinya cukup puas dengan hasilnya."
 bba_news.102.a: "Sidang palsu"
 bba_news.103.t: "[GetAssassinationOfMussoliniTitles]"
 bba_news.103.t_communists: "Mussolini Dibunuh Komunis!"
 bba_news.103.t_coverstory: "Mussolini Tewas Saat Mencoba Melarikan Diri!"
 bba_news.103.desc: "[GetAssassinationOfMussoliniDesc]"
 bba_news.103.desc_communists: "Mantan pemimpin [FROM.GetNameDefCap], Benito Mussolini, ditemukan tewas, tampaknya dieksekusi oleh Komunis. Rezim baru di bawah [FROM.GetLeader] telah bertindak cepat dan menangkap beberapa simpatisan Komunis karena suasana gelisah telah mencengkeram negara tersebut, dan banyak yang menyerukan keadilan dan pembalasan terhadap orang-orang yang dianggap sebagai musuh."
 bba_news.103.desc_coverstory: "Mantan pemimpin [FROM.GetNameDefCap], Benito Mussolini, mencoba melarikan diri dari tahanan rumah tempat dia ditempatkan setelah digulingkan dari kekuasaan. Sejumlah pria bersenjata menyerbu tempat tinggal Mussolini dan baku tembak pun terjadi. Dalam kekacauan itu, Mussolini tertembak dan meninggal karena luka-lukanya."
 bba_news.103.a: "Tentu saja berantakan."
 bba_news.104.t: "Program Militer Baru Diumumkan"
 bba_news.104.desc: "[ROOT.GetNameDefCap] menandatangani program kerjasama bersama dengan [FROM.GetNameDefCap] untuk memperkuat kemampuan militer kedua negara. Kesepakatan ini akan memungkinkan kedua negara untuk berbagi teknologi dan penelitian dengan lebih mudah dan tentunya akan memperkuat ikatan di antara mereka."
 bba_news.104.a: "Semua Sesuai Rencana"
 bba_news.105.t: "Pakta Non-Agresi Baru Ditandatangani"
 bba_news.105.desc: "[ROOT.GetNameDefCap] dan [FROM.GetNameDefCap] telah menandatangani pakta non-agresi, yang menjamin perdamaian antara kedua negara. Hal ini akan membuat mereka bebas untuk fokus pada hal lain, namun semua orang bertanya-tanya berapa lama perjanjian berbahaya ini akan bertahan."
 bba_news.105.a: "Keputusan yang bijaksana"
 bba_news.106.t: "[GetVittorioDiesEventTitles]"
 bba_news.106.t_king: "Raja Italia Meninggal"
 bba_news.106.t_emperor: "Kaisar Italia Meninggal"
 bba_news.106.desc: "[GetVittorioDiesEventDesc]"
 bba_news.106.desc_king: "Raja lama [FROM.GetName], Vittorio Emanuele III, telah meninggal. Membimbing Italia selama dua Perang Dunia, ia berperan sebagai simbol stabilitas dan titik temu bagi [FROM.GetAdjective] selama masa-masa sulit ini. Masyarakat yang berduka turun ke jalan untuk menunjukkan apresiasi dan dukungan mereka terhadap mendiang raja.\n\nBangsa ini berharap bahwa satu-satunya pewaris dan penerus raja lama, Pangeran Umberto, akan menjadi pendukung setia bagi rakyat [FROM.GetAdjective]. Sang pangeran akan segera dinobatkan sebagai Raja Umberto II - semoga dia memerintah selamanya!"
 bba_news.106.desc_emperor: "Kaisar lama [FROM.GetName], Vittorio Emanuele III, telah meninggal. Membimbing Italia selama dua Perang Dunia, ia berperan sebagai simbol stabilitas dan titik temu bagi [FROM.GetAdjective] selama masa-masa sulit ini. Orang-orang yang berduka turun ke jalan untuk menunjukkan penghargaan dan dukungan mereka terhadap mendiang kaisar.\n\nBangsa ini berharap bahwa satu-satunya pewaris dan penerus kaisar lama, Pangeran Umberto, akan menjadi pendukung setia bagi rakyat [FROM.GetAdjective]. Pangeran akan segera dinobatkan sebagai Kaisar Umberto I dari [FROM.GetName] - semoga dia memerintah!"
 bba_news.106.a: "Akhir dari sebuah era"
 bba_italian_formables_news.1.t: "Italia Irredenta telah tercapai"
 bba_italian_formables_news.1.desc: "Hari ini, pemimpin Italia [ITA.GetLeader] telah mengumumkan dimulainya proses untuk mengintegrasikan wilayah yang diklaim oleh Irredentis Italia ke dalam negara Italia. Ia menyatakan bahwa hal ini akan memperkuat posisi Italia sebagai kekuatan dunia, dan pada akhirnya mempersatukan rakyat Italia di bawah satu bendera. Banyak yang bertanya pada diri sendiri apakah negara sebesar ini benar-benar bisa bersatu, dan hanya waktu yang tahu apa yang akan terjadi pada Italia."
 bba_italian_formables_news.1.a: "Kami adalah hegemoni baru di Eropa!"
 bba_italian_formables_news.1.b: "Bangsa seperti ini pasti akan hancur"
##########################################################################
###############       Switzerland       ##################################
##########################################################################
 #Triggered by focus "Swiss Guiding Principles" 
 BBA_switzerland.1.t: "[ROOT.GetAdjective] Prinsip Panduan"
 BBA_switzerland.1.desc: "Situasi politik di dalam dan sekitar [ROOT.GetNameDefCap] memburuk dengan cepat. Ada semakin banyak gerakan yang menganjurkan prinsip-prinsip panduan untuk mengarahkan kapal ke arah yang benar selama badai akan datang, namun pertanyaannya adalah, yang mana?.\n\nKami tidak tahu apa yang akan dilakukan tetangga kami, namun kami harus memutuskan sekarang tindakan apa yang akan memungkinkan [ROOT.GetName] untuk bertahan hidup."
 BBA_switzerland.1.a: "Kita harus melindungi nilai-nilai demokrasi dan netral kita"
 BBA_switzerland.1.b: "Mungkin kita harus lebih aktif dalam melindungi demokrasi kita"
 BBA_switzerland.1.c: "Netralitas tidak dapat dipertahankan dalam kondisi seperti ini"
### David Frankfurter Case ###
#Assassination 
 BBA_switzerland.2.t: "Perwakilan Partai Nazi di Swiss dibunuh"
 BBA_switzerland.2.desc: "David Frankfurter, seorang Yahudi Kroasia yang tinggal di Bern, menyerahkan diri ke Polisi Graubünden dan mengakui pembunuhan Wilhelm Gustloff, pemimpin Organisasi Luar Negeri Partai Nazi di Swiss.\n\nDia mengutip keyakinan buruk Partai Nazi terhadap orang-orang Yahudi dan peran Gustloff dalam menyebarkan mereka di [SWI.GetName] sebagai alasan penembakan.\n\nPilihan kami untuk melanjutkan permasalahan yang berpotensi panjang ini akan digunakan oleh [GER.GetNameDef] dan seluruh dunia sebagai cara untuk mengukur dedikasi kami terhadap netralitas dan supremasi hukum."
 BBA_switzerland.2.a: "Dia akan menjalani persidangan yang adil."
 BBA_switzerland.2.b: "Tutupi semuanya, rekrut dia sebagai agen!"
 BBA_switzerland.2.c: "Dia mengaku, sebaiknya segera mendapat hukuman maksimal."
#Trial Approaches
 BBA_switzerland.3.t: "Sidang David Frankfurter semakin dekat"
 BBA_switzerland.3.desc: "Pengadilan terhadap David Frankfurter, yang pada bulan Februari membunuh seorang perwakilan Partai Nazi di Davos, sudah dekat. Kami telah berjanji kepadanya untuk menjalani persidangan yang adil dan netral, namun tentu saja ada pilihan lain.\n\nKita bisa diam-diam membebaskannya dan merekrutnya untuk operasi intelijen, atau sebaliknya, kita bisa mencoba menenangkan [?SWI.SWI_fascist_germany.GetNameDef] dengan membatalkan persidangan dan langsung menjatuhkan hukuman padanya.\n\nApa pun yang kita lakukan, menyenangkan semua pihak mungkin di luar kemampuan kita."
 BBA_switzerland.3.a: "Uji coba akan berlanjut sesuai rencana"
 BBA_switzerland.3.b: "Dia akan menjadi aset bagi upaya intelijen kita"
 BBA_switzerland.3.c: "Kalau dipikir-pikir, dia jelas-jelas bersalah"
#Germany thanks Switzerland for swift action
 BBA_switzerland.4.t: "[?SWI.SWI_fascist_germany.GetLeader] senang dengan keputusan [SWI.GetName]"
 BBA_switzerland.4.desc: "Pemimpin [?SWI.SWI_fascist_germany.GetNameDef], [?SWI.SWI_fascist_germany.Getleader] telah menyatakan [?SWI.SWI_fascist_germany.Getleader.GetHerHis] terima kasih kepada [SWI.GetNameDef] karena dengan cepat menangani pembunuh Wilhelm Gustloff, jadi tidak ada keraguan di mana posisi [SWI.GetName] dalam masalah seperti ini. Penghilangan nilai-nilai hak asasi manusia dan demokrasi tentu akan memperbaiki sikap [?SWI.SWI_fascist_germany.GetName] terhadap kami.\n\nMeskipun [?SWI.SWI_fascist_germany.Getleader.GetHerHis] mendapat tanggapan positif, sudah jelas bahwa hasil ideal bagi Partai Nazi adalah ekstradisi ke [?SWI.SWI_fascist_germany.GetNameDef], meskipun, untuk saat ini, hal tersebut tidak mungkin dilakukan untuk [SWI.GetNameDef]."
 BBA_switzerland.4.a: "Sekarang sudah selesai"
 #Germany is notified Switzerland decides to continue with the trial. 
 BBA_switzerland.5.t: "[SWI.GetName] memutuskan untuk melanjutkan persidangan pembunuh Gustloff"
 BBA_switzerland.5.desc: "Pihak berwenang di [SWI.GetName] telah mengumumkan bahwa David Frankfurter, yang mengaku membunuh Organisasi Asing Partai Nazi di Davos, akan diadili secara adil dan seimbang berdasarkan hukum Graubünden seperti kasus pembunuhan lainnya.\n\nMengingat Gustloff adalah seorang pejabat Partai Nazi, dan pengaruh kita terhadap tetangga kita yang tidak berdaya, kita dapat mengirim pengacara untuk mewakili janda Gustloff dan mendorong hasil ideal kita. Dengan cara ini, kita dapat memastikan hukumannya sesuai dengan kejahatannya.\n\nSecara lebih pragmatis, hal ini juga dapat memaksa [SWI.GetNameDef] untuk memihak, yang pada akhirnya menghancurkan fasad netralitas tipis yang selalu mereka banggakan."
 BBA_switzerland.5.a: "Dia layak mendapatkan keadilan atas kejahatan keji ini!"
 BBA_switzerland.5.b: "Tidak perlu ikut campur dalam urusan [SWI.GetAdjective]"
 #Germany INSISTS on harsher trial  
 BBA_switzerland.6.t: "[GER.GetAdjective] dorong hukuman berat untuk David Frankfurter"
 BBA_switzerland.6.desc: "Perwakilan hukum dari janda Gustloff, yang tidak diragukan lagi dikirim oleh [?SWI.SWI_fascist_germany.GetNameDef], mencoba mendorong Dewan Federal untuk mengarahkan pengadilan agar menjatuhkan hukuman yang berat bagi David Frankfurter. Ini adalah permintaan yang sangat tidak biasa, yang tidak diragukan lagi merupakan upaya [?SWI.SWI_fascist_germany.GetNameDef] untuk memproyeksikan kekuasaan atas kami.\n\nMenerima hal ini mungkin berdampak pada reputasi internasional kita, namun kita harus memastikan apakah kita mampu menolaknya jika itu yang kita putuskan."
 BBA_switzerland.6.a: "Ini adalah masalah pengadilan"
 BBA_switzerland.6.b: "Kami akan mempertimbangkannya"
#Frankfurter "dies" under mysterious circumstances
 BBA_switzerland.7.t: "Frankfurter Dibunuh Secara Misterius di Penjara"
 BBA_switzerland.7.desc: "Pihak berwenang di Graubünden melaporkan bahwa David Frankfurter, yang ditahan setelah mengakui pembunuhan perwakilan Partai Nazi Wilhelm Gustloff, ditemukan tewas di selnya pagi ini. Apakah hal ini dilakukan sendiri, atau disebabkan oleh simpatisan Nazi yang marah di dalam penjara, masih belum diketahui untuk saat ini, namun Polisi Federal berjanji akan menemukan jawabannya.\n\nKami tidak memiliki bukti kesalahan apa pun, namun kejadian ini sangat misterius, dan beberapa orang sangat curiga terhadap pemerintah [SWI.GetAdjective] karena tidak mengizinkan perwakilan [?SWI.SWI_fascist_germany.GetAdjective] memeriksa tubuh atau tempat kejadian perkara."
 BBA_switzerland.7.a: "Oh baiklah"
#Frankfurter Trial 
 BBA_switzerland.8.t: "Pengadilan David Frankfurter"
 BBA_switzerland.8.desc: "Seluruh [SWI.GetName] dan tetangganya memperhatikan persidangan David Frankfurter. Hasil persidangan ini tidak hanya akan mengungkap nasib pihak yang dinyatakan bersalah, namun juga nasib [SWI.GetNameDef] secara keseluruhan, dan sejauh mana mereka mau berkompromi dengan institusi dan tradisinya.\n\nSemua tanda dari pengadilan mengarah pada hukuman penjara yang adil, namun pengaruh dari dewan dapat mengubah hasil persidangan, dan mungkin esensi negara."
 BBA_switzerland.8.a: "Biarkan pengadilan mengambil keputusan"
 BBA_switzerland.8.b: "Dia telah melakukan pengabdian pada Demokrasi. Dia harus dimaafkan!"
 BBA_switzerland.8.c: "Kami tidak bisa mengambil risiko mengasingkan [?SWI.SWI_fascist_germany.GetNameDef]. Dia akan mendapat hukuman maksimal"
#To SWI: Germany is angry
 BBA_switzerland.9.t: "[SWI.GetName] memancing kemarahan kami!"
 BBA_switzerland.9.desc_default: "[SWI.GetNameDefCap], meskipun kami menyerukan keadilan, dan pretensi mereka untuk netralitas dan supremasi hukum, telah memaafkan David Frankfurter, yang tidak hanya membunuh seorang anggota Partai Nazi, namun dengan rela mengakuinya!\n\nIni membuktikan bahwa mereka telah memihak, dan akan menjadi permainan yang adil dalam potensi perang yang akan datang. Kita tidak bisa membiarkan penghinaan terhadap [?SWI.SWI_fascist_germany.GetNameDef] ini dibiarkan begitu saja."
 BBA_switzerland.9.desc_alt: "Agen kami di [SWI.GetName] melaporkan bahwa, meskipun mereka berpura-pura netral dan supremasi hukum, [SWI.GetNameDef] secara diam-diam membebaskan David Frankfurter, yang mengaku sebagai pembunuh Wilhem Gustloff, dari penjara dengan memalsukan kematiannya dan telah merekrutnya sebagai agen intelijen.\n\nIni membuktikan bahwa mereka tidak dapat dipercaya dan harus disingkirkan jika kita mendapat kesempatan. Kita tidak bisa membiarkan penghinaan terang-terangan terhadap [?SWI.SWI_fascist_germany.GetNameDef] ini dibiarkan begitu saja."
 BBA_switzerland.9.a: "Mereka akan membayar!"
#To SWI: Germany is pleased
 BBA_switzerland.10.t: "[?SWI.SWI_fascist_germany.GetNameDefCap] puas dengan keputusan [SWI.GetNameDef]"
 BBA_switzerland.10.desc: "Perwakilan dari [?SWI.SWI_fascist_germany.GetNameDef] dan janda Gustloff telah menyatakan terima kasih mereka kepada [SWI.GetNameDef] atas hukuman tegas mereka terhadap Frankfurter, jadi tidak ada keraguan di mana [SWI.GetNameDef] berdiri dalam masalah seperti ini. Hal ini tentunya akan meningkatkan sikap [?SWI.SWI_fascist_germany.GetName] terhadap [SWI.GetName].\n\nMeskipun [?SWI.SWI_fascist_germany.Getleader.GetHerHis] mendapat tanggapan positif, sudah jelas bahwa hasil ideal bagi Partai Nazi adalah ekstradisi ke [?SWI.SWI_fascist_germany.GetNameDef]."
 BBA_switzerland.10.a: "Mungkin ini akan menjamin keselamatan kita"
#Trial Verdict 
 BBA_switzerland.11.t: "David Frankfurter dijatuhi hukuman penjara"
 BBA_switzerland.11.desc_SWI: "Ketika dewan memutuskan untuk tidak ikut campur dalam kasus ini dan menyerahkannya kepada pengadilan dan hukum Grison, David Frankfurter, yang dengan sengaja membunuh Wilhelm Gustloff, dijatuhi hukuman 18 tahun penjara.\n\nKami tahu [?SWI.SWI_fascist_germany.GetNameDef] menginginkan hukuman yang lebih berat, jadi para diplomat kami akan melakukan pekerjaan yang sesuai untuk menenangkan mereka, namun kami tidak bisa mengambil risiko untuk terlihat memihak pada saat seperti ini. Netralitas kita adalah hal yang mungkin membuat masyarakat [SWI.GetAdjective] tetap aman selama badai yang mungkin datang."
 BBA_switzerland.11.desc_GER: "[SWI.GetNameDefCap] berani memberikan hukuman 18 tahun yang remeh kepada pembunuh Gustloff! Sangat disayangkan, namun kami tidak bisa memaksakan hukuman yang lebih berat, karena berisiko memicu seruan untuk memboikot Olimpiade.\n\nUntuk saat ini, setidaknya kita bisa menjadikan Gustloff sebagai martir [?SWI.SWI_fascist_germany.GetNameDef] dan menggunakan pembunuhan itu untuk propaganda. Mungkin dalam invasi di masa depan kita bisa menguasai Frankfurter dan kita bisa mendapatkan keadilan."
 BBA_switzerland.11.a: "Ini adalah hal terbaik yang dapat kami lakukan saat ini"
 BBA_switzerland.11.b: "Kami tidak akan melupakan ini!" #THE GALLLLL!!!!
#After the war
 BBA_switzerland.12.t: "David Frankfurter meminta pengampunan"
 BBA_switzerland.12.desc: "Kini setelah perang usai dan $GER_fascism_DEF$ tidak ada lagi, David Frankfurter, dengan bantuan penasihat hukumnya, George Brunschvig, telah meminta pengampunan atas pembunuhan Wilhelm Gustloff pada tahun 1936.\n\nKarena kita tidak lagi dikelilingi oleh rezim fasis, dan kejahatan Frankfurter telah dikontekstualisasikan ulang berkat kekejaman Nazi yang ditemukan selama perang, hampir tidak ada risiko dalam menawarkan dia mendapat grasi, dan kami bahkan bisa melarang dia masuk kembali [ROOT.GetName], untuk berjaga-jaga."
 BBA_switzerland.12.a: "Dia akan diampuni"
 BBA_switzerland.12.b: "Dia akan menyelesaikan hukumannya"
 BBA_switzerland.13.t: "[SWI.GetNameDefCap] menerima permintaan kami"
 BBA_switzerland.13.desc: "Perwakilan yang kami kirim untuk memberi nasihat kepada janda Gustloff telah kembali dengan membawa kabar baik. Putusan hakim di [SWI.GetName] memberikan hukuman yang sangat berat kepada David Frankfurter, cukup dekat dengan yang kami minta."
 BBA_switzerland.13.a: "Mungkin kita tidak perlu melakukan invasi sama sekali"
 SWI_frankfurter_trial_will_continue_TT: "§YDavid Frankfurter§! akan diadili dan peristiwa akan terungkap seiring berjalannya waktu."
 SWI_frankfurter_immediate_harsh_sentence_TT: "§YDavid Frankfurter§! akan diberikan hukuman maksimal tanpa pengadilan."
 SWI_frankfurter_german_expectations_TT: "§Y[GER.GetNameDefCap]§! akan mengharapkan hukuman yang lebih berat untuk §YDavid Frankfurter§!"
 #### Other Events ####
 BBA_switzerland.14.t: "Petisi 200"
 BBA_switzerland.14.desc: "Dewan Federal telah menerima petisi yang ditandatangani oleh 200 anggota dari beberapa kelompok sayap kanan yang berharap dapat mendorong [ROOT.GetNameDef] menuju hubungan yang lebih bersahabat dengan [SWI_get_fascist_neighbor] namun tetap relatif netral. Mereka ingin mencapai hal ini dengan menerapkan sensor yang keras terhadap pemberitaan negatif apa pun terhadap mereka, untuk menghindari kemarahan mereka."
 BBA_switzerland.14.a: "Kita harus menenangkan mereka sambil mengabaikan permintaan mereka"
 BBA_switzerland.14.b: "Mereka punya beberapa poin bagus"
 BBA_switzerland.14.c: "Ini adalah musuh Swiss, tangkap mereka!"
 #Espionage stuff 
 BBA_switzerland.15.t: "[FROM.GetName] menawarkan untuk meminjamkan kami seorang agen"
 BBA_switzerland.15.desc: "Meskipun posisi mereka netral, [FROM.GetNameDef] diam-diam menawarkan kesempatan untuk mempekerjakan salah satu agen mereka untuk misi intelijen kami.\n\nHal ini sangat bermanfaat bagi kami, karena populasi [SWI.GetNonIdeologyName] berbagi bahasa dengan [GER.GetNonIdeologyName], [FRA.GetNonIdeologyName] dan [ITA.GetNonIdeologyName], sehingga mereka memiliki keuntungan dalam menyusup ke negara-negara tersebut."
 BBA_switzerland.15.a: "Kita bisa menggunakan agen [GER.GetAdjective]"
 BBA_switzerland.15.b: "Seorang operator [ITA.GetAdjective] akan berguna"
 BBA_switzerland.15.c: "Mungkin agen [FRA.GetAdjective]"
 BBA_switzerland_fra.15.tt: "Akan mendapatkan agen lokal dengan kewarganegaraan §Y[FRA.GetAdjectiveCap]§! dan §Y[SWI.GetAdjectiveCap]§!"
 BBA_switzerland_ita.15.tt: "Akan mendapatkan agen lokal dengan kewarganegaraan §Y[ITA.GetAdjectiveCap]§! dan §Y[SWI.GetAdjectiveCap]§!"
 BBA_switzerland_ger.15.tt: "Akan mendapatkan agen lokal dengan kewarganegaraan §Y[GER.GetAdjectiveCap]§! dan §Y[SWI.GetAdjectiveCap]§!"
 BBA_switzerland.16.t: "[FROM.GetNameDefCap] mencari perjanjian rahasia"
 BBA_switzerland.16.desc: "Salah satu agen rahasia kami yang ditempatkan di [FROM.capital.GetCapitalVictoryPointName] telah didekati dengan usulan dari pemerintah [FROM.GetAdjective]; Sebuah perjanjian rahasia antara faksi kita dan [FROM.GetNameDef], yang berarti mereka akan membantu kita melemahkan musuh-musuh kita di Eropa, sambil menjaga kesan netralitas mereka, dan bahkan mengabaikannya demi kepentingan kita ketika saatnya tiba.\n\nIni juga berarti bahwa kita akan membela mereka jika mereka berisiko diserang."
 BBA_switzerland.16.a: "Mereka akan menjadi aset yang besar"
 BBA_switzerland.16.b: "Kami tidak membutuhkan bantuan mereka"
 BBA_switzerland.17.t: "[FROM.GetNameDefCap] telah menerima perjanjian rahasia kita"
 BBA_switzerland.17.desc: "Melalui saluran belakang kami dengan [FROM.GetNameDef], kami mendapat konfirmasi bahwa mereka telah menyetujui usulan aliansi rahasia kami. Mulai sekarang, mereka akan mendapatkan dukungan kita melawan musuh-musuh mereka, dan melindungi kita jika kita berada di ambang invasi. Namun hal ini tidak berarti kita aman, musuh bisa saja mengungkapkan tindakan kita dan melihatnya sebagai ancaman, jadi kita harus tetap berhati-hati seperti yang telah kita tunjukkan sejauh ini, sambil bersiap untuk mengambil tindakan."
 BBA_switzerland.17.a: "Ini demi demokrasi kita!"
 BBA_switzerland.18.t: "[FROM.GetNameDefCap] telah menolak proposal kami!"
 BBA_switzerland.18.desc: "Berita buruk dari kontak kami di [FROM.GetCapitalVictoryPointName]. Tampaknya pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk membuat perjanjian rahasia, sehingga membuat kami rentan terhadap invasi dari tetangga kami. Kita sekarang harus bersiap untuk membela diri, atau mencari jalan lain untuk menjaga kemerdekaan dan demokrasi kita."
 BBA_switzerland.18.a: "Kami berdiri sendiri melawan musuh kami."
 ### Diplomatic Events ### 
 BBA_switzerland.19.t: "[FROM.GetNameDefCap] Mengundang Kami untuk Bergabung dengan Entente mereka"
 BBA_switzerland.19.desc: "Secara historis, [FROM.GetName] sangat netral, namun tampaknya mereka telah memutuskan untuk melanggarnya, sebagai respons terhadap situasi dunia saat ini, dan tampaknya meminta negara-negara netral lainnya untuk melanggar kebijakan mereka. Jika bergabung dengan faksi mereka merupakan sebuah lompatan besar dari sikap netral, kita juga bisa menjamin independensi satu sama lain."
 BBA_switzerland.19.a: "Saat-saat yang tidak biasa memerlukan tindakan yang tidak biasa"
 BBA_switzerland.19.b: "Jaminan harus mencukupi"
 BBA_switzerland.19.c: "Netralitas kita mungkin menjadi satu-satunya perlindungan kita."
 BBA_switzerland.20.t: "[FROM.GetName] Tidak Akan Bergabung dengan Entente Kami tetapi Menawarkan Jaminan"
 BBA_switzerland.20.desc: "Setelah kami diundang untuk bergabung dengan [ROOT.GetFactionName], [FROM.GetNameDef] memberi tahu kami bahwa, meskipun menolak tawaran kami, mereka akan menjamin independensi kami selama kami menjamin independensi mereka. Kompromi agar mereka tetap netral."
 BBA_switzerland.20.a: "Itu harus dilakukan"
 BBA_switzerland.21.t: "[FROM.GetName] yang putus asa Meminta Jaminan Kami"
 BBA_switzerland.21.desc: "Karena [?FROM.SWI_angriest_country.GetNameDef] mengancam perang melawan [FROM.GetName] karena apa yang mereka anggap sebagai daftar pelanggaran netralitas yang semakin meningkat, [From.GetNameDef] meminta kami berjanji untuk melindungi mereka dari penghasutan perang dengan menjamin kemerdekaan [FROM.GetAdjective]."
 BBA_switzerland.21.a: "Mereka membutuhkan perlindungan kita"
 BBA_switzerland.21.b: "Kami tidak dapat mengambil risiko konflik dengan [?FROM.SWI_angriest_country.GetName]"
 BBA_switzerland.22.t: "[FROM.GetNameDefCap] Janji Melindungi Kita!"
 BBA_switzerland.22.desc: "Kabel diplomatik telah tiba dari [FROM.GetName] membawa kabar baik. Mereka sepakat untuk menjamin kemerdekaan kami, berjanji akan membela kami jika ada yang menyerang kami, termasuk [?SWI.SWI_angriest_country.GetName]."
 BBA_switzerland.22.a: "Kami mungkin diselamatkan."
 BBA_switzerland.23.t: "[FROM.GetNameDefCap] Menolak Komitmen Apa Pun terhadap Tujuan Kami!"
 BBA_switzerland.23.desc: "Sayangnya, [FROM.GetName] telah memutuskan untuk mengabaikan penderitaan kami terhadap [?SWI.SWI_angriest_country.GetNameDef]. Mereka tidak akan berdiri di samping kita melawan ancaman mereka."
 BBA_switzerland.23.a: "Kami hanya bisa mengandalkan diri kami sendiri"
 BBA_switzerland.24.t: "[?SWI.SWI_angriest_country.GetNameDefCap] Menganggap Kami Melanggar Netralitas"
 BBA_switzerland.24.desc: "Netralitas kita tidak hanya dipertahankan oleh sikap kita yang setara terhadap negara lain, namun juga oleh persepsi mereka terhadap negara tersebut. Menurut [?SWI.SWI_angriest_country.GetNameDef], kami telah mengingkari janji netralitas kami dan lebih mengutamakan musuh daripada mereka. Mereka telah menyampaikan bahwa kecuali mereka segera ditenangkan, mereka tidak akan lagi menganggap kami sebagai negara netral dan bahkan menyatakan perang terhadap kami."
 BBA_switzerland.24.a: "Mengkhawatirkan!"
 BBA_switzerland.25.t: "[?SWI.SWI_angriest_country.GetNameDefCap] Tidak Lagi Menganggap Kami Netral"
 BBA_switzerland.25.desc: "Berita buruk, ketika [?SWI.SWI_angriest_country.GetName] mengumumkan penghinaan mereka terhadap [ROOT.GetNameDef], mereka telah menyatakan bahwa kita siap untuk melakukan perselisihan dan bahkan penaklukan politik."
 BBA_switzerland.25.a: "Kita berada di perairan yang belum dipetakan!"
 ### [REDACTED] Events ###
 BBA_switzerland.97.t: "Veteran Angkatan Laut Austria Menawarkan Jasanya"
 BBA_switzerland.97.desc: "Dengan kedok tur Eropa bersama keluarganya yang berbakat musik, seorang Kapten Kapal Selam veteran telah melintasi perbatasan kami dari Austria dan menawarkan jasanya kepada [ROOT.GetNameDef] dengan imbalan suaka.\n\nGeorg Von Trapp memiliki rekor yang mengesankan dengan Angkatan Laut Austro-Hungaria, tetapi sejak akhir Perang Besar, pembubaran kekaisaran dan hilangnya kekayaannya, dia tampil bersama keluarga penyanyi dan musisi. Sejak aneksasi [GER.GetNameDef] atas Austria, dia dipaksa untuk bertugas di Austria, sehingga dia melarikan diri.\n\nTentu saja bakat musik keluarganya akan dihargai seperti pengalaman angkatan lautnya, terutama karena kita berada di pantai dan tidak ada staf yang mempertahankannya."
 BBA_switzerland.97.a: "Ombaknya akan hidup dengan suara torpedo kita"
 BBA_switzerland.97.b: "Dia dan keluarganya bisa tinggal di Swiss dan tetap tampil"
 #### Election Stuff ###
 BBA_SWI_annual_election.1.t: "Pemilihan Presiden Konfederasi Swiss"
 BBA_SWI_annual_election.1.desc: "Setiap tahun, Majelis Federal Swiss memilih salah satu anggota dewan untuk menjadi Presiden Konfederasi Swiss, yang pertama di antara yang sederajat, [?ROOT.SWI_confederation_president.GetSheHe] akan menggunakan [?ROOT.SWI_confederation_president.GetHerHis] kekuasaan terbatas untuk mewakili dewan dan memutuskan hubungan apa pun di dewan untuk mengarahkan dewan dengan lembut menuju keselamatan atau kejayaan.\n\n[SWI_get_extra_election_paragraph]Siapa yang harus dipilih oleh Majelis untuk menjadi wajah Konfederasi Swiss tahun ini?"
 BBA_SWI_annual_election.1.a: "Pilih [SWI_GetCouncilor1name]"
 BBA_SWI_annual_election.1.b: "Pilih [SWI_GetCouncilor2name]"
 BBA_SWI_annual_election.1.c: "Pilih [SWI_GetCouncilor3name]"
 SWI_first_election_text: "Begitu seorang anggota dewan menjadi presiden konfederasi, mereka tidak akan dapat lagi ditugaskan sebagai Penasihat Politik, namun mereka akan mempunyai Keputusan yang kuat. Jika slot Penasihat Politik terlalu lama kosong, Anda akan dikenakan penalti, jadi pastikan untuk mengisi posisi tersebut dengan cepat."
 BBA_SWI_annual_election.2.t: "Pemungutan suara darurat untuk Presiden Konfederasi!"
 BBA_SWI_annual_election.2.desc: "Setelah penggulingan [?SWI_ousted_president.GetName] yang belum pernah terjadi sebelumnya, dan periode ketidakstabilan politik di Dewan Federal, sekarang saatnya untuk memilih Presiden Konfederasi yang baru. Mari kita berharap mereka dapat memperbaiki jalannya [SWI.GetNameDef] dan mereka bukanlah orang terakhir yang memegang posisi tersebut."
 BBA_SWI_annual_election.2.a: "Pilih [SWI_GetCouncilor1name]"
 BBA_SWI_annual_election.2.b: "Pilih [SWI_GetCouncilor2name]"
 BBA_SWI_annual_election.2.c: "Pilih [SWI_GetCouncilor3name]"
 ######## TRADE #######
 BBA_switzerland_trade.1.t: "[FROM.GetNameDefCap] mencari perjanjian perdagangan dengan [ROOT.GetName]"
 BBA_switzerland_trade.1.desc: "Terlepas dari netralitas historis mereka, [FROM.GetNameDefCap] berupaya untuk membuat perjanjian perdagangan dengan negara kita. Entah mereka berusaha untuk menyelaraskan diri dengan kita, atau mereka lebih putus asa dari yang kita duga.\n\nApapun yang terjadi, kita akan mendapatkan keuntungan dengan memanfaatkan kapasitas industri dan lokasi mereka yang strategis tanpa harus melalui cobaan berat untuk menyerang negara yang memiliki pertahanan ketat. Di sisi lain, hal ini dapat berarti memperkuat posisi mereka jika terjadi invasi di masa depan oleh [ROOT.GetNameDef]"
 BBA_switzerland_trade.1.a: "Pabrik mereka akan menjadi bahan bakar mesin perang kita"
 BBA_switzerland_trade.1.b: "Perekonomian sipil kita akan saling membantu"
 BBA_switzerland_trade.1.c: "Kami tidak membutuhkan bantuan dari negara netral yang tidak berdaya"
 BBA_switzerland_trade.1.d: "Kami tidak bisa mempercayai [FROM.GetName]"
 BBA_switzerland_trade.2.t: "[FROM.GetName] melanggar perjanjian perdagangan dengan kami sebelum waktunya"
 BBA_switzerland_trade.2.desc: "Tampaknya [FROM.GetName] menolak untuk melanjutkan perjanjian perdagangan yang kami buat dengan mereka, meskipun ada banyak manfaat bagi kedua belah pihak.\n\nTidak banyak yang bisa kita lakukan saat ini, namun kurangnya komitmen ini tentu akan diingat oleh [ROOT.GetNameDef]."
 BBA_switzerland_trade.2.a: "Sayang sekali"
 BBA_switzerland_trade.2.b: "Kami tidak akan membiarkan mereka membodohi kami lagi"
 BBA_switzerland_trade.3.t: "Perjanjian perdagangan kami yang sedang berlangsung dengan [FROM.GetName]"
 BBA_switzerland_trade.3.desc: "Perjanjian dagang yang kami jalin dengan [FROM.GetNameDef] selama setahun terakhir sangat bermanfaat bagi [ROOT.GetName], dan sekarang saatnya memutuskan apakah kami harus memperbaruinya atau tidak.\n\nTerlepas dari manfaat perjanjian bilateral tersebut, dan betapa negara seperti kita membutuhkannya, kita harus menyadari bahwa hal ini mungkin dianggap sebagai pelanggaran lebih lanjut terhadap netralitas kita oleh beberapa negara. Kita harus memastikan bahwa mengasingkan mereka dapat dilakukan dan bermanfaat."
 BBA_switzerland_trade.3.a: "Ya, kita memerlukan persediaan ini untuk kelangsungan hidup kita"
 BBA_switzerland_trade.3.b: "Tidak, ini terlalu berisiko"
 BBA_switzerland_trade.4.t: "[FROM.GetName] ingin memperbarui perjanjian dagang kita"
 BBA_switzerland_trade.4.desc: "Tampaknya perjanjian perdagangan [FROM.GetName] dengan kami sangat bermanfaat bagi mereka, mengingat mereka bersedia mengambil risiko melanggar netralitas lagi dan mengamankan pasokan dari kami.\n\nPerjanjian ini tidak mempunyai banyak kelemahan bagi kami, kecuali kami menyediakan alat untuk pertahanan mereka terhadap potensi invasi kami terhadap [FROM.GetName]."
 BBA_switzerland_trade.4.a: "Mari kita perbarui perjanjiannya"
 BBA_switzerland_trade.4.b: "Ubah fokus ke Produksi Sipil"
 BBA_switzerland_trade.4.c: "Ubah fokus ke Produksi Militer"
 BBA_switzerland_trade.4.d: "Masalah kita sudah tidak ada gunanya lagi"
 BBA_switzerland_trade.5.t: "[FROM.GetName] telah meninggalkan perjanjian perdagangan kita"
 BBA_switzerland_trade.5.desc: "Meskipun kami telah memberikan [FROM.GetName] dalam perjanjian perdagangan bersama, mereka telah memutuskan untuk tidak memperbarui perjanjian tersebut dan lebih memilih untuk melakukannya sendiri.\n\nDi luar jangkauan kita mengapa mereka memutuskan melakukan hal seperti itu, tapi mungkin itu yang terbaik."
 BBA_switzerland_trade.5.a: "Itu kerugian mereka!"
 BBA_switzerland_trade.6.t: "[FROM.GetNameDefCap] telah menerima proposal perjanjian perdagangan kami!"
 BBA_switzerland_trade.6.desc: "Delegasi kami kini kembali dari [FROM.GetName] membawa kabar gembira. Perjanjian perdagangan ini akan memungkinkan kita mengamankan pasokan yang diperlukan untuk menjaga industri dan populasi kita tetap berjalan.\n\nNegara lain mungkin menganggap hal ini sebagai pelanggaran netralitas, namun bagi [ROOT.GetName] hal ini hanyalah biaya untuk mempertahankan kemerdekaan kita di masa yang tidak menentu ini."
 BBA_switzerland_trade.6.a: "Hebat!"
 BBA_switzerland_trade.7.t: "[FROM.GetNameDefCap] menolak proposal perjanjian perdagangan kami"
 BBA_switzerland_trade.7.desc: "Terlepas dari upaya terbaik kami, pemerintah [FROM.GetAdjective] telah memutuskan untuk menolak proposal kami untuk perjanjian perdagangan yang saling menguntungkan.\n\nHal ini berpotensi menempatkan [ROOt.GetName] dalam posisi genting, karena situasi di Eropa membuat semakin sulit untuk mendapatkan sumber pasokan sipil dan militer yang stabil yang diperlukan untuk menjaga pertahanan dan pangan negara kita."
 BBA_switzerland_trade.7.a: "Kami akan menemukan cara lain!"
 BBA_switzerland_trade.8.t: "[FROM.GetNameDefCap] Bisa Membantu Kita Berdagang Emas"
 BBA_switzerland_trade.8.desc: "Dengan meningkatnya ketegangan antar negara di seluruh dunia, perdagangan menjadi lebih sulit, dan jika kita berperang, pilihan untuk membeli dan menjual emas akan menjadi semakin terbatas. Jika kita cukup memercayai mereka, netralitas [FROM.GetName] bisa menjadi peluang bagi kita untuk menyimpan cadangan dan berdagang secara bebas, sehingga memberi manfaat bagi perekonomian kita, dan pada akhirnya mesin perang kita."
 BBA_switzerland_trade.8.a: "Ide yang bagus"
 BBA_switzerland_trade.8.b: "Kita tidak tahu di mana posisi mereka sebenarnya"
 BBA_switzerland_trade.9.t: "[FROM.GetNameDefCap] Akan Memperdagangkan Emasnya Melalui Kami"
 BBA_switzerland_trade.9.desc: "Artinya mereka akan menyimpan cadangan emasnya pada kita, sehingga mereka bisa membeli dan menjual emas secara bebas, tanpa harus khawatir dengan embargo. Bukan hanya mereka saja yang akan memperoleh keuntungan dari hal ini, karena masuknya uang akan membantu perekonomian kita yang sedang kesulitan, dan bahkan dapat digunakan sebagai alat tawar-menawar di masa depan."
 BBA_switzerland_trade.9.a: "Ini akan berguna"
 BBA_switzerland_trade.10.t: "[FROM.GetNameDefCap] Menolak Menggunakan Sistem Perbankan Kami"
 BBA_switzerland_trade.10.desc: "Meskipun terlihat saling menguntungkan, sepertinya [FROM.GetName] tidak tertarik untuk meningkatkan perdagangan emas dengan negara lain di dunia."
 BBA_switzerland_trade.10.a: "Oh baiklah"
 BBA_switzerland_trade.11.t: "Kita Dapat Memperdagangkan Emas Lebih Lanjut Melalui Bursa [FROM.GetAdjective]"
 BBA_switzerland_trade.11.desc: "Kami telah menggunakan pasar di [FROM.GetName] untuk melewati hambatan perdagangan yang disebabkan oleh situasi politik dunia. Meningkatkan cadangan devisa kita di sana dapat memberikan manfaat yang lebih besar bagi perekonomian kita, bahkan jika hal tersebut juga menguntungkan perekonomian mereka."
 BBA_switzerland_trade.11.a: "Mereka telah membuktikan diri mereka dapat dipercaya"
 BBA_switzerland_trade.11.b: "Kita tidak bisa mengambil risiko memperburuk pengkhianatan ini"
 BBA_switzerland_trade.12.t: "[FROM.GetNameDefCap] Telah Merebut Cadangan Emas Kita!"
 BBA_switzerland_trade.12.desc: "Ini adalah sesuatu yang seharusnya kita lihat akan terjadi. Mereka telah menggunakan sikap netral mereka untuk menusuk kita dari belakang. Hal ini akan berdampak buruk pada perekonomian kita, kita harus membalasnya."
 BBA_switzerland_trade.12.a: "Mereka akan membayar"
 BBA_switzerland_trade.13.t: "[FROM.GetName] Ingin Kita Berinvestasi di Negaranya"
 BBA_switzerland_trade.13.desc: "[FROM.GetNameDefCap] meminta dukungan kami untuk melawan kekuatan fasis yang mengetuk pintu mereka. Kita dapat berinvestasi dalam perekonomian mereka, dengan cara ini mereka dapat bersiap menghadapi kemungkinan terburuk, atau bahkan membantu melawan Fasisme secara langsung jika mereka mau, atau terpaksa menghancurkan netralitas mereka yang sudah lama ada."
 BBA_switzerland_trade.13.a: "Kita harus membantu mereka mencegah fasisme"
 BBA_switzerland_trade.13.b: "Hal ini tidak akan menguntungkan kita sama sekali"
 BBA_switzerland_trade.14.t: "[FROM.GetNameDefCap] Akan Berinvestasi di [ROOT.GetName]"
 BBA_switzerland_trade.14.desc: "Investasi ini akan membantu kita meningkatkan perekonomian kita, dan memungkinkan kita untuk melawan segala kesulitan yang mungkin ditimbulkan oleh fasisme pada [ROOT.GetName]. Hal ini juga akan mendekatkan bangsa kita, bahkan mungkin pada akhirnya akan menjadi oposisi langsung terhadap Fasisme."
 BBA_switzerland_trade.14.a: "Ini adalah berita bagus!"
 BBA_switzerland_trade.15.t: "[FROM.GetNameDefCap] Menolak Berinvestasi"
 BBA_switzerland_trade.15.desc: "Sayangnya, kami telah diberitahu bahwa [FROM.GetName] tidak akan berinvestasi dalam perekonomian [ROOT.GetAdjective]. Kita menjadi lebih terisolasi dari yang kita inginkan, mengingat bahaya Fasisme yang akan datang."
 BBA_switzerland_trade.15.a: "Ini adalah sebuah masalah"
 ####### FASCIST EVENTS ###########
 BBA_switzerland_fascist.1.t: "[FROM.GetNameDefCap] menginginkan perlindungan kita"
 BBA_switzerland_fascist.1.desc: "Negara kecil [FROM.GetName], yang sebelumnya merupakan Negara Kriminal Keju, ingin melekatkan diri pada [ROOT.GetNameDef] dengan menjadi boneka kita. Hal ini dapat dianggap sebagai pengakuan kelemahan, atau pernyataan kesetiaan terhadap [ROOT.GetRulingParty]\n\nKemampuan pertahanan mereka yang kuat dan penduduk sipil yang terlatih mungkin berguna untuk rencana masa depan kita."
 BBA_switzerland_fascist.1.a: "Mereka mungkin bergabung dengan kami"
 BBA_switzerland_fascist.1.b: "Kami tidak membutuhkan mereka!"
 BBA_switzerland_fascist.2.t: "[FROM.GetNameDefCap] menolak kami"
 BBA_switzerland_fascist.2.desc: "Meskipun ada tawaran kami terhadap [FROM.GetName], mereka menolak usulan kami untuk tunduk pada rezim [FROM.GetAdjective].\n\nHal ini menempatkan kita dalam situasi yang sulit, karena kita jelas-jelas telah kehilangan kesan netralitas, dan sekarang kita mungkin dapat bertahan dari apa yang akan terjadi dengan sendirinya."
 BBA_switzerland_fascist.2.a: "Awan gelap di cakrawala"
 BBA_switzerland_fascist.3.t: "[SWI.GetName] meminta kendali atas [848.GetName]"
 BBA_switzerland_fascist.3.desc: "[FROM.GetNameDef] mengklaim bahwa mereka memiliki klaim atas [848.GetName] setelah pemilu pada tahun 1919 di mana mayoritas wilayah memilih untuk bergabung dengan Konfederasi Swiss pada saat itu. Meskipun mereka telah meninggalkan Demokrasi dan pemungutan suara yang terjadi beberapa dekade yang lalu, memberi mereka tanggung jawab atas negara bagian ini dapat membebaskan sumber daya yang kita keluarkan untuk menguasai wilayah tersebut, dan dapat menjadi ujian bagi kemampuan [FROM.GetName] dan yang lebih penting, loyalitasnya."
 BBA_switzerland_fascist.3.a: "Itu hak mereka"
 BBA_switzerland_fascist.3.b: "Mereka tidak dapat dipercaya dalam hal itu"
 BBA_switzerland_fascist.4.t: "[FROM.GetNameDefCap] telah menolak permintaan perluasan kami"
 BBA_switzerland_fascist.4.desc: "Meskipun dengan jelas menunjukkan kesetiaan dan kemampuan kami, [FROM.GetNameDef] telah memilih untuk menolak permintaan kami. Perluasan [ROOT.GetNameDef] menjadi [?SWI.SWI_requested_territory.GetName] harus menunggu, mungkin sampai kita memutuskan bahwa subordinasi kita yang berkelanjutan ke [FROM.GetName] tidak lagi layak dilakukan."
 BBA_switzerland_fascist.4.a: "Itu hak mereka"
 BBA_switzerland_fascist.5.t: "[FROM.GetNameDefCap] telah menerima permintaan kami untuk mengendalikan [?SWI.SWI_requested_territory.GetName]"
 BBA_switzerland_fascist.5.desc: "Ini mungkin membutuhkan biaya yang mahal, namun subordinasi dan kehormatan yang kami tunjukkan kepada [FROM.GetNameDef] telah membuahkan hasil. Berlaku segera, [ROOT.GetNameDef] akan mengendalikan [?SWI.SWI_requested_territory.GetName] atas nama mereka dan akan dimasukkan ke dalam wilayah kami."
 BBA_switzerland_fascist.5.a: "Luar biasa"
 BBA_switzerland_fascist.5.b: "Sumpah kami berlanjut"
 BBA_switzerland_fascist.6.t: "[SWI.GetName] meminta perluasan wilayahnya"
 BBA_switzerland_fascist.6.desc: "Setelah keberhasilan pendudukan [FROM.GetAdjective] di [848.GetName], [FROM.GetNameDef] menawarkan untuk mempertahankan wilayah [SWI_requested_territory.GetAdjective] atas nama kami.\n\nTentu saja ini juga berarti menyerahkan kendali kita atas wilayah tersebut kepada mereka, jadi kita harus berhati-hati dalam menilai kesetiaan mereka."
 BBA_switzerland_fascist.6.a: "Mereka telah membuktikan diri."
 BBA_switzerland_fascist.6.b: "$BBA_switzerland_fascist.3.b$"
 BBA_switzerland_fascist.7.t: "[FROM.GetNameDefCap] menyambut kami di kelompok mereka"
 BBA_switzerland_fascist.7.desc: "Dalam rapat umum di [ROOT.GetCapitalVictoryPointName], [ROOT.GetLeader] mengumumkan janji [FROM.GetName] akan kerja sama yang sangat erat antara negara kita, dan melindungi [ROOT.GetName] dari musuh kita, dan musuh mereka.\n\nPerwira dan fungsionaris yang ramah dari [FROM.GetNameDef], teman-teman kita, mengalir ke negara kita saat kita berbicara, untuk membantu kita mengembangkan kekuatan militer kita dan siap untuk menggunakannya untuk layanan mereka."
 BBA_switzerland_fascist.7.a: "Bermanfaat!"
 ##########  SWISS EXPANSION EVENTS #######
 BBA_swiss_expansion.1.t: "Kami tidak cukup mempengaruhi [SWI_influenced_state]"
 BBA_swiss_expansion.1.desc: "Meskipun para propagandis kami telah melakukan upaya terbaik, Demokrasi tidak menyebar sebanyak yang kami harapkan di kanton [?SWI.SWI_influence_target_state.GetName], jadi sayangnya kami tidak berpikir referendum untuk bergabung dengan kami akan berhasil.\n\nIni tidak berarti bahwa kami harus berhenti, kami telah menanam benih yang dapat dipelihara lebih lanjut, sehingga membuat kami lebih berpeluang untuk berhasil di masa depan."
 BBA_swiss_expansion.1.a: "Kami tidak akan meninggalkan misi kami"
 BBA_swiss_expansion.2.t: "Berkat pengaruh kami, [SWI_influenced_state] ingin bergabung dengan kami"
 BBA_swiss_expansion.2.desc: "Setelah kampanye propaganda yang luas, masyarakat [?SWI.SWI_influence_target_state.GetName] sangat mendukung bergabung dengan [ROOT.GetNameDef].\n\nIni berarti bahwa jika [?SWI.SWI_influence_target_state.GetName] merupakan negara demokrasi seperti kita, mereka akan menjadi bagian dari negara kita. Sayangnya, bukan itu masalahnya, jadi mereka memerlukan bantuan kita untuk menjadi kanton terbaru [SWI.GetName].\n\nKami sekarang dapat mendesak diadakannya referendum di negara bagian tersebut untuk menentukan keanggotaan mereka di [ROOT.GetNameDef]."
 BBA_swiss_expansion.2.a: "Kita harus menghadirkan Demokrasi sejati kepada mereka"
 BBA_swiss_expansion.3.t: "[FROM.GetNameDefCap] menekan untuk [SWI_pressed_state]"
 BBA_swiss_expansion.3.desc: "Para bajingan yang dianggap netral di [FROM.GetName] mempunyai keberanian untuk mengklaim [?SWI.SWI_state_being_claimed.GetName] sebagai milik mereka. Mereka menyatakan bahwa dukungan untuk bergabung dengan [FROM.GetNameDef] cukup tinggi sehingga referendum mengenai pertanyaan tersebut akan menguntungkan mereka, sehingga menjadikan negara bagian tersebut sebagai hak mereka.\n\nKita bisa membiarkan [?SWI.SWI_state_being_claimed.GetName] mengadakan referendum, yang pasti kita akan kalah, atau mengambil risiko berperang dengan mereka jika kita menolak."
 BBA_swiss_expansion.3.a: "Kami tidak akan diganggu!"
 BBA_swiss_expansion.3.b: "Referendum sudah tiba"
 BBA_swiss_expansion.4.t: "[FROM.GetName] menerima referendum!"
 BBA_swiss_expansion.4.desc: "Setelah referendum damai di seluruh [?SWI.SWI_state_being_claimed.GetName] yang sangat menguntungkan kami, [FROM.GetNameDef] telah menerima penyerahan kendali negara kepada kami. Kami akan segera mengubah wilayah di dalam [?SWI.SWI_state_being_claimed.GetName] menjadi kanton, dan mereka akhirnya akan merasakan bentuk demokrasi kami."
 BBA_swiss_expansion.4.a: "Konfederasi kami berkembang!"
 BBA_swiss_expansion.5.t: "[FROM.GetNameDef] mengabaikan seruan referendum!"
 BBA_swiss_expansion.5.desc: "Terlepas dari dukungan rakyat terhadap demokrasi dan [ROOT.GetNameDef], [FROM.GetName] telah memutuskan untuk mengabaikan rakyat [?SWI.SWI_state_being_claimed.GetName] dalam upaya mereka untuk melakukan referendum mengenai keanggotaan mereka di Konfederasi.\n\nIni adalah seruan yang jelas bagi kita untuk mengangkat senjata dan mempertahankan wilayah kita yang diduduki melawan tirani [FROM.GetNameDef]."
 BBA_swiss_expansion.5.a: "Sumpah kami menuntut hal itu!"
 BBA_swiss_expansion.6.t: "[FROM.GetNameDefCap] Ingin [848.GetName] sebagai Kanton"
 BBA_swiss_expansion.6.desc: "Tampaknya [FROM.GetName] menuntut negara bagian [848.GetName] bergabung dengan konfederasinya. Mereka mengutip referendum pada tahun 1919 di mana negara bagian tersebut secara mayoritas memilih untuk bergabung menjadi kanton [FROM.GetNameDef], namun ditolak oleh [FROM.GetAdjective] sendiri. Tampaknya mereka sekarang telah berubah pikiran.\n\nEntah kita menerima atau tidak, jelas mereka mengincar perluasan, jadi kita harus berhati-hati, dan siap mempertahankan wilayah kita meskipun kita menerima tuntutan mereka."
 BBA_swiss_expansion.6.a: "Risikonya tidak sebanding dengan negara sekecil itu"
 BBA_swiss_expansion.6.b: "[ROOT.GetNameDefCap] tidak akan pernah menyerahkan wilayah mana pun!"
 BBA_swiss_expansion.6.c: "Kami tidak akan diganggu oleh jerawat di wajah Eropa"
 BBA_swiss_expansion.6.d: "Selamat jalan"
 BBA_swiss_expansion.7.t: "[FROM.GetNameDefCap] Telah Menolak Permintaan Kami untuk [848.GetName] Bergabung dengan [ROOT.GetName]"
 BBA_swiss_expansion.7.desc: "Pemerintah [FROM.GetAdjective] dengan tegas menolak permintaan kami, meskipun klaim kami kuat dan kemauan demokratis dari rakyat [848.GetName].\n\nKita tidak boleh membiarkan hal ini berlalu begitu saja."
 BBA_swiss_expansion.7.a: "[848.GetName] akan gratis suatu hari nanti!"
 BBA_swiss_expansion.8.t: "Pemerintah [FROM.GetAdjective] Telah Menerima Permintaan Kami untuk Kebebasan [848.GetName]"
 BBA_swiss_expansion.8.desc: "[FROM.GetNameDefCap] telah melihat titik terang dan setuju dengan kami bahwa tempat [848.GetName] adalah dengan [ROOT.GetNameDef] sebagai kanton terbarunya.\n\nIni hanyalah langkah pertama menuju jalan [ROOT.GetName] menuju Eropa yang lebih demokratis!"
 BBA_swiss_expansion.8.a: "Ini untuk Demokrasi!"
 BBA_swiss_expansion.9.t: "[FROM.GetName] Menawarkan Perlindungan Mereka"
 BBA_swiss_expansion.9.desc: "Setelah menuntut agar kami menyerahkan [848.GetName] dengan dalih yang bisa dibilang lemah, [FROM.GetNameDef] menawarkan untuk mengambil wilayah kami untuk, diduga, melindungi kami dari [GER.GetNameDef], yang mereka klaim kemungkinan besar akan mencoba mencaplok [ROOT.GetNameDef] dalam waktu dekat.\n\nMeskipun hal ini terdengar cukup masuk akal dan bersama-sama kita akan memiliki peluang yang lebih baik untuk menangkis invasi, namun membayar dengan kedaulatan kita mungkin juga merupakan tindakan yang terlalu masuk akal. harga yang mahal.\n\nTentu saja, kita bisa berharap mereka akan menyerang kita jika kita menolak."
 BBA_swiss_expansion.9.a: "Ini mungkin satu-satunya kesempatan kita untuk bertahan hidup"
 BBA_swiss_expansion.9.b: "Itu adalah harga yang tidak ingin kami bayar!"
 BBA_swiss_expansion.10.t: "[FROM.GetNameDefCap] Akan Bergabung dengan Swiss!"
 BBA_swiss_expansion.10.desc: "Kota-kota di seberang Pegunungan Alpen akan merayakan persatuan kedua negara Alpen kita! Kita akan mampu mempertahankan diri kita dengan lebih baik terhadap kekuatan-kekuatan besar yang mengelilingi kita."
 BBA_swiss_expansion.10.a: "Akhirnya!"
 BBA_swiss_expansion.11.t: "[FROM.GetNameDefCap] Telah Menolak Kami!"
 BBA_swiss_expansion.11.desc: "Terlepas dari upaya kami untuk membentuk negara baru yang mampu mempertahankan diri melawan kekuatan terbesar di Eropa, [FROM.GetLeader] telah menyatakan [FROM.GetLeader.GetHerHis] rasa jijik terhadap usulan kami."
 BBA_swiss_expansion.11.a: "Kami hanya punya satu pilihan tersisa."
 BBA_swiss_expansion.12.t: "[FROM.GetName] Mengklaim Wilayah Pegunungan Alpen Kami"
 BBA_swiss_expansion.12.desc: "Dalam kejadian tak terduga, [FROM.GetNameDef] mengklaim [ROOT.GetAdjective] Pegunungan Alpen. Argumen mereka lemah, namun sebagian besar penduduk mereka dikerahkan dan siap menyerang jika kita menolak. Hal itu dan medan yang sangat menguntungkan bagi mereka akan menjadikan perang ini memakan waktu lama dan mahal jika kita menolaknya, jadi kita harus mempertimbangkan pilihan kita."
 BBA_swiss_expansion.12.desc_FRA: "Republik saudara kita, [FROM.GetNameDef] ingin menguasai seluruh Pegunungan Alpen dan mengklaim wilayah tersebut.\n\nPegunungan Alpen [ROOT.GetAdjective] kita telah menjadi bagian dari negara kita sejak lama, namun mengubahnya menjadi bagian dari wilayah [FROM.GetAdjective] akan memberikan imbalan atas kesetiaan dan dorongan mereka, sehingga menjadikan mereka sekutu yang lebih kuat."
 BBA_swiss_expansion.12.a: "Mereka akan memiliki Pegunungan Alpen"
 BBA_swiss_expansion.12.b: "Ini tidak masuk akal!"
 BBA_swiss_expansion.13.t: "[FROM.GetNameDefCap] Telah Menerima Permintaan Kami!"
 BBA_swiss_expansion.13.desc: "Pemerintah [FROM.GetAdjective] telah membuat keputusan yang benar dan mengakui bahwa wilayah pegunungan mereka adalah hak kami. Ini akan lebih menjamin keamanan kita dari agresor."
 BBA_swiss_expansion.13.a: "Kami menyambut wilayah baru ini!"
 BBA_swiss_expansion.14.t: "[FROM.GetName] Telah Menolak Klaim Alpine Kami"
 BBA_swiss_expansion.14.desc: "Meskipun kami sangat menuntut [FROM.GetAdjective] Pegunungan Alpen, [FROM.GetNameDef] telah menyatakan penolakan mereka terhadap klaim kami. Kita masih mempunyai cara lain untuk merebut wilayah ini jika kita memilih untuk terus maju bersama mereka."
 BBA_swiss_expansion.14.a: "Kami akan mendapatkannya dengan satu atau lain cara"
 BBA_swiss_expansion.15.t: "[FROM.GetName] Mencoba Mengubah [AUS.GetName] Melawan Kita!"
 BBA_swiss_expansion.15.desc: "Upaya kita untuk menyatukan [AUS.GetNonIdeologyName] dengan [ROOT.GetNonIdeologyName] digagalkan oleh [FROM.GetName], mereka berkampanye mendukung sistem pemerintahan mereka yang memalukan dan melawan kita.\n\nMenekan Anschluss sementara perang salib yang memfitnah ini sedang berlangsung akan terbukti mustahil, jadi kita harus menunggu untuk memenuhi takdir kita yang mulia!"
 BBA_swiss_expansion.15.a: "Mereka hanya menunda hal yang tidak bisa dihindari!"
 BBA_swiss_expansion.16.t: "[FROM.GetNonIdeologyName] Menuntut Kemerdekaan"
 BBA_swiss_expansion.16.desc: "Terlepas dari perlindungan dan dukungan kami, subjek kami [FROM.GetName] kini menuntut agar kami membebaskan mereka dari hak-hak istimewa dan kewajiban mereka kepada kami sehingga mereka dapat kembali menjadi bangsanya sendiri.\n\n[GetDemandingAlpsParagraph]"
 BBA_swiss_expansion.16.a: "[SWI_only_independence_response]"
 BBA_swiss_expansion.16.b: "Mereka akan menjadi negara merdeka, bersama dengan negara-negara Alpen kita"
 BBA_swiss_expansion.16.c: "Mereka harus berjuang untuk itu!"
 SWI_independence_demand_alps_paragraph: "Selain kemerdekaan mereka, mereka juga cukup serius untuk menuntut agar kami menyerahkan bagian pegunungan Alpen kami, seolah-olah untuk membentuk sebuah negara yang mencakup seluruh Pegunungan Alpen."
 SWI_no_alps_independence: "Mereka bisa mandiri kembali"
 SWI_have_alps_but_only_independence: "Kami akan mengizinkan kemerdekaan tetapi tidak lebih"
 BBA_swiss_expansion.17.t_alps: "[FROM.GetName] Telah Memberikan Kemerdekaan kepada Kami, namun tidak pada Wilayah Pegunungan Alpen Mereka"
 BBA_swiss_expansion.17.t_no_alps: "[ROOT.GetName] mandiri kembali!"
 BBA_swiss_expansion.17.desc_alps: "Ini adalah hari yang penting, meskipun kami belum mencapai semua tujuan kami. [FROM.GetNameDefCap] dengan enggan mengizinkan kami berpisah dengan mereka, memberikan kami kemerdekaan yang kami dambakan. Namun, pada saat yang sama, mereka dengan memalukan menyatakan keengganan mereka untuk berpisah dengan wilayah pegunungan Alpen mereka.\n\nKita harus mencari cara lain untuk menyatukan Pegunungan Alpen di bawah bendera kita."
 BBA_swiss_expansion.17.desc_no_alps: "Hari yang menggembirakan bagi [ROOT.GetNonIdeologyName], [FROM.GetNameDef] telah menerima permohonan kemerdekaan kami. Artinya kita bebas menentukan agenda kita sendiri dan memilih pendirian kebijakan luar negeri kita. Di sisi lain, kita juga harus berjuang sendiri."
 BBA_swiss_expansion.17.a: "Apa selanjutnya untuk [ROOT.GetNonIdeologyName]?"
 BBA_swiss_expansion.18.t: "[FROM.GetNameDefCap] Memberi Kami dan Pegunungan Alpen Kemerdekaan Kami"
 BBA_swiss_expansion.18.desc: "Desain kami akhirnya bersatu. [ROOT.GetNonIdeologyName] akhirnya mendapatkan kemerdekaannya kembali, dan bersamaan dengan itu, wilayah yang sebelumnya dikenal sebagai [FROM.GetAdjective] Alpen.\n\nMeskipun kita tidak lagi mengandalkan perlindungan tuan lama kita, tanah yang baru saja kita peroleh akan membuat kelangsungan hidup kita lebih pasti."
 BBA_swiss_expansion.18.a: "[ROOT.GetNameDefCap] bangkit!"
 BBA_swiss_expansion.19.t: "[FROM.GetName] Tidak Akan Membiarkan [ROOT.GetNonIdeologyName] Mandiri!"
 BBA_swiss_expansion.19.desc: "Deklarasi kemerdekaan kami tidak diterima dengan baik oleh mantan penguasa kami, [FROM.GetNameDef]. Mereka telah menyatakan perang terhadap kita dengan harapan dapat mengambil alih negara kita dengan kekerasan, mari kita angkat senjata dan tunjukkan kepada mereka bahwa [ROOT.GetName] tidak akan dapat ditundukkan dengan mudah."
 BBA_swiss_expansion.19.a: "Untuk mempersenjatai!"
 SWI_delayed_anschluss_TT: "§Y[GER.GetNameDefCap]§! akan §Rtidak akan mampu mendorong Anschluss§! sampai Semangat Nasional §Y$SWI_swiss_democratic_propaganda$§! dihapus dari §Y[AUS.GetName]§! dalam tiga bulan."
 SWI_expantion_state_loc: "[?SWI.SWI_influence_target_state.GetName]"
 SWI_expansion_no_state: "negara bagian"
 SWI_claiming_state_loc: "[?SWI_state_being_claimed.GetName]"
 SWI_claiming_no_state_loc: "salah satu negara bagian kita"
 SWI_press_for_future_canton_TT: "Membuka keputusan: §YTekan negara untuk wilayah masa depan yang terpengaruh§!"
