############################# Formables ##################################
##########################################################################
 bba_africa_news.1.t: "Pembentukan Federasi Afrika Timur"
 bba_africa_news.1.desc: "Pada tahun 1920-an, Menteri Kolonial Leo Amery berupaya menciptakan Dominion Afrika Timur yang dikuasai kulit putih yang terdiri dari Kenya, Uganda, dan Tanganyika. Hal ini ditentang dan akhirnya tidak selesai. Namun masyarakat asli Afrika Timur telah menggunakan konsep ini sebagai dasar untuk membentuk bangsanya sendiri, yang kini membuat mereka lebih kuat dari sebelumnya. Mereka telah menyatakan bahwa era Afrika yang didominasi Eropa akan segera berakhir!"
 bba_africa_news.1.a: "Akhirnya, kita bersatu!"
 bba_africa_news.1.b: "Apakah ini akhir dari era kolonial?"
 bba_africa_news.2.t: "Tanduk Afrika telah bersatu"
 bba_africa_news.2.desc: "Setelah berabad-abad berpisah dan berperang, masyarakat Tanduk Afrika telah bersatu dalam satu negara. Hal ini hampir pernah terjadi sebelumnya, namun ambisi kaum nasionalis yang hanya memikirkan diri sendiri selalu menjadi penghambat yang mengoyak hubungan masyarakat. Namun kini, penguasa wilayah [ROOT.GetLeader] telah menyatakan bahwa negara tidak akan memberikan manfaat bagi kelompok tertentu, melainkan menjadi faktor pemersatu bagi semua yang tinggal di sana. Kali ini, ia menyatakan, kawasan ini akan damai dan sejahtera, serta tetap bersatu hingga akhir umat manusia."
 bba_africa_news.2.a: "Mari kita berharap untuk perdamaian dan kemakmuran"
 bba_africa_news.2.b: "Apa dampaknya bagi kawasan ini?"
 bba_africa_news.3.t: "Organisasi Persatuan Afrika Didirikan"
 bba_africa_news.3.desc: "Negara-negara Afrika telah mulai bekerja sama satu sama lain melalui pembentukan organisasi antar pemerintah. Organisasi Persatuan Afrika yang baru ini berjanji untuk meningkatkan keamanan dan pembangunan ekonomi bagi negara-negara anggotanya. Apakah mereka dapat menjunjung cita-cita luhur ini, masih harus dilihat."
 bba_africa_news.3.a: "Inisiatif yang luar biasa!"
 bba_africa_news.3.b: "Konsep yang lemah."
 bba_africa_news.4.t: "Pembentukan Uni Afrika"
 bba_africa_news.4.desc: "Banyak yang meragukan kemampuan Organisasi Persatuan Afrika dalam menepati janji yang mereka sampaikan. Namun, para anggota organisasi tersebut telah menyatakan keinginan mereka untuk memperdalam integrasi mereka dengan membentuk federasi negara-negara dalam Uni Afrika yang lebih besar. Meskipun masih banyak pekerjaan yang harus dilakukan untuk sepenuhnya mengintegrasikan sistem politik masing-masing negara anggota, tampaknya kekuatan dunia baru mulai terbentuk di Afrika."
 bba_africa_news.4.a: "Bersatu kita teguh, bercerai kita runtuh!"
 bba_africa_news.4.b: "Ini tidak akan berarti apa-apa."
