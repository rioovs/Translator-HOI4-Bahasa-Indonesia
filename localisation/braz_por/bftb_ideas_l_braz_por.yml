 BUL_ferdinands_puppet: "Boneka Tsar Ferdinand"
 BUL_ferdinands_puppet_desc: "[ROOT.GetNameDef] telah ditundukkan oleh Tsar Ferdinand I dari [BUL.GetNameDef], yang mempunyai pengaruh besar terhadap pemerintahan [ROOT.GetAdjective], menjaga politik, ekonomi, dan industri negara di bawah kendali penuhnya."
 BUL_the_bulgarian_threat: "Ancaman Bulgaria"
 BUL_the_bulgarian_threat_desc: "Aspirasi ambisius [BUL.GetNameDef] di Balkan menimbulkan ancaman signifikan terhadap integritas [ROOT.GetNameDef] dan kebebasan masyarakat [ROOT.GetAdjective]."
 BUL_defender_of_the_balkans: "Pembela Balkan"
 BUL_defender_of_the_balkans_desc: "Tuan Bulgaria kami memerintahkan agar kami mengintensifkan upaya kami dalam membangun sistem pertahanan baru dan meningkatkan infrastruktur militer kami untuk membantu pertahanan Balkan."
