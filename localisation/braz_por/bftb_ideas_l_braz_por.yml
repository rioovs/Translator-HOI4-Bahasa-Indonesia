 TUR_debt_council_has_no_sway_tt: "§YDewan Utang§! tidak mempunyai pengaruh atas [ROOT.GetAdjective] urusan ekonomi."
 TUR_a_monopoly_has_been_formed_tt: "§YKeçi Ticaret§! telah diberikan monopoli atas basis industri [ROOT.GetNameDef] yang sedang berkembang."
 TUR_can_only_have_one_prime_minister_tt: "Pemerintah hanya dapat memiliki satu §YPerdana Menteri§!."
 TUR_ottoman_officers_invited_back: "§YLoyalis Utsmaniyah§! telah diundang untuk kembali bertugas aktif."
 TUR_cannot_form_kurdish_collaboration_government_tt: "§Y[TUR.GetNameDef]§! tidak akan pernah bisa membentuk Pemerintahan Kolaborasi Kurdi."
 TUR_has_a_prime_minister_tt: "§Y[TUR.GetNameDef]§! memiliki Perdana Menteri."
 etibank: "Etibank"
 electricity_focused_state_bank: "Bank Negara Sektor Ketenagalistrikan"
 sumerbank: "Bank Sumeria"
 industrial_investment_bank: "Bank Investasi Industri"
 BUL_army_restrictions: "Pembatasan Tentara"
 BUL_army_restrictions_desc: "Konsekuensi lain dari Perjanjian Neuilly-sur-Seine adalah pembatasan ketat yang diberlakukan terhadap tentara kita, tidak hanya melarang wajib militer, membatasi jumlah pasukan dan perwira di pasukan kita dan melarang kita memelihara peralatan canggih apa pun, tetapi juga melarang manuver militer atau perencanaan kampanye dan bahkan menetapkan jumlah senapan yang dapat kita gunakan."
 BUL_army_restrictions_mobilization_law_tt: "§RTidak dapat menambah undang-undang wajib militer atau menyatakan perang.\nTidak dapat melatih unit, membubarkan unit, atau mengedit templat unit.\nTidak dapat memproduksi baju besi, pesawat terbang, atau kapal§!."
 BUL_second_national_catastrophe: "Bencana Nasional Kedua"
 BUL_second_national_catastrophe_desc: "Menyusul kekalahan kami dalam Perang Besar, Perjanjian Neuilly-sur-Seine memaksa kami untuk menyerahkan wilayah luas yang kini menjadi milik Yugoslavia, Yunani, dan Rumania, dan hingga baru-baru ini Liga Bangsa-Bangsa mengharuskan kami untuk memprioritaskan pembayaran pampasan perang dalam jumlah besar, yang melumpuhkan perekonomian kami dan tentu saja meningkatkan utang negara kami. Semangat nasional tidak pernah benar-benar pulih dari pukulan ini, sehingga tidak heran mengapa perjanjian ini terkenal di Bulgaria sebagai Bencana Nasional Kedua..."
 BUL_second_national_catastrophe_tt: "Akan dihapus jika Bulgaria Raya dipulihkan:\nMemiliki kendali penuh atas §YSofia§!, §YPlovdiv§!, §YMoesia§!, §YBurgas§!, §YSelatan Serbia§!, §YMakedonia§!, §YMakedonia Tengah§!, §YThrace§!, §YDobrudja§!, §YUtara Dobrudja§!."
 BUL_imro_01: "IMRO"
 BUL_imro_01_desc: "Kejahatan pembunuhan saudara yang terus-menerus dilakukan oleh Organisasi Internal Revolusioner Makedonia telah merusak hubungan internasional kita dan pada tahun 1934 berujung pada tindakan keras militer terhadap markas IMRO di Petrich, yang merupakan pukulan telak terhadap organisasi tersebut dan memaksa sebagian besar pemimpin mereka melarikan diri ke luar negeri. Namun, beberapa sel revolusioner masih aktif di Bulgaria, dan sebagian besar hubungan diplomatik kita masih dalam kondisi buruk."
 BUL_imro_02: "IMRO"
 BUL_imro_02_desc: "Kejahatan pembunuhan saudara yang terus-menerus dilakukan oleh Organisasi Internal Revolusioner Makedonia telah terlalu lama merusak hubungan internasional kita, namun setidaknya sekarang kekuatan asing akhirnya mengakui upaya kita untuk menghancurkan organisasi tersebut demi menjaga perdamaian di Balkan."
 BUL_imro_04: "IMRO"
 BUL_imro_04_desc: "Kerja sama kami dengan Organisasi Internal Revolusioner Makedonia telah banyak dikritik tidak hanya oleh negara-negara tetangga kami, namun juga oleh berbagai kekuatan asing dan bahkan oleh beberapa sektor masyarakat kami."
 BUL_tsar_boris_positive_01: "Raja Boris III"
 BUL_tsar_boris_positive_01_desc: "Kebijakan Boris terbukti sangat bermanfaat bagi Bulgaria dan karena alasan ini Tsar mendapat opini populer yang sangat baik tidak hanya di kalangan elit dan kalangan paling istimewa, namun juga di kalangan kelas paling rendah hati."
 BUL_tsar_boris_negative_01: "Raja Boris III"
 BUL_tsar_boris_negative_01_desc: "Boris III tahu bahwa rezim diktatornya akan segera berakhir dan, tidak mengherankan, dia menolak untuk menerima perubahan apa pun yang diusulkan oleh para menteri kami, meminta anggota loyalis di pemerintahan untuk menggagalkan semua proposal kami dan berusaha mati-matian untuk mempertahankan kendali politik Bulgaria selama yang dia bisa."
 BUL_zveno_ns: "Zveno"
 BUL_zveno_ns_desc: "Pembubaran Persatuan Militer adalah sebuah hal yang perlu, namun hal ini memiliki konsekuensi: kami akhirnya menyingkirkan beberapa individu Zveno yang tidak melakukan apa pun selain menghalangi rantai komando, namun kami juga kehilangan instruktur berharga dan perwira berpengalaman di akademi militer kami."
 BUL_fatherland_front_positive: "Front Tanah Air"
 BUL_fatherland_front_positive_desc: "Awalnya didirikan oleh Partai Buruh Bulgaria sebagai gerakan perlawanan politik untuk menghadapi penindasan dan fasisme di Bulgaria, Front Tanah Air kini terdiri dari anggota dari berbagai organisasi, bersatu melawan semua orang yang berupaya menundukkan proletariat Bulgaria."
 BUL_fatherland_front_negative_desc: "Front Tanah Air adalah gerakan perlawanan politik yang awalnya didirikan oleh Partai Pekerja Bulgaria yang komunis, namun kini mencakup banyak kelompok dan organisasi dengan ideologi yang sangat berbeda, bersatu melawan kediktatoran militer pro-Jerman di Bulgaria."
 BUL_paramilitary_organizations: "Organisasi Paramiliter"
 BUL_paramilitary_organizations_desc: "Anggota organisasi paramiliter adalah individu setia yang telah memiliki disiplin militer dan siap berperang demi kejayaan negara kita. Sejak kami mendapatkan kesetiaan mereka terhadap tujuan kami, mereka telah terbukti menjadi sumber tenaga kerja yang dapat diandalkan."
 BUL_brannik: "Brannik"
 BUL_brannik_desc: "Organisasi pemuda nasional pro-fasis yang didirikan oleh Bogdan Filov ini menjadi semakin besar dan, sejak didirikan, organisasi ini telah memberi kita sejumlah besar anggota yang ingin bergabung dengan kekuatan militer kita."
 BUL_liberal_trade_policies: "Kebijakan Perdagangan Liberal"
 BUL_liberal_trade_policies_desc: "Perekonomian Bulgaria telah terhuyung-huyung dari satu krisis ke krisis berikutnya sejak kemerdekaannya dari Kekaisaran Ottoman. Kebijakan autarkis terbukti tidak memadai di masa lalu, sehingga sekarang saatnya untuk beralih ke liberalisasi ekonomi."
 BUL_bulgarian_patriarchate_restored: "Patriarkat Bulgaria"
 BUL_bulgarian_patriarchate_restored_desc: "Kami akhirnya memulihkan martabat Gereja Ortodoks Bulgaria dan masyarakat kini bersukacita atas terpilihnya Patriark Bulgaria pertama sejak jatuhnya Tarnovo di bawah pemerintahan Ottoman pada tahun 1393."
 BUL_national_industry_01: "Industri Nasional"
 BUL_national_industry_01_desc: "Kita telah memperoleh peralatan modern untuk menyediakan industri manufaktur kita, mungkin hanya sebuah langkah kecil, namun merupakan langkah penting menuju pengembangan industri nasional yang kuat."
 BUL_national_industry_02: "Industri Nasional"
 BUL_national_industry_02_desc: "Proyek pengembangan industri nasional kita terbukti memakan biaya besar, namun juga berhasil secara signifikan, karena proyek ini telah memungkinkan berdirinya beberapa industri baru, dan modernisasi beberapa industri yang sudah ada."
 BUL_foreign_industry_dynamic_modifier: "Industri Asing"
 BUL_foreign_industry_dynamic_modifier_desc: "Kita tidak mempunyai sarana untuk membangun industri yang kuat dan efisien, jadi pilihan terbaik kita adalah menarik investor asing yang ingin memperluas bisnis mereka dan beroperasi di Bulgaria."
 BUL_tobacco_exports: "Ekspor Tembakau"
 BUL_tobacco_exports_desc: "Kami secara aktif mengganti produksi padi-padian kami dengan tanaman tembakau yang lebih bernilai, sehingga memberikan kami pendapatan yang besar."
 BUL_nationalized_industry: "Industri Nasionalisasi"
 BUL_nationalized_industry_desc: "Kami telah mengambil alih setiap pabrik asing di Bulgaria, sehingga meningkatkan kapasitas produksi industri kami secara signifikan."
 BUL_aircraft_repair_facilities: "Fasilitas Perbaikan Pesawat"
 BUL_aircraft_repair_facilities_desc: "Kami telah mengembangkan proyek untuk memperluas fasilitas perbaikan pesawat Terem Georgi Benkovski, yang memungkinkan angkatan udara kami melakukan tugas pemeliharaan dan perbaikan secara optimal pada pesawatnya."
 BUL_international_pilot_training_program: "Program Pelatihan Pilot Internasional"
 BUL_international_pilot_training_program_desc: "Kami memiliki program pelatihan pilot internasional yang secara signifikan telah meningkatkan jumlah pilot terampil dan anggota awak angkatan udara kami."
 BUL_bulgarian_army_01: "Tentara Bulgaria"
 BUL_bulgarian_army_01_desc: "Kita dikelilingi oleh musuh-musuh potensial, seperti yang telah diajarkan oleh sejarah dengan keras, dan sangat penting bagi kita untuk membangun pasukan yang kuat dan mengembangkan taktik modern jika kita ingin menang dalam konflik di masa depan."
 BUL_prussia_of_the_balkans_01: "Prusia dari Balkan"
 BUL_prussia_of_the_balkans_01_desc: "Pada tahun-tahun awalnya, Ketsaran Bulgaria adalah negara yang sangat termiliterisasi dengan tentara yang besar dan lengkap, yang diidentifikasi sebagai Prusia dari Balkan, hingga negara tersebut dikhianati oleh mantan sekutunya yang pengkhianat. Namun, kami telah membangun kembali negara kami setelah kekalahan memalukan di masa lalu, dan kini saatnya telah tiba untuk mendapatkan kembali kejayaan Bulgaria. Dunia akan menyebut kami Prusia dari Balkan sekali lagi!"
 BUL_worker_strikes: "Pemogokan Pekerja"
 BUL_worker_strikes_desc: "Kaum sosialis yang luas telah bergabung dengan komunis dalam upaya mereka untuk memicu pemogokan nasional di kalangan pekerja industri, yang sangat menghambat produksi kita dan menyebabkan konfrontasi antara mereka dan pihak berwenang."
 BUL_buhovo_uranium_mines: "Tambang Uranium Buhovo"
 BUL_buhovo_uranium_mines_desc: "Deposit uranium dalam jumlah besar telah ditemukan di Buhovo, sebuah kota Bulgaria dekat Sofia. Tambang kami melakukan ekstraksi sumber daya berharga yang terbukti penting bagi pengembangan persenjataan militer baru dan kuat."
 BUL_uranium_concession_agreement_ns: "Perjanjian Konsesi Uranium"
 BUL_uranium_concession_agreement_ns_desc: "Kita tidak dapat memanfaatkan cadangan uranium di tanah kita secara maksimal, dan akan lebih bermanfaat tidak hanya bagi kita, tetapi juga bagi sekutu [FROM.GetAdjective] kita, jika kita menandatangani kontrak yang memberi mereka hak eksploitasi dengan imbalan bahan dan produk yang bermanfaat bagi industri dan pertanian dalam negeri kita."
 BUL_volunteers_in_spain_republican: "Relawan di Spanyol"
 BUL_volunteers_in_spain_republican_desc: "[GetSpanishStruggleFocusLoc]"
 BUL_volunteers_in_spain_nationalist: "Relawan di Spanyol"
 BUL_volunteers_in_spain_nationalist_desc: "[GetSupportTheSpanishCoupFocusLoc]"
 BUL_elites_crushed: "Elit Hancur"
 BUL_elites_crushed_desc: "Kita telah merampas banyak hak istimewa dari kelas atas Bulgaria, namun sebagai konsekuensinya kita telah mempunyai banyak musuh dalam posisi politik dan militer yang penting. Kita harus menyingkirkan orang-orang yang tidak melakukan apa pun selain menghambat kemajuan sosial di Bulgaria."
 BUL_government_reforms_communists_01: "Reformasi Pemerintahan"
 BUL_government_reforms_communists_01_desc: "Reformasi yang dilakukan pemerintah di bidang agraria dan industri tidak diragukan lagi penting bagi pembangunan dan kemajuan bangsa Bulgaria."
