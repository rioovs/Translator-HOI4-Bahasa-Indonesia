l_braz_por:
 GRE_debt_to_the_ifc: "Hutang kepada I.F.C."
 GRE_debt_to_the_ifc_desc: "Yunani berhutang banyak kepada Komisi Keuangan Internasional, sebuah organisasi yang dulunya berpengaruh dan kini hanya diketuai oleh Inggris, Perancis, dan Italia. Meskipun jumlah I.F.C. membengkak, negara-negara yang tergabung masih menginginkan utang mereka dari Yunani dibayar penuh - yang berarti bahwa sampai kita melunasi utang-utang kita, atau menghindarinya dengan cara lain, I.F.C. menguasai kita dengan dompetnya."
 GRE_debt_to_the_ifc_2: "Hutang kepada I.F.C."
 GRE_debt_to_the_ifc_2_desc: "Yunani berhutang banyak kepada Komisi Keuangan Internasional, sebuah organisasi yang dulunya berpengaruh dan kini hanya diketuai oleh Inggris, Perancis, dan Italia. Meskipun jumlah I.F.C. membengkak, negara-negara yang tergabung masih menginginkan utang mereka dari Yunani dibayar penuh - yang berarti bahwa sampai kita melunasi utang-utang kita, atau menghindarinya dengan cara lain, I.F.C. menguasai kita dengan dompetnya."
 GRE_debt_to_the_ifc_3: "Hutang kepada I.F.C."
 GRE_debt_to_the_ifc_3_desc: "Yunani berhutang banyak kepada Komisi Keuangan Internasional, sebuah organisasi yang dulunya berpengaruh dan kini hanya diketuai oleh Inggris, Perancis, dan Italia. Meskipun jumlah I.F.C. membengkak, negara-negara yang tergabung masih menginginkan utang mereka dari Yunani dibayar penuh - yang berarti bahwa sampai kita melunasi utang-utang kita, atau menghindarinya dengan cara lain, I.F.C. menguasai kita dengan dompetnya."
 GRE_george_ii: "George II"
 GRE_george_ii_desc: "George II adalah Raja Hellenes yang tidak populer, yang telah dikembalikan takhtanya dari pengasingan pada tahun 1935 berkat pemungutan suara yang dicurangi. Dia bertekad untuk mempertahankan tahtanya kali ini."
 GRE_george_ii_restrained: "George II"
 GRE_george_ii_restrained_desc: "George II adalah Raja Hellenes yang memecah belah, yang telah dikembalikan takhtanya dari pengasingan pada tahun 1935 berkat pemungutan suara yang dicurangi. Daripada membiarkan status satu orang ini mengobrak-abrik bangsa Yunani sekali lagi, kaum Venezel malah membiarkan George II tetap menjadi raja konstitusional berdasarkan model Swedia."
 GRE_schachtplan: "rencana Schacht"
 GRE_schachtplan_desc: "Gagasan ekonom Jerman Hjalmar Schacht, Schachtplan menjamin akses Yunani ke pasar Jerman dengan imbalan peningkatan impor bahan mentah dari Yunani ke Jerman. Jerman telah dengan murah hati menjaga kita tetap bertahan, namun kita mungkin saja jatuh ke dalam perangkap mereka karena terlalu bergantung pada kemurahan hati mereka."
 GRE_schachtplan_modified: "rencana Schacht"
 GRE_schachtplan_modified_desc: "Gagasan brilian Hjalmar Schacht, Schachtplan menjamin akses Yunani ke pasar Jerman sebagai imbalan atas akses pasar yang diprioritaskan terhadap bahan mentah Yunani. Jerman di masa lalu dengan murah hati menjaga kita tetap bertahan, dan bersama-sama kita telah membangun hubungan ekonomi yang sangat istimewa."
 GRE_schachtplan_fascistised: "Rencana Gotzamanis-Schacht"
 GRE_schachtplan_fascistised_desc: "Berdasarkan Schachtplan asli Hjalmar Schacht, Schachtplan baru telah disusun dengan cermat oleh ekonom korporatis terbesar Jerman dan Yunani: membentuk pakta ekonomi baru berdasarkan prinsip Sosialisme Nasional. Meskipun perjanjian ekonomi ini mungkin tidak dapat diandalkan dalam jangka panjang, perjanjian ini akan memberikan manfaat yang cukup bagi kita selama tahun-tahun penuh pertikaian ini."
 GRE_agrarian_society: "Masyarakat Agraris"
 GRE_agrarian_society_desc: "Yunani secara tradisional mengandalkan pertanian dan industri ringan dengan produk komersial seperti tembakau menjadi ekspor utama Yunani. Ketergantungan kita pada bentuk manufaktur yang lebih tradisional telah membuat kita bergantung pada industri berat dengan kekuatan yang lebih besar untuk proyek konstruksi. Konflik sedang terjadi, dan kita perlu berinovasi dengan cepat."
 GRE_foreign_monopolies: "Monopoli Asing"
 GRE_foreign_monopolies_desc: "Ketergantungan kita pada industri berat milik negara asing telah menyebabkan banyak sektor berkembang kita berada di tangan perusahaan-perusahaan kuat yang hanya bertanggung jawab kepada pemerintah asing. Kita tidak bisa berharap untuk sepenuhnya meningkatkan proses modernisasi sampai kita berhasil mencapai kesepakatan dengan para monopoli ini atau kita secara permanen melepaskan mereka dari negara kita."
