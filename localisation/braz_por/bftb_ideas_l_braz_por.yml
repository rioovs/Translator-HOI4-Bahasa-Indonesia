 GRE_political_instability: "Ketidakstabilan Politik"
 GRE_political_instability_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Masyarakat sudah merasa muak dan siap untuk mencapai stabilitas dalam pemerintahan mereka, namun mereka juga tetap skeptis terhadap kemungkinan suatu pemerintahan dapat bertahan dalam jangka waktu yang lama. Kita harus membuktikan bahwa mereka salah dan mengakhiri pertikaian yang terus-menerus terjadi dengan menjatuhkan musuh-musuh politik kita."
 GRE_political_instability_dummy_desc: "Antara tahun 1924 dan 1935 kita telah mengalami dua puluh tiga pergantian pemerintahan, tiga belas kudeta, dan sebuah kediktatoran! Masyarakat sudah merasa muak dan siap untuk mencapai stabilitas dalam pemerintahan mereka, namun mereka juga tetap skeptis terhadap kemungkinan suatu pemerintahan dapat bertahan dalam jangka waktu yang lama. Kita harus membuktikan bahwa mereka salah dan mengakhiri pertikaian yang terus-menerus terjadi dengan menjatuhkan musuh-musuh politik kita."
 GRE_political_instability_republican: "Ketidakstabilan Politik"
 GRE_political_instability_republican_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Kami, kaum Venezelist, tidak dapat menyangkal... peran kecil yang mungkin harus kami ambil dalam hal tersebut. Setidaknya orang-orang mengenal kita sebagai Iblis yang mereka kenal! Sayangnya, ingatan akan Bencana Anatolia masih segar dalam ingatan masyarakat Yunani dan mereka juga tidak melupakan peran kita di dalamnya."
 GRE_political_instability_republican_2: "Ketidakstabilan Politik"
 GRE_political_instability_republican_2_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Kami, kaum Venezelist, tidak dapat menyangkal... peran kecil yang mungkin harus kami ambil dalam hal tersebut. Setidaknya orang-orang mengenal kita sebagai Iblis yang mereka kenal! Kini terserah pada kita untuk memenuhi warisan kita, dan menyelesaikan perjalanan yang dimulai Yunani pada tahun 1919 ketika kita mencoba merebut kembali Konstantinopel..."
 GRE_political_instability_communist: "Ketidakstabilan Politik"
 GRE_political_instability_communist_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Untuk pertama kalinya setelah sekian lama, Yunani akhirnya memiliki gerakan yang menempatkan rakyat Yunani sebagai penguasa utama negaranya. Namun gerakan kami masih muda, dan kami masih harus membuktikan banyak hal di hadapan masyarakat dengan baik dan benar-benar percaya pada pemerintahan kami."
 GRE_political_instability_metaxas: "Ketidakstabilan Politik"
 GRE_political_instability_metaxas_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Di bawah kepemimpinan Metaxas, kita akan mencapai persatuan melalui kekuatan dengan menghancurkan semua musuh kita! Rakyat Yunani akan belajar bagaimana pemerintahan yang mempunyai keinginan untuk menegakkan ketertiban di negara tanpa hukum ini beroperasi."
 GRE_political_instability_fascism: "Ketidakstabilan Politik"
 GRE_political_instability_fascism_desc: "§WPara £faction_gre_monarchist §YMonarkis§! adalah [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§WThe £faction_gre_venezelist §YRepublik§! adalah [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects]\n\n§WThe £faction_gre_communist §YKomunis§! adalah [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects]\n\n§WPara £faction_gre_fascist §YFasis§! adalah [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects]\n\nAntara tahun 1924 dan 1935 kita mempunyai dua puluh tiga perubahan pemerintahan, tiga belas kudeta, dan kediktatoran! Fasisme menjunjung tinggi persatuan di atas segalanya. Jika kita tidak bisa secara efektif memobilisasi rakyat Yunani dan membantu mereka melihat bahwa fasisme adalah jawaban yang jelas terhadap kesengsaraan Yunani, maka kita tidak layak untuk berkuasa."
