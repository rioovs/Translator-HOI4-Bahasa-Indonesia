 BUL_balkan_federation_project_propaganda: "Propaganda Federasi Balkan"
 BUL_balkan_federation_project_propaganda_desc: "Dukungan rakyat terhadap proyek baru Bulgaria untuk federasi Balkan dengan cepat menyebar berkat kampanye propaganda di seluruh negara kita yang didanai oleh pemerintah Bulgaria."
