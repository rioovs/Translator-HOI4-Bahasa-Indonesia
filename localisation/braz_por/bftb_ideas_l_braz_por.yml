 GRE_macedonian_farmlands_idea: "Lahan Pertanian Makedonia"
 GRE_macedonian_farmlands_idea_desc: "Dengan memanfaatkan lahan pertanian yang kaya di Makedonia, pasukan kita dapat tetap mendapat pasokan selama mungkin."
 TUR_inventive_genius_hidden_idea: "$TUR_kamil_tolon$"
 TUR_inventive_genius_electronics_modifier_tt: "$electronics$ Kecepatan Penelitian: §G+10%§!"
 TUR_first_five_year_plan: "Birinci Beş Yıllık Sanayi Planı"
 TUR_first_five_year_plan_desc: "Sesuai dengan Rencana Lima Tahun [SOV.GetAdjective], dan dipandu oleh para ahli [SOV.GetAdjective] dan [USA.GetAdjective], rencana lima tahun pertama kami mulai berlaku pada tanggal 17 April 1934. Melalui rencana ini, kami bertujuan untuk membangun 20 pabrik baru pada saat rencana kedua dilaksanakan."
 TUR_widespread_illiteracy_idea: "Buta Huruf yang Meluas"
 TUR_widespread_illiteracy_idea_desc: "Meskipun tingkat melek huruf di negara kita telah meningkat secara drastis sejak penerapan awal reformasi alfabet dan bahasa berkat dorongan literasi Atatürk dan kampanye pendidikan nasional, bahkan hingga ia mendapatkan gelar başöğretmen, masih banyak yang harus dilakukan."
 TUR_kemalist_army_officers_powerful_loyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_powerful_loyal_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme belum pernah mengakar di Turki seperti saat ini, dan negara kita tidak pernah berada di tangan yang lebih aman dibandingkan di bawah pemerintahan saat ini."
 TUR_kemalist_army_officers_powerful_neutral: "Perwira Kemalis"
 TUR_kemalist_army_officers_powerful_neutral_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme belum pernah mengakar di Turki seperti saat ini."
 TUR_kemalist_army_officers_powerful_disloyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_powerful_disloyal_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme belum pernah mengakar di Turki seperti saat ini, dan para perwira tentu saja membenci kita karena bertindak sangat bertentangan dengan nilai-nilai Kemal pada saat Kemalisme dihormati oleh banyak orang."
 TUR_kemalist_army_officers_extended_power_loyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_extended_power_loyal_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme terus memenangkan hati dan pikiran di seluruh Turki seperti yang diharapkan oleh Atatürk, dan korps perwira berdiri dalam solidaritas dengan pemerintahan saat ini melawan semua bahaya terhadap kedaulatan Turki."
 TUR_kemalist_army_officers_extended_power_neutral: "Perwira Kemalis"
 TUR_kemalist_army_officers_extended_power_neutral_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme terus memenangkan hati dan pikiran di seluruh Turki seperti yang diharapkan oleh Atatürk, dan para perwira siap untuk memastikan nilai-nilai Kemalisme tetap terlindungi dari pihak-pihak yang akan menumbangkannya."
 TUR_kemalist_army_officers_extended_power_disloyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_extended_power_disloyal_desc: "Korps perwira elit Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme terus memenangkan hati dan pikiran di seluruh Turki, dan korps perwira secara aktif bekerja melawan pemerintahan saat ini untuk menjamin perlindungan nilai-nilai Kemalisme."
 TUR_kemalist_army_officers_limited_power_loyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_limited_power_loyal_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme masih ditentang sebagai sebuah ideologi, namun korps perwira siap membantu pemerintah dalam segala hal yang berkaitan dengan perlindungan negara."
 TUR_kemalist_army_officers_limited_power_neutral: "Perwira Kemalis"
 TUR_kemalist_army_officers_limited_power_neutral_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme masih ditantang sebagai sebuah ideologi, dan korps perwira bekerja dengan tekun untuk menjaga prinsip-prinsip Kemalisme."
 TUR_kemalist_army_officers_limited_power_disloyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_limited_power_disloyal_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme masih ditantang sebagai sebuah ideologi, dan para perwira sangat menentang pendirian pemerintahan saat ini mengenai masalah ideologi dan pemerintahan."
 TUR_kemalist_army_officers_decreased_power_loyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_decreased_power_loyal_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme menghadapi beberapa kemunduran dalam meraih dukungan rakyat, namun korps perwira tetap berkomitmen untuk mendukung pemerintahan saat ini."
 TUR_kemalist_army_officers_decreased_power_neutral: "Perwira Kemalis"
 TUR_kemalist_army_officers_decreased_power_neutral_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme menghadapi beberapa kemunduran dalam meraih dukungan rakyat, dan para perwiranya merasa gelisah dalam mengamati suasana hati bangsa."
 TUR_kemalist_army_officers_decreased_power_disloyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_decreased_power_disloyal_desc: "Korps perwira Turki adalah salah satu pelindung paling setia nilai-nilai Kemalis. Kemalisme menghadapi beberapa kemunduran dalam meraih dukungan rakyat, yang sebagian besar dikaitkan dengan kebijakan dan tindakan pemerintahan saat ini."
 TUR_kemalist_army_officers_minimal_power_loyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_minimal_power_loyal_desc: "Korps perwira Turki adalah salah satu pelindung paling gigih terhadap nilai-nilai Kemalis, namun kini kelompok loyalis Kemalis yang lesu tidak bisa berbuat apa-apa selain memberikan penilaian sekilas terhadap pemerintahan saat ini."
 TUR_kemalist_army_officers_minimal_power_neutral: "Perwira Kemalis"
 TUR_kemalist_army_officers_minimal_power_neutral_desc: "Korps perwira Turki adalah salah satu pelindung paling gigih terhadap nilai-nilai Kemalis, namun kini peran mereka telah direduksi menjadi hanya sekedar peran seremonial."
 TUR_kemalist_army_officers_minimal_power_disloyal: "Perwira Kemalis"
 TUR_kemalist_army_officers_minimal_power_disloyal_desc: "Korps perwira Turki merupakan salah satu pelindung paling gigih terhadap nilai-nilai Kemalis, namun kini komplotan rahasia loyalis Kemalis yang semakin menyusut tidak bisa berbuat apa-apa selain melontarkan kecaman terhadap pemerintahan saat ini."
 TUR_disorganised_armed_forces: "Angkatan Bersenjata yang Tidak Terorganisir"
 TUR_disorganised_armed_forces_desc: "Angkatan Bersenjata Turki masih muda seperti negara Turki sendiri. Meskipun tentara kita berhasil keluar dari Perang Pembebasan dengan kemenangan melawan Entente dan Ottoman, bangsa kita membayar harga kebebasan dengan darah. Ada sedikit atau bahkan tidak ada lagi antusiasme terhadap perang setelah kehilangan hampir seperempat populasi kita dalam Perang Besar, namun dengan momok perang yang sekali lagi membayangi dunia tampaknya kita tidak punya pilihan selain memodernisasi kekuatan kita dengan cepat, atau memastikan bahwa perang tidak pernah sampai ke perbatasan kita."
