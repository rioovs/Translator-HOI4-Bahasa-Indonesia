 TUR_disorganised_armed_forces_30_desc: "Angkatan Bersenjata Turki masih muda seperti negara Turki sendiri. Meskipun tentara kita berhasil keluar dari Perang Pembebasan dengan kemenangan melawan Entente dan Ottoman, bangsa kita membayar harga kebebasan dengan darah. Ada sedikit atau bahkan tidak ada lagi antusiasme terhadap perang setelah kehilangan hampir seperempat populasi kita dalam Perang Besar, namun dengan momok perang yang sekali lagi membayangi dunia tampaknya kita tidak punya pilihan selain memodernisasi kekuatan kita dengan cepat, atau memastikan bahwa perang tidak pernah sampai ke perbatasan kita."
 TUR_sectarian_woes: "Kesengsaraan Sektarian"
 TUR_sectarian_woes_desc: "§W[TUR.GetNameDefCap] divisi internal diwakili secara geografis melalui§! §YPengubah Negara§!§W: the§! £faction_tur_kemalist §YKemalis§! §Wdapat ditemukan di barat dan di utara, religius§! £faction_tur_traditionalist §YTradisionalis§! §Wdapat ditemukan di pedalaman tengah maupun di selatan, sedangkan§! £faction_tur_kurdish §YOrang Kurdi§! §Wdapat ditemukan di tenggara negara.§!\n\n§WInteraksi dengan berbagai§! §YFaksi§! §Wdapat diakses melalui§! §YKeputusan Tab§!§W, serta melalui beberapa§! §YEfek Fokus§! §Wdan§! §YOpsi Acara§!§W.§!\n\nTurki dilanda perpecahan internal yang melintasi garis ideologi, agama, dan etnis. Kaum Kemalis berharap untuk mengubah Turki menjadi negara sekuler, namun ada sebagian besar penduduk yang pada dasarnya menentang konsep sekularisme. Di wilayah timur, masyarakat Kurdi telah menimbulkan banyak masalah bagi pemerintah Turki dan tampaknya bertekad melakukan pemberontakan demi asimilasi. Untuk memperbaiki perpecahan internal di negara kita, kita perlu menangani masalah ini dengan tangan lembut atau tangan besi."
 TUR_sectarian_woes_1: "Kesengsaraan Sektarian"
 TUR_sectarian_woes_1_desc: "§W[TUR.GetNameDefCap] divisi internal diwakili secara geografis melalui§! §YPengubah Negara§!§W: the§! £faction_tur_kemalist §YKemalis§! §Wdapat ditemukan di barat dan di utara, religius§! £faction_tur_traditionalist §YTradisionalis§! §Wdapat ditemukan di pedalaman tengah maupun di selatan, sedangkan§! £faction_tur_kurdish §YOrang Kurdi§! §Wdapat ditemukan di tenggara negara.§!\n\n§WInteraksi dengan berbagai§! §YFaksi§! §Wdapat diakses melalui§! §YKeputusan Tab§!§W, serta melalui beberapa§! §YEfek Fokus§! §Wdan§! §YOpsi Acara§!§W.§!\n\nTurki dilanda perpecahan internal yang melintasi garis ideologi, agama, dan etnis. Kelompok Kemalis berharap dapat mengubah Turki menjadi negara sekuler, namun masih terdapat sebagian besar penduduk yang pada dasarnya tetap menentang konsep sekularisme. Untuk memperbaiki perpecahan internal di negara kita, kita perlu menangani masalah ini dengan tangan lembut atau tangan besi."
 TUR_sectarian_woes_2: "Kesengsaraan Sektarian"
 TUR_sectarian_woes_desc_2: "§W[TUR.GetNameDefCap] divisi internal diwakili secara geografis melalui§! §YPengubah Negara§!§W: the§! £faction_tur_kemalist §YKemalis§! §Wdapat ditemukan di barat dan di utara, religius§! £faction_tur_traditionalist §YTradisionalis§! §Wdapat ditemukan di pedalaman tengah maupun di selatan, sedangkan§! £faction_tur_kurdish §YOrang Kurdi§! §Wdapat ditemukan di tenggara negara.§!\n\n§WInteraksi dengan berbagai§! §YFaksi§! §Wdapat diakses melalui§! §YKeputusan Tab§!§W, serta melalui beberapa§! §YEfek Fokus§! §Wdan§! §YOpsi Acara§!§W.§!\n\nTurki dilanda perpecahan internal yang melintasi garis ideologi, agama, dan etnis. Di wilayah timur, masyarakat Kurdi telah menimbulkan banyak masalah bagi pemerintah Turki dan tampaknya bertekad melakukan pemberontakan demi asimilasi. Untuk memperbaiki perpecahan internal di negara kita, kita perlu menangani masalah ini dengan tangan lembut atau tangan besi."
 TUR_rearmament_scheme: "Skema Persenjataan Kembali yang Disiapkan"
 TUR_rearmament_scheme_desc: "Skema persenjataan yang komprehensif telah direncanakan sejak lama, namun tidak ada kebutuhan untuk melaksanakan skema tersebut – namun dunia kini berada di ambang perang lagi, dan Turki tidak akan lengah."
 TUR_infrastructure_privatised_idea: "Infrastruktur yang Diprivatisasi"
 TUR_infrastructure_privatised_idea_desc: "Memberi kepentingan swasta kendali atas infrastruktur di negara kita akan memberi kita lebih banyak sumber daya untuk dialokasikan ke negara lain, namun pembangunan infrastruktur tambahan menjadi hal yang sangat menjengkelkan untuk saat ini."
 TUR_financing_private_enterprise: "Pembiayaan Perusahaan Swasta"
 TUR_financing_private_enterprise_desc: "Tujuan negara adalah memberikan insentif dan penghargaan bagi sebagian besar masyarakat kita yang berwirausaha. Dengan berinvestasi pada mereka yang bisa memperbaiki bangsa kita, kita berinvestasi untuk masa depan negara kita."
 TUR_etatism: "Etatisme"
 TUR_etatism_desc: "Perekonomian campuran kita berbeda dengan perekonomian campuran mana pun di dunia: perekonomian ini memiliki unsur liberalisme Inggris, korporatisme Italia, dan perencanaan terpusat Soviet. Ini adalah sintesis utama model-model ekonomi dan permata puncak sistem Kemalis.\n\n§RJika kita memajukan undang-undang ekonomi kita, maka kita harus siap menghadapi gesekan yang berkembang antara model ekonomi kita yang tidak sesuai.§!"
 TUR_etatism_2: "Etatisme"
 TUR_etatism_2_desc: "Perekonomian campuran kita berbeda dengan perekonomian campuran mana pun di dunia: perekonomian ini memiliki unsur liberalisme Inggris, korporatisme Italia, dan perencanaan terpusat Soviet. Ini adalah sintesis utama dari model-model ekonomi dan puncak dari sistem Kemalis, namun kita harus yakin untuk tidak memberikan terlalu banyak tekanan pada sistem tersebut dengan mencoba mempertahankan ekonomi perang pada saat yang bersamaan.\n\n§RJika kita memajukan undang-undang ekonomi kita, maka kita harus bersiap menghadapi gesekan tambahan yang akan berkembang antara model ekonomi kita yang tidak sesuai.§!"
 TUR_etatism_3: "Etatisme"
 TUR_etatism_3_desc: "Perekonomian campuran kita berbeda dengan perekonomian campuran mana pun di dunia: perekonomian ini memiliki unsur liberalisme Inggris, korporatisme Italia, dan perencanaan terpusat Soviet. Ini adalah sintesis utama dari model ekonomi dan merupakan puncak dari sistem Kemalis, namun kita telah membatasinya dengan mencoba untuk secara bersamaan mempertahankan ekonomi perang. Kita mungkin perlu mempertimbangkan kembali prospek kita dan mengakhiri eksperimen Etatist.\n\n§RJika kita memajukan undang-undang ekonomi kita, maka kita harus bersiap menghadapi gesekan tambahan yang akan berkembang antara model ekonomi kita yang tidak sesuai.§!"
 TUR_etatism_4: "Etatisme"
 TUR_etatism_4_desc: "Perekonomian campuran kita tidak seperti yang ada di dunia: perekonomian ini terdiri dari unsur-unsur liberalisme Inggris, korporatisme Italia, dan perencanaan terpusat Soviet. Kita telah bertindak ceroboh dan serakah, dan kita berisiko menghancurkan perekonomian negara kita jika kita mencoba mempertahankan model Etatist sambil menjalankan ekonomi perang. Kita mempertaruhkan segalanya dengan sia-sia: kita harus menghapuskan Etatisme sebelum terlambat.\n\n§RJika kita memajukan undang-undang perekonomian kita lagi tanpa menghapuskan Etatisme maka kita akan memicu depresi!§!"
 TUR_economic_collapse: "Keruntuhan Ekonomi"
 TUR_economic_collapse_desc: "Kita hancur: Etatisme menyelamatkan kita dari Depresi Besar, namun sepertinya kita tidak bisa menghindari bencana ekonomi selamanya. Kami telah mengecewakan negara kami, rakyat kami, ideologi kami, dan kami telah mencemari warisan Atatürk sendiri selamanya..."
 TUR_etatism_stabilisation: "Stabilisasi Etatist"
 TUR_etatism_stabilisation_desc: "Keunggulan ekonomi campuran adalah kita mempunyai kapasitas dan kekuasaan untuk menerapkan tindakan darurat ketika diperlukan, dan kita telah melakukan hal tersebut. Kita telah mengulur waktu sebelum perubahan ekonomi berikutnya, namun hal ini tidak akan bertahan selamanya. Kita harus menggunakan waktu kita dengan hati-hati."
 kemalist_neutrality_idea: "Netralitas Kemalis"
 kemalist_neutrality_idea_desc: "Perdamaian di Dalam Negeri, Perdamaian di Dunia - Atatürk menetapkannya, dan kami sekarang telah mengkodifikasikannya sebagai dasar kebijakan luar negeri kami. Kita harus menjaga perdamaian, dan jika kita tidak bisa mendapatkan perdamaian di dunia maka kita hanya perlu menerima perdamaian di dalam negeri."
 TUR_second_five_year_plan_inonu: "Rencana Lima Tahun İnönü"
 TUR_second_five_year_plan_inonu_desc: "Berdasarkan model industrialisasi Soviet, İsmet İnönü menjadikannya prioritas untuk meningkatkan jumlah industri ringan di [ROOT.GetNameDef] dan memodernisasi infrastruktur di seluruh negara."
 TUR_second_five_year_plan_cakmak: "Rencana Lima Tahun Çakmak"
 TUR_second_five_year_plan_cakmak_desc: "Berdasarkan model remiliterisasi Jerman, Fevzi Çakmak menjadikan peningkatan jumlah industri berat di [ROOT.GetNameDef] sebagai prioritas dan memodernisasi infrastruktur di seluruh negeri."
 TUR_investment_financing_spirit: "Pembiayaan Investasi"
 TUR_investment_financing_spirit_desc: "Dunia berputar pada pertukaran komoditas untuk pemenuhan kebutuhan. Kita memang mempunyai kebutuhan, namun agar punggung kita bisa tergaruk, pertama-tama kita harus menggaruk punggung kita sendiri."
 TUR_sheltered_foreign_outcasts: "Orang Asing yang Terlindungi"
 TUR_sheltered_foreign_outcasts_desc: "Merupakan keharusan moral kita untuk membantu orang-orang yang teraniaya di dunia ketika hal itu berada dalam kekuasaan kita, dan sejauh ini hal tersebut pasti berada dalam kekuasaan kita. Kami akan menaturalisasikan mereka, melindungi mereka, dan mengasuh mereka seolah-olah mereka adalah putra-putri asli [TUR.GetNameDef]."
 TUR_debt_council: "Dewan Hutang"
 TUR_debt_council_desc: "Ketika Kesultanan Utsmaniyah akhirnya hanya tercatat dalam buku sejarah, ia meninggalkan kita sebuah hadiah perpisahan: utangnya yang sangat besar. Kita berutang banyak uang dan aset kepada negara-negara Barat, namun yang paling memalukan, utang kita bahkan tidak dikelola di sini, di negara kita. Dewan Utang, dengan segala kebijaksanaannya yang tak terbatas, bersidang di Perancis."
 TUR_tpda: "TPDA"
 TUR_tpda_desc: "Pada akhirnya, kita telah merebut kendali dari kaum imperialis dan dapat mengatur dan mengelola utang kita sendiri dari ibu kota kita. Dewan Utang sudah tidak ada lagi, sekarang para hiu yang mempunyai hak istimewa tidak punya pilihan selain mendatangi kita ketika mereka meminta restitusi atau penyerahan."
 TUR_tpda_absorbed: "Administrasi Utang Publik Turki"
 TUR_tpda_absorbed_desc: "Hanya dengan satu goresan pena, Administrasi Utang Publik Turki telah berubah dari entitas swasta menjadi entitas publik milik negara. Kita mengelola utang kita, kita mengendalikan utang kita, dan kita bisa mengurangi utang kita. Kita telah mencapai puncaknya di dunia."
 TUR_debt_council_reined_in_flag: "Dewan Utang Luar Negeri telah direorganisasi menjadi lembaga nasional"
 TUR_varlik_vergisi_spirit: "Varlik Vergisi"
 TUR_varlik_vergisi_spirit_desc: "'Pajak Kekayaan' ini hanyalah penerapan kembali pajak Jizyah secara terselubung, dan kita mungkin perlu mempertimbangkan untuk menghapusnya sebelum kita kehilangan ilusi untuk menjalankan republik sekuler."
 TUR_inanc_vergisi_spirit: "İnanç Vergisi"
 TUR_inanc_vergisi_spirit_desc: "'Pajak Iman' adalah puncak dari doktrin sekuler Kemalis; ini merupakan dorongan agresif yang dianggap oleh banyak orang sebagai langkah besar menuju ateisme negara. Sayangnya, ini adalah mimpi yang tidak mungkin terwujud - dan kami harus mempertimbangkan penghapusan pajak di masa mendatang."
 TUR_political_landscape_shifting: "Pergeseran Lanskap Politik"
 TUR_political_landscape_shifting_desc: "Selama ini tujuan utama Kemalisme adalah membangun demokrasi liberal multi-partai di [TUR.GetNameDef]... namun zaman terus berubah. Kita hidup di masa-masa yang menarik dengan ideologi-ideologi modern yang saling bertarung demi supremasi tatanan dunia, dan tampaknya medan pertarungan ideologi juga telah menemukan pijakannya di sini."
 TUR_the_redshirts: "Kaus Merah"
 TUR_the_redshirts_desc: "Kaus Merah adalah milisi fasis paramiliter kita yang berpatroli di jalan-jalan daerah perkotaan kita dan memastikan masyarakat secara ketat mematuhi prinsip-prinsip Kemalisme. Mereka mungkin kadang-kadang sedikit kejam, dengan hati yang keras dan kepala yang penuh dengan idealisme revolusioner, tapi setidaknya tujuan mereka adil!"
 TUR_turkish_workers_militia: "Milisi Pekerja Turki"
 TUR_turkish_workers_militia_desc: "Pihak yang paling berhak melindungi hak-hak pekerja adalah pekerja itu sendiri. Tentu saja, sedikit arahan dari pemerintah kita dan memo aneh dari Moskow hanya akan meningkatkan efektivitas mereka sebagai milisi pekerja."
 TUR_turkish_interventionism: "Intervensionisme Turki"
 TUR_turkish_interventionism_desc: "Perdamaian di Dalam Negeri, Perdamaian di Dunia - Atatürk menetapkannya, dan kami sekarang telah mengkodifikasikannya sebagai dasar kebijakan luar negeri kami. Kita tidak bisa lagi berdiam diri dan membiarkan dunia terjerumus ke dalam kekacauan sementara kita hanya berdiam diri dan tidak melakukan apa pun. Satu-satunya cara untuk menjamin perdamaian di dalam negeri adalah dengan memperjuangkan perdamaian di dunia."
 TUR_balkan_defense_council_spirit: "Dewan Pertahanan Balkan"
 TUR_balkan_defense_council_spirit_desc: "Delegasi dari setiap anggota Entente Balkan secara teratur bertemu untuk bertukar anekdot tentang peristiwa-peristiwa di dunia dan perkembangan terkini mengenai situasi pertahanan masing-masing. Pengetahuan militeristik yang kita miliki bersama merupakan keuntungan besar bagi kita semua."
 TUR_three_year_plan_balkans: "Rencana Tiga Tahun Bersama"
 TUR_three_year_plan_balkans_desc: "Entente Balkan telah melaksanakan salah satu proyek industrialisasi paling berani dalam sejarah dengan mensponsori skema ekonomi multinasional yang direncanakan secara terpusat dan didanai bersama untuk memastikan basis industri kita secara kolektif cukup kuat untuk menahan serangan dari negara besar."
 TUR_central_balkan_bank_wealthy_greece: "Bank Sentral Balkan Athena"
 TUR_central_balkan_bank_wealthy_greece_desc: "Tidak seorang pun dapat meramalkan bahwa [GRE.GetNameDef] dari semua negara akan menjadi negara pertama yang urusan keuangannya dalam kondisi sempurna. Disepakati dengan suara bulat bahwa Bank Sentral Balkan harus didirikan di Thessaloniki, mengingat keunggulan [GRE.GetAdjective] dalam manajemen fiskal."
 TUR_central_balkan_bank: "Bank Sentral Balkan"
 TUR_central_balkan_bank_desc: "Bank Sentral Balkan akan menjadi forum aliran bebas material, komoditas, dan hal-hal yang berkaitan dengan perdagangan bagi semua negara dalam Pakta Balkan. Izmir, seiring berjalannya waktu, akan menyaingi Frankfurt, Shanghai, dan New York sebagai pusat bisnis dan perdagangan."
 TUR_joint_fortification_budget: "Anggaran Fortifikasi Bersama"
 TUR_joint_fortification_budget_desc: "Balkan Entente ibarat tumpukan kartu domino: ketika salah satu dari kita terjatuh, yang lainnya pasti akan segera menyusul. Kita semua harus bertanggung jawab atas pertahanan kita dan mempersiapkan perbatasan kita terhadap segala kemungkinan serangan."
 TUR_emergency_fortification_directive: "Petunjuk Fortifikasi Darurat"
 TUR_emergency_fortification_directive_desc: "Saat-saat sulit memerlukan tindakan yang sangat buruk, dan kita terpaksa segera mengalokasikan sumber daya untuk membangun benteng. Keberadaan kita bisa jadi dipertaruhkan."
 TUR_united_balkan_security_forces: "Pasukan Keamanan Balkan Bersatu"
 TUR_united_balkan_security_forces_desc: "Batalyon keamanan bersama adalah peningkatan alami dari seringnya anggota komando tinggi kita bertukar rencana pertempuran dan informasi satu sama lain. Dengan mengurangi tekanan terhadap kita dalam mengawasi perbatasan dalam negeri, kita mengurangi beban tentara nasional kita dan menjadi lebih siap menghadapi perang."
 TUR_the_coordinated_armed_forces_of_the_balkan_pact: "Angkatan Bersenjata Terkoordinasi Entente Balkan"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact_desc: "Kekuatan kita berasal dari kesatuan kita. Kita berkoordinasi sebagai satu kesatuan, kita berjuang sebagai satu kesatuan, kita gugur sebagai satu kesatuan. Ketika keadaan sudah tenang dan meriam berhenti menembak, Entente Balkan akan tetap berdiri."
 TUR_balkan_pact_innovative_transport_techniques: "Teknik Transportasi Inovatif di Seluruh Balkan"
 TUR_balkan_pact_innovative_transport_techniques_desc: "Untuk mengoordinasikan dan memfasilitasi pengangkutan tentara kita dengan lebih mudah melintasi banyak perbatasan, kita sebagai negara harus meningkatkan infrastruktur kita. Inisiatif ini diharapkan dapat membantu meringankan hambatan ini."
 TUR_victory_at_all_costs: "Kemenangan Dengan Segala Cara"
 TUR_victory_at_all_costs_desc: "Kita tidak berjuang mati-matian sebagai sebuah bangsa selama Perang Kemerdekaan hanya untuk dimusnahkan beberapa dekade kemudian. Tidak, kisah [TUR.GetNameDef] tidak berakhir di sini - kita tidak boleh jatuh, kita tidak akan jatuh!"
 TUR_funkplan: "rencana funk"
 TUR_funkplan_desc: "Mencontoh Schachtplan Hjalmar Schacht, Funkplan Walther Funk menjamin akses Jerman ke [TUR.GetAdjective] bijih mineral sekaligus memfasilitasi akses [TUR.GetAdjective] ke pasar produk komersial Jerman. Klausul tersembunyi dalam Funkplan juga menjamin jumlah minimum material yang dibutuhkan untuk membantu memperluas industri berat kami."
 TUR_german_advisors: "Penasihat Jerman"
 TUR_german_advisors_desc: "Secara resmi bertindak sebagai duta besar dan konsultan bisnis, kami sekarang menjadi tuan rumah bagi sekelompok perwira Jerman dalam jumlah besar yang siap membantu kami dalam memodernisasi militer kami dan menjadikannya kekuatan tempur yang seefektif mungkin."
 TUR_integrated_german_officers: "Perwira Jerman Terintegrasi"
 TUR_integrated_german_officers_desc: "Karena tidak ada lagi kebutuhan untuk menyamarkan peran pejabat militer Jerman di negara kami, kami telah secara resmi mengintegrasikan mereka ke dalam rantai komando kami dengan persetujuan tegas dari [GER.GetLeader]."
 TUR_the_antalya_naval_academy: "Akademi Angkatan Laut Antalya"
 TUR_the_antalya_naval_academy_desc: "Bekerja sama dengan [ITA.GetAdjective]s, kami telah mendirikan sekolah untuk calon laksamana dan perwira angkatan laut yang berbeda dari sekolah lain di dunia."
 TUR_tuz_golu_training_facility: "Fasilitas Pelatihan Tuz Gölü"
 TUR_tuz_golu_training_facility_desc: "Iklim Mediterania di negara kita bukanlah lingkungan yang cocok untuk melatih tentara kita sehingga mereka dapat beroperasi dengan baik di iklim kering. Kami telah memilih untuk mendirikan fasilitas pelatihan di dekat danau garam Tuz Gölü, sehingga pasukan kami dapat lebih siap berperang di lingkungan kering."
 TUR_sub_zero_survival_training: "Pelatihan Bertahan Hidup di Bawah Nol"
 TUR_sub_zero_survival_training_desc: "Bukanlah tugas yang mudah untuk meniru kondisi dingin yang dialami Eurasia, namun ia terpaksa melakukannya. Kami telah memilih untuk membangun fasilitas di puncak Gunung Palandöken di Erzurum dengan fasilitas tambahan yang lebih kecil yang berbasis di sekitar Gunung Ağrı sehingga pasukan kami dapat berlatih dalam kondisi pegunungan dan gletser sepanjang tahun."
 TUR_italo_turkish_merchant_fleet: "Armada Pedagang Italia-[TUR.GetAdjective]"
 TUR_italo_turkish_merchant_fleet_desc: "Hari-hari [ENG.GetAdjective] yang mendominasi lautan Mediterania telah berakhir. Mediterania termasuk dalam [ITA.GetAdjective] dan [GRE.GetAdjective]!"
 TUR_turkic_volunteers_from_abroad: "Relawan Turki dari Luar Negeri"
 TUR_turkic_volunteers_from_abroad_desc: "Saudara dan saudari Turki kami datang dari seluruh penjuru Eurasia untuk memberikan dukungan mereka terhadap perjuangan kita bersama. Bersama-sama, kita akan mengamankan Era Serigala."
 TUR_golden_age_of_the_wolf: "Zaman Keemasan Serigala"
 TUR_golden_age_of_the_wolf_desc: "Serigala Jerman dan [TUR.GetAdjective] menguasai Eropa. Musuh kita adalah kelinci, dan meskipun mereka dapat berlari dan bersembunyi, tidak dapat dipungkiri bahwa mereka akan tersangkut di salah satu rahang kita yang besar dan perkasa!"
 TUR_refugees_from_the_fascist_menace: "Pengungsi dari Ancaman Fasis"
 TUR_refugees_from_the_fascist_menace_desc: "Kaum fasis mempraktikkan politik eksklusivitas dan melanggar hak-hak asasi manusia di setiap kesempatan. Tindakan mereka sangat mengerikan, dan menjaga serta melindungi mereka yang melarikan diri dari prasangka fasis adalah hal yang paling tidak bisa kita lakukan."
 TUR_revolutionary_brigades_from_abroad: "Brigade Revolusioner Dari Luar Negeri"
 TUR_revolutionary_brigades_from_abroad_desc: "Marxisme pada dasarnya adalah sebuah keyakinan internasionalis, sehingga wajar jika kaum revolusioner dari seluruh dunia berbondong-bondong datang ke negara kita untuk berjuang dalam perjuangan global kita bersama."
 TUR_construct_a_red_navy: "Angkatan Laut Merah"
 TUR_construct_a_red_navy_desc: "Tanpa dukungan tulang punggung angkatan laut yang kuat, segala upaya untuk menyebarkan revolusi global pasti akan gagal."
 TUR_the_revolutionary_officer_college_of_kars: "Sekolah Tinggi Perwira Revolusioner Kars"
 TUR_the_revolutionary_officer_college_of_kars_desc: "Kars adalah kota dengan sejarah yang kaya, dan kedekatannya dengan [SOV.GetNameDef] menjadikannya lokasi ideal untuk mendirikan sekolah perwira baru yang dipolitisasi. Para perwira kami tidak hanya akan diajari dasar-dasar peperangan, namun juga seluk-beluk doktrin Marxis."
 TUR_arctic_wolves_training: "Pelatihan Serigala Arktik"
 TUR_arctic_wolves_training_desc: "Prajurit kita akan berkeliaran di salju seperti serigala yang memburu mangsa di hutan boreal. Melalui pelatihan kami, musuh akan menjadi lebih takut daripada kedinginan di tengah angin sedingin es."
 TUR_red_officers: "Petugas Merah"
 TUR_red_officers_desc: "Sama seperti para perwira Kemalis yang mewakili dan menjaga ideologi mereka sendiri, para perwira baru kita akan bertindak sebagai penjaga Marxisme di [TUR.GetNameDef]."
 TUR_kemalism_with_socialist_characteristics: "Kemalisme Bersifat Sosialis"
 TUR_kemalism_with_socialist_characteristics_desc: "Kita tidak punya kepentingan untuk membuang Kemalisme, kita akan melakukan tindakan merugikan bagi dunia jika kita menyingkirkan ideologi yang tumbuh dalam negeri dan progresif. Kemalisme cukup dinamis sehingga dapat diubah agar lebih sesuai dengan nilai-nilai Marxis tanpa mengikis fondasinya secara total."
 TUR_turkish_bolshevism: "Bolshevisme Turki"
 TUR_turkish_bolshevism_desc: "Kemalisme memenuhi tujuannya dan sekarang akan dimasukkan ke dalam buku sejarah... yah, beberapa buku sejarah ilegal. [TUR.GetNameDef] sekarang mencontoh revolusi Vladimir Lenin dan bukannya reaksioner revisionis Mustafa Kemal Atatürk dan gerakannya yang gagal."
 TUR_reappropriated_exploitative_finance: "Pembiayaan Eksploitatif yang Digunakan Kembali"
 TUR_reappropriated_exploitative_finance_desc: "Kita akan menggunakan kembali kekayaan para rentenir asing dan parasit kapitalisme domestik kita yang menyedihkan untuk membangun masyarakat yang benar-benar melayani kelas pekerja [TUR.GetNameDef]."
 TUR_emergency_deployment_of_defensive_bases: "Pengerahan Darurat Pangkalan Pertahanan"
 TUR_emergency_deployment_of_defensive_bases_desc: "Sayangnya, basis pertahanan negara kita sudah ketinggalan zaman, dan pada akhirnya tidak akan berguna dalam perang modern. Kita harus melakukan upaya nasional yang besar untuk memodernisasi pertahanan kita dan mencegah siapa pun yang ingin menyerang."
 TUR_the_battle_for_our_nations_survival: "Perjuangan Kelangsungan Hidup Bangsa Kita"
 TUR_the_battle_for_our_nations_survival_desc: "Hal yang tidak terpikirkan telah terjadi: [SOV.GetNameDef] telah menginvasi negara kita, dan kini masa depan negara [TUR.GetAdjective] dipertaruhkan. Masyarakat [TUR.GetAdjective] telah mendukung seruan [TUR.GetLeader], namun dalam menghadapi perang total melawan ancaman yang jauh lebih kuat, berapa lama semangat ini dapat bertahan?"
 TUR_rebuilding_our_home: "Membangun Kembali Rumah Kita"
 TUR_rebuilding_our_home_desc: "Bangsa kita telah dirusak secara materi, fisik, dan spiritual oleh anjing-anjing Kemalis, namun pada akhirnya tirani mereka telah berakhir. Kita berada di ambang era baru bagi masyarakat kita: era di mana kita akhirnya bisa memperbaiki kesalahan di masa lalu. Kita harus membangun masa depan agar kita dapat menghidupkan kembali masa lalu."
 TUR_rising_islamist_dissidence: "Meningkatnya Pertentangan Islam"
 TUR_rising_islamist_dissidence_desc: "Setiap kali gagasan pemilu yang bebas dimunculkan di [TUR.GetNameDef], para fundamentalis agama berusaha membajak platform apa pun untuk menentang CHP. Tampaknya kali ini tidak akan ada bedanya. Di seluruh negeri, ada peningkatan kesadaran fundamentalis ketika musuh-musuh ideologis kita bersatu untuk menggulingkan kekuasaan kita di negara ini dengan mencemarkan kotak suara yang kita berikan kepada mereka."
 TUR_objectors_flocking_to_military_service: "Penentang Berbondong-bondong ke Dinas Militer"
 TUR_objectors_flocking_to_military_service_desc: "Segala macam warga [TUR.GetAdjective] yang pernah menghindari wajib militer mendaftar untuk bertugas di angkatan bersenjata kita. Masyarakat telah menerima dengan baik pendekatan pemerintah mengenai Fatherland First, dan banyak yang mulai memahami posisi mereka dalam struktur negara kita, dimana sebelumnya mereka merasa seperti orang luar."
 TUR_legacy_of_ataturk_fulfilled: "Warisan Atatürk"
 TUR_legacy_of_ataturk_fulfilled_desc: "Kami telah memperjuangkan dan memenuhi ambisi tertinggi Mustafa Kemal Atatürk untuk negara [ROOT.GetAdjective] dengan mengubahnya menjadi negara demokrasi liberal multi-partai yang sah. Kami telah memperjuangkan impian seumur hidup Atatürk, dan karena itu pemerintahan kami menjadi jauh lebih aman di mata rakyat."
 TUR_legacy_of_ataturk_preserved: "Warisan Atatürk"
 TUR_legacy_of_ataturk_preserved_desc: "Kita telah memperpanjang status quo dengan mempertahankan rezim otoriter yang mengedepankan cita-cita Kemalis. Kita belum menghancurkan aspirasi Mustafa Kemal Atatürk untuk negara [ROOT.GetAdjective], namun kita juga tidak berbuat banyak untuk mewujudkan tujuan tersebut. Terserah generasi mendatang untuk menggunakan fondasi yang kita letakkan sehingga mereka dapat merebut jubah Kemalisme..."
 TUR_legacy_of_ataturk_defiled: "Warisan Atatürk"
 TUR_legacy_of_ataturk_defiled_desc: "Kita telah mengecewakannya: bagaimana mungkin Bapak Turki memandang keadaan saat ini di [ROOT.GetNameDef] dengan pandangan yang berbeda dari penghinaan yang mencemooh? Kita hanya perlu percaya bahwa ambisinya untuk bangsa ini salah, dan ambisi kita benar..."
 TUR_republicanism: "Republikanisme"
 TUR_republicanism_desc: "Karena kemerdekaan adalah hak mutlak bangsaku yang beribadah kepada Tuhan!"
 TUR_nationalism: "Nasionalisme"
 TUR_nationalism_desc: "Jangan takut; karena panji merah yang berkibar dengan bangga di fajar yang mulia ini tidak akan pudar sebelum api terakhir yang berkobar di tanah airku padam. Karena itulah bintang umat-Ku, dan akan bersinar selamanya; itu milikku; dan semata-mata milik bangsaku yang gagah berani."
 TUR_populism: "Populisme"
 TUR_populism_desc: "Siapa yang tidak mau mengorbankan nyawanya demi surga negara ini? Para martir akan meledak jika seseorang memeras tanahnya! Para martir!"
 TUR_reformism: "Reformisme"
 TUR_reformism_desc: "Cakrawala Barat mungkin dibatasi oleh tembok baja, namun perbatasanku dijaga oleh keperkasaan seorang mukmin. Biarkan saja, jangan takut! Dan pikirkan: bagaimana iman yang membara ini bisa dipadamkan oleh monster bertaring tunggal yang Anda sebut \"peradaban\"?"
 TUR_revolutionism: "Revolusionisme"
 TUR_revolutionism_desc: "Begitu beriak dan berombak bagaikan langit fajar yang cerah, wahai bulan sabit yang mulia, agar setiap tetes darah kita yang terakhir pada akhirnya diberkati dan layak! Baik kamu maupun saudara-saudaraku tidak akan pernah musnah!"
 TUR_liberalism: "Liberalisme"
 TUR_liberalism_desc: "Saya telah bebas sejak awal dan selamanya akan begitu. Orang gila macam apa yang akan merantaiku! Saya menentang gagasan itu! Karena kebebasan adalah hak mutlak dari benderaku yang selalu bebas!"
 TUR_fundamentalism: "Fundamentalisme"
 TUR_fundamentalism_desc: "Ya Tuhan yang mulia, satu-satunya harapan dari hatiku yang dilanda rasa sakit adalah agar tidak ada tangan orang kafir yang menyentuh dada Kuil suciku."
 TUR_absolutism: "Absolutisme"
 TUR_absolutism_desc: "Jangan memandang tanah yang Anda injak sebagai tanah belaka – kenali! Dan pikirkan tentang ribuan orang yang tidak mengenakan kain kafan, yang berbaring dengan anggun di bawah Anda. Anda adalah putra seorang martir yang mulia - malulah, jangan bersedih hati pada leluhur Anda! Jangan sampai terjadi, bahkan ketika Anda dijanjikan dunia-dunia, tanah air surgawi ini."
 TUR_ultranationalism: "Ultranasionalisme"
 TUR_ultranationalism_desc: "Semoga Tuhan mengambil nyawaku, orang-orang yang kucintai, dan semua harta benda dariku jika Dia menghendakinya, tapi biarlah Dia tidak mencabut satu-satunya tanah airku yang sebenarnya di dunia ini. Adzan ini dan kesaksiannya adalah landasan agamaku, dan semoga suara mulianya bergemuruh di seluruh tanah airku yang abadi."
 TUR_socialism: "Sosialisme"
 TUR_socialism_desc: "Temanku! Jangan serahkan tanah airku ke tangan orang-orang jahat! Jadikan dadamu sebagai pelindung dan tubuhmu sebagai benteng! Hentikan serangan tercela ini!"
 TUR_mustafa_kemal_ataturk_figurehead: "Mustafa Kemal Ataturk"
 TUR_mustafa_kemal_ataturk_figurehead_desc: "Bahkan di masa pensiunnya, Ghazi kita tidak bisa tidak terlibat dalam politik negara kita. Dia mungkin tidak lagi secara resmi menjadi presiden, tetapi perkataan Mustafa Kemal Atatürk tetap menjadi hukum – bahkan sampai sekarang."
