 GRE_metaxism_6: "Metaksisme"
 GRE_metaxism_6_desc: "Metaxisme mengedepankan netralitas dalam urusan luar negeri sehingga kebijakan korporatisme dan nasionalisme dalam negeri dapat dipupuk dan dikembangkan dengan lebih baik."
 GRE_metaxism_7: "Metaksisme"
 GRE_metaxism_7_desc: "Metaxisme adalah ideologi yang menjadi dasar dibangunnya Peradaban Hellenic Ketiga. Metaxisme mengabadikan korporatisme, nasionalisme, dan otoritarianisme sebagai prinsip yang menjadi landasan bagi seluruh bangsa [ROOT.GetAdjective] untuk tumbuh dan sejahtera."
 GRE_martyrs_of_the_anatolian_catastrophe: "Para Martir Bencana Anatolia"
 GRE_martyrs_of_the_anatolian_catastrophe_desc: "Kami berjanji tidak hanya kepada mereka yang kehilangan nyawa saat berperang melawan Turki pada tahun 1922, namun juga kepada mereka yang terpaksa meninggalkan rumah mereka dan hidup dalam kemelaratan di sini. Kegagalan ini hanya bisa dibalas dengan satu cara: penaklukan Konstantinopel. Seorang negarawan besar pernah menyatakan, 'Konstantinopel adalah ibu kota besar, Kota, impian dan harapan seluruh rakyat Yunani.' Kita akan dikenang sebagai pemimpin besar yang akhirnya mewujudkan impian abadi rakyat Yunani, dan dengan melakukan hal tersebut membuktikan diri kita sendiri atas peristiwa tahun 1922."
 GRE_farmer_culture: "Budaya Berfokus pada Petani"
 GRE_farmer_culture_desc: "Kita tidak perlu malu dengan akar agraris kita, kita bisa maju ke zaman modern tanpa melupakan kerajinan yang telah mendefinisikan kita selama berabad-abad. Kami memahami pekerja Yunani dan kami tidak lagi takut untuk menghormati keahliannya terlepas dari kegunaannya bagi negara."
 GRE_industrializing_society: "Masyarakat Industrialisasi"
 GRE_industrializing_society_desc: "Kita hidup di era mesin perang dan tidak dapat ditoleransi lagi bahwa mayoritas pekerja Yunani menghabiskan hidup mereka bekerja keras di bidang produk-produk mewah yang tidak berguna. Kita telah memulai sebuah transisi yang secara mendasar akan membentuk kembali Yunani dan masyarakat Yunani, meskipun sayangnya kita tidak dapat mengharapkan masyarakat Yunani untuk sepenuhnya memahami hal ini dalam beberapa dekade."
 GRE_industrializing_society_communist: "Masyarakat Industrialisasi"
 GRE_industrializing_society_communist_desc: "Kita hidup di era mesin perang dan tidak dapat ditoleransi lagi bahwa mayoritas pekerja Yunani menghabiskan hidup mereka bekerja keras di bidang produk-produk mewah yang tidak berguna. Kita telah memulai sebuah transisi yang secara mendasar akan membentuk kembali Yunani dan masyarakat Yunani, meskipun sayangnya kita tidak dapat mengharapkan masyarakat Yunani untuk sepenuhnya memahami hal ini dalam beberapa dekade."
 GRE_command_economy: "Ekonomi Komando"
 GRE_command_economy_desc: "Kita hidup di era mesin perang dan tidak dapat ditoleransi lagi bahwa mayoritas pekerja Yunani menghabiskan hidup mereka bekerja keras di bidang produk-produk mewah yang tidak berguna. Kami telah memulai transisi yang secara fundamental akan membentuk kembali Yunani dan rakyat Yunani, dan melalui perekonomian yang dikelola negara, kami akan membimbing rakyat Yunani ke arah yang benar."
 GRE_agricultural_communes_idea: "Pertanian Kolektivisasi"
 GRE_agricultural_communes_idea_desc: "Yunani secara tradisional mengandalkan pertanian dan industri ringan dengan produk komersial seperti tembakau menjadi ekspor utama Yunani. Ketergantungan kita pada bentuk manufaktur yang lebih tradisional biasanya membuat kita bergantung pada industri berat dengan kekuatan yang lebih besar untuk proyek-proyek konstruksi, namun dengan semua peternakan yang dikelola berdasarkan skema kolektivisasi, kita dapat mempersiapkan diri dengan lebih baik untuk proyek-proyek masa depan yang lebih ambisius."
 GRE_farmer_managed_communes: "Komunitas Pertanian yang Dikelola Petani"
 GRE_farmer_managed_communes_desc: "Kita tidak perlu malu dengan akar agraris kita, kita bisa maju ke zaman modern tanpa melupakan kerajinan yang telah mendefinisikan kita selama berabad-abad. Kami memahami pekerja Yunani, dan kami tidak lagi takut untuk menghormati keahliannya atau memberinya kendali lebih besar atas mata pencahariannya."
 GRE_rural_exodus: "Eksodus Pedesaan"
 GRE_rural_exodus_Desc: "Dengan dorongan kita menuju industrialisasi, masyarakat telah meninggalkan rumah mereka di daerah pedesaan untuk berbondong-bondong ke kota-kota besar."
 GRE_sophistry_and_science_idea: "Penyesatan dan Sains"
 GRE_sophistry_and_science_idea_desc: "Dengan memupuk saling ketergantungan antara politisi dan ilmuwan, kita akan selangkah lebih dekat menuju modernitas."
 GRE_megali_idea_triumphant: "Ide Megali Berjaya"
 GRE_megali_idea_triumphant_desc: "Selesai: kita menang! Kenangan Eleftherios Venizelos telah terbalas, dan [ROOT.GetNameDef] akhirnya memenuhi takdirnya."
 GRE_eon: "Organisasi Pemuda Nasional"
 GRE_eon_desc: "Ada sesuatu yang mengagumkan dalam cara Jerman dan Italia mengorganisir generasi muda mereka. Kita dapat menyesuaikan model mereka untuk memastikan bahwa generasi muda kita tidak berpartisipasi dalam perilaku asosial atau tidak menghormati pemimpin besar kita [ROOT.GetLeader]."
 GRE_eon_fascist: "Organisasi Pemuda Nasional"
 GRE_eon_fascist_desc: "Ada sesuatu yang mengagumkan dalam cara Jerman dan Italia mengorganisir generasi muda mereka. Kita dapat menyesuaikan model mereka untuk memastikan bahwa generasi muda kita tidak berpartisipasi dalam perilaku asosial atau tidak menghormati pemimpin besar kita [ROOT.GetLeader]."
 GRE_security_batallions: "Batalyon Keamanan"
 GRE_security_batallions_desc: "Untuk menjaga perdamaian di wilayah pendudukan dan di negara kami sendiri, kami terpaksa membentuk batalion keamanan yang terdiri dari kaum fasis paling bersemangat yang bisa ditawarkan negara kami."
 GRE_eee_in_government: "Koalisi dengan EEE"
 GRE_eee_in_government_desc: "Kebutuhan telah memaksa kita untuk bersekutu dengan partai fasis Ethniki Enosis Ellados. Kami hanya bisa berharap keputusan untuk bekerja sama dengan kaum fasis ini tidak akan berdampak buruk pada kami di masa depan..."
 GRE_booming_tourism: "Industri Pariwisata yang sedang booming"
 GRE_booming_tourism_desc: "Lebih banyak orang datang ke [ROOT.GetNameDef] dari luar negeri dibandingkan titik lain mana pun dalam sejarah!"
 GRE_four_year_plan_spirit: "Rencana Empat Tahun"
 GRE_improving_our_defensive_lines: "[Root.GetDefensiveLineName]"
 GRE_DEFENSIVE_FORT_SPIRIT_STANDARD: "Modernisasi Jalur Leonidas"
 GRE_DEFENSIVE_FORT_SPIRIT_METAXAS: "Modernisasi Jalur Metaxas"
 GRE_improving_our_defensive_lines_desc: "Serangan terbaik adalah pertahanan yang baik, dan kami bermaksud memiliki pertahanan yang benar-benar tidak ada duanya."
 GRE_protectors_of_the_mediterranean_spirit: "[Root.GetProtectorsMediterraneanSpiritName]"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_STANDARD: "Pembela Mediterania"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_MONARCHIST: "Juara Mediterania"
 GRE_protectors_of_the_mediterranean_spirit_desc: "Mediterania telah menjadi rumah kami jauh lebih lama dibandingkan rumah orang lain. Kami mempunyai tanggung jawab terhadap wilayah ini, dan terhadap masyarakat di dalamnya – dan kami tidak bermaksud untuk mengabaikan tugas suci ini."
 GRE_ancient_talents: "Bakat Kuno"
 GRE_ancient_talents_desc: "Kita selalu menyukai hal-hal bahari, sejak zaman Perunggu. Dengan memupuk tradisi maritim yang kuat, kami menghormati tradisi lama yang mengalir dalam darah kami."
 GRE_hellenic_army: "Tentara Hellenic"
 GRE_hellenic_army_desc: "Angkatan bersenjata kita mungkin tidak terlalu mengesankan bagi pengamat yang berkunjung, namun masyarakat kita memiliki semangat juang yang tulus: nyala api di dalam diri mereka yang tidak mau padam. Kualitas seperti itu jarang terjadi, dan kita tidak boleh takut untuk memanfaatkannya agar kita bisa menghadapi musuh dengan kedudukan yang setara."
 GRE_hellenic_army_2: "Tentara Hellenic"
 GRE_hellenic_army_2_desc: "Tentara kita kemungkinan besar tidak akan pernah menjadi yang terbesar di Balkan, namun pastinya mereka akan menjadi yang paling efisien."
 GRE_hellenic_army_3: "Tentara Hellenic"
 GRE_hellenic_army_3_desc: "Tentara kita kemungkinan besar tidak akan pernah menjadi yang terbesar di Balkan, namun pastinya mereka akan menjadi yang paling efisien."
 GRE_byzantine_army: "Tentara Bizantium"
 GRE_byzantine_army_desc: "Belum lama ini kita terobsesi untuk memiliki pasukan yang mampu menjaga dan mempertahankan perbatasan kita, namun saat ini kita memperlengkapi dan melatih tentara yang siap berbaris melintasi belahan dunia untuk memenuhi upaya kita merebut kembali sebuah kerajaan. Pasukan kami adalah pasukan yang berbeda dari pasukan lain di dunia, dan dengan itu kami pada akhirnya akan merebut kembali apa yang telah dirampas dari kami."
 GRE_hellenic_air_force_academy: "Akademi Angkatan Udara Hellenic"
 GRE_hellenic_air_force_academy_desc: "Pilot kita bersedia, cakap, dan kompeten – mereka memimpin angkatan udara yang layak bagi negara kita."
 GRE_venerate_the_ancient_hellenes_spirit: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_spirit_desc: "Bukankah kita adalah keturunan orang-orang Yunani yang terhormat di zaman dahulu? Bukankah kita berbagi darah dengan para ahli polemik, filsafat, dan perang itu? Kami akan menanamkan kembali rasa bangga yang kuat pada masyarakat kami, sehingga kami dapat kembali menjadi bintang penuntun Eropa."
 GRE_venerate_the_ancient_hellenes_2: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_2_desc: "Kita akan belajar dari kecerdikan para pejuang Theban, yang menggulingkan hegemoni Sparta melalui kekuatan dan kebijaksanaan."
 GRE_venerate_the_ancient_hellenes_3: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_3_desc: "Kita akan belajar dari para filsuf Athena, yang merancang konsep demokrasi seperti yang kita kenal sekarang."
 GRE_venerate_the_ancient_hellenes_4: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_4_desc: "Kita akan belajar dari contoh bangsa Argead, yang menaklukkan separuh dunia yang kita kenal dari Makedonia yang sederhana."
 GRE_venerate_the_ancient_hellenes_5: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_5_desc: "Kita akan belajar dari kecerdikan para pejuang Thebes yang menggulingkan hegemoni Sparta, dan dari para filsuf Athena, yang merancang konsep demokrasi seperti yang kita kenal sekarang."
 GRE_venerate_the_ancient_hellenes_6: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_6_desc: "Kita akan belajar dari kecerdikan para pejuang Thebes yang menggulingkan hegemoni Sparta, dan dari contoh bangsa Argead, yang menaklukkan separuh dunia yang kita kenal, semuanya dari Makedonia yang sederhana."
 GRE_venerate_the_ancient_hellenes_7: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_7_desc: "Kita akan belajar dari para filsuf Athena yang merancang konsep demokrasi seperti yang kita kenal sekarang, dan dari contoh bangsa Argead, yang menaklukkan separuh dunia, semuanya dari Makedonia yang sederhana."
 GRE_venerate_the_ancient_hellenes_8: "Hormatilah orang Hellenes Kuno"
 GRE_venerate_the_ancient_hellenes_8_desc: "Kami masih mempertahankan semua kualitas yang membuat nenek moyang kami begitu hebat, dan hanya dengan sedikit dorongan, kami dapat memunculkan kembali kualitas tersebut dalam diri masyarakat kami."
 GRE_reviving_the_double_headed_eagle_spirit: "Menghidupkan Kembali Semangat Elang Berkepala Dua"
 GRE_reviving_the_double_headed_eagle_spirit_desc: "Kaum Venizelist adalah pengecut yang menolak membiarkan Yunani mengembalikan kejayaannya yang hilang – kejayaan Byzantium! Mengapa berhenti di pesisir Turki jika kita bisa merebut kembali seluruh wilayah Kekaisaran yang hilang? Era kejayaan baru bagi Yunani telah dimulai!"
 GRE_reviving_the_double_headed_eagle_2: "Menghidupkan Kembali Semangat Elang Berkepala Dua"
 GRE_reviving_the_double_headed_eagle_2_desc: "Kaum Venizelist adalah pengecut yang menolak membiarkan Yunani mengembalikan kejayaannya yang hilang – kejayaan Byzantium! Mengapa berhenti di pesisir Turki jika kita bisa merebut kembali seluruh wilayah Kekaisaran yang hilang? Era kejayaan baru bagi Yunani telah dimulai!"
 GRE_socialist_economy_spirit: "Sosialisme Yunani"
 GRE_socialist_economy_spirit_desc: "Kita telah menerapkan perekonomian yang mengutamakan kepentingan manusia dibandingkan keuntungan. Kita mempunyai musuh yang jelas yaitu para kapitalis yang eksploitatif dari luar negeri dan para hama oportunistik lokal yang ingin menipu pekerja [ROOT.GetAdjective] agar mendapatkan upah yang adil."
 GRE_socialist_economy_2: "Sosialisme Yunani"
 GRE_socialist_economy_2_desc: "Rakyat Yunani sudah terlalu lama berdarah-darah di bawah pemerintahan otokratis raja palsu dan kaum Venizelist yang penghasut perang, inilah waktunya bagi rakyat untuk akhirnya sejahtera di bawah pemerintahan yang mengutamakan mereka!"
 GRE_socialist_economy_3: "Stalinisme Yunani"
 GRE_socialist_economy_3_desc: "Partai berada di atas segalanya; jika seseorang tidak setia kepada Partai, maka mereka adalah pengkhianat subversif dan bahaya bagi seluruh bangsa."
 GRE_socialist_economy_4: "Komunisme Yunani"
 GRE_socialist_economy_4_desc: "Pekerja didahulukan dari segalanya; jika kita sebagai pemerintah yang berkuasa dan terdiri dari buruh tidak bisa mewakili kepentingan terbaik buruh, lalu siapa yang bisa?"
 GRE_cooperative_trade_unions: "Serikat Pekerja Koperasi"
 GRE_red_militias_spirit: "Milisi Merah"
 GRE_red_militias_spirit_desc: "Ada banyak orang yang berusaha menggagalkan upaya kami dalam memodernisasi masyarakat Yunani, namun dengan adanya organisasi milisi yang berdedikasi untuk melestarikan Revolusi, mereka akan semakin sulit menghentikan kami."
 GRE_red_militias_2: "Tentara Merah"
 GRE_red_militias_2_desc: "Negara komunis yang sejati membutuhkan tentara rakyat yang bisa melaksanakan keinginan buruh tanpa mendapat hukuman."
 GRE_red_militias_3: "Penegak Merah"
 GRE_red_militias_3_desc: "Agen-agen subversif yang bersekongkol melawan Partai ada di mana-mana, tetapi Anda hanya perlu melatih sekelompok kecil orang-orang berbakat untuk menemukan dan mencabut mereka..."
 GRE_paying_off_debt_small: "Pembayaran Hutang Kecil"
 GRE_paying_off_debt_large: "Pembayaran Hutang Surplus"
 GRE_communist_protests: "Protes Komunis"
 GRE_economic_fluctuations: "Fluktuasi Ekonomi"
 GRE_small_investment: "Investasi Kecil ke [GRE.GetNameDef]"
 GRE_small_investment_desc: "Kami telah melakukan investasi kecil pada perekonomian [GRE.GetNameDef]."
 GRE_moderate_investment: "Investasi Besar ke [GRE.GetNameDef]"
 GRE_moderate_investment_desc: "Kami telah melakukan investasi yang signifikan pada perekonomian [GRE.GetNameDef]."
 GRE_heavy_investment: "Investasi Besar ke [GRE.GetNameDef]"
 GRE_heavy_investment_desc: "Kami telah melakukan investasi besar pada perekonomian [GRE.GetNameDef]."
 GRE_battle_for_the_bosporus: "Pertempuran Bosporus"
 GRE_battle_for_the_bosporus_desc: "Pertempuran Bosporus telah dimulai, dan kita mempunyai keuntungan! Kita harus berusaha sekeras yang kita bisa agar kemenangan menjadi terjamin!"
