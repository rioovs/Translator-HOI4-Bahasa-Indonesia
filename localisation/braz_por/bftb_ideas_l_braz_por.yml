 GRE_metaxism: "Metaksisme"
 GRE_metaxism_desc: "Metaxisme mengedepankan netralitas dalam urusan luar negeri sehingga kebijakan korporatisme dan nasionalisme dalam negeri dapat dipupuk dan dikembangkan dengan lebih baik."
