  AST_communism_support_text: "[?party_popularity_100@communism|Y]% Dukungan Komunis"
  AST_union_control_1_cat: "Kontrol Serikat"
  AST_union_control_1_cat_desc: "Anggota serikat pekerja kami telah mulai memobilisasi dukungan dari masyarakat umum di seluruh Australia. Kita bisa menyusup ke badan legislatif di masing-masing negara bagian, membangun dukungan bagi pemerintahan yang dipimpin Komunis dari dalam. Hal ini akan menghabiskan banyak kekuatan politik dan mengancam stabilitas negara.\n\nVeteran Garda Baru mengawasi pergerakan kita dengan cermat, dan jika pemerintah gagal bertindak tepat waktu, atau jika negara menjadi terlalu tidak stabil, konflik ini dapat menghancurkan negara sepenuhnya.\n\nDukungan Komunisme: [?party_popularity_100@communism|Y]§Y%§!\n\n§RPerang Saudara akan pecah jika stabilitas turun di bawah 40%, atau jika Pemberontakan Veteran habis.§!"
  AST_union_control_1_cat_name: "Pilih tempat untuk membuat marah serikat pekerja yang mendukung Anda"
  AST_union_control_1_map_area_name: "Negara-negara yang masih dapat dipengaruhi"
  AST_nationalizing_cat: "Nasionalisasi"
  AST_union_control_2_cat: "Kontrol Serikat"
  AST_union_control_2_cat_desc: "Kaum buruh [ROOT.GetNonIdeologyName] tidak menggulingkan penindasnya hanya untuk menyaksikan kekuatan imperial terus membelenggu kawan-kawan kita di luar negeri. Penyebaran komunisme ke luar negeri bukan sekadar tujuan ideologis, namun merupakan kebutuhan strategis. Kita harus mengobarkan api revolusi ke seluruh penjuru dunia, memberikan harapan dan sumber daya kepada mereka yang ingin melepaskan diri dari imperialisme, sampai tatanan lama tidak mempunyai pijakan lagi untuk berpijak."
  AST_union_control_2_foreign_cat: "Menekan Komunisme"
  AST_union_control_tt: "Serikat pekerja harus didirikan di negara-negara bagian di seluruh Australia, namun para Veteran Garda Baru berupaya untuk menggagalkan penyebaran Komunisme."
  AST_seize_local_leadership_in_state_major: "Rebut Kepemimpinan Lokal di [FROM.GetName]"
  AST_seize_local_leadership_in_state_mid: "Rebut Kepemimpinan Lokal di [FROM.GetName]"
  AST_seize_local_leadership_in_state_low: "Rebut Kepemimpinan Lokal di [FROM.GetName]"
  AST_seize_local_leadership_in_queensland: "Rebut Kepemimpinan Lokal di Queensland"
  AST_union_strike: "Atur Pemogokan"
  AST_union_strike_desc: "Pekerja kami diusir dari tempat kerja mereka, menuntut kondisi dan hak yang lebih baik. Hal ini tentu akan memberikan tekanan pada pemerintah untuk melakukan reformasi baru."
  AST_veterans_revolt: "Pemberontakan Veteran"
  AST_veterans_revolt_desc: "Tentara mempunyai banyak anggota anti-komunis, banyak di antaranya sebelumnya merupakan bagian dari kelompok fasis. Mereka meremehkan komunisme, dan lebih cepat mengangkat senjata daripada melihatnya naik ke tampuk kekuasaan.\nJika kita terlalu lama dalam mewujudkan revolusi, atau membiarkan stabilitas menjadi terlalu rendah, mereka akan mengambil tindakan sendiri untuk mencegah hal itu terjadi."
  AST_organize_in_nation: "Menyusup ke Serikat Pekerja di §Y[FROM.GetName]§!"
  AST_organize_in_nation_desc: "Gerakan buruh tidak mengenal batas negara. Dengan menyalurkan sumber daya ke dalam jaringan kawan-kawan kita, kita dapat memasukkan organisator komunis ke dalam serikat buruh [FROM.GetName], membangun dukungan akar rumput bagi revolusi dari dalam kelas pekerja."
  AST_civil_war_in_nation: "Menghasut Revolusi di §Y[FROM.GetName]§!"
  AST_civil_war_in_nation_desc: "Benih yang kita tabur sudah siap berbuah. Dukungan komunis di [FROM.GetName] telah berkembang hingga revolusi terbuka dapat dijangkau. Dengan pendanaan, agitator, dan dorongan yang diatur dengan cermat, kita dapat mengubah ketidakpuasan masyarakat menjadi pemberontakan bersenjata, membawa [FROM.GetName] satu langkah lebih dekat ke kondisi buruh yang layak mereka dapatkan."
  AST_take_it_to_foreign_streets: "Menyelenggarakan Pawai Solidaritas Pekerja Internasional"
  AST_take_it_to_foreign_streets_desc: "Pekerja tidak mempunyai batasan. Kami akan meluncurkan kampanye internasional yang terkoordinasi, mengirimkan organisator komunis Australia ke jalan-jalan di setiap negara di mana pengaruh kami telah kuat, menghidupkan kembali gerakan-gerakan lokal dan menjaga api revolusi tetap menyala."
  AST_take_it_to_foreign_streets_tt: "Memperpanjang durasi Pengaruh Komunis Asing sebanyak 60 hari di semua negara yang saat ini disusupi."
  AST_raj_locked_tt: "Raj tidak dapat dijadikan sasaran sampai Selandia Baru, Malaya, Burma, Filipina, dan Indonesia semuanya jatuh ke tangan pemerintahan komunis."
  AST_supply_arms_to_nation: "Pasokan senjata ke §Y[FROM.GetName]§!"
  AST_supply_arms_to_nation_desc: "Kami akan memasok senjata kepada rekan-rekan kami"
  AST_strikes_tt: "Anda hanya dapat menyelesaikan §Y$AST_workers_educational_association$§!, §Y$AST_off_leash$§!, §Y$AST_a_national_housing_commission$§!, §Y$AST_guaranteed_employment$§!, dan §Y$AST_equal_pay$§! ketika pemogokan sedang berlangsung."
  AST_nationalization: "Mulailah Nasionalisasi"
  AST_nationalizing_process_tt: "Memungkinkan keputusan §YMulai Nasionalisasi§!, menerapkan §YNasionalisasi Sedang Berlangsung§!. Wajib untuk fokus di bawah ini dan dihapus setelah menyelesaikan §YThe Public's Australia§!. §RFokus yang tidak dipilih akan dikunci!§!"
  AST_nationalization_underway_tt: "§YNasionalisasi Sedang Berlangsung§!\nHasil Pabrik: §R-30%§!\nHasil Galangan Kapal: §R-30%§!"
  AST_nationalizing_process_ends_tt: "§RMengambil fokus ini akan mengunci semua fokus di atas!§!"
  AST_union_infiltration_in_progress: "Infiltrasi Serikat Asing Sedang Berlangsung"
  AST_cw_operation_in_progress: "Saat Ini Menghasut Revolusi"
  AST_seize_local_control_tt: "Komunis mengambil kendali negara, memastikan negara berada di pihak kita jika kita terlibat perang saudara."
  AST_peace_out_all_wars_tt: "[THIS.GetName] akan keluar dari semua perang saat ini."
  AST_foreign_overlord_reclaim_foothold_in_target_mission: "Rebut kembali pijakan di [FROM.GetName]"
  AST_foreign_overlord_reclaim_foothold_in_target_mission_tt: "Jika kami atau [?FROM.AST_communist_civil_war_enemy_country.GetName] tidak mengontrol provinsi mana pun di [FROM.GetName]:"
  AST_push_foreign_overlord_out_of_target: "Dorong [?FROM.AST_communist_civil_war_enemy_country.GetName] dari [FROM.GetName]"
