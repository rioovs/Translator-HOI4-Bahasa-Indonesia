  INS_autonomy_reduced_rubber_tax: "Pajak Ekspor Karet Dikurangi"
  INS_autonomy_knil_rank_limit: "Hukum Antidiskriminasi Disahkan di Militer"
  INS_autonomy_flag_legalized: "Pengibaran Bendera Merah Putih Dilegalkan"
  INS_autonomy_education_subsidies: "Subsidi Pendidikan Tersedia untuk Orang Indonesia"
  INS_autonomy_national_language: "Bahasa Indonesia Diakui"
  INS_autonomy_official_flag: "Bendera Indonesia Digunakan"
  INS_move_capital_to_amsterdam: "Pindahkan ibu kota ke Amsterdam"
  INS_move_capital_to_batavia: "Pindahkan ibu kota ke Batavia"
  INS_sukarno_is_dead: "Soekarno telah wafat"
  INS_atjeh_management: "Aksi Polisionil di Atjeh"
  INS_atjeh_management_2: "Integrasikan Atjeh"
  INS_soetardjo_petition: "Petisi Soetardjo Menunggu Persetujuan"
  INS_soetardjo_petition_desc: "Konferensi meja bundar yang diserukan Soetardjo telah digelar, menyimpulkan bahwa [INS.GetNameDef] harus memenuhi serangkaian syarat ekonomi guna menjamin kemandirian. Kita harus menunjukkan kemajuan nyata menuju sasaran-sasaran ini, atau jika tidak [HOL.GetNameDef] pada akhirnya akan membatalkan keputusan tersebut demi mempertahankan status quo."
  INS_soetardjo_petition_refresh_tt: "Mengaktifkan kembali Misi: §YPetisi Soetardjo Menunggu Persetujuan§! dengan durasi §Y120 hari§!."
  INS_soetardjo_pending: "Volksraad Memperdebatkan Petisi Otonomi Soetardjo"
  INS_soetardjo_pending_desc: "Soetardjo adalah seorang anggota Volksraad yang dikenal memimpin gerakan nasionalis moderat. Ia saat ini tengah menyusun petisi yang menuntut agar [INS.GetNameDef] diberi otonomi lebih besar, dan agar sebuah konferensi meja bundar diselenggarakan antara perwakilan Belanda dan Indonesia guna membahas keinginan bangsa Indonesia untuk menjadi otonom dalam persemakmuran Belanda. Petisi ini sedang diperdebatkan di Volksraad. Begitu perdebatan rampung, kita harus memutuskan cara meresponsnya, mengingat dampak petisi ini sangat penting."
  INS_flag_legalized: "Bendera Merah Putih legal untuk dikibarkan"
  INS_owned_states_at_game_start_tt: "Semua Negara Bagian Indonesia"
  INS_win_condition_base_republic_warning: "Runtuhkan Hindia Belanda"
  INS_win_condition_base_republic_warning_desc: "Kita harus terus berjuang, merekrut rakyat jelata, dan memastikan api di dalam dada setiap insan Indonesia terus berkobar. Begitu kita meruntuhkan administrasi Hindia Belanda, [HOL.GetNameDef] tidak akan punya pilihan selain menyerah."
  INS_win_condition_base_republic_real: "Runtuhkan Hindia Belanda"
  INS_win_condition_base_republic_real_desc: "Kita harus terus berjuang, merekrut rakyat jelata, dan memastikan api di dalam dada setiap insan Indonesia terus berkobar. Begitu kita meruntuhkan administrasi Hindia Belanda, [HOL.GetNameDef] tidak akan punya pilihan selain menyerah."
  will_complete_when_conditions_met_tt: "Ini akan dipilih secara otomatis setelah prasyarat terpenuhi."
  INS_militias_cat: "Laskar Rakyat"
  INS_militias_basic_summon: "Mobilisasi Warga Sipil"
  INS_militias_basic_summon_desc: "Kita akan merekrut pemuda dan pelajar yang bersemangat demi kemerdekaan Indonesia untuk bergabung dengan TKR sebagai milisi bersenjata."
  INS_militias_kris_repayment: "Milisi KRIS Menuntut Investasi di Sulawesi"
  INS_militias_di_mission: "Darul Islam Menuntut Perwakilan"
  INS_militias_jakarta_pemuda_mission: "Pemuda Jakarta Menuntut Perbaikan Pendidikan"
  INS_militias_railway_pemuda_mission: "Angkatan Pemuda Kereta Api Menuntut Penugasan Tempur"
  INS_revolution_planning_cat: "Revolusi Bawah Tanah"
  INS_revolution_planning_hq: "Bentuk Markas Besar Revolusioner di [FROM.GetName]"
  INS_revolution_planning_hq_desc: "Kita akan mendirikan markas besar milisi kita di [FROM.GetName], yang akan berfungsi sebagai komando pusat bagi pangkalan-pangkalan milisi di seantero nusantara. Markas besar kita dan wilayah sekitarnya akan diprioritaskan dalam misi infiltrasi dan akan berada kuat di bawah kendali kita."
  INS_revolution_planning_hq_tt: "Telah membangun paling banyak §Y3§! markas besar revolusioner"
  INS_revolution_planning_hq_DONE: "Markas Besar Revolusioner"
  INS_revolution_planning_hq_DONE_desc: "Ini adalah markas besar revolusioner kita, tempat milisi kita melapor. Wilayah ini akan berada di bawah kendali kita begitu kita memproklamasikan kemerdekaan."
  INS_revolution_planning_hq_DONE_trigger_tt: "Hanya dapat mendirikan satu Markas Besar"
  INS_revolution_planning_envoy_DONE_trigger_tt: "Tidak dapat mendirikan beberapa pangkalan di wilayah yang sama"
  INS_revolution_planning_envoy_DONE: "Pangkalan Milisi di [FROM.GetName]"
  INS_has_revolutionary_hq: "Telah mendirikan Markas Besar Revolusioner"
  INS_revolution_planning_influence_state: "Dirikan Pangkalan Milisi di [FROM.GetName]"
  INS_revolution_planning_influence_state_desc: "Kami akan mengirimkan milisi ke [FROM.GetName] untuk mendirikan basis milisi, memastikan kaum revolusioner lokal dapat berkomunikasi dengan markas besar dan memiliki waktu yang lebih mudah untuk melaksanakan operasi setelah kami mendeklarasikan kemerdekaan."
  INS_revolution_planning_cat_map_name: "Pilih lokasi untuk mengelola aktivitas milisi"
  INS_state_revolution_hq_tt: "Wilayah akan dikendalikan oleh kita begitu kita menyatakan kemerdekaan"
  INS_hq_warning: "§W§RMenempatkan markas besar kita di sini sangat sulit dan akan menguras sebagian besar sumber daya kita.§!§!"
  INS_revolution_points_remaining_tt: "Dapat membangun setidaknya §Y1§! pangkalan milisi lagi (saat ini tersisa §Y[?INS_revolution_points_remaining]§!)"
  INS_revolution_planning_influence_state_points_notif_tt: "Kita akan dapat mendirikan pangkalan milisi di §Y[?INS_starting_revolution_points_count]§! wilayah tambahan §Rdi luar Jawa§!."
  INS_revolution_planning_influence_state_points_notif_tt_1: "Kita hanya akan dapat mendirikan pangkalan milisi di §Y1§! wilayah tambahan §Rdi luar Jawa§!."
  INS_revolution_point_spend_tt: "Pangkalan milisi didirikan di [FROM.GetName]"
  INS_revolution_points_in_state_tt: "[FROM.GetName] belum memiliki pangkalan milisi"
  war_escalation_1_or_more_tt: "Eskalasi setidaknya §Y1§!"
  war_escalation_2_or_more_tt: "Eskalasi setidaknya §Y2§!"
  war_escalation_3_or_more_tt: "Eskalasi setidaknya §Y3§!"
  war_escalation_4_or_more_tt: "Eskalasi setidaknya §Y4§!"
  war_escalation_5_or_more_tt: "Eskalasi setidaknya §Y5§!"
  war_escalation_7_or_more_tt: "Eskalasi setidaknya §Y7§!"
  war_escalation_8_or_more_tt: "Eskalasi setidaknya §Y8§!"
  war_escalation_10_or_more_tt: "Eskalasi mencapai §Y10§!"
  war_escalation_10_max_tt: "Eskalasi di bawah §Y10§!"
  INS_no_raids_allowed_tt: "§W§RSerbuan tidak akan tersedia selama keputusan ini aktif.§!§!"
  INS_is_deescalating_tt: "Tidak sedang menjalankan misi deeskalasi"
  INS_escalate_the_conflict: "Eskalasi Konflik"
  INS_escalate_the_conflict_desc: "Kita akan mengorganisasi kerusuhan dan pertempuran kecil melawan pasukan musuh untuk meningkatkan ketegangan dan eskalasi, meletakkan dasar agar operasi yang lebih besar nantinya menghadapi lebih sedikit sorotan internasional."
  INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
  INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
  INS_deescalate_the_conflict: "Minta Mediasi Internasional"
  INS_deescalate_the_conflict_2: "Perintahkan Gencatan Senjata"
  INS_deescalate_the_conflict_desc: "Belanda tidak akan berunding dengan kita secara tulus. Bagi mereka kita tetaplah pemberontak, sebuah gangguan yang harus ditumpas alih-alih bangsa berdaulat yang patut diperhitungkan. Namun kekuatan-kekuatan besar dunia adalah persoalan lain, dan Den Haag tidak dapat mengabaikan mereka begitu saja. Kita akan mengajukan permohonan kepada masyarakat internasional untuk melakukan mediasi, membiarkan tekanan luar negeri memaksakan apa yang tidak dapat dicapai oleh suara kita sendiri."
  INS_deescalate_the_conflict_2_desc: "Serbuan kita telah membuahkan hasil. Pasukan garnisun kolonial tahu jangkauan kekuatan kita, dan Den Haag tahu kita tidak gentar. Namun setiap serangan memberi Belanda alasan baru untuk mengirim lebih banyak serdadu dan kapal tempur, sedangkan kita belum siap untuk perang terbuka. Perintah akan disampaikan kepada komandan-komandan kita untuk menahan tembakan. Serangan berikutnya dilancarkan atas kehendak kita, bukan saat Belanda memprovokasi kita."
  INS_renville_tt_HOL: "§W§Y[USA.GetFlag][USA.GetNameDefCap]§! akan memberi kita ultimatum. Jika kita tidak menyerah dan menarik diri dari Indonesia, mereka akan §Rmenyatakan perang§! terhadap kita.§!"
  INS_renville_wont_happen_neutral_tt: "Konflik akan berakhir sebelum perundingan Amerika tuntas, mereka tidak akan dapat campur tangan."
  INS_renville_explain_USA_tt: "Jika konflik belum terselesaikan dalam §Y365 hari§!:"
  INS_renville_timer_mission_republic: "Perundingan Renville Tertunda"
  INS_renville_timer_mission_HOL: "$INS_renville_timer_mission_republic$"
  INS_national_revolution_peace_negotiation: "Rundingkan penarikan pasukan dari [FROM.GetName]"
  indonesia_reduce_escalation_1_effect_tooltip_for_min_4: "Mengurangi eskalasi sebesar §G1§!, hingga batas minimal §Y4§!."
  INS_ongoing_influence_process: "Tidak sedang mendirikan pangkalan milisi"
  INS_current_revolution_strength_3_tt: "Wilayah ini saat ini memiliki aktivitas milisi §GTinggi§!."
  INS_current_revolution_strength_0_tt: "Wilayah ini saat ini tidak memiliki aktivitas milisi."
  INS_has_spent_points_trigger_tt: "Tidak dapat mendirikan pangkalan milisi tambahan"
  INS_national_revolution_cat: "Revolusi Nasional Indonesia"
  INS_national_revolution_cat_desc: "Setelah 350 tahun berada di bawah tirani Belanda, kami mengambil tindakan sendiri dan mendeklarasikan kemerdekaan. Belanda tidak mengakui kekuasaan kami, masih terus memerintah Hindia sebagai wilayah jajahannya dan memperlakukan kami sebagai penjahat.\n\nKita harus terus menguasai lebih banyak wilayah dan kota-kota penting dan menggulingkan pemerintahan Belanda dari dalam. Namun, kita harus berhati-hati untuk tidak bersikap terlalu agresif tanpa perencanaan yang matang, karena eskalasi yang cepat dari kita dapat memicu tindakan militer Belanda."
  INS_national_revolution_cat_map: "Lancarkan Pemberontakan Tipuan"
  INS_national_revolution_dutch_cat: "Milisi Revolusioner di Hindia"
  INS_national_revolution_dutch_cat_desc: "Kaum revolusioner di Hindia Timur secara ilegal mendeklarasikan kemerdekaan, dan mengambil kendali atas wilayah Hindia dengan pasukan milisi. Meskipun kami telah berupaya sebaik-baiknya, kami tidak mampu memulihkan kendali di wilayah-wilayah ini karena banyaknya pasukan milisi yang ada.\n\nKita perlu menghentikan mereka sebelum mereka mengambil kendali atas lebih banyak kota dan semakin menggoyahkan pemerintahan Hindia Belanda. Meskipun ekstrim, kekuatan militer mungkin diperlukan jika mereka terus bertindak seperti ini."
  INS_HOL_revolution_not_going_well_tt: "§RTanpa Batavia kita tidak dapat memerintah Hindia, dan kita tidak akan punya pilihan selain merundingkan perjanjian damai dengan kaum revolusioner.§!"
  INS_gradual_escalation_republic: "Eskalasi Bertahap"
  INS_gradual_escalation_HOL: "Eskalasi Bertahap"
  INS_gradual_escalation_republic_desc: "Pembalasan Belanda semakin besar setelah setiap penggerebekan kami, dan patroli mereka terus berlanjut hingga ke distrik-distrik yang telah mereka tinggalkan beberapa bulan lalu. Para komandan kami melaporkan bahwa pertempuran yang lebih sengit terjadi di tempat-tempat yang sudah lama diperkirakan telah terselesaikan, dan jumlah korban di pihak kami bertambah lebih cepat dibandingkan kemampuan perekrut untuk menggantikan mereka. Konflik telah menyebar ke provinsi-provinsi yang tenang pada tahun lalu."
  INS_gradual_escalation_HOL_desc: "Laporan dari residensi kami memburuk dari minggu ke minggu. Para pemberontak menyerang di distrik-distrik di mana mereka tidak diperkirakan akan beroperasi, dan komando militer di Batavia mendesak dilakukannya tindakan yang lebih berat daripada yang pernah dilakukan sebelumnya. Di Den Haag, orang-orang yang pernah memberikan nasihat tentang kesabaran semakin berkurang di setiap rapat kabinet."
  INS_national_revolution_republic_win_ins_tt: "Milisi Republik [INS.GetAdjective] akan menegakkan §Gkendali de-facto§! atas wilayah ini, dan konflik akan berakhir dengan §GKemenangan Republik§!."
  INS_national_revolution_republic_win_hol_tt: "Milisi Republik [INS.GetAdjective] akan menegakkan §Rkendali de-facto§! atas wilayah ini, dan konflik akan berakhir dengan §RKemenangan Republik§!."
  INS_national_revolution_dutch_cat_map: "Lihat wilayah yang diduduki milisi"
  INS_take_batavia: "Rebut Kendali atas Jawa"
  INS_take_batavia_desc: "Keserakahan Belanda yang membuat mereka berinvestasi hampir secara eksklusif di Jawa dan mengabaikan pulau-pulau timur telah menjadikan Jawa sebagai tumit Achilles bagi seluruh koloni. Ini akan menjadi kehancuran mereka! Kita harus mengerahkan segenap kekuatan kita ke Jawa dan menghancurkan jaringan komunikasi serta pasokan Belanda, melumpuhkan jalannya administrasi Hindia Belanda."
  INS_hold_batavia_HOL: "Pertahankan Jawa"
  INS_hold_batavia_HOL_desc: "Pasukan Republik telah memulai operasi untuk merelokasi sebagian besar pasukannya ke Jawa, berupaya merebut kendali atas seluruh pulau. Kita harus terus bertahan; operasi mereka sangat berisiko, dan memberi kita peluang untuk menumbangkan pemerintahan mereka jika mereka gagal."
  INS_militias_moestopo_mission: "Moestopo Menuntut Kenaikan Pangkat atas Jasanya"
  INS_militias_pki_uprising_mission: "Pemberontakan Komunis Tak Terhindarkan"
  INS_pacific_revolution_cat: "Revolusi Pasifik"
  INS_instigate_in_country: "Hasut Revolusi di [FROM.GetName]"
  INS_instigate_in_country_desc: "Revolusi kita tidak berakhir ketika tentara kolonial terakhir diusir dari tanah [ROOT.GetAdjective]. Buruh dan tani [FROM.GetName] menderita di bawah beban yang sama yang telah kita tinggalkan, dan mereka sekarang memandang kita sebagai bukti bahwa penindas dapat dikalahkan. Kita akan mengirim para agitator ke tengah-tengah mereka, menyebarkan pamflet, mendanai serikat pekerja mereka, dan mengobarkan api ketidakpuasan hingga kondisi revolusi matang."
  INS_launch_revolution: "Serukan Revolusi"
  INS_launch_revolution_desc: "Kondisi di [FROM.GetName] telah matang. Agen-agen kita melaporkan meningkatnya keresahan di pabrik-pabrik dan ladang-ladang, dan sel-sel partai setempat siap bertindak. Tiba saatnya menyerukan buruh dan tani di [FROM.GetName] untuk bangkit dan merebut apa yang menjadi hak mereka."
  INS_anti_colonialist_bonus: "Sebarkan Sentimen Antikolonial di [FROM.GetName]"
  INS_anti_colonialist_bonus_desc: "Rakyat [FROM.GetName] bekerja keras untuk kepentingan tuan asing, dibuat untuk melayani kepentingan yang bukan kepentingan mereka sendiri. Kami akan mengingatkan mereka bahwa ketaatan adalah sebuah pilihan, dan bahwa tuan mereka tidak sekuat yang mereka bayangkan."
  INS_revolutionary_sentiment: "Bekerja Sama dengan Kaum Revolusioner [FROM.GetAdjective]"
  INS_revolutionary_sentiment_desc: "Ada kelompok di [FROM.GetName] yang telah mengangkat senjata atas inisiatif mereka sendiri. Mereka kekurangan organisasi dan perlengkapan, tetapi tidak kekurangan tekad. Dengan berkoordinasi bersama kelompok-kelompok ini, kita dapat mempercepat runtuhnya tatanan yang ada, sekalipun ketidakstabilan yang ditimbulkan membuat negeri ini lebih sulit diperintah dalam jangka pendek."
  INS_arm_militias: "Persenjatai Milisi Lokal [FROM.GetAdjective]"
  INS_arm_militias_desc: "Pamflet dan pidato hanya mampu membawa revolusi sejauh batas tertentu. Saat saatnya tiba, kawan-kawan kita di [FROM.GetName] harus mampu bertempur. Senjata dan perbekalan berlebih harus diselundupkan kepada milisi-milisi simpatisan agar kekuatan reaksi menghadapi rakyat bersenjata, bukan rakyat yang tak berdaya."
  INS_arm_militias_tt: "Jika perang saudara pecah, kaum Komunis akan memulai perang dengan divisi tambahan."
  INS_propoganda_mission: "Sebarkan Komunisme ke Seluruh [FROM.GetName]"
  INS_propoganda_mission_desc: "Kader-kader pengorganisasi partai harus dikirim ke seluruh penjuru [FROM.GetName] untuk mendirikan kelompok belajar, merekrut di kalangan serikat buruh, dan membawa pesan revolusi ke desa-desa. Benih yang kita semai hari ini akan segera berbuah manis."
  INS_abandon_mission: "Tinggalkan Misi"
  INS_abandon_mission_desc: "Sumber daya kita tidaklah tak terbatas, dan perjuangan di [FROM.GetNameDef] menuntut lebih dari apa yang saat ini sanggup kita berikan. Kita akan menarik kembali agen-agen kita dan mengalihkan daya upaya ke medan yang paling membutuhkan."
  INS_aslia_cat: "Penyatuan Pasifik"
  INS_maphilindo_speech_ingration: "Anekse wilayah bawahan"
  INS_integrate_subject: "Integrasikan [FROM.GetName]"
  INS_integrate_subject_in_progress: "Sedang mengintegrasikan wilayah bawahan"
  INS_can_raid_here_HOL: "Wilayah Sasaran Serbuan"
  INS_can_raid_here_HOL_tt: "Negara bagian ini berpotensi menjadi sasaran serangan darat milisi yang dilakukan oleh Republik. Jika berhasil, negara akan diambil dari kita. Untuk mempertahankan negara dari penggerebekan, kita dapat:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Meningkatkan §YKeunggulan Udara§!\n- Mengurangi intel terhadap musuh\n- Mengurangi perlawanan dalam negara"
  INS_war_escalation_text: "£generic_war_escalation_text_icon Tingkat Eskalasi: §Y[?INS.INS_war_escalation_level]§!"
  INS_war_escalation_level_tt: "§YEskalasi Saat Ini§!\n\nTingkat Eskalasi meningkat seiring waktu, dan juga oleh Milisi §Ymenduduki negara bagian baru§!, dan [HOL.GetNameDef] mengambil tindakan untuk memerangi aktivitas milisi. Jika situasinya cukup meningkat, hal ini dapat berubah menjadi §Rperang total§!."
  INS_war_escalation_1_tt: "§Y[INS.GetName]§!: Membuka serbuan darat"
  INS_war_escalation_2_tt: "§Y[INS.GetName]§!: Membuka keputusan memerintahkan gencatan senjata"
  INS_war_escalation_3_tt: "§Y[HOL.GetName]§!: Membuka fokus untuk meminta bantuan Inggris atau Prancis"
  INS_war_escalation_4_tt: "§Y[HOL.GetName]§!: Membuka keputusan untuk menyatakan perang (dengan hukuman berat karena penolakan internasional)\n§Y[INS.GetName]§!: Membuka keputusan untuk meminta mediasi internasional untuk melakukan deeskalasi"
  INS_war_escalation_5_tt: "§Y[INS.GetName]§!: Pertempuran Surabaya"
  INS_war_escalation_6_tt: "Tidak ada pengaruh"
  INS_war_escalation_7_tt: "§Y[HOL.GetName]§!: Keputusan untuk menyatakan perang tidak lagi memberikan hukuman\n§Y[INS.GetName]§!: Membuka fokus untuk menyatakan perang"
  INS_war_escalation_8_tt: "§Y[INS.GetName]§!: Membuka fokus untuk meluncurkan kampanye infiltrasi di Jawa. §RHal ini dapat membawa kemenangan awal bagi Indonesia.§!\n§Y[INS.GetName]§!: Percobaan Gagal terhadap Nyawa Sukarno"
