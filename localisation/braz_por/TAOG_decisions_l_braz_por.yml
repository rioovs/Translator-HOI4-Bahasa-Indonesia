  ast_support_for_comrades_idea_improved: "$ast_support_for_comrades_idea$"
  ast_support_for_comrades_idea_improved_desc: "$ast_support_for_comrades_idea$"
  idea_AST_civil_war_on_their_own: "Sendirian"
  idea_AST_civil_war_on_their_own_desc: "Kita harus berperang sendiri dalam perang ini."
  ast_foreign_communist_influence_idea: "Pengaruh Komunis Asing"
  ast_foreign_communist_influence_idea_desc: "Komunis dari Australia mempengaruhi kita!"
  open_mae_moh_lignite_mine: "Buka Tambang Lignit Mae Moh"
  SIA_release_contigency_funds: "Melepaskan Dana Darurat"
  SIA_release_contigency_funds_tt: "Memodifikasi §Y$idea_SIA_contingency_funds$§! oleh"
  SIA_release_contigency_funds_tt2: "selama §Y[?var:SIA_contingency_funds]§! bulan. Pada akhirnya dana tersebut akan hilang. Semakin lama kita mengumpulkan dana di masa damai, semakin lama pula dana tersebut bertahan di masa perang."
  has_released_contingency_funds: "Telah Mencairkan Dana Cadangan Darurat"
  AST_election_approaching_cat: "Mendekati Pemilu"
  AST_election_approaching_cat_desc: "Tidak lama setelah satu pemerintahan terbentuk, pemilu berikutnya sudah dekat. Partai-partai demokratis berusaha keras untuk mendapatkan apa pun yang dapat meningkatkan dukungan mereka, dengan harapan bahwa hal itu akan cukup untuk mengamankan kemenangan setelah TPS dibuka dan kotak suara terisi dengan suara."
  AST_final_reforms_mission: "Reformasi Akhir"
  AST_final_reforms_mission_desc: "Melalui kepemimpinan yang stabil, kecenderungan konservatif, dan kesetiaan kepada Inggris, UAP telah memperkuat dukungannya dan semakin mungkin untuk kembali menjabat. Untuk mempertahankan dukungan publik, para pemimpinnya harus mempercepat reformasi.\n\n§YEfek selama aktif:§!\n§W(§YDemokrat§! Fokus):\n§Y7§! hari Waktu Penyelesaian berkurang§!"
  AST_final_reforms_effect_tt: "Efek saat §Y$AST_final_reforms_mission$§! aktif (§Y180§! hari):"
  AST_labor_campaign_tour_mission: "Tur Kampanye Buruh"
  AST_labor_campaign_tour_mission_desc: "Dalam misinya untuk mewakili setiap warga negara, ALP telah mengadopsi perspektif berbeda mengenai imperialisme dan kesetiaan Australia kepada Kekaisaran. Kebutuhan dalam negeri harus didahulukan, dan kepentingan asing tidak lagi menjadi prioritas.\n\nUntuk menyebarkan pesan ini kepada partai yang berkuasa saat ini dan para pemilih, ALP akan memulai tur kampanye nasional.\n\n§YEfek selama aktif:§!\n§WHarian §YA.L.P§! Suara bertambah: §G+0.05§!§!"
  AST_labor_campaign_tour_effect_tt: "Efek saat §Y$AST_labor_campaign_tour_mission$§! aktif (§Y180§! hari):\nHarian §YA.L.P§! Suara bertambah: §G+0.05§!\n\nEfek dalam §Y180§! hari:"
  AST_election_season_cat: "Musim Pemilu"
  AST_election_season_cat_desc: "Segera setelah satu pemerintahan berkuasa, pemerintahan berikutnya akan bersiap untuk menggantikannya. Saat ini, hanya sedikit yang bisa dilakukan untuk mempengaruhi dukungan masyarakat, namun hal ini tidak akan menghentikan upaya partai-partai tersebut. Ini belum berakhir sampai semuanya selesai, dan hari itu akan tiba di kotak suara."
  AST_election_countdown: "Hitung Mundur Pemilu"
  AST_election_countdown_desc: "Tinggal beberapa hari lagi sampai TPS dibuka.\n\n§W$AST_expected_election_winner_tt$§!"
  AST_government_formation_period: "Masa Pembentukan Pemerintahan"
  AST_government_formation_period_desc: "Setiap partai menginginkan kekuasaan untuk memutuskan kebijakannya sendiri, namun jika keadaan tertentu mengharuskannya, pemerintahan persatuan nasional mungkin merupakan pilihan yang paling masuk akal.\n\n§W§YEfek saat aktif:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n_$AST_ruling_party$ dapat membentuk §YPemerintahan Persatuan Nasional§!.\n\nMembentuk §YPemerintahan Persatuan Nasional§! di jendela Pemilu Demokratik, yang terletak di Pohon Fokus Australia.§!"
  AST_war_is_coming_cat: "Perang Akan Datang"
  AST_war_is_coming_cat_desc: "Ketegangan meningkat, dan para pejabat serta warga negara Australia mulai menyadari bahwa perang mungkin tidak dapat dihindari, terlepas dari seberapa besar kebijakan atau kepentingan mereka menginginkan hal sebaliknya.\n\nKita harus mengadakan rapat Kabinet untuk memutuskan prosedur jika terjadi invasi. Namun sebelum melakukan hal tersebut, ada baiknya mengambil tindakan yang mungkin tidak disetujui oleh seluruh Kabinet."
  AST_seize_civilian_industry: "Rebut Industri Sipil"
  AST_seize_civilian_industry_desc: "Meskipun barang-barang konsumsi merupakan kebutuhan bagi masyarakat dan perekonomian kita, tidak dapat dipungkiri bahwa masa perang mempunyai kebutuhan yang lebih besar. Perang akan datang; kita akan bersiap ketika hal itu terjadi."
  AST_scorch_the_north: "Hanguskan Utara"
  AST_scorch_the_north_desc: "Jika kita mencurigai adanya invasi dari utara, ada beberapa cara untuk menggagalkan kemajuan tersebut, meskipun ada konsekuensinya. Meskipun pembangunan di negara-negara bagian utara kita akan terhambat oleh kebijakan bumi hangus, kebijakan ini mungkin diperlukan untuk menahan para agresor."
  AST_scorch_the_north_tt: "§YEfek ketika negara bagian Utara diserang oleh angkatan laut:§!"
  AST_the_brisbane_line: "Jalur Brisbane"
  AST_the_brisbane_line_desc: "Kemampuan pertahanan Australia mungkin tidak cukup kuat untuk sepenuhnya menahan agresi asing. Dengan mengadopsi kebijakan yang memprioritaskan pertahanan yang kuat di wilayah-wilayah vital, daripada pertahanan yang lemah di seluruh wilayah, kita dapat memastikan bahwa wilayah [AST.GetName] yang paling maju dan dihuni tetap berada di bawah kendali kita.\n\nMeskipun kebijakan seperti itu pasti akan ditentang oleh mereka yang menolak penyerahan diri, Pemerintah mempunyai tanggung jawab untuk mengarahkan [AST.GetName] ke arah yang masuk akal."
  AST_summon_the_cabinet_mission: "Panggil Kabinet"
  AST_summon_the_cabinet_mission_desc: "Memanggil diplomat, pejabat, dan ahli teori ke Canberra; prospek invasi harus didiskusikan."
  AST_summon_the_cabinet_tt1: "Peristiwa ini akan mengganggu pemerintahan yang sedang berjalan, berpotensi menyebabkan §Yruntuhnya§!."
  AST_australian_accusations_modifier: "Tuduhan Australia"
  AST_cabinet_trust_cat: "Kepercayaan Kabinet"
  AST_cabinet_trust_increase_tt: "§GMeningkat§! §YKabinet Kepercayaan§!"
  AST_cabinet_trust_decrease_tt: "§RPenurunan§! §YKabinet Kepercayaan§!"
  AST_cabinet_trust_remove_tt: "§GHapus§! §YSemangat Kepercayaan Kabinet§!"
  AST_australian_comforts_fund: "£BoP_right_texticon Dana Kenyamanan Australia"
  AST_australian_comforts_fund_desc: "Pemerintah akan menghormati salah satu korban Kecelakaan Udara Canberra dengan berinvestasi pada Australian Comforts Fund, dimana istri yang masih hidup adalah pekerja yang antusias.\n\nDana tersebut bertujuan untuk meringankan waktu yang dihabiskan tentara Australia di lapangan dengan mengirimkan barang-barang yang melengkapi jatah tentara dan perlengkapan pribadi mereka, sehingga upaya perang juga akan mendapatkan manfaat dari investasi."
  AST_eminent_successors: "£BoP_right_texticon Penerus Terkemuka"
  AST_eminent_successors_desc: "Beberapa korban Bencana Udara Canberra adalah pejabat pemerintah yang sangat dihormati. Meskipun tidak ada cara untuk mengkompensasi nasib buruk mereka, mungkin penunjukan beberapa penerus terkemuka akan menstabilkan pemerintahan dan memulihkan kepercayaan masyarakat dan para menteri."
  AST_critics_to_shame: "£BoP_right_texticon Kritik yang Malu"
  AST_critics_to_shame_desc: "Bencana Udara di Canberra telah berdampak pada seluruh negara, sehingga tidak ada warga Australia yang tidak tersentuh oleh duka cita. Di saat seperti ini, akan selalu ada pihak yang mengambil keuntungan. Kami akan memaparkan kritik mereka yang paling keras mengenai apa sebenarnya kritik mereka; upaya untuk mengganggu ketertiban."
  AST_approach_the_independents: "£BoP_left_texticon Pendekatan kepada Pihak Independen"
  AST_approach_the_independents_desc: "Pemerintahan ini tidak stabil karena kepercayaan terhadap kemampuannya untuk membimbing Australia melewati gejolak yang terjadi baru-baru ini semakin memudar. Dengan melakukan pendekatan kepada pihak independen, mereka dapat dibujuk untuk menyadari bahwa perubahan dalam pemerintahan adalah yang terbaik."
  AST_a_sound_voice: "£BoP_left_texticon Suara Suara"
  AST_a_sound_voice_desc: "Di masa gejolak politik ini, satu suara yang penuh percaya diri nampaknya menginspirasi kepercayaan di antara masyarakat Australia. Mungkinkah itu suara pemimpin [AST.GetName] berikutnya?"
  AST_challenge_government_narrative: "£BoP_left_texticon Menantang Narasi Pemerintah"
  AST_challenge_government_narrative_desc: "Perincian yang dibagikan oleh pemerintah mengenai Bencana Udara Canberra tampak tidak biasa, sehingga menimbulkan spekulasi bahwa beberapa informasi mungkin dirahasiakan. Bagaimana seorang perwira RAAF yang berpengalaman bisa menabrakkan pesawatnya dalam kondisi penerbangan yang ideal? Jawaban harus diminta dari pemerintah."
  AST_make_a_common_enemy: "Jadikan Musuh Bersama"
  AST_make_a_common_enemy_desc: "Suara-suara ketidakpercayaan semakin meningkat menyusul hilangnya para pejabat yang tewas dalam Bencana Udara Canberra. Keadaan yang tidak biasa pada kecelakaan tersebut bukan satu-satunya faktor yang mendorong kecurigaan adanya keterlibatan pihak asing; lagi pula, tidak ada yang lebih menyatukan selain musuh bersama."
  AST_make_a_common_enemy_tt: "§RKemungkinan Dampak Peristiwa:§!"
  AST_ensure_cabinet_loyalty: "Pastikan Loyalitas Kabinet"
  AST_ensure_cabinet_loyalty_desc: "Ancaman mosi tidak percaya tidak menimbulkan bahaya selama mayoritas suara di kabinet mendukung pemerintahan yang sedang menjabat. Kami akan memastikan loyalitas kabinet."
  AST_monarchist_intervention: "[GET_AST_MONARCHIST_INTERVENTION]"
  AST_monarchist_intervention_desc: "[GET_AST_MONARCHIST_INTERVENTION_DESC]"
  AST_the_crown_intervenes: "Mahkota Melakukan Intervensi"
  AST_the_crown_intervenes_desc: "Garda Baru, pelindung negara dan ketertiban, kecewa dengan kekacauan yang terjadi saat ini. Para anggota terkemuka, dipandu oleh warisan Inggris dan cita-cita monarki mereka, telah memulai kontak dengan pejabat Inggris untuk meminta bantuan mereka.\n\nSekarang, Garda Baru mengajukan permohonan kepada pemerintah [AST.GetAdjective]: menyambut intervensi Inggris."
  AST_a_monarchist_appeal: "Seruan Monarki"
  AST_a_monarchist_appeal_desc: "Garda Baru, pelindung negara dan ketertiban, kecewa dengan kekacauan yang terjadi saat ini. Anggota-anggota terkemuka, yang dipandu oleh warisan Inggris dan cita-cita monarki mereka, khawatir bahwa Australia akan mengalami hal yang sama seperti [ENG.GetNameDef], di mana kekacauan nasional dan politik menyebabkan berakhirnya Persemakmuran Inggris seperti yang kita kenal, dan juga monarkinya.\n\nSekarang, Garda Baru meminta Gubernur Jenderal untuk memimpin melalui potensi krisis konstitusional ini tanpa terburu-buru membentuk pemerintahan baru, atau membiarkan pemerintahan lama mendapatkan kembali kendali. Mungkin sudah waktunya bagi [AST.GetName] untuk menghormati tradisi yang telah ditinggalkan oleh [ENG.GetNameDef], dan agar bangsa kita bertahta dalam kejayaan dan persatuan."
  AST_the_crown_intervenes_trigger_tt: "Lebih dari §Y15.000§! anggota Garda Baru"
  AST_add_the_crown_intervenes_tt: "Ungkapkan fokus:\n§Y$AST_for_crown_and_empire$§! cabang\n§Y$AST_the_kings_men$§!"
  AST_remove_the_crown_intervenes_tt: "Hapus fokus:\n§Y$AST_for_crown_and_empire$§! cabang\n§Y$AST_the_kings_men$§!"
  AST_castle_crumbling_mission: "Kastil Runtuh"
  AST_castle_crumbling_mission_desc: "Australia menaruh perhatian pada para pemimpinnya pasca Bencana Udara Canberra yang tragis. Akankah pemerintahan yang berkuasa tetap layak mendapat kepercayaan masyarakat bahkan setelah kehilangan pejabat kabinet, atau apakah pergantian kepemimpinan hanya akan menjadi yang terbaik?"
  AST_castle_crumbling_mission_event_tt: "§YEfek kejadian:§!"
  AST_castle_crumbling_mission_complete_tt: "Selesaikan misi §YCastle Runtuh§!"
  AST_castle_crumbling_reactivate_tt: "§LGubernur Jenderal sedang melakukan perundingan§! (fokus §YUntuk Mahkota dan Kerajaan§!)§L; keputusan akhir mengenai Pemerintah akan ditunda.§!"
  AST_cabinet_trust_complete_1_flag: "Telah Mengambil Keputusan: §YJadikan Musuh Bersama§!"
  AST_cabinet_trust_complete_2_flag: "Telah Mengambil Keputusan: §YPastikan Loyalitas Kabinet§!"
  AST_cabinet_trust_complete_crown_flag: "Telah Mengambil Keputusan : §Y$AST_monarchist_intervention$§!"
  AST_cabinet_trust_complete_not_tt: "Belum mengambil Fokus §YAustralia Pertama§!"
  AST_canberra_air_disaster_flag: "$AST_canberra_air_disaster_events.1.t$"
  AST_war_angst_cat: "Kegelisahan Perang"
  AST_deteriorating_prime_minister_nerves_mission: "Saraf Perdana Menteri yang Memburuk"
  AST_deteriorating_prime_minister_nerves_desc: "[AST.GetLeader] sedang tegang di bawah tekanan perang yang tak terhindarkan. Jika pertolongan tidak dapat segera ditemukan, kegelisahannya mungkin tidak dapat ditahan."
  AST_australian_demands_cat: "Tuntutan Australia"
  AST_aid_australian_military_construction: "Bantuan Konstruksi Militer Australia"
  AST_aid_australian_military_construction_desc: "Inggris belum siap berperang. Dengan membantu Australia dalam pembangunan militer, kita dapat meredakan ketidaksabaran mereka."
  AST_japanese_war_mission: "Perang Jepang"
  AST_japanese_war_mission_desc: "Australia tidak ingin menghadapi musuh besarnya sendirian — [JAP.GetNameDef]. Mereka mendesak kita untuk mengambil langkah pertama dan menyelesaikan konflik yang mungkin terjadi sesegera mungkin."
  AST_resource_acquisition_cat: "Akuisisi Sumber Daya"
  AST_request_resource_rights_in_indonesia: "Minta Hak Sumber Daya di [INS.GetNameDef]"
  AST_request_resource_rights_in_malaya: "Minta Hak Sumber Daya di [MAL.GetNameDef]"
  AST_request_resource_rights_in_burma: "Minta Hak Sumber Daya di [BRM.GetNameDef]"
  AST_request_resource_rights_in_indochina: "Minta Hak Sumber Daya di Indochina Prancis"
  AST_resource_request_ongoing_flag: "Permintaan Sumber Daya §YSedang Berlangsung§!"
  AST_australia_first_movement_cat: "Gerakan Pertama Australia"
  AST_summons_to_australian_hall: "Panggilan ke Australian Hall"
  AST_summons_to_australian_hall_desc: "Dalam upaya kita untuk menumbuhkan [AST.GetFascistParty], kita harus bersatu dan memobilisasi pendukung kita. Aula Australia menunggu."
  AST_summons_to_australian_hall_upgrade: "$AST_summons_to_australian_hall$"
  AST_summons_to_australian_hall_upgrade_desc: "$AST_summons_to_australian_hall_desc$"
  AST_print_the_publicist: "Cetak Humas"
  AST_print_the_publicist_desc: "The Publicist, buletin Australia First, memainkan peran penting dalam menjangkau calon pendukung. Dengan menerbitkan terbitan lain, kami dapat menyebarkan pesan kami."
  AST_print_the_publicist_upgrade: "$AST_print_the_publicist$"
  AST_print_the_publicist_upgrade_desc: "$AST_print_the_publicist_desc$"
  AST_call_on_fascists: "[GET_AST_CALL_ON_FASCISTS]"
  AST_call_on_fascists_desc: "Sebagai sebuah gerakan kecil dengan sedikit pendukung, Australia First tidak selalu mampu memenuhi kebutuhan hidupnya. Namun, kelompok asing yang mempunyai gagasan serupa telah menunjukkan kesediaannya untuk mendanai ambisi kami, menawarkan solusi untuk memastikan kemajuan kami yang berkelanjutan."
  AST_call_on_japanese_fascists: "Panggil Fasis Jepang"
  AST_call_on_foreign_fascists: "Panggil Fasis Asing"
  AST_a_convenient_disaster: "Bencana yang Nyaman"
  AST_a_convenient_disaster_desc: "Betapapun populernya Australia First, kaum konservatif akan selalu menolak ideologi kelompok tersebut. Agar Australia First berhasil memperoleh kekuasaan, mungkin diperlukan sesuatu yang lebih dramatis daripada pemilu biasa; sesuatu yang membuat pemerintahan kacau balau.\n\nGerakan kami tidak memiliki kapasitas untuk memprovokasi peristiwa semacam itu, namun pendukung fasis asing kami tidak. Dengan membantu kita meraih kekuasaan, kaum fasis asing akan menemukan teman di [AST.GetName]."
  AST_a_convenient_disaster_tt: "Peristiwa ini akan mengganggu pemerintahan yang sedang menjabat, yang pada akhirnya memungkinkan §Y[AST.GetFascistParty]§! menjadi partai yang berkuasa."
  AST_a_convenient_disaster_flag: "§YBencana Udara Canberra§! telah dipicu melalui keputusan §YBencana yang Nyaman§!."
  AST_insufficient_funds_mission: "Mengumpulkan Dana yang Cukup"
  AST_insufficient_funds_mission_tt: "Aktifkan Keputusan: §Y$AST_summons_to_australian_hall$§!, §Y$AST_print_the_publicist$§!."
  AST_for_100_days: "Mengaktifkan Misi: §Y$AST_insufficient_funds_mission$§!, selama §Y100§! hari"
  AST_for_50_days: "Mengaktifkan Misi: §Y$AST_insufficient_funds_mission$§!, selama §Y50§! hari"
  AST_insufficient_funds: "Dana Tidak Cukup"
  AST_afm_decisions_fascism_upgrade_tt: "Tingkatkan perolehan Dukungan Fasisme Harian sebesar §YKeputusan Gerakan Pertama Australia§!."
  AST_afm_decisions_autonomy_upgrade_tt: "Peningkatan perolehan Otonomi dari §YKeputusan Gerakan Pertama Australia§!."
  AST_vichy_out_of_africa_cat: "Vichy Keluar dari Afrika"
  AST_demand_madagascar: "Permintaan Madagaskar"
  AST_demand_central_africa: "Permintaan Afrika Tengah"
  AST_demand_southwestern_territories: "Menuntut Wilayah Barat Daya"
  AST_vichy_req_ongoing_flag: "Permintaan Wilayah §YSedang Berlangsung§!"
  AST_remove_vichy_out_of_africa_decisions: "Hapus §YVichy Keluar dari Afrika§! Keputusan."
  AST_naval_efforts_cat: "Upaya Angkatan Laut"
  AST_naval_efforts_cat_desc: "$AST_royal_prestige_desc$"
  AST_refit_a_retired_british_carrier: "Mereparasi Pensiunan Maskapai Inggris"
  AST_dockyard_construction: "Konstruksi Galangan Kapal"
  AST_man_the_docks_first: "Jaga Dermaganya Terlebih Dahulu"
  improved_ship_hull_carrier: "Kapal Induk Lebih Mutakhir"
  AST_harland_wolff_mio_trigger: "Telah menyelesaikan keputusan §Y$AST_refit_a_retired_british_carrier$§!, dibuka dengan fokus §Y$AST_royal_prestige$§!"
  AST_kingdom_expansions_cat: "Perluasan Kerajaan"
  AST_new_zealand_and_clause_6: "Selandia Baru dan Klausul 6"
  AST_new_zealand_and_clause_6_desc: "Selama proses menyatukan koloni-koloni Australia menjadi sebuah federasi, Selandia Baru akhirnya memutuskan untuk tidak ambil bagian. Namun sejak saat itu, Konstitusi terus mendefinisikan Selandia Baru sebagai salah satu negara bagian Australia yang potensial, dan mengizinkan penerimaan negara tersebut.\n\nDengan keamanan nasional mereka yang kini sangat terancam, Selandia Baru, untuk pertama kalinya sejak diberlakukannya Klausul 6, dapat terpengaruh untuk bergabung dengan Kerajaan kami."
  AST_new_zealand_and_clause_6_tt: "(§Y[NZL.GetNameWithFlag]§!) Bergabung dengan §Y[AST.GetNameDef]§!, menyatukan seluruh wilayahnya dan angkatan darat, laut, dan udaranya"
  AST_protector_of_the_indies: "Pelindung Hindia"
  AST_protector_of_the_indies_desc: "Sejak konflik terjadi di Eropa, [HOL.GetNameDef] terlalu sibuk mempertahankan wilayahnya sendiri dan tidak peduli dengan pertahanan koloninya di Indonesia. Potensi jatuhnya [INS.GetNameDef] mungkin akan menentukan nasib negara-negara Asia Tenggara lainnya, dan tidak bisa dibiarkan begitu saja di tangan koloni itu sendiri.\n\n[HOL.GetNameDefCap] juga memahami, mengingat gawatnya situasi, bahwa koloni akan lebih baik dipertahankan oleh [AST.GetNameDef]."
  AST_protector_of_the_indies_tt: "(§Y[INS.GetNameWithFlag]§!) Bergabung dengan §Y[AST.GetNameDef]§!, menyatukan seluruh wilayahnya dan angkatan darat, laut, dan udaranya"
  AST_the_solomon_islands_protectorate: "Protektorat Kepulauan Solomon"
  AST_the_solomon_islands_protectorate_desc: "Sejak tahun 1893, Kepulauan Solomon telah menjadi protektorat. Namun, karena perang menghabiskan pelindungnya, diragukan seberapa besar perlindungan yang dapat diharapkan oleh pulau-pulau tersebut.\n\n[AST.GetNameDefCap] akan berusaha melindungi pulau-pulau itu sendiri, dan tentu saja harus jelas bahwa negara tetangga seperti Australia jauh lebih cocok untuk melakukan tugas seperti itu."
  AST_new_hebrides_and_caledonia_under_our_wing: "Hebrides Baru dan Kaledonia Di Bawah Sayap Kami"
  AST_new_hebrides_and_caledonia_under_our_wing_desc: "Kelompok pulau di Hebrides Baru dan Kaledonia Baru memiliki sejarah panjang pendudukan Eropa, sama seperti Australia. Kini setelah [AST.GetNameDef] akhirnya berhasil melepaskan diri dari para pemukimnya, maka sudah menjadi tanggung jawab kita untuk menjaga lingkungan kita, terutama mereka yang memiliki latar belakang serupa dengan kita.\n\nDengan ketegangan dunia yang memberikan tekanan pada penghuni pulau-pulau tersebut, kita akhirnya dapat membuat mereka memahami bahwa Hebrides Baru dan Kaledonia Baru akan lebih aman jika berada di wilayah Australia."
  AST_rejects_request: "[FROM.GetNameWithFlag] Menolak permintaan berikut:"
  AST_big_business_pact_cat: "Pakta Bisnis Besar"
  AST_big_business_request_ongoing_flag: "Permintaan Bisnis Besar §YSedang Berlangsung§!"
  AST_naval_expansion: "$NOR_alt_dem_naval_expansion$"
  AST_naval_expansion_desc: "Sebagai imbalan atas [ROOT.GetFascistParty] yang mengambil kebijakan yang menguntungkan mereka, tokoh-tokoh bisnis terkemuka telah setuju untuk berinvestasi dalam reformasi industri yang selaras dengan tujuan partai.\n\nArmada harus diperluas jika [AST.GetName] ingin memiliki peluang melawan musuh-musuh dengan kekuatan angkatan laut yang lebih unggul. Untuk waktu yang terbatas, semua pekerja harus berada di dek di galangan kapal, memastikan peningkatan produksi kapal."
  AST_factory_conversions: "Konversi Pabrik"
  AST_factory_conversions_desc: "Sebagai imbalan atas [ROOT.GetFascistParty] yang mengambil kebijakan yang menguntungkan mereka, tokoh-tokoh bisnis terkemuka telah setuju untuk berinvestasi dalam reformasi industri yang selaras dengan tujuan partai.\n\nIndustri pertahanan harus diprioritaskan, dan oleh karena itu pabrik-pabrik Australia harus diubah untuk mendukungnya."
  AST_land_development: "Pengembangan Lahan"
  AST_land_development_desc: "Sebagai imbalan atas [ROOT.GetFascistParty] yang mengambil kebijakan yang menguntungkan mereka, tokoh-tokoh bisnis terkemuka telah setuju untuk berinvestasi dalam reformasi industri yang selaras dengan tujuan partai.\n\nTerlalu banyak wilayah [ROOT.GetName] yang masih belum terindustrialisasi dan terbelakang. Dengan mengembangkan kawasan ini, kita akan menjadikannya layak untuk dibangun."
  AST_electrical_grid_expansions: "Perluasan Jaringan Listrik"
  AST_electrical_grid_expansions_desc: "Sebagai imbalan atas [ROOT.GetFascistParty] yang mengambil kebijakan yang menguntungkan mereka, tokoh-tokoh bisnis terkemuka telah setuju untuk berinvestasi dalam reformasi industri yang selaras dengan tujuan partai.\n\nDengan memperluas jaringan listrik, kita dapat mendorong produksi energi dalam negeri yang tidak bergantung pada impor."
  AST_factory_investments: "Investasi Pabrik"
  AST_factory_investments_desc: "Sebagai imbalan atas [ROOT.GetFascistParty] yang mengambil kebijakan yang menguntungkan mereka, tokoh-tokoh bisnis terkemuka telah setuju untuk berinvestasi dalam reformasi industri yang sejalan dengan tujuan partai.\n\nJika kita ingin memastikan bahwa pasokan militer dan sipil tetap mencukupi pada saat konflik, kita perlu memperluas kapasitas industri kita."
  AST_develop_port_kemla_steel_medium_decision: "Membangun Tungku Ledakan Pelabuhan Kembla Kedua"
  AST_develop_port_kemla_steel_medium_decision_desc: "Pelabuhan Kembla telah berfungsi dengan baik hanya dengan satu tanur sembur, namun permintaan telah meningkat sehingga kami mungkin ingin membangun tanur sembur kedua. Hal ini kira-kira akan menggandakan produksi baja di wilayah tersebut."
  AST_prospect_pilbara_iron_decision: "Membuka Wilayah Pilbara untuk Penambangan"
  AST_prospect_pilbara_iron_decision_desc: "Wilayah Pilbara mempunyai cadangan bijih besi yang sangat besar, termasuk yang terbesar di dunia. Namun, di wilayah yang sangat terpencil di negara ini, investasi yang dibutuhkan untuk memanfaatkan sumber daya ini akan sangat besar... namun demikian juga dengan keuntungan yang didapat."
  AST_scale_up_pilbara_mines_steel_decision: "Tingkatkan Tambang Pilbara"
  AST_scale_up_pilbara_mines_steel_decision_desc: "Kini kawasan Pilbara sudah dibuka untuk pertambangan skala besar, saatnya mengalirkan investasi!"
  AST_pilbara_mining_tt: "Membuka §Y$STATE_870$§! untuk prospeksi lebih lanjut akan memungkinkan pengambilan keputusan berulang untuk meningkatkan produksi baja tanpa batas."
  AST_scale_up_middleback_mines_steel_decision_1: "Perluas Tambang Kenop Besi"
  AST_scale_up_middleback_mines_steel_decision_1_desc: "Meskipun Tambang Kenop Besi telah aktif selama beberapa waktu, dengan meningkatnya permintaan bijih besi, inilah saatnya untuk memperluas upaya kami di sini."
  AST_scale_up_middleback_mines_steel_decision_2: "Buka Tambang Raja Besi"
  AST_scale_up_middleback_mines_steel_decision_2_desc: "Tambang Iron Knob tidak mencukupi kebutuhan kami, untungnya Pegunungan Middleback kaya akan zat besi. Saatnya mendirikan tambang terbesar kami!"
  AST_scale_up_middleback_mines_steel_decision_3: "Buka Tambang Pangeran Besi"
  AST_scale_up_middleback_mines_steel_decision_3_desc: "Permintaan logam pada masa perang selalu tinggi, namun Pegunungan Middleback terus menyediakannya."
  AST_expand_iron_mining_tt: "Memiliki §Y$AST_exports_for_economic_recovery$§!, dan §Y$AST_within_reach$§! akan memungkinkan eksploitasi wilayah Pilbara di §Y$STATE_870$§!, sehingga menghasilkan sumber §YSteel§! yang hampir tidak ada habisnya. Kita bisa menggunakan ini untuk mendorong perekonomian kita."
  AST_develop_port_kemla_steel_tt: "Hal ini akan memungkinkan kami mengambil keputusan §YMembangun Tungku Peledakan Pelabuhan Kembla Kedua§! yang akan meningkatkan produksi §YBaja§! kami secara signifikan."
  AST_develop_middleback_tt: "Ini akan membuka tiga keputusan untuk mengembangkan produksi §YSteel§! kami di §Y$STATE_519$§!"
