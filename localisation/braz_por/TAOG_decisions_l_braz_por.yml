  SIA_war_fervor_cat_desc: "Selera masyarakat terhadap konflik harus dikelola dengan hati-hati. Jika tidak dikendalikan, semangat perang akan mengarah ke dalam diri sendiri – sebuah pemerintahan yang mengobarkan semangat bela diri tanpa mengarahkannya berisiko menjadi sasaran berikutnya."
  SIA_war_fervor_coup_dummy: "Semangat Perang Mendidih"
  SIA_war_fervor_coup_dummy_desc: "Jika keinginan masyarakat untuk berperang meluap-luap tanpa ada jalan keluarnya, hal itu pasti akan diarahkan pada kita."
  SIA_urge_restraint: "Mendesak Menahan Diri"
  SIA_war_fervor_coup: "Kudeta yang akan segera terjadi"
  SIA_modify_cultural_mandates: "Memodifikasi $idea_SIA_thai_cultural_mandates$ dengan:"
  SIA_mandate_1: "Amanat Satu"
  SIA_mandate_1_desc: "Negara, rakyat dan kebangsaannya disebut Thailand"
  SIA_mandate_1_tt: "§Y[THIS.GetName]§! akan dikenal sebagai §Y$SIA_thailand$§!"
  SIA_mandate_2: "Amanat Kedua"
  SIA_mandate_2_desc: "Masyarakat Thailand tidak boleh melakukan bisnis apa pun tanpa mempertimbangkan kemaslahatan dan keselamatan negara\n\nOrang Thailand tidak boleh mengungkapkan apa pun kepada orang asing yang dapat merugikan negara. Tindakan tersebut merupakan pengkhianatan terhadap bangsa\n\nMasyarakat Thailand tidak boleh bertindak sebagai agen atau juru bicara orang asing tanpa mempertimbangkan kepentingan bangsa Thailand, dan tidak boleh menyatakan pendapat atau memihak orang asing dalam perselisihan internasional. Tindakan tersebut merupakan pengkhianatan terhadap bangsa.\n\nMasyarakat Thailand tidak boleh diam-diam membeli tanah atas nama orang asing dengan cara yang membahayakan bangsa. Perbuatan tersebut merupakan pengkhianatan terhadap bangsa.\n\nKetika seseorang telah mengkhianati bangsa, maka sudah menjadi tugas masyarakat Thailand untuk secara aktif dan cepat menghentikannya."
  SIA_mandate_3: "Amanat Ketiga"
  SIA_mandate_3_desc: "Berhenti menyebut orang Thailand yang tidak sesuai dengan nama kebangsaannya, atau sesuai dengan preferensi kelompok.\n\nGunakan nama 'Thai' untuk menyebut semua orang Thailand, tanpa membaginya lagi."
  SIA_mandate_4: "Amanat Keempat"
  SIA_mandate_4_desc: "Bila melihat bendera negara dikibarkan atau diturunkan menurut adat istiadat pemerintah, atau mendengar bunyi terompet atau peluit salut, atau bila isyarat untuk menaikkan atau menurunkan bendera, hormatilah bendera itu menurut peraturan atau adat istiadat.\n\nBila lagu kebangsaan diperdengarkan, baik diperdengarkan untuk keperluan dinas atau dalam upacara apa pun, maka peserta atau hadirin akan menghormati lagu tersebut menurut peraturan atau adat istiadat.\n\nSaat mengamati seseorang tidak memberikan penghormatan sebagaimana menegur mereka sehingga melihat pentingnya penghormatan terhadap bendera negara, lagu kebangsaan, dan lagu kebangsaan."
  SIA_mandate_5: "Amanat Kelima"
  SIA_mandate_5_desc: "Masyarakat Thailand harus berusaha untuk hanya mengonsumsi makanan yang terbuat dari produk Thailand.\n\nOrang Thailand harus berusaha untuk hanya mengenakan pakaian yang terbuat dari produk Thailand.\n\nOrang Thailand harus mendukung upaya pertanian, komersial, industri, dan pekerjaan kejuruan lainnya dari sesama warga Thailand.\n\nOrang Thailand harus menggunakan dan mendukung utilitas publik apa pun yang didirikan oleh pemerintah atau oleh orang Thailand orang.\n\nOrang Thailand yang berpraktik di bidang pertanian, perdagangan, industri, atau pekerjaan lain yang didukung oleh mandat ini harus berupaya mempertahankan standar, meningkatkan kualitas, dan menjalankan bisnis mereka dengan jujur."
  SIA_mandate_6: "Amanat Enam"
  SIA_mandate_6_desc: "Musik lagu kebangsaan akan ditulis oleh Phra Chenduriyang, dan disimpan di Departemen Seni Rupa\n\nLirik lagu kebangsaan akan dikirimkan oleh tentara"
  SIA_mandate_7: "Amanat Tujuh"
  SIA_mandate_7_desc: "Setiap orang Thailand harus membantu membangun bangsa. Setiap orang yang berbadan sehat harus bekerja pada karier yang stabil. Siapa pun yang tidak memiliki karier tidak akan berguna bagi negara dan tidak pantas mendapatkan rasa hormat dari rakyat Thailand."
  SIA_mandate_8: "Amanat Kedelapan"
  SIA_mandate_8_desc: "Pada lagu kerajaan, kami akan mempersingkat lirik lagu kerajaan, dan mengganti kata Siam dengan kata Thai"
  SIA_mandate_9: "Amanat Sembilan"
  SIA_mandate_9_desc: "Orang Thailand harus menjunjung tinggi, menghormati dan menghormati bahasa Thailand, dan harus merasa terhormat untuk berbicara bahasa itu.\n\nOrang Thailand harus menganggap mempelajari bahasa nasional adalah tugas warga negara yang baik, dan setidaknya harus bisa membaca dan menulis; Masyarakat Thailand juga harus menganggap penting tugas mereka untuk membantu dan mendukung warga negara yang tidak bisa berbahasa Thailand atau tidak bisa membaca bahasa Thailand untuk mempelajarinya.\n\nOrang Thailand tidak boleh menganggap tempat lahir, tempat tinggal, atau aksen daerah sebagai penanda perpecahan. Setiap orang harus percaya bahwa semua orang yang lahir sebagai orang Thailand memiliki darah Thailand yang sama dan berbicara bahasa Thailand yang sama. Tempat lahir atau aksen tidak ada bedanya.\n\nOrang Thailand harus menganggap tugas mereka adalah berperilaku sebagai warga negara Thailand yang baik, dan untuk mendesak dan memberi instruksi kepada mereka yang belum mengetahui dan memahami tugas mereka mengenai kewajiban warga negara Thailand yang baik."
  SIA_mandate_10: "Amanat Sepuluh"
  SIA_mandate_10_desc: "Masyarakat Thailand tidak boleh hadir di pertemuan publik, di tempat umum, atau di batas kota tanpa berpakaian pantas. Pakaian yang tidak pantas termasuk hanya mengenakan celana dalam, tidak mengenakan kemeja, atau mengenakan kain sampul.\n\nPakaian yang pantas bagi orang Thailand terdiri dari: Seragam, jika jabatan dan kesempatan memungkinkan; Pakaian sopan gaya internasional; Pakaian adat yang sopan."
  SIA_mandate_11: "Amanat Sebelas"
  SIA_mandate_11_desc: "Orang Thailand harus membagi waktunya menjadi tiga porsi. Satu untuk bekerja, satu untuk aktivitas pribadi, dan satu lagi untuk istirahat dan tidur. Hal ini harus dilakukan secara teratur dan mengikuti jadwal hingga menjadi kebiasaan.\n\nOrang Thailand harus melakukan aktivitas pribadi seperti berikut: Makan pada waktu yang ditentukan, tidak lebih dari empat kali sehari; Tidur kurang lebih 68 jam.\n\nOrang Thailand harus setia menjalankan tugas pekerjaan tanpa putus asa atau melalaikan. Waktu istirahat tengah hari dan makan siang tidak boleh lebih dari satu jam. Di penghujung hari kerja, berolahragalah dengan berolahraga minimal satu jam, atau aktivitas lain seperti berkebun, merawat hewan peliharaan, atau menanam pohon. Kemudian, setelah mandi, makan malam.\n\nOrang Thailand harus menggunakan waktu luang mereka di malam hari untuk menyelesaikan pekerjaan yang diperlukan, berkomunikasi dengan keluarga dan teman, mencari ilmu dengan mendengarkan berita radio atau membaca, atau hiburan atau seni lainnya, jika ada kesempatan."
  SIA_mandate_12: "Amanat Dua Belas"
  SIA_mandate_12_desc: "Di tempat umum atau jalan raya, orang harus membantu dan melindungi anak-anak, orang tua, atau orang cacat.\n\nSiapa pun yang mengikuti butir 1 dianggap sebagai orang berbudaya yang pantas dihormati oleh masyarakat Thailand."
  SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
  SIA_movie_theater_cat_desc: "Layar perak adalah salah satu alat paling ampuh di negara modern. Melalui film dan kampanye propaganda yang dipilih dengan cermat, pemerintah dapat membentuk opini publik, membangkitkan patriotisme, dan meredam suara-suara yang berbeda pendapat."
  SIA_celebrating_the_constitution: "Merayakan Konstitusi"
  SIA_the_revolution_of_24th_june: "Revolusi 24 Juni"
  SIA_suppressing_the_rebellion_of_1933: "Menekan Pemberontakan tahun 1933"
  SIA_the_king_of_krung_thon: "Raja Krung Thon"
  SIA_blood_of_suphan: "Darah Suphan"
  SIA_thai_soldiers_blood: "Darah Tentara Thailand"
  SIA_undauntedly_love_nation: "Tanpa Gentar Cinta Bangsa"
  #LIMITED WAR
  SIA_limited_war_cat: "Perang Terbatas"
  SIA_limited_war_cat_desc: "Kita tidak bisa berharap untuk mengalahkan kekuatan-kekuatan besar di kawasan ini dalam perang terbuka – saat ini kita belum bisa melakukannya. Dengan menekan klaim kami sedikit demi sedikit, melalui kampanye yang dilakukan secara hati-hati, kami mengurangi posisi mereka sementara kekuatan kami terus bertumbuh."
  SIA_start_limited_war_indochina: "Mulai Perang Terbatas di Indochina melawan [FROM.GetName]"
  SIA_start_limited_war_indochina_tt_main: "Memulai §YPerang Terbatas§! melawan §Y[FROM.GetName]§!.\nDengan mengendalikan semua negara bagian yang disorot milik §Y[FROM.GetName]§!, kita akan dapat merebut negara-negara ini tanpa meningkat menjadi perang skala penuh.\n§RKehilangan lebih dari [?var:global.limited_war_surrender_threshold|%.0] kemajuan penyerahan akan membuat kita kalah dalam perang terbatas§!\n\n§RKalah dalam perang terbatas mungkin menyebabkan kita harus mengembalikan wilayah yang telah ditaklukkan sebelumnya§!"
  SIA_start_limited_war_rejoin_faction: "Kami untuk sementara akan meninggalkan faksi kami saat ini, dan bergabung kembali dengan faksi setelah §YPerang Terbatas§! berakhir."
  SIA_start_limited_war_can_join_faction: "Kami akan dapat bergabung dengan faksi lagi setelah berakhirnya §YPerang Terbatas§!"
  is_not_engaged_in_a_limited_war: "Tidak sedang terlibat dalam §YPerang Terbatas§!"
  SIA_limited_war_indochina: "[SIA_GetLimitedWarTarget]"
  SIA_limited_war_indochina_desc: "Kendalikan semua negara bagian yang disorot untuk memenangkan §YPerang Terbatas§! dan klaim negara tersebut tanpa meningkat menjadi perang skala penuh.\n§RKalah lebih dari [?var:global.limited_war_surrender_threshold|%.0] kemajuan penyerahan diri akan membuat kita kehilangan perang terbatas§!"
  SIA_limited_war_indochina_target: "§YPerang terbatas§! melawan §Y[?var:limited_war_target.GetName]§!"
  SIA_limited_war_indochina_no_target: "Perang Terbatas Gagal"
  SIA_start_limited_war_malaysia_burma: "Mulai Perang Terbatas melawan [FROM.GetName]"
  SIA_new_territories_administration_cat: "Administrasi Wilayah Baru"
  SIA_new_territories_administration_cat_desc: "Penaklukan hanyalah permulaan. Wilayah-wilayah yang telah kita rebut harus dikelola, dikembangkan, dan dipertahankan agar wilayah-wilayah tersebut menjadi bagian yang bertahan lama dari negara ini dan bukannya menjadi tanggung jawab yang mengundang penaklukan kembali."
  SIA_finish_the_triangular_defense_network: "Selesaikan Jaringan Pertahanan Segitiga"
  SIA_finish_the_triangular_defense_network_desc: "Dengan selesainya dua benteng di Utara dan Selatan, kita dapat menggabungkannya dengan Bangkok untuk menciptakan jaringan pertahanan segitiga. Jika salah satu jatuh, yang lain akan tetap beroperasi."
  has_built_fortress_saigon: "Telah membangun benteng Saigon"
  has_built_fortress_hanoi: "Telah membangun benteng Hanoi"
  SIA_develop_phibunsongkhram: "Kembangkan [1067.GetName]"
  SIA_develop_southern_indochina: "Mengembangkan Indochina Selatan"
  SIA_develop_northern_indochina: "Mengembangkan Indochina Utara"
  SIA_develop_northern_malaya: "Kembangkan Si Rat Malai"
  SIA_develop_eastern_burma: "Kembangkan Sahara Thai Doem"
  SIA_use_abandoned_french_tools: "Gunakan Alat Prancis yang Terbengkalai"
  SIA_use_abandoned_french_tools_desc: "Prancis meninggalkan beberapa alat berat mereka di wilayah pendudukan kami. Kita bisa menggunakannya untuk diri kita sendiri."
  SIA_fortress_saigon: "Benteng Saigon"
  SIA_fortress_saigon_desc: "Bagian utara Kekaisaran baru kita akan dilindungi oleh Hanoi. Dengan pegunungan di Utara dan Sungai Merah di depannya, lokasinya sempurna untuk menahan penjajah."
  SIA_fortress_hanoi: "Benteng Hanoi"
  SIA_fortress_hanoi_desc: "Kekaisaran Selatan akan dilindungi oleh Saigon. Kota benteng ini akan berdiri sebagai penjaga Bangkok, melindungi teluk [ROOT.GetName] dari penjajah."
  SIA_propaganda_poster_slot_available_tt: "Memiliki slot poster film yang kosong."
  SIA_PROPAGANDA_CAMPAIGN_TT_LEFT: "[SIA_GetPropagandaCampaignEffects_Left]"
  SIA_PROPAGANDA_CAMPAIGN_TT_CENTER: "[SIA_GetPropagandaCampaignEffects_Center]"
  SIA_PROPAGANDA_CAMPAIGN_TT_RIGHT: "[SIA_GetPropagandaCampaignEffects_Right]"
  SIA_propaganda_campaign_locked_slot_tt: "Slot poster propaganda ini sedang terkunci. Itu dapat dibuka dengan menyelesaikan fokus berikut: TODO"
  SIA_propaganda_campaign_empty_slot_tt: "Slot poster film ini saat ini §Gkosong§!. £SOV_propaganda_text_icon §YKampanye Bioskop§! baru dapat §Gdiaktifkan§!."
  SIA_poster_left_text: "[SIA_GetDaysRemainingLeft]"
  SIA_poster_center_text: "[SIA_GetDaysRemainingCenter]"
  SIA_poster_right_text: "[SIA_GetDaysRemainingRight]"
  SIA_poster_no_text: ""
  SIA_poster_left_days_remaining_text: "§Y[?SIA_propaganda_left_days_remaining_flag:days_left|Y0]§! hari tersisa"
  SIA_poster_center_days_remaining_text: "§Y[?SIA_propaganda_center_days_remaining_flag:days_left|Y0]§! hari tersisa"
  SIA_poster_right_days_remaining_text: "§Y[?SIA_propaganda_right_days_remaining_flag:days_left|Y0]§! hari tersisa"
  SIA_propaganda_campaign_cooldown_tt: "Kampanye ini akan tersedia kembali §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown] hari§! setelah dihapus."
  SIA_public_credit_repayment: "Pelunasan Kredit Masyarakat"
  SIA_public_credit_repayment_tt: "Kami akan melunasi seluruh Utang Kredit Publik kami sekaligus, menghapus semua utang dengan biaya denda §YBarang Konsumsi§! sementara yang besar."
  idea_SIA_deficit_spending: "Pengeluaran Defisit"
  idea_SIA_deficit_spending_desc: "Pemerintah mengeluarkan belanja melebihi kemampuannya, menyalurkan dana pinjaman ke dalam program percepatan pembangunan. Keuntungan industri memang nyata, namun tagihannya akan segera jatuh tempo."
  SIA_print_additional_money: "Cetak Uang tambahan"
  SIA_print_additional_money_tt: "Kami akan mencetak lebih banyak uang untuk Jepang."
  SIA_appeal_to_industrialists: "Himbauan kepada Industrialis"
  SIA_implement_industrialists_reforms_countdown: "Melaksanakan Reformasi Industrialis"
  SIA_implement_industrialists_reforms_countdown_trigger: "Membangun §Y2 Pabrik Sipil§! (Tidak termasuk pabrik yang diperoleh dari fokus dan perdagangan)"
  SIA_appeal_to_industrialists_tt: "Kami akan mendapat dukungan dari kaum Industrialis.\n\nMereka akan membantu kami dalam perang saudara, memberi kami peralatan tambahan. Namun mereka akan mengharapkan kita untuk memperluas basis industri kita, dengan membangun §Y2§! tambahan §YPabrik Sipil§! dari pabrik-pabrik yang kita miliki pada akhir perang saudara dalam waktu §Y720 hari§! setelah memperoleh kekuasaan (Tidak termasuk pabrik yang diperoleh dari fokus atau perdagangan). :"
  SIA_seek_support_from_constitutional_monarchists: "Mencari dukungan dari kaum Monarki Konstitusional"
  SIA_implement_constitutionalist_reforms_countdown: "Melaksanakan Reformasi Konstitusionalis"
  SIA_seek_support_from_constitutional_monarchists_tt: "Kita akan mendapatkan dukungan dari kaum Monarki Konstitusional.\n\nMereka akan membantu kita dalam perang saudara, sehingga menimbulkan perpecahan tambahan. Namun mereka mengharapkan kita untuk tetap menjadi Monarki konstitusional, dengan menyelesaikan fokus §Y$SIA_a_constitutional_monarchy$§! dalam waktu §Y720 hari§! untuk memperoleh kekuasaan.\n\nTidak melakukan hal tersebut akan mengakibatkan §YStabilitas§! dan §YPerang Dukungan§!"
  SIA_appeal_to_rural_people: "Himbauan kepada Masyarakat Pedesaan"
  SIA_appeal_to_rural_people_tt: "Kami akan mendapatkan dukungan dari Masyarakat Pedesaan.\n\nMereka akan membantu kami dalam perang saudara, memberikan milisi. Namun mereka akan mengharapkan kita untuk mengesahkan kebijakan pertanian yang bermanfaat sebagai imbalannya, dengan menyelesaikan fokus §Y$SIA_mechanization_of_agriculture$§! atau §Y$SIA_reduction_of_agricultural_yield_taxes$§! dalam §Y720 hari§! setelah memperoleh kekuasaan.\n\nTidak melakukan hal tersebut akan berdampak pada §YStabilitas§! dan §YDukungan Perang§!\n\nPada awal Perang Saudara kita akan mendapatkan:"
  SIA_implement_rural_reforms_countdown: "Melaksanakan Reformasi Pedesaan"
  SIA_implement_absolutist_reforms_countdown: "Menerapkan Reformasi Absolutisme"
  SIA_seek_support_from_absolutists_monarchists: "Carilah dukungan dari kaum Monarki Absolut"
  SIA_seek_support_from_absolutists_monarchists_tt: "Kita akan mendapatkan dukungan dari kaum Monarki Absolut.\n\nMereka akan membantu kita dalam perang saudara, sehingga menimbulkan perpecahan tambahan. Namun mereka mengharapkan kita untuk kembali ke Monarki absolut, dengan menyelesaikan fokus §Y$SIA_an_absolute_monarchy$§! dalam waktu §Y720 hari§! untuk memperoleh kekuasaan.\n\nTidak melakukan hal tersebut akan mengakibatkan §YStabilitas§! dan §YPerang Dukungan§!"
  SIA_appeal_to_navy_clique: "Banding ke Klik Angkatan Laut"
  SIA_appeal_to_navy_clique_countdown: "Melaksanakan Reformasi Angkatan Laut"
  SIA_appeal_to_navy_clique_tt: "Kami akan mendapatkan dukungan dari Klik Angkatan Laut.\n\nMereka akan membantu kami dalam perang saudara, memberi kami seluruh angkatan laut dan satu divisi kelautan. Namun mereka mengharapkan kita untuk mengesahkan kebijakan angkatan laut yang bermanfaat, dengan menyelesaikan fokus §Y$SIA_thonburi_class_coastal_defense_ship$§! dalam waktu §Y720 hari§! untuk memperoleh kekuatan.\n\nTidak melakukan hal ini akan menimbulkan dampak pada §YStabilitas§! dan §YPerang Dukungan§!\n\nPada awal Perang Saudara kita akan mendapatkan:\n§YSeluruh Angkatan Laut kami§!\n§YKorps Marinir Kerajaan Thailand§! Divisi Marinir\nThe §YMarinir§! teknologi"
  SIA_appeal_for_support_cat: "Banding untuk Dukungan"
  SIA_appeal_for_support_cat_desc: "Tidak ada gerakan politik yang berhasil sendirian. Kelompok monarki, konstitusionalis, tentara, dan warga sipil masing-masing menguasai sebagian wilayah negara tersebut. Dukungan mereka harus dipupuk dengan hati-hati jika kita ingin mempunyai kekuatan untuk bertindak ketika saatnya tiba."
  SIA_demand_independence: "Menuntut Kemerdekaan untuk §Y[FROM.GetName]§! dari §Y[FROM.OVERLORD.GetNameDef]§!"
  SIA_demand_independence_VIN: "Menuntut pelepasan §Y[VIN.GetName]§!"
  SIA_demand_independence_VIN_tt: "Kami akan meminta pengontrol [VIN.GetName] membebaskan mereka"
  SIA_demand_independence_LAO: "Menuntut pelepasan §Y[LAO.GetName]§!"
  SIA_demand_independence_LAO_tt: "Kami akan meminta pengontrol [LAO.GetName] membebaskan mereka"
  SIA_demand_independence_CAM: "Menuntut pelepasan §Y[CAM.GetName]§!"
  SIA_demand_independence_CAM_tt: "Kami akan meminta pengontrol [CAM.GetName] membebaskan mereka"
  SIA_invite_to_adc: "Undang §Y[FROM.GetName]§! ke faksi kami"
  SIA_asian_democratic_compact_cat: "Perjanjian Demokratik Asia"
  SIA_asian_democratic_compact_cat_desc: "Bangsa Asia mempunyai hak untuk mengatur dirinya sendiri. Sebagai pendukung standar penentuan nasib sendiri di Asia, kita dapat menekan kekuatan kolonial untuk melepaskan negara yang mereka kuasai."
  SIA_khana_ratsadon_cat: "Khana Ratsadon"
  SIA_khana_ratsadon_cat_desc: "Khana Ratsadon, Partai Rakyat yang mengakhiri monarki absolut, bukanlah sebuah monolit. Sayap militer dan sipil masing-masing memiliki visi mereka sendiri untuk negara ini, dan ketegangan di antara mereka muncul di balik setiap keputusan yang diambil. Jaga agar kedua faksi tetap puas, atau berisiko koalisi terpecah belah."
  SIA_army_navy_reform_cat: "Angkatan Darat dan Angkatan Laut"
  SIA_army_navy_reform_cat_desc: "Angkatan Darat dan Angkatan Laut bersaing untuk mendapatkan sumber daya yang sama dan terbatas. Pergeseran dana antara kedua cabang merupakan tindakan penyeimbang yang terus-menerus, dan setiap realokasi membawa konsekuensi terhadap kesiapan cabang lainnya."
  SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
  SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
  SIA_divert_army_funds_to_navy_toggle_do: "Mengalihkan dana Angkatan Darat ke Angkatan Laut"
  SIA_divert_army_funds_to_navy_toggle_do_tt: "Kami akan mengalihkan sebagian dana Angkatan Darat ke Angkatan Laut untuk mempercepat pembangunannya."
  SIA_divert_army_funds_to_navy_toggle_undo: "Berhenti mengalihkan dana Angkatan Darat ke Angkatan Laut"
  SIA_divert_army_funds_to_navy_toggle_undo_tt: "Kami tidak akan lagi mengalihkan sebagian dana Angkatan Darat ke Angkatan Laut."
  SIA_standing_our_ground_mission: "Berdiri di Tempat kami"
  SIA_standing_our_ground_mission_tt: "Kita harus berjuang untuk kebebasan kita."
  SIA_sway_generals_to_seri_thai_tt: "Para jenderal yang kami percayai pada Seri Thai akan bergabung dengan kami ketika perang saudara dimulai, alih-alih bergabung dengan pemberontakan loyalis."
  SIA_sway_general_cw_scale_tt: "Meningkatkan dukungan kami dalam perang saudara sebesar §Y5%§!\nJika dukungan berakhir §Y80%§! perang saudara dapat dihindari dan kami merebut kekuasaan tanpa adanya perlawanan"
  SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Goyangkan Luang Chawengsaksongkhram"
  SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Menangkan Luang Chawengsaksongkhram untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_aditya_dibabha_to_seri_thai: "Goyangkan Aditya Dibabha"
  SIA_sway_aditya_dibabha_to_seri_thai_desc: "Menangkan Aditya Dibabha untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_mangkorn_phromyothi_to_seri_thai: "Goyangkan Mangkorn Phromyothi"
  SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Menangkan Mangkorn Phromyothi untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_luang_haansongkhram_to_seri_thai: "Goyangkan Luang Haansongkhram"
  SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Menangkan Luang Haansongkhram untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Goyang Charun Rattanakun Seriroengrit"
  SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Menangkan Charun Rattanakun Seriroengrit untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Goyangkan Phichit Kriangsakphichit"
  SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Menangkan Phichit Kriangsakphichit untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_jira_wichitsongkhram_to_seri_thai: "Goyangkan Jira Wichitsongkhram"
  SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Menangkan Jira Wichitsongkhram untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_phin_choonhavan_to_seri_thai: "Goyangkan Phin Choonhavan"
  SIA_sway_phin_choonhavan_to_seri_thai_desc: "Menangkan Phin Choonhavan untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_sway_tiang_sirikhan_to_seri_thai: "Goyangkan Tiang Sirikhan"
  SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Menangkan Tiang Sirikhan untuk perjuangan Seri Thai. Jika terpengaruh, dia akan memihak kita ketika perang saudara dimulai."
  SIA_khana_ratsadon_dummy_military: "Risiko Kudeta Militer"
  SIA_khana_ratsadon_dummy_military_tt: "Militer akan melancarkan kudeta jika kita terlalu memusuhi mereka. Untuk menghindari perang saudara, kita tidak boleh melakukan §Y$idea_SIA_military_rebellious$§! terlalu lama."
  SIA_khana_ratsadon_dummy_military_desc: "Militer adalah kelompok kuat dari partai Khana Ratsadon. Mereka tidak akan menyetujui kebijakan yang mereka anggap bertentangan dengan kepentingan mereka, namun menyetujui hal-hal yang mereka anggap pro-militerisasi negara."
  SIA_khana_ratsadon_military_coup_mission: "Militer berencana menggulingkan pemerintah!"
  SIA_khana_ratsadon_military_coup_mission_desc: "Militer melihat kebijakan pemerintah saat ini sebagai ancaman terhadap kepentingan mereka. Mereka secara aktif berencana untuk menggulingkan pemerintah jika kedudukan mereka tidak meningkat."
  SIA_khana_ratsadon_dummy_civilian: "Risiko Kudeta Sayap Sipil"
  SIA_khana_ratsadon_dummy_civilian_tt: "Sayap sipil akan melancarkan kudeta jika kita terlalu memusuhi mereka. Untuk menghindari perang saudara, kita tidak boleh melakukan §Y$idea_SIA_civilian_rebellious$§! terlalu lama."
  SIA_khana_ratsadon_dummy_civilian_desc: "Sayap sipil adalah kelompok kuat dari partai Khana Ratsadon. Mereka tidak akan menyetujui kebijakan-kebijakan yang mereka anggap bertentangan dengan kepentingan mereka, namun menyetujui hal-hal yang mereka anggap pro-demokrasi, pro-sipil."
  SIA_khana_ratsadon_civilian_coup_mission: "Sayap sipil berencana menggulingkan pemerintah!"
  SIA_khana_ratsadon_civilian_coup_mission_desc: "Sayap sipil melihat kebijakan pemerintah saat ini sebagai ancaman terhadap kepentingan mereka. Mereka secara aktif berencana untuk menggulingkan pemerintah jika kedudukan mereka tidak meningkat."
  SIA_promote_civilian_wing: "Pengadilan Sayap Sipil"
  SIA_promote_civilian_wing_desc: "Dengan memberikan dukungan pada pemerintah pada agenda reformasi pertanahan, pengadilan, dan konstitusi sayap sipil, kita dapat memperoleh rasa terima kasih dari faksi Pridi. Namun sikap pilih kasih seperti ini tidak luput dari perhatian: korps perwira akan merajuk dan gangguan terhadap administrasi biasa akan sangat merugikan kita sementara keadaan sudah tenang."
  SIA_promote_military_wing: "Pengadilan Sayap Militer"
  SIA_promote_military_wing_desc: "Dengan menuruti tuntutan para perwira dan memamerkan kekuatan angkatan bersenjata, kita bisa memenangkan hati faksi Phibun. Namun sikap favoritisme semacam ini tidak luput dari perhatian: penataan kembali ini membuat rutinitas militer menjadi kacau dan gangguan terhadap pemerintahan biasa akan sangat merugikan kita sementara keadaan sudah tenang. Sebuah instrumen tumpul, hanya cocok untuk menarik sayap kembali dari ambang pemberontakan."
  SIA_cultivate_civilian_wing: "Kembangkan Sayap Sipil"
  SIA_cultivate_civilian_wing_desc: "Kedudukan Petunjuk Biro Istana Kerajaan telah memenangkan kita dengan pendirian yang membuka pintu bagi pendekatan sayap sipil yang sabar dan berkelanjutan. Tidak ada sikap pilih kasih yang tiba-tiba dapat memicu reaksi balik, yang ada hanyalah upaya perlahan dan mantap untuk memenangkan hati faksi Pridi, satu demi satu konsesi. Ini adalah jalan yang panjang, tapi kita bisa berjalan sejauh yang kita mau."
  SIA_cultivate_military_wing: "Kembangkan Sayap Militer"
  SIA_cultivate_military_wing_desc: "Kedudukan Petunjuk Biro Istana Kerajaan telah memenangkan kita dengan pendiriannya yang membuka pintu bagi pendekatan sayap militer yang sabar dan berkelanjutan. Tidak ada sikap pilih kasih yang tiba-tiba untuk memicu reaksi balik, yang ada hanyalah kerja lambat dan mantap untuk memenangkan hati korps perwira, satu konsesi pada satu waktu. Ini adalah jalan yang panjang, tapi kita bisa berjalan sejauh yang kita mau."
  SIA_end_factionalism_mission: "Memegang Koalisi Bersama"
  SIA_end_factionalism_mission_desc: "Kedua sayap Khana Ratsadon berdiri sepenuhnya di belakang pemerintah. Jika kita dapat mempertahankan keduanya pada §GDukungan Penuh§! selama §Y270§! hari, persaingan di antara keduanya dapat dihentikan untuk selama-lamanya. Jika antusiasme kedua sayap goyah, upaya ini harus dimulai dari awal."
