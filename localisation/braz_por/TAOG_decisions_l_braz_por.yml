  AST_australia_formables_category_desc: "Meskipun akar kita akan selalu mengikat kita ke belahan bumi selatan, lengan kita telah tumbuh panjang dan luas jangkauannya, sehingga tidak mungkin lagi bagi orang lain untuk menyembunyikan pandangan kita mengenai masalah-masalah dunia. Kita telah berkembang, dan mungkin akan terus berkembang lebih jauh lagi, dan nama baru untuk negara kita akan memperjelas hal ini. Dari kepompong kita muncul, melebarkan sayap kita agar dunia dapat mengagumi dan mengenalinya, menamai warna dan pola kita sebagai negara baru di selatan—Australasia."
