l_braz_por:
  SIA_free_thai_air_network_cat: "Jaringan Udara Thailand Gratis"
  SIA_recover_downed_airmen: "Pulihkan Penerbang yang Jatuh"
  SIA_recover_downed_airmen_desc: "Gerakan bawah tanah kami akan melindungi dan menghalau para penerbang Sekutu yang jatuh di tanah Thailand."
  SIA_establish_mountain_weather_posts: "Membangun Pos Cuaca Gunung"
  SIA_establish_mountain_weather_posts_desc: "Pos-pos tersembunyi di dataran tinggi akan menyiarkan laporan cuaca yang sangat dibutuhkan oleh angkatan udara Sekutu."
  SIA_smuggle_radio_sets: "Menyelundupkan Perangkat Radio ke Interior"
  SIA_smuggle_radio_sets_desc: "Jaringan radio yang tenang akan menjaga hubungan antara kelompok perlawanan dan teman-teman asingnya."
  HOL_recall_conrad_helfrich: "Tarik Kembali Conrad Helfrich dari Hindia"
  HOL_recall_conrad_helfrich_desc: "Di masa genting ini, kita harus memprioritaskan tanah air di atas segalanya. Conrad Helfrich, sebagai Laksamana terbaik Angkatan Laut Kerajaan Belanda, harus kembali ke Belanda."
  INS_is_taking_volksraad: "Sedang mengesahkan undang-undang di Volksraad"
  INS_volksraad_cat: "Volksraad"
  INS_volksraad_cat_desc: "Dewan Rakyat, yang dalam bahasa Belanda dikenal sebagai Volksraad, didirikan pada tahun 1918 sebagai upaya membawa demokrasi ke Hindia Belanda, sebagai bagian dari penerapan apa yang disebut \"Politik Etis\". Kursi-kursi diisi oleh pejabat Belanda dan Indonesia yang dipilih melalui berbagai cara. Meskipun Belanda mempertahankan hak veto tanpa syarat, Volksraad dapat mengajukan mosi dan rancangan undang-undang kepada pemerintah."
  INS_volksraad_allow_language_in_schools: "Izinkan Bahasa Indonesia di Sekolah"
  INS_volksraad_allow_language_in_schools_desc: "Akses ke pendidikan tinggi di Hindia sebagian besar terbatas pada orang Belanda dan kaum berada Indonesia yang fasih berbahasa Belanda, karena hanya bahasa itulah yang digunakan dalam pengajaran pendidikan tinggi. Mosi yang sedang berlangsung di Volksraad untuk membuka sekolah berbahasa Indonesia sedang menunggu persetujuan Gubernur Jenderal."
  INS_volksraad_allow_language_in_government: "Izinkan Bahasa Indonesia di Pemerintahan"
  INS_volksraad_allow_language_in_government_desc: "Jabatan pemerintahan di Hindia, termasuk Volksraad, semuanya mewajibkan kefasihan berbahasa Belanda, yang membuat banyak anggota Volksraad, terutama perwakilan masyarakat pribumi, mempertanyakan keabsahan demokrasinya. Mereka telah menyusun mosi yang menegaskan bahwa jabatan pemerintahan harus dapat diisi oleh penutur bahasa Indonesia jika memungkinkan."
  INS_volksraad_remove_education_quotas: "Hapuskan Sistem Kuota Pendidikan"
  INS_volksraad_remove_education_quotas_desc: "Sistem pendidikan di Hindia Belanda saat ini beroperasi menggunakan kuota pendidikan, di mana sejumlah siswa Indonesia harus diterima, dan sejumlah siswa Belanda harus diterima. Hal ini kontroversial di Volksraad karena keyakinan umum bahwa sistem ini condong tidak adil demi keuntungan pihak Belanda. Meskipun kita bisa membiarkan Volksraad terus berdebat selama bertahun-tahun tentang cara mereformasi sistem ini, mungkin lebih baik menghapuskan sistem kuota sama sekali."
  INS_volksraad_reduce_rubber_export_tax: "Kurangi Pajak Ekspor Karet Swasta"
  INS_volksraad_reduce_rubber_export_tax_desc: "Saat ini terdapat pajak yang sangat tinggi bagi perusahaan swasta pengekspor karet, memungkinkan kita mempertahankan monopoli atas pasar. Namun, hal ini menyebabkan stagnasi ekonomi di beberapa wilayah karena perkebunan swasta tidak mampu beroperasi. Hal ini dianggap sepadan pada saat diterapkan, tetapi proteksionisme internasional akibat Depresi Besar membuat ekonomi ekspor karet kita jauh kurang menguntungkan. Mengurangi pajak ini mungkin layak dilakukan guna merangsang perekonomian."
  INS_volksraad_knil_rank_limit: "Sahkan Undang-Undang Antidiskriminasi Pangkat Militer"
  INS_volksraad_knil_rank_limit_desc: "Meskipun tidak ada aturan formal yang melarang kaum pribumi Indonesia naik pangkat di KNIL, ada aturan tidak tertulis yang melarangnya, membatasi bahkan personel militer paling berprestasi sehingga tidak bisa melampaui pangkat Kolonel. Sejumlah fraksi di Volksraad terus mendesak pemerintah agar mengakui dedikasi perwira-perwira Indonesia yang berprestasi."
  INS_volksraad_legalize_displaying_flag: "Legalkan Pengibaran Bendera Merah Putih"
  INS_volksraad_legalize_displaying_flag_desc: "Bendera merah putih \"Indonesia\" saat ini dilarang dikibarkan di muka umum karena keterkaitannya dengan organisasi-organisasi nasionalis antikolonial. Melegalkan pengibarannya kemungkinan akan menjadi bukti kesediaan kita untuk bekerja sama, serta menghentikan radikalisasi kaum nasionalis yang kian memuncak di seantero nusantara."
  INS_volksraad_education_subsidies_for_indonesians: "Buka Subsidi Pendidikan untuk Penduduk Non-Belanda"
  INS_volksraad_education_subsidies_for_indonesians_desc: "Perdebatan terus berlangsung di dalam Volksraad mengenai subsidi dan beasiswa yang diberikan kepada siswa Belanda di Hindia Belanda. Beberapa perwakilan komunitas pribumi di Volksraad berargumen bahwa sistem ini harus diperluas ke semua siswa, tanpa memandang latar belakang. Langkah ini akan memberi kita banyak simpati dari masyarakat, meski biayanya tidak murah."
  INS_volksraad_indonesian_national_language: "Jadikan Bahasa Indonesia Bahasa Nasional Resmi"
  INS_volksraad_indonesian_national_language_desc: "Bahasa Indonesia telah berkembang menjadi bahasa pergaulan umum di banyak bagian nusantara, menjembatani perbedaan bahasa antarsuku bangsa. Dengan bahasa Indonesia kini diizinkan dalam dunia pendidikan dan pemerintahan, banyak perwakilan Volksraad mengajukan petisi untuk pengakuan hukumnya sebagai bahasa resmi koloni, dengan status setara bersama bahasa Belanda."
  INS_volksraad_official_flag: "Resmikan Bendera Indonesia"
  indonesia_volksraad_official_flag_effect_tt: "Bendera kita akan diubah menjadi bendera Merah Putih."
  INS_volksraad_official_flag_desc: "Mosi-mosi di Volksraad yang memperjuangkan otonomi pada akhirnya berhasil, dan apa yang beberapa tahun lalu disebut Hindia Belanda kini telah menjadi Dominion Indonesia. Bendera kita harus disesuaikan untuk mencerminkan perubahan ini."
  indonesia_volksraad_passed_6: "Telah mengesahkan undang-undang antidiskriminasi di militer"
  recognize_maphilindo: "$form_maphilindo$"
  form_majapahit_empire_flag: "Telah membentuk Nusantara"
  phillipines_integrated: "Telah mengintegrasikan Filipina"
