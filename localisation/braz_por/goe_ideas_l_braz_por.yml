 idea_RAJ_the_long_goodbye_desc: "Inggris telah setuju untuk meninggalkan...pada akhirnya. Sampai saat itu tiba, mereka harus mengurai birokrasi mereka, mengemas barang-barang mereka, dan akhirnya keluar dari pemerintahan yang sudah lama tertunda."
