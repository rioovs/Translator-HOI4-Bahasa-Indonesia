 SSB_saadabad_pact: "Pakta Saadabad"
 SSB_saadabad_pact_desc: "Sebuah perjanjian non-agresi dengan negara-negara Timur Tengah lainnya, hal ini mungkin dapat mengarah pada kolaborasi yang lebih jauh dan lebih kuat.\n\n§RMemulai perang ofensif terhadap anggota Pakta Saadabad mana pun akan menyebabkan Anda kehilangan semangat ini secara permanen§!."
 SSB_saadabad_trade_agreement: "Perjanjian Perdagangan Saadabad"
 SSB_saadabad_trade_agreement_desc: "Perjanjian perdagangan timbal balik antara para penandatangan Pakta Saadabad yang memfasilitasi kolaborasi lebih lanjut dan ekonomi yang lebih terintegrasi, menghapus semua tarif dan menyatukan sumber daya."
