 AFG_mohammad_zahir_shah_ns: "Raja Zahir Syah"
 AFG_mohammad_zahir_shah_ns_desc: "Raja Zahir Shah naik takhta setelah kematian ayahnya pada tahun 1933. Namun, karena usianya yang masih muda dan kurangnya basis politik, paman Raja memegang kekuasaan sebenarnya dalam pemerintahan, menjadikannya hanya sekedar boneka. Zahir Shah harus memutuskan apakah akan menunggu waktunya dan atau segera memecat pamannya dari jabatannya jika dia ingin menjalankan agendanya sendiri."
