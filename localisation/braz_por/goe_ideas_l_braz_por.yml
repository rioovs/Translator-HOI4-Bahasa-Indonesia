 #### STARTING SPIRITS ####
 ##########################
 PER_anglo_iranian_oil_ns: "Perusahaan Minyak Anglo-Iran"
 PER_anglo_iranian_oil_ns_desc: "Secara resmi dikenal sebagai Perusahaan Minyak Anglo-Persia, AIOC didirikan oleh [ENG.GetNameDef] pada tahun 1909 setelah ditemukannya ladang minyak berukuran signifikan di Masjed Soleiman. Banyak orang di [PER.GetNameDefCap] merasa perusahaan ini mengambil keuntungan dari sumber daya dan tenaga kerja negara kita, dan belum memenuhi banyak janji yang telah mereka sepakati."
 PER_rural_feudalism_ns: "Feodalisme Pedesaan"
 PER_rural_feudalism_ns_desc: "Feodalisme adalah sistem penataan masyarakat yang sudah ketinggalan zaman berdasarkan kepemilikan tanah sebagai imbalan atas jasa dan tenaga kerja. Meskipun merupakan konsep abad pertengahan, konsep ini masih diterapkan di banyak wilayah pedesaan [PER.GetNameDef]."
 PER_lingering_islamic_beliefs: "Keyakinan Islam yang Masih Ada"
 PER_islamic_traditions_ns: "Tradisi Islam"
 PER_islamic_traditions_ns_desc: "Secara tradisional, Iran telah menganut Islam selama beberapa generasi. Ini dianggap sebagai agama negara dan dianut mayoritas penduduk. Ada orang-orang di pemerintahan yang berupaya melakukan sekularisasi agama dan negara, namun hal ini akan menjadi tugas yang sangat besar dan akan menimbulkan banyak hambatan."
 PER_secularized_state_idea: "Negara Sekularisasi"
 PER_secularized_state_idea_desc: "Di bawah Dinasti Pahlavi, telah ditetapkan bahwa untuk bisa berdiri sejajar dengan negara-negara besar lainnya di dunia, maka [PER.GetNameDef] perlu melakukan modernisasi. Termasuk memisahkan agama dan negara. Masyarakat masih bisa mengamalkan Islam, namun Islam tidak lagi berpengaruh dalam politik negara kita."
 PER_secularized_state_democratic_idea: "Negara Sekularisasi"
 PER_unification_initiative_idea: "Inisiatif Unifikasi"
 PER_unification_initiative_idea_desc: "Bukan rahasia lagi bahwa bangsa kita terfragmentasi sebagian. Pemerintahan kami terancam oleh potensi pemberontakan dari suku Kurdi dan Azerbaijan, serta dari dalam pemerintahan kami sendiri. Inisiatif Unifikasi akan menghilangkan ancaman-ancaman ini dan mengamankan hegemoni kita atas [PER.GetNameDef]."
 PER_azerbaijan_resistance_idea: "Perlawanan Azerbaijan"
 PER_azerbaijan_resistance_idea_desc: "[PER.GetNameDefCap] meliputi wilayah yang dulunya milik rakyat Azerbaijan. Oleh karena itu, terdapat banyak diaspora orang yang tidak senang dengan pemerintahan kita. Pada tahun-tahun sebelumnya, pemerintah kita mampu menumpas sejumlah pemberontakan di wilayah [PER.GetNameDef] ini, namun sentimen pemberontakan tetap ada."
 PER_kurdistan_resistance_idea: "Perlawanan Kurdi"
 PER_kurdistan_resistance_idea_desc: "[PER.GetNameDefCap] mencakup beberapa wilayah yang dulunya milik masyarakat Kurdi. Oleh karena itu, terdapat banyak diaspora orang yang tidak senang dengan pemerintahan kita. Pada tahun-tahun sebelumnya, pemerintah kita mampu menumpas sejumlah pemberontakan di wilayah [PER.GetNameDef] ini, namun sentimen pemberontakan tetap ada."
 ############################
 #### INDUSTRIAL SPIRITS ####
 ############################
 PER_modernizing_iran_idea: "Inisiatif Modernisasi"
 PER_modernizing_iran_idea_desc: "Modernisasi [PER.GetNameDef] sangat penting jika kita ingin berdiri berdampingan dengan negara-negara besar di dunia. Dengan menjalankan inisiatif ini, ini merupakan tanda bahwa kami mendedikasikan diri kami untuk meningkatkan infrastruktur negara besar kami, dan berjanji untuk meningkatkan taraf hidup warganya."
 PER_a_modern_iran_idea: "Iran Modern"
 PER_a_modern_iran_idea_desc: "Setelah melakukan investasi dan upaya yang signifikan, kami akhirnya mencapai tujuan [PER.GetName] modern"
 PER_adult_literacy_idea: "Kampanye Literasi Orang Dewasa"
 PER_adult_literacy_idea_desc: "Melek huruf dalam bahasa mereka sendiri adalah salah satu cara paling penting agar masyarakat dapat merasa terbebaskan dan berdaya. Setelah mendanai kampanye nasional untuk mengajak orang dewasa kembali mengikuti program pendidikan, kita akan melihat peningkatan dalam pengembangan [PER.GetNameDef] untuk jangka waktu tertentu."
 PER_trans_iranian_railway_idea: "Membangun Kereta Api Trans-Iran"
 PER_trans_iranian_railway_idea_desc: "Kereta Api Trans-Iran akan menjadi salah satu pencapaian terbesar kami di bidang teknik di negara kami. Dengan memfokuskan upaya kita pada pembangunan jalur kereta api intra-nasional ini, kita akan dapat meningkatkan upaya mobilisasi kita pada saat perang."
 PER_feat_of_engineering_idea: "Prestasi Teknik"
 PER_feat_of_engineering_idea_desc: "Akhirnya, kami telah menyelesaikan Jalur Kereta Trans-Iran. Kami telah berhasil melewati jalur penting ini melalui medan yang berat untuk memastikan kota-kota kami tetap terhubung dengan baik. Kita patut bangga dengan contoh bagus dari rekayasa [PER.GetAdjective] ini."
 PER_white_revolution_idea: "Memulai Revolusi Putih"
 PER_white_revolution_idea_desc: "Reformasi yang agresif diperlukan untuk mempercepat modernisasi negara kita. Revolusi Putih, atau revolusi Shah dan Rakyat, akan membawa [PER.GetNameDef] sejajar dengan negara-negara besar di barat."
 PER_price_stabilization_idea: "Stabilisasi Harga"
 PER_price_stabilization_idea_desc: "Sudah terlalu lama para pemilik pabrik dan jaringan bisnis besar mengambil keuntungan secara tidak wajar dari para pekerja dan pelanggannya. Kita harus berusaha untuk menstabilkan harga di seluruh [PER.GetNameDef] untuk memperbaiki harga barang secara nasional."
 PER_food_for_all_idea: "Makanan untuk Setiap [PER.GetAdjective]"
 PER_food_for_all_idea_desc: "Kelaparan sudah terlalu lama menjadi masalah di negara kita. Setelah meluncurkan program baru yang memastikan semua warga negara mempunyai akses terhadap makanan pokok, kita dapat terhindar dari terjerumus ke dalam jurang penderitaan lagi."
 PER_tehran_power_grid_idea: "Jaringan Listrik Teheran yang Diperluas"
 PER_tehran_power_grid_idea_desc: "Dengan didirikannya serangkaian Pembangkit Listrik baru di Teheran, kami terus memodernisasi negara kami melalui peningkatan jangkauan listrik."
 PER_metropolitan_iran_idea: "[PER.GetAdjective] Metropol"
 PER_metropolitan_iran_idea_desc: "Kami telah berhasil memperluas wilayah metropolitan [PER.GetAdjective] menjadi lebih dari sekedar batas wilayah Teheran. Kota-kota kita tumbuh dan berkembang karena upaya modernisasi kita yang besar. Ini benar-benar hari yang mulia!"
 PER_oil_baron_idea: "[PER.GetAdjective] Baron Minyak"
 PER_oil_baron_idea_desc: "Negara kita benar-benar kaya akan minyak, terutama setelah upaya yang kita lakukan untuk menghilangkan pengaruh [ENG.GetAdjective] terhadap sumber daya kita. Lalu apa yang kita lakukan dengan semua minyak ini? Simpanlah untuk diri kita sendiri."
 ##########################
 #### MILITARY SPIRITS ####
 ##########################
 PER_future_of_war_idea: "Masa Depan Perang"
 PER_future_of_war_idea_desc: "Tidak dapat disangkal fakta bahwa tank adalah simbol peperangan masa depan. Dengan menggunakan sumber daya untuk mengembangkan teknologi persenjataan, kita telah berhasil mempersiapkan diri untuk berpartisipasi dalam perang modern."
 PER_military_excellency_idea: "[PER.GetAdjective] Yang Mulia Militer"
 PER_military_excellency_idea_desc: "Kami pada akhirnya memutuskan untuk fokus pada pelatihan yang kaku dan profesional dalam hal pasukan tetap kami. Pada akhirnya, pasukan yang berdisiplin baik akan memenangkan pertempuran. Kualitas melebihi kuantitas!"
 PER_foreign_retraining_idea: "Inisiatif Pelatihan Ulang Asing"
 PER_foreign_retraining_idea_desc: "Dengan menjangkau perwira asing untuk datang dan melatih pasukan kami, kami telah mengambil langkah pertama yang diperlukan untuk meningkatkan angkatan bersenjata kami yang saat ini kurang terlatih dan tidak terorganisir."
 PER_motorization_investments_idea: "Investasi Motorisasi"
 PER_motorization_investments_idea_desc: "Investasi yang kami lakukan untuk mengembangkan industri senjata bermotor akan membuahkan hasil ketika pasukan kami terbang melintasi medan perang dengan cepat dan tepat."
 PER_desert_training_idea: "Pelatihan Gurun Khusus"
 PER_desert_training_idea_desc: "Setelah melakukan banyak latihan panjang dan berjalan melintasi dataran berpasir, kami akhirnya menciptakan program pelatihan efektif yang dirancang untuk memberikan pasukan kami peluang lebih baik untuk bertahan hidup di medan perang gurun."
 PER_conscription_idea: "Setiap Orang Melayani"
 PER_conscription_idea_desc: "Masa-masa sulit menuntut tindakan yang mendesak. Meskipun kita tidak dapat mendedikasikan waktu dan sumber daya untuk menciptakan tentara yang sepenuhnya profesional, kita dapat memastikan bahwa setiap orang yang berbadan sehat mampu mengangkat senjata dan berperang untuk negaranya."
 PER_special_units_division_idea: "Divisi Unit Khusus"
 PER_special_units_division_idea_desc: "Pasukan militer kita kini telah dilengkapi dengan divisi unit khusus. Sekarang kita dapat memperluas kekuatan kita sedemikian rupa sehingga memungkinkan kita untuk membawa unit-unit baru ke lapangan serta membuka jalan bagi terciptanya program spionase."
 PER_savak_idea_no_lar: "SAVAK Didirikan"
 PER_savak_idea_no_lar_desc: "SAVAK adalah badan khusus dan polisi rahasia yang melayani [PER.GetNameDef]. Ditandai dengan logo Singa Persia, petugas kami bekerja tanpa kenal lelah untuk menjamin keamanan nasional negara besar kami."
 PER_savak_lar: "$PER_savak_idea_no_lar$"
 PER_savak_lar_desc: "$PER_savak_idea_no_lar_desc$"
 PER_fund_state_intelligence_idea: "Dana Intelijen Negara"
 PER_fund_state_intellignece_idea_desc: "Untuk meningkatkan kemampuan kami dalam memantau keamanan negara, kami telah menyalurkan sumber daya kami untuk membangun kontrol yang lebih besar terhadap program intelijen negara kami."
 PER_transfer_officer_idea_lar: "Petugas Dipindahkan ke Intelijen"
 PER_transfer_officer_idea_lar_desc: "Seiring dengan berkembangnya badan intelijen kami, kami menyadari adanya kebutuhan untuk memindahkan beberapa perwira baru ke dalam jajarannya. Melakukan hal ini telah meningkatkan produktivitas di departemen dan akan menjamin keamanan negara kita."
 PER_transfer_officer_idea_no_lar: "$PER_transfer_officer_idea_lar$"
 PER_transfer_officer_idea_no_lar_desc: "$PER_transfer_officer_idea_lar_desc$"
 PER_airforce_modifier: "Angkatan Udara Iran"
 PER_airforce_modifier_desc: "Angkatan Udara Iran tidak pernah menjadi prioritas utama kami, namun kami yakin inilah saatnya bagi kami untuk meluangkan waktu dan sumber daya untuk menyempurnakan divisi kami dan melatih pilot kami. Kami akan menunjukkan kepada dunia seberapa besar kendali yang bisa kami perjuangkan di angkasa."
 PER_coastal_fortifications_idea: "Inisiatif Benteng Pesisir"
 PER_coastal_fortifications_idea_desc: "Angkatan laut kita tidak selalu menjadi aset terkuat kita, jadi untuk melindungi [PER.GetNameDef] dari invasi angkatan laut, kita harus menerapkan inisiatif benteng pantai untuk memastikan bahwa garis pantai kita tetap aman selama konflik terjadi."
 PER_state_local_defensive_dynamic_modifier: "Prosedur Pertahanan Lokal"
 ###################################
 #### IMPERIAL NATIONAL SPIRITS ####
 ###################################
 PER_legacy_of_greatness_modifier: "Warisan Kebesaran"
 PER_legacy_of_greatness_modifier_desc: "Dinasti Pahlavi telah mengokohkan dirinya sebagai keluarga kerajaan yang ditakdirkan untuk memimpin [PER.GetNameDef] menuju kebesaran dan seterusnya. Meskipun reformasi yang mereka lakukan tidak disukai oleh sebagian orang, tidak ada keraguan bahwa perubahan radikal yang mereka bawa ke negara ini akan mempengaruhi pandangan dunia terhadap kita mulai saat ini."
 PER_state_atheism_idea: "Sekularisasi Penuh"
 PER_state_atheism_idea_desc: "Tujuan utama kami adalah meniru negara-negara barat dan membawa [PER.GetNameDef] ke era modern. Kita tidak bisa lagi membiarkan diri kita terkekang oleh doktrin agama. Meskipun hal ini mungkin mengecewakan para ulama di negara kita, demi kebaikan [PER.GetNameDef] kita mendorong ateisme di kalangan warga negara kita."
 PER_venerated_islam_idea: "Islam Dimuliakan"
 PER_venerated_islam_idea_desc: "Meski awalnya kita berpandangan memisahkan negara dan agama, kita tidak bisa lagi mengabaikan kemauan masyarakat. Islam telah menjadi bagian penting dari budaya [PER.GetAdjective] selama bertahun-tahun, dan sangatlah bodoh jika kita melepaskan diri dari tradisi-tradisi ini."
 PER_old_ways_idea: "Menghidupkan kembali Zoroastrianisme"
 PER_old_ways_idea_desc: "Zoroastrianisme adalah salah satu agama monoteistik tertua di dunia dan didirikan di Persia kuno pada abad ke-6 SM. Mengingat betapa pentingnya agama ini bagi budaya Kerajaan Persia kuno, kami menghidupkannya kembali dengan harapan bahwa agama ini akan menjunjung tinggi citra kemegahan masa lalu yang telah kami perjuangkan untuk dicapai."
 PER_imperial_expansionism_idea: "Ekspansionisme Kekaisaran"
 PER_imperial_expansionism_idea_desc: "Waktunya telah tiba bagi kita untuk menunjukkan kepada dunia betapa mampunya [PER.GetNameDef]. Kami telah menghidupkan pabrik-pabrik, kami telah menggalang masyarakat. Segera, kita berbaris menuju perang demi kemuliaan dan keagungan!"
 PER_war_plan_darius_idea: "Rencana Perang Darius"
 PER_war_plan_darius_idea_desc: "Darius Agung adalah Raja ketiga dari Kerajaan Achaemenid. Meskipun ia memerintah kekaisaran pada puncak teritorialnya, ia adalah orang yang mendorong pengaruh Persia hingga ke Lembah Indus di Pakistan modern. Mari kita salurkan cita-cita ekspansionisnya dan dorong musuh kita di timur!"
 PER_paying_for_baluchistan_idea: "Membayar untuk Baluchistan"
 PER_paying_for_baluchistan_idea_desc: "Sayangnya, [RAJ.GetNameDef] tidak mau membiarkan wilayah ini diambil tanpa bayaran. Kami harus melunasi hutang kami selama satu tahun."
 PER_sold_baluchistan_idea: "Dijual Baluchistan"
 PER_sold_baluchistan_idea_desc: "Ketika [PER.GetNameDef] datang menuntut wilayah Baluchistan, kami dapat memeras sejumlah uang dari mereka untuk masalah ini. Kami akan menerima pembayaran selama sekitar satu tahun."
 PER_war_plan_xerxes_idea: "Rencana Perang Xerxes"
 PER_war_plan_xerxes_idea_desc: "Xerxes Agung adalah Raja keempat dari Kerajaan Achaemenid. Dia paling terkenal karena invasinya ke Yunani pada tahun 480 SM, dan meskipun invasi tersebut berakhir dengan kekalahan Persia, kali ini kitalah yang akan menjadi pemenangnya. Mari kita bergerak ke Laut Aegea dan merebut kembali semenanjung Turki."
 PER_war_plan_cambyses_idea: "Rencana Perang Cambyses"
 PER_war_plan_cambyses_idea_desc: "Cambyses II adalah Raja kedua dari Kerajaan Achaemenid. Ia memerintah dari tahun 530 SM dan pemerintahannya ditandai dengan penaklukannya di Afrika Utara, khususnya Mesir, di mana ia menjadi Firaun. Mengikuti jejaknya, kita harus menuju ke barat dan mencoba merebut kembali bekas wilayahnya."
 PER_persepolis_idea: "Persepolis Dibangun Kembali"
 PER_persepolis_idea_desc: "Sebagai bukti kekuatan kami sebagai kekuatan kekaisaran baru, kami telah berhasil membangun kembali ibu kota seremonial Kekaisaran Achaemenid. Persepolis akan berdiri selamanya sebagai simbol keagungan [PER.GetAdjective]."
 PER_celebration_idea: "Booming Pasca Perayaan"
 PER_celebration_idea_desc: "Perayaan Kekaisaran Persia kuno sukses, dan dengan demikian kita telah mengalami ledakan besar dalam perekonomian negara tersebut. Dengan meningkatnya pariwisata dan perdagangan dari persahabatan baru kita, kita harus mampu mencapai puncak kemewahan ini di tahun depan."
 PER_spoils_of_war_idea: "Rampasan Perang"
 PER_spoils_of_war_idea_desc: "Setelah berhasil membantu sekutu kami dalam perang mereka, kami mampu mengamankan wilayah kami sendiri sebagai akibat langsung dari konflik tersebut. Sudah saatnya kita mengambil alih wilayah ini dan menjadikan wilayah ini sebagai wilayah pengaruh kita yang semakin besar."
 PER_rapid_appeasement_idea: "Ketenangan Cepat"
 PER_rapid_appeasement_idea_desc: "Untuk mengekang potensi Revolusi Islam, kami telah menawarkan reparasi untuk menenangkan pihak oposisi. Hal ini akan membantu menjaga negara kita tetap stabil untuk sementara waktu, meskipun memperlambat pembangunan kita."
 PER_opposition_modifier: "Meningkatnya Oposisi"
 PER_opposition_modifier_desc: "Ketika kebencian terhadap Rezim Pahlavi semakin meningkat, semakin banyak orang yang bersatu untuk menentang pemerintahan saat ini. Jika hal ini terus terjadi, maka negara ini mungkin akan menghadapi masa depan yang tidak menyenangkan."
 PER_technological_modifier: "Investasi Teknologi"
 PER_constitutional_shah: "Reza Shah Pahlevi"
 PER_constitutional_shah_desc: "Meskipun menghadapi perubahan luar biasa di [PER.GetNameDef], Reza Shah Pahlavi kini telah diturunkan ke posisi raja konstitusional. Saat ini, dia tidak lebih dari sekadar tokoh figuran, ketika pemerintahan baru kita mengambil kendali negara."
 PER_aid_communists_cw: "Solidaritas Internasional"
 PER_aid_communists_cw_desc: "Kini setelah kita melepaskan belenggu imperialisme, kita harus siap mengirimkan bantuan kepada negara-negara lain di seluruh dunia yang masih menderita di bawah penjajahan."
 PER_communist_industrialization_idea: "Industrialisasi yang Pesat"
 PER_communist_industrialization_idea_desc: "Pemerintahan sosialis kita yang baru perlu melakukan industrialisasi dengan cepat jika kita ingin bertahan dalam ujian waktu. Bagaimanapun juga, kemungkinan besar kita kini telah menjadi ancaman bagi mereka yang takut akan kebangkitan proletariat."
 PER_iranian_radio_idea: "Radio Nasional Iran"
 PER_iranian_radio_idea_desc: "Sistem penyiaran radio nasional kita akan membantu mempromosikan opini negara mengenai hal-hal yang belum sepenuhnya disetujui oleh masyarakat."
 PER_the_new_economy_idea: "Perekonomian Baru"
 PER_the_new_economy_idea_desc: "Perekonomian baru kita dibangun berdasarkan kebutuhan penduduk, bukan mengikuti tren pasar. Bagaimanapun, kami ingin menghindari kerusakan yang disebabkan oleh kapitalisme terhadap kelas pekerja kami."
 KUR_resistance_modifier: "Perlawanan Kurdi"
 KUR_resistance_modifier_desc: "Terlepas dari upaya terbaik kami, masyarakat Kurdi di negara kami semakin gelisah dan marah. Perlahan tapi pasti, mereka mulai memberontak terhadap kita."
 PER_resistance_modifier: "Sel Resistensi"
 PER_resistance_modifier_desc: "Wilayah ini diganggu oleh sel-sel resistensi yang diatur oleh [PER.GetNameDef]."
 PER_promoting_resistance_here: "Mempromosikan Perlawanan Di Sini"
 PER_gulf_hegemony_idea: "Hegemoni Teluk"
 PER_gulf_hegemony_idea_desc: "Melalui manuver yang hati-hati, kita akhirnya mengukuhkan diri kita sebagai kekuatan utama di kawasan Teluk."
 PER_restoring_the_nation_idea: "Memulihkan Bangsa"
 PER_restoring_the_nation_idea_desc: "Dengan merestrukturisasi pemerintahan, kita telah menciptakan ketidakstabilan dan perpecahan di negara kita, kita harus memulihkan stabilitas dan persatuan negara kita sebelum kita dapat melanjutkan rencana kita."
 PER_fascism_sway_the_rich_idea: "Goyangkan Elit"
 PER_fascism_sway_the_rich_idea_desc: "Agar pemerintahan baru kita dapat berkembang, kita perlu mempertahankan kendali atas negara ini, kita perlu meyakinkan sebanyak mungkin elit Iran untuk memihak kita guna memastikan cengkeraman kita terhadap Iran tetap kuat."
 PER_invite_foreign_investors: "Penanaman Modal Asing"
 PER_invite_foreign_investors_desc: "Dengan menjangkau negara-negara demokrasi lain di seluruh dunia, kita telah mampu memulai dan menyuntikkan sumber daya ke dalam perekonomian kita yang sedang berkembang."
 PER_resist_gharbzadegi_idea: "Menolak Gharbzadegi"
 PER_resist_gharbzadegi_idea_desc: "Westernisasi yang berlebihan telah menjadi wabah bagi bangsa kita yang besar ini. Daripada menuruti keinginan orang-orang yang telah menghabiskan waktu berabad-abad menjajah wilayah kita, kita harus berupaya menciptakan negara demokratis yang dapat berdiri sendiri."
 PER_clash_of_titans_idea: "Bentrokan para Titan"
 #####################################
 #### HISTORICAL NATIONAL SPIRITS ####
 #####################################
 PER_stand_with_giants_modifier: "Untuk Berdiri Bersama Raksasa"
 PER_stand_with_giants_modifier_desc: "Sejak naik ke tampuk kekuasaan, Reza Shah Pahlavi ingin memodernisasi [PER.GetNameDef] dan mempercepatnya dibandingkan dengan negara-negara besar lainnya di dunia. Hal ini merupakan awal dari banyak reformasi sosial, ekonomi dan politik baru di [PER.GetNameDef], dan akan terus berkembang seiring dengan kemajuan kita ke arah ini."
 PER_persian_german_trade_idea: "Kamar Dagang Persia Jerman"
 PER_persian_german_trade_idea_desc: "Sebuah organisasi yang didirikan untuk mendorong hubungan perdagangan yang positif antara [PER.GetNameDef] dan [GER.GetNameDef] serta memastikan kelanjutan modernisasi industri kita menggunakan model salah satu kekuatan industri paling terkemuka di dunia."
 PER_trial_fifty_three_idea: "Mengundangkan Pengadilan Melawan Lima Puluh Tiga"
 PER_trial_fifty_three_idea_desc: "Setelah menangkap lima puluh tiga warga Iran karena terlibat dalam kegiatan politik komunis, kami dapat mengadili mereka karena sentimen anti-pemerintah mereka. Kita tidak bisa membiarkan perbedaan pendapat seperti ini berakar pada saat yang kritis bagi bangsa kita."
 PER_homeland_not_fall_idea: "Semangat Perjuangan Kita"
 PER_homeland_not_fall_idea_desc: "Waktunya telah tiba untuk membuktikan keberanian kita dan berdiri teguh melawan mereka yang mengancam rumah kita. Kumpulkan pasukan, percaya pada saudara-saudaramu dan bersiaplah untuk berjuang demi masa depan negara kita. [PER.GetNameDefCap] tidak akan jatuh ke tangan pihak-pihak yang berperang ini! Suruh mereka berlari dengan ekor di antara kedua kaki mereka!"
 PER_preemtive_strike_idea: "Menyerang Pertama"
 PER_preemtive_strike_idea_desc: "Kita tidak punya waktu menunggu untuk diserang! Sangat penting bagi kita untuk menyerang selagi situasi masih panas, dan memastikan bahwa kita dapat menciptakan negara penyangga antara kita dan negara-negara besar yang berani mengancam kedaulatan kita!"
 PER_compliant_subject_idea: "Subjek yang Sesuai"
 PER_compliant_subject_idea_desc: "Tidak ada kemenangan yang bisa didapat melawan kekuatan seperti [ROOT.OVERLORD.GetNameDef]. Sebaliknya, kita harus memainkan peran kita sebagai subjek, dan menunjukkan bahwa kita layak menjadi pengikut yang kuat."
 PER_anti_soviet_idea: "Sentimen Anti-Soviet"
 PER_anti_soviet_idea_desc: "Setelah merebut wilayah kita selama invasi ke Iran, sekarang saatnya kita membalas dendam terhadap para penghasut perang ini dan mengambil kembali apa yang menjadi hak kita. Kami tidak akan berhenti sampai bekas wilayah kami menjadi milik kami lagi."
 PER_azadi_idea: "Semangat Azadi"
 PER_azadi_idea_desc: "Azadi, atau 'Kebebasan' dalam bahasa Persia akan menjadi seruan kami saat kami berusaha bangkit melawan kekuatan yang menduduki tanah kami. Kami tidak akan menuruti keinginan mereka, namun kami akan memperjuangkan kebebasan kami, tidak peduli berapa lama waktu yang dibutuhkan."
 PER_offensive_tactics_modifier: "Taktik Ofensif"
 PER_offensive_tactics_modifier_desc: "Satu-satunya cara agar kami dapat melindungi [PER.GetNameDef] adalah dengan segera menyerang. Dengan diterapkannya taktik baru ini, kita akan berada dalam posisi yang baik untuk memukul mundur musuh kita!"
 PER_defensive_maneuvers_modifier: "Manuver Defensif"
 PER_defensive_maneuvers_modifier_desc: "Pertahanan kita harus kokoh seperti barisan pegunungan jika kita ingin mencegah musuh mengancam kota kita. Manuver pertahanan baru kami diharapkan akan menjaga pasukan musuh tetap di tempatnya!"
 PER_enemy_war_reparations_idea: "Reparasi Perang"
 PER_enemy_war_reparations_idea_desc: "Karena kegagalan operasi kami di [PER.GetNameDef], kami sekarang harus membayar besarnya biaya invasi kami. Meskipun hal ini tidak ideal, kami seharusnya dapat menyelesaikan perbaikan kami dalam waktu dua tahun."
 PER_opposition_cell: "Sel Oposisi Aktif"
 #misc
 PER_idea_comintern_research_collaboration: "[ROOT.GetFactionName] Kerjasama Penelitian"
 PER_idea_comintern_research_collaboration_desc: "[ROOT.GetAdjective] ilmuwan harus diajar oleh para ahli [SOU.GetAdjective] terbaik sebelum membawa pulang keterampilan mereka untuk membangun kembali bangsa kita dengan model [SOU.GetAdjective]."
 PER_idea_one_for_all_all_for_one: "Satu untuk semua, Semua untuk satu"
 PER_idea_one_for_all_all_for_one_desc: "Kita harus melakukan lebih dari yang diharapkan dan memastikan bahwa setiap warga negara [ROOT.GetAdjective] siap membela [ROOT.GetNameDefCap] dalam keadaan darurat. Hanya dengan melakukan hal ini kita dapat mempunyai peluang melawan kekuatan dunia, dan mempertahankan kedaulatan dan identitas kita setelah Pertandingan Besar."
 PER_idea_reject_foreign_dominance: "[ROOT.GetAdjective] Solidaritas"
 PER_idea_reject_foreign_dominance_desc: "Dengan kekuatan asing yang mengancam di perbatasan kita, kita tidak akan menyerah, kita akan bertahan dan mempertahankan diri kita sampai akhir. [ROOT.GetAdjective] kedaulatan dan identitas akan tetap bertahan, apa pun risikonya."
