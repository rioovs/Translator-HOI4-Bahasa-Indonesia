 RAJ_a_loyal_government: "Pemerintahan yang Setia"
 RAJ_a_loyal_government_desc: "Meskipun ada keinginan untuk merdeka dari para pembangkang di [RAJ.GetNameDef], pemerintahan kita tetap kuat dan stabil. Kami akan terus menjunjung tinggi kepentingan Kerajaan dengan disiplin dan tekad."
 RAJ_high_import_duties: "Bea Masuk Tinggi"
 RAJ_high_import_duties_desc: "Kami telah memberlakukan kebijakan baru dengan tujuan melindungi industri lokal dan mempertahankan hasil ekonomi [RAJ.GetNameDef]. Dengan bea masuk yang lebih tinggi terhadap barang-barang luar negeri, kami akan memastikan bahwa [RAJ.GetNameDef] dapat berdiri sendiri di lingkaran perekonomian global."
 RAJ_the_zamindari_system: "Sistem Zamindari"
 RAJ_the_zamindari_system_desc: "Dengan memperluas Sistem Zamindari, kami telah memastikan efisiensi administratif dengan memberdayakan tuan tanah yang setia menjaga ketertiban di wilayah pedesaan di negara tersebut."
 RAJ_exports_for_the_empire: "Ekspor India untuk Kekaisaran"
 RAJ_exports_for_the_empire_desc: "Perdagangan kolonial telah menjadi tulang punggung Kekaisaran [ENG.GetAdjective] selama berabad-abad, begitu pula ekspor dari [RAJ.GetNameDef]. Dengan memprioritaskan budidaya tanaman pokok seperti teh, kapas, dan rami, kami telah memperoleh aliran pendapatan yang stabil bagi kami dan Kekaisaran."
 RAJ_war_industry: "Industri Perang"
 RAJ_war_industry_dec: "Melalui tekad yang kuat dan tekad yang tak kenal lelah, kita harus mendukung upaya perang dengan meningkatkan pendanaan untuk industri senjata kita. Rakyat kami akan menempa kemenangan kami melalui keberanian, keringat, dan baja."
 RAJ_indian_gentlemen_officers_goe: "$RAJ_indian_gentlemen_officers$"
 RAJ_indian_gentlemen_officers_goe_desc: "$RAJ_indian_gentlemen_officers_desc$"
 RAJ_south_east_asia_command_dm: "$RAJ_south_east_asia_command$"
 RAJ_south_east_asia_command_dm_desc: "Dengan membentuk Komando Asia Tenggara, kita mampu memperluas pengaruh militer kita di seluruh kawasan. Hal ini tentunya akan membantu kami dalam merencanakan kampanye militer kami di benua ini."
