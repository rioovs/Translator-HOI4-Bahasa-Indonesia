 IRQ_golden_square: "Lapangan Emas"
 IRQ_golden_square_desc: "Lapangan Emas, sebuah kelompok perwira tinggi militer Irak, masih menjadi ancaman bagi stabilitas negara. Simpati mereka terletak pada rezim anti-Inggris di Eropa dan mereka menaruh harapan pada rezim tersebut untuk dapat membantu melepaskan diri dari pengaruh Inggris ketika ada kesempatan."
 IRQ_golden_square_strong: "$IRQ_golden_square$"
 IRQ_golden_square_strong_desc: "$IRQ_golden_square_desc$"
 IRQ_anglo_iraqi_treaty: "Perjanjian Anglo-Irak"
 IRQ_anglo_iraqi_treaty_desc: "Meskipun dinegosiasikan ulang pada tahun 1930, perjanjian Anglo-Irak tetap merupakan perjanjian sepihak yang menjadikan Irak sebagai negara klien Kerajaan Inggris secara de facto. Perjanjian tersebut memberikan hak istimewa atas sumber daya minyak Irak kepada Inggris dan memungkinkan mereka untuk menggunakan fasilitas militer di seluruh negeri. Hal ini terus menimbulkan perbedaan pendapat besar-besaran di kalangan rakyat Irak yang mendambakan kemerdekaan sejati. Pemerintah mana pun yang berkuasa harus memutuskan apakah akan merundingkan kembali perjanjian tersebut, atau membatalkannya dan mengambil risiko kemarahan militer Inggris."
 IRQ_agrarian_society: "Masyarakat Agraris"
 IRQ_agrarian_society_desc: "Industri Irak berkisar pada sektor pertanian, dan kepemimpinan konservatif di wilayah tersebut tidak tertarik untuk mengembangkan dan melakukan industrialisasi lahan. Waktu dan upaya yang tepat perlu dicurahkan untuk menyelesaikan permasalahan di negara bagian ini."
