 AFG_subsistence_economy_modifier: "Ekonomi Subsisten"
 AFG_subsistence_economy_modifier_desc: "Mayoritas penduduk tinggal di pedesaan, hanya menghasilkan makanan yang cukup untuk diri mereka sendiri dan keluarga mereka untuk bertahan hidup di bulan-bulan musim dingin yang keras. Mereka tidak begitu tertarik untuk mengubah cara hidup mereka untuk mengakomodasi industri-industri yang menghasilkan keuntungan dan kecil kemungkinannya untuk mengubah pola pikir tersebut terlepas dari siapa yang seharusnya memegang kekuasaan di Kabul."
 AFG_pashtunwali: "Pashtunwali"
 AFG_pashtunwali_desc: "Suku Pashtun merupakan kelompok populasi terbesar dan paling kuat secara politik. Sebagian besar warga Pashtun hidup dengan kode etik dan aturan tradisional yang dikenal sebagai Pashtunwali. Hal ini menyulitkan pemerintah untuk mempertahankan kekuasaan, apalagi melakukan reformasi, ketika hal tersebut terlihat bertentangan dengan aturan tradisional."
 AFG_concessions_pashtunwali: "Demokrasi Pashtun"
 AFG_economic_regionalism: "Regionalisme Ekonomi"
 AFG_economic_regionalism_desc: "Berbagai wilayah di Afghanistan kurang memiliki kohesi yang kuat dengan pemerintah atau perekonomian nasional karena kurangnya infrastruktur yang sesuai. Hal ini membuat sulitnya berbagi beban atau keuntungan ekonomi di luar wilayah masing-masing dan berkontribusi terhadap isolasi berkelanjutan mereka."
 AFG_turkish_military_mission: "Misi Militer Turki"
 AFG_turkish_military_mission_desc: "Sejak tahun 1933, personel militer Turki telah membantu mendidik generasi tentara Afghanistan berikutnya. Mungkin pada saatnya nanti, pengaturan ini dapat diperluas untuk mendekatkan negara-negara besar kita."
