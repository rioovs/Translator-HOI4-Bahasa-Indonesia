 idea_RAJ_flames_of_the_revolution_desc: "Tatanan lama telah runtuh karena beban kebusukannya sendiri. Dari abu pemerintahan kolonial, muncullah India baru, yang ditempa bukan di istana atau parlemen, namun di ladang, pabrik, dan api revolusi. Sayangnya bara api perang kelas masih membara... dan tidak semua orang yang mengenakan pakaian merah bersedia melakukan hal tersebut."
