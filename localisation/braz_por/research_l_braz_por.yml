 early_carrier: "Kapal Induk Awal (Kapal Induk I)"
 basic_carrier: "Kapal Induk Dasar (Kapal Induk II)"
 improved_destroyer: "Kapal Perusak yang Disempurnakan (Kapal Perusak III)"
 basic_dp_light_battery: "Baterai Dwi-Guna Ringan Dasar"
 basic_dp_light_battery_desc: "Menggabungkan fungsi anti-kapal dan anti-pesawat dalam satu dudukan meriam menghadirkan fleksibilitas tinggi dan menghemat bobot kapal.\n\nMemasang modul ini meningkatkan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, yang membantu dalam menghadapi §YKapal Tabir§! lawan. Modul ini juga meningkatkan §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nMemasang Modul §YBaterai Sekunder§! memberi §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, atau §Y$ship_hull_heavy$§! sedikit §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! dan memungkinkannya membidik target kedua."
 improved_dp_light_battery: "Baterai Dwi-Guna Ringan yang Disempurnakan"
 improved_dp_light_battery_desc: "Dudukan meriam kembar tertutup bertenaga penuh secara signifikan meningkatkan daya tembak dan perlindungan sembari menghemat bobot kapal.\n\nMemasang modul ini meningkatkan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, yang membantu menghadapi §YKapal Tabir§! musuh. Modul ini juga meningkatkan §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nMemasang Modul §YBaterai Sekunder§! memberi §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, atau §Y$ship_hull_heavy$§! sedikit §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! dan memungkinkannya membidik sasaran kedua."
 advanced_dp_light_battery: "Baterai Dwi-Guna Ringan Mutakhir"
 advanced_dp_light_battery_desc: "Dudukan meriam tertutup dengan tembakan cepat otomatis secara luar biasa meningkatkan daya tembak armada.\n\nMemasang modul ini meningkatkan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, yang membantu menghadapi §YKapal Tabir§! musuh. Modul ini juga meningkatkan §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!.\nMemasang Modul §YBaterai Sekunder§! memberi §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§!, atau §Y$ship_hull_heavy$§! sedikit §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! dan memungkinkannya membidik sasaran kedua."
 basic_dp_medium_battery: "Baterai Dwi-Guna Sedang Mutakhir"
 basic_dp_medium_battery_desc: "Baterai meriam tertutup kaliber menengah dengan mekanisme pengisian otomatis tembakan cepat meningkatkan daya tembak secara masif.\n\nMemasang modul §YBaterai Ringan-Sedang§! meningkatkan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§!, yang membantu menghadapi §YKapal Tabir§! lawan. Modul ini juga meningkatkan §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§!."
