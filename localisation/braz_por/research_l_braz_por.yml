 cat_ship_heavy_battery: "Baterai Meriam Berat"
 masterful_blitz: "Blitz Gemilang"
 grand_banzai_charge: "Serbuan Banzai Akbar"
 masterful_blitz_desc: "Kita mungkin bukan penemu strategi Blitzkrieg, namun kita akan mengembangkan dan menyempurnakannya sedemikian rupa sehingga garis pertahanan musuh yang paling kokoh sekalipun tak akan mampu menghentikan laju gerak maju tentara kejayaan kita."
 penal_infantry: "Batalion Hukuman (Penal)"
 penal_infantry_desc: "Batalion hukuman memberi kesempatan bagi para prajurit dan perwira terpidana untuk menumpahkan darah bagi tanah air dan menebus kesalahan atau tindakan memalukan yang dilakukan di masa lalu."
