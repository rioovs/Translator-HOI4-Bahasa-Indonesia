 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech: "Meriam Pemusnah Berdaya Hantam Tinggi"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc: "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "Konversi Mesin Laut"
 sp_armored_lc_naval_engine_conversion_tech_desc: "Memanfaatkan teknik rekayasa mesin kapal laut seperti poros engkol yang diperkuat, transmisi bertorsi tinggi, dan sistem pendingin khusus dapat melipatgandakan keluaran tenaga serta daya tahan mesin Tank Penjelajah Darat (Land Cruiser), memungkinkannya menghela bobot dan beban mekanis raksasa dengan lebih andal."
 sp_armored_lc_transmission_improvements_tech: "Penyempurnaan Transmisi"
 sp_armored_lc_transmission_improvements_tech_desc: "Penyempurnaan rasio roda gigi, mekanisme kopling, dan konverter torsi guna menciptakan sistem transmisi yang lebih efisien yang sanggup mengatasi tenaga dan bobot ekstrem Land Cruiser, meningkatkan mobilitas keseluruhan dan memangkas keausan mekanis."
 sp_armored_lc_specialized_field_manuals_tech: "Buku Petunjuk Lapangan Khusus"
 sp_armored_lc_specialized_field_manuals_tech_desc: "Menyusun buku panduan pelatihan mendalam yang dirancang khusus bagi awak Land Cruiser, mencakup prosedur operasional unik, protokol perawatan mesin, dan taktik medan tempur yang rumit yang dituntut untuk mengomandoi mesin perang raksasa ini secara mangkus."
 sp_armored_lc_weapon_fire_control_tech: "Kendali Tembakan Persenjataan"
 sp_armored_lc_weapon_fire_control_tech_desc: "Menerapkan optik pembidik sasaran mutakhir, alat pengukur jarak, dan giroskop penstabil guna mendongkrak akurasi senjata serta koordinasi penembakan, memastikan meriam mampu menghantam target secara presisi terlepas dari hentakan tolak balik yang luar biasa dan kelambanan manuvernya."
 sp_armored_engineer_tech: "Kompi Zeni Lapis Baja"
 sp_armored_engineer_tech_desc: "Memadukan keahlian teknik zeni dengan perlindungan lapisan baja, unit zeni lapis baja berspesialisasi dalam menembus rintangan dan mendukung gerak maju garis depan di bawah hujan tembakan sengit."
 sp_armored_maintenance_tech: "Kompi Pemeliharaan Lapis Baja"
 sp_armored_maintenance_tech_desc: "Pengerahan kendaraan pemulihan lapis baja (ARV) memungkinkan personel pemeliharaan kita mengevakuasi dan memperbaiki segala jenis peralatan tempur, menjamin kesiapan operasional maksimal di kancah laga."
 sp_armored_signal_tech: "Kompi Sinyal Lapis Baja"
 sp_armored_signal_tech_desc: "Memperlengkapi unit kita dengan kendaraan komando lapis baja akan memastikan komunikasi dan koordinasi medan tempur yang aman serta andal di balik perlindungan lapisan baja."
 sp_armored_motorized_military_police_tech: "Polisi Militer Bermotor"
 sp_armored_motorized_military_police_tech_desc: "Dilengkapi dengan sepeda motor militer, unit-unit ini bertugas menjaga ketertiban di belakang garis depan, mengawal konvoi pasokan, dan melancarkan patroli rutin. Kecepatan dan kelincahan mereka memungkinkan mereka merespons gangguan secara kilat dan, jika mendesak, melakukan pengintaian di zona tempur aktif."
 sp_cluster_shells: "Proyektil Kluster"
 sp_cluster_shells_desc: "Proyektil kluster menyebarkan banyak sub-amunisi ke area yang luas, memaksimalkan kerusakan terhadap pasukan dan perlengkapan musuh."
 sp_artillery_rocket_assisted_projectiles_tech: "Proyektil Berbantuan Roket (RAP)"
 sp_artillery_rocket_assisted_projectiles_tech_desc: "Proyektil yang disempurnakan untuk howitzer super-berat, dirancang untuk memperluas jangkauan tembak dan meningkatkan daya hantam melalui dorongan propulsi roket tambahan."
 sp_artillery_purpose_built_gun_motor_carriages_tech: "Kereta Meriam Bermotor Khusus"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc: "Kendaraan khusus yang dirancang untuk mengangkut dan menopang howitzer super-berat, menjamin mobilitas tinggi dan kemudahan pengerahan di kancah laga."
 sp_multi_product_supply_ships: "Kapal Pasokan Multi-Produk"
 sp_multi_product_supply_ships_desc: "Dengan digunakannya kapal pasokan multi-produk yang baru diproduksi, kita dapat menjamin kelancaran transfer bahan bakar, amunisi, dan perbekalan secara serentak di laut."
 sp_standard_tenshioned_replenishment_alongside_method: "Metode Pengisian Berdampingan Teregang Baku (STREAM)"
 sp_standard_tenshioned_replenishment_alongside_method_desc: "Standardized Tensioned Replenishment Alongside Method atau STREAM adalah evolusi mutakhir dalam menjamin pasokan ulang yang stabil bagi operasi armada laut jarak jauh kita."
 sp_aip_engine_improved_tech: "Mesin Kombinasi AIP-Diesel"
 sp_aip_engine_improved_tech_desc: "Dengan penyempurnaan lebih lanjut dari teknologi AIP (Air-Independent Propulsion), kita menyaksikan lompatan baik dari segi performa maupun efisiensi konsumsi material mesin penggerak."
 sp_aip_engine_advanced_tech: "Mesin Walter Kecepatan Tinggi"
 sp_aip_engine_advanced_tech_desc: "Pengalaman dan pemahaman mendalam kita mengenai Sistem Propulsi Bebas-Udara (AIP) telah memungkinkan pengembangan mesin termutakhir. Senyap, kencang, dan mematikan."
 sp_refined_pykrete: "Pykrete Murni"
 sp_refined_pykrete_desc: "Dengan pemurnian Pykrete lebih lanjut, kita kini mampu memberikan isolasi termal dan perlindungan yang jauh lebih unggul bagi pesawat kita di atas Kapal Induk Es."
 sp_ice_composite_runawayas: "Landasan Pacu Komposit Es"
 sp_ice_composite_runawayas_desc: "Seiring berlanjutnya pengembangan komposit es, kita mencari material dan teknik konstruksi terbaik guna memberikan perlindungan maksimal bagi kapal induk dan pesawat kita."
 heavy_battleship2: "Kapal Tempur Super-Berat II"
 heavy_battleship2_desc: "Penyempurnaan rancangan kapal tempur super-berat terdahulu dengan persenjataan yang lebih perkasa dan sistem kendali tembakan yang jauh lebih akurat."
 sp_shock_hardening_techniques: "Teknik Pengerasan Tahan Kejut"
 sp_shock_hardening_techniques_desc: "Dengan menerapkan berbagai Teknik Pengerasan Tahan Kejut dan memasang penyeimbang tegangan mekanis pada komponen kita, kita berhasil menurunkan angka detonasi dini prematur, menjadikan proyektil kita jauh lebih andal dan berdaya guna."
 sp_variable_time_fuze_shells: "Proyektil Picu Waktu Variabel (VT Fuze)"
 sp_variable_time_fuze_shells_desc: "Dengan mengadopsi Proyektil Picu Waktu Variabel (Picu Kedekatan Jarak) - artileri medan kita menjadi teramat menghancurkan bagi musuh. Proyektil meledak tepat di udara sebelum menyentuh tanah, sehingga menciptakan zona pembantaian serpihan yang jauh lebih luas."
 sp_helicopter_transport_pods_tech: "Kompi Angkut Helikopter"
 sp_helicopter_transport_pods_tech_desc: "Helikopter yang dilengkapi pod angkut atau derek barang di bawah badannya dapat memindahkan perbekalan dan peralatan berat secara kilat tanpa terhambat kondisi medan. Terjebak dalam lumpur kini menjadi cerita masa lalu!"
 sp_helicopter_artillery_observers_tech: "Kompi Pengintai Helikopter"
 sp_helicopter_artillery_observers_tech_desc: "Helikopter mampu memperoleh sudut pandang medan tempur yang sangat menguntungkan terlepas dari rintangan darat, menjadikannya pemandu depan yang sangat unggul dalam memberikan umpan balik akurat bagi salvo tembakan artileri."
 sp_helicopter_med_evac_tech: "Kompi Evakuasi Medis Helikopter"
 sp_helicopter_med_evac_tech_desc: "Ada korban luka tiba! Kita kedatangan korban luka! Helikopter menghadirkan evakuasi korban tempur yang jauh lebih kilat melampaui ambulans darat biasa."
 sp_rockets_dual_chamber_rocket_engine_1: "Mesin Roket Ruang Bakar Ganda"
 sp_rockets_dual_chamber_rocket_engine_1_desc: "Dengan menambahkan ruang pembakaran kedua pada mesin roket, kita dapat memperpanjang durasi terbang dan meningkatkan efektivitas mesin roket kita."
 sp_rockets_dual_chamber_rocket_engine_2: "Mesin Roket Ruang Bakar Ganda Mutakhir"
 sp_rockets_dual_chamber_rocket_engine_2_desc: "Penyempurnaan lebih lanjut pada mesin pembakaran ganda dapat mendatangkan peningkatan efektivitas yang jauh lebih besar dalam rancangan roket."
 sp_advance_sabot_shells: "Proyektil Sabot Mutakhir"
 sp_advance_sabot_shells_desc: "Alokasi sumber daya tambahan untuk riset amunisi penembus lapis baja telah memberi kita wawasan mendalam tentang cara menyempurnakan stabilisasi proyektil Sabot dalam berbagai kondisi tempur."
 reinforced_wings_mothership: "Sayap Pesawat Induk Diperkuat"
 reinforced_wings_mothership_desc: "Tanpa pesawat induknya, pesawat tempur kerdil pada dasarnya akan terlantar di angkasa, memangkas drastis efektivitas operasional mereka. Memperkuat sayap pesawat induk adalah strategi paling efektif dari segi biaya guna meningkatkan kelangsungan hidup seluruh skuadron."
 miniature_fighters: "Pesawat Tempur Miniatur"
 miniature_fighters_desc: "Dengan pesawat tempur yang lebih kecil, kita akan mampu mengangkut lebih banyak unit ke kancah laga tanpa mengorbankan banyak daya tembak, sekaligus meringankan beban angkut pesawat induk."
 aerial_hangars: "Hanggar Terbang"
 aerial_hangars_desc: "Hanggar terbang yang terpasang pada badan pesawat induk memungkinkan kita menampung lebih banyak pesawat tempur miniatur di atas wahana angkut, menghasilkan daya tembak yang lebih perkasa dan jangkauan tempur yang lebih jauh."
 mothership: "Pesawat Udara Induk"
 transport_planes_cat: "Pesawat Angkut"
