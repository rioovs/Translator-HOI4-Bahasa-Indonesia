 basic_fire_control_system_desc: "Seluruh tembakan meriam kapal diarahkan dari satu posisi komando pusat, menjamin kelompok perkenaan tembakan yang lebih rapat dan meningkatkan akurasi tembakan."
 improved_fire_control_system: "Sistem Kendali Tembakan yang Disempurnakan"
 improved_fire_control_system_desc: "Dengan memasukkan data arah haluan, laju kecepatan, dan jarak sasaran, sebuah komputer analog mekanis dapat secara presisi memprediksi posisi sasaran saat salvo tembakan berikutnya siap diluncurkan."
 advanced_fire_control_system: "Sistem Kendali Tembakan Mutakhir"
 advanced_fire_control_system_desc: "Komputer mekanis yang besar dan rumit yang melacak sejumlah besar data masukan mengenai target, kapal penembak, serta kondisi cuaca dan alun gelombang laut demi menghasilkan perhitungan balistik yang sangat presisi."
 sonar: "Sonar Pasif"
 sonar_desc: "Perangkat dasar hidrofon memungkinkan pelacakan target bawah air dengan mendeteksi gelombang suara yang mereka hasilkan.\n\nMemasang modul ini pada §YSlot Elektronik§! di §YKapal Ringan§! atau §YKapal Penjelajah§! akan membantu mereka mendeteksi §YKapal Selam§! musuh."
 improved_sonar: "Sonar Aktif"
 improved_sonar_desc: "Menggunakan modulasi gelombang suara, sistem ini dapat mengukur bantalan arah dan jarak ke target yang menyelam secara presisi.\n\nMemasang modul ini pada §YSlot Elektronik§! di §YKapal Ringan§! atau §YKapal Penjelajah§! akan membantu mereka mendeteksi §YKapal Selam§! musuh."
 advanced_sonar: "Sonar Mutakhir"
 advanced_sonar_desc: "Susunan larik hidrofon yang disempurnakan dan teknik pancaran sonar aktif memberi kapal kita kemampuan melacak bahkan kapal selam musuh yang paling senyap sekalipun.\n\nMemasang modul ini pada §YSlot Elektronik§! di §YKapal Ringan§! atau §YKapal Penjelajah§! akan membantu mereka mendeteksi §YKapal Selam§! musuh."
 modern_sonar: "Sonar Modern"
 modern_sonar_desc: "Kemajuan dalam penyaringan sinyal dan pemindaian terarah memberi sistem sonar kita akurasi luar biasa dalam mendeteksi ancaman bawah air.\n\nMemasang modul ini pada §YSlot Elektronik§! di §YKapal Ringan§! atau §YKapal Penjelajah§! akan membantu mereka mendeteksi §YKapal Selam§! musuh."
 smoke_generator: "Pembangkit Asap"
 smoke_generator_desc: "Sedikit modifikasi pada mesin dan cerobong kapal ringan serta menengah memungkinkan mereka menghasilkan tabir asap tebal untuk menghindari atau memutus kontak tembak dengan musuh."
 depth_charges_advice_tt: "\nMemasang modul §YBom Laut§! pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka menyerang §YKapal Selam§! musuh."
 sonar_advice_tt: "\nMemasang modul §YSonar§! pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka mendeteksi §YKapal Selam§! musuh."
 basic_depth_charges: "Bom Laut Dasar"
 basic_depth_charges_desc: "Wadah peledak sederhana dengan pemicu peka tekanan yang meledak saat mencapai kedalaman yang telah diatur sebelumnya.\n\nMemasang modul ini pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka menyerang §YKapal Selam§! musuh."
 improved_depth_charges: "Pelontar Bom Laut"
 improved_depth_charges_desc: "Perangkat mekanis sederhana yang melontarkan bom laut pada jarak tertentu menjauhi kapal. Ini berarti kapal perusak tidak lagi harus melaju tepat di atas sasaran untuk melepaskan serangan.\n\nMemasang modul ini pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka menyerang §YKapal Selam§! musuh."
 advanced_depth_charges: "Mortir Bom Laut"
 advanced_depth_charges_desc: "Mortir di atas kapal perusak mampu melontarkan muatan peledak jauh lebih ke depan, memungkinkan kapal mempertahankan kontak sonar dengan kapal selam musuh sepanjang serangan dan meningkatkan akurasi secara drastis.\n\nMemasang modul ini pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka menyerang §YKapal Selam§! musuh."
 modern_depth_charges: "Mortir Bom Laut yang Disempurnakan"
 modern_depth_charges_desc: "Muatan pendorong propelan yang lebih besar melontarkan bom laut terkalibrasi ke arah kapal selam dari jarak yang cukup jauh.\n\nMemasang modul ini pada §YKapal Ringan§! dan §YKapal Penjelajah§! memungkinkan mereka menyerang §YKapal Selam§! musuh."
 improved_seaplane_tender: "Kapal Tender Pesawat Amfibi yang Disempurnakan"
 improved_seaplane_tender_desc: "Kemajuan dalam perbekalan ulang di laut lepas dan teknologi derek pemulihan menyempurnakan efisiensi pengoperasian pesawat amfibi.\n\nMemasang modul §YTender Pesawat Amfibi§! pada §YKapal Perusak§! meningkatkan kemampuan mereka dalam mendeteksi kapal musuh."
 seaplane_tender_advice_tt: "\nMemasang modul §YTender Pesawat Amfibi§! pada §YKapal Perusak§! meningkatkan kemampuan mereka dalam mendeteksi kapal musuh."
 improved_airplane_launcher: "Ketapel Peluncur Pesawat yang Disempurnakan"
 improved_airplane_launcher_desc: "Mekanisme pneumatik yang disempurnakan memungkinkan peluncuran pesawat yang jauh lebih besar menggunakan ketapel. Ini memperluas radius pencarian pengintaian.\n\nMemasang modul ini pada §YKapal Penjelajah§!, §YKapal Berat§!, atau §YKapal Selam§! khusus meningkatkan kemampuan mereka mendeteksi kapal musuh."
 airplane_launcher_advice_tt: "\nMemasang modul §YKetapel Peluncur§! pada §YKapal Penjelajah§!, §YKapal Berat§!, atau §YKapal Selam§! khusus meningkatkan kemampuan mereka mendeteksi kapal musuh."
 cruiser_armor_advice_tt: "\nMemasang modul §YBaja Pelindung§! yang lebih baik pada §YKapal Penjelajah§! meningkatkan ketahanan mereka terhadap kerusakan musuh."
 heavy_armor_advice_tt: "\nMemasang modul §YBaja Pelindung§! yang lebih baik pada §YKapal Berat§! meningkatkan ketahanan mereka terhadap kerusakan musuh. §YKapal Tempur§! dan §YPenjelajah Tempur§! dibedakan berdasarkan skema §YBaja Pelindung§! yang berbeda, di mana Penjelajah Tempur umumnya memiliki lapisan baja yang lebih tipis."
 basic_cruiser_armor_scheme: "Skema Baja Pelindung Penjelajah Dasar"
 basic_cruiser_armor_scheme_desc: "Skema baja pelindung yang memadukan sabuk lambung (belt) dan geladak (deck) sebagaimana kapal utama, menawarkan perlindungan terhadap pecahan proyektil dan peluru kaliber kecil.\n\nMemasang modul ini pada §YKapal Penjelajah§! meningkatkan kemampuan mereka dalam §Ymenahan kerusakan musuh§!, tetapi juga §Rmengurangi§! §Ykecepatan§! kapal."
 improved_cruiser_armor_scheme: "Skema Baja Pelindung Sabuk Miring Penjelajah"
 improved_cruiser_armor_scheme_desc: "Dengan menempatkan sabuk baja pelindung pada sudut kemiringan tertentu, bobot dan ketebalan baja yang sama menjadi jauh lebih sulit ditembus proyektil musuh.\n\nMemasang modul ini pada §YKapal Penjelajah§! meningkatkan kemampuan mereka dalam §Ymenahan kerusakan musuh§!, tetapi juga §Rmengurangi§! §Ykecepatan§! kapal."
 advanced_cruiser_armor_scheme: "Skema Baja Pelindung Segala-atau-Tiada Penjelajah"
 advanced_cruiser_armor_scheme_desc: "Skema perlindungan ini memusatkan perisai baja tebal hanya pada kompartemen vital kapal, sembari mengabaikan bagian-bagian yang tidak esensial.\n\nMemasang modul ini pada §YKapal Penjelajah§! meningkatkan kemampuan mereka dalam §Ymenahan kerusakan musuh§!, tetapi juga §Rmengurangi§! §Ykecepatan§! kapal."
 basic_heavy_armor_scheme: "Skema Baja Pelindung Sabuk Miring"
 basic_heavy_armor_scheme_desc: "Dengan memasang sabuk baja pada sudut kemiringan tertentu, ketebalan baja yang sama menjadi jauh lebih sulit ditembus peluru artileri berat lawan.\n\nMemasang modul ini pada §YKapal Berat§! meningkatkan kemampuan mereka dalam §Ymenahan kerusakan musuh§!. §YKapal Tempur§! dan §YPenjelajah Tempur§! dibedakan oleh skema §YBaja Pelindung§! masing-masing."
 improved_heavy_armor_scheme: "Skema Baja Pelindung Segala-atau-Tiada"
 improved_heavy_armor_scheme_desc: "Skema ini berfokus melindungi kompartemen paling vital kapal secara maksimal (citadel), sembari mengabaikan kompartemen non-kritis.\n\nMemasang modul ini pada §YKapal Berat§! meningkatkan kemampuan mereka dalam §Ymenahan kerusakan musuh§!. §YKapal Tempur§! dan §YPenjelajah Tempur§! dibedakan oleh skema §YBaja Pelindung§! masing-masing."
 torpedo_advice_tt: "\nMemasang §YPeluncur Torpedo§! pada §YKapal Ringan§! atau §YKapal Penjelajah§! memungkinkan mereka menimbulkan kerusakan masif pada §YKapal Utama§! musuh di §YGaris Tempur§! jika mereka berhasil menembus §YKelompok Tabir§! musuh."
 basic_torpedo: "Torpedo Dasar"
 basic_torpedo_desc: "Senjata swagerak bawah air dengan hulu ledak yang meluncur pada haluan yang telah ditentukan hingga menghantam lambung sasaran di bawah garis air.\n\nMemasang modul ini pada §YKapal Ringan§! atau §YKapal Penjelajah§! memungkinkan mereka mendatangkan kerusakan fatal pada §YKapal Utama§! lawan."
 magnetic_detonator: "Detonator Magnetik"
 magnetic_detonator_desc: "Detonator baru mendeteksi pergeseran medan magnet bumi ketika torpedo melintas tepat di bawah lunas kapal sasaran. Ledakan yang terjadi tepat di bawah lunas menimbulkan kerusakan berkali lipat dan kerap mematahkan tulang lunas kapal musuh, menenggelamkannya seketika."
 homing_torpedo: "Torpedo Pemandu (Homing)"
 homing_torpedo_desc: "Dilengkapi dengan sensor akustik pelacak, torpedo ini mampu mengarahkan diri secara otomatis ke sumber kebisingan paling dominan di depannya - umumnya baling-baling kapal sasaran."
 electric_torpedo: "Torpedo Elektrik"
 electric_torpedo_desc: "Alih-alih meninggalkan jejak gelembung udara yang mudah terdeteksi di permukaan, torpedo dengan motor elektrik meluncur nyaris tanpa jejak hingga menghantam sasaran. Ini juga berarti tidak ada jejak buih yang menuntun musuh kembali ke lokasi kapal selam peluncur."
 improved_ship_torpedo_launcher: "Peluncur Torpedo Kapal yang Disempurnakan"
 improved_ship_torpedo_launcher_desc: "Motor penggerak yang lebih kuat memungkinkan pemasangan lebih banyak tabung peluncur dalam satu dudukan serta pembidikan ke sasaran dengan lebih cepat.\n\nMemasang modul ini pada §YKapal Ringan§! atau §YKapal Penjelajah§! memungkinkan mereka menimbulkan kerusakan besar pada §YKapal Utama§! musuh."
 advanced_ship_torpedo_launcher: "Peluncur Torpedo Kapal Mutakhir"
 advanced_ship_torpedo_launcher_desc: "Tabung berdiameter lebih besar memungkinkan penembakan torpedo yang lebih besar dengan hulu ledak yang jauh lebih dahsyat.\n\nMemasang modul ini pada §YKapal Ringan§! atau §YKapal Penjelajah§! memungkinkan mereka mendatangkan kerusakan besar pada §YKapal Utama§! lawan."
 modern_ship_torpedo_launcher: "Peluncur Torpedo Kapal Modern"
 modern_ship_torpedo_launcher_desc: "Dorongan udara bertekanan tinggi yang kuat memungkinkan peluncuran torpedo berat pada kecepatan yang jauh lebih tinggi.\n\nMemasang modul ini pada §YKapal Ringan§! atau §YKapal Penjelajah§! memungkinkan mereka menimbulkan kerusakan besar pada §YKapal Utama§! musuh."
 snorkel_advice_tt: "\nMemasang §YSnorkel§! pada §YKapal Selam§! secara dramatis memangkas §YVisibilitas Terlihat§! mereka, membuat mereka jauh lebih sukar dipantau dan diserang oleh kapal perang musuh."
 basic_submarine_snorkel: "Snorkel Kapal Selam Dasar"
 basic_submarine_snorkel_desc: "Pipa snorkel sederhana memungkinkan mesin diesel kapal selam menyerap udara segar dari atmosfer sembari tetap menyelam tepat di bawah permukaan air.\n\nMemasang modul ini pada §YKapal Selam§! memangkas §YVisibilitas Terlihat§! mereka, sehingga lebih sulit dideteksi lawan."
 improved_submarine_snorkel: "Snorkel Kapal Selam yang Disempurnakan"
 improved_submarine_snorkel_desc: "Rancangan katup yang disempurnakan mencegah air laut tersedot ke dalam mesin dan turut memangkas pantulan radar pada kepala pipa snorkel.\n\nMemasang modul ini pada §YKapal Selam§! memangkas §YVisibilitas Terlihat§! mereka, menjadikan mereka sangat sulit terdeteksi."
 light_battery_advice_tt: "\n\nMemasang modul §YBaterai Meriam Ringan§! pada §YKapal Ringan§! dan §YKapal Penjelajah§! meningkatkan §YSerangan Meriam Ringan§! mereka, yang berguna menghancurkan §YKapal Tabir§! musuh. §YBaterai Meriam Ringan§! umumnya kurang berdaya melawan kapal berlapis baja tebal seperti §YKapal Penjelajah§! dan §YKapal Berat§!."
 medium_battery_advice_tt: "\n\nMemasang modul §YBaterai Ringan-Sedang§! atau §YBaterai Sedang§! pada §YKapal Penjelajah§! meningkatkan §YSerangan Meriam Ringan§! atau §YSerangan Meriam Berat§! mereka, memungkinkan mereka bertarung melawan §YKapal Tabir§! atau §YKapal Utama§! musuh. Memasang §YBaterai Sedang§! apa pun akan menetapkan kapal sebagai §YPenjelajah Berat§!, sedangkan hanya memasang §YBaterai Ringan-Sedang§! akan menetapkannya sebagai §YPenjelajah Ringan§!."
 heavy_battery_advice_tt: "\n\nMemasang modul §YBaterai Meriam Berat§! mendongkrak nilai §YSerangan Meriam Berat§! §YKapal Berat§!, memungkinkannya menghantam dan menenggelamkan §YKapal Utama§! musuh. §YBaterai Meriam Berat§! umumnya kurang efektif membidik wahana lincah yang lebih kecil seperti §YKapal Ringan§! dan §YPenjelajah Ringan§!."
 basic_battery: "Artileri Meriam Laut"
 basic_battery_desc: "Rancangan dasar mekanisme putar dan sudut elevasi untuk meriam kapal perang."
 basic_light_battery: "Baterai Meriam Ringan Dasar"
 basic_light_battery_desc: "Dudukan terbuka bertenaga untuk meriam kaliber kecil yang digunakan pada kapal-kapal perang kecil.\n\nMemasang modul ini meningkatkan §YSerangan Meriam Ringan§!, yang membantu dalam menembak §YKapal Tabir§! musuh."
 improved_light_battery: "Baterai Meriam Ringan yang Disempurnakan"
 improved_light_battery_desc: "Dudukan tertutup bertenaga untuk meriam kaliber kecil memberi awak kapal perlindungan dari cuaca buruk dan serpihan peluru.\n\nMemasang modul ini meningkatkan §YSerangan Meriam Ringan§!, yang membantu dalam menembak §YKapal Tabir§! musuh."
 advanced_light_battery: "Baterai Meriam Ringan Mutakhir"
 advanced_light_battery_desc: "Dudukan ganda mutakhir menghadirkan daya tembak yang jauh lebih besar di balik perlindungan lapis baja kokoh.\n\nMemasang modul ini meningkatkan §YSerangan Meriam Ringan§!, yang membantu dalam menembak §YKapal Tabir§! musuh."
 basic_light_shell: "Proyektil Semi-Penembus Baja Kaliber Kecil"
 basic_light_shell_desc: "Kompromi antara kemampuan menembus baja dan daya ledak tinggi; proyektil ini menimbulkan kerusakan jauh lebih besar setelah menembus dinding tipis kapal ringan."
 improved_light_shell: "Proyektil Penembus Baja Kaliber Kecil"
 improved_light_shell_desc: "Proyektil penembus baja murni untuk meriam kaliber kecil memberi kapal perusak peluang nyata dalam melukai kapal lawan yang berlapis baja."
 basic_medium_battery: "Baterai Meriam Sedang Dasar"
 basic_medium_battery_desc: "Kubah meriam bertenaga dengan dua atau tiga laras meriam kaliber menengah untuk digunakan pada kapal penjelajah.\n\nMemasang modul §YBaterai Ringan-Sedang§! meningkatkan §YSerangan Meriam Ringan§!, yang membantu menghadapi §YKapal Tabir§! musuh. Memasang modul §YBaterai Sedang§! meningkatkan §YSerangan Meriam Berat§!, yang membantu menghadapi §YKapal Utama§! musuh."
 improved_medium_battery: "Baterai Meriam Sedang yang Disempurnakan"
 improved_medium_battery_desc: "Tata letak kubah meriam yang disempurnakan memungkinkan pengisian amunisi lebih cepat sementara baja pelindung yang lebih baik mempertinggi daya tahan kapal.\n\nMemasang modul §YBaterai Ringan-Sedang§! meningkatkan §YSerangan Meriam Ringan§!, yang membantu menghadapi §YKapal Tabir§! musuh. Memasang modul §YBaterai Sedang§! meningkatkan §YSerangan Meriam Berat§!, yang membantu menghadapi §YKapal Utama§! musuh."
 advanced_medium_battery: "Baterai Meriam Sedang Mutakhir"
 advanced_medium_battery_desc: "Dengan mengintegrasikan pengisian amunisi bertenaga mesin dan kendali daya jarak jauh, kapal penjelajah modern dapat meraih laju tembak dan akurasi yang sebelumnya dinilai mustahil.\n\nMemasang modul §YBaterai Ringan-Sedang§! meningkatkan §YSerangan Meriam Ringan§!, yang membantu menghadapi §YKapal Tabir§! musuh. Memasang modul §YBaterai Sedang§! meningkatkan §YSerangan Meriam Berat§!, yang membantu menghadapi §YKapal Utama§! musuh."
 basic_medium_shell: "Proyektil Sedang Bertudung Penembus Baja"
 basic_medium_shell_desc: "Dengan memasang tudung balistik aerodinamis, proyektil dapat melesat lebih stabil di udara sembari tetap mempertahankan performa penetrasi baja yang mematikan."
 improved_medium_shell: "Proyektil Semi-Penembus Baja Kaliber Sedang"
 improved_medium_shell_desc: "Kompromi antara penetrasi lapis baja dan muatan bahan peledak; proyektil ini menghasilkan daya hancur luar biasa setelah menembus baja penjelajah lawan."
 basic_heavy_battery: "Baterai Meriam Berat Dasar"
 basic_heavy_battery_desc: "Kubah meriam raksasa yang menampung laras-laras artileri masif di balik lapisan baja berat.\n\nMemasang modul §YBaterai Meriam Berat§! mendongkrak nilai §YSerangan Meriam Berat§! kapal, meningkatkan performa menghadapi §YKapal Utama§! musuh."
 improved_heavy_battery: "Baterai Meriam Berat yang Disempurnakan"
 improved_heavy_battery_desc: "Pendorong hidraulis mekanis mempercepat pengisian amunisi meriam berat sementara pintu kedap api otomatis meningkatkan standar keselamatan awak.\n\nMemasang modul §YBaterai Meriam Berat§! meningkatkan §YSerangan Meriam Berat§! kapal, meningkatkan performa menghadapi §YKapal Utama§! musuh."
 advanced_heavy_battery: "Baterai Meriam Berat Mutakhir"
 advanced_heavy_battery_desc: "Mekanisme peredam tolak balik yang disempurnakan dan kumparan penunda tembak meminimalkan turbulensi antar-proyektil di udara serta mendongkrak akurasi secara drastis.\n\nMemasang modul §YBaterai Meriam Berat§! meningkatkan §YSerangan Meriam Berat§! kapal, meningkatkan performa menghadapi §YKapal Utama§! musuh."
 basic_heavy_shell: "Proyektil Bertudung Penembus Baja"
 basic_heavy_shell_desc: "Dengan menyematkan tudung balistik khusus, proyektil meriam raksasa ini menjadi lebih aerodinamis sembari mempertahankan daya tembus bajanya yang dahsyat."
 improved_heavy_shell: "Proyektil Penembus Baja Super-Berat"
 improved_heavy_shell_desc: "Dengan bobot jauh melampaui satu ton, proyektil raksasa ini menghantam dengan daya rusak yang belum pernah ada sebelumnya dan menjadi ancaman mematikan bahkan bagi lapisan baja tertebal sekalipun."
 secondary_battery_advice_tt: "\n§YBaterai Sekunder§! memungkinkan §YKapal Penjelajah§! dan §YKapal Berat§! membidik §YKapal Tabir§! musuh sebagai sasaran sekunder sembari tetap melancarkan tembakan utama ke sasaran lain."
 basic_secondary_battery: "Baterai Sekunder Kasemat"
 basic_secondary_battery_desc: "Ditempatkan pada bukaan sisi lambung kapal, meriam kecil ini memberi kapal perlindungan dari kapal perang lincah lawan, namun memiliki sudut tembak yang terbatas.\n\nMemasang Modul §YBaterai Sekunder§! memberi §YKapal Penjelajah§!, §YKapal Induk§!, atau §YKapal Berat§! sedikit §YSerangan Meriam Ringan§! dan memungkinkannya membidik target kedua."
 improved_secondary_battery: "Baterai Sekunder Berkubah (Turret)"
 improved_secondary_battery_desc: "Dengan menempatkan meriam sekunder di dalam kubah bertenaga putar, mereka memperoleh sudut tembak yang jauh lebih luas meski menambah bobot kapal.\n\nMemasang Modul §YBaterai Sekunder§! memberi §YKapal Penjelajah§!, §YKapal Induk§!, atau §YKapal Berat§! sedikit §YSerangan Meriam Ringan§! dan memungkinkannya membidik target kedua."
 damage_control_1: "Latihan Pemadaman Kebakaran"
 damage_control_1_desc: "Setiap awak kapal perang, mulai dari Komandan hingga kelasi biasa, harus mampu bertindak cepat dalam melokalisasi dan memadamkan api yang berkobar di atas kapal."
 damage_control_2: "Saluran Pipa Pemadam Terpisah"
 damage_control_2_desc: "Dengan memisahkan jalur utama pipa pasokan air pemadam di sekeliling kapal, kemungkinan terjadinya satu tembakan musuh yang melumpuhkan total kemampuan pemadaman kapal menjadi sangat kecil."
 damage_control_3: "Pompa Darurat Bertenaga Diesel"
 damage_control_3_desc: "Jika pompa penguras air utama hanya bergantung pada listrik mesin utama kapal, satu hantaman ringan di ruang mesin dapat membuat kapal tidak mampu mengatasi kebocoran dan terancam tenggelam."
 fire_control_methods_1: "Tembakan Mengapit (Bracket Shooting)"
 fire_control_methods_1_desc: "Untuk mengenai sasaran, langkah pertama adalah 'mengapit' posisi kapal lawan dengan menembakkan beberapa meriam secara bertahap hingga percikan air jatuh di kedua sisi sasaran."
 fire_control_methods_2: "Tembakan Tangga (Ladder Shooting)"
 fire_control_methods_2_desc: "Alih-alih menembak melampaui sasaran dan kehilangan jejak percikan di balik kapal musuh, tembakan sengaja dijatuhkan sedikit di depan sasaran, lalu jarak selisih diukur secara saksama untuk mengunci jarak tembak akurat."
 fire_control_methods_3: "Pewarna Proyektil"
 fire_control_methods_3_desc: "Menambahkan kantong pewarna kimia pada proyektil akan mewarnai semburan air di sekeliling sasaran, memungkinkan beberapa kapal perang kawan menembak sasaran yang sama tanpa bingung membedakan percikan tembakan masing-masing."
 fuel_silos: "Penyimpanan Bahan Bakar"
 fuel_silos_desc: "Penyimpanan bahan bakar dalam volume masif memerlukan rangkaian tangki penampung, perpipaan, dan katup pengaman terpadu guna memastikan bahan bakar aman dan siap dialirkan kapan saja."
 fuel_refining: "Pemurnian Bahan Bakar I"
 fuel_refining_desc: "Kemajuan dalam perengkahan kimia memungkinkan perolehan bahan bakar ringan berkualitas tinggi yang lebih melimpah dari minyak mentah."
 fuel_refining2: "Pemurnian Bahan Bakar II"
 fuel_refining2_desc: "Perencanaan tata letak kilang yang lebih terpadu memangkas kebocoran dan pemborosan bahan bakar selama proses pemurnian."
 fuel_refining3: "Pemurnian Bahan Bakar III"
 fuel_refining3_desc: "Metode reklamasi yang disempurnakan memungkinkan pengolahan bahan bakar tambahan dari produk sampingan pemurnian."
 fuel_refining4: "Pemurnian Bahan Bakar IV"
 fuel_refining4_desc: "Perkembangan mutakhir dalam teknik kimia memungkinkan penyulingan bahan bakar dari sumber-sumber bahan baru."
 fuel_refining5: "Pemurnian Bahan Bakar V"
 fuel_refining5_desc: "Penerapan metode termutakhir dan tata letak optimal dalam konstruksi kilang mendongkrak kapasitas pemrosesan secara drastis sembari meminimalkan sisa terbuang."
 scout_plane1: "Pesawat Pengintai I"
 scout_plane1_desc: "Mengumpulkan intelijen pergerakan pasukan darat musuh dan melaporkan penyebaran armada laut lawan telah menjadi tugas pokok pesawat terbang sejak pengerahan pertamanya di Perang Besar, dan tetap menjadi misi yang sangat vital hingga kini."
 scout_plane2: "Pesawat Pengintai II"
 scout_plane2_desc: "Dengan mengembangkan pesawat khusus untuk pengawasan udara dan pengintaian jarak jauh, kita menjamin perolehan gambaran akurat mengenai niat dan kapabilitas lawan setiap saat."
