 ASSAULT_LABEL_TT: "Berfokus pada serangan langsung dan frontal dengan pasukan lapis baja."
 INFILTRATION_LABEL: "INFILTRASI"
 INFILTRATION_LABEL_TT: "Berfokus pada muslihat pengalihan dan strategi infanteri non-konvensional."
 DEEP_BATTLE_LABEL: "PERTEMPURAN MENDALAM"
 DEEP_BATTLE_LABEL_TT: "Meningkatkan bantuan dan kemampuan menyerang jauh ke dalam wilayah musuh."
 MASS_MOBILIZATION_LABEL: "MOBILISASI MASSA"
 MASS_MOBILIZATION_LABEL_TT: "Memaksimalkan perekrutan dan keunggulan kekuatan jumlah personel."
 FLEET_IN_BEING_DESC: "Armada tangguh yang berpusat di sekitar kapal tempur utama menjadikan kita kekuatan digdaya yang wajib disegani di lautan."
 TRADE_INTERDICTION_DESC: "Menghadapi lawan maritim yang lebih kuat, kita dapat berfokus menyandera armada mereka dan menghancurkan jalur pasokan untuk melumpuhkan mesin perang mereka."
 BASE_STRIKE_DESC: "Dengan fokus kuat pada kapal induk dan pesawat pendukungnya, tiada musuh yang berada di luar jangkauan kita, baik di darat maupun di lautan lepas."
 AIR_SUPERIORITY_DESC: "Pesawat tempur kita adalah tulang punggung angkatan udara; bertugas mempertahankan langit tanah air, mengawal pembom kawan, dan membersihkan ruang udara dari musuh bagi pasukan darat kita."
 BATTLEFIELD_SUPPORT_DESC: "Dengan meningkatkan sinergi antara pesawat bantuan udara dekat dan divisi darat, kita dapat meluluhlantakkan formasi musuh dengan perlindungan udara optimal."
 OPERATIONAL_INTEGRITY_DESC: "Pengebom taktis sangat fleksibel dan mampu menjalankan peran bantuan serangan darat maupun pengeboman reguler."
 STRATEGIC_DESTRUCTION_DESC: "Dengan membom pabrik-pabrik musuh, baik pada malam hari maupun siang hari yang lebih berisiko, kita dapat secara melumpuhkan kelangsungan mesin perang mereka."
