 special_forces_doctrine: "Doktrin Pasukan Khusus"
 special_forces_doctrine_folder: "Doktrin Pasukan Khusus"
 special_forces_doctrine_folder_desc: "Bagaimana pasukan khusus kita dilatih dan ditempa."
 MOUNTAINEERS_DOCTRINE_LABEL: "Pasukan Gunung"
 MARINES_DOCTRINE_LABEL: "Marinir"
 PARATROOPERS_DOCTRINE_LABEL: "Lintas Udara"
 MOUNTAINEERS_DOCTRINE_DESC: "Fokus militer yang kuat pada resimen yang terbiasa bertempur di medan ekstrem akan memberi kita keunggulan dalam bermanuver dan membendung musuh."
 MARINES_DOCTRINE_DESC: "Korps Marinir yang unggul memastikan tidak ada garis pantai musuh yang aman dari pendaratan kita. Marinir elit kita piawai bertempur di bawah hujan peluru dalam situasi paling berbahaya."
 PARATROOPERS_DOCTRINE_DESC: "Serbuan lintas udara adalah masa depan peperangan. Mengangkat korps penerjun payung menghadirkan sinergi sempurna antara kekuatan udara dan serbuan darat."
 RANGERS_DOCTRINE_LABEL: "Ranger"
 RANGERS_DOCTRINE_DESC: "Dengan kemampuan beroperasi dalam jumlah besar di kawasan berhutan lebat, pasukan kita mampu bermanuver dari sayap dan memperdaya pertahanan lawan."
 special_forces_mountaineers: "Angkat Korps Pasukan Gunung"
 special_forces_mountaineers_desc: "Lingkungan yang ganas dan pertempuran sengit menarik prajurit-prajurit paling tangguh ke jajaran pasukan elit kita. Mengukuhkan keutamaan mereka dalam filosofi doktrin memastikan kita terus memetik manfaat dari perekrutan prajurit-prajurit terbaik."
 special_forces_paratroopers: "Angkat Korps Pasukan Lintas Udara"
 special_forces_paratroopers_desc: "Tiada yang lebih menggetarkan jiwa selain pemandangan langit yang menggelap oleh ribuan pesawat angkut berisi pasukan lintas udara. Filosofi doktrin kita harus memanfaatkan efek kejut dan gentar yang ditimbulkan oleh penerjunan pasukan ini."
 special_forces_marines: "Angkat Korps Marinir"
 special_forces_marines_desc: "Korps Marinir bertugas di tempat di mana pasukan lain gentar melangkah. Dari pesisir tanah air hingga pantai samudra jauh, para ahli ini unggul dalam infiltrasi dan pertempuran amfibi. Jangkauan luas dan filosofi fleksibel harus menjadi inti doktrin militer kita."
 special_forces_rangers: "Angkat Korps Ranger"
 special_forces_rangers_desc: "Infanteri ringan adalah kunci keberhasilan kita. Tradisi penembak jitu dan taktik penyusupan gerilya harus menjadi fondasi utama dalam membangun formasi elit kita."
 ski_troops: "Spesialis Cuaca Dingin"
 ski_troops_desc: "Para spesialis cuaca dingin sangat vital bagi taktik medan perang kita. Dengan mengakui keberadaan mereka secara resmi dalam organisasi militer kita, kita dapat mengalokasikan sumber daya dan pelatihan guna mengangkat kemampuan mereka lebih tinggi lagi."
 special_forces_recon: "Intelijen Medan Tempur"
 special_forces_recon_desc: "Resimen elit kita memperoleh manfaat besar dari kontra-intelijen dan kewaspadaan medan tempur yang tak tertandingi. Pelatihan tambahan dipastikan akan semakin melipatgandakan ketajaman mereka."
 gwtank: "Tank Perang Besar"
 basic_light_tank: "Tank Ringan I"
 armored_car1: "$gw_armored_car_equipment$"
 armored_car2: "$armored_car_equipment_1$"
 armored_car3: "$armored_car_equipment_2$"
 mountaineers_combat_1: "Mempertahankan Garis"
 mountaineers_combat_1_desc: "Pasukan elit kita harus memusatkan upaya mereka untuk mempertahankan area yang menjadi spesialisasi mereka. Paduan taktik penyergapan dan organisasi resimen yang disempurnakan memastikan pasukan khusus kita menyajikan pertahanan mendalam yang kokoh terhadap serangan musuh."
 mountaineers_combat_2: "Artileri Gunung"
 mountaineers_combat_2_desc: "Resimen Artileri Gunung adalah pasukan khusus yang dirancang untuk memberikan bantuan tembakan jarak jauh yang cepat bagi divisi elit kita di medan terjal. Kehadiran mereka secara signifikan memperkuat daya tempur pasukan khusus kita."
 mountaineers_combat_3: "Pelatihan Tempur Gabungan"
 mountaineers_combat_3_desc: "Meskipun resimen elit kita beroperasi secara mandiri, melengkapi kurikulum pelatihan mereka dengan fokus pada operasi tempur gabungan akan meningkatkan daya guna mereka di kancah pertempuran."
 mountaineers_keystone_1: "Tulang Punggung Angkatan Bersenjata"
 mountaineers_keystone_1_desc: "Keberhasilan pasukan khusus elit kita menuntut penataan ulang filosofi militer kita di seputar kehadiran dan peran sentral mereka."
 mountaineers_keystone_2: "Instruktur Bersama"
 mountaineers_keystone_2_desc: "Dengan pengetahuan luas yang telah dihimpun oleh pasukan gunung kita, sungguh keliru bila tidak memanfaatkannya di kecabangan pasukan khusus lainnya. Kita akan memberlakukan rotasi instruktur demi memperkaya pengetahuan kelembagaan secara menyeluruh."
 paras_dispersed_drop: "Pengintaian dan Sabotase"
 paras_dispersed_drop_desc: "Karakteristik operasi kita menuntut pasukan lintas udara untuk berspesialisasi dalam penerjunan yang tersebar luas, memungkinkan sabotase skala besar dilancarkan bahkan sebelum musuh menyadari keberadaan kita."
 paras_combat_drop: "Penyusupan Tempur Langsung"
 paras_combat_drop_desc: "Kendati berbahaya, melatih pasukan elit kita dalam teknik penerjunan paksa langsung ke garis depan dapat memberi keunggulan tempur yang luar biasa bila dipadukan dengan serbuan konvensional."
 SF_PARAS_combat_effect_tt: "Divisi musuh di negara bagian tempat kita melakukan §HPenerjunan Payung§! akan mengalami penurunan §HOrganisasi§! saat ini.\n\n$PARA_EFFECT_TIMER$"
 SF_PARAS_sabotage_effect_tt: "Negara bagian yang dikuasai musuh tempat kita melakukan §HPenerjunan Payung§! akan mengalami kerusakan pada §HPabrik Militer§!, §HPabrik Sipil§!, dan §HInfrastruktur§!.\n\n$PARA_EFFECT_TIMER$"
 PARA_EFFECT_TIMER: "Efek ini dapat terjadi sekali per negara bagian setiap §H30§! hari."
 paras_airborne_light_armor: "Lapis Baja Lintas Udara"
 paras_airborne_light_armor_desc: "Tank ringan tertentu dapat diadaptasi untuk penerjunan lintas udara menggunakan pesawat layang berkapasitas berat. Metode penyusupan tempur inovatif ini mungkin sangat spesifik, namun membuka peluang-peluang taktis baru bagi kita."
 paras_bonus_2: "Korps Angkut Udara Strategis"
 paras_bonus_2_desc: "Membentuk badan administrasi angkut udara khusus memungkinkan kita memodifikasi pesawat kargo secara lebih optimal demi tujuan spesifik penerjunan lintas udara."
 paras_combat_1: "Sinyal Perhubungan Lintas Udara"
 paras_combat_1_desc: "Tiada yang menandingi jalur komunikasi yang sempurna dengan pasukan kita di garis belakang musuh. Melatih kompi sinyal untuk penerjunan lintas udara akan menjaga kelangsungan komunikasi penting ini, bahkan dalam kondisi terburuk sekalipun."
 paras_combat_2: "Detasemen Medis Lintas Udara"
 paras_combat_2_desc: "Skala operasi lintas udara kita telah meluas sedemikian rupa sehingga perlengkapan medis esensial pun harus dipersiapkan untuk dapat diterjunkan bersama pasukan dari udara."
 paras_bonus_1: "Pelatihan Navigasi Tingkat Lanjut"
 paras_bonus_1_desc: "Penerjunan terbaik sekalipun dapat meleset dari sasaran pendaratan. Kita harus memastikan bahwa pasukan kita terlatih dengan sangat baik dalam navigasi darat secara mandiri."
 paras_keystone_1: "Terbaik dari yang Terbaik"
 paras_keystone_1_desc: "Hanya prajurit veteran yang paling kenyang makan asam garam pertempuran yang dapat dipertimbangkan untuk batalion lintas udara kita. Kendati hal ini mempersempit jumlah calon rekrutan, hasilnya pasti akan terbayar berlipat ganda di medan tempur."
 paras_keystone_2: "Tulang Punggung Angkatan Bersenjata"
 paras_keystone_2_desc: "Mulai saat ini, angkatan bersenjata kita akan dibangun di atas fondasi kemahiran dan pelatihan pasukan lintas udara. Angkasa akan menggelap saat mereka datang, dan musuh akan merasakan kengerian yang nyata."
 rangers_jaegers_training: "Memadukan Tradisi Jaeger"
 rangers_jaegers_training_desc: "Infanteri ringan yang terlatih bertempur di Hutan Belantara, hidup dari apa yang disediakan oleh alam sekitar, ahli dalam memasang perangkap, menyergap, dan merupakan penembak runduk yang ulung."
 rangers_jungle_training: "Pelatihan Hutan Rimba Ranger"
 rangers_jungle_training_desc: "Piawai tidak hanya dalam bertahan hidup, tetapi juga bertempur di rimba paling lebat di tengah panasnya iklim tropis, para ranger ini adalah kunci utama untuk beroperasi di area yang tak berani dimasuki pasukan biasa."
 rangers_guerilla_doctrine: "Gerilyawan Hutan"
 rangers_guerilla_doctrine_desc: "Inisiatif dan mobilitas adalah modal utama untuk dapat menggempur musuh. Para ranger kita harus sangat mahir dalam menggunakan muslihat silap mata dan serangan kejutan."
 rangers_recon_terrain_training: "Penguasaan Medan Ranger Pengintai"
 rangers_recon_terrain_training_desc: "Prasyarat mutlak taktik ranger adalah kemampuan melintasi medan paling terjal sekalipun guna memukul musuh di tempat yang sama sekali tak mereka sangka."
 rangers_fire_support_integration: "Integrasi Bantuan Tembakan"
 rangers_fire_support_integration_desc: "Integrasi perwira pengamat depan dengan perangkat sinyal portabel ke dalam tim ranger memastikan bahkan unit kecil yang terisolasi sekalipun tidak perlu bertempur tanpa perlindungan tembakan artileri."
 rangers_urban_combat: "Keahlian Tempur Perkotaan Ranger"
 rangers_urban_combat_desc: "Pertempuran di hutan lebat dan di perkotaan memiliki kesamaan tertentu, dengan jarak kontak tembak yang sangat dekat dan jarak pandang terbatas. Pasukan yang mahir di satu lingkungan dapat dilatih untuk beradaptasi dengan cepat di lingkungan lainnya."
 elite_rangers_doctrine: "Ranger Elit"
 elite_rangers_doctrine_desc: "Para Ranger adalah kebanggaan angkatan bersenjata kita. Kita harus terus merekrut hanya yang terbaik, dan mendorong mereka untuk meraih pencapaian yang lebih gemilang."
 rangers_backbone_doctrine: "Spesialisasi Infanteri Ringan"
 rangers_backbone_doctrine_desc: "Keahlian yang diperoleh para spesialis hutan rimba kita adalah modal berharga yang dapat dipetik manfaatnya oleh seluruh pasukan elit kita. Kita harus menyebarkan pengetahuan ini ke seluruh kecabangan pasukan ringan dan elit."
