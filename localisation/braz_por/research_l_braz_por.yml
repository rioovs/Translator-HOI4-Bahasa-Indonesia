 mtgnavalfolder: "Laut"
 mtgnavalfolder_desc: "Kapal perang dan kapal selam. Riset modul baru untuk menyesuaikan kapal Anda."
 mtgnavalsupportfolder: "Bantuan Laut"
 mtgnavalsupportfolder_desc: "Persenjataan armada laut dan perlengkapan spesialis laut. Riset modul baru untuk menyesuaikan kapal Anda."
 naval_doctrine_folder: "Doktrin Laut"
 naval_doctrine_folder_desc: "Doktrin laut, cara bertempur Angkatan Laut Anda."
 air_techs_folder: "Udara"
 air_techs_folder_desc: "Pesawat dan variannya."
 air_doctrine_folder: "Doktrin Udara"
 air_doctrine_folder_desc: "Doktrin udara, cara bertempur Angkatan Udara Anda."
 click_to_open_doctrine: "§GKlik§! untuk membuka doktrin"
 industry_folder: "Industri"
 industry: "Industri"
 industry_folder_desc: "Industri dan produksi."
 electronics_folder: "Teknik"
 electronics_folder_desc: "Teknik rekayasa, radar, enkripsi, dan riset teknologi mutakhir."
 secret_weapons_folder: "Senjata Rahasia"
 secret_weapons_folder_desc: "Senjata mukjizat, produk sains eksperimental mutakhir."
 mobile_warfare: "Peperangan Bergerak"
 mobile_warfare_desc: "Peperangan Bergerak berfokus pada kecepatan dan manuver untuk memutus dan mengacaukan pasukan musuh.\n\n"
 delay: "Penundaan"
 delay_desc: "Bahkan ketika pertempuran mustahil dimenangkan, memperlambat gerak maju pasukan penyerang dengan penyergapan dan taktik penundaan akan sangat menguntungkan."
 elastic_defence: "Pertahanan Elastis"
 elastic_defence_desc: "Alih-alih memusatkan seluruh kekuatan di garis depan, pertahanan elastis menciptakan lapisan pertahanan yang 'lebih dalam' sehingga memberi pihak bertahan lebih banyak waktu untuk bereaksi dan menyerang balik selagi penyerang terpencar dan terhambat."
 mobile_infantry: "Infanteri Bergerak"
 mobile_infantry_desc: "Infanteri reguler kerap kali terlalu lambat untuk mengimbangi, bereaksi terhadap, atau melarikan diri dari pasukan Lapis Baja yang bergerak cepat. Jawabannya adalah berfokus pada Infanteri Bermotor atau Mekanis yang dapat mengimbangi tempo peperangan modern.\n\n"
 mass_motorization: "Motorisasi Massal"
 mass_motorization_desc: "Fokus yang lebih besar lagi pada pasukan Bermotor."
 mechanised_offensive: "Ofensif Mekanis"
 mechanised_offensive_desc: "Pasukan bermotor memang bagus, namun untuk memimpin serangan ofensif kita membutuhkan Infanteri yang mampu melaju ke kancah pertempuran di dalam kendaraan angkut lapis baja yang melindungi mereka sekaligus mengangkut senjata berat."
 armored_spearhead: "Ujung Tombak Lapis Baja"
 armored_spearhead_desc: "Untuk memanfaatkan Tank hingga potensi penuhnya, mereka tidak boleh terikat membantu Infanteri. Sebaliknya, mereka harus dibentuk menjadi unit-unit independen bergerak cepat yang mampu menjadi ujung tombak penyerangan.\n\n"
 schwerpunk: "Schwerpunkt"
 schwerpunk_desc: "Dalam operasi apa pun, Schwerpunkt, atau Titik Fokus, harus diidentifikasi dan kekuatan maksimum harus dipusatkan untuk meraih kemenangan di titik tersebut."
 blitzkrieg: "Blitzkrieg"
 blitzkrieg_desc: "Blitzkrieg merujuk pada strategi pasukan Lapis Baja bergerak cepat yang didukung oleh Infanteri Bergerak dan bantuan udara untuk menerobos garis musuh guna mengacaukan dan mengepung mereka."
 kampfgruppe: "Kampfgruppe"
 kampfgruppe_desc: "Kampfgruppe merupakan formasi ad hoc yang dibentuk secara khusus untuk melaksanakan tugas tertentu."
 firebrigades: "Pasukan Pemadam Kebakaran"
 firebrigades_desc: "'Pasukan pemadam kebakaran' adalah pasukan yang dihimpun secara tergesa-gesa untuk merespons penerobosan musuh atau masalah krusial lainnya.\n\n"
 backhand_blow: "Pukulan Balik"
 backhand_blow_desc: "Alih-alih bertarung memperebutkan setiap jengkal tanah, penetrasi musuh sebagian besar dihindari sampai mereka merentangkan barisan mereka terlalu jauh, di mana pada saat itulah mereka dapat diputus dan dihancurkan melalui serangan balasan."
 modern_blitzkrieg: "Blitzkrieg Modern"
 modern_blitzkrieg_desc: "Puncak dari Peperangan Bergerak, Blitzkrieg Modern memadukan seluruh kemajuan teknologi mutakhir dan pelajaran yang dipetik dari doktrin-doktrin sebelumnya."
 volkssturm: "Volkssturm"
 volkssturm_desc: "Volkssturm, atau Milisi Rakyat, beranggotakan para pria yang terlalu tua, terlalu muda, atau dinilai tidak memenuhi syarat untuk dinas militer reguler.\n\n"
 nd_conscription: "Wajib Militer Non-Diskriminatif"
 nd_conscription_desc: "Bahkan mereka yang cacat dan terluka harus direkrut; tidak boleh ada lagi yang disebut sebagai warga sipil."
 werwolf_guerillas: "Gerilya Werwolf"
 werwolf_guerillas_desc: "Werwolf merupakan kelompok perlawanan rahasia Jerman yang direncanakan untuk terus berjuang melawan kekuatan pendudukan saat perang telah kalah."
 superior_firepower: "Daya Tembak Unggul"
 superior_firepower_desc: "Doktrin ini menekankan penghujanan peluru meriam, bukan nyawa manusia, ke arah musuh. Tenaga kerja kita sangat berharga, sedangkan peluru sangat murah.\n\n"
 sup_delay: "Penundaan"
 sup_delay_desc: "Bahkan ketika pertempuran mustahil dimenangkan, memperlambat gerak maju pasukan penyerang dengan penyergapan dan taktik penundaan akan sangat menguntungkan."
 mobile_defence: "Pertahanan Bergerak"
 mobile_defence_desc: "Pasukan bergerak dapat dikerahkan untuk memperkuat pertahanan di mana pun musuh melancarkan serangan."
 intergrated_support: "Bantuan Terintegrasi"
 intergrated_support_desc: "Mengintegrasikan pasukan bantuan secara erat dengan pasukan tempur menghasilkan divisi yang jauh lebih perkasa saat menyerang.\n\n"
 regimental_combat_teams: "Tim Tempur Resimen"
 regimental_combat_teams_desc: "Tim tempur resimen adalah resimen Infanteri yang dipadukan secara erat dengan unit-unit bantuan seperti Artileri, Tank, dan elemen Pengintai untuk membentuk unit mandiri kecil yang memberikan fleksibilitas lebih besar saat menyerang."
 dispersed_support: "Bantuan Tersebar"
 dispersed_support_desc: "Dengan menyebarkan unit Bantuan, mereka dapat menjangkau area yang lebih luas sembari tetap berada di luar garis tembakan musuh, sehingga menghasilkan divisi dengan pertahanan yang lebih tangguh.\n\n"
 overwhelming_firepower: "Daya Tembak Luapan"
 overwhelming_firepower_desc: "Mengerahkan seluruh unit bantuan yang tersedia guna menghasilkan daya tembak dahsyat dapat melunakkan sasaran secara signifikan, atau lebih hebat lagi, merusak total rencana penyerang."
 sup_mechanized_offensive: "Ofensif Mekanis"
 sup_mechanized_offensive_desc: "Pasukan bermotor memang bagus, namun untuk memimpin serangan ofensif kita membutuhkan Infanteri yang mampu melaju ke kancah pertempuran di dalam kendaraan angkut lapis baja yang melindungi mereka sekaligus mengangkut senjata berat."
 concentrated_fire_plans: "Rencana Tembakan Terpusat"
 concentrated_fire_plans_desc: "Dengan memusatkan tembakan berbagai baterai meriam menjadi pemboman terkoordinasi, kerusakan yang jauh lebih besar dapat ditimbulkan pada musuh.\n\n"
 combined_arms: "Tempur Gabungan"
 combined_arms_desc: "Lapis Baja, Infanteri, dan unit Bantuan yang bekerja sama dalam tim terorganisasi rapi terbukti jauh lebih efektif daripada pasukan yang sama jika digunakan secara terpisah."
 tactical_control: "Kendali Taktis"
 tactical_control_desc: "Para perwira di posisi depan yang menguasai operasi tempur gabungan kini dapat mengendalikan langsung operasi seluruh kecabangan militer."
 air_land_battle: "Pertempuran Udara-Darat"
 air_land_battle_desc: "Dengan pasukan darat yang telah beroperasi dalam formasi tempur gabungan, Pertempuran Udara-Darat kini turut menekankan koordinasi erat antara pasukan darat dan angkatan udara, menyatukan medan tempur Udara dan Darat menjadi satu kesatuan utuh tanpa cela."
 centralized_fire_control: "Kendali Tembakan Terpusat"
 centralized_fire_control_desc: "Sistem Kendali Tembakan Terpusat memungkinkan seluruh permintaan bantuan artileri dievaluasi di satu lokasi, dan jika perlu, seluruh daya tembak divisi dapat dipusatkan ke satu target alih-alih unit hanya bisa meminta bantuan tembakan dari artileri yang ditugaskan kepada mereka.\n\n"
 forward_observers: "Pengamat Depan"
 forward_observers_desc: "Pengamat Depan menempati posisi di mana mereka dapat mengamati secara langsung akurasi dan dampak tembakan artileri, lalu meneruskan hasilnya kembali ke meriam untuk koreksi tembakan."
 advanced_firebases: "Pangkalan Tembak Lanjutan"
 advanced_firebases_desc: "Kubu-kubu artileri dapat ditempatkan di dekat garis depan dalam pangkalan-pangkalan berbenteng guna memberikan bantuan semaksimal mungkin bagi pasukan yang sedang bergerak maju."
 shock_and_awe: "Kejut dan Gentar"
 shock_and_awe_desc: "Pemusatan daya tembak secara masif akan mendatangkan tingkat Kejut dan Gentar yang luar biasa dahsyat terhadap musuh dalam waktu cepat untuk melumpuhkan kehendak mereka dalam melanjutkan perang."
 grand_battle_plan: "Rencana Pertempuran Akbar"
 grand_battle_plan_desc: "Perencanaan matang dan persiapan ekstensif sebelum terjun ke pertempuran adalah kunci mutlak menuju kemenangan.\n\n"
 trench_warfare: "Peperangan Parit"
 trench_warfare_desc: "Sekop kerap kali menjadi senjata terbaik bagi infanteri. Unit-unit tempur mempelajari pentingnya menggali parit perlindungan di setiap posisi yang mereka duduki."
 prepared_defense: "Pertahanan Terencana"
 prepared_defense_desc: "Sistem benteng lapangan yang lebih luas dan terstruktur secara signifikan meningkatkan pertahanan unit."
 grand_assault: "Serbuan Akbar"
 grand_assault_desc: "Begitu pasukan yang memadai telah dihimpun dan tujuan-tujuan mereka telah direncanakan dengan saksama, serbuan berkekuatan penuh pasti akan menghancurkan musuh."
 grand_mechanized_offensive: "Ofensif Mekanis"
 grand_mechanized_offensive_desc: "Pasukan bermotor memang bagus, namun untuk memimpin serangan ofensif kita membutuhkan Infanteri yang mampu melaju ke kancah pertempuran di dalam kendaraan angkut lapis baja yang melindungi mereka sekaligus mengangkut senjata berat.\n\n"
 assault_concentration: "Pemusatan Serbuan"
 assault_concentration_desc: "Sebelum penyerangan, elemen-elemen terdepan dipersiapkan secara cermat dan ditempatkan di posisi depan, memastikan kekuatan maksimal dapat dilancarkan pada saat-saat awal pembuka."
 branch_interoperation: "Inter-Operasi Antar-Kecabangan"
 branch_interoperation_desc: "Peningkatan koordinasi antar-kecabangan angkatan bersenjata memungkinkan mereka bekerja jauh lebih padu dalam operasi tempur gabungan."
 assault_breakthrough: "Penerobosan Serbuan"
 assault_breakthrough_desc: "Alih-alih melancarkan serbuan akbar di sepanjang garis depan, memusatkan serangan hanya pada satu atau beberapa titik garis musuh untuk menciptakan penerobosan di sana akan jauh lebih efektif."
 central_planning: "Perencanaan Terpusat"
 central_planning_desc: "Para perwira dari seluruh kecabangan kini berkontribusi dalam perencanaan suatu operasi untuk memastikan operasi berjalan dengan efisiensi puncak."
 c3i_theory: "C3I"
 c3i_theory_desc: "Perwira staf yang efektif memastikan kelancaran Komando, Kendali, Komunikasi & Intelijen (C3I) antara perwira komando dan unit-unit di bawah kendalinya."
 infantry_offensive: "Ofensif Infanteri"
 infantry_offensive_desc: "Semangat ofensif infanteri merupakan elemen penentu dalam memenangkan pertempuran. Infanteri kita harus memimpin di garis depan.\n\n"
 armored_operations: "Operasi Lapis Baja"
 armored_operations_desc: "Tank dan kendaraan lapis baja lainnya sangat berguna untuk mengantarkan infanteri ke medan laga serta memberikan bantuan tembakan langsung dalam pertempuran."
 infiltration_assault: "Serbuan Infiltrasi"
 infiltration_assault_desc: "Pada langkah pembuka serangan, infanteri harus menargetkan titik-titik lemah di garis musuh untuk melewati dan mengisolasi bagian-bagian yang dijaga ketat, yang kemudian dapat disapu bersih oleh sisa pasukan penyerang kita."
 night_assault_tactics: "Taktik Serbuan Malam"
 night_assault_tactics_desc: "Prajurit yang terbiasa bergerak dan bertempur di malam hari dapat menempatkan diri mereka terlebih dahulu sebelum menyerang, atau menyerang langsung pasukan musuh yang lengah."
 attritional_containment: "Pembendungan Atrisional"
 attritional_containment_desc: "Jika kita tidak mampu melancarkan serangan besar untuk merebut posisi musuh, posisi tersebut harus terus dihujani serangan-serangan kecil tanpa henti guna menimbulkan korban dan mencegah musuh melancarkan serangannya sendiri."
 infiltration_in_depth: "Infiltrasi Mendalam"
 infiltration_in_depth_desc: "Pasukan kita kini dilatih untuk menyusup melewati dan mengisolasi titik-titik kuat musuh hingga kedalaman yang jauh lebih besar; idealnya, pasukan serbu kita tidak boleh berhenti hingga mencapai area belakang musuh dan memutus total pasukan mereka."
 mass_assault: "Serangan Massa"
 mass_assault_desc: "Senjata 'sempurna' dinilai terlalu berlebihan, sejumlah besar senjata yang 'cukup baik' adalah jalan sejati menuju kemenangan!\n\n"
 pocket_defence: "Pertahanan Kantong"
 pocket_defence_desc: "Ada kemungkinan saat bertahan, pasukan kita terperangkap dalam kantong kepungan. Dalam situasi ini, mereka hanya perlu bertahan gigih hingga serangan balasan tiba untuk membebaskan mereka."
 defence_in_depth: "Pertahanan Berlapis"
 defence_in_depth_desc: "Dengan memberikan perlawanan yang relatif ringan dan untuk sementara melepaskan wilayah, kita menukar ruang dengan waktu dan membiarkan pasukan penyerang kelelahan sebelum kita melancarkan serangan balik."
 large_front_operations: "Operasi Garis Depan Luas"
 large_front_operations_desc: "Pertempuran di garis depan yang luas memerlukan koordinasi upaya banyak unit di jarak yang jauh: pada tingkat operasional, bukan hanya taktis.\n\n"
 deep_operations: "Operasi Mendalam"
 deep_operations_desc: "Konsep Operasi Mendalam, atau Pertempuran Mendalam, bertujuan menerobos garis pertahanan musuh di banyak titik sekaligus dan menghancurkan cadangan operasional mereka, kedalaman operasional mereka, serta menduduki kedalaman strategis mereka sebanyak mungkin."
 operational_concentration: "Pemusatan Operasional"
 operational_concentration_desc: "Kunci dari setiap tindakan militer adalah keunggulan lokal yang mutlak. Tanpa harus unggul mutlak di sepanjang garis depan, ini dilakukan dengan melemahkan bagian-bagian front tertentu guna memusatkan pasukan di tempat yang diperlukan daripada berusaha kuat di mana-mana."
 vast_offensives: "Ofensif Raksasa"
 vast_offensives_desc: "Jika suatu penerobosan dapat dicapai, hal itu harus dieksploitasi sekuat mungkin: Ofensif raksasa yang menerobos garis musuh sedalam mungkin akan membuat pertahanan front mereka menjadi jauh lebih sulit, mustahil, atau bahkan tidak relevan."
 breakthrough_priority: "Prioritas Penerobosan"
 breakthrough_priority_desc: "Mengembangkan prinsip Pemusatan Operasional, seluruh kebutuhan front ditundukkan demi kebutuhan memusatkan kekuatan untuk Penerobosan. Kekalahan lokal tidak ada artinya dibandingkan dengan melancarkan pukulan yang menentukan."
 mechanized_wave: "Gelombang Mekanis"
 mechanized_wave_desc: "Pasukan mekanis sangat ideal untuk melancarkan gerak maju kilat yang diperlukan guna mengeksploitasi Penerobosan secara tuntas, baik untuk mendukung pasukan Lapis Baja maupun mengamankan sayap dari celah penerobosan."
 continuous_offensive: "Ofensif Berkelanjutan"
 continuous_offensive_desc: "Meskipun Penerobosan yang dieksploitasi dengan baik sering kali sangat efektif, cepat atau lambat pihak penyerang akan kelelahan dan pihak bertahan dapat menata ulang serta membentuk garis pertahanan baru. Namun, dengan cadangan yang memadai dan organisasi yang tepat, ofensif dapat dilanjutkan ke kedalaman yang jauh lebih besar dengan akibat kehancuran telak bagi musuh."
 human_wave_offensive: "Serangan Gelombang Manusia"
 human_wave_offensive_desc: "Serangan Gelombang Manusia adalah taktik infanteri di mana penyerang melancarkan serbuan frontal dengan formasi infanteri yang dipadatkan secara rapat ke garis musuh, dengan tujuan melindas para pembela melalui pertempuran jarak dekat."
 human_infantry_offensive: "Ofensif Infanteri"
 human_infantry_offensive_desc: "Semangat ofensif infanteri merupakan elemen penentu dalam memenangkan pertempuran. Infanteri kita harus memimpin di garis depan."
 large_front_offensive: "Ofensif Garis Depan Lebar"
 large_front_offensive_desc: "Dengan melancarkan, atau mengancamkan, Serangan Gelombang Manusia di berbagai area front sekaligus, kita dapat mencegah musuh memusatkan daya tembaknya terhadap satu serangan tunggal."
 peoples_army: "Tentara Rakyat"
 peoples_army_desc: "Tentara Rakyat meyakini keunggulan manusia di atas senjata, dengan motivasi luhur yang mengompensasi ketertinggalan teknologi, serta menikmati dukungan luas dari rakyat sipil.\n\n"
 guerilla_warfare: "Perang Gerilya"
 guerilla_warfare_desc: "Musuh maju, kita mundur; musuh berkemah, kita ganggu; musuh letih, kita serang; musuh mundur, kita kejar."
 infantry_weapons2: "Perlengkapan Infanteri Tingkat Lanjut I"
 infantry_weapons2_desc: "Senjata perorangan dan senjata kelompok untuk infanteri serta berbagai perlengkapan lain yang dibutuhkan seorang prajurit. Model senjata yang ditingkatkan dan peralatan yang lebih terspesialisasi."
 improved_infantry_weapons_2: "Perlengkapan Infanteri Tingkat Lanjut II"
 improved_infantry_weapons_2_desc: "Senjata perorangan dan senjata kelompok untuk infanteri serta berbagai perlengkapan lain yang dibutuhkan seorang prajurit. Model senjata yang ditingkatkan dan peralatan yang lebih terspesialisasi."
 advanced_infantry_weapons2: "Perlengkapan Infanteri Tingkat Lanjut III"
 advanced_infantry_weapons2_desc: "Senjata perorangan dan senjata kelompok untuk infanteri serta berbagai perlengkapan lain yang dibutuhkan seorang prajurit. Dimodernisasi lebih lanjut mencakup Senapan Serbu perorangan dan roket anti-tank. Peningkatan ketersediaan senjata yang sebelumnya hanya didistribusikan secara terbatas."
 infantry_at: "Anti-Tank Infanteri I"
 infantry_at_desc: "Mempersenjatai unit infanteri kita dengan senapan anti-tank akan memungkinkan mereka melumpuhkan kendaraan lapis baja ringan sembari mempertahankan mobilitas."
 infantry_at2: "Anti-Tank Infanteri II"
 infantry_at2_desc: "Agar infanteri dapat menghadapi unit lapis baja yang lebih berat secara efektif, senjata anti-tank berdaya ledak tinggi (HEAT) harus dibuat lebih kecil dan lebih ringan."
 support_weapons: "Senjata Bantuan I"
 support_weapons_desc: "Senjata otomatis menjadi semakin portabel. Senapan submesin telah terbukti efektif dan pengembangan senjata bantuan genggam harus terus dilanjutkan."
 support_weapons2: "Senjata Bantuan II"
 support_weapons2_desc: "Pengembangan senjata otomatis yang memadukan karakteristik senapan mesin ringan dan berat memberikan fleksibilitas dalam cara infanteri kita menggunakan perlengkapannya."
 support_weapons3: "Senjata Bantuan III"
 support_weapons3_desc: "Sembari mempertahankan dan meningkatkan keandalan senapan mesin, kita juga dapat bereksperimen dengan laju tembak yang lebih tinggi guna memastikan daya mematikan dari rentetan peluru yang terus-menerus."
 support_weapons4: "Senjata Bantuan IV"
 support_weapons4_desc: "Dengan semakin meningkatnya penggunaan senapan serbu, pengembangan senjata otomatis yang andal dan dapat digunakan di lingkungan mana pun oleh semua prajurit merupakan prioritas mutlak bagi tentara modern."
 paratroopers: "Pasukan Lintas Udara I"
 paratroopers_desc: "Dengan memasukkan pasukan lintas udara ke dalam tentara kita, kita dapat melakukan penerobosan paksa dan menempatkan pasukan kunci di area yang sebelumnya tak terjangkau, membuka peluang-peluang taktis baru."
 paratroopers2: "Pasukan Lintas Udara II"
 paratroopers2_desc: "Beralih dari operasi skala kecil dengan segelintir penerjun payung ke divisi lintas udara yang lebih besar membuka jalan bagi pendaratan lintas udara masif, menjadikan pasukan ini bukan sekadar hal baru melainkan bagian alami dari peperangan."
 paratroopers3: "Pasukan Lintas Udara III"
 paratroopers3_desc: "Belajar menyesuaikan operasi penerjunan payung dengan cuaca, membakukan perlengkapan seperti sepatu bot terjun, dan pelatihan spesialisasi yang diperluas akan meminimalkan kebingungan serta risiko dalam misi-misi berbahaya ini."
 marines: "Marinir I"
 marines_desc: "Pasukan yang berspesialisasi dalam peperangan amfibi menjadi semakin tak tergantikan. Metode dan peralatan seadanya ditinggalkan seiring infanteri laut kita didukung oleh kapal pendarat khusus dan pelatihan mendalam."
 marines2: "Marinir II"
 marines2_desc: "Peperangan amfibi membutuhkan inovasi tanpa henti. Dukungan logistik yang disempurnakan dan pelabuhan apung portabel dapat memungkinkan marinir kita melakukan pendaratan yang tadinya mustahil dilakukan."
 marines3: "Marinir III"
 marines3_desc: "Marinir dapat menjadi lebih dari sekadar infanteri amfibi. Di masa depan, korps marinir kita akan menjadi salah satu pasukan khusus yang paling disiplin dan terorganisasi."
 tech_mountaineers: "Infanteri Gunung I"
 tech_mountaineers_desc: "Pertempuran di pegunungan menghadapkan pasukan pada banyak mara bahaya, namun terkadang tak dapat dihindari. Kita dapat meminimalkan risiko ini dengan membekali prajurit kita pelatihan khusus untuk lingkungan ekstrem ini."
 tech_mountaineers2: "Infanteri Gunung II"
 tech_mountaineers2_desc: "Lebih dari sekadar bertahan hidup, pasukan kita dapat dilatih untuk memanfaatkan kontur gunung demi keuntungan taktis. Dengan perlengkapan ringan dan keledai pengangkut, mereka dapat bermanuver di medan ini jauh lebih lincah dibanding infanteri lain."
 tech_mountaineers3: "Infanteri Gunung III"
 tech_mountaineers3_desc: "Mempersiapkan diri untuk misi pegunungan paling berat di ketinggian ekstrem dan suhu beku akan menuntut pelatihan luar biasa dan kedisiplinan baja dari pasukan gunung kita."
 rangers_tech: "Ranger I"
 rangers_tech_desc: "Dengan berspesialisasi dalam pertempuran hutan rimba, melatih infanteri ringan kita beradaptasi dengan medan dan vegetasi lebat, kita dapat menghemat pasukan dalam bertahan, atau bahkan menerobos garis musuh di tempat yang paling tak mereka duga."
 rangers_tech2: "Ranger II"
 rangers_tech2_desc: "Mengerahkan para spesialis hutan rimba secara massal alih-alih sebagai unit pengintai kecil memberi kita peluang untuk melancarkan serbuan masif terhadap sektor-sektor musuh yang dijaga lemah."
 rangers_tech3: "Ranger III"
 rangers_tech3_desc: "Beroperasi di medan berat membutuhkan perlengkapan khusus dan metode pelatihan khusus. Kita harus memastikan pasukan kita diperlengkapi dengan sarana mutakhir dan dilatih menggunakan metode terbaru."
 tech_special_forces: "Pasukan Khusus"
 tech_special_forces_desc: "Pertempuran non-konvensional membutuhkan pelatihan spesialis. Kita harus memastikan pasukan kita siap dan mampu beradaptasi dengan kondisi yang paling keras sekalipun."
 advanced_special_forces: "Pelatihan Pasukan Khusus Lanjutan"
 advanced_special_forces_desc: "Dengan pelatihan ekstensif, kita dapat memastikan bahwa pasukan khusus kita mampu berkinerja jauh melampaui kemampuan prajurit biasa."
 improved_special_forces: "Perluasan Program Pasukan Khusus"
 improved_special_forces_desc: "Pasukan khusus mampu menjalankan misi-misi yang tidak dapat dilakukan oleh prajurit biasa. Kita perlu memperluas program pelatihan agar lebih banyak prajurit kita yang memenuhi kualifikasi."
 extreme_environment_training: "Pelatihan Lingkungan Ekstrem"
 extreme_environment_training_desc: "Kita harus mampu bertempur di lingkungan yang paling ganas. Dengan pelatihan dan perlengkapan yang tepat, pasukan kita akan mampu bertempur dalam kondisi paling ekstrem sekalipun."
 survival_training: "Pelatihan Bertahan Hidup"
 survival_training_desc: "Pasukan khusus kita kerap kali bertempur di belakang garis musuh dengan pasokan yang sangat minim. Kita perlu melatih mereka untuk bertahan di cuaca buruk dan bertempur dengan perbekalan terbatas."
 elite_forces: "Pasukan Elit"
 elite_forces_desc: "Hanya yang terbaik dari yang terbaik yang akan menjadi pasukan khusus. Prajurit yang berhasil lolos dari pelatihan akan menjadi lebih tangguh, lebih cepat, dan bertempur lebih gigih daripada siapa pun."
 jungle_warfare: "Peperangan Hutan Tropis"
 jungle_warfare_desc: "Pelatihan khusus untuk membuat prajurit kita sangat efektif dalam pertempuran di hutan lebat."
 jungle_training_tech: "Pelatihan Hutan"
 desert_training_tech: "Pelatihan Gurun"
 hills_training_tech: "Pelatihan Perbukitan"
 urban_training_tech: "Pelatihan Perkotaan"
 HUN_light_infantry_tech: "Doktrin Divisi Infanteri Ringan"
 HUN_light_infantry_tech_desc: "Mengurangi proporsi senjata bantuan berat dalam divisi infanteri membuat mereka lebih fleksibel dan memberi mereka keunggulan dalam pertempuran di medan terbatas seperti perkotaan dan hutan lebat."
 SWI_mountaineer_paratroopers_tech: "$SWI_mountaneer_paratroopers$"
 mountain_warfare: "Peperangan Gunung"
 mountain_warfare_desc: "Pelatihan khusus untuk membuat prajurit kita efektif dalam pertempuran di barisan pegunungan."
 mountain_defensive_training: "Pelatihan Pertahanan Gunung"
 mountain_defensive_training_desc: "Pelatihan khusus akan memungkinkan pasukan kita bertahan lebih kokoh di medan pegunungan."
 tech_recon: "Kompi Pengintai I"
 tech_recon_desc: "Mengirim kelompok-kelompok kecil untuk mengintai di depan sebelum menggerakkan kekuatan utama memungkinkan kita mengumpulkan intelijen tentang letak posisi dan jumlah musuh yang dihadapi."
 tech_recon2: "Kompi Pengintai II"
 tech_recon2_desc: "Misi pengintaian kerap kali berbahaya dan memakan korban jiwa tinggi. Mempersiapkan patroli kita untuk bergerak dan mundur secara kilat serta membekali mereka sarana menyingkirkan rintangan musuh akan meningkatkan peluang mereka pulang hidup-hidup."
 tech_recon3: "Kompi Pengintai III"
 tech_recon3_desc: "Penyempurnaan teknologi radio mengubah cara pelaksanaan misi pengintaian, memungkinkan penyampaian intelijen yang terkumpul secara secepat kilat."
 tech_recon4: "Kompi Pengintai IV"
 tech_recon4_desc: "Operasi pengintaian mendalam yang memadukan spionase, operasi gerilya, dan pelatihan komando akan mendukung ketepatan pilihan taktis dan memungkinkan kita menyesuaikan pengambilan keputusan secara cepat."
 tech_engineers: "Kompi Zeni I"
 tech_engineers_desc: "Pembangunan benteng lapangan dan penembusan rintangan menjadikan zeni tempur sangat vital di medan laga. Memberi zeni kita peran yang serbaguna memungkinkan kita mengerahkan mereka dalam berbagai situasi kritis di mana mereka dibutuhkan."
 tech_engineers2: "Kompi Zeni II"
 tech_engineers2_desc: "Dengan peralatan modern dan bahan peledak berkekuatan tinggi, zeni kita dapat melangkah melampaui tugas tradisional mereka dan mengejutkan musuh dengan kecerdikan mereka, baik di darat maupun di laut."
 tech_engineers3: "Kompi Zeni III"
 tech_engineers3_desc: "Proyek-proyek rekayasa zeni militer kini menjangkau skala yang lebih masif. Pembangunan sarana infrastruktur mutakhir memungkinkan terlaksananya operasi yang membutuhkan pasokan logistik melampaui apa yang biasanya tersedia di lapangan."
 tech_engineers4: "Kompi Zeni IV"
 tech_engineers4_desc: "Mempertahankan mobilitas lokal sembari mendirikan apa yang sebelumnya dianggap sebagai benteng permanen dan jaringan pasokan kokoh, zeni tempur masa depan akan memastikan bahwa di mana pun pasukan kita diserang, mereka selalu siap siaga."
 hospital_tech: "Rumah Sakit Lapangan"
 helicopter_tech: "Helikopter"
 logistics_tech: "Kompi Logistik"
 recon_tech: "Kompi Pengintai"
 tech_field_hospital: "Rumah Sakit Lapangan I"
 tech_field_hospital_desc: "Seorang korban luka tidak harus menjadi prajurit yang gugur. Menyediakan pertolongan medis segera bagi korban luka yang dievakuasi ke lini belakang adalah langkah awal untuk memastikan keselamatan jiwa mereka."
 tech_field_hospital2: "Rumah Sakit Lapangan II"
 tech_field_hospital2_desc: "Dengan membudayakan penggunaan rumah sakit portabel yang membawa perawatan medis langsung ke tempat yang dibutuhkan, kita dapat mencegah banyak kematian yang sia-sia dan cacat permanen."
 tech_field_hospital3: "Rumah Sakit Lapangan III"
 tech_field_hospital3_desc: "Operasi bedah adalah salah satu tindakan darurat paling krusial di medan tempur. Prosedur dan peralatan bedah harus tersedia lebih dekat ke garis depan, dan kita harus memastikan para ahli bedah terampil menjadi bagian integral dari unit medis militer."
 tech_field_hospital4: "Rumah Sakit Lapangan IV"
 tech_field_hospital4_desc: "Meskipun banyak kemajuan telah dicapai dalam kedokteran lapangan, banyak di antaranya masih bersifat improvisasi dan kita belum memiliki doktrin baku. Dengan lebih banyak pengalaman, kita dapat merumuskan peran unit-unit ini lebih gamblang dan mempatenkan inovasi improvisasi menjadi prosedur tetap."
 tech_logistics_company: "Kompi Logistik I"
 tech_logistics_company_desc: "Menempatkan Perwira Logistik spesialis di jajaran kita akan memastikan bahwa jaringan pasokan dimanfaatkan secara optimal guna meminimalkan pemborosan perbekalan."
 tech_logistics_company2: "Kompi Logistik II"
 tech_logistics_company2_desc: "Menyesuaikan analisis risiko kita dengan kondisi peperangan baru akan meningkatkan keamanan dan kelancaran dukungan logistik kita."
 tech_logistics_company3: "Kompi Logistik III"
 tech_logistics_company3_desc: "Evaluasi statistik berkesinambungan atas kebutuhan pasokan pasukan berkontribusi dalam memaksimalkan daya guna sumber daya perbekalan kita."
 tech_logistics_company4: "Kompi Logistik IV"
 tech_logistics_company4_desc: "Mengembangkan klasifikasi standar untuk perbekalan akan meminimalkan kebingungan dan menjadikan perencanaan suplai jauh lebih efisien."
 tech_military_police: "Polisi Militer I"
 tech_military_police_desc: "Pasukan reguler mungkin sanggup mengelola wilayah pendudukan untuk waktu singkat, tetapi mereka pertama dan terutama adalah prajurit tempur. Mengintegrasikan polisi militer ke dalam pasukan kita memastikan tersedianya personel di lapangan untuk meredam resistensi dan menyelidiki sabotase."
 tech_military_police2: "Polisi Militer II"
 tech_military_police2_desc: "Dengan menjalankan tugas-tugas kepolisian reguler di wilayah pendudukan, seperti pengaturan lalu lintas dan menjaga ketertiban umum, polisi militer kita dapat meminimalkan kekacauan yang menjadi lahan subur bagi gerakan partisan."
 tech_military_police3: "Polisi Militer III"
 tech_military_police3_desc: "Bekerja sama dengan jaringan mata-mata lokal dan informan yang dibentuk sebelum pendudukan, polisi militer kita dapat secara proaktif mengantisipasi dan bersiap di titik-titik rawan perlawanan."
 tech_military_police4: "Polisi Militer IV"
 tech_military_police4_desc: "Menjaga keamanan wilayah pendudukan secara tertib sama pentingnya dengan memulihkan kehidupan normal sebagaimana melenyapkan oposisi tanpa pandang bulu. Polisi militer kita harus memastikan proses normalisasi ini dimulai sejak dini, demi keselamatan prajurit dan warga sipil."
 tech_signal_company: "Kompi Sinyal I"
 tech_signal_company_desc: "Membangun dan memelihara komunikasi di medan perang selalu membutuhkan keahlian khusus. Dengan lahirnya teknologi komunikasi dan deteksi baru pasca Perang Besar, terbuka peluang-peluang mutakhir dalam koordinasi lapangan."
 tech_signal_company2: "Kompi Sinyal II"
 tech_signal_company2_desc: "Kompi sinyal yang berfokus pada komunikasi antar-kecabangan militer dapat memastikan pasukan darat sanggup mengoordinasikan gerakan secara padu dengan operasi laut dan udara serta merencanakan pergerakan lebih cepat."
 tech_signal_company3: "Kompi Sinyal III"
 tech_signal_company3_desc: "Teknologi komunikasi yang kian portabel kini semakin praktis untuk dibawa secara perorangan dalam bentuk ransel. Peningkatan mobilitas korps sinyal perhubungan ini harus dimanfaatkan semaksimal mungkin."
 tech_signal_company4: "Kompi Sinyal IV"
 tech_signal_company4_desc: "Di antara para spesialis sinyal kita terdapat personel dengan pengalaman langsung tak tertandingi dalam penggunaan perangkat ini di medan tempur. Melibatkan mereka dalam riset teknologi komunikasi baru memungkinkan kita memanfaatkan keahlian praktis mereka."
 tech_maintenance_company: "Kompi Pemeliharaan I"
 tech_maintenance_company_desc: "Pemeliharaan, perbaikan, dan perombakan berkala sangat penting untuk menjaga perlengkapan militer tetap andal dan aman digunakan. Memiliki kompi khusus yang berdedikasi akan memastikan aspek vital ini memperoleh perhatian semestinya."
 tech_maintenance_company2: "Kompi Pemeliharaan II"
 tech_maintenance_company2_desc: "Prosedur pemeliharaan operasional rutin meminimalkan risiko kerusakan mendadak pada perlengkapan serta mengingatkan pasukan untuk menggantinya sebelum benar-benar rusak di tengah pertempuran."
 tech_maintenance_company3: "Kompi Pemeliharaan III"
 tech_maintenance_company3_desc: "Memastikan pasukan kita selalu dibekali suku cadang dan material dasar di lapangan untuk perbaikan ringan akan mencegah penggunaan terus-menerus perlengkapan yang sudah diketahui rusak."
 tech_maintenance_company4: "Kompi Pemeliharaan IV"
 tech_maintenance_company4_desc: "Pengalaman merancang sistem redundansi aktif pada Perang Besar dapat diperbarui dan diterapkan pada perlengkapan yang lebih modern guna mempermudah proses pemeliharaan."
 motorised_infantry: "Infanteri Bermotor"
 motorised_infantry_desc: "Dengan memperluas penggunaan kendaraan bermotor untuk pengangkutan infanteri di medan perang, mobilitas unit infanteri yang tadinya lambat dapat ditingkatkan secara drastis, memungkinkan respons kilat dan strategi-strategi baru."
 night_vision: "Penglihatan Malam I"
 night_vision_desc: "Mampu melihat musuh tanpa terlihat oleh mereka adalah kunci utama operasi malam hari. Dengan penemuan teknologi inframerah, kita dapat memperlengkapi tentara kita dengan perangkat yang, meski agak canggung digunakan, mampu mewujudkan keunggulan ini."
 night_vision2: "Penglihatan Malam II"
 night_vision2_desc: "Teropong bidik inframerah awal, meski awalnya ditujukan bagi penembak runduk, memiliki jangkauan pandang terbatas. Seiring membaiknya portabilitas dan kejernihan pandang, perangkat ini dapat digunakan oleh lebih banyak pasukan yang beroperasi di kegelapan malam."
 basic_machine_tools: "Peralatan Mesin Dasar"
 basic_machine_tools_desc: "Berbagai mesin frais yang baru dikembangkan dapat diterapkan dalam produksi militer, mulai dari tipe kecil dan serbaguna di bengkel kerja hingga model skala besar berkemampuan tinggi yang mendobrak batasan teknologi."
 improved_machine_tools: "Peralatan Mesin yang Disempurnakan"
 improved_machine_tools_desc: "Mesin bubut turret (turret lathe) terbukti sangat vital untuk produksi massal. Memastikan efisiensi konstruksi dan penggunaan mesin bubut ini akan memberikan keunggulan industri yang signifikan bagi kita."
 advanced_machine_tools: "Peralatan Mesin Mutakhir"
 advanced_machine_tools_desc: "Otomatisasi peralatan mesin menggunakan mekanisme servo telah banyak dibahas sebelumnya. Menerapkan ide-ide ini secara nyata memungkinkan kita memanfaatkan kemajuan otomatisasi lainnya, seperti mesin hitung elektronik."
 assembly_line_production: "Produksi Jalur Perakitan"
 assembly_line_production_desc: "Jalur perakitan bertenaga mesin, yang telah digunakan luas di berbagai industri sipil, mampu mengubah jalannya peperangan dengan membuka keran produksi massal dalam volume yang belum pernah terjadi sebelumnya."
 flexible_line: "Jalur Fleksibel"
 flexible_line_desc: "Betapapun rapinya jalur perakitan mekanis bekerja, jalur tersebut tetap dioperasikan oleh manusia, yang memungkinkan dilakukannya adaptasi saat dibutuhkan. Kita harus memanfaatkan fleksibilitas ini dalam produksi industri kita."
 streamlined_line: "Jalur Ramping Terpadu"
 streamlined_line_desc: "Standardisasi dan struktur jalur perakitan yang teratur ketat adalah kunci utama efisiensi dan keamanannya. Ini harus menjadi aspek utama yang terus dikembangkan dalam produksi industri kita."
 improved_equipment_conversion: "Ketel Uap Berbahan Bakar Batu Bara Bubuk"
 improved_equipment_conversion_desc: "Dengan menggunakan batu bara yang dihaluskan menjadi bubuk halus untuk memanaskan ketel uap kita, kita dapat mencapai efisiensi pembakaran yang jauh lebih tinggi, menghasilkan produksi energi yang lebih prima bagi pabrik kita."
 advanced_equipment_conversion: "Turbin Efisiensi Tinggi"
 advanced_equipment_conversion_desc: "Mengadopsi rancangan generator yang disempurnakan akan memungkinkan mesin beroperasi pada tekanan dan suhu yang jauh lebih tinggi, sehingga secara drastis mendongkrak efisiensi energi pembangkit listrik batu bara kita."
 concentrated_industry: "Industri Terkonsentrasi I"
 concentrated_industry_desc: "Memusatkan produksi industri kita ke beberapa lokasi utama akan memungkinkan kita meningkatkan efisiensi manufaktur secara dramatis.\n\n"
 concentrated_industry2: "Industri Terkonsentrasi II"
 concentrated_industry2_desc: "Konsentrasi fasilitas manufaktur yang lebih terpadu akan membantu menekan biaya produksi secara signifikan."
 concentrated_industry3: "Industri Terkonsentrasi III"
 concentrated_industry3_desc: "Biaya infrastruktur dapat ditekan dengan menyesuaikan jaringan logistik langsung ke pusat-pusat industri kita yang terkonsentrasi."
 concentrated_industry4: "Industri Terkonsentrasi IV"
 concentrated_industry4_desc: "Menjaga agar titik-titik kunci dalam industri kita berdekatan satu sama lain akan melipatgandakan produktivitas kawasan-kawasan terpusat ini."
 concentrated_industry5: "Industri Terkonsentrasi V"
 concentrated_industry5_desc: "Kompleks industri raksasa kini memadukan banyak mata rantai industri kita, meminimalkan biaya transportasi bahan baku dan mengoptimalkan tenaga kerja."
 dispersed_industry: "Industri Tersebar I"
 dispersed_industry_desc: "Dengan menyebarkan pabrik-pabrik kita ke berbagai wilayah, kita dapat memastikan bahwa fasilitas industri kita menjadi sasaran yang sangat sulit bagi musuh di masa perang.\n\n"
 dispersed_industry2: "Industri Tersebar II"
 dispersed_industry2_desc: "Desentralisasi manufaktur lebih lanjut membuat musuh semakin sulit melancarkan serangan udara yang melumpuhkan sektor produksi tertentu."
 dispersed_industry3: "Industri Tersebar III"
 dispersed_industry3_desc: "Mengoperasikan pabrik-pabrik di bawah samaran operasi sipil lainnya akan secara signifikan menurunkan risiko serangan bom langsung dari musuh."
 dispersed_industry4: "Industri Tersebar IV"
 dispersed_industry4_desc: "Menyamarkan dan menyebarkan pabrik-pabrik kita menciptakan jaringan produksi tangguh yang nyaris mustahil untuk dilumpuhkan sepenuhnya."
 dispersed_industry5: "Industri Tersebar V"
 dispersed_industry5_desc: "Dengan mengoperasikan bukan hanya pabrik, tetapi juga jaringan infrastruktur penghubungnya secara rahasia, kita dapat membuatnya semakin mustahil dihancurkan melalui serangan udara musuh."
 synth_oil_experiments: "Eksperimen Minyak Sintetis"
 synth_oil_experiments_desc: "Untuk mengurangi ketergantungan pada pasokan minyak bumi alam, proses kimia untuk memproduksi bahan pengganti dari zat dan material lain dapat diteliti."
 early_refining: "Pemurnian Awal"
 early_refining_desc: "Minyak mentah dapat dimurnikan menjadi berbagai zat dan bahan bakar yang sangat vital bagi perang modern. Menjadi yang terdepan dalam metode ini mutlak diperlukan untuk membangun industri berdaya saing."
 oil_processing: "Pengolahan Minyak"
 oil_processing_desc: "Jaringan pabrik untuk distilasi dan pemurnian sintetis produk minyak adalah langkah krusial berikutnya demi menjamin ketahanan pasokan bahan bakar bangsa kita."
 improved_oil_processing: "Pengolahan Minyak yang Disempurnakan"
 improved_oil_processing_desc: "Mengalihkan metode distilasi yang sebelumnya eksperimental ke operasi skala industri besar akan memungkinkan kita beradaptasi lebih baik terhadap material dan kebutuhan yang ada."
 advanced_oil_processing: "Pengolahan Minyak Mutakhir"
 advanced_oil_processing_desc: "Teknik pemurnian eksperimental baru seperti hydrotreating dapat diterapkan dalam manufaktur minyak untuk menyempurnakan kualitas bahan bakar akhir secara drastis."
 modern_oil_processing: "Pengolahan Minyak Modern"
 modern_oil_processing_desc: "Kilang minyak kita dapat disempurnakan lebih lanjut dengan metode pengolahan tingkat lanjut seperti perengkahan hidrogen (hydrocracking), alkilasi, oksidasi merkaptan, dan isomerisasi."
 rubber_processing: "Pengolahan Karet"
 rubber_processing_desc: "Pengolahan industri karet sintetis sangat dibutuhkan untuk memangkas ketergantungan kita pada karet alam impor."
 improved_rubber_processing: "Pengolahan Karet yang Disempurnakan"
 improved_rubber_processing_desc: "Produksi skala besar karet sintetis menjadi sangat memungkinkan dengan proses kimia baru yang mempercepat reaksi dehidrogenasi."
 advanced_rubber_processing: "Pengolahan Karet Mutakhir"
 advanced_rubber_processing_desc: "Formula karet sintetis serbaguna dengan proses yang disempurnakan seperti pengubah polimerisasi dodekil merkaptan akan memungkinkan kita memperluas hasil produksi karet sintetis."
 modern_rubber_processing: "Pengolahan Karet Modern"
 modern_rubber_processing_desc: "Beralih ke proses polimerisasi yang lebih teroptimasi akan menghasilkan biaya produksi yang lebih murah dan volume keluaran yang jauh lebih melimpah."
 POWERED_BUILDING: "Konstruksi Bertenaga Listrik: $VAL|+=%2$"
 POWERED_DOCKYARD: "Keluaran Galangan Kapal Bertenaga Listrik: $VAL|+=%2$"
 POWERED_FACTORY: "Keluaran Pabrik Bertenaga Listrik: $VAL|+=%2$"
 construction1: "Konstruksi I"
 construction1_desc: "Metode dan material yang lebih baik memungkinkan kita membangun gedung, baik sipil maupun militer, dengan lebih cepat."
 construction2: "Konstruksi II"
 construction2_desc: "Memodernisasi peralatan dan perlengkapan kita akan semakin membantu upaya konstruksi pembangunan kita."
 construction3: "Konstruksi III"
 construction3_desc: "Penerapan kendaraan modern dan pengalaman dari kemajuan konstruksi kita dapat diterapkan untuk mempercepat perbaikan secara signifikan."
 construction4: "Konstruksi IV"
 construction4_desc: "Tingkat mekanisasi yang lebih tinggi dan rutinitas kerja yang lebih baik semakin meningkatkan kecepatan konstruksi bangunan."
 construction5: "Konstruksi V"
 construction5_desc: "Masa depan konstruksi yang efisien akan memerlukan perencanaan yang lebih matang untuk masing-masing proyek serta solusi yang terstandardisasi sedapat mungkin."
 excavation1: "Ekskavasi I"
 excavation1_desc: "Kemajuan dalam teknik pengeboran memungkinkan kita mengekstraksi sumber daya yang sebelumnya mustahil dijangkau."
 excavation2: "Ekskavasi II"
 excavation2_desc: "Teknik-teknik baru membantu kita mengumpulkan sumber daya secara lebih efisien. Kita tidak lagi mencemari mineral saat diekstraksi, menghasilkan perolehan yang jauh lebih besar."
 excavation3: "Ekskavasi III"
 excavation3_desc: "Kemajuan dalam ilmu geologi membantu kita memetakan lokasi sumber daya. Kita kini dapat memusatkan upaya penambangan di tempat-tempat yang memiliki probabilitas tinggi ditemukannya cadangan alam melimpah."
 excavation4: "Ekskavasi IV"
 excavation4_desc: "Otomatisasi proses-proses kunci dan kemajuan dalam bidang mekanika menjadikan seluruh lokasi tambang kita jauh lebih efisien."
 excavation5: "Ekskavasi V"
 excavation5_desc: "Kemajuan dalam bidang penambangan terbuka memberi kita hasil ekstraksi sumber daya yang jauh lebih tinggi dari lokasi-lokasi tambang kita saat ini."
 excavation_tech: "Teknologi Ekskavasi"
 electronic_mechanical_engineering: "Teknik Rekayasa Elektro-Mekanis"
 electronic_mechanical_engineering_desc: "Kita hidup di zaman ketika mesin-mesin listrik tidak hanya mampu menghangatkan dan menerangi kita, tetapi juga membantu kita berpikir dan berkomunikasi. Elektronik akan menjadi kunci bagi intelijen militer di abad mendatang."
 radio: "Radio"
 radio_desc: "Mengadopsi penemuan para operator radio amatir dan memperluas penggunaan radio FM akan mengurangi interferensi gelombang serta memungkinkan kita menemukan kegunaan-kegunaan baru bagi teknologi radio."
 improved_radio: "Radio yang Disempurnakan"
 improved_radio_desc: "Penyempurnaan kekuatan sinyal memungkinkan siaran radio dipancarkan lebih jauh dari sebelumnya."
 advanced_radio: "Radio Mutakhir"
 advanced_radio_desc: "Kemajuan dalam teknologi radio telah memperluas jangkauan transmisi, dan bahkan membuat beberapa perangkat cukup kecil untuk dibawa oleh perorangan. Sebagian menyebutnya Walkie-Talkie."
 radio_detection: "Radar"
 radio_detection_sp_2_tt: "$coordination_bonus$: §G+2%§!\n$MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+20%§!"
 radio_detection_desc: "Pengembangan RADAR (Radio Detection and Ranging) memungkinkan pemanfaatan gelombang radio untuk mendeteksi benda fisik. Riset ini sangat dirahasiakan, mengingat dampak besar yang ditimbulkannya dalam melacak keberadaan unit-unit tempur."
 radio_detection_unlock_tt: "Dibuka dengan menyelesaikan riset eksperimental §Y$sp_air_radar$§! di fasilitas §Y$land_facility$§!"
 cavity_magnatron: "Magnetron Rongga"
 cavity_magnatron_desc: "Dengan menggunakan tabung penghasil gelombang mikro yang disebut Magnetron Rongga (Cavity Magnetron), kita dapat secara drastis meningkatkan kemampuan sistem radar yang ada dalam mendeteksi objek melalui pantulan gelombang mikro."
 improved_cavity_magnatron: "Radar Desimeter yang Disempurnakan"
 improved_cavity_magnatron_desc: "Penggunaan radar telah terbukti sangat krusial, tetapi perangkat radar desimeter kita masih terlalu sedikit untuk memastikan cakupan yang memadai. Memperlengkapi lebih banyak unit dengan radar akan memaksimalkan keunggulan teknologi kita."
 centimetric_radar: "Radar Sentimeter"
 centimetric_radar_desc: "Radar baru yang beroperasi pada pita gelombang mikro memungkinkan kita mendeteksi objek yang terlalu kecil untuk ditangkap oleh radar generasi sebelumnya."
 phased_array: "Larik Berfase"
 phased_array_desc: "Tidak seperti radar tradisional yang mengandalkan rotasi mekanis, radar larik berfase (phased array) menggunakan kendali elektronik untuk mengarahkan sorotan gelombang, memungkinkannya menjalankan berbagai fungsi secara bersamaan, seperti melacak banyak sasaran sekaligus."
 monopulse_radar: "Radar Monopulsa"
 monopulse_radar_desc: "Dengan Radar Monopulsa, kita dapat menentukan arah sasaran secara presisi dengan membandingkan sinyal dari beberapa antena penerima, meningkatkan keakuratan deteksi."
 mechanical_computing: "Komputasi Mekanis"
 mechanical_computing_desc: "Membangun mesin yang mampu melakukan analisis diferensial tingkat lanjut akan secara radikal mengubah jenis perhitungan analitis berbantuan mesin yang dapat dilakukan."
 computing_machine: "Mesin Komputasi"
 computing_machine_desc: "Mengembangkan landasan teoritis bagi komputer modern dan merakit mesin-mesin elektromekanis untuk mulai mempraktikkannya akan menjadi langkah perdana menuju ranah kemungkinan baru."
 improved_computing_machine: "Mesin Komputasi yang Disempurnakan"
 improved_computing_machine_desc: "Komputer digital elektronik kini dapat dibuat dengan kemampuan untuk diprogram. Meskipun masih sangat mahal dan berukuran besar, mesin-mesin ini memungkinkan analisis intelijen kriptografi jauh melampaui kapasitas manusiawi biasa."
 advanced_computing_machine: "Mesin Komputasi Mutakhir"
 advanced_computing_machine_desc: "Mulai merintis komputer yang mampu menyimpan instruksi program di memori serta memanfaatkan transistor akan menempatkan kita pada jalur Revolusi Digital, di mana mesin-mesin ini dapat diterapkan di hampir seluruh bidang."
 basic_encryption: "Enkripsi - Sandi Polialfabetis"
 basic_encryption_desc: "Seiring lahirnya metode komunikasi baru, timbul pula risiko baru intersepsi pesan oleh musuh. Mesin sandi rotor dapat digunakan untuk menghasilkan enkripsi yang rumit dan cepat."
 improved_encryption: "Enkripsi - Permutasi Siklik"
 improved_encryption_desc: "Keterbatasan dalam pengacakan mesin sandi dapat dieksploitasi musuh untuk memecahkan kode rahasia kita. Dengan menyempurnakan keacakan mekanika rotor, kita dapat membuat analisis kriptografi lawan menjadi jauh lebih sukar."
 advanced_encryption: "Enkripsi - Modulasi Kode Pulsa"
 advanced_encryption_desc: "Penyempurnaan teknologi dan pengalaman lapangan yang berharga memungkinkan kita menerapkan lebih banyak langkah pengamanan arus lalu lintas sinyal dalam komunikasi kita."
 basic_decryption: "Dekripsi - Analisis Frekuensi"
 basic_decryption_desc: "Kriptanalisis kini kian bertransformasi menjadi sains matematika tingkat lanjut. Sistem seperti katalog kartu dan perangkat elektromekanis siklometer dapat mempercepat pemecahan sandi."
 improved_decryption: "Dekripsi - Serangan Saluran Samping"
 improved_decryption_desc: "Pengembangan komputer yang lebih canggih membuka penerapan metode kriptanalisis baru seperti pembedaan diferensial, yang dapat digunakan untuk menembus sandi rumit musuh bila dipadukan dengan teknik manual baru."
 advanced_decryption: "Dekripsi - Deduksi Otomatis"
 advanced_decryption_desc: "Kekuatan komputasi yang telah meningkatkan kemampuan pemecahan sandi kita dikhawatirkan akan menciptakan sandi yang nyaris tak terpecahkan di masa depan. Agar tetap selangkah di depan, kita harus bertindak lebih agresif demi mendapatkan informasi internal mengenai teknologi sandi lawan."
 experimental_rockets: "Roket Eksperimental"
 experimental_rockets_desc: "Memajukan sains peroketan dengan meningkatkan jangkauan dan keandalan roket berbahan bakar cair akan memberi pemahaman mendalam tentang teknologi propulsi guna membangun landasan peluncuran model yang lebih canggih."
 rocket_engines: "Mesin Roket"
 rocket_engines_desc: "Pengetahuan propulsi roket telah mencapai titik di mana kita dapat merakit bom terbang dan pesawat bertenaga roket, yang mampu melesat pada kecepatan yang sebelumnya mustahil dicapai."
 improved_rocket_engines: "Mesin Roket yang Disempurnakan"
 improved_rocket_engines_desc: "Rudal balistik jarak jauh perdana kini dapat dibuat dan dirancang semakin presisi, menjangkau kota-kota musuh yang terpencil dan bahkan menembus batas ruang angkasa."
 advanced_rocket_engines: "Mesin Roket Mutakhir"
 advanced_rocket_engines_desc: "Masa depan peroketan membuka peluang lahirnya rudal balistik antarbenua (ICBM), yang jangkauannya nyaris tanpa batas sementara daya hancur hulu ledaknya semakin mematikan."
 atomic_research: "Riset Atom"
 atomic_research_desc: "Dalam fisi nuklir, pembelahan inti atom melepaskan energi dalam jumlah yang teramat dahsyat serta potensi daya hancur tanpa batas."
 rocket_interceptor: "Pesawat Pencegat Roket"
 rocket_interceptor_desc: "Pesawat pencegat bertenaga roket yang berbasis pada kerangka pesawat layang dapat melesat lebih cepat dari pesawat mana pun untuk kurun waktu singkat. Meskipun ketidakstabilan bahan bakar menimbulkan risiko tinggi, pesawat ini mampu lepas landas dan mencegat serangan lebih cepat daripada yang diperkirakan musuh."
 rocket_interceptor_2: "Pesawat Pencegat Roket II"
 rocket_interceptor_2_desc: "Meski masih tergolong berbahaya untuk dioperasikan, pesawat tempur bertenaga roket kini dibantu oleh sistem kemudi otomatis dan penarikan oleh pesawat induk guna memaksimalkan pemanfaatan kecepatannya yang ekstrem kendati waktu terbangnya singkat."
 rocket_interceptor_3: "Pesawat Pencegat Roket III"
 rocket_interceptor_3_desc: "Teknik pendaratan baru dan sistem bahan bakar yang lebih aman telah secara signifikan mendongkrak tingkat keberhasilan dan keselamatan pesawat tempur roket, mewujudkan potensi teoretis dari wahana mutakhir ini."
 nukes: "Bom Nuklir"
 nukes_desc: "Proyek perakitan bom atom akan menjadi salah satu tugas paling rahasia dan paling rumit yang dapat diemban suatu bangsa, namun jika berhasil, akan mengubah jalannya perang masa kini sekaligus masa depan peradaban dunia."
 interwar_artillery: "Artileri Antar-Perang"
 interwar_artillery_desc: "Pelajaran yang dipetik dalam pengembangan berbagai tipe meriam dapat saling diterapkan pada perancangan unit artileri lainnya."
 artillery1: "Artileri I"
 artillery1_desc: "Dengan material dan mekanisme yang lebih modern, howitzer dan meriam medan dari era Perang Besar dapat disesuaikan ulang ruang bakarnya dan dimodernisasi untuk peperangan masa kini."
 artillery2: "Peningkatan Artileri yang Disempurnakan I"
 artillery2_desc: "Memodernisasi meriam lama hanya mampu membawa kita sejauh ini. Rancangan howitzer baru sangat dibutuhkan, dengan memanfaatkan peredam tolak balik hidraulis baru dan laras yang lebih panjang."
 artillery3: "Peningkatan Artileri yang Disempurnakan II"
 artillery3_desc: "Agar memungkinkan pemasangan meriam yang lebih berat pada kereta pembawa yang lebih ringan, rem moncong (muzzle brake) dapat ditambahkan ke dalam rancangan howitzer."
 artillery4: "Artileri IV"
 artillery4_desc: "Pengembangan artileri berbobot ringan yang dapat dibongkar-pasang untuk pengangkutan akan memungkinkan pengiriman bantuan artileri ke wilayah-wilayah yang sebelumnya sulit dijangkau."
 artillery5: "Peningkatan Artileri Mutakhir"
 artillery5_desc: "Rancangan artileri dengan siluet yang lebih rendah akan jauh lebih sulit untuk dibidik dan diserang balik oleh musuh."
 mountain_gun: "Meriam Gunung"
 mountain_gun_desc: "Medan pegunungan yang terjal mendorong pengembangan meriam artileri yang dapat dibongkar dan diangkut menggunakan punggung keledai ke mana pun dibutuhkan."
 rocket_artillery2: "Peningkatan Artileri Roket I"
 rocket_artillery2_desc: "Artileri swagerak yang meluncurkan banyak roket sekaligus akan mampu menimbulkan kehancuran berskala masif secara sekejap, sembari tetap menjaga mobilitas tinggi untuk menghindari tembakan balasan musuh."
 rocket_artillery3: "Peningkatan Artileri Roket II"
 rocket_artillery3_desc: "Dengan mengorbankan sedikit jarak jangkau demi daya hantam yang lebih dahsyat, kita dapat memasang roket yang lebih berat pada kendaraan yang lebih besar. Bekerja dalam kelompok, baterai artileri ini dapat bekerja sama untuk mengisi ulang amunisi dan berpindah posisi dengan gesit."
 rocket_artillery4: "Artileri Roket III"
 rocket_artillery4_desc: "Roket yang distabilkan dengan putaran rotasi (spin-stabilized) dapat memperluas jangkauan tembak baterai artileri roket ringan."
 interwar_antiair: "Anti-Udara"
 antiair1: "Peningkatan Anti-Udara"
 antiair1_desc: "Dengan mekanisme pengisian amunisi yang lebih cepat, meriam anti-udara berkaliber besar tetap mampu mempertahankan laju tembak yang dibutuhkan."
 antiair2: "Anti-Udara II"
 antiair2_desc: "Untuk membidik pesawat yang terbang tinggi, diperlukan selongsong amunisi yang lebih bertenaga dan laras meriam yang lebih panjang pada senjata anti-udara."
 antiair3: "Peningkatan Anti-Udara yang Disempurnakan I"
 antiair3_desc: "Seiring kian sempurnanya sistem radar, pengarahan meriam anti-pesawat menggunakan radar menjadi sangat menjanjikan. Mengikuti teknologi ini memungkinkan kita merakit sistem anti-udara paling akurat."
 antiair4: "Peningkatan Anti-Udara yang Disempurnakan II"
 antiair4_desc: "Memadukan sistem radar modern, komputasi penargetan, dan pengisi amunisi otomatis mutlak diperlukan untuk merespons pesawat musuh yang semakin lincah dan cepat."
 antiair5: "Anti-Udara V"
 antiair5_desc: "Rudal permukaan-ke-udara (SAM) adalah masa depan pertahanan udara. Mengembangkan wahana peluncur bergerak untuk rudal-rudal ini harus menjadi target kita berikutnya."
 interwar_antitank: "Anti-Tank"
 antitank1: "Peningkatan Anti-Tank"
 antitank1_desc: "Pentingnya senjata anti-tank yang efektif telah terbukti sejak Perang Besar. Memperkenalkan generasi baru persenjataan ini sangat penting untuk menangkal desain tank modern."
 antitank2: "Anti-Tank II"
 antitank2_desc: "Sebagian besar meriam anti-tank saat ini berkaliber cukup ringan. Meriam kaliber lebih besar akan diperlukan untuk menembus tank musuh yang lebih berat dengan perisai baja miring."
 antitank3: "Peningkatan Anti-Tank yang Disempurnakan I"
 antitank3_desc: "Proyektil HEAT (High-Explosive Anti-Tank) dapat digunakan pada artileri anti-tank untuk mengimbangi kecepatan moncong laras yang terbatas."
 antitank4: "Peningkatan Anti-Tank yang Disempurnakan II"
 antitank4_desc: "Meriam anti-tank serbaguna baru yang menggunakan amunisi penembus baja sub-kaliber (APDS) dapat merobek dinding baja hampir semua tipe tank."
 antitank5: "Anti-Tank V"
 antitank5_desc: "Dengan menggabungkan berbagai teknologi amunisi baru dengan laras berkecepatan moncong sangat tinggi, kita akan senantiasa siap menghadapi lapisan baja baru apa pun yang dikembangkan musuh."
 air_superiority: "Keunggulan Udara"
 air_superiority_desc: "Meraih Keunggulan Udara akan mempersulit pembom musuh untuk menyerang tanah air kita, sekaligus membuka jalan bebas bagi pembom kita untuk meluluhlantakkan musuh."
 formation_flying: "Terbang Formasi"
 formation_flying_desc: "Dengan terbang dalam formasi teratur, pesawat dapat saling memberikan perlindungan atau bekerja sama memburu dan menggempur musuh."
 air_offense: "Pengawalan Pesawat Tempur"
 air_offense_desc: "Dengan penekanan pada pengeboman siang hari, kita harus menjaga keselamatan pembom kita dari kejaran pesawat pencegat lawan. Melatih penerbang tempur kita bekerja sama erat dengan para pembom akan meningkatkan kemahiran tempur mereka saat mengawal di ruang udara musuh."
 fighter_baiting: "Pancingan Pesawat Tempur"
 fighter_baiting_desc: "Dengan berpura-pura berada dalam posisi rentan, pesawat tempur kita dapat memancing pesawat musuh masuk ke dalam perangkap penyergapan."
 dogfighting_experience: "Pengalaman Duel Udara"
 dogfighting_experience_desc: "Tidaklah mudah melacak posisi kawan dan lawan di tengah kekacauan duel udara (dogfight), namun seiring bertambahnya jam terbang dan pengalaman, para pilot kita akan semakin mahir menguasai ruang udara."
 fighter_ace_initiative: "Inisiatif Penerbang Ulung"
 fighter_ace_initiative_desc: "Memberikan penghargaan khusus dan status kehormatan bagi penerbang yang mencapai status 'Ace' (menembak jatuh lima musuh) mendorong keberanian mengambil risiko dan menumbuhkan rasa elit, kendati hal ini cenderung membuat penerbang berpengalaman tetap berada di medan tempur."
 multialtitude_flying: "Terbang Multiketinggian"
 multialtitude_flying_desc: "Pertempuran udara berlangsung dalam tiga dimensi, namun sebagian besar penerbang merasa lebih sulit memantau pesawat yang terbang di atas atau di bawah mereka. Kita dapat memanfaatkan ini dengan menyebarkan formasi kita secara vertikal."
 offensive_formations: "Formasi Ofensif"
 offensive_formations_desc: "Pelatihan formasi yang lebih berorientasi ofensif menjadikan pesawat tempur kita jauh lebih mematikan dalam duel udara."
 fighter_sweeps: "Sapuan Udara Tempur"
 fighter_sweeps_desc: "Patroli agresif pesawat tempur di atas wilayah musuh dapat menyergap pesawat mereka saat lepas landas atau mendarat ketika mereka sangat rentan, atau mengacaukan penerbangan latihan musuh."
 force_rotation: "Rotasi Pasukan"
 force_rotation_desc: "Pertempuran atau konsentrasi tinggi dalam durasi lama sangat menguras tenaga, tetapi dengan merotasi pasukan tempur segar kapan pun memungkinkan, kita dapat menekan kesalahan akibat kelelahan penerbang."
 air_defence: "Pertahanan Udara"
 air_defence_desc: "Dengan melatih para penerbang kita untuk senantiasa waspada bahkan saat kondisi tampak aman, peluang mereka untuk mencegat pesawat musuh akan meningkat drastis."
 dispersed_fighting: "Pertempuran Tersebar"
 dispersed_fighting_desc: "Menerapkan formasi yang lebih renggang dan tersebar memungkinkan jumlah pesawat yang sama untuk berpatroli mengawasi area yang jauh lebih luas."
 forward_interception: "Pencegatan Terdepan"
 forward_interception_desc: "Dengan beroperasi lebih dekat ke ruang udara musuh, peluang pesawat tempur kita untuk mencegat pesawat musuh sebelum mencapai sasaran serangannya menjadi jauh lebih tinggi."
 fighter_veteran_initiative: "Inisiatif Veteran Tempur"
 fighter_veteran_initiative_desc: "Fokus pada kelangsungan hidup penerbang jangka panjang, baik melalui taktik berhati-hati maupun dengan merotasi pilot kawakan ke posisi instruktur pelatihan, memastikan pengalaman berharga mereka diteruskan ke penerbang baru."
 formation_fighting: "Pertempuran Formasi"
 formation_fighting_desc: "Terbang dalam formasi yang tepat memungkinkan para pilot saling menutupi titik buta (blind spot), menghasilkan kemampuan memantau dan mendeteksi pesawat musuh yang lebih tajam."
 air_skirmish: "Baku Tembak Udara"
 air_skirmish_desc: "Sayangnya, tidak selalu mungkin untuk memusnahkan setiap pesawat musuh di atas wilayah kita, namun kita dapat terus mengganggu mereka sejak pertama kali terdeteksi hingga mereka keluar, menguras kekuatan mereka tanpa jeda."
 home_defence: "Pertahanan Tanah Air"
 home_defence_desc: "Pengamat di darat serta pos deteksi dan penyadap suara bekerja serentak bersama angkatan udara kita untuk melacak dan membinasakan setiap penyusupan musuh."
 battlefield_destruction: "Kehancuran Medan Tempur"
 battlefield_destruction_desc: "Meski angkatan udara mampu menggempur sasaran jauh di pedalaman musuh, mereka juga sangat berdaya guna dalam memberikan bantuan langsung bagi tentara darat di medan pertempuran."
 dive_bombing: "Pengeboman Menukik"
 dive_bombing_desc: "Pengeboman menukik menghadirkan akurasi luar biasa, tetapi untuk hasil terbaik dibutuhkan pesawat khusus yang mampu menahan laju tukikannya dan bertahan dari tekanan g-force saat menarik moncong pesawat ke atas."
 direct_ground_support: "Bantuan Darat Langsung"
 direct_ground_support_desc: "Dengan mengoordinasikan penerbang CAS secara erat dengan perwira pengamat di darat, daya tembak udara dapat diarahkan secara presisi untuk membantu pasukan infanteri di medan laga."
 bomber_veteran_initiative: "Inisiatif Veteran Pengebom"
 bomber_veteran_initiative_desc: "Kebijakan menugaskan penerbang pengebom veteran untuk membagikan ilmu mereka kepada para penerbang pemula sangat meningkatkan peluang bertahan hidup mereka."
 bomber_ace_initiative: "Inisiatif Penerbang Ulung Pengebom"
 bomber_ace_initiative_desc: "Mengakui secara resmi dan memberi penghargaan kepada para penerbang pengebom ulung akan memupuk keberanian dan inisiatif taktis."
 cas_veteran_initiative: "Inisiatif Veteran Serangan Darat"
 cas_veteran_initiative_desc: "Kebijakan menugaskan penerbang serang darat veteran untuk mewariskan pengalaman kepada penerbang muda sangat membantu kelangsungan hidup skuadron."
 cas_ace_initiative: "Inisiatif Penerbang Ulung Serangan Darat"
 cas_ace_initiative_desc: "Mengakui secara resmi dan memberi penghargaan kepada penerbang CAS ulung akan mendorong keberanian dan inisiatif tinggi di medan laga."
 hunt_and_destroy: "Buru dan Hancurkan"
 hunt_and_destroy_desc: "Selain memberikan bantuan tembakan langsung, unit-unit CAS dapat secara mandiri berburu sasaran, kerap menyergap konvoi pasukan darat musuh yang bergerak menuju garis depan secara tak terduga."
 naval_strike_torpedo_tactics: "Taktik Torpedo Serangan Laut"
 naval_strike_torpedo_tactics_desc: "Melatih penerbang untuk melepaskan torpedo secara lebih presisi akan menjadikan serangan udara kita terhadap kapal perang musuh jauh lebih mematikan."
 naval_strike_torpedo_tactics_oi: "Taktik Torpedo Serangan Laut"
 naval_strike_torpedo_tactics_oi_desc: "Melatih penerbang untuk melepaskan torpedo secara lebih presisi akan menjadikan serangan udara kita terhadap kapal perang musuh jauh lebih mematikan."
 naval_strike_tactics: "Taktik Serangan Laut"
 naval_strike_tactics_desc: "Melatih para penerbang memprediksi pergerakan kapal musuh dan mengoordinasikan serangan serentak akan meningkatkan efektivitas serangan udara terhadap armada laut musuh."
 low_echelon_support: "Bantuan Eselon Bawah"
 low_echelon_support_desc: "Dengan menugaskan unit CAS langsung ke formasi darat kecil, dipastikan pasukan selalu memiliki daya tembak tambahan yang siap dipanggil, bahkan ketika berada di luar jangkauan artileri konvensional."
 combat_unit_destruction: "Penghancuran Satuan Tempur"
 combat_unit_destruction_desc: "Melatih pilot CAS kita untuk menyerang sasaran yang sama berulang kali hingga dipastikan hancur lebur menjamin sasaran tidak luput hanya karena luput tipis pada serangan pertama."
 operational_destruction: "Kehancuran Operasional"
 operational_destruction_desc: "Menghujani jalur pasokan pasukan darat musuh akan melumpuhkan mobilitas mereka antarmedan laga. Ini memberi keunggulan nyata bagi pasukan darat kita di wilayah di mana kita menguasai Keunggulan Udara."
 infrastructure_destruction: "Penghancuran Infrastruktur"
 infrastructure_destruction_desc: "Melatih para penerbang kita mengenai metode paling efektif untuk menghantam infrastruktur seperti jalur kereta api dan jembatan akan memaksimalkan efektivitas Pengeboman Taktis."
 logistical_bombing: "Pengeboman Logistik"
 logistical_bombing_desc: "Fokus yang lebih tajam dalam melumpuhkan jalur suplai musuh dari udara memberikan keunggulan masif bagi pasukan darat kita di area operasi tersebut."
 battlefield_support: "Dukungan Medan Tempur"
 battlefield_support_desc: "Sulit bagi pengebom taktis untuk menyerang sasaran yang sangat dekat dengan posisi pasukan kawan, karena pengeboman horizontal kurang akurat dibanding pengeboman menukik. Namun, pelatihan mendalam bersama pengamat darat dapat mengatasi kendala ini."
 carousel_bombing: "Pengeboman Korsel"
 carousel_bombing_desc: "Para penerbang pengebom kerap ingin menjatuhkan seluruh bom sekaligus begitu tiba di atas area sasaran lalu segera pulang secepatnya. Meskipun ini efektif untuk pengeboman area luas, dalam menghantam sasaran kecil jauh lebih efektif untuk berputar di atas sasaran dan menjatuhkan bom secara bertahap demi akurasi maksimal."
 keypoint_bombing: "Pengeboman Titik Kunci"
 keypoint_bombing_desc: "Mengebom titik-titik kunci secara akurat di medan laga demi membantu gerak maju pasukan darat akan sangat membantu mereka dalam menundukkan musuh."
 ground_support_integration: "Integrasi Bantuan Darat"
 ground_support_integration_desc: "Mengintegrasikan armada pengebom taktis kita sepenuhnya dengan pengamat di darat meningkatkan akurasi tembakan sekaligus memungkinkan mereka mendukung langsung pasukan darat dalam baku tembak."
 strategic_destruction: "Kehancuran Strategis"
 strategic_destruction_desc: "Para penerbang kita dapat menjangkau sasaran strategis musuh jauh lebih cepat dibanding pasukan laut atau darat. Tanpa sarana untuk mempersenjatai pasukan baru mereka, kita akan segera mengungguli jumlah kekuatan musuh."
 high_level_bombing: "Pengeboman Ketinggian Tinggi"
 high_level_bombing_desc: "Dari ketinggian jelajah yang sangat tinggi, kita dapat terhindar dari sebagian besar sergapan udara dan meriam anti-pesawat. Menjatuhkan bom dari ketinggian ini menuntut presisi lebih tinggi, namun jauh lebih aman bagi pesawat kita."
 massed_bomber_formations: "Formasi Pengebom Massal"
 massed_bomber_formations_desc: "Dengan tetap berada dalam formasi rapat, para pengebom kita dapat saling melindungi kelompok mereka dan meningkatkan peluang keberhasilan pelepasan bom."
 night_bombing: "Pengeboman Malam"
 night_bombing_desc: "Dengan pertahanan musuh yang mengendur dan pesawat pengebom kita terselubung kegelapan malam, kita dapat terus melancarkan serangan ofensif yang berdaya guna sepanjang waktu. Tunjukkan kepada musuh betapa gigihnya perlawanan kita.\n\n"
 dead_reckoning_bombing: "Pengeboman Perhitungan Mati"
 dead_reckoning_bombing_desc: "Dengan menghitung kecepatan tempuh, arah terbang, dan pergeseran angin dari posisi awal, kita dapat memperhitungkan pelepasan bom secara lebih presisi bahkan di tengah kegelapan malam."
 infiltration_bombing: "Pengeboman Infiltrasi"
 infiltration_bombing_desc: "Menyusup masuk ke dalam formasi pesawat musuh atau membuntuti mereka kembali ke pangkalannya mungkin terkesan seperti kegilaan. Namun dengan latihan yang memadai, hal itu sepenuhnya dapat dilakukan."
 pathfinder_groups: "Kelompok Perintis (Pathfinder)"
 pathfinder_groups_desc: "Penerbang veteran dibekali dengan sarana terbaik untuk menerangi posisi sasaran pengeboman. Asap tebal maupun cuaca buruk tidak akan mampu menghentikan skuadron pengebom dalam menyelesaikan misi mereka."
 day_bombing: "Pengeboman Siang Hari"
 day_bombing_desc: "Upaya terfokus di siang hari menghadirkan dampak kehancuran luar biasa berkat keunggulan jarak pandang yang jelas. Unjuk kekuatan psikologis adalah efek samping yang sangat menguntungkan.\n\n"
 escort_relay_system: "Sistem Estafet Pengawalan"
 escort_relay_system_desc: "Pengebom yang dikawal oleh pesawat tempur secara estafet meningkatkan ketahanan kita dalam menghadapi tembakan musuh."
 flying_fortress: "Benteng Terbang"
 flying_fortress_desc: "Memperlengkapi pengebom berat jelajah tinggi kita dengan persenjataan defensif yang tangguh dan pelindung baja yang cukup tebal agar mampu menahan gempuran musuh dan tetap pulang dengan selamat."
 mass_destruction: "Kehancuran Massal"
 mass_destruction_desc: "Pesawat pengebom diperlengkapi dengan persenjataan paling menghancurkan dalam jumlah yang sangat masif. Menjamin hasil kehancuran maksimal bahkan jika hanya segelintir penerbang kita yang berhasil menembus pertahanan lawan."
 fleet_in_being: "Armada Siaga (Fleet in Being)"
 fleet_in_being_desc: "Kapal-kapal perang tetap bersiaga di pangkalan pelabuhan di mana mereka lebih aman dan hanya mencegat musuh pada momen yang tepat. Keberadaan armada kita akan membuat musuh ragu-ragu untuk menyerang pelabuhan kita.\n\n"
 battlefleet_concentration: "Pemusatan Armada Tempur"
 battlefleet_concentration_desc: "Panggil kapal-kapal kawan di sekitar segera setelah kapal musuh terdeteksi. Tembakan terkoordinasi yang terfokus akan melumpuhkan kapal musuh dalam sekejap. Buru dan tenggelamkan mereka satu per satu."
 battlefleet_concentration_ti: "Pemusatan Armada Tempur"
 battlefleet_concentration_ti_desc: "Panggil kapal-kapal kawan di sekitar segera setelah kapal musuh terdeteksi. Tembakan terkoordinasi yang terfokus akan melumpuhkan kapal musuh dalam sekejap. Buru dan tenggelamkan mereka satu per satu."
 subsidiary_carrier_role: "Peran Kapal Induk Pembantu"
 subsidiary_carrier_role_desc: "Kapal induk bertindak sebagai pembantu kapal tempur utama, meningkatkan kesiapsiagaan armada dalam beralih dari postur bertahan ke menyerang. Manfaat kapal induk sebagai mata pengawas di angkasa sekaligus kekuatan pemukul cepat melengkapi kapal tempur utama yang bergerak lebih lambat."
 subsidiary_carrier_role_ti: "Peran Kapal Induk Pembantu"
 subsidiary_carrier_role_ti_desc: "Kapal induk bertindak sebagai pembantu kapal tempur utama, meningkatkan kesiapsiagaan armada dalam beralih dari postur bertahan ke menyerang. Manfaat kapal induk sebagai mata pengawas di angkasa sekaligus kekuatan pemukul cepat melengkapi kapal tempur utama yang bergerak lebih lambat."
 hunter_killer_groups: "Gugus Buru-Binasakan"
 hunter_killer_groups_desc: "Kapal perusak membentuk kelompok terpadu untuk memburu kapal selam musuh. Kolaborasi antara spesialis pengintai dan spesialis pemburu menciptakan tim penghancur bawah air yang sangat tangguh."
 floating_fortress: "Benteng Terapung"
 floating_fortress_desc: "Dengan kapal tempur dalam kesiagaan tertinggi, kita akan selalu siap merespons jika musuh berani mengancam perairan kita. Armada mana pun memerlukan fondasi yang kokoh, dan kedahsyatan kapal tempur utama tiada bandingnya."
 floating_fortress_ti: "Benteng Terapung"
 floating_fortress_ti_desc: "Dengan kapal tempur dalam kesiagaan tertinggi, kita akan selalu siap merespons jika musuh berani mengancam perairan kita. Armada mana pun memerlukan fondasi yang kokoh, dan kedahsyatan kapal tempur utama tiada bandingnya."
 floating_fortress_bs: "Benteng Terapung"
 floating_fortress_bs_desc: "Dengan kapal tempur dalam kesiagaan tertinggi, kita akan selalu siap merespons jika musuh berani mengancam perairan kita. Armada mana pun memerlukan fondasi yang kokoh, dan kedahsyatan kapal tempur utama tiada bandingnya."
 floating_airfield: "Pangkalan Udara Terapung"
 floating_airfield_desc: "Integrasi kapal induk yang lebih matang ke dalam armada laut menjaga kesiapan kita untuk menyerang dari matra laut dan udara sekaligus. Menguasai ruang udara di mana pun kita berlayar adalah kunci kemenangan mutlak."
 floating_airfield_ti: "Pangkalan Udara Terapung"
 floating_airfield_ti_desc: "Integrasi kapal induk yang lebih matang ke dalam armada laut menjaga kesiapan kita untuk menyerang dari matra laut dan udara sekaligus. Menguasai ruang udara di mana pun kita berlayar adalah kunci kemenangan mutlak."
 floating_airfield_bs: "Pangkalan Udara Terapung"
 floating_airfield_bs_desc: "Integrasi kapal induk yang lebih matang ke dalam armada laut menjaga kesiapan kita untuk menyerang dari matra laut dan udara sekaligus. Menguasai ruang udara di mana pun kita berlayar adalah kunci kemenangan mutlak."
 grand_battlefleet: "Armada Tempur Akbar"
 grand_battlefleet_desc: "Pelatihan kepemimpinan memungkinkan para komandan kita tetap berkepala dingin di tengah panasnya kancah pertempuran laut bahkan saat memimpin armada laut raksasa. Armada kita akan melibas setiap lawan secara frontal."
 convoy_sailing: "Pelayaran Konvoi"
 convoy_sailing_desc: "Menerapkan pelayaran konvoi terorganisasi akan mempermudah kita mendeteksi serangan sergapan musuh dan meresponsnya tepat waktu. Keamanan dalam rombongan besar adalah strategi terandal."
 convoy_sailing_ti: "Pelayaran Konvoi"
 convoy_sailing_ti_desc: "Menerapkan pelayaran konvoi terorganisasi akan mempermudah kita mendeteksi serangan sergapan musuh dan meresponsnya tepat waktu. Keamanan dalam rombongan besar adalah strategi terandal."
 convoy_sailing_bs: "Pelayaran Konvoi"
 convoy_sailing_bs_desc: "Menerapkan pelayaran konvoi terorganisasi akan mempermudah kita mendeteksi serangan sergapan musuh dan meresponsnya tepat waktu. Keamanan dalam rombongan besar adalah strategi terandal."
 convoy_escorts: "Pengawal Konvoi"
 convoy_escorts_desc: "Menempatkan kapal permukaan yang lincah sebagai bagian dari rombongan konvoi memungkinkan kita mendeteksi kapal selam musuh dan merespons tepat waktu. Kemampuan deteksi dini adalah kunci melenyapkan ancaman kapal selam."
 convoy_escorts_bs: "Pengawal Konvoi"
 convoy_escorts_bs_desc: "Menempatkan kapal permukaan yang lincah sebagai bagian dari rombongan konvoi memungkinkan kita mendeteksi kapal selam musuh dan merespons tepat waktu. Kemampuan deteksi dini adalah kunci melenyapkan ancaman kapal selam."
 escort_carriers: "Kapal Induk Pengawal"
 escort_carriers_desc: "Cakupan patroli yang luas dari pesawat kapal induk menjadikan tugas pengawalan konvoi dagang jauh lebih mudah. Mengamankan arus logistik dan sumber daya adalah hal yang sangat vital."
 integrated_convoy_defence: "Pertahanan Konvoi Terintegrasi"
 integrated_convoy_defence_desc: "Koordinasi yang lebih solid antara angkatan laut dan udara memungkinkan kita menggempur musuh dari jarak jauh sebelum mereka sempat mendekati konvoi dagang kita. Ini akan secara drastis mendongkrak efektivitas pelayaran konvoi."
 integrated_convoy_defence_bs: "Pertahanan Konvoi Terintegrasi"
 integrated_convoy_defence_bs_desc: "Koordinasi yang lebih solid antara angkatan laut dan udara memungkinkan kita menggempur musuh dari jarak jauh sebelum mereka sempat mendekati konvoi dagang kita. Ini akan secara drastis mendongkrak efektivitas pelayaran konvoi."
 submarine_operations: "Operasi Kapal Selam"
 submarine_operations_desc: "Kita tidak perlu berhadapan langsung secara frontal dengan armada utama musuh untuk memenangkan perang. Serang konvoi dagang mereka sebelum mereka sempat bereaksi, lalu menghilanglah kembali ke bawah permukaan air. Musuh tak akan mampu melawan apa yang tak dapat mereka lihat."
 submarine_operations_bs: "Operasi Kapal Selam"
 submarine_operations_bs_desc: "Kita tidak perlu berhadapan langsung secara frontal dengan armada utama musuh untuk memenangkan perang. Serang konvoi dagang mereka sebelum mereka sempat bereaksi, lalu menghilanglah kembali ke bawah permukaan air. Musuh tak akan mampu melawan apa yang tak dapat mereka lihat."
 undersea_blockade: "Blokade Bawah Air"
 undersea_blockade_desc: "Kapal selam adalah senjata paling ideal untuk memutus arus masuk bahan mentah vital bagi musuh. Kita akan melumpuhkan produksi industri lawan dan menang dengan membuat mereka kelaparan."
 undersea_blockade_bs: "Blokade Bawah Air"
 undersea_blockade_bs_desc: "Kapal selam adalah senjata paling ideal untuk memutus arus masuk bahan mentah vital bagi musuh. Kita akan melumpuhkan produksi industri lawan dan menang dengan membuat mereka kelaparan."
 convoy_interdiction: "Pencegatan Konvoi"
 convoy_interdiction_desc: "Penyempurnaan koordinasi armada kapal selam kita memungkinkan mereka mencegat konvoi dagang di tengah pelayaran. Mengacaukan jalur pasokan musuh akan memberi kita keunggulan strategis yang menentukan."
 convoy_interdiction_ti: "Pencegatan Konvoi"
 convoy_interdiction_ti_desc: "Penyempurnaan koordinasi armada kapal selam kita memungkinkan mereka mencegat konvoi dagang di tengah pelayaran. Mengacaukan jalur pasokan musuh akan memberi kita keunggulan strategis yang menentukan."
 convoy_interdiction_bs: "Pencegatan Konvoi"
 convoy_interdiction_bs_desc: "Penyempurnaan koordinasi armada kapal selam kita memungkinkan mereka mencegat konvoi dagang di tengah pelayaran. Mengacaukan jalur pasokan musuh akan memberi kita keunggulan strategis yang menentukan."
 submarine_offensive: "Ofensif Kapal Selam"
 submarine_offensive_desc: "Mencapai puncak kemahiran komunikasi antar-kapal selam memungkinkan armada bawah air kita beralih ke strategi ofensif penuh. Mari kita tenggelamkan kapal-kapal konvoi dagang musuh lebih cepat daripada kemampuan mereka menggantinya."
 submarine_offensive_bs: "Ofensif Kapal Selam"
 submarine_offensive_bs_desc: "Mencapai puncak kemahiran komunikasi antar-kapal selam memungkinkan armada bawah air kita beralih ke strategi ofensif penuh. Mari kita tenggelamkan kapal-kapal konvoi dagang musuh lebih cepat daripada kemampuan mereka menggantinya."
 trade_interdiction: "Pencegatan Perdagangan"
 trade_interdiction_desc: "Semakin cepat kita memergoki kapal-kapal musuh, semakin lekas kita dapat menenggelamkan mereka. Hantam konvoi dagang lawan dan loloskan diri sebelum mereka sempat merespons.\n\n"
 unrestricted_submarine_warfare: "Perang Kapal Selam Tak Terbatas"
 unrestricted_submarine_warfare_desc: "Beri wewenang kapal selam kita untuk menenggelamkan kapal apa pun tanpa peringatan terlebih dahulu, baik kapal perang maupun sipil. Kendati sebagian pihak menganggap ini melanggar hukum perang, efektivitasnya sama sekali tak terbantahkan."
 wolfpacks: "Kawanan Serigala (Wolfpacks)"
 wolfpacks_desc: "Dengan mengorganisasikan armada kapal selam kita ke dalam kawanan taktis, koordinasi tempur antar-unit meningkat pesat. Begitu musuh terdeteksi, kapal selam kita mengintai sembari menanti kawanan lainnya tiba, lalu menyerang serentak saat keunggulan mutlak berpihak pada kita."
 advanced_submarine_warfare: "Peperangan Kapal Selam Lanjutan"
 advanced_submarine_warfare_desc: "Penyempurnaan komunikasi masif antar-kapal selam memungkinkan koordinasi penyerangan yang terencana sempurna. Saat musuh akhirnya menyadari keberadaan kita, itu terjadi dari atas dek kapal mereka yang sedang tenggelam."
 combined_operations_raiding: "Penyerbuan Operasi Gabungan"
 combined_operations_raiding_desc: "Mengerahkan seluruh sumber daya maritim untuk memburu konvoi dagang musuh. Sinergi antara armada utama dan kapal selam menjadikan armada kita senantiasa waspada penuh. Tiada kapal lawan yang dapat melintas tanpa terdeteksi di laut kita."
 raider_patrols: "Patroli Penyerbu"
 raider_patrols_desc: "Patroli yang memadukan kapal-kapal cepat dan kapal berdaya tembak berat membuat konvoi dagang lawan tak punya tempat bersembunyi.\nBukan hanya kapal selam yang mampu berburu di samudra."
 capital_ship_raiders: "Penyerbu Kapal Tempur Utama"
 capital_ship_raiders_desc: "Dengan kapal-kapal terkuat kita yang turun memburu jalur niaga musuh, konvoi lawan tidak akan lagi menemukan keselamatan dalam jumlah. Mereka hanyalah mangsa empuk yang hanya bisa berdoa agar tidak berpapasan dengan armada kita."
 carrier_operations: "Operasi Kapal Induk"
 carrier_operations_desc: "Kapal induk memungkinkan penerbang kita menyerang di lautan lepas lebih cepat dan lebih mudah dibanding dari pangkalan darat. Kita akan memukul musuh sebelum mereka sempat bereaksi."
 naval_air_operations: "Operasi Udara Angkatan Laut"
 naval_air_operations_desc: "Para penerbang yang dilatih khusus menjalankan misi dari kapal induk membuka jalan baru bagi kita untuk menguasai lautan. Pesawat tempur adalah sarana paling mangkus untuk melumpuhkan armada musuh."
 base_strike: "Serangan Pangkalan (Base Strike)"
 base_strike_desc: "Menggempur pangkalan pelabuhan musuh akan melumpuhkan kemampuan mereka untuk membangun kembali armadanya. Ini memungkinkan kita mendominasi lautan melalui keunggulan jumlah armada mutlak.\n\n"
 carrier_primacy: "Keutamaan Kapal Induk"
 carrier_primacy_desc: "Pesawat modern memiliki daya jangkau dan akurasi yang melampaui meriam kapal perang konvensional. Integrasikan kapal induk ke dalam armada kita dan dominasi samudra langsung dari angkasa."
 carrier_task_forces: "Gugus Tugas Kapal Induk"
 carrier_task_forces_desc: "Gugus tugas terorganisasi yang memadukan kapal induk dan penjelajah ringan memastikan musuh tidak akan pernah bisa menyergap kita secara mendadak."
 massed_strikes: "Serangan Massal"
 massed_strikes_desc: "Para penerbang yang terlatih untuk misi kapal induk akan memungkinkan kapal induk yang padat sekalipun beroperasi dengan mulus, menghujani musuh dan secara drastis mendongkrak efektivitas tempur laut. Kapal induk harus bekerja layaknya mesin terlumasi sempurna di mana setiap awak memahami perannya."
 carrier_battlegroups: "Gugus Tempur Kapal Induk"
 carrier_battlegroups_desc: "Kapal induk mampu menghantam musuh dari jarak yang jauh melampaui meriam laut mana pun, dan dengan mata elang di angkasa kita tak akan pernah tersergap tiba-tiba. Konsentrasi gugus kapal induk adalah kekuatan dahsyat yang wajib diperhitungkan."
 escort_patrols: "Patroli Pengawal"
 escort_patrols_desc: "Meningkatkan kemampuan deteksi menjadikan kapal-kapal pengawal konvoi kita jauh lebih mematikan bagi kapal selam musuh. Tanpa tempat bersembunyi di bawah air, kapal selam lawan tidak lagi menjadi ancaman nyata."
