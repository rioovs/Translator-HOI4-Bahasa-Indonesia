 artillery_folder_desc: "Senjata Artileri, Anti-Tank & Anti-Udara untuk divisi."
 land_doctrine_folder: "Doktrin Darat"
 land_doctrine_folder_desc: "Doktrin darat, cara bertempur pasukan darat Anda."
 naval_folder: "Laut"
