 bicycle_infantry: "Infanteri Sepeda"
 bicycle_infantry_desc: "Infanteri reguler dengan sepeda memiliki mobilitas lebih tinggi dibanding rekan mereka yang berbaris jalan kaki, dengan biaya yang sangat terjangkau."
 torpedo_cruiser_mtg: "Penjelajah Torpedo"
 amphibious_mechanized_infantry: "Traktor Amfibi"
 amphibious_mechanized_infantry_desc: "Traktor Amfibi, atau Amtrac, memungkinkan pendaratan Marinir di pantai dalam perlindungan lapis baja. Namun hal ini harus ditebus dengan konsumsi bahan bakar yang boros."
 amphibious_mechanized_infantry_2: "Traktor Amfibi yang Disempurnakan"
 amphibious_mechanized_infantry_2_desc: "Amtrac generasi ini membawa sejumlah penyempurnaan dibanding versi dasar, seperti tanjakan pintu belakang untuk bongkar muat pasukan yang lebih leluasa di pantai pendaratan."
 amphibious_tank: "Tank Amfibi"
 amphibious_tank_desc: "Tank Amfibi dirancang untuk memberikan bantuan tembakan lapis baja bagi pasukan Marinir selama serbuan pendaratan pantai."
 amphibious_tank_2: "Tank Amfibi yang Disempurnakan"
 amphibious_tank_2_desc: "Generasi kedua tank amfibi menghadirkan perlindungan lapis baja yang lebih kokoh dan daya tembak yang ditingkatkan."
 NAVAL_TITLE_MINES: "PEPERANGAN RANJAU"
 basic_naval_mines: "Ranjau Kontak"
 basic_naval_mines_desc: "Bom apung sederhana yang ditambatkan ke dasar samudra. Ranjau akan meledak saat bersentuhan langsung dengan lambung kapal."
 improved_naval_mines: "Ranjau Magnetik"
 improved_naval_mines_desc: "Ranjau canggih ini meledak saat mendeteksi perubahan medan magnet bumi yang ditimbulkan oleh kapal yang melintas di dekatnya."
 advanced_naval_mines: "Ranjau Akustik"
 advanced_naval_mines_desc: "Jenis ranjau laut ini meledak ketika sensornya mendeteksi frekuensi suara deru mesin kapal di sekitarnya."
 modern_naval_mines: "Ranjau Tekanan"
 modern_naval_mines_desc: "Ranjau mutakhir ini mendeteksi fluktuasi kecil tekanan air laut yang dihasilkan oleh kapal yang bergerak melintas di atasnya."
 degaussing: "Degaussing (Penghilangan Medan Magnet)"
 degaussing_desc: "Dengan memasang kumparan elektromagnetik bertenaga tinggi, jejak tanda magnetik kapal dapat dipangkas secara drastis, menjadikannya jauh lebih kebal dari ancaman ranjau magnetik."
 submarine_mine_laying: "Kapal Selam Penebar Ranjau"
 submarine_mine_laying_desc: "Dengan memasang peralatan khusus untuk menampung dan melepaskan ranjau, kapal selam khusus ini mampu menebar ladang ranjau saat menyelam tanpa terdeteksi oleh musuh."
 improved_submarine_mine_laying: "Penebaran Ranjau Melalui Tabung Torpedo"
 improved_submarine_mine_laying_desc: "Merancang ulang ranjau agar pas dengan tabung torpedo memungkinkan setiap kapal selam bertindak sebagai penebar ranjau, meski harus mengorbankan kapasitas muat torpedo."
 airdrop_mines: "Penebaran Ranjau Udara"
 airdrop_mines_desc: "Dengan melengkapi ranjau parasut kecil, ranjau dapat dijatuhkan dengan aman dari pesawat, memungkinkan pemasangan ladang ranjau laut secara kilat dan efisien."
