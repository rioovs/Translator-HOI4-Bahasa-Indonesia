 TOA_jungle_pioneers_support_tech: "Perintis Hutan Rimba"
 basic_fortification_tech: "Benteng Pertahanan Dasar"
 basic_fortification_tech_desc: "Dengan menggunakan material yang lebih kokoh dan penguat logam di dalam struktur, kita dapat membangun benteng pertahanan yang lebih masif tanpa perlu khawatir akan bahaya runtuh."
 land_fort_tech_1: "Benteng Darat yang Disempurnakan"
 land_fort_tech_1_desc: "Dengan memanfaatkan kontur medan di sekeliling benteng secara lebih cermat dan memadukan teknologi baru, kita dapat memperkokoh struktur yang ada sekaligus memperluas jangkauannya."
 land_fort_tech_2: "Benteng Darat Mutakhir"
 land_fort_tech_2_desc: "Dengan memetik pelajaran dari kelemahan masa lalu dan memperkuat tidak hanya struktur fisik benteng melainkan juga fondasi dasarnya, kita akan mampu membangun kompleks perbentengan raksasa yang sanggup menahan musuh yang paling tangguh sekalipun."
 coastal_fort_tech_1: "Benteng Pesisir yang Disempurnakan"
 coastal_fort_tech_1_desc: "Dengan memanfaatkan kontur daratan di sekeliling perbentengan pesisir secara optimal dan menyematkan teknologi baru, kita dapat memperkuat kubu pertahanan yang ada dan memperluasnya lebih jauh."
 coastal_fort_tech_2: "Benteng Pesisir Mutakhir"
 coastal_fort_tech_2_desc: "Dengan membangun bungker dan kubu pertahanan kita jauh lebih dalam ke tebing karang dan perbukitan pantai, kita dapat mendirikan kompleks pertahanan masif yang memiliki kemampuan menghalau armada invasi laut terbesar sekalipun."
 sp_rockets_improved_guidance: "Pemandu yang Disempurnakan"
 sp_rockets_improved_guidance_desc: "Sistem pemandu yang lebih baik untuk roket akan memungkinkan kita meluncurkan bom terbang lebih jauh, menjadikannya ancaman yang semakin mematikan bagi musuh kita. Dengan menyempurnakan sistem pemandu untuk roket yang lebih kecil, artileri roket kita juga akan mampu meningkatkan akurasi bidikannya."
