 CZE_a_divided_nation_category_2_tt: "§YEfek ketika dipilih§!:\nMembuka §Y$CZE_a_divided_nation_category$§! Keputusan, yang akan §YMenghapus§! Pengubah Status negatif di §YNegara§! kami dan juga akan menurunkan pengubah negatif di §Y$CZE_a_divided_nation_dynamic_modifier$ Semangat Kebangsaan§! sampai §YDihapus§!."
 CZE_a_divided_nation_category_3_tt: "Membuka Keputusan §Y$CZE_a_divided_nation_category$§!, yang akan §YMenghapus§! Pengubah Keadaan negatif di §YNegara§! kami dan juga akan menurunkan pengubah negatif pada §Y$CZE_a_divided_nation_dynamic_modifier$ Semangat Nasional§! hingga tercapai §YDihapus§!."
