 CZE_sudeten_promise_mission: "Janji Sudeten"
 CZE_sudeten_promise_mission_desc: "Dengan mendukung Paramiliter di Sudetenland, kami berjanji untuk mendukung mereka melepaskan diri dari [CZE.GETNAME] dan bergabung dengan kami. Mengingkari janji ini akan menimbulkan reaksi politik."
