 CZE_send_foreign_attaches: "£BoP_right_texticon Kirim Atase Luar Negeri"
 CZE_send_observers_to_the_italo_ethiopian_war: "£BoP_right_texticon Kirim Pengamat ke Ethiopia"
 CZE_send_observers_to_the_italo_ethiopian_war_bonus: "Mengirim Pengamat ke Perang Italia-Ethiopia"
 CZE_send_observers_to_the_italo_ethiopian_war_desc: "Menyelinap ke individu-individu untuk mengamati dan melakukan kontak sekunder dengan orang-orang yang terlibat dalam pertempuran di lapangan akan memberikan wawasan berharga tentang doktrin tentara kontemporer. Ini mungkin juga membuka beberapa peluang lain."
