 CZE_embezzle_quatermaster_funds_desc: "Prajurit kita sudah dirawat dengan baik. Tentu saja tidak ada yang akan memperhatikan atau peduli jika sebagian dana yang dimaksudkan untuk barak kami disalurkan ke tempat lain."
 CZE_prioritize_export_contracts: "£BoP_left_texticon Mengutamakan Kontrak Ekspor"
 CZE_prioritize_export_contracts_desc: "Industri Ekspor kami adalah hal yang membantu kami keluar dari Depresi Besar. Mengapa kita harus mengubah perilaku kita sekarang? Ancaman apa pun terhadap negara kita adalah hal yang berlebihan. Armada mampu menunggu."
 CZE_focus_on_export_designs: "£BoP_left_texticon Fokus pada Desain Ekspor"
 CZE_focus_on_export_designs_desc: "Armada sangat menuntut apa yang mereka inginkan dari desain kami. Pasar ekspor lebih memaafkan dan mereka juga membantu mendanai desain Armada dalam negeri. Jadi pada kenyataannya, Armada seharusnya benar-benar berterima kasih kepada kita atas banyaknya uang yang kita hemat untuk Penelitian dan Pengembangan. Sama-sama Armada."
