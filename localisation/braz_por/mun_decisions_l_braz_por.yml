 ###FORT DECISIONS###
 CZE_the_second_fortification_program_category: "Program Fortifikasi"
 CZE_the_second_fortification_program_category_desc: "Perbatasan negara kita yang kurang menguntungkan merupakan masalah keamanan nasional yang mendesak. Negara-negara di sekitar kita telah memperjelas bahwa mereka mempunyai rencana untuk mengubah perbatasan kita demi kepentingan mereka. Terus memperkuat perbatasan kita akan membuat musuh berpikir dua kali sebelum menyerang kita."
 CZE_fate_of_the_ro: "Nasib Dewan Fortifikasi"
 CZE_fate_of_the_ro_desc: "Dewan Fortifikasi bertugas mengumpulkan dana terkait dengan proyek fortifikasi kami. Jika dana tersebut tidak digunakan dalam waktu dekat, masyarakat akan mulai mempertanyakan mengapa dana tersebut dikumpulkan."
 CZE_bop_army_bunker_maintenance: "Upaya Pemeliharaan Fortifikasi"
 CZE_bop_army_bunker_maintenance_desc: "Jika benteng kita dirawat dengan baik dan siap digunakan akan memastikan bahwa tentara yakin terhadap benteng tersebut jika mereka perlu diawaki."
 CZE_fortification_research: "Penelitian Fortifikasi"
 CZE_fortification_research_desc: "Kebutuhan untuk membentengi perbatasan kita sudah jelas, namun pertanyaannya adalah bagaimana caranya? Penelitian akan membantu kita menjawab pertanyaan ini."
 CZE_fortification_research_tt: "Memiliki semangat kebangsaan §Y$CZE_directorate_of_fortification_works_no_gd_idea$§!"
 CZE_fortification_research_subtract_variable_tt: "Semua Keputusan §YProgram Fortifikasi§! di masa mendatang akan memakan waktu §Y30§! hari lebih sedikit hingga §YSelesai§!"
 CZE_fortification_decision_inprogress: "Sudah mengerjakan program fortifikasi lainnya"
 CZE_second_sudetenland_fortification_program: "Program Fortifikasi Sudetenland Kedua"
 CZE_second_sudetenland_fortification_program_desc: "Sudetenland, perbatasan pegunungan kami dengan Jerman, adalah tempat yang sempurna untuk benteng perbatasan. Setelah mempelajari garis Maginot Prancis, kita dapat membuat garis serupa milik kita sendiri."
 CZE_third_sudetenland_fortification_program: "Program Fortifikasi Sudetenland Ketiga"
 CZE_third_sudetenland_fortification_program_desc: "Sudetenland sekarang memiliki garis pertahanan yang bagus, tapi bagus saja tidak cukup jika kelangsungan hidup nasional kita dipertaruhkan."
 CZE_fourth_sudetenland_fortification_program: "Program Fortifikasi Sudetenland Keempat"
 CZE_fourth_sudetenland_fortification_program_desc: "Sudetenland mempunyai sistem benteng yang kuat, namun harus tetap lebih kuat."
 CZE_fortify_the_crossroads_with_slo: "Perkuat Persimpangan Jalan"
 CZE_fortify_the_crossroads_with_slo_desc: "Sistem benteng apa pun bisa dipatahkan. Untuk mencegah kemungkinan ini, kita dapat membangun titik-titik kuat di sekitar kota-kota terpenting kita sehingga kota-kota tersebut tidak mudah direbut oleh musuh yang menerobos garis pertahanan kita."
 CZE_fortify_the_hungarian_border_with_73: "Perkuat Perbatasan Hongaria"
 CZE_fortify_the_hungarian_border_with_73_desc: "Iridentisme Hongaria merupakan ancaman terus-menerus terhadap negara kita, sistem benteng di sepanjang perbatasan kita akan membantu menjamin keselamatan kita."
 CZE_fortify_the_polish_border_with_72: "Perkuat Perbatasan Polandia"
 CZE_fortify_the_polish_border_with_72_desc: "Agresi Polandia tidak mengenal batas, namun diharapkan perbatasan yang dibentengi dengan baik akan membuat mereka mencari sasaran yang lebih mudah."
