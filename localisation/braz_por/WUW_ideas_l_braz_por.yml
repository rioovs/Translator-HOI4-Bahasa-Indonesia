 ############# HUNGARY ###############
 #####################################
 HUN_gombos_trade_treaty: "Perjanjian Perdagangan Gömbös"
 HUN_gombos_trade_treaty_desc: "Perjanjian perdagangan yang ditandatangani Gyula Gömbös dengan Jerman pada tahun 1934 penting untuk menstimulasi perekonomian kita dan membantu pemulihan dari depresi besar, namun perjanjian ini juga memiliki kelemahan yang besar. Meskipun perjanjian tersebut memberi kami harga yang menguntungkan untuk penjualan gandum, uang yang diperoleh harus tetap berada di rekening di Jerman dan hanya digunakan untuk membeli barang-barang industri Jerman. Jika hal ini terus berlanjut, Jerman akan mampu mencapai dominasi ekonomi atas negara kita."
 HUN_hungarian_national_defense_association: "Asosiasi Pertahanan Nasional Hongaria"
 HUN_hungarian_national_defense_association_desc: "Organisasi sayap kanan yang sebagian besar bersifat paramiliter M.O.V.E. yang dibentuk pada tahun 1919, sebagian besar setia kepada pemimpin dan tokoh pendirinya Gyula Gömbös. Meskipun demikian, mereka juga sangat menghormati Miklós Horthy, karena sikap anti-komunisnya yang kuat."
 HUN_levente_associations: "Asosiasi Levente"
 HUN_levente_associations_desc: "Masyarakat kami telah membentuk organisasi pemuda paramiliter yang dikenal sebagai Levente. Mereka, dengan kedok pelatihan fisik dan kesehatan, mempersiapkan pemuda Hongaria baik di dalam maupun di luar perbatasan kami untuk berperang, dan pada akhirnya merebut kembali tanah kami yang sah."
 HUN_forceful_industrial_revitalization: "Revitalisasi Industri yang Kuat"
 HUN_forceful_industrial_revitalization_desc: "Pemerintah telah mengambil langkah drastis untuk memastikan industri nasional dapat bangkit kembali. Namun hanya waktu yang akan membuktikan apakah tindakan ini akan terbukti berhasil."
 HUN_revaluing_the_pengo: "Menilai kembali Pengő"
 HUN_revaluing_the_pengo_desc: "Mata uang [HUN.GetAdjective], Pengő, saat ini sedang dalam proses revaluasi dalam upaya untuk memperkuat perekonomian dan mengatasi krisis inflasi, meskipun merupakan ukuran yang tidak populer."
 HUN_hungarian_autarky_idea: "Autarki Hongaria"
 HUN_hungarian_autarky_idea_desc: "Jika bangsa mereka ingin bertahan hidup sendiri. dikelilingi oleh musuh, negara tersebut harus belajar memproduksi sendiri semua yang dibutuhkannya, meskipun biaya produksi tersebut tinggi."
 HUN_agrarian_tradition: "Tradisi Pertanian Hongaria"
 HUN_agrarian_tradition_desc: "Tradisi pertanian kebanggaan kami sudah ada sejak lama, bahkan sebelum kami tiba di tempat yang sekarang kami sebut rumah ini. Kita harus menghargai tradisi-tradisi ini dan mempromosikannya semaksimal mungkin."
 wuw_HUN_not_has_trianon_for_laws_tt: "Tidak mempunyai semangat kebangsaan §YPerjanjian Trianon§!"
 HUN_rapid_army_expansion: "Ekspansi Tentara yang Cepat"
 HUN_rapid_army_expansion_desc: "Saat perang mendekat di Eropa, setiap orang harus bersiap untuk mempertahankan tanah airnya kapan saja. Sudah saatnya orang [HUN.GetAdjective] memahami sentimen ini, dan siap membantu saat kita membutuhkannya."
 HUN_modify_academy_of_sciences_ns_intro: "Ubah §Y$HUN_academy_of_sciences$§! dengan"
 HUN_academy_of_sciences: "Akademi Ilmu Pengetahuan Hongaria"
 HUN_academy_of_sciences_desc: "Dengan investasi pada perluasan Akademi Ilmu Pengetahuan [ROOT.GetAdjective], bangsa kita akan mampu memproses secara teknologi lebih cepat dibandingkan pesaing kita."
 HUN_gombos_trade_treaty_tt: "Perjanjian Perdagangan Gömbös memungkinkan kita berdagang dengan Jerman"
 HUN_hungarian_gendarmerie: "Magyar Királyi Csendőrség"
 HUN_hungarian_gendarmerie_desc: "Untuk menjaga perbatasan dan para pemimpin kita aman dari bahaya, gendarmerie paramiliter kita harus diperluas dan diberi lebih banyak wewenang untuk bertindak sendiri."
 HUN_hungarian_gendarmerie_hussars: "Gendarmerie Legiun Hitam"
 HUN_hungarian_gendarmerie_hussars_desc: "Untuk menjaga perbatasan dan para pemimpin kita aman dari bahaya, gendarmerie paramiliter kita harus diperluas dan diberi lebih banyak wewenang untuk bertindak sendiri."
 cat_air_bombs: "Bom udara"
 cat_air_engine: "Mesin pesawat"
 mio_cat_artillery: "Artileri"
 HUN_recon_airplane_focus: "Fokus Pesawat Pengintai"
 HUN_recon_airplane_focus_desc: "[ROOT.GetNameDefCap] saat ini sedang berinvestasi besar-besaran dalam pengembangan dan penggunaan pesawat pengintai, untuk mengawasi musuh-musuh mereka dengan baik."
 HUN_rapid_army_groups_idea: "Kelompok Tentara Cepat"
 HUN_rapid_army_groups_idea_desc: "Pasukan kami telah diorganisasi ulang agar dapat mencapai lokasi yang diperlukan secepat mungkin, pada waktu tertentu."
 HUN_pan_ugric_volunteer_force: "[ROOT.GetAdjective] Pasukan Relawan"
 HUN_pan_ugric_volunteer_force_desc: "Semangat kami baru-baru ini dalam membantu saudara-saudara Finno-Ugric kami telah mendorong perekrutan relawan [ROOT.GetAdjective] yang ingin bergabung dalam perjuangan di luar negeri."
 HUN_GER_trade_modifier: "Perjanjian Perdagangan Hongaria-Jerman"
 HUN_POL_friendship_modifier: "Polandia dan Hongaria — dua teman baik, berkelahi, dan minum-minum pada akhirnya"
 HUN_restricted_voting_rights: "Hak Pilih yang Dibatasi"
 HUN_restricted_voting_rights_desc: "Membatasi hak pilih masyarakat mungkin bukan merupakan langkah yang populer, namun hal ini diperlukan untuk membendung ideologi komunis dan liberal yang sedang berkembang di negara ini."
 HUN_crackdown_on_extremism: "Penindasan terhadap Ekstremisme"
 HUN_crackdown_on_extremism_desc: "Sebagai bagian dari reformasi anti-ekstremis baru perdana menteri Kálmán Darányi, Ferenc Szálasi telah ditangkap dan Partai Kehendak Nasional, partai politik sosialis nasionalnya telah dilarang."
 HUN_power_to_the_regent_idea: "Kekuasaan kepada Bupati"
 HUN_power_to_the_regent_idea_desc: "Dengan disahkannya Statuta XIX, lebih banyak kekuasaan telah diberikan kepada bupati [ROOT.GetNameDef] dan kesetiaan rakyat terletak pada pemimpin besar mereka Miklós Horthy."
 HUN_turul_association_idea: "Asosiasi Turul"
 turanist_connections_op_modifier: "Koneksi Turanis"
 HUN_old_hungary_reclaimed: "Hongaria Raya Dipulihkan"
 HUN_old_hungary_reclaimed_desc: "Akhirnya, kami telah menghilangkan penghinaan yang dipaksakan kepada kami oleh Perjanjian Trianon, karena kami telah berhasil merebut kembali milik kami!"
 HUN_promoted_hungarianism: "Mempromosikan Hongaria"
 HUN_promoted_hungarianism_desc: "Untuk memberikan pelayanan terbaik bagi kepentingan nasional kita, kita harus mendukung gerakan Hongaria, dan memastikan bahwa rakyat kita mengetahui masa depan kita."
 HUN_promises_of_peace: "Janji Perdamaian"
 HUN_promises_of_peace_desc: "Untuk menenangkan kekuatan Entente Kecil, kita harus berjanji untuk tidak melakukan militerisasi atau melakukan ekspansi secara agresif, yang menyebabkan terhambatnya jumlah angkatan bersenjata untuk sementara waktu."
 HUN_supporting_carlists: "Dukungan untuk Penyebab Carlist"
 HUN_following_entente_stipulations: "Sesuai dengan Ketentuan Entente Kecil"
 HUN_bastion_of_catholicism: "Benteng Katolik"
 HUN_bastion_of_catholicism_desc: "Bangsa kita menganut agama Katolik yang taat, dan tentara kita akan berperan sebagai penjaga iman yang besar, hamba dari Yang Mulia sendiri."
 HUN_a_multi_ethnic_empire: "Kerajaan Multi-Etnis"
 HUN_a_multi_ethnic_empire_desc: "Kekaisaran kami mencakup banyak orang dan budaya yang berbeda, dan ini adalah sesuatu yang kami anut sepenuhnya, memberikan otonomi besar kepada berbagai wilayah di wilayah kami, membuat rakyat kami ingin tetap menjadi bagian dari kami."
 HUN_revenge_for_brusilov_idea: "Balas dendam atas Serangan Brusilov"
 HUN_payments_from_hungary_idea: "Pembayaran dari [HUN.GetNameDef]"
 HUN_apostolic_kingdom_idea: "Kerajaan Apostolik"
 HUN_apostolic_kingdom_idea_desc: "Seperti yang telah diberi gelar selama berabad-abad sejak Santo Stefanus, Yang Mulia Apostolik kita jelas merupakan rasul Kekristenan zaman akhir, memegang klaim atas seluruh tanah Kristen, dan mempunyai hak untuk memerintah atas nama Putra. Kita harus merebut kembali semua yang menjadi hak kita!"
 HUN_horthyist_royal_guard: "Pengawal Kerajaan"
 HUN_the_volksbund_idea: "Volksbund"
 HUN_the_volksbund_idea_desc: "Volksbund adalah organisasi etnis [GER.GetAdjective] yang terkait dengan DNSAP di negara kita. Mereka mendapat dana dari [GER.GetNameDef], dan menjalankan tugas mereka di negara kita."
