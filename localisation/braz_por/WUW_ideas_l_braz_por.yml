 GER_stasi_modifier: "Stasi"
 GER_stasi_modifier_desc: "Ministerium für Staatssicherheit, atau Stasi, akan memastikan bahwa pengumpulan, pemrosesan, dan analisis informasi keamanan nasional akan dilakukan secara efisien dan cepat. Stasi akan melindungi negara kita dari ancaman dari dalam maupun luar dan akan bertindak sebagai Perisai dan Pedang Partai."
