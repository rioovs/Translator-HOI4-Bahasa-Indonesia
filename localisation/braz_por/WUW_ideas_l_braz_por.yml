 ###### AUSTRIAN NATIONAL SPIRITS (DYNAMIC MODIFIERS) ######
 AUS_austrofascism: "Austrofasisme"
 AUS_austrofascism_desc: "Menolak parlementerisme demokratis barat dan beroperasi sebagai negara korporat, Front Vaterländische mendapati diri mereka sebagai satu-satunya partai yang berkuasa. Konstitusi telah disusun ulang untuk mengarahkan Austria ke arah Korporatisme, Otoritarianisme, dan Nasionalisme."
 AUS_habsburg_monarchy_restored: "Monarki Habsburg Dipulihkan"
 AUS_austrian_monarchy_restored: "Monarki Austria Dipulihkan"
 AUS_habsburg_monarchy_restored_desc: "Sebagai sebuah monarki [AUS.GetNameDef] adalah kekuatan besar di benua Eropa. Dengan mengembalikan monarki, kita akan menjadi seperti itu lagi!"
 AUS_farr: "Republik Austria Pertama Dibangkitkan Kembali"
 AUS_farr_desc: "Dengan menghapuskan Konstitusi Mei dan sekali lagi mengizinkan partai politik serta menyelenggarakan pemilu, [AUS.GetNameDef] telah menghidupkan kembali apa yang dianggap sebagai republik yang telah lama hilang."
 AUS_doth: "Pertahanan NKRI"
 AUS_doth_desc: "Adalah kewajiban setiap [AUS.GetAdjective] untuk melakukan bagiannya dalam membela tanah air, di tentara, di pabrik atau di lokasi konstruksi. Menyerukan upaya bersama bangsa, tanah air akan dilindungi!"
 AUS_aggression: "Agresi Austria"
 AUS_aggression_desc: "Berdiam diri dan berharap tidak diserang adalah pendekatan yang tidak aman di saat seperti ini. Untuk memastikan kita tidak lengah, kita harus bersiap menyerang terlebih dahulu."
 AUS_austromarxism: "Austromarxisme"
 AUS_austrostalinism: "Austrostalinisme"
 AUS_austrotrotskyism: "Austrotrotskisme"
 AUS_austromarxism_desc: "Agenda Austromarxis, berdasarkan tulisan Otto Bauer, menganjurkan jalan tengah antara sosial demokrasi dan komunisme soviet. Setelah mengalami perubahan yang sangat signifikan dari keadaan Austrofasisme sebelumnya, negara ini kini sejalan dengan apa yang dimaksud dengan komunisme dan apa yang dimaksud dengan demokrasi."
 AUS_austrostalinism_desc: "Terombang-ambing dari jalan tengah Austromarxis dan sejak lama menghapuskan Austrofascisme [AUS.GetNameDef] kini mengikuti serangkaian ide Stalinis yang ketat."
 AUS_austrotrotskyism_desc: "Terombang-ambing dari jalan tengah Austromarxis dan sejak lama menghapuskan Austrofascisme [AUS.GetNameDef] kini mengikuti serangkaian ide Trotskis yang ketat."
 AUS_peoples_army: "Tentara Rakyat"
 AUS_peoples_army_desc: "Mengumpulkan massa telah menghasilkan kehadiran milisi yang kuat di negara tersebut. Milisi sangat terlatih dan diperlengkapi dengan baik untuk dapat berkumpul dengan begitu cepat. Hasilnya, perekrutan menjadi tentara reguler juga mendapat dorongan."
 AUS_empire_restored: "Kekaisaran Austria Dipulihkan"
 AUS_empire_restored_desc: "Dia dulunya adalah sebuah Kekaisaran, dia akan menjadi sebuah Kekaisaran! Setelah merebut kembali sebagian besar [AUS.GetAdjective] kekaisaran yang lama telah direformasi."
 AUS_airforce: "Österreichische Luftstreitkräfte"
 AUS_army: "Österreichisches Bundesheer"
 AUS_army_monarchy: "Österreichische Landwehr"
 AUS_navy: "Österreichische Kriegsmarine"
 AUS_compensation_for_guarantee: "Kompensasi atas Dukungan Asing"
 AUS_compensation_for_guarantee_desc: "Memiliki negara lain yang mendukung kami tidaklah murah. Dengan menawarkan untuk mengurus beberapa produksi barang konsumsi mereka, kami telah berhasil membeli dukungan mereka jika hal terburuk terjadi."
