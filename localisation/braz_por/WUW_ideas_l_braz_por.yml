 #TIMED SPIRITS
 GER_collect_scrap_metal_ns_desc: "Kami telah meluncurkan kampanye nasional untuk mengumpulkan sebanyak mungkin besi tua untuk membantu upaya persenjataan kembali kami."
 GER_import_tariffs_ns_desc: "Penetapan tarif impor merupakan tindakan yang diperlukan untuk mendorong pertumbuhan manufaktur dan produksi dalam negeri, namun yang lebih penting, hal ini akan menghemat uang kita yang berharga karena kita tidak perlu mengeluarkan sedikit devisa yang kita miliki."
 GER_knickebein: "Knickebein"
 GER_knickebein_desc: "Terobosan kami dengan sistem navigasi Knickebein telah memungkinkan kami menyempurnakan keakuratan pesawat pengebom kami dengan ketepatan yang tak tertandingi dalam menargetkan posisi musuh - bahkan selama serangan malam hari."
 GER_defense_of_the_reich_ns_desc: "Kami akan mengamankan langit di atas [ROOT.GetNameDef] dan melindungi industri dan masyarakatnya. Tidak ada pembom musuh yang akan menembus tembok surgawi kita yang terdiri dari para pejuang yang bersemangat!"
 GER_the_kammhuber_line: "Jalur Kammhuber"
 GER_the_kammhuber_line_desc: "Kita tidak bisa membiarkan pembom dan pesawat tempur musuh berkeliaran bebas di langit di atas [ROOT.GetNameDef]. Dengan membangun sistem rumit sinyal radar yang tumpang tindih, kita akan mencegatnya sebelum mencapai pusat wilayah kita."
 GER_nachtjagdgeschwader: "Nachtjagdgeschwader"
 GER_nachtjagdgeschwader_desc: "Nachtjagdgeschwader, atau Skuadron Tempur Malam Hari, akan memburu dan menghancurkan pesawat musuh yang berani melintasi perbatasan kita. Skuadron ini mendominasi langit malam, mengamankan tanah air kita dari pembom musuh dalam kegelapan."
 GER_tragergruppen_ns: "Grup Besar"
 GER_tragergruppen_ns_desc: "Pelatihan dan perlengkapan Trägergruppen tertentu, Grup Pengangkut, akan memastikan dominasi kami di angkasa di atas lautan yang tak berujung."
 GER_cruiser_warfare_ns_desc: "Kapal penjelajah kita mendatangkan malapetaka pada armada komersial musuh kita di laut lepas. Hal ini tentu akan membuat industri mereka terpuruk."
 GER_panzerschiff_raiders_ns_desc: "Kapal penjelajah berat kita merupakan ancaman serius bagi angkatan laut musuh kita. Senjata mereka cukup kuat, sementara kecepatannya memungkinkan mereka untuk lolos sebelum digunakan dengan benar."
 GER_rudeltaktik_ns: "Rudeltaktik"
 GER_rudeltaktik_ns_desc: "Kelompok serigala U-boat kami menjelajahi lautan, mencari mangsa baru untuk diburu. Penggunaan Rudeltaktik memungkinkan mereka berkoordinasi dan menyerang leher musuh dengan lebih baik; ketergantungan mereka pada gelombang terbuka."
 GER_german_trade_ns: "Perdagangan Jerman"
 GER_german_trade_offshore_tt: "([ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!) Tambahkan §G1§! offmap §Y$industrial_complex$§!."
 GER_development_of_economic_relations_ns: "Perkembangan Hubungan Ekonomi"
 GER_gestapo_ns: "Gestapo"
 GER_german_development_aid: "Bantuan Pembangunan Jerman"
 GER_german_exploitation: "Eksploitasi Jerman"
 GER_the_inner_circle_dm: "Lingkaran Dalam"
 GER_the_inner_circle_dm_desc: "Lingkaran Dalam Führer berisi elit politik [GER.GetNameDef], loyalis setia yang siap memajukan visi [GER.GetLeader]. Penuh dengan ambisi, mereka semua berusaha untuk Naik ke Lingkaran Dalam untuk menjadi Reichsleiter, Pemimpin Reich. Pengaruh mereka membentuk keputusan militer, industri, dan politik serta mendorong pembuatan kebijakan Jerman. Dorongan mereka juga menjadi sumber ketegangan, karena ambisi mengarah pada intrik dan pengkhianatan."
 GER_the_inner_circle_dm_tt: "Aktif §YLingkaran Dalam§! Pembimbing :\n[GetAscendedAdvisor1][GetAscendedAdvisor2][GetAscendedAdvisor3]"
 GER_the_inner_circle_tt_ascended_advisor_1: "§Y[GetAscendedAdvisorName1]§! sebagai [GetAscendedAdvisorDesc1]" #[GetAscendedAdvisorTrait1]
 GER_the_inner_circle_tt_ascended_advisor_2: "§Y[GetAscendedAdvisorName2]§! sebagai [GetAscendedAdvisorDesc2]"
 GER_the_inner_circle_tt_ascended_advisor_3: "§Y[GetAscendedAdvisorName3]§! sebagai [GetAscendedAdvisorDesc3]"
 GER_war_preparations_tt: "Kali berikutnya §Y[ROOT.GetNameDef]§! adalah di §YWar§!:"
 GER_strengthened_supply_lines_ns: "Jalur Pasokan yang Diperkuat"
 GER_nordische_legion_ns: "Legiun Nordische"
 GER_nordische_legion_ns_desc: "Banyak [ROOT.GetAdjective] yang mendambakan petualangan, dan ingin berjuang demi tujuan baik. Untuk mencapai tujuan tersebut, kami telah membentuk legiun sukarelawan yang akan berangkat membantu saudara-saudara kita di Nordik dalam peperangan mereka."
 GER_fernostliche_legion_ns: "Legiun Fernöstliche"
 GER_fernostliche_legion_ns_desc: "Banyak [ROOT.GetAdjective] yang mendambakan petualangan, dan ingin berjuang demi tujuan baik. Untuk mencapai tujuan tersebut, kami telah membentuk legiun sukarelawan yang akan berangkat membantu teman [CHI.GetAdjective] kami dalam perang mereka."
 GER_expatriated_communists_return_home_ns: "Komunis Ekspatriat Kembali ke Rumah"
 GER_expatriated_communists_return_home_ns_desc: "Banyak komunis Jerman yang dipaksa keluar dari Jerman pada masa pemerintahan Nazi kini kembali secara massal untuk melawan mantan penindas mereka."
 GER_expatriated_communists_return_home_supressed_ns: "Komunis Ekspatriat Kembali"
 GER_expatriated_communists_return_home_supressed_ns_desc: "Banyak komunis Jerman yang dipaksa keluar dari negaranya pada masa pemerintahan Nazi kini kembali secara massal ke Jerman, meskipun pemerintahan militer memiliki sifat anti-komunis yang terbuka."
 GER_bismarckjugend_idea: "Bismarckjugend"
 GER_bismarckjugend_idea_desc: "Partai Rakyat Nasional Jerman telah mereformasi Bismarckjugend dalam upaya untuk memasukkan lebih banyak orang ke dalam tentara sebagai bagian dari sayap paramiliter."
 GER_eiserne_front_idea: "Depan Eiserne"
 GER_eiserne_front_idea_desc: "Dalam upaya untuk mencoba dan mengatasi musuh mereka, negara Jerman telah memilih untuk secara resmi mempekerjakan dan mempromosikan Iron Front, sebuah organisasi paramiliter sosial-demokrasi."
 GER_pacific_blitzkrieg: "Serangan kilat Pasifik"
 GER_proud_eagle_that_ate_the_sun: "Elang Bangga yang Memakan Matahari"
 GER_chi_ger_trade: "[CHI.GetAdjective]-[GER.GetAdjective] Kesepakatan Dagang"
 GER_shatter_USA_hegemony: "Hancurkan Hegemoni [USA.GetAdjective]"
 GER_eben_emael_partial_success_ns: "Serangan terhadap Eben Emael berhasil sebagian"
 GER_eben_emael_partial_success_ns_desc: "$GER_eben_emael_success_ns_desc$"
 GER_eben_emael_success_ns: "Serangan sukses terhadap Eben Emael"
 GER_eben_emael_success_ns_desc: "Serangan yang direncanakan dengan hati-hati ke benteng di Eben Emael telah membuat [BEL.GetAdjective] rentan terhadap serangan kami. Sekarang adalah waktu yang tepat bagi kita untuk melancarkan serangan besar-besaran."
 GER_battle_for_air_superiority: "Pertempuran untuk Keunggulan Udara"
 #Democratic/Kaiserreich
 GER_the_shield_of_democracy_idea: "Perisai Demokrasi"
 GER_the_shield_of_democracy_idea_desc: "Bangsa kita berdiri sebagai perisai nilai-nilai demokrasi Barat, dan siap melindungi rakyat dan sekutunya dari segala bentuk tirani otoriter."
 reaffirmed_the_locarno_treaty: "Menegaskan kembali Perjanjian Locarno"
 our_democratic_allies_opm: "Sekutu Demokrat kita"
 GER_all_for_the_front_idea: "Semua untuk Front!"
