 HUN_state_protection_authority_ns: "Államvédelmi Hatóság"
 HUN_state_protection_authority_ns_desc: "Badan intelijen kami akan membantu mencegah serangan spionase asing terhadap kami, serta meningkatkan ambisi internasional kami."
 HUN_state_protection_authority_ns_vanilla: "Államvédelmi Hatóság"
 HUN_state_protection_authority_ns_vanilla_desc: "Badan intelijen kami akan membantu mencegah serangan spionase asing terhadap kami, serta meningkatkan ambisi internasional kami."
 HUN_great_bulwark_against_the_west_ns: "Benteng Besar"
 HUN_habsburg_restored_desc: "Sejak tahun 1526, negara kita telah diperintah oleh dinasti Habsburg, karena mereka memegang klaim ilahi atas tanah kita. Dengan pemulihan monarki, sudah saatnya kita memastikan bahwa mereka akan tetap ada, dan bangsa kita tidak akan lagi jatuh ke dalam kebobrokan republik."
 HUN_promoting_entrepreneurship: "Kewirausahaan yang Dipromosikan"
 HUN_the_dragon_movement_idea: "Gerakan Naga"
