 ###### CONGO #############################
 COG_colonial_maritime_company: "Perusahaan Belge Maritime du Kongo"
 BEL_colonial_maritime_company: "Perusahaan Belge Maritime du Kongo"
 COG_rawji_group: "Grup Rawji"
 COG_ccci: "Perusahaan Kongo untuk Perdagangan dan Industri"
 COG_forminiere: "Société Internationale Forestière et Minière du Kongo"
 COG_transports_et_ports: "Société Commerciale des Transports dan des Ports"
 COG_force_publique: "Paksa Publik"
 COG_force_publique_desc: "Force Publique adalah kekuatan gendarmerie dan militer Kongo, yang didirikan pada tahun 1877 di bawah Negara Bebas Kongo. Perwiranya seluruhnya orang Eropa, baik itu orang Belgia atau tentara bayaran, sedangkan prajurit umumnya sebagian besar berasal dari Kongo. Kekuatan ini sangat efektif dalam melawan ketika diperlukan, namun kesenjangan dan manajemen yang buruk merupakan titik ketidakpuasan yang besar."
 COG_the_invisible_roof: "Atap Tak Terlihat"
 COG_the_invisible_roof_desc: "Meskipun tidak ada undang-undang yang meresmikan hal ini, sebagian besar, jika tidak semua, institusi dan perusahaan di [ROOT.GetNameDef] menghalangi warga asli Kongo untuk naik ke jenjang tertentu, dan mereka tidak diperbolehkan mengenyam pendidikan tinggi."
 COG_belgian_congo_colonial_dynamic_modifier: "Koloni Model"
 COG_belgian_congo_colonial_dynamic_modifier_desc: "[ROOT.GetNameDefCap] adalah koloni model dari penguasanya, dan dengan demikian menerima investasi yang sepadan, karena penguasanya juga mendapatkan keuntungan dari pengembangan lebih lanjut.\n§RSemangat ini akan hilang jika Kongo tidak lagi menjadi bagian dari Belgia§!"
 warning_this_idea_can_be_removed_tt: "§RSemangat ini akan dihilangkan jika [COG.GetNameDef] tidak lagi menjadi koloni§!"
 COG_forminiere_idea: "Surplus Ekonomi Forminière"
 COG_copper_cartridges_idea: "Kartrid Tembaga"
 COG_copper_cartridges_small_idea: "Kartrid Tembaga"
 COG_heat_resistant_cobalt_idea: "Kobalt Tahan Panas"
 COG_heat_resistant_cobalt_small_idea: "Kobalt Tahan Panas"
