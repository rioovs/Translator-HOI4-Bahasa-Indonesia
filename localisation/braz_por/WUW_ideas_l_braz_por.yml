 BEL_inflation_controls_ns_desc: "Dalam upaya mengurangi dampak inflasi, kami mulai membeli uang tunai dan tidak mengeluarkan uang kertas pengganti untuk mata uang yang rusak, mengubah suku bunga, dan mendorong pengeluaran dalam perekonomian."
 BEL_language_barriers_ns: "Hambatan Bahasa"
 BEL_language_barriers_ns_desc: "Belgia terbagi menjadi dua kelompok bahasa: Prancis, yang dituturkan oleh penduduk wilayah Walloon, dan Belanda, yang dipraktikkan oleh orang Flemish. Masing-masing pihak sangat bangga dengan budaya dan warisan mereka, dan bahasa terikat erat dengan hal ini sehingga tidak ada yang ingin menyerahkan bahasa mereka, atau melihat lidah mereka tunduk pada yang lain."
 BEL_language_barriers_fas_nl_ns: "Keutamaan Bahasa Belanda"
 BEL_language_barriers_fas_nl_ns_desc: "Bahasa Belanda telah dipilih sebagai bahasa utama untuk dipraktikkan di [ROOT.GetName], dengan budaya Flemish dipromosikan dan budaya Walloon ditindas atas nama persatuan."
 BEL_language_barriers_fas_fr_ns: "Keutamaan Bahasa Perancis"
 BEL_language_barriers_fas_fr_ns_desc: "Bahasa Prancis telah dipilih sebagai bahasa utama untuk dipraktikkan di [ROOT.GetName], dengan budaya Walloon dipromosikan dan bahasa Flemish ditindas atas nama persatuan."
 BEL_traditional_family_values_ns: "Nilai-Nilai Keluarga Tradisional"
 BEL_traditional_family_values_ns_desc: "Keluarga adalah salah satu aspek terpenting dalam kehidupan seseorang, dan kami mematuhi serangkaian standar tertentu terkait hal ini. Terdapat definisi mengenai peran dan harapan gender dalam unit keluarga, dan hal ini diarahkan pada pertumbuhan dan stabilitas populasi kita."
 BEL_defensive_neutrality_capstone_ns: "Reorganisasi Defensif"
 BEL_defensive_neutrality_capstone_ns_desc: "Kita telah melakukan apa yang kita bisa untuk bersiap menghadapi invasi, satu-satunya hal yang perlu dilakukan adalah mengidentifikasi perubahan doktrinal yang lebih strategis dan tingkat tinggi yang diarahkan pada garis pemikiran defensif yang paling modern."
 BEL_lack_of_junior_officers_ns: "Kurangnya Perwira Muda"
 BEL_lack_of_junior_officers_ns_desc: "Mobilisasi pasukan kita yang cepat secara umum telah mengalami kemajuan yang baik kecuali satu masalah: kurangnya perwira junior untuk mengorganisir rekrutan baru kita! Diperlukan waktu beberapa saat bagi hierarki militer untuk menata ulang dirinya."
 BEL_legacy_of_the_great_war_ns: "Warisan Perang Besar"
 BEL_legacy_of_the_great_war_ns_desc: "Ladang Flanders menyaksikan beberapa pertempuran paling sengit di Front Barat, wilayah yang dipertahankan dengan sengit oleh Raja Albert, prajurit Belgianya yang pemberani, dan melalui pengorbanan sekutu kita. Kita harus menghormati kenangan ini, dan berusaha untuk menjunjung tinggi teladan mereka."
 BEL_pressurized_cabins_ns: "Kabin Bertekanan"
 BEL_pressurized_cabins_ns_desc: "Untuk lebih menutup jarak antara Belgia dan wilayah kolonial kami di Kongo, kami telah memelopori penggunaan kabin bertekanan untuk pesawat kami."
 BEL_license_air_idea: "Lisensi Udara"
 BEL_license_air_idea_desc: "Kami perlu mendapatkan pesawat dengan cepat, jadi kami telah menandatangani sejumlah kontrak dengan perusahaan asing."
 BEL_license_POL_air_idea: "Lisensi Pesawat Polandia"
 BEL_license_POL_air_idea-desc: "Melalui hubungan baik dengan mitra Polandia kami, kami dapat memperoleh sejumlah izin militer dengan harga yang sangat wajar."
 BEL_legacy_of_the_belgian_airforce_ns: "Warisan Angkatan Udara Belgia"
 BEL_legacy_of_the_belgian_airforce_ns_desc: "Belgia adalah salah satu negara pertama yang menggunakan kekuatan udara, dan pilot kami bertempur dengan sangat berani dalam Perang Besar. Warisan mereka telah diakui oleh generasi pilot kita saat ini yang hanya ingin melanjutkan jejak mereka."
 BEL_re_build_the_fleet_ns: "Membangun kembali Armada"
 BEL_re_build_the_fleet_ns_desc: "Angkatan Laut kita dibubarkan pada tahun 1927, namun situasi global mengharuskan kita untuk berinvestasi pada armada kita sekali lagi guna menjaga hubungan perdagangan kita dengan Kongo tetap terbuka, dan mengejar kepentingan maritim kita."
 BEL_maritime_support_ns: "Dukungan Maritim"
 BEL_maritime_support_ns_desc: "Kini setelah kami meningkatkan infrastruktur angkatan laut militer secara online, kemampuan armada kami telah diperluas secara signifikan."
 BEL_convoy_protection_duties_ns: "Tugas Perlindungan Konvoi"
 BEL_convoy_protection_duties_ns_desc: "Jalur laut menjadi semakin berbahaya, jadi kami telah mempersenjatai para pelaut kapal dagang kami sehingga konvoi kami memiliki perlindungan jika diserang, meskipun hanya untuk membuat mereka lebih mungkin melarikan diri."
 BEL_maritime_phoenix_ns: "Phoenix Maritim"
 BEL_maritime_phoenix_ns_desc: "Sama seperti burung phoenix yang bangkit dari abu, demikian pula armada kita bangkit dari sisa-sisa kapal yang rusak."
 BEL_economic_recovery_ns: "Pemulihan Ekonomi"
 BEL_economic_recovery_ns_desc: "Perekonomian kita yang melemah sudah mulai menunjukkan tanda-tanda pemulihan. Pengeluaran meningkat, utang menurun, dan spekulan semakin menunjukkan kepercayaan terhadap pasar."
 BEL_collapsing_government_ns: "Runtuhnya Pemerintahan"
 BEL_collapsing_government_ns_desc: "Tuduhan korupsi telah mengguncang pemerintah sampai-sampai para tikus melarikan diri dari kapal yang tenggelam. Hampir setiap hari terjadi pengunduran diri, dan jelas bahwa kabinet ini tidak akan bertahan lama lagi."
 BEL_the_kings_surrender_ns: "Penyerahan Raja"
 BEL_the_kings_surrender_ns_desc: "Raja Leopold III telah menawarkan penyerahan bangsa kita, dan hal ini telah mengguncang moral pasukan kita, dan secara dramatis berdampak pada kemampuan kita untuk melanjutkan perjuangan."
 BEL_prisoner_king_ns: "Raja Tahanan"
 BEL_prisoner_king_ns_desc: "Raja Leopold III tetap bersama rakyatnya setelah bangsa kita menyerah. Dia sekarang berfungsi sebagai titik berkumpul, di mana seluruh warga Belgia dapat berkumpul dan bersiap untuk pemulihan kekuasaan Belgia."
 BEL_dame_blanche_ns: "Nona Blanche"
 BEL_dame_blanche_ns_desc: "Organisasi perlawanan yang dibentuk selama Perang Besar tampaknya baru saja memasuki masa hibernasi, dan kini kembali beraksi ketika Belgia kembali terancam. Dari bayang-bayang, kelompok ini memberikan informasi kepada sekutu kita, dan mengoordinasikan upaya perlawanan."
 BEL_king_law_freedom_ns: "Raja, Hukum, Kebebasan"
 BEL_king_law_freedom_ns_desc: "Motto Belgia merangkum jiwa Belgia dengan baik. Raja, yang akan membawa kita menuju kemenangan. Hukum, pedang yang menyerang kekacauan perang. Kebebasan, untuk Belgia dan Belgia."
 BEL_chasseurs_ardennais_ns: "Pengejar Ardennais"
 BEL_chasseurs_ardennais_ns_desc: "Chasseurs Ardennais adalah pembela berpengalaman di Ardennes Belgia, sangat berpengalaman dan terlatih dalam peperangan hutan."
 BEL_chasseurs_ardennais_ns_ncns: "$BEL_chasseurs_ardennais_ns$"
 BEL_chasseurs_ardennais_ns_ncns_desc: "$BEL_chasseurs_ardennais_ns_desc$"
 BEL_dissolve_political_parties_ns: "Membubarkan Partai Politik"
 BEL_dissolve_political_parties_ns_desc: "Perdana Menteri kita telah menyatakan bahwa partai-partai politik adalah inti dari sistem politik kita yang korup, dan untuk menyembuhkan penyakit ini, partai-partai tersebut harus dibubarkan."
 BEL_the_walloon_legion_ns: "Legiun Walloon"
 BEL_the_walloon_legion_ns_desc: "Legiun Walloon dibentuk dari para sukarelawan berbahasa Perancis yang ingin membuktikan nilai kontribusi mereka dalam upaya perang, karena takut dibayangi oleh saudara-saudara Flemish mereka."
 BEL_surrender_tt: "§RMemilih opsi ini akan membuat negara Anda menyerah!§!\n\nJika Anda berada di sebuah faksi, Anda akan terus berjuang sebagai Pemerintahan di Pengasingan."
 BEL_scars_of_ww1_ns_fake: "$BEL_scars_of_ww1_dynamic_modifier$"
 BEL_scars_of_ww1_ns_fake_desc: "$BEL_scars_of_ww1_dynamic_modifier_desc$"
 BEL_corruption_ns_fake: "$BEL_corruption_dynamic_modifier$"
 BEL_corruption_ns_fake_desc: "$BEL_corruption_dynamic_modifier_desc$"
 BEL_democratization_of_education_ns: "Demokratisasi Pendidikan"
 BEL_democratization_of_education_ns_desc: "Masyarakat kita memiliki tradisi kepedulian terhadap satu sama lain, yang paling baik diwujudkan dalam kontrak sosial antara pekerja dan perusahaan. Demikian pula, negara harus berupaya memberikan kesempatan yang sama kepada setiap orang dan menekankan pentingnya pendidikan yang baik."
 ###### BELGIAN DYNAMIC MODIFIERS #########
 BEL_scars_of_ww1_dynamic_modifier: "Bekas Luka Perang Besar"
 BEL_scars_of_ww1_dynamic_modifier_desc: "[BEL.GetName] sangat menderita dalam Perang Besar, karena sebagian besar menjadi medan perang Front Barat, dan masih menanggung luka tersebut."
 BEL_social_partners_dynamic_modifier: "Mitra Sosial"
 BEL_social_partners_dynamic_modifier_desc: "[ROOT.GetName] mempertemukan serikat pekerja dan perwakilan perusahaan dan menjadi perantara kesepakatan kompromi untuk memperkenalkan, antara lain, upah minimum dan enam hari libur berbayar."
 BEL_engine_of_the_economy_dynamic_modifier: "Mesin Perekonomian"
 BEL_engine_of_the_economy_dynamic_modifier_desc: "Semua yang menaiki kereta ekspres menuju kemakmuran, seiring dengan perputaran roda industri, kita mengumpulkan momentum, melaju ke depan dan menandai dimulainya sebuah era baru."
 BEL_belgian_miracle_dynamic_modifier: "Keajaiban Belgia"
 BEL_belgian_miracle_dynamic_modifier_desc: "Kebijakan [ROOT.GetLeader] benar-benar membuahkan hasil dan [ROOT.GetName] menjadi terkenal di panggung global, industrinya merupakan keajaiban dari banyak negara yang disebut sebagai negara adidaya."
 BEL_neutrality_dynamic_modifier: "Netralitas Abadi"
 BEL_neutrality_dynamic_modifier_desc: "Belgia adalah negara yang merdeka dan netral selamanya, dan Belgia harus menerapkan netralitas yang sama terhadap semua negara lainnya."
 BEL_defensive_neutrality_dynamic_modifier: "Netralitas Pertahanan"
 BEL_defensive_neutrality_dynamic_modifier_desc: "Untuk melindungi netralitas kita, kita harus memastikan pertahanan kita sedemikian rupa sehingga tidak ada penyerang yang ingin menyerang kita."
 BEL_austrian_resistance_active_state_dynamic_modifier: "Front Kebebasan Austria"
 BEL_austrian_resistance_active_state_dynamic_modifier_desc: "Front Kebebasan Austria aktif di negara bagian ini sehingga menghasilkan kelompok rekrutmen yang lebih besar, dan lebih banyak perlawanan jika negara bagian tersebut diduduki."
 BEL_mobilize_the_nation_dynamic_modifier: "Memobilisasi Bangsa"
 BEL_mobilize_the_nation_dynamic_modifier_desc: "Karyawan kami adalah aset terbesar kami. Mari kita mobilisasi mereka untuk menggalang kekuatan sebesar mungkin."
 BEL_defensive_reorganization_dynamic_modifier: "Reorganisasi Defensif"
 BEL_defensive_reorganization_dynamic_modifier_desc: "Kami telah mengidentifikasi perubahan doktrinal yang lebih strategis dan tingkat tinggi, dan merupakan salah satu pemimpin dunia dalam teori pertahanan modern."
 BEL_royal_military_academy_dynamic_modifier: "Akademi Militer Kerajaan"
 BEL_royal_military_academy_dynamic_modifier_desc: "Kami mengirimkan yang terbaik dan tercerdas kami ke Akademi Militer Kerajaan, tempat perwira generasi berikutnya dapat menerima pelatihan militer kelas dunia dalam berbagai mata pelajaran spesialis."
 BEL_corruption_dynamic_modifier: "Korupsi"
 BEL_corruption_dynamic_modifier_desc: "Korupsi merajalela di pemerintahan kita, dengan serangkaian skandal yang melibatkan berbagai kejahatan termasuk penyuapan dan penggelapan. Kepercayaan masyarakat terhadap lembaga-lembaga demokrasi kita tidak pernah serendah ini."
 BEL_economic_downturn_dynamic_modifier: "Kemerosotan Ekonomi"
 BEL_economic_downturn_dynamic_modifier_desc: "Perekonomian kita telah terpuruk sejak perang terakhir yang mengubah negara kita menjadi medan perang, pemulihannya semakin terhambat oleh dampak depresi global yang masih harus kita perjuangkan untuk pulih."
 BEL_belgian_legion_dynamic_modifier: "Legiun Belgia"
 BEL_belgian_legion_dynamic_modifier_desc: "Sekumpulan loyalis konservatif dan royalis siap dan bersemangat mengangkat senjata atas nama raja mereka."
 BEL_gold_reserves_dynamic_modifier: "[BEL.GetAdjective] Cadangan Emas"
 BEL_rexist_legion_dynamic_modifier: "Legiun Rexis"
 BEL_rexist_legion_dynamic_modifier_desc: "Penyatuan gereja dan negara dalam gerakan Rexis telah memungkinkan kita untuk membangun gerakan militer sejalan dengan tatanan militer lama."
 BEL_european_crusade_dynamic_modifier: "Perang Salib Eropa"
 BEL_european_crusade_dynamic_modifier_desc: "Kami berdiri sebagai jantung cita-cita Eropa, dan dengan burung nasar yang mengitari perbatasannya, bergantung pada tekad kuat kami untuk melihat ancaman-ancaman barbar digagalkan, dalam bentuk apa pun."
 BEL_socialism_on_the_rise_dynamic_modifier: "Sentimen Sosialis"
 BEL_socialism_on_the_rise_dynamic_modifier_desc: "Menyusul kemenangan relatif Vandervelde dalam pemilu, sentimen sosialis terus meningkat di [ROOT.GetNameDef]."
BEL_academies_of_belgium_dynamic_modifier: "Akademi Belgia"
BEL_academies_of_belgium_dynamic_modifier_desc: "Akademi Belgia adalah organisasi kolektif dari lembaga-lembaga pembelajaran tinggi di seluruh negeri, dan berdiri di jantung terobosan teknologi Belgia."
  ###### BELGIAN STATE MODIFIERS #########
 BEL_belgian_resistance_state_dynamic_modifier: "Perlawanan Belgia"
 BEL_belgian_resistance_state_dynamic_modifier_desc: "Rakyat kami tidak asing dengan pendudukan, banyak di antara mereka yang telah belajar dari pembangkangan sipil dan perlawanan selama perang terakhir." #Note, this is countered by the Secretaries General occupation law.
 BEL_flooded_tank_barriers_dynamic_modifier: "Penghalang Tangki yang Kebanjiran"
 BEL_flooded_tank_barriers_dynamic_modifier_desc: "Wilayah ini memiliki penghalang tank yang tersembunyi di bawah penghalang air yang dirancang untuk memperlambat pergerakan divisi musuh, dan membantu pertahanan Belgia."
 BEL_secretaries_general_tt: "§YPengendali Negara§! akan mendapatkan §YHukum Pekerjaan§! khusus yang hanya tersedia di §YNegara Inti Belgia§!"
  ###### BELGIAN HIDDEN IDEAS #########
