 #NATIONAL SPIRITS
 GER_mefo_bills_modifier: "$GER_mefo_bills$"
 GER_mefo_bills_modifier_desc: "$GER_mefo_bills_desc$" #Reusing the old loc for this
 GER_economy_of_conquest_modifier: "Ekonomi Penaklukan"
 GER_economy_of_conquest_modifier_desc: "Terlepas dari ketentuan Perjanjian Versailles yang tidak adil, kami bangkit dari abu dengan tekad yang tak tergoyahkan. Melalui persenjataan yang tak kenal lelah, kami berkomitmen untuk membentuk industri militer yang tak tertandingi untuk mendorong kemajuan kami menuju kejayaan. Hal ini akan membebani perekonomian kita, namun dengan kemenangan datanglah kesempatan untuk meraup keuntungan, menyalurkan kekayaan negara lain untuk memperkuat angkatan bersenjata kita. Celakalah mereka yang kalah!"
 GER_aufrusting_modifier: "Aufrustung"
 GER_aufrusting_modifier_desc: "Setiap pabrik yang dibangun, setiap pengeluaran Mark, dan setiap sumber daya yang diinvestasikan mendorong tujuan ambisius kami untuk menciptakan mesin perang yang tangguh. Persenjataan kembali, Aufrüstung, sangat penting untuk menjaga masa depan bangsa kita dan memperkuat kedaulatan Jerman."
 GER_recovering_economy_modifier: "Memulihkan Perekonomian"
 GER_recovering_economy_modifier_desc: "Perekonomian dan industri kita berada di ambang kehancuran setelah menghabiskan sumber daya secara sembrono yang tidak mampu kita beli untuk persenjataan kembali. Dengan kebijakan fiskal yang hati-hati dan tekad yang kuat, kita akan membangun kembali negara kita dan tumbuh lebih kuat dari sebelumnya!"
 GER_wirtschaftswunder_modifier: "Wirtschaftswunder"
 GER_wirtschaftswunder_modifier_desc: "Kita telah berhasil mengubah perekonomian yang berantakan menjadi salah satu kekuatan industri terkemuka di dunia. Kebangkitan yang luar biasa ini hanya dapat digambarkan sebagai Wirtschaftswunder, sebuah keajaiban ekonomi."
 GER_kriegsproduktion_modifier: "Kriegsproduktion"
 GER_kriegsproduktion_modifier_desc: "Kita harus memobilisasi tenaga kerja kita yang sangat terampil dan menempatkan mereka pada produksi persenjataan untuk mengamankan kemerdekaan [GER.GetAdjective] dan membangun persediaan militer yang diperlukan."
 GER_wunderwaffen_modifier: "Senjata Ajaib"
 GER_wunderwaffen_modifier_desc: "Program Wunderwaffe adalah inisiatif berani yang bertujuan untuk membentuk masa depan peperangan melalui terobosan teknologi yang radikal. Ilmuwan dan insinyur kami mendorong batasan-batasan yang mungkin ada, mengembangkan senjata revolusioner yang akan menjamin dominasi Jerman di udara, di lautan, dan di darat. Inovasi-inovasi ini mempunyai potensi untuk mengubah keadaan dunia dan memberikan pukulan telak kepada musuh mana pun yang berani menentang kita!"
 GER_wehrwirtschaft_modifier: "Wehrwirtschaft"
 GER_wehrwirtschaft_modifier_desc: "Kita tidak bisa membiarkan kekuatan asing menentukan kesejahteraan dan masa depan kita. Mencapai otonomi akan menjamin kemandirian ekonomi [ROOT.GetNameDef], mengurangi ketergantungan pada sumber daya asing dan memastikan swasembada bagi rakyat kita."
 GER_army_modifier: "Jerman Heer"
 GER_army_modifier_desc: "[GER.GetNameDefCap] memiliki sejarah militer yang panjang dan membanggakan dengan tradisi pemikiran inovatif. Staf Umum telah berupaya untuk meningkatkan angkatan bersenjata kita lebih jauh lagi sejak kekalahan memalukan dalam Perang Besar. Berbekal keahlian ini, tentara kita siap menyerang musuh mana pun yang ingin menundukkan rakyat kita yang sombong."
 GER_army_communist_modifier: "Volksarmee"
 GER_army_communist_modifier_desc: "Tentara Rakyat berdiri sebagai perisai sosialisme, siap melindungi dan menyebarkan revolusi proletar. Pemikiran inovatif Staf Umum Rakyat menjamin bahwa agresi imperialis apa pun tidak akan memadamkan semangat revolusioner rakyat Jerman."
 GER_navy_fascist_modifier: "Kriegsmarine"
 GER_navy_fascist_modifier_desc: "Melalui modernisasi dan strategi yang berani, kita menantang lautan, menimbulkan ketakutan pada musuh-musuh kita. Kapal Perang kita yang perkasa akan menguasai ombak dan U-boat kita akan menguasainya."
 GER_navy_democratic_modifier: "Jerman Marinir"
 GER_navy_democratic_modifier_desc: "Angkatan Laut Jerman menantang lautan untuk melindungi kepentingan maritim kita dan memastikan pengaruh kita menjangkau seluruh dunia."
 GER_navy_imperial_modifier: "Kaiserliche Marinir"
 GER_navy_imperial_modifier_desc: "Angkatan Laut Kekaisaran kita yang perkasa akan menerobos gelombang laut untuk mempelopori ambisi global kita dan menegaskan dominasi kita di laut lepas."
 GER_navy_communist_modifier: "Volksmarine"
 GER_navy_communist_modifier_desc: "Angkatan Laut Rakyat selalu waspada terhadap agresi imperialis. Hal ini akan menyebarkan revolusi Proletar ke seluruh lautan dan mengantarkan tatanan dunia baru."
 GER_airforce_modifier: "Luftwaffe"
 GER_airforce_modifier_desc: "Dengan keahlian dan kehebatan teknis yang tak tertandingi, Luftwaffe siap mendominasi angkasa dan memproyeksikan kekuatan kita kepada musuh mana pun yang cukup bodoh untuk menantang kita. Dengan pesawat canggih dan pilot yang terlatih, angkatan udara kita siap membakar langit, menghancurkan tentara mana pun, dan menenggelamkan setiap angkatan laut yang menentang kita."
 GER_airforce_communist_modifier: "Luftstreitkräfte"
 GER_airforce_communist_modifier_desc: "Angkatan udara kita terbang melintasi angkasa untuk menjaga negara Proletar dan masa depan sosialisme. Setiap pesawat terbang merupakan bukti kecerdikan dan semangat tak kenal lelah rakyat kami, siap menghadapi musuh apa pun yang mungkin dihadapi."
 GER_military_modifier_tt: "[GetSubmarineMaxSpeed]"
 GER_military_modifier_submarine_speed_big: "$GER_military_modifier$"
 GER_military_modifier_submarine_speed_big_desc: "$GER_military_modifier_desc$"
 GER_submarine_max_speed_small_tt: "$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+5%§!"
 GER_submarine_max_speed_big_tt: "$ship_hull_submarine$ $STAT_NAVY_MAXIMUM_SPEED$: §G+10%§!"
 GER_military_modifier_fascist_desc: "[GER.GetNameDefCap] memiliki sejarah militer yang panjang dan membanggakan dengan tradisi pemikiran inovatif, dan Staf Umum kami telah berupaya untuk meningkatkan angkatan bersenjata kami lebih jauh lagi sejak kekalahan memalukan dalam Perang Besar. Berbekal keahlian ini, kami siap menyerang musuh mana pun yang ingin menundukkan rakyat kami yang sombong."
