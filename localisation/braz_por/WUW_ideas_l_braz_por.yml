 HUN_militarized_diasporas: "Diaspora Hongaria yang dimiliterisasi"
 HUN_tribal_consolidation_revived: "Menghormati Leluhur kita"
 HUN_hungarian_national_defense_association_greenshirts: "Asosiasi Pertahanan Nasional Hongaria"
 HUN_hungarian_national_defense_association_greenshirts_desc: "Organisasi sayap kanan yang sebagian besar bersifat paramiliter M.O.V.E. yang dibentuk pada tahun 1919, sebagian besar setia kepada pemimpin dan tokoh pendirinya Gyula Gömbös. Namun dengan bergabungnya organisasi Greenshirts dan Scythe Cross ke dalamnya, loyalitasnya tersebar, dan mungkin lebih setia kepada para pemimpin Arrow Cross daripada siapa pun."
