 GER_uncertain_future_desc: "Dengan berakhirnya Perang Saudara, bangsa Jerman perlahan-lahan membangun kembali perekonomiannya, namun rakyatnya mendambakan stabilitas dan keamanan. [ROOT.GetLeader] tidak melakukan upaya untuk bergerak maju dan tampaknya tidak tertarik untuk memutuskan seperti apa masa depan negara Jerman yang baru. Hal ini telah menimbulkan kekhawatiran besar di kalangan penduduk yang ingin menjauh dari masa lalunya yang rusak."
