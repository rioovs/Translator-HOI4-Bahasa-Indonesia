 BEL_burgundian_heritage_ns: "Warisan Burgundi"
 BEL_burgundian_heritage_ns_desc: "Mengingat kemakmuran zaman keemasan Burgundi, potensi militer, politik dan ekonomi negara ini sekali lagi tidak dapat diragukan lagi."
 BEL_pax_belgica_ns: "Pax Belgica"
 BEL_pax_belgica_ns_desc: "Di bawah naungan kekaisaran masa lalu, Belgica dapat menaklukkan masyarakat dan wilayah hanya sekali yang diimpikan."
 BEL_volunteer_effort1_ns: "Upaya Relawan"
 BEL_volunteer_effort1_ns_desc: "Kita harus membantu menjaga perdamaian di dunia dan memastikan bahwa kekuatan fasis tidak berada di atas angin. Menghindari perang adalah hal yang terpenting, jadi kami akan membatasi diri untuk hanya mengirimkan sukarelawan untuk saat ini."
 BEL_volunteer_effort2_ns: "Misi Penjaga Perdamaian"
 BEL_volunteer_effort2_ns_desc: "Kita harus membantu menjaga perdamaian di dunia dan memastikan bahwa kekuatan fasis tidak berada di atas angin. Menghindari perang adalah hal yang terpenting, jadi kami akan membatasi diri untuk hanya mengirimkan sukarelawan untuk saat ini."
