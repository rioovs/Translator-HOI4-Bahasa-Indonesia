###### AUSTRIAN NATIONAL SPIRITS (IDEAS) ######
 AUS_widespread_unemployment: "Pengangguran yang Meluas"
 AUS_widespread_unemployment_desc: "Setelah krisis ekonomi, Austria berjuang melawan inflasi dan tingginya tingkat pengangguran. Kebencian terhadap politisi berada pada tingkat yang tinggi."
 AUS_employment_efforts: "Upaya Ketenagakerjaan"
 AUS_employment_efforts_desc: "Investasi yang cukup besar telah dilakukan untuk mengakhiri krisis lapangan kerja yang terjadi saat ini di Austria. Dengan adanya pekerja magang yang kini menjadi pemandangan umum di pabrik, baik masyarakat maupun industri tampak puas."
 AUS_phonix_insurance: "Asuransi Phönix"
 AUS_phonix_insurance_desc: "Program asuransi Phönix telah memungkinkan anggota kami untuk membeli asuransi jiwa yang melindungi mereka jika hal terburuk terjadi. Mengetahui bahwa keluarga mereka akan diperhatikan telah meningkatkan jumlah orang yang bersedia bergabung dengan tentara secara signifikan."
 AUS_covering_the_phonix_insurances: "Pertanggungan untuk Asuransi Phönix"
 AUS_covering_the_phonix_insurances_desc: "Memberi tahu orang-orang bahwa asuransi Phönix yang mereka cintai sudah tidak ada lagi akan menimbulkan konsekuensi drastis terhadap kemampuan kita untuk mempertahankan dan meningkatkan pasukan. Negara akan menanggung asuransi sampai Asuransi Phönix kembali beroperasi."
 AUS_cannot_train_due_to_treaty_of_saint_germain_en_laye: "Tidak dapat melatih unit baru saat §Y$AUS_treaty_of_saint_germain_en_laye$§! aktif"
 AUS_treaty_of_saint_germain_en_laye: "Perjanjian Saint-Germain-en-Laye"
 AUS_treaty_of_saint_germain_en_laye_desc: "Terikat oleh perjanjian ketat yang ditandatangani setelah Perang Besar, Angkatan Darat Austria serta industri militer hanyalah bayang-bayang dari keadaan mereka dulu."
 AUS_treaty_of_saint_germain_en_laye_tt: "Dapat mengirimkan relawan: §Rno§!"
 AUS_treaty_of_saint_germain_en_laye_tt_2: "§RSelama Semangat Kebangsaan ini aktif, undang-undang wajib militer tidak dapat diangkat melampaui 'Relawan Saja'. Unit tidak dapat dilatih, dibubarkan, atau templatnya diubah§!"
 AUS_revised_treaty_of_saint_germain_en_laye: "Revisi Perjanjian Saint-Germain-en-Laye"
 AUS_revised_treaty_of_saint_germain_en_laye_desc: "Melalui upaya diplomatik, dampak Perjanjian Saint-Germain-en-Laye yang asli telah dikurangi. Tidak lagi mengalami keterbatasan jumlah pasukannya, [ROOT.GetNameDef] sekarang dapat memulai persenjataan kembali dalam skala yang lebih kecil."
 AUS_recovering_from_the_depression: "Pulih Dari Depresi Ekonomi"
 AUS_recovering_from_the_depression_desc: "Pemulihan dari kehancuran ekonomi pada awal tahun 30-an berjalan lambat, namun tampaknya Austria akhirnya menuju masa-masa yang lebih baik."
 AUS_recurrent_economic_depression: "Kembalinya Depresi Ekonomi"
 AUS_recurrent_economic_depression_desc: "Pola dampak jangka pendek yang efektif, namun krisis ekonomi akan kembali memburuk setelah krisis tersebut mereda tampaknya akan mengikuti Austria seperti sebuah kutukan. Sekali lagi tingkat inflasi melonjak dan perekonomian amburadul."
 AUS_economic_boom: "Ledakan Ekonomi"
 AUS_economic_boom_desc: "Melalui kerja keras dan upaya besar, Austria telah mengubah bencana ekonomi menjadi perekonomian yang berkembang pesat."
 AUS_women_in_academia: "Wanita di Akademisi"
 AUS_women_in_academia_desc: "Mengizinkan perempuan untuk mengambil bagian dalam pendidikan tinggi telah memungkinkan kemajuan ilmu pengetahuan di Austria meningkat secara signifikan."
 AUS_militia_support: "Dukungan Milisi"
 AUS_militia_support_2: "Dukungan Milisi"
 AUS_militia_support_desc: "Kami telah meminta dukungan dari [GetMilitiaName] untuk membantu tujuan kami. Organisasi paramiliter ini telah lama dilarang namun dalam situasi ini kita dapat dengan mudah membenarkan untuk membawa mereka kembali."
 AUS_militia_is_schutzbund: "Schutzbund"
 AUS_militia_is_sturmscharen: "Sturmscharen"
 AUS_militia_is_heimwehr: "Heimwehr"
 AUS_militia_is_undecided: "Milisi"
 AUS_emergency_measures: "Tindakan Darurat"
 AUS_emergency_measures_desc: "Untuk mendapatkan peluang di dunia yang semakin agresif, [AUS.GetNameDef] harus segera membangun kapasitas industri yang memadai untuk memenuhi kebutuhan negara."
 AUS_host_of_communist_dissidents: "Menjadi Tuan Rumah bagi Pembangkang Komunis"
 AUS_host_of_communist_dissidents_desc: "Mengundang orang-orang yang berpikiran sama dari seluruh dunia [AUS.GetNameDef] menjadi pusat bagi orang-orang komunis di pengasingan."
 AUS_devalued_the_schilling: "Mendevaluasi Schilling"
 AUS_devalued_the_schilling_desc: "Untuk mencegah inflasi, mata uang telah didevaluasi. Dalam jangka pendek dampaknya tidak terlalu menguntungkan, namun dalam jangka panjang hal ini akan menjadi kemajuan bagi bangsa."
