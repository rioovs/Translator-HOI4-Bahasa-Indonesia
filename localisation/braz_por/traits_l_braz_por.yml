 FIN_personal_agenda_aaltonen_tt: "§GPerang Salib Anti-Fasis§!: Memiliki kontribusi lebih dari §Y10%§! Partisipasi Perang di semua perang aktif dan kurang dari §Y5%§! Kemajuan Menyerah saat berperang melawan negara Fasis akan meningkatkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- §RProletariat Terpecah§!: Memiliki kurang dari §Y80%§! dukungan untuk ideologi $communism$ akan menurunkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- $losing_soverignty_threatened_tt$"
