 FIN_personal_agenda_kuusinen_tt: "§GTata Surya Organisasi§!: Menguasai semua §Ynegara bagian inti Skandinavia§! dan §YBaltik§! oleh Finlandia atau sekutu akan meningkatkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- §RFinno-Karelia yang Terlupakan§!: Tidak menguasai negara bagian §YKarjala§!, §YKola§!, §YOnega§!, dan §YOlonets§! akan menurunkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_von_hesse_tt: "§GImpian Finlandia Raya§!: Menduduki negara bagian inti Finlandia yang dikuasai musuh akan meningkatkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- §RDukungan Mengkhawatirkan untuk Sosialis§!: Memiliki lebih dari §Y9%§! dukungan untuk ideologi $democratic$ atau $communism$ akan menurunkan £GFX_power_balance_texticon §YKepercayaan Publik§!.\n- $losing_soverignty_threatened_tt$"
