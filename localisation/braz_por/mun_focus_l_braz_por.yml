l_braz_por:
#Shortcuts 
CZE_military_path_shortcut: "Angkatan Bersenjata"
CZE_economic_path_shortcut: "Ekonomi"
CZE_diplomacy_path_shortcut: "Diplomasi"
CZE_fort_path_shortcut: "Upaya Fortifikasi"
CZE_skoda_priority_shortcut_name: "Prioritas Skoda"
CZE_political_path_shortcut: "Politik"
# Č does show when scrolling through focuses, but not in the detailed focus view title (does work in the description though)
CZE_coalition_building: "Gedung Koalisi"
CZE_coalition_building_desc: "Koalisi yang muncul setelah pemilu harus membangun persatuan yang lebih besar di antara para anggotanya agar dapat berfungsi secara efektif. Pensiunnya Jan Malypetr sebagai perdana menteri baru-baru ini telah memberikan tekanan lebih lanjut pada Koalisi Luas untuk mengkonsolidasikan dukungannya."
CZE_merge_the_paramilitaries: "Gabungkan Kelompok Paramiliter"
CZE_merge_the_paramilitaries_desc: "Paramiliter kami tersebar dan terbagi dalam banyak kelompok berbeda. Jika kita ingin memanfaatkan mereka secara militer, kita harus memaksa mereka untuk bergabung."
CZE_integrated_paramilitaries: "Integrasikan Paramiliter"
CZE_integrated_paramilitaries_desc: "Pihak militer mungkin tidak terlalu senang dengan gagasan tersebut, namun mengintegrasikan kelompok paramiliter ke dalam militer kita akan memberi kita lebih banyak cadangan ketika kita sangat membutuhkannya."
CZE_wielding_the_hammer: "Memegang Palu"
CZE_wielding_the_hammer_desc: "Kita dapat menggunakan mayoritas kita di Majelis Nasional untuk mempercepat proses pengesahan undang-undang dibandingkan saat ini. Yang paling penting adalah menertibkan lembaga legislatif kita."
CZE_emergency_measures: "Tindakan Darurat"
CZE_emergency_measures_desc: "Dengan menerapkan langkah-langkah darurat untuk membantu kita menghadapi berbagai krisis yang dihadapi negara kita, dan pada saat yang sama menggunakan beberapa langkah tersebut untuk membantu mengawasi mereka yang secara ideologis tidak dapat diandalkan oleh pemerintah kita. Kita akan lebih siap menghadapi tantangan yang dihadapi bangsa kita."
CZE_king_of_the_castle: "Raja Kastil"
CZE_king_of_the_castle_desc: "Kita semua tahu siapa yang mengambil keputusan dalam pemerintahan kita. Di masa yang penuh ketidakpastian, inilah saatnya kita berhenti berpura-pura dan membiarkan $CZE_edvard_benesh$ memimpin secara lebih langsung. Keamanan negara kita bergantung padanya."
CZE_closer_ties_with_the_moderate_germany_parties: "Menggalang Partai-partai Sudetenland yang Moderat"
CZE_closer_ties_with_the_moderate_germany_parties_desc: "Beberapa partai di Sudetenland bersedia bekerja sama dengan koalisi kami dan membangun terobosan bersama pemerintah. Mari kita perdalam hubungan tersebut."
CZE_complete_reconciliation: "Rekonsiliasi Lengkap"
CZE_complete_reconciliation_desc: "Kami telah berupaya membangun jembatan kepercayaan. Saatnya berdamai dengan saudara sebangsa kita."
CZE_complete_reconciliation_cooldown_flag: "Telah menyelesaikan fokus §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
CZE_complete_reconciliation_cooldown_flag_tt: "Hari-hari saat ini adalah: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
CZE_bastion_of_liberty: "Benteng Kebebasan"
CZE_bastion_of_liberty_desc: "Kami adalah salah satu dari sedikit negara yang benar-benar pluralis di Eropa timur Rhine pada dekade ini. Mari kita pastikan masyarakat tidak melupakan hal itu."
CZE_standing_against_the_storm: "Berdiri Melawan Badai"
CZE_standing_against_the_storm_desc: "Terlepas dari kekurangan dan kemungkinan kurangnya persiapan, kami akan menghadapi tantangan apa pun dan bertahan melawan badai yang akan datang."
CZE_truth_prevails: "Kebenaran Menang"
CZE_truth_prevails_desc: "Bahkan ketika menghadapi tantangan besar dan tugas yang mustahil, negara kita tahu bahwa semboyan nasional kita, 'Kebenaran Menang', akan menjadi kenyataan ketika semua hal telah diucapkan dan dilakukan. Carilah kebenaran, ucapkan kebenaran, dan kebenaran itu akan menang."
CZE_negotiations_with_the_autonomous_bloc: "Negosiasi dengan Blok Otonom"
CZE_negotiations_with_the_autonomous_bloc_desc: "Jika kita ingin membentuk koalisi yang tidak menyerahkan kekuasaan kepada antek-antek Benes di Majelis Nasional, kita harus bekerja sama dengan Blok Otonom. Namun, mendapatkan dukungan penuh dari mereka memerlukan pengorbanan yang besar."
CZE_slovakia_autonomy_agreement: "Perjanjian Otonomi Slowakia"
CZE_slovakia_autonomy_agreement_desc: "Harga bagi kerja sama blok otonom dengan koalisi kami adalah perjanjian otonomi dengan pemerintah. Ini adalah harga yang mahal yang harus dibayar, namun konsekuensi jika kita tidak memenuhi kesepakatan bisa lebih buruk lagi."
CZE_slovakia_autonomy_agreement_tt: "§Y[RUT.getname]§! akan menginginkan perjanjian yang sama dengan yang kami berikan §Y[SLO.getname]§!!"
CZE_slovakia_autonomy_agreement_2_tt: "$CZE_the_autonomous_bloc_demands$ akan tertunda selama §Y35 hari§! ketika fokus ini dipilih."
CZE_topple_the_king: "Menggulingkan Raja"
CZE_topple_the_king_desc: "Pengaruh $CZE_edvard_benesh$ terhadap pemerintah kita sangat mencekik. Kekuasaannya lebih besar daripada perannya sebagai presiden karena banyaknya loyalisnya di parlemen. Sekarang kondisinya sudah tepat, kita bisa menggantikan pengaruhnya di Horní Komora."
CZE_comprise_with_the_carpathians: "Kompromi dengan Carpathians"
CZE_comprise_with_the_carpathians_desc: "Wilayah Ruthenia sedang berupaya mencapai perjanjian federalisasi serupa dengan yang kami berikan [SLO.getnamedef]. Melakukan hal ini akan sangat melemahkan posisi kami di wilayah ini dan di [9.getname]. Membuat kesepakatan dengan mereka mungkin lebih baik daripada menyerah sepenuhnya pada tuntutan mereka."
CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt: "$CZE_the_rut_demands$ akan tertunda selama §Y35 hari§! ketika fokus ini dipilih."
CZE_cut_carpathia_loose: "Potong Carpathia Longgar"
CZE_cut_carpathia_loose_desc: "Dengan Slovakia yang kini menjadi negara federal, wilayah Ruthenia berharap dapat membuat perjanjian serupa. Meskipun hal ini tampaknya tidak masuk akal, tanpa Slovakia yang berada di bawah kendali langsung kita, upaya untuk menguasai mereka akan sulit dilakukan. Mungkin sebaiknya kita menuruti saja tuntutan mereka."
CZE_compromise_with_the_veteran_agrarian: "Kompromi dengan Veteran Agraria"
CZE_compromise_with_the_veteran_agrarian_desc: "Kelompok agraris lama merupakan sebuah rintangan dalam membuat terobosan seiring dengan pertumbuhan jumlah pemilih di perkotaan. Kita perlu berkompromi dengan mereka untuk mencapai tujuan kita."
CZE_reorient_the_broad_coalition: "Reorientasi Koalisi Luas"
CZE_reorient_the_broad_coalition_desc: "Koalisi luas telah menjadi blok terdepan dalam pemerintahan kita selama bertahun-tahun. Beragamnya partai politik yang tercakup di dalamnya membuat koalisi semakin sulit dipimpin. Reorientasi kebijakan kementerian sudah lama tertunda."
CZE_leverage_sokol: "Gerakan Sokol"
CZE_leverage_sokol_desc: "Gerakan Sokol telah menjadi organisasi penting di negara kita selama beberapa dekade. Di saat krisis, kita harus memanfaatkannya untuk membantu memberikan pelatihan paramiliter dan perekrutan tentara kita."
CZE_urbanist_policies: "Kebijakan Urbanis"
CZE_deepend_ties_with_the_trademans: "Mempererat Hubungan dengan Para Pedagang"
CZE_deepend_ties_with_the_trademans_desc: "Partai Pedagang populer di kalangan pemilih kelas menengah perkotaan. Jika kita memberdayakan dan bekerja sama dengan mereka, kita bisa menjangkau para pemilih di perkotaan tanpa mengasingkan basis pemilih di pedesaan."
CZE_apart_but_togather: "Terpisah tapi Bersama"
CZE_apart_but_togather_desc: "Daerah-daerah kita kini mempunyai otonomi yang lebih besar dibandingkan sebelumnya, namun kita juga lebih kuat dari sebelumnya. Kami siap menghadapi apa pun."
CZE_contact_henlein: "Hubungi Henlein"
CZE_contact_henlein_desc: "$CZE_konrad_henlein$ telah menjadi duri bagi pemerintah kita selama bertahun-tahun. Namun, mengingat kejadian internasional baru-baru ini, mungkin ini saatnya untuk memulai dialog dengannya."
CZE_contact_henlein_cooldown_flag: "Telah menyelesaikan fokus §Y$CZE_no_compromise_with_the_sdp$§!"
CZE_contact_henlein_cooldown_flag_tt: "Hari-hari saat ini adalah: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
CZE_contact_henlein_focus_warning_tt: "Jika kami menyelesaikan §Y$CZE_no_compromise_with_the_sdp$§!, kami harus menunggu §Y350§! hari sebelum kami dapat memilih §YFokus Nasional§! ini."
CZE_contact_henlein_focus_order_warning_tt: "Jika kami menyelesaikan §Y$CZE_no_compromise_with_the_sdp$§! setelah menyelesaikan §YFokus Nasional§! ini, §Y$CZE_konrad_henlein$§! akan dipensiunkan."
CZE_no_compromise_with_the_sdp: "Lanjutkan Mengunci SdP"
CZE_no_compromise_with_the_sdp_desc: "SdP tidak punya apa pun untuk ditawarkan kepada koalisi kita. Mereka hanya berupaya menimbulkan ketegangan politik dan mencoreng tindakan pemerintah kita. Atas nama tata pemerintahan yang baik, mereka harus terus dikunci dari koalisi apa pun."
CZE_no_compromise_with_the_sdp_cooldown_flag: "Telah menyelesaikan fokus §Y$CZE_contact_henlein$§!"
CZE_no_compromise_with_the_sdp_cooldown_flag_tt: "Hari-hari saat ini adalah: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
CZE_no_compromise_with_the_sdp_focus_warning_tt: "Jika kami menyelesaikan §Y$CZE_contact_henlein$§!, kami harus menunggu §Y350§! hari sebelum kami dapat memilih §YFokus Nasional§! ini."
# CZE_economic_integration: "Economic Integration"
# CZE_economic_integration_desc: "Why stop at a customs union? Economic integration will further grow our economies and ensure our future is an affluent one for all members."
CZE_form_a_federation: "Membentuk Federasi"
CZE_form_a_federation_desc: "Impian untuk membentuk federasi Eropa tengah kini sudah tidak mungkin lagi tercapai. Kita akhirnya akan mencapainya dan menjadi raksasa demokrasi. Bersama-sama, kita akan memiliki kekuatan untuk melawan kekuatan besar sendirian!"
CZE_bend_the_bars: "$ITA_bend_the_bars$"
CZE_bend_the_bars_desc: "$GER_european_confederation_desc$"
CZE_reassure_the_army: "Yakinkan Angkatan Darat"
CZE_reassure_the_army_desc: "Tentara semakin gelisah dengan beberapa keputusan dan kebijakan pemerintah baru-baru ini. Ini saatnya meyakinkan mereka bahwa kita mendukung mereka, apa pun yang dikatakan atau dilakukan pemerintah."
CZE_outreach_to_the_western_powers: "Penjangkauan Lebih Lanjut ke Kekuatan Barat"
CZE_outreach_to_the_western_powers_desc: "Negara-negara demokrasi Barat mengatakan bahwa mereka mendukung kita, namun kita perlu melakukan terobosan lebih jauh dengan mereka untuk memastikan bahwa perkataan mereka juga akan disertai dengan tindakan pada saat yang paling penting."
CZE_demand_guarantees: "Menuntut Jaminan yang Lebih Kuat"
CZE_demand_guarantees_desc: "Terlepas dari perjanjian dan aliansi yang kita miliki, kita perlu memastikan mitra kita tidak meninggalkan kita di saat putus asa hanya karena hal itu lebih mudah bagi mereka. Kita membutuhkan sesuatu yang lebih kuat dari sekedar jaminan."
CZE_guardian_of_central_europe: "Penjaga Eropa Tengah"
CZE_guardian_of_central_europe_desc: "Kami sekarang berdiri dalam posisi untuk menjadi pengawas Demokrasi di pusat Eropa. Kita bisa menjadi pelindung bagi negara-negara yang tidak bisa mengurus dirinya sendiri dan memastikan demokrasi tetap tegak."
CZE_central_european_faction: "Penguasa Eropa Tengah"
CZE_central_european_faction_desc: "Meskipun kita fokus pada penguatan diri kita sendiri dan bukan terlalu bergantung pada diplomasi, penting bagi kita untuk tidak memperluas pengaruh kita secara berlebihan. Mungkin ini saatnya untuk melihat ke luar."
CZE_strike_at_the_heart_of_bolshevism: "[THIS.GetAntiSovietFocusName]"
CZE_strike_at_the_heart_of_bolshevism_1: "Menyerang Jantung Bolshevisme"
CZE_strike_at_the_heart_of_bolshevism_2: "Amankan Sisi Timur"
CZE_strike_at_the_heart_of_bolshevism_desc: "Perluasan [SOV.GetNameDef] merupakan ancaman nyata bagi Eropa dan bangsa kita. Kita harus menjadi benteng melawan mereka."
CZE_destroy_the_fascist_threats: "Hancurkan Ancaman Fasis"
CZE_destroy_the_fascist_threats_desc: "[CZE_get_fascist_threats_desc]"
CZE_destroy_the_fascist_threats_desc_enemy_ger: "Kita semua tahu siapa ancaman terbesar bagi perdamaian di Eropa. [GER.getnamedefCAP] perlu dihentikan secepatnya. Jika tidak ada orang lain yang bersedia, sebaiknya kita saja yang melakukannya."
CZE_destroy_the_fascist_threats_desc_backup: "Demi keamanan kita, sangat penting bagi negara-negara tetangga kita untuk tidak mengikuti retorika ekspansionis yang cepat atau lambat mungkin ditujukan kepada kita."
CZE_peace_on_our_time: "Damai untuk Zaman Kita"
CZE_peace_on_our_time_desc: "Kita sudah terlalu lama menjadi renungan dalam hubungan internasional Eropa. Hal ini tidak akan terjadi lagi! Kita bisa berdiri sendiri dan menentukan syarat-syarat kita. Baik itu perang atau damai."
CZE_reach_out_for_military_assistance: "Menjangkau Bantuan Militer"
CZE_free_tuka: "Gratis $CZE_vojtech_tuka$"
CZE_free_tuka_desc: "$CZE_vojtech_tuka$ hukuman penjara sudah habis dan alih-alih mencari alasan untuk memperpanjang hukumannya, kita bisa membebaskannya tepat waktu dan memanfaatkannya dalam pemerintahan kita. Lebih baik dia bekerja di bawah kita daripada melawan kita."
CZE_grow_the_anglo_czechoslovak_prague_credit_bank: "Bank Anglo-Cekoslowakia"
CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc: "Bank Kredit Anglo-Ceko telah menjadi salah satu penggerak utama industri kami. Tanpa dana mereka, kami tidak akan mampu mempertahankan bisnis ekspor besar yang kami miliki saat ini. Mendirikan cabang baru di New York dan memperdalam hubungan dengan [ENG.GetNameDef] akan membuat bank ini berkembang lebih jauh. Hal ini juga akan memberi [ENG.getname] andil dalam kelangsungan hidup kita."
CZE_feeding_the_alligator: "Memberi Makan Buaya"
CZE_feeding_the_alligator_desc: "Desain [GER.getname] di Sudetenland merupakan ancaman bagi eksistensi bangsa kita. Mungkin jika kita memberikan apa yang mereka inginkan, mereka akan meninggalkan kita sendirian."
CZE_complete_capitulation: "Penyerahan Penuh"
CZE_complete_capitulation_desc: "Pilihan apa yang kita miliki selain menyerah? Kita tidak bisa menahan badai yang akan datang. Mungkin jika kita membuat kesepakatan dengan [GER.getnamedef] sementara kita masih memiliki pengaruh, mereka akan memberi kita kebebasan di bawah kendali mereka."
CZE_stabilize_the_protectorate: "Stabilkan Protektorat"
CZE_stabilize_the_protectorate_desc: "Protektorat sama sekali tidak stabil. Kita perlu melakukan upaya untuk meyakinkan masyarakat kita bahwa kita adalah pemerintah yang sah dan bahwa kita akan memenuhi kebutuhan mereka."
CZE_stabilize_the_protectorate_unretire_henlein_tt: "Membatalkan pensiun §Y$CZE_konrad_henlein$§! dari §Y[ROOT.getname]§!."
CZE_full_faith_in_hacha: "Keyakinan Penuh pada Hácha"
CZE_full_faith_in_hacha_desc: "$CZE_emil_hacha$ jauh lebih populer dan dihormati di kalangan masyarakat kita dibandingkan $CZE_emanuel_moravec$. Pekerjaan yang dia lakukan mungkin mencurigakan, tetapi Anda tidak bisa menggantikan tokoh yang lebih populer."
CZE_moravecs_bohemia: "Bohemia Moravec"
CZE_moravecs_bohemia_desc: "Desas-desus beredar bahwa $CZE_emil_hacha$ mencoba melemahkan pemerintahan baru kita. Misalkan kita berharap sukses dan berkembang dalam kondisi kita saat ini, maka kita membutuhkan kepemimpinan yang lebih sesuai dengan ideologi penguasa kita."
CZE_form_the_government_army: "Bentuk Tentara Pemerintah"
CZE_form_the_government_army_desc: "Jika kita ingin negara kita sukses, kita perlu membentuk pasukan baru yang belajar dari kegagalan pendahulunya. Kita juga harus memastikan kepemimpinannya lebih selaras secara politik dengan pemerintah."
CZE_forced_administration_of_companies: "Administrasi Perusahaan yang Dipaksa"
CZE_forced_administration_of_companies_desc: "Meskipun ada pengawasan besar-besaran, beberapa perusahaan masih beroperasi di luar kendali kami. Sudah waktunya untuk memaksa mereka di bawah pengawasan kita."
CZE_revisit_custom_union_talks: "Kunjungi kembali Pembicaraan Serikat Adat"
CZE_revisit_custom_union_talks_desc: "Pembicaraan tentang serikat adat mungkin berjalan sangat buruk dengan beberapa tetangga kita dibandingkan dengan tetangga lainnya. Ini adalah waktu yang tepat untuk meninjau kembali hal-hal tersebut dan melakukan dorongan baru untuk kesatuan pabean antar negara kita."
CZE_revisit_custom_union_talks_tt: "Kami masih dapat meyakinkan mereka untuk bergabung, melalui §Rcara§! lainnya."
CZE_revisit_custom_union_talks_2_tt: "Mereka akan lebih mungkin menerima tuntutan kami untuk bergabung dengan Federasi kami"
CZE_reintegrate_cross_border_rail_connections: "Meningkatkan Koneksi Rel Lintas Batas"
CZE_reintegrate_cross_border_rail_connections_desc: "Meningkatkan hubungan kereta api dengan tetangga kita adalah cara yang baik untuk menjilat mereka. Terlebih lagi jika kita mencoba menumbuhkan hubungan ekonomi antara kita dan mereka."
CZE_reintegrate_cross_border_rail_connections_flag: "Koneksi Rel Lintas Batas Ditingkatkan"
CZE_vonapo_20: "VONAP 20"
CZE_vonapo_20_desc: "Kita tidak sendirian dalam melihat meningkatnya ancaman dari [GER.GetNameDef], oleh karena itu sebuah rencana telah dibentuk untuk bekerja sama dengan [SOV.GetNameDef] dalam mengumpulkan intelijen sehingga kita dapat menggagalkan ambisi [GER.GetAdjective] dengan lebih baik."
CZE_increase_funding_from_moscow: "Tingkatkan Pendanaan dari [SOV.capital.GetCapitalVictoryPointName]"
CZE_increase_funding_from_moscow_desc: "[ROOT.GetCommunistParty] sangat kekurangan dana sehingga saat ini mereka membayar pembangunannya dengan gaji perwakilannya. Untuk berkembang, kita harus memohon kepada [SOV.GetNameDef] untuk meningkatkan dana guna menyebarkan surat kabar kita dan merekrut lebih banyak anggota."
CZE_zdenek_fierlinger_tt: "Menunjuk penasihat §Y$CZE_zdenek_fierlinger$§!"
CZE_expand_the_communist_press: "Perluas Pers Komunis"
CZE_expand_the_communist_press_desc: "Surat kabar kami, 'Hukum Merah,' dapat memberikan informasi kepada mereka yang saat ini tidak membaca surat kabar, yang diperlukan hanyalah peningkatan pendanaan."
CZE_anti_rearmament_propaganda:0 "Propaganda Anti-Persenjataan Kembali"
CZE_anti_rearmament_propaganda_desc: "Jatuhnya pemerintahan fasis musuh utama kita, [GER.GetNonIdeologyName], berarti kita dapat mengklaim bahwa selama ini kita benar dalam pendirian kita terhadap pembangunan militer."
CZE_anti_democratic_propaganda: "Propaganda Anti-Demokrat"
CZE_anti_democratic_propaganda_desc: "Untuk menciptakan dukungan bagi partai kita, kita harus menyoroti kegagalan pemerintahan Republik sebelumnya dan menunjukkan bagaimana kita bisa menangani situasi ini dengan lebih baik."
CZE_form_workers_brigades: "Bentuk Milisi Pekerja"
CZE_form_workers_brigades_desc: "Para pekerja yang kita bebaskan harus siap berpartisipasi dalam perjuangan. Mereka mungkin bukan tentara terlatih, namun mereka masih dapat berkontribusi sebagai spesialis berdasarkan pekerjaannya."
CZE_kohler_faction: "Fraksi Köhler"
CZE_kohler_faction_desc: "Faksi Bruno Köhler percaya bahwa penggulingan borjuasi dengan kekerasan diperlukan untuk membentuk negara komunis Cekoslowakia yang sukses."
CZE_gottwald_faction: "Fraksi Gottwald"
CZE_gottwald_faction_desc: "Setia pada Moskow, faksi Stalinis Klement Gottwald meramalkan sebuah negara Cekoslowakia dalam citra Uni Soviet."
CZE_zapotocky_faction: "Fraksi Zápotocký"
CZE_zapotocky_faction_desc: "Para pendiri partai komunis, Bohumir Šmeral dan Antonin Zápotocký, membayangkan kebijakan yang lebih moderat daripada kebijakan yang dipaksakan oleh Klement Gottwald kepada partai tersebut. Kita harus kembali ke akar kebijakan ini agar benar-benar menarik bagi seluruh masyarakat [CZE.GetAdjective]."
CZE_ally_with_moderate_socialists:0 "Bekerjasama dengan Sosialis Moderat"
CZE_ally_with_moderate_socialists_desc: "Tidak semua negara siap menerima komunisme melalui jalur elektoral atau mengembangkan kekaguman terhadap [SOV.GetLeader], jadi bekerja sama dengan gerakan yang lebih moderat adalah sesuatu yang tidak boleh kita hindari."
CZE_democracies_willing_to_join_faction_tt: "§YNegara-negara demokratis akan lebih bersedia bergabung dengan faksi komunis kita§!."
CZE_limited_cooperation: "Kerjasama Terbatas dengan [SOV.GetLeader]"
CZE_limited_cooperation_desc: "Meskipun berbeda secara ideologis, bahkan [SOV.GetNameDef] mungkin mengakui nilai kita sebagai mitra dan mengambil bagian dalam beberapa kesepakatan pragmatis, bahkan ketika mereka mencela kita di surat kabar mereka."
CZE_denounce_stalinism: "Kecam Stalinisme"
CZE_denounce_stalinism_desc: "Reputasi komunisme selamanya ternoda oleh ketidakadilan Stalin, sekarang saatnya kita mengambil tindakan militer untuk membebaskan rakyat di bawah rezim seperti dia."
CZE_country_leader_has_ideology_stalinism_tt: "Pemimpin negara mempunyai ideologi §Y$stalinism$§!"
CZE_cooperate_with_tito: "Bekerja sama dengan Tito"
CZE_cooperate_with_tito_desc: "[YUG.GetNameDefCap] sedang mencoba versi komunisme yang pragmatis, sama seperti kita. Mereka juga berupaya menyatukan berbagai bangsa di bawah bendera merah. Dalam menghadapi tantangan-tantangan ini, kita harus bekerja sama dalam urusan militer dan politik."
CZE_reduce_divided_nation_cost_tt: "Mengurangi biaya dan durasi sebagian besar keputusan §YA Divided Nation§!."
CZE_balkan_union: "Perluas Persatuan"
CZE_balkan_union_desc: "Meskipun semakin banyak negara di kawasan ini yang menganut komunisme, kita tidak dapat melindungi diri kita dari negara-negara besar tanpa kerja sama yang kuat, serikat pekerja akan menjadi cara paling efektif untuk mencapai hal ini."
CZE_cooperation_with_the_ussr:0 "Kerjasama dengan [SOV.GetLeader]"
CZE_cooperation_with_the_ussr_desc: "Bahkan pendukung [SOV.GetNameDef] yang paling bersemangat di kalangan pimpinan partai pun menyadari kelemahan kolektivisasinya setelah mengunjungi negara tersebut. Meski begitu, bekerja sama dengan mereka dalam kolektivisasi berarti kita dapat menganalisis dengan cermat apa yang salah dan apa yang benar serta bagaimana menerapkannya dengan baik untuk [ROOT.GetNameDef]."
CZE_exchange_military_expertise: "Pertukaran Keahlian Militer"
CZE_exchange_military_expertise_desc: "[SOV.GetNameDefCap], sama seperti kebanyakan negara dengan jumlah tentara yang signifikan, telah bereksperimen dengan taktik tentara. Kita harus meminta agar mereka membagikan wawasan mereka, dan kita juga bisa membagikan wawasan kita."
CZE_pressure_romania: "Tekanan Rumania"
CZE_pressure_romania_desc: "[ROM.GetNameDefCap] dapat menimbulkan ancaman serius jika sejalan dengan musuh kita, mungkin mengganggu hubungan kita dengan [SOV.GetNameDef] atau memberikan minyak yang berharga kepada musuh kita. Dengan dukungan [SOV.GetAdjective], kami memberikan ancaman yang cukup besar sehingga berpotensi menyelaraskan mereka tanpa perang."
CZE_facility_in_state_tt: "Jika tidak ada §YFasilitas Eksperimental§! lainnya di $STATE|Y$, kami akan mendapatkan §G1§! $FACILITY_TYPE|Y$ di $STATE|Y$."
CZE_spread_the_revolution: "Sebarkan Revolusi"
CZE_spread_the_revolution_desc: "Dengan keberhasilan revolusi di [ROOT.GetNameDef], kita sekarang harus mendorong proletariat di luar negeri untuk memperjuangkan kebebasan mereka, sebuah perjuangan yang dapat kita dukung."
CZE_agrarian_reform: "Memulihkan Kantor Pertanahan"
CZE_agrarian_reform_desc: "Kantor pertanahan yang baru-baru ini dibubarkan bertanggung jawab atas redistribusi sebagian besar lahan pertanian, sekarang saatnya kita mereformasi lembaga ini untuk melakukan tindakan yang lebih drastis."
CZE_realign_the_church: "Negara Ateisme"
CZE_realign_the_church_desc: "Agama sudah terlalu lama menjadi elemen yang memecah belah masyarakat [CZE.GetAdjective]. Kita harus mengurangi pengaruhnya terhadap urusan negara seperti pendidikan dan berita untuk menciptakan masyarakat yang lebih bersatu."
CZE_create_a_secret_police_branch: "Buat Cabang Polisi Rahasia"
CZE_create_a_secret_police_branch_desc: "Untuk menjamin stabilitas, kita harus mempertahankan diri dari musuh eksternal dan internal. Perlu waktu bagi masyarakat untuk terbiasa dengan sistem baru ini, terutama karena sistem ini masih dalam tahap penyempurnaan."
CZE_promote_urbanization: "$ARG_promote_urbanization$"
CZE_promote_urbanization_desc: "Sekarang kita telah membangun pertanian komunal yang efisien, kita dapat memulai program untuk menarik sebagian penduduk pedesaan ke kota dan meningkatkan produktivitas di sana."
CZE_confiscate_church_lands: "Menyita Tanah Gereja"
CZE_confiscate_church_lands_desc: "Gereja mengendalikan lebih banyak tanah dan kekayaan daripada yang diperlukan untuk mencapai tujuannya. Kami harus merealokasi sebagian lahan ini, seperti yang kami lakukan untuk para petani."
CZE_change_the_narrative:0 "Ubah Narasinya"
CZE_change_the_narrative_desc: "Meskipun gereja belum mendukung revolusi kita sejauh ini, menyelaraskan nilai-nilai gereja dengan nilai-nilai kita mungkin memainkan peran penting dalam menciptakan dukungan bagi rezim baru."
CZE_the_second_fortification_program: "Mulai Program Fortifikasi Kedua"
CZE_the_second_fortification_program_desc: "Program fortifikasi yang pertama meletakkan dasar bagi pertahanan yang perlu segera kita bangun. Demi masa depan bangsa kita, kita perlu memulai program fortifikasi kedua secepatnya dan menumbuhkan serta mengembangkan jalur fortifikasi kita."
CZE_redirect_the_fortification_councils_funds: "Alihkan Dana Dewan Fortifikasi"
CZE_redirect_the_fortification_councils_funds_desc: "Program-program fortifikasi ini sangat menguras perekonomian kita. Dana tersebut sebaiknya digunakan untuk mendanai berbagai program. Tentara tidak membutuhkan lebih banyak pertahanan, mereka punya banyak."
CZE_jachymov_uranium_mine: "Tambang Uranium Jáchymov"
CZE_jachymov_uranium_mine_desc: "Tambang di Jáchymov telah lama berfungsi sebagai sumber uranium dan bijih lainnya, namun pemanfaatan uranium hanya sedikit sampai perkembangan fisika terkini."
CZE_skoda_internal_competition: "Mendorong Persaingan Internal"
CZE_skoda_internal_competition_desc: "Di dalam perusahaan sebesar Škoda, sulit untuk mempertahankan kemampuan kerja puncak setiap orang. Mendorong persaingan internal akan sangat membantu dalam meningkatkan kinerja karyawan di pabrik kami."
CZE_skoda_max_optimization_tt: "Tingkat optimalisasi maksimum §YŠkoda Focus§! akan ditingkatkan menjadi 7."
CZE_skoda_increase_cooperation: "Meningkatkan Kerjasama dalam Škoda"
CZE_skoda_increase_cooperation_desc: "Untuk memperbaiki diri kita dapat meningkatkan kinerja dengan meningkatkan kerjasama lintas pabrik. Hal ini juga dapat mengarah pada pertukaran keahlian antar pabrik kami."
CZE_skoda_fast_optimization_tt: "Nilai §YŠkoda Fokus§! £GFX_prod_eff_cap Tingkat Pengoptimalan meningkat seiring waktu menuju Tingkat Maksimum: §G+100,0%§!"
CZE_master_of_armaments: "Ahli Persenjataan"
CZE_master_of_armaments_desc: "Škoda Works telah menjadi produsen senjata terbesar di wilayah kami sejak zaman Kekaisaran Austria-Hongaria. Keahlian dan pengalaman mereka tidak tertandingi di antara konglomerat industri di negara kita. Sudah waktunya kita mengangkat mereka ke gelar Master of Armaments."
CZE_only_the_best_is_good_enough: "Hanya yang Terbaik yang Cukup Baik"
CZE_only_the_best_is_good_enough_desc: "Škoda Works selalu didorong oleh etos kerja keras dan semangat inovatif. Para pendiri kami selalu berpegang pada moto: \"Hanya yang terbaik yang cukup baik bagi pelanggan kami!\" Motto itu terdengar lebih benar dari sebelumnya akhir-akhir ini."
CZE_an_industrial_legacy: "Warisan Industri"
CZE_an_industrial_legacy_desc: "Setelah mengembangkan industri negara kita ke tingkat yang sebelumnya dianggap mustahil, kita akhirnya dapat menerima dan mengklaim warisan industri kita. Kami adalah kekuatan industri yang tak tertandingi."
CZE_powerhouse_of_europe: "Pembangkit tenaga listrik Eropa"
CZE_powerhouse_of_europe_desc: "Industri kita kini membuat iri dunia. Kita sekarang harus memastikan sektor energi kita dapat memasoknya dengan baik."
CZE_supply_fighters_for_allies: "Pasokan Pejuang ke Sekutu"
CZE_supply_fighters_for_allies_desc: "Pemerintah [FRA.GetAdjective] dan [ENG.GetAdjective] sangat takut bahwa pesawat [GER.GetAdjective] akan dengan cepat menghancurkan pertahanan mereka dan menargetkan kota mereka jika konflik dimulai. Oleh karena itu, memperkuat angkatan udara mereka mungkin membuat mereka sedikit lebih percaya diri mengenai kemampuan mereka untuk menghentikan ekspansi [GER.GetAdjective] tanpa korban jiwa yang berarti."
CZE_allies_more_likely_to_defend_us_tt: "§YSekutu akan lebih cenderung mendukung kita melawan ekspansionisme Jerman terkait Sudetenland.§!"
CZE_allies_more_likely_to_defend_us_2_tt: "§YSekutu akan jauh lebih mungkin mendukung kita melawan ekspansionisme Jerman di Sudetenland.§!"
CZE_allies_more_likely_to_defend_us_3_tt: "§YSekutu akan lebih mungkin mendukung kita melawan ekspansionisme Jerman di Sudetenland.§!"
CZE_establish_the_state_defense_guard: "Membentuk Garda Pertahanan Negara"
CZE_german_nonagressionpact: "Pakta Haushofer-Krofta"
CZE_german_nonagressionpact_desc: "Negosiasi perjanjian non-agresi dengan [GER.GetNameDef] telah berlangsung cukup lama. Namun, setelah adanya tanda-tanda ketidakstabilan di [SOV.GetNameDef] dan rencana ekspansionis baru, hal ini terhenti. Dengan [GER.GetNameDef] yang saat ini diduduki oleh musuh-musuh lain, kita harus berusaha untuk memulai kembali perundingan ini."
CZE_revive_the_czechoslovak_legion_dynamic: "[CZE_revive_the_czechoslovak_legion]"
CZE_revive_the_czechoslovak_legion_default: "Bangkitkan kembali Legiun Cekoslowakia"
CZE_revive_the_czechoslovak_legion_communist: "Membentuk Organisasi Relawan"
CZE_revive_the_czechoslovak_legion_dynamic_desc: "Sekali lagi terjadi kerusuhan di dunia, dan prajurit pemberani [ROOT.GetNameDef] siap membela tanah air. Namun seperti yang telah dibuktikan di masa lalu, membela tanah air terkadang mengharuskan pasukan kita yang berperang di luar negeri harus kembali menemukan orang-orang yang rela meninggalkan tanah airnya, tepatnya untuk mempertahankannya."
CZE_revive_the_czechoslovak_legion_nsb_tt: "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§! akan diubah dari §YSemangat Angkatan Darat§! menjadi §YSemangat Nasional§!."
CZE_state_sponsored_recruitment_for_spain: "Rekrutmen yang Disponsori Negara untuk Spanyol"
CZE_state_sponsored_recruitment_for_spain_desc: "Dengan adanya konflik baru yang mana intervensi asing mungkin memainkan peran penting, kita harus mendorong para pejuang sukarelawan [ROOT.GetNameDef] untuk mendukung pihak yang paling sejalan dengan kebijakan kita. Kita bahkan dapat mengambil beberapa pelajaran tentang kemajuan peperangan dalam dekade terakhir dalam prosesnya."
CZE_support_spain_reward_tt: "§YEfek jika faksi Spanyol memiliki sukarelawan dari kami saat menang atau kalah:§!"
CZE_profit_off_the_spanish_civil_war: "Dapatkan keuntungan dari Perang Saudara Spanyol"
CZE_profit_off_the_spanish_civil_war_desc: "Perang Saudara Spanyol menjadi perang proksi bagi negara-negara besar. Kita tidak boleh mengambil risiko nyawa pasukan pemberani kita terjerat dalam konflik seperti ini. Sebaliknya, ini adalah kesempatan sempurna untuk mendanai pembangunan industri kita dengan menjual senjata, bahkan mungkin kepada kedua belah pihak."
CZE_skoda_sell_weapons_to_SPR_tt: "Membuka Keputusan: §YMenjual Senjata Secara Diam-diam ke Fraksi Spanyol§!"
CZE_placate_benes_faction: "Menyerah pada Fraksi Beneš"
CZE_placate_benes_faction_desc: "$CZE_milan_hodza$ harus menerima kenyataan bahwa tugasnya sebagai Menteri Luar Negeri berjalan buruk. $CZE_edvard_benesh$ siap bergabung dengan para pendukungnya di Agrians dan memperkuat posisi $CZE_milan_hodza$ sebagai Perdana Menteri selama ia melepaskan jabatannya di Luar Negeri."
CZE_claim_lands_of_the_bohemian_crown: "Klaim Tanah Mahkota Bohemia"
CZE_claim_lands_of_the_bohemian_crown_desc: "Karena bangsa kita adalah bagian dari berbagai kerajaan di abad-abad yang lalu, perbatasan kita bergeser karena konflik, bukan karena keinginan penduduk, sekarang saatnya untuk memperbaiki perubahan tersebut."
CZE_demand_katowice: "Permintaan [762.GetName]"
CZE_demand_katowice_desc: "Mendapatkan kendali atas [762.GetName] tidak hanya berarti pemulihan perbatasan kita sebelumnya, namun juga akan melemahkan klaim [POL.GetAdjective] atas [72.GetName]."
CZE_fight_over_silesia: "Berjuang untuk Silesia"
CZE_fight_over_silesia_desc: "Silesia mungkin berhak atas tanah [ROOT.GetAdjective], namun perang habis-habisan dengan [66.owner.GetNameDef] tidak diinginkan. Oleh karena itu, kita harus menunjukkan kekuatan kita melalui pertempuran perbatasan berskala besar, bukan dengan perang berskala besar. Jika [66.owner.GetNameDef] tidak bersedia berperang untuk mempertahankan Silesia, mereka mungkin akan merampas wilayah tersebut."
CZE_dismantle_poland:0 "Bongkar [POL.GetNonIdeologyName]"
CZE_dismantle_poland_desc: "Ketidakmampuannya untuk mempertahankan diri kini disorot, jelas bahwa [POL.GetNameDef] tidak dapat membentuk negara penyangga yang dapat diandalkan melawan musuh kita. Sebaliknya, kita harus bergerak untuk memperkuat negara kita sendiri."
CZE_proclaim_the_restoration_of_bohemia: "Proklamasikan Pemulihan Kerajaan Bohemia"
CZE_proclaim_the_restoration_of_bohemia_desc: "Dengan dipulihkannya perbatasan lama kami, kami kini dapat memperoleh kembali warisan kami dan fokus pada integrasi lahan baru kami."
CZE_integrate_lost_territories: "Integrasikan Wilayah yang Hilang"
CZE_integrate_lost_territories_desc: "Tanah bersejarah Kerajaan Bohemia terbentang dari Laut Baltik hingga Laut Adriatik, sekarang saatnya untuk memanfaatkan sejarah ini saat kita mengintegrasikan harta benda baru kita."
CZE_deepen_ties_with_puppet_kingdoms: "Mempererat Hubungan dengan Kerajaan Boneka"
CZE_deepen_ties_with_puppet_kingdoms_desc: "Meskipun kita sekarang mempunyai wilayah pengaruh yang jelas, kita perlu memperkuat pengaruh kita agar dapat memperoleh manfaat sebesar-besarnya dari negara-negara yang selaras ini."
CZE_poland_alliance_monarchist: "Perjanjian dengan [POL.GetNonIdeologyName]"
CZE_poland_alliance_monarchist_desc: "$CZE_ally_poland_desc$"
CZE_a_strong_poland:0 "[POL.GetNonIdeologyName] yang Kuat"
CZE_a_strong_poland_desc: "Memiliki salah satu tentara terkuat di Eropa Timur, [POL.GetNameDef] berpotensi menjadi sekutu yang berharga."
CZE_mend_balkan_relations: "Perbaiki Hubungan Balkan"
CZE_facilitate_a_strong_hungary: "Memfasilitasi Hongaria yang Kuat"
CZE_facilitate_a_strong_hungary_desc: "Sejak kemerdekaannya, hubungan [HUN.GetNameDef] dengan kami kurang baik. Namun ketika konflik mulai muncul, kita mungkin bisa menyelaraskannya dengan tujuan kita."
CZE_subjegate_romania: "Menekan Rumania dengan Klaim [HUN.GetAdjective]"
CZE_subjegate_romania_desc: "Klaim boneka [HUN.GetAdjective] kami adalah alat yang berguna untuk melawan [ROM.GetNameDef]. Dengan mengancam akan membiarkan [HUN.GetNameDef] mengajukan klaimnya atas wilayah [ROM.GetAdjective] dan membantu mereka memperolehnya, kita mungkin dapat menuntut penyelarasan [ROM.GetNameDef]."
CZE_demanded_overlordship_HUN: "Hongaria yang ditaklukkan"
CZE_demanded_overlordship_ROM: "Rumania yang ditaklukkan"
CZE_integrate_hungary: "Integrasikan Bekas Wilayah Austria"
CZE_integrate_hungary_desc: "Sekarang kita telah membangun lingkup pengaruh yang signifikan, integrasi [HUN.GetName] yang baru diperbesar dan wilayah lain dapat mengarah pada pemulihan perbatasan Austria-Hongaria, tetapi di bawah kepemimpinan [ROOT.GetAdjective]."
CZE_subjegate_serbia: "Tundukkan [YUG.GetName]"
CZE_subjegate_serbia_desc: "[YUG.GetName] yang sekarang melemah tidak lagi berfungsi sebagai negara penyangga yang efektif untuk mempertahankan sisi selatan kita. Setelah mengintegrasikan Slovenia, kita sekarang harus berupaya untuk memperluas lebih jauh lagi."
CZE_strike_the_eastern_threat: "Serang Ancaman Timur"
CZE_strike_the_eastern_threat_desc: "[SOV.GetName] yang munafik, yang membenarkan ambisi kekaisarannya dengan mengkritik pemerintah kita, merupakan ancaman nyata terhadap [CZE.GetName] yang harus dihilangkan."
CZE_assist_austria:0 "Lindungi [AUS.GetName]"
CZE_assist_austria_desc: "Menjaga [AUS.GetNameDef] dari konflik apa pun sangat penting bagi keamanan nasional kita. Perbatasan [AUS.GetAdjective] adalah salah satu titik paling rentan dalam pertahanan kita. Perekonomian mereka juga akan menjadi aset berharga bagi musuh-musuh kita, sesuatu yang tidak bisa kita biarkan terjadi."
CZE_return_to_democracy: "Kembali ke Demokrasi"
CZE_return_to_democracy_desc: "Dengan terlindunginya rumah kita, masyarakat semakin sadar bahwa kediktatoran militer sudah tidak produktif lagi. Oleh karena itu, inilah saatnya untuk menyelenggarakan pemilu dan menyerahkan kekuasaan kembali kepada pemerintahan demokratis yang dipimpin oleh sipil."
CZE_cooperate_with_the_allies: "Bekerjasama dengan Sekutu"
CZE_cooperate_with_the_allies_desc: "Dengan terciptanya stabilitas yang lebih baik di kawasan ini, kita harus melakukan upaya untuk memulihkan hubungan dengan sekutu lama kita."
CZE_eliminate_austrian_defeatists:0 "Kalahkan [AUS.GetAdjective] Yang Mengalahkan"
CZE_eliminate_austrian_defeatists_desc: "[AUS.GetNameDefCap] sudah putus asa untuk mempertahankan negaranya, kita harus turun tangan sekarang sebelum kita dikepung."
CZE_the_legacy_of_ottokar:0 "Warisan Ottokar"
CZE_the_legacy_of_ottokar_desc: "Raja legendaris Ottokar II memperluas wilayah Bohemia ke Austria dan Laut Adriatik melalui persetujuan para bangsawan Austria. Kita harus sekali lagi memohon kepada orang-orang Austria, baik yang mulia maupun yang tidak mulia."
CZE_demand_the_istrian_peninsula: "Menuntut Semenanjung Istrian"
CZE_demand_the_istrian_peninsula_desc: "[ROOT.GetNameDefCap] terkurung daratan sudah terlalu lama menjadi hambatan bagi perdagangan dan pengaruh kita. Kita tidak bisa lagi menerima perekonomian kita bergantung pada negara-negara tetangga dan harus menuntut akses ke Laut Adriatik."
CZE_demand_slovenia: "Permintaan Slovenia"
CZE_demand_slovenia_desc: "Slovenia pada masa lalu merupakan bagian penting dari Kekaisaran Austria, dan sekarang kita telah mengambil kendali atas inti kekaisaran tersebut, kita harus berusaha untuk merebut kembali wilayah mereka sekali lagi."
CZE_demand_overlordship_of_yugoslav_league: "Menuntut Kekuasaan Liga [YUG.GetAdjective]"
CZE_demand_overlordship_of_yugoslav_league_desc: "Meskipun kita juga mengetahui [YUG.GetName] bahwa otonomi daerah terkadang diperlukan di negara multi-etnis, aliansi mereka kini terlalu lemah untuk mempertahankan diri. Kita harus mengajukan banding kepada [YUG.GetNameDef] untuk menyadari hal ini dan mengizinkan kita untuk melakukan intervensi."
CZE_expand_the_rome_protocols: "Perluas Protokol Roma"
CZE_expand_the_rome_protocols_desc: "Pemerintahan baru kita lebih sejalan dengan pemerintahan di [ITA.capital.GetCapitalVictoryPointName] dibandingkan [GER.capital.GetCapitalVictoryPointName]. Dengan adanya perbedaan pendapat antara keduanya mengenai Austria, bergabung dengan Protokol Roma dapat memberikan [ITA.GetNameDef] keyakinan yang dibutuhkan untuk tetap berada pada jalurnya saat ini daripada beralih ke [GER.GetNameDef]."
CZE_prague_protocols: "Protokol Praha"
CZE_soviet_alliance: "Perluas Perjanjian Aliansi 1935"
CZE_soviet_alliance_desc: "Perjanjian aliansi saat ini dengan [SOV.GetNameDef] terlalu ambigu untuk memastikan intervensi mereka jika kita diserang. Oleh karena itu, kita harus mendekati mereka untuk membuat perjanjian baru jika kita ingin menjamin keamanan kita."
CZE_airlift_soviet_support: "Dukungan Transportasi Udara Soviet"
CZE_airlift_soviet_support_desc: "Kurangnya perbatasan dengan sekutu [SOV.GetAdjective] kita telah memunculkan ide baru untuk terbang dengan pasukan [SOV.GetAdjective]. Operasi transportasi sebesar ini belum pernah terjadi sebelumnya namun berarti pasukan [SOV.GetAdjective] tidak perlu memasuki wilayah tetangga kita, setidaknya di darat."
CZE_unlocks_volunteer_transport_raid_tt: "Membuka §YRaid§!:\nJembatan Udara Untuk Relawan Soviet di §Y[73.GetName]§!"
CZE_intervene_in_the_ussr: "Campur tangan dalam Perang Saudara [SOV.GetAdjective]"
CZE_intervene_in_the_ussr_desc: "Sekali lagi terjadi kerusuhan di [SOV.GetNameDef], dan meskipun keluarga kerajaan lama yang pernah kami dukung tidak akan kembali, kemungkinan pemerintahan yang lebih bersahabat tidak dapat diabaikan."
CZE_forgive_trading_debts: "Maafkan Hutang Dagang"
CZE_forgive_trading_debts_desc: "Ketidakstabilan ekonomi dan Depresi Besar telah membebani beberapa sekutu potensial kita dengan utang kepada kita yang sulit mereka bayar sehingga membuat hubungan menjadi tegang. Pemerintah dapat menghapuskan utang-utang tersebut dan memberikan kompensasi kepada perusahaan-perusahaan dalam negeri yang terkena dampak langkah ini."
CZE_improve_balkan_trade_relations: "Meningkatkan Hubungan Perdagangan Balkan"
CZE_improve_balkan_trade_relations_desc: "Aset terbesar kita dalam memenangkan calon sekutu Balkan adalah perekonomian kita, kita harus menunjukkan kesediaan kita untuk mengeluarkan sumber daya untuk memperbaiki situasi ekonomi calon sekutu kita."
CZE_ally_austria: "Sekutu [AUS.GetName]"
CZE_ally_austria_desc: "Pemerintahannya hampir digulingkan oleh preman Nazi beberapa tahun yang lalu, [AUS.GetNameDef] harus mulai menyadari potensi manfaat dari kerja sama dengan [ROOT.GetNameDef]."
CZE_demand_the_czech_corridor: "Menuntut Koridor Ceko"
CZE_demand_the_czech_corridor_desc: "Ketika kita membangun Entente Kecil menjadi aliansi yang tepat, menjadi semakin jelas bahwa mengerahkan kembali pasukan ke sekutu kita, atau menerima pasukan mereka, terbukti sangat sulit jika terjadi konflik. Memiliki sebidang wilayah yang menghubungkan negara kita dan [YUG.GetNameDef] seperti yang pernah diusulkan setelah Perang Besar dapat meningkatkan keselamatan kita dan menjaga perdagangan kita."
CZE_ally_hungary: "Sekutu [HUN.GetName]"
CZE_ally_hungary_desc: "Terlepas dari konflik yang mengganggu hubungan kami dengan [HUN.GetNonIdeologyName] sejak lahirnya [CZE.GetNonIdeologyName], mereka baru-baru ini menunjukkan potensi untuk menjadi sekutu yang berharga."
CZE_ally_yugoslavia: "Sekutu [YUG.GetName]"
CZE_ally_yugoslavia_desc: "[YUG.GetNameDefCap] mungkin sedang mengalami kesulitan perekonomian akhir-akhir ini, namun sumber daya dan lokasinya yang strategis tidak dapat diabaikan."
CZE_protect_neutrality: "Lindungi Netralitas"
CZE_protect_neutrality_desc: "Perang Besar memperjelas bahwa upaya untuk tetap netral adalah sia-sia jika berada di garis bidik musuh. Melindungi negara-negara ini berarti memaksa musuh-musuh kita berperang dua front ketika melakukan ekspansi, alih-alih membiarkan mereka terpecah belah dan menaklukkan."
CZE_if_cooperate_with_moderate_socialists_completed_tt: "Dampak jika §YBekerjasama dengan Sosialis Moderat§! telah selesai:"
CZE_mutual_protection_agreement_with_switzerland: "Perjanjian Perlindungan dengan [SWI.GetNonIdeologyName]"
CZE_mutual_protection_agreement_with_switzerland_desc: "Baik kami maupun [SWI.GetNameDef] sedang berupaya mewujudkan situasi di mana invasi ke tanah kami tidak mungkin dilakukan tanpa kerugian yang tidak dapat ditanggung, dengan bekerja sama, kami dapat menurunkan pasukan dengan jumlah yang tidak hanya untuk bertahan, namun juga untuk melakukan serangan balik dengan tegas."
CZE_exchange_technology: "Bekerja Sama dalam Penelitian"
CZE_exchange_technology_desc: "Meskipun memiliki sumber daya alam yang melimpah, Balkan tidak mempunyai koloni yang menguntungkan atau industri maju seperti negara-negara besar. Oleh karena itu, penting bagi kita untuk bekerja sama dalam penelitian agar dapat fokus pada spesialisasi kita masing-masing."
CZE_demand_corridor_to_ussr: "Minta Koridor ke [SOV.GetAdjective]s"
CZE_demand_corridor_to_ussr_desc: "Jika [POL.GetNameDef] tidak mau bekerja sama dengan kami, kami harus mengambil tindakan yang lebih serius untuk memastikan akses ke sekutu [SOV.GetName] kami."
CZE_ally_poland:0 "Sekutu [POL.GetName]"
CZE_ally_poland_desc: "Dengan masih teringatnya Perang Polandia-Soviet dan meningkatnya ancaman di wilayah barat, [POL.GetNameDef] mengalami pencarian keamanan yang sama seperti kita. Kita harus meyakinkan [POL.GetAdjective] bahwa netralitas tidak akan menyelamatkan mereka, dan kita harus menyerahkan nasib mereka kepada kita."
CZE_realize_the_polish_czechoslovak_confederation: "Wujudkan Konfederasi"
CZE_realize_the_polish_czechoslovak_confederation_desc: "Meskipun mereka bertarung dengan gagah berani, [POL.GetNameDef] telah dikalahkan. Dengan pemerintahan mereka yang berada di pengasingan, muncullah ide-ide untuk bersatu dengan kami. Dengan bergabungnya pemerintahan mereka dengan pemerintahan kita, kita dapat menggalang [POL.GetAdjective] ke negara baru ini dan melakukan upaya terkoordinasi untuk membebaskan tanah air kita bersama."
CZE_integrate_western_ukrainians:0 "Integrasikan Ukraina Barat"
CZE_integrate_western_ukrainians_desc: "Warga Ukraina di [CZE.GetNameDef] telah ditawari banyak bantuan dan otonomi, kami sekarang dapat mencoba untuk mengintegrasikan tanah yang baru diperoleh ke dalam provinsi kami di Ukraina."
CZE_ally_russia:0 "Sekutu [SOV.GetNonIdeologyName]"
CZE_ally_russia_desc: "Sekarang pemerintahan [SOV.GetNameDef] lebih sejalan dengan pemerintahan kita, kita dapat mencoba memperluas perjanjian yang tidak jelas yang ditandatangani dengan pemerintahan mereka sebelumnya."
CZE_claim_ukraine:0 "Bentuk Pemerintahan Ukraina yang Ramah"
CZE_claim_ukraine_desc: "Ukraina adalah bagian penting dari [SOV.GetNameDef], dengan merebutnya, kita dapat membentuk negara penyangga yang kuat."
CZE_strengthen_the_little_entente:0 "Formalisasikan Entente Kecil"
CZE_strengthen_the_little_entente_desc: "Terutama ditujukan untuk membendung [HUN.GetNonIdeologyName], Entente Kecil memiliki potensi untuk menjadi aliansi serius dengan pasukan yang cukup besar."
CZE_seek_french_leadership:0 "Carilah [FRA.GetAdjective] Kepemimpinan"
CZE_seek_french_leadership_desc: "Terlepas dari inisiatif kami dalam membentuk aliansi ini, jelas pasukan [FRA.GetNonIdeologyName] akan menjadi tambahan yang bagus untuk aliansi mana pun. Sekalipun itu berarti menyerahkan kepemimpinan."
CZE_increase_food_and_resource_imports:0 "Meningkatkan Impor Pangan dan Sumber Daya"
CZE_increase_food_and_resource_imports_desc: "Dengan sekutu baru kita yang memiliki industri pertanian yang kuat, maka kita tidak perlu lagi mensubsidi negara kita. Mengimpor sumber daya dengan harga murah akan menghemat uang kita dan memberikan dorongan kepada sekutu kita terhadap perekonomian mereka."
CZE_double_down_on_heavy_industry:0 "Gandakan Industri Berat"
CZE_double_down_on_heavy_industry_desc: "Perjanjian baru dengan sekutu kita akan memungkinkan kita untuk fokus pada industri yang paling kompetitif, seperti industri senjata. Kelebihannya kemudian bisa dijual."
CZE_neutralize_the_hungarian_threat:0 "Netralkan [HUN.GetAdjective] Ancaman"
CZE_neutralize_the_hungarian_threat_desc: "[HUN.GetNameDefCap] merupakan hambatan dalam perdagangan dengan calon sekutu di selatan, dan jika disejajarkan dengan musuh-musuh kita, hal ini dapat membuat bagian penting dari tentara kita tetap sibuk meskipun ada dampak dari Perjanjian Trianon."
CZE_cancel_anti_hungary_focus: "Mundur setelah intervensi [GER.GetAdjective]"
CZE_ally_romania:0 "Sekutu [ROM.GetName]"
CZE_ally_romania_desc: "[ROM.GetNameDefCap] secara unik adalah salah satu negara yang lebih mandiri di kawasan ini, yang memproduksi pangan dan minyak yang berharga. Menyelaraskan keduanya tidak hanya akan memberi kita akses yang lebih mudah terhadap sumber daya satu sama lain namun juga akan menghilangkan bahan mentah yang dibutuhkan musuh untuk berperang melawan kita."
CZE_divide_germany:0 "Bagilah Jerman"
CZE_divide_germany_desc: "Ancaman dari [GER.GetNameDef] sulit untuk diatasi sendirian, oleh karena itu kita harus mencari sekutu yang juga memiliki kekhawatiran yang sama terhadap ekspansi [GER.GetAdjective], dan memiliki kemauan untuk bertindak terlebih dahulu."
CZE_if_FRA_ally_tt: "Dampak jika §YPrancis bersifat monarki§! dan belum bersekutu dengan negara lain:"
CZE_if_POL_ally_tt: "Akibat jika §YA Polandia Kuat§! telah selesai dan menghasilkan jaminan dari [POL.GetNonIdeologyName]:"
CZE_revolutionary_brigades:0 "Menemukan Brigade Revolusioner"
CZE_revolutionary_brigades_desc: "Kaum revolusioner kita yang sekarang mempunyai pengalaman memperjuangkan [ROOT.GetNameDef] harus diintegrasikan lebih jauh ke dalam tentara reguler."
CZE_recruit_communist_exiles: "Rekrut orang-orang buangan komunis"
CZE_recruit_communist_exiles_desc: "[ROOT.capital.GetCapitalVictoryPointName] telah lama menjadi tempat berlindung yang aman bagi kaum revolusioner di pengasingan, pemerintahan baru kita dapat memanfaatkan kelompok radikal asing ini."
CZE_destabilize_potential_adversaries: "De-Stabilisasi Musuh Potensial"
CZE_destabilize_potential_adversaries_desc: "Para komunis di pengasingan tempat kita bekerja mempunyai pemahaman tentang negara asal mereka yang bahkan mata-mata kita pun sulit untuk menandinginya. Kita harus memanfaatkan sepenuhnya pengetahuan ini ketika memutuskan strategi untuk membebaskan tanah air mereka."
CZE_nationalize_key_industries:0 "Nasionalisasi Bank dan Pertambangan"
CZE_nationalize_key_industries_desc: "Tambang menyediakan bahan mentah yang ditempa oleh industri kita untuk dijadikan senjata perang. Memastikan bahwa pasokan bahan baku pada saat krisis sebaiknya diserahkan kepada pemerintah, bukan kepada pemodal dan industrialis."
CZE_rehabilitate_the_army: "Rehabilitasi Angkatan Darat"
CZE_rehabilitate_the_army_desc: "Sebagian besar jenderal tentara [CZE.GetAdjective] adalah veteran Legiun Cekoslowakia, yang paling menonjol berperang melawan Soviet dalam perang saudara mereka. Penting untuk memastikan kesetiaan mereka kepada pemerintahan [CZE.GetAdjective] yang baru."
CZE_unlock_civil_war_army_generals_tt: "Dapatkan Kembali Komandan yang Hilang dalam Perang Saudara"
CZE_recruit_ideologically_aligned_generals: "Rekrut Jenderal yang Dapat Diandalkan Secara Ideologis"
CZE_recruit_ideologically_aligned_generals_desc: "Ini saatnya untuk menyesuaikan program pelatihan kita untuk memperkaya tentara dengan kandidat baru yang memahami nilai-nilai baru kita."
CZE_recruit_communist_generic_general_tt: "Mendapatkan seorang jenderal komunis."
CZE_purge_two_random_commanders_tt: "Dua komandan acak akan dibersihkan."
CZE_czechoslovak_union: "Uni Cekoslowakia"
CZE_czechoslovak_union_desc: "Otonomi daerah harus ditingkatkan pada [CZE.GetNameDef], hal ini memungkinkan sistem komunis dapat disesuaikan dengan keadaan setempat."
CZE_continue_industrial_relocation_schemes: "Lanjutkan Skema Relokasi Gudang Senjata"
CZE_continue_industrial_relocation_schemes_desc: "Demi keamanan nasional, kita harus terus merelokasi pabrik-pabrik kita yang lebih rentan ke wilayah yang lebih terlindungi dari serangan udara dan darat. Kita tidak bisa mengambil risiko bahwa industri yang kritis seperti ini akan berada dalam bahaya."
CZE_continue_industrial_relocation_schemes_tt: "Hapus §Y1 Pabrik Militer§!."
CZE_continue_industrial_relocation_schemes_2_tt: "§RPabrik perlu dibangun kembali.§!"
CZE_establish_a_armament_factory_in_uhersky_brod: "Menemukan Pabrik Persenjataan Uherský Brod"
CZE_establish_a_armament_factory_in_uhersky_brod_desc: "Pabrik Uherský Brod adalah pabrik persenjataan yang mengkhususkan diri dalam pembuatan dan perancangan senjata otomatis untuk infanteri dan pesawat terbang. Kami berencana menjadikannya pabrik tercanggih di dunia."
CZE_appeal_to_the_castle: "Banding ke Kastil"
CZE_appeal_to_the_castle_desc: "'Kastil' di Cekoslowakia mengacu pada jaringan luas organisasi-organisasi berpengaruh dan orang-orang yang mendukung presidennya. Kekuasaan ini pada gilirannya memungkinkan presiden untuk memberikan pengaruh yang lebih besar dibandingkan dengan tugas konstitusional mereka yang terbatas. Meminta dukungan dari kelompok ini akan memberikan dorongan luar biasa bagi upaya kita untuk menjadi pemimpin."
CZE_petition_the_nobles: "Petisi para Bangsawan"
CZE_petition_the_nobles_desc: "Kelas bangsawan [ROOT.GetNameDef] mungkin tidak lagi memiliki gelar yang diakui, namun mereka masih merupakan bagian berpengaruh dari masyarakat [ROOT.GetAdjective], dukungan mereka akan memberi kita legitimasi dan sumber daya yang dibutuhkan untuk mengumpulkan dukungan lebih lanjut."
CZE_unify_the_fascist_parties: "Satukan Partai Fasis"
CZE_unify_the_fascist_parties_desc: "Kondisi partai-partai fasis saat ini sudah terpecah-belah, dan banyak dari partai-partai tersebut bersikap ekstrem sehingga mereka tidak pernah bisa berharap untuk mendapatkan dukungan yang signifikan. Untuk membela negara, partai-partai ini perlu bersatu dan menciptakan visi Cekoslowakia yang tidak hanya menarik bagi elemen masyarakat pinggiran."
CZE_pro_rearmament_propaganda: "Propaganda Pro-Persenjataan Kembali"
CZE_pro_rearmament_propaganda_desc: "Untuk meningkatkan dukungan bagi pemerintahan yang lebih tersentralisasi, kita harus menyoroti situasi yang sedang rapuh di dunia sekitar kita. Hal ini juga akan membantu memotivasi masyarakat untuk mendukung rencana penguatan tentara bila diperlukan."
CZE_align_nationalist_parties: "Menyelaraskan Partai Nasionalis Ceko"
CZE_align_nationalist_parties_desc: "Meskipun kita harus mencoba untuk menarik semua [ROOT.GetAdjective], tidak dapat disangkal bahwa partai-partai tradisional nasionalis Ceko adalah yang paling berpengaruh di kancah politik, dan dengan merekalah kita dapat dengan mudah mengumpulkan dukungan."
CZE_align_slovak_catholics: "Menyelaraskan umat Katolik Slovakia"
CZE_align_slovak_catholics_desc: "Partai Katolik dan nasionalis saat ini mendapat banyak dukungan di Slovakia. Meskipun memohon kepada kaum nasionalis akan sulit dilakukan tanpa adanya konsesi yang serius, kita mungkin bisa menggalang unsur-unsur Katolik untuk mendukung perjuangan kita."
CZE_jozef_tiso_tt: "Menunjuk penasihat §Y$CZE_jozef_tiso$§!"
CZE_align_catholic_parties: "Sejajarkan CSL"
CZE_align_catholic_parties_desc: "ČSL dan partai-partai Katolik lainnya adalah basis pendukung tradisional sistem monarki di kekaisaran Austro-Hungaria, sekarang saatnya kita mencoba untuk mengarahkan mereka kembali ke posisi ini."
CZE_restore_the_monarchy: "Kembalikan Monarki"
CZE_restore_the_monarchy_desc: "Dengan dukungan terhadap sistem baru yang telah ditetapkan, sekarang saatnya kita mengusulkan gagasan yang lebih baik kepada masyarakat. Dengan $CZE_karel_schwarzenberg$ sebagai raja terpilih, kami memohon kepada pendukung lama monarki, dan pendukung baru karena dia adalah [ROOT.GetAdjective], bukan raja [AUS.GetAdjective] seperti yang sebelumnya dipaksakan kepada kami."
CZE_semi_constitutional_monarchy: "Sistem Semi-Konstitusional"
CZE_semi_constitutional_monarchy_desc: "Dengan terpilihnya seorang raja, sudah waktunya untuk menyesuaikan konstitusi, sementara beberapa pihak menganjurkan sentralisasi kekuasaan untuk menghindari pertikaian di masa-masa sulit ini, jelas bahwa raja tidak dapat melakukan segalanya sendirian. Oleh karena itu, mungkin yang terbaik adalah mempertahankan sebagian sistem yang ada saat ini untuk membantu menjalankan negara, dan juga menempatkan raja di sana untuk memimpin negara."
CZE_restore_noble_titles: "Kembalikan Gelar Mulia"
CZE_restore_noble_titles_desc: "Sempat bubar saat republik berdiri, kini saatnya menghargai kerja sama kaum bangsawan dengan mengembalikan gelar mereka. Hal ini juga akan memungkinkan kita untuk memberikan gelar kehormatan kepada para pahlawan seperti perwira veteran yang berjuang berulang kali untuk negara [ROOT.GetAdjective]."
CZE_restore_the_austro_hungarian_customs_union: "Pulihkan Serikat Pabean Kekaisaran"
CZE_restore_the_austro_hungarian_customs_union_desc: "Salah satu keuntungan tak terbantahkan dari kerajaan Austro-Hungaria adalah terbatasnya hambatan perdagangan bagi industri kita, mengembalikan serikat ini akan menjadi langkah pertama untuk membawa negara-negara bekas konstituen lainnya ke dalam lingkup kita."
CZE_customs_union: "Serikat Pabean"
CZE_catholic_focus:0 "Fokus Katolik"
CZE_catholic_focus_desc: "Meskipun kaum Hussite menjadi bagian terkenal dalam sejarah [ROOT.GetAdjective], banyak dari mereka yang masih menganut kepercayaan Katolik yang harus kita dukung dengan meningkatkan peran mereka dalam masyarakat."
CZE_hussite_legacy:0 "Warisan Hussite"
CZE_hussite_legacy_desc: "Kaum Hussite tidak hanya mempromosikan gaya kekristenan yang lebih Protestan, mereka juga menonjol karena toleransi mereka terhadap pendapat lain mengenai masalah ini, tidak seperti para tiran yang berperang untuk menentang mereka."
CZE_align_with_germany:0 "Sejajarkan dengan [GER.GetNonIdeologyName]"
CZE_align_with_germany_desc: "Pemerintahan baru di [GER.GetNameDef] mungkin tidak terlalu ekspansionis, namun mereka mungkin terbukti lebih pragmatis dalam menentukan dengan siapa mereka bersekutu dan dengan siapa mereka mengecam. Kita harus berusaha untuk berada di grup sebelumnya."
CZE_rally_against_germany: "Unjuk Rasa Melawan [GER.GetNonIdeologyName]"
CZE_rally_against_germany_desc: "Rakyat Cekoslowakia berjuang dengan gagah berani untuk kemerdekaan mereka, dan kita sekarang harus menghimbau semua orang untuk melindungi kemerdekaan ini."
CZE_integrate_sudeten_germans:0 "Integrasikan Sudetenland"
CZE_integrate_sudeten_germans_desc: "Perpecahan di antara penduduk Sudetenland tidak membantu siapa pun. Kita harus berupaya mengatasi kekhawatiran mereka dan berupaya mengatasinya. Hal ini saja sudah bisa melemahkan tokoh-tokoh independen, karena klaim mereka atas perlakuan buruk yang sulit dipercaya."
CZE_cooperate_with_the_sdp:0 "Bekerjasama dengan SdP"
CZE_cooperate_with_the_sdp_desc: "Meskipun merupakan kekuatan yang mengganggu stabilitas, SdP mungkin akan sejalan jika didorong dengan baik, seperti dengan dimasukkannya mereka ke dalam koalisi yang berkuasa."
CZE_revive_the_december_bloc:0 "Menghidupkan kembali Blok Desember"
CZE_revive_the_december_bloc_desc: "Blok partai fasis, minoritas, dan sayap kanan pada bulan Desember yang menentang Edvard Benes menjadi presiden harus dipulihkan untuk menawarkan alternatif terhadap pemerintahan saat ini."
CZE_revert_1926_anti_military_laws:0 "Kembalikan Undang-Undang Anti-Militer tahun 1927"
CZE_revert_1926_anti_military_laws_desc: "Setelah upaya kudeta oleh $CZE_radola_gajda$, tentara dan gendarmerie kehilangan hak untuk memilih, serta hak-hak istimewa lainnya. Mengingat posisi penting tentara di masa-masa sulit ini, wajar jika kita menghapus pembatasan ini dan menghilangkan kesenjangan antara tentara dan politik."
CZE_bop_to_fascism_support_tt: "Tambahkan sepertiga dari nilai §Y$CZE_bop_army_readiness$§! pada dukungan fasisme:"
CZE_power_to_the_military: "Kekuasaan untuk Militer"
CZE_power_to_the_military_desc: "Jelas tidak ada sumber daya yang bisa dihemat untuk membela negara. Hal ini menjadikan penting bagi mereka yang berkuasa untuk memahami kebutuhan tentara, dan tidak ada cara yang lebih baik untuk memastikan hal tersebut selain melalui pemerintahan militer."
CZE_militarize_the_associations: "Militerisasi Asosiasi"
CZE_militarize_the_associations_desc: "Banyaknya asosiasi [CZE.GetNameDef] dapat berkontribusi pada pertahanan negara dengan mengajarkan keterampilan yang penting bagi seorang prajurit, bahkan sebelum masyarakat dimobilisasi."
CZE_aggressive_foreign_policy:0 "Kebijakan Luar Negeri yang Agresif"
CZE_aggressive_foreign_policy_desc: "Masa untuk mempercayai perjanjian yang rapuh sudah berakhir, kita harus bertindak tegas untuk menjaga keamanan kita, bahkan jika hal itu membutuhkan pengorbanan yang serius."
CZE_work_with_germany: "Bekerja dengan [GER.GetNameDef]"
CZE_work_with_germany_desc: "Setelah pertanyaan Sudeten terselesaikan, mungkin [GER.GetNameDef] sekarang dapat menyadari betapa berharganya [ROOT.GetNameDef] sebagai sekutu."
CZE_control_the_associations:0 "Kontrol Asosiasi"
CZE_control_the_associations_desc: "[CZE.GetNonIdeologyName] memiliki banyak organisasi, mulai dari orang-orang yang berbagi pekerjaan yang sama, hingga minat waktu luang atau asosiasi olahraga, kendalikan ini dan Anda mengendalikan sebagian besar masyarakat."
CZE_diversify_bata: "Diversifikasi Bat'a"
CZE_diversify_bata_desc: "Bat'a adalah perusahaan konsumen besar yang dapat kami manfaatkan dalam rantai pasokan sumber daya kami. Mereka dapat membantu kita dengan menyediakan materi penting yang sulit didapat."
CZE_devaluate_the_koruna: "Devaluasi Koruna"
CZE_devaluate_the_koruna_desc: "Memiliki mata uang yang kuat merupakan posisi ekonomi yang berbahaya sebagai negara yang mengandalkan ekspor untuk sebagian besar perekonomiannya. Melemahnya mata uang kita mungkin akan menimbulkan dampak buruk dalam jangka pendek, namun dalam jangka panjang, kita akan lebih baik jika melakukan hal tersebut."
CZE_continue_the_central_bohemia_plan: "Rencana Bohemia Tengah"
CZE_continue_the_central_bohemia_plan_desc: "Melanjutkan rencana kami untuk memperluas kawasan industri di pusat negara kami akan memungkinkan kami memanfaatkan skala ekonomi. Memperluas industri kita di tempat yang jauh dari perbatasan juga merupakan tindakan bijaksana dari sudut pandang keamanan nasional."
CZE_balance_industrial_invevestments: "Menyeimbangkan Upaya Pembangunan Industri"
CZE_balance_industrial_invevestments_desc: "Meninggalkan daerah-daerah di luar [9.getname] dan [75.getname] adalah salah satu alasan negara kita mulai terpecah belah pada awal dekade ini. Berkembangnya wilayah di luar negara kita akan membantu menjembatani kesenjangan dalam pengembangan industri antara kedua wilayah tersebut."
CZE_expand_prf_science_facilities: "Memperluas Fasilitas Sains PrF"
CZE_expand_prf_science_facilities_desc: "Fasilitas sains Prf dipenuhi oleh sekelompok individu cerdas yang menunggu kesempatan untuk melakukan sesuatu yang lebih besar daripada yang mereka lakukan saat ini. Memperluas departemen ini dan meminta mereka bekerja sama dengan pemerintah merupakan awal yang baik untuk meningkatkan penelitian kami."
CZE_raise_more_industrial_funds: "Mengumpulkan Lebih Banyak Dana Industri"
CZE_raise_more_industrial_funds_desc: "Sejak masa Austria-Hongaria hingga saat ini, industri telah menjadi jantung bangsa kita. Dengan menyediakan anggaran dan pendanaan yang penting, organisasi ini akan terus berkembang di Eropa yang bermasalah ini."
CZE_skoda_priority_focus_info_tt: "Beberapa §YFokus Nasional§! akan mengharuskan kita untuk berada pada Fokus £GFX_CZE_skoda_text_icon §YŠkoda Prioritas§! tertentu untuk diselesaikan. Fokus ini ditunjukkan dengan ikon kecil yang terkait dengan £GFX_CZE_skoda_text_icon §YŠkoda Prioritas§! yang diperlukan."
CZE_joint_stock_schemes: "Skema Saham Gabungan"
CZE_joint_stock_schemes_desc: "Skema saham gabungan telah berfungsi sebagai sumber pertumbuhan ekonomi ketika sumber pendanaan tradisional tidak mencukupi. Melanjutkan penggunaan taktik ini akan mendorong pertumbuhan ekonomi kita lebih lanjut."
CZE_the_slovak_arrow: "Panah Slovakia"
CZE_the_slovak_arrow_desc: "Mengembangkan kereta cepat antara dua kota besar kita akan menjadi sumber kebanggaan nasional. Hal ini juga akan memberi kita alasan yang baik untuk meningkatkan infrastruktur kereta api."
CZE_finish_double_tracking_efforts: "Upaya Pelacakan Ganda"
CZE_finish_double_tracking_efforts_desc: "Menyelesaikan upaya untuk menggandakan jalur beberapa jalur kereta api sekunder yang penting akan memungkinkan kami memperoleh lalu lintas yang lebih besar di jalur tersebut. Mengarah pada konektivitas yang lebih baik antara beberapa kota sekunder kita."
CZE_realize_motorway_proposals: "Realisasikan Proposal Jalan Tol"
CZE_realize_motorway_proposals_desc: "Beberapa usulan jalan raya diajukan kepada pemerintah kita yang akan sangat meningkatkan konektivitas jalan raya di dalam perbatasan kita. Kita harus menindaklanjuti usulan ini dan mewujudkannya."
CZE_build_additional_rail_stations: "Bangun Stasiun Kereta Api Tambahan"
CZE_build_additional_rail_stations_desc: "Dengan infrastruktur kereta api kami yang baru dikembangkan, beberapa stasiun kereta api kami yang ada tidak dapat menangani peningkatan jumlah penumpang. Memperbaikinya akan sangat membantu kemampuan kita untuk membawa orang dan barang ke tempat yang mereka perlukan dalam jumlah yang lebih besar."
CZE_build_additional_rail_stations_focus_cost_tt: "Mengambil §Y$CZE_devaluate_the_koruna$§! akan mengurangi waktu yang dibutuhkan fokus ini menjadi §G35§! hari."
CZE_grow_ckd_secondary_facilities: "Fasilitas Sekunder CKD"
CZE_grow_ckd_secondary_facilities_desc: "CKD memiliki banyak pabrik sekunder kecil yang menghasilkan beberapa produk industri penting seperti generator listrik. Memperluas pabrik-pabrik ini akan membantu pertumbuhan industri berat kita."
CZE_bolster_domestic_construction: "Mendukung Konstruksi Dalam Negeri"
CZE_bolster_domestic_construction_desc: "Sektor konstruksi dalam negeri kami terus berkembang sejak kami merdeka setelah berakhirnya Perang Besar. Memberikan investasi tambahan kepada beberapa kontraktor konstruksi skala menengah akan semakin memperkuat pertumbuhan ini."
CZE_invest_in_vhht: "Berinvestasilah di VHHT"
CZE_invest_in_vhht_desc: "VHHT adalah perusahaan yang mencakup banyak pabrik pengerjaan logam berbeda di seluruh negara kita. Berinvestasi dan memperluasnya akan membantu kami meningkatkan berbagai bidang produksi logam kami di masa mendatang."
CZE_expand_vitkovice_ironworks: "Perluas Pabrik Besi Vítkovicé"
CZE_expand_vitkovice_ironworks_desc: "Pabrik Besi Vítkovicé adalah pemasok penting Besi di [74.getname]. Memperluasnya akan sangat meningkatkan hasil pabrik."
CZE_expand_central_bohemian_mines: "Perluas Tambang Bohemia Tengah"
CZE_expand_central_bohemian_mines_desc: "Tambang yang berada di pusat negara kita adalah yang paling penting bagi keamanan energi kita. Kita harus memperluasnya secepat mungkin."
CZE_increase_bauxite_imports: "Meningkatkan Impor Bauksit"
CZE_increase_bauxite_imports_desc: "Negara kita mungkin tidak kaya akan aluminium, namun dengan menggunakan proses penyulingan tertentu dan meningkatkan impor bauksit, kita dapat memproduksi sejumlah kecil sumber daya tersebut di dalam negeri. Hal ini akan membantu meringankan kekurangan sumber daya."
CZE_merge_the_oil_companies: "Gabungkan Perusahaan Minyak"
CZE_merge_the_oil_companies_desc: "Perusahaan-perusahaan minyak kita hampir tidak bisa menyebut diri mereka seperti itu. Mereka semua adalah perusahaan-perusahaan kecil yang dibangun di sekitar beberapa sumur. Dengan menggabungkan ketiga negara tersebut dan menjadikan industri minyak berada di bawah kendali negara, kita bisa mencapai lebih banyak hal dengan sumber daya yang lebih sedikit"
CZE_expand_trinec_ironworks: "Pabrik Besi Trinec"
CZE_expand_trinec_ironworks_desc: "Trinec Steelworks telah menjadi raksasa industri di [72.getname] sejak didirikan. Investasi lebih lanjut akan memberi kita keuntungan besar dalam produksi sumber daya."
CZE_consolidate_mining_operations: "Konsolidasi Operasi Penambangan"
CZE_consolidate_mining_operations_desc: "Operasi penambangan kami dapat lebih optimal jika administrasi perusahaan-perusahaan ini digabungkan menjadi lebih efisien. Hal ini akan memungkinkan penelitian dan upaya mereka untuk memperluas tambang yang ada menjadi lebih efisien."
CZE_expand_praga: "Kontrak Praga"
CZE_expand_praga_desc: "Praga telah menjadi sumber berbagai komponen untuk industri militer kita selama bertahun-tahun. Masuk akal untuk memberi penghargaan kepada mereka dengan kontrak tambahan untuk membantu mereka berkembang lebih jauh."
CZE_shrink_educational_disparities: "Memperkecil Kesenjangan Pendidikan"
CZE_shrink_educational_disparities_desc: "Daerah pedesaan kita kurang mendapatkan pendidikan yang layak seperti yang ditawarkan di daerah perkotaan. Kita perlu melawan kesenjangan ini dengan program pendidikan besar yang ditujukan pada bidang-bidang ini."
CZE_kickstart_rapid_rearmanent: "Mulailah Persenjataan Kembali Secara Cepat"
CZE_kickstart_rapid_rearmanent_desc: "Banyak politisi dan pebisnis mungkin melihatnya sebagai keputusan yang buruk, namun kita perlu mulai mempersenjatai kembali sekarang. Negara-negara di sekitar kita bukannya melakukan pelucutan senjata, malah sebaliknya, dan ini sudah menjadi rahasia umum. Kita perlu mempersiapkan pasukan kita selagi kita masih punya waktu."
CZE_keep_focus_on_weapon_exports: "Tetap Fokus pada Ekspor Senjata"
CZE_keep_focus_on_weapon_exports_desc: "Industri besar ekspor senjata kitalah yang menyelamatkan kita dari depresi ekonomi. Membalikkan tren tersebut akan berbahaya secara politik dan ekonomi. Tetap berada di jalur adalah tindakan terbaik saat ini. Ancaman apa pun terhadap kami terlalu dibesar-besarkan."
CZE_force_the_industrialists_hand: "Paksa Tangan Industrialis"
CZE_force_the_industrialists_hand_desc: "Para industrialis dan konglomerat telah terlalu lama menahan kemampuan kita untuk mempersenjatai kembali secara efektif. Sudah saatnya kita memilih demi mereka, demi bangsa."
CZE_embrace_corporatism: "Rangkullah Korporatisme"
CZE_embrace_corporatism_desc: "Kita bisa bernegosiasi dengan para industrialis agar mereka membantu memulai kembali persenjataan kita jika kita menyetujui beberapa persyaratan mereka. Beberapa perubahan kebijakan yang menguntungkan mereka adalah hal yang sangat wajar dan demi kepentingan kita."
CZE_expand_existing_armory_plants: "Perluas Pabrik Senjata yang Ada"
CZE_expand_existing_armory_plants_desc: "Memindahkan beberapa lokasi gudang senjata yang ada akan menjadi investasi yang mahal dengan sedikit keuntungan jangka panjang. Memperluas lokasi yang ada akan memberikan manfaat dan peluang untuk memperluas produksi serta penelitian dan pengembangan di lokasi yang ada saat ini. Bahkan beresiko mereka berada di lokasi yang lebih mudah diserang musuh potensial."
CZE_expand_skoda_offices: "Perluas Kantor Škoda"
CZE_expand_skoda_offices_desc: "Kantor internasional kamilah yang mendorong penjualan senjata kami. Memperluasnya ke lokasi baru adalah keputusan yang masuk akal."
CZE_skoda_office_unlock_tt: "Membuka Keputusan: §YMembangun Kantor Penjualan Senjata§!"
CZE_complete_the_power_grid: "Lengkapi Jaringan Listrik"
CZE_complete_the_power_grid_desc: "Jaringan listrik di daerah pedesaan kita memerlukan perbaikan lebih lanjut. Negara ini tertinggal dibandingkan negara-negara lain dan merupakan hambatan dalam mencapai kemajuan ekonomi"
CZE_build_the_slapy_reservoir: "Bangun Waduk Slapy"
CZE_build_the_slapy_reservoir_desc: "Membangun Bendungan di dekat Slapy akan menghasilkan pembangkit listrik yang lebih besar dan peluang ekonomi di daerah tersebut. Peningkatan pembangkit listrik akan sangat membantu pertumbuhan industri kita di wilayah ini."
CZE_diversify_refinery_processes: "Diversifikasi Proses Pengilangan"
CZE_diversify_refinery_processes_desc: "Sumur kami akan mampu menghasilkan berbagai macam produk sampingan minyak yang berbeda. Satu-satunya masalah adalah kita tidak mempunyai pengetahuan bagaimana mewujudkannya. Jika kita menginvestasikan waktu penelitian untuk mencari tahu caranya, kita akan mampu mewujudkan impian ini."
CZE_enlarge_smaller_wells: "Memperbesar Sumur yang Lebih Kecil"
CZE_enlarge_smaller_wells_desc: "Meskipun ukurannya kecil, sumur-sumur kami yang lebih kecil dapat menghasilkan lebih banyak minyak dibandingkan dengan jumlah minyak yang mereka produksi saat ini. Yang harus kita lakukan adalah menginvestasikan waktu untuk mewujudkannya."
CZE_develop_sudetenland_resources: "Mengembangkan Sumber Daya Sudetenland"
CZE_develop_sudetenland_resources_desc: "Sudetenland memiliki banyak sumber daya yang saat ini belum kami manfaatkan. Merupakan suatu kesalahan jika tidak berinvestasi dalam membangun lebih banyak tambang di wilayah tersebut."
CZE_grow_tatras_capabilities: "Kembangkan Kemampuan Tatra"
CZE_grow_tatras_capabilities_desc: "Departemen tank kecil Tatra saat ini memiliki beberapa desain produksi baru. Memberi mereka sumber daya tambahan akan memungkinkan mereka untuk terus membuat kemajuan dalam desain baju besi."
CZE_bailout_moser: "Menyelamatkan Moser"
CZE_bailout_moser_desc: "Moser mengalami masa-masa sulit setelah depresi berat. Industri-industri mereka perlu ditalangi, pabrik-pabrik dibuka kembali, dan orang-orang yang di-PHK harus kembali bekerja."
CZE_merge_skodas_consumer_good_plants: "Gabungkan Pabrik Barang Konsumen Škoda"
CZE_merge_skodas_consumer_good_plants_desc: "Škoda memiliki banyak pabrik barang konsumen kecil dalam portofolionya yang tidak terpusat. Ini akan membantu mengoptimalkan produksi mereka di banyak area pabrik tersebut. Hal ini juga dapat memberikan beberapa efek positif bagi Škoda secara umum."
CZE_giant_of_central_europe_industry: "Raksasa Industri"
CZE_giant_of_central_europe_industry_desc: "Ketinggian yang sebelumnya dianggap mustahil. Kami sekarang menjadi raksasa industri di Eropa!"
CZE_continue_armed_force_reform: "Lanjutkan Reformasi TNI"
CZE_continue_armed_force_reform_desc: "Dengan terus memodernisasi angkatan bersenjata sesuai jadwal yang direncanakan dan menugaskan kembali wilayah militer ke markas besar provinsi, kita akan mencapai koordinasi yang lebih baik dalam setiap potensi konflik."
CZE_air_force_officer_recruitment: "Rekrutmen Perwira Angkatan Udara"
CZE_air_force_officer_recruitment_desc: "Klub-klub Aero di seluruh negara bagian, bekerja sama dengan Sekolah Perwira Cadangan Angkatan Udara, memenuhi kebutuhan penting akan perwira cadangan dengan menawarkan kursus terbang dan latihan tembakan langsung."
CZE_national_defense_act: "UU Pertahanan Negara"
CZE_national_defense_act_desc: "Tindakan pertahanan ini mencakup semua tindakan, baik militer atau lainnya, yang dimaksudkan untuk melawan segala ancaman atau serangan terhadap kedaulatan, integritas, persatuan, dan keamanan negara kita, di bawah pengawasan Dewan Tertinggi Pertahanan Nasional (NROS)."
CZE_car_and_oil_rationing: "Penjatahan Mobil dan Oli"
CZE_car_and_oil_rationing_desc: "Menjatah kendaraan bermotor pribadi dan memintanya sesuai kebutuhan akan memungkinkan kita memfokuskan produksi otomotif dan sumber daya minyak bumi untuk kebutuhan militer."
CZE_expand_airfield_capacity: "Memperluas Kapasitas Lapangan Udara"
CZE_expand_airfield_capacity_desc: "Departemen Penerbangan ke-3 telah merencanakan bandar udara dan hanggar baru untuk mengoperasikan, menyimpan, dan memperbaiki pesawat kami dengan benar, serta asrama untuk skuadron dan awak darat yang baru kami bentuk."
CZE_trust_in_old_guard: "Percayalah pada Pengawal Lama"
CZE_trust_in_old_guard_desc: "Keterampilan dan pengalaman udara dari Perang Besar akan diwariskan kepada generasi baru oleh para veteran, yang sangat kami percayai."
CZE_expand_the_aero_clubs: "Perluas Klub Aero"
CZE_expand_the_aero_clubs_desc: "Klub-klub Aero telah membuktikan kegunaannya dalam menyediakan pilot-pilot berbakat untuk negara kita; kita harus memperluasnya lebih lanjut."
CZE_invest_in_the_smaller_air_plants: "Berinvestasilah di Pabrik Udara yang Lebih Kecil"
CZE_invest_in_the_smaller_air_plants_desc: "Berinvestasi pada produsen pesawat terbang baru dan lebih kecil menimbulkan persaingan yang diperlukan dengan perusahaan-perusahaan yang sudah mapan; mereka dapat membantu menangani kebutuhan produksi kami yang lebih luas."
CZE_continue_avia_expansion: "Lanjutkan Ekspansi Avia"
CZE_continue_avia_expansion_desc: "Berinvestasi di Avia menyediakan perangkat keras tambahan yang diperlukan untuk lebih memperkuat kapasitas produksi mereka; hal ini dapat membantu mencapai efisiensi yang lebih besar dalam memproduksi badan pesawat yang banyak diminati."
CZE_increase_military_aeronautical_institute_funding: "Meningkatkan Pendanaan Penerbangan Militer"
CZE_increase_military_aeronautical_institute_funding_desc: "Dengan membangun fasilitas tambahan untuk Penelitian dan Pengujian Dirgantara (VZLÚ), hal ini memberikan wawasan yang lebih baik mengenai aerodinamika, sehingga semakin memajukan dan menyempurnakan desain pesawat kami."
CZE_air_training_abroad: "Pelatihan Udara di Luar Negeri"
CZE_air_training_abroad_desc: "Dengan mengirimkan peserta pelatihan ke cabang udara di negara-negara yang bersahabat dengan kami, kami memperoleh wawasan berharga dari berbagai perspektif dan pengalaman langsung ketika mereka kembali bertugas."
CZE_establish_air_defense_zones: "Menetapkan Zona Pertahanan Udara"
CZE_establish_air_defense_zones_desc: "Kami dapat mengalokasikan baterai antipesawat baru kami di titik-titik dan pabrik-pabrik penting, dan membangun Zona Pertahanan Udara melalui titik-titik komunikasi di tingkat teritorial untuk mengoptimalkan akurasi anti-udara kami."
CZE_establish_air_defense_zones_enable_tt: "Mengaktifkan §YZona Pertahanan Udara§!"
CZE_establish_air_defense_zones_tt: "Faktor peluang serangan Anti Udara Statis: §G+10%§!"
CZE_the_air_is_our_sea: "Udara adalah Laut Kita"
CZE_the_air_is_our_sea_desc: "Melalui pelatihan pilot yang sistematis, berdayakan pilot kami untuk terbang dengan berani dan percaya diri, 'Kami tidak memiliki pelabuhan laut atau kapal laut. Udara adalah laut kita.'"
CZE_bring_kramer_and_lobel_under_state_control: "Bawa Kramer & Löbl Di Bawah Kendali Negara"
CZE_bring_kramer_and_lobel_under_state_control_desc: "Dengan menasionalisasi Kramer & Löbl, kami dapat memastikan penelitian berkelanjutan dan pengiriman pasokan listrik penting dan aksesori radio tepat waktu."
CZE_second_to_none: "Tidak ada duanya"
CZE_second_to_none_desc: "Desain pesawat industri pesawat terbang kami semakin membaik dari hari ke hari. Dengan penelitian lebih lanjut, desain kami tidak akan ada duanya di dunia!"
CZE_diversify_airframe_production: "Diversifikasi Produksi Badan Pesawat"
CZE_diversify_airframe_production_desc: "Kita tidak bisa hanya mengandalkan pesawat tempur kita untuk menyelesaikan sesuatu di udara. Pesawat lain dan badan pesawat yang lebih besar diperlukan untuk memenuhi jenis misi lainnya."
CZE_projekt_l_52: "Proyek L 52"
CZE_projekt_l_52_desc: "Teknologi mesin jet adalah masa depan pesawat militer. Teknologinya masih agak sulit saat ini, namun jika kita meluangkan waktu untuk mengembangkan proyek khusus dan merancang badan pesawat yang dibuat khusus untuk itu, kita bisa tetap menjadi yang terdepan."
CZE_fund_vladimir_mandl_research: "Mendanai Penelitian Vladimir Mandl"
CZE_fund_vladimir_mandl_research_desc: "Seorang pengacara bernama $CZE_vladimir_mandl$ terpesona dengan ide teknologi roket. Jika kita bekerja sama dengannya dan menyediakan sumber daya yang dibutuhkannya untuk mengubah penelitiannya menjadi teknologi praktis, kita bisa mendapatkan banyak manfaat dari kemitraan ini."
CZE_mobilize_the_reserves: "Memobilisasi Cadangan"
CZE_mobilize_the_reserves_desc: "Ketegangan di perbatasan kita semakin memburuk. Kita harus memanggil pasukan cadangan dan spesialis militer yang telah dipilih sebelumnya sesuai dengan kartu mobilisasi kita."
CZE_three_kings: "Tiga Raja"
CZE_three_kings_desc: "Membantu kelompok perlawanan kita dalam kapasitas resmi akan sangat meningkatkan kemampuan mereka untuk melakukan kerusakan pada tentara. Ini juga dapat membantu tentara kita di lapangan."
CZE_form_the_state_defense_guard: "Bentuk Garda Pertahanan Negara"
CZE_form_the_state_defense_guard_desc: "Dengan membentuk SOS, kita mengaktifkan organisasi yang khusus melindungi perbatasan kita yang panjang. Karena para anggota pengawal diorganisir dan dilatih secara militer, mereka akan menjadi garis pertahanan pertama terhadap setiap pelanggaran perbatasan."
CZE_expand_the_horska_divisions: "Perluas Divize Horská"
CZE_expand_the_horska_divisions_desc: "Karena negara kita sebagian besar terdiri dari perbukitan rendah dan dataran tinggi, tentara kita yang dilatih khusus untuk peperangan di pegunungan akan berperan penting dalam medan yang sulit tersebut."
CZE_develop_horska_artillery: "Kembangkan Horské Dělostřelectvo"
CZE_develop_horska_artillery_desc: "Dengan memodifikasi artileri kami saat ini menjadi ringan dan dapat dibongkar, kami akan memastikan pasukan kami memiliki daya tembak yang cukup di medan pegunungan dan perbukitan."
CZE_develop_horska_artillery_tech_tt: "Mengaktifkan §YHorská Artillery§!\n§YArtileri (Pegunungan)§!\nSerangan: §G+10%§!\nGerakan: §G+10%§!\n§YArtileri (Perbukitan)§!\nSerangan: §G+10%§!\nPergerakan: §G+10%§!"
CZE_bribery_investigations: "Investigasi Penyuapan"
CZE_bribery_investigations_desc: "Kami telah menerima surat kaleng mengenai makanan dan perlakuan terhadap tentara. Beberapa bukti menunjukkan adanya perilaku tidak pantas yang dilakukan oleh petugas quartermaster tertentu. Kita harus mengakhiri hal ini sebelum menyebabkan kerugian yang lebih besar bagi militer kita."
CZE_bribery_investigations_remove_effect_tt: "Semangat kebangsaan ini akan hilang setelah selesainya fokus '§Y$CZE_bribery_investigations$§!'"
CZE_opl_exercises: "Latihan OPL"
CZE_opl_exercises_desc: "Dengan melakukan latihan pertahanan anti-pesawat (OPL), tentara kita dapat berlatih manuver dengan koordinasi dan pelestarian yang lebih baik, sehingga meningkatkan pergerakan dan keamanan pasukan secara keseluruhan."
CZE_rapid_response_divisions: "Divisi Cepat"
CZE_rapid_response_divisions_desc: "Militer asing telah menunjukkan dampak dari unit bergerak yang mampu melakukan reposisi lebih cepat daripada musuh, sehingga menyoroti potensinya. Kita bisa membentuk unit serupa untuk evaluasi."
CZE_redouble_tank_development_efforts: "Menggandakan Upaya Pengembangan Tangki"
CZE_redouble_tank_development_efforts_desc: "Desain tank ringan kami saat ini masih dapat ditingkatkan dibandingkan dengan pengguna lapis baja lainnya di Eropa. Kita harus melipatgandakan upaya kita untuk memastikan kita setara dengan mereka."
CZE_rearmed_and_retooled: "Dipersenjatai kembali, diperlengkapi kembali"
CZE_rearmed_and_retooled_desc: "Sasis tank kami yang lebih berat saat ini menunjukkan kapasitas untuk modernisasi. Kita harus terus menjajaki arah ini untuk memenuhi perluasan korps lapis baja kita di masa depan."
CZE_establish_the_fall_backlines: "Tetapkan Garis Cadangan"
CZE_establish_the_fall_backlines_desc: "Kita harus realistis dengan kenyataan bahwa di beberapa tempat pertahanan kita akan rusak. Jika hal itu terjadi, memiliki lini cadangan yang siap pakai akan menjadi pembeda antara kemenangan dan kekalahan."
CZE_establish_the_fall_backlines_masterful_delay_tactic_tt:0 "Mengaktifkan Taktik: §Y$tactic_masterful_delay$§!"
CZE_anti_tank_development: "Pengembangan Senjata Anti-Tank"
CZE_anti_tank_development_desc: "Dengan semakin banyaknya tentara yang mengerahkan pasukan lapis baja yang semakin besar, perbaikan pada senjata anti-tank kita adalah suatu keharusan. Mampu menghadapi tank dengan field piece adalah perbedaan antara menahan musuh dan berhasil melewatinya."
CZE_anti_tank_development_tech_tt: "Mengaktifkan §YPeningkatan Anti-Tank§!\n§YArtileri§! Penusuk: §G+5%§!\n§YMendukung Artileri§! Penusuk: §G+5%§!\n§YAnti-Tank§! Penusuk: §G+5%§!\n§YDukungan Anti-Tank§! Penusuk: §G+5%§!"
CZE_recon_in_force: "Pengintaian yang Berlaku"
CZE_recon_in_force_tech_tt: "Mengaktifkan §YRecon di Force§!\n§YRecon§!: HP: §G+5§!\nPengintaian: §G+10.0%§!."
CZE_recon_in_force_desc: "Meminta pengintaian kita melakukan kontak dengan musuh sambil menyelidiki pertahanan mereka adalah cara yang sangat berharga untuk mendapatkan informasi."
CZE_integrate_fortification_engineers: "Integrasikan Insinyur Fortifikasi"
CZE_integrate_fortification_engineers_desc: "Ketika para insinyur benteng tentara kita tidak menghabiskan waktu membangun benteng statis, kita dapat dengan cepat mengalihkannya ke tugas garis depan untuk meningkatkan pertahanan kita. Hal ini akan membantu pasukan garis depan dalam membuat struktur pertahanan sementara yang lebih baik bagi pasukan kita."
CZE_integrate_fortification_engineers_tech_tt: "Mengaktifkan §YInsinyur Benteng Terpadu§!\n§YPerusahaan Insinyur§!:\nPenguatan §G+10.00%§!.\n§Y(Benteng)§!\nPertahanan §G+10,0%§!"
CZE_concealment_efforts: "Upaya Penyembunyian"
CZE_concealment_efforts_desc: "Meluasnya penggunaan pesawat serang darat dan pesawat pengintai kini menjadikan jaring kamuflase dan taktik penyembunyian lainnya menjadi sebuah kebutuhan. Kita perlu memperkuat upaya kita dalam memastikan pasukan kita berkamuflase dengan baik di lapangan."
CZE_concealment_efforts_tech_tt: "Mengaktifkan §YPeningkatan Jaring Kamuflase§!\n§YKaki Infanteri (Hutan)§!\nPertahanan: §G+10%§!"
CZE_elevate_the_vsv: "Tinggikan Perguruan Tinggi Perang"
CZE_elevate_the_vsv_desc: "Menjadi otak militer merupakan tanggung jawab nasional dan negara yang sangat besar. Oleh karena itu, pelayanan Staf Umum memerlukan perwira yang memiliki kualitas terbaik dalam hal pelatihan profesional serta keandalan, pengendalian diri, kebijaksanaan, dan karakter."
CZE_continue_with_snejdareks_plan_dynamic: "[CZE_continue_with_snejdareks_plan]"
CZE_continue_with_snejdareks_plan_default: "Lanjutkan dengan Rencana Šnejdárek"
CZE_continue_with_snejdareks_plan_no_snejdareks: "Lanjutkan dengan Rencana Pertahanan Statis"
CZE_continue_with_snejdareks_plan_dynamic_desc: "Penyelenggaraan jaringan pertahanan yang efektif mencegah penetrasi pasukan musuh yang tidak terduga. Ini memberikan perlindungan dan menciptakan dasar yang kuat untuk transisi dari pertahanan strategis ke serangan."
CZE_go_with_vojcechovskys_plan_dynamic: "[CZE_go_with_vojcechovskys_plan]"
CZE_go_with_vojcechovskys_plan_default: "Ikuti Rencana Luža"
CZE_go_with_vojcechovskys_plan_no_luza: "Doktrin Pertahanan Aktif"
CZE_go_with_vojcechovskys_plan_dynamic_desc: "Kerugian dari pertahanan statis adalah tidak dapat bermanuver. Setelah ditembus, mereka tidak lagi dapat digunakan untuk tujuan ofensif tetapi hanya sebagai sisa-sisa di lokasi awal."
CZE_improve_the_current_officer_pool: "Tingkatkan Kelompok Petugas Saat Ini"
CZE_improve_the_current_officer_pool_desc: "Kami akan mempromosikan personel yang telah menunjukkan kapasitas untuk menjadi tulang punggung tentara kami, karena mereka penting dalam menjalankan peran pengawasan dan koordinasi antara komando yang lebih tinggi dan unit lokal."
CZE_elevate_slovak_officers: "Tinggikan Perwira Slovakia"
CZE_elevate_slovak_officers_desc: "Kami akan fokus pada peningkatan kualitas masyarakat Slovakia untuk memastikan keterwakilan yang lebih baik dalam barisan. Dengan menurunkan beberapa persyaratan bagi pelamar dari distrik Slovakia, kami mengantisipasi peningkatan kohesi dalam angkatan bersenjata di masa depan."
CZE_promote_moravec_writings: "Promosikan Tulisan Moravec"
CZE_promote_moravec_writings_desc: "Meskipun karya Moravec 'Soldiers and Time' dan 'State Defense' memicu reaksi yang sangat kontradiktif, 'Military Importance of our state in Central Europe' yang baru-baru ini diterbitkannya dibahas dalam pers harian di seluruh Eropa. Kita harus mendorongnya untuk melanjutkan pekerjaannya sebagai ahli yang tegas dalam isu-isu kebijakan pertahanan dan sejarah militer."
CZE_lessons_of_war: "Pelajaran Perang"
CZE_lessons_of_war_desc: "Dengan pengalaman bertempur melawan rekan yang kini kita miliki, kita dapat mengambil pelajaran ini dan menggunakannya untuk meningkatkan komando tinggi kita. Tidak ada yang bisa menggantikan pelajaran yang didapat dari pertempuran nyata dengan tentara."
CZE_lessons_of_war_i_had_war_with_major_flag: "Sedang berperang dengan Negara Besar"
CZE_for_the_homeland: "Untuk Tanah Air"
CZE_for_the_homeland_desc: "Dengan militer kita yang sepenuhnya siap menghadapi tantangan di depan, kini kita dapat mengatakan dengan pasti bahwa kita siap membela tanah air. Kami siap untuk tugas apa pun yang ada di hadapan kami."
CZE_the_lions_roar: "Auman Singa"
CZE_the_lions_roar_desc: "Simbol Singa Cekoslowakia melambangkan kualitas terbaik tentara kita. Keberanian, kekuatan, dan kepahlawanan tingkat tertinggi. Semua orang akan mengetahui semangat angkatan bersenjata kita yang tak tertandingi."
CZE_diversify_our_specialists: "Diversifikasi Spesialis kami"
CZE_diversify_our_specialists_desc: "Kita perlu mendiversifikasi spesialis kita di luar bidang pasukan Horska. Perang terjadi di tempat selain gunung dan puncak bukit."
CZE_merge_the_financial_and_state_guard: "Gabungkan Keuangan dan Garda Negara"
CZE_merge_the_financial_and_state_guard_desc: "Dengan terbentuknya Garda Pertahanan Negara, maka pengawalan keuangan tidak diperlukan lagi. Menggabungkan mereka ke dalam Garda Pertahanan Negara akan membantu meningkatkan kekuatan SOS dengan cepat."
CZE_merge_the_financial_and_state_guard_tt: "Mengaktifkan §YPengawal Keuangan Terpadu§!\n§YPolisi Militer§!: HP: §G+5§!."
CZE_logistics_beyond_the_sudetes: "Logistik Melampaui Sudetes"
CZE_logistics_beyond_the_sudetes_desc: "Jika kita ingin melakukan operasi tempur di luar Pegunungan Sudetes, kita perlu mempelajari cara kerja logistik jarak jauh. Beda sekali dengan beroperasi di wilayah rumah kita saja."
CZE_logistics_beyond_the_sudetes_tt: "Mengaktifkan §YPeningkatan Pembuangan Pasokan§!\n§YPerusahaan Logistik§!: Penggunaan Pasokan: §G-10%§!"
CZE_expand_the_river_monitor_fleet: "Perluas Armada Pemantau Sungai"
CZE_expand_the_river_monitor_fleet_desc: "Armada pemantau sungai kami adalah salah satu yang terbesar di Eropa dan membantu tentara kami mempertahankan wilayah pedalaman. Memperluasnya akan sangat meningkatkan kemampuan mereka untuk melakukan tugas ini."
CZE_the_tvp_project: "Proyek TVP"
CZE_the_tvp_project_desc: "Tentara kami telah mengusulkan program Jenderal Use Tank (TVP) untuk mengembangkan desain tank dalam negeri. Beberapa produsen kami, yang memiliki pengalaman luas dalam memproduksi tangki, telah menunjukkan minat pada proyek kami."
CZE_expand_the_land_department_of_vtu: "Perluas Departemen Pertanahan VTÚ"
CZE_expand_the_land_department_of_vtu_desc: "Dengan memperluas departemen pertanahan Institut Teknik Militer (VTÚ), mereka akan mendapatkan perangkat keras tambahan dan landasan pembuktian guna mendukung upaya penelitian mereka untuk peralatan masa depan kita."
CZE_department_two_expansion: "Departemen Dua"
CZE_department_two_expansion_desc: "Sayap intelijen kita, Departemen 2, membutuhkan lebih banyak sumber daya untuk melindungi kita dari mata-mata musuh. Hal ini juga dapat mengarah pada perluasan sayap tertentu di dalam badan tersebut."
CZE_military_intelligence: "Sayap Intelijen Militer"
CZE_military_intelligence_desc: "Intelijen militer adalah salah satu aspek terpenting dari sebuah badan intelijen. Mengalokasikan lebih banyak sumber daya ke bidang ini akan menghasilkan manfaat yang signifikan."
CZE_air_intelligence: "Sayap Intelijen Udara"
CZE_air_intelligence_desc: "Mengetahui jumlah pesawat di angkatan udara musuh merupakan komponen penting untuk memenangkan perang udara. Informasi yang akurat mengenai pasukan udara musuh adalah kunci ketika menghadapi mereka di wilayah tersebut."
CZE_within_the_eagles_nest: "Di dalam Sarang Elang"
CZE_within_the_eagles_nest_desc: "Memiliki pasukan informan dan penyabot di luar pintu kita akan menjadi keuntungan besar bagi militer kita. Dengan bantuan dari Departemen 2, jaringan mata-mata kami di lokasi-lokasi ini dapat berkembang menjadi luas."
CZE_restart_naval_gun_production: "Mulai kembali Produksi Senjata Angkatan Laut"
CZE_restart_naval_gun_production_desc: "Škoda Works dulunya adalah perancang dan produsen senjata angkatan laut terbesar di Kekaisaran Austria-Hongaria. Memulai kembali produksi akan menciptakan peluang untuk menghidupkan kembali manufaktur angkatan laut dalam negeri."
CZE_restart_naval_gun_production_tt: "§YŠkoda Prioritas§! Fokus Angkatan Laut menjadi §YAktif§!"
CZE_reform_the_naval_detachment: "Reformasi Detasemen Angkatan Laut"
CZE_reform_the_naval_detachment_desc: "Detasemen Angkatan Laut baru-baru ini dibubarkan karena dianggap lebih cocok untuk diintegrasikan ke dalam tentara. Namun, kejadian-kejadian belakangan ini telah menyebabkan hal tersebut sehingga sekarang menjadi suatu keharusan untuk melakukan reformasi."
CZE_build_2_dockyards_when_we_have_coast_tt: "Akan Segera Membangun §G2§! §YGalangan Kapal Angkatan Laut§! di §YNegara Bagian§! pesisir acak ketika ada yang terkendali."
CZE_skoda_naval_yards: "Lapangan Angkatan Laut Škoda"
CZE_skoda_naval_yards_desc: "Kini setelah kita memiliki akses ke laut sekali lagi, kita dapat memulai kembali industri angkatan laut lama Kekaisaran Austro-Hungaria dengan menggunakan keahlian yang masih ada di wilayah kita. Membangun dan menjalankan galangan kapal domestik harus menjadi prioritas utama."
CZE_build_3_dockyards_when_we_have_coast_tt: "Akan Segera Membangun §G3§! §YGalangan Kapal Angkatan Laut§! di §YNegara Bagian§! pesisir acak ketika ada yang terkendali."
CZE_legacy_of_the_kriegsmarine: "Warisan Kriegsmarine"
CZE_legacy_of_the_kriegsmarine_desc: "Setelah membantu pembangunan kapal perang besar belum lama ini, kemampuan untuk melakukannya sangat mungkin dilakukan. Ini merupakan warisan dari pabrik yang sama yang membantu membangun Kriegsmarine Austria-Hongaria."
CZE_build_off_old_ganz_danubius_designs: "Bangun Desain Ganz Danubius Lama"
CZE_build_off_old_ganz_danubius_designs_desc: "Desain pelapisan ulang dari Ganz Danubius terbukti berguna dalam membangun kapal kelas penjelajah baru. Orang-orang yang mengetahui desain ini masih tinggal di wilayah kami."
CZE_modernize_trieste_designs: "Modernkan Desain Trieste"
CZE_modernize_trieste_designs_desc: "Dengan menggunakan desain lama Angkatan Laut Austria-Hongaria untuk kapal perang berukuran lebih kecil, kita akan memiliki wawasan yang lebih baik tentang cara membangun kapal kelas ini."
CZE_leverage_gunboat_experience: "Manfaatkan Pengalaman Kapal Perang"
CZE_leverage_gunboat_experience_desc: "Pengalaman kami dalam merancang kapal perang dapat dimanfaatkan untuk pembuatan kapal perusak. Basis keahlian kami saat ini akan membantu mempercepat proses desain."
CZE_revive_kraljevica_designs: "Bangkitkan Kembali Desain Kraljevica"
CZE_revive_kraljevica_designs_desc: "Dengan menggunakan pengetahuan kita tentang kapal perang, dan dengan mempelajari desain Kraljevica yang lama. Kita bisa menghidupkan kembali kelas perusak ini untuk bangsa kita."
CZE_wolfs_of_bohemia: "Serigala Bohemia"
CZE_wolfs_of_bohemia_desc: "Mengingat pengalaman dengan kapal selam yang masih ada di perbatasan kita. Tidak terlalu sulit untuk membuat paket serigala sendiri."
CZE_raider_lineage: "Silsilah Perampok"
CZE_raider_lineage_desc: "Kami memiliki garis keturunan penyerang dari mantan perwira yang berada di Angkatan Laut Austria-Hongaria. Kita harus memanfaatkan pengalaman itu."
CZE_a_modern_navy: "Angkatan Laut Modern"
CZE_a_modern_navy_desc: "Kini setelah kita mencapai kemajuan dalam teknologi angkatan laut, kita akhirnya dapat mengatakan bahwa kita memiliki Angkatan Laut yang modern dan mumpuni."
CZE_build_1_dockyards_when_we_have_coast_tt: "Akan Segera Membangun §G1§! §YGalangan Kapal Angkatan Laut§! di §YNegara Bagian§! pesisir acak ketika ada yang terkendali."
CZE_naval_aviation: "Penerbangan Angkatan Laut"
CZE_naval_aviation_desc: "Kapal induk dan pesawatnya tampaknya menjadi masa depan peperangan laut. Kita perlu menginvestasikan waktu di bidang-bidang baru pertempuran laut ini."
CZE_across_the_atlantic: "Di seberang Atlantik"
CZE_across_the_atlantic_desc: "Angkatan Laut perlu menjangkau seberang lautan agar efektif. Kita perlu menjadikan Angkatan Laut kita yang mampu bergerak jarak jauh."
CZE_joint_equipment_designs: "Desain Peralatan Gabungan"
CZE_joint_equipment_designs_desc: "Baik [ROOT.GetNameDef] maupun [GER.GetNameDef] berada di garis depan dalam desain tank dan pesawat, masing-masing memiliki spesialisasi masing-masing, kita harus berusaha untuk berbagi informasi sehingga kita dapat terus fokus pada hal terbaik yang bisa kita lakukan."
CZE_negotiate_sphere_of_influence: "Negosiasikan Lingkup Pengaruh"
CZE_negotiate_sphere_of_influence_desc: "Tidak dapat disangkal bahwa sumber daya militer [ROOT.GetNameDef] sangat berharga bagi aliansi [GER.GetAdjective]. Wajar jika kami meminta sejumlah wilayah sebagai imbalannya."
CZE_set_up_polish_puppet_state: "Siapkan Negara Boneka [POL.GetAdjective] Selatan"
CZE_set_up_polish_puppet_state_desc: "Karena [GER.GetNameDef] tertarik untuk mendirikan negara boneka di Polandia, jelas kita harus mempertimbangkan untuk melakukan hal yang sama."
CZE_usurp_the_mantle: "Merebut Mantel"
CZE_usurp_the_mantle_desc: "Dengan kerajaan kami yang terbentang dari Laut Baltik hingga Laut Adriatik dan menguasai wilayah Austria yang merupakan pusat kekuatan regional bersejarah, kami kini dapat memproklamirkan diri sebagai penerus sah Kekaisaran Romawi Suci."
CZE_austro_hungary_puppets: "Setiap §Ymata pelajaran§! ditargetkan oleh persyaratan fokus"
CZE_decrease_autonomy_tier: "Setiap subjek §Y$autonomy_dominion$§! atau §Y$autonomy_puppet$§! akan kehilangan tingkat otonominya."
#Exile Focus
CZE_prepare_for_exile: "Bersiaplah untuk Pengasingan"
CZE_prepare_for_exile_desc: "Negara harus secara diam-diam membantu upaya para pemimpin politik kita untuk melarikan diri ke luar negeri dan mendirikan pemerintahan di pengasingan."
CZE_joins_government_in_exile_tt: "Bergabung dengan §YPemerintah di Pengasingan§!"
CZE_infiltrate_collaborationist_organizations: "Menyusup ke Kolaborasionis"
CZE_administrative_chaos_tt: "Efek §Yuntuk Reichskommissariat§! ketika §Y$CZE_enter_exile$§! Selesai:"
CZE_infiltrate_collaborationist_organizations_desc: "[ROOT.GetAdjective]s setia kepada pemerintah di pengasingan yang dilantik untuk memimpin organisasi kolaborator mungkin terdengar aneh, tapi ini adalah cara sempurna untuk melemahkan dan tetap mengetahui aktivitas mereka."
CZE_enter_exile: "Pergilah ke Pengasingan"
CZE_enter_exile_desc: "Dengan sekutu potensial yang akhirnya memerangi buaya [GER.GetAdjective], pemerintah kita dapat bersiap dan berjuang untuk mengembalikan kedaulatan kita."
CZE_refused_exile: "Menolak menjadi tuan rumah [ROOT.GetName]"
CZE_contact_the_czech_and_slovak_legion: "Hubungi Legiun Ceko dan Slovakia"
CZE_contact_the_czech_and_slovak_legion_desc: "[ROOT.GetAdjective] pemberani telah melarikan diri ke [POL.GetNameDef] dan [FRA.GetNameDef] untuk melanjutkan perjuangan mendapatkan [CZE.GetName] gratis, kita harus menghubungi pasukan ini dan mengoordinasikannya."
CZE_skoda_priority_shortcut_finder: "Prioritas Skoda"
CZE_skoda_priority_shortcut_finder_desc: "Ini adalah Prioritas Škoda Saat Ini"
#Decision unlock TT
CZE_decision_unlock: "Buka Kunci Keputusan:"
CZE_demand_regime_change_tt: "$CZE_decision_unlock$§YPermintaan Perubahan Rezim di Negara§!"
CZE_propose_unification_tt: "$CZE_decision_unlock$§YUndang Negara ke Uni Cekoslowakia§!"
CZE_integrate_nation_tt: "$CZE_decision_unlock$§YIntegrasikan Negara§!"
