#Germany
GER_integrate_czech_manufacturers: "Integrasikan Produsen Ceko"
GER_integrate_czech_manufacturers_desc: "Industri yang berlokasi di Bohemia adalah tambang emas keahlian manufaktur dan sumber daya industri bagi perekonomian kita. Kekuatan industri tambahan yang akan ditambahkan oleh Pabrikan Bohemia akan menjadi dorongan besar bagi industri persenjataan kita. Sangat masuk akal untuk mengintegrasikannya ke dalam lini produksi kami."
GER_integrate_czech_manufacturers_no_aat_tt: "§GTersedia§! sebagai §YPerusahaan Desain§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§!, dan §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
CZE_unlocks_sokolov_raid_pfot_tt: "Membuka §YSerangan Penerjun Payung§! di §YFalknov§!"
