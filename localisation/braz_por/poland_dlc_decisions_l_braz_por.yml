 POL_defensive_plans: "Perencanaan Pertahanan"
 POL_defensive_plans_desc: ""
 POL_defend_in_east_state: "[From.GetName] Rencana Pertahanan"
 POL_defend_in_east_state_desc: "Wilayah Timur terpencil dan terbelakang, alam mengaturnya sama seperti kita. Kita harus melatih orang-orang kita untuk memanfaatkan lingkungan sekitar demi keuntungan mereka dan membiarkan pasukan Rusia yang menyerang kita tercerai-berai dan kebingungan."
 POL_defend_in_west_state: "[From.GetName] Rencana Pertahanan"
 POL_defend_in_west_state_desc: "Barat adalah tempat sebagian besar industri kita berada, dan sangat penting bagi kita untuk mempertahankannya dari Jerman. Kita harus merancang strategi pertahanan lokal di negara-negara Barat jika kita ingin melawan jumlah pengungsi yang sangat besar di perbatasan kita."
 POL_four_year_plan_mission: "Mempersiapkan Rencana Empat Tahun Berikutnya"
 POL_four_year_plan_mission_desc: "Rencana Empat Tahun sedang berjalan, kita harus memastikan untuk menepati janji kita untuk mereformasi dan melakukan industrialisasi di negara ini jika kita ingin mempersiapkan diri secara memadai untuk empat tahun ke depan."
