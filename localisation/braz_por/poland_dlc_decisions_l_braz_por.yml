l_braz_por:
 POL_danzig_decisions: "Kota Danzig yang 'Bebas'"
 POL_danzig_decisions_desc: "Danzig sudah terlalu lama menjadi duri dalam perekonomian Polandia! Sudah saatnya kita mengambil alih kota, namun hal tersebut hanya dapat dicapai melalui kolaborasi dengan penduduk setempat…"
 POL_unification_propaganda: "Propaganda Unifikasi"
 POL_unification_propaganda_desc: "Danzig adalah kota dengan beragam budaya yang terdiri dari orang Polandia, Jerman, dan banyak minoritas lainnya, dan Partai Nazi berupaya mengganggu kerja sama multikultural ini. Propaganda yang efektif dapat dimanfaatkan untuk membuat kelompok minoritas di kota ini memihak kita, menjanjikan mereka kesetaraan yang akan lebih cepat dihilangkan oleh Nazi daripada diberikan kepada mereka."
 POL_military_appeasement: "Ketenangan Militer"
 POL_military_appeasement_desc: "Kota Bebas Danzig tidak dapat diintegrasikan hanya dengan kekerasan saja, tindakan peredaan tertentu mungkin akan membuat milisi Danziger lebih selaras dengan visi Polandia untuk kota tersebut."
 POL_raid_nazi_resistance: "Serangan Perlawanan Nazi"
 POL_raid_nazi_resistance_desc: "Ada orang-orang di kota ini yang akan menyerahkan kunci kebebasannya kepada Nazi dan menjadikan kota itu tunduk pada Berlin. Unsur-unsur ini harus dihilangkan dari kota dengan cara apa pun, meskipun tindakan militer yang keras mungkin berdampak buruk pada persepsi penduduk setempat terhadap kita."
 POL_tighten_control: "Kencangkan Kontrol"
 POL_tighten_control_desc: "Kami telah memperoleh kepatuhan yang cukup di kota ini untuk semakin memperketat kontrol kami tanpa menimbulkan kerusuhan sipil. Dengan ini, kita akan mendapatkan lebih banyak akses terhadap sumber daya Danziger dan semakin dekat untuk mencapai persatuan di kota ini."
 POL_sanation_decisions: "Pemerintah Sanasi Polandia"
 POL_sanation_decisions_desc: "Kaum Sanasionis terbagi menjadi kubu kiri dan kanan yang keduanya berupaya mengganggu pemerintahan kami. Kita harus menenangkan dan mengesampingkan pihak-pihak tersebut dengan tepat sehingga kita dapat menciptakan pemerintahan yang stabil untuk masa depan Polandia!"
 POL_sanation_left_irritation: "Sanasi Kiri Iritasi"
 POL_sanation_left_irritation_desc: "Bosan dipinggirkan dan dikesampingkan di bawah rezim Mościcki, Sanation Left berupaya memulihkan pemerintahan mantan Perdana Menteri, Walery Sławek."
 POL_sanation_right_irritation: "Iritasi Kanan Sanasi"
 POL_sanation_right_irritation_desc: "Dengan sebagian besar militer di pihak mereka, Kanan Sanasi berupaya melemahkan kediktatoran dan mendirikan Junta Militer yang dipimpin oleh Edward Rydz-Śmigły. Memiliki ikatan dengan militer dan paramiliter Falang, Sanation Right adalah faksi politik yang berbahaya."
 POL_sideline_the_left: "Sampingan Kiri"
 POL_sideline_the_left_desc: "Dengan bantuan dari kelompok sayap kanan, kita mungkin bisa mengesampingkan kelompok sayap kiri dan mendorong mereka lebih jauh ke dalam kelompok politik di masyarakat kita."
 POL_sideline_the_right: "Sampingan Kanan"
 POL_sideline_the_right_desc: "Meskipun kuat, kelompok sayap kanan dapat terdorong ke dalam ketidakrelevanan politik melalui upaya gabungan dari kelompok sayap kiri dan kubu Castle."
 POL_peasant_strike_category: "Pemogokan Petani"
 POL_peasant_strike_category_desc: ""
 POL_looming_peasants_strike_mission: "Pemogokan Petani yang Akan Terjadi"
 POL_looming_peasants_strike_mission_desc: "Para petani tidak bahagia, menuntut upah yang lebih tinggi dan harga pangan yang diturunkan secara drastis. Koneksi kereta api Polandia yang buruk di wilayah Timur membuat penyediaan makanan dan peralatan menjadi sebuah upaya yang mahal, namun dengan investasi kereta api yang lebih besar, kita mungkin dapat memenuhi apa yang diminta oleh para petani."
 POL_peasants_strike: "Pemogokan Petani!"
 POL_peasants_strike_desc: "Ketegangan memuncak di wilayah Timur. Jika kita tidak menyelesaikan krisis ini secepat mungkin, kita mungkin akan menghadapi perang saudara. Pemogokan yang diorganisir oleh pemimpin Partai Tani Stanisław Mikołajczyk telah membentuk koalisi demokrat, sosialis, dan komunis yang menentang pemerintah Polandia dan jika diabaikan akan memicu pemberontakan."
 POL_invite_foreign_motor_decisions: "Undang Perusahaan Motor Asing"
 POL_invite_foreign_motor_decisions_desc: ""
 POL_invite_ford: "Undang Ford Motor"
 POL_invite_ford_desc: "Murah, efisien, dan Amerika, Ford Motors mampu memproduksi peralatan motor secara massal dengan kecepatan yang tak tertandingi."
 POL_invite_vauxhall: "Undang Vauxhall"
 POL_invite_vauxhall_desc: "Orang Inggris telah membuktikan bahwa perlengkapan motor mereka jauh lebih gesit dan berkualitas lebih tinggi di jalan dibandingkan kendaraan lain di dunia."
 POL_invite_somua: "Undang SOMUA"
 POL_invite_somua_desc: "Kendaraan bermotor dan lapis baja Perancis lebih tangguh dibandingkan kendaraan lain dan mampu menerima peluru dari kendaraan musuh tanpa mengalami kerusakan apa pun. Inilah jenis kendaraan yang kita perlukan untuk bertahan dalam perang."
 POL_miedzymorze_decisions: "Międzymorze"
 POL_miedzymorze_decisions_desc: ""
 POL_diplomatic_mission_to_FIN: "Misi Diplomatik ke [FIN.GetNameDef]"
 POL_diplomatic_mission_to_FIN_desc: "Jika kita ingin meyakinkan negara lain untuk bergabung dalam Intermarium, kita harus meyakinkan mereka bahwa hal itu demi kepentingan terbaik mereka. Dengan mengirimkan Józef Beck dalam misi diplomatik, kita memiliki peluang lebih besar untuk membangun aliansi pertahanan yang kita impikan."
