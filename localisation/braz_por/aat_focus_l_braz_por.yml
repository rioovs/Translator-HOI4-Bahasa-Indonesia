 NORDIC_to_arms_against_tyranny: "Untuk Mempersenjatai Melawan Tirani"
 NORDIC_to_arms_against_tyranny_desc: "TODO_NORDIC"
 NORDIC_against_tyranny_TT: "Membuka Keputusan §YKirim Senjata ke Nordik§!, §YKirim Relawan Untuk Nordik§! dan §YPertahankan Negara Nordik§! untuk mendukung sesama negara Nordik melawan invasi kekuatan luar."
 NORDIC_leverage_nordic_investments: "Manfaatkan Investasi Nordik"
 NORDIC_leverage_nordic_investments_desc: "TODO_NORDIC"
 NORDIC_industrial_cooperation: "Kerja Sama Industri"
 NORDIC_industrial_cooperation_desc: "TODO_NORDIC"
 NORDIC_the_nordic_march: "Pawai Nordik"
 NORDIC_the_nordic_march_desc: "TODO_NORDIC"
 NORDIC_court_foreign_power_TT: "Membuka Keputusan §YPengadilan Kekuatan Asing§! yang memungkinkan Anda bergabung dengan faksi mayor Komunis atau Fasis."
 NORDIC_mutual_guarantees: "Jaminan Bersama"
 NORDIC_mutual_guarantees_desc: "TODO_NORDIC"
