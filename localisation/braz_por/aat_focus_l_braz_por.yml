 NORDIC_strengthen_ties_desc: "TODO_NORDIC"
### JOINT FOCUS TREE ### 
 NORDIC_form_joint_alliance: "Bentuk [NORDIC_get_alliance_name]"
 NORDIC_form_joint_alliance_desc: "Impian Pan-Skandinavia mengalami kemunduran serius dengan kegagalan untuk bersatu pada tahun 1864. [NORDIC_GetFormAllianceSecondParagraph]"
 NORDIC_form_joint_alliance_desc_dem: "Namun, membentuk aliansi baru berdasarkan nilai-nilai demokrasi yang kita anut bisa menjadi mercusuar bagi negara-negara demokrasi di mana pun, sambil tetap mempertahankan diri dan membawa kemenangan cepat melawan musuh-musuh kebebasan."
 NORDIC_form_joint_alliance_desc_com: "Namun, melalui dorongan revolusi proletar, kita dapat menyatukan rakyat kita dan memfokuskan mereka pada perjuangan melawan kapitalisme, dengan bergabung dalam aliansi Rakyat Utara."
 NORDIC_form_joint_alliance_desc_mon: "Namun, warisan kerajaan yang berakar pada tradisi lama yang kita miliki memungkinkan kita untuk melihat gambaran yang lebih besar dan bekerja sama sebagai satu kesatuan, demi pelestarian raja dan ratu tercinta."
 NORDIC_political_cooperation: "Kerja Sama Politik"
 NORDIC_political_cooperation_desc: "Sekadar basa-basi saja tidak akan cukup untuk benar-benar bekerja sama. Jika kita benar-benar ingin menjadi kekuatan yang patut diperhitungkan, kita perlu seluruh sistem kita menjadi roda penggerak mesin yang lebih besar dan terpelihara dengan baik."
 NORDIC_consolidating_institutions: "Konsolidasi Lembaga"
 NORDIC_consolidating_institutions_desc: "TODO_NORDIC"
 NORDIC_economic_union: "Persatuan Ekonomi"
 NORDIC_economic_union_desc: "Kita harus menyatukan sumber daya kita, kita semua mempunyai sesuatu yang dibutuhkan oleh tetangga kita. Dengan mendobrak hambatan-hambatan yang telah lama memisahkan perekonomian kita, kita akan mencapai tingkat efisiensi yang lebih tinggi. Sumber daya harus mengalir di antara kita sehingga kita dapat saling membantu dengan lebih baik."
 NORDIC_procurement_fund: "Dana Pengadaan"
 NORDIC_procurement_fund_desc: "Kekuatan-kekuatan ekonomi dan militer yang besar mempunyai kapasitas untuk menghasilkan alat-alat pertahanan dan penaklukan, dan meskipun kita mempunyai industri militer dalam negeri, hal tersebut tidak ada artinya jika dibandingkan. Kita mungkin belum bisa menandingi kekuatan industri ini, namun kita bisa mengumpulkan dana untuk membeli senjata dan kendaraan dalam jumlah besar, yang penting bagi pertahanan kita."
 NORDIC_shared_intelligence: "Kecerdasan Bersama"
 NORDIC_shared_intelligence_desc: "Keseluruhan proyek [NORDIC_get_alliance_name] berkisar pada berbagi kekuatan kita, dan jika pengetahuan memang sama dengan kekuatan, maka marilah kita berbagi apa yang kita ketahui tentang musuh kita, dan apa yang kita tahu musuh kita ketahui tentang kita—dan bahkan apa yang mereka pikir mereka ketahui tentang kita."
 NORDIC_northern_command: "Komando Utara"
 NORDIC_northern_command_desc: "Komando militer gabungan adalah suatu keharusan untuk dapat mengkoordinasikan tindakan kita dengan lebih baik. Angkatan bersenjata harus bekerja sama dengan lancar, dan keputusan harus diambil dengan cepat dan mempertimbangkan kepentingan semua pihak. Kita harus memastikan bahwa komando semacam itu telah dibentuk sehingga rencana lebih lanjut untuk angkatan bersenjata gabungan kita dapat dibuat."
 NORDIC_democratic_institution_1: "Komisi Menteri Nordik"
 NORDIC_communist_institution_1: "Federasi Utara"
 NORDIC_monarchist_institution_1: "Bangsawan Norden"
 NORDIC_first_joint_institution: "[NORDIC_get_institution_1_name]"
 NORDIC_first_joint_institution_desc: "Saat kita mengambil langkah pertama menuju integrasi dan kerja sama yang sejati, [NORDIC_get_alliance_name] membutuhkan lembaga baru, [NORDIC_get_institution_1_desc]"
 NORDIC_first_joint_institution_desc_dem: "di mana para anggota kabinet dari berbagai negara di organisasi supranasional kita dapat mendiskusikan bagaimana menggabungkan upaya kita dengan lebih baik untuk memimpin rakyat kita melewati ketegangan yang meningkat di Eropa."
 NORDIC_first_joint_institution_desc_com: "yang dapat mempersatukan masyarakat kita dan menjamin kepemilikan mereka atas alat-alat produksi sambil tetap memberikan mereka penentuan nasib sendiri."
 NORDIC_first_joint_institution_desc_mon: "yang dapat mengurai jaringan koneksi aristokrat kita dan menempatkannya ke dalam konstelasi terpadu dari rekan-rekan bangsawan kita, yang masing-masing memiliki peran yang harus dipenuhi dalam struktur kekuasaan."
 NORDIC_democratic_institution_2: "Parlemen Perdana Nordik"
 NORDIC_communist_institution_2: "Politbiro Utara"
 NORDIC_monarchist_institution_2: "Konklaf Singa Utara"
 NORDIC_second_institution: "[NORDIC_get_institution_2_name]"
 NORDIC_second_institution_desc: "Aliansi kita semakin erat dan terjalin dibandingkan sebelumnya, namun hal ini juga berarti bahwa sebagai sebuah unit, kita akan menjadi sangat besar dan lambat. Dengan menetapkan [NORDIC_get_institution_2_name] [NORDIC_get_institution_2_desc]"
 NORDIC_second_institution_desc_dem: "kita dapat memiliki badan legislatif yang mewakili pemilih di negara kita dan memiliki kekuasaan eksekutif untuk bertindak cepat dalam menghadapi perang."
 NORDIC_second_institution_desc_com: "kita bisa yakin bahwa keinginan buruh akan terwakili, segelintir orang yang mewakili banyak orang pasti akan bertindak demi kepentingan terbaik proletariat."
 NORDIC_second_institution_desc_mon: "kita dapat mengumpulkan tuan dan nyonya yang paling berkuasa di wilayah kita yang bersatu, sehingga mereka dapat dengan berani dan tegas mengambil kompromi sulit yang menjadi beban kaum bangsawan."
 NORDIC_nordic_army_democratic: "Departemen Operasi Darat"
 NORDIC_nordic_army_communist: "Tentara Rakyat Utara"
 NORDIC_nordic_army_monarchist: "Singa Berbaris"
 NORDIC_nordic_army: "[NORDIC_get_nordic_army_name]"
 NORDIC_nordic_army_desc: "[NORDIC_get_nordic_army_desc]"
 NORDIC_nordic_army_desc_dem: "Peran [NORDIC_get_nordic_army_name] adalah untuk menetapkan parameter bagi berbagai kekuatan darat di negara demokrasi kita agar dapat beroperasi secara saling melengkapi. Jadi kekuatan satu negara bisa mengimbangi kelemahan yang lain, dengan tujuan menghilangkan penindasan di seluruh benua, satu provinsi pada satu waktu."
 NORDIC_nordic_army_desc_com: "Terlepas dari negara asal mereka, semua prajurit di [NORDIC_get_nordic_army_name] adalah bagian dari [NORDIC_get_alliance_name], dan akan bergerak hingga kapitalisme dilenyapkan, dengan gabungan kekuatan dan kemauan keras kita."
 NORDIC_nordic_army_desc_mon: "Kekuatan [NORDIC_get_alliance_name] bukan sekedar tentara, mereka lebih dari itu. [NORDIC_get_nordic_army_name] akan dengan berani berjuang di bawah satu panji, demi tanah dan tanah yang mereka wakili."
 NORDIC_nordic_navy_democratic: "Komando Koordinasi Angkatan Laut"
 NORDIC_nordic_navy_communist: "Komisariat Angkatan Laut Utara"
 NORDIC_nordic_navy_monarchist: "Armada Kerajaan"
 NORDIC_nordic_navy: "[NORDIC_get_nordic_navy_name]"
 NORDIC_nordic_navy_desc: "[NORDIC_get_nordic_navy_desc]"
 NORDIC_nordic_navy_desc_dem: "Luasnya lautan akan membuat negara-negara kita terlihat kecil, namun jika kita bersatu, kita dapat mengoordinasikan operasi kita dan menggunakan sumber daya kita yang terbatas dengan cara yang lebih efisien untuk mengatasi beban kita. Itu akan menjadi tugas para perwakilan di [NORDIC_get_nordic_navy_name], tugas yang sulit tentunya, namun mereka akan memiliki semua sumber daya dan dukungan dari [NORDIC_get_alliance_name] di belakang mereka."
 NORDIC_nordic_navy_desc_com: "Gelombang itu adalah milik rakyat, dan [NORDIC_get_alliance_name] bertekad untuk membebaskan dan mengklaimnya sebagai milik rakyat utara. [NORDIC_get_nordic_navy_name] akan memastikan yang terakhir dilihat musuh kita adalah kapal kita yang berada di cakrawala merah."
 NORDIC_nordic_navy_desc_mon: "Gabungan angkatan laut [NORDIC_get_alliance_name] akan menguasai gelombang di seluruh wilayah kekuasaan kita. [NORDIC_get_nordic_navy_name] akan menjadi gelombang pasang yang akan menghantam musuh kita hingga yang tersisa hanyalah kapal mereka yang karam."
 NORDIC_nordic_airforce_democratic: "Program Pertahanan Udara Nordik"
 NORDIC_nordic_airforce_communist: "Komisariat Udara Rakyat Utara"
 NORDIC_nordic_airforce_monarchist: "Gabungan Angkatan Udara Kerajaan"
 NORDIC_nordic_airforce: "[NORDIC_get_nordic_airforce_name]"
 NORDIC_nordic_airforce_desc: "Langit adalah batas baru aliansi kita. [NORDIC_get_nordic_airforce_desc]"
 NORDIC_nordic_airforce_desc_dem: "Itulah sebabnya [NORDIC_get_nordic_airforce_name] akan mengelola sumber daya yang dibutuhkan untuk melindungi warga negara kita di [NORDIC_get_alliance_name]. Mereka juga akan memastikan angkatan udara kita bekerja sama satu sama lain dan bekerja sama dengan lancar."
 NORDIC_nordic_airforce_desc_com: "Kita tidak bisa membiarkan kekuatan kapitalisme mengambil alih kebebasan yang harus kita miliki secara setara. Angkatan udara kita akan mengerumuni langit musuh-musuh kita dan menghujani mereka dengan api neraka."
 NORDIC_nordic_airforce_desc_mon: "Jika kita mengembangkan kemampuan udara kita, kita akan mengarahkan kekuatan kita dengan lebih baik. Kami akan membuat musuh kami sujud di hadapan kekuatan angkatan udara gabungan kami."
 NORDIC_nordic_research_democratic: "Dewan Riset Nordik"
 NORDIC_nordic_research_communist: "Universitas Rakyat Utara"
 NORDIC_nordic_research_monarchist: "Akademi Kerajaan Bersatu"
 NORDIC_nordic_research: "[NORDIC_get_nordic_research_name]"
 NORDIC_nordic_research_desc: "Kekuatan saja tidak memenangkan perang. Kemajuan teknologi memberikan keunggulan bagi negara-negara abad ke-20 dalam pertempuran modern. [NORDIC_get_nordic_research_desc]"
 NORDIC_nordic_research_desc_dem: "[NORDIC_get_nordic_industry_name] akan menempatkan modal dan sumber daya di tangan yang tepat sehingga tentara dan jenderal kita memiliki alat terbaik untuk menghadapi tantangan perang. Teknologi canggih akan melindungi kita dari pertumpahan darah warga negara kita dengan sia-sia."
 NORDIC_nordic_research_desc_com: "[NORDIC_get_nordic_industry_name] akan menjadi lembaga yang mengembangkan alat pemusnah terbaru, dan memproduksi secara massal alat-alat terbaik yang kita bisa sehingga di tangan rakyat kita, alat-alat tersebut dapat menjadi alat pemenggal kepala fasisme dan kapitalisme."
 NORDIC_nordic_research_desc_mon: "Kerajaan-kerajaan di utara selalu memberikan ruang bagi kemajuan ilmu pengetahuan, dan [NORDIC_get_nordic_industry_name] akan melanjutkan tradisi ini, menyatukan semua pemikir terbaik di alam kita ke dalam satu bangunan, mereka akan melayani semua tuannya dengan saling membantu."
 NORDIC_nordic_military_industry_democratic: "Pengadaan Materiel Nordik"
 NORDIC_nordic_military_industry_communist: "Produksi Senjata Rakyat Utara"
 NORDIC_nordic_military_industry_monarchist: "Pabrik Senjata Kerajaan"
 NORDIC_nordic_military_industry: "[NORDIC_get_nordic_military_industry_name]"
 NORDIC_nordic_military_industry_desc: "[NORDIC_get_nordic_military_industry_desc]. Jika kita bertarung sampai orang terakhir, maka orang-orang itu akan memberikan pukulan yang lebih besar dengan peralatan yang tepat."
 NORDIC_nordic_military_industry_desc_dem: "Program [NORDIC_get_nordic_industry_name] akan dibentuk untuk memastikan bahwa mesin perang kita selalu dilengkapi dengan roda penggerak yang diperlukan untuk berfungsi, dan untuk membela negara kita dari teror dan tirani."
 NORDIC_nordic_military_industry_desc_com: "Revolusi tidak akan mempertahankan dirinya sendiri, dan juga tidak akan menyebar tanpa dorongan kuat dari para pekerja [NORDIC_get_alliance_name] kita yang telah dibebaskan."
 NORDIC_nordic_military_industry_desc_mon: "Di zaman modern ini, kerajaan-kerajaan sedang berjatuhan, dan semangat keluarga kerajaan saja tidak akan menyelamatkannya dari kehancuran. Kita harus memastikan wilayah kita mempunyai senjata yang diperlukan untuk melawan kepunahannya"
 NORDIC_nordic_industry_democratic: "Dana Pengembangan Industri Nordik"
 NORDIC_nordic_industry_communist: "Pekerja di Lockstep"
 NORDIC_nordic_industry_monarchist: "Institut Pembangunan Kerajaan"
 NORDIC_nordic_industry: "[NORDIC_get_nordic_industry_name]"
 NORDIC_nordic_industry_desc: "[NORDIC_get_nordic_industry_desc]"
 NORDIC_nordic_industry_desc_dem: "Dengan atau tanpa perang, negara kita harus membangun infrastruktur dan modal yang diperlukan untuk mendukung penduduk sipil dan meningkatkan kualitas hidup mereka. Tentu saja, ketika masa perang tiba, hal ini akan menjadi landasan penting bagi perekonomian perang kita."
 NORDIC_nordic_industry_desc_com: "Pekerja adalah sumber kehidupan [NORDIC_get_alliance_name], dan alasan keberadaannya. Dengan [NORDIC_get_nordic_industry_name] kami dapat menjamin partisipasi dalam produksi barang untuk kehidupan sehari-hari, dan selama masa perang, mendukung mesin perang kami."
 NORDIC_nordic_industry_desc_mon: "Konsep Noblesse Oblige mengharuskan kita untuk menafkahi rakyat kita, dan membangun infrastruktur yang tidak hanya menguntungkan mereka, namun di masa perang, infrastruktur tersebut akan menjadi fondasi ekonomi perang kita. [NORDIC_get_nordic_industry_name] akan memenuhi peran ini hingga tidak diperlukan lagi."
 NORDIC_first_selector_left: "[NORDIC_get_first_selector_left]"
 NORDIC_first_selector_left_desc: "TODO_NORDIC"
 NORDIC_democratic_first_selector_left: "Departemen Pembangunan Nordik"
 NORDIC_communist_first_selector_left: "Biro Tentara Rakyat Utara"
 NORDIC_monarchist_first_selector_left: "Kadipaten Agung Lautan"
 NORDIC_first_selector_right: "[NORDIC_get_first_selector_right]"
