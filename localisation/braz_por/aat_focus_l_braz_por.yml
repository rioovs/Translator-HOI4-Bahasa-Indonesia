#Communist Path
 NOR_a_resurgent_labor_movement: "Gerakan Buruh yang Bangkit"
 NOR_a_resurgent_labor_movement_desc: "Masyarakat [NOR.GetName] tidak lagi menerima penutup mata kapitalisme. Mereka akhirnya melihat kebenaran, bahwa mereka perlahan-lahan tenggelam dalam kemiskinan yang dilembagakan oleh tuan mereka. Mereka sekarang mengangkat kepala mereka ke atas air dan melihat sebuah revolusi di cakrawala mereka!"
 NOR_compromise_with_the_nkp: "Kompromi dengan NKP"
 NOR_compromise_with_the_nkp_desc: "Karena keselamatan negara kita tampaknya berada di ujung jurang, mungkin kompromi dengan Kommunistiske Parti Norwegia, dan ikatan mereka yang kuat dengan Stalinisme, dapat membantu kita mendapatkan bantuan dari [SOU.GetNameDef]. Tentu saja hal ini lebih baik daripada masa depan yang ditaklukkan oleh kaum Fasis atau Kapitalis."
 NOR_prosecute_the_nkp: "Tuntut NKP"
 NOR_prosecute_the_nkp_desc: "Partai Buruh memisahkan diri dari NKP ketika kesetiaan mereka kepada Stalin dan bukannya kepada para pekerja [NOR.GetName] terlihat jelas. Kita telah membiarkan bangkainya membusuk terlalu lama. Kita harus menghancurkan para pengkhianat ini dengan kekuatan penuh sebelum mereka mengkhianati kita ke [SOU.GetName]."
 NOR_the_seeds_of_the_revolution: "Benih Revolusi"
 NOR_the_seeds_of_the_revolution_desc: "Kapitalisme telah menciptakan cara untuk menghancurkan dirinya sendiri, dan di situlah kita berperan. Kini tugas kita adalah menabur benih masa depan yang lebih cerah bagi masyarakat [NOR.GetName]. Kami kemudian akan menunggu waktu kami sampai kami dapat memetik hasil kerja kami sendiri."
 NOR_the_voice_of_the_people: "Suara Rakyat"
 NOR_the_voice_of_the_people_desc: "Kita harus mendengarkan masyarakat, dan menyediakan alat untuk memperkuat suara tersebut, dan menyebarkan kebenaran Marx. Hanya dengan cara itulah Revolusi kita akan tercapai dari bawah ke atas. Biarkan rakyat meneriakkan tuntutannya untuk bebas dari penindasan kapital."
 NOR_organize_partisan_militias: "Atur Milisi Partisan"
 NOR_organize_partisan_militias_desc: "Jelaslah bahwa kapitalisme tidak akan melunakkan cengkeramannya terhadap pekerja [NOR.GetName] tanpa perlawanan. Mari kita persenjatai mereka yang berkeinginan dan latih mereka, sehingga ketika saatnya tiba, mereka dapat bangkit dan membuka jalan bagi revolusi untuk memutus rantai Kapital."
 NOR_consolidate_power: "Konsolidasi Kekuatan"
 NOR_consolidate_power_desc: "Kini setelah kita mempunyai kekuatan untuk menjamin masa depan yang kita cita-citakan, inilah waktunya untuk memastikan bahwa kita dapat mempertahankannya. Melalui pembersihan dan penugasan baru, kita akan memangkas keadaan ini menjadi bentuk yang memungkinkan kita sukses dan sejahtera."
 NOR_demand_nationalizations: "Menuntut Nasionalisasi"
 NOR_demand_nationalizations_desc: "Pemerintahan borjuis ini belum mengetahui kekuatan kepemilikan kolektif atas alat-alat produksi. Kita perlu menuntut nasionalisasi pabrik-pabrik penting di seluruh negeri sehingga kita dapat memulai revolusi bahkan sebelum revolusi dimulai. Yang lebih penting, semakin banyak pabrik, semakin banyak pula pekerja dan sekutu kita."
 NOR_squash_dissent: "Perbedaan Pendapat"
 NOR_squash_dissent_desc: "Kita tidak bisa membiarkan hasil usaha kita dicuri oleh hama. Sangat penting bagi kita untuk menemukan dan menghapus perbedaan pendapat untuk selamanya. Bagaimanapun, siapa pun yang meragukan pemerintah kita adalah musuh kita."
 NOR_denounce_the_german_reich: "Tolak [GetNorwegianThreateningFascist]"
 NOR_denounce_the_german_reich_desc: "Kita tidak bisa membiarkan [GetNorwegianThreateningFascist] menginjak-injak masyarakat dunia. Kita harus memberi tahu semua orang di dunia apa yang kita perjuangkan agar mereka bergabung di pihak kita melawan fasisme."
 NOR_moscows_education_centers: "Pusat Pendidikan Komunis"
 NOR_moscows_education_centers_desc: "Selama bertahun-tahun Komintern mengajari kawan-kawan dari seluruh Skandinavia keterampilan yang diperlukan untuk menggerakkan Revolusi dari bawah tanah. Sekarang kita bisa menjelaskannya kepada mereka, untuk mengajarkan bagaimana melanjutkan Revolusi selamanya."
 NOR_workers_and_farmers_rise: "Buruh dan Petani Bangkit"
 NOR_workers_and_farmers_rise_desc: "Tanah telah diletakkan, benih telah ditanam dan api Revolusi akan segera menyala. Biarlah kaum buruh dan petani [NOR.GetNonIdeologyName] bangkit dan mengambil alat-alat produksi dari tangan para kapitalis dan tuan tanah yang berlumuran darah."
 NOR_war_in_finland: "Perang di Finlandia"
 NOR_war_in_finland_desc: "Rakyat Finlandia sudah cukup lama menderita, kita harus bergabung dengan [SOU.GetName] dalam membebaskan mereka dari Kapitalisme. Ini hanyalah langkah pertama dalam membebaskan seluruh masyarakat Nordik."
 NOR_defend_finland: "Pertahankan Finlandia"
 NOR_defend_finland_desc: "Kita tidak bisa membiarkan [SOU.GetName] yang tercela memanfaatkan kebanggaan bangsa [FIN.GetName]. Kita harus mengangkat senjata melawan tirani rezim yang berpura-pura memihak rakyat namun hanya menginjak-injak mereka. Finlandia harus tetap merdeka."
 NOR_send_the_king_back_to_denmark: "Kirim Raja Kembali ke Denmark"
 NOR_send_the_king_back_to_denmark_desc: "Kita tidak bisa menyebut diri kita komunis jika kita tetap mempertahankan Keluarga Kerajaan. Setelah menguasai kekuasaan dan alat-alat produksi, sebuah monarki akan menjadi titik temu bagi kontra-revolusi dan perbedaan pendapat. Kita harus segera menangani keluarga kerajaan."
 NOR_worker_armies: "Tentara Pekerja"
 NOR_worker_armies_desc: "Ada banyak pekerjaan yang harus diselesaikan dan jumlah penduduk tidak cukup untuk melakukan semuanya sekaligus. Dengan membangun hierarki pekerja seolah-olah mereka adalah perusahaan dan divisi militer, kita dapat mulai menjalankan kembali proyek satu demi satu."
 NOR_nationalize_the_hydro_plants: "Nasionalisasi Pembangkit Listrik Tenaga Air"
 NOR_nationalize_the_hydro_plants_desc: "Pembangkit listrik tenaga air adalah salah satu kebutuhan pokok industri [ROOT.GetAdjective], namun saat ini berada di tangan yang salah, tangan kapitalis! Mari kita manfaatkan sarana untuk menghasilkan tenaga listrik untuk mendorong fase Revolusi selanjutnya."
 NOR_expand_military_industry: "Memperluas Industri Militer"
 NOR_expand_military_industry_desc: "Industri militer kita yang baru lahir tidak akan cukup untuk menghancurkan kapitalisme global. Hal ini harus diperluas untuk memenuhi kebutuhan angkatan bersenjata kita yang terus berkembang."
 NOR_a_new_norway: "Norwegia Baru"
 NOR_a_new_norway_desc: "Rakyat Norwegia akhirnya terbebas dari belenggu modal, dan fakta tersebut perlu direpresentasikan seiring dengan terbentuknya negara baru kita. Oligarki dan tokoh terkemuka tidak lagi mendikte arah negaranya, mulai sekarang rakyat Norwegialah yang bertanggung jawab atas masa depan mereka. Untuk Norwegia yang baru dan seterusnya!"
 NOR_norwegian_engineering: "Teknik Norwegia"
 NOR_norwegian_engineering_desc: "Jika kita ingin mencapai Revolusi Permanen yang sejati, kita perlu melepaskan diri dari tindakan perang yang dilakukan terhadap saudara dan saudari yang tereksploitasi. Kita perlu mengembangkan desain kita sendiri dan membuat peralatan kita sendiri jika kita ingin menyebut revolusi ini benar-benar milik kita."
 NOR_reawaken_the_permanent_revolution: "Bangkitkan kembali Revolusi Permanen"
 NOR_reawaken_the_permanent_revolution_desc: "Trotskij mengajarkan kita bahwa revolusi tidak akan berhenti, dan tentu saja revolusi tidak akan berhenti, sampai proletariat memegang kendali sejarah. Mari kita angkat proletariat di Skandinavia dan sekitarnya!"
 NOR_crush_stalin: "[GetCrushStalinName]"
 NOR_crush_stalin_desc: "Selama bertahun-tahun Iosif Stalin telah memutarbalikkan kata-kata Marx dan Lenin demi keuntungannya sendiri, menjatuhkan hukuman palsu kepada musuh-musuhnya di Pengadilan Kanguru, dan mengorbankan banyak nyawa demi mengejar egonya. Kita harus menghentikannya sebelum dia menghancurkan masa depan proletariat."
 NOR_crush_stalin_canonical: "Hancurkan Stalin"
 NOR_crush_stalin_generic: "Hancurkan Beruang Merah"
 NOR_crush_big_communist: "Hancurkan [?GLOBAL.platonic_big_communist.GetNameDef]"
 NOR_crush_hitler: "Hancurkan Hitler"
 NOR_crush_hitler_desc: "Hanya sedikit orang yang melakukan kejahatan terhadap kemanusiaan sebanyak Adolf Hitler. Dia telah menghancurkan banyak nyawa dan kejahatannya sepertinya tidak mengenal batas. Akhir permainannya adalah kehancuran segala sesuatu yang kita sayangi, itulah sebabnya kita harus mengakhiri rancangannya sebelum dia mengakhiri kita."
 NOR_prepare_for_war: "Bersiaplah untuk Perang"
 NOR_prepare_for_war_desc: "Tampaknya hal ini tidak dapat dihindari saat ini, jadi mengapa kita membodohi diri sendiri dengan berpikir bahwa perdamaian akan abadi. Perang bisa saja terjadi di negara-negara seperti kita, jadi kita harus siap menghadapi apa pun."
 NOR_join_the_allies: "Bergabunglah dengan Sekutu"
 NOR_join_the_allies_desc: "Karena ketika hal terburuk akhirnya terjadi, memiliki sekutu yang kuat dan dapat dipercaya akan menjadi pembeda antara penaklukan dan kebebasan. [FRA.GetName] dan [ENG.GetName] memenangkan Perang Besar melawan Jerman, dan kami yakin mereka dapat melakukannya lagi."
 NOR_proactive_defense: "Pertahanan Proaktif"
 NOR_proactive_defense_desc: "Musuh kita tidak bisa menyerang jika kita sudah menghancurkannya. Mari kita bawa perang ke negeri mereka sebelum menyentuh negeri kita, tunjukkan pada mereka apa yang bisa dilakukan masyarakat [NOR.GetName] ketika mereka terancam."
 NOR_secure_the_swedish_iron_ore: "Amankan Bijih Besi Swedia"
 NOR_secure_the_swedish_iron_ore_desc: "[SWE.GetName] memiliki sejumlah besar bijih besi berkualitas tinggi di bawah tanahnya, yang mengalir melalui Narvik selama musim dingin ketika pelabuhan utara mereka membeku. Membiarkan sumber bijih ini terbuka dan tersedia bagi tiran asing adalah hal yang tidak dapat diterima, kita harus merebutnya sebelum musuh kita berpikir untuk melakukan hal yang sama."
 NOR_secure_denmark: "Amankan Denmark"
 NOR_secure_denmark_desc: "Kekuatan besar yang terletak di selatan [NOR.GetName] telah lama dicegah oleh mantan tuan kita, [DEN.GetName], jika pasukan mereka yang lemah menyerah, gerbang menuju [NOR.GetName] akan terbuka lebar. Kita harus mencegah hal ini dengan menjaga gerbang ini sendiri."
 NOR_invite_secret_army: "Mengkooptasi Tentara Rahasia"
 NOR_invite_secret_army_desc: "Di masa lalu, para pemimpin [NOR.GetNonIdeologyName] membentuk pasukan rahasia untuk membela negara jika terjadi Revolusi Komunis, namun kini mereka tidak perlu diadili karena tujuan mereka tidak relevan. Kita bisa berkompromi dan mengundang mereka yang ingin membela negaranya bersama kita, bukan melawan kita."
 NOR_revive_pomor_trade: "Menghidupkan Kembali Perdagangan Pomor"
 NOR_revive_pomor_trade_desc: "Selama berabad-abad masyarakat kami di utara berdagang dengan wilayah Pomor di Laut Putih. Hal ini memungkinkan kedua populasi untuk sejahtera, namun kekuatan imperial dan kapitalisme menghentikannya. Mari kita hidupkan kembali perdagangan bersama saudara-saudara lama kita."
 NOR_join_the_comintern: "Bergabunglah dengan Komintern"
 NOR_join_the_comintern_desc: "Komunis Internasional adalah payung sesungguhnya yang memperjuangkan revolusi proletariat di seluruh dunia. Jika kita berharap untuk mengalahkan Kapitalisme dan Fasisme, inilah cara terbaik dan satu-satunya."
 NOR_soviet_industrial_cooperation: "Kerja Sama Industri Soviet"
 NOR_soviet_industrial_cooperation_desc: "Tidak ada salahnya mencari bantuan dari negara-negara yang lebih besar dan maju. Dalam perang untuk mempertahankan revolusi, setiap pekerja, petani dan insinyur adalah kawan kita, dan kita akan menyambut baik bantuan mereka untuk mengembangkan industri kita, seperti yang akan kita lakukan jika peran mereka dibalik."
 NOR_field_hospitals: "Rumah Sakit Lapangan"
 NOR_field_hospitals_desc: "Populasi [NOR.GetName] tidak berdasar seperti di negara lain. Materiil bisa diganti, tapi hilangnya kawan berarti berkurangnya semangat perjuangan internasional melawan kapitalisme. Kita harus memfokuskan upaya kita untuk menyelamatkan tentara yang terluka dan mengirim mereka kembali ke garis depan sesegera mungkin agar kita tidak mengambil risiko kehilangan personel dan tanah."
 NOR_expanded_conscription_drive: "Penggerak Wajib Militer yang Diperluas"
 NOR_expanded_conscription_drive_desc: "Sampai perjuangan ini selesai, kita akan memerlukan pasukan segar untuk mengisi medan perang yang akan membentuk sejarah menuju cita-cita kita. Setiap pria dan wanita yang mampu berperang harus bergabung dengan barisan kami, jangan sampai tanah air kami dikuasai."
 NOR_invite_soviet_designers: "Undang Desainer Soviet"
 NOR_invite_soviet_designers_desc: "Pengetahuan teknis yang dimiliki oleh sekutu komunis kita sudah puluhan tahun lebih maju dari kita. Jika mereka meminjamkan keahliannya kepada kita, kita dapat melompati musuh-musuh kita dan menghindari pertumpahan darah yang tidak perlu, dengan senjata dan kendaraan yang lebih unggul."
#Allied
 NOR_vote_of_no_confidence: "Suara Tidak Percaya"
 NOR_vote_of_no_confidence_desc: "Bisakah kita mempercayai Nygaardsvold dan partai buruhnya untuk menghalau kaum Bolshevik dan Nazi? Pelucutan senjatanya ini lebih terasa seperti orang Yunani yang membuka pintu Troy daripada seorang Perdana Menteri yang siap mempertahankan tanahnya dari Komunisme. Kita tidak bisa membiarkan mereka menyerahkan negara kita yang masih baru ke [SOU.GetNameDef]."
 NOR_liberal_conservative_alliance: "Aliansi Konservatif Liberal"
 NOR_liberal_conservative_alliance_desc: "Meskipun Høyre dan Venstre masing-masing berarti kanan dan kiri, kedua partai kita mempunyai cukup kepentingan yang sama sehingga kita dapat membentuk koalisi pemerintahan dan menangkis setiap serangan dari Partai Buruh yang sedang bergejolak itu. Bersama-sama kita akan membentuk [ROOT.GetName] menjadi bangsa yang bersahabat dengan modal dan siap berperang di dalam dan luar negeri."
 NOR_sabotage_unions: "Serikat Sabotase"
 NOR_sabotage_unions_desc: "Apa yang oleh para pekerja disebut sebagai hak asasi manusia, bagi kami hal tersebut merupakan penghambat pertumbuhan industri. Kita bisa meredam gerakan sindikalis dari dalam dan luar, sehingga kita bisa dengan mudah menghilangkan segala hambatan terhadap kesiapan militer kita."
 NOR_invite_foreign_investment: "Undang investasi asing"
 NOR_invite_foreign_investment_desc: "Industri kita telah diabaikan selama beberapa dekade, sehingga kita kekurangan modal yang diperlukan untuk melakukan industrialisasi hingga mencapai tingkat negara-negara lain di Eropa. Untungnya ada banyak investor rakus di luar negeri yang bersedia berinvestasi untuk masa depan kita, dengan harga tertentu."
 NOR_invite_transnational_manufacturers: "Undang Produsen Transnasional"
 NOR_invite_transnational_manufacturers_desc: "Kita terlalu fokus pada perdagangan sehingga kita belum memanfaatkan seluruh kemungkinan produksi di negara kita. Kini setelah kita berurusan dengan serikat pekerja, perusahaan-perusahaan asing akan berbondong-bondong datang ke negara kita untuk mendapatkan akses yang tidak terbatas pada pasar tenaga kerja."
 NOR_contain_the_labor_movement: "Membendung Gerakan Buruh"
 NOR_contain_the_labor_movement_desc: "Selama masih ada gerakan yang didedikasikan untuk kepentingan kelas pekerja, kita tidak akan pernah bisa sepenuhnya mengontrol modal yang masuk ke [NOR.GetName] dan sarana untuk melanggengkan alirannya."
 NOR_uproot_secret_army: "Mencabut Tentara Rahasia"
 NOR_uproot_secret_army_desc: "Dibentuk pada tahun 1918 oleh pemerintahan sebelumnya, tentara rahasia ini telah bersembunyi di balik bayang-bayang menunggu kudeta komunis yang tidak pernah terjadi, dan sementara itu banyak yang telah teradikalisasi menjadi fasis yang setia. Orang-orang ini hanyalah bom waktu yang sewaktu-waktu bisa meledak di wajah kita, dan harus diberantas."
 NOR_support_finland_in_winter_war: "Dukung Finlandia dalam Perang Musim Dingin"
 NOR_support_finland_in_winter_war_desc: "Kaum Bolshevik akan datang ke Finlandia, dan kita tidak punya alasan untuk percaya bahwa mereka akan berhenti di situ. Kita harus mendukung saudara-saudara kita di Finlandia melawan beruang merah di timur sebelum mereka memakan kita semua."
 NOR_arrest_quisling: "Tangkap Quisling"
 NOR_arrest_quisling_desc: "Setiap kali daftar orang-orang berbahaya di [NOR.GetName] disusun, mantan Menteri Pertahanan Vidkun Quisling jarang muncul. Partainya menyusut, jumlah teman-temannya sedikit, dan yang terpenting, pemujaan buta terhadap Adolf Hitler—sebuah fakta yang akan membuat orang lain menjadi bahaya bagi negara mana pun—membuatnya tampak semakin menyedihkan. Tapi, betapapun kecilnya dia, lebih baik aman daripada menyesal."
 NOR_protect_finnmark_from_the_bolsheviks: "Lindungi Finnmark Dari Bolshevik"
 NOR_protect_finnmark_from_the_bolsheviks_desc: "Sebagai wilayah paling utara dan paling timur, Finnmark akan menjadi titik masuk yang jelas jika [SOV.GetNameDef] memutuskan bahwa penindasan [FIN.GetNonIdeologyName] saja tidak cukup."
 NOR_replace_laake: "Gantikan Laake"
 NOR_replace_laake_desc: "Kristian Laake telah menjadi alat Partai Liberal sejak pengangkatannya. Dia telah melakukan banyak pengurangan kemampuan tentara, dan tampaknya tidak memiliki keterampilan atau kemauan untuk memimpin Norwegia menuju kemenangan. Kami membutuhkan seseorang yang siap menempatkan tentara di garis depan kehidupan di [NOR.GetName]."
 NOR_fde_intelligence_agency: "Badan Intelijen Forsvarets"
 NOR_fde_intelligence_agency_desc: "Prajurit dan perwira kita tidak bisa begitu saja maju ke garis depan. Mereka perlu mengetahui apa yang akan mereka hadapi, dan mampu menggunakan tipu daya dalam rencana mereka. Inilah sebabnya kita akan membentuk badan intelijen Angkatan Darat, sehingga mereka bisa mengotori tangan mereka dan bukannya tentara kita."
 NOR_reform_the_army: "Reformasi Angkatan Darat"
 NOR_reform_the_army_desc: "Pengabaian selama bertahun-tahun di tangan Kristian Laake dan partai Liberal telah menyebabkan tentara berada dalam kekacauan. Kita harus membangun kembali hierarki militer, logistik, strategi, dan protokol agar setara dengan angkatan bersenjata modern yang mungkin akan kita hadapi."
 NOR_improved_training: "Peningkatan Pelatihan"
 NOR_improved_training_desc: "Jika kita mengirim orang-orang kita ke medan perang tanpa pelatihan yang memadai, sebaiknya kita melewatkan Perintah Mobilisasi dan malah mengeluarkan sertifikat kematian.\nProgram pelatihan yang sulit bagi anggota baru perlu dirombak agar kita dapat memiliki kekuatan tempur yang lebih baik, dan mengeluarkan mereka secepat yang kita bisa."
 NOR_officers_academy: "Akademi Perwira"
 NOR_officers_academy_desc: "Perwira yang baik akan melipatgandakan efektivitas kekuatan tempur kita, dan dengan populasi kita yang kecil, hal ini terbukti penting, khususnya jika kita memiliki harapan untuk selamat dari serangan gencar asing."
 NOR_offensive_doctrines: "Doktrin yang Menyerang"
 NOR_offensive_doctrines_desc: "Doktrin lama kami dirancang dengan asumsi bahwa kami hanya akan bertahan sampai musuh kami lelah. Itu adalah harapan yang dibuat oleh para pendahulu kita dan musuh kita di masa depan, dan itulah alasan kita harus melakukan serangan sejak awal."
#Historical 
 NOR_continue_nygaardsvold_government: "Lanjutkan Pemerintahan Nygaardsvold"
 NOR_continue_nygaardsvold_government_desc: "Pemerintahan Partai Buruh yang dipimpin oleh Johan Nygaardsvold telah memberikan manfaat yang baik bagi kita sejauh ini, oleh karena itu, terlepas dari ketegangan politik yang terjadi di negara-negara tetangga kita di selatan, kita harus terus memfokuskan upaya kita untuk membawa perekonomian Norwegia keluar dari krisis ekonomi yang kita alami."
 NOR_weathering_the_storm_to_come: "Mengatasi Badai yang Akan Datang"
 NOR_weathering_the_storm_to_come_desc: "Terlepas dari upaya kita sebelumnya untuk meningkatkan kesejahteraan masyarakat, kini kita harus menghadapi kenyataan meningkatnya ancaman dari berbagai penjuru. Kita harus mulai melakukan persiapan menghadapi badai yang terjadi di seluruh Eropa. Semua yang kita bangun tidak akan ada gunanya jika kita tidak bisa mempertahankannya."
 NOR_broken_gun_policies: "Kebijakan Senjata Rusak"
 NOR_broken_gun_policies_desc: "Untuk menghindari konflik di masa depan, kita harus membuktikan bahwa kita hanya mencari netralitas dan tidak bersiap untuk menyerang negara asing. Hanya dengan cara ini negara-negara besar tidak akan melihat kita sebagai ancaman dan membiarkan negara kita menjadi ancaman. Kami percaya hal ini hanya dapat dicapai melalui demiliterisasi yang luas, terlepas dari apa yang mungkin dipikirkan oleh [SWI.GetAdjective] dan Doktrin Netralitas Bersenjata mereka yang bodoh."
 NOR_leaving_the_hard_thirties_behind: "Meninggalkan Tahun Tiga Puluh yang Sulit"
 NOR_leaving_the_hard_thirties_behind_desc: "Selama bertahun-tahun kita telah mengalami guncangan akibat depresi besar, dan tanpa peralatan dan basis industri yang diperlukan, kecil kemungkinan kita bisa membangun negara kita yang masih muda ini. Inilah saatnya untuk mulai membangun landasan dimana [ROOT.GetName] dapat tumbuh dan berkembang."
 NOR_cut_military_budget: "Potong Anggaran Militer"
 NOR_cut_military_budget_desc: "Dunia mungkin terlihat seperti sedang terbakar, tapi itu tidak berarti kita membutuhkan militer. Kita mempunyai kebijakan netralitas yang jelas, sehingga kita dapat menghemat sumber daya yang sebelumnya terbatas pada persenjataan dan pertahanan, sehingga kita dapat mengalihkannya untuk membangun [ROOT.GetName] yang lebih adil dan sejahtera."
 NOR_bail_out_towns: "Kota Bail Out"
 NOR_bail_out_towns_desc: "Krisis ekonomi telah melanda banyak kota kecil di seluruh [ROOT.GetName]. Mereka menderita beban hutang yang sangat besar yang tidak dapat mereka atasi sendiri. Kita mempunyai sarana dan kemauan untuk menyelamatkan komunitas-komunitas ini dan menempatkan mereka pada jalur menuju kesejahteraan, jadi mari kita manfaatkan mereka."
 NOR_restore_public_trust_in_the_storting: "Kembalikan Kepercayaan Masyarakat terhadap Storting"
 NOR_restore_public_trust_in_the_storting_desc: "Setelah puluhan tahun mengalami ketidakstabilan dan kelambanan tindakan, dapat dimengerti bahwa masyarakat umum tidak memiliki kepercayaan pada parlemen kita, Storting. Tanpa kepercayaan masyarakat, kita tidak akan mampu melakukan tindakan yang diperlukan untuk membawa negara kita menuju stabilitas."
 NOR_the_neutrality_guard: "Penjaga Netralitas"
 NOR_the_neutrality_guard_desc: "Pihak lain mungkin menyalahgunakan posisi netral kita untuk mendapatkan keuntungan atas musuh dan menyeret kita berperang dengan mereka ketika kita gagal mempertahankan perbatasan kita. Penjaga Netralitas yang berdedikasi dapat menjamin tidak ada pihak asing yang berperang yang melanggar kepercayaan kami."
 NOR_rearm_for_defense: "Mempersenjatai kembali untuk Pertahanan"
 NOR_rearm_for_defense_desc: "Kita mungkin salah menilai bahaya yang ada di depan. Pesisir kita tidak akan memberikan perlindungan terhadap musuh yang gigih, dan kita tidak bisa begitu saja bergantung pada negara-negara Nordik sebagai penyangga selamanya. Kita sekarang harus mengganti waktu yang hilang dan mempersenjatai kembali [NOR.GetName] agar siap mempertahankan diri."
 NOR_patrol_our_coast: "Patroli Pantai Kami"
 NOR_patrol_our_coast_desc: "Pesisir kita menjadi saksi hamparan laut luas di hadapan mereka, yang semuanya merupakan kemungkinan terjadinya intrusi ke wilayah [NOR.GetAdjective]. Armada kita saat ini terbatas di perairan ini. Kita harus memperluas Angkatan Laut kita agar berhasil mempertahankan wilayah yang luas ini."
 NOR_social_incrementalism: "Inkrementalisme Sosial"
 NOR_social_incrementalism_desc: "Karena masa Hard Thirties hanya tinggal kenangan di benak masyarakat [NOR.GetAdjective], kita harus mencari kemajuan sosial, meskipun kita harus mendekatinya secara perlahan, untuk menghindari sarang tawon konservatisme."
 NOR_print_more_money: "Cetak Lebih Banyak Uang"
 NOR_print_more_money_desc: "Sistem keuangan kita yang masih baru belum sepenuhnya pulih dari pengetatan kebijakan The Hard Thirties, kita harus menggunakan semua alat yang kita miliki untuk mencegah memburuknya situasi, termasuk mencetak lebih banyak uang tunai yang dapat beredar di negara ini."
 NOR_restart_public_investment: "Mulai kembali investasi publik"
 NOR_restart_public_investment_desc: "Ini bukan waktunya untuk membiarkan infrastruktur dan perekonomian kita merana karena kelalaian, pemerintahan Partai Buruh harus sekali lagi berinvestasi untuk masa depan negara, baik itu produksi sipil, atau persiapan perang yang mungkin terjadi lebih cepat dari yang kita harapkan."
 NOR_coastal_defense: "Pertahanan Pesisir"
 NOR_coastal_defense_desc: "[NOR.GetName] memiliki salah satu garis pantai terpanjang di dunia, sehingga membentenginya akan menjadi tugas yang berat, namun hal ini harus dilakukan jika kita ingin mempertahankan kemerdekaan yang baru kita peroleh."
 NOR_fortify_norway: "Perkuat Norwegia"
 NOR_fortify_norway_desc: "Benteng kita sudah cukup lama terbengkalai, kita harus mengerahkan kru konstruksi untuk segera memodernisasi dan bahkan membangun kembali benteng kita yang ada, dan membangun benteng baru jika diperlukan."
 NOR_prepare_a_mobile_government: "Menyiapkan Pemerintahan Bergerak"
 NOR_prepare_a_mobile_government_desc: "Kini setelah perang dimulai, pemerintah kita mempunyai target di belakang mereka. Musuh akan melakukan apa saja untuk melenyapkan pemimpin kita dan menundukkan rakyat [NOR.GetName]. Penting bagi kita untuk siap untuk memindahkan fungsi-fungsi paling penting dari pemerintah agar terhindar dari bahaya."
 NOR_the_kings_no: "Nomor Raja"
 NOR_the_kings_no_desc: "Raja kami, Haakon VII telah menolak permintaan penaklukan musuh kami. [NOR.GetName] bukanlah suatu tanah, melainkan suatu bangsa, dan masyarakat [NOR.GetAdjective] akan terus berjuang meskipun seluruh tanahnya telah dirampas."
 NOR_prince_olavs_inspiration: "Inspirasi Pangeran Olav"
 NOR_prince_olavs_inspiration_desc: "Terlepas dari situasi kita saat ini, masyarakat [NOR.GetAdjective] masih percaya pada Pangeran mereka. Meski tidak ikut berperang, dukungannya dari pengasingan sangat berharga bagi legitimasi pemerintahan kita."
 NOR_establish_milorg: "Mendirikan Milorg"
 NOR_establish_milorg_desc: "Perlawanan terhadap pendudukan di [NOR.GetName] masih sengit, namun kurang terorganisir dan disiplin. Perlawanan militer yang terkoordinasi dengan baik, yang dikelola dari pengasingan, dapat menjadi landasan bagi kembalinya pemerintah kita ke tanah [NOR.GetAdjective]."
 NOR_approach_the_coordinating_committee: "Pendekatan kepada Komite Koordinasi"
 NOR_approach_the_coordinating_committee_desc: "Karena tanah kami masih berada di tangan musuh, sebuah organisasi diperlukan untuk bekerja dalam bayang-bayang, dan mengorganisir kelompok-kelompok sipil yang lebih kecil untuk melawan pendudukan secara diam-diam. Kami percaya bahwa berbagai profesional di Koordinasjonskomiteen akan menyelesaikan pekerjaannya."
 NOR_approach_kretsen: "Dekati Kretsen"
 NOR_approach_kretsen_desc: "Ada [NOR.GetAdjective] terkemuka yang tinggal di wilayah pendudukan kami yang, sebelum perang, menentang Pemerintahan Nygaardsvold tetapi sekarang memiliki musuh yang sama dengan kami. Para hakim, administrator, manajer, dan pengusaha yang bertemu secara diam-diam di pertanian Grimelund terbukti penting dalam upaya perlawanan kita jika mereka memberikan pengaruhnya kepada kita."
 NOR_use_xu: "Gunakan XU"
 NOR_use_xu_desc: "Ada informasi berharga di [NOR.GetName] yang diduduki. Kita membutuhkan sebuah organisasi yang dapat memberikan informasi intelijen bagi para pejuang perlawanan, sekutu, dan upaya perang kita sendiri di pengasingan."
 NOR_recruit_norwegian_refugees: "Rekrut Pengungsi Norwegia"
 NOR_recruit_norwegian_refugees_desc: "Ratusan bahkan ribuan [NOR.GetAdjective] meninggalkan pendudukan untuk menghindari penindasan musuh. Banyak dari mereka adalah bagian dari kekuatan yang berjuang untuk membela negara, namun tidak dapat melarikan diri; yang lainnya, telah belajar untuk melawan perlawanan; dan ada pula yang belum pernah bertarung, namun bisa dilatih. Kita harus menggunakan semua orang yang kita bisa untuk bertahan dalam perang ini."
 NOR_empower_sivorg: "Memberdayakan Sivorg"
 NOR_empower_sivorg_desc: "Kini setelah Kretsen dan Komite Koordinasi bergabung dalam upaya kita, kini saatnya membuat mereka bekerja sama di bawah payung yang sama. Sivorg akan menjadi organisasi yang mencakup semua jenis warga sipil, untuk mengorganisir perlawanan sipil di [NOR.GetName]."
 NOR_preparing_the_return_to_norway: "Mempersiapkan Kepulangan ke Norwegia"
 NOR_preparing_the_return_to_norway_desc: "Panggungnya sudah siap, kita punya kekuatan perlawanan yang mendatangkan malapetaka di belakang garis musuh, kolaborasi administrator kunci pendudukan, pasukan terlatih di pengasingan, dan dukungan militer dari sekutu kita. Ini saatnya untuk mengembalikan perlawanan kepada musuh kita dan merebut kembali [NOR.GetNonIdeologyName]!"
 NOR_quislings_coup_happened: "Quisling telah memulai kudetanya"
#Fascist 
 NOR_the_stumbling_storting: "Storting yang Tersandung"
 NOR_the_stumbling_storting_desc: "Kita melihat titik terang di ujung terowongan ketidakstabilan politik, namun kini hal tersebut mulai mengarah pada kekacauan yang lebih besar. Terlepas dari upaya terbaik Johan Nygaardsvold, pertikaian Storting semakin mendekatkan mereka pada kekacauan."
 NOR_lurk_in_the_shadows: "Mengintai dalam Bayangan"
 NOR_lurk_in_the_shadows_desc: "Sementara Storting memakan dirinya sendiri, kita akan memanfaatkan ini untuk keuntungan kita. Kegagalan parlemen yang terus berlanjut adalah titik temu yang kita perlukan untuk merekrut orang-orang [NOR.GetAdjective] menuju Nasjonal Samling dan ke dalam cengkeraman Fasisme."
 NOR_fascist_invasion_of_norway: "Invasi Fasis ke Norwegia"
 NOR_fascist_invasion_of_norway_desc: "Hal yang tidak terpikirkan telah terjadi, ancaman fasis yang kita pikir jauh dari kita telah muncul di depan pintu kita dan telah mendobraknya. Kami hanya bisa berharap dapat bertahan cukup lama agar bantuan bisa sampai di sini."
 NOR_ask_for_foreign_support: "Minta Dukungan Asing"
 NOR_ask_for_foreign_support_desc: "Karena kerajaan kami tidak pernah memiliki basis dukungan fasis yang besar, kami memerlukan dukungan dari saudara-saudara Fasis kami di luar negeri. Dengan bantuan mereka, kami dapat menunjukkan [NOR.GetName] jalan menuju kerajaan Fasis Pan Jerman."
 NOR_approach_the_fatherland_league: "Dekati Liga Tanah Air"
 NOR_approach_the_fatherland_league_desc: "Selama bertahun-tahun, Liga Tanah Air telah mendorong agenda konservatif di Norwegia, namun mereka kekurangan dorongan dan tekad kita. Kita dapat menunjukkan kepada mereka betapa selarasnya kita dan bagaimana kita dapat menggabungkan kekuatan untuk mencapai tujuan bersama melawan Komunisme."
 NOR_cultivate_the_conservative_parties: "Kembangkan Partai Konservatif"
 NOR_cultivate_the_conservative_parties_desc: "Meskipun dukungan terhadap Fasisme di [NOR.GetName] rendah, ada banyak kelompok konservatif yang mengelilingi Storting. Kita bisa memupuk mereka sehingga kita bisa menanam benih Fasisme dan kemudian mengarahkan mereka kepada kita untuk memperkuat kekuatan kita dalam politik [NOR.GetAdjective]."
 NOR_get_industrialist_support: "Dapatkan Dukungan Industrialis"
 NOR_get_industrialist_support_desc: "Meskipun tingkat industrialisasi kita rendah, perusahaan-perusahaan besar mempunyai pengaruh yang besar terhadap tuas kekuasaan, dan dengan bantuan kita, mereka dapat memperoleh pengaruh lebih lanjut, selama mereka mendukung kita, yaitu.\n\nLagi pula, satu-satunya ideologi modal adalah perluasan modal, dan selama kita dapat menyediakan alat untuk itu, mereka akan berada di pihak kita."
 NOR_nasjonal_samling: "Samling Nasjonal"
 NOR_nasjonal_samling_desc: "Selama bertahun-tahun, partai Fasis terkemuka di [NOR.GetName] telah dikesampingkan oleh partai-partai arus utama tengah dan sayap kiri. Itu berakhir sekarang. Kita harus mendukung pemimpinnya Vidkun Quisling, pemimpin kita yang cakap dan karismatik, untuk mewujudkan Rezim Fasis yang benar-benar [NOR.GetAdjective]."
 NOR_the_secret_army: "Tentara Rahasia"
 NOR_the_secret_army_desc: "Sejak tahun 1918, sebuah kekuatan otonom yang dijuluki Hemmelige Hæren telah ditanam dan disembunyikan di sekitar [NOR.GetName] untuk bertindak jika ada risiko pengambilalihan oleh komunis. Sumpah mereka melawan komunisme dapat diubah menjadi dukungan terhadap Fasisme dan yang lebih penting, dukungan untuk pengambilalihan negara kita sendiri."
 NOR_empower_hirden: "Berdayakan Hirden"
 NOR_empower_hirden_desc: "Organisasi paramiliter kami, Hirden, telah menjadi tulang punggung rencana Nasjonal Samling untuk masa depan [NOR.GetName]. Berfokus pada hal ini akan sangat penting untuk merebut pemerintahan dan melakukan perlawanan jika diperlukan."
 NOR_quislings_coup: "Kudeta Quisling"
 NOR_quislings_coup_desc: "Kondisinya sudah matang bagi kebangkitan Nasjonal Samling ke tampuk kekuasaan. Dipimpin secara memadai oleh Fører Vidkun Quisling, ini adalah langkah pertama menuju kendali penuh atas wilayah [NOR.GetAdjective] dan akhirnya ekspansi kami ke seluruh Skandinavia."
 NOR_required_prep_fascist_TT: "§YTotal Dukungan untuk Kudeta Fasis§! lebih tinggi dari $RIGHT|0Y$ (Dukungan saat ini: $LEFT|0Y$)"
 NOR_quislings_regime: "Rezim Quisling"
 NOR_quislings_regime_desc: "Keramahan yang stabil dari Fører karya Nasjonal Samling terlihat jelas. Meskipun banyak yang menolaknya baik secara politik maupun pribadi, bahkan di kabinetnya sendiri, tidak dapat disangkal bahwa sikap keras kepala dan kepercayaan dirinya telah membuahkan hasil. Dia pasti mampu mempertahankan rezim yang berfungsi, untuk berapa lama? Itu masih harus dilihat."
 NOR_get_rid_of_quisling: "Singkirkan Quisling"
 NOR_get_rid_of_quisling_desc: "Kudeta Quisling tidak akan bertahan lama. Ini adalah langkah sementara jika sekutu fasis kita membutuhkan seseorang untuk memberikan legitimasi pada invasi tersebut. Sekarang sudah jelas bahwa kita tidak membutuhkan badut yang terlalu percaya diri ini, kita harus membuangnya sesegera mungkin."
 NOR_elevate_hirden: "Tinggikan Hirden"
 NOR_elevate_hirden_desc: "Hirden telah melayani kita dengan baik sebagai cabang paramiliter Nasjonal Samling, namun ketika kita menghadapi rezim fasis yang sedang berkembang, kita harus mempertimbangkan untuk memperkuat posisinya dalam struktur kekuasaan pemerintahan [NOR.GetAdjective]."
 NOR_military_police: "Polisi Militer"
 NOR_military_police_desc: "Ketika perlawanan terhadap rezim kita semakin meningkat, kita perlu mendapatkan alat untuk menghentikannya sebelum hal itu memburuk. Polisi Militer yang lebih maju mungkin merupakan satu-satunya cara untuk melindungi kekuasaan kita sampai masyarakat [NOR.GetName] belajar menerima tatanan baru."
 NOR_extensive_recruitment: "Rekrutmen yang Luas"
 NOR_extensive_recruitment_desc: "Jika kita ingin memperluas kerajaan kita, kita harus menjelajahi tanah [NOR.GetAdjective] untuk mencari tentara dengan semangat nenek moyang Norse mereka. Penangkapan ikan dan pertanian adalah hal kedua setelah perluasan kerajaan kita, sehingga setiap orang yang mampu harus siap mengangkat senjata melawan musuh-musuh kita."
 NOR_the_weapons_of_conquest: "Senjata Penaklukan"
 NOR_the_weapons_of_conquest_desc: "Menaklukkan musuh membutuhkan lebih dari sekedar manusia dan kemauan untuk berperang. Banyak dari mereka yang akan meninggal, namun menciptakan alat untuk meningkatkan peluang mereka berarti kita dapat memperluas perbatasan kita lebih jauh lagi."
 NOR_lynrytter: "Lynrytter"
 NOR_lynrytter_desc: "Sekarang Blitzkrieg telah terbukti menjadi strategi terbaik, kita harus menerapkannya dan mengendarai tank kita di garis depan musuh. Odin sendiri akan berada di pihak kita saat armor kita membawa kemenangan cepat ke [NOR.GetNameDef]"
 NOR_ulfhedhnar_wolf_coats: "Ulfheðnar"
 NOR_ulfhedhnar_wolf_coats_desc: "Seperti Wolfcoat di masa lalu, yang merupakan kekuatan pengamuk yang melindungi Raja Harald Fairhair, Ulfheðnar baru ini akan menjadi kasta pejuang elit yang akan mempelopori pasukan kita untuk mempertahankan dan memperluas wilayah kita."
 NOR_crackdown_on_civilian_life: "Tindakan Keras terhadap Kehidupan Sipil"
 NOR_crackdown_on_civilian_life_desc: "Tidak ada waktu untuk melakukan aktivitas santai. Perang sedang terjadi, dan di masa-masa baru ini, perang hanya bisa dilakukan secara total, jangan sampai berakhir dengan kematian dan aib bagi rezim kita. Kehidupan sipil harus dibatasi demi pengabdian kepada tanah air."
 NOR_the_administrative_council: "Dewan Administratif"
 NOR_the_administrative_council_desc: "Memang benar, pendudukan [NOR.GetAdjective] bisa berjalan lebih baik. Mungkin perubahan pendekatan akan membantu, jadi daripada memerintah secara langsung, kita bisa menunjuk sebuah dewan yang terdiri dari kolaborator lokal untuk memberikan otonomi kepada masyarakat."
 NOR_abandoning_nynorsk: "Meninggalkan Nynorsk"
 NOR_abandoning_nynorsk_desc: "Meskipun tampaknya memiliki tujuan nasionalis, Nynorsk hanyalah bahasa campuran yang terdiri dari banyak sisa-sisa dari daerah terpencil dan dialek kota. Sebaiknya kita fokus pada bahasa yang sudah digunakan sebagian besar [NOR.GetAdjective] untuk menulis dan membaca. Penutur bahasa minoritas hanya perlu beradaptasi dengan urutan kita."
 NOR_pan_germanic_cooperation: "Kerjasama Pan Jermanik"
 NOR_pan_germanic_cooperation_desc: "Secara budaya, [NOR.GetNonIdeologyName] termasuk dalam dunia Jermanik yang lebih luas, jadi masuk akal untuk menjalin kerja sama yang lebih erat dengan mereka. Mari kita jangkau dan bangun kerajaan kita bersama."
 NOR_secret_police: "Polisi Rahasia"
 NOR_secret_police_desc: "Sudah saatnya kita memperketat cengkeraman terhadap penduduk [NOR.GetAdjective]. Kami telah memperhatikan beberapa titik gejolak. Mereka mungkin tampak tidak penting, namun mereka bisa menjadi satu kesatuan sebelum kita punya waktu untuk mengembangkan taktik untuk mencegah mereka. Bagaimanapun, cara terbaik untuk menjaga ketajaman pisau adalah dengan sering menggunakannya."
 NOR_fascist_military_collaboration: "Kolaborasi Militer Fasis"
 NOR_fascist_military_collaboration_desc: "Kaum fasis dari luar negeri membantu kami mencapai rezim kami saat ini, dan untungnya kami sekarang berada dalam posisi untuk membentuk kolaborasi militer yang lebih erat, hampir setara."
 NOR_frontkjempere: "Frontkjempere"
 NOR_frontkjempere_desc: "Banyak [NOR.GetAdjective] yang mendambakan berada di garis depan, untuk membantu para pembebas kita menaklukkan wilayah lain. Banyak yang akan mati, tapi itulah harga yang harus kita bayar karena menjadi bagian dari gerakan nasionalis global. Siapa tahu, mungkin [NOR.GetName] akan cukup mengambil hati untuk dipercaya mengelola pekerjaannya sendiri."
 NOR_fascist_industrial_investments: "Investasi Industri Fasis"
 NOR_fascist_industrial_investments_desc: "Teman-teman Fasis kita mempunyai kecerdasan dan modal yang dibutuhkan untuk industri maju yang dibutuhkan negara modern agar dapat bersaing. Kita bisa menggunakan ini sebagai cara untuk menjadi sekutu yang lebih berguna."
 NOR_norwegian_reichsprotectorate: "Protektorat Reich Norwegia"
 NOR_norwegian_reichsprotectorate_desc: "Berkat banyak keberhasilan kami, [GetNorwegianFascistOverlord] telah memutuskan [NOR.GetName] siap untuk sepenuhnya bergabung dengan bangsa kita ke dalam kerajaan mereka. Ini adalah cerminan kekuatan mereka, dan rasa hormat kami terhadapnya. Kami akan melakukan apa pun untuk memuaskan dahaga mereka yang semakin besar akan kekuasaan dan tanah."
 NOR_jonas_lie_coup: "Kudeta Jonas Lie"
 NOR_jonas_lie_coup_desc: "Kebodohan Quisling tampaknya tidak mengenal batas. Dia telah merugikan rezim kita bahkan sebelum rezim berkuasa, dan dia adalah mata rantai lemah dalam rantai komando kita. Di sisi lain kita memiliki Jonas Lie, yang sejak awal telah menjadi pendukung kuat pendudukan [GetNorwegianFascistOverlord] atas [ROOT.GetName], dan agen ketertiban yang gigih bila diperlukan. Dia harus menjadi orang yang memimpin rakyatnya dalam mencapai tujuan sekutu kita."
 NOR_bring_back_quisling: "Bawa Kembali Quisling"
 NOR_bring_back_quisling_desc: "Banyak yang melihatnya sebagai badut yang tidak tahu apa-apa, tetapi naiknya Quisling ke tampuk kekuasaan mengisyaratkan rencana licik di balik kegagalannya. Orang seperti inilah yang perlu memimpin, membimbing [NOR.GetName] ke negeri baru dan berlimpah seperti bangsa Viking di masa lalu."
 NOR_a_valuable_partner_to_germany: "Mitra Berharga untuk [GetNorwegianFascistOverlord]"
 NOR_a_valuable_partner_to_germany_desc: "Keberhasilan bangsa ini pada hakikatnya terkait dengan [GetNorwegianFascistOverlord]. Semakin banyak yang bisa kita lakukan untuk membantu mereka, semakin besar imbalan yang akan mereka berikan kepada kita berupa rampasan perang. Kita harus mengarahkan diri kita pada jalan yang dapat mengubah [NOR.GetNAme] menjadi mitra yang sangat diperlukan."
 NOR_invite_german_engineers: "Undang Insinyur Fasis"
 NOR_invite_german_engineers_desc: "[NOR.GetName] tidak pernah menjadi pusat kekuatan industri, para pendahulu kita lebih fokus pada perdagangan daripada memproduksi produk kita sendiri. Itulah sebabnya kita memerlukan bantuan [GetNorwegianFascistOverlord] untuk mendapatkan pengetahuan yang diperlukan untuk mengejar sekutu kita, dan yang lebih penting, musuh kita."
 NOR_the_kings_abdication: "Pengunduran Diri Raja"
 NOR_the_kings_abdication_desc: "Raja dan Bendaharanya, setelah menyadari betapa dahsyatnya kekuatan penjajah kita, tidak punya apa-apa lagi untuk diberikan kepada rakyatnya, atau diambil dari mereka. Raja Haakon VII, dalam penampilan publik yang jarang terjadi, telah mengumumkan bahwa setiap warga negara [NOR.GetAdjective] harus tunduk pada fasis yang menyerbu tanah kami."
 NOR_reviving_the_norgesveldet: "Menghidupkan kembali Norgesveldet"
 NOR_reviving_the_norgesveldet_desc: "Nenek moyang kita ditakuti oleh semua orang, menyerang dan menaklukkan ke mana pun mereka bisa melihat dan berlayar. Kita harus melihat kembali ke masa lalu dan mengembalikan semangat itu. Kita bisa menjadi ancaman viking baru yang membuat anak-anak terjaga di malam hari."
 NOR_old_vinland: "Vinland Tua"
 NOR_old_vinland_desc: "Penjelajah Norse kuno terus mendorong diri mereka lebih jauh ke barat dibandingkan orang lain, sampai mereka akhirnya mencapai tanah Vinland yang melimpah, atau yang sekarang mereka sebut Newfoundland dan Labrador. Mari kita sekali lagi melakukan perjalanan ke barat dan menaklukkan apa yang seharusnya tetap menjadi milik kita."
 NOR_claims_on_scotland: "Klaim atas Skotlandia"
 NOR_claims_on_scotland_desc: "Sebelum menjadi bagian dari Britania Raya, Skotlandia hanyalah halaman belakang nenek moyang kita. Mari kita ambil kembali dari tangan-tangan lemah yang hampir tidak dapat menahan akar vikingnya, dan sekali lagi menjelajahi pantai dan pegunungan di Inggris Utara."
 NOR_claims_on_ireland: "Klaim atas Irlandia"
 NOR_claims_on_ireland_desc: "Tempat yang dulunya hanya sebuah laguna hitam yang dihuni nenek moyang Norse kita disebut Duibhlinn. Dari tempat yang tampaknya tidak penting ini, banyak orang Viking yang berkembang biak, menyerbu, dan berbaur dengan suku Gaelik. Pastinya mereka tidak akan keberatan jika kita menariknya kembali, dengan kata-kata atau dengan paksaan."
## Monarchist Path
 NOR_the_chamberlains_overture: "Pembukaan Bendahara Kerajaan"
 NOR_the_chamberlains_overture_desc: "Ketika Storting tertatih-tatih menuju ketidakrelevanan, seorang teladan nilai-nilai Mulia, Baron Peder Anker Wedel-Jarlsberg, yang berada di urutan kedua setelah Wilayah Feodal Jarlsberg, dan Kanselir Raja Haakon VII yang rendah hati, berpendapat bahwa kita harus melihat ke masa lalu sebagai solusi masa depan. Yakni, mungkin aparat kerajaan bisa menguasai seluruh pemerintahan."
 NOR_send_the_storting_home: "Kirim Storting Pulang"
 NOR_send_the_storting_home_desc: "Parlemen nasional kita sudah kehabisan tenaga sejak lama. Menjaganya tetap hidup hanya akan memperpanjang penderitaannya, dan sejujurnya, penderitaan kita juga. Biarkan para politisi pulang ke rumah dan menghabiskan waktu bersama keluarga mereka, anak buah Raja akan mengambil tindakan sendiri."
 NOR_assure_the_population: "Yakinkan Penduduk"
 NOR_assure_the_population_desc: "Sepertinya [ROOT.GetName] sedang menuju kehancuran, namun Kanselir Kerajaan, atas nama Raja Haakon VII, ingin masyarakat mengetahui bahwa monarki akan terus berupaya untuk mengembalikan stabilitas negara."
 NOR_demand_king_haakons_rise_to_power: "Menuntut Naiknya Raja Haakon ke Kekuasaan"
 NOR_demand_king_haakons_rise_to_power_desc: "Berkat pidato penuh semangat dari Baron Wedel-Jarlsberg, masyarakat [NOR.GetName] menuntut monarki berkemauan keras untuk mengambil alih kendali pemerintahan. Satu-satunya masalah adalah Raja Haakon VII sendiri yang terus menekankan bahwa negara harus diperintah oleh perwakilan rakyatnya. Tampaknya raja perlu diyakinkan."
 NOR_the_crowns_executive_powers: "Kekuasaan Eksekutif Mahkota"
 NOR_the_crowns_executive_powers_desc: "Ketika raja terus menolak seruan apa pun agar dia memegang kekuasaan absolut, kita tidak punya pilihan selain memberinya kekuasaan eksekutif. Ketika dia bangun dari tidur politiknya, dia akan memiliki alat untuk membimbing [ROOT.GetNonIdeologyName] menuju kejayaan!"
 NOR_a_warden_king: "Raja Pengawas"
 NOR_a_warden_king_desc: "Merupakan tugas seorang raja, bahkan hak istimewanya, untuk mempertahankan tanah yang telah diberikan kepadanya oleh kekuasaan di atas. Biarkan angkatan bersenjata menjadi pedang kekuasaan kerajaan yang absolut, tidak aktif sampai raja memilih untuk bangkit dan menggunakannya."
 NOR_the_kingdom_of_norway: "Kerajaan Norwegia"
 NOR_the_kingdom_of_norway_desc: "Sudah waktunya, apakah Raja Haakon mengetahuinya atau tidak. Mari kita singkirkan segala kepura-puraan terhadap demokrasi dan pemerintahan rakyat dan biarkan tantangan monarki menjatuhkan musuh-musuh kita hingga berkeping-keping. Raja tidak punya pilihan selain menghadiri penobatannya sendiri."
 NOR_appoint_prince_olav_to_army_staff: "Tunjuk Pangeran Olav menjadi Staf Angkatan Darat"
 NOR_appoint_prince_olav_to_army_staff_desc: "Sekarang keluarga kerajaan ikut serta dalam proyek kita, kita perlu memanfaatkan keterampilan mereka dan menugaskan mereka semua untuk tugas mempertahankan Alam kita. Jika kami menugaskan Pangeran Olav sebagai pemimpin pasukan, kami dapat menjamin dia dapat memberikan pelatihan dan pengalaman penuhnya serta menghadapi musuh kami di darat."
 NOR_prince_olav_to_navy_staff: "Pangeran Olav kepada Staf Angkatan Laut"
 NOR_prince_olav_to_navy_staff_desc: "Meskipun mereka terus menolak proyek kami, Pangeran Olav terbuka terhadap gagasan untuk menjalankan kekuatan angkatan laut Kerajaan kami. Bagaimanapun, dia memenangkan medali emas Berlayar di Olimpiade 1928, jadi kita tahu dia menyatu dengan ombak. Dengan fokusnya dalam memimpin angkatan laut kita, kita tahu musuh kita akan menjadi makanan bagi ikan salmon yang ditangkap rakyat kita."
 NOR_promote_civilian_donations: "Promosikan Donasi Sipil"
 NOR_promote_civilian_donations_desc: "Seperti wilayah feodal di masa lalu, setiap bawahan harus membayar iurannya kepada bawahannya. Tentu saja masa-masa barbar itu sudah berlalu, sistem monarki kita yang sederhana sudah lebih tercerahkan dari itu, jadi penghormatan ini sebagian besar bersifat sukarela."
 NOR_research_funding: "Pendanaan Penelitian"
 NOR_research_funding_desc: "Para penguasa [ROOT.GetAdjective] kita yang mulia berdedikasi pada pencerahan, sehingga mereka dengan senang hati menjadi pendukung kemajuan ilmu pengetahuan yang dibutuhkan agar kekuasaan kita berkembang melalui kekerasan terlebih dahulu, dan pada akhirnya, hanya melalui kebajikan."
 NOR_invite_cadillac_to_norway: "Undang Cadillac ke Norwegia"
 NOR_invite_cadillac_to_norway_desc: "Bertahun-tahun yang lalu Pangeran Olav tercinta, seorang bayi yang ceria saat itu, dianugerahi sebuah miniatur Cadillac. Dia pasti akan menghargai jika kami mengundang Cadillac ke [NOR.GetNameDef] untuk membantu kami mengembangkan dan memproduksi kendaraan yang akan membawa standar kami di atas mayat musuh kami. Semoga ini memberi sang pangeran kenangan indah tentang masa kecilnya."
 NOR_enhance_coastal_defense: "Meningkatkan Pertahanan Pesisir"
 NOR_enhance_coastal_defense_desc: "Luasnya garis pantai kita bagaikan pedang bermata dua. Di satu sisi hal ini memungkinkan pasukan kita untuk berkembang di laut, namun di sisi lain hal ini berarti musuh memiliki jalan masuk yang luas untuk melakukan invasi angkatan laut."
 NOR_rule_the_northern_sea: "Kuasai Laut Utara"
 NOR_rule_the_northern_sea_desc: "Biarkan wilayah kita berkembang hingga ke Laut Utara! Kapal kita akan menjadi perpanjangan tangan kerajaan kita hingga ke cakrawala. Agar hal tersebut dapat terwujud, kita memerlukan pangkalan angkatan laut yang diperlukan untuk mempertahankan dominasi tersebut, serta praktik dan teknik yang memungkinkan kita untuk melangkah lebih jauh."
 NOR_ramp_up_naval_production: "Meningkatkan Produksi Angkatan Laut"
 NOR_ramp_up_naval_production_desc: "Terlepas dari tradisi maritim kita, kekuatan angkatan laut kita saat ini tidak sesuai dengan ambisi kita. Kita tidak boleh menyia-nyiakan upaya pada langkah pertama, mendirikan galangan kapal yang akan menjadi bahan bakar angkatan laut Pangeran kita dan calon raja kita, Olav."
 NOR_power_to_the_royal_guard: "Kekuatan untuk Pengawal Kerajaan"
 NOR_power_to_the_royal_guard_desc: "Hans Majestet Kongens Garde, Pengawal Kerajaan raja tercinta kita secara konsisten menjadi pasukan tempur paling terlatih dan paling tegas di dunia. Inspirasi yang mereka peroleh dari raja kita dan bupatinya sangat jelas sehingga mereka harus memimpin pasukan kita, dan akan menjadi ujung tombak yang akan menghancurkan musuh kita."
 NOR_encourage_recruitment: "Mendorong Perekrutan"
 NOR_encourage_recruitment_desc: "Seperti yang sering dikatakan Bendahara kita tercinta, Raja Haakon tinggal di hati kita, jadi siapa pun bisa bertarung dan mati demi dia! Biarkan semangatnya mengangkat setiap mata pelajaran di [ROOT.GetNameDef] sehingga mereka mendaftar untuk memperjuangkan haknya."
 NOR_for_the_king_and_prince: "Untuk Raja dan Pangeran"
 NOR_for_the_king_and_prince_desc: "Raja Haakon kami, dan putranya, Pangeran Olav adalah inspirasi bagi setiap [NOR.GetAdjective]. Kita harus mengingatkan prajurit kita bahwa setiap langkah maju, setiap musuh yang terbunuh, dan setiap liter darah yang tertumpah, tidaklah sia-sia. Ini semua untuk Keluarga Kerajaan kita, para Bangsawan [NOR.GetName] dan apa yang mereka wakili."
 NOR_the_kings_line: "Garis Raja"
 NOR_the_kings_line_desc: "Bunker dan kotak pertahanan yang mengelilingi perbatasan kerajaan kita adalah perwujudan fisik dari ketangguhan dan kemauan Raja. Biarkan orang-orang kita menumpahkan darahnya agar garis keturunan raja tetap bertahan dan wilayah kekuasaannya tetap utuh."
 NOR_the_glucksburg_sea_wall: "Tembok Laut Glücksburg"
 NOR_the_glucksburg_sea_wall_desc: "Pangeran Jarlsberg telah memulai pembangunan tembok laut atas nama rumah milik raja kita yang mulia Haakon VII, Rumah Glücksburg. Ini akan menjadi representasi kekuatan Keluarga Kerajaan, untuk menahan musuh-musuh kita dan melindungi fjord dan pegunungan kita dari bahaya."
 NOR_shield_of_the_north: "Perisai Utara"
 NOR_shield_of_the_north_desc: "Apalah arti pedang jika kamu tidak menggunakannya? Bagaimana jika perisai tidak melindungi subjek yang berada di bawahnya? Keluarga Kerajaan kita harus melindungi tidak hanya [NOR.GetNameDef] tetapi kerajaan dan tanah yang menjadi tanggung jawab mereka. Meski belum tentu De Jure."
 NOR_our_royal_claims: "Klaim Kerajaan Kami"
 NOR_our_royal_claims_desc: "[NOR_GetOurRoyalClaimsDesc]"
 NOR_our_royal_claims_desc_king: "Kami beruntung memiliki raja yang rendah hati, yang menolak klaim apa pun atas tanah di luar yurisdiksinya saat ini. Kita masih lebih beruntung memiliki Pangeran Peder Anker Wedel-Jarlsberg yang kita sayangi, yang bersedia melakukan apa pun untuk menekan klaim ini dan membawanya ke wilayah kita. Mari kita berjuang demi tanah Raja kita!"
 NOR_our_royal_claims_desc_queen: "Sangat disayangkan Raja Haakon VII tidak lagi bersama kita, namun kita harus mengingat warisan yang ia tinggalkan kepada kita, termasuk berbagai klaimnya di seluruh Eropa. Kita masih lebih beruntung memiliki Ratu Mathilde I yang tercinta, yang tidak hanya memiliki klaimnya sendiri, namun juga bersedia melakukan apa pun untuk memaksakan klaim tersebut dan membawanya ke wilayah kita. Mari kita perjuangkan tanah Kerajaan kita!"
 NOR_swedish_claims: "Klaim terhadap Swedia"
 NOR_swedish_claims_desc: "[NOR_GetSwedishClaimsDesc]"
 NOR_swedish_claims_desc_mon: "Tanpa disadari, sejarah dan royalti kami telah dikaitkan dengan [SWE.GetNonIdeologyName]. Selama perjalanan bolak-balik yang berlangsung selama berabad-abad, [SWE.GetAdjective] mencuri lahan yang sangat luas; Jämtland, Härjedalen dan Bohuslän. Apakah Keluarga Bernadotte, Vasa, Oldenburg, atau siapa pun yang patut disalahkan, tidak masalah. Kami akan membalas dendam dan merebut kembali tanah kami"
 NOR_swedish_claims_desc_fas: "Sejarah monarki di Skandinavia adalah sebuah kekacauan yang panjang dan berbelit-belit, namun kita dapat memanfaatkannya untuk keuntungan kita. Swedia telah mencuri seluruh wilayah yang pernah menjadi milik negara kita, kita dapat menggunakan balas dendam sebagai pembenaran untuk menyerang [SWE.GetAdjective] dan mengembangkan kerajaan kita menjadi gabungan wilayah [NOR.GetAdjective] yang bersejarah."
 NOR_claims_on_faroe_islands: "Klaim di Kepulauan Faroe"
 NOR_claims_on_faroe_islands_desc: "[NOR_GetFaroeClaimsDesc]"
 NOR_claims_on_faroe_islands_desc_PAWJ: "Sebagai akibat dari pelanggaran masa lalu yang dilakukan oleh monarki [DEN.GetNonIdeologyName] dan [SWE.GetNonIdeologyName], Kepulauan Faroe telah ditolak oleh kami. Itu berakhir sekarang. Bendahara Agung kita akan membayar harga darahnya untuk memastikan darah itu dikembalikan kepada kita."
 NOR_claims_on_faroe_islands_desc_ALT: "Sebagai akibat dari pelanggaran masa lalu yang dilakukan oleh monarki [DEN.GetNonIdeologyName] dan [SWE.GetNonIdeologyName], Kepulauan Faroe telah ditolak oleh kami. Itu berakhir sekarang. Ratu kita yang berbudi luhur, Mathilde I, akan membayar harga darahnya untuk memastikan darah itu dikembalikan kepada kita."
 NOR_eirik_raudes_land: "Tanah Eirik Raudes"
 NOR_eirik_raudes_land_desc: "Keputusan absurd Den Haag pada tahun 1933 harus dibatalkan. Beraninya mereka membiarkan [DEN.GetName] memiliki tanah yang ditemukan Erik si Merah, seorang Norwegia, satu milenium lalu. Beberapa tahun yang lalu kami memiliki sebagian dari Pantai Timur Greenland, namun kami akan segera mengambilnya dan lebih banyak lagi, warisan Erik The Red akan berlanjut ketika kami mengambil kembali apa yang menjadi milik kami."
 NOR_iceland: "Islandia"
 NOR_iceland_desc: "[NOR_GetIcelandClaimDesc]"
 NOR_iceland_desc_PAWJ: "Setelah pembubaran Kalmar Union, Islandia dirampas dari kita secara tidak adil. Meskipun hal ini terjadi berabad-abad yang lalu, kita tidak melupakannya. Bendahara kami, Raja kami dan Pangeran kami tidak akan tidur sampai masalah ini diperbaiki dan Islandia sekali lagi menjadi bagian dari Kerajaan Norwegia."
 NOR_iceland_desc_ALT: "Setelah pembubaran Kalmar Union, Islandia dirampas dari kita secara tidak adil. Meskipun hal ini terjadi berabad-abad yang lalu, kita tidak melupakannya. Ratu kami, Pangeran kami, dan orang-orang yang mereka kuasai tidak akan tidur sampai masalah ini diperbaiki dan Islandia sekali lagi menjadi bagian dari Kerajaan Norwegia."
 NOR_bjarmeland: "Bjarmeland"
 NOR_bjarmeland_desc: "[ROOT.GetAdjective] penjelajah selama berabad-abad telah memperluas batasan mengenai apa yang mungkin dan dapat dijangkau. Salah satu kasus Bjarmeland, yang pertama kali dieksplorasi oleh [NOR.GetAdjective]s dan sekarang berada di luar jangkauan kita. Kita harus sekali lagi menjangkau dan merebut tanah ini untuk milik kita sendiri."
 NOR_claims_on_denmark: "Klaim pada Denmark"
 NOR_claims_on_denmark_desc: "[NOR_GetDanishClaimsDesc]"
 NOR_claims_on_denmark_desc_mon: "Denmark mungkin adalah negeri yang menjadi rumah bagi raja tercinta kita, namun kita tahu bahwa rumah sebenarnya selalu berada di [NOR.GetNonIdeologyName], bahkan sebelum ia terpilih menjadi raja. Apapun itu, kita harus membawa negara lamanya ke wilayahnya, mungkin itu akan memotivasi dia untuk berperan lebih aktif dalam pemerintahan Monarki kita."
 NOR_claims_on_denmark_desc_fasc: "Para raja di [DEN.GetNonIdeologyName] dulunya adalah tuan kami, namun tidak lagi. Mereka sekarang lemah dan tidak berarti, jadi tanahnya ada untuk kita ambil. Dengan kekuatan baru yang kita temukan, militer mereka akan hancur seperti kue mentega di tangan seorang anak kecil!"
 NOR_consolidate_kingdom: "Konsolidasikan Kerajaan"
 NOR_consolidate_kingdom_desc: "[GetConsolidateKingdomDesc]"
 NOR_consolidate_kingdom_desc_PAWJ: "Kini setelah Markis Peder Anker Wedel-Jarlsberg, Bendahara Kerajaan dan tangan kanan Haakon VII yang kita cintai telah memperluas wilayah mahkota kita, kita harus melihat ke dalam untuk mengkonsolidasikan pencapaian kita dan menguasai rakyat kita dengan tangan yang kokoh dan mantap, meski sedikit tegas."
 NOR_consolidate_kingdom_desc_alt: "Sekarang ratu kita yang sah, Mathilde I, dengan patuh mengawasi wilayah luas kerajaan kita, kita harus melihat ke dalam untuk mengkonsolidasikan keuntungan kita dan memerintah rakyat kita dengan sarung tangan beludru dan tangan yang mantap."
## The Rest 
 NOR_start_rearmament: "Mulai Persenjataan Kembali"
 NOR_start_rearmament_desc: "Mungkin perlucutan senjata total bukanlah cara pasti untuk menghindari perang seperti yang kita harapkan. Sebaiknya kita mulai bersiap menghadapi kemungkinan serangan terhadap tanah kita."
 NOR_kickstart_military_industry: "Memulai Industri Militer"
 NOR_kickstart_military_industry_desc: "[ROOT.GetName] telah lama menjadi subjek negara lain, sehingga tidak pernah mengembangkan industri militer internal. Untuk melindungi kebebasan kita, kita harus berhenti bergantung pada negara lain untuk produksi pertahanan kita dan mulai membangun mesin perang kita."
 NOR_build_supplies_network: "Bangun Jaringan Persediaan"
 NOR_build_supplies_network_desc: "Gunung-gunung, danau-danau, dan fyord kita yang menakjubkan membuat iri dunia, namun gunung-gunung tersebut juga mempersulit pengiriman pasokan. Kita perlu melakukan upaya sadar untuk membuat pasokan mencapai garis depan kita lebih cepat."
 NOR_drobak_coastal_fort: "Benteng Pesisir Drøbak"
 NOR_drobak_coastal_fort_desc: "Drøbak, lebih khusus lagi Drøbak Sound, bisa menjadi kunci untuk mempertahankan ibu kota kita. Anda tidak pernah tahu kapan torpedo yang ditempatkan dengan baik dapat menunda invasi cukup lama untuk melakukan persiapan yang diperlukan untuk meresponsnya."
 NOR_modernize_fortifications: "Modernisasikan Benteng"
 NOR_modernize_fortifications_desc: "Beberapa orang menyebut benteng kita sebagai 'Napoleon', yang dalam konteks ini sama sekali bukan pujian. Bungker kita mungkin kuno, tapi senjata musuh kita tidak. Upaya dan sumber daya untuk menjadikan benteng kita setara pasti akan membuahkan hasil di masa depan."
 NOR_artillery_development: "Pengembangan Artileri"
 NOR_artillery_development_desc: "Perang Besar membuktikan pentingnya artileri, kita tidak bisa membiarkan diri kita tertinggal lebih jauh dari yang sudah ada, karena kita berisiko menjadi tidak berdaya terhadap peluru musuh."
 NOR_anti_air_support: "Dukungan Anti Udara"
 NOR_anti_air_support_desc: "Terlepas dari mana penyerang itu berasal, satu hal yang pasti, mereka akan mencoba menggunakan pesawat mereka untuk menguasai langit dan mengebom kota dan pasukan kita. Kecuali jika kita membangun pertahanan anti-pesawat untuk menetralisir segala upaya dari udara."
 NOR_rikstanken: "Rikstanken"
 NOR_rikstanken_desc: "Kenyataan yang menyedihkan adalah, [ROOT.GetName] belum pernah memiliki tangki sebelumnya. Jika kita berharap mempunyai peluang untuk menang, baju besi akan diberikan. Pertanyaannya adalah, pendekatan apa yang harus kita ambil? Jumlah tank yang besar mungkin merupakan tawaran yang mahal bagi suatu negara dalam situasi seperti ini; mungkin kita bisa menguji airnya dengan satu tangki? Atau mungkin, kita bisa mengorbankan sesuatu selain uang untuk tank negara."
 NOR_tank_procurement: "Pengadaan Tangki"
 NOR_tank_procurement_desc: "Program tank dalam negeri kami jelas tidak cukup untuk peperangan lapis baja di abad ke-20. Sisi baiknya adalah banyak negara dengan keahlian dan volume produksi yang dibutuhkan mungkin akan menjual kendaraan lapis baja mereka. Hal ini akan menjadi jalan pintas yang bagus untuk membawa Angkatan Darat [ROOT.GetAdjective] ke abad ini."
 NOR_norges_rikstanksfabrikk: "Norges Rikstanksfabrikk"
 NOR_norges_rikstanksfabrikk_desc: "Kini setelah kami mempelajari dasar-dasar peperangan lapis baja, kami siap mengembangkan program pembuatan tank nasional kami sendiri, atau Rikstanksfabrikk. Ini adalah satu-satunya cara kita dapat menjamin pasokan kendaraan lapis baja tidak terputus."
 NOR_improve_production_lines: "Meningkatkan lini Produksi"
 NOR_improve_production_lines_desc: "Tidak ada gunanya keberanian membela negara jika kita tidak mampu menyediakan senjata dan perlengkapan untuk terus berjuang. Peperangan modern adalah soal memiliki peluru untuk melawan, mari kita pastikan kita bisa menembakkannya secepat kita bisa menembakkannya."
 NOR_the_royal_guards_battalion: "Batalyon Pengawal Kerajaan"
 NOR_the_royal_guards_battalion_desc: "Untuk beberapa waktu sekarang, The Royal Guard telah menjadi pasukan tempur paling elit kami, kami dapat memperluas program ini dan meningkatkan pelatihan mereka sehingga mereka dapat menjadi garda depan angkatan bersenjata kami."
 NOR_expand_Haeren: "Perluas Hæren"
 NOR_expand_Haeren_desc: "Angkatan darat kita saat ini tidak ada apa-apanya jika dibandingkan dengan angkatan bersenjata lain di benua ini, [ROOT.GetName] tidak pernah menjadi negara militeristik. Seiring dengan meningkatnya ancaman perang global, kita harus memastikan masyarakat kita siap membela negara muda kita."
 NOR_improved_weapons: "Senjata yang Ditingkatkan"
 NOR_improved_weapons_desc: "Peralatan yang digunakan oleh pasukan darat kita berada dalam kondisi yang menyedihkan. Ini merupakan kelalaian yang tidak dapat diterima dan dapat merugikan kemerdekaan kita. Kita harus segera membalikkan tren ini selagi kita mampu."
 NOR_building_an_independent_norway: "Membangun Norwegia yang Merdeka"
 NOR_building_an_independent_norway_desc: "Bangsa [ROOT.GetAdjective], dalam bentuknya yang sekarang dan merdeka, baru ada sejak tahun 1905, jadi masih banyak pekerjaan pembangunan bangsa yang harus dilakukan, khususnya di industri kita, yang sangat penting bagi kemandirian kita."
 NOR_independent_norway_removal_tt: "§Y$NOR_independent_norway_dmod$§! §Rakan dihapus jika [ROOT.GetNonIdeologyName] menjadi subjek negara lain!§!"
 NOR_norwegian_school_of_economics: "Sekolah Ekonomi Norwegia"
 NOR_norwegian_school_of_economics_desc: "Jika kita ingin memantapkan diri dalam perekonomian dunia, diperlukan keahlian, dan hal itu membutuhkan waktu untuk membangunnya. Mendirikan Norges Handelshøyskole sebagai sekolah ekonomi nasional kita adalah langkah pertama agar industri sipil dan kemudian militer kita bisa berkembang."
 NOR_hurtigruten: "Hurtigruten"
 NOR_hurtigruten_desc: "Tidak dapat disangkal bahwa [ROOT.GetNonIdeologyName] bukan hanya negara yang sangat panjang, tetapi juga memiliki medan yang sangat sulit di sekelilingnya. Hal ini tentu saja telah membentuk identitas nasional kita, namun juga membuat pembangunan infrastruktur dan perkeretaapian tidak mungkin dilakukan dengan baik. Kita harus membangun Hurtigruten sebagai solusinya, serangkaian kapal feri untuk memindahkan orang dan barang di sepanjang garis pantai [ROOT.GetAdjective]."
 NOR_norges_tekniske_hogskole: "Norges Tekniske Høgskole"
 NOR_norges_tekniske_hogskole_desc: "Selama lebih dari dua dekade, Institut Teknologi Norwegia di Trondheim telah menjadi yang terdepan dalam bidang teknik di negara ini, namun jika kita ingin bersaing dengan tetangga kita dan mungkin musuh kita, diperlukan lebih banyak dana untuk pendidikan teknis. Kita tidak bisa membiarkan industri kita kekurangan keahlian yang diperlukan."
 NOR_empower_large_industrial_groups: "Memberdayakan Kelompok Industri Besar"
 NOR_empower_large_industrial_groups_desc: "Perusahaan industri besar mempunyai rekam jejak yang terbukti dalam membangun dan memelihara pabrik, memproduksi kebutuhan sehari-hari rata-rata warga [ROOT.GetAdjective]. Tentunya mempercayai mereka adalah jalan yang benar menuju jalan [ROOT.GetNonIdeologyName] menuju kemandirian industri."
 NOR_fund_local_construction: "Mendanai Konstruksi Lokal"
 NOR_fund_local_construction_desc: "Kita tidak bisa membiarkan industrialisasi kita berpusat di ibu kota kita dan beberapa kota besar lainnya. Kemajuan harus mencakup seluruh [ROOT.GetName] secara seragam. Jadi marilah kita berinvestasi di kota-kota besar dan kecil untuk memacu pembangunan lokal, demi basis industri yang lebih beragam dan perekonomian yang lebih kuat."
 NOR_aluminum_production: "Produksi Aluminium"
 NOR_aluminum_production_desc: "Produksi aluminium merupakan proses yang sangat boros energi, dan meskipun kita kekurangan cadangan bauksit, topografi [ROOT.GetAdjective] ideal untuk produksi pembangkit listrik tenaga air, sehingga kita dapat dengan mudah mengimpor bauksit dan mengubahnya menjadi sumber daya berharga bagi industri militer kita yang baru lahir."
 NOR_build_the_northern_rail: "Bangun Rel Utara"
 NOR_build_the_northern_rail_desc: "Sudah terlalu lama bagian utara negara kita terbengkalai. Meskipun kondisi medan membuat pembangunan infrastruktur menjadi rumit, kami yakin upaya ini akan membuahkan hasil di masa depan."
 NOR_complete_the_sourthern_railway_network: "Selesaikan Jaringan Kereta Api Selatan"
 NOR_complete_the_sourthern_railway_network_desc: "Sekalipun wilayah selatan [ROOT.GetNonIdeologyName] jauh lebih berkembang dibandingkan wilayah utara, jika kita mulai membandingkan infrastrukturnya dengan infrastruktur yang ada di negara-negara lain, bahkan negara tetangga, jelas bahwa masih banyak yang harus dilakukan."
 NOR_increase_research_funding: "Meningkatkan Pendanaan Penelitian"
 NOR_increase_research_funding_desc: "[ROOT.GetName] belum pernah menjadi pembangkit tenaga listrik teknologi. Kita harus berinvestasi dalam penelitian baru jika ingin mengejar ketertinggalan dari negara-negara Eropa lainnya, agar kita tidak bergantung pada musuh di masa depan."
 NOR_expand_norges_tekniske_hogskole: "Perluas Norges Tekniske Høgskole"
 NOR_expand_norges_tekniske_hogskole_desc: "Mengingat konflik berskala besar yang tampaknya akan segera terjadi, kita perlu meningkatkan skala Institut Teknis kita untuk memenuhi tuntutan peperangan yang semakin kompleks."
 NOR_revamp_hydroelectric_capacity: "Memperbaiki Kapasitas Pembangkit Listrik Tenaga Air"
 NOR_revamp_hydroelectric_capacity_desc: "Aluminium sangat penting untuk konstruksi pesawat terbang dan peralatan perang lainnya, namun jumlah energi yang diperlukan untuk mengolah bauksit menjadi Aluminium menjadikannya proses yang mahal. Untungnya bagi kami, [NOR.GetName] memiliki topografi yang sempurna untuk mengubah banyak danau dan sungai menjadi bendungan pembangkit listrik tenaga air. Jadi kita bisa memproduksi aluminium yang dibutuhkan meski tidak punya simpanan bauksit dalam jumlah besar."
 NOR_haerens_flyvevaaben: "Hærens Flyvevaaben"
 NOR_haerens_flyvevaaben_desc: "Perbatasan baru peperangan sudah di depan mata. Jika kita membiarkan musuh menguasai sepenuhnya wilayah udara kita, pasukan darat kita tidak akan mampu bertindak secara efektif. Kita harus mengembangkan angkatan udara yang dapat mendukung pasukan darat kita."
 NOR_norwegian_planes: "Pesawat Norwegia"
 NOR_norwegian_planes_desc: "Kita telah menyaksikan bahwa sekutu saat ini bisa menjadi penjajah di masa depan, oleh karena itu kita tidak dapat mengandalkan kekuatan asing untuk pesawat kita, karena mereka sangat penting dalam medan perang modern."
 NOR_foreign_plane_designs: "Desain Pesawat Asing"
 NOR_foreign_plane_designs_desc: "Sebagai negara yang masih muda dan telah lama terabaikan, [ROOT.GetName] tidak memiliki infrastruktur, pengetahuan atau peralatan untuk merancang dan memproduksi kekuatan udara yang diperlukan dalam pertempuran modern. Kita harus beralih ke pasar senjata internasional untuk memasok angkatan udara [NOR.GetName]."
 NOR_anti_air_artillery_research: "Penelitian Artileri Anti Udara"
 NOR_anti_air_artillery_research_desc: "Ketika teknologi baru diterapkan di udara, senjata yang memungkinkan kita mempertahankan wilayah udara dari darat harus sesuai dengan teknologi tersebut sehingga kita tidak menyerah pada supremasi udara musuh."
 NOR_anti_air_construction: "Konstruksi Anti Udara"
 NOR_anti_air_construction_desc: "Medan kami yang terjal membuat [NOR.GetName] menjadi target yang sulit untuk diinvasi musuh, namun langit kami terkena serangan pesawat musuh, sehingga menjadikannya keuntungan jika ada potensi invasi asing. Kita harus membangun baterai anti-udara yang diperlukan untuk mencegah hal ini."
 NOR_invest_in_airfields: "Berinvestasi di Lapangan Terbang"
 NOR_invest_in_airfields_desc: "Tidak ada gunanya memiliki pesawat jika kita tidak memiliki infrastruktur yang diperlukan untuk meluncurkannya. Kita sangat kekurangan infrastruktur yang diperlukan untuk memenuhi kebutuhan angkatan udara yang terus berkembang."
 NOR_stavanger_airfield: "Lapangan Terbang Stavanger"
 NOR_stavanger_airfield_desc: "Bandara Stavanger akan segera selesai dibangun, dan lokasinya sempurna untuk lapangan terbang militer. Kami dapat melakukan penyesuaian yang diperlukan untuk menggunakan bandara sipil ini sebagai pangkalan udara militer."
 NOR_increase_air_production: "Meningkatkan Produksi Udara"
 NOR_increase_air_production_desc: "[NOR.GetName] membutuhkan pesawat terbang, dan mereka membutuhkannya sekarang! Jika kita mengarahkan upaya kita pada produksi pesawat terbang, maka kita mungkin bisa mempertahankan diri dan menembus pertahanan musuh."
 NOR_buy_aa_from_sweden: "Beli AA dari Swedia"
 NOR_buy_aa_from_sweden_desc: "Tetangga kita di Timur, [SWE.GetName], telah lama unggul dalam pembuatan senjata Anti-Udara, jauh melampaui apa yang bisa kita buat. Kita dapat mendekati mereka dengan permintaan untuk membeli senjata Bofors ini untuk mempertahankan langit kita selama invasi yang akan terjadi."
 NOR_luftforsvaret: "$NOR_royal_air_force_dmod$"
 NOR_luftforsvaret_desc: "Sudah waktunya bagi Angkatan Udara kita untuk berhenti menjadi sekedar pendukung pasukan darat kita, dan berkembang menjadi cabang angkatan bersenjatanya sendiri. Negara yang memiliki sumber daya yang diperlukan untuk melakukan semua operasi yang diperlukan untuk pertempuran modern secara efektif."
 NOR_radar_research: "Penelitian Radar"
 NOR_radar_research_desc: "Sebagai negara dengan garis pantai yang luas, sangatlah penting bagi kita untuk dapat memantaunya secara efektif. Berkat keajaiban teknologi yaitu Radar, kita bisa mewaspadai kapal dan pesawat yang datang dari jarak yang lebih jauh."
 NOR_repurpose_lighthouses: "Gunakan Kembali Mercusuar"
 NOR_repurpose_lighthouses_desc: "Cuaca dan geologi telah menjadikan mercusuar di seluruh pantai [ROOT.GetAdjective] sebagai suatu kebutuhan, dan bahkan menjadi ikon bangsa kita. Kita dapat mengubahnya menjadi mercusuar harapan dengan menggunakannya untuk mendukung peralatan Radar dan membantu kita menangkis penjajah."
 NOR_pilot_training: "Pelatihan Percontohan"
 NOR_pilot_training_desc: "Meskipun angkatan udara kita yang masih baru masih kecil dan kurang berkembang, kita dapat memanfaatkan tradisi penerbang dan penjelajah kita untuk menginspirasi generasi baru pilot [NOR.GetAdjective], yang akan memberikan kita kemandirian yang berkelanjutan."
 NOR_the_royal_norwegian_navy: "$NOR_royal_navy_dmod$"
 NOR_the_royal_norwegian_navy_desc: "Memiliki salah satu garis pantai terpanjang di dunia memang mempunyai keuntungan, namun hal ini juga berarti perlunya upaya ekstra untuk mempertahankannya. Angkatan laut kita akan menjadi garda terdepan pertahanan negara kita."
 NOR_expand_the_dockyards: "Perluas Galangan Kapal"
 NOR_expand_the_dockyards_desc: "Meskipun kami memiliki salah satu marinir niaga terbesar di dunia, kapasitas galangan kapal kami tentu dapat diperluas dan dioptimalkan untuk menghasilkan kapal militer yang lebih baik, dibandingkan hanya memproduksi kapal kargo dan tanker."
 NOR_battleship_focus: "Fokus Kapal Perang"
 NOR_battleship_focus_desc: "Hanya raksasa raksasa dan berlapis baja yang dapat menjamin bahwa kita benar-benar menguasai ombak. Ancaman melihat salah satu kapal perang kita berada di pantai mereka, akan menghalangi calon penyerang."
 NOR_kystvakten: "Kystvakten"
 NOR_kystvakten_desc: "Untuk melindungi pesisir kita yang luas, diperlukan angka-angka agar kita dapat melihat setiap inci cakrawala. Mari kita ciptakan jaringan kapal yang akan menjaga tanah kita dari kapal musuh."
 NOR_convert_merchant_ships: "Konversi Kapal Pedagang"
 NOR_convert_merchant_ships_desc: "Laut pedagang kita adalah kebanggaan perekonomian kita, tapi tidak akan ada gunanya bagi kita jika penjajah menghancurkan tanah kita. Tokoh pelayaran kita harus berkorban untuk [ROOT.GetName] dan mari kita membuat kapal-kapal ini layak bertempur."
 NOR_expand_merchant_marine: "Perluas Merchant Marine"
 NOR_expand_merchant_marine_desc: "Peperangan modern membutuhkan sumber daya dan peralatan, dua hal yang sangat kurang dimiliki [ROOT.GetName]. Ketika perang mulai terjadi, kita harus yakin bahwa kita mempunyai kapal yang cukup untuk membawa semua yang kita perlukan untuk bertahan hidup. Memang benar, kita sudah mempunyai lebih banyak kapal sipil dibandingkan negara-negara lain, namun kita memperkirakan akan kehilangan banyak kapal dalam perjalanan ini, dan kita tidak bisa kehilangan jumlah kapal tersebut."
 NOR_expand_naval_academy: "Perluas Akademi Angkatan Laut"
 NOR_expand_naval_academy_desc: "Lebih banyak kapal berarti kita memerlukan lebih banyak petugas untuk memimpin mereka ke medan perang. Akademi angkatan laut kita telah mencukupi selama bertahun-tahun, tetapi seiring dengan berkembangnya angkatan laut kita, pasokan perwira dan pelaut juga harus mencukupi."
 NOR_norwegian_carriers: "Operator Norwegia"
 NOR_norwegian_carriers_desc: "Kita telah berulang kali melihat bahwa masa depan peperangan sangat bergantung pada kendali wilayah udara, bahkan ketika berada di laut. Kapal induk akan membantu kita mendominasi langit di atas kapal musuh dan mengalahkan mereka dengan cepat."
 NOR_mine_laying_effort: "Upaya Peletakan Tambang"
 NOR_mine_laying_effort_desc: "Kapal kita tidak bisa berada di mana-mana sekaligus, tapi ranjau bisa membantu kita menutupi lebih banyak air dan membuat kapten musuh tidak yakin akan keselamatan mereka. Kita memerlukan ranjau yang lebih baik untuk mengatasi teknik penghindaran dan penonaktifan ranjau terbaru."
 NOR_submarine_fleet: "Armada Kapal Selam"
 NOR_submarine_fleet_desc: "Kapal selam, dengan efisiensi dan kemampuan sembunyi-sembunyinya, dapat membalikkan keadaan perang di lautan dengan satu torpedo dalam satu waktu. Kita perlu membuat kapal selam yang lebih banyak dan lebih baik jika kita ingin memaksimalkan peluang kita."
 NOR_naval_air_force: "Angkatan Udara Angkatan Laut"
 NOR_naval_air_force_desc: "Pesawat kami dapat membuat perbedaan antara armada yang mendukung invasi [ROOT.GetName] dan perairan damai di lepas pantai kami. Jika kita bisa menguasai langit di atas lautan, kita bisa menguasai ombak sekali lagi."
 NOR_convoy_defense: "Pertahanan Konvoi"
 NOR_convoy_defense_desc: "Permata bangsa kita adalah armada dagangnya yang sangat besar, oleh karena itu kita tidak boleh menyia-nyiakannya, kita perlu meningkatkan upaya kita dalam mempertahankannya agar dapat bertahan lama dan mempunyai dampak yang lebih besar dalam perang."
 NOR_nortraship: "kapal utara"
 NOR_nortraship_desc: "Kini, karena perang telah membuat kita diasingkan dari negara kita sendiri, kita perlu mengkonsolidasikan upaya pelayaran kita di bawah satu bendera. Nortraship akan membiarkan kita mendukung upaya perang dari jauh dan membantu sekutu kita bertahan cukup lama untuk membantu kita kembali ke [ROOT.GetName]"
 NOR_convoy_bombing: "Pengeboman Konvoi"
 NOR_convoy_bombing_desc: "Semakin kecil armada dagang musuh, semakin besar dampak yang bisa ditimbulkan oleh armada besar kita. Jika kita melemahkan pelayaran mereka, kita dapat membalikkan keadaan perang."
 NOR_rebuild_the_royal_navy: "Membangun kembali Angkatan Laut Kerajaan"
 NOR_rebuild_the_royal_navy_desc: "Kami jauh dari negara kami, jadi untuk mencapainya lagi mungkin melalui laut. Membangun kembali Angkatan Laut Kerajaan sama saja dengan membangun kembali negara kita."
 NOR_pan_germanic_entent: "Entente Pan-Jerman"
 NOR_emergency_conversions: "Konversi Kapal Pedagang"
 NOR_emergency_conversions_desc: "Kita mempunyai armada pedagang yang sangat besar, namun mereka berlayar dengan risiko besar melalui lautan yang berbahaya. Kita harus melucuti sejumlah kapal-kapal kecil ini, mempersenjatai mereka dengan ringan dan membuat mereka melindungi kapal-kapal kita yang rentan. Kami selalu dapat memperbaikinya nanti untuk tugas yang lebih terspesialisasi jika kami memerlukannya."
 NOR_emergency_conversions_tt: "Membuka §Ydecisions§! untuk mengubah §YConvoys§! menjadi §YDestroyers§!"
