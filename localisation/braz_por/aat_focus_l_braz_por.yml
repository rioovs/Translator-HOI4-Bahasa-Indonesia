 SWE_loyalty_laws: "Hukum Loyalitas"
 SWE_loyalty_laws_desc: ""
 SWE_organize_a_putsch: "Atur Putsch"
 SWE_organize_a_putsch_desc: "Kami akhirnya mengumpulkan cukup dukungan di antara orang-orang [SWE.GetAdjective] sehingga kami dapat menguasai Riksdag. Pasti akan ada perlawanan dari kaum demokrat dan sosialis yang salah arah dan sudah lupa apa artinya menjadi [SWE.GetAdjective], namun kita punya kekuatan untuk mengabaikan mereka."
 SWE_delegation_to_berlin: "Delegasi ke Berlin"
 SWE_delegation_to_berlin_desc: "Meskipun kami telah membuat kemajuan besar dalam menggalang massa untuk mendukung tujuan kami, kami masih belum mempunyai cukup dukungan untuk mengambil kendali negara. Namun, ada rumor bahwa [GER.GetLeader] mungkin bersedia mengerahkan pasukan [GER.GetAdjective] untuk membantu perjuangan kita, dengan imbalan tertentu."
 SWE_civil_war_tt: "§RAkan memicu perang saudara di§! §Y[ROOT.GetFlag][ROOT.GetName]§! §Rantara Sosialis Nasional dan pemerintahan saat ini!§!"
 SWE_delegation_to_berlin_tt: "Jika §Y[GER.GetFlag][GER.GetNameDef]§! menerima permintaan tersebut, mereka akan bergabung dengan §Y[ROOT.GetFlag][ROOT.GetAdjective]§! Sosialis Nasional dalam perang saudara dan §R[ROOT.GetFlag][SWE.GetNameDefCap] akan menjadi boneka [GER.GetNameDef]!§!"
 SWE_king_in_council: "Raja di Dewan"
 SWE_king_in_council_desc: "Ketika Raja Gustav naik takhta, dia memegang kekuasaan besar atas politik [SWE.GetAdjective]. Selama masa pemerintahannya, otoritasnya telah diremehkan oleh para politisi idealis yang memiliki visi demokrasi utopis. Keadaan yang tidak wajar ini harus dibalik dengan mengembalikan kekuasaan kuno sang Raja."
 SWE_king_in_council_tt: "§YRoyalis§! menjadi partai yang berkuasa."
 SWE_restoring_order: "Memulihkan Ketertiban"
 SWE_restoring_order_desc: "Ketertiban telah hancur di kalangan masyarakat setelah perebutan kekuasaan yang heroik. Untuk mempengaruhi masyarakat agar mendukung tujuan kita, kita harus menunjukkan kepada mereka bahwa kita dapat memulihkan kejayaan bangsa kita. Dan mereka yang masih menentang kita, akan dibasmi dan dilenyapkan."
 SWE_the_new_order: "Orde Baru"
 SWE_the_new_order_desc: "Survival of the fittest adalah inti keyakinan kami. Oleh karena itu, sudah waktunya kita menghancurkan [GER.GetName] yang melemah dan menegaskan diri kita sekali lagi sebagai kekuatan besar yang mandiri."
 SWE_the_new_order_tt: "Setelah kami menyelesaikan $SWE_the_new_order$ kami akan memutihkan setiap musuh [GER.GetNameDef]"
 SWE_the_new_order_tt_2: "§Y[SWE.GetName]§! akan dikenal sebagai §Y$SWE_the_new_order$§!"
 SWE_the_new_order_peace_message: "Swedia telah memberontak melawan Jerman"
 SWE_mythologize_swedish_history: "Kontra Revolusi"
 SWE_mythologize_swedish_history_desc: "Kita telah menguasai aparatur negara, namun masih banyak yang harus dilakukan untuk mengamankan kekuasaan kita. Oleh karena itu, kita akan menerapkan serangkaian reformasi untuk memuaskan para pendukung politik kita dan pada saat yang sama juga menghilangkan pihak-pihak yang menentang otoritas kita."
 SWE_mythologize_swedish_history_tt: "Membuka keputusan dan mengaktifkan misi untuk memenuhi kewajiban sebelumnya kepada faksi yang mendukung kaum nasionalis selama mereka berkuasa. §RStabilitas akan terkena dampak drastis jika kewajiban tidak dipenuhi!§!"
 SWE_crisis_affecting_variables: "Mereka akan lebih mungkin menerima jika:\n-Mereka mempunyai §YPendapat yang tinggi terhadap kita§!\n-Kita mempunyai §Ytentara§! yang lebih kuat dari mereka\n-Mereka mempunyai kurang dari §Y40% Dukungan Perang§!\n-Mereka tidak berada dalam faksi"
 SWE_narvik_crisis: "Krisis Narvik"
 SWE_narvik_crisis_desc: "Narvik secara strategis penting sebagai jalur ekspor utama bijih besi kami selama bulan-bulan musim dingin. Untuk memastikan keamanan nasional kita selama masa-masa penuh gejolak ini, kawasan ini harus ditempatkan di bawah yurisdiksi kita. Dan jika [NOR.GetName] melemah dalam prosesnya, itu lebih baik."
 SWE_bornholm_crisis: "Krisis Bornholm"
 SWE_bornholm_crisis_desc: "Kepulauan Bornholm hilang dari tangan kita ketika terjadi pemberontakan berabad-abad yang lalu, meskipun secara hukum tidak pernah diserahkan kepada [Den.GetName]. Pentingnya secara strategis karena menguasai Laut Baltik Bawah, jelas bahwa [Den.GetName] tidak dapat mempertahankannya. Kita bisa dan kita harus mendapatkan kembali kendali atas hal itu demi keselamatan kita."
 SWE_the_aland_issue: "Masalah Åland"
 SWE_the_aland_issue_desc: "Orang Åland berbicara bahasa Swedia, mengidentifikasi diri sebagai orang Swedia, dan akan menjadi orang Swedia jika bukan karena campur tangan Liga Bangsa-Bangsa. Lalu bagaimana orang bisa sampai pada kesimpulan bahwa mereka bukan orang Swedia? Inilah saatnya untuk memperbaiki ketidakadilan historis ini."
 SWE_join_the_anti_soviet_pact: "Bergabunglah dengan Pakta Anti-Soviet"
 SWE_join_the_anti_soviet_pact_desc: "Sebagian besar negara takut akan bangkitnya [SOV.GetNameDef] namun tidak mempunyai niat untuk melakukan apa pun untuk mencegah penyebaran pengaruh mereka, kecuali negara-negara penandatangan Pakta Anti-Komintern. Kita harus memperjelas niat kita dengan ikut serta dalam pakta tersebut."
 SWE_join_the_anti_soviet_pact_tt: "Kami akan membangun wilayah kepentingan dengan [GER.GetName], sehingga sangat kecil kemungkinannya untuk menyerang §Y[DEN.GetName]§! dan §Y[NOR.GetName]§! selama §Y2 tahun§!"
 SWE_demand_atlantic_resource_rights: "Menuntut Hak Sumber Daya Atlantik"
 SWE_demand_atlantic_resource_rights_desc: "Kita telah berhasil menghilangkan kedaulatan [DEN.GetAdjective], sekarang kita harus mengambil langkah berikutnya dengan merampas wilayah mereka di Atlantik dengan alasan melindungi mereka dari agresor di wilayah tersebut."
 SWE_demand_demilitarization_of_finnish_border: "Demiliterisasi Finlandia"
 SWE_demand_demilitarization_of_finnish_border_desc: "Sebagai bagian dari rencana reintegrasi kita untuk [FIN.GetName], kita harus terus mengikis kedaulatan mereka sambil membiarkan mereka mempertahankan pertahanan yang kredibel melawan [SOV.GetAdjective] di wilayah timur. Oleh karena itu kita harus mendorong demiliterisasi perbatasan mereka dengan kita, sehingga lebih sulit untuk melakukan pertahanan jika kita perlu campur tangan secara paksa dalam urusan mereka."
 SWE_united_kingdoms_of_sweden_and_norway: "Kerajaan Inggris Swedia dan Norwegia"
 SWE_united_kingdoms_of_sweden_and_norway_desc: "Setelah krisis Narvik dan kemajuan yang kita peroleh, [NOR.GetName] menjadi lemah dan putus asa. Sekarang kita harus melakukan pukulan terakhir terhadap kemerdekaan [NOR.GetAdjective] dan memaksakan reunifikasi bangsa kita di bawah satu penguasa."
 SWE_swedish_finnish_defense_agreement: "Perjanjian Pertahanan Swedia-Finlandia"
 SWE_swedish_finnish_defense_agreement_desc: "Sampai ancaman [SOV.GetNameDef] diatasi, kita berkepentingan untuk bekerja sama dengan [FIN.GetAdjective] secara militer. Suatu hari nanti kita akan mengembalikan mereka ke bawah kekuasaan kita, tapi untuk saat ini kita punya masalah lebih besar yang harus dihadapi."
 SWE_swedish_finnish_defense_agreement_faction: "Perjanjian Pertahanan Swedia-Finlandia"
 SWE_danish_alignment: "Penyelarasan Denmark"
 SWE_danish_alignment_desc: "[DEN.GetName] berlokasi strategis dan secara substansial lebih lemah dibandingkan negara tetangganya, sehingga hampir tidak dapat dihindari bahwa salah satu dari mereka akan berusaha untuk merampas kemerdekaan [DEN.GetAdjective]. Karena itu, kita harus menyerang terlebih dahulu sebelum kehilangan kesempatan."
 SWE_finnish_integration: "Östra Rikshalvan"
 SWE_finnish_integration_desc: "[FIN.GetAdjective] kedaulatan kita telah berhasil terkikis dalam beberapa tahun terakhir. Sekarang kita harus melakukan dorongan terakhir dan menuntut agar mereka sekali lagi mengambil tempat mereka sebagai warga negara kita yang sah. Jika mereka tidak bersedia melakukannya, kami akan memaksa mereka untuk melihat alasannya."
 SWE_crusade_against_bolshevism: "[AAT_crusade_against_sov]"
 SWE_crusade_against_bol: "Perang Salib Melawan Bolshevisme"
 SWE_crusade_against_rus: "Perang Salib Melawan Imperialisme Rusia"
 SWE_crusade_against_bolshevism_desc: "[SOV.GetNameDefCap] adalah ancaman terbesar terhadap nilai-nilai tradisional Eropa yang kita lihat selama berabad-abad. Tidak lagi cukup hanya dengan membendungnya, kita harus terlibat dalam perang salib baru melawan bolshevisme dan menghancurkannya."
 SWE_crusade_against_bolshevism_tt: "Jika §Y$SWE_crusade_against_the_eastern_threat$§! aktif saat §Y[SWE.GetName]§! atau anggota faksi menangkap salah satu dari ini menyatakan:\n§Y[195.GetName]§!,§Y[206.GetName]§!,§Y[202.GetName]§!,___T K17___[242.GetName]§!,§Y[219.GetName]§!,§Y[137.GetName]§!,§Y[218.GetName]§!,§Y[217.GetName]§!,§Y[252.GetName]§!,§Y[249.GetName]§!,§Y_ [229.GetName]§!,§Y[247.GetName]§!,§Y[408.GetName]§!,§Y[214.GetName]§! itu akan diatur ulang ke 365 hari penuh."
 SWE_reclaiming_the_rus: "Merebut kembali Rus"
 SWE_reclaiming_the_rus_desc: "Nenek moyang kita pernah mengunjungi sungai-sungai di Rusia bagian barat dan Ukraina, dan menetap di sepanjang tepiannya. Sudah waktunya kita mengintegrasikan wilayah-wilayah ini ke dalam domain kita dan menyelesaikan apa yang mereka mulai melalui penjajahan."
 SWE_greater_nordic_reich: "Det Stornordiska Riket"
 SWE_greater_nordic_reich_desc: "Melalui kekuatan saja, kami telah membuktikan diri sebagai penguasa Skandinavia yang tak terbantahkan. Tapi ini hanyalah permulaan bagi rakyat kami. Saat kita bersatu sebagai satu Rike, dunia harus bersiap menghadapi apa yang akan datang."
 SWE_greater_nordic_reich_tt: "Mengizinkan coring dan aneksasi subjek §YNordic§!"
 SWE_the_cross_we_bear: "Salib yang Kita Pikul"
 SWE_the_cross_we_bear_desc: "Kita semua adalah saudara dan saudari Nordik. Negara [SWE.GetAdjective] dengan hati nuraninya tidak bisa berdiam diri sementara saudara-saudara kita di Nordik merana di bawah pendudukan. Merupakan keharusan bagi kita untuk membebaskan mereka dari belenggu mereka, sehingga kita dapat hidup dan mati di utara, bebas dari perang dan tirani."
 SWE_the_cross_we_bear_tt_1: "Untuk setiap negara §YNordic§! yang diduduki:"
 SWE_the_cross_we_bear_tt_2: "Untuk setiap negara §YNordic§! yang dibebaskan:"
 SWE_the_cross_we_bear_tt_3: "Meningkatkan kekuatan §Y$SWE_the_cross_we_bear$§! dengan:"
 SWE_scandinavian_defense_union: "Serikat Pertahanan Skandinavia"
 SWE_scandinavian_defense_union_desc: "Konflik-konflik yang terjadi baru-baru ini menunjukkan bahwa berpegang teguh pada sikap netral sangatlah berbahaya. Jika kita ingin menghindari kepungan musuh di masa depan, kita harus membuat perjanjian dengan tetangga kita di Nordik untuk saling membela jika ada di antara kita yang diserang."
 SWE_the_threat_of_the_iron_curtain: "Ancaman Tirai Besi"
 SWE_the_threat_of_the_iron_curtain_desc: "Meskipun konflik baru-baru ini melanda sebagian besar dunia, ketegangan terus meningkat di antara negara-negara yang menang. Jika kita ingin menghindari serangan musuh-musuh kita saat mereka bersaing untuk menguasai Baltik, kita harus mencegah mereka dengan menjadi bagian dari aliansi negara-negara yang berpikiran sama."
 SWE_special_forces: "Berinvestasilah pada Pasukan Khusus"
 SWE_special_forces_desc: "Peperangan modern terkadang memerlukan kelompok kecil pasukan khusus yang dapat menjalankan misi di medan yang sulit atau bertindak di belakang garis musuh tanpa memerlukan bala bantuan. Oleh karena itu kita harus membentuk cabang pasukan khusus yang mampu bertindak sebagai garda depan militer [SWE.GetAdjective] bila diperlukan."
 SWE_acquire_ww2_tanks_and_wrecks: "Dapatkan Bangkai Tank Medan Perang"
 SWE_acquire_ww2_tanks_and_wrecks_desc: "Ketika masalah mulai mereda di seluruh Eropa, ada banyak sekali tank terbengkalai yang tergeletak di medan perang yang dapat kita gunakan untuk penelitian dan pengembangan tentang cara meningkatkan desain kita sendiri. Mungkin sudah waktunya kita memanfaatkan situasi ini sebelum rampasan perang ini diambil alih oleh pihak lain."
 SWE_extend_the_time_of_preparedness: "Perpanjang Waktu Kesiapsiagaan"
 SWE_extend_the_time_of_preparedness_desc: "Meskipun beberapa orang lebih memilih untuk melihat keadaan segera kembali normal pada [ROOT.GetName], ada lebih banyak ancaman yang akan terjadi. Untuk menjaga kemampuan bela negara, kita perlu melanjutkan kesiapan dan komitmen pertahanan total saat ini."
 SWE_increase_intelligence_funding: "Meningkatkan Pendanaan Intelijen"
 SWE_increase_intelligence_funding_desc: "[SWE.capital.GetCapitalVictoryPointName] telah menjadi pusat aktivitas spionase dalam beberapa tahun terakhir. Kita harus meningkatkan pendanaan untuk badan intelijen kita sehingga mereka dapat mengembangkan teknologi baru dan mengambil peran lebih aktif dalam memantau aktivitas tersebut sebelum hal tersebut mengancam kepentingan kita."
 SWE_karnvapenprogram: "Program Kärnvapen"
 SWE_karnvapenprogram_bonus: "Bonus Program Kärnvapen"
 SWE_karnvapenprogram_nuclear_bonus: "Bonus Nuklir Program Kärnvapen"
 SWE_karnvapenprogram_air_bonus: "Bonus Udara Program Kärnvapen"
 SWE_ger_swe_nuclear_bonus: "Bonus Uranprojekt Jerman-Swedia"
 SWE_karnvapenprogram_desc: "Dengan berkembangnya senjata atom, satu-satunya cara untuk benar-benar menjamin keamanan nasional kita adalah dengan mengembangkan senjata tersebut dengan sistem pengiriman kita sendiri yang memadai. Dengan menggunakan kedok pengembangan energi nuklir dan senjata konvensional, kita dapat melakukannya tanpa membuat negara-negara besar khawatir."
 SWE_specialized_equipment: "Peralatan Militer Khusus"
 SWE_specialized_equipment_desc: "Pelatihan pasukan khusus baru berjalan dengan baik. Namun, menjadi jelas bahwa mereka bisa lebih efektif jika mereka mempunyai peralatan dan kendaraan khusus untuk misi mereka."
 SWE_specialized_equipment_tt: "Buka kunci peralatan khusus berdasarkan pasukan khusus yang dipilih sebelumnya (penjaga hutan, pasukan terjun payung, atau marinir)."
 SWE_something_something_neutrality_butt_really: "Sesuatu Sesuatu yang Netralitas Benar-benar"
 SWE_something_something_neutrality_butt_really_desc: "TODO"
 SWE_the_lion_of_the_north_rises: "Singa Dari Utara Bangkit"
 SWE_the_lion_of_the_north_rises_desc: "Sudah terlalu lama Swedia berada di sisi perebutan kekuasaan global. Karena itu, kami menjadi sasaran tuntutan dan blokade yang keterlaluan dari negara-negara besar. Hari-hari itu telah berlalu, singa dari Utara akan bangkit kembali dan mengambil tempatnya sebagai pemimpin wilayah."
 SWE_preemptive_strike: "Serangan Preemptif"
 SWE_preemptive_strike_desc: "Meskipun banyak orang ingin melupakan konflik, kita tidak boleh melakukan kesalahan yang sama lagi. Kita perlu menyerang musuh-musuh kita sebelum mereka menjadi terlalu kuat atau lebih buruk lagi, mengembangkan senjata atom mereka sendiri. Jika kita menyerang dengan cepat dan keras, kita bisa mengejutkan mereka."
 SWE_war_games: "Permainan Perang"
 SWE_war_games_desc: "Tidak ada lagi kepura-puraan antara kita dan musuh mengenai posisi kita secara geo-politik. Oleh karena itu, kita tidak akan rugi jika melibatkan militer dalam latihan perang untuk mengantisipasi konflik dengan musuh."
 SWE_scramble_for_the_baltic: "Perebutan Baltik"
 SWE_scramble_for_the_baltic_desc: "Wilayah yang kini diduduki negara-negara Baltik pernah menjadi wilayah kekuasaan kekaisaran Swedia pada abad-abad yang lalu. Jika kita ingin menegaskan kembali supremasi kita atas Laut Baltik yang lebih luas, kita perlu bertindak cepat untuk merebut kembali wilayah ini sebelum [GER.GetAdjective] atau [SOV.GetAdjective] mengalahkan kita."
 SWE_economic_integration: "Integrasikan Ekonomi dengan [GER.GetNameDef]"
 SWE_economic_integration_desc: "Setelah kekuasaan kita yang berdarah-darah, negara ini berada dalam kehancuran dan sangat membutuhkan pembangunan kembali. Ketika industri kita sedang terpuruk, kita harus melakukan upaya untuk mengintegrasikan industri kita dengan perekonomian [GER.GetAdjective] yang lebih luas untuk memanfaatkan kekuatan ekonomi mereka."
 SWE_economic_independence: "Menjaga Kemandirian Ekonomi"
 SWE_economic_independence_desc: "Meskipun kami bersyukur atas dukungan [GER.GetAdjective] dalam revolusi kami yang gemilang, kami tidak mempunyai niat untuk menjadi salah satu provinsi mereka. Untuk membangun kembali perekonomian kita, kita perlu menyusun strukturnya dengan cara yang mengutamakan kemandirian ekonomi."
 SWE_military_integration: "Integrasikan Militer dengan [GER.GetNameDef]"
 SWE_military_integration_desc: "Orang Swedia sudah lupa cara berperang, namun kita mempunyai kesempatan untuk memulihkan pengetahuan tersebut dengan membangun hubungan kita dengan [GER.GetNameDef]. Dengan mengintegrasikan militer kita dengan militer mereka, kita dapat berkontribusi pada pembebasan Eropa dari Bolshevisme dan menguatkan rakyat [SWE.GetAdjective] dalam prosesnya."
 SWE_military_independence: "Pertahankan Militer Independen"
 SWE_military_independence_desc: "Mengapa tentara [SWE.GetAdjective] harus mati demi [GER.GetNameDef] di Pegunungan Alpen atau Afrika Utara ketika ada masalah yang lebih mendesak di wilayah yang lebih dekat dengan negara kita? Kita harus menjaga independensi militer dan mengumpulkan kekuatan untuk menghadapi ancaman di perbatasan kita."
 SWE_germanify_sweden: "Rangkul Budaya Jerman"
 SWE_germanify_sweden_desc: "Meskipun banyak yang berpendapat bahwa kita adalah bangsa yang berbeda, pengalaman baru-baru ini menunjukkan kepada kita bahwa Swedia adalah bagian dari persaudaraan Jerman, yang terikat oleh darah. Sudah saatnya kita membuang sisa-sisa pengaruh asing dan sekali lagi merangkul akar Jermanik kita."
 SWE_promote_nordic_identity: "Promosikan Identitas Nordik"
 SWE_promote_nordic_identity_desc: "Mungkin ada kesamaan antara budaya Nordik dan [GER.GetAdjective], tapi kami bukan [GER.GetAdjective]. Masyarakat Skandinavia dan Finlandia memiliki budaya dan tradisi mereka sendiri sejak ribuan tahun lalu yang harus diabadikan dan dipertahankan dari orang lain."
 SWE_finland_claims: "Pengakuan atas Klaim Finlandia Kami"
 SWE_finland_claims_desc: "Wilayah [FIN.GetNameDef] merupakan wilayah kekuasaan kami dan dengan kekuatan baru yang kami temukan, kami dapat menegaskan kembali kendali kami atas wilayah tersebut. Namun, konflik yang terjadi baru-baru ini di kawasan ini telah memperumit situasi geopolitik. Oleh karena itu, kami memerlukan dukungan dari [GER.GetNameDef] untuk memberikan bobot pada klaim kami."
 SWE_establish_nordland: "Protektorat Reich Nordland"
 SWE_establish_nordland_desc: "Kami telah bangkit dari abu di bawah bimbingan [GER.GetNameDef], lebih kuat dari sebelumnya. Sekarang, kita harus dihargai atas kesetiaan kita pada tujuan ini dengan perluasan kekuasaan kita jauh ke Timur."
 SWE_establish_nordland_tt: "§Y[SWE.GetNameDef]§! akan dikenal sebagai §Y$SWE_establish_nordland$§!"
 SWE_uranium_project: "[GER.GetAdjective]-[SWE.GetAdjective] Uranprojekt"
 SWE_uranium_project_desc: "[GER.GetAdjective] ilmuwan telah terlibat dalam penelitian nuklir selama bertahun-tahun. Mereka berpendapat bahwa energi atom dapat dilepaskan dalam satu ledakan besar. Dengan akses terhadap air berat untuk eksperimen dan gabungan keahlian ilmiah kami, kami mungkin dapat membantu mereka menciptakan senjata yang begitu menakjubkan."
 SWE_betray_germany_plan: "Menuju Rike Swedia"
 SWE_betray_germany_plan_desc: "[GER.GetNameDefCap] kewalahan dan ditakdirkan untuk runtuh. Oleh karena itu, kita harus membuat rencana untuk mengamankan masa depan kita sendiri dengan mempercepat kehancuran mereka. Namun hal ini hanya mungkin terjadi jika musuh [GER.GetNameDef] bersedia berdamai secara terpisah dengan kami…"
 SWE_undermine_the_fascists: "Melemahkan kaum Fasis"
 SWE_undermine_the_fascists_desc: "Kaum fasis yang bersaing untuk mendapatkan kekuasaan tidak lebih dari rakyat jelata yang marah, jika mereka mempunyai peluang untuk membawa negara menuju kehancuran. Kita harus melemahkan dukungan dari mereka dan memastikan bahwa semua patriot sejati tetap setia kepada Raja."
 SWE_revoke_anti_militia_laws: "Mencabut Undang-undang Anti-milisi"
 SWE_revoke_anti_militia_laws_desc: "Politisi yang berpikiran sempit di Riksdag melarang pembentukan kelompok paramiliter pada tahun 1934, setelah terungkapnya Munckska kåren. Dengan banyaknya kaum sosialis dan pengkhianat lainnya di tengah-tengah kita, kita harus mencabut larangan tersebut dan menciptakan kekuatan baru Stormtruppers untuk menjaga keamanan negara."
 SWE_revoke_anti_militia_laws_tt: "Membuat templat divisi milisi §YStormtrupper§! baru dan membuka §YPerekrutan Milisi Stormtrupper§! setelah [SWE.GetFascistParty] berkuasa."
 SWE_unify_the_national_socialist_movement: "Satukan Gerakan Sosialis Nasional"
 SWE_unify_the_national_socialist_movement_desc: "Gerakan Sosialis Nasional terbagi menjadi banyak faksi yang menulis editorial kecil-kecilan yang mengkritik satu sama lain atau sekadar berkelahi di jalanan. Jika mereka ingin mempunyai peluang untuk membentuk pemerintahan, mereka perlu bersatu di sekitar satu pemimpin dan pesan-pesan mereka."
 SWE_unify_the_national_socialist_movement_tt_1: "Salah satu hal berikut dari acara tersebut dapat diambil:"
 SWE_unify_the_national_socialist_movement_tt_2: "Atau:"
 SWE_unify_the_national_socialist_movement_tt_3: "Membuka keputusan untuk meningkatkan dukungan fasis melalui demonstrasi di negara-negara tempat Stormtruppers direkrut."
 SWE_meet_with_the_king: "Bertemu dengan Raja"
 SWE_meet_with_the_king_desc: "Gelombang nasionalisme di [SWE.GetName] menarik perhatian Raja. Dia telah meminta agar tokoh-tokoh yang menggalang dukungan ini bertemu dengannya di istana kerajaan untuk membahas niat mereka."
 SWE_meet_with_the_king_tt: "Buka keputusan untuk meningkatkan dukungan bagi gerakan royalis melalui tur kerajaan [SWE.GetName]"
 SWE_attack_Landsorganisationen: "Serang Landsorganisationen"
 SWE_attack_Landsorganisationen_desc: "Partai Sosial Demokrat merupakan rintangan besar yang harus diatasi jika kita ingin menyelamatkan negara dari Bolshevisme. Daripada melawan mereka secara langsung dalam pemilu skala kecil, kami akan menggunakan sumber daya kami untuk membuat masyarakat menentang serikat buruh yang mendanai partai tersebut."
 SWE_appeal_for_support: "Banding untuk Dukungan"
 SWE_appeal_for_support_desc: "Kekuasaan dan pengaruh aristokrat [SWE.GetName] telah terkikis selama beberapa dekade, namun hal ini masih belum padam. Dengan menggalang dukungan dan sumber daya, kita dapat mengembalikan negara ini ke bentuk pemerintahan yang lebih alami."
 SWE_appeal_for_support_tt: "Membuka keputusan §Y'Permohonan Dukungan'§! untuk mendapatkan dukungan politik bagi gerakan nasionalis."
 SWE_align_more_closely_with_the_landsorganisationen: "Selaraskan Lebih Dekat dengan Landsorganisationen"
 SWE_align_more_closely_with_the_landsorganisationen_desc: "Serikat pekerja yang kuat dan perlindungan pekerja adalah suatu keharusan dalam setiap angkatan kerja modern. Kami akan membentuk ikatan yang kuat dengan serikat pekerja ini demi kemajuan seluruh pekerja."
 SWE_align_more_closely_with_the_landsorganisationen_tt: "Buka kunci penasihat:"
 SWE_socialist_reforms: "Reformasi Sosialis"
 SWE_socialist_reforms_desc: "Sekarang kita telah memperoleh kekuatan yang cukup di Riksdag, kita dapat mulai meletakkan dasar bagi sebuah republik Sosialis yang sejati. Untuk mengamankan posisi kita, kita harus segera melakukan reformasi untuk membatasi pengaruh borjuasi dan mendapatkan dukungan dari proletariat."
 SWE_socialist_reforms_tt: "§YFolkhemmet§! sekarang memberikan bonus §Yresearch§! setara dengan 25% dari §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!.\n§YFolkhemmet§! sekarang menyediakan §Y$BONUS_PRODUCTION_EFFICIENCY_CAP_FACTOR$§! bonus setara dengan 50% dari §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!."
 SWE_ture_nerman_tt: "$SWE_ture_nerman$"
 SWE_fredrik_strom_tt: "$SWE_fredrik_strom$"
 SWE_zeth_hoglund_tt: "$SWE_zeth_hoglund$"
 SWE_police_reforms: "Mencegah Kontra-Revolusi"
 SWE_police_reforms_desc: "Tidak mengherankan bahwa kebijakan-kebijakan kami membuat kami menjadi musuh yang sangat kuat di kalangan borjuasi dan aristokrasi. Jika kita ingin mencegah mereka melancarkan kontra-revolusi, kita harus bertindak cepat dan membasmi mereka, karena mereka semua adalah pengkhianat kelas di kalangan proletariat."
 SWE_refuge_from_war: "Perlindungan dari Perang"
 SWE_refuge_from_war_desc: "Perang pasti akan menyebabkan eksodus orang-orang yang takut akan nyawa mereka di bawah rezim baru. Banyak dari mereka yang melarikan diri memiliki keterampilan yang dapat bermanfaat bagi kita. Dengan demikian, kita pasti bisa menemukan kesepakatan yang saling menguntungkan."
 SWE_refuge_from_war_tt: "Mendapatkan tenaga kerja untuk setiap negara yang saat ini bukan negara komunis, disesuaikan dengan proporsi dukungan komunis di negara tersebut. §YNordics§! dan §Ymajors§! memberikan kemungkinan pembagian tenaga kerja yang lebih besar, dengan §Yminors§! memberikan kemungkinan pembagian yang lebih kecil, dengan total kemungkinan perolehan tenaga kerja sebesar: §G+80000§!\nTotal tenaga kerja yang diperoleh berdasarkan situasi dunia saat ini: §G+[?SWE_refugee_from_war_total_manpower_gained]§!\nNegara yang menyediakan tenaga kerja paling sedikit: §Y[?SWE_refugee_min_manpower_country.GetName]§!: §G+[?SWE_refugee_min_manpower_gained]§!\nNegara yang menyediakan tenaga kerja paling banyak: §Y[?SWE_refugee_max_manpower_country.GetName]§!: §G+[?SWE_refugee_max_manpower_gained]§!\nRata-rata tenaga kerja yang diperoleh per negara: §G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
 SWE_refuge_for_revolutionaries: "Perlindungan bagi Kaum Revolusioner"
 SWE_refuge_for_revolutionaries_desc: "Meskipun sosialisme tidak bisa dihindari, masih ada kaum revolusioner yang merasa diri mereka berada di pihak yang kalah dalam suatu konflik atau terjebak dalam negara yang telah mengkhianati proletariat. Kami akan memperjelas bahwa semua kaum revolusioner dapat menemukan tujuan dan keamanan di [SWE.GetName]."
 SWE_refuge_for_revolutionaries_tt: "Penasihat komunis dari negara lain akan dipindahkan ke [SWE.GetName] tergantung pada situasi politik negara asal mereka. Saat ini para penasihat ini akan ditransfer ke [SWE.GetName]:"
 SWE_liquidate_the_monarchy: "Likuidasi Monarki"
 SWE_liquidate_the_monarchy_desc: "Waktunya telah tiba untuk membubarkan institusi parasit monarki di [SWE.GetName] untuk selamanya. Keluarga kerajaan dan aristokrasi yang lebih luas akan dicabut gelarnya dan kekayaannya akan didistribusikan kembali kepada rakyat."
 SWE_establish_politburo: "Mendirikan Politbiro"
 SWE_establish_politburo_desc: "Dengan dilucutinya kekuasaan mereka, kaum borjuis dan aristokrasi tidak ada lagi. Dengan demikian, kita akan membubarkan sisa pengaruh mereka yang terakhir, Riksdag. Sebagai gantinya, kita akan membentuk pemerintahan buruh yang baru."
 SWE_five_year_plan: "Komite Perencanaan Negara"
 SWE_five_year_plan_desc: "Dengan terbentuknya politbiro dan nasionalisasi seluruh industri, kita kini memerlukan sebuah badan yang dapat memantau urusan perekonomian dan merekomendasikan keputusan kebijakan kepada komite pusat politbiro."
 SWE_peoples_commissar_for_defense: "Komisaris Pertahanan Rakyat"
 SWE_peoples_commissar_for_defense_desc: "Suatu hari nanti, semua perbatasan akan terhapuskan ketika para pekerja di seluruh dunia bersatu. Hingga hari itu tiba, kita harus tetap waspada dan bersiap menghadapi segala serangan ke wilayah kita. Untuk mengawasi pertahanan kita, kita perlu membentuk kementerian pertahanan baru yang bebas dari pengaruh mantan bangsawan."
 SWE_starve_the_fascists_of_iron: "Membuat Musuh Kita Kelaparan karena Besi"
 SWE_starve_the_fascists_of_iron_desc: "Kami tidak akan melakukan kesalahan yang sama seperti pihak lain dalam menenangkan musuh-musuh kami di masa depan, hanya agar mereka menggunakan sumber daya kami untuk berperang melawan kami. Mulai hari ini, kami akan melarang semua ekspor sumber daya kepada mereka, termasuk bijih besi yang kami dambakan."
 SWE_finnish_buffer_state: "Negara Penyangga Finlandia"
 SWE_finnish_buffer_state_desc: "Tidak diragukan lagi bahwa [SOV.GetNameDef] akan lebih memilih untuk melihat seseorang yang lebih selaras dengan kepentingannya untuk mengendalikan urusan [SWE.GetAdjective]. Untuk mencegah pecahnya konflik di antara kita, [FIN.GetName] harus menjadi negara penyangga yang selaras dengan kepentingan kita."
 SWE_support_norwegian_communists: "Mendukung Komunis Norwegia"
 SWE_support_norwegian_communists_desc: "Kita tidak akan pernah aman sepenuhnya sampai [NOR.GetName] bebas dari kekuasaan borjuis. Namun, mereka tidak akan pernah menerima pemerintahan sosialis yang dipaksakan oleh kami. Oleh karena itu, kita perlu mendukung komunis [NOR.GetAdjective] dalam perjuangan mereka untuk menggulingkan tatanan yang sudah mapan."
 SWE_support_danish_communists: "Mendukung Komunis Denmark"
 SWE_support_danish_communists_desc: "Posisi strategis [DEN.GetName] antara Laut Baltik dan Laut Utara memberikan tingkat kendali yang tidak dapat diterima atas keamanan nasional kita. Satu-satunya cara untuk memastikan mereka tidak mengkhianati kita adalah dengan mendukung gerakan komunis [DEN.GetAdjective] dan membangun rezim yang bersahabat di sana."
 SWE_sami_reconcilliation: "Rekonsiliasi Sami"
 SWE_sami_reconcilliation_desc: "Masyarakat Sámi telah menderita selama berabad-abad karena negara-negara mencuri tanah bersejarah mereka dan membatasi hak-hak mereka. Kami akan melakukan apa yang kami bisa untuk menebus kesalahan dan memulai proses rekonsiliasi dengan Sami."
 SWE_deep_mining_complexes: "Kompleks Penambangan Dalam"
 SWE_deep_mining_complexes_desc: "[SWE.GetName] memiliki banyak sumber daya alam yang terperangkap di bawah tanah. Kita harus meningkatkan investasi pada sektor pertambangan untuk memanfaatkan sumber daya tersebut dengan lebih baik. Selain itu, kita dapat mencegah serangan terhadap kita dengan menghancurkan ranjau, menghalangi akses musuh terhadap barang yang mereka inginkan."
 SWE_affordable_housing: "Perumahan Terjangkau"
 SWE_affordable_housing_desc: "Meskipun standar perumahan mulai membaik di perkotaan, masih banyak orang yang terjebak dalam kemiskinan akibat harga sewa yang tidak terjangkau. Kita harus memastikan bahwa setiap orang memiliki akses terhadap perumahan yang terjangkau untuk memperbaiki situasi ini."
 SWE_continue_the_second_industrial_revolution: "Lanjutkan Revolusi Industri Kedua"
 SWE_continue_the_second_industrial_revolution_desc: "Industrialisasi yang berkelanjutan adalah kunci peningkatan kesejahteraan dan keamanan bagi rakyat kita. Oleh karena itu, kita harus memanfaatkan kekuatan teknologi baru dan mengejar laju industrialisasi yang lebih besar di seluruh [SWE.GetName]."
 SWE_paid_holidays: "Liburan Berbayar Negara"
 SWE_paid_holidays_desc: "Salah satu penyebab ketegangan antara pekerja dan dunia usaha adalah masalah waktu liburan. Sektor swasta hanya akan melakukan upaya seminimal mungkin untuk mendukung pekerja tanpa melanggar hukum, sambil memaksimalkan keuntungan mereka. Sudah saatnya negara turun tangan mengatur hari libur agar bermanfaat bagi pekerja demi perubahan."
 SWE_paid_holidays_policy_tt: "§G+3%§! §YStabilitas§! dan §G+5%§! §YKecepatan konstruksi§! hampir sepanjang tahun.\n§Y+20% Barang Konsumsi§! selama 30 hari dalam setahun"
 SWE_privately_managed_holidays: "Liburan yang Dikelola Secara Pribadi"
 SWE_privately_managed_holidays_desc: "Negara tidak mempunyai tempat untuk mencampuri cara suatu bisnis memutuskan untuk beroperasi. Oleh karena itu, kami akan mengizinkan sektor swasta untuk mengontrol kebijakan liburan mereka. Jika pekerja tidak menyukainya, mereka bisa mencari pekerjaan di tempat lain."
 SWE_kockums: "Kockum"
 SWE_kockums_desc: "Kockums terbukti mampu memproduksi kapal dan kapal selam untuk angkatan laut. Kita harus memperluas operasi mereka dan meningkatkan output kapal yang bisa mereka produksi."
 SWE_gotaverken: "Dapatkan"
 SWE_gotaverken_desc: "Untuk memodernisasi angkatan laut, kita perlu memperluas galangan kapal di Götaverken dan berinvestasi dalam teknologi manufaktur baru untuk pembangunan kapal perang."
 SWE_refit_gotaverken_for_rapid_repairs: "Pasang kembali Götaverken untuk Perbaikan Cepat"
 SWE_refit_gotaverken_for_rapid_repairs_desc: "Mendedikasikan galangan kapal untuk perbaikan mungkin akan mengurangi kecepatan kita dalam membangun kapal, namun hal ini akan sangat meningkatkan kemampuan kita untuk menjaga armada dalam kondisi siap tempur."
 SWE_retool_dockyards: "Perlengkapi Kembali Galangan Kapal"
 SWE_retool_dockyards_desc: "Memfokuskan upaya kita pada kapal-kapal kecil dan kapal selam akan memanfaatkan kekuatan kita dibandingkan mencoba bersaing dengan negara-negara besar."
 SWE_archapeligo_harrasment: "Pelecehan Nusantara"
 SWE_archapeligo_harrasment_desc: "Pantai kami merupakan penghalang bagi calon agresor mana pun. Namun kita dapat memanfaatkan pengetahuan kita tentang kepulauan ini untuk lebih mengganggu kapal-kapal musuh di wilayah tersebut jika kita memberikan sumber daya kepada angkatan laut untuk melakukan hal tersebut."
 SWE_unrestricted_submarine_warfare: "Peperangan Kapal Selam Tanpa Batas"
 SWE_unrestricted_submarine_warfare_desc: "Kapal selam menawarkan kemampuan untuk mengganggu pelayaran dan kapal perang musuh yang biaya penggantiannya jauh lebih mahal. Kita harus memanfaatkannya untuk menutup kesenjangan senjata antara angkatan laut kita dan musuh kita."
 SWE_lindholmens_varv: "Lindholmens Varv"
 SWE_lindholmens_varv_desc: "Lindholmens Varv telah fokus pada pembangunan kapal sipil dalam beberapa tahun terakhir. Dengan sedikit modifikasi, galangan kapal mereka dapat diubah untuk mendukung perluasan dan modernisasi angkatan laut."
 SWE_italian_destroyers: "Beli Kapal Perusak Italia"
 SWE_italian_destroyers_desc: "Membangun kapal dari awal itu mahal. Namun, banyak negara yang bersedia menjual beberapa kapal tua mereka. [ITA.GetNameDefCap] misalnya telah menunjukkan minat untuk menjual sejumlah kapal perusak kepada kami dengan harga yang sangat wajar."
 SWE_italian_ships_tt: "Akan mengarah ke [ROOT.GetFlag][ROOT.GetName]:"
 SWE_italian_ships_tt_2: "§R[ENG.GetNameDefCap] mungkin mencoba mencegat pengiriman kapal!§!"
 SWE_rule_the_baltic: "Kuasai Baltik"
 SWE_rule_the_baltic_desc: "[SWE.GetName] tidak akan aman sampai Baltik benar-benar berada di bawah kendali kita. Untuk melakukan hal tersebut, kita perlu memperoleh keahlian dalam pembangunan kapal yang lebih besar yang dapat meniru desain terbaik dari negara tetangga kita."
 SWE_defense_act: "UU Pertahanan"
 SWE_defense_act_tt: "§YKita bisa merombak pemimpin politik kita pada pemilu mendatang§!"
 SWE_defense_act_desc: "Perang kembali terjadi di Eropa dan ada pilihan sulit yang harus diambil di Riksdag. Tidak ada yang lebih mendesak daripada pengesahan Undang-Undang Pertahanan dan potensinya untuk memecah-belah koalisi yang berkuasa."
 SWE_strike_the_capitalist_beast_down: "Hancurkan Binatang Kapitalis"
 SWE_strike_the_capitalist_beast_down_desc: "Kelas pekerja di Swedia sudah terlalu lama menderita di bawah penindasan kaum borjuis. Meskipun kaum Sosial Demokrat percaya bahwa mereka dapat melunakkan kerasnya kapitalisme, hanya kaum sosialis yang dapat memberikan kebenaran kepada para pemilih, namun kapitalisme tidak dapat diperbaiki. Kapitalisme harus dihapuskan."
 SWE_social_democracy: "Sosial Demokrasi"
 SWE_social_democracy_desc: "Partai Sosial Demokrat mempunyai visi untuk Swedia bukan berdasarkan rasa takut atau kemarahan, namun berdasarkan harapan. Harapannya dengan membantu mereka yang paling membutuhkan di masyarakat, stabilitas dan kebahagiaan dapat dicapai untuk semua. Melalui kerja sama dan kebaikan kami, kami akhirnya akan menciptakan rumah rakyat."
 SWE_as_the_barometer_falls: "Saat Barometer Jatuh"
 SWE_as_the_barometer_falls_desc: "Kita tidak boleh lengah ketika ada serangan ke wilayah kita, apa pun penyebabnya. Oleh karena itu, kita harus memastikan bahwa angkatan bersenjata mempunyai rencana darurat dan pelatihan yang memadai untuk menghadapi skenario seperti itu."
 SWE_the_old_enemy_stirs: "Musuh Lama Bergerak"
 SWE_the_old_enemy_stirs_desc: "Setelah perang saudara berdarah dan industrialisasi besar-besaran selama satu dekade, [SOV.GetNameDef] ingin menegaskan kembali kendali atas wilayah Kekaisaran Rusia lama dan sekitarnya. Jika kita ingin menghindari terjebak dalam pengaruh [SOV.GetName], kita perlu bertindak cepat dan bersiap menghadapi perang."
 SWE_license_skf_ball_bearings: "Bantalan Bola SKF"
 SWE_license_skf_ball_bearings_desc: "SKF telah menjadi pemimpin dunia dalam produksi bantalan bola, yang sangat penting dalam produksi banyak kendaraan militer modern. Kita harus memanfaatkan hal ini untuk keuntungan kita dalam negosiasi perdagangan dengan negara-negara yang berperang."
 SWE_en_svensk_tiger: "Dan Harimau Svensk"
 SWE_en_svensk_tiger_desc: "Informasi apa pun yang dikumpulkan musuh tentang kita dapat digunakan untuk melemahkan keamanan nasional kita. Untuk mencegahnya, bersikap kuat dan diam seperti harimau perkasa harus menjadi bagian dari karakter [SWE.GetAdjective]."
 SWE_swedes_not_sweden_to_finlands_aid_post_fin_war: "Swedia, bukan Swedia yang membantu Finlandia"
 SWE_swedes_not_sweden_to_finlands_aid_pre_fin_war: "Korps Relawan Swedia"
 SWE_swedes_not_sweden_to_finlands_aid: "[SWE_FinnishVolunteerFocusLoc]"
 SWE_swedes_not_sweden_to_finlands_aid_desc: "Meskipun pemerintah tidak dapat secara aktif membantu [FIN.GetName] secara militer tanpa merusak netralitas negara, ada ribuan warga [SWE.GetAdjective] yang siap menyerahkan nyawa mereka untuk membela tetangga kita di Nordik sebagai sukarelawan."
 SWE_swedes_not_sweden_to_finlands_aid_tt: "Akan otomatis ditingkatkan menjadi:"
 SWE_swedes_not_sweden_to_finlands_aid_tt_2: "ketika [FIN.GetName] sedang berperang dengan mayor"
 SWE_finlands_cause_is_ours: "Perjuangan Finlandia adalah milik kita"
 SWE_finlands_cause_is_ours_desc: "Agresi [SOV.GetAdjective] yang diarahkan pada [FIN.GetName] pasti akan ditujukan kepada kita suatu hari nanti. Daripada terus menjauhi konflik yang ada, kita harus bergabung dengan [FIN.GetAdjective] dalam melawan ancaman lama."
 SWE_coalition_war_cabinet: "Kabinet Perang Demokratik"
 SWE_coalition_war_cabinet_desc: "Peristiwa baru-baru ini di seluruh dunia telah mengguncang negara ini dan menimbulkan ketakutan akan penyebaran konflik ke [SWE.GetName]. Untuk meningkatkan rasa persatuan di masa-masa sulit ini, kita akan membentuk kabinet perang koalisi yang terdiri dari para pemimpin partai-partai besar di Riksdag."
 SWE_coalition_war_cabinet_tt: "§YMembuka keputusan untuk menambahkan sifat pada pemimpin kita saat ini§!"
 SWE_the_aland_question: "Pertanyaan [145.GetName]"
 SWE_the_aland_question_desc: "Ketika [SOV.GetNameDef] berupaya untuk menegaskan kembali kendali atas [FIN.GetName], kami tidak dapat membiarkan mereka menguasai wilayah strategis [145.GetName]. Karena berada di lepas pantai kami, pulau-pulau tersebut dapat digunakan untuk memproyeksikan kekuatan udara dan laut [SOV.GetAdjective] jauh ke dalam wilayah [SWE.GetAdjective]."
 SWE_the_aland_question_tt: "§Y[FIN.GetName]§! lebih cenderung menerima penyerahan kendali atas §YÅland§! dalam skenario ini dibandingkan §Y§Y$SWE_the_aland_issue$§!§!, kecuali §Y[SWE.GetName]§! memiliki pasukan yang jauh lebih besar daripada §Y[FIN.GetName]§!"
 SWE_the_nordic_defense_council: "Dewan Pertahanan Nordik"
 SWE_the_nordic_defense_council_desc: "Masing-masing negara Nordik adalah mangsa empuk bagi negara-negara tetangga kita yang ekspansionis. Namun dengan bersatu dan berbagi beban pertahanan kolektif, kita dapat menciptakan efek jera terhadap penyerang mana pun di masa depan. Pertama, kita perlu meratifikasi perjanjian pertahanan di antara calon anggota organisasi tersebut."
 SWE_nordic_defense_fleet: "Armada Pertahanan Nordik"
 SWE_nordic_defense_fleet_desc: "Dengan diratifikasinya perjanjian Pertahanan Nordik, kita dapat memulai proses penggabungan aset angkatan laut kita di bawah sistem komando gabungan."
 SWE_nordic_defense_fleet_tt: "Setiap §YAnggota dewan pertahanan Nordik§! jenis subjek:\nTransfer Armada ke §Y[SWE.GetName]§!"
 SWE_nordljus: "Bangun Nordljus"
 SWE_nordljus_desc: "Angkatan Laut kita tidak dapat bersaing dengan kekuatan lain di Baltik dan diperlukan kapal baru untuk melawan musuh terberat. Proyek sebesar itu akan berdampak negatif terhadap perekonomian Nordik, namun terkadang sesederhana ini:\n\nKekuatan harus diimbangi dengan kekuatan"
 SWE_nordljus_tt: "Setiap §Yanggota dewan pertahanan Nordik§! memperoleh:"
 SWE_nordljus_tt_2: "Jalur produksi akan dimulai pada §Y60%§! penyelesaian"
 SWE_centralized_military_aid: "Industri Militer Terpusat"
 SWE_centralized_military_aid_desc: "Kita perlu melakukan perbaikan pada kemampuan militer kita dan negara-negara anggota. Berinvestasi dalam produksi senjata akan memberi tentara kita alat untuk mempertahankan perbatasan kita."
 SWE_centralized_military_aid_tt: "Setiap §YAnggota dewan pertahanan Nordik§! memperoleh:\nTambahkan §G1§! Slot Bangunan\nTambahkan §G1§! §YPabrik Militer§!"
 SWE_merge_army_complexes: "Gabungkan Kompleks Tentara"
 SWE_merge_army_complexes_desc: "Akan lebih efisien jika kita memusatkan kompleks militer kita. Membiarkan mereka berada di negara-negara anggota kami berisiko kehilangan mereka jika terjadi invasi."
 SWE_merge_army_complexes_tt: "Setiap §Yanggota dewan pertahanan Nordik§!: §R-1§! §YPabrik Militer§!\n(§Y[SWE.GetName]§!) §G+1§! §YMiliter Pabrik§! untuk setiap §Yanggota dewan pertahanan Nordik§!"
 SWE_nordic_centralized_air_command: "Komando Udara Terpusat Nordik"
 SWE_nordic_research_exchange: "Pertukaran Penelitian Nordik"
 SWE_nordic_research_exchange_desc: "Bangsa Nordik semuanya maju secara teknologi, dan sayang sekali jika kita tidak berbagi kemajuan kita satu sama lain."
 SWE_nordic_protection_complex: "Kompleks Pertahanan Nordik"
 SWE_nordic_protection_complex_desc: "Kami di negara-negara Nordik menginginkan perdamaian. Satu-satunya hal yang benar-benar kami inginkan adalah hak dasar untuk hidup di Utara, menjadi tua di Utara, dan dimakamkan di Utara. Jika ada yang mencoba mengambilnya dari kita, mereka akan dikuburkan di sini juga."
 SWE_nordic_protection_complex_tt: "Setiap §YAnggota dewan pertahanan Nordik§! memperoleh:\nTambahkan §G1§! Slot Bangunan\nTambahkan §G1§! §YPabrik Sipil§!"
 SWE_decentralized_nordic_volunteer_group: "Kelompok Relawan Nordik"
 SWE_decentralized_nordic_volunteer_group_tt: "Dapatkan §G+5000§! Tenaga kerja untuk setiap §YAnggota dewan pertahanan Nordik§!\nSetiap §YAnggota dewan pertahanan Nordik§!: §G+5000§! Tenaga kerja untuk setiap §YDewan pertahanan Nordik anggota§!"
 SWE_decentralized_nordic_volunteer_group_desc: "Ada banyak orang yang cakap di seluruh wilayah Nordik; pemburu, penembak jitu dan sejenisnya, yang bisa bertugas di tentara. Kita perlu menemukan mereka dan mewajibkan mereka."
 SWE_nordic_centralized_air_command_desc: "Pertahanan udara telah menjadi bagian penting dalam peperangan modern, namun mengikuti kemajuan teknologi membutuhkan biaya yang mahal. Untuk menekan biaya sambil mempertahankan pertahanan yang kuat, kita harus membentuk gabungan Komando Udara Nordik."
 SWE_nordic_centralized_air_command_tt: "Setiap §YAnggota dewan pertahanan Nordik§! jenis subjek:\nTransfer angkatan udara ke §Y[SWE.GetName]§!"
 SWE_train_the_sheltered: "Latih yang Terlindung"
 SWE_train_the_sheltered_desc: "Konflik di wilayah kami telah menyebabkan banyak tetangga Nordik kami berlindung di sini di [SWE.GetName]. Banyak di antara mereka yang sudah cukup umur untuk berjuang dan dapat dipanggil untuk membantu pertahanan negara."
 SWE_the_narvik_solution: "Solusi Narvik"
 SWE_the_narvik_solution_desc: "Narvik sangat penting dalam pengiriman bijih besi kita, oleh karena itu Narvik telah menjadi sasaran negara-negara yang berperang dengan harapan dapat mengamankan atau mengganggu pengiriman tersebut. Untuk menjaga netralitas dan ekspor kita, kita harus mengurangi ketegangan di kawasan dengan mengambil alih kendali Narvik atas nama [NOR.GetName]."
 SWE_icelandic_independence: "Kemerdekaan Islandia"
 SWE_icelandic_independence_desc: "TODO"
 SWE_cement_control_of_the_baltic: "Kontrol Semen di Laut Baltik"
 SWE_cement_control_of_the_baltic_desc: "Jika kita membangun dan memproyeksikan kekuatan angkatan laut kita di Laut Baltik, kita dapat memastikan bahwa perang tidak akan pernah sampai ke pantai negara Nordik mana pun."
 SWE_seek_foreign_guarantees: "Carilah Jaminan Luar Negeri"
 SWE_seek_foreign_guarantees_desc: "TODO"
 SWE_ga_pa_tactics: "Taktik Kejutan Gå-på"
 SWE_ga_pa_tactics_desc: "[SWE.GetName] pernah memelopori penggunaan pasukan dengan mobilitas tinggi di medan perang, jauh sebelum munculnya tank. Sudah waktunya kita menghidupkan kembali semangat inovatif dan mengembangkan bentuk blitzkrieg kita sendiri."
 SWE_winter_drill: "Latihan Musim Dingin"
 SWE_winter_drill_tt: "§G-25%§! biaya untuk §YLast Stand§!"
 SWE_winter_drill_desc: "Dengan melatih pasukan kita secara menyeluruh untuk memahami medan [SWE.GetAdjective] dan bagaimana memanfaatkan cuaca, mereka dapat memperoleh keunggulan melawan pasukan musuh yang jauh lebih besar dari mereka."
 SWE_research_slot_1: "[AAT_Sweden_royal_institute_name]"
 SWE_research_slot_1_desc: "Memperluas keahlian ilmiah dan teknik negara ini akan sangat penting dalam mempertahankan militer yang modern dan cakap. Untuk melakukan hal tersebut, kami akan berinvestasi dalam perluasan [AAT_Sweden_royal_institute_name]."
 SWE_RIT_communist: "Institut Teknologi"
 SWE_RIT_historical: "Institut Teknologi Kerajaan"
 SWE_infrastructure: "Investasi Infrastruktur"
 SWE_infrastructure_desc: "Sebagian besar [SWE.GetName] masih berada di pedesaan dan sangat terbelakang. Kita harus memperbaiki hal ini untuk memanfaatkan sumber daya alam kita dengan lebih baik."
 SWE_varnplikt: "Sangat bagus"
 SWE_varnplikt_desc: "Mengandalkan pasukan profesional dalam jumlah kecil tidak akan cukup untuk mempertahankan kedaulatan kita dari negara-negara tetangga yang lebih agresif. Oleh karena itu kami akan menerapkan sistem dinas militer untuk memastikan semua laki-laki dalam usia tempur mendapatkan setidaknya beberapa pelatihan militer."
 SWE_per_albin_bus: "[SWE.GetLeader] Bis"
 SWE_per_albin_bus_desc: "Dengan begitu banyaknya daya tembak yang dimiliki musuh-musuh kita, ada kemungkinan bahwa pemerintah bisa dipenggal oleh serangan udara atau invasi. Untuk mencegah skenario seperti itu, kita memerlukan kantor pusat pemerintah yang dapat berpindah-pindah yang dapat menjaga kontak dengan angkatan bersenjata dan masyarakat selama krisis."
 SWE_per_albin_bus_tt: "Membuat unit markas Mobile yang memungkinkan pemimpin kami untuk mengungsi. Namun jika bus itu dihancurkan, itu bukan pertanda baik bagi Perdana Menteri kita."
 SWE_land_air_warfare: "Perang Darat - Udara"
 SWE_land_air_warfare_desc: "Meskipun setiap cabang angkatan bersenjata memerlukan pelatihan dan peralatan khusus masing-masing, mereka paling efektif di medan perang ketika mereka bekerja sama untuk mengalahkan musuh di darat dan dari udara secara bersamaan."
 SWE_totalforsvar: "Totalforsvar"
 SWE_totalforsvar_desc: "Seperti yang kami duga, konflik-konflik yang terjadi akhir-akhir ini pasti berubah menjadi perang total. Oleh karena itu, kita perlu mengalihkan perekonomian ke produksi perang untuk memasok peralatan yang dibutuhkan pasukan kita untuk membela negara."
 SWE_totalforsvar_tt: "Penyandang disabilitas mendemobilisasi misi perekonomian kita"
 SWE_jagartrupper: "Jagatrupper"
 SWE_jagartrupper_tt: "Memungkinkan kemampuan untuk mengirim penjaga elit untuk menyabotase pelabuhan musuh dan pusat pasokan ke negara-negara yang dikontrol di dekatnya dengan mengorbankan §YTenaga Kerja§!\nPemimpin Angkatan Darat tanpa sifat medan yang ada memperoleh sifat §YRanger§!"
 SWE_jagartrupper_desc: "Saat menghadapi kekuatan yang jumlahnya lebih banyak, kita perlu menyamakan kedudukan dengan membatasi pergerakan atau akses mereka terhadap perbekalan. Dengan menggunakan tim komando kecil, kita dapat menyusup ke garis musuh dan menyabotase infrastruktur mereka di lokasi-lokasi penting."
 SWE_hedgehog_defense: "Pertahanan Landak"
 SWE_hedgehog_defense_desc: "Kita dapat meningkatkan efektivitas operasi pertahanan kita yang mendalam dengan memanfaatkan taktik ‘landak’ yang terdiri dari sekelompok kecil pasukan dalam posisi bertahan yang dapat dilewati oleh musuh. Namun, menahan kantong akan menguras momentum musuh dan membuat mereka rentan terhadap serangan balik."
 SWE_a_plea_of_desperation: "Permohonan Keputusasaan"
 SWE_a_plea_of_desperation_desc: "Dikelilingi oleh banyak pihak yang bermusuhan yang ingin melihat kedaulatan kita dihapuskan, kita tidak punya pilihan selain mencari sekutu potensial jika kita ingin selamat dari serangan gencar yang akan datang."
 SWE_rapid_response_force: "Pasukan Respon Cepat"
 SWE_rapid_response_force_desc: "Dengan mempertahankan kekuatan respon cepat kendaraan lapis baja yang dapat dengan cepat dikerahkan ke seluruh lini depan jika diperlukan, kita dapat memperoleh keunggulan tank tanpa perlu mendukung tank dalam jumlah besar."
 SWE_hemvarnet: "Hemvärnet"
 SWE_hemvarnet_tt: "Memungkinkan pengaturan sel Home Guard yang dapat diaktifkan sebagai unit darurat jika terjadi perang"
 SWE_hemvarnet_desc: "Ada ribuan sukarelawan yang bersedia diperlengkapi dengan peralatan militer yang lebih tua untuk mempertahankan lokasi strategis di wilayah mereka. Hal ini akan sangat membantu dalam mencegah tentara melakukan upaya berlebihan dalam upaya membela negara sekaligus."
 SWE_lottakaren: "Lottakåren"
 SWE_lottakaren_desc: "Perempuan [SWE.GetName] sama-sama rela membela negara seperti halnya laki-laki. Dengan mendanai sebuah organisasi untuk merekrut dan melatih perempuan dalam tugas-tugas non-garis depan, kita dapat menambah angkatan bersenjata dan meningkatkan kemampuan pertahanan kita."
 SWE_rapid_mobilization: "Mobilisasi Cepat"
 SWE_rapid_mobilization_desc: "Seluruh bangsa menahan nafas karena ketakutan akan invasi. Karena tindakan baru-baru ini di luar negeri, tidak ada keraguan lagi, kita harus mengerahkan angkatan bersenjata sepenuhnya untuk mempertahankan kedaulatan kita."
 SWE_rapid_mobilization_tt: "Mengizinkan peningkatan undang-undang wajib militer hingga §YLayanan berdasarkan Persyaratan§! meskipun merupakan negara demokrasi"
 SWE_secret_mobilization: "Mobilisasi Rahasia"
 SWE_secret_mobilization_desc: "Jika kita bergerak terlalu cepat dalam memobilisasi kekuatan kita, kita mungkin akan membuat musuh kita waspada dan memicu invasi yang sebenarnya kita coba pertahankan. Oleh karena itu, kita harus bertindak hati-hati agar tidak menimbulkan kecurigaan."
 SWE_tank_development: "Pengembangan Tangki"
 SWE_tank_development_desc: "Meskipun kita tidak bisa mengerahkan kendaraan lapis baja dalam jumlah besar seperti yang bisa dilakukan negara lain, kita bisa lebih efisien dalam merancang dan memproduksi kendaraan tersebut."
 SWE_per_albin_line: "[SWE.GetLeader] Garis"
 SWE_per_albin_line_tt: "Menambahkan benteng di area pertahanan utama di sekitar Malmö dan selatnya, lebih jauh ke pedalaman di titik-titik sempit di sekitar danau Vänern dan Vättern, serta di Gotland dan Stockholm"
 SWE_per_albin_line_desc: "Garis pantai [SWE.GetName] sangat luas dan sebagian besar tidak terlindungi. Untuk mencegah musuh mendaratkan pasukan invasi di pantai kita, kita perlu membuat garis pertahanan di sepanjang pantai yang mampu memukul mundur mereka kembali ke Baltik."
 SWE_swedish_shooting_movement: "Gerakan Menembak Swedia"
 SWE_swedish_shooting_movement_desc: "Selama hampir satu abad, Gerakan Menembak [SWE.GetAdjective] telah menyelenggarakan lapangan tembak dan kompetisi untuk meningkatkan kemahiran penduduk sipil dalam menembak dan keinginan mereka untuk berperang jika diperlukan. Mengingat situasi penuh gejolak yang kita alami saat ini, mungkin kita harus berinvestasi pada organisasi."
 SWE_swedish_shooting_movement_tt: "Tenaga kerja: §G+400§! untuk setiap level Hemvärnet\n§Y+100§! unit $SWE_infantry_equipment_0$ ditambahkan ke persediaan nasional untuk setiap level Hemvärnet\nMeningkatkan pengalaman awal divisi Hemvärn yang dikerahkan ke §Y30%§! dari §Y10%§!\nMeningkatkan faktor peralatan awal divisi Hemvärn yang dikerahkan menjadi §Y90%§! dari §Y60%§!\nMeningkatkan permulaan faktor tenaga kerja dari divisi Hemvärn yang dikerahkan ke §Y90%§! dari §Y70%§!"
 SWE_mobilization_of_society: "Mobilisasi Masyarakat"
 SWE_mobilization_of_society_desc: "Mulai dari buruh pabrik hingga menteri kabinet harus rela berkorban demi bela negara. Apakah itu berarti memprioritaskan kembali sumber daya untuk produksi perang atau mengangkat senjata, kami akan melakukan apa pun untuk memastikan [SWE.GetName] bertahan."
 SWE_end_the_fubkrieg: "Taktik Modern, Peperangan Modern"
 SWE_end_the_fubkrieg_desc: "Perang telah berubah dengan cepat dalam beberapa tahun terakhir dan kita tidak bisa membiarkan seluruh upaya kita sia-sia karena militer sedang bersiap menghadapi konflik kemarin. Memastikan mereka menggunakan taktik terkini akan sangat penting dalam membela negara."
 SWE_let_fly_all_guns: "Ayo Terbang, Semua Senjata"
 SWE_let_fly_all_guns_desc: "Meskipun kita tidak memiliki industri yang sama besarnya dengan negara lain, kita memiliki beberapa produsen senjata yang paling mahir. Dengan investasi ekstra, kita dapat sepenuhnya memanfaatkan bakat mereka untuk memberikan keunggulan teknologi pada pasukan kita di medan perang."
 SWE_operation_save_denmark: "Operasi: Selamatkan Denmark"
 SWE_operation_save_denmark_desc: "Kami mungkin memiliki perbedaan pendapat selama berabad-abad dengan [DEN.GetName], namun kami tetap bersatu dengan rakyatnya saat ini dan siap untuk membebaskan mereka dari tirani."
 SWE_operation_save_norway: "Operasi: Selamatkan Norwegia"
 SWE_operation_save_norway_desc: "[NOR.GetName] dan [SWE.GetName] memiliki sejarah yang saling terkait sejak berabad-abad yang lalu. Melihat rakyatnya terjebak di bawah pengaruh kekuatan asing adalah hal yang tidak dapat diterima dan kita harus membuat rencana untuk membebaskan mereka ketika ada kesempatan."
 SWE_nordic_liberation_movement: "Gerakan pembebasan Nordik"
 SWE_nordic_liberation_movement_desc: "TODO"
 SWE_central_nordic_army_command: "Komando Angkatan Darat Nordik Terpusat"
 SWE_central_nordic_army_command_desc: "Dengan memusatkan pasukan anggota dewan Pertahanan Nordik, kita dapat memanfaatkan kekuatan kita secara lebih efisien sebagai satu kesatuan yang kohesif."
 SWE_central_nordic_army_command_tt: "Memindahkan tentara dan jenderal dari setiap §Yanggota dewan pertahanan Nordik§! ke [SWE.GetName].\nSetiap §Yanggota dewan pertahanan Nordik§! kecuali §Y[SWE.GetName]§! memperoleh:"
 SWE_central_nordic_army_command_tt_2: "Mereka akan lebih mungkin menerima jika:\n-Mereka mempunyai §YPendapat yang tinggi terhadap kita§!\n-Kita mempunyai §Ytentara§! yang lebih kuat dari mereka\n-Kita mempunyai §Ytipe pemerintahan§! yang sama dengan mereka\n-Kita §Yjaminan§! mereka"
 SWE_decentralized_nordic_army_command: "Komando Angkatan Darat Nordik yang Terdesentralisasi"
 SWE_decentralized_nordic_army_command_desc: "Memusatkan komando militer di Dewan Pertahanan Nordik akan menyebabkan terlalu banyak konflik kepentingan bagi para perwira komandan. Satu-satunya jaminan bagi keamanan nasional masing-masing negara anggota adalah mempertahankan kendali atas pasukan mereka sendiri."
 SWE_decentralized_nordic_army_command_tt: "Setiap §Yanggota dewan pertahanan Nordik§! memperoleh: §YWajib Militer Ekstensif§!.\nSetiap §Yanggota dewan pertahanan Nordik§! memperoleh:"
 SWE_decentralized_nordic_army_command_tt_2: "Setiap §Yanggota dewan pertahanan Nordik§!:"
 SWE_neither_death_nor_dishonor: "Baik Kematian maupun Aib"
 SWE_neither_death_nor_dishonor_tt: "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+4%§!\n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+4%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+4%§! untuk setiap negara Nordik di faksi yang sama dengan §Y[SWE.GetName]§! atau untuk setiap §Y$autonomy_aat_defense_council_member$§!"
 SWE_neither_death_nor_dishonor_desc: "Bangsa Nordik berada di jurang yang terjal. Serigala Jerman melolong di Barat. Di wilayah Timur, kaum Bolshevik sedang menunggu waktu, siap untuk menancapkan belati merahnya jauh ke dalam jantung negara kita. Pena kita harus menjadi pedang, kelicikan kita harus menjadi senjata kita.\nKami tidak akan memilih antara dua keburukan, tidak akan ada kematian dan aib."
 SWE_prevent_a_red_dictatorship: "Cegah Kediktatoran Merah"
 SWE_prevent_a_red_dictatorship_desc: "Partai Sosial Demokrat tidak lebih dari kuda trojan bagi komunis. Jika kita ingin mencegah Swedia jatuh ke dalam pengaruh Soviet, kita harus memastikan bahwa para pemilih menempatkan partai-partai nasionalis dalam kendali Riksdag. Menggunakan segala cara yang diperlukan."
 SWE_defense_in_depth: "Pertahanan secara Mendalam"
 SWE_defense_in_depth_desc: "Tidak ada kekuatan musuh yang mempunyai momentum yang tidak terbatas, sebagian besar disebabkan oleh keterbatasan jalur pasokan dan keterbatasan fisik dan mental prajurit. Dengan demikian, bentuk pertahanan yang lebih kuat tidak didasarkan pada garis depan kaku yang akan runtuh ketika ditembus, namun pada lapisan pertahanan yang semakin merampas momentum musuh."
 SWE_beneath_sticks_and_stones: "Di Bawah Tongkat dan Batu"
 SWE_beneath_sticks_and_stones_desc: "Pesawat musuh kehilangan banyak efektivitasnya jika tidak dapat melihat targetnya di medan perang. Dengan melatih pasukan kita dalam penggunaan teknik kamuflase, kita dapat menghilangkan keuntungan penting ini dari musuh."
 SWE_norma_projektilfabrik: "Norma Projektilfabrik"
 SWE_norma_projektilfabrik_desc: "Norma Projektilfabrik telah memproduksi amunisi dalam [SWE.GetName] dan [NOR.GetName] sejak abad terakhir. Memperluas kemampuan manufaktur mereka akan sangat membantu dalam menjaga pasokan amunisi untuk angkatan bersenjata kita."
 SWE_norma_projektilfabrik_tt: "Tambahkan §G1§! ekstra §YPabrik Militer§! jika selesai sementara §Y[NOR.GetNameDef]§!:\nMemiliki Perang dengan negara besar\nMemiliki lebih dari 0% penyerahan kemajuan\n§Y[SWE.GetNameDef]§!: Tidak berperang dengan §YNorwegia§!"
 SWE_government_weapons_contract: "Kontrak Senjata Pemerintah"
 SWE_allow_landsverk_to_operate: "Izinkan Landsverk Beroperasi Secara Independen"
 SWE_allow_landsverk_to_operate_tt: "§RBerperang dengan [GER.GetNameDef] akan memungkinkan [GER.GetAdjective] pekerja di Landsverk untuk sementara waktu merusak 2 pabrik Landsverk di Swedia§!"
 SWE_government_weapons_contract_desc: "Ada banyak perusahaan di [SWE.GetName] yang memiliki keahlian dalam pembuatan senjata. Jika kita ingin bersiap menghadapi perang total, kita perlu merangsang ekspansi perusahaan-perusahaan ini melalui kontrak peralatan militer."
 SWE_bofors_fly_swatter: "Pemukul Lalat Bofors"
 SWE_bofors_fly_swatter_desc: "Bofors berpotensi menetapkan standar baru untuk teknologi antipesawat. Kita harus memberi mereka sumber daya untuk melakukan hal tersebut dan memastikan bahwa langit Swedia tetap bersih dari pesawat musuh."
 SWE_husqvarna_vapenfabrik: "Pabrik Senjata Husqvarna"
 SWE_husqvarna_vapenfabrik_desc: "Husqvarna memiliki sejarah panjang dalam pembuatan peralatan senjata kecil untuk militer [SWE.GetAdjective]. Sudah saatnya kita memperluas basis industri mereka dan memanfaatkan keahlian mereka untuk memodernisasi angkatan bersenjata."
 SWE_work_projects_for_the_unemployed: "Proyek Kerja untuk Pengangguran"
 SWE_work_projects_for_the_unemployed_desc: "Masyarakat yang mampu bekerja namun tidak mendapatkan pekerjaan merupakan penggerak radikalisme. Jika kita ingin menghindari masyarakat menentang pemerintah, kita perlu menciptakan proyek lapangan kerja bagi para pengangguran."
 SWE_bofors_anti_tank_gun: "Senjata Anti-Tank Bofors"
 SWE_bofors_anti_tank_gun_tt: "Mengaktifkan §HBofors Senapan Anti Tank§!\nMendukung Serangan Keras Anti-Tank: §G+10%§!\nMendukung Penusuk Anti-Tank: §G+10%§!\nSerangan Keras Anti-Tank: §G+10%§!\nPenusuk Anti-Tank: §G+10%§!\nAnti-Tank Bermotor Serangan keras: §G+10%§!\nPenusuk Anti-Tank Bermotor: §G+10%§!\nPenghancur Tank Ringan Serangan keras: §G+10%§!\nPenghancur Tank Ringan Penusuk: §G+10%§!\nPenghancur Tank Sedang Serangan keras: §G+10%§!\nPenusuk Penghancur Tank Sedang: §G+10%§!\nPenghancur Tank Berat Serangan keras: §G+10%§!\nPenusuk Penghancur Tank Berat: §G+10%§!\nPenghancur Tank Super Berat Serangan keras: §G+10%§!\nPenghancur Tank Super Berat Menusuk: §G+10%§!\nTanker Penghancur Modern Serangan keras: §G+10%§!\nTindik Penghancur Tank Modern: §G+10%§!"
 SWE_bofors_anti_tank_gun_desc: "Keahlian Bofors dalam menciptakan senjata terbukti sangat diperlukan. Dengan sejumlah investasi, mereka dapat menciptakan senjata anti-tank generasi baru untuk menghadapi kendaraan lapis baja terbaik yang mungkin dilempar musuh ke arah kita."
 SWE_landverk_l_62: "Landsverk L-62"
 SWE_landverk_l_62_desc: "Dengan memanfaatkan kesuksesan desain tank Landverk dan senjata antipesawat Bofors, kita dapat menciptakan platform antiudara bergerak kelas dunia yang mampu mengimbangi manuver tercepat sekalipun."
 SWE_form_saab: "Bentuk SAAB"
 SWE_form_saab_desc: "Ada sejumlah produsen pesawat terbang di [SWE.GetName] yang bersaing untuk mendapatkan kontrak pemerintah yang menguntungkan. Dengan menggabungkan ketiganya, kita dapat memanfaatkan keahlian kolektif dari semuanya dengan cara yang hemat biaya."
 SWE_domestic_designs: "Desain Pesawat Domestik"
 SWE_domestic_designs_desc: "Dengan selesainya pembentukan SAAB, kita harus memanfaatkan keahlian desain dan teknik mereka untuk menciptakan pesawat yang memenuhi persyaratan spesifik angkatan udara [SWE.GetAdjective]."
 SWE_foreign_designs: "Pelajari Desain Pesawat Asing"
 SWE_foreign_designs_desc: "Kita tidak boleh membuang waktu untuk menemukan kembali apa yang sudah dimiliki negara lain. Keahlian SAAB dapat dimanfaatkan dengan lebih baik dengan mengadaptasi dan memproduksi desain yang mendapat lisensi dari luar negeri."
 SWE_foreign_designs_tt: "Dapatkan §Y1x§! §G35%§! Bonus Penelitian untuk §YPesawat§! untuk setiap negara besar yang sesuai dengan ideologi kita yang tidak sedang kita perangi"
 SWE_formation_flying: "Formasi Terbang"
 SWE_formation_flying_desc: "Mempertahankan pertahanan udara yang kuat memerlukan kelompok pejuang yang terorganisir dengan baik agar mampu dengan cepat merespons potensi ancaman."
 SWE_marauder_bombers: "Pembom Perampok"
 SWE_marauder_bombers_desc: "Pengalaman baru-baru ini menunjukkan bahwa kemampuan menghancurkan target darat dari udara seringkali menjadi faktor penentu dalam pertempuran. Hal ini bahkan mungkin terbukti menjadi cara untuk mengakhiri perang sepenuhnya."
 SWE_airforce_modernization: "Modernisasi Angkatan Udara"
 SWE_airforce_modernization_desc: "Memastikan angkatan udara kita memiliki peralatan terkini tidak ada artinya jika mereka tidak mampu memanfaatkannya sepenuhnya. Kita harus memastikan bahwa pengalaman pilot kita baru-baru ini dimasukkan ke dalam doktrin udara kita."
 SWE_the_barrel: "Barel"
 SWE_the_barrel_desc: "Konflik yang terjadi akhir-akhir ini telah mempercepat perkembangan teknologi di bidang penerbangan. Oleh karena itu, kita perlu mengimbangi potensi musuh kita dan mengembangkan pesawat berbasis jet kita sendiri untuk melindungi langit kita."
 SWE_rockets: "raket melayang"
 SWE_rockets_desc: "Meskipun pesawat bertenaga jet sangat mengesankan, teknologi roket menawarkan kita kemampuan untuk membuat senjata sekali pakai dengan kecepatan dan jangkauan yang jauh lebih besar tanpa memerlukan pelatihan pilot yang mahal."
 SWE_radiojanst: "Radiotjänst"
 SWE_radiojanst_desc: "Radiotjänst telah terbukti populer di kalangan masyarakat, menawarkan siaran acara budaya dan berita setiap hari. Dengan memperluas lembaga penyiaran, kita dapat meningkatkan jenis program yang diproduksi sambil mempertahankan masyarakat yang mendapat informasi yang baik."
 SWE_urbanization: "Urbanisasi"
 SWE_urbanization_tt: "Membuka keputusan untuk menggunakan §YKekuatan politik§! untuk memperoleh §YPabrik Sipil§! dan §YGalangan Kapal Angkatan Laut§!"
 SWE_urbanization_desc: "Industrialisasi dan urbanisasi berjalan beriringan. Semakin banyak pekerjaan yang dapat ditemukan di kota, semakin banyak pula orang dari pedesaan yang pindah ke kota. Jika kita ingin kota-kota tidak menjadi daerah kumuh yang penuh sesak, kita perlu berinvestasi pada infrastrukturnya dan mempersiapkan diri menghadapi pertumbuhan populasi di masa depan."
 SWE_hygenic_housing: "Perumahan Higienis"
 SWE_hygenic_housing_tt: "§YKebijakan perumahan yang higienis akan mulai menyebar ke luar Södermanland seiring berjalannya waktu dengan satu negara bagian inti baru yang mendapatkan pengubahnya setiap dua bulan§!"
 SWE_hygenic_housing_desc: "Masih banyak masyarakat yang tinggal di daerah kumuh yang padat penduduk dan tidak layak huni. Kita perlu membersihkan keadaan dan memastikan setiap orang memiliki akses terhadap perumahan yang higienis dan fungsional."
 SWE_vasa_ii: "[SWE_vasa_ii_loc]"
 SWE_vasa_ii_desc: "Sudah saatnya kita membangun penerus Vasa yang legendaris. Mudah-mudahan kali ini ia mendapat kesempatan untuk membuktikan dirinya dalam pertarungan."
 SWE_vasa_ii_communist: "Rod Orkan"
 SWE_vasa_ii_default: "Vasa II"
 SWE_coastal_support: "Dukungan Pesisir"
 SWE_coastal_support_desc: "Angkatan Laut kita harus dilatih secara menyeluruh dalam penggunaan senjata mereka untuk mendukung serangan amfibi di pantai negara musuh."
 SWE_all_cards_on_deck: "Semua Kartu di Dek"
 SWE_all_cards_on_deck_desc: "Pertempuran yang berkepanjangan di seberang lautan tidak banyak mengubah jalannya perang. Ketika angkatan laut kita berlayar, tujuannya adalah untuk menghancurkan musuh dalam satu pukulan yang menentukan."
 SWE_decisive_battle_tactics: "Taktik pertempuran yang menentukan"
 SWE_seize_landsverk: "Rebut Landsverk"
 SWE_kp_bill: "Bil KP Mekanis"
 SWE_kp_bill_desc: "Perkembangan terkini di medan perang telah menunjukkan perlunya pengerahan kembali pasukan secara cepat jika diperlukan. Sejauh ini kita telah menggunakan truk sipil yang disesuaikan untuk melakukan tugas tersebut, namun transportasi lapis baja yang dibuat khusus akan jauh lebih efektif dalam pertempuran."
 SWE_lynx_winter_armored_cars: "Mobil Lapis Baja Lynx"
 SWE_lynx_winter_armored_cars_desc: "Jika perang terjadi pada [SWE.GetName], mobilitas akan menjadi penting bagi pertahanan kita. Mengembangkan mobil lapis baja yang modern dan dibuat khusus akan memberi pasukan kita alat penting untuk mengintai dan menyerang sasaran empuk di medan perang."
 SWE_lynx_armored_car_tt: "Mengaktifkan §YLynx mobil lapis baja§! yang menghasilkan:\n§YMobil Lapis Baja§! dan §Y$armored_car_recon$§!:\nSerangan Keras: §G+10%§!\nMenusuk: §G+10%§!\nOrganisasi: §G+5§!\n\n§YMobil Lapis Baja§!:\n§YHutan:§!\nPerubahan Efektif Gerakan: §G+15%§!\nSerangan Perubahan Efektif: §G+20%§!\n§YGurun:§!\nPerubahan Efektif Gerakan: §R-40%§!\nPerubahan Efektif Serangan: §R-20%§!\n§YSalju:§!\nPerubahan Efektif Gerakan: §G+35%§!\nSerangan Perubahan efektif: §G+20%§!"
 SWE_lynx_armored_car_recon_company_tt: "§Y$armored_car_recon$§!:\n§YHutan:§!\nGerakan Perubahan Efektif: §G+5%§!\nSerangan Perubahan Efektif: §G+5%§!\n§YGurun:§!\nPerubahan Efektif Gerakan: §R-15%§!\nPerubahan Efektif Serangan: §R-15%§!\n§YSalju:§!\nGerakan Perubahan Efektif: §G+8%§!\nSerangan Perubahan efektif: §G+5%§!"
 SWE_standardize_equipment: "Standarisasi Peralatan"
 SWE_standardize_equipment_desc: "Sudah terlalu lama angkatan bersenjata kita beroperasi dengan senjata kecil yang tak terhitung jumlahnya, beberapa di antaranya berasal dari abad yang lalu. Hal ini membuat pasokan amunisi bagi pasukan menjadi sangat sulit dan rentan terhadap gangguan. Kita perlu memperbaikinya dengan melakukan standarisasi senjata dan amunisi kita."
 SWE_standardize_equipment_trigger_tt: "Lebih dari §Y13000§! peralatan infanteri di angkatan darat"
 SWE_individual_liberty_and_prosperity_for_all: "Pengurangan Kemiskinan"
 SWE_individual_liberty_and_prosperity_for_all_desc: "Jelas bahwa kita perlu berbuat lebih banyak untuk mengentaskan masyarakat dari kemiskinan. Namun, kita perlu secara hati-hati menyeimbangkan dukungan kita dengan kebutuhan untuk mempertahankan pertahanan nasional yang baik."
 SWE_defense_above_all: "Pertahanan Di Atas Segalanya"
 SWE_defense_above_all_desc: "Kita harus menghadapi kenyataan bahwa dunia berada pada jadwal yang berbeda dari kita, dan kita tidak bisa lagi mempertaruhkan masa depan negara kita tanpa kemampuan pertahanan apa pun."
 SWE_volvo: "volvo"
 SWE_volvo_desc: "Volvo telah membangun reputasi dalam memproduksi komponen dan kendaraan yang kokoh dan andal. Kita harus melanjutkan kesuksesan mereka dengan mengadaptasi desain truk dan mesin sipil mereka untuk aplikasi militer."
 SWE_allow_landsverk_to_operate_desc: "Landsverk telah lama beroperasi sebagai celah bagi militer [GER.GetAdjective] untuk menghindari pembatasan Perjanjian Versailles dalam mengembangkan kendaraan lapis baja. Kita harus terus mengizinkan mereka beroperasi sehingga kita dapat menjaga hubungan dekat dengan [GER.GetName] dan memanfaatkan perkembangan teknologi mereka."
 SWE_sieze_landsverk: "Rebut Landsverk"
 SWE_sieze_landsverk_desc: "Landsverk telah lama beroperasi sebagai celah bagi militer [GER.GetAdjective] untuk menghindari pembatasan perjanjian Versilles dalam pengembangan kendaraan lapis baja. Beberapa pihak di pemerintahan berpendapat bahwa kita perlu mengambil alih perusahaan tersebut untuk menjauhkan diri dari mesin perang [GER.GetAdjective]."
 SWE_saltsjobaden_agreement: "Terima Perjanjian Saltsjöbaden"
 SWE_saltsjobaden_agreement_desc: "Perbedaan pendapat antara pekerja dan pengusaha semakin tidak terkendali dan berisiko membuat negara ini bertekuk lutut. Kita perlu bersatu jika ingin mengatasi ancaman di perbatasan kita. Oleh karena itu, kita harus membuat kesepakatan untuk meminimalkan gangguan perselisihan perburuhan."
 SWE_reject_saltsjobaden: "Tolak Perjanjian Saltsjöbaden"
 SWE_reject_saltsjobaden_desc: "Perjanjian ini harus ditolak, hal ini akan menghilangkan hak-hak pengusaha untuk menjalankan usaha mereka sendiri sesuai keinginan mereka dan akan membatasi hak pekerja untuk menarik tenaga kerja ketika mereka merasa dirugikan. Tidak ada seorang pun yang mendapat manfaat dari pengaturan ini."
 SWE_ring_a_ding_ding: "Militer"
 SWE_ring_a_ding_ding_desc: "Sepeda mungkin tidak semenarik mobil lapis baja atau tank, namun sepeda menawarkan peningkatan mobilitas dengan biaya yang lebih murah."
 SWE_aquire_modern_panzers: "Dapatkan Panzer Modern"
 SWE_aquire_modern_panzers_desc: "Stagnasi teknologi telah terbukti menyebabkan negara-negara yang tampaknya paling kuat runtuh pada masa perang. Oleh karena itu, pengadaan kendaraan lapis baja modern untuk tentara merupakan prioritas jika kita sendiri ingin menghindari nasib seperti itu."
 SWE_military_academy: "Akademi Militer"
 SWE_military_academy_desc: "Cabang-cabang militer semuanya telah mengumpulkan banyak pengalaman dalam beberapa tahun terakhir. Dengan membangun sistem akademi militer, kita dapat memastikan pengetahuan mereka diwariskan dari generasi ke generasi."
 SWE_surface_raiders: "Perampok Permukaan"
 SWE_surface_raiders_desc: "Dengan sejumlah kapal kecil yang dibangun dengan cepat, kita dapat secara serius merusak upaya perang musuh dengan mengganggu pergerakan kapal dan pasukan mereka."
 SWE_rationing: "Penjatahan"
 SWE_rationing_desc: "Kami ingat betul perjuangan ekonomi yang ditimbulkan oleh Perang Besar terhadap orang-orang yang tidak bersalah di [SWE.GetName]. Kita perlu menghindari bencana serupa lagi dengan menerapkan sistem penjatahan makanan, bahan bakar, dan kebutuhan pokok lainnya."
 SWE_rationing_tt: "Membuka keputusan untuk memberlakukan kebijakan penjatahan dengan mengorbankan sejumlah kecil §YDukungan perang§!, §Ystabilitas§! atau §Ybarang konsumsi§!. Kebijakan yang mungkin untuk diberlakukan meliputi:"
 SWE_folkhemmet_modification_tt: "Memodifikasi §YFolkhemmet§! dengan:"
 SWE_education_reform: "Stadsbarn"
 SWE_research_slot_2: "Perluas Universitas Uppsala"
 SWE_research_slot_2_desc: "Universitas Uppsala adalah universitas tertua di kawasan Nordik, yang pernah menjadi tuan rumah bagi tokoh-tokoh terkenal seperti Anders Celcius, Carl Linnaeus, dan Jacob Berzelius. Ketika dunia terus berputar, jelaslah bahwa sains adalah senjata terhebat di dunia yang penuh ketidakpastian, dan berinvestasi di universitas prestisius seperti itu pasti akan sukses."
 SWE_education_reform_desc: "Buku Alva Myrdal 'Stadsbarn' menimbulkan kehebohan di kalangan pendidik mengenai peran negara dalam perkembangan anak. Alva dan suaminya Gunnar juga memicu perdebatan mengenai kebijakan sosial dalam buku terbaru mereka ‘Crisis in the Population.’ Mungkin kita harus membawa pasangan produktif ini ke dalam kabinet agar mereka dapat mengubah teori menjadi praktik."
 SWE_economic_deregulation: "Deregulasi Ekonomi"
 SWE_economic_deregulation_desc: "Kita tidak mampu mendukung pembelanjaan kesejahteraan yang berlebihan ini ketika negara sedang menghadapi ancaman nyata. Oleh karena itu, kita perlu mengambil keputusan anggaran yang tegas dan menghapus peraturan yang memberatkan sehingga sektor swasta dapat mengisi kesenjangan yang ditinggalkan oleh negara."
 SWE_economic_deregulation_tt: "Menghapus §YFolkhemmet§!"
 SWE_approach_the_allies: "Dekati Sekutu"
 SWE_approach_the_allies_desc: "[ENG.GetNameDefCap] dan sekutunya pada akhirnya akan keluar sebagai pemenang konflik apa pun di Eropa. Oleh karena itu, akan lebih bijaksana jika kita menjelaskan bahwa kita tidak berniat menjadi musuh mereka."
 SWE_join_allies_for_colonies: "Pertukaran Kepemilikan"
 SWE_join_allies_for_colonies_desc: "Dengan menguatnya hubungan antara kita dan Sekutu, kita mempunyai kesempatan untuk mendapatkan kembali wilayah bekas kolonial kita di seluruh dunia sebagai imbalan atas masuknya kita ke dalam koalisi militer mereka."
 SWE_universal_basic_income: "Pendapatan Dasar Universal"
 SWE_universal_basic_income_desc: "Setiap laki-laki dan perempuan harus dipastikan bahwa mereka dapat mempertahankan setidaknya penghidupan minimum, dan merupakan kewajiban negara untuk memperhatikan warga negaranya. Pendapatan dasar universal memecahkan keduanya."
 SWE_universal_basic_income_tt: "Negara bagian yang baru ditaklukkan dimulai dengan kepatuhan §G+25%§! dan resistensi §Y0%§!"
