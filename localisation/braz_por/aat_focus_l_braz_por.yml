l_braz_por:
 #Opinion modifiers
 #FINLAND
 FIN_suomalainen_sosialismi: "Suomalainen Sosialisme"
 FIN_suomalainen_sosialismi_desc: "Kesengsaraan kapitalisme terus merembes ke dalam masyarakat kita akibat kehancuran kontra-revolusioner yang dilakukan Mannerheim dan sekutunya selama perang saudara. Kita tidak bisa membiarkan hal ini terjadi, kita harus menemukan cara untuk membebaskan kelas pekerja."
 FIN_towards_a_red_government: "Menuju Pemerintahan Merah"
 FIN_towards_a_red_government_desc: "Ketika gelombang revolusi buruh melanda negara ini pada tahun 1918, kaum proletar dikhianati oleh kekuatan reaksioner Mannerheim dan sekutu Jermannya. Waktunya telah tiba untuk membalaskan dendam rekan-rekan kita yang gugur dan pada akhirnya menciptakan republik buruh seperti yang kita inginkan."
 FIN_the_second_finnish_civil_war: "Perang Saudara Finlandia Kedua"
 FIN_the_second_finnish_civil_war_desc: "Melalui perluasan kesadaran kelas di kalangan proletariat yang sedang tumbuh dan keterampilan organisasi dari kepemimpinannya, kita akhirnya mengumpulkan sumber daya untuk menggulingkan tuan borjuis kita untuk selamanya."
 FIN_the_peoples_democratic_league: "Liga Demokratik Rakyat"
 FIN_the_peoples_democratic_league_desc: "Liga Demokratik Rakyat berada di garis depan dalam mengoordinasikan berbagai faksi sayap kiri di [FIN.GetNameDef]. Mereka telah menciptakan fondasi aliansi buruh sejati yang dapat menjamin terwujudnya keinginan proletariat."
 FIN_cooperate_with_social_democrats: "Bekerja sama dengan Sosial Demokrat"
 FIN_cooperate_with_social_democrats_desc: "Meskipun kesediaan mereka untuk berkompromi dengan kaum kapitalis jelas salah, kita tidak dapat menyangkal bahwa Partai Sosial Demokrat mendapat banyak dukungan dari kaum proletar dan banyak pemimpin mereka yang ahli di bidangnya. Kita harus berbuat lebih banyak untuk bekerja sama dengan mereka dalam pembentukan republik buruh kita."
 FIN_the_workers_state: "Negara Pekerja"
 FIN_the_workers_state_desc: "Dengan kokohnya kediktatoran proletariat, kita kini dapat mulai membangun kembali bangsa dengan menempatkan kepentingan proletariat di garis depan politik. Segala sesuatu mulai dari cara kita mendidik anak-anak kita, hingga cara kita mengatur pabrik kita harus dirombak total."
 FIN_the_red_watch: "Jam Tangan Merah"
 FIN_the_red_watch_desc: "Ada orang-orang yang akan melemahkan semua yang telah kita ciptakan sejak perang saudara untuk menegakkan kembali tirani kapitalis. Dengan dibentuknya Pengawal Merah, kita dapat memastikan aktivitas berbahaya tersebut dibasmi sebelum menyebar ke seluruh republik kita."
 FIN_approach_the_soviets: "Dekati Soviet"
 FIN_approach_the_soviets_desc: "Kawan-kawan kita di [SOU.GetNameDef] berada di garis depan perjuangan proletar melawan imperialisme borjuis. Kita harus menjangkau kepemimpinan mereka dan mencoba mendapatkan dukungan untuk perjuangan kita melawan borjuasi di [FIN.GetNameDef]."
 FIN_antagonize_the_soviets: "Melawan Soviet"
 FIN_antagonize_the_soviets_desc: "[SOU.GetNameDefCap] mungkin dikemas dalam retorika sosialisme, namun ini bukanlah surga bagi pekerja. Kami akan menemukan jalan kami sendiri untuk memperbaiki kehidupan kelas pekerja dan tidak akan bekerja sama dengan ancaman [SOV.GetAdjective]."
 FIN_finno_soviet_pact: "Pakta Finno-Soviet"
 FIN_finno_soviet_pact_desc: "Terkutuklah keluhan-keluhan sejarah, rakyat [SOU.GetAdjective] telah terbukti menjadi sekutu yang bermanfaat dalam perjuangan sosialisme. Sudah waktunya kita meresmikan perjanjian antara pemerintah kita sebagai persiapan menghadapi serangan gencar reaksioner Eropa yang tak terelakkan."
 FIN_subsidized_national_industrialization: "Industrialisasi Nasional Bersubsidi"
 FIN_subsidized_national_industrialization_desc: "[SOU.GetNameDef] telah membuat kemajuan besar dalam mobilisasi massa tenaga produktif bangsa melalui industrialisasi. Mungkin kita harus meminta bantuan dari para ahli mereka untuk meluncurkan program serupa di Finlandia."
 FIN_finnish_learned_societies: "Masyarakat Terpelajar Finlandia"
 FIN_finnish_learned_societies_desc: "Meskipun banyak intelektual bangsa yang melarikan diri ke luar negeri, masih banyak orang yang memiliki kebijaksanaan untuk menganut pemikiran sosialis. Kita harus mengangkat para intelektual ini melalui investasi dalam penelitian mereka."
 FIN_finnish_federation_of_trade_unions: "Federasi Serikat Buruh Finlandia"
 FIN_finnish_federation_of_trade_unions_desc: "Serikat pekerja mewakili penguasa industri yang sesungguhnya, yaitu kaum buruh. Dengan bekerja sama dengan federasi serikat pekerja, kita dapat mengatur ulang seluruh perekonomian demi kemajuan kelas pekerja."
 FIN_defensive_preparations: "Persiapan Defensif"
 FIN_defensive_preparations_desc: "Terlepas dari ideologinya, tampaknya kita ditakdirkan untuk berkonflik dengan tetangga kita di sebelah timur. Kita harus bersiap menghadapi hal yang tak terhindarkan dan memperluas pertahanan kita dengan cepat. Jika kita gagal, negara kita mungkin akan diserang musuh lagi."
 FIN_trade_agreements: "Perjanjian Perdagangan"
 FIN_trade_agreements_desc: "Meskipun tidak selalu mendukung keputusan kebijakan dalam negeri kita, ada banyak negara yang bersedia membuat perjanjian perdagangan untuk mendukung modernisasi militer kita. Terutama agar kita dapat merusak keamanan tetangga kita yang kurang ramah."
 FIN_finno_estonian_union: "Persatuan Finno-Estonia"
 FIN_finno_estonian_union_desc: "Kita mempunyai sejarah yang panjang dengan rakyat Estonia, oleh karena itu sangat menyedihkan bagi kita melihat mereka terjebak di antara kekuatan-kekuatan besar yang menunggu tempat asal mereka menjadi medan pertempuran lain dalam perjuangan internasional. Mungkin melalui persatuan, kita bisa menyelamatkan mereka dari nasib buruk."
 FIN_social_democracy: "Sosial-Demokrasi"
 FIN_social_democracy_desc: "Kita telah melihat kegagalan dan kengerian yang terjadi ketika revolusi gaya Bolshevik melanda suatu negara. Jika kita ingin menciptakan masyarakat abadi yang menguntungkan kelas pekerja, hal ini harus dilakukan melalui cara-cara yang demokratis dan damai jika memungkinkan."
 FIN_pragmatic_socialism: "Sosialisme Pragmatis"
 FIN_pragmatic_socialism_desc: "Meskipun kami membenci metode Bolshevik dan sejenisnya, kami tidak membantah bahwa masih banyak yang harus dilakukan untuk membebaskan kelas pekerja dari kengerian kapitalisme modern. Melalui penerapan sosialisme yang demokratis dan pragmatis secara hati-hati, kita akan mencapai hal tersebut."
 FIN_sosialistinen_eduskuntaryhma: "Sosialistinen Eduskuntaryhmä"
 FIN_sosialistinen_eduskuntaryhma_desc: "Kelompok Parlemen Sosialis menganjurkan pemulihan hubungan dengan [SOU.GetNameDef] daripada antagonisasi. Saran-saran mereka mungkin memberikan harapan terbaik untuk mempertahankan bentuk sosialisme kita sendiri, tanpa campur tangan dari [SOU.GetAdjective]s."
 FIN_social_democratic_womens_union: "Kesatuan Wanita Sosial Demokrat"
 FIN_social_democratic_womens_union_desc: "Penderitaan perempuan dalam masyarakat telah diabaikan sejak dahulu kala. Dengan membawa Serikat Perempuan Sosial Demokrat lebih jauh ke dalam pemerintahan, kita pada akhirnya dapat mengatasi kekhawatiran mereka dan menciptakan masyarakat yang lebih adil bagi semua orang."
 FIN_mineral_wealth: "Kekayaan Mineral"
 FIN_mineral_wealth_desc: "[ROOT.GetNameDefCap] memiliki banyak sumber daya alam yang belum dimanfaatkan. Jika kita ingin mempertahankan kekuatan militer yang kredibel, kita harus memanfaatkan sumber daya ini dan meningkatkan swasembada ekonomi."
 FIN_funds_from_kalevala_koru_oy: "Dana Dari Kalevala Koru Oy"
 FIN_funds_from_kalevala_koru_oy_desc: "Kalevala Koru Oy, produsen perhiasan berkualitas, yang didirikan oleh anggota Serikat Perempuan Sosial Demokrat, meraih kesuksesan besar. Dengan memanfaatkan keahlian mereka, kita dapat meningkatkan perekonomian kita dan menggunakan kekayaannya untuk mendanai inisiatif lainnya."
 FIN_join_the_comintern: "Bergabunglah dengan [GetSovietFactionForFinland]"
 FIN_join_the_comintern_desc: "Kita harus menolak gagasan kuno tentang nasionalisme dan keluhan yang terkait dengannya dan bekerja sama dengan [SOU.GetNameDef]. Bersama-sama kita dapat membantu membalikkan keadaan melawan kekuatan reaksioner Eropa sekaligus mengamankan masa depan kita sendiri."
 FIN_finnish_influence_in_the_baltic: "Pengaruh Finlandia di Baltik"
 FIN_finnish_influence_in_the_baltic_desc: "Keamanan kolektif di kawasan Baltik bertumpu pada kesepahaman kita untuk berkolaborasi satu sama lain dan memastikan semua pihak mempertahankan pertahanan yang kredibel melawan kekuatan agresi. Oleh karena itu, kita harus memastikan bahwa semua negara tetangga kita bergerak ke arah yang sama."
 FIN_approach_major_democracies: "Pendekatan pada Negara-Negara Demokrasi Besar"
 FIN_approach_major_democracies_desc: "Kami mempunyai kepentingan yang sama dengan negara-negara demokrasi liberal di dunia yang ingin membatasi meluasnya pengaruh aktor-aktor yang lebih agresif dalam geo-politik. Mungkin kita bisa bekerja sama untuk mencapai tujuan bersama ini."
 FIN_finnish_autonomy: "Otonomi Finlandia"
 FIN_finnish_autonomy_desc: "Bahkan beberapa komunis yang paling berdedikasi di antara kita memendam kekhawatiran bahwa kerja sama dengan [SOU.GetNameDef] akan menyebabkan dominasi Rusia secara de facto dalam politik kita. Namun, melalui diplomasi yang hati-hati, kami telah mencapai tingkat pemahaman dengan sekutu kami yang menjamin otonomi kami."
 FIN_integrate_kola_and_karelia: "Integrasikan Kola dan Karelia"
 FIN_integrate_kola_and_karelia_desc: "Meskipun kami telah menjalin hubungan kerja sama yang kuat dengan kawan-kawan [SOU.GetAdjective] kami, perselisihan perbatasan membayanginya bagaikan awan hujan yang siap meledak. Mungkin kita harus menjernihkan permasalahan ini dan pada akhirnya mengatasi masalah ini sebagai sekutu, bukan sebagai musuh."
 FIN_keepers_of_the_baltic_countries: "Penjaga Negara Baltik"
 FIN_keepers_of_the_baltic_countries_desc: "Masyarakat Baltik kurang tertarik untuk dimasukkan ke dalam [GER.GetNameDef] atau [SOU.GetNameDef]. Kita sendiri, dengan sejarah dan pandangan yang sama, mampu memimpin negara-negara ini secara damai tanpa menghancurkan mereka."
 FIN_british_threat: "Ancaman Inggris"
 FIN_british_threat_desc: "[ENG.GetNameDefCap] adalah jantung perekonomian borjuis global dan sulur-sulur imperialisnya. Kita harus dengan penuh semangat menikamkan belati ke jantung tersebut sehingga dunia pada akhirnya bisa terbebas dari penindasannya."
 FIN_red_finland: "Finlandia Merah"
 FIN_red_finland_desc: "Kami telah membalaskan dendam kawan-kawan kami yang jatuh ke tangan Teror Putih melalui pembentukan republik buruh sejati. Kini yang tersisa hanyalah mengamankan apa yang telah kita capai dari pihak-pihak di luar perbatasan kita yang berupaya menghancurkannya."
 FIN_united_under_the_north_star: "Bersatu di Bawah Bintang Utara"
 FIN_united_under_the_north_star_desc: "Teman-teman dan kawan-kawan kita di wilayah Nordik berada di bawah kekuasaan kekuatan imperialis yang tidak peduli pada kepentingan wilayah kita. Namun bersama-sama, kita bisa menjamin perdamaian bagi rakyat kita melalui pembentukan aliansi yang dapat menghalangi kerajaan yang paling kuat sekalipun."
 FIN_preserve_sapmi: "Pertahankan Sápmi"
 FIN_preserve_sapmi_desc: "Masyarakat Sámi telah lama menderita akibat penindasan imperialis, baik di dalam maupun di luar negeri. Kita harus menebus kesalahan orang-orang ini dan membantu membebaskan mereka dari penderitaan yang terus menerus di tangan tetangga kita."
 #FIN_confederated_finno_russian_republics: "Confederated Finno-Russian Republics"
 FIN_confederated_finno_russian_republics_desc: "Banyak sekali orang yang berbeda kini berada di bawah pemerintahan kita. Untuk mencegah berkembangnya hierarki masyarakat di negara kita, kita akan mengatur ulang pemerintahan sebagai konfederasi republik. Hal ini akan memungkinkan semua orang mempunyai suara yang adil dalam pemerintahan mereka."
 FIN_secure_the_baltic_sea: "Amankan Laut Baltik"
 FIN_secure_the_baltic_sea_desc: "Meskipun kita sering kali fokus pada perbatasan darat dan cara terbaik untuk mempertahankannya, kita tidak boleh membiarkan upaya kita sia-sia karena mengabaikan kerentanan garis pantai kita. Oleh karena itu, kita harus berinvestasi dalam program pertahanan pantai secara besar-besaran untuk mengamankan sisi ini."
 FIN_german_threat: "Ancaman Jerman"
 FIN_german_threat_desc: "Militerisme Prusia sekali lagi muncul di [GER.Capital.GetCapitalVictoryPointName]. Sementara pihak lain puas melihat ibu kota Eropa berada di bawah kekuasaan [GER.GetLeader], namun kami tidak puas. Sudah saatnya ancaman terhadap perdamaian ini diatasi untuk selamanya."
 FIN_socialist_welfare: "Kesejahteraan Sosialis"
 FIN_socialist_welfare_desc: "Melalui pengelolaan ekonomi dan pertahanan negara yang cermat, kita kini memiliki sumber daya yang dapat memberikan penghargaan kepada para pekerja dengan terwujudnya negara kesejahteraan yang sejati. Kami akan memastikan masyarakat kami berumur panjang dan bahagia."
 FIN_aid_for_entrepreneurs: "Bantuan untuk Pengusaha"
 FIN_aid_for_entrepreneurs_desc: "Meskipun kita perlu membatasi unsur-unsur terburuk kapitalisme, perekonomian kita dapat memperoleh manfaat besar dari peningkatan aktivitas kewirausahaan. Dengan memberikan hibah dan pinjaman investasi untuk industri-industri penting, kita dapat merangsang kegiatan tersebut."
 FIN_soviet_threat: "Ancaman Soviet"
 FIN_soviet_threat_desc: "[SOU.GetNameDefCap], merupakan ancaman terhadap kehidupan kelas pekerja di seluruh dunia karena tidak ada keraguan untuk menjerumuskan mereka ke dalam perang penaklukan. Sebelum kekuatan mereka bertambah, kita harus mengakhiri ancamannya sekarang."
 FIN_proclaim_greater_finland: "Proklamasikan Federasi Finlandia Agung"
 FIN_proclaim_greater_finland_desc: "Perbatasan kita sekarang melampaui apa yang kita bayangkan beberapa tahun yang lalu. Dengan banyaknya wilayah baru, kita perlu melakukan reorganisasi pemerintahan agar lebih mencerminkan keberagaman wilayah yang dikuasainya."
 FIN_control_the_flux_of_iron_ore: "Mengontrol Fluks Bijih Besi"
 FIN_control_the_flux_of_iron_ore_desc: "Distribusi bijih besi di Swedia dan Norwegia terus menjadi mekanisme yang menyebabkan perang terjadi di seluruh benua dan sekitarnya. Kita harus mengambil kepemilikan atas aliran sumber daya yang kritis ini sebelum jatuh ke tangan musuh kita."
 FIN_finnish_neutrality: "Netralitas Finlandia"
 FIN_finnish_neutrality_desc: "Kekuatan dan tekad rakyat kita dalam memperjuangkan kebebasannya tidak bisa dihapuskan. Namun, kita harus menerapkan kebijakan netral sehingga negara-negara tetangga kita tidak mempunyai alasan untuk menghancurkan kemerdekaan yang telah kita peroleh dengan susah payah."
 FIN_the_finnish_swedish_peoples_party: "Partai Rakyat Swedia Finlandia"
 FIN_the_finnish_swedish_peoples_party_desc: "Orang-orang keturunan Swedia merupakan minoritas besar di Finlandia, sehingga berkolaborasi dengan partai yang paling mewakili kepentingan mereka mungkin dapat memberikan kita dukungan besar terhadap kebijakan kita dan memenangkan hati Swedia sendiri."
 FIN_align_the_agrarian_league: "Sejajarkan Liga Agraria"
 FIN_align_the_agrarian_league_desc: "[ROOT.GetNameDefCap] telah mengalami industrialisasi yang luar biasa selama satu abad terakhir, kita tidak dapat mengabaikan penderitaan jutaan orang yang memberi makan negara melalui buruh tani mereka. Dengan bekerja sama dengan Liga Agraria, kami dapat memastikan kekhawatiran mereka ditangani sama seperti rekan-rekan mereka di perkotaan."
 FIN_political_unity: "Persatuan Politik"
 FIN_political_unity_desc: "Terlepas dari ideologi politiknya, kita semua menginginkan yang terbaik bagi rakyat kita. Di masa krisis ini, kita harus mengesampingkan pertikaian politik kecil-kecilan dan bekerja sama."
 FIN_collaboration_with_the_left: "Kolaborasi dengan Kiri"
 FIN_collaboration_with_the_left_desc: "Keterasingan terhadap partai-partai berhaluan kiri tidak banyak membantu memperkuat pemerintahan kita. Namun, jika kita menemukan cara untuk berkolaborasi dengan mereka, kita mungkin bisa menggalang lebih banyak masyarakat untuk mendukung tujuan kita."
 FIN_railways_and_infrastructure: "Kereta Api dan Infrastruktur"
 FIN_railways_and_infrastructure_desc: "Perang Besar menunjukkan perlunya jaringan kereta api dan jalan raya yang kuat untuk mendukung industri dan militer dalam mendapatkan sumber daya atau orang-orang di tempat yang mereka perlukan. Setelah puluhan tahun pendudukan dan pertumpahan darah, jaringan logistik kita sangat membutuhkan investasi."
 FIN_repurpose_small_industries: "Gunakan Kembali Industri Kecil"
 FIN_repurpose_small_industries_desc: "Meskipun kita tidak memiliki industri raksasa yang dimiliki oleh negara-negara besar, kita mempunyai banyak sekali pabrik-pabrik kecil yang beroperasi. Daripada memulai dari awal, kita harus menggunakan kembali bangunan kecil ini untuk produksi perang."
 FIN_expand_state_military_factories: "Perluas Pabrik Militer Negara"
 FIN_expand_state_military_factories_desc: "Pabrik-pabrik yang dikelola negara kita sedang berjuang untuk memenuhi tuntutan militer selama masa krisis ini. Jika kami ingin mempertahankan jalur pasokan, kami perlu memperluas fasilitas produksi kami."
 FIN_a_new_course_for_kokoomus: "Kursus Baru untuk Kokoomus"
 FIN_a_new_course_for_kokoomus_desc: "Peristiwa baru-baru ini telah meningkatkan dukungan terhadap partai Kokoomus karena masyarakat mencari kepemimpinan yang kuat dan bijaksana serta kembali ke nilai-nilai tradisional. Kita harus memanfaatkan hal ini dengan mendorong agenda konservatif partai."
 FIN_the_finnish_throne: "Tahta Finlandia"
 FIN_the_finnish_throne_desc: "Kokoomus telah lama mendukung monarki Finlandia. Dengan banyaknya dukungan dan semakin kuatnya cengkeraman mereka pada tampuk kekuasaan, mereka kini mempunyai sarana untuk membubarkan sistem yang ada dan mendirikan sebuah kerajaan sebagai gantinya."
 FIN_strengthen_military_administration: "Memperkuat Administrasi Militer"
 FIN_strengthen_military_administration_desc: "Mannerheim secara heroik telah memimpin negara kita melewati masa-masa penuh gejolak ini, memotong dogma politik dengan ketepatan militeristik. Demi keberlangsungan kelangsungan hidup bangsa, kita harus memberinya wewenang kepada pemerintah dan pihak militer untuk memerintah sesuai kebutuhan mereka."
 FIN_dreams_of_expansionism: "Mimpi Ekspansionisme"
 FIN_dreams_of_expansionism_desc: "Risto Ryti dengan tepat mengakui bahwa kita tidak akan pernah memiliki perdamaian abadi sampai kita menguasai tanah Karelia di sebelah Timur kita. Jika wilayah tersebut aman, kita akan menciptakan perbatasan yang lebih dapat dipertahankan dengan negara-negara tetangga kita."
 FIN_reach_out_to_scandinavia: "Jangkau Skandinavia"
 FIN_reach_out_to_scandinavia_desc: "Sebagian besar tetangga kita di Skandinavia mempunyai sentimen yang sama dan tidak tertarik untuk terseret ke dalam konflik kekuatan besar. Dengan menjaga hubungan yang kuat dengan mereka, kita dapat membangun fondasi pertahanan kolektif kita."
 FIN_moderate_politics: "Politik Moderat"
 FIN_moderate_politics_desc: "Ketika ketegangan meningkat di antara negara-negara besar, kita perlu memastikan bahwa pemerintah kita tidak terlihat terlalu lunak terhadap ideologi faksi mana pun. Oleh karena itu, kita harus menempuh kebijakan moderasi dalam negeri."
 FIN_join_the_allies: "Bergabunglah dengan [GetAlliesFactionForFinland]"
 FIN_join_the_allies_desc: "Netralitas dengan cepat menjadi kebijakan kuno yang hanya mengarah pada vassalisasi di tangan negara-negara besar. Meskipun hal ini merupakan risiko mengingat posisi geo-politik kita, bergabung dengan Sekutu memungkinkan kita mempertahankan kedaulatan dalam jangka panjang."
 FIN_northern_defense_front: "Front Pertahanan Utara"
 FIN_northern_defense_front_desc: "Tetangga kita di Skandinavia dan Baltik adalah pilihan mudah bagi negara-negara besar. Namun, jika kita bisa mengumpulkan sumber daya dan berkolaborasi secara militer, kita mungkin bisa mencegah musuh terbesar sekalipun untuk menyerang kita."
 FIN_the_lone_wolf: "Serigala yang Kesepian"
 FIN_the_lone_wolf_desc: "Tidak ada seorang pun yang lebih mementingkan kepentingan orang [ROOT.GetAdjective] selain orang [ROOT.GetAdjective] itu sendiri. Sejarah telah menunjukkan bahwa daripada bergantung pada orang lain untuk membantu kita, kita harus bergantung pada diri kita sendiri."
 FIN_military_aid: "Bantuan Militer"
 FIN_military_aid_desc: "Sekutu mempunyai banyak sekali produsen senjata, kita harus memanfaatkannya untuk memodernisasi angkatan bersenjata kita dengan cepat."
 FIN_mineral_wealth_development: "Pengembangan Kekayaan Mineral"
 FIN_mineral_wealth_development_desc: "Mengingat letak geografis dan negara tetangga kita, ada kemungkinan kita terputus dari calon sekutu atau mitra ekonomi. Oleh karena itu, kita harus memanfaatkan sumber daya negara yang belum dimanfaatkan untuk memastikan kita dapat melanjutkan perjuangan, bahkan ketika kita terisolasi."
 FIN_industrialize_the_region: "Industrialisasikan Kawasan"
 FIN_industrialize_the_region_desc: "Meskipun gabungan kekuatan militer Front Pertahanan Utara sangat besar, kita harus berbuat lebih banyak untuk memastikan bahwa perekonomian kita dapat mendukungnya dalam perang yang berkepanjangan. Untuk melakukan hal tersebut, kita perlu berinvestasi dalam merevitalisasi industri kita."
 FIN_increase_military_investment: "Meningkatkan Investasi Militer"
 FIN_increase_military_investment_desc: "Komponen ekonomi dan logistik dari konflik sama pentingnya bagi kelangsungan hidup kita seperti halnya pertempuran di garis depan. Oleh karena itu, kita harus berinvestasi pada industri senjata untuk memastikan mereka dapat terus memasok semua peralatan yang dibutuhkan pasukan kita."
 FIN_cooperation_with_germany: "Kerjasama dengan Jerman"
 FIN_cooperation_with_germany_desc: "Kita dapat mengandalkan realitas geo-politik bahwa [GER.GetNameDef] dan [SOU.GetNameDef] pada akhirnya akan saling bertentangan. Jika kita bekerja sama dengan [GER.GetAdjective], kita mungkin bisa membalas kekalahan kita dalam perang sebelumnya dengan [SOU.GetAdjective] dan membuka peluang baru bagi diri kita sendiri."
 FIN_wartsila_engine_production: "Produksi Mesin Wärtsilä"
 FIN_wartsila_engine_production_desc: "Memiliki keterampilan dan kapasitas untuk memproduksi mesin sendiri untuk militer akan meningkatkan keamanan nasional kita. Dengan bekerja sama dengan sekutu dan perusahaan domestik seperti Wärtsilä, kita dapat mencapai tingkat keamanan tersebut."
 FIN_german_military_advisors: "Penasihat Militer Jerman"
 FIN_german_military_advisors_desc: "Peperangan berubah dengan cepat karena penggunaan peralatan bermotor dan pesawat terbang. Mungkin inilah saatnya kita belajar dari saudara seperjuangan kita yang [GER.GetAdjective] tentang cara terbaik memanfaatkan sumber daya baru ini demi keuntungan kita."
 FIN_finnish_march_of_conquest: "Pawai Penaklukan Finlandia"
 FIN_finnish_march_of_conquest_desc: "Sudah terlalu lama kita bersikap defensif terhadap [SOU.GetNameDef] dan pendahulunya. Sekaranglah waktunya untuk membalikkan keadaan dan mendorong kembali batas-batas, membebaskan rakyat Karelia dari penindasan [SOU.GetAdjective], dengan cara apa pun yang diperlukan."
 FIN_joint_scientific_program: "Program Ilmiah Bersama"
 FIN_joint_scientific_program_desc: "Mengembangkan keunggulan teknologi atas musuh dapat menjadi faktor penentu keberhasilan suatu negara dalam konflik. Dengan menggabungkan pengetahuan ilmiah dengan sekutu kita, kita dapat memastikan bahwa keunggulan teknologi adalah milik kita."
 FIN_modernize_the_industry: "Modernisasikan Industri"
 FIN_modernize_the_industry_desc: "Hasil kerja teknologi kita memiliki kegunaan di luar aplikasi di medan perang. Banyak di antaranya yang dapat digunakan untuk membuat industri kita lebih efisien. Dengan sejumlah investasi, kita dapat memulai program modernisasi industri secara besar-besaran dengan pengetahuan baru yang kita peroleh."
 FIN_modernize_the_army: "Modernisasi Angkatan Darat"
 FIN_modernize_the_army_desc: "Prioritas pemerintah mana pun adalah pertahanan dan keselamatan rakyatnya. Ketika angkatan bersenjata kita terbukti kurang, maka kita wajib berinvestasi dalam memodernisasi dan meningkatkan angkatan bersenjata kita hingga dapat memenuhi tugas utamanya sekali lagi."
 FIN_weapon_caches: "Cache Senjata"
 FIN_weapon_caches_desc: "Jika angkatan bersenjata kita kewalahan dan pemerintahan jatuh, kita harus mempunyai rencana darurat agar kita bisa merebut kembali negara ini. Salah satu saran untuk hal ini adalah dengan diam-diam menyimpan senjata untuk digunakan oleh pasukan perlawanan di masa depan."
 FIN_national_unity: "Persatuan Nasional"
 FIN_national_unity_desc: "Ketika perang semakin dekat, kita akan menggalang masyarakat dari negara kita yang besar dan menunjukkan kepada dunia sekali lagi apa artinya menjadi orang Finlandia."
 FIN_viron_kansa: "Viron Kamsa"
 FIN_viron_kansa_desc: "Meski dipisahkan oleh Laut Baltik, masyarakat [ROOT.GetName] dan [EST.GetName] memiliki sejarah panjang yang sama satu sama lain. Selain itu, kita juga menghadapi tantangan yang sama ketika kita berjuang untuk mempertahankan kemerdekaan. Mungkin melalui unifikasi damai, kita bisa menyelamatkan rakyat kita dari perang."
 FIN_ambitions_in_the_south: "Ambisi di Selatan"
 FIN_ambitions_in_the_south_desc: "Negara-negara kecil di Baltik dipandang iri oleh negara-negara tetangganya. Jika mereka ingin ditaklukkan, lebih baik hal itu menguntungkan kita daripada menjadi musuh potensial."
 FIN_union_of_finnish_brothers_in_arms: "Persatuan Saudara Persenjataan Finlandia"
 FIN_union_of_finnish_brothers_in_arms_desc: "Persatuan Persaudaraan Finlandia berada di garis depan gerakan sosialis nasional dan semakin mendapatkan dukungan ketika negara kita mendapat ancaman dari luar. Jika kita berkolaborasi dengan mereka, kita bisa mendapatkan banyak dukungan untuk pertahanan negara."
 FIN_arm_the_lotta_svard: "Persenjatai Lotta Svärd"
 FIN_arm_the_lotta_svard_desc: "Lotta Svärd telah membuktikan diri mereka sebagai aset besar dalam peran mereka sebagai pasukan tambahan. Mengingat kemampuan mereka dan situasi kita yang mengerikan, mungkin inilah saatnya kita mempersenjatai organisasi ini dengan lebih baik dan mengintegrasikannya secara lebih efektif ke dalam angkatan bersenjata."
 FIN_parmis_devils: "Iblis Pärmi"
 FIN_parmis_devils_desc: "Batalyon hukuman Nikke Pärmi telah terbukti efektif dalam menggunakan tenaga kerja yang seharusnya bisa mendekam di balik jeruji besi. Kita harus memperluas pekerjaannya dengan menciptakan divisi tahanan yang bersedia berjuang untuk negaranya."
 FIN_militarized_society: "Masyarakat Militer"
 FIN_militarized_society_desc: "Jika negara kita ingin bertahan dari serangan gencar yang kita hadapi, kita harus melepaskan diri dari politik dan menerapkan militerisasi sepenuhnya dalam masyarakat. Hanya melalui tindakan ekstrem seperti itu kita dapat mengalahkan musuh-musuh kita."
 FIN_a_cry_for_help: "Seruan Minta Bantuan"
 FIN_a_cry_for_help_desc: "Liga Bangsa-Bangsa telah gagal dalam tugasnya untuk melindungi negara-negara anggotanya dari konflik. Namun masih ada orang-orang di luar negeri yang mungkin belum mendengar teriakan minta tolong kami dan datang membantu kami. Atau begitulah yang kami harapkan."
 FIN_greater_finland: "Finlandia Raya"
 FIN_greater_finland_desc: "Kami tidak akan lagi dimangsa oleh tetangga kejam yang mengingini tanah kami. Sebaliknya, kita akan menjadi predator dan memperluas perbatasan kita hingga batas alaminya, melampaui wilayah Karelia."
 FIN_right_wing_policies: "Kebijakan Sayap Kanan"
 FIN_right_wing_policies_desc: "Kelompok kiri hanyalah agen kekuatan asing. Mereka akan menjual tanah air mereka dalam sekejap jika hal itu membuat mereka disukai [SOU.Capital.GetCapitalVictoryPointName]. Jika bangsa kita ingin sejahtera dan bertahan hidup, kita harus beralih ke partai-partai dan organisasi-organisasi sayap kanan."
 FIN_discredit_the_democratic_system: "Mendiskreditkan Sistem Demokrasi"
 FIN_discredit_the_democratic_system_desc: "Sistem demokrasi kita hanya berpindah-pindah dari satu krisis ke krisis lainnya tanpa tindakan yang tegas dan berarti. Dalam situasi berbahaya yang kita hadapi saat ini, kita tidak dapat lagi menoleransi kelemahan tersebut dan harus mendidik masyarakat mengenai kegagalan sistem politik ini."
 FIN_prepare_a_military_coup: "Siapkan Kudeta Militer"
 FIN_prepare_a_military_coup_desc: "[FIN.GetNameDef] membutuhkan kepemimpinan yang kuat dan tegas yang mampu mengambil keputusan sulit dalam suatu krisis. Satu-satunya orang yang saat ini mampu melakukan hal tersebut adalah militer. Daripada menunggu negara ini terpecah belah di bawah pemerintahan demokrat dan sosialis, kita akan meletakkan dasar bagi kudeta militer."
 FIN_a_fascist_regime: "Rezim Fasis"
 FIN_a_fascist_regime_desc: "Dengan parlemen nasional berada di bawah pengaruh militer, kita sekarang dapat membentuk sebuah rezim yang berdasarkan pada kekuatan, kehormatan dan kesetiaan kepada [FIN.GetName]."
 FIN_seek_german_protection: "Carilah Perlindungan Jerman"
 FIN_seek_german_protection_desc: "Liga Bangsa-Bangsa telah gagal total dalam menegakkan hukum internasional. Kita harus menerima bahwa kekuatan angkatan bersenjata adalah satu-satunya faktor penentu dalam hubungan internasional. Agar bangsa kita dapat bertahan hidup, kita harus mencari bantuan dari tetangga kita yang lebih kuat seperti [GER.GetNameDef]."
 FIN_join_axis: "Bergabunglah dengan [GetFascistFactionForFinland]"
 FIN_join_axis_desc: "Hanya sedikit orang yang mampu melawan kekuatan negara Poros. Daripada hanya berdiam diri, kita harus bergabung dengan aliansi mereka dan menggunakannya untuk mencapai tujuan kebijakan luar negeri kita sendiri."
 FIN_finnish_supremacy_in_the_north: "Supremasi Finlandia di Utara"
 FIN_finnish_supremacy_in_the_north_desc: "Sementara negara-negara lain di kawasan kita bertengkar dan menegosiasikan penaklukan mereka di tangan negara-negara yang lebih besar, kita sendirilah yang bisa menawarkan alternatif. Di bawah kepemimpinan kami, kami dapat memimpin rakyat kami menuju kemenangan melawan musuh apa pun yang mungkin mengancam kami."
 FIN_finnish_legion_of_honor: "Legiun Kehormatan Finlandia"
 FIN_finnish_legion_of_honor_desc: "Pasukan kami adalah tameng yang menahan gerombolan komunis di perbatasan kami. Kita harus berbuat lebih banyak untuk menghormati keberanian mereka dengan membentuk Legiun Kehormatan elit yang bisa diikuti oleh mereka yang paling berani."
 FIN_tactical_wargaming_department: "Departemen Perang Taktis"
 FIN_tactical_wargaming_department_desc: "Tuntutan peperangan modern semakin meningkat dari hari ke hari. Jika komando tinggi kita ingin mengimbanginya, kita perlu memperluasnya dengan departemen-departemen baru di mana mereka dapat bereksperimen dengan metode-metode baru melalui permainan perang taktis."
 FIN_advanced_jaeger_training_program: "Program Pelatihan Jaeger Tingkat Lanjut"
 FIN_advanced_jaeger_training_program_desc: "Unit Jaeger kami telah lama dianggap sebagai elit angkatan bersenjata, menelusuri asal usul mereka hingga Perang Besar ketika unit pertama mereka menerima pelatihan di Jerman. Mungkin sudah waktunya kita menyegarkan kembali unit-unit tersebut dengan memodernisasi mereka dan pada gilirannya, meningkatkan moral seluruh tentara."
 FIN_industrial_cooperation: "Kerja Sama Industri"
 FIN_industrial_cooperation_desc: "Anggota negara-negara Poros mempunyai banyak pengetahuan dan sumber daya yang mereka miliki. Sudah saatnya kita berkolaborasi secara industri untuk memanfaatkan aset-aset yang belum termanfaatkan ini dengan lebih baik demi kemajuan bangsa kita masing-masing."
 FIN_bring_foreign_armor_experts: "Bawalah Ahli Armor Asing"
 FIN_bring_foreign_armor_experts_desc: "Tank adalah komponen penting dari tentara modern mana pun, namun pengalaman kami dengan mereka terbatas. Mungkin kita bisa memperluas kemampuan kita dengan mengundang ahli asing di bidangnya untuk membantu kita."
 FIN_military_research: "Penelitian Militer"
 FIN_military_research_desc: "Peperangan terus-menerus diciptakan kembali dengan munculnya teknologi dan taktik baru yang memanfaatkannya. Untuk memastikan kesinambungan kekuatan dan kesiapan angkatan bersenjata kita, para anggota aliansi kita harus menyatukan pengetahuan dan teknologi kita."
 FIN_patriotic_peoples_movement: "Gerakan Rakyat Patriotik"
 FIN_patriotic_peoples_movement_desc: "Gerakan Rakyat Patriotik, meskipun mendapat perlawanan dari rezim sebelumnya, telah melakukan pekerjaan besar dalam mendidik masyarakat tentang perlunya kebanggaan nasional dan pertahanan negara melawan komunisme. Jika kita bisa meyakinkan mereka, kita akan mendapatkan basis dukungan yang jauh lebih besar untuk rezim kita."
 FIN_academic_karelian_society: "Masyarakat Akademik Karelia"
 FIN_academic_karelian_society_desc: "Selama lebih dari satu dekade, organisasi intelektual dan mahasiswa di Universitas Helsinki menjadi semakin berpengaruh. Tujuan inti mereka selaras dengan tujuan kami, yaitu upaya memperbaiki Finlandia sejalan dengan sejarah kami. Mungkin kita bisa menemukan cara untuk berkolaborasi bersama."
 FIN_mustapaidat: "Mustapaidat"
 FIN_mustapaidat_desc: "Militerisasi masyarakat yang terus berlanjut akan memastikan bahwa rakyat kita menjadi yang terkuat. Dengan menggabungkan kekuatan paramiliter, kita dapat mempromosikan nilai-nilai militer ke seluruh lapisan masyarakat, mulai dari mereka yang masih terlalu muda untuk bergabung dengan tentara hingga mereka yang mungkin terlalu tua untuk bergabung dengan militer."
 FIN_take_over_the_suojeluskunta: "Ambil alih Suojeluskunta"
 FIN_take_over_the_suojeluskunta_desc: "Suojeluskunta telah bertindak sebagai pasukan cadangan tambahan yang dapat dipanggil untuk membantu membela negara di saat krisis. Jika kita mengendalikan organisasi ini, kita bisa memanfaatkannya untuk mengindoktrinasi ribuan orang demi tujuan kita."
 FIN_maan_turva: "Maan Turva"
 FIN_maan_turva_desc: "Hanya melalui pemantauan yang cermat terhadap masyarakat kita dapat memastikan bahwa tidak ada pengkhianatan atau subversi yang terjadi. Pada gilirannya, kita dapat melindungi rezim dan memastikan bahwa negara ini tidak mengalami kehancuran dari dalam ke luar."
 FIN_finnish_irredentism: "Irredentisme Finlandia"
 FIN_finnish_irredentism_desc: "Meskipun kita telah memperoleh kemerdekaan dari bekas Kekaisaran Rusia, masih ada wilayah dan masyarakat yang seharusnya kita kelola, namun tetap terjebak di bawah penindasan musuh-musuh kita. Kita harus menggalang semangat rakyat kita untuk pembebasan tanah ini."
 FIN_keepers_of_the_north: "Penjaga Utara"
 FIN_keepers_of_the_north_desc: "Kami adalah satu-satunya rezim di Utara yang memiliki kemauan kuat untuk memerintah dan mempertahankan wilayah ini dari musuh eksternal. Sebelum semua masyarakat di kawasan ini bersatu di bawah pemerintahan kita, kita tidak akan pernah bisa mencapai perdamaian abadi."
 FIN_sotilaalliset_kappalaiset: "Sotilaalliset Kappalaiset"
 FIN_sotilaalliset_kappalaiset_desc: "Akses terhadap seorang pendeta adalah layanan penting yang diandalkan oleh tentara kita. Banyak dari para pendeta ini juga mempunyai kepedulian terhadap masa depan bangsa kita. Jika kita berkolaborasi dengan mereka, kita tidak hanya bisa mendapatkan perhatian dan telinga di garis depan namun juga memastikan pesan yang tepat juga sampai ke pasukan."
 FIN_national_fanatism: "Fanatisme Nasional"
 FIN_national_fanatism_desc: "Masyarakat harus sepenuhnya dijiwai dengan fanatisme dan dedikasi terhadap keunggulan [FIN.GetAdjective]. Kami telah membuktikan berkali-kali bahwa tidak ada yang bisa menghentikan kami dan ketika kita bekerja sama, tidak ada yang bisa menghentikan kemajuan bangsa kita."
 FIN_military_promotions: "Promosi Militer"
 FIN_military_promotions_desc: "Perwira militer kami telah mengabdi kepada negara dengan penuh kehormatan dan dedikasi. Sudah saatnya kita memberi penghargaan kepada mereka yang terbaik atas peran mereka dalam menyelamatkan kita dari penaklukan musuh-musuh bersejarah kita."
 FIN_indoctrinate_the_workers: "Indoktrinasi Pekerja"
 FIN_indoctrinate_the_workers_desc: "Dengan meningkatnya pemantauan terhadap populasi, kami memiliki wawasan yang lebih luas mengenai apa yang membuat metode propaganda menjadi efektif. Kita harus memanfaatkan pengetahuan ini untuk mengindoktrinasi masyarakat, memastikan kesetiaan mutlak mereka kepada pemerintah dan [FIN.GetNameDef]."
 FIN_intellectual_elite: "Elit Intelektual"
 FIN_intellectual_elite_desc: "Melalui kolaborasi yang cermat antara pihak militer dan anggota Intelijen yang lebih tercerahkan, kita telah berhasil menyelamatkan negara ini dari cengkeraman sosialisme dan degenerasi. Sudah waktunya kita memberi penghargaan kepada mereka yang mendukung kita dengan berinvestasi dalam upaya akademis mereka."
 FIN_enhance_southern_infrastructure: "Meningkatkan Infrastruktur Selatan"
 FIN_enhance_southern_infrastructure_desc: "Seiring dengan upaya negara [ROOT.GetAdjective] untuk mengamankan posisinya di dunia, negara tersebut harus fokus pada pembangunan dan peningkatan kapasitas industrinya. Langkah pertama untuk mencapai tujuan ini adalah dengan meningkatkan infrastruktur di wilayah selatan untuk memastikan bahwa wilayah tersebut lebih siap menangani permintaan industri ringan dan berat dalam jangka pendek."
 FIN_industrial_development: "Perkembangan Industri"
 FIN_industrial_development_desc: "Ketika dunia semakin terindustrialisasi, [ROOT.GetName] harus mengimbanginya jika ingin menjadi pemain utama di panggung global. Investasi yang kami lakukan pada industri berat tidak hanya akan menciptakan lapangan kerja dan menstimulasi perekonomian, namun juga menyediakan sumber daya yang diperlukan untuk menghadapi tantangan masa depan."
 FIN_bank_of_aland: "Bank Aland"
 FIN_bank_of_aland_desc: "Bank of Åland adalah landasan perekonomian [ROOT.GetName], memberikan stabilitas dan dukungan yang diperlukan untuk mendorong pertumbuhan dan kemakmuran.\nDengan berinvestasi di Bank of Åland, [ROOT.GetName] berinvestasi untuk masa depannya, meletakkan dasar bagi negara yang lebih kuat dan sejahtera."
 FIN_suomen_akatemia: "Suomen Akatemia"
 FIN_suomen_akatemia_desc: "Beberapa intelektual [ROOT.GetAdjective], yang dipimpin oleh ahli matematika terkenal Leo Sario, mendorong pendirian Suomen Akatemia, yang akan menjadi institusi akademis terkemuka nasional, mendorong inovasi ilmiah dan membantu memposisikan [ROOT.GetName] di garis depan perkembangan teknologi."
 FIN_janiskoski_power_plant: "Pembangkit Listrik Jäniskoski"
 FIN_janiskoski_power_plant_desc: "Kami akan membangun pembangkit listrik di Jäniskoski untuk menyediakan energi yang dapat diandalkan untuk pabrik peleburan listrik di tambang nikel Kolosjoki dan mendorong pertumbuhan wilayah [722.GetName], yang pada gilirannya akan memacu pembangunan ekonomi di [ROOT.GetName] Utara."
 FIN_found_pohjolan_voima: "Ditemukan Pohjolan Voima"
 FIN_found_pohjolan_voima_desc: "Dengan berkembangnya industri kehutanan dan industri berat baru-baru ini, diperlukan lebih banyak tenaga listrik. Kami akan memusatkan produksi energi dan memanfaatkan potensi tenaga air yang tidak terbatas untuk mendorong pertumbuhan industri [ROOT.GetName]."
 FIN_expand_imatra_hydropower_plant: "Memperluas PLTA Imatra"
 FIN_expand_imatra_hydropower_plant_desc: "Pembangkit Listrik Tenaga Air Imatra, yang didirikan pada tahun 1922, telah terbukti menjadi sumber energi yang dapat diandalkan untuk industri [ROOT.GetName] yang sedang berkembang. Dengan perluasan mesin Kelima dan Keenam, kapasitas pabrik akan meningkat, memungkinkan pertumbuhan industri lebih lanjut di wilayah [928.GetName]."
 FIN_makola_mine: "Tambang Makola"
 FIN_makola_mine_desc: "Deposit nikel dan tembaga yang kaya telah ditemukan di Makola dan Hitura. Para ahli kami berpendapat bahwa cadangan ini memiliki potensi besar bagi pertumbuhan ekonomi negara kami dan industri militer yang berkembang pesat, dan mereka menyarankan untuk memulai pekerjaan konstruksi di tambang Makola untuk mengamankan sumber mineral berharga sesegera mungkin."
 FIN_power_from_the_dams: "Listrik dari Bendungan"
 FIN_power_from_the_dams_desc: "Memanfaatkan sumber daya alam sungai yang melimpah di [ROOT.GetName], perluasan infrastruktur pembangkit listrik tenaga air kami telah diusulkan. Menurut para ahli kami, investasi dalam pembangunan pembangkit listrik tenaga air baru akan memberikan sarana untuk memperluas kapasitas industri secara drastis dan mendorong pertumbuhan negara kita."
 FIN_tire_factory_at_nokia: "Pabrik Ban di Nokia"
 FIN_tire_factory_at_nokia_desc: "Pada saat konflik, [ROOT.GetName] membutuhkan sumber ban untuk militer, sehingga mengamankan pasokan yang dapat diandalkan untuk menjamin mobilitas dan kesiapan angkatan bersenjata kita harus menjadi prioritas.\nKami memiliki rencana untuk memperluas pabrik ban Suomen Gummitehdas di Nokia dan meningkatkan lini produksi untuk menggunakan karet sintetis dan bahan daur ulang untuk mengatasi potensi kekurangan."
 FIN_vaisala_radiosonde_tests: "Tes Radiosonde Väisälä"
 FIN_vaisala_radiosonde_tests_desc: "Di bawah bimbingan Profesor Vilho Väisälä, upaya perintis dalam teknologi radiosonde telah membuka jalan bagi keberhasilan produksi komersial. Berdasarkan keberhasilan peluncuran radiosonde pertama di Finlandia pada tahun 1931, penelitian dan pengembangan berkelanjutan telah menghasilkan kemajuan teknologi yang signifikan."
 FIN_oy_alkoholiliike: "Oy Alkoholiliike"
 FIN_oy_alkoholiliike_desc: "Masa-masa sulit membutuhkan tindakan yang sangat mendesak, dan sekarang adalah waktu bagi Oy Alkoholiliike, Perusahaan Alkohol, untuk mendukung militer Finlandia dengan menyediakan komponen-komponen penting untuk persenjataan mereka.\nMelalui produksi dan pemurnian yang cermat, mereka akan mengkhususkan diri dalam pembuatan koktail pembakar yang sangat efektif, memberikan infanteri keuntungan yang mereka butuhkan untuk menetralisir kendaraan lapis baja ringan musuh."
 FIN_integrate_oy_tikkakoski: "Integrasikan Oy Tikkakoski"
 FIN_integrate_oy_tikkakoski_desc: "Untuk mendukung industri senjata [ROOT.GetAdjective], Oy Tikkakoski akan diintegrasikan ke dalam pabrik senjata militer milik negara. Langkah ini akan meningkatkan produksi senjata dan meningkatkan pengembangan senjata api baru untuk militer [ROOT.GetAdjective]."
 FIN_national_firepower: "Daya Tembak Nasional"
 FIN_national_firepower_desc: "Mengingat ancaman eksternal yang mendesak yang dihadapi negara kita, kita harus berkomitmen untuk melakukan investasi besar pada pabrik-pabrik militer baru. Fasilitas-fasilitas ini akan didedikasikan untuk memproduksi meriam artileri terbaru untuk angkatan darat dan baterai pesisir kita, memastikan bahwa [ROOT.GetNameDef] memiliki daya tembak yang diperlukan untuk mempertahankan perbatasannya."
 FIN_contract_with_yhteissisu: "Kontrak dengan Yhteissisu"
 FIN_contract_with_yhteissisu_desc: "Kami akan mendirikan, bekerja sama dengan perusahaan [ROOT.GetAdjective] terkemuka, perusahaan Yhteissisu Oy dengan tujuan menyediakan transportasi yang andal dan efisien untuk Angkatan Pertahanan [ROOT.GetAdjective].\n_Pengalihan produksi truk Sisu S-21 ke Yhteissisu akan meningkatkan produksi truk dan bus untuk keperluan militer, memastikan pasukan kita dilengkapi dengan sumber daya yang diperlukan untuk situasi apa pun."
 FIN_outokumpu_for_defence_industry: "Outokumpu untuk Industri Pertahanan"
 FIN_outokumpu_for_defence_industry_desc: "Investasi pada perusahaan industri logam nasional, Outokumpu Oy, akan membantu meningkatkan kesiapan pertahanan [ROOT.GetName].\nPembangunan pabrik logam dalam negeri di Pori dan pabrik elektrolisis tembaga untuk memurnikan tembaga mentah akan mewujudkan swasembada produksi tembaga dan kuningan [ROOT.GetName]."
 FIN_industrial_upgrade_in_harjavalta: "Peningkatan Industri di Harjavalta"
 FIN_industrial_upgrade_in_harjavalta_desc: "Di Harjavalta, upaya sedang dilakukan untuk memodernisasi dan menyederhanakan industri nikel dan tembaga. Dengan teknologi mutakhir dan metode produksi yang lebih baik, tujuannya adalah untuk memaksimalkan hasil dan memperkuat posisi [ROOT.GetName] sebagai produsen utama mineral penting ini."
 FIN_expand_mining_prospection: "Memperluas Prospek Penambangan"
 FIN_expand_mining_prospection_desc: "Investasi pada peralatan pertambangan modern dan perluasan infrastruktur pertambangan menjadi landasan bagi industri ekstraksi mineral yang kuat. Peningkatan output akan memenuhi kebutuhan pertahanan nasional dan memperkuat kesiapan negara menghadapi konflik."
 FIN_elijarvi_mine: "Tambang Elijärvi"
 FIN_elijarvi_mine_desc: "Kami telah menerima sampel yang ditemukan sehubungan dengan pekerjaan penggalian di dekat Elijärvi, yang menunjukkan adanya bijih krom yang mungkin sangat kaya akan kromium. Kita harus memulai operasi penambangan baru di wilayah tersebut dan mengamankan sumber kromium yang dapat diandalkan untuk industri militer."
 FIN_tornio_steel_factory: "Pabrik Baja Tornio"
 FIN_tornio_steel_factory_desc: "Mendirikan pabrik baja di Tornio, dekat tambang Kemi, menjanjikan revolusi industri logam Finlandia. Dengan akses terhadap pasokan krom dan nikel di Outokumpu yang melimpah, pabrik baru ini akan memproduksi baja berkualitas tinggi, menjembatani kesenjangan dalam kemampuan industri Finlandia."
 FIN_increase_military_budget: "Meningkatkan Anggaran Militer"
 FIN_increase_military_budget_desc: "Keamanan negara adalah hal yang paling penting. Dengan meningkatkan pendanaan militer, kekuatan pertahanan akan diperlengkapi dengan baik dan lebih siap menghadapi segala potensi ancaman."
 FIN_suomen_maavoimat: "Suomen Maavoimat"
 FIN_suomen_maavoimat_desc: "Kita harus meningkatkan kemampuan Angkatan Pertahanan Finlandia dengan berinvestasi dalam penelitian peralatan militer baru dan memodernisasi fasilitas pelatihan untuk memastikan kesiapan dalam menghadapi potensi ancaman apa pun."
 FIN_operation_kilpapurjehdus: "Operasi Kilpapurjehdus"
 FIN_operation_kilpapurjehdus_desc: "Berdasarkan keputusan Liga Bangsa-Bangsa, Åland telah mengalami demiliterisasi sejak tahun 1921, yang berarti tidak ada pasukan atau perlengkapan militer yang ditempatkan di wilayah tersebut. Namun, ketegangan meningkat di Eropa, dan menghadapi ancaman serius dari pendaratan musuh di pulau-pulau tersebut, komando tinggi kami telah menyusun rencana untuk mempersenjatai dan membentengi Åland.\nPersiapan telah dilakukan dan pasukan kita siap beraksi!"
 FIN_extra_refresher_exercises: "Latihan Penyegaran Ekstra"
 FIN_extra_refresher_exercises_desc: "Ketegangan terus meningkat di Eropa, dan jika kemerdekaan [ROOT.GetAdjective] ingin dipertahankan, kita perlu memperkuat pertahanan Finlandia melalui latihan intensif, mempersiapkan potensi pecahnya konflik dan menunjukkan tekad dan kesiapan Finlandia untuk mempertahankan kedaulatan negara jika diperlukan."
 FIN_the_cold_front: "Front Dingin"
 FIN_the_cold_front_desc: "Kondisi musim dingin yang keras di front Finlandia memerlukan persiapan yang tepat. Rute pasokan harus diamankan dan taktik kamuflase ditingkatkan untuk menjamin ketahanan pasukan pertahanan dalam menghadapi tantangan musim dingin."
 FIN_jaeger_movement: "Gerakan Jaeger"
 FIN_jaeger_movement_desc: "Komando Tinggi [ROOT.GetAdjective] telah mengajukan proposal untuk menyegarkan kembali kekuatan pertahanan dengan mempromosikan perwira dengan pelatihan Jaeger sebelumnya. Para perwira ini ahli dalam perang gerilya dan operasi sabotase di belakang garis musuh, menjadikan mereka kandidat yang tepat untuk mengasah keterampilan unit baru dalam taktik peperangan yang tidak konvensional dan memimpin mereka ke medan perang."
 FIN_salvaged_and_retooled: "Diselamatkan dan Diperlengkapi Kembali"
 FIN_salvaged_and_retooled_desc: "Jika angkatan bersenjata kita ingin menang dalam perang, kita harus fokus pada memaksimalkan sumber daya di masa perang. Memanfaatkan peralatan musuh yang direbut, menyelamatkan material yang rusak dan menggunakannya kembali bila diperlukan agar selaras dengan Doktrin Taktis Finlandia akan memungkinkan kita memenuhi kebutuhan pasokan tentara dan sangat memperkuat kemampuan militer kita."
 FIN_winter_warfare: "Perang Musim Dingin"
 FIN_winter_warfare_desc: "Bersiaplah untuk kemungkinan terburuk, berjuanglah sebaik mungkin. Kita perlu memperkuat jalur pasokan untuk menghadapi kondisi musim dingin yang keras dan melatih pasukan kita untuk bertahan dalam cuaca dingin dan terus berjuang di garis depan."
 FIN_motti_tactics: "Taktik Motti"
 FIN_motti_tactics_desc: "Strategi motti melibatkan pengepungan dan isolasi unit musuh dengan tujuan melumpuhkan jalur logistik dan komunikasi mereka. Penerapan pendekatan ini memerlukan perencanaan dan pelatihan yang cermat terhadap kekuatan pertahanan untuk memastikan efektivitasnya di medan perang. Dengan memanfaatkan dan menyempurnakan peperangan motti, kita akan mampu mengakali musuh dan menyerang di tempat yang paling tidak mereka duga."
 FIN_foreign_armor: "Armor Asing"
 FIN_foreign_armor_desc: "Saat Angkatan Darat [ROOT.GetAdjective] berupaya memperkuat kemampuan lapis baja mereka selama perang, kita harus melihat melampaui batas negara kita sendiri untuk mencari solusinya. Akuisisi kendaraan lapis baja asing seperti Landsverk L-62 II Swedia dapat memberikan tambahan yang baik pada persenjataan [ROOT.GetAdjective] dan menunjukkan kecerdikan dan kemampuan beradaptasi negara tersebut dalam menghadapi kesulitan."
 FIN_utilize_the_sami: "Manfaatkan Sámi"
 FIN_utilize_the_sami_desc: "Kita harus mengakui keterampilan unik masyarakat Sámi, yang merupakan navigator ahli di medan Arktik yang keras. Dengan memanfaatkan pengetahuan mereka tentang wilayah tersebut, kami dapat meningkatkan kemampuan pengintaian kami, dan dengan mempekerjakan mereka sebagai penggembala rusa, kami dapat meningkatkan jalur pasokan kami di daerah terpencil. Sámi dapat memainkan peran penting dalam strategi pertahanan kita, dan kita harus memastikan keahlian mereka dimanfaatkan sepenuhnya."
 FIN_long_range_patrols: "Patroli Jarak Jauh"
 FIN_long_range_patrols_desc: "Patroli Jarak Jauh akan menjadi elemen penting dalam upaya pengintaian dan sabotase tentara [ROOT.GetAdjective] saat ini karena mereka menghadapi tantangan peperangan modern. Unit-unit yang sangat terlatih ini berspesialisasi dalam menembus garis musuh, mengumpulkan intelijen, dan melancarkan serangan mendadak yang menghancurkan, menjadikan mereka aset penting dalam upaya perang."
 FIN_finnish_radio_intelligence: "Intelijen Radio Finlandia"
 FIN_finnish_radio_intelligence_desc: "Ketika perang semakin intensif, militer Finlandia menyadari pentingnya mengumpulkan informasi intelijen yang dapat diandalkan. Di bawah kepemimpinan Reino Hallama, sekelompok operator radio berbakat telah berkumpul untuk mencegat dan memecahkan kode komunikasi musuh. Dengan keterampilan dan pengetahuan mereka, operator-operator ini akan memberikan informasi berharga kepada angkatan bersenjata Finlandia, membantu membalikkan keadaan perang."
 FIN_sissi: "Kak"
 FIN_sissi_desc: "Ketika konflik berkecamuk, pasukan infanteri ringan Sissi kami menjadi aset yang sangat berharga bagi Angkatan Darat Finlandia, menggunakan keahlian mereka dalam patroli jarak jauh dan penyergapan untuk menyerang sasaran musuh. Berbekal pengetahuan superior tentang medan dan kemampuan bergerak cepat dan tanpa suara, mereka terbukti menjadi duri di pihak musuh dan menjadi kebanggaan rakyat Finlandia."
 FIN_national_armor_focus: "Fokus Armor Nasional"
 FIN_national_armor_focus_desc: "Ketika upaya perang semakin intensif, [ROOT.GetName] harus mengalihkan perhatiannya pada industri militernya sendiri. Dengan fokus pada pengembangan kemampuan produksi tank dalam negeri, kami bertujuan untuk memperkuat kekuatan lapis baja kami dan menciptakan kendaraan yang disesuaikan dengan kebutuhan unik mereka di medan perang."
 FIN_underground_resistance_cells: "Sel Resistensi Bawah Tanah"
 FIN_underground_resistance_cells_desc: "Ketika musuh maju, beberapa orang Finlandia menolak untuk menyerah. Sel perlawanan yang kecil dan gesit mengangkat senjata dan melakukan penyergapan, penggerebekan, dan sabotase. Pengetahuan mereka tentang medan dan komitmen mereka terhadap perjuangan menjadikan mereka ancaman besar bagi penyerang mana pun, tidak peduli seberapa kuatnya mereka."
 FIN_mannerheim_line: "Jalur Mannerheim"
 FIN_mannerheim_line_desc: "Dalam upaya memperkuat pertahanan kita, kita harus mengalihkan perhatian kita ke Garis Mannerheim. Sebuah jaringan benteng pertahanan yang kompleks, garis ini membentang melintasi perbatasan timur negara dan harus diamankan dari serangan musuh. Untuk mencapai tujuan ini, tentara berupaya meningkatkan benteng itu sendiri dan jalur pasokan yang menjaga persediaan dan operasional mereka."
 FIN_defense_in_depth: "Pertahanan secara Mendalam"
 FIN_defense_in_depth_desc: "Ketika musuh semakin kuat dan bertekad, menjadi jelas bahwa satu garis depan statis mungkin tidak cukup untuk menahan mereka. Kita harus membangun benteng baru dan garis pertahanan yang lebih kecil di belakang garis depan utama, memberikan perlindungan berlapis dan memberikan fleksibilitas kepada pasukan kita untuk melakukan serangan balik bila diperlukan. Kami akan membuat musuh membayar untuk setiap inci tanah [ROOT.GetAdjective] yang mereka coba ambil."
 FIN_helsinki_air_defense: "Pertahanan Udara Helsinki"
 FIN_helsinki_air_defense_desc: "Saat perang membayangi [ROOT.GetName], Helsinki harus dibentengi. Kota dan garis pantainya rentan terhadap serangan, dan militer [ROOT.GetAdjective] harus melindunginya. Peningkatan pertahanan udara dan benteng pantai tidak hanya akan melindungi kota namun juga memperkuat tekad negara untuk menahan serangan apa pun."
 FIN_suomen_ilmavoimat: "Suomen Ilmavoimat"
 FIN_suomen_ilmavoimat_desc: "Kita harus fokus pada peningkatan efektivitas Angkatan Udara [ROOT.GetAdjective] melalui investasi dalam penelitian dan pelatihan.\nTujuannya adalah untuk menciptakan cabang udara modern dan fleksibel yang mampu menghadapi tantangan peperangan modern, serta memberikan dukungan penting kepada pasukan darat selama operasi tempur."
 FIN_expand_air_bases: "Perluas Pangkalan Udara"
 FIN_expand_air_bases_desc: "Ketika ketegangan meningkat sekitar [ROOT.GetName], kita harus memastikan bahwa Angkatan Pertahanan kita mempunyai sarana untuk beroperasi secara memadai.\nKami akan mendukung Angkatan Udara dalam komitmen mereka untuk memperluas jumlah pangkalan udara di seluruh negeri untuk memastikan bahwa pilotnya dapat dikerahkan dengan cepat pada saat konflik."
 FIN_pilot_training: "Pelatihan Percontohan"
 FIN_pilot_training_desc: "Dengan meningkatnya kebutuhan akan kekuatan udara dalam peperangan modern, pelatihan yang lebih maju dan terspesialisasi diperlukan bagi pilot-pilot kita. Melalui investasi dalam metode dan peralatan pelatihan baru, Angkatan Udara [ROOT.GetAdjective] dapat memastikan bahwa pilotnya termasuk yang terbaik di dunia."
 FIN_naval_airforce: "Angkatan Udara Angkatan Laut"
 FIN_naval_airforce_desc: "Seiring dengan pertumbuhan angkatan laut [ROOT.GetName], kemampuan penerbangannya juga harus meningkat. Pembentukan angkatan udara angkatan laut yang berdedikasi akan memastikan bahwa angkatan laut Finlandia mendapat dukungan yang dibutuhkan untuk mendominasi Laut Baltik, mengoordinasikan kekuatan udara dan armada permukaan untuk mengusir segala ancaman."
 FIN_national_aircraft_production: "Produksi Pesawat Terbang Nasional"
 FIN_national_aircraft_production_desc: "Ketika [ROOT.GetName] menghadapi ancaman perang, semakin jelas bahwa angkatan udara modern sangat penting bagi pertahanan negara. Untuk itu, program produksi pesawat nasional telah dimulai, dengan tujuan menyediakan sumber daya dan dukungan yang diperlukan kepada perancang dan produsen pesawat [ROOT.GetAdjective], memastikan bahwa [ROOT.GetName] dapat bersaing dengan negara-negara besar Eropa."
 FIN_expand_air_force_academy: "Perluas Akademi Angkatan Udara"
 FIN_expand_air_force_academy_desc: "Sebagai bagian dari upaya nasional untuk meningkatkan Angkatan Udara, kita akan memulai perluasan Akademi Angkatan Udara secara signifikan. Perluasan ini tidak hanya mencakup fasilitas baru tetapi juga peningkatan pelatihan pilot, dengan pembangunan lapangan udara baru di Kauhava dan Tikkakoski."
 FIN_foreign_aircraft: "Pesawat Asing"
 FIN_foreign_aircraft_desc: "TNI Angkatan Udara [ROOT.GetAdjective] harus memperluas kemampuannya untuk menjaga kedaulatan bangsa dan menjamin keamanan tanah air kita. Desain dan keahlian pesawat asing akan dicari untuk meningkatkan kemampuan kami dan pengembangan pesawat kami sendiri."
 FIN_support_for_ground_forces: "Dukungan untuk Angkatan Darat"
 FIN_support_for_ground_forces_desc: "Ketika perang berkecamuk, menjadi jelas bahwa pasukan darat memerlukan lebih banyak dukungan udara. Untuk mencapai tujuan tersebut, kami akan berinvestasi dalam pengembangan dan produksi pesawat pendukung udara jarak dekat, untuk memberikan perlindungan udara yang penting bagi pasukan kami di darat. Ini akan memberi mereka dukungan yang mereka perlukan untuk mempertahankan posisi mereka dan melawan musuh."
 FIN_dominate_the_skies: "Dominasi Langit"
 FIN_dominate_the_skies_desc: "[ROOT.GetAdjective] langit akan menjadi milik kita! Produksi pesawat tempur baru dan investasi dalam penelitian dan pengembangan teknologi tempur udara modern akan memungkinkan kita mengamankan superioritas udara dan melindungi tanah air kita. Pilot kami yang terampil akan mendominasi langit dan melakukan perlawanan terhadap musuh."
 FIN_expand_production_lines: "Perluas Jalur Produksi"
 FIN_expand_production_lines_desc: "Angkatan Udara [ROOT.GetAdjective] perlu memperluas kapasitas produksinya untuk memenuhi permintaan upaya perang yang terus meningkat. Dengan membangun jalur produksi baru, kita dapat meningkatkan produksi pesawat baru dan memastikan bahwa Angkatan Udara kita tetap menjadi aset yang kuat dalam perang melawan musuh-musuh kita."
 FIN_modernize_production_lines: "Modernisasi Jalur Produksi"
 FIN_modernize_production_lines_desc: "Untuk menciptakan industri penerbangan kelas dunia yang mampu memproduksi pesawat militer tercanggih, pemerintah [ROOT.GetAdjective] akan berinvestasi dalam meningkatkan pabrik nasional yang bertanggung jawab atas pembuatan peralatan udara, memastikan bahwa Angkatan Udara [ROOT.GetName] memiliki akses terhadap teknologi pesawat terbaru dan paling andal."
 FIN_suomen_merivoimat: "Suomen Merivoimat"
 FIN_suomen_merivoimat_desc: "Angkatan laut [ROOT.GetName] harus siap mempertahankan tanah airnya dari segala potensi ancaman. Dengan penekanan pada penelitian peralatan angkatan laut modern dan pengembangan program pelatihan yang lebih baik, Angkatan Laut [ROOT.GetAdjective] akan menjadi kekuatan yang mampu melindungi kepentingan kita di perairan."
 FIN_the_merchant_fleet: "Armada Pedagang"
 FIN_the_merchant_fleet_desc: "Sebagai bagian dari upaya perang, armada dagang [ROOT.GetName] harus mampu mengimbangi untuk memastikan pengangkutan pasokan penting jika diperlukan. Dengan berinvestasi dalam produksi kapal-kapal baru, kita dapat memperkuat kemampuan kita untuk mempertahankan diri dan mengamankan posisi kita dalam konflik apa pun."
 FIN_conversion_of_civilian_vessels: "Konversi Kapal Sipil"
 FIN_conversion_of_civilian_vessels_desc: "Ketika perang berkecamuk, kita harus memanfaatkan semua sumber daya yang kita miliki. Melalui konversi kapal sipil, [ROOT.GetName] dapat dengan cepat meningkatkan kemampuan angkatan lautnya dan melindungi pantainya dari ancaman musuh. Kapal pemecah es berukuran besar dapat digunakan kembali menjadi kapal pertahanan pantai, sementara kapal yang lebih kecil dapat berfungsi sebagai kapal perusak atau kapal patroli, sehingga menciptakan jaringan pertahanan yang tangguh di sepanjang pantai [ROOT.GetAdjective]."
 FIN_coastal_defense: "Pertahanan Pesisir"
 FIN_coastal_defense_desc: "Dalam menghadapi agresi asing, sangat penting untuk memastikan bahwa garis pantai Finlandia terlindungi dengan baik. Dengan meningkatkan infrastruktur pertahanan pesisir, kita dapat lebih mempersiapkan diri menghadapi potensi ancaman dari laut."
 FIN_marine_jaeger_divisions: "Divisi Jaeger Marinir"
 FIN_marine_jaeger_divisions_desc: "Didirikan pada akhir tahun 1934, Jaeger Marinir Finlandia, Rannikkojääkärit, dibentuk sebagai pasukan infanteri marinir elit Angkatan Laut Finlandia. Para prajurit yang sangat terlatih dan mudah beradaptasi ini diperlengkapi untuk melaksanakan berbagai misi, mulai dari pertahanan pantai hingga serangan amfibi, dan akan menjadi aset utama dalam setiap potensi pertempuran di sepanjang Pantai Baltik."
 FIN_rapid_raiders: "Perampok Cepat"
 FIN_rapid_raiders_desc: "Seiring kemajuan dunia, Angkatan Laut kita juga harus maju. Dengan berinvestasi dalam penelitian dan produksi kapal perusak modern, yang dipersenjatai dengan teknologi torpedo terkini, kita akan mampu menyerang musuh kita dengan kekuatan yang cepat dan mematikan."
 FIN_deep_sea_raiders: "Perampok Laut Dalam"
 FIN_deep_sea_raiders_desc: "Dengan upaya perang yang dipertaruhkan, Angkatan Laut [ROOT.GetAdjective] harus meningkatkan produksi kapal selam modern untuk mengganggu jalur pasokan musuh dan melindungi jalur perdagangan kita sendiri. Kapal-kapal ramping dan mematikan ini akan menimbulkan ketakutan di hati para pelaut musuh dan membantu mengamankan tempat [ROOT.GetName] sebagai kekuatan maritim."
 FIN_sea_mines_strategy: "Strategi Ranjau Laut"
 FIN_sea_mines_strategy_desc: "Dengan mengerahkan ranjau di lokasi-lokasi strategis, Angkatan Laut [ROOT.GetAdjective] bertujuan untuk membuat perairan di sekitar pantainya berbahaya bagi armada musuh, sehingga menyulitkan mereka untuk mendekati pantai [ROOT.GetAdjective] dan memastikan keamanan perdagangan maritim kita."
 FIN_expansion_towards_the_atlantic: "Ekspansi Menuju Atlantik"
 FIN_expansion_towards_the_atlantic_desc: "[ROOT.GetAdjective] pembuatan kapal akan berlayar menuju Atlantik, memperluas kemampuan angkatan laut mereka dan membangun kapal yang lebih besar untuk memproyeksikan kekuatan di seberang lautan. Dengan bertambahnya kapal perang dan kapal induk, Angkatan Laut [ROOT.GetName] akan menjadi kekuatan yang patut diperhitungkan di kancah dunia."
 FIN_strengthen_the_naval_bases: "Perkuat Pangkalan Angkatan Laut"
 FIN_strengthen_the_naval_bases_desc: "Saat [ROOT.GetName] bersiap untuk perang, pangkalan angkatan lautnya harus dilengkapi dengan perlengkapan yang baik dan terlindungi dengan baik. Dengan meningkatkan infrastruktur dan pertahanan pangkalan angkatan laut kita, kita dapat memastikan bahwa armada kita tetap aman dan siap menghadapi musuh."
 FIN_expand_ship_building_industry: "Memperluas Industri Pembuatan Kapal"
 FIN_expand_ship_building_industry_desc: "Seiring dengan meningkatnya kebutuhan kapal militer, kebutuhan akan galangan kapal yang mampu memproduksinya juga meningkat. Dengan berkembangnya industri pembuatan kapal, [ROOT.GetName] akan lebih siap untuk menyediakan kapal yang dibutuhkan angkatan bersenjatanya untuk memproyeksikan kekuatan dan melindungi pantai mereka."
 FIN_acquire_andros_dockyards: "Mengakuisisi Galangan Kapal Andros"
 FIN_acquire_andros_dockyards_desc: "Akuisisi galangan kapal Andros di Turku akan sangat meningkatkan kemampuan produksi perancang kapal terkemuka kami, $FIN_crichton_vulcan_organization$. Dengan tambahan baru ini, Angkatan Laut [ROOT.GetAdjective] akan mampu memproduksi kapal yang lebih banyak dan lebih baik, sehingga meningkatkan kekuatan dan pengaruhnya di wilayah tersebut."
 FIN_innovative_designs: "Desain Inovatif"
 FIN_innovative_designs_desc: "Dalam lompatan inovasi yang berani, teknisi kami mengungkap proyek ambisius \"Hyökkäysvaunu\", sebuah proposal tank super berat yang menantang batas-batas peperangan lapis baja. Meskipun mungkin tampak tidak lazim, upaya berani ini mencerminkan tekad [ROOT.GetNameDef] untuk mengeksplorasi desain inovatif dan mendorong batas-batas yang mungkin dilakukan di medan perang."
 FIN_found_pohjolan_voima_factories_tt: "Menambahkan §G2§! Slot Bangunan dan §Y1 $industrial_complex$§! di hingga §Y5 status inti yang dikontrol sepenuhnya§! dengan setidaknya 3 level $infrastructure$."
 FIN_tire_factory_at_nokia_tech_tt: "Ketika teknologi §Y$synth_oil_experiments$§! diteliti:"
 FIN_tire_factory_at_nokia_add_synthetic_refineries_tt: "Tambahkan §G2§! §Y$synthetic_refinery$§!."
 FIN_expand_mining_prospection_tt: "Menambahkan produksi §Y2£resources_strip|5§!di setiap status inti yang sudah menyediakan §Y£resources_strip|5 $state_resource_steel$§!.\nEfek saat ini:"
 FIN_modify_finnish_army_ns_intro: "Ubah §Y$FIN_finnish_army$§! dengan"
 FIN_oy_alkoholiliike_ns_tt: "$FIN_modify_finnish_army_ns_intro$\n$FIN_oy_alkoholiliike_dynamic_modifier_tt$"
 FIN_salvaged_and_retooled_sisu_trait_repurposed_tt: "Ketika §Y$FIN_mechanized_equipment_3$§! (Teknologi Mekanis 1944) diteliti:"
 FIN_winter_warfare_battalion_tt: "Membuka kunci batalion pendukung §Y$winter_logistics_support$§!."
 FIN_long_range_patrols_battalion_tt: "Membuka kunci batalion pendukung §Y$long_range_patrol_support$§!."
