 NORDIC_research_tech_sharing_name: "Institut Penelitian Nordik"
 ICE_expand_the_fishing_industry: "Memperluas Industri Perikanan"
 ICE_expand_the_fishing_industry_desc: "Memancing selalu menjadi bagian penting dari kehidupan Islandia. Ini adalah sumber daya alam utama yang kami miliki, dan kami memilikinya dalam jumlah melimpah. jadi di sinilah kita perlu memfokuskan upaya kita. Menjadi lebih kuat di area yang memiliki potensi nyata."
 ICE_mineral_prospecting: "Prospek Mineral"
 ICE_mineral_prospecting_desc: "Secara teori, mungkin saja ada sumber daya alam yang tersembunyi di pegunungan. Dengan mencoba mengungkap hal ini, kita dapat memberikan alternatif selain perikanan dan pertanian sebagai industri utama di Islandia."
 ICE_international_trade: "Perdagangan Internasional"
 ICE_international_trade_desc: "Islandia perlu lebih aktif di panggung dunia keuangan. Dengan merangkul perdagangan bebas, dan membuka negara kita terhadap investasi asing, kita dapat menciptakan lebih banyak peluang perdagangan, dan menstimulasi perekonomian kita lebih jauh lagi."
 ICE_hydroelectric_power: "Pembangkit Listrik Tenaga Air"
 ICE_hydroelectric_power_desc: "Jika ada satu sumber daya lain yang dimiliki negara ini, maka sumber daya tersebut adalah air; sungai dan sumber air panas. Memperluas penggunaan bahan-bahan ini dapat mendorong pembangunan industri di negara ini."
 ICE_banking_on_the_future: "Perbankan di Masa Depan"
 ICE_banking_on_the_future_desc: "Sektor perbankan merupakan salah satu sektor yang tidak memerlukan sumber daya yang besar. Yang perlu kita lakukan hanyalah menarik modal asing. Dengan mensubsidi sektor perbankan kita, dan mengerahkan segala daya kita untuk menjadikan bank-bank Islandia menarik bagi investor, kita dapat menjadikan pulau ini sebagai pusat keuangan, yang akan memperoleh manfaat di tahun-tahun mendatang."
 ICE_infiltration: "Infiltrasi"
 ICE_infiltration_desc: "Menyebarkan jaring kita, dan lebih mengintegrasikan perekonomian kita dengan negara lain juga memberikan peluang lain. Dengan menjalin kontak dengan orang-orang dan perusahaan-perusahaan penting di seluruh dunia, Islandia akan berada pada posisi yang tepat untuk mendapatkan segala jenis informasi."
 ICE_develop_icelandic_shipping: "Kembangkan Pengiriman Islandia"
 ICE_develop_icelandic_shipping_desc: "Kita adalah sebuah Pulau, sebuah pulau di tengah lautan. Berfokus pada pembuatan kapal adalah pilihan yang jelas."
 ICE_heavy_industry: "Industri Berat"
 ICE_heavy_industry_desc: "Pertanian, perikanan, dan pelayaran sudah ketinggalan zaman. Untuk mendorong bangsa ini menuju masa depan, kita perlu fokus pada industri berat. Dengan memperluas industri ini, Islandia akan memiliki masa depan yang cerah, meski penuh kabut asap."
 ICE_advanced_technology: "Teknologi Maju"
 ICE_advanced_technology_desc: "Pulau itu kecil. Negara ini tidak akan pernah mampu bersaing secara setara dengan negara-negara industri besar. Kita harus menemukan ceruk pasar kita dan mencapai kesejahteraan di sana. Sesuatu yang relatif baru, dimana kita tidak memulainya dengan tertinggal dalam persaingan. Teknologi canggih dan elektronik adalah tempat kita bisa sejahtera dan berkembang."
 ICE_reykjavik_dockyards: "Galangan Kapal Reykjavik"
 ICE_reykjavik_dockyards_desc: "Hal pertama yang membangun armada adalah dermaga yang lebih modern dan banyak. Dana negara harus digunakan untuk memperluas kemampuan pembuatan kapal sebelum kita melakukan hal lain."
 ICE_expand_the_harbour: "Perluas Pelabuhan"
 ICE_expand_the_harbour_desc: "Semakin banyak kapal yang berangkat dan pulang dari pulau ini berarti kita membutuhkan pelabuhan yang lebih besar. Negara harus mendanai perluasan pelabuhan Reykjavik, sehingga kita dapat terus mengembangkan perekonomian."
 ICE_local_arms_industry: "Industri Senjata Lokal"
 ICE_local_arms_industry_desc: "Dengan memproduksi persenjataan secara lokal, kita dapat memasok pasukan kita sendiri dan menjualnya di pasar internasional, yang berarti kita tidak hanya akan meningkatkan kemampuan pertahanan kita tetapi juga perekonomian kita. Oleh karena itu, industri senjata Islandia perlu menjadi titik fokus utama investasi kita."
 ICE_infrastructure_development: "Pembangunan Infrastruktur"
 ICE_infrastructure_development_desc: "Modernisasi infrastruktur dan pembangunan sistem transportasi yang baik akan memberikan negara ini jalan raya menuju kemakmuran."
 ICE_iceland_air: "Udara Islandia"
 ICE_iceland_air_desc: "Saat ini, menjadi sebuah pulau bukan berarti terputus dari dunia. Dengan pesawat modern kita bisa lebih dekat ke benua Eropa dan Amerika. Udara adalah jalur laut masa depan."
 ICE_allied_weapons_seller_trigger: "§YSekutu§! atau §YNetral§! Negara"
 ICE_expand_the_civilian_fleet: "Perluas armada Sipil"
 ICE_expand_the_civilian_fleet_desc: "Armada sipil yang kuat mempunyai keuntungan ganda, yaitu menjaga tradisi angkatan laut tetap berjalan dan memberikan keuntungan bagi perekonomian kita. Kapal dagang akan membawa perekonomian di masa damai, dan menghasilkan pelaut berpengalaman yang dibutuhkan angkatan laut kita di masa perang."
 ICE_industrial_research_school: "Sekolah Penelitian Industri"
 ICE_industrial_research_school_desc: "Universitas ini sukses besar. Negara ini perlu membangun keberhasilan ini dengan menciptakan pendidikan tinggi yang lebih fokus dan juga ditujukan untuk pengembangan industri. Dengan cara ini kami dapat memastikan bahwa kami mendapatkan insinyur yang kami butuhkan."
 ICE_hrafninn_flygur: "Hrafninn Flýgur"
 ICE_hrafninn_flygur_desc: "Sebagai burung gagak, kita akan menguasai langit. Islandia akan dikaitkan dengan industri pesawat terbang dan teknologi pesawat terbang terkemuka – di seluruh dunia."
 ICE_agricultural_expansion: "Ekspansi Pertanian"
 ICE_agricultural_expansion_desc: "Banyak perbaikan yang dapat dilakukan untuk memodernisasi pertanian Islandia. Dengan memanfaatkan teknologi modern, dan pemanasan yang mudah diakses dari sumber air panas alami, hasil pertanian dapat ditingkatkan, dan lahan serta pekerja dapat dibebaskan untuk penggunaan lain."
 ICE_off_shore_oil_drilling: "Pengeboran Minyak Lepas Pantai"
 ICE_off_shore_oil_drilling_desc: "Minyak semakin menjadi sumber daya yang penting. Angkatan laut saat ini mengkonsumsi sejumlah besar bahan bakar. Ada alasan untuk meyakini bahwa mungkin terdapat minyak di dasar laut sekitar pulau. Ini merupakan pilihan yang berisiko tinggi dan memberikan imbalan yang tinggi, namun perlu diselidiki apakah minyak ini ada dan dapat dibawa ke permukaan."
 off_shore_drilling_tt: "Membuka keputusan untuk §YPengeboran Minyak§! di sekitar §YIslandia§!"
 ICE_the_kingdom_of_iceland: "Kerajaan Islandia"
 ICE_the_kingdom_of_iceland_desc: "Negara ini telah menempuh perjalanan panjang menuju kemerdekaan. Mendirikan Kerajaan harus dipandang sebagai langkah terakhir menuju kebebasan. Sekarang kami hanya berbagi Raja dan Kebijakan Luar Negeri dengan Denmark. Lambat laun ikatan ini bisa terkikis hingga hanya menjadi sekedar formalitas."
 ICE_united_we_stand: "Bersatu Kita Berdiri"
 ICE_united_we_stand_desc: "Selama Perang Besar kami terisolasi. Denmark netral, dan Islandia menderita karena kehilangan akses ke semua pasar. Denmark kembali mempersenjatai diri, dan kita harus siap membantu mereka jika diperlukan. Kali ini Islandia akan menunjukkan pengaruhnya di dunia."
 ICE_declare_absolute_neutrality: "Deklarasikan Netralitas Mutlak"
 ICE_declare_absolute_neutrality_desc: "Apa pun yang terjadi pada Denmark, Islandia harus melakukan segala daya untuk menghindari perang Eropa. Dengan mendeklarasikan netralitas mutlak, kami menjelaskan kepada semua orang bahwa kami tidak akan membiarkan pulau kami terseret ke dalam hal apa pun."
 ICE_declare_absolute_neutrality_tt: "§Y[ROOT.GetNameDef]§! akan merdeka jika §Y[ROOT.OVERLORD.GetNameDef]§! dinyatakan perang"
 ICE_joint_shipbuilding_programme: "Program Pembuatan Kapal Bersama"
 ICE_joint_shipbuilding_programme_desc: "Cara terbaik kami dalam membantu Denmark adalah melalui laut. Bersama-sama kita bisa melindungi Laut Utara. Untuk melakukan hal tersebut kita memerlukan kapal, sehingga upaya bersama untuk menciptakan armada merupakan langkah alami dalam membangun strategi kerja sama militer kita."
 ICE_research_cooperation_tt: "Program penelitian bersama"
 ICE_overlord_research_cooperation_tt: "Program penelitian bersama Islandia"
 ICE_royal_marines: "Marinir Kerajaan"
 ICE_royal_marines_desc: "Militer Islandia tidak akan pernah menjadi besar. Tapi kita bisa berspesialisasi, dan marinir adalah pilihan yang jelas bagi negara kepulauan. Dengan membentuk dan melatih Korps Marinir, kita mendapatkan kekuatan fleksibel yang dapat dikerahkan dimanapun dibutuhkan."
 ICE_the_icelandic_police_force: "Kepolisian Islandia"
 ICE_the_icelandic_police_force_desc: "Tentara Islandia tidak akan pernah terlalu besar. Namun sebagai alternatif, kita dapat memperluas tugas kepolisian nasional hingga mencakup pertahanan invasi. Dengan begitu kita bisa lebih efisien menggunakan tenaga terbatas yang kita miliki, dan mempersiapkan pertahanan pulau dengan lebih baik"
 ICE_infrastructure_projects: "Proyek Infrastruktur"
 ICE_infrastructure_projects_desc: "Jika negara ini ingin kuat, hal pertama yang perlu dilakukan adalah membangun infrastruktur. Infrastruktur yang baik adalah dasar bagi segala jenis ekspansi industri."
 ICE_engineering_projects: "Proyek Rekayasa"
 ICE_engineering_projects_desc: "Pulau ini perlu dikembangkan agar bisa menjadi kuat. Proyek-proyek rekayasa besar akan menghasilkan peluang kerja, dan akan menciptakan basis bagi pertumbuhan industri Islandia."
 ICE_patrolling_the_atlantic: "Berpatroli di Atlantik"
 ICE_patrolling_the_atlantic_desc: "Untuk dapat melindungi laut niaga kita, kita membutuhkan kapal pengawal lautan. Kita harus bekerja sama dengan Denmark untuk merancang model baru."
 ICE_joint_military_training: "Pelatihan Militer Gabungan"
 ICE_joint_military_training_desc: "Kami tidak memiliki cukup pengalaman di pulau itu untuk melatih pasukan dengan baik dalam peperangan modern. Oleh karena itu, bekerja sama dengan Denmark adalah pendekatan terbaik untuk pulau kecil seperti milik kami."
 ICE_industrial_cooperation: "Kerja Sama Industri"
 ICE_industrial_cooperation_desc: "Mengundang para industrialis Denmark untuk mendirikan anak perusahaan di Islandia, dengan imbalan pembebasan pajak dan sebagainya, dapat menciptakan peluang kerja di Islandia. Hal ini juga akan memberikan dorongan yang sangat dibutuhkan bagi industrialisasi di pulau ini. Dengan bantuan Denmark kita bisa memajukan negara ini."
 ICE_gardhur_airfield: "Lapangan Terbang Garður"
 ICE_gardhur_airfield_desc: "Pesawat terbang menjadi bagian nyata dari infrastruktur modern. Islandia tidak boleh ketinggalan. Sebuah lapangan terbang di dekat ibu kota akan menjadi kunci untuk melambungkan Islandia ke masa depan."
 ICE_the_merchant_fleet: "Armada Pedagang"
 ICE_the_merchant_fleet_desc: "Kapal pernah menjadi bagian inti dalam penciptaan bangsa ini. Kapal juga akan menjadi bagian dari masa depan. Angkatan laut pedagang yang kuat akan menjadi inti perekonomian Islandia di masa depan."
 ICE_not_standing_idly_by: "Tidak Berdiam Diri"
 ICE_not_standing_idly_by_desc: "Perang akan datang, suka atau tidak suka. Kita harus mengangkat senjata ke negara ini jika kita ingin mempunyai kesempatan untuk mempertahankan pulau ini. Itu adalah hidup atau mati, itu yang pasti."
 ICE_expand_industrial_complexes: "Perluas Kompleks Industri"
 ICE_expand_industrial_complexes_desc: "Industri militer kita sangat tertinggal dibandingkan negara-negara lain di Eropa, karena mereka masih terbelakang dan kurang dimanfaatkan, dan jika kita tidak berinvestasi besar-besaran dalam memperluas dan mensubsidi organisasi industri militer kita, industri kita mungkin tidak akan pernah bisa mengejar ketertinggalan tersebut."
 ICE_political_unity: "Persatuan Politik"
 ICE_political_unity_desc: "Di saat-saat bahaya, sangatlah penting bagi bangsa ini untuk tetap bersatu. Kita harus mengesampingkan perbedaan politik dan melakukan apa pun untuk mencegah [ROOT.GetName] terlibat dalam perang."
 ICE_anglo_icelandic_relations: "Hubungan Anglo-Islandia"
 ICE_anglo_icelandic_relations_desc: "[ENG.GetNameDefCap] kemungkinan besar adalah pilihan terbaik kami sebagai mitra dagang masa depan. Dalam kasus apa pun, tindakan menentang [ENG.GetAdjective] akan sangat merugikan negara kita, dan mungkin sangat berbahaya. Oleh karena itu kita harus melakukan yang terbaik untuk menjaga hubungan baik dengan tetangga kita di seberang lautan."
 ICE_anglo_icelandic_relations_tt: "Jika sudah menyelesaikan fokus §YMemperluas Industri Perikanan§!:"
 ICE_american_protection: "Perlindungan Amerika"
 ICE_american_protection_desc: "[GetAmericanProtectionText]"
 ICE_american_protection_desc_standard: "Perang sedang terjadi dan kita terlalu kecil untuk sendirian. [USA.GetNameDefCap] dapat melindungi kita. Kita harus menghubungi pemerintah [USA.GetAdjective] dan menawarkan mereka untuk menempatkan pasukan di sini untuk melindungi Islandia. Ini merupakan kemunduran dalam perjalanan menuju kemerdekaan, namun hanya kemunduran sementara. Diserbu akan lebih buruk."
 ICE_american_protection_desc_british_subject: "[ENG.GetNameDefCap] sangat tegang dalam perang ini. Mereka mungkin tidak dapat melindungi kita dari kekuatan musuh jika mereka memutuskan untuk menyerang. Kita harus mendekati pemerintah [USA.GetAdjective] dan menawarkan mereka untuk mengambil alih tugas melindungi Islandia."
 ICE_american_protection_tt: "§Y[ROOT.GetName]§! menjadi boneka §Y[USA.GetNameDef]§!"
 ICE_fighting_as_equals: "Berjuang sebagai Setara"
 ICE_fighting_as_equals_desc: "Kami berperang bersama. Islandia lebih dari sekadar berusaha keras. Sudah waktunya bagi Denmark untuk menerima bahwa Islandia tidak lagi menjadi bawahan, melainkan mitra setara dalam aliansi ini. Sudah waktunya untuk secara resmi mendeklarasikan Islandia sebagai negara merdeka."
 ICE_fighting_as_equals_tt: "§Y[ROOT.getName]§! mendeklarasikan kemerdekaan"
 ICE_expanding_the_university_of_reykjavik: "Memperluas Universitas Reykjavik"
 ICE_expanding_the_university_of_reykjavik_desc: "Pengetahuan adalah kuncinya. Jika negara ini ingin menjadi yang terdepan di dunia, kita perlu memfokuskan upaya kita. Dengan meningkatkan pendanaan Universitas Reykjavik, kami menciptakan platform untuk pertumbuhan di masa depan."
 ICE_trade_relations: "Hubungan Dagang"
 ICE_trade_relations_desc: "Sebuah negara kecil tidak bisa berharap untuk memproduksi semua kebutuhannya. Namun, dengan menjaga hubungan baik dengan negara-negara di seluruh dunia, dan dengan menggunakan lokasi strategis yang berada tepat di tengah-tengah antara Eropa dan Amerika Utara, Islandia berada pada posisi yang tepat untuk menjadi pusat keuangan dan perdagangan. Pemanfaatan koneksi ini semaksimal mungkin akan mempermudah pengadaan peralatan yang sangat dibutuhkan negara ini."
 ICE_keflavik_airbase: "Pangkalan Udara Keflavík"
 ICE_keflavik_airbase_desc: "Amerika ingin membangun pangkalan udara yang lebih besar sehingga mereka dapat melakukan patroli dengan lebih baik di Atlantik. Kita harus menyetujui hal ini karena ini hanya akan membuat negara ini lebih kuat."
 ICE_modernizing_the_island: "Modernisasi Pulau"
 ICE_modernizing_the_island_desc: "Teori-teori baru perlu dipraktikkan. perekonomian perlu direformasi. Sekaranglah waktunya untuk mendorong perubahan ini."
 ICE_compensation: "Kompensasi"
 ICE_compensation_desc: "Kami telah membuktikan kepada Denmark dan dunia bahwa kami adalah bangsa yang patut diperhitungkan. Kita telah berkorban, baru-baru ini dan selama berabad-abad. Terletak di Atlantik, Islandia berada pada posisi yang tepat untuk melindungi pulau-pulau di wilayah kekuasaan Denmark. Dengan menyerahkan perlindungan wilayah ini kepada kami, Denmark akan mendapatkan mitra yang lebih kuat dan dapat lebih fokus dalam melindungi wilayah intinya."
 ICE_republicanism: "Republikanisme"
 ICE_republicanism_desc: "Islandia tidak membutuhkan seorang Raja. Kabupaten telah menunjukkan bahwa kita bisa melakukannya dengan baik tanpa adanya hal tersebut. Saatnya tepat untuk menghapus institusi abad pertengahan ini dan mempersiapkan diri untuk sebuah republik."
 ICE_american_investments: "Investasi Amerika"
 ICE_american_investments_desc: "Memiliki ribuan orang Amerika yang ditempatkan di pulau itu sendiri merupakan hal yang baik bagi perekonomian. Namun hal ini juga berarti bahwa perusahaan-perusahaan Amerika menjadi lebih tertarik untuk mendirikan anak perusahaan dan berinvestasi di perusahaan-perusahaan Islandia. Secara keseluruhan, situasi ini bisa sangat bermanfaat bagi kita jika kita memainkan kartu kita dengan benar."
 ICE_american_soldiers: "Tuan Rumah Tentara Amerika"
 ICE_american_soldiers_desc: "Amerika Serikat sangat ingin memperluas pengaruhnya secara luas demi melindungi nilai-nilai yang paling mereka junjung tinggi. Kita bisa membiarkan tentara mereka ditempatkan secara bebas di tanah kita, dan beberapa di antaranya bisa tinggal di sini dan memperkuat kekuatan kita sendiri."
 ICE_iceland_defense_force: "Angkatan Pertahanan Islandia"
 ICE_iceland_defense_force_desc: "Dengan bantuan Amerika, Islandia dapat membangun pasukan modern. Mereka memiliki pengetahuan, pengalaman, dan tenaga untuk melatih pasukan kita. Membangun kekuatan bersama-sama dengan mereka berpotensi menjadikan unit kita menjadi kekuatan yang benar-benar elit."
 ICE_state_owned_enterprises: "Badan Usaha Milik Negara"
 ICE_state_owned_enterprises_desc: "Kini setelah pulau kita dapat menghidupi dirinya sendiri dengan lebih baik, sekarang saatnya untuk mulai berpikir tentang membangun industri yang dapat menarik pekerja dan meningkatkan perekonomian, serta efisiensi aparatur negara."
 ICE_not_our_king: "Bukan Raja Kami"
 ICE_not_our_king_desc: "Kerajaan Islandia - omong kosong. Islandia tidak membutuhkan seorang raja, dan tentu saja bukan raja Denmark. Inilah saatnya untuk mulai membangun dukungan di antara masyarakat Islandia untuk benar-benar melepaskan diri dari masa lalu, dan kita mengambil langkah menuju masa depan."
 ICE_expand_the_industrial_base: "Memperluas Basis Industri"
 ICE_expand_the_industrial_base_desc: "Dengan menghilangkan ketergantungan kita pada barang-barang industri milik penguasa kita, kita akan mendapatkan industri yang lebih kuat dan dengan demikian juga kelas pekerja yang lebih kuat. Sebuah revolusi tidak dapat terjadi tanpa alat yang tepat, dan dengan menghilangkan ketergantungan pada penguasa kita, negara ini bisa mendapatkan apa yang dibutuhkannya, termasuk persenjataan yang diproduksi dalam negeri untuk melaksanakan revolusi, serta pemikiran-pemikiran baru yang cemerlang."
 ICE_anti_capitalist_propaganda: "Propaganda Anti-Kapitalis"
 ICE_anti_capitalist_propaganda_desc: "Apa yang telah dilakukan kapitalisme bagi kita? ya, hal ini mungkin hanya memberikan sedikit kemakmuran bagi negara ini, namun hal ini juga membawa kita ke dalam krisis yang sedang dialami oleh negara ini. Dengan ketergantungan yang berlebihan pada demokrasi liberal dan kesediaan para penguasa untuk hanya memberikan sisa-sisanya kepada kita, jelaslah bahwa masa depan kita harus berada di tempat lain."
 ICE_international_relations: "Hubungan Internasional"
 ICE_international_relations_desc: "Jalan kita ke depan akan sulit, dan itu sudah pasti. Jika kita berjalan sendiri, akan lebih parah lagi. Oleh karena itu, kita perlu mencari sekutu baru. Komunis Internasional adalah salah satu tempat di mana kita dapat mencoba mencari aliansi baru, namun ada juga pilihan lain. Hal yang penting adalah secara aktif membuat terobosan baru, yang harus segera kita mulai lakukan."
 ICE_rally_the_workers_of_reykjavik: "Kumpulkan Pekerja Reykjavik"
 ICE_rally_the_workers_of_reykjavik_desc: "Islandia tidak mempunyai tentara yang bisa dikatakan, namun para pekerja di ibu kotanya pasti bisa menjadi kekuatan yang patut diperhitungkan. Jika para pekerja bangkit melawan sistem, tidak akan ada banyak hal yang dapat menghentikan mereka, sehingga memenangkan mereka untuk mendukung perjuangan ini adalah hal yang sangat penting."
 ICE_completion_break_with_the_crown_tt: "Saat menyelesaikan fokus §Y$ICE_break_with_the_crown$§!:"
 ICE_prepare_for_the_revolution: "Bersiaplah untuk Revolusi"
 ICE_prepare_for_the_revolution_desc: "Revolusi yang sukses tidak terjadi dengan sendirinya. Hal ini perlu dipersiapkan secara matang. Benih harus ditanam dan disiram. Rakyat perlu mengetahui kapan harus bangkit, dan kaum revolusioner harus membimbing mereka ketika mereka bangkit. Poster harus dicetak. Kaum revolusioner profesional direkrut dan dilatih, senjata disimpan dengan benar, dan para pemimpin harus siap mengambil kendali."
 ICE_state_visits: "Kunjungan Kenegaraan"
 ICE_state_visits_desc: "Tidak dapat dipungkiri bahwa negara-negara yang dipimpin oleh fasislah yang mendorong perubahan di dunia saat ini. Jika Islandia ingin berubah, mungkin ada hal yang bisa dipelajari darinya. Hubungan resmi harus dibangun sesegera mungkin, dan peluang kerja sama apa pun perlu segera dijajaki."
 ICE_general_strike: "Pemogokan Umum"
 ICE_general_strike_desc: "Mari kita tunjukkan kepada dunia pada umumnya, dan raja Denmark kita yang keji pada khususnya, bahwa para pekerja di Islandia berdiri teguh dan bersatu. Pemogokan besar-besaran yang akan menghentikan semua pekerjaan industri serta pengiriman barang ke dan dari pulau tersebut, seharusnya benar-benar merugikan pemerintah boneka, dan menunjukkan kepada masyarakat di mana sebenarnya letak kekuasaannya."
 ICE_general_strike_tt: "Ketika §YPemogokan Umum§! selesai:"
 ICE_organize_a_march: "Atur bulan Maret"
 ICE_organize_a_march_desc: "Sudah terlalu lama rakyat diperbudak oleh penguasa asing. Pawai nasionalis di ibu kota, seperti pawai melawan Roma, akan menjadi pengingat akan masa lalu bangsa Viking yang kuat. Jika kita bisa mengajak semua warga Islandia yang mencintai kebebasan untuk bergabung, kita bisa menunjukkan kepada pemerintah bahwa masyarakat Islandia kuat, berlimpah, dan bersatu! Bersama-sama, kita dapat menciptakan masa depan yang lebih baik!"
 ICE_break_with_the_crown: "Putus Dengan Mahkota"
 ICE_break_with_the_crown_desc: "Saatnya tepat untuk memutuskan hubungan resmi dengan mahkota Denmark. Kita harus mengecam Raja dan kabinetnya yang dekaden di Denmark, dan mendeklarasikan Islandia sebagai negara merdeka sekali lagi, bebas mengikuti jalannya sendiri menuju impian dan aspirasinya."
 ICE_break_with_the_crown_tt: "[ROOT.GetNameDefCap] menjadi mandiri."
 ICE_break_with_the_crown_workers_tt: "Ketika fokus §Y$ICE_rally_the_workers_of_reykjavik$§! selesai:"
 ICE_break_with_the_crown_revolution_tt: "Ketika fokus §Y$ICE_prepare_for_the_revolution$§! selesai:"
 ICE_embrace_the_workers_revolution: "Rangkullah Revolusi Buruh"
 ICE_embrace_the_workers_revolution_desc: "Dukungan dari para pekerja memungkinkan perubahan ini. Oleh karena itu, wajar jika sindikat, pekerja, dan serikat pekerja mendapatkan posisi terdepan di negara baru ini. Para pemimpin revolusi buruh dapat membimbing negara ini ke tingkat yang lebih tinggi, dan membawa kemajuan yang jauh lebih besar daripada yang bisa dilakukan oleh raja mana pun."
 ICE_remove_dissent_in_the_working_class_tt: "Akan menghapus §Y$ICE_dissent_in_the_working_class$§!"
 ICE_state_corporatism: "Korporatisme Negara"
 ICE_state_corporatism_desc: "Sekarang kita telah melepaskan diri dari sisa-sisa kuk Denmark yang lemah, sekarang saatnya untuk mendirikan negara baru. Cara terbaik untuk menjamin keamanan negara kita adalah dengan bersatu di belakang pemimpin yang kuat, dengan para pemimpin serikat pekerja, tokoh industri dan partai yang bekerja sama demi kebaikan bersama seluruh rakyat Islandia. Negara akan mendukung para industrialis, dan sebagai imbalannya mereka akan mendukung negara."
 ICE_international_brigades: "Brigade Internasional"
 ICE_international_brigades_desc: "Perjuangan melawan penindasan harus terus dilanjutkan meski sudah dimenangkan di sini. Kalau tidak, kita mempertaruhkan kemenangan kita hanya sementara. Putra dan putri [ROOT.GetName] harus siap membantu kapanpun dibutuhkan, dan negara harus melakukan yang terbaik untuk mendukung hal ini, dengan menerapkan undang-undang baru yang diperlukan, dan dengan menyediakan senjata dan peralatan yang dibutuhkan."
 ICE_state_owned_industry: "Industri Milik Negara"
 ICE_state_owned_industry_desc: "Negara kecil, seperti [ROOT.GetNameDef] tidak bisa bergantung pada kapitalis untuk memproduksi barang-barang yang dibutuhkan. Untuk memaksimalkan efisiensi, dan untuk memastikan bahwa barang-barang yang paling dibutuhkan dapat diproduksi, negara perlu turun tangan dan mengambil kendali atas industri ini. Negara tidak lagi bergantung pada investasi asing untuk bertahan hidup. Negara Islandia akan memperhatikan warganya dan angkatan bersenjatanya."
 ICE_organize_the_greyshirts: "Atur Greyshirts"
 ICE_organize_the_greyshirts_desc: "Milisi bersenjata lengkap yang dilatih sejak masa muda dapat menjadi alat yang berguna untuk membina generasi muda dan membentuk mereka agar sesuai dengan dunia baru kita. Selain itu, pelatihan semi-militer juga berarti memperkuat kemampuan angkatan bersenjata, yang terbukti berguna dalam merebut kembali apa yang menjadi hak kita."
 ICE_research_cooperation: "Kerjasama Penelitian"
 ICE_research_cooperation_desc: "Melalui kerja sama dengan negara-negara yang bersekutu dengan kita, kita dapat mengembangkan teknologi dengan lebih baik yang akan memberi kita keuntungan dalam hal persenjataan di masa depan. Kita dapat belajar dari mitra-mitra kita yang berharga, sambil menawarkan tempat pengujian yang baik dan terpencil, jauh dari pengintaian."
 ICE_infiltrating_the_british_isles: "Menyusup ke Kepulauan Inggris"
 ICE_infiltrating_the_british_isles_desc: "Api revolusioner harus menyebar jika tidak ingin dipadamkan dan kemudian dipadamkan. Sasaran pembebasan yang jelas adalah kaum buruh tertindas di Kepulauan Inggris.[ROOT.GetNameDefCap] akan membantu kaum buruh di kawasan tertindas untuk bangkit melawan penguasa imperialis dan kapitalis. Bersama-sama, kita dapat mewujudkan cita-cita revolusioner menjadi kenyataan bagi pekerja biasa."
 ICE_infiltrating_the_british_isles_tt: "Membuka §Ykeputusan§! untuk memulai pemberontakan komunis di Wales, Skotlandia, dan Irlandia Utara."
 ICE_transformation_of_nature: "Transformasi Alam"
 ICE_transformation_of_nature_desc: "Listrik adalah kunci industrialisasi. Sifat Islandia perlu melayani negara, sama seperti warga negaranya. Sungai dan air terjun dapat diubah menjadi bendungan, batu dapat ditambang, dan sumber air panas dapat digunakan untuk pemanas. Tidak ada yang bisa menghentikan langkah kita menuju kemajuan."
 ICE_the_viking_spirit: "Semangat Viking"
 ICE_the_viking_spirit_desc: "Tak kenal takut dan mematikan adalah kata-kata yang diasosiasikan dengan kaum viking di masa lalu. Mereka menyeberangi lautan, tidak mengetahui apa yang ada di baliknya, dan hanya yang kuat yang berhasil. Orang Islandia harus menjadi orang yang tidak kenal takut dan berani saat ini, karena hanya melalui keberanian dan keberanian, negara ini akan melampaui apa yang pernah ada, dan menguasai Laut Utara sekali lagi."
 ICE_viking_spirit_tt: "Membuka Keputusan untuk §YMeningkatkan Semangat Viking§!"
 ICE_recruiting_international_workers: "Merekrut Pekerja Internasional"
 ICE_recruiting_international_workers_desc: "Dengan mengubah negara kita menjadi masyarakat panutan bagi komunis dan sosialis, dan menjaga api revolusi tetap menyala, kita dapat menarik kaum revolusioner internasional seperti masa-masa awal berdirinya negara Soviet. Kita perlu menunjukkan kepada para pekerja dan tentara revolusioner, terlepas dari mana mereka berasal, bahwa [ROOT.GetName] membawa obor, dan di sinilah mereka berada."
 ICE_international_research_community: "Komunitas Riset Internasional"
 ICE_international_research_community_desc: "Ada banyak hal yang bisa dipelajari dari pihak lain, baik melalui komunis internasional, maupun melalui proyek kerja sama lainnya dengan negara-negara di seluruh dunia. Dengan terlibat dengan komunitas internasional, [ROOT.GetName] akan mencapai tingkat keagungan baru. Kolektivisme adalah satu-satunya jalan yang benar menuju kemajuan!"
 ICE_international_research_community_tt: "Setiap negara komunis yang tidak tergabung dalam faksi, atau dalam faksi dengan [ROOT.GetName]:"
 ICE_reclaiming_the_empire: "Merebut Kembali Kekaisaran"
 ICE_reclaiming_the_empire_desc: "Greenland pernah dihuni oleh bangsa Viking yang datang dari Islandia. Norwegia dan Denmark sejak itu berselisih mengenai pulau tersebut, meskipun mereka tidak mempunyai hak nyata atas pulau tersebut. Sudah saatnya kita menuntut pengembalian Greenland kepada pemilik sahnya. Jika mereka menghargai warisan dan sejarah mereka, mereka akan menyerahkannya kepada kita tanpa syarat. Mari kita lanjutkan jalan kita menuju kejayaan!"
 ICE_securing_the_north_sea_passage: "Mengamankan Lintasan Laut Utara"
 ICE_securing_the_north_sea_passage_desc: "Ini saatnya untuk mengambil kembali apa yang seharusnya menjadi milik Islandia. Pulau Shetland dan Faroe di Laut Utara merupakan kunci penting untuk mengendalikan jalur ke dan dari [ROOT.GetNameDef]."
 ICE_vinland: "Vinland"
 ICE_vinland_desc: "Gagasan Kekaisaran Atlantik Utara lahir dengan ditemukannya benua Amerika oleh Leifur Eiríksson, yang merupakan keturunan Islandia. Sayangnya, koloni viking di Vinland musnah, tapi sekaranglah waktunya untuk mewujudkan impian kita yang telah lama hilang menjadi kenyataan. Untuk Odin!"
 ICE_the_armed_forces_of_iceland: "Angkatan Bersenjata Islandia"
 ICE_the_armed_forces_of_iceland_desc: "Jika terjadi perang di Islandia, Islandia harus mampu mempertahankan diri. Kita harus mulai membangun kekuatan yang mampu mengalahkan siapa pun yang akan menjadi penjajah. Ini adalah pulau kecil, dengan populasi kecil, namun lokasi dan ukurannya dapat menjadi kekuatan tersendiri karena tidak ada musuh yang mampu mengerahkan kekuatan besar untuk merebutnya."
 ICE_an_airbase_in_the_sea: "Pangkalan Udara di Laut"
 ICE_an_airbase_in_the_sea_desc: "Dengan mendominasi langit di atas pulau, dan laut di sekitarnya, kita bisa memastikan tidak ada musuh yang bisa mendarat di sini dengan kekuatan. Dan bahkan jika mereka melakukan hal tersebut, angkatan udara dapat memastikan bahwa musuh selalu kekurangan pasokan yang diperlukan. Jadi, cara alami untuk membangun angkatan bersenjata Islandia adalah dengan membangun angkatan udara modern."
 ICE_a_naval_hub_in_the_atlantic: "Pusat Angkatan Laut di Atlantik"
 ICE_a_naval_hub_in_the_atlantic_desc: "Islandia adalah sebuah pulau. Menjadikan armada sebagai kekuatan utama angkatan bersenjata sangatlah masuk akal. Ia dapat menghentikan musuh mencapai pantai kita, dapat mendukung sekutu kita dalam mendominasi lautan, dan dapat membawa pasukan ekspedisi ke mana pun mereka pergi. Membangun angkatan laut yang kuat adalah pilihan yang jelas bagi Islandia."
 ICE_mine_iceland: "Milik saya Islandia"
 ICE_mine_iceland_desc: "Dalam hal jalur angkatan laut, Islandia sangat tersingkap di segala arah kecuali utara. Untuk menjamin keselamatan masyarakat di pulau kami, kami harus bersiap untuk melakukan penambangan besar-besaran di perairan Islandia jika terjadi konflik terbuka."
 ICE_flying_boats: "Kapal Terbang"
 ICE_flying_boats_desc: "Jika kita tidak bisa bersaing melawan musuh-musuh kita di dalam air, maka kita akan memilih pilihan terbaik berikutnya, yaitu langit. Karena jika kita mengendalikan langit, musuh kita tidak akan berguna bagi kapal mereka, karena mereka akan tenggelam dalam sekejap."
 ICE_modernizing_the_coast_guard: "Modernisasi Penjaga Pantai"
 ICE_modernizing_the_coast_guard_desc: "Penjaga Pantai Islandia telah lama menjadi kekuatan utama kami yang digunakan untuk keamanan internal dan eksternal. Oleh karena itu, kita harus memastikan bahwa mereka dapat mengikuti perkembangan pesat modernisasi dan kemajuan teknologi."
 ICE_low_cost_aircrafts: "Pesawat Berbiaya Rendah"
 ICE_low_cost_aircrafts_desc: "Apa yang kami tidak miliki adalah industri besar, namun yang kami miliki hanyalah segelintir individu yang tahu cara mengoptimalkan konstruksi pesawat. Kita harus memanfaatkan bakat-bakat mereka sehingga meskipun perekonomian kita memang lemah, kita dapat tetap bersaing dalam perlombaan senjata udara."
 ICE_support_equipment: "Peralatan Pendukung"
 ICE_support_equipment_desc: "Setiap unit tentara, serta polisi antihuru-hara dapat menggunakan persenjataan yang lebih berat, serta peralatan P3K yang memadai dan senjata penekan. Oleh karena itu, kita harus memastikan untuk berinvestasi dalam hal ini sesegera mungkin."
 ICE_emergency_conversions: "Konversi Darurat"
 ICE_emergency_conversions_desc: "Meskipun negara ini belum tentu mempunyai kapasitas untuk kapal-kapal besar, kita mempunyai banyak kapal penangkap ikan, kapal dagang, dan kapal perusahaan swasta yang lebih besar. Dalam keadaan darurat, kita dapat menempatkan senapan mesin atau meriam yang lebih ringan di sana, dan dengan cepat dan efisien menciptakan kekuatan angkatan laut yang cukup besar untuk bersaing dengan sebagian besar pesaing."
 ICE_emergency_conversions_tt: "Membuka §Ydecisions§! untuk mengubah §YConvoys§! menjadi §YDestroyers§! atau §YCruisers§!"
 ICE_enact_conscription: "Ini dia"
 ICE_enact_conscription_desc: "Ketika masa depan bangsa kita semakin tidak jelas, pertahanan menjadi prioritas utama. Untuk memperbaiki fakta bahwa angkatan bersenjata kita hampir tidak ada, kita harus memberlakukan wajib militer bagi semua generasi muda kita."
 ICE_a_profesional_army: "Profesionalisasikan Angkatan Darat"
 ICE_a_profesional_army_desc: "Tentara saat ini terlalu lemah untuk dapat mempertahankan pulau kami dengan baik, dan satu-satunya cara untuk menyelesaikan masalah ini adalah dengan memastikan bahwa pasukan kami hanya terdiri dari orang-orang terbaik, yang akan berjuang sampai akhir."
 ICE_thungur_hnifur: "Þungur Hnífur"
 ICE_thungur_hnifur_desc: "Tentara Islandia tidak akan pernah berjumlah besar. Untuk mengimbanginya, kita harus memastikan bahwa kita memberikan pelatihan terbaik kepada pasukan kita dan fokus pada kekuatan kita, sehingga ketika kita menyerang, pukulannya akan berat."
 ICE_thungur_hnifur_idea: "Pasukan Elit"
 ICE_civilian_war_duty: "Pertahanan Sipil"
 ICE_civilian_war_duty_desc: "Penting bagi warga negara kita untuk mengetahui dengan tepat bagaimana harus bertindak jika perang atau krisis terjadi di rumah kita, dan bahwa setiap warga sipil siap melakukan tugas mereka, seperti memberikan bantuan logistik, pemadaman kebakaran, dan distribusi, ketika saatnya tiba."
 ICE_doctrinal_studies: "Studi Doktrinal"
 ICE_doctrinal_studies_desc: "Seni berperang bukanlah sesuatu yang mudah, apalagi yang bisa dikuasai oleh setiap bangsa. Kita perlu mempelajari kekuatan global dan belajar dari cara mereka berperang."
 ICE_death_from_above: "Kematian Dari Atas"
 ICE_death_from_above_desc: "Jika kita memenangkan perang di udara, kita memenangkan perang tersebut, dan kita memenangkannya dengan cepat. Lebih cepat lagi, jika kita meningkatkan kerja sama antara angkatan udara dan angkatan darat, dan melatih resimen para-penembak khusus yang siap menghancurkan jalur pasokan musuh sedapat mungkin."
 ICE_we_shall_defend_our_island: "Kami Akan Mempertahankan Pulau Kami"
 ICE_we_shall_defend_our_island_desc: "Pulau kami adalah rumah kami, dan tidak ada seorang pun yang mengetahuinya sebaik kami. Dengan mengkhususkan pasukan kita dalam pertempuran di pegunungan, kita dapat mundur dari pantai dan menghancurkan musuh-musuh kita segera setelah mereka mendarat dan mulai merasa percaya diri dan berpuas diri."
 ICE_taking_the_fight_to_our_enemies: "Melawan Musuh Kita"
 ICE_taking_the_fight_to_our_enemies_desc: "Laut mengelilingi kita, dan selama berabad-abad, lautan luas telah membentuk manusia dan jati diri kita. Dengan memanfaatkan pengetahuan yang kami peroleh dari sini, kami dapat melakukan perlawanan terhadap musuh kami, di lokasi yang paling tidak mereka duga."
#### DENMARK ####
#Economical/Industrial Branch
 DEN_kanslergadeforliget: "Lanjutkan Kanslergadeforlig"
 DEN_kanslergadeforliget_desc: "Depresi Hebat masih terasa di [ROOT.GetName] dengan melonjaknya angka pengangguran dan gagalnya sektor pertanian. Kita perlu menjangkau seluruh partai dan mencapai kesepakatan tentang cara mengatasi krisis yang kita hadapi."
 DEN_devalue_the_krone: "Devaluasi Krone"
 DEN_devalue_the_krone_desc: "Dengan mendevaluasi Krone, produk pertanian kita akan lebih kompetitif di pasar internasional dan akan meningkatkan peluang ekspor, yang pada gilirannya akan meringankan penderitaan para petani."
 DEN_remove_economic_crisis_in_730_days_tt: "§Y$DEN_economic_crisis_dynamic_modifier$§! akan dihapus dalam 730 hari"
 war_will_cancel_deal_tt: "§YPerang antar negara akan merusak kesepakatan ini§!"
 DEN_effects_after_fortify_our_borders_tt: "Telah menyelesaikan fokus §Y$DEN_fortify_our_borders$§!:"
 DEN_trade_with_britain: "Berdagang dengan Inggris"
 DEN_trade_with_britain_desc: "[ENG.GetNameDefCap] secara historis merupakan pasar ekspor terbesar kami untuk produk pertanian, namun setelah Depresi Besar, perdagangan ini hampir berhenti. Dengan devaluasi Krone, inilah waktunya untuk menghubungi Inggris untuk mencoba dan membangun kembali hubungan perdagangan kita sebelumnya."
 DEN_trade_with_germany: "Berdagang dengan Jerman"
 DEN_trade_with_germany_desc: "[GER.GetNameDefCap] secara historis mengimpor produk pertanian kita dalam jumlah besar, dan bahkan Perang Besar pun tidak dapat menghentikan hal ini. Namun dalam beberapa tahun terakhir, perdagangan antara kedua negara mengalami penurunan. Mungkin sekarang adalah waktu yang tepat untuk mencoba membalikkan tren ini!"
 DEN_agricultural_subsidies: "Subsidi Pertanian"
 DEN_agricultural_subsidies_desc: "Petani kami telah berjuang dengan krisis utang dan penyitaan. Rasa tidak berdaya dan marah telah membara di antara mereka selama beberapa waktu dan berisiko berkembang menjadi sesuatu yang lebih berbahaya jika tidak dikendalikan. Situasi ini harus kita atasi dan bantu sektor agraria sebaik mungkin."
 DEN_industrial_investments: "Investasi Industri"
 DEN_industrial_investments_desc: "Pusat-pusat perkotaan pun tidak luput dari gejolak yang terjadi dalam beberapa tahun terakhir. Pengangguran meroket, meninggalkan dunia usaha di ambang kebangkrutan atau bahkan gagal total. Kita dapat mengambil tindakan dengan memberikan paket bantuan yang tepat sasaran kepada sektor industri untuk menstabilkan situasi."
 DEN_support_schleswigian_farmers: "Dukung Petani Schleswigian"
 DEN_support_schleswigian_farmers_desc: "Ada peningkatan gerakan-gerakan pinggiran di Jutlandia Selatan, yang pada akhirnya dipicu oleh situasi ekonomi yang sulit dan gesekan mengenai identitas kolektif mereka; apakah mereka orang Jerman atau orang Denmark? Kita mungkin dapat memitigasi perbedaan pendapat ini dengan meningkatkan stimulasi ekonomi di kawasan."
 DEN_public_works: "Pekerjaan Umum"
 DEN_public_works_desc: "Dengan mengeluarkan program pekerjaan umum, kita tidak hanya dapat meningkatkan infrastruktur negara kita dengan membangun jembatan yang menghubungkan pulau-pulau kita, namun kita juga dapat memulai pembangunan proyek perumahan baru dan menurunkan tingkat pengangguran yang masih tinggi."
 DEN_fortify_our_borders: "Perkuat Perbatasan Kita"
 DEN_fortify_our_borders_desc: "Ketegangan kembali meningkat di seluruh Eropa. Meskipun kita berhasil melewati Perang Besar tanpa cedera, tidak ada jaminan hal itu akan terjadi lagi. Kita harus bersiap menghadapi kemungkinan terburuk sambil berharap yang terbaik. Mempertahankan perbatasan dan kemerdekaan kami adalah prioritas utama kami!"
 DEN_build_a_modern_dannevirke: "Bangun Dannevirke Modern"
 DEN_build_a_modern_dannevirke_desc: "Orang Denmark telah membangun benteng berat yang menghadap daratan Eropa selama berabad-abad, yang paling terkenal adalah Dannevirke. Ketika [GER.GetNameDef] sekali lagi mempersenjatai diri dan menggerakkan negara-negara besar di sekitar kita, kita harus membangun Dannevirke modern untuk melindungi perbatasan kita."
 DEN_unlocks_fortification_efforts: "Membuka Keputusan: §YUpaya Fortifikasi§!"
 DEN_refortify_tunestillingen: "Perkuat kembali Tunestillingen"
 DEN_refortify_tunestillingen_desc: "Terakhir kali Eropa dilanda perang, kami mempersiapkan pertahanan kami dengan membangun Tunestillingen - serangkaian benteng untuk melindungi København. Benteng-benteng ini telah rusak, tetapi dengan membangun kembali dan memodernisasinya, kita akan menjamin keamanan ibu kota kita."
 DEN_secure_our_supply_lines: "Amankan Jalur Pasokan Kami"
 DEN_secure_our_supply_lines_desc: "Pasukan berbaris dengan perutnya - hal ini sama benarnya saat ini dan ribuan tahun yang lalu. Syukurlah, kami adalah produsen makanan yang besar dan dengan beberapa perbaikan pada logistik kami, kami dapat mengamankan pasokan yang stabil untuk pasukan."
 DEN_fortify_the_islands: "Perkuat Kepulauan"
 DEN_fortify_the_islands_desc: "Seluruh Denmark Timur terletak di ratusan pulau, dan angkatan laut kita tidak cukup besar untuk melindungi pulau-pulau tersebut dari armada tetangga kita yang jauh lebih besar. Dengan membangun benteng pantai di lokasi-lokasi penting, kita mungkin bisa mengusir calon penyerbu."
 DEN_unlocks_coastal_fortification_efforts: "Membuka Keputusan: §YUpaya Fortifikasi Pesisir§!"
 DEN_connect_the_islands: "Hubungkan Kepulauan"
 DEN_connect_the_islands_desc: "[ROOT.GetNameDefCap] terdiri dari banyak pulau dimana satu-satunya titik yang menghubungkan kita ke daratan adalah di selatan Jutlandia. Untuk memfasilitasi perjalanan di seluruh negara kita, dan terutama antar pulau, kita harus membangun jembatan yang mempererat hubungan kita."
 DEN_expand_institut_for_teoretisk_fysik: "Perluas Institut Teoretisk Fysik"
 DEN_expand_institut_for_teoretisk_fysik_desc: "Institut Teoretisk Fysik adalah otoritas fisika terkemuka dunia dan didirikan oleh fisikawan teoretis Niels Bohr. Dengan mendanai lembaga ini dan memperluas fasilitasnya, kita akan mendapatkan manfaatnya, dan bahkan berpotensi merekrut Niels Bohr sendiri untuk tujuan kita..."
 DEN_aalborg_portland_cement_plant: "Pabrik Semen Aalborg Portland"
 DEN_aalborg_portland_cement_plant_desc: "Denmark daratan miskin sumber daya alam, namun produksi semen adalah salah satu aset yang kami miliki. Dengan memperluas Pabrik Semen Aalborg Portlands, kami akan mengamankan kemampuan konstruksi dalam negeri."
 DEN_improve_aalborg_portland_tt: "Hal ini akan meningkatkan Kepedulian Industri §Y$DEN_aalborg_portland$§! sebesar\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.00%§!"
 DEN_expand_the_industries: "Perluas Industri Kami"
 DEN_expand_the_industries_desc: "Denmark secara tradisional mengandalkan pertanian, yang masih merupakan ekspor terbesar kami. Jika kita melakukan diversifikasi dan memperluas industri lain, kita akan memperkuat perekonomian secara keseluruhan dan membuat masyarakat Denmark lebih kuat terhadap perubahan mendadak."
 DEN_develop_remote_islands: "Membuka Keputusan: §YMembangun Kepulauan§!"
 DEN_support_the_faroes_industries: "Mendukung Industri Faroe"
 DEN_support_the_faroes_industries_desc: "Di masa yang penuh ketidakpastian ini, akan lebih bijaksana jika kita mendukung beberapa industri yang ada di Kepulauan Faroe, sehingga klaim kita atas kepulauan yang letaknya strategis ini tidak dapat disangkal."
 DEN_support_bornholms_industries: "Mendukung Industri Bornholms"
 DEN_support_bornholms_industries_desc: "Walaupun Bornholm kekurangan sumber daya alam yang besar, ada baiknya kita berinvestasi pada beberapa industri di Bornholm, dan pada saat yang sama mengingatkan semua tetangga kita tentang pulau milik Bornholm."
 DEN_develop_greenland: "Mengembangkan Greenland"
 DEN_develop_greenland_desc: "Denmark Daratan hanya memiliki sedikit sumber daya alam yang dapat kami kembangkan dan gunakan dalam produksi dalam negeri. Sebaliknya, kepemilikan kita atas Greenland jauh lebih kaya akan sumber daya ini, dan jika kita berinvestasi dan mengembangkan Greenland, kita akan memperoleh manfaatnya."
 DEN_expand_the_ivittuut_mine: "Perluas Tambang Ivittuut"
 DEN_expand_the_ivittuut_mine_desc: "Tambang di Ivittuut adalah satu-satunya sumber daya aluminium kami, yang merupakan komponen penting dalam produksi pesawat modern. Dengan memperluas tambang ini, kita dapat meningkatkan produksi pesawat terbang dalam negeri atau mengekspor aluminium ke negara lain."
 DEN_prospecting_new_sites: "Mencari Situs Baru"
 DEN_prospecting_new_sites_desc: "Tambang tua di Qaarsuarsuk telah habis, tetapi terdapat deposit lain di wilayah Qullissat. Membuka tambang baru di sini akan sangat bermanfaat tidak hanya bagi industri di Greenland tetapi juga memenuhi kebutuhan kita di dalam negeri."
 DEN_protect_greenland: "Lindungi Greenland"
 DEN_protect_greenland_desc: "Greenland telah menjadi bagian dari wilayah kita sejak lama, dengan klaim atas pulau tersebut sejak Zaman Viking. Kehilangan pulau ini akan menjadi bencana nasional dan kehilangan gengsi yang sangat besar. Untuk mencegah potensi serangan terhadap pulau tersebut, kita perlu memperkuat pertahanannya."
 DEN_danske_stalvalsevaerket: "Danske Stålvalseværket"
 DEN_danske_stalvalsevaerket_desc: "Beberapa perwakilan dari sektor industri telah mengkampanyekan peningkatan produksi baja. Jika kami mendirikan pabrik baru, hal ini dapat meningkatkan perekonomian dan membuat kami lebih mandiri dalam produksi baja."
 DEN_reorient_production_lines: "Reorientasi Jalur Produksi"
 DEN_reorient_production_lines_desc: "Kita berada dalam situasi genting di mana kita mungkin memerlukan lebih banyak peralatan militer dalam waktu dekat. Untuk mengakomodasi meningkatnya kebutuhan akan senjata militer, kita perlu mengubah pabrik sipil menjadi produksi senjata."
 DEN_strengthen_military_industries: "Memperkuat Industri Militer"
 DEN_strengthen_military_industries_desc: "Berinvestasi dalam industri senjata militer yang kuat terbukti penting di masa depan. Kita perlu memastikan bahwa kita sudah siap jika kita perlu mengangkat senjata untuk melindungi rakyat kita."
 DEN_protect_the_faroe_islands: "Lindungi Kepulauan Faroe"
 DEN_protect_the_faroe_islands_desc: "Dengan meningkatnya ketegangan dunia, Laut Utara mungkin akan segera mengalami beberapa konflik besar. Kepulauan Faroe adalah penghubung penting dalam kemampuan kita untuk mengendalikan Greenland dan banyak sumber dayanya. Kehilangan kepulauan ini bisa berakibat buruk bagi kita, jadi sangatlah penting bagi kita untuk menjaga pertahanannya."
 DEN_protect_bornholm: "Lindungi Bornholm"
 DEN_protect_bornholm_desc: "Bornholm berlokasi berbahaya di selatan [SWE.GetNameDef] dan utara [GER.GetNameDef], lebih dekat ke kedua negara dibandingkan dengan wilayah Denmark lainnya. Kita harus memperkuat pulau yang berlokasi strategis di Baltik ini dan mengamankan kendali kita atas pulau tersebut."
#Historical Branch
 DEN_declare_neutrality: "Tegaskan kembali Netralitas"
 DEN_declare_neutrality_desc: "Ketidakmampuan kami selama perang terakhir sangat bermanfaat bagi kami dan menghindarkan kami dari kengerian perang. Menyatakan netralitas kita mungkin bisa menyelamatkan kita lagi."
 DEN_political_unity: "Persatuan Politik"
 DEN_political_unity_desc: "Hanya dengan bekerja sama dan bekerja sesuai garis partai kita dapat berharap untuk menjaga keamanan negara kita. Mengesampingkan perbedaan politik adalah hal yang sangat penting, dan hanya dengan bersikap pragmatis kita dapat melindungi Denmark."
 DEN_policy_of_disarmament: "Kebijakan Perlucutan Senjata"
 DEN_policy_of_disarmament_desc: "Kita telah menerapkan kebijakan perlucutan senjata selama beberapa dekade, dan hal ini merupakan salah satu alasan mengapa kita terhindar dari kengerian Perang Besar. Dengan bersikap tidak mengancam terhadap tetangga mana pun, kali ini kita mungkin juga akan terhindar."
 DEN_import_machinery_and_material: "Impor Mesin dan Material"
 DEN_import_machinery_and_material_desc: "Jika kita ingin bersaing dengan kekuatan industri negara-negara tetangga, kita harus cerdas dalam hal ini. Mengimpor peralatan dan bahan modern dari negara-negara maju akan meningkatkan kemampuan kita dan mengembangkannya lebih jauh lagi."
 DEN_modernize_agricultural_machinery: "Modernisasi Mesin Pertanian"
 DEN_modernize_agricultural_machinery_desc: "Modernisasi mesin dan teknologi pertanian dapat menghasilkan panen yang melimpah dengan efisiensi yang lebih besar dan dengan demikian meningkatkan produksi."
 DEN_develop_jutland_states_tt: "Membuka Keputusan: §YMembangun Wilayah Jutlandia§!"
 DEN_agricultural_reinvestments: "Investasi Kembali Pertanian"
 DEN_agricultural_reinvestments_desc: "Pertanian menjadi lebih efisien melalui mekanisasi dan pengenalan mesin-mesin baru yang kami impor dan gunakan. Menginvestasikan kembali peningkatan pendapatan pajak dari sektor ini dapat lebih meningkatkan efisiensi."
 DEN_industrial_reinvestments: "Investasi Kembali Industri"
 DEN_industrial_reinvestments_desc: "Modernisasi pertanian telah membebaskan masyarakat dari pekerjaan mereka di ladang. Berinvestasi kembali di pusat-pusat industri perkotaan akan menawarkan peluang kerja baru yang dapat diisi oleh orang-orang tersebut, dan dengan demikian akan meningkatkan hasil industri kita."
 DEN_increase_produce_production: "Meningkatkan Produksi Pangan"
 DEN_increase_produce_production_desc: "Investasi ulang yang kami lakukan telah membuahkan hasil dan semua orang, mulai dari lahan pertanian kecil hingga koperasi besar, menjadi makmur. Kita sekarang sangat cocok untuk meningkatkan produksi pangan lebih jauh lagi."
 DEN_modernize_industrial_machinery: "Modernisasi Mesin Industri"
 DEN_modernize_industrial_machinery_desc: "Denmark secara tradisional merupakan negara dengan perekonomian agraris dan bergantung pada ekspor makanan, namun industri perkotaan menjadi semakin penting selama beberapa dekade. Dengan berinvestasi pada permesinan modern, industri dapat tumbuh lebih besar lagi."
 DEN_develop_island_states_tt: "Membuka Keputusan: §YMengembangkan Wilayah Sabuk Besar§!"
 DEN_increase_industrial_production: "Meningkatkan Produksi Industri"
 DEN_increase_industrial_production_desc: "Industri perkotaan menjadi semakin penting akhir-akhir ini seiring dengan meningkatnya lapangan kerja dan output perekonomian. Meskipun industri kita telah meningkatkan kemampuannya, mereka akan menjadi lebih efisien."
 DEN_research_and_development: "Berinvestasi dalam Penelitian dan Pengembangan"
 DEN_research_and_development_desc: "Minyak dan mesin adalah hal yang membuat masyarakat modern terus berkembang, dan kita telah tertinggal dalam hampir semua bidang tersebut. Kita harus memastikan bahwa kita tidak tertinggal lebih jauh."
 DEN_north_sea_oil_drilling: "Pengeboran Minyak Laut Utara"
 DEN_north_sea_oil_drilling_desc: "Para pencari telah menemukan cadangan minyak di luar pantai Nørrejylland. Jika kita dapat mengekstraksi cadangan ini, ketergantungan kita pada pasar perdagangan yang berubah-ubah akan berkurang dan kita akan menjadi lebih mandiri."
 DEN_potential_refinery_tt: "Dengan §Y$synth_oil_experiments$§! diteliti, tambahkan §G1§! Slot Bangunan dan §G1§! §Y$synthetic_refinery$§! di §Y$STATE_99$§!."
 DEN_increase_maritime_trade: "Meningkatkan Perdagangan Maritim"
 DEN_increase_maritime_trade_desc: "Masa depan terletak pada lautan lepas dan armada dagang kita yang dapat mengekspor produk kita jauh dan luas. Negara kita mungkin kecil dalam hal populasi dan pengaruh politik, namun kita bisa menjadi kekuatan dagang yang besar."
 DEN_full_employment: "Pekerjaan Penuh"
 DEN_full_employment_desc: "Tanpa perlu mengeluarkan banyak biaya untuk berinvestasi di industri dan pertanian, kini kita dapat memetik manfaatnya. Kita telah melupakan tahun-tahun krisis ekonomi dan tingginya angka pengangguran. Negara ini bekerja dengan kapasitas penuh, dan bahkan kehabisan tenaga kerja. Kemakmuran ada di depan."
#Shared Political Branch
 DEN_social_stability: "Stabilitas Sosial"
 DEN_social_stability_desc: "Untuk menghindari ketidakstabilan sosial yang mengguncang negara lain, kita harus mengambil langkah preventif! Sebelum melakukan reformasi besar-besaran terhadap industri dan perekonomian pada umumnya, kita harus memiliki pendirian yang kokoh dan stabil."
 DEN_welcome_foreign_scientists: "Selamat Datang Ilmuwan Asing"
 DEN_welcome_foreign_scientists_desc: "Masalah kembali muncul di Eropa dan orang-orang melarikan diri dari rezim yang berusaha menindas mereka. Dengan menyambut beberapa dari mereka dengan tangan terbuka, kita dapat memperoleh banyak pengetahuan dan kompetensi."
 DEN_build_motorveje: "Membangun Motor Nasional"
 DEN_build_motorveje_desc: "Baru-baru ini banyak pembicaraan, dan bahkan beberapa perencanaan, sehubungan dengan jalan raya nasional. Membangun jaringan kendaraan bermotor akan memfasilitasi waktu perjalanan yang lebih cepat ke seluruh negeri, dan akan mempererat ikatan antar negara."
 DEN_heavy_market_regulations: "Peraturan Industri Berat"
 DEN_heavy_market_regulations_desc: "Perusahaan-perusahaan industri telah tumbuh besar dan kaya selama bertahun-tahun. Kekuasaan mereka terhadap perekonomian telah mengkhawatirkan banyak orang. Kita perlu menahan mereka dan menempatkan mereka di bawah pengawasan ketat untuk memastikan bahwa mereka tidak mengutamakan kepentingan perusahaan dan kepentingan negara."
 DEN_limited_market_regulations: "Peraturan Industri Terbatas"
 DEN_limited_market_regulations_desc: "Sektor industri semakin penting dalam perekonomian negara selama bertahun-tahun, dan bahkan terus berkembang. Kita perlu meredam dan mengatur mereka sedemikian rupa sehingga kita tidak mengganggu pertumbuhan mereka, namun cukup sehingga mereka tidak menjadi risiko keamanan bagi negara."
 DEN_no_market_regulations: "Cabut Semua Peraturan Industri"
 DEN_no_market_regulations_desc: "Industri-industri tersebut telah tumbuh dan berkembang meskipun ada peraturan yang berlaku di pasar – bukan karena peraturan tersebut. Jika kita benar-benar ingin bersaing dengan negara-negara lain di dunia dalam industri kita, kita perlu mencabut semua peraturan mengenai industri tersebut."
 DEN_industrial_research_bonus_tt: "Bonus Riset Industri: §G+5.00%§!"
 DEN_side_with_unions: "Berpihak pada Serikat Pekerja"
 DEN_side_with_unions_desc: "Hanya dengan memperbaiki kondisi kehidupan seluruh masyarakat di [Den.GetNameDef] kita dapat menyelesaikan permasalahan yang mengganggu pasar tenaga kerja, dan hanya dengan memperkuat serikat pekerja kita dapat mencapai hal tersebut."
 DEN_side_with_industry: "Berpihak pada Industri"
 DEN_side_with_industry_desc: "Untuk mengatasi permasalahan yang dihadapi dunia usaha, kita perlu menurunkan upah dan menerapkan bea masuk yang lebih tinggi terhadap barang-barang impor, jika tidak maka pengusaha akan kesulitan untuk berkembang."
 DEN_five_year_plan: "Perkenalkan Rencana Lima Tahun"
 DEN_five_year_plan_desc: "Untuk menjamin masa depan rakyat kita, kita harus membentuk sebuah komite yang mampu menghasilkan dan menerapkan model ekonomi baru yang berani untuk [DEN.GetNameDef]. Rencana Lima Tahun yang baru ini akan membuat kita benar-benar berkembang dan sejahtera!"
 DEN_limited_social_mobilization: "Mobilisasi Sosial Terbatas"
 DEN_limited_social_mobilization_desc: "Perang sedang terjadi di Eropa - namun kita tidak boleh lengah lagi!  Kita harus melakukan persiapan yang diperlukan, betapapun sulitnya, untuk mengamankan kedaulatan kita."
 #Rearmament Branch
 DEN_start_the_rearmament: "Mulai Persenjataan Kembali"
 DEN_start_the_rearmament_desc: "Sudah terlalu lama [DEN.GetNameDef] mengabaikan militer kita dan menyerahkan kedaulatan kita ke tangan negara tetangga. Dengan kekacauan yang melanda seluruh Eropa, hal ini tidak akan bertahan lama! Kita harus membangun kemampuan militer kita sekali lagi dan memastikan bahwa nasib kita ada di tangan kita sendiri."
 DEN_national_unity: "Persatuan Nasional"
 DEN_national_unity_desc: "Untuk mempersenjatai kembali dan membangun militer kita, hal ini memerlukan dukungan seluruh penduduk Denmark. Kita harus berusaha menyatukan masyarakat dan bergerak maju dengan tegas sebagai satu kesatuan."
 DEN_industrial_preparations: "Persiapan Industri"
 DEN_industrial_preparations_desc: "Kita harus mempersiapkan setiap aspek masyarakat kita untuk menghadapi perang – kita tidak boleh mengambil risiko lengah jika terjadi kejutan apa pun. Industri harus bersiap terlebih dahulu untuk menjadikan kita lebih mandiri, yang pada gilirannya akan meningkatkan kemampuan kita untuk menahan penjajah dalam jangka waktu yang cukup lama agar bantuan dapat segera tiba."
 DEN_military_preparations: "Persiapan Militer"
 DEN_military_preparations_desc: "Mempersiapkan industri untuk menghadapi serangan tidak akan ada gunanya kecuali tentara kita tidak dapat memukul mundur musuh. Kita harus memperkuat pertahanan kita dan memastikan bahwa pasukan kita mempunyai disiplin dan keberanian yang dibutuhkan untuk mempertahankan garis pertahanan."
 DEN_civilian_preparations: "Persiapan Sipil"
 DEN_civilian_preparations_desc: "Betapapun siapnya sektor militer dan industri, hal ini akan sia-sia jika tekad sipil runtuh dan rakyat dengan cepat melemah dalam membela diri dan mencari perdamaian. Kita harus mengeraskan keteguhan hati setiap orang Denmark dan memperkuat keyakinan mereka pada diri mereka sendiri."
 DEN_full_social_mobilization: "Mobilisasi Sosial Penuh"
 DEN_full_social_mobilization_desc: "Perang sudah di depan mata dan untuk mengamankan kebebasan kita, kita harus memobilisasi setiap aspek masyarakat. Setiap laki-laki, perempuan, dan anak-anak harus mengetahui tugas dan kewajibannya. Hal ini akan berdampak buruk, namun seluruh kapasitas industri kita harus diarahkan untuk mendukung persenjataan dan keamanan rakyat Denmark."
 DEN_seek_protection: "Carilah Perlindungan"
 DEN_seek_protection_desc: "Meskipun kita dapat mempersiapkan semua yang kita inginkan, kita dikelilingi oleh negara-negara tetangga yang lebih besar dan lebih kuat – yang tujuannya tidak dapat kita yakini sepenuhnya. Oleh karena itu, merupakan ide yang bagus untuk mencari perlindungan di tempat lain guna menjamin kemerdekaan kita."
 DEN_sign_non_aggression_deal: "Menandatangani Pakta Non-Agresi"
 DEN_sign_non_aggression_deal_desc: "Kita akan memperoleh keuntungan besar jika kita berhasil berteman dengan negara yang lebih kuat dan menandatangani pakta non-agresi dengan mereka. Hal ini mungkin tidak akan mengubah situasi genting kita dalam waktu dekat, namun pada akhirnya, hubungan yang lebih erat ini dapat menguntungkan kita dengan membuka berbagai perjanjian perdagangan dan meningkatkan kerja sama."
 DEN_sign_a_trade_deal: "Negosiasikan Kesepakatan Dagang"
 DEN_sign_a_trade_deal_desc: "Kami bersikeras untuk mempersenjatai kembali kekuatan militer kami, namun hal ini memerlukan waktu – waktu yang mungkin tidak kami miliki. Kita harus memperoleh lebih banyak peralatan dengan lebih cepat. Kita harus beralih ke negara yang ramah dan mendapatkan apa yang kita butuhkan karena kemampuan produksi kita terbatas."
 DEN_science_pact: "Masukkan Program Penelitian dan Kemitraan"
 DEN_science_pact_desc: "Meskipun kita telah mencapai kemajuan besar dalam kemajuan ilmu pengetahuan dan teknologi karena negara kita lebih menekankan pada industri, kita masih tertinggal dibandingkan negara-negara tertentu. Dengan beralih ke negara sahabat, kita dapat memasuki program penelitian dan kemitraan yang saling menguntungkan, sehingga semakin meningkatkan kemajuan kita."
 DEN_territory_for_protection: "Wilayah Perlindungan"
 DEN_territory_for_protection_desc: "Program persenjataan kembali berjalan sesuai rencana, namun masih terdapat keraguan di kalangan militer bahwa hal tersebut akan mencukupi. Kita bisa saja menjual sebagian wilayah kita untuk mendapatkan jaminan perlindungan yang lebih konkrit daripada sekadar membuat perjanjian non-agresi. Kesepakatan seperti itu bahkan dapat menguntungkan perekonomian kita."
 DEN_strength_in_numbers: "Kekuatan dalam Angka"
 DEN_strength_in_numbers_desc: "Jika kita ingin mempunyai kesempatan berperang melawan musuh yang jauh lebih kuat, kita perlu mencari sekutu – terkutuklah netralitas kita! Inilah saatnya untuk melupakan kenaifan ini dan beradaptasi dengan kenyataan dunia."
 DEN_military_cooperation_program: "Program Kerjasama Militer"
 DEN_military_cooperation_program_desc: "Setelah menjalin aliansi, kedua negara akan belajar satu sama lain dalam program kerja sama militer bersama. Dan untuk mempermanis kesepakatan tersebut, mereka setuju untuk mensubsidi peralatan militer yang dibeli dari sekutu baru kita untuk meningkatkan upaya persenjataan kita."
 DEN_joint_military_drills: "Latihan Militer Gabungan"
 DEN_joint_military_drills_desc: "Setelah bersikap netral sejak tahun 1864, pasukan Denmark sudah lama tidak terlibat dalam pertempuran sesungguhnya. Jika kita mendekati sekutu baru kita, kita bisa belajar banyak dari mereka, dan dengan melakukan latihan militer bersama, kedua negara akan mendapatkan pengalaman satu sama lain."
 DEN_nordic_security: "Keamanan Nordik"
 DEN_nordic_security_desc: "Setelah mengamankan kemerdekaan kita dengan aliansi baru, kita akhirnya dapat mengalihkan perhatian kita ke negara-negara Nordik lainnya. Kita harus meyakinkan mereka untuk bergabung dengan faksi kita sehingga kita semua dapat melindungi satu sama lain, dan jika mereka tidak mengerti alasan kita wajib melindungi mereka dari diri mereka sendiri."
#Monarchist Branch
 DEN_unify_the_right: "Satukan Kelompok Kanan"
 DEN_unify_the_right_desc: "[DEN.GetNameDefCap] telah terlalu lama dijalankan secara tidak bertanggung jawab! Hanya berkat ketabahan dan kegigihan rakyat Denmark kita masih dapat berfungsi sebagai sebuah negara. Sudah waktunya bagi partai-partai politik sayap kanan untuk akhirnya bersatu dalam tujuan bersama melawan ancaman kaum Kiri!"
 DEN_conservatives_support: "Dapatkan Dukungan dari Konservatif"
 DEN_conservatives_support_desc: "Meskipun sebagian besar Partai Konservatif tidak pernah bermimpi untuk bekerja sama dengan pihak seperti Bondepartiet atau DNSAP, masih ada pihak yang dapat melihat betapa tidak berdaya dan tidak siapnya [DEN.GetNameDef] menghadapi badai yang akan datang. Kita harus meyakinkan mereka untuk bergabung dengan tujuan kita!"
 DEN_conspire_with_the_officer_corps: "Bersekongkol dengan Korps Perwira"
 DEN_conspire_with_the_officer_corps_desc: "Dengan koalisi sayap kanan yang bersatu dengan mandat politik yang jauh lebih besar dan agenda yang lebih koheren, kita sekarang dapat mendekati korps perwira untuk membujuk setidaknya beberapa dari mereka agar mendukung kita."
 DEN_encourage_paramilitary: "Mendorong Organisasi Para-militer"
 DEN_encourage_paramilitary_desc: "Mendorong organisasi paramiliter berbasis lokal tidak hanya akan meningkatkan keamanan nasional jika terjadi perang tetapi juga meningkatkan rasa kebersamaan dan persatuan di antara warga negara."
 DEN_overthrow_the_government: "Menggulingkan Pemerintah"
 DEN_overthrow_the_government_desc: "Negara kita sudah terlalu lama dipimpin oleh orang-orang serakah yang hanya mementingkan diri mereka sendiri – mengabaikan semua bahaya yang mengancam rakyat Denmark. Sudah saatnya tatanan baru terbentuk dan mengantarkan era baru [DEN.GetNameDef]!"
 DEN_strengthen_the_officer_corp: "Perkuat Korps Perwira"
 DEN_strengthen_the_officer_corp_desc: "Perwira memainkan peran penting dalam keberhasilan operasi militer, dan untuk memastikan efektivitas angkatan bersenjata kita, kita harus memberikan penekanan baru pada penguatan korps perwira kita. Kita harus menumbuhkan generasi baru pemimpin yang terampil dan berdedikasi."
 DEN_king_assumes_power: "Raja Mengambil Kekuasaan"
 DEN_king_assumes_power_desc: "Kita membutuhkan tangan yang mantap untuk memimpin kita maju di masa-masa yang tidak menentu ini. Kita membutuhkan stabilitas dan tradisi. Raja mungkin bisa dibujuk untuk mengambil alih kekuasaan penuh atas pemerintahan di masa-masa sulit ini."
 DEN_konge_og_faedreland: "Untuk Konge dan Fædreland"
 DEN_konge_og_faedreland_desc: "Biarlah dedikasi dan kehormatan Raja Christian X yang tak tergoyahkan menjadi secercah harapan bagi masyarakat luas di masa-masa sulit ini. Kita harus bersatu sebagai bangsa untuk mempertahankan tanah air kita!"
 DEN_align_industries: "Menyelaraskan Industri dengan Kepentingan Nasional"
 DEN_align_industries_desc: "Kebutuhan akan alokasi sumber daya yang efisien dan hasil industri yang terfokus telah menjadi hal yang terpenting. Dengan mengoordinasikan upaya kami dan menyederhanakan produksi, kami akan memastikan bahwa setiap pabrik, setiap pekerja, dan setiap sumber daya dimanfaatkan secara maksimal dalam melayani [DEN.GetNameDef]."
 DEN_the_royal_guard: "Perluas Den Kongelige Livgarde"
 DEN_the_royal_guard_desc: "Royal Life Guards telah ditugaskan untuk melindungi keamanan Raja dan keluarganya selama hampir 300 ratus tahun dan telah membuktikan diri mereka berulang kali untuk berdedikasi dan tabah dalam tugas mereka. Dengan memperluas jumlah dan disiplin mereka, kita dapat memperkuat angkatan bersenjata kita lebih jauh lagi."
 DEN_economic_mobilization_strategy: "Strategi Mobilisasi Ekonomi"
 DEN_economic_mobilization_strategy_desc: "Kita harus mempersiapkan perekonomian dan masyarakat untuk menghadapi perang yang akan datang. Kita perlu menerapkan strategi ekonomi baru untuk memastikan bahwa industri akan berjalan seefisien mungkin, sekaligus meyakinkan rakyat Denmark untuk melakukan tugas mereka demi Raja dan negaranya."
 DEN_expand_kobenhavns_university: "Perluas Universitas Københavns"
 DEN_expand_kobenhavns_university_desc: "Kita tidak bisa mengambil risiko [DEN.GetNameDef] menjadi negara yang terbelakang secara teknologi. Berinvestasi dalam kemajuan ilmu pengetahuan dan pengembangan teknologi di Universitas Kopenhagens akan memastikan bahwa kita tidak tertinggal dari pesaing kita di bidang apa pun."
 DEN_scandinavian_security: "Keamanan Skandinavia"
 DEN_scandinavian_security_desc: "Skandinavia dan Laut Baltik telah menjadi titik fokus geopolitik utama [DEN.GetNameDef] selama beberapa abad terakhir. Sebelum mengalihkan fokus kita ke negara-negara besar Eropa di benua ini, pertama-tama kita harus menaklukkan dan menenangkan sisi utara kita."
 DEN_reintegrate_iceland: "Integrasikan kembali Pulau"
 DEN_reintegrate_iceland_desc: "Belum lama ini, [ICE.GetNameDef] menjadi bagian dari bangsa kita - dan telah menjadi bagian dari bangsa kita selama berabad-abad. Sudah saatnya kita meyakinkan masyarakat [ICE.GetAdjective] untuk bergabung dengan wilayah kita dan menjadi satu bangsa yang bersatu kembali."
 DEN_develop_iceland: "Pulau Kembangkan"
 DEN_develop_iceland_desc: "Posisi Islandia di Atlantik Utara menjadikannya kandidat utama untuk meluncurkan ekspedisi angkatan laut guna mengendalikan laut lepas. Dengan menyalurkan sumber daya dan dana ke wilayah ini, kita dapat lebih mengintegrasikannya ke wilayah yang lebih luas dan memanfaatkan posisi strategisnya dengan lebih baik."
 DEN_sway_the_nordics: "Goyangkan orang-orang Nordik"
 DEN_sway_the_nordics_desc: "Ada sesuatu yang bisa dikatakan tentang pepatah lama, 'Pena lebih kuat dari pada Pedang'. Akan lebih bijaksana jika kita mencoba membujuk negara lain untuk mendukung tujuan kita melalui cara-cara diplomatik, daripada menggunakan kekerasan."
 DEN_offer_protection: "Menawarkan Perlindungan"
 DEN_offer_protection_desc: "Untuk lebih meningkatkan pengaruh dan kekuatan kita di Kawasan Nordik dan sekitar Laut Baltik, kita harus membangun Hegemoni Denmark dengan menawarkan perlindungan yang tepat kepada mereka yang membutuhkan. Membela saudara-saudara kita di Nordik dan Baltik akan memperkuat keamanan di seluruh wilayah dan memberikan manfaat bagi kita semua."
 DEN_secure_swedish_steel: "Amankan Baja Swedia"
 DEN_secure_swedish_steel_desc: "[DEN.GetNameDefCap] adalah negara yang miskin sumber daya, kekurangan sebagian besar bahan yang dibutuhkan untuk menjalankan militer modern. Swedia di sisi lain memiliki banyak sumber daya alam – dan dulunya berada di bawah kekuasaan Denmark. Waktunya telah tiba untuk sekali lagi menyerahkan [SWE.GetNameDef] di bawah aturan kami."
 DEN_swedish_steel_production: "Produksi Baja Swedia"
 DEN_swedish_steel_production_desc: "Setelah mengamankan kekayaan mineral [SWE.GetNameDef] Utara di bawah kekuasaan kami, kami berada dalam posisi yang sangat baik untuk memanfaatkan semua tambang untuk meningkatkan kemampuan ekstraksi kami sendiri, tetapi juga untuk mengekspor sebagian kekayaan ke luar negeri - dengan imbalan jaminan keamanan."
 DEN_finish_off_finland: "Amankan Front Timur Kami"
 DEN_finish_off_finland_desc: "Kepentingan kita di Skandinavia utara akan selalu terancam kecuali kita mengamankan sisi Timur kita. Kita harus mengambil tindakan pencegahan untuk menjaga wilayah Finlandia!"
 DEN_reclaim_norway: "Rebut kembali Norwegia"
 DEN_reclaim_norway_desc: "Kerajaan Denmark memerintah [NOR.GetNameDef] selama ratusan tahun sebelum Swedia mengambilnya dari kami pada tahun 1814. Saudara laki-laki Raja, Raja Haakon dari [NOR.GetNameDef], telah menunjukkan dirinya tidak bersedia mengambil kendali langsung dan mengambil pilihan yang diperlukan untuk melindungi rakyatnya. Sudah waktunya untuk sekali lagi menyatukan kedua negara di bawah pemerintahan Denmark."
 DEN_train_mountain_infantry: "Pelatihan Gunung"
 DEN_train_mountain_infantry_desc: "Bagian Barat dan Utara Skandinavia merupakan daerah pegunungan – sesuatu yang tidak kita miliki di daratan Denmark. Kita harus melakukan latihan militer di pegunungan ini untuk meningkatkan kemampuan tempur kita guna melindungi wilayah kita dengan lebih baik."
 DEN_pan_scandinavianism: "Pan-Skandinavianisme"
 DEN_pan_scandinavianism_desc: "Skandinavia, dan pada tingkat lebih rendah seluruh kawasan Nordik, telah terjalin erat selama ribuan tahun melalui sejarah yang panjang dan sama. Dengan memanfaatkan hubungan yang sudah erat antara masyarakat kita, kita dapat mengambil langkah-langkah menuju unifikasi."
#Fascist Branch
 DEN_march_on_the_capital: "Berbaris di Ibukota"
 DEN_march_on_the_capital_desc: "Akhirnya tiba saatnya bagi partai kita untuk bangkit dan mengambil kendali masa depan [DEN.GetNameDef]. Kita harus berbaris di [ROOT.capital.GetCapitalVictoryPointName] dan membuat suara kita didengar! Ini akan menjadi awal era yang kuat dan aman dalam sejarah [DEN.GetAdjective]!"
 DEN_seize_power: "Rebut Kekuasaan"
 DEN_seize_power_desc: "[DEN.GetNameDefCap] akhirnya siap menerima pemerintahan fasis baru. Kami akan menghapuskan Rigsdag dan sebaliknya menyerahkan masa depan bangsa besar kami di tangan $DEN_cay_lembcke$. Namun, jika hanya ada sedikit perlawanan, kita harus bersiap untuk membasminya selamanya."
 DEN_ask_for_support: "Minta Dukungan"
 DEN_ask_for_support_desc: "[GER.GetAdjective]s merupakan contoh utama negara seperti apa yang ingin kita bangun. Oleh karena itu, tidak ada orang yang lebih baik yang dapat menjangkau dan meminta dukungan selama masa pemerintahan yang penuh gejolak ini. Kita harus mengirimkan delegasi ke [GER.capital.GetCapitalVictoryPointName] sesegera mungkin!"
 DEN_denmark_first: "Denmark Pertama"
 DEN_denmark_first_desc: "Kita telah mencapai kemajuan sejauh ini karena kemampuan kita sendiri, jadi mengapa kita harus menghubungi negara-negara besar untuk mendapatkan dukungan? Sebaliknya, [DEN.GetNameDef] akan berdiri sendiri, dan tumbuh menjadi sama relevannya dengan faksi-faksi besar lainnya di dunia. Tinggalkan Danmark!"
 DEN_rally_the_nation: "Kumpulkan Bangsa"
 DEN_rally_the_nation_desc: "Kini setelah kita menguasai negara ini, sangatlah penting bagi kita untuk menggalang dukungan dari rakyat. Meskipun mereka mungkin tidak bisa berbuat banyak untuk melawan kita, jauh lebih baik jika ada masyarakat yang berada di sisi kita dan siap berjuang demi bangsa mereka daripada ada masyarakat yang membawa pisau di punggung kita. Mari kita kembalikan kebanggaan [DEN.GetAdjective] dan galang rakyat untuk berjuang demi negaranya!"
 DEN_dano_german_military_cooperation: "Kerjasama Militer Dano-Jerman"
 DEN_dano_german_military_cooperation_desc: "Agar kita dapat memajukan militer kita hingga mencapai tujuan kita, mungkin penting bagi kita untuk mendekati sesama pemerintah di [GER.GetNameDef] dan meminta kerja sama militer dan teknologi. Dengan usulan ini, masa depan yang kami impikan untuk [DEN.GetNameDef] akan semakin dekat menjadi kenyataan."
 DEN_institute_corporatism: "Institut Korporatisme"
 DEN_institute_corporatism_desc: "Terinspirasi oleh model Italia, pekerja dan kapitalis dari berbagai sektor ekonomi harus berpartisipasi dalam pembuatan kebijakan nasional, sehingga kita dapat menjadi perantara antara kelompok-kelompok tersebut dan melaksanakan reformasi yang paling bermanfaat bagi perekonomian nasional. Hal ini akan membantu kita mengamankan masa depan politik yang kokoh untuk [DEN.GetNameDef]."
 DEN_experimental_technology: "Teknologi Eksperimental"
 DEN_experimental_technology_desc: "Saat kita mengembangkan mesin perang, kita juga harus memastikan bahwa sektor penelitian dan pengembangan terus memajukan eksperimennya. Sangat penting bagi kita untuk menyediakan dana yang dibutuhkan universitas dan laboratorium untuk terus mendorong perkembangan kita lebih jauh lagi."
 DEN_assault_troops: "Badai Afdeling"
 DEN_assault_troops_desc: "Meskipun tentara dapat mempertahankan garis pertahanan dan memukul mundur musuh sedikit demi sedikit, melalui kekuatan pasukan elit kita akan menemukan kekuatan yang dibutuhkan untuk menghancurkan ancaman apa pun yang kita hadapi. Kita harus memprioritaskan pelatihan mereka dan memastikan bahwa kita memiliki pasukan khusus yang patuh dan disiplin yang menunggu sebagai cadangan."
 DEN_prioritize_navy: "Prioritaskan Søværnet"
 DEN_prioritize_navy_desc: "Wilayah asal kami hanyalah sebuah semenanjung kecil, dan oleh karena itu sangat penting bagi kami untuk memprioritaskan pengembangan armada kami dalam penantian. Angkatan Laut [DEN.GetAdjective] suatu hari nanti bisa menyaingi [ENG.GetAdjective] atau [JAP.GetAdjective] tetapi hanya jika kita meluangkan waktu dan uang untuk memperbaikinya."
 DEN_prioritize_army: "Prioritaskan Hæren"
 DEN_prioritize_army_desc: "Tulang punggung militer mana pun adalah tentara. Jika kita menyalurkan sumber daya kita untuk pelatihan tentara dan produksi mesin serta peralatan perang, maka kita akan lebih dari siap menghadapi siapa pun yang berani mengancam [DEN.GetNameDef]."
 DEN_total_war: "Jumlah Krig"
 DEN_total_war_desc: "Kekalahan kita saat ini dalam perang ini tidak bisa diterima. Namun, ini bukanlah akhir. Kita harus mengerahkan pasukan kita dan bersiap menghadapi Krig total. Jika kita bisa memukul mundur musuh dan melemparkan semua yang kita punya ke arah mereka, maka kita punya peluang untuk melewati badai ini. Kumpulkan rakyat, mobilisasi industri terakhir kita, kita harus bertahan!"
 DEN_military_might: "Kekuatan Militer yang Bangkit Kembali"
 DEN_military_might_desc: "Kekuatan militer [DEN.GetNameDef] semakin kuat dari hari ke hari, namun selalu ada ruang untuk perbaikan. Mari kita fokuskan pendanaan kita pada Hæren dan Flyvevåbnet untuk meningkatkan pelatihan dan efisiensi mereka di lapangan."
#End Focuses
 DEN_avenging_1864: "Pembalasan tahun 1864"
 DEN_avenging_1864_desc: "Kekalahan yang memalukan pada tahun 1864 telah melukai bangsa kita selama lebih dari setengah abad. Sudah saatnya kita mengamankan perbatasan selatan kita untuk selamanya dan memastikan bahwa tidak ada musuh yang dapat lagi mendikte persyaratan apa yang harus kita patuhi."
 DEN_dominium_maris_baltici: "Dominium Maris Baltici"
 DEN_dominium_maris_baltici_desc: "[ROOT.GetNameDefCap] pernah menjadi negara paling kuat di sekitar Laut Baltik. Kita telah berperang melawan negara-negara Balt, Polandia, Rusia, dan yang terpenting, Swedia, untuk menguasai lautan. Kami sekarang siap untuk selamanya menempatkan seluruh wilayah di bawah kendali kami."
 DEN_establish_the_danelaw: "Danelagen"
 DEN_establish_the_danelaw_desc: "Ada suatu masa ketika kekuasaan kita terbentang di Laut Utara dan Inggris mematuhi hukum kita. Waktunya telah tiba untuk bangkit kembali dan mengamankan masa depan rakyat kita dengan mengamankan gelombang bencana. Kami akan memperkenalkan kembali Danelagen dan memaksa semua negara lain untuk memperhatikan kami!"
#Occupation Branch
 DEN_collaboration_government: "Samarbejdsregering"
 DEN_collaboration_government_desc: "Menandatangani perjanjian damai dan bekerja sama dengan [?DEN.DEN_overlord_nation.GetNameDef] adalah satu-satunya cara untuk menyelamatkan rakyat kita dari kehancuran dan kehancuran. Dengan membentuk pemerintahan kolaborasi yang bekerja erat dengan pasukan pendudukan [?DEN.DEN_overlord_nation.GetAdjective], kita akan diberikan kemerdekaan dan kedaulatan yang jauh lebih besar dibandingkan kebanyakan negara lain yang berada dalam situasi serupa."
 DEN_seek_independence: "Mencari Kemerdekaan"
 DEN_seek_independence_desc: "Kemerdekaan Denmark tidak lagi menjadi jaminan, meskipun kami bekerja sama dengan [?DEN.DEN_overlord_nation.GetNameDef]. Kita harus mengamankan kebebasan kita dengan melawan pasukan pendudukan dan melakukan serangan pada saat yang tepat."
 DEN_sanction_sabotages: "Sabotase Sanksi"
 DEN_sanction_sabotages_desc: "Meskipun kami bekerja sama dengan [?DEN.DEN_overlord_nation.GetNameDef], bukan berarti kami tidak bisa melawan pendudukan dengan cara damai. Ada yang berpendapat bahwa sebenarnya adalah tugas kita untuk melawan tanpa membahayakan rakyat kita."
 DEN_form_the_danish_freedom_council: "Denmark Frihedsråd"
 DEN_form_the_danish_freedom_council_desc: "Kita harus mengumpulkan koalisi dukungan yang luas dari semua partai politik yang menentang pendudukan dengan [?DEN.DEN_overlord_nation.GetNameDef] untuk membentuk dewan. Dewan Kebebasan ini dapat secara lebih efektif mengoordinasikan berbagai gerakan perlawanan yang muncul setelah invasi dan juga dapat mengoordinasikan potensi perang kemerdekaan."
 DEN_arm_the_resistance: "Persenjatai Perlawanan"
 DEN_arm_the_resistance_desc: "Segudang gerakan perlawanan bermunculan sejak pendudukan dimulai. Jika kita berharap dapat melepaskan diri dari penindasan [?DEN.DEN_overlord_nation.GetAdjective] kita harus mempersenjatai kelompok-kelompok ini dan mempersiapkan mereka ketika saatnya tiba ketika kita mendeklarasikan kemerdekaan kita sekali lagi."
 DEN_escalate_the_sabotages: "Tingkatkan Sabotase"
 DEN_escalate_the_sabotages_desc: "Semakin jelas bahwa kita harus berjuang untuk mendapatkan kembali kebebasan kita sekali lagi. Kita harus mengintensifkan upaya sabotase terhadap pendudukan [?DEN.DEN_overlord_nation.GetAdjective]."
 DEN_expand_the_resistance: "Perluas Perlawanan"
 DEN_expand_the_resistance_desc: "Meskipun terdapat banyak kelompok perlawanan dari berbagai lapisan masyarakat yang muncul sejak pendudukan dimulai, kita harus mengumpulkan lebih banyak orang ke kelompok ini jika kita ingin memukul mundur pasukan [?DEN.DEN_overlord_nation.GetAdjective] dari tanah kita."
 DEN_declare_independence: "Tegaskan Kemerdekaan Denmark"
 DEN_declare_independence_desc: "Waktunya telah tiba untuk mendeklarasikan kemerdekaan kita sekali lagi, dan jika perlu, perjuangkanlah!"
 DEN_secure_danish_freedom: "Amankan Kebebasan Denmark"
 DEN_secure_danish_freedom_desc: "Mengusir pasukan [?DEN.DEN_overlord_nation.GetAdjective] dari tanah kami tidak akan cukup untuk menjamin kebebasan Denmark. Kita harus memastikan bahwa [?DEN.DEN_overlord_nation.GetNameDef] tidak akan menjadi ancaman lagi."
 DEN_create_danforce: "Ciptakan Danforce"
 DEN_create_danforce_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap] telah melarang kita memiliki kekuatan militer yang cukup besar untuk benar-benar mengancam supremasi mereka. Kita harus mencari negara lain yang bebas dan bersahabat untuk melatih dan menyediakan kekuatan yang dapat berpartisipasi dalam membebaskan [DEN.GetNameDef] dari penindasan."
 DEN_buy_foreign_aircraft: "Mengakuisisi Pesawat Asing"
 DEN_buy_foreign_aircraft_desc: "Kita harus memperkuat Brigade Denmark dengan memperoleh pesawat terbang untuk menyaingi [?DEN.DEN_overlord_nation.GetNameDef] untuk supremasi di angkasa di atas [DEN.GetNameDef]."
 DEN_rigid_training: "Pelatihan Kaku"
 DEN_rigid_training_desc: "Angka saja tidak akan memberi kita supremasi di angkasa. Kita harus memberikan pelatihan yang ketat kepada pilot-pilot kita agar mereka dapat menjaga angkasa bebas dari pesawat [?DEN.DEN_overlord_nation.GetAdjective]."
 DEN_strengthen_the_danish_brigades: "Perkuat Brigade Denmark"
 DEN_strengthen_the_danish_brigades_desc: "Kita tidak akan bisa memiliki daya tembak yang sama dengan yang dimiliki [?DEN.DEN_overlord_nation.GetNameDef], jadi kita harus bertarung dengan cerdas dan mengecoh mereka. Kita harus mempelajari musuh-musuh kita dan menemukan kelemahan mereka untuk dapat mengeksploitasi mereka di medan perang."
 DEN_support_battalions: "Batalyon Pendukung"
 DEN_support_battalions_desc: "Jika Brigade Denmark ingin menjadi kekuatan yang berfungsi dan mempunyai kesempatan untuk membebaskan [ROOT.GetNameDef], mereka harus memiliki material yang memadai. Senapan dan senapan mesin semuanya baik-baik saja, tetapi dukungan artileri dan anti-udara adalah suatu keharusan di zaman sekarang ini."
 DEN_expand_the_brigades: "Perluas Brigade"
 DEN_expand_the_brigades_desc: "Untuk mengamankan peluang Brigade Denmark dalam membebaskan [ROOT.GetNameDef], kita perlu menambah lebih banyak tenaga kerja ke divisi mereka."
 DEN_establish_danske_flotille: "Mendirikan Armada Den Danske"
 DEN_establish_danske_flotille_desc: "Dengan membentuk armada di pengasingan, kita dapat melatih orang-orang dan mengadakan latihan angkatan laut yang akan mempertajam keterampilan mereka untuk membantu pembebasan tanah kita. Armada kita akan menghadapi perlawanan sengit di angkatan laut [?DEN.DEN_overlord_nation.GetAdjective] dan kita harus menang dengan cara apapun yang kita bisa."
 DEN_buy_foreign_ships: "Dapatkan Penghancur"
 DEN_buy_foreign_ships_desc: "Untuk mengamankan garis pantai [DEN.GetNameDef] dan banyak pulau, pertama-tama kita harus mengamankan armada yang mampu melindungi jalur laut kita. Dengan secara diam-diam mendekati negara-negara yang mungkin bersimpati terhadap penderitaan kita, kita mungkin bisa mendapatkan kapal perusak tua dari mereka untuk memperkuat angkatan laut kita."
 DEN_align_with_foreign_powers: "Selaras dengan Kekuatan Asing"
 DEN_align_with_foreign_powers_desc: "[?DEN.DEN_overlord_nation.GetNameDefCap] tidak akan menyerahkan satu inci pun tanah yang ditaklukkan tanpa perlawanan, dan kita tidak mungkin melawan kekuatan militer mereka sendirian. Jika kita ingin melepaskan belenggu penindasan dan mendapatkan kembali kebebasan, kita harus mencari sekutu potensial yang dapat membantu kita dalam kesulitan ini."
 DEN_seek_foreign_support_tt: "Membuka Keputusan: §YMencari Dukungan dari Kekuatan Asing§!"
 DEN_intel_sharing: "Berbagi Intel"
 DEN_intel_sharing_desc: "Memperdalam kerja sama dengan sekutu kita melawan [?DEN.DEN_overlord_nation.GetNameDef] dengan berbagi informasi intelijen antar negara kita akan memperkuat ikatan dan kemampuan kita untuk pada akhirnya menggulingkan penindasan [?DEN.DEN_overlord_nation.GetAdjective]."
 DEN_ask_for_weapons: "Minta Pengiriman Senjata"
 DEN_ask_for_weapons_desc: "Tuan [?DEN.DEN_overlord_nation.GetAdjective] kita terus menghabiskan persediaan senjata dan amunisi kita, melumpuhkan kemampuan kita untuk melawan ketika tiba saatnya untuk mendeklarasikan kemerdekaan kita sekali lagi. Kita bisa meminta sekutu kita untuk mengirimkan pasokan yang diperlukan untuk mengisi kembali persediaan kita yang kosong melalui udara."
 DEN_buy_allied_weapons: "Dapatkan Senjata Sekutu"
 DEN_buy_allied_weapons_desc: "Sebagai negara yang lebih kecil, kemampuan kita untuk memproduksi persenjataan terbatas – dan untuk menjamin kemerdekaan kita, kita harus memperoleh peralatan terbaik yang ada. Mungkin kita bisa meyakinkan sekutu kita untuk memasok senjata yang diperlukan melalui kesepakatan bersubsidi."
 DEN_align_with_overlord: "Sejajarkan dengan [?DEN.DEN_overlord_nation.GetNameDef]"
 DEN_align_with_overlord_desc: "Meskipun kami berhasil mempertahankan tingkat kemandirian yang tinggi dalam perjanjian damai dengan [?DEN.DEN_overlord_nation.GetNameDef], kami masih hanyalah boneka. Namun hal ini membuka peluang menarik bagi kita. Mungkin, jika kita menyelaraskan diri dengan [?DEN.DEN_overlord_nation.GetNameDef], kita bisa memanfaatkan tuan kita yang lebih kuat dan mengubah kekalahan ini menjadi kemenangan..."
 DEN_seek_industrial_investments: "Carilah Investasi Industri"
 DEN_seek_industrial_investments_desc: "Setelah menyelaraskan diri dengan [?DEN.DEN_overlord_nation.GetNameDef] dan mendapatkan kepercayaan serta dukungan mereka, kami mendapati diri kami berada dalam situasi yang menguntungkan di mana kami dapat meminta penguasa kami untuk berinvestasi di industri kami dan meningkatkan kemampuan produksi kami."
 DEN_pledge_allegiance: "Ikrar Kesetiaan"
 DEN_pledge_allegiance_desc: "Untuk dapat memanfaatkan sepenuhnya hubungan kita dengan [?DEN.DEN_overlord_nation.GetNameDef] kita harus mengikrarkan kesetiaan kita kepada mereka - agar mereka tidak meragukan ketulusan kita dalam ambisi kita untuk menciptakan kemitraan simbiosis, di mana kedua negara dapat tumbuh dan mendapatkan keuntungan."
 DEN_seek_military_investments: "Carilah Investasi Militer"
 DEN_seek_military_investments_desc: "Setelah menyatakan kesetiaan dan memperkuat hubungan dengan [?DEN.DEN_overlord_nation.GetNameDef], kini kami mendapat dukungan dari [?DEN.DEN_overlord_nation.GetLeader]. Hal ini memungkinkan kami untuk langsung menghubunginya untuk meminta investasi [?DEN.DEN_overlord_nation.GetAdjective] dalam produksi militer kami."
 DEN_petition_for_independence: "Petisi Kemerdekaan"
 DEN_petition_for_independence_desc: "Kami telah memainkan peran kami dan membantu master [?DEN.DEN_overlord_nation.GetAdjective] kami dalam semua upaya mereka. Kami telah menunjukkan diri kami sebagai orang yang dapat dipercaya dan diandalkan, sehingga sudah waktunya bagi kami untuk mengajukan petisi kemerdekaan, sambil tetap menjadi sekutu setia [?DEN.DEN_overlord_nation.GetNameDef]."
 DEN_seize_the_production: "Rebut Alat Produksi"
 DEN_seize_the_production_desc: "Saat-saat yang luar biasa membutuhkan tindakan yang luar biasa. Untuk mencapai potensi industri sepenuhnya, kita harus memanfaatkan alat-alat produksi. Hal ini akan memastikan bahwa industri dapat melayani kebutuhan negara dan berjalan seefisien mungkin."
 DEN_adjust_industrial_prioritize: "Sesuaikan Prioritas Industri"
 DEN_adjust_industrial_prioritize_desc: "Perang sedang terjadi dan kita harus bertindak sesuai dengan itu dengan menyesuaikan industri kita untuk memproduksi dan berkontribusi pada upaya perang. Setiap laki-laki dan perempuan harus memahami dan melaksanakan tugasnya tanpa mengeluh untuk melayani kebutuhan negara."
 DEN_increase_cooperation: "Peningkatan Kerja Sama"
 DEN_increase_cooperation_desc: "Meskipun kami mungkin tidak mau mengakuinya, kami tidak akan pernah mampu menahan invasi [?DEN.DEN_overlord_nation.GetAdjective] - dan dengan menyerah, kami memastikan tingkat otonomi tertentu yang tidak dapat dinikmati oleh negara lain di bawah [?DEN.DEN_overlord_nation.GetAdjective]. Oleh karena itu, kita harus berusaha untuk bekerja lebih erat dengan penguasa kita untuk mengamankan kemerdekaan ini dan mendapatkan manfaat dari hubungan ini."
 DEN_acquire_military_equipment: "Dapatkan Peralatan Militer"
 DEN_acquire_military_equipment_desc: "Sebagai negara yang lebih kecil, kemampuan kita untuk memproduksi persenjataan terbatas - namun untuk benar-benar berkontribusi pada upaya perang [?DEN.DEN_overlord_nation.GetFactionName] kita harus memperoleh peralatan terbaik yang ada. Mungkin kita bisa meyakinkan sekutu kita untuk memasok senjata yang diperlukan melalui kesepakatan bersubsidi."
 DEN_contribute_to_the_war: "Berkontribusi pada Upaya Perang"
 DEN_contribute_to_the_war_desc: "Meskipun kami telah menyatakan pendirian dan niat kami terhadap penguasa [?DEN.DEN_overlord_nation.GetAdjective] kami dengan jelas, mereka tidak akan mengizinkan kami untuk mengembangkan militer kami lebih jauh. Hanya dengan bergabung dengan [?DEN.DEN_overlord_nation.GetFactionName] dan berjanji untuk berkontribusi dalam upaya perang kita akan diizinkan untuk meningkatkan angkatan darat, angkatan laut, dan angkatan udara kita. Dan dengan dukungan [?DEN.DEN_overlord_nation.GetNameDef] kita dapat mengalihkan perhatian kita ke negara-negara Nordik lainnya..."
 DEN_secure_the_norwegian_coast: "Amankan Pantai Norwegia"
 DEN_secure_the_norwegian_coast_desc: "Denmark dan Norwegia telah bersatu selama berabad-abad, dan jika kita ingin menguasai Laut Utara, atau memperluas wilayah lebih jauh lagi, kita harus sekali lagi menyatukan negara kita. Pesisir Norwegia adalah batu loncatan penting jika kita ingin mendominasi Atlantik."
 DEN_reclaim_atlantic_islands: "Rebut Kembali Harta Milik Atlantik Kita"
 DEN_reclaim_atlantic_islands_desc: "Faroe dan Islandia mungkin tidak mempunyai sumber daya alam apa pun, namun wilayah ini tetap merupakan bagian dari wilayah kita dan memiliki kepentingan strategis yang sangat penting karena pulau-pulau tersebut bertindak sebagai batu loncatan untuk mendominasi Atlantik Utara.\n\nGreenland adalah satu-satunya wilayah di negara kita yang benar-benar memiliki sumber daya alam apa pun yang diperlukan untuk menjalankan militer yang modern dan efektif, sehingga menjadikannya sebagai prioritas utama kita."
 DEN_claim_sweden: "Klaim Swedia"
 DEN_claim_sweden_desc: "Swedia pernah menjadi rival terberat kami dan selalu berada di bawah dominasi kami selama berabad-abad. Berbeda dengan Denmark, Swedia memiliki sumber daya alam berlimpah yang diperlukan untuk menjalankan militer modern. Mungkin sudah tiba waktunya untuk sekali lagi memasukkan Swedia ke dalam lingkup kita, membuka semua sumber dayanya kepada kita..."
 DEN_safeguard_the_eastern_front: "Lindungi Front Timur"
 DEN_safeguard_the_eastern_front_desc: "Secara historis, Finlandia selalu berada di luar jangkauan kita, namun dengan kekuatan kita yang bangkit kembali, kita lebih dari mampu untuk menempatkannya di bawah hegemoni kita. Mengamankan Finlandia berarti mengamankan Front Timur kami dan memperkuat kendali kami atas Laut Baltik."
#Military Branch
 DEN_sign_forsvarsforliget: "Tandatangani Forsvarsforliget"
 DEN_sign_forsvarsforliget_desc: "Ketika ketegangan kembali meningkat di Eropa, kita harus mengakui bahwa kemampuan pertahanan kita saat ini sangat kurang. Menandatangani perjanjian pertahanan baru untuk meningkatkan pendanaan bagi angkatan darat, laut, dan udara akan memperkuat kemampuan militer kita dan menjamin integritas bangsa kita."
 DEN_stockpile_oil: "Timbunan Minyak"
 DEN_stockpile_oil_desc: "Kita harus bersiap menghadapi kemungkinan terburuk dan mulai bersiap menghadapi perang. Sekalipun kita tidak pernah melihat pertempuran, konflik besar di sekitar kita akan berdampak pada kita. Untuk meminimalkan dampak ini, kita perlu mengumpulkan cadangan sumber daya strategis dalam jumlah besar."
 DEN_potential_fuel_silos_tt: "Dengan meneliti §YPenyimpanan Bahan Bakar§!, tambahkan §G1§! Slot Bangunan dan §G1§! §YSilo Bahan Bakar§! di §Y2§! Negara Bagian."
 DEN_sikkerhedspolitiet: "Politik Sikkerheds"
 DEN_sikkerhedspolitiet_desc: "Membentuk badan intelijen akan membantu kita meningkatkan kewaspadaan ketika ketegangan di Eropa meningkat dan konflik mengancam mengikis kedaulatan kita."
 DEN_expand_vaernepligten: "Perluas Værnepligten"
 DEN_expand_vaernepligten_desc: "Militer bahkan hanya sekedar kekuatan biasa, dan sama sekali tidak mampu menghalangi calon penjajah. Jika mereka ingin benar-benar membela negara, kita perlu memperluas wajib militer kita dengan cepat."
 DEN_haeren_reorganization: "Reorganisasi Hæren"
 DEN_haeren_reorganization_desc: "Tentara Denmark berjumlah kecil dan sama sekali tidak siap untuk mempertahankan perbatasan kami. Negara ini harus diorganisasi kembali menjadi kekuatan tempur yang efektif dengan komando pusat yang efisien untuk mempertahankan kemerdekaan kita dan mencegah musuh potensial."
 DEN_expand_haerens_tekniske_korps: "Perluas Hærens Tekniske Korps"
 DEN_expand_haerens_tekniske_korps_desc: "Korps Teknis Angkatan Darat mengoperasikan Gudang Senjata dan Hærens Geværfabrik, yang memproduksi senjata dan amunisi. Memperluas fasilitas tersebut akan meningkatkan produksi senapan dan artileri, yang tentu saja akan memperkuat kemampuan militer kita."
 DEN_hjemmevaernet: "Hjemmeværnet"
 DEN_hjemmevaernet_desc: "Ada banyak orang yang siap bangkit dan membela Denmark dari penyerang mana pun. Kita harus memanfaatkan semangat juang orang-orang ini dengan membentuk penjaga rumah - kalau-kalau ada orang yang cukup bodoh untuk menyerang kita."
 DEN_expand_dansk_industri_syndikat: "Memperluas Sindikat Dansk Industri"
 DEN_expand_dansk_industri_syndikat_desc: "Dansk Industri Syndikat, atau yang biasa dikenal dengan Riffelsyndikatet, adalah produsen senjata terbesar di negara ini dan memproduksi senapan Madsen tentara kita. Berinvestasi dan memperluas pabrik-pabrik mereka merupakan kepentingan keamanan nasional."
 DEN_new_artillery_tactics: "Taktik Artileri Baru"
 DEN_new_artillery_tactics_desc: "Hærens Tekniske Korps memproduksi senjata, artileri, dan amunisi saat ini. Namun dengan mendirikan divisi eksperimental di Hærens Tekniske Korps, kami mungkin dapat merancang dan memproduksi artileri kami sendiri, sesuatu yang akan sangat bermanfaat bagi angkatan bersenjata."
 DEN_convert_automobile_production: "Konversi Produksi Mobil"
 DEN_convert_automobile_production_desc: "Saatnya telah tiba untuk memerintahkan produsen mobil Denmark mengubah jalur produksi sipil mereka untuk berkontribusi pada upaya perang dan mendukung kemampuan pertahanan kita. Mengamankan produksi truk kita sendiri dan melakukan mekanisasi pada pasukan kita ke tingkat yang lebih tinggi akan membuatnya lebih gesit dan fleksibel."
 DEN_slaedepatruljen_sirius: "Slædepatruljen Sirius"
 DEN_slaedepatruljen_sirius_desc: "Daratan Denmark hanya mendapat sedikit salju pada musim dingin, dan salju jarang bertahan lama. Namun, kita memiliki Greenland yang ketebalan saljunya mencapai beberapa kilometer sepanjang tahun. Kita dapat mengambil keuntungan dari hal ini dan melatih pasukan kita di sana untuk menyesuaikan diri mereka dengan cuaca dingin."
 DEN_generalkommandoen: "Komando Umum"
 DEN_generalkommandoen_desc: "Perwira yang terlatih, berdisiplin tinggi, dan berfungsi dengan baik adalah akar dari keberhasilan angkatan bersenjata. Kita harus bertujuan untuk menghasilkan perwira yang paling efisien dan kompeten di dunia dan mengisi staf umum kita dengan mereka."
 DEN_establish_domestic_tank_manufacturing: "Membangun Pabrik Tangki Dalam Negeri"
 DEN_establish_domestic_tank_manufacturing_desc: "Peperangan telah berubah secara signifikan pada abad ke-20 dan kita harus ikut berubah. Pasukan yang bergerak cepat dan tangguh adalah kunci kemenangan pertempuran saat ini. Mengamankan pasokan tank kita sendiri akan menjamin keberhasilan di medan perang modern."
 DEN_expand_ubadsvabnet: "Perluas Ubådsvåbnet"
 DEN_expand_ubadsvabnet_desc: "Perlindungan terbaik bagi garis pantai dan banyak pulau kita, adalah pulau yang tidak dapat dilihat oleh musuh. Memiliki armada kapal selam yang besar akan memungkinkan kita untuk menyerang tanpa diketahui dan menarik pasukan kita tanpa mengalami kerugian."
 DEN_add_basic_submarine_tech_tt: "Tambahkan Teknologi: §YKelas Havmanden§!"
 DEN_refit_civilian_ships: "Reparasi Kapal Tua"
 DEN_refit_civilian_ships_desc: "Kita dikelilingi oleh negara-negara yang memiliki angkatan laut jauh lebih besar daripada negara kita. Kita perlu meningkatkan jumlah kita jika kita ingin mengejar kemampuan mereka. Dengan jumlah kapal yang cukup, kita akan mampu menahan sebagian besar angkatan laut."
 DEN_refit_civilian_ships_decision_tt: "Buka keputusan untuk mereparasi konvoi untuk tujuan militer."
 DEN_modernize_the_navy: "Modernisasi Angkatan Laut"
 DEN_modernize_the_navy_desc: "Jika kita ingin bersaing dengan angkatan laut terbaik saat ini, kita harus mengutamakan kualitas daripada kuantitas. Jumlah tidak akan membantu kita jika persenjataan kita kalah dan tidak dapat bermanuver dengan kapal yang lebih modern."
 DEN_sovaernets_operative_kommando: "Kommando Operasi Søværnets"
 DEN_sovaernets_operative_kommando_desc: "Kita memerlukan struktur komando pusat yang kompeten yang dapat mengkoordinasikan angkatan laut kita secara efisien. Hanya perwira terbaik dan terpintar yang boleh dipercaya untuk menjalankan tugas ini."
 DEN_appropriate_odense_staalskibsvaerft: "Odense Staalskibsværft yang sesuai"
 DEN_appropriate_odense_staalskibsvaerft_desc: "Untuk benar-benar memperluas ukuran angkatan laut kita, kita memerlukan kemampuan produksi tambahan. Merebut galangan kapal A.P. Møller-Mærsk di Odense akan mempercepat sarana produksi kita secara signifikan."
 DEN_restructuring_sovaernet: "Restrukturisasi Søværnet"
 DEN_restructuring_sovaernet_desc: "Setelah hidup damai selama beberapa dekade, sejumlah kesalahan dalam struktur komando angkatan laut kita luput dari perhatian. Satu-satunya cara untuk mengatasinya sekarang adalah reorganisasi penuh Søværnet."
 DEN_baltic_sea_domination: "Dominasi Laut Baltik"
 DEN_baltic_sea_domination_desc: "Sebelum kebangkitan kekaisaran Rusia, dan bahkan sebelum kekaisaran Swedia yang berumur pendek, Denmark tampak mendominasi Laut Baltik. Untuk benar-benar menjamin kemerdekaan dan menjaga tanah air kita, kita perlu sekali lagi bertujuan untuk mengendalikan seluruh Laut Baltik melalui supremasi angkatan laut."
 DEN_north_sea_ambitions: "Ambisi Laut Utara"
 DEN_north_sea_ambitions_desc: "Negara kita mempunyai jangkauan yang luas, mulai dari pantai Eropa hingga lautan Atlantik Utara. Untuk melindungi wilayah yang luas ini dan mengamankan wilayah luar negeri kita, kita harus memulai rencana yang berani dan ambisius. Membangun armada Laut Utara yang dapat bersaing di perairan ini dengan kekuatan apa pun yang menentang kita harus menjadi satu-satunya tujuan kita."
 DEN_with_refit_old_ships_completed_tt: "Dengan §Y$DEN_refit_civilian_ships$§! selesai:"
 DEN_with_modernize_the_navy_completed_tt: "Dengan §Y$DEN_modernize_the_navy$§! selesai:"
 DEN_naval_power_projection: "Proyeksi Kekuatan Angkatan Laut"
 DEN_naval_power_projection_desc: "Memiliki angkatan laut yang besar dan kuat akan sia-sia jika tidak mampu memproyeksikan kemauan kita ke seluruh pelosok wilayah kita. Menghubungkan domain kita melalui rangkaian pangkalan angkatan laut akan memperkuat dominasi kita di perairan."
 DEN_baltic_sea_domination_completed_tt: "Telah menyelesaikan fokus yang dimiliki §Y$DEN_baltic_sea_domination$§! dan [DEN.GetNameDef]"
 DEN_north_sea_ambitions_completed_tt: "Telah menyelesaikan fokus yang dimiliki §Y$DEN_north_sea_ambitions$§! dan [DEN.GetNameDefCap]"
 DEN_fromandskorpset: "Frømandskorpset"
 DEN_fromandskorpset_desc: "Kemajuan yang dicapai baru-baru ini baik di angkatan bersenjata maupun angkatan laut telah memperkuat militer kita secara substansial. Kita mendapati diri kita lebih dari mampu untuk memproyeksikan kekuatan kita jauh dan luas, melintasi perairan dan ke pantai asing – jika kita menginginkannya."
 DEN_domestic_designs: "Desain Domestik"
 DEN_domestic_designs_desc: "Angkatan udara kita sangat kekurangan kemampuan. Hal ini sebagian besar disebabkan oleh fakta bahwa kita tidak memproduksi pesawat sendiri, sehingga kita tidak mempunyai cukup tenaga untuk melakukan perlawanan jika keadaan menjadi lebih buruk. Kita perlu membangun jalur produksi dalam negeri untuk pesawat terbang kita sendiri."
 DEN_foreign_designs: "Desain Asing"
 DEN_foreign_designs_desc: "Tak satu pun dari kedua angkatan udara kita yang memiliki kemampuan untuk merancang dan membangun pesawat tempur atau pembom yang berfungsi. Kita harus mencari di tempat lain untuk membeli pesawat. Jika kami merasa desainnya memuaskan, kami dapat mempertimbangkan untuk memperoleh izin produksi."
 DEN_unify_flyvevabnet: "Menyatukan Flyvevåbnet"
 DEN_unify_flyvevabnet_desc: "Saat ini, kita mempunyai dua angkatan udara yang berbeda dan sepenuhnya terpisah; Hærens Flyvertropper milik angkatan darat, dan Marinens Flyvevæsen milik angkatan laut. Kedua cabang tersebut seringkali berselisih satu sama lain. Menyatukan mereka menjadi satu unit angkatan udara akan menciptakan strategi yang kohesif dan membentuk cabang angkatan bersenjata baru."
 DEN_flyvertaktisk_kommando: "Komando Flyvertaktisk"
 DEN_flyvertaktisk_kommando_desc: "Menyatukan dua cabang angkatan udara yang berbeda menjadi satu kesatuan tidaklah cukup. Agar cabang militer baru ini menjadi seefisien dan kohesif mungkin, kita perlu menciptakan struktur komando pusat yang dapat mengkoordinasikan angkatan udara dengan baik."
 DEN_air_force_power_projection: "Proyeksi Kekuatan Angkatan Udara"
 DEN_air_force_power_projection_desc: "Kini setelah kita menyatukan Flyvevåbnet menjadi cabang besar ketiga dari militer kita, kita dapat fokus untuk mengamankan wilayah udara kita yang luas. Angkatan udara yang besar dan sukses masih bergantung pada pangkalan udara dimana mereka dapat mendarat dan lepas landas."
 DEN_flyveskolen: "Flyveskolen"
 DEN_flyveskolen_desc: "Setelah mengumpulkan semua keterampilan dan pengetahuan kolektif angkatan udara ke dalam Flyvevåbnet, kita harus memperluas keahlian tersebut kepada calon taruna dengan mendirikan sekolah pelatihan bersama."
 DEN_torpedofly: "Torpedofly"
 DEN_torpedofly_desc: "Satu-satunya cara bagi kita untuk mempertahankan harta benda kita di luar negeri adalah kemampuan untuk memproyeksikan kekuatan dan kemauan kita melintasi perairan. Hal ini memerlukan koordinasi dan strategi angkatan laut dan udara yang besar."
 DEN_jagerfly: "lalat jager"
 DEN_jagerfly_desc: "Untuk melindungi kota-kota kita dari pemboman dahsyat dari udara, kita perlu memfokuskan sumber daya penerbangan kita untuk menciptakan pesawat tempur terbaik yang kita bisa."
 DEN_luftstotte: "Luftstøtte"
 DEN_luftstotte_desc: "Pemanfaatan terbaik angkatan udara kita adalah dengan mendukung pasukan darat kita sebaik mungkin. Penerbangan telah menjadi hal yang sangat penting dalam peperangan saat ini, namun tetap saja perang dapat dimenangkan."
 DEN_bombefly: "lalat bom"
 DEN_bombefly_desc: "Satu-satunya cara untuk menjaga [DEN.GetNameDef] tetap aman adalah dengan membombardir dan menghancurkan kemampuan industri musuh kita."
 DEN_advanced_flight: "Penerbangan Lanjutan"
 DEN_advanced_flight_desc: "Penerbangan telah mengalami kemajuan pesat dalam beberapa tahun terakhir, namun masih banyak inovasi dan perbaikan yang menanti kita. Untuk benar-benar mendominasi angkasa, kita harus memimpin kemajuan teknologi!"
