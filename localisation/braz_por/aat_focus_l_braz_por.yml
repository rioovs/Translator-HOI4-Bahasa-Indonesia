 NORDIC_air_production: "Produksi Udara"
 NORDIC_air_production_desc: "Jika kita ingin membangun supremasi di belahan bumi utara dan sekitarnya, kita perlu mengejar ketertinggalan yang dimiliki negara-negara besar selama bertahun-tahun. Syukurlah, kami dapat berbagi praktik, pengetahuan, dan peralatan yang dapat kami gunakan untuk menghasilkan lebih banyak dari musuh dan menutup kesenjangan tersebut."
 NORDIC_naval_aircraft: "Pesawat Angkatan Laut"
 NORDIC_naval_aircraft_desc: "Masa depan peperangan laut ada di langit. Pesawat pengebom angkatan laut kita akan mengirim kapal-kapal musuh kita ke dasar laut, dan dari kapal induk kita segerombolan pesawat tempur akan menutupi langit dengan asap pesawat musuh kita."
 NORDIC_air_exercises: "Latihan Udara"
 NORDIC_air_exercises_desc: "Karena pertempuran udara membawa era perang baru, era baru kerja sama antar negara ini harus dibarengi dengan operasi udara gabungan yang dilaksanakan secara ketat. Untuk itu, pasukan kita perlu melakukan latihan bersama hingga mereka terbang sebagai satu kesatuan."
 NORDIC_bomber_command: "Komando Pengebom"
 NORDIC_bomber_command_desc: "Membentuk komando pembom gabungan akan memungkinkan kita untuk mengoordinasikan dukungan darat kita dengan lebih baik di medan perang, dan serangan pembom kita di belakang garis musuh. Ini adalah satu-satunya cara agar negara-negara di utara dapat melakukan upaya bersama melawan musuh-musuhnya."
 NORDIC_fighter_command: "Komando Tempur"
 NORDIC_fighter_command_desc: "Sama seperti kita berbagi cita-cita dan misi menyeluruh, kita juga berbagi langit di atas kita. Kita harus terbang bersama untuk melindungi wilayah udara masing-masing, dan meraih supremasi udara di medan perang sehingga ikatan kita tidak terputus oleh dukungan darat musuh."
 NORDIC_carrier_effort: "Upaya Pembawa"
 NORDIC_carrier_effort_desc: "Batas baru pertempuran laut adalah langit di atas mereka. Kita perlu menggabungkan sumber daya kita untuk menciptakan kapal induk terbaik, dan pesawat pengangkut terbaik. Dengan cara ini kita dapat mendominasi lautan, dan dengan melakukan hal tersebut, kita dapat menciptakan keamanan yang dibutuhkan oleh negara kita."
 NORDIC_ground_operations: "Operasi Darat"
 NORDIC_ground_operations_desc: "Membangun lebih banyak pangkalan, memungkinkan kita memiliki lebih banyak fleksibilitas dalam operasi udara gabungan, dan dengan membangun lebih banyak baterai anti-udara, kita dapat mempertahankan tanah kita dan meringankan beban pilot kita. Inilah cara kami menciptakan sistem pendukung darat yang saling terkait untuk memaksimalkan efektivitas operasi udara kami."
 NORDIC_naval_exercises: "Latihan Angkatan Laut"
 NORDIC_naval_exercises_desc: "Semua negara kita mempunyai warisan angkatan laut yang sudah ada sejak berabad-abad yang lalu, Baltik dan Atlantik Utara telah membentuk budaya dan gaya hidup kita, namun seperti yang diketahui oleh negara-negara pelaut, laut dapat menjadi parit sekaligus jalan raya pada saat yang bersamaan. Mari kita belajar bagaimana bertahan dan menyerang dari laut."
 NORDIC_defend_the_danish_belt: "Pertahankan Sabuk Denmark"
 NORDIC_defend_the_danish_belt_desc: "Sabuk Denmark adalah pintu gerbang ke Laut Baltik. Jika mereka tidak dapat mencapai Laut Baltik dari Atlantik Utara, negara kita akan lebih aman dari invasi angkatan laut, jadi mari kita konsentrasikan upaya kita untuk mengubahnya menjadi tembok sehingga kita dapat menjelajahi Laut Baltik tanpa terpengaruh."
 NORDIC_control_the_northern_sea: "Kendalikan Laut Utara"
 NORDIC_control_the_northern_sea_desc: "Laut Norwegia dan Laut Utara adalah pintu gerbang ke Atlantik. Memfokuskan upaya kita di sana akan memungkinkan kita berurusan dengan negara-negara di pesisir utara Eropa, dan bahkan mencapai Amerika Utara jika kita menginginkannya."
 NORDIC_baltic_sea_dominance: "Dominasi Laut Baltik"
 NORDIC_baltic_sea_dominance_desc: "Laut Baltik telah lama menjadi halaman belakang kami. Kita tidak akan punya peluang jika kita membiarkan negara lain bebas mengendalikan gelombangnya. Mari kita membangun pantai sehingga kita dapat menguasai wilayah yang dingin dan terpencil ini."
 NORDIC_naval_research_institute: "Lembaga Penelitian Angkatan Laut"
 NORDIC_naval_research_institute_desc: "Tidaklah cukup bagi kita untuk mengejar musuh, kita harus menjadi yang terdepan dalam teknologi Angkatan Laut, seperti yang telah kita lakukan sebelumnya. Mari kita rangkul warisan eksplorasi dan dominasi angkatan laut di kawasan kita."
 NORDIC_submarine_cooperation: "Kerjasama Kapal Selam"
 NORDIC_submarine_cooperation_desc: "Dengan menyangkal kemampuan musuh untuk mengangkut pasukan dan pasokan melalui laut, kita sudah setengah memenangkan perang. Cara terbaik untuk memastikan hal ini adalah dengan bekerja sama dalam memproduksi kapal selam canggih."
 NORDIC_naval_officer_academy: "Akademi Perwira Angkatan Laut"
 NORDIC_naval_officer_academy_desc: "Perwira yang baik lebih penting dalam peperangan laut dibandingkan sebagian besar bentuk pertempuran lainnya. Tidak banyak yang dapat dilakukan oleh seorang pelaut tanpa koordinasi dari hierarki perwira yang bertugas di kapal dan gugus tugas angkatan laut kita. Berinvestasi dalam melatih orang-orang ini untuk membuat pilihan sulit dan bekerja sama adalah hal yang paling penting."
 NORDIC_amphibious_forces: "Pasukan Amfibi"
 NORDIC_amphibious_forces_desc: "Dengan memastikan bahwa kita dapat menyerang musuh kita dimana saja, kapan saja, kita dapat mengurangi kemampuan serangan mereka. Jika mereka selalu takut akan pendaratan, di mana pun di sepanjang garis pantai, mereka tidak dapat mengerahkan unit sebanyak itu di garis depan. Oleh karena itu, fokus kita harus pada operasi amfibi dan marinir."
 NORDIC_joint_military_exercises: "Latihan Militer Gabungan"
 NORDIC_joint_military_exercises_desc: "Prajurit dan perwira kita belum pernah menemukan aliansi seperti yang kita jalani sekarang, mereka harus dilatih sebagai satu kesatuan hingga kerja sama menjadi kebiasaan. Ketika ini terjadi, kekuatan [NORDIC_get_alliance_name] tidak akan dapat dihentikan."
 NORDIC_unified_recruitment: "Rekrutmen Terpadu"
 NORDIC_unified_recruitment_desc: "Kita harus menemukan cara untuk menstandardisasi upaya rekrutmen kita, dan menyederhanakan prosesnya sehingga kita bisa mendapatkan lebih banyak orang dari kantor perekrutan ke garis depan secepat mungkin."
 NORDIC_mechanized_army: "Tentara Mekanis"
 NORDIC_mechanized_army_desc: "Jika kita memfokuskan upaya kita dalam melatih pasukan kita untuk bertarung di dalam dan di samping kendaraan raksasa yang dilapisi baja dan meriam, kita dapat memberikan pukulan yang lebih besar dengan jumlah personel yang lebih sedikit. Tentu saja, selama kita bisa menghasilkan cukup banyak raksasa tersebut."
 NORDIC_infantry_first: "Infanteri Pertama"
 NORDIC_infantry_first_desc: "Selama beberapa generasi, orang-orang kita telah pergi ke medan perang hanya dengan senjata dan pakaian yang mereka kenakan, untuk berjuang mati-matian melawan jiwa malang lainnya di hadapan mereka. Jika pasukan kita dapat melihat mata musuh di depannya, mereka akan melihat ancaman yang mereka timbulkan dan berjuang sampai titik darah penghabisan demi negaranya."
 NORDIC_expedited_training: "Pelatihan yang Dipercepat"
 NORDIC_mountaineers: "Spesialis Gunung"
 NORDIC_mountaineers_desc: "Wilayah Nordik sangat cocok untuk melatih dan menggunakan para pendaki gunung. Dengan kader ahli pegunungan yang kuat, kita seharusnya bisa mempertahankan wilayah tersebut dengan lebih mudah, dan memungkinkan kita melakukan serangan balik kapan pun kita punya kesempatan. Sekalipun sebagian wilayah kita jatuh ke tangan musuh, kita tidak akan pernah menyerah."
 NORDIC_nordic_construction_developments: "Perkembangan Konstruksi Nordik"
 NORDIC_nordic_construction_developments_desc: "Ada banyak hal yang harus dilakukan di [NORDIC_get_alliance_name], dan hanya ada sedikit waktu sebelum jam kiamat tiba. Kita harus bekerja sama untuk menemukan perbaikan yang kita perlukan untuk mempercepat pembangunan bangsa kita."
 NORDIC_materiel_design: "Desain Materiel"
 NORDIC_materiel_design_desc: "Perang telah berubah dalam banyak hal dari generasi ke generasi, namun selama berabad-abad, perang sering kali berujung pada manusia dan senapannya. Di era peperangan yang baru ini kita tidak bisa mengabaikan senjata yang dimiliki oleh [NORDIC_get_alliance_name], dan dengan merancang senjata yang lebih baik, kita akan menghasilkan prajurit yang lebih baik."
 NORDIC_nordic_electronics: "Elektronik Nordik"
 NORDIC_nordic_electronics_desc: "Elektronik ada di sini, dan mereka bisa menjadi faktor penentu peperangan di masa depan. Kita tidak bisa membiarkan musuh mengalahkan kita dalam perlombaan senjata elektronik. Mari kita kembangkan perangkat elektronik ini bersama-sama sehingga kekuatan baru ini ada di pihak kita."
 NORDIC_research_investments: "Investasi Penelitian Bersama"
 NORDIC_research_investments_desc: "Aliansi baru kita lebih erat dibandingkan yang lain, tidak ada alasan mengapa kita harus merahasiakan kemajuan teknologi kita. Mari kita berbagi penelitian kita sehingga alat perang kita memiliki keunggulan yang diperlukan untuk menumbangkan musuh."
 NORDIC_civilian_contributions: "Kontribusi Sipil"
 NORDIC_civilian_contributions_desc: "Kini setelah masyarakat umum memiliki rasa identitas bersama yang baru dengan anggota aliansi kami yang lain, kami tahu mereka akan bersedia memberikan kontribusi dan pengorbanan yang diperlukan untuk menggerakkan mesin perang yang akan membawa keselamatan dan kejayaan bagi [NORDIC_get_alliance_name]."
 NORDIC_nuclear_research: "Penelitian nuklir"
 NORDIC_nuclear_research_desc: "Para ilmuwan tidak bisa tutup mulut mengenai dunia baru yang akan menimpa kita ketika pembelahan atom akhirnya dijadikan senjata. Mengapa kita harus dijauhkan dari keajaiban teknologi yang dapat mengakhiri perang dalam satu kali kejadian?"
 NORDIC_nordic_rocketry: "Roket Nordik"
 NORDIC_nordic_rocketry_desc: "Bagaimana jika bom kita bisa dikirim tanpa campur tangan pesawat? Senjata self-propelled adalah masa depan, kita bisa memusnahkan musuh dari kenyamanan [NORDIC_get_alliance_name] jika kita menginginkannya."
 NORDIC_standarized_parts: "Bagian Standar"
 NORDIC_standarized_parts_desc: "Kini, setelah kita menjadi satu kesatuan, kita dapat mengambil manfaat dari berbagi standar satu sama lain sehingga pabrik kita dapat meningkatkan kecepatannya secepat mungkin. Peralatan dan suku cadang dapat saling dipertukarkan, sehingga sangat menyederhanakan produksi kami."
 NORDIC_fill_the_infrastructure_gaps: "Mengisi Kesenjangan infrastruktur"
 NORDIC_fill_the_infrastructure_gaps_desc: "Sebelum bergabung bersama, negara kita berada pada tingkat perkembangan yang berbeda, dan bahkan beberapa wilayah di negara paling maju di [NORDIC_get_alliance_name] dapat menggunakan infrastruktur yang lebih baik. Kita harus bekerja sama untuk mengangkat semua perahu."
 NORDIC_develop_resources: "Kembangkan Sumber Daya"
 NORDIC_develop_resources_desc: "Anda tidak pernah tahu apa yang mungkin Anda temukan jika Anda mencarinya cukup teliti. Jika kita memfokuskan upaya kita, kita dapat menemukan simpanan sumber daya penting yang belum ditemukan untuk upaya perang, dan bahkan mengembangkan cara-cara baru untuk mengambil lebih banyak sumber daya yang sudah kita miliki."
 NORDIC_military_industry_hub: "Pusat Industri Militer"
 NORDIC_military_industry_hub_desc: "Dengan memusatkan industri militer kita secara efisien, kita dapat menggunakan kedekatan dan spesialisasi ini untuk mencapai tingkatan baru pada mesin perang kita. Kita akan menghasilkan produksi yang lebih banyak dari musuh-musuh kita, selama kita tetap mempertahankan pabrik-pabrik kita."
 NORDIC_ad_hoc_military_industry: "Industri Militer Ad-Hoc"
 NORDIC_ad_hoc_military_industry_desc: "Tidak ada waktu untuk merencanakan dan membangun kampus pabrik yang monumental, atau hamparan beton dan asap. Kita harus membangun industri kita secepat yang kita bisa, jika memungkinkan, dengan pabrik-pabrik kecil yang tersebar di sekitar [NORDIC_get_alliance_name] sehingga kita tidak mengambil risiko kehilangan semuanya dalam satu pertempuran."
 NORDIC_railway_expansion: "Perluasan Kereta Api"
 NORDIC_railway_expansion_desc: "Kereta api adalah arteri negara kita, dan saat ini kita semakin membutuhkan jalur transportasi seluas mungkin. Sekarang kita bersatu dalam tujuan, kita harus bersatu secara fisik melalui baja dan kecepatan lokomotif."
 NORDIC_naval_construction: "Konstruksi Angkatan Laut"
 NORDIC_naval_construction_desc: "Memiliki tradisi pelayaran yang panjang dan pelaut kelas dunia memang baik, namun tidak ada artinya jika kita tidak memiliki kapal untuk menggunakannya melawan musuh kita. Mari kita bersama-sama membangun armada besar dan menggunakannya untuk menghancurkan negara mana pun yang mengancam kita."
 NORDIC_nuclear_production: "Produksi Nuklir"
 NORDIC_nuclear_production_desc: "Sekarang kita mempunyai pengetahuan untuk membelah atom, sebaiknya kita menggunakannya. Namun pertama-tama, kita perlu memproduksi bahan-bahan dan infrastruktur yang diperlukan untuk menghasilkan cukup bahan guna membalikkan keadaan perang demi keuntungan kita."
 NORDIC_jet_engines: "Ke Era Jet"
 NORDIC_jet_engines_desc: "Kemajuan baru dalam mesin jet membuat pesawat baling-baling kelas atas tampak seperti layang-layang kertas yang melayang tanpa tujuan. Era baru pertempuran udara telah tiba dan akan didominasi oleh mesin jet. Jika kita menyatukan investasi kita di bidang ini, kita dapat melompati musuh-musuh kita dan menghasilkan pemimpin dalam rantai makanan pesawat terbang."
 NORDIC_machine_tools_research: "Penelitian Peralatan Mesin"
 NORDIC_machine_tools_research_desc: "Tenaga kerja hanyalah salah satu bagian dari persamaan. Kita perlu menghasilkan lebih banyak dari musuh kita sehingga kita bisa mengganti kerugian yang tidak bisa mereka tanggung. Inilah sebabnya mengapa kita tidak bisa membatasi diri pada pengembangan mesin perang baru saja, tapi fokuskan perhatian kita pada mesin yang melahirkannya."
 NORDIC_equipment_conversion_focus: "Fokus Konversi Peralatan"
 NORDIC_equipment_conversion_focus_desc: "Kita mempunyai gudang-gudang luas yang penuh dengan senjata-senjata dan kendaraan-kendaraan tua, baik yang diawetkan atau direbut dari musuh-musuh kita yang telah gugur. Peralatan lama ini dapat dipasang kembali menjadi mesin perang terbaru dan paling mematikan yang kami tawarkan saat ini."
