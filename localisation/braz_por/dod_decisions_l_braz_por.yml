 YUG_instigate_in_bulgaria: "Menghasut Pemberontakan Petani di Bulgaria"
 YUG_instigate_in_bulgaria_desc: "Hampir seluruh pekerja Slavia Selatan telah dibebaskan oleh negara kami, kecuali pekerja Bulgaria. Hanya dengan mendorong orang-orang Bulgaria untuk bangkit melawan penindas mereka, kita dapat benar-benar mengklaim telah membebaskan para pekerja Slavia di Balkan."
 YUG_instigate_in_albania: "Menghasut Pemberontakan Petani di Albania"
 YUG_instigate_in_albania_desc: "Meskipun masyarakat Albania tidak mengidentifikasi diri mereka sebagai orang Slavia, kedekatan mereka dengan perbatasan dan pertukaran budaya antara orang Albania dan Slavia Selatan menjadikan mereka kandidat yang ideal untuk bergabung dengan Kongres Pekerja Pan-Slavia."
 YUG_instigate_in_greece: "Menghasut Pemberontakan Petani di Yunani"
 YUG_instigate_in_romania: "Menghasut Pemberontakan Petani di Rumania"
 YUG_instigate_in_hungary: "Menghasut Pemberontakan Petani di Hongaria"
 YUG_instigate_in_turkey: "Menghasut Pemberontakan Petani di Turki"
 YUG_propaganda_in_target: "Kampanye Propaganda di [YUG_communist_coup_target.GetNameDef]"
 YUG_propaganda_in_target_desc: "Sasaran kita telah dipilih, yang perlu kita lakukan sekarang adalah memberikan propaganda yang efektif kepada sekutu sosialis kita dan dalam waktu dekat kita akan menanam benih pemberontakan yang diperlukan untuk menggulingkan kelas atas di Balkan."
 YUG_arm_communist_militants: "Lengan [YUG_communist_coup_target.GetAdjective] Militan"
 YUG_arm_communist_militants_desc: "Kita tidak bisa menyampaikan revolusi kepada kawan-kawan kita di seberang perbatasan hanya dengan kata-kata. Kita harus menyediakan senjata yang dibutuhkan sekutu kita untuk menggulingkan tuan mereka."
 YUG_communist_coup: "Menghasut Kudeta Komunis"
 YUG_communist_coup_desc: "Mereka telah melakukan persiapan cukup lama, yang perlu kita lakukan sekarang hanyalah memberikan persetujuan kepada para militan di seluruh perbatasan kita dan mereka akan berusaha melakukan kudeta terhadap pemerintahan kapitalis mereka yang korup!"
 YUG_abandon_communist_effort: "Abaikan Upaya Kami di [YUG_communist_coup_target.GetNameDef]"
 YUG_abandon_communist_effort_desc: "Jelas bahwa masyarakat [YUG_communist_coup_target.GetNameDef] belum siap untuk melepaskan diri dari kungkungan pemerintahannya dan kita harus menghentikan upaya kita untuk menghasut kudeta komunis di negara mereka."
 YUG_uprising_strength_tt: "Dengan dukungan mereka saat ini, kekuatan §YKomunis§! akan menjadi [YUG_communist_coup_target.Get_Yugo_Uprising_strength].\nHal ini didasarkan pada dukungan §YKomunis§! mereka saat ini dan berapa kali para petani telah dipersenjatai."
