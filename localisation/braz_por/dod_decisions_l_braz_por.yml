 ROM_change_sides_to_allies: "Bergabunglah dengan Sekutu"
 ROM_change_sides_to_allies_desc: "Perubahan dalam pemerintahan kita telah memfasilitasi perubahan dalam keberpihakan kita dalam perang. Dengan bergabung bersama Sekutu, \"rekan-rekan\" kita saat ini dalam konflik global ini akan menjadi bingung ketika peluru Rumania menemukan sasaran baru."
 ROM_change_sides_to_commintern: "Bergabunglah dengan Komintern"
 ROM_change_sides_to_commintern_desc: "Perubahan dalam pemerintahan kita telah memfasilitasi perubahan dalam keberpihakan kita dalam perang. Dengan bergabung dengan Komunis Internasional, \"kawan-kawan\" kita saat ini dalam konflik global ini akan menjadi bingung ketika peluru Rumania menemukan sasaran baru."
 ROM_change_sides_to_axis: "Bergabunglah dengan Poros"
 ROM_change_sides_to_axis_desc: "Perubahan dalam pemerintahan kita telah memfasilitasi perubahan dalam keberpihakan kita dalam perang. Dengan bergabung dengan Poros, \"rekan-rekan\" kita saat ini dalam konflik global ini akan menjadi bingung ketika peluru Rumania menemukan sasaran baru."
