l_braz_por:
 south_american_news.1.t: "Perang di Amerika Selatan"
 south_american_news.1.d: "Bermula dari perselisihan yang terjadi di wilayah Napo Pastaza dan Santiago Zamora di perbatasan Peru dan Ekuador sejak bubarnya Gran Colombia, kini mulai terjadi bentrokan antar kekuatan kedua negara. Karena penyelesaian baru-baru ini di perbatasan dengan Kolombia, tentara Peru merasa percaya diri dalam mengajukan klaim mereka terhadap Negara Ekuador yang lebih lemah, dan bentrokan tersebut kini telah meningkat menjadi konflik terbuka. Hal ini akan menguji stabilitas kawasan, karena negara-negara lain mungkin berupaya melakukan intervensi."
 south_american_news.1.a: "Apa yang akan terjadi dengan Amerika Selatan?"
 south_american_news.1.b: "Ini akan menandai era baru bagi negara Peru!"
 south_american_news.1.c: "¡Tidak ada pasar!"
 south_american_events.1.t: "Terra mengadakan pemilihan nasional"
 south_american_events.1.desc: "Meskipun seorang diktator yang sangat memahami politik negaranya, Gabriel Terra telah mengumumkan untuk sekali lagi mengadakan pemilu. Namun banyak yang sudah mengetahui hasilnya, karena partai Colorado tidak mau menyerahkan kekuasaannya, dan saudara ipar Terra, Alfredo Baldomir, adalah satu-satunya penerus Terra di dalam partai tersebut. Namun demikian, masyarakat tetap memberikan suaranya untuk masa depan Uruguay yang baru."
 south_american_events.1.a: "Alfredo Baldomir akan menggantikan Terra"
 south_american_events.1.b: "Entah bagaimana, Partai Nasional lebih unggul"
 south_american_events.1.c: "Rakyat telah berbicara!"
 south_american_events.1.d: "Ada hal lain yang kami pikirkan..."
 south_american_news.2.t: "Presiden Baru di Uruguay"
 south_american_news.2.d: "Gabriel Terra, Presiden Uruguay, mengumumkan pekan lalu bahwa ia mengadakan pemilihan umum dan mengundurkan diri dari kekuasaan, sebuah aturan yang ia perpanjang melalui kudeta pada tahun 1933. Kekuasaan dengan ini akan diserahkan kepada saudara ipar Terra, politisi pro-sekutu Alfredo Baldomir Ferrari."
 south_american_news.2.a: "Bagus untuk mereka"
 south_american_news.2.b: "Dia akan dirindukan"
 south_american_news.3.t: "Presiden Baru di Uruguay"
 south_american_news.3.d: "Gabriel Terra, Presiden Uruguay, mengumumkan pekan lalu bahwa ia mengadakan pemilihan umum dan mengundurkan diri dari kekuasaan, sebuah aturan yang ia perpanjang melalui kudeta pada tahun 1933. Kekuasaan dengan ini akan diserahkan kepada pemimpin Partai Nasional Uruguay, Luis Alberto de Herrera."
 south_american_news.3.a: "Menarik"
 south_american_news.3.b: "Sebuah kejutan tentu saja, tapi disambut baik"
 south_american_news.4.t: "Revolusi Rakyat di Uruguay"
 south_american_news.4.d: "Gabriel Terra, Presiden Uruguay, mengumumkan pekan lalu bahwa ia akan menyelenggarakan pemilu dan mengundurkan diri dari kekuasaan, sebuah peraturan yang ia perpanjang melalui kudeta pada tahun 1933. Namun yang tidak ia duga adalah dukungan besar-besaran terhadap partai komunis, yang berujung pada kudeta terhadap pemerintahan baru yang baru dibentuk penggantinya, Alfredo Baldomir Ferrari."
 south_american_news.4.a: "Jadi inilah yang mampu dilakukan oleh masyarakat"
 south_american_news.4.b: "Hidup Republik Rakyat!"
 south_american_news.5.t: "Konfederasi Peru-Bolivia Telah Dibangkitkan Kembali"
 south_american_news.5.d: "Untuk pertama kalinya sejak perang konfederasi, di mana negara bagian Peru-Bolivia runtuh, dan dianggap tidak akan pernah ada lagi, kini kembali terjadi. Ada yang berpendapat bahwa hal ini hanyalah kedok untuk menyembunyikan ambisi imperialis penguasa yang sebenarnya, namun banyak yang berharap bahwa konfederasi akan mampu menyatukan rakyat dengan cara yang belum pernah mereka lakukan sebelumnya. Namun yang pasti, serikat pekerja akan tetap ada."
 south_american_news.5.a: "Hal ini tentu akan mengubah keseimbangan kekuatan di kawasan"
 south_american_news.5.b: "Kami bersatu sekali lagi!"
 south_american_news.6.t: "Hispaniola United"
 south_american_news.6.d: "Meskipun sejarahnya panjang dan relatif sama, Hispaniola barat dan timur belum bersatu sejak lama. Namun sekarang, negara bagian Haiti dan Republik Dominika telah bersatu dalam tujuan bersama untuk mencapai kemakmuran bagi pulau mereka, dan membentuk negara bagian Hispaniola."
 south_american_news.6.a: "Itu tidak akan membantu mereka"
 south_american_news.6.b: "Viva Hispaniola!"
 south_american_events.2.t: "Mengkhususkan Departemen Senjata Berat Nasional"
 south_american_events.2.desc: "Berasal dari upaya kami baru-baru ini untuk memodernisasi produksi senjata berat, para ahli kami telah sampai pada sebuah kesimpulan. Kita perlu mengkhususkan Departemen Senjata Berat jika kita ingin jalur produksi kita tidak menjadi sangat tidak efisien dan merugikan keamanan negara kita. Apa yang harus kita pilih?"
 south_american_events.2.a: "Jelas Artileri membutuhkan modernisasi"
 south_american_events.2.b: "Kita harus mampu mempertahankan diri melawan musuh-musuh yang berada di angkasa!"
 south_american_events.2.c: "Kita harus mampu menghentikan tank-tank yang mati di jalurnya"
 south_american_news.7.t: "Guyana Bersatu!"
 south_american_news.7.d: "Wilayah Guyana telah lama terpecah di antara kekuatan penjajah, menduduki sub-wilayah Cayenne, Guyana, Amapa, Suriname dan Guayana. Namun rakyat di wilayah tersebut kini telah bersatu dalam perjuangan bersama melawan imperialisme, dan telah menyatakan bahwa mereka akan menghancurkan semua yang menentang unifikasi dan kemerdekaan mereka."
 south_american_news.7.a: "Saat-saat yang menarik"
 south_american_news.7.b: "Akhirnya kita lepas dari belenggu Imperialisme!"
 south_american_events.10.t: "[FROM.GetName] Mengumumkan Ekspansi Angkatan Laut"
 south_american_events.10.d: "Dengan pengumuman pemerintah [FROM.GetAdjective] bahwa mereka bermaksud memperluas armada mereka dengan lebih banyak kapal besar, nampaknya keseimbangan kekuatan yang rapuh di benua ini telah hancur. Sekarang kita harus memutuskan bagaimana menanggapi ancaman yang muncul kembali dari negara tetangga kita yang agresif."
 south_american_events.10.a: "Kami tidak akan kalah dengan [FROM.GetAdjective]s!"
 south_american_news.10.t: "[FROM.GetName] Memicu Perlombaan Senjata Angkatan Laut"
 south_american_news.10.d: "Meskipun tidak ada perjanjian formal yang mencegah perluasan angkatan laut [BRA.GetAdjective], [CHL.GetAdjective] atau [ARG.GetAdjective], terdapat perjanjian informal sejak Perang Besar yang mencegah perluasan besar-besaran. Namun, dengan pengumuman pemerintah [FROM.GetAdjective] bahwa mereka bermaksud memperluas kemampuan angkatan laut mereka dengan lebih banyak kapal besar, tampaknya perlombaan senjata baru di Amerika Selatan tidak dapat dihindari.\n\nApa dampaknya terhadap situasi geopolitik yang lebih luas masih harus dilihat, namun dapat diasumsikan bahwa para pemimpin negara-negara besar juga akan memperhatikan situasi ini dengan cermat."
 south_american_news.10.a: "Hal ini dapat mengganggu stabilitas kawasan."
 south_american_news.10.b: "Ini bisa menjadi peluang untuk memperluas pengaruh kami di kawasan ini."
 south_american_events.11.t: "Upaya Kudeta Militer"
 south_american_events.11.d: "Meskipun presiden Eusebio Ayala membimbing negara kita menuju kemenangan dalam perang melawan Bolivia bersama dengan tangan kanannya José Félix Estigarribia, dia dan pemerintahannya sangat patut disalahkan atas terjadinya perang tersebut, dan terdapat ketidakpuasan yang besar terhadapnya di seluruh negeri. Sekarang, banyak perwira yang menyatakan diri mereka memusuhi pemerintah liberal yang lemah dan berpuas diri, dan Letnan Kolonel Federico Wenman Smith dan Camildo Recalde telah menduduki Asunción, dan menuntut pengunduran diri Eusebio Ayala segera!"
 south_american_events.11.a: "Ayala harus mundur, kita tidak bisa membiarkan hal ini bertambah parah..."
 south_american_events.11.b: "Buat mereka membayar karena mengancam republik kita!"
 higinio_and_estigarrabia_wont_cooperate: "Jenderal §YJosé Félix Estigarribia§! dan §YHiginio Morínigo§! akan §RTidak Bekerja Sama§! dengan pemerintahan baru kita!"
 rafael_franco_is_exiled: "Jenderal §YRafael Franco§! diasingkan"
 south_american_news.8.t: "Revolusi Februari"
 south_american_news.8.d: "Presiden Paraguay Eusebio Ayala telah resmi mengundurkan diri sesuai tuntutan yang diajukan oleh para perwira militer yang menduduki ibu kota Paraguay, Asunción, dan kekuasaan telah diserahkan kepada kelompok revolusioner Febreristas, yang dipimpin oleh jenderal Rafael Franco. Setelah bertahun-tahun berperang dengan Bolivia, nampaknya rakyat Paraguay sudah bosan dengan lemahnya pemerintahan mereka, karena banyak yang turun ke jalan untuk merayakan kepemimpinan baru mereka."
 south_american_news.8.a: "Apakah mereka belum cukup berjuang?"
 south_american_news.8.b: "Kita sekarang bebas berjuang demi masa depan yang lebih baik!"
 south_american_news.9.t: "Pemberontakan Perwira Paraguay Dihancurkan"
 south_american_news.9.d: "Presiden Paraguay Eusebio Ayala telah mengumumkan bahwa dia dan pasukan republik, yang dipimpin oleh tangan kanannya José Félix Estigarribia telah berhasil memadamkan pemberontakan dan percobaan kudeta oleh perwira militer untuk mendukung febreristas revolusioner dan pemimpin mereka, jenderal Rafael Franco. Namun negara ini sekarang berada dalam kondisi yang lebih buruk dibandingkan beberapa bulan yang lalu, ketika perang Chaco berakhir, dan tampaknya negara ini masih jauh dari keadaan utuh kembali."
 south_american_news.9.a: "Saya ingin tahu bagaimana perasaan orang-orang mereka tentang hal ini?"
 south_american_news.9.b: "Mudah-mudahan ini adalah kali terakhir kita melihat para pemberontak itu..."
 south_american_events.12.t: "German Busch Bergerak untuk Menggulingkan Pemerintah"
 south_american_events.12.d: "Menyusul gerakan pemogokan terbesar yang diketahui hingga saat ini di negara tersebut, militer di bawah letnan kolonel muda Germán Busch telah bergerak untuk menggulingkan pemerintahan Tejada. Mereka mengklaim bahwa, tidak seperti Tejada, mereka berpihak pada rakyat Bolivia dan cita-cita sosialis Partai Sosialis Bersatu dan Serikat Buruh. Adakah yang bisa dilakukan untuk menghentikan mereka, atau apakah ini sudah terlambat, mengingat bencana perang Chaco?"
 south_american_events.12.a: "Tejada Sorzano harus mengumumkan pengunduran dirinya kepada publik"
 south_american_events.12.b: "Hentikan pemberontakan mereka sekarang juga!"
 german_busch_and_gualberto_imprisoned: "Jenderal §YGermán Busch§! dan §YGualberto Villarroel López§! dipenjarakan"
 south_american_news.11.t: "Revolusi Sosialis Bolivia tahun 1936"
 south_american_news.11.d: "Menyusul gerakan pemogokan terbesar yang dikenal hingga saat ini di Bolivia, militer di bawah letnan kolonel muda Germán Busch bergerak untuk menggulingkan pemerintahan Republik Asli José Luis Tejada Sorzano. Mereka mengklaim bahwa, tidak seperti Tejada, mereka berpihak pada rakyat Bolivia dan cita-cita sosialisnya, dan sekarang dengan pengunduran diri Tejada, mereka mengambil kendali penuh atas Bolivia."
 south_american_news.11.a: "Dalam hal apa kediktatoran militer itu sosialis?"
 south_american_news.11.b: "Kami akan memanfaatkan hari ini!"
 south_american_news.12.t: "Jenderal Bolivia Melakukan Kesalahan dalam Kudeta"
 south_american_news.12.d: "Menyusul gerakan pemogokan terbesar yang dikenal hingga saat ini di Bolivia, militer di bawah letnan kolonel muda Germán Busch bergerak untuk menggulingkan pemerintahan Republik Asli José Luis Tejada Sorzano. Mereka mengklaim bahwa, tidak seperti Tejada, mereka berpihak pada rakyat Bolivia dan cita-cita sosialisnya, namun karena mereka gagal merebut La Paz, polisi dan tentara yang tersisa memburu kelompok mereka dan memenjarakan para pemimpin mereka."
 south_american_news.12.a: "Saya tidak akan melakukan tindakan itu"
 south_american_news.12.b: "Kami mengakhiri Putsch busuk mereka!"
 south_american_events.13.t: "Gempa Besar Chillán"
 south_american_events.13.d: "Pada pukul 23:32 kemarin, bumi mulai berguncang kuat di bawah Chillán, menghancurkan lebih dari separuh kota. Pada pukul 23:35, Concepción diserang dengan hebat. Hampir seluruh bangunan hancur total. Gempa tersebut diperkirakan memiliki kekuatan gelombang permukaan sebesar 8,3 dan intensitas Mercalli maksimum X, menyebabkan korban jiwa sekitar 28000 orang, dan lebih banyak lagi yang mengungsi atau terluka. Hari ini adalah hari yang suram bagi masyarakat Chile."
 south_american_events.13.a: "Kita perlu membantu orang-orang!"
 south_american_events.13.b: "Kami memiliki masalah yang lebih besar"
 south_american_news.13.t: "Setelah Gempa Chillán"
 south_american_news.13.d: "Gempa bumi berkekuatan 8,3 skala Richter, dengan intensitas maksimum Mercalli sebesar X, telah menyebabkan kota Chillán dan Concepción di Chili hancur total, dengan jumlah korban jiwa di atas 28000 jiwa. Upaya rekonstruksi dan bantuan sedang dilakukan, namun banyak yang terpaksa mengungsi, dan negara-negara di kawasan ini tidak yakin bagaimana cara terbaik untuk mengatasi masalah yang sedang terjadi."
 south_american_news.13.a: "Mengerikan"
 south_american_events.14.t: "Pemilihan Presiden tahun 1938"
 south_american_events.14.d: "Pemilihan presiden akhirnya telah tiba, dan masa jabatan terakhir presiden Arturo Alessandri telah berakhir. Negara ini masih mengalami peningkatan ketidakpuasan dan radikalisme, baik dari kelompok sayap kanan maupun kiri, dan tidak ada seorang pun yang mengetahui jawaban pasti untuk menyelamatkan negara dari bencana ekonomi. Siapa yang harus mengambil peran Alessandri dan memimpin negara menuju masa depan?"
 south_american_events.14.a: "Pedro Aguirre Cerda"
 south_american_events.14.b: "Gustavo Ross"
 south_american_events.14.c: "Carlos Ibanez del Campo"
 south_american_events.14.e: "Elias Lafertte Gaviño"
 south_american_events.15.t: "Pemberontakan Angkatan Darat"
 south_american_events.15.desc: "Setelah Rafael Franco menandatangani beberapa perintah eksekutif tentang peningkatan kekuasaan presiden serta menyerahkan posisi terdepan di wilayah Chaco Boreal di Bolivia yang diakui secara internasional, sebagian tentara memberontak melawan pemerintah dan berusaha menggulingkannya. Apakah itu yang mereka lakukan adil?"
 south_american_events.15.a: "Tidak ada gunanya mencoba menghentikan mereka..."
 south_american_events.15.b: "Hancurkan mereka!"
 south_american_news.14.t: "Higinio Morínigo Mengambil Kekuasaan di Paraguay"
 south_american_news.14.desc: "Setelah meningkatnya ketidakpuasan terhadap kepemimpinan negara, militer mengambil tindakan dan mengangkat jenderal Higinio Morínigo sebagai presiden baru Paraguay. Dia bersimpati pada perjuangan fasis, dan kemungkinan akan mendekati Argentina untuk saling melindungi dan memberikan bantuan, yang pada gilirannya akan menyebabkan Brasil berupaya memperkuat aliansi mereka sendiri untuk mengamankan diri jika terjadi agresi dari Paraguay atau Argentina."
 south_american_news.14.a: "Anjing piaraan fasis lainnya"
 south_american_news.14.b: "Masa depan kita ada di tangan Jerman"
 south_american_events.16.t: "Perayaan Día del Mar"
 south_american_events.16.desc: "Sesuai tradisi sejak hilangnya Departemen Litoral ke Chili dalam Perang Pasifik pada akhir tahun 1800-an, Perayaan Día del Mar tahunan diadakan hari ini, untuk mengenang para pahlawan Bolivia yang pernah berperang melawan Chili. Banyak orang melihat hal ini sebagai kesempatan untuk menegaskan kembali klaim kita atas akses ke Samudera Pasifik yang hilang ketika kita tidak memiliki daratan setelah perang. Haruskah kita membiarkan masyarakat melakukan protes?"
 south_american_events.16.a: "Biarkan rakyat melakukan apa yang mereka inginkan"
 south_american_events.16.b: "Kita harus menekan kebodohan ini"
 south_american_events.16.c: "Mereka sedang melakukan sesuatu"
 south_american_events.17.t: "[PRU.GetNameDefCap] Menawarkan Kedamaian Putih sebagai Imbalan Pastaza"
 south_american_events.17.desc: "Komunike tak terduga dari diplomat [PRU.GetAdjective] tiba baru-baru ini. Dalam komunike tersebut terdapat tawaran untuk perdamaian bersyarat, kami memberi mereka Pastaza, dan mereka menarik pasukan mereka dari seluruh negara kami. Kita perlu mempertimbangkan hal ini dengan hati-hati, tetap memperjuangkan tanah kita, atau berdamai, tetapi menyerahkan sebagian wilayah kita."
 south_american_events.17.a: "Negara kita membutuhkan perdamaian!"
 south_american_events.17.b: "Kami akan berjuang untuk Pastaza!"
 south_american_events.18.t: "[ECU.GetNameDefCap] menyerahkan Pastaza untuk Perdamaian"
 south_american_events.18.desc: "Kami sangat menyetujui [ECU.GetNameDef] telah memutuskan untuk menyerahkan Pastaza demi perdamaian kulit putih. Kami telah mencaplok negara tersebut secara damai dan upaya integrasi telah dimulai. Ini menandai awal baru bagi negara bagian Pastaza!"
 south_american_events.18.a: "Akhirnya!"
 south_american_events.19.t: "[ECU.GetNameDefCap] Menolak Menyerahkan Wilayah"
 south_american_events.19.desc: "[ECU.GetNameDefCap] telah menanggapi tawaran perdamaian kami secara negatif. Mengklaim bahwa integritas wilayah mereka tidak perlu dipertanyakan, mereka memilih untuk terus melawan meskipun posisi mereka saat ini dalam perang. Mereka tidak memberi kita pilihan selain terus melawan mereka."
 south_american_events.19.a: "Betapa disayangkan..."
 south_american_events.20.t: "[PRU.GetNameDefCap] menawarkan Loreto sebagai Imbalan Perdamaian"
 south_american_events.20.desc: "Komunike tak terduga dari diplomat [PRU.GetAdjective] tiba baru-baru ini. Dalam komunike tersebut terdapat tawaran untuk perdamaian bersyarat, mereka memberi kami Loreto, dan kami menarik pasukan kami dari seluruh negara mereka. Kita perlu mempertimbangkan hal ini dengan hati-hati, kita bisa menerima apa yang kita miliki saat ini, atau terus berjuang dengan harapan mendapatkan lebih banyak wilayah."
 south_american_events.20.a: "Cukup adil, mereka telah memetik pelajarannya."
 south_american_events.20.b: "Mengapa harus menerima lebih sedikit jika kita bisa mengambil lebih banyak tanah mereka?"
 south_american_events.21.t: "[ECU.GetNameDefCap] Menerima Tawaran Perdamaian Kami"
 south_american_events.21.desc: "[ECU.GetNameDefCap] telah menanggapi secara positif usulan perdamaian putih yang kami usulkan. Sayangnya hal ini harus dibayar mahal, karena kita telah menyerahkan Loreto kepada kepemimpinan [ECU.GetAdjective]."
 south_american_events.21.a: "Kami memilih kejahatan yang lebih kecil"
 south_american_events.22.t: "[ECU.GetNameDefCap] Menolak Tawaran Perdamaian kami"
 south_american_events.22.desc: "[ECU.GetNameDefCap] telah menanggapi secara negatif tawaran perdamaian putih yang kami tawarkan. Saat ini [ECU.GetAdjective] tidak melihat alasan untuk berhenti berjuang. Mereka tidak memberi kita pilihan selain terus melawan mereka."
 south_american_events.22.a: "Itu tidak ideal..."
 south_american_events.30.t: "Tekanan untuk Mengisolasi [FROM.GetNonIdeologyName]"
 south_american_events.30.desc: "Dengan penggulingan pemerintahan [FROM.GetAdjective] baru-baru ini oleh kekuatan komunis, tekanan meningkat di seluruh negara kita untuk memberikan tanggapan yang tegas. Media dibanjiri dengan laporan hiperbolik mengenai ancaman merah dan ancaman [FROM.GetNonIdeologyName] terhadap kepentingan kita. Sementara itu, para pemilik usaha menuntut ganti rugi atas hilangnya investasi mereka di negara tersebut.\n\nKita harus bertindak cepat untuk menenangkan masyarakat dan memberikan pesan yang jelas kepada [FROM.GetNonIdeologyName] bahwa kita tidak akan mentolerir komunisme di belahan bumi ini."
 south_american_events.30.a: "Isolasikan mereka secara ekonomi dan diplomatis."
 south_american_events.30.b: "Putuskan hubungan diplomatik."
 south_american_events.30.c: "Kami memiliki kekhawatiran yang lebih mendesak."
 south_american_events.31.t: "[FROM.GetNameDefCap] Mencoba Mengisolasi [ROOT.GetNonIdeologyName]"
 south_american_events.31.desc.a: "[FROM.GetAdjective] diplomat meninggalkan kedutaan mereka di [ROOT.Capital.GetCapitalVictoryPointName] hari ini setelah mengeluarkan pernyataan tegas dari pemerintah mereka. Mereka menyatakan bahwa mereka tidak akan lagi membantu kita jika kita mengalami konflik dengan negara lain dan mereka tidak menerima kita sebagai pemerintah negara yang sah.\n\nSelain itu, mereka telah memberlakukan embargo terhadap kita dalam upaya melemahkan perekonomian kita. Meskipun sudah jelas bahwa [FROM.GetNameDef] akan memusuhi rezim kita, kecepatan dan kekuatan tindakan mereka telah mengejutkan banyak orang."
 south_american_events.31.desc.b: "[FROM.GetAdjective] diplomat meninggalkan kedutaan mereka di [ROOT.Capital.GetCapitalVictoryPointName] hari ini setelah mengeluarkan pernyataan tegas dari pemerintah mereka. Mereka menyatakan bahwa mereka tidak akan lagi membantu kita jika kita mengalami konflik dengan negara lain dan mereka tidak menerima kita sebagai pemerintah sah negara tersebut.\n\nMeskipun sudah jelas bahwa [FROM.GetNameDef] akan memusuhi rezim kita, kecepatan dan kekuatan tindakan mereka mengejutkan banyak orang."
 south_american_events.31.a: "Imperialis yang sombong!"
 south_american_events.32.t: "Mendukung Anti-Komunis di [FROM.GetNonIdeologyName]"
 south_american_events.32.desc: "Karena [FROM.GetNonIdeologyName] baru-baru ini terjerumus ke dalam perang saudara, banyak industrialis dan warga negara kita mengumpulkan bantuan untuk pemerintah [FROM.GetAdjective] yang sedang berjuang untuk membendung ancaman komunis.\n\nBeberapa orang yang lebih anti-komunis di militer sekarang menyarankan agar kita menggunakan ini sebagai kesempatan untuk memperlengkapi dan mengirim sukarelawan militer untuk membantu konflik, sambil tetap mempertahankan penolakan yang masuk akal terhadap pemerintah."
 south_american_events.32.a: "Kami akan menutup mata terhadap relawan dengan perlengkapan lengkap yang berangkat ke [FROM.GetNonIdeologyName]."
 south_american_events.32.b: "Kami tidak bisa ikut campur."
 south_american_events_32_tt: "§RKami akan kesulitan mengirimkan relawan karena§! §Y$undisturbed_isolation$§! §Rkebijakan dan ambang batas ketegangan dunia!§!"
 south_american_events.50.t: "[FROM.FROM.GetNameDefCap] Sedang Diserang"
 south_american_events.50.desc: "Komitmen kami terhadap doktrin Monroe dipertanyakan dengan deklarasi perang baru-baru ini terhadap [FROM.FROM.GetNameDef]. Meskipun banyak warga negara kita yang tidak tertarik dengan kemungkinan dikirim untuk berperang membela [FROM.FROM.GetNonIdeologyName], para ahli kebijakan luar negeri kita menyatakan keprihatinan bahwa kegagalan untuk bertindak dalam pembelaan mereka dapat menyebabkan efek domino dari campur tangan kekuatan asing di belahan bumi kita."
 south_american_events.50.a: "Menuntut diakhirinya permusuhan terhadap [FROM.FROM.GetNonIdeologyName]"
 south_american_events.50.b: "Mengapa tentara kita harus mati demi [FROM.FROM.GetNonIdeologyName]?"
 south_american_events_50_war_tt: "§RAkan memicu perang dengan [FROM.GetName] jika mereka menolak!§!"
 south_american_events.51.t: "[USA.GetNameDefCap] Menegakkan Doktrin Monroe"
 south_american_events.51.desc: "Para diplomat kami berharap [USA.GetNameDef] akan menutup mata terhadap aktivitas kami di Amerika, namun tampaknya kami tidak beruntung. Kami sekarang telah menerima komunike mendesak dari [USA.Capital.GetCapitalVictoryPointName] yang menuntut agar kami menghentikan semua aktivitas permusuhan di belahan bumi ini, atau mereka akan menganggapnya sebagai tindakan perang melawan [USA.GetNameDef]. Kita harus berhati-hati jika ingin menghindari konflik ini semakin meningkat."
 south_american_events.51.a: "Kami tidak tertarik untuk berkonflik dengan [USA.GetNameDef]"
 south_american_events.51.b: "Ini bukan urusan mereka, sebut saja gertakan mereka."
 south_american_events.52.t: "[FROM.GetNameDefCap] Setuju untuk Mengakhiri Permusuhan"
 south_american_events.52.desc: "Para diplomat [FROM.GetAdjective] telah memberi tahu kami bahwa mereka siap menghentikan permusuhan di belahan bumi Barat dan kembali menggunakan cara diplomatik untuk menyelesaikan masalah mereka untuk saat ini. Apakah perdamaian yang ditengahi ini akan bertahan masih harus dilihat."
 south_american_events.52.a: "Dunia akan berpikir dua kali untuk menyerang halaman belakang kita."
 south_american_events.52.b: "Paman Sam mengucapkan terima kasih."
 south_american_events.53.t: "[FROM.GetNameDefCap] Menolak Mengakhiri Permusuhan"
 south_american_events.53.desc: "Para diplomat [FROM.GetAdjective] telah memberi tahu kami bahwa [USA.GetNameDef] tidak berhak ikut campur dalam keluhan pemerintah mereka yang dianggap sah. Oleh karena itu, mereka telah menyatakan bahwa mereka akan terus bertindak demi kepentingan mereka sendiri di belahan bumi Barat selama dianggap perlu."
 south_american_events.53.a: "Kalau begitu, ini perang…"
 south_american_events.54.t: "[FROM.GetNameDefCap] Menegakkan Doktrin Monroe"
 south_american_events.54.desc: "Kami telah menerima komunike mendesak dari [FROM.Capital.GetCapitalVictoryPointName] yang menyatakan bahwa mereka tidak akan mengizinkan tindakan agresi dilakukan terhadap kami dan bahwa mereka sedang melakukan pembicaraan dengan musuh kami untuk mengakhiri permusuhan. Jika mereka gagal melakukannya, mereka bersumpah akan membela kita."
 south_american_events.54.a: "Luar biasa!"
 south_american_events.55.t: "[FROM.GetNameDefCap] Mengabaikan Konflik"
 south_american_events.55.desc: "[FROM.GetNameDefCap] kedutaan di [ROOT.Capital.GetCapitalVictoryPointName] dievakuasi hari ini karena permusuhan baru-baru ini di wilayah tersebut. Para diplomat dari kedutaan telah memberi tahu kami bahwa pemerintah mereka tidak ingin terlibat dalam perang asing lagi."
 south_american_events.55.a: "Jadi kita sendirian kalau begitu..."
 south_american_news.60.t: "[BRA.GetAdjective] Militer Meluncurkan Kudeta"
 south_american_news.60.desc: "Meskipun ada upaya yang dilakukan oleh Presiden $BRA_getulio_vargas$ untuk mendekati berbagai faksi dalam militer dan gerakan Integralis, faksi tersebut menjadi tidak sabar dengan laju perubahan yang dilakukan oleh presiden yang terkepung dan mengambil tindakan sendiri. Dalam operasi militer yang cepat, infrastruktur dan komunikasi utama diamankan di seluruh negara sebelum pasukan menyerbu Istana Catete di Rio de Janeiro di mana $BRA_getulio_vargas$ ditangkap.\n\nMeskipun masih harus dilihat apa yang akan berubah dalam politik sehari-hari negara di bawah pemerintahan militer, satu hal yang pasti adalah bahwa pemerintahan baru akan mengambil tindakan keras terhadap setiap gejolak perbedaan pendapat komunis di kalangan masyarakat."
 south_american_news.60.a: "Akankah Brasil menemukan kedamaian?"
#### Chile #####
 CHL_political_events.1.t: "[CHL.GetNameDefCap] Mengusulkan Aliansi Bersama"
 CHL_political_events.1.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah mengusulkan permohonan timbal balik kepada Sekutu, dalam upaya untuk menjaga perairan dan tanah kita, sekaligus tidak saling merobek kapal sekutu dekat satu sama lain, dan memutuskan hubungan timbal balik antar negara kita. Mungkin bijaksana untuk menerima permintaan mereka."
 CHL_political_events.1.a: "Kami tidak melihat ada salahnya hal ini"
 CHL_political_events.1.b: "Apakah mereka gila!?"
 CHL_political_events.2.t: "Aplikasi Bersama Argentina-Chili"
 CHL_political_events.2.desc: "Negara-negara Amerika Selatan seperti Chile dan Argentina telah menghubungi kami dengan permohonan bersama untuk bergabung dengan faksi kami. Mereka menyatakan bahwa mereka ingin membantu kami, sambil melindungi kepentingan mereka sendiri. Bagaimana menurut kita?"
 CHL_political_events.2.a: "Mereka diterima di sini"
 CHL_political_events.2.b: "Tidak, kami bilang!"
 CHL_political_events.3.t: "[ARG.GetName] menolak permintaan kami"
 CHL_political_events.3.desc: "[ARG.GetLeader] yang keji telah menolak permintaan kami yang adil dan masuk akal untuk mengajukan permohonan bersama kepada sekutu, dan inilah saatnya dia menyadari kerugiannya. Bagaimanapun, kita lebih kuat jika kita sendiri, dan tidak pernah membutuhkannya sejak awal..."
 CHL_political_events.3.a: "Maka mereka tidak diragukan lagi adalah musuh kita"
 CHL_political_events.4.t: "[CHL.GetName] Pindah ke Menempati [953.GetName]"
 CHL_political_events.4.desc: "Pasukan milik negara bagian [CHL.GetAdjective] telah mulai melintasi perbatasan yang telah ditetapkan sebelumnya di [953.GetName], dan angkatan udara serta angkatan laut mereka sudah dimobilisasi. Tampaknya mereka serius untuk mengambil kendali atas pulau yang diperebutkan tersebut, dan tidak jelas apakah kita dapat menghentikan hal ini melalui mediasi. Apa yang harus menjadi tindakan kita?"
 CHL_political_events.4.a: "Tidak ada gunanya melawan mereka"
 CHL_political_events.4.b: "Ayo ambil jika kamu berani!"
 CHL_political_events.5.t: "[ARG.GetName] Mundur dari [953.GetName]"
 CHL_political_events.5.desc: "[ARG.GetName] telah memutuskan bahwa mempertahankan [953.GetName] di hadapan kekuatan militer kita tidak sebanding dengan penderitaannya, dan terlihat menarik pasukan mereka dari provinsi tersebut. Hal ini untuk pertama kalinya menyerahkan wilayah yang disengketakan ke tangan kita, dan kampanye integrasi dapat segera dimulai."
 CHL_political_events.5.a: "Hari ini adalah kemenangan bagi rakyat Chili!"
 CHL_political_events.6.t: "[ARG.GetName] Menolak Mundur dari [953.GetName]"
 CHL_political_events.6.desc: "[ARG.GetName] tetap menentang posisi mereka sebagai pemilik pulau yang disengketakan, dan menyatakan bahwa kita harus merebutnya dengan paksa jika kita menginginkannya. Masyarakat kami mendukung tujuan ini, dan para politisi mulai bersuara mendukung disintegrasi negara Argentina."
 CHL_political_events.6.a: "Kita tidak bisa mundur secara wajar sekarang"
 CHL_political_events.7.t: "Gerutuan Anti-Sosialis di Militer"
 CHL_political_events.7.d: "Telah menjadi perhatian kita bahwa ada orang-orang di kalangan militer yang akan merusak reputasi militer karena selalu bersikap non-politik, dengan secara terbuka mengkritik rakyat atas pilihan mereka sebagai presiden, dan dengan jelas menyatakan bahwa sosialisme pada dasarnya jahat. Orang-orang ini jelas-jelas mengalami delusi, namun kita harus tetap waspada, jika kita ingin kudeta yang lain hanya menjadi mimpi buruk yang buruk."
 CHL_political_events.7.a: "Ini bukan pertanda baik"
 CHL_political_events.8.t: "Ariostazo"
 CHL_political_events.8.d: "Sebelumnya hari ini, terjadi pemberontakan singkat resimen artileri Tacna yang dipimpin oleh Jenderal Ariosto Herrera. Herrera dikenal sebagai pendukung mantan presiden Carlos Ibáñez del Campo, dan tampaknya sangat dipengaruhi oleh masa jabatannya sebagai atase militer di Italia. Pada tanggal 21 Mei 1939, ketika Jenderal Herrera tiba di Istana Kepresidenan untuk sebuah upacara, dia melihat sebuah bendera merah tergantung di salah satu balkon dan tiba-tiba dia meraihnya dan merobeknya, dan ini adalah pertama kalinya kecurigaan nyata dilontarkan terhadapnya. Meskipun demikian, dia tidak mendapat dukungan besar-besaran, dan semuanya baik-baik saja lagi."
 CHL_political_events.8.a: "Setidaknya ketertiban telah dipulihkan"
 CHL_political_events.9.t: "Tenggelamnya SS Tolten"
 CHL_political_events.9.d: "SS Tolten sedang berlayar di luar Barnegat, New Jersey, ketika dihantam torpedo yang datang dari kapal selam Jerman kemarin. Kapal kargo tersebut dibeli dari Denmark, tetapi 27 awaknya adalah warga Chili, dan hanya satu yang selamat. Menteri luar negeri kami telah menyatakan bahwa dia tidak ingin berbicara dengan rekannya dari Jerman, dan orang-orang di Santiago mengadakan protes anti-Jerman di jalan-jalan. Bagaimana kita menyikapi situasi ini?"
 CHL_political_events.9.a: "Kutuk Tindakan Mereka"
 CHL_political_events.9.b: "Permintaan Kompensasi"
 CHL_political_events.9.c: "Ini berarti perang!"
 CHL_sunk_the_tolten: "Tenggelamkan SS Tolten"
 CHL_political_events.10.t: "[CHL.GetName] menuntut Kompensasi untuk SS Tolten"
 CHL_political_events.10.desc: "Pemimpin [CHL.GetAdjective] dari [CHL.GetLeader] telah secara resmi menghubungi kami, menuntut permintaan maaf serta kompensasi atas tenggelamnya kapal kargo Chili SS Tolten minggu lalu. Ia menyatakan bahwa merupakan tanggung jawab kita untuk menjunjung standar internasional, dan merenungkan tindakan tidak senonoh yang kita lakukan dalam perang kapal selam."
 CHL_political_events.10.a: "Jika itu adalah kompensasi yang mereka inginkan, mereka bisa mendapatkannya"
 CHL_political_events.10.b: "Kami tidak tunduk pada orang lemah seperti mereka"
 CHL_political_events.11.t: "[GER.GetName] Memberi kami Kompensasi"
 CHL_political_events.11.desc: "[GER.GetLeader] telah menyampaikan permintaan maaf resmi, walaupun tampaknya tidak mungkin, dan juga setuju untuk memberikan kompensasi ekonomi sebagai imbalan atas kapal tersebut, serta nyawa yang hilang bagi Chile dalam insiden Tolten."
 CHL_political_events.11.a: "Mungkin mereka memang berakal sehat"
 CHL_political_events.12.t: "[GER.GetName] Menolak Kompensasi kepada kami"
 CHL_political_events.12.desc: "[GER.GetLeader] melanjutkan salah satu omelan mereka yang biasa, mengklaim bahwa pemerintah Chili berpikiran lemah dan rapuh, dan bahwa tidak perlu memberikan kompensasi kepada negara yang nilainya kecil atau bahkan tidak ada sama sekali. Saat ini kami tidak mempunyai kekuatan untuk membantah klaim-klaim tersebut, dan jika kami membesar-besarkannya maka hal ini merupakan tindakan yang kekanak-kanakan..."
 CHL_political_events.12.a: "Ya, memang begitulah adanya"
 CHL_political_events.13.t: "Pembantaian Seguro Obrero"
 CHL_political_events.13.desc: "Gerakan Sosialis Nasional Chili telah mencoba melakukan kudeta, tetapi tidak berhasil. Carabineros kita telah menghentikan pemberontakan mereka, dengan korban yang terbatas, yang berasal dari baku tembak dan pertikaian di luar Universitas Chile yang diduduki. Óscar Novoa Fuentes dan Humberto Arriagada Valdivieso memimpin pasukan kita selama pertempuran, dan akan diberi imbalan yang memadai."
 CHL_political_events.13.a: "Mereka seharusnya tidak mengganggu kita lagi"
 CHL_political_events.14.t: "Pemberontakan Nacista"
 CHL_political_events.14.desc: "Gerakan Sosialis Nasional Chili telah mencoba melakukan kudeta, tetapi tidak berhasil. Ketika mereka diusir dari ibukota, mereka memanfaatkan popularitas mereka yang berskala besar untuk mendeklarasikan perang terhadap rezim kita, dan dengan demikian, perang saudara akan segera terjadi, meskipun tidak sebesar yang dikhawatirkan oleh sebagian orang."
 CHL_political_events.14.a: "Bersiaplah untuk bertarung bahkan dengan teman terdekatmu!"
 CHL_political_events.15.t: "Pertempuran Seguro Obrero"
 CHL_political_events.15.desc: "Gerakan Sosialis Nasional Chili telah mencoba melakukan kudeta, tetapi tidak berhasil. Carabinero kita telah menghentikan pemberontakan mereka, namun memakan banyak korban dalam pertempuran besar-besaran untuk memperebutkan Universitas Chile, setelah Nacista mendudukinya. Mereka telah mundur untuk saat ini, tapi tidak yakin apakah mereka akan mencoba hal seperti ini lagi nanti."
 CHL_political_events.15.a: "Itu terlalu dekat..."
 nacista_coup_attempt_happened: "Upaya Kudeta Nacista Telah Terjadi"
 CHL_political_events.16.t: "Pemilihan Presiden tahun 1942"
 CHL_political_events.16.d: "Pemilihan presiden telah tiba lagi, dan masa jabatan [ROOT.GetLeader] telah berakhir. Sebagian besar krisis kini telah diatasi, namun dengan adanya perang di seluruh dunia, stabilitas masih belum tercapai. Siapa yang harus mengambil peran Alessandri untuk mandat ini, dan memimpin negara menuju masa depan yang cerah?"
 CHL_political_events.16.a: "Juan Antonio Rios"
 CHL_political_events.16.b: "Eduardo Cruz-Coke"
 CHL_political_events.16.c: "Carlos Ibanez del Campo"
 CHL_political_events.16.e: "Elias Lafertte Gaviño"
 CHL_political_events.17.t: "Pemilihan Presiden tahun 1946"
 CHL_political_events.17.desc: "Pemilihan presiden telah tiba lagi, dan masa jabatan [ROOT.GetLeader] telah berakhir. Konflik global akan segera berakhir, namun belum berakhir. Pertanyaan yang ada di benak semua orang saat ini adalah: Siapa yang harus mengambil peran Alessandri untuk mandat berikutnya, dan memimpin negara di masa-masa sulit ini?"
 CHL_political_events.17.a: "Gabriel González Videla"
 CHL_political_events.17.b: "Eduardo Cruz-Coke"
 CHL_political_events.17.c: "Fernando Alessandri"
 CHL_political_events.17.e: "Marmaduke Grove Vallejo"
 CHL_political_events.18.t: "Pemilihan Panglima Angkatan Darat yang Baru"
 CHL_political_events.18.desc: "Ada banyak orang di tentara kita yang bersedia mengemban tanggung jawab dan tanggung jawab untuk memimpin, dan banyak juga yang siap dan bersedia berjuang sampai nafas terakhirnya demi negara kita. Karena adanya presiden baru, kita sekarang perlu memilih pengganti Óscar Novoa Fuentes, yang saat ini telah menjabat posisi tersebut selama hampir lima tahun. Siapa yang akan memimpin pasukan kita sebagai panglima nomor satu?"
 CHL_political_events.18.a: "Carlos Fuentes Rabe"
 CHL_political_events.18.b: "Escudero Oscar Otárola"
 CHL_political_events.18.c: "Guilliermo Barrios Tirado"
 CHL_political_events.18.d: "Alfredo Portales Mougues"
 CHL_political_events.19.t: "Angin Perubahan"
 CHL_political_events.19.desc: "Setelah mendapat kritik dari seluruh penjuru negeri, Arturo Alessandri mengundurkan diri dan menyerukan pemilu sela, dan kali ini tampaknya angin bertiup lebih berpihak pada kelompok sayap kiri, karena masyarakat berkerumun di sekitar tempat pemungutan suara. Siapa yang akan memimpin, dan bagaimana peristiwa ini akan membentuk republik baru?"
 CHL_political_events.19.a: "Elías Lafertte Gaviño akan memimpin Republik baru"
 CHL_political_events.19.b: "Pedro Aguirre Cerda adalah Favorit Rakyat"
 CHL_wont_becocme_communist_tt: "Anda akan §RTidak§! menjadi komunis melalui fokus §YMeningkatkan Kekuasaan Presiden§!"
 CHL_can_becocme_communist_tt: "Anda §GDapat§! menjadi komunis melalui fokus §YMeningkatkan Kekuasaan Presiden§!"
 CHL_political_events.20.t: "Konferensi Santiago"
 CHL_political_events.20.desc: "Partai Komunis hari ini mengadakan pertemuan dengan tujuan tunggal untuk memutuskan jalan yang harus diambil negara ini di tahun-tahun mendatang, serta memilih orang yang akan membantu membawa negara menuju kemajuan, mengingat koalisi besar yang ada saat ini tidak dapat sepenuhnya menyetujui semua poin, dan membutuhkan seseorang untuk mengambil tindakan dan memberikan panduan. Saat ini ia berdiri di antara kaum Marxis Elias Lafertte Gavino, kaum Sosialis Marmaduke Grove Vallejo, kaum Stalinis Carlos Contreras Labarca dan kaum Trotskis Manuel Hidalgo Plaza."
 CHL_political_events.20.a: "Elias Lafertte Gavino"
 CHL_political_events.20.b: "Marmaduke Grove Vallejo"
 CHL_political_events.20.c: "Carlos Contreras Labarca"
 CHL_political_events.20.d: "Plaza Manuel Hidalgo"
 CHL_political_events.21.t: "[PRU.GetName] Menyeberang ke Pastaza"
 CHL_political_events.21.desc: "Pasukan yang tergabung dalam [PRU.GetNameDef] mulai kemarin mulai menyeberang ke wilayah Napo-Pastaza, sebuah negara bagian yang bukan milik mereka. Setelah perang Pasifik, baru-baru ini kita harus menyerahkan Tacna dan menyerahkannya kembali ke Peru sebagai bagian dari kesepakatan, namun karena mereka tidak menghormati perbatasan internasional, kita juga tidak perlu melakukannya."
 CHL_political_events.21.a: "Kita harus menekankan klaim kita pada Tacna"
 CHL_political_events.21.b: "Tidak ada gunanya memprovokasi mereka"
 CHL_political_events.22.t: "[CHL.GetNameDefCap] ingin bergabung dengan faksi kami"
 CHL_political_events.22.desc: "[CHL.GetLeader] telah menghubungi kami dengan harapan bahwa kami akan mengizinkan [CHL.GetNameDef] untuk diizinkan masuk ke dalam faksi kami, sehingga kami dapat berjuang bersama atas nama revolusi dunia, sebagai kawan seperjuangan. Bagaimana pendapat kita mengenai hal ini?"
 CHL_political_events.22.a: "Kami akan menyambut rekan-rekan baru kami"
 CHL_political_events.22.b: "Mengapa kita harus peduli dengan Amerika Selatan?"
 CHL_political_events.23.t: "Soviet Izinkan Kami Bergabung"
 CHL_political_events.23.desc: "[SOV.GetLeader] telah mengumumkan kepada politbiro hari ini bahwa serikat pekerja memiliki sekutu baru di [CHL.GetNameDef], koneksi ke Amerika Selatan dan basis persiapan melawan Amerika jika diperlukan. Jadi, kami adalah bagian dari faksi mereka, dan kami berdua pasti akan berkembang bersama."
 CHL_political_events.23.a: "Kita akan menjadi lebih kuat bersama-sama"
 CHL_political_events.24.t: "Soviet Menolak Pengakuan Kami"
 CHL_political_events.24.desc: "[SOV.GetLeader] telah mengumumkan kepada politbiro hari ini bahwa serikat pekerja menolak permintaan kami untuk bergabung dengan faksi mereka, dengan menyatakan bahwa hal itu akan mengancam keamanan global dan mengganggu keseimbangan antara mereka dan musuh-musuh mereka dengan cara yang tidak menguntungkan."
 CHL_political_events.24.a: "Kita telah ditipu, ditikam dari belakang dan sangat mungkin diperdaya..."
 CHL_political_events.25.t: "[CHL.GetName] menyarankan agar kita menjadi satu dengan mereka"
 CHL_political_events.25.desc: "[CHL.GetLeader] telah mendekati kami dengan permintaan agar kami bergabung dengan mereka dan menjadi satu, untuk membentuk Republik Pekerja Hispanik. Ia telah menyatakan bahwa kita diharuskan untuk bergabung jika kita ingin melawan kekuatan imperialis asing."
 CHL_political_events.25.a: "Kita harus bergabung dengan mereka!"
 CHL_political_events.25.b: "Kerja sama yang lebih erat harus dilakukan"
 CHL_political_events.25.c: "Kami tidak membutuhkan mereka"
 CHL_we_will_be_annexed_tt: "Kami akan §RDianeksasi§! oleh §Y[CHL.GetNameDef]§!"
 CHL_we_will_be_puppeted_tt: "Kami akan menjadi §RBoneka§! dari §Y[CHL.GetNameDef]§!"
 CHL_political_events.26.t: "[FROM.GetName] Menerima Aneksasi"
 CHL_political_events.26.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menerima tawaran aneksasi kami, dan negara mereka selanjutnya akan menjadi bagian integral dari negara kami. Hidup revolusi!"
 CHL_political_events.26.a: "Sempurna"
 CHL_political_events.27.t: "[FROM.GetName] Menerima Dominasi"
 CHL_political_events.27.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menerima tawaran dominasi kami, dan negara mereka selanjutnya akan menjadi mitra integral kami. Hidup revolusi!"
 CHL_political_events.27.a: "Cukup Baik"
 CHL_political_events.28.t: "[FROM.GetName] Memilih Menentang kami"
 CHL_political_events.28.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menolak tawaran aneksasi kami. Bagaimana kita harus menghadapinya?"
 CHL_political_events.28.a: "Kami akan menghancurkan mereka!"
 CHL_political_events.28.b: "Kami akan menanganinya nanti"
 CHL_political_events.29.t: "Fasis Chile menginginkan dukungan kita"
 CHL_political_events.29.desc: "Kaum fasis yang tergabung dalam partai Movimiento Nacional-Socialista di Chile telah menghubungi kami dan memberitahukan rencana mereka untuk melakukan kudeta terhadap pemerintah Chile saat ini. Mereka meminta dukungan kami dalam upaya ini, dalam bentuk tenaga, peralatan, dan bantuan politik. Haruskah kita membantu mereka?"
 CHL_political_events.29.a: "Kita harus membantu mereka"
 CHL_political_events.29.b: "Mereka tidak memerlukan bantuan kita"
 CHL_political_events.30.t: "[FROM.GetName] Akan Membantu Kami"
 CHL_political_events.30.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah berjanji untuk membantu kami dalam upaya kami untuk mengkudeta pemerintah saat ini dan menerapkan kediktatoran yang dapat melawan Amerika."
 CHL_political_events.30.a: "Sempurna"
 CHL_political_events.31.t: "[FROM.GetName] Memilih untuk tidak Membantu Kami"
 CHL_political_events.31.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memilih untuk menolak bantuan kami dalam upaya kami untuk mengkudeta pemerintahan saat ini dan menerapkan kediktatoran yang dapat melawan Amerika."
 CHL_political_events.31.a: "Kami telah dikhianati"
 CHL_political_events.32.t: "[CHL.GetName] ingin bergabung dengan Axis"
 CHL_political_events.32.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah datang kepada kami meminta untuk bergabung dengan faksi kami. Ia mengklaim bahwa kita akan menjadi jauh lebih kuat jika kita bersatu, dan kita akan mampu menggulingkan hegemoni Amerika dengan bantuan mereka."
 CHL_political_events.32.a: "Kami akan mengizinkannya"
 CHL_political_events.32.b: "Kami lebih kuat tanpa mereka"
 CHL_political_events.33.t: "[GER.GetLeader] Menerima Permintaan kami"
 CHL_political_events.33.desc: "[GER.GetLeader] dari [GER.GetNameDef] telah mengumumkan bahwa mulai hari ini dan seterusnya, [CHL.GetNameDef] akan menjadi sekutu penting bagi mereka, yang dapat membantu upaya untuk mendapatkan kendali penuh atas Amerika. Beliau telah menyatakan bahwa hari ini adalah hari yang menandai awal dari berakhirnya demokrasi di Amerika, dan itu adalah hari ini. adalah hari yang mulia."
 CHL_political_events.33.a: "Benar-benar hari yang mulia!"
 CHL_political_events.34.t: "[GER.GetLeader] Menolak Permintaan kami"
 CHL_political_events.34.desc: "[GER.GetLeader] dari [GER.GetNameDef] telah mengumumkan bahwa kami tidak akan diizinkan masuk ke faksi mereka, karena kami bukan bagian dari rencana mereka untuk masa depan dunia ini. Apa sebenarnya yang mereka rencanakan?"
 CHL_political_events.34.a: "Mereka akan menyesali ini..."
 CHL_political_events.35.t: "[CHL.GetNameDefCap] mengundang kami ke Aliansi Hispanik"
 CHL_political_events.35.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah menghubungi kami, mengundang kami untuk bergabung dengan faksi baru mereka, Aliansi Hispanik. Bagaimana menurut kita?"
 CHL_political_events.35.a: "Bersama-sama, kita akan mengklaim hari itu"
 CHL_political_events.35.b: "Masa depan adalah milik kita sendiri"
 CHL_political_events.36.t: "[FROM.GetNameDefCap] bergabung dengan Aliansi Hispanik"
 CHL_political_events.36.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah dengan baik hati memutuskan untuk menerima usulan kami agar mereka bergabung dengan kami, dan sekarang kami berdiri bersama dalam catatan sejarah."
 CHL_political_events.36.a: "Masa depan terlihat cerah"
 CHL_political_events.37.t: "[FROM.GetNameDef] menolak bergabung dengan Aliansi Hispanik"
 CHL_political_events.37.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] dengan bodohnya telah memutuskan untuk menolak usulan kami agar mereka bergabung dengan faksi kami, Aliansi Hispanik. Tuhan akan menghakimi mereka pada waktunya."
 CHL_political_events.37.a: "Apakah mereka tidak takut pada kita?"
 CHL_political_events.38.t: "[CHL.GetName] Mengundang kami ke Fraksi [GER.GetAdjective]"
 CHL_political_events.38.desc: "[CHL.GetLeader] telah mengundang kami untuk bergabung dengan mereka sebagai bagian dari faksi [GET.GetNameDef], untuk menghalangi campur tangan Amerika dalam urusan Hispanik. Mereka mengklaim bahwa meskipun kita lebih lemah dan terpecah belah, kita bisa mengalahkan Amerika Serikat, selama kita bekerja sama."
 CHL_political_events.38.a: "Bersama-sama, kita bisa menjatuhkan AS!"
 CHL_political_events.38.b: "Itu terlalu berisiko..."
 CHL_political_events.39.t: "[FROM.GetName] Bergabung dengan Fraksi kami!"
 CHL_political_events.39.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] adalah orang yang berakal sehat, dan menyimpulkan bahwa yang paling bijaksana adalah bekerja sama dengan kami. Dia telah menandatangani semua dokumen yang kami ajukan, dan sekarang akan membantu pertahanan belahan bumi kita."
 CHL_political_events.39.a: "Kami akan mempertahankan benua kami!"
 CHL_political_events.40.t: "[FROM.GetName] Memutuskan untuk tidak bergabung dengan faksi kami"
 CHL_political_events.40.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] adalah orang yang bodoh, dan menyimpulkan bahwa dia lebih suka menderita penindasan dari Imperialisme Amerika daripada mengambil risiko berperang melawan mereka. Namun tidak banyak yang bisa dilakukan mengenai pendirian mereka, jadi kita perlu meninggalkan pertanyaan itu di sana."
 CHL_political_events.40.a: "Oh baiklah..."
 CHL_political_events.41.t: "[CHL.GetName] Permintaan kami sampaikan kepada [GER.GetNameDef]"
 CHL_political_events.41.desc: "[CHL.GetLeader] dan [GER.GetLeader] telah mengeluarkan tuntutan bersama agar Uruguay tunduk kepada mereka. Tampaknya mereka menuntut kami menjadi protektorat [GER.GetAdjective]. Apakah kita menyerah pada tekanan mereka?"
 CHL_political_events.41.a: "Kami tidak punya pilihan"
 CHL_political_events.41.b: "Kita harus melawan fasis!"
 CHL_political_events.42.t: "[URG.GetName] Dikirim ke [GER.GetNameDef]"
 CHL_political_events.42.desc: "[URG.GetLeader] hari ini secara resmi mengumumkan pengunduran dirinya sebagai presiden [URG.GetNameDef], dan menyerahkan kekuasaan kepada [GER.GetAdjective] yang didukung Arnulf Fuhrmann."
 CHL_political_events.42.a: "Luar biasa"
 CHL_political_events.43.t: "[URG.GetName] Kirim ke kami"
 CHL_political_events.43.desc: "Berkat tekanan yang diberikan oleh pemerintah [CHL.GetAdjective], negara [URG.GetNameDef] terpaksa tunduk kepada kami, sesuai dengan rencana rahasia kolonial yang ditulis pada tahun-tahun sebelumnya. Hal ini akan membantu memperluas pengaruh kami di benua Amerika dan juga membantu kami dalam menjaga agar Amerika tidak terlibat di Amerika Selatan."
 CHL_political_events.43.a: "Itu isi perut"
 CHL_political_events.44.t: "[URG.GetName] Menolak untuk Menyerah"
 CHL_political_events.44.desc: "[URG.GetLeader] yang bodoh telah memutuskan untuk melawan tatanan dunia baru yang diimpikan oleh para pemikir dan politisi [CHL.GetAdjective] dan [GER.GetAdjective]. Dia tidak bisa melihat air pasang bergulung, dan dia tidak akan berada di sana untuk melihat ombak menghantam pantai."
 CHL_political_events.44.a: "Beraninya kamu!"
 CHL_political_events.45.t: "Saudara-saudara Kami di [CHL.GetNameDef] Ajak kami ke Poros"
 CHL_political_events.45.desc: "Saudara-saudara kami yang keturunan Hispanik dan Latin di Amerika Selatan, [CHL.GetAdjective], telah meminta kami untuk bergabung dengan mereka dalam sebuah faksi dengan [GER.GetNameDef], untuk mewujudkan tatanan dunia baru dengan baik sambil tetap melindungi kepentingan kami sendiri sebaik mungkin. Bagaimana menurut kita?"
 CHL_political_events.45.a: "Kami akan dengan senang hati melakukannya"
 CHL_political_events.45.b: "Kami punya rencana lain"
 CHL_political_events.46.t: "[FROM.GetName] bergabung dengan Poros"
 CHL_political_events.46.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk menerima proposal kami dan bergabung dengan kami dalam aliansi dengan [GER.GetNameDef]. Kami, saudara-saudara yang telah lama hilang, kini telah bersatu kembali, tetapi kali ini dengan syarat yang lebih setara dan adil!"
 CHL_political_events.46.a: "Bagus"
 CHL_political_events.47.t: "[CHL.GetName] ingin mengundang [FROM.GetName] ke Axis"
 CHL_political_events.47.desc: "[CHL.GetName] telah menjadi perantara perjanjian dengan [FROM.GetName]. Mereka telah meyakinkan [FROM.GetName] bahwa masa depan ada di tangan Poros. Kita hanya perlu menandatangani penerimaannya dengan tinta."
 CHL_political_events.47.a: "Ditandatangani dan Disegel"
 CHL_political_events.47.b: "Tidak pada saat ini."
 #CHL_political_events.98.t: "[FROM.GetName] joins the Axis"
 #CHL_political_events.98.desc: "Thanks to a proposal handed over by their Hispanic brothers in [CHL.GetNameDef], [FROM.GetLeader] of [FROM.GetNameDef] has decided to join our faction to help us make a stronger future, and fight against our every enemy. We are stronger together!"
 #CHL_political_events.98.a: "Sehr Gut"
 CHL_political_events.48.t: "[FROM.GetName] tidak bergabung dengan Axis"
 CHL_political_events.48.desc: "Sedihnya, terlepas dari daya tarik emosional kami terhadap mereka, [FROM.GetLeader] dan orang-orangnya telah memutuskan bahwa mereka akan lebih baik tanpa kami, dan belum menjelaskan secara rinci alasan mereka mengambil keputusan ini. Kami tidak akan bertemu kembali dengan [FROM,GetNameDef] untuk saat ini."
 CHL_political_events.48.a: "Kalau begitu, kita harus melakukan ini sendirian"
 CHL_political_events.49.t: "[CHL.GetNameDefCap] mengundang kami ke Aliansi Hispanik"
 CHL_political_events.49.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah menghubungi kami, mengundang kami untuk bergabung dengan faksi baru mereka, Aliansi Hispanik. Bagaimana menurut kita?"
 CHL_political_events.49.a: "Bersama-sama, kita akan mengklaim hari itu"
 CHL_political_events.49.b: "Masa depan adalah milik kita sendiri"
 CHL_political_events.50.t: "[FROM.GetNameDefCap] bergabung dengan Aliansi Hispanik"
 CHL_political_events.50.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah dengan baik hati memutuskan untuk menerima usulan kami agar mereka bergabung dengan kami, dan sekarang kami berdiri bersama dalam catatan sejarah."
 CHL_political_events.50.a: "Bagus"
 CHL_political_events.51.t: "[FROM.GetNameDefCap] menolak bergabung dengan Aliansi Hispanik"
 CHL_political_events.51.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] dengan bodohnya telah memutuskan untuk menolak usulan kami agar mereka bergabung dengan faksi kami, Aliansi Hispanik. Tuhan akan menghakimi mereka pada waktunya."
 CHL_political_events.51.a: "Apakah mereka tidak takut pada kita?"
 CHL_political_events.52.t: "[CHL.GetName] menuntut kami menyerahkan [947.GetName]"
 CHL_political_events.52.desc: "Setelah mobilisasi besar-besaran baru-baru ini di perbatasan dan protes selama seminggu yang dilakukan oleh masyarakat [CHL.GetAdjective], [CHL.GetLeader] telah mengumumkan bahwa sudah saatnya [CHL.GetNameDef] mendapatkan kembali kendali atas wilayah [947.GetName], bahwa mereka menandatangani perjanjian Lima, yang kini mereka klaim tidak adil dan batal demi hukum."
 CHL_political_events.52.a: "Kami tidak ingin mengambil risiko perang lagi"
 CHL_political_events.52.b: "Ini adalah kesempatan kita untuk merebut kembali Arica!"
 CHL_political_events.53.t: "[FROM.GetName] Menerima Permintaan kami"
 CHL_political_events.53.desc: "Pemerintahan saat ini di [FROM.GetNameDef] lemah dan kita semua mengetahuinya. Jelas sekali bahwa mereka tidak dapat melakukan perlawanan terhadap kami, dan mereka sendiri telah menyadari hal tersebut. Jadi, mulai hari ini, mereka telah menandatangani perjanjian baru, secara resmi menyerahkan departemen [947.GetName] kepada kami!"
 CHL_political_events.53.a: "Kami tumbuh lebih besar"
 CHL_political_events.54.t: "[FROM.GetName] Menolak Tuntutan kami"
 CHL_political_events.54.desc: "Pemerintah [FROM.GetAdjective] dengan keras kepala berpegang teguh pada perjanjian palsu Lima, dan menolak menyerahkan [947.GetName] kepada kami. Kita harus melakukan unjuk kekuatan, dan merebut wilayah itu dari mereka, dengan cara apa pun yang diperlukan..."
 CHL_political_events.54.a: "Kami akan membuat mereka membayar atas kekurangajaran mereka!"
 CHL_political_events.55.t: "[CHL.GetName] menuntut kita menyerah [953.GetName]"
 CHL_political_events.55.desc: "Setelah mobilisasi besar-besaran baru-baru ini di perbatasan dan protes selama seminggu yang dilakukan oleh masyarakat [CHL.GetAdjective], [CHL.GetLeader] telah mengumumkan bahwa sudah saatnya [CHL.GetNameDef] menduduki [953.GetName] untuk diri mereka sendiri. Haruskah kita mencoba melawan mereka?"
 CHL_political_events.55.a: "Kami tidak ingin mengambil risiko berperang dengan mereka"
 CHL_political_events.55.b: "Berapa kali kita harus mengulanginya?"
 CHL_political_events.56.t: "[FROM.GetName] Menyerah pada Permintaan kami"
 CHL_political_events.56.desc: "Pemerintah di [ARG.GetNameDef] telah memutuskan untuk bersikap masuk akal dan telah menyerahkannya kepada kami dengan cara yang baik. Sekarang saatnya untuk terus mendorong, dan teruskan klaim kita hingga kita dapat menciptakan kondisi [CHL.GetAdjective] yang sempurna."
 CHL_political_events.56.a: "Hari ini kami menyambut Delapan Puluh Ribu warga Chili baru"
 CHL_political_events.57.t: "[FROM.GetName] Menolak Tuntutan kami"
 CHL_political_events.57.desc: "[ARG.GetLeader] dari [ARG.GetNameDef] telah memutuskan bahwa akan lebih bijaksana jika melawan kita, dan oleh karena itu kita harus menunjukkan kepadanya bahwa dia mempermainkan orang yang salah. Majulah, pria dan wanita Chili!"
 CHL_political_events.57.a: "Maka kita harus mengambilnya dengan paksa"
 CHL_political_events.58.t: "Pasukan kami bentrok di sekitar Laguna del Desierto"
 CHL_political_events.58.desc: "Pasukan kami telah melaporkan bentrokan dengan pasukan [CHL.GetAdjective] di sekitar Lago del Desierto di Santa Cruz. Mereka menyatakan bahwa pasukan [CHL.GetAdjective] bergerak semakin jauh ke arah timur, tampaknya dalam upaya menduduki seluruh provinsi."
 CHL_political_events.58.a: "Mundur, tidak ada gunanya berperang"
 CHL_political_events.58.b: "Tahan orang-orangmu!"
 CHL_political_events.59.t: "[FROM.GetName] menarik diri dari [954.GetName]"
 CHL_political_events.59.desc: "Pasukan [ARG.GetAdjective] yang pengecut telah mundur setelah diprovokasi oleh penjaga perbatasan kami, dan tentara kami mulai memasuki provinsi Santa Cruz yang hampir ditinggalkan. Kita sedang mengalami kemenangan di segala bidang, dan kita perlu berdoa agar hal tersebut tidak runtuh dalam waktu dekat."
 CHL_political_events.59.a: "Kami selangkah lebih dekat dengan tujuan akhir kami"
 CHL_political_events.60.t: "[FROM.GetName] bertahan"
 CHL_political_events.60.desc: "Pasukan [ARG.GetAdjective] yang pemberani namun bodoh telah memutuskan untuk bertahan di sekitar Laguna del Desierto. Pasukan kami masih menembaki mereka, tapi menunggu perintah apa yang harus dilakukan selanjutnya."
 CHL_political_events.60.a: "Pindah untuk menempati area tersebut"
 CHL_political_events.60.b: "Kami akan mengambilnya nanti"
 CHL_political_events.61.t: "[CHL.GetName] menuntut demiliterisasi Patagonia"
 CHL_political_events.61.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah menyatakan bahwa kita telah terlalu lama mengancam keamanan masyarakat [CHL.GetAdjective], dan sudah waktunya hal seperti itu diakhiri, dengan menyatakan bahwa kita perlu melanjutkan dan mendemiliterisasi wilayah Patagonia. Bagaimana kita menyikapi hal ini?"
 CHL_political_events.61.a: "Ini adalah hal yang masuk akal untuk dilakukan"
 CHL_political_events.61.b: "Mengapa kita melakukan hal itu?"
 CHL_political_events.62.t: "[FROM.GetName] mendemiliterisasi Patagonia"
 CHL_political_events.62.desc: "Pemerintah [FROM.GetAdjective] telah memenuhi tuntutan kami, dan melakukan demiliterisasi Patagonia dengan janji tidak akan merugikan rakyat kami lebih jauh. Mereka belum menyadari mengapa kami mengajukan tuntutan tersebut."
 CHL_political_events.62.a: "Mereka tidak akan melihatnya datang"
 CHL_political_events.63.t: "[FROM.GetName] tidak mendemiliterisasi Patagonia"
 CHL_political_events.63.desc: "[FROM.GetLeader] telah mengecam provokasi kami yang jelas, dan menyatakan bahwa mudah untuk melihat bahwa niat kami dengan tindakan ini adalah untuk dengan cepat dan mudah menyerang mereka ketika pertahanan mereka melemah. Namun kami tidak membutuhkan hal ini untuk menang."
 CHL_political_events.63.a: "Itu tidak akan menghambat kemajuan kita"
 CHL_political_events.64.t: "[From.GetAdjective] Perebutan Terusan Panamá"
 CHL_political_events.64.desc: "Diktator [FROM.GetNameDef], [From.GetLeader], memiliki keberanian untuk melancarkan serangan besar-besaran terhadap pasukan Terusan Panamá dari lokasi persiapan terdekat. Operasi mereka sukses dan pasukan kita mundur dalam kebingungan. [FROM.GetAdjective] tidak menyeberang ke wilayah kami yang lain, jadi ini bukanlah awal dari invasi umum, namun serangan tersebut telah melemahkan kemampuan kami untuk mengerahkan kekuatan di seluruh dunia dan mempermalukan kami di panggung internasional."
 CHL_political_events.64.a: "Sayangnya, kami memiliki kekhawatiran yang lebih mendesak. Embargo seharusnya sudah cukup."
 CHL_political_events.64.b: "Kedaulatan kita terancam. Hal ini memerlukan respons militer."
 CHL_political_events.65.t: "[From.GetAdjective] Penyitaan [311.GetName]"
 CHL_political_events.65.desc: "Diktator [FROM.GetNameDef], [From.GetLeader], memiliki keberanian untuk melancarkan serangan besar-besaran terhadap pasukan [311.GetName] kami dari lokasi terdekat. Operasi mereka sukses dan pasukan kita mundur dalam kebingungan. [FROM.GetAdjective] tidak menyeberang ke wilayah kami yang lain, jadi ini bukanlah awal dari invasi umum, namun serangan tersebut telah melemahkan kemampuan kami untuk mengerahkan kekuatan di seluruh dunia dan mempermalukan kami di panggung internasional."
 CHL_political_events.65.a: "Sayangnya, kami memiliki kekhawatiran yang lebih mendesak. Embargo seharusnya sudah cukup."
 CHL_political_events.65.b: "Kedaulatan kita terancam. Hal ini memerlukan respons militer."
 CHL_political_events.66.t: "[CHL.GetName] menuntut kendali atas wilayah Guyana kami"
 CHL_political_events.66.desc: "[CHL.GetLeader] telah mengadakan pidato besar hari ini yang mengecam apa yang kami klaim sebagai pendudukan ilegal dan tidak adil di wilayah Guyana. Ia menuntut agar kita menyerahkan wilayah ini kepada mereka saat ini juga, sehingga ia dapat membebaskan rakyat dari penindasan imperialis."
 CHL_political_events.66.a: "Tidak ada gunanya diperebutkan"
 CHL_political_events.66.b: "Di atas mayatku yang dingin!"
 CHL_political_events.67.t: "[FROM.GetName] Menerima Permintaan kami"
 CHL_political_events.67.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kami dan menyatakan bahwa pengawal regional mereka sedang dalam proses penarikan diri dari Guyana, dan akan ada prosesi penyerahan wilayah tersebut kepada kami, karena di mata mereka wilayah tersebut tidak layak untuk diperjuangkan."
 CHL_political_events.67.a: "Mereka kini bebas dari penindasan"
 CHL_political_events.68.t: "[FROM.GetName] Menolak Tuntutan kami"
 CHL_political_events.68.desc: "[FROM.GetLeader] tetap teguh pada pendiriannya bahwa wilayah Guyana adalah milik mereka dan sekutunya, dan bukan milik kekuatan lain. Tampaknya taktik negosiasi dan ruang belakang tidak akan ada gunanya lagi..."
 CHL_political_events.68.a: "Selalu ada pendekatan yang lebih langsung"
 CHL_political_events.69.t: "[CHL.GetName] menegakkan kendali atas Guyana"
 CHL_political_events.69.desc: "Setelah dikuasai sepenuhnya oleh [CHL.GetNamDef], penduduk lokal di wilayah Guyana kami berpihak pada pihak yang menang, dan tidak banyak lagi yang dapat kami lakukan untuk melegitimasi klaim kami."
 CHL_political_events.69.a: "Oh, kesengsaraannya"
 CHL_political_events.69.b: "Kami tidak mengakui hal ini!"
 CHL_political_events.70.t: "Perselisihan Kepemimpinan Mengganggu Partai"
 CHL_political_events.70.desc: "Setelah memperoleh kekuasaan di Chile melalui persatuan di bawah satu bendera, banyak kaum fasis yang berbeda kini mulai mempraktikkan gagasan dan cita-cita mereka sendiri, tanpa pengawasan atau kendali yang tepat dari pemerintah. Sudah saatnya bangsa menentukan pilihan dan memutuskan siapa yang akan memimpin, karena hanya melalui orang kuat aparatur bisa bertahan! Siapa yang akan mengambil peran tersebut?"
 CHL_political_events.70.a: "Jorge González von Marées"
 CHL_political_events.70.b: "Carlos Keller Rueff"
 CHL_political_events.70.c: "Juan Gómez Millas"
 CHL_political_events.71.t: "Kudeta Jenderal Carlos Ibáñez del Campo"
 CHL_political_events.71.desc: "Pasukan yang bersimpati pada koalisi konservatif dan fasis yang lebih luas telah mengepung Palacio de La Moneda tempat Atruro Alessandri dan kabinetnya berada. Mereka telah memerintahkan presiden untuk mundur dan mendukung mantan presiden dan jenderal Carlos Ibáñez del Campo, yang telah berjanji untuk mengembalikan negara ke nilai-nilai lama, dan menyelesaikan masalah yang belum dilakukan Alessandri. Mengingat militer berada di pihaknya, tidak banyak yang bisa dilakukan mengenai hal ini."
 CHL_political_events.71.a: "Saatnya memutar balik waktu"
 CHL_political_events.72.t: "Sesi Pertama Kongres Araucanían"
 CHL_political_events.72.desc: "Selama sesi pertama yang diadakan di Kongres Araucanían yang baru, perselisihan muncul. Meskipun semua pihak sepakat bahwa Anti-Imperialisme harus menjadi prinsip inti negara bagian Mapuche, terdapat perbedaan pendapat mengenai apakah negara lain yang memiliki cita-cita yang sama, seperti komunis dan sosialis, dapat dipercaya untuk menjadi bagian dari pemerintahan Mapuche. Beberapa mengklaim mereka bisa menjadi sekutu yang berguna, sementara beberapa lainnya mengklaim bahwa mereka akan menusuk kita dari belakang pada saat pertama mereka mendapatkannya. Siapa yang di sebelah kanan?"
 CHL_political_events.72.b: "Kami tidak akan berkompromi dengan cita-cita kami!"
 CHL_political_events.72.a: "Masih banyak lagi orang yang bersedia berjuang demi tujuan anti-imperialis"
 CHL_mapuche_commuist_cultural_cross_pollination: "Mapuche bersedia bekerja sama dengan Komunis"
 CHL_unlocks_various_communist_advisors: "§YBerbagai penasihat komunis akan mulai bekerja sama dengan Mapuche dan bersedia untuk dipekerjakan.§!"
 CHL_political_events.73.t: "Memilih Pembawa Kapak"
 CHL_political_events.73.desc: "Waktunya akhirnya tiba bagi berbagai organisasi dan kelompok Mapuche untuk memutuskan seseorang yang akan bersatu, yang akan memimpin mereka menuju kemenangan melawan musuh Spanyol mereka, menghayati semangat perang melawan Inca dan siapa yang akan membawa warisan Caupolicán. Mereka kemudian berkumpul untuk memilih Toqui baru, seorang kepala suku di masa perang, yang akan bersatu dan memimpin rakyatnya menuju kebebasan."
 CHL_political_events.73.a: "Itu pasti Manuel Manquilef"
 CHL_political_events.73.b: "Esteban Romero Sandoval mempunyai suara terbanyak"
 CHL_political_events.73.c: "Venancio Coñuepán Huenchual dapat memimpin kita"
 CHL_political_events.74.t: "Penobatan Antoine III"
 CHL_political_events.74.desc: "Saat orang-orang berkumpul di depan Istana Kepresidenan di Santiago di tengah perang yang memecah belah negara, Presiden Carlos Ibáñez del Campo mengumumkan bahwa ia dan parlemen telah memilih Jacques Antoine Bernard sebagai raja baru, merebut kembali gelar yang telah lama hilang dari garis keturunannya pada tahun 1862. Ibáñez telah menyatakan bahwa Antoine III adalah satu-satunya penyelamat yang dapat ditemukan bangsa ini sekarang, dan orang yang akan menyatukan kembali masyarakat kita yang dilanda perang."
 CHL_political_events.74.a: "Semua Salam kepada Raja Terpilih Antoine III!"
 CHL_political_events.75.t: "[CHL.GetNameDefCap] ingin menjual Arica kembali kepada kami"
 CHL_political_events.75.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah menghubungi kami dengan tawaran. Mengingat krisis ekonomi di [CHL.GetName] masih belum berakhir, dia membutuhkan dana segera, dan telah meminta agar kami membeli kembali negara bagian Arica dari mereka, yang mereka ambil dari kami dalam perjanjian damai yang ditandatangani setelah Perang Pasifik. Apakah kita menerima tawarannya?"
 CHL_political_events.75.a: "Ini adalah hari yang kita tunggu-tunggu!"
 CHL_political_events.75.b: "Kami tidak ingin mengambil risiko perang di masa depan..."
 CHL_political_events.76.t: "[PRU.GetName] memilih untuk membeli Arica dari kami"
 CHL_political_events.76.desc: "[PRU.GetLeader] telah menyatakan bahwa negara [PRU.GetName] dengan senang hati menerima tawaran kami untuk menjual Arica kepada mereka, dan telah mengirimkan utusan dengan dana yang kami minta sebagai imbalan."
 CHL_political_events.76.a: "Sebuah pengorbanan yang harus dilakukan"
 CHL_political_events.77.t: "[PRU.GetName] memilih untuk tidak membeli Arica dari kami"
 CHL_political_events.77.desc: "[PRU.GetLeader] telah menyatakan bahwa negara [PRU.GetName] tidak akan pernah menerima tawaran kami untuk menjual Arica kepada mereka, karena negara tersebut berhak untuk kembali kepada mereka tanpa pembayaran, dengan menyatakan bahwa penaklukan kami atas wilayah tersebut setelah Perang Pasifik adalah tidak adil dan ilegal."
 CHL_political_events.77.a: "Betapa tidak berterima kasihnya!"
 CHL_news_events.1.t: "Kudeta Fasis di [CHL.GetNameDef]"
 CHL_news_events.1.d: "Ada laporan bahwa Movimiento Nacional-Socialista, yang dipimpin oleh [CHL.GetLeader] telah berhasil melakukan kudeta dan mendirikan [CHL.GetNameDef] sebagai negara satu partai yang diperintah oleh mereka. Mereka mempunyai hubungan dengan gerakan fasis global, namun masih belum pasti apakah mereka akan bergabung dengan salah satu kekuatan dunia, atau tetap bertahan di benua mereka sendiri."
 CHL_news_events.1.a: "Sebuah perkembangan yang menarik tentunya"
 CHL_news_events.1.b: "Kami akan mendapatkan kembali kejayaan kami!"
 CHL_news_events.2.t: "Chili memproklamirkan Kerajaan Lama Dipulihkan"
 CHL_news_events.2.d: "[CHL.GetLeader] telah mengumumkan pemulihan Kerajaan Chili yang lama, sebuah gagasan irredentis oleh orang Chili yang mengklaim sebagian besar Argentina sejak Raja Muda Spanyol di Peru, dan [CHL.GetNameDef] telah memulai integrasi wilayah yang diklaim. Namun ambisi mereka tidak berhenti di situ, karena mereka mengklaim lebih banyak wilayah Rio de la Plata."
 CHL_news_events.2.a: "Tidak masuk akal untuk memastikan..."
 CHL_news_events.2.b: "Tidak ada yang bisa melawan kita!"
 CHL_news_events.3.t: "Pembentukan [CHL.GetNameDefCap]"
 CHL_news_events.3.d: "Mulai hari ini, [CHL.GetLeader] telah mengumumkan pembentukan [CHL.GetNameDef], dan mengklaimnya sebagai kekuatan dunia baru. Mereka telah menyatakan bahwa tujuan mereka adalah untuk membebaskan seluruh rakyat Hispanik dan Amerika Latin di bawah penindasan asing, dan bahwa misi mereka belum berakhir."
 CHL_news_events.3.a: "Menurut mereka, siapakah mereka?"
 CHL_news_events.3.b: "Kita adalah kekuatan dunia baru!"
 CHL_political_events.78.t: "[FROM.GetNameDefCap] Meminta Bantuan kami"
 CHL_political_events.78.desc: "[FROM.GetLeader], Raja Terpilih dari [FROM.GetNameDef] telah meminta bantuan kami dalam perangnya melawan fasis dan komunis Chili yang ingin menggulingkannya. Dia menginginkan senjata dan sukarelawan yang bisa membantunya. Apakah kita menerima seruannya untuk mengangkat senjata?"
 CHL_political_events.78.a: "Baiklah kalau begitu. Kami akan membantu mereka."
 CHL_political_events.78.b: "Dan mengapa kita harus membantu mereka?"
 CHL_political_events.78.c: "Kami akan membantu mereka, tapi hanya dengan harga tertentu..."
 CHL_we_will_aid_for_a_price: "Jika mereka menerima, kami akan memperoleh kompensasi ekonomi atas bantuan kami, namun mereka mungkin akan menolak usulan kami"
 CHL_political_events.79.t: "[FROM.GetName] Memilih untuk Membantu kami"
 CHL_political_events.79.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengindahkan seruan kami untuk mengangkat senjata, dan telah berjanji untuk mengirimi kami senjata dan sukarelawan, sebanyak yang mereka bisa."
 CHL_political_events.79.a: "Baiklah kalau begitu"
 CHL_political_events.80.t: "[FROM.GetName] Memilih untuk tidak Membantu kami"
 CHL_political_events.80.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] tidak mendengarkan seruan kami untuk mengangkat senjata, dan mendoakan yang terburuk bagi kami. Betapa menjijikkannya!"
 CHL_political_events.80.a: "Ya, memang begitulah adanya..."
 CHL_political_events.81.t: "[FROM.GetName] mengatakan mereka akan membantu kami, dengan harga tertentu"
 CHL_political_events.81.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengindahkan seruan kami untuk mengangkat senjata, dan telah berjanji untuk mengirimi kami senjata dan sukarelawan, sebanyak yang mereka bisa. Namun mereka menyatakan bahwa bantuan mereka tidak murah, dan jika kami menginginkannya, kami harus membayar mereka sebagai imbalannya."
 CHL_political_events.81.a: "Kami harus menerimanya"
 CHL_political_events.81.b: "Kami tidak membutuhkan mereka!"
 CHL_news_events.4.t: "Mapuche mendeklarasikan Perang Salib melawan Imperialisme"
 CHL_news_events.4.d: "[CHL.GetLeader] dari [CHL.GetNameDef] telah mengumumkan bahwa negara akan melancarkan Perang Salib Anti-Imperialis, yang mana mereka akan membebaskan rakyat Amerika dari penindasan Eropa. Banyak yang bertanya-tanya, apakah era kolonialisme benar-benar telah berakhir, atau ini hanyalah sebuah hambatan bagi negara-negara besar."
 CHL_news_events.4.a: "Khawatir..."
 CHL_news_events.4.b: "Kami akan membawa kebebasan dan kemakmuran bagi mereka yang membutuhkan!"
 CHL_political_events.82.t: "Ibukota Kerajaan"
 CHL_political_events.82.desc: "Dengan berdirinya Kerajaan Araucanía dan Patagonia yang baru, timbul pertanyaan mengenai status kami. Saat ini, Santiago masih menjadi ibu kota kami, yang berarti kami tidak jauh berbeda dengan negara bagian Chile yang sudah tua dan bobrok. Namun ada kota-kota potensial lainnya yang merupakan kandidat bagus untuk menjadi ibu kota baru Kerajaan. Apa kehendak raja agung kita, Antoine III?"
 CHL_political_events.82.a: "Santiago akan terus menjadi ibu kota kami"
 CHL_political_events.82.b: "Perquenco adalah ibu kota lama"
 CHL_political_events.82.c: "Kita membutuhkan Ibu Kota paling Selatan di dunia!"
 CHL_political_events.82.d: "Rawson adalah Kandidat Timur yang baik"
 CHL_political_events.83.t: "Upaya Kudeta Koalisi Anti-Ibáñis"
 CHL_political_events.83.d: "Setelah beberapa hari melakukan protes dan pemogokan, kaum sosialis, komunis dan fasis akhirnya memutuskan untuk menyerang pemerintah kita, melihat peluang yang ada di hadapan mereka. Mereka menuntut Carlos Ibáñez del Campo menyerahkan kekuasaan kepada Jorge González von Marées sesegera mungkin, tapi kami tidak akan menyerah tanpa perlawanan. Pertempuran dilaporkan terjadi di seluruh negeri, dan kemungkinan besar kita sedang menghadapi perang saudara..."
 CHL_political_events.83.a: "Segera mobilisasi Garda Nasional!"
 CHL_political_events.83.b: "Amankan Wilayah Sebanyak Mungkin!"
 CHL_fascist_and_communist_joint_civil_war_started: "Perang Saudara Anti-Ibáñist telah dimulai"
 CHL_secures_araucania_for_the_cw_tt: "§YAraucanía§! akan diamankan oleh pasukan kami"
 CHL_approached_by_mysterious_frenchman: "Telah didekati oleh Jacques Antoine Bernard selama perang saudara Chili."
 CHL_political_events.84.t: "Orang Asing yang Misterius Mendekati Pemerintah"
 CHL_political_events.84.desc: "Sebelumnya hari ini, ketika berita perang saudara mulai menyebar ke seluruh dunia, Presiden Carlos Ibáñez del Campo menerima pesan dari Perancis. Seorang pria misterius, yang mengaku sebagai keturunan dinasti lama di Chili, keturunan dari Orélie-Antoine I, Raja Araucanía dan Patagonia, telah menyatakan bahwa dia mendapat izin dari pedagang dan legiun Prancis untuk membantu kami, tetapi mengklaim bahwa hal ini harus dibayar mahal. Situasinya tampak mengerikan, dan tindakan drastis mungkin diperlukan segera."
 CHL_political_events.84.a: "Pada titik ini, dia mungkin satu-satunya harapan kita..."
 CHL_political_events.85.t: "[RAP.GetNameDefCap] Menyatakan Kemerdekaan"
 CHL_political_events.85.desc: "Pulau Paskah, yang oleh penduduk setempat disebut Rapa Nui, telah berada di bawah kendali langsung kami sejak aneksasi Kerajaan Rapa Nui pada tahun 1910, dan negara bagian tersebut berdiri sejak tahun 10 hingga saat itu. Kini sekali lagi, mereka berkumpul di bawah bimbingan penduduk asli 'Ariki, Valentino Riroroko Tuki dan dewan kabupaten yang merawatnya. Negara Polinesia ingin memutuskan semua hubungan dengan kami, dan dengan demikian mendeklarasikan kemerdekaannya. Apakah kita menerima ini?"
 CHL_political_events.85.a: "Kami tidak mempunyai kekuatan untuk menghadapinya saat ini"
 CHL_political_events.85.b: "Ini berarti perang!"
 CHL_political_events.85.c: "Sudah waktunya bagi Polinesia untuk bangkit!"
 CHL_political_events.86.t: "[FROM.GetName] Meminta Aliansi"
 CHL_political_events.86.desc: "[FROM.GetLeader], raja berdaulat [FROM.GetNameDef] dan warga negara Perancis, telah meminta agar kita bersatu dan membantu satu sama lain dalam menyebarkan hegemoni Perancis ke seluruh dunia. Bagaimana menurut kita?"
 CHL_political_events.86.a: "Kita lebih kuat bersama-sama"
 CHL_political_events.86.b: "Kami tidak membutuhkan mereka"
 CHL_political_events.87.t: "[FROM.GetName] Terima Permintaan kami"
 CHL_political_events.87.desc: "[FROM.GetLeader] yang hebat dari [FROM.GetNameDef] telah menerima permintaan kami untuk bergabung secara resmi dengan aliansi, dan kami berterima kasih padanya untuk itu. Kita lebih kuat bersama-sama!"
 CHL_political_events.87.a: "Dua lebih dari satu"
 CHL_political_events.88.t: "[FROM.GetName] Menolak Permintaan kami"
 CHL_political_events.88.desc: "[FROM.GetLeader] pengkhianat dari [FROM.GetNameDef] telah menolak permintaan kami untuk bergabung secara resmi dengan aliansi, meskipun kami mempunyai kepentingan dan warisan yang sama."
 CHL_political_events.88.a: "Kita telah dikhianati..."
 united_french_monarhcist_faction: "Hegemoni Perancis"
 CHL_news_events.5.t: "Kerajaan Baru Araucanía dan Patagonia"
 CHL_news_events.5.desc: "Meskipun kerajaan tersebut hanya ada selama dua tahun pada tahun 1860-an, Jacques Antoine Bernard, penggugat takhta lama telah kembali ke Chili di tengah kekacauan dan merebut kembali kerajaannya yang telah lama hilang. Hanya waktu yang akan memberitahu bagaimana hal ini akan terjadi..."
 CHL_news_events.5.a: "Apa?"
 CHL_news_events.5.b: "Kami kembali dan lebih kuat dari sebelumnya!"
 CHL_news_events.6.t: "Tenggelamnya SS Tolten"
 CHL_news_events.6.desc: "Konvoi netral Chili SS Tolten sedang melakukan perjalanan tanpa pengawalan dari Baltimore ke Kota New York, ketika dia dihantam di dekat jembatan oleh torpedo dari kapal selam Jerman di lepas pantai Barnegat, New Jersey. Kapal itu tenggelam dalam waktu enam menit dan baru setelah tenggelam, awak U-boat memastikan bahwa kapal tersebut milik Chili. Ini bisa menjadi bencana diplomatik bagi Jerman."
 CHL_news_events.6.a: "Percikan telah menyala"
 CHL_news_events.6.b: "Sebuah parodi yang sebenarnya"
 CHL_news_events.7.t: "[CHL.GetNameDefCap] Menerapkan Pertahanan Proaktif"
 CHL_news_events.7.desc: "[CHL.GetLeader] dari [CHL.GetNameDef] telah mengumumkan bahwa negara tersebut akan memberlakukan kebijakan pertahanan proaktif terhadap kedaulatan [CHL.GetAdjective] dan [RAP.GetAdjective], dengan secara resmi mendeklarasikan perang terhadap negara-negara yang dianggap sebagai ancaman potensial di Teater Pasifik, dan memilih untuk melancarkan perang terhadap calon agresor mereka daripada mengobarkannya di wilayah asal mereka."
 CHL_news_events.7.a: "Keputusan yang Menarik"
 CHL_news_events.7.b: "Rapa Nui perlu dilindungi"
 CHL_political_events.89.t: "[FROM.GetNameDefCap] menawarkan untuk melindungi [270.GetName]"
 CHL_political_events.89.desc: "Sekutu kami [FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kami dengan permintaan sederhana. Serahkan kendali atas [270.GetName] kepada mereka, karena [270.GetName] lebih dekat dengan pusat mereka dan lebih mudah untuk mereka lindungi, sehingga tidak menjadi celah strategis yang dapat dieksploitasi oleh musuh untuk melawan mereka."
 CHL_political_events.89.a: "Mereka bisa memilikinya"
 CHL_political_events.89.b: "Menurut mereka, siapakah mereka?"
 CHL_political_events.90.t: "[FROM.GetName] menyerahkan [270.GetName] kepada kami"
 CHL_political_events.90.desc: "Sekutu kami [FROM.GetLeader] dari [FROM.GetNameDef] telah menyerahkan [270.GetName] kepada kami, sesuai permintaan kami. Kini pada akhirnya, rakyat kita dapat merasa aman dari ancaman asing, dan menyimpan energi mereka untuk masalah-masalah dalam negeri."
 CHL_political_events.90.a: "Saatnya mengambil perlindungan Pitcairn!"
 CHL_political_events.91.t: "[FROM.GetName] menolak menyerahkan [270.GetName] kepada kami"
 CHL_political_events.91.desc: "Sekutu kami [FROM.GetLeader] dari [FROM.GetNameDef] belum menyerahkan [270.GetName] kepada kami. Mereka menyatakan bahwa hal itu terlalu berbahaya, dan kita hanya mengambil keuntungan dari kerajaan mereka."
 CHL_political_events.91.a: "Ya, kita harus melakukan apa yang kita punya..."
 CHL_political_events.91.b: "Kita harus mengambil tindakan sendiri!"
 CHL_political_events.92.t: "Sapa Inca Baru"
 CHL_political_events.92.desc: "Dengan terbentuknya kerajaan satelit baru kita, Kekaisaran Inca, kita perlu memilih seorang jenderal untuk memimpin mereka sebagai Sapa Inca, sesuai dengan semangat doktrin Napoleon. Siapa yang akan dianugerahi gelar bergengsi ini?"
 CHL_political_events.92.a: "Kami akan memberikan gelar kepada yang terbaik!"
 CHL_political_events.92.b: "Seorang perwira muda yang brilian harus melakukannya"
 CHL_political_events.92.c: "Berikan gelar kepada Mapuche"
 CHL_political_events.93.t: "Raja El Dorado"
 CHL_political_events.93.desc: "Sekarang kita telah mendirikan negara yang menyerupai Kerajaan El Dorado dalam mitos, kita harus memberikan gelar raja yang gemilang kepada salah satu jenderal kita yang bangga dan saleh. Siapa yang pantas mendapatkan peran tersebut?"
 CHL_political_events.93.a: "Bartolomé Blanche tahu cara memimpin!"
 CHL_political_events.93.b: "Gregorio Rodríguez Tascón layak mendapatkan gelar tersebut!"
 CHL_political_events.93.c: "Quintín Lame Harus Memerintah Negara Bagian!"
 CHL_political_events.94.t: "Penguasa untuk Hispaniola"
 CHL_political_events.94.desc: "Sekarang kita telah menyatukan pulau Hispaniola di bawah kekuasaan kita, sudah saatnya kita memberikan gelar raja pulau itu kepada salah satu jenderal setia kita. Siapa yang akan mendapatkan gelar bergengsi ini?"
 CHL_political_events.94.a: "Oscar Escudero Otárola bisa mendapatkan gelar tersebut"
 CHL_political_events.94.b: "Pedro Dartnell telah melayani kami dengan baik sejak lama"
 CHL_political_events.94.c: "Sekali lagi Karibia akan dikuasai oleh penduduk asli!"
 CHL_political_events.95.t: "Movimiento Nacional-Socialista Meningkatkan Aktivitas"
 CHL_political_events.95.desc: "Laporan baru datang dari Direktur Jenderal Carabineros de Chile, yang menyarankan agar tindakan diambil terhadap meningkatnya sentimen pro-fasis di masyarakat umum, dan bahwa peningkatan aktivitas baru-baru ini dari partai Jorge González von Marées, Movimiento Nacional-Socialista, harus diselidiki lebih lanjut. Diyakini bahwa mereka mungkin berencana untuk menggulingkan pemerintah kita, dan oleh karena itu, kita harus tetap waspada."
 CHL_political_events.95.a: "Kami bisa mengatasinya"
 CHL_political_events.96.t: "Palacio de La Moneda Putsch"
 CHL_political_events.96.desc: "Tentara setia kami telah melaksanakan rencana kami tanpa mendapat hukuman dan telah menduduki Palacio de La Moneda tempat Atruro Alessandri dan kabinetnya berada. Mereka telah memerintahkan presiden untuk mundur dan mendukung Jorge González von Marées. Saat ini tidak banyak yang bisa dilakukan oleh pemerintah liberal untuk menghentikan kita!."
 CHL_political_events.96.a: "Pada hari ini kita menang!"
 CHL_political_events.97.t: "Bentuk Perlawanan Rakyat dan Legiun Veteran Tiba"
 CHL_political_events.97.desc: "Dengan penobatan raja kami, beberapa orang di negara ini tampak tidak senang, dan perlawanan rakyat pun terbentuk. Pada saat yang sama, para Legiun Veteran berdatangan ke negara kita untuk menawarkan bantuan mereka kepada pemerintahan kita yang baru dibentuk."
 CHL_political_events.97.a: "Kekacauan dan anugerah."
 CHL_political_events.98.t: "[GER.GetName] menolak kenaikan ke Poros"
 CHL_political_events.98.desc: "[GER.GetName] telah menolak anggapan bahwa Poros dapat menerima masuknya anggota lain ke dalam Poros, setidaknya untuk saat ini. Sebuah pukulan balasan diplomatik yang kecil, namun tidak ada yang tidak dapat kami tangani."
 CHL_political_events.98.a: "Mengecewakan"
 CHL_political_events.99.t: "[GER.GetName] menerima kenaikan ke Poros"
 CHL_political_events.99.desc: "[GER.GetName] telah menerima usulan tersebut.. Ini adalah zaman baru yang dikuasai oleh yang kuat dan kemenangan diplomatis bagi pemerintah kita."
 CHL_political_events.99.a: "Ke masa depan!"
#### Brazil ####
JUNO_brazil_events.10.t: "Reli Integralis Kecil di [FROM.FROM.GetName]"
JUNO_brazil_events.10.desc: "Meskipun banyak perencanaan yang dilakukan pada rapat umum baru-baru ini di [FROM.FROM.GetName], acara tersebut kurang berjalan baik. Kerumunan pendukung yang diharapkan tidak terwujud, dan mereka yang datang hanyalah beragam orang yang tidak memiliki pemahaman sama sekali tentang platform partai. Banyak penonton yang tampak bingung dengan kehadiran anggota berseragam kami yang berbaris di jalan-jalan mereka."
JUNO_brazil_events.10.a: "Sebuah urusan kecil yang memalukan."
JUNO_brazil_events.11.t: "Reli Integralis di [FROM.FROM.GetName]"
JUNO_brazil_events.11.desc: "Meskipun terjadi bentrokan dengan agitator sosialis dan liberal lokal, unjuk rasa Integralis di [FROM.FROM.GetName] berhasil menarik banyak pendukung. Pimpinan partai berkali-kali menyampaikan pidato tentang masa depan bangsa yang disambut sorak-sorai dan nyanyian massa. Cabang partai lokal telah mengumumkan bahwa keanggotaannya telah membengkak sejak rapat umum tersebut."
JUNO_brazil_events.11.a: "Kami mendapatkan daya tarik dari massa."
JUNO_brazil_events.12.t: "Reli Integralis Besar-besaran di [FROM.FROM.GetName]"
JUNO_brazil_events.12.desc: "Orang-orang dilaporkan melakukan perjalanan selama berhari-hari dari seluruh negara hanya untuk menyaksikan unjuk rasa Integralis terbaru di [FROM.FROM.GetName]. Ratusan anggota berseragam berusaha menjaga ketertiban massa ketika pimpinan partai yang sedikit kebingungan tiba dan pidato mereka hampir tidak terdengar karena sanjungan penonton. Tampaknya massa yang tidak puas akhirnya sudah muak dengan status quo politik."
JUNO_brazil_events.12.a: "Kita akan dikuasai oleh rakyat."
JUNO_brazil_events.13.t: "Operasi Bolivar Terganggu di Brasil"
JUNO_brazil_events.13.desc: "Badan intelijen kami telah memberi tahu kami bahwa sejumlah agen dan informan mereka di Brazil telah menghentikan komunikasi akhir-akhir ini. Tampaknya telah terjadi sesuatu yang mengganggu operasi kami di negara ini, kemungkinan merupakan inisiatif kontra intelijen yang bekerja sama dengan musuh-musuh kami. Apa pun penyebabnya, hal ini menunjukkan adanya perubahan dalam kebijakan [BRA.GetAdjective] yang merugikan kita dan kita dapat mengharapkan tindakan serupa dari mereka di masa depan."
JUNO_brazil_events.13.a: "Pergantian peristiwa yang memprihatinkan."
JUNO_brazil_events.14.t: "[FROM.GetAdjective] Kebijakan Tetangga yang Baik"
JUNO_brazil_events.14.desc: "Presiden [FROM.GetAdjective], [FROM.GetLeader], telah mengumumkan bahwa pemerintah mereka bermaksud untuk menjalin kerja sama yang lebih besar dengan negara-negara Amerika Selatan dalam apa yang disebut sebagai kebijakan ‘tetangga baik’. Bentuk kerja sama apa yang akan diambil masih belum diketahui, namun hal ini merupakan penyimpangan yang nyata dari hubungan yang sebelumnya bermusuhan antara negara-negara berbahasa Spanyol dan Portugis di benua tersebut."
JUNO_brazil_events.14.a: "Pergantian peristiwa yang disambut baik"
JUNO_brazil_events.14.b: "Ini jelas merupakan tipu muslihat untuk melemahkan kita."
JUNO_brazil_events.15.t: "Kesepakatan [ROOT.Capital.GetCapitalVictoryPointName]"
JUNO_brazil_events.15.desc: "Dalam beberapa bulan terakhir, pemerintah [BRA.GetAdjective] telah mengambil bagian dalam sejumlah diskusi bersama dengan anggota pemerintah kita mengenai peran mereka yang lebih aktif dalam mendukung upaya perang kita. Meskipun mereka belum dapat mengerahkan kekuatan militer, mereka telah meminta dukungan ekonomi sebagai imbalan atas komitmen untuk melakukan hal tersebut dalam waktu dekat."
JUNO_brazil_events.15.a: "Kami menyambut baik kesepakatan yang saling menguntungkan ini."
JUNO_brazil_events.15.b: "Jaminan mereka tidak ada gunanya."
JUNO_brazil_events.16.t: "Kesepakatan [FROM.Capital.GetCapitalVictoryPointName]"
JUNO_brazil_events.16.desc: "Diskusi kami dengan pemerintah [USA.GetName] terbukti berhasil. Kami telah mencapai kesepakatan bahwa [BRA.GetNameDef] akan menerima bantuan ekonomi dari [USA.GetName], sebagai imbalan atas penyediaan sumber daya dan komitmen untuk ikut berperang ketika militer kita mampu."
JUNO_brazil_events.16.a: "Bersama-sama, kita akan memulihkan perdamaian di belahan bumi kita."
JUNO_brazil_events.17.t: "[FROM.Capital.GetCapitalVictoryPointName] Kesepakatan Ditolak"
JUNO_brazil_events.17.desc: "[USA.GetName] telah memutuskan untuk menolak perjanjian yang mewajibkan kita untuk mendukung mereka secara militer, dengan imbalan bantuan ekonomi. Mungkin waktunya tidak tepat bagi Presiden, atau hal ini dapat menandai adanya pergeseran kebijakan luar negeri terhadap Brasil. Apa pun yang terjadi, ini merupakan pukulan terhadap kredibilitas [BRA.GetLeader]."
JUNO_brazil_events.17.a: "Kita harus melangkah hati-hati sekarang."
JUNO_brazil_events.18.t: "[FROM.GetNameDefCap] Menuntut Komitmen Militer"
JUNO_brazil_events.18.desc: "[FROM.GetNameDefCap] menuntut agar kami menghormati perjanjian kami untuk bergabung dengan mereka secara militer dalam perang yang sedang berlangsung. Kita telah memperoleh manfaat dari investasi mereka dalam perekonomian kita, namun sejauh ini kita belum berbuat banyak untuk mempertahankan posisi tawar kita. Jika kita tidak melakukan hal ini sekarang, mungkin akan ada dampak yang serius."
JUNO_brazil_events.18.a: "Kami akan menghormati komitmen kami."
JUNO_brazil_events.18.b: "Kami tidak akan menumpahkan [BRA.GetAdjective] darah untuk [FROM.GetNameDef]."
BRA_war_embargo_with_usa_tt: "§RHal ini dapat menyebabkan [USA.GetNameDef] menyatakan perang atau mengembargo kami!§!"
JUNO_brazil_events.19.t: "[FROM.GetNameDefCap] Gagal Ikut Perang"
JUNO_brazil_events.19.desc: "[FROM.GetAdjective] diplomat telah memberi tahu kami bahwa mereka belum siap untuk bergabung dalam perang secara militer, meskipun kami telah memberikan bantuan ekonomi selama bertahun-tahun kepada mereka. Tidak sepenuhnya jelas apakah mereka hanya mencoba untuk membatalkan komitmen mereka atau apakah mereka mempunyai alasan yang kuat untuk belum menepati komitmen mereka. Kita harus memutuskan dengan hati-hati bagaimana menanggapinya."
JUNO_brazil_events.19.a: "Mungkin ini saatnya untuk membentuk kepemimpinan yang lebih bersahabat di [FROM.Capital.GetCapitalVictoryPointName]."
JUNO_brazil_events.19.b: "Kurangnya tindak lanjut mereka harus dihukum."
JUNO_brazil_events.19.c: "Mereka tidak lagi menjadi perhatian kita."
JUNO_brazil_events.20.t: "Konferensi Sungai Potenji"
JUNO_brazil_events.20.desc: "Dalam pertemuan baru-baru ini antara presiden [BRA.GetAdjective] dan [USA.GetAdjective] di Brasil Timur Laut, presiden [BRA.GetAdjective] telah sepakat untuk menghormati komitmen yang tertuang dalam perjanjian [USA.Capital.GetCapitalVictoryPointName]. Ini berarti bahwa mereka sekarang akan mengerahkan kekuatan militernya untuk perang yang sedang berlangsung melawan tirani di seluruh dunia."
JUNO_brazil_events.20.a: "Manuver diplomatik kami telah membuahkan hasil."
JUNO_brazil_news.1.t: "[BRA.GetNonIdeologyName] Terlibat dalam Kebijakan Luar Negeri yang Agresif"
JUNO_brazil_news.1.d: "Akhir-akhir ini pemerintah [BRA.GetAdjective] mengambil sikap yang semakin agresif dan tegas terhadap isu-isu kebijakan luar negeri. Setelah berpuluh-puluh tahun mengalami gejolak, nampaknya rezim terkini kini merasa cukup aman untuk melihat ke luar negeri untuk mencari peluang yang menguntungkan [BRA.GetName] dan merugikan negara-negara tetangganya. Apa dampaknya bagi hubungan kami dengan pemerintah Brasil masih harus dilihat."
JUNO_brazil_news.1.a: "Ini semua hanya retorika, bukan?"
JUNO_brazil_news.2.t: "[BRA.GetNameDefCap] Mahkota Raja Baru"
JUNO_brazil_news.2.d: "Menyusul berkurangnya dukungan dan meningkatnya popularitas gerakan restorasi kekaisaran baru-baru ini, Kongres Nasional [BRA.GetAdjective] telah setuju untuk berkompromi dengan rakyat. Seorang raja konstitusional akan dinobatkan tetapi Kongres Nasional akan tetap mempertahankan kekuasaan politiknya atas negara tersebut. Tugas nominal akan diserahkan kepada raja yang baru dinobatkan sebagai upaya untuk menstabilkan situasi."
JUNO_brazil_news.2.a: "Hidup raja."
JUNO_brazil_news.3.t: "[BRA.GetNonIdeologyName] dan [POR.GetNonIdeologyName] Mengumumkan Unifikasi"
JUNO_brazil_news.3.d: "Menyusul meningkatnya sentimen monarki di [BRA.GetNameDef] dan [POR.GetNameDef] kedua negara telah memutuskan untuk bersatu kembali di bawah satu raja dan panji. Mengutip keinginan untuk memanfaatkan pengetahuan dan sumber daya satu sama lain, kedua negara bertekad untuk tumbuh bersama sebagai satu kesatuan."
JUNO_brazil_news.3.a: "Bagus untuk mereka!"
JUNO_brazil_news.4.t: "[BRA.GetNonIdeologyName] dan [POR.GetNonIdeologyName] Mendirikan Persemakmuran"
JUNO_brazil_news.4.d: "Menyusul hubungan dan kolaborasi yang lebih dalam antara [BRA.GetNameDefCap] dan [POR.GetNameDefCap] kedua negara kini memutuskan untuk bersama-sama membentuk persemakmuran untuk lebih meningkatkan kerja sama mereka."
JUNO_brazil_news.4.a: "Pergantian kejadian yang sangat tidak terduga."
JUNO_brazil_news.5.t: "[BRA.GetAdjective] Revolusi Komunis"
JUNO_brazil_news.5.d: "Gejolak yang sedang berlangsung di [BRA.GetNonIdeologyName] semakin tidak terkendali dalam beberapa hari terakhir, menyebabkan perang saudara yang berdarah. Pemerintah telah menggagalkan rencana gerakan komunis untuk menggulingkan rezim tersebut pada tahun 1935, namun mereka gagal membendung gelombang merah yang lebih besar. Meskipun sebagian besar anggota militer tetap setia kepada pemerintah pusat, banyak perwira berpangkat rendah yang berpihak pada komunis. Banyak orang di kawasan ini khawatir bahwa [BRA.GetNonIdeologyName] komunis akan memicu efek domino di seluruh benua Amerika Selatan."
JUNO_brazil_news.5.a: "Sebuah tragedi yang sampai pada titik ini."
JUNO_brazil_news.6.t: "Kudeta Komunis di [ROOT.GetNonIdeologyName]"
JUNO_brazil_news.6.d: "Gejolak yang sedang berlangsung di [BRA.GetNonIdeologyName] semakin tidak terkendali dalam beberapa hari terakhir, yang berujung pada kudeta komunis. Pemerintah telah menggagalkan rencana gerakan komunis untuk menggulingkan rezim tersebut pada tahun 1935, namun mereka gagal membendung gelombang merah yang lebih besar. Meskipun sebagian besar anggota militer tetap setia kepada pemerintah pusat, banyak perwira berpangkat rendah yang berpihak pada komunis. Banyak orang di kawasan ini khawatir bahwa [BRA.GetNonIdeologyName] komunis akan memicu efek domino di seluruh benua Amerika Selatan."
JUNO_brazil_news.6.a: "Namun apakah pemerintahan baru akan bertahan?"
JUNO_brazil_news.7.t: "Kematian Pedro de Alcantara"
JUNO_brazil_news.7.desc: "Kaisar lama kita, Dom Pedro de Alcântara dari Orléans-Braganza, Pangeran Grão Pará dan Kaisar Brasil, telah meninggal. Selama masa pemerintahannya yang singkat, ia telah menjadi simbol perdamaian dan stabilitas bagi rakyat kita dan telah menjadi titik kumpul bagi [FROM.GetAdjective] selama masa-masa penuh gejolak ini. Orang-orang yang berduka turun ke jalan untuk menunjukkan penghargaan dan dukungan mereka terhadap mendiang kaisar.\n\nBangsa ini berharap bahwa pewaris dan penerus kaisar lama, Pangeran Pedro Gastão, akan menjadi pendukung setia bagi masyarakat [FROM.GetAdjective]. Sang pangeran akan segera dinobatkan sebagai Kaisar Dom Pedro IV - semoga dia memerintah selamanya!"
JUNO_brazil_news.7.a: "Hidup Pedro Gastão dari Orléans-Braganza!"
JUNO_brazil_events.30.t: "[FROM.GetNameDefCap] Mengusulkan Kerjasama"
JUNO_brazil_events.30.desc: "Para diplomat dari [FROM.GetNameDef] telah mendekati kami dengan tawaran kerja sama militer dan ekonomi. Mereka menyatakan bahwa mereka sangat prihatin dengan keadaan dunia dan percaya bahwa satu-satunya jalan menuju perdamaian abadi adalah dengan menyelaraskan diri dengan kita dan mengakhiri musuh geo-politik kita bersama."
JUNO_brazil_events.30.a: "Kami menerima usulan ini."
JUNO_brazil_events.30.b: "Kita tidak membutuhkan beban mati seperti itu."
JUNO_brazil_events.31.t: "[BRA.GetNameDefCap] Membantu Operasi Intelijen"
JUNO_brazil_events.31.desc: "Badan intelijen kami melaporkan bahwa mereka telah menjalin hubungan kerja yang erat dengan rekan-rekan [BRA.GetAdjective] mereka. Hal ini menyebabkan perluasan pengumpulan intelijen Amerika Selatan, yang dikenal sebagai Operasi Bolivar. Nampaknya kerjasama awal kami dengan [BRA.GetName] mulai membuahkan hasil."
JUNO_brazil_events.31.a: "Bersama-sama kita akan mendominasi Amerika Selatan."
JUNO_brazil_events.32.t: "[BRA.GetNameDefCap] Menuntut Wilayah di Guyana"
JUNO_brazil_events.32.desc: "Para pemangsa dalam pemerintahan [BRA.GetNameDef] berusaha menggunakan konflik global saat ini sebagai peluang untuk memeras kita agar menyerahkan wilayah di Guyana. Mereka menuntut agar kami menyerahkan wilayah tersebut atau mengambil risiko diambil alih secara paksa. Mungkin sulit untuk mempertahankan wilayah tersebut jika terjadi perang, namun hal ini akan menjadi preseden berbahaya bagi wilayah sengketa lainnya di seluruh dunia."
JUNO_brazil_events.32.a: "Guyana tidak layak untuk diperebutkan."
JUNO_brazil_events.32.b: "Kami tidak akan diperas oleh [BRA.GetNameDef]"
JUNO_brazil_events.33.t: "[FROM.GetName] Setuju Pemindahan Wilayah"
JUNO_brazil_events.33.desc: "Pemerintah [FROM.GetName] dengan enggan setuju untuk mengalihkan kepemilikan wilayah mereka di Guyana kepada kami, sesuai dengan tuntutan kami baru-baru ini. Tampaknya metode baru yang kami temukan dalam pendekatan diplomasi telah berhasil."
JUNO_brazil_events.33.a: "Mereka tidak punya pilihan selain menyerah pada kami."
JUNO_brazil_events.34.t: "[FROM.GetName] Menolak Pindah Wilayah"
JUNO_brazil_events.34.desc: "Pemerintah [FROM.GetName] telah menolak untuk mengalihkan kepemilikan wilayah mereka di Guyana kepada kami, mengikuti tuntutan kami baru-baru ini. Sekarang kita harus memutuskan apakah akan melaksanakan ancaman kita dan merebut wilayah tersebut dengan kekerasan, atau mengambil tindakan diplomatik dengan mundur."
JUNO_brazil_events.34.a: "Mereka telah menyebut gertakan kita, kita harus mundur."
JUNO_brazil_events.34.b: "Kami akan membuat mereka menyesali keputusan itu."
JUNO_brazil_events.35.t: "[FROM.GetName] Mundur"
JUNO_brazil_events.35.desc: "Terlepas dari retorika mereka yang penuh permusuhan mengenai tanah kami di Guyana, nampaknya kesediaan [BRA.GetAdjective] untuk benar-benar berperang dengan kami belum terwujud. Para diplomat dari [BRA.GetNameDef] telah memberi tahu kami bahwa mereka akan mencari cara alternatif untuk merebut wilayah tersebut, namun mereka akan melakukannya dengan damai. Setidaknya untuk saat ini."
JUNO_brazil_events.35.a: "Kita harus tetap mengawasi mereka semua."
JUNO_brazil_events.36.t: "[FROM.GetName] Bersiap untuk Perang"
JUNO_brazil_events.36.desc: "Tampaknya kita berada di jurang konflik yang lebih besar lagi setelah penolakan kita untuk menyerahkan wilayah kepada [FROM.GetNameDef]. Meskipun kami berharap mereka hanya melakukan gertakan, intelijen dari wilayah tersebut menunjukkan bahwa militer [BRA.GetAdjective] sedang melakukan persiapan untuk mengambil alih wilayah tersebut dengan kekerasan."
JUNO_brazil_events.36.a: "Lebih banyak pertumpahan darah yang tidak perlu..."
JUNO_brazil_events.37.t: "Aktivitas Mencurigakan di [BRA.GetNameDef]"
JUNO_brazil_events.37.desc: "Laporan-laporan masuk bahwa telah terjadi peningkatan aktivitas militer di Brasil Selatan. Hubungan kedua negara akhir-akhir ini sangat dingin dan retorika tegas mereka menimbulkan banyak spekulasi apakah kita mungkin berada di ambang invasi. Banyak anggota militer yang berupaya mempersiapkan pertahanan jika hal terburuk terjadi. Namun ada pula yang mendorong dilakukannya serangan pendahuluan sebelum [BRA.GetAdjective] siap sepenuhnya."
JUNO_brazil_events.37.a: "Ini pasti sebuah tipu muslihat."
JUNO_brazil_events.37.b: "Serangan adalah pertahanan terbaik."
JUNO_brazil_events.38.t: "[ARG.GetNameDefCap] Mengambil Umpan"
JUNO_brazil_events.38.desc: "[ARG.GetNameDefCap] tampaknya sedang mempersiapkan pasukan mereka sendiri untuk menyerang kami, menyusul provokasi kami baru-baru ini di sepanjang perbatasan. Tanpa mereka sadari bahwa mereka sedang jatuh ke dalam perangkap kita, kita akan segera mempunyai kesempatan untuk menghancurkan mereka dan mereka harus menanggung kecaman internasional atas perang tersebut."
JUNO_brazil_events.38.a: "Semuanya terlalu mudah."
JUNO_brazil_events.39.t: "[ARG.GetNameDefCap] Menolak Umpan Kami"
JUNO_brazil_events.39.desc: "Sejauh ini, belum ada tanda-tanda [ARG.GetAdjective] bersiap menyerang melintasi perbatasan kita. Paling-paling, mereka tampaknya membangun pertahanan mereka sendiri, membuat tindakan apa pun yang kita lakukan menjadi lebih sulit. Namun pada titik tertentu, kita harus menyerang terlebih dahulu atau mundur."
JUNO_brazil_events.39.a: "Saatnya untuk mundur."
JUNO_brazil_events.39.b: "Kami hanya perlu lebih banyak waktu."
JUNO_brazil_events.40.t: "[BRA.GetNameDefCap] Mengeluarkan Ultimatum"
JUNO_brazil_events.40.desc: "Duta Besar [BRA.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName] telah mengeluarkan pernyataan dari pemerintahnya. Di dalamnya, kita diperintahkan untuk segera membuka perbatasan kita terhadap [BRA.GetNameDef] dan meletakkan senjata kita. Pernyataan tersebut selanjutnya menjelaskan secara rinci bahwa bangsa kita akan dimasukkan ke dalam [BRA.GetNameDef] sebagai negara yang segera berlaku. Jika kami tidak mematuhinya, mereka menyatakan bahwa mereka akan melaksanakan rencana mereka dengan kekerasan."
JUNO_brazil_events.40.a: "Kami tidak punya pilihan selain menyerah."
JUNO_brazil_events.40.b: "Kami akan membuat mereka membayar setiap inci tanah kami."
JUNO_brazil_events.41.t: "[FROM.GetNameDefCap] Menerima Aneksasi"
JUNO_brazil_events.41.desc: "Pemerintahan [FROM.GetNameDefCap] telah menerima tawaran kami untuk menjadi negara, yang berarti bahwa tindakan militer untuk mengamankan negara kecil ini tidak lagi diperlukan."
JUNO_brazil_events.41.a: "Mereka tidak punya pilihan nyata selain menerima."
JUNO_brazil_events.42.t: "[FROM.GetNameDefCap] Menolak Aneksasi"
JUNO_brazil_events.42.desc: "Pemerintahan [FROM.GetNameDefCap] dengan bodohnya menolak tawaran kami untuk menjadi negara bagian di [ROOT.GetNameDef]. Tampaknya kita harus melaksanakan ancaman perang kita, atau mundur dan membiarkan mereka terus memerintah diri mereka sendiri, untuk sementara waktu."
JUNO_brazil_events.42.a: "Ini tidak layak untuk diperjuangkan."
JUNO_brazil_events.42.b: "Mereka akan merasakan kemarahan kita."
JUNO_brazil_events.43.t: "[FROM.GetName] Mundur"
JUNO_brazil_events.43.desc: "Terlepas dari retorika mereka yang penuh permusuhan dan keinginan untuk memasukkan kami ke dalam negara mereka, tampaknya kesediaan [BRA.GetAdjective] untuk benar-benar berperang dengan kami belum terwujud. Para diplomat dari [BRA.GetNameDef] telah memberi tahu kami bahwa mereka akan mencari cara alternatif untuk merebut wilayah kami, namun mereka akan melakukannya dengan damai. Setidaknya untuk saat ini."
JUNO_brazil_events.43.a: "Kita harus tetap mengawasi mereka semua."
JUNO_brazil_events.44.t: "[FROM.GetName] Bersiap untuk Perang"
JUNO_brazil_events.44.desc: "Tampaknya kita berada di jurang konflik yang lebih besar lagi setelah penolakan kita untuk menyerahkan wilayah kepada [FROM.GetNameDef]. Meskipun kami berharap mereka hanya melakukan gertakan, intelijen dari wilayah tersebut menunjukkan bahwa militer [BRA.GetAdjective] sedang melakukan persiapan untuk mengambil alih wilayah tersebut dengan kekerasan."
JUNO_brazil_events.44.a: "Kami akan memastikan sejarah terulang kembali."
JUNO_brazil_events.45.t: "[BRA.GetNameDefCap] Mengeluarkan Ultimatum"
JUNO_brazil_events.45.desc: "Duta Besar [BRA.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName] telah mengeluarkan pernyataan dari pemerintahnya. Rupanya pemerintah mereka prihatin dengan ketidakstabilan di sini dan ingin menstabilkan negara kita dengan militer mereka. Pada kenyataannya, hal ini berarti pergantian rezim dengan kedok bantuan."
JUNO_brazil_events.45.a: "Kita tidak bisa menahan mereka"
JUNO_brazil_events.45.b: "Kami tidak akan menyerahkan kedaulatan kami."
JUNO_brazil_events.46.t: "[FROM.GetName] Menerima Penawaran"
JUNO_brazil_events.46.desc: "[FROM.GetNameDefCap] telah dengan bijak memilih untuk tunduk pada angkatan bersenjata kita, daripada mengambil risiko konflik. Kami sekarang sedang dalam proses membangun rezim baru di negara ini yang lebih sejalan dengan rezim kami."
JUNO_brazil_events.46.a: "Mereka akan menjadi negara penyangga yang berharga."
JUNO_brazil_events.47.t: "[FROM.GetNameDefCap] Menolak Usulan"
JUNO_brazil_events.47.desc: "Pemerintahan [FROM.GetNameDefCap] telah menolak tawaran kami untuk menstabilkan negara mereka. Tampaknya jika kita ingin melakukan perubahan rezim di sana, kita harus melakukannya dengan kekuatan militer."
JUNO_brazil_events.47.a: "Perang mungkin akan meningkat di luar kendali."
JUNO_brazil_events.47.b: "Mereka akan menyesali keputusan mereka."
JUNO_brazil_events.48.t: "[FROM.GetNameDefCap] Mundur"
JUNO_brazil_events.48.desc: "Militer [FROM.GetAdjective] tampaknya akan mundur, meskipun kami menolak proposal ‘stabilisasi’ mereka. Tampaknya kita telah menganggap mereka hanya gertakan dan mereka tidak begitu berminat untuk berkonflik."
JUNO_brazil_events.48.a: "Mereka masih berhasil menggoyahkan kawasan."
JUNO_brazil_events.49.t: "Ketegangan Dengan [FROM.GetNameDef] Meningkat"
JUNO_brazil_events.49.desc: "Menyusul penolakan kami terhadap tawaran [FROM.GetNameDef] untuk ‘menstabilkan’ negara kami, angkatan bersenjata mereka tampaknya sedang bersiap untuk perang. Kita tidak tahu kapan mereka berniat menyerang, tapi kita bisa berasumsi bahwa kitalah yang akan menjadi sasaran mereka. Para diplomat dari kedutaan mereka juga tampaknya telah dievakuasi, sehingga menambah kekhawatiran bahwa perang tidak dapat dihindari."
JUNO_brazil_events.49.a: "Kita harus mempertahankan pendirian kita."
JUNO_brazil_events.50.t: "[FROM.GetNameDefCap] Menawarkan Keanggotaan Mercosul"
JUNO_brazil_events.50.desc: "Para diplomat dari [FROM.GetNameDef] telah mendekati kami dengan tawaran keanggotaan dalam organisasi supranasional di mana negara-negara anggota mengoordinasikan keputusan ekonomi dan kebijakan luar negeri bersama-sama. Meskipun ada manfaat nyata bagi perekonomian kita dari harmonisasi kebijakan dan situasi keamanan yang mungkin lebih baik, ada pendapat yang mengatakan bahwa hilangnya kedaulatan tidak sebanding dengan manfaatnya."
JUNO_brazil_events.50.a: "Kita mempunyai banyak keuntungan dan sedikit kerugian."
JUNO_brazil_events.50.b: "Kedaulatan lebih penting daripada kekayaan."
JUNO_brazil_events.51.t: "[FROM.GetNameDefCap] Menerima Keanggotaan Mercosul"
JUNO_brazil_events.51.desc: "Setelah banyak negosiasi dan konsultasi, pemerintah [FROM.GetNameDef] akhirnya setuju untuk bergabung dengan Mercosul. Mulai sekarang, kita akan bekerja sama dalam bidang ekonomi dan kebijakan luar negeri untuk menjamin perdamaian dan kemakmuran di seluruh kawasan."
JUNO_brazil_events.51.a: "Kita lebih kuat bersama-sama."
JUNO_brazil_events.52.t: "[FROM.GetNameDefCap] Menolak Keanggotaan Mercosul"
JUNO_brazil_events.52.desc: "Meskipun telah banyak melakukan negosiasi dan konsultasi, pemerintahan [FROM.GetNameDef] telah menolak keanggotaan Mercosul. Meskipun ada janji perdamaian dan kemakmuran, mereka tampaknya tidak yakin akan keberlangsungan organisasi tersebut, bahkan mengklaim bahwa ini adalah cara kita mengendalikan mereka melalui pintu belakang."
JUNO_brazil_events.52.a: "Benar-benar konyol."
JUNO_brazil_events.53.t: "[FROM.GetName] Menolak Usulan"
JUNO_brazil_events.53.desc: "Para duta besar dari [FROM.GetNameDef] telah memberi tahu kami bahwa pemerintah mereka tidak percaya bahwa kepentingan negara mereka akan terlaksana dengan baik melalui kerja sama militer dengan kami saat ini. Tidak jelas apakah mereka punya rencana sendiri untuk wilayah kita, atau apakah kita hanya dianggap sebagai beban bagi mereka."
JUNO_brazil_events.53.a: "Betapa piciknya mereka."
south_american_news.50.t: "Brasil Memasuki Keadaan Darurat"
south_american_news.50.d: "Pagi ini, presiden [FROM.GetLeader] dari [FROM.GetName] mengumumkan melalui radio bahwa negaranya kembali memasuki keadaan darurat karena risiko kudeta oleh partai komunis. Menurut presiden, ditemukan dokumen yang mengindikasikan komunis berada pada tahap akhir perencanaan untuk menggulingkan pemerintah. Validitas dokumen-dokumen ini dipertanyakan oleh banyak orang, namun anggota partai oposisi kini bersembunyi karena takut ditangkap. Presiden mengumumkan akan mendirikan negara baru, dengan konstitusi baru yang memberikan kewenangan lebih besar kepada dirinya. Apa dampaknya bagi masa depan demokrasi di [FROM.GetName] masih harus dilihat."
south_american_news.50.a: "Para pengkhianat Bolshevik mendapatkan apa yang pantas mereka dapatkan."
south_american_news.50.b: "Situasi yang meresahkan."
south_american_news.50.c: "Rekan-rekan kita akan dibalaskan!"
south_american_news.51.t: "Brasil Menghentikan Demokrasi"
south_american_news.51.d: "Pagi ini, presiden [FROM.GetLeader] dari [FROM.GetName] mengumumkan melalui radio bahwa negaranya kembali memasuki keadaan darurat karena risiko kudeta oleh partai komunis. Menurut presiden, ditemukan dokumen yang mengindikasikan komunis berada pada tahap akhir perencanaan untuk menggulingkan pemerintah. Dengan dukungan partai Integralis sayap kanan, [BRA.GetLeader] telah memaksa partai oposisi bersembunyi. Presiden mengumumkan bahwa ia akan mendirikan negara baru, dengan konstitusi baru bersama dengan partai Integralis yang dengan gagah berani menyelamatkan bangsa dari Bolshevisme. Mengingat retorika dan tindakan kaum Integralis di masa lalu, nampaknya demokrasi liberal di Brasil sudah berakhir."
south_american_news.51.a: "Para pengkhianat Bolshevik mendapatkan apa yang pantas mereka dapatkan."
south_american_news.51.b: "Situasi yang meresahkan."
south_american_news.51.c: "Rekan-rekan kita akan dibalaskan!"
JUNO_brazil_events.60.t: "[BRA.GetNameDefCap] Mengusulkan Unifikasi"
JUNO_brazil_events.60.desc: "[BRA.GetNameDefCap] telah mendekati pemerintah kita, mengusulkan agar kedua negara kita bersatu kembali. Mereka mengutip kesamaan dalam budaya kita dan pernikahan baru-baru ini antara Dom Duarte Nuno, Adipati Braganza dan Putri Maria Francisca dari Orléans-Braganza sebagai alasan mereka atas lamaran ini dan memastikan bahwa kita akan tumbuh lebih kuat bersama-sama di bawah pemerintahan [BRA.GetLeader]."
JUNO_brazil_events.60.a: "Kita lebih kuat bersama-sama!"
JUNO_brazil_events.60.b: "Sebenarnya kami lebih suka itu menjadi persemakmuran."
JUNO_brazil_events.60.c: "Kami tidak punya keinginan untuk bergabung dengan mereka."
JUNO_brazil_events.61.t: "[POR.GetNameDefCap] Menerima Unifikasi"
JUNO_brazil_events.61.desc: "Usulan penyatuan kami dengan [POR.GetNameDef] telah mendapat persetujuan yang antusias. Ini menandai dimulainya era baru yang hebat bagi negara kita!"
JUNO_brazil_events.61.a: "Fantastis"
JUNO_brazil_events.62.t: "[POR.GetNameDefCap] Mengusulkan Persemakmuran"
JUNO_brazil_events.62.desc: "Proposal kami baru-baru ini kepada [POR.GetNameDef] mendapat tanggapan yang mengejutkan. [POR.GetNameDefCap] menolak gagasan unifikasi, namun sebagai penggantinya, ia mengusulkan persemakmuran bagi kedua negara. Hal ini akan memberi kita beberapa keuntungan dari unifikasi, dan mengurangi kerugiannya, dan memungkinkan kedua negara kita untuk mempertahankan identitas unik mereka masing-masing."
JUNO_brazil_events.62.a: "Tentu saja, ini juga dapat memberikan manfaat bagi kita!"
JUNO_brazil_events.62.b: "Persemakmuran dengan penjajah lama kita? Sama sekali tidak."
JUNO_brazil_events.63.t: "[POR.GetNameDefCap] Menolak Unifikasi"
JUNO_brazil_events.63.desc: "Usulan penyatuan kami ke [POR.GetNameDef] telah mendapat penolakan tanpa pamrih. Meskipun kami telah melakukan upaya terbaik untuk membuat mereka melihat manfaat dari kesepakatan ini, [POR.GetAdjective] tidak tertarik untuk mempersatukan negara kami sekali lagi."
JUNO_brazil_events.63.a: "Tidakkah mereka melihat berapa banyak keuntungan yang dapat diperoleh dari hal ini?"
JUNO_brazil_events.64.t: "[BRA.GetNameDefCap] Setuju Membentuk Persemakmuran"
JUNO_brazil_events.64.desc: "Usulan balasan kami untuk membentuk persemakmuran daripada langsung bergabung dengan [BRA.GetNameDef] telah diterima dengan baik oleh kepemimpinan [BRA.GetAdjective]. Mereka telah menolak gagasan unifikasi dan setuju bahwa persemakmuran akan bermanfaat bagi kita berdua."
JUNO_brazil_events.64.a: "Luar biasa!"
JUNO_brazil_events.65.t: "[BRA.GetNameDefCap] Menolak Proposal Persemakmuran"
JUNO_brazil_events.65.desc: "Usulan balasan kami untuk membentuk persemakmuran daripada langsung bergabung dengan [BRA.GetNameDef] telah mendapat tanggapan buruk dari kepemimpinan [BRA.GetAdjective]. Mereka menolak gagasan persemakmuran dengan alasan kekhawatiran bahwa mereka akan kembali berada di bawah kendali kita sebagai koloni."
JUNO_brazil_events.65.a: "Kerugian mereka."
JUNO_brazil_events.70.t: "[FROM.GetNameDefCap] Menuntut Wilayah Luar Negeri"
JUNO_brazil_events.70.desc: "[FROM.GetAdjective] diplomat telah memberikan ultimatum kepada negara kita. Mereka menyatakan bahwa mengingat keadaan dunia yang genting, mereka tidak yakin kami mampu melindungi wilayah luar negeri kami. Karena hubungan historis, mereka yakin mereka cocok untuk melakukan hal tersebut. Oleh karena itu, mereka menuntut agar kami segera menyerahkan kendali atas wilayah mereka."
JUNO_brazil_events.70.a: "Wilayah-wilayah tersebut tidak layak untuk diperangi."
JUNO_brazil_events.70.b: "Permintaan yang keterlaluan!"
JUNO_brazil_events.71.t: "[FROM.GetNameDefCap] Setuju untuk Memindahkan Koloni"
JUNO_brazil_events.71.desc: "Pemerintah [FROM.GetNameDef] telah dengan bijak memilih untuk menyerahkan kendali wilayah luar negerinya kepada kami. Hal ini akan memberikan industri kita akses bebas tarif terhadap sumber daya di seluruh dunia dan akan membuat negara-negara besar menganggap kita lebih serius dalam urusan internasional."
JUNO_brazil_events.71.a: "Luar biasa!"
JUNO_brazil_events.72.t: "[FROM.GetNameDefCap] Menolak Pemindahan Koloni"
JUNO_brazil_events.72.desc: "Pemerintah [FROM.GetNameDef] dengan bodohnya menolak menyerahkan kendali wilayah luar negerinya kepada kami. Penghinaan ini tidak luput dari perhatian di kalangan diplomatik. Dengan perhatian dunia tertuju pada kita, kita harus memutuskan bagaimana menanggapinya."
JUNO_brazil_events.72.a: "Ini tidak sebanding dengan perang di seberang lautan."
JUNO_brazil_events.72.b: "Lalu kita akan mengambil tanah itu dengan paksa."
JUNO_brazil_events.73.t: "Ultimatum [FROM.GetAdjective]"
JUNO_brazil_events.73.desc: "Di tengah ketegangan global, sebuah pesan mengejutkan datang dari seberang Atlantik. [FROM.GetNonIdeologyName], yang dahulu merupakan koloni kita dan sekarang merupakan kekuatan yang sedang berkembang, telah mengeluarkan ultimatum yang berani. Mereka menuntut penaklukan [FROM.GetName] dan integrasinya ke dalam Kekaisaran [FROM.GetAdjective]. Masyarakat kita terkejut, dan banyak yang marah atas keberanian [FROM.GetAdjective]. Namun, sebagian lainnya, karena takut akan kekuatan [FROM.GetNonIdeologyName] yang semakin besar dan kerentanan kita sendiri, mempertimbangkan untuk menyetujuinya. Bagaimana tanggapan kita?"
JUNO_brazil_events.73.a: "Kami tidak mempunyai kekuatan untuk melawan."
JUNO_brazil_events.73.b: "Kami tidak akan pernah menyerahkan kemerdekaan kami!"
JUNO_brazil_events.74.t: "[FROM.GetNameDefCap] Menerima Penaklukan"
JUNO_brazil_events.74.desc: "Seperti yang diharapkan, [FROM.GetNonIdeologyName] telah menyetujui permintaan kami untuk menundukkan mereka. Seiring dengan tersebarnya berita ini, suasana hati yang suram pun menyebar ke seluruh negara bekas [FROM.GetNonIdeologyName], dan banyak orang yang bergulat dengan kenyataan baru. Sementara itu, semangat patriotik telah mencengkeram masyarakat [ROOT.GetNonIdeologyName]."
JUNO_brazil_events.74.a: "Akhirnya bersatu kembali!"
JUNO_brazil_events.75.t: "[FROM.GetNameDefCap] Menolak Permintaan Penaklukan"
JUNO_brazil_events.75.desc: "Dalam sikap menantang, pemerintah [FROM.GetNonIdeologyName] dengan keras menolak ultimatum kami, dan mengacu pada sejarah panjang dan kebanggaan bangsa. Semangat patriotik telah melanda kota-kota mereka dan militer mulai melakukan mobilisasi, bersiap menghadapi potensi konflik di seberang Atlantik."
JUNO_brazil_events.75.a: "Tidak banyak yang bisa kami lakukan."
JUNO_brazil_events.75.b: "Mereka akan menyesali keputusan ini."
JUNO_brazil_events.80.t: "[FROM.GetNameDefCap] Mengusulkan Jaminan Bersama"
JUNO_brazil_events.80.desc: "[FROM.GetNameDefCap] telah menawarkan proposal jaminan perlindungan bersama. Mereka berpendapat bahwa perdamaian telah menjadi rapuh di Amerika Selatan dan satu-satunya cara untuk melestarikannya adalah melalui penguatan hubungan antar negara. Jika kami menyetujui usulan ini, mereka akan mengharapkan kami untuk membantu mereka jika mereka diserang."
JUNO_brazil_events.80.a: "Kami menyetujui usulan mereka."
JUNO_brazil_events.80.b: "Kami tidak akan mengikat diri pada hal ini."
JUNO_brazil_events.81.t: "[FROM.GetNameDefCap] Menerima Perjanjian"
JUNO_brazil_events.81.desc: "[FROM.GetNameDefCap] telah menerima usulan kami mengenai jaminan perlindungan bersama. Mudah-mudahan ini adalah langkah pertama menuju perdamaian jangka panjang di benua ini."
JUNO_brazil_events.81.a: "Luar biasa!"
JUNO_brazil_events.82.t: "[FROM.GetNameDefCap] Menolak Perjanjian"
JUNO_brazil_events.82.desc: "[FROM.GetNameDefCap] telah menolak proposal kami yang murah hati untuk memberikan jaminan perlindungan bersama. Apa yang ditunjukkan oleh hal ini terhadap keamanan jangka panjang negara kita masih harus dilihat."
JUNO_brazil_events.82.a: "Betapa tidak menyenangkannya..."
JUNO_brazil_events.83.t: "[FROM.GetNameDefCap] mengundang kita untuk bergabung dengan Organisasi Negara-negara Amerika"
JUNO_brazil_events.83.desc: "Pemerintah [FROM.GetAdjective] telah menghubungi kami dengan undangan untuk bergabung dengan Organisasi Negara-negara Amerika. Cita-cita mereka adalah agar seluruh negara di benua Amerika tergabung dalam organisasi ini. Organisasi yang dimaksud dimaksudkan untuk memperjuangkan kepentingan kita bersama, serta menjamin hubungan baik antara seluruh anggotanya."
JUNO_brazil_events.83.a: "Ide bagus, kami akan bergabung dengan mereka!"
JUNO_brazil_events.83.b: "Kami melihat hal ini tidak diperlukan."
JUNO_brazil_events.84.t: "[FROM.GetNameDefCap] Menolak Undangan kami"
JUNO_brazil_events.84.desc: "[FROM.GetNameDefCap] tanggapan terhadap undangan kami baru saja sampai kepada kami. Sayangnya, mereka memilih untuk tidak bergabung dengan Organisasi Negara-negara Amerika meskipun kami telah melakukan upaya terbaik untuk membuat mereka mempertimbangkan kembali."
JUNO_brazil_events.84.a: "Sungguh memalukan."
JUNO_brazil_events.85.t: "[FROM.GetNameDefCap] Menerima Undangan kami"
JUNO_brazil_events.85.desc: "[FROM.GetNameDefCap] tanggapan terhadap undangan kami baru saja sampai kepada kami. Kami berharap kepemimpinan [FROM.GetAdjective] dapat melihat manfaat dari bergabung dengan Organisasi Negara-negara Amerika. Mulai sekarang kita bekerja sama!"
JUNO_brazil_events.85.a: "Keputusan yang masuk akal!"
JUNO_brazil_events.86.t: "Komunis di [BRA.GetNameDef] Meminta Bantuan kami"
JUNO_brazil_events.86.desc: "Para pemimpin [BRA.GetCommunistParty] di [BRA.GetNameDef] telah menghubungi kami untuk meminta bantuan sekali lagi. Meski saat ini mereka tidak sedang terlibat konflik bersenjata, kegagalan merebut kekuasaan pada tahun 1935 masih membara di benak semua orang. Mereka ingin kita berada di pihak mereka secara lebih aktif untuk memastikan kegagalan tersebut tidak terulang kembali."
JUNO_brazil_events.86.a: "Kita harus membantu kawan-kawan kita sekali lagi!"
JUNO_brazil_events.86.b: "Satu pemberontakan yang gagal di Brazil sudah cukup."
JUNO_brazil_events.87.t: "[SOV.GetNameDefCap] Setuju untuk Mendukung Kami!"
JUNO_brazil_events.87.desc: "Seperti yang kami harapkan, kepemimpinan [SOV.GetAdjective] telah menawarkan kami dukungan di masa-masa sulit ini. Tentu saja kita tidak bisa mengandalkan mereka untuk sepenuhnya menyelesaikan seluruh permasalahan kita, namun mendapatkan dukungan mereka sekali lagi tentu saja merupakan bantuan yang sangat diharapkan"
JUNO_brazil_events.87.a: "Kami tahu kami dapat mengandalkan rekan [SOV.GetAdjective] kami!"
JUNO_brazil_events.87.tt: "Jika terjadi perang saudara, [SOV.GetFlag]§Y[SOV.GetNameDef]§! kemungkinan besar akan mengirimkan sukarelawan dan meminjamkan peralatan sewaan kepada kami."
JUNO_brazil_events.88.t: "[SOV.GetNameDefCap] Menolak Panggilan Bantuan kami"
JUNO_brazil_events.88.desc: "Yang mengejutkan kami adalah [SOV.GetNameDef] menolak memberikan dukungannya kepada kami meskipun kami memiliki hubungan ideologis. Menurut mereka, \"kegagalan\" pada tahun 1935 telah membuat mereka ragu untuk kembali mendukung kami."
JUNO_brazil_events.88.a: "Kami akan menunjukkannya kepada mereka!"
JUNO_brazil_events.88.tt: "Kami memperoleh §YPenurunan opini§! (Pendapat [SOV.GetFlag]§Y[SOV.GetName]§! §R-25§!.)"
JUNO_brazil_events.120.t: "[FROM.GetNameDefCap] Menyarankan Berbagi Teknologi"
JUNO_brazil_events.120.desc: "[FROM.GetNameDefCap] telah menyarankan kemitraan untuk belajar dari keahlian ilmiah satu sama lain. Meskipun sebagian besar ilmuwan kita mendukung peningkatan ketersediaan pengetahuan, pihak militer berhati-hati dalam memberikan informasi yang pada akhirnya dapat membahayakan keamanan nasional kita."
JUNO_brazil_events.120.a: "Pengetahuan tidak mengenal batas."
JUNO_brazil_events.120.b: "Kami akan menawarkan mereka bantuan ekonomi sebagai alternatif."
JUNO_brazil_events.121.t: "[FROM.GetNameDefCap] Mendukung Pertukaran Teknologi"
JUNO_brazil_events.121.desc: "[FROM.GetNameDefCap] telah setuju untuk berpartisipasi dalam program pertukaran teknologi yang kami usulkan. Anggota komunitas ilmiah kami sangat gembira mendengar berita ini dan sudah merencanakan kunjungan ke universitas dan pabrik di [FROM.GetNameDef]."
JUNO_brazil_events.121.a: "Perjanjian yang saling menguntungkan!"
JUNO_brazil_events.122.t: "[FROM.GetNameDefCap] Menolak Pertukaran Teknologi"
JUNO_brazil_events.122.desc: "[FROM.GetNameDefCap] telah menolak program pertukaran teknologi yang kami usulkan dengan alasan bahwa rahasia militer mereka dapat jatuh ke tangan musuh geo-politik mereka. Namun, Departemen Keuangan kita sangat gembira mendengar bahwa [FROM.GetNameDef] telah setuju untuk berinvestasi lebih banyak ke dalam perekonomian kita."
JUNO_brazil_events.122.a: "Ini lebih baik daripada tidak sama sekali."
JUNO_brazil_events.130.t: "Perjanjian Organisasi Negara-negara Amerika Dipanggil"
JUNO_brazil_events.130.desc: "[FROM.GetNameDefCap], sesama anggota Organisasi Negara-negara Amerika, telah diserang dan oleh karena itu menggunakan klausul pertahanan organisasi yang baru-baru ini diadopsi. Berdasarkan klausul tersebut, semua negara anggota diharapkan membantu negara anggota yang diserang. Jika kami mengingkari kewajiban kami, kemungkinan besar kami akan kehilangan keanggotaan."
JUNO_brazil_events.130.a: "Tentu saja kami akan membantu mereka!"
JUNO_brazil_events.130.b: "Apa yang pernah dilakukan organisasi ini untuk kita?"
JUNO_brazil_events.131.t: "[FROM.GetNameDefCap] Datang Membantu Kami"
JUNO_brazil_events.131.desc: "[FROM.GetNameDefCap] telah menjunjung tinggi komitmen mereka terhadap Organisasi Negara-negara Amerika dengan membantu kami dalam situasi yang belum pernah terjadi sebelumnya ini. Semoga semua anggota lainnya dapat mengambil pelajaran dari teladan mereka."
JUNO_brazil_events.131.a: "Kami berterima kasih selamanya."
JUNO_brazil_events.132.t: "[FROM.GetNameDefCap] Mengingkari Kewajiban"
JUNO_brazil_events.132.desc: "[FROM.GetNameDefCap] telah gagal menjunjung komitmen mereka terhadap Organisasi Negara-negara Amerika dengan menolak membantu kami. Oleh karena itu, mereka telah dikeluarkan dari organisasi."
JUNO_brazil_events.132.a: "Semoga kepengecutan seperti ini tidak meluas."
JUNO_brazil_events.133.t: "Dikeluarkan dari Organisasi Negara-negara Amerika"
JUNO_brazil_events.133.desc: "Seperti yang diharapkan, setelah serangan kami baru-baru ini terhadap negara anggota Organisasi Negara-negara Amerika lainnya, kami telah dikeluarkan dari organisasi tersebut. Bagaimana negara-negara anggota lainnya akan menanggapi situasi ini masih harus dilihat."
JUNO_brazil_events.133.a: "Lagipula, lebih baik kita melakukannya sendiri."
JUNO_brazil_events.134.t: "[BRA.GetNameDefCap] Mencari Kesepakatan Produksi Lisensi"
JUNO_brazil_events.134.desc: "Kami telah menerima permintaan lisensi produksi dari rekan-rekan kami di [BRA.GetNameDef]. Mereka ingin mendapatkan kesepakatan jangka panjang mengenai perizinan produksi dari kami, namun sebagai imbalannya, mereka meminta diskon. Kami akan mendapat penghasilan lebih sedikit dari biasanya untuk setiap desain berlisensi, namun kami akan mendapatkan kepercayaan dan niat baik dari pimpinan [BRA.GetAdjective]."
JUNO_brazil_events.134.a: "Kita bisa mengambil sedikit kerugian untuk rekan-rekan kita"
JUNO_brazil_events.134.b: "Tampaknya ini bukan kesepakatan yang adil dan menguntungkan bagi kami"
JUNO_brazil_events.134.tt: "Memilih opsi ini akan mengurangi jumlah pabrik yang kami peroleh dari produksi berlisensi di [BRA.GetFlag]§Y[BRA.GetNameDef]§! sebesar §R-30%§!."
JUNO_brazil_events.135.t: "[SOV.GetNameDefCap] Menyetujui Kesepakatan"
JUNO_brazil_events.135.desc: "Kami baru-baru ini menerima kabar bahwa [SOV.GetNameDef] telah menyetujui usulan kesepakatan kami. Mulai sekarang, kami dapat melisensikan produksi peralatan mereka dengan biaya lebih rendah!"
JUNO_brazil_events.135.a: "Berita yang luar biasa!"
JUNO_brazil_events.135.tt: "Kami memperoleh §YPeningkatan opini§! (Pendapat [SOV.GetFlag]§Y[SOV.GetName]§! §G+25§!.)"
JUNO_brazil_events.136.t: "[SOV.GetNameDefCap] Menolak Usulan Kesepakatan kami"
JUNO_brazil_events.136.desc: "[SOV.GetNameDefCap] dengan cepat menanggapi proposal kami, dengan penolakan. Kami meminta lisensi produksi sama seperti negara lain, dan harganya akan sama dengan negara lain, tanpa diskon."
JUNO_brazil_events.136.a: "Itu layak untuk ditanyakan..."
JUNO_brazil_events.136.tt: "Kami memperoleh §YPenurunan opini§! (Pendapat [SOV.GetFlag]§Y[SOV.GetName]§! §R-50§!.)"
JUNO_brazil_events.137.t: "[BRA.GetNameDefCap] Menuntut Kami Membebaskan Koloni Amerika Selatan"
JUNO_brazil_events.137.desc: "Kami telah menerima komunikasi dengan kata-kata yang cukup tegas dari [BRA.GetNameDef]. Mereka menuntut kami melepaskan [BRA_country_to_be_liberated.GetNameDef] dan mengembalikan wilayah tersebut kepada pemilik sahnya."
JUNO_brazil_events.137.a: "Lagipula, koloni-koloni itu tidak banyak berguna bagi kita."
JUNO_brazil_events.137.b: "Pemilik sah mereka adalah kita."
JUNO_brazil_events.137.b.tt: "§RIni akan memberi mereka tujuan perang pada kita!§!"
JUNO_brazil_events.138.t: "[FROM.GetNameDefCap] Setuju untuk Melepaskan [BRA_country_to_be_liberated.GetNameDef]"
JUNO_brazil_events.138.desc: "Tanggapan terhadap tuntutan kami agar [FROM.GetNameDef] melepaskan [BRA_country_to_be_liberated.GetNameDef] mereka baru saja sampai kepada kami. Mungkin sedikit mengejutkan, mereka sepakat bahwa melepaskan mereka dan melepaskan mereka sebagai negara merdeka adalah jalan terbaik."
JUNO_brazil_events.138.a: "Sebuah hasil yang paling memuaskan."
JUNO_brazil_events.139.t: "[FROM.GetNameDefCap] Menolak Melepaskan Koloni"
JUNO_brazil_events.139.desc: "Tanggapan terhadap tuntutan kami agar [FROM.GetNameDef] melepaskan [BRA_country_to_be_liberated.GetNameDef] mereka baru saja sampai kepada kami. Dengan menyatakan bahwa urusan luar negeri mereka bukan urusan kita, mereka menolak gagasan memberikan kemerdekaan yang sah kepada mereka."
JUNO_brazil_events.139.a: "Kita harus membebaskan mereka, apapun resikonya."
JUNO_brazil_events.140.t: "Diplomasi Jaguar"
JUNO_brazil_events.140.desc: "Sebagai tanda niat baik, delegasi diplomatik [FROM.GetAdjective] telah tiba dengan membawa hadiah unik—seekor jaguar, lambang budaya dan kekuatan bangsa mereka. Hadiah luar biasa ini juga disertai dengan proposal untuk meningkatkan perdagangan dan kerja sama dalam kebijakan luar negeri. Utusan [FROM.GetAdjective] mengungkapkan keinginan mereka untuk menjalin ikatan yang lebih kuat antara negara kita.\n\nMeskipun jaguar telah memikat imajinasi publik dan mendapatkan niat baik, implikasi yang lebih luas dari tawaran ini memerlukan pertimbangan yang cermat."
JUNO_brazil_events.140.a: "Sambutlah sikap tersebut dan perkuat hubungan."
JUNO_brazil_events.140.b: "Tolak tawaran itu dengan sopan."
JUNO_brazil_events.141.t: "Misi Diplomatik yang Sukses"
JUNO_brazil_events.141.desc: "Misi diplomatik kami telah kembali dengan kabar baik. [FROM.GetNameDefCap] telah dengan baik hati menerima hadiah seekor jaguar dari kami. Dalam upacara akbar yang menarik perhatian internasional, mereka menyambut baik sikap kami dan menyetujui usulan kami untuk meningkatkan perdagangan dan kerja sama dalam masalah kebijakan luar negeri."
JUNO_brazil_events.141.a: "Berita bagus!"
BRA_jaguar_diplomacy_in_progress: "Keputusan Diplomasi Jaguar sedang berlangsung"
JUNO_brazil_events.142.t: "Rasa Malu Diplomatik"
JUNO_brazil_events.142.desc: "Laporan terbaru dari delegasi diplomatik kita membawa kabar buruk. Tawaran kami untuk seekor jaguar, simbol keinginan kami untuk persahabatan dan niat baik, tiba-tiba ditolak oleh [FROM.GetNameDef]. Seiring dengan penolakan terhadap hadiah berharga ini, usulan kami untuk meningkatkan perdagangan dan kerja sama dalam masalah kebijakan luar negeri juga telah ditolak."
JUNO_brazil_events.142.a: "Kita harus bertindak hati-hati."
JUNO_brazil_events.143.t: "Gerakan Radikal Kiri Mendapatkan Daya Tarik"
JUNO_brazil_events.143.desc: "Ada peningkatan aktivitas gerakan radikal yang mengaku mewakili kelas pekerja di kota-kota kita. Badan keamanan kami yakin gerakan ini didukung oleh rezim komunis [BRA.GetNonIdeologyName]. Oleh karena itu, mereka menyusun rencana untuk menindak kelompok radikal jika kita memberikan izin."
JUNO_brazil_events.143.a: "Kita harus menyelidiki hal ini sebelum menjadi tidak terkendali."
JUNO_brazil_events.144.t: "Operasi di [FROM.GetNameDef] Terganggu"
JUNO_brazil_events.144.desc: "Operasi kami di [FROM.GetNameDef] untuk meningkatkan dukungan terhadap partai komunis menghadapi perlawanan keras dari polisi dan dinas keamanan setempat. Kita perlu mencoba taktik infiltrasi baru jika kita ingin membuat kemajuan lebih lanjut dalam hal ini."
JUNO_brazil_events.144.a: "Sayangnya."
brazil_promoting_communism_tt: "Membuka kunci keputusan §YMenekan Komunisme§! untuk memerangi pengaruh [FROM.GetAdjective] terhadap politik kita."
JUNO_brazil_events.150.t: "Cangaço Melaksanakan Operasi"
JUNO_brazil_events.150.desc.a: "Para bandit di Brasil Timur Laut, yang dikenal sebagai Cangaço, telah mengatur serangan terhadap pemukiman di wilayah tersebut. Penegakan hukum kesulitan mencapai kemajuan dalam penyelidikan mereka karena penduduk setempat melindungi anggota kelompok tersebut. Tampaknya memburu para pelaku memerlukan kehadiran keamanan yang lebih kuat di wilayah tersebut."
JUNO_brazil_events.150.desc.b: "Para bandit di Brasil Timur Laut, yang dikenal sebagai Cangaço, memperluas operasi mereka ke lebih banyak wilayah di wilayah tersebut. Meskipun penegak hukum setempat dan pemilik tanah marah dengan aktivitas semacam ini di wilayah tersebut, banyak warga miskin yang tetap tidak peduli, atau bahkan sangat gembira dengan berita tersebut. Tampaknya memburu para pelaku memerlukan kehadiran keamanan yang lebih kuat di wilayah tersebut."
JUNO_brazil_events.150.a: "Itu hanya gangguan."
JUNO_brazil_events.150.b: "Banditisme seperti itu tidak dapat ditoleransi lagi!"
JUNO_brazil_events.150.c: "Mereka harus segera dilacak dan ditangkap!"
JUNO_brazil_events.151.t: "Operasi Sukses Melawan Cangaço"
JUNO_brazil_events.151.desc: "Operasi kami baru-baru ini di Timur Laut Brasil telah terbukti berhasil mengganggu operasi Cangaço. Saat ini wilayah operasi mereka telah berkurang secara signifikan, namun investasi berkelanjutan dalam penegakan hukum diperlukan jika kita ingin mencegah terjadinya kembali kasus serupa di masa depan."
JUNO_brazil_events.151.a: "Luar biasa!"
JUNO_brazil_events.152.t: "Lampião Tewas dalam Baku Tembak"
JUNO_brazil_events.152.desc: "Dalam operasi penegakan hukum terbaru kami di Brasil Timur Laut, Lampião, anggota suku Cangaço yang paling terkenal, tewas dalam baku tembak dengan polisi. Seorang anggota kelompok bandit Lampião mengkhianatinya, sehingga polisi dapat menyergap kelompok tersebut di tempat persembunyian mereka. Meskipun banyak kelompok bandit kecil terus berkeliaran di pedesaan, hal ini tampaknya menandai berakhirnya operasi skala besar yang dilakukan oleh Cangaço."
JUNO_brazil_events.152.a: "Tentang waktu."
BRA_end_of_cangaco_tt: "§Y$BRA_cangaceiro_mission$§! akan dinonaktifkan secara permanen, mencegah penyebaran Cangaço ke negara bagian mana pun."
JUNO_brazil_events.153.t: "Ancaman Cangaço"
JUNO_brazil_events.153.desc: "Timur Laut Brasil telah diganggu selama bertahun-tahun oleh bandit yang dikenal sebagai Cangaço. Dengan ketidakstabilan di ibu kota dan para politisi yang lebih khawatir untuk tetap berkuasa, suku Cangaço semakin merajalela. Hanya melalui upaya bersama dari penegak hukum kita dapat berharap untuk mengurangi pengaruh mereka di wilayah tersebut."
JUNO_brazil_events.153.a: "Kami akan menanganinya tepat waktu."
JUNO_brazil_events_153_tt: "Keputusan §Y$BRA_cangaceiro_decision_cat$§! dan §Y$BRA_cangaceiro_mission$§! akan tetap aktif sampai Cangaço dipindahkan dari semua negara bagian yang terkena dampak.\n\n§Y$BRA_deal_with_the_cangaceiro$§! fokus nasional akan membuka keputusan untuk menghapus Cangaço."
JUNO_brazil_events.160.t: "Perusahaan Diundang ke [FROM.GetNameDefCap]"
JUNO_brazil_events.160.desc: "[FROM.GetAdjective] diplomat telah menghubungi kami mengenai rencana mereka untuk memberikan insentif kepada perusahaan asing untuk mendirikan anak perusahaan di negara mereka. Mereka ingin tahu apakah kami akan menghalangi perusahaan kami untuk melakukan hal tersebut. Jika kita setuju untuk mengizinkan perusahaan kita berekspansi ke pasar negara berkembang ini, kita mungkin akan mendapatkan keuntungan ekonomi."
JUNO_brazil_events.160.a: "Siapakah kita yang bisa menghalangi pasar bebas?"
JUNO_brazil_events.160.b: "Ini adalah tipu muslihat untuk mencuri kekayaan intelektual kita."
JUNO_brazil_events_160_tt: "§Y[FROM.GetNameDefCap] akan membuka salah satu dari yang berikut:§!"
JUNO_brazil_events.161.t: "[FROM.GetNameDefCap] Setuju dengan Kerjasama Manufaktur"
JUNO_brazil_events.161.desc: "[FROM.GetNameDefCap] pemerintah telah mengizinkan perusahaannya untuk mendirikan anak perusahaan di [ROOT.GetNonIdeologyName], jika mereka memilih untuk melakukannya. Yang tersisa hanyalah menentukan jenis industri apa yang ingin kita beri insentif."
JUNO_brazil_events.161.a: "Memberi insentif pada pembuatan tangki."
JUNO_brazil_events.161.b: "Memberi insentif pada manufaktur pesawat terbang."
JUNO_brazil_events.161.c: "Berikan insentif pada pembangunan kapal."
JUNO_brazil_events.161.d: "Memberi insentif pada pembuatan mobil lapis baja."
JUNO_brazil_events.162.t: "[FROM.GetNameDefCap] Menolak Kerjasama Manufaktur"
JUNO_brazil_events.162.desc: "Para diplomat [FROM.GetAdjective] telah memberi tahu kami bahwa pemerintah mereka tidak akan mengizinkan perusahaan mereka mendirikan anak perusahaan di [ROOT.GetNonIdeologyName] di masa mendatang. Mereka menyebutkan kekhawatiran mengenai hak kekayaan intelektual dan potensi rahasia militer terungkap ke negara-negara musuh."
JUNO_brazil_events.162.a: "Kami akan mencari kemitraan korporat di tempat lain."
JUNO_brazil_events.163.t: "Mengatasi Perselisihan Perburuhan"
JUNO_brazil_events.163.desc: "Perselisihan antara buruh dan pengusaha hampir memecah belah negara ini dalam beberapa tahun terakhir. Sudah saatnya kita akhirnya membuat undang-undang untuk menyelesaikan masalah ini. Di satu sisi kongres nasional, Partido Trabalhista mengadvokasi undang-undang pro-buruh yang akan melegalkan aktivitas serikat pekerja, memberikan jaminan hak-hak pekerja dan hak atas sejumlah hari libur per tahun. Di sisi lain, Partido Republicano menganjurkan reformasi yang tidak terlalu radikal dan menyerahkan masalah ini kepada negara bagian untuk memutuskan sendiri. Mereka berpendapat bahwa situasi keamanan global saat ini berarti kita harus memprioritaskan belanja pertahanan nasional, dibandingkan menyerah pada kelompok sayap kiri radikal."
JUNO_brazil_events.163.a: "Menetapkan undang-undang Partido Trabalhista."
JUNO_brazil_events.163.b: "Menetapkan undang-undang Partido Republicano."
JUNO_brazil_events.170.t: "[FROM.GetNameDefCap] Mengusulkan Unifikasi"
JUNO_brazil_events.170.desc: "[FROM.GetNameDefCap] telah mengusulkan penyatuan negara kita ke dalam federasinya. Meskipun kami telah bekerja sama dengan [FROM.GetNameDef] akhir-akhir ini, banyak generasi tua yang enggan mengesampingkan keluhan bersejarah mereka demi stabilitas ekonomi dan politik. Apapun keputusan kita, kemungkinan besar akan berdampak pada tahun-tahun mendatang."
JUNO_brazil_events.170.a: "Inilah saatnya untuk mengesampingkan perbedaan kita."
JUNO_brazil_events.170.b: "Kami tidak akan pernah menyetujui pengaturan seperti itu!"
JUNO_brazil_events.171.t: "[FROM.GetNameDefCap] Menerima Unifikasi"
JUNO_brazil_events.171.desc: "[FROM.GetNameDefCap] telah menyetujui proposal unifikasi kami setelah diskusi panjang mengenai posisi mereka dalam sistem politik kita dan perlindungan kepentingan utama rakyat mereka."
JUNO_brazil_events.171.a: "Ini adalah momen bersejarah!"
JUNO_brazil_events.172.t: "[FROM.GetNameDefCap] Menolak Unifikasi"
JUNO_brazil_events.172.desc: "[FROM.GetNameDefCap] telah menolak usulan unifikasi kami karena kebijakan tersebut tidak populer di kalangan masyarakat. Terlepas dari penjelasan kami mengenai bagaimana pengaturan ini akan saling menguntungkan, nampaknya waktu untuk unifikasi belum tiba."
JUNO_brazil_events.172.a: "Orang bodoh yang berpikiran sempit."
JUNO_brazil_events.180.t: "$BRA_henry_ford$ tiba di [ROOT.GetNonIdeologyName]"
JUNO_brazil_events.180.desc: "Karena kekacauan baru-baru ini di Amerika Serikat dan penggulingan pemerintahan mereka oleh kaum Marxis, sejumlah [USA.GetAdjective] berpindah ke [ROOT.GetNonIdeologyName] untuk mencari kehidupan baru. Mungkin kedatangan kami yang paling terkenal sejauh ini adalah industrialis terkenal $BRA_henry_ford$. Dia telah menawarkan untuk memperluas operasinya di Fordlandia dengan imbalan kursi di pemerintahan untuk membantu mencegah kita menjadi korban pengaruh komunis seperti yang terjadi di tanah kelahirannya."
JUNO_brazil_events.180.a: "Kita bisa menggunakan keahliannya."
JUNO_brazil_events.180.b: "Dia terlalu berisiko untuk terlibat dalam pengambilan keputusan kita."
JUNO_brazil_events.190.t: "[FROM.GetNameDefCap] Mempromosikan Monarki di [ROOT.GetNonIdeologyName]"
JUNO_brazil_events.190.desc: "Kami menerima sejumlah laporan bahwa agen [FROM.GetAdjective] berusaha mempromosikan sentimen monarki di [ROOT.GetNonIdeologyName]. Tergantung pada rencana jangka panjang bangsa ini, kita harus menerima gerakan ini atau menghentikannya sebelum menjadi tidak terkendali."
JUNO_brazil_events.190.a: "Kami akan menerima warisan kekaisaran kami!"
JUNO_brazil_events.190.b: "Kita harus segera menghancurkan gerakan ini."
BRA_rejected_monarchism: "§RTelah melarang gerakan monarki.§!"
JUNO_brazil_events.191.t: "[FROM.GetNameDefCap] Melarang Gerakan Monarki"
JUNO_brazil_events.191.desc: "[FROM.GetNameDefCap][BRA.GetFlag] telah menerapkan tindakan keras terhadap promosi sentimen monarki. Tidak mengherankan, hal ini mempunyai efek yang menenangkan terhadap dampak operasi kami di negara ini."
JUNO_brazil_events.191.a: "Kita harus menggunakan metode alternatif di masa depan."
JUNO_brazil_events.200.t: "Musim Pemilu"
JUNO_brazil_events.200.desc: "Musim Pemilu telah tiba kembali dan masyarakat [ROOT.GetAdjective] menunggu dengan napas tertahan untuk melihat siapa yang akan menjadi Presiden berikutnya."
JUNO_brazil_events.200.a: "$BRA_anisio_teixeira$"
JUNO_brazil_events.200.b: "$BRA_armando_de_sales_oliveira$"
JUNO_brazil_events.200.c: "$BRA_minervino_de_oliveira$"
JUNO_brazil_events.200.d: "$BRA_lindolfo_collor$"
JUNO_brazil_events.200.e: "$BRA_eurico_gaspar_dutra$"
south_american_news.52.t: "Karnaval Dibatalkan"
south_american_news.52.desc: "Ketika dunia kembali terjerumus ke dalam konflik global, kota Rio de Janeiro memutuskan untuk menunda perayaan karnaval tahunan yang terkenal itu. Dengan perdamaian yang hanya tinggal kenangan, masih belum jelas kapan perayaan tersebut akan kembali digelar. Namun, banyak yang lebih khawatir mengenai apakah perang juga akan mencapai [BRA.GetNonIdeologyName] itu sendiri."
south_american_news.52.a: "Momen yang menyedihkan bagi kita semua."
south_american_news.52.b: "Pertunjukan dekaden seperti itu tidak akan dilewatkan."
### Argentina ###
ARG_political_events.1.t: "Tentara Berbalik Melawan Kita!"
ARG_political_events.1.desc: "Pagi ini, saat fajar menyingsing, 8.000 tentara berbaris dari pangkalan militer Campo de Mayo di Buenos Aires menuju kantor kepresidenan 'La Casa Rosada'. Dipimpin oleh Arturo Rawson dan Pedro Pablo Ramírez, kedua jenderal tersebut menuntut agar [FROM.GetLeader] mundur dan menyerahkan pemerintahan [FROM.GetName] kepada tentara. Kita bisa tunduk pada ultimatum mereka, atau bersiap melawan mereka."
ARG_political_events.1.a: "Tidak ada yang bisa kami lakukan."
ARG_political_events.1.b: "Kita tidak bisa membiarkan mereka lolos begitu saja!"
ARG_political_events.2.t: "[USA.GetName] meminta embargo [GER.GetAdjective]!"
ARG_political_events.2.desc: "Meskipun kami berdedikasi untuk menghindari konflik ini, para diplomat [USA.GetAdjective] terus menekan kami untuk memutuskan hubungan dengan teman-teman [GER.GetAdjective] kami. Pagi ini kami dengan tegas diminta untuk memberlakukan keadaan embargo terhadap [GER.GetName] demi menjaga perdamaian di benua Amerika. Hal ini menempatkan kita pada posisi yang sulit, dan menghindari perang ini semakin hari semakin sulit."
ARG_political_events.2.a: "Kita tidak punya banyak pilihan."
ARG_political_events.2.b: "Kami belum ingin memutuskan hubungan."
ARG_political_events.3.t: "[ARG.GetName] Menawarkan untuk Bergabung dengan Sekutu"
ARG_political_events.3.desc: "Presiden [ARG.GetLeader] dari [ARG.GetName] hari ini telah menghubungi kami dengan permohonan untuk bergabung dengan Sekutu dalam perjuangan kami melawan musuh-musuh kami. Tampaknya permintaan kami akan persatuan Amerika dalam menghadapi kesulitan seperti ini akhirnya didengarkan."
ARG_political_events.3.a: "Itu hanya masalah waktu saja."
ARG_political_events.4.t: "[USA.GetName] mengembargo kami"
ARG_political_events.4.desc: "Pagi ini kami menerima deklarasi embargo resmi dari [USA.GetName]. Dinyatakan bahwa keputusan kita untuk tetap netral dalam konflik global merupakan kebalikan dari segala sesuatu yang dijunjung oleh Doktrin Monroe. Oleh karena itu, sanksi ini dikenakan kepada kami hingga pemberitahuan lebih lanjut. Tampaknya dedikasi kami terhadap netralitas telah membuat marah negara-negara tetangga kami di utara."
ARG_political_events.4.a: "Ini sangat disayangkan."
ARG_political_events.5.t: "[ARG.GetName] meminta kepemilikan Kepulauan Atlantik Selatan"
ARG_political_events.5.desc: "Selama bertahun-tahun, kepulauan Falkland dan Georgia Selatan telah menjadi wilayah kedaulatan [ENG.GetAdjective]. Namun, tampaknya pemerintah [ARG.GetAdjective] telah secara resmi meminta agar pulau-pulau tersebut ditempatkan di bawah pengawasan mereka, sehingga memungkinkan mereka untuk lebih mengamankan Atlantik Selatan selama masa-masa sulit ini."
ARG_political_events.5.a: "Pulau-pulau itu adalah milik mereka."
ARG_political_events.5.b: "Kita tidak bisa membiarkan mereka pergi dengan gratis..."
ARG_political_events.5.c: "Tentu saja tidak."
ARG_political_events.6.t: "[FROM.GetName] menyetujui usulan kami!"
ARG_political_events.6.desc: "Usulan kami untuk menguasai kepulauan Falkland dan Georgia Selatan telah diterima oleh pemerintah [FROM.GetAdjective]. Sekarang pulau-pulau tersebut merupakan hak milik Argentina, kita dapat mulai berupaya melindungi perairan kita selama konflik ini."
ARG_political_events.6.a: "Luar biasa!"
ARG_political_events.7.t: "[FROM.GetName] meminta kami membayar pulau tersebut."
ARG_political_events.7.desc: "Meskipun kami berupaya meyakinkan [FROM.GetAdjective] bahwa pulau-pulau tersebut seharusnya menjadi milik [ARG.GetName], pemerintah mereka telah menawarkan untuk menyerahkan tanah tersebut sebagai imbalan atas pembayaran. Hal ini mungkin merupakan pukulan kecil bagi perekonomian kita, namun memiliki wilayah ini akan lebih menguntungkan kita dalam jangka panjang."
ARG_political_events.7.a: "Tidak bagus, tapi kami akan menerimanya."
ARG_political_events.8.t: "[FROM.GetName] menolak menyerahkan pulau-pulau tersebut."
ARG_political_events.8.desc: "Sayangnya, usulan kami tidak mendapat tanggapan apa pun. Pemerintah [FROM.GetAdjective] telah memutuskan bahwa pulau-pulau tersebut sebaiknya tetap berada di bawah perlindungan mereka. Meskipun hal ini mengecewakan, setidaknya kita tahu bahwa sekutu kita ada di dekat kita."
ARG_political_events.8.a: "Mengecewakan."
ARG_political_events.9.t: "Perang Saudara Ada di Depan Kita"
ARG_political_events.9.desc: "Sebagai akibat dari konsolidasi kekuasaan Ramón Castillo di dalam pemerintahan, hal ini semakin menambah api ketidakpuasan di antara para pemimpin militer negara tersebut. Mereka telah memutuskan bahwa cukup sudah dan setelah mengumpulkan kekuatan sebanyak yang mereka bisa, mereka telah meluncurkan kekuatan pemberontakan untuk bergerak ke Buenos Aires! Tampaknya Perang Saudara [ARG.GetAdjective] telah dimulai."
ARG_political_events.9.a: "Kumpulkan pasukan yang tersisa!"
ARG_political_events.10.t: "Menekan Ketidakpuasan Militer"
ARG_political_events.10.desc: "Pagi ini, Presiden [ARG.GetLeader] mengumpulkan para penasihat mereka dan menyelesaikan tindakan Intervenciones Federales. Dengan melakukan hal ini, pemerintah akhirnya menindak tegas pihak militer yang menghasut pemberontakan. Mungkin diperlukan waktu untuk membangun kembali loyalitas militer kita, namun hal ini bermanfaat untuk menghindari bencana nasional seperti perang saudara."
ARG_political_events.10.a: "Itu sudah dekat..."
ARG_political_events.11.t: "Pemberontakan Militer Segera Terjadi"
ARG_political_events.11.desc: "Kami telah menerima kabar bahwa perwira tertinggi militer kami telah memisahkan diri dari pemerintah dan mengumpulkan pendukung mereka dalam upaya untuk mengambil kendali politik [ARG.GetAdjective]. Kami tidak bisa membiarkan mereka mencapai Buenos Aires. Saatnya bersiap menghadapi Perang Saudara [ARG.GetAdjective]."
ARG_political_events.11.a: "Bersiaplah untuk mempertahankan [ARG.GetName] dari para pemberontak ini!"
ARG_political_events.12.t: "[ARG.GetNameDefCap] Berusaha Bergabung dengan Poros"
ARG_political_events.12.desc: "Kami menerima kabar hari ini dari seorang diplomat [ARG.GetAdjective] bahwa pemerintah mereka berupaya mengirimkan permohonan untuk bergabung dengan Poros. Jika kita menerimanya, maka ini akan menjadi pijakan di benua Amerika Selatan. Bagaimana tanggapan kita?"
ARG_political_events.12.a: "Kami akan menyambut sekutu baru kami."
ARG_political_events.12.b: "Tawaran mereka tidak ada artinya bagi kami."
ARG_political_events.13.t: "[GER.GetNameDefCap] Menerima Lamaran kami!"
ARG_political_events.13.desc: "Kami menerima kabar kembali dari kedutaan [GER.GetAdjective] dan dengan senang hati kami mengumumkan bahwa mereka telah menerima kami di Poros. Ini adalah awal dari aliansi yang kuat."
ARG_political_events.13.a: "Luar biasa!"
ARG_political_events.14.t: "[GER.GetNameDefCap] Menolak Permohonan kami!"
ARG_political_events.14.desc: "Meskipun kami berupaya keras, pemerintah [GER.GetAdjective] telah menolak permohonan kami untuk bergabung dengan Poros. Sepertinya kita harus menghadapi dunia sendirian."
ARG_political_events.14.a: "Menyedihkan..."
ARG_political_events.15.t: "[ARG.GetNameDefCap] Mengeluarkan Ultimatum"
ARG_political_events.15.desc: "Menurut duta [ARG.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName], pemerintahan kita saat ini akan turun tahta dan digantikan oleh boneka [ARG.GetAdjective]. Besar kemungkinan penolakan kita akan berujung pada deklarasi perang. Kita harus memilih dengan bijak."
ARG_political_events.15.a: "Kita tidak bisa menahan mereka"
ARG_political_events.15.b: "Kami tidak akan menyerahkan kedaulatan kami."
ARG_political_events.16.t: "[PAR.GetNameDefCap] Menyetujui Ketentuan Ultimatum"
ARG_political_events.16.desc: "Pemerintah [PAR.GetAdjective] telah memutuskan untuk menyetujui persyaratan yang kami jelaskan dalam ultimatum kami. Kami akan segera membuat boneka di tanah mereka, dan menetapkan peraturan [ARG.GetAdjective] sesegera mungkin."
ARG_political_events.16.a: "Luar biasa!"
ARG_political_events.17.t: "[PAR.GetNameDefCap] Menolak Syarat Ultimatum"
ARG_political_events.17.desc: "Pemerintah [PAR.GetAdjective] telah memutuskan untuk menolak persyaratan yang kami tetapkan untuk mereka. Ini tidak bisa diterima. Kita bisa mundur dan membiarkannya atau mempersiapkan pasukan kita untuk berperang."
ARG_political_events.17.a: "Mundur, itu tidak layak..."
ARG_political_events.17.b: "Mereka akan menyesal menolak kita!"
ARG_political_events.18.t: "[ARG.GetNameDefCap] Mundur"
ARG_political_events.18.desc: "Setelah mempertahankan pendirian kami, tampaknya pemerintah [ARG.GetAdjective] memutuskan bahwa tindakan ini tidak layak dilakukan. Kita bisa tenang sekarang mengetahui bahwa ancaman tersebut telah berkurang untuk saat ini."
ARG_political_events.18.a: "Itu melegakan..."
ARG_political_events.19.t: "[ARG.GetNameDefCap] Mengeluarkan Ultimatum"
ARG_political_events.19.desc: "Menurut duta [ARG.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName], pemerintahan kita saat ini akan mundur dan digantikan oleh boneka [ARG.GetAdjective]. Besar kemungkinan penolakan kita akan berujung pada deklarasi perang. Kita harus memilih dengan bijak."
ARG_political_events.19.a: "Kita tidak bisa menahan mereka"
ARG_political_events.19.b: "Kami tidak akan menyerahkan kedaulatan kami."
ARG_political_events.20.t: "[URG.GetNameDefCap] Menyetujui Ketentuan Ultimatum"
ARG_political_events.20.desc: "Pemerintah [URG.GetAdjective] telah memutuskan untuk menyetujui persyaratan yang kami jelaskan dalam ultimatum kami. Sekarang kita dapat secara resmi melaksanakan rencana kolonial yang telah disusun oleh sekutu [GER.GetAdjective] kita bertahun-tahun yang lalu. Mereka pasti akan senang dengan kejadian ini."
ARG_political_events.20.a: "Luar biasa!"
ARG_political_events.21.t: "[URG.GetNameDefCap] Menolak Syarat Ultimatum"
ARG_political_events.21.desc: "Pemerintah [URG.GetAdjective] telah memutuskan untuk menolak persyaratan yang kami tetapkan untuk mereka. Jika kami menganggap tindakan ini tidak layak, kami bisa mundur saja. Jika tidak, mari persiapkan pasukan kita untuk invasi."
ARG_political_events.21.a: "Mundur, itu tidak layak..."
ARG_political_events.21.b: "Mereka akan menyesal menolak kita!"
ARG_political_events.22.t: "[ARG.GetNameDefCap] Melaksanakan Rencana Kolonial"
ARG_political_events.22.desc: "Pagi ini duta besar [ARG.GetAdjective] di [GER.capital.GetCapitalVictoryPointName] mendatangi kami dengan berita bahwa [ARG.GetNameDef] telah menjadi boneka bangsa [URG.GetNameDef] atas nama rencana kolonial kami sebelumnya terhadap negara tersebut. Ini adalah berita bagus, karena akan memungkinkan pengaruh [GER.GetAdjective] yang lebih besar di benua ini."
ARG_political_events.22.a: "Mereka terbukti menjadi sekutu yang layak."
ARG_political_events.23.t: "[ARG.GetNameDefCap] Mundur"
ARG_political_events.23.desc: "Setelah mempertahankan pendirian kami, tampaknya pemerintah [ARG.GetAdjective] memutuskan bahwa tindakan ini tidak layak dilakukan. Kita bisa tenang sekarang mengetahui bahwa ancaman tersebut telah berkurang untuk saat ini."
ARG_political_events.23.a: "Itu melegakan..."
ARG_political_events.24.t: "[ARG.GetNameDefCap] Mencari Aliansi"
ARG_political_events.24.desc: "Kami telah menerima kabar dari [ARG.GetNameDef] bahwa mereka berupaya mengundang kami untuk bergabung dengan mereka dalam aliansi. Mereka menawarkan untuk menyerahkan Tierra Del Fuego dan Santa Cruz kepada kami jika kami menerimanya. Ini adalah tawaran yang sangat menggiurkan..."
ARG_political_events.24.a: "Akan bermanfaat jika bergabung dengan mereka."
ARG_political_events.24.b: "Kami tidak akan pernah memihak [ARG.GetNameDef]!"
ARG_political_events.25.t: "[CHL.GetNameDefCap] Setuju untuk Bergabung dengan Fraksi kami"
ARG_political_events.25.desc: "Berita bagus! Pemerintah [CHL.GetAdjective] telah memutuskan untuk bergabung dengan kami dalam aliansi. Bersama-sama kita akan mampu berdiri sebagai saudara melawan ancaman yang ada di utara. Ini adalah hari yang penting dan merupakan langkah menuju arah yang benar bagi Amerika Selatan yang bersatu."
ARG_political_events.25.a: "[ARG.GetNameDef] dan [CHL.GetNameDef] berdiri bersama!"
ARG_political_events.26.t: "[CHL.GetNameDefCap] Menolak Bergabung dengan Fraksi kami"
ARG_political_events.26.desc: "Pemerintah [CHL.GetAdjective] dengan keras kepala menolak untuk bergabung dengan kami dalam tujuan penaklukan seluruh benua. Meskipun kita tidak bisa memaksakan upaya mereka dalam upaya ini, kita masih berpotensi membawa perang yang benar ke depan pintu mereka. Bagaimanapun, ini adalah hari yang menyedihkan bagi hubungan kedua negara."
ARG_political_events.26.a: "Sungguh mengecewakan..."
ARG_political_events.27.t: "[ARG.GetNameDefCap] Mengeluarkan Ultimatum"
ARG_political_events.27.desc: "Menurut duta [ARG.GetAdjective] di [ROOT.Capital.GetCapitalVictoryPointName], pemerintahan kita saat ini akan turun tahta dan digantikan oleh boneka [ARG.GetAdjective]. Besar kemungkinan penolakan kita akan berujung pada deklarasi perang. Kita harus memilih dengan bijak."
ARG_political_events.27.a: "Kita tidak bisa menahan mereka"
ARG_political_events.27.b: "Kami tidak akan menyerahkan kedaulatan kami."
ARG_political_events.28.t: "[CHL.GetNameDefCap] Menyetujui Ketentuan Ultimatum"
ARG_political_events.28.desc: "Pemerintah [CHL.GetAdjective] telah memutuskan untuk menyetujui persyaratan yang kami jelaskan dalam ultimatum kami. Kami akan segera membuat boneka di tanah mereka, dan menetapkan peraturan [ARG.GetAdjective] sesegera mungkin."
ARG_political_events.28.a: "Luar biasa!"
ARG_political_events.29.t: "[CHL.GetNameDefCap] Menolak Syarat Ultimatum"
ARG_political_events.29.desc: "Pemerintah [CHL.GetAdjective] telah memutuskan untuk menolak persyaratan yang kami tetapkan untuk mereka. Mengingat ukuran dan kekuatan negara mereka, kita bisa memilih untuk mundur. Kalau tidak, kita bisa mengerahkan pasukan kita dan memulai persiapan invasi."
ARG_political_events.29.a: "Mundur, itu tidak layak..."
ARG_political_events.29.b: "Mereka akan menyesal menolak kita!"
ARG_political_events.30.t: "[ARG.GetNameDefCap] Mundur"
ARG_political_events.30.desc: "Setelah mempertahankan pendirian kami, tampaknya pemerintah [ARG.GetAdjective] memutuskan bahwa tindakan ini tidak layak dilakukan. Kita bisa tenang sekarang mengetahui bahwa ancaman tersebut telah berkurang untuk saat ini."
ARG_political_events.30.a: "Itu melegakan..."
ARG_political_events.31.t: "Pertanyaan Osmar Hellmuth"
ARG_political_events.31.desc: "Di bawah pemerintahan kita sebelumnya, seorang pria [ARG.GetAdjective] keturunan [GER.GetAdjective] ditangkap di sebuah kapal setelah dikirim dalam misi rahasia ke [GER.GetNameDef]. Kita bisa menawar pembebasannya, dan mengizinkan dia bergabung dengan badan intelijen kita yang baru dibentuk, atau kita bisa membiarkannya di penjara dan tetap teguh pada perlakuan kita terhadap mata-mata."
ARG_political_events.31.a: "Lepaskan Hellmuth. Kita bisa menggunakan keahliannya."
ARG_political_events.31.b: "Simpan dia di penjara. Bertahanlah."
ARG_political_events.32.t: "[ARG.GetNameDefCap] Mengupayakan Penyerahan Pulau Kita"
ARG_political_events.32.desc: "Pagi ini kami menerima kabar dari duta besar [ARG.GetAdjective] di [ENG.Capital.GetCapitalVictoryPointName] bahwa pemerintah [ARG.GetAdjective] telah resmi menduduki kepulauan Falkland dan Georgia Selatan. Oleh karena itu, mereka meminta agar kami menyerahkan wilayah tersebut kepada mereka dan mengakhiri perang ini."
ARG_political_events.32.a: "Terima persyaratan mereka. Kita mempunyai ancaman yang lebih besar untuk dihadapi."
ARG_political_events.32.b: "Kami tidak akan pernah menyerahkan pulau-pulau itu!"
ARG_political_events.33.t: "[ENG.GetNameDefCap] Setuju untuk Menyerahkan Kepulauan"
ARG_political_events.33.desc: "Saat ini kepulauan Falkland dan Georgia Selatan akhirnya jatuh ke tangan [ARG.GetAdjective]. [ENG.GetNameDefCap] telah menandatangani keduanya dengan imbalan perdamaian. Itu bisa kami sediakan, apalagi sekarang wilayah [ARG.GetAdjective] yang sah ini akhirnya menjadi milik kami."
ARG_political_events.33.a: "Kemenangan adalah milik Kita!"
ARG_political_events.34.t: "[ENG.GetNameDefCap] Menolak Menyerah"
ARG_political_events.34.desc: "[ENG.GetAdjective] dengan keras kepala menolak menyerahkan kepulauan Falkland dan Georgia Selatan kepada kami. Tampaknya meski kalah, mereka ingin melanjutkan pertumpahan darah. Itu adalah hak prerogatif mereka. Kami akan mendorong mereka kembali ke [ENG.Capital.GetCapitalVictoryPointName] jika perlu."
ARG_political_events.34.a: "Perang berlanjut"
ARG_political_events.35.t: "[ENG.GetNameDefCap] Penawaran untuk Menyerahkan Pulau"
ARG_political_events.35.desc: "Seorang duta besar [ENG.GetAdjective] mendekati kami hari ini dengan tawaran untuk menyerahkan kepulauan Atlantik Selatan kepada kami jika kami dapat menjamin berakhirnya perang ini. Karena tujuan kami adalah merebut kepulauan Falkland dan Georgia Selatan, hal ini akan menguntungkan kami."
ARG_political_events.35.a: "Kami mendapatkan apa yang kami inginkan. Tanda tangani perjanjian itu."
ARG_political_events.35.b: "Kami akan membawa perang ini ke [ENG.Capital.GetCapitalVictoryPointName]!"
ARG_political_events.36.t: "[ARG.GetNameDefCap] Setuju Perdamaian"
ARG_political_events.36.desc: "Untungnya, pemerintah [ARG.GetAdjective] telah setuju untuk menghentikan perang berdasarkan ketentuan yang kami tetapkan. Sayang sekali jika kita harus menyerahkan kepulauan Falkland dan Georgia Selatan, namun kita harus memfokuskan kekuatan kita di tempat lain."
ARG_political_events.36.a: "Itu melegakan..."
ARG_political_events.37.t: "[ARG.GetNameDefCap] Menolak Mengakhiri Permusuhan"
ARG_political_events.37.desc: "Berita buruk. Pemerintah [ARG.GetAdjective] telah menolak tawaran kami untuk menyerahkan pulau-pulau tersebut dengan imbalan perdamaian. Kita harus bersiap untuk pertempuran lebih lanjut, dan sekarang kita harus mengerahkan sumber daya kita untuk bertahan di front lain."
ARG_political_events.37.a: "Beraninya mereka!"
ARG_political_events.38.t: "[ARG.GetNameDef] Menuntut Guinea Khatulistiwa sebagai Kompensasi"
ARG_political_events.38.desc: "Kepemimpinan [ARG.GetNameDefCap] telah menghubungi kami dan menuntut agar kami menyerahkan kendali atas tanah kami di Guinea Khatulistiwa sebagai imbalan atas dukungan mereka selama perang melawan Partai Republik baru-baru ini. Kita mungkin ingin mempertimbangkan pilihan kita dengan hati-hati."
ARG_political_events.38.a: "Tentu saja tidak."
ARG_political_events.38.a.tt: "Ini mungkin merusak hubungan kita dengan §Y[ARG.GetName]§!..."
ARG_political_events.38.b: "Sebuah harga kecil yang harus dibayar untuk apa yang telah kita menangkan"
ARG_political_events.38.b.tt: "Transfer §YEquatorial Guinea§! ke §Y[ARG.GetName]§!"
ARG_political_events.39.t: "[SPA.GetNameDefCap] Menolak Permintaan Kami"
ARG_political_events.39.desc: "Tuntutan kami ditanggapi dengan penolakan arogan dari [SPA.GetNameDef]. Pimpinan [SPA.GetAdjective] menyatakan bahwa tuntutan kami terlalu tinggi dan tidak sebanding dengan upaya kami selama perang."
ARG_political_events.39.a: "Betapa disayangkan..."
ARG_political_events.40.t: "[SPA.GetNameDefCap] Menyetujui Permintaan Kami"
ARG_political_events.40.desc: "Beberapa kabar baik baru saja sampai kepada kami, [SPA.GetNameDef] telah menyetujui tuntutan kami dan kami telah diberikan kepemilikan atas Guinea Khatulistiwa sebagai imbalan atas bantuan kami dalam perang saudara baru-baru ini."
ARG_political_events.40.a: "Itulah pijakan kami di Afrika!"
ARG_political_events.41.t: "Rodolfo Ghioldi Kembali ke [ARG.GetNameDef]"
ARG_political_events.41.desc: "Pada tahun 1931 Rodolfo Ghioldi melarikan diri [ARG.GetNameDef] setelah nyawanya terancam karena kecenderungan sosialisnya. Sementara itu, ia bekerja untuk mendukung pemberontakan komunis di [BRA.GetNameDef] dalam upaya menggulingkan Getúlio Vargas dari jabatannya di pemerintahan. Kini setelah lanskap politik di [ARG.GetNameDef] lebih mengarah ke kiri, Ghioldi melaporkan bahwa ia merasa nyaman kembali ke negara asalnya untuk mengambil kepemimpinan PCA."
ARG_political_events.41.a: "Ini akan membantu jalan kita menuju Revolusi!"
ARG_political_events.42.t: "[ARG.GetNameDefCap] Menjangkau"
ARG_political_events.42.desc: "Kami telah menerima kabar dari rekan-rekan kami di [ARG.GetNameDef] yang berharap kami dapat mendukung gerakan revolusioner mereka yang sedang berkembang. Jika terjadi perang saudara, mereka ingin kami mengirimkan sukarelawan untuk membantu mereka menggulingkan pemerintah yang berperang."
ARG_political_events.42.a: "Mari kita kirimkan bantuan kepada sesama sosialis."
ARG_political_events.42.b: "Kami tidak dapat mengampuni siapa pun saat ini..."
ARG_political_events.43.t: "[SOV.GetNameDefCap] Setuju Kirim Bantuan"
ARG_political_events.43.desc: "Berita bagus kawan! [SOV.GetNameDefCap] telah setuju untuk mengirimkan pasukan sukarelawan jika terjadi perang saudara saat kami mendeklarasikan revolusi agung kami! Hal ini seharusnya memberi kita ketenangan pikiran jika kejadian seperti itu terjadi."
ARG_political_events.43.a: "Fantastis!"
ARG_political_events.44.t: "[SOV.GetNameDefCap] Menolak Mengirim Bantuan"
ARG_political_events.44.desc: "Berita malang kawan. [SOV.GetNameDefCap] telah menolak mengirimkan pasukan sukarelawan jika terjadi perang saudara di negara kita. Tampaknya jika revolusi kita yang gemilang berubah menjadi kekerasan, maka kita harus berdiri sendiri melawan penindas borjuis kita..."
ARG_political_events.44.a: "Kita berdiri sendiri..."
ARG_political_events.50.t: "Pemogokan Pekerja Kecil di [FROM.FROM.GetName]"
ARG_political_events.50.desc: "Sayangnya tampaknya upaya kami untuk memicu pemogokan pekerja di [FROM.FROM.GetName] tidak berjalan sesuai rencana. Pembicara kami berhasil menarik perhatian beberapa orang saat mereka mulai bekerja. Meskipun kami telah berhasil menarik beberapa orang untuk mendukung tujuan kami, kami masih harus bekerja keras untuk meyakinkan masyarakat agar berbalik melawan kelas atas yang menindas."
ARG_political_events.50.a: "Lain kali akan lebih baik..."
ARG_political_events.51.t: "Pemogokan Pekerja di [FROM.FROM.GetName]"
ARG_political_events.51.desc: "Meskipun terjadi bentrokan dengan para manajer dan agitator fasis, pemogokan pekerja di [FROM.FROM.GetName] berhasil menarik banyak pendukung. Pimpinan PCA menyampaikan berbagai pidato tentang masa depan bangsa tanpa pembagian kelas yang disambut dengan sorak-sorai dan nyanyian dari massa. Cabang partai lokal telah mengumumkan bahwa keanggotaannya telah membengkak sejak rapat umum tersebut."
ARG_political_events.51.a: "Kami mendapatkan daya tarik dari massa."
ARG_political_events.52.t: "Pemogokan Pekerja Besar-besaran di [FROM.FROM.GetName]"
ARG_political_events.52.desc: "Teriakan dan teriakan dari kerumunan pekerja yang marah menyedot gelombang dukungan besar-besaran terhadap PCA. Lantai pabrik dikosongkan, kantor-kantor dibiarkan kosong dan para petani pedesaan berkumpul untuk membela hak-hak mereka dan menunjukkan kemarahan mereka terhadap kelas penguasa. Kabar mengenai pengaruh kami menyebar seiring dengan meningkatnya dukungan terhadap revolusi setiap hari..."
ARG_political_events.52.a: "Segera tujuan kami akan diidealkan!"
ARG_political_events.60.t: "[ARG.GetNameDefCap] mengundang kita ke Fraksi mereka"
ARG_political_events.60.desc: "[ARG.GetNameDefCap] telah menghubungi kami, mengundang kami untuk bergabung dengan serikat komunis mereka. Akankah kita bergandengan tangan dengan saudara-saudara kita yang revolusioner?"
ARG_political_events.60.a: "Mari kita berdiri bersama!"
ARG_political_events.60.b: "Kita harus pergi sendiri."
ARG_political_events.61.t: "[FROM.GetNameDefCap] menerima proposal kami"
ARG_political_events.61.desc: "[FROM.GetNameDefCap] telah dengan baik hati memutuskan untuk menerima proposal kami untuk bergabung dengan serikat kami, dan sekarang kami berdiri bersama dalam catatan sejarah."
ARG_political_events.61.a: "Bersama-sama kita akan menjunjung cita-cita Revolusi."
ARG_political_events.62.t: "[FROM.GetNameDefCap] menolak usulan kami"
ARG_political_events.62.desc: "[FROM.GetNameDefCap] telah menolak tawaran kami untuk bergabung bersama sebagai persatuan republik sosialis. Tidakkah mereka menyadari siapa yang memegang kekuasaan di benua ini? Mungkin pada waktunya, kami akan menunjukkannya kepada mereka."
ARG_political_events.62.a: "Mari kita tunggu waktu kita..."
ARG_political_events.70.t: "Konferensi Buenos Aires Dimulai"
ARG_political_events.70.desc: "Pada akhirnya, pemerintahan komunis kita yang baru telah mencapai tingkat stabilitas yang memungkinkan kita membuka Konferensi Buenos Aires yang pertama. Di sinilah kita dapat memutuskan masa depan PCA dan siapa yang mungkin layak memimpin negara ini di tahun-tahun mendatang. Tahun ini, kami memiliki dua kandidat kuat dengan ide berbeda untuk masa depan [ARG.GetNameDef]. Pemimpin kita saat ini, Fanny Edelman, akan melanjutkan status quo, menawarkan stabilitas dan fokus pada [ARG.GetNameDef] di panggung dunia. Antonio Soto di sisi lain, adalah mantan pemberontak Patagonian, yang percaya bahwa kita harus berupaya membuat [ARG.GetNameDef] mengikuti jalur Anarko-Sindikalisme. Siapa yang harus mengambil alih jabatan sebagai perdana menteri [ARG.GetNameDef]?"
ARG_political_events.70.a: "Fanny Edelman harus tetap berkuasa."
ARG_political_events.70.b: "Antonio Soto adalah pilihan yang jauh lebih baik."
ARG_political_events.71.t: "Fanny Edelman Tetap Menjadi Perdana Menteri"
ARG_political_events.71.desc: "Dengan keputusan telak, Fanny Edelman mampu mempertahankan kendali posisinya di pemerintahan. Tampaknya jalur yang diinginkan untuk [ARG.GetNameDef] adalah jalur yang didasarkan pada stabilitas dan pertumbuhan. Kandidat saingannya Antonio Soto telah kembali ke Patagonia dan setuju untuk mengikuti rencana Edelman untuk saat ini."
ARG_political_events.71.a: "Selamat datang kembali Perdana Menteri Edelman!"
ARG_political_events.72.t: "Antonio Soto Mendirikan Anarko-Sindikalisme Argentina"
ARG_political_events.72.desc: "Di luar dugaan, Antonio Soto berhasil memenangkan konferensi tersebut dan telah ditetapkan sebagai pemimpin baru di [ARG.GetNameDef], sebuah gelar yang sangat ingin ia lihat dibubarkan pada waktunya. Soto ingin membawa negara ini ke jalur baru, mengikuti cara Anarko-Sindikalisme dan pada akhirnya menghapuskan segala bentuk hierarki di dalam negeri."
ARG_political_events.72.a: "Masa depan yang tidak mudah, namun baru."
ARG_political_events.80.t: "Hibah Pendidikan yang Diperkuat"
ARG_political_events.80.desc: "Salah satu kebijakan terpenting di bawah pemerintahan yang baru terpilih adalah masa depan pendidikan di [ARG.GetNameDef]. Bukan rahasia lagi bahwa pendanaan kita untuk dunia akademis akhir-akhir ini masih kurang, sehingga terserah kepada kita untuk memutuskan ke mana kita ingin menyalurkan dana hibah dan pada akhirnya, apa yang akan menjadi fokus pengembangan sistem sekolah kita."
ARG_political_events.80.a: "Mendanai pendidikan elektronik."
ARG_political_events.80.b: "Mendanai pendidikan industri."
ARG_political_events.80.c: "Mendanai penelitian sintetik."
ARG_political_events.81.t: "Hibah Pendidikan Elektronika"
ARG_political_events.81.desc: "Saat kami membuka dana hibah pendidikan terbaru, kami mendapat pujian besar dari para akademisi di seluruh negeri. Karena kami telah memilih untuk berfokus pada mendidik masyarakat tentang keajaiban teknologi elektronik, kami dapat mengharapkan kemajuan yang stabil dalam departemen penelitian kami."
ARG_political_events.81.a: "Uang dibelanjakan dengan baik."
ARG_political_events.82.t: "Hibah Pendidikan Industri"
ARG_political_events.82.desc: "Saat kami membuka dana hibah pendidikan terbaru, kami mendapat pujian besar dari para akademisi di seluruh negeri. Karena kami memilih untuk berfokus pada mendidik masyarakat mengenai efisiensi pengembangan industri baru, kami dapat mengharapkan kemajuan yang stabil dalam departemen penelitian kami."
ARG_political_events.82.a: "Uang dibelanjakan dengan baik."
ARG_political_events.83.t: "Hibah Penelitian Sintetis"
ARG_political_events.83.desc: "Saat kami membuka dana hibah pendidikan terbaru, kami mendapat pujian besar dari para akademisi di seluruh negeri. Karena kami telah memilih untuk berfokus pada mendidik masyarakat mengenai penyempurnaan sintetis modern, kami dapat mengharapkan kemajuan yang stabil dalam departemen penelitian kami."
ARG_political_events.83.a: "Uang dibelanjakan dengan baik."
ARG_political_events.90.t: "Latihan Militer Gabungan dengan [ARG.GetNameDef]"
ARG_political_events.90.desc: "Dalam upaya untuk meningkatkan hubungan mereka dengan kami, [ARG.GetLeader] dari [ARG.GetNameDef] menawarkan untuk menjadi tuan rumah latihan militer gabungan untuk melatih angkatan laut dan udara kami. Sikap hangat ini sangat disambut baik di hari-hari yang gelap ini."
ARG_political_events.90.a: "Kekuatan kita berdiri lebih kuat dari sebelumnya."
ARG_political_events.100.t: "[ARG.GetNameDefCap] mengundang kita ke Fraksi mereka"
ARG_political_events.100.desc: "[ARG.GetNameDefCap] telah menghubungi kami, mengundang kami untuk bergabung dengan aliansi mereka. Akankah kita bergandengan tangan dan membantu melindungi demokrasi di benua Amerika Selatan?"
ARG_political_events.100.a: "Mari kita berdiri bersama!"
ARG_political_events.100.b: "Kita harus melakukannya sendiri."
ARG_political_events.101.t: "[FROM.GetNameDefCap] menerima proposal kami"
ARG_political_events.101.desc: "[FROM.GetNameDefCap] dengan senang hati memutuskan untuk menerima usulan kami untuk bergabung dengan aliansi kami, dan sekarang kami berdiri bersama sebagai benteng perdamaian dan demokrasi di Amerika Selatan."
ARG_political_events.101.a: "Bersama-sama kita akan mempertahankan garis dan melindungi rakyat kita!"
ARG_political_events.102.t: "[FROM.GetNameDefCap] menolak usulan kami"
ARG_political_events.102.desc: "[FROM.GetNameDefCap] telah menolak tawaran kami untuk bergabung dengan aliansi kami. Tidakkah mereka menyadari bahwa bersama-sama kita lebih kuat? Mari kita berharap mereka tidak menyesali hari ketika mereka menolak kita."
ARG_political_events.102.a: "Mungkin lain kali..."
ARG_political_events.110.t: "[FROM.GetNameDefCap] Melakukan Gerakan Agresif di [URG.GetNameDef]"
ARG_political_events.110.desc: "Tampaknya ketakutan kami menjadi kenyataan karena [FROM.GetNameDef] mengambil sikap agresif terhadap [URG.GetNameDef]. Karena mereka adalah tetangga dekat kita, kita tidak bisa mengambil risiko kehilangan mereka karena agresi asing. Jika kita tidak hati-hati, maka [FROM.GetNameDef] malah akan mengetuk pintu kita."
ARG_political_events.110.a: "Kita harus meningkatkan ini!"
ARG_political_events.110.b: "Terlalu berisiko untuk mengambil tindakan..."
ARG_political_events.111.t: "[FROM.GetNameDefCap] Permintaan yang kami Tarik dari [URG.GetNameDef]"
ARG_political_events.111.desc: "Menanggapi operasi kami di [URG.GetNameDef], [FROM.GetNameDef] telah meminta agar kami segera menarik pasukan kami dan mengakhiri permusuhan. Jika kami menolak, ada risiko hal ini akan meningkat menjadi perang habis-habisan dengan [FROM.GetNameDef]."
ARG_political_events.111.a: "Biarkan mereka datang!"
ARG_political_events.111.b: "Kami tidak punya pilihan selain mundur."
ARG_political_events.120.t: "Pengunjung Aneh"
ARG_political_events.120.desc: "Pagi ini, seorang pria Jerman asing yang berbicara bahasa Spanyol yang meragukan masuk ke La Casa Rosada sambil berseru bahwa dia punya rencana besar untuk masa depan [ARG.GetNameDef]. Tampaknya dia mempunyai kualifikasi untuk pekerjaan itu, dan sangat meyakinkan. Akankah kita menyerahkan pemerintahan kepadanya?"
ARG_political_events.120.a: "Iya! apa yang bisa salah?"
ARG_political_events.120.b: "Tentu saja tidak."
ARG_news_events.1.t: "[ARG.GetNonIdeologyName] Terlibat dalam Kebijakan Luar Negeri yang Agresif"
ARG_news_events.1.d: "Akhir-akhir ini pemerintah [ARG.GetAdjective] mengambil sikap yang semakin agresif dan tegas terhadap isu-isu kebijakan luar negeri. Ketika dekade yang terkenal ini berakhir dengan pergantian rezim yang begitu cepat, nampaknya [ARG.GetNonIdeologyName] mempersiapkan diri untuk kemungkinan ekspansi. Pagi ini, pemimpin [ARG.GetAdjective] [ARG.GetLeader], berbicara kepada bangsa dan meyakinkan masyarakat bahwa era kebesaran sudah tiba, dengan tujuan menyatukan Amerika Selatan di bawah satu bendera yang kuat dan stabil."
ARG_news_events.1.a: "Ini semua hanya retorika, bukan?"
ARG_political_events.73.t: "[FROM.GetNameDefCap] Mengupayakan Kerja Sama Yang Lebih Dekat"
ARG_political_events.73.desc: "[ARG.GetAdjective] diplomat baru saja menghubungi kami untuk meminta kerja sama yang lebih erat menyusul kesepakatan perdagangan kami baru-baru ini dengan mereka serta ideologi mereka yang semakin mirip dengan kami. Permintaan saat ini adalah agar pakta non-agresi ditandatangani antara negara kita serta jaminan kemerdekaan mereka."
ARG_political_events.73.a: "Kami salut terhadap aspirasi mereka, tentu saja mereka mempunyai perjanjian dan jaminan!"
ARG_political_events.73.b: "Kita bisa menawarkan mereka pakta non-agresi, tapi tidak lebih."
ARG_political_events.73.c: "Ini memakan waktu agak jauh."
ARG_political_events.74.t: "[FROM.GetNameDefCap] Setuju untuk Menjamin Kemerdekaan dan Pakta Non-Agresi"
ARG_political_events.74.desc: "Kami baru saja menerima tanggapan dari [FROM.GetNameDef]. Mereka memuji upaya kami baru-baru ini untuk mengubah keadaan negara kami dan kembali ke demokrasi, dan mereka telah memilih untuk menyetujui permintaan kami. Dengan ini, negara ini telah diperkuat dan kemungkinan terjadinya perang yang dinyatakan kepada kita seharusnya berkurang secara signifikan."
ARG_political_events.74.a: "Fantastis!"
ARG_political_events.74.tt: "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! kini menjamin kemerdekaan kita!\nKami telah menandatangani §YPakta Non-Agresi§! dengan [FROM.GetFlag]§Y[FROM.GetNameDefCap]§!!"
ARG_political_events.75.t: "[FROM.GetNameDefCap] Menyetujui Pakta Non-Agresi"
ARG_political_events.75.desc: "Kami baru saja menerima tanggapan dari [FROM.GetNameDef]. Mereka memuji upaya kami baru-baru ini untuk membalikkan keadaan dan kembali ke demokrasi, mereka telah memilih untuk menyetujui permintaan kami, namun hanya sebagian saja. Pakta non-agresi telah ditandatangani tetapi sayangnya pakta tersebut tidak menjamin kemerdekaan kita untuk saat ini."
ARG_political_events.75.a: "Lebih baik daripada tidak sama sekali..."
ARG_political_events.75.tt: "Kami telah menandatangani §YPakta Non-Agresi§! dengan [FROM.GetFlag]§Y[FROM.GetNameDefCap]§!!"
ARG_political_events.76.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami untuk Kerjasama Lebih Dekat"
ARG_political_events.76.desc: "Kami baru saja menerima tanggapan dari [FROM.GetNameDef]. Mereka memuji upaya kami untuk membangun kembali demokrasi, namun tidak menganggap bahwa menjamin kemerdekaan kami adalah hal yang bermanfaat, dan juga tidak memiliki perjanjian non-agresi dengan kami."
ARG_political_events.76.a: "Sangat disayangkan."
ARG_news_events.2.t: "Pertempuran Lempeng Sungai"
ARG_news_events.2.d: "Pagi ini Kapal Penjelajah Berat Kriegsmarine 'Laksamana Graf Spee' menyerang skuadron Angkatan Laut Kerajaan di lepas Sungai Plate di Samudera Atlantik Selatan. Dalam pertempuran berikutnya, sejumlah kapal [ENG.GetAdjective] rusak parah dan terpaksa mundur, menuju kepulauan Falkland. 'Graf Spee' di sisi lain mengalami kerusakan minimal kecuali tembakan kritis yang melumpuhkan sistem bahan bakarnya. Kapal [GER.GetAdjective] melarikan diri ke pelabuhan Montevideo pada [URG.GetNameDef] untuk melakukan perbaikan segera. Banyak sumber yang mengklaim bahwa ini adalah pertempuran laut pertama dalam konflik ini, dan tampaknya perang tersebut akhirnya mencapai benua Amerika Selatan."
ARG_news_events.2.a: "Mari kita berharap [ENG.GetAdjective] juga melarikan diri."
ARG_news_events.2.b: "[GER.GetAdjective] tidak punya hak untuk berada di sini."
ARG_news_events.2.c: "Berita yang meresahkan."
ARG_news_events.3.t: "[ARG.GetAdjective] Revolusi Komunis"
ARG_news_events.3.d: "Gejolak yang sedang berlangsung di [ARG.GetNonIdeologyName] semakin tidak terkendali dalam beberapa hari terakhir, yang berujung pada perang saudara. Dipimpin oleh Rodolfo Ghioldi yang pernah diasingkan dan didukung oleh banyak anggota kongres [ARG.GetAdjective] yang berhaluan kiri, komunis kini telah memisahkan diri dari pemerintah dalam upaya untuk merebut kendali dan melakukan perubahan radikal di seluruh negeri. Banyak orang di kawasan ini khawatir bahwa [ARG.GetNonIdeologyName] komunis akan memicu efek domino di seluruh benua Amerika Selatan."
ARG_news_events.3.a: "Sebuah tragedi yang sampai pada titik ini."
#GUAY
JUNO_guay_events.1.t: "Petugas mendukung pemerintah"
JUNO_guay_events.1.desc: "Para perwira militer telah menyuarakan dukungan mereka terhadap pemerintah yang berkuasa. Strategi peredaan ini berhasil, dan sepertinya dana yang disalurkan ke pihak militer memberikan manfaat tambahan."
JUNO_guay_events.1.a: "Bagus"
JUNO_guay_events.2.t: "[FROM.GetNameDefCap] ingin kita berinvestasi dalam pembangunan bendungan."
JUNO_guay_events.2.desc: "[FROM.GetName] berupaya melakukan industrialisasi. Sebagai negara yang memiliki banyak sungai, bendungan merupakan kandidat yang jelas untuk elektrifikasi. Jika kita memutuskan untuk berinvestasi, kita dapat mengharapkan pembayaran dalam waktu 2 tahun."
JUNO_guay_events.2.a: "Investasi yang bagus"
JUNO_guay_events.2.tt: "[FROM.GetName] harus membayar kembali kepada kami dalam 2 tahun, kecuali mereka atau kami berperang satu sama lain."
JUNO_guay_events.2.b: "Tidak tertarik"
JUNO_guay_events.3.t: "[FROM.GetName] Menerima!"
JUNO_guay_events.3.desc: "[FROM.GetName] telah menerima investasi ke negara kita. Ini pasti akan mendekatkan kita!"
JUNO_guay_events.3.a: "Hebat!"
JUNO_guay_events.4.t: "[FROM.GetName] Menolak!"
JUNO_guay_events.4.desc: "[FROM.GetName] telah menolak gagasan berinvestasi di negara kita. Hal ini tidak dapat dilihat sebagai kegagalan diplomasi."
JUNO_guay_events.4.a: "Sebuah kemunduran yang pasti."
JUNO_guay_events.5.t: "Pembayaran Kembali Investasi Bendungan"
JUNO_guay_events.5.desc: "Waktunya untuk melunasi hutang kita kepada [?var:old_world_power.GetName] telah tiba. Meskipun hal ini akan merugikan perekonomian kita untuk sementara waktu, seperti yang dikatakan oleh ekonom mana pun yang baik, utang tidak selalu buruk jika diinvestasikan, dan itulah yang telah kita lakukan."
JUNO_guay_events.5.a: "Semuanya ada iurannya."
JUNO_guay_events.6.t: "[FROM.GetAdjective] Kemajuan Militer"
JUNO_guay_events.6.desc: "Tentara [FROM.GetAdjective], meskipun ukurannya lebih kecil, telah memperoleh keuntungan teritorial dan militer yang signifikan atas pasukan kita sendiri. Wilayah yang disengketakan kini sepenuhnya berada di tangan [FROM.GetName], sehingga secara drastis menurunkan legitimasi kami atas wilayah tersebut. Kita harus memilih antara melanjutkan perang ini, yang pasti akan melemahkan semangat pasukan kita, atau menyerahkan wilayah yang hilang dari kita."
JUNO_guay_events.6.a: "Kita tidak bisa melanjutkan perang yang sia-sia ini."
JUNO_guay_events.6.b: "Wilayah ini adalah hak kami"
JUNO_guay_events.7.t: "[FROM.GetName] Lipatan"
JUNO_guay_events.7.desc: "Pasukan kita yang menang telah mengusir musuh-musuh kita dari wilayah yang sah. [FROM.GetName] telah memutuskan untuk melipatgandakan dan memberi kami wilayah alih-alih kalah dalam pertempuran. Sebuah kemenangan bergengsi bagi kami, sedikit yang mereka sadari bahwa itu hanyalah permulaan."
JUNO_guay_events.7.a: "Selangkah lebih dekat ke dominasi."
JUNO_guay_events.7.b: "Sebenarnya ini berjalan cukup baik, mari kita lanjutkan"
JUNO_guay_events.8.t: "[FROM.GetName] Menolak Membungkuk"
JUNO_guay_events.8.desc: "[FROM.GetName] telah memberi tahu kami bahwa merupakan suatu penghinaan jika mereka melepaskan kendali atas wilayah inti mereka. Mereka memberi tahu kami bahwa mereka akan terus berperang sampai pemerintahan kami digulingkan dan tentara kami dibubarkan."
JUNO_guay_events.8.a: "Mari kita akhiri sandiwara ini"
JUNO_guay_events.9.t: "[FROM.GetName] Membayar Investasi Bendungan"
JUNO_guay_events.9.desc: "[FROM.GetName] telah melunasi utangnya dari investasi kami pada infrastruktur mereka. Menghormati perjanjian ini telah mendekatkan kedua negara."
JUNO_guay_events.9.a: "Sebuah keuntungan besar."
JUNO_guay_events.10.t: "[FROM.GetNameDef] Memutuskan untuk Melanjutkan Penyerangan"
JUNO_guay_events.10.desc: "[FROM.GetNameDefCap] telah memberi tahu kami bahwa tidak akan ada perdamaian. Jelas bahwa [FROM.Getname] bermaksud untuk mencaplok negara kita sepenuhnya. Ini adalah perang total, sampai orang terakhir yang bertahan."
JUNO_guay_events.10.a: "Kalau begitu sampai mati."
TOA_ven_blockade.1.t: "[FROM.GetName] memblokade pengiriman minyak"
TOA_ven_blockade.1.desc: "[FROM.GetName] telah menempatkan kapal perang di luar pantai kita dalam upaya memblokade pengiriman minyak menuju lawan mereka. Pemerintah [FROM.GetAdjective] menyatakan bahwa mereka tidak mencari konflik langsung, melainkan sebagai upaya untuk memberikan tekanan pada musuhnya. Hal ini tentu saja merupakan peningkatan eskalasi, dan meskipun tidak ada korban jiwa, namun kehadiran kapal perang di wilayah tersebut telah memperburuk suasana di Caracas."
TOA_ven_blockade.1.a: "Kami tidak bisa melawan [FROM.GetName]"
TOA_ven_blockade.1.b: "Ini adalah deklarasi perang!"
TOA_ven_blockade.2.t: "$TOA_ven_blockade.1.t$"
TOA_ven_blockade.2.desc: "[FROM.GetName] telah mengambil langkah berani dan keterlaluan untuk memblokade sepenuhnya [Ven.GetName]. Kapal Perang Modal telah terlihat di luar Caracas dan pemerintah [VEN.GetAdjective] seharusnya telah diberitahu bahwa blokade penuh telah diberlakukan untuk menghentikan perdagangan minyak antar negara kita."
TOA_ven_blockade.2.a: "Sebuah pelanggaran yang jelas terhadap netralitas!"
paraguay.1.t: "Peluang Peningkatan Pengeluaran Benteng"
paraguay.1.desc: "Membangun kembali Humaitá telah memberi kita kesempatan untuk meningkatkan belanja pertahanan dan menambah benteng tambahan di daerah sekitarnya, termasuk benteng yang lebih kecil untuk lebih mempertahankan saluran masuk sungai ke Ibu Kota."
paraguay.1.a: "Ide bagus"
paraguay.1.b: "Itu tidak ada dalam anggaran"
paraguay.1.tt: "Ketika §Y$PAR_rebuild_humaita$§! selesai tambahkan tambahan:"
south_american_events.60.t: "[MEX.GetNameDefCap] Menimbulkan Sentimen Komunis"
south_american_events.60.desc: "Komunis dari [MEX.GetNameDef] terlihat menghasut demonstrasi di dalam perbatasan kita. Bagaimana sebaiknya kita menyikapi hal ini?"
south_american_events.60.a: "Biarkan mereka melanjutkan."
south_american_events.60.b: "Hancurkan para agitator sosialis ini!"
south_american_events.61.t: "Pertempuran Lempeng Sungai"
south_american_events.61.desc: "Kriegsmarine dan angkatan laut Kerajaan telah terlibat satu sama lain di luar Montevideo dalam pertempuran sengit. Kapal [GER.GetAdjective], rusak parah, berlabuh sekitar pukul 00.10 di pelabuhan kami, meminta perbaikan sementara diplomat Inggris menekan kami untuk memaksa kapal tersebut melaut, yang pasti akan dihancurkan oleh Angkatan Laut Kerajaan."
south_american_events.61.a: "Minta agar ia meninggalkan pelabuhan kami"
south_american_events.61.b: "Biarkan tetap di pelabuhan dan diperbaiki"
south_american_events.62.t: "Pertempuran Lempeng Sungai"
south_american_events.62.desc: "Sekitar pukul 06:18 Kapal Kriegsmarine dan Royal Navy saling bertempur di luar Montevideo. Laporan menyebutkan kapal-kapal Jerman rusak berat dan berlindung di pelabuhan ibu kota Uruguay. Para diplomat Inggris mendesak pemerintah Uruguay untuk memaksa kapal tersebut keluar dari pelabuhan sesuai dengan konvensi Den Haag, di mana kapal tersebut pasti dapat dihancurkan dengan menunggu pasukan Angkatan Laut Kerajaan."
south_american_events.62.a: "Menarik"
south_american_news.20.t: "Antilles Bersatu"
south_american_news.20.d: "Konfederasi Antilla adalah gagasan kuat Ramón Emeterio Betances tentang perlunya penduduk asli Karibia untuk bersatu menjadi entitas regional yang berupaya menjaga kedaulatan dan kesejahteraan negara-negara Antilla. Dukungan paling kuat terjadi sejak tahun 1850-an hingga Perang Spanyol-Amerika, dan sejak itu sebagian besar telah memudar. Namun setelah penyatuan wilayah tersebut oleh [FROM.GetLeader], ide tersebut kembali muncul, dan sekarang, dengan dideklarasikannya Konfederasi Antillen, semakin jelas bahwa Antillen memang milik Antillen!"
south_american_news.20.a: "Ide yang Terkutuk"
south_american_news.20.b: "Antillen untuk Antillen!"
south_american_events.63.t: "[MEX.GetNameDefCap] Menimbulkan Sentimen Fasis"
south_american_events.63.desc: "Fasis dari [MEX.GetNameDef] terlihat menghasut demonstrasi di dalam perbatasan kita. Bagaimana sebaiknya kita menyikapi hal ini?"
south_american_events.63.a: "Biarkan mereka melanjutkan."
south_american_events.63.b: "Hancurkan para agitator fasis ini!"
