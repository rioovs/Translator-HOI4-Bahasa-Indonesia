 sp_air_scientist_xp_generic_reward_desc: "Ilmuwan kami telah membuat beberapa penemuan baru selama pengerjaan prototipe terbaru."
 sp_air_scientist_xp_generic_reward_option: "Itu bagus"
 sp_air_political_interference_generic_reward: "Intervensi Politik"
 sp_air_political_interference_generic_reward_desc: "Politisi yang mencoba-coba hal yang tidak seharusnya menyebabkan proyek terpaksa mengulang hal-hal yang sudah dilakukan, karena alasan yang tidak masuk akal bagi siapa pun."
