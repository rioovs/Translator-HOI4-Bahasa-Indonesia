 # Nuclear Projects
 sp_nuclear_project_events.1.t: "Kebocoran Informasi"
 sp_nuclear_project_events.1.desc: "Meskipun sepenuhnya kebetulan, agen kami di [FROM.GetNameDef] telah berhasil memperoleh informasi tentang proyek rahasia. Seorang pekerja yang terlibat dalam pengembangan senjata rahasia, bom atom, berbicara tentang pekerjaannya di sebuah pertemuan sosial kecil yang juga dihadiri oleh salah satu agen kami."
 sp_nuclear_project_events.1.a: "Hal ini terbukti bermanfaat"
 ### OLD DEPRECATED STRINGS (Already translated)
 sp_land_generic_reward_scientist_xp_1_desc: "[Character.GetName] telah mencapai terobosan, mempercepat kemajuan dan memantapkan peran [Character.GetHerHis] sebagai pelopor persenjataan canggih. Dengan setiap penemuan, penguasaan teknik [Character.GetHerHis] tumbuh, membentuk masa depan teknologi militer."
 sp_land_generic_reward_option_scientist_xp: "Pengetahuan adalah Kekuatan!"
 sp_land_generic_reward_option_scientist_xp_desc: "[Character.GetName] mencapai terobosan, mempercepat kemajuan dan memantapkan peran [Character.GetHerHis] sebagai pelopor persenjataan canggih."
 sp_land_generic_reward_army_xp_1_desc: "[Character.GetName] telah bertemu dengan sekelompok perwira militer terpilih untuk membahas potensi [SpecialProject.GetName], mendapatkan wawasan penting dalam penggunaan teknologi baru untuk peperangan darat. Kolaborasi mereka telah meningkatkan kemampuan militer kita, memastikan kesiapan untuk pertempuran di masa depan."
 sp_land_generic_reward_option_army_xp_desc: "[Character.GetName] bertemu dengan sekelompok perwira militer terpilih untuk mendiskusikan potensi [SpecialProject.GetName], mendapatkan wawasan penting dalam penggunaan teknologi baru untuk peperangan darat. Kolaborasi mereka meningkatkan kemampuan militer kita, memastikan kesiapan untuk pertempuran di masa depan."
 sp_land_generic_reward_major_progress_1_desc: "[Character.GetName] telah mencapai terobosan besar, mendorong kemajuan proyek secara signifikan, memvalidasi keahlian [Character.GetHerHis] dan memberi energi pada tim peneliti. Dengan kemajuan ini, proyek ini semakin mendekati tujuannya, mengukuhkan warisan [Character.GetName] sebagai pelopor."
 sp_land_generic_reward_option_major_breakthrough_desc: "[Character.GetName] mencapai terobosan besar, mendorong kemajuan proyek secara signifikan, memvalidasi keahlian [Character.GetHerHis] dan memberi energi pada tim peneliti. Dengan kemajuan ini, proyek ini semakin mendekati tujuannya, mengukuhkan warisan [Character.GetName] sebagai pelopor."
 sp_land_generic_reward_test_failure_1_desc: "Kemunduran kecil telah terjadi selama pengujian, mengungkapkan kelemahan tak terduga pada prototipe [Character.GetName]. Cegukan ini mendorong evaluasi ulang pendekatan dan penyempurnaan teknik. Meskipun kemajuan yang dicapai tertunda untuk sementara waktu, pembelajaran ini berkontribusi pada proyek yang lebih kuat dan tangguh dalam jangka panjang."
 sp_land_generic_reward_option_test_failure_desc: "Kemunduran kecil terjadi selama pengujian, mengungkapkan kelemahan tak terduga pada prototipe [Character.GetName]. Kendala ini mendorong evaluasi ulang pendekatan dan penyempurnaan teknik. Meskipun kemajuannya tertunda untuk sementara, pembelajaran ini berkontribusi pada proyek yang lebih kuat dan tangguh dalam jangka panjang."
 sp_land_generic_reward_armor_tech_1_desc: "Perkembangan terkini dalam proyek [SpecialProject.GetName], yang dipimpin oleh [Character.GetName], telah memungkinkan kemajuan signifikan di bidang terkait. Terobosan-terobosan ini merevolusi kemampuan militer, membuka jalan bagi strategi perang darat yang lebih efektif dan tangguh."
 sp_land_generic_reward_option_armor_tech_desc: "Perkembangan terkini dalam proyek [SpecialProject.GetName], yang dipimpin oleh [Character.GetName], memungkinkan kemajuan signifikan di bidang terkait. Terobosan-terobosan ini merevolusi kemampuan militer, membuka jalan bagi strategi perang darat yang lebih efektif dan tangguh."
 sp_land_generic_reward_armor_bonus_1_desc: "Menjadi ujung tombak penelitian mutakhir, [Character.GetName] mengungkap penemuan inovatif dalam paduan baru yang dirancang untuk merevolusi lapis baja tank. Temuan ini menjanjikan kemajuan signifikan dalam peperangan lapis baja, dan menunjukkan peran penting ilmuwan dalam membentuk masa depan peperangan lapis baja."
 sp_land_generic_reward_option_armor_bonus_desc: "Integrasikan paduan baru ini ke dalam lini produksi kami."
 sp_land_generic_reward_engine_bonus_1_desc: "Perubahan terbaru pada mesin eksperimental untuk prototipe [SpecialProject.GetName] telah menghasilkan peningkatan yang signifikan pada kinerja mesin tangki secara keseluruhan. Kerja teliti tim [Character.GetName] dan [Character.GetHerHis] telah melampaui batas-batas teknik, menjanjikan peningkatan kemampuan jika kami menerapkan inovasi ini ke dalam mesin tangki reguler kami."
 sp_land_generic_reward_option_engine_bonus_desc: "Mulailah memproduksi mesin yang ditingkatkan ini!"
 sp_land_generic_reward_resource_scarcity_desc: "Tim [Character.GetName] menghadapi kekurangan bahan penting untuk pengembangan proyek [SpecialProject.GetName], memaksa [Character.GetHerHim] mencari sumber alternatif dan mengembangkan metode manufaktur baru untuk memenuhi permintaan."
 sp_land_generic_reward_option_resource_scarcity_desc: "Tim [Character.GetName] menghadapi kekurangan bahan penting untuk pengembangan proyek [SpecialProject.GetName], memaksa [Character.GetHerHim] mencari sumber alternatif dan mengembangkan metode manufaktur baru untuk memenuhi permintaan."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc: "Meriam [SpecialProject.GetName] baru saja berhasil menyelesaikan uji tembak bersejarah, menunjukkan jangkauan dan akurasinya yang mengesankan. Pencapaian ini telah meningkatkan semangat tim peneliti dan menarik perhatian para pejabat tinggi, memberikan momentum bagi proyek tersebut dan memperbarui optimisme atas keberhasilannya."
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc: "Meriam [SpecialProject.GetName] berhasil menyelesaikan uji tembak bersejarah, menunjukkan jangkauan dan akurasinya yang mengesankan. Pencapaian ini meningkatkan semangat tim peneliti dan menarik perhatian pejabat tinggi, memberikan momentum bagi proyek dan memperbarui optimisme atas keberhasilannya."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc: "Selama uji coba penting, ledakan dahsyat mengguncang lokasi pengujian, meledakkan meriam dan menyebabkan kerusakan signifikan pada infrastruktur di sekitarnya. Tim [Character.GetName] sedang menyelidiki penyebab ledakan dan menangani dampak dari insiden tersebut, termasuk pengawasan publik dan potensi kemunduran dalam jadwal proyek."
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc: "Selama uji coba penting, ledakan dahsyat mengguncang lokasi pengujian, meledakkan meriam dan menyebabkan kerusakan signifikan pada infrastruktur di sekitarnya. Tim [Character.GetName] harus menyelidiki penyebab ledakan dan mengelola dampak dari insiden tersebut, termasuk pengawasan publik dan potensi kemunduran dalam jadwal proyek."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "[Character.GetName] telah membuat terobosan penting dalam teknologi propulsi, yang secara signifikan meningkatkan kecepatan dan kekuatan proyektil [SpecialProject.GetName]. Kemajuan ini membuka kemungkinan baru bagi efektivitas senjata di medan perang dan mempercepat kemajuan dalam penyelesaian proyek."
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc: "[Character.GetName] membuat terobosan penting dalam teknologi propulsi, secara signifikan meningkatkan kecepatan dan kekuatan proyektil [SpecialProject.GetName]. Kemajuan ini membuka kemungkinan baru untuk efektivitas senjata di medan perang dan mempercepat kemajuan dalam penyelesaian proyek."
