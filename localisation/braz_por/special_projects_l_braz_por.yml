 sp_land_reward_land_cruiser_chassis: "Kegagalan Stres Sasis"
 sp_land_reward_land_cruiser_chassis_desc: "Selama pengujian tegangan, sasis [SpecialProject.GetName] ditemukan tidak mampu menahan beban yang sangat besar, sehingga menyebabkan deformasi struktural. Tim desain terpecah mengenai apakah akan menambahkan penguatan tambahan, yang selanjutnya akan menambah bobot kendaraan, atau menggunakan bahan yang lebih ringan, yang berpotensi mengurangi daya tahan."
