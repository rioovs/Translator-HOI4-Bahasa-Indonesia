 sp_naval_rocket_launching_submarine_preference_c: "Diam-diam"
 sp_naval_nuclear_missile_submarine_unique_reward_a: "Lolos dari Perburuan"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "Jika informasi tentang rencana serangan nuklir kita sampai ke musuh-musuh kita, mereka akan memulai pencarian besar-besaran terhadap kapal selam rudal nuklir kita. Untuk melarikan diri dari pemburu, kita perlu..."
 sp_naval_nuclear_missile_submarine_preference_a: "Berbaring Rendah"
 sp_naval_nuclear_missile_submarine_preference_b: "Tetap Tenang"
 sp_naval_nuclear_missile_submarine_preference_c: "Bertahan dalam Badai"
 sp_naval_nuclear_torpedo_unique_reward_a: "Kursus Torpedo Baru"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "Dengan torpedo nuklir yang hampir mencapai target akhir proyek, kita harus membidik..."
 sp_naval_nuclear_torpedo_preference_a: "Hulu ledak yang Kuat"
 sp_naval_nuclear_torpedo_preference_b: "Penyimpanan Lebih Aman"
 sp_naval_midget_submarine_unique_reward_a: "Meremas Lebih Banyak"
 sp_naval_midget_submarine_unique_reward_a_desc: "Kami menyadari bahwa kami berpotensi dapat mengkhususkan bagian-bagian kapal selam cebol kami, meskipun hal ini akan memiliki beberapa trade-off."
 sp_naval_midget_submarine_preference_a: "Sedikit Lebih Tersembunyi"
 sp_naval_midget_submarine_preference_b: "Sedikit Lebih Rentan Meledak"
 sp_naval_midget_submarine_preference_c: "Jangkauan Sedikit Lebih Panjang"
 sp_naval_aip_engine_unique_reward_a: "Perbaikan Independen"
 sp_naval_aip_engine_unique_reward_a_desc: "Ilmuwan kami yang mengerjakan teknologi ini, berbagi temuan mereka dengan rekan-rekan mereka, berupaya meningkatkan mesin yang lebih konvensional. Jangan menahan nafas dulu, karena perbaikan yang dihasilkan kemungkinan besar tidak akan menakjubkan."
 sp_naval_aip_engine_preference_a: "Mesin Lebih Tenang"
 sp_naval_aip_engine_preference_b: "Mesin Lebih Cepat"
 sp_naval_aip_engine_preference_c: "Mesin yang Menghabiskan Bahan Bakar Lebih Sedikit"
 sp_naval_anechoic_tiles_unique_reward_a: "Pembelajaran Baru - Konstruksi Lambung Kapal Selam"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "Selama pengembangan ubin anechoic, kami menyadari bahwa kami dapat menyesuaikan temuan kami dengan konstruksi kapal selam konvensional untuk meningkatkan kemampuan siluman kami, atau menghemat sedikit biaya, sambil mempertahankan tingkat visibilitas saat ini."
 sp_naval_anechoic_tiles_preference_a: "Pola Patroli Agresif"
 sp_naval_anechoic_tiles_preference_b: "Tanda Tangan Akustik yang Dikurangi"
 sp_naval_anechoic_tiles_preference_c: "Mengurangi Biaya Lambung Kapal"
 sp_naval_torpedo_cruiser_unique_reward_a: "Kesempatan Kedua - Torpedo Cruiser"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "Dengan dihidupkannya kembali konsep lama Kapal Penjelajah Torpedo, kita perlu membuat keputusan penting tentang perannya dalam armada kita: apakah kita harus fokus pada kekuatannya – torpedo; atau haruskah kita mengatasi kelemahan utama mereka – melawan Destroyer?"
 sp_naval_torpedo_cruiser_preference_a: "Kekuatan - Torpedo"
 sp_naval_torpedo_cruiser_preference_b: "Kelemahan - Penghancur"
 sp_naval_super_heavy_battleship_unique_reward_a: "Masalah Prioritas - Serangan"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "Merancang kapal perang kelas baru memberi kita kesempatan untuk memfokuskan upaya kita pada peningkatan kemampuan kita untuk mendominasi medan perang angkatan laut. Apa yang harus kita prioritaskan?"
 sp_naval_super_heavy_battleship_preference_a_a: "Senjata Berat"
 sp_naval_super_heavy_battleship_preference_b_a: "Kecepatan"
 sp_naval_super_heavy_battleship_preference_c_a: "Senjata Ringan"
 sp_naval_super_heavy_battleship_unique_reward_b: "Masalah Prioritas - Pertahanan"
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "Komandan tertinggi angkatan laut kami memberi kami tugas yang mustahil, untuk membuat kapal ini nyaris tak terkalahkan - dan meskipun kami tahu itu mustahil, setidaknya kami bisa mencoba mewujudkannya. Kali ini, apa yang harus menjadi prioritas kita?"
 sp_naval_super_heavy_battleship_preference_a_b: "Armor dan Lambung yang Diperkuat"
 sp_naval_super_heavy_battleship_preference_b_b: "Artileri Anti Udara"
 sp_naval_super_heavy_battleship_preference_c_b: "Tindakan Anti-Torpedo"
 sp_naval_modern_battleship_unique_reward_a: "Kapal Perang Modern - Harapan"
 sp_naval_modern_battleship_unique_reward_a_desc: "Meskipun banyak yang mengklaim bahwa usia kapal perang telah berakhir, kami tetap mempercayainya. Kapal ini berpeluang menjadi harapan baru bagi kita. Aspek manakah yang harus kita fokuskan untuk mewujudkan impian tersebut?"
 sp_naval_modern_battleship_preference_a_a: "Daya Tembak Mentah"
 sp_naval_modern_battleship_preference_b_a: "Kemampuan manuver"
 sp_naval_modern_battleship_preference_c_a: "Presisi"
 sp_naval_modern_battleship_unique_reward_b: "Kapal Perang Modern - Menyerang Balik!"
 sp_naval_modern_battleship_unique_reward_b_desc: "Untuk membuktikan pendapat kami dan mempertahankan posisi kami, kami harus menahan serangan musuh. Apa yang harus kita tingkatkan agar bisa menyerang balik mereka yang berani menghalangi kita?"
 sp_naval_modern_battleship_preference_a_b: "Struktur"
 sp_naval_modern_battleship_preference_b_b: "Anti-Udara"
 sp_naval_modern_battleship_preference_c_b: "Perlindungan Torpedo"
 sp_naval_modern_carrier_unique_reward_a: "Operator Modern - Tujuan"
 sp_naval_modern_carrier_unique_reward_a_desc: "Dengan kapal induk generasi baru, kami dapat fokus pada aspek-aspek tertentu dari kapal kami, agar lebih sesuai dengan kebutuhan kami. Di manakah kita harus memusatkan upaya kita?"
 sp_naval_modern_carrier_preference_a_a: "Kesadaran"
 sp_naval_modern_carrier_preference_b_a: "Kecepatan dan Tahan Cuaca"
 sp_naval_modern_carrier_preference_c_a: "Pencegahan Kapal Ringan"
 sp_naval_modern_carrier_unique_reward_b: "Operator Modern - Keamanan"
 sp_naval_modern_carrier_unique_reward_b_desc: "Kapal induk tidak diragukan lagi adalah rajanya peperangan laut, namun kita perlu memberi mereka perlindungan dan keamanan yang tepat. Apa yang harus menjadi perhatian utama kita?"
 sp_naval_modern_carrier_preference_a_b: "Artileri Musuh"
 sp_naval_modern_carrier_preference_b_b: "Pesawat Musuh"
 sp_naval_modern_carrier_preference_c_b: "Torpedo Musuh"
 sp_naval_ice_carrier_unique_reward_a: "Memperkuat Kapal Induk Es"
 sp_naval_ice_carrier_unique_reward_a_desc: "Sambil menginvestasikan banyak waktu untuk membangun kapal induk raksasa ini, kita perlu memastikan bahwa kita memberikan perlindungan terbaik yang kita bisa untuk kapal tersebut. Apa kekhawatiran terbesar kita?"
 sp_naval_ice_carrier_preference_a: "Kekuatan Alam"
 sp_naval_ice_carrier_preference_b: "Pasukan Musuh"
 sp_naval_underway_replenishment_unique_reward_a: "Skala Pasokan Ulang"
 sp_naval_underway_replenishment_unique_reward_a_desc: "Sementara kami masih berupaya membuat sistem pengisian ulang yang sedang berlangsung berjalan selancar mungkin, kami harus membuat satu keputusan lagi - apakah kami ingin mengubah perkiraan awal kami atau tidak?"
 sp_naval_underway_replenishment_preference_a: "Jangkauan Lebih Panjang"
 sp_naval_underway_replenishment_preference_b: "Penggunaan Konvoi Lebih Rendah"
 sp_naval_underway_replenishment_preference_c: "Temukan Keseimbangan"
 sp_naval_proximity_fuzes_unique_reward_a: "Efisiensi atau Efektivitas"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "Proximity Fuze sangat mengurangi jumlah peluru yang dibutuhkan untuk menyerang pesawat musuh. Saat kami bersiap untuk menggunakannya dalam unit anti-udara bergerak, kami dapat menyesuaikan jumlah amunisi yang disuplai, sambil mempertahankan rasio 'pukulan' harian yang diharapkan."
 sp_naval_proximity_fuzes_preference_a: "Sesuaikan Persediaan Amunisi"
 sp_naval_proximity_fuzes_preference_b: "Pertahankan Pasokan Amunisi Saat Ini"
 sp_naval_support_ships_unique_reward_a: "Kapal Bantu - Fokus Dukungan"
 sp_naval_support_ships_unique_reward_a_desc: "Meskipun nilai kapal pendukung tidak diperdebatkan, kita perlu memutuskan apa fokus operasionalnya: pengisian kembali sejumlah kecil kapal secara terfokus, atau pengisian ulang secara umum pada seluruh gudang armada."
 sp_naval_support_ships_preference_a_a: "Kebutuhan segelintir orang"
 sp_naval_support_ships_preference_b_a: "Temukan keseimbangannya"
 sp_naval_support_ships_preference_c_a: "Kebutuhan banyak orang"
 sp_naval_support_ships_unique_reward_b: "Kapal Bantu - Upaya Perbaikan"
 sp_naval_support_ships_unique_reward_b_desc: "Pertanyaan kunci bagi organisasi perbaikan kapal kami: apakah sejumlah besar kru perbaikan kecil, yang mampu melayani sejumlah besar kapal secara perlahan, atau sejumlah kecil kru yang memiliki perlengkapan lebih banyak dan mampu memperbaiki lebih sedikit kapal secara lebih komprehensif."
 sp_naval_support_ships_preference_a_b: "Cakupan Lebih Luas"
 sp_naval_support_ships_preference_b_b: "Temukan keseimbangannya"
 sp_naval_support_ships_preference_c_b: "Upaya Terkonsentrasi"
 sp_naval_submarine_carrier_unique_reward_a: "Meningkatkan Kapal Selam"
 sp_naval_submarine_carrier_unique_reward_a_desc: "Kapal selam kita melampaui batas kemampuan teknik angkatan laut, dan tidak bisa sama kuatnya di semua bidang. Haruskah kita memprioritaskan jangkauan, kekuatan lambung, atau sembunyi-sembunyi?"
 sp_naval_submarine_carrier_preference_a: "Jangkauan yang Diperluas"
 sp_naval_submarine_carrier_preference_b: "Struktur yang Diperkuat"
 sp_naval_submarine_carrier_preference_c: "Visibilitas Berkurang"
 sp_naval_escort_carrier_unique_reward_a: "Draf Desain Pengawal"
 sp_naval_escort_carrier_unique_reward_a_desc: "Kapal induk pengawal berupaya menjejalkan banyak kemampuan ke dalam lambung kapal yang cukup kecil. Kita perlu memilih antara penekanan pada jangkauan, daya tahan, atau kecepatan."
 sp_naval_escort_carrier_preference_a_a: "Jangkauan Operasional"
 sp_naval_escort_carrier_preference_b_a: "Lambung yang Lebih Kuat"
 sp_naval_escort_carrier_preference_c_a: "Kecepatan Lebih Tinggi"
 sp_naval_escort_carrier_unique_reward_b: "Menemukan Prioritas"
 sp_naval_escort_carrier_unique_reward_b_desc: "Jumlah kelompok udara pengangkut pengawal tentu terbatas. Apakah mereka akan berspesialisasi dalam perang anti-kapal selam, atau mendeteksi target permukaan, atau mengadopsi pendekatan multi-peran yang umum?"
 sp_naval_escort_carrier_preference_a_b: "Kapal Selam"
 sp_naval_escort_carrier_preference_b_b: "Tidak ada preferensi"
 sp_naval_escort_carrier_preference_c_b: "Kapal Permukaan"
