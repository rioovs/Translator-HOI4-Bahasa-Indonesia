 sp_rockets_flying_bomb_test_flight_failures_reward_desc: "Uji terbang awal telah mengakibatkan kegagalan karena kegagalan fungsi sistem panduan dan kelemahan struktural. Para ilmuwan kita telah belajar banyak dari hal ini, namun kita perlu mengambil langkah mundur dan memikirkan kembali."
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "They say you learn the most from your failures"
 # Ground to Air
 sp_rockets_ground_control_improvements_reward: "Peningkatan Kontrol Darat"
 sp_rockets_ground_control_improvements_reward_desc: "[Character.GetName] berhasil memecahkan beberapa masalah yang belum terselesaikan dengan kemampuan melacak dan mengendalikan rudal dari darat. Hal ini menandai langkah signifikan menuju kemampuan menargetkan pesawat musuh yang terbang tinggi."
 sp_rockets_vertical_launch_reward: "Sistem Peluncuran Vertikal"
 sp_rockets_vertical_launch_reward_desc: "Setelah beberapa kali gagal, [Character.GetName] akhirnya berhasil menyelesaikan masalah seputar peluncuran vertikal rudal tersebut. Sistem baru ini akan memungkinkan rudal diluncurkan tanpa masalah dan mencapai ketinggian tanpa penundaan."
 sp_rockets_high_speed_flight_control_reward: "Kontrol Penerbangan Kecepatan Tinggi"
 sp_rockets_high_speed_flight_control_reward_desc: "Kami akhirnya berhasil mendapatkan sistem kendali kerja yang dapat berfungsi pada kecepatan tinggi dan bereaksi terhadap perubahan dinamika penerbangan. Pengetahuan ini tentunya dapat bermanfaat di bidang lain juga."
 sp_rockets_high_speed_flight_control_bonus: "Kontrol Penerbangan Kecepatan Tinggi"
 sp_rockets_warhead_detonation_mechanisms_reward: "Mekanisme Detonasi Hulu Ledak"
 sp_rockets_warhead_detonation_mechanisms_reward_desc: "Bagian penting dari keseluruhan pengembangan adalah membuat senjata meledak pada titik yang tepat. Tampaknya [Character.GetName] telah berhasil menemukan solusi yang memungkinkan kami meledakkannya pada waktu yang tepat."
 sp_surface_air_missile_warhead_detonation_bonus: "Rudal Permukaan-Udara: Peningkatan Detonasi Hulu ledak"
 #Ballistic missile
 sp_rocket_wind_tunnel_choice_reward: "Insinyur Meminta Terowongan Angin"
 sp_rocket_wind_tunnel_choice_reward_desc: "Para insinyur proyek rudal balistik telah meminta pembangunan terowongan angin supersonik untuk menguji model skala desain mereka sebelumnya. Hal ini akan mempercepat proses iterasi dan menghemat sumber daya dalam jangka panjang."
 sp_rocket_wind_tunnel_choice_reward_reject: "Sumber daya dibutuhkan di tempat lain."
 sp_rocket_wind_tunnel_choice_reward_agree: "Alokasikan sumber daya."
 sp_rocket_glass_wool_choice_reward: "Pembentukan Es Saat Masuk Kembali"
 sp_rocket_glass_wool_choice_reward_desc: "Selama fase masuk kembali penerbangan roket, es tampaknya terbentuk di sekitar tangki bahan bakar dan mengganggu bagian dalam roket. Meskipun merupakan kemunduran, teknisi kami menyarankan untuk menambahkan wol kaca di sekitar tangki untuk mencegah hal ini terjadi di masa mendatang."
 sp_rocket_glass_wool_choice_reward_accept: "Sayangnya, tapi perlu."
 sp_rocket_guidance_system_choice_reward: "Sistem Bimbingan"
 sp_rocket_guidance_system_choice_reward_desc: "Teknisi kami sedang memperdebatkan sistem panduan roket. Beberapa pihak ingin tetap menggunakan komputer mekanis yang telah teruji sementara yang lain ingin memanfaatkan teknologi radio baru untuk mengendalikan dan memantau peluncuran roket."
 sp_rocket_guidance_system_choice_reward_mechanical: "Mekanik dapat diandalkan."
 sp_rocket_guidance_system_choice_reward_radio: "Radio adalah masa depan!"
 sp_rocket_turbo_pump_froth_reward: "Masalah Buih Turbopump"
 sp_rocket_turbo_pump_froth_reward_desc: "Selama pengujian di ketinggian, masalah terkait pompa turbo berhasil diatasi. Tampaknya pelumas di dalam pompa mulai berbusa dalam kondisi berat yang berdampak pada kinerja keseluruhan dan keandalan desain saat ini."
 sp_rocket_turbo_pump_froth_reward_accept: "Kita harus memikirkan hal ini!"
 sp_rocket_relay_failure_reward: "Kegagalan Relai"
 sp_rocket_relay_failure_reward_desc: "Relai rusak yang digunakan untuk sistem kendali internal roket terdeteksi saat mempersiapkan peluncuran uji kami. Para insinyur percaya bahwa kita harus mengganti relai sebelum melanjutkan, namun kekhawatiran semakin meningkat mengenai konsekuensi politik dari penundaan tersebut."
 sp_rocket_relay_failure_reward_accept: "Perbaiki relay itu."
 sp_rocket_relay_failure_reward_reject: "Kita tidak bisa menunda lagi."
 sp_rocket_outercoating_reward: "Karat Roket"
 sp_rocket_outercoating_reward_desc: "Kekhawatiran telah muncul mengenai selubung luar roket. Jika dibiarkan dalam waktu lama, bahan sering kali berkarat dan menimbulkan korosi. Hal ini dapat membuat roket tidak dapat dioperasikan jika solusi tidak ditemukan."
 sp_rocket_outercoating_reward_accept: "Mungkin pelumas bisa diaplikasikan?"
 sp_rocket_launch_site_choice_reward: "Luncurkan Masalah Situs"
 sp_rocket_launch_site_choice_reward_desc: "Besarnya skala roket baru menyebabkan kendala di lokasi peluncuran yang dituju. Oleh karena itu, manajer proyek meminta pendanaan untuk lokasi baru yang dibangun khusus untuk dibangun di tempat lain."
