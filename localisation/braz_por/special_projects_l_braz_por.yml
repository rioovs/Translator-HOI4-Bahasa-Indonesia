 sp_land_reward_land_cruiser_engine: "Output Mesin Tidak Memadai"
 sp_land_reward_land_cruiser_engine_desc: "Uji coba awal menunjukkan bahwa kerangka besar prototipe memberikan tekanan pada mesin saat ini, membuat [SpecialProject.GetName] lamban dan tidak responsif. Tim menyarankan dua opsi: mengembangkan mesin baru yang lebih bertenaga, atau mencoba modifikasi untuk meningkatkan keluaran mesin yang sudah ada, sehingga berisiko mengalami kegagalan mesin."
 sp_land_reward_option_land_cruiser_engine_leave: "Biarkan apa adanya"
