 ###### TRAITS ########
 scientist_trait_genius: "Jenius"
 scientist_trait_genius_desc: "Pikiran visioner yang mendorong batas-batas ilmu pengetahuan dan teknologi dengan inovasi yang tak tertandingi. Ini adalah jenis bakat yang hanya muncul sekali dalam satu generasi."
 scientist_trait_gifted_engineer: "Insinyur Berbakat"
 scientist_trait_gifted_engineer_desc: "Seorang insinyur yang berbakat secara alami, mahir dalam memecahkan masalah teknis yang kompleks di berbagai bidang."
 scientist_trait_brilliant_theorist: "Ahli Teori Cemerlang"
 scientist_trait_brilliant_theorist_desc: "Seorang ahli konsep dan teori abstrak, mampu merevolusi strategi militer dan penelitian ilmiah."
 scientist_trait_bright: "Cerah"
 scientist_trait_bright_desc: "Seorang ilmuwan yang tajam dan berpikiran cepat yang unggul dalam memahami konsep-konsep baru dan menerapkannya secara efisien."
 scientist_trait_fast_learner: "Pembelajar Cepat"
 scientist_trait_fast_learner_desc: "Cepat beradaptasi terhadap tantangan baru, belajar lebih cepat dibandingkan rekan-rekannya dan unggul dalam beragam bidang ilmu pengetahuan."
 scientist_trait_resourceful: "Banyak akal"
 scientist_trait_resourceful_desc: "Selalu menemukan solusi kreatif, bahkan ketika sumber daya langka atau situasi sangat buruk."
 scientist_trait_schrodingers_trait: "Sifat Schrödinger"
 scientist_trait_schrodingers_trait_tt: "Perolehan XP Ilmuwan: §G+10%§!\nPerolehan XP Ilmuwan: §R-10%§!"
 scientist_trait_schrodingers_trait_desc: "Sebelum pengamat membuka kotak tersebut, fungsi gelombang yang mendeskripsikan sifat tersebut membentuk superposisi keadaan ''baik'' dan ''buruk''"
 scientist_trait_aircraft_specialist: "Spesialis Pesawat Terbang"
 scientist_trait_aircraft_specialist_desc: "Seorang spesialis di bidang aerodinamika dan desain pesawat, yang mampu mengembangkan badan pesawat, mesin, dan desain yang unggul untuk mendominasi langit."
 scientist_trait_rocketry_specialist: "Spesialis Roket"
 scientist_trait_rocketry_specialist_desc: "Mengkhususkan diri dalam teknologi roket, dengan fokus pada prinsip-prinsip propulsi dalam program peroketan balistik dan terpandu."
 scientist_trait_electronics_specialist: "Spesialis Elektronik"
 scientist_trait_electronics_specialist_desc: "Mengkhususkan diri dalam komunikasi, radar, dan sistem komputasi, penting untuk peperangan modern."
 scientist_trait_helicopter_expert: "Ahli Helikopter"
 scientist_trait_helicopter_expert_desc: "Pelopor pesawat sayap putar, yang mengkhususkan diri pada mekanik penerbangan vertikal, sistem rotor, dan model helikopter awal."
 scientist_trait_jet_expert: "Pakar Jet"
 scientist_trait_jet_expert_desc: "Otoritas dalam bidang propulsi jet, memajukan penelitian mesin jet awal dan penerapannya pada pesawat militer."
 scientist_trait_bombs_expert: "Ahli Bom"
 scientist_trait_bombs_expert_desc: "Terampil dalam mengembangkan alat peledak dan bom presisi yang dapat digunakan dalam strategi baru yang disempurnakan untuk pengeboman udara."
 scientist_trait_guidance_systems_expert: "Pakar Sistem Bimbingan"
 scientist_trait_guidance_systems_expert_desc: "Seorang ahli dalam pengembangan awal teknologi panduan, dengan pengalaman meningkatkan sistem kontrol untuk alat peledak tak berawak jarak jauh."
 scientist_trait_armored_specialist: "Spesialis Lapis Baja"
 scientist_trait_armored_specialist_desc: "Seorang insinyur berpengalaman yang berspesialisasi dalam desain dan peningkatan tank dan kendaraan lapis baja lainnya."
 scientist_trait_artillery_specialist: "Spesialis Artileri"
 scientist_trait_artillery_specialist_desc: "Seorang spesialis sistem artileri dengan pengalaman dalam penyempurnaan senjata jarak jauh dan senjata kaliber besar."
 scientist_trait_submarine_specialist: "Spesialis Kapal Selam"
 scientist_trait_submarine_specialist_desc: "Seorang spesialis peperangan kapal selam, berfokus pada pengembangan teknologi kapal selam baru untuk meningkatkan peran mereka dalam operasi angkatan laut yang tersembunyi."
 scientist_trait_surface_ship_specialist: "Spesialis Kapal Permukaan"
 scientist_trait_surface_ship_specialist_desc: "Mengkhususkan diri dalam desain, pengembangan dan penempatan kapal perang permukaan besar, serta penelitian teknologi baru untuk melengkapi kapal militer."
 scientist_trait_nuclear_specialist: "Spesialis Nuklir"
 scientist_trait_nuclear_specialist_desc: "Seorang fisikawan di garis depan penelitian atom, mendalami studi fisi nuklir dan reaksi berantai."
 scientist_trait_nuclear_warfare_expert: "Pakar Perang Nuklir"
 scientist_trait_nuclear_warfare_expert_desc: "Seorang ahli dalam penerapan praktis fisika nuklir pada pengembangan senjata, dengan spesialisasi teori di balik perancangan bom atom."
 scientist_trait_nuclear_power_expert: "Pakar Tenaga Nuklir"
 scientist_trait_nuclear_power_expert_desc: "Otoritas terkemuka dalam fisika nuklir, berpengalaman dalam bidang fisi nuklir dengan fokus pada pembangkit listrik."
