 GER_amerikabomber_messerschmitt_name: "$GER_messerschmitt_organization$ Desain"
 sp_air_mothership_aircraft: "Pesawat Induk"
 sp_air_mothership_aircraft_desc: "Sebuah pesawat besar yang membawa pesawat tempur ke medan perang, memungkinkan misi pengawalan mendalam ke wilayah musuh—benar-benar penguasa langit."
 sp_air_jet_engine: "Mesin Jet"
 JAP_sp_air_jet_engine: "Ishikawajima Ne-20"
 sp_air_jet_engine_desc: "Mesin jet jauh lebih bertenaga dibandingkan mesin baling-baling, sehingga berpotensi merevolusi desain pesawat terbang dan memicu era baru teknik penerbangan."
 sp_air_axial_jet_engine: "Mesin Jet Aksial"
 sp_air_axial_jet_engine_desc: "Mesin jet pertama yang dikembangkan hanya dapat memampatkan udara sampai tingkat tertentu. Dimungkinkan untuk memasang beberapa kompresor secara serial untuk meningkatkan daya dorong lebih jauh lagi."
 sp_air_supersonic_jet: "Jet Supersonik"
 sp_air_supersonic_jet_desc: "Kemajuan teknologi mesin jet membuka jalan bagi pesawat yang mampu mencapai kecepatan Mach 1 dan menembus penghalang suara."
 sp_air_helicopter: "Helikopter"
 sp_air_helicopter_desc: "Pengembangan helikopter, dengan kemampuan uniknya untuk melayang di tempat, dapat memberikan keuntungan taktis yang penting dalam operasi militer."
