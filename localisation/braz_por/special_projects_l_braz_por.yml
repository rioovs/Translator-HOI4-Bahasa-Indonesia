 sp_air_bouncing_bomb: "Bom Memantul"
 sp_air_bouncing_bomb_desc: "Sebuah bom yang dapat meloncat dan memantul di atas permukaan air bisa menjadi alat yang sempurna untuk menembus pertahanan bendungan, dan juga terbukti berguna dalam situasi lain."
