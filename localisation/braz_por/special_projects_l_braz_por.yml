 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Mesin yang Didesain Ulang"
 sp_land_reward_land_cruiser_turret: "Mekanisme Turret yang Kompleks"
 sp_land_reward_land_cruiser_turret_desc: "Desain multi-turret yang sangat besar menyebabkan masalah penyelarasan dan pengarahan yang parah, sehingga menunda integrasi senjata. Tim teknik merekomendasikan penyederhanaan tata letak menara untuk meningkatkan keandalan, namun hal ini akan mengurangi daya tembak yang direncanakan [SpecialProject.GetName]."
