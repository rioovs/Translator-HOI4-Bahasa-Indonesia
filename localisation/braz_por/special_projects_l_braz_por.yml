 sp_land_reward_stronghold_network_delayed_by_concrete_shortage: "Tertunda karena Kekurangan Beton"
 sp_land_reward_stronghold_network_underground_rail_systems: "Sistem Kereta Bawah Tanah"
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors: "Integrasi Pintu Anti Ledakan"
 sp_land_reward_stronghold_network_communication_system_overhaul: "Perombakan Sistem Komunikasi"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc: "Saat menguji jaringan komunikasi internal kompleks pengujian, tim mengidentifikasi inefisiensi yang dapat digunakan untuk menyempurnakan sistem serupa dalam desain benteng tradisional."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize: "Standarisasi"
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study: "Studi Lebih Lanjut"
 sp_land_reward_stronghold_network_leadership_approach: "Pendekatan Kepemimpinan"
 sp_land_reward_stronghold_network_leadership_approach_desc: "Seiring kemajuan proyek, [Character.GetName], ilmuwan utama, harus memutuskan seberapa terlibatnya [Character.GetSheHe] dalam operasi sehari-hari. [Character.GetSheHeCap] dapat memilih untuk mengawasi konstruksi secara langsung di lapangan, memastikan pelaksanaan yang tepat, atau tetap berada di kantor, dengan fokus pada strategi dan perencanaan."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally: "Awasi Pekerjaan Secara Pribadi"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning: "Perencanaan Kantor"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01: "Terobosan dalam Penguatan Beton"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Salah satu insinyur junior telah menemukan metode penguatan baru yang dapat diterapkan pada benteng standar. Mendokumentasikannya sekarang dapat memberi para ilmuwan dan insinyur kita keunggulan dalam penelitian di masa depan."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery: "Terapkan dan Penemuan Dokumen"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project: "Gunakan dalam Proyek Saat Ini"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02: "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc: "Metode penguatan baru yang ditemukan oleh salah satu insinyur junior telah diteruskan ke tim peneliti luar untuk evaluasi lebih lanjut. Meskipun temuan ini masih dalam peninjauan, teknik ini masih dapat diterapkan pada proyek saat ini jika dianggap sesuai."
 sp_land_reward_option_stronghold_network_collapse_01: "Runtuh Selama Pembangunan Terowongan"
 sp_land_reward_option_stronghold_network_collapse_01_desc: "Sebuah terowongan di bawah salah satu bunker utama runtuh secara tak terduga, menjebak beberapa pekerja dan ilmuwan utama, [Character.GetName], yang mengawasi operasi, di bawah reruntuhan. Tindakan darurat harus diambil untuk menyelamatkan personel yang terjebak, namun insiden tersebut telah menyebabkan keterlambatan kemajuan secara keseluruhan."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist: "Prioritaskan Ilmuwan Utama kami"
