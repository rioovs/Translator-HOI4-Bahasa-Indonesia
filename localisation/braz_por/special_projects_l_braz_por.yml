 # Nuclear reactor
 sp_nuclear_design_choice_reward: "Desain Reaktor"
 sp_nuclear_design_choice_reward_desc: "Saat mencoba merancang reaktor, kita perlu memilih bahan apa yang akan digunakan sebagai moderator. Ini akan menentukan desain keseluruhan reaktor. Kita bisa menggunakan Air Berat, atau kita bisa menggunakan Grafit, keduanya memiliki kelebihan dan kekurangan..."
 sp_nuclear_design_choice_reward_graphite: "Grafit yang dimurnikan adalah moderator yang lebih baik"
 sp_nuclear_design_choice_reward_heavy_water: "Air berat akan lebih murah"
 sp_nuclear_major_breakthrough_reward: "Terobosan Besar dalam Reaksi Nuklir"
 sp_nuclear_major_breakthrough_reward_desc: "Eksperimen terkontrol dengan beberapa bahan nuklir kami yang terbatas telah menunjukkan kelayakan desain yang kami inginkan. Hal ini telah mendorong proyek ini maju dengan antusiasme baru."
 sp_nuclear_isotope_separation_choice_reward: "Fasilitas Pemisahan Isotop"
 sp_nuclear_isotope_separation_choice_reward_desc: "Untuk memasok bahan bakar nuklir ke reaktor kita, kita perlu memutuskan proses pemisahan isotop uranium yang berguna dari yang lain. Ada sejumlah usulan untuk fasilitas pemisahan namun dua yang terdepan adalah gas dan sentrifugal."
 sp_nuclear_isotope_separation_choice_reward_gaseous: "Gas adalah teknik yang terbukti."
 sp_nuclear_isotope_separation_choice_reward_centrifugal: "Mesin sentrifugal akan lebih efisien dalam jangka panjang."
 # Generic
 sp_nuclear_scientist_xp_generic_reward: "Pembelajaran Baru"
 sp_nuclear_generic_industry_tech_reward: "Kemajuan Teknologi"
 sp_nuclear_generic_industry_tech_reward_desc: "Selama pengerjaan proyek ini, teknisi kami telah membuat beberapa penemuan baru, yang kemungkinan besar juga dapat diadaptasi untuk digunakan di bidang lain."
 sp_nuclear_generic_reward_option_industry_tech_name: "Penelitian Industri Tingkat Lanjut"
 sp_nuclear_scientist_xp_generic_reward_desc: "TODO_TA"
 sp_nuclear_minor_progress_generic_reward: "Terobosan Kecil"
 sp_nuclear_minor_progress_generic_reward_desc: "Ilmuwan kami membuat beberapa penemuan yang sangat inovatif saat mengerjakan prototipe terbaru. Temuan mereka telah meningkatkan pengetahuan dan penelitian kami di bidang ini secara signifikan."
 sp_nuclear_generic_electronics_tech_reward: "Inovasi Teknologi"
 sp_nuclear_generic_electronics_tech_reward_desc: "Pembelajaran yang signifikan diperoleh selama iterasi terakhir pada proyek ini. Mudah-mudahan, kami dapat memanfaatkan hal ini secara praktis, yang memungkinkan kami mempercepat penelitian di bidang terkait."
 sp_nuclear_generic_reward_option_electronics_tech_bonus_name: "Penelitian Elektronika Tingkat Lanjut."
 sp_nuclear_war_support_generic_reward: "Dukungan Publik"
 sp_nuclear_war_support_generic_reward_desc: "Sebuah uji coba yang berhasil, dan beberapa liputan media yang terkait dan dikontrol dengan ketat, telah membawa pada pemahaman publik bahwa kita semakin dekat untuk mengembangkan semacam senjata super yang dapat digunakan untuk mengalahkan semua musuh."
 sp_nuclear_major_political_interference_generic_reward: "Intervensi Politik Besar"
 sp_nuclear_major_political_interference_generic_reward_desc: "Proyek [SpecialProject.GetName] semakin mendapat pengawasan dan campur tangan dari para pemimpin politik, sehingga menyebabkan penundaan dan berpotensi memaksa perubahan dalam kepemimpinan proyek. Hal ini membuat marah [Character.GetName]. Kita perlu mengatasi tantangan-tantangan politik ini agar proyek tetap berjalan pada jalurnya"
 sp_nuclear_major_political_interference_generic_reward_option_keep: "Pertahankan [(Character?.GetName:'CAP_SCIENTIST)]"
 sp_nuclear_major_political_interference_generic_reward_option_fire: "Hapus [(Character?.GetName:'CAP_SCIENTIST)]"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward: "Terobosan Teoritis"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc: "[Character.GetName] telah berhasil memecahkan masalah teoritis yang kompleks selama bekerja dengan prototipe terbaru. Hal ini menyebabkan perampingan desain bom, sehingga lebih mudah untuk diproduksi."
 sp_nuclear_bomb_critical_mass_generic_reward: "Eksperimen Massa Kritis Menjadi Salah"
 sp_nuclear_bomb_critical_mass_generic_reward_desc: "Kecelakaan kritis terjadi selama percobaan untuk menentukan massa kritis, yang menyebabkan paparan radiasi dan korban jiwa di antara personel kunci."
 sp_nuclear_bomb_information_leak_reward: "Kebocoran Informasi"
 sp_nuclear_bomb_information_leak_reward_desc: "Salah satu pekerja di [SpecialProject.GetName] rupanya telah membocorkan informasi kepada agen asing. Apakah ini disengaja atau tidak, masih belum diketahui. Sulit juga untuk menentukan kerusakan yang diakibatkan oleh hal ini terhadap proyek"
 sp_nuclear_bomb_information_leak_reward_tt: "Mendapatkan kemajuan Proyek"
# Nuclear Reactor
 sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Kebocoran Radioaktif - Terkendali"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "Sayangnya ada insiden serius selama pengerjaan reaktor. Berkat respon cepat dari staf, kerusakan telah dapat diatasi dan tim dapat memperoleh data berharga dari kejadian tersebut."
 sp_nuclear_reactor_minor_explosion_reward: "Ledakan Kecil, Tidak Ada Cedera"
 sp_nuclear_reactor_minor_explosion_reward_desc: "Saat mengerjakan prototipe reaktor nuklir versi terbaru, terjadi insiden kecil. Terjadi ledakan kecil yang merusak beberapa bagian laboratorium, namun api yang terjadi dapat dengan mudah dipadamkan. Setelah laboratorium diperbaiki, pekerjaan seharusnya dapat dilanjutkan sesuai rencana, hanya dengan sedikit penundaan."
 sp_nuclear_reactor_tested_reward: "Uji Reaktor Nuklir Pertama yang Berhasil"
 sp_nuclear_reactor_tested_reward_desc: "Reaktor nuklir pertama kami telah berhasil diuji, membuktikan kelayakan fisi nuklir terkendali. Terobosan ini menjanjikan era baru dalam produksi energi, dan mungkin lebih banyak lagi."
 sp_nuclear_reactor_tested_reward_public: "Rayakan pencapaian tersebut di depan umum"
 nuclear_reactor_tested_reward_classify: "Jaga kerahasiaan informasinya untuk saat ini"
 sp_nuclear_reactor_tested_reward_public_tt: "Negara-negara lain mungkin mendapat manfaat dari hal ini"
 sp_nuclear_reactor_tested_tech_bonus: "Menerima Informasi tentang Uji Coba Nuklir"
 sp_commercial_nuclear_reactor_concerns_reward: "Kekhawatiran Terhadap Keamanan Nuklir"
 sp_commercial_nuclear_reactor_concerns_reward_desc: "[Character.GetName] telah menyampaikan kekhawatiran atas kurangnya filter di menara pendingin reaktor baru kami. [Character.GetSheHeCap] menegaskan bahwa filter harus ditambahkan untuk mencegah radiasi keluar dari reaktor selama keadaan darurat. Sementara itu, para insinyur berpendapat bahwa mereka akan menunda proyek tersebut secara signifikan."
 sp_commercial_nuclear_reactor_concerns_reward_option_safety: "Tambahkan filter."
 sp_commercial_nuclear_reactor_concerns_reward_option_ignore: "Benar-benar bodoh!"
 # Nuclear bombs
 sp_nuclear_bomb_test_prototype_reward: "Bom Prototipe"
 sp_nuclear_bomb_test_prototype_reward_desc: "Bom Prototipe telah diproduksi oleh tim [Character.GetName]. Membuat dan mengevaluasi tes yang berhasil akan meningkatkan kemajuan kita secara signifikan. Di sisi lain, kita punya bom nuklir sekarang..."
 sp_nuclear_bomb_test_prototype_reward_test_bomb: "Ujilah di bawah formulir terkontrol"
 sp_nuclear_bomb_test_prototype_reward_keep_bomb: "Kita bisa menggunakan ini untuk melawan musuh kita"
 sp_nuclear_bomb_espionage_threats_reward: "Ancaman Spionase"
 sp_nuclear_bomb_espionage_threats_reward_desc: "Petugas keamanan berpendapat bahwa ada kebutuhan untuk meningkatkan keamanan di lokasi proyek [SpecialProject.GetName] dan seluruh aktivitas di sekitarnya. Para peneliti, yang dipimpin oleh [Character.GetName], berpendapat bahwa kebebasan untuk bergerak dan berkomunikasi sangat penting untuk kemajuan."
 sp_nuclear_bomb_espionage_threats_reward_no: "Jangan tingkatkan keamanan"
 sp_nuclear_bomb_espionage_threats_reward_increase_security: "Tingkatkan Keamanan"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt: "Peningkatan Keamanan menurunkan risiko pencurian informasi"
 sp_nuclear_bomb_breakthrough_plutonium_reward: "Terobosan dalam Produksi Plutonium"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc: "Ilmuwan kami telah membuat terobosan signifikan dalam teknik produksi Plutonium, meningkatkan efisiensi produksi bom. Hal ini diharapkan dapat mempercepat timeline pengembangan."
 sp_nuclear_bomb_accident_generic_reward: "Kebakaran yang Tidak Disengaja"
 sp_nuclear_bomb_accident_generic_reward_desc: "Kebakaran terjadi di salah satu gudang di fasilitas tersebut. Investigasi awal menunjukkan bahwa itu adalah kecelakaan. Tapi benarkah itu?"
 sp_nuclear_bomb_design_choice_reward: "Desain Bom Sederhana atau Kompleks"
 sp_nuclear_bomb_design_choice_reward_desc: "Ada dua desain senjata atom yang sedang diupayakan oleh para ilmuwan kita dan perdebatan telah muncul mengenai bagaimana cara melanjutkannya. Salah satu desainnya, yang dikenal sebagai jenis senjata, jauh lebih sederhana untuk dibuat tetapi juga kurang efisien dalam penggunaan bahan nuklir. Yang lainnya adalah tipe ledakan, desain yang jauh lebih menantang namun secara teoritis lebih efisien dalam penggunaan bahan nuklir."
 sp_nuclear_bomb_design_choice_reward_gun_type: "Pistol adalah pilihan yang lebih aman."
 sp_nuclear_bomb_design_choice_reward_implosion: "Ledakan adalah desain yang unggul."
# Thermonuclear Bombs
 sp_thermonuclear_bomb_test_reward: "Proposal Tes"
 sp_thermonuclear_bomb_test_reward_desc: "Untuk mengkonfirmasi teori di balik bom termonuklir, para ilmuwan kami telah meminta kesempatan untuk melakukan uji coba peledakan. Hal ini memerlukan alokasi bom atom yang ada untuk memulai reaksi berantai namun akan mempercepat kemajuan proyek secara signifikan."
