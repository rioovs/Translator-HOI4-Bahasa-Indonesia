 sp_land_reward_option_land_cruiser_turret_redesign: "Mendesain Ulang Mekanisme Turret"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Mekanisme Turret yang didesain ulang"
 sp_land_reward_land_cruiser_track: "Lacak Kegagalan Sistem"
 sp_land_reward_land_cruiser_track_desc: "Bobot [SpecialProject.GetName] telah membebani sistem lintasan, menyebabkan kerusakan terus-menerus selama pengujian. Pilihannya adalah memperkuat lintasan, yang memerlukan rekayasa ulang secara signifikan, atau mengurangi lapis baja kendaraan untuk meringankan beban."
 sp_land_reward_option_land_cruiser_track_current: "Lanjutkan dengan Trek Saat Ini"
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Kurangi Pelapisan Armor"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Pengurangan Pelapisan Armor"
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Perkuat Sistem Lintasan"
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Sistem Lintasan yang Diperkuat"
 sp_land_reward_land_cruiser_communication: "Masalah Sistem Komunikasi"
 sp_land_reward_land_cruiser_communication_desc: "Ukuran [SpecialProject.GetName] yang besar memerlukan sistem komunikasi internal yang kompleks untuk mengoordinasikan krunya. Sistem yang ada saat ini terbukti tidak memadai, dengan banyaknya pesanan yang tertunda atau hilang. Tim menyarankan untuk mendesain ulang tata letak internal untuk meningkatkan aliran komunikasi, atau memasang sistem yang lebih canggih namun belum teruji."
 sp_land_reward_option_land_cruiser_communication_current: "Tinggalkan Sistem Saat Ini"
 sp_land_reward_option_land_cruiser_communication_new: "Instal Sistem Lanjutan Baru"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Sistem Komunikasi Tingkat Lanjut"
 sp_land_reward_option_land_cruiser_communication_redesign: "Tata Letak Internal yang Didesain Ulang"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Sistem Komunikasi yang Didesain Ulang"
 sp_land_reward_land_cruiser_assembly: "Perakitan Presisi"
 sp_land_reward_land_cruiser_assembly_desc: "Selama fase perakitan, para insinyur berhasil menyempurnakan teknik penyelarasan presisi untuk memasang komponen besar [SpecialProject.GetName], seperti cincin turret dan pelapis lambung, sehingga secara signifikan mengurangi risiko patah akibat tekanan mekanis. Kami dapat mengintegrasikan teknik inovatif ini ke seluruh proyek untuk meningkatkan keandalan struktural secara keseluruhan. Bagaimana kita harus menerapkannya?"
 sp_land_reward_option_land_cruiser_assembly_all: "Di Semua Tahap Perakitan"
 sp_land_reward_option_land_cruiser_assembly_bonus_name: "Perakitan Presisi"
 sp_land_reward_option_land_cruiser_assembly_key: "Hanya untuk Komponen Utama"
 sp_land_reward_land_cruiser_suspension: "Sistem Suspensi Hidropneumatik"
 sp_land_reward_land_cruiser_suspension_desc: "Tim telah menyempurnakan sistem suspensi hidropneumatik mutakhir yang menyeimbangkan bobot [SpecialProject.GetName] yang sangat besar, memastikan stabilitas dan mengurangi ketegangan pada trek bahkan saat melintasi medan yang kasar. [Character.GetName] yakin bahwa penangguhan ini dapat diterapkan dengan andal untuk performa yang lebih baik di lapangan."
 sp_land_reward_option_land_cruiser_suspension_full: "Suspensi Hidropneumatik Penuh"
 sp_land_reward_option_land_cruiser_suspension_rear: "Batasi untuk Unit Belakang"
 sp_land_reward_land_cruiser_ammunition: "Solusi Penyimpanan Amunisi"
 sp_land_reward_land_cruiser_ammunition_desc: "Selama pengujian, muncul kekhawatiran mengenai penyimpanan dan pengangkutan amunisi kaliber tinggi [SpecialProject.GetName] yang aman, karena rak standar tidak dapat menahan beban bahan peledak dengan aman. Sistem penyimpanan terkotak baru, menggunakan sekat yang diperkuat dan pemuat hidrolik, telah diusulkan, memungkinkan penanganan yang lebih aman dan pemuatan cangkang lebih cepat dalam kondisi pertempuran."
 sp_land_reward_option_land_cruiser_ammunition_current: "Pertahankan Sistem Saat Ini"
 sp_land_reward_option_land_cruiser_ammunition_simplified: "Gunakan Versi Sederhana"
 sp_land_reward_option_land_cruiser_ammunition_new: "Adopsi Sistem Penyimpanan Baru"
 sp_land_reward_super_heavy_howitzer_focus_preference: "Fokus Desain"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc: "Seiring dengan kemajuan pembangunan, sebuah keputusan penting harus diambil: Kita dapat memprioritaskan produksi yang cepat dan senjata kaliber yang lebih kecil, atau kita dapat berinvestasi pada senjata yang lebih besar dan lebih berat, sehingga mengorbankan efisiensi produksi demi daya tembak yang tak tertandingi dan dampak yang menghancurkan."
