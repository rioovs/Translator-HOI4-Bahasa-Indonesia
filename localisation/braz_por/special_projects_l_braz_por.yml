 sp_nuclear_bomb_desc: "Sebuah bom yang menggunakan proses fisi nuklir untuk melepaskan energi atom yang tersimpan dalam satu momen apokaliptik. Dengan senjata seperti itu di gudang senjata kita, siapa yang berani melawan kita?"
