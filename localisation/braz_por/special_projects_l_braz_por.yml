 sp_nuclear_warheads: "Hulu ledak Nuklir"
 sp_nuclear_warheads_desc: "Dengan menciptakan senjata nuklir yang terkondensasi, kita akan dapat memanfaatkannya sebagai muatan pada berbagai sistem peluncuran berbasis roket, sehingga memungkinkan kita untuk menyerang dalam jarak yang sangat jauh."
