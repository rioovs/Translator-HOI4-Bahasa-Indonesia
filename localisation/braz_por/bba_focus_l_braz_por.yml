######################################################################
################     SWITZERLAND FOCUS TREE     ######################
######################################################################
#########   Historical ####################
 SWI_swiss_guiding_principles: "Prinsip Panduan Swiss"
 SWI_swiss_guiding_principles_desc: "[ROOT.GetNameDefCap] merupakan negara demokrasi tertua di benua ini, namun laju perubahan yang cepat di Eropa menempatkan hal ini dalam risiko. Haruskah kita melanjutkan jalan yang ditetapkan oleh Eidgenossenschaft dan Konstitusi tahun 1848, atau akankah kita melihat jalan baru?"
 SWI_increase_defense_budget: "Meningkatkan Anggaran Pertahanan"
 SWI_increase_defense_budget_desc: "Meskipun kita berhasil mempertahankan netralitas dan kedaulatan kita dalam Perang Besar, kita tidak bisa berpuas diri; ada kemungkinan nyata bahwa salah satu kekuatan besar di sekitar kita akan menyerang negara kita untuk menghindari benteng yang dibangun di antara mereka, dan anggaran kita saat ini tidak akan cukup untuk mencegah hal ini."
 SWI_national_defense_fund: "Dana Pertahanan Nasional"
 SWI_national_defense_fund_desc: "Pertahanan suatu negara memerlukan lebih dari sekedar keringat dan jerih payah, kita juga membutuhkan dana untuk mengimpor peralatan dan bahan mentah yang diperlukan untuk bersiap menghadapi kemungkinan terburuk. Membentuk dan mempromosikan dana dimana warga [ROOT.GetAdjective] dapat berkontribusi secara sukarela akan memungkinkan kita untuk mengimbangi kenaikan anggaran militer, dan hal ini menunjukkan sikap partisipatif [ROOT.GetAdjective]."
 SWI_reaffirm_spiritual_defense: "Tegaskan kembali Pertahanan Spiritual"
 SWI_reaffirm_spiritual_defense_desc: "Konfederasi kami telah berkomitmen untuk membela nilai-nilai nasional Swiss sejak tahun 1932 sebagai respons terhadap meningkatnya ancaman otoritarianisme di sekitarnya. Saat ini, ancaman tersebut semakin besar dibandingkan sebelumnya, sehingga kita harus memperbarui janji kita untuk mempertahankan cara hidup kita secara fisik dan spiritual."
 SWI_fortify_border_with_germany: "Perkuat Perbatasan dengan Jerman"
 SWI_fortify_border_with_germany_desc: "[GER.GetNameDefCap] merupakan ancaman nyata terhadap kelangsungan konfederasi [ROOT.GetAdjective]. Jika perang pecah antara [GER.GetName] dan [FRA.GetName], [GER.GetAdjective] mungkin melewati [ROOT.GetName] bukannya perbatasan yang dijaga ketat dengan [FRA.Getname] atau melalui [HOL.GetName] dan [BEL.Getname]. Kita dapat membangun benteng antar negara kita untuk mencegah [GER.GetNameDef]."
 SWI_fortify_border_with_italy: "Perkuat Perbatasan dengan Italia"
 SWI_fortify_border_with_italy_desc: "[ITA.GetAdjective] ambisi ekspansionis dapat meluas ke [ROOT.GetName] kapan saja. Lagipula, sebagian besar penduduk kita adalah penutur bahasa Italia, dan yang diperlukan hanyalah pidato dari [ITA.GetLeader] dan [ROOT.GetName] akan terlihat oleh mereka. Kita harus menunjukkan kepada mereka bahwa kita bukanlah sasaran empuk."
 SWI_fortify_border_with_france: "Perkuat Perbatasan dengan Perancis"
 SWI_fortify_border_with_france_desc: "Terlepas dari komitmen mereka terhadap nilai-nilai demokrasi, dan hubungan persahabatan yang telah terjalin lama, kita tidak dapat mengabaikan kemungkinan bahwa [FRA.GetName] dapat masuk tanpa izin ke wilayah [ROOT.GetAdjective] untuk melancarkan serangan diam-diam terhadap [GER.GetNonIdeologyName] atau [ITA.GetNonIdeologyName]."
 SWI_ban_foreign_nazi_propaganda: "Larang Propaganda Nazi di Luar Negeri"
 SWI_ban_foreign_nazi_propaganda_desc: "Kita tidak bisa membiarkan wahana propaganda asing ini bertahan. Nazisme bertentangan dengan setiap nilai yang mendefinisikan Federasi [ROOT.GetAdjective]. Oleh karena itu, hal ini tidak dapat ditoleransi di negara yang dibangun berdasarkan Demokrasi dan Toleransi seperti negara kita, karena jika tidak kita akan mengambil risiko bahwa negara tersebut akan digunakan untuk menghancurkan kita dari dalam."
 SWI_buero_ha: "Buero Ha"
 SWI_buero_ha_desc: "Kita tidak bisa membiarkan tetangga kita mengetahui bahwa kita sedang berusaha mengumpulkan informasi intelijen mengenai mereka, jadi kita harus bergantung pada badan intelijen semi-independen untuk melakukan operasi rahasia kita. Di sinilah peran pengusaha fotografi yang menjadi kepala mata-mata Hans Hausamann, dengan kantor intelijennya yang kecil dan gesit, dia dapat melakukan pekerjaan yang perlu dilakukan tanpa mengotori tangan kita."
 SWI_federal_police: "Departemen Intelijen Polisi Federal"
 SWI_federal_police_desc: "Adalah kebodohan untuk membela [ROOT.GetName] dari musuh-musuh eksternal, hanya membiarkannya menyerah pada musuh-musuh internalnya. Kita harus memberdayakan Polisi Federal untuk membasmi kemungkinan ancaman di dalam perbatasan kita dan mempertahankan diri dari unsur asing di wilayah kita."
 SWI_spab_counter_intelligence_agency: "SpAb"
 SWI_spab_counter_intelligence_agency_desc: "Kita tahu [GER.GetNameDef] telah mendirikan pusat pelatihan untuk melatih penyabot kolom kelima di Stuttgart, yang dijuluki Panoramaheim. Inilah sebabnya kita harus memberdayakan Polisi Federal dengan divisi Spionase Abwehr untuk menghadapi ancaman ini dan melawan spionase dan sabotase asing."
 SWI_armed_neutrality: "Netralitas Bersenjata"
 SWI_armed_neutrality_desc: "Netralitas kami yang sudah lama ada merupakan bagian integral dari identitas [ROOT.GetAdjective]. Tapi netralitas saja tidak bisa menjamin kedaulatan kita. Lagi pula, seberapa besar bantuannya [BEL.GetNonIdeologyName] dalam Perang Besar? Pencegahan terbaik adalah seluruh bangsa siap mengangkat senjata dan berperang melawan penjajah mana pun."
 SWI_promote_guisan: "Promosikan Henri Guisan"
 SWI_promote_guisan_desc: "Sistem politik kita hanya mengizinkan satu Jenderal dan Panglima Tertinggi pada saat sangat dibutuhkan, ketika Konfederasi kita berada dalam bahaya. Hal ini tentunya merupakan salah satu situasi tersebut, dan orang yang akan melakukan pekerjaan tersebut sudah jelas: Henri Guisan bukan hanya orang yang paling memenuhi syarat untuk pekerjaan tersebut, namun dia juga menikmati popularitas yang luas di seluruh [ROOT.GetNameDef]."
 SWI_national_redoubt: "Réduit Nasional"
 SWI_national_redoubt_desc: "Henri Guisan mengusulkan cara berbeda untuk membela [SWI.GetName]. Daripada berusaha mempertahankan perbatasan negara kita berapa pun akibatnya, kita bisa secara strategis menyerahkan Dataran Tinggi Swiss dan mundur ke pegunungan Alpen, sehingga kita bisa mengorbankan musuh untuk menduduki kita."
 SWI_expedite_mobilization: "Mempercepat Mobilisasi"
 SWI_expedite_mobilization_desc: "Peran pasukan kecil kami yang tetap adalah untuk menahan musuh sementara rakyat [ROOT.GetName] mengangkat senjata dan membentuk Milisi Warga, yang merupakan bagian terbesar dari pasukan pertahanan kami. Inilah sebabnya kita harus memastikan mereka siap sesegera mungkin, untuk mengurangi risiko pasukan tetap kita diserbu."
 SWI_fortify_the_jura: "Perkuat Jura"
 SWI_fortify_the_jura_desc: "Banyak persiapan telah dilakukan untuk membentengi Pegunungan Alpen, namun kita juga dapat membentengi Pegunungan Jura yang, meskipun tidak terlalu curam atau dapat dipertahankan, terbukti bermanfaat sebagai front kedua untuk menyerang Dataran Tinggi tersebut setelah berada di tangan musuh."
 SWI_rig_infrastructure_to_blow: "Infrastruktur Rig Akan Meledak"
 SWI_rig_infrastructure_to_blow_desc: "Jika kita membiarkan penjajah memasuki wilayah kita, kita tidak bisa memberikan semuanya begitu saja. Yang paling penting adalah kita mempersiapkan infrastruktur kita agar tidak dapat digunakan oleh musuh, memperlambat kemajuan mereka dan memaksa mereka menghabiskan sumber daya yang berharga untuk menggantinya."
 SWI_emergency_industry: "Industri Darurat"
 SWI_emergency_industry_desc: "Kini kita harus menghancurkan kapasitas industri kita ketika musuh menyerbu negara kita. Kita harus memastikan bahwa kita mempunyai cadangan yang bisa kita gunakan untuk membangun kembali apa yang tersisa dan mengusir penjajah. Terowongan dan pabrik rahasia akan memenuhi jantung pegunungan dan lembah kita, beberapa bahkan mungkin berada di luar perbatasan kita."
 SWI_flood_the_valleys: "Banjir Lembah"
 SWI_flood_the_valleys_desc: "Kami memperkirakan kekuatan invasi besar akan datang melalui daerah sekitar Danau Constance, ini adalah tempat yang tepat untuk membangun kanal dan tanggul untuk membanjiri lahan pertanian dan menghambat penyelundup. Saat mereka mencoba menyeberangi rawa berbahaya ini, kita bisa menggunakan kesempatan ini untuk membombardir mereka dengan semua yang kita punya. Mereka akan menyesal pernah mencoba menyerang kita."
 SWI_defend_the_skies: "Pertahankan Langit"
 SWI_defend_the_skies_desc: "Peperangan modern sangat bergantung pada superioritas dan dukungan udara. [ROOT.GetName] belum siap menghadapi kenyataan baru ini, jadi kita harus mempersiapkan setiap wilayah untuk mempertahankan langitnya dari pesawat musuh."
 SWI_attack_from_the_mountains: "Serangan dari Pegunungan"
 SWI_attack_from_the_mountains_desc: "Setelah kita berada di posisi yang dibentengi di Pegunungan Alpen dan Jura, kita bisa mendatangkan malapetaka pada pasukan musuh di lembah. Kita perlu memastikan mereka tahu bahwa setiap menit yang mereka habiskan di wilayah kita berarti hilangnya lebih banyak personel dan material."
 SWI_frontier_defense_plan: "Rencana Pertahanan Perbatasan"
 SWI_frontier_defense_plan_desc: "Jika kita membiarkan mereka masuk ke perbatasan kita [ROOT.GetNameDef] sama saja dengan mati. Kami tidak bisa memberikan satu inci pun wilayah kami, perbatasan kami adalah suci. Inilah sebabnya kita harus memperkuat perbatasan kita dan bersiap untuk mempertahankannya."
 SWI_fight_until_death: "Berjuang sampai Mati"
 SWI_fight_until_death_desc: "Kemungkinannya besar, [ROOT.GetNAme] kalah jumlah, kalah persenjataan dan kurang siap menghadapi apa yang akan terjadi. Inilah sebabnya mengapa setiap warga negara [ROOT.GetAdjective] harus siap memberikan nyawanya untuk Kanton dan Konfederasinya."
 SWI_total_defense: "Pertahanan Total"
 SWI_total_defense_desc: "Perang total berarti kita membutuhkan pertahanan total, jika setiap milisi siap dan memberikan semua yang mereka miliki untuk melawan penjajah, kita mungkin memiliki peluang untuk bertahan hidup."
 SWI_the_army_position: "Posisi Angkatan Darat"
 SWI_the_army_position_desc: "Kami akan menempatkan Milisi Warga dan pasukan tetap kami di perbatasan [ROOT.GetName], sehingga mereka memerlukan benteng untuk meningkatkan kemampuan mereka dalam mencegah penyusup."
 SWI_prolonged_service: "Layanan Berkepanjangan"
 SWI_prolonged_service_desc: "Masa wajib militer kita saat ini tidak cukup untuk menghadapi perang jangka panjang. Kita perlu memberi Pemerintah Federal alat untuk menjaga warga negara kita tetap bersenjata lebih lama, bahkan jika itu berarti mengorbankan sejumlah kebebasan."
 SWI_enhanced_training: "Pelatihan yang Ditingkatkan"
 SWI_enhanced_training_desc: "Perang telah banyak berubah sejak terakhir kali [ROOT.GetName] terakhir kali menghadapi risiko konflik. Kita harus memperbarui dan meningkatkan pelatihan dasar yang didapat setiap warga negara mampu. Mereka adalah aset terbaik kita dalam membela negara kita."
 SWI_integrate_refugees_into_the_army: "Integrasikan Pengungsi ke dalam Angkatan Darat"
 SWI_integrate_refugees_into_the_army_desc: "Sebagai oase perdamaian dan demokrasi di tengah lautan Fasisme dan Perang, banyak orang berbondong-bondong ke [ROOT.GetName] untuk mencari tempat berlindung yang aman. Beberapa dari mereka berharap untuk bergabung dalam upaya untuk mengalahkan orang-orang yang memaksa mereka meninggalkan kampung halamannya, dan banyak di antara mereka bahkan adalah tentara profesional. kita bisa membiarkan mereka ikut berjuang demi Swiss dan masa depan yang lebih baik."
 SWI_expanded_military_support: "Dukungan Militer yang Diperluas"
 SWI_expanded_military_support_desc: "Kekuatan milisi kita tidak hanya terdiri dari tentara, masih banyak peran lain yang diperlukan agar mereka dapat berfungsi sebagai mesin yang diminyaki dengan baik. Kita perlu merekrut, melatih dan menyediakan perusahaan pendukung bagi milisi kita jika kita ingin berhasil membela [ROOT.GetName]."
 SWI_all_adults_training: "Pelatihan Semua Orang Dewasa"
 SWI_all_adults_training_desc: "Tidak ada ruang untuk mengambil risiko dengan kondisi dunia saat ini. Setiap orang dewasa yang mampu harus siap mengangkat senjata melawan kekuatan penyerang apapun, Swiss adalah milik kita semua, sehingga harus dipertahankan oleh kita semua."
 SWI_anti_tank_divisions: "Divisi Anti-tank"
 SWI_anti_tank_divisions_desc: "Tank adalah ujung tombak peperangan modern, medan kita telah memberi kita keuntungan melawan mereka, namun jika kita melengkapi pasukan kita dengan peralatan anti-tank kita dapat memotong ujungnya dan menumpulkan tombaknya."
 SWI_reduce_military_training_age: "Mengurangi Usia Perekrutan"
 SWI_reduce_military_training_age_desc: "Biasanya, [ROOT.GetAdjective] mulai dilatih untuk bertempur pada usia 20 tahun, namun untuk mendapatkan jumlah pasukan yang kita perlukan untuk bertahan hidup, warga negara kita harus memulai pelatihan mereka setahun lebih awal. Mari kita berharap ini cukup."
 SWI_veteran_sharpshooter_divisions: "Divisi Penembak Jitu Veteran"
 SWI_veteran_sharpshooter_divisions_desc: "Ribuan penembak jitu veteran telah meminta untuk diizinkan masuk militer sebagai tentara tambahan dan melakukan bagian mereka untuk membela negara dan demokrasi mereka. Pengalaman dan antusiasme mereka akan menjadi keuntungan bagi milisi kita."
 SWI_fortify_ticino: "Fortezza Ticino"
 SWI_fortify_ticino_desc: "Sebagai negara netral di antara tiga negara yang secara historis suka berperang, kematian bisa datang dari sisi mana pun, kita tidak boleh lengah, [ITA.GetName] kemungkinan besar akan menyerang kita seperti [GER.GetNameDef] atau [FRA.GetName], dan jika mereka menyerang kita, serangannya akan terjadi melalui [846.GetName]. Oleh karena itu kita harus menjadikannya benteng yang tidak dapat ditembus demi [SWI.GetNameDef]."
 SWI_fortify_sargans_gotthard_and_st_maurice: "Perkuat Sargans, Gotthard dan St Maurice"
 SWI_fortify_sargans_gotthard_and_st_maurice_desc: "Pegunungan Alpen kami adalah kebanggaan [ROOT.GetName], dan di masa yang tidak menentu ini kami dapat membentengi pegunungan tersebut untuk membantu menjamin keamanan Konfederasi kami."
 SWI_defend_against_paratroopers: "Bertahan melawan Pasukan Terjun Payung"
 SWI_defend_against_paratroopers_desc: "Kita telah melihat bagaimana pasukan terjun payung dapat digunakan untuk menerobos benteng apa pun, sehingga persiapan apa pun menjadi sia-sia. Penting bagi kita untuk siap menghadapinya sebelum mereka merusak pertahanan kita."
 SWI_expand_special_forces: "Perluas Pasukan Khusus"
 SWI_expand_special_forces_desc: "Pasukan tetap kita telah dipersiapkan dengan baik, sangat kecil dibandingkan dengan negara lain dan mereka mungkin tidak cukup untuk membuat pertahanan [ROOT.GetName] menguntungkan kita. Kami akan membutuhkan lebih banyak dari mereka untuk memimpin [ROOT.GetAdjective] menuju kemenangan!"
 SWI_purchase_german_planes: "[SWI_purchase_fascist_planes_name]"
 SWI_purchase_german_planes_default: "Beli Pesawat Jerman"
 SWI_purchase_german_planes_alt: "Beli Pesawat dari Tetangga Fasis"
 SWI_purchase_german_planes_desc: "Dengan angkatan udara yang ketinggalan jaman, dan kurangnya industri serta teknologi untuk memproduksi pesawat dalam jumlah besar, kita terpaksa bergantung pada pembelian pesawat dari negara tetangga. Membeli pesawat yang kita butuhkan dari [GER.GetName] tidak hanya akan menyediakan peralatan yang kita perlukan, namun juga membantu menjaga diri kita tetap dalam kondisi baik."
 SWI_ban_the_communist_party: "Larang Partai Komunis Swiss"
 SWI_ban_the_communist_party_desc: "Partai Komunis menimbulkan bahaya besar bagi [SWI.GetNameDef]. Meskipun jarak antara kami dan [SOU.GetNameDef], pengaruh revolusioner mereka dapat dirasakan di udara. Kita tidak bisa mengambil risiko mengacaukan negara kita di masa-masa berbahaya seperti ini, jadi kita harus bertindak cepat dan melarang pihak mana pun yang berupaya menjungkirbalikkan dan melemahkan pemerintah kita."
 SWI_withdraw_from_the_league_of_nations: "Mundur dari Liga Bangsa-Bangsa"
 SWI_withdraw_from_the_league_of_nations_desc: "Keanggotaan kami di Liga Bangsa-Bangsa tidak sesuai dengan Netralitas yang kami cita-citakan di [ROOT.GetName], jadi sangat penting bagi kami untuk meninggalkan organisasi yang sedang sekarat ini. Hal ini juga akan menandakan komitmen kita terhadap netralitas sejati terhadap tetangga kita, semoga meyakinkan mereka bahwa [ROOT.GetName] bukanlah sebuah target."
 SWI_limited_censorship_of_the_press: "Sensor Terbatas terhadap Pers"
 SWI_limited_censorship_of_the_press_desc: "Kekuatan yang ingin melihat [ROOT.GetName] akan menggunakan apa pun untuk membenarkan penyerangan kami. Kebebasan pers, meskipun penting bagi demokrasi yang sehat, harus dikesampingkan saat ini, sehingga kita dapat memastikan bahwa kita tidak memberikan amunisi kepada ambisi negara-negara tetangga kita."
 SWI_tighten_press_censorship: "Perketat Sensor Pers"
 SWI_tighten_press_censorship_desc: "Tidak ada ruang untuk kesalahan, satu kata pun dapat menjadi pembeda antara kelangsungan hidup konfederasi dan kehancurannya hingga terlupakan. Kita tidak bisa membiarkan pers yang bebas membahayakan masa depan kita, pers yang bebas harus dikontrol dengan ketat sesuai tuntutan [?SWI.SWI_biggest_fascist.GetNameDef]."
 SWI_seek_trade_agreement_with_germany: "Perjanjian Perdagangan dengan Jerman"
 SWI_seek_trade_agreement_with_germany_desc: "Fasisme terus mengalami kebangkitan yang mengerikan, dan meskipun hal ini mungkin sulit untuk diterima, kita mungkin perlu melakukan kolaborasi ekonomi untuk menjauhkan mereka dari kita."
 SWI_axis_gold: "Sumbu Emas"
 SWI_axis_gold_desc: "Menjadi negara netral berarti pasar kita tetap terbuka untuk semua negara, dan ini merupakan keuntungan yang bisa kita manfaatkan. Dengan membuka pasar emas untuk [SWI_biggest_fascist.GetNameDef] kita dapat menyatukan perekonomian kita untuk menenangkan mereka dan meningkatkan perekonomian kita berdua."
 SWI_spirit_of_resistance: "Semangat Perlawanan"
 SWI_spirit_of_resistance_desc: "Hati dan pikiran masyarakat [ROOT.GetName] adalah garda terdepan dalam perjuangan untuk kelangsungan hidup kita. Kita harus memastikan setiap warga [ROOT.GetAdjective] kita siap berjuang sampai akhir, bahkan ketika semuanya tampak kalah."
 SWI_pro_helvetia: "Pro Helvetia"
 SWI_pro_helvetia_desc: "Pertahanan Spiritual [ROOT.GetName] mengharuskan budaya [ROOT.GetAdjective] tetap tunggal, tidak dapat dipisahkan, dan berbeda dari budaya tetangga kita. Organisasi baru ini, Pro Helvetia, akan melestarikan dan mempromosikan nilai-nilai bersama Swiss, yang sangat terikat dengan Demokrasi kita, dan memastikan kelangsungan hidup kita dari tekanan yang berlebihan."
 SWI_spirit_of_saint_bernard: "Semangat Santo Bernard"
 SWI_spirit_of_saint_bernard_desc: "Sejak dahulu kala kami bangga atas tradisi medis kami dan kesediaan kami untuk membantu orang yang membutuhkan. Rumah Sakit Great Saint Bernard dan organisasi Palang Merah adalah buktinya. Kini semangat tersebut dapat dijadikan senjata dan diorientasikan kembali kepada milisi untuk memperkuat upaya pertahanan kita."
 SWI_adopt_romansh: "Mengadopsi Bahasa Rumantsch"
 SWI_adopt_romansh_desc: "[ROOT.GetName] bukanlah negara yang dibentuk oleh wilayah [GER.GetAdjective], [FRA.GetAdjective] dan [ITA.GetAdjective] yang dimaksudkan untuk diklaim oleh tetangga kita yang rakus. [ROOT.GetName] adalah bangsa multikultural yang tunggal dan tidak dapat dipisahkan. Mengadopsi Rumantsch, bahasa yang hanya digunakan di pegunungan [ROOT.GetAdjective] Pegunungan Alpen kami akan menunjukkan kepada mereka budaya dan nilai-nilai kami berbeda dari mereka, apa pun bahasanya."
 SWI_patriotic_shooting_clubs: "Klub Menembak Patriotik"
 SWI_patriotic_shooting_clubs_desc: "[ROOT.GetName] memiliki tradisi lama dalam klub dan kompetisi penembak jitu. Beberapa penembak jitu rekreasional kami lebih terampil dibandingkan penembak jitu profesional negara lain. Kita dapat memanfaatkan klub-klub ini dan mengintegrasikan mereka ke dalam milisi kita, untuk meningkatkan kemampuan pertahanan kita."
 SWI_aktion_nationaler_widerstand: "Aksi Nasional Lebih Luas"
 SWI_aktion_nationaler_widerstand_desc: "Ada sekelompok kecil warga sipil di setiap bagian masyarakat [ROOT.GetAdjective] yang bersedia bekerja sama secara diam-diam untuk mempengaruhi masyarakat. Tujuan mereka adalah untuk melawan sikap mengalah, menginspirasi persatuan dan meletakkan dasar bagi perlawanan di [ROOT.GetName] jika terjadi invasi."
 SWI_heer_und_haus: "Heer dan Haus"
 SWI_heer_und_haus_desc: "Rakyat Swiss, dan juga tentaranya, perlu didorong dari dalam untuk melawan dan berjuang demi mempertahankan tanah air mereka. Untuk diingatkan akan apa yang dipertaruhkan, Pro Helvetia, dengan bantuan kelompok Aktion Nationaler Widerstand menjadi kunci bagi mereka untuk berpikir dan bertindak [ROOT.GetAdjective]"
 SWI_ortswehren: "Ortswehren"
 SWI_ortswehren_desc: "Perang total berarti setiap warga [ROOT.GetAdjective] harus siap mempertahankan wilayahnya, namun tidak semua orang dapat bergabung dengan milisi kami. Kita dapat membentuk penjaga lokal sebagai tulang punggung yang dapat diandalkan oleh milisi untuk mendukung upaya mereka mempertahankan [SWI.GetName]."
 SWI_luftschutz: "Luftschutz"
 SWI_luftschutz_desc: "Perang telah berubah, udara adalah ranah peperangan yang baru dan kita tidak bisa membiarkannya menjadi kelemahan kita. Pasukan pertahanan udara lokal harus dibentuk, diawaki oleh warga sipil, dan dilengkapi dengan peralatan untuk mendeteksi dan menangani ancaman udara. Tidak ada gunanya mempertahankan gunung jika mereka bisa melampaui gunung!"
 SWI_train_swiss_women: "Latih Wanita Swiss"
 SWI_train_swiss_women_desc: "Jika kita ingin mempertahankan negara kita sekuat tenaga, maka tidak masuk akal jika kita mengecualikan separuh populasi kita dari upaya kita. [ROOT.GetAdjective] perempuan harus dilatih untuk ikut berjuang demi kelangsungan hidup kita."
 SWI_ban_national_movement_for_switzerland: "Larang Gerakan Nasional untuk Swiss"
 SWI_ban_national_movement_for_switzerland_desc: "Kaum fasis, sama seperti kecoak, mempunyai kecenderungan bersembunyi di sudut dan celah masyarakat, memanfaatkan kelalaian kita untuk mendapatkan kekuatan hingga terlambat untuk melawan mereka. Tidak lagi! Tampilan dan nama baru mereka tidak akan membodohi kita, kita harus menyerang dengan tegas jika ingin mempertahankan Demokrasi kita."
 SWI_fortify_austrian_border: "Perkuat Perbatasan Austria"
 SWI_fortify_austrian_border_desc: "Sekarang Austria berada di tangan musuh potensial, kita tidak bisa mengambil risiko memiliki sayap terbuka yang bisa dimanfaatkan musuh jika terjadi perang. Sama halnya dengan perbatasan dengan [GER.GetNonIdeologyName], front ini harus kita perkuat."
 SWI_seek_allied_trade: "Carilah Perdagangan Sekutu"
 SWI_seek_allied_trade_desc: "Dengan adanya musuh di sekitar kita, kita perlu mengamankan perdagangan penting dengan Sekutu untuk bertahan hidup. Jika kita beruntung, kita bisa terhindar dari kemarahan negara-negara tetangga kita yang ingin melakukan perdagangan lebih dekat dengan pesaing mereka."
 SWI_case_north: "Kasus Utara"
 SWI_case_north_desc: "Kita tidak bisa mengesampingkan perang melawan [?SWI.SWI_biggest_fascist.GetNameDef], kita harus siap menghadapinya. Rencana perlu disusun, perbekalan harus dialokasikan, parit harus digali, dan tentara dipersenjatai."
 SWI_freeze_german_assets: "Bekukan Aset Jerman"
 SWI_freeze_german_assets_desc: "Selama bertahun-tahun [?SWI.SWI_biggest_fascist.GetNameDef] telah menggunakan kenetralan kami, dan celah dalam sistem perbankan kami untuk melindungi kekayaan haram mereka dan menjaga perekonomian mereka tetap bertahan. Kewajiban moral harus diutamakan dibandingkan netralitas mutlak, meskipun kita yakin hal ini akan mempunyai dampak buruk."
 SWI_fund_resistance_groups: "Kelompok Perlawanan Dana"
 SWI_fund_resistance_groups_desc: "Negara-negara Eropa telah berperang satu sama lain dan menundukkan orang-orang di setiap benua selama berabad-abad. Adalah tugas masyarakat [ROOT.GetAdjective] untuk membantu para korban perang yang tiada henti di benua kita, dengan memberi mereka alat untuk mematahkan belenggu dan menentukan masa depan mereka sendiri."
 SWI_citizen_supply_mandate: "Mandat Pasokan Warga"
 SWI_citizen_supply_mandate_desc: "Kami tidak tahu bagaimana suatu invasi akan terjadi, dan bahkan jika kami dapat mengandalkan jaringan pasokan terpusat, hal itu tidak sesuai dengan struktur komando kami. Itulah sebabnya setiap rumah tangga [ROOT.GetAdjective] harus menyimpan persediaan setidaknya selama 2 bulan di rumah mereka sendiri, baik untuk mereka maupun untuk milisi lokal."
 SWI_prepare_infrastructure_and_industry: "Menyiapkan Infrastruktur dan Industri"
 SWI_prepare_infrastructure_and_industry_desc: "Membela suatu negara tidak hanya tentang membangun benteng, kita juga perlu memperkuat infrastruktur di Pegunungan Alpen agar pergerakan pasukan dan barang-barang sipil menjadi lebih efisien, serta basis industri yang lebih besar di Dataran Tinggi dapat dikembangkan lebih lanjut."
 SWI_build_up_military_readiness: "Membangun Kesiapan Militer"
 SWI_build_up_military_readiness_desc: "Tugas mempersiapkan penduduk Swiss tidak pernah ada habisnya. Kita tidak bisa berhenti sampai ancaman invasi hilang, dan hal itu mungkin tidak akan pernah terjadi. Kita harus mengarahkan negara kita pada persiapan defensif tanpa penundaan."
 SWI_support_active_militias_continuous_focus: "Mendukung Milisi Aktif"
 SWI_support_active_militias_continuous_focus_desc: "Warga negara kami dipersenjatai dan dikerahkan ke dalam milisi lokal, tugas setiap orang adalah mendukung mereka semampu mereka agar kami dapat menjauhkan musuh-musuh konfederasi."
 SWI_rig_infrastructure_to_blow_TT: "Ketika salah satu negara inti kita direbut oleh musuh, semua §YInfrastruktur§!, §YKereta Api§!, §YPusat Pasokan§! dan §YBunkers§! akan rusak total. §YMiliter§! dan §YPabrik Sipil§! akan rusak sebagian."
 SWI_create_anti_tank_template_TT: "Templat untuk §YMisi Swiss anti-Tank§! akan dibuat"
##### Submit to Germany #####
 SWI_closer_ties_with_germany: "Ikatan Lebih Dekat dengan [SWI_get_fascist_neighbor_cap]"
 SWI_closer_ties_with_germany_desc: "Kita mempunyai tetangga yang kuat dan berbahaya di Utara. Jika kita ingin bertahan hidup, ada baiknya kita tetap berada di sisi baik mereka, jadi mendekati mereka untuk mencari hubungan yang lebih baik, sambil menjaga sikap netral, sangatlah penting."
 SWI_panoramaheim_branch: "Panoramaheim"
 SWI_panoramaheim_branch_desc: "Ada sebuah rumah di Stuttgart, mereka menyebutnya 'Rumah Panorama' dan telah menjadi sumber dari banyak operasi kolom kelima dengan tujuan mendestabilisasi pemerintahan [ROOT.GetAdjective], membuka pintu bagi rezim yang dipimpin fasis."
 SWI_the_national_front: "Front Nasional"
 SWI_the_national_front_desc: "Front Nasional adalah partai fasis terkemuka di [ROOT.GetNonIdeologyName], jika ada yang ingin mengambil alih kekuasaan di negara yang cenderung demokratis ini, maka merekalah yang menentukan. Beberapa anggota berpangkat tinggi sudah mempunyai hubungan dekat dengan [GER.GetNameDef], yang dapat menghasilkan semacam perlindungan dari mereka, jika atau ketika perang dimulai."
 SWI_infiltrate_federal_police: "Menyusup ke Polisi Federal"
 SWI_infiltrate_federal_police_desc: "Dengan mandat mereka untuk membasmi propaganda asing dan kekuatan non-demokratis, Polisi Federal adalah tempat yang ideal untuk menyusup dan mencegah faksi kita sendiri menjadi sasaran. Pada akhirnya hal ini juga akan memungkinkan kita untuk melenyapkan musuh-musuh kita dengan berkedok keamanan nasional."
 SWI_the_petition_of_the_200: "Petisi 200"
 SWI_the_petition_of_the_200_desc: "200 anggota dari berbagai partai yang mewakili [ROOT.GetAdjective] fasisme dan otoritarianisme telah mengajukan petisi ini kepada Majelis meminta agar demi kepentingan pelestarian diri, kami mulai menerima dan berkolaborasi dengan [GER.GetNameDef]"
 SWI_case_west: "Kasus Barat"
 SWI_case_west_desc: "Kita harus siap menghadapi segala skenario yang mungkin terjadi. [FRA.GetName] merupakan ancaman yang sama besarnya dengan [GER.GetNameDef] dan harus ditangani sebagaimana mestinya. Kita harus mempersiapkan tentara dan negara kita untuk berperang melawan [FRA.GetAdjective] atau kita mengambil risiko kematian [ROOT.GetNonIdeologyName]."
 SWI_german_industrial_investments: "[SWI_get_fascist_neighbor_adjective] Investasi Industri"
 SWI_german_industrial_investments_desc: "Kekuatan industri [?SWI.SWI_biggest_fascist.GetNonIdeologyName] tidak dapat disangkal. Jika kita ingin selamat dari perang yang akan datang, kita memerlukan basis industri kita sendiri untuk bersaing dan digunakan sebagai pengaruh. [?SWI.SWI_biggest_fascist.GetNameDefCap] berinvestasi pada kami juga berarti mereka memiliki alasan untuk menjaga [ROOT.GetNonIdeologyName] tetap utuh."
 SWI_complete_siegfried_line: "Selesaikan Garis Siegfried"
 SWI_complete_siegfried_line_desc: "[GER.GetNameDefCap] telah membangun penghalang yang mengesankan untuk bertahan melawan [FRA.GetName], dan kami memiliki alasan untuk percaya bahwa kami juga perlu bertahan melawan mereka, khususnya karena kami semakin selaras dengan [GER.GetNonIdeologyName], inilah sebabnya kami harus berkoordinasi dan membangun pertahanan yang saling melengkapi."
 SWI_military_exercises_with_germany: "Latihan Militer dengan [SWI_get_fascist_neighbor]"
 SWI_military_exercises_with_germany_desc: "Meskipun mereka memiliki sikap bermusuhan terhadap nilai-nilai demokrasi tradisional, [SWI_get_fascist_neighbor] dapat menjadi sekutu yang berharga ketika tiba waktunya untuk membela diri, dan lebih baik lagi, hal ini akan mengurangi kemungkinan terjadinya invasi dari mereka."
 SWI_abandon_neutrality: "Abaikan Netralitas"
 SWI_abandon_neutrality_desc: "Pihak-pihak sedang dipilih di seluruh Eropa, kita tidak bisa dianggap remeh. Satu-satunya solusi yang jelas adalah meninggalkan sikap netral historis kita dan mencari perlindungan [SWI_get_fascist_neighbor], atau berisiko terjebak di antara batu dan tempat yang sulit."
 SWI_promote_tobler: "Promosikan Tobler"
 SWI_promote_tobler_desc: "Sebagai satu-satunya anggota partai fasis yang terpilih menjadi anggota Parlemen [ROOT.GetAdjective] dan pemimpin Front Nasional, Robert Tobler adalah kandidat yang jelas untuk memimpin [ROOT.GetNonIdeologyName] menuju transisi yang lambat namun pasti dari negara pluralis demokratis menjadi [SWI_get_fascist_neighbor_adjective] Sekutu yang diperintah oleh tangan besi. Ini tentu saja berarti pemecatan Rolf Henne dari partai, hanya ada satu Fuhrer."
 SWI_promote_henne: "Promosikan Henne"
 SWI_promote_henne_desc: "Sebagai pendukung kuat fasisme dan kolaborasi dengan [SWI_get_fascist_neighbor], Rolf Henne adalah kandidat utama untuk memimpin Front Nasional dan [ROOT.GetName] menjadi negara klien [SWI_get_fascist_neighbor_adjective], yang tentunya akan memberikan manfaat, salah satunya adalah keselamatan dan kelangsungan hidup kita. Hal ini tentu saja berarti pemecatan Robert Tobler dari partai, karena dia tidak bersedia melakukan apa pun."
 SWI_propagandize_swiss_military_tradition: "Mempropagandakan Tradisi Militer Swiss"
 SWI_propagandize_swiss_military_tradition_desc: "Ini bukan waktunya untuk mengenang masa lalu demokrasi kita. Sebaliknya, kita harus fokus pada tradisi bela diri kita; [ROOT.GetAdjective] infanteri dan pemanah panah terkenal karena disiplin dan efektivitasnya, dipekerjakan di seluruh dunia sebagai tentara bayaran yang didambakan, jika kita ingin selamat dari perang yang akan datang, kita perlu mengingatkan rakyat kita akan sejarah militer mereka."
 SWI_ban_democratic_party: "Larang Partai Demokrat"
 SWI_ban_democratic_party_desc: "Partai-partai demokrasi kita mempertaruhkan pendekatan kita terhadap [SWI_get_fascist_neighbor], jika kita ingin lebih memihak mereka, itu berarti kita harus melakukan apa yang beberapa tahun lalu tidak terpikirkan dan menyingkirkan partai-partai politik demokratis kita. Jika ini adalah pengorbanan yang harus kita lakukan, biarlah."
 SWI_centralize_switzerland: "Sentralisasi Swiss"
 SWI_centralize_switzerland_desc: "[ROOT.GetNonIdeologyName] yang kita tuju jauh berbeda dari Konfederasi Swiss lama yang kita miliki selama hampir satu abad. Kita tidak lagi menjadi sebuah konfederasi, tapi sebuah negara terpusat yang kekuasaannya berasal dari atas dan mengalir dari bawah masyarakat."
 SWI_german_military_collaboration: "[SWI_get_fascist_neighbor_adjective] Kolaborasi Militer"
 SWI_german_military_collaboration_desc: "Kita kekurangan pengalaman dalam peperangan yang diperlukan agar militer kita bisa berkembang di dunia modern. Di sinilah [?SWI.SWI_biggest_fascist.GetName] berperan, angkatan bersenjata mereka adalah kekuatan yang harus diperhitungkan, dan berkolaborasi dengan mereka akan memungkinkan kita untuk mempertahankan diri, dan bahkan mungkin menyerang negara lain terlebih dahulu."
 SWI_join_the_axis: "Bergabunglah dengan Poros"
 SWI_join_the_axis_desc: "Ini dia. Ini adalah pertaruhan kami untuk kelangsungan hidup [ROOT.GetNonIdeologyName] dalam badai yang akan datang; kami akan bergabung dalam badai di bawah panji faksi [?SWI.SWI_biggest_fascist.GetName]. Semoga kita mengambil keputusan yang tepat."
 SWI_become_german_puppet: "Menjadi Boneka [SWI_get_fascist_neighbor_adjective]"
 SWI_become_german_puppet_desc: "Henne telah mendedikasikan karirnya untuk momen ini. Semacam Anschluss milik [ROOT.GetNonIdeologyName]. Sekalipun kita kehilangan kedaulatan kita yang telah lama ada, kita mungkin akan mendapatkan sebagian dari sisa-sisa mereka. Kami hanya bisa berharap ini tidak berarti kehancuran kami."
 SWI_ask_for_vorarlberg: "Minta _[848.GetName]"
 SWI_ask_for_vorarlberg_desc: "Kini setelah kami berada di bawah naungan [?SWI_fascist_overlord.GetName] selama beberapa waktu dan membuktikan kesetiaan kami, inilah saatnya mereka memercayai kami dengan apa yang menjadi hak kami. [848.GetName] memilih untuk bergabung dengan kami ketika [ROOT.GetNonIdeologyName] masih merupakan konfederasi demokratis sehingga tidak ada keraguan mereka ingin bergabung dengan bentuk kami saat ini."
 SWI_size_and_opinion_chance_tooltip: "Mereka akan lebih cenderung menerima berdasarkan §Yukuran§! angkatan bersenjata kita dan §Ypendapat§! kita."
 SWI_request_austrian_occupation: "Minta [AUS.GetAdjective] Pekerjaan"
 SWI_request_austrian_occupation_desc: "[ROOT.GetNonIdeologyName] telah mencaplok [848.GetName] sama sekali bukan bentuk final kami. Kami dapat membuktikan [?SWI_fascist_overlord.GetName] bahwa kami dapat menangani administrasi wilayah yang lebih luas, meringankan beban mereka dan menjadikan [ROOT.GetFactionName] sebagai mesin perang yang lebih efisien."
 SWI_request_italian_alps_occupation: "Minta [ITA.GetAdjective] Pekerjaan"
 SWI_request_italian_alps_occupation_desc: "Karena sebagian negara kita terdiri dari warga negara yang berbahasa [ITA.GetAdjective], kita dapat dengan mudah melakukan transisi ke administrasi [ITA.GetName] dan memanfaatkan sumber daya manusia serta sumber dayanya untuk melanjutkan upaya kita menyelesaikan perang ini."
 SWI_request_french_alps_occupation: "Minta [FRA.GetAdjective] Pekerjaan"
 SWI_request_french_alps_occupation_desc: "[FRA.GetNonIdeologyName] sudah mendambakan tanah kita dari generasi ke generasi, sudah sepantasnya kita kini berada dalam posisi dimana kita bisa mengambil alih kendali atas wilayah mereka dan mengelolanya demi masa depan keduanya."
 SWI_the_alpine_supremacy: "Supremasi Alpen"
 SWI_the_alpine_supremacy_desc: "[SWI.GetNonIdeologyName], bangsa yang lemah lembut dan tidak memiliki arah yang ada dalam dunia diplomasi sudah tidak ada lagi. Kami sekarang akan dikenal sebagai Supremasi Alpine, untuk mewakili kekuasaan kami atas Pegunungan Alpen, penduduknya, dan sekitarnya."
 SWI_professionalize_militias: "Profesionalisasikan Milisi"
 SWI_professionalize_militias_desc: "Melihat keadaan yang terjadi, milisi biasa yang terdiri dari pasukan cadangan tidak akan cukup. Kita perlu melatih setiap orang yang mampu menghadapi konflik yang akan datang dan menjadikan mereka tentara profesional yang patut ditakuti."
 SWI_modernize_airforce: "Modernisasi Angkatan Udara"
 SWI_modernize_airforce_desc: "Kini jelas bahwa peperangan modern ditentukan tidak hanya oleh apa yang terjadi di medan perang, namun juga di atasnya, di udara terbuka yang ingin kita pertahankan dan dominasi."
 SWI_swiss_airplane_designs: "Desain Pesawat Swiss"
 SWI_swiss_airplane_designs_desc: "Kita tidak bisa bergantung pada tetangga kita untuk mendapatkan peralatan yang memungkinkan kita menguasai angkasa, karena kita tidak bisa mempercayai mereka untuk dengan patuh memberi kita alat untuk mengalahkan mereka."
 SWI_license_axis_plane_designs: "Desain Pesawat Sumbu Lisensi"
 SWI_license_axis_plane_designs_desc: "Cara tercepat untuk terbang ke angkasa adalah dengan membeli desain pesawat dari negara-negara fasis. Hanya mereka yang memiliki pengalaman tempur baru-baru ini yang diperlukan untuk memprioritaskan apa yang benar-benar memenangkan pertempuran, dan hal ini akan membuat kita lebih dekat dengan mereka, dan mungkin menghalangi mereka untuk menyerang."
 SWI_airspace_surveillance: "Pengawasan Wilayah Udara"
 SWI_airspace_surveillance_desc: "Jika kita ingin mempertahankan [ROOT.GetName] dan gunung-gunungnya, kita harus tetap menatap ke langit untuk mencari musuh. Peralatan baru akan memungkinkan kita menemukan musuh dan mengarahkan mereka ke jangkauan pesawat tempur dan senjata anti-udara kita."
 SWI_professionalize_militias_TT: "Semua divisi §YMilisi Warga Negara Swiss§! akan menjadi §Ydivisi Infanteri Reguler§! dan keputusan §Y$SWI_military_readiness_decisions_category$§! akan dinonaktifkan."
 SWI_neutrality_decisions_disabled_TT: "Keputusan §Y$SWI_absolute_neutrality_decisions_category$§! akan dinonaktifkan."
 SWI_has_fascist_neighbor_trigger_TT: "Memiliki Tetangga fasis yang cocok"
 SWI_crack_down_on_dissent: "Menindak Perbedaan Pendapat"
 SWI_crack_down_on_dissent_desc: "[ROOT.GetNonIdeologyName] tidak dapat dipecah belah pada saat dimana satu celah saja dalam masyarakat kita dapat menyebabkan runtuhnya pemerintahan [ROOT.GetAdjective]."
 SWI_military_police: "Polisi Militer"
 SWI_military_police_desc: "Institusi federal yang sudah lama kita miliki tidak akan cukup untuk menjaga ketertiban yang kita perlukan di masa yang tidak menentu ini. Polisi militer akan dibutuhkan jika kita ingin menjaga persatuan kita."
 SWI_expand_federal_police_intelligence: "Perluas Intelijen Polisi Federal"
 SWI_expand_federal_police_intelligence_desc: "Musuh mengintai dalam bayang-bayang dan dapat mengambil bentuk apa pun, termasuk populasi kita sendiri. Inilah sebabnya mengapa Departemen Intelijen Kepolisian Federal harus mempunyai alat untuk menghancurkan perbedaan pendapat di mana pun mereka berada."
 SWI_martial_law: "Darurat Militer"
 SWI_martial_law_desc: "Beberapa situasi memerlukan pisau bedah, namun saat ini tidak ada hal tersebut, [ROOT.GetNameDef] membutuhkan palu yang dapat dipercaya untuk menjaga musuh dan populasi kita tetap terkendali."
####### Weapons Industry Sub Branch ####### 
 SWI_expand_weapons_industry: "Memperluas Industri Senjata"
 SWI_expand_weapons_industry_desc: "Kapasitas industri militer kita yang kecil tidak akan cukup dalam perang habis-habisan. Konflik modern dimenangkan oleh siapa pun yang kehabisan peluru terakhir, jadi kita harus memastikan bahwa kita dapat membuat perlengkapan perang dengan lebih cepat dan lebih lama."
 SWI_swiss_armored_divisions: "Divisi Lapis Baja Swiss"
 SWI_swiss_armored_divisions_desc: "Secara historis kami bangga memiliki infanteri yang luar biasa, namun itu tidak cukup ketika melawan raksasa lapis baja musuh kami. Kita harus membuat monster mekanis kita sendiri."
 SWI_alpine_specialization: "Spesialisasi Alpen"
 SWI_alpine_specialization_desc: "Dibandingkan dengan negara lain, kami dapat menganut tradisi pegunungan dan melatih kekuatan yang tak terhentikan yang mampu mempertahankan dan menyerang pegunungan dengan cara yang tiada duanya. Mereka akan menjadi longsoran salju yang akan melenyapkan musuh."
 SWI_tank_development: "Pengembangan Tangki"
 SWI_tank_development_desc: "Kita tidak boleh lengah dalam pengembangan tank baru dan lebih baik, atau kita berisiko membuang-buang baja untuk membeli penyu logam yang tidak berguna dan usang."
 SWI_mechanized_support: "Dukungan Mekanis"
 SWI_mechanized_support_desc: "Prajurit kita harus pergi ke medan perang lebih cepat dari sebelumnya, sehingga memerlukan dukungan yang mereka butuhkan, jika tidak, semua upaya itu akan sia-sia."
 SWI_artillery: "Artileri Swiss"
 SWI_artillery_desc: "Biarkan peluru menghujani musuh kita seiring kemajuan pasukan kita. Artileri akan memungkinkan [ROOT.GetNonIdeologyName] untuk bertahan dari pegunungan dan menyerang ke depan dengan cara yang paling efektif, menghancurkan lawan di bawah hujan timah."
 SWI_industrial_production: "Produksi Industri"
 SWI_industrial_production_desc: "Kita tidak bisa mengabaikan sisi depan rumah. Setiap orang yang mampu di wilayah [ROOT.GetNonIdeologyName] harus rela mengorbankan dirinya demi mesin perang kita."
 SWI_swiss_heavy_planes: "Pesawat Berat Swiss"
 SWI_swiss_heavy_planes_desc: "Dari pangkalan kami di [ROOT.GetNonIdeologyName] kami dapat meluncurkan operasi ke negeri yang jauh jika kami memiliki pesawat berat yang diperlukan untuk perjalanan tersebut, namun kami harus merancangnya terlebih dahulu."
 SWI_air_research: "Penelitian Udara"
 SWI_air_research_desc: "Kami siap untuk meningkatkan penelitian dan pengembangan teknologi udara baru jika kami ingin mengimbangi kemajuan musuh dan pada akhirnya mampu mendominasi angkasa."
 SWI_air_production: "Produksi Udara"
 SWI_air_production_desc: "Memiliki desain pesawat untuk terbang hanyalah bagian pertama dari teka-teki, selanjutnya adalah memproduksi pesawat dalam jumlah yang cukup sehingga pilot kita selalu bisa mengudara untuk melawan musuh di darat dan langit."
 SWI_mountaneer_paratroopers: "Pasukan Terjun Payung Pendaki Gunung"
 SWI_mountaneer_paratroopers_desc: "[ROOT.GetNonIdeologyName] dikenal di seluruh dunia karena puncak-puncaknya yang menakjubkan, dan banyak penduduk kita yang menganggap pegunungan sebagai rumahnya. Kita dapat menggunakan keuntungan ini untuk melatih pasukan terjun payung yang unggul, kekuatan yang dapat turun dari langit asing dan merebut gunung asing demi kejayaan [ROOT.GetNameDef]."
####### Allied/Aggrocratic ####### 
 SWI_purchase_american_planes: "[SWI_purchase_democratic_planes_title]"
 SWI_purchase_american_planes_usa: "Beli Pesawat Amerika"
 SWI_purchase_american_planes_other: "Beli Pesawat dari Negara Demokrat"
 SWI_purchase_american_planes_desc: "Angkatan udara kita kekurangan jumlah dan teknologi yang diperlukan untuk mempertahankan diri secara efektif, jadi kita harus mencari tempat lain untuk mendapatkan peralatan kita. [SWI_purchase_american_planes_second_paragraph]"
 SWI_american_planes_desc_usa: "Jika kita akan membeli pesawat dari negara lain, [USA.GetNameDef], dengan tradisi Demokrasi, netralitas relatif, dan teknik penerbangan yang luar biasa adalah kandidat yang ideal."
 SWI_american_planes_desc_other: "Karena kita tidak bisa mengkompromikan nilai-nilai demokrasi kita hanya untuk beberapa pesawat, penting bagi kita untuk mendapatkan peralatan dari negara demokrasi lain, dan [?SWI.SWI_best_dem_ally.GetNameDef] sepertinya merupakan pilihan terbaik."
 SWI_allied_gold: "Emas Sekutu"
 SWI_allied_gold_desc: "Badai dan sanksi yang terjadi saat ini telah membuat perdagangan emas menjadi lebih terbatas dan sulit, namun dengan sikap netral kita, kita dapat membuka kemungkinan peningkatan perdagangan emas dengan negara-negara demokratis lainnya, sehingga menopang perekonomian demokratis untuk menjauhkan fasisme."
 SWI_closer_democratic_ties: "Ikatan Demokratik yang Lebih Dekat"
 SWI_closer_democratic_ties_desc: "Ketika otokrasi membayangi Eropa Kita mungkin tidak bisa berjuang sendiri, namun dengan berkolaborasi dengan negara-negara demokratis lainnya, kita mungkin bisa menghentikan kemajuannya. Langkah pertama adalah menjalin hubungan yang lebih erat dengan mereka dan membuktikan kepada mereka bahwa kita dapat berkontribusi terhadap perjuangan ini."
 SWI_connect_to_the_maginot_line: "Hubungkan ke Jalur Maginot"
 SWI_connect_to_the_maginot_line_desc: "Angin perang bertiup ke arah [FRA.GetName], dan ada kemungkinan besar musuh-musuhnya harus menyerang di Jalur Maginot, ini menempatkan kita dalam situasi berbahaya karena [?SWI.SWI_biggest_fascist.GetNonIdeologyName] mungkin tergoda untuk menghindarinya dengan menyerang kita. Oleh karena itu kita harus berkoordinasi dengan [FRA.GetName] dan menciptakan front persatuan."
 SWI_american_industrial_investments: "Investasi Industri Amerika"
 SWI_american_industrial_investments_desc: "Perang Besar memperjelas bahwa kekuatan industri [USA.GetAdjective] dapat mengubah keadaan menjadi menguntungkan mereka. Jika kita mendekati mereka dan berhasil mendapatkan investasi industri dari mereka, kita dapat memperkuat posisi kita dan memastikan bahwa mempertahankan kemerdekaan adalah demi kepentingan terbaik mereka."
 SWI_take_a_stance: "Ambil Sikap"
 SWI_take_a_stance_desc: "Fasis [?SWI_biggest_fascist.GetNonIdeologyName] memiliki sistem politik yang paling menjijikkan dan menyedihkan. [?SWI_biggest_fascist.GetNameDefCap] adalah musuh bebuyutan [SWI.GetName] baru; inilah sebabnya kita harus mengambil sikap dan mempertahankan demokrasi kita dengan cara apa pun."
 SWI_join_france: "Bergabunglah dengan Prancis"
 SWI_join_france_desc: "Meskipun tidak selalu merupakan hubungan persahabatan, [ROOT.GetName] dan [FRA.GetName] memiliki nilai-nilai demokrasi dan bahkan bahasa yang sama, jadi jika kita harus memilih salah satu pihak dalam konflik yang akan datang, perlindungan mereka jelas lebih diinginkan daripada alternatif lainnya."
 SWI_the_second_helvetic_republic: "Republik Helvetik Kedua"
 SWI_the_second_helvetic_republic_desc: "Pada tahun 1798, diktator terkenal Napoleon Bonaparte menaklukkan [ROOT.GetName] dan mendirikan Republik Helvetik sebagai alat untuk menundukkan rakyat kita. Beruntung bagi kami, hari-hari tersebut telah berlalu dan kami dapat yakin bahwa untuk kedua kalinya kami dapat mengharapkan persatuan yang lebih adil dengan tetangga lama kami."
 SWI_alpine_aspirations: "Aspirasi Alpen"
 SWI_alpine_aspirations_desc: "Pemerintah pusat [ROOT.GetNonIdeologyName] telah berkembang dan berkembang menjadi Republik Helvetik, kami sekarang memiliki sumber daya untuk mengelola wilayah yang lebih besar. Kita harus meminta [FRA.GetNameDef] untuk memperluas zona kendali kita sehingga kita lebih dekat untuk menyatukan pegunungan Alpen di bawah satu bendera."
 SWI_support_allied_espionage: "Mendukung Spionase Sekutu"
 SWI_support_allied_espionage_desc: "Fakta bahwa kami mempertahankan kebijakan luar negeri yang netral tidak menghalangi kami untuk secara subversif mendukung negara-negara demokratis lainnya dalam upaya mereka untuk menekan fasisme di Eropa. Faktanya, netralitas dan kedekatan kami dengan [?SWI.SWI_biggest_fascist.GetNameDef] menjadikan kami penting dalam perjuangan internasional melawan Fasisme."
 SWI_expand_spy_networks: "Perluas Jaringan Mata-Mata"
 SWI_expand_spy_networks_desc: "Musuh ada di luar sana, kita harus berusaha mempertahankan perbatasan dan wilayah kita sebelum bahaya datang. Jaringan spionase kita dapat menjadi basis pertahanan yang tetap terlihat netral dan tidak menyerang dari luar."
 SWI_share_spy_networks: "Bagikan Jaringan Mata-Mata"
 SWI_share_spy_networks_desc: "Tujuan [?SWI.SWI_best_dem_ally.GetNameDefCap] sama dengan tujuan kita, yaitu untuk menjauhkan Fasisme, dan kita tidak perlu memusuhi [?SWI.SWI_biggest_fascist.GetNameDef] untuk mencapainya. [ROOT.GEtName] memiliki akses terhadap operator berpengalaman yang dapat berbaur dengan masyarakat [GER.GetAdjective], [ITA.GetAdjective] dan [FRA.GetAdjective]; Kami dapat meminjamkan keunggulan itu kepada [?SWI.SWI_best_dem_ally.GetNonIdeologyName]."
 SWI_secret_pact_with_the_allies: "Pakta Rahasia dengan Sekutu"
 SWI_secret_pact_with_the_allies_desc: "[ROOT.GetName] belum siap untuk berperang habis-habisan, atau bahkan secara terbuka bergabung dengan suatu faksi, tapi kita bisa yakin bahwa kita tidak akan aman tanpa teman. Untuk mempertahankan demokrasi kita jika terjadi invasi mendadak, kita dapat bertemu secara diam-diam dengan [?SWI.SWI_best_dem_ally.GetNameDef] dan membuat kesepakatan. Kami akan berjanji untuk secara diam-diam mendukung mereka untuk mulai bersiap bergabung dalam perang, sebagai imbalannya, mereka akan melindungi kami jika kami diserang."
 SWI_oasis_of_democracy: "Oasis Demokrasi"
 SWI_oasis_of_democracy_desc: "Musuh-musuh Demokrasi mengelilingi [ROOT.GetName], jadi di masa yang penuh gejolak ini kita harus berdiri teguh dalam komitmen terhadap nilai-nilai kita. [ROOT.GetName] dan demokrasinya tidak dapat dipisahkan, jadi tidak ada gunanya bertahan sebagai sebuah negara jika demokrasi kita musnah untuk mempertahankannya."
 SWI_oasis_of_democracy_tt: "Ketika fokus §Y$SWI_axis_gold$§! selesai dan setidaknya §Y1§! negara fasis mempunyai semangat §Y$SWI_gold_trade$§!:"
 SWI_volunteer_force: "Angkatan Relawan"
 SWI_volunteer_force_desc: "Kita belum berperang, tapi rakyat [ROOT.GetAdjective] siap memperjuangkan demokrasi. Kita tidak bisa dianggap melanggar netralitas, namun sebagai negara demokrasi, kita tidak bisa mengontrol ke mana rakyat kita pergi, dan ke mana mereka berperang, sehingga kita bisa secara diam-diam mendorong angkat senjata melawan tirani, sebagai persiapan bagi [ROOT.GetName] lainnya untuk secara terbuka bergabung dalam upaya tersebut."
 SWI_export_saboteurs: "Ekspor Penyabot"
 SWI_export_saboteurs_desc: "Kita tidak perlu ikut perang jika kita bisa menghancurkan musuh kita dari dalam. Badan intelijen kita dapat menyempurnakan operasi kita untuk mengkhususkan diri dalam melakukan agitasi dan meningkatkan perlawanan di wilayah-wilayah yang diduduki oleh para penindas, dan perlahan-lahan mengikis kekuasaan mereka."
 SWI_lay_the_groundwork: "Letakkan Dasarnya"
 SWI_lay_the_groundwork_desc: "Untuk bersiap menghadapi perang habis-habisan, pertama-tama kita memerlukan basis yang baik. Infrastruktur dan jaringan transportasi [ROOT.GetName] harus ditingkatkan dan dimodernisasi. Hanya dengan cara inilah warga negara kita dapat dimobilisasi secara efisien ke garis depan."
 SWI_arsenal_of_the_alps: "Gudang senjata Pegunungan Alpen"
 SWI_arsenal_of_the_alps_desc: "Puncak-puncaknya yang terjal, seberapa kuat kita membentenginya, dan pengetahuan kita tentang medannya menjadikan Pegunungan Alpen tempat yang tepat untuk secara signifikan meningkatkan kapasitas militer kita dan mempertahankannya jika kita perlu mundur."
 SWI_thunder_in_the_valleys: "Guntur di Lembah"
 SWI_thunder_in_the_valleys_desc: "Peperangan lapis baja tidak mempunyai tempat di pegunungan yang biasa kita alami, namun jika kita ingin menyerang dan menyerang musuh sebelum mereka dapat mencapai kita, kita harus segera mengejar dan mengembangkan kendaraan kita sendiri."
 SWI_fighting_for_the_hills: "Berjuang untuk Perbukitan"
 SWI_fighting_for_the_hills_desc: "Pada akhirnya, infanteri adalah elemen paling serbaguna dalam angkatan bersenjata kita. Dan meskipun [ROOT.GetNonIdeologyName] selalu bangga dengan infanteri mereka, kita belum pernah berperang selama hampir satu abad, jadi meninjau kembali teknologi dan doktrin infanteri kita adalah hal yang paling penting."
 SWI_fly_over_the_mountains: "Terbang Di Atas Pegunungan"
 SWI_fly_over_the_mountains_desc: "Gunung-gunung kita selalu menjulang tinggi ke angkasa, namun di dunia sekarang ini kita harus belajar bagaimana cara melampauinya. Melakukan perlawanan terhadap musuh di angkasa harus menjadi prioritas sekarang, bukan nanti."
 SWI_weapons_of_democracy: "Senjata Demokrasi"
 SWI_weapons_of_democracy_desc: "Sebelum musuh melakukan hal yang tidak terpikirkan, kita harus siap melakukan apa yang diperlukan untuk menghentikan mereka, bahkan jika itu berarti menggunakan senjata pemusnah massal yang dapat menghujani musuh kita dengan bencana. Tentu saja hal ini akan mencegah mereka melakukan kekejaman lebih lanjut."
 SWI_jump_into_action: "Langsung Beraksi"
 SWI_jump_into_action_desc: "Hanya 10 tahun yang lalu hal ini tidak mungkin terjadi, namun [ROOT.GetNameDef] telah membuat semua persiapan untuk secara aktif dan terbuka bergabung dalam upaya perang. Kita telah mempersiapkan infrastruktur, industri, dan institusi ilmu pengetahuan untuk menghadapi konflik besar-besaran yang belum pernah kita saksikan sebelumnya. Mesin perang [ROOT.GetAdjective] sedang berdengung, siap beraksi."
 SWI_exiled_government: "Pemerintah yang Diasingkan"
 SWI_exiled_government_desc: "Meskipun kami telah berupaya semaksimal mungkin, nampaknya kami telah gagal mempertahankan tanah air kami sehingga kami tidak punya pilihan lain selain berjuang untuk mendapatkannya kembali dari jauh. Nilai-nilai demokrasi [ROOT.GetAdjective] adalah apa yang membuat negara kita bisa bertahan begitu lama, dan akan menjadi pedoman kita untuk mendapatkannya kembali, lagi pula, [ROOT.GetName] tidak ditentukan oleh wilayahnya atau bahasa yang digunakan penduduknya, namun oleh rasa saling menghormati dan mendukung kita."
 SWI_join_the_allies: "Bergabunglah dengan Aliansi"
 SWI_join_the_allies_desc: "Pengorbanan materi dan kompromi moral yang diperlukan untuk menjaga netralitas menjadi tidak tertahankan. Tidak ada lagi tempat untuk netral, apalagi dengan kondisi politik Eropa saat ini. Meski gagal, sekutu adalah pilihan terbaik jika kita ingin melestarikan tanah dan konfederasi kita. Ini benar-benar saat yang tiada duanya."
 SWI_gotthardbund_party_name: "Gotthardbund"
 SWI_gotthardbund_party_name_long: "Gotthardbund"
 SWI_the_alpine_confederation: "Konfederasi Alpen"
 SWI_the_alpine_confederation_desc: "Negara besar kita telah berkembang melampaui batas-batas sejarah kita, dan meskipun kanton-kanton baru di bawah naungan kita menerima status yang sama dengan Schwyz, kita harus mengakui kondisi baru kita sebagai penjaga Pegunungan Alpen. Kekuatan demokrasi baru muncul: Konfederasi Alpine!"
 SWI_the_alpine_confederation_chance_TT: "Mereka akan lebih mungkin memberi kami kemerdekaan berdasarkan §Yukuran§! angkatan bersenjata kami, dan hal ini juga akan meningkatkan peluang kami untuk mereka memberi kami wilayah Alpen tambahan bersama dengan §Ypendapat§! mereka tentang kami."
 SWI_gotthard_union: "Gotthardbund"
 SWI_gotthard_union_desc: "Waktu untuk pertengkaran dan faksionalisme sudah berakhir. Sudah waktunya bagi [ROOT.GetNonIdeologyName] untuk bersatu di bawah demokrasi tunggal, dengan otoritas kategoris untuk mengambil tindakan besar-besaran. Semua demi keberlangsungan tradisi dan nilai-nilai [ROOT.GetAdjective] kita. Kami akan melawan dan menang!"
 SWI_press_for_vorarlberg: "Tekan untuk Vorarlberg"
 SWI_press_for_vorarlberg_desc: "Ketika pemerintahan [AUS.GetAdjective] masih berantakan, kita harus memenuhi keinginan demokratis [848.GetName], yang diungkapkan dalam referendum tahun 1919 dan mengintegrasikan mereka ke dalam Demokrasi kita. Merupakan tugas [ROOT.GetNameDef] untuk melindungi mereka dari fasisme dan otokrasi."
 SWI_pre_empt_anschluss: "Mencegah Anschluss"
 SWI_pre_empt_anschluss_desc: "Ada keributan bahwa [GER.GetNameDef] ingin mencaplok [AUS.GetName] atas nama kesatuan [GER.GetAdjective]. Hal ini bukanlah sesuatu yang dapat dibolehkan oleh [ROOT.GetNAmeDef], karena hal ini akan memberdayakan [GER.GetNameDef] untuk membuat klaim yang sama mengenai kanton berbahasa Jerman kita. Kita harus bergegas dan mempersiapkan pertahanan bagi seluruh [AUS.GetName]."
 SWI_pre_empt_anschluss_tt: "§YJika [AUS.GetNameDef] menerima, kita akan mendapatkan inti di negara inti mereka§!\n\nMereka akan lebih mungkin menerima berdasarkan §Yukuran§! angkatan bersenjata kita, §Ypendapat§! mereka dari kita, dan jika §Y[GER.GetNameDef] sedang bersiap§! untuk mencaplok [AUS.GetName]."
 SWI_demand_italian_alps: "Permintaan Pegunungan Alpen Italia"
 SWI_demand_italian_alps_desc: "Selama beberapa dekade, [ITA.GetName] tanpa malu-malu mengklaim wilayah berbahasa [ITA.GetAdjective] kami. Jika mereka bisa melakukan hal itu, kita tentu bisa menuntut agar Pegunungan Alpen mereka bergabung dengan masyarakat demokratis kita. Bagaimanapun, mereka termasuk dalam [ROOT.GetNameDef] sama seperti Ticino termasuk dalam [ITA.GetNameDef]."
 SWI_demand_french_alps: "Permintaan Pegunungan Alpen Prancis"
 SWI_demand_french_alps_desc: "Hanya masalah waktu sampai [FRA.GetNameDef] hancur karena tekanan internal dan eksternal. Kita harus mengambil sikap proaktif dalam mempertahankan Pegunungan Alpen, jika tidak, musuh yang berbahaya dapat mengambil alih posisi yang dapat dipertahankan yang dapat menjadi landasan invasi ke wilayah kita."
 SWI_alpine_redoubt: "Keraguan Alpen"
 SWI_alpine_redoubt_desc: "Selama kita mempunyai benteng yang kokoh untuk dijadikan sandaran, kita bisa menjadi kekuatan yang tak terhentikan melawan penjajah. Kita harus menjadikan Pegunungan Alpen lebih sulit ditembus dan mengembangkan pengaruh kita dari sana, hanya dengan cara ini kita dapat membuat jarak antara kita dan musuh, di mana pun ia berada."
 SWI_the_alpine_protectorate: "Protektorat Alpen"
 SWI_the_alpine_protectorate_desc: "Pegunungan Alpen belum pernah bersatu di bawah satu rezim hingga saat ini. Dengan kekuatan gabungan tersebut, kami dapat mempertahankan diri terhadap ancaman apa pun, dan memperluas pertahanan tersebut melampaui Pegunungan Alpen, dengan puncak kami sebagai benteng yang tidak dapat ditembus, dan komando kami tidak akan pernah goyah."
 SWI_bring_democracy_to_germany: "Membawa Demokrasi ke Jerman"
 SWI_bring_democracy_to_germany_desc: "Third Reich adalah sejauh yang bisa Anda dapatkan dari demokrasi, Republik Weimar sebelumnya hanyalah sandera dari kekuatan pemenang Perang Besar, dan rezim penghasut perang dari [GER.GetNonIdeologyName] lama hanyalah wadah bagi ambisi rakus para Kaiser. Sudah saatnya negara-negara tetangga kita di Utara mengetahui apa arti Demokrasi."
 SWI_liberate_italy: "Bebaskan Italia"
 SWI_liberate_italy_desc: "Selama berabad-abad [ROOT.GetNonIdeologyName] telah menyaksikan negara-negara kota kecil dan kerajaan-kerajaan kecil di selatan saling berperang dan akhirnya terserap ke dalam monarki yang lemah. Wajar saja jika [ITA.GetNonIdeologyName] dibebaskan dari belenggu otokrasi dan fasisme oleh kakaknya."
 SWI_take_over_france: "Lindungi Prancis"
 SWI_take_over_france_desc: "[FRA.GetNonIdeologyName] selalu menjadi negara yang berubah-ubah, dengan seringnya terjadi pergolakan di mana pelemparan koin menentukan apakah hasil dari revolusi saat ini adalah demokrasi yang lemah atau rezim militeristik. Di bawah perlindungan [ROOT.GetAdjective], masyarakat [FRA.GetAdjective] dapat berkembang, diatur oleh stabilitas demokrasi kita."
 SWI_the_new_eidgenossenschaft: "Eidgenossenschaft Baru"
 SWI_the_new_eidgenossenschaft_desc: "Pada abad ke-13 para pemimpin dari tiga kanton pendiri mengikrarkan sumpah aliansi abadi yang kita sebut Eidgenossenschaft. Sekaranglah saatnya untuk memperbaruinya sehingga kita dapat memperluasnya dan lebih banyak wilayah dapat merasakan konfederasi demokratis kita."
 SWI_expand_the_confederation: "Perluas Konfederasi"
 SWI_expand_the_confederation_desc: "Tidak ada negara yang aman dari pesatnya kemajuan totalitarianisme, banyak wilayah di negara-negara di sekitar kita yang dapat memperoleh manfaat dari perlindungan yang ditawarkan oleh tradisi netralitas kita dan jika perang pecah, kemampuan pertahanan kita yang luar biasa."
 SWI_empower_the_council: "Memberdayakan Dewan"
 SWI_empower_the_council_desc: "Bahaya mengintai di sekitar kita, dan ketika bahaya menerkam kita, kita tidak akan berdaya jika kita mulai bertengkar satu sama lain, musuh kita akan menghapus [ROOT.GetName] dari peta. Pemerintahan terpusat yang kuat tentu saja merupakan satu-satunya cara untuk bertahan di masa yang tidak menentu ini."
 SWI_switzerland_on_the_offense: "Swiss dalam Pelanggaran"
 SWI_switzerland_on_the_offense_desc: "Kita tidak bisa beristirahat di pegunungan menunggu untuk diserang. Kita harus mengambil inisiatif dan melakukan perlawanan terhadap musuh kita sebelum mereka menyerang kita. Hanya dengan cara ini kita dapat yakin bahwa kelangsungan hidup [ROOT.GetNameDef] terjamin. Bagaimanapun, pertahanan terbaik adalah serangan yang kuat."
 SWI_neutral_entente: "Entente Netral"
 SWI_neutral_entente_desc: "Kita bukan satu-satunya negara netral di dunia, dan dengan adanya risiko perang dan kekuatan-kekuatan yang berperang yang melanggar keinginan kita untuk tidak ikut campur dalam konflik mereka, kita harus mencegah mereka lebih jauh lagi. Kita harus mencari bantuan timbal balik dari semua negara netral lainnya sehingga perang terhadap satu negara netral berarti perang terhadap semua negara netral."
 SWI_plains_warfare: "Perang Dataran"
 SWI_plains_warfare_desc: "[ROOT.GetName] mempunyai banyak kesempatan untuk berlatih di lembah, gunung, bukit dan hutan, namun jika kita ingin berperang di negeri asing kita harus beradaptasi dengan doktrin perang modern. Kita telah melihat bagaimana infanteri mekanis yang bergerak cepat dapat mengejutkan pertahanan dan memberikan kemenangan cepat, sehingga kita dapat belajar dari hal ini dan membawa pasukan [ROOT.GetAdjective] ke abad ke-20."
 SWI_multipurpose_tanks: "Tank Serbaguna"
 SWI_multipurpose_tanks_desc: "Seperti pisau multi-peralatan serbaguna yang kami keluarkan untuk infanteri, kami memerlukan mesin yang dapat mengisi celah apa pun dan menyelesaikan tugas apa pun yang diperlukan untuk upaya perang kami. Masih banyak yang harus kita kejar dalam hal perang tank, jadi kita harus melakukan berbagai macam pengembangan untuk memiliki kekuatan yang komprehensif."
 SWI_rolling_fortresses: "Benteng Bergulir"
 SWI_rolling_fortresses_desc: "Tank-tank kita dapat menjadi bagian dari doktrin pertahanan kita saat ini, jadi tank-tank tersebut merupakan posisi terdepan dari benteng-benteng yang mempertahankan pegunungan kita. Jika musuh tidak bisa melewati garis depan benteng kita, mereka tidak akan pernah bisa mencapai wilayah kita."
 SWI_extended_supply_lines: "Jalur Pasokan yang Diperluas"
 SWI_extended_supply_lines_desc: "Di dunia yang penuh serangan cepat dan operasi jangka panjang, logistik pasokan menjadi lebih penting dari sebelumnya, dan seiring dengan upaya kita yang semakin jauh dari wilayah kita, kebutuhan akan jalur pasokan baru dan lebih baik pun meningkat. Kita harus belajar bagaimana meningkatkan logistik sehingga kita dapat memperluas jalur pasokan lebih jauh, dan membangun jalur pasokan baru dengan lebih cepat."
 SWI_dissolve_the_federal_council: "Bubarkan Dewan Federal"
 SWI_president_for_life: "Presiden Seumur Hidup"
 SWI_president_for_life_desc: "Dewan Federal merupakan dewan yang unik di antara negara-negara Eropa lainnya, mereka telah melayani [ROOT.GetNonIdeologyName] dengan baik selama masa damai, namun sekarang sudah jelas bahwa [?SWI.SWI_confederation_president.GetName] memimpin dewan dan negara secara keseluruhan, terdapat argumen yang baik agar pemerintahan [?SWI.SWI_confederation_president.GetHerHis] terus berlanjut tanpa batas waktu, sebagai pilar stabilitas di [ROOT.GetNameDef]."
 SWI_guisans_coup: "Kudeta Guisan"
 SWI_guisans_coup_desc: "[?SWI.SWI_confederation_president.GetName] telah membawa negara kita yang besar dan damai menuju perang dan kesengsaraan. Ini bukanlah [ROOT.GetNonIdeologyName] yang kita kenal dan cintai, ini telah dirusak atas nama pelestarian diri. Hanya ada satu orang yang populer dan cukup mampu untuk mengakhiri perang ini untuk selamanya dan semoga mengembalikan negara netral ini ke akarnya; Henri Guisan."
 SWI_return_to_the_old_switzerland: "Kembali ke Swiss Lama"
 SWI_return_to_the_old_switzerland_desc: "Kini setelah perang hampir berakhir, kita akhirnya dapat mengambil langkah untuk mengembalikan [ROOT.GetNonIdeologyName] seperti semula; negara yang demokratis dan netral berdasarkan prinsip saling menghormati dan menentukan nasib sendiri. Setelah perang usai, kita akhirnya bisa menegakkan demokrasi dan netralitas di sekitar kita."
 SWI_a_swiss_navy: "Angkatan Laut Swiss"
 SWI_a_swiss_navy_desc: "Untuk pertama kalinya dalam sejarah [ROOT.GetAdjective], kita mendapati diri kita berada di garis pantai. Ini berarti bahwa kita dapat menggunakannya untuk melancarkan perang di laut, namun juga berarti kita sekarang mempunyai front baru yang harus dipertahankan, kita perlu meningkatkan upaya kita untuk membangun angkatan laut untuk [ROOT.GetName]."
 SWI_buy_foreign_surplus_ships: "Beli Kapal Surplus Asing"
 SWI_buy_foreign_surplus_ships_desc: "Surplus suatu negara adalah angkatan laut negara lain. Banyak kekuatan angkatan laut besar di dunia kini memiliki armada yang penuh dengan kapal-kapal baru, yang berarti bahwa kapal-kapal tua sudah hampir ketinggalan zaman namun memerlukan biaya perawatan yang mahal. Jika kita ingin segera membangun kekuatan angkatan laut, tidak ada cara yang lebih baik selain membeli kapal yang tidak diinginkan dari mereka."
 SWI_swiss_ship_designs: "Desain Kapal Swiss"
 SWI_swiss_ship_designs_desc: "Kita mungkin tidak mempunyai banyak pengalaman dalam perancangan dan pembuatan kapal perang yang layak berlayar, namun semakin cepat kita memulainya, semakin cepat kita dapat bertahan di antara kekuatan angkatan laut yang lama dan besar seperti [ENG.GetNameDef] dan [ITA.GetName]."
 SWI_submarine_raiders: "Perampok Kapal Selam"
 SWI_submarine_raiders_desc: "Biarkan kekuatan angkatan laut yang lama memiliki tumpukan baja yang sangat besar. Sementara mereka berperang dengan kekerasan di laut, kita akan berperang dengan licik di bawah permukaan dengan kapal selam kita, menghancurkan kekuatan angkatan laut mereka yang sudah tua dan lemah."
 SWI_floating_fortresses: "Benteng Terapung"
 SWI_floating_fortresses_desc: "Kita tahu cara membuat benteng untuk mempertahankan gunung dan lembah kita, karena sekarang kita sudah punya pantai, maka yang paling penting adalah kita memperluasnya hingga ke laut. Kapal kita tidak akan bisa dihancurkan."
 SWI_naval_industry: "Industri Angkatan Laut"
 SWI_naval_industry_desc: "Bahkan jika garis pantai baru yang kita peroleh masih memiliki sisa-sisa industri angkatan laut, kita harus segera memperluasnya secara komprehensif dan menjadikannya kerangka kerja yang kohesif untuk produksi dan pemeliharaan yang layak bagi angkatan laut Swiss yang benar-benar kuat."
 SWI_naval_industry_tt: "Menambahkan §G1§! Slot Bangunan dan §Y1 Galangan Kapal Angkatan Laut§! di setiap negara bagian pesisir. (Maks. 10)"
 SWI_build_naval_bases: "Bangun Pangkalan Angkatan Laut"
 SWI_build_naval_bases_desc: "Pangkalan yang telah kita taklukkan tidaklah cukup, dan kita tidak dapat membangun pangkalan baru dengan cukup cepat untuk memenuhi kebutuhan kita. Upaya baru harus dilakukan untuk mencapai tujuan angkatan laut kita."
 SWI_build_naval_bases_tt: "Menambahkan §Y2 Pangkalan Angkatan Laut§! di setiap §YPangkalan Angkatan Laut§! yang ada. (Maks. 15)"
 SWI_train_navy_staff: "Melatih Staf Angkatan Laut"
 SWI_protect_liechtenstein: "Lindungi Liechtenstein"
 SWI_protect_liechtenstein_desc: "Terjepit di antara tiga kanton kita, kerajaan kecil Liechtenstein harus dilindungi demi melindungi rakyatnya. Lagi pula, mereka tidak punya peluang melawan tentara asing mana pun, termasuk tentara kami. Kita bisa menawarkan bantuan kita dengan menduduki wilayah mereka, mereka bisa bergabung dengan sumpah kita dan menjadi wilayah terbaru kita."
 SWI_train_navy_staff_desc: "Infrastruktur angkatan laut tidak hanya terbuat dari baja dan beton, tetapi juga membutuhkan keberanian dan pelatihan dari laki-laki dan perempuan untuk mencapai kemenangan di lautan dan samudera."
 SWI_reduce_militia_activation_time_TT: "Waktu untuk memobilisasi sepenuhnya §YMilisi Warga§! kita akan dikurangi §G$RIGHT|0$§! hari"
 SWI_generic_fascist_neighbor_cap: "Tetangga kita yang fasis"
 SWI_generic_fascist_neighbor: "tetangga fasis kita"
 SWI_secret_pact_with_allies_TT: "Jika kami terlibat perang, kami akan segera bergabung dengan faksi mereka."
 SWI_neutral_entente_faction: "Entente Netral"
 SWI_militias_turned_into_regulars: "Milisi Warga telah diprofesionalkan"
 SWI_old_switzerland_TT: "§YSetelah perang usai:§!"
 SWI_viable_fascist_in_europe: "§YBangsa Fasis§! Eropa yang layak memang ada"
 # Horn of Africa
 HOA_develop_capitalstate: "Kembangkan [Root.Capital.GetName]"
 HOA_develop_capitalstate_desc: "Kita perlu meningkatkan laju industrialisasi demi kemajuan masyarakat kita dan perlindungan [ROOT.GetNameDef]. Oleh karena itu, kami akan berinvestasi di kawasan sekitar [ROOT.Capital.GetCapitalVictoryPointName], menjadikannya pusat industri bangsa."
 HOA_the_state_bank_of_name: "Bank Negara [ROOT.GetNameDef]"
 HOA_the_state_bank_of_name_desc: "Dengan memperluas sumber daya bank sentral [ROOT.GetNameDef], kita dapat memberikan jalur kredit baru kepada masyarakat dan bertindak sebagai diuretik finansial bagi perekonomian [ROOT.GetAdjective] yang sedang sakit."
 HOA_pave_the_roads: "Membuka Jalan"
 HOA_pave_the_roads_desc: "Mengangkut orang dan barang melintasi [ROOT.GetNameDef] saat ini terlalu tidak efisien. Berinvestasi pada pembangunan jalan raya tidak hanya akan menguntungkan perekonomian, namun juga akan membuat kita lebih aman dengan memudahkan pergerakan aset militer."
 HOA_the_steam_locomotive: "Lokomotif Uap"
 HOA_the_steam_locomotive_desc: "Meskipun mobil dan truk berguna untuk mengangkut barang dan orang dalam jumlah besar dalam jarak pendek atau dalam jumlah besar, kereta api jauh lebih efisien dalam mengangkut barang dan orang dalam jumlah besar. Berinvestasi pada jaringan kereta api kami akan menjadi dorongan besar bagi perekonomian negara."
 HOA_the_adjective_regional_development_fund: "Dana Pembangunan Daerah [ROOT.GetAdjective]"
 HOA_state_owned_industry_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+15%§!"
 HOA_the_adjective_regional_development_fund_desc: "Daerah [ROOT.GetNameDef] mengalami stagnasi dan sangat membutuhkan investasi. Dengan menciptakan dana pembangunan daerah, kita dapat memastikan pemerintah daerah mempunyai alat yang diperlukan untuk memodernisasi daerah mereka."
 HOA_the_adjective_industrial_fund: "Dana Industri [ROOT.GetAdjective]"
 HOA_the_adjective_industrial_fund_desc: "[ROOT.GetNameDefCap] sayangnya berada di bawah industri. Jika kita ingin meningkatkan taraf hidup masyarakat dan memiliki kapasitas untuk melindungi mereka dari agresi asing, kita perlu melakukan industrialisasi bangsa dengan cepat."
 HOA_exploit_national_resources: "Memanfaatkan Sumber Daya Nasional"
 HOA_exploit_national_resources_desc: "[ROOT.GetNameDefCap] memiliki sumber daya alam melimpah yang menunggu untuk dimanfaatkan. Dengan sedikit investasi, kami akhirnya dapat mulai mengeksploitasinya."
 HOA_support_the_agrarians: "Dukung Agraria"
 HOA_support_the_agrarians_desc: "Penduduk pedesaan [ROOT.GetNameDef] yang bekerja di bidang pertanian merupakan tulang punggung bangsa. Oleh karena itu, kita harus berbuat lebih banyak untuk mendukung mereka dalam pekerjaan penting yang mereka lakukan."
 HOA_support_the_agrarians_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 HOA_promote_local_crafts: "Promosikan Kerajinan Lokal"
 HOA_promote_local_crafts_desc: "[ROOT.GetNameDefCap] memiliki banyak sekali pengrajin terampil yang bekerja dalam skala kecil untuk memasok barang-barang bagi negara. Kita harus mengembangkan keahlian mereka dan memudahkan mereka memperluas operasi dan produksi barang-barang tersebut."
 HOA_use_the_natural_harbors: "Gunakan Pelabuhan Alami"
 HOA_use_the_natural_harbors_desc: "Dengan akuisisi lahan pesisir yang baru-baru ini kami lakukan, kami memiliki peluang untuk meningkatkan akses kami secara signifikan ke pasar internasional dengan membangun pelabuhan kami sendiri. Hal ini akan mempermudah impor dan ekspor barang, sehingga sangat membantu perekonomian kita."
 HOA_the_capital_city_airport: "Bandara [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_city_airport_desc: "Transportasi udara semakin menghubungkan kota-kota di dunia dengan perekonomian global. Kita harus membangun bandara kita sendiri untuk memanfaatkan tren ini."
 HOA_a_steamboat_fleet: "Armada Kapal Uap"
 HOA_a_steamboat_fleet_desc: "Untuk mempertahankan garis pantai dan jalur pelayaran, kita perlu membangun armada kapal pesisir yang mampu menghalangi agresi asing."
 HOA_improved_irrigation_systems: "Peningkatan Sistem Irigasi"
 HOA_improved_irrigation_systems_desc: "Kita tidak dapat mencapai ketahanan nasional tanpa kapasitas produksi pangan yang kuat. Untuk meningkatkan hasil panen, kami akan berinvestasi dalam program irigasi besar-besaran di seluruh lahan subur kami."
 HOA_improved_irrigation_systems_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+15%§!"
 HOA_the_adjective_air_fleet: "Armada Udara [ROOT.GetAdjective]"
 HOA_the_adjective_air_fleet_desc: "Peperangan udara dengan cepat menjadi arena utama dalam menentukan pemenang suatu konflik. Oleh karena itu, kita harus membentuk angkatan udara kita sendiri dan mempersiapkannya untuk mempertahankan langit [ROOT.GetNameDef]."
 HOA_state-funded_projects: "Proyek yang Didanai Negara"
 HOA_state-funded_projects_desc: "Perekonomian kita stagnan karena kurangnya infrastruktur dan industri. Untuk mengatasi hal tersebut, kami akan berinvestasi besar-besaran pada proyek-proyek baru di [ROOT.GetNameDef]."
 HOA_the_grand_university_of_capital: "Universitas Besar [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_grand_university_of_capital_desc: "Mewariskan pengetahuan dari satu generasi ke generasi berikutnya sangatlah penting bagi keselamatan dan pertumbuhan suatu negara. Oleh karena itu, kami akan mendirikan universitas besar baru di [ROOT.Capital.GetCapitalVictoryPointName] untuk mendidik generasi ilmuwan, sejarawan, dan seniman masa depan dengan lebih baik."
 HOA_the_adjective_armed_forces: "Angkatan Bersenjata [ROOT.GetAdjective]"
 HOA_the_adjective_armed_forces_desc: "Dunia semakin tidak stabil seiring meningkatnya ketegangan antara negara-negara besar. Jika kita ingin mempertahankan kemerdekaan, militer [ROOT.GetAdjective] harus siap berperang."
 HOA_warrior_tradition: "Tradisi Prajurit"
 HOA_warrior_tradition_desc: "[ROOT.GetNameDefCap] memiliki sejarah panjang para pejuang pemberani yang mempertahankan rumah mereka dari para penakluk. Saat ini, lebih dari sebelumnya, kita perlu memanfaatkan tradisi tersebut untuk membela tanah air."
 HOA_strengthen_the_irregulars: "Perkuat Irregular"
 HOA_strengthen_the_irregulars_desc: "Sistem laskar dan retribusi telah membantu kita dengan baik selama berabad-abad. Tidak ada alasan untuk mengubah apa yang telah terbukti berhasil."
 HOA_every_man_a_warrior: "Setiap Manusia adalah Pejuang"
 HOA_every_man_a_warrior_desc: "Jika [ROOT.GetNameDef] ingin berhasil melawan agresor asing, kita perlu memiliterisasi masyarakat sedemikian rupa sehingga setiap orang mampu mengangkat senjata bila diperlukan untuk pertahanan nasional."
 HOA_names_finest: "[ROOT.GetName] Terbaik"
 HOA_names_finest_desc: "Pasukan kami tahu bahwa mereka adalah satu-satunya penghalang bagi bangsa kami untuk menjadi subyek kekuatan asing. Dengan pengetahuan itu muncullah komitmen yang teguh untuk membela tanah air dan menjaga kebebasan [ROOT.GetAdjective]."
 HOA_utilize_our_strengths: "Manfaatkan Kekuatan kami"
 HOA_utilize_our_strengths_desc: "Meskipun militer kita mungkin tidak sebesar dan seformal negara-negara lain, militer kita mempunyai banyak keahlian yang tidak konvensional yang dapat dieksploitasi di medan perang."
 HOA_reform_the_conscription: "Reformasi Wajib Militer"
 HOA_reform_the_conscription_desc: "Dengan situasi global yang semakin tegang, sudah saatnya program wajib militer diperluas agar kita siap menghadapi segala bentuk agresi asing."
 HOA_eyes_on_the_imperialists: "Fokus pada kaum Imperialis"
 HOA_eyes_on_the_imperialists_desc: "Kekuatan kekaisaran di wilayah ini memandang remeh kemerdekaan [ROOT.GetNameDef]. Kita harus tetap waspada dan menghindari menjadi korban ambisi mereka."
 HOA_encourage_local_arms_production: "Mendorong Produksi Senjata Lokal"
 HOA_encourage_local_arms_production_desc: "Jika kita tidak dapat menyediakan peralatan yang dibutuhkan pasukan kita, mereka tidak akan mampu memberikan pertahanan negara yang memadai. Oleh karena itu kita harus memperluas kapasitas industri senjata."
 HOA_metal_beasts: "Binatang Logam"
 HOA_metal_beasts_desc: "Menjadi semakin jelas bahwa peperangan lapis baja akan memainkan peran yang lebih besar di medan perang. Tentara harus belajar cara terbaik untuk memanfaatkan dan melawan kendaraan semacam itu."
 HOA_the_roars_of_thunder: "Deru Guntur"
 HOA_the_roars_of_thunder_desc: "Terkadang di medan perang, satu-satunya cara untuk mengusir musuh adalah dengan menggunakan kekuatan tembakan yang luar biasa. Cara paling efektif untuk melepaskannya adalah dengan artileri."
 HOA_develop_indigenous_models: "Mengembangkan Model Pribumi"
 HOA_develop_indigenous_models_desc: "Mengandalkan desain peralatan infanteri asing membuat kita berisiko tertinggal secara teknologi. Risiko keamanan ini hanya dapat diatasi secara memadai dengan meningkatkan keahlian dalam negeri di bidang pengembangan senjata kecil."
 HOA_the_steel_lions: "Singa Baja"
 HOA_the_steel_lions_desc: "Era peperangan statis telah berlalu. Sudah saatnya kita mulai mengerahkan unit lapis baja khusus kita ke medan perang dan mulai mempelajari metode peperangan bergerak."
 HOA_warfare_from_afar: "Peperangan dari Jauh"
 HOA_warfare_from_afar_desc: "Artileri telah membuktikan kemampuannya berkali-kali di medan perang. Kita harus memanfaatkannya dengan lebih baik dengan lebih mengintegrasikan unit artileri khusus ke dalam divisi infanteri kita."
 HOA_modern_infantry: "Infanteri Modern"
 HOA_modern_infantry_desc: "Reformasi militer kita telah berhasil meningkatkan efektivitasnya. Perkembangan ini harus kita kembangkan dengan menambah jumlah divisi di lapangan."
 HOA_the_first_album: "[ROOT.GetNameDefCap]"
 HOA_the_first_album_desc: "Dunia kini terlihat semakin berbahaya seiring meningkatnya ketegangan antara negara-negara besar, namun hal ini juga membuka peluang bagi negara-negara yang bersedia dan siap memanfaatkan momen ini."
 HOA_a_loyal_subject: "Subjek yang Setia"
 HOA_a_loyal_subject_desc: "Ketika situasi di panggung dunia menjadi semakin tidak stabil, mungkin lebih baik kita berada di bawah perlindungan negara yang lebih kuat. Setidaknya untuk saat ini..."
 HOA_political_stability: "Stabilitas Politik"
 HOA_political_stability_desc: "Kita tidak bisa berharap untuk tetap menjadi bangsa yang merdeka jika kita terpecah belah di dalam negeri. Hanya dengan menciptakan front persatuan kita dapat menahan diri untuk tidak tersapu oleh angin perubahan yang sedang melanda dunia."
 HOA_the_capital_railroad: "Kereta Api [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_railroad_desc: "Dengan menghubungkan jaringan kereta api kita dengan negara-negara tetangga, kita dapat mengekspor barang dan sumber daya kita ke negara-negara tetangga dengan lebih baik. Semoga hal ini dapat memberikan dorongan bagi perekonomian kita."
 HOA_invite_foreign_settlers: "Undang Pemukim Asing"
 HOA_invite_foreign_settlers_desc: "Masih banyak jalan yang harus kita tempuh untuk memodernisasi bangsa kita. Kita harus memanfaatkan keterampilan penjajah yang naif dengan menciptakan insentif bagi mereka untuk pindah ke [ROOT.GetNameDef]."
 HOA_countryleader: "[ROOT.GetLeader]"
 HOA_countryleader_desc: "[ROOT.GetLeader] adalah satu-satunya orang yang mampu menyatukan bangsa melewati masa-masa sulit ini, oleh karena itu masyarakat harus bersatu di belakang [ROOT.GetLeader.GetHerHim]."
 HOA_securing_the_adjective_future: "Mengamankan Masa Depan [ROOT.GetAdjective]"
 HOA_securing_the_adjective_future_desc: "[ROOT.GetNameDefCap] adalah negara kecil dengan sedikit teman di panggung dunia. Mengubah hal tersebut akan sangat membantu menjamin kebebasan dan kemandirian kita di masa depan."
 HOA_improving_the_educational_system: "Memperbaiki Sistem Pendidikan"
 HOA_improving_the_educational_system_desc: "Anak-anak kita memegang nasib bangsa di tangan mereka. Oleh karena itu, memberi mereka pendidikan terbaik akan sangat membantu dalam menjamin masa depan [ROOT.GetNameDef]."
 HOA_construct_great_monuments: "Bangun Monumen Besar"
 HOA_construct_great_monuments_desc: "Orang [ROOT.GetAdjective] punya banyak hal yang bisa dibanggakan. Kita mempunyai sejarah panjang yang harus diperingati dalam monumen-monumen yang menginspirasi perjuangan untuk mencapai tingkat yang lebih tinggi."
 HOA_the_adjective_volunteer_force: "Pasukan Relawan [ROOT.GetAdjective]"
 HOA_the_adjective_volunteer_force_desc: "Pertempuran perbatasan dalam skala kecil di benua lain berpotensi memicu konflik besar yang melanda dunia. Kita harus melakukan bagian kita untuk memadamkan api ini sebelum memicu Perang Besar lagi."
 HOA_military_cooperation: "Kerja Sama Militer"
 HOA_military_cooperation_desc: "Meskipun kita mengambil langkah besar dalam meningkatkan angkatan bersenjata kita, ada beberapa pelajaran yang dapat kita pelajari dari teman-teman internasional kita melalui latihan bersama dan peningkatan kerja sama militer."
 HOA_that_which_is_rightfully_ours: "Itu Yang Menjadi Hak Kita"
 HOA_that_which_is_rightfully_ours_desc: "[ROOT.GetNameDefCap] adalah bayangan dari apa yang seharusnya. Sejarah menunjukkan bahwa nenek moyang kita menguasai lahan yang jauh lebih luas dibandingkan pemerintahan kita saat ini, namun sebagian besar lahan tersebut telah dicuri dari kita selama beberapa generasi. Sudah saatnya kita mengambil kembali apa yang menjadi hak kita."
 HOA_commandos: "Komando"
 HOA_commandos_desc: "Kadang-kadang dalam perang, sekelompok tentara yang kecil namun terlatih dapat mencapai kemenangan yang lebih besar di belakang garis musuh dibandingkan dengan kemenangan yang dapat dicapai oleh pasukan terbesar di medan perang."
 HOA_a_jagged_alliance: "Aliansi Bergerigi"
 HOA_a_jagged_alliance_desc: "Meskipun kita tidak selalu berhadapan langsung dengan negara lain, kita sering menghadapi ancaman yang sama. Berfokus pada isu-isu bersama dapat menjadi dasar bagi aliansi jangka panjang dan peningkatan keamanan nasional."
 HOA_observe_and_learn: "Amati dan Pelajari"
 HOA_observe_and_learn_desc: "Peperangan terus berkembang karena sifat kemajuan teknologi dan pemikiran inovatif. Untuk mempertahankan militer yang kuat, kita harus mengambil pelajaran dari perang dan tidak pernah berhenti mencari cara untuk meningkatkan diri."
 HOA_foreign_investors: "Investor Asing"
 HOA_foreign_investors_desc: "Kita memerlukan investasi dalam industri dan infrastruktur jika kita ingin berkembang. Untungnya, tidak ada kekurangan orang asing yang ingin mendapatkan keuntungan."
 HOA_research_exchange_programmes: "Program Pertukaran Penelitian"
 HOA_research_exchange_programmes_desc: "Industri kita sangat membutuhkan modernisasi, dengan mengadakan program pertukaran kita bisa mendapatkan pengetahuan dari luar negeri tentang cara terbaik memanfaatkan kemajuan teknologi baru di pabrik kita."
 HOA_foreign_trained_officials: "Pejabat Asing yang Terlatih"
 HOA_foreign_trained_officials_desc: "Masih banyak yang bisa kita pelajari dari keahlian orang-orang dari luar negeri. Sudah saatnya kita memanfaatkan mereka dengan lebih baik dengan memberi mereka posisi yang berwenang dalam negara."
 HOA_countryadjective_loyalist_advisors: "[ROOT.GetAdjective] Penasihat Loyalis"
 HOA_countryadjective_loyalist_advisors_desc: "Kita tidak bisa membiarkan bangsa dan kebudayaan kita dikuasai oleh kaum imperialis. Kita perlu mengangkat mereka yang setia pada [ROOT.GetNameDef] ke posisi yang berwenang dan memulai proses untuk mendapatkan kembali kebebasan kita."
 HOA_lay_claim_to_the_danakil: "Ajukan Klaim ke Danakil"
 HOA_lay_claim_to_the_danakil_desc: "[ROOT.GetNameDefCap] akan selalu rentan terhadap invasi angkatan laut tanpa mengamankan wilayah Danakil di utara."
 HOA_push_for_the_highlands: "Dorong ke Dataran Tinggi"
 HOA_push_for_the_highlands_desc: "Jantung perekonomian Afrika Timur terletak di dataran tinggi. Mengamankannya untuk [ROOT.GetNameDef] akan sangat membantu dalam memperluas potensi ekonomi kita."
 HOA_secure_the_ogaden: "Amankan Ogaden"
 HOA_secure_the_ogaden_desc: "Mengamankan Ogaden akan menciptakan serangkaian penghalang alami antara kita dan siapa pun yang akan menjadi agresor, sekaligus membuka perekonomian kita untuk berdagang melintasi Samudera Hindia."
 HOA_rallying_the_adjective_people: "Mengumpulkan Orang [ROOT.GetAdjective]"
 HOA_rallying_the_adjective_people_desc: "Dunia sedang dilanda konflik. Yang menghalangi kebebasan kita saat ini dan jurang penaklukan adalah kesediaan masyarakat [ROOT.GetAdjective] untuk berdiri dan melawan. Bersatu kita teguh bercerai kita runtuh."
 HOA_the_capital_school_of_technology: "Sekolah Teknologi [Root.Capital.GetCapitalVictoryPointName]"
 HOA_the_capital_school_of_technology_desc: "Apa yang tadinya canggih di medan perang dan di pabrik beberapa tahun yang lalu sering kali sudah ketinggalan zaman saat ini. Jika kita ingin mengimbangi perkembangan teknologi baru, kita harus berinvestasi dalam mendidik generasi berikutnya."
 HOA_promote_countryadjective_nationalism: "Mempromosikan [ROOT.GetAdjective] Nasionalisme"
 HOA_promote_countryadjective_nationalism_desc: "Rakyat [ROOT.GetNameDef] tidak akan lagi mentolerir penindasan yang dilakukan oleh kekuatan asing. Kita harus memanfaatkan momen ini dan mempercepat rencana kemerdekaan kita."
 HOA_crowning_of_the_negusa_nagast: "Penobatan Negusa Nagast"
 HOA_crowning_of_the_negusa_nagast_desc: "Ketika kita semakin menjadi kekuatan dominan di kawasan ini, inilah saatnya kita mengambil peran kita dengan melantik pemimpin kita, Negusa Nagast yang baru. Semua harus mendukung [ROOT.GetLeader.GetHerHim] atau menghadapi kemarahan kita."
 HOA_control_ethiopia_tt: "Mengontrol seluruh Wilayah Ethiopia"
 HOA_proclaim_east-african_hegemony: "Proklamasikan Hegemoni Afrika Timur"
 HOA_proclaim_east-african_hegemony_desc: "Situasi yang terus bergejolak di Tanduk Afrika hanya dapat distabilkan di bawah pemerintahan kaisar kita yang mulia, [ROOT.GetName]. Waktu untuk menyatukan kawasan sudah dekat."
