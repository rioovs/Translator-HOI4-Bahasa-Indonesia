 # Focuses
 ecole_militaire_haile_selassie_1er: "Ecole Militaire Haile Selassie 1er"
 holeta_military_academy: "Akademi Militer Holeta"
 every_league_of_nations_member_tt: "Setiap Negara Anggota Liga Bangsa-Bangsa:"
 ETH_strengthen_the_black_lions: "Perkuat Singa Hitam"
 ETH_strengthen_the_black_lions_desc: "Meskipun kita telah kehilangan wilayah karena musuh, perjuangan harus tetap berjalan. Tim Singa Hitam memberikan perlawanan yang besar terhadap tim Italia dan oleh karena itu kita harus mendukung mereka semampu kita."
 ETH_supporting_the_arbegnoch: "Mendukung Arbegnoch"
 ETH_supporting_the_arbegnoch_desc: "Di [ROOT.GetName] ada patriot yang bersedia mengangkat senjata melawan penjajah [ITA.GetAdjective]. Kita harus melakukan segala yang kita bisa untuk mendukung pria dan wanita pemberani ini dalam melumpuhkan mesin perang [ITA.GetAdjective]."
 ETH_ecole_militaire_haile_selassie_1er: "[GetEthiopianMilitaryAcademyName]"
 ETH_ecole_militaire_haile_selassie_1er_desc: "Militer kita terbukti sangat kuno dibandingkan negara-negara lain di kawasan ini, baik dari segi peralatan maupun pemikiran. Kami akan mendirikan akademi militer kami sendiri untuk melatih perwira generasi baru tentang cara berperang dalam perang modern."
 ETH_ecole_militaire_haile_selassie_1er_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!"
 ETH_unlock_academy_tt: "Membuka kunci §Y$academy_spirit$§!"
 ETH_university_of_capital: "Universitas [ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_university_of_capital_desc: "Keganasan pasukan sekaligus menentukan jalannya suatu pertempuran. Kini pertempuran dapat dilakukan dalam jarak yang sangat jauh tanpa perlu melihat satu sama lain. Kita harus berinvestasi pada lembaga-lembaga pembelajaran sehingga kita dapat mengembangkan teknologi baru untuk berperang dan memproduksi alat-alat untuk melakukan hal tersebut."
 ETH_university_of_capital_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5%§!"
 ETH_scavenging_tactics: "Taktik Pemulungan"
 ETH_scavenging_tactics_desc: "Sementara kita memperluas basis industri kita, kita harus melatih pasukan kita dalam menemukan apa yang berguna dan dapat diperoleh kembali di medan perang. Hal ini akan sangat membantu dalam menjaga pasokan peralatan hingga kita dapat secara konsisten memproduksi dan mengangkut peralatan kita sendiri."
 ETH_scavenger_random_generals_tt: "§YTiga§! pemimpin tentara yang dipilih secara acak akan mendapatkan §Y$scavenger$§!:\n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$: §G+3%§!"
 ETH_keep_the_chitet: "Pertahankan [GetChitetName]"
 ETH_keep_the_chitet_desc: "[GetChitetName] telah membantu kami dengan baik. Sebagai negara yang relatif agraris, kita akan berjuang untuk mengerahkan tentara yang permanen dan profesional setiap saat. Yang terbaik adalah tetap berpegang pada apa yang kita ketahui."
 ETH_keep_the_chitet_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5%§!\nMenambahkan batalyon §Y2 $irregular_infantry$§! ke Divisi Chitet Sefari."
 ETH_expand_the_mehal_sefari: "Perluas [ETH_GetSefariName]"
 ETH_expand_the_mehal_sefari_desc: "Pasukan [ETH_GetSefariName] telah menunjukkan kebutuhan akan tentara profesional yang terlatih. Era untuk sekadar membesarkan tentara tani di masa krisis sudah lama berlalu. Oleh karena itu kami akan mengatur kembali tentara kami sebagai kekuatan permanen."
 ETH_chitet_sefari_no_recruiting_tt: "§YChitet Sefari§! Divisi tidak dapat direkrut lagi."
 ETH_expand_the_mehal_sefari_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+25%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!"
 ETH_the_ethiopian_air_force: "Angkatan Udara [ROOT.GetAdjective]"
 ETH_the_ethiopian_air_force_desc: "Baik untuk mendukung pasukan di medan perang atau menghancurkan infrastruktur musuh, pesawat ini terbukti merupakan aset yang sangat berharga. Kita harus membentuk angkatan udara kita sendiri jika kita ingin melindungi rakyat kita dan menghancurkan musuh-musuh kita."
 ETH_the_ethiopian_air_force_tt: "Membuka §Y$air_force_command_spirit$§!"
 ETH_establish_a_naval_base: "Mendirikan Pangkalan Angkatan Laut"
 ETH_establish_a_naval_base_desc: "Dengan akuisisi pelabuhan yang baru-baru ini kami lakukan, kami telah membuka diri terhadap medan perang lainnya. Kita harus membangun pangkalan angkatan laut kita sendiri dan mulai membangun angkatan laut untuk mempertahankan garis pantai baru kita."
 ETH_improve_the_administration: "Memperbaiki Administrasi"
 ETH_improve_the_administration_desc: "Masih banyak korupsi di lembaga pendidikan. Hal ini tidak dapat diterima oleh lembaga-lembaga yang dianggap bangga dengan meritokrasi. Kita harus dengan kejam memberantas korupsi ini dari sekolah dan universitas kita."
 ETH_improve_the_administration_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+5%§!"
 ETH_mounted_levies: "Dipasang [GetChitetName]"
 ETH_mounted_levies_desc: "Dari gurun di Timur, hingga pegunungan di Barat, tanah air kita terdiri dari berbagai medan yang sulit untuk dilalui dan oleh karena itu tidak cocok untuk kendaraan beroda atau beroda. Namun, unta dan kuda telah terbukti selama ribuan tahun mampu melakukan tugas tersebut."
 ETH_mounted_levies_tt: "Merekrut divisi §Y$cavalry$§! dan §Y$camelry$§!."
 ETH_regional_training_centers: "Pusat Pelatihan Regional"
 ETH_regional_training_centers_desc: "[GetChitetName] jauh dari sempurna. Pasukan kita bisa menjadi jauh lebih efektif dengan didirikannya pusat-pusat pelatihan regional untuk menunjukkan kepada mereka cara berperang dan berpikir secara taktis. Hal ini juga akan memungkinkan kita untuk melakukan standarisasi pelatihan militer tanpa memerlukan tentara tetap."
 ETH_regional_training_centers_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$modifier_army_sub_unit_irregular_infantry_defence_factor$: §G+5%§!\n$modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+10%§!\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+15%§!"
 ETH_expand_the_kebur_zabagna: "Perluas [ETH_GetGuardsName]"
 ETH_expand_the_kebur_zabagna_desc: "[ETH_GetGuardsName] telah membuktikan diri mereka sebagai yang terbaik dari yang terbaik dalam angkatan bersenjata kita. Kita harus lebih memanfaatkan kemampuan mereka dengan meningkatkan akses mereka terhadap peralatan dan tenaga kerja."
 ETH_expand_the_kebur_zabagna_tt: "Merekrut divisi §YKebur Zabagna§! tambahan.\nMenambahkan batalyon §Y$infantry$§! dan §Y$cavalry$§! ke templat §YKebur Zabagna§!.\nMenambahkan §Y$recon$§! dan §Y$artillery$§! jika teknologi yang relevan telah diteliti."
 ETH_tactical_training: "Pelatihan Taktis Standar"
 ETH_tactical_training_desc: "Seringkali pelatihan yang diterima angkatan bersenjata kita tidak konsisten dan ketinggalan jaman. Kita perlu membakukan pelatihan taktis yang diterima semua pasukan kita agar mereka lebih efektif di medan perang."
 ETH_tactical_training_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§!"
 ETH_peacekeeping_forces: "Pasukan Penjaga Perdamaian"
 ETH_peacekeeping_forces_desc: "Kunci keamanan kita adalah memastikan bahwa setiap krisis di luar negeri dapat ditangani dengan cepat sebelum krisis tersebut menjadi semakin parah dan tidak dapat dikendalikan. Oleh karena itu, mempertahankan pasukan penjaga perdamaian yang mampu dikerahkan di seluruh dunia kapan saja sangatlah penting."
 ETH_copy_plane_designs: "Salin Desain Pesawat"
 ETH_copy_plane_designs_desc: "Tidak ada gunanya menemukan kembali apa yang telah dikembangkan orang lain. Kita cukup mereproduksi desain pesawat dari negara lain dan memanfaatkan investasi penelitian mereka."
 ETH_copy_light_plane_tt: "Buat varian §Y$iw_small_airframe$: [ITA.GetFlag]CR.32§!"
 ETH_copy_medium_plane_tt: "Buat varian §Y$iw_medium_airframe$: [ITA.GetFlag]Ca.101§!"
 ETH_asmera_naval_college: "[GetNavalCollegeName]"
 ETH_asmera_naval_college_desc: "Memproduksi dan memelihara kapal saja tidak cukup untuk membentuk angkatan laut. Kami membutuhkan perwira dan spesialis yang sangat terlatih dalam memanfaatkan aset angkatan laut dalam pertempuran. Oleh karena itu, kami akan mendirikan akademi angkatan laut pertama [ETH.GetName]."
 ETH_asmera_naval_college_tt: "Ubah §Y[GetEthiopianNavySpiritName]§! dengan:\n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$: §G-30%§!"
 unlock_spirit_of_naval_academy_tt: "Membuka §YSemangat Akademi Angkatan Laut§!"
 ETH_naval_college_reduction: "Penelitian Perguruan Tinggi Angkatan Laut"
 ETH_capital_school_of_technology: "[ROOT.Capital.GetCapitalVictoryPointName] Sekolah Teknologi"
 ETH_capital_school_of_technology_desc: "Reformasi pendidikan kita terbukti berhasil dan bernilai investasi. Kita harus mempercepat kemajuan kita dengan menyatukan para ahli teknik dari berbagai negara ke dalam satu sekolah teknologi."
 ETH_regional_supply_depots: "Depot Pasokan Regional"
 ETH_regional_supply_depots_desc: "Pasukan kita tidak akan mampu mempertahankan tanah airnya jika tidak memiliki amunisi atau makanan. Lagipula, pasukan berbaris dengan perutnya. Kita harus memastikan pasokannya selalu mencukupi dengan mendirikan depot pasokan militer regional di seluruh [ETH.GetName]."
 ETH_expand_the_levy: "Perluas [GetChitetName]"
 ETH_expand_the_levy_desc: "Dengan dukungan dan pelatihan yang lebih baik, [GetChitetName] telah menjadi kekuatan militer yang kuat dan fleksibel. Dengan landasan yang kuat ini, kami akan memperluas [GetChitetName] untuk menghalangi agresor asing."
 ETH_expand_the_levy_tt: "Meningkatkan jumlah Divisi Chitet Sefari yang dapat dikerahkan menjadi §Y48§!.\nMenambahkan batalyon §Y3 $irregular_infantry$§! ke Divisi Chitet Sefari. Tambahkan §Y$engineer$§!, §Y$military_police$§!, dan §Y$field_hospital$§! jika teknologi yang relevan telah diteliti."
 ETH_the_junior_officer_corps: "Korps Perwira Muda"
 ETH_the_junior_officer_corps_desc: "Angkatan bersenjata telah didominasi oleh bangsawan selama berabad-abad. Jika kita ingin menjadikannya lebih efektif di medan perang, kita perlu mendirikan sekolah perwira dan program pelatihan yang mengedepankan meritokrasi dibandingkan nepotisme. Batu loncatan menuju hal itu adalah pembentukan korps perwira junior."
 ETH_camouflage: "Kamuflase"
 ETH_camouflage_desc: "Dengan diperkenalkannya pesawat ke medan perang, semakin sulit untuk mendapatkan unsur kejutan. Untuk meminimalkan visibilitas niat taktis kami, kami memerlukan pasukan kami untuk melakukan pelatihan kamuflase dan penyembunyian."
 ETH_camouflage_army_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIER_CAS_DAMAGE_REDUCTION$: §G+10%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§!"
 ETH_camouflage_air_tt: "Ubah §Y[GetEthiopianAirforceSpiritName]§! dengan:\n$MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-15%§!"
 ETH_the_fetno-derash: "Fetno-Derash"
 ETH_the_fetno-derash_desc: "Pekerjaan intelijen semakin menjadi faktor penentu tidak hanya di medan perang, namun juga dalam menjaga keselamatan kepemimpinan politik kita. Oleh karena itu kita akan membentuk badan intelijen khusus untuk menjaga keamanan kita dan lebih memahami musuh-musuh kita."
 ETH_debre_zeyit_air_force_training_center: "[ETHGetAirBaseName] Pusat Pelatihan Angkatan Udara"
 ETH_debre_zeyit_air_force_training_center_desc: "Mengemudikan pesawat merupakan tugas yang sulit. Menerbangkannya ke medan pertempuran tentu saja memerlukan keahlian lebih. Untuk memastikan pilot kami mampu menjalankan tugasnya, kami akan mendirikan pusat pelatihan angkatan udara khusus dan mulai melakukan standarisasi pelatihan mereka."
 ETH_debre_zeyit_air_force_training_center_tt: "Ubah §Y[GetEthiopianAirforceSpiritName]§! dengan:\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-25%§!"
 ETH_unlock_spirit_airforce_tt: "Membuka §Y$air_force_spirit$§!"
 ETH_purchase_obsolete_ships: "Beli Kapal Usang"
 ETH_purchase_obsolete_ships_tt: "Buka keputusan untuk membeli kapal tua dari negara-negara besar."
 ETH_purchase_obsolete_ships_desc: "Meskipun kita mengalami kemajuan dalam pengembangan angkatan laut, kita belum mampu mengerahkan armada yang cukup mampu mempertahankan garis pantai kita. Namun, kami mungkin bisa membeli beberapa kapal tua dari negara lain untuk memperkuat armada kami."
 ETH_new_weapons_and_tactics: "Senjata dan Taktik Baru"
 ETH_new_weapons_and_tactics_desc: "Mengikuti kemajuan teknologi pasukan lain memerlukan investasi terus-menerus pada pasukan kita agar mereka selalu diperlengkapi dan dilatih untuk menghadapi ancaman terkini."
 ETH_old_reliable: "Lama Dapat Diandalkan"
 ETH_old_reliable_desc: "Senjata yang sederhana, andal, dan dapat diperbaiki lebih diminati di lini depan dibandingkan senjata rumit yang banyak digunakan oleh tentara saat ini. Mengapa membuang-buang waktu dan sumber daya untuk melatih pasukan kita dengan senapan baru ketika mereka sudah tahu cara menggunakan senapan lama?"
 ETH_old_reliable_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIER_MAX_DIG_IN$: §G+0.5§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+25%§!\n$modifier_army_sub_unit_infantry_attack_factor$: §G+5%§!\n$modifier_army_sub_unit_infantry_defence_factor$: §G+10%§!\n$modifier_army_sub_unit_infantry_speed_factor$: §G+10%§!"
 ETH_bring_in_foreign_advisors: "Datangkan Penasihat Asing"
 ETH_bring_in_foreign_advisors_desc: "Meskipun kami terus mengalami kemajuan dalam menciptakan angkatan udara [ETH.GetAdjective], kami kurang memiliki pengalaman langsung yang penting untuk memastikan pilot kami dimanfaatkan secara maksimal. Oleh karena itu, kami akan mendatangkan petugas dari luar negeri untuk memberi nasihat tentang bagaimana kami dapat meningkatkan diri."
 ETH_bring_in_foreign_advisors_tt: "Ubah §Y[GetEthiopianAirforceSpiritName]§! dengan:\n$MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-5%§!\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-5%§!\n$MODIFIER_AIR_ACCIDENTS$: §G-15%§!"
 ETH_available_as_air_chief_tt: "Tersedia sebagai Panglima Angkatan Udara:"
 ETH_ethiopian_officers: "[ROOT.GetAdjective] Petugas"
 ETH_ethiopian_officers_desc: "Seiring dengan berlanjutnya pengembangan angkatan udara [ETH.GetAdjective], kita perlu memastikan bahwa kita memiliki perwira yang dapat mengoordinasikan pilot kita secara efektif. Daripada mengandalkan penasihat sementara dari luar negeri, kami akan mengembangkan keahlian kami sendiri dari awal."
 ETH_ethiopian_officers_tt: "Ubah §Y[GetEthiopianAirforceSpiritName]§! dengan:\n$MODIFIER_AIR_ATTACK$: §G+15%§!"
 ETH_promote_the_war_heroes: "Promosikan Pahlawan Perang"
 ETH_promote_the_war_heroes_desc: "Kami berutang kebebasan kami kepada para pahlawan yang mempertaruhkan nyawa mereka di medan perang. Untuk menjaga semangat tinggi dan dukungan terhadap angkatan bersenjata, kami akan mengangkat pahlawan perang kami ke posisi yang lebih bergengsi."
 ETH_expand_the_officer_corps: "Perluas Korps Perwira"
 ETH_expand_the_officer_corps_desc: "Kurangnya meritokrasi di angkatan bersenjata telah menjadi kelemahan paling krusial dalam beberapa tahun terakhir. Untuk memastikan orang-orang yang paling terampil memimpin pasukan kita, kita perlu memperluas korps perwira dan mengizinkan perpindahan mereka yang memperoleh pangkat mereka melalui nepotisme."
 ETH_medal_gain_tt: "Meningkatkan jumlah XP yang diperoleh Komandan Divisi saat dianugerahi medali sebesar §G+75%§!"
 ETH_officer_promotion_boost_tt: "Semua §Ypetugas§! masa depan yang dipromosikan ke pangkat §Yumum§! akan menerima §G+1 Serangan§! dan §G+1 Pertahanan§!"
 ETH_the_common_soldier: "Prajurit Biasa"
 ETH_the_common_soldier_desc: "Sebuah tentara tidak ada artinya tanpa prajurit biasa yang mempertaruhkan nyawanya setiap hari tanpa mengharapkan imbalan atau pengakuan. Para pahlawan ini harus dihormati atas kontribusinya terhadap keselamatan kita bersama."
 ETH_develop_the_capital_region: "Kembangkan [271.GetName]"
 ETH_develop_the_capital_region_desc: "Kita perlu meningkatkan laju industrialisasi demi kemajuan masyarakat kita dan perlindungan [ETH.GetNameDef]. Oleh karena itu, kami akan berinvestasi di kawasan sekitar [ETH.Capital.GetCapitalVictoryPointName], mengubahnya menjadi jantung industri [ETH.GetName]."
 ETH_develop_the_capital_region_tt: "Membuka keputusan untuk memperluas jaringan listrik untuk mencakup seluruh [271.GetName]."
 ETH_the_state_bank_of_ethiopia: "Bank Negara [ETH.GetNonIdeologyName]"
 ETH_the_state_bank_of_ethiopia_desc: "Dengan memperluas sumber daya Bank Negara [ETH.GetName], kita dapat memberikan jalur kredit baru kepada masyarakat dan bertindak sebagai diuretik finansial bagi perekonomian [ETH.GetAdjective] yang sedang sakit."
 ETH_the_state_bank_of_ethiopia_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!"
 ETH_infrastructure_projects: "Proyek Infrastruktur"
 ETH_infrastructure_projects_desc: "[ETH.GetName] memiliki banyak sumber daya alam yang didambakan dunia. Namun, kita tidak dapat memanfaatkan sumber daya ini tanpa sarana yang memadai untuk membawanya ke pabrik atau ke luar negeri. Kita harus segera memperluas infrastruktur dan menghilangkan hambatan ekonomi ini."
 ETH_rebuilding_the_country_idea: "Membangun kembali negara"
 ETH_cie: "[GetEthiopianRailwayName]"
 ETH_cie_imperial: "Perusahaan Impériale des Chemins de Fer Éthiopiens"
 ETH_anarchist_bank: "Bank Komunitas Afrika"
 ETH_central_bank: "Bank Sentral Afrika"
 ETH_GuardsNameCommunist: "Pengawal Revolusi"
 ETH_GuardsNameDefault: "Kebur Zabagna"
 ETH_GuardsNameDemocratic: "Garda Nasional"
 ETH_SefariNameCommunist: "Tentara Revolusioner"
 ETH_SefariNameDemocratic: "Angkatan Pertahanan Nasional"
 ETH_SefariNameDefault: "Mehal Sefari"
 ETH_cie_anarcho_communist: "[ETH.GetAdjective] Kolektif Rel"
 ETH_cie_stalinist: "[ETH.GetAdjective] Papan Rel"
 ETH_cie_fascist: "Ferrovie Imperiali Etiopiche"
 ETH_host_nation_name: "[?ETH.host_nation.GetNameWithFlag]"
 ETH_host_nation_fallback_name: "Negara Tuan Rumah"
 ETH_second_italo_ethiopian_war_flag: "Perang Italia-Ethiopia Kedua"
 ETH_infrastructure_projects_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_state_owned_industry: "Industri Milik Negara"
 ETH_state_owned_industry_desc: "Kita dapat melihat dengan jelas dari negara-negara besar di dunia, pemerintah yang bersedia melakukan intervensi terhadap pasar bebas mendapatkan keuntungan ekonomi yang luar biasa dengan mengendalikan produksi dan mengurangi pengangguran. Kita akan mengikuti jejak mereka dan dengan cepat mengembangkan perekonomian kita melalui industri milik negara."
 ETH_state_owned_industry_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+20%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+20%§!"
 ETH_encourage_local_development: "Mendorong Pembangunan Lokal"
 ETH_encourage_local_development_desc: "Tidak seorang pun dapat sepenuhnya mengantisipasi kebutuhan perekonomian secara keseluruhan dan berbahaya jika berpura-pura sebaliknya. Kami akan meninggalkan daerah untuk mengembangkan sesuai keinginan mereka. Bagaimanapun juga, lembaga politik dan dunia usaha lokallah yang paling mengetahui apa yang dibutuhkan di daerah mereka."
 ETH_encourage_local_development_tt: "Ubah §Y$ETH_state_development_dynamic_modifier$§! dengan:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+10%§!"
 ETH_encourage_local_development_2_tt: "Otoritas lokal akan mulai melakukan perbaikan negara sendiri."
 ETH_a_port_of_our_own: "Pelabuhan Milik Kita Sendiri"
 ETH_a_port_of_our_own_desc: "Dengan akuisisi lahan pesisir yang baru-baru ini kami lakukan, kami memiliki peluang untuk meningkatkan akses kami secara signifikan ke pasar internasional dengan membangun pelabuhan kami sendiri. Hal ini akan mempermudah impor dan ekspor barang, sehingga sangat membantu perekonomian kita."
 ETH_expanding_the_railway_network: "Memperluas Jaringan Kereta Api"
 ETH_expanding_the_railway_network_desc: "Kereta api sangat penting untuk mengangkut sumber daya ke pabrik dan selanjutnya ke pasar domestik atau internasional. Dengan memperluas jaringan kereta api, kita dapat meningkatkan kemampuan kita dalam menyalurkan sumber daya tersebut ke tujuan yang diinginkan. Hal ini juga akan menciptakan peluang yang lebih besar bagi masyarakat di seluruh [ETH.GetName] untuk pindah ke kota-kota industri yang sedang berkembang."
 ETH_taxing_the_nobility: "[ETH_GetSeizeAssetsTitle]"
 ETH_taxing_the_nobility_desc: "[ETH_GetTaxNobilityDesc]"
 ETH_expand_tax_exemptions: "[ETH_GetTaxExemptionTitle]"
 ETH_expand_tax_exemptions_desc: "[ETH_GetTaxExemptionDesc]"
 ETH_expand_tax_exemptions_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §R-5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R-5%§!"
 ETH_reform_the_currency: "Reformasi Mata Uang"
 ETH_reform_the_currency_desc: "Meskipun peredaran uang kertas [ETH.GetAdjective] meningkat dalam beberapa tahun terakhir, masih banyak yang lebih memilih menggunakan mata uang negara lain ketika melakukan perdagangan di [ETH.GetName]. Kita perlu mereformasi birr agar lebih diterima baik di dalam negeri maupun di luar negeri."
 ETH_increased_factory_output: "Peningkatan Output Pabrik"
 ETH_increased_factory_output_desc: "Ketika dunia terlihat semakin berbahaya, kita memerlukan pabrik-pabrik untuk meningkatkan produksi peralatan mereka sehingga militer dapat tetap menjadi alat pencegah yang dapat diandalkan terhadap agresor asing."
 ETH_increased_factory_output_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+10%§!"
 ETH_adapt_and_improve: "Beradaptasi dan Meningkatkan"
 ETH_adapt_and_improve_desc: "Dengan berkonsultasi dengan militer, para pemimpin industri dapat memperoleh keahlian mengenai apa yang benar-benar dibutuhkan di medan perang dan memberikan masukan ini kepada para insinyur mereka. Hal ini akan mencegah pasokan peralatan yang tidak memadai kepada pasukan kita dan memungkinkan mereka dengan cepat memberikan saran untuk perbaikan."
 ETH_adapt_and_improve_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_LAND_EQUIPMENT_UPGRADE_XP_COST$: §G-25%§!\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-25%§!"
 ETH_the_state_court: "Pengadilan Negeri"
 ETH_the_state_court_desc: "Sistem hukum [ETH.GetName] berakar pada praktik kuno yang sudah ada sejak berabad-abad yang lalu. Dengan gelombang reformasi yang kita lakukan baru-baru ini, sekarang adalah waktu yang tepat untuk mengkodifikasikan undang-undang agar sejalan dengan konstitusi dan membentuk pengadilan negara modern untuk mengadili kasus-kasus penting secara nasional."
 ETH_the_state_court_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+10%§!"
 ETH_ethiopian_shipbuilding: "[ROOT.GetAdjective] Pembuatan Kapal"
 ETH_ethiopian_shipbuilding_desc: "Sekarang kita telah mendirikan pelabuhan kita sendiri, akan lebih bijaksana jika kita meletakkan dasar untuk membangun dan memelihara angkatan laut kita sendiri. Kita pasti akan membutuhkan kapal kita sendiri jika kita ingin mempertahankan akses ke jalur pelayaran global."
 ETH_connecting_the_south: "Menghubungkan Selatan"
 ETH_connecting_the_south_desc: "Wilayah selatan [ETH.GetName] terisolasi dari wilayah ibu kota oleh daerah pegunungan. Untuk sepenuhnya mengintegrasikan kawasan ini ke dalam perekonomian kita yang berkembang pesat, kita perlu menghubungkannya melalui jalur kereta api ke pusat industri."
 ETH_bomb_proofing: "Pemeriksaan Bom"
 ETH_bomb_proofing_desc: "Mempertahankan kapasitas industri yang cukup untuk mendukung militer modern sangatlah penting selama masa perang. Oleh karena itu, peperangan udara kemungkinan besar akan memainkan peran yang menentukan dalam konflik di masa depan karena pesawat-pesawat tersebut menargetkan pusat industri negara-negara musuh. Oleh karena itu, kita harus memastikan pabrik kita dapat bertahan dari serangan tersebut."
 ETH_bomb_proofing_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$: §G-10%§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5%§!"
 ETH_rapid_industrial_expansion: "Ekspansi Industri yang Pesat"
 ETH_rapid_industrial_expansion_desc: "Terlepas dari upaya heroik yang dilakukan oleh masyarakat dalam negeri, kita memerlukan kapasitas industri yang lebih besar jika kita ingin tetap bebas dari pendudukan asing. Oleh karena itu, kita akan meningkatkan laju rencana ekonomi kita dan mengupayakan ekspansi industri yang lebih pesat lagi."
 ETH_rapid_industrial_expansion_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10%§!"
 ETH_develop_the_horn_of_africa: "Mengembangkan Tanduk Afrika"
 ETH_develop_the_horn_of_africa_desc: "Tanduk Afrika memiliki banyak sekali masyarakat, sumber daya dan potensi. Jika kita mau bekerja sama dengan pemerintah di kawasan ini dalam hal-hal yang berkaitan dengan perekonomian, kita bisa mulai memanfaatkan potensi tersebut dengan cara yang saling menguntungkan."
 ETH_develop_the_horn_of_africa_tt: "Membuka §Ydecisions§! untuk meningkatkan negara-negara independen, atau [ROOT.getAdjective] di Tanduk Afrika, dan mungkin mengintegrasikannya."
 ETH_horn_of_africa_tt: "Membuka §Ykeputusan§! untuk membentuk Tanduk Afrika."
 ETH_invest_tt: "Buka kunci investasi §Ykeputusan§! di negara bagian."
 ETH_invest_in_the_north: "Berinvestasilah di Utara"
 ETH_invest_in_the_north_desc: "Produksi mesin mulai dilakukan di utara [ETH.GetName]. Kita harus mendukung perkembangan ini dengan peningkatan investasi untuk membantu memperluas industri yang sedang berkembang ini."
 ETH_invest_in_the_east: "Berinvestasilah di Timur"
 ETH_invest_in_the_east_desc: "Dengan berinvestasi di wilayah timur, kita dapat memanfaatkan jaringan perdagangan bersejarah di kawasan ini dan mengubah kawasan tersebut menjadi pusat industri untuk memproses sumber daya [ETH.GetName], yang siap untuk diekspor."
 ETH_invest_in_the_west: "Berinvestasilah di Barat"
 ETH_invest_in_the_west_desc: "Berbagai wilayah [ETH.GetName] memiliki akses terhadap beragam sumber daya. Dengan berinvestasi di negara-negara barat, kita dapat dengan cepat meningkatkan industrialisasi produksi garmen dan memanfaatkan keahlian yang ada di bidang tersebut."
 ETH_expand_the_coffee_industry: "Memperluas Industri Kopi"
 ETH_expand_the_coffee_industry_desc: "Tidak ada kekurangan orang di seluruh dunia yang menuntut akses terhadap kopi. Sebagai salah satu sumber utama stimulan nikmat, kita harus memanfaatkan permintaan ini dengan berinvestasi di industri kopi dan meningkatkan ekspor kita."
 ETH_modernizing_the_industry: "Modernisasi Industri"
 ETH_modernizing_the_industry_desc: "Kami telah membuat kemajuan besar dalam meningkatkan kapasitas industri kami dalam beberapa tahun terakhir. Namun, hal ini akan menjadi tugas yang berkelanjutan seiring dengan pergeseran tuntutan perekonomian dan munculnya metode produksi baru. Oleh karena itu, kami akan berupaya untuk mewujudkan ketenagalistrikan dan pembangunan industri lainnya di seluruh [ETH.GetName] dan melanjutkan modernisasi ekonomi kami."
 ETH_modernizing_the_industry_tt: "Untuk semua negara bagian dalam wilayah yang telah berinvestasi di:\nTambahkan §G1§! §YBuilding Slot§!.\nSatu Negara Bagian di setiap wilayah yang berinvestasi di:\nTambahkan §G1§! §Y$industrial_complex$§!."
 ETH_animal_husbandry: "Peternakan"
 ETH_animal_husbandry_desc: "Kuda dan unta mempunyai peran utama dalam distribusi barang dan transportasi manusia di [ETH.GetNameDef]. Kita harus meningkatkan investasi di bidang peternakan untuk memastikan pasokan dan kualitas hewan-hewan tersebut tidak pernah menurun."
 ETH_ethiopian_industrial_research_institute: "[ROOT.GetAdjective] Lembaga Penelitian Industri"
 ETH_ethiopian_industrial_research_institute_desc: "Jika kita ingin menghindari tertinggal satu langkah dari negara lain dalam bidang industri, maka kita harus memperbaiki institusi penelitian dalam negeri. Dengan melakukan hal ini, kita akan mulai melakukan inovasi sendiri dibandingkan mengimpor ide dari luar negeri."
 ETH_invite_foreign_prospectors: "Undang Prospector Asing"
 ETH_invite_foreign_prospectors_desc: "Daripada berusaha menduplikasi perkembangan penelitian dari luar negeri, kita harus memanfaatkan keahlian pemerintah dan dunia usaha asing untuk membantu kita memanfaatkan sumber daya alam kita yang melimpah dengan lebih baik."
 ETH_invite_foreign_prospectors_tt: "Membuka keputusan §Y$ETH_prospect_for_resources$§! di [ROOT.GetName] Utara. Membutuhkan §Y$excavation2$§! dan lebih dari §Y2§! tersedia §Ypabrik sipil§! untuk mengambil keputusan terhadap prospek."
 ETH_invite_foreign_industrialists: "Undang Asing [ETH_GetInvestorName]"
 ETH_invite_foreign_industrialists_desc: "Kami telah meningkatkan infrastruktur dan industri secara besar-besaran dalam beberapa tahun terakhir, menjadikan pemanfaatan sumber daya alam jauh lebih efisien. Namun, kita dapat mempercepat perkembangan industri kita dengan mengundang tenaga ahli dan industrialis asing untuk beroperasi di [ETH.GetName]."
 ETH_invite_foreign_industrialists_tt: "Desainer dari negara lain akan tersedia jika negara target memiliki §Yopini [ETH.GetFlag][ETH.GetNameDef] di atas§! §G75§!.\n\n§RDesainer terpilih akan dinonaktifkan jika negara asalnya berperang dengan [ETH.GetNameDef]!§!\n\nNegara potensial meliputi: §Y[ENG.GetFlag][ENG.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§!, §Y[GER.GetFlag][GER.GetName]§!, §Y[JAP.GetFlag][JAP.GetName]§!, §Y[CZE.GetFlag][CZE.GetName]§!, §Y[SWE.GetFlag][SWE.GetName]§!"
 ETH_the_second_italo-ethiopian_war: "Perang Italia-Ethiopia Kedua"
 ETH_the_second_italo-ethiopian_war_desc: "Serangan Natal tidak memberi kita kemenangan yang kita harapkan dan butuhkan. Sudah waktunya bagi [ETH.GetLeader] meninggalkan ibu kota dan mengambil alih komando tentara secara pribadi. Perang melawan Italia harus diakhiri!"
 ETH_the_second_italo-ethiopian_war_tt: "§Y$ETH_haile_selassie$§! tersedia sebagai Marsekal Lapangan"
 ETH_renewed_offensive: "Serangan yang Diperbarui"
 ETH_renewed_offensive_desc: "Pihak Italia mungkin mencoba untuk mendapatkan kembali inisiatif tersebut. Tapi itu berarti mereka tidak curiga terhadap serangan pasukan kita. Daripada hanya bertahan, kita harus memberikan perlawanan pada mereka."
 ETH_renewed_offensive_tt: "Serangan Infanteri §G+10%§!\nSerangan Infanteri Tidak Teratur §G+10%§!\nPertahanan Divisi §R-5%§!"
 ETH_renewed_offensive_tt_1: "Memodifikasi §Y$ETH_army_1_dynamic_modifier$§!:"
 ETH_falling_back: "Jatuh Kembali"
 ETH_falling_back_desc: "Garis depan kita dengan cepat menjadi tidak dapat dipertahankan dan jalur perbekalan kita semakin tipis, mundur secara terorganisir ke [ROOT.Capital.GetCapitalVictoryPointName] mungkin bijaksana tetapi kita harus berhati-hati dan tidak keluar dari lapangan sepenuhnya."
 ETH_falling_back_tt: "Unit Italia mendapat hukuman pergerakan dan serangan di negara bagian perbatasan yang dikuasai Ethiopia selama 60 hari."
 ETH_northern_thrust: "Dorongan Utara"
 ETH_northern_thrust_desc: "Prioritas pertama kami adalah merebut Eritrea. Jika kita dapat menghentikan kedatangan pasukan Italia dari pelabuhan mereka di Utara, mereka akan mengalami kesulitan dalam memasok pasukan mereka, dan kita kemudian dapat menghadapi front Selatan yang lebih lemah."
 ETH_victory_in_the_desert: "Kemenangan di Gurun"
 ETH_victory_in_the_desert_desc: "Ogaden adalah bagian terlemah dari front Italia. Kita harus memfokuskan upaya kita untuk mengalahkan mereka di sana, dan menindaklanjutinya dengan merebut pelabuhan mereka di selatan. Hal ini akan meringankan beban kami, dan memungkinkan kami untuk melanjutkan perjalanan ke Eritrea."
 ETH_the_defense_of_addis_ababa: "Pertahanan Addis Ababa"
 ETH_the_defense_of_addis_ababa_desc: "Addis Ababa adalah Ibukota bersejarah. Ini juga merupakan pusat industri Ethiopia. Jika kota ini jatuh, perjuangan kita akan hilang. Kita harus melakukan segala yang kita bisa untuk mempertahankan kota ini."
 ETH_the_defense_of_addis_ababa_tt_1: "§Y$VICTORY_POINTS_5010$§!:"
 ETH_the_defense_of_addis_ababa_tt_2: "§Y$VICTORY_POINTS_8036$§!:"
 ETH_the_hindenburg_wall: "Tembok Hindenburg"
 ETH_the_hindenburg_wall_desc: "Penasihat Turki kami, $ETH_wehib_pasha$, ingin membangun benteng yang setara dengan benteng Jerman pada perang terakhir di sekitar kota Harar dan Dire Dawa. Mempertahankan wilayah tersebut akan memastikan Italia tidak dapat menghubungkan lini depan mereka, dan mengamankan akses kita ke laut melalui pelabuhan di Djibouti."
 ETH_the_hindenburg_wall_tt_1: "§Y$VICTORY_POINTS_7980$§!:"
 ETH_the_hindenburg_wall_tt_2: "§Y$VICTORY_POINTS_13249$§!:"
 ETH_mercenaries: "Tentara bayaran"
 ETH_mercenaries_desc: "Banyak orang asing yang ingin bergabung dalam perjuangan kami karena berbagai alasan. Kebanyakan dari mereka adalah petualang tak berguna, hanya mengincar uang kita; tapi kita bisa merekrut beberapa Tentara Bayaran dari Kongo Belgia dan Arab. Mendapatkan beberapa pejuang berpengalaman di pihak kita tentu dapat membantu memberikan keseimbangan yang menguntungkan kita."
 ETH_mercenaries_congo_tt: "Menambahkan §Y3 unit Tentara Bayaran Kongo§!, jika salah satu dari §Y[838.GetName]§! dan §Y[837.GetName]§! dikendalikan secara ramah."
 ETH_mercenaries_arabia_tt: "Menambahkan §Y2 unit Tentara Bayaran Arab§!, jika salah satu dari §Y[843.GetName]§! dan §Y[835.GetName]§! dikendalikan secara ramah."
 ETH_reach_out_to_the_world: "Jangkau Dunia"
 ETH_reach_out_to_the_world_desc: "Dunia harus tahu apa yang terjadi di sini di [ROOT.GetName]. Kita telah bertahan melawan kekuatan-kekuatan yang jumlahnya lebih banyak daripada yang bisa kita lakukan secara manusiawi, dan melawan kekuatan-kekuatan besar di Eropa hingga terhenti. komunitas internasional harus menyadari bahwa kita memerlukan bantuan untuk melawan agresi yang melanggar hukum ini!"
 ETH_a_last_stand: "Pertahanan Terakhir"
 ETH_a_last_stand_desc: "Kita tidak boleh membiarkan kemunduran menghentikan kita. Sebagai upaya terakhir, kita dapat kembali ke $VICTORY_POINTS_13244$, dan mempersiapkan pertahanan di sana. Orang Italia akan berjuang untuk mempertahankan pasokan pasukan mereka sampai ke ujung barat [ROOT.GetName]."
 ETH_the_lessons_of_war: "Pelajaran Perang"
 ETH_the_lessons_of_war_desc: "Tidak ada yang tahu bagaimana mereka akan mengatasi tekanan di medan perang, apalagi bagaimana sebuah kerajaan atau negara akan mengatasinya. Meskipun kita kurang siap menghadapi tekanan peperangan modern, militer kita telah memetik pelajaran sulit dari perang dan menjadi lebih kuat karenanya."
 ETH_the_lessons_of_war_tt: "Ubah §Y[GetEthiopianArmySpiritName]§! dengan:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10%§!\n$MODIFIER_MAX_DIG_IN$: §G+2§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+10%§!"
 ETH_arms_purchases: "Pembelian Senjata"
 ETH_arms_purchases_desc: "Liga Bangsa-Bangsa gagal menghentikan Invasi Italia, malah mereka hanya memilih embargo penjualan senjata ke kedua negara. Mereka pasti menyadari bahwa ini lebih merugikan kita daripada [ITA.GetName]. Kita harus mempunyai alasan untuk menyatakan bahwa kita, sebagai pembela yang sah, harus diizinkan untuk membeli senjata secara internasional."
 ETH_arms_purchases_tt: "Membuka keputusan untuk membeli senjata dari pedagang senjata internasional."
 ETH_request_embargo: "Minta Embargo"
 ETH_request_embargo_desc: "Embargo terhadap [ITA.GetName] hanyalah sebuah tanda yang tidak merugikan mereka sama sekali. Liga Bangsa-Bangsa siap mendengarkan permintaan kami. Kita harus memfokuskan upaya kita untuk meyakinkan dewan tersebut agar menerapkan peningkatan embargo yang benar-benar merugikan Italia. Yang mencakup minyak dan baja, keduanya penting untuk mesin perang mereka."
 ETH_international_brigades: "Brigade Internasional"
 ETH_international_brigades_desc: "Waktunya telah tiba bagi Liga Bangsa-Bangsa untuk tidak hanya mencabut larangan pengiriman pasukan untuk mendukung perjuangan kita, namun juga mendorong negara-negara anggotanya untuk melawan penjajah!"
 ETH_league_of_nations_volunteer_resolution: "Resolusi Brigade Internasional Liga Bangsa-Bangsa"
 ETH_closing_the_suez: "Menutup Suez"
 ETH_closing_the_suez_desc: "Liga Bangsa-Bangsa harus memaksa [453.Owner.GetNameDef] menutup Terusan Suez untuk pelayaran [ITA.GetAdjective]. Hal ini akan sangat merugikan mesin perang [ITA.GetAdjective], dan memungkinkan kita berperang dengan kesetaraan."
 ETH_international_mediation: "Mediasi Internasional"
 ETH_international_mediation_desc: "Liga Bangsa-Bangsa tidak bisa membiarkan konflik antara dua negara anggotanya berlangsung selama ini. Mereka harus bertindak dan memaksa [ITA.GetName] mundur ke perbatasan sebelum perang!"
 ETH_international_mediation_tt: "[ITA.GetName] dan [ETH.GetName] akan menandatangani perdamaian putih."
 ETH_rally_around_the_emperor: "Berkumpul di Sekitar Kaisar"
 ETH_rally_around_the_emperor_desc: "Yang Mulia [ETH.GetLeader] adalah kunci utama yang menyatukan kerajaan kita yang beragam. Di masa krisis ini, kita harus mengesampingkan keluhan-keluhan kecil kita dan mendukung Yang Mulia, karena kelangsungan hidup [ETH.GetName] dan rakyatnya sedang dipertaruhkan."
 ETH_rally_around_the_emperor_tt: "Membuka keputusan untuk menetapkan kemungkinan §YNegara Tuan Rumah§! untuk §YPemerintah Etiopia di Pengasingan§!."
 ETH_support_spain_static_modifier: "Mendukung Spanyol"
 ETH_boarding_the_train: "Naik Kereta"
 ETH_boarding_the_train_desc: "Garis pertahanan kita mulai melemah dan kecuali ada perubahan drastis, [ETH.GetName] akan lenyap. Sementara banyak penasihatnya memperdebatkan dampak buruk dari tidak adanya takhta, Yang Mulia [ETH.GetLeader] telah memutuskan untuk berangkat ke Jenewa dengan tujuan menggalang dukungan internasional untuk perjuangan kita di Liga Bangsa-Bangsa."
 ETH_boarding_the_train_tt: "§Y$ETH_haile_selassie$§! meninggalkan [ROOT.GetName] untuk pergi ke Liga Bangsa-Bangsa. Jika Etiopia menyerah, $ETH_haile_selassie$ akan membentuk §YPemerintahan di Pengasingan§!."
 ETH_has_host_nation_tt: "Potensi §YNegara Tuan Rumah§! untuk Pemerintahan di Pengasingan telah ditetapkan"
 ETH_the_emperor_stays: "Kaisar Tetap"
 ETH_the_emperor_stays_desc: "Meskipun ada permohonan dari para penasihat, Yang Mulia [ETH.GetLeader] telah mengambil keputusan heroik untuk tetap berada di [ETH.GetName] dan melanjutkan perjuangan bersama para pejuang pemberaninya. Semoga dia bisa memberi kita kemenangan di saat-saat tergelap Kekaisaran."
 ETH_the_american_radio_address: "Alamat Radio Amerika"
 ETH_the_american_radio_address_desc: "Hukum Liga Bangsa-Bangsa terus-menerus dilanggar karena tindakan agresi berulang kali terjadi. Agar roh orang yang terkutuk tidak menguasai umat manusia, semua orang yang cinta damai harus bekerja sama agar mereka dapat berdiri teguh untuk menjaga hukum dan perdamaian."
 ETH_the_patriots: "Patriot"
 ETH_the_patriots_desc: "Meskipun para patriot Gojjam merupakan penghalang bagi rencana pemerintah kekaisaran [ETH.GetName] untuk wilayah tersebut, mereka sekarang membantu kami dengan mencegah [ITA.GetAdjective] untuk memerintah wilayah tersebut sama sekali. Kita harus melakukan apa yang kita bisa untuk membantu para patriot agar dapat mempertahankan pijakan di negara ini dan menjaga agar [ITA.GetAdjective] tidak merasa terlalu nyaman."
 ETH_the_patriots_tt: "Membuka fokus berkelanjutan §Y$ETH_supporting_the_arbegnoch$§!.\nMenambahkan §G+10§! target perlawanan di negara-negara yang diduduki musuh di Ethiopia Utara dan Tengah."
 ETH_allow_fundraising_campaigns_tt: "Membuka §Ykeputusan§! untuk memulai kampanye penggalangan dana guna meningkatkan perbendaharaan Kekaisaran."
 ETH_patriot_resistance_tt: "Perlawanan Aktif oleh Arbegnoch: §R+10%§!"
 ETH_addressing_the_league_of_nations: "Mengatasi Liga Bangsa-Bangsa"
 ETH_addressing_the_league_of_nations_desc: "Kegagalan majelis untuk mengambil tindakan terkait masalah perang penaklukan [ITA.GetName], dan akibat dari kebijakan pengabaian terhadap korban agresi, mengancam keberadaan Liga. Para anggota yang telah memilih kebijakan pengabaian harus ingat, ini kami hari ini, dan Anda besok..."
 ETH_the_abuna: "Abuna"
 ETH_the_abuna_desc: "Melawan penjajah [ITA.GetAdjective] bukan hanya soal kesetiaan kepada Kaisar, tetapi juga soal moralitas. Dengan berkonsultasi dengan $ETH_abuna_qerellos_iv$, kami dapat menunjukkan kepada orang-orang kebenaran tujuan kami dan perlunya mereka melakukan tugas mereka atas nama tuhan kami."
 ETH_the_lion_stands_firm: "Singa Berdiri Teguh"
 ETH_the_lion_stands_firm_desc: "Melalui Singa Penakluk Suku Yehuda, Yang Mulia Kaisar [ETH.GetLeader] telah terbukti menjadi pejuang yang cakap. Kita harus menggalang pasukan dengan menunjukkan kekuatan Kaisar mereka saat dia bertarung bersama mereka dan menunjukkan bahwa mesin perang [ITA.GetAdjective] dapat dikalahkan."
 ETH_the_lion_stands_firm_tt: "Memodifikasi §Y$ETH_army_1_dynamic_modifier$§!:\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+5%§!"
 ETH_unification_of_the_habesha: "Penyatuan Habesha"
 ETH_unification_of_the_habesha_desc: "Perang dengan [ITA.GetName] telah menyebabkan kerusakan yang tak terbayangkan pada infrastruktur dan penderitaan bagi rakyat kami. Mendapatkan kembali tanah air kita saja tidak lagi cukup. Kami menuntut kompensasi dari [ITA.GetAdjective] termasuk konsesi teritorial yang memungkinkan kami menyatukan masyarakat Habesha."
 ETH_the_ferengi: "Ferengi"
 ETH_the_ferengi_desc: "Meskipun Liga Bangsa-Bangsa lamban menanggapi permintaan bantuan kami, tidak ada kekurangan individu asing yang bersedia berjuang demi tujuan kami. Selama kita membayar mereka untuk melakukannya."
 ETH_the_ferengi_tt: "Membuka §Ydecisions§! untuk merekrut tentara bayaran menggunakan dana di perbendaharaan Kekaisaran."
 ETH_recruit_from_the_african_diaspora: "Rekrut dari Diaspora Afrika"
 ETH_recruit_from_the_african_diaspora_desc: "Tidak ingin sisa-sisa terakhir kemerdekaan Afrika musnah, banyak diaspora Afrika di seluruh dunia bersedia mengangkat senjata dan berjuang bersama kita. Bersama-sama, kita tidak hanya akan menyelamatkan [ETH.GetName], namun juga gagasan kebebasan Afrika."
 ETH_anti-italian_propaganda: "Propaganda Anti-Italia"
 ETH_anti-italian_propaganda_desc: "Meskipun kami sangat menghargai keramahtamahan tuan rumah yang mengizinkan Kaisar tinggal dengan aman di sini, mereka dapat berbuat lebih banyak untuk mempercepat pembebasan rakyat kami dari pendudukan fasis. Kita perlu membuat mereka sadar sepenuhnya akan kengerian yang dilakukan [ITA.GetAdjective] terhadap rakyat [ETH.GetName], dan menggalang mereka ke pihak kita untuk melakukan kampanye pembebasan."
 ETH_black_lions_resistance_tt: "Perlawanan Aktif oleh Black Lions: §R+10%§!"
 ETH_unlock_black_lions_tt: "Membuka fokus berkelanjutan §Y$ETH_strengthen_the_black_lions$§!.\nMenambahkan §G+10§! target perlawanan di negara-negara yang diduduki musuh di Ethiopia Selatan."
 ETH_the_heroes_of_ethiopia: "Pahlawan Etiopia"
 ETH_the_heroes_of_ethiopia_desc: "Banyak pemimpin militer kita yang telah membuktikan diri mereka sebagai ahli strategi yang hebat. Meskipun musuh mempunyai keuntungan materi yang sangat besar, para pemimpin militer kita telah menghentikan kemajuan mereka. Kita harus memberi penghargaan kepada para pahlawan ini atas kontribusi mereka terhadap kelangsungan hidup [ETH.GetNameDef]."
 ETH_seyoum_mengesha_upgrade_tt: "Keuntungan:\n§Y$army_regrouping_2$§!"
 ETH_mulugeta_yeggazu_of_illubabor_upgrade_tt: "Keuntungan:\n§Y$army_chief_morale_3$§!"
 ETH_ras_imru_haile_selassie_upgrade_tt: "Keuntungan:\n§Y$army_infantry_2$§!"
 ETH_the_heroes_of_ethiopia_tt: "Memodifikasi §Y$ETH_army_1_dynamic_modifier$§!:\n$modifier_army_sub_unit_irregular_infantry_attack_factor$: §G+5%§!\n$modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+5%§!"
 ETH_learning_from_the_enemy: "Belajar Dari Musuh"
 ETH_learning_from_the_enemy_desc: "Meskipun kapasitas industri kita terbatas, kita dapat memanfaatkan keunggulan teknologi [ITA.GetAdjective] dengan merekayasa balik kendaraan dan peralatan mereka, sehingga membuat mereka melawan penciptanya."
 ETH_learning_from_the_enemy_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"
 ETH_learning_from_the_enemy_armor: "Belajar dari musuh: Kendaraan Lapis Baja"
 ETH_learning_from_the_enemy_air: "Belajar dari musuh: Pesawat"
 ETH_light_tank_tt: "Buat varian §Y$light_tank_chassis_1$: [ITA.GetFlag] L3/35§!"
 ETH_aircraft_tt: "Buat varian dari §Y$small_plane_airframe_0$: [ITA.GetFlag] CR.32§!\nBuat varian dari §Y$medium_plane_airframe_0$: [ITA.GetFlag] Ca.101§!"
 ETH_organize_regional_revolts: "Mengatur Pemberontakan Regional"
 ETH_organize_regional_revolts_desc: "[ITA.GetAdjective] belum menguasai tanah air kita. Perlawanan terhadap pendudukan terus-menerus menguras peralatan, tenaga kerja, dan yang paling penting, semangat mereka untuk melanjutkan upaya kolonial berdarah ini. Kita harus terus membantu perlawanan dan mulai mengoordinasikan upaya untuk menggulingkan pasukan pendudukan [ITA.GetAdjective]."
 ETH_organize_regional_revolts_tt: "Membuka §Ykeputusan§! untuk mengorganisir pasukan pemberontak di wilayah pendudukan."
 ETH_secure_arms: "Senjata Aman"
 ETH_secure_arms_desc: "Industri [ETH.GetName] yang terbatas terbukti tidak mampu mendukung angkatan bersenjata. Kita harus memanfaatkan kekayaan perbendaharaan kekaisaran untuk membeli senjata dan segera memberikannya kepada pejuang heroik kita."
 ETH_secure_arms_tt: "Membuka §Ykeputusan§! untuk membeli peralatan militer menggunakan dana di perbendaharaan Kekaisaran"
 ETH_volunteers: "Relawan"
 ETH_volunteers_desc: "Di seluruh dunia, masyarakat tertindas memandang [ETH.GetName] sebagai simbol harapan dalam perjuangan melawan agresi imperialis yang luar biasa. Kini, orang-orang dari luar negeri mulai berkumpul di belakang spanduk [ETH.GetAdjective] untuk berjuang bersama kami. Nampaknya masih ada yang enggan melihat impian kebebasan padam begitu saja karena keinginan [ITA.GetLeader]."
 ETH_fait_accompli: "Fait Accompli"
 ETH_fait_accompli_desc: "Walaupun banyak yang beranggapan [ETH.GetName] akan menjadi catatan kaki dalam sejarah kolonialisme, hal ini malah mengatasi rintangan yang sangat besar dengan tidak hanya menangkis invasi [ITA.GetAdjective], namun juga mendepak [ITA.GetName] sepenuhnya dari Afrika Timur. Yang masih harus dilakukan adalah [ITA.GetAdjective] secara resmi mengakui kekalahan mereka."
 ETH_fait_accompli_tt: "§Y[ITA.GetNameWithFlag]§! akan menandatangani perdamaian dengan §Y[ROOT.GetNameWithFlag]§!, menyerahkan negara-negara Afrika mana pun yang dikendalikan oleh [ROOT.GetNameDef]."
 ETH_reclaiming_ethiopia: "Merebut kembali Etiopia"
 ETH_reclaiming_ethiopia_desc: "Kami perlahan-lahan membujuk tuan rumah kami untuk secara resmi mengakui [ETH.GetLeader] sebagai penguasa sah [ETH.GetName], meskipun [ITA.GetName] diduduki secara ilegal. Mereka hanya memerlukan satu dorongan lagi dan kita mungkin akhirnya dapat memulai kampanye pembebasan yang telah lama ditunggu-tunggu."
 ETH_reclaiming_ethiopia_not_exile_tt: "Efek jika bukan Pemerintahan di Pengasingan:"
 ETH_reclaiming_ethiopia_exile_tt: "Dampak jika [ROOT.GetName] memiliki Pemerintahan di Pengasingan:"
 ETH_haile_selassie_returns_tt: "$ETH_haile_selassie$ kembali ke [ETH.GetName]:"
 ETH_reclaiming_ethiopia_event_tt: "§Y[GetEthiopianHostName]§!:"
 ETH_formal_request_unlocked_tt: "Membuka §Ykeputusan§! untuk membuat permintaan resmi kepada Negara Tuan Rumah untuk bergabung dalam perang jika Pemerintah di Pengasingan"
 ETH_ethiopia_recognized_tt: "[ROOT.GetLeader] diakui sebagai pemimpin sejati [ROOT.GetNameDef]:\n§Y[ROOT.GetName]§! dapat memanggil sekutu untuk berperang."
 ETH_the_heir_of_solomon: "Pewaris Sulaiman"
 ETH_the_heir_of_solomon_desc: "[ENG.GetName] telah menciptakan ketegangan di Palestina, yang menyebabkan runtuhnya dukungan terhadap mandat pemerintahan Liga Bangsa-Bangsa. Mungkinkah mereka terbuka untuk mengalihkan pemerintahan di wilayah tersebut kepada orang lain? Dan siapa yang lebih cocok untuk tugas itu selain pewaris Sulaiman, [ETH.GetLeader]."
 ETH_protector_of_the_somalis: "Pelindung Somalia"
 ETH_protector_of_the_somalis_desc: "[SOM.GetAdjective] tidak hanya tunduk pada aturan barbar [ITA.GetAdjective], namun mereka juga diwajibkan berperang melawan rakyatnya sendiri demi perluasan wilayah [ITA.GetLeader]. Ketika [ITA.GetName] diusir dari wilayah tersebut, kami akan melindungi [SOM.GetAdjective] dari eksploitasi kekuatan Eropa lainnya."
 ETH_the_king_of_kings: "Raja segala raja"
 ETH_the_king_of_kings_desc: "Yang Mulia, [ETH.GetLeader], telah membebaskan kami dari nasib memalukan menjadi pelayan [ITA.GetAdjective]s. Beliau adalah pemimpin yang tiada bandingannya di dunia modern dan harus dihormati."
 ETH_rebuilding_the_country: "Membangun kembali negara"
 ETH_rebuilding_the_country_desc: "Dengan dipulihkannya kewenangan penuh atas tanah kami, kami akhirnya dapat mulai memperbaiki kerusakan pada rumah dan industri kami yang disebabkan oleh [ITA.GetAdjective]s."
 ETH_support_anti-colonialist_resistance: "Mendukung Perlawanan Anti-Kolonialis"
 ETH_support_anti-colonialist_resistance_tt: "Membuka §Ykeputusan§! untuk meningkatkan perlawanan di negara-negara kolonial di §YAfrika Timur§!."
 ETH_support_anti-colonialist_resistance_desc: "Ancaman konflik akan menghantui kita tanpa batas waktu jika kekuatan kolonial tetap mempertahankan kekuasaannya di Afrika Timur. Kita harus mendorong mereka keluar dari kawasan ini dengan membangkitkan massa dan memberi mereka sarana untuk mendapatkan kembali kemerdekaannya."
 ETH_empower_the_ras: "Berdayakan Ras'"
 ETH_empower_the_ras_desc: "Memberdayakan petani yang tidak berpendidikan di kekaisaran hanya akan menyebabkan kehancuran sistem kekaisaran dalam jangka panjang. Sebaliknya, kami akan memberdayakan Ras sebagai imbalan atas kesetiaan yang berkelanjutan kepada Kaisar."
 ETH_re-convene_the_parliament: "Kumpulkan kembali Parlemen"
 ETH_re-convene_the_parliament_desc: "Sudah saatnya kita memulihkan UUD 1931 dan melanjutkan proses modernisasi kelembagaan [ETH.GetName]. Kami akan mengumpulkan kembali Parlemen Kekaisaran dan menambah jumlah deputi untuk mengatur berbagai wilayah Kekaisaran dengan lebih baik."
 ETH_unite_the_afar: "Satukan yang Jauh"
 ETH_unite_the_afar_desc: "Dengan beralihnya fokus Eropa ke benua mereka sendiri, ada kemungkinan untuk mendapatkan dukungan dari masyarakat Afar di Utara dengan membeli wilayah [DJI.GetName] dan menyatukan kembali suku Afar setelah terpisah selama beberapa dekade."
 ETH_lord_of_lords: "Tuan di atas segala tuan"
 ETH_lord_of_lords_desc: "Meskipun kerajaan kita terdiri dari banyak budaya, semuanya tunduk pada Tuhan di atas segala Tuhan yang sama. Bahkan bangsawan paling mulia pun tahu bahwa tugas mereka adalah kepada Kaisar. Yang Mulia adalah penguasa yang tak terbantahkan atas negeri ini."
 ETH_elect_of_god: "Pilihan Tuhan"
 ETH_elect_of_god_desc: "Kami melihat Tuhan dalam tindakan Kaisar kami. Bagaimana lagi kita bisa menjelaskan keberhasilannya di medan perang dan dalam kepemimpinannya di kerajaan besar kita? Rakyat tahu bahwa melakukan perintah Kaisar berarti bertindak sesuai dengan kehendak Yang Mahakuasa."
 ETH_restore_the_empire_of_axum: "Kembalikan Kekaisaran Aksum"
 ETH_restore_the_empire_of_axum_desc: "Dari tanah Sudan, hingga jazirah Arab, pernah dikuasai oleh nenek moyang kita. Kekuasaan kita telah terkikis selama berabad-abad, membuat kita rentan terhadap keinginan orang-orang Eropa. Waktunya telah tiba untuk membalikkan keadaan. Kami akan merangkul warisan kami dengan mereformasi Kekaisaran Axum dan merebut kembali tanah leluhur kami."
 ETH_restore_the_empire_of_axum_tt: "Membuka §Ykeputusan§! untuk membentuk Kekaisaran Aksum ketika mengendalikan cukup banyak negara bagian."
 ETH_a_federal_empire: "Kekaisaran Federal"
 ETH_a_federal_empire_desc: "Sistem pemerintahan imperial menawarkan stabilitas yang jauh lebih baik dibandingkan dengan kekacauan demokrasi parlementer. Selama para penguasa di berbagai daerah terus berjanji setia kepada Yang Mulia [ETH.GetLeader], kami tidak peduli bagaimana mereka mengatur wilayah mereka."
 ETH_a_federal_empire_tt: "Menghapus pengubah §Y$ETH_state_decentralization_dynamic_modifier$§! dari semua negara bagian."
 ETH_federal_factories_tt: "Tambahkan §Y1 Slot Bangunan§! dan §Y1 $industrial_complex$§! pada setiap wayang yang dilepas."
 ETH_empower_the_chambers: "Memberdayakan Kamar"
 ETH_empower_the_chambers_desc: "Konstitusi tahun 1931 tidak cukup mengatur peran Kaisar. Pemerintah juga tidak melibatkan masyarakat secara memadai dalam proses pengambilan keputusan. Kita perlu memberdayakan Kamar Deputi dengan memberi mereka kendali lebih besar atas urusan negara, sambil tetap mempertahankan peran suci Kaisar."
 ETH_empower_the_chambers_tt: "Ubah §Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! dengan:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+5%§!"
 ETH_the_african_union: "Menuju Persatuan Afrika"
 ETH_the_african_union_desc: "Kami menuntut diakhirinya kolonialisme karena dominasi suatu bangsa terhadap bangsa lain adalah salah. Tindakan terkoordinasi oleh seluruh warga Afrika dalam mengatasi masalah-masalah bersama sangat penting agar pendapat kita dapat diberi bobot yang tepat.  Oleh karena itu, kami akan bertindak berdasarkan integritas dan keyakinan keyakinan kami yang paling mendasar, dengan memperjuangkan pembebasan seluruh benua Afrika."
 ETH_african_independence_tt: "Membuka §Ykeputusan§! untuk meningkatkan perlawanan dan meningkatkan perolehan otonomi di negara-negara Afrika."
 ETH_arabian_independence_tt: "Membuka §Ykeputusan§! untuk meningkatkan perlawanan dan meningkatkan perolehan otonomi di negara-negara di semenanjung Arab."
 ETH_african_independence_join_tt: "Mengizinkan §Y[ROOT.GetNameDef]§! untuk campur tangan dalam perang kemerdekaan Afrika."
 ETH_african_union_faction: "Uni Afrika"
 ETH_pan-africanism: "Pan-Afrikaisme"
 ETH_pan-africanism_desc: "Tujuan kesetaraan yang kami cari adalah antitesis dari eksploitasi satu bangsa oleh bangsa lain, yang mana halaman-halaman sejarah Afrika baru-baru ini berbicara panjang lebar. Apa pun kedoknya, kejahatan ini harus dijauhi jika tidak ada dan dihancurkan jika ada. Merupakan tugas suci kita untuk memastikan bahwa impian kesetaraan pada akhirnya terwujud bagi semua orang yang masih belum bisa mewujudkannya."
 ETH_the_one_true_heir_of_solomon: "Satu-Satunya Pewaris Sejati Sulaiman"
 ETH_the_one_true_heir_of_solomon_desc: "Yang Mulia, [ETH.GetLeader], dapat menelusuri garis keturunan bangsawannya hingga ke Raja Salomo yang agung. Meskipun banyak negara telah meninggalkan Tuhan, kami [ETH.GetAdjective] tetap teguh pada keyakinan kami. Di zaman yang penuh kekacauan ini, sudah sepantasnya pewaris sejati Sulaiman memerintah tanah suci untuk melindunginya dari pengaruh ideologi buatan manusia yang merusak."
 ETH_the_one_true_heir_of_solomon_tt: "Membuka §Ykeputusan§! untuk membentuk Kekaisaran Sulaiman"
 ETH_jah: "Yah"
 ETH_jah_desc: "Gerakan Rastafarian telah menciptakan jaringan pendukung [ETH.GetName] yang tidak terduga di seluruh dunia. Banyak yang mengaitkan makna keagamaan yang besar dengan Kaisar kita, [ETH.Getleader]. Beberapa orang bahkan mengklaim bahwa dia adalah perwujudan Tuhan, atau lebih tepatnya Yah. Mungkin kita harus memanfaatkan dukungan internasional dengan merangkul gerakan Rastafarian ini."
 ETH_jah_tt: "Membuka §Ykeputusan§! untuk membentuk Kekaisaran Zion"
 ETH_military_communism: "Komunisme Militer"
 ETH_military_communism_desc: "Sedikit keberhasilan yang kita peroleh di garis depan adalah karena kecerdikan dan keberanian prajurit biasa, bukan kepemimpinan turun-temurun mereka. Gemuruh ketidakpuasan semakin keras. Imperialisme telah mencapai tujuannya.  Sekarang adalah waktunya redistribusi kekayaan dengan kekerasan."
 ETH_defending_our_homes: "Mempertahankan Rumah Kita"
 ETH_defending_our_homes_desc: "Klik kekaisaran di [ROOT.Capital.GetCapitalVictoryPointName] hanya mementingkan keselamatan diri mereka sendiri. Sementara itu, rumah dan keluarga kamilah yang hancur. Kita tidak bisa membiarkan hal ini berlangsung lebih lama lagi. Kami akan mempertahankan setiap inci tanah air kami, bukan untuk Kaisar, tapi untuk diri kami sendiri."
 ETH_anti_imperialist_agitation: "Agitasi Anti-Imperialis"
 ETH_anti_imperialist_agitation_desc: "Loyalitas masyarakat terhadap [ROOT.GetLeader] sedang goyah. Dengan gagal dalam tugas mereka yang paling penting, yaitu melindungi rakyat, para pemimpin kita telah sepenuhnya menunjukkan ketidakmampuan mereka. Di garis depan dan di jalanan, apa yang dulunya tidak terbayangkan kini dibicarakan secara terbuka. Sebuah bangsa, tanpa seorang kaisar."
 ETH_in_the_name_of_the_people: "Atas Nama Rakyat"
 ETH_in_the_name_of_the_people_desc: "Atas nama rakyat, kami akan membubarkan tirani dinasti yang telah memerintah [ROOT.GetName] selama berabad-abad.  Sebagai gantinya, kita akan menciptakan republik buruh yang bebas dari belenggu feodalisme. Dan melalui kekuatan kolektif kita, kita akan mengalahkan fasisme di Afrika."
 EHT_in_the_name_of_the_people_tt: "Buat §Ydua§! divisi elit komunis §YPengawal Merah§! dan §Ytiga§! divisi elit anarkis §YSinga Hitam§! di [ETH.Capital.GetCapitalVictoryPointName].\n\n§R$ETH_seyoum_mengesha$ tidak akan tersedia lagi!§!"
 ETH_callout_to_the_world: "Panggilan untuk Dunia"
 ETH_callout_to_the_world_desc: "Perjuangan kita melawan fasisme tidak hanya terjadi di negara kita, ini adalah bagian dari perjuangan global yang lebih luas melawan otoritarianisme. Kita akan menggalang kekuatan anti-fasisme di seluruh dunia demi tujuan kita, karena hari ini kitalah yang dianiaya, dan besok dunialah yang akan dianiaya."
 ETH_callout_to_the_world_tt: "§Y$ENG_sylvia_pankhurst$§! dan §Y$IA_emma_goldman$§! tersedia sebagai penasihat."
 ETH_soviet_aid: "Bantuan Soviet"
 ETH_soviet_aid_desc: "Kita telah berhasil melepaskan belenggu kesetiaan feodal. Sekarang kita harus mengalahkan kaum fasis dan mulai membentuk republik buruh kita. Jika ada orang yang bersimpati dengan tujuan kita, pastilah orang-orang [SOV.Getname]."
 ETH_soviet_aid_tt: "§R[SOV.GetNameDefCap] akan mengharapkan kontrol yang lebih besar atas urusan kita sebagai imbalan atas bantuan!§!"
 ETH_humanitarian_aid: "Bantuan Kemanusiaan"
 ETH_humanitarian_aid_desc: "Musuh tidak peduli seberapa besar penderitaan yang mereka timbulkan terhadap rakyat kita. Jika ini terus berlanjut, tidak ada lagi negara yang perlu dipertahankan. Dunia perlu melihat kengerian yang terjadi di sini dan kita ingin mereka segera mengirimkan bantuan kemanusiaan."
 ETH_humanitarian_aid_tt: "Ubah §Y$ETH_international_red_cross_dynamic_modifier$§! dengan:\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+10%§!"
 ETH_support_from_the_japanese_communists: "Anarko-Komunisme Jepang"
 ETH_support_from_the_japanese_communists_desc: "Masyarakat [JAP.GetAdjective] dan [ETH.GetAdjective] telah lama saling menghormati satu sama lain sebagai salah satu dari sedikit orang yang berhasil melawan penjajahan Eropa. Saat kita melampaui zaman feodal di [ETH.GetNameDef], ada orang-orang di [JAP.GetNameDef] yang memiliki cita-cita yang sama dan dapat membantu kita dalam menciptakan model masyarakat anarko-komunis."
 ETH_support_from_the_japanese_communists_tt: "§Y$IA_sakutaro_iwasa$§! dan §Y$IA_sanshiro_ishikawa$§! tersedia sebagai penasihat."
 ETH_support_from_the_japanese_communists_fascist_tt: "§RDapat menyebabkan [JAP.GetFlag][JAP.GetName] mengeluarkan embargo perdagangan terhadap [ETH.GetFlag][ETH.GetName]!§!"
 ETH_raise_from_the_ranks: "Naik dari Pangkat"
 ETH_raise_from_the_ranks_desc: "Bangsawan tidak lagi mempunyai komando atas angkatan bersenjata. Banyak prajurit pemberani kita yang telah membuktikan diri mereka sebagai pemimpin yang cakap. Sudah waktunya kita menghargai keberanian dan keterampilan di medan perang, bukannya koneksi dinasti atau kekayaan pribadi."
 ETH_raise_from_the_ranks_tt: "Menambah §Ydua§! perwira baru dengan pangkat §Yumum§!."
 ETH_soviet_rifles: "Senapan Soviet"
 ETH_soviet_rifles_desc: "Sayangnya kami kurang siap ketika [ITA.GetName] menyerang kami. Kini industri kita tidak dapat memenuhi tuntutan logistik peperangan modern. Kita memerlukan senapan dan amunisi di tangan setiap orang yang mampu memegangnya. Mungkin teman-teman kita di [SOV.Capital.GetCapitalVictoryPointName] bisa membantu."
 ETH_soviet_rifles_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan menerima §G10,000§! perlengkapan infanteri."
 ETH_military_advisors: "Jenderal Soviet"
 ETH_military_advisors_desc: "Meskipun banyak perwira kami yang telah beradaptasi dengan tuntutan peperangan modern, jelas bahwa mereka harus melakukan improvisasi sebaik mungkin. Kita bisa belajar banyak dari rekan-rekan kita di militer [SOV.GetAdjective]."
 ETH_military_advisors_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan mendapatkan marshall lapangan (§Y$SOV_semyon_budyonny$§!) dan seorang jenderal (§Y$SOV_vasily_kuznetsov$§!)."
 ETH_international_brigades_communist: "Brigade Internasional"
 ETH_soviet_rejection_tt: "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§! §Rkemungkinan besar akan menolak usulan ini jika mereka tidak lagi komunis atau sedang mengalami perang saudara!§!"
 ETH_international_brigades_communist_desc: "Ada banyak orang di seluruh dunia yang bersimpati dengan perjuangan kita melawan [ITA.GetAdjective]s. Kita harus memanfaatkan simpati mereka dan menawarkan mereka kesempatan untuk mengangkat senjata melawan fasisme bersama kita."
 ETH_peoples_army_focus: "Tentara Rakyat"
 ETH_peoples_army_focus_desc: "Meskipun pada awalnya kami lemah dalam peperangan modern, kami telah berhasil memperlambat invasi [ITA.GetAdjective] melalui penggunaan taktik yang tidak konvensional. Kita dapat memasukkan hal ini ke dalam doktrin militer kita dan melatih para perwira kita dalam melakukan peperangan asimetris."
 ETH_the_new_administration: "Pemerintahan Baru"
 ETH_the_new_administration_desc: "Di tengah gejolak yang terjadi baru-baru ini, banyak orang yang melakukan lebih dari yang diharapkan untuk membela negara kita. Beberapa di antaranya, seperti Senedu Gebru, juga memiliki keterampilan dan pengetahuan yang mampu memperbaiki masyarakat secara drastis. Sekarang, kami akan memberi mereka kesempatan untuk melakukannya."
 ETH_the_new_administration_tt: "§YSenedu Gebru§! tersedia sebagai penasihat politik.\n$rebellious_educator_tt$\nDua karakter §Yacak§! juga akan tersedia sebagai penasihat politik."
 ETH_clearing_the_skies: "Membersihkan Langit"
 ETH_clearing_the_skies_desc: "Tentara kita benar-benar terkena pesawat musuh tanpa ada cara untuk melindungi diri mereka sendiri. Parahnya lagi, musuh selalu mengetahui lokasi penempatan dan pergerakan kita. Kami membutuhkan angkatan udara dan tindakan balasan kami sendiri jika kami ingin memiliki harapan untuk menang. Oleh karena itu, kita harus mengirimkan sukarelawan untuk berlatih bersama angkatan udara [SOV.GetAdjective]."
 ETH_clearing_the_skies_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan menerima §G100§! [SOV.GetAdjective] pesawat tempur dan §YAwal Teknologi tempur§!."
 ETH_counter_the_armored_threat: "Melawan Ancaman Lapis Baja"
 ETH_counter_the_armored_threat_desc: "Peperangan lapis baja jelas menggantikan peran kavaleri di medan perang. Sayangnya, kita tidak mempunyai cara yang memadai untuk melawan armor [ITA.GetAdjective] dan industri kita belum mampu memproduksinya. Mungkin [SOV.GetName] bersedia berpisah dengan beberapa kendaraan lapis baja lama mereka?"
 ETH_counter_the_armored_threat_LaR_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan menerima teknologi §YMobil Lapis Baja Antar Perang§! dan §G480§! [SOV.GetAdjective] mobil lapis baja."
 ETH_counter_the_armored_threat_NoLaR_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan menerima §YInterwar Tank§! teknologi dan §G200§! [SOV.GetAdjective] tank."
 ETH_counter_the_armored_threat_NoNSB_tt: "Jika [SOV.GetFlag]§Y[SOV.GetName]§! setuju, [ETH.GetFlag]§Y[ETH.GetName]§! akan menerima teknologi §YGreat War Tank§! dan §G200§! [SOV.GetAdjective] tank."
 ETH_peace_negotiations: "Negosiasi Perdamaian"
 ETH_peace_negotiations_desc: "Rakyat kami telah berkorban banyak untuk menghentikan invasi [ITA.GetAdjective]. Sekarang kita telah membuktikan kepada [ITA.GetAdjective] bahwa kita tidak akan hancur di hadapan mereka, kita mempunyai kesempatan untuk berdamai. Atau paling tidak, perjanjian gencatan senjata."
 ETH_soviet_mediation: "Mediasi Soviet"
 ETH_soviet_mediation_desc: "Terlepas dari upaya heroik rakyat kami dalam menghentikan invasi [ITA.GetAdjective], kami masih jauh dari mampu meraih kemenangan total atas mereka. Liga Bangsa-Bangsa telah menunjukkan keengganannya untuk membantu kami, oleh karena itu satu-satunya harapan kami adalah [SOV.GetNameDefCap]."
 ETH_soviet_mediation_tt: "§R[SOV.GetNameDefCap] mungkin mencoba mengambil kendali kami sebagai imbalan untuk bernegosiasi dengan [ITA.GetName]!§!"
 ETH_support_spain: "Mendukung Spanyol"
 ETH_support_spain_desc: "Spanyol telah menderita di tangan kaum fasis dalam negeri. Namun, ada juga orang-orang yang meyakini bahwa fasisme harus dilawan dengan perlawanan keras dan bahwa rakyat dapat memerintah sendiri. Kami akan menggunakan pelajaran yang didapat dalam perang kami dengan [ITA.GetAdjective] untuk membantu perlawanan [SPC.GetAdjective]."
 ETH_local_committees: "Komite Lokal"
 ETH_local_committees_desc: "Kita mempunyai kesempatan untuk menciptakan sistem pemerintahan baru, bebas dari lapisan hierarki yang tidak ada gunanya, yang pasti akan melahirkan korupsi dan menekan keinginan masyarakat. Kita harus menggunakan kesempatan ini untuk membentuk federasi komune yang masing-masing mematuhi prinsip anarko-komunisme."
 ETH_a_guiding_hand: "Tangan Pembimbing"
 ETH_a_guiding_hand_desc: "Koalisi komune yang longgar tanpa otoritas yang lebih tinggi adalah hal yang terlalu idealis. Kita memerlukan kabinet yang terdiri dari perwakilan dan pakar untuk mengarahkan kebijakan ekonomi dan bereaksi cepat terhadap keadaan darurat. Kita tidak boleh membiarkan diri kita mengulangi kegagalan pemerintahan kekaisaran dalam suatu krisis."
 ETH_transformation_of_nature: "Transformasi Alam"
 ETH_transformation_of_nature_desc: "[ETH.GetNameDefCap] kaya akan sumber daya alam, tinggal menunggu untuk dimanfaatkan. Melalui pembangunan bendungan pembangkit listrik tenaga air di sungai, kita dapat mengalirkan listrik ke setiap rumah di wilayah ini. Pada saat yang sama, kita dapat menggunakan saluran air untuk memperluas kapasitas pertanian guna mendukung pertumbuhan populasi."
 ETH_transformation_of_nature_tt: "(§Y4 Negara Milik yang Dipilih Secara Acak§!): Tambahkan §G1§! Slot Bangunan"
 ETH_laying_the_tracks: "Meletakkan Trek"
 ETH_laying_the_tracks_desc: "Sebagian besar populasi dan industri terkonsentrasi di bagian barat negara kita. Oleh karena itu, untuk memanfaatkan sumber daya alam yang melimpah dengan lebih baik, kami memerlukan perluasan jaringan kereta api secara besar-besaran untuk memindahkan sumber daya tersebut ke pabrik kami."
 ETH_red_army_engineers: "Insinyur Tentara Merah"
 ETH_red_army_engineers_desc: "Banyak infrastruktur negara kita rusak berat selama invasi [ITA.GetAdjective]. Jika kita ingin membangun republik buruh yang sejati, kita tidak hanya perlu memperbaiki apa yang kita miliki, namun juga memulai program industrialisasi yang pesat. Kita harus memanfaatkan keterampilan rekan-rekan kita di Tentara Merah untuk memulai prosesnya."
 ETH_liberate_aussa: "Membawa Revolusi ke Jauh"
 ETH_liberate_aussa_desc: "[AFA.GetNameDefCap] diperintah oleh oligarki pengkhianat yang telah berulang kali memihak musuh kita. Ancaman terhadap [ETH.GetNameDef] tidak bisa lagi diabaikan. Kami akan membebaskan rakyat [AFA.GetAdjective] dan mengintegrasikan wilayah ini ke dalam republik buruh kami."
 ETH_demand_DJI: "Bebaskan [268.GetName]"
 ETH_demand_DJI_desc: "Dengan dibebaskannya [AFA.GetName], kami kini memerintah sejumlah besar masyarakat Afar. Namun suku Afar tetap terpecah karena pendudukan [FRA.GetAdjective] di [DJI.GetName]. Dengan menuntut pembebasan rakyat Afar dari kekuasaan imperialis, kita mungkin bisa mendapatkan loyalitas rakyat Afar dan mendapatkan pelabuhan strategis dalam proses tersebut."
 ETH_the_rif: "Rif"
 ETH_the_rif_desc: "Banyak dari kaum fasis yang kini bersaing untuk mendapatkan kekuasaan di Spanyol, dulunya adalah tentara yang menghancurkan Republik Rif di Maroko Utara. Kita harus menggunakan hubungan dekat kita dengan [SPC.GetName] untuk mendorong dekolonisasi wilayah Afrika mereka. Jika mereka benar-benar rekan kita, mereka pasti setuju. Dan jika belum, kita sudah tahu bagaimana menghadapi kolonialisme."
 #ETH_social_reforms: "Social Reforms"
 #ETH_social_reforms_desc: "Without the threat of a common enemy to unite us, we often find ourselves divided due to historic, cultural and religious grievances. We need a wave of social reforms to overcome these divisions so that we can remain united and continue the process of building a better [ETH.GetName]."
 #ETH_social_reforms_tt: "Unlock anarcho-communist social reform decisions."
 ETH_communal_education: "Pendidikan Komunal"
 ETH_communal_education_desc: "Memastikan bahwa setiap komunitas di [ETH.GetNameDef] memiliki akses terhadap pendidikan melalui sekolah dan perpustakaan sangat penting jika kita ingin meningkatkan standar hidup penduduknya."
 ETH_african_wildfire: "Kebakaran Hutan Afrika"
 ETH_african_wildfire_desc: "Kita berhasil mengatasi invasi [ITA.GetAdjective], namun kita tidak boleh beristirahat sampai seluruh Afrika terbebas dari kengerian kolonialisme. Kita harus menggunakan keterampilan dan sumber daya kita untuk mengobarkan api perlawanan di seluruh benua dan memaksa kaum imperialis untuk mundur."
 ETH_flames_across_the_sea: "Api Di Seberang Laut"
 ETH_flames_across_the_sea_desc: "Bukan hanya Afrika yang menderita akibat hegemoni Eropa. Negara-negara tetangga kita di seberang Laut Merah hampir tidak mempunyai kemerdekaan nyata dari tuntutan kaum imperialis. Kita harus menyebarkan api perlawanan ke semenanjung Arab sehingga masyarakat mempunyai kesempatan suatu hari untuk memerintah diri mereka sendiri sepenuhnya."
 ETH_heavy_industry: "Industri Berat"
 ETH_heavy_industry_desc: "Kita harus melanjutkan proses industrialisasi yang pesat jika kita ingin melepaskan diri dari cengkeraman ekonomi feodal. Penciptaan industri berat akan menarik pekerja ke kota, menciptakan kelas proletar teladan menggantikan kaum tani yang ada."
 ETH_arms_production: "Produksi Senjata"
 ETH_arms_production_desc: "Puncak dari industrialisasi adalah terciptanya industri senjata kita sendiri. Kita tidak akan lagi bergantung pada negara lain untuk perlengkapan pertahanan kita."
 ETH_mytishchi-ababa_plant: "Pabrik Mytishchi-Ababa"
 ETH_mytishchi-ababa_plant_desc: "Kita harus memanfaatkan hubungan dekat kita dengan Uni Soviet untuk mendapatkan keahlian dalam pembuatan mesin dalam negeri dan militer. Proyek pabrik bersama akan menjadi mekanisme sempurna untuk memperoleh pengetahuan seperti itu, dan siapa yang lebih baik untuk diajak bermitra selain Pembuatan Mesin Mytishchi."
 ETH_send_home_advisors: "Kirim Penasihat Rumah"
 ETH_send_home_advisors_desc: "Meskipun kami mendapat manfaat dari dukungan [SOV.GetName] selama perang dengan [ITA.GetName], kami tidak pernah menyangka mereka akan memaksa kami untuk tunduk pada mereka. Ketika kita membangun kapasitas industri dan militer kita sendiri, kita semakin memiliki kekuatan untuk menolak tuntutan [SOV.GetAdjective]. Oleh karena itu, sudah saatnya kita memperjelas siapa yang bertanggung jawab di [ETH.Capital.GetCapitalVictoryPointName]."
 ETH_send_home_advisors_tt: "Kembalikan semua penasihat militer [SOV.GetAdjective] ke [SOV.GetNameDef]."
 ETH_soviet-ethiopian_trade_agreement: "Perjanjian Perdagangan Soviet-Ethiopia"
 ETH_soviet-ethiopian_trade_agreement_desc: "Banyak orang di seluruh dunia yang enggan berdagang dengan kami karena adanya penolakan ideologis terhadap republik pekerja kami. Namun, kita memiliki peluang untuk menciptakan perjanjian perdagangan yang saling menguntungkan dengan [SOV.GetAdjective], yang memungkinkan kita untuk bertukar sumber daya dan barang tanpa hambatan perdagangan seperti biasanya."
 ETH_seek_new_trading_partners: "Mencari Mitra Dagang Baru"
 ETH_seek_new_trading_partners_desc: "Orang-orang di seluruh dunia mendambakan kekayaan yang ditawarkan negara kita, namun kita terjebak dalam perdagangan secara eksklusif dengan [SOV.GetAdjective]s. Kita harus menjangkau negara-negara lain untuk menunjukkan bahwa kita bukan sekedar perpanjangan tangan dari [SOV.GetName] dan mulai menarik kekayaan kembali ke masyarakat [ETH.GetAdjective]."
 ETH_freedom_at_gunpoint: "Kebebasan di bawah todongan senjata"
 ETH_freedom_at_gunpoint_desc: "Kami telah berhasil mengusir [ITA.GetAdjective] dalam upaya mereka untuk menundukkan orang-orang kami beberapa kali sekarang. Namun, negara-negara tetangga kita tidak seberuntung itu dalam melawan penjajah. Sudah waktunya kita mengubah pengalaman perang dan kekuatan ekonomi baru kita menuju pembebasan Afrika dengan menggunakan satu-satunya bahasa yang dipahami oleh kekuatan kolonial. Kekerasan."
 ETH_freedom_at_gunpoint_tt: "Buka keputusan §YKebebasan di Todongan Senjata§! untuk membebaskan negara-negara Afrika."
 ETH_boots_on_the_shore: "Sepatu bot di Pantai"
 ETH_boots_on_the_shore_desc: "Kami memiliki sejarah panjang perdagangan dan pertukaran budaya dengan masyarakat di semenanjung Arab. Sayangnya, mereka masih terjebak dalam sistem pemerintahan feodal. Jika kita ingin membebaskan masyarakat di semenanjung tersebut, kita akan mampu mengendalikan jalur perdagangan penting di sepanjang Laut Merah dan memproyeksikan pengaruh kita jauh ke Timur Tengah."
 ETH_request_soviet_hulls: "Minta Lambung Kapal Perang Soviet"
 ETH_request_soviet_hulls_desc: "Jika kita ingin menghindari blokade dalam konflik di masa depan, kita perlu belajar cara membuat kapal kita sendiri. [SOV.GetNameDefCap] baru-baru ini membatalkan beberapa proyek kapal perang mereka dan mungkin terbuka bagi kita untuk membeli lambung kapal yang belum selesai. Kita bisa belajar banyak dari pembelian semacam itu."
 ETH_organization_of_african_unity: "Organisasi Persatuan Afrika"
 ETH_organization_of_african_unity_desc: "Selama ini kebebasan dari penjajahan Eropa dipandang hanya sekedar memperoleh kemerdekaan. Namun, tampaknya kita semua masih menjadi target penaklukan di mata banyak pemimpin di luar Afrika. Hanya dengan berdiri bersama dan bekerja sama, masyarakat Afrika dapat berharap untuk tidak lagi menjadi subyek konflik."
 ETH_organization_of_african_unity_tt: "Buka keputusan untuk mengundang negara-negara Afrika yang merdeka ke §YOrganisasi Persatuan Afrika§!"
 ETH_pan-africanism_liberate_tt: "Dapatkan §Ytujuan perang yang bebas§! pada semua kekuatan kolonial di Afrika:"
 ETH_executive_council: "Dewan Eksekutif"
 ETH_executive_council_desc: "Kita harus mendorong kerja sama yang lebih besar di Organisasi Persatuan Afrika dengan membentuk badan eksekutif yang bertindak berdasarkan keinginan rakyat dan dapat merespons dengan cepat ancaman terhadap stabilitas di kawasan kita."
 ETH_executive_council_tt: "Buka keputusan untuk mengundang Anggota §YOrganisasi Persatuan Afrika§! ke Dewan Eksekutif."
 ETH_african_union: "Uni Afrika"
 ETH_african_union_desc: "Waktunya telah tiba bagi rakyat Afrika untuk bersatu dalam Uni Afrika. Kita tidak akan pernah lagi diancam oleh imperialis atau fasis saat kita berupaya menjadi negara adidaya pertama di Afrika."
 ETH_african_union_tt: "Buka keputusan untuk mengintegrasikan anggota §YDewan Eksekutif§! ke dalam §YUni Afrika§!"
 ETH_african_central_bank: "[ETH_GetCentralBankName]"
 ETH_african_central_bank_desc: "Dengan pembentukan [ETH_GetCentralBankName], kita dapat memulai proses mengintegrasikan perekonomian ke dalam Organisasi Persatuan Afrika. Hal ini akan memungkinkan kita untuk memanfaatkan sumber daya dan infrastruktur kita secara lebih efisien demi kemajuan semua negara anggota."
 ETH_african_central_bank_tt: "Buka keputusan untuk mengundang anggota §YOrganisasi Persatuan Afrika§! ke [ETH_GetCentralBankName]."
 ETH_african_central_bank_2_tt: "$MODIFIER_STABILITY_FACTOR$: §G5%§!\n$modifier_production_speed_industrial_complex_factor$: §G10%§!\n$modifier_production_speed_infrastructure_factor$: §G10%§!"
 ETH_mass_transit: "Transit Massal Kolektivisasi"
 ETH_mass_transit_desc: "Sebagian besar infrastruktur transportasi kita sudah ketinggalan zaman dan memerlukan penataan ulang agar dapat dimanfaatkan dengan lebih efisien. Orang-orang yang paling cocok untuk melaksanakan reformasi tersebut adalah para pekerja yang mengoperasikan infrastruktur."
 ETH_mutual_defense: "Saling Pertahanan"
 ETH_mutual_defense_desc: "Masyarakat Afrika tidak akan pernah memiliki perdamaian abadi sampai negara-negara di dunia menyadari bahwa biaya yang harus dibayar untuk menjajah kita terlalu besar. Untuk mencapai hal ini, para anggota Organisasi Persatuan Afrika harus membuat perjanjian pertahanan bersama, berjanji untuk melindungi satu sama lain jika ada di antara kita yang diserang."
 ETH_mutual_defense_tt: "Buka keputusan untuk mengundang anggota §YOrganisasi Persatuan Afrika§! ke dalam perjanjian pertahanan bersama."
 ETH_our_own_path: "Jalan Kita Sendiri"
 ETH_our_own_path_desc: "Kami terlalu lemah untuk melawan [SOV.GetAdjective] ketika mereka mengkhianati kami dengan mengambil kendali atas urusan kami. Kami sekarang berada dalam posisi yang lebih kuat dan akhirnya dapat mengambil tindakan untuk mendapatkan kembali kemerdekaan kami. Namun, kita harus bersiap menghadapi potensi pembalasan dari [SOV.GetAdjective]."
 ETH_our_own_path_tt: "§R[SOV.GetNameDefCap] akan marah dengan tindakan ini dan mungkin berusaha mengembalikan Etiopia ke bawah kendali [SOV.GetAdjective]!§!"
 ETH_communal_agriculture: "Pertanian Komunal"
 ETH_communal_agriculture_desc: "Dengan melakukan pertanian kolektif dan memperkenalkan metode pertanian baru, kita dapat meningkatkan hasil pertanian secara besar-besaran dan menjamin akses setiap orang terhadap pangan. Hal ini juga akan memungkinkan petani yang dibebaskan untuk mencari pekerjaan alternatif di kota daripada bertani subsisten."
 ETH_communal_agriculture_industry_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10%§!"
 ETH_communal_agriculture_consumer_tt: "Ubah §Y$ETH_industrialization_dynamic_modifier$§! dengan:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-5%§!"
 ETH_seize_the_means: "Rebut Sarananya"
 ETH_seize_the_means_desc: "Generasi pekerja [ETH.GetAdjective] telah menggarap ladang dan membangun industri perkotaan. Darah mereka ada di dalam tanah. Oleh karena itu, kami tidak lagi mengizinkan kelompok kaya untuk mengklaim kepemilikan atas aset tersebut. Mereka akan diserahkan kembali kepada rakyat."
 ETH_preparing_for_the_inevitable: "Mempersiapkan Hal yang Tak Terelakkan"
 ETH_preparing_for_the_inevitable_desc: "Negara-negara besar di seluruh dunia tidak akan menoleransi reformasi radikal yang kami lakukan di [ETH.GetNameDef] karena takut rakyatnya sendiri akan menuntut hal yang sama. Kita harus bersiap menghadapi upaya mereka yang tak terelakkan untuk menghancurkan cara hidup kita."
 ETH_refuge_for_the_spanish_exiles: "Perlindungan bagi Orang-Orang buangan Spanyol"
 ETH_refuge_for_the_spanish_exiles_desc: "Kawan-kawan ideologis kita di Spanyol telah menyaksikan impian mereka mengenai anarkisme hancur akibat upaya gabungan kaum fasis, Stalinis, dan kapitalis dari seluruh dunia. Kita harus membuka perbatasan bagi teman-teman kita yang kehilangan tempat tinggal dan menawarkan mereka kesempatan kedua untuk membangun masa depan yang lebih baik."
 ETH_the_lion_and_the_sun: "Singa dan Matahari"
 ETH_the_lion_and_the_sun_desc: "Yang Mulia [ETH.GetLeader] dan Kaisar Jepang, [JAP.GetLeader], telah berhasil menemukan banyak kesamaan di antara kerajaan besar kita.  [JAP.GetLeader] bahkan menyarankan agar pemerintahannya akan berinvestasi di [ETH.GetName] ketika kita akhirnya merebut kembali tanah air kita."
 ETH_japanese_investments_tt: "Membuka §Ydecisions§! untuk investasi Jepang di [ROOT.GetName] setelah [ROOT.GetName] dibebaskan"
 ETH_an_ethiopian_navy_in_exile: "Angkatan Laut Ethiopia di Pengasingan"
 ETH_an_ethiopian_navy_in_exile_desc: "Setelah menyaksikan demonstrasi kekuatan angkatan laut [JAP.GetAdjective], Yang Mulia [ETH.GetLeader] telah meminta bantuan dari tuan rumah kami yang ramah untuk pembangunan angkatan laut [ETH.GetAdjective] guna membantu pembebasan tanah air kami dan melindunginya dari serangan apa pun di masa depan."
 ETH_an_arabic_base: "Pangkalan Arab"
 ETH_an_arabic_base_desc: "Semakin jelas bahwa [JAP.GetName] bermaksud membentuk kembali kawasan Asia-Pasifik di tahun-tahun mendatang. Karena semakin menyelaraskan diri dengan [JAP.GetAdjective], masuk akal bagi kita untuk membuat karya untuk diri kita sendiri. Sebagai permulaan, kita harus meminta penguasaan atas tanah nenek moyang kita di jazirah Arab."
 ETH_uk_arabia_tt: "Setiap negara bagian §YArabian§! dimiliki oleh §Y[ENG.GetNameWithFlag]§! atau §Yally§! dari §Y[ENG.GetNameDef]§!"
 ETH_an_empire_in_the_shade_of_the_sun: "Sebuah Kerajaan di Bawah Naungan Matahari"
 ETH_an_empire_in_the_shade_of_the_sun_desc: "Yang Mulia [ETH.GetLeader] adalah seorang kaisar tanpa kerajaan. Hal ini tidak hanya mempermalukan Kaisar kami tetapi juga membatasi kemampuan kami untuk mengatur pembebasan [ETH.GetName]. Mungkin teman-teman kami di [JAP.Capital.GetCapitalVictoryPointName] bersedia memberi kami kendali atas sebuah pulau agar kami dapat menggunakannya sebagai basis operasi untuk pembebasan tanah air kami."
 ETH_japan_has_island_tt: "Jepang mengendalikan setidaknya satu negara kepulauan non-inti."
 ETH_japan_joins_tt: "§Y[JAP.GetNameDefCap]§! akan bergabung dalam perang §Y[ROOT.GetName]§! melawan [ITA.GetName].\n§Y[ROOT.GetName]§! akan menjadi boneka §Y[JAP.GetName]§!"
 ETH_an_audience_with_countryleadertitle: "Penonton dengan [GetGermanCountryLeaderTitle]"
 ETH_an_audience_with_countryleadertitle_desc: "[GER.GetLeader] memiliki rencana ambisius untuk menata ulang tidak hanya [GER.GetNameDef], tetapi juga seluruh dunia. Dengan bertemu dengan pemimpin [GER.GetAdjective], dunia akan terus melihat Yang Mulia, [ETH.GetLeader], sebagai satu-satunya penguasa sejati [ETH.GetName]."
 GER_fascism_leader_title: "Fuhrer"
 GER_male_kaiser_title: "Kaisar"
 GER_female_kaiser_title: "Kaiserin"
 GER_chancellor_title: "Rektor"
 GER_generalfeldmarshall_title: "Jenderalfeldmarshall"
 ETH_befriend_goring: "Bertemanlah dengan Goring"
 ETH_befriend_goring_desc: "Pemerintah Jerman adalah jaringan intrik politik dan pengkhianatan. Siapa pun yang mendengarkan [GER.GetLeader] pada saat tertentu mempunyai potensi untuk mempengaruhi keputusan kebijakan [GER.GetAdjective] secara besar-besaran. Mungkin kita bisa mendapatkan pengaruh dengan berteman dengan anggota elit pemerintahan, seperti $GER_hermann_goring$."
 ETH_steel_lions: "Singa Baja"
 ETH_steel_lions_desc: "[GER.GetNameDefCap] memelopori metode baru dalam berperang. Hari-hari peperangan kavaleri atau parit telah berakhir. Masa depan adalah milik tank. Kita hendaknya memanfaatkan waktu kita di [GER.GetNameDef] untuk belajar bagaimana memanfaatkan senjata perang modern dan mempersiapkan pembebasan tanah air kita."
 ETH_armor_officers_tt: "Maksimal dua petugas [ROOT.GetAdjective] mendapatkan sifat §Y$armor_officer$§!"
 ETH_german_mediation: "[GER.GetAdjective] Mediasi"
 ETH_german_mediation_desc: "Ketika ambisi [GER.GetAdjective] dan [ITA.GetAdjective] mulai selaras, isu [ETH.GetName] tetap menjadi batu sandungan bagi peningkatan kerja sama antara kedua negara. Mungkin [GER.GetLeader] dapat membujuk [ITA.GetLeader] untuk mengakhiri pendudukannya yang tidak masuk akal dan mengizinkan Kaisar untuk kembali ke tempat yang seharusnya di [ETH.GetName]."
 ETH_ger_and_ita_have_same_dieology_tt: "[GER.GetFlag]§Y[GER.GetName]§! mempunyai ideologi yang sama dengan [ITA.GetFlag]§Y[ITA.GetName]§!."
 ETH_sabotage_italo-german_relations: "Sabotase Hubungan Italia-Jerman"
 ETH_sabotage_italo-german_relations_desc: "Kita tidak bisa membiarkan [GER.GetNameDef] dan [ITA.GetName] melihat satu sama lain sebagai sekutu potensial. Kita harus melakukan segala daya kita untuk menyabotase hubungan antara keduanya. Jika tidak, kita mungkin melihat Yang Mulia menjadi tawanan [ITA.GetLeader] dan impian [ETH.GetName] yang bebas hancur."
 ETH_unlock_false_flag_tt: "Membuka keputusan untuk memulai operasi tanda palsu untuk membingkai [ITA.GetFlag] §Y[ITA.GetName]§!"
 ETH_joint_swedish-ethiopian_intelligence_program: "Program Intelijen Bersama Swedia-Ethiopia"
 ETH_joint_swedish-ethiopian_intelligence_program_desc: "Bantuan langsung kepada [ETH.GetName] akan menimbulkan pertanyaan mengenai netralitas [SWE.GetName]. Namun, mereka mungkin bersedia menawarkan dukungan terselubung untuk mempertahankan penyangkalan yang masuk akal. Dengan memanfaatkan koneksi kita di wilayah ini dan sumber daya [SWE.GetName], kita dapat mengurangi kekuasaan kolonial [ITA.GetAdjective] di Afrika."
 ETH_anti-tank_guns: "Senjata Anti-tank"
 ETH_anti-tank_guns_desc: "[SWE.GetName] memiliki beberapa gudang senjata terbaik di dunia. Meskipun secara teknis netral dalam urusan luar negeri, [SWE.GetAdjective] mungkin bersedia menyerahkan beberapa senjata anti-tank mereka jika hal itu dapat membatasi pengaruh fasis yang semakin besar."
 ETH_a_libyan_revolt: "Pemberontakan Libya"
 ETH_a_libyan_revolt_desc: "[ITA.GetAdjective] sedang berjuang untuk mempertahankan kendali atas wilayah yang mereka peroleh baru-baru ini di Afrika Timur. Dengan adanya pergeseran fokus mereka, kami akan melakukan yang terbaik untuk menabur benih pemberontakan di wilayah [LBA.GetAdjective] mereka yang berharga."
 ETH_ethiopias_cause_is_ours: "Perjuangan Ethiopia adalah perjuangan kita"
 ETH_ethiopias_cause_is_ours_desc: "Pemerintahan [SWE.GetAdjective] mulai menjauh dari netralitas karena mulai menyadari bahwa keberhasilan fasis di Afrika akan mempunyai konsekuensi di Eropa juga. Tujuan kita untuk menentukan nasib sendiri dan penghormatan terhadap hukum internasional selaras, oleh karena itu masuk akal jika kita terus memperdalam kerja sama dalam kebijakan luar negeri."
 ETH_SWE_join_war_tt: "Jika negara-negara besar sedang berperang dengan §Y[ITA.GetFlag][ITA.GetName]§! dan §Y[SWE.GetFlag][SWE.GetName]§! menyetujui permohonan faksi bersama, mereka akan mencoba untuk bergabung dengan faksi dan bergabung dalam perang.\n§RJika tidak ada faksi yang tersedia, [SWE.GetFlag][SWE.GetName] tidak akan berperang sendirian melawan [ITA.GetFlag][ITA.GetName]!§!"
 ETH_reach_out_to_the_italians: "Hubungi orang Italia"
 ETH_reach_out_to_the_italians_desc: "Jelas bahwa kita tidak lagi memiliki harapan untuk mengatasi [ITA.GetAdjective] di medan perang. Namun, [ETH.GetLeader] terus mengirim tentara kita menuju kematian dalam serangan yang sia-sia. Sudah waktunya untuk kepemimpinan baru di bawah pemimpin yang lebih kuat, seseorang yang bisa bekerja sama dengan Italia dan membawa perdamaian ke tanah air kita."
 ETH_reach_out_to_the_italians_tt: "Tawaran kolaborasi akan dikirimkan ke §Y[ITA.GetNameDef]§!, menawarkan perdamaian dengan imbalan wilayah."
 ETH_can_start_a_civil_war_tt: "[ROOT.GetName] dapat memulai perang saudara dengan menyelesaikan fokus §Y$ETH_declare_for_italy$§!."
 ETH_sway_the_warlords: "Goyangkan Panglima Perang"
 ETH_sway_the_warlords_desc: "Sekalipun kita tidak bisa meyakinkan Ras yang lebih berkuasa untuk secara terbuka menyatakan menentang $ETH_haile_selassie$, setidaknya kita bisa menabur benih untuk kerja sama di masa depan. Selain itu, kita harus mencoba meyakinkan beberapa panglima perang yang lebih rendah mengenai manfaat bekerja sama dengan, bukan melawan, pihak Italia."
 ETH_sway_the_warlords_tt: "Meningkatkan ukuran pemberontakan.\nBeberapa jenderal loyalis akan tersedia untuk direkrut setelah perang."
 ETH_expand_the_bodyguard: "Perluas Pengawal"
 ETH_expand_the_bodyguard_desc: "Semakin sulit untuk menentukan siapa yang dapat dipercaya ketika struktur kekuasaan [ETH.GetName] mulai retak. Di masa-masa sulit ini, pemimpin masa depan bangsa kita yang besar membutuhkan pengawal permanen, yang hanya setia kepadanya, untuk melindungi dari unsur-unsur pengkhianat."
 ETH_expand_the_bodyguard_tt: "Menambahkan unit ekstra saat perang saudara dimulai"
 ETH_declare_for_italy: "Deklarasikan untuk Italia"
 ETH_declare_for_italy_desc: "Banyak orang akan melihatnya sebagai pengkhianatan dan berpaling dari kebenaran. Tapi itulah sebabnya kita ditakdirkan untuk menguasai negeri ini. Karena kita tahu bahwa kita sendirilah yang mempunyai kekuatan kemauan untuk melakukan apa yang harus dilakukan demi kebaikan bangsa kita. Saatnya menggulingkan [ETH.GetLeader]."
 ETH_restore_the_country: "Pulihkan Negara"
 ETH_restore_the_country_desc: "Dengan akhirnya pulihnya perdamaian di [ETH.GetName], sekarang saatnya untuk memulai proses memulihkan ketertiban di seluruh negeri. Kami akan membangun kembali rumah dan infrastruktur lebih baik dari sebelumnya dan kami akan menunjukkan bahwa masa depan cerah menanti rakyat kami di bawah pemerintahan [ETH.GetLeader]."
 ETH_invite_italian_settlers: "Undang Pemukim Italia"
 ETH_invite_italian_settlers_desc: "Melihat bangsa kita yang besar menjadi tujuan penjajahan Eropa akan menjadi pil pahit yang harus ditelan banyak orang. Namun, sejarah terkini menunjukkan kelemahan industri dan infrastruktur kita dan kita memerlukan tindakan radikal untuk memperbaikinya. Oleh karena itu, kita akan memanfaatkan situasi ini dengan mengeksploitasi keahlian dan kekayaan para [ITA.GetAdjective] yang naif dengan mengundang mereka untuk menetap di sini."
 ETH_invite_italian_settlers_tt: "§Y2 negara bagian yang dimiliki§! akan mendapatkan sejumlah Pemukim dari [ITA.GetName], mengubah mereka dari negara bagian pedesaan atau pastoral dan memberikan §Yslot bangunan baru.§!"
 ETH_replace_the_abuna: "[Get_ETH_replace_the_abuna_name]"
 ETH_replace_the_abuna_desc: "[Get_ETH_replace_the_abuna_desc]"
 abuna_abraham_gojjam_tt: "§Y$ETH_abuna_abraham$§!:"
 ETH_replace_the_abuna_original: "Gantikan Abuna"
 ETH_change_state_religion: "Ganti Agama Negara"
 ETH_replace_the_abuna_desc_ethiopia: "Pemimpin gereja Ortodoks, $ETH_abuna_qerellos_iv$, terlalu dekat hubungannya dengan $ETH_haile_selassie$. Kita perlu menggantikannya dengan seseorang yang lebih setia pada tujuan kita."
 ETH_replace_the_abuna_desc_gojjam: "Pemimpin gereja Ortodoks, $ETH_abuna_qerellos_iv$, terlalu dekat hubungannya dengan $ETH_haile_selassie$. $ETH_abuna_abraham$ adalah kandidat yang tepat untuk menggantikannya, menjadikan Gojjam sebagai pusat politik dan agama kekaisaran."
 ETH_replace_the_abuna_desc_jimma: "Sudah terlalu lama Gereja Ortodoks Tewahedo mempengaruhi politik negara ini. Sudah waktunya untuk secara resmi memutuskan hubungan antara kekaisaran dan gereja. Sebaliknya, kita harus menjalin hubungan yang lebih erat dengan saudara-saudari kita di seberang lautan sempit."
 ETH_the_capital_victory_parade: "Parade Kemenangan [ROOT.Capital.GetCapitalVictoryPointName]"
 ETH_the_capital_victory_parade_desc: "Meskipun pemimpin besar kita menyelamatkan kita dari kehancuran, banyak rakyat kita yang curiga terhadap motif [ETH.GetLeader] dan merindukan hari-hari keluarga kekaisaran lama. Kita harus mengingatkan mereka betapa bersyukurnya mereka kepada [ETH.GetLeader] dan menunjukkan masa depan gemilang yang menanti [ETH.GetName]."
 ETH_amedeos_feast_of_maskal: "Pesta Maskal Amedeo"
 ETH_amedeos_feast_of_maskal_desc: "Untuk memastikan kesinambungan stabilitas [ETH.GetName], kami akan mengumpulkan Ras yang tersisa untuk Pesta Maskal Pangeran Amedeo di [ETH.Capital.GetCapitalVictoryPointName]. Di sana kami akan bertemu dengan Raja Muda [ITA.GetAdjective] Afrika Timur dan membahas masa depan kawasan tersebut."
 ETH_amedeos_feast_of_maskal_tt: "Jika §Y$ETH_sway_the_warlords$§! telah selesai:\n§Y$ETH_seyoum_mengesha$§!, §Y$ETH_ayalew_birru$§! dan §Y$ETH_ras_kassa$§! akan menjadi setia."
 ETH_assertiveness: "[Get_ETH_assertiveness_name]"
 ETH_assertiveness_autonomy_effect: "Negus yang Asertif"
 ETH_assertiveness_desc: "Kita sepakat untuk bekerja sama dengan [ITA.GetAdjective] untuk melindungi negara besar kita dari kehancuran, sekarang mereka akan melihat kita dilucuti dari identitas dan budaya kita, dan menjadi tidak lebih dari sebuah koloni. Kita tidak bisa membiarkan hal itu terjadi. Kami akan membuat mereka memahami siapa kami dan melawan penjajahan mereka di setiap langkah."
 ETH_assertiveness_tt: "Jika §Y$ETH_sway_the_warlords$§! telah selesai dan negaranya adalah §Y$jimma$§!:\n§Y$ETH_balcho_safo$§! dan §Y$ETH_tadesse_birru$§! akan menjadi loyal."
 ETH_assertiveness_gojjam: "Gojjam Negash"
 ETH_assertiveness_jimma: "Garad dari Jimma"
 ETH_assertiveness_ethiopia: "Negus dari Shewa"
 ETH_exploit_french_weakness: "Memanfaatkan Kelemahan Perancis"
 ETH_exploit_french_weakness_desc: "Sementara [FRA.GetAdjective] sibuk bertengkar mengenai abu kerajaan mereka, kita mempunyai kesempatan untuk mencaplok wilayah Somaliland Perancis ke dalam kerajaan besar kita. Kecil kemungkinannya [FRA.GetAdjective] memiliki kemauan yang besar untuk bertarung lagi, namun kita harus siap untuk apapun."
 ETH_exploit_french_weakness_tt: "Buka keputusan untuk menduduki §YSomaliland Prancis§!\n§RMengambil keputusan ini berisiko menimbulkan perang dengan Vichy Prancis!§!"
 ETH_france_divided_tt: "Perancis telah terpecah"
 ETH_invite_italian_investors: "Undang Investor Italia"
 ETH_invite_italian_investors_desc: "Kita harus memanfaatkan tuan baru kita dengan menarik investor mereka untuk mengunjungi [ETH.GetName]. Masuknya investasi tidak hanya akan membantu memperbaiki kerusakan akibat perang, namun juga meningkatkan kapasitas industri kita secara besar-besaran."
 ETH_italian_general_staff: "Staf Umum Italia"
 ETH_italian_general_staff_desc: "Perjalanan militer kita masih panjang dalam hal modernisasi. Meskipun kami membuat kemajuan besar dalam memproduksi atau membeli peralatan modern untuk angkatan bersenjata, para perwira kami mempunyai banyak pandangan yang sudah ketinggalan zaman tentang cara menggunakannya. Mungkin kita bisa belajar bagaimana melancarkan perang modern dengan mengundang perwira [ITA.GetAdjective] untuk bergabung dengan staf umum kita."
 ETH_italian_general_staff_tt: "Jika hubungan dengan Italia positif dan mereka setuju, §Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! dan §Y$ITA_alessandro_pirzio_biroli$§! akan dipindahkan ke Ethiopia."
 ETH_cooperation: "[Get_ETH_cooperation_name]"
 ETH_cooperation_desc: "Nasib kita terletak pada dominasi Afrika Timur. Namun, kami masih jauh dari mencapai tujuan tersebut. Oleh karena itu, kita harus bekerja sama dengan struktur kekuasaan yang ada di kawasan dan berupaya meraih keuntungan apa pun yang kita bisa."
 ETH_cooperation_sud_tt: "Dapatkan penasihat politik Sudan:\n§Y$economic_organizer$:§!\nPabrik Barang Konsumsi: §G-5%§!\nStabilitas: §G+5%§!"
 ETH_cooperation_som_tt: "Dapatkan penasihat politik Somalia:\n§Y$economic_organizer$:§!\nPabrik Barang Konsumsi: §G-5%§!\nStabilitas: §G+5%§!"
 ETH_cooperation_gugsa_tt: "§Y$ETH_domenico_mondelli$§! tersedia sebagai §YPanglima Angkatan Udara§!:\n§Y$air_chief_ground_support_1$§!"
 ETH_cooperation_gojjam: "Kerjasama dengan Sudan"
 ETH_cooperation_jimma: "Kerjasama dengan negara-negara Arab"
 ETH_cooperation_gugsa: "Kerjasama dengan Eritrea"
 ETH_reinforce_dynamic_identity: "[Get_ETH_reinforce_dynamic_identity_name]"
 ETH_reinforce_dynamic_identity_desc: "Masyarakat masih bingung mengenai identitas nasional mereka di bawah pemerintahan baru. Terlepas dari keluhan kecil mereka, mereka sekarang menjadi [ETH.GetAdjective]. Dan sudah saatnya mereka belajar bahwa [ETH.GetAdjective] yang baik setia kepada [ETH.GetLeader] dan negara."
 ETH_reinforce_ethiopian_identity: "Perkuat Identitas Ethiopia"
 ETH_reinforce_gojjam_identity: "Perkuat Identitas Gojjam"
 ETH_reinforce_jimman_identity: "Perkuat Identitas Jimman"
 ETH_reinforced_identity: "Identitas yang Diperkuat"
 ETH_underground_wargames: "Permainan Perang Bawah Tanah"
 ETH_underground_wargames_desc: "Kami berjuang untuk mengusir [ITA.GetAdjective] dalam perang terakhir karena kurangnya pemahaman tentang seberapa besar perubahan peperangan dalam beberapa dekade terakhir. Untuk memastikan kita tidak melakukan kesalahan yang sama lagi, perwira kita harus mulai melakukan latihan perang dan merencanakan penggulingan pasukan [ITA.GetAdjective]. Tentu saja kita harus menghindari menimbulkan kecurigaan saat melakukan hal tersebut..."
 ETH_adopt_the_lira: "Adopsi Lira"
 ETH_adopt_the_lira_desc: "Nilai mata uang kita anjlok karena gejolak ekonomi yang disebabkan oleh perang dengan [ITA.GetName] dan biaya rekonstruksi. Daripada mencoba menstabilkan mata uang yang ternoda, kita harus menggunakan ini sebagai peluang untuk meningkatkan integrasi ekonomi dengan [ITA.GetAdjective] dengan mengadopsi lira."
 ETH_request_italian_equipment: "Minta Peralatan Italia"
 ETH_request_italian_equipment_desc: "Meskipun kita mengalami kemajuan besar dalam mereformasi perekonomian dan memperkuat militer, kita masih dapat memperoleh manfaat dari beberapa dukungan dalam tugas-tugas ini. Karena hubungan kami yang semakin erat dengan [ITA.GetAdjective], mereka mungkin bersedia mengirimkan kelebihan perlengkapan mereka kepada kami."
 ETH_request_italian_equipment_tt: "Jika [ITA.GetFlag][ITA.GetName] setuju, [ETH.GetFlag][ETH.GetName] akan menerima §G500 $artillery_equipment$§! atau §G2500 $infantry_equipment_1$§!"
 ETH_recruit_mercenaries: "Rekrut Tentara Bayaran"
 ETH_recruit_mercenaries_desc: "Saat ini terdapat banyak ketegangan di dalam militer antara tentara dengan latar belakang berbeda. Banyak yang setia pada rezim lama dan tidak bisa dipercaya. Sebelum kita bisa membasmi unsur-unsur yang tidak loyal ini, kita memerlukan kekuatan-kekuatan yang loyal kepada kita. Cara termudah untuk menginspirasi loyalitas adalah uang tunai."
 ETH_askari_tt: "Rekrut §G4 Divisi§! dari §YEritrea Askari§!"
 ETH_sudanese_mercs_tt: "Rekrut §G4 Divisi§! dari §YTentara Bayaran Sudan§!"
 ETH_arab_mercs_colab_tt: "Rekrut §G4 Divisi§! dari §YTentara Bayaran Arab§!"
 ETH_set_up_a_customs_barrier: "Siapkan Penghalang Bea Cukai"
 ETH_set_up_a_customs_barrier_desc: "Semakin lama kita membiarkan perekonomian kita terjerat oleh [ITA.GetName], semakin sulit untuk melepaskan diri dari pengaruh buruknya. Meskipun hal ini akan memperlambat pertumbuhan ekonomi kita, kita harus menerapkan penghalang bea cukai untuk mempersulit perdagangan antar negara. Rezim [ITA.GetAdjective] akan marah dengan hal ini, tapi kami akan menemukan pembenaran ekonomi jika kami harus melakukannya."
 ETH_contact_the_exiles: "Hubungi Orang buangan"
 ETH_contact_the_exiles_desc: "Ketika perang dengan [ITA.GetName] hampir berakhir, banyak yang melarikan diri ke wilayah tetangga karena takut akan dampak yang mungkin ditimbulkan oleh rezim baru. Saat kami mulai melaksanakan rencana kami untuk memperoleh kembali kemerdekaan, kami mungkin dapat membujuk diaspora yang lebih luas untuk bergabung dengan kami. Meski dahulu kita berbeda pendapat, kini saatnya kita saling bekerja sama demi kepentingan tanah air."
 ETH_outsourced_production: "Produksi yang Dialihdayakan"
 ETH_outsourced_production_desc: "Industri kita masih kecil dan belum berpengalaman dalam hal pembuatan alat perang. Namun, sekarang kita berada dalam lingkup pengaruh [ITA.GetAdjective], kita dapat memanfaatkan situasi ini semaksimal mungkin dengan melakukan outsourcing kebutuhan produksi kita dan memanfaatkan keahlian produsen senjata mereka."
 ETH_outsourced_production_tt: "Permintaan [ITA.GetFlag]§Y[ITA.GetAdjective]§! perancang angkatan darat atau udara:"
 ETH_outsourced_production_air_tt: "Desainer Angkatan Udara:"
 ETH_outsourced_production_army_tt: "Desainer Tentara:"
 ETH_outsourced_production_factories_tt: "Jika [ITA.GetFlag]§Y[ITA.GetNameDef]§! setuju, [ETH.GetFlag]§Y[ETH.GetNameDef]§! memperoleh §Y4 Pabrik Militer§!."
 ETH_together_for_victory: "Bersama untuk Kemenangan"
 ETH_together_for_victory_desc: "Waktunya semakin dekat bagi kita untuk memulihkan kehormatan kita dan memutus rantai penindasan Italia. Untuk memastikan rencana kami tidak gagal, kami perlu memperkuat kekuatan kami dan mendapatkan dukungan dari seluruh Afrika Timur. Hanya bersama-sama kemenangan akan terjamin."
 ETH_together_for_victory_tt: "Prajurit pemberontak akan bangkit di belakang garis musuh ketika perang kemerdekaan dimulai"
 ETH_our_enemys_enemy: "Musuh Musuh Kita"
 ETH_our_enemys_enemy_desc: "Ada banyak negara yang menentang ekspansionisme [ITA.GetAdjective] karena alasan ideologis atau strategis. Kita harus menjangkau negara-negara tersebut untuk mendapatkan pasokan senjata sehingga kita dapat menggulingkan kekuatan [ITA.GetAdjective] di wilayah kita."
 ETH_our_enemys_enemy_tt: "Jika suatu negara setuju untuk mengirimkan senjata, [ETH.GetFlag][ETH.GetName] akan menerima §G1000 perlengkapan infanteri§! dari negara tersebut."
 ETH_raid_italian_depots: "Serangan Depot Italia"
 ETH_raid_italian_depots_desc: "Militer Italia telah memusatkan banyak peralatan di depot-depot di seluruh negara kita. Saat kita bersiap menghadapi konfrontasi yang tak terhindarkan, kita bisa merampas peralatan mereka dan memperkuat kekuatan kita dengan menyerbu depo."
 ETH_raid_italian_depots_tt: "Penggerebekan akan terjadi secara sporadis selama §Ytahun§! mendatang, menambah peralatan [ITA.GetFlag]§Y[ITA.GetAdjective]§! ke tumpukan [ETH.GetFlag]§Y[ETH.GetName]§! setiap saat."
 ETH_the_italian_language: "Bahasa Italia"
 ETH_the_italian_language_desc: "Bahasa masih menjadi salah satu hambatan terbesar dalam menjalin kerja sama yang lebih erat dengan [ITA.GetAdjective]. Oleh karena itu kami akan mengadopsi [ITA.GetAdjective] sebagai bahasa kedua di seluruh pemerintahan kami, termasuk militer. Semoga hal ini dapat mempercepat pertukaran budaya di antara kita dan membuat perencanaan strategis menjadi lebih efisien."
 ETH_compensation: "Kompensasi"
 ETH_compensation_desc: "Terlepas dari ketegangan awal antara negara-negara besar kita, kita telah membuktikan kesetiaan kita kepada [ITA.GetName] berkali-kali. Namun hal ini tidak banyak membuat masyarakat kita disenangi oleh pemerintahan kita. Mungkin [ITA.GetAdjective] akan bersedia memberikan kompensasi kepada kami berupa kendali atas sebagian tanah mereka yang lain sehingga kami dapat meningkatkan dukungan terhadap rezim kami."
 ETH_negusa_nagast: "Negusa Nagast"
 ETH_negusa_nagast_desc: "Waktunya telah tiba untuk menghilangkan pengaruh [ETH.GetName] dari [ITA.GetAdjective] dengan mendeklarasikan kemerdekaan kita. Kami akan segera menjadi tuan atas nasib kami sendiri sekali lagi berkat kepemimpinan [ETH.GetLeader]."
 ETH_negusa_nagast_tt: "§Y[ROOT.GetNameWithFlag]§! mendeklarasikan kemerdekaan"
 ETH_the_italo-ethiopian_empire: "Kekaisaran Italia-[ETH.GetAdjective]"
 ETH_the_italo-ethiopian_empire_desc: "Saat kita bangkit dari abu kekaisaran lama, kekaisaran Italo-[ETH.GetAdjective] baru mulai terbentuk. Meskipun baru-baru ini kami bertarung satu sama lain, semakin jelas bahwa [ITA.GetName] dan [ETH.GetName] kini menjadi lebih kuat jika digabungkan. Sekarang adalah tugas kita untuk memperluas wilayah kerajaan kita bersama."
 ETH_the_italo-ethiopian_empire_tt: "Buka keputusan §YItalo-[ETH.GetAdjective] Empire§! untuk mendapatkan inti di wilayah yang diklaim setelah mereka ditangkap.\nMereka akan ditransfer jika tidak ada divisi musuh di negara yang diklaim atau negara bagian yang berdekatan"
 ETH_reclaim_the_empire: "Rebut kembali Kekaisaran"
 ETH_reclaim_the_empire_desc: "Di bawah pemerintahan pemimpin besar kami, [ETH.GetLeader], kami telah menolak pengaruh korosif [ITA.GetName] terhadap bangsa besar kami dan menemukan kembali kekuatan rakyat kami yang tak tertandingi. Kini tugas besar yang ada dihadapan kita adalah reklamasi tanah hak kita dan penyatuan rakyat [ETH.GetAdjective]."
 ETH_reclaim_the_empire_tt: "Buka keputusan §YRebut kembali Kekaisaran§! untuk mendapatkan kembali inti di wilayah yang diserahkan kepada [ITA.GetFlag][ITA.GetName] setelah mereka berada di bawah kendali [ETH.GetFlag][ETH.GetAdjective] lagi."
 ETH_the_liberator_of_country_short: "[Get_ETH_the_liberator_of_country_short_name]"
 ETH_the_liberator_of_country_short_desc: "[ETH.GetLeader] secara heroik telah membawa kita menuju kemerdekaan, bebas dari pengaruh korup [ITA.GetName]. Kita tidak tahu apa yang akan terjadi di masa depan, tapi kita tahu bahwa masa depan akan indah asalkan kita memiliki pembebas [ETH.GetName] yang membimbing kita menuju masa depan."
 ETH_the_liberator_of_gojjam: "Pembebas $gojjam$"
 ETH_the_liberator_of_jimma: "Pembebas $jimma$"
 ETH_the_liberator_of_ethiopia: "Pembebas $ETH$"
 ETH_consolidate_east_africa: "Konsolidasikan Afrika Timur"
 ETH_consolidate_east_africa_desc: "Tatanan dunia sedang berubah di sekitar kita seiring dengan runtuhnya kerajaan-kerajaan lama. Satu-satunya cara untuk mengamankan tempat bagi rakyat kita dalam tatanan baru ini adalah melalui penaklukan dan menunjukkan kemampuan kita untuk mengatasi segala rintangan. Oleh karena itu, kami akan mengkonsolidasikan Afrika Timur di bawah kendali kami dan menunjukkan kepada dunia kekuatan [ETH.GetName]."
 ETH_consolidate_east_africa_tt: "Dapatkan klaim di:\n§Y[SUD.GetName]§!\n§Y[SOM.GetName]§!\n§Y[ERI.GetName]§!\n§Y[DJI.GetName]§!\n§Y[KEN.GetName]§!\n§Y[UGA.GetName]§!\nKeuntungan keputusan untuk wilayah inti setelah berada di bawah kendali [ETH.GetFlag][ETH.GetAdjective]."
 ETH_chitet_name: "Chitet"
 ETH_chitet_name_democratic: "Tentara Teritorial"
 ETH_chitet_name_communist: "Milisi Rakyat"
 ETH_naval_college_name_communist: "Perguruan Tinggi Angkatan Laut Laut Merah"
 ETH_naval_college_name_historical: "Perguruan Tinggi Angkatan Laut Asmera"
 ETH_naval_college_name_fallback: "[ETH.GetAdjective] Akademi Angkatan Laut"
 ETH_airbase_name: "Debre Zeyit"
 ETH_airbase_name_fallback: "[ETH.GetAdjective]"
 ETH_experts: "Para ahli"
 ETH_investors: "Industrialis"
 ETH_reintegrate_aussa: "Integrasikan Australia"
 ETH_reintegrate_aussa_desc: "Kesultanan Aussa yang pengkhianat telah berulang kali mengkhianati kami dengan memihak [ITA.GetAdjective]. Sudah saatnya kita membubarkan kesultanan dan mengintegrasikan wilayah tersebut ke dalam [ETH.GetName]."
 ETH_communist_tax_exemption_title: "Dukung Spesialis"
 ETH_communist_tax_exemption_desc: "Untuk mencegah ‘brain drain’ yang dialami oleh Uni Soviet setelah revolusi mereka, kita perlu menciptakan sistem perpajakan yang mendorong para spesialis untuk tetap berada di [ETH.GetNameDef]. Setidaknya sampai kita melahirkan generasi baru spesialis proletar..."
 ETH_communist_seize_assets_desc: "Sementara rakyat berjuang untuk memenuhi kebutuhan hidup, elit pra-revolusioner [ETH.GetName] mengambil sejumlah besar aset dalam bentuk mata uang asing, karya seni, dan tentu saja, tanah. Kita harus menyita aset-aset ini atas nama rakyat dan mendistribusikan kembali kekayaannya."
 ETH_communist_seize_assets_title: "Hilangkan Properti Pribadi"
 ETH_tax_exemption_default_desc: "Kita perlu menjaga kepuasan para bangsawan untuk mencegah fragmentasi [ETH.GetName]. Oleh karena itu, kami akan memberi penghargaan kepada mereka atas kesetiaan mereka yang berkelanjutan dengan memperluas pengecualian pajak, sehingga memungkinkan mereka untuk menyimpan lebih banyak kekayaan."
 ETH_seize_assets_default_desc: "Sebagai salah satu orang terkaya di [ETH.GetName], tidak masuk akal secara ekonomi jika kaum bangsawan bebas menghindari pembayaran pajak melalui undang-undang dan celah yang kuno. Kita perlu mengenakan pajak kepada kaum bangsawan dengan benar dan menggunakan pendapatannya untuk industrialisasi kekaisaran lebih lanjut."
 ETH_tax_exemption_default_title: "Perluas Pengecualian Pajak"
 ETH_seize_assets_default_title: "Membebani Kaum Bangsawan"
 # ITALY
 ITA_italian_highways_bba: "Jalan Raya Italia"
 ITA_italian_highways_bba_desc: "Bangsa Romawi kuno membangun jalan yang membuat iri seluruh dunia. Sekarang orang-orang Jerman yang baru percaya bahwa Autobahn mereka jauh lebih unggul dari apapun yang bisa kita bangun. Kami akan membuktikan bahwa mereka salah."
 ITA_develop_libya: "Kembangkan Libya"
 ITA_develop_libya_desc: "Libya adalah koloni terdekat kami dan memiliki potensi tertinggi. Sebelum kita dapat mulai merasakan manfaat penuh atas kerja keras dan panjang kita dalam mengamankan wilayah tersebut, kita harus memperbaiki infrastrukturnya."
 ITA_develop_eritrea: "Kembangkan Eritrea"
 ITA_develop_eritrea_desc: "Eritrea adalah koloni tertua kami di benua Afrika, dan merupakan salah satu koloni paling berharga. Dengan posisinya yang sangat strategis, kota ini dapat dengan mudah dibangun menjadi landasan kerajaan kolonial kita."
 ITA_develop_somaliland: "Mengembangkan Somaliland"
 ITA_develop_somaliland_desc: "Sekilas, kawasan di Tanduk Afrika ini tampaknya tidak memiliki banyak potensi ekonomi atau strategis. Namun dengan beberapa investasi yang tepat, kita dapat mengubah kawasan ini menjadi batu loncatan untuk kemajuan lebih jauh ke Samudera Hindia."
 ITA_regional_development: "Pembangunan Daerah"
 ITA_regional_development_desc: "Investasi kami sebelumnya di berbagai wilayah Kekaisaran telah mempersiapkan landasan bagi peningkatan besar dalam output ekonomi di wilayah tersebut. Kita hanya perlu mengucapkan sepatah kata, dan kita bisa memetik hasilnya dalam waktu singkat."
 ITA_ministry_of_italian_africa: "Kementerian Afrika Italia"
 ITA_ministry_of_italian_africa_desc: "Berbagai suku dan masyarakat di Afrika tidak dapat ditangani seperti kita menangani subyek lainnya. Mengelola wilayah-wilayah ini memerlukan pendekatan yang berbeda."
 ITA_develop_ethiopia: "Kembangkan Etiopia"
 ITA_develop_ethiopia_desc: "Orang-orang Etiopia yang keras kepala telah lama menentang dan mempermalukan kami. Kini setelah mereka berhasil dikalahkan, kita bisa membangun negara mereka dan menunjukkan kepada mereka bahwa invasi kita adalah demi kebaikan mereka sendiri."
 ITA_ethiopian_railways: "Kereta Api Ethiopia"
 ITA_ethiopian_railways_desc: "Jaringan kereta api Ethiopia yang terbelakang menghambat perkembangan ekonomi koloni tersebut. Dengan mengirimkan para ahli dari Italia, kami dapat dengan cepat membawanya ke standar Italia dan memastikan kereta selalu berjalan tepat waktu di mana pun di Kekaisaran."
 ITA_polizia_dell_africa_italiana: "Polizia dell'Afrika Italiana"
 ITA_polizia_dell_africa_italiana_desc: "Polisi kolonial kita sejauh ini telah menunjukkan kekuatan yang mumpuni. Dengan melakukan beberapa reformasi lebih lanjut, hal ini akan dapat memastikan bahwa kita mendapatkan hasil yang maksimal dari koloni kita."
 ITA_strengthen_ascari_corps: "Perkuat Korps Ascari"
 ITA_strengthen_ascari_corps_desc: "Pasukan kami dari Kekaisaran bagian Eropa sering kali berjuang di iklim Afrika yang keras. Tentu saja penduduk asli tidak mengalami masalah yang sama. Kita harus mempekerjakan beberapa dari mereka untuk mendukung pasukan kita ketika berperang di iklim panas."
 ITA_comandante_diavolo: "Komandan Diavolo"
 ITA_comandante_diavolo_desc: "Selama penaklukan kami di Eritrea dan perang di Etiopia, kami sering dibuat bingung oleh kecepatan dan kegigihan para penunggang kuda pribumi. Setelah berjuang melawan mereka, kita akan mendapatkan banyak keuntungan jika kita bisa membuat mereka memihak kita, dan seorang perwira muda yang giat mungkin bisa menjadi 'Komandan Iblis' kita sendiri."
 ITA_prospect_for_oil: "Prospek Minyak"
 ITA_prospect_for_oil_desc: "Ahli geologi kami percaya bahwa mungkin terdapat cadangan minyak dalam jumlah besar yang tersimpan di bawah gurun Libya. Kita harus melakukan survei menyeluruh untuk melihat apakah mereka benar."
 ITA_libyan_refineries: "Kilang Libya"
 ITA_libyan_refineries_desc: "Dengan banyaknya cadangan minyak yang teridentifikasi di gurun Libya, langkah kita selanjutnya adalah meningkatkan kapasitas penyulingan minyak di wilayah tersebut."
 ITA_libyan_infrastructure_bba: "Infrastruktur Libya"
 ITA_libyan_infrastructure_bba_desc: "Mengingat pentingnya Libya sebagai basis operasi di Afrika Utara, kita harus melakukan upaya terus-menerus untuk meningkatkan infrastrukturnya agar dapat mengoperasikan formasi pasukan dalam jumlah besar di sana, jika diperlukan."
 ITA_litoranea_balbo: "[GetAppropriateLitoraneaBalboName]"
 ITA_litoranea_balbo_default: "Litoranea Balbo"
 ITA_litoranea_balbo_alt: "Litoranea Libica"
 ITA_litoranea_balbo_desc: "Jalanan di Libya buruk. Bahkan di dekat pantai, jaringan jalan raya tidak sesuai untuk negara modern. Masih banyak pekerjaan yang harus dilakukan untuk memperbaikinya, termasuk pembangunan jalan raya besar di sepanjang pantai."
 ITA_via_della_vittoria: "Melalui della Vittoria"
 ITA_via_della_vittoria_desc: "Infrastruktur yang buruk terus menghambat operasi kami di Afrika Utara. Upaya yang lebih besar pada satu 'Jalan Kemenangan' mungkin dapat memperbaiki situasi secara dramatis dan memungkinkan kami untuk beroperasi lebih bebas di sekitar perbatasan Mesir."
 ITA_libyan_railway: "Kereta Api Libya"
 ITA_libyan_railway_desc: "Investasi pada jaringan jalan raya Libya tentu saja bernilai, namun untuk pergerakan pasukan, sumber daya, dan perbekalan dalam skala besar, jaringan kereta api modern sangat diperlukan."
 ITA_steel_industry_in_terni: "Industri Baja di Terni"
 ITA_steel_industry_in_terni_desc: "Pabrik baja Terni telah lama menjadi tulang punggung produksi baja Italia. Dalam perang yang akan datang, kita harus lebih bergantung pada mereka. Beberapa investasi yang dilakukan sekarang pasti akan membuahkan hasil yang besar di kemudian hari."
 ITA_power_plants_in_terni: "Pembangkit Listrik di Terni"
 ITA_power_plants_in_terni_desc: "Pembangkit listrik yang kami miliki saat ini di Terni tidak mencukupi dan perlu diperluas, jika kami ingin mengembangkan kawasan ini menjadi pusat industri yang lebih besar."
 ITA_industria_della_gomma_sintetica: "Industria della Gomma Sintetica"
 ITA_industria_della_gomma_sintetica_desc: "Posisi geografis kami yang berada di jantung Mediterania membuat kami sangat rentan terhadap blokade kekuatan musuh. Jika kita ingin mengambil tempat yang selayaknya kita di dunia, kita harus mampu mempertahankan industri kita tanpa impor asing."
 ITA_strengthen_northern_industry: "Memperkuat Industri Utara"
 ITA_strengthen_northern_industry_desc: "Italia Utara telah lama menjadi pusat industri di negara kita. Seluruh wilayah ini memiliki posisi yang sangat baik untuk tumbuh lebih jauh lagi, hanya dengan sedikit investasi waktu dan sumber daya."
 ITA_modernize_the_mezzogiorno: "Modernkan Mezzogiorno"
 ITA_modernize_the_mezzogiorno_desc: "Italia bagian selatan telah menjadi anak bermasalah selama kita menjadi negara bersatu. Namun dengan keinginan kita untuk menjadi kekuatan dominan di Mediterania, semua potensi yang belum dimanfaatkan harus dimobilisasi."
 ITA_new_industrialization_program: "Program Industrialisasi Baru"
 ITA_new_industrialization_program_desc: "Bersaing dengan negara-negara lain di dunia memerlukan inovasi dan perbaikan terus-menerus. Kita tidak bisa berharap untuk tetap kompetitif jika hanya berpuas diri, dan sebaliknya kita harus terus berupaya untuk mencapai lebih banyak hal."
 ITA_railway_innovations: "Inovasi Kereta Api"
 ITA_railway_innovations_desc: "Bahkan di era mobil, jaringan kereta api yang kuat masih menjadi tulang punggung perekonomian yang kuat. Perluasan lebih lanjut jalur kereta api di Italia akan mempersiapkan kita untuk pertumbuhan di masa depan."
 ITA_expand_foggia_farm_fields: "Perluas Ladang Pertanian Foggia"
 ITA_expand_foggia_farm_fields_desc: "Wilayah Foggia telah lama menjadi lumbung pangan seluruh Italia. Ketika perang dimulai, kita harus merekrut banyak orang yang bekerja di ladang menjadi tentara. Kita harus memodernisasi dan memperluas pertanian di wilayah tersebut jika kita ingin tetap memberi makan penduduk kita."
 ITA_investments_in_edison: "Investasi di Edison"
 ITA_investments_in_edison_desc: "Italia memiliki pembangkit listrik pertama di Eropa, dan selalu menjadi yang terdepan dalam teknologi. Dengan berinvestasi di perusahaan Edison, kami dapat memastikan bahwa kami tetap memimpin."
 ITA_expand_national_universities: "Perluas Universitas Nasional"
 ITA_expand_national_universities_desc: "Untuk negara yang berteknologi maju seperti kita, selalu ada kebutuhan akan lebih banyak insinyur. Kami telah mengidentifikasi universitas-universitas kami sebagai hambatan terbesar dalam mendidik cukup banyak pakar baru agar negara kami tetap kompetitif."
 ITA_fiocchi_munizioni: "Fiocchi Munizioni"
 ITA_fiocchi_munizioni_desc: "Fiocchi telah lama memasok amunisi berkualitas tinggi kepada angkatan bersenjata kita. Pasokan amunisi yang stabil sangat penting dalam perang yang akan datang, jadi kita harus memastikan bahwa pekerjaan Fiocchi mampu melaksanakan tugasnya."
 ITA_brescia_small_arms_industry: "Industri Senjata Kecil Brescia"
 ITA_brescia_small_arms_industry_desc: "Senjata kecil Italia terkenal di seluruh dunia karena kualitasnya yang tinggi. Namun kita juga harus memastikan bahwa kita memiliki persediaan senjata paling modern dalam jumlah yang cukup, jika kita ingin memastikan bahwa prajurit kita dapat mengalahkan musuh mana pun di medan perang."
 ITA_milan_comms_industry: "Industri Komunikasi Milan"
 ITA_milan_comms_industry_desc: "Bidang baru deteksi radio dan penemuan jangkauan menawarkan banyak peluang dan tidak diragukan lagi akan menjadi bidang penting dalam teknologi militer. Kita harus memastikan bahwa kita dapat mengikuti perkembangan di bidang ini."
 ITA_redirect_alfa_romeo_production: "Alihkan Produksi Alfa Romeo"
 ITA_redirect_alfa_romeo_production_desc: "Selama beberapa dekade, mobil sport Italia telah berada di puncak teknologi. Namun dengan semakin dekatnya awan perang, semua orang di Italia harus melakukan bagian mereka. Kita tidak mampu mempertahankan kemewahan yang tidak ada gunanya, dan mesin-mesin di pabrik Alfa Romeo mungkin lebih baik digunakan untuk keperluan militer."
 ITA_increase_production: "Meningkatkan Produksi"
 ITA_increase_production_desc: "Peperangan industrialisasi memerlukan satu hal utama: massal. Massa peluru, massa senapan, massa pesawat. Yang paling penting adalah memiliki lebih banyak barang daripada musuh."
 ITA_keep_specialization: "Pertahankan Spesialisasi"
 ITA_keep_specialization_desc: "Meskipun negara-negara lain mungkin telah melupakan nilai keterampilan, presisi, dan kualitas, kami di Italia belum melupakannya. Pengrajin kami akan selalu memperhatikan detail terkecil, dan menciptakan contoh terbaik dari peralatan apa pun yang mereka kerjakan."
 ITA_thermojet_research: "Penelitian Termojet"
 ITA_thermojet_research_desc: "Para insinyur kami percaya bahwa di masa depan, pesawat tidak lagi digerakkan oleh baling-baling atau digerakkan oleh mesin piston. Sebaliknya, teknologi baru akan membuat pesawat lebih cepat dan memungkinkan desain pesawat yang sangat berbeda. Italia harus menjadi yang terdepan dalam perkembangan ini."
 ITA_army_primacy_bba: "Keutamaan Angkatan Darat"
 ITA_army_primacy_bba_desc: "Pada akhirnya, perang dimenangkan dengan menempatkan tentara di wilayah musuh dan mengambil barang-barang yang dibutuhkan musuh untuk berperang. Meskipun Angkatan Laut dan Angkatan Udara tidak diragukan lagi merupakan organisasi yang berguna, Angkatan Daratlah yang akan memenangkan perang."
 ITA_preserve_army_traditions: "Melestarikan Tradisi Tentara"
 ITA_preserve_army_traditions_desc: "Ada banyak ide yang beredar saat ini tentang cara-cara baru untuk berperang. Meskipun beberapa di antaranya mungkin mempunyai manfaat, fondasi pasukan yang sukses tidak berubah sejak zaman Kaisar: Disiplin, keberanian individu, dan kepemimpinan yang cakap."
 ITA_increase_artillery_production: "Meningkatkan Produksi Artileri"
 ITA_increase_artillery_production_desc: "Perang Besar pada dasarnya adalah perang artileri. Kita harus berasumsi bahwa perang berikutnya juga akan dilakukan terutama dengan artileri. Kita tidak boleh membiarkan diri kita tertinggal dalam bidang ini."
 ITA_vallo_alpino_del_littorio: "Vallo Alpino del Littorio"
 ITA_vallo_alpino_del_littorio_desc: "Perbatasan darat kami hampir seluruhnya ditutupi oleh Pegunungan Alpen. Meskipun gunung-gunung tersebut merupakan penghalang yang sangat besar, kita telah belajar dari perang terakhir bahwa gunung-gunung tersebut tidak sepenuhnya tidak dapat ditembus. Membangun serangkaian benteng akan membantu kita mempertahankan garis pertahanan terhadap invasi darat musuh."
 ITA_moschettieri_del_duce: "[GetAppropriateMoschetieridelDuceName]"
 ITA_moschettieri_del_duce_default: "Moschettieri del Duce"
 ITA_moschettieri_del_duce_king: "Moschettieri del Re"
 ITA_moschettieri_del_duce_alt: "Moschettieri della Republica"
 ITA_moschettieri_del_duce_pope: "Moschettieri del Santo Padre"
 ITA_moschettieri_del_duce_desc: "[GetAppropriateMoschetieridelDuceDesc]"
 ITA_moschettieri_del_duce_desc_default: "Duce, untuk perlindungannya sendiri, memiliki unit penembak jitu elit di bawah komandonya. Meskipun keselamatan Duce tentu saja merupakan prioritas tertinggi, para prajurit teladan ini juga dapat digunakan untuk melatih pasukan reguler kita dengan lebih baik, sehingga meningkatkan efektivitas mereka di lapangan."
 ITA_moschettieri_del_duce_desc_king: "Raja, untuk perlindungannya sendiri, memiliki unit penembak jitu elit di bawah komandonya. Meskipun keselamatan Raja tentu saja merupakan prioritas tertinggi, para prajurit teladan ini juga dapat digunakan untuk melatih pasukan reguler kita dengan lebih baik, sehingga meningkatkan efektivitas mereka di lapangan."
 ITA_moschettieri_del_duce_desc_pope: "Yang Mulia, untuk perlindungannya sendiri, memiliki unit penembak jitu elit di bawah komandonya. Meskipun keselamatan Bapa Suci tentu saja merupakan prioritas utama, para prajurit teladan ini juga dapat digunakan untuk melatih pasukan reguler kita dengan lebih baik, sehingga meningkatkan efektivitas mereka di lapangan."
 ITA_moschettieri_del_duce_desc_alt: "Moschettieri della Republica adalah unit penembak jitu elit yang bersumpah untuk melindungi Republik dari segala ancaman, baik yang datang dari luar negara maupun dari dalam negeri. Para prajurit teladan ini juga dapat digunakan untuk melatih pasukan reguler kita dengan lebih baik, sehingga meningkatkan efektivitas mereka di lapangan."
 ITA_a_bandits_war: "Perang Bandit"
 ITA_a_bandits_war_desc: "Cara-cara lama berperang seharusnya sudah mati di parit-parit di Isonzo. Beberapa jenderal lama kita masih percaya bahwa perang modern dapat dimenangkan dengan melemparkan banyak tentara ke dalam penggiling daging. Kini kita lebih tahu: perang modern dimenangkan melalui manuver cepat dan organisasi fleksibel yang dapat bereaksi dengan cepat. Kita harus mempersiapkan pasukan kita untuk perang seperti ini."
 ITA_carica_di_isbuscenskij: "Carica di Isbuscenskij"
 ITA_carica_di_isbuscenskij_desc: "Ada yang mengatakan bahwa zaman kuda dan penunggangnya di medan perang sudah berakhir. Bahwa peran kavaleri telah diambil alih oleh tank dan pesawat terbang. Namun mereka salah - seekor kuda tidak membutuhkan bahan bakar, tidak memerlukan kru darat, tidak memerlukan suku cadang kecuali tapal kuda baru sesekali. Hal ini memberikan kavaleri keuntungan yang jelas bahkan di medan perang modern."
 ITA_army_leaders: "Pemimpin Angkatan Darat"
 ITA_army_leaders_desc: "Tentara kita harus selalu dipimpin oleh perwira paling cakap yang ada. Sangat penting bagi kita untuk menciptakan aliran petugas baru dan kompeten untuk mempertahankan keunggulan."
 ITA_superesercito: "Latihan super"
 ITA_superesercito_desc: "Mengkoordinasikan pasukan dalam jumlah besar bukanlah tugas yang mudah. Kita perlu menciptakan struktur komando tertinggi, yang dapat memandu dan mendukung kekuatan di lapangan."
 ITA_italian_tankettes: "Tanket Italia"
 ITA_italian_tankettes_desc: "Sementara negara-negara lain mungkin mengembangkan tank yang lebih besar dan lebih berat untuk mencari super-tank yang akan membuat semua tank lainnya menjadi usang, kita tahu bahwa tank terbaik adalah tank yang benar-benar ada di lapangan. Sebuah tank harus cukup cepat untuk bergerak ke mana pun dibutuhkan tepat waktu, dan tank tersebut hanya membutuhkan baju besi yang cukup berat untuk menahan senapan. Kendaraan seperti itu akan murah dan cepat diproduksi."
 ITA_bersaglieri: "Bersaglieri"
 ITA_bersaglieri_desc: "Bersaglieri, infanteri ringan elit kami, telah lama unggul dalam pertempuran. Meskipun peperangan di masa depan mungkin akan dilakukan secara mekanis, kualitas individu prajurit akan tetap menjadi faktor penentu."
 ITA_divisioni_alpine: "Divisi Alpine"
 ITA_divisioni_alpine_desc: "Ingatan kita tentang Perang Besar akan selamanya mencakup pertempuran brutal di pegunungan Alpen. Jika kita harus mempertahankan negara kita dari invasi asing lagi, serangan tersebut pasti akan datang dari utara, dan memerlukan lebih banyak pertempuran di pegunungan yang tidak ramah. Kita harus memiliki tentara yang mampu berperang secara efektif di medan tersebut."
 ITA_fanti_dell_aria: "Fanti dell'Aria"
 ITA_fanti_dell_aria_desc: "Kebuntuan berdarah di Front Isonzo selama Perang Besar memaksa kami melakukan serangan frontal melawan musuh yang telah mempersiapkan diri dengan baik. Satu-satunya cara untuk mencapai terobosan adalah dengan melintasi wilayah tak bertuan dan merebut parit musuh. Pesawat modern dapat membawa sekelompok tentara dengan cepat, jauh ke wilayah belakang musuh. Mendarat dengan parasut mereka dapat mengambil sasaran strategis untuk mengacaukan garis depan musuh."
 ITA_self_propelled_guns: "Senjata Self-Propelled"
 ITA_self_propelled_guns_desc: "Tank mungkin telah merevolusi peperangan, namun dalam banyak hal senjata self-propelled adalah kendaraan paling berharga di medan perang. Dukungan tembakan yang ditawarkan oleh kendaraan yang relatif murah dan sederhana sangat berharga ketika berperang menembus benteng atau melawan tank musuh."
 ITA_end_fiat_ansaldo_duopoly: "Akhiri Duopoli Fiat-Ansaldo"
 ITA_end_fiat_ansaldo_duopoly_desc: "Sektor teknik mesin dan kendaraan bermotor kami telah lama didominasi oleh dua perusahaan: Fiat dan Ansaldo. Meskipun kedua perusahaan ini benar-benar merupakan perusahaan teknik kelas dunia, pertumbuhan mereka agak terhambat karena tidak ada pesaing yang dapat bertahan di pasar. Kita harus mematahkan duopoli ini jika ingin memiliki sektor teknik yang sehat dalam jangka panjang."
 ITA_modernize_ansaldo_facilities: "Modernisasi Fasilitas Ansaldo"
 ITA_modernize_ansaldo_facilities_desc: "Kemerosotan ekonomi setelah Perang Besar menjerumuskan Ansaldo ke dalam kesulitan keuangan sehingga sebagian besar mereka tidak mampu memodernisasi pabrik mereka dengan baik. Hanya status tinggi mereka yang menyelamatkan mereka dari kebangkrutan. Jika kami ingin Ansaldo tetap menjadi bagian inti dari sektor teknik mesin, kami harus memastikan bahwa mereka menggunakan mesin dan teknik modern."
 ITA_ferrea_mole_ferreo_cuore: "Ferrea Mole Ferreo Cuore"
 ITA_ferrea_mole_ferreo_cuore_desc: "Korps tank kita pasti akan dipanggil untuk melakukan tindakan besar yang berani secara militer. Untuk itu, tidak cukup hanya sekedar berkendara di sekitar lambung besi, mereka juga harus memiliki Hati Besi."
 ITA_air_innovations_bba: "Inovasi Udara"
 ITA_air_innovations_bba_desc: "Perang di udara telah menjadi salah satu medan peperangan modern yang menentukan. Kita tidak boleh membiarkan diri kita tertinggal dalam bidang penting ini."
 ITA_citta_dell_aria: "Citta dell'Aria"
 ITA_citta_dell_aria_desc: "Upaya penelitian kami telah lama tersebar di berbagai wilayah di negara ini. Hal ini membuat segalanya menjadi tidak efisien. Kita harus menggabungkan upaya penelitian kita dan menemukan 'Kota Langit', tempat para ilmuwan dan insinyur dari berbagai bidang studi dapat bekerja sama untuk membangun pesawat generasi baru."
 ITA_citta_dell_aria_tt: "Jika tidak ada §YFasilitas Eksperimental§! lainnya di §Y[2.GetName]§!, kita akan mendapatkan §G1§! §YFasilitas Aerodinamika dan Avionik§! di §Y[2.GetName]§!."
 ITA_expand_rome_flying_school: "Perluas Sekolah Terbang Roma"
 ITA_expand_rome_flying_school_desc: "Dengan semakin kompleksnya pesawat modern, terdapat peningkatan risiko kecelakaan jika pilotnya kurang terlatih. Kita harus memastikan bahwa sekolah penerbangan kita mengikuti perkembangan teknis dalam hal kualitas pelatihan serta memenuhi permintaan pilot baru yang disebabkan oleh pertumbuhan militer kita."
 ITA_reggianes_exports: "Ekspor Reggiane"
 ITA_reggianes_exports_desc: "Perusahaan Reggiane telah mengembangkan serangkaian pesawat tempur yang cukup mumpuni yang telah menarik perhatian militer asing yang ingin memodernisasi angkatan udara mereka. Jika kita mengizinkan mereka mengekspor pesawat mereka, pengalaman yang diperoleh dari memodifikasi desain dasar ke spesifikasi yang berbeda tidak diragukan lagi akan sangat berharga untuk proyek pengembangan kita sendiri."
 ITA_diving_bombers: "Pembom Selam"
 ITA_diving_bombers_desc: "Topik Dukungan Udara Jarak Dekat telah menjadi sangat penting di kalangan militer. Meskipun pesawat telah lama digunakan untuk menjatuhkan bom, nampaknya beberapa negara telah mulai mengembangkan pesawat khusus yang dapat menempatkan bom dengan akurasi tak tertandingi dengan menyelam dari ketinggian. Meskipun industri kita pasti bisa memproduksi pesawat seperti itu pada waktunya, ada negara lain yang mempunyai desain untuk tujuan ini."
 ITA_superaereo: "Superaereo"
 ITA_superaereo_desc: "Hari-hari sekelompok kecil pesawat terbang kesana kemari sudah lama berlalu. Kampanye udara modern dalam banyak hal memiliki kompleksitas yang serupa dengan kampanye darat. Oleh karena itu, kami memerlukan staf perencanaan khusus untuk mengoordinasikan berbagai skuadron kami sehingga mereka dapat bertindak bersama untuk mencapai misi mereka."
 ITA_officers_of_the_service_role: "Petugas Peran Layanan"
 ITA_officers_of_the_service_role_desc: "Tidak lagi cukup hanya dengan merekrut perwira dari angkatan bersenjata dan mengajari mereka cara terbang. Angkatan udara kita membutuhkan generasi perwira baru, yang dibesarkan dan dibentuk oleh angkatan udara kita, bukan sekadar mengadopsinya."
 ITA_standardization: "Standardisasi"
 ITA_standardization_desc: "Perang di udara, lebih parah dibandingkan perang di laut dan perang di darat, merupakan perang industri melawan industri. Massa dan massa sajalah yang menentukan. Kita harus memastikan bahwa kita dapat memproduksi pesawat sebanyak mungkin, meskipun hal ini berarti akan semakin sulit mengubah desain di kemudian hari."
 ITA_specialization: "Spesialisasi"
 ITA_specialization_desc: "Sekeras apapun kita berusaha, kita tidak akan pernah bisa menandingi kekuatan yang lebih besar dalam hal hasil mentah. Satu-satunya cara kita bisa bersaing di udara adalah dengan membuat pesawat yang lebih baik dari siapa pun. Masing-masing dari mereka harus mampu memenangkan pertarungan meski kalah jumlah tiga atau empat banding satu."
 ITA_multirole_aircraft: "Pesawat Multi Peran"
 ITA_multirole_aircraft_desc: "Dengan mengembangkan badan pesawat yang mampu melakukan peran berbeda dalam pertempuran, kita dapat mencapai pengurangan biaya produksi dan waktu pelatihan awak secara signifikan. Kami akan segera mempekerjakan teknisi kami untuk merancang badan pesawat serbaguna semacam ini."
 ITA_long_range_aircraft: "Pesawat Jarak Jauh"
 ITA_long_range_aircraft_desc: "Pangkalan musuh, industri, dan jalur pasokan seringkali berada jauh di belakang garis depan. Kita perlu mengembangkan dan meningkatkan pesawat jarak jauh kita sehingga mereka dapat mencapai dan mencapai target-target penting ini."
 ITA_fighter_designs: "Desain Pesawat Tempur"
 ITA_fighter_designs_desc: "Pesawat tempur adalah tulang punggung angkatan udara mana pun. Kita harus memastikan bahwa pesawat tempur kita mempunyai sarana untuk memaksakan superioritas udara di langit dan melindungi pesawat pengebom kita dalam perjalanan menuju sasaran mereka."
 ITA_bomber_designs: "Desain Pembom"
 ITA_bomber_designs_desc: "Dengan desain baru untuk pesawat pengebom kami, angkatan udara kami akan mampu mendukung pasukan kami di darat dan laut sambil mengancam pasukan musuh dan jalur pasokan mereka."
 ITA_supremacy_in_the_skies: "Supremasi di Langit"
 ITA_supremacy_in_the_skies_desc: "Tentara modern tidak dapat beroperasi dengan sukses tanpa dukungan angkatan udara yang kuat. Sangatlah penting bagi negara kita untuk memiliki pesawat dan teknologi tercanggih untuk mendominasi angkasa."
 ITA_naval_power_projection: "Proyeksi Kekuatan Angkatan Laut"
 ITA_naval_power_projection_desc: "Mengikuti warisan nenek moyang kita, kita harus memastikan bahwa kita memiliki industri yang diperlukan untuk mengembangkan kekuatan angkatan laut yang tangguh yang mampu mempertahankan supremasi Italia di Mediterania dibandingkan angkatan laut lainnya."
 ITA_intensify_torpedo_manufacturing: "Mengintensifkan Manufaktur Torpedo"
 ITA_intensify_torpedo_manufacturing_desc: "Torpedo Italia termasuk yang paling andal di dunia. Fiume adalah tempat kelahiran torpedo, dan dengan adanya pabrik di sana serta pabrik Silurificio Italiano di Naples, kami memiliki landasan yang baik untuk lebih memperluas penggunaan senjata angkatan laut yang mematikan ini."
 ITA_expand_naval_facilities: "Perluas Fasilitas Angkatan Laut"
 ITA_expand_naval_facilities_desc: "Angkatan Laut kelas satu tidak hanya membutuhkan armada tempur yang kuat, tetapi juga pelabuhan dan galangan kapal yang mendukungnya. Dengan berinvestasi pada infrastruktur angkatan laut, angkatan laut kita akan memiliki pangkalan serta kapasitas konstruksi dan perbaikan yang diperlukan ketika perang pecah."
 ITA_oto_naval_guns: "Senjata Angkatan Laut OTO"
 ITA_oto_naval_guns_desc: "Italia bergantung pada perusahaan Ansaldo dan Oderi-Terni-Orlando untuk senjata besar di kapal-kapal besarnya. Dengan melakukan investasi yang ditargetkan pada kapasitasnya, kita dapat membuat kapal perang kita membuat iri dunia."
 ITA_improve_overseas_naval_bases: "Meningkatkan Pangkalan Angkatan Laut Luar Negeri"
 ITA_improve_overseas_naval_bases_desc: "Peningkatan pelabuhan-pelabuhan di wilayah luar negeri kita akan memberikan landasan yang kuat bagi angkatan laut kita untuk mempertahankan kerajaan kita yang sedang berkembang dan mengancam jalur perdagangan musuh-musuh kita."
 ITA_milizia_marittima_di_artiglieria: "Milizia Marittima di Artiglieria"
 ITA_milizia_marittima_di_artiglieria_desc: "Italia memiliki garis pantai yang luas dan pelabuhan pulau yang terisolasi, rentan terhadap invasi. Dengan mereformasi Milizia Costiera dan berinvestasi pada pertahanan pesisir, kita dapat memastikan bahwa setiap penjajah harus menanggung akibatnya."
 ITA_supermarina: "marina super"
 ITA_supermarina_desc: "Sebuah pusat operasi modern harus didirikan di Panglima Tertinggi Regia Marina, untuk mengoordinasikan operasi formasi angkatan laut kita di seluruh Mediterania dan sekitarnya."
 ITA_stockpile_fuel: "Timbunan Bahan Bakar"
 ITA_stockpile_fuel_desc: "Minyak adalah darah yang mengalir di pembuluh darah kapal kita, yang tanpanya armada akan menjadi tidak aktif. Karena Italia kekurangan pasokan minyak dalam negeri dalam jumlah besar, maka sangat penting untuk membangun tangki penyimpanan minyak dan mengisinya, untuk mempertahankan kekuatan kita bahkan jika konflik di masa depan menghalangi kita untuk melakukan impor."
 ITA_forza_navale_especiale: "Spesial Forza Navale"
 ITA_forza_navale_especiale_desc: "Kapasitas untuk melakukan pendaratan amfibi kemungkinan besar akan terbukti sangat berharga dalam konflik apa pun di Mediterania. Dengan membentuk Pasukan Angkatan Laut Khusus, yang dilatih dan diperlengkapi untuk operasi amfibi, kita akan mampu memproyeksikan kekuatan dari laut di titik mana pun di garis pantai Mediterania yang panjang."
 ITA_naval_air_coordination: "Koordinasi Angkatan Laut-Udara"
 ITA_naval_air_coordination_desc: "Selama ini Komando Tinggi Angkatan Udara masih menganut doktrinnya sendiri dan belum berkoordinasi dengan baik dengan Angkatan Laut. Hal ini membatasi kapasitas Regia Marina untuk melakukan pengintaian yang efektif. Dengan mengembangkan doktrin gabungan angkatan laut-udara dan menyederhanakan komunikasi antara unit angkatan laut dan udara, kapal kita akan lebih mampu menemukan dan menyerang musuh."
 ITA_decima_flottiglia_mas: "Decima Flottiglia MAS"
 ITA_decima_flottiglia_mas_desc: "Teseo Tesei dan Elios Toschi dari Genio Navale telah merancang torpedo self-propelled yang dapat digunakan untuk menyusup ke pelabuhan musuh – dengan mendanai pengembangan senjata ini dan senjata unik lainnya, dan melatih unit operasi khusus untuk menggunakannya, kita mungkin dapat mencapai kemenangan dramatis dan tak terduga atas musuh-musuh kita."
 ITA_incrociatori_leggeri: "Incrociatori Leggeri"
 ITA_incrociatori_leggeri_desc: "Cukup cepat dan kuat untuk menghadapi kapal penjelajah ringan lain dan menyapu kapal perusak di depannya, namun cukup murah untuk menambah jumlah, kapal penjelajah ringan penting dalam melindungi jalur laut kita, dan dalam melawan konvoi musuh. Dengan memanfaatkan pengalaman kami dengan kelas Condottieri, Montecuccoli, dan Garibaldi, kami dapat menciptakan kekuatan kapal penjelajah untuk mendominasi lautan antara Eropa dan Afrika."
 ITA_incrociatori_pesanti: "Pesanti Incrociatori"
 ITA_incrociatori_pesanti_desc: "Untuk saat ini, Italia kekurangan basis industri untuk membangun kapal perang yang cukup agar dapat digunakan di mana pun kita membutuhkannya sekaligus. Dengan membangun kapal penjelajah yang kuat dan berlapis baja seperti kelas Zara, kita akan memiliki kapal-kapal tersebut untuk bersaing menguasai lautan di berbagai wilayah operasi."
 ITA_expand_naval_intelligence: "Perluas Intelijen Angkatan Laut"
 ITA_expand_naval_intelligence_desc: "Intelijen sinyal Italia telah berjalan dengan anggaran yang kecil selama bertahun-tahun, mengandalkan talenta-talenta Giorgio Verità Poeta dan Luigi Donini, namun hal ini hanya akan berjalan sejauh ini. Dengan memberi mereka lebih banyak staf, dan merekrut talenta baru seperti Letnan Eliso Porto, kita akan memiliki peluang lebih besar untuk memecahkan kode musuh dan menemukan lokasi pasukan mereka."
 ITA_cooperation_programs: "Program Kerja Sama"
 ITA_cooperation_programs_desc: "Industri pembuatan kapal dan persenjataan kami yang kuat memiliki sejarah baru dalam membangun kapal perang untuk negara lain, seperti kapal perusak kelas Hydra Yunani, atau membantu desain, seperti yang diberikan kepada Uni Soviet untuk kapal Proyek 7 mereka. Mencari peluang serupa dapat membantu mengembangkan lebih lanjut basis industri kita untuk menghadapi uji coba yang akan datang."
 ITA_cruiser_submarines: "Kapal Selam Penjelajah"
 ITA_cruiser_submarines_desc: "Untuk menyerang jalur laut musuh yang terletak di luar Mediterania, kita membutuhkan kapal selam jarak jauh yang mampu menjelajah lautan. Memberikan dukungan lebih lanjut terhadap program kapal selam pasca-PD1 kami yang luas, yang sebagian besar didasarkan pada karya insinyur Cavallini dan Bernardis, akan membantu kami mencapai tujuan ini."
 ITA_midget_submarines: "Kapal Selam Cebol"
 ITA_midget_submarines_desc: "Perairan Mediterania yang jernih berbahaya bagi kapal selam yang lebih besar. Membangun kapal-kapal kecil, jarak pendek, dan jarak pandang rendah dapat meningkatkan peluang mereka untuk bertahan hidup di lingkungan Mediterania, dan memberi kita kekuatan yang kita perlukan untuk berpatroli di titik-titik penting seperti Selat Sisilia."
 ITA_cacciatorpediniere_di_scorta: "Cacciatorpediniere di Scorta"
 ITA_cacciatorpediniere_di_scorta_desc: "Salah satu tugas inti [GetAppropriateRegiaMarinaNsName] adalah melindungi jalur laut antara Italia, Afrika Utara, dan Kepulauan Mediterania. Dengan membangun kapal perusak kecil yang berfokus pada peperangan antikapal selam dan melatih awaknya secara efektif, kita akan lebih mampu menjaga aliran pasokan ke pasukan kita di luar negeri."
 ITA_ispettorato_dei_mezzi_antisommergibili: "Ispettorato dei Mezzi Antisommergibili"
 ITA_ispettorato_dei_mezzi_antisommergibili_desc: "Membentuk Mariantisom sebagai komando peperangan anti-kapal selam akan memberikan kemampuan organisasi untuk mengoordinasikan kapal pengawal kita dengan lebih baik, dan mendorong inovasi teknologi untuk memberi kita keunggulan dalam pertempuran dengan kapal selam musuh."
 ITA_navi_da_battaglia: "Navi da Battaglia"
 ITA_navi_da_battaglia_desc: "Kapal perang kelas Littorio adalah contoh kapal modal yang cepat dan kuat. Membangun lebih banyak kapal-kapal ini dan menyempurnakan doktrin kita agar dapat menggunakannya secara lebih efektif akan meningkatkan garis pertempuran kita secara signifikan."
 ITA_proper_carriers: "Operator yang Tepat"
 ITA_proper_carriers_desc: "Desainer inovatif seperti Luigi Gagnoto telah menghasilkan desain kapal induk selama dekade terakhir. Dengan menggunakan keahlian ini, bersama dengan lambung kapal cepat Roma yang sudah ada (tetapi dengan mesin baru yang lebih bertenaga), kita bisa mendapatkan kapal induk yang beroperasi lebih cepat daripada membangun kapal induk dari lunas."
 ITA_refit_civilian_ships: "Reparasi Kapal Sipil"
 ITA_refit_civilian_ships_desc: "Meskipun armada kapal induk yang tepat jauh lebih mampu, namun jika kita ingin kapal induk cepat, maka sudut pandang harus dikurangi. Dengan mengubah kapal penumpang yang ada seperti Rex dan Conte di Savoia, kami dapat memperoleh perlindungan udara untuk armada kami dengan cepat."
 ITA_flotta_d_evasione: "Flotta d'Evasione"
 ITA_flotta_d_evasione_desc: "Sudah terlalu lama Italia puas membatasi ambisi angkatan lautnya hanya di Mediterania dan Laut Merah. Dengan berkomitmen pada ‘Breakout Fleet’ dan membangun kapal yang dirancang untuk Samudera Atlantik dan Hindia, kita akan mampu mengerahkan pengaruh kita di seluruh lautan di dunia."
 ITA_ethiopian_war_logistics_bba: "Logistik Perang Ethiopia"
 ITA_ethiopian_war_logistics_bba_desc: "Dari kurangnya kemajuan di Ethiopia, menjadi jelas bahwa kita telah meremehkan jumlah pasokan yang sebenarnya dibutuhkan oleh tentara modern. Kita harus melakukan upaya khusus untuk memperbaiki jalan dan pelabuhan di Afrika Timur agar pasokan yang diperlukan bisa sampai ke garis depan."
 ITA_the_abyssinian_fiasco: "Kegagalan Abyssinian"
 ITA_the_abyssinian_fiasco_desc: "Invasi kami ke Ethiopia telah berubah menjadi bencana. Sekali lagi, kita dihadapkan pada penampilan memalukan dari tentara Italia yang gagal mengalahkan tentara Ethiopia. Seperti nenek moyang kami di Adwa, kami telah dikalahkan. Kita hanya bisa menebak apa arti kekalahan sebesar ini bagi masa depan sistem fasis di Italia."
 ITA_solid_progress: "Kemajuan yang Solid"
 ITA_solid_progress_desc: "Kami telah mencapai kemajuan yang stabil di Etiopia, tanpa memperluas garis pertahanan kami atau membuat pasukan kami terkena serangan balik Etiopia. Meski kemenangan belum diraih, itu hanya masalah waktu saja."
 ITA_struggle_in_ethiopia: "Perjuangan di Etiopia"
 ITA_struggle_in_ethiopia_desc: "Kemajuan kita di Etiopia jauh di belakang jadwal, namun kita tidak boleh membiarkan kemunduran kecil seperti ini melemahkan semangat kita. Senjata Italia dan sistem fasis akan menang – berapapun resikonya."
 ITA_undermine_the_duce: "Melemahkan Duce"
 ITA_undermine_the_duce_desc: "Keinginan gila Mussolini untuk menaklukkan Ethiopia sekali lagi membawa kita ke ambang kekalahan. Meskipun kemenangan masih mungkin terjadi, harus jelas bahwa ini bukanlah kemenangan Mussolini."
 ITA_conspiracies_in_the_shadows: "Konspirasi dalam Bayangan"
 ITA_conspiracies_in_the_shadows_desc: "Bisikan-bisikan di aula kekuasaan semakin banyak menyuarakan ketidakpuasan mereka terhadap Mussolini. Konspirasi terjalin dan aliansi terbentuk di antara orang-orang yang biasanya memiliki sedikit kesamaan. Waktu untuk perubahan semakin dekat."
 ITA_servizio_informazione_militare: "Pelayanan Informasi Militare"
 ITA_servizio_informazione_militare_desc: "Militer kita memerlukan informasi yang akurat untuk merencanakan operasinya. Untuk melakukan hal ini, kita memerlukan organisasi pusat yang mengumpulkan dan menganalisis informasi ini, serta mengambil tindakan ofensif terhadap target tertentu jika diperlukan."
 ITA_triumph_in_africa_bba: "Kemenangan di Afrika"
 ITA_triumph_in_africa_bba_desc: "Rasa malu Adwa telah terhapuskan. Sekitar 40 tahun setelah penghinaan yang kami alami di tangan orang Etiopia, kami akhirnya membalas dendam. Kekuatan kita telah membuktikan kemampuan mereka tanpa keraguan, dan seluruh dunia kini harus mengakui kekuatan kita!"
 ITA_defeat_in_ethiopia_flag: "[ITA.GetNameDefCap] telah dikalahkan di [ETH.GetNameDef]"
 ITA_devaluate_the_lire: "Devaluasi Lire"
 ITA_devaluate_the_lire_desc: "Perang ini memakan biaya yang jauh lebih besar daripada yang kita inginkan. Perekonomian kita terpuruk akibat dampak yang ditimbulkannya. Mendevaluasi mata uang kita akan membuat produk kita lebih kompetitif di pasar internasional, namun akan membuat kehidupan rata-rata orang Italia sedikit lebih sulit – sebuah pengorbanan penting yang akan mereka lakukan dengan senang hati."
 ITA_anglo_italian_agreements: "Perjanjian Inggris-Italia"
 ITA_anglo_italian_agreements_desc: "Dengan adanya kenyataan baru di Afrika Timur, negara-negara kolonial lainnya harus berdamai dengan kita. Kami membutuhkan mereka untuk mengizinkan kami melewati Suez, namun mereka jauh lebih membutuhkan kami. Jika mereka menolak, kami mungkin harus mencari dukungan di tempat lain."
 ITA_topple_amhara_rulers: "Menggulingkan Penguasa Amhara"
 ITA_topple_amhara_rulers_desc: "Ethiopia adalah negara yang jauh lebih beragam dan terpecah-pecah dibandingkan yang diperkirakan kebanyakan orang. Ada banyak kelompok yang bukan pendukung kuat rezim lama Ethiopia. Memberi mereka konsesi kecil akan dengan mudah membuat mereka memihak kita, sehingga lebih mudah untuk menenangkan wilayah tersebut."
 ITA_the_new_emperor_of_ethiopia: "Kaisar Baru Ethiopia"
 ITA_the_new_emperor_of_ethiopia_desc: "Rakyat Etiopia telah hidup di bawah pemerintahan kaisar selama berabad-abad. Tidak diragukan lagi akan membuat tugas kita jauh lebih sederhana jika kita bisa memberi mereka Kaisar baru untuk menggantikan Kaisar lama mereka, dengan menobatkan Raja kita sebagai Kaisar baru."
 ITA_ministero_della_cultura_popolare: "Ministero della Cultura Popolare"
 ITA_ministero_della_cultura_popolare_desc: "Masyarakat kita harus selalu mempunyai akses terhadap informasi yang akurat. Selama masa perang, agen musuh dapat dengan mudah menyebarkan informasi yang salah, dan kita harus melawannya dengan memberikan versi sebenarnya dari kejadian tersebut kepada masyarakat kita."
 ITA_culto_del_duce: "Kultus del Duce"
 ITA_culto_del_duce_desc: "Benito Mussolini, Penakluk Afrika, Pembalas Adwa, tidak diragukan lagi adalah negarawan Italia paling penting sejak zaman Kaisar Romawi. Dia adalah puncak maskulinitas, sepenuhnya tanpa rasa takut. Kita harus memastikan bahwa setiap orang Italia tahu bahwa mereka harus selalu berusaha untuk menjadi serupa dengan Mussolini semaksimal mungkin."
 ITA_devotion: "Pengabdian"
 ITA_devotion_desc: "Rakyat Italia berhutang banyak pada Mussolini. Dia telah, melalui kekuatan kemauannya, telah meningkatkannya dalam segala cara yang berarti. Mereka adalah orang-orang yang lebih berani, lebih kaya, dan lebih lengkap secara moral. Hal yang paling tidak bisa dilakukan oleh rakyat Italia adalah bersyukur dan mengikuti perintahnya."
 ITA_legge_bottai: "Legge Bottai"
 ITA_legge_bottai_desc: "Seni dan budaya Romawi telah menjadi fondasi semua kebudayaan modern di Eropa. Kita tidak boleh membiarkan kekayaan bersejarah ini digantikan oleh modernisme. Meskipun Italia harus selalu menatap masa depan, Italia juga tidak boleh melupakan masa lalunya."
 ITA_boost_the_grand_council_of_fascism: "Tingkatkan Dewan Besar Fasisme"
 ITA_boost_the_grand_council_of_fascism_desc: "Benito Mussolini telah berbuat banyak untuk Italia, namun pada akhirnya, dia masih seorang manusia biasa. jika dia menyesatkan negaranya, Dewan Agung Fasisme akan hadir untuk menghentikannya."
 ITA_to_live_as_a_lion: "Hidup Sebagai Singa"
 ITA_to_live_as_a_lion_desc: "Orang Italia tidak diciptakan menjadi domba. Mereka tidak dimaksudkan untuk duduk diam dan bersaing di baris kedua sejarah. Mereka dibuat untuk menentukan nasib mereka sendiri! Benito Mussolini adalah orang yang akan membuat mereka melakukan hal itu, dan mengingatkan mereka bahwa lebih baik hidup satu hari sebagai singa daripada hidup seratus tahun sebagai domba."
 ITA_la_battaglia_del_grano: "La Battaglia del Grano"
 ITA_la_battaglia_del_grano_desc: "Suatu negara tidak bisa dianggap benar-benar hebat jika bergantung pada negara lain untuk memenuhi kebutuhan pangannya. Italia harus mandiri dalam bahan pangan pokok jika ingin dianggap serius. Untuk tujuan ini, kita harus berjuang, dan berjuang sekuat tenaga dalam pertempuran lainnya. Hanya melalui kemenangan dalam Battle for Grain kita dapat mengharapkan kemenangan dalam perang."
 ITA_la_battaglia_per_la_terra: "La Battaglia per la Terra"
 ITA_la_battaglia_per_la_terra_desc: "Landasan masyarakat fasis yang kuat adalah tanah itu sendiri dan orang-orang yang menggarapnya. Masih banyak wilayah di Italia di mana kita bisa memperoleh lahan yang berguna dengan mengeringkan rawa-rawa dan mengairi lahan pertanian."
 ITA_la_battaglia_per_le_nascite: "La Battaglia per le Nascite"
 ITA_la_battaglia_per_le_nascite_desc: "Jika kita ingin mengambil tempat yang selayaknya kita di dunia, kita harus mempunyai kekuatan militer untuk merebutnya dengan kekerasan. Untuk ini, kita harus memiliki tentara. Tidaklah cukup bagi satu pasangan untuk memiliki satu atau dua anak – sebelum kita dapat memenangkan perang, kita harus memenangkan Pertempuran Kelahiran."
 ITA_strengthen_the_regime: "Perkuat Rezim"
 ITA_strengthen_the_regime_desc: "Perjuangan untuk mencapai kemandirian ekonomi telah menunjukkan bahwa fasisme bukanlah sebuah ideologi yang lemah dan lunak, seperti rezim liberal yang mendahuluinya. Kita harus memastikan bahwa masyarakat tidak akan pernah melupakan hal ini."
 ITA_the_man_of_providence: "Manusia Penyelenggaraan"
 ITA_the_man_of_providence_desc: "Mussolini tidak hanya berada di tempat dan waktu yang tepat. Setiap langkah telah dipandu, seolah-olah oleh kehendak Tuhan, untuk memastikan bahwa Mussolini mengambil alih kendali Italia ketika dia melakukannya."
 ITA_believe_obey_fight: "Percaya, Taat, Berjuang"
 ITA_believe_obey_fight_desc: "Partai kami didirikan berdasarkan prinsip sederhana. Pertama, untuk merebut kekuasaan, seseorang harus yakin bahwa hal tersebut mungkin dilakukan. Kedua, bahwa untuk merebut kekuasaan seseorang harus mematuhi orang-orang yang berkuasa. Ketiga, untuk merebut kekuasaan seseorang harus berjuang. Dan merebut kekuasaan adalah satu-satunya tujuan sebenarnya dari setiap gerakan politik yang layak menyandang nama tersebut."
 ITA_banda_carita: "Banda Carita"
 ITA_banda_carita_desc: "Perang tidak selalu merupakan peristiwa yang mulia. Meskipun publik mungkin fokus pada perjuangan di garis depan, kita tahu bahwa Home Front sama pentingnya, dan membasmi perlawanan di belakang juga sama pentingnya."
 ITA_banda_koch: "Banda Koch"
 ITA_banda_koch_desc: "Perang modern sering kali merupakan urusan seluruh bangsa yang sedang berperang. ini berarti garis depan bukan lagi satu-satunya tempat terjadinya pertempuran. Kita juga harus siap mengamankan jalur komunikasi kita melalui penggunaan pasukan tempur."
 ITA_security_militias: "Milisi Keamanan"
 ITA_security_militias_desc: "Merinci pasukan garis depan untuk keamanan area belakang adalah pemborosan prajurit yang baik. Kita harus membentuk unit khusus untuk menjaga bagian belakang tentara, untuk membebaskan lebih banyak tentara untuk melawan musuh."
 ITA_battaglioni_d_assalto: "Bataglioni d'Assalto"
 ITA_battaglioni_d_assalto_desc: "Kaus Hitam kami berdiri dalam tradisi kebanggaan kelompok penyerang pada Perang Besar. Dengan mengintegrasikan mereka ke dalam Angkatan Darat kami, kami akan memberi mereka serangan ofensif yang kuat dalam pertempuran."
 ITA_strengthen_the_blackshirts: "Perkuat Kaus Hitam"
 ITA_strengthen_the_blackshirts_desc: "Tentara Kerajaan Inggris terlalu terikat dengan rezim lama, dan berulang kali menunjukkan kurangnya semangat fasis. Jelas bahwa kita perlu memiliki seluruh divisi yang terdiri dari Blackshirts kita sendiri yang setia."
 ITA_milizia_coloniale: "Milizia Kolonial"
 ITA_milizia_coloniale_desc: "Kita harus memperkuat dan memperluas milisi fasis kita, Blackshirts, dengan lebih banyak wajib militer dari koloni, yang setia kepada rezim kita. Merekrut tidak hanya dari kalangan penjajah Italia tetapi juga dari penduduk lokal akan memungkinkan kita untuk meningkatkan jumlah mereka secara signifikan."
 ITA_towards_a_greater_italy: "Menuju Italia Raya"
 ITA_towards_a_greater_italy_desc: "Iridentisme Italia adalah akibat alami dari pengkhianatan yang dilakukan Entente kepada rakyat Italia setelah Perang Besar. Italia seharusnya memiliki kekuasaan penuh atas Mediterania, dan untuk itu, kita perlu memperluas perbatasan kita."
 ITA_heroes_of_the_nation: "Pahlawan Bangsa"
 ITA_heroes_of_the_nation_desc: "Kita harus mengakui dan menghargai jasa-jasa para pahlawan besar bangsa kita, namun kita tidak boleh lupa bahwa tanpa kepemimpinan bijaksana dari Duce, potensi mereka akan sia-sia belaka."
 ITA_capo_supremo: "Capo Supremo"
 ITA_capo_supremo_desc: "Hanya ada satu orang di Italia yang mampu membawa kejayaan dan kekuasaan yang layak diterima oleh negara besar kita. Masa monarki yang dekaden telah berakhir, inilah saatnya bagi Duce kita yang kuat untuk menjadi pemimpin tertinggi Italia."
 ITA_bend_the_bars: "Tekuk Palang"
 ITA_bend_the_bars_desc: "Italia mendapati dirinya menjadi sasaran penjara yang dibuat oleh Inggris setelah Perang Besar, dan semakin banyak penduduk dan kuatnya Italia, semakin besar pula penderitaan yang mereka alami akibat pemenjaraan tersebut. Ini saatnya untuk membengkokkan jeruji penjara itu, dan memperluas kendali Italia lebih jauh."
 ITA_subdue_the_sentinels: "Taklukkan para Sentinel"
 ITA_subdue_the_sentinels_desc: "Langkah selanjutnya menuju kebebasan dan kejayaan yang pantas didapatkan rakyat Italia adalah dengan menaklukkan para penjaga yang menahan kita di Mediterania, yaitu Gibraltar dan Suez."
 ITA_a_colonial_empire: "Sebuah Kerajaan Kolonial"
 ITA_a_colonial_empire_desc: "Terlepas dari upaya musuh dan saingan kita, Italia telah menjadi kerajaan kolonial yang perkasa. Kita harus memastikan tidak hanya bahwa kita memanfaatkan wilayah kita sebaik-baiknya, tetapi juga bahwa kita terus memperluas kendali Italia di Afrika."
 ITA_by_blood_alone: "Hanya Dengan Darah"
 ITA_by_blood_alone_desc: "Berkat kekuatan tentara kita dan fanatisme tak terbatas dari kaum irredentis Italia yang setia kepada rezim kita, Italia akhirnya akan mencatatkan ciri khasnya dalam sejarah sejarah, bukan hanya sebagai aktor sekunder, tetapi sebagai protagonis utama.\nDarah saja yang menggerakkan roda sejarah!"
 ITA_masters_of_the_aegean: "Penguasa Laut Aegea"
 ITA_masters_of_the_aegean_desc: "Jika kita ingin menguasai Mediterania, pertama-tama kita harus memastikan supremasi mutlak Italia atas Laut Aegea. Dengan ini, kami tidak hanya akan mengontrol akses ke Laut Hitam dan sebagian besar pantai Balkan, namun kami juga akan memiliki pangkalan angkatan laut baru yang dapat digunakan untuk mengamankan Terusan Suez."
 ITA_masters_of_the_mediterranean: "Ahli Mediterania"
 ITA_masters_of_the_mediterranean_desc: "Kekuasaan suatu negara sebanding dengan kedudukan maritimnya. Sudah waktunya untuk mengklaim kendali penuh atas Mediterania, karena ini adalah hak masyarakat Italia untuk mendominasi laut kuno yang merupakan tempat lahirnya peradaban kita."
 ITA_convene_the_grand_council: "Menyelenggarakan Dewan Besar"
 ITA_convene_the_grand_council_desc: "Kita harus mengadakan Dewan Besar Fasisme untuk membahas apa yang harus dilakukan terhadap Mussolini. Serangan terbarunya ke Ethiopia dan keengganannya untuk berbagi kekuasaan atau tanggung jawab telah membuat banyak orang mempertanyakan kemampuannya sebagai seorang pemimpin. Dia telah melayani negaranya dengan baik dan merupakan wajah fasisme, tapi mungkin ini saatnya untuk kepemimpinan baru…"
 ITA_foreign_affairs: "Luar Negeri"
 ITA_foreign_affairs_desc: "Setiap negara besar perlu menetapkan tujuan kebijakan luar negeri yang jelas, serta memiliki orang-orang berbakat yang dilatih untuk melakukan diplomasi sedemikian rupa untuk mencapai tujuan tersebut."
 ITA_balkan_ambition: "Ambisi Balkan"
 ITA_balkan_ambition_desc: "Sudah waktunya untuk memperluas perbatasan Italia ke timur menuju Slovenia dan, yang lebih penting, pantai Dalmatian. Kami akan menekankan pada warisan budaya Venesia di Dalmatia dan membuat dunia melihat bagaimana pemerintah Venesia tidak hanya bermanfaat bagi Dalmatia di masa lalu, tetapi juga sangat diterima oleh mereka."
 ITA_potential_allies_in_the_balkans: "Sekutu Potensial di Balkan"
 ITA_potential_allies_in_the_balkans_desc: "Untuk menguasai Balkan, kita tidak perlu menundukkan dan mendominasi seluruh negara di kawasan tersebut. Inilah saatnya menggunakan diplomasi untuk mendapatkan sekutu yang menguntungkan di Balkan, dan kemudian menaklukkan sisanya."
 ITA_albanian_occupation: "Pendudukan Albania"
 ITA_albanian_occupation_desc: "Albania merupakan sasaran empuk bagi pasukan kami untuk mendudukinya. Kecil kemungkinan kita akan menghadapi banyak perlawanan. Kita harus menunjukkan kepada dunia kekuatan Italia dan mengembalikan kejayaan masa lalu!"
 ITA_albanian_oil: "Minyak Albania"
 ITA_albanian_oil_desc: "Sudah waktunya untuk mengganti peralatan usang yang digunakan untuk konsesi minyak lama di Albania dan mengubahnya menjadi industri ekstraksi minyak yang kuat karena sekarang kita memiliki kendali penuh atas negara tersebut."
 ITA_support_albanian_irredentism: "Mendukung Irredentisme Albania"
 ITA_support_albanian_irredentism_desc: "Kita harus mencoba melegitimasi kekuasaan Italia atas Albania. Mendukung iredentisme Albania di wilayah Kosovo dan Epirus, dan bahkan lebih jauh lagi, pasti akan membuat kami mendapat dukungan publik yang signifikan dari penduduk setempat dan memberi kami peluang untuk lebih memperluas lingkup pengaruh kami."
 ITA_albanian_fascist_militia: "[GetAppropriateAlbanianFascistMilitiaName]"
 ITA_albanian_fascist_militia_default: "Milisi Fasis Albania"
 ITA_albanian_fascist_militia_alt: "Milisi Legalitas"
 ITA_albanian_fascist_militia_desc: "Kami akan membentuk sayap baru Kaus Hitam Italia di Albania, memastikan untuk merekrut tidak hanya penjajah Italia di negara tersebut tetapi juga sukarelawan Albania."
 ITA_guarantee_austrian_independence: "Menjamin Kemerdekaan Austria"
 ITA_guarantee_austrian_independence_desc: "Kami tidak dapat mentolerir campur tangan Jerman di Austria, karena hal ini merupakan ancaman besar bagi bangsa Italia dan perimbangan kekuatan di Eropa. Kami akan menjamin kemerdekaan Austria dan kami akan menentang segala manuver diplomatik yang ingin digunakan Jerman untuk mempengaruhi negara tersebut."
 ITA_negotiate_italian_claims: "Negosiasikan Klaim Italia"
 ITA_negotiate_italian_claims_desc: "Penentangan kami terhadap Jerman telah menempatkan kami pada posisi berkuasa atas negara-negara bekas Entente, yang berusaha keras untuk memisahkan rezim Italia dan Jerman. Kita harus mengeksploitasi situasi ini demi keuntungan kita dan merebut kembali kepemilikan kolonial yang dirampas dari kita setelah Perang Besar."
 ITA_peace_with_ethiopia_tt: "Setelah Perundingan Damai dengan §Y[ETH.GetNameWithFlag]§!:"
 ITA_ENG_must_control_necessary_states_tt: "§Y[ENG.GetNameWithFlag]§! Tidak mengontrol sejarah koloni Inggris di Tanduk Afrika dan Malta."
 ITA_FRA_must_control_necessary_states_tt: "§Y[FRA.GetNameWithFlag]§! Tidak mengontrol sejarah koloni Perancis di Djibouti dan Tunisia."
 ITA_ratify_the_stresa_front: "Ratifikasi Front Stresa"
 ITA_ratify_the_stresa_front_desc: "Konsesi teritorial kini telah diberikan kepada Italia, jadi inilah saatnya untuk memulai proses yang akan membawa Italia dan Prancis ke dalam aliansi militer yang disebut Front Stresa."
 ITA_joint_military_programs: "Program Militer Gabungan"
 ITA_joint_military_programs_desc: "Kita harus memupuk kerja sama antara Italia dan sekutu baru kita, baik di bidang militer maupun ilmu pengetahuan, karena keduanya berkaitan erat."
 ITA_italys_destiny: "Takdir Italia"
 ITA_italys_destiny_desc: "Kami akan menetapkan peran yang harus dimainkan Italia dalam aliansi ini: peran sebagai kekuatan maritim tertinggi di Mediterania. Langkah penting berikutnya dalam mencapai tujuan ini adalah mengamankan dominasi di Balkan."
 ITA_the_eastern_threat: "Ancaman Timur"
 ITA_the_eastern_threat_desc: "Bukan rahasia lagi bahwa munculnya Uni Soviet merupakan ancaman tidak hanya bagi kepentingan kita sendiri, namun juga bagi seluruh kekuatan Barat. Kami akan melumpuhkan kemampuan negara ini untuk berekspansi dengan melarang mereka memasuki salah satu wilayah terkaya yang dapat mereka akses: Laut Hitam."
 ITA_german_military_cooperation: "Kerjasama Militer Jerman"
 ITA_german_military_cooperation_desc: "$ITA_german_millitary_cooperation_desc$"
 ITA_sea_wolves_bba: "Serigala Laut"
 ITA_sea_wolves_bba_desc: "$ITA_sea_wolves_desc$"
 ITA_secret_weapons: "$secret_weapons$"
 ITA_secret_weapons_desc: "$secret_weapons_desc$"
 ITA_treaty_with_germany: "Perjanjian dengan Jerman"
 ITA_treaty_with_germany_desc: "$ITA_german_rd_treaty_desc$"
 ITA_request_control_of_french_territories: "Minta Penguasaan Wilayah Prancis"
 ITA_request_control_of_french_territories_desc: "$ITA_claims_on_france_desc$"
 ITA_befriend_japan: "Bertemanlah dengan Jepang"
 ITA_befriend_japan_desc: "$ITA_japan_friend_desc$"
 ITA_italian_irredentism: "Irredentisme Italia"
 ITA_italian_irredentism_desc: "Iridentisme Italia menjadi semakin agresif setelah Perang Besar berkat rezim fasis kita. Sudah saatnya Italia mencapai perbatasan alaminya dan menyatukan seluruh wilayah yang menjadi hak rakyat Italia!"
 add_faction_goal_secure_north_africa_tt: "Menambahkan sasaran §Y$secure_north_africa_goal_name$§! jika [ROOT.GetName] berada dalam faksi."
 ITA_war_with_france: "Perang dengan [FRA.GetName]"
 ITA_war_with_france_desc: "$ITA_go_after_france_desc$"
 ITA_war_with_greece: "Perang dengan Yunani"
 ITA_war_with_greece_desc: "Kita akan menjadi Kerajaan yang kuat seperti apa jika kita tidak memasukkan Yunani ke dalamnya? Itu seharusnya menjadi sasaran empuk..."
 ITA_war_with_the_uk: "Perang dengan Inggris"
 ITA_war_with_the_uk_desc: "$ITA_anti_uk_war_goals_desc$"
 ITA_befriend_greece: "Bertemanlah dengan Yunani"
 ITA_befriend_greece_desc: "$ITA_greece_friend_desc$"
 ITA_claims_on_turkey_bba: "Klaim terhadap Turki"
