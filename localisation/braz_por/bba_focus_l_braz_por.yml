 ITA_befriend_portugal: "Bertemanlah dengan Portugal"
 ITA_befriend_portugal_desc: "$ITA_portugal_friend_desc$"
 banda_carita_tt: "Mencegah Jerman menyelesaikan fokusnya §Y$GER_assassinate_mussolini$§!"
 ITA_demand_ticino: "Permintaan Ticino"
 ITA_demand_ticino_desc: "Negara bagian Swiss yang bergunung-gunung menampung banyak etnis yang berbeda, namun di antara mereka adalah orang Italia, yang sebagian besar tinggal di wilayah selatan negara tersebut seperti Ticino. Untuk mengamankan negara Italia yang megah, kita harus memastikan bahwa semua rakyat kita dapat tinggal di satu negara."
 ITA_austrian_guarantees_tt: "Jika Jerman berupaya melakukan Anschluss, Italia akan mendapat opsi untuk melakukan intervensi."
 ITA_all_eth_initial_states_controlled_tt: "Semua negara bagian awal di Etiopia dikendalikan oleh §Y[ROOT.GetFlag][ROOT.GetNameDef]§! atau sekutu §Y[ROOT.GetAdjective]§!."
 ITA_fronte_militare_clandestino_modifier_tt: "Tambahkan §Y$ITA_fronte_militare_clandestino_modifier$ (Italia)§! (§Y730§! hari) yang memberikan:\n$MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G+10%§!\n$MODIFIER_REQUIRED_GARRISON_FACTOR$: §R+15%§!"
 ITA_flotta_d_evasione_admiral_traits_tt: "Dua Laksamana acak akan mendapatkan sifat §Y$bold$§!:\n- $MODIFIER_NAVAL_SPEED$: §G+10%§!\n- $MODIFIER_NAVAL_DAMAGE_FACTOR$: §G+5.00%§!"
 ITA_heroes_of_the_nation_general_traits_tt: "Tiga Jenderal acak akan mendapatkan sifat §Y$war_hero$§!:\n- $MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-50.0%§!\n- $MODIFIER_REASSIGNMENT_DURATION_FACTOR$: §R+50.0%§!"
 ITA_mussolini_becomes_field_marshal_tt: "$ITA_benito_mussolini$ menjadi Marsekal Lapangan."
 ITA_the_italian_liberation_war: "Perang Pembebasan Italia"
 ITA_the_italian_liberation_war_desc: "Waktunya telah tiba untuk bangkit melawan kaum fasis dan menggulingkan rezim mereka yang sakit! Partigiani anti-fasis dari seluruh Italia siap berperang dan menyerahkan nyawa mereka dalam Perang Pembebasan Nasional ini!"
 ITA_fronte_militare_clandestino: "Front Militare Clandestino"
 ITA_fronte_militare_clandestino_desc: "Kami akan mengorganisir sebuah organisasi militer bawah tanah yang tergabung dalam sel-sel Perlawanan di setiap kota di Italia dan berhubungan dengan angkatan bersenjata kami, untuk mengoordinasikan operasi militer kami dan aksi-aksi partisan di belakang garis depan."
 ITA_corpo_volontari_della_liberta: "Corpo Volontari della Libertà"
 ITA_corpo_volontari_della_liberta_desc: "Komite Pembebasan Nasional bertekad untuk memperkuat struktur koordinasi militer kita, Corpo Volontari della Libertà, agar dapat secara efisien mengelola dan mengoordinasikan sejumlah besar partisan dan angkatan bersenjata."
 ITA_the_carabinieri: "Carabinieri"
 ITA_the_carabinieri_desc: "Karena peran carabinieri dalam jatuhnya rezim fasis, mereka kini diserang oleh kaum fasis, menyebabkan banyak dari mereka bergabung dengan gerakan perlawanan Italia. Kita harus menghubungkan unit-unit ini ke Korps Pembebasan Italia."
 ITA_gappisti: "gappisti"
 ITA_gappisti_desc: "Kami akan membentuk Gruppi di Azione Patriottica, unit partisan kecil yang akan beroperasi terutama di kota-kota, mirip dengan Perlawanan Perancis. Gappisti kami akan menyerang musuh dengan keras di belakang garis depan, melemahkan semangat garnisun dan mendapatkan dukungan dari penduduk setempat."
 ITA_partisan_republics: "Republik Partisan"
 ITA_partisan_republics_desc: "Kami akan mendorong pembentukan entitas negara sementara dalam bentuk Republik Partisan di wilayah yang dibebaskan oleh partisan, sebagai cara untuk menggalang pejuang perlawanan dan membuat musuh sibuk di belakang garis depan."
 ITA_the_kings_finest: "Yang Terbaik dari Raja"
 ITA_the_kings_finest_desc: "Kami akan membentuk divisi khusus yang terdiri dari tentara dan perwira yang setia kepada Kerajaan Italia, dan kami akan melatih mereka untuk menjadi elit Tentara Pembebasan kami."
 ITA_grande_rivolta_rurale: "Pedesaan Grande Rivolta"
 ITA_grande_rivolta_rurale_desc: "Sudah waktunya bagi kaum tani Italia untuk bergabung dan mengangkat senjata melawan penindas fasis. Musuh tidak lagi memiliki peluang di daerah pedesaan!"
 ITA_liberation_or_death: "Pembebasan atau Kematian!"
 ITA_liberation_or_death_desc: "Kami telah berjuang keras demi Pembebasan rakyat Italia dari penindasan fasis. Kita telah mengalami kerugian yang besar, namun tidak sia-sia, sekarang saatnya melakukan upaya terakhir untuk memberantas fasisme di Italia untuk selamanya!"
 ITA_independence_rds: "Kemerdekaan Italia"
 ITA_independence_rds_desc: "Cukuplah penaklukan yang dilakukan oleh sekutu kita. Bangsa Italia akan menentukan nasibnya sendiri mulai sekarang. Jika darah perlu ditumpahkan sekali lagi untuk mencapai tujuan ini, masyarakat Italia yang bangga akan siap untuk itu."
 ITA_the_italian_social_republic: "Republik Sosial Italia"
 ITA_the_italian_social_republic_desc: "Kaum royalis dan elemen anti-fasis lainnya di Italia telah bangkit melawan rezim kita. Kami telah mereformasi partai kami menjadi Partai Fasis Republik yang anti-monarkis dan mendirikan Republik Sosial Italia, sebuah inkarnasi baru dari negara fasis Italia. Kami akan menahan serangan musuh dan menyatukan kembali tanah kami!"
 ITA_guardia_nazionale_repubblicana: "Guardia Nazionale Repubblicana"
 ITA_guardia_nazionale_repubblicana_desc: "Mengingat peran yang dimainkan Kerajaan Carabinieri dalam upaya menggulingkan rezim fasis, kami akan segera mengganti angkatan bersenjata ini. Kami sudah mempunyai rencana untuk menyusun kembali Blackshirts dan membentuk Garda Nasional Partai Republik untuk menjalankan fungsi polisi dan militer."
 ITA_integrate_polizia_dell_africa_italiana: "Integrasikan Polizia dell'Africa Italiana"
 ITA_integrate_polizia_dell_africa_italiana_desc: "Kita harus mengintegrasikan polisi kolonial kita sementara unit-unit ini tetap setia kepada Italia dan rezim kita. Para partisan pasti akan berusaha untuk menguasai pasukan ini segera..."
 ITA_anti_partisan_measures: "Tindakan Anti-Partisan"
 ITA_anti_partisan_measures_desc: "Partisan musuh akhir-akhir ini sangat aktif, mengganggu pasukan cadangan kita dan mengancam jalur pasokan kita. Kita harus mengerahkan unit-unit baru yang khusus menangani peperangan anti-partisan dan mencegah geng-geng terkutuk ini."
 ITA_all_within_the_state: "Semua Dalam Negeri"
 ITA_all_within_the_state_desc: "Jika kita ingin menang dalam perang berdarah ini, setiap orang perlu berkontribusi dalam upaya perang. Namun tidak semua hal harus dilakukan untuk melawan musuh secara langsung, lini depan kita perlu didukung oleh industri dan logistik yang kuat, serta tentara untuk menjaga mereka."
 ITA_battaglioni_m: "Bataglioni M"
 ITA_battaglioni_m_desc: "Kami membutuhkan unit elit baru untuk menahan serangan musuh. Kita harus mengubah dan memperkuat batalyon Kaos Hitam yang unggul dalam pertempuran, dan menggunakan pasukan ini untuk memperkuat titik terlemah di garis depan kita dan mendorong musuh mundur dari tempat asalnya."
 ITA_reinforce_the_gustav_line: "Perkuat Garis Gustav"
 ITA_reinforce_the_gustav_line_desc: "Kita harus memperkuat garis pertahanan kita untuk mencegah kemajuan unit musuh. Republik Sosial Italia tidak boleh goyah sekarang!"
 ITA_the_social_republic_prevails: "Republik Sosial Menang!"
 ITA_the_social_republic_prevails_desc: "Kita telah menumpahkan terlalu banyak darah dalam perang sengit yang dimulai oleh sekelompok pengkhianat manipulatif, namun sekaranglah saatnya untuk mengakhirinya. Negara Italia akan terlahir kembali, lebih kuat dari sebelumnya!"
