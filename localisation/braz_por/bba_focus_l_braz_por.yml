 ITA_milizia_marittima_di_artiglieria_coastal_forts_tt: "Menambah §Y2 $coastal_bunker$§! di setiap provinsi milik dengan §Y$naval_base$§!.\nEfek saat ini:"
 ITA_cooperation_programs_deal_sweden_tt: "([ROOT.GetFlag]§Y[ROOT.GetName]§!): Memindahkan §Y2 Penghancur Kelas Curtatone§! dan §Y2 Penghancur Kelas Maestrale§! ke [SWE.GetFlag]§Y[SWE.GetName]§!."
 ITA_flotta_d_evasione_dockyards_tt: "Negara bagian tertentu di §YAfrika Utara§!, §YPantai barat Iberia§! dan §YPantai barat Perancis§! juga akan menerima §Y1 $dockyard$§! selama negara-negara tersebut dikuasai sepenuhnya oleh §Y[ROOT.GetFlag][ROOT.GetName]§! atau §Y[ROOT.GetAdjective] subjek§!."
 ITA_the_abyssinian_fiasco_completion_tt: "Dapat diselesaikan secara otomatis setelah gagal dalam misi §Y$ITA_conquer_the_north_mission$§! dan §Y$ITA_conquer_the_south_mission$§!, yang dikeluarkan oleh $ITA_benito_mussolini$ pada bulan Januari 1936."
 ITA_solid_progress_completion_tt: "Akan diselesaikan secara otomatis setelah berhasil dalam misi §Y$ITA_conquer_the_north_mission$§! dan §Y$ITA_conquer_the_south_mission$§!, yang dikeluarkan oleh $ITA_benito_mussolini$ pada bulan Januari 1936."
 ITA_topple_amhara_rulers_event_chain_tt: "Memulai rantai acara §YPendekatan Penguasa Lokal Pejabat Italia§!, yang memungkinkan kami meningkatkan kepatuhan atau menetapkan subjek Italia di beberapa negara bagian Etiopia, jika kami menginginkannya."
 ITA_a_colonial_empire_claims_tt: "Klaim keuntungan pada §Ysetiap [EGY.GetAdjective], [KEN.GetAdjective], [SUD.GetAdjective], [SOM.GetAdjective], [DJI.GetAdjective], [ETH.GetAdjective], [ERI.GetAdjective] atau [UGA.GetAdjective] wilayah§! belum diklaim oleh [ROOT.GetFlag][ROOT.GetNameDef] atau di bawahnya [ROOT.GetFlag][ROOT.GetAdjective] kendali.\nEfek saat ini:"
 generic_ROOT_gains_claim_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDef]§! memperoleh hak tagih kepada negara."
 generic_ROOT_gains_wargoal_tt: "§Y[ROOT.GetFlag][ROOT.GetNameDef]§! memperoleh §Y$annex_everything$§! tujuan perang melawan:"
 ITA_masters_of_the_aegean_claims_tt: "Klaim keuntungan di §Ysetiap [GRE.GetAdjective] dan [TUR.GetAdjective] negara bagian pesisir di Mediterania§! yang belum diklaim oleh [ROOT.GetFlag][ROOT.GetNameDef] atau di bawah kendali [ROOT.GetFlag][ROOT.GetAdjective].\nEfek saat ini:"
 ITA_masters_of_the_mediterranean_claims_tt: "Klaim keuntungan atas §Ysetiap negara pantai di Mediterania§! belum diklaim oleh [ROOT.GetFlag][ROOT.GetNameDef] atau di bawah kendali [ROOT.GetFlag][ROOT.GetAdjective].\nEfek saat ini:"
 ITA_support_albanian_irredentism_subject_effects_tt: "Efek berikut akan diterapkan jika §Y[ALB.GetFlag][ALB.GetNameDefCap]§! adalah §Ysubjek§! dari §Y[ROOT.GetFlag][ROOT.GetName]§!:"
 ITA_the_eastern_threat_claims_tt: "Klaim keuntungan atas §Ysetiap negara bagian di Laut Hitam yang dimiliki oleh [SOV.GetFlag][SOV.GetNameDef]§!.\nEfek saat ini:"
 ITA_joint_military_programs_two_allies_tt: "Efeknya berlipat ganda karena §Y[ROOT.GetNameWithFlag]§! berada di faksi dengan §Y[ENG.GetNameWithFlag]§! dan §Y[FRA.GetNameWithFlag]§!."
 ITA_joint_military_programs_one_ally_tt: "Efeknya akan berlipat ganda jika §Y[ROOT.GetNameWithFlag]§! berada dalam faksi dengan §Y[ENG.GetNameWithFlag]§! dan §Y[FRA.GetNameWithFlag]§!."
 ITA_war_with_france_claims_tt: "Klaim keuntungan pada §Ysetiap [FRA.GetAdjective] koloni§! di §Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! dan §Y$STRATEGICREGION_216$§! atau pulau Mediterania yang belum diklaim oleh [ROOT.GetFlag][ROOT.GetNameDef].\nEfek saat ini:"
 ITA_war_with_the_uk_claims_tt: "Klaim keuntungan pada §Ysetiap [ENG.GetAdjective] koloni§! di §Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! dan §Y$STRATEGICREGION_216$§! atau pulau Mediterania yang belum diklaim oleh [ROOT.GetFlag][ROOT.GetNameDef].\nEfek saat ini:"
 state_is_in_the_mediterranean_sea_tt: "Negara bagian ini berada di Laut Mediterania"
 ITA_cooperation_programs_decisions_tt: "Membuka §Y$ITA_naval_cooperation_programs_dec_cat$§! Keputusan untuk bekerja sama dengan sekutu Italia dan angkatan laut mereka."
 ITA_has_completed_cooperation_programs_focus_tt: "Ketika fokus §Y$ITA_cooperation_programs$§! selesai:"
 ITA_unlocks_decision_cede_aquila_class_destroyers_to_spain_tt: "Membuka Keputusan: §YCede Penghancur Kelas Aquila§!"
 ITA_midget_submarines_decision_tt: "Ketika §Y$ITA_cooperation_programs$§! fokus selesai:\nMembuka Keputusan §Y$ITA_export_midget_submarines$§!"
 ITA_monarchia_d_italia: "Monarki d'Italia"
 ITA_monarchia_d_italia_desc: "Vittorio Emanuele seharusnya tidak membuka pintu politik Italia bagi fasisme. Sudah waktunya untuk memperbaiki kesalahan ini dan membuat kaum fasis mengambil kursi belakang dalam pemerintahan."
 ITA_new_corporations: "Perusahaan Baru"
 ITA_new_corporations_desc: "Kita harus mengambil konsep korporasi yang digunakan oleh rezim fasis sebelumnya dan menyesuaikannya dengan kebutuhan pemerintahan baru kita."
 ITA_extraction_industry: "Industri Ekstraksi"
 ITA_extraction_industry_desc: "Kita harus memperluas industri ekstraksi sumber daya untuk memenuhi permintaan lini produksi kita. Kita tidak bisa membiarkan kekurangan bahan mentah membahayakan produksi militer kita."
 ITA_prepare_for_the_coming_wars: "Bersiaplah untuk Perang yang Akan Datang"
 ITA_prepare_for_the_coming_wars_desc: "Perang sedang terjadi di sekitar kita dan kita membutuhkan industri militer yang kuat untuk memenuhi kebutuhan militer kita."
 ITA_mobilize_the_railway_guns: "Memobilisasi Senjata Kereta Api"
 ITA_mobilize_the_railway_guns_desc: "Situasi yang menyedihkan memerlukan tindakan yang mendesak, waktunya telah tiba untuk mengoperasikan kembali senjata kereta api lama kita."
 ITA_bring_back_old_glories: "Kembalikan Kemuliaan Lama"
 ITA_bring_back_old_glories_desc: "Kami memiliki banyak kapal tua yang terdampar di berbagai pelabuhan menunggu untuk dibongkar. Beberapa insinyur dan perwira angkatan laut kita menyatakan bahwa dengan beberapa penyesuaian kita dapat mengoperasikan kembali kejayaan lama ini."
 ITA_new_forms_of_weaponry: "Bentuk Persenjataan Baru"
 ITA_new_forms_of_weaponry_desc: "Jika Italia ingin menjadi salah satu kekuatan militer terbesar di dunia, kita harus menyelidiki bentuk-bentuk persenjataan baru. Para ilmuwan kami yakin bahwa pengembangan program penelitian energi atom yang dirintis bisa memberikan harapan besar."
 ITA_revoke_the_acerbo_law: "Cabut Hukum Acerbo"
 ITA_revoke_the_acerbo_law_desc: "Undang-undang Acerbo memberi Mussolini dan partai fasisnya kendali yang kuat atas Italia yang sangat mereka idam-idamkan. Sudah waktunya untuk mencabut undang-undang ini untuk mencegah hal serupa terjadi lagi."
 ITA_christian_democracy: "Demokrasi Kristen"
 ITA_christian_democracy_desc: "Partai Demokrat Kristen adalah organisasi politik tengah yang konservatif, dipimpin oleh Alcide de Gasperi, yang berhasil mendapatkan dukungan rakyat dengan menyatukan cita-cita Kristen dengan gagasan kebebasan. Kita harus mengizinkan mereka membentuk pemerintahan selama mereka tetap setia kepada monarki."
 ITA_democratic_king: "Raja Demokrat"
 ITA_democratic_king_desc: "Sudah saatnya monarki Italia mengambil langkah maju menuju negara yang lebih demokratis, dengan tetap mempertahankan sosok Raja sebagai pemimpin utama."
 ITA_cooperate_with_moderates: "Bekerjasama dengan Moderat"
 ITA_cooperate_with_moderates_desc: "Tidak ada alasan untuk tidak bekerja sama dengan elemen-elemen yang kurang radikal dari rezim fasis sebelumnya. Ada orang-orang yang sangat cakap yang dapat membantu memajukan negara Italia yang telah diperbarui ini."
 ITA_expand_intelligence_services: "Perluas Badan Intelijen"
 ITA_expand_intelligence_services_desc: "Di era baru ini, pengetahuan adalah kekuatan. Kita harus memperluas berbagai cabang intelijen untuk memastikan bahwa kita dapat bersaing dengan dinas rahasia asing."
 ITA_crush_opposition: "Hancurkan Oposisi"
 ITA_crush_opposition_desc: "Masih banyak pendukung rezim fasis lama yang menentang kebijakan kami dan menghambat kerja pemerintahan baru kami. Waktunya telah tiba untuk menangani mereka."
 ITA_power_to_the_king: "Kekuasaan untuk Raja"
 ITA_power_to_the_king_desc: "Di masa ketegangan sosial dan politik yang besar ini, satu-satunya cara untuk memastikan bahwa tidak ada rezim ekstremis, baik fasis atau komunis, yang berkuasa di Italia, adalah dengan meningkatkan konsentrasi kekuasaan di tangan Raja, yang tentunya merupakan orang yang paling cocok untuk memimpin negara kita."
 ITA_disband_the_blackshirts: "Bubarkan Kaus Hitam"
 ITA_disband_the_blackshirts_desc: "Kaum Blackshirts adalah organisasi yang sangat berbahaya dalam melayani fasisme, jadi sudah waktunya bagi mereka untuk menghilang seperti yang dilakukan rezim fasis mereka. Kami akan segera membubarkan semua unit yang aktif."
 ITA_utilize_the_blackshirts: "Manfaatkan Kaos Hitam"
 ITA_utilize_the_blackshirts_desc: "Meskipun Blackshirts secara historis setia kepada rezim fasis dan Duce, jika kita menunjukkan kepada mereka bahwa organisasi mereka memiliki ruang untuk berkembang di rezim baru ini, kita mungkin bisa memanfaatkan mereka untuk kepentingan kita sendiri. Lagi pula, apakah terdapat perbedaan besar antara kedua rezim tersebut?"
 ITA_expand_the_royal_guard: "Perluas Pengawal Kerajaan"
 ITA_expand_the_royal_guard_desc: "Kami akan memperkuat dan memperluas Korps Pengawal Kerajaan agar memiliki pasukan andal yang setia kepada monarki Italia dan mampu menjalankan peran berbeda dalam segala jenis operasi militer jika diperlukan."
 ITA_gloria_al_regno_d_italia: "Gloria al Regno d'Italia"
 ITA_gloria_al_regno_d_italia_desc: "Mereka yang mengklaim bahwa monarki adalah sistem pemerintahan yang sudah ketinggalan zaman adalah orang-orang bodoh yang tidak bisa melihat bagaimana, di bawah tangan yang mulia dan tegas, sebuah negara yang sederhana bisa menjadi salah satu kekuatan terbesar di dunia.\nHidup raja!"
 ITA_paramilitary_training: "Pelatihan Paramiliter"
 ITA_paramilitary_training_desc: "Sudah waktunya untuk memperluas organisasi milisi sukarelawan dan meningkatkan pendidikan militer mereka. Kami akan menggunakan perwira terkemuka dari divisi elit kami untuk melatih anggota baru dan memimpin unit Kaos Hitam."
 ITA_seek_papal_support: "Carilah Dukungan Kepausan"
 ITA_seek_papal_support_desc: "Untuk menghadapi stabilitas sosial dan politik yang semakin meningkat di negara kita, kita perlu bersandar pada Gereja, yang secara historis telah memberikan begitu banyak pengaruh terhadap masyarakat Italia. Kita harus mendekati Paus untuk mencari persetujuan dan dukungannya."
 ITA_agents_of_the_church: "Agen Gereja"
 ITA_agents_of_the_church_desc: "Gereja mempunyai perwakilan yang tak terhitung jumlahnya di seluruh dunia, jika kita berhasil mendapatkan Vatikan di pihak kita, kita bisa mempunyai agen-agen baru yang bisa kita gunakan, dengan penyamaran yang sempurna sebagai utusan Gereja, yang akan meningkatkan jaringan intelijen kita."
 ITA_strengthen_the_papacy: "Perkuat Kepausan"
 ITA_strengthen_the_papacy_desc: "Jelas terlihat bahwa pengaruh Paus dalam masyarakat Italia sangat kuat. Satu-satunya cara untuk menjaga stabilitas nasional adalah dengan memberdayakan Gereja di Kerajaan Italia."
 ITA_setting_course: "Pengaturan Kursus"
 ITA_setting_course_desc: "Kerajaan Italia siap memenuhi takdirnya. Kebesaran dan kejayaan menanti rakyat Italia yang bangga, sekarang saatnya memutuskan bagaimana melangkah maju."
 ITA_mare_nostrum_bba: "Mare Nostrum"
 ITA_mare_nostrum_bba_desc: "Dengan kekuatan angkatan laut Roma Kuno pertama kali mengalahkan Kartago. Dengan berinvestasi pada kekuatan angkatan laut, Italia dapat berusaha menguasai Mediterania dan sekali lagi menjadikannya 'Mare Nostrum', laut kita."
 ITA_auxiliaries: "Pembantu"
 ITA_auxiliaries_desc: "Sama seperti zaman nenek moyang Romawi kita, pasukan tambahan terus memainkan peran penting saat ini dalam mendukung unit militer reguler, mengintai medan, dan mengganggu musuh. Kita perlu memperluas milisi paramiliter ini untuk memperkuat tentara kita."
 ITA_the_italian_legions: "Legiun Italia"
 ITA_the_italian_legions_desc: "Angkatan bersenjata kita mungkin tidak mampu melakukan hal tersebut di masa lalu, namun kini masyarakat Italia lebih bangga dengan warisan Romawi kita, kita harus menerapkan doktrin baru pada angkatan bersenjata kita untuk memastikan bahwa pasukan kita saat ini sama menakutkannya dengan ribuan tahun yang lalu."
 ITA_new_roman_citizens: "Warga Negara Romawi Baru"
 ITA_new_roman_citizens_desc: "Pemberian kewarganegaraan kepada penduduk asli koloni kita tentu akan membantu kita mendapatkan persetujuan dan kerjasama dari penduduk setempat."
 ITA_all_roads_lead_to_rome: "Semua Jalan Menuju Roma"
 ITA_all_roads_lead_to_rome_desc: "Legiun Romawi terkenal di masa lalu karena kecepatan dan efisiensi mereka dalam membangun jalan dan infrastruktur yang dibutuhkan pasukan mereka untuk beroperasi. Ribuan tahun kemudian, logistik dan jalur pasokan menjadi lebih penting saat melancarkan perang."
 ITA_the_king_of_the_skies: "Raja Langit"
 ITA_the_king_of_the_skies_desc: "Berbeda dengan nenek moyang kita di Romawi, angkatan bersenjata kita perlu mendominasi langit agar dapat beroperasi secara optimal di darat dan laut. Pesawat terbang Italia sudah terkenal karena keserbagunaan dan kualitasnya, namun sudah tiba waktunya bagi para insinyur penerbangan kami untuk meningkatkan dan mengembangkan benteng terbang yang sesungguhnya."
 ITA_modern_musculus: "Musculus Modern"
 ITA_modern_musculus_desc: "Seperti yang dilakukan bangsa Romawi, kita harus mengembangkan mesin perang yang kuat yang memungkinkan kita mendominasi medan perang. Kami akan merancang tank pamungkas untuk menyerbu garis depan dan meneror hati musuh kami."
 ITA_caligulas_pride: "Kebanggaan Caligula"
 ITA_caligulas_pride_desc: "Waktunya telah tiba untuk mengembangkan kapal perang terhebat yang pernah ada. Insinyur angkatan laut terbaik kami telah menyempurnakan desain dan pengujian prototipe dan sekarang yakin bahwa Neptunus akan menjadi raja tidak hanya di Mediterania, tetapi juga di luar Mediterania."
 ITA_iberian_protection: "Perlindungan Iberia"
 ITA_iberian_protection_desc: "Negara-negara Iberia telah menikmati keamanan yang relatif pada masa lalu, namun jelas bahwa saat ini mereka tidak akan mampu mempertahankan diri mereka sendiri melawan kekuatan musuh yang besar. Kita harus menawarkan perlindungan kepada mereka sebelum terlambat."
 ITA_south_american_alliances: "Aliansi Amerika Selatan"
 ITA_south_american_alliances_desc: "Saatnya memperluas batas faksi kita. Kami akan menjangkau negara-negara Amerika Latin dan meyakinkan mereka tentang pentingnya membentuk aliansi yang kuat melawan berbagai ancaman yang ada di sekitar kita."
 ITA_the_papacy_reborn: "Kepausan Terlahir Kembali"
 ITA_the_papacy_reborn_desc: "Sekarang Yang Mulia telah menggulingkan raja dan mengambil kendali penuh atas Italia, inilah saatnya bagi rakyat Italia untuk menyelaraskan diri terhadap visi dan tujuan Gereja."
 ITA_deus_vult: "Deus Vult"
 ITA_deus_vult_desc: "Gereja Katolik telah menjadi mercusuar harapan dan stabilitas di Eropa selama berabad-abad, dan ketika kita menghadapi masa-masa kelam di masa depan, kita harus menjadi mercusuar terang sekali lagi.\nTuhan menghendakinya!"
 ITA_catholic_action: "Aksi Katolik"
 ITA_catholic_action_desc: "Organisasi pemuda Katolik kita terbukti menjadi alat yang sangat efisien dalam membasmi komunis, mempromosikan prinsip-prinsip keadilan sosial Katolik dan meningkatkan jumlah angkatan bersenjata kita dengan semangat wajib militer baru."
 ITA_a_time_for_war: "Saatnya Berperang"
 ITA_a_time_for_war_desc: "Selama ajaran sesat masih ada di Eropa, tidak akan ada perdamaian. Ini adalah waktunya untuk Perang Suci yang baru. Mesin-mesin perang baru akan mengaum dalam nama-Nya, siap untuk menyerang para bidat dengan kemarahan yang wajar. Janganlah ada perdamaian sampai penghakiman menimpa setiap orang yang tidak beriman dari laras meriam 105mm."
 ITA_the_holy_lands: "Tanah Suci"
 ITA_the_holy_lands_desc: "Wilayah yang sama pentingnya dengan Palestina bagi iman Kristen adalah milik Kerajaan Allah secara sah. Kita harus memastikan bahwa Tanah Suci dikembalikan kepada kita, tanpa penundaan."
 ITA_the_catholic_dominion: "Dominasi Katolik"
 ITA_the_catholic_dominion_desc: "Dengan naiknya Kepausan sebagai kekuatan besar yang harus diperhitungkan sekali lagi, inilah saatnya bagi kita untuk menjangkau semua umat Kristiani yang setia dan bertindak sebagai tangan yang membimbing umat, sama seperti seorang gembala membimbing kawanannya dan melindungi mereka dari kejahatan. Itu adalah amanat Tuhan!"
 ITA_unite_the_opposition: "Satukan Oposisi"
 ITA_unite_the_opposition_desc: "Akar fasisme kuat di Italia dan dibutuhkan upaya besar untuk memberantasnya. Kita harus menemukan tujuan bersama di antara berbagai kelompok yang menentang rezim fasis, karena hanya dengan bersatu kita dapat menggulingkan Duce yang menjijikkan."
 ITA_liberate_gramsci: "Bebaskan Gramsci"
 ITA_liberate_gramsci_desc: "Kawan kita, filsuf Marxis Antonio Gramsci, telah dipenjara oleh pemerintah fasis selama lebih dari sepuluh tahun dan sekarang kesehatannya memburuk dengan cepat. Kita harus mengorganisir operasi rahasia untuk membebaskannya dan menyelamatkan nyawanya, karena dia pasti akan menjadi aktor kunci dalam revolusi buruh kita."
 ITA_organize_strikes_in_the_north: "Atur Pemogokan di Utara"
 ITA_organize_strikes_in_the_north_desc: "Sebelum kita mogok, kita akan memusatkan seluruh upaya kita untuk mendapatkan dukungan dari para pekerja industri di Italia dan memastikan bahwa daerah-daerah industri di utara mendukung kita melawan rezim fasis."
 ITA_the_southern_farmlands: "Lahan Pertanian Selatan"
 ITA_the_southern_farmlands_desc: "Meskipun upaya rezim fasis sia-sia, Italia pada dasarnya tetap merupakan negara pedesaan. Kita harus bergantung pada kaum tani untuk melaksanakan revolusi dengan sukses, dan tentunya di Italia selatanlah kaum tani memiliki kekuatan yang paling besar."
 ITA_defy_the_duce: "Menentang Duce"
 ITA_defy_the_duce_desc: "Saatnya telah tiba untuk bangkit melawan rezim fasis dan memberantas momok yang ditimbulkannya terhadap rakyat Italia.\nPekerja dan petani Italia, angkat senjata!"
 ITA_appeal_to_the_bourgeoisie: "Seruan kepada kaum Borjuasi"
 ITA_appeal_to_the_bourgeoisie_desc: "Kita harus menjangkau kelompok borjuis yang berkepentingan dengan jatuhnya rezim fasis. Dengan sumber daya yang mereka miliki dan keberanian kaum revolusioner, kita akan mampu dengan cepat mengakhiri perang berdarah ini!"
 ITA_seize_old_equipment: "Rebut Peralatan Lama"
 ITA_seize_old_equipment_desc: "Ada sejumlah besar peralatan militer tua yang disimpan di berbagai gudang senjata di seluruh negeri. Meskipun usianya sudah tua, menyita peralatan ini dan mendistribusikannya kepada pasukan kita akan sangat membantu dalam memenangkan perang."
 ITA_the_italian_republic: "Republik Italia"
 ITA_the_italian_republic_desc: "Monarki adalah sistem tua dan busuk yang hanya menghambat revolusi kita. Ini adalah waktunya untuk menyingkirkan keluarga kerajaan dan menjaga para pengikutnya."
 ITA_the_popular_front: "Front Populer"
 ITA_the_popular_front_desc: "Perang saudara telah menunjukkan bahwa komunis tidak hanya mampu memimpin rakyat Italia menuju kemenangan melawan fasisme, namun juga mencapai kemajuan sosial dan industri yang sangat dibutuhkan negara kita."
 ITA_the_garibaldi_legion: "Legiun Garibaldi"
 ITA_the_garibaldi_legion_desc: "Kami akan mengorganisir unit sukarelawan untuk berperang bersama rekan-rekan kami di Republik Spanyol sebagai bagian dari Brigade Internasional dalam perang saudara Spanyol."
 ITA_gruppi_di_difesa_della_donna: "Grup di Difesa della donna"
 ITA_gruppi_di_difesa_della_donna_desc: "Perempuan revolusioner dari berbagai formasi politik telah mengusulkan untuk membentuk kelompok pertahanan perempuan untuk berpartisipasi aktif dan mobilisasi kekuatan di semua kelas dan strata sosial jika terjadi perang."
 ITA_a_new_era_for_the_red_shirts: "Era Baru Kaus Merah"
 ITA_a_new_era_for_the_red_shirts_desc: "Kami akan mengikuti jejak Giuseppe Garibaldi dan pasukan Kaos Merahnya, memperkuat milisi ini dan melatih mereka untuk menjalankan tugasnya secara optimal, baik sebagai bagian dari Angkatan Darat Italia atau sebagai brigade sukarelawan di luar negeri."
 ITA_pugno_alzato: "Pugno Alzato"
 ITA_pugno_alzato_desc: "Sudah waktunya untuk memberantas momok fasisme dan ancaman yang ditimbulkannya terhadap seluruh umat manusia. Kami akan mengangkat tangan kami dalam kesatuan dalam pertarungan penting ini!"
 ITA_a_leader_steps_forward: "Seorang Pemimpin Melangkah Maju"
 ITA_a_leader_steps_forward_desc: "Sekarang saatnya untuk memutuskan siapa yang akan menjadi pemimpin Republik Italia yang baru. Untungnya, kita dapat memilih dari kandidat yang berkualifikasi tinggi."
 ITA_the_path_to_progress: "Jalan Menuju Kemajuan"
 ITA_the_path_to_progress_desc: "Kami akan menjangkau pemerintah komunis dan sosialis di seluruh dunia yang mungkin bersedia bekerja sama dengan kami dan membantu kami pulih dari perang saudara yang terpaksa kami alami."
 ITA_industrial_socialization: "Sosialisasi Industri"
 ITA_industrial_socialization_desc: "Sudah waktunya untuk mengambil alih pabrik-pabrik besar dari tangan pengusaha besar dan borjuis agar bisa dimanfaatkan sebesar-besarnya bagi seluruh rakyat Italia."
 ITA_institute_the_five_year_plan: "Melembagakan Rencana Lima Tahun"
 ITA_institute_the_five_year_plan_desc: "Seperti yang dilakukan rekan-rekan kita di Soviet, kita harus melakukan industrialisasi di negara kita yang mayoritas agraris agar bisa bersaing dengan negara-negara besar dunia. Kita akan mengembangkan rencana lima tahun yang tidak hanya akan membantu kita kembali ke tingkat industri sebelum perang saudara, namun juga jauh melampauinya."
 ITA_new_ricostruzione_industriale: "Industri Rikostruzione Baru"
 ITA_new_ricostruzione_industriale_desc: "Instituto per la Ricostruzione Industriale sejauh ini memainkan peran penting dalam penyelamatan, restrukturisasi dan pembiayaan bank-bank dan perusahaan swasta yang bangkrut. Dengan beberapa penyesuaian kembali, kami akan memastikan bahwa hal ini terus berjalan tanpa nuansa fasis di masa lalu."
 ITA_political_commissars: "Komisaris Politik"
 ITA_political_commissars_desc: "Untuk menjaga komitmen terhadap komunisme dan membangkitkan semangat ideologis dalam pasukan kita, kita akan membentuk sosok komisaris politik di angkatan bersenjata, yang bertanggung jawab atas pendidikan politik dan pengorganisasian unit-unit di mana mereka ditugaskan."
 ITA_common_ground: "Kesamaan"
 ITA_common_ground_desc: "Kita harus meninggalkan perbedaan dengan kelompok politik lain yang pada kenyataannya memiliki tujuan yang sama. Inilah saatnya untuk bekerja sama memimpin negara baru Italia menuju kemajuan."
 ITA_appease_the_military: "Tenangkan Militer"
 ITA_appease_the_military_desc: "Banyak perwira di angkatan bersenjata yang tidak puas dengan pemerintahan baru atau status mereka setelah perang saudara. Akan lebih bijaksana jika kita memastikan bahwa rasa tidak puas di kalangan militer dihilangkan dan para perwira merasa peran mereka dalam perang diakui."
 ITA_crush_the_mafia: "Hancurkan Mafia"
 ITA_crush_the_mafia_desc: "Mafia dan sejumlah geng penyelundup, pemeras, dan penjahat pada umumnya muncul kembali selama perang saudara. Adalah tugas kita kepada rakyat Italia untuk membasmi mereka dan memulihkan keamanan dan stabilitas negara."
 ITA_empower_the_carabinieri: "Berdayakan Carabinieri"
 ITA_empower_the_carabinieri_desc: "Carabinieri memainkan peran penting dalam membasmi mafia dan menjaga perdamaian dan keamanan di negara tersebut. Sudah waktunya untuk memperkuat kepolisian ini dan memungkinkan mereka melakukan tugas tambahan."
 ITA_army_modernization: "Modernisasi Angkatan Darat"
 ITA_army_modernization_desc: "Angkatan bersenjata kita dapat memperoleh manfaat dari peralatan dan teknik pelatihan baru yang memungkinkan mereka mengimbangi angkatan bersenjata dan doktrin negara-negara besar lainnya."
 ITA_union_in_the_party: "Persatuan dalam Partai"
 ITA_union_in_the_party_desc: "Persatuan di dalam partai merupakan faktor terpenting bagi perkembangan negara kita menuju komunisme. Kita harus memastikan bahwa semua anggota mempunyai visi yang sama, mempunyai tujuan yang sama dan mengikuti proses yang ditetapkan oleh partai untuk mencapainya."
 ITA_follow_the_soviet_union: "Ikuti Uni Soviet"
 ITA_follow_the_soviet_union_desc: "Ada jalan yang jelas menuju komunisme yang sudah ditandai oleh Uni Soviet, kita harus mengikutinya jika kita ingin upaya kita di republik baru ini membuahkan hasil dan mencapai negara komunis yang sejati."
 ITA_military_cooperation: "Kerja Sama Militer"
 ITA_military_cooperation_desc: "Kita harus membuat perjanjian kerja sama militer dengan sekutu kita jika kita ingin menang di dunia ini, karena negara-negara besar di sekitar kita, yang sudah pasti, adalah musuh proletariat."
 ITA_defense_against_capitalism: "Pertahanan Melawan Kapitalisme"
 ITA_defense_against_capitalism_desc: "Fasisme adalah musuh ideologis kita yang pertama dan terbesar, namun fasisme bukanlah satu-satunya musuh kita. Kaum kapitalis merupakan ancaman yang mengerikan bagi negara kita dan revolusi proletar. Kita harus bersiap menghadapi mereka."
 ITA_combined_research_effort: "Upaya Penelitian Gabungan"
 ITA_combined_research_effort_desc: "Kemajuan teknologi sangat penting jika kita ingin angkatan bersenjata kita mempunyai peralatan modern untuk menghadapi musuh-musuh kita. Kita harus berkolaborasi dengan sekutu kita untuk memastikan bahwa kita terus menjaga kemajuan ilmu pengetahuan, terutama di bidang militer."
 ITA_special_brigades: "Brigade Khusus"
 ITA_special_brigades_desc: "Kami akan membentuk brigade penyerangan khusus yang mampu mendukung unit militer kami dalam pertempuran selama serangan besar. Brigade-brigade ini akan terdiri dari anggota-anggota milisi yang memiliki keunggulan dalam unit mereka."
 ITA_defend_the_land: "Pertahankan Tanah"
 ITA_defend_the_land_desc: "Uni Soviet dan kebijakan-kebijakannya telah mengecewakan kaum proletar dan ideologi Marxis. Rakyat Italia akan mengambil jalannya sendiri menuju komunisme, sebuah jalan yang penuh dengan rintangan dan ancaman yang harus kita atasi, namun mudah-mudahan juga dengan kawan-kawan dan sekutu untuk saling membantu."
 ITA_united_anarchist_confederations: "Konfederasi Anarkis Bersatu"
 ITA_united_anarchist_confederations_desc: "Kita harus mencari kerja sama dengan kaum anarkis Spanyol dan kaum anarkis lainnya di seluruh dunia dalam perjuangan kita melawan fasisme dan kapitalisme. Kami akan membentuk Komisi Kerja Sama Besar yang menampung para aktivis, intelektual, dan pejuang kemerdekaan dari seluruh dunia."
 ITA_the_fight_against_stalinism: "[GetAppropriateRussianGovernmentIdeology]"
 ITA_russian_government_ideology_default: "Perjuangan Melawan Mereka yang Menentang Kita"
 ITA_russian_government_ideology_alt: "Perjuangan Melawan Stalinisme"
 ITA_russian_government_ideology_alt2: "Perjuangan Melawan Mereka yang Memecah belah Kita"
 ITA_the_fight_against_stalinism_desc: "[GetAppropriateRussianGovernmentIdeologyDesc]"
 ITA_russian_government_ideology_desc_default: "Sebelum kita dapat menghadapi ancaman yang merupakan doktrin Stalinis, doktrin tersebut telah digantikan oleh sesuatu yang lebih buruk lagi. Mengingat apa yang telah dibuktikan oleh kepemimpinan saat ini di masa lalu, kita tidak bisa menunggu mereka menyerang, kitalah yang harus menyerang terlebih dahulu!"
 ITA_russian_government_ideology_desc_alt: "Sayangnya, kapitalisme dan fasisme bukanlah satu-satunya musuh yang harus kita hadapi, para pengikut doktrin Stalinis melihat pemerintah dan negara kita sebagai ancaman terhadap kepentingan mereka, dan bersedia menghancurkan kita dengan cara apapun yang diperlukan. Kita tidak bisa menunggu mereka menyerang, kitalah yang harus menyerang lebih dulu!"
 ITA_russian_government_ideology_desc_alt2: "Sayangnya, ada banyak negara yang bekerja keras mencoba memecah belah kita. Meskipun kita tidak terlalu mencintai Stalin dan pemerintahannya, situasi saat ini tidak jauh lebih baik. Negara-negara seperti ini merupakan ancaman, kita tidak bisa menunggu mereka menyerang, kitalah yang harus menyerang terlebih dahulu!"
 ITA_raise_the_peoples: "Angkat Rakyat"
 ITA_raise_the_peoples_desc: "Ada banyak petani Italia pemberani yang bersedia memperjuangkan cita-cita kita. Bersama mereka, kita dapat membentuk lebih banyak unit Kaus Merah yang dapat digunakan untuk memperkuat barisan angkatan bersenjata kita."
 ITA_il_sol_dell_avvenire: "Il Sol dell'Avvenire"
 ITA_il_sol_dell_avvenire_desc: "Sudah waktunya untuk memproklamirkan negara Italia yang baru, Persatuan Nasional Italia, di mana semua warga negara bebas dan setara di hadapan negara.\nMatahari masa depan akan terbit di Italia!"
 ITA_italian_socialism: "Sosialisme Italia"
 ITA_italian_socialism_desc: "Jalan menuju sosialisme terbuka di hadapan kita, sekarang saatnya untuk mengambilnya dengan tekad untuk mencapai masyarakat yang adil di dalam perbatasan kita, dan status internasional yang layak diterima oleh Republik Italia di luar perbatasan kita."
 ITA_cooperate_with_the_mafia: "Bekerja sama dengan Mafia"
 ITA_cooperate_with_the_mafia_desc: "Organisasi mafia yang berkembang biak selama perang saudara mungkin merupakan peluang untuk meningkatkan kinerja perusahaan swasta dan negara di wilayah mereka, jika kita bersedia memberi mereka hak istimewa dan konsesi tertentu."
 ITA_mafia_abroad: "Mafia di luar negeri"
 ITA_mafia_abroad_desc: "Pengaruh keluarga mafia yang memiliki perjanjian dengan kami semakin meningkat tidak hanya di Italia, tetapi juga di luar negeri. Kita harus mengirim agen-agen yang terkait dengan mereka ke negara-negara kapitalis besar agar bisnis mereka bisa makmur dan melayani kepentingan kita."
 ITA_empower_the_unions: "Memberdayakan Serikat Pekerja"
 ITA_empower_the_unions_desc: "Ada potensi besar di kelas proletar Italia. Kita harus memastikan bahwa serikat pekerja mempunyai sarana dan wewenang untuk mengatur dan mengoptimalkan tenaga kerja di negara kita."
 ITA_production_lines: "Jalur Produksi"
 ITA_production_lines_desc: "Waktunya telah tiba untuk memperluas dan memodernisasi jalur produksi utama kita untuk memastikan bahwa angkatan bersenjata kita menerima pasokan dan peralatan yang diperlukan untuk terus beroperasi pada kinerja puncak."
 ITA_the_republics_leadership: "Kepemimpinan Republik"
 ITA_the_republics_leadership_desc: "Kita harus memilih partai dan pemimpin politik yang tepat untuk memimpin Republik Italia yang masih muda menuju masyarakat sosialis yang layak diterima rakyat kita. Baik Ferrucio Parri maupun Ivanoe Bonomi tampaknya merupakan kandidat yang layak dan berkualifikasi tinggi untuk mengemban tugas tersebut."
 ITA_bring_back_exiled_intellectuals: "Kembalikan Intelektual yang Diasingkan"
 ITA_bring_back_exiled_intellectuals_desc: "Rezim fasis memaksa banyak warga Italia ke pengasingan, termasuk para filsuf, intelektual, dan ilmuwan besar. Ini adalah waktu yang tepat untuk menawarkan kesempatan kepada semua pengungsi untuk kembali ke rumah mereka."
 ITA_social_stability: "Stabilitas Sosial"
 ITA_social_stability_desc: "Kita telah meninggalkan kengerian perang saudara, masyarakat kita kini lebih adil dan egaliter, dan meskipun jalan kita masih panjang untuk mencapai sosialisme, kita dapat dengan bangga mengatakan bahwa rakyat Italia akhirnya mencapai perdamaian sosial."
 ITA_aid_for_the_spanish_republic: "Bantuan untuk Republik Spanyol"
 ITA_aid_for_the_spanish_republic_desc: "Kita harus membantu rekan-rekan Spanyol kita dalam perang saudara. Republik sosialis mereka dikepung oleh jenderal-jenderal Spanyol yang haus darah yang telah bersumpah setia kepada negara yang kini mereka hancurkan, didukung oleh kekuatan-kekuatan fasis besar di Eropa."
 ITA_italia_libera: "Libera Italia"
 ITA_italia_libera_desc: "Kita harus mengambil inisiatif dan mengusulkan kepada negara-negara tetangga yang bersahabat untuk membentuk aliansi di Eropa yang memungkinkan kita bekerja sama dan mempertahankan diri terhadap berbagai ancaman yang ada di sekitar kita."
 ITA_european_democracies: "Demokrasi Eropa"
 ITA_european_democracies_desc: "Kita harus melanjutkan kebijakan solidaritas dan kerja sama antar negara-negara Eropa yang demokratis. Melalui diplomasi kita dapat membentuk aliansi kuat yang mampu menghadapi pihak lain."
 ITA_peace_preservation: "Pelestarian Perdamaian"
 ITA_peace_preservation_desc: "Di masa ketidakstabilan dan konflik internasional ini, hanya rakyat Italia yang mampu menjaga dan menegakkan perdamaian di Eropa."
 ITA_scientific_cooperation: "Kerjasama Ilmiah"
 ITA_scientific_cooperation_desc: "Kita harus mengembangkan program kerja sama ilmiah untuk memastikan bahwa kita bisa mengimbangi kemajuan teknologi negara-negara lain."
 ITA_secure_the_borders: "Amankan Perbatasan"
 ITA_secure_the_borders_desc: "Dengan meningkatnya ketegangan internasional di seluruh dunia, negara mana pun yang bukan sekutu kita harus dianggap berpotensi bermusuhan. Kita harus memperkuat dan menjaga perbatasan kita sesegera mungkin untuk mencegah dan menghentikan invasi apa pun."
 ITA_bring_down_fascist_strongholds: "Runtuhnya Benteng Fasis"
 ITA_bring_down_fascist_strongholds_desc: "Mengingat situasi kritis di Eropa, kita tidak bisa menunggu kekuatan fasis yang agresif melancarkan serangan terhadap kita. Siapa yang menyerang lebih dulu maka dialah yang paling baik menyerang, jadi kita pastikan kita menyerang kaum fasis terlebih dahulu dan sekuat tenaga."
 ITA_reestablish_old_alliances: "Membangun Kembali Aliansi Lama"
 ITA_reestablish_old_alliances_desc: "Kita harus mencoba membangun kembali aliansi yang kita bentuk selama Perang Besar. Hanya dengan bersatu dengan kekuatan demokrasi besar di Eropa kita akan mampu mengatasi berbagai ancaman yang menunggu kita."
 ITA_military_agreements: "Perjanjian Militer"
 ITA_military_agreements_desc: "Kita harus banyak belajar dari sekutu kita, kita harus mendekati mereka dengan proposal untuk mengembangkan program kerja sama militer dan teknologi."
 ITA_the_enemies_of_capitalism: "Musuh Kapitalisme"
 ITA_the_enemies_of_capitalism_desc: "Komunisme Soviet merupakan ancaman besar bagi seluruh Eropa dan juga bagi negara Italia. Waktunya telah tiba untuk merawat mereka."
 ITA_the_ethiopian_question: "Pertanyaan Etiopia"
 ITA_the_ethiopian_question_desc: "Perang di Etiopia merupakan peristiwa yang brutal dan tidak adil. Kita harus menebus kekejaman yang disebabkan oleh kaum fasis di negara ini dan menghubungi pihak berwenang setempat untuk mengupayakan rekonsiliasi."
 ITA_abolish_the_colonies: "Hapuskan Koloni"
 ITA_abolish_the_colonies_desc: "Kami akan mengembangkan dan menyajikan rencana revolusioner untuk menghapuskan status koloni di wilayah mana pun di Italia. Untuk pertama kalinya dalam sejarah negara kita, warga lokal di wilayah yang terkena dampak akan memiliki kesempatan untuk menentukan nasib mereka. Terserah pada kita untuk membuat mereka melihat manfaat menjadi provinsi yang sah di negara Italia."
 ITA_cooperatives_for_intensive_exploitation: "Koperasi untuk Eksploitasi Intensif"
 ITA_cooperatives_for_intensive_exploitation_desc: "Afrika adalah benua yang kaya dengan simpanan sumber daya yang besar, kita harus berinvestasi dalam meningkatkan cara kita memanfaatkan simpanan ini untuk memanfaatkannya semaksimal mungkin."
 ITA_condemn_colonialism: "Kutuk Kolonialisme"
 ITA_condemn_colonialism_desc: "Sudah waktunya untuk mengutuk kolonialisme dan menyerukan kekuatan Eropa yang telah menindas rakyat Afrika selama bertahun-tahun, dan jika ada tekanan, kita akan melawan mereka demi kepentingan rakyat Afrika."
 ITA_new_colonial_policies: "Kebijakan Kolonial Baru"
 ITA_new_colonial_policies_desc: "Sudah terlalu lama rezim fasis menganiaya penduduk lokal di wilayah jajahan. Ini saatnya meninjau kembali kebijakan kolonial kita, memberikan otonomi kepada daerah-daerah tersebut dan memperbaiki ketidakadilan yang terjadi di masa lalu."
 ITA_negotiations_with_albania: "Negosiasi dengan Albania"
 ITA_negotiations_with_albania_desc: "Sejarah Albania sangat dipengaruhi oleh Italia selama beberapa dekade terakhir. Sekarang kita telah meninggalkan rezim otoriter fasis, kita harus mengusulkan kepada pemerintah Albania untuk memperkuat hubungan antara negara kita dan bahkan kemungkinan untuk mengintegrasikan pemerintahan Albania ke dalam pemerintahan kita, dan secara resmi menyatukan kedua negara."
 ITA_enlist_the_bashkimi_kombetar: "Daftarkan Bashkimi Kombëtar"
 ITA_enlist_the_bashkimi_kombetar_desc: "Ada banyak warga Albania yang bersimpati kepada pemerintah dan ideologi kami dan ingin mendaftar di unit Kaus Merah. Kita harus membentuk cabang baru milisi sukarelawan untuk mengorganisir unit-unit baru yang terdiri dari para rekrutan ini."
 ITA_the_italian_confederation: "Konfederasi Italia"
 ITA_the_italian_confederation_desc: "Setelah meninjau kembali kebijakan kolonial kita, langkah selanjutnya yang harus kita ambil adalah membentuk konfederasi yang mencakup semua negara hasil proses dekolonisasi ini, yang berfungsi sebagai kerangka kerja di mana bangsa kita dapat bekerja sama dan saling menguntungkan."
 ITA_planned_economy: "Perekonomian Terencana"
 ITA_planned_economy_desc: "Perwakilan dari Konfederasi baru kami telah mengusulkan inisiatif ekonomi yang, menurut mereka, akan memungkinkan pengaturan dan peningkatan perekonomian semua negara anggota dengan cara yang efisien dan berkelanjutan."
 ITA_the_fight_overseas: "Pertarungan di Luar Negeri"
 ITA_the_fight_overseas_desc: "Waktunya telah tiba untuk memperkuat pertahanan dan mempersiapkan logistik untuk mendukung kampanye militer besar-besaran di benua Afrika. Kami akan mengembangkan teknik pelatihan khusus untuk pasukan dan angkatan laut kami agar mereka dapat tampil maksimal dalam berbagai kondisi sulit yang akan mereka hadapi."
 ITA_irregulars: "Tidak teratur"
 ITA_irregulars_desc: "Pasukan tidak teratur memainkan peran penting dalam kampanye di Afrika. Kita harus meningkatkan rekrutmen di kalangan penduduk lokal dan meningkatkan pelatihan yang diterima unit-unit ini."
 ITA_liberate_the_workers_of_africa: "Bebaskan para pekerja di Afrika"
 ITA_liberate_the_workers_of_africa_desc: "Waktunya telah tiba untuk membebaskan rakyat Afrika untuk selamanya dari berbagai pemerintahan yang menindas mereka!"
 ITA_ascari: "Ascari"
 ITA_ascari_desc: "Divisi reguler yang terdiri dari pasukan lokal dari Afrika telah terbukti sangat efisien dalam menjalankan berbagai peran, tidak hanya sebagai garnisun atau cadangan tetapi juga dalam operasi militer di medan sulit di mana divisi lain akan kesulitan."
