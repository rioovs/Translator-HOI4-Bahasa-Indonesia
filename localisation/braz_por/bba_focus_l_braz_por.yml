 ITA_il_vento_aureo: "Il Vento Aureo"
 ITA_il_vento_aureo_desc: "Sudah lama Kepausan ditindas oleh kekuatan asing. Namun, kita dapat mengoptimalkan program pelatihan angkatan udara dan pesawat tempur kita untuk memungkinkan pilot yang jauh lebih murah namun lebih berani, sehingga membawa kekuasaan emas Gereja Katolik kepada musuh-musuh kita dari udara. Ini akan menjadi upacara peringatan termegah kami!"
 form_greater_italy_tt: "Membuka Keputusan: §YProklamasikan Italia Raya§!"
 ITA_papal_faction: "Dominasi Katolik"
 ITA_roman_faction: "Imperium Romanum"
 ITA_latin_initiatives: "Inisiatif Latin"
 ITA_depose_mussolini: "Singkirkan Mussolini"
 ITA_depose_mussolini_desc: "Waktunya telah tiba untuk menggulingkan Mussolini dari kekuasaan! Dia telah membuktikan dirinya sebagai pemimpin yang tidak kompeten yang telah menyeret Italia tercinta melewati banyak kesulitan yang tidak perlu dan menguji ketahanannya hingga melewati titik puncaknya. Meskipun bayangannya mungkin membayangi kita dalam beberapa waktu ke depan, Italia dan rakyatnya akan menang!"
 ITA_italo_balbo_focus: "Italia Balbo"
 ITA_italo_balbo_focus_desc: "Kita membutuhkan pemimpin militer yang cakap untuk membimbing kita melewati masa-masa sulit yang akan datang. Italo Balbo bukan hanya seorang pemimpin militer, dia juga seorang pahlawan penerbangan yang telah menjalankan beberapa misi diplomatik dan mengatur wilayah Libya dengan cukup efektif. Tentunya dia akan memperbaiki keadaan militer kita yang miskin dan membawa kejayaan bagi Italia!"
 ITA_remove_balbo_as_advisor_tt: "§YItalo Balbo§! tidak akan lagi tersedia sebagai §YAdvisor§! atau §YField Marshal§!."
 ITA_dino_grandi_focus: "Dino Grandi"
 ITA_dino_grandi_focus_desc: "Kita membutuhkan seseorang yang cerdas secara diplomatis dan tidak takut untuk menata ulang lembaga-lembaga lama jika kita ingin sejahtera. Dino Grandi telah menjabat sebagai menteri luar negeri dan mereformasi kelas diplomatik, membuka diri bagi orang lain selain para bangsawan. Dia tidak akan segan-segan melakukan reformasi yang diperlukan dan mendorong Italia menuju masa depan yang baru dan cerah!"
 ITA_remove_grandi_as_advisor_tt: "§YDino Grandi§! tidak lagi tersedia sebagai §YAdvisor§!."
 ITA_has_new_duce_flag: "Telah digulingkan oleh §YDewan Besar§!."
 ITA_stop_the_squandering: "Hentikan Pemborosan"
 ITA_stop_the_squandering_desc: "Sudah terlalu lama Mussolini menghabiskan uang dan sumber daya yang Italia tidak mampu beli – inilah saatnya mengakhiri pemborosan yang sembrono ini! Kita perlu mengendalikan pengeluaran dan memfokuskan modal kita untuk meningkatkan bidang lain."
 ITA_consolidate_power: "Konsolidasi Kekuatan"
 ITA_consolidate_power_desc: "Cengkeraman kami terhadap partai dan negara pada umumnya masih lemah. Kita harus mengkonsolidasikan kekuatan yang kita miliki dan memperkuat rezim kita dengan menunjukkan kepada publik bahwa kita kuat dan dapat diandalkan seperti sebelumnya!"
 ITA_purge_the_party: "Bersihkan Partai"
 ITA_purge_the_party_desc: "Bisikan telah sampai ke telinga kita bahwa sebagian orang hanya ingin melihat rezim lama dipasang kembali. Meskipun Mussolini telah digulingkan dan digulingkan dari kekuasaannya, bayangannya selalu hadir di seluruh pemerintahan dan di benak masyarakat. Kita harus menunjukkan kekuatan dan membersihkan partai dari unsur-unsur yang tidak benar-benar loyal kepada kita namun tetap mengabdi pada Duce lama."
 ITA_the_fate_of_mussolini: "Nasib Mussolini"
 ITA_the_fate_of_mussolini_desc: "Meskipun Mussolini masih menjadi tahanan rumah, kita tidak bisa benar-benar bergerak maju karena kehadirannya yang terus membayangi kita. Kami telah mengamankan posisi kami sebagai kekuatan sejati dalam partai dan sekarang waktunya telah tiba untuk menentukan nasib mantan Duce!"
 ITA_divino_duce: "Divino Duce"
 ITA_divino_duce_desc: "Yang menjadi jelas adalah pengaruh satu orang terhadap suatu negara dan rakyatnya. Mungkin itu yang bisa kita manfaatkan dan adaptasi. Dengan memanfaatkan saluran negara, kita dapat mempromosikan Duce baru kita sebagai pemimpin yang kuat dan cakap yang dapat mempersatukan Italia. Kami akan memberi orang-orang seseorang yang lebih besar dari kehidupan untuk dipercaya – seseorang yang ilahi untuk mereka percayai!"
 ITA_blackshirt_loyalty: "Dapatkan Loyalitas Kaos Hitam"
 ITA_blackshirt_loyalty_desc: "Kaum Blackshirts telah lama menduduki tempat khusus dalam fasisme di Italia, dan jika kita ingin membangkitkan inspirasi di masyarakat, kita sebaiknya mendapatkan loyalitas dari organisasi tersebut. Mereka akan sangat berguna dalam menyebarkan persepsi ilahi tentang Duce baru yang mulia ke seluruh angkatan bersenjata – dan seterusnya."
 ITA_a_greater_purpose: "Tujuan yang Lebih Besar"
 ITA_a_greater_purpose_desc: "Perselisihan baru-baru ini di dalam partai telah menunjukkan kepada kita kelemahan dalam mengaitkan gagasan fasisme terlalu dekat dengan satu individu saja. Kita harus fokus untuk mempromosikan fasisme sebagai sebuah konsep yang lebih besar, sesuatu yang melampaui kehidupan fana seseorang – sebuah gagasan yang dapat didukung oleh orang-orang."
 ITA_spreading_the_eagles_wings: "Melebarkan Sayap Elang"
 ITA_spreading_the_eagles_wings_desc: "Di sekitar kita, ideologi-ideologi lain sedang runtuh dan gagal. Tampaknya hanya fasisme yang mampu bertahan dari serangan gencar peristiwa-peristiwa yang penuh gejolak ini dengan ketangguhan dan bahkan berkembang pesat. Adalah tugas kita untuk membawa stabilitas ini ke negara-negara lain juga; untuk memberi mereka secercah cahaya di masa-masa gelap ini!"
 ITA_italian_hegemony: "Hegemoni Italia"
 ITA_italian_hegemony_desc: "Dengan dunia yang dilanda perang di sekitar kita, kita harus menginspirasi dan menyatukan semua bangsa dan budaya yang berbeda di bawah hegemoni kita, untuk menunjukkan kepada mereka bagaimana fasisme dan [ROOT.GetNameDefCap] bermanfaat bagi mereka. Kita harus memimpin jalan menuju masa depan yang lebih cerah!"
 ITA_reorganize_regio_esercito: "Atur ulang Regio Esercito"
 ITA_reorganize_regio_esercito_desc: "Dengan kepemimpinan baru, muncullah wawasan baru. Jelas bagi siapa pun yang benar-benar ingin melihat bahwa pasukan kita yang menang pasti memiliki area yang masih bisa ditingkatkan. Dengan sumber daya yang baru saja dibebaskan, kita harus berinvestasi dalam lebih banyak pelatihan dan mengatur ulang angkatan bersenjata sehingga tidak ada yang bisa menghalangi mereka!"
 ITA_reinforce_regia_aeronautica: "Perkuat Regia Aeronautica"
 ITA_reinforce_regia_aeronautica_desc: "Regia Aeronautica dihormati dan membuat iri di seluruh dunia, namun masih ada ruang untuk perbaikan. Dengan lebih banyak sumber daya yang tersedia, kita harus berinvestasi dalam peralatan dan pelatihan untuk menjadikannya angkatan udara yang paling ditakuti!"
 ITA_compagnie_auto_avio_sahariane: "Perluas Perusahaan Auto Avio Sahariane"
 ITA_compagnie_auto_avio_sahariane_desc: "Perusahaan Auto-Sahara di Libya terbukti cukup efektif bila dikombinasikan dengan pesawat pengintai mereka sendiri. Memperluas rancangan ini seharusnya membuat kekuatan kita semakin hebat dan membuat musuh kita takut akan Tuhan!"
 ITA_combined_land_and_air_warfare: "Gabungan Perang Darat dan Udara"
 ITA_combined_land_and_air_warfare_desc: "Kehadiran Regia Aeronautica yang membantu Regio Esercito telah menunjukkan kemampuan yang dimiliki militer Italia, namun masih ada ruang untuk kemajuan! Memperdalam kerja sama ini akan menghancurkan musuh kita di medan perang dan membawa kejayaan abadi bagi Italia!"
 ITA_the_fourth_shore: "Pantai Keempat"
 ITA_the_fourth_shore_desc: "Libya sering disebut sebagai Pantai Keempat Italia dan merupakan bagian integral dari masa depan bangsa kita. Ini adalah koloni terdekat dan salah satu yang paling berharga karena berfungsi sebagai penghubung ke seluruh benua Afrika. Dengan menginvestasikan sumber daya di sini, kami mengamankan kepemilikan kami di luar negeri dan memperoleh keuntungan besar di masa depan."
 ITA_oil_in_tripoli: "Minyak di Tripoli"
 ITA_oil_in_tripoli_desc: "Kami telah menemukan emas di Libya – itulah emas hitam! Kami telah menemukan cadangan minyak yang sangat besar di gurun di luar Tripoli. Kita tidak bisa membiarkan kesempatan seperti ini berlalu begitu saja, namun harus kita manfaatkan aset tersebut demi kejayaan Italia!"
 ITA_steel_in_tripoli: "Baja di Tripoli"
 ITA_steel_in_tripoli_desc: "Tampaknya ada sejumlah besar besi yang terkubur di gurun di luar Tripoli, menunggu kita untuk menggali dan mengolahnya. Dengan membangun pabrik baja di dekatnya, kita dapat menggunakan baja tersebut untuk memajukan kekuatan kita yang termasyhur!"
 ITA_novus_ordo: "Novus Ordo"
 ITA_novus_ordo_desc: "Nasib Italia terikat erat dengan Libya, dan oleh karena itu kita perlu mengintegrasikannya lebih jauh ke dalam wilayah kita. Hal ini dapat dicapai dengan menawarkan ‘kewarganegaraan khusus’ kepada setiap warga Libya yang bersedia berperang untuk kami, dan dengan melakukan hal tersebut, kami dapat mengamankan kendali kami atas Mediterania dan Afrika Utara."
 ITA_seek_british_military_cooperation: "Mengupayakan Kerja Sama Militer Inggris"
 ITA_seek_british_military_cooperation_desc: "Meskipun kita dikhianati oleh mantan sekutu kita dalam perang terakhir, mungkin masih masuk akal jika kita melihat lebih jauh dari dendam kita dan membagikan ranting zaitun. Ada banyak hal yang dapat kita pelajari dari Inggris, khususnya mengenai angkatan laut dan udara mereka."
 ITA_anglo_italian_pact: "Menandatangani Pakta Anglo-Italia"
 ITA_anglo_italian_pact_desc: "Kerja sama militer yang kami nikmati dengan Inggris telah memberikan manfaat yang baik bagi kami, begitu pula dengan pakta non-agresi. Perjanjian seperti itu akan mengamankan sebagian besar wilayah Afrika kita, sehingga memungkinkan kita mengalihkan pandangan ke negara lain."
 ITA_invite_france_to_military_partnership: "Undang Prancis ke Kemitraan Militer"
 ITA_invite_france_to_military_partnership_desc: "Perancis adalah tetangga terdekat kita yang terkuat dan sekutu lama kita. Meskipun kami tidak akan melupakan pengkhianatan mereka di perang terakhir, kami bisa memaafkan. Mungkin ini saatnya untuk melupakan dendam lama dan berusaha memperkuat militer kita melalui kemitraan yang erat."
 ITA_franco_italian_pact: "Menandatangani Pakta Perancis-Italia"
 ITA_franco_italian_pact_desc: "Kerja sama militer yang kami miliki dengan Prancis sangat bermanfaat, begitu pula dengan pakta non-agresi. Kita tidak hanya akan mengamankan wilayah barat kita di Eropa, namun juga sebagian besar wilayah Afrika kita, yang akan membuat kita bebas untuk fokus ke tempat lain."
 ITA_proclaim_the_italian_empire: "Proklamasikan Kekaisaran Italia"
 ITA_proclaim_the_italian_empire_desc: "Dengan akuisisi kami baru-baru ini di Afrika, hari baru telah tiba. Dengan kerajaan yang sedang berkembang dan investasi yang bijaksana dalam bidang militer, kita bukan lagi sekadar Kerajaan; kami akhirnya dengan percaya diri mendeklarasikan dimulainya Kekaisaran Italia! Sudah lama kita menunggu momen ini!"
 ITA_italy_will_guarantee_tt: "[GetItalyGuaranteesMajor]"
 ITA_italy_will_guarantee_tt_standard: "§Y[ROOT.GetNameDefCap]§! akan §Ymenjamin§! §YNegara besar§! mana pun yang menjamin §Y[ROOT.GetNameDefCap]§!."
 ITA_italy_will_guarantee_tt_fulfilled: "§Y[ROOT.GetNameDefCap]§! akan §Ymenjamin§! §YNegara besar§! mana pun yang menjamin §Y[ROOT.GetNameDefCap]§!. Efek Saat Ini:"
 ITA_african_conquests_tt: "Dengan Imperium kita yang bercita-cita tinggi, akan §Ylebih murah§! untuk §Ymencaplok§! wilayah di §YBenua Afrika§!."
 ITA_economic_reforms: "Reformasi Ekonomi"
 ITA_economic_reforms_desc: "Perekonomian sebagian besar mengalami stagnasi di bawah rezim lama, namun dengan kebangkitan Partito Nazionale Fascista, kami lebih dari siap untuk menangani tugas penting ini! Kita kini bebas menunjuk orang-orang kompeten yang mumpuni untuk merevitalisasi perekonomian."
 ITA_improve_the_industries: "Meningkatkan Industri"
 ITA_improve_the_industries_desc: "Dengan membaiknya perekonomian, kita kini memiliki sumber daya untuk mengalihkan perhatian kita ke industri dan melakukan reformasi luas di sektor tersebut. Industri yang lebih efisien pasti akan menghasilkan lebih banyak peralatan yang dapat menjangkau kekuatan kita dengan lebih cepat."
 ITA_reorganize_the_party: "Reorganisasi Partai"
 ITA_reorganize_the_party_desc: "Partito Nazionale Fascista telah menjadi institusi yang basi dan berat, penuh intrik dan mengagung-agungkan diri sendiri. Dengan cengkeraman yang lebih kuat pada partai, kini kita dapat mulai menata ulang partai dari awal, menjadikannya lebih efisien dan dinamis."
 ITA_meritocracy: "Meritokrasi"
 ITA_meritocracy_desc: "Setelah menundukkan oposisi di dalam barisan kami, kami kini bebas membuka beberapa institusi bagi anggota di luar Partai Fasis. Hal ini akan melahirkan ide-ide baru dan menarik, serta peluang-peluang baru."
 ITA_expanded_corporatism: "Korporatisme yang Diperluas"
 ITA_expanded_corporatism_desc: "Korporatisme adalah gagasan mendasar fasisme dan merupakan sesuatu yang harus kita terapkan semaksimal mungkin di semua wilayah yang baru kita peroleh. Namun untuk melakukan hal ini, kita harus bergantung pada elit dan talenta lokal serta membuka pintu bagi kemajuan dalam hierarki fasis. Ini adalah cara mudah untuk menanamkan loyalitas dan efisiensi di wilayah kekuasaan baru kita."
 ITA_stop_the_squandering_military_industry_tt: "$ITA_modify_military_industry_dynamic_modifier_ns_intro$\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+5,00%§!"
