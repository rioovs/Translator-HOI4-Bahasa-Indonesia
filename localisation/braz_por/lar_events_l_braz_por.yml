l_braz_por:
 LAR_concessions_stresa_front_tt: "Anda diharapkan untuk menghormati komitmen Anda dengan bergabung dengan Front Stresa melawan Jerman. Konsesi Teritorial tidak akan dibuat jika Anda menolak."
 lar_concessions_italy_tt: "Italia akan lebih mungkin menyetujui tindakan gabungan terhadap Jerman"
 lar_france_stresa_front_italy_agreed: "Italia telah setuju untuk bergabung dengan Front Stresa dengan imbalan konsesi teritorial"
 france_continue_the_fight_tt: "Kami tidak akan diberi kesempatan lagi untuk menyerah dengan hormat. Jika kita kalah, seluruh wilayah metropolitan Perancis akan diduduki."
 lar_congress_of_paris.1.t: "Kongres Paris"
 lar_congress_of_paris.1.desc: "Atas undangan [This.GetLeader], [ITA.GetLeader], [SPA.GetLeader] dan [POR.GetLeader] telah tiba di Paris untuk membahas perjanjian mengenai wilayah pengaruh kolonial di Afrika. Karena Perancis dan Italia merupakan kekuatan utama yang tertarik untuk memperluas kerajaan mereka, konsesi harus diberikan kepada [SPA.GetNameDef] dan [POR.GetNameDef] untuk meyakinkan mereka agar bergabung dengan aliansi dan berperang untuk mencapai tujuan-tujuan ini.\n\nSementara [POR.GetLeader] kemungkinan besar akan berusaha untuk mendapatkan dukungan bagi rencana lama untuk menyatukan Angola dan Mozambik, [SPA.GetLeader] harus dibeli dengan menyerahkan sebagian wilayah Perancis di Afrika Utara."
 lar_congress_of_paris.1.a: "Kami akan mendapatkan kompensasi di tempat lain."
 lar_congress_of_paris.2.t: "Menggambar Ulang Peta Afrika"
 lar_congress_of_paris.2.desc: "Pada perundingan putaran pertama, delegasi Perancis menawarkan pemisahan sederhana benua ini di tengah-tengah, memberikan kita klaim atas Mesir, Sudan dan lebih jauh ke selatan hingga Kenya. Meskipun proposal ini tidak terlalu rinci – dan sebagian besar menyangkut wilayah yang sebenarnya tidak ada di antara kita – proposal ini menjanjikan dukungan Prancis untuk penaklukan sebuah kerajaan besar di Afrika."
 lar_congress_of_paris.2.a: "Impian Kekaisaran Italia di Afrika bernilai sedikit risiko."
 lar_congress_of_paris.2.b: "Tidak ada alasan mengapa kita harus mendukung hal ini."
 lar_congress_of_paris.3.t: "[From.GetNameDefCap] setuju"
 lar_congress_of_paris.3.desc: "Delegasi dari [From.GetNameDef] pada prinsipnya telah menyetujui usulan perubahan wilayah. Meskipun masih ada beberapa rincian kecil yang harus diselesaikan dan lokasi pasti perbatasan baru yang diusulkan masih menjadi bahan perdebatan, diplomat kami memperkirakan tidak ada masalah besar yang dapat menggagalkan perjanjian tersebut."
 lar_congress_of_paris.3.a: "Kerja bagus."
 lar_congress_of_paris.4.t: "[From.GetNameDefCap] menolak"
 lar_congress_of_paris.4.desc: "Delegasi dari [From.GetNameDef] telah menyatakan perundingan selesai. Mengutip perbedaan pendapat mendasar mengenai usulan perubahan, mereka meninggalkan Paris untuk kembali ke [From.GetNameDef].\n\nSetelah kepergian mereka yang tergesa-gesa, duta besar [From.GetAdjective] menyatakan bahwa pemerintah [From.GetAdjective] tidak lagi menganggap dirinya terikat oleh perjanjian bantuan timbal balik atau aliansi dengan kami."
 lar_congress_of_paris.4.a: "Terlebih lagi untuk kita."
 lar_congress_of_paris.5.desc: "Sementara delegasi-delegasi lain di Paris berdebat tentang siapa yang berhak mendapatkan wilayah yang sebenarnya tidak dikuasai oleh negara mereka, para diplomat kami telah mendorong tujuan yang lebih bisa dicapai. Pemerintah Perancis telah mengindikasikan bahwa mereka menyetujui usulan kami untuk menyerahkan Maroko kepada kami sebagai imbalan atas janji kami untuk mendukung mereka dalam perang yang akan datang. Hal ini akan menghubungkan kepemilikan kami di Afrika Utara dan Barat."
 lar_congress_of_paris.5.a: "Jika mereka bersedia membayar harganya, kami bersedia melakukan bagian kami."
 lar_congress_of_paris.5.b: "Tidak ada gurun pasir sebanyak apa pun yang sebanding dengan setetes pun darah Spanyol."
 lar_congress_of_paris.6.desc: "Meskipun kurangnya kekuatan keras kami menyulitkan diplomat kami di Paris untuk mempengaruhi proses persidangan, kami tetap ditawari dukungan untuk mengambil wilayah antara Angola dan Mozambik, ditambah kemungkinan untuk mengklaim sebagian besar Afrika Selatan. Tampaknya memberikan wilayah-wilayah ini kepada kami adalah cara bagi dua kekuatan besar untuk menghindari konflik yang dapat menggagalkan keseluruhan perjanjian.\n\nMenyetujuinya, bagaimanapun, akan membuat kami berkomitmen untuk berperang di sisi Perancis dan Italia dalam upaya mereka memperluas kerajaan masing-masing."
 lar_congress_of_paris.6.a: "Harga kecil yang harus dibayar."
 lar_congress_of_paris.6.b: "Mereka meminta terlalu banyak dan menawarkan terlalu sedikit."
 lar_france_political_violence.1.t: "Protes Berubah menjadi Kekerasan"
 lar_france_political_violence.1.desc: "Aliansi longgar antara liga sayap kanan dan sayap kanan mengadakan protes dan demonstrasi di seluruh Paris hari ini. Tampaknya para pengunjuk rasa tidak pernah berencana berkumpul dan membubarkan diri secara damai. Seolah-olah mendapat isyarat tak terucapkan, demonstrasi-demonstrasi tersebut mengubah arah dan berkumpul di Majelis Nasional. Polisi antihuru-hara yang dipanggil dengan tergesa-gesa mampu menahan barisan barisan agar tetap terlihat dari gedung. Pada beberapa kesempatan, kelompok-kelompok tersebut menerobos garis polisi dan berhasil dipukul mundur hanya dengan sedikit usaha.\n\nPara pengunjuk rasa baru bubar setelah tengah malam. Berita mengenai kerusuhan telah menyebar dan kemungkinan besar akan melemahkan kepercayaan masyarakat terhadap kemampuan pemerintah dalam menjaga ketertiban umum."
 lar_france_political_violence.1.a: "Republik harus menanggung ini."
 lar_france_political_violence.1.b: "Tuntut mereka yang bertanggung jawab."
 lar_france_political_violence.2.desc: "Koalisi serikat pekerja dan intelektual menyerukan 'Hari Aksi' di ibu kota sebagai tanggapan terhadap keputusan politik baru-baru ini. Meskipun ada upaya polisi untuk mengendalikan demonstrasi, kelompok-kelompok kecil anarkis dan radikal komunis berusaha memicu kerusuhan. Beberapa toko digeledah dan trem terbalik. Upaya para perusuh untuk membangun barikade di Rue Royale untuk memblokir akses ke Majelis Nasional digagalkan oleh polisi yang berjaga.\n\nKetika para perusuh menyebar ke seluruh Prancis dan para pekerja kembali ke meja kerja mereka, banyak orang di negara tersebut bertanya-tanya apakah pemerintah masih mampu menjaga hukum dan ketertiban."
 lar_france_political_violence.3.t: "Kerusuhan Sayap Kanan"
 lar_france_political_violence.3.desc: "Menyusul keputusan pemerintah baru-baru ini, kaum monarki dan ekstremis sayap kanan dari seluruh negeri telah turun ke ibu kota dengan tujuan yang jelas untuk 'menyelesaikan pekerjaan yang belum terselesaikan pada tahun 1934', ketika kerusuhan serupa gagal menyerbu parlemen tetapi berhasil memaksa pemerintah untuk mengundurkan diri.\n\nMeskipun polisi telah diperingatkan sebelumnya bahwa protes kemungkinan besar akan berubah menjadi kekerasan, mereka tidak siap menghadapi tingkat organisasi dan agresi yang ditunjukkan oleh mereka yang telah mempersiapkan diri dengan baik. kelompok. Dalam beberapa kejadian, polisi yang menjaga Place de la Concorde terpaksa menembaki para pengunjuk rasa untuk mempertahankan posisi mereka.\n\nDengan puluhan orang tewas dan ratusan lainnya luka-luka, para pengunjuk rasa telah mundur dari ibu kota untuk menjilat luka mereka, namun mereka berhasil menunjukkan kepada negara bahwa pemerintah tidak aman bahkan di ibu kotanya sendiri."
 lar_france_political_violence.3.a: "Tindakan apa pun sekarang hanya akan memperburuk keadaan."
 lar_france_political_violence.3.b: "Republik akan menang!"
 lar_france_french_union.2.t: "Afrika Utara memilih untuk bergabung dengan Uni"
 lar_france_french_union.2.desc: "Yang mengejutkan banyak pengamat, masyarakat Aljazair, Maroko dan Tunisia menyetujui referendum Uni Perancis dengan selisih tipis. Karena penduduk di wilayah tersebut sudah dianggap sebagai warga negara penuh, mereka diperbolehkan untuk mengembalikan sejumlah anggota parlemen ke Majelis Nasional.\n\nMeskipun unsur-unsur nasionalis di ketiga negara tersebut masih ada, semangat mereka telah terpukul dan membutuhkan setidaknya satu generasi untuk pulih."
 lar_france_french_union.2.a: "Mereka memahami arti Fraternité!"
 lar_france_french_union.3.t: "Afrika Utara memilih untuk pergi"
 lar_france_french_union.3.desc: "Terlepas dari segala upaya yang dilakukan oleh pemerintah daerah, para pemilih di Aljazair, Maroko dan Tunisia secara mayoritas menolak usulan Uni Perancis. Segera setelah pengumuman hasil pemilu, demonstrasi besar-besaran terjadi di beberapa kota besar di wilayah tersebut ketika kelompok-kelompok nasionalis memanfaatkan kemenangan mereka untuk menuntut kemerdekaan segera dan penuh dari negara mereka.\n\nKomandan Pasukan Perancis di Afrika Utara telah mengirimkan permintaan mendesak untuk bala bantuan karena tampaknya ada kemungkinan bahwa beberapa elemen radikal akan mencoba untuk mengambil tindakan sendiri."
 lar_france_french_union.3.a: "Sungguh tidak berterima kasih!"
 lar_france_french_union.4.t: "Afrika Barat memilih untuk bergabung dengan Uni"
 lar_france_french_union.4.desc: "Setelah berkampanye selama berminggu-minggu, masyarakat di seluruh wilayah Perancis di Afrika bagian barat dipanggil ke tempat pemungutan suara untuk memutuskan apakah wilayah mereka harus menjadi bagian dari Uni Perancis yang baru. Hasil awal menunjukkan mayoritas yang sehat di pihak Uni. Perjuangan nasionalis tampaknya telah terhenti sejak awal, dengan banyaknya aktivis kemerdekaan yang kini bersiap untuk melanjutkan perjuangan demi penentuan nasib sendiri secara politik melalui Majelis Nasional."
 lar_france_french_union.5.t: "Afrika Barat memilih untuk keluar"
 lar_france_french_union.5.desc: "Setelah kampanye yang intens dan terkadang penuh gejolak, tampaknya pihak nasionalis telah memenangkan referendum keanggotaan Uni Perancis di sebagian besar wilayah Afrika Barat Perancis. Sementara masyarakat lokal di Eropa masih berusaha untuk mencerna hasil yang dicapai, para pemimpin gerakan kemerdekaan lokal telah menyerukan tindakan dan memproklamirkan hasil tersebut sebagai mandat yang jelas untuk kemerdekaan penuh."
 lar_france_french_union.6.t: "Afrika Tengah memilih untuk bergabung dengan Uni"
 lar_france_french_union.6.desc: "Dengan hasil yang diperoleh perlahan-lahan di wilayah yang luas dan kurang berkembang ini, nampaknya hanya sedikit pemilih yang menyetujui referendum untuk bergabung dengan Uni Perancis yang baru. Kelompok-kelompok nasionalis telah mengakui kekalahan, namun menuntut agar negara baru tersebut berinvestasi lebih banyak dalam mengembangkan wilayah tersebut sebagai penghargaan atas kesetiaan mereka."
 lar_france_french_union.7.t: "Afrika Tengah memilih untuk keluar"
 lar_france_french_union.7.desc: "Partai-partai pro-Uni di seluruh Afrika Tengah Perancis telah mengalami serangkaian kemunduran politik karena banyak wilayah yang memilih untuk tidak bergabung dengan Uni Perancis yang baru. Ketika partai-partai pro-kemerdekaan merayakan kemenangan demi kemenangan, banyak aktivis mengklaim bahwa dominasi Prancis atas wilayah tersebut telah dikalahkan secara telak."
 lar_france_french_union.8.t: "Suriah memilih untuk bergabung dengan Uni"
 lar_france_french_union.8.desc: "Mandat Perancis di Suriah dan Lebanon telah memilih untuk menjadi bagian dari Uni Perancis yang baru. Meskipun banyak pengamat menganggap hasil ini tidak mungkin terjadi, nampaknya masyarakat lokal percaya bahwa keanggotaan di Uni Perancis akan menjamin akses ke pasar Eropa dan lebih banyak investasi di perekonomian lokal."
 lar_france_french_union.9.t: "Suriah memberikan suara menentang Uni"
 lar_france_french_union.9.desc: "Pengumuman hasil referendum mengenai Uni Perancis baru-baru ini disambut dengan sorak-sorai yang meriah di Damaskus dan Beirut, karena terlihat jelas bahwa sebagian besar wilayah tersebut telah memilih untuk tidak bergabung dengan Uni Perancis yang baru. Ketika partai-partai nasionalis utama telah mendeklarasikan referendum tersebut sebagai pemungutan suara terselubung mengenai kemerdekaan, komandan militer setempat telah mengirimkan serangkaian laporan yang meresahkan ke ibu kota untuk menuntut penguatan."
 lar_france_french_union.10.t: "Indochina memilih untuk bergabung dengan Uni"
 lar_france_french_union.10.desc: "Laporan yang datang dari Indochina menunjukkan bahwa masyarakat Vietnam, Laos, dan Kamboja, dengan selisih terkecil, telah memilih untuk menjadi bagian dari Uni Perancis yang baru. Hal ini nampaknya bahkan mengejutkan para administrator lokal, karena mereka segera memerintahkan penghitungan ulang suara. Kelompok-kelompok nasionalis di kawasan ini mendapat pukulan telak karena moral mereka runtuh, dan banyak anggotanya yang secara terbuka bertanya-tanya apakah mereka benar-benar mewakili keinginan rakyat seperti yang mereka yakini."
 lar_france_french_union.11.t: "Indochina memberikan suara menentang Uni"
 lar_france_french_union.11.desc: "Hasil referendum yang datang dari Indochina memberikan gambaran yang lebih buruk dari perkiraan. Meskipun hanya sedikit orang di ibu kota yang percaya bahwa kelompok nasionalis akan memilih untuk bergabung dengan serikat pekerja, tampaknya sentimen nasionalis tersebar jauh lebih luas daripada yang diperkirakan sebelumnya. Dalam peristiwa tersebut, tidak ada bagian wilayah yang mendapatkan mayoritas untuk bergabung dengan serikat pekerja. Aktivis nasionalis sudah menyerukan pemisahan diri dari Perancis, bahkan dengan mengorbankan perang, karena mereka percaya bahwa inilah saat yang tepat untuk memperoleh kemerdekaan nasional."
 FRA_syria_intervention.1.t: "Sekutu mengamankan Suriah"
 FRA_syria_intervention.1.desc: "Dalam upacara yang tenang di Damaskus, komandan pasukan Vichy setempat telah secara resmi menyerahkan wilayah tersebut kepada Sekutu. Pertempuran telah berakhir di seluruh wilayah, dengan pasukan Vichy yang masih hidup ditawan. Sangat sedikit tentara Prancis yang terlibat yang menyatakan keinginannya untuk bergabung dengan pasukan Prancis Merdeka, dan sebagian besar dari mereka lebih memilih untuk dipulangkan."
 FRA_syria_intervention.1.a: "Bertarung dengan baik."
 FRA_syria_intervention.2.t: "Vichy menguasai Suriah"
 FRA_syria_intervention.2.desc: "Menyusul pertempuran sengit yang menghentikan kemajuan Sekutu di beberapa titik penting, komandan Sekutu setempat menyerukan penghentian operasi. Pasukan Sekutu sebagian besar telah mundur ke posisi awal mereka ketika pasukan Vichy mengkonsolidasikan posisi mereka. Pasukan Vichy belum melakukan pengejaran dan tampaknya puas dengan mempertahankan posisi mereka."
 FRA_syria_intervention.2.a: "Banyak orang baik yang mati sia-sia."
 FRA_syria_intervention.3.t: "Gencatan Senjata di Suriah"
 FRA_syria_intervention.3.desc: "Kemajuan sekutu ke Suriah terhenti dan pasukan Vichy berhasil mengkonsolidasikan garis pertahanan. Meskipun terdapat banyak serangan yang terkoordinasi dengan baik, pasukan sekutu di wilayah tersebut tidak mampu mengusir para pembela HAM. Kedua belah pihak telah melakukan upaya dan gencatan senjata telah disepakati, dengan Vichy masih memegang kendali atas seluruh wilayah terkait di wilayah tersebut."
 FRA_syria_intervention.3.a: "Status Quo tetap ada."
 FRA_indochina_intervention.1.t: "Sekutu mengamankan Indochina"
 FRA_indochina_intervention.1.desc: "Kolom penyerangan Sekutu telah mencapai beberapa kota besar di Indochina, sehingga mendorong gubernur setempat untuk meminta gencatan senjata. Karena para pembela HAM tersebar dan tidak terkoordinasi dengan baik, perlawanan lebih lanjut dianggap sia-sia. Para pembela HAM yang tersisa telah menyerahkan senjata mereka dan menunggu dipulangkan ke Vichy Prancis."
 FRA_indochina_intervention.1.a: "Sebuah keberhasilan yang penting."
 FRA_indochina_intervention.2.t: "Vichy menguasai Indochina"
 FRA_indochina_intervention.2.desc: "Setelah pertempuran sengit di medan yang sangat sulit, komandan sekutu di wilayah tersebut menghentikan operasi tersebut. Dengan situasi pasokan elemen depan yang semakin buruk dan perlawanan Vichy yang semakin kaku, pasukan sekutu memutuskan untuk mundur dan berkonsolidasi, meninggalkan Vichy yang menguasai wilayah tersebut."
 FRA_indochina_intervention.2.a: "Buang-buang waktu dan orang."
 FRA_indochina_intervention.3.t: "Gencatan Senjata di Indochina"
 FRA_indochina_intervention.3.desc: "Dengan terjadinya cuaca buruk dan persediaan yang menipis di kedua belah pihak, komandan pasukan sekutu dan Vichy di Indochina telah menyetujui gencatan senjata. Mengingat kesulitan besar yang dihadapi oleh sekutu yang menyerang, dan dengan hilangnya elemen kejutan, komando tinggi tidak berharap untuk dapat melanjutkan serangan setelah situasi membaik."
 FRA_indochina_intervention.3.a: "Banyak yang berani, sedikit yang didapat."
 FRA_central_africa_intervention.1.t: "Sekutu mengamankan Afrika Tengah"
 FRA_central_africa_intervention.1.desc: "Karena hanya menghadapi perlawanan moderat, unit-unit sekutu telah melakukan penetrasi jauh ke wilayah yang dikuasai Vichy di Afrika tengah. Meskipun ada perintah dari Vichy untuk bertahan selama mungkin, unit-unit Prancis di wilayah tersebut sebagian besar telah menghentikan perlawanan dan tidak lagi menentang kemajuan sekutu."
 FRA_central_africa_intervention.1.a: "Mereka tahu siapa musuh sebenarnya."
 FRA_central_africa_intervention.2.t: "Vichy menguasai Afrika Tengah"
 FRA_central_africa_intervention.2.desc: "Unit-unit Prancis di Afrika Tengah telah melakukan perlawanan kuat yang tak terduga, menyergap beberapa kolom penyerang sekutu dan menimbulkan banyak korban jiwa. Dihadapkan pada situasi yang membingungkan dan jelas-jelas meremehkan musuh, komandan sekutu setempat telah menarik pasukannya ke posisi awal dan menunggu perintah."
 FRA_central_africa_intervention.2.a: "Mengapa mereka menolak para pembebas mereka?"
 FRA_central_africa_intervention.3.t: "Gencatan Senjata di Afrika Tengah"
 FRA_central_africa_intervention.3.desc: "Pertempuran sengit di beberapa lokasi penting di Afrika Tengah telah membuat kedua belah pihak kelelahan dan tidak mampu melanjutkan operasi. Meskipun pasukan Prancis Vichy masih menguasai sebagian besar wilayah utama di wilayah tersebut, pasukan sekutu mampu memperoleh sedikit keuntungan di beberapa wilayah. Namun, situasi pasokan telah memburuk hingga tidak ada pihak yang mampu melancarkan serangan baru dalam waktu dekat."
 FRA_central_africa_intervention.3.a: "Kami tidak memperoleh apa pun."
 FRA_west_africa_intervention.1.t: "Sekutu mengamankan Afrika Barat"
 FRA_west_africa_intervention.1.desc: "Bergerak cepat melintasi medan terbuka, unit sekutu mampu mengepung sebagian besar pembela Prancis dan memaksa mereka menyerah. Karena tidak ada lagi cadangan yang tersisa untuk menghentikan kemajuan sekutu, gubernur setempat secara resmi telah menyerahkan wilayah tersebut."
 FRA_west_africa_intervention.1.a: "Bagian lain dunia kini bernafas lega."
 FRA_west_africa_intervention.2.t: "Vichy menguasai Afrika Barat"
 FRA_west_africa_intervention.2.desc: "Menyusul serangkaian serangan yang gagal dan pertempuran sengit, komandan sekutu setempat menyerukan penghentian operasi ofensif di daerah tersebut dan memerintahkan unit-unitnya yang terlindung untuk mundur ke medan yang lebih dapat dipertahankan. Pasukan Vichy telah berkonsolidasi di sekitar lokasi-lokasi penting dan menggali pertahanan, membuat serangan lebih lanjut tidak mungkin berhasil."
 FRA_west_africa_intervention.2.a: "Keberuntungan tidak berpihak pada mereka yang berani."
 FRA_west_africa_intervention.3.t: "Gencatan Senjata di Afrika Barat"
 FRA_west_africa_intervention.3.desc: "Sadar akan situasi pasokan yang genting dan kurangnya bala bantuan, Vichy dan pasukan sekutu telah melakukan serangkaian manuver jangka panjang dan manuver balasan untuk mencoba saling memancing agar melakukan pertempuran yang menentukan dengan syarat yang tidak menguntungkan. Karena sumber daya manusia dan material sudah habis, dan belum ada keputusan yang terlihat, kedua belah pihak telah melakukan upaya dan menunggu langkah pertama dari pihak lain."
 FRA_west_africa_intervention.3.a: "Buang-buang waktu saja."
 lar_compensate_italy.1.t: "Prancis menawarkan Kompensasi Kolonial"
 lar_compensate_italy.1.desc: "[From.GetLeader] telah tiba di Roma untuk membahas syarat-syarat perjanjian yang akan menyelesaikan beberapa masalah yang belum terselesaikan antara negara kita. Memperhatikan persaudaraan yang telah lama terjalin antara kedua negara kita, yang diabadikan oleh pengorbanan bersama dalam Perang Besar, beliau menawarkan untuk menyerahkan pelabuhan Djibouti di Perancis ke dalam kendali kita dengan imbalan jaminan bahwa kita akan datang membantu Perancis pada saat perang."
 lar_compensate_italy.1.a: "Dia akan memiliki aliansinya."
 lar_compensate_italy.1.b: "Kita tidak mudah dibeli."
 lar_compensate_italy.2.t: "[From.GetLeader] Setuju"
 lar_compensate_italy.2.desc: "[This.GetLeader] telah kembali dari Italia dengan penuh kemenangan karena [From.GetLeader] telah setuju untuk menandatangani perjanjian yang diusulkan. Yang tersisa sekarang hanyalah secara resmi menyerahkan harta benda kami di Afrika Timur ke Italia."
 lar_compensate_italy.2.a: "Harga kecil yang harus dibayar."
 lar_compensate_italy.3.t: "[From.GetLeader] menolak"
 lar_compensate_italy.3.desc: "Meskipun pada awalnya berhasil, negosiasi dengan Italia gagal dengan cepat ketika menjadi jelas bahwa [From.GetLeader] mengharapkan konsesi yang lebih luas jangkauannya dibandingkan dengan usulan penyerahan Djibouti."
 lar_compensate_italy.3.a: "Kemana kita pergi setelah ini?"
 lar_intervention_in_greece.1.t: "Perancis mengusulkan Intervensi di Yunani"
 lar_intervention_in_greece.1.desc: "Duta Besar Perancis telah menyerahkan catatan dari pemerintahannya, menunjukkan kepentingan bersama kita di Mediterania Timur. Pemerintah [From.GetLeader] tampaknya sangat tertarik untuk mengakuisisi pulau Kreta sebagai pangkalan angkatan laut, namun juga mencatat bahwa keberadaan pemerintahan yang 'tidak bersahabat atau bermusuhan' di Yunani akan membuat operasi di wilayah tersebut jauh lebih sulit. Oleh karena itu, pemerintah [From.GetAdjective] ingin mengajak kita untuk melakukan intervensi bersama di Yunani guna membentuk pemerintahan yang lebih menguntungkan atau mengambil alih administrasi wilayah tersebut sendiri."
 lar_intervention_in_greece.1.a: "Para pemikir hebat berpikiran sama!"
 lar_intervention_in_greece.1.b: "Kami akan memutuskan strategi kami sendiri."
 lar_intervention_in_greece.2.t: "[From.GetLeader] Setuju"
 lar_intervention_in_greece.2.desc: "[From.GetLeader] telah mengirimkan kembali pesan melalui duta besar kami di Roma, menyatakan dukungan terdalamnya dan menyatakan persetujuan mutlak atas pandangan kami. Militer [From.GetAdjective] telah diinstruksikan untuk mempersiapkan rencana aksi militer gabungan melawan Yunani, jika diperlukan."
 lar_intervention_in_greece.2.a: "Kebutuhan tersebut hampir pasti akan muncul."
 lar_intervention_in_greece.3.t: "[From.GetLeader] menolak"
 lar_intervention_in_greece.3.desc: "Menurut catatan singkat dari duta besar [From.GetAdjective], pemerintahnya saat ini tidak tertarik untuk mengubah status quo di Mediterania Timur, dan lebih memilih situasi saat ini di sana daripada ketidakpastian yang mungkin ditimbulkan oleh tindakan militer."
 lar_intervention_in_greece.3.a: "Itu adalah suara ketakutan."
 lar_dominate_the_middle_east.1.t: "Perancis menuntut Subjugasi"
 lar_dominate_the_middle_east.1.desc: "Pemerintah [From.GetLeader] telah menunjuk penguasa penuh baru untuk Timur Tengah. Bertemu dengan [This.GetLeader] di ibu kota kita hari ini, perwakilan Perancis menyatakan bahwa pemerintah Perancis ingin mengambil peran yang lebih aktif di kawasan dan mengharapkan untuk diajak berkonsultasi secara langsung dalam segala hal mengenai stabilitas di kawasan.\n\nMeskipun ia membiarkan konsekuensi dari penyangkalan ini, ia mencatat bahwa pemerintah Perancis akan merasa 'sulit' untuk menerima kebijakan luar negeri yang independen dari pemerintah kami."
 lar_dominate_the_middle_east.1.a: "Kita harus menerima kenyataan baru ini."
 lar_dominate_the_middle_east.1.b: "Kami telah mendapatkan kebebasan kami, dan kami tidak akan melepaskannya jika itu begitu saja!"
 lar_dominate_the_middle_east.2.t: "[From.GetNameDefCap] dikirimkan"
 lar_dominate_the_middle_east.2.desc: "Setelah berdebat dengan para penasihatnya, [From.GetLeader] telah secara resmi menerima permintaan kami dan mengizinkan perwakilan kami untuk berkonsultasi mengenai keputusan kebijakan luar negeri apa pun untuk memastikan bahwa keputusan tersebut sesuai dengan keinginan kami."
 lar_dominate_the_middle_east.2.a: "Dia juga harus melakukannya."
 lar_dominate_the_middle_east.3.t: "[From.GetNameDefCap] menantang"
 lar_dominate_the_middle_east.3.desc: "Dalam pidato panjang lebar di depan perwakilan kami, [From.GetLeader] memuji tradisi pejuang yang panjang dan membanggakan dari masyarakat [From.GetAdjective], menjelaskan bahwa mereka tidak pernah tunduk pada penguasa asing mana pun, akan menolak segala upaya untuk memaksa mereka dan lebih memilih mati berdiri daripada berlutut."
 lar_dominate_the_middle_east.3.a: "Kalau begitu, kematian sudah di depan mata mereka."
 lar_dominate_the_middle_east.3.b: "Itu hanyalah kotoran yang tidak berguna, penuh dengan orang-orang yang tidak berguna."
 lar_spheres_of_influence.1.t: "Perancis ingin mendiskusikan lingkup pengaruhnya"
 lar_spheres_of_influence.1.desc: "[From.GetLeader] telah tiba di Berlin untuk bertemu [This.GetLeader] dalam upaya menghilangkan penyebab ketegangan yang masih ada di antara kedua negara. Salah satu isu yang dibahas adalah restrukturisasi Eropa Tengah. [From.GetLeader] telah memperjelas bahwa dia menganggap [BEL.GetNameDef], dengan populasi berbahasa Perancis, sebagai kepentingan utama negaranya.\n\nPemerintahannya jauh lebih fleksibel ketika menyangkut nasib [HOL.GetNameDef] dan [LUX.GetNameDef], dan mengusulkan sebuah nota kesepahaman bahwa dua negara terakhir harus dianggap berada dalam lingkup pengaruh kita sementara yang pertama berada dalam lingkup pengaruh Perancis."
 lar_spheres_of_influence.1.a: "Saran yang masuk akal"
 lar_spheres_of_influence.1.b: "Untuk mempunyai wilayah, pertama-tama kita harus mempunyai pengaruh, Perancis"
 lar_spheres_of_influence.2.t: "[From.GetNameDefCap] setuju"
 lar_spheres_of_influence.2.desc: "Negosiasi dengan [From.GetLeader] hanya memakan waktu beberapa menit, dan kedua pemimpin dengan cepat mencapai kesepakatan sesuai dengan usulan kami. Satu-satunya hal yang menjadi perdebatan adalah komunitas kecil berbahasa Jerman di Belgia, sebuah masalah yang telah diserahkan kepada dinas diplomatik untuk diselesaikan."
 lar_spheres_of_influence.2.a: "Keberhasilan lain untuk strategi diplomatik kami."
 lar_spheres_of_influence.3.t: "[From.GetLeader] menolak"
 lar_spheres_of_influence.3.desc: "Dalam pertemuan yang dilaporkan sangat menegangkan antara [From.GetLeader] dan [This.GetLeader], harapan untuk meredakan ketegangan antar negara hilang dalam hitungan menit. Delegasi Jerman tidak mau bergeming dari pendirian mereka, menyatakan bahwa Belgia, sebagai negara dengan minoritas Jerman yang cukup besar, merupakan kepentingan alami [From.GetNameDef] dan gagasan bahwa kita harus diberi kebebasan dalam menanganinya sama sekali tidak dapat diterima."
 lar_spheres_of_influence.3.a: "Sepertinya kita membuang-buang waktu."
 lar_align_belgium.1.t: "Prancis menuntut hak khusus"
 lar_align_belgium.1.desc: "Menyusul serangkaian insiden di mana beberapa warga negara kami yang berbahasa Perancis diserang di jalanan oleh preman bertopeng, duta besar Perancis hari ini memanggil [This.GetLeader] dan memberikan catatan dari pemerintahnya, yang menyatakan bahwa karena kami jelas tidak mampu melindungi komunitas Perancis di perbatasan kami, pemerintah Perancis menganggap itu tugas mereka untuk melakukannya untuk kami. Untuk tujuan ini, mereka menuntut agar diberikan serangkaian hak, termasuk hak untuk menempatkan pasukan di negara kita dan meminta Gendarmerie Perancis melakukan penyelidikan di dalam perbatasan kita.\n\nPenolakan untuk memberikan hak-hak ini, menurut catatan tersebut, akan dianggap sebagai tindakan permusuhan yang akan menimbulkan konsekuensi paling buruk."
 lar_align_belgium.1.a: "Kami tidak punya pilihan selain setuju."
 lar_align_belgium.1.b: "Kami tidak sujud pada tahun 1914 dan kami tidak akan sujud sekarang!"
 lar_align_belgium.2.t: "[From.GetNameDefCap] dikirimkan"
 lar_align_belgium.2.desc: "Kabinet [From.GetAdjective] telah memberikan suara bulat untuk menerima proposal kami, meskipun beberapa anggota mengundurkan diri daripada memilihnya. Unit penghubung militer dan sekelompok kecil pegawai negeri telah berangkat ke Brussel untuk berkoordinasi dengan pihak berwenang [From.GetAdjective]."
 lar_align_belgium.2.a: "Mereka memilih dengan bijak."
 lar_align_belgium.3.t: "[From.GetNameDefCap] bersumpah untuk bertarung"
 lar_align_belgium.3.desc: "Daripada menanggapi catatan kami secara diplomatis, tampaknya pemerintah [From.GetAdjective] telah memerintahkan militer untuk bersiap sepenuhnya dan menutup perbatasan. Surat kabar di Brussel, meskipun realistis mengenai prospek kemenangan, penuh dengan referensi tentang Pertempuran Waterloo dan meramalkan kekalahan yang memalukan bagi pasukan Prancis jika kita harus menyerang."
 lar_align_belgium.3.a: "Kita akan lihat mengenai hal itu."
 lar_align_belgium.3.b: "Belgia tidak bernilai satu peluru atau setetes darah pun."
 lar_split_belgium.1.t: "[From.GetLeader] menuntut Wallonia"
 lar_split_belgium.1.desc: "Selama beberapa minggu terakhir, sejumlah kelompok yang mengaku mewakili populasi berbahasa Perancis di negara kita bermunculan dan mulai melakukan agitasi untuk 'penyatuan kembali' Wallonia dengan Perancis. Hari ini, duta besar Perancis telah menyerahkan sebuah catatan yang menyatakan bahwa pemerintah [From.GetLeader] telah membuat kebijakan resmi mereka untuk memasukkan wilayah berbahasa Perancis di negara kita ke dalam wilayah mereka.\n\nLaporan tentang pasukan yang berkumpul di perbatasan menunjukkan bahwa mereka bersedia untuk menegakkan kebijakan baru ini dengan cara apa pun yang diperlukan."
 lar_split_belgium.1.a: "Tidak ada yang bisa diperoleh dengan melawan hal-hal yang tidak bisa dihindari."
 lar_split_belgium.1.b: "Ini adalah negara kami dan kami akan berjuang untuk setiap jengkal wilayah."
 lar_split_belgium.2.t: "Belgia menyetujui Pembagian"
 lar_split_belgium.2.desc: "Pemerintah Belgia telah setuju untuk mengadakan serangkaian referendum tentang penyatuan dengan Perancis di bagian Belgia yang berbahasa Perancis di bawah pengawasan kami. Ketika partai-partai pro-Belgia menyerukan boikot, kemenangan kita sudah pasti."
 lar_split_belgium.2.a: "Demokrasi adalah hal yang sangat indah."
 lar_split_belgium.3.t: "Belgia menantang"
 lar_split_belgium.3.desc: "Pemerintah [From.GetAdjective] telah menanggapi setiap dan semua pembicaraan tentang penyatuan antara Wallonia dan Perancis dengan tindakan keras, menggerebek kantor kelompok pro-unifikasi dan menangkap para pemimpin mereka. Ketika duta besar kami mengajukan protes resmi, dia dengan kasar diberitahu bahwa pemerintah [From.GetAdjective] bertanggung jawab menjaga ketertiban di dalam negeri, dan oleh karena itu tidak akan diceramahi oleh agen luar."
 lar_split_belgium.3.a: "Kami akan mengajari mereka rasa hormat!"
 lar_split_belgium.3.b: "Ini tidak sepadan dengan usaha yang dilakukan."
 lar_concessions_to_italy.1.t: "Perancis mengusulkan Kompensasi teritorial kepada Italia"
 lar_concessions_to_italy.1.desc: "Pemerintah [From.GetLeader] telah menyuarakan upaya kami untuk mempengaruhi Italia agar memihak kami dan mencegah kemungkinan aliansi antara Jerman dan Italia. [ITA.GetLeader] kemungkinan besar harus dibeli melalui semacam konsesi atau kompensasi. Melihat kepemilikan kami di Afrika Timur, [From.GetAdjective] mengusulkan untuk menyerahkan Djibouti dan Somaliland ke Italia sebagai imbalan atas aliansi formal yang bertujuan untuk membendung Jerman."
 lar_concessions_to_italy.1.a: "Kita bisa meredam apa yang disebut Axis di dalam buaian!"
 lar_concessions_to_italy.1.b: "[ITA.GetLeader] tidak pernah bisa dipercaya untuk menepati janji."
 lar_concessions_to_italy.2.t: "[From.GetLeader] setuju"
 lar_concessions_to_italy.2.desc: "Kabinet [From.GetAdjective] mendapat suara tipis untuk menyetujui proposal kami. Meskipun masih ada keraguan besar di kalangan diplomat mengenai dampak bersekutu dengan [ITA.GetLeader], kini kita dapat bergerak maju dan menyampaikan proposal bersama kita kepada [ITA.GetAdjective]."
 lar_concessions_to_italy.2.a: "Kirim pesannya."
 lar_concessions_to_italy.3.t: "[From.GetLeader] menolak"
 lar_concessions_to_italy.3.desc: "Proposal kami gagal mendapatkan dukungan apa pun di kabinet [From.GetAdjective]. Meskipun terdapat konsensus bahwa aliansi dengan [ITA.GetNameDef] akan bermanfaat, pemerintah [From.GetAdjective] tidak dapat menerima gagasan konsesi teritorial untuk mencapai hal ini."
 lar_concessions_to_italy.3.a: "Kita harus menyelesaikan kasus kita sendiri."
 lar_concessions_to_italy.4.t: "Inggris dan Perancis menawarkan perjanjian kolonial"
 lar_concessions_to_italy.4.desc: "Duta besar [ENG.GetNameDef] dan [FRA.GetNameDef] telah bertemu dengan [This.GetLeader] untuk membahas upaya baru untuk meratifikasi perjanjian yang dibuat di Stresa. Sebagai bagian dari serangan diplomatik terbaru mereka, mereka kini menawarkan konsesi teritorial di Afrika Timur, menyerahkan Djibouti dan Somalia bagian Inggris.\n\nPengalihan wilayah sebenarnya akan terkait dengan ratifikasi perjanjian aliansi."
 lar_concessions_to_italy.4.a: "Apa pun untuk perbatasan yang cantik"
 lar_concessions_to_italy.4.b: "Kita tidak bisa dibeli!"
 lar_concessions_to_italy.5.t: "Prancis menawarkan konsesi kolonial"
 lar_concessions_to_italy.5.desc: "Duta Besar [From.GetAdjective] telah menyerahkan surat dari pemerintahannya. Tampaknya [From.GetLeader] ingin secara resmi meratifikasi perjanjian awal yang dicapai di Stresa. Untuk mempermanis kesepakatan tersebut, [From.GetAdjective] menawarkan kepada kita wilayah Prancis di Afrika Timur jika kita setuju.\n\nRumor beredar di kalangan diplomatik bahwa [From.GetAdjective] sebelumnya telah mendekati [ENG.GetAdjective] untuk mengeluarkan deklarasi bersama dengan konsesi teritorial yang lebih besar, namun ditolak."
 lar_concessions_to_italy.5.a: "Kedengarannya masuk akal."
 lar_concessions_to_italy.5.b: "Itu berarti menawarkan terlalu sedikit dan meminta terlalu banyak."
 lar_concessions_to_italy.6.t: "[ITA.GetLeader] setuju"
 lar_concessions_to_italy.6.desc: "Pemerintah [From.GetAdjective] pada prinsipnya telah menyetujui usulan pertukaran wilayah kami dan berjanji untuk meratifikasi perjanjian Stresa setelah ketentuan akhir perjanjian telah disepakati. Perundingan yang lebih rinci diserahkan kepada dinas diplomatik, dan perjanjian akhir akan diratifikasi di kemudian hari. Pengalihan wilayah tidak akan terjadi sampai perjanjian ini ditandatangani."
 lar_concessions_to_italy.6.a: "Kita harus menyelesaikan ini."
 lar_concessions_to_italy.7.t: "[ITA.GetLeader] menolak"
 lar_concessions_to_italy.7.desc: "Dalam jawaban singkat atas catatan kami, pemerintah [From.GetAdjective] mencatat bahwa saat ini mereka tidak tertarik untuk membentuk aliansi atau meratifikasi perjanjian Stresa. Mereka mengklaim, tidak ada konsesi teritorial yang dapat mengubah hal tersebut."
 lar_concessions_to_italy.7.a: "Ini membuat kita sedikit bingung."
 lar_ratify_the_stresa_front.1.t: "Ratifikasi Front Stresa"
 lar_ratify_the_stresa_front.1.desc: "Persiapan sedang dilakukan untuk penandatanganan dan ratifikasi Perjanjian Stresa, meresmikan aliansi dengan Perancis dengan imbalan konsesi teritorial. Setelah berbulan-bulan bekerja di dinas diplomatik, satu-satunya yang tersisa hanyalah menuliskan tinta di atas kertas."
 lar_ratify_the_stresa_front.1.a: "Kemenangan diplomasi [This.GetAdjective]."
 lar_ratify_the_stresa_front.1.b: "Ini tidak lagi sesuai dengan kepentingan kami."
 lar_ratify_the_stresa_front.2.desc: "Waktunya telah tiba untuk memenuhi janji yang kami buat kepada pemerintah [From.GetAdjective]. Dengan berlakunya Aliansi, kita berkewajiban untuk mengalihkan Djibouti ke dalam kendali mereka."
 lar_ratify_the_stresa_front.2.a: "Prancis menepati janjinya."
 lar_ratify_the_stresa_front.2.b: "Situasinya telah berubah."
 lar_ratify_the_stresa_front.3.t: "[From.GetNameDefCap] menolak meratifikasi Aliansi"
 lar_ratify_the_stresa_front.3.desc: "Tiba-tiba terjadi perubahan, pemerintah [From.GetAdjective] memutuskan untuk tidak lagi menepati komitmen mereka sebelumnya untuk meratifikasi Perjanjian Stresa. Semua upaya untuk mendapatkan penjelasan melalui saluran diplomatik telah gagal, dan para diplomat [From.GetAdjective] tampak sama terkejutnya dengan perubahan hati yang tiba-tiba tersebut."
 lar_ratify_the_stresa_front.3.a: "Hari yang gelap."
 lar_ratify_the_stresa_front.4.desc: "[FRA.GetNameDefCap] dan [ITA.GetNameDef] telah menandatangani Perjanjian Stresa dan meresmikan aliansi mereka. Sekarang giliran kami untuk mempertahankan kesepakatan kami, menandatangani Perjanjian dan mengalihkan kepemilikan kami di Somalia ke kendali [ITA.GetAdjective]."
 lar_ratify_the_stresa_front.4.a: "Kami berjanji."
 lar_ratify_the_stresa_front.4.b: "Kepentingan kami berbeda."
 lar_franco_soviet_treaty.1.t: "Perancis mengusulkan Perjanjian Saling Membantu"
 lar_franco_soviet_treaty.1.desc: "Pemerintah [From.GetLeader] telah mengirimkan utusan khusus ke Moskow untuk membahas kemungkinan aliansi. Berdasarkan proposal [From.GetAdjective], kami berjanji untuk ikut serta dalam perang defensif apa pun yang dialami [From.GetNameDef], dan [From.GetNameDef] akan membantu kami jika kami diserang."
 lar_franco_soviet_treaty.1.a: "Semangat tahun 1894 tetap hidup!"
 lar_franco_soviet_treaty.1.b: "Tak satu pun dari kami dapat membantu satu sama lain secara efektif."
 lar_franco_soviet_treaty.2.t: "[From.GetNameDefCap] setuju"
 lar_franco_soviet_treaty.2.desc: "Pemerintah [From.GetAdjective] telah menyetujui usulan kami, namun menekankan bahwa mereka tidak akan pernah menerima perang sebagai upaya untuk mengubah lanskap politik Eropa secara signifikan. Oleh karena itu, aliansi kita akan bersifat defensif, dengan masing-masing pihak berkomitmen untuk membantu pihak lain hanya jika mereka diserang oleh kekuatan ketiga."
 lar_franco_soviet_treaty.2.a: "Itu sudah cukup."
 lar_franco_soviet_treaty.3.t: "[From.GetNameDefCap] menolak"
 lar_franco_soviet_treaty.3.desc: "Dalam pertemuan dingin dengan menteri luar negeri [From.GetAdjective], duta besar kami diberitahu bahwa [From.GetAdjective] tidak berkepentingan untuk membentuk aliansi dengan kami. Realitas geografis Eropa, katanya, membuat pasukan [From.GetAdjective] tidak mungkin secara efektif mendukung kami dalam serangan apa pun terhadap wilayah kami, dan sebaliknya, dan oleh karena itu pemerintah [From.GetAdjective] harus menolak tawaran tersebut."
 lar_franco_soviet_treaty.3.a: "Tidak mungkin atau hanya merepotkan?"
 lar_end_the_occupation.1.t: "Berakhirnya Pendudukan"
 lar_end_the_occupation.1.desc: "Setelah beberapa tahun, pemerintah [From.GetLeader] secara resmi menyatakan program 'Revolusi Nasional' mereka berhasil. Kelemahan dan dekadensi sistem politik Prancis yang lama, klaimnya dalam pidato radio, telah dilenyapkan, dan digantikan oleh sistem pemerintahan baru yang telah diregenerasi dan lebih cocok untuk negara yang mulia dan suka berperang seperti Prancis.\n\nSebagai bagian dari upaya ini, pemerintahnya telah secara resmi meminta agar kewajiban dan pembatasan yang diberlakukan terhadap sistem tersebut oleh Gencatan Senjata dicabut dan agar pemerintahannya ditempatkan dalam kendali penuh atas seluruh wilayah Prancis. wilayah.\n\nSebagai imbalannya, dia menawarkan untuk bergabung kembali dalam perang guna menghukum mereka yang menjerumuskan kedua negara kita ke dalam perang berdarah kedua dalam satu generasi."
 lar_end_the_occupation.1.a: "Kami menyambut mereka dengan tangan terbuka!"
 lar_end_the_occupation.1.b: "Dia sepertinya punya ide jauh di atas posisinya."
 lar_end_the_occupation.2.t: "Pendudukan berakhir"
 lar_end_the_occupation.2.desc: "Menyusul penandatanganan Pakta Baja oleh [This.GetLeader], pasukan Jerman di seluruh negeri telah menyerahkan kendali kepada pasukan Prancis. Setelah upacara yang dihadiri oleh [From.GetLeader] dan [This.GetLeader], garnisun Jerman di Paris menurunkan bendera [From.GetAdjective] dan berbaris keluar kota, meninggalkannya di bawah Tricolore untuk pertama kalinya dalam beberapa tahun."
 lar_end_the_occupation.2.a: "Kami telah mendapatkan kembali kehormatan kami."
 lar_end_the_occupation.3.t: "[From.GetLeader] menolak"
 lar_end_the_occupation.3.desc: "Meskipun ada tawaran yang murah hati untuk berdiri berdampingan melawan ancaman Bolshevist dan mengejar para penggiat perang yang memulai perang ini, [From.GetLeader] dengan kasar menolak kemajuan diplomasi kita. Rakyat Prancis, katanya, telah gagal menunjukkan kecakapan bela diri apa pun dalam perang sejauh ini dan dia tidak melihat alasan untuk mempercayakan pertahanan perbatasan barat [From.GetNameDef] kepada negara yang sudah pernah dikalahkan."
 lar_end_the_occupation.3.a: "Waktunya telah tiba untuk bergabung dengan [FRA.GetLeader]!"
 lar_end_the_occupation.3.b: "Kami akan menjawab penghinaan ini dengan baja dan api!"
 lar_end_the_occupation.4.t: "Tawaran dari Vichy"
 lar_end_the_occupation.4.desc: "Secara mengejutkan, perwakilan [From.GetLeader] telah mendekati kami dengan tawaran untuk bergabung. Setelah dengan hati-hati membangun kembali militer di bawah kerahasiaan yang sangat ketat, [From.GetLeader] yakin sudah waktunya untuk bergabung kembali dalam perang dan membebaskan tanah air.\n\nNamun, sumber kami di dalam pemerintahannya menunjukkan fakta bahwa upaya sebelumnya untuk menegosiasikan pengembalian wilayah Prancis yang diduduki telah gagal sebagai motivasi sebenarnya di balik langkah terbaru ini."
 lar_end_the_occupation.4.a: "Akhirnya, mereka melihat alasannya."
 lar_end_the_occupation.4.b: "Mengapa kita harus membantu para pengecut dan pengkhianat?"
 lar_end_the_occupation.5.t: "[From.GetLeader] setuju"
 lar_end_the_occupation.5.desc: "Delegasi kami ke [From.GetLeader] telah kembali dengan sukses - ditemani oleh pria itu sendiri. Menginjakkan kaki di tanah Prancis untuk pertama kalinya dalam beberapa tahun, [From.GetLeader] telah bertemu dengan [This.GetLeader] untuk membahas secara spesifik transfer kekuasaan."
 lar_end_the_occupation.5.a: "Bagus."
 lar_end_the_occupation.6.t: "[From.GetLeader] menolak"
 lar_end_the_occupation.6.desc: "Setelah ceramah panjang lebar tentang berbagai kegagalan [This.GetLeader] sebagai manusia, patriot, prajurit dan warga negara, delegasi kami ke [From.GetLeader] dipulangkan dengan tangan kosong. Dalam pesan radio pada hari itu juga, [From.GetLeader] secara terbuka mengecam pemerintah kami sebagai 'kumpulan pengecut dan pengkhianat terbesar dalam sejarah Perancis'.\n\nJika kami ingin mendapatkan kembali tanah air kami dan membebaskannya dari Jerman, kami harus melakukannya tanpa bantuan mereka."
 lar_end_the_occupation.6.a: "Patriot sejati mana yang menampik tangan sesama orang Prancis seperti ini?"
 lar_low_stability_civil_war.1.t: "Pemberontakan Komunis!"
 lar_low_stability_civil_war.1.desc: "Setelah berminggu-minggu agitasi dan persiapan rahasia, pemogokan massal terjadi di beberapa kota di Perancis. Hampir seketika, kelompok bersenjata yang disebut 'Brigade Pertahanan Pekerja' telah terbentuk, dalam beberapa kasus didukung oleh unit-unit tentara yang memberontak. Pasukan yang setia kepada pemerintah ditembaki dalam berbagai kesempatan di seluruh negeri, dan pertikaian antara pemberontak dan loyalis berubah menjadi baku tembak.\n\nDengan semakin menurunnya ketertiban internal, pemerintah secara efektif kehilangan kendali atas sebagian besar wilayah negara."
 lar_low_stability_civil_war.1.a: "Revolusi Perancis yang lain?"
 lar_low_stability_civil_war.2.t: "Pemberontakan Reaksioner!"
 lar_low_stability_civil_war.2.desc: "Komplotan rahasia yang terdiri dari para perwira militer reaksioner dan pemilik tanah yang kaya raya ternyata telah mempersiapkan kudeta militer terhadap pemerintah. Meskipun identitas beberapa di antara mereka diketahui polisi, namun ada pula yang belum teridentifikasi. Menyusul kebocoran dari dalam penyelidikan, para konspirator memutuskan untuk bertindak sebelum seluruh konspirasi terungkap.\n\nSifat kudeta yang tergesa-gesa dan membingungkan menyebabkan kudeta gagal mencapai kejutan yang diinginkan, dengan unit-unit tidak berada di posisi dan garnisun lokal telah diperingatkan sebelumnya. Pasukan loyalis bertindak cepat dan berhasil mencegah serangan pemenggalan kepala terhadap pemerintah kami, namun terpaksa meninggalkan sebagian besar negara untuk melakukan hal tersebut. Dengan terjadinya Pemberontakan, nampaknya negara ini telah terjerumus ke dalam perang saudara skala penuh."
 lar_low_stability_civil_war.2.a: "Kami semua tahu ini akan terjadi."
 lar_worker_shortage.1.t: "Kekurangan pekerja semakin parah"
 lar_worker_shortage.1.desc: "Menyusul perpanjangan rancangan undang-undang dan pemanggilan pekerja yang sebelumnya dikecualikan, banyak perusahaan melaporkan adanya masalah dalam pengisian lowongan. Bahkan industri persenjataan pun terkena dampak dari kekurangan pekerja ini, dan hasil produksi mulai menurun sebagai dampaknya.\n\nPakar industri mendesak pemerintah untuk mencari sumber tenaga kerja baru, baik untuk membebaskan laki-laki yang saat ini bertugas di militer atau untuk menggantikan pekerja yang wajib militer."
 lar_worker_shortage.1.a: "Mungkin mereka bisa mempekerjakan perempuan saja?"
 lar_worker_shortage.2.t: "Tentara kembali ke meja kerja"
 lar_worker_shortage.2.desc: "Terhadap protes tegas dari pihak militer, pengurangan wajib militer dan penerapan kembali pengecualian wajib militer bagi pekerja terampil telah meringankan kekurangan pekerja. Statistik menunjukkan peningkatan produktivitas yang nyata, kembali dengan cepat ke tingkat sebelum perpanjangan rancangan undang-undang tersebut."
 lar_worker_shortage.2.a: "Kualitas, bukan kuantitas!"
 lar_arms_purchases.1.t: "[From.GetNameDefCap] ingin membeli senjata"
 lar_arms_purchases.1.desc: "Mengingat situasi yang memburuk dengan cepat di Eropa, para pejabat Perancis telah menghubungi kami untuk memperoleh izin ekspor senjata berat dan pesawat modern, dan pesanan akan ditempatkan di pabrik kami segera setelah izin ini diberikan. Meskipun volume pesanan secara keseluruhan terlalu rendah untuk membuat perbedaan besar dalam perekonomian, hal ini masih akan menciptakan cukup banyak lapangan kerja."
 lar_arms_purchases.1.a: "Tentu saja!"
 lar_arms_purchases.1.b: "Sama sekali tidak!"
 lar_arms_purchases.2.t: "[From.GetNameDefCap] setuju"
 lar_arms_purchases.2.desc: "Dengan dukungan Presiden [From.GetLeader], Senat AS telah mengesahkan rancangan undang-undang yang memungkinkan kita memesan senjata di pabrik-pabrik AS, namun sangat membatasi pilihan pembiayaan. Ketika faksi isolasionis di AS masih yakin bahwa besarnya hutang yang kami miliki selama Perang Besarlah yang menyebabkan deklarasi AS terhadap Jerman, mereka nampaknya sangat ingin memastikan bahwa kami membayar senjata-senjata ini dengan mata uang keras."
 lar_arms_purchases.2.a: "Jika itu yang diperlukan."
 lar_arms_purchases.3.t: "[From.GetNameDefCap] menolak"
 lar_arms_purchases.3.desc: "Meskipun ada lobi yang luas dan dukungan dari beberapa senator intervensionis, upaya kami untuk mendapatkan izin ekspor peralatan militer dari AS telah gagal. Lobi isolasionis di Kongres berhasil menghalangi segala upaya untuk memasukkan masalah ini ke dalam agenda, karena khawatir bahwa penjualan senjata akan menjadi langkah pertama menuju intervensi besar-besaran."
 lar_arms_purchases.3.a: "Saraf!"
 lar_france_volunteers.1.t: "Relawan dari [From.GetNameDef]"
 lar_france_volunteers.1.desc: "Dengan keputusan pemerintah [From.GetLeader] untuk melonggarkan kontrol perbatasan antara Spanyol dan [From.GetNameDef], gelombang sukarelawan mulai berdatangan untuk berperang di pihak kita.\n\nSayangnya, kebijakan baru ini berlaku secara universal, artinya faksi-faksi lain yang terlibat dalam perang kemungkinan akan mendapat dukungan tambahan juga."
 lar_france_volunteers.1.a: "Hebat?"
 lar_france_volunteers.3.t: "Relawan kembali"
 lar_france_volunteers.3.desc: "Dengan berakhirnya pertempuran di Spanyol, beberapa orang yang berperang untuk [From.GetLeader] telah kembali. Intelijen militer ingin mewawancarai mereka untuk mengetahui apakah pengalaman mereka dapat memberikan gambaran mengenai peperangan modern, namun banyak orang di pemerintahan khawatir bahwa mereka akan meradikalisasi kelompok politik lain."
 lar_france_volunteers.3.a: "Biarkan mereka kembali."
 lar_france_volunteers.3.b: "Kirim mereka kembali."
 lar_non_intervention.1.t: "[From.GetNameDefCap] mengundang kami ke Komite Non-Intervensi"
 lar_non_intervention.1.desc: "[From.GetLeader] secara resmi menyerukan pembentukan komite Non-Intervensi yang seharusnya memastikan tidak ada intervensi pihak luar dalam perang yang sedang berlangsung di Spanyol. Namun, rancangan proposal yang diedarkan bersama pesan tersebut secara praktis tidak mengandung metode tegas untuk menegakkan non-intervensi.\n\nBahkan jika kita setuju untuk tidak melakukan intervensi, banyak celah yang memastikan bahwa kita masih dapat mempengaruhi perang di Spanyol jika kita memilihnya. Satu-satunya dampak yang nyata adalah sedikit peningkatan terhadap dukungan rakyat terhadap pemerintah [From.GetLeader]."
 lar_non_intervention.1.a: "Persyaratan ini dapat diterima."
 lar_non_intervention.1.b: "Ini adalah tugas bodoh dan kami tidak akan ambil bagian di dalamnya!"
 lar_non_intervention.2.t: "[From.GetNameDefCap] bergabung dengan Komite Non-Intervensi"
 lar_non_intervention.2.desc: "Menyebutnya sebagai langkah penting dalam mengakhiri kekerasan di Spanyol, [From.GetnameDef] telah secara resmi menandatangani kontrak dengan Komite Non-Intervensi. Apakah mereka benar-benar mematuhi persyaratannya atau tidak, masih harus dilihat."
 lar_non_intervention.2.a: "Kita tidak punya alasan untuk meragukannya, bukan?"
 lar_non_intervention.3.t: "[From.GetNameDefCap] menolak bergabung dengan Komite Non-Intervensi"
 lar_non_intervention.3.desc: "Dengan alasan kurangnya mekanisme penegakan hukum yang kuat, [From.GetNameDef] secara resmi menolak tawaran kami untuk bergabung dengan Komite Non-Intervensi. Apakah ini berarti [From.GetLeader] ingin melakukan intervensi langsung di Spanyol masih belum jelas."
 lar_non_intervention.3.a: "Hanya waktu yang akan menjawabnya."
 lar_appeal_to_overseas_territories.2.t: "Indochina tetap berada di bawah Vichy"
 lar_appeal_to_overseas_territories.2.desc: "Gubernur setempat Indochina secara resmi dan terbuka menolak untuk mempertimbangkan berpindah pihak untuk mendukung pemerintah kita. Dalam pidato radio di koloni tersebut, ia juga mengumumkan tindakan keras terhadap kelompok mana pun yang berusaha 'bertindak secara sepihak dan tidak bertanggung jawab untuk mengubah status ini'."
 lar_appeal_to_overseas_territories.2.a: "Seorang pengecut dan pengkhianat."
 lar_appeal_to_overseas_territories.3.t: "Indochina mendeklarasikan [This.GetLeader]"
 lar_appeal_to_overseas_territories.3.desc: "Gubernur Indochina telah menyatakan dukungannya terhadap [This.GetLeader], dengan menyatakan bahwa pemerintahan di Vichy tidak dilegitimasi secara konstitusional dan jelas-jelas bertindak di bawah tekanan. Namun, pasukan militer di wilayah tersebut sebagian besar tetap setia kepada pemerintah Vichy dan saat ini sedang dinegosiasikan untuk memulangkan mereka."
 lar_appeal_to_overseas_territories.3.a: "Hebat!"
 lar_appeal_to_overseas_territories.4.t: "Suriah tetap berada di bawah Vichy"
 lar_appeal_to_overseas_territories.4.desc: "Administrator lokal di Suriah telah memilih untuk mengabaikan seruan kami sepenuhnya. Beberapa sumber menunjukkan bahwa ada diskusi singkat di balik pintu tertutup, namun pada akhirnya belum ada komentar resmi mengenai permohonan radio atau tindakan yang diambil untuk mendukung tujuan kami."
 lar_appeal_to_overseas_territories.5.t: "Suriah mendeklarasikan [This.GetLeader]"
 lar_appeal_to_overseas_territories.5.desc: "Tampaknya telah terjadi kudeta kecil-kecilan di Suriah, dengan beberapa tokoh penting dalam pemerintahan kolonial ditahan oleh gubernur. Dia kemudian menyatakan kesetiaannya kepada [This.GetLeader] dan meminta semua orang Prancis yang patriotik untuk mengangkat senjata melawan musuh yang kini menduduki tanah air kita."
 lar_appeal_to_overseas_territories.6.t: "Afrika Tengah tetap bersama Vichy"
 lar_appeal_to_overseas_territories.6.desc: "Para administrator kolonial di Afrika Tengah telah secara kolektif menolak seruan radio [This.GetLeader], dan menyebutnya sebagai tindakan pengkhianatan yang bertujuan melemahkan otoritas pemerintah yang sah. Sumber-sumber menunjukkan bahwa mereka takut akan reaksi penduduk asli jika mereka berpindah pihak, khawatir akan kurangnya dukungan jika beberapa orang yang lebih berpikiran independen memutuskan untuk mencoba membebaskan diri."
 lar_appeal_to_overseas_territories.6.a: "Gabungan semuanya tidak pantas disebut laki-laki!"
 lar_appeal_to_overseas_territories.7.t: "Afrika Tengah beralih pihak"
 lar_appeal_to_overseas_territories.7.desc: "Dipimpin oleh administrator Félix Éboué, koloni-koloni di Afrika Tengah telah mendukung perjuangan kami. Upaya rekrutmen di kalangan penduduk lokal telah dimulai."
 lar_appeal_to_overseas_territories.8.t: "Afrika Barat tetap berada di bawah Vichy"
 lar_appeal_to_overseas_territories.8.desc: "Meskipun para pejabat lokal di Afrika Barat secara luas mendukung kami untuk berpihak pada kami, tampaknya sebagian besar penduduk Eropa di wilayah tersebut tidak mendukung kami. Dengan meningkatnya tekanan masyarakat, para gubernur setempat terpaksa menyatakan secara terbuka dukungan mereka kepada pemerintah Vichy."
 lar_appeal_to_overseas_territories.9.t: "Afrika Barat mendeklarasikan [This.GetNameDef]"
 lar_appeal_to_overseas_territories.9.desc: "Sementara para administrator lokal wilayah kami di Afrika bagian barat masih memperdebatkan bagaimana menanggapi seruan [This.GetLeader], warga patriotik di wilayah tersebut memilih untuk bertindak dan mengambil alih jabatan pemerintah kolonial. Daerah itu sekarang berada di bawah kendali kami."
 lar_appeal_to_overseas_territories.10.t: "Madagaskar tetap berada di bawah Vichy"
 lar_appeal_to_overseas_territories.10.desc: "Gubernur pulau tersebut mengimbau warganya untuk tetap tenang dan mengikuti perintah pemerintah sah di Vichy. Tampaknya hanya ada sedikit ketidakpuasan di pulau tersebut, dan sebagian besar penduduknya menyetujui perintah ini."
 lar_appeal_to_overseas_territories.11.t: "Madagaskar berpindah pihak"
 lar_appeal_to_overseas_territories.11.desc: "Gubernur Madagaskar telah menawarkan pangkalan militer di pulau itu kepada pasukan kami dan sekutu kami, meminta dukungan lebih lanjut untuk mengamankannya dari serangan apa pun."
 lar_appeal_to_overseas_territories.12.t: "Afrika Utara tetap berada di bawah Vichy"
 lar_appeal_to_overseas_territories.12.desc: "Meskipun hanya sedikit orang di kubu kami yang berharap bahwa kubu Vichy di Afrika Utara akan berpindah pihak, kerasnya penolakan tersebut masih cukup mengejutkan. Memberi label [This.GetLeader] sebagai pengkhianat dan orang gila, gubernur setempat telah berjanji untuk mendukung pemerintah Vichy dengan cara apa pun yang diperlukan."
 lar_appeal_to_overseas_territories.13.t: "Afrika Utara beralih pihak"
 lar_appeal_to_overseas_territories.13.desc: "Dalam kejadian yang mengejutkan, gubernur setempat di Afrika Utara Prancis telah memerintahkan militer untuk menangkap sejumlah pejabat pro-Vichy yang vokal dan berjanji mendukung pemerintahan baru [This.GetLeader]."
 lar_france_political_violence.4.t: "Kekerasan Politik Kembali Terjadi"
 lar_france_political_violence.4.desc: "Setelah masa tenang yang singkat, dengan meningkatnya dukungan rakyat terhadap [This.GetLeader], tampaknya kekerasan politik yang merajalela antara kelompok Komunis dan kelompok Reaksioner telah kembali terjadi. Polisi melaporkan peningkatan yang meresahkan dalam kejahatan bermotif politik terhadap masyarakat atau dunia usaha, mengingatkan kita akan masa-masa kacau yang kita pikir telah kita tinggalkan."
 lar_france_political_violence.4.a: "Para ekstremis ini harus dihentikan."
 france.10.e: "Lanjutkan Pertarungan"
 lar_france_vichy_reunification.1.t: "[From.GetLeader] menuntut unifikasi"
 lar_france_vichy_reunification.1.desc: "Menyusul pembebasan Paris oleh pasukannya, pemimpin Pasukan Prancis di Pengasingan, [From.GetLeader], menuntut agar pemerintahannya diberikan otoritas penuh atas seluruh wilayah kosong di Prancis. Setiap penolakan untuk menyerahkan kekuasaan, katanya, akan dianggap sebagai tindakan mengangkat senjata melawan pemerintah sah Republik."
 lar_france_vichy_reunification.1.a: "Inilah saatnya untuk menyembuhkan perpecahan yang tidak wajar ini."
 lar_france_vichy_reunification.1.b: "Seorang pengkhianat tidak berhak menuntut apa pun."
 lar_france_vichy_reunification.2.t: "Pemerintahan Vichy dibubarkan"
 lar_france_vichy_reunification.2.desc: "Pemerintahan Vichy telah memilih untuk membubarkan diri dan menyerahkan wewenang pemerintahan kepada kami. Sebagian besar pegawai negeri sipil tingkat rendah memilih untuk tetap menjabat, dan sisa pasukan militer berada di bawah komando kami."
 lar_france_vichy_reunification.2.a: "Kami bersatu lagi."
 lar_france_vichy_reunification.3.t: "Pemerintahan Vichy tetap pada tempatnya"
 lar_france_vichy_reunification.3.desc: "Pemerintah [From.GetLeader] telah menolak menyerahkan kewenangan pemerintahan kepada kami. Segala upaya untuk membuka perundingan tidak ditanggapi dengan diam, dan kita mungkin harus memaksakannya dengan kekuatan senjata."
 lar_france_vichy_reunification.3.a: "Kemudian kita akan mencapai persatuan dengan kekuatan."
 SPA_civil_war_event_tt: "§GMembuka templat divisi yang terkunci.§!"
 SPR_civil_war_event_tt: "§GMembuka templat divisi yang terkunci§! dan §Rmembubarkan unit terkait.§!"
 lar_spain.1.desc: "Meskipun terdapat kampanye pemilu besar-besaran yang dilakukan oleh Konfederasi Hak Otonomi Spanyol, Front Populer sayap kiri yang dibentuk oleh Partai Pekerja Sosialis Spanyol dan Partai Kiri Republik, dengan bantuan kaum Anarkis, Komunis, dan Serikat Buruh,lah yang tampaknya memenangkan pemilu tahun 1936. Menggambarkan lanskap politik Spanyol yang sangat terpecah, keunggulan Front Populer dalam perolehan suara rakyat nampaknya jauh lebih tipis dibandingkan dengan perolehan kursi yang diperoleh.\n\nPemerintahan baru mana pun yang akan dibentuk di bawah kepemimpinan Presiden [Root.GetLeader] dalam beberapa hari dan minggu ke depan, mereka harus berhadapan dengan kelompok sayap kanan politik yang semakin terasing dan bermusuhan. Daripada menyelesaikan kekerasan politik dan kerusuhan sosial yang melanda negara kita, tampaknya hasil pemilu baru-baru ini hanya akan memperburuk keadaan."
 lar_spain.1.a: "Hanya melalui pemadaman Fasisme Spanyol dapat bertahan!"
 lar_spain.1.b: "Hanya dari abu Republik Kedua Spanyol dapat ditempa kembali!"
 SPR_republican_garrison_control_decisions_tt: "Membuka §YMemperluas Kontrol Garnisun§! Keputusan di Peta, memungkinkan untuk §Gmelawan§! §YPengaruh Nasionalis§! di negara bagian.\n\nNegara bagian yang tidak memiliki §RTotal§! Nasionalis §YKontrol Garnisun§! pada awal Perang Saudara akan memulai konflik di bawah §YKepemilikan Republik§!."
 SPA_nationalist_garrison_control_decisions_tt: "Membuka §YMemperluas Kontrol Garnisun§! Keputusan di Peta, memungkinkan untuk §Gmemperluas§! §YPengaruh Nasionalis§! di negara bagian.\n\nHanya negara bagian yang memiliki §GTotal§! §YKontrol Garnisun§! Nasionalis pada awal Perang Saudara akan memulai konflik di bawah §YKepemilikan Nasionalis§!."
 lar_spain.2.t: "Perang Saudara Spanyol"
 lar_spain.2.desc: "Tepat pukul 05.00 pagi ini, tepat satu hari setelah hilang kontak dengan garnisun Afrika Utara, operasi militer yang telah dipersiapkan dengan baik dilancarkan di seluruh Spanyol dengan tujuan menguasai seluruh institusi pemerintah dan lokasi strategis di kota-kota besar. Sebagian besar Angkatan Darat, Angkatan Laut, dan Angkatan Udara telah berhenti menanggapi perintah pemerintah, sementara pada saat yang sama milisi Carlist telah memberontak di bagian utara negara tersebut.\n\nKeberhasilan penuh dari percobaan kudeta ini hanya dapat dicegah oleh milisi rakyat tidak resmi yang, melalui tindakan cepat, telah berhasil mempertahankan kendali atas banyak lokasi dan kota yang menjadi sasaran. Meskipun gagal mencapai tujuan awal mereka, tampaknya tidak mungkin para pemimpin pemberontakan akan melepaskan posisi mereka yang kuat seperti yang mereka lakukan pada tahun 1932. Karena tidak ada pihak yang mau berkompromi, jalan terbuka lebar bagi situasi saat ini untuk meningkat menjadi perang saudara berskala nasional..."
 lar_spain.2.a: "...yang, sebagai Front Nasionalis yang bersatu, kita akan menang!"
 lar_spain.2.b: "...yang, di bawah kepemimpinan Falange, kita akan menang!"
 lar_spain.2.c: "...yang, demi Tuhan, Tanah Air, dan Raja, kita akan menang!"
 lar_spain.2.d: "...yang, dengan tetap setia pada prinsip-prinsip demokrasi, kita akan menang!"
 lar_spain.2.e: "...yang, melalui keberanian para pekerja, kita akan menang!"
 lar_spain.2.f: "...yang, melalui perjuangan revolusioner komunal, kita akan menang!"
 lar_spain.6.t: "Garis Depan Perang Saudara Memperkuat"
 lar_spain.6.desc: "Dengan hanya satu minggu pertempuran yang telah berlalu, sudah menjadi jelas bahwa pedesaan Spanyol tidak cocok untuk pengangkutan peralatan dalam jumlah besar. Kesulitan dalam menjaga pasokan garis depan dan serangan kita semakin besar, dan hanya akan menjadi lebih buruk jika kita terus berupaya untuk berperang di mana pun secara bersamaan."
 lar_spain.6_tt: "Membuka §YSerangan Perang Saudara§! Keputusan di Peta, memungkinkan penghapusan hukuman tempur §RSerangan Tidak Direncanakan§! di negara bagian yang ditargetkan."
 lar_spain.6.a: "Kemudian kita akan menunggu waktu dan menyerang pada saat yang tepat."
 lar_spain.7.t: "Pemberontakan Carlist!"
 lar_spain.7.desc: "Khawatir akan pengaruh kita yang semakin besar terhadap Front Nasionalis, kaum Carlist semakin tidak sabar dan memilih untuk mengambil tindakan sendiri. Requeté mereka telah menyerang kekuatan kita, dan pada saat yang sama melanjutkan perjuangan melawan musuh-musuh kita.\n\nApa yang ingin mereka capai dengan tindakan bodoh ini tidak dapat ditebak oleh siapa pun, namun sejauh ini hal tersebut hanya berfungsi untuk memperkuat posisi Partai Republik."
 lar_spain.7.desc_2: "Khawatir akan pengaruh kita yang semakin besar terhadap pemerintahan baru pascaperang, kaum Carlist semakin tidak sabar dan memilih untuk mengambil tindakan sendiri, dan Requeté mereka telah mengubah kekuatan kita.\n\nMereka akan mempertaruhkan kemenangan kita yang telah kita peroleh dengan susah payah atas Partai Republik untuk membangun dominasi mereka atas pemerintahan baru!"
 lar_spain.7.a: "Ketegaran mereka akan merugikan mereka lebih dari kita!"
 lar_spain.8.t: "Penumpasan Fasis!"
 lar_spain.8.desc: "Tidak senang dengan desakan kami yang terus-menerus pada kemerdekaan politik, kepemimpinan Falange memutuskan untuk mencoba menghapus gerakan kami dari peta. Kekuatan Falang telah menyerang Requetés kita, dan upaya penangkapan telah dilakukan terhadap banyak pemikir dan politisi terkemuka kita.\n\nDalam ketidakfleksibelannya, mereka telah membahayakan posisi Front Nasionalis secara keseluruhan dan mungkin memberikan keterbukaan yang dibutuhkan oleh kekuatan Republik."
 lar_spain.8.desc_2: "Tidak senang dengan desakan kami yang terus-menerus untuk memberikan pengaruh tertentu terhadap pemerintahan pascaperang, kepemimpinan Falange memutuskan untuk mencoba menghapuskan gerakan kami dari peta! Kekuatan Falang telah menyerang Requetés kita, dan upaya penangkapan telah dilakukan terhadap banyak pemikir dan politisi terkemuka kita.\n\nMereka akan mempertaruhkan kemenangan kita yang telah kita peroleh dengan susah payah atas Partai Republik untuk menghalangi kita mendapatkan pengaruh atas pemerintahan baru!"
 lar_spain.8.a: "Kebodohan mereka akan lebih merugikan mereka daripada kita!"
 lar_spain.9.t: "Pemberontakan Anarkis!"
 lar_spain.9.desc: "Meningkatnya independensi yang dilakukan oleh komune Anarkis telah mencapai puncaknya seiring dengan perkembangan terkini. Frustrasi dengan upaya-upaya wajar kami untuk mempertahankan kontrol terpusat atas bagian-bagian penting dari upaya perang bersama, kaum Anarkis dan sekutu POUM mereka telah meningkatkan perselisihan lokal menjadi pertempuran jalanan dengan pasukan kami.\n\nMeskipun awalnya bersifat lokal, pertikaian kini telah menyebar lebih jauh, mengancam akan membahayakan integritas garis depan kami dengan kaum Nasionalis."
 lar_spain.9.desc_2: "Meningkatnya independensi yang dilakukan oleh komune Anarkis telah mencapai puncaknya seiring dengan perkembangan terkini. Frustrasi dengan upaya-upaya yang masuk akal untuk memulai kembalinya pemerintahan secara bertahap ke pemerintahan yang stabil dan tersentralisasi, kaum Anarkis dan sekutu POUM mereka telah meningkatkan perselisihan lokal menjadi pertempuran jalanan dengan pasukan kita.\n\nMereka akan mempertaruhkan kemenangan yang kita peroleh dengan susah payah atas kaum Nasionalis untuk menegakkan gagasan konyol mereka tentang kemerdekaan!"
 lar_spain.9.a: "Sudah waktunya untuk sekali lagi menegakkan kendali pemerintah atas wilayah-wilayah ini."
 lar_spain.10.t: "Tindakan Keras Pemerintah!"
 lar_spain.10.desc: "Tentu saja kecewa dengan kemerdekaan yang terus kita jalani, pemerintah Republik Kedua, dengan sekutu Stalinisnya, telah berusaha untuk mengambil kendali atas lokasi dan bangunan strategis utama di wilayah kita. Menolak upaya-upaya ini telah mengakibatkan baku tembak dengan mantan sekutu kita, yang kemudian meningkat menjadi pertempuran jalanan besar-besaran.\n\nKetidakmampuan mereka untuk berkompromi dengan pemerintah telah secara efektif menempatkan kita dalam keadaan berperang dengan mereka, dan dengan demikian telah memperkuat posisi Nasionalis."
 lar_spain.10.desc_2: "Tentu saja kecewa dengan kemerdekaan yang terus kita jalani, pemerintah Republik Kedua, dengan sekutu Stalinisnya, telah berusaha untuk mengambil kendali atas lokasi dan bangunan strategis utama di wilayah kita. Menolak upaya-upaya ini telah mengakibatkan baku tembak dengan mantan sekutu kita, yang kemudian meningkat menjadi pertempuran jalanan besar-besaran.\n\nDaripada membiarkan kita hidup dalam damai, mereka akan mempertaruhkan kemenangan kita yang telah diperoleh dengan susah payah atas kaum Nasionalis untuk menghindari kompromi dan melepaskan kendali!"
 lar_spain.10.a: "Revolusi kita tidak akan mudah padam!"
 lar_spain.11.t: "Carlist Dikalahkan"
 lar_spain.11.desc: "Meskipun terjadi pertempuran fanatik, kantong perlawanan Carlist yang terakhir telah dikalahkan oleh pasukan kita. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.11.a: "Tapi kami membuat kemajuan."
 lar_spain.12.t: "Falange Dikalahkan"
 lar_spain.12.desc: "Pasukan Falang telah menyerah secara massal setelah benteng besar terakhir mereka direbut, dan meskipun perlawanan terus berlanjut, hal ini menandai berakhirnya organisasi militer Falange. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.13.t: "Nasionalis Dikalahkan"
 lar_spain.13.desc: "Menyusul kekalahan militer terbaru yang diderita oleh kaum Nasionalis, Jenderal Franco mengumumkan penyerahan seluruh pasukannya. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.14.t: "Kaum Anarkis Dikalahkan"
 lar_spain.14.desc: "Perlawanan anarkis, meski sengit, menjadi semakin tidak terorganisir dalam beberapa pekan terakhir. Kemenangan militer hari ini akhirnya mendorong Dewan Pertahanan untuk menyerah tanpa syarat, meskipun pertempuran terisolasi terus berlanjut di mana masing-masing komune menolak untuk mengakui perintah tersebut. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.15.t: "POUM Dikalahkan"
 lar_spain.15.desc: "Perlawanan POUM, meskipun sengit, menjadi semakin tidak terorganisir dalam beberapa minggu terakhir. Kemenangan militer hari ini akhirnya mendorong kepemimpinan komunis menyerah tanpa syarat, dan pasukan kita mulai memasuki benteng-benteng mereka yang kini tak terbantahkan. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.16.t: "Republik Kedua Dikalahkan"
 lar_spain.16.desc: "Setelah serangkaian kekalahan militer baru-baru ini, dan melihat wilayah kekuasaan mereka berkurang hingga hanya sebagian kecil dari semenanjung, para pemimpin militer Republik Kedua telah menggulingkan pemerintah dan menuntut perdamaian. Meskipun pemberontakan Komunis kembali dipicu untuk mencegah hal ini, pasukan Republik yang tersisa telah mengalahkan pemberontakan ini, dan kini, dengan sedikit bantuan lain, setuju untuk menyerah tanpa syarat.\n\nMeskipun konflik ini menjadi lebih sederhana, perjuangan kita terus melawan musuh-musuh kita yang tersisa."
 lar_spain.17.t: "Kaum Stalinis Dikalahkan"
 lar_spain.17.desc: "Setelah serangkaian kekalahan militer baru-baru ini, dan melihat wilayah kekuasaan mereka berkurang hingga hanya sebagian kecil dari semenanjung, para pemimpin militer komunis akhirnya menuntut perdamaian. Meskipun konfliknya menjadi jauh lebih sederhana, perjuangan kita terus berlanjut melawan musuh-musuh kita yang tersisa."
 lar_spain.18.t: "Pemberontakan Menunggu Waktunya"
 lar_spain.18.desc: "Rencana kami telah selesai, dan kami siap melakukan kudeta. Namun, untuk menghindari terulangnya kegagalan yang menyedihkan seperti upaya kudeta Sanjurjada pada tahun 1932, kita harus menunggu hingga iklim politik berada pada kondisi paling matang. Kami akan menghabiskan sumber daya kami untuk menutupi jejak kami sambil menunggu waktu yang tepat..."
 lar_spain.18.a: "Sebaiknya kita tidak membuang waktu terlalu lama."
 lar_spain.18.a_tt: "Semangat Nasional ini akan dihilangkan pada awal Perang Saudara."
 lar_spain.19.t: "[From.GetNameDefCap] Tuntutan Penyerahan"
 lar_spain.19.desc: "Para diplomat [From.GetAdjective] telah menuntut agar kita menundukkan kebijakan luar negeri kita pada kebijakan mereka, dengan menyatakan bahwa [From.GetNameDef] akan 'mengambil alih kepemimpinan dunia Hispanik' dalam permasalahan global."
 lar_spain.19.a: "Kita membutuhkan pemimpin yang kuat; kenapa bukan mereka?"
 lar_spain.19.b: "Kita bisa mengatur untuk membela kepentingan kita sendiri, diri kita sendiri."
 lar_spain.20.t: "[From.GetNameDefCap] Menyerahkan"
 lar_spain.20.desc: "Atas desakan kami, pemerintah [From.GetAdjective] telah menerima kepemimpinan kami dalam masalah internasional mengenai dunia Hispanik."
 lar_spain.20.a: "Kami akan membimbing mereka menuju kejayaan."
 lar_spain.21.t: "[From.GetNameDefCap] Menolak Tuntutan"
 lar_spain.21.desc: "Terlepas dari desakan kami, pemerintah [From.GetAdjective] telah menolak kepemimpinan kami dalam urusan internasional mengenai dunia Hispanik. Mereka akan terus menjalankan kebijakan luar negeri mereka sendiri."
 lar_spain.21.a: "Kemudian kami akan menunjukkan kepada mereka manfaat kepemimpinan kami melalui kekerasan."
 lar_spain.22.t: "[From.GetNameDefCap] Minta Bantuan"
 lar_spain.22.desc: "Pemerintah [From.GetAdjective] telah mengirimkan pesan untuk meminta bantuan material dalam perjuangan mereka melawan Partai Republik. Perang saudara terbukti sangat merusak dan berdampak buruk pada pasokan mereka. Mereka meyakinkan kami bahwa bantuan apa pun yang kami berikan akan sangat berharga dalam mengalahkan ancaman komunisme."
 lar_spain.22.a: "Kita harus memberi mereka bantuan semampu kita."
 lar_spain.22.b: "Saat ini kami tidak punya apa-apa lagi."
 lar_spain.23.t: "[From.GetNameDefCap] Mengirim Bantuan"
 lar_spain.23.desc: "Pemerintah [From.GetAdjective] memberi tahu kami bahwa mereka akan mengirimkan kami dukungan materi untuk membantu kami dalam perjuangan membendung komunisme."
 lar_spain.23.a: "Kami akan mengingat bantuan mereka."
 lar_spain.24.t: "[From.GetNameDefCap] Tidak Mengirim Bantuan"
 lar_spain.24.desc: "[From.GetAdjective] diplomat memberi tahu kami bahwa sayangnya mereka tidak dapat memberikan bantuan kepada kami saat ini."
 lar_spain.24.a: "Mereka berpuas diri sementara komunisme dikekang dengan darah Spanyol."
 lar_spain.25.t: "Pakta Iberia"
 lar_spain.25.desc: "[From.GetAdjective] utusan telah datang dengan proposal yang akan memperkuat pertahanan bersama kita serta menjaga perdamaian di semenanjung Iberia.\n\nPakta yang diusulkan akan mewajibkan masing-masing pihak untuk bergabung dengan aliansi mana pun yang menjadi anggotanya, sekaligus menentukan bahwa kedua anggota akan bergabung dengan pihak yang sama dalam konflik apa pun yang dihadapi pihak lain, baik sebagai agresor atau dengan menyatakan perang."
 lar_spain.25.a: "Perjanjian seperti itu akan sangat memperkuat ikatan kita."
 lar_spain.25.b: "Kita harus menjaga independensi tindakan kita."
 lar_spain.26.desc: "[From.GetNameDefCap] memberi tahu kita bahwa usulan Pakta Iberia diterima dengan sepenuh hati. Mereka selanjutnya akan mendukung kita dalam aliansi atau perang apa pun yang mungkin kita hadapi."
 lar_spain.26.a: "Mereka memang teman setia."
 lar_spain.27.desc: "[From.GetNameDefCap] memberi tahu kita bahwa mereka menolak usulan Pakta Iberia, karena mereka khawatir hal itu akan terlalu membatasi kemampuan mereka untuk bertindak independen dalam kebijakan luar negerinya."
 lar_spain.27.a: "Mereka melemahkan diri mereka sendiri tanpa menyadarinya."
 lar_spain.28.t: "Pakta Iberia Dimohonkan"
 lar_spain.28.desc: "[iberian_pact_invitee.GetNameDefCap] telah diterima di [iberian_pact_invitee.GetFactionName], oleh karena itu, untuk memastikan perdamaian tetap terjaga di Semenanjung Iberia, sudah waktunya bagi kita untuk menjunjung tinggi kesepakatan kita dan bergabung dengan aliansi ini juga."
 lar_spain.28.a: "Kami berkomitmen."
 lar_spain.29.desc: "Waktunya telah tiba. [iberian_pact_war_target.GetNameDefCap] telah berperang dengan musuh-musuhnya, jadi, sesuai ketentuan Pakta kita, kita harus bergabung dengan mereka dan membentuk front persatuan melawan dunia luar."
 lar_spain.30.t: "Blok Latin"
 lar_spain.30.desc: "Melihat kerja sama kami yang terus meningkat, pemerintah [From.GetAdjective] kini telah mengajukan proposal untuk aliansi penuh, yang selain kami dan Spanyol, mungkin juga mencakup Italia dan Prancis."
 lar_spain.30.a: "Ide yang bagus sekali."
 lar_spain.30.b: "Bersekutu dengan negara-negara ini bukanlah kepentingan terbaik kita saat ini."
 lar_spain.31.desc: "Pemerintah [From.GetAdjective] memberi tahu kami bahwa mereka menerima proposal kami untuk membentuk Blok Latin."
 lar_spain.31.a: "Mereka akan membuktikan diri sebagai anggota yang sangat berharga dalam aliansi baru ini."
 lar_spain.32.desc: "Pemerintah [From.GetAdjective] memberi tahu kami bahwa mereka tidak tertarik untuk bergabung dengan aliansi Latin saat ini."
 lar_spain.32.a: "Mungkin mereka akan mengubah pendapatnya nanti."
 lar_spain.33.t: "Unión Militar Española"
 lar_spain.33.desc: "Perjuangan Carlist masih memiliki sekutu di kalangan militer. Berkoordinasi dengan mereka dan mendapatkan bantuan mereka akan sangat membantu keberhasilan pemberontakan kita."
 lar_spain.33.a: "Amankan sekutu Unión Militar di [union_militar_target_state_1.GetName]."
 lar_spain.33.b: "Amankan sekutu Unión Militar di [union_militar_target_state_2.GetName]."
 lar_spain.33.c: "Amankan sekutu Unión Militar di [union_militar_target_state_3.GetName]."
 lar_spain.33_tt: "Akan membentuk 5 Carlist Requetés yang terlatih dengan §Y3 batalyon infanteri§! ketika pemberontakan Carlist dimulai."
 lar_spain.34.t: "Pertanyaan Suksesi"
 lar_spain.34.desc: "Dengan meninggalnya Alfonso Carlos yang tidak mempunyai anak, garis keturunan Carlist telah padam, dan akibatnya timbul perpecahan dalam gerakan Carlist.\n\nAda orang-orang yang mendukung klaim penerus yang ditunjuk oleh Alfonso Carlos sendiri: Xavier dari Bourbon-Parma, tetapi dia tidak memiliki klaim dinasti atas takhta. Yang lain lebih memilih untuk mendukung klaim raja Alfonso XIII yang diasingkan, yang meskipun merupakan keturunan dari garis keturunan pengkhianat Isabella II, namun memiliki klaim dinasti atas takhta.\n\nJika pertanyaan ini tidak ditangani dengan cepat, hal ini dapat menyebabkan dukungan kita terpecah menjadi berbagai kubu yang saling bertengkar."
 lar_spain.34.a: "Kehendak Raja harus terlaksana. Xavier akan menjadi Raja baru kita!"
 lar_spain.34.a_tt: "Xavier dari Bourbon-Parma akan menjadi Raja setelah monarki dipulihkan."
 lar_spain.34.b: "Kesinambungan dinasti harus dijaga. Alfonso XIII akan menjadi Raja kita!"
 lar_spain.34.b_tt: "Alfonso XIII akan menjadi Raja setelah monarki dipulihkan."
 lar_spain.34.c: "Orang yang berpura-pura dari Habsburg telah membuktikan dirinya layak"
 lar_spain.34.c_tt: "Karl Pius von Habsburg akan menjadi Raja setelah monarki dipulihkan."
 SPB_karl_pius_king: "Karl Pius von Habsburg"
 lar_spain.35.t: "Pemulihan Monarki"
 lar_spain.35.desc: "Setelah lebih dari setengah dekade tanpa raja, kegembiraan masyarakat yang menyambut di Madrid sulit untuk ditahan ketika [From.GetSPBkingloc] memasuki kota pagi ini. Disoraki oleh penonton yang bergembira, prosesi kerajaan berlanjut melalui jalan-jalan Madrid menuju gereja San Jerónimo el Real.\n\nDalam upacara yang megah, [From.GetSPBking2loc].\n\nMeskipun sebagian besar negara masih berada dalam reruntuhan, mungkin Raja yang baru dapat berfungsi sebagai kekuatan pemersatu dan penyembuhan, dan membimbing [From.GetNameDef] menuju yang lebih mulia masa depan."
 SPB_xavier_king: "Xavier dari Bourbon-Parma"
 SPB_alfonso_king: "Alfonso XIII"
 SPB_xavier_king2: "Xavier mengambil alih mahkota dan gaya kerajaan Javier I, akhirnya menempatkan pewaris garis Carlist yang sah di atas takhta Spanyol."
 SPB_alfonso_king2: "Alfonso XIII, setelah bertahun-tahun di pengasingan, kembali ke tahta Spanyol, mengakhiri pertumpahan darah selama satu abad dengan akhirnya menyatukan dua garis suksesi."
 lar_spain.35.a: "Saat ini, satu abad ketidakadilan telah diluruskan. Hidup el Rey!"
 lar_spain.36.t: "Pendudukan Tangier"
 lar_spain.36.desc: "Dengan terang-terangan mengabaikan Protokol Tangier tahun 1924, pasukan [From.GetAdjective] telah memasuki Zona Internasional Tangier sebagai pasukan pendudukan. Meskipun ada seruan dari kaum nasionalis Spanyol untuk melakukan aneksasi langsung atas wilayah tersebut, duta besar [From.GetAdjective] meyakinkan kita bahwa ini hanyalah 'tindakan sementara pada masa perang', dan bahwa kota tersebut akan kembali ke status sebelum perang setelahnya."
 lar_spain.36.a: "Kalau bukan kita yang membela hak warga Tangerian, lalu siapa lagi?"
 lar_spain.36_tt: "Jika §Y[SPA.GetName]§! tidak mundur, kami akan menerima:"
 lar_spain.36.b: "Janji mereka cukup baik untuk saat ini."
 lar_spain.37.desc: "[FROM.GetNameDefCap] telah mengeluarkan keberatan yang tegas dan resmi terhadap pendudukan kami di Tangier. Mereka menganggap tindakan kami ilegal, dan bahkan mengisyaratkan penggunaan kekuatan militer untuk mengusir kami dari Zona Internasional jika kami tidak segera menarik diri."
 lar_spain.37.a: "Kami tidak akan takut dengan ancaman sia-sia mereka."
 lar_spain.37.b: "Maka kita harus mundur."
 lar_spain.38.desc: "Seperti yang diharapkan, pemerintah [From.GetAdjective] yang lemah belum berani menentang pendudukan kami di Tangier. Kita bebas untuk mengintegrasikan kota ini secara lebih penuh ke dalam negara kita."
 lar_spain.38.a: "Spanyol sekali lagi!"
 lar_spain.39.t: "[From.GetNameDefCap] Menuntut Afrika Utara"
 lar_spain.39.desc: "Para diplomat [From.GetAdjective] telah menyampaikan ultimatum kepada kami, menuntut kami segera menyerahkan kendali atas Afrika Utara kepada [From.GetNameDef]. Tidak diragukan lagi mereka bermaksud memanfaatkan kelemahan posisi internasional kita saat ini..."
 lar_spain.39.a: "Kita tidak mampu melakukan perang lagi. Kita harus menerima."
 lar_spain.39.b: "Mereka tidak akan mendapatkannya dengan mudah!"
 lar_spain.40.t: "[From.GetNameDefCap] Menerima Permintaan"
 lar_spain.40.desc: "[From.GetNameDefCap] telah menerima tuntutan kami dan diplomat mereka meyakinkan kami bahwa mereka sedang membuat pengaturan untuk pengalihan kendali atas Afrika Utara segera."
 lar_spain.40.a: "Sangat efisien."
 lar_spain.41.t: "[From.GetNameDefCap] Menolak Tuntutan"
 lar_spain.41.desc: "[From.GetAdjective] diplomat telah memberi tahu kami bahwa mereka dengan tegas menolak semua tuntutan Spanyol untuk Afrika Utara."
 lar_spain.41.a: "Maka kita harus mengambilnya dengan paksa."
 lar_spain.42.t: "[From.GetNameDefCap] Mengklaim Tahta Prancis"
 lar_spain.42.desc: "Baru-baru ini menduduki takhta Spanyol, Raja [From.GetLeader] telah menunjukkan niatnya atas takhta Prancis, dengan menggunakan klaim kaum Legitimis atas takhta tersebut sebagai dasar.\n\nDengan kemenangan politik kaum Legitimis di negara kita baru-baru ini, Raja kini menganggap pantas untuk mengambil tindakan berdasarkan rencana ini, dan telah secara resmi menyatakan keinginannya untuk dinobatkan di Reims dengan segala cara yang mungkin dilakukan dengan tergesa-gesa."
 lar_spain.42.a: "Dia memiliki klaim yang valid - kami dengan senang hati menerimanya. Hiduplah Roi!"
 lar_spain.42.b: "Prancis tidak akan pernah tunduk pada Spanyol!"
 lar_spain.43.t: "[From.GetNameDefCap] Mengakui Klaim"
 lar_spain.43.desc: "Pemerintahan Legitimis [From.GetAdjective] telah mendengarkan permintaan Raja [Root.GetLeader], dan kini telah secara resmi memberi tahu kami bahwa mereka mengakui hak klaimnya atas mahkota Prancis. Mereka meyakinkan kami bahwa mereka akan segera membuat pengaturan untuk mengadakan upacara penobatan."
 lar_spain.43.a: "Semuanya sebagaimana mestinya."
 lar_spain.43_tt: "Persiapan penobatan akan dimulai."
 lar_spain.44.t: "[From.GetNameDefCap] Menolak Klaim"
 lar_spain.44.desc: "Meskipun Raja [Root.GetLeader] berhak atas mahkota Perancis, pemerintah [From.GetAdjective] nampaknya bersikap dingin pada menit-menit terakhir. Mengutip kekhawatiran akan keresahan masyarakat terhadap prospek kendali Spanyol atas Perancis, mereka 'dengan menyesal menolak' upacara penobatan resmi."
 lar_spain.44.a: "[Root.GetLeader] akan tetap menjadi Raja Prancis."
 lar_spain.45.t: "Uni Iberia"
 lar_spain.45.desc: "Sama seperti antara tahun 1580 dan 1640, [From.GetNameDef] mengusulkan penyatuan kedua negara kita di bawah [From.GetLeader]. [From.GetAdjective] Para diplomat mendesak kita untuk mempertimbangkan kekuatan yang bisa ditunjukkan oleh persatuan Iberia kepada dunia di bawah satu pemimpin."
 lar_spain.45.a: "Mereka berbicara dengan bijak."
 lar_spain.45.b: "Portugal tidak akan pernah diperintah dengan sukarela oleh orang Spanyol!"
 lar_spain.46.t: "Uni Iberia - [From.GetNameDefCap] Menerima"
 lar_spain.46.desc: "[From.GetNameDefCap] telah menerima usulan kami untuk menyatukan Iberia di bawah kepemimpinan [Root.GetLeader]. Mereka akan membuat pengaturan yang diperlukan untuk memulai integrasi aparat pemerintah mereka ke dalam aparat kita."
 lar_spain.46.a: "Mereka telah memilih dengan bijak. Bersatu kita lebih kuat!"
 lar_spain.47.t: "Uni Iberia - [From.GetNameDefCap] Penurunan"
 lar_spain.47.desc: "[From.GetNameDefCap] telah menolak gagasan menyatukan semenanjung Iberia di bawah kepemimpinan bersama. Meskipun ada negosiasi yang ekstensif, posisi delegasi [From.GetAdjective] secara efektif dapat disimpulkan sebagai \"ambillah jika Anda cukup keras\"."
 lar_spain.47.a: "Usulan mereka dapat diterima."
 lar_spain.48.t: "Anarkisme Portugis"
 lar_spain.48.desc: "Pertempuran di [From.GetNameDef] dalam beberapa hari terakhir telah meluas ke [Root.GetAdjective] wilayah perbatasan, dan [From.GetAdjective] milisi anarkis dengan cepat mulai menarik orang-orang yang berpikiran sama dari kota-kota setempat. Meskipun ada tindakan cepat dari pasukan perbatasan kita, kekerasan yang terjadi dalam pertempuran telah membuat mereka lengah, dan setelah pertempuran awal dengan pasukan [From.GetAdjective] yang terlatih dalam pertempuran dari kedua pihak yang terlibat dalam Perang Saudara, mereka terpaksa mundur.\n\nSejak saat itu, dukungan terhadap gerakan anarkis [From.GetAdjective] telah menyebar lebih jauh ke seluruh masyarakat [Root.GetAdjective], yang jelas sebagian besar disebabkan oleh pihak asing yang curang. dukungan.\n\nAkibatnya, meskipun kita telah berupaya sebaik mungkin, negara ini sebenarnya telah terjerat dalam Perang Saudara [From.GetAdjective] yang lebih besar."
 lar_spain.48.a: "Kenapa mereka harus melibatkan kita dalam hal ini?!"
 lar_spain.49.desc: "Sejak pertempuran [Root.GetAdjective] meluas ke perbatasan [From.GetAdjective], para pendukung anarkis lokal berbondong-bondong mendukung perjuangan kami. Dengan 'dorongan' yang terencana dan dilaksanakan dengan baik, sentimen pro-Anarkis telah menyebar dengan cepat di kalangan anggota muda masyarakat [From.GetAdjective].\n\nSebagai akibat dari pemindahan gudang senjata [Root.GetAdjective] ke sel-sel anarkis [From.GetAdjective] ini, situasi di [From.GetNameDef] telah meningkat ke titik di mana pemerintah menekan sebuah kelompok yang pemberontakan besar-besaran. Para pemimpin pemberontakan ini kini telah meminta bantuan kami yang lebih resmi dan langsung, mengusulkan agar kami memimpin perjuangan Anarkis global, dan menyarankan agar mereka bergabung dengan kami secara lebih formal setelah pertempuran mereda."
 lar_spain.49.a: "Kami sangat menyambut dukungan mereka terhadap perjuangan Anarkis!"
 lar_spain.50.t: "Anarkisme Portugis - Perang Saudara Berakhir"
 lar_spain.50.desc: "Dengan berakhirnya bagian [From.GetAdjective] dari perjuangan Anarkis kita, sel [From.GetAdjective] sekarang meminta untuk diterima di Dewan Pertahanan."
 lar_spain.50.a: "Kami akan menempatkan mereka di bawah perlindungan kami."
 lar_spain.51.t: "Relokasi Cadangan Emas"
 lar_spain.51.desc: "Cadangan emas negara kita terancam oleh kemajuan Nasionalis. Kita harus mengambil tindakan dan memastikan cadangan tersebut dipindahkan dengan aman ke luar negeri, menjaganya agar tidak jatuh ke tangan musuh kita."
 lar_spain.51.a: "Kami akan mengirimkannya ke [SOV.GetNameDef]."
 lar_spain.51.b: "Kami akan mengirimkannya ke [SPR_relocated_gold_reserves_selection_1.GetNameDefCap]."
 lar_spain.51.c: "Kami akan mengirimkannya ke [SPR_relocated_gold_reserves_selection_2.GetNameDefCap]."
 lar_spain.51.d: "Kami akan mengirimkannya ke [SPR_relocated_gold_reserves_selection_3.GetNameDefCap]."
 lar_spain.52.t: "[From.GetNameDefCap] Relokasi Cadangan Emas"
 lar_spain.52.desc: "Pengiriman dari [From.GetNameDef] sudah mulai berdatangan di negara kita, karena pemerintah [From.GetAdjective] memindahkan cadangan emasnya ke luar negeri untuk diamankan selama perang saudara."
 lar_spain.52.a: "Mungkin ini berarti peluang..."
 lar_spain.53.t: "Cadangan Emas Spanyol"
 lar_spain.53.desc: "Sudah lama sejak cadangan emas [SPR.GetAdjective] tiba di negara kami, dan kami terus mengirimkan banyak bantuan ke [SPR.GetNameDef], tanpa pembayaran. Anggota pemerintah mulai mengomentari keadaan lucu dari masalah ini."
 lar_spain.53.a: "Kami akan menyita cadangan emas sebagai 'pembayaran'."
 lar_spain.53.b: "Kemenangan [SPR.GetAdjective] akan menjadi bayaran yang cukup."
 lar_spain.54.t: "Cadangan Emas Disita!"
 lar_spain.54.desc: "Kami telah diberitahu oleh diplomat kami di [From.GetNameDef] bahwa pemerintah [From.GetAdjective] telah menyita cadangan emas kami! Diduga mereka bahkan tidak menganggap perlunya komunike resmi, dengan menyatakan bahwa 'hal yang biasa' untuk mendapatkan 'pembayaran yang telah jatuh tempo' atas bantuan material mereka."
 lar_spain.54.a: "Beraninya mereka?!"
 lar_spain.54.a_tt: "§RIni akan berdampak pada perekonomian kita setelah perang saudara!§!"
 lar_spain.55.t: "Kekurangan Pendanaan Pemerintah"
 lar_spain.55.desc: "Dengan disitanya cadangan emas kita, kita sekarang mengalami kekurangan emas batangan yang dapat digunakan untuk membiayai pembangunan kembali negara ini. Sayangnya, investasi pada sektor publik harus ditunda."
 lar_spain.55.a: "Itu sangat disayangkan..."
 lar_spain.56.t: "[From.GetNameDefCap] Permohonan Otonomi"
 lar_spain.56.desc: "Meskipun bersemangat untuk terus membuktikan kesetiaan mereka dan melakukan bagian mereka untuk Revolusi, perwakilan [From.GetAdjective] telah memperjuangkan peningkatan otonomi. Mereka berargumentasi bahwa jika kita sedikit melonggarkan kendali, mereka akan mampu membantu perjuangan kita dengan lebih baik."
 lar_spain.56.a: "Mereka telah mendapatkan kepercayaan kami."
 lar_spain.56.b: "Namun menjaga kendali tetap ketat jauh lebih baik."
 lar_spain.57.t: "[From.GetNameDefCap] Memberikan Otonomi"
 lar_spain.57.desc: "Perwakilan kami di [From.GetNameDef] memberi tahu kami bahwa pemerintah [From.GetAdjective] dianggap layak untuk memberi kami lebih banyak otonomi."
 lar_spain.57.a: "Kemajuan!"
 lar_spain.58.t: "[From.GetNameDefCap] Menolak Otonomi"
 lar_spain.58.desc: "Perwakilan kami di [From.GetNameDefCap] memberi tahu kami bahwa pemerintah [From.GetAdjective] telah menolak permohonan kami untuk otonomi lebih besar."
 lar_spain.58.a: "Apakah mereka tidak mempercayai kita?"
 lar_spain.59.t: "Iberia Merah"
 lar_spain.59.desc: "Melihat kepentingan ideologis kita bersama, [From.GetNameDefCap] telah mengirimkan utusan dengan proposal untuk persatuan Iberia. Mereka menyarankan bahwa, dengan mengesampingkan perbedaan-perbedaan kita dan menggabungkan kekuatan di bawah kepemimpinan [From.GetAdjective], kita dapat lebih menjamin keberhasilan Revolusi Iberia."
 lar_spain.59.a: "Perjuangan buruh akan semakin diperkuat!"
 lar_spain.59.b: "Kita bisa menyebarkan Revolusi dengan lebih baik atas kemauan kita sendiri."
 lar_spain.60.t: "Iberia Merah - [From.GetNameDefCap] Menerima"
 lar_spain.60.desc: "[From.GetNameDefCap] telah menanggapi tawaran kami dengan persetujuan - mereka menyetujui konsep Iberia sosialis yang bersatu."
 lar_spain.60.a: "Bersatu kita berdiri lebih kuat."
 lar_spain.61.t: "Iberia Merah - [From.GetNameDefCap] Menolak"
 lar_spain.61.desc: "[From.GetNameDefCap] secara terang-terangan menolak usulan kami tentang Iberia yang sosialis bersatu. Meskipun sepakat bahwa kita mempunyai banyak kepentingan yang sama, mereka berpendapat bahwa kita lebih siap untuk mewujudkan hal ini sebagai dua negara yang merdeka."
 lar_spain.61.a: "Mereka belum tahu betapa salahnya mereka."
 lar_spain.62.t: "Pemberontakan Komunis!"
 lar_spain.62.desc: "Campur tangan [From.GetAdjective] yang gencar dan sel-sel bawah tanah yang mendapatkan dukungan terlarang dari [From.GetNameDef] dalam beberapa bulan terakhir telah menguatkan kelompok Komunis lokal yang telah kita perjuangkan selama bertahun-tahun. Tidak diragukan lagi mereka menjanjikan lebih banyak bantuan asing, kelompok-kelompok ini kini telah mengangkat senjata, dan bergabung dengan elemen-elemen yang tidak setia di militer dalam pemberontakan besar-besaran, yang bertujuan untuk mengambil kendali pemerintah dengan kekerasan."
 lar_spain.62.a: "Kami akan menghancurkan pemberontakan ini!"
 lar_spain.63.t: "Pemberontakan Komunis di [From.GetNameDefCap]!"
 lar_spain.63.desc: "Seperti yang diharapkan, dengan dukungan material yang cukup, kelompok Komunis yang telah menyusahkan pemerintah [From.GetAdjective] selama beberapa waktu kini telah berani mengambil tindakan. Pemberontakan besar-besaran berupaya mengambil kendali atas pemerintah, namun sangat bergantung pada dukungan kami. Para pemimpinnya, meski idealis dan bersemangat, hanya memiliki sedikit pengalaman dalam melancarkan perang saudara, dan kini meminta bantuan dan kepemimpinan kepada kita."
 lar_spain.63.a: "Dan mereka akan mendapatkannya!"
 lar_spain.64.t: "[From.GetNameDefCap] Minta Bantuan"
 lar_spain.64.desc: "Meskipun situasi politik di [From.GetNameDef] sudah lama tidak stabil, tampaknya parahnya konflik tersebut telah mengejutkan pemerintah [From.GetAdjective]. Mereka telah meminta bantuan apa pun yang dapat kami kumpulkan untuk membantu mereka dalam perjuangan melawan Fasisme, dan mendesak kami untuk tidak berlama-lama di masa kritis ini.\n\nAda keraguan apakah pemerintah Republik dapat memenangkan perang saudara saat ini tanpa bantuan dari luar, dan, meskipun kemenangan Spanyol yang demokratis akan menjadi hasil yang diinginkan, kemungkinan besar pemberian bantuan ini akan mendorong simpatisan Komunis di negara kita sendiri."
 lar_spain.64.a: "Mereka bergantung pada kita, dan kita harus membantu mereka meskipun risikonya kita tanggung sendiri."
 lar_spain.64.b: "Kita tidak bisa mempertaruhkan stabilitas politik kita sendiri untuk membantu mereka."
 lar_spain.65.t: "[From.GetNameDefCap] Memberikan Bantuan"
 lar_spain.65.desc: "Pemerintah [From.GetAdjective] memberi tahu kami bahwa mereka akan mengirimi kami pengiriman awal bantuan token. Meskipun penting untuk meningkatkan moral kita, dampak material yang sebenarnya dapat diabaikan, namun Perancis meyakinkan kita bahwa mereka sedang menyelidiki pilihan-pilihan tentang bagaimana memberikan bantuan yang lebih besar di masa depan."
 lar_spain.65.a: "Ini adalah berita bagus!"
 lar_spain.66.t: "[From.GetNameDefCap] Menolak Permintaan"
 lar_spain.66.desc: "Prancis memberi tahu kami bahwa sayangnya mereka tidak dapat mengirimkan bantuan kepada kami, karena hal ini akan membahayakan stabilitas politik dalam negeri mereka."
 lar_spain.66.a: "Dan mereka yakin perbatasan lain yang dibagi dengan kaum Fasis tidak akan terjadi?"
 lar_spain.67.t: "[From.GetAdjective] Perang Kemerdekaan!"
 lar_spain.67.desc: "Tampaknya pemerintah [From.GetAdjective] dengan cepat lupa kepada siapa mereka berutang kemenangan dalam perang saudara baru-baru ini. Pagi ini, semua komunikasi dengan perwakilan kami di [From.GetNameDef] tiba-tiba terputus, dan pengumuman dari [From.GetLeader] disiarkan dari media pemerintah mereka, menyebarkan propaganda dalam upaya nyata untuk membangkitkan semangat rakyat [From.GetAdjective] dalam upaya perang lainnya.\n\nDeklarasi kemerdekaan secara resmi telah disampaikan di Moskow pagi ini."
 lar_spain.67.a: "Kami akan menghancurkan sikap keras kepala ini!"
 lar_spain.67.b: "Kami tidak punya pilihan selain menerimanya."
 lar_spain.68.t: "[From.GetNameDefCap] Minta Bantuan"
 lar_spain.68.desc: "[From.GetNameDefCap] telah menghubungi kami dengan permintaan bantuan material dalam perang kemerdekaan mereka dengan [SOV.GetNameDef]."
 lar_spain.68.a: "Dan mereka akan memilikinya."
 lar_spain.68.b: "Kita tidak bisa mempertaruhkan hubungan kita dengan Soviet."
 lar_spain.69.t: "[From.GetNameDefCap] Memberikan Bantuan"
 lar_spain.69.desc: "[From.GetNameDefCap] telah mendengar permohonan bantuan kami, dan mereka kini menawarkan untuk melibatkan kami secara lebih luas dalam program bantuan pinjam-sewa mereka."
 lar_spain.69.a: "Ini adalah berita yang sangat positif."
 lar_spain.70.t: "[From.GetNameDefCap] Menolak Bantuan"
 lar_spain.70.desc: "[From.GetNameDefCap] telah memberi tahu kami bahwa mereka saat ini tidak dapat memberikan bantuan kepada kami, karena sebagian besar dampaknya terhadap opini publik domestik dan internasional yang mereka khawatirkan mungkin disebabkan karena dianggap membantu tujuan kami."
 lar_spain.70.a: "Mereka meninggalkan kita untuk kedua kalinya."
 lar_spain.71.t: "[From.GetNameDefCap] Meminta NAP"
 lar_spain.71.desc: "Saat kami berdua berperang dengan Komunis, [From.GetNameDefCap] telah mengusulkan Pakta Non-Agresi. Hal ini akan memungkinkan kita untuk fokus pada ancaman Merah yang lebih mendesak, dan mengabaikan perbedaan yang ada saat ini."
 lar_spain.71.a: "Dibandingkan dengan penghapusan [SOV.GetNameDef], yang lainnya berada di urutan kedua."
 lar_spain.71.b: "Perjanjian dengan Partai Republik? Tidak pernah!"
 lar_spain.72.t: "[From.GetNameDefCap] Hibah NAP"
 lar_spain.72.desc: "Secara bijak, pemerintah [From.GetAdjective] telah menyetujui usulan Pakta Non-Agresi kami. Ini akan segera berdampak."
 lar_spain.72.a: "Mereka menyadari bahaya yang lebih besar."
 lar_spain.73.t: "[From.GetNameDefCap] Menolak tidur siang"
 lar_spain.73.desc: "[From.GetNameDefCap] telah mendengar usulan kami untuk Pakta Non-Agresi, namun telah memberi tahu kami bahwa mereka tidak melihat hal ini sebagai kepentingan terbaik mereka saat ini."
 lar_spain.73.a: "Apa yang mereka rencanakan?"
 lar_spain.74.t: "[From.GetNameDefCap] Minta Bantuan"
 lar_spain.74.desc: "[From.GetAdjective] telah meminta bantuan kami dalam perang mereka dengan [SOV.GetNameDef]. Mereka telah meyakinkan kita bahwa mereka tidak memerlukan banyak hal, dan bahwa sekadar berbagi informasi intelijen penting, atau membantu mereka dalam melatih staf komando mereka untuk melawan taktik [SOV.GetAdjective] dengan lebih baik sudah terbukti sangat berharga."
 lar_spain.74.a: "Ide yang bagus. Kematian bagi Soviet!"
 lar_spain.74.b: "Kita harus menjaga kelebihan kita dengan hati-hati."
 lar_spain.75.t: "[From.GetNameDefCap] Memberikan Bantuan"
 lar_spain.75.desc: "Setelah mempertimbangkan permintaan kami, [From.GetNameDef] telah mengusulkan untuk mengirim ahli militer untuk melatih staf komando kami dalam melawan strategi [SOV.GetAdjective] yang mereka hadapi dengan lebih baik, sekaligus memberi kami informasi intelijen tertentu yang berharga."
 lar_spain.75.a: "Hal ini terbukti sangat berharga dalam perjuangan kita melawan Soviet."
 lar_spain.76.t: "[From.GetNameDefCap] Menolak Bantuan"
 lar_spain.76.desc: "Terlepas dari permohonan kami, [From.GetNameDef] telah menolak bantuan apa pun dalam perjuangan kami melawan Soviet. Segala upaya untuk mendapatkan informasi berguna dari mereka mengenai front Soviet juga menemui jalan buntu."
 lar_spain.76.a: "Mereka menjaga semua rahasia mereka dengan cemburu."
 lar_spain.77.t: "Alfonso XIII Meninggal Dunia"
 lar_spain.77.desc1: "Setelah tinggal di pengasingan sejak proklamasi Republik Kedua pada tahun 1931, Raja terakhir yang memerintah Spanyol, Alfonso XIII, telah meninggal di Roma hari ini. Mengalah pada masalah jantung pada usia yang relatif dini, karena status pengasingannya dan situasi saat ini di [Root.GetNameDef] diperkirakan ia akan dimakamkan di Roma sendiri.\n\nSementara putra pertama dan kedua Alfonso telah melepaskan hak mereka atas takhta pada tahun 1933, dan tampaknya putra ketiganya, Infante Juan, akan menjadi pewaris, ada rumor bahwa putra kedua mendiang Raja, Infante Jaime, sedang mempertimbangkan untuk menegaskan kembali hak suksesinya."
 lar_spain.77.desc2: "Sebelumnya hari ini, Raja Alfonso XIII meninggal secara tak terduga di Madrid, setelah menderita sakit dada yang parah. Jenazah Raja akan segera disemayamkan di gereja San Jerónimo el Real di Madrid, sehingga masyarakat dapat memberikan penghormatan sebelum penguburan kerajaan.\n\nMeskipun sebelumnya telah melepaskan hak suksesinya karena tuli, putra kedua Raja, Infante Jaime, dengan cepat menegaskan kembali haknya atas takhta beberapa jam setelah kematian ayahnya. Mengingat dukungan Carlist yang sangat besar, adik laki-lakinya, Infante Juan, tidak mungkin dapat menentang klaim ini."
 lar_spain.77.a: "Raja sudah mati. Hidup el Rey!"
 lar_spain.78.t: "Sanjurjo Meninggal"
 lar_spain.78.desc: "Hanya beberapa hari setelah dimulainya perang saudara, pihak kami telah dilanda tragedi, karena pemimpin kudeta terpilih, José Sanjurjo, tewas dalam kecelakaan pesawat dalam perjalanan dari Portugal untuk mengambil alih komando pasukan Nasionalis di Spanyol.\n\nTampaknya, dalam upaya untuk memberikan kesan heroik sebagai \"penerbang pemberani\" sekembalinya ke tanah Spanyol setelah lebih dari dua tahun di pengasingan, sang Jenderal bersikeras untuk terbang dengan pesawat kecil daripada pesawat apa pun. pesawat-pesawat yang lebih besar yang tersedia, dan kemudian membebani pesawat itu dengan meminta semua barang bawaannya yang berat untuk dimasukkan ke dalam pesawat yang sama.\n\nMenabrak segera setelah lepas landas, ia tewas seketika, dan dengan melakukan hal tersebut telah mengurangi kepemimpinan Nasionalis menjadi sekumpulan jenderal yang saling bertengkar yang bersaing untuk mendapatkan kendali."
 lar_spain.78.a: "Dia terlalu berani."
 lar_spain.78_tt: "§YJosé Sanjurjo Meninggal Dunia.§!"
 lar_spain.79.t: "Penobatan [Root.GetLeader]"
 lar_spain.79.desc: "Diiringi dengan banyak kemegahan dan perayaan, hari ini menyaksikan penobatan Raja [Root.GetLeader] di Katedral Reims. Setelah upacara resmi, Raja menyapa orang banyak yang menunggu di luar, gembira melihat kembalinya negara mereka ke status monarki.\n\nDalam pidato yang ditujukan kepada rakyatnya, Raja menekankan kesatuan negara Perancis dan Spanyol, yang dilambangkan dalam dirinya. Di mana pun kepentingan orang Prancis terancam, mereka akan menemukan orang Spanyol di pihak mereka untuk memperjuangkan tujuan mereka."
 lar_spain.79.a: "Hari yang menyenangkan bagi Kerajaan!"
 lar_spain.81.t: "Harga Kemenangan"
 lar_spain.81.desc: "Karena beratnya keterlibatan kami dalam Perang Saudara Spanyol, pengaruh kami terhadap pemerintahan [SPD.GetAdjective] telah meluas hingga pada titik di mana mereka secara efektif menjadi negara satelit Moskow."
 lar_spain.81.a: "Pengaruh kami di Eropa Barat semakin meningkat!"
 lar_spain.82.t: "Harga Kemenangan"
 lar_spain.82.desc: "Kemenangan dalam perang saudara ada di tangan kita, namun ketergantungan kita yang besar pada bantuan Soviet berarti kita mempunyai hutang yang sangat besar yang harus dibayar kembali. Masa kacau perang saudara juga berarti bahwa kaum Stalinis telah berhasil menduduki posisi-posisi penting dalam militer dan pemerintahan baru kita. Oleh karena itu, kita berada dalam posisi yang sulit.\n\nMoskow sudah mulai membuat \"saran\" untuk menunjuk menteri dan pejabat yang setia kepada mereka, dan untuk saat ini kita tidak dapat menolak tuntutan mereka tanpa dampak ekonomi yang parah, atau lebih buruk lagi, memicu perang saudara baru. Jika kita ingin memperoleh kemerdekaan sejati, kita harus memainkan peran kita dengan hati-hati dan membuktikan kesetiaan kita, atau pertama-tama melemahkan dan membongkar pengaruh Stalinis terhadap negara kita."
 lar_spain.82.a: "Kita akan lihat sampai kapan kondisi ini berlangsung."
 lar_spain.83.t: "Tanda-tanda Pengkhianatan"
 lar_spain.83.desc: "Selama beberapa minggu terakhir, penghubung, perwakilan, dan menteri serta perwira setia Stalinis di [SPD.GetNameDef] telah berulang kali dirahasiakan informasi penting dan tidak diberi akses ke pejabat pemerintah dan militer [SPD.GetAdjective]. Sekarang telah sampai kepada kita bahwa orang-orang kita secara sistematis disingkirkan dari posisi-posisi yang berpengaruh, dan bahkan program bantuan luar negeri kita pun dihalangi.\n\n\"Kebetulan-kebetulan\" seperti ini tidak mungkin murni kebetulan. Pemerintah [SPD.GetAdjective] menunjukkan tanda-tanda pengkhianatan dan keinginan untuk mengingkari kewajibannya terhadap [SOV.GetNameDef], dan suara-suara di Moskow mulai menyerukan tindakan hukuman dan pengetatan kendali."
 lar_spain.83.a: "Kami akan mengirimkan pesan dengan menetapkan zona pendudukan di Catalonia."
 lar_spain.83.b: "Semuanya pasti akan berjalan dengan sendirinya tanpa campur tangan kita."
 lar_spain.84.t: "Zona Pendudukan Catalan"
 lar_spain.84.desc: "Kesabaran Moskow terhadap upaya kami yang secara sistematis menghalangi upaya mereka untuk meningkatkan kendali atas pemerintah kami kini telah mencapai puncaknya. Uni Soviet secara sepihak telah menetapkan zona pendudukan di Catalonia, Valencia, dan sebagian Aragon, dengan pemerintahan independen namun tampaknya tidak mempunyai kekuasaan nyata. Kekuatan komunis yang setia telah berbondong-bondong ke zona baru ini, bersumpah untuk mendukung \"pemerintahan\" yang pro-Moskow.\n\nPesannya jelas: patuhi instruksi dari Moskow atau akan ada tindakan hukuman lebih lanjut. Meskipun kecil kemungkinannya mereka akan mampu memperluas pengaruh mereka sebelum rencana kita terwujud, tidak diragukan lagi akan menjadi tantangan untuk mengusir kekuasaan Soviet atas tanah kita."
 lar_spain.84.a: "Ketegangan meningkat. Kita harus segera melanjutkan rencana kita!"
 lar_spain.85.t: "[SPD.GetNameDefCap] Mengamankan [SPR_stolen_state_name.GetName]"
 lar_spain.85.desc: "Pasukan kami telah sepenuhnya mengamankan [SPR_stolen_state_name.GetName], mengusir semua pendukung Soviet dan pemimpin lokal yang pro-Moskow, dan kami dengan cepat membangun kembali pemerintahan lokal [SPD.GetAdjective] di wilayah tersebut."
 lar_spain.85.a: "Kami membersihkan negara kami dari pengaruh Stalinis satu per satu!"
 lar_spain.88.t: "[SPD.GetNameDefCap] Mengamankan [SPR_stolen_state_name.GetName]"
 lar_spain.88.desc: "Pasukan [SPD.GetAdjective] telah mengamankan sepenuhnya [SPR_stolen_state_name.GetName], menggulingkan pendukung kami dan pemimpin lokal pro-Moskow, dan dengan cepat membangun kembali pemerintahan lokal mereka sendiri di wilayah tersebut."
 lar_spain.88.a: "Pertempuran yang dimenangkan bukan berarti perang yang dimenangkan."
 lar_spain.89.t: "[From.GetNameDefCap] Menerima Permintaan"
 lar_spain.89.desc: "Di luar dugaan, pemerintah [From.GetAdjective] mundur dan menyetujui tuntutan kemerdekaan kami. Tampaknya mereka tidak ingin terlibat dalam konflik lain yang terjadi di Eropa barat."
 lar_spain.89.a: "Lagipula mereka pasti kalah."
 lar_spain.90.t: "Pemberhentian Niceto Alcalá-Zamora"
 lar_spain.90.desc: "Perebutan kekuasaan antara berbagai partai Kiri, yang baru-baru ini bersatu dalam kemenangan pemilu tahun 1936, telah mencapai puncaknya. Khawatir terhadap kebijakan Presiden Niceto Alcalá-Zamora yang bersifat sentris dan kompromistis, para pendukungnya yang terasing di Cortes menilai pembubaran Cortes justru mengakibatkan pemilu menjadi inkonstitusional, dan memecatnya dari jabatannya.\n\nSebagai pengganti Alcalá-Zamora, Cortes telah memilih saingan lamanya, Manuel Azaña, yang kini mewarisi tugas yang tidak menyenangkan untuk mengembalikan stabilitas ke kancah politik Spanyol yang semakin terpolarisasi."
 lar_spain.90.a: "Kekacauan telah selesai."
 SPR_spanish_elections_flag: "Pemilu Spanyol tahun 1936 diadakan"
 lar_heavy_water.1.t: "Pabrik Air Berat Telemark hancur"
 lar_heavy_water.1.desc: "Komandan garnisun di Telemark melaporkan bahwa pembangkit listrik tenaga air Vemork mengalami ledakan dahsyat tadi malam yang menghancurkan fasilitas yang digunakan untuk memproduksi Air Berat. Meskipun penyelidikan masih berlangsung, bukti yang ada sangat kuat menunjukkan adanya sabotase yang dilakukan oleh unit elit musuh.\n\nTampaknya pasukan komando terjun payung ke daerah tersebut, menyusup ke pabrik dengan memanfaatkan lemahnya keamanan, menempatkan bahan peledak di dekat tangki penyimpanan dan kemudian mundur di malam hari hanya beberapa menit sebelum bom meledak.\n\nTidak ada korban sipil yang dilaporkan, membuat komandan berspekulasi bahwa perlawanan lokal mungkin mengetahui sebelumnya tentang serangan tersebut. serangan. Garnisun setempat sekarang sedang melakukan penyisiran di daerah tersebut, namun tidak ada petunjuk yang ditemukan, dan kami perkirakan tim sudah mengevakuasi daerah tersebut."
 lar_heavy_water.1.a: "Sebuah kemunduran yang signifikan."
 lar_heavy_water.2.t: "Operasi Gunnerside berhasil"
 lar_heavy_water.2.desc: "Laporan dari kontak lokal di Telemark menunjukkan bahwa Operasi Gunnerside sukses total. Setelah melakukan penyisipan dengan parasut, tim berhasil menyusup ke pabrik, menghindari semua penjaga.\n\nSetelah memasang muatan, tim berhasil melarikan diri dan kini berpencar untuk menghindari tim pencari yang mengejar mereka. Kami belum mendengar apa pun dari tim sejak penggerebekan, tetapi hal ini sudah diduga. Kami juga mengharapkan Jerman untuk mengumumkan secara terbuka jika mereka membunuh atau menangkap salah satu pasukan komando kami."
 lar_heavy_water.2.a: "Siapa yang berani menang."
 lar_bruneval_raid.1.t: "Serangan Komando Musuh menangkap peralatan radar"
 lar_bruneval_raid.1.desc: "Laporan tentang serangan musuh telah tiba, menunjukkan bahwa pasukan musuh dalam jumlah kecil menyerang salah satu instalasi radar kami. Setelah pertahanan garnisun yang penuh semangat, namun pada akhirnya gagal, pasukan musuh mengambil kendali instalasi tersebut untuk waktu yang singkat sebelum serangan balik yang segera dilaksanakan dengan penuh semangat mendorong mereka kembali ke pantai, di mana mereka buru-buru menaiki kapal pendarat dan berangkat.\n\nPemeriksaan menyeluruh terhadap instalasi radar mengungkapkan bahwa sejumlah komponen telah dilepas, dan penghitungan gulungan menunjukkan bahwa salah satu teknisi radar tidak ada, mungkin telah diculik oleh perampok musuh."
 lar_bruneval_raid.1.a: "Sungguh cara yang pengecut untuk berperang."
 lar_bruneval_raid.2.t: "Operasi Menggigit berhasil"
 lar_bruneval_raid.2.desc: "Serangan terhadap instalasi radar musuh sukses total. Unit penyerang berhasil mendarat, dengan hamburan minimal dari paradrop.\n\nSetelah mengumpulkan peralatan dan mengarahkan diri, pasukan terjun payung bergerak menuju sasaran dan menghancurkan garnisun yang lemah dalam baku tembak yang singkat namun sengit. Setelah area tersebut diamankan, teknisi radar yang mendampingi pasukan penyerang mengambil foto peralatan radar dan membongkar komponen-komponen terpilih untuk diangkut kembali ke kami.\n\nSetelah baku tembak kedua dengan garnisun yang disiagakan, pantai evakuasi dibersihkan dan pasukan menaiki kapal pendarat untuk diangkut kembali ke garis kami, membawa serta teknisi radar musuh untuk diinterogasi."
 lar_capture_tito.1.t: "Unternehmen Rösselsprung gagal"
 lar_capture_tito.1.desc: "Operasi kami untuk menangkap atau membunuh pemimpin partisan Yugoslavia, Tito, belum berhasil. Gelombang pertama pasukan lintas udara turun cukup dekat ke gua tempat kami mencurigai Tito bersembunyi, namun dibalas dengan tembakan mematikan dari unit musuh yang kuat yang luput dari perhatian intelijen kami. Saat pasukan kami bertempur dengan gagah berani, bala bantuan musuh tiba lebih cepat dari yang diperkirakan. Bahkan upaya terobosan yang putus asa pun tidak berhasil.\n\nYang selamat telah mundur ke garis persahabatan. Keberadaan Tito saat ini tidak diketahui."
 lar_capture_tito.1.a: "Dia lolos kali ini."
 lar_capture_tito.2.t: "Unternehmen Rösselsprung berhasil"
 lar_capture_tito.2.desc: "Operasi kami untuk melenyapkan pemimpin partisan Tito telah sukses total. Meskipun musuh mengharapkan serangan, kombinasi dukungan udara jarak dekat dan serangan langsung terhadap markas besar Tito oleh pasukan darat membuat mereka terkejut. Setelah baku tembak sengit di dalam dan sekitar markas gua, jenazah Tito ditemukan di antara korban tewas."
 lar_capture_tito.2.a: "Kami menangkapnya."
 Tito_killed: "§YJosip Broz Tito§! telah terbunuh."
 lar_rescue_mussolini.1.t: "Upaya penyelamatan gagal"
 lar_rescue_mussolini.1.desc: "Upaya untuk menyelamatkan Mussolini gagal dan memakan banyak korban jiwa. Karena kelebihan pasukan dan peralatan, beberapa pesawat layang yang digunakan untuk mengangkut pasukan terjun payung gagal mencapai ketinggian yang cukup untuk melintasi gunung dan jatuh dalam cuaca buruk. Dengan hanya sebagian kecil dari pasukan penyerang yang tersedia, sang komandan memutuskan untuk bertaruh pada kecepatan dan kejutan.\n\nSayangnya, penjaga penjara berada dalam keadaan siaga penuh dan melepaskan tembakan ketika kelompok penyerang mencoba memaksa masuk ke hotel. Setelah pertarungan singkat, dengan posisinya yang tidak dapat dipertahankan dan amunisi yang hampir habis, sang komandan menawarkan penyerahan pasukannya."
 lar_rescue_mussolini.1.a: "Itu patut dicoba."
 lar_rescue_mussolini.2.t: "Mussolini Diselamatkan"
 lar_rescue_mussolini.2.desc: "Misi pembebasan Mussolini berhasil. Unit kecil pasukan terjun payung berhasil mendarat di dekat hotel dan menyerbu gedung tanpa ada tembakan. Penjaga setempat mundur setelah menyadari perlawanan yang sia-sia. Mussolini kemudian diterbangkan dengan Fiesler Storch dan kembali ke jalur persahabatan, dari sana dia akan melakukan perjalanan untuk bertemu [GER.GetLeader]."
 lar_rescue_mussolini.2.a: "Kami tidak melupakan teman-teman kami."
 lar_operative_event.1.t: "Agen Ditangkap"
 lar_operative_event.1.desc: "Saat dikerahkan di belakang garis musuh, [This.GetName] ditangkap oleh [From.From.GetAdjective] kontra-intelijen musuh. Laporan dari sumber lain menunjukkan bahwa [This.GetSheHe] ditahan di lokasi terpencil untuk diinterogasi. Meskipun kami percaya bahwa [This.GetSheHe] akan berusaha menolak interogasi selama mungkin, kemungkinan besar musuh pada akhirnya akan mendapatkan informasi intelijen yang berguna kecuali [This.GetSheHe] diselamatkan atau dibunuh sebelum [This.GetSheHe] pecah."
 lar_operative_event.1.a: "Kita harus melakukan operasi penyelamatan!"
 lar_operative_event.2.t: "Agen terpaksa bersembunyi"
 lar_operative_event.2.desc: "Saat bertugas di [From.From.GetNameDef], [This.GetName] ternyata terdeteksi oleh [From.From.GetAdjective] kontra intelijen. Pesan terakhir yang dikirim [This.GetSheHe] mengatakan bahwa [This.GetSheHe] memperhatikan pengawasan musuh mengikuti [This.GetHerHim] dan bahwa [This.GetSheHe] akan melakukan prosedur penghindaran dan pelarian.\n\nSebagai bagian dari prosedur ini, [This.GetName] secara alami akan memutuskan kontak dengan penangan [This.GetHerHis] untuk menghindari kompromi terhadap mereka atau orang lain.\n\nJika berhasil, [This.GetName] akan menghubungi kami lagi dalam beberapa minggu."
 lar_operative_event.2.a: "Kita tidak bisa berbuat apa-apa selain menunggu dan berharap."
 lar_operative_event.3.t: "Agen Terbunuh"
 lar_operative_event.3.desc: "Tampaknya [This.GetName], salah satu agen kami yang ditempatkan di [From.From.GetNameDef], telah melakukan pengorbanan terbesar dan meninggal saat menjalankan tugas. Laporan dari sumber [From.From.GetAdjective] tentu saja jarang, namun tampaknya [This.GetName] dilacak oleh [From.From.GetAdjective] kontra-intelijen. Tampaknya [This.GetSheHe] akan ditangkap dan memilih mati untuk menghindari memberikan informasi penting saat diinterogasi atau dibunuh oleh agen [From.From.GetAdjective] saat menolak penangkapan."
 lar_operative_event.3.a: "Seorang pahlawan, dipanggil ke [This.GetHerHis] peristirahatan terakhir."
 lar_operative_event.4.t: "Agen Terluka"
 lar_operative_event.4.desc: "Menyusul pertemuan dekat dengan [From.From.GetAdjective] kontra-intelijen, [This.GetName] telah melaporkan bahwa [This.GetSheHe] akan keluar dari tugas untuk sementara waktu untuk merawat cedera yang diderita [This.GetSheHe] saat melawan upaya untuk menahan [This.GetHerHim].\n\n[This.GetName] sekarang berada di lokasi yang aman, merawat [This.GetHerHis] luka, dan tidak akan tersedia selama beberapa minggu sementara [This.GetSheHe] pulih."
 lar_operative_event.4.a: "[This.GetSheHe] akan segera kembali bertarung."
 lar_operative_event.5.t: "Agen Musuh berbalik"
 lar_operative_event.5.desc: "Badan kontra-intelijen kami telah mencapai keberhasilan besar: setelah interogasi ekstensif, dan setelah diberitahu tentang [This.GetHerHis] kemungkinan nasib jika [This.GetSheHe] didakwa melakukan spionase, agen [From.From.GetAdjective] yang ditangkap [This.GetName] telah setuju untuk bekerja sama dengan kami dengan imbalan amnesti penuh atas [This.GetHerHis] kejahatan terhadap negara.\n\nDengan [This.GetHerHis] pengetahuan mendalam tentang cara kerja badan intelijen [From.From.GetAdjective], [This.GetSheHe] pasti akan lebih mudah menyusup [From.From.GetNameDef] dan tetap tidak terdeteksi oleh [From.From.GetAdjective] kontra-intelijen."
 lar_operative_event.5.a: "Tapi kami berharap [This.GetHerHim] mati?"
 lar_operative_event.6.t: "[From.GetAdjective] Operasi Ditangkap!"
 lar_operative_event.6.desc: "[This.GetName] telah tertangkap mencoba menyusup ke pemerintahan kami dan membocorkan informasi rahasia kembali ke atasan [This.GetHerHis]. Setelah diinterogasi, [This.GetSheHe] mengungkapkan [This.GetHerselfHimself] adalah aset asing untuk [From.GetAgency] yang beroperasi di tanah [From.From.GetAdjective]. Masih belum diketahui apa sebenarnya sifat dari kepentingan [From.GetAdjective] terhadap bangsa kita atau bagian mana dari pemerintahan kita yang telah terpapar oleh intelijen [From.GetAdjective]. Dengan [This.GetName] dipenjara dan menunggu interogasi lebih lanjut, kami hanya bisa berharap bahwa pada akhirnya [This.GetSheHe] akan mengungkapkan semua yang perlu diketahui tentang operasi [From.GetAdjective] di [From.From.GetNameDef]."
 lar_operative_event.6.a: "Kami punya cara untuk membuat Anda berbicara."
 occupied_countries.1.title: "Pemerintahan Sementara [From.From.GetNameDef]"
 occupied_countries.1.desc: "Setelah upaya yang panjang dan terpadu untuk meningkatkan kerja sama dan kepatuhan antara pasukan pendudukan dan otoritas sipil setempat, kami kini siap untuk mengembalikan kendali atas [From.From.GetNameDef] ke tangan pemerintah daerah. Pemerintahan baru ini terdiri dari warga sipil yang simpatik dan siap berkoordinasi erat dengan kami."
 occupied_countries.1.a: "Mereka mendapat restu kita."
 occupied_countries.1.b: "Mereka belum siap."
 lar_news.1.t_franco: "Kemenangan Nasionalis dalam Perang Saudara Spanyol"
 lar_news.1.t_falangist: "Kemenangan Falang dalam Perang Saudara Spanyol"
 lar_news.1.t_carlists: "Kemenangan Carlist dalam Perang Saudara Spanyol"
 lar_news.1.desc_franco: "Setelah perang saudara yang panjang dan melelahkan, kaum Nasionalis, yang bersatu di bawah Francisco Franco, akhirnya mengalahkan musuh-musuh mereka dari Partai Republik dan mendapatkan kendali penuh atas Spanyol. Walaupun kelompok-kelompok pasukan Republik yang terisolasi terus melakukan perang gerilya yang mungkin akan menghambat upaya kontrol Nasionalis lokal di wilayah-wilayah yang sebelumnya merupakan wilayah Republik, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nSementara negara ini berfokus pada pembangunan kembali kota-kota dan industri yang dilanda perang, masih harus dilihat apa dampak penggabungan ideologi kaum Nasionalis terhadap kebijakan luar negeri mereka, dan apakah bantuan militer luar negeri yang mereka terima akan dibayar kembali."
 lar_news.1.desc_franco_unified: "Beberapa minggu terakhir ini terlihat ketegangan meningkat antara berbagai faksi di kalangan Nasionalis yang menang, namun sekarang, dengan diusirnya para pemimpin yang bandel dan penyatuan partai-partai politik yang kuat, Francisco Franco tampaknya telah mampu memperbaiki perpecahan ini, dan dengan demikian menyatukan faksi-faksi yang tersisa di belakang perjuangannya. Meskipun pasukan Republik yang terisolasi terus mengobarkan perang gerilya, Perang Saudara pada akhirnya dapat dianggap telah berakhir dengan baik dan benar.\n\nSeiring dengan fokus negara ini pada pembangunan kembali kota-kota dan industri yang dilanda perang, masih harus dilihat apa dampak penggabungan ideologi kaum Nasionalis terhadap kebijakan luar negeri mereka, dan apakah bantuan militer luar negeri yang mereka terima akan dibayar kembali."
 lar_news.1.desc_franco_uprising: "Perbedaan pendapat dalam kubu Nasionalis terbukti terlalu besar untuk diatasi, namun setelah perang saudara yang panjang dan melelahkan, kaum Nasionalis di bawah pimpinan Francisco Franco akhirnya mengalahkan musuh-musuh Carlist dan Partai Republik dan mendapatkan kendali penuh atas Spanyol. Meskipun kelompok-kelompok pasukan Republik yang terisolasi terus melakukan perang gerilya yang mungkin akan menghambat upaya kontrol Nasionalis lokal di wilayah-wilayah yang sebelumnya merupakan wilayah Republik, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nKarena negara ini berfokus pada pembangunan kembali kota-kota dan industri yang dilanda perang, masih harus dilihat apakah bantuan militer luar negeri yang mereka terima akan dibayar kembali."
 lar_news.1.desc_falangist: "Setelah perang saudara yang panjang dan melelahkan, kaum Nasionalis di bawah Emilio Mola akhirnya mengalahkan musuh-musuh Carlist dan Partai Republik dan mendapatkan kendali penuh atas Spanyol. Meskipun pasukan Republik yang berada di kantong-kantong terisolasi terus melakukan perang gerilya yang mungkin akan menghambat pelaksanaan kontrol Nasionalis lokal di wilayah yang sebelumnya merupakan wilayah Republik, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nKetika negara ini membangun kembali kota-kota dan industri yang dilanda perang, persiapan sedang dilakukan untuk transisi kembali ke pemerintahan sipil di bawah pemerintahan José Antonio Primo de Rivera. Masih harus dilihat apa yang mungkin diwujudkan oleh ambisi imperialis Spanyol dalam krisis dunia saat ini."
 lar_news.1.desc_carlists: "Pasukan Carlist di bawah pimpinan Manuel Fal Conde akhirnya mengalahkan musuh-musuh Falang dan Partai Republik dan mendapatkan kendali penuh atas Spanyol. Meskipun pasukan Republik yang berada di kantong-kantong terisolasi terus mengobarkan perang gerilya yang mungkin akan menghambat pelaksanaan kendali lokal Carlist di wilayah yang sebelumnya merupakan wilayah Republik, kecil kemungkinan perlawanan terkoordinasi lebih lanjut yang signifikan akan terwujud.\n\nKeberanian dan fanatisme Carlist Requetés adalah kunci dalam mengamankan kemenangan mereka, dan semangat tinggi yang sama ini menjadi ciri upaya pembangunan kembali Spanyol pascaperang. Namun, dengan berakhirnya perang, banyak Carlist yang tidak sabar menunggu upaya mereka membuahkan hasil dan penggugat Carlist yang sah pada akhirnya akan naik takhta Spanyol."
 lar_news.1.a: "Sebuah kemenangan yang bisa kami setujui."
 lar_news.1.b: "Orang-orang fanatik ini terus hidup di abad pertengahan..."
 lar_news.1.c: "Hasil yang luar biasa!"
 lar_news.1.e: "Hasil yang disayangkan."
 lar_news.1.f: "¡Gerra telah berakhir!"
 lar_news.1.t_republic: "Kemenangan Partai Republik dalam Perang Saudara Spanyol"
 lar_news.1.t_stalinist: "Kemenangan Stalinis dalam Perang Saudara Spanyol"
 lar_news.1.t_independent_communist: "Kemenangan POUM dalam Perang Saudara Spanyol"
 lar_news.1.t_anarchists: "Kemenangan Anarkis dalam Perang Saudara Spanyol"
 lar_news.2.desc_republic_no_help: "Setelah perang saudara yang panjang dan melelahkan, Republik Kedua akhirnya mengalahkan musuh-musuh Anarkis dan Nasionalis mereka dan mendapatkan kendali penuh atas Spanyol. Meskipun kelompok-kelompok pasukan Nasionalis yang terisolasi terus melakukan perang gerilya yang mungkin akan menghambat penggunaan kontrol lokal Partai Republik di wilayah-wilayah yang sebelumnya merupakan wilayah Nasionalis, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nMelawan segala rintangan, dan hanya mengandalkan sedikit bantuan Soviet, Republik Spanyol mampu mempertahankan integritas demokrasinya meski dikepung oleh musuh-musuh internal dan eksternal. Ketika negara ini berfokus pada pembangunan kembali kota-kota dan industri yang dilanda perang, masih harus dilihat apa yang akan dilakukan oleh Spanyol yang demokratis dalam krisis dunia saat ini."
 lar_news.2.desc_republic_soviet_help: "Dengan bantuan Soviet yang luas, Republik Kedua akhirnya mengalahkan musuh-musuh Anarkis dan Nasionalis mereka dan mendapatkan kendali penuh atas Spanyol. Meskipun kelompok-kelompok pasukan Nasionalis yang terisolasi terus mengobarkan perang gerilya yang mungkin akan menghambat upaya kontrol lokal Partai Republik di wilayah-wilayah yang sebelumnya merupakan wilayah Nasionalis, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nSeiring dengan fokus negara ini pada pembangunan kembali kota-kota dan industri yang dilanda perang, tekanan Soviet terhadap negara tersebut semakin meningkat, dan masih harus dilihat apakah pemerintahan demokratis Spanyol dapat tetap setia pada prinsip-prinsip demokrasinya, atau apakah Spanyol hanya akan menjadi sekadar pos terdepan pengaruh Moskow di Eropa Barat."
 lar_news.2.desc_stalinist: "Setelah perang saudara yang panjang dan melelahkan, Republik Kedua akhirnya mengalahkan musuh-musuh Anarkis dan Nasionalis mereka dan mendapatkan kendali penuh atas Spanyol. Meskipun kantong-kantong pasukan Nasionalis yang terisolasi terus mengobarkan perang gerilya yang mungkin menghambat penggunaan kontrol lokal Partai Republik di wilayah-wilayah yang sebelumnya merupakan wilayah Nasionalis, kecil kemungkinan perlawanan terkoordinasi lebih lanjut yang signifikan akan terwujud.\n\nPerang saudara menyaksikan transisi damai Spanyol ke pemerintahan komunis yang mendapatkan bantuan besar dari Soviet. Ketika negara ini berfokus pada pembangunan kembali kota-kota dan industri yang dilanda perang, hubungan Spanyol-Soviet tampaknya semakin menguat, dan Uni Soviet diperkirakan akan sangat terlibat dalam program pemulihan industri pascaperang."
 lar_news.2.desc_independent_communist: "Setelah perang saudara yang panjang dan melelahkan, kelompok komunis independen Spanyol akhirnya mengalahkan musuh-musuh mereka dari Partai Republik dan Nasionalis dan mendapatkan kendali penuh atas Spanyol. Meskipun kelompok-kelompok pasukan Nasionalis yang terisolasi terus mengobarkan perang gerilya yang mungkin akan menghambat pelaksanaan kontrol Komunis lokal di wilayah-wilayah yang sebelumnya merupakan wilayah Nasionalis, kecil kemungkinan perlawanan terkoordinasi lebih lanjut akan terwujud.\n\nSementara negara ini berfokus pada pembangunan kembali kota-kota dan industri yang dilanda perang, negara komunis Spanyol yang baru telah memutuskan semua hubungan dengan [SOV.GetNameDef], namun telah mengundang semua partai komunis yang menolak baik Stalinisme maupun Trotskisme untuk bergabung dengan mereka dalam menempa jalan maju yang mandiri."
 lar_news.2.desc_anarchists: "Setelah perang saudara yang panjang dan melelahkan, kaum Anarkis Spanyol akhirnya mengalahkan musuh-musuh mereka dari Partai Republik dan Nasionalis dan mendapatkan kendali penuh atas Spanyol. Meskipun kantong-kantong pasukan Nasionalis yang terisolasi terus mengobarkan perang gerilya yang mungkin menghambat pembentukan komune-komune damai di wilayah-wilayah yang sebelumnya merupakan wilayah Nasionalis, kecil kemungkinan perlawanan terkoordinasi lebih lanjut yang signifikan akan terwujud.\n\nKarena berbagai komune fokus pada pembangunan kembali desa, kota kecil, kota besar, dan industri yang dilanda perang, mereka memilih untuk tetap terorganisir di bawah Dewan Pertahanan Regional pada masa perang, yang tampaknya merupakan respons terhadap retorika permusuhan yang semakin meningkat dalam reaksi berbagai pemimpin dunia terhadap kemenangan Anarkis."
 lar_news.2.a: "'Kemenangan' ini tidak bisa dibiarkan bertahan lama!"
 lar_news.2.b: "Sebuah alternatif yang menarik terhadap bentuk-bentuk komunisme yang sudah mengakar."
 lar_news.2.c: "Setidaknya mereka bukanlah antek-antek Stalin."
 lar_news.2.d: "Parodi terhadap komunisme ini tidak boleh dibiarkan berkembang!"
 lar_news.2.e: "Kemenangan yang mengesankan!"
 lar_news.2.f: "Setidaknya bukan kaum Fasis yang menang."
 lar_news.2.g: "Hasil terbaik yang mungkin."
 lar_news.2.h: "Pengaruh [SOV.GetAdjective] terhadap [SPD.GetNameDef] memprihatinkan..."
 lar_news.3.t: "Kongres Paris"
 lar_news.3.desc: "Setelah negosiasi ekstensif antara perwakilan [FRA.GetNameDef], [ITA.GetNameDef], [POR.GetNameDef] dan [SPA.GetNameDef], Kongres Paris telah memutuskan untuk menggambar ulang perbatasan Afrika, dengan [FRA.GetLeader] menyebut hasil tersebut sebagai \"keberhasilan terbesar diplomasi Prancis dalam sejarah tertulis\".\n\nPemerintah negara kolonial lainnya dengan cepat mengecam perjanjian tersebut, menyebutnya sebagai \"ancaman terhadap perdamaian dan ketertiban di benua ini\".\n\nDengan adanya perjanjian yang memberikan sebidang tanah yang luas kepada negara-negara yang belum memilikinya, kecil kemungkinan rencana yang dibuat di Paris dapat dilaksanakan tanpa pertumpahan darah."
 lar_news.3.a: "Mereka akan segera mendatangi kita."
 lar_news.3.b: "Saatnya untuk menggambar ulang perbatasan Afrika."
 lar_news.3.c: "Sebuah divisi baru untuk benua ini."
 lar_news.4.t: "Pemerintah Perancis kembali ke Paris"
 lar_news.4.desc: "Setelah negosiasi di tingkat tertinggi, [GER.GetLeader] hari ini mengumumkan bahwa pemerintahan militer Jerman di Prancis utara akan segera berakhir, dan wilayah tersebut kembali ke kedaulatan penuh Prancis. Sebagai imbalannya, [VIC.GetLeader] mengumumkan bahwa pemerintahannya telah bergabung dengan Pakta Baja.\n\nTentara Jerman yang saat ini mempertahankan wilayah tersebut untuk sementara akan tetap berada di sana, sampai mereka dapat digantikan oleh pasukan Prancis. Pertanyaan yang lebih kontroversial, seperti status Alsace-Lorraine, tidak dibahas, dan tampaknya wilayah tersebut tetap berada di bawah pemerintahan Jerman."
 lar_news.4.a: "Kami menyambut saudara seperjuangan kami!"
 lar_news.4.b: "Jadi kehormatan mereka bisa dibeli dengan harga murah?"
 lar_news.4.c: "Pertanyaan tentang legitimasi tampaknya telah terselesaikan."
 lar_news.4.d: "'A' Pemerintah Perancis. Bukan 'Pemerintah' Perancis."
 lar_news.4.e: "Kita kembali ke tempat asal kita."
 lar_news.5.t: "Front Stresa meratifikasi"
 lar_news.5.desc: "Meskipun pada awalnya mengalami kemunduran dan perbedaan pendapat mengenai invasi Italia ke Ethiopia, para pemimpin [This.GetStresaMembers] telah bersatu untuk mengubah perjanjian yang dicapai pada bulan April 1935 menjadi janji aliansi resmi.\n\nSebagai bagian dari negosiasi, [This.GetStresaConcessions] Meskipun para pemimpin aliansi baru ini mengklaim bahwa perjanjian tersebut hanya bertujuan untuk menjaga perdamaian di Eropa, banyak diplomat setuju bahwa perjanjian tersebut terutama dimaksudkan untuk membatasi Jerman."
 lar_news.5.a: "Ketika Italia berbicara, dunia mendengarkan."
 lar_news.5.b: "Aliansi kami semakin kuat."
 lar_news.5.c: "Lingkaran di sekitar Jerman ditutup."
 lar_news.5.d: "Sisi selatan kami aman."
 lar_news.5.e: "Italia adalah sekutu yang dapat diandalkan seperti sebelumnya."
 LaR_Britain_Stresa_agreed: "[FRA.GetNameDef], [ENG.GetNameDef] dan [ITA.GetNAmeDef]"
 LaR_Britain_Stresa_refused: "[FRA.GetNameDef] dan [ITA.GetNAmeDef]"
 LaR_Britain_Stresa_Concessions: "pemerintah Perancis menyerahkan pelabuhan Djibouti ke Italia, sementara [ENG.GetNameDef] menyerahkan kendali atas British-Somaliland."
 LaR_France_Stresa_Confessions: "pemerintah Perancis menyerahkan pelabuhan Djibouti ke Italia."
 lar_news.6.t: "Prancis menyelaraskan kembali Kebijakan Luar Negerinya"
 lar_news.6.desc: "Presiden [FRA.GetLeader] telah mengumumkan perubahan besar dalam kebijakan luar negeri Prancis, termasuk peninjauan menyeluruh terhadap aliansi strategis dan jaminan politik yang dibuat oleh pemerintahan sebelumnya.\n\nSecara khusus, jaringan aliansi yang mengikat Prancis dengan negara-negara di Eropa Timur akan \"di bawah pengawasan\", yang oleh banyak pengamat dianggap sebagai aliansi yang akan dibubarkan.\n\nPemimpin di [POL.GetNameDef], [CZE.GetNameDef] dan [ROM.GetNameDef] sejauh ini menolak berkomentar mengenai masalah ini atau kemungkinan reaksi apa pun."
 lar_news.6.a: "Kami dikhianati lagi."
 lar_news.6.b: "Apakah kita selanjutnya?"
 lar_news.6.c: "Apa rencana Prancis?"
 lar_news.6.d: "Kita tidak akan terseret ke dalam perang lagi melalui aliansi bodoh."
 lar_news.6.e: "Mereka dengan bijak menjauhi hal-hal yang bukan urusan mereka."
 lar_portugal_iberian_summit.1.t: "KTT Iberia"
 lar_portugal_iberian_summit.1.desc: "Kami telah menerima surat dari [From.GetNameDef] yang menyarankan agar kita meninggalkan perbedaan dan mulai bekerja sama menuju tujuan bersama. Mereka mengusulkan agar kita mendiskusikan permintaan bersama untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName] dan menyerahkannya ke [?global.POR_iberian_summit_target.GetNameDef].\n\nKita harus mengevaluasi tidak hanya apakah keberhasilan proposal ini benar-benar layak, tetapi juga apakah itu benar-benar sesuai dengan kepentingan kita."
 lar_portugal_iberian_summit.1.a: "Proposal ini sesuai dengan kepentingan kami."
 lar_portugal_iberian_summit.1_a_tt: "Proposal akan segera kami kirimkan ke [GER.GetFlag][GER.GetNameDefCap]."
 lar_portugal_iberian_summit.1.b: "Kita harus mendekati diplomat [?global.POR_iberian_summit_target.GetAdjective] terlebih dahulu."
 lar_portugal_iberian_summit.1_b_tt: "Proposal akan dikirim ke [GER.GetFlag][GER.GetNameDefCap] dalam enam bulan."
 lar_portugal_iberian_summit.1.c: "Ini adalah ide yang konyol!"
 lar_portugal_iberian_summit.2.t: "KTT Iberia - [From.GetNameDef] Menerima"
 lar_portugal_iberian_summit.2.desc: "Pemerintah [From.GetAdjective] telah menerima proposal kami untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName]. Bersama-sama, kami telah menandatangani permintaan untuk mengirimkan ke [?global.POR_iberian_summit_target.GetNameDef] sesegera mungkin."
 lar_portugal_iberian_summit.2.a: "Kirimkan permintaan segera."
 lar_portugal_iberian_summit.3.t: "KTT Iberia - [From.GetNameDef] Menunda Permintaan"
 lar_portugal_iberian_summit.3.desc: "Pemerintah [From.GetAdjective] menyatakan bahwa kita akan memiliki peluang lebih besar untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName] jika kita meluangkan waktu untuk mendekati diplomat [?global.POR_iberian_summit_target.GetAdjective] tertentu sebelum mengajukan proposal kita ke [?global.POR_iberian_summit_target.GetNameDef]. Dengan cara ini kita akan memperoleh pengetahuan kritis tentang maksud dan tujuan [?global.POR_iberian_summit_target.GetAdjective] sehingga kita dapat membuat proposal yang lebih sesuai dengan kepentingan mereka."
 lar_portugal_iberian_summit.3.a: "Semoga saja itu sepadan..."
 lar_portugal_iberian_summit.4.t: "Negara-negara Iberia Berusaha Bergabung dengan [Root.GetFactionName]"
 lar_portugal_iberian_summit.4.desc: "Spanyol dan Portugal telah mengirimkan permintaan bersama kepada kami untuk bergabung dengan [Root.GetFactionName]. Mereka mengharapkan kita untuk menerima kedua negara Iberia ke dalam aliansi kita.\n\nSaat kami menilai kemungkinan mengamankan akses ke Mediterania, komandan militer kami khawatir tentang kemungkinan membuka front baru yang mungkin kami tidak punya sumber daya untuk mempertahankannya..."
 lar_portugal_iberian_summit.4.a: "Kami terima, mereka bisa bermanfaat bagi kami."
 lar_portugal_iberian_summit.4.b: "Kami menolak, mereka hanya ingin menikmati perlindungan kami!"
 lar_portugal_iberian_summit.5.t: "KTT Iberia"
 lar_portugal_iberian_summit.5.desc: "Kami telah menerima surat dari [From.GetNameDef] yang menyarankan agar kita meninggalkan perbedaan dan mulai bekerja sama menuju tujuan bersama. Mereka mengusulkan agar kita mendiskusikan permintaan bersama untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName] dan menyerahkannya ke [?global.POR_iberian_summit_target.GetNameDef].\n\nKita harus mengevaluasi tidak hanya apakah keberhasilan proposal ini benar-benar layak, tetapi juga apakah itu benar-benar sesuai dengan kepentingan kita."
