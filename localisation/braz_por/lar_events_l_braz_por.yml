 lar_portugal_iberian_summit.5_a_tt: "Proposal akan segera kami kirimkan ke [ENG.GetFlag][ENG.GetNameDefCap]."
 lar_portugal_iberian_summit.5.b: "Kita harus mendekati diplomat [?global.POR_iberian_summit_target.GetAdjective] terlebih dahulu."
 lar_portugal_iberian_summit.5_b_tt: "Proposal akan dikirim ke [ENG.GetFlag][ENG.GetNameDefCap] dalam enam bulan."
 lar_portugal_iberian_summit.5.c: "Ini adalah ide yang konyol!"
 lar_portugal_iberian_summit.6.t: "KTT Iberia - [From.GetNameDef] Menerima"
 lar_portugal_iberian_summit.6.desc: "Pemerintah [From.GetAdjective] telah menerima proposal kami untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName]. Bersama-sama, kami telah menandatangani permintaan untuk mengirimkan ke [?global.POR_iberian_summit_target.GetNameDef] sesegera mungkin."
 lar_portugal_iberian_summit.6.a: "Kirimkan permintaan segera."
 lar_portugal_iberian_summit.7.t: "KTT Iberia - [From.GetNameDef] Menunda Permintaan"
 lar_portugal_iberian_summit.7.desc: "Pemerintah [From.GetAdjective] menyatakan bahwa kita akan memiliki peluang lebih besar untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName] jika kita meluangkan waktu untuk mendekati diplomat [?global.POR_iberian_summit_target.GetAdjective] tertentu sebelum mengajukan proposal kita ke [?global.POR_iberian_summit_target.GetNameDef]. Dengan cara ini kita akan memperoleh pengetahuan kritis tentang maksud dan tujuan [?global.POR_iberian_summit_target.GetAdjective] sehingga kita dapat membuat proposal yang lebih sesuai dengan kepentingan mereka."
 lar_portugal_iberian_summit.7.a: "Semoga saja itu sepadan..."
 lar_portugal_iberian_summit.8.t: "Negara-negara Iberia Berusaha Bergabung dengan [Root.GetFactionName]"
 lar_portugal_iberian_summit.8.desc: "Spanyol dan Portugal telah mengirimkan permintaan bersama kepada kami untuk bergabung dengan [Root.GetFactionName]. Mereka mengharapkan kita untuk menerima kedua negara Iberia ke dalam aliansi kita.\n\nSaat kami menilai kemungkinan mengamankan akses ke Mediterania, komandan militer kami khawatir tentang kemungkinan membuka front baru yang mungkin kami tidak punya sumber daya untuk mempertahankannya..."
 lar_portugal_iberian_summit.8.a: "Kami menerima, bersama-sama kami akan mengalahkan musuh kami!"
 lar_portugal_iberian_summit.8.b: "Kami menolak, mereka hanya akan melemahkan kami."
 lar_portugal_iberian_summit.9.t: "KTT Iberia - [From.GetNameDef] Menolak"
 lar_portugal_iberian_summit.9.desc: "Menunjukkan kesalahpahaman yang jelas mengenai situasi dan kurangnya niat nyata untuk bekerja sama dengan kami, pemerintah [From.GetAdjective] telah menolak usulan kami untuk bergabung dengan [?global.POR_iberian_summit_target.GetFactionName].\nMungkin kita harus fokus mencari sekutu sendiri sekarang..."
 lar_portugal_iberian_summit.9.a: "Betapa bodohnya tetangga kita!"
 lar_portugal_navy_mutiny.1.t: "Pemberontakan Angkatan Laut"
 lar_portugal_navy_mutiny.1.desc: "Organisasi Armada Revolusioner (Organização Revolucionária da Armada) telah mengorganisir pemberontakan di antara Angkatan Laut kita, menahan beberapa perwira. Tujuan dari pemberontakan angkatan laut ini, yang dipimpin oleh kapal perusak Dão, adalah untuk berlayar ke pelabuhan Spanyol di Mediterania dan mengambil bagian dalam Perang Saudara Spanyol yang memihak Partai Republik.\n\nNamun, keragu-raguan beberapa kru telah menghambat keberhasilan para pemberontak dan kami masih memiliki kesempatan untuk menghentikan mereka."
 lar_portugal_navy_mutiny.1.a: "Alasan mereka adil. Biarkan mereka pergi!"
 lar_portugal_navy_mutiny.1_allow_tt: "Kapal yang memberontak akan dipindahkan ke [SPD.GetNameDefCap].\nJika [SPD.GetFlag][SPD.GetNameDef] memenangkan Perang Saudara Spanyol, mereka akan mentransfer kembali jumlah kapal yang sama.\n§RDukungan komunis§! akan mempengaruhi jumlah kapal yang berangkat."
 lar_portugal_navy_mutiny.1_stop_tt: "Kami akan berusaha menghentikan para pemberontak.\nKapal pemberontak mempunyai peluang untuk berhasil dan dipindahkan ke [SPD.GetNameDefCap].\n§RDukungan komunis§! akan mempengaruhi jumlah kapal pemberontak dan peluang mereka untuk pergi."
 lar_portugal_navy_mutiny.1.b: "Hentikan kebodohan ini!"
 lar_portugal_navy_mutiny.2.t: "Para pemberontak berlayar menjauh"
 lar_portugal_navy_mutiny.2.desc: "Tanpa diduga, setelah mengetahui keputusan kami untuk mengizinkan kapal pemberontak meninggalkan pelabuhan, sebagian besar awak kapal memutuskan untuk tidak memberontak, berharap pemerintah kami akan mengambil tindakan yang lebih serius dan bergabung dalam Perang Saudara Spanyol bersama dengan Partai Republik dalam waktu dekat.\nHanya kapal perusak Dão, yang sedang dalam perjalanan ke Spanyol, yang menolak untuk kembali.\nPemerintah Spanyol telah berjanji untuk mengirimi kami kapal perusak sebagai kompensasi setelah perang saudara berakhir."
 lar_portugal_navy_mutiny.2_extra.desc: "Yang mengejutkan sebagian besar pemberontak, kapal mereka diizinkan berangkat dan mereka sekarang menuju ke pelabuhan Spanyol. Kapal perusak Dão memimpin dengan [?POR_ships_revolted_not_including_dao] kapal lain mengikuti.\n\nKami menghubungi pemerintah Republik Spanyol dan mereka meyakinkan kami bahwa mereka akan menyediakan kapal kepada Portugal setelah perang saudara berakhir."
 lar_portugal_navy_mutiny.2.a: "Semoga mereka kembali utuh..."
 lar_portugal_navy_mutiny.2_tt: "[?POR_ships_revolted] kapal akan dipindahkan kembali ke [Root.GetNameDef] jika [SPD.GetNameDef] memenangkan Perang Saudara Spanyol."
 lar_portugal_navy_mutiny.3.t: "Laporan Pemberontakan"
 lar_portugal_navy_mutiny.3.desc: "Pemberontakan telah berhasil dipadamkan berkat tindakan cepat yang diambil oleh pasukan pesisir setia kami. Para pemberontak telah ditangkap dan dihukum sesuai dengan tindakan pengkhianatan mereka. Untuk mencegah upaya pembangkangan lebih lanjut, kami telah mengganti awak kapal yang terlibat dalam pemberontakan ini dengan pelaut andal yang berafiliasi dengan organisasi kami."
 lar_portugal_navy_mutiny.3_extra.desc: "Pemberontakan ini terorganisir lebih baik dari perkiraan awal para perwira kami. Ketika artileri pantai kami menembaki kapal-kapal pemberontak, para pemberontak meningkatkan ketegangan dan kapal perusak Dão memimpin jalan keluar dari pelabuhan, dengan beberapa kapal lagi mengikuti secara berkala. Beberapa kapal dihantam ketika mencoba melarikan diri dan kandas di pantai, di mana pasukan kami menangkap para pengkhianat.\n\nSayangnya, kapal [?POR_ships_revolted] berhasil melarikan diri dan sedang menuju ke Spanyol saat ini. Kami akan mendekati pemerintah Spanyol setelah perang saudara untuk memastikan bahwa kami mendapat kompensasi atas kerugian ini."
 lar_portugal_navy_mutiny.3.a: "Ini tidak akan terjadi lagi!"
 lar_portugal_navy_mutiny.3_no_ships_tt: "§GPemberontakan telah ditumpas.§!"
 lar_portugal_navy_mutiny.3_ships_tt: "§R[?POR_ships_revolted] kapal§! akan ditransfer ke Republik Spanyol.\nJika Partai Republik menang setelah Perang Saudara Spanyol, mereka akan mentransfer kembali jumlah kapal yang sama."
 lar_portugal_navy_mutiny.4.t: "Pelaut Portugis datang membantu kami!"
 lar_portugal_navy_mutiny.4.desc: "Bersedia membantu Republik Spanyol melawan pemberontakan Nasionalis, kru Portugis memberontak di beberapa kapal Angkatan Laut. Para petugas ditahan dan, karena mengira akan menghadapi perlawanan kuat dari darat, kapal-kapal bersiap untuk meninggalkan pelabuhan sesegera mungkin.\n\nNamun, dan yang mengejutkan para kru, pemerintah Portugis, yang bersedia menghindari eskalasi masalah lebih lanjut, berkompromi dan mengizinkan para pelaut untuk berlayar dan berperang demi tujuan kami, selama mereka kembali setelah Perang Saudara Spanyol selesai.\n\nBeberapa awak kapal kemudian memutuskan untuk tinggal di Portugal dan menekan pemerintah untuk mengambil tindakan lebih lanjut terhadap kaum Nasionalis dan, pada akhirnya, kapal [?POR.POR_ships_revolted] kini menuju ke pelabuhan kami. Kita harus menyambut rekan-rekan kita dan berterima kasih atas keberanian mereka."
 lar_portugal_navy_mutiny.4_extra.desc: "Bersedia membantu Republik Spanyol melawan pemberontakan Nasionalis, kru Portugis memberontak di beberapa kapal Angkatan Laut. Setelah perwira mereka ditangkap, para pelaut berusaha meninggalkan pelabuhan, tetapi mendapat tanggapan keras dari Angkatan Darat.\nMelakukan pelarian putus asa di bawah tembakan artileri pantai yang berat, kapal [?POR.POR_ships_revolted] berhasil melarikan diri dan sekarang menuju ke Spanyol.\n\nSetelah gagal membendung pemberontakan ini, pemerintah Portugal meminta kami memberikan kompensasi atas kerugian mereka ketika perang usai.\n\nNamun, untuk saat ini kita harus menyambut kawan-kawan kita dan berterima kasih kepada semua pelaut pemberani atas pengorbanan mereka, karena banyak dari mereka ditangkap atau terluka selama pemberontakan."
 lar_portugal_navy_mutiny.4.a: "Kita tidak akan melupakan perbuatan orang-orang Portugis yang pemberani ini!"
 lar_portugal_navy_mutiny.4_tt: "§G[?POR.POR_ships_revolted] [POR.GetAdjective] kapal§! telah dipindahkan ke [Root.GetNameDef] dan sekarang berada di bawah kendali kami.\nMereka akan dipindahkan kembali ke [POR.GetNameDef] setelah Perang Saudara Spanyol selesai."
 lar_portugal_navy_mutiny.5.t: "Pelaut kami kembali dari Perang Saudara Spanyol"
 lar_portugal_navy_mutiny.5.desc: "Perang Saudara Spanyol telah berakhir dan pemerintah Republik telah setuju untuk memberi kami kapal [?POR_ships_revolted] sebagai kompensasi bagi kapal-kapal yang berlayar untuk membantu mereka pada awal konflik. Namun, kapal perusak kami mungkin tidak berada dalam kondisi terbaik setelah menjalankan misinya, dan oleh karena itu Republik Spanyol akan melakukan inspeksi untuk memutuskan apakah ada kapal kami yang harus diganti dengan kapal mereka sendiri."
 lar_portugal_navy_mutiny.5.a: "Kita akan melihat seberapa baik kinerja kapal-kapal itu..."
 lar_portugal_navy_mutiny.5_tt: "§G[SPD.GetNameDefCap] akan mentransfer [?POR_ships_revolted] kapal kembali ke [Root.GetNameDef].§!"
 lar_portugal_navy_mutiny.6.t: "Saatnya mengucapkan selamat tinggal kepada rekan-rekan Portugis kita"
 lar_portugal_navy_mutiny.6.desc: "Kini setelah pemberontakan Nasionalis berhasil dikalahkan, kini saatnya bagi para pelaut Portugis pemberani yang datang membantu kita pada bulan-bulan pertama konflik untuk akhirnya kembali ke tanah air mereka.\nKami akan melakukan inspeksi untuk memutuskan kapal Portugis mana yang dalam kondisi baik untuk berlayar kembali ke Portugal dan mana yang harus diganti dengan kapal kami sendiri.\n\nKami sangat berterima kasih kepada para pelaut pemberani ini, dan kami tidak akan pernah melupakan keberanian mereka."
 lar_portugal_navy_mutiny.6.a: "Selamat tinggal saudara seperjuangan!"
 lar_portugal_navy_mutiny.6_tt: "[?POR.POR_ships_revolted] kapal akan dipindahkan kembali ke [POR.GetNameDef]."
 lar_portugal_iberian_workers_united.1.t: "Persatuan Pekerja Iberia"
 lar_portugal_iberian_workers_united.1.desc: "Sudah sekian lama Spanyol dan Portugal menjadi negara merdeka dan menekankan perbedaan di antara mereka, bukan persamaannya, namun masa-masa itu telah berakhir; saatnya telah tiba ketika para pekerja Spanyol dan Portugis bersatu dalam perjuangan mereka melawan Fasisme!"
 lar_portugal_iberian_workers_united.1.a: "Bersatu, kita tidak akan pernah kalah!"
 lar_portugal_iberian_workers_united.2.t: "Kesatuan Sosialis Iberia"
 lar_portugal_iberian_workers_united.2.desc: "Kini setelah kita akhirnya mencapai perdamaian, [From.GetNameDefCap] telah mendekati pemerintah kita untuk mempertimbangkan penyatuan Semenanjung Iberia di bawah pemerintahan Sosialis Populer. Hal ini akan menyebabkan hilangnya identitas [Root.GetAdjective] dan [From.GetAdjective], karena kita semua akan menjadi warga negara Iberia yang tergabung dalam Persatuan Sosialis Iberia."
 lar_portugal_iberian_workers_united.2.a: "[Root.GetNameDefCap] dan [POR.GetNameDef] akan bersatu!"
 lar_portugal_iberian_workers_united.2.a_tt: "§YPersatuan Sosialis Iberia§! lampiran §YRepublik Spanyol§!."
 lar_portugal_iberian_workers_united.2.b: "[Root.GetNameDefCap] akan tetap menjadi negara yang merdeka."
 lar_portugal_naval_blockade.1.t: "[POR.GetNameDefCap] Menolak Blokade Laut [ENG.GetAdjective]"
 lar_portugal_naval_blockade.1.desc: "Pemerintah [POR.GetAdjective] telah menyatakan bahwa mereka tidak terikat untuk mematuhi blokade laut yang diberlakukan kepada kami oleh [ENG.GetNameDef]. Kami telah menerima surat yang menawarkan perjanjian yang adil dimana konvoi [POR.GetAdjective] akan mendukung upaya perang kami, membawa barang ke tempat yang tidak dapat dijangkau oleh konvoi kami dengan imbalan perjanjian perdagangan untuk mengirim barang-barang konsumen murah ke [POR.GetNameDef]."
 lar_portugal_naval_blockade.1.a: "Kami akan mempertimbangkan kesepakatan ini..."
 lar_portugal_naval_blockade.1_tt: "Membuka keputusan bagi negara-negara yang berperang dengan [ENG.GetNameDefCap]."
 lar_portugal_naval_blockade.2.t: "[From.GetName] telah menerima tawaran kami untuk menghindari blokade laut"
 lar_portugal_naval_blockade.2.desc: "Surat dari [From.GetNameDef] telah tiba hari ini, menerima tawaran kami untuk menghindari blokade laut Inggris. Kami akan menggunakan konvoi kami untuk memenuhi kebutuhan pasokan mereka yang tidak dapat dijangkau oleh kapal [From.GetAdjective]. Sebagai imbalannya, mereka akan mengalihkan produksi dari salah satu pabrik mereka untuk menyediakan bahan-bahan yang kami perlukan untuk proyek kami sendiri."
 lar_portugal_naval_blockade.2.a: "Hal ini akan menguntungkan kedua negara."
 lar_portugal_naval_blockade.3.t: "[POR.GetNameDefCap] Menolak Blokade Laut"
 lar_portugal_naval_blockade.3.desc: "Pemerintah [POR.GetAdjective] telah menyatakan bahwa mereka tidak akan mematuhi blokade laut yang kami terapkan. [POR.GetNameDefCap] telah mengusulkan kesepakatan kepada musuh-musuh kita, menawarkan mereka untuk mendukung upaya perang mereka dengan menggunakan konvoi [POR.GetAdjective] untuk menyelundupkan barang.\n\nMeskipun kita menghadapi netralitas mereka dalam konflik dengan rasa hormat dan pengertian, tampaknya teman-teman lama kita tidak lagi memiliki keinginan untuk menghormati Aliansi Inggris-Portugis, secara terbuka mendukung musuh-musuh kita dan dengan demikian melanggar perjanjian lebih dari lima abad antara negara kita..."
 lar_portugal_naval_blockade.3.a: "Para oportunis pengkhianat itu!"
 lar_portugal_promote_monarchist_cause.1.t: "Portugal mempromosikan sentimen monarki!"
 lar_portugal_promote_monarchist_cause.1.desc: "Pemerintah Portugal memohon kepada kaum monarki Brasil, mendukung kampanye propaganda yang memuji Pangeran Pedro Henrique dan mengklaim haknya untuk menduduki Tahta Brasil.\nKita tidak boleh mengabaikan dampak potensial dari hal ini terhadap penduduk Brasil, karena jika tidak kita akan terbebani oleh gerakan monarki besar-besaran yang berujung pada penggulingan pemerintah."
 lar_portugal_promote_monarchist_cause.1.a: "Beraninya mereka?!"
 lar_portugal_promote_monarchist_cause.2.t: "Menyatukan kembali Kerajaan Portugal dan Brasil"
 lar_portugal_promote_monarchist_cause.2.desc: "[POR.GetNameDefCap] telah mendekati pemerintah kami, mengusulkan penyatuan kedua negara kami di bawah pemerintahan Dom Duarte Nuno, yang akan dinobatkan sebagai Raja Portugal dan Brasil.\n\nPemerintah [POR.GetAdjective] telah menyatakan bahwa mereka tidak akan menerima tanggapan negatif, dan mendesak kita untuk menerima usulan tersebut untuk menghindari potensi konflik antar negara kita."
 lar_portugal_promote_monarchist_cause.2.a: "[Root.GetNameDefCap] dan [POR.GetNameDef] akan bersatu kembali."
 lar_portugal_promote_monarchist_cause.2.b: "[Root.GetNameDefCap] akan tetap menjadi negara yang merdeka."
 lar_portugal_promote_monarchist_cause.3.t: "Pemberontakan Monarki!"
 lar_portugal_promote_monarchist_cause.3.desc: "Dibantu oleh pemerintah [POR.GetAdjective], kaum Monarki Brasil telah menguasai Rio de Janeiro dan kini mengangkat senjata di seluruh negeri melawan pengkhianat fasis yang menentang kita.\nMusuh telah mencari dukungan dari berbagai faksi di negara kita, namun rakyat setia [Root.GetName] yang dipulihkan tidak memiliki rasa takut, karena Kaisar mereka yang sah [Root.GetLeader] akan memimpin mereka menuju kemenangan!"
 lar_portugal_promote_monarchist_cause.3.desc_anti_monarchist: "Dibantu oleh pemerintah Portugis, kaum Monarki Brasil mulai mengangkat senjata di seluruh negeri. Jika para pengkhianat tersebut berhasil memulihkan monarki, besar kemungkinan kita akan melihat negara tercinta kita tunduk di bawah kendali Portugis segera setelahnya.\n\nKami telah kehilangan sebagian besar wilayah negara kami, namun untungnya, para pemberontak telah gagal dalam upaya mereka untuk merebut Rio de Janeiro, sehingga memberi kami kesempatan untuk mengumpulkan pasukan dan bergerak dari ibu kota untuk merebut kembali tanah kami dari mereka yang berusaha menghancurkannya."
 lar_portugal_promote_monarchist_cause.3.a: "Tahta Brasil akan dipulihkan!"
 lar_portugal_promote_monarchist_cause.3.a_tt: "[From.GetFlag]§Y[From.GetNameDefCap]§Gakan bergabung dengan kita dalam perang saudara.§!§!"
 lar_portugal_promote_monarchist_cause.3.b: "Kita harus memberantas para pengkhianat ini!"
 lar_portugal_promote_monarchist_cause.3.b_tt: "[From.GetFlag]§Y[From.GetNameDefCap]§Rakan bergabung dalam perang saudara melawan kita.§!§!"
 lar_portugal_promote_monarchist_cause.4.t: "Tahta Brasil Dipulihkan"
 lar_portugal_promote_monarchist_cause.4.desc: "Dibantu oleh pemerintah [POR.GetAdjective], kaum Monarki Brasil telah berhasil mengubah pemerintahan secara damai. Ada beberapa elemen yang tersebar di seluruh negeri yang masih menentang kenaikan takhta Kaisar sah kita [Root.GetLeader], namun akan segera diredakan."
 lar_portugal_promote_monarchist_cause.4.a: "Salam Kaisar!"
 lar_portugal_promote_monarchist_cause.5.t: "Brasil Menerima Unifikasi"
 lar_portugal_promote_monarchist_cause.5.desc: "Pemerintah Brazil dengan bijaksana menerima penandatanganan proposal untuk menyatukan negara kita. Kerajaan Inggris Portugal dan Brazil yang perkasa bangkit kembali di bawah pemerintahan Raja [Root.GetLeader].\n\nSemoga beliau membawa kekuasaan dan kemakmuran bagi bangsa kita tercinta!"
 lar_portugal_promote_monarchist_cause.5.a: "Hal ini memperkuat Portugal."
 lar_portugal_promote_monarchist_cause.6.t: "Brasil Menolak Unifikasi"
 lar_portugal_promote_monarchist_cause.6.desc: "Pemerintah [BRA.GetAdjective] telah dengan ceroboh memilih untuk menolak proposal kami untuk menyatukan negara kami di bawah pemerintahan [Root.GetLeader].\nMeskipun hal ini sepenuhnya tidak dapat kami terima, ini hanyalah sebuah hambatan kecil dalam perjalanan kami untuk memulihkan kekuasaan bekas Kerajaan Portugal.\n\nPada akhirnya, mereka harus tunduk pada tuntutan kami, seperti yang dilakukan negara lain..."
 lar_portugal_promote_monarchist_cause.6.a: "Nasib mereka sudah ditentukan."
 lar_portugal_promote_monarchist_cause.7.t: "Kaum Monarkis Meningkat!"
 lar_portugal_promote_monarchist_cause.7.desc: "Situasi di negara kita sangat kritis. Gerakan monarki mendapatkan momentumnya dan koalisi anti-monarki telah mengambil alih kekuasaan di pemerintahan, mungkin untuk mencegah pemberontakan yang akan terjadi.\nKetidakstabilan sosial meningkat dengan cepat ketika warga Brazil menyadari keberpihakan Fasis pada para pemimpin koalisi ini, dan masyarakat kita semakin terpolarisasi antara Fasisme dan Monarki.\nDalam situasi yang menentukan ini, inilah saatnya bagi kita untuk memilih pihak."
 lar_portugal_promote_monarchist_cause.7.a: "Mendukung kaum Monarki."
 lar_portugal_promote_monarchist_cause.7.a_tt: "Anda akan memihak kaum Monarki dalam kemungkinan terjadinya perang saudara."
 lar_portugal_promote_monarchist_cause.7.b: "Mendukung koalisi Anti-Monarkis."
 lar_portugal_promote_monarchist_cause.7.b_tt: "Anda akan memihak kaum Fasis dalam kemungkinan terjadinya perang saudara."
 POR_portugal_joined_brazilian_civil_war_flag: "Portugal bergabung dengan perang saudara Brasil"
 POR_brazil_supports_monarchism_flag: "Brasil mendukung monarki"
 lar_portugal_purchase_ships.1.t: "[From.GetNameDefCap] Berusaha Membeli [Root.GetAdjective] Kapal"
 lar_portugal_purchase_ships.1.desc: "Pemerintah [From.GetAdjective], menyadari kekurangan Angkatan Laut mereka, telah mengajukan tender untuk membeli kapal [Root.GetAdjective]. Jika kami bersedia membuat kapal yang mereka inginkan, mereka akan memberi kami barang yang bisa kami gunakan untuk keperluan kami sendiri."
 lar_portugal_purchase_ships.1.a: "Ini akan bermanfaat bagi kami berdua."
 lar_portugal_purchase_ships.1.a_tt: "Kami akan menerima §Y1§! offmap §YPabrik Sipil§! sebagai pembayaran setelah [POR.GetNameDefCap] memilih kesepakatan."
 lar_portugal_purchase_ships.1.b: "Kami tidak tertarik."
 lar_portugal_purchase_ships.2.t: "[From.GetNameDefCap] Menerima Pembuatan Kapal Kami"
 lar_portugal_purchase_ships.2.desc: "Pemerintah [From.GetAdjective] telah setuju untuk membangun kapal untuk Angkatan Laut [Root.GetAdjective]. Mereka telah mengajukan tiga penawaran berbeda untuk kami pilih."
 lar_portugal_purchase_ships.2.a: "Beli Kapal Selam."
 lar_portugal_purchase_ships.2.b: "Beli Penghancur."
 lar_portugal_purchase_ships.2.c: "Belilah Penjelajah Ringan."
 lar_portugal_purchase_ships.3.t: "[From.GetNameDefCap] Menolak Membangun Kapal kami"
 lar_portugal_purchase_ships.3.desc: "[From.GetNameDefCap] telah menolak tawaran kami untuk membeli kapal [From.GetNameDefCap] untuk Angkatan Laut kami.\nKita harus mencari negara lain yang bersedia menerima kesepakatan tersebut, atau fokus pada pengembangan fasilitas angkatan laut kita sendiri, sehingga kita tidak perlu bergantung pada kekuatan asing untuk membangun armada [Root.GetAdjective] yang perkasa."
 lar_portugal_purchase_ships.3.a: "Kami akan mengelolanya tanpa mereka."
 lar_portugal_purchase_ships.4.t: "Pembuatan Kapal Selesai - Kapal Selam"
 lar_portugal_purchase_ships.4.desc: "Setelah hampir setahun dibangun, ketiga kapal selam [GetPortugueseShipsBuilder] yang kami pesan telah menjalani beberapa kali uji coba laut dan akhirnya siap untuk ditugaskan secara resmi ke TNI Angkatan Laut.\nKapal-kapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 lar_portugal_purchase_ships.4.a: "Bagus"
 lar_portugal_purchase_ships.4.a_tt: "Tiga kapal selam ditambahkan ke Armada Cadangan"
 lar_portugal_purchase_ships.5.t: "Pembuatan Kapal Selesai - Kapal Perusak"
 lar_portugal_purchase_ships.5.desc: "Setelah hampir satu tahun pembangunan, kedua kapal perusak [GetPortugueseShipsBuilder] yang kami pesan menjalani beberapa kali uji coba laut dan akhirnya siap untuk secara resmi ditugaskan ke TNI Angkatan Laut.\nKapal-kapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 lar_portugal_purchase_ships.5.a: "Bagus"
 lar_portugal_purchase_ships.5.a_tt: "Dua kapal perusak ditambahkan ke Armada Cadangan"
 lar_portugal_purchase_ships.6.t: "Pembuatan Kapal Selesai - Penjelajah Ringan"
 lar_portugal_purchase_ships.6.desc: "Setelah hampir satu setengah tahun pembangunan, kapal penjelajah ringan [GetPortugueseShipsBuilder] yang kami pesan menjalani beberapa kali uji coba laut dan akhirnya siap untuk secara resmi ditugaskan ke Angkatan Laut.\nKapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 lar_portugal_purchase_ships.6.a: "Bagus"
 lar_portugal_purchase_ships.6.a_tt: "Satu kapal penjelajah ringan ditambahkan ke Armada Cadangan"
 POR_ENG_Ship_Builder: "[ENG.GetAdjective]"
 POR_ITA_Ship_builder: "[ITA.GetAdjective]"
 lar_portugal_spanish_civil_war.1.t: "[POR.GetNameDefCap] bersimpati dengan Republik Spanyol"
 lar_portugal_spanish_civil_war.1.desc: "Hari ini, [POR.GetNameDef] telah mengumumkan dukungannya kepada Republik Spanyol dan menyatakan bahwa pemerintah sedang mempertimbangkan untuk mengambil tindakan tegas dalam Perang Saudara Spanyol. Dalam pidatonya, [POR.GetLeader] mengecam munculnya ancaman Fasis di Iberia, dan mengklaim bahwa adalah tugas [POR.GetNameDef] untuk membantu rekan-rekan Spanyolnya dalam perjuangan mereka melawan Nasionalis."
 lar_portugal_spanish_civil_war.1.a: "Mereka sebaiknya tidak menghalangi kita..."
 lar_portugal_spanish_civil_war.1_tt: "§R[POR.GetNameDefCap] akan dapat bergabung [SPD.GetFlag][SPD.GetNameDef] dalam Perang Saudara Spanyol, berperang melawan kami!§!"
 lar_portugal_spanish_civil_war.2.t: "[POR.GetNameDefCap] bersimpati dengan Nasionalis Spanyol"
 lar_portugal_spanish_civil_war.2.desc: "Pemerintah [POR.GetAdjective] telah mengumumkan dukungannya kepada Nasionalis Spanyol dan telah menyatakan bahwa [POR.GetNameDef] sedang mempertimbangkan untuk mengambil tindakan tegas dalam Perang Saudara Spanyol. Dalam pidatonya, [POR.GetLeader] mengecam penyebaran ancaman Komunis dan Anarkis di Iberia, mengklaim bahwa adalah tugas [POR.GetNameDef] untuk membantu tetangganya di Spanyol dalam perjuangan mereka melawan Partai Republik."
 lar_portugal_spanish_civil_war.2.a: "Mereka seharusnya tidak ikut campur dalam urusan ini..."
 lar_portugal_spanish_civil_war.2_tt: "§R[POR.GetNameDefCap] akan dapat bergabung [SPA.GetFlag][SPA.GetNameDef] dalam Perang Saudara Spanyol, berperang melawan kami!§!"
 lar_portugal_spanish_civil_war.3.t: "[POR.GetNameDefCap] bersimpati dengan Carlist Spanyol"
 lar_portugal_spanish_civil_war.3.desc: "Pemerintah [POR.GetAdjective] telah mengumumkan dukungannya kepada Carlist Spanyol hari ini, dan telah menyatakan bahwa [POR.GetNameDef] sedang mempertimbangkan untuk mengambil tindakan tegas dalam Perang Saudara Spanyol. Dalam pidatonya, [POR.GetLeader] telah menyatakan bahwa Monarki adalah satu-satunya cara untuk membawa stabilitas dan kemakmuran ke Semenanjung Iberia yang terlalu terpolarisasi oleh politiknya, dan merupakan tugas [POR.GetNameDef] untuk membantu kaum royalis Spanyol dalam perjuangan mereka memulihkan Monarki."
 lar_portugal_spanish_civil_war.3.a: "Mereka seharusnya tidak ikut campur dalam urusan ini..."
 lar_portugal_spanish_civil_war.3_tt: "§R[POR.GetNameDefCap] akan dapat bergabung [SPB.GetFlag][SPB.GetNameDef] dalam Perang Saudara Spanyol, berperang melawan kami!§!"
 lar_portugal_royal_iberian_alliance.1.t: "Bentuk Aliansi Kerajaan Iberia"
 lar_portugal_royal_iberian_alliance.1.desc: "[From.GetNameDefCap] menyatakan bahwa, setelah semua perpecahan dan ketidakstabilan sosial yang dialami negara kita selama Perang Saudara Spanyol, demi kebaikan negara-negara Iberia kita bergabung dalam mencari kemakmuran dan kemajuan.\n\nPemerintah [From.GetAdjective] telah mengusulkan untuk menegosiasikan aliansi antara kedua kerajaan kita, meninggalkan perbedaan kita dari masa lalu dan bekerja sama untuk mengatasi berbagai ancaman yang menanti kita tidak hanya di Eropa, tetapi di seluruh dunia."
 lar_portugal_royal_iberian_alliance.1.a: "Aliansi ini akan bermanfaat bagi Portugal."
 lar_portugal_royal_iberian_alliance.1.b: "Perjanjian ini tidak dapat kami terima."
 lar_portugal_overseas_provinces.1.t: "Wilayah Angola Terintegrasi"
 lar_portugal_overseas_provinces.1.desc: "Wilayah kami di Angola utara dan selatan akhirnya diintegrasikan ke dalam negara kami. Penduduk lokal Angola telah memperoleh kewarganegaraan Portugis dan sekarang memiliki hak dan kewajiban yang sama seperti warga negara Portugis lainnya, termasuk dinas militer. Hal ini akan menghasilkan sumber tenaga baru untuk memperkuat tentara kita."
 lar_portugal_overseas_provinces.1.a: "Kabar baik!"
 lar_portugal_overseas_provinces.2.t: "Wilayah Mozambik Terintegrasi"
 lar_portugal_overseas_provinces.2.desc: "Bekas koloni kami di Mozambik akhirnya diintegrasikan ke dalam negara kami. Penduduk lokal Mozambik telah memperoleh kewarganegaraan Portugis dan sekarang memiliki hak dan kewajiban yang sama seperti warga negara Portugis lainnya, termasuk dinas militer. Hal ini akan menghasilkan sumber tenaga baru untuk memperkuat tentara kita."
 lar_portugal_overseas_provinces.2.a: "Ini demi Portugal."
 lar_portugal_overseas_provinces.3.t: "Wilayah Timor Terintegrasi"
 lar_portugal_overseas_provinces.3.desc: "Bekas jajahan kami di Timor Timur akhirnya terintegrasi ke dalam negara kami. Penduduk lokal Timor telah memperoleh kewarganegaraan Portugis dan kini mempunyai hak dan kewajiban yang sama dengan warga negara Portugis lainnya, termasuk dinas militer. Hal ini akan menghasilkan sumber tenaga baru untuk memperkuat tentara kita."
 lar_portugal_overseas_provinces.3.a: "Ini demi Portugal."
 lar_news.7.t: "Pakta Perancis-Jerman"
 lar_news.7.desc: "[FRA.GetLeader] dan [GER.GetLeader] telah bertemu di Berlin untuk membahas situasi politik dan strategis di Eropa Tengah. Walaupun rincian pertemuan tersebut masih terbatas dan belum ada komunike resmi yang dikeluarkan, para pengamat mencatat adanya perubahan yang jelas dalam retorika dan kebijakan [FRA.GetAdjective] dan [GER.GetAdjective] terhadap negara-negara Benelux.\n\nDulu minoritas Jerman di Belgia selalu menjadi sasaran propaganda Jerman, namun kini hanya disebutkan secara sepintas, sambil mencatat bahwa Belgia adalah \"sebuah konstruksi buatan, bukan sebuah bangsa; hanya kumpulan negara-negara yang disatukan secara sembarangan\" dan memberikan penekanan besar pada populasi besar berbahasa Perancis."
 lar_news.7.a: "Kita harus menjaga pertahanan kita!"
 lar_news.7.b: "Prancis menegaskan dirinya sendiri."
 lar_news.7.c: "Negara-negara kecil di Eropa gemetar."
 lar_news.7.d: "Saatnya untuk menggambar ulang perbatasan Eropa."
 lar_news.7.e: "Solusi yang masuk akal antara negara-negara yang bijaksana."
 lar_news.8.t: "[FRA.GetLeader] mengklaim Tahta Prancis"
 lar_news.8.desc: "Dalam upacara di [This.GetFrenchCoronationCity], [FRA.GetLeader] telah resmi diproklamirkan [This.GetFrenchRoyalTitle].\n\nKebangkitannya secara luas dianggap sebagai akibat langsung dari ketidakmampuan Republik Ketiga untuk memberikan stabilitas politik dalam lingkungan yang semakin ditentukan oleh bentrokan kekerasan antara mereka yang berada di ujung spektrum politik yang ekstrim. Ia kini menghadapi tugas sulit untuk membangun kembali dan menyatukan kembali negara yang terpecah belah, dan banyak pengamat menunjuk pada peran yang dimainkan oleh liga-liga sayap kanan dalam naiknya kekuasaannya sebagai sebuah tanda bahwa \"[This.GetFrenchRoyalTitle]\" sebenarnya hanyalah sebuah penguasa yang didukung oleh massa sayap kanan."
 lar_news.8.a: "Negara lain kembali ke tatanan alam."
 lar_news.8.b: "Mereka akan segera mengadakan revolusi lagi."
 lar_news.8.c: "Kembali ke hari-hari yang sudah lama dipikir-pikir."
 lar_news.8.d: "Panjang umur [FRA.GetLeader]!"
 lar_news.8.e: "Itu adalah penguasa absolut yang salah!"
 LaR_France_Reims: "Reims"
 LaR_France_Paris: "Paris"
 LaR_France_Emperor: "Kaisar Perancis"
 LaR_France_King: "Raja Perancis"
 LaR_France_King_of_The_French: "Raja Perancis"
 lar_news.9.t: "Komunis Perancis Mengambil Kekuasaan"
 lar_news.9.desc: "Setelah reformasi politik dan ekonomi dalam jangka waktu yang panjang, para menteri komunis di pemerintahan Front Populer hari ini menuntut agar menteri-menteri pusat yang tersisa mundur dan mengakui Partai Komunis sebagai satu-satunya partai dalam pemerintahan, atau segera bergabung dengan Partai Komunis.\n\nPada saat yang sama, pekerja bersenjata dari sejumlah pabrik besar milik pemerintah pindah untuk menduduki lokasi-lokasi strategis di seluruh negeri. Tentara, di bawah perintah Paris, tetap berada di barak dan menolak campur tangan.\n\nSaat malam tiba, kudeta Komunis selesai dan pemerintahan baru telah mendapatkan kekuasaan."
 lar_news.9.a: "Kaum radikal telah mengambil alih."
 lar_news.9.b: "Revolusi Perancis yang terakhir."
 lar_news.9.c: "Mereka menghindari fasisme dengan memilih alternatif terburuk."
 lar_news.9.d: "Revolusi menang!"
 lar_news.9.e: "Ancaman lain muncul di Eropa."
 lar_news.10.t: "Pemberontakan Carlist dalam Perang Saudara Spanyol"
 lar_news.10.desc: "Khawatir akan semakin dikesampingkan dan pengaruh mereka terhadap Front Nasionalis semakin dibatasi, kekuatan Carlist di bawah pimpinan Manuel Fal Conde telah meninggalkan afiliasi mereka dengan perjuangan Nasionalis. Mendeklarasikan pemberontakan mereka sendiri dan independen, Carlist Requetés, yang sebagian besar tinggal di bagian utara negara tersebut, telah berpaling dari sekutu lama mereka, dan pada saat yang sama melanjutkan perjuangan melawan musuh-musuh mereka dari Partai Republik.\n\nDampak pada posisi militer mereka dalam perang saudara diremehkan oleh kepemimpinan Nasionalis, namun jelas bahwa kekacauan yang terjadi saat ini memberikan banyak peluang bagi Partai Republik."
 lar_news.10.desc_2: "Khawatir akan semakin dikesampingkan dan pengaruh mereka terhadap pemerintahan Nasionalis yang masih baru pascaperang semakin dibatasi, pasukan Carlist di bawah pimpinan Manuel Fal Conde telah meninggalkan dukungan mereka terhadap pemerintahan baru ini. Dalam pemberontakan lainnya, Carlist Requetés, yang sebagian besar berada di bagian utara negara tersebut, telah berpaling dari sekutu lamanya, mendeklarasikan pemerintahan saingan yang baru.\n\nPara pemimpin nasionalis dengan cepat mengutuk tindakan Fal Conde, menyalahkannya karena \"menjerumuskan Spanyol ke dalam perang saudara lagi\", namun respons Carlist mengutip upaya sistemik yang dilakukan oleh kepemimpinan Nasionalis untuk memberantas gerakan tersebut sejak kekalahan Partai Republik, sehingga meninggalkan mereka tidak ada pilihan selain membela diri."
 lar_news.10.a: "Mereka harus menanggapi kita dengan serius sekarang!"
 lar_news.10.b: "Kepicikan mereka membahayakan perang kita!"
 lar_news.10.b_2: "Mereka akan mempertaruhkan kemenangan kita atas Partai Republik?!"
 lar_news.10.c: "Ini lebih baik dari yang kami harapkan!"
 lar_news.10.c_2: "Biarkan mereka tersedak oleh kemenangan mereka!"
 lar_news.10.d: "Ini menjadi rumit..."
 lar_news.10.d_2: "Apakah ini tidak akan pernah berakhir?!"
 lar_news.11.t: "Pemberontakan Anarkis dalam Perang Saudara Spanyol"
 lar_news.11.desc: "Upaya pemerintah yang terus berlanjut untuk menegaskan kembali kendali terpusat atas komune Anarkis yang sebagian besar bertindak independen di timur laut Spanyol, serta penindasan Stalinis terhadap sudut pandang pembangkang komunis, kini telah menyebabkan pertikaian besar-besaran di front Partai Republik.\n\nAwalnya hanya terbatas pada perkelahian jalanan dan bentrokan skala kecil antara milisi dan pemerintah atau kekuatan Stalinis, keengganan kedua belah pihak untuk berkompromi berarti konflik telah meningkat dengan cepat hanya dalam beberapa hari. Realokasi sumber daya militer untuk menghadapi ancaman internal ini berarti bahwa garis depan melawan kaum Nasionalis telah melemah secara signifikan."
 lar_news.11.desc_2: "Upaya pemerintah yang terus berlanjut untuk menegaskan kembali kendali terpusat atas komune Anarkis yang sebagian besar bertindak independen di timur laut Spanyol, serta penindasan Stalinis terhadap sudut pandang pembangkang komunis, kini telah menyebabkan pertikaian besar-besaran di antara para pemenang Perang Saudara Spanyol dari Partai Republik.\n\nAwalnya terbatas pada perkelahian jalanan dan bentrokan skala kecil antara milisi dan pemerintah atau pasukan Stalinis, keengganan kedua belah pihak untuk berkompromi berarti konflik meningkat pesat hanya dalam beberapa hari. Ketika para pemimpin faksi menolak untuk mempertimbangkan rekonsiliasi dan garis pertempuran sudah ditentukan, Spanyol tampaknya ditakdirkan untuk kembali terjerumus ke dalam perang saudara."
 lar_news.11.a: "Luar biasa, biarkan mereka memisahkan diri!"
 lar_news.11.b: "Dengan satu atau lain cara, campur tangan mereka akan berakhir."
 lar_news.11.b_2: "Mereka akan mempertaruhkan kemenangan kita atas kaum Nasionalis?!"
 lar_news.11.c: "Sekaranglah waktunya untuk melepaskan kuk itu!"
 lar_news.11.d: "Partai Republik hampir tidak membutuhkan bantuan dari luar untuk kehilangan..."
 lar_news.12.t: "[From.GetNameDefCap] Bergabung dengan [From.GetFactionName]"
 lar_news.12.desc: "Meskipun masih dalam tahap pemulihan dari perang saudara, [From.GetNameDef] kini secara mengejutkan telah melakukan negosiasi untuk bergabung dengan [From.GetFactionName]. Tampaknya bantuan Poros dalam jumlah besar yang diterima kaum Nasionalis selama perang saudara tidak menghasilkan hubungan yang lebih erat antara pemerintahan baru [From.GetAdjective] dan pendukung asing mereka."
 lar_news.12.a: "Kita harus memiliki sekutu."
 lar_news.12.b: "Kami menyambut mereka ke dalam kelompok."
 lar_news.12.c: "Lalu kita akan mengalahkan mereka juga."
 lar_news.12.d: "Mereka telah memilih pihak mereka."
 lar_news.13.desc: "Meskipun masih dalam tahap pemulihan dari perang saudara, [From.GetNameDef] kini secara mengejutkan telah melakukan negosiasi untuk bergabung dengan [From.GetFactionName]. Kerja sama telah dimulai selama perang saudara, di mana [From.GetNameDef] menerima bantuan militer yang luas dari [From.GetFactionName], dan tampaknya hal ini hanya menandai awal dari masa depan yang lebih erat hubungannya."
 lar_news.14.t: "[SPA.GetNameDefCap] Menuntut Perancis Afrika Utara"
 lar_news.14.desc: "Dihadapkan dengan tekanan [SPA.GetAdjective] yang tak henti-hentinya selama berminggu-minggu, yang berpuncak pada ultimatum terakhir yang dikeluarkan kemarin, pemerintah [From.GetAdjective] tidak melihat jalan lain selain menuruti tuntutan dan melepaskan kendali atas Afrika Utara, demi menjaga perdamaian dengan tetangga mereka."
 lar_news.14.a: "Mereka mengambil keputusan yang bijaksana."
 lar_news.14.b: "Kami tidak punya pilihan lain."
 lar_news.14.c: "Para bajingan itu memberikan wilayah KAMI!"
 lar_news.14.d: "Dan, dalam sekejap, kita telah kehilangan Afrika Utara..."
 lar_news.14.e: "Mereka memanfaatkan peluang tersebut."
 lar_news.15.t: "Persatuan Perancis-Spanyol"
 lar_news.15.desc: "Sejak gerakan monarki kembar di [SPB.GetNameDef] dan [FRA.GetNameDef] berkuasa beberapa waktu lalu, hubungan Perancis-Spanyol semakin erat, dan kebijakan luar negeri mereka menjadi semakin saling terkait.\n\nSekarang, setelah gerakan Legitimis di [FRA.GetNameDef] secara resmi menunjuk Raja [SPB.GetLeader] sebagai pengklaim sah takhta Prancis, dia telah membuat proklamasi resmi, mengumumkan niatnya untuk mengambil alih mahkota Prancis. Sebagai tanggapan, pemerintahan Legitimis di [FRA.GetNameDef] telah memulai persiapan untuk upacara penobatan yang mewah di katedral Reims."
 lar_news.15.a: "Kekuatan besar akan segera muncul!"
 lar_news.15.b: "Masa depan yang indah bagi Perancis menanti!"
 lar_news.15.c: "Ini akan menjadi pergolakan besar dalam keseimbangan kekuatan!"
 lar_news.16.t: "Uni Iberia"
 lar_news.16.desc: "Setelah berbulan-bulan mendapat tekanan dari pemerintah [SPB.GetAdjective], [POR.GetNameDef], terisolasi, tanpa sekutu, dan dihadapkan dengan militer [SPB.GetAdjective] yang sangat kuat, tidak melihat alternatif lain selain menerima klaim [SPB.GetLeader] atas takhta [POR.GetAdjective]. Akibatnya, negara ini kini hanyalah sebuah provinsi dari negara [SPB.GetNameDef] yang sedang berkembang."
 lar_news.16.a: "Uni Iberia kembali berjalan sebagaimana mestinya!"
 lar_news.16.b: "Iberia bersatu lagi? Menarik."
 lar_news.17.t: "[From.GetAdjective] Monarki Dipulihkan"
 lar_news.17.b: "Betapa baiknya bagi mereka."
 lar_news.18.desc: "Beberapa bulan setelah langkah mengejutkan Francisco Franco untuk melepaskan kekuasaan dan mengumumkan kembalinya Raja Spanyol yang sah, [From.GetSPBkingloc] akhirnya memasuki Madrid pagi ini. Disoraki oleh penonton yang bergembira, prosesi kerajaan berlanjut melalui jalan-jalan Madrid menuju gereja San Jerónimo el Real.\n\nDalam upacara yang megah, [From.GetSPBking2loc].\n\nMeskipun sebagian besar negara masih berada dalam reruntuhan, mungkin Raja yang baru dapat berfungsi sebagai kekuatan pemersatu dan penyembuhan, dan membimbing [From.GetNameDef] menuju yang lebih mulia masa depan."
 lar_news.18.a: "Akhirnya kembali ke kepala negara kita yang sah!"
 lar_news.18.b: "Tapi apakah dia akan membawa perubahan nyata?"
 lar_news.19.t: "Blok Latin"
 lar_news.19.desc: "Hari ini, [From.GetNameDef] mengumumkan pembentukan aliansi baru negara-negara Latin, yang mungkin merupakan alternatif dari blok-blok kekuatan besar di dunia. Meskipun negosiasi telah dilakukan selama berbulan-bulan, masih belum jelas negara mana yang akan memilih untuk bergabung dengan organisasi baru tersebut, meskipun nama-nama yang telah diusulkan oleh para ahli meliputi [POR.GetNameDef], [FRA.GetNameDef], dan [ITA.GetNameDef]."
 lar_news.19.a: "Ini adalah cara terbaik untuk membela kepentingan kita bersama."
 lar_news.19.b: "Sebuah langkah yang berani."
 lar_news.20.t: "[SPD.GetAdjective] Perang Kemerdekaan"
 lar_news.20.desc: "Dalam beberapa bulan terakhir, hubungan [SOV.GetAdjective]-[SPD.GetAdjective] menjadi semakin tegang, dan pengamat independen telah memperhatikan adanya penghapusan sistematis kaum komunis dari posisi pengaruh [SPD.GetAdjective]. Sebagai tanggapan, [SOV.GetNameDef] telah menciptakan zona pendudukan langsung di bagian timur negara tersebut, dalam upaya untuk menjatuhkan pemerintah [SPD.GetAdjective] yang bandel.\n\nSekarang, situasi ini telah mencapai puncaknya, dengan [SPD.GetLeader] membuat siaran yang berapi-api, mendeklarasikan kemerdekaan [SPD.GetAdjective] dan menggalang rekan senegaranya untuk \"membebaskan negara dari pengaruh Soviet untuk selamanya\". Pada saat yang sama, serangan mendadak [SPD.GetAdjective] besar-besaran di zona pendudukan telah dimulai."
 lar_news.20.a: "¡Untuk kebebasan!"
 lar_news.20.b: "Pembalasan kami akan cepat dan mengerikan!"
 lar_news.20.c: "Betapa nyamannya. ¡Buena suerte, Spanyol!"
 lar_news.20.d: "Keluar dari penggorengan, ke dalam api..."
 lar_news.21.t: "Menyatukan Biro London"
 lar_news.21.desc: "Ketika kekuatan [From.GetAdjective] meningkat, pemerintah kini tampaknya perlu mengumumkan pembentukan aliansi komunis baru, dengan nama Biro Internasional Persatuan Sosialis Revolusioner, yang menentang interpretasi Trotskis dan Stalinis terhadap Marxisme.\n\nDimulai dengan \"Biro London\", sebuah komite yang terdiri dari organisasi komunis independen yang bertempat di London, mereka kini menyambut semua negara yang \"menginginkan jalan menuju cita-cita komunis tanpa pihak luar ikut campur\" untuk bergabung dengan barisan mereka."
 lar_news.21.a: "Kita akan memimpin dunia Marxis yang tidak ternoda."
 lar_news.21.b: "Tercela!"
 lar_news.21.c: "Proposisi yang menarik!"
 lar_news.21.d: "Komunisme menyebabkan lebih banyak lagi perpecahan!"
 lar_news.22.t: "Anarkisme Berhasil"
 lar_news.22.desc: "Meskipun beberapa waktu telah berlalu sejak berakhirnya Perang Saudara Spanyol, ledakan komune Anarkis di Iberia yang diharapkan belum terjadi. Sebaliknya, komune dilaporkan berhasil menstabilkan dan membangun kembali wilayah tersebut, dan terus menarik imigran yang berpikiran sama dari negara-negara di seluruh dunia.\n\nMengingat permusuhan internasional yang terus berlanjut, komune memilih untuk tetap terorganisir di bawah \"dewan pertahanan\" mereka, dan melanjutkan program persenjataan yang ekstensif."
 lar_news.22.a: "Kita telah mencapai banyak hal, namun kita harus bersiap menghadapi kemungkinan terburuk!"
 lar_news.22.b: "Mereka menimbulkan ancaman nyata terhadap cara hidup kita!"
 lar_news.23.t: "Negara-negara Iberia bergabung dengan [ENG.GetFactionName]"
 lar_news.23.desc: "Politisi [POR.GetAdjective] dan [?global.POR_iberian_summit_spanish_tag.GetAdjective] telah bekerja sama, mengajukan banding kepada pemerintah [ENG.GetAdjective] dan berusaha untuk diterima di [ENG.GetFactionName]. Apakah mereka hanya mencari perlindungan terhadap ancaman asing atau apakah mereka benar-benar ingin mengambil bagian dalam perjuangan Demokrasi, hal ini masih belum jelas.\n\nNamun, setelah menilai situasi, [ENG.GetNameDefCap] memutuskan bahwa hal ini akan menguntungkan kepentingan mereka dan akhirnya mengizinkan negara-negara Iberia untuk bergabung dalam aliansi tersebut."
 lar_news.23.a: "Kami akan bertarung bersama sekarang."
 lar_news.23.b: "Mereka hanya menjadi makanan bagi kita."
 lar_news.23.c: "Bersama-sama kita akan memperjuangkan kebebasan!"
 lar_news.23.d: "Negara-negara Iberia akhirnya bekerja sama..."
 lar_news.24.t: "Negara-negara Iberia bergabung dengan [GER.GetFactionName]"
 lar_news.24.desc: "Politisi [POR.GetAdjective] dan [?global.POR_iberian_summit_spanish_tag.GetAdjective] telah bekerja sama, mengajukan banding kepada pemerintah [GER.GetAdjective] dan berusaha untuk diterima di [GER.GetFactionName]. Apakah ini merupakan manuver oportunistik untuk memperoleh wilayah baru atau hanya upaya putus asa untuk menghindari pendudukan, masih belum jelas.\n\nNamun, setelah menilai situasi, [GER.GetNameDefCap] memutuskan bahwa hal ini akan menguntungkan kepentingan mereka dan akhirnya mengizinkan negara-negara Iberia untuk bergabung dalam aliansi tersebut."
 lar_news.24.a: "Kami memilih sisi kanan."
 lar_news.24.b: "Musuh kita akan binasa sekarang!"
 lar_news.24.c: "Mereka berpihak pada iblis."
 lar_news.24.d: "Negara-negara Iberia akhirnya bekerja sama..."
 lar_news.25.t: "Pernikahan Kerajaan di Brasil"
 lar_news.25.desc: "Saat ini, Dom Duarte Nuno, Adipati Braganza, menikah dengan Putri Maria Francisca dari Orléans-Braganza di Katedral Petrópolis di Brasil. Pernikahan ini tidak hanya mendamaikan keluarga Brigantine Portugis dan Brasil, tetapi juga menyatukan kaum Miguelis dan Braganza Liberal, meninggalkan persaingan antara keluarga kerajaan Portugis dan mengobarkan sentimen monarki di kedua negara.\n\nDikatakan bahwa, setelah upacara, Dom Duarte terlibat dalam beberapa percakapan dengan bapak dan ibu royalis Brasil dan Portugis yang terkenal, di mana kata 'restorasi' dan 'Monarki' diucapkan secara terbuka."
 lar_news.25.a: "Ini baru permulaan."
 lar_news.25.b: "Perkembangan yang menarik..."
 lar_news.26.t: "Kekaisaran Portugal dan Brasil"
 lar_news.26.desc: "Menyusul pemulihan monarki di Portugal dan Brasil, Raja Portugis dan Kaisar Brasil menghadiri beberapa pertemuan untuk membahas perlunya dan potensi manfaat dari reunifikasi kedua negara sekali lagi.\nSetelah negosiasi panjang pada pertemuan puncak Brasil-Portugal terakhir, para penguasa sepakat untuk secara resmi membangun kembali [POR.GetNameDef].\n\nHari ini, dengan restu dari kumpulan monarki yang berkumpul, [POR.GetLeader] telah dinobatkan sebagai Kaisar Portugal dan Brasil. Kaisar berterima kasih kepada rakyatnya atas kesetiaan mereka dan menyatakan bahwa ia akan memerintah atas nama semua warga negara yang hidup di bawah pemerintahannya."
 lar_news.26.a: "Salam Kaisar!"
 lar_news.26.b: "Sebuah Kekaisaran yang bangkit untuk gagal lagi."
 lar_news.26.c: "Hanya khayalan akan kehebatan..."
 lar_news.27.t: "Penyatuan Iberia"
 lar_news.27.desc: "Politisi Portugis dan Spanyol mengadakan banyak pertemuan selama beberapa bulan terakhir, di mana mereka membahas kemungkinan menjadi negara sayap kiri yang bersatu di Iberia, yang diperintah oleh politisi dari kedua negara.\n\nSetelah persiapan dan negosiasi yang panjang, hari ini para pemimpin Portugis dan Spanyol telah secara resmi menyatakan pembentukan [POR.GetNameDef], sebuah negara bagian baru di mana warga Iberia akan memilih pemimpin yang lebih mewakili kepentingan kolektif dan di mana mereka dapat bebas berkeliaran."
 lar_news.27.a: "Ini baru permulaan."
 lar_news.27.b: "Inisiatif yang baik dari masyarakat Iberia."
 lar_news.27.c: "Ancaman Komunis menyebar seperti wabah..."
 lar_news.27.d: "Hanya nama mewah untuk menyembunyikan ambisi mereka yang sebenarnya."
 lar_news.28.t: "Partai Republik Spanyol Dikalahkan"
 lar_news.28.desc: "Perang Saudara Spanyol tampaknya telah berakhir, karena sisa kekuatan Partai Republik telah menyerah atau bersembunyi. Meskipun kepemimpinan Nasionalis telah memanfaatkan hal ini dan mendeklarasikan berakhirnya Perang Saudara, para ahli menunjuk pada perbedaan pendapat yang semakin besar di dalam faksi Nasionalis itu sendiri dan berpendapat bahwa hal ini mungkin sedang bergerak ke tahap baru. Dengan hilangnya musuh bersama, mereka menganggap kemungkinan besar perselisihan ini akan semakin memecah persatuan kaum Nasionalis.\n\nSampai batas tertentu, para pemimpin Nasionalis dan masyarakat sendiri tampaknya juga melihat hal ini, karena milisi yang dibentuk selama Perang Saudara untuk mengalahkan Partai Republik belum dibubarkan, dan malah terus mengawasi tetangga mereka."
 lar_news.28.a: "Setidaknya Perang Saudara telah menguntungkan kita."
 lar_news.28.b: "Konflik tampaknya belum terselesaikan."
 lar_news.28.c: "Biarkan mereka saling menghancurkan dalam kemenangan mereka!"
 lar_news.28.d: "Hanya masalah waktu sebelum kita harus berurusan dengan Carlist..."
 lar_news.28.e: "Kita harus bertindak cepat, jangan sampai kaum Carlist dan Falangis memecah belah bangsa kita lagi!"
 lar_news.28.f: "Hanya masalah waktu sebelum kita harus menghadapi kaum Falangis..."
 lar_news.29.t: "Nasionalis Spanyol Dikalahkan"
 lar_news.29.desc: "Perang Saudara Spanyol tampaknya sudah berakhir, karena kekuatan Nasionalis yang tersisa telah menyerah atau bersembunyi. Meskipun kepemimpinan Partai Republik telah memanfaatkan hal ini dan mendeklarasikan berakhirnya Perang Saudara, para ahli menunjuk pada perbedaan pendapat yang semakin besar di dalam faksi Partai Republik itu sendiri dan berpendapat bahwa hal ini mungkin saja sedang bergerak ke tahap baru. Dengan hilangnya musuh bersama, mereka menganggap kemungkinan besar perselisihan ini akan semakin memecah persatuan Republik Kedua.\n\nSampai batas tertentu, para pemimpin Partai Republik dan masyarakat sendiri tampaknya juga melihat hal ini, karena milisi yang dibentuk selama Perang Saudara untuk mengalahkan kaum Nasionalis belum dibubarkan, dan malah terus mengawasi tetangga mereka."
 lar_news.29.d: "Hanya masalah waktu sebelum kita harus berurusan dengan pemerintah..."
 lar_news.29.e: "Hanya masalah waktu sebelum kita harus menghadapi kaum Anarkis..."
 lar_news.281.t: "Andalusia Dipulihkan!"
 lar_news.281.desc: "Berabad-abad yang lalu, bangsa Moor diusir dari Iberia pada masa penaklukan kembali. Kini, pasukan [From.GetOldAdjective] telah maju jauh ke selatan Iberia dan mulai membangun permukiman Moor di wilayah tersebut untuk pertama kalinya dalam beberapa abad. [From.GetOldNameDefCap] telah direorganisasi menjadi negara baru yang dikenal sebagai \"[From.GetNameDefCap]\", mengambil kembali warisan Kesultanan kuno yang pernah memerintah seluruh Iberia.\n\nKekhalifahan Umayyah kuno menguasai hampir seluruh dunia Islam; dari Iberia di Barat hingga Persia di Timur. Mungkin [From.GetLeader] ingin meniru Kekaisaran lama ini dan menyatukan kembali masyarakat yang berbeda di Timur Tengah, Afrika Utara, dan Eropa."
 lar_news.281.a: "Hari yang mulia!"
 lar_news.281.b: "Apa dampaknya bagi Spanyol?"
 lar_news.291.t: "Polinesia Bersatu!"
 lar_news.291.desc: "Dengan pulau Hawai’i, Aotearoa, Tahiti, dan Samoa berada di bawah kendali [From.GetOldAdjective], [From.GetLeader] telah memproklamirkan bahwa negara tersebut sekarang akan dikenal sebagai [From.GetNameDef] dan merupakan rumah sah bagi seluruh masyarakat Pasifik.\n\nAda banyak kegembiraan di seluruh dunia Polinesia, bahkan ada yang bahkan memproklamirkan [From.GetLeader] sebagai penerus sejati Kamehameha; Raja Hawaii yang menggenapi Nubuatan Naha lebih dari dua abad yang lalu."
 lar_news.291.new_zealand_desc: "Dengan pulau Hawai’i, Aotearoa, Tahiti, dan Samoa berada di bawah kendali [From.GetOldAdjective], [From.GetLeader] telah memproklamirkan bahwa negara tersebut sekarang akan dikenal sebagai [From.GetNameDef] dan merupakan rumah sah bagi seluruh masyarakat Pasifik.\n\nMengingat sejarah panjang eksploitasi kolonial, penduduk asli Māori sering ragu-ragu untuk memberikan kesetiaan atau dukungan apa pun kepada [From.GetOldAdjective] pemerintah, namun sejak penandatanganan Aliansi Ratana antara para pemimpin Kiwi dan Māori dan meningkatnya keterwakilan Māori dalam pemerintahan, [From.GetNameDef] telah menjadi negara teladan bagi multikulturalisme pasca-kolonial."
 lar_news.291.a: "Kei whea mai!"
 lar_news.291.b: "Aloha!"
 LAR_fra_voted_independence_tt: "Memilih Kemerdekaan"
 SPR_core_of_spain_flag: "Merupakan inti dari Spanyol."
 lar_fra_join_the_ententes.1.t: "[From.GetNameDefCap] menyarankan Aliansi Strategis"
 lar_fra_join_the_ententes.1.desc: "Pemerintah [From.GetAdjective] telah mendekati kami dengan proposal untuk mendamaikan kepentingan strategis kami yang berbeda. Meskipun mereka bermaksud untuk mempertahankan kewajiban diplomatik dan militer mereka di benua ini, mereka juga menyadari kepentingan bersama kita di banyak belahan dunia.\n\nOleh karena itu, usulan mereka menyarankan agar kita bergabung dengan mereka dalam sebuah aliansi yang akan menjamin bantuan timbal balik jika salah satu dari kita melihat kepentingan mereka terancam."
 lar_fra_join_the_ententes.1.a: "Usulan yang masuk akal."
 lar_fra_join_the_ententes.1.b: "Ini bukan kepentingan kami."
 lar_fra_join_the_ententes.2.t: "[From.GetNameDefCap] menerima Proposal kami"
 lar_fra_join_the_ententes.2.desc: "Pemerintah [From.GetAdjective] telah mendiskusikan usulan aliansi kami dan memutuskan untuk menerimanya. Sementara dinas diplomatik masing-masing membahas rincian yang lebih rinci, kami dapat yakin bahwa [From.GetNameDef] akan membantu kami jika kami memerlukannya - selama kami bersedia melakukan hal yang sama untuk mereka."
 lar_fra_join_the_ententes.2.a: "Aliansi kami semakin kuat."
 lar_fra_join_the_ententes.3.t: "[From.GetNameDefCap] menolak Proposal kami"
 lar_fra_join_the_ententes.3.desc: "Setelah diskusi ekstensif, kabinet [From.GetAdjective] dengan suara tipis menolak usulan kami. Tanggapan resmi mencatat bahwa aliansi antara [From.GetNameDef] dan [This.GetNameDef] pasti akan berkomitmen [From.GetNameDef] untuk membela negara-negara yang dengan sengaja memutuskan untuk tidak mengikatnya. Meskipun kita, tentu saja, bebas memilih kebijakan luar negeri kita sendiri, kita tidak boleh mengharapkan [From.GetNameDef] untuk membantu kita jika kita terseret ke dalam konflik yang lebih besar."
 lar_fra_join_the_ententes.3.a: "Orang Bodoh yang Berpandangan Pendek!"
 LaR_france_vichy_notification_events.1.t: "Suriah membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.1.desc: "Menyusul permohonan langsung dari [FRA.GetLeader], gubernur wilayah tersebut telah menyatakan kesetiaannya kepada apa yang disebut \"[FRA.GetAdjective] Pemerintahan dalam Pengasingan\", yang dipimpin oleh [FRA.GetLeader]. Pasukan kami di wilayah tersebut telah diminta untuk bergabung dengan pasukan [FRA.GetLeader], namun sebagian besar memilih untuk dipulangkan ke barisan kami.\n\nMeskipun demikian, [FRA.GetLeader] kini menguasai wilayah tersebut."
 LaR_france_vichy_notification_events.1.a: "Pengkhianatan dan Pengkhianatan!"
 LaR_france_vichy_notification_events.2.t: "Indochina membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.3.t: "Afrika Tengah membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.4.t: "Afrika Barat membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.5.t: "Afrika Utara membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.6.t: "Madagaskar membelot ke [FRA.GetLeader]"
 LaR_france_vichy_notification_events.7.t: "Pro-[FRA.GetLeader] kudeta di Suriah"
 LaR_france_vichy_notification_events.7.desc: "Pasukan yang setia kepada [FRA.GetLeader] telah melancarkan kudeta di wilayah tersebut. Tepat sebelum fajar, beberapa kelompok bersenjata, yang jelas-jelas berada di bawah perintah [FRA.GetLeader], merebut lokasi-lokasi strategis di sekitar wilayah tersebut untuk menetralisir segala upaya perlawanan yang terkoordinasi. Pada tengah hari, mereka menguasai semua pusat populasi utama dan secara efektif menguasai wilayah tersebut."
 LaR_france_vichy_notification_events.7.a: "Sungguh metode yang curang dan tidak Perancis!"
 LaR_france_vichy_notification_events.8.t: "Pro-[FRA.GetLeader] kudeta di Indochina"
 LaR_france_vichy_notification_events.9.t: "Pro-[FRA.GetLeader] kudeta di Afrika Tengah"
 LaR_france_vichy_notification_events.10.t: "Pro-[FRA.GetLeader] kudeta di Afrika Barat"
 LaR_france_vichy_notification_events.11.t: "Pro-[FRA.GetLeader] kudeta di Afrika Utara"
 LaR_france_vichy_notification_events.12.t: "Pro-[FRA.GetLeader] kudeta di Madagaskar"
 lar_spain.100.t: "Penyatuan Hispanik!"
 lar_spain.100.d: "Mulai hari ini, [SPR.GetLeader] telah mengumumkan penyatuan seluruh rakyat Hispanik di bawah bendera [SPR.GetNameDef]. Mereka telah menyatakan bahwa tujuan mereka adalah melindungi semua orang, membawa rakyat Hispanik menuju kemakmuran, dan untuk memastikan bahwa Kekaisaran berdiri selama seribu tahun lagi, lebih lanjut menyatakan bahwa misi nasional mereka belum berakhir."
 lar_spain.100.a: "Mereka akan hancur sekali lagi"
 lar_spain.100.b: "Kita sekali lagi menjadi kekuatan dunia!"
