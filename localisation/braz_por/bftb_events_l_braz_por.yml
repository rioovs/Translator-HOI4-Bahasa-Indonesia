l_braz_por:
 bftb_greece.1.t: "Kaum Monarki Memenangkan Pemilu!"
 bftb_greece.1.desc: "Masyarakat Yunani tidak terkejut mendengar bahwa kaum konservatif yang setia kepada Raja George II telah memenangkan pemilu Yunani tahun 1936. Perdana Menteri Konstantinos Demertzis diperkirakan akan terus menjabat, dan Raja telah menyatakan keyakinan pribadinya bahwa jabatan perdana menteri Demertzis akan bertahan lama dan sukses. Hanya waktu yang akan membuktikan apakah firasat Raja itu benar..."
 bftb_greece.1.a: "Kemenangan besar bagi Yunani..."
 bftb_greece.2.t: "Kaum Venezelis Memenangkan Pemilu!"
 bftb_greece.2.desc: "Rakyat Yunani memenuhi jalan-jalan Yunani hari ini, merayakan pilihan tentara untuk memastikan kaum monarki tidak dapat mengganggu hasil pemilu. Kaum Venezelis telah diberi mandat yang kuat untuk memerintah, setelah kembali dari pengasingan mereka di luar negeri; namun mereka menghadapi perjuangan berat untuk menyatukan negara yang sangat terpecah belah, dan sebuah negara yang belum melupakan bencana perang yang dilakukan oleh kaum Venezel di seluruh negeri pada tahun 1919. Masih ada pertanyaan tentang apa yang akan dilakukan kaum Venezel terhadap raja Yunani yang direbut - apa pun yang terjadi, masa-masa menarik menanti Yunani..."
 bftb_greece.2.a: "Akhirnya, kami telah kembali!"
 GRE_republican_victory_tt: "£faction_gre_monarchist §YMonarkis§! menjadi §YBiasa Saja§!.\nOrang £faction_gre_communist §YKomunis§! menjadi §YBiasa Saja§!."
 bftb_greece.3.t: "Mobilisasi Fasis Anatolia"
 bftb_greece.3.desc: "Gerakan fasis Yunani yang memproklamirkan diri telah melakukan reorientasi sesuai dengan realitas politik baru kita. Pengungsi Yunani yang merasa getir dan tidak puas yang diasingkan dari Turki mulai berbondong-bondong bergabung dengan gerakan politik radikal baru Georgios Kosmidis, seorang warga Yunani lain yang diasingkan dari tanah airnya.\n\nKosmidis adalah pendukung vokal Ide Megali dan reklamasi wilayah bersejarah yang hilang dari [TUR.GetNameDef], meskipun pandangannya jauh lebih radikal dibandingkan pandangan mana pun di pemerintahan Venezelist. Beberapa laporan menyatakan bahwa Kosmidis bercita-cita agar perbatasan [ROOT.GetNameDef] tidak hanya mencakup Laut Aegea saja, dan bahwa ia mungkin mempunyai rancangan di seluruh Anatolia. Namun, laporan seperti itu tidak boleh ditanggapi dengan hati-hati - orang gila macam apa yang bisa membuat desain untuk keseluruhan [TUR.GetNameDef]?"
 bftb_greece.3.a: "Tak seorang pun akan mengikuti penjahat itu!"
 GRE_anatolian_fascists_in_play_tt: "£faction_gre_fascist §YFasis§! muncul dan dimulai sebagai §Rhostile§!."
 GRE_republican_monarchist_alliance_tt: "Para jenderal dan menteri monarki akan tetap tersedia bagi pemerintah Venezelist.\nPara £faction_gre_monarchist §YMonarkis§! telah menjadi §Gramah§!.\nThe £faction_gre_communist §YKomunis§! akan berubah menjadi §Rbermusuhan§!."
 bftb_greece.6.t: "Negosiasi dengan EEE"
 bftb_greece.6.desc: "Kaum fasis Anatolia yang pengecut telah menabur kekacauan sambil menjadikan diri mereka tidak dapat didekati oleh pemerintah sejak awal gerakan ganas mereka, namun keadaan tampaknya mulai berubah. Kami telah didekati dengan tawaran untuk membuat kesepakatan satu abad - untuk menggabungkan kekuatan kami dengan fasis Anatolia untuk mencapai tujuan bersama yaitu [TUR.GetNameDef] yang dikalahkan.\n\nTidak dapat dipungkiri bahwa banyak dari pemerintahan kita yang membuat kesepakatan dengan setan-setan bangsa kita hanya untuk membuat mereka menghentikan tindakan anti-pemerintah mereka, dan juga tidak dapat disangkal bahwa bahkan ada beberapa pegawai negeri sipil kita yang menganggap tujuan EEE dapat diterima, atau bahkan patut dipuji. Syukurlah, tokoh terkemuka Aristoteles Onassis telah memberi kita alternatif tindakan: Onassis, yang juga berasal dari Anatolia, akan membentuk gerakan tandingan menggunakan ketenaran, kecerdasan bisnis, dan kekayaan pribadinya dan menggunakan gerakan itu untuk melemahkan basis dukungan EEE. Tindakan ini sama sekali tidak menjamin tergencetnya EEE, namun kami memiliki lebih dari cukup bukti yang menunjukkan bahwa Onassis dapat melakukan aksi tersebut jika kami memintanya."
 bftb_greece.6.a: "Hantu masa lalu tidak akan kembali menghantui kita lagi."
 bftb_greece.6.b: "Tidak ada kesepakatan dengan hama fasis."
 GRE_ally_the_anatolian_fascists_tt: "£faction_gre_fascist §YFasis§! akan menjadi §Gramah§!!\nBersekutu dengan §YEEE§! akan mempunyai §Rdampak serius§! ketika §YKonvensi Heraklion§! diserukan."
 GRE_ally_onassis_tt: "§YAristoteles Onassis§! akan tersedia sebagai menteri.\nKaum £faction_gre_fascist §YFasis§! akan tetap §Ybermusuhan§!."
 GRE_increased_influence_tt: "Hal ini akan meningkatkan pengaruh kami terhadap pemerintahan §Y[FROM.GetAdjective]§!."
 bftb_greece.7.t: "Konvensi Heraklion"
 bftb_greece.7.desc: "Akhirnya mereka harus meninjau kembali perjanjian Sevres dan Lausanne dengan negara-negara besar Eropa, dan juga mendekati kembali topik Ide Megali. Nasib [TUR.GetNameDef] tidak dapat kita putuskan sendiri, jadi pertama-tama kita harus mengumpulkan dan memupuk persetujuan dari [ENG.GetNameDef], [FRA.GetNameDef], dan [ITA.GetNameDef] yang tercela jika kita memilih untuk mengundang mereka ke konferensi kita secara besar-besaran."
 bftb_greece.7.a: "Kami akan mengundang delegasi [FRA.GetAdjective] dan [ENG.GetAdjective]."
 bftb_greece.7.b: "Kami akan mengundang para penandatangan Sèvres yang asli."
 bftb_greece.8.t: "Undangan ke Konvensi Heraklion"
 bftb_greece.8.desc: "Kami baru saja menerima usulan menarik dari [FROM.GetNameDef], yang tampaknya berupaya mengubah batas [TUR.GetNameDef]. [FROM.GetNameDef] berupaya mengadakan diskusi di antara negara-negara Eropa yang menang dalam Perang Besar untuk membahas kembali perjanjian Sevres dan Lausanne yang kami coba terapkan pada [TUR.GetNameDef].\n\nPejabat dari [FROM.GetNameDef] meyakinkan pejabat kami bahwa kami akan memperoleh keuntungan materi dari [TUR.GetNameDef] yang kalah, dan bahwa penghapusan [TUR.GetNameDef] bukanlah keinginan pemerintah [FROM.GetAdjective]. Sebaliknya, tokoh-tokoh dari [FROM.GetNameDef] bersikeras untuk merujuk pada konvensi ini sebagai masalah sederhana mengenai reorganisasi perbatasan daripada realisasi impian revanchis."
 bftb_greece.8.a: "Harapkan kami di sana."
 bftb_greece.8.b: "Anda akan mengacaukan Mediterania!"
 potential_war_with_turkey_tt: "§RJika kita setuju untuk hadir, ada kemungkinan besar bahwa dalam waktu dekat kita akan terseret ke dalam perang dengan [TUR.GetNameDef] dengan imbalan wilayah di sana§!."
 bftb_greece.9.t: "Hanya [ENG.GetNameDef] yang Menghadiri Konvensi Heraklion"
 bftb_greece.9.desc: "Undangan ke Konvensi Heraklion tentang reorganisasi perbatasan [TUR.GetNameDef] dikirimkan ke semua negara yang kami inginkan di sana. Meskipun kami mengharapkan semua negara yang diundang untuk hadir, ternyata hanya [ENG.GetNameDef] yang akan berpartisipasi dalam pertemuan puncak kami. Hubungan kami dengan [ENG.GetNameDef] selalu erat, sehingga banyak pejabat kami yang tetap yakin bahwa Konvensi Heraklion dapat diselesaikan dengan cara yang menguntungkan kedua negara."
 bftb_greece.9.a: "[ENG.GetAdjective] selalu dapat diandalkan!"
 bftb_greece.10.t: "Hanya [FRA.GetNameDef] yang Menghadiri Konvensi Heraklion"
 bftb_greece.10.desc: "Undangan ke Konvensi Heraklion tentang reorganisasi perbatasan [TUR.GetNameDef] dikirimkan ke semua negara yang kami inginkan di sana. Meskipun kami mengharapkan semua negara yang diundang untuk hadir, ternyata hanya [FRA.GetNameDef] yang akan berpartisipasi dalam pertemuan puncak kami. Kekecewaan mungkin menjadi kata yang paling tepat untuk menggambarkan emosi para pejabat [ROOT.GetAdjective] saat mendengar kabar tersebut. Baik elit politik maupun ahli militer kita tidak yakin bahwa Konvensi Heraklion akan membuahkan hasil yang sebelumnya diyakini hanya bisa dicapai jika hanya [FRA.GetAdjective] yang mendukung kita, namun kita tetap berkomitmen pada tindakan yang kita ambil."
 bftb_greece.10.a: "Hanya [FRA.GetAdjective]? Kita harus segera menyelesaikan ini."
 bftb_greece.11.t: "Hanya [ITA.GetNameDef] yang Menghadiri Konvensi Heraklion"
 bftb_greece.11.desc: "Pejabat kami yang kecewa telah merenungkan berita buruk bahwa hanya [ITA.GetNameDef] yang menunjukkan minat untuk menentukan nasib [TUR.GetNameDef] di Konvensi Heraklion, dan pada akhirnya memutuskan bahwa satu-satunya tindakan yang harus diambil adalah membatalkan Konvensi Heraklion sepenuhnya. Tindakan ini tidak dapat diambil dengan mudah, karena banyak pejabat Venezelis yang sadar bahwa mereka mempertaruhkan seluruh legitimasi gerakan mereka untuk membalas dendam pada tahun 1922 dan sekarang situasinya telah berkembang ke titik di mana seluruh operasi berada dalam bahaya.\n\nOrang-orang [ROOT.GetAdjective] sudah menjadi gelisah karena kurangnya berita setelah begitu banyak hype yang dibangun seputar acara tersebut. EEE telah memanfaatkan api ketidakpuasan yang berkobar dengan penuh semangat, mengecam pemerintah kita karena lemah dan gagal menepati janji-janji kita. Bagaimana [ROOT.GetLeader] akan mengarahkan kita keluar dari perairan keruh ini?"
 bftb_greece.11.a: "Tidak ada gunanya melakukan hal ini; konvensi tersebut harus dibatalkan."
 bftb_greece.12.t: "[ENG.GetNameDefCap] dan [FRA.GetNameDef] Menghadiri Konvensi Heraklion"
 bftb_greece.12.desc: "Para pejabat yang berkumpul di ibu kota sangat gembira mendengar bahwa [ENG.GetNameDef] dan [FRA.GetNameDef] akan mengirimkan delegasi untuk mengambil bagian dalam Konvensi Heraklion. Persiapan untuk pertemuan puncak telah dilakukan, dan konvensi secara resmi akan dimulai dalam hitungan hari.\n\nBersama-sama, delegasi kita akan membagi wilayah pengaruh di [TUR.GetName] utara dan selatan sebelum pada akhirnya memutuskan apakah kita harus diberikan wilayah sah kita di sepanjang Laut Aegea. Sejarah akan segera dibuat, dan [ROOT.GetNameDef] akan menjadi inti dari sejarah tersebut."
 bftb_greece.12.a: "[ROOT.GetAdjective] tangan akan membentuk dunia."
 bftb_greece.13.t: "Semua Penandatangan Sèvres Menghadiri Konvensi Heraklion"
 bftb_greece.13.desc: "Para pejabat yang berkumpul di ibu kota sangat senang mendengar bahwa [ENG.GetNameDef] dan [FRA.GetNameDef] keduanya akan mengirimkan delegasi untuk mengambil bagian dalam Konvensi Heraklion, namun kegembiraan itu terhenti oleh kekhawatiran atas kehadiran [ITA.GetNameDef]. Banyak tokoh politik kita yang diam-diam menyatakan keprihatinan mereka bahwa intrik [ITA.GetAdjective] dapat menyabotase keseluruhan acara, namun [ROOT.GetLeader] tetap yakin bahwa mengundang [ITA.GetNameDef] adalah keputusan yang tepat. Persiapan untuk pertemuan puncak telah dilakukan, dan konvensi secara resmi akan dimulai dalam hitungan hari.\n\nBersama-sama, delegasi kita akan membagi wilayah pengaruh di [TUR.GetName] utara dan selatan sebelum akhirnya memutuskan apakah kita harus diberikan wilayah sah kita di sepanjang Laut Aegea. Sejarah akan segera dibuat, dan [ROOT.GetNameDef] akan menjadi inti dari sejarah tersebut."
 bftb_greece.13.a: "Ini seharusnya menarik..."
 bftb_greece.14.t: "Tidak Ada yang Menghadiri Konvensi Kami!"
 bftb_greece.14.desc: "Pemerintahan kita benar-benar dipermalukan oleh berita bahwa tidak satu pun negara yang diundang akan mengirimkan delegasinya ke Konvensi Heraklion, dan yang lebih buruk lagi adalah kenyataan bahwa kepemimpinan kita telah dikritik secara terbuka oleh negara-negara besar karena mengobarkan ketegangan di kawasan. Mengatakan bahwa rangkaian peristiwa ini terbukti tidak terlalu menghancurkan adalah sebuah pernyataan yang meremehkan, karena banyak pejabat Venesia yang sadar bahwa mereka mempertaruhkan seluruh legitimasi gerakan mereka untuk membalas dendam pada tahun 1922 dan sekarang situasinya telah berkembang ke titik di mana seluruh operasi berada dalam bahaya.\n\nOrang-orang [ROOT.GetAdjective] sudah menjadi gelisah karena kurangnya berita setelah begitu banyak hype yang dibangun seputar acara tersebut. EEE telah memanfaatkan api ketidakpuasan yang berkobar dengan penuh semangat, mengecam pemerintah kita karena lemah dan gagal menepati janji-janji kita. Bagaimana [ROOT.GetLeader] akan mengarahkan kita keluar dari perairan keruh ini?"
 bftb_greece.14.a: "Keangkuhan kita telah membawa kita pada kehancuran."
 bftb_greece.15.t: "Konvensi Heraklion - Mandat [FRA.GetAdjective] di Kurdistan?"
 bftb_greece.15.desc: "Topik pemungutan suara putaran pertama adalah apakah [FRA.GetNameDef] harus diberi mandat [FRA.GetAdjective] di [TUR.GetAdjective] Kurdistan setelah penyerahan [TUR.GetNameDef] atau tidak. Banyak pejabat [FRA.GetAdjective] yang hadir berpendapat bahwa pengaturan seperti itu sangat logis mengingat kedekatan [FRA.GetNameDef] dengan wilayah tersebut dan rasa nasionalisme yang cukup jelas sudah ada di [TUR.GetAdjective] Kurdistan, meskipun ada pengakuan terhadap kemungkinan penolakan terhadap gagasan tersebut di dalam negeri mengingat betapa kewalahannya kerajaan [FRA.GetAdjective].\n\nJika [FRA.GetAdjective] diberikan konsesinya di [TUR.GetNameDef], maka mereka akan terikat melalui perjanjian untuk membantu [GRE.GetNameDef] setelah perang dengan [TUR.GetNameDef] dimulai. Jika mosi tersebut gagal untuk disetujui, maka apapun hasil dari Konvensi Heraklion [FRA.GetNameDef] tidak akan mempunyai kewajiban apapun terhadap [GRE.GetNameDef] ketika perang mereka dimulai."
 bftb_greece.15.a: "Kami memilih ya!"
 bftb_greece.15.b: "Kami memilih tidak!"
 GRE_french_kurdistan_option_tt: "Jika mosi tersebut disahkan dan Konvensi Heraklion pada akhirnya berhasil, maka setelah penyerahan §Y[TUR.GetNameDefCap]§! §Y[FRA.GetNameDefCap]§! akan membentuk negara boneka §YKurdi§! di semua negara bagian yang dikuasai [TUR.GetAdjective] yang merupakan inti dari §YKurdistan§!."
 bftb_greece.16.t: "Konvensi Heraklion - [FRA.GetAdjective] mendapatkan Mandatnya!"
 bftb_greece.16.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [FRA.GetNameDef] harus diberikan mandat di Kurdistan setelah berhasil menggulingkan negara [TUR.GetAdjective]. Para pejabat [FRA.GetAdjective] telah memuji para delegasi yang hadir karena sikap kenegarawanan mereka yang bijaksana, dan telah menyampaikan instruksi kepada pemerintah pusat [FRA.GetAdjective] untuk mulai merencanakan pembentukan pemerintahan di wilayah tersebut."
 bftb_greece.16.a: "Ya, sudahlah!"
 bftb_greece.17.t: "Konvensi Heraklion - [FRA.GetAdjective] ditolak Mandatnya!"
 bftb_greece.17.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [FRA.GetNameDef] harus ditolak wilayah mana pun di Kurdistan setelah negara bagian [TUR.GetAdjective] berhasil ditaklukkan. Para pejabat [FRA.GetAdjective] hampir memutuskan untuk meninggalkan konvensi sepenuhnya, dan menggambarkan peristiwa tersebut sebagai hal yang menggelikan, sebelum mencapai konsensus bahwa mereka lebih memilih untuk tetap dapat mempengaruhi proses selanjutnya meskipun mereka tidak dijanjikan apa pun."
 bftb_greece.17.a: "Tidak, tidak!"
 bftb_greece.18.t: "Konvensi Heraklion - Protektorat [ENG.GetAdjective] di Armenia?"
 bftb_greece.18.desc: "Topik putaran pemungutan suara ini adalah apakah [ENG.GetNameDef] harus diberikan protektorat Armenia di [TUR.GetAdjective] [354.GetName] setelah penyerahan [TUR.GetNameDef] atau tidak. Topik apakah negara Armenia harus dibebaskan di dalam perbatasan [TUR.GetAdjective] telah menjadi perdebatan mengingat kejadian-kejadian yang meresahkan baru-baru ini, namun delegasi [ENG.GetAdjective] berpendapat bahwa mendirikan negara Armenia di perbatasan [SOV.GetAdjective] bukan hanya hal moral yang harus dilakukan, tetapi juga merupakan posisi yang sangat strategis untuk diambil.\n\nJika [ENG.GetAdjective] diberikan konsesinya di [TUR.GetNameDef], maka mereka akan terikat melalui perjanjian untuk membantu [GRE.GetNameDef] setelah perang dengan [TUR.GetNameDef] dimulai. Jika mosi tersebut gagal untuk disetujui, maka apapun hasil dari Konvensi Heraklion [ENG.GetNameDef] tidak akan mempunyai kewajiban apapun terhadap [GRE.GetNameDef] ketika perang mereka dimulai."
 bftb_greece.18.a: "Kami memilih ya!"
 bftb_greece.18.b: "Kami memilih tidak!"
 GRE_british_armenia_option_tt: "Jika mosi tersebut disetujui dan Konvensi Heraklion pada akhirnya berhasil, maka setelah §Y[TUR.GetNameDefCap]§! menyerah §Y[ENG.GetNameDefCap]§! akan membentuk negara boneka §YArmenia§! di §Y[354.GetName]§!."
 bftb_greece.19.t: "Konvensi Heraklion - [ENG.GetAdjective] mendapatkan Protektoratnya!"
 bftb_greece.19.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ENG.GetNameDef] harus diberikan protektorat Armenia yang dibentuk dari kekalahan [TUR.GetName]. Para pejabat [ENG.GetAdjective] telah memuji para delegasi yang hadir karena sikap kenegarawanan mereka yang bijaksana, dan telah menyampaikan instruksi kepada pemerintah pusat [ENG.GetAdjective] untuk mulai merencanakan pembentukan pemerintahan di wilayah tersebut."
 bftb_greece.19.a: "Ya, sudahlah!"
 bftb_greece.20.t: "Konvensi Heraklion - [ENG.GetAdjective] ditolak Bonekanya!"
 bftb_greece.20.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ENG.GetNameDef] harus ditolak haknya untuk mendirikan negara boneka Armenia di [TUR.GetNameDef] utara. Para pejabat [ENG.GetAdjective] mengecam keputusan tersebut dan menggambarkan keseluruhan konvensi sebagai sesuatu yang tidak jelas, namun memutuskan bahwa mereka lebih memilih untuk tetap dapat mempengaruhi proses selanjutnya meskipun mereka tidak mendapatkan jaminan apa pun."
 bftb_greece.20.a: "Tidak, tidak!"
 bftb_greece.21.t: "Konvensi Heraklion - [ITA.GetAdjective] Koloni di [342.GetName] dan [345.GetName]"
 bftb_greece.21.desc: "Topik pemungutan suara kali ini adalah apakah [ITA.GetNameDef] harus diberikan wilayah jajahan di selatan [TUR.GetNameDef] setelah [TUR.GetNameDef] ditaklukkan atau tidak. Setiap peserta mempunyai keraguan mengenai penyerahan wilayah di Mediterania secara cuma-cuma kepada [ITA.GetAdjective], namun delegasi [ITA.GetAdjective] menirukan kata-kata [ITA.GetLeader] ketika mereka dengan tegas menyatakan bahwa pemberian wilayah ini hanya akan memperbaiki beberapa kesalahan 'vittoria mutilata'.\n\nDiputuskan oleh negara-negara lain yang hadir sebelum Konvensi Heraklion dimulai secara resmi bahwa keterlibatan [ITA.GetAdjective] dalam invasi [TUR.GetNameDef] tidak diinginkan. Daripada berpartisipasi secara langsung dalam perang, jika [ITA.GetNameDef] diberikan konsesi maka mereka akan terikat pada perjanjian non-agresi dengan [GRE.GetNameDef] dan perjanjian non-intervensi sehubungan dengan perang hipotetis dengan [TUR.GetNameDef]. Jika mosi tersebut gagal untuk disetujui, maka apapun hasil dari Konvensi Heraklion [ITA.GetNameDef] tidak akan mempunyai kewajiban apapun terhadap [GRE.GetNameDef] ketika perang mereka dimulai dan bahkan mungkin berusaha untuk ikut campur."
 bftb_greece.21.a: "Kami memilih ya!"
 bftb_greece.21.b: "Kami memilih tidak!"
 bftb_greece.22.t: "Konvensi Heraklion - [ITA.GetAdjective] mendapatkan Wilayahnya!"
 bftb_greece.22.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ITA.GetNameDef] harus diberikan koloni yang membagi bangkai [TUR.GetName] yang kalah. Para pejabat [ITA.GetAdjective] memuji para delegasi yang hadir atas keputusan mereka yang bijaksana mengenai masalah ini, dan banyak anggota delegasi [ITA.GetAdjective] telah berbondong-bondong pulang untuk menyampaikan berita tersebut kepada [ITA.GetLeader]."
 bftb_greece.22.a: "Ya, sudahlah!"
 bftb_greece.23.t: "Konvensi Heraklion - [ITA.GetAdjective] ditolak Wilayahnya!"
 bftb_greece.23.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ITA.GetNameDef] harus ditolak haknya untuk mendirikan koloni di [TUR.GetNameDef] selatan, dan mengecam mosi itu sendiri sebagai [ITA.GetAdjective] penghasutan perang yang lebih bodoh. Para pejabat [ITA.GetAdjective] menyerang keputusan tersebut dan menggunakan seluruh situasi untuk menggambarkan bagaimana hal ini menjadi bukti lebih lanjut bahwa masyarakat [ITA.GetAdjective] benar dalam mempercayai 'vittoria mutilata'. Terlepas dari pandangan pribadi mereka mengenai masalah ini, delegasi [ITA.GetAdjective] telah diperintahkan untuk tetap menjadi bagian dari proses konvensi – tentunya dengan harapan bahwa mereka masih dapat mempengaruhi keputusan mengenai agenda terakhir dan terpenting."
 bftb_greece.23.a: "Tidak, tidak!"
 bftb_greece.24.t: "Konvensi Heraklion - Ide Megali"
 bftb_greece.24.desc: "Topik putaran pemungutan suara kali ini adalah apakah Ide Megali, cita-cita revanchis Yunani Raya yang sudah lama dianut, harus diizinkan oleh negara-negara besar yang hadir. [GRE.GetAdjective] pemimpin nasional [GRE.GetLeader] melakukan kunjungan mendadak ke ruangan tempat Konvensi Heraklion diadakan dan memberikan pidato yang penuh semangat tentang bagaimana Ide Megali mewakili lebih dari sekedar perampasan tanah yang sinis, dan bagaimana hal ini akan menjadi realisasi dari mimpi suci bersama yang dipelihara selama berabad-abad oleh [GRE.GetAdjective] di seluruh dunia.\n\nHal ini tidak dipertanyakan: jika Ide Megali ditolak saat ini maka semua konsesi dan janji yang dibuat dalam Konvensi Heraklion akan batal. Masa depan demokrasi dan integritas [GRE.GetNameDef] dapat bergantung pada keputusan para hadirin hari ini."
 bftb_greece.24.a: "Kami memilih ya!"
 bftb_greece.24.b: "Kami memilih tidak!"
 GRE_megali_idea_option_tt: "Jika mosi tersebut disahkan, maka pada saat §Y[TUR.GetNameDefCap]§! penyerahan §Y[GRE.GetNameDefCap]§! akan mencaplok §YIstanbul§! dan negara bagian §Y[TUR.GetAdjective]§! yang berbatasan dengan §YAegean Laut§!. §RJika Ide Megali ditolak oleh Yunani, maka setiap usulan yang diajukan sejauh ini akan dibatalkan!§!"
 bftb_greece.25.t: "Konvensi Heraklion - Ide Megali Terlahir Kembali!"
 bftb_greece.25.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [GRE.GetNameDef] harus diizinkan untuk mewujudkan Ide Megali jika [TUR.GetNameDef] berhasil dalam perang. Para pejabat kami sangat gembira, dan [ROOT.GetLeader] telah menyampaikan pidato nasional bahwa Konvensi Heraklion berhasil. Tentu saja, tidak ada orang di luar lingkaran tertutup kami yang benar-benar mengetahui apa sebenarnya isi Konvensi Heraklion, namun banyak dari orang-orang kami yang menyimpulkan bahwa topik pembicaraan terutama mengenai realisasi Ide Megali.\n\nKami telah keluar dari Konvensi Heraklion dengan segala yang kami inginkan, namun selanjutnya adalah bagian yang sulit..."
 bftb_greece.25.a: "Berbahagialah mereka yang penghasut perang!"
 bftb_greece.26.t: "Konvensi Heraklion - Ide Megali Ditolak!"
 bftb_greece.26.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [GRE.GetNameDef] harus ditolak haknya untuk membentuk Yunani Raya sebagai bagian dari aspirasi mereka terhadap Ide Megali. Para pejabat kami mengkonfirmasi keputusan tersebut dengan para delegasi yang hadir dengan perasaan terkejut dan ngeri, dan memulangkan semua orang dengan pesan bahwa Konvensi Heraklion telah gagal. [ROOT.GetLeader] harus dengan gugup berpidato di hadapan massa di ibu kota dan memberi tahu mereka bahwa keseluruhan konvensi gagal, dan tentu saja tanggapan massa tidak baik. Kita sudah melihat aksi protes bermunculan di seluruh negeri, dan situasinya terancam di luar kendali kita."
 bftb_greece.26.a: "Buang-buang waktu saja..."
 ROOT_voted_aye_megali_effect: "Suara untuk Ya!"
 ROOT_voted_nay_megali_effect: "Beri suara untuk Tidak!"
 bftb_greece.29.t: "Komunis Merebut Kekuasaan di Yunani"
 bftb_greece.29.desc: "Laporan intelijen terbaru tampaknya mengkonfirmasi hal terburuk: komunis telah menguasai Athena dan memaksakan diri atas rakyat [FROM.GetAdjective]. Kita harus bersiap menghadapi kemungkinan konflik, jika [SOV.GetNameDef] tidak percaya bahwa kita cukup menerima intrik mereka maka mereka pasti akan mencoba mengikat [FROM.GetNameDef] ke dalam suatu rencana untuk melemahkan atau bahkan menghancurkan kita. Kabinet sudah tegas: kita harus menutup Selat [FROM.GetNameDef] dan [SOV.GetNameDef] untuk menghindari serangan yang lebih besar terhadap negara kita yang rentan. Ini akan memberi kita waktu, namun kita harus bersiap menghadapi kemungkinan konflik."
 bftb_greece.29.a: "Konflik pasti akan terjadi..."
 bftb_greece.30.desc: "Kabar baik telah sampai kepada kita dari Athena, di mana komunis [GRE.GetAdjective] telah mengambil alih pemerintahan. Mereka sekarang mencari perjanjian dengan kami untuk menentang [TUR.GetNameDef], karena mereka ingin bersama-sama mempengaruhi [TUR.GetNameDef] agar membuat konsesi terkait Bosporus yang secara efektif akan menjadikan mereka sebagai negara boneka kami. Namun sebagai tanggapannya, pemerintah [TUR.GetAdjective] menjadi panik dan sekarang menolak akses kami ke Laut Hitam."
 bftb_greece.30.a: "Kami telah [TUR.GetNameDef] terpojok sekarang"
 bftb_greece.30.b: "Mereka sendirian"
 bftb_greece.31.t: "Perjudian Bosporus"
 bftb_greece.31.desc: "Pejabat Politbiro dari [SOV.GetNameDef] akhirnya memutuskan untuk memberi tahu kami rencana rahasia mereka untuk masa depan [TUR.GetNameDef], dan peran kami sangatlah penting. Rencananya cukup sederhana: kami mengirimkan ultimatum yang tidak dapat diterima kepada [TUR.GetNameDef] yang bertindak atas nama [SOV.GetNameDef] dan revolusi internasional, dan menggunakan penolakan [TUR.GetAdjective] yang tidak dapat dihindari sebagai casus belli untuk mengobarkan konflik di Laut Aegea.\n\nKomando tinggi kami merekomendasikan penempatan unit terbaik kami di sepanjang perbatasan Thracia dengan [TUR.GetNameDef], dan mempersiapkan tentara untuk menyerang wilayah [TUR.GetAdjective] di lepas pantai pulau kami di Laut Aegea. Ada banyak orang di pemerintahan dan angkatan bersenjata kita yang ragu bahwa kita bisa mengalahkan angkatan bersenjata [TUR.GetAdjective] dalam konflik satu lawan satu, namun [SOV.GetNameDef] telah berjanji untuk memberikan dukungannya dengan memulai serangan di utara jika kita gagal dalam serangan awal terhadap Konstantinopel."
 bftb_greece.31.a: "Keberuntungan berpihak pada mereka yang berani."
 GRE_border_war_possible_tt: "Jika situasinya meningkat, kita mungkin terpaksa menghadapi §Rkonflik perbatasan§! di sepanjang perbatasan kita yang bertetangga dengan §Y[TUR.GetNameDef]§!."
 bftb_greece.32.t: "Orang-orang Yunani Mengirim Ultimatum Mereka"
 bftb_greece.32.desc: "Para pejabat kami bereaksi dengan kemarahan setelah membaca tuntutan yang sama sekali tidak realistis dan tidak masuk akal dari kaum Marxis [FROM.GetNameDef] yang tidak bertanggung jawab. Mengaku bertindak atas nama [SOV.GetNameDef], [FROM.GetNameDef] telah menuntut agar kami menerapkan kembali setiap tuntutan Perjanjian Lausanne dan mengizinkan kehadiran tentara [SOV.GetAdjective] di seluruh negara kami sehingga mereka dapat menjamin kepatuhan kami terhadap perjanjian tersebut sebagai 'pihak ketiga yang dapat diandalkan dan obyektif.'\n\nApa yang bisa diharapkan [FROM.GetAdjective] dari tuntutan menggelikan seperti itu selain konflik di sepanjang perbatasan kita? Kami selalu berusaha menjaga perdamaian di dalam negeri, namun jelas bahwa perdamaian tidak pernah menjadi pilihan. Jika [FROM.GetAdjective] benar-benar bertindak atas nama [SOV.GetNameDef], maka mungkin satu-satunya harapan keselamatan kita adalah menyerah dengan harapan kita dapat menghentikan tentara [SOV.GetAdjective] mengambil kendali atas negara kita dengan paksa. Meskipun demikian, kita tidak pernah menghindar dari perjuangan yang benar - apakah kita benar-benar pantas untuk memerintah jika kita tidak bersedia memperjuangkan nilai-nilai kita?"
 bftb_greece.32.a: "Kita harus tunduk."
 bftb_greece.32.b: "[FROM.GetAdjective] telah mengambil jalan yang gelap: kita harus memperbaikinya."
 bftb_greece.33.t: "[FROM.GetNameDef] Kirim!"
 bftb_greece.33.desc: "Dalam kejadian yang mengejutkan bagi pengamat [GRE.GetAdjective] dan [SOV.GetAdjective], [FROM.GetNameDef] telah menyetujui setiap permintaan yang diajukan kepada mereka. Izin mengenai akses ke Selat Turki telah ditetapkan berdasarkan status sebelum tahun 1936, dan pasukan [SOV.GetAdjective] telah diundang ke wilayah [FROM.GetAdjective] untuk memastikan [FROM.GetNameDef] menghormati ketentuan tuntutan yang diajukan sebelumnya.\n\n[SOV.GetLeader] secara pribadi mengucapkan selamat kepada [GRE.GetLeader] atas keberanian yang ditunjukkan bangsanya dalam memastikan caper ini ditarik, dan telah mulai mengerahkan pasukan untuk mempersiapkan penempatan mereka selama [TUR.GetNameDef]. Dengan [TUR.GetNameDef] dinetralkan sebagai ancaman, [GRE.GetNameDef] telah diberitahukan untuk lebih memperhatikan kemungkinan terjadinya medan perang di wilayah tersebut."
 bftb_greece.33.a: "Sebuah kejutan pastinya, tapi disambut baik!"
 bftb_greece.34.t: "[SOV.GetNameDefCap] Bentuk Pemerintahan Boneka Baru di Utara!"
 bftb_greece.34.desc: "Terkutuklah kami karena bodoh! [SOV.GetNameDef] telah menyalahgunakan kebebasan bergerak mereka di seluruh perbatasan kita untuk mendirikan pemerintahan komunis saingan yang dekat dengan negara mereka sendiri dan jelas-jelas bermaksud untuk menaklukkan seluruh bangsa kita atas nama mereka! Kita seharusnya sudah mengetahui sejak awal bagaimana hal ini akan terjadi; beberapa anggota pemerintah kita sendiri bahkan telah melarikan diri untuk bergabung dengan pemerintah saingannya di utara, dan menyatakan bahwa situasi kita tidak ada harapan lagi. Mungkin dengan menyerah saja kita akan terhindar dari lebih sedikit kematian di masa depan..."
 bftb_greece.34.a: "Lebih bijaksana untuk melayani dan hidup."
 bftb_greece.34.b: "Kami tidak menyerah pada tahun 1919, dan kami tidak akan menyerah sekarang!"
 bftb_greece.35.t: "Turki Menolak Ultimatum Kami!"
 bftb_greece.35.desc: "Seperti yang diharapkan, [FROM.GetNameDef] telah menolak ultimatum yang diberikan kepada mereka. Dengan menempatkan tentara kita, kita sekarang akan memprovokasi konflik yang secara bertahap meningkat dengan tujuan memicu perang total antar negara kita. Menang atau kalah, selama [SOV.GetNameDef] berdiri berdampingan dengan kita, kita tidak akan gagal."
 bftb_greece.35.a: "Sekarang segalanya menjadi menarik!"
 bftb_greece.36.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.36.desc: "Bertentangan dengan ekspektasi komando tinggi kami, kami telah menang atas pasukan [FROM.GetAdjective] di perbatasan kami. Didorong oleh kesuksesan kami yang luar biasa, angkatan bersenjata kami telah memulai serangan mereka lebih dalam ke wilayah [FROM.GetAdjective]. Komando tinggi kami, dilengkapi dengan fakta terkini, yakin [FROM.GetNameDef] akan jatuh dalam hitungan hari."
 bftb_greece.36.a: "Kami hanya perlu mendobrak pintu untuk melihat pembusukannya!"
 bftb_greece.37.t: "Pasukan [FROM.GetAdjective] Dikeluarkan!"
 bftb_greece.37.desc: "Para agitator [FROM.GetAdjective] telah berhasil dipukul mundur setelah serangan mereka yang tidak berperikemanusiaan di perbatasan kita, namun berdasarkan laporan dari para pengamat kita, seluruh cobaan ini belum berakhir. Pasukan [FROM.GetAdjective] berkumpul di sepanjang Kepulauan Aegean, dan secara mengejutkan memindahkan persenjataan mendekati [339.GetName]. Ada berita yang lebih buruk lagi: kita mendengar peningkatan pergerakan secara dramatis di sepanjang perbatasan [SOV.GetAdjective] dan komunikasi yang disadap menyiratkan bahwa serangan di utara dapat terjadi kapan saja. Kita harus bersiap; kita harus bertahan."
 bftb_greece.37.a: "Sejajarkan komunis dan kami akan membantai mereka."
 TUR_border_conflicts_in_trabzon_tt: "Akan lebih bijaksana untuk menempatkan pasukan di sepanjang perbatasan dengan §Y[354.GetName]§! dan §Y[187.GetName]§! sebelum keadaan menjadi buruk sekali lagi."
 bftb_greece.38.t: "Turki Menang Atas Pasukan Kita!"
 bftb_greece.38.desc: "Sayangnya, tampaknya pasukan kami tidak mampu menembus pertahanan [FROM.GetAdjective] di [341.GetName]. Komando tinggi, tentu saja, kecewa dengan hasilnya, namun tidak terkejut. Jika pasukan [FROM.GetAdjective] tidak mau membalas, maka kita harus melakukan eskalasi sekali lagi. Kali ini, [SOV.GetNameDef] akan menyerang posisi [FROM.GetAdjective] di utara sementara kita melakukan dua serangan pantai dari [187.GetName] di [339.GetName] dan [340.GetName]. Bagaimana mungkin kita gagal kali ini?"
 bftb_greece.38.a: "Untuk [FROM.GetNameDef], game ini telah dicurangi dari awal..."
 bftb_greece.39.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.39.desc: "Pasukan kami, yang tidak siap menghadapi serangan kurang ajar dari angkatan bersenjata [FROM.GetAdjective], berhasil dipukul mundur di [341.GetName] dan menimbulkan kerugian yang sangat besar bagi bangsa kami. Pasukan [FROM.GetAdjective] tidak menghentikan kemajuan mereka dan deklarasi perang pasti akan segera terjadi. Meskipun kekalahan kami mengecewakan, namun tidak terlalu menghancurkan - perang ini baru saja dimulai, dan rakyat kami berdiri teguh bersama kami dalam perang melawan saingan lama kami."
 bftb_greece.39.a: "[FROM.GetAdjective] membuat kita tidak punya pilihan lain!"
 bftb_greece.40.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.40.desc: "Seperti yang diharapkan oleh komando tinggi kami, kami telah menang atas pasukan [FROM.GetAdjective] di perbatasan kami dan menghancurkan pertahanan Izmir. Didorong oleh kesuksesan kami yang luar biasa, angkatan bersenjata kami telah mulai melancarkan serangan ke wilayah [FROM.GetAdjective]. Komando tinggi kami, yang semakin berani dengan kemenangan kami, yakin [FROM.GetNameDef] akan jatuh dalam hitungan minggu."
 bftb_greece.40.a: "Melalui Smyrna, kita akan menguasai seluruh negeri!"
 bftb_greece.41.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.41.desc: "Serangan [FROM.GetAdjective] terhadap [339.GetName] merupakan kegagalan bagi mereka, namun tetap merupakan kerugian besar bagi kami. [ROOT.GetLeader] secara pribadi membuat perbandingan dengan tahun 1919, ketika pasukan [FROM.GetAdjective] terakhir kali melancarkan serangan kejam di [339.GetName].\n\nMeskipun para pejabat di ibukota berduka atas mereka yang tewas dalam Pengepungan singkat [339.GetName], seluruh bangsa sangat marah atas serangan berani terhadap kedaulatan kita yang dilakukan oleh musuh lama. Serangan mendadak terhadap [341.GetName] sungguh keji, namun kerugian yang terjadi di [339.GetName] tidak dapat dimaafkan. Jika pemerintah [FROM.GetAdjective] terlalu pengecut untuk menyampaikan deklarasi perang secara terbuka, maka kami akan menyediakannya untuk mereka."
 bftb_greece.41.a: "Kami akan membalaskan dendam mereka yang gugur!"
 bftb_greece.42.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.42.desc: "Rencana kami telah mencapai batasnya; Komando Tinggi memperkirakan bahwa kami mungkin akan dipukul mundur satu kali oleh pasukan [FROM.GetAdjective] tetapi dipukul mundur dalam kedua serangan mendadak tersebut benar-benar menjadi pertanda buruk bagi kami. [ROOT.GetLeader] membatalkan segala persiapan serangan di masa depan tetapi segala upaya untuk menyelamatkan situasi tampaknya akan sia-sia, karena kami baru saja menerima deklarasi perang dari delegasi [FROM.GetAdjective]. Tampaknya situasinya telah berubah, dan belum tentu menguntungkan kita."
 bftb_greece.42.a: "Kami akan menang! Untuk Revolusi!"
 bftb_greece.43.t: "Pertempuran Bosporus Dimulai!"
 bftb_greece.43.desc: "Serangan [FROM.GetAdjective] terhadap [339.GetName] merupakan keberhasilan bagi mereka, dan kerugian besar bagi kami. [ROOT.GetLeader] secara pribadi membuat perbandingan dengan tahun 1919, ketika pasukan [FROM.GetAdjective] terakhir kali mengambil alih [339.GetName].\n\nMeskipun suasana di ibu kota sedang muram, seluruh bangsa sangat marah atas serangan berani terhadap kedaulatan kita yang dilakukan oleh musuh lama. Serangan mendadak terhadap [341.GetName] memang keji, namun kerugian yang terjadi di [339.GetName] tidak bisa dimaafkan. Jika [FROM.GetAdjective] benar-benar menginginkan perang lagi, maka kami akan menimpakan kepada mereka perang yang tidak akan pernah mereka lupakan."
 bftb_greece.43.a: "Untuk [TUR.GetNameDef]!"
 bftb_greece.44.t: "Kami Menang di [FROM.GetNameDef]!"
 bftb_greece.44.desc: "Seperti yang diharapkan, Tentara Merah berhasil menguasai garnisun [FROM.GetAdjective] yang menyedihkan di [354.GetName] dan telah membuka jalan bagi invasi rutin yang menggembirakan. Saat kita menyerang mereka dari utara, [GRE.GetAdjective] akan menyerang mereka dari barat. Mereka tidak punya peluang."
 bftb_greece.44.a: "[FROM.GetAdjective] partisipasi dalam Komintern adalah wajib."
 bftb_greece.45.t: "[FROM.GetAdjective] Dipukul Kembali di Perbatasan!"
 bftb_greece.45.desc: "Para pejabat terkejut mendengar bahwa pasukan kami yang berbasis di [354.GetName] berhasil mengusir penjajah [FROM.GetAdjective] dan mempertahankan posisi mereka meskipun ada banyak rintangan. Kami tidak hanya menerima komunike mendesak dari duta besar [FROM.GetAdjective] yang meminta maaf atas seluruh kejadian tersebut, namun mereka juga memberikan informasi intelijen yang memberatkan rezim [GRE.GetAdjective] sebagai dalang seluruh operasi tersebut. Kami telah diyakinkan bahwa kami tidak akan mengharapkan pembalasan apa pun dari [FROM.GetAdjective] jika perjuangan kami melawan [GRE.GetNameDef] meningkat menjadi perang."
 bftb_greece.45.a: "Kita telah menyelamatkan diri kita dari pelupaan."
 bftb_greece.46.t: "[FROM.GetAdjective] Pasukan Menolak Serangan Kami!"
 bftb_greece.46.desc: "Tersiar kabar bahwa pelanggaran terhadap [354.GetName] adalah kegagalan total dan merupakan pukulan telak terhadap harga diri internasional dan ego komando tinggi kita. Kami telah menyampaikan permintaan maaf yang tulus kepada pemerintah [FROM.GetAdjective] dan menarik dukungan apa pun terhadap rezim [GRE.GetAdjective] yang masih memusuhi negara bagian [FROM.GetAdjective] di barat."
 bftb_greece.46.a: "Seseorang akan ditembak karena ini!"
 bftb_greece.47.t: "[FROM.GetNameDefCap] Patah Posisi kami di [354.GetName]!"
 bftb_greece.47.desc: "Hanya sedikit penasihat yang terkejut bahwa pasukan [FROM.GetAdjective] berhasil memukul mundur pasukan kita di utara, namun hal ini tidak mengurangi rasa kecewa mereka. Pasukan [FROM.GetAdjective] belum menghentikan serangan mereka di perbatasan [354.GetName]: kami mendapat laporan pergerakan pasukan secara sporadis dan sangat besar di dekat perbatasan kami dan bahkan laporan tentang tentara [FROM.GetAdjective] yang melintasi garis demarkasi di [800.GetName]. Itu hanya berarti invasi. Kita harus bersiap menghadapi kemungkinan terburuk."
 bftb_greece.47.a: "Mungkinkah mantra ini membawa malapetaka bagi Tanah Air?"
 bftb_greece.48.t: "[FROM.GetAdjective] Menghasut Pemberontakan Komunis di Selatan!"
 bftb_greece.48.desc: "Rezim Marxis keji [FROM.GetNameDef] telah mempersenjatai teroris Josip Broz Tito dan memberinya keberanian untuk memulai pemberontakan di selatan! Bahayanya mungkin dapat diabaikan jika bukan karena fakta bahwa [FROM.GetAdjective] secara aktif bekerja sama dengan rezim baru di selatan dengan harapan dapat menggulingkan pemerintahan kita. Tampaknya kita tidak punya pilihan selain menumpas para pemberontak, dan kemudian mengerahkan pasukan kita ke ibu kota [FROM.GetAdjective] untuk menundukkan mereka."
 bftb_greece.48.a: "Itu mengecam Tito, dan [FROM.GetAdjective] terkutuk itu!"
 GRE_tito_backed_guerilla_war_tt: "§Ykomunis§!, dengan dukungan penuh dari §YYunani§!, telah memulai perang saudara kecil di selatan negara kita."
 bftb_greece.50.t: "Raja Membubarkan Parlemen Hellenic!"
 bftb_greece.50.desc: "Yang Mulia, Raja George II telah mengirimkan gelombang kejutan ke seluruh negara dengan proklamasinya bahwa ia akan secara langsung mengambil kendali negara dalam upaya untuk mencegah negara ini terkoyak oleh pertengkaran musuh politik. Untuk mencapai tujuan tersebut, keputusan pertama Raja adalah untuk menangguhkan Parlemen Hellenic tanpa batas waktu – sebuah lembaga yang telah dikutuk oleh Raja sebagai 'sarang ular beludak yang mementingkan diri sendiri'.\n\nKeputusan Raja ini disambut baik oleh sebagian orang, namun lebih banyak dikutuk oleh elemen masyarakat terkemuka lainnya. Kaum Venezelis yang merupakan republikan dan kaum komunis yang menyedihkan telah bersatu setelah berpuluh-puluh tahun bermusuhan karena keinginan mereka yang sama untuk melihat 'Raja Hellenes' digulingkan dari tahtanya dan disingkirkan secara permanen. Laporan intelijen saat ini menunjukkan bahwa perang saudara bisa saja terjadi dalam beberapa minggu atau bulan mendatang."
 bftb_greece.50.a: "Hak Raja untuk memerintah itu sakral!"
 GRE_absolute_monarch_hostile_factions_tt: "§RPerang Saudara§! kemungkinan besar akan segera terjadi..."
 bftb_greece.51.t: "Kaum Monarkis di Yunani Meminta Bantuan Kami!"
 bftb_greece.51.desc: "Pemerintahan pro-[ROOT.GetAdjective] di Athena telah meminta bantuan material dari kami setelah perpecahan politik di seluruh negara menyebabkan perang saudara yang membawa bencana. Tentu saja mereka mempunyai hak untuk menanyakan hal ini kepada kita, namun pertanyaan apakah mereka layak menerima materi yang mereka minta dari kita adalah pertanyaan yang hanya bisa kita jawab."
 bftb_greece.51.a: "Mereka pasti membutuhkan senapan."
 bftb_greece.51.b: "Kami dapat menyisihkan beberapa bahan untuk bantuan."
 bftb_greece.51.c: "Sebaiknya jangan ikut campur dalam urusan Yunani."
 bftb_greece.52.t: "[FROM.GetNameDefCap] Mengirimkan Senjata dan Relawan kepada kami!"
 bftb_greece.52.desc: "Kami baru saja selesai menurunkan senjata dan sukarelawan dari [FROM.GetNameDef] dari dermaga kami. Dukungannya sangat kami harapkan, dan jauh melebihi apa yang kami harapkan. Bantuan ini akan bermanfaat bagi kita dalam beberapa bulan mendatang."
 bftb_greece.52.a: "Sekutu sejati Raja!"
 bftb_greece.53.t: "[FROM.GetNameDefCap] Kirimkan Bantuan kepada kami!"
 bftb_greece.53.desc: "Kami baru saja selesai membongkar perbekalan yang dikirim dari [FROM.GetNameDef] dari dermaga kami. Dukungannya sangat diharapkan, dan merupakan bentuk persahabatan yang baik di masa-masa sulit ini. Bantuan ini akan bermanfaat bagi kita dalam beberapa bulan mendatang."
 bftb_greece.53.a: "Sekutu sejati Raja!"
 bftb_greece.54.t: "[FROM.GetNameDefCap] Menolak Membantu Kami"
 bftb_greece.54.desc: "Kami telah menerima kabar dari diplomat [FROM.GetAdjective] bahwa seruan kami untuk meminta bantuan tidak didengarkan, dan bahwa kami tidak boleh mengharapkan bantuan apa pun dari [FROM.GetNameDef]. Situasinya sangat disayangkan, namun kami akan bertahan bahkan tanpa bantuan kekuatan asing."
 bftb_greece.54.a: "Mengecewakan."
 bftb_greece.55.t: "[GRE.GetNameDefCap] Menyarankan Enosis"
 bftb_greece.55.desc: "Perwakilan dari [FROM.GetNameDef] telah menyarankan agar kita menggabungkan kedua negara kita menjadi satu. Mengutip sejarah dan warisan budaya bersama, perwakilan [FROM.GetAdjective] telah menyatakan bahwa merupakan kehendak pemerintah [FROM.GetAdjective] agar kita memfasilitasi konsep 'Enosis' yang telah lama diagungkan: penggabungan negara-negara kita menjadi satu kesatuan yang lebih besar."
 bftb_greece.55.a: "Ide yang luar biasa!"
 bftb_greece.55.b: "Siprus akan menentukan jalannya sendiri."
 end_of_cyprus_tt: "§RIni akan menghasilkan Game Over!§!"
 bftb_greece.56.t: "[CYP.GetNameDefCap] Berkomitmen pada Enosis"
 bftb_greece.56.desc: "Kami telah menerima kabar dari [FROM.GetAdjective] bahwa mereka bersedia memfasilitasi penyatuan kedua orang kami yang telah lama ditunggu-tunggu menjadi satu negara di bawah kendali kami. Perayaan telah diadakan di seluruh negara, dan [ROOT.GetLeader] secara pribadi melakukan perjalanan ke Nicosia dan memberikan pidato kepada orang-orang di sana untuk menandai hari bersejarah ini."
 bftb_greece.56.a: "Akhirnya Kin bersatu!"
 bftb_greece.57.t: "[CYP.GetNameDefCap] Tolak Enosis!"
 bftb_greece.57.desc: "Pejabat [FROM.GetAdjective] telah memberi tahu kami bahwa mereka tidak berniat melepaskan kedaulatan [FROM.GetAdjective] setelah melalui perjuangan yang panjang untuk mencapainya. Telah dinyatakan bahwa 'Enosis' bukanlah sebuah konsep yang ingin diterima oleh pemerintah [FROM.GetAdjective] saat ini."
 bftb_greece.57.a: "Itu bukanlah sebuah permintaan."
 bftb_greece.57.b: "Baiklah, jika itu keinginan mereka..."
 bftb_greece.58.t: "[FROM.GetNameDefCap] Meminta Enosis Dengan Siprus"
 bftb_greece.58.desc: "Kami telah didekati oleh delegasi [FROM.GetAdjective] untuk membahas masa depan koloni mahkota Siprus kami. [FROM.GetAdjective] melontarkan tuduhan bahwa upaya pembangunan bangsa Siprus selalu berakhir dengan kegagalan karena rakyat Siprus sebenarnya adalah orang [FROM.GetAdjective].\n\n[FROM.GetAdjective] memberikan surat dari [FROM.GetAdjective] Perdana Menteri [FROM.GetLeader] dimana sejarah konsep 'Enosis' diuraikan secara rinci, sebelum seruan tegas terakhir untuk persatuan Siprus dan [FROM.GetNameDef] dibuat. Delegasi [FROM.GetAdjective] telah mencoba meyakinkan perwakilan kami bahwa ini bukanlah masalah irredentisme kasar dari pihak [FROM.GetAdjective]; Siprus dan [FROM.GetNameDef] memiliki warisan budaya yang sama, sejarah yang sama, bahasa yang sama, dan dalam perspektif [FROM.GetAdjective]: takdir yang sama.\n\nPejabat militer kami telah menekankan pentingnya Siprus sebagai pangkalan militer strategis yang penting di Mediterania, namun penasihat kebijakan luar negeri kami menekankan bahwa sekutu [FROM.GetAdjective] yang diberi wewenang dapat menyediakan jauh lebih banyak daripada yang dapat disediakan oleh Siprus sendiri sebagai pangkalan udara dan angkatan laut. Pilihan pada akhirnya jatuh ke tangan kabinet [ROOT.GetAdjective], namun kita harus memastikan untuk tidak membiarkan perwakilan [FROM.GetAdjective] menunggu terlalu lama untuk mendapatkan tanggapan kita."
 bftb_greece.58.a: "Kami menerima proposal Anda dengan imbalan aliansi formal."
 bftb_greece.58.b: "Biarkan mereka memilikinya; Siprus tidak ada pengaruhnya bagi kami."
 bftb_greece.58.c: "Pemerintah [FROM.GetAdjective] harus berbagi kekuasaan dengan otoritas 'Siprus'."
 bftb_greece.58.d: "Orang-orang Yunani yang tamak tidak mendapat apa-apa!"
 bftb_greece.59.t: "[FROM.GetNameDefCap] Setuju Fasilitasi Enosis!"
 bftb_greece.59.desc: "Suasana di ibu kota bisa digambarkan sebagai 'kegembiraan' setelah [ROOT.GetLeader] mengumumkan kepada negara bahwa setelah bertahun-tahun, impian [ROOT.GetAdjective] Enosis dengan Siprus akhirnya akan menjadi kenyataan, dan semuanya berkat teman-teman [FROM.GetAdjective] kita. Para administrator kami tidak membuang waktu untuk melakukan perjalanan ke Siprus untuk memastikan peralihan kekuasaan berjalan selancar mungkin.\n\nIni adalah hari yang sungguh luar biasa dan bersejarah bagi [ROOT.GetNameDef]. Siprus telah lama menjadi bagian dari kesadaran kolektif [ROOT.GetAdjective], dan kini mereka akhirnya berada di pangkuan peradaban tempat mereka berasal."
 bftb_greece.59.a: "Akhirnya bersama!"
 bftb_greece.59.b: "Kita tidak bisa mengorbankan otonomi kita demi Enosis."
 bftb_greece.60.t: "[FROM.GetNameDefCap] Menerima Enosis Parsial"
 bftb_greece.60.desc: "[FROM.GetAdjective] telah menawarkan kompromi yang aneh terhadap permintaan awal kami agar mereka memfasilitasi Enosis: mereka bersedia memenuhi permintaan kami dengan syarat kami bekerja sama dengan pemerintah Siprus yang memiliki kedudukan yang sama dengan wilayah kekuasaan [FROM.GetAdjective]. Ini bukan kejadian yang tidak diinginkan, hanya... tidak terduga.\n\nDi pihak mereka, pemerintah Siprus telah sepakat bahwa jika [ROOT.GetNameDef] menunjukkan komitmen yang cukup di Siprus dengan membangun negara mereka yang masih baru, maka mereka tidak akan menolak Enosis total di antara kita. Namun, sampai hari itu tiba, kita harus puas dengan sekutu baru Siprus yang terikat erat dengan kita."
 bftb_greece.60.a: "Selamat datang, saudara-saudara!"
 bftb_greece.61.t: "[FROM.GetNameDefCap] Tolak Enosis!"
 bftb_greece.61.desc: "Kepercayaan dan keyakinan kita terhadap sekutu yang telah lama kita dambakan tampaknya salah tempat; [FROM.GetNameDef] bahkan menolak untuk menerima gagasan untuk memindahkan pulau [ROOT.GetAdjective] Siprus ke dalam kendali kami. Mereka menyebutkan pentingnya pulau ini secara strategis dan kekhawatiran akan tindakan revanchisme [ROOT>GetAdjective] sebagai alasan mengapa, di mata mereka, kami tidak layak mendapatkan pulau tersebut.\n\nTidak dapat dikatakan bahwa kami sepenuhnya terkejut, namun hal ini tidak mengurangi rasa kecewa kami secara kolektif. Berapa tahun kita menunggu Siprus dikembalikan ke tanah air? Berapa tahun lagi kita harus menunggu karena kemunduran ini? Harus dikatakan bahwa antusiasme kami mengenai hubungan kami dengan [FROM.GetNameDef] telah berkurang secara signifikan oleh kejadian ini."
 bftb_greece.61.a: "Kami akan mengingat ini..."
 bftb_greece.62.t: "[FROM.GetNameDefCap] Menyarankan Lamaran Bersama untuk Bergabung dengan Axis!"
 bftb_greece.62.desc: "Ketika muncul kabar bahwa rezim lama [FROM.GetAdjective] telah digantikan oleh rezim fasis, perasaan takut yang besar membayangi para penasihat di ibu kota. Perang, menurut kami, telah menjadi sesuatu yang tidak dapat dihindari: dan menjadi semakin sengit karena upaya kami sebelumnya untuk menjaga perdamaian di kawasan Aegean. Rupanya takdir membuktikan kita salah.\n\nKami telah didekati dengan tawaran unik: pemerintahan fasis [FROM.GetNameDef] percaya bahwa perang tidak dapat dihindari akan menimpa kedua negara kami. [FROM.GetLeader], terlepas dari kecenderungan ideologisnya, memiliki sentimen yang sama dengan kita bahwa tidak bijaksana jika kita membuang upaya diplomatik selama puluhan tahun dari kedua pihak demi perang yang pasti akan menjadi perang yang besar dan mengerikan. Untuk mencapai tujuan tersebut, pemerintah [FROM.GetNameDef] telah menyarankan agar kita bersama-sama mengikat diri pada kekuatan fasis yang sedang berkembang di Eropa. [FROM.GetLeader] percaya bahwa supremasi fasis di benua ini tidak dapat dihindari, dan bahwa bersama-sama kita berdua memiliki kekuatan untuk mengubah situasi sehingga perang dapat berakhir dengan lebih cepat dan menentukan. [FROM.GetLeader] menyebutnya 'rahmat'; [ROOT.GetLeader] tidak begitu yakin."
 bftb_greece.62.a: "Atas nama perdamaian, marilah kita berperang."
 bftb_greece.62.b: "[FROM.GetAdjective] benar-benar sudah gila..."
 bftb_greece.63.t: "[FROM.GetNameDefCap] Menyetujui Pakta Persahabatan Hellenoturkisme!"
 bftb_greece.63.desc: "Sukses! Duta Besar [FROM.GetAdjective] telah menyampaikan persetujuan pemerintahnya terhadap usulan pakta persahabatan kami. Bekerja sama dengan kekuatan fasis sambil terikat bersama, kita tidak mungkin kalah."
 bftb_greece.63.a: "Tolong, formulir pendaftaran dua faksi!"
 bftb_greece.63.b: "Atau mungkin... kita tidak membutuhkan orang Turki?"
 GRE_no_turkey_needed: "Melalui pemalsuan dan penipuan kita akan merusak hubungan §YTurki§! dengan §Ykekuatan fasis§!."
 bftb_greece.64.t: "[FROM.GetNameDefCap] Tegas Menolak Pakta Persahabatan Hellenoturkisme!"
 bftb_greece.64.desc: "Tampaknya pemerintah [FROM.GetAdjective] menderita karena kurangnya pandangan ke depan. Mereka tidak akan bergabung dengan pemenang yang tak terelakkan bersama kita, karena mereka pengecut atau bodoh. Tidak ada konsekuensinya, jalan kita sudah ditentukan dan apapun yang terjadi selanjutnya sehubungan dengan [FROM.GetNameDef] sebagian adalah kesalahan mereka sendiri."
 bftb_greece.64.a: "Yang kuat akan mewarisi bumi; orang yang lemah lembut akan binasa."
 bftb_greece.65.t: "[FROM.GetNameDefCap] dan [TUR.GetNameDef] Menyarankan Kemitraan Strategis"
 bftb_greece.65.desc: "Bagaikan kepingan puzzle, segala sesuatunya tampak berjalan pada tempatnya. Pergantian rezim di Berlin tidak terduga dan menimbulkan banyak keraguan terhadap masa depan bangsa kita. Masa depan itu menjadi lebih jelas melalui proposal yang dikirimkan kepada kami dari Athena.\n\nTampaknya [FROM.GetNameDef] dan [TUR.GetNameDef] mempunyai keinginan untuk membentuk aliansi strategis jangka panjang dengan pemerintah kita. Kita telah merugikan sekutu-sekutu kita, dan masuknya kedua negara ini ke dalam Pakta Mediterania tentunya akan sangat membantu mengamankan ambisi regional kita. Meskipun demikian, siapa bilang keduanya bukanlah subjek ambisi kita yang lain."
 bftb_greece.65.a: "Bersama-sama, kita akan membuat sejarah!"
 bftb_greece.65.b: "Rencana kami untuk pasangan tersebut tentu saja tidak memberi ruang bagi aliansi."
 bftb_greece.66.t: "[FROM.GetNameDefCap] dan [TUR.GetNameDef] Mendaftar untuk Keanggotaan [GER.GetFactionName]"
 bftb_greece.66.desc: "Kami telah bertemu dengan delegasi dari [FROM.GetNameDef] dan [TUR.GetNameDef] dan cukup terkejut mendengar keduanya mengajukan lamaran bersama ke [ROOT.GetFactionName]. Ini bukanlah kejutan yang tidak diinginkan, namun tetap saja merupakan kejutan. Kita harus menentukan apakah menjadikan mereka sebagai mitra dalam aliansi kita akan memajukan tujuan kita, atau menghambatnya."
 bftb_greece.66.a: "Mereka merupakan sekutu yang baik di masa-masa sulit ini."
 bftb_greece.66.b: "Nein, kita tidak membutuhkan mereka."
 bftb_greece.67.t: "[FROM.GetNameDefCap] Menyarankan Kemitraan Strategis!"
 bftb_greece.67.desc: "Bagaikan kepingan puzzle, segala sesuatunya tampak berjalan pada tempatnya. Pergantian rezim di Berlin tidak terduga dan menimbulkan banyak keraguan terhadap masa depan bangsa kita. Masa depan itu menjadi lebih jelas melalui proposal yang dikirimkan kepada kami dari Athena.\n\nTampaknya [FROM.GetNameDef] mempunyai keinginan untuk membentuk aliansi strategis jangka panjang dengan pemerintah kita. Kita telah merugikan sekutu-sekutu kita, dan bantuan [FROM.GetNameDef] tentunya akan sangat membantu dalam mengamankan ambisi regional kita. Namun, siapa yang dapat mengatakan bahwa ini bukan sekadar upaya terakhir yang menyedihkan untuk bertahan hidup? Mungkin mereka tidak benar-benar berupaya menjadi sekutu kita; mungkin mereka melihat tulisan di dinding, dan bagaimana keadaan mereka akan berakhir jika mereka menentang kita... dan mungkin itu bukanlah perbedaan yang sangat relevan bagi kita."
 bftb_greece.67.a: "Roma dan Athena - akhirnya bersatu kembali!"
 bftb_greece.67.b: "Predator tidak bersahabat dengan mangsanya."
 bftb_greece.68.t: "[FROM.GetNameDefCap] Berlaku untuk Keanggotaan [GER.GetFactionName]!"
 bftb_greece.68.desc: "Kami telah bertemu dengan delegasi dari [FROM.GetNameDef] dan cukup lega mendengar bahwa pemerintahan [FROM.GetAdjective] telah menyatakan keinginan untuk melihat [FROM.GetNameDef] di [ROOT.GetFactionName]. Hal ini tidak mengherankan: posisi [FROM.GetAdjective] tidak dapat dipertahankan tanpa kami. Kita harus menentukan apakah menjadikan mereka sebagai mitra dalam aliansi kita akan memajukan tujuan kita, atau menghambatnya."
 bftb_greece.68.a: "Willkommen, Griechenland!"
 bftb_greece.68.b: "Tidak, tidak mungkin!"
 bftb_greece.69.t: "[FROM.GetNameDefCap] Menolak Permintaan Aliansi Kami!"
 bftb_greece.69.desc: "Kami telah diberitahu oleh diplomat [FROM.GetAdjective] bahwa [FROM.GetLeader] merasa bukanlah keputusan yang bijaksana untuk menambahkan kami ke dalam aliansi erat mereka. Mengatakan kami kecewa adalah sebuah pernyataan yang meremehkan. Bagaimanapun juga, tanpa aliansi dengan [FROM.GetNameDef] kita sekarang harus membuka jalan kita sendiri untuk melewati masa krisis ini."
 bftb_greece.69.a: "Kami akan tetap berdiri ketika semua ini selesai."
 bftb_greece.70.t: "Eleftherios Venizelos Meninggal di Pengasingan"
 bftb_greece.70.desc: "Eleftherios Venizelos, pemimpin Venezelist dan tokoh penting dalam politik Yunani, meninggal dunia di pengasingan setelah digulingkan oleh militer pada tahun 1935. Venizelos adalah seorang kontributor yang bersemangat terhadap sistem multi-partai Yunani dan seorang tokoh yang mungkin tak tertandingi dalam hal seberapa besar pengaruhnya terhadap kesadaran nasional Yunani.\n\nNamun, bukan kesuksesannya yang akan diingat oleh Eleftherios Venizelos, melainkan banyak kegagalannya. Venizelos-lah yang memperjuangkan kekuatan destruktif dari republikanisme di negara ini, dan revisionisme Venizelos yang tidak masuk akallah yang membuat bangsa kita hampir musnah dalam Perang Yunani-Turki tahun 1919. Setiap masalah yang dihadapi Yunani saat ini bisa jadi disebabkan oleh Venizelos sebagai sumber utama dari semua kesengsaraan bangsa kita.\n\nDia adalah seorang revolusioner, negarawan, dan pionir politik; dia adalah seorang pengacau, penghasut perang, dan seorang yang gagal. Apa lagi yang perlu dikatakan tentang Eleftherios Venizelos selain bahwa kami senang dia tidak akan pernah lagi muncul di Yunani setelah semua rasa sakit yang dia sebabkan."
 bftb_greece.70.a: "Selamat jalan."
 bftb_greece.71.t: "Eleftherios Venizelos Meninggal Dunia"
 bftb_greece.71.desc: "Perdana Menteri Eleftherios Venizelos, pemimpin Venezelist dan tokoh politik Yunani yang dihormati, telah meninggal dunia dengan damai di rumahnya. Venizelos adalah seorang kontributor yang bersemangat terhadap sistem multi-partai Yunani dan seorang tokoh yang mungkin tak tertandingi dalam seberapa besar pengaruhnya terhadap kesadaran nasional Yunani.\n\nBagaimana kata-kata saja bisa memberikan keadilan bagi orang yang telah memberikan begitu banyak dirinya untuk negara dan bangsanya? Beliau adalah arsitek bangsa yang kita punya hak istimewa untuk mengabdi saat ini, dan warisan abadi yang beliau tinggalkan akan bertahan lebih lama dari kita semua. Satu-satunya titik hitam dalam catatan sempurna Venizelos adalah kerugian besar yang diderita bangsa kita setelah Perang Yunani-Turki yang menghancurkan pada tahun 1919. Ini adalah noda pada warisan sempurna yang ingin kita balas dendam sepenuhnya.\n\nEleftherios Venizelos adalah seorang revolusioner, negarawan, dan pionir politik; dia adalah Ethnarch kita, dan kita akan mengingatnya sebagai dia yang berhati singa tanpa kompromi. Themistoklis Sofoulis telah mengambil alih jabatan Perdana Menteri dan pemimpin Fileleftheron, dan telah mendeklarasikan hari berkabung nasional atas meninggalnya bapak Yunani modern yang baru saja meninggal."
 bftb_greece.71.a: "Yunani berhutang budi kepada Anda, yang tidak akan pernah bisa dibayar kembali..."
 bftb_greece.91.t: "EEE Membuka Pusat Bantuan Untuk Pengungsi Anatolia"
 bftb_greece.91.desc: "Dalam upayanya yang sinis untuk menarik lebih banyak pengikutnya, Georgios Kosmidis telah menggunakan dana gerakannya untuk membuka pusat bantuan bagi sesama pengungsi dari [TUR.GetNameDef] seperti dirinya. Akan sangat terpuji jika dia tidak menggunakan pusat bantuan ini sebagai pusat rekrutmen untuk gerakan psikotiknya.\n\nKita berada dalam posisi yang sulit: jelas Kosmidis bermaksud untuk terus mendukung pusat-pusat ini untuk merekrut pengungsi Anatolia yang kehilangan haknya, jadi apakah kita akan menutup mereka untuk membendung racunnya? Atau apakah kita akan menjaga reputasi kita dan membiarkan pusat-pusat ini terus beroperasi? Beberapa orang mungkin berpendapat bahwa lebih baik jika pengungsi miskin bekerja di pusat bantuan fasis daripada mereka yang menderita di daerah kumuh."
 bftb_greece.91.a: "Inisiatif yang patut didukung!"
 bftb_greece.91.b: "Tutup."
 bftb_greece.92.t: "EEE Menuntut Upah Lebih Tinggi untuk Pekerja [ROOT.GetAdjective]"
 bftb_greece.92.desc: "EEE telah mengeksploitasi sorotan nasional yang ditujukan kepada mereka dengan melancarkan serangan pedas terhadap apa yang mereka anggap sebagai lemahnya pendekatan kita terhadap kesejahteraan. Gagasan bahwa kaum fasis yang muncul entah dari mana dan berpikir bahwa mereka berada dalam posisi untuk menguliahi kita tentang kebijakan fiskal dan sosial adalah hal yang menggelikan, namun masyarakat tampaknya menanggapinya dengan sangat serius."
 bftb_greece.92.a: "Mungkin... upah minimum simbolis?"
 bftb_greece.92.b: "Kami tidak tunduk pada intimidasi fasis."
 bftb_greece.93.t: "Anggota EEE Terlibat dalam Kekerasan Jalanan dengan Polisi kami!"
 bftb_greece.93.desc: "Perkelahian antara anggota EEE dan kepolisian kita sendiri telah terjadi di seluruh negeri, membentuk sebuah tablo kekerasan politik yang kita harap akan kita tinggalkan di masa lalu. Tampaknya, jika dilihat dari semua laporan mengenai rawat inap dan meningkatnya kekerasan, kita belum mengalami hal tersebut.\n\nBeberapa menteri menyarankan untuk mengambil sikap yang sangat keras terhadap kekerasan ini untuk menunjukkan kepada negara bahwa kita tidak menoleransi premanisme semacam ini, namun menteri-menteri lain mengingatkan bahwa melawan aksi balas dendam fasis bukanlah pertempuran yang bisa kita menangkan. Masyarakat marah dan tidak puas, namun hal ini tidak memberikan mereka hak untuk melakukan tindakan kekerasan yang tidak senonoh."
 bftb_greece.93.a: "Keluhan mereka wajar."
 bftb_greece.93.b: "Kekerasan yang terjadi sangat menyedihkan, dan massa harus dibubarkan."
 bftb_greece.94.t: "Anggota EEE Menjarah Pabrik Milik Asing dan Mendistribusikan Barang Curian!"
 bftb_greece.94.desc: "Sayangnya, dalam situasi yang sangat familiar, para penganut EEE telah membobol pabrik-pabrik milik asing dengan tujuan mendistribusikan barang-barang yang diproduksi di dalam negeri kepada masyarakat miskin dan kehilangan haknya. Georgios Kosmidis dan pimpinan EEE mengaku tidak mengetahui kegiatan tersebut, namun juga dengan penuh semangat membela laki-laki dan perempuan yang mengambil bagian dalam rangkaian penjarahan yang tampaknya bersifat altruistik.\n\nPerilaku seperti ini benar-benar tidak dapat ditoleransi: kami telah menerima keluhan dari tokoh asing yang datang dari negara-negara seperti [ENG.GetNameDef] dan [FRA.GetNameDef]. Namun, jika kita bertindak atas nama kaum industrialis, kita akan terlihat seperti boneka pemodal asing; alternatifnya, jika kita membiarkan anarki ini merajalela, maka kita akan terlihat sebagai pemerintahan yang tidak mampu di mata komunitas internasional."
 bftb_greece.94.a: "Kita seharusnya tidak menghentikan mereka."
 bftb_greece.94.b: "Anarki ini tidak pantas bagi kita!"
 bftb_greece.95.t: "EEE Berjanji untuk Perjuangan kita!"
 bftb_greece.95.desc: "EEE yang selama ini menjadi duri bagi kita, rupanya bersedia bersatu dengan pemerintah melawan musuh bersama. Georgios Kosmidis telah menjadi salah satu pendukung paling vokal untuk perang melawan [TUR.GetNameDef], dan sekarang perang tersebut telah mencapai wilayah kita, EEE bersedia mengesampingkan politik partai untuk melihat musuh [TUR.GetAdjective] kita direndahkan di hadapan tentara kita."
 bftb_greece.95.a: "Bersatu, kita tidak bisa dihentikan!"
 bftb_greece.95.b: "Kami akan menang tanpa mengotori diri kami dengan fasisme."
 bftb_greece.96.t: "Aristoteles Onassis Kembali ke [ROOT.GetNameDef]"
 bftb_greece.96.desc: "Tokoh kaya dan sosialita yang dicintai secara internasional Aristoteles Onassis telah kembali ke [ROOT.GetNameDef] untuk pertama kalinya setelah bertahun-tahun. Dia tidak menerima pertanyaan dari media, dan dia sulit dilacak oleh para pengamat kami, namun laporan menunjukkan dia mengambil hati dari populasi pengungsi Anatolia dan mungkin mengorganisir upaya untuk menduduki jabatan tersebut."
 bftb_greece.96.a: "Apa yang dia rencanakan?"
 bftb_greece.101.t: "Kaum Venezelis dan Komunis Bersatu Melawan Pemerintahan Absolut Raja"
 bftb_greece.101.desc: "Jika ada keraguan mengenai terbentuknya aliansi antara komunis dan Venezelist, maka hal itu tidak akan terjadi lagi. Kami telah menerima laporan bahwa komunis telah menyelundupkan Eleftherios Venizelos kembali ke negara tersebut dengan harapan dapat menopangnya sebagai pemimpin sementara setelah mereka menggulingkan monarki.\n\nRencana yang bodoh, bahkan untuk sekelompok pengkhianat merah. Bagaimana mereka bisa berpikir bahwa Venizelos akan menyerahkan kekuasaan kepada mereka begitu dia diberikan? Ini adalah kegilaan. Lagi pula, baik kaum komunis maupun kaum Venezelis bukanlah kelompok yang paling masuk akal. Kita harus bersiap menghadapi apa yang pasti akan menjadi perang saudara yang penuh kontroversi."
 bftb_greece.101.a: "Musuh kita meringkuk seperti tikus!"
 bftb_greece.102.t: "Komunis Mengorganisir Penggerebekan di Pabrik"
 bftb_greece.102.desc: "Penegakan hukum gagal memprediksi dan menghentikan serangan komunis baru-baru ini terhadap salah satu pabrik kami yang kami gunakan untuk memproduksi senapan untuk tentara. Kaum Marxis merampok semua yang mereka bisa dari lantai pabrik dan kemudian berusaha membakar pabrik itu sendiri, namun untungnya mereka hanya berhasil merusak bangunan tersebut.\n\nTidak perlu berspekulasi mengapa para pemberontak ini melakukan serangan kurang ajar terhadap pabrik senjata: mereka pasti berniat menggunakan senapan kita sendiri untuk melawan kita ketika mereka menemukan tulang punggung mereka dan keluar dari bayang-bayang. Ini bisa menjadi salah satu perang saudara terburuk di [ROOT.GetNameDef]..."
 bftb_greece.102.a: "Kita tidak bisa membiarkan kaum anarkis menyerang kita dengan impunitas seperti itu."
 bftb_greece.103.t: "Jenderal Venezelist Diselundupkan Kembali ke Yunani!"
 bftb_greece.103.desc: "Setelah pemimpin mereka yang menyedihkan, kami menerima kabar bahwa banyak mantan jenderal Venezelis telah diselundupkan kembali ke negara tersebut. Penyelundup komunis dan republik bersekongkol untuk membawa para pemimpin militer yang dipermalukan itu kembali ke negara mereka dengan menyamar bersama barang-barang yang dikirim, dan menyembunyikan mereka sebelum kami menyadari apa yang sedang terjadi.\n\nPertempuran sengit melawan pemberontak yang tidak terorganisir adalah satu hal; perang saudara skala penuh yang didukung oleh kepemimpinan militer yang kompeten adalah persoalan yang sama sekali berbeda. Saat ini banyak penasihat yang mempertanyakan apakah keputusan yang bijaksana bagi raja yang tidak populer untuk mengambil tindakan yang tidak populer dan terbuka dengan mendeklarasikan dirinya sebagai raja absolut, namun [ROOT.GetLeader] tetap bersikukuh bahwa para pemberontak tidak akan bisa berbuat apa-apa."
 bftb_greece.103.a: "Apakah mereka benar-benar harus meledakkan pelabuhannya juga?"
 bftb_greece.104.t: "Perlawanan Terorganisir Meningkat di Selatan dan Utara!"
 bftb_greece.104.desc: "Pihak berwenang telah memberi tahu pemerintah bahwa kita hampir kehilangan kendali atas wilayah utara dan selatan negara itu. Para simpatisan Komunis dan Venezelisme merajalela di jalan-jalan menyebarkan fitnah dan propaganda mereka: tidak diganggu oleh otoritas lokal yang sama-sama bersimpati atau sama sekali tidak berdaya untuk menghentikan mereka.\n\nTentara, mengetahui jebakan yang menanti mereka, menolak bergerak untuk mengamankan wilayah tersebut. Namun, mereka tetap waspada penuh dan kabinet Raja telah diyakinkan bahwa setelah kaum Venezel dan komunis berhasil keluar dari persembunyiannya, tentara tidak akan ragu untuk mengambil langkah-langkah yang diperlukan untuk mengambil kembali kendali atas negara tersebut. Tentu saja, banyak tokoh politik yang masih skeptis mengenai ketulusan jaminan ini mengingat banyaknya laporan korupsi dan pengkhianatan di seluruh angkatan bersenjata."
 bftb_greece.104.a: "Situasinya semakin tidak terkendali!"
 bftb_greece.105.t: "Perang Saudara!"
 bftb_greece.105.desc: "Hari yang menentukan akhirnya tiba: pemimpin Venezelist akhirnya keluar dari bayang-bayang untuk mengutuk keputusan Raja sebagai tidak sah dan merupakan ancaman yang belum pernah terjadi sebelumnya terhadap demokrasi [FROM.GetNameDef]. Di mata mereka, mereka tidak punya pilihan selain menggulingkan monarki dengan kekerasan demi memulihkan Republik Hellenic yang sudah dua kali ditaklukkan.\n\n[ROOT.GetLeader] telah mengutuk semua pemberontak sebagai pengkhianat dan berjanji untuk mencabut kaum Marxis dan republik sehingga ketertiban dapat dipulihkan kembali di [ROOT.GetNameDef]. Tampaknya sekali lagi arena politik [ROOT.GetNameDef] telah diubah menjadi colosseum gladiator, di mana hanya yang terkuat yang bisa meninggalkan pemenangnya."
 bftb_greece.105.a: "Berkumpul ke Raja!"
 bftb_greece.166.t: "Politisi Kami Kembali dari Negosiasi Investasi di Athena"
 bftb_greece.166.desc: "Ketika [FROM.GetAdjective] memutuskan untuk mengundang kami berdiskusi lebih lanjut untuk memperdalam hubungan ekonomi, kami tidak dapat menolaknya. Tak perlu dikatakan lagi, mereka memberikan argumen yang kuat tentang mengapa posisi industri [FROM.GetAdjective] sebaiknya diperkuat. Persoalan apakah kita ingin berinvestasi di negara mereka atau menyerahkan potensi industri mereka kepada nasib adalah persoalan yang harus kita putuskan."
 bftb_greece.166.a: "Ya, kami akan berinvestasi!"
 bftb_greece.166.b: "Tidak akan ada investasi kali ini..."
 bftb_greece.166.c: "Nein, kita tidak akan pernah berinvestasi di negara menyedihkan mereka!"
 bftb_greece.167.t: "Pengusaha Kami Kembali dari Pameran Nasional [FROM.GetAdjective]"
 bftb_greece.167.desc: "[FROM.GetAdjective]s memberikan pertunjukan yang cukup menarik bagi kami! Tentu saja upaya mereka untuk menarik investasi kami memang menarik, namun kami tentunya mempunyai prioritas tersendiri yang perlu diperhatikan. Pilihan apakah kita berinvestasi di negara [FROM.GetAdjective] ada di tangan kita."
 bftb_greece.167.a: "Ya, kami akan berinvestasi!"
 bftb_greece.167.b: "Tidak akan ada investasi kali ini..."
 bftb_greece.167.c: "Nein, kita tidak akan pernah berinvestasi di negara menyedihkan mereka!"
 bftb_greece.168.t: "[FROM.GetAdjective] Memeras Kami dengan Menggunakan Schachtplan!"
 bftb_greece.168.desc: "Schädlinge kecil yang pintar di [FROM.GetNameDef] telah menemukan cara untuk menggunakan skema ponzi kita sendiri untuk melawan kita. Sebuah celah kecil yang aman yang dirancang agar kita dapat mengeksploitasi kesalahan Schahtplan demi kepentingan kita malah berbalik melawan kita - yang seharusnya tidak mungkin terjadi. Kita bisa menghadapinya dengan aman dan memberi [FROM.GetAdjective] kemenangan kecil ini, atau mengabaikan kedok bermain sesuai aturan dan melarikan diri dari pembicaraan dengan orang [FROM.GetAdjective]."
 bftb_greece.168.a: "Untuk menghindari konsekuensinya, kali ini kami akan kebobolan..."
 bftb_greece.168.b: "Balikkan keadaan mereka, Schacht!"
 bftb_greece.168.c: "Kami tidak akan pernah tunduk pada pemerasan [FROM.GetAdjective]!"
 bftb_greece.168.d: "Mereka telah memainkan peran mereka secara berlebihan; mereka harus menanggung akibatnya!"
 gott_bless_herr_schacht_tt: "Opsi ini tersedia karena Anda saat ini memiliki §YHjalmar Schacht§! sebagai menteri."
 bftb_greece.169.t: "Investasikan [FROM.GetAdjective]!"
 bftb_greece.169.desc: "Kami baru saja selesai menyambut kembali para investor [FROM.GetAdjective] ke negara kami setelah kunjungan singkat terakhir mereka, dan mereka membawa kabar baik tentang investasi dan peluang! Dengan bantuan mereka, kita akan membangun perekonomian yang benar-benar modern."
 bftb_greece.169.a: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.169.b: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.169.c: "Kerja luar biasa, semuanya!"
 bftb_greece.170.t: "[FROM.GetAdjective] Memutuskan untuk Tidak Berinvestasi"
 bftb_greece.170.desc: "Sayangnya, kami telah menerima kabar bahwa [FROM.GetAdjective] tidak akan berinvestasi pada perekonomian kita kali ini. Ini adalah kejadian yang mengecewakan, meskipun delegasi [FROM.GetAdjective] tidak mengesampingkan investasi masa depan yang merupakan pertanda baik bagi kami."
 bftb_greece.170.a: "Mungkin lain kali."
 bftb_greece.171.t: "[FROM.GetAdjective] Secara Permanen Menghindari Pembicaraan Investasi!"
 bftb_greece.171.desc: "Kita mungkin telah terlalu memaksakan isu investasi: [FROM.GetAdjective] telah memilih untuk memutuskan bahwa mereka tidak tertarik untuk berinvestasi di basis industri yang sedang berkembang di negara kita. Jika mereka tidak ingin membantu kita membentuk masa depan maka kita harus hidup tanpa mereka."
 bftb_greece.171.a: "Mungkin... [ITA.GetAdjective] mungkin lebih ramah terhadap kesepakatan?"
 bftb_greece.172.t: "Hjalmar Schacht Memperdaya Kita!"
 bftb_greece.172.desc: "Kita sungguh bodoh jika mengira kita bisa memeras [FROM.GetAdjective] dengan menggunakan Schachtplan padahal orang yang pertama kali menyusun perjanjian itu masih seorang menteri kabinet! Sekarang kita telah berakhir menjadi bangsa yang harus membayar mereka! Benar-benar sebuah bencana!"
 bftb_greece.172.a: "Penyihir Keuangan menyerang lagi!"
 bftb_greece.173.t: "Pengusaha Kami Kembali Dari Negosiasi di Athena!"
 bftb_greece.173.desc: "Ketika [FROM.GetAdjective] memutuskan untuk mengundang kami berdiskusi lebih lanjut untuk memperdalam hubungan ekonomi, kami tidak dapat menolaknya. Tak perlu dikatakan lagi, mereka memberikan argumen yang kuat tentang mengapa posisi industri [FROM.GetAdjective] sebaiknya diperkuat. Persoalan apakah kita ingin berinvestasi di negara mereka atau menyerahkan potensi industri mereka kepada nasib adalah persoalan yang harus kita putuskan."
 bftb_greece.173.a: "Kami akan memberi mereka piagam sehingga mereka dapat berinvestasi."
 bftb_greece.173.b: "Hal ini bukan merupakan kepentingan Inggris saat ini."
 bftb_greece.173.c: "Maaf kawan-kawan lama, tapi John Bull punya urusan yang lebih penting di tempat lain!"
 bftb_greece.174.t: "Politisi Kita Menghadiri Pameran Nasional [FROM.GetAdjective]"
 bftb_greece.174.desc: "[FROM.GetAdjective]s memberikan pertunjukan yang cukup menarik bagi kami! Tentu saja upaya mereka untuk menarik investasi kami memang menarik, namun kami tentunya mempunyai prioritas tersendiri yang perlu diperhatikan. Pilihan apakah kita berinvestasi di negara [FROM.GetAdjective] ada di tangan kita."
 bftb_greece.174.a: "Mereka dapat mengandalkan dukungan kami!"
 bftb_greece.174.b: "Kali ini hal tersebut bukan untuk kepentingan Inggris."
 bftb_greece.174.c: "Maaf kawan-kawan lama, tapi John Bull punya urusan yang lebih penting di tempat lain!"
 bftb_greece.175.t: "[FROM.GetAdjective] Menawarkan Suku Cadang Kapal sebagai Pertukaran Investasi"
 bftb_greece.175.desc: "Sebuah proposisi menarik dari [FROM.GetAdjective]: mereka ingin menawarkan suku cadang kepada kami untuk memudahkan pembuatan kapal kami dengan imbalan peningkatan investasi di negara mereka. Mungkin agak tidak lazim bagi aktor-aktor negara untuk melakukan barter pada tingkat dasar seperti itu, namun satu-satunya hal yang benar-benar ortodoks mengenai [FROM.GetAdjective] adalah agama mereka."
 bftb_greece.175.a: "Perdagangan yang adil! Hampir."
 bftb_greece.175.b: "Kami tidak membutuhkan suku cadang [FROM.GetAdjective] saat ini."
 bftb_greece.175.c: "Maaf [FROM.GetNameDef], tapi urusan kami dengan Anda sudah selesai. Secara permanen!"
 bftb_greece.176.t: "[FROM.GetAdjective] Memutuskan untuk Berinvestasi!"
 bftb_greece.176.desc: "Kami baru saja selesai menyambut kembali para investor [FROM.GetAdjective] ke negara kami setelah kunjungan singkat terakhir mereka, dan mereka membawa kabar baik tentang investasi dan peluang! Dengan bantuan mereka, kita akan membangun perekonomian yang benar-benar modern."
 bftb_greece.176.a: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.176.b: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.176.c: "Kami selalu dapat mengandalkan [FROM.GetAdjective]!"
 bftb_greece.177.t: "[FROM.GetAdjective] Memutuskan untuk Tidak Berinvestasi Kali Ini"
 bftb_greece.177.desc: "Sayangnya, kami telah menerima kabar bahwa [FROM.GetAdjective] tidak akan berinvestasi dalam perekonomian kita saat ini. Ini adalah kejadian yang mengecewakan, meskipun delegasi [FROM.GetAdjective] tidak mengesampingkan investasi masa depan yang merupakan pertanda baik bagi kami."
 bftb_greece.177.a: "Oh baiklah, mungkin lain kali."
 bftb_greece.178.t: "Undang-undang yang disahkan [FROM.GetAdjective] Mencegah Kita Mencari Investasi Lebih Lanjut!"
 bftb_greece.178.desc: "Kita mungkin telah terlalu memaksakan isu investasi: [FROM.GetAdjective] telah memilih untuk memutuskan bahwa mereka tidak tertarik untuk berinvestasi di basis industri yang sedang berkembang di negara kita. Jika mereka tidak ingin membantu kita membentuk masa depan maka kita harus hidup tanpa mereka."
 bftb_greece.178.a: "Apakah kita berani mencoba mencapai kesepakatan dengan Rusia?"
 bftb_greece.179.t: "[FROM.GetAdjective] Pejabat Mendekati Kami di Ibu Kota dan Memohon Kami Untuk Berinvestasi"
 bftb_greece.179.desc: "Ketika [FROM.GetAdjective] memutuskan untuk mengundang kami berdiskusi lebih lanjut untuk memperdalam hubungan ekonomi, kami tidak dapat menolaknya. Tak perlu dikatakan lagi, mereka memberikan argumen yang kuat tentang mengapa posisi industri [FROM.GetAdjective] sebaiknya diperkuat. Persoalan apakah kita ingin berinvestasi di negara mereka atau menyerahkan potensi industri mereka kepada nasib adalah persoalan yang harus kita putuskan."
 bftb_greece.179.a: "Ya, kita bisa berinvestasi dalam jumlah kecil."
 bftb_greece.179.b: "Tidak kali ini."
 bftb_greece.179.c: "Kami sama sekali tidak tertarik dengan urusan [FROM.GetAdjective]!"
 bftb_greece.180.t: "Pejabat Kami Menghadiri Pameran Nasional yang Diadakan di [FROM.GetNameDef]"
 bftb_greece.180.desc: "[FROM.GetAdjective]s memberikan pertunjukan yang cukup menarik bagi kami! Tentu saja upaya mereka untuk menarik investasi kami memang menarik, namun kami tentunya mempunyai prioritas tersendiri yang perlu diperhatikan. Pilihan apakah kita berinvestasi di negara [FROM.GetAdjective] ada di tangan kita."
 bftb_greece.180.a: "Ya, kami akan berinvestasi ke [FROM.GetNameDef]"
 bftb_greece.180.b: "Tidak kali ini."
 bftb_greece.180.c: "Kami sama sekali tidak tertarik dengan urusan [FROM.GetNameDef]!"
 bftb_greece.181.t: "Pemerintah [FROM.GetAdjective] Menyuap Serikat Buruh kita!"
 bftb_greece.181.desc: "Para bajingan licik di [FROM.GetNameDef] telah merencanakan untuk memutarbalikkan tangan kita untuk berinvestasi di gundukan batu yang mereka sebut rumah! Serikat pekerja kami melakukan tindakan pencegahan terhadap kami; menuduh kami sengaja memperburuk masalah ketenagakerjaan dengan sengaja menghindari tawaran dari orang-orang [FROM.GetAdjective] yang oh begitu murah hati. Itu tidak masuk akal; korupsi mereka sangat jelas terlihat. Namun, mereka memegang semua kartunya. Apakah kita mengambil jalan yang paling sedikit perlawanannya dan memberikan serikat pekerja, dan lebih jauh lagi [FROM.GetNameDef], apa yang mereka inginkan? Atau apakah kita tetap mempertahankan prinsip kita, pada saat prinsip bisa saja menghancurkan kita semua?"
 bftb_greece.181.a: "Kami tidak mampu melakukan pemogokan saat ini..."
 bftb_greece.181.b: "Ancamanmu tidak membuat kami takut, Sans-couilles!"
 bftb_greece.181.c: "Ah, Yunani - le roi des cons! Menjauhlah dari kami!"
 bftb_greece.182.t: "[FROM.GetAdjective] Investasikan!"
 bftb_greece.182.desc: "Kami baru saja selesai menyambut kembali para investor [FROM.GetAdjective] ke negara kami setelah kunjungan singkat terakhir mereka, dan mereka membawa kabar baik tentang investasi dan peluang! Dengan bantuan mereka, kita akan membangun perekonomian yang benar-benar modern."
 bftb_greece.182.a: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.182.b: "Sebuah kesuksesan yang menggembirakan!"
 bftb_greece.182.c: "Sungguh, persahabatan kami adalah persahabatan yang luar biasa!"
 bftb_greece.183.t: "[FROM.GetAdjective] Memutuskan untuk Tidak Berinvestasi Kali Ini"
 bftb_greece.183.desc: "Sayangnya, kami telah menerima kabar bahwa [FROM.GetAdjective] tidak akan berinvestasi dalam perekonomian kita saat ini. Ini adalah kejadian yang mengecewakan, meskipun delegasi [FROM.GetAdjective] tidak mengesampingkan investasi masa depan yang merupakan pertanda baik bagi kami."
 bftb_greece.183.a: "Oh baiklah, mungkin lain kali."
 bftb_greece.184.t: "[FROM.GetAdjective] Keluarkan Delegasi Kami dan Singkirkan Investasi sebagai Suatu Kemungkinan"
 bftb_greece.184.desc: "Kita mungkin telah terlalu memaksakan isu investasi: [FROM.GetAdjective] telah memilih untuk memutuskan bahwa mereka tidak tertarik untuk berinvestasi di basis industri yang sedang berkembang di negara kita. Jika mereka tidak ingin membantu kita membentuk masa depan maka kita harus hidup tanpa mereka."
 bftb_greece.184.a: "Apakah kita berani mencoba mencapai kesepakatan dengan Rusia?"
 bftb_greece.185.t: "[FROM.GetAdjective] Mendekati Kami untuk Membantu Industrialisasi Negara Mereka"
 bftb_greece.185.desc: "Ketika [FROM.GetAdjective] memutuskan untuk mengundang kami berdiskusi untuk memperdalam hubungan ekonomi, kami tidak dapat menolak. Apa yang mungkin menyebabkan [FROM.GetAdjective] menjadi begitu putus asa sehingga mereka datang kepada kami untuk meminta bantuan keuangan? Tak perlu dikatakan lagi, mereka memberikan argumen yang kuat tentang mengapa posisi industri [FROM.GetAdjective] sebaiknya diperkuat... terutama jika hal ini dapat membuktikan kemajuan kita sendiri. Persoalan apakah kita ingin berinvestasi di negara mereka atau menyerahkan potensi industri mereka kepada nasib adalah persoalan yang harus kita putuskan."
 bftb_greece.185.a: "Ada alternatif selain bertarung!"
 bftb_greece.185.b: "Mungkin di kemudian hari."
 bftb_greece.185.c: "Akan ada peluang industrialisasi setelah mereka ditaklukkan!"
 bftb_greece.186.t: "[FROM.GetAdjective] Diplomat Berharap untuk Melunakkan [ROOT.GetAdjective] Ambisi di Mediterania"
 bftb_greece.186.desc: "Kami telah menerima delegasi dari [FROM.GetNameDef] yang menyampaikan keprihatinan pemerintahnya terhadap meningkatnya campur tangan politik [ROOT.GetAdjective] di negara mereka. Mereka telah diberi wewenang untuk melakukan tawar-menawar: mereka akan memberi kita barang-barang material, dan kita akan mengalah dalam merebut kendali atas setiap aparatur negara mereka.\n\nKami, tentu saja, menyangkal adanya campur tangan seperti itu, meskipun kami semua tahu hal itu benar. Tawaran itu sangat murah hati; tidak diragukan lagi keinginan [FROM.GetAdjective] untuk menjaga kedaulatannya adalah hal yang jujur. Kita bisa menggunakan material yang masuk, tapi sekali lagi, kita juga bisa menggunakan [FROM.GetNameDef] yang menempel sepenuhnya di bawah jempol kita..."
 bftb_greece.186.a: "Bantuan ini akan dihargai."
 bftb_greece.186.b: "Mungkin kita bisa sepakat di masa depan, tapi tidak sekarang."
 bftb_greece.186.c: "Ah, pengikut tidak bisa lepas begitu saja!"
 bftb_greece.187.t: "[FROM.GetAdjective] Investasikan!"
 bftb_greece.187.desc: "Kami baru saja selesai menyambut kembali para investor [FROM.GetAdjective] ke negara kami setelah kunjungan singkat terakhir mereka, dan mereka membawa kabar baik tentang investasi dan peluang! Mereka juga membawa serta pengamat tak diundang, yang dengan cepat kami kehilangan jejak saat mereka melakukan apa pun yang harus mereka lakukan saat dikirim ke sini. Bagaimanapun juga, dengan bantuan [FROM.GetAdjective], kita akan membangun perekonomian yang benar-benar modern."
 bftb_greece.187.a: "Kesepakatan dengan Iblis lebih baik daripada kematian."
 bftb_greece.187.b: "Kita harus membayar mahal untuk kelanjutan kemerdekaan kita."
 bftb_greece.188.t: "[FROM.GetAdjective] Jangan Berinvestasi Saat Ini"
 bftb_greece.188.desc: "Sayangnya, kami telah menerima kabar bahwa [FROM.GetAdjective] tidak akan berinvestasi dalam perekonomian kita saat ini. Ini adalah kejadian yang mengecewakan, meskipun delegasi [FROM.GetAdjective] tidak mengesampingkan investasi masa depan yang merupakan pertanda baik bagi kami."
 bftb_greece.188.a: "Mungkin ini adalah berkah tersembunyi..."
 bftb_greece.189.t: "[FROM.GetAdjective] Menghindari Delegasi Kami dan Mengeluarkan Diplomat Kami!"
 bftb_greece.189.desc: "Kita mungkin telah terlalu memaksakan isu investasi: [FROM.GetAdjective] telah memilih untuk memutuskan bahwa mereka tidak tertarik untuk berinvestasi di basis industri yang sedang berkembang di negara kita. Jika mereka tidak ingin membantu kita membentuk masa depan maka kita harus hidup tanpa mereka."
 bftb_greece.189.a: "Ini tentu merupakan pertanda akan terjadinya hal-hal buruk di masa depan."
 bftb_greece.190.t: "[FROM.GetAdjective] Pejabat Selesai Kunjungannya ke Presidium"
 bftb_greece.190.desc: "Kami baru saja dengan senang hati menerima para pejabat dari [FROM.GetNameDef], salah satunya memberikan pidato di hadapan Presidium sebagai tamu yang menekankan kuatnya hubungan antar bangsa kita. Ini adalah momen yang menyenangkan, namun tujuan sebenarnya dari kunjungan [FROM.GetAdjective] adalah untuk membahas investasi di negara mereka yang sedang berjuang. Teorema Marxis menyatakan bahwa revolusi hanya dapat terjadi di masyarakat industri, namun sejarah kita sendiri dan pengalaman [FROM.GetAdjective] mengatakan sebaliknya.\n\nAda perasaan yang kuat di antara para pejabat bahwa kita harus membantu [FROM.GetAdjective], karena kita mempunyai sumber daya untuk melakukannya. Namun, kami juga memerlukan sumber daya kami sendiri - hal ini tidak dibantah oleh pejabat mana pun. Apa yang harus kita lakukan?"
 bftb_greece.190.a: "[ROOT.GetNameDefCap] akan mendelegasikan beberapa sumber daya untuk kemajuan [FROM.GetNameDef]."
 bftb_greece.190.b: "Namun, tidak akan ada investasi saat ini."
 bftb_greece.190.c: "Masyarakat [ROOT.GetAdjective] tidak akan menderita sehingga beberapa petani [FROM.GetAdjective] dapat bekerja di pabrik."
 bftb_greece.191.t: "[ROOT.GetAdjective] Birokrat Kembali Dari Survei [FROM.GetNameDef]"
 bftb_greece.191.desc: "Ketika [FROM.GetAdjective] memutuskan untuk mengundang kami berdiskusi untuk memperdalam hubungan ekonomi, kami tidak dapat menolak. Apa yang mungkin menyebabkan [FROM.GetAdjective] menjadi begitu putus asa sehingga mereka datang kepada kami untuk meminta bantuan keuangan? Tak perlu dikatakan lagi, mereka memberikan argumen yang kuat tentang mengapa posisi industri [FROM.GetAdjective] sebaiknya diperkuat... terutama jika hal ini dapat membuktikan kemajuan kita sendiri. Persoalan apakah kita ingin berinvestasi di negara mereka atau menyerahkan potensi industri mereka kepada nasib adalah persoalan yang harus kita putuskan."
 bftb_greece.191.a: "Perluasan persenjataan mereka atas nama kelompok reaksioner yang berperang dapat diizinkan."
 bftb_greece.191.b: "Namun, tidak akan ada investasi saat ini."
 bftb_greece.191.c: "Masyarakat [ROOT.GetAdjective] tidak akan menderita sehingga beberapa petani [FROM.GetAdjective] dapat bekerja di pabrik."
 bftb_greece.192.t: "[FROM.GetAdjective] Pejabat Mengusulkan Skema Pembelian Kembali Dimana Mereka Berinvestasi di Wilayah Siberia Kami yang Terabaikan"
 bftb_greece.192.desc: "Kami telah menerima delegasi dari [FROM.GetNameDef] yang menyampaikan keprihatinan pemerintahnya terhadap meningkatnya campur tangan politik [ROOT.GetAdjective] di negara mereka. Mereka telah diberi wewenang untuk melakukan tawar-menawar: mereka akan berinvestasi di daerah-daerah kita yang miskin, dan kita akan mengalah dalam merebut kendali setiap aparatur negara mereka.\n\nKami, tentu saja, menyangkal adanya campur tangan seperti itu, meskipun kami semua tahu hal itu benar. Tawaran itu sangat murah hati; tidak diragukan lagi keinginan [FROM.GetAdjective] untuk menjaga kedaulatannya adalah hal yang jujur. Kita bisa menggunakan material yang masuk, tapi sekali lagi, kita juga bisa menggunakan [FROM.GetNameDef] yang menempel sepenuhnya di bawah jempol kita..."
 bftb_greece.192.a: "Skema [FROM.GetAdjective] telah disetujui oleh Politbiro, dan akan dilanjutkan."
 bftb_greece.192.b: "Stavka menyarankan bahwa soft power yang dapat kita tegaskan melalui [FROM.GetNameDef] lebih berguna."
 bftb_greece.192.c: "[ROOT.GetNameDefCap] telah selesai berbisnis dengan [FROM.GetNameDef]."
 bftb_greece.193.t: "Investasi di [FROM.GetNameDef]!"
 bftb_greece.193.desc: "Pikiran terbaik kita telah kembali ke rumah setelah perjalanan terakhir mereka yang menyenangkan ke teman-teman [FROM.GetAdjective] kita, dan mereka membawa kabar baik tentang investasi dan peluang yang saling menguntungkan! Bersama-sama, upaya kita akan mengangkat masyarakat [ROOT.GetAdjective] dan [FROM.GetAdjective], membangun kemitraan yang patut diperhitungkan."
 bftb_greece.193.a: "Satu hal baik mungkin akan mendatangkan hal baik lainnya."
 bftb_greece.194.t: "[FROM.GetAdjective] Jangan Berinvestasi Saat Ini"
 bftb_greece.194.desc: "Sayangnya, kami telah menerima kabar bahwa [FROM.GetAdjective] tidak akan berinvestasi dalam perekonomian kita saat ini. Ini adalah kejadian yang mengecewakan, meskipun delegasi [FROM.GetAdjective] tidak mengesampingkan investasi masa depan yang merupakan pertanda baik bagi kami."
 bftb_greece.194.a: "Mungkin ini adalah berkah tersembunyi..."
 bftb_greece.195.t: "[FROM.GetAdjective] Hindari Delegasi Kami dan Keluarkan Diplomat Kami!"
 bftb_greece.195.desc: "Kita mungkin telah terlalu memaksakan isu investasi: [FROM.GetAdjective] telah memilih untuk memutuskan bahwa mereka tidak tertarik untuk berinvestasi di basis industri yang sedang berkembang di negara kita. Jika mereka tidak ingin membantu kita membentuk masa depan maka kita harus hidup tanpa mereka."
 bftb_greece.195.a: "Sekarang kita benar-benar sendirian yang memperbaiki kesengsaraan ekonomi kita."
 bftb_greece.200.t: "Konvensi Heraklion Diselenggarakan - Sukses Besar!"
 bftb_greece.200.desc: "Konvensi Heraklion secara resmi telah berakhir dan sukses mutlak! Semua peserta telah pulang dengan jaminan perolehan wilayah, dan tampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, kita akan membalas Perjanjian Sèvres kepada [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.200.a: "Kita bisa mendukung diri kita sendiri untuk ini."
 bftb_greece.201.t: "Konvensi Heraklion Bersidang"
 bftb_greece.201.desc: "Konvensi Heraklion secara resmi telah berakhir dan sukses besar! Semua peserta, kecuali [ENG.GetNameDef], telah pergi dengan jaminan perolehan wilayah, dan tampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, para penandatangan akan membalas Perjanjian Sèvres atas [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.201.a: "Huzzah!"
 bftb_greece.201.b: "Sungguh bodoh!"
 bftb_greece.202.t: "Konvensi Heraklion Bersidang"
 bftb_greece.202.desc: "Konvensi Heraklion secara resmi telah berakhir dan sukses besar! Semua peserta, kecuali [FRA.GetNameDef], telah pergi dengan jaminan perolehan wilayah, dan tampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, para penandatangan akan membalas Perjanjian Sèvres atas [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.202.a: "Inisiatif yang bagus!"
 bftb_greece.202.b: "Orang bodoh itu..."
 bftb_greece.203.t: "Konvensi Heraklion Bersidang"
 bftb_greece.203.desc: "Konvensi Heraklion secara resmi telah berakhir dan sukses luar biasa! Semua peserta, kecuali [ITA.GetNameDef], telah pergi dengan jaminan perolehan wilayah, dan tampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, para penandatangan akan membalas Perjanjian Sèvres atas [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.203.a: "Hasil yang luar biasa!"
 bftb_greece.203.b: "Ricordiamo la Vittoria Mutilata..."
 bftb_greece.204.t: "Konvensi Heraklion Bersidang"
 bftb_greece.204.desc: "Konvensi Heraklion secara resmi telah berakhir, dan ini merupakan... keberhasilan yang dapat diterima. Baik [ENG.GetNameDef] maupun [FRA.GetNameDef] tidak akan berpartisipasi dalam perang yang akan datang, karena tidak satu pun dari mereka dijanjikan wilayah mana pun dari [TUR.GetNameDef] yang rusak. Tampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh, asalkan mereka mempunyai kekuatan untuk menjatuhkan [TUR.GetNameDef] sendirian..."
 bftb_greece.204.a: "Namun, sebuah kemenangan."
 bftb_greece.204.b: "Buang-buang waktu saja..."
 bftb_greece.205.t: "Konvensi Heraklion Bersidang"
 bftb_greece.205.desc: "Konvensi Heraklion secara resmi telah berakhir, dan ini merupakan kesuksesan yang luar biasa! Semua peserta, kecuali [ENG.GetNameDef] dan [ITA.GetNameDef], telah pulang dengan jaminan perolehan wilayah, dan nampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, para penandatangan akan membalas Perjanjian Sèvres atas [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.205.a: "Anda memenangkan beberapa, Anda kehilangan beberapa!"
 bftb_greece.205.b: "Buang-buang waktu saja..."
 bftb_greece.205.c: "Kami tidak akan mentolerir pengkhianatan kedua ini!"
 bftb_greece.206.t: "Konvensi Heraklion Bersidang"
 bftb_greece.206.desc: "Konvensi Heraklion secara resmi telah berakhir, dan ini merupakan kesuksesan yang luar biasa! Semua peserta, kecuali [FRA.GetNameDef] dan [ITA.GetNameDef], telah pulang dengan jaminan perolehan wilayah, dan nampaknya [GRE.GetNameDef] akan melakukan perluasan perbatasan secara menyeluruh. Bersama-sama, para penandatangan akan membalas Perjanjian Sèvres atas [TUR.GetName] yang jauh lebih pantas."
 bftb_greece.206.a: "Namun, sebuah kemenangan."
 bftb_greece.206.b: "Buang-buang waktu saja..."
 bftb_greece.206.c: "Kami tidak akan mentolerir pengkhianatan kedua ini!"
 bftb_greece.207.t: "EEE Meluncurkan Kudeta!"
 bftb_greece.207.desc: "Kita seharusnya tahu bahwa ini akan berakhir seperti ini: kepemimpinan EEE telah mengutuk kita sebagai orang yang lemah dan tidak efektif, dan menyatakan kita sebagai penghalang paling langsung menuju kehebatan [ROOT.GetAdjective]. Para bajingan ini menjadi tontonan besar-besaran di Parlemen Hellenic di mana mereka mengecam kami semua sebagai pengkhianat dan menyatakan bahwa mereka akan melakukan segala daya mereka untuk menggulingkan kami. Benar saja, setelah meninggalkan ruangan secara tiba-tiba, mereka kembali beberapa jam kemudian dengan massa membuntuti mereka dan menyerukan agar kami segera mengundurkan diri secara kolektif.\n\nOpini publik tidak lagi bersama kita, dan sejujurnya, banyak menteri telah kehilangan kepercayaan bahwa pemerintahan ini memiliki apa yang diperlukan untuk menyelesaikan masalah seperti yang kita janjikan kepada bangsa. Ada perasaan umum bahwa dengan bergerak menuju Konstantinopel tanpa dukungan asing atau rakyat, kita mengirim seluruh negeri ke dalam perjalanan kematian yang tidak akan pernah bisa kita pulihkan."
 bftb_greece.207.a: "Kita harus mempertanggungjawabkan kegagalan kita."
 bftb_greece.207.b: "Athena tidak akan pernah diperintah oleh anjing fasis!"
 byzantinist_coup_tt: "§Yfasis Bizantium§! akan membentuk pemerintahan!"
 byzantinist_civil_war_inevitable_tt: "§YBizantini§! akan segera mencoba mengeluarkan kami secara paksa dari pemerintahan lagi..."
 bftb_greece.209.t: "Kami Telah Menghormati Janji Kami Seperti yang Ditetapkan Selama Konvensi Heraklion!"
 bftb_greece.209.desc: "Kami telah memecah belah bekas negara Turki dan membagi hasil rampasan di antara para pemenang. Kewajiban kita terhadap sekutu dan rakyat kita telah terpenuhi, dan [ROOT.GetNameDef] semakin dekat selama berabad-abad untuk mencapai kehebatan sejati."
 bftb_greece.209.a: "Ini benar-benar momen paling mulia bagi kami."
 megali_idea_honoured_greece_tt: "Wilayah yang dijanjikan kepada sekutu kita selama §YKonvensi Heraklion§! telah dialihkan."
 bftb_greece.210.t: "Orang Yunani Menghormati Jaminan Konvensi Heraklion!"
 bftb_greece.210.desc: "Seperti yang dijanjikan, provinsi-provinsi yang kami jamin telah diambil alih dari negara Turki yang kalah dan diserahkan ke dalam kendali kami. Imperialisme adalah bisnis yang buruk, namun tidak ada yang melakukannya dengan lebih baik daripada kita."
 bftb_greece.210.a: "Dieksekusi seperti jarum jam."
 megali_idea_honoured_tt: "Wilayah yang dijanjikan kepada kami oleh §Y[GRE.GetNameDef]§! selama §YKonvensi Heraklion§! telah dialihkan."
 bftb_greece.213.t: "[FROM.GetAdjective] Menolak Membayar Hutangnya Kepada Kami!"
 bftb_greece.213.desc: "Pencuri [FROM.GetAdjective] bejat itu telah memutuskan untuk kabur membawa uang utangnya kepada kita! Kita telah dengan hati-hati memupuk dan menumbuhkan utang tersebut selama beberapa dekade, dan mereka berani menyebutnya tidak sah? Jika mereka percaya bahwa mereka dapat menipu kita tanpa mendapat hukuman maka mereka salah besar – pasti ada konsekuensinya! Meskipun demikian, tidak dapat dipungkiri bahwa kami terlalu bersemangat dalam mengaktifkan dan kemudian memberikan sanksi kepada [FROM.GetNameDef] karena utangnya yang menumpuk."
 bftb_greece.213.a: "Menggelapkan parasit!"
 bftb_greece.213.b: "Mereka didorong terlalu keras dan inilah konsekuensinya."
 bftb_greece.217.t: "Boulē Fasis Agung dari Halicarnassus"
 bftb_greece.217.desc: "Fasisme selalu menjadi fenomena yang mudah marah di [ROOT.GetNameDef], namun di bawah kepemimpinan [ROOT.GetLeader], fasisme telah berkembang hingga pada titik di mana semua pemikir besar fasis di negara ini dapat bertemu bersama untuk membahas masa depan negara. [ROOT.GetLeader] mengusulkan untuk mengambil gaya pemerintahannya yang jelas-jelas otoriter dan menyaringnya langsung ke dalam bentuk fasis untuk meminimalkan ketidakstabilan. George Mercouris, seorang sosialis nasional yang sempurna di negara ini, percaya bahwa cara terbaik untuk [ROOT.GetNameDef] adalah menyingkirkan raja yang tidak populer untuk membawa negara ini ke dalam ranah politik yang benar-benar radikal.\n\n[ROOT.GetLeader] berbicara panjang lebar tentang visi Yunani Raya yang membentang dari Albania hingga Siprus, namun tidak mau kalah, Mercouris percaya bahwa orang [ROOT.GetAdjective] perlu melihat ke belakang lebih jauh untuk mengetahui kunci kehebatan mereka. Metaxas percaya bahwa Peradaban Hellenic Ketiga akan segera menjadi negara Hellenic baru yang lebih besar, namun Mercouris percaya bahwa inspirasi untuk Peradaban Hellenic Ketiga akan datang dari Peradaban Hellenic Pertama. Dua tokoh berpengaruh mengungkapkan dua pendapat yang sangat berbeda: masa depan [ROOT.GetNameDef] yang difasis di Samos."
 bftb_greece.217.a: "Metaxas harus memimpin kerajaan fasis kita!"
 GRE_metaxist_monarchist_fascism_tt: "§YGeorge II§! akan tetap menjadi raja, dan §YYunani Raya§! akan tersedia sebagai negara yang dapat dibentuk.\nPara £faction_gre_monarchist §YMonarkis§! akan setia."
 bftb_greece.217.b: "Mercouris akan memberi kita sebuah kerajaan!"
 GRE_republican_national_socialism_tt: "§YGeorge II§! akan digulingkan dari tahtanya, dan kita akan mampu memenuhi §YWarisan Argeads§!.\nPara £faction_gre_monarchist §YMonarkis§! akan menjadi Tidak Penting."
 bftb_greece.218.t: "Pemberontakan Fasis Anatolia!"
 bftb_greece.218.desc: "Waktunya telah tiba; di saat-saat tergelap kita, Georgios Kosmidis yang menghina telah menyatakan seruan untuk mengangkat senjata dan menuntut mereka yang setia kepada EEE dan [ROOT.GetNameDef] menghancurkan kita dan para penjajah di seluruh Laut Aegea. Satu-satunya hal yang pasti adalah masa depan [ROOT.GetNameDef] sangat tidak pasti."
 bftb_greece.218.a: "Kaum fasis tidak boleh menentukan nasib [ROOT.GetNameDef]!"
 bftb_greece.218.b: "Mungkin kami salah; mungkin EEE bisa menyimpan [ROOT.GetNameDef]."
 bftb_greece.220.t: "[FROM.GetNameDefCap] Setuju Fasilitasi Enosis!"
 bftb_greece.220.desc: "Suasana di ibu kota bisa digambarkan sebagai 'kegembiraan' setelah [ROOT.GetLeader] mengumumkan kepada negara bahwa setelah bertahun-tahun, impian [ROOT.GetAdjective] Enosis dengan Siprus akhirnya akan menjadi kenyataan, dan semuanya berkat teman-teman [FROM.GetAdjective] kita. Para administrator kami tidak membuang waktu untuk melakukan perjalanan ke Siprus untuk memastikan peralihan kekuasaan berjalan selancar mungkin.\n\nIni adalah hari yang sungguh luar biasa dan bersejarah bagi [ROOT.GetNameDef]. Siprus telah lama menjadi bagian dari kesadaran kolektif [ROOT.GetAdjective], dan kini mereka akhirnya berada di pangkuan peradaban tempat mereka berasal."
 bftb_greece.220.a: "Akhirnya bersama!"
 bftb_greece.221.t: "Konvensi Heraklion - [FRA.GetAdjective] mendapatkan Mandatnya!"
 bftb_greece.221.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [FRA.GetNameDef] harus diberikan mandat di Kurdistan setelah berhasil menggulingkan negara [TUR.GetAdjective]. Para pejabat [FRA.GetAdjective] telah memuji para delegasi yang hadir karena sikap kenegarawanan mereka yang bijaksana, dan telah menyampaikan instruksi kepada pemerintah pusat [FRA.GetAdjective] untuk mulai merencanakan pembentukan pemerintahan di wilayah tersebut."
 bftb_greece.221.a: "Ya, sudahlah!"
 bftb_greece.222.t: "Konvensi Heraklion - [FRA.GetAdjective] ditolak Mandatnya!"
 bftb_greece.222.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [FRA.GetNameDef] harus ditolak wilayah mana pun di Kurdistan setelah negara bagian [TUR.GetAdjective] berhasil ditaklukkan. Para pejabat [FRA.GetAdjective] hampir memutuskan untuk meninggalkan konvensi sepenuhnya, dan menggambarkan peristiwa tersebut sebagai hal yang menggelikan, sebelum mencapai konsensus bahwa mereka lebih memilih untuk tetap dapat mempengaruhi proses selanjutnya meskipun mereka tidak dijanjikan apa pun."
 bftb_greece.222.a: "Tidak, tidak!"
 bftb_greece.223.t: "Konvensi Heraklion - [ENG.GetAdjective] mendapatkan Protektoratnya!"
 bftb_greece.223.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ENG.GetNameDef] harus diberikan protektorat Armenia yang dibentuk dari kekalahan [TUR.GetName]. Para pejabat [ENG.GetAdjective] telah memuji para delegasi yang hadir karena sikap kenegarawanan mereka yang bijaksana, dan telah menyampaikan instruksi kepada pemerintah pusat [ENG.GetAdjective] untuk mulai merencanakan pembentukan pemerintahan di wilayah tersebut."
 bftb_greece.223.a: "Ya, sudahlah!"
 bftb_greece.224.t: "Konvensi Heraklion - [ENG.GetAdjective] ditolak Bonekanya!"
 bftb_greece.224.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ENG.GetNameDef] harus ditolak haknya untuk mendirikan negara boneka Armenia di [TUR.GetNameDef] utara. Para pejabat [ENG.GetAdjective] mengecam keputusan tersebut dan menggambarkan keseluruhan konvensi sebagai sesuatu yang tidak jelas, namun memutuskan bahwa mereka lebih memilih untuk tetap dapat mempengaruhi proses selanjutnya meskipun mereka tidak mendapatkan jaminan apa pun."
 bftb_greece.224.a: "Tidak, tidak!"
 bftb_greece.225.t: "Konvensi Heraklion - [ITA.GetAdjective] mendapatkan Wilayahnya!"
 bftb_greece.225.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ITA.GetNameDef] harus diberikan koloni yang membagi bangkai [TUR.GetName] yang kalah. Para pejabat [ITA.GetAdjective] memuji para delegasi yang hadir atas keputusan mereka yang bijaksana mengenai masalah ini, dan banyak anggota delegasi [ITA.GetAdjective] telah berbondong-bondong pulang untuk menyampaikan berita tersebut kepada [ITA.GetLeader]."
 bftb_greece.225.a: "Ya, sudahlah!"
 bftb_greece.226.t: "Konvensi Heraklion - [ITA.GetAdjective] ditolak Wilayahnya!"
 bftb_greece.226.desc: "Mayoritas delegasi yang hadir telah memilih bahwa [ITA.GetNameDef] harus ditolak haknya untuk mendirikan koloni di [TUR.GetNameDef] selatan, dan mengecam mosi itu sendiri sebagai [ITA.GetAdjective] penghasutan perang yang lebih bodoh. Para pejabat [ITA.GetAdjective] menyerang keputusan tersebut dan menggunakan seluruh situasi untuk menggambarkan bagaimana hal ini menjadi bukti lebih lanjut bahwa masyarakat [ITA.GetAdjective] benar dalam mempercayai 'vittoria mutilata'. Terlepas dari pandangan pribadi mereka mengenai masalah ini, delegasi [ITA.GetAdjective] telah diperintahkan untuk tetap menjadi bagian dari proses konvensi – tentunya dengan harapan bahwa mereka masih dapat mempengaruhi keputusan mengenai agenda terakhir dan terpenting."
 bftb_greece.226.a: "Tidak, tidak!"
 bftb_greece.227.t: "[GRE.GetAdjective] Pertempuran Perbatasan dengan [TUR.GetNameDef] Meningkat"
 bftb_greece.227.desc: "Serangan [GRE.GetAdjective] terhadap [341.GetName] gagal seperti yang diharapkan, dan ketika konflik di Laut Aegea meningkat, kami diberi kesempatan sempurna untuk melakukan intervensi atas nama [GRE.GetNameDef]. Kita harus mengarahkan pasukan kita ke Kaukasus untuk duduk di perbatasan [TUR.GetAdjective]. Ketika [GRE.GetAdjective] mengirimkan sinyal, kami akan menjepit pasukan [TUR.GetAdjective] dan memaksakan perang yang sah."
 bftb_greece.227.a: "Kami akan siap."
 bftb_greece.228.t: "[SOV.GetAdjective] Dikalahkan"
 bftb_greece.228.desc: "Berita mengejutkan telah sampai ke ibu kota kita: pasukan [SOV.GetNameDef] yang tak terkalahkan telah gagal menembus garis [TUR.GetAdjective]. Mereka tidak akan membantu kami dalam invasi, dan mereka telah membatalkan semua rencana dan serangan mereka serta memberikan [TUR.GetAdjective] impunitas untuk menghakimi kami sesuai keinginan mereka."
 bftb_greece.228.a: "Ini bukan pertanda baik..."
 bftb_greece.229.t: "[GRE.GetNameDefCap] Memanggil Kami untuk Memenuhi Janji Kami"
 bftb_greece.229.desc: "[GRE.GetNameDefCap] telah memulai perangnya dengan [TUR.GetNameDef] dan telah meminta kami untuk membantu perang seperti yang kami janjikan. Keuntungan yang dijanjikan sangatlah besar, dan selalu ada peluang untuk meminta lebih banyak, namun mungkin kita tidak lagi mampu memenuhi kewajiban kita – bahkan jika itu berarti mengabaikan klaim kita."
 bftb_greece.229.a: "Untuk berperang!"
 bftb_greece.229.b: "Situasinya telah berubah."
 bftb_greece.230.t: "[FROM.GetNameDefCap] Menghormati Komitmen Mereka"
 bftb_greece.230.desc: "[FROM.GetNameDefCap] telah bergabung dengan kami dalam perang melawan [TUR.GetNameDef], seperti yang mereka janjikan. Bersama-sama, kita akan menurunkan status [TUR.GetAdjective]."
 bftb_greece.230.a: "Kita tidak bisa kalah!"
 bftb_greece.231.t: "[FROM.GetNameDefCap] Abaikan Komitmen Mereka!"
 bftb_greece.231.desc: "[FROM.GetNameDefCap] telah mengabaikan janjinya untuk membantu kami, dan membatalkan klaim mereka di [TUR.GetNameDef]! Mereka telah mengkhianati kami, dan meremehkan seluruh perjuangan kami dalam melakukan hal tersebut. Kita harus berharap kita mempunyai kekuatan untuk menang tanpa bantuan [FROM.GetAdjective]."
 bftb_greece.231.a: "Pengecut!"
 bftb_greece.232.t: "Basileus Muncul..."
 bftb_greece.232.desc: "Sebuah mukjizat telah diberikan kepada bangsa kita yang sedang kecewa: campur tangan ilahi yang diberikan kepada kita dari Surga sendiri oleh Santo Yustinianus. Seorang pria dengan pakaian compang-camping ditemukan tergeletak tak sadarkan diri di sepanjang pantai Gunung Athos di mana dia diselamatkan dari kematian oleh penjaga setia situs suci tersebut. Orang tersebut, yang awalnya ditolak oleh pihak berwenang yang menangkapnya sebagai orang gila yang berjalan kaki ke [ROOT.GetNameDef] dari Jerman dengan berjalan kaki, sebenarnya telah diidentifikasi oleh salah satu akademisi EEE kami sebagai keturunan Dinasti Komnenoi yang telah lama hilang.\n\nSudah lama kita merasa jengkel dengan pertanyaan tentang siapa yang harus memimpin negara Bizantium kita, dan tampaknya Tuhan sendiri yang telah memberikan solusi-Nya kepada kita. Pewaris Bizantium tidak berbicara sepatah kata pun dalam bahasa Yunani, tapi dia pasti bisa diajar! Sesungguhnya [ROOT.GetNameDef] dikaruniai pemeliharaan Tuhan."
 bftb_greece.232.a: "Hidup Basileus Adolfos I!"
 bftb_greece.232.b: "Eh, tunggu, bagaimana kalau dia hanya orang gila?"
 bftb_greece.233.t: "Ioannis Metaxas Meninggal Dunia"
 bftb_greece.233.desc: "Perdana Menteri dan diktator [ROOT.GetNameDef] telah meninggal dunia setelah beberapa waktu sakit. Dia meninggal di luar negeri, sebagai orang buangan dari negara yang ditaklukkannya. Meskipun ia tidak terlalu dicintai oleh masyarakat [ROOT.GetAdjective], ia menjadi simbol persatuan dan perlawanan nasional di saat krisis. Emmanouil Tsouderos, seorang tokoh pemersatu dan seorang Venizelist, telah menggantikan Metaxas sebagai Perdana Menteri [ROOT.GetNameDef]."
 bftb_greece.233.a: "Perang terus berlanjut."
 bftb_greece.234.t: "Ide Megali Disetujui"
 bftb_greece.234.desc: "Kabar telah sampai kepada kita dari Konvensi Heraklion bahwa negara-negara besar yang hadir telah menyetujui proposal [GRE.GetAdjective] dari \"Ide Megali\". Hal ini tidak hanya mengancam stabilitas kawasan, tetapi juga merupakan risiko besar terjadinya perang langsung antara [GRE.GetNameDef] dan [TUR.GetNameDef] dalam waktu dekat.\n\nKemungkinan ini tidak dapat diabaikan bahwa [GRE.GetNameDef] dapat memperoleh dukungan militer dari [FRA.GetNameDef] atau [ENG.GetNameDef], dan mengingat kewajiban militer kita saat ini untuk [TUR.GetNameDef] kita mungkin berada di pihak yang salah dalam perang dengan salah satu, atau mungkin keduanya, negara-negara besar ini. Para pemimpin militer kami mendesak kami untuk mengingat hal ini dan mengevaluasi kembali komitmen kami terhadap pertahanan [TUR.GetNameDef]."
 bftb_greece.234.a: "Turki harus bertahan hidup sendiri."
 bftb_greece.234.b: "Kami mempertahankan jaminan kami, apa pun biayanya!"
 bftb_greece.235.t: "[ROM.GetName] Mencabut Jaminan"
 bftb_greece.235.desc: "Konvensi Heraklion telah sangat mengguncang para penjamin [ROM.GetAdjective] kami. Daripada mengambil risiko perang dengan negara-negara besar Eropa, mereka memilih untuk membatalkan janji mereka untuk memberikan bantuan militer untuk pertahanan kita."
 bftb_greece.235.a: "Pengecut!"
 bftb_greece.236.t: "[SOV.GetNameDefCap] Menolak Membantu Melawan [TUR.GetNameDef]"
 bftb_greece.236.desc: "Meskipun tidak diragukan lagi tertarik untuk memperluas pengaruhnya, [SOV.GetNameDef] telah memutuskan untuk tidak membantu rencana kami untuk mempengaruhi [TUR.GetNonIdeologyName]. Sebaliknya ingin fokus pada urusan lain."
 bftb_greece.236.a: "Kami akan tetap melanjutkan"
 bftb_greece.236.b: "Mungkin kami terlalu bersemangat"
 bftb_greece.237.t: "[FROM.GetName] Mendukung Ambisi Melawan [TUR.GetNonIdeologyName]"
 bftb_greece.237.desc: "Para diplomat dari [FROM.GetNameDef] telah memberi tahu kami bahwa kami mendapat dukungan [FROM.GetLeader] dalam rencana kami melawan [TUR.GetNameDef]. Laporan dari intelijen militer kami juga menunjukkan bahwa mereka sudah mulai memindahkan pasukan menuju perbatasan [TUR.GetAdjective]."
 bftb_greece.237.a: "Berita bagus!"
 bftb_turkey.1.t: "Konvensi Montreux"
 bftb_turkey.1.desc: "Presiden [TUR.GetLeader] telah memberi tahu kami bahwa [TUR.GetNameDef] sedang bersiap untuk melakukan militerisasi kembali Selat Turki. Pemerintah [TUR.GetAdjective] ingin agar kami mendukung klaim mereka atas wilayah perairan mereka, dan mengubah Perjanjian Lausanne agar memberi mereka legitimasi untuk mempertahankan klaim tersebut.\n\nMendukung klaim [TUR.GetAdjective] atas Selat Turki pasti akan membuat kita tertarik, dan hal ini dapat membuka kemungkinan [TUR.GetNameDef] mampu bersaing dengan [ITA.GetNameDef] di Mediterania. Namun, terperosok dalam krisis ini mungkin juga menempatkan kita pada sisi yang berlawanan dari [SOV.GetNameDef], yang dalam skenario terburuk bisa berarti perang."
 bftb_turkey.1.a: "Kami akan mendukung Turki dalam hal ini."
 bftb_turkey.1.b: "Kerajaan Inggris tidak peduli dengan Turki."
 TUR_britain_backs_turkey_tt: "Kami akan mendukung §Y[TUR.GetNameDef]§! atas dasar bahwa mereka harus memiliki wewenang untuk mengatur lalu lintas melalui §YSelat Turki§!.\n\n§RKami akan memiliki kesempatan untuk membatalkan dukungan kami jika perang antara §Y[TUR.GetNameDef]§! dan §Y[SOV.GetNameDef]§! tiba-tiba tampak mungkin terjadi.§!"
 TUR_britain_unentangles_itself_tt: "Kami akan menyerahkan §Y[TUR.GetNameDef]§! di bawah kekuasaan §Y[SOV.GetNameDef]§!. Kemungkinan besar §YSelat Turki§! akan tetap terbuka untuk lalu lintas angkatan laut tanpa batas dari mana pun di dunia."
 bftb_turkey.2.t: "[ENG.GetName] Meminjamkan Dukungannya"
 bftb_turkey.2.desc: "[ENG.GetLeader] telah mengeluarkan pernyataan yang menjelaskan bahwa [ENG.GetNameDef] bermaksud mendukung kami dalam mencapai tujuan kami untuk merebut kembali kendali atas selat kami sendiri. Mendapatkan dukungan dari [ENG.GetNameDef] merupakan kemenangan besar bagi kami, dan sangat membantu memperkuat legitimasi kami di seluruh dunia."
 bftb_turkey.2.a: "Sekarang kita tunggu respon dari [SOV.GetNameDef]."
 bftb_turkey.3.t: "[ENG.GetName] Menolak Bantuan Kami!"
 bftb_turkey.3.desc: "[ENG.GetLeader] menulis surat panjang lebar kepada [TUR.GetLeader], menjelaskan secara panjang lebar bahwa [ENG.GetNameDef] tidak mampu untuk terlibat dalam krisis luar negeri pada saat ini. [ENG.GetLeader] menyebutkan kurangnya dukungan masyarakat terhadap perang di [ENG.GetNameDef] dan skeptisismenya sendiri terhadap kesiapan [TUR.GetAdjective] untuk berperang dengan [SOV.GetNameDef] sebagai alasan mengapa [ENG.GetNameDef] tidak mau terlibat.\n\n[ENG.GetName] telah mengakui kendali kami atas Selat Turki, namun mereka tidak akan berbuat lebih dari itu."
 bftb_turkey.3.a: "Sekarang kita tunggu respon dari [SOV.GetNameDef]."
 bftb_turkey.4.t: "[TUR.GetNameDef] Merebut Kendali Bosporus!"
 bftb_turkey.4.desc: "[TUR.GetLeader] telah menyatakan bahwa Selat Turki sekarang akan berada di bawah kendali penuh [TUR.GetNameDef], sehingga memberikan pemerintah [TUR.GetAdjective] kemampuan untuk menutup Selat tersebut bagi kami atas kebijakan mereka sendiri! Hal ini benar-benar tidak dapat diterima: ini berarti bahwa pemerintah [TUR.GetAdjective] telah memutuskan bahwa mereka mempunyai hak untuk menjebak armada kita sendiri di Laut Hitam kapanpun mereka merasa hal tersebut layak secara politik."
 bftb_turkey.4.a: "Segera mobilisasi TNI!"
 bftb_turkey.4.b: "Sirkus lucu ini tidak berarti apa-apa bagi kami."
 TUR_soviets_oppose_turkey_tt: "Pemerintah §Y[TUR.GetAdjective]§! akan menawarkan solusi kompromi kepada kita, atau mereka akan memperburuk situasi.\n\n§RKami akan memiliki kesempatan untuk meredakan situasi jika konflik bersenjata mulai terlihat.§!"
 TUR_soviets_allow_militarisation_tt: "§YSelat Turki§! akan diremiliterisasi dan §Y[TUR.GetNameDef]§! akan memperoleh kekuasaan untuk mengatur semua lalu lintas angkatan laut yang melewatinya."
 bftb_turkey.5.t: "[SOV.GetName] Menentang Remiliterisasi Kami di Selat Malaka!"
 bftb_turkey.5.desc: "Pejabat yang mewakili [SOV.GetNameDef] telah menyatakan dengan sangat jelas bahwa mereka menganggap perebutan Selat Turki secara sepihak oleh kami adalah tindakan yang melanggar hukum, dan bahwa mereka bermaksud mengambil tindakan ekstrem untuk membatalkan keputusan kami. Meskipun ditekan oleh diplomat kami, para pejabat [SOV.GetAdjective] menolak mengesampingkan intervensi militer di [TUR.GetNameDef] untuk memaksakan kehendak mereka.\n\nMempertahankan status quo saat ini adalah hal yang tidak terpikirkan, dan bahkan [SOV.GetNameDef] pasti memahami hal ini. Jika kami menawarkan solusi kompromi yang menawarkan akses gratis ke semua negara di Laut Hitam, maka [SOV.GetNameDef] tidak punya pilihan selain menerima tawaran kami, kecuali mereka ingin menjadi paria dunia."
 bftb_turkey.5.a: "Kami akan menawarkan kompromi."
 bftb_turkey.5.b: "Tidak ada penyelesaian, tidak ada kompromi – kami akan melakukan ini dengan benar!"
 TUR_strait_compromise_tt: "§Y[SOV.GetNameDefCap]§! dan semua negara lain yang berbagi pantai di §YLaut Hitam§! akan mempertahankan hak akses bebas mereka melalui §YSelat Turki§!."
 TUR_remaining_defiant_tt: "Kami akan terus menuntut hak untuk mengatur semua lalu lintas angkatan laut yang melewati §YSelat Turki§!.\n\n§RIni mungkin kesempatan terakhir kita untuk meredakan ketegangan: jika [SOV.GetNameDef] memaksakan masalah maka akan mengarah pada perang!§!"
 bftb_turkey.6.t: "[SOV.GetName] Menyetujui Remiliterisasi Selat!"
 bftb_turkey.6.desc: "Pemerintah [SOV.GetAdjective] mengeluarkan pernyataan singkat dengan petunjuk samar mengenai dampak dan hukuman jika mengganggu perdamaian, namun secara pribadi para pejabat kami telah diyakinkan bahwa tidak akan ada tanggapan balasan dari [SOV.GetNameDef].\n\n[TUR.GetLeader] memberikan pidato yang penuh semangat di Istanbul yang disiarkan ke seluruh bangsa melalui radio yang menyatakan kemenangan besar untuk [TUR.GetNameDef]. Ada banyak sekali dukungan terhadap pemerintah, dan kita bisa mengharapkan perayaan di seluruh negeri atas kemenangan menentukan kita dalam masalah ini."
 bftb_turkey.6.a: "Inilah perdamaian di rumah, dan perdamaian di dunia!"
 bftb_turkey.7.t: "[TUR.GetNameDefCap] Kompromi pada Remiliterisasi Selat Malaka"
 bftb_turkey.7.desc: "Setelah banyak negosiasi, pemerintah [TUR.GetAdjective] memutuskan untuk mengambil kendali atas Selat tersebut sambil tetap mengizinkan akses bebas ke semua negara yang berbatasan dengan Laut Hitam. Proposal ketat yang diberikan oleh [TUR.GetNameDef] menyisakan sedikit ruang untuk protes, dan telah disetujui dengan tergesa-gesa oleh [BUL.GetNameDef] dan [ROM.GetNameDef] yang pada akhirnya mengikat tangan kita dalam masalah ini."
 bftb_turkey.7.a: "Nah, krisis itu bisa dianggap selesai."
 bftb_turkey.8.t: "Konflik Bergejolak di Laut Hitam"
 bftb_turkey.8.desc: "[SOV.GetName] telah menentang rencana [TUR.GetNameDef] untuk mengambil kembali kendali atas selat mereka, namun [TUR.GetNameDef] tetap menentang dalam menghadapi ancaman [SOV.GetAdjective]. Situasi ini terancam menjadi konflik bersenjata ketika [TUR.GetNameDef] berjuang untuk menegaskan kedaulatannya dan [SOV.GetNameDef] berusaha membangun dominasinya atas wilayah tersebut.\n\nKeseimbangan kekuatan ada di tangan kita: kita harus memilih apakah kita ingin melegitimasi dukungan kita terhadap [TUR.GetNameDef] dengan jaminan kemerdekaan untuk menghalangi Uni Soviet, atau mencuci tangan dari situasi ini dan berharap kedua negara keluar dari jalur konflik sempit yang telah mereka berdua tentukan sendiri."
 bftb_turkey.8.a: "Kita harus mendukung [TUR.GetNameDef] melawan tirani Bolshevik."
 bftb_turkey.8.b: "Menenangkan [SOV.GetAdjective] irredentisme adalah harga kecil yang harus dibayar untuk perdamaian!"
 TUR_britain_stands_up_for_turkey_tt: "Kami akan mendukung §Y[TUR.GetNameDef]§! meskipun hal itu mengarah pada perang. §R[SOV.GetNameDefCap] akan mendapat satu kesempatan terakhir untuk meredakan situasi!§!"
 TUR_britain_abandons_turkey_tt: "Ketika kami menarik kembali dukungan kami untuk §Y[TUR.GetNameDef]§!, pemerintah §Y[TUR.GetAdjective]§! akan mendapatkan satu kesempatan terakhir untuk meredakan situasi."
 bftb_turkey.9.t: "[ENG.GetAdjective] Tinggalkan Kami"
 bftb_turkey.9.desc: "Perdana Menteri [ENG.GetLeader] telah secara terbuka menyatakan bahwa mengingat meningkatnya ketegangan antara kami dan [SOV.GetNameDef], [ENG.GetNameDef] tidak boleh terlibat dalam apa yang disebut sebagai 'perselisihan regional'. Menimbulkan kerugian [ENG.GetAdjective] dalam Perang Besar, [ENG.GetLeader] telah mensponsori kebijakan peredaan terhadap [SOV.GetNameDef].\n\nPengumuman tersebut disambut dengan kekecewaan di Ankara, dan [TUR.GetLeader] mengutuk kepengecutan [ENG.GetNameDef]."
 bftb_turkey.9.a: "Semuanya hilang, kita harus menyerah sepenuhnya pada keinginan [SOV.GetNameDef]."
 bftb_turkey.9.b: "Tidak ada yang berubah, kami harus tetap berada di jalur yang benar."
 TUR_straits_remain_demilitarised_tt: "§YSelat Turki§! akan tetap didemiliterisasi dan kita tidak akan memiliki kendali atas lalu lintas angkatan laut yang melewati §YSelat Turki§! sampai kita berperang.\n\n§RIni adalah kesempatan terakhir kita untuk meredakan ketegangan: jika [SOV.GetNameDef] mendorong masalah ini lebih jauh maka hal itu akan menyebabkan perang!§!"
 TUR_we_remain_committed_tt: "§R[SOV.GetNameDefCap] akan memiliki satu kesempatan terakhir untuk meredakan situasi, namun jika mereka memilih untuk tidak melakukannya maka hal itu akan menyebabkan perang!§!"
 bftb_turkey.10.t: "[TUR.GetAdjective] Tetap Menantang"
 bftb_turkey.10.desc: "Bahkan dalam menghadapi kekuatan yang luar biasa, [TUR.GetLeader] menolak untuk mengalah pada topik hak [TUR.GetAdjective] atas Selat Turki. Ketegangan meningkat secara dramatis, dengan pasukan dikerahkan di sepanjang perbatasan [TUR.GetAdjective]-[SOV.GetAdjective]. [TUR.GetLeader] menyebut krisis ini sebagai 'momen takdir bagi [TUR.GetNameDef]' dan berjanji bahwa [TUR.GetNameDef] tidak akan pernah menyerah dalam menghadapi tirani [SOV.GetAdjective]."
 bftb_turkey.10.a: "Selat Turki tidak sebanding dengan perang total."
 bftb_turkey.10.b: "[TUR.GetNameDefCap] akan menyerah kepada kita dengan berlutut!"
 bftb_turkey.11.t: "[TUR.GetNameDefCap] Menyerah pada Permintaan Kami"
 bftb_turkey.11.desc: "[TUR.GetLeader] disambut dengan hangat di Moskow, di mana ia dipaksa, saat berada di bawah pengawalan bersenjata, untuk menandatangani perjanjian baru yang secara efektif menyerahkan semua hak [TUR.GetAdjective] untuk memiliterisasi atau mengawasi Selat Turki. Presiden [TUR.GetAdjective] dipulangkan dengan membawa pipa milik [SOV.GetLeader] sebagai kenang-kenangan kunjungannya ke [SOV.GetNameDef].\n\nKeberhasilan penegasan kekuatan kami di perairan asal kami adalah kemenangan besar bagi kami, dan pasukan kami di perbatasan [TUR.GetAdjective] telah diizinkan menjalani periode perayaan wajib yang berlangsung selama tiga hari di mana mereka harus seramai mungkin."
 bftb_turkey.11.a: "Dunia harus takut akan kekuatan [SOV.GetNameDef]."
 bftb_turkey.12.t: "[SOV.GetName] Mundur"
 bftb_turkey.12.desc: "[SOV.GetLeader] secara pribadi menelepon [TUR.GetLeader] dan dia dengan tenang mendesak agar ketegangan diredakan dan memuji Presiden [TUR.GetAdjective] atas kontribusinya dalam perjuangan melawan imperialisme. Tentara [SOV.GetAdjective] telah diperintahkan untuk mengurangi tindakan mereka di perbatasan [SOV.GetAdjective], dan [SOV.GetNameDef] telah mencabut keluhan mereka tentang perebutan Selat Turki oleh [TUR.GetName].\n\nMasyarakat [TUR.GetAdjective], yang sama sekali tidak tertarik dengan gagasan perang besar setelah Perang Kemerdekaan yang brutal, menghela nafas bersama ketika [TUR.GetLeader] menyatakan kepada bangsa bahwa perdamaian pada akhirnya akan menang, dan bahwa kedaulatan [TUR.GetAdjective] telah terjamin selama-lamanya berkat keberanian orang-orang [TUR.GetAdjective] di masa krisis ini."
 bftb_turkey.12.a: "Kami menang!"
 bftb_turkey.13.t: "Perang [TUR.GetAdjective]-[SOV.GetAdjective] Dimulai"
 bftb_turkey.13.desc: "Enam jam yang lalu, pasukan [SOV.GetAdjective] mulai menembaki [TUR.GetAdjective] pangkalan strategis di Trabzon dan menyatakan bahwa mereka memasuki [TUR.GetNameDef] untuk membebaskan pekerja [TUR.GetAdjective] sebagai bagian dari perang salib Marxis. Pengkhianat, Şefik Hüsnü, telah memproklamirkan pembentukan Republik Rakyat Turki di pengasingan yang tidak diragukan lagi akan tetap berada di bawah kendali [SOV.GetNameDef] di masa mendatang.\n\n[TUR.GetLeader] naik ke panggung di Istanbul di mana ia dengan sedih mengumumkan bahwa perang telah tiba di [TUR.GetNameDef], namun nada sedih itu tidak bertahan lama sebelum Presiden Turki mengubah retorikanya: melontarkan omongan berapi-api tentang bagaimana rakyat [TUR.GetAdjective] sekali lagi dipanggil oleh takdir untuk memperjuangkan kebebasan dan kemerdekaan mereka. Meski luka Perang Kemerdekaan masih membekas, masyarakat [TUR.GetAdjective] sudah terpacu semangatnya dan bergegas bergabung dengan TNI.\n\nTetapi sampai kapan semangat itu bisa bertahan?"
 bftb_turkey.13.a: "...dan berapa lama kita bisa bertahan?"
 bftb_turkey.14.t: "Gerakan Oposisi Mulai Terbentuk"
 bftb_turkey.14.desc: "[TUR.GetAdjective] para ilmuwan politik percaya bahwa dibutuhkan waktu berminggu-minggu bagi gerakan oposisi yang sah untuk mulai terbentuk setelah larangan terhadap partai politik dicabut, namun semuanya terbukti salah. Adnan Menderes tidak membuang waktu untuk mengumpulkan sekelompok tradisionalis yang berpikiran sama yang tidak senang dengan keadaan keyakinan agama di [TUR.GetNameDef] di bawah pemerintahan Kemalis. Di masa lalu, ketika gerakan politik [TUR.GetAdjective] dibajak oleh kelompok fundamentalis agama, seluruh proses transisi menuju demokrasi telah ditutup, namun kali ini tidak: kali ini [TUR.GetLeader] bertekad untuk mengalahkan gerakan fanatik ini pada pemilu mendatang.\n\nMenderes dan komplotan rahasia fundamentalis telah berkumpul dalam apa yang mereka sebut 'Kelompok Tradisional', yang diidentifikasi oleh CHP sebagai nenek moyang gerakan Islam populis yang berencana berjalan di atas platform konservatisme dan tradisionalisme. Kelompok Tradisional akan berkumpul di pedesaan Turki selama beberapa minggu berikutnya dengan tujuan membangun basis dukungan, dan begitu mereka telah mengumpulkan cukup banyak pengikut yang tertipu, mereka pasti akan mendebutkan partai oposisi mereka yang tak terelakkan."
 bftb_turkey.14.a: "Pemilu mendatang akan menjadi pemilu yang menyentuh jiwa [TUR.GetName]."
 bftb_turkey.16.t: "Kelompok Adat Memobilisasi Warga Pedesaan dalam Upaya Meningkatkan Jumlah Pemilih"
 bftb_turkey.16.desc: "Kaum Tradisionalis pimpinan Adnan Menderes berbondong-bondong turun ke jalan di seluruh negeri dalam upaya mendesak warga beragama yang merasa tertindas oleh pemerintah sekuler untuk keluar dan memilih partai mereka pada pemilu mendatang. Laporan menunjukkan bahwa meskipun banyak dari para pemilih ini masih skeptis terhadap peluang mereka untuk mengalahkan kelompok Kemalis dan memiliki sikap sinis terhadap demokrasi secara umum, sebagian besar dari mereka yang didekati menunjukkan antusiasme terhadap Menderes dan gerakan oposisinya."
 bftb_turkey.16.a: "Ini tidak konstitusional! Matikan!"
 bftb_turkey.16.b: "Keinginan demokratis rakyat harus diketahui."
 bftb_turkey.17.t: "Kelompok Tradisional Menderes Mendekati Organisasi Kurdi untuk Aliansi"
 bftb_turkey.17.desc: "Kaum Tradisionalis pimpinan Adnan Menderes telah melakukan perjalanan yang banyak dipublikasikan ke [TUR.GetAdjective] Kurdistan di mana mereka telah mengkhotbahkan rekonsiliasi dan kepentingan bersama ketika menyangkut keyakinan pada [TUR.GetNameDef] saat ini. Mengutip kitab suci agama, para pemimpin suku Kurdi telah tampil bersama para pejabat dari gerakan oposisi Tradisionalis dan mendorong masyarakat Kurdi untuk memilih Menderes dan sejenisnya pada hari pemilihan untuk 'membawa [TUR.GetNameDef] kembali ke pelukan Yang Maha Kuasa.'"
 bftb_turkey.17.a: "Ini adalah pengkhianatan batas!"
 bftb_turkey.17.b: "Kerja sama ini dapat membuahkan hasil di masa depan!"
 bftb_turkey.18.t: "Konspirasi Melakukan Penipuan Pemilih di Daerah Terungkap"
 bftb_turkey.18.desc: "Ini adalah hari yang menyedihkan bagi demokrasi [TUR.GetNameDef] yang baru lahir, karena rencana untuk mencurangi hasil pemilu di masa depan agar mendukung gerakan oposisi Adnan Menderes telah terungkap di beberapa provinsi paling agresif [TUR.GetNameDef]. Plot tersebut – yang melibatkan para pemimpin agama, pejabat lokal, dan bahkan pegawai negara – telah digagalkan, dan para konspirator ditangkap. Tidak ada bukti yang mengaitkan Menderes atau gerakan oposisinya dengan plot tersebut dalam penyelidikan kami, namun reaksi kami pasti akan mempengaruhi kampanye pemilu mereka."
 bftb_turkey.18.a: "Uji semuanya secara terbuka dan beri mereka hukuman seberat mungkin!"
 bftb_turkey.18.b: "Kami diam-diam akan menawarkan amnesti dan berharap hal ini dilupakan."
 bftb_turkey.19.t: "Rapat Umum Besar-besaran Diadakan untuk Mendukung Gerakan Menderes"
 bftb_turkey.19.desc: "Rapat umum yang diadakan oleh Adnan Menderes di daerah pedalaman menarik banyak orang seperti ketika pidato Mustafa Kemal Atatürk disampaikan di jantung kota Istanbul. [TUR.GetLeader] merasa putus asa ketika mendengar penghitungan ulang rapat umum tersebut, yang berlangsung tanpa hambatan dan Menderes mengumumkan bahwa partai oposisi resminya akan segera diumumkan kepada negara. Sejumlah pembicara tampil, masing-masing memberitakan pentingnya agama dalam kehidupan sehari-hari dan dalam politik dan masing-masing dari mereka umumnya mendukung ideologi konservatisme tradisionalis - beberapa pembicara bahkan berbicara dengan nada yang menyentuh tentang kesultanan dan kekhalifahan Ottoman yang telah lama ditaklukkan! Menderes sendiri tampil terakhir dan berbicara jauh lebih terukur dibandingkan beberapa pembicara yang tindak lanjutnya ia tindak lanjuti. Menderes dengan gembira menguraikan manfaat liberalisme laissez-faire kepada para pendengarnya, dan memuji kaum Kemalis atas semua yang telah mereka lakukan untuk bangsa sebelum meremehkan pujian tersebut dengan banyak kritik. Para peserta meninggalkan rapat umum dengan gembira dan yakin akan peluang mereka untuk memenangkan pemilu.\n\nKorps perwira Kemalis yang setia telah melakukan pendekatan kepada pemerintah dan dengan tegas menuntut agar CHP berbuat lebih banyak untuk mengekang meningkatnya pengaruh Menderes dan gerakan populis konservatifnya. Seorang perwakilan dari korps perwira menyatakan bahwa para perwira negara tersebut tidak akan pernah mengabdi pada pemerintahan Menderes, dan mengisyaratkan akan mengambil tindakan ekstrem jika kita gagal mengekang apa yang mereka lihat sebagai ancaman mendasar terhadap sistem Kemalis."
 bftb_turkey.19.a: "Ini adalah hari yang kelam bagi Republik."
 bftb_turkey.20.t: "Partai Demokrat"
 bftb_turkey.20.desc: "Delapan jam yang lalu, Adnan Menderes dengan penuh kemenangan mengumumkan debut partai oposisi terbaru dan paling berbahaya [TUR.GetNameDef]: Partai Demokrat. Ia mengumumkan bahwa Partai Demokrat bermaksud untuk menggulingkan monopoli kekuasaan CHP, dan bahwa negara akan diarahkan ke arah yang baru yang belum pernah terjadi sebelumnya. Tiga pilar partai tersebut diungkapkan kepada massa yang bergembira, dan Menderes berjanji bahwa pemerintahannya akan berkomitmen pada Iman, Tanah Air, dan Kebebasan - dalam urutan tersebut. Yang lebih mengejutkan adalah pengumuman Menderes bahwa pemerintahan [TUR.GetName] yang dipimpin oleh Partai Demokrat jelas akan lebih intervensionis dibandingkan pemerintahan [TUR.GetAdjective] lainnya sejak negara ini berdiri.\n\nPengumuman ini disambut dengan kemarahan di kalangan Kemalis, dan [TUR.GetLeader] telah berjanji kepada para pendukungnya di Istanbul hari ini bahwa meskipun pemilu ini akan berlangsung lebih keras dari yang diperkirakan sebelumnya, CHP akan muncul dalam pemilu mendatang, namun tetap menjadi pemimpin negara."
 bftb_turkey.20.a: "Biarkan pihak terbaik menang!"
 bftb_turkey.21.t: "Hari Pemilihan"
 bftb_turkey.21.desc: "Hari pemilu yang ditunggu-tunggu akhirnya tiba. Laki-laki dan perempuan di seluruh negeri mengabaikan cuaca buruk dan penyakit pribadi sehingga mereka dapat pergi ke tempat pemungutan suara yang telah ditentukan di provinsi mereka dan mengisi surat suara untuk partai pilihan mereka. Tak seorang pun dapat mengantisipasi jumlah pemilih yang begitu besar, terutama ketika transisi menuju demokrasi tampaknya terjadi begitu cepat. Persaingan dalam pemilu belum sepenuhnya berjalan dengan baik, namun pendukung pro-demokrasi mana pun akan merasa bangga melihat begitu banyak warga [TUR.GetAdjective] yang keluar untuk memilih dalam pemilu bebas pertama [TUR.GetName].\n\nPerlombaan berlangsung ketat dan membutuhkan waktu yang cukup lama untuk menghitung seluruh suara dan menentukan hasil akhir. Pemenang utama pemilu pertama [TUR.GetNameDef] adalah..."
 bftb_turkey.21.a: "...Partai Republik!"
 bftb_turkey.21.b: "...Parti Demokrat!"
 TUR_republican_victory_tt: "£faction_tur_kemalist §YCHP§! akan diberi mandat §Ydemokratis§! untuk memerintah negara."
 TUR_conservative_victory_tt: "£faction_tur_traditionalist §YDP§! diberi amanat §Ydemokratis§! untuk memerintah negara."
 bftb_turkey.22.t: "Perang Saudara [TUR.GetAdjective]"
 bftb_turkey.22.desc: "Pasca kemenangan Partai Demokrat dalam pemilu, hampir tidak bisa dihindari bahwa konflik akan pecah di dalam [TUR.GetNameDef]. Ketegangan antara pemerintah dan angkatan bersenjata terus memburuk setiap hari sejak pemilu, dan kini tampaknya segalanya telah mencapai puncaknya. Para perwira telah menguasai negara-negara bagian paling kaya di barat, dan diyakini bahwa para perwira tersebut mendapat dukungan rakyat dari negara-negara yang memberontak.\n\nDi sebelah timur, milisi Kurdi mulai berorganisasi sebagai persiapan perjuangan bersenjata dengan tujuan mengamankan kemerdekaan mereka. Kita adalah orang-orang bodoh yang mengira aliansi kita dengan Kurdi akan bertahan lama, namun mereka bahkan lebih bodoh lagi karena berpikir kita tidak akan memusnahkan upaya menyedihkan mereka untuk mencabut suatu negara dari tanah kedaulatan kita.\n\nPerjuangan jiwa [TUR.GetNameDef] telah dimulai, dan kita tidak boleh kalah."
 bftb_turkey.22.a: "Fi sabilillah, kita berjuang!"
 bftb_turkey.23.t: "Pakta Saadabad"
 bftb_turkey.23.desc: "[TUR.GetLeader] telah mendekati [ROOT.GetLeader] dengan saran untuk menandatangani pakta non-agresi bersama, sehingga membuka prospek kerja sama lebih lanjut di masa depan. Para diplomat [TUR.GetAdjective] bekerja keras dalam upaya mereka, menjelaskan secara rinci tentang sejarah dan kepentingan bersama kedua negara, diikuti dengan seruan yang sungguh-sungguh untuk perdamaian antar negara bersaudara. Negosiasi bolak-balik berjalan menyenangkan, namun pilihan apakah kami menandatangani atau tidak pada akhirnya ada di tangan kami."
 bftb_turkey.23.a: "Tentu saja kami akan menandatangani perjanjian persahabatan ini!"
 bftb_turkey.23.b: "Kami bukan saudara, [TUR.GetName] : kami tidak mengenal anda."
 bftb_turkey.24.t: "Memilih Penerus Atatürk"
 bftb_turkey.24.desc: "Tidak ada laki-laki atau perempuan yang bisa berharap untuk bisa menyamai kepemimpinan Mustafa Kemal Atatürk, namun Bapak Turki tetaplah manusia fana. Kami tidak bermaksud untuk menggantikan Ghazi kami, karena tidak ada seorang pun yang bermimpi untuk hidup sesuai dengan bapak pendiri bangsa kami, namun kami harus memilih pemimpin yang dapat kami percayai untuk mengikuti jejak Atatürk. Mereka harus mencontohkan nilai-nilai Kemalis dan mengikuti teladan Atatürk sebagai pemimpin [TUR.GetNameDef]."
 bftb_turkey.24.a: "Celâl Bayar adalah kandidat yang jelas."
 bftb_turkey.24.b: "Celâl Bayar adalah kandidat yang jelas."
 bftb_turkey.24.c: "İsmet İnönü adalah penerus Atatürk yang layak."
 bftb_turkey.24.d: "Fevzi Çakmak adalah pemimpin yang dibutuhkan [TUR.GetNameDef]."
 bftb_turkey.24.e: "Fevzi Çakmak akan menjadi Francisco Franco kita sendiri."
 bftb_turkey.24.f: "Recep Peker adalah orang yang mensintesis fasisme dan Kemalisme."
 bftb_turkey.24.g: "Kejeniusan Şevket Süreyya Aydemir akan membantu kita melewatinya."
 bftb_turkey.24.h: "Hanya İsmet İnönü yang dapat memperkenalkan sosialisme [TUR.GetAdjective] yang unik."
 bftb_turkey.24.i: "Kâzım Orbay akan memimpin junta militer sampai kita menemukan jalan kita."
 bftb_turkey.24.j: "Uh... um... mantan Khalifah?"
 bftb_turkey.25.t: "[TUR.GetName] Menekan Isu Hatay"
 bftb_turkey.25.desc: "[TUR.GetLeader] telah menulis surat dengan kata-kata tegas yang menuntut agar penduduk Turki di negara bagian Hatay, Suriah, diberikan hak demokratis untuk melakukan referendum, sehingga rakyat Hatay dapat memutuskan apakah mereka ingin bergabung dengan [TUR.GetNameDef] atau tetap menjadi bagian dari Suriah tanpa batas waktu. Polisi kolonial kami telah mengungkap aktivitas melanggar hukum di perbatasan [TUR.GetAdjective], dengan warga negara [TUR.GetAdjective] menyeberang ke negara tersebut dan menyebabkan keributan di provinsi Hatay. Jelas bahwa [TUR.GetNameDef] berencana untuk mengubah hasil referendum untuk memastikan kemenangan [TUR.GetAdjective], namun memiliki [TUR.GetNameDef] yang disayangi oleh kita tentu lebih baik daripada alternatif lainnya. Siapa yang dapat mengatakan sejauh mana [TUR.GetLeader] akan memastikan bahwa Hatay diintegrasikan ke dalam [TUR.GetNameDef]?"
 bftb_turkey.25.a: "Kami akan membiarkan Hatay masuk ke dalam genggaman [TUR.GetNameDef]."
 bftb_turkey.25.b: "Hatay akan tetap menjadi bagian dari Suriah, apapun keinginan [TUR.GetAdjective]."
 bftb_turkey.26.t: "[FROM.GetNameDefCap] Menyerahkan Kedaulatan Hatay kepada Kami"
 bftb_turkey.26.desc: "[TUR.GetLeader] memberikan pidato kecil di Antakya menyambut warga Hatay ke [TUR.GetNameDef], dan mengucapkan terima kasih kepada [FROM.GetLeader] dari [FROM.GetNameDef] karena menghormati kemauan demokratis masyarakat Hatay. Meskipun tindakan tersebut ditanggapi dengan kemarahan oleh para pejabat Suriah, suasana umum Hatay dan [TUR.GetNameDef] secara keseluruhan adalah kepuasan, dan banyak orang [TUR.GetAdjective] melakukan perjalanan dari rumah mereka ke Hatay untuk menahbiskan provinsi terbaru [TUR.GetNameDef] dengan perayaan dan pertukaran hadiah."
 bftb_turkey.26.a: "Kami menyambut Anda kembali, saudara-saudara."
 bftb_turkey.27.t: "[FROM.GetName] Mempertahankan Kontrol Kuat Atas Hatay"
 bftb_turkey.27.desc: "[TUR.GetLeader] memimpin unjuk rasa yang berapi-api di Gaziantep, di mana dia mengutuk penindasan terhadap Turki di luar negeri oleh [FROM.GetNameDef]. Masyarakat [TUR.GetAdjective] telah dilanda keributan, dan hanya ada sedikit cinta yang hilang antara penindas Hatay dan masyarakat [FROM.GetNameDef] saat ini. Untuk saat ini, Hatay masih berada di luar jangkauan kita – tapi kita akan selalu mengingat pengkhianatan keji ini."
 bftb_turkey.27.a: "Dengan satu atau lain cara, Hatay akan dibebaskan ke tempatnya semula."
 bftb_turkey.29.t: "Mantan Relawan yang Menolak Dinas karena Alasan Hati Nurani"
 bftb_turkey.29.desc: "Tampaknya keputusan kita untuk mengadopsi pendekatan Fatherland First dalam pemerintahan telah membuahkan hasil yang luar biasa! Kami tiba-tiba melihat gelombang besar sukarelawan yang berharap untuk bergabung dengan angkatan bersenjata kami dari berbagai negara. Komando tinggi kita hampir kewalahan, dampak yang memusingkan ini telah menyebabkan orang-orang dari berbagai latar belakang agama dan bahasa untuk bergabung dan beban ini terlalu berat untuk ditanggung pada tingkat operasional.\n\nSyukurlah, kami setidaknya sudah siap menghadapi kejadian ini dan integrasi semua mantan pengelak wajib militer ini kurang lebih berjalan mulus. Penasihat kami menyarankan agar kita bisa melihat sejumlah sukarelawan dalam beberapa waktu ke depan!"
 bftb_turkey.29.a: "Sungguh menggembirakan melihat begitu banyak pria dan wanita pemberani datang membela negaranya."
 bftb_turkey.30.t: "Kompensasi untuk Kepulauan Oniki"
 bftb_turkey.30.desc: "Kepulauan Oniki terletak di perairan teritorial kami dan pernah dianggap sebagai bagian integral dari kerajaan kami. Dodecanese, sebagaimana [ENG.GetAdjective] dan [GRE.GetAdjective] lebih suka menyebutnya, akan menjadi milik kita sekali lagi setelah [ITA.GetAdjective] menyerahkan mereka kepada pemilik sahnya.\n\nPejabat pemerintah telah menyusun portofolio mengenai apa yang dapat kami tawarkan kepada [ITA.GetAdjective] sebagai imbalan atas pulau-pulau tersebut, karena kami yakin mereka akan menuntut kompensasi – jika mereka bersedia menyetujuinya."
 bftb_turkey.30.a: "Kami akan menawarkan mereka hak atas kromium kami."
 bftb_turkey.30.b: "Kami akan menawarkan kompensasi industri."
 bftb_turkey.30.c: "Tawaran persahabatan sudah cukup."
 bftb_turkey.31.t: "[FROM.GetNameDefCap] Menawarkan Kami Hak Sumber Daya Eksklusif di [342.GetName]"
 bftb_turkey.31.desc: "Pemerintah [FROM.GetAdjective] telah mendekati kami dengan tawaran yang mengejutkan. Mereka ingin memberi kita seratus persen hasil bijih dan logam alam mereka di negara bagian [342.GetName] dengan imbalan Kepulauan Dodecanese.\n\nPemerintah kami biasanya berurusan dengan urusan perolehan tanah daripada menyerahkannya, namun [TUR.GetNameDef] menawarkan kepada kami sumber daya kami sendiri yang dapat digunakan untuk menimbun sumber daya yang mungkin penting bagi upaya perang skala besar. Kita juga harus mempertimbangkan bahwa ini adalah sumber daya yang mungkin tidak dapat kita akses ketika perang benar-benar dimulai. Pilihan apakah akan menerima [FROM.GetAdjective] tawaran mereka pada akhirnya terserah pada kita."
 bftb_turkey.31.a: "Kami menerima hak atas sumber daya Anda dengan imbalan Kepulauan Dodecanese."
 bftb_turkey.31.b: "Kami tidak akan berpisah dengan satu inci pun tanah! Tidak sekarang, tidak selamanya!"
 bftb_turkey.32.t: "[FROM.GetNameDefCap] Menawarkan Kami Bantuan Industri sebagai imbalan atas Dodecanese"
 bftb_turkey.32.desc: "Pemerintah [FROM.GetAdjective] telah mendekati kami dengan tawaran menarik. [FROM.GetAdjective] telah memberi kami portofolio yang menguraikan signifikansi historis dan strategis Dodecanese kepada [FROM.GetNameDef], dan menyusun daftar properti dan fasilitas manufaktur yang ingin mereka jual kepada kami sebagai imbalan atas pulau-pulau tersebut.\n\nPemerintah kita biasanya berurusan dengan urusan perolehan tanah daripada menyerahkannya, namun tidak dapat dipungkiri bahwa industri tambahan dapat sangat berguna bagi mesin perang [ROOT.GetAdjective]. Pada akhirnya, kita harus memutuskan apakah dorongan ekstra terhadap industri kita akan lebih bermanfaat bagi negara kita dibandingkan Kepulauan Dodecanese."
 bftb_turkey.32.a: "Menandatangani kontrak; mereka mungkin memiliki pulau-pulau tersebut jika mereka bersedia membayarnya."
 bftb_turkey.32.b: "Kami tidak akan berpisah dengan satu inci pun tanah! Tidak sekarang, tidak selamanya!"
 bftb_turkey.33.t: "[FROM.GetNameDefCap] Meminta Pemindahan Kepulauan Dodecanese"
 bftb_turkey.33.desc: "Pemerintah [FROM.GetAdjective] telah mengeluarkan surat lengkap yang ditandatangani oleh [FROM.GetLeader] yang menekankan pentingnya ikatan antara kedua negara dan kecintaan alami [FROM.GetAdjective] terhadap negara kita. Memotong semua keributan, [FROM.GetAdjective] telah menawarkan untuk menandatangani 'Pakta Kekuasaan' dengan kami - sebuah perjanjian yang tidak berarti apa-apa, namun dengan ikatan yang terikat. Surat persahabatan tersebut dilampirkan dengan berkas berisi instruksi tentang bagaimana menangani pertukaran wewenang secara damai antara gubernur daerah kita dan birokrat [FROM.GetAdjective] yang menunggu untuk mengambil alih pemerintahan Kepulauan Dodecanese.\n\nPemerintah kita biasanya berurusan dengan urusan perolehan tanah daripada menyerahkannya, namun [FROM.GetAdjective] akan menjadi sekutu yang sangat berguna dalam konflik yang terjadi di Mediterania. Jika hal ini menjadi perhatian, sebagian besar penduduk Yunani di Kepulauan Dodecanese telah menyatakan kekecewaannya terhadap gagasan [FROM.GetNameDef] mencaplok rangkaian pulau mereka sebagai bagian dari negara [FROM.GetAdjective]. Tapi sekali lagi, mereka mempunyai reaksi yang sangat mirip ketika kita mencabut rumah mereka dari reruntuhan Kesultanan Utsmaniyah setelah Perang Besar."
 bftb_turkey.33.a: "Hal ini sebaiknya mengarah pada aliansi militer di kemudian hari..."
 bftb_turkey.33.b: "Kami tidak takut disebut munafik; pulau-pulau itu akan tetap menjadi milik kita!"
 bftb_turkey.34.t: "[FROM.GetNameDefCap] Menerima Penawaran Kami!"
 bftb_turkey.34.desc: "Kepulauan Oniki telah dikembalikan kepada kami oleh otoritas [FROM.GetAdjective] dengan imbalan hak eksklusif atas sumber daya di [342.GetName]. Meskipun para pejabat secara pribadi telah mengungkapkan kekecewaan mereka atas tampilan terang-terangan kolonialisme suka sama suka di [342.GetName], banyak dari pertimbangan tersebut telah tenggelam oleh kegembiraan umum di balik aneksasi provinsi terbaru [TUR.GetNameDef].\n\n[TUR.GetLeader] melakukan kunjungan pribadi ke Rhodes dan mereka secara pribadi meyakinkan warga yang telah lama tertindas bahwa semua kekhawatiran mereka akan didengar dan ditangani oleh pemerintah [TUR.GetAdjective], bahkan ketika kurikulum baru yang membuat sensasi sejarah dan akar etnis kepulauan tersebut menjadi [TUR.GetNameDef] telah mulai diterapkan di seluruh rangkaian pulau."
 bftb_turkey.34.a: "Kemenangan besar!"
 bftb_turkey.35.t: "[FROM.GetNameDefCap] Menerima Penawaran Kami!"
 bftb_turkey.35.desc: "Kepulauan Oniki telah dikembalikan kepada kami oleh otoritas [FROM.GetAdjective] dengan imbalan hasil dari sebagian industri kami yang sedang berkembang. Meskipun para pejabat secara pribadi telah menyatakan kekecewaan mereka terhadap gagasan untuk membayar sesuatu yang pernah menjadi milik kita selama berabad-abad dengan baja dan keringat, banyak dari pertimbangan tersebut telah tenggelam oleh kegembiraan umum di balik aneksasi provinsi terbaru [TUR.GetNameDef].\n\n[TUR.GetLeader] melakukan kunjungan pribadi ke Rhodes dan mereka secara pribadi meyakinkan warga yang telah lama tertindas bahwa semua kekhawatiran mereka akan didengar dan ditangani oleh pemerintah [TUR.GetAdjective], bahkan ketika kurikulum baru yang membuat sensasi sejarah dan akar etnis pulau-pulau tersebut menjadi [TUR.GetNameDef] telah mulai diterapkan di seluruh rangkaian pulau."
 bftb_turkey.35.a: "Kemenangan besar!"
 TUR_three_factories_sacrificed: "Tiga §YPabrik Sipil§! dihapus."
 bftb_turkey.36.t: "[FROM.GetNameDefCap] Menerima Penawaran Kami!"
 bftb_turkey.36.desc: "Yang mengejutkan banyak pejabat [TUR.GetAdjective], Kepulauan Oniki telah dikembalikan kepada kami oleh otoritas [FROM.GetAdjective] sebagai imbalan atas penandatanganan perjanjian yang pada akhirnya memaksa tidak ada pihak yang menjunjung komitmen tidak berarti apa pun yang terkandung di dalamnya. [TUR.GetLeader] melakukan kunjungan kenegaraan secara langsung untuk menandatangani apa yang disebut Pakta Kekuasaan dengan [FROM.GetLeader], dan terdapat janji bersama dari kedua pemimpin untuk lebih mengembangkan hubungan antara kedua negara maritim yang bertetangga tersebut sehubungan dengan pertukaran lahan bersejarah ini. Kegembiraan sepanjang [TUR.GetNameDef] sangat menular dan ada banyak perayaan atas aneksasi provinsi terbaru [TUR.GetNameDef].\n\n[TUR.GetLeader] melakukan kunjungan pribadi ke Rhodes dan mereka secara pribadi meyakinkan warga yang telah lama tertindas bahwa semua kekhawatiran mereka akan didengar dan ditangani oleh pemerintah [TUR.GetAdjective], bahkan ketika kurikulum baru yang membuat sensasi sejarah dan akar etnis kepulauan tersebut menjadi [TUR.GetNameDef] telah mulai diterapkan di seluruh rangkaian pulau.\n\nPemerintah [GRE.GetAdjective] telah mengutuk pertukaran wilayah yang mulus, dan telah meminta negara-negara besar lainnya untuk mengutuk apa yang mereka sebut sebagai pelanggaran yang tidak adil dan ilegal terhadap kedaulatan masyarakat [GRE.GetAdjective] di Kepulauan Oniki. Komunitas internasional umumnya bungkam mengenai pertukaran wilayah tersebut, kemungkinan besar karena takut mengasingkan pemerintah [TUR.GetAdjective]."
 bftb_turkey.36.a: "Ini tidak bisa lebih baik lagi."
 bftb_turkey.37.t: "[FROM.GetNameDefCap] Menolak Tawaran Kami!"
 bftb_turkey.37.desc: "Pemerintah [FROM.GetAdjective] telah secara terbuka menyatakan bahwa meskipun ada upaya dari [TUR.GetAdjective] agitator dan revanchis, Kepulauan Dodecanese selamanya akan tetap menjadi wilayah integral negara bagian [FROM.GetAdjective]. [FROM.GetLeader] menyebut nama [TUR.GetLeader] dalam pidato mereka, mengejek bahwa meskipun [TUR.GetLeader] mungkin dihormati secara luas di [TUR.GetNameDef], di [FROM.GetNameDef] mereka diejek secara luas sebagai pemimpin yang tidak kompeten oleh warga [FROM.GetAdjective]. [FROM.GetLeader] selanjutnya menyebut [TUR.GetNameDef] sebagai negara gagal dan menjelaskan secara panjang lebar bagaimana keberadaan bangsa kita merupakan penghinaan yang tidak dapat dimaafkan terhadap bangsa [FROM.GetAdjective]. Dalam pidatonya yang panjang lebar, [FROM.GetLeader] menyebutkan janji-janji Perjanjian Sèvres yang tidak terpenuhi tidak kurang dari tiga puluh tujuh kali.\n\n[TUR.GetLeader] menggambarkan posisi [FROM.GetAdjective] sebagai 'disayangkan', namun berharap ada peluang untuk dialog diplomatik lebih lanjut di kemudian hari."
 bftb_turkey.37.a: "Ya, itu bisa menjadi lebih baik."
 bftb_turkey.38.t: "[FROM.GetNameDefCap] Menyarankan Upaya Ekstraksi Sumber Daya Bersama di Kaukasus"
 bftb_turkey.38.desc: "Pemerintah [FROM.GetAdjective] telah mengakui mengirimkan surveyor dan penambang ke Georgia untuk menilai hasil bijih dari upaya penambangan kami, dan telah mendekati kami dengan portofolio yang menyarankan cara agar kedua negara dapat memperoleh manfaat yang lebih baik dari upaya ekstraksi mineral bersama. Ini mungkin merupakan fenomena yang belum pernah terjadi sebelumnya bagi aktor negara untuk mengakui suatu bentuk kegiatan mata-mata dan kemudian mencoba mengubah pengakuan tersebut menjadi sebuah rencana untuk membina hubungan yang lebih erat antara kedua negara, namun hal itulah yang sedang kita hadapi saat ini. Tidak ada yang dapat menyangkal bahwa pemerintah [FROM.GetAdjective] adalah pemerintah yang tidak mau mengambil risiko.\n\nPortofolio [FROM.GetAdjective] komprehensif dan menyeluruh; [FROM.GetAdjective] akan mengekspos dan mengekstrak urat bijih yang mereka temukan dan memberikan sebagian besar hasil tangkapan kepada kami sambil memindahkan sebagian temuan ke [354.GetName] untuk digunakan sendiri. Kami mungkin tidak akan mengungkap apa yang telah ditemukan [FROM.GetAdjective] selama bertahun-tahun yang akan datang, namun kami dapat menggunakan rencana yang dikirimkan kepada kami untuk meningkatkan proses ekstraksi kami di Georgia untuk mendapatkan hasil yang lebih rendah dan tanpa memerlukan bantuan [FROM.GetAdjective]. Keputusan apakah akan bekerja sendiri atau menerima tawaran bantuan dari pemerintah [FROM.GetAdjective] ada di tangan kita."
 bftb_turkey.38.a: "Mari kita bekerja sama menuju keuntungan bersama."
 bftb_turkey.38.b: "Mereka bodoh jika mengira kami akan menerima campur tangan mereka di perbatasan kami."
 bftb_turkey.39.t: "[FROM.GetNameDefCap] Menerima Proposal Kami"
 bftb_turkey.39.desc: "Para pejabat [TUR.GetAdjective] memuji kerja baik mereka, karena pemerintah [FROM.GetAdjective] baru saja menyampaikan kepada kami bahwa mereka ingin melaksanakan rencana ekstraksi logam bersama di Georgia seperti yang direncanakan dalam manifesto kompleks yang kami sampaikan kepada mereka.\n\nProses negara bagian telah dimobilisasi sehingga ketika bijih tersebut dibuat di Georgia, bijih tersebut dapat segera dipersiapkan untuk diangkut ke [354.GetName] di mana bijih tersebut dapat disuling untuk digunakan sendiri."
 bftb_turkey.39.a: "Kemenangan diplomatis!"
 bftb_turkey.40.t: "[FROM.GetNameDefCap] Menolak Usulan Kami!"
 bftb_turkey.40.desc: "Para pejabat [FROM.GetAdjective] dilaporkan bereaksi tidak percaya atas usulan kami untuk menambang di Georgia dengan izin pemerintah [FROM.GetAdjective]. Permintaan kami telah ditertawakan, dan mungkin yang lebih menghina lagi, [FROM.GetAdjective] menggunakan beberapa rencana yang kami serahkan bersama portofolio kami untuk mengekstraksi bijih yang kami temukan tanpa kami."
 bftb_turkey.40.a: "itu!"
 bftb_turkey.41.t: "[FROM.GetNameDefCap] Mengundang Kami ke [FROM.GetFactionName]"
 bftb_turkey.41.desc: "Presiden [FROM.GetNameDef] [FROM.GetLeader] telah mempelopori inisiatif untuk mereformasi Pakta Balkan secara formal menjadi aliansi strategis yang lebih luas dan mencakup segalanya yang disebut Balkan Entente. Semua anggota Pakta Balkan telah diundang untuk bergabung [FROM.GetFactionName], dan itu termasuk kami.\n\nPejabat dari [FROM.GetNameDef] telah memastikan bahwa hubungan yang dibangun antar negara di [FROM.GetFactionName] akan melampaui masalah militer semata, dan telah mengeluarkan ringkasan rencana untuk bersama-sama mengembangkan sistem moneter, strategi pertahanan, dan banyak lagi."
 bftb_turkey.41.a: "Bersatu sebagai satu, kita bisa mempertahankan Balkan."
 bftb_turkey.41.b: "Inisiatif ini adalah khayalan bodoh yang muncul dari chauvinisme [FROM.GetAdjective]."
 bftb_turkey.42.t: "[FROM.GetNameDefCap] Bergabung [ROOT.GetFactionName]!"
 bftb_turkey.42.desc: "[FROM.GetLeader] telah mengumumkan bahwa [FROM.GetNameDef] telah memutuskan untuk meratifikasi dan bergabung dengan [ROOT.GetFactionName]. Ada banyak keriuhan dan dua perayaan kenegaraan berturut-turut untuk memperingati pengikatan nasib kedua negara ketika konflik pecah."
 bftb_turkey.42.a: "Bersama-sama, kita akan menyelamatkan Balkan."
 bftb_turkey.43.t: "[FROM.GetNameDefCap] Menolak Banding untuk Bergabung [ROOT.GetFactionName]!"
 bftb_turkey.43.desc: "[FROM.GetLeader] telah mengungkapkan kepada kami bahwa [FROM.GetNameDef] tidak akan bergabung dengan [ROOT.GetFactionName]. Kekecewaan para diplomat dan pejabat pemerintah kita tidak dapat diukur, dan keluarnya [FROM.GetNameDefCap] dari Pakta Balkan serta penolakan terhadap [ROOT.GetFactionName] telah membahayakan keseluruhan proyek."
 bftb_turkey.43.a: "Solidaritas bisa menyelamatkan kita, namun perpecahan bisa menghancurkan kita."
 bftb_turkey.44.t: "Usulan Petra"
 bftb_turkey.44.desc: "Kami telah menerima rencana pertahanan dari [FROM.GetNameDef] yang mengusulkan agar pemerintah [FROM.GetAdjective] mengambil alih tanggung jawab melindungi harta benda kami di Levant. [FROM.GetLeader] berpendapat bahwa kedekatan geografis [FROM.GetNameDef] membuat pertahanan dan pengelolaan wilayah ini menjadi mudah, dan menyerahkan wilayah ini kepada [FROM.GetNameDef] akan membebaskan sumber daya kita untuk dialihkan ke tempat lain.\n\nProposisi ini bukannya tidak berdasar, namun menempatkan kita pada... posisi yang menarik. Kami merebut Palestina, Yordania, dan Sinai dari Kesultanan Utsmaniyah yang kalah: siapkah kami mengembalikannya kepada [FROM.GetAdjective] penerus Kesultanan Utsmaniyah? Dengan mengesampingkan pertimbangan historis, kita juga harus mempertimbangkan bagaimana reaksi pemerintah [FROM.GetAdjective] jika kita menolaknya. Mereka mungkin menafsirkan penolakan kita sebagai tanda bahwa kita tidak mempercayai mereka, atau bahwa kita tidak menghargai posisi mereka dalam aliansi ini. [FROM.GetNameDefCap] terbukti tidak dapat diprediksi di masa lalu, dan sayangnya kita tidak dapat percaya bahwa pihak berwenang [FROM.GetAdjective] tidak akan meningkatkan masalah ini jika kita menolaknya."
 bftb_turkey.44.a: "Rencananya masuk akal secara strategis!"
 bftb_turkey.44.b: "Kekaisaran Ottoman runtuh karena suatu alasan."
 bftb_turkey.45.t: "[FROM.GetAdjective] Memberikan Persetujuan Terhadap Usulan Petra"
 bftb_turkey.45.desc: "[FROM.GetAdjective] perwira kolonial telah meninggalkan pos mereka dan pindah ke protektorat yang berdekatan untuk memfasilitasi pengambilalihan bekas koloni [FROM.GetAdjective] secara mulus. [FROM.GetLeader] menulis surat kepada Presiden kita yang menjelaskan bahwa [ROOT.GetNameDef] mempunyai kepercayaan penuh [FROM.GetNameDef] terhadap kemampuan kita untuk mempertahankan dan mengatur provinsi yang diserahkan kepada kita.\n\nBanyak warga [ROOT.GetAdjective] melihat pengalihan lahan sebagai sebuah kemenangan besar, dan sebuah penegasan bahwa [ROOT.GetNameDef] sekali lagi merupakan kekuatan regional yang kuat dan dihormati di seluruh dunia."
 bftb_turkey.45.a: "Kami berada di liga besar sekarang."
 bftb_turkey.46.t: "[FROM.GetAdjective] Tolak Usulan Petra"
 bftb_turkey.46.desc: "Perdana Menteri [FROM.GetLeader] dari [FROM.GetNameDef] mengatakan penyerahan wilayah [FROM.GetAdjective] di Levant kepada [ROOT.GetNameDef] akan menjadi tindakan yang tidak terpikirkan dan memperingatkan bahwa kebijaksanaan memerlukan kelanjutan pemerintahan [FROM.GetAdjective] di wilayah tersebut. Pasukan [FROM.GetAdjective] di Levant bahkan telah disiagakan untuk memastikan bahwa serangan [ROOT.GetAdjective] yang tidak terduga ke wilayah tersebut dapat dengan cepat digagalkan.\n\nSecara pribadi, banyak pejabat pemerintah kami yang menyatakan kekecewaan mereka terhadap keputusan [FROM.GetAdjective], dengan menyebut penolakan proposal kami sebagai bukti bahwa [FROM.GetAdjective] tidak mempercayai kami sebagai sekutu. [ROOT.GetLeader] juga telah menyatakan ketidaksetujuannya terhadap keputusan [FROM.GetAdjective] dan telah meminta para penasehat untuk memberikan pilihan mengenai bagaimana menanggapinya."
 bftb_turkey.46.a: "Kami mencoba, dan kami gagal. Tidak ada lagi yang bisa kami lakukan."
 bftb_turkey.46.b: "Kami akan meningkatkan masalah ini!"
 bftb_turkey.47.t: "[FROM.GetNameDefCap] Menimbulkan Kekhawatiran Terhadap Pertahanan Teluk"
 bftb_turkey.47.desc: "Presiden [FROM.GetNameDef] [FROM.GetLeader] telah menghubungi kami dengan kekhawatiran atas keamanan koloni kami di teluk Arab. Pemimpin [FROM.GetAdjective] telah menyarankan agar [FROM.GetNameDef] mengambil alih tanggung jawab pertahanan dan administrasi seluruh wilayah, karena sejarah [FROM.GetNameDef] dan kedekatannya dengan wilayah tersebut.\n\nBeberapa pejabat [ROOT.GetAdjective] telah menyatakan kekhawatirannya atas usulan tersebut mengingat [FROM.GetNameDef] baru-baru ini mengajukan petisi untuk mengambil kendali atas wilayah Levant. Para analis khawatir bahwa perampasan tanah diplomatik ini telah direncanakan secara strategis oleh [FROM.GetNameDef] untuk menetapkan status quo baru bagi wilayah di mana [FROM.GetNameDef] merupakan kekuasaan yang tidak perlu dipersoalkan lagi atas seluruh anak benua. Terlepas dari kekhawatiran di masa depan, [FROM.GetNameDef] tetap menjadi sekutu kita dan jika kita ingin mereka tetap ada, maka akan lebih bijaksana jika kita mengabulkan permintaan mereka untuk menguasai koloni Arab kita."
 bftb_turkey.47.a: "Mari kita lihat apakah [FROM.GetNameDef] siap untuk memikul tanggung jawab tersebut."
 bftb_turkey.47.b: "Neo-kolonialisme ini tidak dapat dan tidak akan ditoleransi."
 bftb_turkey.48.t: "[FROM.GetAdjective] Percayakan Pertahanan Teluk kepada kami"
 bftb_turkey.48.desc: "Transportasi untuk garnisun dan administrator kami telah dipersiapkan sehingga mereka dapat segera dikirim ke wilayah baru kami di dua teluk Arab. [FROM.GetAdjective] telah mencabut kewenangan mereka atas wilayah tersebut dan telah memberikan kedaulatan atas tanah tersebut kepada kami untuk perlindungan dan pemerintahan."
 bftb_turkey.48.a: "Kami benar-benar kekuatan besar sekarang."
 bftb_turkey.49.t: "[FROM.GetAdjective] Menolak Kami Wilayah Arab Mereka"
 bftb_turkey.49.desc: "Duta Besar [FROM.GetAdjective] menyebut rancangan [ROOT.GetAdjective] di wilayah [FROM.GetAdjective] di Arab 'tidak dapat diterima', dan meminta agar masalah tersebut segera dibatalkan. Pakar pertahanan kami kecewa karena kami tidak diberi hak mengelola wilayah [FROM.GetAdjective] Arab, namun pejabat [FROM.GetAdjective] berpendapat bahwa selama [ROOT.GetNameDef] tetap menjadi bagian dari [FROM.GetFactionName] maka kami tetap mempunyai hak istimewa untuk berlabuh dan bermarkas di wilayah tersebut."
 bftb_turkey.49.a: "Sayangnya."
 bftb_turkey.50.t: "[FROM.GetNameDefCap] Meminta Tank Ringan"
 bftb_turkey.50.desc: "Pejabat dari [FROM.GetNameDef] telah mendekati kami dengan keinginan untuk membeli tank ringan dari inventaris kami. Mengekspresikan kekaguman mereka atas apa yang mereka sebut '[ROOT.GetAdjective] jenius' dan 'keunggulan dalam desain', para pejabat [FROM.GetAdjective] telah menyampaikan kepada kita bahwa [FROM.GetNameDef] harus memiliki baju besi [ROOT.GetAdjective] untuk menjaga kedaulatan mereka sendiri."
 bftb_turkey.50.a: "Kami akan mengirimkan beberapa yang terbaik!"
 bftb_turkey.50.b: "Kirim beberapa kendaraan lapis baja kami yang lebih standar."
 bftb_turkey.50.c: "Mereka mungkin memiliki beberapa model lama kami."
 bftb_turkey.50.d: "[FROM.GetNameDefCap] sama sekali tidak akan mendapatkan apa pun dari kami."
 bftb_turkey.51.t: "[FROM.GetNameDefCap] Mengirimkan Tank Ringan yang Ditingkatkan!"
 bftb_turkey.51.desc: "Kami baru saja menerima kiriman tank [FROM.GetAdjective] langsung dari timbunannya sendiri! Armornya modern dan pengujian awal menunjukkan bahwa kendaraan ini sangat serbaguna. Mereka pasti akan melayani angkatan bersenjata kita dengan baik."
 bftb_turkey.51.a: "Kejutan yang tidak terduga!"
 bftb_turkey.52.t: "[FROM.GetNameDefCap] Mengirim Tank Ringan"
 bftb_turkey.52.desc: "Kami baru saja menerima kiriman tank [FROM.GetAdjective] langsung dari timbunannya sendiri! Armor ringannya sedikit ketinggalan jaman tetapi masih cukup kuat menurut pengujian kualitas kami. Mereka pasti akan melayani angkatan bersenjata kita dengan baik."
 bftb_turkey.52.a: "Sebuah keuntungan besar."
 bftb_turkey.53.t: "[FROM.GetNameDefCap] Hadiah Baju Besi Kedaluwarsa"
 bftb_turkey.53.desc: "Kami baru saja menerima kiriman tank [FROM.GetAdjective] langsung dari timbunannya sendiri! Armornya tidak diragukan lagi sudah ketinggalan zaman, dan [FROM.GetAdjective] kemungkinan besar sudah menghentikan modelnya karena banyak kekurangannya. Bagaimanapun juga, angkatan bersenjata kita akan menemukan kegunaannya... entah bagaimana caranya."
 bftb_turkey.53.a: "Jika hal tersebut cukup baik untuk tahun 1922, maka hal tersebut sudah cukup baik untuk saat ini!"
 bftb_turkey.54.t: "[FROM.GetNameDefCap] Kirimkan Apa Pun kepada Kami"
 bftb_turkey.54.desc: "[FROM.GetAdjective] telah menolak mengirimi kami bahkan sasis dari model tertua mereka. Baju besi [FROM.GetAdjective] tampaknya hanya digunakan untuk [FROM.GetAdjective], dan tokoh-tokoh terkemuka di [FROM.GetNameDef] diduga menyebutkan masalah keamanan nasional sebagai alasan untuk tidak memberikan baju besi apa pun kepada kami."
 bftb_turkey.54.a: "Tank-tank itu mungkin akan rusak."
 bftb_turkey.55.t: "Konsesi Chester"
 bftb_turkey.55.desc: "Pada tahun 1923, Republik Turki yang baru didirikan meratifikasi dan menyetujui undang-undang yang mengizinkan kami untuk mengembangkan ladang minyak dan jalur kereta api [FROM.GetNameDef]. Senat Amerika Serikat, dengan mempertimbangkan dampak Depresi Besar terhadap perekonomian Amerika, memutuskan untuk tidak meratifikasi perjanjian tersebut. [FROM.GetNameDef] telah membatalkan pembatalan perjanjian mereka, dan meminta kami sekali lagi untuk memenuhi ketentuan konsesi yang awalnya kami buat.\n\nTidak dapat disangkal bahwa secara ekonomi kita berada dalam keadaan yang jauh lebih aman dibandingkan pada tahun 1923, dan akan menjadi keuntungan besar jika [FROM.GetNameDef] selaras dengan kita secara ideologis dan militer. Namun, perang sedang terjadi di seluruh dunia dan bahkan dari posisi kita yang kuat, kita harus hemat dalam menggunakan sumber daya kita. Ketersediaan minyak di [FROM.GetNameDef] mungkin di masa depan akan sangat berharga sebagai pengaruh terhadap [SOV.GetNameDef], namun dalam jangka pendek kita juga harus mempertimbangkan kemungkinan bagaimana minyak bumi yang digali itu bisa jatuh ke tangan musuh kita. Mungkin bijaksana untuk memanfaatkan kebutuhan [FROM.GetAdjective] akan bantuan kita untuk mencapai tujuan kita sendiri. [FROM.GetNameDef] banyak mengandung kromium, sedangkan bangsa kita sayangnya tidak. Pilihan ada di tangan kita."
 bftb_turkey.55.a: "Kami akan membantu semua sahabat demokrasi."
 bftb_turkey.55.b: "Kami akan membantu mereka... dengan syarat."
 bftb_turkey.56.t: "[FROM.GetNameDefCap] Memberikan Konsesi Tanpa Syarat"
 bftb_turkey.56.desc: "[FROM.GetNameDefCap] telah setuju untuk memenuhi komitmen yang mereka janjikan kepada kami lebih dari satu dekade yang lalu tanpa meminta kompensasi. Mereka telah menggunakan teknologi unggul dan sumber daya industri yang luas untuk mengekstraksi minyak bumi di [350.GetName] yang sebelumnya tidak dapat kami gali dengan andal. [FROM.GetAdjective] juga telah menyerahkan kepada kami beberapa industri yang mereka gunakan untuk mengekstraksi minyak guna memenuhi aspek-aspek lain dari konsesi untuk digunakan kembali sesuai kebijakan kami sendiri.\n\nSebagai bentuk tambahan persahabatan, [FROM.GetAdjective] telah mewariskan kepada kami beberapa teknik dan peralatan yang mereka gunakan dalam proses ekstraksi sehingga kami dapat memanfaatkan sumber daya alam yang terdapat di seluruh negara kami dengan lebih baik."
 bftb_turkey.56.a: "[FROM.GetAdjective]s benar-benar yang terbaik."
 bftb_turkey.57.t: "[FROM.GetAdjective] Menetapkan Persyaratan untuk Konsesi"
 bftb_turkey.57.desc: "[FROM.GetNameDefCap] telah setuju untuk memenuhi komitmen yang mereka janjikan kepada kami lebih dari satu dekade yang lalu, namun dengan imbalan kompensasi. Mereka bersedia menggunakan teknologi unggul dan sumber daya industri yang luas untuk mengekstraksi minyak bumi di [350.GetName] yang selama ini tidak dapat kami gali dengan andal, namun sebagai gantinya [FROM.GetAdjective] menginginkan sumber daya eksklusif untuk hak di [343.GetName]. Untuk mempermanis kesepakatan ini, [FROM.GetAdjective] telah menyatakan kesediaannya untuk mengajari kami beberapa teknik ekstraksi canggih mereka dan memberi kami skema beberapa peralatan penggalian mereka yang lebih rumit.\n\nMeminta konsesi seharusnya merupakan suatu penghinaan, namun hal ini mungkin saja sudah melampaui batas. Bangsa kita dimaksudkan untuk mewakili buah dari anti-imperialisme dan anti-kolonialisme, dan jika kita menyetujui tuntutan [FROM.GetAdjective] maka kita akan mengkhianati nilai-nilai kita. Namun, mampukah kita menolak keuntungan yang [FROM.GetNameDef] tawarkan kepada kita?"
 bftb_turkey.57.a: "Baiklah, berikan apa yang diinginkan para bajingan imperialis."
 bftb_turkey.57.b: "Kami tidak akan pernah hidup di bawah kendali [FROM.GetAdjective]!"
 bftb_turkey.58.t: "[FROM.GetNameDefCap] Penuhi Permintaan Kami"
 bftb_turkey.58.desc: "Pemerintah [FROM.GetAdjective] telah menyetujui setiap tuntutan kami sebagai imbalan atas bantuan kami. Kromium sudah mulai masuk ke pelabuhan kami dari [343.GetName], dan lebih baik lagi kami telah mempelajari beberapa hal dalam upaya kami mengekstraksi minyak di [FROM.GetName] bagian timur."
 bftb_turkey.58.a: "Senang rasanya menjadi [FROM.GetAdjective]."
 bftb_turkey.59.t: "[FROM.GetNameDefCap] Tolak Tuntutan Kami!"
 bftb_turkey.59.desc: "Pemerintah [FROM.GetAdjective] telah menolak persyaratan yang sangat adil yang kami tetapkan sebagai imbalan atas bantuan kami. Jika pemerintah [FROM.GetAdjective] mau memberikan bagian yang adil, maka semua orang bisa saja menjadi pemenang. Sebaliknya, mereka hanya perlu menunggu beberapa tahun lagi sebelum bisa mendapatkan emas hitam tersebut."
 bftb_turkey.59.a: "Kami [ROOT.GetNameDef], kami masih berjalan sebagai pemenang."
 bftb_turkey.60.t: "[FROM.GetName] Menekan Isu Hatay"
 bftb_turkey.60.desc: "[FROM.GetLeader] telah menulis surat dengan kata-kata tegas yang menuntut agar penduduk Turki di negara bagian Hatay, Suriah, diberikan hak demokratis untuk melakukan referendum, sehingga rakyat Hatay dapat memutuskan apakah mereka ingin bergabung dengan [FROM.GetNameDef] atau tetap menjadi bagian dari [ROOT.GetNameDef] tanpa batas waktu. Angkatan bersenjata kami telah mendeteksi aktivitas yang melanggar hukum di perbatasan [ROOT.GetAdjective]-[FROM.GetAdjective], dengan warga negara [FROM.GetAdjective] melintasi perbatasan kami dan menyebabkan keributan di provinsi Hatay. Jelas bahwa [FROM.GetNameDef] bermaksud mencurangi hasil referendum untuk memastikan kemenangan [FROM.GetAdjective], namun mungkin menyerahkan provinsi Hatay kepada [FROM.GetNameDef] adalah tindakan yang paling bijaksana. [FROM.GetNameDef] yang berperang di perbatasan kita bukanlah skenario yang ideal."
 bftb_turkey.60.a: "Pilihan apa yang kita punya?"
 bftb_turkey.60.b: "Jika mereka menginginkan Hatay, mereka bisa datang dan mengambil jalan yang sulit."
 bftb_turkey.61.t: "[FROM.GetNameDef] Menyerahkan Kedaulatan Hatay kepada Kami"
 bftb_turkey.61.desc: "[ROOT.GetLeader] memberikan pidato kecil di Antakya menyambut warga Hatay ke [ROOT.GetNameDef], dan mengucapkan terima kasih kepada [FROM.GetLeader] dari [FROM.GetNameDef] karena menghormati kemauan demokratis masyarakat Hatay. Meskipun tindakan ini mendapat kemarahan dari banyak pejabat Suriah dari berbagai spektrum politik, suasana umum di Hatay dan [ROOT.GetNameDef] secara keseluruhan adalah kepuasan, dan banyak orang [ROOT.GetAdjective] melakukan perjalanan dari rumah mereka ke Hatay untuk menahbiskan provinsi terbaru [ROOT.GetNameDef] dengan perayaan dan pertukaran hadiah. [FROM.GetLeader] selama ini bungkam mengenai masalah ini, namun sumber yang dekat dengan pemimpin [FROM.GetAdjective] mengatakan bahwa [FROM.GetAdjective] yakin bahwa hal ini hanya bersifat sementara, dan bahwa Hatay akan kembali dikuasai oleh mereka di masa depan."
 bftb_turkey.61.a: "Kami menyambut Anda kembali, saudara-saudara."
 bftb_turkey.62.t: "[FROM.GetName] Mempertahankan Kontrol Kuat Atas Hatay"
 bftb_turkey.62.desc: "[ROOT.GetLeader] memimpin unjuk rasa yang berapi-api di Gaziantep, di mana dia mengutuk penindasan terhadap Turki di luar negeri oleh [FROM.GetNameDef]. Masyarakat [ROOT.GetAdjective] menjadi gempar, dan para penasihat mengatakan ada antusiasme di antara masyarakat [ROOT.GetAdjective] untuk menggunakan perang sebagai sarana untuk memperbaiki keadaan yang tidak adil ini. Bahwa [FROM.GetNameDef] berpikir bahwa mereka dapat menentang keinginan kita adalah kebodohan belaka - [ROOT.GetNameDef] tidak akan pernah membiarkan dirinya ditindas oleh kekuatan yang lebih kecil."
 bftb_turkey.62.a: "[FROM.GetNameDef] harus binasa."
 bftb_turkey.63.t: "[FROM.GetNameDefCap] Mengundang Kami ke [FROM.GetFactionName]"
 bftb_turkey.63.desc: "[FROM.GetLeader] bertemu dengan [ROOT.GetLeader] beberapa hari yang lalu untuk merundingkan aliansi pan-Mediterania yang komprehensif dengan sikap bersatu dalam krisis yang memerlukan intervensi militer. Ada argumen bahwa [FROM.GetNameDef] secara sukarela terikat dengan kita dalam sebuah aliansi mungkin akan memberikan lebih banyak legitimasi terhadap tujuan regional kita, bahkan jika itu berarti kita harus menghindari dukungan dari negara-negara yang lebih besar. Kita juga harus mempertimbangkan bahwa, tidak seperti kita, [FROM.GetNameDef] sebenarnya memiliki reputasi yang cukup positif di antara negara-negara Balkan dan Mediterania. Mereka mungkin dapat memanfaatkan reputasi baik tersebut untuk secara diplomatis memenangkan dukungan dari negara-negara yang mungkin tidak ingin berurusan dengan kita.\n\nKita berada di persimpangan jalan: apakah kita menggunakan ranting zaitun yang direntangkan kepada kita oleh [FROM.GetNameDef] dan menggunakan pena mereka untuk mengasah pedang kita melawan kekuatan besar lainnya, atau haruskah kita menjangkau Teuton yang hina dan menebang semua kekuatan kecil yang menjangkau kita seperti memangkas rumput liar di taman? Kita sendiri yang mempunyai kekuasaan untuk menentukan nasib negara-negara Balkan - kita dapat menyelamatkan mereka dari hegemoni [GER.GetAdjective] dan [SOV.GetAdjective], atau kita dapat membantu negara-negara ini dan mempercepat kehancuran negara-negara tetangga kita. Pilihan ada di tangan kita."
 bftb_turkey.63.a: "Kita masih bisa menebus diri kita sendiri dengan menyelamatkan orang lain."
 bftb_turkey.63.b: "Dunia ini dingin dan tanpa ampun, begitu pula kita."
 bftb_turkey.64.t: "[FROM.GetNameDefCap] Bergabung [ROOT.GetFactionName]"
 bftb_turkey.64.desc: "[FROM.GetLeader] secara bombastis mengumumkan kepada bangsanya bahwa [FROM.GetNameDef] jiwa dan nasib kini dibagikan dengan [ROOT.GetNameDef] dalam sebuah upacara yang luar biasa dan meriah. [ROOT.GetLeader] mengumumkan hal serupa, namun dengan cara yang jauh lebih terukur.\n\nAdalah harapan dari para pejabat [ROOT.GetAdjective] bahwa dengan menyelaraskan [FROM.GetNameDef] diharapkan kecenderungan mereka yang lebih ekspansionis dapat dikendalikan, dan status kekuatan besar mereka malah digunakan untuk melindungi negara-negara kecil di Mediterania dari hegemoni yang berusaha melahap mereka seluruhnya."
 bftb_turkey.64.a: "Kita harus segera mengajak negara-negara lain untuk ikut serta dalam perjanjian ini."
 bftb_turkey.65.t: "[FROM.GetNameDefCap] Menolak Keanggotaan di [ROOT.GetFactionName]"
 bftb_turkey.65.desc: "Kami telah menerima kabar bahwa [FROM.GetNameDef] tidak akan bergabung dengan [ROOT.GetFactionName]. Para pejabat [ROOT.GetAdjective] kecewa dan sangat khawatir mengenai dampak hal ini terhadap masa depan Mediterania. [ROOT.GetLeader] secara pribadi telah mendesak para pejabat pemerintah untuk meningkatkan proses penandatanganan lebih banyak anggota ke dalam aliansi sehingga sebuah blok yang kuat dapat dibentuk untuk melawan kemungkinan iredentisme [FROM.GetAdjective]."
 bftb_turkey.65.a: "Kita harus segera mengajak negara-negara lain untuk ikut serta dalam perjanjian ini."
 bftb_turkey.66.t: "[FROM.GetNameDefCap] Mengusulkan Rencana Pembagian [GRE.GetNameDef]"
 bftb_turkey.66.desc: "[FROM.GetNameDefCap] telah menyarankan bahwa meskipun tindakan tersebut disesalkan, demi keamanan nasional wilayah [GRE.GetNameDef] harus dihancurkan. Para pejabat kami dengan antusias dan sepenuh hati menyetujui pendapat sekutu [FROM.GetAdjective] kami, sambil mengingatkan mereka bahwa ini adalah posisi resmi kami sejak awal.\n\n[FROM.GetNameDefCap] menyarankan pembagian [GRE.GetNameDef] berdasarkan premis geografis: kita akan dipastikan [185.GetName], [186.GetName], dan [182.GetName] sehingga mengamankan dominasi kita atas Mediterania Timur dan Laut Ionia. [FROM.GetNameDefCap] akan mengambil alih negara bagian [GRE.GetAdjective] yang tersisa, yang akan menjamin kendali [FROM.GetAdjective] atas Laut Aegea, yang sudah berbatasan dengan banyak negara bagian mereka.\n\nPerjanjian ini sebagian besar adil – setidaknya lebih adil daripada yang bisa kita harapkan dalam perampasan tanah yang bebas untuk semua. Namun, kami telah lama bermimpi untuk menambahkan [47.Capital.GetName] sebagai permata mahkota kerajaan kami dan rencana ini pasti akan mengakhiri ambisi tersebut di masa mendatang. Apakah kita bersedia menyisihkan hadiah [47.Capital.GetName] untuk perdamaian di Mediterania?"
 bftb_turkey.66.a: "Kesepakatan yang adil dan disepakati tentang masa depan [GRE.GetNameDef]."
 bftb_turkey.66.b: "Kita harus memiliki semuanya!"
 bftb_turkey.67.t: "Kudeta Lapangan Emas"
 bftb_turkey.67.desc: "Berita mengejutkan dari [676.GetName], ketika mantan perdana menteri Rashid Ali al-Gaylani berusaha memulai kudeta terhadap pemerintah [ROOT.GetLeader]. Al-Gaylani mendapat dukungan dari sebagian besar militer dan bahkan beberapa dukungan rakyat.\n\nCampur tangan asing diyakini memainkan peran penting dalam mengatur dan memasok senjata kepada para pengkhianat Lapangan Emas. Dari semua aktor negara yang terlibat, diyakini bahwa [FROM.GetNameDef] memainkan peran paling signifikan dalam mendukung upaya kudeta fasis.\n\nLapangan Emas berdiri teguh pada platform untuk menyingkirkan imperialis [ENG.GetAdjective] secara paksa dengan meminta bantuan [GER.GetNameDef], dan banyak dari rakyat kita menganggap ini sebagai posisi yang sangat terpuji dalam masalah ini. Mungkin Arab yang merdeka hanya bisa dicapai melalui fasisme..."
 bftb_turkey.67.a: "Mashallah, kami berjuang demi jiwa Irak melawan fasisme!"
 bftb_turkey.67.b: "Hanya melalui fasisme pembebasan kita mungkin terjadi."
 bftb_turkey.67.c: "Sebarkan hama fasis."
 bftb_turkey.68.t: "Perang Saudara [IRQ.GetAdjective] Dimulai"
 bftb_turkey.68.desc: "Upaya kami untuk menghasut kudeta fasis di [IRQ.GetNameDef] tampaknya membuahkan hasil yang besar. Kaum fasis [IRQ.GetAdjective] sekarang sedang berjuang melawan pemerintah yang dulu berkuasa untuk menguasai seluruh negeri, dan menang atau kalah, kita akan berada dalam posisi utama untuk membangun kendali yang kuat atas wilayah tersebut."
 bftb_turkey.68.a: "Untuk saat ini, kami duduk dan menunggu."
 bftb_turkey.69.t: "[IRQ.GetAdjective] Fasis Menang"
 bftb_turkey.69.desc: "Kaum fasis [IRQ.GetAdjective] telah selesai merampas kantong terakhir loyalis [IRQ.GetAdjective], seperti yang kita perkirakan. Mereka akan terlalu lemah untuk melawan kita saat kita menyerbu dan mengambil alih aparat negara mereka."
 bftb_turkey.69.a: "Betapa menyenangkannya Machiavellian!"
 bftb_turkey.70.t: "[IRQ.GetAdjective] Fasis Gagal"
 bftb_turkey.70.desc: "Kaum fasis [IRQ.GetAdjective] telah gagal mengusir loyalis [IRQ.GetAdjective], dan malah dihancurkan oleh tentara [IRQ.GetAdjective]. Ini benar-benar sebuah kebiadaban, namun seperti yang direncanakan, para ahli strategi kita percaya bahwa [IRQ.GetNameDef] sekarang akan terlalu lemah untuk melawan kita ketika pasukan kita menyerbu masuk dan mengambil kendali atas aparatur negara mereka."
 bftb_turkey.70.a: "Pertandingan sudah dicurangi sejak awal."
 bftb_turkey.71.t: "[IRQ.GetAdjective] Fasis Merebut Kendali di [IRQ.GetNameDef]"
 bftb_turkey.71.desc: "Kaum fasis [IRQ.GetAdjective] telah berhasil menggulingkan pemerintahan yang berkuasa sebelumnya dan mengambil kendali atas seluruh negeri. Kaum fasis [IRQ.GetAdjective] telah memperjelas bahwa salah satu tujuan utama mereka adalah menghilangkan pengaruh [ENG.GetAdjective] Arab dengan cara apa pun, dan mereka percaya bahwa intervensi [ROOT.GetAdjective] adalah cara terbaik untuk mencapai hal tersebut."
 bftb_turkey.71.a: "[IRQ.GetName]? Hampir tidak menjadi perhatian kami."
 bftb_turkey.71.b: "Mereka akan mendapat dukungan penuh dari kami."
 bftb_turkey.71.c: "Mereka telah membuktikan diri mereka layak [ROOT.GetFactionName]."
 bftb_turkey.72.t: "[FROM.GetNameDefCap] Mendukung Kami!"
 bftb_turkey.72.desc: "[FROM.GetAdjective] telah memutuskan untuk menyatakan dukungan mereka kepada pemerintah kita. Deklarasi tersebut sangat penting dalam menegakkan kedaulatan kita, dan dalam melegitimasi peran kita sebagai bangsa yang secara fundamental menentang imperialisme [ENG.GetAdjective]."
 bftb_turkey.72.a: "Keberanian mereka patut dipuji dan diapresiasi!"
 bftb_turkey.73.t: "[IRQ.GetAdjective] Fasis Merebut Kendali di [IRQ.GetNameDef]"
 bftb_turkey.73.desc: "Kaum fasis [IRQ.GetAdjective] telah berhasil menggulingkan pemerintahan yang berkuasa sebelumnya dan mengambil kendali atas seluruh negeri. Kaum fasis [IRQ.GetAdjective] telah memperjelas bahwa salah satu tujuan utama mereka adalah menghilangkan pengaruh [ENG.GetAdjective] Arab dengan cara apa pun, dan mereka percaya bahwa intervensi [ROOT.GetAdjective] adalah cara terbaik untuk mencapai hal tersebut."
 bftb_turkey.73.a: "[IRQ.GetName] tidak layak untuk kita perhatikan."
 bftb_turkey.73.b: "Ya... kami memang memproklamirkan diri kami sebagai Pedang Islam..."
 bftb_turkey.74.t: "[FROM.GetNameDefCap] Mendukung Kami!"
 bftb_turkey.74.desc: "[FROM.GetAdjective] telah memutuskan untuk menyatakan dukungan mereka kepada pemerintah kita. Deklarasi tersebut sangat penting dalam menegakkan kedaulatan kita, dan dalam melegitimasi peran kita sebagai bangsa yang secara fundamental menentang imperialisme [ENG.GetAdjective]."
 bftb_turkey.74.a: "Dengan [ITA.GetAdjective] di pihak kita, kita tidak bisa gagal!"
 bftb_turkey.75.t: "[IRQ.GetAdjective] Menasionalisasikan Minyak Mereka!"
 bftb_turkey.75.desc: "Berita mengejutkan datang dari [IRQ.GetNameDef], ketika [ROOT.GetAdjective] pejabat yang mengelola cadangan minyak negara dikawal ke perbatasan [IRQ.GetAdjective] di bawah penjagaan bersenjata dan dipaksa keluar! Yang juga meresahkan adalah rumor bahwa pemerintahan baru [IRQ.GetAdjective] berencana mengundang kehadiran militer [GER.GetAdjective] ke wilayahnya.\n\nSeolah-olah itu belum cukup, intel juga menyatakan bahwa ini semua telah didalangi oleh [FROM.GetNameDef] untuk membantu [GER.GetFactionName]! Kita harus memutuskan bagaimana langkah selanjutnya: [IRQ.GetAdjective] mungkin mengambil sikap yang lebih netral jika kita menghormati keputusan mereka untuk menyita minyak, namun di sisi lain kita harus memutuskan apakah kita mampu menerima kemungkinan minyak tersebut sampai ke tangan [GER.GetAdjective]."
 bftb_turkey.75.a: "Mereka adalah sesama penjaga api suci."
 bftb_turkey.75.b: "Minyak itu tidak boleh jatuh ke tangan kaum fasis!"
 bftb_turkey.75.c: "Hak ilahi raja harus dilindungi."
 bftb_turkey.75.d: "Ini tidak akan berakhir dengan cara lain."
 bftb_turkey.75.e: "Begitu pula dengan hak mereka sebagai bangsa yang berdaulat."
 bftb_turkey.76.t: "Hasil [ENG.GetAdjective] Kepada Kami!"
 bftb_turkey.76.desc: "[FROM.GetAdjective] telah menyerahkan seluruh kendali atas ladang minyak kepada kami. Kedaulatan kami ada di tangan kami sendiri: kami telah mengalahkan kaum imperialis dengan permainan mereka sendiri!"
 bftb_turkey.76.a: "Allahu Akbar, puji [ROOT.GetLeader]!"
 bftb_turkey.77.t: "Aliansi Anglo-[GER.GetAdjective]"
 bftb_turkey.77.desc: "Kita dihadapkan pada takdir yang mengerikan dan kejam: [ENG.GetAdjective] dan [GER.GetAdjective] bersekutu satu sama lain! Kami membutuhkan dukungan [GER.GetFactionName] yang penting, tetapi anjing [ENG.GetAdjective] yang pengkhianat telah mengalahkan kami sampai habis!\n\nIni memang hari kelam dalam sejarah [ROOT.GetAdjective]. Kami berdiri sendiri, tanpa seorang pun yang mendukung kami kecuali [TUR.GetAdjective] - yang hampir pasti akan gemetar ketakutan menghadapi upaya bersama [ENG.GetAdjective]-[GER.GetAdjective] untuk menggagalkan kami. Bisakah kita menyalahkan mereka karena melakukan hal tersebut? Siapa yang waras yang akan melawan duo yang begitu kuat? Beranikah kita mencobanya?"
 bftb_turkey.77.a: "Insya Allah, bangsa Eropa akan terkapar di hadapan pedang."
 bftb_turkey.77.b: "Dunia gila macam apa yang kita tinggali!?"
 bftb_turkey.79.t: "[FROM.GetNameDefCap] Meminta Pembaruan Pakta Non-Agresi"
 bftb_turkey.79.desc: "Kami secara historis menikmati hubungan yang sangat bersahabat dengan [FROM.GetNameDef] karena kami menganggap satu sama lain sebagai anti-imperialis yang berpikiran sama, namun hubungan ini semakin memburuk selama beberapa tahun terakhir.\n\nDalam upaya untuk mencairkan hubungan antara kedua negara kita, [FROM.GetLeader] telah menyarankan pembaruan pakta non-agresi yang telah kita tandatangani beberapa tahun yang lalu. Kita harus melihat ranting zaitun ini sebagai tanda bahwa [FROM.GetNameDef] bisa terbuka untuk kerja sama yang lebih dalam dalam waktu dekat, namun [ROOT.GetLeader] juga tidak merahasiakan keinginannya terhadap Selat Turki. Kita harus memutuskan pilihan mana yang lebih disukai: sekutu [FROM.GetAdjective] yang bersedia, atau pengikut [FROM.GetAdjective]."
 bftb_turkey.79.a: "Hubungan persahabatan dengan [FROM.GetNameDef] hanya dapat membuahkan hasil yang positif."
 bftb_turkey.79.b: "Sayangnya, kami punya rencana baru untuk mereka."
 bftb_turkey.80.t: "[FROM.GetAdjective] Setuju untuk Memperbarui Pakta Non-Agresi"
 bftb_turkey.80.desc: "Kami dengan senang hati melaporkan bahwa terdapat berita positif dari [FROM.GetNameDef] karena kami telah menerima kabar bahwa tanggapan [FROM.GetAdjective] terhadap saran kami mengenai pakta non-agresi yang diperbarui sangat antusias. Para pejabat kami yakin kami dapat menyelesaikan rincian akhir perjanjian tersebut sebelum akhir minggu ini."
 bftb_turkey.80.a: "Hari yang menyenangkan untuk perdamaian."
 bftb_turkey.81.t: "[FROM.GetAdjective] Menolak Rencana Pembaruan Pakta Non-Agresi"
 bftb_turkey.81.desc: "Kami telah menerima kabar bahwa [FROM.GetNameDef] tidak berniat memperbarui pakta non-agresi kami yang lama. Sebaliknya, para pejabat [FROM.GetAdjective] telah membatalkan perjanjian kami sebelumnya yang sepenuhnya menghilangkan ilusi bahwa hubungan antara kami dan [FROM.GetNameDef] tidak akan hangat di tahun-tahun mendatang."
 bftb_turkey.81.a: "Ini hanya bisa berarti sesuatu yang buruk."
 bftb_turkey.82.t: "Larangan terhadap Partai Komunis Turki Dicabut"
 bftb_turkey.82.desc: "Pejabat Partai Komunis Turki yang diasingkan telah diterima kembali di [ROOT.GetNameDef] dengan segala tuduhan terhadap mereka diampuni oleh [ROOT.GetLeader]. Pengurus partai TKP disambut kembali dengan hangat oleh beberapa anggota pemerintah namun dijauhi oleh anggota pemerintahan Kemalis yang lebih ortodoks.\n\nMeskipun [ROOT.GetLeader] secara pribadi tidak menerima kembali pejabat yang sebelumnya diasingkan, undangan terbuka untuk menjadi anggota pemerintahan yang berpartisipasi telah dikeluarkan. Apakah ada pejabat TKP yang akan menjabat di kabinet pemerintah, sepenuhnya merupakan keputusan pemerintah sendiri."
 bftb_turkey.82.a: "Kami tidak terlalu peduli dengan apa yang mereka pilih."
 bftb_turkey.83.t: "Kembalinya Partai Komunis Turki"
 bftb_turkey.83.desc: "Pejabat Partai Komunis Turki yang diasingkan telah diterima kembali di [ROOT.GetNameDef] dengan segala tuduhan terhadap mereka diampuni oleh [ROOT.GetLeader]. Pengurus partai TKP disambut kembali dengan hangat oleh beberapa anggota pemerintah namun dijauhi oleh anggota pemerintahan Kemalis yang lebih ortodoks.\n\nSaat itu terjadi pada acara penyambutan resmi yang diselenggarakan oleh [ROOT.GetLeader] di mana kudeta tak terduga terjadi. Şefik Hüsnü naik ke panggung dan mengumumkan pembubaran rezim Kemalis borjuis dan revisionis demi gaya pemerintahan yang lebih mirip dengan sistem yang digunakan di Moskow. Pejabat dan petugas Kemalis di seluruh negeri ditangkap dan ditangkap dalam hitungan jam, dan jika laporan dapat dipercaya, ada pelaku [SOV.GetAdjective] yang terlibat dalam keseluruhan proses."
 bftb_turkey.83.a: "Tunggu sebentar-"
 bftb_turkey.84.t: "[FROM.GetNameDefCap] Menuntut Ketaatan Kita"
 bftb_turkey.84.desc: "Ular jahat di [FROM.GetNameDef] telah mengirimkan permintaan sepihak kepada kami untuk melucuti senjata dan mengizinkan kehadiran tentara [FROM.GetAdjective] di wilayah kami sehingga mereka dapat 'menjamin keselamatan dan hak-hak pekerja [ROOT.GetAdjective].' Motif di balik tuntutan konyol ini jelas: [FROM.GetNameDef] berupaya untuk menegaskan kendali penuh atas urusan dan kedaulatan kita.\n\nKami bukanlah kekuatan menengah yang tidak penting dalam urusan dunia, kami adalah [ROOT.GetNameDef]! Kita tidak bisa membiarkan diri kita dipermainkan seperti ini oleh kekuatan jahat yang terang-terangan memandang kita hanya sebagai korban yang menunggu. Kita harus mencari sekutu; tentunya harus ada setidaknya satu negara yang akan mendukung kita melawan [FROM.GetAdjective] penghasutan perang! Lalu, apakah kerugian yang mungkin timbul dalam nyawa [ROOT.GetAdjective] benar-benar sepadan dengan risikonya?"
 bftb_turkey.84.a: "[SOV.GetNameDefCap] akan memediasi masalah ini secara adil."
 bftb_turkey.84.b: "Kami secara demokratis memilih... untuk meminta bantuan orang lain!"
 bftb_turkey.84.c: "Tentunya seseorang akan menyelamatkan kita dari sampah Marxis ini!"
 bftb_turkey.84.d: "Teman kita akan menjamin keselamatan kita."
 bftb_turkey.84.e: "[ROOT.GetAdjective] nyawa didahulukan dari hal lainnya."
 bftb_turkey.85.t: "[FROM.GetNameDefCap] Mengupayakan Mediasi Melawan [TUR.GetNameDefCap] Agresi"
 bftb_turkey.85.desc: "Pejabat dari [FROM.GetNameDefCap] telah menghubungi kami dengan harapan kami akan memberikan mereka perlindungan dalam menghadapi agresi [TUR.GetAdjective]. [FROM.GetAdjective] telah memberikan portofolio yang cukup luas yang menjelaskan mengapa hilangnya [FROM.GetNameDef] ke wilayah pengaruh [TUR.GetAdjective] akan sangat merugikan keseimbangan benua, dan dengan penuh semangat membela hak mereka untuk berpemerintahan sendiri dengan harapan kami memutuskan untuk menawarkan bantuan kepada mereka."
 bftb_turkey.85.a: "[TUR.GetNameDefCap] mencoba memonopoli komunisme!"
 bftb_turkey.85.b: "[TUR.GetNameDefCap] membahayakan keseimbangan benua!"
 bftb_turkey.85.c: "The Reds tidak bisa dibiarkan mengamuk."
 bftb_turkey.85.d: "[FROM.GetAdjective] konflik bukan urusan kami."
 bftb_turkey.86.t: "[FROM.GetNameDefCap] Menjamin Kemandirian Kita"
 bftb_turkey.86.desc: "Kami telah menerima kabar bahwa [FROM.GetNameDef] bermaksud menjamin kemandirian kami dalam menghadapi agresi [TUR.GetAdjective]. Ini adalah kemenangan diplomatik yang besar bagi kami, dan mudah-mudahan akan membuat [TUR.GetNameDef] mempertimbangkan kembali tuntutan besar yang mereka ajukan kepada kami."
 bftb_turkey.86.a: "Teman sejati [ROOT.GetNameDef]."
 bftb_turkey.87.t: "[BUL.GetNameDefCap] Menerima Dukungan dari Luar"
 bftb_turkey.87.desc: "Para [BUL.GetAdjective] yang pengecut telah menemukan orang lain untuk mendukung mereka dalam upaya mereka menuju kemerdekaan! Ini adalah komplikasi yang tentunya ingin kita hindari. Kita harus memutuskan apakah kita bersedia untuk terus maju dan menggunakan kekuatan untuk menegaskan tuntutan kita, atau apakah sudah waktunya untuk mundur dan mencegah perang yang lebih besar."
 bftb_turkey.87.a: "Kami terus maju."
 bftb_turkey.87.b: "Ini adalah kemunduran yang menyakitkan."
 bftb_turkey.88.t: "[FROM.GetNameDefCap] Mundur!"
 bftb_turkey.88.desc: "Kegembiraan dapat digunakan untuk menggambarkan suasana hati pemerintah kita secara umum karena kita baru saja menerima kabar bahwa pemerintah [FROM.GetAdjective] dan angkatan bersenjata telah mundur dan sekarang mendesak dilakukannya deeskalasi. Ini merupakan kemenangan yang luar biasa baik bagi negara [ROOT.GetAdjective] maupun rakyat [ROOT.GetAdjective].."
 bftb_turkey.88.a: "Kami menang!"
 bftb_turkey.89.t: "Kami Tidak Menerima Dukungan Dari Negara Mana Pun"
 bftb_turkey.89.desc: "[ROOT.GetLeader] tidak dapat dihibur setelah mendengar berita buruk bahwa tidak ada satu negara pun yang akan mendukung [ROOT.GetNameDef] melawan agresi [TUR.GetAdjective]. Sikap acuh tak acuh dari kekuatan lain memberi kita ultimatum yang mengerikan: berdiri dan bertarung, atau menyerah dan menyelamatkan nyawa."
 bftb_turkey.89.a: "Kami tidak punya pilihan, kami harus menyerah."
 bftb_turkey.89.b: "Kami tidak akan menyerah tanpa perlawanan!"
 bftb_turkey.90.t: "[BUL.GetNameDefCap] Menyerah Kepada Kami"
 bftb_turkey.90.desc: "Kita selangkah lebih dekat menuju revolusi sedunia dengan berita bahwa pihak berwenang [FROM.GetAdjective] telah mundur dan menyerahkan wewenang kepada komplotan rahasia baru yang terdiri dari para menteri komunis yang dipilih langsung oleh pejabat partai kita sendiri untuk memimpin [FROM.GetNameDef]. Memiliki kendali atas tentara dan industri [FROM.GetAdjective] menempatkan kita pada posisi kekuasaan yang lebih besar di kawasan ini dan di Eropa."
 bftb_turkey.90.a: "Pembebasan mereka kini telah selesai."
 bftb_turkey.91.t: "[BUL.GetNameDefCap] Berdiri Menantang"
 bftb_turkey.91.desc: "Kami telah menerima laporan tak terduga bahwa [FROM.GetNameDef] menentang tuntutan kami yang masuk akal. Pemerintah [FROM.GetAdjective] bisa saja memilih jalan yang paling sedikit perlawanannya, namun sebaliknya mereka memutuskan untuk mengambil jalan yang penuh penderitaan."
 bftb_turkey.91.a: "Lalu kita akan merendahkan mereka."
 bftb_turkey.92.t: "[FROM.GetName] Menandatangani Pakta Saadabad"
 bftb_turkey.92.desc: "[FROM.GetLeader] sangat antusias ketika kami menerima proposal perjanjian persahabatan dan perjanjian non-agresi, dan tidak membuang waktu untuk menghubungi kami kembali dengan tanda tangan mereka pada perjanjian kami. Dengan persetujuan mereka, kita selangkah lebih dekat untuk mencapai perdamaian di dalam negeri dan perdamaian di dunia!"
 bftb_turkey.92.a: "Anda akan selalu menjadi teman baik bagi [ROOT.GetNameDef]."
 bftb_turkey.93.t: "[FROM.GetName] Menolak Pakta Saadabad!"
 bftb_turkey.93.desc: "[FROM.GetLeader] menulis surat bertele-tele kepada [ROOT.GetLeader] yang memberitahukan mereka bahwa tawaran perjanjian persahabatan dan pakta non-agresi tidak sebanding dengan kertas dan tinta yang digunakan untuk membuat perjanjian tersebut. [FROM.GetLeader]_ selanjutnya menulis bahwa aliansi formal antara [FROM.GetNameDef] dan [ROOT.GetNameDef] hanya membuang-buang waktu saja, dan mereka lebih memilih untuk dikecualikan dari skema [ROOT.GetAdjective] di masa depan mulai sekarang."
 bftb_turkey.93.a: "...kamu bisa saja mengatakan 'tidak'."
 bftb_turkey.94.t: "Perekonomian Runtuh"
 bftb_turkey.94.desc: "[ROOT.GetAdjective] para ekonom berada dalam kepanikan yang luar biasa ketika nilai mata uang negara tersebut anjlok dan negara kita dilanda gejala depresi. Merupakan sebuah tragedi yang mengerikan bahwa negara kita, yang dengan begitu ahlinya dapat menghindari dampak terburuk dari Depresi Besar, kini berada dalam tekanan ekonomi yang sedemikian besar ketika negara-negara lain di dunia mulai terbebas dari kesengsaraan ekonomi mereka.\n\nKepercayaan pada lembaga-lembaga publik telah jatuh ke titik terendah dalam sejarah, dan masyarakat luas menyadari bahwa pemerintahan [ROOT.GetAdjective] saat ini adalah pihak yang harus disalahkan atas penderitaan negara ini."
 bftb_turkey.94.a: "Bangsa ini berdarah karena keserakahan kita..."
 bftb_turkey.95.t: "Perwira Ottoman Menawarkan Kesempatan untuk Memulihkan Kesultanan"
 bftb_turkey.95.desc: "Kami telah menerima tawaran dari beberapa individu yang berpikiran sama yang dengan sepenuh hati setuju dengan kami tentang pentingnya agama dalam pemerintahan negara [ROOT.GetAdjective], namun kami tahu pasti bahwa para pengacara ini setia kepada lebih dari sekedar Yang Maha Kuasa. Kita telah didekati oleh mantan perwira dan jenderal Kesultanan Utsmaniyah dengan sebuah pilihan yang akan berdampak luas sepanjang sejarah kita: mereka ingin mengembalikan Sultan ke tahtanya.\n\nTawaran ini tidak sepenuhnya mengejutkan, karena banyak menteri dan konstituen kita yang secara pribadi menyatakan kekecewaannya atas runtuhnya Kesultanan Utsmaniyah dan dengan bangga menyatakan korespondensi persahabatan mereka dengan buronan Utsmaniyah yang tinggal di luar negeri. Tidak ada keraguan bahwa para pemilih kami akan mendukung keputusan kami, namun manajemen tingkat atas kami terpecah. Ada rasa hormat yang besar terhadap republik ini dan atas segala sesuatu yang dicapai Mustafa Kemal Atatürk, dan jika kita menandatangani pakta ini dengan hantu-hantu Ottoman ini, maka kita pasti akan memberikan pukulan mematikan terhadap republik Atatürk."
 bftb_turkey.95.a: "Kemuliaan lama kita menunggu reklamasi..."
 bftb_turkey.95.b: "Kesetiaan kami pada Republik dan demokrasi!"
 bftb_turkey.97.t: "[FROM.GetNameDefCap] Menuntut Penaklukan Kita"
 bftb_turkey.97.desc: "Dikatakan bahwa sejarah mempunyai kebiasaan berulang dalam siklus, namun tentu saja tidak ada ilmuwan politik yang mampu meramalkan apa yang sedang terjadi. Ada perasaan déjà vu yang umum di antara banyak orang di pemerintahan karena kami baru saja menerima utusan dari [FROM.GetNameDef] dan tampaknya [FROM.GetLeader] menuntut kepatuhan kami.\n\nSeluruh situasinya tidak masuk akal! Bagaimana ini bisa terjadi!? Bagaimana rakyat Turki mengizinkan hal ini? Bagaimana kita bisa membiarkan diri kita berada pada posisi seperti itu!? Situasinya aneh, namun ancamannya nyata. Kita harus memutuskan apakah kita siap menghadapi ancaman [FROM.GetAdjective] sekali lagi seperti yang kita lakukan beberapa dekade yang lalu, atau apakah zaman telah banyak berubah sehingga kita tidak berani mencoba melawan motif mereka yang tidak dapat dipahami dan mengambil risiko kemarahan mereka."
 bftb_turkey.97.a: "Ottoman yang keji melebih-lebihkan kekuatan mereka!"
 bftb_turkey.97.b: "1908 tidak akan sia-sia!"
 bftb_turkey.97.c: "Tidak ada gunanya melawan ancaman Ottoman."
 bftb_turkey.98.t: "[FROM.GetNameDefCap] Tetap Percaya Diri dalam Perlindungan Sekutunya"
 bftb_turkey.98.desc: "[FROM.GetAdjective] menolak untuk menyetujui otoritas kami atau mengakui keabsahan tuntutan kami, malahan mereka mencari perlindungan di tangan [FROM.GetFactionName] seperti mereka yang pengecut. Kita harus memutuskan apakah kita bersedia mengambil risiko konflik dengan sekutu [FROM.GetNameDef], atau apakah kemenangan kita harus ditunda sebentar lagi."
 bftb_turkey.98.a: "Tidak ada seorang pun yang bisa melawan kekuatan kita!"
 bftb_turkey.98.b: "Kita tidak dapat mengulangi peristiwa tahun 1913..."
 bftb_turkey.99.t: "[FROM.GetNameDefCap] Mundur dari Tuntutannya!"
 bftb_turkey.99.desc: "[FROM.GetAdjective] yang menjengkelkan dan busuk telah mundur dari tuntutan konyol mereka. Akan sangat baik jika kita mengatakan bahwa mereka telah menunjukkan kebijaksanaan dalam revisi keputusan mereka, namun hal ini akan memberikan penghargaan yang jauh lebih besar kepada pemerintahan [FROM.GetAdjective] daripada yang seharusnya mereka buktikan. Perdamaian berkuasa antara [ROOT.GetNameDef] dan [FROM.GetNameDef], untuk saat ini..."
 bftb_turkey.99.a: "Kami telah selamat dari krisis besar!"
 bftb_turkey.100.t: "[FROM.GetNameDefCap] Berlutut di Depan Kekuatan Kita!"
 bftb_turkey.100.desc: "Kita selangkah lebih dekat untuk mendapatkan kembali kejayaan kita dengan menjungkirbalikkan keadaan [FROM.GetAdjective] yang tidak bermoral dan menyelaraskannya dengan nilai-nilai kita sendiri. Perayaan telah diadakan di seluruh negeri sebagai pengakuan atas kemenangan besar kita."
 bftb_turkey.100.a: "Perang Besar mungkin akan terbalas..."
 bftb_turkey.101.t: "[FROM.GetNameDefCap] Berdiri Menantang"
 bftb_turkey.101.desc: "Para [FROM.GetAdjective] yang jahat telah menolak untuk bertekuk lutut kepada Sultan kita yang mahakuasa dan bijaksana, dan malah memilih untuk berperang. Jika ini adalah perang yang diinginkan oleh [FROM.GetAdjective], maka itu adalah perang yang harus mereka lakukan! Peristiwa tahun 1913 tidak akan terulang lagi!"
 bftb_turkey.101.a: "Allah menuntun pedang kita."
 bftb_turkey.102.t: "Diktat Damaskus"
 bftb_turkey.102.desc: "Para bandit angkuh yang menjalankan [FROM.GetNameDef] menuntut kami segera menyerahkan wilayah Suriah kepada mereka di bawah ancaman perang. Kita tidak bisa mengatakan bahwa kita terkejut dengan keputusan para burung nasar [FROM.GetAdjective] ini, namun hal ini tidak membuat situasi kita menjadi lebih genting.\n\nKita harus memutuskan apakah kita siap untuk menyerahkan tanah kita kepada [FROM.GetAdjective] dengan harapan menghindari perang, atau apakah kita bersedia mencoba untuk secara permanen memasukkan [FROM.GetNameDef] kembali ke dalam catatan sejarah di mana mereka seharusnya tinggal."
 bftb_turkey.102.a: "Itu tidak layak untuk diperjuangkan."
 bftb_turkey.102.b: "Sudah waktunya untuk membongkar hegemoni Ottoman secara permanen."
 bftb_turkey.103.t: "[FROM.GetNameDefCap] Menyangkal Kami!"
 bftb_turkey.103.desc: "Orang-orang bodoh di [FROM.GetNameDef] telah menolak permintaan kami yang masuk akal agar wilayah kami yang dulu dikembalikan kepada pemiliknya yang sah. Hal ini membuat kita hanya mempunyai satu tindakan: perang!"
 bftb_turkey.103.a: "Kelancangan mereka akan dibalas dengan pedang kita."
 bftb_turkey.104.t: "Wilayah Kita Adalah Milik Kita!"
 bftb_turkey.104.desc: "Kelompok [FROM.GetNameDef] yang lemah telah menunjukkan kebijaksanaan yang tidak seperti biasanya dalam keputusan mereka untuk mengembalikan Suriah kepada kita tanpa memerlukan kekerasan. Kami telah bekerja keras untuk mengintegrasikan kembali wilayah tersebut ke dalam keputusan kekaisaran kami, dan telah tiba di persimpangan jalan.\n\nAnehnya, kami dikenang di Levant sebagian besar sebagai imperialis dan orang asing yang secara tidak adil memerintah wilayah-wilayah yang tidak berhak kami masuki. Ini, tentu saja, hanyalah omong kosong belaka - namun sentimen yang salah masih tetap ada hingga saat ini. Kita mungkin akan mendapatkan keuntungan jangka panjang dengan mendukung otonomi kekaisaran yang dapat kita integrasikan di kemudian hari jika situasi memerlukannya. Di sisi lain, kami juga bisa langsung mencaplok wilayah tersebut kembali ke dalam Kesultanan kami – ini adalah hak ilahi kami."
 bftb_turkey.104.a: "Kami akan menggabungkan Eyalets Damaskus dan Aleppo!"
 bftb_turkey.104.b: "Selamat datang kembali di Kekaisaran!"
 bftb_turkey.110.t: "Pemberontak Berhasil Dilawan di [TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.110.desc: "Angkatan bersenjata kita muncul sebagai pemenang setelah pertempuran berkepanjangan dengan separatis di [TUR_kurdish_state_event_target.GetName]. Serangkaian penangkapan telah dilakukan di wilayah tersebut, dan militer kami telah bekerja keras untuk memulihkan ketertiban di wilayah tersebut.\n\nKerugian kedua belah pihak memang patut disesalkan, namun ada pemahaman umum bahwa tidak ada pengorbanan yang terlalu besar untuk menjaga persatuan bangsa kita. Menyikapi peristiwa tersebut, pemerintah telah menyerukan hari berkabung diadakan di seluruh negeri untuk menghormati korban tewas."
 bftb_turkey.110.a: "Satu republik, tidak dapat dibagi-bagi."
 bftb_turkey.111.t: "Pemberontak Kalahkan Pasukan Kami di [TUR_kurdish_state_event_target.GetName]"
 bftb_turkey.111.desc: "Sebuah bencana mengerikan terjadi di [TUR_kurdish_state_event_target.GetName] ketika angkatan bersenjata kita menarik diri dari wilayah tersebut setelah pertempuran yang melelahkan melawan pemberontak separatis yang aktif di wilayah tersebut.\n\nAdministrator pemerintah dan para pengamat komando tinggi terkejut dan terkejut dengan kejadian yang mengejutkan ini, dan mendesak dilakukannya pembalasan besar-besaran terhadap pasukan pemberontak yang mengganggu wilayah tersebut. [ROOT.GetLeader] tidak menyampaikan pidatonya secara terbuka, namun secara pribadi mendesak para pejabat militer untuk mempersiapkan operasi balasan untuk membalas kekalahan kami dalam pertempuran tersebut."
 bftb_turkey.111.a: "Mereka belum melihat kita yang terakhir."
 bftb_turkey.113.t: "Kaum Fundamentalis Memprotes Produksi Barang-Barang yang Dilarang Secara Agama"
 bftb_turkey.113.desc: "Memenuhi pasar bebas selalu menjadi landasan kebijakan Kemalis: ketika ada permintaan, kita mengharapkan seseorang menyediakan pasokan. Kelompok masyarakat tertentu - terutama yang menganut paham keagamaan - tidak terlalu nyaman dengan budaya konsumeris [ROOT.GetNameDef] yang cukup baru.\n\nProtes telah terjadi di beberapa bagian negara yang menentang produksi beberapa produk yang dianggap dilarang oleh agama mereka oleh anggota masyarakat kita. Mereka tidak pernah menghormati impian kita akan [FROM.GetName] yang sekuler, dan mereka jelas masih kesulitan menyesuaikan diri dengan keseluruhan konsep tersebut. Namun, menenangkan massa mungkin merupakan tindakan yang lebih mudah daripada menimbulkan konflik yang tidak perlu di antara masyarakat kita sendiri."
 bftb_turkey.113.a: "Baiklah, kita akan menyerah sebagai bentuk penghormatan terhadap adat istiadat mereka."
 bftb_turkey.113.b: "Kemajuan kami tidak dapat dihentikan."
 bftb_turkey.114.t: "Kaum Fundamentalis Secara Damai Memprotes Kebijakan Pemerintah"
 bftb_turkey.114.desc: "Di lain hari, protes lain datang dari agama di negara kita. Gelombang protes terbaru bermunculan di [TUR_fundamentalist_state.GetName] yang menentang apa yang mereka lihat sebagai campur tangan pemerintah yang sombong dalam urusan yang tidak boleh mereka campur tangani. Semua ini tidak masuk akal; kami adalah pemerintah, tugas kami adalah mencampuri urusan warga negara kami.\n\nProtes berlangsung damai, dan kita tidak perlu menanggapi provokasi mereka dengan kekerasan. Faktanya, para penasihat pemerintah telah menyusun daftar konsesi tidak berarti yang dapat dibuat untuk menumpas massa di [TUR_fundamentalist_state.GetName]. Meskipun demikian, jika kita bersandar pada kaum fundamentalis di [TUR_fundamentalist_state.GetName] maka kaum fundamentalis di negara lain mungkin berpikir bahwa mereka bisa melakukan hal yang sama. Mungkin akan lebih baik jika kita mengirimkan tentara sebagai bentuk komitmen kita terhadap nilai-nilai inti kita."
 bftb_turkey.114.a: "Beberapa konsesi ringan dapat ditawarkan."
 bftb_turkey.114.b: "Sebarkan hama yang tidak bisa diubah."
 bftb_turkey.115.t: "Kaum Fundamentalis Menuntut Otonomi Daerah"
 bftb_turkey.115.desc: "Ketegangan di [TUR_fundamentalist_state.GetName] antara kelompok fundamentalis agama dan otoritas pemerintah akhirnya mencapai puncaknya ketika kelompok fundamentalis menuntut otoritas regional dan kekuasaan untuk memerintah berdasarkan hukum mereka sendiri. Hal ini merupakan eskalasi yang luar biasa dari konflik yang sebagian besar terjadi akibat protes damai dan retorika ompong.\n\nMemang benar bahwa situasi di [TUR_fundamentalist_state.GetName] perlahan-lahan menjadi tidak terkendali. Meski menyakitkan untuk direnungkan, jika kita memberikan otonomi yang dituntut dari kita, hal itu setidaknya akan menghapus [TUR_fundamentalist_state.GetName] dari daftar masalah kita saat ini. Lagi pula, bahkan memikirkan tindakan seperti itu dapat dianggap sebagai pengkhianatan tingkat tinggi oleh sebagian orang..."
 bftb_turkey.115.a: "Itu adalah pengorbanan yang perlu."
 bftb_turkey.115.b: "Biarkan mereka bertanya kepada petugas kami apa pendapat mereka tentang 'tuntutan' ini."
 bftb_turkey.116.t: "Serangan Gerilya Diluncurkan di [TUR_fundamentalist_state.GetName]"
 bftb_turkey.116.desc: "Kami telah menerima kabar buruk bahwa salah satu garnisun kami di [TUR_fundamentalist_state.GetName] menjadi korban serangan gerilya yang penuh perhitungan dan brutal yang dilakukan oleh fundamentalis agama yang berbasis di wilayah tersebut. Kerugian yang dialami kedua belah pihak cukup besar, namun para pemberontak mengancam akan mengulangi serangan mereka kecuali kita setuju untuk menarik angkatan bersenjata kita dari wilayah tersebut.\n\nIni benar-benar hari yang menyedihkan ketika rekan senegaranya membunuh rekan senegaranya karena sesuatu yang sepele seperti keyakinan, namun situasi seperti itulah yang kita alami. Korps perwira kami menyarankan untuk menyerang balik para pemberontak dengan kekuatan penuh militer untuk membalas kekalahan kami, namun beberapa tokoh politik mendesak bahwa mungkin tindakan yang paling aman adalah dengan menarik pasukan kami dari daerah tersebut untuk sementara sampai situasinya tenang. Keputusan ini bukanlah keputusan yang bisa diambil dengan mudah."
 bftb_turkey.116.a: "Serang balik, dua kali lebih keras!"
 bftb_turkey.116.b: "Tarik tentara kita keluar."
 bftb_turkey.117.t: "Kaum Fundamentalis Menyebarkan Racunnya ke [TUR_fundamentalist_state.GetName]"
 bftb_turkey.117.desc: "Laporan dari lapangan menunjukkan bahwa sel-sel fundamentalis agama telah menyusup ke [TUR_fundamentalist_state.GetName] dalam upaya bersama untuk mempengaruhi penduduk di sana kembali ke gaya hidup yang lebih tradisional – gaya hidup yang tidak diragukan lagi sangat menentang cita-cita sekuler kita. Para ulama karismatik dan pemimpin protes yang gagah berani telah memimpin upaya untuk mengubah cara berpikir penduduk [TUR_fundamentalist_state.GetName], dan sejauh ini upaya untuk memaksa mereka keluar dengan menggunakan kekuatan lunak (soft power) telah gagal.\n\nKita dihadapkan pada sebuah dilema: kita berusaha mendukung keinginan rakyat, namun jika kita tidak melakukan intervensi melalui tindakan yang lebih langsung maka kita hampir pasti akan kehilangan negara ke tangan kaum fundamentalis. Kami telah mencoba berulang kali untuk memberikan pencerahan kepada masyarakat di negara kami untuk mencoba dan membangun dukungan rakyat terhadap sekularisme, namun di setiap kesempatan, kaum fanatik terus menerus melawan kami dengan sekuat tenaga. Kita harus memilih apakah kita siap menerima kemauan rakyat [TUR_fundamentalist_state.GetName], atau harus diambil tindakan langsung oleh pemerintah kita untuk menggagalkan tujuan kaum fundamentalis."
 bftb_turkey.117.a: "Jangan ada upaya untuk menghentikan mereka."
 bftb_turkey.117.b: "Kita harus menuruti kemauan rakyat..."
 bftb_turkey.118.t: "Kaum Fundamentalis Merebut Kendali Penuh Atas [TUR_fundamentalist_state.GetName]!"
 bftb_turkey.118.desc: "Bencana! Baru saja diketahui bahwa kita telah kehilangan kendali atas [TUR_fundamentalist_state.GetName]. Gerilyawan fundamentalis agama melancarkan serangan terkoordinasi terhadap semua gedung pemerintah dan pangkalan militer di negara bagian tersebut sedemikian rupa sehingga hanya ada sedikit waktu untuk mengoordinasikan serangan balik sebelum seluruh situasi menjadi tidak terkendali\n\nIni adalah kerugian yang belum pernah terjadi sebelumnya bagi negara kita: musuh-musuh negara telah berhasil mengambil kendali penuh atas wilayah kedaulatan [ROOT.GetAdjective]. Mengambil kembali [TUR_fundamentalist_state.GetName] akan memakan biaya yang besar, namun hal tersebut juga akan membuat hal tersebut lepas dari kendali kita. Kita kehabisan waktu, dan harus mengambil keputusan."
 bftb_turkey.118.a: "Serang mereka dengan segalanya!"
 bftb_turkey.118.b: "Kita harus memenangkan kembali masyarakat seiring berjalannya waktu."
 bftb_turkey.119.t: "Kaum Fundamentalis di [TUR_fundamentalist_state.GetName] Menyerah kepada Pemerintah"
 bftb_turkey.119.desc: "Kebijakan kami mengenai dialog transparan dan penjangkauan komunitas yang berdedikasi telah membuahkan hasil di [TUR_fundamentalist_state.GetName]. Kaum radikal telah meninggalkan negara bagian ini, diusir oleh penduduk setempat dan ini merupakan kemenangan yang luar biasa bagi pemerintah kita.\n\nMasyarakat [TUR_fundamentalist_state.GetName] tetap menjaga karakter keagamaannya, namun dalam diskusi dengan tokoh masyarakat, kami menemukan bahwa warga kami tidak lagi menganggap prinsip-prinsip pemerintah pada hakikatnya bertentangan dengan keyakinan mereka. Di [TUR_fundamentalist_state.GetName], kita melihat seperti apa masa depan persatuan [ROOT.GetAdjective] nantinya."
 bftb_turkey.119.a: "Kerja sama Anda dihargai."
 bftb_turkey.126.t: "[FROM.GetNameDefCap] Memberikan Portofolio Investasi"
 bftb_turkey.126.desc: "Perwakilan dari [FROM.GetNameDef] telah mengunjungi negara kami dan bertemu dengan banyak politisi kami dengan harapan mendapatkan dukungan untuk skema investasi mereka. Pemerintah [FROM.GetNameDef] ingin kami menggunakan sumber daya kami untuk meningkatkan kemampuan dan hasil industri mereka. Para pejabat [FROM.GetAdjective] menyimpulkan bahwa dengan membantu negara mereka, kita mungkin dapat mengharapkan bantuan kita sendiri di masa depan dalam bentuk aliansi militer antar negara kita."
 bftb_turkey.126.a: "Jika itu adalah bantuan yang mereka perlukan, maka itulah bantuan yang harus mereka dapatkan."
 bftb_turkey.126.b: "Kami tidak akan menandatangani perjanjian Faustian mereka."
 bftb_turkey.127.t: "[FROM.GetNameDefCap] Mengatur Investasi sebagai Suatu Kemungkinan"
 bftb_turkey.127.desc: "Kami menerima kabar buruk dari [FROM.GetNameDef]: meskipun [FROM.GetAdjective] tidak memberikan niat buruk kepada kami, kami telah diberitahu bahwa [FROM.GetNameDef] tidak boleh menginvestasikan sumber daya apa pun ke basis industri kami. Para pejabat tegas mengenai masalah ini, dan mereka telah meminta kami untuk tidak membahas masalah ini lagi di masa mendatang."
 bftb_turkey.127.a: "Disesalkan, tapi bisa dimengerti."
 bftb_turkey.128.t: "[FROM.GetNameDefCap] Melakukan Investasi Sederhana"
 bftb_turkey.128.desc: "Kami baru-baru ini diberitahu oleh pejabat [FROM.GetAdjective] bahwa proyek yang mereka investasikan telah selesai. Inspektur kami sendiri mengunjungi lokasi pembangunan untuk memastikan semuanya sesuai dengan harapan kami dan mereka tidak kecewa.\n\n[FROM.GetAdjective] pengamat berkomentar setelah selesainya proyek bahwa [FROM.GetNameDef] tidak segan-segan mensponsori proyek serupa atau bahkan lebih ambisius di [ROOT.GetNameDef] di masa depan."
 bftb_turkey.128.a: "Mereka telah memberikan kita kebaikan yang besar."
 bftb_turkey.129.t: "[FROM.GetNameDefCap] Berinvestasi di Sektor Industri Ringan kami"
 bftb_turkey.129.desc: "Kami baru-baru ini diberitahu oleh pejabat [FROM.GetAdjective] bahwa proyek industri yang disponsori [FROM.GetAdjective] beberapa waktu lalu telah selesai. Inspektur kami sendiri mengunjungi lokasi pembangunan untuk memastikan semuanya sesuai dengan harapan kami dan mereka tidak kecewa. Produksi di fasilitas baru diharapkan segera dimulai.\n\n[FROM.GetAdjective] setelah selesainya proyek, para pengamat berkomentar bahwa [FROM.GetNameDef] tidak segan-segan mensponsori proyek serupa atau bahkan lebih ambisius yang bersifat rahasia di masa depan."
 bftb_turkey.129.a: "Berita yang luar biasa!"
 bftb_turkey.130.t: "[FROM.GetNameDefCap] Berinvestasi di Industri Militer kita"
 bftb_turkey.130.desc: "Kami baru-baru ini diberitahu oleh pejabat [FROM.GetAdjective] bahwa proyek industri rahasia yang disponsori [FROM.GetAdjective] beberapa waktu lalu telah selesai. Inspektur kami sendiri mengunjungi lokasi pembangunan untuk memastikan semuanya sesuai dengan harapan kami dan mereka tidak kecewa. Produksi di fasilitas baru diharapkan segera dimulai.\n\n[FROM.GetAdjective] pengamat berkomentar setelah proyek selesai bahwa [FROM.GetNameDef] tidak segan-segan mensponsori proyek serupa di masa depan."
 bftb_turkey.130.a: "Mereka adalah teman sejati [ROOT.GetAdjective]."
 bftb_turkey.131.t: "[FROM.GetNameDefCap] Menyetujui Pembagian [GRE.GetNameDef]"
 bftb_turkey.131.desc: "Kami telah mencapai kesepakatan dengan [FROM.GetNameDef] tentang bagaimana pembagian [GRE.GetNameDef] harus ditangani. [FROM.GetNameDefCap] akan diberikan negara bagian yang berbatasan dengan Mediterania Timur dan Laut Ionia, dan kami akan mengambil [GRE.GetAdjective] jantung wilayah yang berbagi Laut Aegea dengan kami. Sangat disayangkan bahwa hal ini menjadi perlu, tetapi [GRE.GetNameDef] tidak memberi kita pilihan lain dalam hal ini."
 bftb_turkey.131.a: "Yang Maha Kuasa ampuni kami, namun [GRE.GetNameDef] harus dimusnahkan."
 bftb_turkey.132.t: "[FROM.GetNameDefCap] Tolak Rencana Pemekaran [GRE.GetNameDef]!"
 bftb_turkey.132.desc: "[FROM.GetNameDefCap] telah menolak usulan kami yang masuk akal untuk pembagian [GRE.GetNameDef] demi perebutan tanah secara gila-gilaan tanpa mempertimbangkan populasi yang mendiami wilayah ini. Tidak ada yang namanya invasi yang 'bagus', tapi setidaknya semuanya bisa berjalan dengan tertib dan terkendali - sebaliknya [FROM.GetAdjective] telah memilih untuk mengubah invasi ini menjadi perlombaan yang kacau dan berantakan untuk menduduki sebanyak mungkin lahan sebelum memaksa [GRE.GetAdjective] untuk tunduk.\n\nIni bukan cara yang kami inginkan; ini tidak seharusnya terjadi! Warisan kami hancur selamanya!"
 bftb_turkey.132.a: "Perlombaan sudah dimulai!"
 bftb_turkey.133.t: "Mustafa Kemal Atatürk Sakit"
 bftb_turkey.133.desc: "Kemarin, Mustafa Kemal Atatürk dilarikan ke rumah sakit dalam kondisi yang mengenaskan setelah pingsan di kapal pesiarnya saat menjamu beberapa teman lama. Peristiwa ini adalah yang terbaru dari serangkaian tanda-tanda yang sangat memprihatinkan bahwa kesehatan Atatürk memburuk dengan cepat, dan para penasihat secara pribadi menyatakan keprihatinan mereka bahwa Atatürk bekerja terlalu keras karena kondisinya semakin tidak dapat diprediksi.\n\nMeskipun dia bersikeras bahwa semuanya baik-baik saja, pemerintah mengambil tindakan sendiri untuk memantau kesehatan Mustafa Kemal Atatürk dan menyusun daftar tindakan yang mungkin diambil. Jika Atatürk tidak mau meninggalkan tugasnya untuk mengurus kondisi kesehatannya, maka kita mungkin harus mempertimbangkan untuk memaksanya pensiun sehingga ia dapat menghabiskan bulan-bulan terakhirnya bersama keluarganya."
 bftb_turkey.133.a: "Kita sedang berpacu dengan waktu."
 bftb_turkey.134.t: "Kematian Mustafa Kemal Atatürk"
 bftb_turkey.134.desc: "Republik berduka.\n\nPahlawan perang, revolusioner, presiden dan Bapak Turki, Mustafa Kemal Atatürk telah meninggal dunia dengan damai dalam tidurnya.\n\nTak seorang pun dapat berharap untuk bisa menyamai kepemimpinan Mustafa Kemal Atatürk, namun Bapak Turki tidak ingin Republik kesayangannya berantakan karena krisis kepemimpinan.\n\nKami tidak ingin menggantikan Ghazi kami, karena tak seorang pun pernah bermimpi untuk hidup sesuai dengan bapak pendiri negara kami yang mesianis, namun kami harus memilih pemimpin yang dapat kami percayai untuk mengikuti jejak Atatürk. Mereka harus mencontohkan nilai-nilai Kemalis dan mengikuti teladan Atatürk sebagai pemimpin [TUR.GetNameDef]."
 bftb_turkey.134.a: "Celâl Bayar adalah kandidat yang jelas."
 bftb_turkey.134.b: "Celâl Bayar adalah kandidat yang jelas."
 bftb_turkey.134.c: "İsmet İnönü adalah penerus Atatürk yang layak."
 bftb_turkey.134.d: "Fevzi Çakmak adalah pemimpin yang dibutuhkan [TUR.GetNameDef]."
 bftb_turkey.134.e: "Fevzi Çakmak akan membawa keamanan bagi negara ini."
 bftb_turkey.134.f: "Recep Peker adalah orang yang mensintesis fasisme dan Kemalisme."
 bftb_turkey.134.g: "Kejeniusan Şevket Süreyya Aydemir akan membantu kita melewatinya."
 bftb_turkey.134.h: "Hanya İsmet İnönü yang dapat memperkenalkan sosialisme [TUR.GetAdjective] yang unik."
 bftb_turkey.134.i: "Kâzım Orbay akan memimpin junta militer sampai kita menemukan jalan kita."
 bftb_turkey.135.t: "Kematian Mustafa Kemal Atatürk"
 bftb_turkey.135.desc: "Republik berduka.\n\nPahlawan perang, revolusioner, presiden dan Bapak Turki, Mustafa Kemal Atatürk telah meninggal dunia dengan damai dalam tidurnya.\n\nDia mempertahankan tugasnya terhadap rakyat Turki dan republik yang dia dirikan sampai akhir. Ribuan pelayat telah memberikan penghormatan di Istanbul, sebelum jenazahnya dipindahkan dengan caisson, kapal dan kereta api ke Ankara. Di sana pemakaman kenegaraannya diadakan dengan dihadiri seluruh parlemen dan pejabat dari seluruh dunia.\n\nDengan kepergian bapak bangsa Turki modern, Republik harus bergerak maju. [ROOT.GetLeader] adalah salah satu dari banyak pembicara di pemakaman Atatürk, dan dalam pidatonya dia berjanji untuk melanjutkan warisan orang yang sangat penting dalam menjamin kebebasan bangsa."
 bftb_turkey.135.a: "Tenang saja, Ghazi kami. Kami tidak akan pernah melupakanmu."
 bftb_turkey.136.t: "Tragedi Menimpa Keluarga Kerajaan Ottoman!"
 bftb_turkey.136.desc: "Kesengsaraan mencengkeram Kesultanan Ottoman yang kita banggakan ketika berita kematian Sultan kita yang tiba-tiba dan tidak terduga telah sampai ke telinga bangsa kita. Sultan dan putra-putranya sedang mengunjungi ladang subur di Niksar, dan sedang mendaki Pegunungan Canik di Samsun ketika gempa bumi melanda provinsi tersebut. Mayat bangsawan Ottoman ditemukan tiga hari kemudian, dan membuat istana menjadi panik.\n\nDengan perubahan hukum suksesi kerajaan Ottoman, tampaknya putri sulung Sultan adalah pewaris takhta. Dia adalah wanita yang berkemauan keras dan sangat berbakat, namun banyak elemen konservatif di lembaga keagamaan kita mungkin akan memprotes jika seorang wanita menduduki takhta Ottoman."
 bftb_turkey.136.a: "Hidup Sultana baru!"
 bftb_turkey.136.b: "Seorang wanita!? Tidak dapat diterima! Kami membutuhkan seorang bupati!"
 bftb_turkey.137.t: "[FROM.GetNameDefCap] Mengadopsi Sikap Kebijakan Luar Negeri yang Berbahaya"
 bftb_turkey.137.desc: "Pemerintahan [FROM.GetNameDef] telah memilih untuk mengambil arah baru dalam kebijakan luar negerinya: arah yang tidak kondusif bagi skema kebijakan luar negeri kita sendiri. Delegasi dari [FROM.GetNameDef] telah memberi tahu diplomat kami bahwa mereka tidak mempunyai niat untuk mengembalikan tindakan destruktif mereka saat ini."
 bftb_turkey.137.a: "Mereka telah menjadi hal yang mereka bersumpah untuk menghancurkannya."
 bftb_turkey.137.b: "Mereka adalah pengkhianat Revolusi!"
 bftb_turkey.137.c: "Mungkinkah mereka sedang bereksperimen dengan Sosialisme di Satu Negara?"
 bftb_turkey.137.d: "Selama mereka membiarkan sekutu kita sendirian..."
 bftb_turkey.137.e: "Mereka jelas tidak lagi bisa dipercaya."
 TUR_keeping_turkey_under_observation: "Kami akan terus mengawasi tindakan §Y[TUR.GetNameDef]§!, dan menghapusnya dari faksi kami di masa mendatang jika diperlukan."
 bftb_turkey.138.t: "[FROM.GetNameDefCap] Langgar Kedaulatan Anggota Fraksi!"
 bftb_turkey.138.desc: "Seperti prediksi pakar kebijakan luar negeri kita, [FROM.GetNameDef] telah mengalihkan perhatian mereka ke salah satu sekutu mereka sendiri. Kami telah mengecam delegasi [FROM.GetAdjective] atas keputusan pemerintah mereka yang ceroboh, namun tampaknya keputusan tersebut tidak memberikan kesan apa pun."
 bftb_turkey.138.a: "Mereka mendapat satu kesempatan terakhir. Satu."
 bftb_turkey.138.b: "Tidak ada gunanya terus melindungi negara jahat ini."
 bftb_turkey.139.t: "[FROM.GetNameDefCap] Kembali Langgar Kedaulatan Anggota Fraksi!"
 bftb_turkey.139.desc: "Para bandit yang bertanggung jawab atas [FROM.GetNameDef] sekali lagi mengkhianati kepercayaan kami. Sandiwara ini tidak bisa ditoleransi lagi, kita tidak bisa terus mendapatkan rasa hormat dari sekutu kita sementara kita melindungi negara yang jelas-jelas merupakan musuh."
 bftb_turkey.139.a: "Mereka telah diperingatkan!"
 bftb_turkey.140.t: "[FROM.GetNameDefCap] Mengeluarkan Peringatan"
 bftb_turkey.140.desc: "Kami telah diperingatkan oleh pemerintah [FROM.GetAdjective] untuk tidak melanggar kedaulatan sesama anggota fraksi lagi. Mereka bersedia memaafkan tindakan kita kali ini, namun tindakan lebih lanjut terhadap sekutu kita sendiri akan memaksa [FROM.GetNameDef] untuk mengambil tindakan."
 bftb_turkey.140.a: "Kami melakukan sesuka kami."
 bftb_turkey.141.t: "[FROM.GetNameDefCap] Menghapus Kami dari [FROM.GetFactionName]!"
 bftb_turkey.141.desc: "Kebijakan luar negeri kami yang baru terbukti mustahil untuk mengakomodasi [FROM.GetNameDef], dan mereka telah memutuskan bahwa kami tidak lagi dapat dianggap sebagai sekutu. Mulai hari ini dan seterusnya, kami tidak lagi menjadi bagian dari [FROM.GetFactionName]."
 bftb_turkey.141.a: "Jadilah itu."
 TUR_downgrade_fundamentalist_defiance_effect_tt: "£faction_tur_traditionalist §YTradisionalis§! akan lebih banyak bekerja sama dengan pemerintah di §Y[TUR_fundamentalist_state.GetName]§!."
 TUR_upgrade_fundamentalist_defiance_effect_tt: "Golongan £faction_tur_traditionalist §YTradisionalis§! akan meningkatkan intensitas perlawanannya terhadap pemerintah pada §Y[TUR_fundamentalist_state.GetName]§!."
 TUR_placate_fundamentalist_state_effect_tt: "£faction_tur_traditionalist §YTradisionalis§! akan menghentikan semua retorika terhadap pemerintah pada §Y[TUR_fundamentalist_state.GetName]§! dan sekarang mendesak kerja sama yang aktif."
 TUR_placate_fundamentalist_state_all_targets_effect_tt: "£faction_tur_traditionalist §YTradisionalis§! harus secara kolektif menghentikan perlawanan mereka terhadap pemerintah."
 bftb_bulgaria_tsar_boris.1.t: "Tsar Boris III mengunjungi [GetDestinationName]"
 bftb_bulgaria_tsar_boris.1.desc_success: "Hari ini, Tsar Boris telah mengakhiri kunjungannya ke [GetDestinationName], tempat sang raja menikmati euforia penduduk setempat yang berkumpul untuk menyemangati prosesi kerajaan yang berjalan melalui beberapa jalan paling ikonik di kota tersebut.\nTetapi kunjungan ini tidak hanya untuk dinikmati masyarakat biasa; Perjamuan mewah, resepsi megah, dan pertemuan dengan para anggota elit lokal tertinggi terjadi pada hari-hari setelah kedatangan Tsar.\n\nSecara keseluruhan, kunjungan tersebut bertujuan untuk memperkuat hubungan dengan anggota masyarakat terkaya dan menunjukkan Tsar kepada rakyat jelata sebagai penguasa yang baik hati, dekat dengan rakyatnya."
 bftb_bulgaria_tsar_boris.1.desc_extra_success: "Kunjungan kerajaan ke [GetDestinationName] telah sukses total! Setelah menyelesaikan prosesi menuju balai kota untuk menemui sang mayor, Tsar memutuskan untuk berjalan-jalan di salah satu distrik sederhana [GetDestinationName] untuk berbaur dengan masyarakat.\nWarga sangat menyambut Boris dengan lebih hangat. Semua orang senang melihat penguasa mereka berkeliaran di jalan-jalan, dan lebih dari beberapa orang dengan riang menghadiahkan Tsar dengan hadiah-hadiah sederhana, mulai dari karangan bunga dan produk lokal hingga kerajinan kayu dan besi kecil.\n\nApakah penyambutan yang tulus dan rendah hati ini menggugah sesuatu dalam diri Tsar atau tidak, masih belum jelas, namun sebenarnya pada kesempatan ini, alih-alih mengadakan resepsi pribadi dan pesta kebun eksklusif, Tsar memutuskan untuk mengadakan pesta besar yang populer untuk dinikmati semua orang. Tentu saja, masyarakat [GetDestinationName] sangat senang dengan ide tersebut, dan semua orang pulang larut malam dan sangat senang setelah acara tersebut."
 bftb_bulgaria_tsar_boris.1.desc_failure: "Kunjungan kerajaan ke [GetDestinationName] merupakan pukulan telak bagi popularitas Tsar. Sejak awal kunjungan sudah terlihat bahwa tidak banyak kegembiraan di antara masyarakat yang sebagian besar miskin yang berkumpul untuk menyambut prosesi tersebut, dan bahkan cemoohan secara sporadis terdengar di antara kerumunan.\n\nSituasi bertambah buruk ketika warga mengorganisir protes rakyat di sekitar balai kota, di mana raja dan keluarganya menikmati resepsi yang megah dan jamuan makan mewah yang ditemani oleh anggota masyarakat yang paling istimewa. Masyarakat mengkritik pertunjukan mewah tersebut dan menyalahkan kelas atas atas semua masalah ekonomi dan sosial yang menimpa negara ini dalam beberapa dekade terakhir.\n\nSebagai tanggapan, pasukan polisi ditugaskan untuk segera membubarkan demonstrasi, namun penggunaan kekerasan hanya memperburuk situasi, dan demonstrasi meningkat menjadi kerusuhan."
 bftb_bulgaria_tsar_boris.1.a: "Kapan jadwal kunjungan berikutnya?"
 bftb_bulgaria_tsar_boris.1.b: "Suatu malam yang akan mereka ingat untuk waktu yang lama!"
 bftb_bulgaria_tsar_boris.1.c: "Tidak perlu lagi berpesta untuk sementara waktu, lalu..."
 bftb_bulgaria_tsar_boris.2.t: "Kematian Tsar Boris III"
 bftb_bulgaria_tsar_boris.2.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 BUL_context_of_death_basic: "Setelah menderita penyakit parah selama seminggu, Tsar Boris III meninggal hari ini, [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong], pada [BUL.Capital.GetName] karena gagal jantung."
 BUL_context_of_death_assassinated: "Beberapa jam yang lalu, Tsar Boris III meninggalkan Universitas Sofia setelah menghadiri Kongres Nasional Tahunan Studi Bizantium, ketika seseorang dengan cepat mendekati Tsar, mengeluarkan senjata dan menembak beberapa kali ke arah Boris sebelum ditembak jatuh oleh pasukan keamanan. Beberapa menit kemudian, Tsar Boris III dan pembunuhnya tewas."
 BUL_context_of_death_ger: "Tak lama setelah kembali ke [BUL.Capital.GetName] dari pertemuan keras yang tidak terduga dengan [GER.GetLeader] [GetBorisGermanMeetingLocation], Tsar Boris III meninggal karena gagal jantung."
 BUL_boris_german_meeting_location_historical: "di markas militer Prusia Timur Wolf's Lair di Rastenburg"
 BUL_boris_german_meeting_location_capital: "di [GER.Capital.GetName]"
 BUL_context_of_death_sov: "Setelah Tsar kembali ke [BUL.Capital.GetName] dari pertemuan dengan [SOV.GetLeader] di [SOV.Capital.GetName], Tsar Boris III meninggal karena gagal jantung."
 BUL_context_of_death_eng: "Seminggu setelah kembali ke [BUL.Capital.GetName] dari pertemuannya dengan [ENG.GetLeader] di [ENG.Capital.GetName], Tsar Boris III meninggal karena gagal jantung."
 BUL_popular_suspicions_about_death_basic: "Namun penyebab kematiannya masih belum jelas dan ada spekulasi bahwa Boris diracun pada pertemuan terakhirnya, banyak yang percaya bahwa atas perintah [GER.GetLeader]. Yang lain yakin bahwa NKVD-lah yang meracuni Tsar. Ada yang menunjuk ke [ENG.GetNameDef] dan, meskipun kelihatannya meresahkan, ada pula yang berani mengklaim bahwa pemerintah [BUL.GetAdjective] sendiri terlibat dalam kematian Tsar..."
 BUL_popular_suspicions_about_death_assassinated: "Badan keamanan nasional telah membuka penyelidikan untuk menemukan siapa yang bertanggung jawab atas pembunuhan tersebut. Menurut laporan resmi, penjahat tersebut memiliki dokumentasi berbahasa Bulgaria, Jerman dan Inggris, yang hanya mempersulit penyelidikan dan memicu spekulasi. Kebanyakan orang Bulgaria menyalahkan [GER.GetLeader], NKVD atau [ENG.GetAdjective], namun ada juga yang berani mengklaim bahwa pemerintah sendiri terlibat dalam pembunuhan Tsar..."
 bftb_bulgaria_tsar_boris.2.a: "Memang mengganggu..."
 bftb_bulgaria_tsar_boris.3.t: "Dewan Kabupaten"
 bftb_bulgaria_tsar_boris.3.desc: "Sudah waktunya untuk menunjuk anggota dewan kabupaten yang akan memerintah [ROOT.GetNameDef] atas nama pewaris Boris, Simeon II.\n\nKita harus memilih calon yang paling cocok dari kalangan bangsawan dan kalangan atas politik dan militer, tetapi kita harus memilih dengan bijak, karena masing-masing memiliki loyalitasnya sendiri, dan negara kita telah mengalami bencana dan kehancuran yang disebabkan oleh keputusan para pemimpinnya di masa lalu..."
 bftb_bulgaria_tsar_boris.3.a: "Membentuk pemerintahan yang pro-Poros."
 bftb_bulgaria_tsar_boris.3.b: "Membentuk pemerintahan yang pro-Sekutu."
 bftb_bulgaria_tsar_boris.3.c: "Membentuk pemerintahan yang mandiri."
 bftb_bulgaria_factions.10.t: "Plot Zveno yang Terungkap"
 bftb_bulgaria_factions.10.desc: "Sumber terpercaya telah memberi tahu kami bahwa beberapa anggota Zveno yang telah mengkritik rezim secara terbuka pada kesempatan lain, baru-baru ini menghubungi sejumlah perwira militer. Meskipun kita tidak tahu pasti untuk apa pertemuan-pertemuan ini atau siapa petugas yang mereka dekati, tidak ada keraguan bahwa gerakan mencurigakan yang dilakukan Zveno ini adalah bagian dari skema yang tidak jelas dan lebih besar..."
 bftb_bulgaria_factions.10.a: "Selidiki lebih lanjut!"
 bftb_bulgaria_factions.10.b: "Mari kita tunggu mereka bergerak..."
 bftb_bulgaria_factions.11.t: "Konspirator Zveno Terungkap"
 bftb_bulgaria_factions.11.desc: "Setelah melakukan penyelidikan menyeluruh dan menghubungi beberapa anggota Zveno yang setia kepada rezim, kami mengungkap rencana militer untuk menggulingkan pemerintah.\nDi antara daftar orang-orang yang terkait dengan konspirasi ini, nama salah satu jenderal kita yang paling tepercaya telah terungkap: [?BUL_zveno_conspirator.GetName].\n\nSekarang kita harus memutuskan apa yang harus dilakukan terhadap individu yang tampaknya tidak setia ini."
 bftb_bulgaria_factions.11.a: "Singkirkan dia sekarang juga!"
 bftb_bulgaria_factions.11.b: "Kita tidak boleh langsung mengambil kesimpulan."
 bftb_bulgaria_factions.12.t: "Persiapan Kudeta Zveno"
 bftb_bulgaria_factions.12.desc: "Berita telah sampai kepada kita bahwa Zveno akhirnya berani membuat pengaturan terakhir untuk kudeta militer yang telah mereka persiapkan dengan hati-hati sejak lama.\nMereka akan berusaha untuk menggulingkan pemerintah seperti yang mereka lakukan pada tahun 1934, tapi kali ini kita akan mencegah mereka berhasil, dan kita akan memberantas organisasi yang menyusahkan ini untuk selamanya."
 bftb_bulgaria_factions.12.a: "Kami akan menghancurkan mereka!"
 bftb_bulgaria_factions.17.t: "Zveno Terintegrasi"
 bftb_bulgaria_factions.17.desc: "Kami akhirnya mengintegrasikan Zveno ke dalam pemerintahan, meningkatkan kolaborasi yang sudah berkembang antara anggota organisasi sebelumnya dan partai kami. Dengan cara ini, kita sekarang dapat memupuk kerja sama untuk proyek-proyek yang lebih besar, dengan beberapa orang yang paling cerdas di negara kita bekerja sama."
 bftb_bulgaria_factions.17.a: "Mari kita manfaatkan pikiran itu segera!"
 bftb_bulgaria_factions.19.t: "Zveno Hancur!"
 bftb_bulgaria_factions.19.desc: "Selama beberapa minggu terakhir, pasukan polisi telah membasmi sisa-sisa Zveno, yang sudah sangat lemah dan tidak terorganisir karena kurangnya kepemimpinan yang kuat setelah penangkapan yang kami lakukan sebelum operasi ini.\nSekarang kami dapat dengan aman mengatakan bahwa Zveno sudah tidak ada lagi di [ROOT.GetNameDef], yang hanya dapat menguntungkan negara dan pemerintahnya."
 bftb_bulgaria_factions.19.a: "Berita Luar Biasa!"
 bftb_bulgaria_factions.20.t: "Pemogokan Pekerja"
 bftb_bulgaria_factions.20.desc: "Anggota faksi Sosialis Luas telah bergabung dengan komunis dalam upaya mereka untuk memicu pemogokan nasional di kalangan pekerja industri. Melalui pertemuan-pertemuan dan pertemuan-pertemuan rahasia mereka telah berhasil menggalang dukungan dan simpati yang besar di kalangan proletariat Bulgaria.\nKita harus bertindak dengan hati-hati ketika menerapkan ketertiban di daerah-daerah di mana para pemogok ini paling populer, jangan sampai situasinya meningkat menjadi sesuatu yang lebih serius dari sekadar pemogokan..."
 bftb_bulgaria_factions.20.a: "Kelaparan pada akhirnya akan membawa mereka kembali ke kawanannya"
 bftb_bulgaria_factions.20.b: "Kita harus menghancurkan mereka bagaimanapun caranya!"
 bftb_bulgaria_factions.21.t: "Kerusuhan Menyebabkan Kerusakan Tambahan"
 bftb_bulgaria_factions.21.desc: "Menyusul intervensi pasukan kami terhadap para pemogok, bentrokan dan kerusuhan menyebar di kawasan industri. Pada [?BUL.BUL_damaged_civs_state.GetName], kerusuhan merusak sejumlah pabrik sipil[GetMilitaryFactoriesDamaged].[GetInfrastructureDamaged]"
 bftb_bulgaria_factions.21.a: "Hasil yang disayangkan..."
 BUL_bs_strikes_no_military_factories_damaged: ""
 BUL_bs_strikes_military_factories_damaged_same_state: "sementara beberapa kelompok komunis berusaha membahayakan produksi senjata kita dengan menyabotase fasilitas militer di negara bagian tersebut"
 BUL_bs_strikes_military_factories_damaged_other_state: ". Pada [?BUL.BUL_damaged_mils_state.GetName], beberapa kelompok komunis berusaha membahayakan produksi senjata kita dengan menyabotase fasilitas militer"
 BUL_bs_strikes_no_infrastructure_damaged: ""
 BUL_bs_strikes_infrastructure_damaged: "Kerusuhan juga menyebabkan rusaknya dan diblokirnya jalan, jalur kereta api dan transportasi di [?BUL.BUL_damaged_infrastructure_state.GetName]."
 bftb_bulgaria_factions.27.t: "Sosialis Luas Terintegrasi"
 bftb_bulgaria_factions.27.desc: "Kami akhirnya mengintegrasikan Partai Sosialis Luas ke dalam pemerintahan, meningkatkan kolaborasi yang sudah berkembang antara anggota organisasi sebelumnya dan partai kami. Dengan cara ini, kita sekarang dapat memupuk kerja sama untuk proyek-proyek yang lebih besar, dengan beberapa orang yang paling cerdas di negara kita bekerja sama."
 bftb_bulgaria_factions.27.a: "Kita membutuhkan satu sama lain untuk mencapai kehebatan!"
 bftb_bulgaria_factions.29.t: "Kaum Sosialis Luas Dihancurkan"
 bftb_bulgaria_factions.29.desc: "Selama beberapa minggu terakhir, pasukan polisi telah membasmi sisa-sisa kaum Sosialis Luas, yang sudah sangat lemah dan tidak terorganisir karena kurangnya kepemimpinan yang kuat setelah penangkapan yang kami lakukan sebelum operasi ini.\nSekarang kami dapat dengan aman mengatakan bahwa Sosialis Luas sudah tidak ada lagi di [ROOT.GetNameDef], yang hanya dapat menguntungkan negara dan pemerintahnya."
 bftb_bulgaria_factions.29.a: "Butuh beberapa waktu..."
 bftb_bulgaria_factions.30.t: "Popularitas Agraris Meningkat di Pedesaan"
 bftb_bulgaria_factions.30.desc: "Persatuan Agraria Nasional secara ilegal melakukan kampanye propaganda di seluruh wilayah pedesaan di negara tersebut, di mana ribuan petani dimanipulasi untuk tidak mempercayai pemerintah dan bergabung dengan barisan mereka.\nKaum Agraria secara khusus mengkritik kebijakan-kebijakan suka berperang di masa lalu, yang membawa kehancuran dan penghinaan bagi Bulgaria, berupaya untuk menemukan sedikit kesamaan dengan kebijakan-kebijakan pemerintah saat ini untuk menimbulkan ketidakpuasan dan ketidakpastian di kalangan penduduk."
 bftb_bulgaria_factions.30.a: "Benar-benar tidak bisa diterima!"
 bftb_bulgaria_factions.31.t: "Divisi dalam Persatuan Nasional Agraria"
 bftb_bulgaria_factions.31.desc: "Terlepas dari kenyataan bahwa kaum Agraria dan Komunis belum pernah mempunyai sejarah kerja sama yang baik sebelumnya, nampaknya menemukan tujuan bersama dalam menggulingkan pemerintah telah berhasil menyatukan sayap-sayap tertentu dari Persatuan Agraria Nasional dan Partai Komunis.\nBeberapa dari kaum agraris telah memutuskan untuk meninggalkan organisasi dan bergabung dengan komunis, sementara yang lain, lebih konservatif, tetap setia pada perjuangan mereka melawan borjuasi dan penolakan mereka terhadap Bolshevisme, dan mencoba mencari cara politik untuk mencapai kesepahaman dengan Partai Komunis. pemerintah."
 bftb_bulgaria_factions.31.a: "Tikus sial!"
 bftb_bulgaria_factions.37.t: "Persatuan Nasional Agraria Terintegrasi"
 bftb_bulgaria_factions.37.desc: "Kami akhirnya mengintegrasikan Persatuan Nasional Agraria ke dalam pemerintahan, meningkatkan kolaborasi yang telah berkembang antara anggota organisasi sebelumnya dan partai kami. Dengan cara ini, kita sekarang dapat memupuk kerja sama untuk proyek-proyek yang lebih besar, dengan beberapa orang yang paling cerdas di negara kita bekerja sama."
 bftb_bulgaria_factions.37.a: "Hal ini akan membawa manfaat besar bagi negara."
 bftb_bulgaria_factions.39.t: "Persatuan Nasional Agraria Hancur"
 bftb_bulgaria_factions.39.desc: "Selama beberapa minggu terakhir, pasukan polisi telah membasmi sisa-sisa Persatuan Nasional Agraria yang sudah sangat lemah dan tidak terorganisir karena kurangnya kepemimpinan yang kuat setelah penangkapan yang kami lakukan sebelum operasi ini.\nSekarang kami dapat dengan aman mengatakan bahwa Persatuan Nasional Agraria sudah tidak ada lagi di [ROOT.GetNameDef], yang hanya dapat menguntungkan negara dan pemerintahnya."
 bftb_bulgaria_factions.39.a: "Mereka pergi untuk selamanya!"
 bftb_bulgaria_factions.40.t: "Maret pada [GetMarchDestinationName]"
 bftb_bulgaria_factions.40.desc: "Gerakan Sosial Nasional, yang meniru metode yang digunakan oleh Persatuan Legiun Muda Bulgaria bertahun-tahun yang lalu untuk meningkatkan popularitasnya, telah mengorganisir pawai dari [Root.Capital.GetName] ke [GetMarchDestinationName].\nBerjalan dengan obor seperti yang dilakukan Nazi, para pengunjuk rasa menuntut tindakan yang lebih drastis untuk menindas dan memberantas kelompok Bolshevik yang subversif, pembentukan sindikat pekerja nasional melawan perjuangan kelas dan intervensi negara yang lebih aktif dalam perekonomian Bulgaria dan masyarakat.\nSejauh ini nampaknya aksi unjuk rasa ini cukup populer di kalangan pemuda perkotaan, sehingga jika kita ingin menghentikan unjuk rasa seperti ini, sebaiknya kita lakukan secepatnya."
 bftb_bulgaria_factions.40.a: "Itu bahkan bukan protes asli!"
 bftb_bulgaria_factions.40.b: "Kita harus membungkam mereka sebelum mereka menjadi ancaman yang lebih besar"
 bftb_bulgaria_factions.47.t: "Gerakan Sosial Nasional Terpadu"
 bftb_bulgaria_factions.47.desc: "Kami akhirnya mengintegrasikan Gerakan Sosial Nasional ke dalam pemerintahan, meningkatkan kolaborasi yang telah berkembang antara anggota organisasi sebelumnya dan partai kami. Dengan cara ini, kita sekarang dapat memupuk kerja sama untuk proyek-proyek yang lebih besar, dengan beberapa orang yang paling cerdas di negara kita bekerja sama."
 bftb_bulgaria_factions.47.a: "Kami terus mengatakan ini untuk yang lebih baik..."
 bftb_bulgaria_factions.49.t: "Gerakan Sosialis Nasional Hancur"
 bftb_bulgaria_factions.49.desc: "Selama beberapa minggu terakhir, pasukan polisi telah membasmi sisa-sisa Gerakan Sosial Nasional, yang sudah sangat lemah dan tidak terorganisir karena kurangnya kepemimpinan yang kuat setelah penangkapan yang kami lakukan sebelum operasi ini.\nSekarang kami dapat dengan aman mengatakan bahwa Gerakan Sosial Nasional sudah tidak ada lagi di [ROOT.GetNameDef], yang hanya dapat menguntungkan negara dan pemerintahnya."
 bftb_bulgaria_factions.49.a: "Tidak ada yang akan merindukannya!"
 bftb_bulgaria_factions.50.t: "Anggota Zveno Ditekan"
 bftb_bulgaria_factions.50.desc: "Kami telah berhasil menindak organisasi Zveno, menangkap anggota yang dilaporkan berbicara secara terbuka menentang [ROOT.GetLeader] atau bahkan berkonspirasi untuk menggulingkan pemerintah."
 bftb_bulgaria_factions.50.a: "Mereka mendapatkan apa yang pantas mereka dapatkan"
 bftb_bulgaria_factions.51.t: "Anggota Zveno Ditekan"
 bftb_bulgaria_factions.51.desc: "Aparat keamanan kami telah melakukan tindakan represif besar-besaran terhadap organisasi Zveno. Pimpinan operasi mengklaim bahwa petugas polisi berhasil menangkap banyak individu bermasalah selama pertemuan rahasia organisasi tersebut, mengingat hasil operasi tersebut sangat sukses."
 bftb_bulgaria_factions.51.a: "Berita bagus!"
 bftb_bulgaria_factions.52.t: "Anggota Zveno Ditekan"
 bftb_bulgaria_factions.52.desc: "Sayangnya upaya kami untuk menindak organisasi Zveno gagal. Polisi menerobos masuk ke dalam apa yang mereka yakini sebagai pertemuan rahasia di mana Zveno berkomplot melawan pemerintah, namun meskipun memang ada anggota Zveno di sana, pertemuan tersebut tidak ada hubungannya dengan organisasi mereka atau bahkan dengan politik.\nTak perlu dikatakan lagi bahwa tindakan polisi ini belum begitu populer di kalangan penduduk Bulgaria, dan terlebih lagi di kalangan Zveno..."
 bftb_bulgaria_factions.52.a: "Sungguh memalukan..."
 bftb_bulgaria_factions.53.t: "Operasi untuk Memenjarakan Pemimpin Zveno"
 bftb_bulgaria_factions.53.desc: "Operasi untuk menangkap para pemimpin Zveno berhasil. Beberapa tokoh penting, termasuk Kimon Georgiev sendiri, telah ditangkap, sehingga memberikan pukulan telak bagi organisasi tersebut."
 bftb_bulgaria_factions.53.a: "Mereka tidak akan dapat menimbulkan masalah lagi!"
 bftb_bulgaria_factions.54.t: "Operasi untuk Memenjarakan Pemimpin Zveno"
 bftb_bulgaria_factions.54.desc: "Operasi untuk menangkap para pemimpin Zveno belum berhasil seperti yang kami harapkan. Meskipun pasukan polisi menangkap beberapa orang penting, pemimpin organisasi tersebut, Kimon Georgiev berhasil melarikan diri dan, meskipun bersembunyi, terus memimpin Zveno."
 bftb_bulgaria_factions.54.a: "Hasil yang mengecewakan..."
 bftb_bulgaria_factions.55.t: "Operasi untuk Memenjarakan Pemimpin Zveno"
 bftb_bulgaria_factions.55.desc: "Operasi untuk menangkap para pemimpin Zveno gagal total. Pasukan polisi menerobos ke dalam pertemuan rahasia, namun para agen, yang kalah jumlah, gagal menundukkan para hadirin, yang dengan cepat melarikan diri dari tempat yang dikejar oleh polisi, menyebabkan konfrontasi kekerasan di jalan-jalan kota dan menyebabkan banyak warga yang tidak bersalah terluka. Menghadapi kebrutalan polisi, banyak warga sipil di daerah tersebut mau tidak mau bersimpati dengan Zveno, membantu anggota organisasi tersebut melarikan diri dan bahkan bergabung dalam perlawanan melawan pasukan negara."
 bftb_bulgaria_factions.55.a: "Seseorang harus membayar kegagalan ini!"
 bftb_bulgaria_factions.60.t: "Kaum Sosialis Luas Ditindas"
 bftb_bulgaria_factions.60.desc: "Kami telah berhasil menindak kelompok Sosialis Luas, menangkap anggota yang dilaporkan mencoba menghasut protes atau memprovokasi kerusuhan di kalangan masyarakat."
 bftb_bulgaria_factions.60.a: "Mereka mendapatkan apa yang pantas mereka dapatkan"
 bftb_bulgaria_factions.61.t: "Kaum Sosialis Luas Ditindas"
 bftb_bulgaria_factions.61.desc: "Pasukan keamanan kami telah melakukan tindakan represif besar-besaran terhadap kaum Sosialis Luas. Petugas polisi dilaporkan berhasil menangkap sejumlah individu bermasalah selama pertemuan rahasia di mana beberapa pemimpin Sosialis Luas bertemu dengan anggota organisasi pekerja dan bahkan partai komunis. Kapolri mengklaim hasil operasi tersebut sangat sukses."
 bftb_bulgaria_factions.61.a: "Berita bagus!"
 bftb_bulgaria_factions.62.t: "Kaum Sosialis Luas Ditindas"
 bftb_bulgaria_factions.62.desc: "Sayangnya upaya kami untuk menindak kaum Sosialis Luas gagal. Polisi dengan kekerasan mendobrak apa yang mereka yakini sebagai pertemuan rahasia di mana kaum Sosialis Luas bertemu dengan anggota organisasi pekerja dan partai komunis untuk mengorganisir pemogokan industri baru, namun ternyata kaum Sosialis Luas hanya menikmati ceramah Todor Pavlov tentang materialisme dialektis, yang membuktikan bahwa penampilan polisi yang spektakuler sama sekali tidak berguna.\nTak perlu dikatakan lagi bahwa tindakan polisi ini belum terlalu populer di kalangan penduduk Bulgaria, dan terlebih lagi di kalangan Sosialis Luas..."
 bftb_bulgaria_factions.62.a: "Sungguh memalukan..."
 bftb_bulgaria_factions.63.t: "Operasi untuk Memenjarakan Pemimpin Sosialis Luas"
 bftb_bulgaria_factions.63.desc: "Operasi untuk menangkap para pemimpin Sosialis Luas telah berhasil. Pasukan polisi telah menahan sebagian besar tokoh penting yang terkait dengan organisasi tersebut, sehingga memberikan pukulan telak bagi kaum Sosialis Luas."
 bftb_bulgaria_factions.63.a: "Mereka tidak akan dapat menimbulkan masalah lagi!"
 bftb_bulgaria_factions.64.t: "Operasi untuk Memenjarakan Pemimpin Sosialis Luas"
 bftb_bulgaria_factions.64.desc: "Operasi untuk menangkap para pemimpin Sosialis Luas belum berhasil seperti yang kita harapkan. Meskipun pasukan polisi menangkap beberapa orang penting, beberapa pemimpin organisasi berhasil melarikan diri dan, meskipun bersembunyi, mereka terus memimpin Sosialis Luas."
 bftb_bulgaria_factions.64.a: "Hasil yang mengecewakan..."
 bftb_bulgaria_factions.65.t: "Operasi untuk Memenjarakan Pemimpin Sosialis Luas"
 bftb_bulgaria_factions.65.desc: "Operasi untuk menangkap para pemimpin Sosialis Luas telah gagal total. Pasukan polisi menerobos ke dalam pertemuan rahasia, namun para agen, yang kalah jumlah, gagal menundukkan para hadirin, yang dengan cepat melarikan diri dan mencari dukungan dari rekan-rekan proletar mereka, menyebabkan konfrontasi kekerasan di jalan-jalan kota dan menyebabkan banyak warga yang tidak bersalah terluka. Menghadapi kebrutalan polisi, banyak warga sipil di wilayah tersebut mau tidak mau bersimpati dengan kelompok Sosialis Luas, membantu anggota organisasi tersebut melarikan diri dan bahkan bergabung dalam perlawanan melawan pasukan negara."
 bftb_bulgaria_factions.65.a: "Seseorang harus membayar kegagalan ini!"
 bftb_bulgaria_factions.70.t: "Anggota Serikat Agraria Ditindas"
 bftb_bulgaria_factions.70.desc: "Kami telah berhasil menindak Persatuan Nasional Agraria, menangkap anggota yang dilaporkan berbicara secara terbuka menentang pemerintah atau mencoba memicu protes di kalangan masyarakat."
 bftb_bulgaria_factions.70.a: "Mereka mendapatkan apa yang pantas mereka dapatkan"
 bftb_bulgaria_factions.71.t: "Anggota Serikat Agraria Ditindas"
 bftb_bulgaria_factions.71.desc: "Aparat keamanan kita telah melakukan tindakan represif besar-besaran terhadap Persatuan Nasional Agraria. Polisi membubarkan beberapa unjuk rasa Serikat Agraria yang berlangsung serentak di berbagai kota di seluruh Bulgaria, yang bertujuan untuk menimbulkan keresahan di kalangan penduduk pedesaan. Laporan resmi polisi menyatakan bahwa hasilnya sangat sukses."
 bftb_bulgaria_factions.71.a: "Berita bagus!"
 bftb_bulgaria_factions.72.t: "Anggota Serikat Agraria Ditindas"
 bftb_bulgaria_factions.72.desc: "Sayangnya upaya kami untuk menindak Persatuan Nasional Agraria gagal. Polisi membobol apa yang mereka yakini sebagai unjuk rasa rahasia di pedesaan di mana para pemimpin Serikat Agraria membujuk para petani agar berbalik melawan pemerintah, namun ternyata acara tersebut hanyalah sebuah ceramah mengenai buku Aleksandar Stamboliyski \"Partai Politik atau Organisasi Estatist\", yang membuat penampilan polisi sama sekali tidak berguna.\nTak perlu dikatakan lagi bahwa tindakan polisi ini tidak terlalu populer di kalangan penduduk Bulgaria, dan terlebih lagi di kalangan Serikat Agraria..."
 bftb_bulgaria_factions.72.a: "Sungguh memalukan..."
 bftb_bulgaria_factions.73.t: "Operasi untuk Memenjarakan Pemimpin Serikat Agraria"
 bftb_bulgaria_factions.73.desc: "Operasi penangkapan para pemimpin Persatuan Nasional Agraria berhasil. Pasukan polisi telah menahan sebagian besar tokoh penting yang terkait dengan organisasi tersebut, termasuk Nikola Petkov sendiri, yang merupakan pukulan telak terhadap Serikat Agraria."
 bftb_bulgaria_factions.73.a: "Mereka tidak akan dapat menimbulkan masalah lagi!"
 bftb_bulgaria_factions.74.t: "Operasi untuk Memenjarakan Pemimpin Serikat Agraria"
 bftb_bulgaria_factions.74.desc: "Operasi penangkapan pimpinan Persatuan Nasional Agraria belum berhasil seperti yang kita harapkan. Meskipun pasukan polisi menangkap beberapa orang penting, Nikola Petkov berhasil melarikan diri dan, meski bersembunyi, terus memimpin organisasi."
 bftb_bulgaria_factions.74.a: "Hasil yang mengecewakan..."
 bftb_bulgaria_factions.75.t: "Operasi untuk Memenjarakan Pemimpin Serikat Agraria"
 bftb_bulgaria_factions.75.desc: "Operasi penangkapan para pemimpin Persatuan Nasional Agraria gagal total. Pasukan polisi menerobos ke dalam pertemuan rahasia, namun para agen, yang kalah jumlah, gagal menundukkan para hadirin, yang dengan cepat meninggalkan tempat itu dan mencari dukungan rakyat di kota, menyebabkan konfrontasi kekerasan di jalan-jalan kota dan menyebabkan banyak warga yang tidak bersalah terluka. Menghadapi kebrutalan polisi, banyak warga sipil di wilayah tersebut mau tidak mau bersimpati dengan Serikat Agraria, membantu anggota organisasi tersebut melarikan diri dan bahkan bergabung dalam perlawanan melawan pasukan negara."
 bftb_bulgaria_factions.75.a: "Seseorang harus membayar kegagalan ini!"
 bftb_bulgaria_factions.80.t: "Anggota Gerakan Sosial Nasional Ditindas"
 bftb_bulgaria_factions.80.desc: "Kami telah berhasil menindak Gerakan Sosial Nasional, menangkap anggota yang dilaporkan berusaha menimbulkan agitasi dengan memberikan pidato kebencian di depan umum terhadap organisasi tertentu, dan bahkan terhadap [ROOT.GetLeader] sendiri."
 bftb_bulgaria_factions.80.a: "Mereka mendapatkan apa yang pantas mereka dapatkan"
 bftb_bulgaria_factions.81.t: "Anggota Gerakan Sosial Nasional Ditindas"
 bftb_bulgaria_factions.81.desc: "Aparat keamanan kita telah melakukan tindakan represif besar-besaran terhadap Gerakan Sosial Nasional. Polisi melakukan unjuk rasa besar-besaran di mana beberapa pemimpin Gerakan Sosial Nasional yang bermasalah menyampaikan pidato kebencian terhadap [ROOT.GetLeader] dan mengorganisir unjuk rasa berikutnya untuk memprotes pemerintah. Sebagian besar dari kelompok radikal ini ditangkap dan laporan resmi menyatakan bahwa hasil dari operasi tersebut sangat sukses."
 bftb_bulgaria_factions.81.a: "Berita bagus!"
 bftb_bulgaria_factions.82.t: "Anggota Gerakan Sosial Nasional Ditindas"
 bftb_bulgaria_factions.82.desc: "Sayangnya upaya kami untuk menindak Gerakan Sosial Nasional gagal. Polisi menerobos masuk ke markas besar organisasi tersebut dan mereka yakin bahwa sedang terjadi unjuk rasa rahasia untuk mengorganisir pawai fasis berikutnya, namun acara tersebut ternyata hanya sebuah konferensi mengenai kebijakan ekonomi modern, yang diselenggarakan oleh Aleksandar Tsankov sendiri, sehingga menjadikan penampilan polisi sama sekali tidak berguna.\nTak perlu dikatakan lagi bahwa tindakan polisi ini belum terlalu populer di kalangan penduduk Bulgaria, dan terlebih lagi di kalangan Gerakan Sosial Nasional..."
 bftb_bulgaria_factions.82.a: "Sungguh memalukan..."
 bftb_bulgaria_factions.83.t: "Operasi untuk Memenjarakan Pemimpin Gerakan Sosial Nasional"
 bftb_bulgaria_factions.83.desc: "Operasi penangkapan pimpinan Gerakan Sosial Nasional berhasil. Pasukan polisi telah menahan sebagian besar tokoh penting yang terkait dengan organisasi tersebut, termasuk Aleksandar Tsankov sendiri, yang merupakan pukulan telak bagi organisasi tersebut."
 bftb_bulgaria_factions.83.a: "Mereka tidak akan dapat menimbulkan masalah lagi!"
 bftb_bulgaria_factions.84.t: "Operasi untuk Memenjarakan Pemimpin Gerakan Sosial Nasional"
 bftb_bulgaria_factions.84.desc: "Operasi penangkapan pimpinan Gerakan Sosial Nasional belum berhasil seperti yang kita harapkan. Meskipun pasukan polisi menangkap beberapa orang penting, Aleksandar Tsankov berhasil melarikan diri dan, meski bersembunyi, terus memimpin organisasi."
 bftb_bulgaria_factions.84.a: "Hasil yang mengecewakan..."
 bftb_bulgaria_factions.85.t: "Operasi untuk Memenjarakan Pemimpin Gerakan Sosial Nasional"
 bftb_bulgaria_factions.85.desc: "Operasi penangkapan para pemimpin Gerakan Sosial Nasional gagal total. Pasukan polisi menerobos ke dalam pertemuan rahasia, namun para agen, yang kalah jumlah, gagal menundukkan para hadirin, yang dengan cepat melarikan diri dari tempat yang dikejar oleh polisi, menyebabkan konfrontasi kekerasan di jalan-jalan kota dan menyebabkan banyak warga yang tidak bersalah terluka. Menghadapi kebrutalan polisi, banyak warga sipil di wilayah tersebut mau tidak mau bersimpati dengan Gerakan Sosial Nasional, membantu anggota organisasi tersebut melarikan diri dan bahkan ikut berperang melawan pasukan negara."
 bftb_bulgaria_factions.85.a: "Seseorang harus membayar kegagalan ini!"
 BUL_repress_imro_flag: "Telah menekan IMRO"
 bftb_bulgaria_imro.1.t: "IMRO Kembali!"
 bftb_bulgaria_imro.1.desc: "Sumber yang dapat dipercaya telah memberi tahu kami bahwa anggota IMRO telah melintasi perbatasan, bersenjatakan senjata Bulgaria, dan mengorganisir gerakan anti-[ROOT.GetAdjective] di wilayah Makedonia."
 bftb_bulgaria_imro.1.a: "Kembali ke awal tahun 1930an..."
 bftb_bulgaria_imro.2.t: "Sentimen Bulgaria Bangkit di Makedonia"
 bftb_bulgaria_imro.2.desc: "Aktivis IMRO dan warga Makedonia pro-Bulgaria lainnya saat ini menyebarkan sentimen Bulgaria di kalangan penduduk Makedonia.\nSebagai konsekuensinya, gelombang baru ketidakstabilan dan penentangan terhadap pemerintah [ROOT.GetAdjective] melanda wilayah tersebut."
 bftb_bulgaria_imro.2.a: "Saatnya berurusan dengan IMRO, sekali lagi..."
 bftb_bulgaria_fatherland_front.1.t: "Front Tanah Air"
 bftb_bulgaria_fatherland_front.1.desc_positive: "Kita akhirnya dapat menuai hasil dari upaya besar kita untuk menyatukan kelompok-kelompok politik dan ideologi yang sangat berbeda dalam satu front melawan kediktatoran militeristik pro-Jerman di Bulgaria.\nKami telah membentuk Front Tanah Air, yang diintegrasikan tidak hanya oleh Partai Komunis, tetapi juga oleh mantan anggota Zveno, Sosialis Luas, Agraria dan formasi lainnya, yang sekarang, bersama-sama, menentang borjuasi yang mendominasi negara dan tidak akan ragu untuk menghancurkannya lagi dalam pencarian dari kekayaannya sendiri."
 bftb_bulgaria_fatherland_front.1.desc_negative: "Kaum komunis, bersama dengan anggota organisasi lain, telah membentuk Front Tanah Air, sebuah gerakan perlawanan politik yang menjadi sangat populer di kalangan proletariat dan bahkan dapat menimbulkan ancaman untuk menggulingkan pemerintah dalam waktu dekat."
 bftb_bulgaria_fatherland_front.1.a: "Bersatu, kita lebih kuat!"
 bftb_bulgaria_fatherland_front.1.b: "Trik komunis lainnya pasti akan gagal"
 bftb_bulgaria_fatherland_front.2.t: "Front Tanah Air Menyerang!"
 bftb_bulgaria_fatherland_front.2.desc: "Saat ini, mengikuti rencana yang telah diatur sebelumnya, organisasi lokal Front Tanah Air dan formasi partisan bersenjata telah mengambil alih balai kota dan administrasi distrik di seluruh negeri.\nPara pemberontak menghadapi sedikit atau tidak ada perlawanan sama sekali di sepanjang pantai Laut Hitam dari Burgas hingga Varna[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]."
 bftb_bulgaria_fatherland_front.2.desc_no_support: ""
 bftb_bulgaria_fatherland_front.2.desc_has_bs_support: ", dan di Plovdiv, kelas pekerja turun ke jalan secara massal untuk mendukung pemberontakan, dan berhasil menguasai wilayah tersebut setelah beberapa jam pertempuran jalanan."
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support: ".\nKabarnya, dukungan kaum agraris juga turut menentukan keberhasilan kudeta di wilayah pedesaan Moesia"
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support: ".\nDi Sofia, mantan perwira militer Zveno menduduki fasilitas komunikasi dan bergegas menuju Majelis Nasional, memaksa pasukan setia yang tidak siap untuk menyerah"
 bftb_bulgaria_fatherland_front.2.desc_has_partisan_support: ".\nYang terakhir, kelompok partisan [GetPartisanFfSupportNationalities] telah bergabung dengan kudeta Front Tanah Air dan menantang kendali atas wilayah pendudukan"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre: "Yunani"
 bftb_bulgaria_fatherland_front.2.desc_partisans_yug: "Yugoslavia"
 bftb_bulgaria_fatherland_front.2.desc_partisans_both: "Yunani dan Yugoslavia"
 bftb_bulgaria_fatherland_front.2.a: "Kalau begitu, ini perang saudara!"
 BUL_zveno_dissidents_tt: "Jika kita tidak menangani faksi [GetZvenoName] tepat waktu, anggota organisasi ini mungkin dapat melakukan kudeta militer di masa depan."
 BUL_exposed_zveno_conspirator_tt: "Hal ini akan sedikit menunda kudeta apa pun yang mungkin direncanakan oleh faksi [GetZvenoName]."
 BUL_bs_strikes_no_violence_tt: "Sejumlah pabrik akan mengalami kerusakan dalam prosesnya.\nDukungan yang tinggi terhadap §YKomunisme§! dan popularitas [GetBsName] yang tinggi dapat memperburuk situasi."
 bftb_bulgaria_rearmament.1.t: "[BUL.GetAdjective] Negosiasi Persenjataan Kembali"
 bftb_bulgaria_rearmament.1.desc: "[BUL.GetAdjective] Pemerintah telah secara terbuka menetapkan kebijakan perdamaian yang akan diikuti oleh [BUL.GetNameDef] di Balkan, dan sekarang mendesak kita untuk melakukan negosiasi pencabutan pembatasan militer yang ketat yang diberlakukan terhadap negara tersebut setelah kekalahannya dalam Perang Besar.\nMereka menyatakan bahwa mereka perlu segera memulai persenjataan kembali jika ingin membangun kekuatan militer modern yang mampu mempertahankan kedaulatan dan penentuan nasib sendiri rakyat [BUL.GetAdjective]."
 bftb_bulgaria_rearmament.1.a: "Mereka hanya menawarkan janji-janji kosong."
 bftb_bulgaria_rearmament.1.b: "Kami akan menuntut perjanjian resmi untuk menjaga perdamaian."
 bftb_bulgaria_rearmament.1.c: "Kita harus mengakhiri pembatasan mereka!"
 bftb_bulgaria_rearmament.1_refuse_tt: "[BUL.GetNameDefCap] tidak akan dapat memulai persenjataan kembali mereka, untuk saat ini."
 bftb_bulgaria_rearmament.1_nap_tt: "[BUL.GetNameDefCap] akan dapat memulai persenjataan kembali segera setelah mereka menyelesaikan Pakta Non-Agresi dengan [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] atau [TUR.GetFlag][TUR.GetNameDefCap]."
 bftb_bulgaria_rearmament.2.t: "[ENG.GetNameDefCap] Menolak [ROOT.GetAdjective] Persenjataan kembali"
 bftb_bulgaria_rearmament.2.desc: "Pemerintah [ENG.GetAdjective] telah menolak untuk mencabut pembatasan apa pun terhadap angkatan bersenjata kita, tampaknya tidak peduli dengan meningkatnya ketegangan di Eropa dan kemungkinan [ROOT.GetNameDef] akan menyerah tanpa daya kepada kekuatan yang sedang bangkit jika terjadi perubahan dalam keseimbangan rapuh yang ada di Balkan."
 bftb_bulgaria_rearmament.2.a: "Kita harus menemukan cara persuasi lain..."
 bftb_bulgaria_rearmament.3.t: "[ENG.GetAdjective] Tuntutan untuk Mengizinkan [ROOT.GetNameDef] Persenjataan Kembali"
 bftb_bulgaria_rearmament.3.desc: "Sebelum mencabut pembatasan apa pun terhadap angkatan bersenjata kita, pemerintah [ENG.GetAdjective] menuntut agar [ROOT.GetNameDef] menandatangani perjanjian resmi dengan salah satu tetangganya, sebagai titik awal untuk akhirnya mengembangkan diplomasi persahabatan di Balkan."
 bftb_bulgaria_rearmament.3.a: "Kendala lain yang harus diatasi..."
 BUL_uk_demands_nap_with_balkan_nation_tt: "§YPembatasan Tentara§! Semangat Nasional akan dihapus setelah menandatangani §YPakta Non-Agresi§! dengan [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] atau [TUR.GetFlag][TUR.GetNameDefCap]."
 bftb_bulgaria_rearmament.4.t: "Pembatasan Tentara Dicabut"
 bftb_bulgaria_rearmament.4.desc: "Setelah memenuhi tuntutan [ENG.GetAdjective] dan menandatangani Pakta Non-Agresi dengan [GetNapTarget], [ENG.GetNameDef] akhirnya mencabut pembatasan terhadap militer kita dan persenjataan kembali tentara [ROOT.GetAdjective] akhirnya dapat dimulai."
 bftb_bulgaria_rearmament.4.a: "Ayo mulai bekerja!"
 BUL_nap_with_greece: "[GRE.GetNameDefCap]"
 BUL_nap_with_yugoslavia: "[YUG.GetNameDefCap]"
 BUL_nap_with_romania: "[ROM.GetNameDefCap]"
 BUL_nap_with_turkey: "[TUR.GetNameDefCap]"
 bftb_bulgaria_rearmament.5.t: "[BUL.GetAdjective] Pembatasan Tentara Dicabut"
 bftb_bulgaria_rearmament.5.desc: "Setelah memenuhi tuntutan [ROOT.GetAdjective] dan menyelesaikan Pakta Non-Agresi dengan [GetNapTarget], delegasi [BUL.GetAdjective] telah tiba di London dan siap untuk menandatangani perjanjian resmi yang memungkinkan [BUL.GetNameDef] memulai persenjataan kembali militer."
 bftb_bulgaria_rearmament.5.a: "Mari kita selesaikan ini."
 bftb_bulgaria_rearmament.6.t: "[ENG.GetNameDefCap] Mencabut Batasan Tentara kita"
 bftb_bulgaria_rearmament.6.desc: "Setelah negosiasi yang sulit di Sofia dengan delegasi dari [ENG.GetNameDef], kami telah menandatangani perjanjian dimana pemerintah [ENG.GetAdjective] telah mencabut pembatasan terhadap tentara kami dan [ROOT.GetNameDef] akhirnya dapat memulai persenjataan kembali militer."
 bftb_bulgaria_rearmament.6.a: "Tidak ada waktu yang terbuang, mulailah mempersenjatai kembali!"
 bftb_bulgaria_rearmament.7.t: "[BUL.GetNameDefCap] Tekanan untuk Mencabut Pembatasan Tentara"
 bftb_bulgaria_rearmament.7.desc: "Delegasi [BUL.GetAdjective] telah tiba di London dengan tujuan menekan pemerintah [ROOT.GetAdjective] agar mencabut pembatasan militer terhadap [BUL.GetNameDef].\nDengan perang yang kembali terjadi di Balkan, mereka memastikan bahwa [BUL.GetNameDef] akan segera memulai persiapan untuk mempertahankan integritas teritorialnya, dengan satu atau lain cara."
 bftb_bulgaria_rearmament.7.a: "Kami tidak akan menyerah pada ancaman!"
 bftb_bulgaria_rearmament.7.b: "Tidak ada cara lain... Cabut batasan mereka!"
 bftb_bulgaria_rearmament.8.t: "[ENG.GetNameDefCap] Tidak Akan Menyerah Pada Tekanan Kita"
 bftb_bulgaria_rearmament.8.desc: "Delegasi [ROOT.GetAdjective] yang dikirim ke London untuk menekan pemerintah [ENG.GetAdjective] agar mencabut pembatasan terhadap tentara kita telah kembali dengan berita buruk: [ENG.GetNameDef] tidak akan menyerah pada tuntutan kita dan tidak akan mengizinkan [ROOT.GetNameDef] untuk memulai persenjataan kembali."
 bftb_bulgaria_rearmament.8.a: "Jadi mereka tidak memberi kita pilihan..."
 bftb_bulgaria_rearmament.9.t: "[BUL.GetNameDefCap] Tidak Akan Mematuhi Pembatasan Militer"
 bftb_bulgaria_rearmament.9.desc: "Seorang diplomat [BUL.GetAdjective] yang dikirim oleh [BUL.GetLeader] sendiri telah tiba di negara kami untuk memberi tahu kami bahwa[GetReasonForNotAbiding]."
 bftb_bulgaria_rearmament.9.a: "Kami akan menanganinya nanti..."
 bftb_bulgaria_rearmament.9.b: "Mereka harus membayar untuk ini!"
 bftb_bulgaria_rearmament.9.desc_reason_war: ", karena konflik militer yang melibatkan mereka, [BUL.GetNameDef] akan segera mempersenjatai kembali untuk menjaga kemerdekaan nasional dan kebebasan rakyatnya"
 bftb_bulgaria_rearmament.9.desc_reason_faction: "sekarang mereka didukung oleh [BUL.GetFactionName], [BUL.GetNameDef] tidak akan lagi mematuhi pembatasan yang diberlakukan pada angkatan bersenjatanya"
 bftb_bulgaria_nationalization.1.t: "[FROM.GetNameDefCap] Menyita Anak Perusahaan kami"
 bftb_bulgaria_nationalization.1.desc: "Dengan dukungan [GetTsarLoyalistOrPartyName], [GetLeaderNameIfRegencyCouncil] dari [BUL.GetNameDef] telah mengesahkan undang-undang baru dimana semua anak perusahaan asing di negara tersebut telah dinasionalisasi, yang selanjutnya menjadi milik negara [BUL.GetAdjective].\nSerangan kurang ajar terhadap kepentingan [ROOT.GetAdjective] di [BUL.GetNameDef] telah diterima sebagai pukulan telak bagi eselon atas, terutama para raja industri yang telah berinvestasi dalam jumlah besar dalam pembangunan infrastruktur dan anak perusahaan di [BUL.GetNameDef], yang telah diambil alih secara keji."
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists: "menteri yang setia"
 bftb_bulgaria_nationalization.1.desc_party_name: "menteri dari [BUL.GetRulingPartyLong]"
 bftb_bulgaria_nationalization.1.desc_regency_council: "Bogdan Filov dan [BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_regular_leader: "[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.a: "Kami tidak bisa berbuat apa-apa sekarang..."
 bftb_bulgaria_nationalization.1.b: "Embargo perdagangan akan mengajarkan mereka rasa hormat!"
 bftb_bulgaria_nationalization.1.c: "Kami akan mengirimkan delegasi diplomatik... Dipimpin oleh tank!"
 bftb_bulgaria_nationalization.1.d: "Enyahlah para pengkhianat yang tidak tahu berterima kasih ini!"
 bftb_bulgaria_nationalization.2.t: "[FROM.GetAdjective] Embargo Perdagangan terhadap Bulgaria"
 bftb_bulgaria_nationalization.2.desc: "Menanggapi [ROOT.GetAdjective] nasionalisasi anak perusahaan dan kantor cabang asing, [FROM.GetNameDef] telah memutuskan untuk memberlakukan embargo terhadap negara kita[GetEmbargoAllies].\nBeberapa orang mengatakan bahwa situasi ini bisa saja menjadi lebih buruk, namun faktanya adalah sektor-sektor tertentu, yang fokus pada impor dan ekspor barang, sangat terkena dampak embargo ini."
 bftb_bulgaria_nationalization.2.desc_no_allies: ""
 bftb_bulgaria_nationalization.2.desc_allies: ", sebuah embargo yang juga didukung oleh sekutunya"
 bftb_bulgaria_nationalization.2.a: "Sungguh dramatis..."
 bftb_bulgaria_nationalization.3.t: "[FROM.GetNameDefCap] telah mengeluarkan kami dari [FROM.GetFactionName]"
 bftb_bulgaria_nationalization.3.desc: "Pemerintah [FROM.GetAdjective] telah menyerah pada tekanan dari investor dan taipan industri yang, sebagai tanggapan terhadap [BUL.GetAdjective] nasionalisasi anak perusahaan asing, menuntut agar [FROM.GetNameDef] tidak hanya memberlakukan embargo perdagangan terhadap [BUL.GetNameDef], tetapi juga mengeluarkan negara tersebut dari [FROM.GetFactionName].\nEmbargo[GetEmbargoAndKickAllies] akan berdampak serius pada beberapa sektor perekonomian nasional, tetapi bahkan lebih buruk lagi adalah bahwa negara kita sekarang dihadapkan pada ambisi teritorial negara-negara tetangganya, yang pasti akan segera mengambil keuntungan dari situasi [BUL.GetNameDef] yang agak mengerikan."
 bftb_bulgaria_nationalization.3.desc_no_allies: ""
 bftb_bulgaria_nationalization.3.desc_allies: ", diikuti oleh sekutu [FROM.GetNameDef],"
 bftb_bulgaria_nationalization.3.a: "Kita seharusnya mengharapkan ini!"
 bftb_bulgaria_uranium_mining_concessions.1.t: "[FROM.GetNameDefCap] Konsesi Penambangan Uranium"
 bftb_bulgaria_uranium_mining_concessions.1.desc: "Hubungan baik kami dengan sekutu [FROM.GetAdjective] baru saja membuahkan hasil: pemerintah [FROM.GetAdjective] telah memberi kami hak eksploitasi atas deposit uranium mereka di dekat kota Buhovo. Mereka mengklaim bahwa teknologi mereka masih jauh dari mampu memanfaatkan bahan tersebut dengan baik, sehingga mereka lebih memilih untuk menandatangani perjanjian konsesi dimana kami akan mengendalikan tambang di Buhovo dengan imbalan produk-produk dasar untuk industri dan pertanian Bulgaria.\nPerjanjian yang menguntungkan ini tidak hanya akan memberi kita sumber uranium baru, namun tidak diragukan lagi akan semakin meningkatkan hubungan antara [GER.GetNameDef] dan [BUL.GetNameDef]."
 bftb_bulgaria_uranium_mining_concessions.1.a: "Kami akan memanfaatkannya dengan baik."
 bftb_bulgarian_claims.1.t: "Bulgaria Mengupayakan Klaim Balkan Dijamin"
 bftb_bulgarian_claims.1.desc: "Delegasi dari [BUL.GetNameDef] telah mendekati pemerintah kami untuk meminta dukungan [ROOT.GetAdjective] atas klaim mereka di Balkan dan berusaha untuk secara diam-diam bernegosiasi dan mengamankan perluasan wilayah [BUL.GetAdjective] di wilayah tersebut dalam waktu dekat, sebagai imbalan atas penyelarasan [BUL.GetAdjective] dengan [ROOT.GetNameDef] dan masuknya negara tersebut ke dalam [ROOT.GetFactionName]."
 bftb_bulgarian_claims.1.a: "Kenali klaim Bulgaria."
 bftb_bulgarian_claims.1.b: "Kami akan mengatur perluasan wilayah apa pun sesuai keinginan kami!"
 bftb_bulgarian_claims.1.a_tt: "Negara bagian dengan Pengubah §YPerluasan Wilayah Bulgaria yang Diatur Sebelumnya§! akan dipindahkan ke [BUL.GetNameDef] setelah sekutu faksi mana pun menguasai negara bagian tersebut dan [BUL.GetNameDef] telah bergabung dengan [ROOT.GetFactionName]."
 bftb_bulgarian_claims.2.t: "[GER.GetNameDefCap] Mengakui Klaim kami"
 bftb_bulgarian_claims.2.desc: "Delegasi [ROOT.GetAdjective] yang dikirim ke [FROM.Capital.GetName] untuk merundingkan perluasan wilayah kami di Balkan telah kembali ke [ROOT.Capital.GetName] untuk memberi tahu kami bahwa misi tersebut berhasil sepenuhnya. Mereka telah membuat perjanjian rahasia dengan [FROM.GetAdjective] dimana [FROM.GetNameDef] mengakui klaim kami dan setuju untuk memberikan [ROOT.GetNameDef] kendali atas mereka setelah kami secara resmi bergabung dengan [FROM.GetFactionName], dan mengambil peran sebagai penjaga perdamaian di negara-negara Balkan yang diduduki."
 bftb_bulgarian_claims.2.a: "Kesepakatan yang sulit diperbaiki!"
 bftb_bulgarian_claims.3.t: "[GER.GetNameDefCap] Menolak Klaim kami"
 bftb_bulgarian_claims.3.desc: "Delegasi [ROOT.GetAdjective] yang dikirim ke [FROM.Capital.GetName] untuk merundingkan pengakuan [FROM.GetAdjective] atas klaim kami di Balkan telah kembali ke [ROOT.Capital.GetName] untuk memberi tahu kami bahwa mereka gagal dalam misi mereka untuk mencapai kesepakatan dengan [FROM.GetNameDef] untuk mengamankan perluasan wilayah [ROOT.GetAdjective] di Balkan."
 bftb_bulgarian_claims.3.a: "Kita harus menggunakan cara-cara yang tidak terlalu halus untuk memperluas, lalu..."
 bftb_bulgarian_claims.4.t: "[GER.GetNameDefCap] Memberikan Kontrol Bulgaria"
 bftb_bulgarian_claims.4.desc: "Sebagaimana disepakati sebelumnya, [GER.GetNameDef] telah memerintahkan pengalihan kendali atas wilayah yang saat ini diduduki oleh kekuasaan [GER.GetFactionName] dan diklaim oleh [ROOT.GetNameDef], yang selanjutnya akan dikelola oleh pemerintah [ROOT.GetAdjective]."
 bftb_bulgarian_claims.4.a: "Kami mengambil apa yang menjadi hak kami!"
 bftb_bulgarian_claims.5.t: "Pendudukan Bulgaria Diberikan"
 bftb_bulgarian_claims.5.desc: "Sebagaimana disepakati sebelumnya, kami telah memerintahkan pengalihan kendali atas wilayah yang saat ini diduduki oleh kekuasaan [GER.GetFactionName] dan diklaim oleh [ROOT.GetNameDef], yang selanjutnya akan dikelola oleh pemerintah [ROOT.GetAdjective]."
 bftb_bulgarian_claims.5.a: "Itu adalah bagian dari tawar-menawar kami"
 bftb_bulgarian_claims.6.t: "[GER.GetNameDefCap] Memberikan Pendudukan Bulgaria"
 bftb_bulgarian_claims.6.desc: "Sebagaimana disepakati sebelumnya oleh pemerintah [GER.GetAdjective] dan [BUL.GetAdjective], [GER.GetNameDef] telah memerintahkan pengalihan kendali atas wilayah yang diklaim oleh [BUL.GetNameDef] dan saat ini diduduki oleh kami, yang selanjutnya akan dikelola oleh pemerintah [BUL.GetAdjective]."
 bftb_bulgarian_claims.6.a: "Para pemula Bulgaria itu!"
 bftb_bulgarian_claims.6.b: "Mereka tidak punya hak!"
 bftb_bulgarian_claims.7.t: "[FROM.GetNameDefCap] Meminta Kontrol Atas [FROM.FROM.GetName]"
 bftb_bulgarian_claims.7.desc: "Dengan mengambil peran penjaga perdamaian mereka di wilayah Balkan yang diduduki, [FROM.GetAdjective] telah mengusulkan agar kami memberi mereka kendali administratif atas [FROM.FROM.GetName] untuk menjaga ketertiban dan stabilitas di wilayah yang diambil alih oleh [ROOT.GetFactionName] dan untuk membebaskan garnisun [ROOT.GetAdjective] sehingga pasukan kita dapat memperkuat front lain."
 bftb_bulgarian_claims.7.a: "Setuju, kami membutuhkan pasukan kami di tempat lain!"
 bftb_bulgarian_claims.7.b: "Ambisi teritorial Bulgaria tidak terbatas!"
 bftb_bulgarian_claims.8.t: "[FROM.GetNameDefCap] Mentransfer Kontrol Atas [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.8.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk memberikan [ROOT.GetNameDef] kendali administratif atas [FROM.FROM.FROM.GetName]. Kami sekarang akan menjalankan peran kami sebagai penjaga perdamaian di kawasan, mengerahkan garnisun yang tidak hanya mampu menjaga ketertiban dan stabilitas di kawasan, namun juga mempertahankannya dari serangan musuh."
 bftb_bulgarian_claims.8.a: "Lebih banyak wilayah untuk Bulgaria!"
 bftb_bulgarian_claims.9.t: "[FROM.GetNameDefCap] Menyangkal [ROOT.GetAdjective] kendali atas [FROM.FROM.FROM.GetName]"
 bftb_bulgarian_claims.9.desc: "Pemerintah [FROM.GetAdjective] menolak memberikan [ROOT.GetNameDef] kendali administratif atas [FROM.FROM.FROM.GetName]. Mereka mengklaim bahwa motivasi sebenarnya kami mengajukan proposal semacam itu hanyalah untuk memperluas zona pendudukan [ROOT.GetAdjective] dengan harapan mendapatkan lebih banyak wilayah Balkan setelah perang dimenangkan, dan bahkan [FROM.GetLeader] sendiri telah menyatakan bahwa ambisi teritorial kami mulai mengganggunya."
 bftb_bulgarian_claims.9.a: "Mungkin nanti..."
 BUL_germany_recognizes_our_claim_tt: "[GER.GetNameDefCap] mengakui klaim kami di negara bagian."
 bftb_bulgaria_german_influence.1.t: "[GER.GetNameDefCap] Menawarkan Donasi Pesawat"
 bftb_bulgaria_german_influence.1.desc: "[GetFirstDonation] hubungan antara negara kita dan [GER.GetNameDef], Hermann Göring menawarkan kita sumbangan berupa 12 pejuang [GER.GetAdjective], yang tampaknya berusaha untuk menyelaraskan [ROOT.GetNameDef] menuju [GER.GetFactionName], dan dengan demikian memenangkan sekutu yang kuat di Balkan untuk melindungi kepentingan [GER.GetAdjective] di wilayah tersebut."
 bftb_bulgaria_german_influence.1.desc_first_donation: "Untuk membangun kembali kekuatan tempur udara [ROOT.GetAdjective] dan memperkuatnya"
 bftb_bulgaria_german_influence.1.desc_more_donations: "Untuk terus memperkuat"
 bftb_bulgaria_german_influence.1.a: "Kami dengan senang hati menerimanya!"
 bftb_bulgaria_german_influence.1.b: "Kami menolak dengan sopan."
 bftb_bulgaria_german_influence.2.t: "[BUL.GetNameDefCap] Menerima Donasi kami"
 bftb_bulgaria_german_influence.2.desc: "Komando tinggi [BUL.GetAdjective] dengan senang hati menerima usulan kami, dan [BUL.GetLeader] secara pribadi berterima kasih atas sumbangan pesawat kami, menyatakan bahwa hubungan antara [ROOT.GetNameDef] dan [BUL.GetNameDef] menjadi lebih kuat, lebih sejahtera dan saling menguntungkan."
 bftb_bulgaria_german_influence.2.a: "Bagus!"
 bftb_bulgaria_german_influence.3.t: "[BUL.GetNameDefCap] Menolak Donasi kami"
 bftb_bulgaria_german_influence.3.desc: "Komando tinggi [BUL.GetAdjective] telah dengan sopan menolak usulan kami untuk menyumbangkan pesawat [ROOT.GetAdjective] guna mendukung angkatan udara [BUL.GetAdjective], dengan menyatakan bahwa menerima sumbangan ini berarti pemulihan hubungan [BUL.GetNameDef] dengan kebijakan [ROOT.GetAdjective], sesuatu yang pada saat ini tidak sesuai dengan kepentingan [BUL.GetAdjective], yang bertekad untuk membangun kembali angkatan udara mereka sendiri."
 bftb_bulgaria_german_influence.3.a: "Apa yang salah dengan mereka?"
 bftb_bulgaria_german_influence.4.t: "[GER.GetLeader] Menuntut kami Mengganti Kyoseivanov"
 bftb_bulgaria_german_influence.4.desc: "Hari ini, kami menerima surat dari [GER.GetLeader] sendiri, yang menyatakan bahwa ketidakmampuan perdana menteri [ROOT.GetAdjective] Georgi Kyoseivanov telah membuatnya kehilangan semua pujian di mata [GER.GetAdjective] dan bahwa dia harus dipaksa mengundurkan diri demi seseorang yang lebih cocok untuk posisi penting tersebut.\nPara [GER.GetAdjective] menyarankan agar kami mengganti Kyoseivanov dengan Bogdan Filov, seorang Germanofil dengan pengalaman politik yang singkat, yang berarti dia tidak akan menantang [GetLeaderToChallenge]."
 bftb_bulgaria_german_influence.4.desc_tsar: "sang Tsar"
 bftb_bulgaria_german_influence.4.desc_regency_council: "Dewan Kabupaten [ROOT.GetAdjective]"
 bftb_bulgaria_german_influence.4.desc_no_tsar: "[BUL.GetLeader]"
 bftb_bulgaria_german_influence.4.a: "Jerman benar!"
 bftb_bulgaria_german_influence.4.b: "Kami tidak akan menyerah pada keinginan Jerman!"
 bftb_bulgaria_german_influence.5.t: "[BUL.GetLeader] Menerima Pengganti Kyoseivanov"
 bftb_bulgaria_german_influence.5.desc: "Ketidakmampuan mantan Perdana Menteri [BUL.GetAdjective], Georgi Kyoseivanov, membuatnya kehilangan semua pujian di mata [BUL.GetLeader], yang sangat memahami risiko yang ditimbulkan oleh ketidakmampuan individu ini dan yang menerima saran kami untuk menggantikan Kyoseivanov dengan seseorang yang lebih mampu seperti Bogdan Filov, seorang Germanophile dengan pengalaman politik yang singkat, yang berarti bahwa dia tidak akan menantang [GetLeaderToChallenge] atau menghalangi [ROOT.GetAdjective] kepentingan."
 bftb_bulgaria_german_influence.5.a: "[BUL.GetLeader] telah membuktikan dirinya cukup bijaksana."
 bftb_bulgaria_german_influence.6.t: "[BUL.GetLeader] Menolak Mengganti Kyoseivanov"
 bftb_bulgaria_german_influence.6.desc: "[BUL.GetLeader] menolak penggantian Georgi Kyoseivanov, mengklaim bahwa satu-satunya alasan pemerintah [ROOT.GetAdjective] ingin dia mengundurkan diri adalah untuk menyingkirkan politisi kompeten yang setia kepada [BUL.GetNameDef] dan menukarnya dengan boneka [ROOT.GetAdjective] untuk menjaga kepentingan [GER.GetLeader] di [BUL.GetNameDef]."
 bftb_bulgaria_german_influence.6.a: "Satu-satunya boneka di sini adalah Georgi Kyoseivanov!"
 bftb_bulgaria_german_influence.7.t: "[GER.GetNameDefCap] Menuntut Akses Militer"
 bftb_bulgaria_german_influence.7.desc: "Seorang diplomat dari [GER.GetNameDef] telah tiba di [ROOT.Capital.GetName] hari ini untuk menuntut agar [ROOT.GetNameDef] memberikan akses militer kepada tentara [GER.GetAdjective].\nOperasi militer yang akan terjadi di Balkan memerlukan pasukan [GER.GetAdjective] untuk dapat bergerak melalui [ROOT.GetNameDef] untuk ditempatkan di sepanjang perbatasan dengan tetangga kita, dan [GER.GetLeader] tidak akan senang mengetahui bahwa [ROOT.GetNameDef] menghambat upaya perang [GER.GetAdjective]..."
 bftb_bulgaria_german_influence.7.a: "Kami dengan senang hati akan bekerja sama dengan tentara Jerman."
 bftb_bulgaria_german_influence.7.b: "[GER.GetLeader] harus mencari cara lain"
 bftb_bulgaria_german_influence.8.t: "[BUL.GetNameDefCap] Memberi kami Akses Militer"
 bftb_bulgaria_german_influence.8.desc: "Diplomat yang kami kirim ke [BUL.Capital.GetName] untuk membahas penggunaan wilayah [BUL.GetAdjective] sebagai basis operasi pasukan kami telah memberi tahu kami bahwa negosiasi telah berhasil dan [BUL.GetLeader] telah menandatangani perjanjian yang menyatakan bahwa tentara [ROOT.GetAdjective] telah diberikan akses militer di seluruh [BUL.GetNameDef]."
 bftb_bulgaria_german_influence.8.a: "Semuanya berjalan sesuai rencana."
 bftb_bulgaria_german_influence.9.t: "[BUL.GetNameDefCap] Menolak Permintaan Akses Militer kami"
 bftb_bulgaria_german_influence.9.desc: "Diplomat yang kami kirim ke [BUL.Capital.GetName] untuk merundingkan penggunaan wilayah [BUL.GetAdjective] sebagai basis operasi tentara kami telah melaporkan bahwa [BUL.GetLeader] menolak memberikan akses militer kepada pasukan [ROOT.GetAdjective], sehingga menghambat operasi militer kami di Balkan dalam waktu dekat. Diduga, [BUL.GetLeader] percaya bahwa memenuhi setiap tuntutan kami akan mengubah [BUL.GetNameDef] hanya menjadi satelit [ROOT.GetAdjective], sehingga mencegah negara tersebut menjadi kekuatan besar yang mandiri di Balkan sebagaimana mestinya."
 bftb_bulgaria_german_influence.9.a: "[BUL.GetLeader] sedang bermain api..."
 bftb_bulgaria_italian_influence.1.t: "[BUL.GetAdjective] Usulan Perjanjian Penelitian"
 bftb_bulgaria_italian_influence.1.desc: "Delegasi [BUL.GetAdjective] telah tiba hari ini di ibu kota kita untuk bertemu dengan menteri luar negeri [ITA.GetAdjective] untuk mengusulkan penandatanganan perjanjian antara negara kita.\nPerjanjian yang disampaikan oleh para diplomat [BUL.GetAdjective] antara lain memuat klausul program kerja sama militer yang berfokus pada penelitian teknologi dan penerapan peraturan ekonomi baru di [BUL.GetNameDef] yang akan memberikan manfaat signifikan bagi investor [ITA.GetAdjective]."
 bftb_bulgaria_italian_influence.1.a: "Ini adalah perjanjian yang menguntungkan untuk [ITA.GetNameDef]."
 bftb_bulgaria_italian_influence.1.b: "Kami tidak akan membagi kemajuan teknologi kami dengan [BUL.GetAdjective]s!"
 bftb_bulgaria_equipment_purchases.1.t: "Beli Artileri [FROM.FROM.GetAdjective]"
 bftb_bulgaria_equipment_purchases.1.desc: "Untuk mencapai kesepakatan pembelian meriam artileri [FROM.FROM.GetAdjective], pertama-tama kita harus memutuskan jenis artileri apa yang ingin kita peroleh."
 bftb_bulgaria_equipment_purchases.1.a: "Beli senjata artileri"
 bftb_bulgaria_equipment_purchases.1.a_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_artillery]§! unit §YArtileri Derek§!"
 bftb_bulgaria_equipment_purchases.1.b: "Beli senjata anti-udara"
 bftb_bulgaria_equipment_purchases.1.b_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_artillery]§! unit §YTowed Anti-Air§!"
 bftb_bulgaria_equipment_purchases.1.c: "Beli senjata anti-tank"
 bftb_bulgaria_equipment_purchases.1.c_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_artillery]§! unit §YTowed Anti-Tank§!"
 bftb_bulgaria_equipment_purchases.2.t: "Beli [FROM.FROM.GetAdjective] Kendaraan Militer"
 bftb_bulgaria_equipment_purchases.2.desc: "Untuk mencapai kesepakatan pembelian kendaraan militer [FROM.FROM.GetAdjective], pertama-tama kita harus memutuskan jenis kendaraan apa yang ingin kita peroleh."
 bftb_bulgaria_equipment_purchases.2.a: "Beli unit bermotor"
 bftb_bulgaria_equipment_purchases.2.a_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_motorized]§! unit §YBermotor§!"
 bftb_bulgaria_equipment_purchases.2.b: "Beli kendaraan mekanis"
 bftb_bulgaria_equipment_purchases.2.b_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_mechanized]§! unit §YMechanized§!"
 bftb_bulgaria_equipment_purchases.2.c: "Beli mobil lapis baja"
 bftb_bulgaria_equipment_purchases.2.c_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_armored_car]§! unit §YMobil Lapis Baja§!"
 bftb_bulgaria_equipment_purchases.3.t: "Beli [FROM.FROM.GetAdjective] Armor"
 bftb_bulgaria_equipment_purchases.3.desc: "Untuk mencapai kesepakatan pembelian armor [FROM.FROM.GetAdjective], pertama-tama kita harus memutuskan jenis armor apa yang ingin kita peroleh."
 bftb_bulgaria_equipment_purchases.3.a: "Beli baju besi ringan"
 bftb_bulgaria_equipment_purchases.3.a_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_light_armor]§! unit §YLight Tank§!"
 bftb_bulgaria_equipment_purchases.3.b: "Beli baju besi sedang"
 bftb_bulgaria_equipment_purchases.3.b_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_medium_armor]§! unit §YMedium Tank§!"
 bftb_bulgaria_equipment_purchases.3.c: "Beli baju besi berat"
 bftb_bulgaria_equipment_purchases.3.c_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_heavy_armor]§! unit §YHeavy Tank§!"
 bftb_bulgaria_equipment_purchases.4.t: "Beli [FROM.FROM.GetAdjective] Pesawat"
 bftb_bulgaria_equipment_purchases.4.desc: "Untuk mencapai kesepakatan pembelian pesawat [FROM.FROM.GetAdjective], pertama-tama kita harus memutuskan jenis pesawat apa yang ingin kita peroleh."
 bftb_bulgaria_equipment_purchases.4.a: "Beli pesawat tempur"
 bftb_bulgaria_equipment_purchases.4.a_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_fighter]§! unit §YFighter§!"
 bftb_bulgaria_equipment_purchases.4.b: "Beli pembom angkatan laut"
 bftb_bulgaria_equipment_purchases.4.b_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_naval_bomber]§! unit §YNaval Bomber§!"
 bftb_bulgaria_equipment_purchases.4.c: "Beli pembom taktis"
 bftb_bulgaria_equipment_purchases.4.c_tt: "Kami akan membeli §Y[?BUL_quantity_purchased_tactical_bomber]§! unit §YPembom Taktis§!"
 bftb_bulgaria_equipment_purchases.5.t: "[BUL.GetNameDef] Berusaha Membeli [ROOT.GetAdjective] Kapal"
 bftb_bulgaria_equipment_purchases.5.a_tt: "Kami akan menerima §Y1§! offmap §YPabrik Sipil§! sebagai pembayaran selama pembangunan kapal [BUL.GetAdjective]."
 bftb_bulgaria_equipment_purchases.6.a_tt: "[FROM.GetNameDef] akan membangun §Y3 Kapal Selam§! untuk Angkatan Laut [ROOT.GetAdjective]."
 bftb_bulgaria_equipment_purchases.6.b_tt: "[FROM.GetNameDef] akan membangun §Y2 Kapal Perusak§! untuk Angkatan Laut [ROOT.GetAdjective]."
 bftb_bulgaria_equipment_purchases.6.c_tt: "[FROM.GetNameDef] akan membangun §Ya Penjelajah Ringan§! untuk [ROOT.GetAdjective] Angkatan Laut."
 bftb_bulgaria_equipment_purchases.8.t: "Pembuatan Kapal Selesai - Kapal Selam"
 bftb_bulgaria_equipment_purchases.8.desc: "Setelah hampir setahun dibangun, ketiga kapal selam [FROM.GetAdjective] yang kami pesan telah menjalani beberapa kali uji coba laut dan akhirnya siap untuk ditugaskan secara resmi ke TNI Angkatan Laut.\nKapal-kapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 bftb_bulgaria_equipment_purchases.9.t: "Pembuatan Kapal Selesai - Kapal Perusak"
 bftb_bulgaria_equipment_purchases.9.desc: "Setelah hampir satu tahun pembangunan, kedua kapal perusak [FROM.GetAdjective] yang kami pesan menjalani beberapa kali uji coba laut dan akhirnya siap untuk secara resmi ditugaskan ke TNI Angkatan Laut.\nKapal-kapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 bftb_bulgaria_equipment_purchases.10.t: "Pembuatan Kapal Selesai - Penjelajah Ringan"
 bftb_bulgaria_equipment_purchases.10.desc: "Setelah hampir setahun dibangun, kapal penjelajah ringan [FROM.GetAdjective] yang kami pesan menjalani beberapa kali uji coba laut dan akhirnya siap untuk secara resmi ditugaskan ke TNI Angkatan Laut.\nKapal tersebut berlabuh di pelabuhan [Root.GetAdjective] dan awaknya menunggu perintah."
 bftb_bulgaria_scw_volunteers.1.t: "[ROOT.GetAdjective] Relawan kembali dari Spanyol"
 bftb_bulgaria_scw_volunteers.1.desc: "Para sukarelawan [ROOT.GetAdjective] pemberani yang berbaris untuk memperjuangkan kebebasan rakyat Spanyol di Brigade Internasional, pulang ke rumah [GetVictoryOrDefeatRepublicans] para pejuang [ROOT.GetAdjective] pemberani yang kembali sebagai veteran adalah pilot militer yang sekarang sangat terampil Zachari Zachariev, yang dianugerahi banyak prestasi di masa perang dan sangat direkomendasikan untuk promosi menjadi Panglima Angkatan Udara Bulgaria." #FROM.FROM is SCW loser // #FROM is SCW winner
 bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious: "bergembira setelah kemenangan [FROM.GetNameDef] dalam perang saudara yang telah menimbulkan begitu banyak penderitaan bagi rakyat Spanyol. Diantara"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated: "berduka atas kekalahan telak yang diderita oleh [FROM.GetNameDef], yang akhirnya menyerah pada tirani fasisme...\nBagaimanapun, di antara"
 bftb_bulgaria_scw_volunteers.1.a: "Mereka kembali sebagai pahlawan!"
 bftb_bulgaria_scw_volunteers.1.b: "Mereka melakukan apa yang mereka bisa untuk mempertahankan kebebasan..."
 bftb_bulgaria_scw_volunteers.2.t: "Relawan Bulgaria kembali dari Spanyol"
 bftb_bulgaria_scw_volunteers.2.desc: "Para sukarelawan [ROOT.GetAdjective] pemberani yang berbaris untuk melawan bolshevisme dan anarkisme di Spanyol, pulang ke rumah pasukan [GetVictoryOrDefeatNationalists] telah memperoleh pengalaman tempur yang berharga dan salah satu komandan kami telah dianugerahi dan dipromosikan atas perbuatannya yang luar biasa selama perang."
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious: "sebagai pemenang perang saudara Spanyol yang bangga, di mana [FROM.GetLeader] sendiri memuji partisipasi mereka di garis depan.\nKami"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated: "kecewa karena kekalahan telak yang diderita oleh [FROM.GetNameDef], yang kini berada di bawah kendali pasukan merah...\nBagaimanapun, kami"
 bftb_bulgaria_scw_volunteers.2.a: "Mereka kembali sebagai veteran perang sejati!"
 bftb_bulgaria_scw_volunteers.2.b: "Spanyol hanyalah tempat uji coba..."
 bftb_bulgaria_soviet_influence.1.t: "[ROOT.GetAdjective]-[BUL.GetAdjective] Perjanjian Gotong Royong"
 bftb_bulgaria_soviet_influence.1.desc: "[GetBulgarianLeaderToMeetStalin] bertemu hari ini dengan [ROOT.GetLeader] di [ROOT.Capital.GetName] untuk membahas proposal [BUL.GetAdjective] untuk menandatangani Perjanjian Saling Membantu antara negara kita. Dengan perjanjian ini, pemerintah [BUL.GetAdjective] berupaya memperkuat hubungan dengan [ROOT.GetNameDef] sambil mendapatkan dukungan yang dibutuhkan untuk mempertahankan integritasnya di masa-masa sulit ini dan menang melawan tetangganya yang bermusuhan di Balkan."
 bftb_bulgaria_soviet_influence.1.desc_leader: "[BUL.GetLeader]"
 bftb_bulgaria_soviet_influence.1.desc_diplomat: "[BUL.GetAdjective] diplomat"
 bftb_bulgaria_soviet_influence.1.a: "Penandatanganan perjanjian ini akan menguntungkan kedua negara!"
 bftb_bulgaria_soviet_influence.1.b: "Perjanjian ini bukan demi kepentingan terbaik kita."
 bftb_bulgaria_soviet_influence.2.t: "[SOV.GetNameDefCap] Menandatangani Perjanjian Gotong Royong"
 bftb_bulgaria_soviet_influence.2.desc: "[GetBulgarianLeaderToMeetStalin] kembali ke [ROOT.Capital.GetName] hari ini dari pertemuan dengan [SOV.GetLeader] untuk membahas usulan penandatanganan Perjanjian Gotong Royong antara [SOV.GetNameDef] dan [ROOT.GetNameDef]. Setelah pertemuan panjang untuk menetapkan syarat-syarat Perjanjian serta langkah-langkah yang harus dilakukan oleh pemerintah masing-masing untuk menjaga hubungan ini, para pejabat dari kedua negara menandatangani Perjanjian tersebut."
 bftb_bulgaria_soviet_influence.2.a: "Ini adalah awal dari hubungan yang bermanfaat!"
 bftb_bulgaria_soviet_influence.3.t: "[SOV.GetNameDefCap] Mundur dari Perjanjian Gotong Royong"
 bftb_bulgaria_soviet_influence.3.desc: "[GetBulgarianLeaderToMeetStalin] kembali ke [ROOT.Capital.GetName] hari ini dari pertemuan dengan [SOV.GetLeader] untuk membahas usulan penandatanganan Perjanjian Gotong Royong antara [SOV.GetNameDef] dan [ROOT.GetNameDef]. Setelah pertemuan panjang untuk menetapkan syarat-syarat Perjanjian, tampaknya tidak ada cara untuk meyakinkan [SOV.GetLeader] tentang perlunya perjanjian ini, yang [SOV.GetLeader.GetSheHe] dengan tegas menolak untuk menandatanganinya.\nSetelah kegagalan proposal di [SOV.GetNameDef], nampaknya [ROOT.GetLeader] sudah mempertimbangkan kemungkinan sekutu lain untuk [ROOT.GetNameDef]."
 bftb_bulgaria_soviet_influence.3.a: "Saatnya mencari sekutu baru..."
 bftb_bulgaria_soviet_influence.4.t: "[BUL.GetLeader] Tekanan [ROOT.GetLeader] untuk Bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_soviet_influence.4.desc: "Pemerintah [BUL.GetAdjective] menuntut persatuan negara-negara Balkan dalam revolusi melawan fasisme, imperialisme dan kapitalisme, mendesak [ROOT.GetLeader] untuk bergabung dengan [BUL.GetFactionName], sehingga menciptakan blok oposisi yang kuat terhadap negara-negara Eropa yang menindas."
 bftb_bulgaria_soviet_influence.4.a: "Kita harus bergabung dengan saudara-saudara kita di Bulgaria dan Soviet."
 bftb_bulgaria_soviet_influence.4.b: "Kami tidak akan menyerah pada tekanan Bulgaria!"
 bftb_bulgaria_soviet_influence.5.t: "[FROM.GetNameDefCap] Menyerah pada Tekanan [ROOT.GetAdjective]"
 bftb_bulgaria_soviet_influence.5.desc: "Setelah pertemuan yang luar biasa intens dan diskusi sengit dengan anggota pemerintahan [FROM.GetAdjective], [FROM.GetLeader] akhirnya menyerah pada tekanan kami dan [FROM.GetNameDef] telah bergabung dengan [ROOT.GetFactionName], memperkuat blok perlawanan kami terhadap fasisme, imperialisme, dan kapitalisme."
 bftb_bulgaria_soviet_influence.5.a: "Mereka telah melakukan hal yang benar."
 bftb_bulgaria_soviet_influence.6.t: "[FROM.GetNameDefCap] Menolak [ROOT.GetAdjective] Tuntutan"
 bftb_bulgaria_soviet_influence.6.desc: "[FROM.GetLeader] telah menolak untuk bertemu dengan diplomat kami yang dikirim ke [FROM.GetNameDef] dengan tujuan untuk membicarakan perlunya menjaga negara kami tetap bersatu sebagai sekutu daripada membagi kekuatan kami. Namun, pemerintah [FROM.GetAdjective] telah menolak usulan kami untuk bergabung dengan aliansi kami, sehingga memperjelas bahwa kerja sama antara [ROOT.GetNameDef] dan [FROM.GetNameDef] tidak mungkin dilakukan, dan menyisakan sedikit alternatif bagi negara [ROOT.GetFactionName] untuk berurusan dengan negara ini."
 bftb_bulgaria_soviet_influence.6.a: "Sebuah keputusan yang hanya akan membawa kehancuran pada [FROM.GetNameDef]..."
 bftb_bulgaria_yugoslavian_influence.1.t: "Perjanjian Persahabatan Abadi Bulgaria"
 bftb_bulgaria_yugoslavian_influence.1.desc: "[GetBulgarianLeaderToMeetStalin] bertemu hari ini dengan [ROOT.GetLeader] di [ROOT.Capital.GetName] untuk membahas proposal [BUL.GetAdjective] untuk menandatangani Perjanjian Persahabatan Abadi antara negara kita. Dengan perjanjian ini, pemerintah [BUL.GetAdjective] berupaya untuk mengubur perselisihan di masa lalu dan memperkuat hubungan dengan [YUG.GetNameDef], dengan harapan pada akhirnya dapat membentuk aliansi antara kedua negara yang memungkinkan kerja sama dan saling mendukung jika salah satu negara penandatangan terseret ke dalam konflik."
 bftb_bulgaria_yugoslavian_influence.1.a: "Penandatanganan perjanjian ini akan menguntungkan kedua negara!"
 bftb_bulgaria_yugoslavian_influence.1.b: "Perjanjian ini bukan demi kepentingan terbaik kita."
 bftb_bulgaria_yugoslavian_influence.2.t: "[FROM.GetNameDefCap] Menandatangani Perjanjian Persahabatan Abadi"
 bftb_bulgaria_yugoslavian_influence.2.desc: "[GetBulgarianLeaderToMeetStalin] kembali ke [BUL.Capital.GetName] hari ini dari pertemuan dengan [YUG.GetLeader] di [YUG.Capital.GetName] untuk membahas proposal penandatanganan Perjanjian Persahabatan Abadi antara [YUG.GetNameDef] dan [ROOT.GetNameDef]. Di akhir pertemuan, para pejabat dari kedua negara menandatangani Perjanjian tersebut, namun membiarkan beberapa klausul terbuka untuk masa depan, dengan keinginan bersama tidak hanya untuk melestarikan, tetapi juga untuk memperluas hubungan yang menguntungkan ini."
 bftb_bulgaria_yugoslavian_influence.2.a: "Ini akan memperkuat kedua negara!"
 bftb_bulgaria_yugoslavian_influence.3.t: "[FROM.GetNameDefCap] Menolak Perjanjian Persahabatan Abadi kita"
 bftb_bulgaria_yugoslavian_influence.3.desc: "[GetBulgarianLeaderToMeetStalin] kembali ke [BUL.Capital.GetName] hari ini dari pertemuan dengan [YUG.GetLeader] di [YUG.Capital.GetName] untuk membahas proposal penandatanganan Perjanjian Persahabatan Abadi antara [YUG.GetNameDef] dan [ROOT.GetNameDef]. Sayangnya, [YUG.GetLeader] terlihat kurang antusias dengan ide berteman dengan [ROOT.GetNameDef] dan akhirnya menolak lamaran kami."
 bftb_bulgaria_yugoslavian_influence.3.a: "Buang-buang waktu saja..."
 bftb_bulgaria_balkan_federation.1.t: "Proyek Federasi Balkan"
 bftb_bulgaria_balkan_federation.1.desc: "Kami telah menyelesaikan persiapan proyek pembentukan Federasi Republik Sosialis Balkan dengan tujuan untuk mempresentasikannya kepada pemerintah negara-negara Balkan dan menegosiasikan aksesi masing-masing republik tersebut, dimulai dengan [YUG.GetNameDef].\nTujuan utama federasi yang akan dipimpin oleh [ROOT.GetNameDef] ini adalah kerjasama seluruh rakyat Balkan dalam kesatuan supranasional, siap melawan banyak musuh yang berusaha menaklukkan negara-negara Balkan.\nTetapi [ROOT.GetLeader] memimpikan sesuatu yang lebih: Federasi Balkan Bersatu yang warga negaranya tidak lagi terdiri dari orang Bulgaria, Yunani, Yugoslavia... Tapi warga negara bebas di Balkan."
 bftb_bulgaria_balkan_federation.1.a: "Sebuah mimpi yang patut diperjuangkan!"
 bftb_bulgaria_balkan_federation.2.t: "[BUL.GetAdjective] Proyek untuk Federasi Balkan"
 bftb_bulgaria_balkan_federation.2.desc: "Pemerintah [BUL.GetAdjective] telah memberi kami proyek pembentukan Federasi Republik Sosialis Balkan, menjanjikan [ROOT.GetNameDef] hak istimewa untuk menjadi negara pertama yang diundang untuk bergabung.\nTujuan utama federasi yang akan dipimpin oleh [BUL.GetNameDef] ini adalah kerjasama seluruh rakyat Balkan dalam kesatuan supranasional, siap melawan banyak musuh yang berusaha menaklukkan negara-negara Balkan.\nPers sosialis dan komunis telah membocorkan berita dan dukungan untuk Federasi Balkan dan afiliasi [ROOT.GetNameDef] dengannya mulai menyebar di antara populasi [ROOT.GetAdjective]."
 bftb_bulgaria_balkan_federation.2.a: "Sebuah proyek ambisius..."
 bftb_bulgaria_balkan_federation.3.t: "Propaganda Federasi Balkan"
 bftb_bulgaria_balkan_federation.3.desc: "Orang-orang Bulgaria telah memulai kampanye propaganda di [ROOT.GetNameDef] dengan tujuan meyakinkan penduduk [ROOT.GetAdjective] tentang kelayakan proyek khayalan mereka untuk membentuk Federasi Republik Sosialis Balkan.\nPers sayap kiri telah menyebarkan berita ini dan banyak orang, terutama pekerja industri di kota dan petani di pedesaan, telah menunjukkan dukungan tanpa syarat mereka terhadap proposal [BUL.GetAdjective]."
 bftb_bulgaria_balkan_federation.3.a: "Langkah berani Bulgaria..."
 bftb_bulgaria_balkan_federation.4.t: "[BUL.GetNameDefCap] Mengganggu Kestabilan [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.4.desc: "Aktivis [BUL.GetAdjective] telah melintasi perbatasan ke negara kita dengan tujuan mempersenjatai pendukung Federasi Balkan di [ROOT.GetNameDef] dan menyebabkan kerusuhan di negara tersebut.\nPetugas polisi siang dan malam berusaha menangkap dan memenjarakan unsur-unsur subversif tersebut, namun sejauh ini upaya mereka belum terlalu membuahkan hasil dan banyak warga [ROOT.GetAdjective], terutama dari kelas pekerja, telah bergabung dengan barisan orang-orang yang mendukung proyek [BUL.GetAdjective] Federasi Balkan."
 bftb_bulgaria_balkan_federation.5.t: "Penyatuan Balkan"
 bftb_bulgaria_balkan_federation.5.desc: "Pemerintah [BUL.GetAdjective] telah mengirimi kami proposal untuk melakukan penyatuan Balkan di bawah pemerintahan terpusat, dengan tujuan untuk meningkatkan pemahaman dan kerja sama antara berbagai masyarakat Balkan. Menurut [BUL.GetLeader], ini adalah langkah besar terakhir Federasi Balkan yang akan memungkinkan kita untuk meninggalkan konflik masa lalu dan menjamin persatuan dan perdamaian antar negara kita secara permanen.\n[BUL.GetNameDef] menunggu tanggapan dari pemerintah [ROOT.GetAdjective] untuk melanjutkan penyatuan negara kita."
 bftb_bulgaria_balkan_federation.5.a: "Mari kita bergabung dengan saudara kita di Balkan!"
 bftb_bulgaria_balkan_federation.5.b: "Minta bantuan sebelum menyetujui unifikasi."
 bftb_bulgaria_balkan_federation.5.c: "Menuntut pemerintahan mandiri yang terbatas."
 bftb_bulgaria_balkan_federation.5.d: "Kami tidak akan melepaskan kemerdekaan dan identitas [ROOT.GetAdjective]!"
 bftb_bulgaria_balkan_federation.5.d_consequences_tt: "§RPenolakan kami dapat menyebabkan [FROM.GetNameDef] mengeluarkan kami dari [FROM.GetFactionName] atau bahkan menimbulkan tujuan perang pada kami!§!"
 bftb_bulgaria_balkan_federation.6.t: "[FROM.GetNameDefCap] diintegrasikan ke dalam [ROOT.GetNameDef]"
 bftb_bulgaria_balkan_federation.6.desc: "Pemerintah [FROM.GetAdjective] telah menerima proposal unifikasi kami dan bergabung dengan Federasi Balkan Bersatu. Mantan warga negara [FROM.GetAdjective] kini akan menjadi warga negara Balkan yang bebas, yang telah menaruh kepercayaan mereka pada impian [ROOT.GetLeader] tentang persatuan Balkan."
 bftb_bulgaria_balkan_federation.6.a: "Mimpi itu menjadi kenyataan!"
 bftb_bulgaria_balkan_federation.7.t: "[FROM.GetNameDefCap] Meminta Bantuan Industri"
 bftb_bulgaria_balkan_federation.7.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk bergabung dengan Federasi Balkan Bersatu kami. Namun, sebelum melanjutkan unifikasi, [FROM.GetNameDef] memerlukan bantuan untuk mendongkrak industri nasionalnya yang kekurangan. [FROM.GetLeader] telah meyakinkan bahwa, setelah perkembangan industri negara tersebut meningkat, [FROM.GetNameDef] akan dengan senang hati bergabung dengan Federasi Balkan Bersatu yang besar."
 bftb_bulgaria_balkan_federation.7.a: "Kita harus memberikan bantuan industri kepada [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.8.t: "[FROM.GetNameDefCap] Meminta Bantuan Ekonomi"
 bftb_bulgaria_balkan_federation.8.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk bergabung dengan Federasi Balkan Bersatu, namun, sebelum melanjutkan penyatuan, [FROM.GetNameDef] sangat membutuhkan bantuan keuangan untuk mencegah keruntuhan perekonomiannya yang tertekan. [FROM.GetLeader] telah meyakinkan bahwa, setelah negara menerima dorongan pemulihan ekonomi dan situasi membaik, [FROM.GetNameDef] akan dengan senang hati bergabung dengan Federasi Balkan Bersatu yang besar."
 bftb_bulgaria_balkan_federation.8.a: "Kita harus memberikan bantuan ekonomi kepada [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.9.t: "[FROM.GetNameDefCap] Meminta Bantuan Militer"
 bftb_bulgaria_balkan_federation.9.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk bergabung dengan Federasi Persatuan Balkan kami, namun, sebelum melanjutkan dengan unifikasi, [FROM.GetNameDef] memerlukan bantuan militer untuk memperkuat angkatan bersenjatanya yang tidak dapat diandalkan sebelum melakukan operasi untuk membasmi beberapa sel pembangkang di berbagai kota pedesaan sekitar [FROM.Capital.GetName]. [FROM.GetLeader] telah memastikan bahwa, setelah operasi selesai, [FROM.GetNameDef] akan dengan senang hati bergabung dengan Federasi Balkan Bersatu yang besar."
 bftb_bulgaria_balkan_federation.9.a: "Kita harus memberikan bantuan militer kepada [FROM.GetAdjective]s."
 bftb_bulgaria_balkan_federation.10.t: "[FROM.GetNameDefCap] Menyerukan Hak Penentuan Nasib Sendiri tertentu"
 bftb_bulgaria_balkan_federation.10.desc: "Delegasi [FROM.GetAdjective] yang dipimpin oleh [FROM.GetLeader] telah tiba di [ROOT.Capital.GetName] hari ini untuk berdiskusi dengan [ROOT.GetLeader] syarat-syarat bergabungnya [FROM.GetNameDef] ke Federasi Balkan Bersatu. Tampaknya pemerintah [FROM.GetAdjective] ingin mempertahankan independensi dan hak pemerintahan sendiri di dalam federasi, namun bersedia untuk bergabung sebagai anggota asosiasi dengan tingkat otonomi tertentu."
 bftb_bulgaria_balkan_federation.10.a: "Memang benar!"
 bftb_bulgaria_balkan_federation.11.t: "[FROM.GetNameDefCap] telah menolak proposal kami"
 bftb_bulgaria_balkan_federation.11.desc: "Pemerintah [FROM.GetAdjective] telah menolak untuk bergabung dengan Federasi Persatuan Balkan, meskipun bertekad untuk mempertahankan aliansi antar negara kita.\nNamun, [FROM.GetLeader] telah secara terbuka mengklaim bahwa reaksi pemerintah Bulgaria terhadap penolakan [FROM.GetAdjective] akan menunjukkan apakah tujuan tersembunyi sebenarnya dari Federasi adalah untuk memperluas perbatasan Bulgaria melampaui apa yang dapat dibayangkan, atau apakah Bulgaria benar-benar mengupayakan kerja sama antara negara-negara Balkan apa pun kondisi keanggotaan mereka dalam federasi, namun bagaimanapun juga, [FROM.GetNameDef] tidak akan pernah melepaskan kemerdekaan atau identitas budayanya."
 bftb_bulgaria_balkan_federation.11.a: "Kami akan menghormati keputusan mereka."
 bftb_bulgaria_balkan_federation.11.b: "Bagaimana kita bisa bekerja sama dengan pemerintah yang tidak mempercayai kita?"
 bftb_bulgaria_balkan_federation.11.c: "[FROM.GetLeader] sudah keterlaluan dengan pidatonya!"
 bftb_bulgaria_balkan_federation.12.t: "[FROM.GetNameDefCap] Menuntut [ROOT.GetAdjective] Wilayah di Balkan"
 bftb_bulgaria_balkan_federation.12.desc: "Pemerintah [BUL.GetAdjective] telah mengirimkan misi diplomatik untuk menuntut penyerahan wilayah [ROOT.GetAdjective] di Balkan kepada negara-negara Balkan yang, menurut [BUL.GetAdjective], merupakan wilayah sah mereka. Delegasi dari [BUL.GetNameDef] secara umum tetap bersikap ramah, meskipun beberapa diplomat kita mengaku merasakan konotasi ancaman tertentu, terutama ketika menghadapi penolakan awal dari para menteri [ITA.GetAdjective]."
 bftb_bulgaria_balkan_federation.12.a: "Kami akan memenuhi tuntutan mereka untuk menjaga perdamaian..."
 bftb_bulgaria_balkan_federation.12.a_state_transfering_tt: "Negara akan dialihkan kepada pemilik Balkan yang sah."
 bftb_bulgaria_balkan_federation.12.b: "[ROOT.GetNameDef] tidak akan menyerah pada tekanan [BUL.GetAdjective]!"
 bftb_bulgaria_balkan_federation.12.b_tt: "Dapat menyebabkan efek berikut:"
 bftb_bulgaria_balkan_federation.13.t: "[ITA.GetNameDefCap] Menyerah pada Permintaan kami"
 bftb_bulgaria_balkan_federation.13.desc: "Setelah pertemuan yang panjang dan intens dengan delegasi diplomatik kami yang dikirim untuk merundingkan [ITA.GetAdjective] penyerahan wilayah Balkan, [ITA.GetLeader] telah menyerah pada tekanan [BUL.GetAdjective] dan secara resmi telah mengalihkan kendali atas negara bagian [ITA.GetAdjective] di Balkan kepada negara-negara yang secara sah menjadi milik mereka."
 bftb_bulgaria_balkan_federation.13.a: "Keputusan bijak oleh [ITA.GetLeader]."
 bftb_bulgaria_balkan_federation.14.t: "[BUL.GetAdjective] Arbitrase di Wilayah Balkan"
 bftb_bulgaria_balkan_federation.14.desc: "Pemerintah [BUL.GetAdjective] mengirimkan misi diplomatik ke [ITA.GetNameDef] untuk menuntut penyerahan wilayah [ITA.GetAdjective] di Balkan.\nSetelah pertemuan yang panjang, [ITA.GetLeader] menyerah pada tekanan [BUL.GetAdjective] dan setuju untuk mengalihkan kendali atas negara bagian [ITA.GetAdjective] di Balkan kepada negara-negara yang secara sah menjadi milik mereka, yang memerlukan perolehan teritorial tertentu untuk [ROOT.GetNameDef]."
 bftb_bulgaria_balkan_federation.14.a: "Kita harus berterima kasih kepada orang-orang Bulgaria untuk ini!"
 bftb_bulgaria_balkan_federation.15.t: "[ITA.GetNameDefCap] Menolak Menyerahkan Wilayah Balkan"
 bftb_bulgaria_balkan_federation.15.desc: "Setelah pertemuan panjang dengan delegasi kami yang dikirim untuk merundingkan penyerahan wilayah [ITA.GetAdjective] di Balkan kepada negara-negara di mana mereka secara sah berasal, [ITA.GetLeader] akhirnya menolak untuk mendengarkan diplomat [ROOT.GetAdjective], dengan menyatakan bahwa setiap bagian wilayah yang diduduki oleh [ITA.GetNameDef] di Balkan adalah hak milik rakyat [ITA.GetAdjective]."
 bftb_bulgaria_balkan_federation.15.a: "Kalau begitu kita sendiri yang akan merebut wilayah itu!"
 bftb_bulgaria_balkan_federation.15.b: "Kami akan menangani [ITA.GetAdjective] nanti..."
 bftb_bulgaria_balkan_federation.16.t: "[BUL.GetNameDefCap] Menuntut semua [ROOT.GetAdjective] Wilayah di Balkan"
 bftb_bulgaria_balkan_federation.16.desc: "Pemerintah [BUL.GetAdjective] telah mengirimkan misi diplomatik untuk menuntut penyerahan wilayah [ROOT.GetAdjective] di Balkan, yang menurut [BUL.GetAdjective], merupakan hak milik mereka.\nDelegasi dari [BUL.GetNameDef] secara umum tetap bersikap ramah, meskipun beberapa diplomat kita mengaku merasakan konotasi ancaman tertentu, terutama ketika menghadapi penolakan awal dari para menteri [ROOT.GetAdjective]."
 bftb_bulgaria_balkan_federation.16.a: "Kita harus menghindari pecahnya perang Balkan yang baru dengan segala cara..."
 bftb_bulgaria_balkan_federation.16.b: "[BUL.GetLeader] pasti menderita delusi!"
 bftb_bulgaria_balkan_federation.17.t: "[TUR.GetNameDefCap] Menyerahkan Wilayah Balkan"
 bftb_bulgaria_balkan_federation.17.desc: "Setelah pertemuan yang sangat menegangkan dengan delegasi diplomatik kami yang dikirim untuk merundingkan penyerahan [TUR.GetAdjective] wilayah Balkan, [TUR.GetLeader] menyerah pada tekanan [ROOT.GetAdjective] dan secara resmi mengalihkan kendali atas negara bagian [TUR.GetAdjective] di Balkan ke [ROOT.GetNameDef]."
 bftb_bulgaria_balkan_federation.17.a: "Kami akan merayakannya!"
 bftb_bulgaria_balkan_federation.18.t: "[TUR.GetNameDefCap] Menolak Menyerahkan Wilayah Balkan"
 bftb_bulgaria_balkan_federation.18.desc: "Setelah pertemuan yang sangat menegangkan dengan delegasi kami yang dikirim untuk merundingkan pengalihan wilayah [TUR.GetAdjective] di Balkan ke [ROOT.GetNameDef], [TUR.GetLeader] akhirnya menolak untuk mendengarkan diplomat kami, dengan menyatakan bahwa [TUR.GetNameDef] telah menguasai wilayah tersebut selama berabad-abad dan oleh karena itu, [TUR.GetNameDef] adalah pemiliknya yang sah."
 bftb_bulgaria_balkan_federation.18.a: "Kalau begitu, kita harus menghadapinya dengan cara yang sulit!"
 bftb_bulgaria_balkan_federation_project_ready_tt: "£GFX_trigger_yes Proyek Federasi Balkan sudah siap."
 bftb_bulgaria_balkan_federation.7_tt: "Dampak ketika keputusan selesai:"
 BUL_italy_yields_states_to_root_tt: "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! mengalihkan kendali negara bagian berikut ke §Y[ROOT.GetNameDef]§!:"
 BUL_italy_yields_states_to_others_tt: "[ITA.GetFlag]§Y[ITA.GetNameDefCap]§! mengalihkan kendali negara bagian berikut ke §Ynegara Balkan lainnya§!:"
 bftb_bulgaria_balkan_federation_turkish_states_tt: "[BUL.GetFlag]§Y[BUL.GetNameDefCap]§! menjadi pemilik dan pengendali:"
 bftb_bulgaria_fate_of_the_balkans.1.t: "[BUL.GetNameDefCap] Menuntut kita Bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.desc: "Seorang utusan [BUL.GetAdjective] tiba di ibu kota hari ini untuk bertemu dengan [ROOT.GetLeader] dan pada dasarnya menuntut keanggotaan [ROOT.GetNameDef] di [BUL.GetFactionName]. Menurut [GetBulgarianLeader], [BUL.GetNameDef] akan mengembangkan program kerja sama di bidang penelitian dan pertahanan serta akan menjamin keamanan dan kedaulatan seluruh negara anggota aliansi. Namun, diplomat tersebut memperingatkan, negara Balkan mana pun yang menolak bergabung dengan aliansi tersebut akan dianggap sebagai musuh."
 BUL_leader_is_tsar: "Raja [BUL.GetLeader]"
 BUL_leader_is_regency_council: "Dewan Kabupaten Bulgaria"
 BUL_leader_is_a_politician: "[BUL.GetLeader]"
 bftb_bulgaria_fate_of_the_balkans.1.a: "[ROOT.GetNameDefCap] akan bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.1.b: "Kami tidak akan menyerah pada ancaman kosong!"
 bftb_bulgaria_fate_of_the_balkans.2.t: "[FROM.GetNameDefCap] Menerima untuk bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.2.desc: "Utusan yang dikirim untuk membujuk pemerintah [FROM.GetName] agar bergabung dengan [BUL.GetFactionName] hari ini telah kembali dari ibu kota [FROM.GetAdjective] dengan kabar baik: [FROM.GetLeader] menyetujui tuntutan kami dan negara [FROM.GetHerHis] akhirnya bergabung dengan aliansi kami."
 bftb_bulgaria_fate_of_the_balkans.2.a: "[BUL.GetFactionName] tumbuh!"
 bftb_bulgaria_fate_of_the_balkans.3.t: "[FROM.GetNameDefCap] Menolak bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.3.desc: "Utusan yang dikirim untuk menuntut kepatuhan [FROM.GetName] terhadap [BUL.GetFactionName] telah melaporkan bahwa [FROM.GetLeader] memutuskan untuk tidak bergabung dengan aliansi kita, tampaknya gagal untuk menyadari, meskipun ada peringatan dari diplomat kita, nasib buruk yang menunggu [FROM.GetNameDef] karena melanggar perintah [BUL.GetAdjective]."
 bftb_bulgaria_fate_of_the_balkans.3.a: "[FROM.GetLeader] terbukti bodoh..."
 bftb_bulgaria_fate_of_the_balkans.4.t: "[BUL.GetNameDefCap] Tuntutan [FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.4.desc: "Sebuah misi diplomatik [BUL.GetAdjective][GetBulgarianLeaderDiplomaticMission] telah tiba di ibu kota kami untuk merundingkan pengalihan [FROM.FROM.GetName] ke [BUL.GetNameDef] yang, menurut klaim mereka, merupakan miliknya secara sah."
 BUL_tsar_leads_diplomatic_mission: ", dipimpin oleh Tsar [BUL.GetLeader] sendiri,"
 BUL_politician_leads_diplomatic_mission: ", dipimpin oleh [BUL.GetLeader] sendiri,"
 BUL_bulgarian_government: ""
 bftb_bulgaria_fate_of_the_balkans.4.a: "Kami tidak dalam posisi untuk menolak..."
 bftb_bulgaria_fate_of_the_balkans.4.b: "Itu tidak akan terjadi!"
 bftb_bulgaria_fate_of_the_balkans.5.t: "[FROM.GetNameDefCap] Menerima [BUL.GetAdjective] Kontrol atas [FROM.FROM.FROM.GetName]"
 bftb_bulgaria_fate_of_the_balkans.5.desc: "Setelah diskusi panjang dengan misi diplomatik [BUL.GetAdjective] yang dikirim ke ibu kota [FROM.GetAdjective], [FROM.GetLeader] telah setuju untuk mentransfer [FROM.FROM.FROM.GetName] ke Bulgaria."
 bftb_bulgaria_fate_of_the_balkans.5.a: "[FROM.FROM.FROM.GetName] akhirnya kembali ke tempatnya semula"
 bftb_bulgaria_fate_of_the_balkans.6.t: "[FROM.GetNameDefCap] Menolak Mentransfer [FROM.FROM.FROM.GetName] ke [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.6.desc: "Setelah beberapa jam diskusi panas dengan misi diplomatik [BUL.GetAdjective] yang dikirim ke ibu kota [FROM.GetAdjective], [FROM.GetLeader] dengan keras kepala menolak untuk mentransfer [FROM.FROM.FROM.GetName] ke [BUL.GetNameDef]."
 bftb_bulgaria_fate_of_the_balkans.6.a: "Keputusan bodoh oleh [FROM.GetLeader]..."
 bftb_bulgaria_fate_of_the_balkans.7.t: "[BUL.GetNameDefCap] Menuntut [ROOT.GetAdjective] Penyerahan"
 bftb_bulgaria_fate_of_the_balkans.7.desc: "Akhirnya, pemerintah [BUL.GetAdjective] telah menunjukkan niat sebenarnya dan telah mengirimkan delegasi untuk menuntut pengakuan [BUL.GetNameDef] sebagai penguasa [ROOT.GetNameDef], yang berarti penyerahan tanpa syarat dari pemerintah [ROOT.GetAdjective] kepada pemerintahan [GetBulgarianLeader]."
 bftb_bulgaria_fate_of_the_balkans.7.a: "Kami tidak dalam posisi untuk menolak..."
 bftb_bulgaria_fate_of_the_balkans.7.b: "[ROOT.GetNameDefCap] tidak akan pernah tunduk pada kekuatan asing!"
 bftb_bulgaria_fate_of_the_balkans.8.t: "[FROM.GetNameDefCap] Dikirim ke [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.8.desc: "Sejak [FROM.GetNameDef] masuk ke dalam [BUL.GetFactionName], kami telah melobi pemerintah mereka untuk tunduk kepada [GetBulgarianLeader], dan menyusul suap dan paksaan kami baru-baru ini terhadap beberapa menteri [FROM.GetAdjective], [FROM.GetLeader] telah dipaksa untuk menandatangani sebuah perjanjian yang secara resmi mengakui [BUL.GetNameDef] sebagai penguasanya, dan yang pada akhirnya menjadi orang [FROM.GetAdjective] ditundukkan."
 bftb_bulgaria_fate_of_the_balkans.8.a: "[FROM.GetAdjective] tahu tempatnya."
 bftb_bulgaria_fate_of_the_balkans.9.t: "[FROM.GetNameDefCap] Menolak untuk Menyerah ke [BUL.GetNameDef]"
 bftb_bulgaria_fate_of_the_balkans.9.desc: "Tanpa diduga, pemerintah [FROM.GetAdjective] memutuskan untuk menantang [GetBulgarianLeader]. [FROM.GetLeader] hari ini telah mengumumkan secara terbuka bahwa mereka menolak untuk tunduk kepada pemerintah [BUL.GetAdjective]. Keputusan yang berani, didukung oleh mayoritas masyarakat [FROM.GetAdjective], namun tetap ceroboh, karena mereka membutuhkan perlindungan kita jika keadaan menyedihkan mereka ingin selamat dari konflik yang akan datang, dan setelah ini, [GetBulgarianLeader] sudah mempertimbangkan kembali keanggotaan [FROM.GetAdjective] di [BUL.GetFactionName]..."
 bftb_bulgaria_fate_of_the_balkans.9.a: "Kita harus terus menekan mereka!"
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt: "Keputusan untuk §YMenundukkan [FROM.GetName]§! akan tersedia kembali dalam §R365 hari§!"
 bftb_bulgaria_fate_of_the_balkans.9.b: "Pembangkangan mereka tidak akan luput dari hukuman!"
 bftb_bulgaria_fate_of_the_balkans.10.t: "[BUL.GetNameDefCap] telah Memaksa [FROM.GetNameDef] untuk Bergabung dengan [BUL.GetFactionName]"
 bftb_bulgaria_fate_of_the_balkans.10.desc: "Setelah menerima ultimatum dari pemerintah [BUL.GetAdjective], [FROM.GetLeader] dari [FROM.GetNameDef], yang jelas-jelas dipaksa oleh ancaman terhadap negaranya, para menterinya dan bahkan dirinya sendiri, telah menyerah pada tekanan [BUL.GetAdjective] dan telah mengumumkan bahwa [FROM.GetNameDef] akan segera meninggalkan [ROOT.GetFactionName] dan bergabung dengan [BUL.GetFactionName]."
 bftb_bulgaria_fate_of_the_balkans.10.a: "[BUL.GetNameDef] akan membayar untuk ini!"
 bftb_bulgaria_fate_of_the_balkans.10.b: "Pilihan menyedihkan dari pemimpin yang menyedihkan..."
 BUL_transferred_bulgarian_state_autonomy_desc: "Telah menghasilkan negara bagian yang diklaim oleh Bulgaria."
 bftb_bulgaria_political_leaders.1.t: "Pembunuhan Hristo Lukov"
 bftb_bulgaria_political_leaders.1.desc: "Tadi malam, [GetLukovLeader] disergap oleh dua [GetLukovPartisans] yang mengikutinya dari Royal Cinema ke rumahnya di 1 Artillery Street.\nSaat pemimpin politik tersebut hendak memasuki rumahnya, salah satu dari [GetLukovCriminals] menembaknya dari jarak dekat dan memukul bahunya, kemudian Lukov menangkap pria itu dan menekannya ke dinding, sebelum mencoba mundur ke dalam gedung, tetapi [GetLukovSecondAssailant], menembaknya dari belakang, lalu mengambil [GetLukovAccomplice] miliknya dan melarikan diri melalui halaman tetangga, meninggalkan Hristo Lukov yang terluka parah di pintu masuk rumahnya.\n[GetLukovConclusion]"
 bftb_bulgaria_political_leaders.1.a: "Mengangkat pimpinan baru dari kalangan jajaran UBNL."
 bftb_bulgaria_political_leaders.1.b: "Kami membutuhkan seseorang dengan ideologi yang lebih radikal... Tunjuk Aleksandar Tsankov!"
 bftb_bulgaria_political_leaders.1.c: "Dunia lebih baik tanpa dia!"
 bftb_bulgaria_political_leaders.1.d: "Tragis..."
 BUL_hristo_lukov_death_leader_party: "Hristo Lukov, Pemimpin Persatuan Legiun Nasional Bulgaria,"
 BUL_hristo_lukov_death_leader_country: "[ROOT.GetAdjective] pemimpin Hristo Lukov"
 BUL_hristo_lukov_death_partisans_communism: "anggota kelompok pertempuran yang diorganisir oleh Partai Komunis Bulgaria yang"
 BUL_hristo_lukov_death_partisans_other: "partisan yang dilaporkan"
 BUL_hristo_lukov_death_criminals_communism: "partisan, Ivan Burudjiev,"
 BUL_hristo_lukov_death_criminals_other: "penjahat"
 BUL_hristo_lukov_death_second_assailant_communism: "Violeta Yakova, agen kedua yang masih luput dari perhatian korban"
 BUL_hristo_lukov_death_second_assailant_other: "penyerang kedua, tanpa disadari oleh korban dan, menurut para saksi, adalah seorang wanita"
 BUL_hristo_lukov_death_accomplice_communism: "kawan"
 BUL_hristo_lukov_death_accomplice_other: "kaki tangan"
 BUL_hristo_lukov_death_conclusion_communism: ""
 BUL_hristo_lukov_death_conclusion_other: "Badan keamanan nasional kita sudah mencari para pembunuhnya, tapi kita harus menjaga masa depan bangsa dan menunjuk individu baru untuk menggantikan Hristo Lukov sebagai pemimpin [ROOT.GetNameDef]."
 bftb_bulgaria_greek_influence.1.t: "[BUL.GetNameDefCap] Mendekati Pemerintah [GRE.GetAdjective]"
 bftb_bulgaria_greek_influence.1.desc: "Perdana Menteri [BUL.GetAdjective], [BUL.GetLeader], telah bertemu dengan [ROOT.GetLeader] untuk mengusulkan formalisasi hubungan persahabatan antara [BUL.GetNameDef] dan [ROOT.GetNameDef] melalui perjanjian damai. Pemimpin [BUL.GetAdjective] juga menawarkan keuntungan pajak tertentu kepada kapitalis [ROOT.GetAdjective] yang ingin mendirikan anak perusahaan di negara tetangga."
 bftb_bulgaria_greek_influence.1.a: "[GRE.GetNameDefCap] dan [BUL.GetNameDef] akan bekerja sama mulai sekarang!"
 bftb_bulgaria_greek_influence.1.b: "Kami tidak bisa mempercayai [BUL.GetAdjective]s!"
 bftb_bulgaria_greek_influence.2.t: "[FROM.GetNameDefCap] Menyetujui Usulan kami"
 bftb_bulgaria_greek_influence.2.desc: "Pemimpin [FROM.GetAdjective] [FROM.GetLeader] telah menerima usulan kami dan bersedia meresmikan hubungan persahabatan kami melalui perjanjian yang menjamin perdamaian antara [BUL.GetNameDef] dan [FROM.GetNameDef]."
 bftb_bulgaria_greek_influence.2.a: "[BUL.GetNameDefCap] dan [GRE.GetNameDef] akan bekerja sama mulai sekarang!"
 bftb_bulgaria_greek_influence.3.t: "Pemerintah [FROM.GetAdjective] Menolak Usulan Kami"
 bftb_bulgaria_greek_influence.3.desc: "Pemimpin [FROM.GetAdjective] [FROM.GetLeader] telah menyatakan bahwa dia tidak mempercayai kebijakan perdamaian [BUL.GetAdjective] yang baru ini dan oleh karena itu telah menolak proposal kami untuk meresmikan hubungan persahabatan antara [FROM.GetNameDef] dan [BUL.GetNameDef]."
 bftb_bulgaria_greek_influence.3.a: "Mereka terlalu bangga untuk menyadari perlunya kerja sama!"
 bftb_bulgaria_british_influence.1.t: "Pemerintah [BUL.GetAdjective] Mencari Perlindungan kami"
 bftb_bulgaria_british_influence.1.desc: "Perdana Menteri Bulgaria [BUL.GetLeader] telah tiba di negara kami untuk merundingkan perjanjian dengan [ENG.GetNameDef], berupaya meresmikan komitmen negara kami untuk melindungi wilayah Bulgaria.\nMenurut [BUL.GetLeader], partainya ingin memperkuat hubungan dengan pemerintah [ENG.GetAdjective], tetapi khawatir akan integritas wilayah [BUL.GetNameDef] jika mereka menolak kekuatan besar lainnya dengan ambisi yang mengancam di Balkan, seperti [GER.GetAdjective]s, [ITA.GetAdjective]s dan [SOV.GetAdjective]s."
 bftb_bulgaria_british_influence.1.a: "Kami akan menempatkan [BUL.GetNameDef] di bawah perlindungan [ENG.GetAdjective]."
 bftb_bulgaria_british_influence.1.b: "Kami setuju untuk menandatangani pakta Non-Agresi."
 bftb_bulgaria_british_influence.1.c: "Ada hal-hal yang lebih penting yang harus kita tangani."
 bftb_bulgaria_british_influence.2.t: "[FROM.GetNameDefCap] Setuju untuk Menjamin Kemerdekaan [BUL.GetAdjective]"
 bftb_bulgaria_british_influence.2.desc: "Pemerintah [FROM.GetAdjective] telah setuju untuk menandatangani perjanjian yang diusulkan oleh [BUL.GetLeader], menjamin kemerdekaan negara kita dan berupaya untuk lebih meningkatkan hubungan kita di masa depan."
 bftb_bulgaria_british_influence.2.a: "Kami berada di bawah perlindungan [ENG.GetAdjective] sekarang!"
 bftb_bulgaria_british_influence.3.t: "[FROM.GetNameDefCap] Setuju untuk Menandatangani Pakta Non-Agresi"
 bftb_bulgaria_british_influence.3.desc: "Meskipun pemerintah [FROM.GetAdjective] telah setuju untuk menandatangani perjanjian antara [BUL.GetNameDef] dan [FROM.GetNameDef], [FROM.GetLeader] telah menolak untuk secara resmi menjamin kemerdekaan negara kita, dengan menyatakan bahwa tindakan tersebut dapat menimbulkan konsekuensi diplomatik yang mengerikan yang akan memperburuk situasi tidak hanya di Balkan, tetapi juga di seluruh Eropa.\nNamun, pemimpin [FROM.GetAdjective] tampaknya tertarik untuk mengembangkan hubungan persahabatan dan membina kerja sama antar negara kita."
 bftb_bulgaria_british_influence.3.a: "Ini adalah permulaan!"
 bftb_bulgaria_british_influence.4.t: "[ENG.GetNameDefCap] Menolak Proposal kami"
 bftb_bulgaria_british_influence.4.desc: "Pemerintah [FROM.GetAdjective] telah menunjukkan bahwa mereka tidak tertarik untuk memperkuat hubungan dengan negara kita dan telah menolak sepenuhnya usulan kita untuk meresmikan perjanjian guna mendukung kemerdekaan [BUL.GetNameDef] dan mengembangkan kerja sama antar negara kita."
 bftb_bulgaria_british_influence.4.a: "Sialan orang-orang Inggris itu dan kekeraskepalaan mereka!"
 bftb_bulgaria_democratic_international_policies.1.t: "[BUL.GetNameDefCap] Menjamin [ROOT.GetAdjective] Kemandirian"
 bftb_bulgaria_democratic_international_policies.1.desc: "Pemerintah [BUL.GetAdjective] hari ini telah mendeklarasikan bahwa merupakan tugas [BUL.GetNameDef] untuk menjaga integritas teritorial negara-negara sahabat Balkan dari ambisi kekuatan asing yang menghasut perang.\nUntuk tujuan ini, Perdana Menteri [BUL.GetLeader] telah mencanangkan komitmen [BUL.GetNameDef] untuk melindungi negara [ROOT.GetAdjective], serta penerapan serangkaian langkah baru untuk mempersiapkan pertahanan Balkan."
 bftb_bulgaria_democratic_international_policies.1.a: "Sangat perhatian terhadap mereka!"
 bftb_bulgaria_democratic_international_policies.2.t: "[BUL.GetAdjective] Investasi Industri"
 bftb_bulgaria_democratic_international_policies.2.desc: "[BUL.GetAdjective] para taipan telah melakukan beberapa investasi di negara kita, mengembangkan sejumlah anak perusahaan yang akan mendongkrak industri nasional kita.\nTidak diragukan lagi, ini adalah bagian dari skema yang lebih besar yang dirancang oleh pemerintah [BUL.GetAdjective] untuk meningkatkan pengaruhnya dan menyebarkan ide-ide kapitalis di negara kita, namun untuk saat ini, kita dapat mengambil manfaat dari ekspansi industri kecil ini."
 bftb_bulgaria_democratic_international_policies.2.a: "Apakah mereka pikir mereka bisa mempengaruhi politik kita dengan mudah?"
 bftb_bulgaria_democratic_international_policies.3.t: "[BUL.GetAdjective] Suntikan Modal"
 bftb_bulgaria_democratic_international_policies.3.desc: "Pemerintah [BUL.GetAdjective] telah memberikan dukungan keuangan kepada perusahaan [ROOT.GetAdjective] yang sedang berjuang untuk menstabilkan sektor keuangan negara kita.\nNamun, tidak ada satu pun menteri kita yang begitu naif hingga percaya sedetik pun bahwa tindakan ini mungkin dilatarbelakangi oleh solidaritas atau simpati. Jelas bahwa dengan suntikan modal ini, pemerintah [BUL.GetAdjective] hanya berupaya meningkatkan kendali atas perekonomian kita."
 bftb_bulgaria_democratic_international_policies.3.a: "Kita harus berhati-hati..."
 bftb_bulgaria_democratic_international_policies.4.t: "[BUL.GetAdjective] Integritas Wilayah"
 bftb_bulgaria_democratic_international_policies.4.desc: "Delegasi dari [BUL.GetNameDef] telah tiba di negara kami untuk meminta agar [ROOT.GetLeader] mengakui legitimasi pemerintahan [BUL.GetAdjective] di bekas wilayah Bulgaria yang saat ini diduduki oleh pasukan Sekutu dan, akibatnya, mengembalikan kendali administratif wilayah tersebut kepada [BUL.GetNameDef]."
 bftb_bulgaria_democratic_international_policies.4.a: "Pemerintah [ROOT.GetAdjective] mengakui integritas teritorial Bulgaria!"
 bftb_bulgaria_democratic_international_policies.4_tt: "§Y[BUL.GetNameWithFlag]§! menjadi pemilik dan pengendali:"
 bftb_bulgaria_democratic_international_policies.4.b: "Itu tidak mungkin."
 bftb_bulgaria_democratic_international_policies.5.t: "[ENG.GetNameDefCap] Mengakui Integritas Teritorial Bulgaria"
 bftb_bulgaria_democratic_international_policies.5.desc: "Delegasi kami yang dikirim ke [ENG.GetNameDef] telah kembali setelah berhasil mengajukan petisi kepada pemerintah [ENG.GetAdjective], yang telah setuju untuk mengembalikan kendali administratif atas bekas wilayah Bulgaria yang diduduki pasukan Sekutu ke [BUL.GetNameDef]."
 bftb_bulgaria_democratic_international_policies.5.a: "Rakyat kami bersukacita atas berita ini!"
 bftb_bulgaria_democratic_international_policies.6.t: "[ENG.GetNameDefCap] Menolak Mengakui Integritas Wilayah Bulgaria"
 bftb_bulgaria_democratic_international_policies.6.desc: "Sayangnya, delegasi kami yang dikirim ke [ENG.GetNameDef] gagal membuat pemerintah [ENG.GetAdjective] memberi kami kendali administratif atas bekas wilayah Bulgaria yang saat ini diduduki oleh pasukan Sekutu."
 bftb_bulgaria_democratic_international_policies.6.a: "Mereka melanggar integritas wilayah kita!"
 bftb_bulgaria_democratic_international_policies.7.t: "Pakta [ENG.GetAdjective]-[BUL.GetAdjective]"
 bftb_bulgaria_democratic_international_policies.7.desc: "Pemerintah [ENG.GetAdjective] telah mengirimkan delegasi diplomatik untuk memberi tahu kami bahwa mereka telah setuju untuk mengembalikan kendali administratif atas bekas wilayah Bulgaria yang diduduki oleh pasukan kami kepada pemerintah [BUL.GetNameDef], dengan segera.\nMenghadapi kejadian seperti itu, dan gagal dalam upaya kami untuk menegosiasikan keputusan ini dengan [ENG.GetAdjective], pemerintah kami terpaksa melepaskan kendali atas wilayah pendudukan ini, demi menjaga hubungan baik dengan sekutu kami."
 bftb_bulgaria_democratic_international_policies.7.a: "Ini merupakan penghinaan terhadap [ROOT.GetNameDef]"
 bftb_news.1.t: "Pemerintah [BUL.GetAdjective] Mengecam IMRO"
 bftb_news.1.desc: "Sebelumnya hari ini, pemimpin [BUL.GetAdjective] [BUL.GetLeader] telah mengeluarkan pernyataan resmi yang menunjukkan penolakannya terhadap Organisasi Internal Revolusioner Makedonia dan secara terbuka mengutuk kegiatan mereka.\n[BUL.GetAdjective] Menteri Dalam Negeri juga telah mengumumkan penerapan paket tindakan luar biasa yang akan memungkinkan pemerintah mengalokasikan lebih banyak sumber daya untuk mengambil tindakan aktif melawan IMRO dan membasmi organisasi teroris ini untuk selamanya.\nDengan pernyataan ini, nampaknya akhirnya pemerintah [BUL.GetAdjective] berupaya mengakhiri salah satu sumber konflik dan ketegangan terbesar di Balkan..."
 bftb_news.1.a: "Sudah waktunya!"
 bftb_news.1.b: "Saatnya menghancurkan IMRO!"
 bftb_news.1.c: "Tampaknya IMRO sudah tinggal menghitung hari..."
 bftb_news.2.t: "Pemerintah [BUL.GetAdjective] Mendukung IMRO"
 bftb_news.2.desc: "Sebelumnya hari ini, pemimpin [BUL.GetAdjective] [BUL.GetLeader] secara terbuka mengumumkan bahwa pemerintah akan berupaya untuk bernegosiasi dengan Ivan Mihaylov, salah satu ketua terpenting Organisasi Internal Revolusioner Makedonia, untuk menghentikan permusuhan antara IMRO dan otoritas [BUL.GetAdjective]. Menurut Menteri Dalam Negeri, [BUL.GetNameDef] perlu bekerja sama dengan organisasi ini untuk membebaskan banyak [BUL.GetNameDef] warga Makedonia yang tinggal di [YUG.GetNameDef] dan [GRE.GetNameDef], sebuah pernyataan berani yang tidak diragukan lagi akan mengobarkan kembali konflik Balkan dan meningkatkan ketegangan antara kekuatan besar yang memiliki kepentingan di wilayah tersebut..."
 bftb_news.2.a: "Orang Bulgaria sedang bermain api!"
 bftb_news.2.b: "Kami melakukan yang terbaik untuk Bulgaria."
 bftb_news.2.c: "Tampaknya konflik Balkan akan kembali berkobar..."
 bftb_news.3.t: "Kematian Tsar Boris III dari Bulgaria"
 bftb_news.3.desc: "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_news.3.a: "Sekarang dia beristirahat dengan damai... Berbeda dengan negaranya!"
 bftb_news.4.t: "Kembalinya Tsar Ferdinand I"
 bftb_news.4.desc: "Setelah kematian Tsar Bulgaria, Boris III, pemerintah Bulgaria membuat keputusan yang tidak terduga dengan bertemu dengan ayah Boris dan mantan Tsar, Ferdinand I, untuk memintanya mengambil alih komando negara lagi.\nSetelah konferensi panjang dengan [GetFormerLeaderBeforeFerdinand], Ferdinand I, penguasa penghasut perang yang terpaksa turun tahta demi putranya setelah kekalahan telak dalam Perang Balkan Kedua dan Perang Besar, setuju untuk kembali ke Sofia untuk dinobatkan sebagai Tsar Bulgaria sekali lagi."
 bftb_news.4.a: "Dia adalah penguasa yang [BUL.GetNameDef] butuhkan!"
 bftb_news.4.b: "Apakah lelaki tua jompo itu mampu memerintah?"
 bftb_news.4.c: "Pergantian peristiwa yang tak terduga..."
 BUL_former_leader_before_ferdinand_kyoseivanov: "Perdana Menteri Georgi Kyoseivanov"
 BUL_former_leader_before_ferdinand_filov: "Perdana Menteri Bogdan Filov"
 BUL_former_leader_before_ferdinand_mushanov: "Perdana Menteri Nikola Mushanov"
 BUL_former_leader_before_ferdinand_lukov: "Perdana Menteri Hristo Lukov"
 BUL_former_leader_before_ferdinand_tsankov: "Perdana Menteri Aleksandar Tsankov"
 BUL_former_leader_before_ferdinand_generic: "Perdana Menteri Bulgaria"
 bftb_news.5.t: "Kampanye Reintegrasi Bulgaria di Balkan"
 bftb_news.5.desc: "Pemerintah [BUL.GetAdjective] telah memulai kampanye reintegrasi besar-besaran di wilayah pendudukan di Balkan, mendorong pemukiman Bulgaria, mengubah nama kota dan tempat ke bentuk tradisional Bulgaria dan mengatur ulang pemerintahan lokal sesuai dengan gaya Bulgaria.\nDengan langkah-langkah ini, [BUL.GetLeader] berharap dapat menunjukkan sifat Bulgaria di wilayah ini dan melegitimasi aneksasi mereka di masa depan dengan [BUL.GetNameDef]."
 bftb_news.5.a: "[BUL.GetAdjective] kedaulatan atas wilayah ini tidak bisa lagi dibicarakan!"
 bftb_news.5.b: "Beraninya mereka menghancurkan budaya [THIS.GetAdjective]?!"
 bftb_news.5.c: "Sebuah langkah berani dari Bulgaria..."
 bftb_news.6.t: "Pemulihan Patriarkat Bulgaria"
 bftb_news.6.desc: "Dengan dukungan pemerintah, Eksarkat Bulgaria telah menekan Patriark Konstantinopel untuk mengakui autocephaly Gereja Ortodoks Bulgaria.\nDihadapkan pada tuntutan yang didukung oleh [BUL.GetLeader] yang mengancam, Patriarkat Ekumenis Konstantinopel terpaksa mengizinkan Sinode Suci untuk mengadopsi Statuta baru yang dengannya mereka dapat memilih kepala Gereja Bulgaria dan dengan demikian, setelah lebih dari tujuh abad, memulihkan Patriarkat Bulgaria."
 bftb_news.6.a: "Prestasi ini membawa kebahagiaan bagi seluruh rakyat Bulgaria!"
 bftb_news.6.b: "Perkembangan yang menarik..."
 bftb_news.7.t: "Kekaisaran Bulgaria Ketiga"
 bftb_news.7.desc: "Kemarin rapat umum politik besar-besaran, yang diselenggarakan oleh pemerintah Bulgaria, berlangsung di Sofia.\nSelama acara berlangsung, dan yang membuat takjub sebagian besar penonton, [BUL.GetLeader] memproklamirkan pembentukan Kekaisaran Bulgaria Ketiga dan mengumumkan dimulainya era baru bagi bangsa besar Bulgaria.\nPidato ini dilanjutkan dengan upacara megah namun khidmat untuk menobatkan [BUL.GetLeader] Kaisar Bulgaria, dan di mana para pemimpin politik dan militer berjanji setia kepada kekaisaran dan penguasanya."
 bftb_news.7.a: "Ini memperkuat bangsa Bulgaria!"
 bftb_news.7.b: "Sepertinya [BUL.GetLeader] memiliki delusi keagungan..."
 bftb_news.7.c: "Apakah ini benar-benar diperlukan?"
 bftb_news.8.t: "Front Tanah Air Mengambil alih Bulgaria"
 bftb_news.8.desc: "Front Tanah Air adalah organisasi politik anti-fasis Bulgaria yang secara radikal menentang rezim otoriter [FROM.GetLeader], terdiri dari anggota dari berbagai kelompok politik tetapi sangat dipengaruhi oleh komunis, dan dibentuk untuk menghadapi sistem diktator yang diberlakukan di Bulgaria.\nSetelah pemberontakan yang diatur oleh organisasi ini, perang saudara yang hebat terjadi antara pasukan yang setia kepada pemerintah Bulgaria dan pendukung Front Tanah Air.\nAkhirnya, perang telah berakhir, dan komunis telah menggulingkan rezim [FROM.GetLeader] dan memproklamirkan Republik Rakyat Bulgaria."
 bftb_news.8.a: "Kemenangan besar bagi rakyat Bulgaria!"
 bftb_news.8.b: "Khawatir..."
 bftb_news.9.t: "Federasi Republik Sosialis Balkan"
 bftb_news.9.desc: "[BUL.GetNameDefCap] telah membentuk [BUL.GetFactionName], versi revisi dari proyek yang diusulkan pada tahun 1920-an yang ternyata tidak terlalu berhasil pada saat itu.\nMenurut Perdana Menteri Bulgaria, [BUL.GetLeader], pemerintah [BUL.GetAdjective] bercita-cita untuk menciptakan front persatuan di Balkan untuk menghadapi negara-negara asing yang menyerang yang mengancam wilayah tersebut dengan ambisi teritorial mereka.\nSukses atau tidaknya proyek baru ini masih harus dilihat, namun yang pasti dukungan terhadap federasi Balkan semakin meningkat secara signifikan di kalangan penduduk negara-negara tetangga."
 bftb_news.9.a: "Inilah jalan menuju kemajuan!"
 bftb_news.9.b: "Menarik..."
 bftb_news.9.c: "Upaya lain untuk menyatukan Balkan yang akan berakhir dengan kegagalan..."
 bftb_news.10.t: "Penyatuan Balkan"
 bftb_news.10.desc: "Pemerintahan sebelumnya [BUL.GetOldNameDef] telah memproklamirkan pembentukan [BUL.GetNameDef], yang dengannya mereka bermaksud untuk membawa [BUL.GetFactionName] satu langkah lebih jauh, mengimbau anggota aliansi untuk bersatu di bawah satu pemerintahan terpusat.\nSesuai dengan [BUL.GetLeader], [BUL.GetNameDef] mengupayakan kerja sama penuh antara negara-negara Balkan, meninggalkan segala konflik di masa lalu dan memupuk persatuan di antara masyarakat Balkan."
 bftb_news.10.a: "Mimpi itu menjadi kenyataan!"
 bftb_news.10.b: "Apakah ini yang benar-benar dibutuhkan [THIS.GetNameDef]?" #THIS
 bftb_news.10.c: "Apakah itu yang benar-benar dibutuhkan oleh negara-negara Balkan?"
 bftb_news.10.d: "Omong kosong!"
 bftb_news.11.t: "[BUL.GetNameDefCap] Pendekatan [GER.GetNameDef]"
 bftb_news.11.desc: "Pemerintah [BUL.GetAdjective] telah menandatangani perjanjian komersial dengan beberapa perusahaan [GER.GetAdjective] dalam upaya untuk memperkuat hubungan dengan [GER.GetNameDef] sekaligus merangsang masuknya modal asing ke dalam negeri.\nBerdasarkan perjanjian ini, investor [GER.GetAdjective] akan menerima manfaat hukum dan pengurangan pajak yang signifikan ketika beroperasi di [BUL.GetNameDef]."
 bftb_news.11.a: "Ini akan meningkatkan hubungan kita dengan [GER.GetNameDef]!"
 bftb_news.11.b: "Ini akan mendorong [BUL.GetAdjective] untuk memihak kita!"
 bftb_news.11.c: "Akankah [BUL.GetNameDef] bergabung dengan [GER.GetFactionName]?"
 bftb_news.11.d: "Mereka hanya mencari perlindungan [GER.GetLeader]!"
 bftb_news.12.t: "[ITA.GetAdjective]-[BUL.GetAdjective] Pertukaran Teknologi Militer"
 bftb_news.12.desc: "Setelah menghubungi pemerintah [GER.GetAdjective], [BUL.GetNameDef] kini berupaya memperkuat hubungan dengan [ITA.GetNameDef].\n[BUL.GetLeader] dan [ITA.GetLeader] telah menandatangani perjanjian penelitian, yang dikembangkan oleh para ahli dari kedua negara, untuk memfasilitasi pengembangan peralatan militer modern untuk angkatan bersenjata mereka.\nBersamaan dengan perjanjian ini, pemerintah [BUL.GetAdjective] telah menerapkan peraturan ekonomi baru untuk mendorong investasi modal [ITA.GetAdjective] di negara tersebut."
 bftb_news.12.a: "Ini akan menjadi hubungan yang bermanfaat!"
 bftb_news.12.b: "[BUL.GetAdjective] belum membuktikan diri mereka sebagai sekutu yang baik dari [ITA.GetNameDef]."
 bftb_news.12.c: "Orang-orang Bulgaria tampaknya sangat ingin mendapatkan teman baru..."
 bftb_news.12.d: "Mereka berurusan dengan iblis..."
 bftb_news.13.t: "[SOV.GetAdjective]-[BUL.GetAdjective] Perjanjian Gotong Royong"
 bftb_news.13.desc: "Perdana Menteri [BUL.GetAdjective] [BUL.GetLeader] dan pemimpin [SOV.GetAdjective] [SOV.GetLeader] telah menandatangani perjanjian yang bertujuan untuk memperkuat hubungan antara kedua negara dan meningkatkan kerja sama dalam masalah militer dan ekonomi.\nDengan perjanjian ini, pemerintah [BUL.GetAdjective] juga bermaksud untuk merangsang perdagangan dengan [SOV.GetNameDef] dan menggunakan modal [SOV.GetAdjective] untuk melakukan investasi industri baru."
 bftb_news.13.a: "Perjanjian ini sangat bermanfaat bagi [BUL.GetNameDef]!"
 bftb_news.13.b: "Pengaruh Soviet di Balkan tumbuh!"
 bftb_news.13.c: "Akankah [BUL.GetNameDef] bergabung dengan [SOV.GetFactionName]?"
 bftb_news.13.d: "Mereka hanya mencari perlindungan [SOV.GetAdjective]!"
 bftb_news.14.t: "Perjanjian Persahabatan Abadi di Balkan"
 bftb_news.14.desc: "Sebagai langkah pertama dalam upaya membangun kembali hubungan antara [BUL.GetNameDef] dan negara tetangganya di Balkan, pemerintah [BUL.GetAdjective] telah menandatangani perjanjian persahabatan dengan [YUG.GetNameDef] yang mana kedua negara telah meresmikan komitmen mereka untuk mengembangkan hubungan persahabatan dan meningkatkan kerja sama ekonomi di antara mereka.\nAda orang-orang yang menyatakan bahwa tujuan sebenarnya dari pemerintah [BUL.GetAdjective] lebih dari sekadar menjalin hubungan persahabatan dengan negara-negara tetangganya, dan bahwa tujuan sebenarnya adalah membentuk Federasi Balkan untuk menghadapi kekuatan-kekuatan besar Eropa.\nNamun untuk saat ini, pernyataan tersebut tidak lebih dari sekedar spekulasi belaka..."
 bftb_news.14.a: "Hal ini pada akhirnya akan membawa stabilitas di Balkan!"
 bftb_news.14.b: "Upaya putus asa untuk menghentikan kemajuan kita dalam perang!"
 bftb_news.15.t: "Perjanjian Salonika"
 bftb_news.15.desc: "[BUL.GetAdjective] Perdana Menteri [BUL.GetLeader] telah bertemu dengan [GRE.GetLeader] di ibu kota [GRE.GetAdjective] untuk membahas penandatanganan perjanjian yang secara resmi pemerintah kedua negara berkomitmen untuk memelihara hubungan persahabatan dan meningkatkan kerja sama ekonomi antara [BUL.GetNameDef] dan [GRE.GetNameDef].\nMenurut [BUL.GetLeader], ini hanyalah langkah awal dalam upaya membangun kembali hubungan antara [BUL.GetNameDef] dan negara-negara tetangganya, sebuah upaya yang mungkin akan membuahkan hasil dalam waktu dekat."
 bftb_news.16.t: "[BUL.GetNameDefCap] Pendekatan [ENG.GetNameDef]"
 bftb_news.16.desc: "Pemerintah [BUL.GetAdjective], mencari dukungan dari kekuatan besar yang mampu menjamin kemerdekaan dan keutuhan wilayah [BUL.GetNameDef], mengirimkan delegasi diplomatik ke [ENG.GetNameDef] untuk merundingkan penandatanganan perjanjian dengan pemerintah [ENG.GetAdjective].\nSelain klausul yang berkaitan dengan masalah militer, perjanjian ini juga mencakup perjanjian ekonomi yang memberikan keuntungan pajak yang signifikan kepada kapitalis [ENG.GetAdjective] ketika beroperasi di [BUL.GetNameDef]."
 bftb_news.16.a: "Ini akan meningkatkan hubungan kita dengan [ENG.GetNameDef]!"
 bftb_news.16.b: "Ini akan mendorong [BUL.GetAdjective] untuk memihak kita!"
 bftb_news.16.c: "Akankah [BUL.GetNameDef] bergabung dengan [ENG.GetFactionName]?"
 bftb_news.16.d: "Mereka hanya mencari perlindungan [ENG.GetLeader]!"
 bftb_news.201.t: "[TUR.GetNameDefCap] Memiliterisasi Selat Turki"
 bftb_news.201.desc: "[TUR.GetNameDefCap] dan [SOV.GetNameDef] telah mencapai kesepakatan untuk merevisi Perjanjian Lausanne, yang ditandatangani dan dilaksanakan setelah Republik Turki yang baru lahir berhasil memukul mundur Entente dalam [TUR.GetAdjective] Perang Kemerdekaan. Perjanjian tersebut telah lama dikecam sebagai serangan terhadap kedaulatan [TUR.GetAdjective], namun kini perjanjian tersebut akhirnya diubah dan mendukung Konvensi Montreux yang baru disahkan.\n\n[TUR.GetNameDefCap] sekarang memiliki kendali penuh atas lalu lintas yang masuk dan keluar Selat Turki, dan negara bagian di sekitar selat tersebut kini telah dimiliterisasi ulang oleh [TUR.GetNameDef]. [ENG.GetAdjective] pengamat yang ikut serta dalam proses ini hanya merasa puas bahwa konflik di wilayah tersebut dapat dihindari."
 bftb_news.201.a: "Jadilah itu."
 bftb_news.201.b: "Hari yang menyenangkan untuk perdamaian."
 bftb_news.201.c: "Perjanjian Perang Besar lainnya dilanggar."
 bftb_news.201.d: "Cocok untuk [TUR.GetNameDef]."
 bftb_news.202.t: "Selat Turki Tetap Demiliterisasi"
 bftb_news.202.desc: "[TUR.GetNameDefCap] dan [SOV.GetNameDef] gagal mencapai kesepakatan untuk merevisi Perjanjian Lausanne, yang dilaksanakan setelah Republik Turki yang baru lahir memukul mundur Entente dalam [TUR.GetAdjective] Perang Kemerdekaan. Perjanjian Lausanne mendemiliterisasi Selat Turki dan membuka Selat Dardanella dan Bosporus bagi lalu lintas sipil dan militer yang tidak dibatasi, dan tampaknya hal ini akan terus menjadi status quo di masa mendatang.\n\n[TUR.GetLeader] mengecam keputusan tersebut dalam pidato yang disiarkan ke negara dimana ia mengutuk bagaimana [TUR.GetNameDef] tetap menjadi sasaran imperialisme yang gigih. [ENG.GetAdjective] pengamat, yang menjadi bagian dari proses tersebut, merasa puas bahwa konflik di wilayah tersebut dapat dihindari."
 bftb_news.202.a: "Memang benar bahwa mereka takut akan kekuatan kita."
 bftb_news.202.b: "Apa lagi yang bisa kami lakukan?"
 bftb_news.202.c: "Bisakah kami berbuat lebih banyak?"
 bftb_news.202.d: "Setidaknya perang dapat dihindari..."
 bftb_news.202.e: "Tanda kelemahan dari [TUR.GetNameDef]..."
 bftb_news.203.t: "Perang [TUR.GetAdjective]-[SOV.GetAdjective]"
 bftb_news.203.desc: "Apa yang seharusnya merupakan negosiasi ulang yang tidak berbahaya atas perjanjian yang telah berumur puluhan tahun malah meningkat menjadi perang total antara [SOV.GetNameDef] dan [TUR.GetNameDef] mengenai izin ke Selat Turki.\n\n[TUR.GetLeader] menyebut gagalnya perundingan dan pecahnya perang sebagai hal yang ‘disayangkan’ dan merupakan sesuatu yang ‘sepenuhnya dapat dihindari’. [SOV.GetLeader], pada bagian mereka, mengatakan bahwa pasukan [SOV.GetNameDef] yang tak terkalahkan tidak akan berhenti untuk memastikan bahwa perjanjian lama Perang Besar tetap ditegakkan. [SOV.GetLeader] juga berjanji bahwa pembebasan pekerja [TUR.GetAdjective] akan segera terjadi, dan penghancuran rezim [TUR.GetAdjective] saat ini akan menjadi kemenangan besar bagi perjuangan komunis internasional."
 bftb_news.203.a: "Uraaaaah!"
 bftb_news.203.b: "Ayo!"
 bftb_news.203.c: "Astaga, sungguh sebuah bencana..."
 bftb_news.203.d: "Apa yang terjadi dengan diplomasi kuno yang bagus!?"
 bftb_news.203.e: "Hm, kita harus mempertimbangkan untuk membantu upaya perang [TUR.GetAdjective]..."
 bftb_news.203.f: "Mengerikan."
 bftb_news.204.t: "Perang Saudara di [TUR.GetNameDef]!"
 bftb_news.204.desc: "Perang saudara telah pecah di [TUR.GetNameDef] antara pemerintah konservatif yang berkuasa dan Kemalis yang sebelumnya berkuasa. Kaum Kemalis, yang berjuang dan mengamankan kemerdekaan [TUR.GetNameDef] setelah runtuhnya Kekaisaran Ottoman, menyebut banyaknya pelanggaran konstitusi yang dilakukan pemerintah saat ini sebagai alasan yang cukup untuk menggulingkan rezim mereka. Jenderal selebriti dan Kemalis Kâzım Orbay telah terpilih untuk memimpin junta militer yang bermaksud menggulingkan pemerintahan Islam saat ini [TUR.GetLeader].\n\n[TUR.GetLeader] mengecam tindakan Kemalis sebagai tindakan yang tidak sesuai dengan negara demokrasi yang benar-benar berfungsi, dan berjanji untuk memulihkan supremasi hukum di negaranya yang terpecah belah."
 bftb_news.204.a: "Kita harus menang!"
 bftb_news.204.b: "Berita yang sangat buruk..."
 bftb_news.204.c: "Ada peluang di sini..."
 bftb_news.204.d: "Hei, kami tahu satu atau dua hal tentang itu!"
 bftb_news.205.t: "Kesultanan Ottoman terlahir kembali"
 bftb_news.205.desc: "Yang membuat seluruh dunia kecewa adalah Sultan Utsmaniyah kembali menduduki tahtanya setelah perang saudara yang sangat brutal antara kaum konservatif di negara tersebut dan kaum Kemalis yang sekularis. Dalam sebuah upacara mewah yang tampak seperti Abad Pertengahan, Sultan dikembalikan ke posisinya semula dan republik Mustafa Kemal Atatürk dibubarkan selamanya.\n\n[TUR.GetLeader] berbicara kepada kesultanan yang baru dilahirkan kembali, mengungkapkan campuran keterkejutan dan kerendahan hati atas kenyataan bahwa ia dikembalikan ke posisinya yang lama. Sultan yang baru adalah seorang yang berwatak halus, namun dikelilingi oleh sekelompok penghasut perang dan penganut paham irredentist. Para ahli, yang tidak percaya bahwa kembalinya Sultan bisa terjadi, tidak tahu apa yang akan terjadi di masa depan."
 bftb_news.205.a: "Alhamdulillah!"
 bftb_news.205.b: "Oh tidak, jangan lagi!"
 bftb_news.205.c: "Bagaimana ini bisa terjadi!?"
 bftb_news.205.d: "Hah, menarik..."
 bftb_news.205.e: "Aneh."
 bftb_news.206.t: "Fajar Perjanjian Mediterania"
 bftb_news.206.desc: "[ITA.GetLeader] dan [TUR.GetLeader] telah mengumumkan pembentukan blok aliansi baru di Mediterania, yang dikenal sebagai ‘[TUR.GetFactionName].’ [ITA.GetLeader] berjanji bahwa pakta mereka akan mendominasi semua urusan Eropa sebagai pemimpin terkemuka di benua Eropa, sementara [TUR.GetLeader] berbicara dalam istilah yang lebih terukur untuk meyakinkan para diplomat bahwa aliansi tersebut murni merupakan aliansi strategis yang dirancang untuk meningkatkan keamanan di Balkan dan bagi negara-negara dari Mediterania. Para pejabat\n\n[ENG.GetAdjective] menjuluki kekuatan regional yang baru ini sebagai ‘tidak membantu dan tidak diterima’, sementara para pengamat [GER.GetAdjective] berbicara dalam istilah yang jelas lebih pasti dengan memperkirakan bahwa faksi tersebut hanya akan menjadi catatan kaki dalam sejarah pada akhir dekade ini."
 bftb_news.206.a: "Hore!"
 bftb_news.206.b: "Bodoh sekali!"
 bftb_news.206.c: "Schwächlinge!"
 bftb_news.206.d: "Pesaing lain ikut serta."
 bftb_news.206.e: "Apa artinya ini bagi Eropa?"
 bftb_news.207.t: "[TUR.GetNameDefCap] Berkomitmen pada Keamanan Balkan"
 bftb_news.207.desc: "[TUR.GetLeader] berbicara kepada dunia saat ini ketika dia menyatakan bahwa [TUR.GetNameDef] akan memperluas kebijakan luar negerinya yang berpusat pada Balkan dengan menjamin kemandirian semua negara yang bekerja sama di dalamnya. Bagi para pengamat internasional, tampaknya [TUR.GetNameDef] telah mengambil sikap yang lebih tegas dalam memilih untuk meminimalkan transaksi dengan negara-negara besar agar dapat fokus pada keamanan regional.\n\nMeskipun keputusan [TUR.GetAdjective] dipuji oleh sebagian orang, hal ini menimbulkan kekhawatiran besar bagi sebagian lainnya. Para pejabat [ITA.GetAdjective] khususnya bereaksi dengan rasa khawatir, dan memohon kepada pemerintah [TUR.GetAdjective] untuk menarik kembali sikap mereka jika mereka ingin meminimalkan kemungkinan pecahnya konflik di wilayah tersebut. Pemerintah [TUR.GetAdjective] membalas dengan menyebut [ITA.GetNameDef] sebagai ‘antagonis regional’."
 bftb_news.207.a: "Nasib kita sudah menunggu."
 bftb_news.207.b: "Syukurlah."
 bftb_news.207.c: "Ini akan menjadi masalah."
 bftb_news.207.d: "Hmm."
 bftb_news.208.t: "[TUR.GetNameDefCap] Menuntut Pengembalian Perbatasan 1920"
 bftb_news.208.desc: "[TUR.GetNameDefCap] telah mengumumkan niatnya untuk mengubah batas negaranya menjadi seperti sebelumnya sebelum [TUR.GetNameDef] meratifikasi Sumpah Nasional. Pemerintah [TUR.GetAdjective] telah mengajukan klaim terhadap hampir seluruh negara bagian tetangganya, dan menolak seruan untuk mencabut klaim palsunya.\n\nKomunitas internasional telah banyak mengecam pemerintahan [TUR.GetAdjective] atas keputusannya, dan terdapat kekhawatiran global bahwa tindakan sembrono yang dilakukan oleh kepemimpinan [TUR.GetAdjective] hanya akan membuat kekacauan global yang telah dirasakan dunia selama beberapa tahun terakhir. [TUR.GetNameDefCap] tampaknya berkomitmen pada jalur revanchisme, namun hanya waktu yang akan menentukan apa hasil dari pemerintahan mereka."
 bftb_news.208.a: "Kita tidak bisa menyibukkan diri dengan skema [TUR.GetAdjective]."
 bftb_news.208.b: "Embargo tampaknya cukup."
 bftb_news.208.c: "Penghasut perang!"
 bftb_news.208.d: "Kami hanya menginginkan apa yang menjadi hak kami."
 bftb_news.208.e: "Itu hanya memperburuk keadaan!"
 bftb_news.209.t: "Munculnya Turan"
 bftb_news.209.desc: "Penaklukan Turki telah berkembang hingga pemerintah Turki merasa dibenarkan untuk menyatakan diri mereka sebagai [TUR.GetNameDef]. Debutnya kerajaan baru ini telah memicu kejutan di seluruh dunia, karena hanya ada sedikit pengamat yang percaya bahwa Turki akan mampu pulih sepenuhnya dari Perang Kemerdekaan dalam beberapa dekade berikutnya – apalagi membangun kerajaan baru yang tersebar di berbagai benua.\n\nJika laporan dapat dipercaya, [TUR.GetAdjective] yang baru dibentuk mungkin masih belum selesai dengan ekspansi cepatnya, dengan [TUR.GetLeader] menyatakan bahwa mereka tidak akan pernah menghentikan penaklukan mereka sampai setiap orang Turki di dunia telah dibebaskan. Dunia hanya bisa terus menyaksikan dengan nafas tertahan."
 bftb_news.209.a: "Kami tidak dapat dihentikan."
 bftb_news.209.b: "Bagaimana...?"
 bftb_news.301.t: "Perang Saudara [GRE.GetAdjective]!"
 bftb_news.301.desc: "Perang saudara telah pecah di [GRE.GetNameDef] antara kekuatan yang setia kepada raja yang membubarkan Parlemen Hellenic, dan kekuatan republik dan komunis yang setia pada prinsip demokrasi [GRE.GetNameDef]. Meskipun ada banyak permusuhan antara Partai Republik dan Komunis, mereka bersatu dalam upaya untuk menggulingkan raja asing yang tidak populer yang telah memaksakan dirinya sebagai penguasa lalim di seluruh negara [GRE.GetAdjective].\n\n[GRE.GetLeader] telah berjanji bahwa baik dia maupun kekuatan monarki yang setia kepadanya tidak akan menghentikan perjuangan mereka sampai semua kekuatan anti-monarki telah diusir dari negara tersebut."
 bftb_news.301.a: "Berkumpul ke Raja!"
 bftb_news.301.b: "Pemerintahan royalis bisa melayani kita dengan baik..."
 bftb_news.301.c: "Bagus, bagus - pisahkan dirimu!"
 bftb_news.301.d: "Akankah Yunani mendapat jeda?"
 bftb_news.302.t: "Pembentukan Yunani Raya"
 bftb_news.302.desc: "Para pengamat di seluruh dunia yang bertanya-tanya tentang Konvensi Heraklion yang penuh rahasia yang dihadiri banyak orang dari seluruh Eropa, tidak perlu bertanya-tanya lagi, karena hari ini [GRE.GetLeader] telah menyatakan bahwa impian [GRE.GetAdjective] tentang Yunani Raya akhirnya terwujud.\n\nPara ahli telah menyatakan keterkejutan mereka atas pesatnya ekspansi [GRE.GetNameDef], dengan menyebutkan gejolak politik dan kesengsaraan ekonomi yang mendalam sebagai alasan mengapa pergolakan [GRE.GetAdjective] tampaknya tidak mungkin terjadi, namun kejadian baru-baru ini telah membuktikan bahwa semua hal tersebut salah."
 bftb_news.302.a: "Impian kami akhirnya terpenuhi!"
 bftb_news.302.b: "Biasanya kami tidak akan memaafkan perilaku seperti itu, tapi..."
 bftb_news.302.c: "Itu tidak akan berguna bagi mereka!"
 bftb_news.302.d: "Wah."
