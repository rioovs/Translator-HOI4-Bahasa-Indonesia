 #Zaibatsu
 SEA_imperial_influence_events.300.t: "Fraksi Zaibatsu Kehilangan Pengaruh"
 SEA_imperial_influence_events.300.desc: "Zaibatsu telah mencoba meningkatkan pengaruh mereka atas [GetImperialInfluenceRulerTitle], namun karena kekurangan mereka, mereka gagal melakukannya. Oleh karena itu, mereka kini kehilangan muka dan gengsi, yang berarti pengaruh mereka pun menurun."
 SEA_imperial_influence_events.310.t: "Fraksi Zaibatsu Berusaha Memperluas Basis Industri Kami"
 SEA_imperial_influence_events.310.desc: "Para pemimpin Zaibatsu telah menyampaikan tuntutan mereka. Tampaknya mereka ingin memperluas kepemilikan dan industri serta pengaruh mereka terhadap [GetImperialInfluenceRulerTitle], dan dengan demikian menuntut agar kita membangun lebih banyak Pabrik Sipil untuk meningkatkan basis industri kita. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.320.t: "Fraksi Zaibatsu Menuntut Penunjukan Politik"
 SEA_imperial_influence_events.320.desc: "Para pemimpin Zaibatsu telah menyampaikan tuntutan mereka. Tampaknya mereka ingin setidaknya salah satu anggotanya ditempatkan di dewan penasihat [GetImperialInfluenceRulerTitle], sehingga mereka dapat memandu industrialisasi dan jalur bangsa. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.330.t: "Fraksi Zaibatsu Menginginkan Perubahan Undang-Undang Ekonomi"
 SEA_imperial_influence_events.330.desc: "Para pemimpin Zaibatsu telah menyampaikan tuntutan mereka. Mereka ingin kita menyesuaikan strategi ekonomi negara kita, dan agar lebih banyak dana disalurkan ke konglomerat industri. Meskipun berkedok hanya untuk memperkuat perekonomian kita, mereka nampaknya juga ingin meningkatkan kendali dan pengaruhnya atas [GetImperialInfluenceRulerTitle]. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.340.t: "Fraksi Zaibatsu Menuntut Kami Menyewa Perusahaan Industri"
 SEA_imperial_influence_events.340.desc: "Para pemimpin Zaibatsu telah menyampaikan tuntutan mereka. Tampaknya mereka ingin setidaknya satu dari perusahaan mereka dipekerjakan untuk kontrak langsung oleh [GetImperialInfluenceRulerTitle], sehingga mereka dapat memandu industrialisasi dan jalur bangsa. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 #Government
 SEA_imperial_influence_events.400.t: "Pemerintahan Sipil Kehilangan Pengaruh"
 SEA_imperial_influence_events.400.desc: "Pemerintahan Sipil telah mencoba meningkatkan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], namun karena kekurangannya, mereka gagal melakukannya. Oleh karena itu, mereka kini kehilangan muka dan gengsi, yang berarti pengaruh mereka pun menurun."
 SEA_imperial_influence_events.420.t: "Fraksi Pemerintahan Sipil Menuntut Penunjukan Politik"
 SEA_imperial_influence_events.420.desc: "Para pemimpin partai telah menyampaikan tuntutan mereka. Tampaknya mereka ingin setidaknya salah satu anggotanya ditempatkan di dewan penasihat [GetImperialInfluenceRulerTitle], sehingga mereka dapat memandu arah politik negara dan mengarahkannya menuju masa depan yang lebih cerah. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.430.t: "Fraksi Pemerintahan Sipil Menginginkan Perubahan Hukum Perdagangan"
 SEA_imperial_influence_events.430.desc: "Para pemimpin partai telah menyampaikan tuntutan mereka. Mereka ingin kita menyesuaikan strategi ekonomi negara kita, dan agar strategi investasi dan perdagangan dialihkan ke arah internasionalisme dan hubungan yang lebih baik dengan mitra dagang kita. Meskipun berkedok hanya untuk memperkuat perekonomian kita, mereka nampaknya juga ingin meningkatkan kendali dan pengaruhnya atas [GetImperialInfluenceRulerTitle]. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.440.t: "Fraksi Pemerintahan Sipil Berusaha membatasi Pengaruh Angkatan Darat"
 SEA_imperial_influence_events.440.desc: "Para pemimpin partai telah menyampaikan tuntutan mereka. Tampaknya mereka putus asa dengan semakin besarnya kekuatan dan pengaruh Angkatan Darat atas [GetImperialInfluenceRulerTitle], dan menginginkan tindakan cepat dalam membatasi pertumbuhan dan kekuatan mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.450.t: "Fraksi Pemerintahan Sipil Berusaha membatasi Pengaruh Angkatan Laut"
 SEA_imperial_influence_events.450.desc: "Para pemimpin partai telah menyampaikan tuntutan mereka. Tampaknya mereka putus asa dengan semakin besarnya kekuatan dan pengaruh Angkatan Laut atas [GetImperialInfluenceRulerTitle], dan menginginkan tindakan cepat dalam membatasi pertumbuhan dan kekuatan mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.460.t: "Fraksi Pemerintahan Sipil Berusaha Membatasi Pengaruh Zaibatsus"
 SEA_imperial_influence_events.460.desc: "Para pemimpin partai telah menyampaikan tuntutan mereka. Tampaknya mereka putus asa dengan semakin besarnya kekuatan dan pengaruh Zaibatsus atas [GetImperialInfluenceRulerTitle], dan menginginkan tindakan cepat dalam membatasi pertumbuhan dan kekuatan mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_japan_air_accidents_events.01.t: "Kematian Tragis $JAP_isoroku_yamamoto$"
 SEA_japan_air_accidents_events.01.desc: "Laksamana Isoroku Yamamoto telah ditembak jatuh oleh tembakan musuh hari ini. Sekelompok pejuang [USA.GetAdjective] mencegatnya setelah menyadap transmisi intelijen kami. Setelah menamakan serangan keterlaluan mereka 'Operasi Pembalasan', jelas mereka berniat mengirimkan pesan. Sementara bangsa kita berduka atas kehilangan pejuang hebat ini, kita tidak boleh melupakan tugas kita untuk menjatuhkan musuh yang tidak terhormat ini!"
 SEA_japan_air_accidents_events.01.a: "Sebuah pukulan telak..."
 SEA_japan_air_accidents_events.02.t: "Operasi Pembalasan Dihindari"
 SEA_japan_air_accidents_events.02.desc: "Laksamana Isoroku Yamamoto mendapat serangan dari musuh saat terbang dalam transit hari ini. Berhasil menghubungi angkatan udara angkatan laut di wilayah tersebut dan menghindari serangan, Yamamoto berhasil menyelinap pergi dan berhasil mendaratkan pesawatnya. Laksamana dipuji karena keberaniannya dan tetap tenang dalam situasi panas seperti ini."
 SEA_japan_air_accidents_events.02.a: "Kehormatannya telah dijunjung tinggi"
 ## NEWS EVENTS 
 SEA_japan_news_events.01.t: "[JAP.GetLeader] Berbicara Menentang Campur Tangan Militer"
 SEA_japan_news_events.01.desc: "\nDalam pidato berapi-api yang disampaikan oleh [JAP.GetLeader], ia menyatakan bahwa militer telah bertindak terlalu jauh kali ini, menyusul upaya kudeta baru-baru ini oleh faksi Kōdōha di dalam angkatan bersenjata. Ia lebih lanjut mengklaim bahwa 'jika pembunuhan yang tak terhitung jumlahnya dan upaya menggulingkan pemerintah kita oleh elemen-elemen pinggiran tidak cukup, mereka kini juga berusaha menggunakan kejadian baru-baru ini untuk memperkuat kekuasaan mereka sendiri dan merebut kendali negara kita dari rakyatnya. Ini tidak bisa dibiarkan terus berlanjut!'\n\nSepertinya konflik sedang terjadi di [JAP.GetNameDef]."
 SEA_japan_news_events.01.a: "Kita harus kembali ke era Taishō!"
 SEA_japan_news_events.01.b: "Sepertinya seseorang akhirnya mendapat tulang punggung"
 SEA_japan_news_events.02.t: "Pembentukan Lingkungan Kemakmuran Bersama Asia Timur Raya"
 SEA_japan_news_events.02.desc: "\nDengan tujuan yang diusulkan untuk memastikan kemandirian ekonomi dan kerja sama di antara negara-negara anggota, serta melawan pengaruh imperialisme Barat dan komunisme Soviet, [JAP.GetLeader] hari ini mengumumkan pendirian Dai Tōa Kyōeiken. Apakah ini benar-benar tujuan serikat pekerja, atau sekadar taktik hati-hati yang dilakukan mesin propaganda [JAP.GetAdjective], masih menjadi pemikiran utama setiap orang."
 SEA_japan_news_events.02.a: "Kami akan membawa kemakmuran ke seluruh Asia!"
 SEA_japan_news_events.02.b: "Taktik lain dari mesin propaganda"
 SEA_japan_news_events.03.t: "Jatuhnya Rangoon"
 SEA_japan_news_events.03.d: "Serangan Jepang berlanjut di Burma, dan baru-baru ini terjadi jatuhnya Rangoon. Sebagai ibu kota Burma Britania, kota ini memiliki kepentingan strategis yang sangat besar dan kekalahannya mungkin menjadi faktor penentu dalam kampanye Burma yang sedang berlangsung.\n\nGubernur Kolonial sendiri dilaporkan ditangkap oleh unit depan Jepang saat dia mengawasi pemindahan barang-barangnya dari Rumah Gubernur ke karavan truk, namun hal ini belum dapat dikonfirmasi."
 SEA_japan_news_events.03.a: "Kemenangan lain melawan Imperialisme!"
#########################
### NATIONALIST CHINA ###
#########################
 # Requesting Soviet aid 
 SEA_china.1.t: "[FROM.GetNameDefCap] Mencari Dukungan Kami"
 SEA_china.1.desc: "Kami telah menerima permintaan dari [FROM.GetNameDef] yang meminta kami untuk mengirimkan dukungan materi. Meskipun [FROM.GetLeader] pernah membuat pernyataan yang meragukan tentang kami di masa lalu, hal ini bisa menjadi peluang untuk mengikat kepentingan asing di kawasan ini."
 SEA_china.1.a: "Kami akan mendukung mereka"
 SEA_china.1.b: "Itu terlalu berisiko"
 SEA_china.2.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 SEA_china.2.desc: "Setelah mendapatkan kejelasan, [FROM.GetNameDef] telah memutuskan untuk mendukung perjuangan kami. Kami tidak mendapat kesan bahwa ini adalah tindakan kebaikan, namun lebih merupakan tindakan demi kepentingan pribadi agar kami melakukan pekerjaan kotor mereka."
 SEA_china.2.a: "Ini akan membantu upaya kita"
 SEA_china.3.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
 SEA_china.3.desc: "Tidak mengherankan, permintaan dukungan kami telah ditolak oleh [FROM.GetNameDef]. Meskipun harapan kami tidak pernah besar, kami berharap mereka setidaknya mengakui ancaman yang [JAP.GetNameDef] hadirkan di seluruh Asia. Namun ternyata, kami salah."
 SEA_china.3.a: "Apa yang bisa kita harapkan"
 # Requesting American/Allied aid
 SEA_china.4.t: "[FROM.GetNameDefCap] Mencari Dukungan Kami"
 SEA_china.4.desc: "Penyelidikan telah dikirim dari [FROM.GetLeader] ke [FROM.GetNameDef], meminta bantuan finansial dan material dalam konflik mereka melawan [JAP.GetNameDef]. Pesannya tidak hanya melalui nirkabel atau utusan, tetapi melalui seseorang seperti $CHI_soong_mei_ling$, yang telah menarik cukup banyak orang saat melakukan perjalanan melalui [ROOT.GetName]. Meskipun mengikat [JAP.GetNameDef] akan menguntungkan kita sendiri, kita mungkin juga mendapat keuntungan dari popularitas tur ini."
 SEA_china.4.a: "Kami akan mendukung mereka"
 SEA_china.4.b: "Kita harus menjaga keamanan kita sendiri terlebih dahulu"
 SEA_china.4.tt: "Meningkatkan hadiah §YPeralatan Artileri§! dari §YTunjukkan Tekad Kami§! sebanyak 100"
 SEA_china.5.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 SEA_china.5.desc: "Kami telah menerima jawaban atas permintaan kami, dan dengan senang hati melaporkan bahwa dana asing akan segera tersedia bagi kami. Hal ini seharusnya menjadi keuntungan besar bagi industri kita dan memungkinkan kita untuk mengembangkan angkatan bersenjata kita secara signifikan, dan sangat mungkin, bantuan tersebut nantinya dapat diperluas hingga mencakup materiil."
 SEA_china.5.a: "Jalan menuju kemenangan terbuka lebar"
 SEA_china.5.tt: "Meningkatkan hadiah §Y$CIC_BANK_HEADER$§! dari §YTunjukkan Tekad Kami§! sebanyak §Y1000§!"
 SEA_china.6.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
 SEA_china.6.desc: "Jawaban atas permohonan kami telah kembali dari [FROM.GetNameDef], yang telah memilih untuk meninggalkan kami. Tidak akan ada bantuan yang dikirim, dan dana pun tidak akan tersedia. Kita berdiri sendiri dalam menghadapi agresi seperti yang sering kita alami sebelumnya. Kita akan menang karena jika tidak, warisan kita akan terlupakan."
 SEA_china.6.a: "Berjuang untuk kelangsungan hidup negara!"
 ### Warlord - Invitation to Join Faction
 SEA_china.7.t: "Undangan Dari [FROM.GetName]"
 SEA_china.7.desc: "Pemerintah pusat [FROM.GetName] telah menyampaikan undangan kepada [ROOT.GetName] untuk bergabung dengan faksi mereka. Mereka berbicara tentang persatuan nasional dan perlunya melawan gangguan asing sebagai satu kesatuan. Meskipun perbedaan ideologi masih ada, prospek kerja sama dalam menghadapi ancaman yang semakin besar mungkin perlu dipertimbangkan."
 SEA_china.7.a: "Kita akan berdiri bersama melawan musuh-musuh kita"
 SEA_china.7.b: "Kami tidak akan menukar kemerdekaan dengan janji"
 ### SEA_china.8 - Acceptance
 SEA_china.8.t: "[FROM.GetName] Menerima Undangan"
 SEA_china.8.desc: "[FROM.GetLeader] telah menyetujui proposal kami. [FROM.GetNameDefCap] akan bergabung dengan faksi kami dan berdiri di samping kami dalam perjuangan untuk mempersatukan bangsa dan mempertahankannya dari ancaman eksternal. Hal ini menandai langkah signifikan menuju persatuan Tiongkok yang lebih besar."
 SEA_china.8.a: "Bersama-sama, kita lebih kuat"
 ### SEA_china.9 - Rejection
 SEA_china.9.t: "[FROM.GetName] Menolak Penawaran"
 SEA_china.9.desc: "[FROM.GetLeader] telah menolak bergabung dengan faksi kami, dengan alasan perlunya menjaga independensi regional dan otonomi politik. Meskipun disayangkan, keputusan ini mencerminkan perpecahan yang berkepanjangan di negara ini."
 SEA_china.9.a: "Mereka akan menyesalinya pada waktunya"
# Joining the Allies
 SEA_china.10.t: "[FROM.GetNameDefCap] Permintaan untuk Bergabung dengan Kami"
 SEA_china.10.desc: "Kami telah menerima tawaran dari [FROM.GetNameDef] untuk bergabung dengan [ROOT.GetFactionName] bersama seluruh anggota [FROM.GetFactionName]. Jika kami menerimanya, maka akan berkurang satu lawan potensial yang tersisa, dan posisi kami akan menguat. Pertanyaannya adalah apakah niat mereka dapat dipercaya untuk tidak berusaha menggantikan kita."
 SEA_china.10.a: "Kekuatan kita ada pada angka"
 SEA_china.10.b: "Kami tidak bisa menerima ini"
 SEA_china.11.t: "[FROM.GetNameDefCap] Mendukung Pendaftaran Kami"
 SEA_china.11.desc: "Kami telah mendapatkan tanggapan dari pemimpin [FROM.GetFactionName], dan era untuk melihat ke dalam di sudut dunia kita sendiri telah berakhir. Pemerintah [FROM.GetNameDef] menyambut kami dengan tangan terbuka, dan kini kami dapat mengambil tempat di dunia dengan kesetaraan."
 SEA_china.11.a: "Kita menempuh jalan ini bersama-sama"
 SEA_china.12.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
 SEA_china.12.desc: "Para pemimpin [FROM.GetFactionName] telah menolak tawaran kami untuk bergabung. Ini adalah kesempatan untuk membawa perdamaian dan stabilitas ke dunia, namun sayangnya ada beberapa pihak yang menentang hal tersebut."
 SEA_china.12.a: "Sayang sekali"
 SEA_china.12.b: "Kita berjalan di jalan kita sendiri"
# Chiang gets killed
 SEA_china.13.t: "[CHI.GetLeader] Telah Dibunuh"
 SEA_china.13.desc: "Pemimpin kita yang mulia [CHI.GetLeader] telah tertembak di dalam mobilnya, sebuah akhir yang membawa bencana dari sebuah pertemuan di jalan yang tidak bersahabat. Kami telah diberitahu bahwa pria bersenjata itu bertindak sendiri, tetapi karena dia terbunuh dalam pengejaran, setiap calon konspirator akan bebas. Partai sudah mulai mencari penggantinya."
 SEA_china.13.a: "Tragis sekali"
# Giving away Subject
 SEA_china.14.t: "[FROM.GetName] Mentransfer Kontrolnya ke [JAP.GetNameDef]"
 SEA_china.14.desc: "Dalam keputusasaan mereka untuk menenangkan [JAP.GetNameDef], pemerintah pusat telah menawarkan mereka kekuasaan atas kami. Ini adalah tindakan yang tercela. Kami tidak mengharapkan keberanian seperti itu dari pemerintahan baru."
 SEA_china.14.a: "Sebuah Ketercapaian yang..."
 SEA_china.14.b: "Kami tidak bisa menerima ini, ayo angkat senjata!"
 SEA_china.15.t: "Kontrol atas [FROM.GetNameDef] Telah Diberikan kepada Kami"
 SEA_china.15.desc: "Untuk menenangkan anggota angkatan bersenjata kami yang mendorong perang, [CHI.GetName] telah mengalihkan kendali atas [FROM.GetName] kepada kami. Sepertinya kita tidak akan mengalami konflik apa pun dalam waktu dekat."
 SEA_china.15.a: "Baiklah"
 # Informing Japan
 SEA_china.16.t: "[From.GetName] Telah Memberi Kami Hak Docking"
 SEA_china.16.desc: "Dalam upaya untuk menenangkan kami agar tidak menyerang, [From.GetName] telah memberi kami hak untuk melakukan docking. Tentara Kwantung telah memutuskan untuk mundur sekarang."
 SEA_china.16.a: "Luar biasa!"
 SEA_china.17.t: "[From.GetName] Telah Memberi Kami Akses Pangkalan Udara"
 SEA_china.17.desc: "Dalam upaya untuk menenangkan kami agar tidak menyerang, [From.GetName] telah memberi kami akses pangkalan udara. Tentara Kwantung telah memutuskan untuk mundur sekarang."
 SEA_china.17.a: "Luar biasa!"
 SEA_china.18.t: "[From.GetName] Telah Memberi Kami Hak Sumber Daya"
 SEA_china.18.desc: "Dalam upaya untuk menenangkan kami agar tidak menyerang, [From.GetName] telah memberi kami hak sumber daya. Tentara Kwantung telah memutuskan untuk mundur sekarang."
 SEA_china.18.a: "Luar biasa!"
### Chinese Nine-Power Treaty Crisis ###
 SEA_china.19.t: "[CHI.GetName] Menuntut Pencabutan Perjanjian Sembilan Negara"
 SEA_china.19.desc: "Surat resmi dari [CHI.GetNameDef] sampai ke Kementerian Luar Negeri kami hari ini. Mereka berpendapat bahwa Perjanjian Sembilan Negara membelenggu kedaulatan [CHI.GetAdjective] dan harus segera dicabut. [CHI.GetLeader] menegaskan bahwa pakta tersebut merupakan peninggalan paksaan dan berjanji untuk merebut kembali kemerdekaan penuh, dengan atau tanpa persetujuan kami."
 SEA_china.19.a: "Menyetujui permintaan Beijing"
 SEA_china.19.b: "Menolak untuk membatalkan perjanjian tersebut"
 SEA_china.19_tt: "§RKami akan bergabung dalam perang Tiongkok melawan Jepang!§!"
# FROM accepts Beijing’s demand without reservation ---
 SEA_china.20.t: "[FROM.GetName] Mengabaikan Perjanjian Sembilan Negara"
 SEA_china.20.desc: "[FROM.GetNameDefCap] telah menegaskan penarikan segera dari Perjanjian Sembilan Negara. Mereka mengakui bahwa perjanjian tersebut sudah tidak berlaku lagi dan bahwa kedaulatan [CHI.GetAdjective] tidak boleh terbebani."
 SEA_china.20.a: "Kemenangan yang disambut baik dan menentukan"
# China reacts to refusal 
 SEA_china.21.t: "[FROM.GetName] Menentang Beijing"
 SEA_china.21.desc: "[FROM.GetNameDefCap] menolak untuk membatalkan Perjanjian Sembilan Negara, dengan alasan rapuhnya keseimbangan kekuatan di Pasifik. Penghinaan ini akan membuat marah manusia mana pun, namun masa antek-antek imperialis sudah berakhir. Kita harus memutuskan apakah akan meningkatkan tekanan atau mundur dari arena diplomatik."
 SEA_china.21.a: "Tekan masalahnya"
 SEA_china.21.b: "Mundur untuk saat ini"
# Beijing escalates; target nation must respond
 SEA_china.22.t: "[CHI.GetName] Menekan Masalah"
 SEA_china.22.desc: "Beijing berlipat ganda. Kabinet sedang memperdebatkan bagaimana menjawab tekanan yang meningkat ini dan apakah akan membalas dengan embargo yang dapat mengganggu perdagangan, atau melepaskan sepenuhnya [CHI.GetName] dari kewajibannya."
 SEA_china.22.a: "Terapkan embargo pada [CHI.GetName]"
 SEA_china.22.b: "Jangan lakukan apa pun"
#FROM enacts a blockade against China ---
 SEA_china.23.t: "[FROM.GetName] Menjatuhkan Embargo pada Kami"
 SEA_china.23.desc: "Pemerintah [FROM.GetAdjective] telah mengumumkan embargo terhadap kami sebagai hukuman atas penolakan kami terhadap Perjanjian Sembilan Negara, dan para pengawas pelabuhan dari [FROM.GetNameDef] kini menolak setiap kapal barang Tiongkok. Pers dalam negeri mengecam tindakan tersebut sebagai pencekikan ekonomi, sebuah langkah terakhir dari era imperialisme yang telah lama berlalu."
 SEA_china.23.a: "Kami tidak akan gentar"
#FROM yields to Chinese pressure and scraps the treaty ---
 SEA_china.24.t: "[FROM.GetName] Membatalkan Perjanjian Sembilan Negara"
 SEA_china.24.desc: "Sebuah kabel dari [FROM.GetNameDef] mencapai Nanjing, mengonfirmasi penarikan diri mereka dari Perjanjian Sembilan Negara. Patroli sungai asing bersiap untuk berlayar pulang, sementara diplomat [FROM.GetAdjective] mengakui bahwa perjanjian tersebut tidak lagi mengikat Tiongkok. Kerumunan orang berkumpul di hadapan Kementerian Luar Negeri ketika radio mengumumkan berakhirnya perjanjian yang tidak setara."
 SEA_china.24.a: "Kemenangan kedaulatan nasional"
# China requests Armor MIO
 SEA_china.25.t: "Tiongkok Meminta Spesialis Armor"
 SEA_china.25.desc: "[FROM.GetNameDefCap] telah menghubungi kami dengan permintaan agar spesialis dari unit lapis baja kami mendukung peralihan mereka ke gaya peperangan yang lebih modern. Kami dapat mengirimkan tim penasihat dari salah satu produsen besar kami, atau langsung menolak permintaan mereka."
 SEA_china.25.a: "$morozov_design_bureau$"
 SEA_china.25.b: "$astrov_design_bureau$"
 SEA_china.25.c: "$okmo$"
 SEA_china.25.d: "Mereka tidak layak menerima bantuan"
 SOV_accepted_Morozov: "[SOV.GetNameDefCap] mengirim tim dari $morozov_design_bureau$."
 SOV_accepted_Astrov: "[SOV.GetNameDefCap] mengirimkan tim dari $astrov_design_bureau$."
 SOV_accepted_OKMO: "[SOV.GetNameDefCap] mengirimkan tim dari $okmo$."
# Answering yes
 SEA_china.26.t: "[SOV.GetNameDefCap] Jawaban"
 SEA_china.26.desc: "Kami kini telah mendapatkan jawaban dari [SOV.GetNameDef] yang menyatakan mereka setuju untuk mengirimkan sekelompok ahli kepada kami. Bantuan akan segera tiba, dan jika sudah tiba, kami dapat menugaskan para spesialis untuk bekerja memperkuat korps tank kami."
 SEA_china.26.a: "Kami berbaris menuju kemenangan"
# Answering no 
 SEA_china.27.t: "[SOV.GetNameDefCap] Jawaban"
 SEA_china.27.desc: "Sayangnya [SOV.GetNameDef] memutuskan untuk tidak mengirimkan bantuan yang kami perlukan. Meskipun kami tidak mengetahui alasan penolakan permintaan kecil ini, tampaknya kami harus mencari cara alternatif..."
 SEA_china.27.a: "Mereka akan menyesalinya pada waktunya"
 SEA_china.28.t: "[FROM.GetName] Menuntut Subjugasi"
 SEA_china.28.desc: "Pemerintah pusat telah menyerah kepada [JAP.GetNameDef], dan berjanji untuk tidak menentang agresi teritorialnya. Pukulan kini menimpa kami, dengan [JAP.GetAdjective] yang menuntut tanah kami, dan meminta aneksasi melalui paksaan diplomatik."
 SEA_china.28.a: "Kami tidak punya pilihan"
 the_game_will_end_for_us: "§RPertandingan akan berakhir untuk kita§!"
 SEA_china.28.b: "Tidak pernah!"
# Zhang Xueliang getting thrown in jail
 SEA_china.29.t: "Nasib $CHI_zhang_xueliang$"
 SEA_china.29.desc: "Dalam semangatnya untuk kebebasan negara kita $CHI_zhang_xueliang$ telah melampaui posisinya dengan selisih yang besar. Biasanya hal ini tidak dapat diterima, namun kita tidak hidup di masa normal dan meskipun [ROOT.GetLeader] menuntut kita untuk memenjarakannya, kompetensi [CHI_zhang_xueliang.GetName] terbukti berguna."
 SEA_china.29.a: "Lemparkan dia ke penjara!"
 SEA_china.29.b: "Kita tidak bisa kehilangan dia..."
 SEA_china_improvement.1.t: "Kelas Perwira Baru"
 SEA_china_improvement.1.desc: "Matahari bersinar, kemeja sudah disetrika dan sepatu bot sudah dipoles. Para prajurit berdiri dalam barisan yang rapi, mendengarkan [ROOT.GetLeader] yang datang untuk menyampaikan pidato kelulusan mereka. Para lulusan akan segera menjadi yang terdepan dan membawa kejayaan bagi [ROOT.GetNameDef]."
 SEA_china_improvement.1.a: "Para sukarelawan berbaris menuju kejayaan"
 SEA_china_improvement.1_tt: "\n§Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! akan §Gmeningkat setiap 6 bulan§!"
 SEA_china_improvement.2.t: "Membasmi Racunnya"
 SEA_china_improvement.2.desc: "Menyadari dampak buruk perdagangan Opium terhadap otoritas negara dan kepercayaan publik, kita perlu memulai kampanye jangka panjang untuk mengurangi pengaruh sindikat opium. Para pejabat ditugasi melakukan pemeriksaan yang lebih ketat, perubahan administratif, dan kampanye kesadaran masyarakat, yang tidak akan membuahkan hasil dalam semalam. Namun, setiap langkah akan melemahkan jaringan bayangan yang memanfaatkan kerentanan [CHI.GetAdjective]."
 SEA_china_improvement.2.a: "Biarkan perjuangan panjang dimulai"
 SEA_china_improvement.2_tt: "Dampak negatif dari §YPerdagangan Gelap§! akan berkurang setiap bulan ke-6"
 SEA_china_improvement.3.t: "Akhir dari Keburukan"
 SEA_china_improvement.3.desc: "Setelah bertahun-tahun melakukan reformasi yang gigih, pembersihan secara diam-diam, dan pengawasan tanpa henti, jaringan opium besar yang terakhir telah dibongkar. Untuk pertama kalinya dalam beberapa dekade, keinginan negara berkuasa tanpa tertandingi di seluruh wilayah pedesaan. Orang-orang sinis bergumam tentang masa lalu, tetapi bahkan mereka harus mengakui bahwa suasananya lebih cerah."
 SEA_china_improvement.3.a: "Kerja Hebat"
 SEA_china_warlords.1.t: "[FROM.GetName] Menuntut Penaklukan Kita"
 SEA_china_warlords.1.desc: "Sebuah pesan telah tiba dari Nanjing, dengan stempel pemerintah pusat yang jelas. Di balik bahasa persatuan dan takdir nasional yang indah, terdapat sebuah tuntutan — kita harus tunduk pada [FROM.GetLeader] dan menerima otoritas [FROM.GetNameDef] atas domain kita. Tidak ada ruang untuk negosiasi, hanya kepatuhan atau konsekuensi."
 SEA_china_warlords.1.a: "Biarkan mereka datang dan mencoba"
 SEA_china_warlords.1.b: "Kami tidak punya pilihan selain menurut"
 SEA_china_warlords.1.tt: "§RKita akan menjadi subjek [FROM.GetName]§!"
 SEA_china_warlords.2.t: "[FROM.GetName] Menundukkan Kepala"
 SEA_china_warlords.2.desc: "[FROM.GetName] telah menerima ultimatum kami. Para pemimpin mereka berbicara tentang persatuan nasional dan takdir sejarah, namun maknanya jelas — mereka kini mengakui supremasi [ROOT.GetNameDef].\nMeskipun pengajuan mereka mungkin enggan, hal ini akan menghindarkan Tiongkok dari perpecahan dan pertumpahan darah lebih lanjut."
 SEA_china_warlords.2.a: "Matahari yang hancur mengumpulkan cahayanya"
 SEA_china_warlords.3.t: "[FROM.GetName] Menolak"
 SEA_china_warlords.3.desc: "Ultimatum tersebut ditolak. Dalam tindakan pembangkangan yang kurang ajar, [FROM.GetLeader] telah menegaskan bahwa rakyatnya tidak akan menyerah. Jika utusan kita dibubarkan, diplomasi akan membuka jalan bagi perang."
 SEA_china_warlords.3.a: "Kemudian mereka akan ditundukkan"
 SEA_china_warlords.4.t: "[FROM.GetNameDef] Menuntut Aneksasi Penuh"
 SEA_china_warlords.4.desc: "Dengan stabilnya situasi, dan pemerintah pusat ditegaskan kembali, [FROM.GetNameDef] bergerak untuk menghapus sisa-sisa otonomi panglima perang. [THIS.GetNameDefCap] kini diperkirakan akan menyerahkan seluruh kendali administratif dan militer yang tersisa kepada pemerintah pusat, sehingga menyelesaikan proses unifikasi."
 SEA_china_warlords.4.a: "Kita perlu menundukkan kepala"
 SEA_china_warlords.4.b: "Tidak pernah!"
 SEA_china_warlords.5.t: "[FROM.GetNameDefCap] Menerima Integrasi"
 SEA_china_warlords.5.desc: "Menyadari perlunya persatuan nasional, [FROM.GetLeader] telah setuju untuk membubarkan [FROM.GetNameDef] dan mengalihkan seluruh wewenang ke [ROOT.GetNameDef]. Angkatan bersenjata mereka diserap ke dalam struktur komando nasional, sementara badan administratif mereka dibubarkan."
 SEA_china_warlords.5.a: "Persatuan menang"
 SEA_china_warlords.6.t: "[FROM.GetNameDefCap] Menolak Integrasi"
 SEA_china_warlords.6.desc: "Secara terbuka menentang pemerintah pusat, [FROM.GetLeader] telah menolak ultimatum tersebut. [FROM.GetNameDefCap] tetap menjadi subjek nominal, namun tindakan mereka mengakui aspirasi kemerdekaan. Pembangkangan ini tidak bisa dibiarkan begitu saja."
 SEA_china_warlords.6.a: "Mereka akan menyesali hal ini"
 SEA_china_democratic.1.t: "Seorang Presiden untuk Republik"
 SEA_china_democratic.1.desc: "Akhirnya tiba waktunya untuk menegakkan kembali pemilu yang bebas di Tiongkok, dan memulihkan republik yang dihancurkan oleh kekuatan eksternal dan internal. Namun pertanyaannya tetap, siapa yang akan mengambil peran Dr. Sun, dan menjadi presiden pertama republik baru ini?"
 SEA_china_democratic.1.a: "CPWDP memiliki kandidat yang bagus"
 SEA_china_democratic.1.b: "Carsun Chang telah menunjukkan kemampuannya"
 SEA_china_democratic.1.c: "Soong Ching-ling adalah pemimpin yang ideal"
 SEA_china_democratic.1.d: "Zeng Qi harus diberi kesempatan ini"
 SEA_china_democratic.2.t: "[FROM.GetNameDefCap] Mengundang Kami ke Aliansi Mereka"
 SEA_china_democratic.2.desc: "Delegasi dari jauh baru-baru ini tiba di ibu kota kami, meminta audiensi dengan [ROOT.GetLeader]. Mereka mengaku berasal dari [FROM.GetNameDef], dan mencari aliansi antar negara kita. Apakah kita menerimanya?"
 SEA_china_democratic.2.a: "Kita akan menjadi lebih kuat bersama-sama"
 SEA_china_democratic.2.b: "Itu akan bertentangan dengan prinsip netralitas kami..."
 SEA_china_democratic.3.t: "[FROM.GetNameDefCap] Menerima Undangan Kami"
 SEA_china_democratic.3.desc: "[FROM.GetLeader] telah dengan senang hati menerima tawaran kami untuk meresmikan aliansi antar negara, dan telah memulai inisiatif untuk berintegrasi ke dalam lingkungan kita. Hari ini adalah hari untuk perayaan!"
 SEA_china_democratic.3.a: "Mereka berbagi visi kami untuk masa depan"
 SEA_china_democratic.4.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_china_democratic.4.desc: "[FROM.GetLeader] dengan kasar memutuskan untuk menolak tawaran aliansi antar negara kita, dengan menyatakan bahwa hal itu akan melanggar prinsip netralitas mereka. Kita hanya bisa membayangkan besarnya korupsi yang menyebabkan keputusan yang salah ini."
 SEA_china_democratic.4.a: "Ini adalah kerugian mereka"
 SEA_china_democratic.5.t: "Perang Saudara di [ROOT.GetNameDef]"
 SEA_china_democratic.5.desc: "Setelah sekian lama tumbuhnya sentimen republik, nampaknya kaum demokrat [ROOT.GetAdjective] sudah bosan menunggu pergantian pemerintahan secara damai. Setelah wacana yang intens, tampaknya diplomasi telah gagal dan konflik bersenjata pun pecah."
 SEA_china_democratic.5.a: "Untuk Demokrasi!"
 SEA_china_democratic.5.b: "Kita harus menghentikan kebodohan ini!"
 SEA_china_democratic.6.t: "[FROM.GetNameDefCap] Menggugah Sentimen Partai Republik"
 SEA_china_democratic.6.desc: "Telah menjadi perhatian kami bahwa saat ini terdapat sel [FROM.GetAdjective] di negara kami yang menyebarkan sentimen republik. Meskipun hal ini tampaknya tidak berbahaya, tampaknya beberapa propaganda tersebut bersifat revolusioner. Laporan mengenai para pekerja yang didorong untuk berorganisasi dan bersatu menjadi semakin sering terjadi, dan jika dilihat dari sejarah terkini, kami tidak dapat memastikan bahwa ini bukanlah taktik rumit dari kepemimpinan [FROM.GetAdjective] untuk akhirnya mengintegrasikan kami."
 SEA_china_democratic.6.a: "Biarkan mereka melanjutkan"
 SEA_china_democratic.6.b: "Hancurkan para penghasut yang kurang ajar ini!"
 SEA_china_democratic.7.t: "[CHI.GetNameDefCap] Menuntut Kami Membebaskan Koloni Asia"
 SEA_china_democratic.7.desc: "Kami telah menerima pesan yang berisi kata-kata yang cukup tegas dari [CHI.GetNameDef]. Mereka menuntut kami melepaskan [CHI_country_to_be_liberated.GetNameDef] dan mengembalikan wilayah tersebut kepada pemilik sahnya."
 SEA_china_democratic.7.a: "Lagipula, kita tidak banyak memanfaatkan koloni-koloni itu."
 SEA_china_democratic.7.b: "Pemilik sah mereka adalah kita."
 SEA_china_democratic.7.b.tt: "§RIni akan memberi mereka sasaran perang pada kita!§!"
 SEA_china_democratic.8.t: "[FROM.GetNameDefCap] Setuju untuk Melepaskan [CHI_country_to_be_liberated.GetNameDef]"
 SEA_china_democratic.8.desc: "Tanggapan terhadap tuntutan kami agar [FROM.GetNameDef] merilis [CHI_country_to_be_liberated.GetNameDef] baru saja tiba. Mungkin sedikit mengejutkan, mereka setuju untuk melepaskan [CHI_country_to_be_liberated.GetNameDef] sebagai negara merdeka."
 SEA_china_democratic.8.a: "Sebuah hasil yang paling memuaskan"
 SEA_china_democratic.9.t: "[FROM.GetNameDefCap] Menolak Pelepasan Koloni"
 SEA_china_democratic.9.desc: "Tanggapan terhadap tuntutan kami agar [FROM.GetNameDef] merilis [CHI_country_to_be_liberated.GetNameDef] baru saja tiba. Menyatakan bahwa urusan luar negeri mereka bukan urusan kita, mereka menolak gagasan memberikan kemerdekaan yang sah kepada koloni."
 SEA_china_democratic.9.a: "Kita harus membebaskan mereka, apapun resikonya"
 SEA_china_democratic.10.t: "[FROM.GetNameDefCap] Ingin Kita Bergabung dalam Perang Mereka"
 SEA_china_democratic.10.desc: "Delegasi dari jauh baru-baru ini tiba di ibu kota kami, mencari audiensi dengan [ROOT.GetLeader]. Mereka mengaku berasal dari [FROM.GetNameDef], dan berharap agar kita ikut berperang melawan [JAP.GetNameDef]. Apakah kita menerimanya?"
 SEA_china_democratic.10.a: "Bersama untuk kemenangan!"
 SEA_china_democratic.10.b: "Itu akan bertentangan dengan prinsip netralitas kami..."
 SEA_china_democratic.11.t: "[FROM.GetNameDefCap] Menerima Permintaan Sederhana Kami"
 SEA_china_democratic.11.desc: "[FROM.GetLeader] telah dengan senang hati menerima tawaran kami untuk meresmikan aliansi anti-[JAP.GetAdjective] di antara negara-negara kita, dan telah mulai mengambil tindakan untuk melawan ancaman dari wilayah timur. Hari ini adalah hari untuk perayaan!"
 SEA_china_democratic.11.a: "Kami berhutang budi kepada rakyat mereka"
 SEA_china_democratic.12.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_china_democratic.12.desc: "[FROM.GetLeader] dengan kasar telah memutuskan untuk menolak tawaran aliansi anti-[JAP.GetAdjective] antar negara kita, dengan menyatakan bahwa hal tersebut akan bertentangan dengan prinsip netralitas mereka. Kita hanya bisa membayangkan besarnya korupsi yang menyebabkan keputusan yang salah ini."
 SEA_china_democratic.12.a: "Berita buruk..."
 SEA_china_democratic.13.t: "[FROM.GetNameDefCap] Mencari Dukungan Kami"
 SEA_china_democratic.13.desc: "Permintaan telah diterima dari [FROM.GetLeader] di [FROM.GetNameDef], tentang cara mendapatkan dukungan keuangan untuk negara mereka. Mereka telah mengumpulkan banyak [FROM.GetAdjective] ekspatriat yang tinggal di wilayah kami untuk mendukung perjuangan mereka, dan dukungan masyarakat pun meningkat untuk mendukung hal ini. Haruskah kita menerima permintaan mereka?"
 SEA_china_democratic.13.a: "Kami akan mendukung mereka"
 SEA_china_democratic.13.b: "Mereka harus mengurus perekonomian mereka sendiri"
 SEA_china_democratic.14.t: "[FROM.GetNameDefCap] Setuju untuk Mendukung Kami"
 SEA_china_democratic.14.desc: "Kami telah menerima jawaban atas permintaan kami, dan dengan senang hati melaporkan bahwa dana asing akan segera tersedia bagi kami. Hal ini seharusnya menjadi keuntungan bagi perekonomian kita, dan memungkinkan kita untuk mengembangkan industri dan angkatan bersenjata kita secara signifikan."
 SEA_china_democratic.14.a: "Jalan menuju kemenangan terbuka lebar"
 SEA_china_democratic.15.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
 SEA_china_democratic.15.desc: "Jawaban atas permohonan kami telah kembali dari [FROM.GetNameDef], yang telah memilih untuk meninggalkan kami. Tidak akan ada bantuan yang dikirim, dan dana pun tidak akan tersedia. Kami berdiri sendiri, meskipun ada dukungan populer di [FROM.GetNameDef]. Kita akan menang karena jika tidak, warisan kita akan terlupakan."
 SEA_china_democratic.15.a: "Kita telah disesatkan..."
 SEA_china_democratic.16.t: "[FROM.GetNameDefCap] Berinvestasi dalam Perekonomian Kita"
 SEA_china_democratic.16.desc: "Para industrialis yang tergabung dalam [FROM.GetNameDef] telah mulai mengembangkan industri lokal dan mendirikan perusahaan baru di dalam negeri kita. Hal ini pasti akan membawa kita lebih dekat pada kesejahteraan."
 SEA_china_democratic.16.a: "Kami berterima kasih kepada mereka atas investasi ini"
 SEA_china_democratic.16.b: "Kami tidak membutuhkan bantuan mereka!"
 SEA_china_democratic.17.t: "[FROM.GetName] Menuntut Pengajuan Kami"
 SEA_china_democratic.17.desc: "Sebuah pesan telah tiba dari Nanjing, dengan stempel pemerintah pusat yang jelas. Di balik bahasa persatuan dan takdir nasional yang indah, terdapat sebuah tuntutan — kita harus tunduk pada [CHI.GetLeader] dan menerima otoritas [CHI.GetNameDef] atas domain kita. Tidak ada ruang untuk negosiasi, hanya kepatuhan atau konsekuensi."
 SEA_china_democratic.17.a: "Kami tidak akan pernah menyerah!"
 SEA_china_democratic.17.b: "Itu yang terbaik untuk rakyat kami"
 SEA_china_democratic.17.tt: "§RKita akan menjadi subjek [FROM.GetName]§!"
 SEA_china_democratic.18.t: "[FROM.GetName] Kembali ke Republik"
 SEA_china_democratic.18.desc: "[FROM.GetName] telah menerima ultimatum kami. Para pemimpin mereka berbicara tentang persatuan nasional dan takdir sejarah, namun maknanya jelas — mereka kini mengakui supremasi [CHI.GetNameDef].\nMeskipun ketundukan mereka mungkin enggan, hal ini akan menghindarkan Tiongkok dari perpecahan dan pertumpahan darah lebih lanjut."
 SEA_china_democratic.18.a: "Matahari yang hancur mengumpulkan cahayanya"
 SEA_china_democratic.19.t: "[FROM.GetName] Menolak Pengiriman"
 SEA_china_democratic.19.desc: "Ultimatum tersebut ditolak. Dalam tindakan pembangkangan yang kurang ajar, [FROM.GetLeader] telah menegaskan bahwa rakyatnya tidak akan menyerah. Jika utusan kita dibubarkan, diplomasi akan membuka jalan bagi perang."
 SEA_china_democratic.19.a: "Kemudian mereka akan ditundukkan"
 SEA_china_democratic.20.t: "[FROM.GetNameDefCap] Menuntut Penerapan Mínquán!"
 SEA_china_democratic.20.desc: "[FROM.GetLeader], presiden [FROM.GetNameDef], telah mengirimkan permintaan resmi kepada kami untuk mulai menerapkan prinsip Mínquán di wilayah pemerintahan kami. Hal ini pasti akan membawa kita lebih dekat dengan Republik dan membantu pembangunan kita."
 SEA_china_democratic.20.a: "Kami akan patuh"
 SEA_china_democratic.20.b: "Ada sesuatu yang mencurigakan tentang ini!"
 SEA_china_misc.1.t: "$CHI_retreat_to_taiwan$"
 SEA_china_misc.1.desc: "$CHI_retreat_to_taiwan_desc$"
