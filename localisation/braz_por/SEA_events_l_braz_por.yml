#Tooltips
 PRC_gains_more_faction_inluence_tt: "[PRC.GetName] Mendapat Lebih Banyak Pengaruh Fraksi"
 SEA_PRC_request_aid.1.t: "[FROM.GetName] Meminta Senjata"
 SEA_PRC_request_aid.1.desc: "Karena kami sering memberikan dukungan kepada [FROM.GetNameDef] di masa lalu, mereka sekali lagi meminta agar kami menyediakan peralatan untuk mereka. Permintaan ini mungkin terkait dengan Long March yang baru saja diselesaikan, yang menyebabkan kerugian besar dalam hal tenaga kerja dan material."
 SEA_PRC_request_aid.1.a: "Kirimkan kepada mereka apa yang bisa kami luangkan"
 SEA_PRC_request_aid.1.b: "Kami tidak dapat menyisihkan apa pun"
 SEA_PRC_request_aid.2.t: "[FROM.GetName] Mengirim Bantuan"
 SEA_PRC_request_aid.2.desc: "[FROM.GetNameDefCap] telah setuju untuk mengirimkan peralatan yang kami minta. Pengiriman besar ini akan memungkinkan kami untuk menurunkan beberapa divisi baru, dan memberi kami peralatan khusus yang memungkinkan pembentukan perusahaan pendukung."
 SEA_PRC_request_aid.2.a: "Luar biasa, kami pasti akan memanfaatkannya dengan baik"
 SEA_PRC_request_aid.3.t: "[FROM.GetName] Menolak Mengirim Bantuan"
 SEA_PRC_request_aid.3.desc: "Permintaan bantuan kami dari [FROM.GetNameDef] ditolak, dan pejabat [FROM.GetAdjective] menyatakan bahwa [FROM.GetNameDef] hanya memiliki sedikit peralatan yang tersisa setelah reorganisasi baru-baru ini."
 SEA_PRC_request_aid.3.a: "Kita harus mencari sumber lain"
 SEA_PRC_request_aid.4.t: "[FROM.GetName] Tank Permintaan"
 SEA_PRC_request_aid.4.desc: "Karena [FROM.GetNameDef] tidak memiliki kapasitas industri dan pengalaman untuk menciptakan kekuatan tempur lapis baja, [FROM.GetLeader] telah mengirimkan permintaan bantuan kami. [FROM.GetNameDefCap] secara khusus meminta tank medium T-34 kami karena memiliki keseimbangan yang sangat baik antara daya tembak, perlindungan, dan mobilitas. Bagaimana seharusnya kita menanggapinya?"
 SEA_PRC_request_aid.4.a: "Kita bisa menyisihkan banyak hal"
 SEA_PRC_request_aid.4.b: "Kita bisa menyisihkan sebagian"
 SEA_PRC_request_aid.4.c: "Setidaknya kita bisa membantu membangunnya"
 SEA_PRC_request_aid.4.e: "Tolak permintaan [FROM.GetNameDef]"
 SEA_PRC_request_aid.4.a.tt: "Kami setuju untuk mengirim §R250 Tank T-34§! ke §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.4.b.tt: "Kami setuju untuk mengirim §R50 Tank T-34§! ke §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.4.c.tt: "Kami setuju untuk memproduksi §R150 Tank T-34§! untuk §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.t: "[FROM.GetName] Tank Permintaan"
 SEA_PRC_request_aid.31.desc: "Karena [FROM.GetNameDef] tidak memiliki kapasitas industri dan pengalaman untuk menciptakan kekuatan tempur lapis baja, [FROM.GetLeader] telah mengirimkan permintaan bantuan kami. [FROM.GetNameDefCap] secara khusus meminta tank ringan BT-7 kami, dengan alasan kecepatan lintas alamnya yang luar biasa. Bagaimana seharusnya kita menanggapinya?"
 SEA_PRC_request_aid.31.a: "Kita bisa menyisihkan banyak hal"
 SEA_PRC_request_aid.31.b: "Kita bisa menyisihkan sebagian"
 SEA_PRC_request_aid.31.c: "Setidaknya kita bisa membantu membangunnya"
 SEA_PRC_request_aid.31.e: "Tolak permintaan [FROM.GetNameDef]"
 SEA_PRC_request_aid.31.a.tt: "Kami setuju untuk mengirim §R350 Tank BT-7§! ke §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.b.tt: "Kami setuju untuk mengirim §R100 Tank BT-7§! ke §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.31.c.tt: "Kami setuju untuk memproduksi §R150 Tank BT-7§! untuk §Y[FROM.GetName]§!"
 SEA_PRC_request_aid.32.t: "[FROM.GetName] Mengirim Tank"
 SEA_PRC_request_aid.32.desc: "Menanggapi permintaan kami akan tank BT-7, [FROM.GetName] telah setuju untuk mengirimkan tank tersebut kepada kami dalam jumlah besar — tidak kurang dari 350 (kebanyakan) BT-7 baru! Jenderal kami telah menyusun rencana cara terbaik untuk mengerahkan mereka, termasuk mengatur jadwal pelatihan untuk awak tank yang baru direkrut."
 SEA_PRC_request_aid.32.a: "Sebuah awal dari sesuatu yang hebat"
 SEA_PRC_request_aid.33.t: "[FROM.GetName] Mengirimkan Beberapa Tank"
 SEA_PRC_request_aid.33.desc: "Menanggapi permintaan kami untuk tank BT-7, [FROM.GetName] telah setuju untuk mengirimkan sejumlah token saja. Tidaklah cukup untuk melengkapi divisi tank secara penuh, tetapi cukup untuk membantu kita memulai. Jika tidak ada pilihan lain, kami dapat menggunakan 100 kendaraan tersebut untuk melatih kru kami, sambil mencari cara lain untuk mendapatkan tank modern."
 SEA_PRC_request_aid.33.a: "Bisa lebih, tapi lebih baik daripada tidak sama sekali"
 SEA_PRC_request_aid.34.t: "[FROM.GetName] Akan Menghasilkan Tank"
 SEA_PRC_request_aid.34.desc: "Menanggapi permintaan kami akan tank BT-7, [FROM.GetName] telah setuju untuk membuat 150 BT-7 dalam beberapa bulan mendatang dan mengirimkannya kepada kami jika sudah siap. Ini akan memakan waktu, namun tindakan ini akan menjadi awal yang baik bagi aspirasi kita untuk mengerahkan kekuatan lapis baja modern."
 SEA_PRC_request_aid.34.a: "Luar biasa! Kami akan memanfaatkannya dengan baik kapan pun mereka tiba"
 SEA_PRC_request_aid.35.t: "Tank Yang Baru Dibangun Dari [FROM.FROM.GetName] Telah Tiba"
 SEA_PRC_request_aid.35.desc: "Pengiriman telah tiba di [ROOT.Capital.GetName] dari [SOV.GetNameDef] yang memuat 150 tank BT-7 kami yang baru dibuat. Di antara mereka yang menerima kiriman tersebut adalah perwakilan dari pemerintah [ROOT.GetName], serta para perwira tinggi Angkatan Darat Tentara Pembebasan Rakyat. Saat memeriksa tank-tank tersebut, yang baru dicat dengan simbol PLAGF, para petugas sangat bersemangat untuk mengerahkannya — setelah masa pelatihan dan sosialisasi bagi awak tank."
 SEA_PRC_request_aid.35.a: "Ini adalah berita bagus, kami akan memanfaatkannya dengan baik!"
 SEA_PRC_request_aid.5.t: "[FROM.GetName] Mengirim Tank"
 SEA_PRC_request_aid.5.desc: "Menanggapi permintaan kami akan tank T-34, [FROM.GetName] telah setuju untuk mengirimkan tank tersebut kepada kami dalam jumlah besar — tidak kurang dari 250 (kebanyakan) T-34 baru! Jenderal kita telah menyusun rencana tentang cara terbaik mengerahkan tank-tank ini, termasuk mengatur jadwal pelatihan untuk awak tank yang baru diangkat kembali."
 SEA_PRC_request_aid.5.a: "Sebuah awal dari sesuatu yang hebat"
 SEA_PRC_request_aid.6.t: "[FROM.GetName] Mengirimkan Beberapa Tank"
 SEA_PRC_request_aid.6.desc: "Menanggapi permintaan kami untuk tank T-34, [FROM.GetName] telah setuju untuk mengirimkan sejumlah token saja kepada kami. Tidaklah cukup untuk melengkapi divisi tank secara penuh, tetapi cukup untuk membantu kita memulai. Jika tidak ada pilihan lain, kami dapat menggunakan 50 kendaraan tersebut untuk melatih awak tank kami, sambil mencari cara lain untuk mendapatkan tank modern."
 SEA_PRC_request_aid.6.a: "Bisa lebih, tapi lebih baik daripada tidak sama sekali"
 SEA_PRC_request_aid.7.t: "[FROM.GetName] Akan Menghasilkan Tank"
 SEA_PRC_request_aid.7.desc: "Menanggapi permintaan kami akan tank T-34, [FROM.GetName] telah setuju untuk membuat 150 T-34 dalam beberapa bulan mendatang dan mengirimkannya kepada kami jika sudah siap. Ini akan memakan waktu, namun tindakan ini akan menjadi awal yang baik bagi aspirasi kita untuk mengerahkan kekuatan lapis baja modern"
 SEA_PRC_request_aid.7.a: "Luar biasa! Kami akan memanfaatkannya dengan baik kapan pun mereka tiba"
 SEA_PRC_request_aid.8.t: "[FROM.GetName] Menolak Permintaan Tank Kami"
 SEA_PRC_request_aid.8.desc: "[FROM.GetName] telah menolak permintaan kami untuk tank, dengan alasan bahwa kebutuhan mendesak mereka menghalangi mereka untuk menyisihkan kendaraan aktif atau cadangan. Meskipun disayangkan, [FROM.GetName] mengirimkan beberapa manual pelatihan kepada kami. Jadi, selalu ada itu."
 SEA_PRC_request_aid.8.a: "Sayang sekali!"
 SEA_PRC_request_aid.21.t: "Tank Yang Baru Dibangun Dari [FROM.FROM.GetName] Telah Tiba"
 SEA_PRC_request_aid.21.desc: "Pengiriman telah tiba di [ROOT.Capital.GetName] dari [SOV.GetNameDef] yang memuat 150 tank T-34 kami yang baru dibuat. Di antara mereka yang menerima kiriman tersebut adalah perwakilan dari pemerintah [ROOT.GetName] serta para perwira tinggi Angkatan Darat Tentara Pembebasan Rakyat. Saat memeriksa tank-tank tersebut, yang dicat dengan simbol PLAGF, para petugas sangat bersemangat untuk mengerahkannya — setelah masa pelatihan dan sosialisasi bagi awak tank."
 SEA_PRC_request_aid.21.a: "Ini adalah berita bagus, kami akan memanfaatkannya dengan baik!"
 SEA_PRC_request_aid.9.t: "[FROM.GetName] Ingin Menandatangani Perjanjian Kerjasama Teknologi"
 SEA_PRC_request_aid.9.desc: "Kami telah menerima telegram dari [FROM.GetLeader], yang meminta Perjanjian Kerjasama Teknologi. Perjanjian ini akan memajukan 'cara yang bersahabat untuk menyebarkan cara-cara revolusi, melalui pengetahuan dan kemajuan umat manusia'"
 SEA_PRC_request_aid.9.a: "Setuju untuk membantu dalam upaya ini"
 SEA_PRC_request_aid.9.b: "Kami tidak punya waktu untuk ini"
 SEA_PRC_request_aid.10.t: "[FROM.GetName] Mengumumkan Penandatanganan Perjanjian Kerja Sama Teknologi"
 SEA_PRC_request_aid.10.desc: "[FROM.GetNameDefCap] telah setuju untuk menandatangani Perjanjian Kerja Sama Teknologi, yang akan sangat meningkatkan kapasitas kita untuk membangun bangsa."
 SEA_PRC_request_aid.10.a: "Luar biasa!"
 SEA_PRC_request_aid.11.t: "[FROM.GetName] Menolak Perjanjian Kerjasama Teknologi"
 SEA_PRC_request_aid.11.desc: "[FROM.GetNameDefCap] menolak menandatangani Perjanjian Kerja Sama Teknologi, dengan alasan perlunya memprioritaskan kebutuhan dalam negeri. Meskipun bersimpati pada tujuan kami, mereka tidak dapat menyisihkan sumber daya apa pun untuk upaya ini."
 SEA_PRC_request_aid.11.a: "Sayang sekali!"
 SEA_PRC_faction_events.1.t: "[FROM.GetNameDefCap] Permintaan [1032.GetName]"
 SEA_PRC_faction_events.1.desc: "[FROM.GetLeader] telah mengirim utusan ke [ROOT.GetLeader] untuk mengukur minat kami dalam membagi wilayah [XIC.GetName] di antara kami."
 SEA_PRC_faction_events.1.a: "Kesepakatan ini lebih menguntungkan kami"
 SEA_PRC_faction_events.1.b: "Tidak mungkin!"
 SEA_PRC_faction_events.2.t: "Invasi yang Akan Datang"
 SEA_PRC_faction_events.2.desc: "Tampaknya [FROM.GetLeader] dari [FROM.GetName] dan [PRC.GetLeader] dari [PRC.GetNameDef] telah bersatu untuk membagi wilayah kita di antara mereka sendiri, seperti ular. Pasukan mereka siap melintasi perbatasan kita kapan saja, kalau tidak kita menggagalkan upaya pengecut mereka. Pertanyaannya apakah kita bisa menahan keduanya dalam waktu lama?"
 SEA_PRC_faction_events.2.a: "Tidak ada gunanya menolak...."
 SEA_PRC_faction_events.2.b: "Mari kita lihat mereka mencobanya!"
 SEA_PRC_faction_events.3.t: "[FROM.GetLeader] Menolak Penawaran Kami"
 SEA_PRC_faction_events.3.desc: "Tampaknya [FROM.GetLeader] dari [FROM.GetName] sama bodohnya dengan kedatangan mereka, karena telah menolak utusan kita dengan tangan kosong. Tawaran murah hati kami untuk memisahkan tetangga yang lebih lemah di antara kami berdua tidak didengarkan."
 SEA_PRC_faction_events.3.a: "Ini hanyalah kemunduran sementara!"
 SEA_PRC_faction_events.4.t: "[FROM.GetNameDefCap] Menyerah pada Permintaan Kami"
 SEA_PRC_faction_events.4.desc: "Ancaman gabungan dari [CHI.GetNameDef] dan [PRC.GetNameDef] tampaknya terlalu berat bagi [FROM.GetLeader], yang telah menuruti tuntutan kami dan setuju untuk membiarkan pasukan kami bergerak ke [FROM.GetNameDef] tanpa perlawanan. Tampaknya mungkin akan berhasil...."
 SEA_PRC_faction_events.4.a: "Segalanya membaik!"
 SEA_PRC_faction_events.5.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
 SEA_PRC_faction_events.5.desc: "Tampaknya [FROM.GetLeader] dari [FROM.GetName] terbuat dari bahan yang lebih kuat dari yang dibayangkan sebelumnya, karena tidak menyerah pada ancaman gabungan dari pasukan [CHI.GetNameDef] dan [PRC.GetNameDef]. Pembangkangan ini mengagumkan sekaligus bodoh. Angkatan bersenjata [FROM.GetNameDef] akan segera berpencar di hadapan kekuatan kita!"
 SEA_PRC_faction_events.5.a: "Mereka akan menyesali hal ini"
 SEA_PRC_faction_events.10.t: "[FROM.GetNameDefCap] Menawarkan Aliansi"
 SEA_PRC_faction_events.10.desc: "Sebuah pesan dari [FROM.GetLeader] telah sampai kepada kami melalui beberapa saluran belakang, dan sepertinya isolasi di desa-desa pegunungan telah menyebabkan perubahan hati pada pemimpin [FROM.GetNameDef]. Dia sekarang meminta bantuan kita untuk menyatukan Tiongkok dan melindungi rakyatnya dari ancaman eksternal. Ini tawaran yang menarik, tapi apakah Komunis bisa dipercaya?"
 SEA_PRC_faction_events.10.a: "Masalah Tiongkok lebih besar dari perseteruan kita"
 SEA_PRC_faction_events.10.b: "Kami tidak akan pernah tunduk pada kepemimpinan mereka!"
 SEA_PRC_faction_events.11.t: "Si Bodoh [FROM.GetLeader] Menolak Tawaran Kami"
 SEA_PRC_faction_events.11.desc: "Pemimpin [FROM.GetNameDef] sekali lagi menunjukkan kepada dunia betapa bodohnya [FROM.GetLeader.GetSheHe], dengan menolak tawaran kami untuk menciptakan front persatuan untuk melindungi dan menyatukan Tiongkok. Ini berarti bahwa tugas untuk melindungi rakyat kita sepenuhnya berada di tangan kita. Kami akan membuktikan kepada dunia bahwa kami lebih dari siap untuk tugas ini!"
 SEA_PRC_faction_events.11.a: "Kami akan melindungi seluruh Tiongkok"
 SEA_PRC_faction_events.20.t: "[FROM.GetLeader] Pertanyaan [?PRC_faction_leader_var.GetName]"
 SEA_PRC_faction_events.20.desc: "[FROM.GetLeader] secara terbuka mempertanyakan upaya perang dan kepemimpinan [?PRC_faction_leader_var.GetLeader] dalam pertemuan puncak baru-baru ini dengan anggota [ROOT.GetFactionName]. Ia mengkritik cara perang dikelola dan cara pelaksanaannya, serta menuduh [?PRC_faction_leader_var.GetName] sengaja menunda konflik. Ini mungkin permainan dari [FROM.GetLeader] untuk mendapatkan lebih banyak pengaruh dalam aliansi, tapi mungkin tuduhannya ada benarnya?"
 SEA_PRC_faction_events.20.a: "Pria itu mengatakan yang sebenarnya!"
 SEA_PRC_faction_events.20.b: "Tidak masuk akal!"
 SEA_PRC_faction_events.21.t: "[FROM.GetNameDefCap] Menawarkan Dukungan Mereka kepada Kami"
 SEA_PRC_faction_events.21.desc: "Tampaknya pidato baru-baru ini yang dibuat oleh [ROOT.GetLeader] di mana ia mengkritik kepemimpinan [?PRC_faction_leader_var.GetNameDef] atas [ROOT.GetFactionName], telah menyentuh hati [FROM.GetLeader] [FROM.GetName]. [FROM.GetLeader] telah memastikan bahwa kami mendapat dukungan dari [FROM.GetName]."
 SEA_PRC_faction_events.21.a: "Sebuah tanda yang jelas dari kebijaksanaan"
 SEA_PRC_faction_events.22.t: "[FROM.GetLeader] Memarahi [ROOT.GetLeader]"
 SEA_PRC_faction_events.22.desc: "Dalam pidatonya baru-baru ini oleh [ROOT.GetLeader], dia mengkritik kepemimpinan [?PRC_faction_leader_var.GetName] atas [ROOT.GetFactionName], yang tidak diterima dengan baik oleh semua orang yang menghadiri pertemuan puncak faksi. [FROM.GetLeader] dari [FROM.GetName] telah secara terbuka menghukum [ROOT.GetLeader] karena mencoba melemahkan [ROOT.GetFactionName] dan membuat anggotanya saling bermusuhan."
 SEA_PRC_faction_events.22.a: "Orang bodoh yang buta tetaplah bodoh"
 SEA_PRC_faction_events.30.t: "[FROM.GetNameDefCap] Menuntut Redistribusi Tanah"
 SEA_PRC_faction_events.30.desc: "Tampaknya [FROM.GetNameDef] telah berhasil menyusup ke wilayah kami dan mengamankan loyalitas banyak warga kami. Mereka kini menuntut agar wilayah tersebut diserahkan secara resmi kepada [FROM.GetNameDef]. Apa yang akan terjadi jika kami menolak masih belum disebutkan, namun hal ini mungkin akan menghasilkan respons yang kuat."
 SEA_PRC_faction_events.30.a: "Sebenarnya kita tidak punya banyak pilihan..."
 SEA_PRC_faction_events.30.b: "Tidak masuk akal!"
 SEA_PRC_faction_events.31.t: "[FROM.GetNameDefCap] Menerima Permintaan Kami"
 SEA_PRC_faction_events.31.desc: "[FROM.GetNameDefCap] telah menerima 'permintaan' kami untuk menyerahkan negara bagian yang berhasil kami infiltrasi, sehingga meningkatkan kepemilikan formal kami. [FROM.GetNameDefCap] tidak senang dengan hal itu, namun tidak berani menentang kami. Wilayah ini sekarang secara resmi akan diatur oleh [ROOT.GetNameDef]."
 SEA_PRC_faction_events.31.a: "Sebuah langkah yang bijaksana"
 SEA_PRC_faction_events.32.t: "[FROM.GetNameDefCap] Menolak untuk Mematuhi"
 SEA_PRC_faction_events.32.desc: "[FROM.GetNameDefCap] telah menolak permintaan kami untuk menyerahkan wilayah yang berhasil kami infiltrasi."
 SEA_PRC_faction_events.32.a: "Salah langkah mengundang tebing..."
 SEA_PRC_faction_events.32.b: "Kami tidak akan menoleransi sekutu yang pengkhianat!\n§R[FROM.GetName] mungkin ingin bergabung dengan faksi lain§!"
 SEA_PRC_faction_events.40.t: "Jalan ke Depan - Nasib Tiongkok"
 SEA_PRC_faction_events.40.desc: "Kita berada di persimpangan jalan di mana kita harus memutuskan bagaimana kita ingin mendekati negara-negara Tiongkok lainnya. [ROOT.GetLeader] telah merenungkan hal ini selama beberapa malam tanpa tidur, dan tampak jelas bahwa hanya ada satu jalan ke depan untuk menyatukan seluruh Tiongkok..."
 SEA_PRC_faction_events.40.a: "Keputusan yang tidak diambil tetaplah keputusan yang diambil"
 SEA_PRC_faction_events.40.b: "Kami akan menempa jalan kami sendiri ke depan"
 SEA_PRC_faction_events.40.c: "Kesetiaan lama hanya akan menghambat kita"
 SEA_PRC_faction_events.40.d: "Hanya ada satu, Tiongkok sejati!"
 SEA_PRC_faction_events.40.e: "Kami berdiri lebih kuat ketika bersatu"
 SEA_PRC_faction_events.41.t: "[FROM.GetNameDefCap] Keluar dari [ROOT.GetFactionName]"
 SEA_PRC_faction_events.41.desc: "Tampaknya [FROM.GetLeader] telah memutuskan bahwa [FROM.GetNameDef] lebih baik tanpa kekuatan dan keamanan yang ditawarkan [ROOT.GetFactionName]. Kita hanya bisa membayangkan bagaimana mereka bisa bertahan tanpa kita!"
 SEA_PRC_faction_events.41.a: "Siapa yang pergi lagi?"
 SEA_PRC_faction_events.42.t: "[ROOT.GetNameDefCap] Dikeluarkan Dari [FROM.GetFactionName]"
 SEA_PRC_faction_events.42.desc: "Tampaknya [FROM.GetLeader] telah memutuskan bahwa [FROM.GetNameDef] dan [FROM.GetFactionName] akan lebih baik tanpa kita dalam aliansi. Kegilaan apa yang mendorong [FROM.GetLeader] untuk membuat keputusan yang tidak masuk akal seperti itu tidak diketahui, namun ada satu hal yang pasti; hal ini membuat kita semakin rentan. Kita hanya bisa membayangkan apa yang [FROM.GetNameDef] lakukan, tapi pastinya itu bukan hal yang baik."
 SEA_PRC_faction_events.42.a: "Kami akan mengelolanya tanpa mereka"
 SEA_PRC_faction_events.50.t: "[FROM.GetNameDefCap] Menawarkan Aliansi"
 SEA_PRC_faction_events.50.desc: "[FROM.GetLeader] telah mengirimkan delegasi kepada kami, mencoba membujuk kami untuk bergabung dengan faksi mereka. Mereka mengatakan bahwa kita berada di persimpangan jalan, di mana masa depan Tiongkok berada dalam bahaya. Menurut delegasi [FROM.GetName], hanya ada satu jalan ke depan untuk menyatukan seluruh Tiongkok — yaitu bersama-sama. Pasti ada yang bertanya-tanya apa motif tersembunyi yang [FROM.GetLeader] ada dalam pikiran [FROM.GetLeader.GetHerHis], dan apakah [FROM.GetLeader.GetSheHe] dapat dipercaya..."
 SEA_PRC_faction_events.50.a: "Tidak, [FROM.GetLeader] tidak bisa dipercaya!"
 SEA_PRC_faction_events.50.b: "Jalan kita ke depan terletak bersama"
 SEA_PRC_faction_events.51.t: "[FROM.GetNameDefCap] Menolak Penawaran Kami"
 SEA_PRC_faction_events.51.desc: "Delegasi kami ke [FROM.GetLeader] telah pulang dengan tangan kosong, kecuali membawa berita buruk. Tawaran murah hati kami untuk mengundang [FROM.GetNameDef] ke dalam faksi kami tampaknya ditanggapi dengan ketidakpercayaan dan penghinaan yang tidak disembunyikan. Tampaknya [FROM.GetLeader] telah memutuskan bahwa [FROM.GetNameDef] lebih baik tanpa kekuatan dan keamanan yang ditawarkan [ROOT.GetFactionName]. Kita hanya bisa membayangkan bagaimana mereka bisa bertahan tanpa kita!"
 SEA_PRC_faction_events.51.a: "Mengejar bayangan berarti kehilangan sinar matahari"
 SEA_PRC_faction_events.52.t: "[FROM.GetNameDefCap] Keluar dari [ROOT.GetFactionName]"
 SEA_PRC_faction_events.52.desc: "Kami baru saja menerima kabar dari [FROM.GetLeader] bahwa [FROM.GetNameDef] telah memutuskan untuk menarik diri dari [ROOT.GetFactionName] dan bergabung dengan [PRC.GetNameDef]. Kegilaan apa yang mendorong [FROM.GetLeader] untuk membuat keputusan yang tidak masuk akal seperti itu masih belum diketahui, namun jika mereka ingin mengundang kesulitan dan kehancuran, siapakah kita yang akan menghalangi mereka?"
 SEA_PRC_faction_events.52.a: "Hari-hari kelam pasti menanti mereka"
 SEA_PRC_faction_events.53.t: "[FROM.GetNameDefCap] Bergabung dengan [ROOT.GetFactionName]"
 SEA_PRC_faction_events.53.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali ke negaranya dengan membawa kabar baik. Ternyata [FROM.GetLeader] adalah penguasa yang jauh lebih bijaksana daripada yang pertama kali kami berikan kepada [FROM.GetLeader.GetHerHim], dengan menandatangani proposal aliansi kami. Meskipun tidak sepenuhnya terduga, kita harus selalu mengharapkan hujan dan menjadi lebih bahagia saat matahari bersinar. Hal ini akan sangat memperkuat negara kita dan [ROOT.GetFactionName]."
 SEA_PRC_faction_events.53.a: "Ini adalah hari yang menyenangkan bagi seluruh Tiongkok!"
 SEA_PRC_faction_events.60.t: "$generic.2.t$"
 SEA_PRC_faction_events.60.a: "Kami akan menerima [FROM.GetName] hingga [ROOT.GetFactionName]"
 SEA_PRC_faction_events.60.b: "Kita lebih baik tanpa mereka"
 SEA_PRC_faction_events.70.desc: "[FROM.GetLeader] telah mengirimkan delegasi kepada kami, mencoba membujuk kami untuk bergabung dengan faksi mereka. Mereka mengatakan bahwa kita berada di persimpangan jalan, dimana masa depan Asia berada dalam bahaya. Menurut delegasi [FROM.GetName], hanya ada satu jalan ke depan untuk mengamankan kemerdekaan kita dari penjajah Barat — yaitu bersama-sama."
 SEA_PRC_faction_events.71.t: "[FROM.GetNameDefCap] Ingin Hak Asuh atas Subjek Asia Kami"
 SEA_PRC_faction_events.71.desc: "Dalam surat dari [FROM.GetNameDef], [FROM.GetLeader] meminta kami untuk melepaskan warga Asia kami ke tahanan mereka di [FROM.GetFactionName] yang baru dibentuk."
 SEA_PRC_faction_events.71.a: "Baiklah, ini saatnya untuk masa depan yang lebih baik"
 SEA_PRC_faction_events.71.b: "Tidak pernah, itu milik kita"
 SEA_PRC_faction_events.72.t: "[FROM.GetNameDefCap] Dengan Syarat Menawarkan Kebebasan Kita"
 SEA_PRC_faction_events.72.desc: "[FROM.GetNameDefCap] telah menawarkan untuk membebaskan kami — dengan satu syarat: Kemerdekaan kami hanya akan diberikan jika kami bergabung dengan [FROM.FROM.GetNameDef] yang baru dibentuk [PRC.GetFactionName]."
 SEA_PRC_faction_events.72.a: "Kami akan menerima tawaran dan ketentuan keduanya"
 SEA_PRC_faction_events.72.b: "Tidak, situasi kita saat ini cukup menyenangkan"
 SEA_PRC_faction_events.73.t: "[FROM.FROM.GetNameDefCap] Setuju — [FROM.GetNameDef] Bergabung dengan [PRC.GetFactionName]"
 SEA_PRC_faction_events.73.desc: "[FROM.FROM.GetNameDefCap] telah setuju untuk melepaskan [FROM.GetNameDef] dengan syarat mereka bergabung dengan faksi baru kami, dan [FROM.GetNameDef] telah menyetujuinya. Upacara penyambutan rencananya akan diadakan di [ROOT.Capital.GetName]"
 SEA_PRC_faction_events.73.a: "Ini adalah fajar baru"
 SEA_PRC_faction_events.74.t: "[FROM.GetNameDefCap] Menolak Bergabung dengan [PRC.GetFactionName]"
 SEA_PRC_faction_events.74.desc: "Meskipun ada tawaran, [FROM.GetLeader] telah mengumumkan bahwa [FROM.GetNameDef] menolak tawaran [PRC.GetNameDef] untuk bergabung dengan [PRC.GetFactionName] yang baru dibentuk, dengan menyatakan bahwa preferensi [FROM.GetAdjective] orang adalah status quo."
 SEA_PRC_faction_events.74.a: "Mereka telah membuat keputusan"
## New Fourth Army Incident
 SEA_PRC_fourth_army_incident.1.t: "Kerusuhan di Kalangan Sekutu"
 SEA_PRC_fourth_army_incident.1.desc: "Komandan kami telah melaporkan bahwa aliansi kami dengan [PRC.GetNameDef] telah menimbulkan perselisihan. Komandan yang mewakili [PRC.GetNameDef] dilaporkan ragu-ragu untuk mengikuti perintah kami dan terkadang langsung tidak mematuhinya, sehingga mengancam akan menimbulkan masalah bagi unit kami sendiri."
 SEA_PRC_fourth_army_incident.1.a: "[PRC.GetNameDefCap] harus mengontrol pasukannya dengan lebih baik"
 SEA_PRC_fourth_army_incident.1.b: "Keraguan mereka adalah hal yang wajar"
 SEA_PRC_fourth_army_incident.2.t: "[FROM.GetNameDefCap] Berusaha Meredakan Ketegangan"
 SEA_PRC_fourth_army_incident.2.desc: "Setelah beberapa insiden antara komandan kami dan komandan [FROM.GetNameDef], pemerintah mereka telah mengirimi kami pesan yang berupaya meredakan ketegangan. Mereka secara resmi telah menegaskan bahwa kami dapat mempertahankan komando pasukan kami sendiri, dan berupaya menjalin kerja sama bilateral dengan mengoordinasikan rencana kami."
 SEA_PRC_fourth_army_incident.2.a: "Syukurlah kita bisa fokus pada ancaman nyata"
 SEA_PRC_fourth_army_incident.3.t: "[FROM.GetNameDefCap] Keluhan Tentang Kurangnya Koordinasi"
 SEA_PRC_fourth_army_incident.3.desc: "Pemerintah [FROM.GetNameDef] telah mengirimkan keluhan kepada kami tentang kurangnya koordinasi antar komandan kami di lapangan. Mereka mengutip laporan dari komandan mereka yang menyatakan bahwa petugas kami tidak mau mengikuti perintah dari komando [FROM.GetName], sehingga membuat mereka semua berada dalam posisi rentan yang tidak perlu. Secara khusus, [FROM.GetNameDef] ingin kita memastikan bahwa kita akan mengambil bagian dalam kemunduran taktis yang sedang berlangsung, dan tidak mengkompromikannya dengan pertikaian."
 SEA_PRC_fourth_army_incident.3.a: "Komandan kita yang menentukan tindakan pasukan kita, bukan tindakan mereka"
 SEA_PRC_fourth_army_incident.3.b: "Mungkin mereka ada benarnya"
 SEA_PRC_fourth_army_incident.4.t: "[FROM.GetNameDefCap] Perintah Teguran"
 SEA_PRC_fourth_army_incident.4.desc: "Setelah keluhan kami tentang pembangkangan perintah [FROM.GetNameDef], pemerintah mereka berhasil memaksa mereka untuk mundur dan bekerja sama dengan rencana strategis kami."
 SEA_PRC_fourth_army_incident.4.a: "Sangat bagus"
 SEA_PRC_fourth_army_incident.5.t: "Tentara Keempat Baru Diserang Pasukan Nasionalis"
 SEA_PRC_fourth_army_incident.5.desc: "Kami telah menerima laporan bahwa Tentara Keempat Baru mengalami kehancuran total setelah dikepung oleh pasukan nasionalis, ketika melakukan retret yang tidak ingin diikuti oleh komando kami. Penjelasan mengenai bagaimana pertempuran dimulai tidak jelas, namun apa yang awalnya merupakan insiden tembak-menembak segera berubah menjadi pertumpahan darah ketika kedua belah pihak curiga bahwa mereka diserang dengan sengaja."
 SEA_PRC_fourth_army_incident.5.a: "Minta tindakan oleh [CHI.GetLeader]"
 SEA_PRC_fourth_army_incident.5.b: "Kami tidak bisa lagi mempercayai aliansi ini"
 SEA_PRC_fourth_army_incident.6.t: "[FROM.GetName] Keluar dari [ROOT.GetFactionName] Setelah Insiden Kebakaran Ramah"
 SEA_PRC_fourth_army_incident.6.desc: "Setelah insiden baru-baru ini ketika pasukan dari [ROOT.GetName] melawan pasukan [FROM.GetName], pasukan tersebut telah meninggalkan [ROOT.GetFactionName]. Insiden tersebut, yang menyebabkan Tentara Keempat Baru [FROM.GetNameDef] memakan banyak korban, terjadi setelah perselisihan mengenai perintah untuk mundur, sehingga menyebabkan pihak yang tidak diketahui melepaskan tembakan ketika pasukan kami yang mundur bertemu dengan tentara [FROM.GetName]."
 SEA_PRC_fourth_army_incident.6.a: "Hal ini merupakan pengalihan perhatian yang tidak perlu dari permasalahan yang sedang dihadapi"
 SEA_PRC_fourth_army_incident.7.t: "[FROM.GetName] Menuntut Tindakan Setelah Insiden Kebakaran Ramah Lingkungan"
 SEA_PRC_fourth_army_incident.7.desc: "Setelah insiden baru-baru ini ketika pasukan dari [ROOT.GetName] melawan pasukan [FROM.GetName], pasukan  menuntut agar kami mengakui peran kami dalam menyebabkan insiden ini, dan memberikan jaminan bahwa komandan kami akan lebih berhati-hati. Insiden tersebut, yang menyebabkan Tentara Keempat Baru <span Translate=\"no\">[FROM.GetNameDef] memakan banyak korban, terjadi setelah perselisihan mengenai perintah untuk mundur, sehingga menyebabkan pihak yang tidak diketahui melepaskan tembakan ketika pasukan kami yang mundur bertemu dengan tentara [FROM.GetName]."
 SEA_PRC_fourth_army_incident.7.a: "Hal ini hanya dapat disalahkan atas pembangkangan mereka"
 SEA_PRC_fourth_army_incident.7.b: "Kita harus berusaha untuk tetap bersahabat dengan [FROM.GetNameDef]"
 SEA_PRC_fourth_army_incident.8.t: "[FROM.GetName] Menolak untuk Meminta Maaf"
 SEA_PRC_fourth_army_incident.8.desc: "Menanggapi permintaan kami untuk mengambil tindakan setelah insiden Angkatan Darat Keempat Baru, [FROM.GetNameDef] tidak mau mengakui kesalahan apa pun. Ini jelas merupakan tanda ketidakpercayaan, atau bahkan permusuhan terselubung terhadap negara dan pasukan yang mendukung upaya perang mereka."
 SEA_PRC_fourth_army_incident.8.a: "Kita tidak bisa membiarkan konflik terjadi saat ini"
 #no b option here, reuses 5.b
 SEA_PRC_fourth_army_incident.8.c: "Hal ini memerlukan jawaban yang segera"
 SEA_PRC_fourth_army_incident.9.t: "[FROM.GetName] Mundur"
 SEA_PRC_fourth_army_incident.9.desc: "Meskipun kami tidak meminta maaf, [FROM.GetNameDef] telah menunjukkan keengganan untuk meningkatkan konflik akibat Insiden Angkatan Darat Keempat Baru, meskipun mereka pasti akan mengingat insiden tersebut."
 SEA_PRC_fourth_army_incident.9.a: "Seperti yang diharapkan"
 SEA_PRC_fourth_army_incident.10.t: "[FROM.GetName] Memulai kembali Perang Saudara"
 SEA_PRC_fourth_army_incident.10.desc: "Setelah insiden Angkatan Darat Keempat Baru, [FROM.GetNameDef] menganggap tindakan kami sebagai tindakan agresi, dan memulai kembali perang saudara. Pasukan yang baru saja bertahan berdampingan saling bertarung di depan, dan situasi di belakang garis depan tidak jauh lebih baik."
 SEA_PRC_fourth_army_incident.10.a: "Kami selalu tahu ini pada akhirnya akan terjadi"
 SEA_PRC_fourth_army_incident.11.t: "[FROM.GetLeader] Meminta Maaf atas Insiden Kebakaran Persahabatan"
 SEA_PRC_fourth_army_incident.11.desc: "Sebagai tanggapan atas permintaan tindakan kami kepada [FROM.GetLeader] setelah insiden Angkatan Darat Keempat Baru, [FROM.GetLeader] telah menulis surat permintaan maaf resmi kepada pimpinan kami. Dia berjanji akan mencoba menginstruksikan komandannya untuk bertindak berbeda dalam menghadapi perbedaan pendapat mengenai perintah."
 SEA_PRC_fourth_army_incident.11.a: "Ini akan berhasil"
 #no b option here, reuses 65.b
 SEA_PRC_fourth_army_incident.12.t: "[FROM.GetName] Menerima Permintaan Maaf"
 SEA_PRC_fourth_army_incident.12.desc: "Menanggapi surat permintaan maaf kepada pimpinan mereka, [FROM.GetNameDef] dengan enggan menganggapnya sebagai penyelesaian yang cukup terhadap Insiden Angkatan Darat Keempat Baru."
 SEA_PRC_fourth_army_incident.12.a: "Sekarang kita berdua bisa fokus pada hal-hal yang lebih mendesak"
 SEA_PRC_faction_events.80.t: "[FROM.GetName] Menuntut Penaklukan Kita"
 SEA_PRC_faction_events.80.desc: "Sebuah pesan telah tiba dari [FROM.capital.GetName], dengan stempel [FROM.GetLeader] yang jelas. Di balik bahasa persatuan dan takdir nasional yang indah, terdapat sebuah tuntutan — kita harus tunduk dan menerima otoritas [FROM.GetNameDef] atas domain kita. Tidak ada ruang untuk negosiasi, hanya kepatuhan atau konsekuensi."
 SEA_PRC_faction_events.80.a: "Biarkan mereka datang dan mencoba"
 SEA_PRC_faction_events.80.b: "Kami tidak punya pilihan selain menurut"
 SEA_PRC_faction_events.81.t: "[FROM.GetName] Menolak Tawaran Murah Hati Kami"
 SEA_PRC_faction_events.81.desc: "Ultimatum tersebut ditolak. Dalam tindakan pembangkangan yang kurang ajar, [FROM.GetLeader] telah menegaskan bahwa rakyatnya tidak akan menyerah. Jika utusan kita dibubarkan, diplomasi akan membuka jalan bagi perang."
 SEA_PRC_faction_events.81.a: "Kemudian mereka akan ditundukkan"
 SEA_PRC_faction_events.82.t: "[FROM.GetName] Menundukkan Kepala"
 SEA_PRC_faction_events.82.desc: "[FROM.GetName] telah menerima ultimatum kami. Para pemimpin mereka berbicara tentang persatuan nasional dan takdir sejarah, namun maknanya jelas — mereka kini mengakui supremasi [ROOT.GetNameDef].\nMeskipun pengajuan mereka mungkin enggan, hal ini akan menghindarkan Tiongkok dari perpecahan dan pertumpahan darah lebih lanjut."
 SEA_PRC_faction_events.82.a: "Matahari yang hancur mengumpulkan cahayanya"
 SEA_PRC_faction_events.90.t: "[FROM.GetNameDefCap] Meminta Bergabung [ROOT.GetFactionName]"
 SEA_PRC_faction_events.90.desc: "Mengingat agresi yang saat ini dihadapi oleh kami berdua, [FROM.GetNameDef] berupaya untuk bergabung dengan tujuan kami. Itu berarti menerima mereka dan semua anggota faksi [FROM.GetFactionName]."
 SEA_PRC_faction_events.90.a: "Ya, kita harus bersatu melawan musuh yang sama"
 SEA_PRC_faction_events.90.b: "Tidak, kita tidak bisa mempercayai mereka"
 SEA_PRC_faction_events.91.t: "[FROM.GetNameDefCap] Menolak Kami"
 SEA_PRC_faction_events.91.desc: "[FROM.GetNameDefCap] telah menolak proposal kami untuk bergabung dengan faksi mereka melawan musuh bersama. Pernyataan mereka menekankan bahwa meskipun kita akan menjadi lebih kuat bersama-sama, [ROOT.GetNameDef] tidak dapat dipercaya."
 SEA_PRC_faction_events.91.a: "Sayang sekali!"
 SEA_PRC_border_war_events.1.t: "[PRC.GetNameDefCap] Menaklukkan [1045.GetName]"
 SEA_PRC_border_war_events.1.desc: "Setelah pertempuran perbatasan di sepanjang perbatasan [1045.GetName], [PRC.GetNameDef] berhasil menembus garis pertahanan dan mendorong musuhnya keluar. [PRC.GetNameDefCap] sekarang mengklaim negara bagian itu sebagai miliknya."
 SEA_PRC_border_war_events.1.a: "Kekuatan Kami Tumbuh!"
 SEA_PRC_border_war_events.1.b: "Kita harus menarik diri..."
 SEA_PRC_border_war_events.2.t: "[PRC.GetNameDefCap] menarik diri dari [1045.GetName]"
 SEA_PRC_border_war_events.2.desc: "Setelah pertempuran kecil di perbatasan di sepanjang perbatasan [1045.GetName], [PRC.GetNameDef] gagal menembus garis pertahanan dan mendorong musuh keluar. Namun [PRC.GetNameDefCap] berhasil menangkap beberapa artileri."
 SEA_PRC_border_war_events.2.a: "Kemunduran Sementara..."
 SEA_PRC_border_war_events.2.b: "Kami telah mengusir penjajah!"
 SEA_PRC_border_war_events.3.t: "[PRC.GetNameDefCap] Menaklukkan [615.GetName]"
 SEA_PRC_border_war_events.3.desc: "Setelah pertempuran perbatasan di sepanjang perbatasan [615.GetName], [PRC.GetNameDef] berhasil menembus garis pertahanan dan mendorong musuh keluar. [PRC.GetNameDefCap] sekarang mengklaim negara bagian itu sebagai miliknya."
 SEA_PRC_border_war_events.4.t: "[PRC.GetNameDefCap] menarik diri dari [615.GetName]"
 SEA_PRC_border_war_events.4.desc: "Setelah pertempuran kecil di perbatasan di sepanjang perbatasan [615.GetName], [PRC.GetNameDef] gagal menembus garis pertahanan dan mendorong musuh keluar. Namun [PRC.GetNameDefCap] berhasil menangkap beberapa artileri."
 SEA_PRC_border_war_events.5.t: "[PRC.GetNameDefCap] Menaklukkan [1032.GetName]"
 SEA_PRC_border_war_events.5.desc: "Setelah pertempuran kecil di perbatasan di sepanjang perbatasan [1032.GetName], [PRC.GetNameDef] berhasil menembus garis pertahanan dan mendorong musuhnya keluar. [PRC.GetNameDefCap] sekarang mengklaim negara bagian itu sebagai miliknya."
 SEA_PRC_border_war_events.6.t: "[PRC.GetNameDefCap] menarik diri dari [1032.GetName]"
 SEA_PRC_border_war_events.6.desc: "Setelah pertempuran kecil di perbatasan di sepanjang perbatasan [1032.GetName], [PRC.GetNameDef] gagal menembus garis pertahanan dan mendorong musuh keluar. Namun [PRC.GetNameDefCap] berhasil menangkap beberapa artileri."
 SEA_PRC_misc_events.1.t: "Masyarakat Meragukan Tekad Kami"
 SEA_PRC_misc_events.1.desc: "Rakyat Tiongkok meragukan tekad kami melawan penjajah asing!"
 SEA_PRC_misc_events.1.a: "Ini tidak akan bertahan!"
 SEA_PRC_misc_events.2.t: "Hilangnya Kepercayaan"
 SEA_PRC_misc_events.2.desc: "Rakyat Tiongkok meragukan tekad kami melawan penjajah asing."
 SEA_PRC_misc_events.2.a: "Kita harus mengubah pendapat mereka tentang kita"
 SEA_PRC_misc_events.3.t: "$PRC_pavel_mif$ Ditangkap dan Dibersihkan di [SOV.GetNameDef]"
 SEA_PRC_misc_events.3.desc: "$PRC_pavel_mif$, mantan mentor 28 ½ Bolshevik dan tokoh senior di partai komunis Tiongkok dan Universitas Sun Yat-sen Moskow, telah ditangkap dan dibersihkan di [SOV.GetNameDef]. Tampaknya afiliasi Mif dengan mantan rival Stalin terbukti berakibat fatal."
 SEA_PRC_misc_events.3.a: "Sebuah kerugian besar"
 SEA_PRC_misc_events.5.t: "He Long dan Pasukan Front Kedua Telah Tiba di [ROOT.capital.GetName]"
 SEA_PRC_misc_events.5.desc: "Setelah lebih dari tiga tahun menghindari pasukan Nasionalis, He Long telah tiba di [ROOT.capital.GetName] dengan kerusakan minimal pada pasukannya. Pengalaman Long dalam memimpin dan melatih pasukan Nasionalis sebelum bergabung dengan Tentara Merah untuk memimpin operasi gerilya akan berguna – begitu pula pasukannya."
 SEA_PRC_misc_events.5.a: "Akhirnya! Kami akan membutuhkan keahliannya"
 SEA_PRC_misc_events.6.t: "Jurnalis Amerika Edgar Snow Mewawancarai Mao"
 SEA_PRC_misc_events.6.desc: "Setelah bekerja sebagai jurnalis selama bertahun-tahun di wilayah lain Tiongkok, Edgar Snow dari Amerika berupaya mewawancarai Mao. Dalam rangkaian wawancara berikut, Mao dan Snow terutama berbicara tentang [JAP.GetAdjective] imperialisme dan bagaimana [ROOT.GetNameDef] dan [CHI.GetNameDef] dapat berorganisasi untuk melawannya, Mao terutama meramalkan sebuah revolusi di Jepang jika Jepang mengalami kekalahan militer yang serius. Wawancara dan pengalaman Snow di [ROOT.GetNameDef] ini, akan menjadi dasar sebuah buku yang menyajikan wawasan uniknya tentang kehidupan di sini."
 SEA_PRC_misc_events.6.a: "Sebuah kesempatan untuk menunjukkan kepada dunia warna asli kita"
 SEA_PRC_misc_events.8.t: "Masa Produktif Untuk $PRC_mao_zedong$"
 SEA_PRC_misc_events.8.desc: "Dari gua tempat tinggalnya di Phoenix Hill di pegunungan dekat Yan'an — yang dibagikan dengan para pemimpin [ROOT.GetCommunistParty] lainnya — Mao, selain menulis puisi, juga menulis berbagai topik mulai dari taktik militer hingga politik."
 SEA_PRC_misc_events.8.a: "Tulisan-tulisan ini pasti akan berpengaruh"
 SEA_PRC_misc_events.9.t: "Kongres Nasional Partai Komunis Tiongkok ke-7"
 SEA_PRC_misc_events.9.desc: "Setelah kekalahan [JAP.GetNonIdeologyName], Partai Komunis Tiongkok berkumpul untuk mendiskusikan langkah ke depan. Kongres ke-7 ini menandai kongres nasional pertama sejak tahun 1928 sekaligus kembalinya pertemuan di tanah Tiongkok, kongres sebelumnya diselenggarakan di Moskow karena partai melemah. Hal-hal yang dibahas mencakup keberhasilan dan kegagalan taktik kami melawan [JAP.GetAdjective]. Poin lainnya termasuk penerapan konstitusi baru, upaya untuk menerapkan visi [ROOT.GetLeader] tentang cara terbaik memimpin bangsa kita ke depan."
 SEA_PRC_misc_events.9.a: "Ini akan membantu membawa kita ke masa depan"
 SEA_PRC_misc_events.10.t: "Dokter Kanada Norman Bethune Tiba"
 SEA_PRC_misc_events.10.desc: "Norman Bethune, seorang komunis Kanada dan dokter lapangan veteran Perang Saudara Spanyol, telah tiba untuk membantu masyarakat [ROOT.GetAdjective] meningkatkan kualitas perawatan medis. Sebelumnya terkenal karena keberhasilannya dalam menciptakan stasiun transfusi darah keliling, upayanya kini kemungkinan besar akan mencakup peningkatan praktik medis di daerah pedesaan terpencil di [ROOT.GetNameDef]."
 SEA_PRC_misc_events.10.a: "Kami akan menerima sukarelawan internasional mana pun"
 SEA_PRC_misc_events.11.t: "Norman Bethune Meninggal Dunia"
 SEA_PRC_misc_events.11.desc: "Berita duka telah sampai ke [ROOT.Capital.GetName]. Dokter Norman Bethune – setelah tanpa pamrih membantu masyarakat kami selama lebih dari dua tahun – meninggal dunia setelah mengalami luka kecil di jarinya, yang menyebabkan infeksi yang berakibat fatal. [ROOT.GetLeader], setelah menerima berita ini, menulis pidato yang memuji karya Bethune. Penghormatan yang dituliskan ini menyoroti kesediaan sang dokter untuk berkeliling dunia demi mendukung rekan-rekannya, dan bagaimana ia memberikan contoh bagi kerja sama antara proletariat di berbagai negara."
 SEA_PRC_misc_events.11.a: "Pidato yang pas"
 SEA_PRC_misc_events.12.t: "[SOV.GetAdjective]-Pakta Non-Agresi Jepang Ditandatangani"
 SEA_PRC_misc_events.12.desc: "Dalam upaya menjaga perbatasan timurnya, [SOV.GetNameDef] telah menandatangani 'pakta netralitas' dengan [JAP.GetNameDef]. Namun hal ini berarti [JAP.GetNameDef] akan diberi kebebasan untuk melakukan ekspansi di Asia tanpa perlu khawatir dengan intervensi [SOV.GetAdjective]."
 SEA_PRC_misc_events.12.a: "Sebuah pil pahit yang harus ditelan"
 SEA_PRC_misc_events.13.t: "[FROM.GetNameDefCap] Meminta Wilayah"
 SEA_PRC_misc_events.13.desc: "Kami telah menerima delegasi dari [FROM.GetNameDef], yang mengajukan petisi kepada kami untuk menyerahkan wilayah yang mereka klaim sebagai hak mereka, dan itu mungkin benar... Dari sudut pandang tertentu. [FROM.GetLeader] akan sangat berterima kasih jika kami menuruti dan memberikan apa yang diminta oleh Tiongkok, dan kami juga akan merasa kecewa jika kami menolak — sedemikian rupa sehingga [FROM.GetLeader.GetSheHe] mungkin mempertimbangkan untuk mengambil alih wilayah tersebut dengan paksa. Atau begitulah klaim delegasi setidaknya..."
 SEA_PRC_misc_events.13.a: "Berikan mereka harta Manchuria kita"
 SEA_PRC_misc_events.13.b: "Beri mereka harta milik Mongolia kita"
 SEA_PRC_misc_events.13.c: "Berikan mereka semua yang kita miliki"
 SEA_PRC_misc_events.13.d: "Jangan beri mereka apa pun!"
 SEA_PRC_misc_events.14.t: "[FROM.GetNameDefCap] Wajib"
 SEA_PRC_misc_events.14.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali dengan kabar baik! Permintaan kami kepada [FROM.GetLeader] untuk menyerahkan wilayah Manchuria yang sah kepada kami telah dikabulkan. [ROOT.GetLeader] memberikan pujian kepada [FROM.GetLeader] dan diplomat kami karena berhasil mencapai prestasi ini."
 SEA_PRC_misc_events.14.a: "Selangkah lebih dekat menuju Tiongkok Bersatu!"
 SEA_PRC_misc_events.15.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali dengan kabar baik! Permintaan kami kepada [FROM.GetLeader] untuk menyerahkan wilayah Mongolia yang menjadi hak kami telah dikabulkan. [ROOT.GetLeader] memberikan pujian kepada [FROM.GetLeader] dan diplomat kami karena berhasil mencapai prestasi ini."
 SEA_PRC_misc_events.16.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali dengan kabar baik! Permintaan kami kepada [FROM.GetLeader] untuk menyerahkan wilayah sah kami yang dikuasai oleh [FROM.GetNameDef] telah dikabulkan. [ROOT.GetLeader] memberikan pujian kepada [FROM.GetLeader] dan diplomat kami karena berhasil mencapai prestasi ini."
 SEA_PRC_misc_events.17.t: "[FROM.GetNameDefCap] Menolak"
 SEA_PRC_misc_events.17.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali dengan perasaan sedih. Permintaan kami kepada [FROM.GetLeader] untuk menyerahkan wilayah yang menjadi hak kami telah ditanggapi dengan penolakan dan cemoohan. [ROOT.GetLeader] telah mengutuk [FROM.GetLeader] dan diplomat kami karena gagal mengamankan apa yang menjadi hak kami."
 SEA_PRC_misc_events.17.a: "Orang bodoh yang buta adalah orang yang buta sekaligus bodoh"
 SEA_PRC_misc_events.17.b: "Kami akan mengambil milik kami dengan paksa!"
 SEA_PRC_misc_events.18.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali dengan perasaan sedih. Permintaan kami kepada [FROM.GetLeader] untuk menyerahkan wilayah yang menjadi hak kami telah ditanggapi dengan penolakan dan cemoohan. [ROOT.GetLeader] telah mengutuk [FROM.GetLeader] dan diplomat kami karena gagal mengamankan apa yang menjadi hak kami."
 SEA_PRC_misc_events.18.a: "Serahkan [326.GetName]"
 SEA_PRC_misc_events.18.b: "Serahkan [729.GetName]"
 SEA_PRC_misc_events.18.c: "Serahkan [728.GetName]"
 SEA_PRC_misc_events.18.d: "Serahkan semuanya"
 SEA_PRC_misc_events.19.a: "[FROM.GetNameDefCap] Menyerahkan [326.GetName]"
 SEA_PRC_misc_events.19.b: "[FROM.GetNameDefCap] Serahkan [729.GetName]"
 SEA_PRC_misc_events.19.c: "[FROM.GetNameDefCap] Menyerahkan [728.GetName]"
 SEA_PRC_misc_events.19.d: "[FROM.GetNameDefCap] Serahkan semuanya"
 SEA_PRC_misc_events.19.e: "[FROM.GetNameDefCap] Menyerahkan [743.GetName]"
 SEA_PRC_misc_events.19.desc: "Kami beruntung [FROM.GetNameDef] menyetujui tuntutan kami."
 SEA_PRC_political_events.1.t: "$PRC_wang_ming$ atau $PRC_bo_gu$ sebagai Pemimpin [Root.GetName]?"
 SEA_PRC_political_events.1.desc1: "Dengan kemenangan 28 ½ Bolshevik dalam perebutan kekuasaan, sekarang saatnya memilih seorang wakil untuk memimpin negara. Meskipun ia diasingkan di [SOV.GetNameDef], sekarang saatnya $PRC_wang_ming$ kembali ke kepemimpinan — seandainya $PRC_bo_gu$ tidak mendapat dukungan."
 SEA_PRC_political_events.1.desc2: "Dengan kemenangan 28 ½ Bolshevik dalam perebutan kekuasaan, sekarang saatnya memilih seorang wakil untuk memimpin negara. Meskipun kedua kandidat memiliki koneksi yang baik dengan komunis di [SOV.GetNameDef], $PRC_bo_gu$ kurang berpengalaman secara politik. Namun ia menunjukkan pemahaman yang mendalam mengenai permasalahan militer yang mungkin berguna dalam perjuangan di masa depan, jika hal tersebut dapat melebihi kecerdasan $PRC_wang_ming$ dalam bidang politik dan diplomatik. Keduanya siap untuk mengambil alih peran tersebut."
 SEA_PRC_political_events.1.a: "Biarkan $PRC_wang_ming$ memimpin"
 SEA_PRC_political_events.1.b: "Biarkan $PRC_bo_gu$ memimpin"
 SEA_PRC_political_events.2.t: "[FROM.GetNameDefCap] Meminta Jaminan Wilayah"
 SEA_PRC_political_events.2.desc: "Terlepas dari dukungan kami, dan lokasi mereka yang relatif terlindung di pegunungan Tiongkok tengah, [FROM.GetNameDef] telah meminta agar kami berjanji untuk melindungi mereka jika terjadi konflik. Apakah mereka takut terhadap kampanye anti-komunis yang dilakukan oleh kekuatan nasionalis atau imperialisme asing masih belum jelas, namun kita perlu mempertimbangkan risiko terseret ke dalam konflik tersebut sebelum kita memberikan jaminan apa pun."
 SEA_PRC_political_events.2.a: "Kita harus melindungi rekan-rekan kita"
 SEA_PRC_political_events.2.b: "Kami akan menjamin mereka — jika mereka setuju untuk menjadi subjek kami"
 SEA_PRC_political_events.2.c: "Ini terlalu berisiko"
 SEA_PRC_political_events.3.t: "[FROM.GetNameDefCap] Menyetujui Jaminan Teritorial"
 SEA_PRC_political_events.3.desc: "Misi kami untuk [FROM.GetNameDef] berhasil, dan mereka berjanji untuk melindungi kami dari ancaman apa pun yang mungkin kami hadapi. Perlindungan ini harus memungkinkan kita untuk fokus pada tujuan jangka panjang seperti mengembangkan [ROOT.capital.GetName], suatu masalah yang sebelumnya telah dikompromikan oleh potensi urgensi dari kemunduran taktis lainnya."
 SEA_PRC_political_events.3.a: "Ini seharusnya membuat kita tetap aman"
 SEA_PRC_political_events.31.t: "[FROM.GetNameDefCap] Menyetujui Jaminan Wilayah — Dengan Biaya tertentu"
 SEA_PRC_political_events.31.desc: "Misi kami untuk [FROM.GetNameDef] berhasil, dan mereka berjanji untuk melindungi kami dari ancaman apa pun yang mungkin kami hadapi. Perlindungan ini harus memungkinkan kita untuk fokus pada tujuan jangka panjang seperti mengembangkan [ROOT.capital.GetName], suatu masalah yang sebelumnya telah dikompromikan oleh potensi urgensi dari kemunduran taktis lainnya."
 SEA_PRC_political_events.31.a: "Ini seharusnya membuat kita tetap aman"
 SEA_PRC_political_events.31.b: "Setelah dipikir-pikir... janganlah kita melakukannya"
 SEA_PRC_political_events.32.t: "[FROM.GetNameDefCap] Menyesali Keputusan Mereka"
 SEA_PRC_political_events.32.desc: "[FROM.GetNameDefCap] menjawab bahwa mereka tidak ingin lagi menggunakan opsi diplomatik yang menjamin mereka. Tampaknya prinsip menjadi subjek terlalu berat untuk mereka tanggung."
 SEA_PRC_political_events.32.a: "Ini adalah kerugian mereka"
 SEA_PRC_political_events.4.t: "[FROM.GetName] Menolak Menjamin Kami"
 SEA_PRC_political_events.4.desc: "Terlepas dari upaya terbaik yang dilakukan diplomat kami, [FROM.GetNameDef] menolak berkomitmen untuk melindungi [ROOT.GetNameDef]. Kita hanya bisa berharap bahwa janji-janji perlindungan seperti itu tidak akan pernah diperlukan lagi."
 SEA_PRC_political_events.4.a: "Sayang sekali"
 SEA_PRC_political_events.5.t: "[FROM.GetName] Ingin Bergabung [ROOT.GetFactionName]"
 SEA_PRC_political_events.5.desc: "[FROM.GetNameDefCap] telah mengambil langkah lain dalam upaya memperluas kerja samanya dengan kami dengan meminta untuk bergabung dengan [ROOT.GetFactionName]. Kita harus memutuskan apakah kita akan menganggap hal ini sebagai perluasan [ROOT.GetFactionName] yang berguna ke Tiongkok, atau apakah aliansi semacam ini justru akan menimbulkan potensi kerugian."
 SEA_PRC_political_events.5.a: "Biarkan mereka masuk"
 SEA_PRC_political_events.5.b: "Kita tidak bisa mengambil risiko untuk memperluasnya secara berlebihan"
 SEA_PRC_political_events.6.t: "[FROM.GetName] Setuju untuk Mengizinkan Kami Bergabung [FROM.GetFactionName]"
 SEA_PRC_political_events.6.desc: "Delegasi kami ke [FROM.GetNameDef] telah kembali ke negaranya untuk mengumumkan bahwa kami telah diterima di [FROM.GetFactionName]. Bersama mereka, para diplomat [FROM.GetAdjective] datang untuk mendiskusikan seperti apa kerja sama kita nantinya."
 SEA_PRC_political_events.6.a: "Hari yang baru"
 SEA_PRC_political_events.7.t: "[FROM.GetName] Menolak Kami Bergabung [FROM.GetFactionName]"
 SEA_PRC_political_events.7.desc: "Para diplomat yang kami kirim ke [FROM.GetName] kembali dengan berita bahwa kami tidak diizinkan untuk bergabung dengan [FROM.GetFactionName]. Tampaknya [FROM.GetNameDef] memfokuskan upaya diplomasinya di tempat lain."
 SEA_PRC_political_events.7.a: "Sayang sekali"
 SEA_PRC_political_events.8.t: "[FROM.GetName] Ingin Menandatangani Pakta Non-Agresi"
 SEA_PRC_political_events.8.desc: "Melihat wilayah ini dikelilingi oleh musuh-musuh potensial, [FROM.GetNameDef] telah mendekati kami untuk mencari Pakta Non-Agresi guna memastikan kepasifan kami dalam setiap konflik di kawasan yang ditujukan kepada mereka."
 SEA_PRC_political_events.8.a: "Lagipula kami tidak ingin terlibat"
 SEA_PRC_political_events.8.b: "Hal ini mungkin membuat mereka bertindak lebih agresif"
 SEA_PRC_political_events.9.t: "[FROM.GetName] Setuju untuk Menandatangani Pakta Non-Agresi"
 SEA_PRC_political_events.9.desc: "Setelah mempertimbangkan dengan cermat, [FROM.GetNameDef] telah memutuskan untuk menandatangani Pakta Non-Agresi yang kami usulkan. Syukurlah mereka tampaknya tidak tertarik untuk terlibat dalam konflik di wilayah tersebut."
 SEA_PRC_political_events.9.a: "Itu melegakan"
 SEA_PRC_political_events.10.t: "[FROM.GetName] Menolak Menandatangani Pakta Non-Agresi"
 SEA_PRC_political_events.10.desc: "Kaum imperialis [FROM.GetName] telah menolak permintaan kami untuk menandatangani perjanjian non-agresi dengan kami. Tampaknya mereka memprioritaskan hubungan dengan saingan kita dibandingkan dengan kita."
 SEA_PRC_political_events.10.a: "Sayang sekali"
 SEA_PRC_political_events.11.t: "[FROM.GetName] Ingin Bebas"
 SEA_PRC_political_events.11.desc: "[FROM.GetLeader] telah mengirim telegram ke [Root.GetLeader], secara resmi meminta kemerdekaan [FROM.GetName]. Telegram tersebut tidak mengatakan apa yang akan terjadi jika kami menolak, namun dapat diasumsikan bahwa mereka tidak akan senang."
 SEA_PRC_political_events.11.a: "Biarkan mereka bebas"
 SEA_PRC_political_events.11.b: "Tidak, mereka akan tetap menjadi subyek kita"
 SEA_PRC_political_events.12.t: "[FROM.GetName] Setuju untuk Membebaskan Kami"
 SEA_PRC_political_events.12.desc: "Ini adalah hari yang luar biasa di [ROOT.Capital.GetName] — kita bebas dari beban [FROM.GetName]. Ini saatnya merayakan, waktu kita sudah dekat."
 SEA_PRC_political_events.12.a: "Hari yang luar biasa!"
 SEA_PRC_political_events.13.t: "[FROM.GetName] Menolak Membebaskan Kami"
 SEA_PRC_political_events.13.desc: "Sayang sekali — sebagai respons terhadap telegram [ROOT.GetLeader], [FROM.GetName] menolak menjamin kemerdekaan kita, malah menyatakan bahwa nasib kita terikat dengan nasib mereka."
 SEA_PRC_political_events.13.a: "Saat-saat yang sulit membutuhkan tindakan yang putus asa..."
 SEA_PRC_political_events.13.b: "Kami akan menunggu waktu kami..."
 SEA_PRC_political_events.19.t: "Beberapa Jenderal Kita Telah Beralih Sisi!"
 SEA_PRC_political_events.19.desc: "Konflik antara [PRC.GetNameDef] dan [CHI.GetNameDef] telah melemahkan angkatan bersenjata kita karena beberapa komandan kita membelot ke komunis. Apakah mereka benar-benar sejalan dengan [PRC.GetNameDef], atau sekadar mengikuti arah angin yang bertiup, masih harus dilihat."
 SEA_PRC_political_events.19.a: "Pengkhianat, banyak dari mereka"
 SEA_PRC_political_events.20.t: "Para Jenderal di Seluruh Tiongkok Berbondong-bondong Mendukung Tujuan Kita"
 SEA_PRC_political_events.20.desc: "Dimulainya kembali permusuhan antara [CHI.GetNameDef] dan [PRC.GetNameDef] telah menimbulkan ketidakpastian di kalangan perwira musuh, menyebabkan beberapa dari mereka membelot ke pihak kita."
 SEA_PRC_political_events.20.a: "Sebuah pertanda penuh harapan!"
 SEA_PRC_political_events.21.t: "[FROM.GetName] Ingin $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ Menasihati Mereka"
 SEA_PRC_political_events.21.desc: "\nUntuk [ROOT.GetAdjective] mengenai strategi militer, [FROM.GetNameDef] telah meminta agar kami mengizinkan $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ untuk kembali ke Tiongkok. Chuykov awalnya ditempatkan di [FROM.GetNameDef] dan fasih berbahasa Mandarin, namun dipanggil kembali setelah terjadi konflik kepentingan [ROOT.GetAdjective] di Manchuria, ketika wilayah tersebut belum diinvasi oleh Jepang."
 SEA_PRC_political_events.21.a: "[FROM.GetNameDefCap] akan mendapatkan manfaat dari bantuan mereka"
 SEA_PRC_political_events.21.b: "Kami membutuhkan keahlian mereka di rumah"
 SEA_PRC_political_events.22.t: "[FROM.GetName] Setuju untuk Mengirimkan kepada Kami $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.22.desc: "\nPerwakilan kami di [FROM.capital.GetName] telah menghubungi kami dengan berita bahwa [FROM.GetNameDef] telah menerima permintaan kami untuk mengizinkan $SOV_vasily_chuykov$ kembali ke Tiongkok, dan memberi tahu kami bahwa dia sedang dalam perjalanan ke <span terjemahkan=\"tidak\">[ROOT.GetNameDef]</span>. Selain itu, $SOV_aleksandr_cherepanov$ telah bergabung dengannya."
 SEA_PRC_political_events.22.a: "Selamat datang kembali!"
 SEA_PRC_political_events.23.t: "[FROM.GetName] Menolak Mengirimkan Kami $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.23.desc: "\nMeskipun $SOV_vasily_chuykov$ cocok sebagai atase di [ROOT.GetNameDef], [FROM.GetNameDef] telah memutuskan untuk tidak memberangkatkannya atau $SOV_aleksandr_cherepanov$, mengklaim bahwa mereka saat ini terlibat dalam rencana militer yang lebih penting."
 SEA_PRC_political_events.23.a: "Mungkin hanya sedikit komandan terampil yang tersisa setelah pembersihan"
 SEA_PRC_political_events.24.t: "[FROM.GetName] Ingin Kami Menugaskan Ulang $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.24.desc: "\nMendengar misi $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ untuk [CHI.GetNameDef], [FROM.GetNameDef] telah menyatakan minatnya untuk juga menampung mereka sebagai atase. [FROM.GetNameDefCap] tampaknya telah memahami keterampilan praktis para komandan yang fasih berbahasa Mandarin dikombinasikan dengan pengalaman militer yang luas, atau mungkin, mereka hanya ingin menyangkal [CHI.GetName] keahlian ini."
 SEA_PRC_political_events.24.a: "Kami akan membantu rekan-rekan kami di [FROM.GetNameDef]"
 SEA_PRC_political_events.24.b: "Mereka melakukan pekerjaan dengan baik di [CHI.GetName]"
 SEA_PRC_political_events.25.t: "[FROM.GetName] Pesanan $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ ke [PRC.GetName]"
 SEA_PRC_political_events.25.desc: "\nSetelah permintaan dari [PRC.GetNameDef] untuk memindahkan $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ ke wilayah mereka, mereka sudah mulai melakukan perjalanan ke arah mereka. Meskipun kami mengimbau mereka untuk tetap menjadi penasihat, mereka tidak dapat melanggar perintah yang diberikan oleh [FROM.GetNameDef]."
 SEA_PRC_political_events.25.a: "Kerugian bagi tentara kita"
 SEA_PRC_political_events.26.t: "[FROM.GetName] Pesanan $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ ke [PRC.GetName]"
 SEA_PRC_political_events.26.desc: "\n[FROM.GetNameDefCap] telah memutuskan untuk memenuhi permintaan kami dan telah memerintahkan $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ untuk pindah ke [ROOT.GetNameDef]. Nasihat mereka pasti akan sangat berharga, dan relokasi ini akan menjadi pukulan telak bagi pasukan [CHI.GetNameDef]."
 SEA_PRC_political_events.26.a: "Mari kita lihat saran apa yang mungkin mereka miliki"
 SEA_PRC_political_events.27.t: "[FROM.GetName] Menolak Mengirimkan Kami $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$"
 SEA_PRC_political_events.27.desc: "\nMeskipun dukungan sebelumnya diberikan oleh [FROM.GetNameDef], mereka menolak untuk mengakhiri tugas $SOV_vasily_chuykov$ dan $SOV_aleksandr_cherepanov$ di [CHI.GetNameDef], menghalangi kami untuk mengerahkan komandan sebagai atase di sini. Mereka berpendapat bahwa pasukan [CHI.GetNameDef] saat ini sangat penting bagi [FROM.GetNameDef]."
 SEA_PRC_political_events.27.a: "Mereka membuat kesalahan"
 SEA_PRC_political_events.41.t: "Diarki yang Tidak Diinginkan"
 SEA_PRC_political_events.41.desc: "Saingan politik selama bertahun-tahun, $PRC_mao_zedong$ dan $PRC_zhang_guotao$ telah bertemu di [ROOT.Capital.GetName] untuk mengesampingkan perbedaan mereka dalam menghadapi situasi berbahaya yang kita hadapi. Meskipun tidak ada yang sepenuhnya percaya satu sama lain, musuh dari musuh kita adalah teman."
 SEA_PRC_political_events.41.a: "Aliansi yang tidak mudah"
 SEA_PRC_zhang_guotao_events.1.t: "Perpecahan di dalam Partai"
 SEA_PRC_zhang_guotao_events.1.desc: "$PRC_zhang_guotao$, Jenderal yang bertanggung jawab atas Tentara Front Keempat, memimpin salah satu dari dua pasukan yang belum tiba di area pangkalan aman kami. Mereka masih melakukan Long March, setelah tidak setuju dengan Mao mengenai jalan mana yang harus diambil. Pada bulan Oktober 1935, $PRC_zhang_guotao$ menyatakan dirinya sebagai pemimpin sebenarnya dari [ROOT.GetNameDef], dan bahkan telah membentuk Komite Sentral, Pemerintah Pusat, dan Komisi Militer Pusat sendiri. Ia juga menyatakan bahwa $PRC_mao_zedong$, $PRC_zhang_wentian$ dan $PRC_zhou_enlai$ harus dikeluarkan dari Partai.\n\n$PRC_zhang_guotao$ kini telah mengirimkan telegram ke [ROOT.GetLeader] yang menyatakan bahwa dia sedang menuju ke area pangkalan yang aman bersama pasukannya. Telegram tersebut juga menyatakan bahwa, sesuai keinginan Lin Yuying — utusan Partai untuk [SOV.GetNameDef] — Guotao telah menangguhkan Organ Partainya demi mendukung rekonsiliasi damai dengan Mao dan pihak lainnya. Tidak peduli apa yang dia katakan, Guotao tetap merupakan saingan politik yang kuat dan tidak boleh diremehkan."
 SEA_PRC_zhang_guotao_events.1.a: "Meskipun Guotao mempunyai kekuatan militer, Partai Komunis Tiongkok menentang klaim legitimasinya"
 SEA_PRC_zhang_guotao_events.1.b: "Mungkin dia ada benarnya?"
 SEA_PRC_zhang_guotao_events.2.t: "Telegram Dari $PRC_zhang_guotao$"
 SEA_PRC_zhang_guotao_events.2.desc: "$PRC_zhang_guotao$ dari Tentara Front Keempat, saingan politik Mao, telah mengirim telegram bahwa ia dan pasukannya sudah mendekati [ROOT.Capital.GetName]. Long March mereka telah berlangsung hampir satu tahun lebih lama dibandingkan dengan $PRC_mao_zedong$, dan tentara pasti akan kelelahan karena cobaan berat ini. Mungkin karena hal inilah $PRC_zhang_guotao$ kembali menekankan bahwa ia tidak berupaya menantang kepemimpinan partai saat ini." #will arrive soon, drops his claims (for now) etc.
 SEA_PRC_zhang_guotao_events.2.a: "Selamat datang Guotao dan pasukannya — tapi tetap awasi dia"
 SEA_PRC_zhang_guotao_events.2.b: "Kami tidak bisa mempercayainya — mengecam $PRC_zhang_guotao$ dan menolak dia masuk ke wilayah kami"
 PRC_reject_guotao_tt: "§RIni akan mencegah akses ke§!§Y$PRC_the_unwilling_diarchy_focus$§!§Rfokus dan cabang berikutnya§!"
 SEA_PRC_zhang_guotao_events.3.t: "$PRC_zhang_guotao$ dan Tentara Front Keempat Telah Tiba di [ROOT.capital.GetName]"
 SEA_PRC_zhang_guotao_events.3.desc: "Akhirnya, Long March telah berakhir bagi $PRC_zhang_guotao$ dan Tentara Front Keempat — mereka telah tiba dalam keadaan relatif utuh di wilayah pangkalan kami. Pembekalan telah dimulai, namun Guotao belum melepaskan klaimnya atas kepemimpinan. Sebaliknya, ia mengaku mendukung apa yang harus dilakukan untuk membantu memenangkan perjuangan yang akan datang, tanpa menjelaskan lebih lanjut apa yang ia maksudkan dengan hal tersebut. Pertemuan Politbiro lebih lanjut perlu diadakan [Root.GetLeader] untuk menyelesaikan kekacauan ini."
 SEA_PRC_zhang_guotao_events.3.a: "Sebuah tantangan bagi kepemimpinan partai?"
 SEA_PRC_zhang_guotao_events.4.t: "$PRC_zhang_guotao$ Meninggalkan Partai Komunis"
 SEA_PRC_zhang_guotao_events.4.desc: "$PRC_zhang_guotao$ telah menyatakan bahwa ia meninggalkan Partai Komunis Tiongkok, dengan alasan hubungannya yang tidak dapat diperbaiki dengan Komite Sentral dan kekecewaannya terhadap partai tersebut."
 SEA_PRC_zhang_guotao_events.4.a: "Pengkhianat tujuan kita"
 SEA_PRC_zhang_guotao_events.4.b: "Yakinkan dia untuk tetap tinggal"
 PRC_zhang_guotao_left_tt: "§Y$PRC_zhang_guotao$§! §Rtidak akan tersedia lagi§! sebagai §YJenderal§! atau §YPenasihat§!"
 CHI_guotao_joins_kmt: "$PRC_zhang_guotao$ telah bergabung dengan KMT"
 SEA_PRC_zhang_guotao_events.5.t: "$PRC_zhang_guotao$ Ingin Bergabung dengan Gerakan Kami"
 SEA_PRC_zhang_guotao_events.5.desc: "$PRC_zhang_guotao$, 'mantan' pemimpin komunis dan saingan politik $PRC_mao_zedong$, telah mendekati [ROOT.GetLeader] untuk bergabung dengan pihak kita dalam perjuangan melawan agresi asing. Dijuluki 'mantan' komunis karena kecamannya baru-baru ini terhadap kepemimpinan [PRC.GetLeader] di Komite Sentral, Guotao telah meninggalkan Partai dan kini berupaya bergabung dengan kami. Pengalamannya mungkin berguna, tapi [PRC.GetNameDef] pasti akan marah karena membiarkan seseorang yang mereka anggap pengkhianat bergabung dengan kita."
 SEA_PRC_zhang_guotao_events.5.a: "Izinkan $PRC_zhang_guotao$ bergabung dengan kami"
 SEA_PRC_zhang_guotao_events.5.b: "Menolak - kita tidak bisa mempercayainya"
 SEA_PRC_zhang_guotao_events.6.t: "$PRC_zhang_guotao$ Telah Bergabung dengan KMT"
 SEA_PRC_zhang_guotao_events.6.desc: "$PRC_zhang_guotao$ tidak hanya meninggalkan Partai Komunis Tiongkok, ia juga bergabung dengan KMT di bawah kepemimpinan [CHI.GetNameDef]. Jika kami menghadapi konflik langsung dengan mereka, $PRC_zhang_guotao$ akan berada di pihak musuh."
 SEA_PRC_zhang_guotao_events.6.a: "Seorang pengkhianat!"
 SEA_PRC_zhang_guotao_events.7.t: "$PRC_zhang_guotao$ Meninggalkan Partai Komunis"
 SEA_PRC_zhang_guotao_events.7.desc: "$PRC_zhang_guotao$ telah menyatakan bahwa ia meninggalkan Partai Komunis Tiongkok, dengan alasan hubungannya yang tidak dapat diperbaiki dengan Komite Sentral dan $PRC_mao_zedong$, serta kekecewaannya terhadap partai tersebut."
 SEA_PRC_zhang_guotao_events.7.a: "Diarki yang Tidak Diinginkan adalah sebuah kesalahan - dia tidak bisa dipercaya"
#######################
### THE Philippines ###
#######################
SEA_PHI_political_events.1.t: "[FROM.GetName] Menyarankan Perjanjian Perdagangan" #Japan gets request for trade connection (from PHI to JAP)
SEA_PHI_political_events.1.desc: "Dalam upaya untuk mengurangi ketergantungan mereka pada perdagangan [USA.GetAdjective], [FROM.GetNameDef] telah menghubungi kami dengan proposal untuk kesepakatan perdagangan baru. Sama halnya dengan mereka, hal ini juga memungkinkan kita untuk mengurangi ketergantungan kita pada sekelompok kecil mitra dagang."
SEA_PHI_political_events.1.a: "Memiliki sumber-sumber alternatif untuk sumber daya yang kita perlukan sangatlah penting" ## Agree to trade
SEA_PHI_political_events.1.b: "Kami juga memikirkan mitra dagang lain" ## Reject Trade
SEA_PHI_political_events.2.t: "Jepang Menandatangani Perjanjian Perdagangan"
SEA_PHI_political_events.2.desc: "Perjanjian perdagangan yang kami usulkan dengan [FROM.GetNameDef] diterima secara positif oleh pemerintah mereka. Antusiasme mereka merupakan awal yang baik bagi kami untuk mencari mitra dagang baru."
SEA_PHI_political_events.2.a: "Berita bagus"
SEA_PHI_political_events.3.t: "[FROM.GetName] Menyarankan Perjanjian Perdagangan Baru" ## These are Siam, Malaya and Dutch East Indies. They get this event from PHI
SEA_PHI_political_events.3.desc: "Sehubungan dengan jalan menuju kemerdekaan yang telah ditetapkan, [FROM.GetNameDef] telah menghubungi kami dengan rancangan perjanjian perdagangan antar negara. Mereka mengusulkan kesepakatan yang akan menjadikan impor sumber daya kami lebih menarik bagi mereka, karena sebelumnya mitra dagang mungkin dipilih berdasarkan kepentingan [USA.GetAdjective] dan bukan berdasarkan kepentingan [FROM.GetAdjective]."
SEA_PHI_political_events.3.a: "Hal ini akan memberi kita keunggulan kompetitif"
SEA_PHI_political_events.3.b: "Mereka akan mendapatkan harga yang sama dengan orang lain"
SEA_PHI_political_events.4.t: "[FROM.GetName] Menyetujui Perjanjian Perdagangan"
SEA_PHI_political_events.4.desc: "Perwakilan [FROM.GetAdjective] telah mengumumkan bahwa mereka akan mengirimkan delegasi lebih lanjut untuk membuat perjanjian perdagangan antar negara. Perjanjian baru dengan [FROM.GetNameDef] menjanjikan lebih banyak pilihan dalam menentukan dari mana kita memperoleh sumber daya penting."
SEA_PHI_political_events.4.a: "Berita bagus"
SEA_PHI_political_events.5.t: "[FROM.GetName] Menolak Perjanjian Dagang"
SEA_PHI_political_events.5.desc: "Proposal kami yang masuk akal untuk perjanjian perdagangan dengan [FROM.GetNameDef] telah ditolak. Tampaknya kesepakatan dengan mitra dagang lain atau pertimbangan geopolitik berarti bahwa mereka bertindak bertentangan dengan kepentingan kami dan kepentingan mereka sendiri."
SEA_PHI_political_events.5.a: "Kami akan mencari orang lain untuk membeli sumber daya"
SEA_PHI_political_events.6.t: "[FROM.GetName] Memberikan Dukungan"  ### Support for the Chinese Communists - Sends event from PHI to PRC offering support
SEA_PHI_political_events.6.desc: "Tumbuhnya pengaruh [FROM.GetCommunistParty] di [FROM.GetNameDef] kini membuahkan hasil karena perwakilannya telah melintasi Tiongkok untuk memberi tahu kami tentang pasukan sukarelawan [FROM.GetAdjective] yang melakukan mobilisasi untuk mendukung pasukan kami. Selain itu, para relawan ini juga membawa perlengkapan cadangan untuk membantu memperlengkapi pasukan kita sendiri."
SEA_PHI_political_events.6.a: "Awal yang baik untuk kerja sama dengan rekan [FROM.GetAdjective] kami"
#SEA_PHI_political_events.6.b: "They should focus on their own revolution"
SEA_PHI_political_events.7.t: "[FROM.GetName] Terima Kasih atas Dukungan Kami" ### Support for the Chinese Communists - They accept
SEA_PHI_political_events.7.desc: "Perwakilan [FROM.GetLeader] telah menyampaikan rasa terima kasihnya atas dukungan sukarelawan kami dan atas materi perang yang diberikan. Pengalaman luas [FROM.GetAdjective] dalam perang saudara berarti sumber daya ini akan digunakan secara efektif."
SEA_PHI_political_events.7.a: "Sebuah langkah awal yang bagus"
SEA_PHI_political_events.9.t: "[FROM.GetName] Menawarkan Penjualan Kapal untuk Peralatan Militer" ### Request a trade with JAP / USA - convoys for weapons. This is from PHI to JAP/USA
SEA_PHI_political_events.9.desc: "Sebagai imbalan atas kiriman [PHI_GetTradedEquipment], [FROM.GetNameDef] menawarkan untuk mengirimkan kepada kami armada kapal dagang dan kapal pengangkut."
SEA_PHI_political_events.9.a: "Sangat bagus."
SEA_PHI_political_events.9.b: "Kami membutuhkan peralatan itu"
SEA_PHI_political_events.10.t: "[FROM.GetName] Setuju untuk Membeli Kapal" ## JAP/USA Accepts trade
SEA_PHI_political_events.10.desc: "Seperti yang kami usulkan, [FROM.GetNameDef] telah mengirimi kami kiriman [PHI_GetTradedEquipment] sebagai imbalan atas kapal dagang dan pengangkut, yang kini berlayar menuju pelabuhan [FROM.GetAdjective]."
SEA_PHI_political_events.10.a: "Hal ini harus saling menguntungkan"
SEA_PHI_political_events.11.t: "[FROM.GetName] Menolak Proposal Perdagangan" ## JAP/USA rejects trade
SEA_PHI_political_events.11.desc: "Sayangnya, [FROM.GetNameDef] menolak memberi kami [PHI_GetTradedEquipment] sebagai imbalan atas beberapa kapal kami."
SEA_PHI_political_events.11.a: "Mungkin mereka bersedia berpisah dengan beberapa perlengkapan lainnya"
SEA_PHI_political_events.12.t: "Ancaman Intervensi Amerika Telah Berakhir"
SEA_PHI_political_events.12.desc: "Setelah negosiasi yang sengit, dan serangkaian konsesi dari [PHI.GetNameDef], [USA.GetLeader] telah mengumumkan bahwa [USA.GetNameDef] tidak akan melakukan intervensi terhadap rencana [Root.GetRulingPartyLong]. [USA.GetLeader.GetSheHeCap] telah yakin bahwa [PHI.GetNameDef] tidak menimbulkan ancaman langsung terhadap rakyat Amerika, dan bahwa kami telah mengambil langkah yang tepat untuk memastikan kelanjutan pemerintahan yang stabil.[TreatyOfManilaToBeSigned]"
SEA_PHI_political_events.12.a: "Upaya kami telah membuahkan hasil"
PHI_TreatyOfManilaToBeSigned: "\n\nOleh karena itu, perundingan menuju penandatanganan Perjanjian Manila telah disahkan, dan kemerdekaan yang disepakati bersama untuk [PHI.GetNameDef] tampaknya sudah dekat."
SEA_PHI_political_events.13.t: "Masalah [PHI.GetCommunistParty]"
SEA_PHI_political_events.13.desc: "[PHI.GetNameDef] Partai Komunis telah berulang kali menolak perwakilan kami, dan mengancam akan memutuskan semua hubungan dengan kami.\n\nPejabat senior militer telah menyampaikan rencana militer ke meja [Root.GetLeader]. Para pendukung rencana tersebut berpendapat bahwa Filipina yang komunis merupakan ancaman terhadap keamanan kita dan kita harus melakukan intervensi untuk menghentikan penyebaran komunisme."
SEA_PHI_political_events.13.a: "Melakukan intervensi untuk menghentikan komunisme di Asia Tenggara"
SEA_PHI_political_events.13.b: "Embargo [PHI.GetName]"
SEA_PHI_political_events.13.c: "Kirimkan surat dengan kata-kata yang tegas"
SEA_PHI_political_events.14.t: "Perang Diumumkan"
SEA_PHI_political_events.14.desc: "[USA.GetNameDefCap] telah menyatakan perang terhadap [PHI.GetName]. Hal ini terjadi setelah kegagalan meredakan kekhawatiran [USA.GetAdjective] tentang peran [PHI.GetRulingPartyLong]. Pernyataan publik [USA.GetLeader] menyebut perang ini perlu untuk menghentikan penyebaran komunisme di Asia Tenggara."
SEA_PHI_political_events.14.a: "Kami akan melawan mantan penguasa kami"
SEA_PHI_political_events.15.t: "[USA.GetAdjective] Embargo"
SEA_PHI_political_events.15.desc: "[USA.GetNameDefCap] telah mengumumkan embargo perdagangan penuh terhadap [PHI.GetNameDef] karena 'kegagalan pemerintah [PHI.GetAdjective] dalam membatasi pengaruh komunis'."
SEA_PHI_political_events.15.a: "Setidaknya ini bukan respons bersenjata"
SEA_PHI_political_events.16.t: "[USA.GetName] Mengirimkan Protes"
SEA_PHI_political_events.16.desc: "Sebagai respons terhadap perubahan pemerintahan dan kebijakan luar negeri kami, pemerintah [USA.GetAdjective] telah mengirimkan surat yang mengecam tindakan kami. Namun, mengingat intervensi mereka sebelumnya di Amerika Selatan, hal ini tampaknya merupakan reaksi yang ringan."
SEA_PHI_political_events.16.a: "Hasil terbaik yang mungkin, pertimbangkan"
SEA_PHI_political_events.17.t: "Kepemimpinan Baru Kita" ## Pick a new country leader, the communist coup
SEA_PHI_political_events.17.desc: "Memanfaatkan lemahnya pengawasan Amerika terhadap Pemerintah Nasional, Partido Komunista ng Pilipinas dengan cepat turun tangan dan mengisi kekosongan tersebut, dengan anggota partai terpilih menyerukan tindakan tegas segera dan hanya mereka yang mampu melakukannya. Meskipun kelompok-kelompok lain masih memegang kendali, sektor komunis semakin menonjol.\n\nNamun sekarang, kita harus menentukan siapa yang harus memimpin partai dan bangsa menuju terbitnya fajar merah."
SEA_PHI_political_events.17.a: "Tunjuk Evangelista, kita perlu kepemimpinan yang radikal"
SEA_PHI_political_events.17.b: "Tunjuk Santos, untuk pendekatan yang lebih intelektual"
SEA_PHI_political_events.18.t: "[FROM.GetName] Ingin bergabung dengan Komintern" ## Event to SOV - PHI wants to join Comintern
SEA_PHI_political_events.18.desc: "Kami telah menyaksikan kebangkitan para petani, pekerja pabrik, dan nelayan di [PHI.GetNameDef] dengan penuh minat, dan mereka kini telah menyampaikan tawaran diplomatik kepada kami untuk menunjukkan minat mereka untuk bergabung dengan Komintern. Bagaimana seharusnya kita menanggapinya?"
SEA_PHI_political_events.18.a: "Selamat datang [FROM.GetName] di Komintern" ## Yes, they may join
SEA_PHI_political_events.18.b: "Tolak mereka"
SEA_PHI_political_events.19.t: "[FROM.GetName] Menolak Masuk ke Komintern" ## Event to PHI - Soviet refuses
SEA_PHI_political_events.19.desc: "Delegasi kami ke [SOV.GetNameDef] baru saja kembali, namun mereka membawa kabar buruk - kami ditolak masuk ke Komintern. Setidaknya untuk saat ini, kita berdiri sendiri melawan gelombang kegelapan."
SEA_PHI_political_events.19.a: "Dunia tampak sedikit lebih gelap hari ini"
SEA_PHI_political_events.20.t: "Douglas MacArthur Dipesan Ke Filipina" ## Event to USA - MacArthur going to PHI
SEA_PHI_political_events.20.desc: "Presiden [USA.GetLeader] telah memulihkan Douglas MacArthur kembali ke dinas aktif dan menugaskannya untuk memimpin Angkatan Darat Amerika Serikat yang baru dibentuk di Timur Jauh, yang ditempatkan di Filipina. Presiden membuat penunjukan ini karena MacArthur telah bekerja sebagai penasihat militer di Filipina selama beberapa tahun, dan mengetahui dengan baik mengenai situasi pertahanan di sana.\n\nAgar dia dapat mengarahkan pasukannya ke sana dengan lebih baik, kita tidak lagi memiliki kendali atas dia. Namun, kami akan dapat memanggilnya kembali jika kami membutuhkan bakatnya di sini. Namun, kita harus berpikir hati-hati untuk melakukan hal ini, karena kepergiannya dari Filipina dapat dilihat sebagai penarikan diri dari kepentingan Amerika, dan pengabaian tanggung jawab kita di Pasifik pada saat yang genting ini."
SEA_PHI_political_events.20.a: "Semoga berhasil, Jenderal!"
SEA_PHI_political_events.21.t: "Douglas MacArthur Tiba di Filipina" ## Event to PHI - MacArthur has arrived
SEA_PHI_political_events.21.desc: "Berita bagus! Presiden [USA.GetLeader] telah menugaskan Jenderal Douglas MacArthur untuk memimpin Angkatan Darat Amerika Serikat di Timur Jauh. Kami sangat akrab dengan MacArthur karena selama masa pensiunnya ia telah bertindak sebagai penasihat militer di sini selama beberapa tahun, dan penunjukan serta pengaktifan kembali MacArthur ke dinas reguler merupakan tanda pasti bahwa [USA.GetNameDef] serius dengan tanggung jawab mereka terhadap pertahanan kami.\n\nSetibanya di Manila, ia segera mulai mengamankan sumber daya dari [USA.GetNameDef], dan ia sendiri bersumpah untuk mendampingi rakyat Filipina yang pemberani melawan serangan apa pun, dan sampai akhir."
SEA_PHI_political_events.21.a: "Selamat datang di Filipina, Jenderal!"
SEA_PHI_political_events.30.t: "Eisenhower Diminta Oleh Filipina" ## Event to USA - Eisenhower going to PHI
SEA_PHI_political_events.30.desc: "Panglima Tertinggi Angkatan Darat Amerika Serikat di Timur Jauh, Douglas MacArthur telah meminta jasa anak didiknya, Dwight D. Eisenhower. Eisenhower telah bertugas di bawah MacArthur ketika MacArthur menjabat sebagai Panglima Angkatan Darat, dan jelas jenderal senior tersebut telah melihat potensinya. Kami sendiri melihat Eisenhower sebagai bintang yang sedang naik daun di Angkatan Darat Amerika Serikat, dan berada dalam komando yang aktif dan berkembang dapat memberinya banyak pengalaman.\n\nEisenhower sendiri telah menekankan bahwa dia tidak melihat ini sebagai penunjukan jangka panjang, dan bermaksud untuk kembali ke Amerika Serikat dalam dua tahun setelah dia belajar semua yang dia bisa dari MacArthur dan menjadi petugas staf aktif."
SEA_PHI_political_events.30.a: "MacArthur dan Eisenhower bekerja sama? Sangat!"
SEA_PHI_political_events.30.b: "Tidak, Eisenhower lebih penting untuk digunakan di sini." #PHI needs a no explainer
SEA_PHI_political_events.31.t: "Dwight D. Eisenhower Tiba di Filipina" ## Event to PHI - Eisenhower has arrived
SEA_PHI_political_events.31.desc: "Permintaan Jenderal MacArthur agar Dwight D. Eisenhower bergabung dengan kami di Filipina telah disetujui! Kami beruntung memiliki bintang baru yang bergabung dengan kami, dan ini merupakan bukti lebih lanjut betapa berdedikasinya Amerika Serikat terhadap perlindungan kami. Telah dijelaskan kepada kami bahwa ini adalah penugasan jangka pendek sekitar dua tahun, namun, mungkin ada cara untuk memberi insentif agar dia tetap tinggal di Filipina."
SEA_PHI_political_events.31.a: "Selamat datang di Filipina!"
SEA_PHI_political_events.40.t: "Manuel Quezon Dibunuh!" ## Assassination of Quezon
SEA_PHI_political_events.40.desc: "Manuel Quezon dibunuh hari ini pukul 15.00 saat memberikan pidato kepada pendukungnya di Luneta Park. Pelaku penembakan masih buron, namun diduga ada kaitannya dengan gerakan Sakdalista. Sementara itu, Majelis Nasional ditutup karena alasan keamanan nasional. Kepolisian telah mulai berlaku di Manila, dan jalan-jalan telah dibersihkan. Keheningan yang tidak nyaman telah menyelimuti negeri ini, nafas kolektif yang tertahan untuk menghadapi apa pun yang mungkin terjadi selanjutnya."
SEA_PHI_political_events.40.a: "Obor demokrasi padam!"
SEA_PHI_political_events.40.b: "Kepala Polisi Eisenhower akan turun tangan!"
PHI_eisenhower_steps_in_tt: "§GEisenhower akan berusaha menggagalkan rencana Fasis§!"
SEA_PHI_political_events.41.t: "Orang buangan Sakdalista Kembali" ## Assassination of Quezon
SEA_PHI_political_events.41.desc: "Artemio Ricarte, yang kembali dari pengasingan dengan kader pengikutnya yang dipersenjatai dengan berbagai senjata Jepang, mengklaim telah menemukan dan menangkap pembunuh Manuel Quezon, dan sekarang berjanji untuk bekerja sama dengan kepolisian untuk menjaga ketertiban selama krisis yang disebabkan oleh pembunuhan presiden. Karena adanya kecurigaan terhadap gerakan Sakdalis, ia berjanji untuk bekerja sama dengan partai Ganap untuk mendapatkan legitimasi, dan dengan demikian mempercepat kemerdekaan dari Amerika Serikat secepat mungkin. Sebagai tanggapan, Constabulary telah menarik diri dari Manila, seolah-olah tidak ingin meningkatkan ketegangan, sementara garnisun Amerika telah ditempatkan dalam siaga tinggi, meskipun belum mengambil tindakan apa pun."
SEA_PHI_political_events.41.a: "Kemerdekaan semakin dekat."
#Artemio Ricarte, returning from exile with a cadre of followers armed with a variety of Japanese arms have claimed to have found and apprehended the assassin, and are now promising to work together with the constabulary in order to retain order during the crisis caused by the murder of the president. In the mean time, the National Assembly has been closed for reasons of national security."
SEA_PHI_political_events.42.t: "Perebutan Kepemimpinan" #Fascist Choose New Leader Aguinaldo, Ricarte or Laurel
SEA_PHI_political_events.42.desc: "Kini setelah kendali atas Filipina telah dilaksanakan dan stabilitas mulai kembali, inilah waktunya bagi Komisi Eksekutif untuk berkumpul dan menentukan di mana kewenangan akhir berada di negara tersebut. Ada tiga kandidat yang bisa dipilih.\n\nEmilio Aguinaldo, pahlawan revolusi melawan Spanyol, adalah pendukung lama kemerdekaan Filipina dan telah menyatakan bahwa di bawah Amerika Serikat, rakyat Filipina hanyalah pasar konsumen bagi ekspor Amerika, atau bahkan paria karena orang Filipina bahkan tidak dianggap sebagai warga negara Amerika.\n\nArtemio Ricarte, panglima Angkatan Darat Filipina selama perang melawan Spanyol dan Amerika Serikat, kemudian diasingkan karena penolakannya untuk bersumpah setia kepada penjajah Amerika. Kecintaannya pada negara tidak pernah pudar, dan bahkan saat tinggal di Jepang, dia berupaya mewujudkan kemerdekaan negara kita.\n\nJosé Laurel, pilihan yang lebih moderat, Hakim Agung ini berpendidikan internasional dan memiliki hubungan kekeluargaan dengan para pejabat Jepang, sehingga mempunyai posisi yang baik untuk membangun hubungan antara Filipina dan Jepang, dan dengan demikian mengembangkan argumen kita untuk kemerdekaan."
SEA_PHI_political_events.42.a: "Aguinaldo telah membawa kita menuju kemerdekaan sebelumnya."
SEA_PHI_political_events.42.b: "Ricarte memiliki dedikasi yang tiada henti terhadap tujuan yang kita butuhkan."
SEA_PHI_political_events.42.c: "Laurel punya koneksinya."
PHI_laurel_help: "§YJosé Laurel§! akan meningkatkan peluang mendapatkan dukungan Jepang dalam §YJaminan Jepang yang Aman§!"
SEA_PHI_political_events.43.t: "Pengepungan Majelis Nasional" #Eisenhower Steps In, Calls in MacArthur
SEA_PHI_political_events.43.desc: "Artemio Ricarte, yang kembali dari pengasingan dengan kader pengikutnya yang bersenjatakan berbagai senjata Jepang mengaku telah menemukan dan menangkap pembunuh Manuel Quezon, namun Kepala Polisi Eisenhower membantah klaim tersebut, dan menyatakan bahwa pria tersebut adalah seorang petani miskin yang dibayar untuk menjadi kambing hitam.\n\nSebagai tanggapan, kelompok tersebut kemudian bergerak menuju Majelis Nasional dengan tekad untuk menegakkan keadilan, dan menyerbu gedung tersebut. Tembakan dilepaskan ke pintu masuk, dan dua orang yang berada di dekatnya terkena tembakan. Para penjaga yang disponsori Amerika disalahkan, dan Eisenhower terpaksa menarik pasukan kepolisian dari daerah tersebut karena takut meningkatkan ketegangan.\n\nTerlepas dari upayanya, massa yang terbentuk, yang dihasut oleh pemberontak Sakdalista yang datang dari daerah sekitar, mengancam akan membuat polisi kewalahan. Dalam keputusasaannya, Eisenhower telah mengirimkan pesan penting ke [MessageToMac]garnisun Amerika untuk meminta bantuan."
SEA_PHI_political_events.43.a: "Sekarang terserah [MacOrGarrison]."
PHI_message_to_mac: "Jenderal Douglas MacArthur dari"
PHI_macarthur: "MacArthur"
PHI_american_garrison: "garnisun Amerika"
SEA_PHI_political_events.44.t: "Darurat Militer" #MacArthur announces military emergency
SEA_PHI_political_events.44.desc: "Ketika hal ini terjadi, reaksi dari [MacOrGarrison] sangat tiba-tiba dan luar biasa. Tanpa mau mengambil risiko, seluruh Divisi Filipina dikerahkan ke Manila, kavaleri menyerang terlebih dahulu, diikuti segera oleh infanteri dengan bayonet terpasang. Jika terdapat perlawanan yang lebih keras kepala, gas air mata digunakan untuk menghilangkan perlawanan. Terkejut dengan kekuatan yang sangat besar, milisi Sakdalista terpaksa meninggalkan barikade mereka dan keluar dari kota.\n\nMeskipun ancaman awal kudeta fasis telah digagalkan, masih ada bahaya eskalasi yang lebih luas menjadi perang saudara, dan oleh karena itu [MacOrEisenhower] merasa perlu untuk mengumumkan keadaan darurat militer, memberlakukan darurat militer, dan mengambil alih kekuasaan diktator untuk memastikan pemerintahan yang stabil dan berkelanjutan."
SEA_PHI_political_events.44.a: "Semua atas nama kebebasan dan demokrasi!"
PHI_eisenhower: "Eisenhower"
PHI_declare_military_emergency_tt: "Hal ini telah membuka cabang fokus baru di paling kiri."
