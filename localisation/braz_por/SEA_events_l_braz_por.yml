 SEA_imperial_influence_events.1.t: "Perebutan Kekuasaan Internal Meletus"
 SEA_imperial_influence_events.1.desc: "Perebutan kekuasaan yang sengit telah terjadi di antara berbagai faksi internal dalam [ROOT.GetNameDef], semuanya bersaing untuk mendapatkan perhatian [GetImperialInfluenceRulerTitle], mencoba mempengaruhi [GetImperialInfluenceGenderHimHer] untuk mendukung tujuan mereka. Pertanyaan yang ada di benak setiap orang adalah; faksi mana yang pada akhirnya akan disukai oleh [GetImperialInfluenceRulerTitle], dan faksi mana yang akan [GetImperialInfluenceGenderHeShe] abaikan?"
 SEA_imperial_influence_events.1.a: "Bubarkan Fraksi Angkatan Darat"
