SEA_PHI_political_events.45.t: "[FROM.GetName] Meminta Dukungan untuk Kemerdekaan"
SEA_PHI_political_events.45.desc: "Pemerintah [FROM.GetAdjective] telah menghubungi kami dengan rencana perjuangan kemerdekaan melawan [USA.GetNameDef]. Rencana ini belum dilaksanakan, namun mereka meminta agar ketika [PHI.GetNameDef] menuntut kemerdekaan, kami akan mendukung tuntutan mereka, dan bergabung dalam perjuangan mereka jika permintaan tersebut ditolak."
SEA_PHI_political_events.45.a: "Itu akan memperluas pengaruh kami"
SEA_PHI_political_events.45.b: "Kita tidak bisa mengambil risiko perang dengan [USA.GetNonIdeologyName]"
SEA_PHI_political_events.46.t: "[FROM.GetName] Mendukung Rencana Kemerdekaan kami"
SEA_PHI_political_events.46.desc: "Kami telah menerima pesan dari pemerintah [FROM.GetAdjective] yang menyatakan bahwa mereka bersedia mendukung tuntutan kemerdekaan kami. Meskipun hal itu saja sudah membantu meyakinkan [ROOT.overlord.GetNameDef], [FROM.GetNameDef] juga berjanji akan mendukung kami secara militer jika mereka mencoba membatalkan langkah apa pun menuju kemerdekaan."
SEA_PHI_political_events.46.a: "Luar biasa!"
SEA_PHI_political_events.47.t: "[FROM.GetName] Menolak Mendukung Rencana Kemerdekaan"
SEA_PHI_political_events.47.desc: "Para diplomat kami yang dikirim ke [FROM.GetNameDef] segera kembali setelah pemerintah mereka menolak menjanjikan bantuan untuk langkah kami menuju kemerdekaan. Meskipun mereka mengaku ingin membantu kami, mereka tidak mau mengambil risiko terlibat dalam perang dengan [ROOT.overlord.GetNameDef]."
SEA_PHI_political_events.47.desc.2: "Para diplomat kami yang dikirim ke [FROM.GetNameDef] segera kembali setelah pemerintah mereka menolak menjanjikan bantuan untuk langkah kami menuju kemerdekaan. Tampaknya mereka lebih tertarik untuk menjadi penguasa baru kita daripada membantu kita menjadi mandiri."
SEA_PHI_political_events.47.a: "Tampaknya retorika mereka tentang dekolonisasi hanyalah sekedar omongan belaka"
SEA_PHI_political_events.48.t: "[FROM.GetName] Menyatakan Kemerdekaan"
SEA_PHI_political_events.48.desc: "Sebelumnya hari ini kami menerima laporan ketidakberesan di [FROM.GetNameDef]. Setelah itu, kami kini telah menerima deklarasi kemerdekaan dari pemerintah mereka, meskipun mereka jelas-jelas berusaha meyakinkan kami untuk tidak melakukan intervensi, mereka telah menyatakan dengan jelas bahwa mereka tidak akan menghindar dari perjuangan untuk mempertahankan kemerdekaan yang baru mereka peroleh."
SEA_PHI_political_events.48.desc.2: "Sebelumnya hari ini kami menerima laporan ketidakberesan di [FROM.GetNameDef]. Setelah itu, kami kini menerima deklarasi kemerdekaan dari pemerintah mereka, dengan pernyataan dukungan yang jelas dari pemerintah [JAP.GetAdjective]. Meskipun pernyataan tersebut meminta kami untuk tidak melakukan intervensi, pemerintah [FROM.GetAdjective] telah menegaskan bahwa mereka tidak akan menghindar dari perjuangan untuk mempertahankan kemerdekaan yang baru mereka peroleh, dan dengan dukungan [JAP.GetAdjective]."
SEA_PHI_political_events.48.desc.3: "Sebelumnya hari ini kami menerima laporan ketidakberesan di [FROM.GetNameDef]. Setelah itu, kami kini menerima deklarasi kemerdekaan dari pemerintah mereka, dengan pernyataan dukungan yang jelas dari beberapa pemerintah di Amerika Selatan. Meskipun pernyataan tersebut meminta kami untuk tidak melakukan intervensi, pemerintah [FROM.GetAdjective] telah menegaskan bahwa mereka tidak akan menghindari pertempuran untuk mempertahankan kemerdekaan yang baru mereka peroleh, dan dengan dukungan Amerika Selatan."
SEA_PHI_political_events.48.desc.4: "Sebelumnya hari ini kami menerima laporan ketidakberesan di [FROM.GetNameDef]. Setelah itu, kami kini telah menerima deklarasi kemerdekaan dari pemerintah mereka, dengan pernyataan dukungan yang jelas dari pemerintah [SPR.GetAdjective]. Meskipun pernyataan tersebut meminta kami untuk tidak melakukan intervensi, pemerintah [FROM.GetAdjective] telah menegaskan bahwa mereka tidak akan menghindar dari perjuangan untuk mempertahankan kemerdekaan yang baru mereka peroleh, dan dengan dukungan [SPR.GetAdjective]."
SEA_PHI_political_events.48.desc.5: "Sebelumnya hari ini kami menerima laporan ketidakberesan di [FROM.GetNameDef]. Setelah itu, kami kini telah menerima deklarasi kemerdekaan dari pemerintah mereka, dengan pernyataan dukungan yang jelas dari [SPR.GetAdjective] dan beberapa pemerintah Amerika Selatan. Meskipun pernyataan tersebut meminta kami untuk tidak melakukan intervensi, pemerintah [FROM.GetAdjective] telah menegaskan bahwa mereka tidak akan menghindari pertempuran untuk mempertahankan kemerdekaan yang baru mereka peroleh, dan dengan dukungan dari sekutu Hispaniknya."
SEA_PHI_political_events.48.a: "Kami tetap akan memberikannya kepada mereka"
SEA_PHI_political_events.48.b: "Mereka belum siap"
SEA_PHI_political_events.49.t: "[FROM.GetName] Memungkinkan Kemerdekaan"
SEA_PHI_political_events.49.desc: "Setelah tidak menanggapi deklarasi kemerdekaan kami selama beberapa hari yang diduga merupakan diskusi panas di antara para pemimpin [FROM.GetAdjective], [FROM.GetNameDef] secara resmi telah mengumumkan bahwa mereka akan mengakui kemerdekaan [ROOT.GetAdjective]."
SEA_PHI_political_events.49.a: "Berita bagus!"
SEA_PHI_political_events.50.t: "[FROM.GetName] Berjuang untuk Mendapatkan Kembali Kendali atas Kita"
SEA_PHI_political_events.50.desc: "Menanggapi deklarasi kemerdekaan kami, [FROM.GetNameDef] belum memberikan jawaban resmi dan mulai memindahkan pasukan ke pangkalan terdekat untuk melakukan intervensi."
SEA_PHI_political_events.50.a: "Biarkan mereka mencoba!"
SEA_PHI_political_events.51.t: "$USA_douglas_macarthur$ Dipanggil kembali ke [USA.GetNameDef]"
SEA_PHI_political_events.51.desc: "Situasi militer di [USA.GetNameDef] terbukti cukup buruk sehingga $USA_douglas_macarthur$ telah diminta untuk segera pulang."
SEA_PHI_political_events.51.a: "Dia akan dirindukan"
SEA_PHI_political_events.52.t: "$USA_dwight_d_eisenhower$ Dipanggil ke [USA.GetNameDef]"
SEA_PHI_political_events.52.desc: "Situasi militer di [USA.GetNameDef] terbukti cukup buruk sehingga $USA_dwight_d_eisenhower$ telah diminta untuk segera pulang."
SEA_PHI_political_events.53.t: "$USA_dwight_d_eisenhower$ Kembali dari [PHI.GetName]"
SEA_PHI_political_events.53.desc: "Setelah bergabung dalam misi $USA_douglas_macarthur$ ke [PHI.GetNameDef], dan berperan di dalamnya sejak tahun 1935 dan baru-baru ini menjadi lebih aktif, $USA_dwight_d_eisenhower$ kini telah kembali ke negaranya. Selama misi tersebut, ia memperoleh pengalaman militer yang berharga, termasuk pengalaman pertamanya mengemudikan pesawat terbang dan bekerja dengan komandan seperti $USA_douglas_macarthur$ dengan gagasan yang berbeda secara mendasar tentang reformasi angkatan bersenjata [PHI.GetAdjective]."
SEA_PHI_political_events.53.a: "Pengalamannya pasti akan berguna"
SEA_PHI_political_events.54.desc: "Dengan hilangnya wilayah Manila baru-baru ini, pasukan kita kehilangan kepercayaan untuk memenangkan perang dengan taktik tradisional. Ketika tentara secara resmi menyerah dan pemerintah kita melakukan evakuasi, organisasi-organisasi baru untuk melawan musuh telah dibentuk."
SEA_PHI_political_events.54.a: "Kita bisa melanjutkan perang dengan pasukan gerilya"
SEA_PHI_political_events.55.t: "$PHI_treaty_of_manila$"
SEA_PHI_political_events.55.desc: "Setelah persiapan ekonomi dan politik yang signifikan, [PHI.GetNameDef] telah mendeklarasikan kemerdekaan. Hal ini diperkirakan terjadi setelah undang-undang Tydings-McDuffie yang ditandatangani Kongres pada tahun 1934, yang menetapkan arah menuju kemerdekaan [PHI.GetAdjective]. [PHI.GetNameDefCap] kini bebas membuat kebijakan politik dan ekonominya sendiri tanpa tekanan dari [USA.GetNameDef]."
SEA_PHI_political_events.55.a: "Bagus untuk mereka"
SEA_PHI_political_events.55.b: "Sekarang kita bisa bekerja sama secara setara"
SEA_PHI_political_events.55.c: "Kita sekarang juga harus mengupayakan independensi diplomatik"
SEA_PHI_political_events.56.t: "[FROM.GetName] Meminta Kontrol atas Angkatan Laut Pasifik"
SEA_PHI_political_events.56.desc: "Dalam upaya untuk membentuk angkatan laut dan berkontribusi lebih jauh terhadap upaya militer kami, [FROM.GetNameDef] telah meminta agar kami memindahkan satu atau lebih gugus tugas yang beroperasi di dekat kendali mereka."
SEA_PHI_political_events.56.a: "Kita bisa mengatur angkatan laut kita sendiri"
SEA_PHI_political_events.56.b: "Biarkan mereka memiliki gugus tugas lokal"
SEA_PHI_political_events.56.c: "Biarkan mereka menangani Samudera Pasifik"
SEA_PHI_political_events.56.d: "Biarkan mereka menangani Samudera Pasifik tetapi kirimkan seorang supervisor"
SEA_PHI_political_events.56.e: "Biarkan mereka menangani Samudera Pasifik dan memasok bahan bakar"
PHI_transfer_20_percent_navy_tt: "Transfer 20% pasukan angkatan laut kami ke [FROM.GetNameDef]."
PHI_transfer_40_percent_navy_tt: "Transfer 40% pasukan angkatan laut kami ke [FROM.GetNameDef]."
SEA_PHI_political_events.57.t: "Dipercayakan pada Angkatan Laut"
SEA_PHI_political_events.57.desc: "Permintaan kami untuk menguasai pasukan angkatan laut [FROM.GetAdjective] lokal telah disetujui oleh pemerintah mereka. Gugus tugas telah diperintahkan ke pelabuhan kami sambil menunggu reorganisasi."
SEA_PHI_political_events.57.desc.2: "$SEA_PHI_political_events.57.desc$ Selain itu, ladang minyak di [371.GetName] kini siap memproduksi bahan bakar bagi pasukan kami untuk mendukung logistik mereka setelah akuisisi besar ini."
SEA_PHI_political_events.57.a: "Ini merupakan peningkatan besar bagi kemampuan militer kita"
SEA_PHI_political_events.58.t: "[FROM.GetName] Menolak Mendelegasikan Angkatan Laut"
SEA_PHI_political_events.58.desc: "Sayangnya sekutu [FROM.GetAdjective] kami telah menolak permintaan kami untuk mendelegasikan sebagian angkatan laut mereka ke militer kami. Tampaknya kita harus meningkatkan produksi galangan kapal jika ingin berkontribusi pada teater angkatan laut."
SEA_PHI_political_events.58.a: "Kita harus fokus membangun angkatan laut kita sendiri"
SEA_PHI_political_events.59.t: "Kegagalan Intervensi [USA.GetAdjective]"
SEA_PHI_political_events.59.desc: "Meskipun [USA.GetNameDef] melancarkan intervensi militer terhadap [PHI.GetNameDef] untuk menggulingkan pemerintahan barunya, rencana ini belum terbukti berhasil. Ketika kedua belah pihak menyadari bahwa perang masih terus berlanjut, negosiasi telah mulai mengakhirinya, dan [PHI.GetAdjective] kemerdekaan kini diakui."
SEA_PHI_political_events.59.a: "Kebebasan menang"
SEA_PHI_political_events.59.b: "Perang menjadi tidak populer"
SEA_PHI_political_events.60.t: "Aguinaldo Mempertanyakan Hasil Pemilu"
SEA_PHI_political_events.60.desc: "Setelah pemilu presiden tahun 1935, [ROOT.GetNeutralLeader] masih belum menerima kekalahan signifikannya, dan mengajukan permasalahan ini ke dewan yang bertanggung jawab atas pemilu. Jika ditemukan bukti adanya campur tangan, partai tersebut kemungkinan akan membawa masalah tersebut ke salah satu pengadilan tertinggi di negara tersebut."
SEA_PHI_political_events.60.a: "Mungkin hanya pecundang"
SEA_PHI_political_events.61.t: "Peradilan Membatalkan Pemilu"
SEA_PHI_political_events.61.desc: "Setelah melakukan penyelidikan mendalam, dewan yang bertugas menyelidiki hasil pemilu 1935 mengaku menemukan bukti adanya kejanggalan. Hal ini tidak akan menjadi hal yang penting jika bukan karena tindakan pengadilan yang mendiskualifikasi [ROOT.GetDemocraticParty], sehingga menghasilkan kemenangan [ROOT.GetNeutralParty]. Upaya [USA.GetAdjective] untuk segera mengabaikan proses tersebut malah menjadi bumerang karena dianggap sebagai bukti korupsi lebih lanjut."
SEA_PHI_political_events.61.a: "Mereka tahu apa yang terbaik untuk negaranya"
SEA_PHI_political_events.62.t: "Relawan Perang Saudara Spanyol?"
SEA_PHI_political_events.62.desc: "Hubungan historis dan budaya kami dengan [SPR.GetNonIdeologyName] membuat konflik di sana diawasi dengan ketat oleh masyarakat kami."
SEA_PHI_political_events.62.a: "Kaum Nasionalis memperjuangkan nilai-nilai Katolik kita"
SEA_PHI_political_events.62.b: "Partai Republik memperjuangkan kebebasan dan kebebasan"
SEA_PHI_political_events.63.t: "[GetYear] Pemilihan Presiden"
SEA_PHI_political_events.63.desc: "Masa jabatan presiden petahana [ROOT.GetLeader] akan segera berakhir dan pemilihan presiden berikutnya akan segera diadakan. Meskipun keberhasilan kepemimpinan [ROOT.GetLeader] memberikan gambaran yang menjanjikan tentang kemungkinan kelanjutan kepemimpinannya, beberapa pemilih mencari arah baru untuk reformasi kita dan presiden baru untuk memandu mereka."
SEA_PHI_political_events.63.keep_leader: "[ROOT.GetLeader] harus tetap ada untuk periode berikutnya"
SEA_PHI_political_events.63.roxas: "Koneksi $PHI_manuel_roxas$ akan membantu reformasi ekonomi"
SEA_PHI_political_events.63.laurel: "$PHI_jose_laurel$ akan menjadi pemimpin yang baik di masa penuh gejolak ini"
SEA_PHI_political_events.64.t: "Kematian $PHI_manuel_luis_quezon$"
SEA_PHI_political_events.64.desc_quezon: "Setelah mengidap tuberkulosis, penurunan bertahap kesehatan $PHI_manuel_luis_quezon$ kini menyebabkan kematiannya. Wakil presiden untuk sementara waktu mengambil alih tugas-tugas Quezon sementara bangsa ini berduka, namun segera tiba waktunya untuk menentukan penggantinya."
SEA_PHI_political_events.64.desc_generic: "Masa jabatan [ROOT.GetLeader] saat ini telah berakhir dan pemilihan presiden baru kini akan menentukan presiden kita berikutnya. Karena kesehatannya yang memburuk, $PHI_manuel_luis_quezon$ telah mengundurkan diri dari perlombaan."
SEA_PHI_political_events.64.osmena: "$PHI_sergio_osmena$ akan menjaga kapal tetap stabil"
SEA_PHI_political_events.65.t: "Dwight D. Eisenhower Tetap di [USA.GetName]"
SEA_PHI_political_events.65.desc: "Sayangnya, permintaan kami untuk memperkuat misi militer [USA.GetAdjective] di [ROOT.GetNameDef] telah ditolak. Rencana militer lainnya [USA.GetNameDef] tampaknya memerlukan keahliannya."
SEA_PHI_political_events.65.a: "Sayang sekali"
SEA_PHI_political_events.66.t: "[FROM.GetName] Mengusulkan Perjanjian Saling Membantu"
SEA_PHI_political_events.66.desc: "Sebagai negara lain yang berada dalam lingkup pengaruh [USA.GetAdjective], [FROM.GetNameDef] kini berupaya meningkatkan kerja sama dalam lingkup ini dengan menciptakan aliansi negara-negara Hispanik. Hal ini mungkin dapat menjadi penyeimbang terhadap tekanan [USA.GetAdjective] yang terkadang mendekati imperialisme."
SEA_PHI_political_events.66.a: "Hal ini akan memberikan stabilitas di kawasan"
SEA_PHI_political_events.66.b: "Kami tidak dapat mengasingkan [USA.GetNameDef]"
SEA_PHI_political_events.67.t: "[FROM.GetName] Menandatangani Perjanjian Saling Membantu"
SEA_PHI_political_events.67.desc: "[FROM.GetNameDefCap] telah menandatangani usulan perjanjian bantuan timbal balik kami, yang menguraikan aliansi bersyarat yang kini akan mulai berlaku. Ini adalah langkah awal yang jelas dalam memperkuat kerja sama [FROM.GetAdjective]-[ROOT.GetAdjective]."
SEA_PHI_political_events.67.a: "Berita bagus"
PHI_will_join_faction_later_tt: "§Y[ROOT.GetNameDefCap]§! akan bergabung dengan §Yfaksi [FROM.GetNameDef]§! setelah selesai §Y$PHI_war_of_independence$§!"
PHI_will_join_faction_later_PHI_tt: "§Y[FROM.GetNameDefCap]§! akan bergabung dengan §Yfaksi [ROOT.GetNameDef]§! setelah selesai §Y$PHI_war_of_independence$§!"
SEA_PHI_political_events.68.t: "[FROM.GetName] Tidak Menandatangani Perjanjian Saling Membantu"
SEA_PHI_political_events.68.desc: "Perbedaan ideologi atau mungkin kekhawatiran akan pengucilan [USA.GetNameDef] telah menyebabkan [FROM.GetNameDef] tidak menandatangani perjanjian bantuan timbal balik yang kami usulkan, sepertinya kita harus mencari sekutu di tempat lain."
SEA_PHI_political_events.68.a: "Mungkin pesaing mereka di kawasan ini akan lebih bersedia"
SEA_PHI_political_events.69.t: "[FROM.GetName] Mengusulkan Unifikasi"
SEA_PHI_political_events.69.desc: "Sejak memperoleh kemerdekaan, [FROM.GetNameDef] telah mengambil banyak langkah untuk mengkonsolidasikan kemerdekaannya, dan kini ingin memperluas kerja samanya dengan negara-negara Hispanik lainnya. Hal ini sekarang menunjukkan dirinya sebagai sebuah proposal untuk menyatukan negara kita dengan negara mereka dalam sebuah Kekaisaran Hispanik."
SEA_PHI_political_events.69.a: "Bersama-sama kita bisa membalas penjajahan kita"
SEA_PHI_political_events.69.b: "Kami tidak akan diperintah dari [FROM.capital.GetCapitalVictoryPointName]"
SEA_PHI_political_events.70.t: "[FROM.GetName] Menerima Unifikasi"
SEA_PHI_political_events.70.desc: "Gelombang perwakilan [FROM.GetAdjective] yang mengunjungi [ROOT.capital.GetCapitalVictoryPointName] memperjelas apa yang dikonfirmasi beberapa hari kemudian: [FROM.GetNameDef] telah menerima permintaan kami untuk bersatu dengan [ROOT.GetNameDef]."
SEA_PHI_political_events.70.a: "Berita bagus!"
SEA_PHI_political_events.71.t: "[FROM.GetName] Menolak Unifikasi"
SEA_PHI_political_events.71.desc: "[FROM.GetNameDefCap] telah memutuskan untuk tidak menyetujui proposal kami untuk menyatukan. Meskipun mereka menyampaikan bahwa mereka menganggap aliansi kita berharga, mereka juga menganggap ini sebagai langkah yang terlalu jauh."
SEA_PHI_political_events.71.a: "Maka mungkin perbedaan kita lebih besar dari yang kita duga"
SEA_PHI_political_events.71.b: "Kita harus bersikeras"
