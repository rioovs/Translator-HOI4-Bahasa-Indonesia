#SEA_generic_events.1 is hidden
SEA_generic_events.2.t: "[GetOppositionPartyName] Menyelenggarakan Teguran"
SEA_generic_events.2.desc: "[GetOppositionPartyAdjective] buruh di pabrik lokal sempat menghentikan produksi mereka untuk memprotes kondisi kerja yang lebih baik dan kebebasan politik yang lebih besar. Meskipun dalam skala terbatas, teguran tersebut menunjukkan popularitas [GetOppositionPartyName]."
SEA_generic_events.2.a: "Mereka akan diganti"
SEA_generic_events.2.b: "Intervensi hanya akan menimbulkan lebih banyak masalah"
SEA_generic_events.3.t: "[GetOppositionPartySupportersName] Memprotes Pemerintahan yang Lemah"
SEA_generic_events.3.desc: "Pendukung [GetOppositionPartyName] dilaporkan mengadakan demonstrasi di ibu kota, mereka mengkritik inefisiensi pemerintah dan tampaknya mendukung pemerintahan yang lebih terpusat."
SEA_generic_events.3.a: "Mereka beruntung mempunyai hak tersebut"
#SEA_generic_events.3.b: ""
SEA_generic_events.4.t: "[GetOppositionPartySupportersName] Mengganggu Rapat Pemerintah"
SEA_generic_events.4.desc: "Sekelompok kecil pendukung [GetOppositionPartyName] baru-baru ini mengganggu pertemuan pemerintah dengan protes kecil namun keras. Meski tidak berbahaya, meningkatnya prevalensi insiden serupa menunjukkan dukungan terhadap gerakan oposisi."
SEA_generic_events.4.a: "Kecam tindakan mereka"
SEA_generic_events.4.b: "Tutup acara tersebut"
SEA_generic_events.5.t: "[GetOppositionPartyName] Mengadakan Reli"
SEA_generic_events.5.desc: "[GetOppositionPartyName] hari ini mengadakan salah satu demonstrasi terbesarnya baru-baru ini, berjanji untuk menawarkan alternatif yang kuat terhadap pemerintahan [ROOT.GetLeader]. Pemerintah saat ini tidak yakin apakah sebaiknya mengabaikan unjuk rasa tersebut, atau mencegah berita mengenai unjuk rasa tersebut menyebar karena dapat menarik pendukung baru untuk gerakan [GetOppositionPartyAdjective]."
SEA_generic_events.5.a: "Pastikan berita tidak meliputnya"
SEA_generic_events.5.b: "Bagus untuk mereka"
SEA_generic_events.6.t: "Skema Pemerintah untuk Melemahkan [GetOppositionPartyName] Terungkap"
SEA_generic_events.6.desc: "Skandal yang melibatkan pejabat pemerintah yang berpihak pada [ROOT.GetRulingParty] terungkap setelah sebuah dokumen ditemukan yang menguraikan rencana mereka untuk melemahkan [GetOppositionPartyName] dengan menyabotase pendanaan mereka. Meskipun para pejabat tersebut bertindak secara independen, hal tersebut bukanlah sesuatu yang mungkin diyakini oleh [GetOppositionPartySupportersName]."
SEA_generic_events.6.a: "Minta maaf secara terbuka"
SEA_generic_events.6.b: "Kami akan menjauhkan diri dari skema ini"
SEA_generic_events.7.t: "[GetOppositionPartyName] Menyelenggarakan Reli Besar"
SEA_generic_events.7.desc: "Partai [GetOppositionPartyAdjective] mengadakan rapat umum hari ini, dan ada laporan yang memperkirakan jumlah kehadiran akan sama besarnya dengan rapat umum [ROOT.GetRulingParty]. Kami hanya bisa berharap para pendukung kami tidak bisa menyampaikan kekhawatiran mereka."
SEA_generic_events.7.a: "Mari kita atur organisasi kita sendiri berdasarkan keprihatinan mereka"
#SEA_generic_events.7.b: ""
SEA_generic_events.8.t: "[GetOppositionPartySupportersName] Terlibat dalam Bentrokan Jalanan"
SEA_generic_events.8.desc: "Popularitas [GetOppositionPartyName] menyebabkan masalah hari ini karena sekelompok pendukungnya bentrok dengan pendukung pemerintah dan [ROOT.GetRulingParty], hingga polisi harus turun tangan. Meski bersifat lokal, peristiwa tersebut tetap menunjukkan iklim politik yang tidak kondusif."
SEA_generic_events.8.a: "Kita dapat menggunakan ini untuk mengecam [GetOppositionPartyName]"
SEA_generic_events.8.b: "Fokus pada mengecam kekerasan"
SEA_generic_events.9.t: "Agen Asing Mengeksploitasi Popularitas [GetOppositionPartyAdjective]"
SEA_generic_events.9.desc: "Setelah adanya laporan kerusuhan baru-baru ini, tentara dan polisi secara independen menyimpulkan bahwa anggota [GetOppositionPartyName] dipengaruhi oleh negara lain yang berupaya melemahkan atau memata-matai pemerintah kita."
SEA_generic_events.9.a: "Mengecam secara publik [GetOppositionPartyName] sebagai agen asing"
SEA_generic_events.9.b: "Fokus pada membasmi penyusup"
SEA_generic_events.10.t: "Skandal Korupsi Pemerintah"
SEA_generic_events.10.desc: "Meningkatnya popularitas gerakan oposisi seperti [GetOppositionPartyName] telah menyebabkan pemerintah mengambil langkah-langkah yang semakin kreatif untuk tetap berkuasa. Salah satu skema tersebut baru-baru ini terungkap dan besarnya sumber daya yang dikerahkan untuk mempertahankan kekuasaan [ROOT.GetRulingParty] telah menimbulkan reaksi keras."
SEA_generic_events.10.a: "Kami akan menyangkal semuanya"
SEA_generic_events.10.b: "Jauhkan diri kita dari tokoh-tokoh yang terlibat"
SEA_generic_events.11.t: "[GetOppositionPartyAdjective] Pekerja Docker Melakukan Pemogokan"
SEA_generic_events.11.desc: "Para pekerja di industri angkatan laut, yang dukungannya sangat kuat terhadap [GetOppositionPartyName], telah memulai pemogokan besar-besaran yang kini mengganggu upaya pembuatan kapal kami. Meskipun kekhawatiran politik mereka hampir tidak dapat diatasi, kita masih dapat menghindari lebih banyak kerusuhan dengan memperbaiki kondisi kerja mereka."
SEA_generic_events.11.a: "Kami akan memastikan mereka mendapat kompensasi yang adil"
SEA_generic_events.11.b: "Ini akan reda"
SEA_generic_events.12.t: "[GetOppositionPartySupportersName] Menentang Tindakan Pertahanan"
SEA_generic_events.12.desc: "Pendukung [GetOppositionPartyName] dan oposisi lainnya mengadakan protes hari ini yang menuntut kami mengurangi penumpukan militer, karena khawatir pasukan kami yang terus bertambah akan dikerahkan ke luar negeri."
SEA_generic_events.12.desc_wartime: "Pendukung [GetOppositionPartyName] dan partai oposisi lainnya mengadakan protes hari ini yang menuntut kita mengakhiri perang saat ini, karena menganggap pengorbanan tentara kita tidak diperlukan demi kepentingan [ROOT.GetAdjective]."
SEA_generic_events.12.a: "Yakinkan mereka bahwa ini hanya untuk melindungi negara"
SEA_generic_events.12.b: "Yakinkan mereka bahwa kita ingin mencapai perdamaian"
SEA_generic_events.12.c: "Menolak berkomentar"
SEA_generic_events.13.t: "[GetOppositionPartyAdjective] Mendukung Kerusuhan di [root.capital.GetCapitalVictoryPointName]"
SEA_generic_events.13.desc: "Bahkan sebelum polisi sempat memberi tahu kami tentang hal ini, pejabat pemerintah melaporkan bahwa mereka menemukan kerusuhan saat bekerja di [root.capital.GetCapitalVictoryPointName]. Tampaknya apa yang awalnya merupakan demonstrasi politik besar-besaran menentang [ROOT.GetRulingParty] berubah menjadi penjarahan dan menyebabkan kerusakan di seluruh kota."
SEA_generic_events.13.a: "Biarkan politisi terhormat menenangkan massa"
SEA_generic_events.13.b: "Kirim tentara"
SEA_generic_events.14.t: "Protes Besar Anti-Pemerintah"
SEA_generic_events.14.desc: "Popularitas [GetOppositionPartyName] yang sangat besar tanpa memiliki banyak kekuasaan di pemerintahan telah menyebabkan banyak protes besar di seluruh negeri. Memenuhi beberapa tuntutan pengunjuk rasa mungkin dapat meredakan situasi, namun memiliki permasalahan tersendiri."
SEA_generic_events.14.a: "Kami akan memasukkan beberapa proposal [GetOppositionPartyAdjective]"
SEA_generic_events.14.b: "Pastikan protes tetap damai"
SEA_generic_events.15.t: "[GetOppositionPartyAdjective] Protes Berubah Menjadi Kekerasan"
SEA_generic_events.15.desc: "Kami menerima berita bahwa protes massal lokal yang diselenggarakan oleh [GetOppositionPartyName] berubah menjadi berdarah setelah benda-benda yang dilemparkan ke arah polisi menyebabkan tembakan sebagai balasannya. Insiden ini, meskipun bukan kesalahan pemerintah atau [GetOppositionPartySupportersName], menimbulkan kekhawatiran serius terhadap stabilitas negara."
SEA_generic_events.15.a: "Kecam pejabat partai lokal"
SEA_generic_events.15.b: "Salahkan para pengunjuk rasa"
#######################
####### WARLORDS ######
#######################
 SEA_warlords.1.t: "Kematian Liu Xiang"
 SEA_warlords.1.desc: "Dengan meninggalnya Liu Xiang dan semakin besarnya tekanan dari Pemerintah Pusat, semakin jelas bahwa [ROOT.GetNameDef] akan segera dibubarkan. Namun ada pula yang percaya bahwa kematian ini bukanlah suatu kebetulan melainkan pembunuhan, dan ingin melanjutkan perlawanan dengan risiko membuat marah Pemerintah Pusat."
 SEA_warlords.1.a: "[ROOT.GetNameDefCap] telah mencapai tujuannya."
 SEA_warlords.1.b: "Kita harus terus berjuang!"
 SEA_warlords.2.t: "[FROM.GetNameDefCap] Tetap Menentang"
 SEA_warlords.2.desc: "Menyusul meninggalnya Liu Xiang [FROM.GetNameDef] dilanda perebutan kekuasaan yang berujung pada naiknya Yang Sen. Menyusul rumor bahwa Liu Xiang dibunuh oleh pasukan kami, mereka mengambil sikap menjauhkan diri dari pemerintah kami dan menolak integrasi."
 SEA_warlords.2.a: "Jenderal yang kurang ajar itu!"
 SEA_warlords.2.b: "Oh baiklah."
 SEA_warlords.3.t: "[FROM.GetNameDefCap] Menerima Integrasi"
 SEA_warlords.3.desc: "Setelah meninggalnya Liu Xiang [FROM.GetNameDef] dengan cepat dibubarkan dan sekarang berada di bawah otoritas kami. Kita harus menggunakan ini untuk keuntungan kita."
 SEA_warlords.3.a: "Luar biasa."
 SEA_warlords.4.t: "Pemberontakan Kumul Kedua"
 SEA_warlords.4.desc: "Dengan dimulainya gerakan kami melawan Khotan, Yulbars Khan telah mengumumkan dukungannya terhadap Ma Hushan dan menyerukan pemberontakan terhadap pemerintahan kami atas Hami. Dengan ini kita sekarang bertarung di dua front."
 SEA_warlords.4.a: "Kalau begitu kita akan hancurkan mereka juga!"
 SEA_warlords.4.b: "Kita harus memanfaatkan kesempatan ini! Hidup Khan!"
 SEA_warlords.5.t: "Konflik yang Stagnasi"
 SEA_warlords.5.desc: "Dengan meningkatnya tekanan dari Pemerintah Pusat dan berkurangnya semangat pasukan kita, menjadi jelas bahwa kita harus menghentikan pertempuran yang sia-sia dan beralih ke ancaman yang lebih besar yang mengancam Tiongkok. Hari telah berlalu, pasukan Ma Hushan akan terus menduduki bagian selatan provinsi kami."
 SEA_warlords.5.a: "Maka kita akan menunggu waktu kita..."
 SEA_warlords.6.t: "[FROM.GetLeader] Meminta Bantuan"
 SEA_warlords.6.desc: "[FROM.GetLeader] telah meminta bantuan kami dalam memerangi [SIK.GetLeader]. Meskipun kehilangan mereka berarti kita kehilangan pijakan di provinsi ini, penting juga bagi kita untuk tidak membuat marah Soviet karena hal itu berarti kehilangan calon mitra dan penjamin."
 SEA_warlords.6.a: "Kirim sesedikit mungkin untuk menghindari perhatian Soviet"
 SEA_warlords.6.b: "Terkutuklah Soviet, mereka mendapat dukungan penuh dari kita"
 SEA_warlords.6.c: "Kami tidak dapat menyisihkan apa pun"
 SEA_warlords.7.t: "Bantuan Minimal Tiba"
 SEA_warlords.7.desc: "Pemerintah Pusat telah memutuskan untuk memberi kami dukungan minimal dalam upaya untuk tidak membuat marah pemerintah Soviet karena mereka menghargai kemitraan mereka dengan negara ini demi kelangsungan hidup kami."
 SEA_warlords.7.a: "Setidaknya itu sesuatu"
 SEA_warlords.8.t: "Bantuan Tiba"
 SEA_warlords.8.desc: "Pemerintah Pusat telah memutuskan untuk sepenuhnya mendukung upaya kami untuk memastikan Soviet tidak merebut provinsi kami, dan dengan demikian mempertaruhkan hubungan mereka dengan negara."
 SEA_warlords.8.a: "Dengan ini kita bisa membalikkan keadaan!"
 SEA_warlords.9.t: "Tidak Ada Bantuan yang Tiba"
 SEA_warlords.9.desc: "Pemerintah Pusat telah memutuskan untuk tidak memberikan bantuan apa pun kepada kami untuk menyenangkan pemerintah Soviet karena mereka lebih menghargai kemitraan mereka dengan negara ini daripada kelangsungan hidup kami."
 SEA_warlords.9.a: "Pengkhianat sialan itu"
 SEA_warlords.10.t: "$KUM_yulbars_khan$ Tiba di Khotan"
 SEA_warlords.10.desc: "Setelah jatuhnya Kumul Khanate, $KUM_yulbars_khan$ berhasil lolos dari penangkapan dan melarikan diri ke kami untuk melanjutkan perjuangan melawan musuh bersama. Kita harus menyambutnya dengan tangan terbuka."
 SEA_warlords.10.a: "Kami akan segera mempekerjakannya!"
 SEA_warlords.11.t: "$KUM_yulbars_khan$ Tiba"
 SEA_warlords.11.desc: "$KUM_yulbars_khan$, seorang jenderal Kuomintang, kini telah kembali ke pihak kita setelah pemberontakan yang gagal melawan kekuatan [SIK.GetLeader], gubernur provinsi Sinkiang. Kita harus menyambutnya dengan tangan terbuka."
 SEA_warlords.11.a: "Saatnya melanjutkan pertarungan"
 SEA_warlords.12.t: "$XSM_ma_hongbin$ Tiba"
 SEA_warlords.12.desc: "Setelah jatuhnya negara bagian Ma Hushan, $XSM_ma_hongbin$ melarikan diri dari penangkapan dan akhirnya mencapai kami, tempat dia tinggal sekarang. Kami harus memanfaatkan pengalaman dan keahliannya dalam banyak laga mendatang."
 SEA_warlords.12.a: "Selamat datang di rumah"
 SEA_warlords.13.t: "Pengkhianat Kembali"
 SEA_warlords.13.desc: "Menyusul jatuhnya pasukan Ma Hushan $KHM_mahmut_muhiti$, mantan gubernur Kashgar yang bergabung dengan pemberontak, menawarkan diri untuk kembali menjabat sebagai gubernur dan pejabat pemerintah kita sekali lagi. Sepertinya dia menginginkan kesempatan kedua untuk menebus kesalahannya, tapi mengingat tindakannya di masa lalu, mungkin tidak bijaksana untuk memercayainya."
 SEA_warlords.13.a: "Kami tidak akan mempercayai pengkhianat"
 SEA_warlords.13.b: "Dia akan mendapat kesempatan kedua"
 SEA_warlords.14.t: "[From.GetLeader] Membutuhkan Dukungan"
 SEA_warlords.14.desc: "$wtt_political_warlord_support.10.desc$"
 SEA_warlords.14.a: "$wtt_political_warlord_support.10.a$"
 SEA_warlords.14.b: "$wtt_political_warlord_support.10.b$"
 SEA_warlords.14.c: "Mintalah tenaga kerja."
 SEA_warlords.14.d: "$wtt_political_warlord_support.10.d$"
