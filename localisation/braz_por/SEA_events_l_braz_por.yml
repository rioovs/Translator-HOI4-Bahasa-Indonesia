 #Army
 SEA_imperial_influence_events.100.t: "Fraksi Angkatan Darat Kehilangan Pengaruh"
 SEA_imperial_influence_events.100.desc: "Faksi Angkatan Darat telah mencoba meningkatkan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], namun karena kekurangannya, mereka gagal melakukannya. Oleh karena itu, mereka kini kehilangan muka dan gengsi, yang berarti pengaruh mereka pun menurun."
 SEA_imperial_influence_events.110.t: "Fraksi Angkatan Darat Berusaha Memperluas Produksi Persenjataan"
 SEA_imperial_influence_events.110.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Tampaknya mereka ingin memperluas kemampuan produksi dan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], dan karena itu menuntut agar kami membangun lebih banyak Pabrik Militer untuk meningkatkan produksi kami. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.120.t: "Fraksi Angkatan Darat Menuntut Penunjukan Politik"
 SEA_imperial_influence_events.120.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Karena kurangnya kendali pusat dan otonomi untuk bertindak sendiri, mereka ingin melihat Panglima Angkatan Darat baru ditunjuk untuk jabatan tersebut, yang juga akan memperkuat pengaruh mereka terhadap [GetImperialInfluenceRulerTitle]. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.130.t: "Fraksi TNI Ingin UU Wajib Militer Diubah"
 SEA_imperial_influence_events.130.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Mereka menginginkan kami meningkatkan wajib militer nasional, dan mengirimkan perekrut ke desa-desa untuk merekrut lebih banyak pemuda untuk upaya perang yang akan datang. Meskipun berkedok sekadar memperkuat angkatan bersenjata kita, mereka nampaknya juga ingin meningkatkan kendali dan pengaruhnya atas [GetImperialInfluenceRulerTitle]. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.140.t: "Fraksi Angkatan Darat Merencanakan Ekspansi"
 SEA_imperial_influence_events.140.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Mereka menginginkan kami menambah jumlah resimen di pasukan kami, dan membentuk lebih banyak divisi untuk membantu penaklukan yang akan datang. Meskipun berkedok sekadar memperkuat angkatan bersenjata kita, mereka nampaknya juga ingin meningkatkan kendali dan pengaruhnya atas [GetImperialInfluenceRulerTitle]. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.150.t: "Fraksi Angkatan Darat Bersikeras Mendukung Truk"
 SEA_imperial_influence_events.150.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Tampaknya mereka ingin memperluas kemampuan produksi kendaraan bermotor dan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], dan karena itu menuntut kami untuk membuat lebih banyak truk guna memenuhi kebutuhan ekspansi mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.160.t: "Fraksi TNI Tuntut Peningkatan Produksi Tank"
 SEA_imperial_influence_events.160.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Tampaknya mereka ingin memperluas kemampuan produksi tank dan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], dan karena itu menuntut agar kami membangun lebih banyak tank untuk memenuhi kebutuhan ekspansi mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
 SEA_imperial_influence_events.161.t: "Fraksi TNI Tuntut Peningkatan Produksi Artileri"
 SEA_imperial_influence_events.161.desc: "Angkatan Darat telah menyampaikan tuntutan mereka. Tampaknya mereka ingin memperluas kemampuan produksi artileri dan pengaruhnya terhadap [GetImperialInfluenceRulerTitle], dan karena itu menuntut agar kami membuat lebih banyak bahan bakar artileri untuk kebutuhan ekspansi mereka. Tampaknya mereka bersedia menunjukkan kesabaran, namun tidak akan menunggu selamanya."
