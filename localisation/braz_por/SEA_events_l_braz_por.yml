l_braz_por:
###################
###### JAPAN ######
###################
 SEA_japan.1.t: "Insiden 26 Februari"
 SEA_japan.1.desc: "Mengutip ancaman terhadap jiwa bangsa kekaisaran, perwira muda yang setia kepada faksi Kōdōha dalam IJA telah mengorganisir kudeta, dengan tujuan membersihkan pemerintahan dan kepemimpinan militer dari mereka yang menentang etos militerisme dan kendali langsung Kekaisaran atas negara. Mereka telah mengepung kediaman para pejabat tinggi, dan telah merebut pusat pemerintahan Tokyo. Namun Kaisar tetap diam, meskipun para pemberontak berharap dia akan bersuara untuk mendukung mereka. Bagaimana kelanjutan kejadian ini?"
 SEA_japan.1.a: "Akhiri lelucon ini sekarang!"
 JAP_kodoha_coup_will_fail_historically_tt: "Kami akan mengumumkan darurat militer dan mempekerjakan Resimen Yokosuka Angkatan Laut Kekaisaran Jepang untuk menekan pemberontakan. Sedikit korban yang dilaporkan, meskipun beberapa target Kōdōha telah dipastikan tewas:"
 SEA_japan.1.b: "Waktunya telah tiba untuk kembali ke tradisi!"
 JAP_kodoha_coup_will_succeed_tt: "Kōdōha akan merebut Kementerian Perang, Hotel Kekaisaran, Diet Nasional, serta Istana Kekaisaran. Banyak target utama Kōdōha yang telah dipastikan tewas:"
 SEA_japan.1.c: "Militer harus dikuasai!"
 JAP_kodoha_coup_will_fail_non_historically_tt: "Kami akan mengumumkan Darurat Militer dan berupaya untuk menekan pemberontakan menggunakan Unit Layanan Darurat dari Departemen Kepolisian Metropolitan Tokyo, membatasi keterlibatan militer dalam pemberian keadilan terhadap Kōdōha. Hanya sedikit korban yang dilaporkan, meskipun beberapa target Kōdōha telah dipastikan tewas:"
 SEA_japan.1.d: "Militer harus dikuasai!" # Intentional
 SEA_japan.1.e: "Rakyat harus menyadari bahwa mereka sedang ditumbangkan dari semua sisi!"
 SEA_japan_foreign_policy.1.t: "[FROM.GetNameDefCap] Menuntut Pengajuan kami"
 SEA_japan_foreign_policy.1.desc: "Pimpinan Tentara Kwantung [FROM.GetNameDef] telah meminta kita untuk tunduk. Namun mereka datang dengan tawaran. Jika kita bergabung dengan mereka, mereka akan membantu kita merebut kembali tanah Mongol yang lama untuk kita, dan akan memungkinkan kita mendirikan Kekaisaran Mongol baru di bawah kendali mereka. Bagaimana menurut kita?"
 SEA_japan_foreign_policy.1.a: "Ini adalah Peluang bagi kami"
 SEA_japan_foreign_policy.1.b: "Kita harus menjaga independensi kita bagaimanapun caranya!"
 MEN_li_shouxin_available_tt: "§YLi Shouxin§! tersedia sebagai §YJenderal§!"
 SEA_japan_foreign_policy.2.t: "[FROM.GetNameDefCap] Menyerah pada Aturan Kami"
 SEA_japan_foreign_policy.2.desc: "[FROM.GetLeader] telah mengundurkan diri dan memilih kandidat takhta [FROM.GetAdjective], Pangeran De. Wilayah ini kini telah jatuh di bawah pendudukan kami, dan reorganisasi pemerintahan mereka akan segera dilakukan."
 SEA_japan_foreign_policy.2.a: "Kaisar akan senang mendengarnya"
 SEA_japan_foreign_policy.3.t: "[FROM.GetNameDefCap] Menolak untuk Tunduk kepada Kaisar"
 SEA_japan_foreign_policy.3.desc: "[FROM.GetLeader] menolak menyerah pada tuntutan kami, meskipun kami telah melihat apa yang kami lakukan pada Nima-odsor saat dia melawan penguasa ilahi kami. Mungkin ini saatnya memberi mereka pelajaran tentang kerendahan hati."
 SEA_japan_foreign_policy.3.a: "Mereka tidak menghormati Kaisar, ini tidak dapat diterima!"
 SEA_japan_foreign_policy.3.b: "Lagipula kami tidak membutuhkannya"
 SEA_japan_foreign_policy.4.t: "[FROM.GetNameDefCap] Menuntut Kami Bergabung dengan Aliansi Mereka"
 SEA_japan_foreign_policy.4.desc: "Delegasi [FROM.GetAdjective] telah mendekati kami untuk meminta kerja sama dalam upaya mereka mendominasi benua Asia, dan menuntut agar kami bergabung dengan mereka dalam perang mereka saat ini dan di masa depan seiring mereka melakukan upaya ini. Tampaknya mereka tidak akan menerima jawaban tidak, tapi tentunya hal ini tidak menguntungkan kita?"
 SEA_japan_foreign_policy.4.a: "Kita akan menjadi lebih kuat bersama-sama"
 SEA_japan_foreign_policy.4.b: "Itu bertentangan dengan prinsip netralitas kami!"
 SEA_japan_foreign_policy.4.c: "Kita berada di tengah perang! Minta mereka untuk menunggu."
 SEA_japan_foreign_policy.4.c_tt: "Kami akan diminta untuk merespons setelah perang terbatas selesai"
 SEA_japan_foreign_policy.5.t: "[FROM.GetNameDefCap] Menerima Penawaran kami"
 SEA_japan_foreign_policy.5.desc: "[FROM.GetLeader] telah melihat alasannya, dan memutuskan bahwa [FROM.GetNameDef] akan secara resmi menandatangani dokumen yang diperlukan untuk memfasilitasi masuknya mereka ke faksi kami. Hari ini adalah hari yang harus dirayakan!"
 SEA_japan_foreign_policy.5.a: "Sebagaimana seharusnya"
 SEA_japan_foreign_policy.6.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_japan_foreign_policy.6.desc: "[FROM.GetLeader] menolak memberikan alasannya, dan telah menyatakan bahwa [FROM.GetNameDef] tidak akan bergabung dalam aliansi dengan kami. Apa yang tidak mereka ketahui adalah bahwa kita tidak berniat membiarkan mereka bersikap netral dalam konflik dunia yang akan datang."
 SEA_japan_foreign_policy.6.a: "Siapkan pasukan untuk menyerang!"
 SEA_japan_foreign_policy.7.t: "[FROM.GetNameDefCap] Mempersiapkan Invasi"
 SEA_japan_foreign_policy.7.desc: "Karena tidak menerima jawaban tidak, pasukan [FROM.GetAdjective] terlihat sedang bersiap untuk melakukan invasi cepat ke negara kami, kemungkinan besar berniat untuk segera masuk dan menundukkan kami, sehingga membawa kami ke wilayah mereka. Ini mungkin merupakan kesempatan terakhir kita untuk menghindari konflik, namun pertanyaannya tetap ada. Apakah kita menerimanya?"
 SEA_japan_foreign_policy.7.a: "Setelah dipikir-pikir, sebaiknya kita serahkan saja sekarang"
 SEA_japan_foreign_policy.7.b: "Kalau begitu biarkan mereka datang!"
 SEA_japan_foreign_policy.8.t: "[FROM.GetNameDefCap] Mengajukan Permintaan kami"
 SEA_japan_foreign_policy.8.desc: "Akhirnya, setelah pertimbangan panjang, delegasi dari [FROM.GetNameDef] memutuskan untuk menandatangani revisi dokumen yang kami berikan kepada mereka, menghindari intervensi militer, namun menyerahkan independensi mereka dalam proses tersebut. Sekarang, kami siap menyerang ke selatan!"
 SEA_japan_foreign_policy.8.a: "Dan ketertiban dipulihkan"
 SEA_japan_foreign_policy.9.t: "[FROM.GetLeader] Menolak untuk Mengirim"
 SEA_japan_foreign_policy.9.desc: "Kesempatan terakhir yang dengan murah hati kami tawarkan kepada [FROM.GetLeader] ditolak, dan pasukan kami kini siap untuk segera menduduki kota-kota besar mereka. Waktunya telah tiba untuk menunjukkan kepada mereka negara [ROOT.GetAdjective] terbuat dari apa!"
 SEA_japan_foreign_policy.9.a: "Tennoheika Banzai!"
 SEA_japan_foreign_policy.10.t: "[FROM.GetNameDefCap] menuntut Pekerjaan [671.GetName]"
 SEA_japan_foreign_policy.10.desc: "Delegasi yang dikirimkan kepada kami dari [FROM.GetNameDef] telah menyampaikan ultimatum kepada kami. Mereka memberi kami waktu seminggu untuk mengosongkan pasukan kami dari wilayah Tonkin, dan mengizinkan pasukan mereka mengambil posisi dan mendirikan pangkalan militer di wilayah tersebut. Mereka menyatakan bahwa hal ini dilakukan untuk memastikan bahwa Tiongkok tidak mengancam kedaulatan [VIN.GetAdjective], namun kami tahu apa sebenarnya maksud dari hal ini..."
 SEA_japan_foreign_policy.10.a: "Ini tidak layak untuk diperebutkan"
 SEA_japan_foreign_policy.10.b: "Kami tidak akan menyerahkannya kepada mereka!"
 SEA_japan_foreign_policy.11.t: "[FROM.GetNameDefCap] Transfer [671.GetName]"
 SEA_japan_foreign_policy.11.desc: "Pimpinan di [FROM.GetNameDef] telah melihat alasannya, dan telah mulai mengosongkan pasukan mereka dari Tonkin, agar memungkinkan kami membangun zona keamanan di sana untuk memastikan bahwa pasukan Tiongkok tidak memasuki wilayah [VIN.GetAdjective]. Hari ini dimenangkan!"
 SEA_japan_foreign_policy.11.a: "Hari yang Menyenangkan bagi Masyarakat [ROOT.GetAdjective]"
 SEA_japan_foreign_policy.12.t: "[From.GetNameDefCap] Menolak Permintaan kami"
 SEA_japan_foreign_policy.12.desc: "Pimpinan di [FROM.GetNameDef] tidak mau menerima alasan tersebut, dan menyatakan bahwa mereka tidak akan menyerahkan satu inci pun tanah di Indochina. Hal ini sangat menghambat ekspansi kita ke selatan... Haruskah kita menerima hal ini, atau mungkin ini waktunya untuk menyerang barat?"
 SEA_japan_foreign_policy.12.a: "Mereka akan menyesali keputusan mereka!"
 SEA_japan_foreign_policy.12.b: "Kita harus melepaskan ini"
 SEA_japan_foreign_policy.13.t: "[FROM.GetNameDefCap] menempati [721.GetName]!"
 SEA_japan_foreign_policy.13.desc: "\nAwal minggu ini, pasukan yang tergabung dalam [JAP.GetNameDef] masuk dan menduduki wilayah kami [721.GetName], dengan menyatakan bahwa mereka menjalankan misi untuk melindungi wilayah tersebut dari potensi pendudukan musuh-musuh mereka. Ini jelas merupakan tindakan perang, namun ini adalah salah satu tindakan yang mungkin bisa kita abaikan saja, mengingat mereka bukanlah musuh yang mampu kita lawan saat ini."
 SEA_japan_foreign_policy.13.a: "Tidak ada gunanya diperebutkan"
 SEA_japan_foreign_policy.13.b: "Menurut mereka, siapakah mereka?"
 SEA_japan_foreign_policy.14.t: "[FROM.GetNameDefCap] Menata ulang Pemerintahan kita"
 SEA_japan_foreign_policy.14.desc: "Para administrator [FROM.GetAdjective] yang telah membantu pembentukan negara kita telah memutuskan bahwa sekarang adalah saat yang tepat untuk mengatur ulang struktur pemerintahan kita, dan membentuk kembali sistem hukum kita. Dalam jangka panjang, hal ini hanya akan memperkuat kita, jadi kita tidak punya alasan untuk menolaknya."
 SEA_japan_foreign_policy.14.a: "Baiklah"
 SEA_japan_foreign_policy.15.t: "[FROM.GetNameDefCap] menuntut Pekerjaan [729.GetName]"
 SEA_japan_foreign_policy.15.desc: "Mengutip bahwa kota ini mungkin merupakan tempat yang baik bagi musuh untuk menyerang mereka jika ada kesempatan, pasukan [FROM.GetAdjective] yang mengelola wilayah [592.GetName] telah memberikan ultimatum kepada kami. Entah kita mengizinkan mereka masuk, yang pada dasarnya memberi mereka kekuatan untuk melakukan apa pun yang mereka inginkan terhadap kota, atau kita menghadapi kekuatan penuh tentara [FROM.GetAdjective]. Apa yang harus kita lakukan?"
 SEA_japan_foreign_policy.15.a: "Ini tidak layak untuk diperebutkan"
 SEA_japan_foreign_policy.15.b: "Kami tidak akan menyerahkannya kepada mereka!"
 SEA_japan_foreign_policy.16.t: "[FROM.GetNameDefCap] Transfer [729.GetName]"
 SEA_japan_foreign_policy.16.desc: "Administrator regional [729.GetName] telah memutuskan untuk membiarkan pasukan kita masuk, karena menyadari bahwa perlawanan pada akhirnya akan sia-sia. Rakyat kami bersukacita, karena kekuatan Barat lainnya telah diusir dari Asia Timur!"
 SEA_japan_foreign_policy.16.a: "Hari yang Menyenangkan bagi Masyarakat [ROOT.GetAdjective]"
 SEA_japan_foreign_policy.17.t: "[From.GetNameDefCap] Menolak Permintaan kami"
 SEA_japan_foreign_policy.17.desc: "Administrator regional [729.GetName] telah melupakan tempatnya, dan memutuskan untuk menolak tuntutan yang sebelumnya dikeluarkan oleh gubernur kami di [592.GetName]. Waktunya telah tiba untuk meruntuhkan kerajaan [FROM.GetAdjective] untuk selamanya!"
 SEA_japan_foreign_policy.17.a: "Mereka akan menyesali keputusan mereka!"
 SEA_japan_foreign_policy.17.b: "Kita harus melepaskan ini"
 SEA_japan_foreign_policy.18.t: "[FROM.GetNameDefCap] Mengundang kami ke Aliansi Mereka"
 SEA_japan_foreign_policy.18.desc: "Delegasi dari jauh baru-baru ini tiba di ibu kota kami, mencari audiensi dengan Yang Mulia. Mereka mengaku berasal dari [FROM.GetNameDef], dan mencari aliansi antar negara kita. Apakah kita menerimanya?"
 SEA_japan_foreign_policy.18.a: "Kita akan menjadi lebih kuat bersama-sama"
 SEA_japan_foreign_policy.18.b: "Itu akan bertentangan dengan prinsip netralitas kami..."
 SEA_japan_foreign_policy.19.t: "[FROM.GetNameDefCap] Menerima Undangan kami"
 SEA_japan_foreign_policy.19.desc: "[FROM.GetLeader] telah dengan senang hati menerima tawaran kami untuk meresmikan aliansi antar negara, dan telah memulai inisiatif untuk berintegrasi ke dalam lingkungan kita. Hari ini adalah hari untuk perayaan!"
 SEA_japan_foreign_policy.19.a: "Mereka tahu apa yang terbaik bagi mereka"
 SEA_japan_foreign_policy.20.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_japan_foreign_policy.20.desc: "[FROM.GetLeader] dengan kasar memutuskan untuk menolak tawaran aliansi antar negara kita, dengan menyatakan bahwa hal itu akan melanggar prinsip netralitas mereka. Kita hanya bisa membayangkan besarnya korupsi yang menyebabkan keputusan yang salah ini."
 SEA_japan_foreign_policy.20.a: "Itu kerugian mereka"
 SEA_japan_foreign_policy.21.t: "[FROM.GetNameDefCap] Menata Ulang Pemerintahan Kita Lebih Lanjut"
 SEA_japan_foreign_policy.21.desc: "Tuan kami yang baik hati [FROM.GetNameDef] telah memutuskan untuk akhirnya melegitimasi klaim kami sebagai negara Mongol yang sebenarnya, dan telah mengusulkan reorganisasi lain pada pemerintahan dan lembaga kami untuk memfasilitasi perubahan kebijakan ini. Hari ini adalah hari yang menyenangkan bagi orang-orang [ROOT.GetAdjective]!"
 SEA_japan_foreign_policy.21.a: "Jika itu yang ingin mereka lakukan"
 SEA_japan_foreign_policy.22.t: "Agen [FROM.GetAdjective] Terduga Terlihat"
 SEA_japan_foreign_policy.22.desc: "Agen yang dicurigai bertindak atas perintah [FROM.GetAdjective] telah terlihat di dalam perbatasan kita, tampaknya berusaha melakukan kontak dengan para bangsawan, dan membujuk warga kita dengan janji-janji besar akan Kemakmuran Bersama. Bagaimana kita harus menangani situasi ini?"
 SEA_japan_foreign_policy.22.a: "Mereka tidak akan menyakiti kita, biarkan saja"
 SEA_japan_foreign_policy.22.b: "Sangat penting bagi kita untuk meningkatkan keamanan nasional kita!"
 SEA_japan_foreign_policy.23.t: "[FROM.GetNameDefCap] Mempengaruhi Karyawan kita"
 SEA_japan_foreign_policy.23.desc: "Agen [FROM.GetAdjective] kini mulai menyebarkan propaganda pan-asianisme ke seluruh Lhasa, dan mulai menyelundupkan dana untuk mempengaruhi para bangsawan setempat. Tampaknya situasinya akan segera menjadi tidak terkendali..."
 SEA_japan_foreign_policy.23.a: "Lingkungan Kemakmuran Bersama memikat mereka..."
 SEA_japan_foreign_policy.24.t: "[FROM.GetNameDefCap] Menjalin Kontak dengan Thubten Kunphela"
 SEA_japan_foreign_policy.24.desc: "Petugas kami telah melaporkan bahwa agen [FROM.GetAdjective] tampaknya telah berhasil menjalin kontak dengan Thubten Kunphela, seorang bangsawan yang memegang banyak kekuasaan, yang dijuluki Orang Kuat Tibet pada masa itu. Segalanya mungkin menjadi buruk bagi kita mulai saat ini..."
 SEA_japan_foreign_policy.24.a: "Mereka sedang merencanakan sesuatu..."
 SEA_japan_foreign_policy.25.t: "[FROM.GetNameDefCap] Memiliterisasi Partai Perbaikan Tibet"
 SEA_japan_foreign_policy.25.desc: "Partai Perbaikan Tibet, sebuah partai politik yang dibentuk di pengasingan di India Britania dan setia kepada Thubten Kunphela, baru-baru ini menerima paket senjata dari pengirim yang tidak dikenal. Tampaknya mereka sedang mempersiapkan kudeta, dari posisi yang berada di luar jangkauan kita."
 SEA_japan_foreign_policy.25.a: "Ini sudah tidak terkendali!"
 SEA_japan_foreign_policy.26.t: "Kudeta Orang Kuat"
 SEA_japan_foreign_policy.26.desc: "Harinya telah tiba, akhirnya. Tadi pagi, Thubten Kunphela menyerbu Lhasa bersama pendukung bersenjatanya, mengklaim bahwa pemerintahan kita korup dan tidak sah, dan menyatakan bahwa [ROOT.GetNameDef] akan lebih baik jika menjadi bagian dari lingkup [FROM.GetAdjective]. Apakah kita menuruti tuntutannya, atau kita mengambil keputusan terakhir?"
 SEA_japan_foreign_policy.26.a: "Mungkin dia benar"
 SEA_japan_foreign_policy.26.b: "Lawan mereka!"
 SEA_japan_foreign_policy.27.t: "[FROM.GetNameDefCap] Mendukung Klaim Pan-Mongol"
 SEA_japan_foreign_policy.27.desc: "Harinya akhirnya telah tiba, dimana kita dapat meluncurkan kampanye kita dan mengklaim wilayah Mongolia Luar, yang saat ini dikuasai oleh pengecut tidak sah [MON.GetLeader]. Ini saatnya menunjukkan kepada dunia bahwa semangat Ghengis Khan tetap hidup!"
 SEA_japan_foreign_policy.27.a: "Benar-benar hari yang menyenangkan"
 SEA_japan_foreign_policy.28.t: "[FROM.GetNameDefCap] Menyerahkan Negara Mongol"
 SEA_japan_foreign_policy.28.desc: "Setelah menduduki tanah Mongol yang sah, tuan kami [FROM.GetNameDef] telah menyerahkan administrasi wilayah tersebut kepada kami, seperti yang telah mereka janjikan. Kami sangat berterima kasih atas kepercayaan yang mereka berikan kepada kami!"
 SEA_japan_foreign_policy.28.a: "Luar biasa"
 SEA_japan_foreign_policy.29.t: "Hasil Kampanye Suiyuan"
 SEA_japan_foreign_policy.29.desc: "Kampanye Suiyuan telah berakhir, dan perbatasan baru telah dibuat. Kemungkinan ini merupakan kali terakhir rakyat kami melakukan serangan seperti ini tanpa campur tangan pemerintah pusat Tiongkok, karena mereka sekarang sangat waspada terhadap tindakan kami di wilayah tersebut."
 SEA_japan_foreign_policy.29.a: "Setidaknya kita sekarang bisa fokus pada bidang lain"
 SEA_japan_foreign_policy.30.t: "Akhir dari Kampanye Suiyuan"
 SEA_japan_foreign_policy.30.desc: "Akhirnya, serangan tanpa henti yang dilakukan oleh [JAP.GetNameDef] dan rakyatnya yang kejam telah terhenti, dan pasukan mereka kembali ke posisi mereka. Tidak diketahui apakah peristiwa yang terjadi saat ini akan diingat dalam sejarah, namun setidaknya Pemerintah Nanjing kini menyadari ambisi [JAP.GetAdjective] di wilayah tersebut."
 SEA_japan_foreign_policy.30.a: "Ancaman lain telah diatasi"
 SEA_japan_foreign_policy.31.t: "Pasukan Pro-Jepang Menyerang Posisi Kami!"
 SEA_japan_foreign_policy.31.desc: "Pasukan yang tergabung dalam [MEN.GetNameDef] dan Tentara Agung Han yang Benar telah menyerang posisi kami di Suiyuan, dan tampaknya berniat untuk merebut aimag Mongolia Dalam yang kami miliki. Kita tidak bisa membiarkan mereka lewat!"
 SEA_japan_foreign_policy.31.a: "Tunjukkan pada mereka dengan siapa mereka berhadapan"
 SEA_japan_foreign_policy.32.t: "Jepang Mengupayakan Kolaborasi Melawan Ancaman Komunis"
 SEA_japan_foreign_policy.32.desc: "[FROM.GetAdjective] diplomat telah mencapai angka satu-delapan puluh dalam hal kebijakan luar negeri mereka, dan kini menyatakan bahwa mereka ingin bekerja lebih dekat dengan kami, dengan syarat kami menindak sentimen komunis dan anti-Jepang. Ada yang mencurigakan dalam kesepakatan ini, tapi mungkinkah itu sepadan dengan risikonya?"
 SEA_japan_foreign_policy.32.a: "Kami bisa menjanjikan hal itu kepada mereka"
 SEA_japan_foreign_policy.32.b: "Kami tidak akan membuat kesepakatan dengan [JAP.GetAdjective]"
 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag: "Tiongkok telah memilih untuk bekerja sama dengan tuntutan kami"
 SEA_japan_foreign_policy.33.t: "[FROM.GetLeader] Menerima Permintaan kami"
 SEA_japan_foreign_policy.33.desc: "[FROM.GetLeader], pemimpin [FROM.GetNameDef] telah menerima usulan kami, dan berjanji untuk melarang protes terhadap negara kami, sekaligus bersiap untuk menindak aktivitas komunis di negara ini. Kita akan segera dapat meresmikan aliansi dengan mereka, sehingga kita dapat menghancurkan penyakit busuk yang mengancam seluruh rakyat Asia menuju kehancuran yang tidak bisa dihindari dan tidak bisa dihindari."
 SEA_japan_foreign_policy.33.a: "Langkah pertama telah diambil"
 SEA_japan_foreign_policy.34.t: "[FROM.GetLeader] Menolak Permintaan kami"
 SEA_japan_foreign_policy.34.desc: "[FROM.GetLeader], pemimpin [FROM.GetNameDef] telah memutuskan bahwa orang-orang [FROM.GetAdjective] tidak berhak mendapatkan uang receh, menolak tawaran baik kami dan mengambil keputusan untuk kami bahwa kami perlu membawa bangsa [FROM.GetAdjective] ke arah yang lebih baik. akhir."
 SEA_japan_foreign_policy.34.a: "Mereka akan menyesali keputusan mereka"
 SEA_japan_foreign_policy.35.t: "[FROM.GetNameDefCap] Menyebarkan Sentimen Pro-[FROM.GetAdjective]"
 SEA_japan_foreign_policy.35.desc: "Berbagai stasiun radio di pantai barat telah mulai menyiarkan propaganda [FROM.GetAdjective] untuk mempengaruhi masyarakat agar memihak mereka dalam konflik di Asia. Kita harus mematikannya, sebelum menimbulkan banyak kerugian!"
 SEA_japan_foreign_policy.35.a: "Beraninya mereka!"
 SEA_japan_foreign_policy.36.t: "[FROM.GetNameDefCap] Menyebarkan Sentimen Pro-[FROM.GetAdjective]"
 SEA_japan_foreign_policy.36.desc: "Stasiun-stasiun radio yang tergabung dalam [FROM.GetNameDef] telah mulai menyiarkan propaganda pro-[FROM.GetAdjective] ke seluruh negara kita. Pemerintah [FROM.GetAdjective] kini juga telah menghubungi kami untuk menawarkan investasi pada industri kami, sebagai imbalan bagi kami untuk mengizinkan stasiun radio tetap buka."
 SEA_japan_foreign_policy.36.a: "Kita bisa memanfaatkan persahabatan mereka"
 SEA_japan_foreign_policy.36.b: "Hancurkan omong kosong ini sekarang!"
 SEA_japan_foreign_policy.37.t: "[FROM.GetNameDefCap] Memungkinkan Pengaruh Kami Menyebar"
 SEA_japan_foreign_policy.37.desc: "[FROM.GetLeader] telah memutuskan untuk menerima tawaran kami, dan akan mengizinkan stasiun radio kami untuk tetap buka di saluran udara [FROM.GetAdjective]. Mereka juga mengizinkan para industrialis kami mendirikan toko di sana."
 SEA_japan_foreign_policy.37.a: "Seperti yang kami prediksi"
 SEA_japan_foreign_policy.38.t: "[FROM.GetNameDefCap] Menghalangi Pengaruh Kami agar Tidak Menyebar"
 SEA_japan_foreign_policy.38.desc: "[FROM.GetLeader] telah memutuskan untuk memblokir campur tangan kami di [FROM.GetNameDef], dan memutuskan bahwa kemerdekaan mereka lebih berharga daripada misi ilahi pan-Asia."
 SEA_japan_foreign_policy.38.a: "Mereka tahu nasib apa yang menanti mereka"
 SEA_japan_foreign_policy.39.t: "[FROM.GetAdjective] Investasi pada Sumber Daya Alam kita"
 SEA_japan_foreign_policy.39.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk mengizinkan investasi pada sumber daya alam kami, dan perusahaan [FROM.GetAdjective] telah mulai membuka operasi di wilayah kami."
 SEA_japan_foreign_policy.39.a: "Tentu saja ada maksud tersembunyi dibalik hal ini"
 SEA_japan_foreign_policy.40.t: "Pertanyaan tentang Kemakmuran Bersama di Asia Timur"
 SEA_japan_foreign_policy.40.desc: "Dengan terbentuknya Kawasan Kemakmuran Bersama Asia Timur Raya, timbul pertanyaan. Apakah kita mengejar tujuan kemakmuran Asia yang dijanjikan, atau apakah kita mengambil apa yang menjadi hak kita dan menegaskan kendali kita atas Asia secara lebih langsung?"
 SEA_japan_foreign_policy.40.a: "Otoritas tertinggi Kaisar harus selalu didahulukan!"
 SEA_japan_foreign_policy.40.b: "Kita harus mengejar kesejahteraan bagi seluruh negara Asia!"
 SEA_japan_foreign_policy.41.t: "Senbunya"
 SEA_japan_foreign_policy.41.desc: "Senbu dibentuk untuk meningkatkan kendali kami atas kepemilikan kontinental kami, dan mulai berupaya meningkatkan kepatuhan di wilayah pendudukan kami. Mungkin ini saatnya memberi mereka lebih banyak tugas administratif, dan memanfaatkannya dengan baik?"
 SEA_japan_foreign_policy.41.a: "Kita harus segera menerapkan strategi ini!"
 SEA_japan_foreign_policy.41.b: "Akan lebih bijaksana untuk menunggu keputusan kami"
 apply_senbu_law_tt: "Menerapkan hukum pendudukan §YSenbu§! ke semua wilayah pendudukan yang berlaku"
 SEA_japan_foreign_policy.42.t: "Aliansi Tiongkok-Jepang"
 SEA_japan_foreign_policy.42.desc: "[FROM.GetLeader] telah menyatakan bahwa kedua negara kita memiliki takdir yang sama, dan hanya dengan berjalan berdampingan kita dapat memberantas ancaman komunis. Untuk itu, usulan aliansi telah diajukan kepada kami, meski ketentuannya sepertinya hanya bersifat sementara. Haruskah kita menerima tawaran mereka?"
 SEA_japan_foreign_policy.42.a: "Hal ini sesuai dengan kepentingan terbaik kita"
 SEA_japan_foreign_policy.42.b: "Ini berbau amis"
 SEA_japan_foreign_policy.43.t: "[FROM.GetLeader] Menandatangani Pakta"
 SEA_japan_foreign_policy.43.desc: "Rakyat kami bersukacita, karena negara [FROM.GetAdjective] telah bergabung dengan kami dalam melawan ancaman utama terhadap stabilitas Asia, yaitu komunis. Meskipun perjanjian ini hanya bersifat sementara, namun hal ini pasti akan memberikan keuntungan besar bagi kita."
 SEA_japan_foreign_policy.43.a: "Luar biasa"
 SEA_japan_foreign_policy.44.t: "[FROM.GetLeader] Menolak Menandatangani Pakta"
 SEA_japan_foreign_policy.44.desc: "Bodohnya, [FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk bertindak tidak terhormat, menolak proposal besar kami. Aliansi tersebut telah dibatalkan, dan Tentara Kwantung sekali lagi mulai mengincar Tiongkok utara. Mungkin penyesuaian kembali terhadap kebijakan luar negeri kita adalah hal yang dibutuhkan saat ini."
 SEA_japan_foreign_policy.44.a: "Tidak ada yang bisa dilakukan mengenai hal itu"
 SEA_japan_foreign_policy.45.t: "[FROM.GetNameDefCap] Menuntut Integrasi Ekonomi"
 SEA_japan_foreign_policy.45.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kami hari ini untuk menyampaikan penawaran kepada kami. Mereka menginginkan kita meningkatkan kegiatan ekonomi terpadu dan memajukan integrasi kita dengan mereka. Ini akan membantu perekonomian kita secara signifikan, tapi ada sesuatu yang mencurigakan dalam semua ini..."
 SEA_japan_foreign_policy.45.a: "Terlalu bagus untuk dilewatkan"
 SEA_japan_foreign_policy.45.b: "Kami tidak akan melepaskan kemandirian ekonomi kami!"
 SEA_japan_foreign_policy.46.t: "[FROM.GetNameDefCap] Menerima tawaran kami"
 SEA_japan_foreign_policy.46.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi dengan baik tawaran kami, dan diplomat mereka telah tiba di negara kami untuk menandatangani dokumen yang diperlukan guna memfasilitasi integrasi ekonomi lebih lanjut."
 SEA_japan_foreign_policy.46.a: "Kami berterima kasih atas kenaifan mereka"
 SEA_japan_foreign_policy.47.t: "[FROM.GetNameDefCap] Menolak tawaran kami"
 SEA_japan_foreign_policy.47.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi undangan integrasi kami dengan sangat tidak senang, dan mengklaim bahwa kemitraan ekonomi apa pun yang lebih erat antara negara kita tidak akan dan selamanya tidak akan dilakukan. Mungkin mereka bisa melihat apa yang kami sediakan untuk mereka..."
 SEA_japan_foreign_policy.47.a: "Berita buruk..."
 SEA_japan_foreign_policy.48.t: "[FROM.GetNameDefCap] Mengembangkan Industri kita"
 SEA_japan_foreign_policy.48.desc: "Para industrialis yang tergabung dalam [FROM.GetNameDef] telah mulai mengembangkan industri lokal kita, dan mendirikan perusahaan baru di wilayah kita. Hal ini pasti akan membawa kita lebih dekat pada kesejahteraan."
 SEA_japan_foreign_policy.48.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.49.t: "Proklamasi Pemerintahan Reorganisasi"
 SEA_japan_foreign_policy.49.desc: "Dalam proklamasi yang diadakan di Shanghai hari ini, [ROOT.GetLeader] bersama para jenderal dan administrator yang dikirim oleh IJA mendeklarasikan berdirinya pemerintahan baru Tiongkok, sebuah alternatif yang lebih baik terhadap wilayah kekuasaan Kuomintang yang korup. Hidup Republik Tiongkok!"
 SEA_japan_foreign_policy.49.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.50.t: "[FROM.GetNameDefCap] Menuntut Integrasi Total"
 SEA_japan_foreign_policy.50.desc: "Mengintegrasikan perekonomian kita tidak cukup untuk memuaskan [FROM.GetAdjective], karena [FROM.GetLeader] dari [FROM.GetNameDef] saat ini menuntut integrasi total kita ke dalam negara mereka. Jika kita tidak segera melepaskan diri dari mereka, maka berakhirlah status kita sebagai bangsa yang merdeka. Bagaimana kita melakukan hal ini?"
 SEA_japan_foreign_policy.50.a: "Kami harus menerima situasinya"
 SEA_japan_foreign_policy.50.b: "Kemenangan atau kematian!"
 SEA_japan_foreign_policy.51.t: "[FROM.GetNameDefCap] Menerima Integrasi Total"
 SEA_japan_foreign_policy.51.desc: "Berita gembira bahwa kepemimpinan di [FROM.GetNameDef] telah diterima untuk diintegrasikan ke dalam negara kita telah disambut dengan tepuk tangan meriah di National Diet hari ini. Apa yang bisa kami tawarkan sudah cukup jelas bagi mereka untuk menganggap tawaran itu menguntungkan meskipun kedaulatan mereka sudah berakhir."
 SEA_japan_foreign_policy.51.a: "Hebat!"
 SEA_japan_foreign_policy.52.t: "[FROM.GetNameDefCap] Menolak Integrasi Total"
 SEA_japan_foreign_policy.52.desc: "Meskipun terdapat keuntungan nyata dan jelas merupakan yang terbaik bagi masa depan Asia, [FROM.GetNameDef] telah menolak permintaan kami untuk melakukan integrasi total. Kita hanya bisa berspekulasi mengenai alasan mereka, namun nampaknya mereka tidak mempertimbangkan kepentingan terbaik kawasan ini."
 SEA_japan_foreign_policy.52.a: "Hal-hal tersebut merupakan risiko bagi persatuan Asia!"
 SEA_japan_foreign_policy.52.b: "Kami akan terus mengawasi mereka.."
 SEA_japan_foreign_policy.53.t: "Subversif Terlihat di Khan Khentii Uulyn Aimag"
 SEA_japan_foreign_policy.53.desc: "Agen yang dicurigai bertindak atas perintah [FROM.GetAdjective] telah terlihat di dalam perbatasan kita, tampaknya berusaha melakukan kontak dengan para bangsawan, dan membujuk warga kita dengan janji-janji besar akan Kemakmuran Bersama. Tampaknya mereka punya rencana untuk rakyat Mongolia."
 SEA_japan_foreign_policy.53.a: "Kita harus waspada!"
 SEA_japan_foreign_policy.54.t: "[FROM.GetAdjective] Senjata Membanjiri Pasar Gelap"
 SEA_japan_foreign_policy.54.desc: "Baru-baru ini, tampaknya senjata milik [FROM.GetNameDef] telah membanjiri pasar gelap kita, banyak di antaranya menjangkau para pembangkang dan subversif di wilayah kita. Tampaknya mereka hanya bertujuan untuk menggoyahkan kita, atau mungkin lebih buruk lagi, menggulingkan pemerintah kita!"
 SEA_japan_foreign_policy.54.a: "Mereka mempersenjatai para pembangkang politik!"
 SEA_japan_foreign_policy.55.t: "Rumor Serangan Mongolia Dalam"
 SEA_japan_foreign_policy.55.desc: "Pasukan yang tergabung dalam tentara Mongolia Dalam terlihat berkumpul di perbatasan selatan kami. Tampaknya mereka sedang mempersiapkan serangan ke wilayah kita, meskipun tujuan pastinya tidak diketahui."
 SEA_japan_foreign_policy.55.a: "Sekarang saatnya lakukan atau mati, bersiaplah untuk yang terburuk!"
 SEA_japan_foreign_policy.56.t: "Gerilyawan Manchuria Terlihat di Timur"
 SEA_japan_foreign_policy.56.desc: "Gerilyawan Manchuria terlihat di luar Bayan Tümen, serta di bagian lain wilayah timur kami. Mereka saat ini tidak lebih buruk dari bandit biasa, tapi seiring berjalannya waktu mereka akan menjadi masalah nyata."
 SEA_japan_foreign_policy.56.a: "Sekarang saatnya lakukan atau mati, bersiaplah untuk yang terburuk!"
 SEA_japan_foreign_policy.57.t: "[FROM.GetAdjective] Tekanan untuk Penyerahan"
 SEA_japan_foreign_policy.57.desc: "Sebelumnya hari ini, pemerintah [FROM.GetAdjective] menyampaikan ultimatum kepada kami. Mereka menuntut kita tunduk pada mereka, jika kita ingin bangsa kita tidak hancur. Namun kita tahu apa yang mereka persiapkan untuk kita, dan mungkin demi kepentingan terbaik kita untuk menolaknya?"
 SEA_japan_foreign_policy.57.a: "Kita tidak bisa melawan mereka"
 SEA_japan_foreign_policy.57.b: "Kita harus melindungi revolusi!"
 MON_japan_starts_a_popular_civil_war_tt: "Jepang akan melancarkan perang saudara melawan pemerintah kita, dan kemungkinan besar akan melakukan intervensi di pihaknya"
 SEA_japan_foreign_policy.58.t: "[FROM.GetNameDefCap] Menyerahkan Negara Bagian Tiongkok"
 SEA_japan_foreign_policy.58.desc: "Penguasa [FROM.GetAdjective] kami telah menyerahkan administrasi banyak negara bagian bekas yang dikuasai Kuomintang kepada kami, meminta kami untuk memulai persiapan guna mengintegrasikan tanah-tanah ini ke dalam negara bagian kami dengan baik. Kami tidak akan mengecewakan mereka!"
 SEA_japan_foreign_policy.58.a: "Luar biasa"
 SEA_japan_foreign_policy.59.t: "Proklamasi Negara Burma"
 SEA_japan_foreign_policy.59.desc: "Sebelumnya hari ini, [ROOT.GetLeader] dan berbagai [JAP.GetAdjective] mengadakan proklamasi bersama, mendeklarasikan pembentukan negara bagian [ROOT.GetAdjective] yang baru. Kami akan menang melawan semua musuh kami!"
 SEA_japan_foreign_policy.59.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.60.t: "Jepang Mendirikan Negara Burma"
 SEA_japan_foreign_policy.60.desc: "[JAP.GetLeader] telah memproklamirkan pembentukan negara bagian [ROOT.GetAdjective] baru, yang menentang kita dan arah yang kita ambil saat ini. Tampaknya mereka siap memperjuangkan kemerdekaannya dari kita, dan tidak akan menyerah tanpa perlawanan!"
 SEA_japan_foreign_policy.60.a: "Lawan mereka, hancurkan semua pengkhianat!"
 SEA_japan_foreign_policy.60.b: "Kita harus bergabung dengan mereka, kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.61.t: "Pengkhianatan Wang Jingwei"
 SEA_japan_foreign_policy.61.desc: "Pengkhianat Wang Jingwei terlihat meninggalkan kediamannya minggu lalu, dan pergi dengan tujuan yang tidak diketahui. Kalau dipikir-pikir, hal ini sepertinya tidak bisa dihindari, karena ketidakpuasannya terhadap kebijakan [ROOT.GetLeader]. Namun dia tidak akan dirindukan."
 SEA_japan_foreign_policy.61.a: "Itu sudah bisa ditebak"
 SEA_japan_foreign_policy.61.b: "Mungkin dia benar..."
 SEA_japan_foreign_policy.62.t: "Cacat Wang Jingwei"
 SEA_japan_foreign_policy.62.desc: "Wang Jingwei, mantan anggota berpangkat tinggi di Kuomintang telah tiba di Shanghai dan ingin bekerja bersama kami. Karena posisi dan popularitasnya, mungkin bijaksana untuk memberinya posisi penting di pemerintahan kita, karena dia mungkin bisa memimpin kita dengan baik."
 SEA_japan_foreign_policy.62.a: "Dia akan menjadi pemimpin yang kuat"
 SEA_japan_foreign_policy.62.b: "Sun Dianying lebih mumpuni"
 SEA_japan_foreign_policy.63.t: "Penggabungan dengan [RNG.GetNameDef]"
 SEA_japan_foreign_policy.63.desc: "[JAP.GetLeader] telah menuntut agar kami menggabungkan pemerintahan kami dengan [RNG.GetNameDef], sehingga mengakhiri kemerdekaan kami dan memberikan kepemimpinan kami posisi tinggi dalam pemerintahan [RNG.GetAdjective]. Apakah kita menerima usulan ini?"
 SEA_japan_foreign_policy.63.a: "[ROOT.GetLeader] akan mendapatkan posisi yang bagus, jadi kami menerimanya"
 SEA_japan_foreign_policy.63.b: "Itu akan menjadi akhir dari otonomi kita, bukan!"
 SEA_japan_foreign_policy.64.t: "[FROM.GetNameDefCap] Bergabung dengan Kami"
 SEA_japan_foreign_policy.64.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima proposal [JAP.GetAdjective] untuk bergabung dengan pemerintah kami, dan tanah [FROM.GetAdjective] kini semuanya berada di bawah yurisdiksi kami. Ini adalah hari yang menyenangkan bagi kami!"
 SEA_japan_foreign_policy.64.a: "Kami melihat mengapa mereka menerimanya"
 SEA_japan_foreign_policy.65.t: "[FROM.GetNameDefCap] Menolak Penggabungan"
 SEA_japan_foreign_policy.65.desc: "[FROM.GetLeader] yang dangkal telah menolak untuk melihat alasannya, dan telah menolak proposal kami untuk bergabung dengan [RNG.GetNameDef]. Mungkin ada kesepakatan yang lebih baik, dan bahkan mungkin intimidasi dalam dosis yang tepat sudah dilakukan."
 SEA_japan_foreign_policy.65.a: "Mereka akan menerima pada waktunya.."
 SEA_japan_foreign_policy.66.t: "Proklamasi Pemerintahan Sementara India Merdeka"
 SEA_japan_foreign_policy.66.desc: "Sebelumnya hari ini, [ROOT.GetLeader] dan berbagai [JAP.GetAdjective] mengadakan proklamasi bersama, mendeklarasikan pembentukan negara bagian [ROOT.GetAdjective] yang baru. Kami akan menang melawan semua musuh kami!"
 SEA_japan_foreign_policy.66.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.67.t: "Jepang Membentuk Pemerintahan Sementara India Merdeka"
 SEA_japan_foreign_policy.67.desc: "[JAP.GetLeader] telah memproklamirkan pembentukan negara bagian [ROOT.GetAdjective] baru, yang menentang kita dan arah yang kita ambil saat ini. Tampaknya mereka siap memperjuangkan kemerdekaannya dari kita, dan tidak akan menyerah tanpa perlawanan!"
 SEA_japan_foreign_policy.67.a: "Lawan mereka, hancurkan semua pengkhianat!"
 SEA_japan_foreign_policy.67.b: "Kita harus bergabung dengan mereka, kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.68.t: "Proklamasi Republik Filipina Kedua"
 SEA_japan_foreign_policy.68.desc: "Sebelumnya hari ini, [ROOT.GetLeader] dan berbagai [JAP.GetAdjective] mengadakan proklamasi bersama, mendeklarasikan pembentukan negara bagian [ROOT.GetAdjective] yang baru. Kami akan menang melawan semua musuh kami!"
 SEA_japan_foreign_policy.68.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.69.t: "Jepang Mendirikan Republik Filipina Kedua"
 SEA_japan_foreign_policy.69.desc: "[JAP.GetLeader] telah memproklamirkan pembentukan negara bagian [ROOT.GetAdjective] baru, yang menentang kita dan arah yang kita ambil saat ini. Tampaknya mereka siap memperjuangkan kemerdekaannya dari kita, dan tidak akan menyerah tanpa perlawanan!"
 SEA_japan_foreign_policy.69.a: "Lawan mereka, hancurkan semua pengkhianat!"
 SEA_japan_foreign_policy.69.b: "Kita harus bergabung dengan mereka, kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.70.t: "Jepang Menuntut Penyerahan Bersyarat kita"
 SEA_japan_foreign_policy.70.desc: "[FROM.GetAdjective] diplomat telah menyampaikan ultimatum kepada kami, menuntut agar kami mengubah perbatasan timur kami dan menandatangani perdamaian bersyarat dengan mereka, yang pada dasarnya mengabaikan urusan Asia. Hal ini akan memberi kita kemampuan untuk memfokuskan upaya kita sepenuhnya dalam merebut kembali tanah kita di Eropa, dan mungkin memungkinkan kita untuk kembali merebut kembali wilayah timur setelah semua musuh kita telah dikalahkan."
 SEA_japan_foreign_policy.70.a: "Kami tidak akan pernah menyerah!"
 SEA_japan_foreign_policy.70.b: "Itu akan menjadi musuh di belakang kita"
 SEA_japan_foreign_policy.71.t: "[FROM.GetNameDefCap] Menolak Menyerah"
 SEA_japan_foreign_policy.71.desc: "Orang-orang bodoh di Moskow menolak menyerah pada tuntutan awal kami. Hal ini memerlukan penghancuran total negara mereka, dan bahkan penyesuaian perbatasan lebih jauh dari yang direncanakan sebelumnya!"
 SEA_japan_foreign_policy.71.a: "Mereka akan jatuh ke tangan kita!"
 SEA_japan_foreign_policy.72.t: "[FROM.GetNameDefCap] Menyerahkan Timur"
 SEA_japan_foreign_policy.72.desc: "Para diplomat yang berbicara atas nama [FROM.GetLeader] telah menyetujui tuntutan kami, dan menyerahkan harta benda mereka di Siberia kepada kami. Hari ini menandai hari besar bagi Kekaisaran!"
 SEA_japan_foreign_policy.72.a: "Kami telah menang hari ini!"
 SEA_japan_foreign_policy.73.t: "[SOV.GetNameDefCap] Mundur dari Siberia"
 SEA_japan_foreign_policy.73.desc: "Sekutu kita telah menarik diri dari Asia Timur, menyerah pada tuntutan [JAP.GetNameDef]. Hal ini membuat kita berada pada posisi yang sangat rentan. Apakah kita mencari sekutu baru, atau terus berjuang melawan [JAP.GetAdjective]?"
 SEA_japan_foreign_policy.73.a: "Mereka telah meninggalkan kita..."
 SEA_japan_foreign_policy.73.b: "Maka kita harus mendapatkan perlindungan Jepang sebagai gantinya!"
 SEA_japan_foreign_policy.74.t: "[FROM.GetNameDefCap] Mencari Perlindungan kami"
 SEA_japan_foreign_policy.74.desc: "[FROM.GetLeader], pemimpin [FROM.GetNameDef], kecewa dengan pengkhianatan terang-terangan yang dilakukan oleh sekutu [FROM.GetName] sebelumnya, kini menghubungi kami dan meminta kami untuk mengambil posisi baru sebagai pelindung tanah dan rakyat mereka. Apakah wajib?"
 SEA_japan_foreign_policy.74.a: "Baiklah"
 SEA_japan_foreign_policy.74.b: "Kami tidak membutuhkan mereka"
 SEA_japan_foreign_policy.75.t: "[FROM.GetAdjective] Peralatan Tiba"
 SEA_japan_foreign_policy.75.desc: "Tampaknya kontak kami di [FROM.GetNameDef] akhirnya berhasil mencapai kesepakatan dengan para pemimpin negara, setelah faksi Kōdōha yang merupakan tempat sebagian besar kontak kami berada baru-baru ini mengambil alih pemerintahan setelah kudeta yang berhasil. Hidup kedua kaisar!"
 SEA_japan_foreign_policy.75.a: "Kami sangat berterima kasih!"
 SEA_japan_foreign_policy.76.t: "[FROM.GetNameDefCap] Menuntut Integrasi Penuh"
 SEA_japan_foreign_policy.76.desc: "[FROM.GetLeader] telah menyatakan bahwa karena keadaan darurat yang diumumkan setelah kudeta Kōdōha, dan kemungkinan adanya pejabat yang berbeda pendapat yang bersembunyi di wilayah kekuasaan kita, kita harus menjadi bagian yang terintegrasi dari negara ini. Hal ini pada gilirannya akan memungkinkan tata kelola penuh oleh negara bagian [FROM.GetAdjective]. Apakah kita menerimanya?"
 SEA_japan_foreign_policy.76.a: "Kami harus menerima situasinya"
 SEA_japan_foreign_policy.76.b: "Mereka terlalu memikirkan diri mereka sendiri"
 SEA_japan_foreign_policy.77.t: "[FROM.GetNameDefCap] Menerima Integrasi Total"
 SEA_japan_foreign_policy.77.desc: "[FROM.GetLeader], gubernur [FROM.GetNameDef] telah menerima integrasi penuh ke dalam negara kita hari ini. Ini berarti bahwa pemerintah kita akhirnya dapat memegang kendali penuh bahkan atas divisi lokal di wilayah Korea kita."
 SEA_japan_foreign_policy.77.a: "Hebat!"
 SEA_japan_foreign_policy.78.t: "[FROM.GetNameDefCap] Menolak Integrasi Total"
 SEA_japan_foreign_policy.78.desc: "Meskipun terdapat keuntungan nyata dan jelas merupakan yang terbaik bagi masa depan bangsa, gubernur [FROM.GetNameDef], [FROM.GetLeader] telah menolak permintaan kami untuk integrasi total. Kita hanya bisa berspekulasi mengenai alasannya, namun nampaknya alasan-alasan tersebut tidak memikirkan kepentingan terbaik negara."
 SEA_japan_foreign_policy.78.a: "Kami membutuhkan seseorang yang lebih dapat dipercaya untuk memimpin!"
 SEA_japan_foreign_policy.78.b: "Kami akan menghormati keinginan mereka, untuk saat ini..."
 SEA_japan_foreign_policy.79.t: "[FROM.GetNameDefCap] Mengupayakan Integrasi yang Lebih Dekat"
 SEA_japan_foreign_policy.79.desc: "[FROM.GetLeader] telah menghubungi kami dengan sebuah proposisi, mengklaim bahwa ini adalah yang terbaik bagi kedua populasi kami. Permintaannya adalah agar negara kita menjadi bagian yang terintegrasi dari [FROM.GetNameDef] pada waktunya, mengakhiri otonomi kita dan menjadikan kita bagian inti dari wilayah mereka. Apakah ini benar-benar bermanfaat bagi kita?"
 SEA_japan_foreign_policy.79.a: "Ya, ini akan menguntungkan kita"
 SEA_japan_foreign_policy.79.b: "Tidak! Nasib Manchuria ada di tempat lain!"
 MAN_we_can_be_annexed_by_kodoha_tt: "Kami akan §RDianeksasi§! oleh [JAP.GetNameDef] dalam waktu dekat!"
 SEA_japan_foreign_policy.80.t: "Asosiasi Concordia Setuju"
 SEA_japan_foreign_policy.80.desc: "Asosiasi Concordia, elit penguasa di [FROM.GetNameDef], telah menyetujui usulan kami dan siap untuk mengelola wilayah ini sebagai bagian integral dari wilayah kami dalam waktu dekat. Tampaknya rencana unifikasi kita akan dapat berjalan dengan lancar."
 SEA_japan_foreign_policy.80.a: "Baiklah"
 SEA_japan_foreign_policy.81.t: "Asosiasi Concordia Menentang Kami"
 SEA_japan_foreign_policy.81.desc: "Asosiasi Concordia, elit penguasa di [FROM.GetNameDef], telah memutuskan untuk menolak tawaran kami, dengan alasan bahwa mereka tidak mendapat manfaat dari integrasi di negara kami. Mungkin mereka terbujuk oleh para pembangkang Manchuria atau komunis, tapi sayangnya keputusan ini tidak bisa kita batalkan dengan mudah..."
 SEA_japan_foreign_policy.81.a: "Kami akan menanganinya nanti"
 SEA_japan_foreign_policy.81.b: "Jika itu keinginan mereka.."
 SEA_japan_foreign_policy.82.t: "[FROM.GetNameDefCap] Mengupayakan Kerjasama Anti-Soviet"
 SEA_japan_foreign_policy.82.desc: "Teman-teman bersejarah kami di negara timur jauh [FROM.GetName] telah menghubungi kami dengan tawaran yang menarik. Karena ikatan sejarah kita, dan ketidakpercayaan kita terhadap negara [SOV.GetAdjective], mereka telah menawarkan pakta militer yang menyatakan bahwa jika salah satu dari kita berperang dengan [SOV.GetNameDef], pihak lainnya juga akan ikut berperang. Tentunya ini kesempatan yang terlalu bagus untuk dilewatkan?"
 SEA_japan_foreign_policy.82.a: "Apa pun untuk teman [FROM.GetAdjective] kita!"
 SEA_japan_foreign_policy.82.b: "Hal ini menempatkan kita dalam bahaya yang terlalu besar"
 SEA_japan_foreign_policy.83.t: "[FROM.GetLeader] Menandatangani Pakta"
 SEA_japan_foreign_policy.83.desc: "Teman baik kami di [FROM.GetNameDef] telah dengan senang hati menerima tawaran kami untuk menjalin perjanjian anti-[SOV.GetAdjective]. Saat ini para delegasi sedang menandatangani dokumen-dokumen yang diperlukan untuk mewujudkan perjanjian tersebut, dan persiapan untuk melakukan invasi cepat terhadap [SOV.GetNameDef] jika diperlukan juga sedang dilakukan."
 SEA_japan_foreign_policy.83.a: "Bagus sekali!"
 SEA_japan_foreign_policy.84.t: "[FROM.GetLeader] Menolak Pakta"
 SEA_japan_foreign_policy.84.desc: "Sayangnya, terlepas dari upaya historis kami untuk meningkatkan hubungan antara kedua negara, [FROM.GetLeader] telah menolak proposal kami untuk pakta anti-[SOV.GetAdjective]. Perjanjian ini dinyatakan terlalu berbahaya bagi negara [FROM.GetAdjective] jika perjanjian tersebut diketahui oleh agen [SOV.GetAdjective]."
 SEA_japan_foreign_policy.84.a: "Mungkin isolasi kedua akan bermanfaat bagi kita..."
 SEA_japan_foreign_policy.85.t: "Panggil Anggota Pakta untuk Berperang"
 SEA_japan_foreign_policy.85.d: "Seperti yang kita duga ketika menandatangani Pakta Anti-Soviet, kita kini berada dalam keadaan perang dengan Uni Soviet. Sudah waktunya bagi para penandatangan untuk menepati janji mereka dan bergabung dengan kami."
 SEA_japan_foreign_policy.85.a: "Pandangan ke depan kami membuahkan hasil."
 SEA_japan_foreign_policy.86.t: "[From.GetNameDefCap] Menyerukan Anggota Pakta untuk Berperang"
 SEA_japan_foreign_policy.86.desc: "Pakta Anti-Soviet Polandia-Jepang menetapkan bahwa semua negara penandatangan harus ikut serta dalam konflik defensif apa pun dengan Uni Soviet. [From.GetName] kini telah diserang oleh Soviet dan telah mengirimkan permintaan kepada semua anggota pakta untuk segera memberikan bantuan. Ini saatnya menunjukkan dedikasi [Root.GetAdjective] untuk melindungi dunia dari ancaman Uni Soviet untuk selamanya."
 SEA_japan_foreign_policy.86.a: "[From.GetNameDefCap] tidak berdiri sendiri!"
 SEA_japan_foreign_policy.86.b: "Ini bukan perang kita."
 SEA_japan_foreign_policy.86.b_tt: "§YHal ini akan dianggap sebagai pengkhianatan oleh semua negara yang menghormati pakta tersebut (§!§R-50§!§Yopini)§!"
 SEA_japan_foreign_policy.87.t: "Lampiran [FROM.GetAdjective]"
 SEA_japan_foreign_policy.87.desc: "Setelah Asosiasi Concordia baru-baru ini menyetujui tuntutan Kōdōha, hanya masalah waktu saja sebelum hal ini terjadi. Hari ini, delegasi [FROM.GetAdjective] tiba dengan membawa dokumen untuk memfasilitasi integrasi penuh kami ke negara mereka, sesuatu yang telah ditandatangani oleh delegasi kami sendiri."
 SEA_japan_foreign_policy.87.a: "Itu adalah apa yang kami tanda tangani"
 SEA_japan_foreign_policy.88.t: "Lampiran [FROM.GetNameDef]"
 SEA_japan_foreign_policy.88.desc: "[FROM.GetLeader], pemimpin [FROM.GetNameDef] telah menerima integrasi penuh ke dalam negara kita hari ini. Ini berarti bahwa pemerintah kita akhirnya dapat memegang kendali penuh bahkan atas divisi lokal di wilayah Manchuria."
 SEA_japan_foreign_policy.88.a: "Luar biasa"
 SEA_japan_foreign_policy.89.t: "Industri Penawaran [FROM.GetAdjective] untuk Sumber Daya"
 SEA_japan_foreign_policy.89.desc: "Kami telah menerima tawaran dari [FROM.GetNameDef]. Mereka tertarik pada perdagangan sumber daya jangka panjang dengan imbalan sebagian kapasitas industri mereka. Saat ini mereka sedang mengincar sejumlah sumber daya di [FROM.FROM.GetName]."
 SEA_japan_foreign_policy.89.a: "Mengapa tidak?"
 SEA_japan_foreign_policy.89.b: "Ini bukan saat yang tepat"
 SEA_japan_foreign_policy.90.t: "[FROM.GetAdjective] Perjanjian Perdagangan Industri"
 SEA_japan_foreign_policy.90.desc: "Kami telah menerima kabar dari [FROM.GetAdjective] tentang permintaan kami kepada industri perdagangan sebagai imbalan atas sebagian sumber daya mereka. Tampaknya kami sepakat mengenai manfaat kesepakatan ini dan mereka dengan senang hati menyetujui persyaratannya. Kami akan segera menerima sumber dayanya."
 SEA_japan_foreign_policy.90.a: "Bagus"
 SEA_japan_foreign_policy.91.t: "[FROM.GetAdjective] Tolak Kesepakatan Perdagangan Industri"
 SEA_japan_foreign_policy.91.desc: "Meskipun sebagian besar netral mengenai kesepakatan yang kami sarankan, [FROM.GetAdjective] pada akhirnya memilih untuk menolak proposal industri perdagangan kami dengan imbalan sumber daya. Mereka mengklaim bahwa ini bukan saat yang tepat, sehingga sepertinya kami bisa mencapai kesepakatan di masa depan, setelah kami semakin memperkuat hubungan kami."
 SEA_japan_foreign_policy.91.a: "Jika pada awalnya Anda tidak berhasil..."
 SEA_japan_foreign_policy.92.t: "[FROM.GetAdjective] Keinginan untuk Mempererat Hubungan"
 SEA_japan_foreign_policy.92.desc: "Para diplomat yang tergabung dalam [FROM.GetNameDef] telah menghubungi kami mengenai penguatan hubungan kami, sesuatu yang dibatasi oleh faksi militer di negara mereka, sesuatu yang kini telah ditangani. Mereka menginginkan perjanjian perdagangan, penelitian dan pertahanan. Entah kita bisa menandatangani salah satu dari hal ini, atau kita bisa menerima semuanya. Sepertinya bukan ide yang baik untuk mengabaikan mereka sepenuhnya, setelah semua upaya yang mereka lakukan untuk sampai ke sini."
 SEA_japan_foreign_policy.92.a: "Hubungan dapat diperkuat melalui perdagangan"
 SEA_japan_foreign_policy.92.b: "Kami melihat tidak perlunya perjanjian..."
 SEA_japan_foreign_policy.92.c: "Kita harus membuat perjanjian pertahanan yang tepat dengan mereka"
 SEA_japan_foreign_policy.92.d: "Kita harus menandatangani semua perjanjian yang diusulkan!"
 SEA_japan_foreign_policy.93.t: "[FROM.GetLeader] Menandatangani Perjanjian Kerjasama"
 SEA_japan_foreign_policy.93.desc: "Pemimpin [FROM.GetNameDef], [FROM.GetLeader], telah menerima salah satu proposal kami, setuju untuk membangun hubungan perdagangan dan penelitian yang lebih dekat dengan negara kita. Ini adalah hari yang menyenangkan bagi [ROOT.GetNameDef] dan pencapaian diplomasinya!"
 SEA_japan_foreign_policy.93.a: "Luar biasa!"
 SEA_japan_foreign_policy.94.t: "[FROM.GetLeader] Tidak Menandatangani Perjanjian apa pun"
 SEA_japan_foreign_policy.94.desc: "Pemimpin [FROM.GetNameDef], [FROM.GetLeader], telah menolak semua usulan kami, sehingga menutup gagasan tentang hubungan yang lebih erat antar negara. Ini adalah hari yang kelam bagi [ROOT.GetNameDef] dan pencapaian diplomasinya..."
 SEA_japan_foreign_policy.94.a: "Mengerikan"
 SEA_japan_foreign_policy.95.t: "[FROM.GetLeader] Menandatangani Perjanjian Pertahanan"
 SEA_japan_foreign_policy.95.desc: "Pemimpin [FROM.GetNameDef], [FROM.GetLeader], telah menerima salah satu proposal kami, setuju untuk membuat pakta pertahanan dengan negara kami, di mana kami berdua berjanji untuk membantu satu sama lain jika ada yang diserang. Ini adalah hari yang menyenangkan bagi [ROOT.GetNameDef] dan pencapaian diplomasinya!"
 SEA_japan_foreign_policy.95.a: "Luar biasa!"
 SEA_japan_foreign_policy.96.t: "[FROM.GetLeader] Menandatangani Perjanjian Diplomatik Komprehensif"
 SEA_japan_foreign_policy.96.desc: "Pemimpin [FROM.GetNameDef], [FROM.GetLeader], telah menerima semua proposal kami, setuju untuk membangun hubungan perdagangan dan penelitian dan pengembangan yang lebih erat, serta membuat pakta pertahanan dengan negara kita, di mana kita berdua berjanji untuk saling membantu jika salah satu diserang. Ini adalah hari yang menyenangkan bagi [ROOT.GetNameDef] dan pencapaian diplomasinya!"
 SEA_japan_foreign_policy.96.a: "Luar biasa!"
 jap_usa_japan_research_name: "Perjanjian Penelitian Amerika-Jepang"
 jap_usa_japan_research_desc: "Perjanjian penelitian antara ilmuwan Amerika dan Jepang."
 SEA_japan_foreign_policy.97.t: "[FROM.GetNameDefCap] Meminta Perjanjian Perdagangan"
 SEA_japan_foreign_policy.97.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah mengirim diplomat ke ibu kota kami untuk membahas prospek hubungan dagang yang rumit dengan negara [FROM.GetAdjective]. Hal ini akan mendekatkan hubungan kita, namun juga memungkinkan mereka mengakses sumber daya kita dengan harga yang lebih murah, yang berisiko merugikan perekonomian kita."
 SEA_japan_foreign_policy.97.a: "Kami tidak melihat ada masalah dengan hal ini"
 SEA_japan_foreign_policy.97.b: "Anda dapat membawa surat-surat Anda kembali ke Tokyo!"
 SEA_japan_foreign_policy.98.t: "[FROM.GetNameDefCap] Menyetujui Proposal Perdagangan"
 SEA_japan_foreign_policy.98.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah merespons dengan baik proposal kami untuk perdagangan yang lebih murah antar negara, dan telah menandatangani dokumen yang diperlukan untuk memfasilitasi agar hal ini segera berlaku. Mereka memiliki visi yang sama tentang masa depan cerah bagi seluruh Asia!"
 SEA_japan_foreign_policy.98.a: "Luar biasa"
 SEA_japan_foreign_policy.99.t: "[FROM.GetNameDefCap] Menolak Proposal Perdagangan"
 SEA_japan_foreign_policy.99.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi dengan keras permintaan kami untuk perdagangan yang lebih murah dalam aliansi kami, dan mengancam akan menetapkan tarif jika kami mencoba untuk memaksakan masalah tersebut. Tampaknya [FROM.GetNameDef] tidak akan menjadi bagian dari masa depan cerah yang kita impikan."
 SEA_japan_foreign_policy.99.a: "Sungguh menyedihkan!"
 SEA_japan_foreign_policy.100.t: "[FROM.GetNameDefCap] Mengundang kami ke Serikat Mata Uang"
 SEA_japan_foreign_policy.100.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menghubungi kami dengan tawaran agar kami bergabung dengan serikat mata uang bersama mereka, yang tidak akan menghasilkan apa-apa selain memperkuat perekonomian kedua negara kami. Kedengarannya seperti kesepakatan yang terlalu bagus untuk dilewatkan, bukan?"
 SEA_japan_foreign_policy.100.a: "Kami akan dengan senang hati menerimanya"
 SEA_japan_foreign_policy.100.b: "Kedengarannya mencurigakan bagiku..."
 SEA_japan_foreign_policy.101.t: "[FROM.GetNameDefCap] Bergabung dengan Serikat Mata Uang"
 SEA_japan_foreign_policy.101.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah merespons dengan baik proposal kami untuk pembentukan mata uang bersama di antara negara-negara kita, dan telah menandatangani dokumen yang diperlukan untuk memfasilitasi agar hal ini segera berlaku. Mereka memiliki visi yang sama tentang masa depan cerah bagi seluruh Asia!"
 SEA_japan_foreign_policy.101.a: "Luar biasa"
 SEA_japan_foreign_policy.102.t: "[FROM.GetNameDefCap] Menolak Persatuan Mata Uang"
 SEA_japan_foreign_policy.102.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi dengan keras permintaan kami untuk mengadopsi mata uang bersama dalam aliansi kami, dan mengancam akan menetapkan tarif jika kami mencoba untuk memaksakan masalah tersebut. Tampaknya [FROM.GetNameDef] tidak akan menjadi bagian dari masa depan cerah yang kita impikan."
 SEA_japan_foreign_policy.102.a: "Sungguh menyedihkan!"
 SEA_japan_foreign_policy.103.t: "[FROM.GetNameDefCap] Menuntut Integrasi Ekonomi"
 SEA_japan_foreign_policy.103.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah tiba di ibu kota kami hari ini untuk menyampaikan penawaran kepada kami. Mereka berharap agar kita meningkatkan aktivitas serikat mata uang dan memajukan integrasi ekonomi kita dengan mereka. Ini akan membantu perekonomian kita secara signifikan, tapi ada sesuatu yang mencurigakan dalam semua ini..."
 SEA_japan_foreign_policy.103.a: "Terlalu bagus untuk dilewatkan"
 SEA_japan_foreign_policy.103.b: "Kami tidak akan melepaskan kemandirian ekonomi kami!"
 SEA_japan_foreign_policy.104.t: "[FROM.GetNameDefCap] Menerima tawaran kami"
 SEA_japan_foreign_policy.104.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi dengan baik tawaran kami, dan diplomat mereka telah tiba di negara kami untuk menandatangani dokumen yang diperlukan guna memfasilitasi integrasi ekonomi lebih lanjut."
 SEA_japan_foreign_policy.104.a: "Kami berterima kasih atas kenaifan mereka"
 SEA_japan_foreign_policy.105.t: "[FROM.GetNameDefCap] Menolak tawaran kami"
 SEA_japan_foreign_policy.105.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menanggapi undangan integrasi kami dengan sangat tidak senang, dan mengklaim bahwa kemitraan ekonomi apa pun yang lebih erat antara negara kita tidak akan dan selamanya tidak akan dilakukan. Mungkin mereka bisa melihat apa yang kami sediakan untuk mereka..."
 SEA_japan_foreign_policy.105.a: "Berita buruk..."
 SEA_japan_foreign_policy.106.t: "[FROM.GetNameDefCap] Mengintegrasikan Perekonomian kita"
 SEA_japan_foreign_policy.106.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah melangkah lebih jauh dari yang dijanjikan pada awalnya, dan memanipulasi pasar untuk semakin meningkatkan ketergantungan kita pada perekonomian mereka, sebagai langkah untuk memastikan kita tidak menyimpang dari jalur mereka. Jika kita tidak segera melepaskan diri dari mereka, praktis ini akan menjadi akhir dari status kita sebagai bangsa yang merdeka. Bagaimana kita melakukan hal ini?"
 SEA_japan_foreign_policy.106.a: "Kami harus menerima situasinya"
 SEA_japan_foreign_policy.106.b: "Kemenangan atau kematian!"
 SEA_japan_foreign_policy.107.t: "[FROM.GetNameDefCap] Menerima Integrasi Lebih Lanjut"
 SEA_japan_foreign_policy.107.desc: "Berita gembira bahwa kepemimpinan di [FROM.GetNameDef] telah memilih untuk lebih berintegrasi dengan kami telah disambut dengan tepuk tangan meriah di Diet hari ini. Apa yang dapat kami tawarkan sudah cukup jelas bagi mereka untuk menganggap tawaran tersebut menguntungkan meskipun terdapat sedikit dampak buruk terhadap kedaulatan mereka."
 SEA_japan_foreign_policy.107.a: "Hebat!"
 SEA_japan_foreign_policy.108.t: "[FROM.GetNameDefCap] Menolak Integrasi Lebih Lanjut"
 SEA_japan_foreign_policy.108.desc: "Meskipun terdapat keuntungan nyata dan jelas merupakan yang terbaik bagi serikat pekerja, [FROM.GetNameDef] telah menolak proposal kami untuk integrasi lebih lanjut. Kita hanya bisa berspekulasi mengenai alasan mereka, namun nampaknya mereka tidak mempertimbangkan kepentingan terbaik serikat pekerja."
 SEA_japan_foreign_policy.108.a: "Hal-hal tersebut merupakan risiko bagi kesatuan organisasi!"
 SEA_japan_foreign_policy.108.b: "Kami akan terus mengawasi mereka"
 SEA_japan_foreign_policy.109.t: "[FROM.GetNameDefCap] Menuntut Integrasi Total"
 SEA_japan_foreign_policy.109.desc: "Mengintegrasikan perekonomian kita tampaknya tidak cukup untuk memuaskan [FROM.GetAdjective], karena [FROM.GetLeader] dari [FROM.GetNameDef] saat ini telah melangkah lebih jauh dari yang dijanjikan pada awalnya, dan kini menuntut integrasi total kita ke dalam negara mereka. Jika kita tidak segera melepaskan diri dari mereka, maka berakhirlah status kita sebagai bangsa yang merdeka. Bagaimana kita melakukan hal ini?"
 SEA_japan_foreign_policy.109.a: "Kami harus menerima situasinya"
 SEA_japan_foreign_policy.109.b: "Kemenangan atau kematian!"
 SEA_japan_foreign_policy.110.t: "[FROM.GetNameDefCap] Menerima Integrasi Total"
 SEA_japan_foreign_policy.110.desc: "Berita gembira bahwa para pemimpin di [FROM.GetNameDef] telah membiarkan diri mereka berintegrasi ke dalam negara kita telah disambut dengan tepuk tangan meriah di Diet hari ini. Apa yang bisa kami tawarkan sudah cukup jelas bagi mereka untuk menganggap tawaran itu menguntungkan meskipun kedaulatan mereka sudah berakhir."
 SEA_japan_foreign_policy.110.a: "Hebat!"
 SEA_japan_foreign_policy.111.t: "[FROM.GetNameDefCap] Menolak Integrasi Total"
 SEA_japan_foreign_policy.111.desc: "Meskipun terdapat keuntungan nyata dan jelas merupakan yang terbaik bagi serikat pekerja, [FROM.GetNameDef] telah menolak proposal kami untuk integrasi total. Kita hanya bisa berspekulasi mengenai alasan mereka, namun nampaknya mereka tidak memikirkan kepentingan terbaik serikat pekerja."
 SEA_japan_foreign_policy.111.a: "Hal-hal tersebut merupakan risiko bagi kesatuan organisasi!"
 SEA_japan_foreign_policy.111.b: "Kami akan terus mengawasi mereka"
 SEA_japan_foreign_policy.112.t: "[FROM.GetNameDefCap] Meminta Kontrol atas Koloni Asia kita"
 SEA_japan_foreign_policy.112.desc: "Para diplomat yang tergabung dalam [FROM.GetNameDef] telah mengusulkan perjanjian di mana mereka diberikan kekuasaan atas rakyat kita di Burma dan Malaysia sebagai imbalan atas hak sumber daya di beberapa wilayah penting, mengklaim bahwa ini adalah bagian dari doktrin Penjaga Pasifik mereka, mengklaim bahwa hal ini akan memungkinkan kita untuk fokus pada Eropa dan Afrika sementara mereka melindungi Asia dari komunisme. Bagaimana menurut kita?"
 SEA_japan_foreign_policy.112.a: "Hal ini memungkinkan kami untuk memfokuskan upaya kami pada bidang lain"
 SEA_japan_foreign_policy.112.b: "Kompromi pada Kekaisaran kita? Tidak pernah!"
 SEA_japan_foreign_policy.113.t: "[FROM.GetNameDefCap] Mentransfer Koloni Asia Mereka"
 SEA_japan_foreign_policy.113.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah dengan senang hati menerima tawaran kami, dan telah menandatangani dokumen untuk memfasilitasi penyerahan koloni mereka di Malaysia dan Burma kepada kami, dengan imbalan mempertahankan kendali atas sumber daya alam penting di wilayah tersebut. Hari ini adalah hari yang menyenangkan bagi masyarakat Asia!"
 SEA_japan_foreign_policy.113.a: "Kami akan menjaga Pasifik untuk mereka"
 SEA_japan_foreign_policy.114.t: "[FROM.GetNameDefCap] Menolak Permintaan kami"
 SEA_japan_foreign_policy.114.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menunjukkan hal yang memalukan, dan menunjukkan kepada kita betapa kabur dan rusaknya pola pikir orang barat. Kami membuat kesepakatan yang tidak bisa mereka tolak, yang akan membuat Asia menjadi tempat yang lebih baik, namun entah bagaimana mereka menemukan jalannya. Hari ini adalah hari yang kelam bagi aliansi kita."
 SEA_japan_foreign_policy.114.a: "Orang barat yang sombong..."
 ENG_will_gain_resource_right_we_tt: "Kami akan mendapatkan hak sumber daya ke beberapa negara bagian di negara yang ditransfer"
 SEA_japan_foreign_policy.115.t: "[From.GetNameDefCap] Menginginkan Kekuasaan Atas Salah Satu Koloni Kita"
 SEA_japan_foreign_policy.115.desc: "Memanfaatkan peluang yang diberikan oleh kelemahan kami, [From.GetAdjective] telah menawarkan untuk 'membantu' kami 'menjaga ketertiban' di koloni kami. Mereka berpendapat bahwa, dengan dunia yang terbakar di tempat lain, kita tidak mempunyai kemungkinan untuk mempertahankan kekuasaan kita atas wilayah-wilayah ini.\n\nIni jelas merupakan sebuah taktik untuk merebut kendali atas koloni-koloni kita, tapi pilihan apa yang kita punya?"
 SEA_japan_foreign_policy.115.a: "Sudah saatnya kita menerima dominasi Jepang di Asia"
 SEA_japan_foreign_policy.115.b: "Mereka harus mengambilnya dengan paksa!"
 SEA_japan_foreign_policy.116.t: "[From.GetNameDefCap] Memberikan Kekuasaan Koloni"
 SEA_japan_foreign_policy.116.desc: "[From.GetNameDefCap] telah mempertimbangkan dengan cermat tawaran kami untuk 'menjaga ketertiban' di koloni mereka, dan memutuskan untuk menerimanya. Mereka secara efektif telah mengalihkan kendali penuh atas subjek mereka kepada kita."
 SEA_japan_foreign_policy.116.a: "Keputusan yang bijaksana"
 SEA_japan_foreign_policy.117.t: "[From.GetNameDefCap] Menolak Kekuasaan Koloni"
 SEA_japan_foreign_policy.117.desc: "[From.GetNameDefCap] telah mempertimbangkan dengan cermat tawaran kami untuk 'menjaga ketertiban' di koloni mereka, dan memutuskan untuk menolaknya. Tampaknya mereka tidak memikirkan kepentingan terbaik masyarakat Asia."
 SEA_japan_foreign_policy.117.a: "Kita akan melihat bagaimana hal itu berjalan baik bagi mereka"
 SEA_japan_foreign_policy.117.b: "Maka kita akan membebaskan mereka dengan paksa!"
 SEA_japan_foreign_policy.118.t: "[FROM.GetNameDefCap] Mengundang kami ke Aliansi Mereka"
 SEA_japan_foreign_policy.118.desc: "Delegasi dari jauh baru-baru ini tiba di ibu kota kami, mencari audiensi dengan [ROOT.GetLeader]. Mereka mengaku berasal dari [FROM.GetNameDef], dan mencari aliansi antar negara kita. Apakah kita menerimanya?"
 SEA_japan_foreign_policy.118.a: "Kita akan menjadi lebih kuat bersama-sama"
 SEA_japan_foreign_policy.118.b: "Itu akan bertentangan dengan prinsip netralitas kami..."
 SEA_japan_foreign_policy.119.t: "[FROM.GetNameDefCap] Menerima Undangan kami"
 SEA_japan_foreign_policy.119.desc: "[FROM.GetLeader] telah dengan senang hati menerima tawaran kami untuk meresmikan aliansi antar negara, dan telah memulai inisiatif untuk berintegrasi ke dalam lingkungan kita. Hari ini adalah hari untuk perayaan!"
 SEA_japan_foreign_policy.119.a: "Mereka berbagi visi kami untuk masa depan"
 SEA_japan_foreign_policy.120.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_japan_foreign_policy.120.desc: "[FROM.GetLeader] dengan kasar memutuskan untuk menolak tawaran aliansi antar negara kita, dengan menyatakan bahwa hal itu akan melanggar prinsip netralitas mereka. Kita hanya bisa membayangkan besarnya korupsi yang menyebabkan keputusan yang salah ini."
 SEA_japan_foreign_policy.120.a: "Itu kerugian mereka"
 SEA_japan_foreign_policy.121.t: "[FROM.GetNameDefCap] Mentransfer kami ke Kontrol [JAP.GetAdjective]"
 SEA_japan_foreign_policy.121.desc: "[FROM.GetLeader], mantan penguasa kita, telah menandatangani dokumen yang memfasilitasi penyerahan kendali negara kita kepada [JAP.GetNameDef]. Tampaknya kita telah ditempatkan di bawah perlindungan negara besar lainnya. Kami sekarang memiliki Tuan baru yang menurut keinginannya kami akan ditundukkan."
 SEA_japan_foreign_policy.121.a: "Oh..."
 SEA_japan_foreign_policy.122.t: "Pertukaran Jenderal [From.GetAdjective]"
 SEA_japan_foreign_policy.122.desc: "[From.GetAdjective] telah memutuskan untuk memanggil kembali pegawai negeri sipil dan jenderal mereka yang berhaluan kiri, dan malah mengirimkan kepada kami jenderal dan pegawai negeri mereka yang berhaluan kanan ke pengasingan tidak resmi."
 SEA_japan_foreign_policy.122.a: "Tampaknya ada sesuatu yang terjadi di [From.GetNameDef]..."
 SEA_japan_foreign_policy.123.t: "[Root.GetAdjective] Pertukaran Umum"
 SEA_japan_foreign_policy.123.desc: "Proses penukaran para jenderal dan pegawai negeri sipil kami yang berhaluan kanan dengan para jenderal berhaluan kiri yang sebelumnya kami kirim ke pengasingan tidak resmi di [From.GetNameDef] kini telah selesai."
 SEA_japan_foreign_policy.123.a: "Hal ini akan memperkuat cengkeraman kami atas [Root.GetNameDef]."
 SEA_japan_foreign_policy.124.t: "[FROM.GetNameDefCap] Mengundang kami ke The Fifth International"
 SEA_japan_foreign_policy.124.desc: "Delegasi dari jauh baru-baru ini tiba di ibu kota kami, mencari audiensi dengan [ROOT.GetLeader]. Mereka mengaku berasal dari [FROM.GetNameDef], dan mencari aliansi antar negara kita. Apakah kita menerimanya?"
 SEA_japan_foreign_policy.124.a: "Kita akan menjadi lebih kuat bersama-sama"
 SEA_japan_foreign_policy.124.b: "Itu akan bertentangan dengan prinsip netralitas kami..."
 SEA_japan_foreign_policy.125.t: "[FROM.GetNameDefCap] Menerima Undangan kami"
 SEA_japan_foreign_policy.125.desc: "[FROM.GetLeader] telah dengan senang hati menerima tawaran kami untuk meresmikan aliansi antar negara, dan telah memulai inisiatif untuk berintegrasi ke dalam lingkungan kita. Hari ini adalah hari untuk perayaan!"
 SEA_japan_foreign_policy.125.a: "Mereka berbagi visi kami untuk masa depan"
 SEA_japan_foreign_policy.126.t: "[FROM.GetNameDefCap] Menolak untuk Bergabung dengan Kami"
 SEA_japan_foreign_policy.126.desc: "[FROM.GetLeader] dengan kasar memutuskan untuk menolak tawaran aliansi antar negara kita, dengan menyatakan bahwa hal itu akan melanggar prinsip netralitas mereka. Kita hanya bisa membayangkan besarnya korupsi yang menyebabkan keputusan yang salah ini."
 SEA_japan_foreign_policy.126.a: "Itu kerugian mereka"
 SEA_japan_foreign_policy.127.t: "[FROM.GetNameDefCap] Bergabung dengan Internasional Kelima"
 SEA_japan_foreign_policy.127.desc: "[FROM.GetLeader] yang pengkhianat telah membuat kita lebih memilih komunis di [JAP.GetNameDef], sehingga melanggar perjanjian yang ditandatangani antara negara kita pada akhir perang saudara di Rusia. Haruskah kita menghukum mereka karena perilaku mereka yang tidak bertanggung jawab?"
 SEA_japan_foreign_policy.127.a: "Tidak, kita harus melepaskan ini..."
 SEA_japan_foreign_policy.127.b: "Ya, mereka akan membayarnya!"
 SEA_japan_foreign_policy.128.t: "[FROM.GetLeader] Menuntut Pengajuan kami"
 SEA_japan_foreign_policy.128.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut agar negara ilegal kami yang memisahkan diri sekali lagi tunduk pada peraturan otoritas pusat di Tokyo, dan kembali ke lingkup [FROM.GetAdjective]. Bagaimana seharusnya kita menanggapi ancaman yang nyata ini?"
 SEA_japan_foreign_policy.128.a: "Kami tidak mempunyai kekuatan untuk menolak tuntutan mereka"
 SEA_japan_foreign_policy.128.b: "Kami akan bertarung sampai orang terakhir!"
 SEA_japan_foreign_policy.129.t: "[FROM.GetLeader] Menyetujui Permintaan kami"
 SEA_japan_foreign_policy.129.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah dengan cerdas menerima tuntutan kami dan tunduk pada otoritas kami, sekali lagi membawa negara [FROM.GetAdjective] kembali ke dalam lingkup pengaruh kami. Kita berdiri sebagai pemenang pada hari ini, karena rakyat [FROM.GetAdjective] kini telah dibebaskan dari kediktatoran borjuis mereka!"
 SEA_japan_foreign_policy.129.a: "Cemerlang"
 SEA_japan_foreign_policy.130.t: "[FROM.GetLeader] Menolak Permintaan kami"
 SEA_japan_foreign_policy.130.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] sayangnya telah menolak tuntutan kami untuk tunduk, dengan menyatakan bahwa keinginan rakyat adalah untuk demokrasi yang mandiri dan bukan negara revolusioner dalam lingkup [ROOT.GetAdjective]. Mereka telah membuat pilihan yang salah..."
 SEA_japan_foreign_policy.130.a: "Maka kita harus merebut kembali wilayah kita dengan paksa!"
 SEA_japan_foreign_policy.131.t: "[FROM.GetNameDefCap] Memicu Perang Saudara di [ROOT.GetNameDef]"
 SEA_japan_foreign_policy.131.desc: "Setelah seruan baru-baru ini dari pemerintah [FROM.GetAdjective] dan para agitator seperti Pak Hon-yong, nampaknya kaum proletar [ROOT.GetAdjective] sudah bosan menunggu pergantian pemerintahan secara damai. Setelah wacana yang intens nampaknya diplomasi telah gagal dan konflik bersenjata pun terjadi, dengan pasukan Hon-yong telah menguasai bagian selatan negara tersebut."
 SEA_japan_foreign_policy.131.a: "Untuk Proletariat!"
 SEA_japan_foreign_policy.131.b: "Kita harus menghentikan kebodohan ini!"
 SEA_japan_foreign_policy.132.t: "[FROM.GetLeader] Menuntut Pengajuan kami"
 SEA_japan_foreign_policy.132.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menuntut agar kediktatoran borjuis kita tunduk pada kekuasaan otoritas komunis pusat di Tokyo, dan mengizinkan rakyat negara kita untuk mengatur diri mereka sendiri dengan benar, sebagai bagian setia dari lingkungan [FROM.GetAdjective]. Bagaimana seharusnya kita menanggapi ancaman yang nyata ini?"
 SEA_japan_foreign_policy.132.a: "Kami tidak mempunyai kekuatan untuk menolak tuntutan mereka"
 SEA_japan_foreign_policy.132.b: "Kami akan bertarung sampai orang terakhir!"
 SEA_japan_foreign_policy.133.t: "[FROM.GetLeader] Menyetujui Permintaan kami"
 SEA_japan_foreign_policy.133.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima permintaan kami dan tunduk pada otoritas kami, sehingga membawa negara [FROM.GetAdjective] ke dalam lingkup pengaruh kami. Kita berdiri sebagai pemenang pada hari ini, karena rakyat [FROM.GetAdjective] kini telah dibebaskan dari kediktatoran borjuis mereka!"
 SEA_japan_foreign_policy.133.a: "Cemerlang"
 SEA_japan_foreign_policy.134.t: "[FROM.GetLeader] Menolak Permintaan kami"
 SEA_japan_foreign_policy.134.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] sayangnya telah menolak tuntutan kami untuk tunduk, dengan menyatakan bahwa keinginan rakyat adalah untuk negara merdeka dan bukan negara revolusioner dalam lingkup [ROOT.GetAdjective]. Mereka telah membuat pilihan yang salah..."
 SEA_japan_foreign_policy.134.a: "Maka kita harus membebaskan rakyat mereka dengan paksa!"
 SEA_japan_foreign_policy.135.t: "Proklamasi Republik Filipina Kedua"
 SEA_japan_foreign_policy.135.desc: "Sebelumnya hari ini, [ROOT.GetLeader] dan berbagai [JAP.GetAdjective] mengadakan proklamasi bersama, mendeklarasikan pembentukan negara bagian [ROOT.GetAdjective] yang baru. Kami akan menang melawan semua musuh kami!"
 SEA_japan_foreign_policy.135.a: "Kemakmuran sudah di depan mata!"
 SEA_japan_foreign_policy.136.t: "Serangan di Pearl Harbor"
 SEA_japan_foreign_policy.136.desc: "Kemarin, tanggal yang akan hidup dalam keburukan, [ROOT.GetNameDef] tiba-tiba dan sengaja diserang oleh angkatan laut dan udara [JAP.GetNameDef]. [ROOT.GetNameDefCap] telah berdamai dengan Negara tersebut dan, atas permintaan [JAP.GetNonIdeologyName], masih melakukan pembicaraan dengan Pemerintah dan Kaisarnya mengenai upaya menjaga perdamaian di Pasifik. Memang benar, satu jam setelah skuadron udara [JAP.GetAdjective] mulai melakukan pengeboman di [ROOT.GetAdjective] Pulau Oahu, Duta Besar [JAP.GetAdjective] untuk Amerika Serikat dan rekannya menyampaikan balasan resmi kepada Menteri Luar Negeri kami atas <span pesan Translate=\"no\">[ROOT.GetAdjective]</span>. Meskipun jawaban ini menyatakan bahwa tampaknya tidak ada gunanya melanjutkan perundingan diplomatik yang ada, jawaban tersebut tidak mengandung ancaman atau tanda-tanda perang atau serangan bersenjata. Tapi sekarang saatnya menghadapi kenyataan... Kita sedang berperang!"
 SEA_japan_foreign_policy.136.a: "Hari ini akan terus hidup dalam keburukan!"
 SEA_japan_foreign_policy.137.t: "Penggabungan dengan [MAN.GetNameDef]"
 SEA_japan_foreign_policy.137.desc: "[JAP.GetLeader] telah menuntut agar kami menggabungkan pemerintahan kami dengan [MAN.GetNameDef], sehingga mengakhiri kemerdekaan kami dan memberikan kepemimpinan kami posisi tinggi dalam pemerintahan [MAN.GetAdjective]. Apakah kita menerima usulan ini?"
 SEA_japan_foreign_policy.137.a: "[ROOT.GetLeader] akan mendapatkan posisi yang bagus, jadi kami menerimanya"
 SEA_japan_foreign_policy.137.b: "Itu akan menjadi akhir dari otonomi kita, bukan!"
 SEA_japan_foreign_policy.138.t: "[FROM.GetNameDefCap] Bergabung dengan Kami"
 SEA_japan_foreign_policy.138.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah menerima proposal [JAP.GetAdjective] untuk bergabung dengan pemerintah kami, dan tanah [FROM.GetAdjective] kini semuanya berada di bawah yurisdiksi kami. Ini adalah hari yang menyenangkan bagi kami!"
 SEA_japan_foreign_policy.138.a: "Pilihan yang Bijaksana"
 SEA_japan_foreign_policy.139.t: "[FROM.GetNameDefCap] Menolak Penggabungan"
 SEA_japan_foreign_policy.139.desc: "[FROM.GetLeader] yang dangkal telah menolak untuk melihat alasannya, dan telah menolak proposal kami untuk menggabungkan mereka ke dalam pemerintahan [MAN.GetAdjective]. Mungkin ada kesepakatan yang lebih baik, dan bahkan mungkin intimidasi dalam dosis yang tepat sudah dilakukan."
 SEA_japan_foreign_policy.139.a: "Sangat Memalukan"
 SEA_japan_foreign_policy.140.t: "[MAN.GetLeader] Berusaha Menggabungkan Administrasi Boneka"
 SEA_japan_foreign_policy.140.desc: "[MAN.GetLeader] telah meminta agar kami menggabungkan pemerintahan boneka Tiongkok lainnya dengan [MAN.GetNameDef], mengakhiri otonomi mereka dan memberikan tanah mereka kepada pemerintah [MAN.GetAdjective]. Apakah kita menerima usulan ini?"
 SEA_japan_foreign_policy.140.a: "Baiklah, ini membuat tugas administratif kita menjadi lebih sederhana"
 SEA_japan_foreign_policy.140.b: "Kedengarannya mencurigakan"
 SEA_japan_foreign_policy.141.t: "[JAP.GetLeader] Menolak Proposal kami"
 SEA_japan_foreign_policy.141.desc: "[JAP.GetLeader] telah sepenuhnya menolak permintaan kami untuk menggabungkan pemerintahan boneka Tiongkok lainnya dengan pemerintahan kami. Tampaknya masih terlalu dini bagi pemerintah untuk menerima langkah tersebut."
 SEA_japan_foreign_policy.141.a: "Kita harus mencobanya lagi nanti..."
 SEA_japan_popup_events.1.t: "Genrikh Lyushkov Tiba di Manchuria"
 SEA_japan_popup_events.1.desc: "Agen kami telah menangkap seorang pembelot [SOV.GetAdjective] yang menyebut dirinya sebagai Genrikh Samoilovich Lyushkov di Posyet di perbatasan Manchuria. Tampaknya ia adalah perwira tinggi NKVD, dan tampaknya memiliki dokumen rahasia berharga tentang [SOV.GetAdjective] kekuatan militer di wilayah tersebut. Mengaku lolos dari Pembersihan Besar-besaran, mungkin ini adalah kesempatan berharga untuk mendapatkan wawasan tentang cara kerja [SOV.GetNameDef]?"
 SEA_japan_popup_events.1.a: "Ini berbau peluang!"
 SEA_japan_popup_events.1.b: "Kita tidak bisa mempercayai orang asing ini jujur"
 SEA_japan_popup_events.2.t: "Persaudaraan Pertahanan di Ambang Keruntuhan!"
 SEA_japan_popup_events.2.desc: "Setelah perselisihan internal baru-baru ini antara pimpinan Dōshikai, tampaknya organisasi tersebut akan runtuh. Dengan beberapa orang mengutip sikap tidak hormat yang terang-terangan oleh Kishi dan sekutunya terhadap Tōjō, serta berbagai rumor tentang potensi rencana pembunuhan yang beredar, suasananya mengandung kegelisahan yang besar. Belum lagi rumor bahwa Kishi berencana membentuk kediktatoran teknokratis yang bertentangan dengan keinginan kaisar dan IJA. Apakah yang terbaik adalah membiarkan pasangan ini pergi begitu saja, atau terlalu berharga untuk dilewatkan?"
 SEA_japan_popup_events.2.a: "Itu tidak dibuat untuk bertahan lama"
 SEA_japan_popup_events.2.b: "Kita harus mempertahankannya bagaimanapun caranya!"
 JAP_harakiri_debate_has_taken_place_flag: "Ketegangan antara §YPemerintah Sipil§! dan §YFraksi Militer§! telah mencapai titik puncaknya, dan §YDebat Harakiri§! telah terjadi"
 SEA_japan_popup_events.3.t: "Debat Harakiri"
 SEA_japan_popup_events.3.desc: "Pada sidang pleno Dewan Perwakilan Diet Kekaisaran hari ini, Hamada Kunimatsu, anggota Partai Rikken Seiyukai memberikan kritik pedas terhadap menteri militer Hisaichi Terauchi dan meningkatnya kekuatan faksi militer. Ketika dihadapkan oleh menteri karena tidak menghormati otoritas militer dan dianggap menghina kehormatan mereka, ia menjawab dengan 'Periksa transkripnya dan jika ada kata-kata yang menghina militer, saya akan melakukan seppuku dan meminta maaf kepada Anda. Jika tidak ada kata-kata seperti itu, Anda sendiri yang akan melakukan seppuku'. Setelah ini, Terauchi sangat marah dan memelototi Hamada dari panggung, menyebabkan kekacauan dengan teriakan marah yang terdengar di aula pertemuan."
 SEA_japan_popup_events.3.a: "Ini adalah bencana!"
 ### KODOHA EVENTS ###
 SEA_japan_popup_events.4.t: "Meyakinkan Kaisar"
 SEA_japan_popup_events.4.desc: "Kaisar kami telah menyatakan ketidaktertarikannya terhadap ambisi kami untuk Restorasi Showa dan pembentukan pemerintahan militer baru. Sepertinya dia masih berada di bawah pengaruh faksi kontrol, tapi jika dia tidak memihak kita, kita mungkin harus mengganti Yang Mulia Kaisar dengan saudaranya Yasuhito. Haruskah kita 'membujuk' dia untuk bergabung dengan kita atau mungkin lebih bijaksana membiarkan sejarah berjalan sebagaimana mestinya?"
 SEA_japan_popup_events.4.a: "Kita harus mendapatkan dukungannya, dengan cara apa pun yang diperlukan!"
 SEA_japan_popup_events.4.b: "Kami sudah mempertimbangkan kandidat lain"
 SEA_japan_popup_events.4.c: "Jika dia tidak mendukung kita, dia harus pergi..."
 SEA_japan_popup_events.5.t: "Hirohito Memutuskan untuk Mendukung Pemerintahan Baru"
 SEA_japan_popup_events.5.desc: "Setelah 'persuasi' yang cukup, nampaknya kaisar agung kami telah memutuskan untuk mendukung pemerintahan kami yang baru dibentuk, memberikan kami izin resmi untuk melanjutkan rencana Restorasi Showa kami. Ini akan memperkuat bangsa kita!"
 SEA_japan_popup_events.5.a: "Luar biasa!"
 SEA_japan_popup_events.6.t: "Hirohito Menolak Mendukung Pemerintahan Baru"
 SEA_japan_popup_events.6.desc: "Meskipun kami terus-menerus berusaha membujuk kaisar agung kami, sepertinya dia menolak untuk melihat alasannya. Meskipun kurang ideal, kami mengetahui bahwa hal ini mungkin terjadi, dan kami telah menyusun rencana untuk menghadapi skenario seperti ini. Saudaranya, Yasuhito, seorang jenderal di Angkatan Darat Kekaisaran Jepang adalah kandidat yang kami pikirkan untuk menggantikannya. Ini akan menjadi Sesshō untuk putra Hirohito, Akihito, atau sebagai kaisar baru, yang lebih sejalan dengan ideologi kami."
 SEA_japan_popup_events.6.a: "Kemudian dia harus turun tahta demi putranya"
 SEA_japan_popup_events.6.b: "Tempatkan dia sebagai tahanan rumah!"
 SEA_japan_popup_events.7.t: "Hirohito Dibunuh!"
 SEA_japan_popup_events.7.desc: "Sebelumnya hari ini petugas kami dilaporkan menemukan Kaisar Showa tewas di kediamannya. Mereka menyatakan bahwa dia dibunuh oleh agen asing, namun kita tidak dapat mengetahui secara pasti, karena kebenarannya mungkin lebih merugikan kita daripada manfaatnya bagi kita. Karena ancaman ini, militer telah mengumumkan darurat militer, dan menyatakan bahwa Pangeran Chichibu, jenderal Angkatan Darat Kekaisaran akan dinobatkan, karena akan terlalu berbahaya untuk melanjutkan suksesi dan memberikan mahkota kepada Akihito ketika para penyerang masih buron. Apakah ini bagian dari konspirasi yang lebih besar, atau memang ada penyerang asing?"
 SEA_japan_popup_events.7.a: "Yasuhito akan menggantikannya"
 SEA_japan_popup_events.8.t: "Soal Kepemimpinan Klik Militer"
 SEA_japan_popup_events.8.desc: "Dengan terbentuknya pemerintahan militer yang baru, pertanyaan mengenai kepemimpinan sekali lagi muncul. Pendiri Kōdōha Sadao Araki telah menyatakan bahwa ia ingin mengambil peran perdana menteri, dan telah mengajukan hal ini kepada kaisar, tetapi dengan Jinzaburō Masaki menjadi lebih populer di kalangan laki-laki dan masyarakat umum daripada Araki, mungkin lebih bijaksana untuk mengizinkannya berperan sebagai Perdana Menteri, sementara Araki hanya mengambil posisi seremonial. Apa yang harus kita lakukan?"
 SEA_japan_popup_events.8.a: "Masaki lebih populer di kalangan pria"
 SEA_japan_popup_events.8.b: "Araki harus dijadikan Sōtō bangsa"
 SEA_japan_popup_events.9.t: "Pertanyaan tentang Moralitas, Bushido dan Fasisme"
 SEA_japan_popup_events.9.desc: "Jenderal Sadao Araki, seorang filsuf politik terkenal di kalangan tentara, telah menghubungkan kode samurai Bushido kuno dengan ide-ide yang mirip dengan fasisme Eropa untuk membentuk landasan filosofis ideologinya, yang menghubungkan Kaisar, rakyat, tanah, dan moralitas sebagai satu kesatuan yang tidak dapat dipisahkan. Untuk memperkuat ide-ide ini, mungkin bijaksana untuk mengadopsi bentuk pemerintahan yang lebih mirip dengan negara-negara barat yang menjadi dasar model ideologisnya. Bagaimana menurut kita?"
 SEA_japan_popup_events.9.a: "Kita harus menjauhi konsep-konsep barat seperti itu!"
 SEA_japan_popup_events.9.b: "Araki benar, dan kita harus menerima gagasan itu"
 SEA_japan_popup_events.10.t: "Rumor Kudeta Militer"
 SEA_japan_popup_events.10.desc: "Baru-baru ini beredar rumor tentang kemungkinan kudeta yang direncanakan oleh faksi Kōdōha, sebuah faksi tradisionalis radikal di dalam angkatan bersenjata. Tampaknya mereka akan menunggu sampai persidangan Letnan Kolonel Saburō Aizawa selesai, dan dia menjadi bagian integral dari organisasi mereka. Mengetahui kemungkinan motif mereka, nampaknya mereka akan berusaha membunuh banyak orang yang mereka anggap sebagai ancaman terhadap nilai-nilai mereka selama kudeta ini. Kita mungkin perlu bertindak cepat, jangan sampai kita melihat pertumpahan darah dalam waktu dekat."
 SEA_japan_popup_events.10.a: "Sungguh tidak terhormat! Kita harus bertindak cepat!"
 SEA_japan_popup_events.11.t: "Rumor Pemberontakan Populer"
 SEA_japan_popup_events.11.desc: "Karena Kaisar masih dalam tahanan rumah meskipun kita sudah lama mendirikan pemerintahan, perbedaan pendapat tumbuh semakin cepat. Tampaknya masyarakat kita ingin melihat Hirohito dikembalikan ke tahtanya, dan mereka bahkan mungkin bersiap mengambil tindakan untuk membebaskannya jika kita tidak segera melakukan sesuatu untuk mengatasi situasi tersebut. Mungkin mereka akan sedikit tenang jika tidak ada sosok seperti itu yang bisa kembali naik takhta, betapapun tidak populernya kita yang mewujudkan hal tersebut. Bagaimana kita harus melakukan pendekatan terhadap hal ini?"
 SEA_japan_popup_events.11.a: "Perintah akan diberikan, tapi usahakan jangan meninggalkan bukti"
 SEA_japan_popup_events.11.b: "Tidak, mantan Kaisar harus hidup!"
 SEA_japan_popup_events.12.t: "Kaisar Ditemukan Mati di Kediamannya"
 SEA_japan_popup_events.12.desc: "Perdana menteri mengumumkan hari ini bahwa mantan Kaisar Showa baru-baru ini ditemukan meninggal di kediaman kekaisaran. Banyak yang menduga bahwa ini mungkin merupakan tindakan yang disengaja oleh militer untuk mencoba dan mengamankan kekuasaan mereka, meskipun klaim resminya adalah bahwa ia meninggal karena sebab alamiah, meskipun polisi Tokyo belum diizinkan masuk untuk memastikan penyebab kematiannya. Tentunya ini merupakan makar yang dilakukan pihak militer sendiri?"
 SEA_japan_popup_events.12.a: "Bangsa ini berduka"
 SEA_japan_popup_events.12.b: "Temukan Pelakunya, Nagako Tuntut Jawaban!"
 SEA_japan_popup_events.13.t: "Petugas Kōdōha Didakwa atas Pembunuhan Hirohito"
 SEA_japan_popup_events.13.desc: "Melalui penyelidikan baru-baru ini yang dilakukan oleh Polisi Metropolitan Tokyo atas perintah Nagako, istri mendiang Kaisar Showa, diketahui bahwa faksi Kōdōha memang bertanggung jawab atas pembunuhan berdarah dingin terhadap mantan Kaisar. Dengan lebih dari cukup alasan untuk menyatakan hal ini sebagai pengkhianatan tingkat tinggi, sekarang saatnya untuk menggulingkan kelompok pengkhianat ini dari kekuasaan."
 SEA_japan_popup_events.13.a: "Deklarasikan darurat militer, Nagako akan menyelesaikan ketidakstabilan negara!"
 SEA_japan_popup_events.14.t: "Kesimpulan Pemilihan Umum 1936"
 SEA_japan_popup_events.14.desc: "Meskipun masa-masa berbahaya, pemilihan umum telah selesai, dan rakyat kita telah memutuskan siapa yang akan mewakili mereka di Dewan Perwakilan Rakyat. Rikken Minseitō di bawah pimpinan Machida Chūji telah muncul dari pemilu sebagai partai terbesar, dengan Rikken Seiyūkai kehilangan mayoritasnya. Meskipun tidak terlalu penting karena jatuhnya kekuasaan pemerintahan sipil baru-baru ini, pemilu kali ini menunjukkan bahwa demokrasi kita masih bertahan, meskipun mungkin rapuh."
 SEA_japan_popup_events.14.a: "Semoga Machida Chūji memimpin Rikken Minseitō dengan baik"
 SEA_japan_popup_events.15.t: "Okada Dibunuh di Stasiun Tokyo"
 SEA_japan_popup_events.15.desc: "Pagi ini, Perdana Menteri Keisuke Okada ditembak mati oleh petugas polisi rahasia Tokkō saat menunggu untuk mengambil Jalur Yamanote di Stasiun Tokyo. Segera setelah itu, militer mengeluarkan ancaman terhadap Diet Kekaisaran, yang menyatakan bahwa segala upaya untuk mengecualikan mereka akan ditanggapi dengan kekerasan. Ini jelas merupakan peningkatan situasi, dan PM sementara Machida Chūji telah meminta Kaisar untuk mengakui situasi tersebut dan membuat pernyataan. Hanya waktu yang akan menentukan pihak mana yang akan dia pilih."
 SEA_japan_popup_events.15.a: "Mereka harus dihentikan!"
 SEA_japan_popup_events.16.t: "Kaisar Menominasikan Perdana Menteri baru"
 SEA_japan_popup_events.16.desc: "Menanggapi permohonan baru-baru ini dari PM sementara Machida Chūji, Kaisar Hirohito telah berbicara menentang kekerasan yang dipicu oleh konflik faksionalis yang sedang berlangsung, dan telah memutuskan siapa yang harus ia nominasikan untuk mengambil peran tersebut dan menjadi Perdana Menteri baru di masa-masa sulit ini. Orang yang dia nominasikan adalah..."
 SEA_japan_popup_events.16.a: "Machida Chūji yang Liberal"
 SEA_japan_popup_events.16.b: "Sosialis Abe Isoo"
 SEA_japan_popup_events.16.c: "Presiden House of Peers, Tokugawa Iesato"
 SEA_japan_popup_events.17.t: "Militer Mengumumkan Serangan"
 SEA_japan_popup_events.17.desc: "Banyak pejabat tinggi di Angkatan Darat Kekaisaran Jepang dan Angkatan Laut Kekaisaran Jepang kini telah menyatakan bahwa tentara akan melakukan pemogokan, menyusul deklarasi pemerintah kita untuk mengakhiri pengaruh mereka terhadap politik kita. Mereka mengatakan bahwa mereka tidak akan membela pemerintahan saat ini jika terjadi serangan, dan kemungkinan besar sudah merencanakan kudeta lagi untuk menggulingkan Perdana Menteri kita dari kekuasaan."
 SEA_japan_popup_events.17.a: "Segalanya meningkat..."
 SEA_japan_popup_events.18.t: "Militer Memperkuat Dirinya Sendiri"
 SEA_japan_popup_events.18.desc: "Militer telah mulai bersiap menghadapi bentrokan melawan pasukan yang setia kepada pemerintah setelah pasukan polisi sipil baru-baru ini menyatakan kesetiaannya terhadap diet tersebut. Tampaknya mereka berupaya mengamankan kendali wilayah jika terjadi perang saudara. Kita harus mulai melawan tindakan pemberontakan ini dengan sangat tergesa-gesa!"
 SEA_japan_popup_events.18.a: "Kirimkan Polisi Metropolitan ke Tokyo segera!"
 SEA_japan_popup_events.18.b: "Kita harus memastikan mereka tidak menguasai Kawasan Industri!"
 enables_the_civil_war_decisions_tt: "Kita akan bisa mendapatkan negara-negara bagian untuk bergabung dengan kita jika terjadi §YPerang Saudara§! melalui pengambilan keputusan di peta"
 JAP_shanghai_ultimatum: "Ultimatum Hongkou"
 SEA_japan_popup_events.19.t: "Ultimatum Hongkou"
 SEA_japan_popup_events.19.desc: "Setelah pembunuhan perwira Jepang lainnya di Shanghai, kami menerima ultimatum yang menyatakan bahwa kecuali kami menarik diri sepenuhnya dari wilayah tersebut, mereka akan menyerang dalam waktu seminggu.\n\nBagaimana kita harus menyikapinya?"
 SEA_japan_popup_events.19.a: "Kita tidak boleh menyerah pada tuntutan mereka!"
 SEA_japan_popup_events.19.b: "Rakyat kami telah melampaui batas, mundur!"
 SEA_japan_popup_events.20.t: "[FROM.GetLeader] Menolak Ultimatum Hongkou"
 SEA_japan_popup_events.20.desc: "Pihak berwenang Tiongkok mengklaim bahwa 'titik puncaknya' telah tercapai sehubungan dengan 'agresi tidak beralasan' kami terhadap Tiongkok! Tuntutan kami untuk mendapatkan reparasi telah ditolak, dan terdapat laporan mengenai lebih banyak warga negara Jepang yang diserang di Shanghai. Jika kita memerlukan alasan untuk mengambil tindakan tegas terhadap Tiongkok, inilah alasannya!"
 SEA_japan_popup_events.20.a: "Mereka akan membayarnya!"
 SEA_japan_popup_events.21.t: "[FROM.GetLeader] Menandatangani Ultimatum Hongkou"
 SEA_japan_popup_events.21.desc: "Anehnya, Tiongkok memilih mundur menyusul ultimatum yang dikirimkan untuk menguasai Shanghai. Mereka memahami bahwa membuat kami marah memerlukan konsekuensi yang mahal, dan mereka telah menyetujui konsesi teritorial yang luas yang mencakup kota itu sendiri dan wilayah sekitarnya. Sedikit demi sedikit, Tiongkok menjadi milik kita."
 SEA_japan_popup_events.21.a: "Perang harus menunggu."
 SEA_japan_popup_events.22.t: "Pengepungan Kastil Osaka"
 SEA_japan_popup_events.22.desc: "Setelah mendengar berita tentang pencabutan Undang-Undang Pelestarian Perdamaian yang kontroversial, garnisun tentara di markas besar mereka di Kastil Osaka melepaskan tembakan ke garnisun setia pemerintah yang ditempatkan di luar taman. Tampaknya mereka tidak akan mundur tanpa perlawanan, dan siap mengoyak jiwa bangsa kita jika itu berarti mempertahankan hegemoni mereka. Kita harus menjatuhkan mereka!"
 SEA_japan_popup_events.22.a: "Waktunya telah tiba untuk mengembalikan semangat Era Taishō!"
 SEA_japan_popup_events.23.t: "Kaisar yang Puas"
 SEA_japan_popup_events.23.desc: "Legitimasi Kaisar Hirohito dipertanyakan sejak ia berpuas diri terhadap meningkatnya dominasi militer atas politik dan tidak adanya tindakan ketika kekerasan meningkat antar faksi di negara tersebut. Kini, banyak yang menyerukan agar salah satu adik laki-lakinya, Nobuhito, yang merupakan pendukung terang-terangan pemerintah sipil, untuk mengambil gelar Kaisar, karena kedua kakak laki-lakinya telah melakukan tindakan makar. Hal ini akan mampu mempertahankan dukungan kerajaan terhadap pemerintahan kita saat ini, dan meningkatkan moral rakyat kita."
 SEA_japan_popup_events.23.a: "Baiklah, Nobuhito akan menggantikannya"
 SEA_japan_popup_events.24.t: "Tentara Kekaisaran Menyerah"
 SEA_japan_popup_events.24.desc: "Sisa-sisa terakhir Tentara Kekaisaran di Kepulauan Asal telah mengibarkan bendera putih, menandakan berakhirnya konflik yang telah berlangsung selama beberapa dekade antara pemerintah negara kita dan militernya sendiri. Sebagian besar negara mengalami kerusakan akibat pertempuran tersebut, namun hal ini menandakan awal baru bagi masyarakat [ROOT.GetAdjective]. Di luar negeri, musuh kita masih ada, namun saat ini adalah waktu yang tepat untuk membangun kembali negara kita. Pemerintah sudah membuat rencana untuk menyelenggarakan pemilihan umum pertama karena oknum koruptor tidak bisa lagi ikut campur."
 SEA_japan_popup_events.24.a: "Kami telah merebut kembali masa depan kami!"
 SEA_japan_popup_events.25.t: "Pemilihan Umum"
 SEA_japan_popup_events.25.desc: "Pemilu pertama setelah militer disingkirkan dari politik kita kini telah diadakan, dan masyarakat akan menggunakan suara mereka untuk menentukan masa depan bangsa. Pemilu saat ini terjadi antara partai Rikken Minseitō yang liberal dan Rikken Seiyūkai yang lebih konservatif, keduanya baru-baru ini memimpin Diet Kekaisaran. Pemungutan suara sedang dilakukan, dan pemenangnya akan segera ditentukan."
 SEA_japan_popup_events.25.a: "Rikken Minseito menang!"
 SEA_japan_popup_events.25.b: "Rikken Seiyūkai menang!"
 SEA_japan_popup_events.26.t: "Kudeta Tentara Kwantung"
 SEA_japan_popup_events.26.desc: "Dengan perang saudara yang sedang berkecamuk antara militer dan pemerintah di Jepang, Tentara Kwantung yang ditempatkan di negara kita telah mengambil kesempatan untuk melakukan kudeta militer terhadap pemerintah kita sendiri, dengan harapan mengamankan negara panglima perang feodal mereka di Manchuria. Haruskah kita membiarkan hal ini terjadi, atau haruskah kita melawannya dengan sekuat tenaga?"
 SEA_japan_popup_events.26.a: "Tidak ada gunanya melawan mereka"
 SEA_japan_popup_events.26.b: "Ini saatnya untuk menghancurkan kuk Jepang ini!"
 MAN_kwantung_will_try_to_occupy_east_hebei_tt: "Hal ini akan memungkinkan kami menggunakan bantuan Tentara Kwantung untuk merebut kendali atas [609.GetName]"
 SEA_japan_popup_events.27.t: "Peluang Emas"
 SEA_japan_popup_events.27.desc: "Dengan perang saudara yang sedang berkecamuk antara militer dan pemerintah di Jepang, rakyat Korea menyadari bahwa inilah saatnya bagi mereka untuk mendapatkan kembali kendali atas negara mereka dan mengusir penindas Jepang. Sekali lagi, Semenanjung Korea akan berkembang di bawah kekuasaan rakyatnya sendiri."
 SEA_japan_popup_events.27.a: "Lemparkan penjajah kembali ke laut!"
 SEA_japan_popup_events.28.t: "Basis Operasi Pedesaan"
 SEA_japan_popup_events.28.desc: "Partai komunis telah memutuskan untuk memulai operasi bawah tanah, di luar pandangan dan pikiran Tentara Kekaisaran dan pemerintah. Satu-satunya pertanyaan yang terlintas di benak mereka saat ini adalah, wilayah manakah yang cukup terpencil sehingga kemungkinan untuk ditemukan dan dibasmi menjadi serendah mungkin?"
 SEA_japan_popup_events.28.a: "Hokkaido sempurna"
 SEA_japan_popup_events.28.b: "Shikoku cukup jauh"
 SEA_japan_popup_events.28.c: "Mendirikan cabang di Kagoshima"
 SEA_japan_popup_events.29.t: "Insiden Miyazaki"
 SEA_japan_popup_events.29.desc: "Dini hari tadi, pasukan Angkatan Darat Kekaisaran menduduki sebuah gudang di pinggiran Miyazaki di mana kaum revolusioner komunis berada, dan berusaha menangkap mereka. Kyūichi Tokuda telah diselamatkan dari penjara Abashiri oleh gerilyawan komunis setempat, dan setelah baku tembak terjadi di gudang Miyazaki, perintah telah diberikan melalui siaran radio oleh Tokuda untuk memulai revolusi dengan sangat tergesa-gesa. Tampaknya waktu untuk bertindak sudah tiba."
 SEA_japan_popup_events.29.a: "Revolusi akhirnya dimulai!"
 JAP_democratic_side_also_spawns_tt: "§YPemerintahan Demokratis§! juga akan berupaya melawan Revolusi kita!"
 SEA_japan_popup_events.30.t: "Perdebatan tentang Arah Masa Depan Negara"
 SEA_japan_popup_events.30.desc: "Dengan situasi yang kini lebih stabil setelah kekalahan Tentara Kekaisaran, perdebatan muncul dalam pola makan nasional mengenai rute mana yang harus diambil. Kōza-ha berpendapat bahwa hanya dengan memanfaatkan proletariat dan menggunakan tangan otoriter untuk mengarahkan masyarakat kita dapat mencapai masa depan ideal kita, sedangkan Rōnō-ha berpendapat bahwa gerakan payung yang lebih lembut dan tidak terlalu mengganggu akan ideal untuk mengendalikan negara. Ide manakah yang harus diterapkan?"
 SEA_japan_popup_events.30.a: "Kōza-ha ada di sini"
 SEA_japan_popup_events.30.b: "Cita-cita Rōnō-ha bersinar paling cemerlang saat ini"
 JAP_supported_the_kozaha_idea_flag: "Mendukung Kōza-ha dalam debat"
 JAP_supported_the_rounoha_idea_flag: "Mendukung Rōnō-ha dalam debat"
 JAP_supported_the_kozaha_idea_tt: "Akan membuka kunci fokus §Y$JAP_the_lecture_group_ascendant$§!"
 JAP_supported_the_rounoha_idea_tt: "Akan membuka kunci fokus §Y$JAP_the_labor_farmer_faction_ascendant$§!"
 SEA_japan_popup_events.31.t: "Seorang Pemimpin untuk Kōza-ha"
 SEA_japan_popup_events.31.desc: "Dengan kemenangan revolusi dan kekuasaan yang kini berada di tangan Kōza-ha, tibalah waktunya untuk memilih perdana menteri untuk republik rakyat yang baru. Dua partai yang menjadi kandidat terdepan selama perang adalah Sanzō Nosaka dan Kyūichi Tokuda, dan dengan kemenangan revolusi, mereka berdua telah menunjukkan bahwa mereka mampu dan bersedia membawa kita menuju komunisme. Meskipun secara ideologis tidak selalu sejalan, keduanya menunjukkan potensi yang besar, dan oleh karena itu siapa yang akan dipilih sepenuhnya tergantung pada takdir. Apakah Nosaka internasional atau Tokuda yang lebih berpengalaman tetapi mungkin kurang populer?"
 SEA_japan_popup_events.31.a: "Sanzō Nosaka memiliki popularitas"
 SEA_japan_popup_events.31.b: "Kyūichi Tokuda memiliki pengalaman"
 SEA_japan_popup_events.32.t: "Pemimpin Rōnō-ha"
 SEA_japan_popup_events.32.desc: "Setelah berakhirnya perang saudara dan kemenangan revolusi, faksi Buruh-Tani mendapatkan kepercayaan dari partai dan rakyat. Karena cita-citanya tidak terlalu ortodoks, mereka berhasil mendapatkan banyak pengikut dan sebagai hasilnya juga menduduki kursi kekuasaan. Namun pertanyaan utamanya masih ada, siapa yang akan menjadi perdana menteri republik berikutnya? Tiga kandidat telah diajukan tetapi pemilihan final masih tetap ada. Akankah Hitoshi Yamakawa yang sebagai tokoh sentral gerakan sosialis menunjukkan pengalamannya? Akankah Kanson Arahata yang berhasil menggalang dukungan masyarakat dalam jumlah besar dan sudah terpilih sebagai ketua? Ataukah Yamakawa Kikue, yang meskipun kurang menonjol dalam partai, namun telah menunjukkan bahwa ia cocok untuk berperan sebagai pemimpin dan reformis?"
 SEA_japan_popup_events.32.a: "Hitoshi Yamakawa punya pengalaman"
 SEA_japan_popup_events.32.b: "Kanson Arahata mendapat dukungan masyarakat"
 SEA_japan_popup_events.32.c: "Yamakawa Kikue memiliki ide paling revolusioner"
 SEA_japan_popup_events.33.t: "Nasib Keluarga Kekaisaran"
 SEA_japan_popup_events.33.desc: "Dengan kekuasaan yang kini berada di tangan rakyat, pertanyaan mengenai bekas keluarga kekaisaran masih membayangi kita. Terdapat banyak perbedaan pendapat mengenai cara terbaik untuk menangani pekerja migran, beberapa diantaranya mendukung reformasi dan menurunkan status mereka menjadi pekerja biasa, sementara beberapa lainnya berpendapat bahwa mereka harus menghadapi hukuman yang lebih berat atas kejahatan yang mereka lakukan terhadap rakyat baik pada masa perang maupun jauh sebelumnya. Pilihan yang diambil masih belum dapat diputuskan, namun apa pun pilihannya, akan ada perbedaan pendapat yang mungkin harus diatasi."
 SEA_japan_popup_events.33.a: "Jadikan mereka hidup sebagai orang normal"
 SEA_japan_popup_events.33.b: "Biarkan mereka menjalani masa hukumannya di penjara"
 SEA_japan_popup_events.33.c: "Mereka terlalu berbahaya untuk dibiarkan hidup!"
 SEA_japan_popup_events.33.d: "Kirim mereka ke pengasingan"
 SEA_japan_popup_events.34.t: "Perdebatan tentang Teori Revolusi Ainu"
 SEA_japan_popup_events.34.desc: "Banyak pemikir politik kita yang berpendapat bahwa lumpenproletariat adalah badan utama revolusi kita, dan masyarakat Ainu juga termasuk dalam kelompok ini. Lebih jauh lagi, mereka percaya bahwa masyarakat Ainu hidup dalam sistem komunis primitif dan menganggap mereka layak menjadi 'pemimpin revolusi Komunis'. Namun pertanyaannya sekarang adalah, bagaimana seharusnya hal tersebut terjadi? Apakah dengan memasukkan tradisi mereka ke dalam masyarakat sosialis kita, atau dengan memberikan otonomi kepada masyarakat Ainu?"
 SEA_japan_popup_events.34.a: "Kita harus memanfaatkan tradisi mereka yang menarik"
 SEA_japan_popup_events.34.b: "Para pemimpin revolusioner ini harus diberikan otonomi yang layak mereka dapatkan!"
 SEA_japan_popup_events.35.t: "[FROM.GetLeader] Ingin Memberdayakan Dinasti Yi"
 SEA_japan_popup_events.35.desc: "Tuan kami [FROM.GetNameDef] telah menuntut agar gubernur kolonial kami mundur dan memilih Yi Un, pewaris takhta [ROOT.GetAdjective] dan setia kepada Kekaisaran Jepang. Ini sepertinya kesepakatan yang terlalu bagus untuk dilewatkan."
 SEA_japan_popup_events.35.a: "Kami akan menerima dengan senang hati"
 SEA_japan_popup_events.35.b: "Tidak, jabatan gubernur harus tetap ada!"
 SEA_japan_popup_events.36.t: "[FROM.GetNameDefCap] Menimbulkan Sentimen Komunis"
 SEA_japan_popup_events.36.desc: "Kami menyadari bahwa saat ini terdapat sel [FROM.GetAdjective] di negara kami yang menyebarkan sentimen komunis. Meskipun hal ini tampaknya tidak berbahaya, tampaknya beberapa propaganda tersebut bersifat revolusioner. Laporan mengenai para pekerja yang didorong untuk berorganisasi dan bersatu menjadi semakin sering terjadi, dan jika dilihat dari sejarah terkini, kami tidak dapat memastikan bahwa ini bukanlah taktik rumit dari kepemimpinan [FROM.GetAdjective] untuk akhirnya mengintegrasikan kami."
 SEA_japan_popup_events.36.a: "Biarkan mereka melanjutkan"
 SEA_japan_popup_events.36.b: "Hancurkan para agitator sosialis ini!"
 SEA_japan_popup_events.37.t: "[FROM.GetNameDefCap] Menimbulkan Sentimen Komunis"
 SEA_japan_popup_events.37.desc: "Kami menyadari bahwa saat ini terdapat sel [FROM.GetAdjective] di negara kami yang menyebarkan sentimen komunis. Meskipun hal ini tampaknya tidak berbahaya, nampaknya beberapa propaganda bersifat revolusioner. Laporan mengenai para pekerja yang didorong untuk berorganisasi dan bersatu menjadi semakin sering terjadi, dan jika dilihat dari sejarah terkini, kami tidak dapat memastikan bahwa ini bukanlah taktik rumit dari kepemimpinan [FROM.GetAdjective] untuk akhirnya mengintegrasikan kami."
 SEA_japan_popup_events.37.a: "Biarkan mereka melanjutkan"
 SEA_japan_popup_events.37.b: "Hancurkan para agitator sosialis ini!"
 SEA_japan_popup_events.38.t: "Perang Saudara di [ROOT.GetNameDef]"
 SEA_japan_popup_events.38.desc: "Setelah sekian lama tumbuhnya sentimen komunis, tampaknya kaum proletar [ROOT.GetAdjective] sudah bosan menunggu pergantian pemerintahan secara damai. Setelah wacana yang intens nampaknya diplomasi telah gagal dan konflik bersenjata pun terjadi."
 SEA_japan_popup_events.38.a: "Untuk Proletariat!"
 SEA_japan_popup_events.38.b: "Kita harus menghentikan kebodohan ini!"
 SEA_japan_popup_events.39.t: "Revitalisasi Agama Buddha"
 SEA_japan_popup_events.39.desc: "Karena penggabungan gerakan payung kami dengan berbagai gerakan sosialis di seluruh Jepang, gerakan sosialis Buddha yang dipimpin oleh Girō Senoo telah berkembang pesat, dan Liga Pemuda untuk Revitalisasi Buddhisme telah menjadi gerakan andalan bagi kaum muda sosialis kami. Kini, penasihat partai Tsuji Jun telah mendesak [ROOT.GetLeader] mengenai masalah kepemimpinan, dan mengklaim bahwa keadaan negara akan lebih baik jika Girō Senoo yang semakin populer memimpin partai tersebut. Apakah ini jalan yang tepat menuju pembebasan spiritual serta emansipasi sosial dan ekonomi?"
 SEA_japan_popup_events.39.a: "Inilah jalan ke depan!"
 SEA_japan_popup_events.39.b: "Tidak, [ROOT.GetLeader] akan terus memimpin"
 SEA_japan_popup_events.40.t: "Laporan Mengkhawatirkan mengenai Ekspansionisme [JAP.GetAdjective]"
 SEA_japan_popup_events.40.desc: "Meskipun [JAP.GetNameDef] berkembang pesat di Asia, menduduki negara-negara tetangga dan menghancurkan negara-negara mereka, industri dan sumber daya alam kita terus menopang perekonomian mereka dan mengalir ke pabrik-pabrik mereka untuk diubah menjadi senjata perang. Masyarakat kita kini semakin kritis terhadap hal ini, dan menyerukan tindakan yang harus diambil. Apa yang harus kita lakukan?"
 SEA_japan_popup_events.40.a: "Kita tidak bisa terus-terusan menyuplai perang mereka dengan bahan-bahan kita!"
 SEA_japan_popup_events.40.b: "Negara Asia tidak akan menjadi ancaman bagi kita, tidak apa-apa"
 SEA_japan_popup_events.41.t: "Embargo [FROM.GetAdjective]"
 SEA_japan_popup_events.41.desc: "Mendasarkan keputusan keliru mereka pada ekspansi moderat dan pengamanan musuh-musuh kita, tampaknya warga [FROM.GetAdjective] yang penghasut perang telah menekan [FROM.GetLeader] dari [FROM.GetNameDef] untuk melakukan embargo terhadap kami. Mereka telah memutuskan bahwa tidak akan ada lagi perdagangan antar negara kita, sebuah pelanggaran yang jelas terhadap netralitas mereka terhadap kita..."
 SEA_japan_popup_events.41.a: "Mereka salah arah"
 SEA_japan_popup_events.42.t: "Masyarakat Kehilangan Kepercayaan pada [ROOT.GetLeader]"
 SEA_japan_popup_events.42.desc: "Dengan berubahnya arena perang di Asia Timur menjadi ladang ranjau politik, dan sebagian besar wilayah tidak dapat dipertahankan dari musuh, masyarakat mulai mempertanyakan kompetensi [ROOT.GetLeader] untuk memenangkan perang. Jika situasi ini tidak diselesaikan dengan tergesa-gesa, baik dengan memperkuat upaya perang atau dengan membentuk kabinet yang lebih kompeten, perang mungkin akan berakhir dengan kekalahan..."
 SEA_japan_popup_events.42.a: "Kita harus mengakhiri rawa ini!"
 JAP_unlock_the_surrender_subbranch_tt: "Membuka fokus §Y$JAP_the_koiso_cabinet$§!, §Y$JAP_the_war_has_not_necessarily_developed_focus$§!, §Y$JAP_japans_longest_day$§! dan §Y$JAP_the_surrender_broadcast$§! yang memungkinkan penghapusan §Y$JAP_crumbling_military_cabinet_idea$§! dan potensi penarikan diri dari perang Asia Timur"
 SEA_japan_popup_events.43.t: "Insiden Kyūjō"
 SEA_japan_popup_events.43.desc: "Setelah mendengar keinginan Kaisar untuk mengumumkan berakhirnya perang Asia Timur secara resmi, beberapa pemberontak di bawah komando Mayor Kenji Hatanaka telah mengambil tindakan untuk meyakinkan Pengawal Kekaisaran agar membantu mereka menduduki Istana Kekaisaran Tokyo dan menempatkan Kaisar dalam tahanan rumah. Jenderal Shizuichi Tanaka dan Takeshi Mori telah bersiap untuk mengakhiri upaya kudeta ini dengan cepat, tetapi siapa yang tahu pihak mana yang akan menang?"
 SEA_japan_popup_events.43.a: "Beraninya mereka menentang keinginan Kaisar?"
 SEA_japan_popup_events.43.b: "Awan gelap harus lenyap dari pemerintahan Kaisar!"
 JAP_kyujo_incident_rebels_lost_flag: "Kyūjō Putsch gagal, dan pembuat kudeta ditangkap"
 JAP_kyujo_incident_rebels_won_flag: "Kyūjō Putsch berhasil, dan pembuat kudeta menempatkan Kaisar dalam tahanan rumah"
 JAP_unlock_japans_longest_day_tt: "Membuka fokus §Y$JAP_japans_longest_day$§!"
 JAP_unlock_surrender_broadcast_tt: "Membuka kunci fokus §Y$JAP_the_surrender_broadcast$§!"
 SEA_japan_popup_events.44.t: "Kebangkitan Khorloogiin Choibalsan"
 SEA_japan_popup_events.44.desc: "Sebagai panglima Tentara Rakyat Mongolia, dan salah satu revolusioner besar Mongolia tahun 1921, Khorloogiin Choibalsan adalah kandidat kuat untuk memimpin negara kita menuju kejayaan. Dengan eksploitasi militernya baru-baru ini, ia kini telah membuktikan dirinya cukup kompeten untuk benar-benar memerintah negara sebagai satu-satunya pemimpin. Apakah saat yang tepat baginya untuk menjabat sebagai Ketua Dewan Menteri ke-10?"
 SEA_japan_popup_events.44.a: "Waktunya tepat"
 SEA_japan_popup_events.44.b: "Tidak, dia harus tetap berada di lapangan!"
 SEA_japan_popup_events.45.t: "Menduduki Pemerintahan Otonomi Hebei Timur"
 SEA_japan_popup_events.45.desc: "Menyusul runtuhnya komando resmi tentara Jepang dan perang saudara yang terjadi di Kepulauan Asal, protektorat Jepang yang dikenal sebagai Pemerintahan Otonomi Hebei Timur yang terletak di perbatasan barat daya kami kini tidak terlindungi. Waktunya telah tiba bagi kita untuk melakukan mogok kerja, dan mengambil tindakan selagi pemerintah [JAP.GetAdjective] mempunyai terlalu banyak masalah lain yang harus ditangani untuk mengatasi apa yang terjadi di benua ini."
 SEA_japan_popup_events.45.a: "Konsolidasi kami terus berlanjut"
 SEA_japan_popup_events.46.t: "Tentara Kwantung Menduduki Hebei Timur"
 SEA_japan_popup_events.46.desc: "Menyusul runtuhnya komando resmi tentara Jepang dan perang saudara yang terjadi di Kepulauan Asal, bekas protektorat kami yang dikenal sebagai Pemerintahan Otonomi Hebei Timur yang terletak di perbatasan barat daya [MAN.GetNameDef] kini tidak terlindungi. Oleh karena itu, mereka memutuskan untuk melakukan mogok kerja, dan mengambil tindakan sementara pemerintah kita mempunyai terlalu banyak masalah lain yang harus diselesaikan untuk mengatasi apa yang terjadi di benua ini."
 SEA_japan_popup_events.46.a: "Kami akan menanganinya nanti..."
 SEA_japan_popup_events.47.t: "[FROM.GetNameDefCap] Membatalkan Hak Sumber Daya kami untuk [655.GetName]"
 SEA_japan_popup_events.47.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] baru-baru ini menandatangani dokumen baru yang membatalkan hak kami atas kehutanan dan pertambangan di [655.GetName], dengan mengabaikan perjanjian yang kami tandatangani saat menyerahkan wilayah tersebut kembali kepada mereka pada akhir Perang Saudara Rusia."
 SEA_japan_popup_events.47.a: "Badai sedang terjadi di utara..."
 SEA_japan_popup_events.48.t: "[ROOT.GetLeader] Menyatakan Darurat Nasional"
 SEA_japan_popup_events.48.desc: "Menyusul jatuhnya pasukan musuh di tanah kami, [ROOT.GetLeader] telah memberlakukan darurat militer dan mengumumkan keadaan darurat nasional hingga penjajah diusir dari tanah kami. Tidak ada yang tahu berapa lama hal ini akan berlangsung, tapi yang mereka tahu hanyalah bahwa tanah tersebut sekali lagi berada di bawah kendali mutlak keluarga Tokugawa."
 SEA_japan_popup_events.48.a: "Memberikan kekuasaan absolut kepada Tokugawa tidak pernah salah sebelumnya"
 SEA_japan_popup_events.49.t: "[ROOT.GetLeader] Ditemukan Mati!"
 SEA_japan_popup_events.49.desc: "Setelah naik ke tampuk kekuasaan sebagai anggota kelompok moderat di angkatan laut, [ROOT.GetLeader] mendapati dirinya sangat populer di mata masyarakat. Kini setelah tentara kembali memperoleh kekuatan besar, tampaknya mereka masih menyimpan dendam terhadapnya, karena pada hari ini, ia ditemukan tewas di kediamannya. Meskipun kemungkinan besar dipalsukan, sebuah surat wasiat ditemukan di tubuh Perdana Menteri yang menyerahkan kepemimpinan negara kepada Adachi Kenzō."
 SEA_japan_popup_events.49.a: "Nampaknya momok militerisme masih menghantui kita..."
 SEA_japan_popup_events.50.t: "Permintaan Bersama dari Tokkō dan Birokrat"
 SEA_japan_popup_events.50.desc: "Dengan terbentuknya Asosiasi Bantuan Pemerintahan Kekaisaran, menjadi jelas bahwa Genki Abe, pemimpin Polisi Pikiran bersama dengan berbagai pemimpin pegawai negeri tidak terlalu senang dengan tindakan [ROOT.GetLeader]. Kini, mereka menuntut agar dia mundur dan mendukung politisi pro-Nazi Seigō Nakano. Haruskah kita menerima tekanan ini?"
 SEA_japan_popup_events.50.a: "Baiklah, jika itu adalah Perdana Menteri yang mereka inginkan..."
 SEA_japan_popup_events.50.b: "Kami tidak akan memenuhi tuntutan mereka!"
 SEA_japan_popup_events.51.t: "Pertempuran Midway"
 SEA_japan_popup_events.51.desc: "Karena staf angkatan laut kami ingin memperluas perimeter pertahanan Pasifik kami ke pulau-pulau atol yang letaknya lebih jauh, armada kami baru-baru ini dikirim untuk berpatroli di West Emperor Chain, ketika mereka bertemu dengan armada Amerika. Pertempuran tersebut berlangsung sengit, namun pada akhirnya kami mengirim musuh untuk berkemas, menyebabkan kerusakan yang signifikan pada angkatan laut serta moral mereka. Atas pencapaian ini, komandan kami telah diberikan promosi yang memadai."
 SEA_japan_popup_events.51.a: "Untuk Kaisar!"
 SEA_japan_popup_events.52.t: "Pertempuran Midway"
 SEA_japan_popup_events.52.desc: "Sejak Jepang mulai berupaya memperluas perimeter pertahanan Pasifik mereka hingga ke atol-atol yang letaknya lebih jauh, armada mereka sekali lagi mulai menyimpang lebih dekat ke Pearl Harbor. Namun, tanpa sepengetahuan musuh kita, pemecah kode kita telah menentukan tanggal dan lokasi rencana serangan mereka di Midway, sehingga memungkinkan kita melakukan penyergapan. Komandan Armada Pasifik telah mengirimkan pasukan besar di bawah pimpinan Frank Jack Fletcher ke daerah Midway sebelum Jepang tiba, dan berkat persiapan yang cermat ini, kami kini telah memberikan pukulan telak terhadap pasukan mereka, dan mereka tidak akan segera pulih."
 SEA_japan_popup_events.52.a: "Kami menunjukkan kepada mereka untuk apa"
 SEA_japan_popup_events.53.t: "Bencana di Midway"
 SEA_japan_popup_events.53.desc: "Karena staf angkatan laut kami ingin memperluas perimeter pertahanan Pasifik kami ke pulau-pulau atol yang letaknya lebih jauh, armada kami baru-baru ini dikirim untuk merebut Atol Midway. Namun, tanpa sepengetahuan komandan kami, pemecah kode Amerika telah menentukan tanggal dan lokasi rencana serangan kami di Midway, sehingga memungkinkan mereka melakukan penyergapan. Pertempuran tersebut mengakibatkan kerugian yang sangat besar, dan media menyensor semua informasi mengenai kerugian tersebut kepada publik, untuk menjaga semangat kerja tetap tinggi."
 SEA_japan_popup_events.53.a: "Sebuah tampilan yang memalukan"
 SEA_japan_popup_events.54.t: "Pertempuran Midway yang Menghancurkan"
 SEA_japan_popup_events.54.desc: "Sejak Jepang mulai berupaya memperluas perimeter pertahanan Pasifik mereka hingga ke atol-atol yang letaknya lebih jauh, armada mereka sekali lagi mulai menyimpang lebih dekat ke Pearl Harbor. Namun, tanpa sepengetahuan musuh kita, pemecah kode kita telah menentukan tanggal dan lokasi rencana serangan mereka di Midway, sehingga memungkinkan kita melakukan penyergapan. Komandan Armada Pasifik telah mengirimkan pasukan besar di bawah pimpinan Frank Jack Fletcher ke daerah Midway sebelum Jepang tiba. Meskipun kami sudah berusaha semaksimal mungkin, armada kami tidak bisa menandingi armada mereka, dan dalam hitungan jam jalannya pertempuran sudah ditentukan. Mungkin inilah titik balik yang dibutuhkan musuh-musuh kita untuk mengalahkan armada Pasifik kita."
 SEA_japan_popup_events.54.a: "Ini adalah bencana yang belum pernah terjadi sebelumnya!"
 ### BORDER INCIDENT EVENTS ###  
 # Event for MON 
 SEA_border_incidents_events.1.t: "Pasukan Kami Bergerak ke Tauran"
 SEA_border_incidents_events.1.desc: "Pasukan yang terdiri dari kurang dari 100 [ROOT.GetAdjective] telah mulai bergerak ke desa Tauran [MAN.GetAdjective] yang disengketakan, dipandu oleh enam penasihat Soviet. Meskipun tampaknya pasukan [JAP.GetAdjective] belum muncul di area tersebut, mereka mungkin akan tiba kapan saja untuk memukul mundur kita. Apakah desa ini sepadan dengan risikonya, atau haruskah kita lebih berhati-hati?"
 SEA_border_incidents_events.1.a: "Desa ini akan menjadi milik kita!"
 SEA_border_incidents_events.1.b: "Kita harus memberitahu mereka untuk segera mundur!"
 # Event for JAP or MAN  
 SEA_border_incidents_events.2.t: "Insiden Tauran"
 SEA_border_incidents_events.2.desc: "Pasukan yang terdiri dari kurang dari 100 [MON.GetAdjective] telah menduduki desa Tauran [MAN.GetAdjective] yang disengketakan, dipimpin oleh penasihat militer Soviet. Tampaknya mereka tidak akan mundur tanpa perlawanan, dan harus dikalahkan jika kita ingin mempertahankan kendali penuh atas [761.GetName]."
 SEA_border_incidents_events.2.a: "Perintahkan pasukan untuk segera keluar!"
 SEA_border_incidents_events.2.b: "Itu tidak sebanding dengan masalahnya..."
 # Event for MAN if overlord JAP decided to engage in the conflict 
 SEA_border_incidents_events.3.t: "Insiden Tauran"
 SEA_border_incidents_events.3.desc: "Pasukan yang terdiri dari kurang dari 100 [MON.GetAdjective] telah menduduki desa Tauran [MAN.GetAdjective] yang disengketakan, dipimpin oleh penasihat militer Soviet. Tampaknya mereka tidak akan mundur tanpa perlawanan, dan harus dikalahkan jika kita ingin mempertahankan kendali penuh atas [761.GetName]. Tuan kami [JAP.GetNameDef] telah menuntut tindakan segera, dan Tentara Kwantung melihat situasi ini sebagai tindakan yang merugikan Kaisar sendiri."
 SEA_border_incidents_events.3.a: "Bersiaplah untuk serangan!"
 ### THE TAURAN INCIDENT BORDER WAR ### 
 SEA_border_incidents_events.4.t: "[FROM.GetAdjective] Pasukan Bersiap Menyerang Tauran"
 SEA_border_incidents_events.4.desc: "Sebagai bagian dari meningkatnya ketegangan antara kami dan [FROM.GetNameDef] menyusul perselisihan kami mengenai desa-desa perbatasan seperti Tauran, tampaknya mereka sekarang memindahkan pasukan ke daerah tersebut untuk menyerang garnisun yang kami tempatkan di wilayah tersebut. Kita harus bersiap untuk mempertahankan wilayah tersebut sampai orang terakhir, dan mengusir penjajah dari tanah liat [ROOT.GetAdjective] yang sah!"
 SEA_border_incidents_events.4.a: "Badai sedang berkumpul"
 SEA_border_incidents_events.5.t: "[JAP.GetAdjective] Kemenangan di Danau Buir"
 SEA_border_incidents_events.5.desc: "Menyusul bentrokan antara pasukan [MON.GetAdjective] dan [JAP.GetAdjective] di daerah perbatasan sekitar Danau Buir, pasukan [MON.GetAdjective] dilaporkan mundur sepenuhnya. Unit [JAP.GetAdjective] telah menduduki sejumlah bukit strategis di sekitar area tersebut, dan bersiap memasuki kembali desa Tauran.\n\nSelama pertempuran, [JAP.GetAdjective] menangkap sejumlah [MON.GetAdjective] dan [SOV.GetAdjective] penasihat, yang akan memberikan pukulan telak terhadap moral musuh."
 SEA_border_incidents_events.5.a: "Kami telah menyelesaikan masalah ini dengan hormat"
 SEA_border_incidents_events.5.b: "Kami berdoa mereka tidak bergerak lebih jauh..."
 SEA_border_incidents_events.6.t: "[JAP.GetAdjective] Kalah di Danau Buir"
 SEA_border_incidents_events.6.desc: "Menyusul bentrokan antara pasukan [MON.GetAdjective] dan [JAP.GetAdjective] di daerah perbatasan sekitar Danau Buir, Duta Besar [JAP.GetAdjective] di Ulan Bator telah meminta gencatan senjata.\n\nBeberapa [JAP.GetAdjective] serangan terhadap posisi [MON.GetAdjective] gagal dengan banyak korban jiwa selama pertempuran, sehingga menimbulkan kekhawatiran di kalangan militer [JAP.GetAdjective] mengenai kemampuan pasukan mereka."
 SEA_border_incidents_events.6.a: "Lebih baik gagal secara terhormat daripada tidak pernah mencoba sama sekali"
 SEA_border_incidents_events.6.b: "Pasukan kami telah membebaskan diri dengan baik"
 SEA_border_incidents_events.7.t: "Kebuntuan di Danau Buir"
 SEA_border_incidents_events.7.desc: "Pertempuran antara pasukan [JAP.GetAdjective] dan [MON.GetAdjective] di sekitar Danau Buir telah mereda setelah kedua belah pihak mundur dari wilayah yang diperebutkan untuk berkumpul kembali dan memberikan pasokan. Menyadari kesia-siaan serangan lebih lanjut, militer [JAP.GetAdjective] telah meminta gencatan senjata dan negosiasi untuk memperbaiki perbatasan, dan mengakui bahwa desa tersebut terletak dalam wilayah [MON.GetAdjective]."
 SEA_border_incidents_events.7.a: "Lagipula itu adalah desa yang tidak berharga"
 SEA_border_incidents_events.7.b: "Itu milik kita untuk saat ini"
 SEA_border_incidents_events.8.t: "[FROM.GetNameDefCap] Mundur"
 SEA_border_incidents_events.8.desc: "Setelah kami menduduki desa Tauran, tampaknya pasukan [FROM.GetAdjective] telah mundur dari sekitar dan tidak menunjukkan tanda-tanda akan kembali. Menyadari kesia-siaan serangan lebih lanjut, militer [JAP.GetAdjective] telah mengakui bahwa desa tersebut berada dalam wilayah [ROOT.GetAdjective]."
 SEA_border_incidents_events.8.a: "Luar biasa"
 if_they_back_down_or_lose_a_border_conflict_tt: "Jika Mereka Mundur atau Kalah dalam Konflik Perbatasan:"
 ### STRIKE SOUTH EVENTS ###  
 SEA_imperial_influence_events.500.t: "Fraksi Angkatan Laut Menuntut Kita Menyerang ke Selatan"
 SEA_imperial_influence_events.500.desc: "[ROOT.GetLeader] baru saja menerima surat yang ditandatangani oleh Markas Besar Angkatan Laut yang menuntut agar persiapan dimulai untuk pemberlakuan Doktrin Serangan Selatan secara penuh, menyatakan bahwa kebutuhan mereka akan sumber daya yang dapat ditemukan di Hindia Timur kini telah mencapai titik kritis. Tentu saja mereka bisa saja diabaikan, tapi mungkin tidak bijaksana jika membuat mereka menunggu."
 SEA_imperial_influence_events.500.a: "Persiapan harus dilakukan dengan tergesa-gesa!"
 take_the_strike_south_focus_tt: "Menyelesaikan §Y$JAP_strike_the_southern_road$§! dan berperang dengan §YKekuatan Barat§! akan menenangkan $JAP_naval_faction$"
 SEA_imperial_influence_events.501.t: "Perwira Angkatan Laut Mengundurkan Diri karena Marah"
 SEA_imperial_influence_events.501.desc: "Gagal melaksanakan rencana yang disusun untuk pelaksanaan Doktrin Serangan Selatan dalam waktu yang telah ditentukan oleh Markas Besar Angkatan Laut, kini tampaknya banyak Perwira Angkatan Laut yang mengambil bagian dalam upaya untuk menekan [ROOT.GetLeader] agar melakukan hal tersebut telah mengundurkan diri."
 SEA_imperial_influence_events.501.a: "Tindakan yang tidak terhormat!"
 ### TOKKO EVENTS ###
 SEA_japan_tokko_arrest_events.1.t: "Insiden Front Populer"
 SEA_japan_tokko_arrest_events.1.desc: "Tokkō telah menemukan ancaman terhadap stabilitas internal kita. Tampaknya ada organisasi sosialis dan komunis yang berupaya melemahkan masyarakat kita. Daftar orang yang akan ditangkap telah disusun, terdiri dari beberapa petinggi partai komunis seperti Kanson Arahata, Saburō Eda, Ryōkichi Minobe, Itsurō Sakisaka, Kōzō Sasaki, Mosaburō Suzuki, Minoru Takano, dan Hitoshi Yamakawa."
 SEA_japan_tokko_arrest_events.1.a: "Berita Hebat"
 JAP_popular_front_incident_tt: "Berbagai politisi dan agitator komunis akan ditangkap"
 SEA_japan_tokko_arrest_events.2.t: "Insiden Cox"
 SEA_japan_tokko_arrest_events.2.desc: "Tokkō telah menemukan ancaman terhadap stabilitas internal kita. 11 warga negara Inggris yang tinggal di negara kita akan ditangkap karena dicurigai melanggar Undang-Undang Perlindungan Rahasia Militer, dengan pemimpin mereka adalah MJ Cox, kepala biro Reuters di Tokyo. Meskipun pemerintah [ENG.GetAdjective] mengklaim bahwa mereka bukan mata-mata, mereka tetap dibawa ke gedung Markas Besar Polisi Militer untuk diinterogasi."
 SEA_japan_tokko_arrest_events.2.a: "Agen Asing mendapatkan apa yang pantas mereka dapatkan!"
 SEA_japan_tokko_arrest_events.2.b: "Cobalah untuk tidak membuat marah [ENG.GetAdjective]"
 JAP_cox_incident_tt: "Berbagai [ENG.GetAdjective] warga negara yang dicurigai melakukan kegiatan mata-mata akan ditangkap"
 SEA_japan_tokko_arrest_events.3.t: "Insiden Gassakusha" # or Kyōsakusha
 SEA_japan_tokko_arrest_events.3.desc: "Tokkō telah menemukan ancaman lain terhadap stabilitas internal kita. Banyak anggota Departemen Investigasi Kereta Api Manchuria Selatan kini telah ditangkap dua kali oleh Polisi Militer Tentara Kwantung, ditahan karena dicurigai menyebarkan propaganda anti-Jepang dan komunis di koloni kami. Tampaknya mereka juga terlibat dalam penelitian dan analisis sosial dengan menggunakan metode Marxis yang sebelumnya dilarang di Kepulauan Asal. Konspirasi ini mungkin sudah sangat dalam, bagaimana cara mengatasinya?"
 SEA_japan_tokko_arrest_events.3.a: "Biarkan Tentara Kwantung yang menanganinya"
 SEA_japan_tokko_arrest_events.3.b: "Kita harus segera melakukan penangkapan massal!"
 SEA_japan_tokko_arrest_events.3.c: "Mereka tidak menimbulkan ancaman bagi kita, abaikan saja"
 SEA_japan_tokko_arrest_events.4.t: "Insiden Sorge"
 SEA_japan_tokko_arrest_events.4.desc: "Tokkō telah menemukan ancaman lain terhadap stabilitas internal kita. Kali ini, mereka mengungkap jaringan mata-mata [SOV.GetAdjective] yang dipimpin oleh jurnalis [GER.GetAdjective] Richard Sorge, sebuah kelompok yang dinyatakan bersalah melakukan kegiatan spionase dan subversif di seluruh negara kita. Mereka sepertinya sudah mendapatkan kolaborator yang juga harus ditangani, seperti mantan jurnalis Asahi Shimbun Hotsumi Ozaki dan Koichi Saionji, anggota bangsawan kita."
 SEA_japan_tokko_arrest_events.4.a: "Agen Asing mendapatkan apa yang pantas mereka dapatkan!"
 SEA_japan_tokko_arrest_events.4.b: "Cobalah untuk tidak membuat marah [SOV.GetAdjective]"
 JAP_sorge_incident_tt: "Berbagai [SOV.GetAdjective] dan koneksi mereka di negara kita yang dicurigai sebagai mata-mata akan ditangkap"
 SEA_japan_tokko_arrest_events.5.t: "Insiden Yokohama"
 SEA_japan_tokko_arrest_events.5.desc: "Polisi Tinggi Khusus Yokohama telah menangkap hampir tiga lusin intelektual dengan tuduhan mencoba menghidupkan kembali Partai Komunis yang sebelumnya dibubarkan secara paksa oleh Tokkō. Para tersangka termasuk editor majalah Chuo Koron, Kaizō, dan Nippon Hyoron. Tampaknya penegakan hukum kita telah melakukan tugasnya dengan baik dalam melindungi jiwa bangsa kita dari ancaman spiritual ini."
 SEA_japan_tokko_arrest_events.5.a: "Semakin banyak pembangkang yang ditindas"
 SEA_japan_tokko_arrest_events.6.t: "Insiden Nakano Seigo"
 SEA_japan_tokko_arrest_events.6.desc: "Nakano Seigo, pendiri dan pemimpin partai politik sayap kanan Tōhōkai, telah ditangkap. Hal ini terjadi setelah partai tersebut diduga tidak dapat melanjutkan kegiatan hukumnya karena penindasan, dan tampaknya mereka berencana untuk mengambil tindakan langsung yang ilegal karena dianggap sebagai 'represi politik' oleh Kabinet kita. Sungguh tidak terhormat!"
 SEA_japan_tokko_arrest_events.6.a: "Beraninya dia menjelek-jelekkan Perdana Menteri kita? Tangkap dia!"
 SEA_japan_tokko_arrest_events.7.t: "Peristiwa Tombak Bambu"
 SEA_japan_tokko_arrest_events.7.desc: "Takeo Shinmyo, kepala reporter Mainichi Shimbun, telah ditangkap oleh Tokkō karena mengkritik upaya perang. Diduga sebagai bagian dari Rivalitas Antar Dinas kami, dia menyatakan bahwa 'Tombak bambu tidak akan memotongnya. Itu adalah pesawat terbang, pesawat maritim.' dan bahwa 'Hasil dari Perang Asia Timur Raya bergantung pada penguatan kekuatan angkatan laut dan udara, dan kita tidak dapat melawan kekuatan udara musuh dengan tombak bambu', secara langsung mengkritik kepemimpinan kita, tentara kita, sambil mempromosikan gagasan bahwa hanya angkatan laut yang dapat membawa kita menuju kemenangan."
 SEA_japan_tokko_arrest_events.7.a: "Mengapa mereka tidak percaya kita akan memenangkan perang ini?"
 SEA_japan_tokko_arrest_events.8.t: "Insiden Gassakusha"
 SEA_japan_tokko_arrest_events.8.desc: "Banyak anggota Departemen Investigasi Kereta Api Manchuria Selatan kini telah ditangkap dua kali oleh Polisi Militer Tentara Kwantung, ditahan karena dicurigai menyebarkan propaganda anti-Jepang dan komunis. [JAP.GetNameDefCap] telah menginstruksikan kami untuk menangani situasi ini dengan tepat namun tidak akan melakukan intervensi secara langsung. Bagaimana situasi ini harus ditangani?"
 SEA_japan_tokko_arrest_events.8.a: "Ikuti arahannya dan mulai penangkapan massal!"
 SEA_japan_tokko_arrest_events.8.b: "Sapukan saja ke bawah permadani, itu tetap menguntungkan kita"
