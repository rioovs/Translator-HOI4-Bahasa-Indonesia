 SEA_warlords.21.desc: "$wtt_political_warlord_support.22.desc$"
 SEA_warlords.21.a: "$wtt_political_warlord_support.22.a$"
 SEA_warlords.22.t: "Kematian Liu Xiang"
 SEA_warlords.22.desc: "Dengan meninggalnya Liu Xiang, pemimpin [SIC.GetNameDef], semakin jelas bahwa kita harus turun tangan dan mengambil kendali secara langsung agar tidak mengambil risiko kehilangan wilayah tersebut kepada pihak yang kurang menguntungkan pemerintah kita. Namun hal ini dapat menimbulkan pertentangan lebih jauh dengan komandan-komandan kecil yang saat ini sedang berjuang untuk mendapatkan kekuasaan, jadi kita harus tetap berhati-hati."
 SEA_warlords.22.a: "Kita harus turun tangan"
 SEA_warlords.22.b: "Biarkan saja"
 SEA_warlords.23.t: "[From.GetNameDefCap] Menuntut Penaklukan"
 SEA_warlords.23.desc: "Tampaknya [From.GetLeader] telah memulai perjuangannya demi Tiongkok, dan hal ini telah mendorong para panglima perang lainnya untuk memihaknya melawan pemerintah pusat. Jika kami bergabung, hal ini berisiko menyerahkan sebagian besar wewenang kami kepada [From.GetNameDef], namun penolakan dapat menimbulkan kemarahan mereka."
 SEA_warlords.23.a: "Lebih baik berjuang bersama daripada sendirian"
 SEA_warlords.23.b: "Kami tidak akan pernah menyerah"
 SEA_warlords.24.t: "[From.GetLeader] Kiriman"
 SEA_warlords.24.desc: "[From.GetLeader] dengan antusias menanggapi tawaran kami untuk bersatu melawan pemerintah pusat dan berjanji untuk membantu kami dalam perjuangan ini. Kita sekarang selangkah lebih maju dalam mempersatukan bangsa kita."
 SEA_warlords.24.a: "Luar biasa"
 SEA_warlords.25.t: "[From.GetLeader] Menolak"
 SEA_warlords.25.desc: "[From.GetLeader] telah membalas tawaran kami untuk bersatu dalam pertempuran demi Tiongkok dengan serangkaian hinaan dan makian, mengklaim bahwa misi kami hanyalah upaya gagal dalam merebut kekuasaan dan menundukkan provinsi. Tampaknya kita tidak akan memiliki mereka di pihak kita dalam pertempuran ini."
 SEA_warlords.25.a: "Maka kita harus menjatuhkannya juga!"
 SEA_warlords.26.t: "[FROM.GetLeader] Menuntut Pengajuan Kami"
 SEA_warlords.26.desc: "Menyusul serangkaian langkah yang mencoba menegaskan dominasi di kawasan ini dan keluarga Ma, [FROM.GetLeader] telah memutuskan bahwa demi kepentingan terbaik kami, kami bersumpah setia kepadanya. [FROM.GetLeader] juga mengklaim bahwa jika kami menolak tawarannya, kami akan dihukum dan pasukan kami dihancurkan, namun pilihannya tetap ada di tangan kami."
 SEA_warlords.26.a: "Kami tidak punya pilihan selain menerima"
 SEA_warlords.26.b: "Kami tidak akan pernah menyerah!"
 SEA_warlords.27.t: "[FROM.GetLeader] Menyerah"
 SEA_warlords.27.desc: "Khawatir bahwa pertempuran hanya akan menyebabkan lebih banyak pertumpahan darah dan ketidakstabilan di wilayah tersebut, [FROM.GetLeader] memutuskan bahwa yang terbaik adalah bersumpah setia kepada kami."
 SEA_warlords.27.a: "Berita bagus"
 SEA_warlords.28.t: "[FROM.GetLeader] Berdiri Tegas"
 SEA_warlords.28.desc: "Meskipun kami berupaya sekuat tenaga untuk menghindari pertumpahan darah lebih lanjut, [FROM.GetLeader] telah mengirimkan kembali surat yang menghina, menyatakan bahwa ancaman kami tidak ada apa-apanya dan bahwa pasukan [FROM.GetNameDef] akan mengarahkan kami kembali ke [ROOT.Capital.GetName] jika kami mencoba melakukan invasi."
 SEA_warlords.28.a: "Lalu kami akan menjatuhkan mereka"
 SEA_warlords.29.t: "[FROM.GetLeader] Mengusulkan Perdamaian"
 SEA_warlords.29.desc: "Mengikuti perkembangan perang terkini, [FROM.GetLeader] telah memutuskan bahwa tidak ada gunanya lagi berperang melawan kita, dan kita harus bersatu melawan musuh yang lebih besar. Dengan ini [FROM.GetLeader] juga telah mengusulkan amnesti penuh bagi tentara dan pemimpin kita jika kita mau menerimanya, memaafkan mereka atas potensi kejahatan terhadap Tiongkok dengan imbalan bergabung dengan senjata."
 SEA_warlords.29.a: "Kedengarannya masuk akal."
 SEA_warlords.29.b: "Kami tidak akan pernah menyerah!"
 SEA_warlords.30.t: "[FROM.GetLeader] Menolak Menyerah"
 SEA_warlords.30.desc: "Mengklaim bahwa tawaran perdamaian dan amnesti kami hanyalah tipuan untuk menghancurkan [FROM.GetNameDef], [FROM.GetLeader] telah menolak untuk menghentikan permusuhan dan malah melancarkan serangan lagi pagi ini. Tampaknya dibutuhkan lebih dari sekedar surat untuk mengakhiri konflik."
 SEA_warlords.30.a: "Pengkhianat itu!"
 SEA_warlords.31.t: "[FROM.GetLeader] Menuntut Transfer [434.GetName]"
 SEA_warlords.31.desc: "Menyusul provokasi baru-baru ini di sepanjang perbatasan, [FROM.GetLeader] kini telah secara resmi mengajukan permintaan agar kami mengeluarkan pasukan kami dari [434.GetName] dan menyerahkannya kepada pihak berwenang [FROM.GetAdjective]. Jika kami menolak, dia mengklaim bahwa [FROM.GetName] akan menjawab dengan kekuatan militer, dan tidak akan berhenti bergerak sampai mereka mencapai Delhi."
 SEA_warlords.31.a: "Mereka tidak memberi kita pilihan"
 SEA_warlords.31.b: "Biarkan mereka mencoba"
 SEA_warlords.32.t: "[FROM.GetLeader] Menolak"
 SEA_warlords.32.desc: "Meskipun kami telah berupaya sebaik mungkin untuk meyakinkan mereka, upaya kami untuk merebut [434.GetName] secara diplomatis tidak membuahkan hasil. Mengulangi Garis McMahon, [FROM.GetLeader] telah mengklaim bahwa kami tidak mempunyai hak atas wilayah tersebut dan bahwa provokasi kami hanyalah gertakan belaka."
 SEA_warlords.32.a: "Lalu kita bertarung"
 SEA_warlords.33.t: "[FROM.GetLeader] Setuju untuk Mentransfer [434.GetName]"
 SEA_warlords.33.desc: "Setelah beberapa hari yang menegangkan, [FROM.GetLeader] telah setuju untuk mentransfer [434.GetName] dan meninggalkan Jalur McMahon, dengan menyatakan bahwa mencoba menerapkannya hanya akan menimbulkan lebih banyak masalah daripada manfaatnya. Dengan ini negara kita tumbuh semakin besar."
 SEA_warlords.33.a: "Luar biasa"
 tsr_sichuan_border_war.1.t: "[SIC.GetNameDefCap] Menaklukkan [601.GetName]"
 tsr_sichuan_border_war.1.desc: "Setelah kampanye cepat di [601.GetName], tentara [SIC.GetAdjective] di bawah pimpinan Liu Wenhui telah merebut sebagian besar provinsi tersebut dan mendeklarasikan wilayah tersebut di bawah kendali mereka."
 tsr_sichuan_border_war.1.a: "Kekuatan Kami Tumbuh!"
 tsr_sichuan_border_war.1.b: "Itu tidak bagus"
 tsr_sichuan_border_war.2.t: "[SIC.GetNameDefCap] menarik diri dari [601.GetName]"
 tsr_sichuan_border_war.2.desc: "Menghadapi kesulitan yang parah, pasukan [SIC.GetAdjective] telah mundur dari [601.GetName] dan menyatakan diakhirinya misi militer mereka. Perbatasan akan tetap seperti apa adanya."
 tsr_sichuan_border_war.2.a: "Setidaknya mereka tidak mengambil kembali sisa Xikang..."
 tsr_sichuan_border_war.2.b: "Xikang berdiri!"
 chiang_will_be_shot_tt: "§RAkan ada banyak orang yang kesal dengan Chiang Kai-Shek setelah ini...§!"
 chiang_could_be_shot_tt: "§RAda beberapa orang yang mungkin akan kecewa dengan Chiang Kai-Shek setelah ini...§!"
 SEA_warlords.34.t: "Insiden Liangguang"
 SEA_warlords.34.desc: "Menyusul serangkaian provokasi, kedua provinsi Guangxi dan Guangdong bersatu dengan alasan mengklaim bahwa kami terlalu pasif terhadap Jepang dan karena itu mempertanyakan kekuasaan kami. Mereka menyatakan bahwa jika kami tidak bertindak, mereka akan menyerang pasukan kami dan merebut Nanjing. Meskipun mereka telah mengusulkan agar Chiang Kai-Shek pergi ke Guangzhou untuk membahas lebih lanjut cara menangani Jepang, tidak jelas apakah ini hanya jebakan."
 SEA_warlords.34.a: "Kita tidak akan tertipu oleh kebohongan mereka!"
 SEA_warlords.34.b: "Kirim dia ke Guangzhou untuk membahas Front Persatuan ini"
 SEA_warlords.35.t: "Chiang Kai-Shek Tiba di Guangzhou"
 SEA_warlords.35.desc: "Dengan semangat tinggi dan tangan terangkat lebih tinggi, Chiang Kai-Shek tiba pagi ini dengan satu batalion kecil sebagai pengawal. Namun nampaknya menerima tawaran tersebut bukanlah sebuah jebakan dan negosiasi segera dimulai. Chen Jitang dan Li Zongren sama-sama mendorong Chiang untuk membentuk front persatuan melawan Jepang, bahkan sampai menghentikan permusuhan dengan komunis untuk sementara waktu. Sulit untuk mengatakan apakah ini pilihan yang benar, tetapi mungkin saja memang benar."
 SEA_warlords.35.a: "Maka kita akan bersatu!"
 SEA_warlords.35.b: "Mari kita tunggu dan lihat..."
 SEA_warlords.36.t: "Desersi dan Pengkhianat"
 SEA_warlords.36.desc: "Menyusul deklarasi Nanjing bahwa mereka tidak akan mundur terhadap ancaman apa pun dan deklarasi oposisi kami berikutnya, sebagian tentara kami telah meninggalkan pasukan dan Jenderal Yu Hanmou mengancam bahwa jika [ROOT.GetLeader] tidak mengundurkan diri, ia akan bergerak ke Guangzhou dan memaksanya melewatinya."
 SEA_warlords.36.a: "[ROOT.GetLeader] harus mengundurkan diri"
 SEA_warlords.36.b: "Kami tidak akan mundur!"
 SEA_warlords.36.c: "Hanya bersama-sama kita dapat menangkis ancaman ini!"
 SEA_warlords.36.tt: "§RJika Guangxi Menolak Proposal kami, kami akan segera terjerumus ke dalam perang saudara!§!"
 SEA_warlords.37.t: "Perjuangan untuk Guangxi"
 SEA_warlords.37.desc: "Menyusul pernyataan Nanjing bahwa mereka tidak akan mundur terhadap ancaman apa pun yang kami berikan dan pernyataan penentangan kami berikutnya, terdapat pihak-pihak yang khawatir bahwa Pemerintah Pusat akan memaksa kami untuk menyerah kepada kekuasaan mereka melalui kekuatan militer."
 SEA_warlords.37.a: "Kalau begitu biarkan mereka datang!"
 SEA_warlords.37.b: "Kami menyerah"
 SEA_warlords.38.t: "Kelompok Guangxi menyerah"
 SEA_warlords.38.desc: "Khawatir bahwa kami akan menghancurkan provinsi mereka dalam proses mengemudikan [GXC.GetLeader], mereka malah mengusulkan agar mereka menjadi bagian dari republik kami dengan imbalan semua pemimpin diampuni dan mempertahankan posisi mereka. Tampaknya ini merupakan kompromi yang adil."
 SEA_warlords.38.a: "Baiklah"
 SEA_warlords.39.t: "Runtuhnya Klik Guangdong"
 SEA_warlords.39.desc: "Setelah beberapa jam yang menegangkan di ambang perang saudara, Chen Jitang setuju untuk mengundurkan diri dan kami telah memindahkan pasukan kami ke Guangdong. Apa yang akan terjadi selanjutnya di provinsi ini sepenuhnya ada di tangan kita."
 SEA_warlords.39.a: "Luar biasa"
 SEA_warlords.40.t: "Perang Saudara di Guangdong"
 SEA_warlords.40.desc: "Setelah Chen Jitang menolak untuk mundur meskipun ada desersi ke pihak kami dan Yu Hanmou mengancam untuk bergerak ke Guangzhou, provinsi tersebut telah terjerumus ke dalam perang saudara besar-besaran antara pasukan pro-pemerintah melawan pasukan anti-pemerintah. Kita harus turun tangan untuk memperbaiki kekacauan ini."
 SEA_warlords.40.a: "Orang bebal yang keras kepala itu..."
 SEA_warlords.41.t: "Kelompok Guangxi Berdiri Menantang"
 SEA_warlords.41.desc: "Mengklaim bahwa ancaman invasi kami hanyalah sebuah dongeng, [GXC.GetLeader] telah menyatakan bahwa mereka tidak akan mundur melainkan memaksa kami untuk bernegosiasi. Apakah ini akan berhasil masih terlalu dini untuk dikatakan, tapi kita hanya perlu menunggu dan melihat."
 SEA_warlords.41.a: "Oh baiklah"
 SEA_warlords.42.t: "Han Fuju Kabur dari Jinan"
 SEA_warlords.42.desc: "Meskipun memiliki kapasitas untuk bertahan lebih lama, Han Fuju telah memutuskan untuk melarikan diri dari Jinan dan membiarkan sayap kami tidak dijaga. Dia telah ditangkap oleh pasukan kita karena pengkhianatan tetapi pertanyaannya adalah apa yang harus kita lakukan terhadapnya. Haruskah kita mengambilnya dan merampas seluruh tanahnya sebagai contoh, atau haruskah kita meminta jenderal lain mengambil alih untuk menghindari masalah lebih lanjut?"
 SEA_warlords.42.a: "Berikan contoh padanya"
 SEA_warlords.42.b: "Biarkan Sun Tongxuan mengambil alih untuk saat ini"
 may_join_japan_tt: "§RAda kemungkinan dia bisa bergabung dengan Jepang§!"
 SEA_warlords.43.t: "Aturan Sun Tongxuan"
 SEA_warlords.43.desc: "Setelah pelarian pengecut Han Fuju dari Jinan, terjadi kekosongan kekuasaan di provinsi Shandong yang dilanda perang. Memilih untuk tidak turun tangan melainkan menunjuk Sun Tongxuan sebagai Gubernur Sementara, Pemerintah Pusat menyerahkan pilihan kepada kita mengenai apa yang harus dilakukan selanjutnya."
 SEA_warlords.43.a: "Berpihak pada Pemerintah Pusat"
 SEA_warlords.43.b: "Kuomintang telah gagal, kita harus bergabung dengan Jepang!"
 SEA_warlords.44.t: "[FROM.GetLeader] Mengusulkan Penyatuan Liangguang"
 SEA_warlords.44.desc: "Kami baru saja menerima kabar dari [FROM.GetNameDef] bahwa mereka ingin kedua wilayah kami bersatu kembali menjadi entitas yang dikenal sebagai Liangguang. Ini adalah gagasan yang disimak sejak Dinasti Qing sebagai Raja Muda Liangguang. Meskipun kita tidak lagi membutuhkan gelar kekaisaran seperti itu, kekuatan dan prestise yang dimiliki entitas bersatu ini pada saat itu tidak dapat disangkal."
 SEA_warlords.44.a: "Ya, hanya melalui kerja sama yang lebih dalam kita bisa sukses!"
 SEA_warlords.44.b: "Kami tidak akan bekerja sama dengan Raja Negeri Selatan!"
 SEA_warlords.45.t: "[FROM.GetLeader] Menyetujui Unifikasi"
 SEA_warlords.45.desc: "Berita bagus! [GXC.GetNameDefCap] telah menyetujui usulan penyatuan kami di bawah bendera Liangguang. Bersama-sama kita membentuk faksi yang kuat, dengan banyak industri, bahan mentah, dan tenaga kerja yang kita miliki! Seluruh Tiongkok sekarang terguncang karena kekuatan dan kemauan kita yang bersatu."
 SEA_warlords.45.a: "Kami akan menang!"
 SEA_warlords.46.t: "[FROM.GetLeader] Abaikan Kami"
 SEA_warlords.46.desc: "Kami telah mendengar kabar dari [GXC.GetNameDef], dan sayangnya mereka telah memutuskan bahwa 'kedaulatan' mereka yang akan segera hilang lebih penting daripada masa depan yang bersatu bagi kita bersama. Kita sekarang harus mempertimbangkan langkah-langkah alternatif, yang paling mungkin mewujudkan penyatuan ini melalui kekuatan, karena hanya dengan bersama-sama kita dapat melawan kekuatan-kekuatan yang berpihak pada kita."
 SEA_warlords.46.a: "Sekarang adalah kemenangan atau kematian!"
 SEA_warlords.46.tt: "§RHal ini kemungkinan akan menyebabkan perang dengan [CHI.GetNameDef]§!"
 SEA_warlords.47.t: "Kepemimpinan Klik Liangguang"
 SEA_warlords.47.desc: "Kini, setelah penyatuan semakin dekat, kita harus mengambil keputusan sulit mengenai siapa yang harus memimpin kelompok baru ini. Kedua pilihan tersebut merupakan pilihan yang tepat, karena [ROOT.GetLeader] memegang komando tertinggi angkatan udara, sementara Li Zongren adalah ahli pertempuran darat, dan sosok inspiratif bagi pasukan. Siapa yang akan menjadi pemenang?"
 SEA_warlords.47.a: "[ROOT.GetLeader] seharusnya tetap ada"
 SEA_warlords.47.b: "Klik Guangxi Baru mempunyai otoritas yang lebih kuat!"
 SEA_warlords.48.t: "Kelompok Selatan Bersatu Melawan Kita"
 SEA_warlords.48.desc: "Jauh lebih mudah untuk membawa persatuan ke dalam bangsa kita sekali lagi ketika faksi-faksi yang menyimpang di negara kita berjumlah kecil dan terpecah-belah. Sayangnya, provinsi-provinsi di wilayah selatan sudah mulai bersatu, dan hambatan yang menghambat kekuatan kita ini menimbulkan kekhawatiran yang semakin besar. Mereka mampu mengerahkan sumber daya dan tenaga dalam jumlah yang mengkhawatirkan untuk melawan kita, jika mereka memilih untuk menolak."
 SEA_warlords.48.a: "Kami akan mengembalikan mereka ke bawah kendali kami!"
 SEA_warlords.48.b: "Adalah bijaksana untuk tidak memprovokasi mereka..."
 SEA_warlords.48.tt: "§RJika kita tidak bisa mengalahkan mereka dalam waktu setengah tahun, kita akan menemui jalan buntu!§!"
 SEA_warlords.49.t: "Konflik yang Stagnasi"
 SEA_warlords.49.desc: "Dengan meningkatnya tekanan dari lawan-lawan politik kita dan berkurangnya semangat pasukan kita, menjadi jelas bahwa kita harus menghentikan pertempuran yang sia-sia dan beralih ke ancaman yang lebih besar yang mengancam di wilayah timur. Hari telah berlalu, pasukan [GDC.GetLeader] akan terus menduduki bagian selatan Tiongkok untuk sementara waktu."
 SEA_warlords.49.a: "Maka kita akan menunggu waktu kita..."
 SEA_warlords.50.t: "Delegasi dari [FROM.GetLeader] Tiba"
 SEA_warlords.50.desc: "Sebuah delegasi yang dikirim dari Xi'an hari ini telah menghubungi kami, ingin membahas tindakan anti-Jepang lebih lanjut dalam beberapa bulan mendatang. Tampaknya [FROM.GetLeader] telah menjalin kontak dengan CPC di pegunungan Shaanxi, dan ingin menjalin aliansi bersama dengan mereka. Untuk melakukan hal ini, [FROM.GetLeader] ingin kami menggunakan kontak kami di [SOV.GetNameDef] untuk mencari bantuan yang dapat membantu konflik yang akan datang."
 SEA_warlords.50.a: "Bersama-sama kita akan mengalahkan ancaman yang muncul di wilayah timur"
 SEA_warlords.51.t: "Diskusi yang Bermanfaat di Luochuan"
 SEA_warlords.51.desc: "Awal pekan ini, perwakilan kami Li Kenong bertemu dengan [FROM.GetLeader] di Luochuan, untuk membahas masalah anti-Jepang dan pertanyaan tentang bantuan Soviet dalam perjuangan melawan penjajah. Di akhir pertemuan, mereka sepakat untuk melawan Jepang, meski tidak setuju untuk bernegosiasi dengan Chiang Kai-shek. Namun Zhang, yang menyimpan dendam terhadap Jepang karena membunuh ayahnya, telah menyatakan bahwa dia akan melakukan apa pun yang dia bisa, bahkan jika itu membunuhnya, untuk meyakinkan generalissimo agar bergabung dengan PKT melawan Jepang."
 SEA_warlords.51.a: "Mungkin kita telah menemukan sekutu lain"
 SEA_warlords.52.t: "[FROM.GetLeader] Ingin Menghentikan Kampanye Pengepungan"
 SEA_warlords.52.desc: "[FROM.GetLeader] saat ini ditugaskan untuk memberantas bandit di wilayah kami atas perintah [CHI.GetLeader]. Tentu saja ini termasuk kami, namun [FROM.GetLeader] telah menghubungi kami dan bertanya-tanya apakah kami dapat menghentikan permusuhan untuk sementara waktu saat dia bersiap untuk membentuk Front Persatuan antara kami dan KMT. Apakah kita menerima usulan ini?"
 SEA_warlords.52.a: "Kami dengan senang hati akan mengambil jeda ini"
 SEA_warlords.52.b: "Kami mempunyai rencana lain untuk [FROM.GetNameDef]"
 SEA_warlords.53.t: "[FROM.GetLeader] Menyelundupkan Dana dan Peralatan untuk Tujuan ini"
 SEA_warlords.53.desc: "[FROM.GetLeader] telah mulai menyelundupkan senjata dan dana yang diberikan kepada pasukannya oleh pemerintah pusat di Nanjing dan mengirimkannya ke wilayah basis revolusioner kami melalui berbagai cara, dalam upaya untuk meningkatkan rasa saling percaya dan memperkuat kami karena kami adalah musuh bebuyutan [JAP.GetAdjective]."
 SEA_warlords.53.a: "Kami akan memanfaatkannya dengan baik"
 SEA_warlords.54.t: "[FROM.GetLeader] Menarik Pasukan dari [1032.GetName]"
 SEA_warlords.54.desc: "[FROM.GetLeader] telah menarik pasukan yang ditempatkan di kota Yan'an dalam upaya tidak hanya untuk memperkuat kami, namun juga untuk menarik perhatian pemerintah pusat. Dengan melakukan hal ini, [CHI.GetLeader] kemungkinan besar akan menuju ke utara untuk menghukum pasukan penindas dan berupaya memindahkan mereka ke tenggara, sekaligus menegur pemerintah daerah yang memberontak seperti [FROM.GetLeader] dan [SHX.GetLeader]. Namun saat dia berada di Xi'an, [FROM.GetLeader] berencana mengambil pendekatan drastis untuk meyakinkan [CHI.GetLeader] agar membentuk Front Persatuan melawan Jepang."
 SEA_warlords.54.a: "Berita bagus!"
 SEA_warlords.55.t: "Serangannya Stagnan"
 SEA_warlords.55.desc: "Dengan meningkatnya tekanan dari Pemerintah Pusat untuk memberikan hasil yang sia-sia dan berkurangnya semangat pasukan kita, menjadi jelas bahwa kita harus menghentikan pertempuran yang sia-sia dan beralih ke ancaman yang lebih besar yang mengancam Tiongkok. Hari telah berlalu, [PRC.GetNameDef] berdiri kokoh dalam menghadapi kesulitan, dan pasukan mereka akan terus menduduki bagian utara provinsi kami untuk sementara waktu."
 SEA_warlords.55.a: "Maka kita akan menunggu waktu kita..."
 SEA_warlords.55.tt: "Sekarang kita dapat mengambil fokus §Y$XIC_request_relocation_to_northeastern_command$§!"
 SEA_warlords.56.t: "[FROM.GetLeader] Meminta relokasi ke [608.GetName]"
 SEA_warlords.56.desc: "Marsekal muda [FROM.GetLeader] telah meminta untuk dipindahkan ke garnisun timur laut di [608.GetName], agar lebih dekat dengan ancaman Jepang dan bertindak sebagai benteng melawan agresi mereka. Sebagai mantan pemimpin Kelompok Fengtian, sepertinya dia ingin mengambil langkah proaktif untuk merebut kembali tanah airnya yang hilang. Bagaimana menurut kita?"
 SEA_warlords.56.a: "Pendekatan proaktif terhadap pertahanan? Bagus sekali!"
 SEA_warlords.56.b: "Kami tidak bisa mempercayai dia dengan postingan itu"
 SEA_warlords.57.t: "[FROM.GetLeader] Menolak Permintaan kami"
 SEA_warlords.57.desc: "Pengkhianat yang berpuas diri [FROM.GetLeader] telah menolak permintaan kami untuk menyiapkan posisi terdepan melawan Jepang, jelas tidak memikirkan masa depan terbaik Tiongkok."
 SEA_warlords.57.a: "Mereka akan menyesali hari ini..."
 SEA_warlords.58.t: "Tekanan dari Pemerintah untuk tunduk pada [XIC.GetNameDef]"
 SEA_warlords.58.desc: "Permintaan bersama datang dari [XIC.GetNameDef] dan [FROM.GetNameDef] untuk tunduk pada rencana baru mereka untuk menyerahkan [608.GetName] dan wilayah sekitarnya kepada Marsekal Muda untuk digunakan sebagai markas operasi baru melawan Jepang. Tampaknya mereka bermaksud untuk mengakhiri otonomi kita, dengan satu atau lain cara..."
 SEA_warlords.58.a: "Baiklah, tugas kita sudah selesai"
 SEA_warlords.58.b: "Mereka harus mengambil [608.GetName] dengan paksa!"
 SEA_warlords.59.t: "Pergerakan Besar ke Utara"
 SEA_warlords.59.desc: "Akhirnya, tiba waktunya untuk merebut kembali wilayah Kelompok Fengtian yang hilang. [608.GetName] kini berada di bawah komando kami, dan tugas kami untuk memberantas bandit di Shaanxi telah berakhir secara resmi. Segera, seluruh tanah air yang hilang akan kembali di bawah kendali kita!"
 SEA_warlords.59.a: "Kami selangkah lebih dekat untuk memulihkan kehormatan kami!"
 SEA_warlords.60.t: "Jenderal Membelot ke [FROM.GetNameDef]"
 SEA_warlords.60.desc: "Beberapa jenderal dan tentara yang pernah setia kepada marshal tua Zhang Zuolin yang dibunuh Tentara Kwantung beberapa tahun lalu kini mengindahkan seruan putranya, [FROM.GetLeader], dan membelot ke [FROM.GetNameDef]. Ini adalah bencana!"
 SEA_warlords.60.a: "Momok Zuolin masih menghantui kita..."
 SEA_warlords.61.t: "Misi yang Gagal"
 SEA_warlords.61.desc: "Menyusul penculikan [CHI.GetLeader] dan bujukan kami yang kuat untuk menghentikan kampanye pengepungan agar fokus pada ancaman yang lebih besar terhadap rakyat Tiongkok, kami telah menerima surat perintah penangkapan dan ancaman dari pemerintah pusat, yang menyatakan [ROOT.GetLeader] dan orang-orang terdekatnya harus bertanggung jawab, dan Markas Besar Penindasan Bandit Barat Laut harus dibubarkan seluruhnya. Haruskah kita menerima nasib ini, atau terus berjuang di lain hari?"
 SEA_warlords.61.a: "Setidaknya kita mendapatkan aliansi yang kita minta..."
 SEA_warlords.61.b: "Tidak, kita harus tetap mandiri untuk mencapai tujuan utama [ROOT.GetLeader]!"
 SEA_warlords.62.t: "Pembubaran Markas Besar Penindasan Bandit Barat Laut"
 SEA_warlords.62.desc: "Menyusul penculikan [ROOT.GetLeader] dan bujukan paksa untuk membentuk Front Persatuan kedua, pejabat pemerintah kami telah mengeluarkan surat perintah penangkapan dan ancaman terhadap [FROM.GetLeader] dan anak buahnya, dan mulai memindahkan pasukan untuk mengakhiri misi otonom Markas Besar Penindasan Bandit Barat Laut. Sudah saatnya para pengkhianat ini mendapatkan apa yang pantas mereka dapatkan."
 SEA_warlords.62.a: "Mereka gagal dalam misinya, kendalikan mereka"
 SEA_warlords.63.t: "Persediaan [SOV.GetAdjective] Tambahan Tiba Melalui Irkeshtam Pass"
 SEA_warlords.63.desc: "Awal pekan ini, [SOV.GetAdjective] tambahan tiba untuk pasukan kami di sekitar Kashgar melalui Jalur Irkeshtam di sebelah baratnya. Ditugaskan oleh Alexander Barmine, [SOV.GetAdjective] yang bertanggung jawab memasok senjata ke pemerintah kita, tampaknya [SOV.GetNameDef] memiliki rencana khusus untuk memperdalam kerja sama kita lebih jauh."
 SEA_warlords.63.a: "Kami mengucapkan terima kasih kepada rekan-rekan kami atas kemurahan hati mereka"
 SEA_warlords.64.t: "$KHM_ma_hushan$ Tiba dengan [KHM.GetAdjective] Emas"
 SEA_warlords.64.desc: "$KHM_ma_hushan$, komandan divisi Kuomintang ke-36 dan Padishah [KHM.GetNameDef] yang dipermalukan telah tiba di [441.GetName] setelah meninggalkan pasukannya, membawa serta 1.000 ons emas yang ia dan anak buahnya curi dari bekas ibu kota negara bagian. Ini berbau peluang..."
 SEA_warlords.64.a: "Sita emasnya!"
 SEA_warlords.65.t: "[FROM.GetLeader] Ingin Menyatukan Kirghiz"
 SEA_warlords.65.desc: "[FROM.GetLeader], subjek setia kami yang saat ini mengendalikan [FROM.GetNameDef] setelah kudeta militer di provinsi yang didukung oleh NKVD telah menyatakan keinginan untuk menyatukan provinsi tersebut dengan Kirghistan, untuk mengembangkan wilayah dengan lebih baik dan menyatukan orang-orang yang tersebar di bawah bendera yang sama. Bagaimana menurut kita?"
 SEA_warlords.65.a: "Selama dia tetap setia"
 SEA_warlords.65.b: "Kami tidak akan berkompromi di perbatasan kami!"
 SEA_warlords.66.t: "[FROM.GetLeader] Mentransfer Kirghistan"
 SEA_warlords.66.desc: "[FROM.GetLeader] telah menyetujui permintaan kami dan wilayah Pamir ditransfer kepada kami saat pesan ini diterima. Mulai saat ini, negara bagian akan diperintah oleh kami, secara mandiri dari aturan [FROM.GetAdjective] langsung."
 SEA_warlords.66.a: "Hari yang menyenangkan!"
 SEA_warlords.67.t: "[FROM.GetLeader] Menolak Permintaan kami"
 SEA_warlords.67.desc: "[FROM.GetLeader] telah menolak permintaan kami untuk pengalihan lahan. Hal ini memang sudah diduga dari mereka, namun hal ini pasti akan merugikan hubungan kita dalam jangka panjang."
 SEA_warlords.67.a: "Kami akan mendapatkannya kembali suatu hari nanti..."
 SEA_warlords.68.t: "Jenderal Guominjun Membelot ke [FROM.GetNameDef]"
 SEA_warlords.68.desc: "Feng Yuxiang dan tentaranya yang dulu setia kepada Guominjun, sebuah organisasi yang pernah memberontak melawan kami dan bergabung kembali setelah kami menghancurkan mereka, kini membelot ke [FROM.GetNameDef] karena [FROM.GetLeader] telah mendeklarasikan kebangkitan organisasi militer tersebut."
 SEA_warlords.68.a: "Hantu Guominjun masih menghantui kita..."
 SEA_warlords.69.t: "Pembubaran Dewan Politik Hebei-Chahar"
 SEA_warlords.69.desc: "Setelah jatuh ke tangan kekuatan musuh, Dewan Politik Hebei-Chahar yang bertindak sebagai otonomi lokal untuk menghormati tuntutan demiliterisasi regional yang dibuat oleh Jepang sebagai bagian dari perjanjian He-Umezu tidak lagi memiliki tujuan nyata. Mungkin ini saatnya untuk mengembalikan kepemimpinan mereka, dan menempatkan pasukan mereka di bawah komando pemerintah pusat."
 SEA_warlords.69.a: "Mereka telah mencapai tujuan mereka"
 SEA_warlords.69.b: "Mereka mungkin masih berguna bagi kita"
 SEA_warlords.70.t: "Warisan Pingnan Guo"
 SEA_warlords.70.desc: "Setelah mencapai apa yang diinginkan oleh rakyat kami selama Pemberontakan Panthay dan Dungan, dengan mengusir seluruh sisa pemerintahan Qing dan Kuomintang dari Tiongkok, banyak yang mempertanyakan sifat pemerintahan kami di negara ini. Haruskah kita mengambil peran Du Wenxiu dan mewujudkan era keemasan baru kita, atau mengambil rute yang lebih aman dan mengikuti jejak Yuan Shikai?"
 SEA_warlords.70.a: "Akhirnya tiba saatnya untuk membentuk pemerintahan baru!"
 SEA_warlords.70.b: "Kami akan menjadi sebuah kerajaan sekali lagi!"
 SEA_warlords.70.c: "Hidup Dinasti Ma Agung!"
 SEA_warlords.71.t: "[FROM.GetLeader] Meminta Bantuan"
 SEA_warlords.71.desc: "[FROM.GetLeader] telah meminta bantuan kami dalam memerangi [SIK.GetLeader]. Walaupun kehilangan mereka berarti kita kehilangan pijakan keluarga kita di provinsi ini, penting juga bagi kita untuk tidak membiarkan komunis di wilayah timur mengambil kesempatan ketika pasukan kita sedang tidak berperang di tempat lain."
 SEA_warlords.71.a: "Kami akan membantu mereka dalam perjuangan melawan komunisme!"
 SEA_warlords.71.b: "Kita sudah punya cukup banyak masalah untuk diatasi"
 SEA_warlords.72.t: "Bantuan Tiba dari [FROM.GetNameDef]"
 SEA_warlords.72.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk sepenuhnya mendukung upaya kami untuk memastikan Soviet tidak merebut provinsi kami, dan dengan demikian mempertaruhkan hubungan mereka sendiri dengan negara."
 SEA_warlords.72.a: "Dengan ini kita bisa membalikkan keadaan!"
 SEA_warlords.73.t: "Tidak Ada Bantuan yang Tiba dari [FROM.GetNameDef]"
 SEA_warlords.73.desc: "[FROM.GetLeader] dari [FROM.GetNameDef] telah memutuskan untuk tidak memberikan bantuan apa pun kepada kami untuk menyenangkan pemerintah Soviet karena mereka lebih menghargai kemitraan mereka dengan negara ini daripada kelangsungan hidup kami."
 SEA_warlords.73.a: "Pengkhianat sialan itu"
 SEA_warlords.74.t: "Jatuhnya Kelompok Khotan Ma"
 SEA_warlords.74.desc: "Setelah kudeta terhadap Ma Hushan, banyak anggota keluarga kami mulai membanjiri perbatasan untuk bergabung dengan kami guna merebut kembali kelompok mereka yang hilang pada waktunya."
 SEA_warlords.74.a: "Kami menyambut Anda saudara-saudara"
 SEA_warlords.75.t: "[FROM.GetLeader] Ingin Memulai Kampanye Suiyuan"
 SEA_warlords.75.desc: "Tentara Mongolia Dalam dan Tentara Benar Grand Han siap melancarkan operasi ke wilayah panglima perang [SHX.GetLeader], asalkan mereka mendapat dukungan udara dan pengawasan kami oleh perwira staf Jepang. Mungkin kita bisa mengamankan lebih banyak wilayah Mongolia Dalam tanpa menimbulkan perang skala besar di Tiongkok."
 SEA_warlords.75.a: "Mereka dipersilakan untuk mencoba"
 SEA_warlords.75.b: "Ide yang bodoh"
 JAP_suiyuan_campaign_has_started_flag: "Kampanye Suiyuan telah Dimulai"
 JAP_suiyuan_campaign_has_ended_flag: "Kampanye Suiyuan telah Berakhir"
 SEA_warlords.100.t: "[XIC.GetName] Mengkhianati [ROOT.GetLeader]"
 SEA_warlords.100.desc: "Sebuah laporan penting datang dari [XIC.GetNameDef] yang menyatakan bahwa [XIC.GetLeader] telah menarik pasukannya dari [1032.GetName], sehingga pasukan [PRC.GetNameDef] masuk ke wilayah tersebut dan mengklaim wilayah tersebut sebagai milik mereka. Seluruh tujuan [XIC.GetName] adalah untuk menjaga [PRC.GetName] dan memberantasnya - bukan membantu mereka."
 SEA_warlords.100.a: "Pengkhianatan ini tidak akan bertahan!"
 #Tooltips
 SIC_can_lead_to_war_with_china_tt: "§RHal ini dapat menyebabkan konflik lebih lanjut dengan Pemerintah Pusat!§!"
 SIK_locks_good_focus_tt: "§RKami belum mampu mencapai Klik United Sinkiang§!"
 SIK_failed_campaign_tt: "[SIK.GetLeader] telah gagal mengusir Kuomintang dari provinsi tersebut"
 yulbars_khan_fled_tt: "$KUM_yulbars_khan$ melarikan diri ke Khotan"
 TSR_recieve_pp_warlord: "Kami akan menerima 100 kekuatan politik setelah mereka menepati janji mereka"
 TSR_recieve_manpower_warlord: "Kami akan menerima 5.000 tenaga kerja setelah mereka menepati kesepakatan mereka"
 TSR_recieve_equipment_warlord: "Kami akan menerima 1000 peralatan infanteri setelah mereka menepati kesepakatan mereka"
 #############
 ##MANCHUKUO##
 #############
 tsr_manchukuo.1.t: "Pertanyaan tentang Kepemimpinan"
 tsr_manchukuo.1.desc: "Posisi Kaisar selalu menjadi duri bagi posisi Manchuria sebagai sebuah kerajaan. Dengan negara yang berfungsi sebagai republik di bawah pemerintahan Perdana Menteri Zhang Jinghui dan Tentara Kwantung, Kaisar sangat lemah dan hampir tidak bisa berfungsi sebagai boneka. Namun hal ini bisa saja diubah, karena beberapa perwira Tentara Kwantung percaya bahwa agar negara bisa sejahtera, takhta harus berada di tangan Kaisar. Namun ada juga yang melihat Puyi sebagai sosok yang lemah dan tidak dapat diandalkan, dan lebih memilih tahta jatuh ke tangan saudaranya yang berpendidikan Jepang, Pujie."
 tsr_manchukuo.1.a: "Kita harus menjaga status quo"
 tsr_manchukuo.1.b: "Puyi harus mendapatkan tahtanya!"
 tsr_manchukuo.1.c: "Kaisar tidak bisa dipercaya, Pujie adalah pilihan yang tepat"
 tsr_manchukuo.2.t: "[FROM.GetLeader] Meminta Kontrol Atas Dalian"
 tsr_manchukuo.2.desc: "Malam ini, [FROM.GetLeader] datang dengan proposal yang cukup menarik: Agar kami menyerahkan administrasi Wilayah Sewa Kwantung di sekitar kota pelabuhan Dalian sementara kami tetap menjalankan operasi kami seperti sebelumnya. Beliau menyatakan bahwa karena kedua negara kita sudah tidak dapat dipisahkan, maka masuk akal untuk menyatukan kembali Dalian dengan wilayah Manchuria lainnya, sekaligus membebaskan kita dari sejumlah biaya administrasi."
 tsr_manchukuo.2.a: "Mengapa tidak?"
 tsr_manchukuo.2.b: "Kami tidak akan pernah menyerahkan wilayah kami seperti itu!"
 tsr_manchukuo.3.t: "Pemindahan Dalian"
 tsr_manchukuo.3.desc: "Setelah setuju dengan argumen kami bahwa masuk akal untuk menyatukan kembali Wilayah Sewa Kwantung dengan negara Manchuria lainnya, pihak berwenang Jepang setuju untuk mentransfer wilayah tersebut."
 tsr_manchukuo.3.a: "Sempurna!"
 tsr_manchukuo.4.t: "Orang Jepang Menolak"
 tsr_manchukuo.4.desc: "Karena tidak terbujuk dengan argumen kami, mereka malah orang Jepang menertawakan permintaan serius kami untuk memindahkan pelabuhan Dalian. Dengan menyatakan bahwa hal tersebut \"benar-benar konyol\", mereka menyarankan agar kita mempertimbangkan kembali betapa pentingnya peran kita dalam bidang ini."
 tsr_manchukuo.4.a: "Oh baiklah"
 tsr_manchukuo.5.t: "Revolusi Menyebar"
 tsr_manchukuo.5.desc: "Menyusul peristiwa mengejutkan di Manchuria, sekelompok komunis yang dikenal sebagai Partai Revolusioner Rakyat Mongolia Dalam telah memutuskan untuk mencoba mengambil alih dan melakukan kudeta terhadap Pemerintahan Mengjiang. Meskipun pada awalnya mereka tidak berhasil merebut seluruh wilayah negara tersebut, mereka mungkin akan segera mempertimbangkan untuk segera melepaskan kendali Jepang di wilayah tersebut."
 tsr_manchukuo.5.a: "Revolusi akan menang!"
 tsr_manchukuo.5.b: "Pengkhianat!"
 tsr_manchukuo.6.t: "[MAN.GetLeader] Mengusulkan Aliansi"
 tsr_manchukuo.6.desc: "Menyusul kemenangan mereka dalam perang melawan Jepang, cabang lokal PKT di Manchuria telah mengusulkan agar kita bersatu dalam pertempuran untuk menguasai Tiongkok. Kalau ini hanya upaya perebutan kekuasaan memang belum terlihat, tapi bisa jadi ini peluang emas."
 tsr_manchukuo.6.a: "Tentu saja kami akan mendukung saudara-saudara kami di utara!"
 tsr_manchukuo.6.b: "Tidak pernah"
 tsr_manchukuo.7.t: "[MAN.GetLeader] Mengusulkan Integrasi"
 tsr_manchukuo.7.desc: "Menyusul kemenangan dalam perang melawan Pemerintah Tiongkok dan proklamasi Republik Rakyat Tiongkok, [MAN.GetLeader] telah menyerukan kepada kita semua cabang CPC lainnya untuk berintegrasi ke dalam republik baru ini dengan janji mendapatkan posisi tinggi dalam Pemerintahan. Jika kami menolak, dia mengklaim bahwa kami akan dianggap sebagai pengkhianat revolusi dan menghadapi kekuatan militer penuh dari Tentara Pembebasan Rakyat."
 tsr_manchukuo.7.a: "Lalu kami akan melakukannya"
 tsr_manchukuo.7.b: "Tidak pernah!"
 tsr_manchukuo.8.t: "[FROM.GetLeader] Menolak Integrasi"
 tsr_manchukuo.8.desc: "Tidak terhibur dengan sikap kami, [FROM.GetLeader] menjawab bahwa tawaran murah hati kami hanyalah upaya untuk menundukkan yang lain, dan bahwa mereka tidak akan mengambil bagian dalam lelucon ini. Oleh karena itu, mereka tidak memberikan pilihan lain kepada kami selain menyerang dan mengambil apa yang menjadi hak kami."
 tsr_manchukuo.8.a: "Ayo!"
 tsr_manchukuo.9.t: "[FROM.GetLeader] Meminta Pemindahan Wilayah"
 tsr_manchukuo.9.desc: "Menyusul kemajuan pesat dalam situasi di Tiongkok, [FROM.GetLeader] dari [FROM.GetNameDef], yang berdiri sebagai perwakilan seluruh Tiongkok, telah mengusulkan agar kami membantu pengalihan wilayah yang pernah mereka miliki dengan imbalan sekutu di wilayah tersebut. Meskipun perkiraan yang lebih konservatif mengenai pengalihan wilayah hanya mencakup Mongolia dan Tuva, keduanya hilang selama revolusi, beberapa bahkan mendorong kembalinya wilayah luar Manchuria karena banyak pejabat di partai tersebut memiliki koneksi pribadi ke wilayah tersebut."
 tsr_manchukuo.9.a: "Mereka tidak akan mempunyai apa-apa"
 tsr_manchukuo.9.b: "Proposal awal terdengar lebih bagus"
 tsr_manchukuo.9.c: "Mongolia adalah milik kita, tapi biarkan mereka memiliki Manchuria"
 tsr_manchukuo.9.d: "Biarkan mereka memiliki semuanya"
 tsr_manchukuo.10.t: "[SOV.GetLeader] Mentransfer Wilayah Kami"
 tsr_manchukuo.10.desc: "Setelah diskusi antara [MAN.GetNameDef] dan [SOV.GetNameDef], yang mana kami tidak diundang, mereka setuju untuk mentransfer wilayah kami ke [MAN.GetNameDef]. Jika kita tidak menerima hal ini, kita akan menghadapi konsekuensi berat dari kedua belah pihak."
 tsr_manchukuo.10.a: "Tidak ada yang bisa kita lakukan"
 tsr_manchukuo.10.b: "Kami akan bertarung sampai mati!"
 MAN_will_support_japan_tt: "§Y$MAN_urzhin_garmaev$§! dan §Y$MAN_jonjurjab$§! akan kembali disukai Jepang dan tidak akan memihak kita jika terjadi perang antara kita dan [JAP.GetFlag] §YJepang.§!"
 tsr_manchukuo.11.t: "Insiden Lingsheng"
 tsr_manchukuo.11.desc: "Menyusul Eksekusi Lingsheng, Gubernur provinsi Xing'an dan politisi Pan-Mongol di tangan Tentara Kwantung, terjadi gelombang kerusuhan di negara tersebut. Tentara Xing'an serta Jenderal Mongol dan Buryat seperti $MAN_urzhin_garmaev$ dan $MAN_jonjurjab$ telah mengancam akan mengundurkan diri jika hal ini tidak ditangani, namun pada saat yang sama, tindakan peredaan mungkin berisiko membuat Jepang marah."
 tsr_manchukuo.11.a: "Kami akan melangkah dengan hati-hati"
 tsr_manchukuo.11.b: "Biarkan mereka mengundurkan diri jika mereka mau"
 tsr_manchukuo.11.c: "Minta Tentara Kwantung meminta maaf"
 tsr_manchukuo.12.t: "Infiltrasi IMPRP"
 tsr_manchukuo.12.desc: "Ada laporan bahwa Partai Revolusioner Rakyat Mongolia Dalam yang dipimpin oleh Serengdongrub, bersama dengan bandit Manchuria, menyusup ke beberapa lokasi penting di utara dan sekarang menunggu waktu untuk menyerang. Kami belum tahu kapan hal ini akan terjadi tetapi kami khawatir hal ini akan segera terjadi."
 tsr_manchukuo.12.a: "Bandit-bandit sialan itu!"
 tsr_manchukuo.12.b: "Kita hanya perlu melihat situasi yang terjadi."
 tsr_manchukuo.13.t: "[MAN.GetLeader] Meminta Transfer $JAP_naoki_hoshino$"
 tsr_manchukuo.13.desc: "Dengan pesatnya kemajuan industri yang dialami Manchuria, [MAN.GetLeader] telah mengincar $JAP_naoki_hoshino$ sebagai calon anggota kabinet selama beberapa waktu. Oleh karena itu, dia sekarang meminta agar dia dipindahkan ke [MAN.GetNameDef] untuk menjabat sebagai Direktur Dewan Urusan Umum."
 tsr_manchukuo.13.a: "Dia akan melayani mereka dengan baik"
 tsr_manchukuo.13.b: "Kami membutuhkannya di sini"
 tsr_manchukuo.14.t: "$JAP_naoki_hoshino$ Tiba di Manchuria"
 tsr_manchukuo.14.desc: "Setelah beberapa kali berdiskusi dengan pihak Jepang, pemindahan $JAP_naoki_hoshino$ ke kabinet kami akhirnya disepakati. Dia akan membantu kita dengan baik dalam membantu perekonomian kita tumbuh sebagai direktur Dewan Urusan Umum."
 tsr_manchukuo.14.a: "Luar biasa"
 tsr_manchukuo.15.t: "$JAP_naoki_hoshino$ Tetap di Jepang"
 tsr_manchukuo.15.desc: "Karena tidak terbujuk oleh argumen kami, pihak Jepang memutuskan bahwa lebih baik $JAP_naoki_hoshino$ tinggal di Jepang daripada menduduki posisi kabinet di Manchuria. Meskipun hal ini mengecewakan, kami akan tetap mencari jalan ke depan."
 tsr_manchukuo.15.a: "Oh baiklah"
 tsr_manchukuo.16.t: "[FROM.GetLeader] Meminta Kontrol Atas Tiongkok"
 tsr_manchukuo.16.desc: "Menyusul proklamasi Pemerintah Kerja Sama Nasional, [FROM.GetLeader] telah meminta agar kami menggabungkan kepemilikan Tiongkok kami bukan di bawah [RNG.GetLeader], namun di bawah pemerintahannya. Meskipun hal ini mungkin tidak berjalan sesuai rencana, namun kemungkinan besar akan lebih efisien jika kita memerintah melalui satu negara boneka dibandingkan beberapa negara boneka dalam hal ini."
 tsr_manchukuo.16.a: "Lalu kita akan menyatukan mereka"
 tsr_manchukuo.16.b: "Kami lebih suka mereka tetap terpisah"
 tsr_manchukuo.17.t: "[FROM.GetLeader] Menyetujui Proposal kami"
 tsr_manchukuo.17.desc: "Setelah berdiskusi dengan [FROM.GetNameDef] telah disepakati bahwa tindakan terbaik adalah menyatukan pemerintahan Tiongkok di bawah kita. Kami menantikan kerja sama lebih lanjut dengan mereka."
 tsr_manchukuo.17.a: "Bagus"
 tsr_manchukuo.18.t: "[FROM.GetLeader] Menolak Proposal kami"
 tsr_manchukuo.18.desc: "Terlepas dari upaya terbaik kami untuk meyakinkan mereka, pemerintah [FROM.GetAdjective] telah memutuskan bahwa menyatukan pemerintahan Tiongkok di bawah kami bukanlah kepentingan terbaik mereka. Untuk saat ini kami akan tetap terpecah."
 tsr_manchukuo.18.a: "Sial"
 tsr_manchukuo.19.t: "Soviet Tidak Memberi Kami Apa Pun"
 tsr_manchukuo.19.desc: "Terlepas dari upaya terbaik kami untuk meyakinkan mereka, Soviet telah memutuskan bahwa kami tidak layak atas wilayah mana pun yang mereka duduki. Ini merupakan pukulan besar bagi hubungan kami."
 tsr_manchukuo.19.a: "Bolshevik sialan..."
 tsr_manchukuo.20.t: "Soviet Memindahkan Mongolia dan Tuva"
 tsr_manchukuo.20.desc: "Memutuskan untuk tidak memindahkan Manchuria Luar, karena menganggapnya terlalu Rusia, Soviet setidaknya setuju untuk memindahkan Mongolia dan Tuva karena klaim kami jauh lebih baru atas wilayah tersebut."
 tsr_manchukuo.20.a: "Tidak apa-apa"
 tsr_manchukuo.21.t: "Soviet Memindahkan Manchuria"
 tsr_manchukuo.21.desc: "Anehnya, Soviet memutuskan untuk menyerahkan Manchuria Luar, dengan mengklaim bahwa kami memiliki hubungan yang jauh lebih pribadi dengan wilayah tersebut sambil mempertahankan Mongolia sebagai negara penyangga."
 tsr_manchukuo.21.a: "Setidaknya itu sesuatu"
 tsr_manchukuo.22.t: "Soviet Menyerah pada Semua Tuntutan Kami"
 tsr_manchukuo.22.desc: "Syukurlah, Uni Soviet cukup bermurah hati menerima semua tuntutan teritorial kami, tidak hanya menambahkan Mongolia dan Tuva tetapi juga Manchuria Luar ke dalam wilayah kami. Hanya hal-hal baik yang dapat dihasilkan dari hal ini."
 tsr_manchukuo.22.a: "Fantastis"
 tsr_manchukuo_news.1.t: "Pemberontakan Besar Manchuria"
 tsr_manchukuo_news.1.desc: "Setelah periode meningkatnya kekerasan dan pertempuran antara pemerintah Jepang dan berbagai faksi bandit, salah satu bandit bernama [MAN.GetLeader] berhasil merebut Hsinking dan kemudian meyakinkan Kaisar untuk bergabung di sisinya.\n\nDengan Kaisar yang memihak para pemberontak, tentara segera mengikuti jejaknya dan kini Manchuria berada di persimpangan jalan, akankah Jepang diusir atau akankah pemberontakan ditumpas secepat mungkin?"
 tsr_manchukuo_news.1.a: "Anak anjing itu mengaum?"
 tsr_manchukuo_news.1.b: "Kami akan mengklaim takdir kami!"
 tsr_manchukuo_news.1.c: "Bagaimana hal ini bisa terjadi?"
 tsr_manchukuo_news.1.d: "Sangat Tidak Terduga"
 tsr_manchukuo_border_war.1.t: "[MAN.GetNameDefCap] Menaklukkan [1039.GetName]"
 tsr_manchukuo_border_war.1.desc: "Setelah kampanye cepat di [1039.GetName], tentara [MAN.GetAdjective] telah merebut Kalgan dan mendeklarasikan wilayah tersebut di bawah kendali mereka."
 tsr_manchukuo_border_war.1.a: "Kekuatan Kami Tumbuh!"
 tsr_manchukuo_border_war.1.b: "Oh baiklah"
 tsr_manchukuo_border_war.2.t: "[MAN.GetNameDefCap] menarik diri dari [1039.GetName]"
 tsr_manchukuo_border_war.2.desc: "Menghadapi kesulitan yang parah, tentara [MAN.GetAdjective] telah mundur dari kota Kalgan, ini mungkin bukan akhir dari konflik namun untuk saat ini Kalgan akan tetap [CHI.GetAdjective]."
 tsr_manchukuo_border_war.2.a: "Kemunduran Sementara..."
 tsr_manchukuo_border_war.2.b: "Kalgan berdiri!"
 tsr_manchukuo_border_war.3.t: "[MAN.GetNameDefCap] Menaklukkan [608.GetName]"
 tsr_manchukuo_border_war.3.desc: "Setelah pasukan [MAN.GetAdjective] memasuki Beijing, pasukan [CHI.GetAdjective] telah mundur ke selatan untuk mengambil posisi yang lebih dapat dipertahankan."
 tsr_manchukuo_border_war.3.a: "Beijing akhirnya menjadi milik kita!"
 tsr_manchukuo_border_war.3.b: "Mereka tidak memberi kita pilihan, mundur!"
 tsr_manchukuo_border_war.4.t: "[MAN.GetNameDefCap] menarik diri dari [608.GetName]"
 tsr_manchukuo_border_war.4.desc: "Gagal merebut kota tersebut, tentara [MAN.GetAdjective] telah mundur dari Beijing, namun berapa lama perdamaian sementara ini akan berlangsung masih belum pasti."
 tsr_manchukuo_border_war.4.a: "Kami telah gagal."
 tsr_manchukuo_border_war.4.b: "Beijing tidak akan jatuh begitu saja!"
 tsr_manchukuo_border_war.5.t: "[MAN.GetNameDefCap] Menaklukkan [614.GetName]"
 tsr_manchukuo_border_war.5.desc: "Setelah Hebei direbut sepenuhnya, gencatan senjata telah dicapai dengan kesepakatan bahwa tentara [MAN.GetAdjective] tidak akan bergerak lebih jauh ke wilayah Tiongkok kecuali jika diprovokasi."
 tsr_manchukuo_border_war.5.a: "Selangkah lebih dekat menuju kemenangan!"
 tsr_manchukuo_border_war.5.b: "Ada provinsi lain..."
 tsr_manchukuo_border_war.6.t: "[MAN.GetNameDefCap] menarik diri dari [614.GetName]"
 tsr_manchukuo_border_war.6.desc: "Meskipun Beijing telah jatuh ke tangan tentara [MAN.GetAdjective], pasukan mereka dihentikan untuk maju lebih jauh ke Provinsi Hebei."
 tsr_manchukuo_border_war.6.a: "Oh baiklah."
 tsr_manchukuo_border_war.6.b: "Hebei masih berdiri!"
