l_braz_por:
 HUN_balanced_budget: "Anggaran Berimbang"
 HUN_balanced_budget_desc: "Kita harus melakukan yang terbaik dengan sumber daya yang kita miliki. Anggaran yang terencana dan seimbang adalah kunci keberhasilan pemerintah kita."
 HUN_strengthen_the_monarchists: "Perkuat kaum Monarki"
 HUN_strengthen_the_monarchists_desc: "Langkah pertama untuk mengembalikan Hongaria ke prestise sebelumnya adalah memperkuat partai-partai yang menuntut kembalinya monarki."
 HUN_elect_a_king: "Pilihlah seorang Raja"
 HUN_elect_a_king_desc: "Dukungan masyarakat terhadap kembalinya negara ke bentuk pemerintahan monarki sudah cukup sehingga kita bisa mulai memikirkan untuk memulai proses pemilihan raja baru."
 HUN_invite_the_habsburg_prince: "Undang Pangeran Habsburg"
 HUN_invite_the_habsburg_prince_desc: "Habsburg telah lama memerintah Hongaria, dan di bawah pemerintahan mereka, negara ini merupakan bagian dari salah satu kerajaan terbesar di Eropa. Mengembalikan Habsburg ke pucuk pimpinan pasti akan membawa Hongaria menuju kejayaan sekali lagi."
 HUN_demand_a_referendum: "Menuntut Referendum"
 HUN_demand_a_referendum_desc: "Pembubaran Austria-Hongaria adalah sebuah kesalahan. Austria dan Hongaria sama-sama lebih kuat, dan kombinasi keduanya diperlukan agar keduanya bisa mencapai kejayaan. Austria harus dipaksa untuk mengadakan referendum mengenai proposal penggabungan kedua negara secara damai."
 HUN_take_austria_by_force: "Ambil Austria Dengan Paksa"
 HUN_take_austria_by_force_desc: "Langkah pertama untuk mengembalikan kejayaan Hongaria adalah dengan mengintegrasikan kembali tanah Austria. Kita tidak bisa mengambil risiko kegagalan dalam mencapai hal ini secara diplomatis, jadi kita harus melakukannya melalui kekerasan."
 HUN_proclaim_the_restoration_of_austria_hungary: "Pemulihan Austria-Hongaria"
 HUN_proclaim_the_restoration_of_austria_hungary_desc: "Dengan bersatunya kembali kedua negara kita dan Habsburg di atas takhta, kita sekarang dapat dengan sungguh-sungguh memproklamirkan pemulihan Austria-Hongaria, dan berusaha merebut kembali provinsi-provinsi bersejarah kita yang sah!"
 HUN_protect_czechoslovakia: "Lindungi Cekoslowakia"
 HUN_protect_czechoslovakia_desc: "Cekoslowakia, sejak kemerdekaannya, tumbuh kuat dan rajin, namun tanah mereka diincar dengan rakus oleh tetangga mereka. Kami akan menawarkan kepada mereka perlindungan kami terhadap ancaman-ancaman ini, baik dengan menyambut mereka sekali lagi sebagai bagian integral dari Kerajaan kami, atau dengan memberikan mereka status asosiasi."
 HUN_claim_transylvania: "Klaim Transylvania"
 HUN_claim_transylvania_desc: "Wilayah Siebenbürgen diambil secara tidak adil dari kami setelah perang yang lalu. Sudah waktunya untuk merebutnya kembali."
 HUN_march_to_the_shore: "Berbaris ke Pantai"
 HUN_march_to_the_shore_desc: "Kekuatan Besar yang sejati memerlukan akses ke lautan. Pesisir Laut Adriatik adalah hak asasi kami."
 HUN_reclaim_venetia: "Rebut kembali Venetia"
 HUN_reclaim_venetia_desc: "Pengkhianatan orang Italia dalam Perang Besar masih belum bisa dilupakan. Ini adalah waktu untuk menempatkan mereka pada tempatnya, dan mengembalikan Kekaisaran ke perbatasan alaminya."
 HUN_claim_galicia: "Klaim Galicia"
 HUN_claim_galicia_desc: "Negara Polandia hanyalah sebuah konstruksi buatan. Itu dapat dibuat dan dibongkar sesuai kebutuhan."
 HUN_claim_the_bucovina: "Klaim Bucovina"
 HUN_claim_the_bucovina_desc: "Ini mungkin bukan yang paling penting secara ekonomi dari kepemilikan kita yang tersebar luas, namun tetap menjadi bagian dari Kerajaan kita. Dan kami akan merebutnya kembali."
 HUN_reclaim_the_empire: "Rebut kembali Kekaisaran"
 HUN_reclaim_the_empire_desc: "Untuk menyelesaikan tuntutan teritorial de jure kita, kita harus mengklaim berbagai gelar di Jerman, Italia dan Palestina yang dimiliki raja Habsburg atas namanya."
 HUN_elect_a_democratic_king: "Pilih Raja Demokrat"
 HUN_elect_a_democratic_king_desc: "Kita harus mencari seorang Raja yang akan menjunjung tinggi prinsip-prinsip demokrasi bangsa kita dan hak-hak rakyat kita."
 HUN_responsible_government: "Pemerintah yang bertanggung jawab"
 HUN_responsible_government_desc: "Secara tradisional, pemerintah pada akhirnya bertanggung jawab kepada raja, sehingga membiarkan raja mengabaikan keinginan rakyat. Kami akan mengubah konstitusi untuk memastikan bahwa rakyatlah, dan bukan penguasa, yang meminta pertanggungjawaban pemerintah."
 HUN_rapproachement_with_little_entente: "Pemulihan Hubungan Dengan Entente Kecil"
 HUN_rapproachement_with_little_entente_desc: "Ideologi yang bermusuhan mengelilingi kita, dan kita harus menegaskan kembali hubungan kita dengan tetangga-tetangga Entente Kecil kita. Kami akan bertanya kepada mereka apakah mereka ingin melihat kami mempersenjatai kembali."
 HUN_join_allies: "Bergabunglah dengan Sekutu"
 HUN_join_allies_desc: "Masa depan Hongaria dan nilai-nilai demokrasinya bergantung pada negara-negara demokrasi besar di Barat dan aliansinya. Sebagai anggota aliansi ini, kita dapat memberikan kekuatan kita kepada mereka, dan juga mengandalkan dukungan mereka."
 HUN_the_balkan_pact: "Pakta Balkan"
 HUN_the_balkan_pact_desc: "Negara-negara demokrasi di Barat terlalu jauh untuk membantu kita, sehingga kita harus mencari sekutu yang lebih dekat dengan negara kita. Sebagai pemimpin Pakta Balkan, kami akan menawarkan perlindungan kami dan memimpin mereka menuju kemenangan!"
 HUN_an_unlikely_alliance: "Aliansi yang Tidak Mungkin"
 HUN_an_unlikely_alliance_desc: "Kami telah mengubah negara kami secara mendasar. Kita bukan lagi penggiat perang di masa lalu. Waktunya telah tiba untuk menjangkau musuh lama kita dan membentuk takdir baru – bersama-sama."
 HUN_joint_oil_exploitation_company: "Perusahaan Eksploitasi Minyak Gabungan"
 HUN_joint_oil_exploitation_company_desc: "Dengan adanya prospek ladang minyak di wilayah kami, kami telah menarik perhatian asing. Negara-negara sahabat sangat ingin mendukung industri minyak kita dengan pengetahuan teknis mereka, dan ini akan menjadi peluang yang menguntungkan untuk belajar dari kemajuan mereka."
 HUN_elect_a_fascist_king: "Pilihlah Raja Fasis"
 HUN_elect_a_fascist_king_desc: "Bangsa kita membutuhkan pemimpin yang kuat untuk mengarahkannya melewati tahun-tahun penuh gejolak yang akan datang. Penguasa kita harus menjadi pemimpin yang dapat disegani oleh rakyatnya, dan dapat ditakuti oleh musuh-musuh kita."
 HUN_economic_intervention: "Intervensi Ekonomi"
 HUN_economic_intervention_desc: "Kita harus mengarahkan sumber daya politik yang besar untuk mengarahkan perekonomian kita. Meski memadai, kita masih bisa membuatnya lebih kuat dan efisien."
 HUN_strengthen_fascists: "Memperkuat Fasis"
 HUN_strengthen_fascists_desc: "Elemen fasis di negara kita harus diperkuat dan diberi wadah publik untuk menyebarkan ideologinya. Pandangan mereka tentang masa depan Hongaria kemungkinan besar akan membawa negara ini menuju kejayaan lagi."
 HUN_renounce_the_treaty_of_trianon: "Menolak Perjanjian Trianon"
 HUN_renounce_the_treaty_of_trianon_tt: "§YMiklós Horthy§! atau §YFriedrich Franz dari Mecklenburg-Schwerin§! menjadi pemimpin negara."
 HUN_renounce_the_treaty_of_trianon_desc: "Ketidakadilan yang menimpa negara kita pada akhir Perang Besar, yang merenggut dua pertiga wilayah dan populasi negara kita yang pernah menjadi negara besar, menyaingi aib yang menimpa Jerman dalam Perjanjian Versailles, dan hal ini harus dihilangkan."
 HUN_renew_the_rome_protocols: "Memperbarui Protokol Roma"
 HUN_renew_the_rome_protocols_desc: "Mengingat revisionisme Jerman yang terus berlanjut, kita harus memperbarui Protokol Roma yang dibuat dan ditandatangani pada tahun 1934. Perjanjian tersebut tidak hanya akan berfungsi untuk semakin mengisolasi ancaman Jerman dan Yugoslavia, namun juga sebagai pendahulu bagi aliansi yang sebenarnya."
 HUN_protect_austria: "Lindungi Austria"
 HUN_protect_austria_desc: "Untuk lebih menentang Jerman, kita harus menolak ambisi terbuka mereka untuk bersatu dengan Austria. Kami dapat memberi mereka jaminan, sehingga pemerintah saat ini memiliki kekuatan politik yang mereka perlukan untuk melawan unsur-unsur pro-Jerman."
 HUN_alliance_with_italy: "Aliansi Dengan Italia"
 HUN_alliance_with_italy_desc: "Tawaran awal menuju aliansi yang dibuat dalam Protokol Roma kini dapat diperluas. Kami akan mengirimkan delegasi ke Italia untuk membahas perjanjian yang mengikat untuk kerja sama militer yang luas, baik secara defensif maupun ofensif."
 HUN_trade_deal_with_germany: "Kesepakatan Dagang Dengan Jerman"
 HUN_trade_deal_with_germany_desc: "Manfaat peningkatan hubungan dagang dengan Jerman bagi industri kita sangatlah jelas, dan klaim mengenai potensi ketergantungan ekonomi kita yang berlebihan pada Jerman adalah hal yang dilebih-lebihkan. Kami akan melanjutkan dan menandatangani perjanjian perdagangan yang luas."
 HUN_joint_aluminum_mining_company: "Perusahaan Tambang Aluminium Bersama"
 HUN_joint_aluminum_mining_company_desc: "Karena aluminium merupakan bagian integral dari industri perang modern, kami dapat dengan mudah memperoleh dukungan Jerman untuk memperluas tambang di bagian utara negara kami."
 HUN_join_axis: "Bergabunglah dengan Poros"
 HUN_join_axis_desc: "Karena perekonomian kita sudah sangat bergantung pada Jerman, maka masuk akal jika kita mengikuti jejak mereka dalam perang. Kami akan mengirimkan mereka permintaan untuk masuk secara resmi ke dalam aliansi Poros."
 HUN_reaffirm_territorial_claims: "Menegaskan Kembali Klaim Teritorial"
 HUN_reaffirm_territorial_claims_desc: "Dengan penolakan Perjanjian Trianon, kita sekarang harus melanjutkan untuk menegaskan kembali klaim kita atas wilayah yang dicuri dari kita."
 HUN_demand_transylvania: "Permintaan Transilvania"
 HUN_demand_transylvania_desc: "Jika kita bisa mendapatkan kembali wilayah kita tanpa pertumpahan darah, itu lebih baik. Rumania akan diberi ultimatum yang menuntut pengalihan tanah hak kami."
 HUN_demand_southern_slovakia: "Permintaan Slovakia Selatan"
 HUN_demand_southern_slovakia_desc: "Jika kita bisa mendapatkan kembali wilayah kita tanpa pertumpahan darah, itu lebih baik. Cekoslowakia akan diberi ultimatum yang menuntut pengalihan tanah hak kami."
 HUN_demand_the_vojvodina: "Minta Vojvodina"
 HUN_demand_the_vojvodina_desc: "Jika kita bisa mendapatkan kembali wilayah kita tanpa pertumpahan darah, itu lebih baik. Yugoslavia akan diberi ultimatum yang menuntut pengalihan tanah hak kami."
 HUN_claim_overlordship_over_slovakia: "Klaim Kekuasaan Atas Slovakia"
 HUN_claim_overlordship_over_slovakia_desc: "Sisa wilayah Slovakia juga harus diintegrasikan kembali ke dalam negara Hongaria, baik secara langsung atau dengan menjadi negara ketergantungan. Kami akan mengirimkan ultimatum lagi."
 HUN_proclaim_greater_hungary: "Proklamasikan Hongaria Raya"
 HUN_proclaim_greater_hungary_desc: "Setelah mendapatkan kembali wilayah yang menjadi hak kami, ukuran negara kami telah meningkat hingga mencapai batas sejarah kami. Kini kita dapat dengan penuh percaya diri memproklamirkan pembentukan Hongaria Raya kepada dunia, dan mengarahkan pandangan kita pada target-target baru."
 HUN_GREATER_tt: "Ubah nama Anda menjadi §YHongaria Raya§!"
 HUN_demands_tt: "Saat menuntut wilayah, pihak lain kemungkinan besar akan menyerahkannya tanpa pertumpahan darah jika Anda memiliki pasukan yang kuat. Namun, mereka mungkin masih percaya bahwa mereka bisa melawan kita jika mereka berada dalam faksi.\n"
 HUN_assassinate_horthy: "Bunuh Horthy"
 HUN_assassinate_horthy_desc: "Laksamana Perang Besar yang lama ini memegang terlalu banyak kekuasaan dan pengaruh dalam kapasitasnya saat ini sebagai Bupati Kerajaan Hongaria, dan sikapnya yang menentang komunisme terbukti menjadi masalah besar bagi upaya kawan-kawan kita. Dia harus disingkirkan dari kekuasaan jika bangsa kita ingin menemukan jalan menuju Revolusi."
 HUN_council_of_peoples_commissars: "Dewan Komisaris Rakyat"
 HUN_council_of_peoples_commissars_desc: "Sebuah badan pemerintahan harus dibentuk yang dapat mengawasi transisi Hongaria menjadi negara komunis. Setelah hal ini terlaksana, Dewan ini akan berfungsi sebagai analogi sistem kabinet Barat yang dibentuk oleh para menteri."
 HUN_the_hungarian_red_army: "Tentara Merah Hongaria"
 HUN_the_hungarian_red_army_desc: "Semua patriot pecinta tanah air wajib melaksanakan tugasnya membela tanah air. Kami akan membentuk Tentara Merah Hongaria, mengikuti contoh Soviet di Timur, yang akan melindungi Revolusi kami yang masih baru."
 HUN_soviet_hungarian_military_academy: "Akademi Militer Soviet-Hongaria"
 HUN_soviet_hungarian_military_academy_desc: "Tentara kita tidak ada artinya tanpa kepemimpinannya. Soviet memiliki lebih banyak pengalaman dalam urusan militer, sehingga mungkin ada manfaatnya jika kita bekerja sama dengan mereka dalam melatih para ahli militer terbaik kita. Untuk mencapai tujuan ini, kami akan mendirikan akademi militer dengan instruktur paling terampil dari kedua negara."
 HUN_join_comintern: "Bergabunglah dengan Komintern"
 HUN_join_comintern_desc: "Jalan ke depan bagi Revolusi ada di tangan Komintern. Dengan berdiri bersama kawan-kawan kita, kita akan menyingkirkan ketidakadilan kapitalis dan ancaman fasis yang membayangi di Barat."
 HUN_the_revolutionary_council: "Dewan Revolusi"
 HUN_the_revolutionary_council_desc: "Komintern telah meninggalkan perjuangan melawan imperialisme dan memilih hidup berdampingan. Jika pekerja di seluruh dunia ingin bebas, kita harus meneruskan semangat Marx dan Lenin – bahkan melawan Uni Soviet, jika perlu."
 HUN_FACTION_COMMIE: "Persatuan Soviet Komunis"
 HUN_pressure_romania: "Tekanan Rumania"
 HUN_pressure_romania_desc: "Saat kita fokus pada bahaya Fasis di Barat, kita tidak bisa membiarkan potensi ancaman terus ada di belakang kita, terutama jika ancaman tersebut berada di antara kita dan sekutu kita di Timur. Rumania harus diamankan sebagai negara sesama komunis, atau jalur darat penting bagi sekutu kita harus diserahkan untuk memastikan kita dapat menerima dukungan mereka."
 HUN_intervene_in_czechoslovakia: "Intervensi Di Cekoslowakia"
 HUN_intervene_in_czechoslovakia_desc: "Cekoslowakia telah dianugerahi beberapa wilayah yang diambil dari kami berdasarkan Perjanjian Trianon. Pada saat yang sama, kita mengetahui rancangan Jerman di tanah mereka. Mungkin kami bisa mengatur perdagangan; tanah kami yang sah dengan imbalan jaminan dukungan militer Soviet jika terjadi agresi Jerman."
 HUN_industrial_revitalization: "Revitalisasi Industri"
 HUN_industrial_revitalization_desc: "Basis industri kita telah mengalami pembusukan yang berbahaya dalam beberapa tahun terakhir. Kita harus melakukan upaya untuk mengadopsi teknologi baru untuk menggantikan kemajuan yang hilang."
 HUN_support_urbanization: "Mendukung Urbanisasi"
 HUN_support_urbanization_desc: "Semakin banyak orang meninggalkan desa dan kota kecil untuk pindah ke pusat kota besar, mencari pekerjaan di pabrik baru. Sekalipun kita tidak bisa langsung menawarkan lapangan pekerjaan kepada mereka, kita bisa membangun kawasan kota baru untuk mempersiapkan jalan bagi perluasan di kemudian hari."
 HUN_institute_for_industrial_techniques: "Institut Teknik Industri"
 HUN_institute_for_industrial_techniques_desc: "Sifat penelitian industri yang bersifat ad-hoc telah menyebabkan pertumbuhan yang lebih lambat dan produktivitas yang lebih rendah. Kita harus mendirikan lembaga baru yang menggabungkan semua penelitian ke dalam metode industri baru."
 HUN_announce_the_gyor_program: "Umumkan Program Györi"
 HUN_announce_the_gyor_program_desc: "Militer kita sangat lemah, dan kita harus meningkatkan ukuran dan kemampuan tempurnya. Untuk melakukan hal ini kita harus memperkuat industri kita secara signifikan, untuk mengimbangi permintaan peralatan yang terus meningkat. Program Györ yang berdurasi lima tahun akan meningkatkan belanja pemerintah tidak hanya pada sektor militer itu sendiri, namun juga pada sektor-sektor tambahan seperti industri, pertanian, infrastruktur, dan pendidikan."
 HUN_civilian_industry: "Industri Sipil"
 HUN_civilian_industry_desc: "Meskipun kita memerlukan lebih banyak industri militer, kita tidak boleh mengabaikan kebutuhan sipil kita. Oleh karena itu, perluasan industri sipil perlu dilakukan."
 HUN_reintegrate_the_railroads: "Integrasikan kembali Rel Kereta Api"
 HUN_reintegrate_the_railroads_desc: "Jaringan kereta api yang mencakup kekaisaran lama Austria-Hongaria telah menjadi terfragmentasi sejak pembubarannya di negara-negara merdeka. Kita harus mendekati negara-negara bekas konstituen lainnya dan mengusulkan reintegrasi jaringan kereta api kita, untuk meningkatkan infrastruktur secara keseluruhan."
 HUN_invite_foreign_investors: "Undang Investor Asing"
 HUN_invite_foreign_investors_desc: "Hongaria terletak di jantung Eropa Timur, dan kami dapat memanfaatkan lokasi sentral kami untuk menarik investor asing yang berkepentingan untuk meningkatkan infrastruktur dan industri kami."
 HUN_expand_the_manfred_weiss_steel_works: "Perluas Pabrik Baja Manfred Weiss"
 HUN_expand_the_manfred_weiss_steel_works_desc: "Manfed Weiss Steel Works yang berukuran besar telah menjadi kontraktor pertahanan integral sejak Perang Besar menyaksikan perluasan fasilitas secara besar-besaran. Jika kita ingin meningkatkan kekuatan militer untuk mempersiapkan perang berikutnya, maka kebanggaan industri nasional kita harus ditingkatkan lagi."
 HUN_expand_the_aluminum_industry: "Memperluas Industri Aluminium"
 HUN_expand_the_aluminum_industry_desc: "Kita membutuhkan semua sumber daya yang tersedia, baik untuk ekspor maupun untuk penggunaan dalam negeri. Industri aluminium kita, meskipun sudah berkembang pesat, masih memiliki ruang untuk perbaikan, dan kita harus segera mengarahkan sumber daya untuk mencapai tujuan ini."
 HUN_expand_the_technical_university_of_budapest: "Perluas Universitas Teknik Budapest"
 HUN_expand_the_technical_university_of_budapest_desc: "Kita membutuhkan pemikiran yang lebih cerdas untuk menghasilkan penemuan-penemuan terobosan yang akan membantu kita dalam menghadapi konflik-konflik di masa depan. Dengan memperluas universitas di ibu kota kita, kita dapat meningkatkan jumlah insinyur dan ilmuwan terampil untuk industri militer kita."
 HUN_support_domestic_industry: "Mendukung Industri Dalam Negeri"
 HUN_support_domestic_industry_desc: "Militer membutuhkan lebih banyak peralatan, dan industri kita harus mengimbanginya. Kami akan mengarahkan sumber daya baru untuk perluasan industri senjata kami."
 HUN_domestic_arms_industry: "Industri Senjata Dalam Negeri"
 HUN_domestic_arms_industry_desc: "Industri persenjataan kita harus didukung oleh basis industri sipil yang kuat, tidak hanya untuk produksi peralatan industri tetapi juga untuk pendirian pabrik-pabrik baru."
 HUN_autarky: "Autarki"
 HUN_autarky_desc: "Kita terlalu bergantung pada sumber minyak asing. Kita harus meniru upaya Jerman dalam mengembangkan minyak sintetis."
 HUN_synthetic_industry: "Industri Sintetis"
 HUN_synthetic_industry_desc: "Kini setelah kita menguasai teknologi pencairan batubara, kita dapat membangun pabrik percontohan untuk memulai produksi."
 HUN_synthetic_oil_tt: "Menambahkan kilang sintetis ke keadaan acak. Lokasi akan ditampilkan setelah penelitian membuktikan produksi minyak sintetis layak dilakukan."
 HUN_aeronautic_technology_institute: "Institut Teknologi Penerbangan"
 HUN_aeronautic_technology_institute_desc: "Udara telah menjadi aspek baru dalam peperangan, dan terbukti dianggap remeh oleh banyak orang. Kita harus belajar menguasai dimensi baru ini, dan mengalokasikan sumber daya untuk pengembangan doktrin dan peralatan baru yang memungkinkan kita melakukan hal tersebut."
 HUN_boost_hungarian_aviation_industry: "Meningkatkan Industri Penerbangan Hongaria"
 HUN_boost_hungarian_aviation_industry_desc: "Basis industri kita harus diperkuat untuk memungkinkan produksi model pesawat baru dalam jumlah yang cukup untuk menguasai udara."
 HUN_secret_rearmament: "Persenjataan Kembali Rahasia"
 HUN_secret_rearmament_desc: "Pembatasan yang diberlakukan kepada kami oleh Perjanjian Trianon melarang kami menambah jumlah pasukan. Meski begitu, iklim politik dunia semakin bergejolak dan konflik akan segera terjadi. Kita tidak bisa tetap tidak berdaya, dan kita harus mulai mempersenjatai kembali bahkan jika itu berarti secara diam-diam melanggar ketentuan perjanjian damai yang diberlakukan pada kita setelah Perang Besar."
 HUN_secret_rearmament_tt: "§GMembuka hukum §YMobilisasi Parsial§!.§!"
 HUN_secret_rearmament_tt_2: "§RRoh akan dihilangkan ketika meningkatkan wajib militer melebihi §YHanya Sukarelawan§!.§!"
 HUN_war_games: "Permainan Perang"
 HUN_war_games_desc: "Dengan terlibat dalam latihan perang skala kecil, kita dapat menemukan kelemahan dalam struktur militer kita saat ini, dan menggunakan pengalaman yang diperoleh untuk memperbaiki kekurangan tersebut."
 HUN_theoretical_air_efforts: "Upaya Udara Teoretis"
 HUN_theoretical_air_efforts_desc: "Kita harus menghabiskan banyak sumber daya untuk mengembangkan teori-teori baru mengenai perang udara. Jika kita berperang maka teori-teori yang dapat dikembangkan akan sangat berharga."
 HUN_bled_agreement: "Perjanjian Berdarah"
 HUN_bled_agreement_desc: "Persenjataan kembali secara rahasia dalam skala kecil tidak akan cukup. Kita harus menjangkau negara-negara tetangga kita dan meminta ganti rugi atas perjanjian yang diberlakukan pada kita setelah Perang Besar. Hongaria memiliki hak yang sama atas persenjataan."
 HUN_bled_agreement_custom_effect_tooltip: "Dapat menyebabkan penggantian §HPerjanjian Trianon§!."
 HUN_establish_the_air_force: "Membentuk Angkatan Udara"
 HUN_establish_the_air_force_desc: "Dengan tidak adanya pembatasan hukum, sekarang saatnya untuk secara resmi membentuk angkatan udara Hongaria."
 HUN_indigenous_designs: "Desain Pribumi"
 HUN_indigenous_designs_desc: "Keahlian teknis kami sendiri sudah cukup untuk kebutuhan kami. Kontrol atas biro desain kami sendiri memungkinkan kami mengalokasikan lebih banyak sumber daya ke biro tersebut, sehingga meningkatkan kecepatan pengembangan desain baru."
 HUN_heavy_fighter_effort: "Upaya Tempur Berat"
 HUN_heavy_fighter_effort_desc: "Pesawat tempur kita harus mampu mendukung pesawat pembom yang lebih rentan. Hal ini memerlukan persenjataan yang lebih berat dan jangkauan yang lebih jauh dengan mengorbankan kecepatan dan kemampuan manuver."
 HUN_light_fighter_effort: "Upaya Tempur Ringan"
 HUN_light_fighter_effort_desc: "Kita membutuhkan pesawat tempur untuk memperoleh superioritas udara lokal di langit di atas pasukan kita, dan untuk mencegat pesawat musuh yang mengancam negara kita."
 HUN_cas_focus: "Fokus CAS"
 HUN_cas_focus_desc: "Tentara modern membutuhkan dukungan kendaraan tidak hanya di darat, tetapi juga di udara."
 HUN_tac_focus: "Fokus Pembom Taktis"
 HUN_tac_focus_desc: "Kemenangan akan dicapai dengan memusnahkan pasukan darat musuh. Kita harus fokus untuk mendukung pasukan kita sendiri dengan serangan taktis terhadap sasaran yang dekat dan dalam."
 HUN_license_foreign_designs: "Lisensi Desain Asing"
 HUN_license_foreign_designs_desc: "Angkatan udara asing telah menunjukkan bahwa mereka memiliki desain berkualitas tinggi yang telah teruji dan terbukti. Daripada mencobai nasib dan mengandalkan keahlian penerbangan yang baru kita miliki, kita harus meminta izin untuk memproduksi model asing ini di bawah lisensi."
 HUN_fighter_competition: "Kompetisi Petarung"
 HUN_fighter_competition_desc: "Agar kita dapat memilih model pesawat tempur terbaik untuk diproduksi di bawah lisensi, kita harus mengadu pesaing satu sama lain. Kami akan menyelenggarakan kompetisi pesawat tempur dan mengundang semua negara besar untuk mengirimkan model pesawat tempur paling modern mereka untuk berpartisipasi."
 HUN_bomber_competition: "Kompetisi Pengebom"
 HUN_bomber_competition_desc: "Agar kita dapat memilih model pesawat pembom terbaik untuk diproduksi di bawah lisensi, kita harus mengadu pesaing satu sama lain. Kami akan menyelenggarakan kompetisi pembom dan mengundang semua negara besar untuk mengirimkan model pembom paling modern mereka untuk berpartisipasi."
 HUN_joint_air_development: "Pengembangan Udara Bersama"
 HUN_joint_air_development_desc: "Cara terbaik untuk mengembangkan model pesawat baru adalah melalui kerja sama dengan sekutu kita. Dengan menyatukan para pemikir paling cemerlang dari seluruh bangsa kita, kita akan mencapai hasil terbaik."
 HUN_army_maneuvers: "Manuver Tentara"
 HUN_army_maneuvers_desc: "Tentara kita harus kembali bugar untuk menghadapi potensi konflik bersenjata di masa depan. Kami akan mengirim mereka melakukan manuver untuk mengembangkan taktik dan strategi baru."
 HUN_mobile_focus: "Fokus Seluler"
 HUN_mobile_focus_desc: "Tentara yang bergerak, dengan kemampuan menyerang kapan dan di mana saja yang menimbulkan kerusakan paling besar, adalah kunci keberhasilan militer."
 HUN_the_botond: "Botond"
 HUN_the_botond_desc: "Untuk memenuhi kebutuhan pasokan dan transportasi secara memadai, kami memerlukan truk berbentuk baru. Versi awal desain Rába 38M Botond telah terbukti berhasil dalam uji coba, dan dengan sumber daya yang sesuai kami dapat menyelesaikan desain dan memulai produksi."
 HUN_develop_tanks: "Kembangkan Tank"
 HUN_develop_tanks_desc: "Negara-negara di sekitar kita telah menyadari pentingnya tank ini, dan memproduksinya dalam jumlah besar. Kita harus mengembangkan desain tank kita sendiri dan berusaha mengimbangi sekutu dan musuh kita."
 HUN_assault_gun_focus: "Fokus Senapan Serbu"
 HUN_assault_gun_focus_desc: "Daripada fokus pada tank yang lengkap, kami akan mengandalkan senjata serbu untuk membantu infanteri kami dalam melakukan terobosan, sebagai alternatif yang lebih hemat biaya."
 HUN_joint_tank_procurement: "Pengadaan Tangki Bersama"
 HUN_joint_tank_procurement_desc: "Bersama sekutu kami, kami dapat mengembangkan model tank baru dengan lebih efektif. Kami akan membentuk biro pengadaan bersama di mana para teknisi kami dapat bekerja sama untuk mengidentifikasi desain terbaik untuk dikembangkan."
 HUN_armored_warfare: "Peperangan Lapis Baja"
 HUN_armored_warfare_desc: "Divisi bermotor kita akan memerlukan dukungan lapis baja agar benar-benar efektif. Kita harus mencurahkan lebih banyak sumber daya untuk pengembangan desain baju besi baru."
 HUN_mobile_corps_doctrine: "Doktrin Korps Bergerak"
 HUN_mobile_corps_doctrine_desc: "Dengan elemen bermotor dan lapis baja yang kini diproduksi, kita harus melihat pendekatan teoretis baru tentang bagaimana keduanya dapat bekerja sama di medan perang."
 HUN_home_defense: "Pertahanan Rumah"
 HUN_home_defense_desc: "Pasukan kecil yang bergerak tidak akan mampu membela negara kita jika terjadi serangan. Kita harus membentuk garis depan yang tidak dapat ditembus, dan mengembangkan doktrin-doktrin baru untuk meningkatkan efektivitas pendekatan tersebut."
 HUN_danuvia_submachine_guns: "Senapan Mesin Ringan Danuvia"
 HUN_danuvia_submachine_guns_desc: "Infanteri kita membutuhkan persenjataan yang baik untuk meningkatkan efektivitasnya. Prototipe awal Danuvia 43M telah menunjukkan kinerja yang baik dalam pengujian, dan dengan meningkatkan pendanaan untuk pengembangannya, kami mungkin dapat segera mulai memproduksi senjata tersebut secara massal."
 HUN_artillery_effort: "Upaya Artileri"
 HUN_artillery_effort_desc: "Artileri adalah kunci untuk meningkatkan efektivitas pasukan kita. Kami akan mengembangkan model artileri modern sehingga mereka mendapatkan dukungan artileri terbaik yang dapat kami berikan."
 HUN_motorized_logistics: "Logistik Bermotor"
 HUN_motorized_logistics_desc: "Kunci dari peperangan bergerak adalah kemampuan untuk memindahkan manusia dan material dalam jarak yang jauh dengan cepat. Bahkan tank terbaik pun akan cepat menjadi tidak berguna jika tidak diisi ulang."
 HUN_light_infantry_divisions_doctrine: "Doktrin Divisi Infanteri Ringan"
 HUN_light_infantry_divisions_doctrine_tech_tt: "Memungkinkan §HDoktrin Divisi Infanteri Ringan§!\n§HInfantri\nHutan§! Serangan: §G+2%§! Pergerakan: §G+5%§!\n§HUrban§! Serangan: §G+5%§! Pergerakan: §G+5%§!"
 HUN_light_infantry_divisions_doctrine_unit_tt: "Dapatkan unit §YInfantri§! dengan 6 batalyon."
 HUN_light_infantry_divisions_doctrine_desc: "Kita harus puas dengan keterbatasan tenaga kerja yang kita miliki. Jika kita menginginkan lebih banyak divisi, maka divisi tersebut harus lebih kecil. Divisi infanteri ringan memberikan perpaduan optimal antara kekuatan dan ukuran serangan, dan kami akan menjadikannya sebagai tulang punggung militer kami."
 HUN_form_parachute_battalions: "Bentuk Batalyon Parasut"
 HUN_form_parachute_battalions_desc: "Infanteri yang mendarat melalui serangan udara akan memberi kita kemampuan untuk bereaksi dengan cepat terhadap ancaman atau peluang taktis yang tidak terduga."
 HUN_naval_warfare: "Perang Laut"
 HUN_naval_warfare_desc: "Setelah mendapatkan kembali garis pantai, kita harus memfokuskan upaya kita pada pembangunan kembali armada yang sesuai untuk negara-negara besar."
 HUN_restauration: "Restorasi"
 HUN_restauration_desc: "Kita tidak bisa membuang waktu untuk bereksperimen dengan teknologi baru dan belum terbukti. Kami akan tetap menggunakan desain yang telah dicoba dan diuji dari zaman Kekaisaran lama."
 HUN_reform: "Pembaruan"
 HUN_reform_desc: "Tidak masuk akal untuk menciptakan angkatan laut yang dibangun berdasarkan ide-ide yang sudah ketinggalan zaman. Kita telah diberi kesempatan untuk menciptakan angkatan laut baru dari awal, tanpa membebani angkatan laut yang lama. Kita harus menggunakannya untuk membangun angkatan laut yang paling modern dan mampu."
 HUN_capital_ships: "Kapal Modal"
 HUN_capital_ships_desc: "Inti dari angkatan laut adalah kapal perang. Kita harus mengganti waktu yang hilang dan memulai pembangunan kapal baru sesegera mungkin."
 HUN_destroyer: "Penghancur"
 HUN_destroyer_desc: "Kapal perusak adalah bagian penting dari armada, namun sering diabaikan. Ditambah dengan biayanya yang rendah, hal ini merupakan awal yang baik untuk setiap program ekspansi angkatan laut."
 HUN_cruisers: "kapal penjelajah"
 HUN_cruisers_desc: "Bahkan kekuatan yang paling kuat pun tidak ada gunanya jika tidak dapat menemukan musuh atau melindungi diri dari pesawat. Merancang kapal penjelajah ringan dan berat baru membantu kami mengubah kumpulan kapal menjadi armada sebenarnya."
 HUN_submarines: "Kapal Selam"
 HUN_submarines_desc: "Kapal selam nyaris mengalahkan angkatan laut paling kuat di dunia dalam perang terakhir. Kita tidak bisa dianggap serius sebagai angkatan laut modern jika kita tidak memiliki kapal selam sendiri."
 HUN_carriers: "Operator"
 HUN_carriers_desc: "Kapal perang itu adalah peninggalan masa lalu. Masa depan peperangan laut terletak pada kapal induk dan pesawat terbangnya. Kami akan menjadi yang terdepan dalam perkembangan ini."
 fighter_tt: "Harus memiliki petarung terkini untuk ditawarkan dan berdamai dengan [Root.GetName]"
 bomber_tt: "Harus memiliki pembom terkini untuk ditawarkan dan berdamai dengan [Root.GetName]"
 ROM_preserve_greater_romania: "Pertahankan Rumania Raya"
 ROM_preserve_greater_romania_desc: "Kami akhirnya berhasil menyatukan semua penutur bahasa Rumania di negara kami. Sekarang, kita harus memastikan bahwa anak-anak kita dapat mewarisi warisan Rumania untuk seluruh rakyat Rumania."
 ROM_a_deal_with_the_devil: "Kesepakatan dengan Iblis"
 ROM_a_deal_with_the_devil_desc: "[SOU.GetNameDefCap] adalah ancaman terhadap perbatasan timur kita, dan tuntutan teritorial mungkin akan segera terjadi. Mungkin lebih baik bergabung dengan [SOU.GetAdjective] daripada melawan mereka."
 ROM_form_peasant_militias: "Bentuk Milisi Petani"
 ROM_form_peasant_militias_desc: "Dengan cita-cita komunis yang kita ambil dari tetangga kita, muncullah kewajiban setiap orang untuk membela rekan-rekannya, negaranya, dan revolusi."
 ROM_basing_rights_for_soviet_union: "Hak Mendasarkan untuk [SOU.GetName]"
 ROM_basing_rights_for_soviet_union_desc: "Kami tahu [SOU.GetAdjective] menginginkan wilayah kami, namun kami mungkin bisa menghindari permusuhan dengan menawarkan hak pangkalan kepada tetangga kami."
 ROM_romanian_volunteer_brigades: "Brigade Relawan Rumania"
 ROM_romanian_volunteer_brigades_desc: "Kami akan membentuk brigade sukarelawan dalam upaya mendukung revolusi yang masih baru di negara-negara lain."
 ROM_join_comintern: "Bergabunglah dengan Komintern"
 ROM_join_comintern_desc: "Waktunya telah tiba untuk akhirnya mengajukan petisi untuk keanggotaan di Komintern. Hal ini akan melindungi wilayah kita dari klaim negara-negara Timur, dan memungkinkan kita untuk lebih aktif memperjuangkan perjuangan komunisme secara global."
 ROM_trade_treaty_with_germany: "Perjanjian Perdagangan dengan Jerman"
 ROM_trade_treaty_with_germany_desc: "Kami tahu kepentingan ekonomi Jerman di negara kami. Mengatur peningkatan pengiriman barang seperti minyak akan memungkinkan kita meminta bantuan Jerman dalam memodernisasi militer kita."
 ROM_german_romanian_oil_exploitation_company: "Perusahaan Eksploitasi Minyak Jerman-Rumania"
 ROM_german_romanian_oil_exploitation_company_desc: "Kebutuhan Jerman akan minyak sangat besar, sehingga memberi kita peluang yang menguntungkan untuk memperluas kilang minyak kita."
 ROM_invite_german_advisors: "Undang Penasihat Jerman"
 ROM_invite_german_advisors_desc: "Bantuan Jerman sangat penting jika kita ingin memodernisasi militer kita. Mereka memiliki pengetahuan teknis yang kita perlukan, sehingga kita harus meminta bantuan penasihat mereka."
 ROM_invite_german_advisors_tt: "Izinkan Jerman untuk menempatkan pasukan di tanah Rumania."
 ROM_license_german_equipment: "Lisensi Peralatan Jerman"
 ROM_license_german_equipment_desc: "Peralatan Jerman lebih unggul dari milik kita, tapi mungkin kita sendiri yang bisa mendapatkan lisensi untuk memproduksi senjata ini."
 ROM_join_axis: "Bergabunglah dengan Poros"
 ROM_join_axis_desc: "Waktunya telah tiba untuk bergabung dengan Poros, sehingga kita dapat mengukir masa depan Rumania yang gemilang bersama Jerman."
 ROM_demand_transnistria: "Permintaan Transnistria"
 ROM_demand_transnistria_desc: "Sekarang kita sudah kuat dan mendapat dukungan Jerman, sudah tiba waktunya untuk menuntut wilayah Transnistria dan menggabungkannya ke dalam Rumania Raya."
 ROM_renew_the_romanian_polish_alliance: "Memperbarui Aliansi Rumania-Polandia"
 ROM_renew_the_romanian_polish_alliance_desc: "Hubungan lama kita dengan Polandia telah mendingin dalam beberapa tahun terakhir. Karena ancaman yang ada di sekitar kita belum berkurang, dan situasi politik global semakin bergejolak, inilah saatnya untuk menghidupkan kembali aliansi kita dengan negara tetangga kita di utara."
 ROM_the_cordon_sanitaire: "Sanitasi Cordon"
 ROM_the_cordon_sanitaire_desc: "Kita dibatasi oleh ideologi-ideologi berbahaya baik di Timur maupun di Barat. Bersama dengan negara-negara tetangga kami di utara dan selatan, kami akan membangun penghalang, mengkarantina dogma-dogma ini dan mencegahnya berkembang lebih jauh."
 ROM_demand_a_western_guarantee: "Menuntut Jaminan Barat"
 ROM_demand_a_western_guarantee_desc: "Jika kita ingin melawan komunisme dan fasisme, kita memerlukan bantuan Barat. Kami akan menggunakan semua pengaruh politik yang kami miliki untuk mendapatkan jaminan tersebut."
 ROM_military_modernization: "Modernisasi Militer"
 ROM_military_modernization_desc: "Bahkan dengan dukungan Barat, kita harus melakukan modernisasi angkatan bersenjata, sehingga sekutu kita punya waktu untuk mendukung kita sebelum semuanya hilang."
 ROM_join_allies: "Bergabunglah dengan Sekutu"
 ROM_join_allies_desc: "Jaminan saja tidak cukup – sekarang saatnya mendeklarasikan demokrasi Barat sepenuhnya, dan mendukung mereka dalam membela kebebasan."
 ROM_joint_allied_staff_college: "Sekolah Staf Gabungan Sekutu"
 ROM_joint_allied_staff_college_desc: "Mengingat kepentingan kita bersama, kita harus bekerja sama dengan negara-negara Barat dalam pengembangan peralatan dan taktik militer."
 ROM_civil_works: "Pekerjaan Sipil"
 ROM_civil_works_desc: "Rumania Raya akan memerlukan program pengembangan industri yang ekstensif jika ingin mendukung pembangunan militer skala besar. Kami akan memulainya sekarang."
 ROM_national_defense_industry: "Industri Pertahanan Nasional"
 ROM_national_defense_industry_desc: "Kita harus memperluas industri senjata nasional kita jika kita ingin memenuhi permintaan yang meningkat."
 ROM_agrarian_reform: "Reforma Agraria"
 ROM_agrarian_reform_desc: "Sektor agraria kita mempunyai banyak ruang untuk perbaikan. Menyederhanakannya dan meningkatkan efisiensinya akan membebaskan tenaga kerja yang dapat dipekerjakan di sektor lain, seperti konstruksi dan produksi senjata."
 ROM_danubian_transport_network: "Jaringan Transportasi Danubia"
 ROM_danubian_transport_network_desc: "Kemampuan transportasi kita di sepanjang Sungai Danube dapat ditingkatkan secara drastis, baik dengan memanfaatkan sungai itu sendiri secara lebih efektif maupun dengan menghubungkannya dengan jaringan jalan raya dan kereta api kita."
 ROM_malaxa: "MALAXA"
 ROM_malaxa_desc: "Kita harus memperluas industri otomotif dalam negeri, sehingga dapat dengan mudah diubah dan digunakan untuk keperluan militer, bila diperlukan. Untuk tujuan ini, salah satu taipan bisnis kami memiliki beberapa ide menarik yang dapat kami manfaatkan..."
 ROM_invite_foreign_motor_companies: "Undang Perusahaan Motor Asing"
 ROM_invite_foreign_motor_companies_desc: "Daripada menghabiskan sumber daya untuk meningkatkan produksi desain mobil dalam negeri yang belum terbukti, kita akan mendapat manfaat lebih besar dengan memproduksi desain asing yang sudah teruji dan teruji di bawah lisensi."
 ROM_hunedoara_steel_works: "Pekerjaan Baja Hunedoara"
 ROM_hunedoara_steel_works_desc: "Untuk memenuhi kebutuhan produksi senjata kita, pabrik baja besar di Transylvania harus dimodernisasi dan diperluas secara drastis."
 ROM_invest_in_the_iar: "Berinvestasi di IAR"
 ROM_invest_in_the_iar_desc: "Sangat penting untuk memenuhi tuntutan angkatan udara modern. Industri kita harus mampu tidak hanya membuat mesin yang kita butuhkan, namun juga melakukannya dengan kecepatan yang cukup cepat untuk menggantikan kerugian operasional."
 ROM_expand_ploiesti_oil_production: "Memperluas Produksi Minyak Ploiesti"
 ROM_expand_ploiesti_oil_production_desc: "Kami memiliki beberapa ladang minyak terbesar di Eropa di Ploiesti, dan ladang-ladang ini sangat penting tidak hanya bagi kami sendiri, namun juga bagi sekutu-sekutu kami dan negara-negara lain di wilayah tersebut. Kita harus meningkatkan produksi ladang untuk memenuhi permintaan dengan lebih baik."
 ROM_expand_the_university_of_bucharest: "Perluas Universitas Bukares"
 ROM_expand_the_university_of_bucharest_desc: "Dengan meningkatkan kualitas dan kapasitas universitas, kita dapat meningkatkan sumber daya manusia terbaik dan tercerdas yang kita andalkan dalam kemajuan teknologi."
 ROM_exploit_the_baita_mines: "Eksploitasi Tambang Baita"
 ROM_exploit_the_baita_mines_desc: "Mulai menjadi jelas bahwa uranium sangat penting bagi kemajuan teknologi persenjataan yang paling drastis sejak penemuan senjata api. Kita cukup beruntung mempunyai simpanan bahan-bahan tersebut dalam jumlah besar di wilayah kita, dan kita harus mendirikan tambang untuk mengeksploitasinya."
 ROM_balkans_dominance: "Dominasi Balkan"
 ROM_balkans_dominance_desc: "Kunci menuju masa depan Rumania yang sejahtera bukan terletak pada kaum revolusioner di Timur, atau negara demokrasi atau fasis di Barat, namun pada dominasi Rumania di Balkan."
 ROM_puppet_bulgaria: "Boneka Bulgaria"
 ROM_puppet_bulgaria_desc: "Bulgaria yang suka berperang telah lama menjadi duri bagi negara tetangganya. Kita harus menundukkan mereka untuk selamanya."
 ROM_align_hungary: "Sejajarkan Hongaria"
 ROM_align_hungary_desc: "Hongaria harus dibuat memahami sudut pandang kami. Pemerintahan mereka dipimpin oleh unsur-unsur sesat yang hanya akan membawa negara menuju kehancuran. Mereka akan lebih kuat bersama kami."
 ROM_HUN_aligned: "Hongaria selaras"
 ROM_secure_greece: "Amankan Yunani"
 ROM_secure_greece_desc: "Yunani – meskipun sering menjadi sekutu di masa lalu – harus dibuat menerima dominasi Rumania di wilayah tersebut."
 ROM_divide_yugoslavia: "Bagilah Yugoslavia"
 ROM_divide_yugoslavia_desc: "Tatanan negara-negara Balkan yang membentuk Yugoslavia saat ini tidak dapat dipertahankan. Kami akan mengeluarkan ultimatum yang mengharuskan restrukturisasi negara-negara bagiannya, di bawah kepemimpinan Rumania."
 ROM_split_czechoslovakia: "Pisahkan Cekoslowakia"
 ROM_split_czechoslovakia_desc: "Cekoslowakia adalah sebuah konstruksi buatan yang tidak dapat bertahan dengan sendirinya. Kita tidak bisa membiarkan bagian ini tergelincir ke dalam kekacauan dan kita harus melakukan intervensi sebelum situasi menjadi tidak dapat dipertahankan."
 ROM_secure_the_bosporus: "Amankan Bosporus"
 ROM_secure_the_bosporus_desc: "Akses angkatan laut kami, untuk saat ini, terbatas pada Laut Hitam. Turki, yang terletak di Selat Bosporus, dapat memblokir akses kita ke Laut Tengah jika terjadi perang, sehingga kita harus memastikan jalur bebas hambatan ketika kita membutuhkannya."
 ROM_institute_royal_dictatorship: "Institut Kediktatoran Kerajaan"
 ROM_institute_royal_dictatorship_desc: "Saatnya telah tiba untuk lebih meningkatkan kekuasaan Raja yang sudah luas, membawa stabilitas politik bagi negara dan memungkinkan negara untuk fokus pada ancaman dari luar."
 ROM_fortify_the_borders: "Perkuat Perbatasan"
 ROM_fortify_the_borders_desc: "Kini setelah situasi dalam negeri sudah terkendali, kita harus berupaya meningkatkan pertahanan perbatasan kita dari ancaman luar."
 ROM_flexible_foreign_policy: "Kebijakan Luar Negeri yang Fleksibel"
 ROM_flexible_foreign_policy_desc: "Kita harus meninggalkan prinsip-prinsip kita dan menjalin hubungan dengan siapa pun yang lebih praktis untuk melakukannya. Kelangsungan hidup kita bergantung padanya."
 ROM_his_majestys_loyal_government: "Pemerintahan Setia Yang Mulia"
 ROM_his_majestys_loyal_government_desc: "Loyalitas dalam negeri adalah hal yang terpenting, dan selama negara tersebut mendukung Rajanya, kebijakan luar negeri yang pragmatis tidak diperlukan."
 ROM_militarize_the_sentinels: "Militerisasikan Sentinel"
 ROM_militarize_the_sentinels_desc: "Sentinel paramiliter dapat dengan mudah diubah menjadi organisasi militer yang utuh, asalkan kita mengalokasikan sumber daya yang sesuai."
 ROM_all_parties_must_end: "Semua Pesta Harus Berakhir"
 ROM_all_parties_must_end_desc: "Tidak ada partai yang bertahan selamanya, dan situasi geopolitik saat ini memerlukan perhatian penuh dari Raja kita. Dia mungkin mengadakan pesta setelah perang usai, tetapi untuk saat ini dia harus meninggalkan cara-cara hedonistiknya."
 ROM_revise_the_constitution: "Merevisi Konstitusi"
 ROM_carol_current_leader_trigger: "§YCarol II§! adalah pemimpin negara saat ini."
 ROM_carol_not_leader_trigger: "§YCarol II§! bukan pemimpin negara."
 ROM_revise_the_constitution_desc: "Konstitusi harus ditulis ulang untuk memperkuat posisi Raja sebagai pemimpin negara. Selain itu, gerakan sayap kanan yang berbahaya dapat dirusak dengan memberikan alternatif yang lebih aman melalui organisasi pemuda King's Sentinel of the Motherland."
 ROM_the_royal_foundation: "Yayasan Kerajaan"
 ROM_the_royal_foundation_desc: "Raja dengan senang hati setuju untuk mendirikan sebuah yayasan atas namanya untuk mempelajari budaya Rumania dan menciptakan ilmu pengetahuan bangsa."
 ROM_appoint_soviet_friendly_government: "Tunjuk Pemerintahan Pro-Soviet"
 ROM_appoint_soviet_friendly_government_desc: "Masa depan Rumania bergantung pada hubungan baik dengan tetangga kami yang komunis di timur. Kita harus menunjuk pemerintah yang memahami kenyataan ini."
 ROM_securitate: "Amankan"
 ROM_securitate_desc: "Kita harus membentuk organisasi polisi rahasia yang besar untuk meredam ancaman internal terhadap pemerintahan baru kita."
 ROM_appoint_german_friendly_government: "Tunjuk Pemerintahan Pro Poros"
 ROM_appoint_german_friendly_government_desc: "Masa depan Rumania bergantung pada hubungan baik dengan kekuatan Fasis yang sedang berkembang di Barat. Kita harus menunjuk pemerintah yang memahami kenyataan ini."
 ROM_appoint_german_friendly_government_tooltip: "Menghapus §YJaminan Konstitusi§!, §Y$ROM_national_christian_party_in_power$§! dan §YSecuritate§!"
 ROM_appoint_allied_friendly_government_tooltip: "Menghapus §YIron Guard§!, §Y$ROM_national_christian_party_in_power$§! dan §YSecuritate§!"
 ROM_appoint_soviet_friendly_government_tooltip: "Menghapus §YJaminan Konstitusi§!, §Y$ROM_national_christian_party_in_power$§! dan §YPengawal Besi§!"
 ROM_appoint_german_friendly_government_tooltip_ncp: "Menghapus §YJaminan Konstitusi§!, §YPengawal Besi§! dan §YSecuritate§!"
 ROM_iron_guard: "Penjaga Besi"
 ROM_iron_guard_desc: "Ini saatnya untuk mempertimbangkan kembali kebijakan kita mengenai Garda Besi. Dengan pemerintahan baru kita, gerakan ini kini jauh lebih sejalan dengan sudut pandang resmi kita, dan dapat berfungsi sebagai alat yang sangat baik untuk meningkatkan stabilitas politik negara."
 ROM_force_abdication: "Pengunduran Diri Secara Paksa"
 ROM_force_abdication_desc: "Raja Carol II tidak lagi diperlukan, dan memang terbukti lebih merepotkan daripada seorang pemimpin. Meskipun ia masih memiliki kendali luas atas pemerintahan dan keuangan negara, ia harus turun tahta demi kebaikan jangka panjang Rumania."
 ROM_appoint_allied_friendly_government: "Tunjuk Pemerintahan yang Pro-Sekutu"
 ROM_appoint_allied_friendly_government_desc: "Masa depan Rumania bergantung pada hubungan baik dengan sekutu lama kita di Barat – Perancis dan sekutunya. Kita harus menunjuk pemerintah yang meneruskan hubungan ini."
 ROM_constitutional_guarantees: "Jaminan Konstitusi"
 ROM_constitutional_guarantees_desc: "Perubahan konstitusi yang telah dilaksanakan oleh Raja harus dikembalikan, dan jaminan serta keseimbangan harus diberikan untuk memastikan hal ini tidak terjadi lagi. Jika tidak, yang tersisa hanyalah olok-olok terhadap demokrasi."
 ROM_handle_the_king: "Tangani Raja"
 ROM_handle_the_king_desc: "Perundang-undangan harus dibuat untuk membatasi gaya hidup Raja yang penuh semangat. Perbendaharaan negara mungkin tidak lagi digunakan untuk pengeluaran pribadinya."
 ROM_king_michaels_coup: "Kudeta Raja Michael"
 ROM_king_michaels_coup_desc: "Pemerintahan saat ini membawa Rumania menuju kehancuran. Dibutuhkan tangan yang tegas untuk menjauhkan bangsa dari bencana – tangan Pangeran Michael."
 ROM_expand_the_air_force: "Perluas Angkatan Udara"
 ROM_expand_the_air_force_desc: "Perang modern tidak dapat dimenangkan tanpa mendominasi angkasa. Kita harus melakukan segala daya kita untuk mengembangkan angkatan udara Rumania!"
 ROM_acquire_licenses: "Dapatkan Lisensi"
 ROM_acquire_licenses_desc: "Teknologi penerbangan asing lebih unggul dari kita, dan kita harus mempertimbangkan untuk mendapatkan lisensi sehingga kita dapat memproduksi sendiri pesawat terbang dengan inovasi mereka."
 ROM_air_defense: "Pertahanan Udara"
 ROM_air_defense_desc: "Kita harus melindungi perbatasan kita dengan baterai anti-udara yang ekstensif, untuk meringankan beban angkatan udara kecil kita."
 ROM_heavy_interceptors: "Pencegat Berat"
 ROM_heavy_interceptors_desc: "Negara kita tidak dapat mendukung angkatan udara yang besar. Kita harus memusatkan daya tembak sebanyak mungkin di setiap pesawat untuk menghancurkan penyerang mana pun."
 ROM_ground_support: "Dukungan Darat"
 ROM_ground_support_desc: "Gabungan senjata adalah prinsip penting peperangan modern. Angkatan udara harus dilatih untuk mendukung angkatan darat kita, bila diperlukan."
 ROM_medium_bombers: "Pembom Sedang"
 ROM_medium_bombers_desc: "Era sudah lewat ketika tentara bisa memenangkan perang tanpa memandang ke langit. Kita harus mengembangkan pesawat pengebom taktis untuk memberikan dukungan udara yang dibutuhkan tentara kita."
 ROM_cas: "KAS"
 ROM_cas_desc: "Kita memerlukan model pesawat khusus, yang dirancang khusus untuk dukungan udara jarak dekat, jika kita ingin mendapatkan hasil maksimal dari kekuatan gabungan kita."
 ROM_acquire_fighters: "Dapatkan Pejuang"
 ROM_acquire_fighters_desc: "Superioritas udara adalah kunci pertahanan kita, dan oleh karena itu penting bagi kita untuk memperluas kekuatan tempur kita dengan segala cara yang memungkinkan."
 ROM_local_development: "Pembangunan Lokal"
 ROM_local_development_desc: "Kami akan mengandalkan industri penerbangan dalam negeri Rumania untuk memproduksi pesawat terbang yang kami butuhkan."
 ROM_air_superiority: "Keunggulan Udara"
 ROM_air_superiority_desc: "Penguasaan udara merupakan persyaratan penting dalam operasi militer, dan aspek peperangan udara inilah yang harus kita fokuskan."
 ROM_strategic_bomber_force: "Pasukan Pembom Strategis"
 ROM_strategic_bomber_force_desc: "Operasi militer adalah hal kedua setelah penghancuran industri dan infrastruktur musuh. Pengeboman strategis adalah cara kita mencapai hal tersebut."
 ROM_heavy_bombers: "Pembom Berat"
 ROM_heavy_bombers_desc: "Kekuatan pengeboman strategis kami memerlukan jangkauan yang luas dan muatan bom. Pesawat pengebom besar adalah satu-satunya pilihan yang layak untuk mencapai persyaratan ini."
 ROM_nuclear_bomb_project: "Proyek Bom Nuklir"
 ROM_nuclear_bomb_project_desc: "Kita tidak pernah bisa berharap untuk mengebom musuh-musuh kita melalui cara-cara konvensional. Oleh karena itu, kita harus fokus pada kemajuan teknologi yang memungkinkan kita mencapai lebih banyak kehancuran dengan biaya yang lebih sedikit. Masih banyak lagi."
 ROM_iar_80: "IAR 80"
 ROM_iar_80_desc: "Insinyur kami memiliki ide-ide luar biasa yang ingin mereka tuangkan ke dalam desain pesawat tempur baru. Mereka hanya membutuhkan pendanaan dan lampu hijau."
 ROM_army_maneuvers: "Manuver Tentara"
 ROM_army_maneuvers_desc: "Tentara kita harus kembali bugar untuk menghadapi potensi konflik bersenjata di masa depan. Kami akan mengirim mereka melakukan manuver untuk mengembangkan taktik dan strategi baru."
 ROM_army_war_college: "Perguruan Tinggi Perang Angkatan Darat"
 ROM_army_war_college_desc: "Kita membutuhkan orang-orang yang paling cerdas dalam memimpin pasukan militer kita, yang berarti perguruan tinggi perang harus diperluas."
 ROM_war_college_tt: "§Y2 Skill§! Umum bernama §YBarbu Paraianu§! akan muncul."
 ROM_the_zb_53: "ZB-53"
 ROM_the_zb_53_desc: "Peralatan modern adalah kunci dalam peperangan, dan kita harus berusaha untuk memodernisasi persenjataan infanteri kita."
 ROM_vanatori_de_munte: "Vanatori De Munte"
 ROM_vanatori_de_munte_unit_tt: "Dapatkan unit §YPendaki Gunung§! dengan 9 batalyon."
 ROM_vanatori_de_munte_desc: "Vanatori De Munte - Pemburu Gunung - adalah infanteri gunung elit kami. Reputasi mereka mendahului mereka, bahkan di luar negeri, dan kita sebaiknya meningkatkan jumlah mereka dengan yang terbaik yang bisa kita temukan."
 ROM_artillery_modernization: "Modernisasi Artileri"
 ROM_artillery_modernization_desc: "Infanteri tidak berfungsi dengan dukungan artileri yang tepat. Memastikan senjata modern dan berkualitas tinggi akan sangat membantu meningkatkan efektivitas pasukan kita."
 ROM_modern_at_guns: "Senjata AT Modern"
 ROM_modern_at_guns_desc: "Usia tank telah tiba, dan infanteri kita memerlukan sarana terkini untuk mempertahankan diri melawan raksasa baja ini."
 ROM_mountain_artillery: "Artileri Gunung"
 ROM_mountain_artillery_tech_tt: "Mengaktifkan §HSenjata Gunung§!\n§HArtileri\nGunung§!: Pergerakan: §G+15%§!\n§HAnti-Tank\nGunung§!: Pergerakan: §G+15%§!"
 ROM_mountain_artillery_desc: "Para pendaki gunung kita harus menerima dukungan artileri yang seharusnya mereka terima, jika kita ingin mempertahankan keunggulan mereka. Oleh karena itu, artileri kami harus disesuaikan untuk penggunaan di pegunungan."
 ROM_reserve_divisions: "Divisi Cadangan"
 ROM_reserve_divisions_desc: "Rumania adalah negara kecil, dan kita harus mengalokasikan jumlah yang sesuai untuk divisi cadangan jika tentara kita ingin mempunyai kekuatan bertahan di lapangan."
 ROM_royal_guards_divisions: "Divisi Pengawal Kerajaan"
 ROM_royal_guards_divisions_tt: "Dapatkan unit dengan batalyon §Y7 Infanteri§! dan §Y2 Artileri§!."
 ROM_royal_guards_divisions_desc: "Pengawal Kerajaan kita harus diperluas, sebagaimana layaknya Raja kita yang agung."
 ROM_the_armored_division: "Divisi Lapis Baja"
 ROM_the_armored_division_tt: "Dapatkan dua unit dengan batalyon §Y4 [ROM_UnlockedArmor] Armor§! dan §Y4 Bermotor§!.\n\nMenambahkan §YPerusahaan Pengintai§! ke divisi jika teknologinya telah diteliti."
 ROM_the_armored_division_desc: "Tank adalah jalan ke depan, dan kita harus membentuk divisi khusus yang memanfaatkan kekuatan senjata baru ini."
 ROM_acquire_modern_tanks: "Dapatkan Tank Modern"
 ROM_acquire_modern_tanks_desc: "Perkembangan tank terus berlanjut dengan pesat, dan tidak cukup hanya dengan membeli model-model yang sudah ketinggalan zaman."
 ROM_mobile_tank_destroyers: "Penghancur Tank Bergerak"
 ROM_mobile_tank_destroyers_desc: "Kita tidak memiliki industri yang bisa mengalahkan musuh kita dalam hal produksi tank. Kita harus fokus pada produksi senjata yang dapat meniadakan superioritas musuh dalam unit lapis baja."
 ROM_the_maresal: "Maresal"
 ROM_the_maresal_desc: "Teknisi kami mendapat ide untuk menempatkan howitzer 122 mm Soviet di dalam wadah tertutup. Dengan lebih menyempurnakan desain ini, kita mungkin bisa menciptakan model tank yang sangat sukses."
 ROM_expand_the_galati_shipyards: "Perluas Galangan Kapal Galati"
 ROM_expand_the_galati_shipyards_desc: "Fasilitas galangan kapal kami yang sudah ada di Galati harus diperluas jika kami ingin memproyeksikan kekuatan kami ke Laut Hitam."
 ROM_coastal_defense_navy: "Angkatan Laut Pertahanan Pesisir"
 ROM_coastal_defense_navy_desc: "Dengan sumber daya yang terbatas, yang bisa kita lakukan hanyalah mengamankan wilayah pesisir kita. Segala upaya harus diarahkan pada tujuan ini."
 ROM_coastal_defense_ships: "Kapal Pertahanan Pesisir"
 ROM_coastal_defense_ships_tech_tt: "Mengaktifkan §HKapal Pertahanan Pesisir§!\n§HPenjelajah Berat§! Armor: §G+20%§! Daya Tembak Angkatan Laut: §G+10%§! Biaya Produksi: §G-10%§!"
 ROM_coastal_defense_ships_desc: "Desain baru harus diciptakan untuk kapal yang unggul dalam tugas pertahanan pantai."
 ROM_modern_destroyers: "Penghancur Modern"
 ROM_modern_destroyers_desc: "Kapal perusak adalah tulang punggung angkatan laut mana pun, tidak terkecuali angkatan laut kita. Tulang punggung angkatan laut kita harus disesuaikan dengan standar saat ini."
 ROM_torpedo_boats: "Kapal Torpedo"
 ROM_torpedo_boats_desc: "Torpedo adalah penyeimbang perang laut. Dengan memastikan semua kapal kita membawa torpedo, kita mungkin dapat mengejutkan dan memusnahkan kekuatan superior melalui keberanian dan volume tembakan torpedo."
 ROM_modern_submarines: "Kapal Selam Modern"
 ROM_modern_submarines_desc: "Peperangan kapal selam adalah perkembangan angkatan laut yang paling menarik sejak penemuan kapal torpedo. Kita sebaiknya tidak hanya melindungi dari kapal selam, tapi juga menggunakannya untuk melawan kapal musuh."
 ROM_black_sea_dominance: "Dominasi Laut Hitam"
 ROM_black_sea_dominance_desc: "Kurangnya sumber daya yang kita miliki seharusnya tidak menjadi penghalang bagi dominasi total Rumania di Laut Hitam di masa depan. Dengan kemauan politik yang tepat, kami akan mewujudkan hal ini."
 ROM_capital_ships: "Kapal Modal"
 ROM_capital_ships_desc: "Jika kita ingin dianggap serius sebagai kekuatan angkatan laut, kita akan membutuhkan kapal-kapal besar untuk memimpin armada Laut Hitam kita."
 ROM_torpedo_bombers: "Pembom Torpedo"
 ROM_torpedo_bombers_desc: "Kita dapat mengatasi kelemahan angkatan laut kita dengan mengalokasikan sebagian angkatan udara kita untuk menjalankan tugas angkatan laut. Hal ini memerlukan model pesawat baru yang dapat membawa torpedo."
 ROM_expand_the_marine_regiment: "Perluas Resimen Marinir"
 ROM_expand_the_marine_regiment_desc: "Penguasaan Laut Hitam membuka peluang serangan baru. Invasi angkatan laut kini menjadi pilihan yang layak, sehingga memerlukan penciptaan model transportasi baru, serta divisi kelautan khusus yang dapat berspesialisasi dalam bentuk peperangan ini."
 CZE_fortification_studies: "Studi Fortifikasi"
 CZE_fortification_studies_desc: "Kebutuhan untuk membentengi perbatasan kita sudah jelas, namun pertanyaannya adalah bagaimana caranya? Perancis baru-baru ini membangun garis pertahanan mereka yang luar biasa, Garis Maginot, dan dengan mengirimkan delegasi untuk mempelajari metode mereka, masalah pertahanan perbatasan kita akan dapat diselesaikan."
 CZE_fallback_line: "Bangun Garis Cadangan"
 CZE_fallback_line_desc: "Jika perbatasan tidak dapat dipertahankan, akan lebih baik jika kita membangun kembali garis pertahanan kedua sebelum serangan dari barat dapat mencapai jantung wilayah kita."
 CZE_sudeten_1: "Benteng Awal Sudetenland"
 CZE_sudeten_1_desc: "Sudetenland, perbatasan pegunungan kami dengan Jerman, adalah tempat yang sempurna untuk benteng perbatasan. Setelah mempelajari garis Maginot Prancis, kita dapat membuat garis serupa milik kita sendiri."
 CZE_sudeten_2: "Benteng Tingkat Lanjut Sudetenland"
 CZE_sudeten_2_desc: "Sudetenland sekarang memiliki garis pertahanan yang bagus, tapi bagus saja tidak cukup jika kelangsungan hidup nasional kita dipertaruhkan."
 CZE_sudeten_3: "Benteng Terakhir Sudetenland"
 CZE_sudeten_3_desc: "Sudetenland memiliki sistem benteng yang kuat, namun mereka masih bisa lebih kuat!"
 CZE_hungarian_line: "Garis Hongaria"
 CZE_hungarian_line_desc: "Iridentisme Hongaria merupakan ancaman terus-menerus terhadap negara kita, sistem benteng di sepanjang perbatasan kita akan membantu menjamin keselamatan kita."
 CZE_polish_line: "Garis Polandia"
 CZE_polish_line_desc: "Agresi Polandia tidak mengenal batas, namun diharapkan perbatasan yang dibentengi dengan baik akan membuat mereka mencari sasaran yang lebih mudah."
 CZE_internal_redoubts: "Keraguan Internal"
 CZE_internal_redoubts_desc: "Sistem benteng apa pun bisa dipatahkan. Untuk mencegah kemungkinan ini, kita dapat membangun titik-titik kuat di sekitar kota-kota terpenting kita sehingga kota-kota tersebut tidak mudah direbut oleh musuh yang menerobos garis pertahanan kita."
 CZE_industrial_legacy: "Warisan Industri yang Hebat"
 CZE_industrial_legacy_desc: "Skoda Works adalah produsen senjata terbesar di Austria-Hongaria, dan sejak kemerdekaan kami, mereka telah berkembang menjadi pemimpin di banyak bidang industri. Memiliki konsentrasi keahlian dan industri berat yang tinggi sangat membantu semua upaya industri."
 CZE_favor_czechs_1: "Industri Ceko"
 CZE_favor_czechs_1_desc: "Selalu ada ketegangan antara Ceko dan Slovakia di negara kita, salah satunya karena sebagian besar kekuatan industri kita terkonsentrasi di provinsi Bohemia dan Moravia di Ceko. Meskipun demikian, kekuatan industri tersebut mempermudah pembangunan lebih banyak pabrik di wilayah tersebut meskipun hal ini mungkin akan semakin membuat marah rakyat Slovakia."
 CZE_favor_czechs_2: "Kawasan Industri"
 CZE_favor_czechs_2_desc: "Investasi lebih lanjut yang difokuskan ke Bohemia dan Moravia akan meningkatkan industri kita lebih dari sekedar pendekatan yang lebih luas."
 CZE_favor_czechs_3: "Kota Industri Baru"
 CZE_favor_czechs_3_desc: "Setelah mengembangkan kawasan industri lama di Bohemia dan Moravia, kini saatnya membangun kota-kota baru untuk menampung para pekerja di industri kita yang sedang berkembang."
 CZE_balanced_1: "Investasi Industri yang Seimbang"
 CZE_balanced_1_desc: "Dalam upaya meredakan ketegangan antara Ceko dan Slovakia, telah diusulkan agar pertumbuhan industri di masa depan harus dibagi secara merata di wilayah masing-masing negara meskipun hal ini secara keseluruhan kurang efisien."
 CZE_balanced_2: "Komisi Perencanaan Gabungan Ceko-Slowakia"
 CZE_balanced_2_desc: "Dengan membentuk gabungan politisi dari kedua negara, kita dapat memastikan bahwa setiap orang dapat mengambil bagian secara setara dalam pertumbuhan industri di negara kita."
 CZE_balanced_3: "Spesialisasi Lokal"
 CZE_balanced_3_desc: "Dengan terus berlanjutnya investasi dalam industri di seluruh wilayah tanah air, beberapa daerah mulai mengkhususkan diri pada barang dan jasa tertentu. Hal ini dapat kita dorong lebih jauh lagi."
 CZE_united_population: "Populasi Bersatu"
 CZE_united_population_desc: "Sejumlah inisiatif politik baru-baru ini dikombinasikan dengan kebijakan pertumbuhan industri yang seimbang telah membuat masyarakat Ceko dan Slovakia merasa lebih bersatu dalam tujuan mereka."
 CZE_arms_exports_1: "Ekspor Senjata"
 CZE_arms_exports_1_desc: "Skoda Works telah lama menjadi pemasok senjata utama di seluruh Eropa, memproduksi senjata dalam skala yang jauh lebih tinggi daripada yang dibutuhkan oleh negara kita sendiri. Produksi dalam skala sebesar itu menghasilkan efisiensi produksi yang tidak dapat diimpikan oleh produsen lain."
 CZE_arms_exports_2: "Subsidi Ekspor"
 CZE_arms_exports_2_desc: "Ketika ancaman perang semakin besar, semakin banyak negara yang ingin membeli tank. Jaminan pemerintah atas pinjaman dan tindakan lainnya dapat mendorong negara lain untuk membeli barang Cekoslowakia, dan meningkatkan skala ekonomi lebih jauh lagi."
 CZE_arms_exports_3: "Jaminan Akses yang Setara"
 CZE_arms_exports_3_desc: "Permintaan senjata berada pada titik tertinggi sepanjang masa, begitu pula hasil produksi kami. Untuk mendukung penjualan senjata, kami dapat menyatakan secara terbuka bahwa kami akan menjualnya kepada siapa pun yang memiliki uang tunai untuk membayarnya – dan kemudian menggunakan uang tersebut untuk berinvestasi pada persenjataan kami sendiri."
 CZE_political_direction: "Evaluasi Iklim Politik"
 CZE_political_direction_desc: "Demokrasi kita masih muda dan belum teruji secara kuat. Dengan meningkatnya fasisme dan komunisme di seluruh Eropa, pertanyaan yang harus diajukan adalah: Apakah ini arah yang benar, atau jika tidak, lalu arah manakah yang benar?"
 CZE_go_left: "Rakyat Bersatu dalam Satu Kehendak"
 CZE_go_left_desc: "Komunisme adalah masa depan! Semua upaya harus diarahkan untuk membentuk kembali pemerintahan dan masyarakat kita agar mengikuti cita-cita Marxis."
 CZE_czech_socialism: "Sosialisme Ceko"
 CZE_czech_socialism_desc: "Kendali terpusat tentu saja bagus untuk perekonomian, tapi mungkin saja bisa memberikan banyak manfaat. Dengan sedikit melakukan desentralisasi ke dalam soviet-soviet Ceko dan Slovakia, persatuan yang lebih besar secara keseluruhan dapat tercapai!"
 CZE_communism_with_a_human_face: "Komunisme Berwajah Manusia"
 CZE_communism_with_a_human_face_desc: "Dengan menyerukan partisipasi yang lebih besar dari masyarakat dalam politik lokal dan negara di bawah payung Partai Komunis, kita akan memberikan semangat baru ke dalam cita-cita Komunisme."
 CZE_communist_support: "Dukungan Komunis"
 CZE_communist_support_desc: "Ayunan kita ke kiri sedang mengumpulkan momentum. Dukungan terhadap komunisme semakin meningkat secara nasional, dan angka tersebut akan terus meningkat seiring dengan semakin banyaknya dukungan pemerintah terhadap komunisme."
 CZE_join_comintern: "Bergabunglah dengan Komintern"
 CZE_join_comintern_desc: "Mantan sekutu kita yang kurang progresif tidak bisa lagi diandalkan. Sudah waktunya untuk menandatangani aliansi dengan Uni Soviet untuk menjamin keamanan kita terhadap agresi Fasis-Imperialis."
 CZE_the_romanian_question: "Pertanyaan Rumania"
 CZE_the_romanian_question_desc: "Rumania berdiri di antara kami dan sahabat sekaligus pelindung kami, Uni Soviet. Karena mereka tidak mengizinkan lewatnya pasukan Soviet untuk membantu pertahanan kita, solusi yang lebih drastis harus dipertimbangkan."
 CZE_the_polish_division: "Divisi Polandia"
 CZE_the_polish_division_desc: "Polandia tidak hanya menolak masuknya pasukan Soviet jika kami membutuhkan bantuan mereka, mereka juga masih menyimpan kebencian atas pembebasan kami di wilayah Zaolzie dan mungkin akan membalas dendam. Pertahanan yang bersifat preemptif akan lebih bijaksana."
 CZE_democratic_bastion: "Benteng Demokrat"
 CZE_democratic_bastion_desc: "Cekoslowakia adalah benteng demokrasi di Eropa Tengah dan akan tetap demikian, apa pun yang terjadi!"
 CZE_beacon_of_liberty: "Suar Kebebasan"
 CZE_beacon_of_liberty_desc: "Komitmen kami terhadap demokrasi menginspirasi warga negara kami dan mereka yang harus melarikan diri dari rezim yang lebih menindas."
 CZE_healing_a_divided_nation: "Menyembuhkan Bangsa yang Terpecah"
 CZE_healing_a_divided_nation_desc: "Masyarakat di negara kita sekarang tahu bahwa kebebasan yang kita ucapkan akan didukung dengan tindakan. Kita akhirnya bisa menyembuhkan beberapa luka yang telah memecah belah bangsa kita."
 CZE_defensive_preparations: "Persiapan Defensif"
 CZE_defensive_preparations_desc: "Tampaknya perang pasti akan terjadi, baik kita menginginkannya atau tidak. Oleh karena itu, sebaiknya kita bersiap menghadapinya."
 CZE_bonus_research_slot_1: "Universitas Teknik Ceko"
 CZE_bonus_research_slot_1_desc: "Dengan semakin dekatnya perang, fokus yang lebih besar pada teknologi praktis akan memberikan manfaat yang baik bagi kita."
 CZE_go_right: "Memberdayakan Liga Fasis Nasional"
 CZE_go_right_desc: "Hanya di bawah Fasisme rakyat Ceko dapat mencapai kejayaan! Demokrasi di Eropa pasti akan punah, dan hanya negara-negara kuat, yaitu negara-negara fasis, yang akan mendapat kursi di meja perundingan ketika negara-negara lemah terpecah belah!"
 CZE_czech_fascism: "Fasisme Ceko"
 CZE_czech_fascism_desc: "Dukungan terhadap Fasisme semakin meningkat secara nasional, dan seiring dengan semakin banyaknya kekuasaan yang jatuh ke tangan Fasis, maka semakin banyak pula tekanan yang dapat diberikan kepada para pembangkang yang melakukan perlawanan."
 CZE_aggressive_wars: "Perang Agresi"
 CZE_aggressive_wars_desc: "Dengan kemenangan Fasisme, kebangkitan kita menuju kekuasaan bisa dimulai!"
 CZE_the_polish_question: "Pertanyaan Polandia"
 CZE_the_polish_question_desc: "Polandia tidak pernah memaafkan kami atas Zaolzie, dan jika kami menunjukkan kelemahan, mereka pasti akan menerkam. Mengapa negara besar seperti Cekoslowakia harus menderita akibat ancaman seperti ini? Tidak Ada Lagi! Tindakan tegas harus diambil!"
 CZE_exclude_the_slovaks: "Konsolidasi Ceko"
 CZE_exclude_the_slovaks_desc: "Sejak negara kami terbentuk, rakyat Slovakia sudah tidak puas. Selalu mencari Kekuasaan Politik yang lebih besar, selalu menuntut lebih dari sekedar pembagian sumber daya nasional yang adil. Tidak lagi! Untuk selanjutnya, kekuasaan akan terkonsentrasi di tangan Ceko. §RIni akan menyebabkan perang saudara.§!"
 CZE_national_fascism: "Fasisme Nasional"
 CZE_national_fascism_desc: "Ceko dan Slowakia bersatu sepenuhnya di bawah panji Fasisme. Bersama-sama, kita bergerak maju! Bersama-sama kita tidak dapat dihentikan!"
 CZE_german_minor_ally: "Satelit Jerman"
 CZE_german_minor_ally_desc: "Jerman adalah kekuatan yang sedang berkembang, kekuatan yang dapat kita ikuti menuju kejayaan. Jika Jerman memimpin, kami akan mengikuti dan mencapai tujuan kami dalam perjalanannya."
 CZE_german_minor_ally_tt: "Menjadi Satelit Jerman, memberikan bonus untuk melisensikan teknologi Jerman tetapi juga memberikan Jerman kekuasaan atas negara kita."
 CZE_german_ally: "Mitra Jerman yang Berharga"
 CZE_german_ally_desc: "Jerman adalah sesama kekuatan Fasis, sesama penjelajah dalam perjalanan menuju kejayaan. Bersama-sama kita akan membuat dunia berputar mengelilingi Poros Praha-Berlin!"
 CZE_strategy_decisions: "Keputusan Strategis"
 CZE_strategy_decisions_desc: "Badai sedang terjadi di Eropa, ancaman perang membayangi, namun bagaimana Cekoslowakia akan menghadapi tantangan di masa depan?"
 CZE_german_leanings: "Ketenangan Jerman"
 CZE_german_leanings_desc: "Kekuatan Jerman sedang meningkat, dan tujuan mereka adalah menyatukan semua orang berbahasa Jerman dalam satu Negara Jerman. Sebagai negara dengan minoritas Jerman yang cukup besar, perkembangan ini mengkhawatirkan. Kecuali kita bisa mendapatkan sekutu yang kuat, kita bisa mendapat manfaat dari tetap berada di bawah dukungan Jerman."
 CZE_german_puppet: "Protektorat Jerman"
 CZE_german_puppet_desc: "Jerman tidak bisa ditenangkan, mereka tidak akan berhenti sampai mereka menguasai kita. Namun, mungkin dengan bertekuk lutut kita dapat mempertahankan otonomi?"
 CZE_hungarian_situation: "Situasi Hongaria"
 CZE_hungarian_situation_desc: "Hongaria telah lama menjadi duri bagi kami, namun dengan kekuatan penuh Fasisme di belakang kami, masa Hongaria telah berakhir."
 CZE_deliver_sudetenland: "Kirimkan Sudetenland"
 CZE_deliver_sudetenland_desc: "Jerman menginginkan orang Jerman kita. Tampaknya jika kita ingin menghindari perang, satu-satunya cara adalah dengan menyerahkan Sudetenland."
 CZE_german_technology: "Teknologi Jerman"
 CZE_german_technology_desc: "Dengan terjaminnya hubungan damai antara kedua negara, ada anggapan bahwa pertukaran teknologi dapat menguntungkan kedua belah pihak."
 CZE_trust_in_the_west: "Percaya pada Barat"
 CZE_trust_in_the_west_desc: "Prancis dan Inggris akan melindungi perdamaian di Eropa. Lagi pula, mereka tidak memenangkan Perang Besar hanya untuk membiarkan Jerman mengancam dan memecah belah negara-negara berdaulat dua puluh tahun kemudian!"
 CZE_doctrinal_innovation: "Inovasi Doktrinal"
 CZE_doctrinal_innovation_desc: "Kami telah belajar banyak dari pertukaran perwira dan sesi strategi dengan sekutu kami. Menggabungkan sudut pandang yang berbeda-beda telah menempatkan kita di ambang terobosan."
 CZE_bonus_research_slot_2: "Tim Berbagi Pengetahuan"
 CZE_bonus_research_slot_2_desc: "Pertukaran pengetahuan yang dilakukan oleh Sekutu telah memberikan manfaat yang begitu besar sehingga kini telah diusulkan sebagai lembaga permanen."
 CZE_secret_weapons: "Senjata Rahasia"
 CZE_secret_weapons_desc: "Masa depan peperangan Ceko terletak pada penguasaan berbagai teknologi canggih dan menggunakannya untuk keuntungan terbaik kita."
 CZE_nukes: "Senjata Nuklir"
 CZE_nukes_desc: "Masa depan peperangan Ceko terletak pada penguasaan kekuatan atom yang terbelah!"
 CZE_an_entente_of_our_own: "Sebuah Entente Milik Kita"
 CZE_an_entente_of_our_own_desc: "Entente Kecil telah runtuh dalam beberapa tahun terakhir, namun masih bisa bangkit kembali jika mantan sekutu kita bersedia."
 CZE_invite_yugoslavia: "Undang Yugoslavia"
 CZE_invite_yugoslavia_desc: "Undang Yugoslavia ke Entente."
 CZE_invite_romania: "Undang Rumania"
 CZE_invite_romania_desc: "Undang Rumania ke Entente."
 CZE_faction_tech_sharing: "Pakta Organisasi"
 CZE_faction_tech_sharing_desc: "Agar dapat bekerja sama dengan baik, pasukan Entente harus diperlengkapi pada tingkat yang sama. Untuk mencapai hal ini, kami mengusulkan agar semua anggota faksi kami bebas berbagi teknologi satu sama lain."
 CZE_security_council: "Dewan Keamanan Bersama"
 CZE_security_council_desc: "Dewan keamanan Entente akan memastikan bahwa semua anggota terkoordinasi ketika operasi militer gabungan direncanakan."
 CZE_deal_with_hungary: "Hilangkan Ancaman Hongaria"
 CZE_deal_with_hungary_desc: "Ketika perdamaian di seluruh Eropa runtuh, Entente tidak bisa membiarkan Hongaria menjadi ancaman lagi. Hanya solusi permanen yang bisa membuat kita fokus pada permasalahan yang lebih besar."
 CZE_deal_with_bulgaria: "Larutkan Bulgaria"
 CZE_deal_with_bulgaria_desc: "Bulgaria telah mempersenjatai kembali dan kembali mengancam keamanan Balkan. Ini adalah ancaman yang tidak dapat ditoleransi jika Entente ingin fokus pada konflik umum di Eropa."
 CZE_rapprochement_with_hungary: "Pemulihan Hubungan Dengan Hongaria"
 CZE_rapprochement_with_hungary_desc: "Iridentisme Hongaria selalu menjadi ancaman, namun mungkin ada upaya terakhir yang dapat dilakukan untuk menyelesaikan masalah ini secara damai?"
 CZE_czechoslovak_legion: "Legiun Cekoslowakia"
 CZE_czechoslovak_legion_desc: "Legiun Cekoslowakia berperang di seluruh Eropa selama Perang Besar, dan jauh di dalam wilayah Rusia selama perang saudara. Kini, ketika konflik menyebar ke seluruh Eropa, Legiun mungkin akan kembali bergerak."
 CZE_military_research_institute: "Institut Teknis Militer"
 CZE_military_research_institute_desc: "Institut Teknis Militer hadir untuk membekali angkatan bersenjata Cekoslowakia dengan kemampuan penelitian, pengembangan, dan pengujian militer."
 CZE_mountain_bonus: "Pasukan Gunung"
 CZE_mountain_bonus_desc: "Ketika sebagian besar wilayah perbatasan kita terdiri dari perbukitan dan pegunungan, kebutuhan akan tentara khusus untuk mengawasi dan mempertahankan wilayah tersebut sangatlah jelas."
 CZE_inf_and_artillery_advancement: "Kemajuan Infanteri"
 CZE_inf_and_artillery_advancement_desc: "Infanteri adalah unit terpenting dalam angkatan bersenjata kita, jadi meningkatkan persenjataan mereka merupakan langkah penting menuju keberhasilan pertahanan negara."
 CZE_support_bonus: "Unit Pendukung"
 CZE_support_bonus_desc: "Agar infanteri kita dapat bekerja dengan efisiensi puncak, cabang pendukungnya juga harus dimodernisasi."
 CZE_inf_and_artillery_advancement_2: "Kemajuan Artileri"
 CZE_inf_and_artillery_advancement_2_desc: "Ratu medan perang, artileri modern akan menjadi pengganda kekuatan yang besar dalam pasukan kita."
 CZE_doctrine_bonus: "Penemuan Ajaran"
 CZE_doctrine_bonus_desc: "Senjata saja tidak membuat suatu angkatan bersenjata kuat, doktrin yang efektif juga diperlukan. Institut Teknik Militer sangat menyadari hal ini dan telah memberikan beberapa saran."
 CZE_motorization_scheme: "Skema Motorisasi"
 CZE_motorization_scheme_desc: "Meskipun kita tidak mempunyai pasukan terbesar, motorisasi menawarkan kemungkinan untuk mengkonsentrasikan pasukan kita dengan lebih cepat di suatu wilayah."
 CZE_armour_bonus_1: "LT vz. 38"
 CZE_armour_bonus_1_desc: "Tentara kita mempunyai beberapa tank tercanggih di dunia, namun teknologi di bidang ini berkembang pesat dan kita tidak boleh ketinggalan."
 CZE_mechanization: "Mekanisasi"
 CZE_mechanization_desc: "Sementara motorisasi memberi prajurit kita kecepatan, mekanisasi memberi mereka kecepatan, perlindungan, dan daya tembak."
 CZE_armour_bonus_ii: "Modernisasi Armor"
 CZE_armour_bonus_ii_desc: "Institut Teknis Militer terus bekerja sama dengan Skoda Works untuk merancang tank baru dan lebih baik."
 CZE_doctrine_bonus_2: "Peperangan Inovatif"
 CZE_doctrine_bonus_2_desc: "Senjata saja tidak membuat suatu angkatan bersenjata menjadi kuat, doktrin yang efektif juga diperlukan. Institut Teknik Militer sangat menyadari hal ini dan telah memberikan beberapa saran."
 CZE_war_college: "Perguruan Tinggi Perang"
 CZE_war_college_desc: "War College membekali tentara kita dengan para pemimpin terlatih yang dibutuhkan untuk memimpin mereka menuju kemenangan."
 CZE_war_college_effect_tt: "§YJika Anda sudah memiliki 5 slot penelitian, Anda tidak akan menerima tambahan.§!"
 CZE_military_aeronautical_institute: "Institut Penerbangan Militer"
 CZE_military_aeronautical_institute_desc: "Institut Penerbangan Militer memberikan proposal penelitian dan desain kepada angkatan udara Cekoslowakia."
 CZE_import_foreign_fighters: "Impor Pesawat Tempur Asing"
 CZE_import_foreign_fighters_desc: "Dengan mengimpor berbagai pesawat tempur asing untuk diuji dan dievaluasi, para perancang pesawat kita sendiri akan mendapatkan pelajaran berharga."
 CZE_light_fighter_focus: "Fokus Petarung Ringan"
 CZE_light_fighter_focus_desc: "Institut Penerbangan Militer telah menyimpulkan bahwa Pesawat Tempur Ringan adalah yang paling berguna dan harus menjadi inti angkatan udara kita."
 CZE_heavy_fighter_focus: "Fokus Petarung Berat"
 CZE_heavy_fighter_focus_desc: "Institut Penerbangan Militer telah menyimpulkan bahwa Pesawat Tempur Berat adalah yang paling berguna dan harus menjadi inti angkatan udara kita."
 CZE_air_is_our_sea: "Udara adalah Laut Kita"
 CZE_air_is_our_sea_desc: "Negara-negara lain bergantung pada angkatan laut untuk melindungi perbatasan mereka dan memproyeksikan kekuatan, bagi kami peran tersebut dipenuhi oleh angkatan udara."
 CZE_rule_the_air: "Kuasai Langit"
 CZE_rule_the_air_desc: "Komitmen kami terhadap angkatan udara telah memungkinkan kami membangun efisiensi produksi yang luar biasa."
 CZE_import_foreign_bombers: "Impor Pesawat Pengebom Asing"
 CZE_import_foreign_bombers_desc: "Dengan mengimpor berbagai pesawat pembom asing untuk diuji dan dievaluasi, perancang pesawat kita sendiri akan mendapatkan pelajaran berharga."
 CZE_cas_focus: "Fokus CAS"
 CZE_cas_focus_desc: "Kesimpulan dari pengujian Institut Penerbangan Militer menunjukkan bahwa kita harus fokus pada pesawat Dukungan Udara Jarak Dekat."
 CZE_tac_focus: "Fokus Pembom Taktis"
 CZE_tac_focus_desc: "Kesimpulan dari pengujian Institut Penerbangan Militer menunjukkan bahwa kita harus fokus pada Pembom Taktis."
 CZE_access_to_the_sea: "Akses ke Laut"
 CZE_access_to_the_sea_desc: "Kita tidak lagi terkurung daratan! Sekarang kita sudah punya garis pantai, kita harus mempelajari masalah kelautan dan membuat rencana untuk membentuk Angkatan Laut."
 CZE_sudden_shipyard: "Galangan Kapal Tiba-tiba"
 CZE_sudden_shipyard_desc: "Angkatan Laut membutuhkan galangan kapal. Kami tidak merencanakan hal ini, namun proyek rekayasa besar bukanlah hal baru bagi kami. Dengan upaya yang tepat, galangan kapal tidak akan memakan waktu sama sekali."
 CZE_shipbuilding_legacy: "Warisan Pembuatan Kapal"
 CZE_shipbuilding_legacy_desc: "Meskipun memiliki angkatan laut sendiri merupakan hal baru, Skoda Works memiliki sejarah panjang dalam membangun komponen untuk kapal angkatan laut Austro-Hungaria. Sekarang mereka dapat menggunakan pengalaman yang sama untuk memproduksi kapal untuk angkatan laut kita sendiri."
 CZE_battleship_catchup_1: "Terobosan Kapal Perang"
 CZE_battleship_catchup_1_desc: "Kebutuhan baru kita akan angkatan laut telah mengakibatkan kebingungan dalam desain Kapal Perang."
 CZE_destroyer_catchup_1: "Terobosan Penghancur"
 CZE_destroyer_catchup_1_desc: "Kebutuhan baru kita akan angkatan laut telah mengakibatkan munculnya desain Destroyer secara tiba-tiba."
 CZE_cruiser__catchup_1: "Terobosan Kapal Penjelajah"
 CZE_cruiser__catchup_1_desc: "Kebutuhan baru kita akan angkatan laut telah mengakibatkan kebingungan dalam desain Cruiser."
 CZE_raiding_focus: "Merampok Fokus"
 CZE_raiding_focus_desc: "Angkatan Laut kita harus fokus pada pendekatan tidak langsung yaitu menghindari pertempuran dan mengganggu pengiriman musuh kita."
 CZE_capital_focus: "Fokus Modal"
 CZE_capital_focus_desc: "Angkatan Laut kita harus fokus pada pertempuran langsung dan menentukan."
 YUG_western_focus: "Fokus Barat"
 YUG_western_focus_desc: "Kunci masa depan Yugoslavia terletak pada kekuatan di Barat, yang lebih dekat secara geografis dan ekonomi dengan negara kita."
 YUG_friendship_treaty_with_italy: "Perjanjian Persahabatan dengan Italia"
 YUG_friendship_treaty_with_italy_desc: "Sebagai tetangga dekat kami yang paling kuat, Italia harus melihat kami sebagai teman. Kami akan memulai negosiasi untuk deklarasi persahabatan antara kedua negara."
 YUG_reinforce_old_alliances: "Perkuat Aliansi Lama"
 YUG_reinforce_old_alliances_desc: "Sejak awal berdirinya negara kami, kami telah menikmati dukungan dari negara-negara demokrasi besar di Eropa, yaitu Perancis dan Inggris. Inilah saatnya memperkuat hubungan ini sebagai persiapan aliansi di masa depan."
 YUG_attract_foreign_capital: "Menarik Modal Asing"
 YUG_attract_foreign_capital_desc: "Kita dapat memanfaatkan hubungan diplomatik yang erat dengan memfasilitasi masuknya modal dan investasi asing."
 YUG_ban_slovene_nationalist_parties: "Larang Partai Nasionalis Slovenia"
 YUG_ban_slovene_nationalist_parties_desc: "Tuntutan kemerdekaan apa pun harus dibasmi demi kebaikan bangsa kita. Unsur-unsur politik nasionalis akan dilarang dan para pendukungnya akan dianiaya karena takut melemahkan kita secara internal."
 YUG_traditional_values: "Nilai-Nilai Tradisional"
 YUG_traditional_values_desc: "Nilai-nilai tradisional, sebagaimana diajarkan oleh agama Ortodoks, merupakan landasan utama masyarakat kita. Mempromosikan hal ini tidak hanya akan memberi kita dukungan dari Gereja Ortodoks, namun juga menyatukan umat kita."
 YUG_greater_yugoslavia: "Yugoslavia Raya"
 YUG_greater_yugoslavia_desc: "Kami tidak bisa beristirahat sampai semua orang Slavia selatan bersatu di bawah panji kami. Orang-orang Bulgaria mungkin tidak menganggap diri mereka sebagai bagian dari negara kita, tapi kita tentu saja menganggapnya sebagai bagian dari negara kita."
 YUG_all_yugoslavian_regiments: "Resimen Seluruh Yugoslavia"
 YUG_all_yugoslavian_regiments_desc: "Meskipun masyarakat kita berbeda-beda, semuanya harus bertugas membela negara kita. Kami tidak akan membeda-bedakan etnis ketika mengorganisir resimen kami."
 YUG_crush_the_ustasa: "Hancurkan Ustasa tersebut"
 YUG_crush_the_ustasa_desc: "Gerakan ultra-nasionalis Kroasia, Ustasa, semakin menjadi duri di pihak kita. Organisasi ini tidak bisa lagi dianggap sebagai organisasi teroris, dan harus diberantas demi kebaikan bangsa."
 YUG_invite_german_military_mission: "Undang Misi Militer Jerman"
 YUG_invite_german_military_mission_desc: "Ketidaksukaan militer kita terhadap Jerman harus diatasi. Mengundang misi militer akan menunjukkan kepada para petinggi kita bahwa ada banyak manfaat dalam kerja sama."
 YUG_join_axis: "Menandatangani Pakta Tripartit"
 YUG_join_axis_desc: "Meskipun banyak yang berharap agar Yugoslavia bergabung dengan Sekutu dan melawan fasisme, kami tahu bahwa ambisi ini tidak ada harapan dan hanya akan berakhir dengan perang dan kekacauan. Kita telah diberi kesempatan untuk bergabung dengan Jerman, Italia, dan Jepang dalam pakta kerja sama militer dan ekonomi yang saling menguntungkan dan kita harus segera memanfaatkan hal ini."
 YUG_invite_italian_naval_experts: "Undang Pakar Angkatan Laut Italia"
 YUG_invite_italian_naval_experts_desc: "Sekutu kami di Mediterania memiliki pengetahuan unggul dalam desain dan konstruksi kapal. Kami akan mengundang pakar Italia untuk mewariskan ilmunya kepada kami."
 YUG_limited_self_government: "Pemerintahan Sendiri yang Terbatas"
 YUG_limited_self_government_desc: "Perpecahan di negara kita jelas terlalu dalam dan terlalu banyak untuk diatasi dengan reformasi sederhana. Hanya dengan memberikan otonomi kepada berbagai bangsa yang membentuk bangsa kita, kita dapat mempertahankan kesatuan kita tanpa menggunakan kekerasan."
 YUG_guarantee_religious_liberties: "Menjamin Kebebasan Beragama"
 YUG_guarantee_religious_liberties_desc: "Semua orang harus diizinkan untuk mengikuti agama pilihan mereka. Kami akan memberikan jaminan hukum terhadap hal ini."
 YUG_local_militias: "Milisi Lokal"
 YUG_local_militias_desc: "Masyarakat akan didorong untuk membentuk milisi untuk mempertahankan tanah airnya. Hal ini akan memungkinkan sebagian besar masyarakat memenuhi syarat untuk direkrut menjadi dinas militer di kemudian hari."
 YUG_concessions_for_macedonians: "Konsesi untuk orang Makedonia"
 YUG_concessions_for_macedonians_desc: "Dengan menjangkau kelompok-kelompok terkemuka masyarakat Makedonia, kami akan mengatasi keluhan mereka dan mendapatkan loyalitas mereka kepada negara."
 YUG_establish_the_banovina_of_croatia: "Dirikan Banovina Kroasia"
 YUG_establish_the_banovina_of_croatia_desc: "Dengan membentuk Banate Kroasia yang semi-otonom, kita diharapkan dapat meredam tuntutan kemerdekaan sejati."
 YUG_non_discriminating_officer_promotions: "Promosi Pejabat yang Tidak Diskriminatif"
 YUG_non_discriminating_officer_promotions_desc: "Kebijakan kami yang diskriminatif harus dibatalkan, dan mulai sekarang semua etnis harus diizinkan untuk naik pangkat di korps perwira kami. Hal ini akan memungkinkan kita memperoleh kepemimpinan militer paling cakap."
 YUG_join_allies: "Aliansi Kerajaan"
 YUG_royal_alliance_tt: "Kami akan mencoba untuk bergabung dengan faksi pasangan pernikahan kerajaan kami.\nJika pasangan kami adalah Putri Alexandra, kami akan mencoba untuk bergabung dengan Sekutu."
 carlist_text: "Carlist"
 YUG_join_allies_desc: "Sekarang Raja kita telah menikah dengan bahagia, kita harus menyatakan kesetiaan kita kepada publik, sehingga kita dapat mengandalkan kekuatan militer mereka jika kita menjadi sasaran tetangga kita."
 YUG_reclaim_istria_and_zadar: "Rebut kembali Istria dan Zadar"
 YUG_reclaim_istria_and_zadar_desc: "Italia masih menguasai wilayah Istria dan Zadar. Sudah waktunya untuk membawa mereka pulang."
 YUG_claim_macedonia: "Klaim Makedonia"
 YUG_claim_macedonia_desc: "Beberapa wilayah Makedonia masih berada di luar perbatasan kami. Karena semua orang Makedonia adalah budak, mereka termasuk dalam negara kami."
 YUG_allied_air_combat_school: "Sekolah Tempur Udara Sekutu"
 YUG_allied_air_combat_school_desc: "Sekutu baru kami memiliki pengalaman luas dalam pertempuran udara. Dengan mendorong dibangunnya Sekolah Tempur Udara Sekutu, kami dapat memastikan para pilot yang kami rekrut secara bebas diberi pelajaran berharga yang telah dipelajari oleh sekutu kami."
 YUG_recognize_the_soviet_union: "Kenali Uni Soviet"
 YUG_recognize_the_soviet_union_desc: "Meskipun kita secara historis menolak mengakui negara Bolshevik di Timur, mungkin sudah tiba waktunya bagi kita untuk mempertimbangkan kembali pendirian kita mengenai masalah ini. Walaupun negara-negara demokrasi Barat tampak terlalu lemah untuk membela negara-negara kecil, Uni Soviet mungkin bisa menjadi teman yang lebih bisa diandalkan."
 YUG_form_peasant_councils: "Bentuk Dewan Tani"
 YUG_form_peasant_councils_desc: "Pekerja harus mendapatkan kehadiran yang lebih besar dalam politik lokal. Membentuk dewan tani akan sangat membantu agar suara mereka didengar."
 YUG_mutual_economic_aid: "Bantuan Ekonomi Bersama"
 YUG_mutual_economic_aid_desc: "Uni Soviet dan Yugoslavia mempunyai banyak hal yang bisa ditawarkan satu sama lain secara ekonomi. Dengan membuat perjanjian perdagangan yang menguntungkan dan pengaturan bantuan ekonomi, kita bisa mendapatkan keuntungan besar satu sama lain."
 YUG_abolish_the_monarchy: "Hapuskan Monarki"
 YUG_abolish_the_monarchy_desc: "Monarki bukanlah bentuk pemerintahan yang cocok untuk zaman modern, apalagi sepenuhnya tidak sesuai dengan pandangan masyarakat kita. Hal ini harus dihapuskan, dan pemerintahan kerajaan diganti dengan suara rakyat jelata."
 YUG_join_comintern: "Bergabunglah dengan Komintern"
 YUG_join_comintern_desc: "Jalan terbaik menuju kemajuan Revolusi adalah dengan berdiri bersama dengan negara-negara komunis di Komintern."
 YUG_yugoslavian_path_to_communism: "Jalan Yugoslavia Menuju Komunisme"
 YUG_yugoslavian_path_to_communism_desc: "Kami tidak memerlukan panduan dalam perjuangan kami demi perjuangan buruh. Kami akan mengumpulkan mereka yang menerima kepemimpinan kami, dan bersama-sama menyebarkan Revolusi versi kami."
 YUG_form_the_federal_republic: "Bentuk Republik Federal"
 YUG_form_the_federal_republic_desc: "Waktunya telah tiba untuk membentuk negara federalis sejati di mana semua anggotanya diterima dengan baik. Negara yang terfragmentasi secara internal seperti yang kita alami dalam beberapa dekade terakhir tidak akan ada lagi."
 YUG_pan_slavic_workers_congress: "Kongres Pekerja Pan-Slavia"
 YUG_pan_slavic_workers_congress_desc: "Kaum buruh Slavia harus bersatu untuk memperjuangkan perjuangan mereka, dan karena Uni Soviet tidak memahami penderitaan buruh di Balkan, maka kita sendirilah yang akan mengambil alih kepemimpinan."
 YUG_research_collaboration: "Kolaborasi Penelitian"
 YUG_research_collaboration_desc: "Sekutu kita mempunyai sumber daya yang jauh lebih besar dibandingkan kita, jadi kita harus mendorong kolaborasi penelitian yang memungkinkan kita berbagi terobosan teknologi mereka."
 YUG_federal_defense_council: "Dewan Pertahanan Federal"
 YUG_federal_defense_council_desc: "Semua daerah harus bersuara dalam membela bangsa kita yang besar ini. Hal ini akan sangat membantu dalam memastikan bahwa sebanyak mungkin suara didengar, dan bahwa diskriminasi tidak akan menghambat manfaat jika hal tersebut masih dalam tahap awal."
 YUG_invite_bulgaria: "Undang Bulgaria"
 YUG_invite_bulgaria_desc: "Saudara-saudara kita di Bulgaria membutuhkan kepemimpinan kita untuk menemukan jalan menuju Komunisme. Lebih jauh lagi, ketika mereka menduduki sisi timur kita, menyatukan mereka akan membuat kita tidak lagi mengkhawatirkan sebagian besar wilayah perbatasan kita, dan kekuatan militer mereka akan sangat berguna dalam menyebarkan Revolusi."
 YUG_pan_balkan_workers_congress: "Inisiatif Pan-Balkan"
 YUG_pan_balkan_workers_congress_desc: "Meskipun kita telah mendapatkan cita-cita sosialisme di negara-negara tetangga kita di Selatan, ada banyak sekali orang yang menderita di bawah kediktatoran monarki dan borjuis di seluruh Balkan. Hanya dengan membebaskan para pekerja di Rumania, Hongaria, dan Yunani kita dapat mengatakan bahwa kita telah membebaskan para pekerja di Balkan."
 YUG_invite_albania: "Undang Albania"
 YUG_invite_albania_desc: "Albania menguasai wilayah yang, meskipun kecil, memiliki kepentingan strategis bagi kami. Dengan memasukkan mereka ke dalam Kongres, kita dapat mengamankan sebagian besar perbatasan selatan kita, sambil menambah kekuatan mereka pada perbatasan kita."
 YUG_invite_greece: "Undang Yunani"
 YUG_invite_greece_desc: "Laki-laki dan perempuan muda di Yunani menderita di bawah sepatu besi tuan mereka dan hanya dengan mempersenjatai mereka yang miskin dan tertindas kita dapat memutus rantai yang mengikat mereka."
 YUG_invite_romania: "Undang Rumania"
 YUG_invite_romania_desc: "Masyarakat Rumania hidup dalam masyarakat aristokrat yang telah menyaksikan dampak buruk yang ditimbulkan oleh aristokrasi dan kapitalisme terhadap suatu negara. Mereka tidak akan lagi menderita di bawah tangan raja-raja mereka yang korup; mereka akan menjadi tuan atas nasib mereka sendiri!"
 YUG_invite_hungary: "Undang Hongaria"
 YUG_invite_hungary_desc: "Negara Hongaria berada dalam ketidakpastian dan pergeseran sejak runtuhnya monarki Habsburg. Dengan bantuan kami, rakyat Hongaria akan menemukan bentuk negara mereka yang sebenarnya dalam kediktatoran komunis yang bersatu!"
 YUG_invite_turkey: "Undang Turki"
 YUG_invite_turkey_desc: "Rakyat Turki telah terbebas dari Khalifah mereka lebih dari satu dekade yang lalu, namun mereka masih belum terbebas dari tuan-tuan borjuis mereka. Meskipun Partai Rakyat Republik Turki mengklaim sebagai \"sosial-demokrasi\", pada kenyataannya, mereka telah gagal untuk memutus rantai rakyat mereka dan hanya dengan intervensi langsung Yugoslavia kita dapat benar-benar membebaskan semua pekerja di Balkan."
 YUG_united_autonomous_croatia: "Kroasia Otonomi Bersatu"
 YUG_united_autonomous_croatia_desc: "Menyatukan Banovina Kroasia menjadi negara otonom telah lama menjadi usulan solusi terhadap meningkatnya separatisme Kroasia. Dengan memberikan otonomi pada Kroasia, kita bisa menjadi sekutu yang kuat dari musuh potensial kita."
 YUG_devolved_croatia: "Kroasia yang Devolusi"
 YUG_devolved_croatia_desc: "Dalam menentang serikat pekerja, tidak ada yang lebih vokal daripada orang Kroasia. Saat ini, Kroasia terbagi antara Banate of Sava di utara, dan Banate of Littoral di selatan. Jika kita memberikan otonomi individu kepada Banates, kita dapat menenangkan oposisi Kroasia dan mencegah orang-orang Kroasia menjadi terlalu berpengaruh dalam serikat pekerja."
 YUG_safeguard_bosnia: "Lindungi Bosnia"
 YUG_safeguard_bosnia_desc: "Ada banyak negara di perbatasan kami yang ingin melihat rakyat Bosnia diduduki dan ditindas. Kita tidak boleh membiarkan hal ini terjadi dan masyarakat Bosnia dan Herzegovina harus didukung dalam segala upaya mempersenjatai dan melakukan industrialisasi."
 YUG_divide_bosnia: "Bagilah Bosnia"
 YUG_divide_bosnia_desc: "Terdapat kesenjangan budaya dan agama di seluruh wilayah Bosnia; Serbia, Kroasia, Muslim, Kristen, dan banyak negara lainnya. Satu-satunya cara agar wilayah ini dapat dipertahankan dengan baik adalah jika wilayah tersebut dipartisi secara tepat antara negara-negara Bosnia dan Herzegovina yang bekerja selaras dengan persatuan kita."
 YUG_dissolve_serbia: "Larutkan Banate Serbia"
 YUG_dissolve_serbia_desc: "Wilayah yang kami anggap \"Serbia\" sebenarnya adalah rumah bagi banyak orang yang tidak menganggap diri mereka orang Serbia. Orang Makedonia, Albania, dan Montenegro semuanya mendiami wilayah yang kami klaim sebagai wilayah Serbia. Kita tidak boleh membiarkan diri kita dianggap sebagai penjajah budaya mereka dan kita harus memikirkan kembali apa yang kita anggap sebagai hak orang Serbia."
 YUG_banat_for_support: "Banat untuk Dukungan"
 YUG_banat_for_support_desc: "Bukan rahasia lagi bahwa Hongaria dan Rumania berusaha mencaplok Serbia bagian utara dan dengan kurangnya dukungan asing terhadap negara kami, kami dapat menyerahkan wilayah-wilayah ini dengan imbalan pengakuan dan dukungan tertentu."
 YUG_autonomous_transylvania: "Otonomi untuk Transilvania Slavia"
 YUG_autonomous_transylvania_desc: "Wilayah Banat dan Vojvodina tidak hanya dihuni oleh orang Serbia, tetapi juga orang Rumania dan Hongaria. Dengan menawarkan otonomi dan pemerintahan mandiri kepada wilayah-wilayah ini, kita dapat mengakhiri klaim Rumania dan Hongaria atas wilayah-wilayah tersebut."
 YUG_fortify_banat: "Membentengi Banat"
 YUG_fortify_banat_desc: "Orang-orang Hongaria dan Rumania semakin dekat dengan musuh-musuh kita. Benteng yang cepat di wilayah utara diperlukan jika kita ingin melindungi Serbia dan protektorat otonomnya."
 YUG_evolution: "Evolusi"
 YUG_evolution_desc: "Meskipun beberapa orang berpendapat bahwa negara kita merupakan kesatuan yang tidak stabil dari berbagai budaya yang hidup dalam permusuhan, kita tahu pasti bahwa hanya dengan berdiri bersama sebagai satu kesatuan kita akan mampu mengusir penjajah asing. Kita harus mengambil upaya untuk menyatukan rakyat kita dan menghancurkan mereka yang berusaha memecah belah kita."
 YUG_slovenia_for_support: "Slovenia untuk Dukungan"
 YUG_slovenia_for_support_desc: "Kekuatan Poros telah merancang untuk membagi negara kita di antara mereka sendiri. Mungkin dengan menyerahkan Slovenia ke Italia, kita bisa menghilangkan elemen-elemen yang mengganggu di Slovenia dan menunjukkan keramahan kita terhadap perjuangan Poros."
 YUG_surrender_macedonia: "Menyerahkan Makedonia"
 YUG_surrender_macedonia_desc: "Bulgaria juga punya alasan untuk menyaingi kami; mengklaim wilayah selatan Serbia dan Makedonia untuk diri mereka sendiri. Dengan menyerahkan klaim mereka kepada mereka, kami akan membungkam ancaman di perbatasan selatan kami dan menjadikan nasionalisme Makedonia sebagai masalah Bulgaria."
 YUG_zara_for_axis: "Zara untuk Keanggotaan Axis"
 YUG_zara_for_axis_desc: "Pihak Italia mengklaim bahwa pemerintah di Zara adalah pengendali sah Dalmatia, namun mungkin dengan meyakinkan pihak Italia bahwa kami berjuang untuk tujuan yang sama, mereka mungkin bersedia menyerahkan Zara kembali kepada kami dan meninggalkan ambisi mereka di Balkan, setidaknya untuk saat ini."
 YUG_surrender_italian_claims: "Menyerahkan Klaim Italia"
 YUG_surrender_italian_claims_desc: "Zara dan Istria tetap berada di tangan Italia, namun kami tidak dapat mengambil risiko memperburuk [ITA.GetLeader] dengan terus bersikeras bahwa mereka adalah hak kami. Mungkin kita bisa masuk ke Poros dengan imbalan menyerahkan klaim di luar perbatasan kita."
 YUG_end_the_regency: "Akhiri Kabupaten"
 YUG_end_the_regency_desc: "Pangeran Paul telah menjalankan tugasnya cukup lama. Dengan perang yang akan segera terjadi, rakyat kita perlu melihat Raja mereka berdiri teguh melawan kaum fasis dan komunis yang akan menghancurkan bangsa kita."
 YUG_coronation: "Penobatan"
 YUG_coronation_desc: "Rakyat kita telah lama tidak memiliki Raja, dan inilah saatnya kita menunjukkan kelanggengan mahkota tersebut. Dengan menobatkan Raja kami di katedral Kota Putih, kami akan memberikan jaminan kepada rakyat kami bahwa mahkota itu abadi dan kami tidak akan jatuh ke tangan penjajah asing."
 YUG_royal_wedding: "Pernikahan Kerajaan"
 YUG_royal_wedding_desc: "Pernikahan kerajaan telah lama menjadi cara untuk menjalin aliansi, dan dengan banyaknya putri bergengsi yang tidak memiliki seorang Raja, Raja Peter muda yang memenuhi syarat dapat mengamankan aliansi dengan kekuatan dunia."
 YUG_enforced_neutrality: "Menegakkan Netralitas Yugoslavia"
 YUG_enforced_neutrality_desc: "Kita tidak bisa membiarkan Balkan menjadi bagian dari konflik global yang memanas ini. Kita harus menyatakan netralitas kita dan menghindari tindakan apa pun yang dapat menyelaraskan kita dengan kekuatan dunia yang sedang bertikai."
 YUG_fortress_yugoslavia: "Benteng Yugoslavia"
 YUG_fortress_yugoslavia_desc: "Kita tidak bisa membiarkan ancaman Nazi di perbatasan kita tidak terkendali! Dengan adanya orang Italia di Zara dan orang Jerman di Austria, kita harus memastikan bahwa perbatasan kita dilindungi dan tentara di sana mempunyai semua yang mereka butuhkan untuk melawan fasis."
 YUG_ban_fascists: "Larang Partai Fasis"
 YUG_ban_fascists_desc: "Bahkan sekarang, ada partai-partai di negara kita yang menempatkan satu budaya di atas budaya lainnya dan mencari dominasi di Uni Yugoslavia. Orang-orang ini tidak mempunyai tempat di negara kita dan harus dibungkam."
 YUG_towards_independence: "Menuju Kemerdekaan"
 YUG_towards_independence_desc: "Kini setelah kita membubarkan serikat pekerja menjadi beberapa negara otonom, kita harus mengambil langkah berikutnya; kemerdekaan. Kita tidak bisa lagi memerintah sebagai diktator atas sesama kita, kita harus mempercayai mereka untuk memerintah diri mereka sendiri, bebas dari intervensi Serbia."
 YUG_defence_army_of_yugoslavia: "Tentara Pertahanan Yugoslavia"
 YUG_defence_army_of_yugoslavia_desc: "Memperjuangkan persatuan kita adalah hal yang sulit untuk diminta dari warga negara pada umumnya, namun memperjuangkan rumah sendiri adalah tugas setiap orang. Dengan janji kemerdekaan yang sudah di depan mata, persatuan kita dipenuhi dengan orang-orang yang bersedia melawan musuh kita; yang mereka butuhkan hanyalah dukungan pemerintah."
 YUG_defence_league: "Liga Pertahanan Yugoslavia"
 YUG_defence_league_desc: "Anggota negara kita telah diberikan otonomi yang besar; yang tersisa hanyalah langkah terakhir. Dengan secara resmi mengakui kemerdekaan seluruh negara Balkan, kita akan mengubah Yugoslavia dari sebuah negara menjadi sebuah koperasi ekonomi dan militer yang terdiri dari banyak negara."
 YUG_united_kingdom: "Sebuah Britania Raya"
 YUG_united_kingdom_desc: "Kini setelah rakyat kita mempunyai kesempatan untuk merasakan kemerdekaan dan merasa terwakili dengan baik dalam serikat kita, inilah saatnya kita mengambil langkah-langkah untuk menciptakan rasa pan-nasionalisme dan persatuan yang sangat kurang di negara kita sebelumnya."
 YUG_reunite_the_kingdom: "Menyatukan kembali Kerajaan"
 YUG_reunite_the_kingdom_desc: "Meskipun banyak yang khawatir tindakan ini berisiko kembali menjadi perpecahan dan konflik budaya yang menjadi ciri khas Yugoslavia, kita harus menyatukan kembali bangsa kita menjadi satu kesatuan untuk menghadapi ancaman yang lebih besar di perbatasan kita."
 YUG_attract_allied_capital: "Menarik Modal Sekutu"
 YUG_attract_allied_capital_desc: "Inggris punya alasan untuk mendukung bangsa kita; kita telah lama menjadi sekutu sejak sebelum Perang Besar pertama, dan dengan menarik investor dari negara-negara Sekutu, kita akan meyakinkan mereka bahwa hubungan antar negara kita tidak dapat dipisahkan."
 YUG_attract_axis_capital: "Menarik Modal Poros"
 YUG_attract_axis_capital_desc: "Perekonomian kita berada dalam kondisi yang menyedihkan dan meskipun kita tahu bukan rahasia lagi bahwa orang Italia mempunyai ambisi di negara kita, kita harus mendorong perdagangan dengan tetangga kita jika kita ingin siap secara ekonomi untuk melawan mereka."
 YUG_industrialization_program: "Program Industrialisasi"
 YUG_industrialization_program_desc: "Program industrialisasi yang cepat diperlukan jika kita ingin mengimbangi program persenjataan tetangga kita."
 YUG_expand_the_mining_industry: "Memperluas Industri Pertambangan"
 YUG_expand_the_mining_industry_desc: "Kita memerlukan sumber daya yang cukup untuk mengisi bahan bakar mesin perang kita yang sedang berkembang. Kita harus berupaya mengembangkan industri pertambangan dalam negeri."
 YUG_rare_minerals_exploitation: "Eksploitasi Mineral Langka"
 YUG_rare_minerals_exploitation_desc: "Deposit logam langka yang sebelumnya belum dieksploitasi tiba-tiba menjadi sangat penting. Kita harus segera membangun tambang dan infrastruktur yang diperlukan untuk memanfaatkannya."
 YUG_exploit_the_pannonian_deposits: "Memanfaatkan Deposit Pannonia"
 YUG_exploit_the_pannonian_deposits_desc: "Kita harus mengeksploitasi cadangan minyak yang ada di wilayah kita. Meskipun jumlahnya sedikit, kami membutuhkan semua yang bisa kami dapatkan untuk mesin perang kami."
 YUG_develop_civilian_industry: "Mengembangkan Industri Sipil"
 YUG_develop_civilian_industry_desc: "Industri sipil kita harus mengimbangi industri militer, dengan memasok mesin dan kebutuhan penting lainnya."
 YUG_integrated_rail_network: "Jaringan Kereta Api Terintegrasi"
 YUG_integrated_rail_network_desc: "Kita harus memperluas jaringan kereta api nasional di seluruh pelosok tanah air secara merata. Tidak ada bagian bangsa kita yang lebih penting dari bagian lainnya."
 YUG_improve_light_industry: "Meningkatkan Industri Ringan"
 YUG_improve_light_industry_desc: "Kita sudah mengalami keresahan internal, maka tidak ada gunanya membiarkan industri ringan tertinggal, sehingga masyarakat kehilangan kebutuhan pokok yang mereka perlukan dalam kehidupan sehari-hari."
 YUG_develop_slovenian_industry: "Mengembangkan Industri Slovenia"
 YUG_develop_slovenian_industry_desc: "Meski sudah lama terbengkalai, Slovenia memiliki banyak ruang untuk menciptakan pusat industri baru. Hal ini selanjutnya akan sangat menyenangkan hati orang Slovenia."
 YUG_local_self_management: "Pengelolaan Mandiri Lokal"
 YUG_local_self_management_desc: "Memungkinkan peningkatan pengelolaan mandiri lokal akan meningkatkan penggunaan sumber daya lokal dan efisiensi proyek konstruksi baru."
 YUG_expand_the_university_of_ljubljana: "Perluas Universitas Ljubljana"
 YUG_expand_the_university_of_ljubljana_desc: "Dengan memperluas universitas kami di Slovenia, kami akan memiliki satu institusi lagi untuk mendidik masyarakat kami."
 YUG_develop_military_industry: "Mengembangkan Industri Militer"
 YUG_develop_military_industry_desc: "Militer modern memerlukan basis industri berat untuk mendukung produksi pesawat baru yang diperlukan."
 YUG_improve_serbian_rail_network: "Tingkatkan Jaringan Kereta Api Serbia"
 YUG_improve_serbian_rail_network_desc: "Kita bisa mengabaikan pembangunan jaringan kereta api di provinsi-provinsi terpencil. Daerah yang paling penting adalah bagian tengah dan timur."
 YUG_serbian_steel: "Baja Serbia"
 YUG_serbian_steel_desc: "Kita harus memulai produksi baja di Serbia. Kami selalu membutuhkan lebih banyak untuk upaya perang."
 YUG_expand_the_university_of_belgrad: "Perluas Universitas Beograd"
 YUG_expand_the_university_of_belgrad_desc: "Dengan memperluas universitas kami yang paling bergengsi, kami dapat meningkatkan masuknya orang-orang cerdas ke dalam tim penelitian dan pengembangan kami."
 YUG_expand_the_university_of_zagreb: "Perluas Universitas Zagreb"
 YUG_expand_the_university_of_zagreb_desc: "Universitas Zagreb yang lama telah lama menjadi salah satu institusi pendidikan tinggi terkemuka. Pendanaan tambahan juga akan memungkinkannya untuk menyediakan penelitian yang berharga."
 YUG_central_management: "Manajemen Pusat"
 YUG_central_management_desc: "Kontrol pusat yang kuat atas seluruh aspek manajemen akan meningkatkan kemampuan kami dalam mempertahankan kuota produksi."
 YUG_expand_the_sarajevo_arsenals: "Perluas Gudang Senjata Sarajevo"
 YUG_expand_the_sarajevo_arsenals_desc: "Kita memerlukan lebih banyak kapasitas produksi untuk memenuhi kebutuhan militer kita yang terus meningkat. Persenjataan Sarajevo adalah kandidat utama untuk ekspansi, jadi kami akan segera mengalokasikan sumber daya."
 YUG_modernize_the_air_force: "Modernisasi Angkatan Udara"
 YUG_modernize_the_air_force_desc: "Angkatan udara kita sudah sangat ketinggalan jaman. Jika kita ingin mempunyai peluang yang masuk akal untuk mempertahankan wilayah udara di atas wilayah kita sendiri, apalagi melawan musuh, kita memerlukan program modernisasi yang drastis."
 YUG_local_developers: "Pengembang Lokal"
 YUG_local_developers_desc: "Kita harus meningkatkan dukungan terhadap pengembangan pesawat terbang lokal, sehingga memberikan kita kendali yang lebih besar terhadap model pesawat yang dihasilkan dan memberikan stimulus bagi industri kita."
 YUG_ikarus: "Ikarus"
 YUG_ikarus_desc: "Industri pesawat terbang tertua kami, pabrik Ikarus di Novi Sad harus diperluas untuk mempersiapkan peningkatan produksi yang diperlukan untuk angkatan udara baru kami."
 YUG_designer_tt: "Membuka kunci perusahaan ini sebagai perancang pesawat."
 YUG_rogozarski: "Rogozarski"
 YUG_rogozarski_desc: "Didirikan tak lama setelah Ikarus, 'Pabrik Pesawat Serbia Pertama Zivojin Rogozarski' memerlukan perluasan jika ingin memenuhi permintaan produksi saat ini."
 YUG_zmaj: "bagus"
 YUG_zmaj_desc: "Bengkel pesawat Zmaj di Beograd harus dialokasikan area baru untuk diperluas. Meskipun lebih muda dibandingkan perusahaan kami yang lain, Zmaj memiliki potensi besar untuk memenuhi kebutuhan produksi kami jika diperluas."
 YUG_the_ik_3: "IK-3"
 YUG_the_ik_3_desc: "Bekerja secara rahasia di waktu luang mereka, trio insinyur telah mengajukan proposal luar biasa untuk pengganti pesawat tempur buatan luar negeri yang ada saat ini. Dengan dukungan yang tepat, produksi kemungkinan besar akan segera dapat dilakukan."
 YUG_heavy_fighter_project: "Proyek Pesawat Tempur Berat"
 YUG_heavy_fighter_project_desc: "Pesawat tempur kita harus mampu mendukung pesawat pembom yang lebih rentan. Hal ini memerlukan persenjataan yang lebih berat dan jangkauan yang lebih jauh dengan mengorbankan kecepatan dan kemampuan manuver."
 YUG_bomber_project: "Proyek Pengebom"
 YUG_bomber_project_desc: "Untuk melancarkan perlawanan terhadap musuh kita memerlukan pesawat pengebom. Insinyur kami harus ditugaskan untuk mengembangkan desain domestik baru jenis ini."
 YUG_purchase_foreign: "Beli Asing"
 YUG_purchase_foreign_desc: "Ada negara-negara lain yang telah menghabiskan jauh lebih banyak sumber daya untuk mengembangkan pesawat tempur yang baik dibandingkan yang bisa kita lakukan. Kita harus membeli pesawat mereka daripada melalui proses coba-coba yang melelahkan untuk mengembangkan pesawat kita sendiri."
 YUG_license_production: "Lisensi Produksi"
 YUG_license_production_desc: "Proses perolehan pesawat baru dapat difasilitasi dengan memproduksinya sendiri dan berdasarkan lisensi. Kami akan menyiapkan pengaturan seperti itu sesegera mungkin."
 YUG_fighter_license: "Lisensi Pesawat Tempur"
 YUG_fighter_license_desc: "Kita harus fokus pada produksi pesawat tempur berlisensi untuk angkatan udara kita, karena pesawat pembom tidak ada gunanya tanpa perlindungan pesawat tempur."
 YUG_bomber_license: "Lisensi Pengebom"
 YUG_bomber_license_desc: "Udara membuka kemungkinan baru untuk melakukan perlawanan terhadap musuh, dan oleh karena itu, kita harus memfokuskan semua produksi berlisensi kita pada pesawat pengebom."
 YUG_army_modernization: "Modernisasi Angkatan Darat"
 YUG_army_modernization_desc: "Cara berperang telah berubah sejak konflik terakhir, dan kita harus memastikan bahwa tentara kita mengikuti perkembangan zaman dengan memodernisasi peralatan dan taktiknya."
 YUG_motorize_the_cavalry: "Menggerakkan Kavaleri"
 YUG_motorize_the_cavalry_desc: "Perkembangan baru di bidang teknik otomotif telah merevolusi potensi kecepatan dan mobilitas unit tentara. Unit kavaleri kita harus melepaskan kudanya dan sebagai gantinya dilengkapi dengan truk."
 YUG_motorized_logistics: "Logistik Bermotor"
 YUG_motorized_logistics_desc: "Motorisasi membuka cara-cara baru yang menjanjikan untuk memastikan kebutuhan pokok dan peralatan khusus dapat mengimbangi pasukan garis depan. Hal ini memungkinkan kami memastikan pasukan kami selalu dalam kondisi pertempuran terbaik."
 YUG_armored_cavalry: "Kavaleri Lapis Baja"
 YUG_armored_cavalry_desc: "Menamparkan baju besi pada transportasi pasukan kami sangat meningkatkan kemampuan bertahan hidup, kekuatan bertarung, dan moral mereka. Namun hal ini membutuhkan jenis kendaraan baru yang setidaknya memiliki sebagian lintasan yang dapat membawa beban tambahan tanpa terjebak di medan, sekaligus juga memiliki persenjataan tersendiri."
 YUG_tank_conversions: "Konversi Tangki"
 YUG_tank_conversions_desc: "Meskipun kita mungkin memerlukan tank saat ini, kita mungkin memerlukan artileri self-propelled atau penghancur tank yang menggunakan sasis yang sama pada bulan depan. Peralatan lapis baja kita harus tetap fleksibel dan dapat beradaptasi dengan kebutuhan kita saat ini."
 YUG_modern_tanks: "Tank Modern"
 YUG_modern_tanks_desc: "Melalui penambahan persenjataan utama kaliber besar, teknologi lapis baja telah berkembang jauh melampaui tujuan sederhana untuk mengangkut pasukan dengan aman dari titik A ke titik B. Kita harus mengembangkan tank modern versi kita sendiri agar mampu bersaing dengan negara tetangga kita."
 YUG_tank_licenses: "Lisensi Tangki"
 YUG_tank_licenses_desc: "Daripada menghabiskan sumber daya yang terbatas untuk mengembangkan model tank kita sendiri, kita bisa lebih efisien dengan hanya memproduksi model asing di bawah lisensi."
 YUG_small_arms: "Senjata Kecil"
 YUG_small_arms_desc: "Infanteri adalah tulang punggung pasukan mana pun, dan kita harus memastikan mereka diperlengkapi dengan kemampuan terbaik kita. Kita harus mendorong pengembangan model senjata baru dan modern."
 YUG_domestic_artillery_production: "Produksi Artileri Dalam Negeri"
 YUG_domestic_artillery_production_desc: "Dengan merangsang pengembangan model artileri domestik modern, kita dapat memastikan bahwa pasukan kita mempunyai dukungan tembakan terbaik yang dapat kita berikan."
 YUG_anti_tank_defenses: "Pertahanan Anti-Tank"
 YUG_anti_tank_defenses_desc: "Karena tank telah menjadi pusat perhatian dalam peperangan modern, pengembangan baru diperlukan dalam bidang senjata lapangan anti-tank, sehingga memungkinkan infanteri kita untuk mengalahkan raksasa lapis baja ini."
 YUG_mountain_brigades: "Brigade Gunung"
 YUG_mountain_brigades_desc: "Sebagian besar negara kita terdiri dari pegunungan, sehingga memerlukan pembentukan brigade khusus yang berspesialisasi dalam pertempuran di medan jenis ini."
 YUG_independent_engineer_regiments: "Resimen Insinyur Independen"
 YUG_independent_engineer_regiments_desc: "Mobilitas adalah kunci dalam doktrin militer modern, meskipun kondisi medan tidak selalu memungkinkan hal ini. Resimen insinyur khusus, yang tertanam dalam divisi kami, akan bekerja untuk memfasilitasi pergerakan divisi melalui segala bentuk medan."
 YUG_motorized_recon_companies: "Perusahaan Pengintaian Bermotor"
 YUG_motorized_recon_companies_desc: "Untuk memperoleh informasi yang memadai tentang formasi musuh dan posisi mereka, kami memerlukan pasukan pengintai bermotor yang berdedikasi dan dapat menempuh jarak yang jauh sebelum pasukan utama kami bergerak maju."
 YUG_form_parachute_battalions: "Bentuk Batalyon Parasut"
 YUG_form_parachute_battalions_desc: "Dengan memanfaatkan dimensi ketiga kita dapat menyerang lokasi dari arah yang tidak terduga, jauh di belakang garis musuh. Membentuk batalyon lintas udara khusus akan memastikan kita memperoleh manfaat maksimal dari kekuatan udara kita."
 YUG_army_maneuvers: "Manuver Tentara"
 YUG_army_maneuvers_desc: "Untuk membentuk pasukan kita, manuver-manuver baru harus dilakukan. Pengalaman ini tidak diragukan lagi akan memberikan wawasan baru dalam peperangan modern."
 YUG_supremacy_of_offense: "Supremasi Pelanggaran"
 YUG_supremacy_of_offense_desc: "Tindakan ofensif adalah kunci kemenangan, dan oleh karena itu harus menentukan strategi kita secara keseluruhan dan pengembangan doktrin-doktrin baru."
 YUG_supremacy_of_defense: "Supremasi Pertahanan"
 YUG_supremacy_of_defense_desc: "Karena dikepung oleh musuh dari segala sisi, kita harus bertahan cukup lama hingga sekutu bisa meredam tekanan dari kita. Pengembangan doktrin militer baru harus fokus pada pertahanan tanah air kita."
 YUG_artillery_regiments: "Resimen Artileri"
 YUG_artillery_regiments_desc: "Dengan memperkenalkan resimen artileri yang kuat ke divisi kami, kekuatan tempur mereka secara keseluruhan akan meningkat pesat."
 YUG_expand_the_split_shipyards: "Perluas Galangan Kapal Terpisah"
 YUG_expand_the_split_shipyards_desc: "Industri pembuatan kapal kami yang sudah ada di Dalmatia merupakan kandidat utama untuk ekspansi, dan memiliki banyak fasilitas yang memungkinkan kapal perang yang lebih besar. Namun, desakan Kroasia untuk meningkatkan otonomi mungkin akan membuat kita kehilangan kendali langsung atas fasilitas tersebut."
 YUG_contest_the_adriatic: "Kontes Laut Adriatik"
 YUG_contest_the_adriatic_desc: "Pertahanan pantai kita dimulai dari laut yang berada di luarnya. Kita harus mengembangkan taktik dan strategi angkatan laut baru untuk merebut kendali atau setidaknya bersaing di Laut Adriatik."
 YUG_replace_the_dalmacija: "Ganti Dalmacija"
 YUG_replace_the_dalmacija_desc: "Kapal penjelajah tua Jerman Dalmacija memiliki desain yang sudah tua. Kami membutuhkan kapal jenis penjelajah baru yang modern untuk menggantikannya dan berfungsi sebagai tulang punggung armada Adriatik kami."
 YUG_naval_bombers: "Pembom Angkatan Laut"
 YUG_naval_bombers_desc: "Laut Adriatik panjang, namun sempit, sehingga mudah diakses oleh pesawat terbang yang berbasis di lapangan terbang kami. Dengan mengembangkan model pembom angkatan laut khusus, hal ini dapat secara signifikan meningkatkan peluang angkatan laut kita melawan musuh yang lebih kuat."
 YUG_heavy_cruiser_project: "Proyek Kapal Penjelajah Berat"
 YUG_heavy_cruiser_project_desc: "Untuk dapat menantang angkatan laut musuh secara memadai, kita memerlukan tonase yang lebih besar dan persenjataan yang lebih berat. Kapal penjelajah berat akan menjadi langkah maju dari kapal penjelajah ringan yang selama ini kami gunakan sebagai andalan armada kami."
 YUG_modern_destroyers: "Penghancur Modern"
 YUG_modern_destroyers_desc: "Kapal perusak adalah tulang punggung angkatan laut mana pun, dan kita harus memastikan angkatan laut kita tidak kalah dengan angkatan laut musuh."
 YUG_expand_the_serbian_shipyards: "Perluas Galangan Kapal Serbia"
 YUG_expand_the_serbian_shipyards_desc: "Meskipun wilayah ini tidak memiliki fasilitas yang memungkinkan produksi kapal perang yang lebih besar dengan mudah, penempatan galangan kapal yang luas di wilayah Montenegro akan memastikan bahwa kita mempertahankan kendali atas kapal-kapal tersebut terlepas dari kebijakan masa depan kita mengenai otonomi Kroasia."
 YUG_coastal_defense: "Pertahanan Pesisir"
 YUG_coastal_defense_effect_tt1: "Tambahkan §Y2 Benteng Pesisir§! di garis pantai"
 YUG_coastal_defense_effect_tt2: "Tambahkan §Y1 Benteng Pesisir§! ke lokasi §YPangkalan Angkatan Laut§!"
 YUG_coastal_defense_desc: "Kita tidak bisa berharap untuk melawan armada musuh kita di Laut Adriatik. Sebaliknya, kita harus mempersiapkan wilayah kita untuk menghalau setiap invasi angkatan laut yang mungkin mereka lakukan."
 YUG_expand_the_submarine_fleet: "Perluas Armada Kapal Selam"
 YUG_expand_the_submarine_fleet_desc: "Daripada menantang musuh secara langsung dengan angkatan laut kita yang lebih rendah, kita harus fokus pada kapal selam untuk mengganggu musuh dan menargetkan kapal dagang mereka."
 panslavic_workers_congress: "Kongres Pekerja Pan-Slavia"
 panbalkan_workers_congress: "Kongres Pekerja Balkan Besar"
 create_one_units_tt: "Buat unit §Y1 Milisi§!."
 create_two_units_tt: "Buat unit §Y2 Milisi§!."
 create_three_units_tt: "Buat unit §Y3 Milisi§!."
 create_four_units_tt: "Buat §Y4 unit Milisi§!."
 release_dalmatia_tt: "Lepaskan §YDalmatia§! sebagai boneka."
 release_transylvania_tt: "Lepaskan §YTransylvania§! sebagai boneka."
 release_vojvodina_tt: "Lepaskan §YVojvodina§! sebagai boneka."
 release_dalmatia_units_tt: "(§YDalmatia§!) Bentuk §Y1 unit Milisi§!."
 transylvania_create_one_units_tt: "(§YTransylvania§!) Bentuk §Y1 unit Milisi§!."
 vojvodina_create_one_units_tt: "(§YVojvodina§!) Bentuk §Y1 unit Milisi§!."
 all_subjects_become_fascist_tt: "Semua negara subjek di §YEropa§! menjadi §YFasis§!."
 neutral_to_fascist_tt: "Semua popularitas §YNeutral§! menjadi popularitas §YFasis§!."
 YUG_towards_independence_mod: "Yugoslavia mendorong kemerdekaan"
 YUGOSLAV_DEFENCE_LEAGUE: "Liga Pertahanan Balkan"
 YUG_crush_ustasa: "Pemberontakan Ustasa yang Akan Datang"
 YUG_crush_ustasa_desc: "Keputusan pemerintah untuk menindak kelompok fasis Ustasa telah membuat gelisah para pendukung kemerdekaan Kroasia dan Ustasa dengan cepat mempersiapkan pemberontakan bersenjata melawan pemerintah. Jika kita gagal membubarkan organisasi fasis ini pada waktu yang tepat, Ustasa mungkin akan mengalahkan pemerintah lokal Kroasia dan mengibarkan bendera mereka sebagai bentuk pemberontakan terhadap negara kita."
 YUG_ustasa_uprising: "Pemberontakan Ustasa"
 YUG_ustasa_uprising_desc: "Jika kita gagal menghentikan pemberontakan Ustasa pada waktunya, kita akan menghadapi pemberontakan besar Kroasia melawan negara kita."
 YUG_ustasa_crushed_mission: "Hindari Pemberontakan Ustasa"
 YUG_ustasa_crushed_mission_desc: "Jika kita dapat meningkatkan kendali kita atas Kroasia, pemberontakan Ustasa akan dapat dihindari dan semua kesulitan yang dihadapi oleh kaum nasionalis Kroasia akan teratasi untuk saat ini."
 YUG_delay_ustasa_uprising: "Tunda Pemberontakan"
 YUG_delay_ustasa_uprising_desc: "Dengan meningkatnya Ustasa, pemerintah harus mengambil tindakan untuk menunda pemberontakan Kroasia. Meskipun upaya-upaya tersebut juga akan menunda operasi kita untuk mengakhiri nasionalisme Kroasia untuk selamanya, menunda pemberontakan mungkin diperlukan."
 YUG_croat_concessions: "Konsesi untuk Kroasia"
 YUG_croat_concessions_desc: "Perlakuan kami terhadap masyarakat umum Kroasia sejak keputusan kami untuk menindak Ustasa dipandang kejam dan tidak manusiawi. Mungkin dengan memberikan keringanan hukuman pada masyarakat Kroasia, mereka mungkin mulai memandang kami dengan lebih baik."
 YUG_croat_concessions_cooldown: "Konsesi untuk Kroasia"
 YUG_croat_concessions_cooldown_desc: "Perlakuan kami terhadap masyarakat Kroasia secara umum sejak keputusan kami untuk menindak Ustasa dipandang kejam dan tidak manusiawi. Mungkin dengan memberikan keringanan hukuman pada masyarakat Kroasia, mereka mungkin mulai memandang kami dengan lebih baik."
 YUG_positive_discrimination_croat: "Diskriminasi Positif bagi warga Kroasia"
 YUG_positive_discrimination_croat_desc: "Kroasia sendiri adalah rumah bagi banyak budaya dan masyarakat selain Kroasia. Mungkin dengan melembagakan undang-undang yang memihak warga Kroasia dalam hal kesempatan kerja dan keringanan pajak, kita dapat memberi mereka ilusi penentuan nasib sendiri seperti yang dijanjikan Ustasa kepada mereka."
 YUG_positive_discrimination_croat_cooldown: "Diskriminasi Positif bagi warga Kroasia"
 YUG_positive_discrimination_croat_cooldown_desc: "Kroasia sendiri adalah rumah bagi banyak budaya dan masyarakat selain Kroasia. Mungkin dengan melembagakan undang-undang yang memihak warga Kroasia dalam hal kesempatan kerja dan keringanan pajak, kita dapat memberi mereka ilusi penentuan nasib sendiri seperti yang dijanjikan Ustasa kepada mereka."
 YUG_listening_posts_croatia: "Formulir Postingan Mendengarkan di Kroasia"
 YUG_listening_posts_croatia_desc: "Ustasa sekarang beroperasi di bawah tanah, menghindari deteksi dan merencanakan pengkhianatan mereka di balik pintu tertutup. Mungkin dengan meyakinkan beberapa loyalis Yugoslavia untuk bergabung dengan Ustasa, kita dapat mendengarkan dan mengganggu operasi dan kampanye propaganda mereka di wilayah tersebut."
 YUG_listening_posts_cooldown: "Formulir Postingan Mendengarkan di Kroasia"
 YUG_listening_posts_cooldown_desc: "Ustasa sekarang beroperasi di bawah tanah, menghindari deteksi dan merencanakan pengkhianatan mereka di balik pintu tertutup. Mungkin dengan meyakinkan beberapa loyalis Yugoslavia untuk bergabung dengan Ustasa, kita dapat mendengarkan dan mengganggu operasi dan kampanye propaganda mereka di wilayah tersebut."
 YUG_progress_crushing_decisions: "Menindak Ustasa"
 YUG_progress_crushing_decisions_desc: "Saatnya telah tiba untuk melenyapkan kelompok fasis Ustasa, dan meskipun banyak yang menganggap tindakan ini sebagai tindakan fasisme, kita tahu bahwa tindakan ini sangat diperlukan untuk menjamin keberlangsungan stabilitas negara kita."
 YUG_raid_croat_villages: "Penggerebekan di Desa Kroasia"
 YUG_raid_croat_villages_desc: "Ustasa ada di mana-mana dan tidak ada di mana-mana, dan siapa pun bisa menjadi pendukung fasisme mereka. Kita harus menyerang semua kota dan desa di wilayah Kroasia dan mengendus para pengkhianat di dalamnya."
 YUG_shut_down_recruitment_centers: "Tutup Pusat Perekrutan Ustasa"
 YUG_shut_down_recruitment_centers_desc: "Ustasa juga mempunyai pusat perekrutan sendiri; melatih dan mempersenjatai siapa pun yang mampu dan cukup bodoh untuk bertarung dan mati demi tujuan mereka. Kita harus menemukan dan melenyapkan pusat-pusat perekrutan ini dan membuat para Ustasa tidak mempunyai sarana untuk memasukkan lebih banyak orang ke dalam barisan mereka."
 YUG_arrest_ustasa_leaders: "Tangkap Pimpinan Ustasa"
 YUG_arrest_ustasa_leaders_desc: "Kami mempunyai daftar nama-nama tokoh penting dalam gerakan Ustasa dan sudah saatnya kami mulai memanfaatkan hal ini dan melakukan penangkapan."
 YUG_croatian_recruitment: "Dorongan Perekrutan Kroasia"
 YUG_croatian_recruitment_desc: "Pertanyaan tentang kemerdekaan ada di bibir setiap orang Kroasia, tetapi tidak semua orang lebih menyukai pemerintahan Ustasa daripada pemerintahan Yugoslavia. Sudah waktunya kita merekrut segelintir loyalis ke dalam barisan kita, dan menunjukkan kepada masyarakat Kroasia bahwa ada beberapa orang yang lebih memilih Kroasia untuk tetap aman dalam pelukan hangat Yugoslavia."
 YUG_croat_raid_cooldown: "Penggerebekan di Desa Kroasia"
 YUG_croat_raid_cooldown_desc: "Ustasa ada di mana-mana dan tidak ada di mana-mana, dan siapa pun bisa menjadi pendukung fasisme mereka. Kita harus menyerang semua kota dan desa di wilayah Kroasia dan mengendus para pengkhianat di dalamnya."
 YUG_shut_down_recruitment_centers_cooldown: "Tutup Pusat Perekrutan Ustasa"
 YUG_shut_down_recruitment_centers_cooldown_desc: "Ustasa juga mempunyai pusat perekrutan sendiri; melatih dan mempersenjatai siapa pun yang mampu dan cukup bodoh untuk bertarung dan mati demi tujuan mereka. Kita harus menemukan dan melenyapkan pusat-pusat perekrutan ini dan membuat para Ustasa tidak mempunyai sarana untuk memasukkan lebih banyak orang ke dalam barisan mereka."
 YUG_arrest_ustasa_leaders_cooldown: "Tangkap Pimpinan Ustasa"
 YUG_arrest_ustasa_leaders_cooldown_desc: "Kami mempunyai daftar nama-nama tokoh penting dalam gerakan Ustasa dan sudah saatnya kami mulai memanfaatkan hal ini dan melakukan penangkapan."
 ustasa_crushed: "Ustasanya telah hancur"
 YUG_something_in_progress_flag: "Saat ini mempengaruhi Ustasa"
 YUG_croat_concession_flag: "Baru-baru ini diberikan konsesi"
 YUG_croat_positive_dis_flag: "Baru-baru ini diberikan diskriminasi positif"
 YUG_listening_post_flag: "Postingan mendengarkan yang baru dibuat"
 YUG_raid_villages_flag: "Baru-baru ini menggerebek desa-desa Kroasia"
 YUG_end_recruitment_flag: "Baru-baru ini menutup pusat perekrutan"
 YUG_arrest_ustasa_flag: "Baru-baru ini pimpinan Ustasa ditangkap"
 YUG_recruitment_flag: "Sudah merekrut orang Kroasia"
 YUG_royal_party: "Rumah Karađorđević"
 YUG_peasant_uprisings: "Menghasut Pemberontakan Petani"
 YUG_peasant_uprisings_desc: "Rakyat Balkan sudah cukup lama menderita akibat imperialisme! Kami akan menjangkau kelas bawah yang menderita di Balkan dan mengorganisir mereka dalam pemogokan dan demonstrasi sampai kaum borjuis ditaklukkan!"
 instigating_a_coup: "Menghasut Pemberontakan Petani"
 YUG_german_military_mission: "Pengawasan Teknologi Jerman"
 YUG_medal_for_extreme_bravery: "Keberanian Ekstrim"
 YUG_medal_for_extreme_bravery_desc: "Kerja keras heroik para prajurit kita yang bekerja keras di bawah serangan dari segala sisi, mengamanatkan terciptanya sebuah kehormatan baru untuk mengenang semangat keteguhan mereka."
 yug_extreme_bravery_medal: "§Y[ROOT.GetNameDefCap]§! sekarang dapat memberikan §YMedal untuk Keberanian Ekstrim§! kepada §YPetugas Lapangan§!."
 YUG_brigadistas: "Brigadirta"
 YUG_brigadistas_desc: "Banyak warga Yugoslavia yang berani berseru untuk berperang melawan musuh bersama dalam Perang Saudara Spanyol yang sedang berlangsung."
 ROM_crack_down_on_extremism: "Menindak Ekstremisme"
 ROM_crack_down_on_extremism_desc: "Lanskap politik kita telah bergeser ke arah kanan di bawah pemerintahan Raja. Meskipun demikian, unsur-unsur ekstremis dalam masyarakat masih menguasai hati dan pikiran masyarakat kita. Kita harus melawan aktor-aktor jahat ini untuk menjamin masa depan yang lebih moderat bagi rakyat kita."
 ROM_national_christian_party: "Partai Kristen Nasional"
 ROM_national_christian_party_desc: "Penulis Octavian Goga mempunyai pengaruh yang kuat terhadap bangsa kita melalui partai Kristen Nasionalnya. Lahir dari pengaruh yang diperoleh sebagai partai Agraria, partai ini memiliki ikatan yang kuat dengan masyarakat pedesaan. Reorganisasi kabinet kita bisa membawa pengaruhnya menguntungkan kita."
