 DLC_DESCRIPTION_dlc018: "Pohon dan acara fokus nasional baru untuk Kanada, Australia, Selandia Baru, The Raj (India), dan Afrika Selatan. Perintah rencana pertempuran Ujung Tombak memungkinkan kontrol lebih besar atas pengepungan besar dan menerobos garis musuh."
 DLC_DESCRIPTION_dlc020: "Empat Pohon Fokus Baru: Rasakan perang dari sudut pandang sulit di Hongaria, Rumania, Cekoslowakia, dan Yugoslavia."
 DLC_DESCRIPTION_dlc022: "Modifikasi Pohon Fokus untuk Jerman dan Jepang: Dua kekuatan utama Poros kini memiliki jalur sejarah alternatif, termasuk peluang untuk menggulingkan Hitler atau memasang Komunisme atau Demokrasi di Jepang."
 DLC_DESCRIPTION_dlc023: "Dapatkan desain, sifat, dan keterampilan kapal baru untuk laksamana, kendaraan amfibi, gunakan ranjau laut untuk melindungi laut dan rute kapal Anda untuk menghindari bahaya. Termasuk pohon fokus baru untuk Belanda, Inggris, Meksiko dan Amerika Serikat."
 DLC_DESCRIPTION_dlc028: "La Résistance menambahkan agen rahasia, misi spionase, dan opsi baru untuk gerakan perlawanan. Kirim agen ke wilayah berbahaya untuk menguraikan rahasia musuh atau mempersiapkan landasan untuk invasi Anda dengan menopang kolaborator yang akan senang dengan kekuatan apa pun."
 DLC_DESCRIPTION_dlc031: "Menambahkan pohon fokus nasional khusus ke negara-negara kecil di sekitar Laut Hitam dan Laut Aegea. Bulgaria, Yunani dan Turki masing-masing dapat memetakan jalur sejarah dan sejarah alternatif yang unik ketika mereka menolak upaya negara-negara besar untuk mendominasi jalur laut strategis Bosporus dan Dardanella."
 DLC_DESCRIPTION_dlc034: "No Step Back menambahkan lebih banyak detail untuk banyak negara di Eropa Timur, sistem permainan unik yang mencerminkan politik Soviet, dan banyak perbaikan pada aspek militer dari permainan tersebut."
 DLC_DESCRIPTION_dlc036: "Bangun kerajaan baru, lawan agresi asing, atau jelajahi batas netralitas. By Blood Alone menambahkan opsi sejarah alternatif baru dan variasi gameplay untuk Italia, Etiopia, dan Swiss, serta perubahan signifikan lainnya."
 DLC_DESCRIPTION_dlc038: "Tulislah sejarah baru yang menarik tentang negara-negara Nordik ketika negara-negara besar Eropa berjuang demi masa depan dunia. Pohon Fokus Nasional baru untuk Finlandia, Swedia, Denmark dan Norwegia menjadi pusat perhatian. Spesialisasi industri senjata Anda untuk menekankan efisiensi dan kemudian menjual senjata ini di Pasar Internasional yang baru."
 DLC_DESCRIPTION_dlc040: "Trial of Allegiance menambahkan pohon fokus yang luas untuk Brazil, Argentina, Chile, Uruguay dan Paraguay. Stabilitas seluruh benua berada di ujung tanduk. Buka front baru dalam perang saat Anda merayu para dermawan Eropa dengan komoditas Anda yang paling berharga: kesetiaan Anda."
 DLC_DESCRIPTION_dlc043: "Kembangkan teknologi prototipe dan senjata untuk digunakan melawan musuh Anda. Jalankan penggerebekan untuk menghancurkan fasilitas penelitian, bendungan, dan landmark musuh Anda. Pohon fokus yang baru dan diperbarui memungkinkan Anda menggunakan Lingkaran Dalam Jerman untuk mencapai tujuan Anda, menciptakan kembali kerajaan Habsburg seperti Austria atau Hongaria, dan menjelajahi dinamika Belgia dan koloninya, Kongo Belgia."
 DLC_DESCRIPTION_dlc046: "Graveyard of Empires memperkenalkan pohon fokus unik ke Iran, Raj, Irak, dan Afghanistan. Kurangi pengaruh campur tangan kekuatan eksternal dan bangkitkan kembali kebanggaan bangsa Anda saat Anda berusaha mendominasi Timur Tengah dan Asia Selatan."
 DLC_DESCRIPTION_dlc049: "Ciptakan jalan baru dalam sejarah bagi Jepang, Tiongkok, dan Filipina melalui No Compromise, No Surrender, an Expansion for Hearts of Iron IV. Raih kendali yang lebih besar atas faksi-faksi, bentuk doktrin militer baru, dan putuskan nasib Pasifik dan sekitarnya."
 DLC_DESCRIPTION_dlc051: "Ciptakan kembali Kerajaan Bohemia, bentuk persatuan negara-negara Eropa Tengah, lindungi diri Anda dengan benteng atau bentuk jaringan sekutu dengan pohon fokus baru Peace for Our Time untuk Cekoslowakia."
 DLC_DESCRIPTION_dlc052: "Masuki inti komando dengan mengerahkan jenderal Anda ke garis depan dan berikan medali kepada kapten kapal Anda yang paling sukses. Kembalikan invasi Jepang ke Asia Tenggara seperti Australia; mengukir kerajaan baru sebagai Siam; dan memutuskan masa depan Indonesia, dengan atau tanpa pemerintahan Belanda."
