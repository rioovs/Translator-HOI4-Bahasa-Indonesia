 ## Manifests
 defense_of_democracy_goal_name: "Pertahanan Demokrasi"
 defense_of_democracy_goal_desc: "Demokrasi sedang terancam. Kita harus bekerja sama untuk memastikan negara-negara demokrasi di dunia tidak tumbang satu per satu."
 containment_of_communism_goal_name: "Pengendalian Komunisme Dunia"
 containment_of_communism_goal_desc: "Dunia tidak akan aman sampai ancaman Komunis dipadamkan."
 suppress_regional_fascism_goal_name: "Menekan Fasisme"
 suppress_regional_fascism_goal_desc: "Fasisme mengancam akan menyebar seperti api. Semakin banyak negara yang terjerumus ke dalam cengkeramannya, maka situasi di sekitar kita akan semakin berbahaya."
 suppress_regional_communism_goal_name: "Menekan Komunisme di [ROOT.GetCountryContinent]"
 suppress_regional_communism_goal_desc: "Kita harus melakukan apa pun untuk menjaga sebanyak mungkin [ROOT.GetCountryContinent] bebas dari kuk komunis."
 regional_expansionism_goal_name: "Ekspansi di [ROOT.GetCountryContinent]"
 regional_expansionism_goal_desc: "Fraksi kami harus memimpin dan mendominasi di [ROOT.GetCountryContinent]"
 suppress_regional_democracy_goal_name: "Menekan Demokrasi"
 suppress_regional_democracy_goal_desc: "Negara-negara yang disebut demokratis adalah ancaman terbesar terhadap cita-cita kita. Kita perlu memastikan bahwa mereka hanya mengendalikan minoritas [ROOT.GetCountryContinent]."
 between_the_seas_goal_name: "Di Antara Lautan"
 between_the_seas_goal_desc: "Dengan menciptakan tembok kokoh di wilayah sekutu, dari Laut Hitam hingga Baltik, kita dapat menahan segala potensi ancaman."
 little_entente_goal_name: "Menegakkan Perjanjian Perdamaian Paris"
 little_entente_goal_desc: "Perjanjian Perdamaian Paris menetapkan perbatasan [GER.GetName], [HUN.GetName], [BUL.GetName], dan [AUS.GetName]. Tujuan utama kami adalah memastikan bahwa negara-negara ini tidak mulai mencaplok wilayah perbatasan, dan sekali lagi menghancurkan perdamaian di Eropa."
 china_territorial_integrity_goal_name: "Integritas Teritorial"
 china_territorial_integrity_goal_desc: "Tiongkok harus dibebaskan dan bersatu di bawah satu partai yang berkuasa. Hanya dengan mendapatkan kembali kendali atas wilayah kita dari musuh eksternal dan internal, kita dapat mengembalikan kejayaan Tiongkok."
 china_chinese_consolidation_goal_name: "Konsolidasi Tiongkok"
 china_wang_front_expansion_name: "Kemenangan atas Imperialisme"
 china_wang_front_expansion_desc: "Sudah waktunya untuk melawan pengaruh kekuatan kolonialis di Asia Timur. Kita perlu membangun kekuatan kita sendiri di kawasan ini, sehingga kita tidak akan lagi didominasi."
 china_asian_democratic_union_name: "$china_wang_front_expansion_name$"
 china_asian_democratic_union_desc: "$china_wang_front_expansion_desc$"
 strength_in_unity_goal_name: "Kekuatan dalam Persatuan"
 strength_in_unity_goal_desc: "Negara-negara di belahan dunia kita harus berdiri bersama. Dengan membangun faksi yang kuat, kita mempunyai peluang terbaik untuk tetap independen dan netral."
 conquest_of_territory_goal_name: "Penaklukan dan Dominasi"
 conquest_of_territory_goal_desc: "Di dunia yang penuh permusuhan, ekspansi sangat penting untuk kelangsungan hidup. Perluasan menciptakan zona penyangga dan memberi kita akses ke lebih banyak sumber daya."
 spread_of_communism_goal_name: "Revolusi Dunia"
 spread_of_communism_goal_desc: "Waktunya telah tiba bagi massa untuk bangkit. Dan ketika massa tidak mampu bangkit, kita harus membantu mereka dengan kekuatan senjata."
 control_of_the_balkans_goal_name: "Keamanan Balkan"
 control_of_the_balkans_goal_desc: "Kekuatan Eksternal selalu berusaha menyebarkan pengaruhnya ke Balkan. Kita perlu memastikan bahwa kita bersatu dan melawan segala serangan asing ke wilayah ini."
 african_decolonization_goal_name: "Dekolonisasi Afrika"
 african_decolonization_goal_desc: "Saatnya bagi Afrika untuk melawan musuh dan penindasnya telah tiba. Kita harus membebaskan benua ini, dengan kekerasan jika perlu!"
 habsburg_hegemony_goal_name: "Hegemoni Habsburg"
 habsburg_hegemony_goal_desc: "Keluarga adalah bagian terpenting dari persatuan apa pun, begitu pula aliansi kita. Kita harus mengamankan mahkota Eropa, dan menyebarkan pengaruh kita ke seluruh wilayah."
 indifference_is_a_threat_goal_name: "Ketidakpedulian adalah Ancaman"
 indifference_is_a_threat_goal_desc: "Dengan konflik besar yang hampir tidak dapat dihindari di Eropa, kita harus memastikan bahwa tidak ada kejutan yang terjadi. Negara mana pun yang menolak memihak harus disingkirkan."
 security_through_expansion_goal_name: "Keamanan Melalui Ekspansi"
 security_through_expansion_goal_desc: "Kita perlu menciptakan perisai di sekeliling wilayah kita dan mengamankan lingkaran negara-negara di sekitar perbatasan kita saat ini."
 an_iron_curtain_goal_name: "Tirai Besi"
 an_iron_curtain_goal_name_desc: "Untuk lebih melindungi tanah air, kita harus membuat tirai negara boneka di sekitar kita untuk mencegah masuknya pengunjung yang tidak diinginkan."
 eastern_european_security_goal_name: "Keamanan Eropa Timur"
 eastern_european_security_goal_desc: "Untuk melindungi kepentingan kita di Eropa Timur dengan lebih baik, kita harus turun tangan dan membentuk rezim yang berpikiran sama di Eropa Barat."
 mare_nostrum_goal_name: "Mare Nostrum"
 mare_nostrum_goal_desc: "Sudah menjadi impian masyarakat kita untuk mengubah Mediterania menjadi laut pedalaman kita sendiri. Waktunya telah tiba untuk mewujudkan impian itu!"
 pax_romana_goal_name: "Pax Romana"
 pax_romana_goal_desc: "Impian rakyat kita adalah mengembalikan kejayaan Kekaisaran Romawi. Waktunya telah tiba untuk mewujudkan impian itu!"
 ## Short term Goals
 building_up_guam_goal_name: "Perluas Pangkalan Angkatan Laut Guam"
 building_up_guam_goal_desc: "Kita perlu mengamankan koneksi ke [PHI.GetNameDef], jika terjadi konflik dengan [JAP.GetName]. Selain itu, akan sangat menguntungkan jika kita memiliki titik persiapan yang lebih dekat bagi angkatan laut kita, jika kita berperang dengan [JAP.GetAdjective]. [638.GetName] sangat sesuai dengan kebutuhan."
 the_two_seas_goal_name: "Membangun Kehadiran Baltik dan Laut Hitam"
 the_two_seas_goal_desc: "Kita harus memastikan bahwa kita memiliki kehadiran angkatan laut yang kuat di Laut Baltik dan juga di Laut Hitam."
 one_germany_goal_name: "Satukan Negara-negara Jerman"
 one_germany_goal_desc: "Untuk membangun basis kekuatan yang kuat dan bersatu, pertama-tama kita harus memastikan bahwa Jerman kuat dan bersatu. Perjanjian Perdamaian Paris melarang Reunifikasi Jerman. Sekaranglah waktunya untuk membuktikan bahwa kita tidak terikat pada perjanjian yang tidak berguna."
 guardians_of_peace_goal_name: "Menjaga Perdamaian Global"
 guardians_of_peace_goal_desc: "Awan badai mulai terbentuk di cakrawala. Kita perlu waspada terhadap pecahnya perang terlalu dini, sehingga aliansi kita punya waktu untuk mempersiapkan diri dengan baik menghadapi konflik yang tak terhindarkan."
 growing_the_faction: "Perluas Fraksi"
 growing_the_faction_desc: "Fraksi kita harus memiliki lebih banyak anggota jika ingin dianggap serius dalam kancah geopolitik."
 a_large_faction_goal_name: "Undang Lebih Banyak Negara ke Fraksi kami"
 a_large_faction_goal_desc: "Dengan berkembang lebih besar lagi, faksi kami akan mampu memproyeksikan pengaruhnya lebih jauh lagi."
 preemptive_strike_on_fascism_goal_name: "Luncurkan Serangan Pencegahan terhadap Negara Fasis"
 preemptive_strike_on_fascism_goal_desc: "Kita tidak harus menunggu mereka menyerang kita. Kami perlu memastikan bahwa kami memiliki inisiatif."
 a_great_fortress_goal_name: "Bangun Benteng yang Lebih Kuat"
 a_great_fortress_goal_desc: "Kesiapsiagaan adalah kuncinya. Dengan mengamankan wilayah perbatasan, dan titik-titik penting, menggunakan benteng paling modern, kita bisa memastikan bahwa musuh tidak bisa mengalahkan kita."
 aggressive_defense_goal_name: "Menimbulkan Kerusakan pada Agresor"
 aggressive_defense_goal_desc: "Kami tidak akan menyerah satu inci pun kepada musuh. Prajurit kita harus ditanamkan pemahaman bahwa kuncinya bukanlah mati demi negara kita, tapi membuat musuh mati demi negara mereka."
 war_on_communism_goal_name: "Deklarasikan Perang terhadap Komunisme"
 war_on_communism_goal_desc: "Kita perlu menghentikan penyebaran komunisme dengan cara apa pun."
 war_on_democracy_goal_name: "Deklarasikan Perang terhadap Demokrasi"
 war_on_democracy_goal_desc: "Kita perlu menyerang musuh ideologis kita."
 defeat_of_communism_goal_name: "Kalahkan Komunisme"
 defeat_of_communism_goal_desc: "Untuk mengalahkan komunisme dunia, kita harus memulainya dari dalam negeri dengan memberantas komunisme di wilayah kita."
 defeat_of_fascism_goal_name: "Kalahkan Fasisme"
 defeat_of_fascism_goal_desc: "Untuk menghentikan penyebaran fasisme untuk selamanya, kita harus memulainya dari dalam negeri dengan memberantas fasisme di wilayah kita."
 defeat_of_anti_communists_goal_name: "Kalahkan kaum Kontra-revolusioner"
 defeat_of_anti_communists_goal_desc: "Langkah pertama menuju revolusi dunia adalah keberhasilan konversi kekuatan-kekuatan regional yang menentang hal ini. Oleh karena itu, kita perlu menghilangkan segala ancaman di benua kita sendiri terlebih dahulu."
 defeat_of_anti_fascists_goal_name: "Menyebarkan Fasisme di Benua Eropa"
 defeat_of_anti_fascists_goal_desc: "Kita harus bertujuan untuk menghancurkan pemerintah anti-fasis di benua kita."
 defeating_our_enemies_goal_name: "Menangkan Perang"
 defeating_our_enemies_goal_desc: "Zaman tidak menentu dan perang tidak bisa dihindari. Kita harus memastikan bahwa bagaimanapun perang terjadi, kita berada di pihak yang menang."
 is_victor_in_pc_tt: "Berada di pihak yang menang dalam konferensi perdamaian"
 a_military_base_goal_name: "Memperluas Industri Militer"
 a_military_base_goal_desc: "Perang salib melawan komunisme membutuhkan senjata. Untuk memproduksi senjata dalam jumlah besar kita memerlukan industri militer yang kuat."
 a_military_base_tech_bonus: "$a_military_base_goal_name$ Bonus Gol"
 resource_control_goal_name: "Mengamankan Sumber Daya Strategis"
 resource_control_goal_desc: "Faksi tersebut perlu memastikan bahwa mereka memiliki sumber daya yang diperlukan untuk menghadapi ancaman apa pun di dunia"
 secure_european_continent_goal_name: "Mendirikan Benteng Europa"
 secure_european_continent_goal_desc: "Kita harus memastikan bahwa Benua Eropa sejalan dengan tujuan kita. [faction.GetName] harus berkuasa di Eropa."
 secure_north_africa_goal_name: "Amankan Afrika Utara"
 secure_north_africa_goal_desc: "Kita harus berusaha untuk tidak hanya mendominasi Eropa, tapi juga memastikan bahwa kita bisa mendapatkan lebih dari sekedar pijakan di Afrika Utara."
 an_armored_fist_goal_name: "Perluas Angkatan Bersenjata Kita"
 an_armored_fist_goal_desc: "Zaman baru menciptakan peluang bagi peperangan baru. Tank adalah masa depan. Kita perlu memastikan bahwa kita, sebagai sebuah faksi, memiliki cukup kekuatan untuk mendominasi medan perang."
 an_infantry_army_goal_name: "Perluas Pasukan Infanteri Kita"
 an_infantry_army_goal_desc: "Tulang punggung pasukan mana pun adalah infanteri. Kita membutuhkan pasukan infanteri dalam jumlah besar untuk mendukung klaim kita baik di arena diplomatik maupun di lapangan."
 high_seas_fleet_goal_name: "Memperluas Armada Kapal Modal"
 high_seas_fleet_goal_desc: "Memastikan musuh-musuh kita tidak mempunyai kendali atas Atlantik Utara sangat penting bagi operasi kita. Jika kita dapat mengganggu hal tersebut berarti kita tidak akan menderita akibat blokade Angkatan Laut, dan armada kita dapat bergerak dengan bebas."
 high_seas_fleet_tech_bonus: "$high_seas_fleet_goal_name$ Bonus Gol"
 control_the_chinese_coast_goal_name: "Pertahankan Pengendalian Garis Pantai"
 control_the_chinese_coast_goal_desc: "Jika diserang, kita harus berusaha mempertahankan akses ke laut selama mungkin. Kelangsungan hidup kita terkait dengan kemampuan kita menerima barang dari negara-negara seberang lautan."
 guerilla_expansion_goal_name: "Atur Perlawanan"
 guerilla_expansion_goal_desc: "Kita mungkin tidak bisa melawan penjajah dengan cara mereka sendiri, jadi kita akan melawan mereka dengan cara kita sendiri."
 industrial_expansion_goal_name: "Ekspansi Industri"
 industrial_expansion_goal_desc: "Cara terbaik untuk menciptakan faksi yang kuat adalah dengan memiliki basis industri yang kuat. Kita perlu memastikan bahwa kita mempunyai kekuatan industri yang dibutuhkan untuk menjadi kekuatan penting."
 industrial_domination_goal_name: "Perluas Industri Sipil"
 industrial_domination_goal_desc: "Peperangan modern adalah soal kemampuan produksi. Mari kita pastikan bahwa kita memiliki kemampuan industri terbesar yang pernah ada di dunia."
 industrial_expansion_tech_bonus: "$industrial_expansion_goal_name$ Bonus Gol"
 industrial_research_goal_name: "Penelitian $construction4$"
 industrial_research_goal_desc: "Untuk menjadi pemain dominan, kita perlu memastikan bahwa kita memiliki pengetahuan industri di seluruh faksi."
 secure_chinese_waters_goal_name: "Amankan Perairan Tiongkok"
 secure_chinese_waters_goal_desc: "Kita bisa mendominasi di darat, tapi dengan garis pantai yang panjang, memastikan tidak ada yang bisa menyerang kita harus menjadi prioritas utama. Keamanan ini dimulai jauh di laut."
 faction_goal_subjugate_the_faction_name: "Tundukkan Fraksi"
 faction_goal_subjugate_the_faction_desc: "Satu-satunya cara kita bisa melawan serangan penjajah asing adalah jika kita menghadirkan front persatuan dengan kepemimpinan yang kuat. Dari banyak suara yang berbeda, paduan suara yang hebat akan terdengar."
 faction_goal_north_subjugated_name: "Taklukkan Utara"
 faction_goal_north_subjugated_desc: "Jika kami melakukan upaya bersama dalam mengintegrasikan bagian faksi kami ini, para panglima perang lainnya akan memahami ke arah mana angin bertiup dan berbaris."
 faction_goal_west_subjugated_name: "Taklukkan Barat"
 faction_goal_west_subjugated_desc: "Jika kami melakukan upaya bersama dalam mengintegrasikan bagian faksi kami ini, para panglima perang lainnya akan memahami ke arah mana angin bertiup dan berbaris."
 faction_goal_south_subjugated_name: "Taklukkan Selatan"
 faction_goal_south_subjugated_desc: "Jika kami melakukan upaya bersama dalam mengintegrasikan bagian faksi kami ini, para panglima perang lainnya akan memahami ke arah mana angin bertiup dan berbaris."
 faction_goal_no_japanese_in_china_name: "Usir Penjajah"
 faction_goal_no_japanese_in_china_desc: "Sudah terlalu lama Jepang menindas rakyat kita. Mereka tidak lagi diizinkan tinggal di Tiongkok."
 faction_goal_the_northern_mandate_name: "Kendalikan Siberia Timur"
 faction_goal_the_northern_mandate_desc: "Jika rakyat kami bisa sejahtera, kami memerlukan wilayah dan sumber daya yang bisa ditemukan di Siberia. Kontrol saat ini tidak dapat memanfaatkannya dengan baik sehingga kami mempunyai hak untuk itu."
 faction_goal_the_southern_mandate_name: "Kendalikan Asia Tenggara"
 faction_goal_the_southern_mandate_desc: "Di masa lalu yang gemilang, kami memberikan pengaruh di wilayah selatan kami dan kami akan melakukannya lagi. Dengan kekayaan yang dapat ditemukan di daerah tersebut, tidak ada habisnya apa yang dapat kami lakukan."
 faction_goal_the_greater_game_name: "Kendalikan Asia Tengah"
 faction_goal_the_greater_game_desc: "Kerajaan-kerajaan berusaha memaksakan kehendak mereka di Asia Tengah dan berhasil dipukul mundur. Saatnya kita telah tiba untuk maju ke barat dan melintasi stepa lagi."
 suppress_asian_communism_goal_name: "Menekan Komunisme Asia"
 suppress_asian_communism_goal_desc: "Komunisme adalah ancaman terhadap cara hidup tradisional, terhadap tatanan alam. Kita harus bersatu untuk mengalahkan komunisme di mana pun komunisme menunjukkan dampak buruknya"
 strategic_resource_control_goal_name: "Pengendalian Sumber Daya Strategis"
 strategic_resource_control_goal_desc: "Siapa yang mengendalikan sumber daya strategis dunia, dialah yang mengendalikan politik dunia."
 align_china_goal_name: "Sejajarkan Tiongkok"
 align_china_goal_desc: "Faksi-faksi Tiongkok dan ancaman yang mereka timbulkan perlu dikendalikan. Solusi terbaik terhadap masalah ini adalah menggantinya dengan rezim yang ramah."
 control_the_chinese_capitals_goal_name: "Kendalikan Ibu Kota Tiongkok"
 control_the_chinese_capitals_goal_desc: "Jika kita menguasai ibu kota bersejarah Tiongkok, penolakan terhadap rencana kita pasti akan berkurang."
 war_on_communism_in_asia_goal_name: "Deklarasikan perang terhadap Komunisme di Asia"
 war_on_communism_in_asia_goal_desc: "Hanya ada satu cara untuk benar-benar mengalahkan komunisme; dengan kekuatan senjata. Kita perlu membasmi komunisme di seluruh Asia jika kita ingin aman dari pengaruhnya."
 coastal_security_goal_name: "Kendalikan Pesisir"
 coastal_security_goal_desc: "Kita harus memastikan bahwa kita mempunyai kendali penuh atas seluruh wilayah laut di Asia Timur dan Tenggara. Dengan cara ini kita dapat memastikan bahwa penjajah imperialis barat tidak dapat mempertahankan kekuasaannya di wilayah kita."
 secure_the_oil_supply_goal_name: "Amankan Pasokan Minyak"
 secure_the_oil_supply_goal_desc: "Jika kita ingin berperang dalam jangka panjang, kita perlu mengamankan cukup minyak untuk menopangnya dengan cara apa pun yang diperlukan."
 secure_the_oil_supply_tech_bonus: "Dapatkan Bonus Sasaran Pasokan Minyak"
 protector_of_peace_goal_name: "Pelindung Perdamaian"
 protector_of_peace_goal_desc: "Tugas kita adalah tidak terlibat dalam perang di Eropa atau di tempat lain. Sebaliknya kita harus berusaha menjaga perdamaian, dan mendorong negara-negara lain untuk menyelesaikan perselisihan mereka secara damai dan cepat."
 african_domination_goal_name: "Dominasi Afrika"
 african_domination_goal_desc: "Tujuan utama kami adalah memastikan tidak ada pengaruh asing di Afrika. Mereka yang tidak bersama kita menentang kita dan perlu dibuat patuh."
 contain_japanese_expansion_asia_goal_name: "Mengandung Ekspansi Jepang"
 contain_japanese_expansion_asia_goal_desc: "Kita harus melakukan apa yang kita bisa untuk membendung perluasan wilayah [JAP.GetName]"
 pan_americanism_goal_name: "Pan-Amerikanisme"
 pan_americanism_goal_desc: "Seluruh benua Amerika harus bersatu. Dengan melibatkan semua orang, kita dapat mengamankan wilayah kita di dunia, dan menciptakan satu front persatuan melawan kekuatan luar."
 amerindian_liberation_goal_name: "Pembebasan Amerindian"
 amerindian_liberation_goal_desc: "Penduduk asli Amerika harus dibebaskan dari penindas asing yang saat ini berkuasa atas mereka."
 islamic_brotherhood_goal_name: "Persaudaraan Islam"
 islamic_brotherhood_goal_desc: "Negara-negara Islam di dunia perlu bersatu untuk melawan mereka yang lebih suka melihat kita ditaklukkan dan ditundukkan."
 baltic_security_goal_name: "Lindungi Baltik"
 baltic_security_goal_desc: "Untuk menjamin masa depan warga negara dan warga sipil, kita harus melindungi kawasan Baltik dengan semua yang kita miliki. Hanya dengan menjaganya di bawah kendali kita, rakyatnya akan bisa sejahtera."
 nordic_defence_goal_name: "Pertahankan Nordik"
 nordic_defence_goal_desc: "Untuk menjamin masa depan warga negara dan warga sipil, kita harus melindungi kawasan Nordik dengan semua yang kita miliki. Hanya dengan mengusir kerajaan-kerajaan besar, kita akan mampu berkembang."
 european_dominance_goal_name: "Membangun Dominasi Eropa"
 european_dominance_goal_desc: "Jika kita bisa menyatukan mayoritas negara-negara Eropa di bawah satu bendera, kita bisa menciptakan aliansi yang cukup kuat untuk menghadapi ancaman paling besar sekalipun."
 asian_dominance_goal_name: "Membangun Dominasi Asia"
 asian_dominance_goal_desc: "Dengan mayoritas wilayah Asia berada di bawah kendali kami, faksi kami akan menjadi kekuatan yang patut diperhitungkan."
 middle_east_dominance_goal_name: "Kendalikan Timur Tengah"
 middle_east_dominance_goal_desc: "Dari semenanjung Arab dan Levant hingga pegunungan Afghanistan, kita perlu bersatu dan membangun kendali penuh. Kawasan ini bisa menjadi pemain besar jika kita bisa memastikan bahwa semua pihak bekerja sama."
 the_arteries_of_trade_goal_name: "Melindungi Arteri Perdagangan"
 the_arteries_of_trade_goal_desc: "Jalur pelayaran utama perlu berada di bawah kendali kami untuk menjamin kelangsungan hidup negara-negara anggota kami."
 the_atomic_race_goal_name: "Bangun Bom Atom Pertama"
 the_atomic_race_goal_desc: "Kita perlu memastikan bahwa musuh-musuh kita, saat ini atau di masa depan, tidak mendapatkan akses terhadap senjata nuklir sebelum kita mendapatkannya. Hanya dengan menjadi yang pertama kita bisa yakin bahwa tidak ada kekuatan lain yang bisa melawan kita."
 the_atomic_race_complete_trigger: "Anggota [ROOT.GetFactionName] adalah negara pertama yang menyelesaikan $sp_nuclear_bomb$"
 the_atomic_race_complete_trigger_fail: "Negara yang bukan anggota [ROOT.GetFactionName] adalah negara pertama yang menyelesaikan $sp_nuclear_bomb$"
 rule_the_waves_goal_name: "Kuasai Gelombang"
 rule_the_waves_goal_desc: "Untuk benar-benar mendominasi lautan diperlukan armada besar, dan komponen kunci dari armada besar adalah Kapal Modal."
 eliminate_the_twin_threats_goal_name: "Hilangkan Ancaman Kembar"
 eliminate_the_twin_threats_goal_desc: "Selama [SOV.GetNameDef] dan [GER.GetNameDef] tidak sejalan, kita tidak akan pernah aman."
 disarm_aggression_central_powers_goal_name: "Tumpulkan Negara Agresor"
 disarm_aggression_central_powers_goal_desc: "Negara demokrasi jarang menyerang negara lain. Untuk mengamankan Eropa bagi generasi masa depan, kita harus memastikan bahwa negara-negara agresif ini diubah menjadi negara demokrasi, atau dihilangkan sepenuhnya."
 rule_the_waves_tech_bonus: "Kuasai Bonus Sasaran Gelombang"
 imperial_glory_goal_name: "Pertahankan Aset Vital Kekaisaran"
 imperial_glory_goal_desc: "Benteng-benteng utama kekaisaran kita, dan benteng-benteng sekutu kita, harus dipertahankan. Dengan tetap mengendalikan harta benda di seluruh dunia pada saat perang, kita dapat menunjukkan kepada dunia bahwa kita tetap merupakan kekuatan yang patut diperhitungkan."
 production_quotas_goal_name: "Mencapai Kuota Produksi"
 production_quotas_goal_desc: "Kita perlu memiliki persenjataan yang sangat banyak untuk mengamankan integritas [ROOT.GetFactionName] dan bersiap menghadapi segala ancaman yang menghadang kita."
 stall_the_fascist_threat_goal_name: "Hentikan Ancaman Fasis"
 stall_the_fascist_threat_goal_desc: "Kita perlu memperlambat penyebaran fasisme di dunia. Spanyol kemungkinan besar akan jatuh, namun kita perlu melakukan bagian kita untuk menundanya sampai kita siap mempertahankan diri melawan meningkatnya ancaman fasisme. Dengan mengikat pasukan musuh dalam konflik di Spanyol, kita mempersulit mereka untuk fokus pada hal lain, sehingga memberi kita waktu yang berharga."
 the_red_tide_goal_name: "Perluas Tentara Merah"
 the_red_tide_goal_desc: "Sepatu bot di tanah adalah hal yang paling penting. Yang dibutuhkan adalah sepuluh juta tentara yang kuat. Begitulah cara kelangsungan hidup benar-benar terjamin."
 military_infrastructure_goal_name: "Membangun Infrastruktur Militer"
 military_infrastructure_goal_desc: "Infrastruktur yang dikembangkan dengan baik sangat penting dalam memastikan pasukan pertahanan perbatasan kita memiliki jalur pasokan yang mereka perlukan."
 ensure_military_r_d_goal_name: "Membangun Fasilitas Litbang Militer"
 ensure_military_r_d_goal_desc: "Kita harus memastikan teknologi militer kita sesuai standar, dengan membangun fasilitas yang didedikasikan untuk penelitian dan pengembangan prototipe canggih dan konsep baru."
 spy_master_goal_name: "Tunjuk seorang Master Mata-Mata"
 spy_master_goal_desc: "Kita harus mengkhususkan salah satu anggota kita dalam seni spionase dan pengumpulan intelijen, sehingga mereka dapat mengawasi dan mengarahkan operasi aliansi kita."
 convoy_sufficiency_goal_name: "Kecukupan Konvoi"
 convoy_sufficiency_goal_desc: "Agar mempunyai kapasitas yang cukup untuk memasok pasukan kita ke luar negeri dan memastikan kebutuhan material industri kita dipenuhi melalui impor dari luar negeri, kita harus menciptakan armada dagang yang cukup besar."
 develop_mexican_oil_goal_name: "Kembangkan Minyak Meksiko"
 develop_mexican_oil_goal_desc: "Memperluas ekstraksi cadangan minyak Meksiko akan memastikan pasokan bahan bakar yang cukup untuk kebutuhan industri dan militer."
 develop_curacao_oil_goal_name: "Mengembangkan Minyak Curaçao"
 develop_curacao_oil_goal_desc: "Kilang-kilang di Curaçao merupakan bagian integral dari pengolahan minyak Venezuela. Memperluas ekstraksi minyak bumi akan mempertahankan akses aliansi terhadap produk minyak olahan."
 develop_venezuelan_oil_goal_name: "Mengembangkan Minyak Venezuela"
 develop_venezuelan_oil_goal_desc: "Ekstraksi minyak bumi Venezuela dapat diperluas lebih lanjut untuk melengkapi aliansi kita dengan akses energi yang dibutuhkan untuk mendukung aktivitas militernya."
 develop_guyanan_bauxite_goal_name: "Mengembangkan Bauksit Guyanan"
 develop_guyanan_bauxite_goal_desc: "Perluasan pengembangan cadangan bauksit di Guyana akan menyediakan sumber daya mentah yang penting untuk pembuatan pesawat terbang skala besar."
 develop_suriname_bauxite_goal_name: "Mengembangkan Bauksit Suriname"
 develop_suriname_bauxite_goal_desc: "Perluasan pengembangan cadangan bauksit yang kaya di Suriname akan menyediakan bahan mentah yang dibutuhkan untuk industri pesawat terbang aliansi kami yang sedang berkembang."
 develop_lappland_metals_goal_name: "Kembangkan Logam Lappland"
 develop_lappland_metals_goal_desc: "Memperluas ekstraksi kekayaan mineral Lappland akan memperkuat pasokan besi dan tungsten aliansi tersebut, sehingga menopang industri manufaktur senjata kita."
 develop_ploiesti_oil_fields_goal_name: "Mengembangkan Ladang Minyak Ploiesti"
 develop_ploiesti_oil_fields_goal_desc: "Sebagai satu-satunya ladang minyak di Eropa, ladang minyak Ploiești harus dieksploitasi dengan tepat untuk memastikan aliansi tersebut memiliki bahan bakar yang dibutuhkan untuk melanjutkan operasi militer."
 develop_baku_oil_fields_goal_name: "Mengembangkan Ladang Minyak Baku"
 develop_baku_oil_fields_goal_desc: "Mengembangkan wilayah minyak Baku akan menyediakan produk minyak olahan dalam jumlah besar yang penting bagi operasi militer."
 develop_iraqi_oil_goal_name: "Mengembangkan Minyak Irak"
 develop_iraqi_oil_goal_desc: "Memperluas kapasitas produksi minyak Irak dapat berperan penting dalam memenuhi kebutuhan bahan bakar militer kita."
 develop_persian_oil_goal_name: "Mengembangkan Minyak Persia"
 develop_persian_oil_goal_desc: "Memperluas ladang minyak dan kapasitas penyulingan Persia akan memastikan aliran bahan bakar yang berkelanjutan untuk kebutuhan operasional."
 develop_chinese_metals_goal_name: "Mengembangkan Logam Cina"
 develop_chinese_metals_goal_desc: "Kekayaan Tiongkok dalam berbagai logam penting dapat ditambang secara lebih luas untuk menyediakan sumber daya yang dibutuhkan basis industri militer aliansi tersebut."
 develop_malayan_riches_goal_name: "Mengembangkan Kekayaan Malaya"
 develop_malayan_riches_goal_desc: "Pengembangan sumber daya tungsten dan karet di Malaya akan sangat memperkuat basis material aliansi, memastikan masukan penting bagi manufaktur dan logistik militer."
 develop_indonesian_riches_goal_name: "Mengembangkan Kekayaan Indonesia"
 expand_newfoundland_bases_goal_name: "Perluas Pangkalan Newfoundland"
 expand_newfoundland_bases_goal_desc: "Memperluas pangkalan kami di Newfoundland akan memungkinkan kami melakukan kontrol yang lebih baik atas konvoi Atlantik Utara dan memproyeksikan kekuatan udara dan laut di seluruh rute pelayaran penting."
 expand_bermuda_bases_goal_name: "Perluas Pangkalan Bermuda"
 expand_bermuda_bases_goal_desc: "Memperluas pangkalan kami di Bermuda akan memungkinkan kami berpatroli di Atlantik tengah dengan lebih efektif, dan menjaga jalur pasokan antar benua lebih aman."
 expand_bahamas_bases_goal_name: "Perluas Pangkalan Bahama"
 expand_bahamas_bases_goal_desc: "Memperluas pangkalan kami di Bahama akan memungkinkan pemantauan jalur laut Karibia yang lebih efektif dan perlindungan pendekatan maritim ke Amerika Utara dan Selatan."
 fortify_panama_canal_goal_name: "Membentengi Terusan Panama"
 expand_trinidad_bases_goal_name: "Perluas Pangkalan Trinidad"
 expand_azores_bases_goal_name: "Perluas Pangkalan Azores"
 expand_iceland_bases_goal_name: "Perluas Pangkalan Islandia"
 expand_iceland_bases_goal_desc: "Memperluas pangkalan di Islandia akan memungkinkan kita mengamankan Selat Denmark dengan lebih baik dan memberikan pengaruh yang lebih besar terhadap koridor Atlantik Utara."
 expand_faroese_bases_goal_name: "Perluas Pangkalan Faroe"
 expand_narvik_bases_goal_name: "Perluas Pangkalan Narvik"
 expand_narvik_bases_goal_desc: "Memperluas pangkalan di Narvik akan memungkinkan pemeliharaan akses yang lebih baik terhadap pengiriman bijih besi penting dan kendali atas rute pasokan Arktik."
 fortify_danish_belts_goal_name: "Perkuat Sabuk Denmark"
 fortify_danish_belts_goal_desc: "Membentengi Kattegat akan memungkinkan kita melakukan kontrol tunggal atas akses angkatan laut antara Laut Baltik dan Laut Utara dengan lebih baik."
 fortify_danish_belts_tooltip: "Setiap provinsi di §YJylland§!, §YFyn§!, dan §YSjaelland§! yang menguasai selat §YDanish Belts§! memiliki tingkat 1 §YBenteng Pesisir§! dan diawaki oleh satu divisi."
 fortify_gibraltar_goal_name: "Membentengi Gibraltar"
 fortify_gibraltar_goal_desc: "Memperkuat basis strategis kami di Selat Gibraltar akan memungkinkan kami untuk melakukan kontrol yang lebih baik atas pergerakan maritim antara Mediterania dan Atlantik."
 expand_maltese_bases_goal_name: "Perluas Pangkalan Malta"
 expand_maltese_bases_goal_desc: "Perluasan pangkalan kami di Malta akan memungkinkan gangguan yang lebih baik terhadap jalur pasokan musuh dan proyeksi kekuatan di seluruh Mediterania tengah."
 expand_cretan_bases_goal_name: "Perluas Pangkalan Kreta"
 expand_cretan_bases_goal_desc: "Perluasan pangkalan kami di Kreta akan lebih memungkinkan kami untuk mendominasi wilayah timur Mediterania dan memfasilitasi operasi di Laut Aegea dan Afrika Utara."
 expand_cypriot_bases_goal_name: "Perluas Basis Siprus"
 expand_cypriot_bases_goal_desc: "Memperluas pangkalan kami di Siprus akan memungkinkan kami mendukung operasi di Mediterania timur dengan lebih baik dan mengamankan rute udara penting ke dan dari Timur Tengah."
 fortify_bosporus_goal_name: "Perkuat Bosporus"
 fortify_bosporus_goal_desc: "Memperkuat Selat Bosporus akan menjamin kendali kita atas semua akses angkatan laut antara Laut Hitam dan Mediterania."
 fortify_bosporus_tooltip: "Setiap provinsi di §YIstanbul§! yang menguasai selat §YBosporus§! memiliki §YBenteng Pesisir§! tingkat 1, §YBenteng Darat§! tingkat 1, dan diawaki oleh satu divisi."
 fortify_dardanelles_goal_name: "Perkuat Dardanella"
 fortify_dardanelles_goal_desc: "Membentengi Dardanella akan memperkuat kemampuan kita untuk mendikte armada dan pergerakan perdagangan dari Laut Hitam."
 fortify_dardanelles_tooltip: "Setiap provinsi di §YEdirne§! dan §YBursa§! yang menguasai selat §YDardanelles§! memiliki §YBenteng Pesisir§! tingkat 1, §YBenteng Darat§! tingkat 1, dan diawaki oleh satu divisi."
 fortify_suez_canal_goal_name: "Memperkuat Terusan Suez"
 fortify_suez_canal_goal_desc: "Kepemilikan Terusan Suez yang berkelanjutan sangat penting untuk menjamin kendali penuh kita atas jalur lalu lintas utama antara Eropa dan Asia."
 fortify_suez_tooltip: "Setiap provinsi di §YSuez§! yang menguasai selat §YSuez§! memiliki §YBenteng Pesisir§! tingkat 1, §YBenteng Darat§! tingkat 1, dan diawaki oleh satu divisi."
 expand_gulf_of_aden_bases_goal_name: "Perluas Pangkalan Teluk Aden"
 fortify_strait_of_hormuz_goal_name: "Memperkuat Selat Hormuz"
 fortify_strait_of_hormuz_goal_desc: "Memperkuat pangkalan-pangkalan strategis di Selat Hormuz akan lebih memungkinkan kita untuk melakukan kontrol atas akses terhadap minyak penting Persia dan Irak."
 fortify_strait_of_hormuz_tooltip: "Setiap provinsi di §YMusandam§! dan §YFars§! yang menguasai selat §YHormuz§! mempunyai §YBenteng Pesisir§! tingkat 1, §YBenteng Darat§! tingkat 1, dan diawaki oleh satu divisi."
 expand_ceylonese_bases_goal_name: "Perluas Pangkalan Ceylon"
 expand_ceylonese_bases_goal_desc: "Memperluas basis kami di Ceylon akan memperkuat dominasi kami atas Samudera Hindia dan memfasilitasi perlindungan jalur laut penting antara Timur Tengah dan Asia Tenggara."
 expand_singapore_naval_base_goal_name: "Perluas Pangkalan Angkatan Laut Singapura"
 expand_singapore_naval_base_goal_desc: "Pangkalan angkatan laut Singapura yang dibentengi dan dibentengi secara monumental mengendalikan Selat Malaka dan mengatur pergerakan antara Samudra Hindia dan Pasifik. Hal ini harus lebih diperkuat lagi."
 fortify_manila_bay_goal_name: "Membentengi Teluk Manila"
 fortify_manila_bay_goal_desc: "Fortifikasi Teluk Manila yang dapat dipertahankan akan meningkatkan proyeksi kekuatan kita di seluruh Pasifik barat dan mengamankan akses ke Hindia Timur dan Laut Cina Selatan."
 fortify_manila_tooltip: "Provinsi §YManila§! memiliki §YBenteng Pesisir§! tingkat 2 dan §YPangkalan Angkatan Laut§! tingkat 7, dan negara bagian §YManila§! memiliki §YPangkalan Udara§! tingkat 8."
 fortify_okinawa_goal_name: "Perkuat Okinawa"
 fortify_okinawa_goal_desc: "Memperkuat Okinawa akan mengarahkan pendekatan ke pulau-pulau asal Jepang dan membangun perimeter pertahanan yang kuat di Pasifik."
 fortify_okinawa_tooltip: "§YOkinawa§! memiliki level 1 §YAnti-Udara§! dan level 5 §YPangkalan Udara§!, dan provinsi §YNaha§! memiliki level 2 §YBenteng Pesisir§!."
 fortify_iwo_jima_goal_name: "Perkuat Iwo Jima"
 fortify_iwo_jima_goal_desc: "Membentengi Iwo Jima akan mengarahkan pendekatan ke pulau-pulau asal Jepang dan membangun perimeter pertahanan yang kuat di Pasifik."
 expand_caroline_islands_bases_goal_name: "Perluas Pangkalan Caroline"
 expand_caroline_islands_bases_goal_desc: "Perluasan pangkalan kami di Kepulauan Caroline dan Atol Truk akan memfasilitasi kampanye angkatan laut dan udara yang berkelanjutan di seluruh Pasifik tengah."
 expand_guadalcanal_bases_goal_name: "Perluas Pangkalan Guadalkanal"
 expand_guadalcanal_bases_goal_desc: "Memperluas pangkalan kami di Guadalkanal akan lebih memungkinkan kami melakukan kontrol atas operasi angkatan laut di Pasifik Selatan dan jalur akses dari dan ke Australia."
 expand_wake_island_bases_goal_name: "Perluas Basis Bangun"
 expand_midway_island_bases_goal_name: "Perluas Pangkalan Tengah"
 expand_midway_island_bases_goal_desc: "Pengembangan pangkalan kami di Midway akan menjamin keamanan pendekatan Pasifik tengah dan menyediakan basis utama untuk operasi lintas samudera."
 # Mid term Goals
 undoing_brest_litowsk_goal_name: "Membalas Perjanjian Brest-Litowsk"
 undoing_brest_litowsk_goal_desc: "Kedamaian yang memalukan di Brest Litowsk tidak pernah hilang sepenuhnya. Inilah saatnya menghapus bagian terakhir dari bagian sejarah kita yang memalukan ini."
 marine_corps_goal_name: "Membentuk Korps Marinir"
 marine_corps_goal_desc: "Memperluas kekuatan amfibi kita akan meningkatkan kemampuan ofensif kita dan jumlah wilayah musuh yang dapat kita ancam."
 marine_corps_tech_bonus: "$marine_corps_goal_name$ Bonus Gol"
 airborne_corps_goal_name: "Bentuk Korps Lintas Udara"
 airborne_corps_goal_desc: "Memperluas kekuatan lintas udara akan sangat meningkatkan fleksibilitas ofensif dan memungkinkan kita menyerang lebih dalam ke wilayah musuh."
 airborne_corps_tech_bonus: "$airborne_corps_goal_name$ Bonus Gol"
 mountaineer_corps_goal_name: "Bentuk Korps Pendaki Gunung"
 mountaineer_corps_goal_desc: "Memperluas pasukan pendaki gunung kita akan sangat meningkatkan kemampuan tentara kita untuk menghadapi medan yang terjal dan sulit ini."
 mountaineer_corps_tech_bonus: "$mountaineer_corps_goal_name$ Bonus Gol"
 submarine_force_goal_name: "Perluas Armada Kapal Selam"
 submarine_force_goal_desc: "Kekuatan kapal selam yang sesuai sangat penting dalam melemahkan jalur pasokan musuh."
 submarine_force_tech_bonus: "$submarine_force_goal_name$ Bonus Gol"
 convoy_escort_force_goal_name: "Mengawal Konvoi Melintasi Samudera"
 convoy_escort_force_goal_desc: "Untuk mengamankan jalur pasokan, kami harus memastikan jumlah kapal pengawal yang memadai."
 convoy_escort_force_tech_bonus: "$convoy_escort_force_goal_name$ Bonus Gol"
 air_superiority_goal_name: "Menjaga Superioritas Udara"
 air_superiority_goal_desc: "Penguasaan udara menentukan keberhasilan di darat dan di laut. Kita harus memiliki pesawat tempur yang cukup untuk mengamankan dominasi udara kita."
 air_superiority_tech_bonus: "$air_superiority_goal_name$ Bonus Gol"
 control_mexican_oil_goal_name: "Kontrol Minyak Meksiko"
 control_mexican_oil_goal_desc: "Mengamankan cadangan minyak Meksiko akan memastikan pasokan bahan bakar yang cukup untuk kebutuhan industri dan militer."
 control_curacao_oil_goal_name: "Kontrol Minyak Curaçao"
 control_curacao_oil_goal_desc: "Kilang-kilang di Curaçao merupakan bagian integral dari pengolahan minyak Venezuela. Pengendalian terhadap mereka akan memberi aliansi akses yang dapat diandalkan terhadap produk minyak olahan."
 control_venezuelan_oil_goal_name: "Kendalikan Minyak Venezuela"
 control_venezuelan_oil_goal_desc: "Cadangan minyak bumi Venezuela yang besar akan memberikan aliansi kita akses energi yang dibutuhkan untuk mendukung aktivitas militernya."
 control_guyanan_bauxite_goal_name: "Kontrol Bauksit Guyanan"
 control_guyanan_bauxite_goal_desc: "Penguasaan atas simpanan bauksit di Guyana akan memperluas produksi aluminium aliansi tersebut, yang penting untuk pembuatan pesawat terbang."
 control_suriname_bauxite_goal_name: "Kontrol Bauksit Suriname"
 control_suriname_bauxite_goal_desc: "Kepemilikan cadangan bauksit yang kaya di Suriname akan menyediakan bahan mentah yang dibutuhkan untuk industri pesawat terbang aliansi kami yang sedang berkembang."
 control_lappland_metals_goal_name: "Kontrol Logam Lappland"
 control_lappland_metals_goal_desc: "Akses terhadap kekayaan mineral Lappland akan memperkuat pasokan besi dan tungsten aliansi tersebut, sehingga menopang industri manufaktur senjata kita."
 control_ploiesti_oil_fields_goal_name: "Kontrol Ladang Minyak Ploiesti"
 control_ploiesti_oil_fields_goal_desc: "Sebagai satu-satunya ladang minyak di Eropa, kendali atas ladang minyak Ploiești sangat berharga dalam memastikan aliansi tersebut memiliki bahan bakar yang dibutuhkan untuk melanjutkan operasi militer."
 control_baku_oil_fields_goal_name: "Kontrol Ladang Minyak Baku"
 control_baku_oil_fields_goal_desc: "Mengamankan wilayah minyak Baku akan memberikan akses terhadap cadangan minyak bumi yang sangat penting bagi operasi militer."
 control_iraqi_oil_goal_name: "Kontrol Minyak Irak"
 control_iraqi_oil_goal_desc: "Kapasitas produksi minyak Irak dapat berperan penting dalam memenuhi kebutuhan bahan bakar militer kita."
 control_persian_oil_goal_name: "Kontrol Minyak Persia"
 control_persian_oil_goal_desc: "Kontrol atas ladang minyak Persia dan kapasitas penyulingan akan menjamin aliran bahan bakar yang berkelanjutan untuk kebutuhan operasional."
 control_chinese_metals_goal_name: "Kendalikan Logam Tiongkok"
 control_chinese_metals_goal_desc: "Kekayaan Tiongkok dalam berbagai logam penting dapat memasok sumber daya yang dibutuhkan basis industri militer aliansi tersebut."
 control_malayan_riches_goal_name: "Kendalikan Kekayaan Malaya"
 control_malayan_riches_goal_desc: "Pengendalian sumber daya tungsten dan karet di Malaya akan sangat memperkuat basis material aliansi tersebut, memastikan masukan penting untuk manufaktur dan logistik militer."
 control_indonesian_riches_goal_name: "Kendalikan Kekayaan Indonesia"
 control_indonesian_riches_goal_desc: "Kekayaan alam Indonesia yang beragam, termasuk minyak, karet, dan mineral, sangat berharga untuk mendukung basis industri kita dan memastikan kemandirian sumber daya aliansi ini."
 control_newfoundland_bases_goal_name: "Kontrol Pangkalan Newfoundland"
 control_newfoundland_bases_goal_desc: "Mengamankan pangkalan di Newfoundland akan memungkinkan kita mengendalikan konvoi Atlantik Utara dan memproyeksikan kekuatan udara dan laut di seluruh rute pelayaran penting."
 control_bermuda_goal_name: "Kendalikan Bermuda"
 control_bermuda_goal_desc: "Pangkalan di Bermuda akan memungkinkan kita melakukan patroli yang lebih efektif di Atlantik tengah, dan menjaga jalur pasokan antar benua lebih aman."
 control_bahamas_bases_goal_name: "Kendalikan Pangkalan Bahama"
 control_bahamas_bases_goal_desc: "Kepemilikan pangkalan di Bahama akan memungkinkan pemantauan jalur laut Karibia yang lebih efektif dan perlindungan pendekatan maritim ke Amerika Utara dan Selatan."
 control_panama_canal_goal_name: "Kendalikan Terusan Panama"
 control_panama_canal_goal_desc: "Kontrol atas Terusan Panama sangat penting untuk memungkinkan pemindahan armada antara Atlantik dan Pasifik secara cepat, serta memastikan fleksibilitas strategis di kedua samudra."
 control_trinidad_goal_name: "Kendalikan Trinidad"
 control_trinidad_goal_desc: "Lokasi penting Trinidad menjadikannya penting untuk mengendalikan pasokan minyak Karibia dan menjadikannya titik awal yang strategis di pantai utara Amerika Selatan."
 control_azores_goal_name: "Kendalikan Azores"
 control_azores_goal_desc: "Lokasi Azores yang strategis memungkinkan jangkauan yang lebih luas melintasi Atlantik tengah, menutup kesenjangan cakupan kapal selam dan anti-kapal selam, dan memastikan perlindungan udara berkelanjutan untuk konvoi."
 control_iceland_goal_name: "Kendalikan Islandia"
 control_iceland_goal_desc: "Pengendalian pangkalan di Islandia akan memungkinkan pengamanan Selat Denmark dan memberikan pengaruh terhadap koridor Atlantik Utara."
 control_faroe_islands_goal_name: "Kontrol Kepulauan Faroe"
 control_faroe_islands_goal_desc: "Kepulauan Faroe terletak di lokasi strategis yang memungkinkan kendali jalur laut utara dan mendukung operasi angkatan laut menuju Inggris, Skandinavia, dan Arktik."
 control_narvik_goal_name: "Kendalikan Narvik"
 control_narvik_goal_desc: "Mengamankan Narvik akan memungkinkan pemeliharaan akses terhadap pengiriman bijih besi yang penting dan kendali atas rute pasokan Arktik."
 control_danish_belts_goal_name: "Kendalikan Sabuk Denmark"
 control_danish_belts_goal_desc: "Dengan menempatkan pasukan di Kattegat, kita akan mendapatkan kendali tunggal atas akses angkatan laut antara Laut Baltik dan Laut Utara."
 control_brittany_bases_goal_name: "Kontrol Pangkalan Brittany"
 control_brittany_bases_goal_desc: "Pangkalan strategis di sepanjang pantai Brittany akan memungkinkan jangkauan operasi kapal selam dan udara yang lebih luas ke Atlantik, serta mengamankan akses ke daratan Eropa."
 control_gibraltar_goal_name: "Kontrol Gibraltar"
 control_gibraltar_goal_desc: "Pangkalan strategis di Selat Gibraltar akan memungkinkan kita mengendalikan pergerakan maritim antara Mediterania dan Atlantik."
 control_malta_goal_name: "Kontrol Malta"
 control_malta_goal_desc: "Kepemilikan Malta akan memungkinkan terganggunya jalur pasokan musuh dan proyeksi kekuatan di seluruh Mediterania tengah."
 control_crete_goal_name: "Kontrol Kreta"
 control_crete_goal_desc: "Kontrol atas pulau Kreta akan memungkinkan dominasi atas Mediterania timur dan memfasilitasi operasi di Laut Aegea dan Afrika Utara."
 control_cyprus_goal_name: "Kendalikan Siprus"
 control_cyprus_goal_desc: "Penguasaan Siprus akan memungkinkan dukungan untuk operasi di Mediterania timur dan mengamankan rute udara penting ke dan dari Timur Tengah."
 control_bosporus_goal_name: "Kendalikan Bosporus"
 control_bosporus_goal_desc: "Perebutan Selat Bosporus akan memungkinkan kita mengendalikan semua akses angkatan laut antara Laut Hitam dan Mediterania."
 control_dardanelles_goal_name: "Kendalikan Dardanella"
 control_dardanelles_goal_desc: "Menguasai Dardanella akan memungkinkan untuk mendikte pergerakan armada dan perdagangan dari Laut Hitam."
 control_suez_canal_goal_name: "Kontrol Terusan Suez"
 control_suez_canal_goal_desc: "Kepemilikan Terusan Suez yang penting akan memberi kita kendali tunggal atas jalur lalu lintas utama antara Eropa dan Asia, memastikan transfer kekuatan dan sumber daya dengan cepat."
 control_gulf_of_aden_bases_goal_name: "Kontrol Pangkalan Teluk Aden"
 control_gulf_of_aden_bases_goal_desc: "Pangkalan strategis di sepanjang Teluk Aden memungkinkan perlindungan pendekatan Laut Merah dan mengamankan rute pelayaran yang menghubungkan Eropa, Afrika, dan Asia."
 control_strait_of_hormuz_goal_name: "Kendalikan Selat Hormuz"
 control_strait_of_hormuz_goal_desc: "Pangkalan strategis di Selat Hormuz akan memungkinkan untuk melakukan kontrol atas akses terhadap minyak penting Persia dan Irak."
 control_ceylon_goal_name: "Kendalikan Ceylon"
 control_ceylon_goal_desc: "Mengamankan Ceylon akan memungkinkan dominasi Samudera Hindia dan perlindungan jalur laut penting antara Timur Tengah dan Asia Tenggara."
 control_singapore_goal_name: "Kendalikan Singapura"
 control_singapore_goal_desc: "Pangkalan angkatan laut Singapura yang dibentengi dan dibentengi secara monumental mengendalikan Selat Malaka dan mengatur pergerakan antara Samudra Hindia dan Pasifik. Itu harus menjadi milik kita."
 control_manila_goal_name: "Kontrol Manila"
 control_manila_goal_desc: "Kepemilikan Teluk Manila yang dapat dipertahankan akan memungkinkan proyeksi kekuatan di seluruh Pasifik barat dan menjamin akses ke Hindia Timur dan Laut Cina Selatan."
 control_okinawa_goal_name: "Kendalikan Okinawa"
 control_okinawa_goal_desc: "Penguasaan atas Okinawa akan memungkinkan melancarkan operasi terhadap pulau-pulau asal Jepang dan membangun perimeter pertahanan yang kuat di Pasifik."
 control_iwo_jima_goal_name: "Kendalikan Iwo Jima"
 control_iwo_jima_goal_desc: "Mengamankan Iwo Jima akan memungkinkan dukungan untuk operasi udara jarak jauh di Jepang dan memperluas jangkauan kita ke Pasifik tengah."
 control_caroline_islands_goal_name: "Kendalikan Kepulauan Caroline"
 control_caroline_islands_goal_desc: "Dominasi atas Kepulauan Caroline dan Atol Truk akan memungkinkan kampanye angkatan laut dan udara yang berkelanjutan di seluruh Pasifik tengah."
 control_guadalcanal_goal_name: "Kontrol Guadalkanal"
 control_guadalcanal_goal_desc: "Mengamankan Guadalkanal akan memungkinkan kita melakukan kendali atas operasi angkatan laut di Pasifik Selatan dan jalur akses dari dan ke Australia."
 control_wake_island_goal_name: "Kontrol Pulau Wake"
 control_wake_island_goal_desc: "Memegang Pulau Wake akan memungkinkan perluasan pengintaian dan cakupan udara di seluruh rute Pasifik tengah."
 control_midway_island_goal_name: "Kontrol Pulau Midway"
 control_midway_island_goal_desc: "Penguasaan Midway akan memungkinkan keamanan pendekatan di Pasifik tengah dan menyediakan basis utama untuk operasi lintas samudera."
 control_hawaii_goal_name: "Kendalikan Hawaii"
 control_hawaii_goal_desc: "Merebut Pearl Harbor akan memungkinkan untuk melancarkan operasi Pasifik dan mengoordinasikan logistik di seluruh wilayah samudera, serta membuka akses ke garis pantai Pasifik Amerika."
 control_attu_island_goal_name: "Kendalikan Pulau Attu"
 control_attu_island_goal_desc: "Mengamankan Pulau Attu akan memungkinkan dilakukannya kendali atas jalur pelayaran Pasifik utara dan memungkinkan operasi di sepanjang rantai Aleutian menuju Alaska dan pantai Pasifik Amerika."
 undo_versailles_goal_name: "Membalas Perjanjian Versailles"
 undo_versailles_goal_desc: "Sudah saatnya kita membatalkan parodi 'Diktat' ini. Kami akan merebut kembali wilayah sah kami!"
 # Long term goals
 strategic_bombing_campaign_goal_name: "Kampanye Pengeboman Strategis Berkelanjutan"
 strategic_bombing_campaign_goal_desc: "Kampanye pengeboman strategis berskala besar akan secara sistematis menurunkan kapasitas industri musuh, sehingga memungkinkan kita melemahkan kekuatan mereka."
 liberate_territory_goal_name: "Bebaskan Wilayah kami"
 liberate_territory_goal_desc: "Musuh sedang menguasai wilayah kita. Membebaskannya harus menjadi tujuan pertama kami."
 great_offensive_goal_name: "Lakukan Serangan Hebat"
 great_offensive_goal_desc: "Serangan besar-besaran yang merebut wilayah musuh harus menjadi langkah pertama kita menuju akhir perang."
