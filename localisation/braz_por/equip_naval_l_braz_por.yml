 rocket_submarine: "Kapal Selam Peluncur Rudal"
 rocket_submarine_desc: "Generasi baru kapal selam, dilengkapi dengan rudal dan sistem peluncuran, memberi kita kesempatan untuk menyerang target strategis musuh secara tak terduga."
 nuclear_submarine: "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc: "$ship_hull_nuclear_submarine_desc$"
 nuclear_missile_submarine: "Kapal Selam Rudal Nuklir"
 nuclear_missile_submarine_desc: "Kapal selam dengan kemampuan membawa dan meluncurkan rudal nuklir ke target kita. Mereka benar-benar bisa menjadi kematian, penghancur dunia - dan kita tidak akan pernah melihat kedatangannya."
 submarine_1_desc: "Kapal selam adalah kapal siluman yang dirancang untuk melenyapkan konvoi tanpa pertahanan. Model-model awal dari Perang Besar membuka jalan bagi metode baru perang laut."
 submarine_2_desc: "Bersenjata lebih baik dan lebih stabil, rancangan kapal selam baru dibuat untuk memanfaatkan kemajuan dalam taktik laut serta memiliki jangkauan lebih jauh, mampu menyerang rute konvoi yang jauh."
 submarine_3_desc: "Peran kapal selam dalam armada di luar serangan konvoi masih diperdebatkan. Mencapai keseimbangan antara kombinasi kecepatan, jangkauan, dan persenjataan akan menjadi kunci bagi model yang dibutuhkan."
 submarine_4_desc: "Peningkatan kedalaman uji dan tata letak yang efisien akan menjadi ciri khas kapal selam modern, memanfaatkan pengalaman tempur untuk memilih persenjataan dan mesin yang tepat."
 ship_hull_submarine_1_desc: "Kapal selam adalah kapal siluman yang dirancang untuk melenyapkan konvoi tanpa pertahanan. Model-model awal dari Perang Besar membuka jalan bagi metode baru perang laut."
 ship_hull_submarine_2_desc: "Bersenjata lebih baik dan lebih stabil, rancangan kapal selam baru dibuat untuk memanfaatkan kemajuan dalam taktik laut serta memiliki jangkauan lebih jauh, mampu menyerang rute konvoi yang jauh."
 ship_hull_submarine_3_desc: "Peran kapal selam dalam armada di luar serangan konvoi masih diperdebatkan. Mencapai keseimbangan antara kombinasi kecepatan, jangkauan, dan persenjataan akan menjadi kunci bagi model yang dibutuhkan."
 ship_hull_submarine_4_desc: "Peningkatan kedalaman uji dan tata letak yang efisien akan menjadi ciri khas kapal selam modern, memanfaatkan pengalaman tempur untuk memilih persenjataan dan mesin yang tepat."
 destroyer_1: "Kapal Perusak I"
 destroyer_2: "Kapal Perusak II"
 destroyer_3: "Kapal Perusak III"
 destroyer_4: "Kapal Perusak IV"
 destroyer_1_desc: "Untuk memastikan keselamatan konvoi, perusak dari Perang Besar harus dialihfungsikan dan dikembangkan. Mempersenjatai kapal dengan lebih banyak torpedo akan memberikan lebih banyak peluang pertempuran."
 destroyer_2_desc: "Jangkauan torpedo yang lebih jauh dan kecepatan muat ulang yang lebih cepat, bersama dengan jenis persenjataan baru seperti kubah anti-udara, akan memungkinkan perusak kita tetap efisien dan serbaguna."
 destroyer_3_desc: "Untuk menghadapi ancaman dari atas dan bawah dengan lebih baik, perusak baru harus dilengkapi dengan radar serta persenjataan anti-udara dan anti-kapal selam modern."
 destroyer_4_desc: "Perusak modern harus dilengkapi dengan berbagai teknologi deteksi yang berbeda, sistem penyebaran peledak kedalaman baru, dan dibangun dalam skala yang lebih besar daripada pendahulunya."
 ship_hull_light_1_desc: "Untuk memastikan keselamatan konvoi, perusak dari Perang Besar harus dialihfungsikan dan dikembangkan. Mempersenjatai kapal dengan lebih banyak torpedo akan memberikan lebih banyak peluang pertempuran."
 ship_hull_light_2_desc: "Jangkauan torpedo yang lebih jauh dan kecepatan muat ulang yang lebih cepat, bersama dengan jenis persenjataan baru seperti kubah anti-udara, akan memungkinkan perusak kita tetap efisien dan serbaguna."
 ship_hull_light_3_desc: "Untuk menghadapi ancaman dari atas dan bawah dengan lebih baik, perusak baru harus dilengkapi dengan radar serta persenjataan anti-udara dan anti-kapal selam modern."
 ship_hull_light_4_desc: "Perusak modern harus dilengkapi dengan berbagai teknologi deteksi yang berbeda, sistem penyebaran peledak kedalaman baru, dan dibangun dalam skala yang lebih besar daripada pendahulunya."
 light_cruiser_1: "Kapal Penjelajah Ringan I"
 light_cruiser_2: "Kapal Penjelajah Ringan II"
 light_cruiser_3: "Kapal Penjelajah Ringan III"
 light_cruiser_4: "Kapal Penjelajah Ringan IV"
 torpedo_cruiser: "Kapal Penjelajah Torpedo"
 torpedo_cruiser_desc: "Penjelajah ringan yang dilengkapi dengan sejumlah besar tabung torpedo, dengan mengorbankan baterai meriam utama yang lebih kecil dan senjata anti-pesawat yang lebih sedikit."
 JAP_torpedo_cruiser: "Kelas Kitakami"
 light_cruiser_1_desc: "Penjelajah ringan yang lincah dan dapat mempertahankan kecepatan tinggi akan terus berguna untuk misi pengintaian."
 light_cruiser_2_desc: "Perjanjian pascaperang memberlakukan pembatasan pada kapal penjelajah, tetapi kapal ringan bersenjata lengkap dapat dikembangkan sembari tetap mematuhi batas-batas ini."
 light_cruiser_3_desc: "Kini mendekati batas perjanjian, kapal penjelajah yang lebih besar dan berlapis baja lebih tebal dapat dibangun, tetap dengan persenjataan yang cukup ringan untuk diklasifikasikan sebagai penjelajah ringan."
 light_cruiser_4_desc: "Dikerahkan secara taktis untuk melindungi kapal yang lebih besar, generasi penjelajah ringan modern dapat melepaskan sebagian besar batasan masa lalu dan dipersenjatai lebih baik untuk menghadapi serangan udara."
 heavy_cruiser_1: "Kapal Penjelajah Berat I"
 heavy_cruiser_2: "Kapal Penjelajah Berat II"
 heavy_cruiser_3: "Kapal Penjelajah Berat III"
 heavy_cruiser_4: "Kapal Penjelajah Berat IV"
 heavy_cruiser_1_desc: "Perjanjian Angkatan Laut Washington dibentuk untuk mencegah perlombaan senjata kapal penjelajah, di antara kapal lainnya, namun hal ini tampaknya tak terhindarkan. Dengan menjaga lapisan baja tetap ringan, muatan senjata dapat ditingkatkan."
 heavy_cruiser_2_desc: "Meskipun ada upaya perjanjian baru, memasang persenjataan yang lebih berat pada penjelajah yang lebih ringan tetap efisien, meskipun lapisan baja masih terbatas."
 heavy_cruiser_3_desc: "Karena pembatasan semakin diabaikan di seluruh dunia, rancangan penjelajah berat yang lebih seimbang dengan prioritas lebih besar pada lapis baja dapat dibangun. Senjata anti-udara yang lebih baik memungkinkan kapal-kapal ini bekerja sama dalam perang udara laut."
 heavy_cruiser_4_desc: "Rancangan yang diperbesar, lebih panjang, dan lebih berat dengan persenjataan penembak cepat menjadi ciri khas dalam tahap akhir pengembangan penjelajah berat ini."
 ship_hull_cruiser_1_desc: "Meskipun terikat oleh ketentuan Perjanjian Angkatan Laut Washington, penjelajah tetap merupakan kapal perang paling fleksibel. Lambung ini memungkinkan pembangunan penjelajah ringan untuk pengawalan dan pengintaian, atau penjelajah berat untuk mendukung garis pertempuran."
 ship_hull_cruiser_2_desc: "Generasi penjelajah berikutnya menampilkan susunan mesin baru yang meningkatkan kemampuan bertahan hidup, serta ruang untuk fasilitas pesawat khusus."
 ship_hull_cruiser_3_desc: "Seiring penjelajah di seluruh dunia menjadi lebih kuat dan mumpuni, lambung baru yang lebih besar dibutuhkan untuk menampung semua perlengkapan ekstra yang diperlukan."
 ship_hull_cruiser_4_desc: "Dipengaruhi oleh pengalaman masa perang, generasi penjelajah terbaru memiliki superstruktur yang ditata ulang untuk memberikan sudut tembak lebih luas bagi persenjataan anti-udara dan tata letak internal baru untuk mendukung penggunaan radar."
 battle_cruiser_1: "Kapal Penjelajah Tempur I"
 battle_cruiser_2: "Kapal Penjelajah Tempur II"
 battle_cruiser_3: "Kapal Penjelajah Pertempuran III"
 battle_cruiser_4: "Kapal Penjelajah Perang IV"
 battle_cruiser_1_desc: "Perlombaan senjata penjelajah tempur pascaperang menghasilkan beberapa rancangan bersenjata berat, yang mengorbankan lapisan baja demi kecepatan dibandingkan dengan kapal tempur."
 battle_cruiser_2_desc: "Penjelajah tempur yang dibangun kembali dan dialihfungsikan terus mengungguli kecepatan rancangan kapal tempur modern berkat perlindungan yang lebih ringan, namun telah mengembangkan sistem kendali tembakan, deteksi, dan pertahanan udara yang lebih baik."
 battleship_1: "Kapal Tempur I"
 battleship_2: "Kapal Tempur II"
 battleship_3: "Kapal Tempur III"
 battleship_4: "Kapal Tempur IV"
 battleship_5: "Kapal Perang V"
 battleship_6: "Kapal Perang VI"
 battleship_1_desc: "Dianggap oleh sebagian orang sebagai peninggalan era perang laut masa lalu, dan oleh yang lain sebagai kapal paling mengesankan yang pernah dibangun, tidak ada yang dapat menyangkal bahwa sisa-sisa perlombaan senjata kapal tempur ini merupakan beberapa kapal paling bersenjata berat dan berlapis baja paling tebal yang pernah ada."
 battleship_2_desc: "Dengan stabilitas dan jangkauan yang ditingkatkan, generasi baru kapal tempur menyempurnakan rancangan sebelumnya sembari tetap mematuhi batas-batas yang ditetapkan oleh perjanjian angkatan laut."
 battleship_3_desc: "Lapisan baja yang lebih tebal, mesin yang lebih bertenaga, baterai meriam kaliber tinggi, dan kemampuan anti-udara yang ditingkatkan dapat membuat kapal tempur tetap relevan, jika dikerahkan dengan benar, di dunia di mana perang laut semakin didominasi oleh dukungan udara."
 battleship_4_desc: "Ketika dunia menyaksikan apa yang mungkin menjadi konfrontasi kapal tempur besar terakhir, pentingnya persenjataan berat dan kubah meriam anti-udara menjadi lebih krusial dari sebelumnya."
 ship_hull_heavy_1_desc: "Dianggap oleh sebagian orang sebagai peninggalan era perang laut masa lalu, dan oleh yang lain sebagai kapal paling mengesankan yang pernah dibangun, tidak ada yang dapat menyangkal bahwa sisa-sisa perlombaan senjata kapal tempur ini merupakan beberapa kapal paling bersenjata berat dan berlapis baja paling tebal yang pernah ada."
 ship_hull_heavy_2_desc: "Dengan stabilitas dan jangkauan yang ditingkatkan, generasi baru kapal tempur menyempurnakan rancangan sebelumnya sembari tetap mematuhi batas-batas yang ditetapkan oleh perjanjian angkatan laut."
 ship_hull_heavy_3_desc: "Lapisan baja yang lebih tebal, mesin yang lebih bertenaga, baterai meriam kaliber tinggi, dan kemampuan anti-udara yang ditingkatkan dapat membuat kapal tempur tetap relevan, jika dikerahkan dengan benar, di dunia di mana perang laut semakin didominasi oleh dukungan udara."
 ship_hull_heavy_4_desc: "Ketika dunia menyaksikan apa yang mungkin menjadi konfrontasi kapal tempur besar terakhir, pentingnya persenjataan berat dan kubah meriam anti-udara menjadi lebih krusial dari sebelumnya."
 carrier_1: "Kapal Induk I"
 carrier_2: "Kapal Induk II"
 carrier_3: "Kapal Induk III"
 carrier_4: "Kapal Induk IV"
 carrier_5: "Pembawa V"
 carrier_6: "Pembawa VI"
 carrier_1_desc: "Banyak pakar teori militer meyakini bahwa penerbangan laut adalah masa depan. Mengonversi kapal utama tua dan kapal penumpang samudra untuk membawa pesawat akan menjadi langkah pertama menuju pemanfaatan doktrin baru ini."
 carrier_2_desc: "Saat pengerjaan dimulai pada rancangan kapal induk pertama yang dibangun dari peletakan lunas, kita harus memastikan bahwa kapal-kapal ini memiliki jangkauan dan kecepatan untuk mengimbangi seluruh armada kita, sembari menghormati perjanjian angkatan laut pascaperang."
 carrier_3_desc: "Metode konstruksi yang ditingkatkan dan sistem yang lebih terspesialisasi seperti lift tepi geladak memungkinkan kapal induk ini mengangkut lebih banyak pesawat secara lebih efisien."
 carrier_4_desc: "Dengan banyaknya perjanjian angkatan laut yang kini semakin diabaikan, kita dapat melanjutkan pembangunan kapal induk yang mampu mengangkut lebih banyak pesawat dari sebelumnya untuk mengamankan payung keunggulan udara."
 ship_hull_carrier_1_desc: "Banyak pakar teori militer meyakini bahwa penerbangan laut adalah masa depan. Mengonversi kapal utama tua dan kapal penumpang samudra untuk membawa pesawat akan menjadi langkah pertama menuju pemanfaatan doktrin baru ini."
 ship_hull_carrier_2_desc: "Saat pengerjaan dimulai pada rancangan kapal induk pertama yang dibangun dari peletakan lunas, kita harus memastikan bahwa kapal-kapal ini memiliki jangkauan dan kecepatan untuk mengimbangi seluruh armada kita, sembari menghormati perjanjian angkatan laut pascaperang."
 ship_hull_carrier_3_desc: "Metode konstruksi yang ditingkatkan dan sistem yang lebih terspesialisasi seperti lift tepi geladak memungkinkan kapal induk ini mengangkut lebih banyak pesawat secara lebih efisien."
 SH_battleship_1: "Kapal Tempur Superberat I"
 SH_battleship_2: "Kapal Tempur Superberat II"
 SH_battleship_1_desc: "Kondisi dunia saat ini tidak lagi memiliki ruang untuk mematuhi perjanjian angkatan laut. Tanpa batasan ini, kita dapat fokus sepenuhnya untuk menciptakan kapal tempur terberat dan bersenjata paling lengkap sepanjang masa, yang mampu menghadapi banyak kapal yang lebih kecil secara bersamaan."
 SH_battleship_2_desc: "Penyempurnaan dari rancangan superberat kita sebelumnya dengan senjata yang lebih kuat dan sistem kendali tembakan yang ditingkatkan."
 ship_hull_super_heavy_1_desc: "Kondisi dunia saat ini tidak lagi memiliki ruang untuk mematuhi perjanjian angkatan laut. Tanpa batasan ini, kita dapat fokus sepenuhnya untuk menciptakan kapal tempur terberat dan bersenjata paling lengkap sepanjang masa, yang mampu menghadapi banyak kapal yang lebih kecil secara bersamaan."
