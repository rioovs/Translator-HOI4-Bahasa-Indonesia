 ship_hull_light_2: "Lambung Kapal Perusak Dasar"
 ship_hull_light_3: "Lambung Kapal Perusak Ditingkatkan"
 ship_hull_light_4: "Lambung Kapal Perusak Canggih"
 ship_hull_cruiser: "Lambung Kapal Penjelajah"
 ship_hull_cruiser_desc: "Kuda pekerja armada, kapal penjelajah mengambil alih banyak tugas penting, mulai dari pengintaian dan pengawalan untuk penjelajah ringan hingga mendukung garis tempur utama untuk penjelajah berat."
 ship_hull_cruiser_1: "Lambung Kapal Penjelajah Awal"
 ship_hull_cruiser_2: "Lambung Kapal Penjelajah Dasar"
 ship_hull_cruiser_3: "Lambung Kapal Penjelajah Ditingkatkan"
 ship_hull_cruiser_4: "Lambung Kapal Penjelajah Canggih"
 ship_hull_heavy: "Lambung Kapal Berat"
 ship_hull_heavy_desc: "Simbol pamungkas kekuatan angkatan laut, raksasa lapis baja besar ini masih menuntut rasa hormat di lautan luas, bahkan ketika beberapa pakar mempertanyakan peran mereka di era pesawat terbang dan kapal selam."
 ship_hull_heavy_1: "Lambung Kapal Tempur Awal"
 ship_hull_heavy_2: "Lambung Kapal Tempur Dasar"
 ship_hull_heavy_3: "Lambung Kapal Tempur Ditingkatkan"
 ship_hull_heavy_4: "Lambung Kapal Tempur Canggih"
 ship_hull_heavy_modern: "Kapal Perang Modern"
 modern_battleship: "$ship_hull_heavy_modern$"
 ship_hull_carrier: "Lambung Kapal Induk"
 ship_hull_carrier_desc: "Setelah bertahun-tahun eksperimen, kapal induk perlahan matang menjadi kelas kapalnya sendiri. Mampu mendukung semakin banyak pesawat yang kian perkasa, kapal induk siap menjadi penentu utama dalam proyeksi kekuatan laut."
 ship_hull_carrier_0: "Pembawa Awal"
 ship_hull_carrier_conversion_bb: "Konversi Kapal Tempur ke Kapal Induk"
 ship_hull_carrier_conversion_bb_desc: "Lambung kapal tempur atau penjelajah tempur yang dialihfungsikan menjadi kapal induk pengangkut pesawat."
 ship_hull_carrier_conversion_ca: "Konversi Penjelajah ke Kapal Induk"
 ship_hull_carrier_conversion_ca_desc: "Lambung kapal penjelajah berat yang dialihfungsikan menjadi kapal induk pengangkut pesawat."
 ship_hull_carrier_1: "Lambung Kapal Induk Awal"
 ship_hull_carrier_2: "Lambung Kapal Induk Dasar"
 ship_hull_carrier_3: "Lambung Kapal Induk Ditingkatkan"
 ship_hull_carrier_modern: "Pengangkut Modern"
 ship_hull_carrier_modern_desc: "Kapal induk terbesar dan paling canggih, mampu menggunakan teknologi, perlengkapan, dan kemajuan terbaru. Kapal ini adalah perwujudan persenjataan mutakhir."
 modern_carrier: "$ship_hull_carrier_modern$"
 modern_carrier_desc: "$ship_hull_carrier_modern_desc$"
 mega_carrier: "$ship_hull_mega_carrier$"
 mega_carrier_desc: "$ship_hull_mega_carrier_desc$"
 ship_hull_submarine: "Kapal selam"
 ship_hull_submarine_desc: "Sangat berbeda dari perahu sederhana di masa Perang Besar, kapal selam modern jauh lebih mumpuni dari sebelumnya dan dapat mengancam kapal terbesar sekalipun dengan biaya yang sangat terjangkau."
 ship_hull_submarine_1: "Lambung Kapal Selam Awal"
 early_ship_hull_submarine: "$ship_hull_submarine_1$"
 ship_hull_submarine_2: "Lambung Kapal Selam Dasar"
 basic_ship_hull_submarine: "$ship_hull_submarine_2$"
 ship_hull_submarine_3: "Lambung Kapal Selam Ditingkatkan"
 improved_ship_hull_submarine: "$ship_hull_submarine_3$"
 ship_hull_submarine_4: "Lambung Kapal Selam Canggih"
 advanced_ship_hull_submarine: "$ship_hull_submarine_4$"
 ship_hull_pre_dreadnought: "Lambung Pra-Dreadnought"
 ship_hull_pre_dreadnought_desc: "Penyintas dari masa sebelum perlombaan dreadnought yang memicu Perang Besar, Pra-Dreadnought hanya memiliki nilai tempur yang sangat terbatas di masa kini."
 ship_hull_cruiser_panzerschiff: "Lambung Kapal Lapis Baja (Panzerschiff)"
 ship_hull_cruiser_panzerschiff_desc: "Kapal penjelajah berbobot besar yang memadukan kecepatan penjelajah dengan persenjataan meriam kaliber kapal tempur."
 ship_hull_cruiser_coastal_defense_ship: "Lambung Kapal Pertahanan Pesisir"
 ship_hull_cruiser_coastal_defense_ship_desc: "Kapal perang lapis baja berukuran relatif kecil dengan meriam berat, dirancang khusus untuk pertahanan perairan pesisir."
 ship_hull_torpedo_cruiser: "Lambung Penjelajah Torpedo"
 ship_hull_torpedo_cruiser_desc: "Kapal penjelajah ringan yang dimodifikasi khusus untuk membawa tabung torpedo dalam jumlah sangat banyak."
 ship_hull_super_heavy_1: "Lambung Kapal Tempur Superberat"
 ship_hull_cruiser_submarine: "Lambung Kapal Selam Penjelajah"
 ship_hull_cruiser_submarine_desc: "Kapal selam berukuran besar dengan daya jelajah sangat jauh dan persenjataan meriam permukaan yang lebih kuat."
 ship_hull_midget_submarine: "Lambung Kapal Selam Mini"
 ship_hull_midget_submarine_desc: "Kapal selam mini berukuran sangat kompak yang dirancang untuk operasi penyusupan dan serangan gerilya di perairan dangkal."
 ship_hull_fleet_submarine: "Armada Kapal Selam"
 ship_hull_fleet_submarine_desc: "Kapal selam yang berkat jangkauan operasionalnya yang jauh dapat beroperasi sebagai pengawal dan pendukung armada permukaan."
 ship_hull_carrier_submarine: "Pengangkut Kapal Selam"
 ship_hull_carrier_submarine_desc: "Lambung kapal selam besar yang dapat menampung dan meluncurkan pesawat yang mampu melakukan berbagai misi udara."
 ship_hull_nuclear_submarine: "Kapal Selam Nuklir"
 ship_hull_nuclear_submarine_desc: "Dengan reaktor nuklir, kapal selam kita dapat beroperasi dalam waktu yang sangat lama di bawah air dengan tetap mempertahankan kecepatan tinggi, menjadikannya senjata yang sangat mematikan dalam gudang senjata kita."
 ship_hull_mega_carrier: "Pembawa Es"
 ship_hull_mega_carrier_desc: "Kapal induk raksasa, dibuat dari komposit es eksperimental seperti Pykrete, yang memungkinkan pesawat reguler beroperasi darinya, memperluas jangkauan penerbangan angkatan laut kita."
 support_ship_hull: "Kapal Pendukung"
 support_ship: "Kapal Pendukung"
 support_ship_1: "Kapal Pendukung"
 support_ship_1_desc: "Kapal dukungan adalah kapal non-tempur yang difokuskan pada dukungan logistik armada tempur, memperpanjang daya tahan operasional dengan cadangan bahan bakar dan pasokan."
 support_ship_2: "Kapal Dukungan yang Ditingkatkan"
 support_ship_2_desc: "Pengalaman operasional memungkinkan pengembangan kapal dukungan yang lebih maju dan mumpuni, mampu menopang armada tempur melintasi jarak yang lebih jauh lagi."
 repair_ship_hull: "Perbaikan Kapal"
 repair_ship: "Perbaikan Kapal"
 repair_ship_1: "Perbaikan Kapal"
 repair_ship_1_desc: "Kapal perbaikan membawa perlengkapan pemulihan tugas berat yang dapat menjadi penentu antara kapal yang rusak parah mampu kembali ke pelabuhan atau tenggelam."
 repair_ship_2: "Perbaikan Kapal yang Ditingkatkan"
 repair_ship_2_desc: "Kapal perbaikan yang jauh lebih mumpuni, dengan perlengkapan canggih yang mampu menyelamatkan kapal perang kawan dari kerusakan yang paling parah sekalipun."
 ship_hull_escort_carrier: "Pembawa Pengawal"
 ship_hull_escort_carrier_desc: "Kapal induk yang lebih kecil dan lebih murah, biasanya digunakan untuk pengawalan konvoi dan perang anti-kapal selam daripada aksi armada langsung. Kapal ini membawa kelompok udara kecil namun sangat berguna."
 escort_carrier: "Pembawa Pengawal"
 escort_carrier_desc: "Kapal induk yang lebih kecil dan lebih murah, biasanya digunakan untuk pengawalan konvoi dan perang anti-kapal selam daripada aksi armada langsung. Kapal ini membawa kelompok udara kecil namun sangat berguna."
 ### ENG - ENGLAND ###
 ENG_submarine_1: "Kelas L"
 ENG_submarine_1_desc: "Kelas L adalah kapal berukuran sedang yang awalnya direncanakan di bawah Program Perang Darurat sebagai versi penyempurnaan dari kelas kapal selam sebelumnya. Mereka dibangun pada tahap akhir Perang Dunia I dan dilengkapi dengan torpedo 21 inci baru yang lebih besar. Mereka bertugas hingga awal Perang Dunia II saat sebagian besar digunakan untuk tugas sekunder dan pelatihan."
 #ENG_submarine_1b: "O/P/R Class"
 #ENG_submarine_1c: "S Class"
 ENG_submarine_2: "Kelas T"
 ENG_submarine_2_desc: "Kapal kelas T atau kelas Triton dirancang untuk menggantikan kapal selam besar kelas O, P, dan R. Mereka adalah kapal selam berukuran cukup besar dengan jangkauan jauh yang sangat cocok untuk Samudra Atlantik dan Pasifik. Kapal-kapal ini merupakan platform yang bersenjata lengkap, stabil, dan digunakan secara ekstensif selama konflik, dengan 25 persen kapal yang dibangun hilang selama perang."
 ENG_submarine_3: "Kelas U"
 ENG_submarine_3_desc: "Kelas U adalah kapal selam berukuran kecil yang dibangun di bawah Program Darurat Perang 1940 dan 1941. Awalnya dirancang sebagai kapal selam latih saat perang pecah, rancangannya diubah sehingga membuktikan kegunaannya di perairan sempit Laut Utara dan Mediterania. Karena ukurannya yang lebih kecil, jangkauan dan persenjataannya terbatas. Tiga subkelas membentuk kelas ini: Undine, Umpire, dan Uproar."
 #ENG_submarine_3b: "Seraph Class"
 ENG_submarine_4: "Kelas V"
 ENG_submarine_4_desc: "Kapal selam kelas V atau kelas Vampire didasarkan pada kapal berukuran lebih kecil dari kelas U sebelumnya. Mereka lebih besar tetapi masih relatif kecil, dengan kemampuan pelayaran yang lebih baik namun jangkauan operasional dan persenjataan yang terbatas."
 #ENG_submarine_4b: "Amphion Class"
 ENG_destroyer_1: "V/Kelas W"
 ENG_destroyer_1_desc: "Perusak ini mencakup kelas Admiralty dan Thornycroft V dan W. Mereka dibangun di bawah Program Darurat Perang. Kapal-kapal ini adalah evolusi pamungkas dari rancangan perusak Britania selama Perang Dunia Pertama, mewujudkan penyempurnaan dari pendahulunya serta kemajuan teknologi baru. Sejumlah besar kapal ini dibangun pada tahap akhir PD I dan menjadi tulang punggung flotila perusak Angkatan Laut Kerajaan sesudahnya. Mulai tahun 1930-an, mereka ditempatkan ke armada cadangan, dan akhirnya dialihkan untuk tugas pengawalan konvoi. Mereka adalah kapal cepat bersenjata memadai dengan jangkauan yang baik."
 #ENG_destroyer_1b: "A/B/C/D Class"
 ENG_destroyer_2: "G/H/Kelas I"
 ENG_destroyer_2_desc: "Perusak kelas G, H, dan I dipesan sebagai bagian dari Program Konstruksi Angkatan Laut 1933 dan 1934. Mereka pada umumnya merupakan pengulangan dari kelas F sebelumnya, dengan sedikit pengurangan ukuran. Persenjataan pada kelas G dan H sama dengan kelas F, keduanya menggunakan meriam 4,7 inci. Kapal-kapal ini memiliki jangkauan jauh, bersenjata memadai, dan memiliki komplemen torpedo yang kuat. Mereka digunakan secara ekstensif selama perang dan menderita banyak kehilangan."
 #ENG_destroyer_2b: "Tribal Class"
 ENG_destroyer_3: "J/K/Kelas N"
 ENG_destroyer_3_desc: "Kelas J, K, dan N mirip dengan kelas Tribal sebelumnya tetapi alih-alih menekankan persenjataan senjata, para perancang kembali ke torpedo berat yang lebih standar dan pengaturan senjata yang lebih ringan. Kapal-kapal itu dimodifikasi selama masa perang mereka. Peningkatannya mencakup peningkatan senjata anti-pesawat dan radar. Mereka adalah kapal yang cepat, memiliki jangkauan jauh, dan dipersenjatai dengan baik, ideal untuk pengawalan armada."
 ENG_destroyer_4: "Kelas Battle"
 ENG_destroyer_4_desc: "Perusak kelas Battle dibangun berdasarkan evolusi perusak Inggris yang digunakan sepanjang perang. Kapal-kapal ini dipesan sebagai bagian dari Program Angkatan Laut 1942 dan 1943. Mereka bersenjata lengkap baik dalam hal meriam maupun torpedo. Persenjataan AA, kemampuan ASW, kecepatan, dan jangkauannya menjadikan mereka kapal yang serbaguna. Keterlambatan masuknya mereka ke dalam perang menyebabkan kontribusi yang minimal."
 #ENG_destroyer_4b: "Weapon Class"
 ENG_light_cruiser_1: "Kelas C"
 ENG_light_cruiser_1_desc: "Penjelajah ringan kelas C adalah kelompok penjelajah ringan yang dibangun sebelum dan selama Perang Dunia I untuk kondisi Laut Utara yang ganas. Mereka terbukti sebagai kapal yang tangguh dan mumpuni meski agak kecil dan sempit. Persenjataannya lebih dari memuaskan, karena membawa cukup meriam 6 inci untuk melawan target permukaan musuh serta muatan torpedo berat untuk menghabisi kapal dan konvoi musuh. Mereka digunakan secara luas selama PD I dan berpartisipasi dalam banyak pertempuran permukaan."
 #ENG_light_cruiser_1b: "Emerald Class"
 #ENG_light_cruiser_1c: "Amphion Class"
 ENG_light_cruiser_2: "Kelas Southampton"
 ENG_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 #ENG_light_cruiser_2b: "Edinburgh Class"
 ENG_light_cruiser_3: "Crown Kelas Colony"
 ENG_light_cruiser_3_desc: "Penjelajah ringan kelas Crown Colony adalah versi peningkatan dari kelas Town sebelumnya tetapi dengan rancangan yang disederhanakan untuk mempercepat konstruksi dan memangkas biaya. Kapal-kapal ini membawa meriam yang sama dengan pendahulunya, empat kubah tripel dengan meriam 6 inci. Lapis bajanya serupa, tetapi karena mesinnya lebih kecil, jangkauannya agak berkurang. Tipe ini mencakup dua subkelas: Fiji dan Ceylon."
 #ENG_light_cruiser_3b: "Dido Class"
 ENG_light_cruiser_4: "Kelas Minotaur"
 ENG_light_cruiser_4_desc: "Juga dikenal sebagai kelas Swiftsure, kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang diizinkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih jauh dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sementara persenjataan utama dikurangi menjadi tiga kubah tripel. Dibangun terlalu terlambat untuk memengaruhi hasil perang, sebagian besar kapal yang dipesan kemudian dibatalkan."
 ENG_heavy_cruiser_1: "Kelas Hawkins"
 ENG_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 #ENG_heavy_cruiser_1b: "County Class"
 ENG_heavy_cruiser_2: "Kelas Surrey"
 ENG_heavy_cruiser_2_desc: "Penjelajah berat kelas Surrey diusulkan dalam Program Angkatan Laut 1928. Mereka adalah versi peningkatan dari penjelajah berat kelas York sebelumnya. Jika selesai, mereka akan dilengkapi dengan empat kubah meriam kembar 8 inci, lapis baja lebih berat, dan mesin lebih bertenaga. Dua kapal sempat dipesan namun tidak pernah mulai dibangun."
 ENG_heavy_cruiser_3: "Kelas Admiral"
 ENG_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 ENG_heavy_cruiser_4: "Desain Churchill"
 ENG_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 ENG_battle_cruiser_1: "Kelas Renown"
 ENG_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 #ENG_battle_cruiser_1b: "Admiral Class"
 ENG_battle_cruiser_2: "Princess Kelas Royal"
 ENG_battle_cruiser_2_desc: "Princess Royal adalah kelas penjelajah tempur hipotetis yang merupakan versi lebih cepat dan lebih murah dari kapal tempur kelas King George V. Kapal-kapal ini membawa persenjataan serupa namun dikurangi untuk pertempuran permukaan dan anti-udara: dua meriam tripel 14 inci dan enam meriam AA kembar 5,25 inci. Kecepatan tinggi dan jangkauan jauhnya akan memberi Royal Navy kemampuan serangan cepat dan perlindungan konvoi, namun lapis bajanya yang terbatas akan bermasalah jika harus bertempur melawan kapal tempur modern."
 ENG_battleship_1: "Kelas Revenge"
 ENG_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 #ENG_battleship_1b: "Nelson Class"
 ENG_battleship_2: "King George Kelas V"
 ENG_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 ENG_battleship_3: "Kelas Lion"
 ENG_battleship_3_desc: "Kapal tempur kelas Lion adalah kelas penerus dari kapal tempur King George V, menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut 1938 untuk menggantikan kapal tempur kelas Revenge yang menua, namun tidak ada yang selesai karena pecahnya peperangan. Kapal-kapal ini secara umum akan serupa dengan kelas King George, namun persenjataan utamanya lebih berat, memperkenalkan meriam 16 inci baru. Mereka juga akan memiliki lapis baja yang lebih tebal dan mesin yang lebih bertenaga."
 ENG_battleship_4: "Kelas Vanguard"
 ENG_battleship_4_desc: "Kapal tempur kelas Vanguard adalah kapal tempur terakhir yang dibangun untuk Royal Navy. Satu kapal dipesan namun empat lainnya sempat dipertimbangkan untuk medan Pasifik. Dipesan berdasarkan Program Darurat Perang 1940, pembangunannya tidak mendapatkan prioritas tinggi dan baru diselesaikan setelah perang. Kelas ini memiliki lambung ramping, memberikan stabilitas dan kelaiklautan yang sangat baik. Persenjataannya sama dengan kapal tempur kelas Queen Elizabeth dan Revenge, memberikan daya tembak yang besar. Mesin bertenaga dan lapis baja yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 ENG_SH_battleship_1: "Kelas Centurion"
 ENG_SH_battleship_1_desc: "Centurion adalah kelas kapal tempur berat hipotetis Royal Navy yang dibangun untuk menandingi kapal-kapal besar angkatan laut Jerman dan Jepang. Meriam besar 18 inci dan lapis baja tebal memberi kapal ini daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal tersebut. Persenjataan AA yang kuat, jangkauan jauh, dan kecepatan yang baik sangat penting untuk menjelajahi lautan luas Kekaisaran Britania."
 ENG_SH_battleship_2: "Lion Kelas II"
 ENG_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 ENG_carrier_1: "Kelas Courageous"
 ENG_carrier_1_desc: "Ketiga kapal induk ini merupakan hasil konversi dari penjelajah tempur dan menjadi kapal induk armada pertama bagi Royal Navy. Konversi tersebut merupakan akibat dari Traktat Angkatan Laut Washington 1922 dan pekerjaannya diselesaikan pada 1925. Kapal-kapal ini berlapis baja sedang namun bersenjata lengkap, dengan jangkauan jauh dan kecepatan baik, tetapi karena sifat konversi tersebut kapasitas pesawatnya terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam pembangunan kapal induk dan proyeksi udara armada."
 ENG_carrier_2: "Ark Kelas Royal"
 ENG_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama dari jenisnya yang dibangun untuk memenuhi batasan Traktat Angkatan Laut Washington. Ia merupakan kapal pertama yang hanggar dan dek penerbangannya menjadi bagian integral dari lambung. Dirancang pada 1934, kapal ini berlapis baja dan bersenjata dengan baik. Kapal ini membawa kapasitas pesawat yang besar serta memiliki jangkauan operasional dan kecepatan yang memadai untuk mengimbangi pasukan utama Royal Navy."
 ENG_carrier_3: "Kelas Illustrious"
 ENG_carrier_3_desc: "Kelas Illustrious dirancang dalam batasan Traktat Angkatan Laut London Kedua 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Kapal ini adalah kapal induk Inggris pertama yang memiliki dek penerbangan berlapis baja, yang mengurangi ukuran kelompok udaranya. Lapis baja berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal-kapal ini, sementara mesin bertenaga dan simpanan bahan bakar yang besar memberi kapal jangkauan operasional yang jauh."
 ENG_carrier_4: "Kelas Implacable"
 ENG_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 #ENG_carrier_4b: "Malta Class"
 ### FRA - FRANCE ###
 FRA_submarine_1: "Seri 600"
 FRA_submarine_1_desc: "Seri kapal selam 600 ton adalah kapal selam pasca-PD I modern pertama Prancis. Kapal-kapal ini berukuran sedang, berbobot benaman sekitar 600 ton. Meskipun merupakan kapal penjelajah laut, mereka ditetapkan sebagai kapal selam pesisir dan sebagian besar digunakan di perairan hangat Mediterania. Tiga kelas yang masing-masing terdiri dari 4 kapal dibangun dari tipe ini: kelas Sirène, Ariane, dan Circé. Mereka menjadi dasar bagi Seri 630 ton yang lebih besar yaitu kelas Argonaute, Diane, dan Orion."
 #FRA_submarine_1b: "630 Series"
 #FRA_submarine_1c: "Redoutable Class"
 FRA_submarine_2: "Kelas Minerve"
 FRA_submarine_2_desc: "Kapal selam kelas Minerve (nama proyek T2) didasarkan pada Seri 630 ton meskipun memiliki mesin yang lebih baik dan tata letak torpedo yang berbeda. Kapal selam ini merupakan bagian pertama dari program standarisasi yang dihasilkan dari perancangan terpusat DCAN (Direction des Constructions et Armes Navale), bukan rancangan khusus galangan kapal seperti kelas-kelas sebelumnya."
 #FRA_submarine_2b: "Aurore Class"
 FRA_submarine_3: "Roland Kelas Morillot"
 FRA_submarine_3_desc: "Kapal selam kelas Roland Morillot (nama Proyek Z2) adalah kapal selam penjelajah samudra besar yang didasarkan pada kapal selam kelas Redoutable sebelumnya. Mereka adalah kapal selam besar berbobot benaman 1.800-2.400 ton dan membawa persenjataan tangguh berupa 10 tabung torpedo. Kejatuhan Prancis terjadi sebelum ada satupun yang selesai dibangun."
 FRA_submarine_4: "PhéKelas nix"
 FRA_submarine_4_desc: "Kapal selam kelas Phénix adalah kapal penjelajah samudra berukuran sedang dan berjangkauan jauh yang diizinkan dalam program angkatan laut 1939-40, namun awal perang dan Kejatuhan Prancis menyebabkan pembatalan kapal-kapal ini. Mereka serupa dengan kelas Redoutable meski berukuran lebih kecil dan berbobot benaman 1.200 ton. Mereka membawa persenjataan torpedo yang sama beratnya."
 FRA_destroyer_1: "Kelas Bourrasque"
 FRA_destroyer_1_desc: "Perusak kelas Bourrasque adalah bagian dari Seri 1.500 ton, dan diluncurkan pada pertengahan 1920-an. Bersama dengan kelas Chacal pendahulu dan kelas L'Adroit penerusnya, mereka menjadi tulang punggung armada Prancis modern baru pascaperang. Mereka cepat dan bersenjata lengkap pada masanya, namun persenjataan torpedonya lebih kecil dibandingkan kapal serupa di angkatan laut lainnya."
 #FRA_destroyer_1b: "Chacal Class"
 #FRA_destroyer_1c: "Aigle & Vauquelin Class"
 FRA_destroyer_2: "Le Kelas Fantasque"
 FRA_destroyer_2_desc: "Perusak kelas Le Fantasque pada dasarnya adalah versi peningkatan dari perusak super Seri 2.400 ton sebelumnya (Guépard, Aigle, Vauquelin) yang dibangun berdasarkan program angkatan laut 1930. Mereka adalah perusak berukuran besar, bersenjata berat, dan sangat cepat, sempurna untuk mengawal unit-unit berkecepatan tinggi baru dari armada Prancis. Persenjataannya terdiri dari meriam yang baru dikembangkan, senjata AA yang memadai, dan persenjataan torpedo."
 #FRA_destroyer_2b: "Le Hardi Class"
 #FRA_destroyer_2c: "Mogador Class"
 FRA_destroyer_3: "L'IntréKelas pide"
 FRA_destroyer_3_desc: "Perusak kelas L'Intrépide adalah versi modifikasi dari perusak kelas Le Hardi sebelumnya. Mereka diizinkan dalam program angkatan laut 1938 dan 1939, namun perang dan Kejatuhan Prancis menyebabkan pembatalan kapal-kapal ini. Mereka seharusnya lebih difokuskan pada peran anti-pesawat, dengan bobot benaman yang bertambah menjadi 2.800-2.900 ton serta memiliki mesin yang lebih besar."
 FRA_destroyer_4: "Kelas Hoche"
 FRA_destroyer_4_desc: "Kelas Hoche dan Bayard adalah rancangan perusak super terakhir dari Angkatan Laut Prancis. Kedua kelas ini didasarkan pada kelas Mogador, berbobot benaman 4.200 ton dengan persenjataan utama serupa tetapi dengan meriam AA yang ditingkatkan dan mesin yang lebih kuat. Mereka diizinkan dalam program angkatan laut 1939-40, tetapi dimulainya perang dan Kejatuhan Prancis berujung pada pembatalan kapal-kapal ini."
 FRA_light_cruiser_1: "Kelas Duguay-Trouin"
 FRA_light_cruiser_1_desc: "Penjelajah ringan Duguay-Trouin adalah kapal perang utama Prancis pertama yang dibangun setelah Perang Dunia I dalam program angkatan laut 1922. Mereka menjadi kapal penjelajah ringan pertama dengan kubah utama tertutup bertingkat (superfiring). Di antara kapal penjelajah ringan, mereka memiliki persenjataan torpedo yang kuat namun praktis tanpa lapis baja."
 FRA_light_cruiser_2: "La GalissonnièKelas re"
 FRA_light_cruiser_2_desc: "Penjelajah ringan kelas La Galissonnière adalah jawaban terhadap penjelajah ringan tipe Condottieri Italia dan didasarkan pada kelas Émile Bertin sebelumnya. Mereka dibangun dalam program angkatan laut 1931 dan 1932, dengan persenjataan utama khas dan persenjataan AA memadai pada zamannya. Kapal-kapal ini berbobot benaman 10.850 ton, membawa lebih banyak pesawat intai, dan memiliki kecepatan yang baik."
 FRA_light_cruiser_3: "Kelas De Grasse"
 FRA_light_cruiser_3_desc: "Kapal penjelajah kelas DeGrasse disahkan pada program angkatan laut tahun 1938 dan 1939 dan pada dasarnya merupakan peningkatan La Galissonnières. Mereka memiliki persenjataan AA yang lebih kuat serta mesin yang lebih besar. Kejatuhan Perancis menyebabkan dua kapal terakhir dibatalkan dan kapal utama diselesaikan pasca perang dengan desain yang berbeda. Jerman bermaksud untuk menyelesaikannya sebagai kapal induk ringan tetapi proyek ini juga tidak terlaksana."
 FRA_light_cruiser_4: "Kelas Colbert"
 FRA_light_cruiser_4_desc: "Colbert adalah kapal penjelajah ringan antipesawat yang diluncurkan pada tahun 1956. Kapal penjelajah kelas Colbert ini dibuat dengan cara yang sangat mirip dengan De Grasse pascaperang, menampilkan persenjataan berat AA baik untuk jarak jauh maupun pendek. Perbedaan antara Colbert dan DeGrasse adalah Colbert memiliki mesin yang lebih kecil, lapis baja yang lebih tipis, dan sedikit lebih kecil."
 FRA_heavy_cruiser_1: "Kelas Suffren"
 FRA_heavy_cruiser_1_desc: "Penjelajah berat kelas Suffren pada dasarnya merupakan kelanjutan dari kelas Duquesne sebelumnya dengan perbaikan kecil terkait kemampuan kelaiklautannya. Kedua kelas mencerminkan filosofi penjelajah angkatan laut Prancis pada masanya; lapis baja yang sangat tipis namun memiliki kecepatan dan jangkauan yang baik. Bobot benaman standarnya adalah 10.000 ton dan mereka dilengkapi dengan persenjataan standar untuk penjelajah berat."
 FRA_heavy_cruiser_2: "AlgéKelas rie"
 FRA_heavy_cruiser_2_desc: "Penjelajah berat kelas Algérie adalah peningkatan lebih lanjut dari kelas terdahulu Suffren dan Duquesne, namun dirancang untuk menjadi lawan bagi penjelajah berat baru Italia kelas Zara. Baik sabuk lapis baja utama maupun perlindungan bawah air ditingkatkan secara signifikan. Persenjataan AA-nya memadai untuk zamannya, tetapi akibat perubahan ini, bobot benaman standarnya melebihi 10.000 ton."
 FRA_heavy_cruiser_3: "Saint Kelas Louis"
 FRA_heavy_cruiser_3_desc: "Penjelajah berat kelas Saint Louis didasarkan pada kelas Algérie namun penampilan keseluruhannya lebih menyerupai kapal utama kelas Dunkerque dan Richelieu. Tiga kapal dipesan dalam program angkatan laut 1940, namun akibat Kejatuhan Prancis tak satu pun yang sempat dibangun. Mereka seharusnya mengerahkan meriam baru dan persenjataan AA yang ditingkatkan, namun lapis bajanya akan sama dengan kelas Algérie. Ini adalah rancangan penjelajah berat terakhir dari Angkatan Laut Prancis."
 FRA_heavy_cruiser_4: "Kelas Forbin"
 FRA_heavy_cruiser_4_desc: "Penjelajah berat kelas Forbin adalah rancangan hipotetis sebagai penerus dari kelas Saint Louis. Dirancang untuk mempertahankan jalur perdagangan antara Prancis Daratan dan daerah koloni, kapal ini memiliki jangkauan jauh dan kecepatan baik bersama dengan persenjataan meriam berat dalam empat kubah tripel serta persenjataan AA yang memadai. Tata letak kapal dan tampilan umum menyerupai pengaruh dari kelas Saint Louis sebelumnya serta kelas Crown Colony Inggris."
 FRA_battle_cruiser_1: "Desain Durand-Viel"
 FRA_battle_cruiser_1_desc: "Rancangan penjelajah tempur Durand-Viel adalah sebuah proposal di antara serangkaian studi sejak era PD I. Mereka pada dasarnya merupakan versi penjelajah tempur dari kapal tempur kelas Normandie dan Lyon yang menampilkan kubah empat dan meriam yang sama meski dalam jumlah lebih sedikit. Seperti penjelajah tempur sezaman dari angkatan laut lainnya, mereka lebih cepat tetapi lebih tipis lapis bajanya dibanding kapal tempur. Kapal-kapal ini dibatalkan sebelum PD I pecah."
 FRA_battle_cruiser_2: "Kelas Dunkerque"
 FRA_battle_cruiser_2_desc: "Kelas Dunkerque dirancang untuk menandingi kapal tempur saku Jerman kelas Deutschland. Kapal-kapal ini merupakan puncak dari serangkaian studi perancangan dari pertengahan 1920-an hingga awal 1930-an. Diizinkan dalam program angkatan laut 1931 dan 1934, mereka serupa dengan kapal tempur kelas Nelson Inggris, dengan semua kubah utama terkonsentrasi di bagian haluan. Hal ini menghasilkan sabuk lapis baja yang lebih pendek dan dengan demikian kapal yang lebih kecil demi mematuhi batasan Traktat Angkatan Laut."
 FRA_battleship_1: "Kelas Courbet"
 FRA_battleship_1_desc: "Kapal tempur kelas Courbet adalah super-dreadnought pertama yang dibangun untuk Angkatan Laut Prancis sebelum dan selama Perang Dunia I. Diizinkan dalam program angkatan laut 1910 dan 1911, mereka melihat dinas terbatas selama Perang Dunia I, tetapi aktif selama PD II. Meskipun memiliki lapis baja yang lebih tebal dan meriam yang lebih kuat daripada kapal tempur kelas Dante sebelumnya, mereka masih kalah dibanding kapal tempur USN dan RN sezamannya. Mereka berbobot benaman tepat di atas 22.000 ton dan satu-satunya modernisasi mereka sebelum PD II adalah persenjataan AA dan ketel uap yang ditingkatkan."
 #FRA_battleship_1b: "Bretagne Class" 
 FRA_battleship_2: "Kelas Richelieu"
 FRA_battleship_2_desc: "Kapal tempur kelas Richelieu adalah kapal tempur terakhir yang ditugaskan ke dalam Angkatan Laut Prancis. Mereka adalah penyempurnaan rancangan dari Dunkerque dan diizinkan berdasarkan program angkatan laut 1935 dan 1938. Mereka memiliki persenjataan AA, kecepatan, dan jangkauan luar biasa, yang menjadikannya kapal utama yang hebat. Dari empat yang dipesan, hanya dua yang diluncurkan dan satu yang diselesaikan sebelum Kejatuhan Prancis. Terdapat banyak upaya untuk menyelesaikan kapal-kapal yang tersisa menggunakan rancangan berbeda, diusulkan untuk digunakan sebagai kapal tempur anti-pesawat, hibrida kapal tempur-induk, atau kapal induk penuh."
 FRA_battleship_3: "Kelas Gascogne"
 FRA_battleship_3_desc: "Kapal tempur kelas Gascogne adalah subkelas dari kelas Richelieu. Tiga kapal dipesan dalam program angkatan laut 1940 tetapi tidak ada yang mulai dibangun. Rancangan ini merupakan pengulangan dari Richelieu, namun dengan persenjataan utama yang didistribusikan merata di haluan dan buritan, persenjataan AA yang ditingkatkan, serta mesin yang lebih baik sehingga menghasilkan kapal yang lebih unggul secara keseluruhan."
 FRA_battleship_4: "Kelas Alsace"
 FRA_battleship_4_desc: "Kapal tempur kelas Alsace direncanakan untuk meneruskan kelas Richelieu. Empat kapal dipesan, dengan studi perancangan selesai pada 1939, diizinkan pada 1940, dan diperkirakan mulai dibangun pada 1941, meski Kejatuhan Prancis mencegah hal ini terwujud. Rancangan ini menyempurnakan Richelieu dengan meriam utama yang lebih berat dan lebih banyak, persenjataan AA yang lebih kuat, pelat lapis baja yang lebih tebal, serta mesin yang lebih besar."
 FRA_SH_battleship_1: "Kelas Charlemagne"
 FRA_SH_battleship_1_desc: "Kapal tempur super kelas Charlemagne adalah rancangan hipotetis untuk menandingi kapal-kapal tempur raksasa dari angkatan laut lain. Mereka menampilkan persenjataan berat di bagian haluan dalam posisi bertingkat (superfiring), persenjataan AA berat, dan lapis baja tebal. Keseluruhan rancangan meminjam elemen dari kelas Richelieu dan Nelson Inggris."
 FRA_SH_battleship_2: "Napoléon Kelas Bonaparte"
 FRA_SH_battleship_2_desc: "Kapal tempur kelas Napoléon Bonaparte adalah rancangan hipotetis dan didasarkan pada kelas Alsace dan Gascogne. Persenjataan beratnya didistribusikan secara merata di haluan dan buritan dalam kubah tripel, dengan senjata sekunder bertingkat dan persenjataan AA berat. Lapis baja tebal dan mesin yang kuat memberikan kecepatan serta pertahanan yang dibutuhkan untuk mengimbangi kapal-kapal lain dalam armada dan melawan musuh-musuhnya secara efektif."
 FRA_carrier_1: "BéKelas arn"
 FRA_carrier_1_desc: "Béarn awalnya dibangun sebagai kapal tempur kelas Normandie namun kemudian diselesaikan sebagai kapal induk, berbobot benaman 22.100 ton dan bertugas selama masa antar-perang serta PD II. Sebagai kapal induk konversi, kecepatannya lambat dan memiliki ruang terbatas untuk pesawat, tetapi sabuk lapis baja sedang dan jangkauan jauhnya menutupi kekurangan-kekurangan tersebut. Pembangunannya memberi pengalaman berharga bagi perancang Prancis di DCAN (Direction des Constructions et Armes Navale) dan mendorong serangkaian studi perancangan setelahnya."
 FRA_carrier_2: "Kelas Joffre"
 FRA_carrier_2_desc: "Kapal induk kelas Joffre (nama Proyek PA-16) adalah generasi penerus kapal induk untuk Angkatan Laut Prancis. Ini adalah studi perancangan terakhir yang dimulai pada 1929 dan berakhir pada 1937. Dua kapal diizinkan dalam program angkatan laut 1938, namun konflik yang meningkat memperlambat proses konstruksi dan pada akhirnya Kejatuhan Prancis mencegah penyelesaian kapal-kapal ini. Bobot benamannya sekitar 20.000 ton. Mereka akan memiliki persenjataan AA, lapis baja, dan kecepatan yang baik, namun kapasitas pesawatnya di bawah rata-rata. Secara keseluruhan, kapal ini akan menjadi kapal induk yang serbaguna dan seimbang bagi Angkatan Laut Prancis."
 FRA_carrier_3: "Jean Kelas Bart"
 FRA_carrier_3_desc: "Kapal induk Jean Bart adalah proposal pertengahan perang untuk mengonversi kapal tempur kelas Richelieu yang belum selesai, Jean Bart, menjadi kapal induk penuh seperti IJN Shinano milik Jepang. Ukuran lambung yang besar akan menghasilkan kapasitas pesawat yang besar dan bersama dengan mesin-mesin besarnya menjadikannya kapal induk yang cepat dan berjangkauan jauh. Persenjataan AA berat asal AS akan memberikan pertahanan yang baik terhadap pesawat dan kapal permukaan musuh yang lebih kecil."
 FRA_carrier_4: "Kelas Clemenceau"
 FRA_carrier_4_desc: "Kapal induk kelas Clemenceau (nama Proyek PA-28) adalah rancangan kapal induk pascaperang pertama bagi Angkatan Laut Prancis. Rancangan ini serupa dengan kapal induk kelas Joffre yang belum selesai, meskipun perlengkapan dan persenjataan yang dipasang adalah produk modern Prancis. Akuisisi kapal induk pengawal USN dan RN serta kondisi ekonomi Prancis pascaperang membuat kapal-kapal ini urung dibangun. Jangan disamakan dengan kapal induk kelas Clemenceau berikutnya (nama Proyek PA-54), yang mulai dibangun pada tahun 1955 dan 1957."
 ### GER - GERMANY ###
 GER_submarine_1: "Tipe UB III"
 GER_submarine_1_desc: "Kapal selam pesisir Tipe UB III adalah kelas U-boat yang dibangun selama Perang Dunia I oleh Angkatan Laut Kekaisaran Jerman. Mereka membawa sepuluh torpedo dan berbobot benaman lebih dari 500 ton. Antara tahun 1916 dan 1918, 96 unit dibangun, meskipun semuanya telah pensiun dari dinas pada tahun 1935."
 GER_submarine_2: "Tipe IIA"
 GER_submarine_2_desc: "Kapal selam Tipe IIA Jerman adalah kapal selam pesisir berbadan tunggal yang seluruhnya dilas dengan tangki pemberat internal. Kapal ini berbobot benaman lebih dari 250 ton dan memasang lima tabung torpedo 533 mm. Enam unit dibangun antara tahun 1934 dan 1935."
 #GER_submarine_2b: "Type VIIA"
 GER_submarine_3: "Tipe VIIC"
 GER_submarine_3_desc: "Kapal selam penjelajah lautan Tipe VIIC adalah tulang punggung armada U-boat Jerman, dengan 568 unit ditugaskan antara tahun 1940 dan 1945. Kapal-kapal ini berbobot benaman 770 ton dan dipersenjatai dengan lima tabung torpedo 533 mm."
 #GER_submarine_3b: "Type IXC"
 GER_submarine_4: "Tipe XXI"
 GER_submarine_4_desc: "Kapal selam Tipe XXI, juga dikenal sebagai 'Elektroboote', adalah kapal selam pertama yang dirancang untuk beroperasi terutama di bawah air, bukan sebagai kapal permukaan yang dapat menyelam untuk menghindari deteksi atau melancarkan serangan. Ciri utamanya adalah lambung dan menara intai yang ramping serta sel baterai dalam jumlah besar. Tipe ini termasuk di antara kelas kapal selam Jerman terbesar, berbobot benaman lebih dari 1.620 ton. Terdapat 118 kapal yang ditugaskan antara 1943 dan 1945."
 GER_destroyer_1: "Ketik 23"
 GER_destroyer_1_desc: "Tipe 23 adalah kelas kapal boat torpedo yang dibangun untuk Kriegsmarine setelah Perang Dunia I. Enam kapal dibangun antara tahun 1926 dan 1928 dan semuanya bertugas selama Perang Dunia II. Terlepas dari penetapannya sebagai kapal boat torpedo, kapal-kapal ini berukuran perusak, berbobot benaman lebih dari 920 ton dan dipersenjatai dengan tiga meriam 105 mm L/45."
 GER_destroyer_2: "Zerstorer 1934"
 GER_destroyer_2_desc: "Kelas Zerstörer 1934 adalah kelas perusak Jerman pertama yang dibangun sejak Perang Dunia I. Mereka dipersenjatai dengan lima meriam 5 inci dan delapan tabung torpedo. 16 kapal dibangun, di mana 12 di antaranya merupakan subkelas Zerstörer 1934A yang ditingkatkan."
 GER_destroyer_3: "Kelas Narvik"
 GER_destroyer_3_desc: "Zerstörer 1936A, yang dikenal oleh Sekutu sebagai perusak Kelas Narvik, dirancang untuk membawa meriam 150 mm (5,9 inci) baru. Dirancang dengan tiga meriam tunggal di buritan dan sebuah meriam kembar di haluan, mereka awalnya dilengkapi dengan meriam tunggal di haluan. Empat dari delapan kapal di kelas ini kemudian dimodifikasi ulang dengan kubah kembar. Kelompok kedua yang terdiri dari tujuh perusak dibangun dengan rancangan yang sedikit dimodifikasi dengan meriam kembar di haluan."
 GER_destroyer_4: "Zerstorer 1944"
 GER_destroyer_4_desc: "Meskipun prototipe pertama perusak bertenaga diesel (Zerstörer 1942) tidak selesai, pengembangan tipe kapal ini terus berlanjut. Beberapa proposal diajukan yang akhirnya mengarah pada proyek Zerstörer 1944. Selain persenjataan utama yang berat, kapal-kapal ini memiliki persenjataan Flak yang bertambah dibanding pendahulunya, termasuk meriam AA 5,5 cm baru."
 GER_light_cruiser_1: "Kelas Emden"
 GER_light_cruiser_1_desc: "Emden adalah kapal perang besar pertama yang dibangun di Jerman setelah Perang Dunia I. Kapal ini mulai dibangun pada 1921 dan ditugaskan pada 1925. Persenjataannya terdiri dari delapan meriam 150 mm (5,9 inci) dalam kubah tunggal."
 #GER_light_cruiser_1b: "Königsberg Class"
 GER_light_cruiser_2: "Kelas Leipzig"
 GER_light_cruiser_2_desc: "Penjelajah ringan kelas Leipzig dibangun antara 1928 dan 1935 sebagai peningkatan dari penjelajah kelas Königsberg sebelumnya. Mereka berbobot benaman lebih dari 8.100 ton, memiliki kecepatan dan jangkauan memadai, serta dipersenjatai dengan sembilan meriam 15 cm SK C/25 pada persenjataan utamanya."
 GER_light_cruiser_3: "Kelas M"
 GER_light_cruiser_3_desc: "Kapal penjelajah kelas M dirancang sebagai pengintai untuk skuadron penyerbu dagang. Enam kapal dipesan sebagai bagian dari Rencana Z, dengan dua kapal sempat dibangun sebelum pekerjaan dihentikan saat perang pecah. Persenjataan utamanya direncanakan berupa delapan meriam 150 mm dalam empat kubah kembar."
 GER_light_cruiser_4: "Kelas Q"
 GER_light_cruiser_4_desc: "Kapal penjelajah kelas Q adalah rancangan modifikasi dari kelas M. Mereka dirancang lebih besar daripada kelas M dengan persenjataan anti-pesawat yang lebih berat dan kendali tembakan yang ditingkatkan."
 GER_heavy_cruiser_1: "BlüKelas cher"
 GER_heavy_cruiser_1_desc: "Blücher adalah penjelajah lapis baja terakhir yang dibangun oleh Jerman. Rancangan kapal ini inovatif pada masanya dan membuka jalan bagi penjelajah tempur kelas Von der Tann di kemudian hari. Pada Perang Dunia I, kapal ini sudah usang. Blücher ditenggelamkan dalam Pertempuran Dogger Bank pada tahun 1915."
 GER_heavy_cruiser_2: "Kelas Hipper"
 GER_heavy_cruiser_2_desc: "Penjelajah berat Kelas Admiral Hipper adalah penjelajah berat pertama Kriegsmarine. Secara resmi berbobot benaman 10.000 ton, pada kenyataannya mereka berbobot lebih dari 16.000 ton. Mereka dipersenjatai dengan delapan meriam 8 inci dalam empat kubah kembar, dengan baterai sekunder berupa dua belas meriam 105 mm."
 GER_heavy_cruiser_3: "Prinz Kelas Eugen"
 GER_heavy_cruiser_3_desc: "Secara resmi merupakan bagian dari Kelas Hipper, subkelas Prinz Eugen menggabungkan banyak peningkatan, termasuk persenjataan anti-udara yang lebih berat. Dari tiga kapal dalam subkelas tersebut, hanya Prinz Eugen yang selesai dibangun. Kapal ini turut serta dalam penenggelaman HMS Hood selama Operasi Rheinübung. Setelah perang, kapal ini diserahkan kepada Amerika Serikat dan berdinas sebagai USS Prinz Eugen dalam uji coba bom atom Able dan Baker sebelum tenggelam di Atol Kwajalein pada tahun 1946."
 GER_heavy_cruiser_4: "Kelas P Cruiser"
 GER_heavy_cruiser_4_desc: "Kelas P adalah rancangan penjelajah berat besar, secara resmi ditetapkan sebagai Panzerschiff (Kapal Lapis Baja) oleh Kriegsmarine. Berbobot benaman hampir 24.000 ton, mereka akan 3.000 ton lebih ringan tetapi 55 meter lebih panjang daripada kapal tempur kelas New York AS. Persenjataannya terdiri dari enam meriam 280 mm dalam dua kubah tripel."
 GER_battle_cruiser_1: "Kelas Yorck"
 GER_battle_cruiser_1_desc: "Tiga kapal dari penjelajah tempur kelas Yorck dirancang sebagai respons terhadap Kelas Renown Inggris. Mereka direncanakan dipersenjatai dengan delapan meriam 380 mm dalam empat kubah kembar. Ketiga kapal mulai dibangun pada tahun 1916, namun tidak ada yang diselesaikan karena perang."
 GER_battle_cruiser_2: "Kelas O"
 GER_battle_cruiser_2_desc: "Pada tahun 1939, Kriegsmarine memutuskan untuk mengganti tiga kapal penjelajah kelas P yang direncanakan dengan penjelajah tempur. Hal ini menghasilkan penjelajah tempur kelas O, yang dipersenjatai dengan enam meriam 38 cm (15 inci) dalam tiga kubah kembar. Kapal-kapal ini dirancang dengan bobot benaman 35.400 ton dan kecepatan tertinggi 35 knot. Perintah konstruksi telah diberikan untuk tiga kapal di kelas ini, namun tidak ada yang mulai dibangun."
 GER_battleship_1: "Kelas Deutschland"
 GER_battleship_1_desc: "Menyusul Perjanjian Versailles, Jerman diizinkan untuk mempertahankan enam kapal tempur pra-dreadnought. Diklasifikasikan sebagai Linienschiffe (Kapal Tempur Garis Depan) oleh Kriegsmarine, hanya dua kapal dari Kelas Deutschland—tidak boleh disamakan dengan Kapal Tempur Saku kelas Deutschland berikutnya—yang tetap bertugas aktif hingga dekade 1930-an. Pada pukul 04:47 tanggal 1 September 1939, Schleswig-Holstein melepaskan tembakan pertama Perang Dunia II saat ia menembaki pangkalan Westerplatte di Danzig, Polandia."
 GER_battleship_2: "Kelas Scharnhorst"
 GER_battleship_2_desc: "Kapal tempur kelas Scharnhorst adalah kapal tempur modern pertama yang dibangun untuk Kriegsmarine. Mereka dibangun sebagai respons terhadap penjelajah tempur kelas Dunkerque Prancis, yang sendirinya merupakan respons terhadap Panzerschiffe (Kapal Tempur Saku) kelas Deutschland Jerman. Kelas Scharnhorst dipersenjatai dengan sembilan meriam 283 mm (11 inci) dalam tiga kubah tripel. Rencana telah dibuat untuk meningkatkan meriamnya dengan meriam kembar 380 mm (15 inci), tetapi seiring pecahnya perang, hal ini tidak pernah terwujud."
 GER_battleship_3: "Kelas Bismarck"
 GER_battleship_3_desc: "Dua kapal tempur kelas Bismarck adalah kapal perang terbesar yang dibangun untuk Kriegsmarine. Kapal-kapal ini dirancang sebagai tanggapan atas pembangunan kapal tempur baru Prancis, dengan persenjataan delapan meriam 38 cm (15 inci) yang serupa dengan Kelas Richelieu, namun menggunakan empat kubah kembar berbeda dengan dua kubah empat milik Richelieu. Bismarck terkenal karena menenggelamkan penjelajah tempur Inggris HMS Hood dalam Pertempuran Selat Denmark, namun kemudian diburu dan ditenggelamkan sebelum mencapai pelabuhan."
 GER_battleship_4: "Kelas Hindenburg"
 GER_battleship_4_desc: "Rencana Z Jerman membayangkan kekuatan sepuluh kapal tempur guna menantang kekuatan angkatan laut Britania Raya. Kelas H adalah serangkaian rancangan untuk enam kapal tempur yang dibutuhkan untuk memenuhi tuntutan rencana tersebut. Dua kapal dari rancangan H39 mulai dibangun pada saat pecahnya Perang Dunia II, namun pembangunannya dihentikan seiring perang dimulai. Tak satu pun kapal yang diberi nama resmi, namun Hindenburg diperkirakan sebagai nama yang memungkinkan bagi kapal pemimpin kelas tersebut. Jika kapal-kapal ini selesai, mereka akan menjadi versi peningkatan dari Kelas Bismarck, dengan baterai utama berupa delapan meriam 40,6 cm (16 inci)."
 GER_carrier_1: "Flugzeugdampfer I"
 GER_carrier_1_desc: "Dirancang pada tahun 1915, Proyek Flugzeugdampfer I (Kapal Uap Pesawat I) adalah konversi dari kapal penumpang Ausonia yang belum selesai menjadi kapal induk. Pembangunannya ditinggalkan pada akhir Perang Dunia I. Jika diselesaikan, kapal ini akan membawa campuran pesawat amfibi dan pesawat beroda dalam tiga hanggarnya serta berbobot benaman 12.500 ton."
 GER_carrier_2: "Kelas Seydlitz"
 GER_carrier_2_desc: "Seydlitz mulai dibangun sebagai kapal keempat dari penjelajah berat kelas Admiral Hipper. Selesai sebagian pada awal perang, kapal ini dipertimbangkan untuk dikonversi menjadi kapal induk. Proyek berkode Weser 1 ini sempat berjalan sebagian sebelum pekerjaannya dihentikan akibat meningkatnya serangan udara di Bremen serta kurangnya sumber daya untuk pembangunannya."
 GER_carrier_3: "Graf Kelas Zeppelin"
 GER_carrier_3_desc: "Graf Zeppelin adalah satu-satunya kelas kapal di Kriegsmarine yang dirancang khusus sebagai kapal induk sejak awal peletakan lunas. Dua kapal dipesan, tetapi tidak ada yang selesai dibangun. Sesuai rancangannya, Graf Zeppelin akan membawa 30 pesawat tempur Bf-109T dan 12 pengebom tukik Ju-87E, yaitu versi laut dari Bf-109E dan Ju-87D."
 GER_carrier_4: "Kelas Europa"
 GER_carrier_4_desc: "Beberapa kapal sipil dipertimbangkan untuk dikonversi menjadi kapal induk oleh Kriegsmarine pada tahun 1940-an. Yang terbesar di antaranya adalah kapal penumpang Europa. Sebagai kapal penumpang terbesar di Jerman, ia telah digunakan sebagai kapal barak dan kapal pengangkut pasukan sebelum pekerjaan konversi menjadi kapal induk dimulai. Jika selesai, kapal ini akan berbobot benaman 56.000 ton dan membawa kelompok udara berisi 42 pesawat."
 GER_SH_battleship_1: "Schlachtschiff H41"
 GER_SH_battleship_1_desc: "Rancangan kapal tempur H41 merupakan peningkatan dari rancangan H39 sebelumnya. Rancangan ini menuntut lapis baja yang jauh lebih kuat, sekat torpedo yang diperkuat, serta perlindungan untuk kemudi dan poros baling-baling kapal. Baterai utama ditingkatkan menjadi delapan meriam 42 cm, lebih besar dari yang diusulkan untuk kapal tempur Kelas Lion Britania Raya. Sesuai rancangannya, kapal-kapal ini akan memiliki bobot benaman hampir 70.000 ton."
 GER_SH_battleship_2: "Schlachtschiff H44"
 GER_SH_battleship_2_desc: "Kelas H44 adalah rancangan terakhir dari seri H Kapal Tempur. Tanpa batasan kaliber meriam atau bobot benaman, rancangan H42 hingga H44 memasang persenjataan dan perlindungan lapis baja yang semakin berat, berpuncak pada rancangan H44 seberat 131.000 ton yang dipersenjatai dengan delapan meriam 508 mm (20 inci)."
 ### ITA - ITALY ###
 ITA_submarine_1: "Kelas Mameli"
 ITA_submarine_1_desc: "Kelas Goffredo Mameli adalah kelas kapal selam sedang milik Regia Marina yang diluncurkan antara 1926 dan 1928. Mereka berbobot benaman tepat di bawah 800 ton dan memiliki kedalaman selam 100 m. Mereka menjadi dasar bagi model-model berikutnya seperti kelas Pisani, Bandiera, dan Squalo."
 #ITA_submarine_1b: "Bandiera Class"
 #ITA_submarine_1c: "Sirena Class"
 ITA_submarine_2: "Kelas Perla"
 ITA_submarine_2_desc: "Kapal selam kelas Perla dan kelas Adua dibangun pada tahun 1930-an. Mereka adalah subkelas ketiga dan keempat dari kapal selam Seri 600 yang dibangun oleh Italia. Mereka lebih kecil dibanding pendahulunya, berbobot benaman tepat di atas 600 ton."
 #ITA_submarine_2b: "Marcello Class"
 ITA_submarine_3: "Kelas Marconi"
 ITA_submarine_3_desc: "Kelas Marconi adalah kelas berisi enam kapal selam yang dibangun antara tahun 1939 dan 1940 serta meneruskan kapal selam Liuzzi sebelumnya. Kapal selam dari kedua kelas berbobot benaman sekitar 1.000 ton dan memiliki delapan tabung torpedo 533 mm. Hanya satu kapal dari gabungan kedua kelas ini yang selamat dari perang."
 #ITA_submarine_3b: "Plantino Class"
 ITA_submarine_4: "Pietro Kelas Calvi"
 ITA_submarine_4_desc: "Subkelas Pietro Calvi hanya melibatkan peningkatan kecil dari kelas Flutto sebelumnya, yang merupakan kelas kapal selam berukuran sedang. Hanya segelintir yang sempat diluncurkan, karena sebagian besar lambung kapal direbut oleh Jerman setelah gencatan senjata Italia. Versi rancang ulang dari Pietro Calvi akhirnya ditugaskan pada tahun 1961."
 ITA_destroyer_1: "Kelas Curtatone"
 ITA_destroyer_1_desc: "Perusak kelas Curtatone adalah perusak pertama yang dibangun di Italia setelah berakhirnya Perang Dunia I dan merupakan perusak pertama yang menggunakan dudukan meriam kembar. Kapal-kapal ini awalnya dipesan bersamaan dengan perusak kelas Palestro, namun ditunda karena kekurangan baja. Mereka berbobot benaman tepat di bawah 1.000 ton dan memasang empat meriam Schneider-Armstrong 102 mm."
 #ITA_destroyer_1b: "Navigatori Class"
 #ITA_destroyer_1c: "Maestrale Class"
 ITA_destroyer_2: "Kelas Soldati"
 ITA_destroyer_2_desc: "Kelas Soldati adalah kelompok kapal perusak yang dibangun pada akhir 1930-an. Terdapat dua angkatan. Dua belas kapal membentuk angkatan pertama pada 1938-39. Lima kapal diselesaikan pada angkatan kedua pada 1941-42. Angkatan pertama berbobot benaman tepat di atas 1.800 ton dan dipersenjatai dengan empat meriam Ansaldo 120 mm."
 ITA_destroyer_3: "Kelas Ciclone"
 ITA_destroyer_3_desc: "Perusak kelas Ciclone ditetapkan sebagai kapal boat torpedo tetapi sebenarnya lebih berfungsi sebagai perusak pengawal. Mereka adalah versi yang sedikit diperbesar dari kelas Orsa sebelumnya, berbobot benaman lebih dari 1.100 ton, serta memiliki stabilitas yang ditingkatkan dan persenjataan anti-kapal selam yang lebih berat."
 #ITA_destroyer_3b: "Ariete Class"
 ITA_destroyer_4: "Medaglie Kelas d'Oro"
 ITA_destroyer_4_desc: "Kelas Comandanti Medaglie d'Oro adalah kelompok kapal perusak yang direncanakan untuk Regia Marina tetapi tidak pernah diluncurkan hingga Gencatan Senjata Italia. Kapal-kapal ini jauh lebih besar dibanding perusak Italia sebelumnya, berbobot benaman hampir 2.100 ton. Mereka juga dipersenjatai dengan meriam Ansaldo 135 mm yang lebih besar dan memiliki mesin yang ditingkatkan."
 ITA_light_cruiser_1: "Kelas Taranto"
 ITA_light_cruiser_1_desc: "Penjelajah Taranto dan Bari adalah penjelajah era Perang Dunia I yang diperoleh dari Jerman sebagai pampasan perang. Keduanya berbobot benaman antara 4.500 dan 5.100 ton dan dipersenjatai dengan meriam Jerman 150 mm SK/45."
 #ITA_light_cruiser_1b: "Giussano Class"
 #ITA_light_cruiser_1c: "Montecuccoli Class"
 ITA_light_cruiser_2: "Duca degli Abruzzi"
 ITA_light_cruiser_2_desc: "Kelas Duca degli Abruzzi adalah subkelas kelima dari penjelajah ringan kelas Condottieri. Mereka dibangun sebelum Perang Dunia II untuk memperoleh keunggulan di Laut Mediterania. Mereka adalah kapal penjelajah ringan Italia terbesar yang ditugaskan selama perang, berbobot benaman lebih dari 9.400 ton. Mereka berlapis baja kuat dan memasang sepuluh meriam Ansaldo 152 mm."
 ITA_light_cruiser_3: "Capitani Kelas Romani"
 ITA_light_cruiser_3_desc: "Penjelajah ringan Capitani Romani pada dasarnya dirancang untuk mengungguli kecepatan dan daya tembak kapal perusak besar baru Prancis di akhir 1930-an. Dua belas lambung kapal dipesan pada akhir 1939, tetapi hanya tiga yang selesai sebelum gencatan senjata Italia pada 1943. Mereka berlapis baja tipis dan hanya berbobot benaman 3.700 ton, namun sangat cepat. Mereka memasang delapan meriam OTO/Ansaldo 135 mm."
 ITA_light_cruiser_4: "San Kelas Marco"
 ITA_light_cruiser_4_desc: "Kelas San Marco adalah versi peningkatan dari penjelajah ringan Capitani Romani terdahulu. Akibat gencatan senjata Italia, San Marco dan kapal saudarinya yang dirancang ulang, San Giorgio, baru ditugaskan pada dekade 1950-an."
 ITA_heavy_cruiser_1: "Kelas Trento"
 ITA_heavy_cruiser_1_desc: "Kelas Trento adalah rancangan kapal penjelajah berat Regia Marina dari akhir 1920-an. Mereka adalah kapal pertama yang dirancang khusus sesuai batasan Traktat Angkatan Laut Washington, yang membatasi penjelajah hingga 10.000 ton dan meriam 8 inci. Kapal terakhir di kelas ini, Bolzano, merupakan rancangan perbaikan yang diluncurkan pada 1932."
 #ITA_heavy_cruiser_1b: "Zara Class"
 ITA_heavy_cruiser_2: "San Kelas Giorgio"
 ITA_heavy_cruiser_2_desc: "Kelas San Giorgio adalah kelas penjelajah berat hipotetis antar-perang yang diperkirakan diluncurkan sesaat sebelum dimulainya perang. Kapal penjelajah ini akan berbobot benaman lebih dari 11.000 ton dan memasang delapan meriam Ansaldo 203 mm."
 ITA_heavy_cruiser_3: "Kelas Pisa"
 ITA_heavy_cruiser_3_desc: "Kelas Pisa adalah kapal penjelajah berat hipotetis dari era pertengahan perang. Kapal ini berbobot benaman sekitar 12.000 ton dan bertindak sebagai pemimpin dari satuan patrolinya sendiri."
 ITA_heavy_cruiser_4: "Kelas Garibaldi"
 ITA_heavy_cruiser_4_desc: "Kelas Garibaldi adalah kelas penjelajah berat hipotetis era akhir perang. Kapal ini berbobot benaman sekitar 14.000 ton, bersenjata lengkap dengan delapan meriam OTO/Ansaldo 203 mm, dan mampu mengimbangi sebagian besar kapal induk serta kapal utama lainnya."
 ITA_battle_cruiser_1: "Kelas Caracciolo"
 ITA_battle_cruiser_1_desc: "Kelas Francesco Caracciolo adalah kelas kapal utama yang diusulkan tepat setelah PD I. Kapal-kapal ini berbobot benaman sekitar 34.000 ton, berlapis baja kokoh, dan cukup cepat untuk ukuran serta eranya. Hanya satu kapal yang sempat diluncurkan, tetapi dibatalkan pada tahun 1921."
 ITA_battle_cruiser_2: "Principe Kelas Amedeo"
 ITA_battle_cruiser_2_desc: "Kelas Principe Amedeo adalah penjelajah tempur hipotetis yang diperkirakan diluncurkan sekitar akhir 1930-an. Kapal ini sebanding dengan penjelajah tempur Dunkerque Prancis, berbobot benaman sekitar 30.000 ton dan dipersenjatai dengan meriam 320 mm pada baterai utamanya."
 ITA_battleship_1: "Conte Di Kelas Cavour"
 ITA_battleship_1_desc: "Kapal tempur kelas Conte di Cavour ditugaskan selama Perang Dunia I. Mereka memiliki meriam Armstrong-Vickers 305 mm, berbobot benaman 23.000 ton, dan memiliki kecepatan tertinggi yang sebanding dengan kapal tempur era dreadnought lainnya. Mulai tahun 1933, dua kapal tersisa dari kelas ini menjalani perancangan ulang besar-besaran, meningkatkan ukuran, persenjataan, dan kinerjanya agar setara dengan kapal tempur 'cepat' yang baru bermunculan pada masa itu."
 ITA_battleship_2: "Caio Kelas Duilio"
 ITA_battleship_2_desc: "Kapal tempur kelas Caio Duilio awalnya ditugaskan pada awal Perang Dunia I. Namun kedua kapal menjalani perancangan ulang total antara tahun 1937 dan 1940. Model ini mewakili hasil perancangan ulang tersebut. Persenjataannya ditingkatkan menjadi sepuluh meriam 320 mm M1934, bobot benamannya menjadi 29.000 ton, dan kecepatannya cukup untuk mengklasifikasikannya sebagai kapal tempur 'cepat'."
 ITA_battleship_3: "Kelas Littorio"
 ITA_battleship_3_desc: "Kelas Littorio, juga dikenal sebagai kelas Vittorio Veneto, mewakili kapal tempur paling modern yang digunakan oleh Italia selama Perang Dunia II. Mereka berbobot benaman lebih dari 40.000 ton dan sangat cepat untuk ukurannya. Kapal-kapal ini membentuk tulang punggung armada Italia."
 ITA_battleship_4: "Kelas Impero"
 ITA_battleship_4_desc: "Kapal tempur Impero adalah kelas kapal tempur hipotetis era akhir perang. Mereka berbobot benaman sekitar 43.000 ton, dipersenjatai dengan meriam Ansaldo 381 mm, dan berlapis baja kokoh."
 ITA_carrier_1: "Giuseppe Kelas Miraglia"
 ITA_carrier_1_desc: "Kelas Giuseppe Miraglia adalah kelas kapal induk hipotetis era awal antar-perang. Kapal ini sebanding dengan kapal induk kelas Lexington AS dan kapal induk Kaga atau Akagi Jepang."
 ITA_carrier_2: "Kelas Falco"
 ITA_carrier_2_desc: "Falco adalah kelas kapal induk hipotetis Italia antar-perang. Kapal-kapal ini sebanding dengan kapal induk kelas Yorktown AS dan kapal induk Ark Royal Inggris. Mereka berbobot benaman sekitar 21.000 ton, memiliki lapis baja yang layak, dan membawa kapasitas pesawat rata-rata."
 ITA_carrier_3: "Kelas Aquila"
 ITA_carrier_3_desc: "Aquila adalah konversi terencana dari kapal penumpang samudra, Roma. Konversi tersebut direncanakan dimulai pada 1941, namun proyeknya tidak pernah selesai. Jika selesai, Aquila akan berbobot benaman 23.500 ton dan dapat dibandingkan dengan kapal induk kelas Hiyo Jepang serta kelas Indomitable Inggris."
 ITA_carrier_4: "Kelas Sparviero"
 ITA_carrier_4_desc: "Sparviero juga merupakan konversi terencana dari kapal penumpang samudra, Augustus. Konversi dimulai pada akhir 1942, namun tidak berjalan jauh. Jerman menenggelamkan sendiri kapal tersebut setelah merebutnya pasca-gencatan senjata Italia. Kapal induk ini seharusnya berbobot benaman 30.400 ton, cukup terlindungi baja, dan memiliki baterai pertahanan AA yang kuat."
 ITA_SH_battleship_1: "Regina Kelas Margherita"
 ITA_SH_battleship_1_desc: "Kelas Regina Margherita adalah kelas kapal tempur berat hipotetis yang diperkirakan diluncurkan sesaat sebelum perang dimulai. Mereka sebanding dengan kapal tempur kelas Yamato Jepang. Mereka akan berlapis baja sangat tebal, berbobot benaman sekitar 60.000 ton, dan dipersenjatai dengan meriam 406 mm."
 ITA_SH_battleship_2: "Regina Kelas Elena"
 ITA_SH_battleship_2_desc: "Kelas Regina Elena adalah kelas kapal tempur berat hipotetis yang diperkirakan diluncurkan sekitar waktu masuknya Italia ke dalam perang. Mereka sebanding dengan kapal tempur kelas Montana yang direncanakan oleh AS. Mereka berlapis baja sangat tebal, berbobot benaman lebih dari 70.000 ton, dan dipersenjatai dengan meriam 406 mm pada baterai utamanya."
 ### JAP - JAPAN ###
 JAP_submarine_1: "Kelas Kaichu"
 JAP_submarine_1_desc: "Kapal selam kelas Kaichū dibangun setelah PD I dan didasarkan pada kapal selam sebelumnya. Kapal selam berukuran sedang ini bersenjata memadai, memiliki jangkauan operasional yang baik serta kecepatan baik pada zamannya, namun pada tahun 1938 kapal ini sudah agak usang. Secara keseluruhan 42 kapal selam tipe Kaichū dibangun untuk IJN dan serinya mencakup 7 varian."
 #JAP_submarine_1b: "Kaidai III Class"
 JAP_submarine_2: "Kaidai Kelas VI"
 JAP_submarine_2_desc: "Kapal selam kelas Kaidai VI adalah kapal selam besar dan bersenjata lengkap dengan jangkauan jauh serta kecepatan yang relatif baik. Seluruh seri kapal selam Kaidai merupakan kapal yang stabil dan sukses bertugas di IJN sampai Perang Pasifik berakhir."
 JAP_submarine_3: "Ko/Otsu/Kelas Hei-gata"
 JAP_submarine_3_desc: "Kapal selam kelas Kō-gata, Otsu-gata, dan Hei-gata adalah kapal selam penjelajah berukuran besar yang bertugas sebagai kapal komando bagi skuadron kapal selam. Mereka dilengkapi dengan peralatan radio canggih, persenjataan torpedo berat, dan ukurannya yang lebih besar menghasilkan radius operasional yang luas. Kelas Kō-gata dan Otsu-gata juga membawa pesawat amfibi untuk peran pengintaian."
 #JAP_submarine_3b: "Ko/Otsu/Hei-gata Class (late)"
 JAP_submarine_4: "Kelas Sen-Toku"
 JAP_submarine_4_desc: "Kapal selam kelas Sen-Toku adalah kapal selam terbesar pada era PD II. Mereka adalah kapal selam induk pembawa pesawat dengan persenjataan torpedo berat, meriam AA ringan yang memadai, dan karena ukuran serta mesinnya, mereka relatif cepat dan berjangkauan jauh. Mereka mampu membawa tiga pesawat Aichi M6A Seiran untuk pengintaian dan kemampuan serang terbatas."
 #JAP_submarine_4b: "Sen-Taka Class"
 JAP_destroyer_1: "Kelas Minekaze"
 JAP_destroyer_1_desc: "Perusak kelas Minekaze, Kamikaze, dan Mutsuki bersenjata lengkap baik dengan meriam permukaan maupun torpedo pada zamannya, namun memiliki senjata AA yang terbatas. Mereka dianggap usang pada awal PD II dan sebagian besar dialihkan ke peran sekunder."
 #JAP_destroyer_1b: "Fubuki Class"
 JAP_destroyer_2: "Kelas Asashio"
 JAP_destroyer_2_desc: "Perusak kelas Asashio adalah kelas perusak Jepang pertama yang melampaui bobot benaman 2.000 ton dan yang pertama dilengkapi sonar. Mereka memiliki persenjataan torpedo berat dan meriam AA ringan yang memadai, serta radius operasional yang sedikit lebih besar daripada kelas Fubuki yang lebih tua."
 #JAP_destroyer_2b_ "Kagero Class"
 JAP_destroyer_3: "Kelas Akizuki"
 JAP_destroyer_3_desc: "Perusak kelas Akizuki bersenjata lengkap baik dengan meriam permukaan maupun torpedo, persenjataan AA yang memadai, serta peledak kedalaman ekstra yang sangat dibutuhkan. Dari 39 yang direncanakan hanya 12 yang selesai dibangun sebelum serinya dibatalkan."
 JAP_destroyer_4: "Kelas Shimakaze"
 JAP_destroyer_4_desc: "Kelas Shimakaze adalah perusak tercepat di dunia pada saat penyelesainnya. Kapal ini merupakan perusak prototipe untuk menguji turbin suhu tinggi dan tekanan tinggi yang baru. Kapal ini luar biasa cepat dan dipersenjatai dengan sangat banyak torpedo, tetapi hal ini berakibat pada radius operasional yang lebih kecil."
 JAP_light_cruiser_1: "Kelas Tenryu"
 JAP_light_cruiser_1_desc: "Kapal-kapal kelas Tenryū berbobot benaman sekitar 4.400 ton dan bersenjata ringan dibandingkan kapal serupa di angkatan laut lainnya, namun kecepatan yang baik dan persenjataan torpedo yang memadai menutupi kekurangan tersebut. Mereka dirancang untuk bertindak sebagai kapal bendera bagi flotila perusak, dan karenanya dianggap sebagai kelas perantara antara penjelajah ringan dan perusak."
 #JAP_light_cruiser_1b: "Kuma Class"
 #JAP_light_cruiser_1c: "Sendai Class"
 JAP_light_cruiser_2: "Light Kelas Mogami"
 JAP_light_cruiser_2_desc: "Penjelajah kelas Mogami bersenjata berat, dilengkapi lapis baja yang baik dan mesin bertenaga yang memberikan kecepatan tinggi. Mereka ditingkatkan kaliber meriamnya dari rancangan asli dan diklasifikasikan ulang sebagai penjelajah berat. Pertahanan AA yang baik dan kecepatan tinggi memastikan jangkauan operasional yang jauh."
 JAP_light_cruiser_3: "Kelas Agano"
 JAP_light_cruiser_3_desc: "Penjelajah ringan kelas Agano dirancang terutama sebagai pemimpin flotila untuk skuadron perusak. Mereka cepat, dipersenjatai dengan 3 meriam kembar 152 mm, tetapi persenjataan AA yang terbatas dan pelat lapis baja yang tipis merupakan kelemahan utama dari rancangan ini."
 #JAP_light_cruiser_3b: "Oyodo Class"
 JAP_light_cruiser_4: "Kelas Agatsuma"
 JAP_light_cruiser_4_desc: "Kelas Agatsuma adalah kelas penjelajah ringan yang tidak pernah melihat adanya kapal yang dibangun sebelum perang berakhir. Kapal-kapal penjelajah ini dirancang cepat dan bersenjata berat namun berlapis baja tipis, untuk melindungi armada dan kapal induk dari pesawat musuh."
 JAP_heavy_cruiser_1: "Kelas Furutaka"
 JAP_heavy_cruiser_1_desc: "Penjelajah berat kelas Furutaka dan kelas Aoba berikutnya adalah penjelajah berat pertama di Angkatan Laut Kekaisaran Jepang. Mereka dirancang menggunakan kelas Omaha AS dan kelas Hawkins Inggris sebagai acuan. Di kemudian hari, mereka dimodernisasi dan menerima persenjataan baru serta mesin yang lebih baik."
 #JAP_heavy_cruiser_1b: "Myoko Class"
 JAP_heavy_cruiser_2: "Heavy Kelas Mogami"
 JAP_heavy_cruiser_2_desc: "Kelas berat Mogami adalah kelas penjelajah ringan yang ditingkatkan meriamnya dan diklasifikasikan ulang. Hal ini menjadikannya penjelajah yang cepat, bersenjata berat, dan berlapis baja baik. Jangkauannya yang jauh harus mengorbankan perlindungan lapis baja yang lebih tipis."
 JAP_heavy_cruiser_3: "Kelas Tone"
 JAP_heavy_cruiser_3_desc: "Penjelajah berat kelas Tone awalnya dirancang sebagai penjelajah ringan, namun direvisi dengan persenjataan yang lebih berat. Kapal-kapal ini unik karena seluruh persenjataannya ditempatkan di bagian depan, sementara bagian belakang kapal digunakan untuk membawa dan merawat pesawat amfibi pengintai musuh."
 JAP_heavy_cruiser_4: "Kelas Ibuki"
 JAP_heavy_cruiser_4_desc: "Penjelajah berat kelas Ibuki adalah kapal penjelajah terakhir yang dibangun oleh Jepang sebelum akhir perang. Mereka adalah versi peningkatan dari penjelajah berat kelas Mogami, menampilkan tata letak dan persenjataan yang sama namun dengan persenjataan AA dan mesin yang lebih modern."
 JAP_battle_cruiser_1: "Kelas Amagi"
 JAP_battle_cruiser_1_desc: "Penjelajah tempur Amagi adalah serangkaian penjelajah tempur yang direncanakan sebagai bagian dari rencana ambisius Angkatan Laut Jepang untuk memiliki delapan kapal tempur dan delapan penjelajah tempur. Menyusul Traktat Angkatan Laut Washington, kapal-kapal Amagi dibesituakan, dan salah satunya dikonversi menjadi kapal induk."
 JAP_battle_cruiser_2: "Desain B-65"
 JAP_battle_cruiser_2_desc: "Penjelajah tempur Rancangan B-65 adalah kapal yang cepat dan berlapis baja sedang dengan senjata AA yang baik serta persenjataan modern. Dirancang untuk melawan penjelajah berat baru Angkatan Laut AS dan melindungi kapal induk armada IJN, kapal-kapal ini akan menjadi kekuatan yang disegani jika selesai dibangun."
 JAP_battleship_1: "Kelas Fuso"
 JAP_battleship_1_desc: "Kapal perang kelas Fuso dibangun selama Perang Dunia I dan dimodernisasi pada tahun 1930-an ketika Perjanjian Angkatan Laut London ke-1 melarang pembangunan kapal perang baru bagi para penandatangannya. Mereka mempunyai lapis baja dan persenjataan yang baik, dengan 6 menara kembar di garis tengah memberikan sisi lebar yang berat, namun juga membatasi persenjataan AA tambahan yang dapat dibawa oleh kapal-kapal ini."
 #JAP_battleship_1b: "Ise Class" (refit version)
 #JAP_battleship_1c: "Nagato Class" (refit version)
 JAP_battleship_2: "Kelas Kongo"
 JAP_battleship_2_desc: "Kapal tempur Kongō dibangun untuk IJN tepat sebelum Perang Dunia I sebagai penjelajah tempur, tetapi dimodernisasi secara besar-besaran pada akhir 1930-an dan diklasifikasikan ulang sebagai kapal tempur cepat kelas satu. Lapis baja, meriam, dan mesinnya semuanya ditingkatkan secara drastis, menjadikan kelas Kongō sebagai kapal tempur Jepang tercepat dalam perang."
 JAP_battleship_3: "Kelas Tajima"
 JAP_battleship_3_desc: "Kelas Tajima adalah kelas kapal tempur cepat hipotetis, yang dirancang lebih murah dan lebih cepat dibangun dibandingkan kapal tempur raksasa kelas Yamato. Mereka memanfaatkan meriam tua dari kapal tempur sebelumnya, namun kecepatan tinggi, lapis baja memadai, dan pertahanan AA menjadi perlindungan bagi kapal-kapal ini."
 JAP_battleship_4: "Kelas Iwami"
 JAP_battleship_4_desc: "Kelas Iwami adalah kelas kapal tempur hipotetis yang memanfaatkan metode baru untuk mempercepat konstruksi. Mereka bersenjata lengkap dengan meriam baru dan senjata AA berat, serta dapat menandingi daya tembak kapal sejenis lainnya. Namun, peningkatan ini menghasilkan kelas kapal yang lebih berat dan karenanya agak lebih lambat."
 JAP_SH_battleship_1: "Kelas Yamato"
 JAP_SH_battleship_1_desc: "Kelas Yamato terdiri dari kapal-kapal tempur terberat yang pernah dibuat, berbobot benaman 72.000 ton, dan dirancang untuk menjadi kebanggaan dan kekuatan angkatan laut Jepang di bawah rencana Dewi Perdamaian. Setiap kapal membawa sembilan meriam laut 460 milimeter, artileri laut terbesar yang pernah dipasang pada kapal perang."
 JAP_SH_battleship_2: "Super Kelas Yamato"
 JAP_SH_battleship_2_desc: "Kelas Super Yamato hipotetis menggunakan Yamato sebagai dasarnya, namun senjatanya akan jauh lebih kuat dengan persenjataan utama meriam 51 cm dan persenjataan AA mutakhir tipe terbaru. Ketebalan lapis bajanya dirancang untuk menahan bahkan proyektil dari meriamnya sendiri, dan akan berbobot benaman sekitar 70.000-80.000 ton."
 JAP_carrier_1: "Kelas Kaga"
 JAP_carrier_1_desc: "Kapal induk Kaga adalah kapal induk armada pertama Jepang. Ia awalnya merupakan kapal tempur, tetapi diselesaikan sebagai kapal induk. Hal ini menghasilkan kapal induk yang besar dan berlapis baja tebal dengan ruang terbatas untuk perbaikan. Meskipun demikian, ini adalah pengalaman penting dalam pembangunan kapal induk bagi Angkatan Laut Kekaisaran Jepang."
 #JAP_carrier_1b: "Akagi Class" (refit Kaga class)
 JAP_carrier_2: "Kelas Soryu"
 JAP_carrier_2_desc: "Sōryū dan Hiryū dirancang dengan suprastruktur anjungan (island) yang saling berkebalikan untuk mempercepat proses pendaratan pesawat saat berlayar berdampingan. Mereka adalah kapal induk cepat dengan ruang untuk kelompok udara besar, namun berlapis baja minim. Mereka berbobot benaman 20.000 ton dan mesin besar memberikan kecepatan tinggi serta jangkauan operasi yang jauh."
 #JAP_carrier_2b: "Hiryu Class"
 JAP_carrier_3: "Kelas Shokaku"
 JAP_carrier_3_desc: "Kapal induk kelas Shōkaku dirancang untuk kecepatan tinggi, radius operasi jauh, perlindungan berat, dan kapasitas pesawat yang besar, yang menjadikannya kapal induk luar biasa. Berkat metode konstruksi yang ditingkatkan, mereka berbobot benaman 33.000 ton pada muatan penuh, dan dapat bertahan dari lebih banyak kerusakan daripada kebanyakan kapal induk sezamannya."
 #JAP_carrier_3b: "Hiyo Class"
 JAP_carrier_4: "Kelas Taiho"
 JAP_carrier_4_desc: "Kapal induk kelas Taihō adalah kapal induk pertama IJN yang berlapis baja penuh, dengan dek penerbangan berlapis baja untuk menahan beberapa hantaman bom dan torpedo serta tetap berfungsi efektif. Kelompok udara yang besar dan persenjataan AA berat akan memberikan tidak hanya pertahanan diri tetapi juga proyeksi kekuatan terhadap pasukan musuh."
 #JAP_carrier_4b: "Shinano Class"
 ### SOV - SOVIET UNION ###
 SOV_submarine_1: "Kelas AG"
 SOV_submarine_1_desc: "Kapal selam kelas Amerikansky Golland (Holland Amerika) dibangun di Kanada, kemudian dikirim ke Rusia selama PD I, di mana mereka akhirnya dirakit. Mereka adalah tiruan langsung dari kapal selam tipe Holland yang sukses. Mereka dirancang sebagai kapal laut yang andal dan bersenjata lengkap untuk zamannya."
 #SOV_submarine_1b: "Series I Debakrist"
 SOV_submarine_2: "Seri V Shchuka"
 SOV_submarine_2_desc: "Kapal selam Seri V dari kelas Shchuka adalah kapal selam terbanyak kedua di Angkatan Laut Soviet. Jumlahnya yang banyak berasal dari penempatannya di empat armada Uni Soviet: Laut Hitam, Baltik, Utara, dan Pasifik. Mereka adalah kapal selam patroli berukuran sedang dengan persenjataan torpedo dan kelaiklautan yang baik."
 #SOV_submarine_2b: "Series IX Srednyaya" (Stalinets<-unofficial name)
 #SOV_submarine_2c: "Series X Shchuka"
 SOV_submarine_3: "Series XIV Kelas K"
 SOV_submarine_3_desc: "Kapal selam Seri XIV adalah kapal selam penjelajah besar dengan jangkauan lebih jauh. Mereka pada dasarnya merupakan versi peningkatan dari kelas Pravda Seri IV. Kapal selam ini menampilkan persenjataan berat berupa meriam permukaan dan torpedo. Mereka memiliki jangkauan jauh namun kelaiklautannya hanya tergolong cukup."
 SOV_submarine_4: "Proyek 611"
 SOV_submarine_4_desc: "Kapal selam Proyek 611 (Nama sandi NATO: Zulu) adalah kelas kapal selam pertama Angkatan Laut Soviet yang dibangun setelah PD II. Rancangannya didasarkan pada kapal selam Tipe XXI Jerman, dan dimaksudkan untuk menggantikan kapal kelas K Seri XIV yang lebih tua. Mereka adalah kapal selam penjelajah samudra besar dengan persenjataan torpedo berat dan jangkauan jauh. Mereka digunakan sebagai dasar untuk kapal selam penerus Proyek 613 (Nama sandi NATO: Whiskey) dan Proyek 641 (Nama sandi NATO: Foxtrot)."
 SOV_destroyer_1: "Kelas Orfey"
 SOV_destroyer_1_desc: "Perusak kelas Orfey adalah versi peningkatan dari kelas Novik sebelumnya. Mereka menampilkan persenjataan permukaan dan AA yang memadai untuk ukurannya, jangkauan agak pendek, namun berkecepatan baik dan berpersenjataan torpedo berat. Kelas penerus Fidonisy dan Izyaslav merupakan versi yang lebih disempurnakan lagi dari kelas ini dengan peningkatan persenjataan utama dan ukuran lambung."
 #SOV_destroyer_1b: "Leningrad & Minsk Class"
 SOV_destroyer_2: "Kelas Gnevny"
 SOV_destroyer_2_desc: "Perusak kelas Gnevny (Proyek 7) diizinkan dalam program pembuatan kapal 1933-1938. Kelas ini sangat dipengaruhi oleh perusak Italia Maestrale dan dianggap sebagai rancangan yang sukses. Bobot benamannya berada pada kisaran 1.600-2.000 ton, bersenjata lengkap, dan memiliki persenjataan AA serta torpedo yang memadai. Berkat mesin yang kuat, mereka adalah kapal yang cepat namun berjangkauan pendek."
 SOV_destroyer_3: "Kelas Soobrazitelnyi"
 SOV_destroyer_3_desc: "Perusak kelas Soobrazitelny (Proyek 7U) adalah versi peningkatan dari kelas Gnevny sebelumnya. Mesinnya dirancang ulang dan memiliki persenjataan AA yang lebih kuat. Mereka berbobot benaman antara 1.900 dan 2.400 ton, serta kecepatan dan jangkauannya serupa dengan kelas Gnevny."
 #SOV_destroyer_3b: "Ognevoy Class"
 SOV_destroyer_4: "Kelas Skoryi"
 SOV_destroyer_4_desc: "Kelas Skory (Proyek 30bis) merupakan penyempurnaan lebih lanjut dari kelas Ognevoy. Peningkatan ukuran dan bobot benaman (2.500-3.100 ton) menghasilkan kapal yang lebih stabil dengan jangkauan operasional yang lebih luas. Semua kapal dibangun setelah Perang dengan rancangan modular yang menghasilkan waktu konstruksi dan penempatan yang cepat. Persenjataannya sama dengan kelas Ognevoy sebelumnya, tetapi meriam utama ditempatkan dalam kubah kembar alih-alih kubah tunggal."
 SOV_light_cruiser_1: "Krasniy Kelas Krym"
 SOV_light_cruiser_1_desc: "Penjelajah kelas Krasny Krym, awalnya penjelajah kelas Svetlana, mulai dibangun sebelum PD I namun perang dan revolusi yang menyusul menunda penyelesaian seluruh kelas tersebut. Pada pertengahan hingga akhir 1920-an, ia akhirnya ditugaskan ke dalam Angkatan Laut Soviet bersama saudari seperguruannya Chervona Ukraina (eks-Admiral Nakhimov). Kapal-kapal ini adalah penjelajah bertenaga turbin pertama milik Angkatan Laut Kekaisaran Rusia. Mereka adalah penjelajah bersenjata berat dan berlapis baja baik untuk zamannya."
 SOV_light_cruiser_2: "Kelas Komsomolets"
 SOV_light_cruiser_2_desc: "Penjelajah ringan kelas Komsomolets adalah serangkaian kapal hipotetis. Mereka semacam perpaduan antara teknologi lama dan baru. Menggunakan lambung yang belum selesai dari kelas Svetlana dan Admiral Nakhimov, biaya konstruksi kapal berhasil ditekan. Dilengkapi dengan enam kubah kembar berisi meriam kaliber perusak yang lebih kecil dan persenjataan AA yang memadai, kapal ini cocok untuk peran pengintaian dan pemimpin flotila perusak. Tampilan keseluruhan kapal memiliki kemiripan dengan penjelajah kelas Kirov."
 SOV_light_cruiser_3: "Kelas Chapayev"
 SOV_light_cruiser_3_desc: "Penjelajah kelas Chapayev (Proyek 68) didasarkan pada penjelajah kelas Kirov (Proyek 26) dan diizinkan dalam program pembuatan kapal 1938-43. Sebagai penjelajah ringan sejati pertama dari angkatan laut Soviet, mereka membawa persenjataan anti-permukaan dan anti-udara yang kuat bersama dengan persenjataan torpedo yang memadai. Secara keseluruhan, mereka adalah kapal yang bagus dengan sabuk lapis baja tebal, kecepatan tinggi, jangkauan operasional baik, dan bobot benaman 10.500 hingga 14.000 ton. Akibat perang dan invasi pasukan Jerman, banyak kapal di kelas ini dibatalkan dan sisanya baru diselesaikan setelah permusuhan berakhir."
 SOV_light_cruiser_4: "Kelas Sverdlov"
 SOV_light_cruiser_4_desc: "Penjelajah kelas Sverdlov (Proyek 68bis) adalah penjelajah meriam terakhir dari Angkatan Laut Soviet dan merupakan versi perbaikan dari kelas Chapayev sebelumnya. Dibandingkan dengan Chapayev, mereka memiliki persenjataan utama, permesinan, dan perlindungan lapis baja yang sama, tetapi memiliki kapasitas bahan bakar yang bertambah untuk jangkauan lebih jauh, perlindungan bawah air yang ditingkatkan, baterai anti-pesawat yang diperbanyak, dan kelaiklautan yang sedikit lebih baik. Mereka dirancang untuk peran berburu konvoi dan pengawalan kapal utama. Karena munculnya era rudal, banyak kapal yang dibatalkan atau tidak diselesaikan."
 SOV_heavy_cruiser_1: "Krasniy Kelas Kavkaz"
 SOV_heavy_cruiser_1_desc: "Penjelajah Krasny Kavkaz, yang awalnya merupakan penjelajah ringan kelas Admiral Nakhimov, adalah saudari sekeluarga dari Chervona Ukraina. Krasny Kavkaz diselesaikan dengan rancangan modifikasi yang mencakup meriam berkaliber lebih besar 180 mm dan persenjataan AA yang lebih kuat. Karena ia merupakan hasil pembangunan ulang penjelajah ringan, lapis bajanya lebih tipis dibandingkan penjelajah berat di angkatan laut lainnya."
 SOV_heavy_cruiser_2: "Kelas Kirov"
 SOV_heavy_cruiser_2_desc: "Penjelajah kelas Kirov (Proyek 26) adalah penjelajah modern pertama Angkatan Laut Soviet. Rancangannya didasarkan pada penjelajah ringan Italia kelas Raimondo Montecuccoli dan dibangun sebagai bagian dari program pembuatan kapal 1933-1938. Kapal-kapal ini berbobot benaman antara 7.700 dan 9.200 ton. Mereka dipersenjatai dengan meriam 180 mm baru dalam 3 kubah tripel dan baterai AA yang kokoh. Mesinnya yang kuat memberikan kecepatan baik dan jangkauan operasi yang dapat diterima, sementara sabuk lapis bajanya tipis dibanding penjelajah berat lainnya."
 #SOV_heavy_cruiser_2b: "Maxim Gorky Class"
 SOV_heavy_cruiser_3: "Proyek 22"
 SOV_heavy_cruiser_3_desc: "Penjelajah berat Proyek 22 dirancang pada pertengahan 1930-an untuk menandingi kapal serupa di negara-negara tetangga. Rancangan ini menuntut kapal berukuran lebih besar dengan bobot benaman antara 15.500 dan 17.000 ton. Mereka dilengkapi dengan empat kubah tripel meriam 240 mm untuk melawan kapal penjelajah musuh, persenjataan AA berat untuk pertahanan diri, dan skuadron pesawat intai yang lebih besar untuk mendeteksi musuh. Tugas utamanya adalah mengintai armada musuh dan memburu konvoi. Biaya kapal dan pengalihan sumber daya untuk kebutuhan lain berujung pada pembatalan proyek ini."
 SOV_heavy_cruiser_4: "Proyek 66"
 SOV_heavy_cruiser_4_desc: "Penjelajah berat Proyek 66 adalah upaya terakhir Angkatan Laut Soviet untuk merancang dan membangun penjelajah murni berbasis meriam. Studi perancangan dimulai pada 1943 dan versi finalnya muncul setelah perang. Kapal-kapal ini akan menampilkan meriam 220 mm dalam 3 kubah tripel dan persenjataan AA yang kuat. Bobot benamannya setidaknya 26.500 ton. Hadirnya era rudal dan kematian Joseph Stalin menyebabkan proyek ini dihentikan."
 SOV_battle_cruiser_1: "Kelas Borodino"
 SOV_battle_cruiser_1_desc: "Penjelajah tempur kelas Borodino adalah kelas berisi empat kapal yang diizinkan pada 1914, tepat sebelum PD I. Mereka didasarkan pada kapal tempur kelas Imperatritsa Mariya. Mereka mengikuti praktik pembuatan kapal utama Rusia sezaman yang menggunakan empat kubah tripel untuk menampung persenjataan utama berat, persenjataan sekunder yang kuat di casemate, dan dek rata secara keseluruhan. Profilnya rendah dengan sarat air dangkal untuk bertempur di perairan dangkal Laut Baltik. Seperti banyak kapal Rusia pada periode ini, pecahnya PD I dan Revolusi Rusia membuat kapal-kapal ini tidak pernah diselesaikan."
 SOV_battle_cruiser_2: "Kelas Kronshtadt"
 SOV_battle_cruiser_2_desc: "Penjelajah tempur kelas Kronshtadt (Proyek 69) diizinkan dalam program pembuatan kapal 1938-43 dan dijadwalkan selesai pada dekade 1940-an. Rancangan awal ditujukan untuk penjelajah berat berukuran besar seberat 23.000 ton, tetapi setelah informasi mengenai penjelajah tempur Scharnhorst Jerman diterima, kapal-kapal tersebut dirancang ulang agar berbobot benaman hingga 35.000 ton. Ketika permusuhan pecah antara Jerman dan Uni Soviet, konstruksi kapal dihentikan dan akhirnya dibatalkan. Rencana alternatif mengusulkan penyelesaian lambung kapal yang belum selesai sebagai kapal induk di bawah Proyek 69AV."
 SOV_battleship_1: "Kelas Marat"
 SOV_battleship_1_desc: "Kapal tempur kelas Marat (awalnya kelas Gangut) adalah kapal tempur era PD I dan Dreadnought pertama yang berdinas di Angkatan Laut Kekaisaran Rusia. Rancangan dan tata letak kubahnya menjadi dasar bagi semua kelas kapal tempur dan penjelajah tempur berikutnya. Hanya tiga kapal yang selamat dari kekacauan Revolusi Rusia. Mereka dimodernisasi dan diperbarui selama 1930-an, menghasilkan suprastruktur tinggi yang hampir menyerupai pagoda. Mereka memiliki perangkat elektronik modern dan persenjataan AA yang kuat."
 SOV_battleship_2: "Proyek 21"
 SOV_battleship_2_desc: "Kapal tempur Proyek 21 dirancang pada pertengahan 1930-an untuk menjadi bagian dari Angkatan Laut Penjelajah Samudra gagasan Stalin. Mereka akan sangat mirip dengan kapal tempur kelas Nelson Inggris. Kapal-kapal ini akan berbobot benaman sekitar 41.000 ton, dipersenjatai dengan sembilan meriam 406 mm dalam 3 kubah tripel (semua di haluan), dan persenjataan sekunder berupa dua belas meriam 152 mm. Persenjataan AA yang baik dan lapis baja tebal memberikan pertahanan kokoh terhadap target udara dan permukaan. Proyek ini akhirnya dibatalkan namun sebagian elemennya digunakan pada kapal tempur kelas Sovetsky Soyuz (Proyek 23)."
 SOV_battleship_3: "Kelas Lenin"
 SOV_battleship_3_desc: "Kapal tempur kelas Lenin adalah rancangan hipotetis untuk menandingi kapal tempur Bismarck Jerman dan kelas South Dakota AS. Sembilan meriam 406 mm dalam 3 kubah tripel akan memberikan daya tembak yang memadai, sementara meriam AA 130 mm, lapis baja tebal, dan mesin besar akan memastikan daya tahannya dalam pertempuran."
 SOV_battleship_4: "Kelas Stalingrad"
 SOV_battleship_4_desc: "Kapal utama kelas Stalingrad (Proyek 82) dimaksudkan untuk menyediakan daya tembak utama bagi angkatan laut Soviet di era pasca-PD II. Mereka adalah kapal yang cepat, bersenjata lengkap, dan berlapis baja tebal. Konstruksi dimulai setelah perang, namun kematian Joseph Stalin menyebabkan pembatalan kapal-kapal ini, meskipun sempat ada proyek untuk menyelesaikan setidaknya satu kapal sebagai rancangan modifikasi yang dilengkapi dengan rudal V-2 Soviet."
 SOV_SH_battleship_1: "Sovetsky Kelas Soyuz"
 SOV_SH_battleship_1_desc: "Kelas Sovetsky Soyuz (Proyek 23) adalah kelas kapal tempur terakhir yang dibangun oleh galangan kapal Soviet dan diizinkan dalam program pembuatan kapal 1938-43. Empat kapal direncanakan dengan bobot benaman standar 59.000 ton, tiga kubah tripel pembawa meriam 406 mm, serta persenjataan sekunder dan AA berat. Mereka juga memiliki mesin yang kuat untuk mengakomodasi sabuk lapis bajanya yang sangat tebal. Pecahnya perang mencegah kapal-kapal ini untuk diselesaikan."
 SOV_SH_battleship_2: "Proyek 23bis"
 SOV_SH_battleship_2_desc: "Kapal tempur kelas Proyek 23bis adalah versi modifikasi dan peningkatan dari kelas Sovetsky Soyuz (Proyek 23) sebelumnya. Dibandingkan dengan pendahulunya, mereka membawa empat kubah tripel dengan meriam kaliber 406 mm yang sama, sabuk lapis baja yang dipertebal, tata letak meriam sekunder yang direvisi, serta persenjataan AA yang lebih kuat."
 SOV_carrier_1: "Kelas Ismail"
 SOV_carrier_1_desc: "Kapal induk kelas Izmail adalah konversi langsung dari lambung penjelajah tempur kelas Borodino senamanya yang belum selesai. Mengingat sifat konversinya, kapal ini akan memiliki sabuk lapis baja yang tebal serta persenjataan anti-permukaan dan AA yang kuat untuk zamannya. Kelompok udara berukuran sedang akan menyediakan perlindungan udara yang diperlukan armada. Proyek ini tidak terlaksana karena masalah biaya dan kondisi industri pembuatan kapal Soviet pasca-Revolusi Oktober."
 SOV_carrier_2: "Krasnyi Vozdukh"
 SOV_carrier_2_desc: "Kapal induk kelas Krasny Vozdukh adalah rancangan hipotetis untuk memberikan proyeksi udara armada bagi angkatan laut Soviet. Ukurannya serupa dengan kelas Ark Royal Inggris atau kelas Hiryū Jepang tetapi membawa meriam sekunder tambahan untuk target permukaan serta meriam AA yang memadai untuk payung udara. Peningkatan lapis baja mengakibatkan sedikit berkurangnya kapasitas pesawat dibandingkan kelas-kelas tersebut."
 SOV_carrier_3: "Proyek 71B"
 SOV_carrier_3_desc: "Kapal induk Proyek 71B dirancang pada pertengahan hingga akhir 1930-an. Mereka direncanakan untuk memberikan payung udara bagi armada permukaan baru yang diperintahkan Stalin dalam rencananya. Dua kapal direncanakan berbobot benaman sekitar 30.000 ton, memiliki persenjataan AA yang kuat, lapis baja baik, dan kelompok udara yang memadai. Invasi Jerman menyebabkan pembatalan konstruksi kapal-kapal ini."
 SOV_carrier_4: "Proyek 72"
 SOV_carrier_4_desc: "Kapal induk Proyek 72 adalah versi peningkatan dari kapal Proyek 71 sebelumnya. Studi perancangan selesai pada awal 1940-an menghasilkan kapal yang lebih besar dengan lapis baja lebih tipis. Ruang ekstra digunakan untuk memasang persenjataan AA yang lebih kuat dan menyediakan kemampuan untuk membawa kelompok udara yang lebih besar."
 ### USA - USA ###
 USA_submarine_1: "Kelas S"
 USA_submarine_1_desc: "Kapal selam tipe S, umumnya dikenal sebagai Sugar Boats, adalah serangkaian 51 kapal selam yang dirancang dan dibangun pada dekade 1920-an. Dibandingkan dengan kapal selam seri O & R era PD I, tipe S lebih besar sehingga memungkinkan jangkauan lebih jauh dan lebih banyak amunisi torpedo cadangan, meskipun kelas ini hanya memiliki empat tabung 21 inci yang menghadap ke depan. Terlepas dari usianya, dengan kapal tipe S terakhir ditugaskan pada 1924, kapal selam ini mencakup porsi yang signifikan dari kekuatan kapal selam aktif Angkatan Laut AS."
 #USA_submarine_1b: "Barracuda Class"
 USA_submarine_2: "Kelas Porpoise"
 USA_submarine_2_desc: "Kapal selam Kelas Porpoise adalah kapal selam modern pertama Angkatan Laut AS yang dirancang dan dibangun menyusul serangkaian uji coba \"V Boats\" pada akhir 20-an dan awal 30-an. Meskipun awalnya terdapat masalah dengan propulsi serba-listrik, kelas ini menjanjikan dan dipertimbangkan untuk rancangan masa depan. Kelas ini dipersenjatai dengan 6 tabung torpedo dan satu meriam geladak 3 inci."
 #USA_submarine_2b: "Salmon Class"
 USA_submarine_3: "Kelas Tambor"
 USA_submarine_3_desc: "Kelas Tambor adalah puncak dari bertahun-tahun eksperimen Angkatan Laut AS dalam perancangan kapal selam untuk memenuhi peran \"Kapal Selam Armada\" dan berkinerja baik di perairan Samudra Pasifik. Persenjataan ditingkatkan menjadi 10 tabung torpedo dengan empat di antaranya menembak ke buritan, satu meriam geladak 3 inci, dan dua senjata AA untuk perlindungan tambahan."
 #USA_submarine_3b: "Gato Class"
 USA_submarine_4: "Kelas Balao"
 USA_submarine_4_desc: "Kelas Balao merupakan kelanjutan dari rancangan yang berakar pada kelas Tambor. Peningkatan hadir dalam bentuk penguatan lambung dan peningkatan meriam geladak menjadi kaliber 5 inci/24 bersama berbagai penyempurnaan desain yang mendetail."
 USA_destroyer_1: "Kelas Clemson"
 USA_destroyer_1_desc: "Perusak Kelas Clemson melanjutkan banyak elemen rancangan dari pendahulu langsungnya, Kelas Wickes. Clemson memiliki pengendalian laut yang lebih baik dibanding Kelas Wickes dan dipersenjatai dengan meriam utama 4 inci/50 kaliber, senjata AA 3 inci/23 kaliber, serta 12 tabung torpedo. Kelas ini menua dan hampir usang, tetapi masih membentuk sebagian besar kekuatan kapal perusak Angkatan Laut AS."
 #USA_destroyer_1b: "Farragut Class"
 USA_destroyer_2: "Kelas Sims"
 USA_destroyer_2_desc: "Kelas Sims adalah rancangan \"1500 Tonner\" terbesar dengan susunan torpedo yang lebih ramping dan lambung yang lebih panjang. Peningkatan kendali tembakan memberikan kemampuan serang yang lebih baik dengan meriam 5 inci/38 kalibernya dan mencakup 12 tabung torpedo di garis tengah."
 #USA_destroyer_2b: "Benson & Gleaves Class"
 USA_destroyer_3: "Kelas Fletcher"
 USA_destroyer_3_desc: "Kelas Fletcher mewakili langkah maju yang besar dalam hal kemampuan kapal perusak, terutama berkat peningkatannya menjadi 2.500 ton. Sambil mempertahankan meriam dwiguna 5 inci/38 dan susunan torpedo garis tengah, kelas ini menambahkan satu kubah tunggal tambahan dan menerima peningkatan signifikan dalam persenjataan AA serta jangkauan yang lebih jauh dan bobot benaman yang lebih besar."
 USA_destroyer_4: "Allen M Kelas Sumner"
 USA_destroyer_4_desc: "Kelas Sumner melanjutkan Kelas Fletcher dengan bobot benaman yang hanya meningkat sedikit. Kapal ini mampu membawa lebih banyak persenjataan, mendapatkan meriam ganda 5 inci/38 kaliber dan persenjataan AA yang jauh lebih banyak. Penambahan kemudi kedua memungkinkan kemampuan manuver yang lebih baik selama operasi ASW."
 USA_light_cruiser_1: "Kelas Omaha"
 USA_light_cruiser_1_desc: "Kelas Omaha awalnya dirancang untuk mengisi peran pengintaian penting dalam armada PD I Angkatan Laut AS. Sebagai kelas yang cepat dan tangguh, Kelas Omaha dipersenjatai dengan muatan meriam 6 inci/53 kaliber yang tangguh dalam konfigurasi kubah 8x1 dan 2x2 serta enam peluncur torpedo. Kelas Omaha sudah menua namun mencakup sebagian besar kekuatan penjelajah ringan Angkatan Laut AS."
 USA_light_cruiser_2: "Kelas Brooklyn"
 USA_light_cruiser_2_desc: "Kelas Brooklyn dirancang dengan mempertimbangkan batasan Traktat Angkatan Laut Washington sehingga dibatasi pada meriam 6 inci. Untuk memaksimalkan daya tembak, Brooklyn dipersenjatai dengan 15 meriam 6 inci Mk16 baru dalam kubah tripel. Rancangan keseluruhannya sangat seimbang dan dianggap sebagai dasar bagi seluruh rancangan kapal penjelajah masa depan Angkatan Laut AS."
 USA_light_cruiser_3: "Kelas Cleveland"
 USA_light_cruiser_3_desc: "Kelas Cleveland didasarkan pada Kelas Brooklyn, tetapi tanpa pembatasan Traktat Angkatan Laut Washington. Kelas Cleveland mempertahankan konfigurasi 12 meriam utama 6 inci, namun meningkatkan persenjataan sekunder 5 inci secara besar-besaran dan menambahkan senjata AA ekstra."
 USA_light_cruiser_4: "Kelas Fargo"
 USA_light_cruiser_4_desc: "Kelas Fargo menyempurnakan Kelas Cleveland yang sukses. Kapal ini menawarkan bidang tembak AA yang lebih baik berkat rancangan suprastruktur berbentuk piramida yang lebih optimal."
 USA_heavy_cruiser_1: "Kelas Pensacola"
 USA_heavy_cruiser_1_desc: "Kelas Pensacola dirancang di bawah pembatasan Traktat Angkatan Laut Washington, dan berusaha memaksimalkan daya tembak di bawah pembatasan meriam 8 inci. Kapal ini dipersenjatai dengan persenjataan tangguh berupa 10 x meriam 8 inci/55 kaliber. Lapis baja lambungnya tipis dan rancangannya berat di atas namun tetap tangguh. Kapal ini membentuk sebagian besar kekuatan penjelajah berat Angkatan Laut AS."
 #USA_heavy_cruiser_1b: "Portland Class"
 USA_heavy_cruiser_2: "Kelas Wichita"
 USA_heavy_cruiser_2_desc: "Kapal-kapal Kelas Wichita menyempurnakan persenjataan dari Kelas Pensacola dan variannya dengan desain kubah baru untuk meriam 8 inci/55 kaliber serta meningkatkan bidang tembak untuk persenjataan sekunder meriam 5 inci/38."
 USA_heavy_cruiser_3: "Kelas Baltimore"
 USA_heavy_cruiser_3_desc: "Kelas Baltimore memadukan unsur-unsur paling sukses dari rancangan penjelajah terdahulu dan sebagian besar didasarkan pada penjelajah ringan Kelas Brooklyn yang digabungkan dengan konfigurasi persenjataan serta lapis baja dari USS Wichita."
 USA_heavy_cruiser_4: "Oregon Kelas City"
 USA_heavy_cruiser_4_desc: "Kapal penjelajah Kelas Oregon City memberikan peningkatan menyeluruh dan bertahap atas Kelas Baltimore. Yang paling menonjol adalah perubahan pada suprastruktur yang memungkinkan bidang tembak AA lebih baik. Peningkatan serupa juga ditemukan dari kelas penjelajah ringan Cleveland ke Oregon City."
 USA_battle_cruiser_1: "Kelas Lexington"
 USA_battle_cruiser_1_desc: "Kelas Lexington awalnya merupakan reaksi terhadap penjelajah tempur kelas Kongō Jepang. Dipesan berdasarkan Undang-Undang Angkatan Laut 1916, kapal-kapal ini dimaksudkan untuk membawa meriam 16 inci dalam kubah ganda dan mampu melaju hingga 33 knot. Setelah pembangunan dimulai, AS menyepakati Traktat Angkatan Laut Washington dan USS Lexington serta USS Saratoga dikonversi menjadi Kapal Induk."
 USA_battle_cruiser_2: "Kelas Alaska"
 USA_battle_cruiser_2_desc: "Kelas Alaska adalah respons terhadap kapal tempur saku Jerman dan terlebih lagi terhadap \"penjelajah super\" Jepang. Dirancang untuk membawa meriam 12 inci dan menahan tembakan peluru hingga 10 inci, kelas ini mampu melaju dengan kecepatan penjelajah namun mengorbankan perlindungan bawah air."
 USA_battleship_1: "New Kelas York"
 USA_battleship_1_desc: "Kapal tempur Kelas New York adalah kapal tempur pertama AS yang dipersenjatai meriam utama 14 inci/45. Berbagai meriam 5 inci/51 menjadi persenjataan sekunder didukung perisai baja lebih dari 10 inci."
 #USA_battleship_1b: "Pennsylvania Class"
 #USA_battleship_1c: "New Mexico Class"
 USA_battleship_2: "North Kelas Carolina"
 USA_battleship_2_desc: "Kelas North Carolina merupakan rancangan kapal tempur baru pertama AL AS dalam 20 tahun. Dibatasi 36.000 ton sesuai Traktat Washington, kapal ini dipersenjatai meriam 16 inci/45 dan lapis baja kokoh untuk mengawal kapal induk cepat."
 #USA_battleship_2b: "South Dakota Class"
 USA_battleship_3: "Kelas Iowa"
 USA_battleship_3_desc: "Kelas Iowa memadukan inovasi Kelas North Carolina dengan peningkatan bobot dan kecepatan taktis yang tinggi. Bertugas mengawal gugus kapal induk dan dirancang sebagai pembasmi kapal penjelajah musuh."
 USA_battleship_4: "Kelas Illinois"
 USA_battleship_4_desc: "Kelas Illinois menyempurnakan rancangan Kelas Iowa dengan memprioritaskan kecepatan dan daya tembak. Membawa hingga 12 meriam 16 inci/50 serta kubah kembar 5 inci serbaguna untuk perlindungan antipesawat maksimal."
 USA_carrier_1: "Kelas Lexington"
 USA_carrier_1_desc: "Kapal induk Kelas Lexington dikonversi dari dua lambung penjelajah tempur guna mematuhi Traktat Washington. Menjadi kapal induk operasional utama AL AS dalam mengembangkan doktrin penerbangan laut."
 USA_carrier_2: "Kelas Ranger"
 USA_carrier_2_desc: "Kelas Ranger adalah kelas Angkatan Laut AS pertama yang dirancang sebagai kapal induk dari atas. Sebagai bagian dari konsep kapal induk Angkatan Laut AS yang lebih kecil, kelas ini jauh lebih kecil dibandingkan Kelas Lexington sebelumnya, namun tetap mempertahankan keunggulan grup udara yang sama berkat perbaikan pada desain interior."
 #USA_carrier_2b: "Yorktown Class"
 #USA_carrier_2c: "Wasp Class"
 USA_carrier_3: "Kelas Essex"
 USA_carrier_3_desc: "Dengan pembelajaran dari kelas varian Lexington, Ranger dan Yorktown sebelumnya, hasilnya adalah Kelas Essex, sebuah kapal cepat yang mampu membawa sejumlah besar pesawat ke medan pertempuran. Desain pengendalian kerusakan juga akan dibawa dari kelas Yorktown dan elevator tepi dek disertakan untuk meningkatkan penanganan pesawat."
 USA_carrier_4: "Kelas Midway"
 USA_carrier_4_desc: "Kelas Midway adalah kapal induk yang memiliki kemampuan tertinggi di Angkatan Laut AS. Menerapkan dek lapis baja dan mampu membawa lebih banyak pesawat dibandingkan kelas sebelumnya, Kelas Midway diberi sebutan sub-kelas yang unik, CVB (Kapal Induk Vessel Battle)."
 USA_SH_battleship_1: "Kelas Virginia"
 USA_SH_battleship_1_desc: "Pada tahun 1920 pembangunan kapal perang besar Kelas South Dakota yang menggunakan senjata 12 x 16\"/50 dimulai. Kelas ini akan mengantarkan era baru dalam desain kapal perang berat tetapi dibatalkan pada tahun 1922 untuk mematuhi Perjanjian Angkatan Laut Washington. Dengan Perjanjian tersebut tidak lagi berlaku dan ancaman proyek kapal perang rahasia Jepang, kita dapat memodernisasi desainnya, meningkatkan bobot perpindahan hingga lebih dari 55.000 ton, dan meningkatkan desain senjata dengan 18\"/50 senjata kaliber untuk menciptakan kapal perang berat kelas baru."
 USA_SH_battleship_2: "Kelas Montana"
 USA_SH_battleship_2_desc: "Kelas Montana lebih besar dan lebih berlapis baja dibandingkan Kelas Illinois, sehingga mengorbankan kecepatan untuk mengakomodasi peningkatan tersebut. Persenjataan utamanya berupa senjata kaliber 12 x 18\"/50 dan dengan sistem pengendalian tembakan terbaru kami, daya tembak Montana tidak akan tertandingi. Desain awal mencakup senjata 6\", tetapi ini diubah untuk kembali ke penempatan menara kembar 5\" dengan tujuan ganda."
 ### ALB - ALBANIA -- all generic ###
 ### ARG - ARGENTINA ###
 ARG_submarine_1: "Santa Kelas Fe"
 ARG_submarine_1_desc: "Kelas Santa Fe mewakili tiga kapal selam yang dipesan dari Italia dan dikirim ke Argentina pada tahun 1933. Ketiga kapal kelas tersebut menjadi tulang punggung Angkatan Kapal Selam Argentina hingga tahun 1960. Mereka dijuluki 'Tarantinos' karena galangan kapal di Taranto, Italia tempat mereka dibangun."
 ARG_destroyer_1: "Kelas Catamarca"
 ARG_destroyer_1_desc: "Kapal perusak kelas Catamarca dipesan oleh Angkatan Laut Argentina dan dibuat oleh Inggris sesaat sebelum Perang Dunia I. Kapal tersebut dipersenjatai dengan empat meriam utama 120 mm/50 kal dan empat tabung torpedo 533 mm."
 #ARG_destroyer_1b: "Cervantes Class"
 ARG_destroyer_2: "Buenos Kelas Aires"
 ARG_destroyer_2_desc: "Kapal perusak kelas Buenos Aires dibangun di Inggris untuk Argentina antara tahun 1936 dan 1938. Kapal ini didasarkan pada kapal perusak kelas G Inggris. Mereka berbobot lebih dari 1.300 ton dan dipersenjatai dengan empat meriam QF 4,7 inci. Mark IX sebagai senjata utama mereka."
 ARG_light_cruiser_1: "Kelas Libertad"
 ARG_light_cruiser_1_desc: "Kapal kelas Libertad diberi sebutan 'Kapal Perang Sungai' tetapi sebenarnya lebih sebanding dengan kapal penjelajah yang lebih kecil dan bersenjata ringan pada awal tahun 1900-an. Dua kapal kelas tersebut dibangun pada akhir tahun 1890-an dan masih beroperasi pada awal Perang Dunia II."
 ARG_light_cruiser_2: "La Kelas Argentina"
 ARG_light_cruiser_2_desc: "Kapal penjelajah ringan La Argentina dibangun untuk Argentina oleh Inggris pada akhir tahun 1930-an. Dia membuat beberapa kapal pesiar pelatihan sebelum perang tetapi ditempatkan di skuadron aktif untuk menjaga netralitas Argentina. Kapal itu merupakan versi yang diperbesar dari kelas Arethusa Inggris, berbobot 6.500 ton dan dipersenjatai dengan sembilan meriam 6 inci sebagai senjata utamanya."
 ARG_heavy_cruiser_1: "Kelas Garibaldi"
 ARG_heavy_cruiser_1_desc: "Kelas Garibaldi mewakili kelas kapal penjelajah lapis baja yang dibangun untuk Argentina sekitar pergantian abad. Semuanya sudah usang pada pertengahan tahun 1930-an, dan yang terakhir dinonaktifkan pada tahun 1932. Kapal-kapal tersebut digantikan pada tahun 1931 oleh kapal penjelajah berat kelas Veinticinco de Mayo buatan Inggris."
 #ARG_heavy_cruiser_1b: "Veinticinco de Mayo Class"
 ARG_battleship_1: "Kelas Rivadavia"
 ARG_battleship_1_desc: "Kelas Rivadavia adalah sepasang kapal perang kapal penempur buatan AS yang dibangun untuk angkatan laut Argentina pada awal tahun 1910-an. Mereka berbobot 27.500 ton dan dipersenjatai dengan dua belas meriam 305mm/50 sebagai senjata utama mereka. Mereka tetap beroperasi sampai tahun 1950-an."
 ### AST - AUSTRALIA ###
 AST_submarine_1: "Kelas L"
 AST_submarine_1_desc: "Kelas L adalah kapal berukuran sedang yang awalnya direncanakan di bawah Program Perang Darurat sebagai versi penyempurnaan dari kelas kapal selam sebelumnya. Mereka dibangun pada tahap akhir Perang Dunia I dan dilengkapi dengan torpedo 21 inci baru yang lebih besar. Mereka bertugas hingga awal Perang Dunia II saat sebagian besar digunakan untuk tugas sekunder dan pelatihan."
 AST_submarine_2: "Kelas T"
 AST_submarine_2_desc: "Kapal selam kelas T atau kelas Triton dirancang untuk menggantikan kapal selam besar kelas O, P, dan R. Mereka adalah kapal selam berukuran sedang dengan jangkauan jauh yang cocok untuk Samudera Atlantik dan Pasifik. Perahu-perahu ini dipersenjatai dengan baik, memiliki platform yang stabil dan digunakan secara luas selama konflik, karena 25 persen perahu yang dibangun hilang selama perang."
 AST_submarine_3: "Kelas U"
 AST_submarine_3_desc: "Kelas U adalah kapal selam berukuran kecil yang dibangun berdasarkan Program Darurat Perang 1940 dan 1941. Awalnya dirancang sebagai kapal selam pelatihan ketika perang pecah, desainnya berubah, memungkinkan kapal selam ini terbukti berguna di perairan terbatas di Laut Utara dan Mediterania. Karena ukurannya yang lebih kecil, jangkauan dan persenjataannya terbatas. Tiga subkelas membentuk kelas Undine, Umpire dan Uproar."
 AST_submarine_4: "Kelas V"
 AST_submarine_4_desc: "Kapal selam kelas V atau kelas Vampire didasarkan pada kapal berukuran lebih kecil dari kelas U sebelumnya. Mereka lebih besar tetapi masih relatif kecil, dengan kemampuan pelayaran yang lebih baik namun jangkauan operasional dan persenjataan yang terbatas."
 AST_destroyer_1: "Kelas Vendetta"
 AST_destroyer_1_desc: "Kapal perusak ini termasuk kelas Admirality dan Thornycroft V dan W, yang dipindahkan ke RAN untuk membentuk 'Scrap Iron Flotilla'. Mereka dibangun di bawah Program Darurat Perang. Mereka adalah evolusi utama dari desain kapal perusak Inggris selama Perang Dunia Pertama, yang mewujudkan perbaikan dari pendahulunya serta kemajuan teknologi baru. Sejumlah besar kapal ini dibangun pada tahap akhir Perang Dunia I dan menjadi tulang punggung armada kapal perusak Angkatan Laut Kerajaan setelahnya. Mulai tahun 1930-an, mereka ditempatkan ke dalam armada cadangan, yang akhirnya digunakan untuk tugas pengawalan konvoi. Kapal-kapal tersebut memiliki persenjataan yang memadai, kapal yang cepat dan memiliki jangkauan yang baik."
 AST_destroyer_2: "G/H/Kelas I"
 AST_destroyer_2_desc: "Kapal perusak kelas G, H, dan I dipesan sebagai bagian dari Program Pembangunan Angkatan Laut tahun 1933 dan 1934. Mereka umumnya merupakan pengulangan dari kelas F sebelumnya, dengan sedikit pengurangan ukurannya. Persenjataan di kelas G dan H sama dengan kelas F, keduanya menggunakan senjata 4,7 inci. Kapal-kapal ini memiliki jangkauan yang jauh, dipersenjatai dengan memadai, dan dilengkapi torpedo yang kuat. Mereka digunakan secara luas selama perang dan menderita banyak kerugian."
 #AST_destroyer_2b: "Arunta Class"
 AST_destroyer_3: "Kelas Nizam"
 AST_destroyer_3_desc: "Kelas Nizam merupakan sebutan untuk kapal perusak kelas J, K, dan N yang dipindahkan dari RN. Mereka mirip dengan kelas Tribal sebelumnya tetapi alih-alih menekankan persenjataan senjata, para perancang kembali ke torpedo berat yang lebih standar dan pengaturan senjata yang lebih ringan. Kapal-kapal itu dimodifikasi selama masa perang mereka. Peningkatannya mencakup peningkatan senjata anti-pesawat dan radar. Mereka adalah kapal yang cepat, memiliki jangkauan jauh, dan dipersenjatai dengan baik, ideal untuk pengawalan armada."
 AST_destroyer_4: "Kelas Battle"
 AST_destroyer_4_desc: "Kapal perusak kelas Pertempuran dibangun berdasarkan evolusi kapal perusak Inggris yang digunakan selama perang. Kapal-kapal tersebut dipesan sebagai bagian dari Program Angkatan Laut tahun 1942 dan 1943. Mereka dipersenjatai dengan baik baik dari segi senjata maupun torpedonya. Kemampuan, kecepatan, dan jangkauan ASW persenjataan AA mereka menjadikannya kapal serbaguna."
 #AST_destroyer_4b: "Tobruk Class"
 AST_light_cruiser_1: "Kelas C"
 AST_light_cruiser_1_desc: "Kapal penjelajah ringan kelas C adalah sekelompok dua puluh delapan kapal penjelajah ringan Angkatan Laut Kerajaan. Mereka dibangun sebelum dan selama Perang Dunia Pertama untuk kondisi Laut Utara yang sulit. Kapal-kapal ini terbukti tangguh dan tangguh meskipun ukurannya agak kecil dan sempit. Persenjataan mereka lebih dari memuaskan, karena mereka membawa senjata berukuran 6 inci yang cukup untuk melawan target permukaan musuh dan muatan torpedo yang berat. Mereka banyak digunakan selama Perang Dunia I dan berpartisipasi dalam banyak aksi permukaan. Hanya subkelas Caledon, Ceres, dan Carlisle yang beroperasi pada pertengahan tahun 1930-an."
 #AST_light_cruiser_1c: "Sydney Class"
 AST_light_cruiser_2: "Kelas Southampton"
 AST_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 AST_light_cruiser_3: "Crown Kelas Colony"
 AST_light_cruiser_3_desc: "Kapal penjelajah ringan kelas Crown Colony merupakan versi perbaikan dari kelas Kota sebelumnya tetapi dengan desain yang disederhanakan untuk mempercepat konstruksi dan mengurangi biaya. Kapal-kapal tersebut membawa senjata yang sama seperti pendahulunya, empat menara rangkap tiga yang menampung senjata 6 inci. Mereka juga memiliki lapis baja yang sama tetapi karena mesinnya yang lebih kecil, jangkauan mereka agak berkurang. Tipenya mencakup dua subkelas: Fiji dan Ceylon."
 AST_light_cruiser_4: "Kelas Minotaur"
 AST_light_cruiser_4_desc: "Juga dikenal sebagai kelas Swiftsure, kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang disahkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih panjang dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sedangkan persenjataan utama dikurangi menjadi tiga menara rangkap tiga."
 AST_heavy_cruiser_1: "Kelas Hawkins"
 AST_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 #AST_heavy_cruiser_1b: "Canberra Class"
 AST_heavy_cruiser_2: "Kelas Surrey"
 AST_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Surrey diusulkan berdasarkan Program Angkatan Laut 1928. Mereka adalah versi perbaikan dari kapal penjelajah berat kelas York sebelumnya. Seandainya selesai, mereka akan dilengkapi dengan empat menara meriam kembar berukuran 8 inci, lapis baja yang lebih berat, dan mesin yang lebih bertenaga. Dua kapal dipesan tetapi tidak ada yang ditetapkan."
 AST_heavy_cruiser_3: "Kelas Admiral"
 AST_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 AST_heavy_cruiser_4: "Desain Churchill"
 AST_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini akan memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 AST_battle_cruiser_1: "Kelas Renown"
 AST_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 AST_battle_cruiser_2: "Princess Kelas Royal"
 AST_battle_cruiser_2_desc: "Princess Royal adalah kelas kapal penjelajah tempur hipotetis yang merupakan versi kapal perang kelas King George V yang lebih cepat dan lebih murah. Kapal-kapal ini membawa persenjataan serupa tetapi lebih sedikit untuk pertempuran permukaan dan anti-udara: dua meriam triple 14 inci dan enam senjata kembar AA 5,25 inci. Kecepatan tinggi dan jangkauan jauh mereka akan memberi Angkatan Laut Kerajaan Inggris kemampuan serangan cepat dan perlindungan konvoi, namun lapis baja mereka yang terbatas akan menjadi masalah jika mereka harus melawan kapal perang modern."
 AST_battleship_1: "Kelas Revenge"
 AST_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 AST_battleship_2: "King George Kelas V"
 AST_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 AST_battleship_3: "Kelas Lion"
 AST_battleship_3_desc: "Kapal perang kelas Lion adalah kelas lanjutan dari kapal perang King George V, yang menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut tahun 1938 untuk menggantikan kapal perang kelas Revenge yang sudah tua tetapi tidak ada yang selesai karena meletusnya permusuhan. Kapal-kapal tersebut secara umum akan mirip dengan kelas King George, tetapi persenjataan utamanya akan lebih berat, dan memperkenalkan meriam 16 inci yang baru. Mereka juga akan memiliki baju besi yang lebih tebal dan mesin yang lebih bertenaga."
 AST_battleship_4: "Kelas Vanguard"
 AST_battleship_4_desc: "Kapal perang kelas Vanguard adalah kapal perang terakhir yang dibangun untuk Angkatan Laut Kerajaan. Satu kapal dipesan tetapi empat kapal lagi dipertimbangkan untuk teater Pasifik. Diperintahkan berdasarkan Program Perang Darurat 1940, konstruksi tidak mendapat prioritas utama dan selesai setelah perang. Kelas ini memiliki lambung yang ramping, memberikan stabilitas dan kelayakan laut yang sangat baik. Persenjataannya sama dengan kapal perang kelas Ratu Elizabeth dan Revenge, memberikan daya tembak yang cukup besar. Mesin yang kuat dan pelindung yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 AST_SH_battleship_1: "Kelas Centurion"
 AST_SH_battleship_1_desc: "Centurion adalah kelas kapal perang berat hipotetis Angkatan Laut Kerajaan Inggris yang dibangun untuk melawan kapal besar angkatan laut Jerman dan Jepang. Senjata besar berukuran 18 inci dan baju besi tebal memberi kapal daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal ini. Persenjataan AA yang kuat, jangkauan yang jauh, dan kecepatan yang baik merupakan kebutuhan untuk menutupi lautan luas Kerajaan Inggris."
 AST_SH_battleship_2: "Lion Kelas II"
 AST_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 AST_carrier_1: "Kelas Courageous"
 AST_carrier_1_desc: "Ketiga kapal induk ini diubah menjadi kapal penjelajah tempur dan merupakan kapal induk pertama Angkatan Laut Kerajaan. Konversi kapal-kapal tersebut merupakan hasil dari Perjanjian Angkatan Laut Washington tahun 1922 dan pekerjaan tersebut selesai pada tahun 1925. Kapal-kapal ini memiliki lapis baja sedang namun dipersenjatai dengan baik, dengan jangkauan yang jauh dan kecepatan yang baik, namun karena sifat konversinya, pelengkap pesawat mereka terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam konstruksi kapal induk dan proyeksi armada udara."
 AST_carrier_2: "Ark Kelas Royal"
 AST_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama yang dibangun untuk memenuhi batasan Perjanjian Angkatan Laut Washington. Dia adalah kapal pertama di mana hanggar dan dek penerbangan merupakan bagian integral dari lambung kapal. Dirancang pada tahun 1934, kapal ini memiliki lapis baja dan persenjataan yang baik. Kapal ini membawa sejumlah besar pesawat dan memiliki jangkauan operasional serta kecepatan yang memadai untuk mengimbangi kekuatan utama Angkatan Laut Kerajaan."
 AST_carrier_3: "Kelas Illustrious"
 AST_carrier_3_desc: "Kelas Illustrious dirancang dalam batasan Traktat Angkatan Laut London Kedua 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Kapal ini adalah kapal induk Inggris pertama yang memiliki dek penerbangan berlapis baja, yang mengurangi ukuran kelompok udaranya. Lapis baja berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal-kapal ini, sementara mesin bertenaga dan simpanan bahan bakar yang besar memberi kapal jangkauan operasional yang jauh."
 AST_carrier_4: "Kelas Implacable"
 AST_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 ### BEL - BELGIUM -- all generic ###
 ### BRA - BRAZIL ###
 BRA_submarine_1: "Kelas Humayta"
 BRA_submarine_1_desc: "Kapal selam Brasil Humaytá dipesan dari Italia dan dikirim pada akhir tahun 1920-an. Ini dirancang sebagai kelas Balilla yang dimodifikasi, yang dirancang sebagai penyelam laut dalam. Kapal ini berbobot hampir 1.400 ton dan dipersenjatai dengan enam tabung torpedo 533mm."
 BRA_submarine_2: "Kelas Tupy"
 BRA_submarine_2_desc: "Kelas Tupy adalah kelas kapal selam Brasil yang dibangun oleh Italia pada pertengahan tahun 1930-an. Mereka adalah kapal selam yang lebih kecil, berbobot lebih dari 600 ton, dan dipersenjatai dengan enam torpedo 533 mm."
 BRA_destroyer_1: "MaranhãKelas o"
 BRA_destroyer_1_desc: "Maranhão adalah kapal perusak kelas K buatan Inggris yang dijual ke Brasil pada tahun 1922. Kapal ini berbobot lebih dari 930 ton dan dipersenjatai dengan empat senjata berukuran 4 inci."
 BRA_destroyer_2: "Kelas Juruena"
 BRA_destroyer_2_desc: "Kapal perusak kelas Juruena adalah serangkaian enam kapal perusak kelas H yang dipesan oleh Brasil dari Inggris pada akhir tahun 1930-an. Namun, kapal-kapal tersebut tidak pernah dikirim karena Inggris memintanya setelah perang pecah pada tahun 1939. Kapal-kapal tersebut berbobot lebih dari 1.300 ton, memiliki kecepatan yang baik, dan dipersenjatai dengan tiga meriam QF 4,7 inci. Mk IX sebagai senjata utama mereka, serta delapan tabung torpedo 533mm."
 BRA_destroyer_3: "Marcílio Kelas Dias"
 BRA_destroyer_3_desc: "Kapal perusak kelas Marcílio Dias (terkadang disebut sebagai kelas M, atau kelas Greenhalgh) adalah tiga kapal Angkatan Laut Brasil yang ditugaskan pada tahun 1943. Kapal tersebut didasarkan pada kapal perusak kelas Mahan AS dan merupakan kapal berukuran besar pertama yang dibangun di Brasil. Mereka berbobot 1.500 ton dan dipersenjatai dengan lima senjata utama 5 in./38 kal."
 BRA_destroyer_4: "Kelas Acre"
 BRA_destroyer_4_desc: "Kelas Acre (kadang-kadang disebut sebagai kelas Amazonas) mewakili enam kapal perusak yang dibangun untuk Angkatan Laut Brasil. Tidak ada yang selesai sebelum perang berakhir. Kapal-kapal tersebut dibangun di Brasil menggunakan desain Inggris yang dimodifikasi dan beberapa peralatan AS untuk menggantikan enam kapal perusak kelas Juruena yang diminta oleh Inggris pada awal perang."
 BRA_light_cruiser_1: "Kelas Bahia"
 BRA_light_cruiser_1_desc: "Kelas Bahia adalah kelas dari dua kapal penjelajah pramuka buatan Inggris yang dibuat untuk Brasil dan dikirim pada tahun 1910. Kapal-kapal tersebut telah direparasi dan dimodernisasi secara besar-besaran pada tahun 1920-an tetapi desainnya masih relatif usang pada awal Perang Dunia II. Selama perang, kapal penjelajah terutama melakukan tugas pengawalan konvoi."
 BRA_battleship_1: "Minas Kelas Gerais"
 BRA_battleship_1_desc: "Minas Gerais adalah kelas dua kapal perang kapal penempur yang dibangun oleh Inggris untuk Brasil pada awal tahun 1900-an. Mereka aktif selama Perang Dunia II tetapi sudah terlalu ketinggalan zaman untuk melakukan tugas serius apa pun, malah digunakan sebagai kapal pertahanan pantai di sepanjang pantai Brasil."
 ### BUL - BULGARIA -- all generic ###
 ### CAN - CANADA ###
 CAN_submarine_1: "Kelas L"
 CAN_submarine_1_desc: "Kelas L adalah kapal berukuran sedang yang awalnya direncanakan di bawah Program Perang Darurat sebagai versi penyempurnaan dari kelas kapal selam sebelumnya. Mereka dibangun pada tahap akhir Perang Dunia I dan dilengkapi dengan torpedo 21 inci baru yang lebih besar. Mereka bertugas hingga awal Perang Dunia II saat sebagian besar digunakan untuk tugas sekunder dan pelatihan."
 CAN_submarine_2: "Kelas T"
 CAN_submarine_2_desc: "Kapal selam kelas T atau kelas Triton dirancang untuk menggantikan kapal selam besar kelas O, P, dan R. Mereka adalah kapal selam berukuran sedang dengan jangkauan jauh yang cocok untuk Samudera Atlantik dan Pasifik. Perahu-perahu ini dipersenjatai dengan baik, memiliki platform yang stabil dan digunakan secara luas selama konflik, karena 25 persen perahu yang dibangun hilang selama perang."
 CAN_submarine_3: "Kelas U"
 CAN_submarine_3_desc: "Kelas U adalah kapal selam berukuran kecil yang dibangun di bawah Program Darurat Perang 1940 dan 1941. Awalnya dirancang sebagai kapal selam latih saat perang pecah, rancangannya diubah sehingga membuktikan kegunaannya di perairan sempit Laut Utara dan Mediterania. Karena ukurannya yang lebih kecil, jangkauan dan persenjataannya terbatas. Tiga subkelas membentuk kelas ini: Undine, Umpire, dan Uproar."
 CAN_submarine_4: "Kelas V"
 CAN_submarine_4_desc: "Kapal selam kelas V atau kelas Vampire didasarkan pada kapal berukuran lebih kecil dari kelas U sebelumnya. Mereka lebih besar tetapi masih relatif kecil, dengan kemampuan pelayaran yang lebih baik namun jangkauan operasional dan persenjataan yang terbatas."
 CAN_destroyer_1: "V/Kelas W"
 CAN_destroyer_1_desc: "Kapal perusak ini termasuk kelas Admirality dan Thornycroft V dan W. Mereka dibangun di bawah Program Darurat Perang. Mereka adalah evolusi utama dari desain kapal perusak Inggris selama Perang Dunia Pertama, yang mewujudkan perbaikan dari pendahulunya serta kemajuan teknologi baru. Sejumlah besar kapal ini dibangun pada tahap akhir Perang Dunia I dan menjadi tulang punggung armada kapal perusak Angkatan Laut Kerajaan setelahnya. Mulai tahun 1930-an, mereka ditempatkan ke dalam armada cadangan, yang akhirnya digunakan untuk tugas pengawalan konvoi. Kapal-kapal tersebut memiliki persenjataan yang memadai, kapal yang cepat dan memiliki jangkauan yang baik."
 #CAN_destroyer_1b: "Saguenay Class"
 CAN_destroyer_2: "Kelas Ottawa"
 CAN_destroyer_2_desc: "Kelas Ottawa adalah sebutan Kanada untuk kapal perusak kelas G, H, dan I Inggris yang dipesan sebagai bagian dari Program Konstruksi Angkatan Laut tahun 1933 dan 1934. Mereka umumnya merupakan pengulangan dari kelas F sebelumnya, dengan sedikit pengurangan ukurannya. Persenjataan di kelas G dan H sama dengan kelas F, keduanya menggunakan senjata 4,7 inci. Kapal-kapal ini memiliki jangkauan yang jauh, dipersenjatai dengan memadai, dan dilengkapi torpedo yang kuat. Mereka digunakan secara luas selama perang dan menderita banyak kerugian."
 #CAN_destroyer_2b: "Athabaskan Class"
 CAN_destroyer_3: "J/K/Kelas N"
 CAN_destroyer_3_desc: "Kelas J, K, dan N mirip dengan kelas Tribal sebelumnya tetapi alih-alih menekankan persenjataan senjata, para perancang kembali ke torpedo berat yang lebih standar dan pengaturan senjata yang lebih ringan. Kapal-kapal itu dimodifikasi selama masa perang mereka. Peningkatannya mencakup peningkatan senjata anti-pesawat dan radar. Mereka adalah kapal yang cepat, memiliki jangkauan jauh, dan dipersenjatai dengan baik, ideal untuk pengawalan armada."
 CAN_destroyer_4: "Kelas Algonquin"
 CAN_destroyer_4_desc: "Kelas Algonquin adalah sebutan Kanada untuk kapal perusak kelas Pertempuran Inggris. Kapal-kapal tersebut dipesan sebagai bagian dari Program Angkatan Laut tahun 1942 dan 1943. Mereka dipersenjatai dengan baik baik dari segi senjata maupun torpedonya. Kemampuan, kecepatan, dan jangkauan ASW persenjataan AA mereka menjadikannya kapal serbaguna. Keterlambatan mereka dalam berperang menyebabkan kontribusi yang minimal."
 CAN_light_cruiser_1: "Kelas C"
 CAN_light_cruiser_1_desc: "Kapal penjelajah ringan kelas C adalah sekelompok dua puluh delapan kapal penjelajah ringan Angkatan Laut Kerajaan. Mereka dibangun sebelum dan selama Perang Dunia Pertama untuk kondisi Laut Utara yang sulit. Kapal-kapal ini terbukti tangguh dan tangguh meskipun ukurannya agak kecil dan sempit. Persenjataan mereka lebih dari memuaskan, karena mereka membawa senjata berukuran 6 inci yang cukup untuk melawan target permukaan musuh dan muatan torpedo yang berat. Mereka banyak digunakan selama Perang Dunia I dan berpartisipasi dalam banyak aksi permukaan. Hanya subkelas Caledon, Ceres, dan Carlisle yang beroperasi pada pertengahan tahun 1930-an."
 CAN_light_cruiser_2: "Kelas Southampton"
 CAN_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 CAN_light_cruiser_3: "Kelas Quebec"
 CAN_light_cruiser_3_desc: "Kelas Quebec adalah sebutan Kanada untuk kapal penjelajah ringan kelas British Crown Colony. Ini adalah versi perbaikan dari kelas Kota sebelumnya tetapi dengan desain yang disederhanakan untuk mempercepat konstruksi dan mengurangi biaya. Kapal-kapal tersebut membawa senjata yang sama seperti pendahulunya, empat menara rangkap tiga yang menampung senjata 6 inci. Mereka juga memiliki lapis baja yang sama tetapi karena mesinnya yang lebih kecil, jangkauan mereka agak berkurang. Tipe ini mencakup dua subkelas - Fiji dan Ceylon."
 CAN_light_cruiser_4: "Kelas Ontario"
 CAN_light_cruiser_4_desc: "Kelas Ontario adalah sebutan Kanada untuk kapal penjelajah ringan kelas Minotaur Inggris (atau kelas Swiftsure). Kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang disahkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih panjang dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sementara persenjataan utama dikurangi menjadi tiga menara rangkap tiga."
 CAN_heavy_cruiser_1: "Kelas Hawkins"
 CAN_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 CAN_heavy_cruiser_2: "Kelas Surrey"
 CAN_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Surrey diusulkan berdasarkan Program Angkatan Laut 1928. Mereka adalah versi perbaikan dari kapal penjelajah berat kelas York sebelumnya. Seandainya selesai, mereka akan dilengkapi dengan empat menara meriam kembar berukuran 8 inci, lapis baja yang lebih berat, dan mesin yang lebih bertenaga. Dua kapal dipesan tetapi tidak ada yang ditetapkan."
 CAN_heavy_cruiser_3: "Kelas Admiral"
 CAN_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 CAN_heavy_cruiser_4: "Desain Churchill"
 CAN_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini akan memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 CAN_battle_cruiser_1: "Kelas Renown"
 CAN_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 CAN_battle_cruiser_2: "Princess Kelas Royal"
 CAN_battle_cruiser_2_desc: "Princess Royal adalah kelas kapal penjelajah tempur hipotetis yang merupakan versi kapal perang kelas King George V yang lebih cepat dan lebih murah. Kapal-kapal ini membawa persenjataan serupa tetapi lebih sedikit untuk pertempuran permukaan dan anti-udara: dua meriam triple 14 inci dan enam senjata kembar AA 5,25 inci. Kecepatan tinggi dan jangkauan jauh mereka akan memberikan Angkatan Laut Kerajaan Inggris kemampuan serangan cepat dan perlindungan konvoi, namun lapis baja mereka yang terbatas akan menjadi masalah jika mereka harus melawan kapal perang modern."
 CAN_battleship_1: "Kelas Revenge"
 CAN_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 CAN_battleship_2: "King George Kelas V"
 CAN_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 CAN_battleship_3: "Kelas Lion"
 CAN_battleship_3_desc: "Kapal perang kelas Lion adalah kelas lanjutan dari kapal perang King George V, yang menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut tahun 1938 untuk menggantikan kapal perang kelas Revenge yang sudah tua tetapi tidak ada yang selesai karena meletusnya permusuhan. Kapal-kapal tersebut secara umum akan mirip dengan kelas King George, tetapi persenjataan utamanya akan lebih berat, dan memperkenalkan meriam 16 inci yang baru. Mereka juga akan memiliki baju besi yang lebih tebal dan mesin yang lebih bertenaga."
 CAN_battleship_4: "Kelas Vanguard"
 CAN_battleship_4_desc: "Kapal perang kelas Vanguard adalah kapal perang terakhir yang dibangun untuk Angkatan Laut Kerajaan. Satu kapal dipesan tetapi empat kapal lagi dipertimbangkan untuk teater Pasifik. Diperintahkan berdasarkan Program Perang Darurat 1940, konstruksi tidak mendapat prioritas utama dan selesai setelah perang. Kelas ini memiliki lambung yang ramping, sehingga memberikan stabilitas dan kelayakan laut yang sangat baik. Persenjataannya sama dengan kapal perang kelas Ratu Elizabeth dan Revenge, memberikan daya tembak yang cukup besar. Mesin yang kuat dan pelindung yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 CAN_SH_battleship_1: "Kelas Centurion"
 CAN_SH_battleship_1_desc: "Centurion adalah kelas kapal perang berat hipotetis Angkatan Laut Kerajaan Inggris yang dibangun untuk melawan kapal besar angkatan laut Jerman dan Jepang. Senjata besar berukuran 18 inci dan baju besi tebal memberi kapal daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal ini. Persenjataan AA yang kuat, jangkauan yang jauh, dan kecepatan yang baik merupakan kebutuhan untuk menutupi lautan luas Kerajaan Inggris."
 CAN_SH_battleship_2: "Lion Kelas II"
 CAN_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 CAN_carrier_1: "Kelas Courageous"
 CAN_carrier_1_desc: "Ketiga kapal induk ini diubah menjadi kapal penjelajah tempur dan merupakan kapal induk pertama Angkatan Laut Kerajaan. Konversi kapal-kapal tersebut merupakan hasil dari Perjanjian Angkatan Laut Washington tahun 1922 dan pekerjaan tersebut selesai pada tahun 1925. Kapal-kapal ini memiliki lapis baja sedang namun dipersenjatai dengan baik, dengan jangkauan yang jauh dan kecepatan yang baik, namun karena sifat konversinya, pelengkap pesawat mereka terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam konstruksi kapal induk dan proyeksi armada udara."
 CAN_carrier_2: "Ark Kelas Royal"
 CAN_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama yang dibangun untuk memenuhi batasan Perjanjian Angkatan Laut Washington. Dia adalah kapal pertama di mana hanggar dan dek penerbangan merupakan bagian integral dari lambung kapal. Dirancang pada tahun 1934, kapal ini memiliki lapis baja dan persenjataan yang baik. Kapal ini membawa sejumlah besar pesawat dan memiliki jangkauan operasional serta kecepatan yang memadai untuk mengimbangi kekuatan utama Angkatan Laut Kerajaan."
 CAN_carrier_3: "Kelas Illustrious"
 CAN_carrier_3_desc: "Kelas Illustrious dirancang dalam batasan Traktat Angkatan Laut London Kedua 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Kapal ini adalah kapal induk Inggris pertama yang memiliki dek penerbangan berlapis baja, yang mengurangi ukuran kelompok udaranya. Lapis baja berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal-kapal ini, sementara mesin bertenaga dan simpanan bahan bakar yang besar memberi kapal jangkauan operasional yang jauh."
 CAN_carrier_4: "Kelas Implacable"
 CAN_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 ### CHI - NATIONALIST CHINA ###
 CHI_destroyer_1: "Kelas Jianwei"
 CHI_destroyer_1_desc: "Kelas Jianwei adalah kelas kapal torpedo besar yang dibuat untuk angkatan laut Nasionalis Tiongkok dan ditugaskan pada tahun 1904. Dua kapal kelas tersebut dimodernisasi dan masih beroperasi pada saat invasi Jepang. Setelah dimodernisasi, bobotnya berbobot 870 ton dan dipersenjatai dengan dua senjata utama 4,7 inci."
 CHI_light_cruiser_1: "Kelas Hairong"
 CHI_light_cruiser_1_desc: "Hairong adalah kapal penjelajah terlindungi Tiongkok yang dibangun pada akhir tahun 1890-an oleh Jerman. Kapal itu mirip dengan kapal penjelajah terlindungi lainnya dan kapal penjelajah ringan berikutnya yang diproduksi untuk Tiongkok sekitar pergantian abad. Hairong berbobot kurang dari 2.700 ton dan dipersenjatai dengan tiga senjata QF 5,9 in."
 ### CHL - CHILE ###
 CHL_submarine_1: "Kelas H"
 CHL_submarine_1_desc: "Kapal selam ini terdiri dari enam kapal selam kelas H Inggris, atau Holland 602, yang dibangun di Inggris dan dipindahkan ke Chili tak lama setelah Perang Dunia I dengan imbalan kapal selam yang dikuburkan selama perang. Kapal-kapal tersebut dibangun antara tahun 1915 dan 1918. Kapal tersebut berbobot lebih dari 360 ton, memiliki kedalaman menyelam 30m, dan dipersenjatai dengan empat tabung torpedo 450mm."
 #CHL_submarine_1b: "Capitán O`Brien Class"
 CHL_destroyer_1: "Almirante Kelas Lynch"
 CHL_destroyer_1_desc: "Kapal perusak kelas Almirante Lynch adalah kelompok yang terdiri dari enam kapal yang dibangun untuk Angkatan Laut Chili di Inggris tepat sebelum Perang Dunia I. Hanya dua kapal yang dikirim sebelum pecahnya perang dan bertugas hingga tahun 1945. Kapal tersebut berbobot 1.430 ton, memiliki kecepatan dan jangkauan yang layak untuk model lamanya, dan dipersenjatai dengan enam senjata utama L/40 QF Mark VI 4 inci dan dua tabung torpedo 21 inci."
 #CHL_destroyer_1b: "Serrano Class"
 CHL_light_cruiser_1: "Kelas Chacabuco"
 CHL_light_cruiser_1_desc: "Chacabuco adalah kapal penjelajah terlindungi yang dibangun di Inggris dan ditugaskan untuk Angkatan Laut Chili pada tahun 1902. Kapal ini berbobot 4.160 ton dan dipersenjatai dengan dua senjata utama Armstrong 8 inci dan tiga tabung torpedo 18 inci. Kapal ini lambat namun memiliki lapis baja yang baik dibandingkan dengan kapal penjelajah ringan awal."
 CHL_heavy_cruiser_1: "Kelas O'Higgins"
 CHL_heavy_cruiser_1_desc: "O'Higgins adalah kapal penjelajah lapis baja yang dibangun pada pergantian abad ke-20 di Inggris untuk Angkatan Laut Chili. Kapal ini berbobot 7.800 ton, memiliki empat senjata kaliber 8 inci dan 45 sebagai persenjataan utamanya, namun cukup lambat dibandingkan dengan kapal penjelajah berat yang dibuat setelah Perang Dunia I."
 CHL_battleship_1: "Almirante Kelas Latorre"
 CHL_battleship_1_desc: "Kelas Almirante Latorre terdiri dari dua kapal perang super-dreadnought yang dibangun di Inggris untuk Angkatan Laut Chili saat pecahnya Perang Dunia I. Hanya satu yang selesai dibangun sebagai kapal perang, dan yang lainnya diubah menjadi kapal induk HMS Eagle. Kapal-kapal tersebut berbobot lebih dari 28.000 ton dan memiliki persenjataan utama sepuluh senjata BL kaliber 14 in./45. Mereka tidak memiliki lapis baja tetapi agak lebih cepat dibandingkan kapal penempur lain di zamannya."
 ### COL - COLOMBIA ###
 COL_destroyer_2: "Kelas Antioquia"
 COL_destroyer_2_desc: "Kelas Antioquia terdiri dari dua kapal perusak yang dibangun untuk Angkatan Laut Kolombia di Portugal. Kapal-kapal tersebut ditugaskan pada tahun 1934. Kapal-kapal tersebut berbobot lebih dari 1.200 ton dan dipersenjatai dengan empat senjata BL 4,7 inci dan delapan tabung torpedo 533mm."
 ### DEN - DENMARK ###
 DEN_submarine_1: "Kelas Rota"
 DEN_submarine_1_desc: "Kapal selam kelas Rota dibangun dan ditugaskan di Denmark setelah berakhirnya Perang Dunia I. Kapal selam ini merupakan kapal selam kecil dan didasarkan pada desain Holland 602. Mereka berbobot 290 ton dan dipersenjatai dengan empat tabung torpedo 450 mm."
 DEN_submarine_2: "Kelas Havmanden"
 DEN_submarine_2_desc: "Kelas Havmanden terdiri dari lima kapal selam yang direncanakan. Tiga selesai sebelum pendudukan Jerman, satu selesai pada masa pendudukan, dan yang kelima dibatalkan. Kapal selamnya cukup kecil, berbobot 320 ton. Mereka dipersenjatai dengan lima tabung torpedo 450 mm."
 DEN_submarine_4: "StøKelas ren"
 DEN_submarine_4_desc: "Støren adalah kapal selam kelas Vampir Inggris yang dipindahkan ke Angkatan Laut Denmark setelah perang. Kapal itu relatif kecil, berbobot 545 ton, tetapi memiliki empat tabung torpedo 533 mm dan kemampuan berlayar di laut yang baik."
 DEN_destroyer_4: "Kelas Huitfeldt"
 DEN_destroyer_4_desc: "Kelas Huitfeldt, juga dikenal sebagai kelas Najaden, terdiri dari dua kapal torpedo besar yang dibangun dan ditugaskan di Denmark. Konstruksi dimulai pada tahun 1942, dan kapal tersebut selesai pada tahun 1947. Kapal ini berbobot lebih dari 780 ton dan memiliki dua senjata 105mm sebagai persenjataan utama mereka, serta enam tabung torpedo 533mm dan berbagai persenjataan ASW."
 DEN_heavy_cruiser_1: "Herluf Kelas Trolle"
 DEN_heavy_cruiser_1_desc: "Kelas Herluf Trolle mewakili tiga kapal perang pantai kokoh yang ditugaskan antara tahun 1901 dan 1908. Terlepas dari klasifikasi kapal perang, mereka lebih mirip dengan kapal penjelajah dalam ukuran dan persenjataan. Hanya satu, Peter Skram, yang bertugas pada awal Perang Dunia II. Kapal-kapal tersebut berbobot lebih dari 3.700 ton, dipersenjatai dengan dua senjata 240mm/K43 sebagai persenjataan utama mereka, dan memiliki lapis baja yang baik, meskipun mereka lebih lambat dibandingkan kebanyakan kapal perang kapal penempur pada masanya."
 ### DOM - DOMINICAN REPUBLIC -- all generic ###
 ### ECU - ECUADOR -- all generic ###
 ### EST - ESTONIA ###
 EST_submarine_2: "Kelas Kalev"
 EST_submarine_2_desc: "Kelas Kalev terdiri dari dua kapal selam yang dibangun di Inggris untuk angkatan laut Estonia pada tahun 1936. Tujuan utamanya adalah untuk melapisi ranjau, meskipun kapal tersebut juga dipersenjatai dengan empat tabung torpedo 533 mm."
 ### FIN - FINLAND ###
 FIN_heavy_cruiser_1: "VäinämöKelas inen"
 FIN_heavy_cruiser_1_desc: "Kelas Väinämöinen terdiri dari dua kapal perang pertahanan pantai yang dibangun dan ditugaskan di Finlandia pada awal tahun 1930-an. Mereka termasuk kapal pertahanan pantai terakhir yang pernah dibuat, meskipun ukuran dan persenjataannya mendekati kapal penjelajah berat. Mereka hanya berbobot 3.900 ton dan cukup lambat, namun dipersenjatai dengan empat senjata Bofors kaliber 254mm/45."
 FIN_submarine_1: "Kelas Vetehinen"
 FIN_submarine_1_desc: "Kelas Vetehinen terdiri dari tiga kapal selam menengah yang dibangun untuk Angkatan Laut Finlandia. Mereka didasarkan pada kapal selam UB III Jerman era Perang Dunia I. Bobotnya hanya di bawah 500 ton dan dipersenjatai dengan empat tabung torpedo 533 mm."
 ### GRE - GREECE ###
 GRE_submarine_1: "Kelas Katsonis"
 GRE_submarine_1_desc: "Kapal selam kelas Katsonis dibangun di Perancis untuk Angkatan Laut Hellenic pada akhir tahun 1920-an. Kedua kapal kelas tersebut bertugas selama Perang Dunia II. Kapal ini berbobot hampir 580 ton dan dipersenjatai dengan enam tabung torpedo 533mm."
 GRE_submarine_2: "Kelas Matrozos"
 GRE_submarine_2_desc: "Kapal selam Yunani Matrozos adalah kapal selam kelas Perla Italia yang ditangkap oleh Inggris dan dipindahkan ke Angkatan Laut Hellenic saat diasingkan pada tahun 1942. Kapal selam ini memiliki bobot 680 ton dan dipersenjatai dengan enam tabung torpedo 533mm. Itu memiliki kedalaman menyelam 80m."
 GRE_submarine_4: "Kelas Pipinos"
 GRE_submarine_4_desc: "Keempat kapal kelas Pipinos adalah kapal selam kelas U Inggris yang dipindahkan ke Angkatan Laut Hellenic di pengasingan antara tahun 1943 dan 1946. Kapal-kapal tersebut berbobot 545 ton dan dipersenjatai dengan empat tabung torpedo 533 mm."
 GRE_destroyer_1: "Kelas Aetos"
 GRE_destroyer_1_desc: "Kapal perusak kelas Aetos dibuat di Inggris dan dibeli untuk Angkatan Laut Hellenic sebelum Perang Dunia I. Keempatnya bertugas selama Perang Dunia II. Mereka berbobot 980 ton dan dipersenjatai dengan empat senjata Armstrong P 105mm/40 dan empat tabung torpedo 533mm. Mereka dimodernisasi pada akhir tahun 1920-an."
 #GRE_destroyer_1b: "Hydra Class"
 GRE_destroyer_2: "Vasilefs Georgios Kelas I"
 GRE_destroyer_2_desc: "Kelas Vasilefs Georgios I adalah kelas dari dua kapal perusak kelas H Inggris yang dimodifikasi yang dibangun di Inggris untuk Angkatan Laut Hellenic pada akhir tahun 1930-an. Kapal-kapal tersebut berbobot 1.350 ton dan memiliki kecepatan yang layak. Mereka memiliki jangkauan yang jauh, dipersenjatai dengan empat senjata 128mm/42 SK C/34, dan memiliki torpedo yang kuat."
 GRE_destroyer_3: "Kelas Adrias"
 GRE_destroyer_3_desc: "Kelas Adrias adalah kelas yang terdiri dari enam kapal perusak pengawal kelas Hunt III Inggris, empat di antaranya dipindahkan ke Angkatan Laut Hellenic di pengasingan pada tahun 1942. Sebagai kapal perusak pengawal, mereka lebih lambat dari kapal perusak standar. Kapal ini berbobot 1.050 ton, memiliki empat meriam 102mm/45 QF Mk XVI sebagai persenjataan utama, dan dilengkapi torpedo dan peralatan ASW yang kuat."
 GRE_destroyer_4: "Kelas Leon"
 GRE_destroyer_4_desc: "Kelas Leon adalah kelas pengawal kapal perusak kelas Meriam AS. Mereka ditugaskan pada tahun 1943 tetapi tidak dikirim ke Angkatan Laut Hellenic sampai tahun 1951. Kapal-kapal tersebut lebih lambat dari kapal perusak standar. Mereka berbobot 1.240 ton dan memiliki tiga senjata kaliber 3 in./40 sebagai persenjataan utama mereka, serta pelengkap torpedo dan peralatan ASW yang kuat."
 GRE_light_cruiser_1: "Kelas Elli"
 GRE_light_cruiser_1_desc: "Elli adalah kapal penjelajah ringan yang dibuat oleh AS pada tahun 1914. Awalnya ditujukan untuk Angkatan Laut Tiongkok, namun akhirnya dikirim ke Yunani. Bobotnya kecil untuk sebuah kapal penjelajah, hanya berbobot 2.600 ton. Ia memiliki dua senjata kaliber 152mm/45 sebagai persenjataan utamanya. Kapal tersebut bertugas selama Perang Dunia II dan ditenggelamkan oleh kapal selam Italia sebelum invasi Poros ke Yunani."
 GRE_heavy_cruiser_1: "Kelas Averof"
 GRE_heavy_cruiser_1_desc: "Averof adalah kapal penjelajah lapis baja yang dibangun di Italia untuk Angkatan Laut Hellenic sebelum Perang Dunia I. Dia bertugas sepanjang Perang Dunia II sebagai andalan armada tersebut. Averof cukup kuat dibandingkan dengan kapal penjelajah pada masanya, berbobot hampir 10.000 ton. Kapal ini memiliki lapis baja yang sangat baik dan memiliki persenjataan utama berupa empat senjata Armstrong 234mm/45. Terlepas dari semua ini, dia relatif cepat untuk sebuah kapal penjelajah lapis baja."
 GRE_battleship_1: "Kelas Kilkis"
 GRE_battleship_1_desc: "Kelas Kilkis terdiri dari dua kapal perang kelas Mississippi AS yang ditugaskan pada tahun 1908 dan dijual ke Yunani pada tahun 1914. Kapal ini adalah kapal perang pra-dreadnought terakhir yang dibangun oleh AS. Kapal ini hanya berbobot 13.000 ton dan dipersenjatai dengan empat senjata Mk V kaliber 10 in./45 sebagai persenjataan utamanya. Mereka memiliki persenjataan, kecepatan, dan jangkauan rata-rata untuk model mereka. Kedua kapal tersebut pensiun pada tahun 1936."
 ### HOL - NETHERLANDS ###
 HOL_submarine_1: "Kelas K-III"
 HOL_submarine_1_desc: "Kelas K-III terdiri dari dua kapal selam yang dibangun dan digunakan oleh Angkatan Laut Kerajaan Belanda sebagai kapal selam patroli. Mereka ditugaskan pada awal tahun 1920-an, dan didasarkan pada kapal selam kelas Holland milik AS. Masing-masing berbobot lebih dari 580 ton dan dipersenjatai dengan empat tabung torpedo 450 mm."
 #HOL_submarine_1b: "K-XIV Class"
 HOL_submarine_2: "Kelas O16"
 HOL_submarine_2_desc: "Kapal selam O16 diproduksi dan ditugaskan di Belanda untuk Angkatan Laut Kerajaan Belanda pada tahun 1936. Dia adalah kapal selam besar, berbobot lebih dari 980 ton. Dia memiliki kedalaman menyelam 80m dan dipersenjatai dengan delapan tabung torpedo 533mm."
 HOL_submarine_3: "Kelas O21"
 HOL_submarine_3_desc: "Kelas O21 terdiri dari tujuh kapal selam yang dibangun dan ditugaskan oleh Belanda. Kapal-kapal tersebut semuanya tidak lengkap pada saat invasi Jerman, meskipun lima kapal berhasil melarikan diri ke Inggris dan bertugas di Angkatan Laut Belanda di pengasingan. Kapal selam ini sedikit lebih besar dibandingkan kapal selam kelas O sebelumnya, dengan bobot bobot lebih dari 990 ton, namun juga dipersenjatai dengan delapan tabung torpedo 533 mm."
 HOL_submarine_4: "Kelas Zwaardvis"
 HOL_submarine_4_desc: "Kelas Zwaardvis mewakili empat kapal selam kelas Taciturn Inggris yang dipindahkan ke Angkatan Laut Kerajaan Belanda di pengasingan antara tahun 1943 dan 1945. Kapal-kapal tersebut berbobot 1.090 ton, dipersenjatai dengan sebelas tabung torpedo 533mm, dan memiliki kedalaman menyelam lebih dari 100m."
 HOL_destroyer_1: "Van Kelas Ghent"
 HOL_destroyer_1_desc: "Kelas Van Ghent, atau Admiralen, terdiri dari delapan kapal perusak yang dibangun untuk Angkatan Laut Kerajaan Belanda antara tahun 1926 dan 1931. Kapal-kapal tersebut didasarkan pada versi awal kelas A Inggris. Semua kapal bertempur dalam Perang Dunia II dan ditenggelamkan atau ditenggelamkan. Kapal-kapal tersebut berbobot lebih dari 1.300 ton, dipersenjatai dengan empat senjata 120mm, dan memiliki kecepatan yang layak untuk model lamanya."
 HOL_destroyer_3: "Kelas Callenburgh"
 HOL_destroyer_3_desc: "Kelas Gerard Callenburgh direncanakan memiliki empat kapal perusak untuk Angkatan Laut Kerajaan Belanda. Keempatnya diluncurkan sebelum invasi Jerman, tetapi hanya dua yang diselesaikan, satu oleh Inggris setelah melarikan diri ke Inggris, dan satu lagi oleh Jerman. Kapal perusak ini berbobot lebih dari 1.600 ton, dipersenjatai dengan lima senjata utama 120 mm, serta delapan tabung torpedo 533 mm, dan memiliki kecepatan yang baik."
 HOL_destroyer_4: "Piet Kelas Hein"
 HOL_destroyer_4_desc: "Kelas Piet Hein terdiri dari tiga kapal perusak kelas S Inggris yang dipindahkan ke Angkatan Laut Kerajaan Belanda tak lama setelah perang. Kapal-kapal tersebut berbobot lebih dari 1.800 ton, dipersenjatai dengan empat senjata 120mm/45 QF Mk IX, dan memiliki beragam persenjataan ASW."
 HOL_light_cruiser_1: "Kelas Java"
 HOL_light_cruiser_1_desc: "Belanda menugaskan dua kapal penjelajah ringan kelas Java pada pertengahan tahun 1920-an. Kapal-kapal tersebut dirancang di Jerman tetapi dibangun di Belanda. Mereka berbobot hampir 6.700 ton dan memiliki persenjataan utama sepuluh senjata Bofors 150mm. Mereka lapis baja ringan dan memiliki kecepatan yang layak untuk model vintage mereka."
 HOL_light_cruiser_2: "Kelas De Ruyter"
 HOL_light_cruiser_2_desc: "Kapal penjelajah ringan De Ruyter dibangun dan ditugaskan di Belanda pada pertengahan tahun 1930-an. Dia bertugas terutama di Hindia Belanda. Kapal ini berbobot lebih dari 6.500 ton dan dipersenjatai dengan tujuh senjata 150mm di persenjataan utamanya. Dia memiliki kecepatan di bawah rata-rata tetapi jangkauannya bagus."
 HOL_light_cruiser_3: "Kelas Tromp"
 HOL_light_cruiser_3_desc: "Kelas Tromp terdiri dari sepasang kapal penjelajah ringan yang relatif kecil yang ditugaskan untuk Belanda sebelum invasi Jerman. Keduanya bertugas di Timur Jauh dan selamat dari perang. Bobotnya hanya 3.350 ton dan, seperti yang dirancang, memiliki enam senjata 150m sebagai persenjataan utama mereka."
 HOL_light_cruiser_4: "Kelas De Zeven Provinciën"
 HOL_light_cruiser_4_desc: "Kelas De Zeven Provinciën terdiri dari dua kapal penjelajah yang dibangun tepat sebelum invasi Jerman tetapi baru selesai pada tahun 1951. Desain akhir diubah dari rencana awal tahun 1939, dan menghasilkan dua kapal yang berbobot lebih dari 12.000 ton dan dipersenjatai dengan delapan meriam Bofors 152mm. Mereka memiliki lapis baja yang baik untuk kapal penjelajah ringan dan memiliki jangkauan yang baik."
 HOL_heavy_cruiser_1: "Kelas Soerabaja"
 HOL_heavy_cruiser_1_desc: "Kapal penjelajah Belanda Soerabaja, awalnya bernama De Zeven Provinciën, adalah kapal pertahanan pantai ('panterschip') yang dibangun dan ditugaskan di Belanda sebelum Perang Dunia I. Kapal ini memiliki bobot lebih dari 6.500 ton dan dipersenjatai dengan dua senjata 280mm dan empat senjata 150mm sebagai persenjataan utamanya. Dia bertugas selama Perang Dunia II sampai dia ditenggelamkan oleh pembom Jepang pada tahun 1942."
 ### IRE - IRELAND -- all generic ###
 ### LAT - LATVIA ###
 LAT_submarine_1: "Kelas Ronis"
 LAT_submarine_1_desc: "Kelas Ronis terdiri dari dua kapal selam yang dibangun di Perancis untuk Angkatan Laut Latvia. Mereka ditugaskan pada tahun 1927. Mereka berukuran kecil, hanya berbobot 390 ton, dan dipersenjatai dengan enam tabung torpedo 533mm."
 ### LIT - LITHUANIA -- all generic ###
 ### MEX - MEXICO ###
 MEX_destroyer_1: "Kelas Guanajuato"
 MEX_light_cruiser_1: "Kelas Progreso"
 MEX_heavy_cruiser_1: "AnáKelas huac"
 ### NOR - NORWAY ###
 NOR_submarine_1: "Kelas B"
 NOR_submarine_1_desc: "Kapal selam kelas B Norwegia adalah kapal selam tipe Holland Amerika yang dibangun di Norwegia untuk Angkatan Laut Norwegia. Enam kapal kelas tersebut ditugaskan antara tahun 1923 dan 1930. Kapal tersebut berbobot 420 ton, dipersenjatai dengan empat tabung torpedo 450 mm, dan memiliki kedalaman menyelam 60 m."
 NOR_submarine_3: "Kelas Uredd"
 NOR_submarine_3_desc: "Kelas Uredd terdiri dari dua kapal selam kelas U Inggris yang dibangun untuk Angkatan Laut Norwegia di pengasingan antara tahun 1941 dan 1943. Kapal-kapal tersebut berbobot 540 ton dan dipersenjatai dengan empat tabung torpedo 533mm. Mereka memiliki radar dan sonar Inggris yang lengkap, dan kedalaman menyelam 60m."
 NOR_submarine_4: "Kelas Utsira"
 NOR_submarine_4_desc: "Kelas Utsira terdiri dari empat kapal selam kelas Vampir Inggris. Kapal-kapal tersebut dibangun antara tahun 1943 dan 1944, meskipun hanya satu yang dipindahkan ke Angkatan Laut Norwegia di pengasingan sebelum perang berakhir. Kapal-kapal tersebut hanya merupakan peningkatan moderat dibandingkan kelas U sebelumnya. Kapal ini berbobot 545 ton, dipersenjatai dengan empat tabung torpedo 533 mm, dan kedalaman menyelam 90 m."
 NOR_destroyer_1: "Kelas Draug"
 NOR_destroyer_1_desc: "Keempat kapal perusak kelas Dragug adalah kapal perusak kelas multi-kapal pertama yang dibangun untuk Angkatan Laut Kerajaan Norwegia. Mereka ditugaskan tepat sebelum Perang Dunia I dan berbobot 580 ton. Mereka dipersenjatai dengan tiga senjata QF Inggris berukuran 3 inci sebagai persenjataan utama mereka. Namun, mereka cukup lambat, bahkan dibandingkan dengan kapal perusak lain pada zamannya."
 NOR_destroyer_2: "Kelas Sleipner"
 NOR_destroyer_2_desc: "Kelas Sleipner adalah kelas kapal torpedo besar yang dibangun di Norwegia untuk Angkatan Laut Kerajaan Norwegia dan ditugaskan antara tahun 1937 dan 1939. Berbeda dengan kelas Draug sebelumnya, kelas Sleipner memiliki persenjataan dan perlengkapan ASW yang relatif baik. Bobotnya 735 ton dan memiliki kecepatan yang layak untuk ukurannya."
 NOR_destroyer_3: "ÅKelas lesund"
 NOR_destroyer_3_desc: "Kelas Ålesund terdiri dari dua kapal perusak yang dibangun pada tahun 1939 tetapi tidak pernah selesai sebelum pendudukan Jerman. Seandainya selesai dibangun, kapal tersebut akan menjadi kapal perusak Norwegia pertama yang ukurannya sebanding dengan kapal perusak sebagian besar negara besar, dengan bobot bobot lebih dari 1.200 ton. Mereka akan dipersenjatai dengan empat meriam Bofors 120mm/40 dan empat tabung torpedo 533mm."
 NOR_destroyer_4: "Kelas Stord"
 NOR_destroyer_4_desc: "Kelas Stord terdiri dari empat kapal perusak kelas S Inggris yang dibangun untuk Angkatan Laut Kerajaan Norwegia di pengasingan antara tahun 1943 dan 1944. Kapal ini berbobot hampir 1.800 ton dan dipersenjatai dengan empat senjata 120mm/45 QF Mk IX sebagai persenjataan utama mereka, serta delapan tabung torpedo 533mm dan pelengkap ASW dan radar yang layak. Mereka juga memiliki kecepatan dan keandalan yang baik."
 NOR_heavy_cruiser_1: "Kelas Norge"
 NOR_heavy_cruiser_1_desc: "Norge adalah kapal pertahanan pantai yang dibangun untuk Norwegia di Inggris pada pergantian abad. Persenjataannya, yang berpusat pada dua senjata 210mm, sebanding dengan kapal penjelajah berat, meskipun ukurannya, yang berbobot lebih dari 4.200 ton, lebih mirip dengan kapal penjelajah ringan. Kecepatannya sebanding dengan kapal perang kapal penempur. Itu adalah salah satu dari empat kapal pertahanan pantai pada masanya yang masih bertugas di Angkatan Laut Kerajaan Norwegia pada awal Perang Dunia II."
 ### NZL - NEW ZEALAND ###
 NZL_submarine_1: "Kelas L"
 NZL_submarine_1_desc: "Kelas L adalah kapal berukuran sedang yang awalnya direncanakan di bawah Program Perang Darurat sebagai versi penyempurnaan dari kelas kapal selam sebelumnya. Mereka dibangun pada tahap akhir Perang Dunia I dan dilengkapi dengan torpedo 21 inci baru yang lebih besar. Mereka bertugas hingga awal Perang Dunia II saat sebagian besar digunakan untuk tugas sekunder dan pelatihan."
 NZL_submarine_2: "Kelas T"
 NZL_submarine_2_desc: "Kapal kelas T atau kelas Triton dirancang untuk menggantikan kapal selam besar kelas O, P, dan R. Mereka adalah kapal selam berukuran cukup besar dengan jangkauan jauh yang sangat cocok untuk Samudra Atlantik dan Pasifik. Kapal-kapal ini merupakan platform yang bersenjata lengkap, stabil, dan digunakan secara ekstensif selama konflik, dengan 25 persen kapal yang dibangun hilang selama perang."
 NZL_submarine_3: "Kelas U"
 NZL_submarine_3_desc: "Kelas U adalah kapal selam berukuran kecil yang dibangun di bawah Program Darurat Perang 1940 dan 1941. Awalnya dirancang sebagai kapal selam latih saat perang pecah, rancangannya diubah sehingga membuktikan kegunaannya di perairan sempit Laut Utara dan Mediterania. Karena ukurannya yang lebih kecil, jangkauan dan persenjataannya terbatas. Tiga subkelas membentuk kelas ini: Undine, Umpire, dan Uproar."
 NZL_submarine_4: "Kelas V"
 NZL_submarine_4_desc: "Kapal selam kelas V atau kelas Vampire didasarkan pada kapal berukuran lebih kecil dari kelas U sebelumnya. Mereka lebih besar tetapi masih relatif kecil, dengan kemampuan pelayaran yang lebih baik namun jangkauan operasional dan persenjataan yang terbatas."
 NZL_destroyer_1: "V/Kelas W"
 NZL_destroyer_1_desc: "Kapal perusak ini termasuk kelas Admirality dan Thornycroft V dan W. Mereka dibangun di bawah Program Darurat Perang. Mereka adalah evolusi utama dari desain kapal perusak Inggris selama Perang Dunia Pertama, yang mewujudkan perbaikan dari pendahulunya serta kemajuan teknologi baru. Sejumlah besar kapal ini dibangun pada tahap akhir Perang Dunia I dan menjadi tulang punggung armada kapal perusak Angkatan Laut Kerajaan setelahnya. Mulai tahun 1930-an, mereka ditempatkan ke dalam armada cadangan, yang akhirnya digunakan untuk tugas pengawalan konvoi. Kapal-kapal tersebut memiliki persenjataan yang memadai, kapal yang cepat dan memiliki jangkauan yang baik."
 NZL_destroyer_2: "G/H/Kelas I"
 NZL_destroyer_2_desc: "Kapal perusak kelas G, H, dan I dipesan sebagai bagian dari Program Pembangunan Angkatan Laut tahun 1933 dan 1934. Mereka umumnya merupakan pengulangan dari kelas F sebelumnya, dengan sedikit pengurangan ukurannya. Persenjataan di kelas G dan H sama dengan kelas F, keduanya menggunakan senjata 4,7 inci. Kapal-kapal ini memiliki jangkauan yang jauh, dipersenjatai dengan memadai, dan dilengkapi torpedo yang kuat. Mereka digunakan secara luas selama perang dan menderita banyak kerugian."
 NZL_destroyer_3: "J/K/Kelas N"
 NZL_destroyer_3_desc: "Kelas J, K, dan N mirip dengan kelas Tribal sebelumnya tetapi alih-alih menekankan persenjataan senjata, para perancang kembali ke torpedo berat yang lebih standar dan pengaturan senjata yang lebih ringan. Kapal-kapal itu dimodifikasi selama masa perang mereka. Peningkatannya mencakup peningkatan senjata anti-pesawat dan radar. Mereka adalah kapal yang cepat, memiliki jangkauan jauh, dan dipersenjatai dengan baik, ideal untuk pengawalan armada."
 NZL_destroyer_4: "Kelas Battle"
 NZL_destroyer_4_desc: "Perusak kelas Battle dibangun berdasarkan evolusi perusak Inggris yang digunakan sepanjang perang. Kapal-kapal ini dipesan sebagai bagian dari Program Angkatan Laut 1942 dan 1943. Mereka bersenjata lengkap baik dalam hal meriam maupun torpedo. Persenjataan AA, kemampuan ASW, kecepatan, dan jangkauannya menjadikan mereka kapal yang serbaguna. Keterlambatan masuknya mereka ke dalam perang menyebabkan kontribusi yang minimal."
 NZL_light_cruiser_1: "Kelas C"
 NZL_light_cruiser_1_desc: "Kapal penjelajah ringan kelas C adalah sekelompok dua puluh delapan kapal penjelajah ringan Angkatan Laut Kerajaan. Mereka dibangun sebelum dan selama Perang Dunia Pertama untuk kondisi Laut Utara yang sulit. Kapal-kapal ini terbukti tangguh dan tangguh meskipun ukurannya agak kecil dan sempit. Persenjataan mereka lebih dari memuaskan, karena mereka membawa senjata berukuran 6 inci yang cukup untuk melawan target permukaan musuh dan muatan torpedo yang berat. Mereka banyak digunakan selama Perang Dunia I dan berpartisipasi dalam banyak aksi permukaan. Hanya subkelas Caledon, Ceres, dan Carlisle yang beroperasi pada pertengahan tahun 1930-an."
 #NZL_light_cruiser_1c: "Leander Class"
 NZL_light_cruiser_2: "Kelas Southampton"
 NZL_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 NZL_light_cruiser_3: "Kelas Gambia"
 NZL_light_cruiser_3_desc: "Kelas Gambia adalah sebutan Selandia Baru untuk kapal penjelajah ringan kelas British Crown Colony. Ini adalah versi perbaikan dari kelas Kota sebelumnya tetapi dengan desain yang disederhanakan untuk mempercepat konstruksi dan mengurangi biaya. Kapal-kapal tersebut membawa senjata yang sama seperti pendahulunya, empat menara rangkap tiga yang menampung senjata 6 inci. Mereka juga memiliki lapis baja yang sama tetapi karena mesinnya yang lebih kecil, jangkauan mereka agak berkurang. Tipenya mencakup dua subkelas: Fiji dan Ceylon."
 NZL_light_cruiser_4: "Black Kelas Prince"
 NZL_light_cruiser_4_desc: "Kelas Pangeran Hitam adalah sebutan Kanada untuk kapal penjelajah ringan kelas Minotaur Inggris (atau kelas Swiftsure). Kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang disahkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih panjang dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sementara persenjataan utama dikurangi menjadi tiga menara rangkap tiga. Dibangun terlambat untuk mempengaruhi hasil perang, sebagian besar kapal yang dipesan dibatalkan setelahnya."
 NZL_heavy_cruiser_1: "Kelas Hawkins"
 NZL_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 NZL_heavy_cruiser_2: "Kelas Surrey"
 NZL_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Surrey diusulkan berdasarkan Program Angkatan Laut 1928. Mereka adalah versi perbaikan dari kapal penjelajah berat kelas York sebelumnya. Seandainya selesai, mereka akan dilengkapi dengan empat menara meriam kembar berukuran 8 inci, lapis baja yang lebih berat, dan mesin yang lebih bertenaga. Dua kapal dipesan tetapi tidak ada yang ditetapkan."
 NZL_heavy_cruiser_3: "Kelas Admiral"
 NZL_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 NZL_heavy_cruiser_4: "Desain Churchill"
 NZL_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini akan memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 NZL_battle_cruiser_1: "Kelas Renown"
 NZL_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 NZL_battle_cruiser_2: "Princess Kelas Royal"
 NZL_battle_cruiser_2_desc: "Princess Royal adalah kelas kapal penjelajah tempur hipotetis yang merupakan versi kapal perang kelas King George V yang lebih cepat dan lebih murah. Kapal-kapal ini membawa persenjataan serupa tetapi lebih sedikit untuk pertempuran permukaan dan anti-udara: dua meriam triple 14 inci dan enam senjata kembar AA 5,25 inci. Kecepatan tinggi dan jangkauan jauh mereka akan memberikan Angkatan Laut Kerajaan Inggris kemampuan serangan cepat dan perlindungan konvoi, namun lapis baja mereka yang terbatas akan menjadi masalah jika mereka harus melawan kapal perang modern."
 NZL_battleship_1: "Kelas Revenge"
 NZL_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 NZL_battleship_2: "King George Kelas V"
 NZL_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 NZL_battleship_3: "Kelas Lion"
 NZL_battleship_3_desc: "Kapal perang kelas Lion adalah kelas lanjutan dari kapal perang King George V, yang menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut tahun 1938 untuk menggantikan kapal perang kelas Revenge yang sudah tua tetapi tidak ada yang selesai karena meletusnya permusuhan. Kapal-kapal tersebut secara umum akan mirip dengan kelas King George, tetapi persenjataan utamanya akan lebih berat, dan memperkenalkan meriam 16 inci yang baru. Mereka juga akan memiliki baju besi yang lebih tebal dan mesin yang lebih bertenaga."
 NZL_battleship_4: "Kelas Vanguard"
 NZL_battleship_4_desc: "Kapal perang kelas Vanguard adalah kapal perang terakhir yang dibangun untuk Angkatan Laut Kerajaan. Satu kapal dipesan tetapi empat kapal lagi dipertimbangkan untuk teater Pasifik. Diperintahkan berdasarkan Program Perang Darurat 1940, konstruksi tidak mendapat prioritas utama dan selesai setelah perang. Kelas ini memiliki lambung yang ramping, memberikan stabilitas dan kelayakan laut yang sangat baik. Persenjataannya sama dengan kapal perang kelas Ratu Elizabeth dan Revenge, memberikan daya tembak yang cukup besar. Mesin yang kuat dan pelindung yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 NZL_SH_battleship_1: "Kelas Centurion"
 NZL_SH_battleship_1_desc: "Centurion adalah kelas kapal perang berat hipotetis Angkatan Laut Kerajaan Inggris yang dibangun untuk melawan kapal besar angkatan laut Jerman dan Jepang. Senjata besar berukuran 18 inci dan baju besi tebal memberi kapal daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal ini. Persenjataan AA yang kuat, jangkauan yang jauh, dan kecepatan yang baik merupakan kebutuhan untuk menutupi lautan luas Kerajaan Inggris."
 NZL_SH_battleship_2: "Lion Kelas II"
 NZL_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 NZL_carrier_1: "Kelas Courageous"
 NZL_carrier_1_desc: "Ketiga kapal induk ini diubah menjadi kapal penjelajah tempur dan merupakan kapal induk pertama Angkatan Laut Kerajaan. Konversi kapal-kapal tersebut merupakan hasil dari Perjanjian Angkatan Laut Washington tahun 1922 dan pekerjaan tersebut selesai pada tahun 1925. Kapal-kapal ini memiliki lapis baja sedang namun dipersenjatai dengan baik, dengan jangkauan yang jauh dan kecepatan yang baik, namun karena sifat konversinya, pelengkap pesawat mereka terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam konstruksi kapal induk dan proyeksi armada udara."
 NZL_carrier_2: "Ark Kelas Royal"
 NZL_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama yang dibangun untuk memenuhi batasan Perjanjian Angkatan Laut Washington. Dia adalah kapal pertama di mana hanggar dan dek penerbangan merupakan bagian integral dari lambung kapal. Dirancang pada tahun 1934, kapal ini memiliki lapis baja dan persenjataan yang baik. Kapal ini membawa sejumlah besar pesawat dan memiliki jangkauan operasional serta kecepatan yang memadai untuk mengimbangi kekuatan utama Angkatan Laut Kerajaan."
 NZL_carrier_3: "Kelas Illustrious"
 NZL_carrier_3_desc: "Kelas Illustrious dirancang sesuai dengan batasan Perjanjian Angkatan Laut London Kedua tahun 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Dia adalah kapal induk Inggris pertama yang memiliki dek penerbangan lapis baja, yang mengurangi ukuran kelompok udaranya. Armor berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal, sementara mesin yang kuat dan simpanan bahan bakar yang besar memberikan jangkauan operasional yang jauh pada kapal."
 NZL_carrier_4: "Kelas Implacable"
 NZL_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 ### POR - PORTUGAL ###
 POR_submarine_1: "Kelas Foca"
 POR_submarine_1_desc: "Kelas Foca Portugis mewakili tiga kapal selam kecil yang dibangun di Italia untuk Angkatan Laut Portugis tak lama setelah Perang Dunia I. Kapal tersebut merupakan versi yang diperbesar dari kelas Espadarte Italia dan kapal saudara dari kelas A Spanyol. Bobotnya hanya 260 ton dan dipersenjatai dengan dua tabung torpedo 450 mm. Ketiga kapal tersebut dinonaktifkan pada pertengahan tahun 1930-an."
 POR_submarine_2: "Kelas Delfim"
 POR_submarine_2_desc: "Kelas Delfim terdiri dari sepasang kapal selam yang awalnya dipesan dan dibangun di Italia untuk Angkatan Laut Portugis pada awal tahun 1930-an. Perintah itu dibatalkan dan kapal-kapal itu malah diselesaikan untuk Angkatan Laut Italia. Mereka didasarkan pada kelas Squalo Italia yang besar, berbobot 980 ton dan dipersenjatai dengan delapan tabung torpedo 533 mm."
 POR_submarine_4: "Kelas Narval"
 POR_submarine_4_desc: "Kelas Narval terdiri dari tiga kapal selam kelas Halus Inggris yang ditugaskan pada tahun 1945 dan dijual ke Portugal setelah Perang Dunia II. Mereka berbobot 840 ton dan dipersenjatai dengan tujuh tabung torpedo 533mm."
 POR_destroyer_1: "Kelas Douro"
 POR_destroyer_1_desc: "Kelas Douro adalah kelas tujuh kapal perusak yang diluncurkan pada awal tahun 1930-an. Mereka dibangun di Portugal dan Inggris. Dua kapal tersebut dijual ke Kolombia pada tahun 1934. Kapal-kapal tersebut berbobot lebih dari 1.200 ton dan dipersenjatai dengan empat senjata BL 4,7 inci dan delapan tabung torpedo 533mm."
 ### PRU - PERU ###
 PRU_submarine_1: "Kelas R"
 PRU_submarine_1_desc: "Kapal selam kelas R Peru terdiri dari empat kapal selam yang dipesan dan dibangun oleh AS pada pertengahan tahun 1920an. Mereka pada dasarnya identik dengan kapal selam kelas R AS, berbobot lebih dari 570 ton dan dipersenjatai dengan empat tabung torpedo 533mm."
 PRU_destroyer_1: "Almirante Kelas Villar"
 PRU_destroyer_1_desc: "Almirante Villar dan Amirante Guise adalah dua kapal perusak kelas Novik Rusia. Mereka memiliki jalur tidak langsung ke Angkatan Laut Peru, berlayar di bawah bendera Inggris dan Estonia sebelum akhirnya dikirim ke Peru pada tahun 1934. Mereka dipersenjatai dengan empat senjata kaliber 102mm/60 dan sembilan tabung torpedo 533mm. Bobotnya lebih dari 1.200 ton dan memiliki kecepatan yang layak untuk ukuran dan modelnya."
 PRU_light_cruiser_1: "Almirante Kelas Grau"
 PRU_light_cruiser_1_desc: "Kelas Almirante Grau terdiri dari dua kapal penjelajah ringan sebelum Perang Dunia I yang dibangun di Inggris untuk Angkatan Laut Peru dan ditugaskan pada tahun 1907. Bahkan untuk sebuah kapal penjelajah ringan, kapal-kapal tersebut cukup kecil, hanya berbobot 3.100 ton, dan juga memiliki kecepatan di bawah rata-rata. Mereka lapis baja ringan dan memiliki senjata kembar Vickers kaliber 152mm/50 sebagai persenjataan utama mereka."
 ### RAJ - BRITISH RAJ ###
 RAJ_submarine_1: "Kelas L"
 RAJ_submarine_1_desc: "Kelas L adalah kapal berukuran sedang yang awalnya direncanakan di bawah Program Perang Darurat sebagai versi penyempurnaan dari kelas kapal selam sebelumnya. Mereka dibangun pada tahap akhir Perang Dunia I dan dilengkapi dengan torpedo 21 inci baru yang lebih besar. Mereka bertugas hingga awal Perang Dunia II saat sebagian besar digunakan untuk tugas sekunder dan pelatihan."
 RAJ_submarine_2: "Kelas T"
 RAJ_submarine_2_desc: "Kapal selam kelas T atau kelas Triton dirancang untuk menggantikan kapal selam besar kelas O, P, dan R. Mereka adalah kapal selam berukuran sedang dengan jangkauan jauh yang cocok untuk Samudera Atlantik dan Pasifik. Perahu-perahu ini dipersenjatai dengan baik, memiliki platform yang stabil dan digunakan secara luas selama konflik, karena 25 persen perahu yang dibangun hilang selama perang."
 RAJ_submarine_3: "Kelas U"
 RAJ_submarine_3_desc: "Kelas U adalah kapal selam berukuran kecil yang dibangun di bawah Program Darurat Perang 1940 dan 1941. Awalnya dirancang sebagai kapal selam latih saat perang pecah, rancangannya diubah sehingga membuktikan kegunaannya di perairan sempit Laut Utara dan Mediterania. Karena ukurannya yang lebih kecil, jangkauan dan persenjataannya terbatas. Tiga subkelas membentuk kelas ini: Undine, Umpire, dan Uproar."
 RAJ_submarine_4: "Kelas V"
 RAJ_submarine_4_desc: "Kapal selam kelas V atau kelas Vampire didasarkan pada kapal berukuran lebih kecil dari kelas U sebelumnya. Mereka lebih besar tetapi masih relatif kecil, dengan kemampuan pelayaran yang lebih baik namun jangkauan operasional dan persenjataan yang terbatas."
 RAJ_destroyer_1: "V/Kelas W"
 RAJ_destroyer_1_desc: "Kapal perusak ini termasuk kelas Admirality dan Thornycroft V dan W. Mereka dibangun di bawah Program Darurat Perang. Mereka adalah evolusi utama dari desain kapal perusak Inggris selama Perang Dunia Pertama, yang mewujudkan perbaikan dari pendahulunya serta kemajuan teknologi baru. Sejumlah besar kapal ini dibangun pada tahap akhir Perang Dunia I dan menjadi tulang punggung armada kapal perusak Angkatan Laut Kerajaan setelahnya. Mulai tahun 1930-an, mereka ditempatkan ke dalam armada cadangan, yang akhirnya digunakan untuk tugas pengawalan konvoi. Kapal-kapal tersebut memiliki persenjataan yang memadai, kapal yang cepat dan memiliki jangkauan yang baik."
 RAJ_destroyer_2: "G/H/Kelas I"
 RAJ_destroyer_2_desc: "Kapal perusak kelas G, H, dan I dipesan sebagai bagian dari Program Pembangunan Angkatan Laut tahun 1933 dan 1934. Mereka umumnya merupakan pengulangan dari kelas F sebelumnya, dengan sedikit pengurangan ukurannya. Persenjataan di kelas G dan H sama dengan kelas F, keduanya menggunakan senjata 4,7 inci. Kapal-kapal ini memiliki jangkauan yang jauh, dipersenjatai dengan memadai, dan dilengkapi torpedo yang kuat. Mereka digunakan secara luas selama perang dan menderita banyak kerugian."
 RAJ_destroyer_3: "J/K/Kelas N"
 RAJ_destroyer_3_desc: "Kelas J, K, dan N mirip dengan kelas Tribal sebelumnya tetapi alih-alih menekankan persenjataan senjata, para perancang kembali ke torpedo berat yang lebih standar dan pengaturan senjata yang lebih ringan. Kapal-kapal itu dimodifikasi selama masa perang mereka. Peningkatannya mencakup peningkatan senjata anti-pesawat dan radar. Mereka adalah kapal yang cepat, memiliki jangkauan jauh, dan dipersenjatai dengan baik, ideal untuk pengawalan armada."
 RAJ_destroyer_4: "Kelas Battle"
 RAJ_destroyer_4_desc: "Kapal perusak kelas Pertempuran dibangun berdasarkan evolusi kapal perusak Inggris yang digunakan selama perang. Kapal-kapal tersebut dipesan sebagai bagian dari Program Angkatan Laut tahun 1942 dan 1943. Mereka dipersenjatai dengan baik baik dari segi senjata maupun torpedonya. Kemampuan, kecepatan, dan jangkauan ASW persenjataan AA mereka menjadikannya kapal serbaguna. Keterlambatan mereka dalam berperang menyebabkan kontribusi yang minimal."
 RAJ_light_cruiser_1: "Kelas C"
 RAJ_light_cruiser_1_desc: "Kapal penjelajah ringan kelas C adalah sekelompok dua puluh delapan kapal penjelajah ringan Angkatan Laut Kerajaan. Mereka dibangun sebelum dan selama Perang Dunia Pertama untuk kondisi Laut Utara yang sulit. Kapal-kapal ini terbukti tangguh dan tangguh meskipun ukurannya agak kecil dan sempit. Persenjataan mereka lebih dari memuaskan, karena mereka membawa senjata berukuran 6 inci yang cukup untuk melawan target permukaan musuh dan muatan torpedo yang berat. Mereka banyak digunakan selama Perang Dunia I dan berpartisipasi dalam banyak aksi permukaan. Hanya subkelas Caledon, Ceres, dan Carlisle yang beroperasi pada pertengahan tahun 1930-an."
 RAJ_basic_light_cruiser: "Kelas Southampton"
 RAJ_light_cruiser_2: "Kelas Southampton"
 RAJ_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 RAJ_light_cruiser_3: "Crown Kelas Colony"
 RAJ_light_cruiser_3_desc: "Kapal penjelajah ringan kelas Crown Colony merupakan versi perbaikan dari kelas Kota sebelumnya tetapi dengan desain yang disederhanakan untuk mempercepat konstruksi dan mengurangi biaya. Kapal-kapal tersebut membawa senjata yang sama seperti pendahulunya, empat menara rangkap tiga yang menampung senjata 6 inci. Mereka juga memiliki lapis baja yang sama tetapi karena mesinnya yang lebih kecil, jangkauan mereka agak berkurang. Tipenya mencakup dua subkelas: Fiji dan Ceylon."
 RAJ_light_cruiser_4: "Kelas Minotaur"
 RAJ_light_cruiser_4_desc: "Juga dikenal sebagai kelas Swiftsure, kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang diizinkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih jauh dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sementara persenjataan utama dikurangi menjadi tiga kubah tripel. Dibangun terlalu terlambat untuk memengaruhi hasil perang, sebagian besar kapal yang dipesan kemudian dibatalkan."
 RAJ_heavy_cruiser_1: "Kelas Hawkins"
 RAJ_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 RAJ_heavy_cruiser_2: "Kelas Surrey"
 RAJ_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Surrey diusulkan berdasarkan Program Angkatan Laut 1928. Mereka adalah versi perbaikan dari kapal penjelajah berat kelas York sebelumnya. Seandainya selesai, mereka akan dilengkapi dengan empat menara meriam kembar berukuran 8 inci, lapis baja yang lebih berat, dan mesin yang lebih bertenaga. Dua kapal dipesan tetapi tidak ada yang ditetapkan."
 RAJ_heavy_cruiser_3: "Kelas Admiral"
 RAJ_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 RAJ_heavy_cruiser_4: "Desain Churchill"
 RAJ_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini akan memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 RAJ_battle_cruiser_1: "Kelas Renown"
 RAJ_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 RAJ_battle_cruiser_2: "Princess Kelas Royal"
 RAJ_battle_cruiser_2_desc: "Princess Royal adalah kelas kapal penjelajah tempur hipotetis yang merupakan versi kapal perang kelas King George V yang lebih cepat dan lebih murah. Kapal-kapal ini membawa persenjataan serupa tetapi lebih sedikit untuk pertempuran permukaan dan anti-udara: dua meriam triple 14 inci dan enam senjata kembar AA 5,25 inci. Kecepatan tinggi dan jangkauan jauh mereka akan memberikan Angkatan Laut Kerajaan Inggris kemampuan serangan cepat dan perlindungan konvoi, namun lapis baja mereka yang terbatas akan menjadi masalah jika mereka harus melawan kapal perang modern."
 RAJ_battleship_1: "Kelas Revenge"
 RAJ_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 RAJ_battleship_2: "King George Kelas V"
 RAJ_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 RAJ_battleship_3: "Kelas Lion"
 RAJ_battleship_3_desc: "Kapal perang kelas Lion adalah kelas lanjutan dari kapal perang King George V, yang menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut tahun 1938 untuk menggantikan kapal perang kelas Revenge yang sudah tua tetapi tidak ada yang selesai karena meletusnya permusuhan. Kapal-kapal tersebut secara umum akan mirip dengan kelas King George, tetapi persenjataan utamanya akan lebih berat, dan memperkenalkan meriam 16 inci yang baru. Mereka juga akan memiliki baju besi yang lebih tebal dan mesin yang lebih bertenaga."
 RAJ_battleship_4: "Kelas Vanguard"
 RAJ_battleship_4_desc: "Kapal perang kelas Vanguard adalah kapal perang terakhir yang dibangun untuk Angkatan Laut Kerajaan. Satu kapal dipesan tetapi empat kapal lagi dipertimbangkan untuk teater Pasifik. Diperintahkan berdasarkan Program Perang Darurat 1940, konstruksi tidak mendapat prioritas utama dan selesai setelah perang. Kelas ini memiliki lambung yang ramping, memberikan stabilitas dan kelayakan laut yang sangat baik. Persenjataannya sama dengan kapal perang kelas Ratu Elizabeth dan Revenge, memberikan daya tembak yang cukup besar. Mesin yang kuat dan pelindung yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 RAJ_SH_battleship_1: "Kelas Centurion"
 RAJ_SH_battleship_1_desc: "Centurion adalah kelas kapal perang berat hipotetis Angkatan Laut Kerajaan Inggris yang dibangun untuk melawan kapal besar angkatan laut Jerman dan Jepang. Senjata besar berukuran 18 inci dan baju besi tebal memberi kapal daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal ini. Persenjataan AA yang kuat, jangkauan yang jauh, dan kecepatan yang baik merupakan kebutuhan untuk menutupi lautan luas Kerajaan Inggris."
 RAJ_SH_battleship_2: "Lion Kelas II"
 RAJ_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 RAJ_carrier_1: "Kelas Courageous"
 RAJ_carrier_1_desc: "Ketiga kapal induk ini diubah menjadi kapal penjelajah tempur dan merupakan kapal induk pertama Angkatan Laut Kerajaan. Konversi kapal-kapal tersebut merupakan hasil dari Perjanjian Angkatan Laut Washington tahun 1922 dan pekerjaan tersebut selesai pada tahun 1925. Kapal-kapal ini memiliki lapis baja sedang namun dipersenjatai dengan baik, dengan jangkauan yang jauh dan kecepatan yang baik, namun karena sifat konversinya, pelengkap pesawat mereka terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam konstruksi kapal induk dan proyeksi armada udara."
 RAJ_carrier_2: "Ark Kelas Royal"
 RAJ_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama yang dibangun untuk memenuhi batasan Perjanjian Angkatan Laut Washington. Dia adalah kapal pertama di mana hanggar dan dek penerbangan merupakan bagian integral dari lambung kapal. Dirancang pada tahun 1934, kapal ini memiliki lapis baja dan persenjataan yang baik. Kapal ini membawa sejumlah besar pesawat dan memiliki jangkauan operasional serta kecepatan yang memadai untuk mengimbangi kekuatan utama Angkatan Laut Kerajaan."
 RAJ_carrier_3: "Kelas Illustrious"
 RAJ_carrier_3_desc: "Kelas Illustrious dirancang sesuai dengan batasan Perjanjian Angkatan Laut London Kedua tahun 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Dia adalah kapal induk Inggris pertama yang memiliki dek penerbangan lapis baja, yang mengurangi ukuran kelompok udaranya. Armor berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal, sementara mesin yang kuat dan simpanan bahan bakar yang besar memberikan jangkauan operasional yang jauh pada kapal."
 RAJ_carrier_4: "Kelas Implacable"
 RAJ_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 ### ROM - ROMANIA ###
 ROM_submarine_1: "Kelas Delfinul"
 ROM_submarine_1_desc: "Delfinul adalah kapal selam Rumania yang dibangun di Italia untuk Angkatan Laut Rumania. Diluncurkan pada tahun 1930 dan kapal berbobot 650 ton dan dipersenjatai dengan enam tabung torpedo 533mm."
 ROM_submarine_3: "Kelas Requinul"
 ROM_submarine_3_desc: "Kapal selam Requinul dan Marsuinul dibangun oleh Jerman untuk sekutu mereka di Rumania. Mereka ditugaskan pada tahun 1943. Kapal-kapal tersebut didasarkan pada kapal selam Tipe VII Jerman. Kapal-kapal tersebut merupakan kapal selam berukuran sedang, berbobot 600 ton, dan dipersenjatai dengan enam tabung torpedo 533 mm."
 ROM_destroyer_1: "Kelas Marasti"
 ROM_destroyer_1_desc: "Kelas Marasti adalah kelas kapal perusak yang dibangun untuk Rumania selama Perang Dunia I. Keempat kapal kelas tersebut diminta oleh Angkatan Laut Italia selama perang, dan dua akhirnya dijual ke Rumania pada awal tahun 1920-an. Mereka adalah kapal perusak yang lebih besar, berbobot lebih dari 1.400 ton. Mereka dipersenjatai dengan empat senjata Schneider-Canet-Armstrong 120mm/45 dan empat tabung torpedo 450mm. Mereka memiliki kecepatan dan keandalan rata-rata untuk model lama mereka."
 #ROM_destroyer_1b: "Regele Ferdinand Class"
 ### SAF - SOUTH AFRICA ###
