 SAF_light_cruiser_1_desc: "Kapal penjelajah ringan kelas C adalah sekelompok dua puluh delapan kapal penjelajah ringan Angkatan Laut Kerajaan. Mereka dibangun sebelum dan selama Perang Dunia Pertama untuk kondisi Laut Utara yang sulit. Kapal-kapal ini terbukti tangguh dan tangguh meskipun ukurannya agak kecil dan sempit. Persenjataan mereka lebih dari memuaskan, karena mereka membawa senjata berukuran 6 inci yang cukup untuk melawan target permukaan musuh dan muatan torpedo yang berat. Mereka banyak digunakan selama Perang Dunia I dan berpartisipasi dalam banyak aksi permukaan. Hanya subkelas Caledon, Ceres, dan Carlisle yang beroperasi pada pertengahan tahun 1930-an."
 SAF_light_cruiser_2: "Kelas Southampton"
 SAF_light_cruiser_2_desc: "Penjelajah ringan kelas Southampton adalah subkelas dari penjelajah kelas Town dan dirancang untuk menandingi penjelajah kelas Mogami Jepang. Kapal-kapal ini berlapis baja tebal, memiliki kecepatan dan jangkauan yang baik, serta membawa persenjataan tangguh berupa dua belas meriam 6 inci dalam empat kubah tripel. Mereka menjadi dasar bagi banyak rancangan penjelajah ringan masa perang RN berikutnya."
 SAF_light_cruiser_3: "Crown Kelas Colony"
 SAF_light_cruiser_3_desc: "Kapal penjelajah ringan kelas Crown Colony merupakan versi perbaikan dari kelas Kota sebelumnya tetapi dengan desain yang disederhanakan untuk mempercepat konstruksi dan mengurangi biaya. Kapal-kapal tersebut membawa senjata yang sama seperti pendahulunya, empat menara rangkap tiga yang menampung senjata 6 inci. Mereka juga memiliki lapis baja yang sama tetapi karena mesinnya yang lebih kecil, jangkauan mereka agak berkurang. Tipenya mencakup dua subkelas: Fiji dan Ceylon."
 SAF_light_cruiser_4: "Kelas Minotaur"
 SAF_light_cruiser_4_desc: "Juga dikenal sebagai kelas Swiftsure, kapal penjelajah ini dirancang sebagai versi modifikasi dari kelas Crown Colony, menggabungkan modifikasi perang yang diizinkan pada tahun 1941. Mereka memiliki jangkauan operasional yang lebih jauh dan persenjataan AA yang lebih banyak daripada kelas Crown Colony, sementara persenjataan utama dikurangi menjadi tiga kubah tripel. Dibangun terlalu terlambat untuk memengaruhi hasil perang, sebagian besar kapal yang dipesan kemudian dibatalkan."
 SAF_heavy_cruiser_1: "Kelas Hawkins"
 SAF_heavy_cruiser_1_desc: "Penjelajah kelas Hawkins adalah penjelajah berat pertama di dunia. Mereka didasarkan pada penjelajah ringan kelas Town sebelumnya, khususnya subkelas Birmingham, tetapi dilengkapi dengan meriam 7,5 inci dan sabuk lapis baja yang lebih tebal. Mereka dirancang untuk melawan kapal penyerbu konvoi besar milik Jerman. Mereka bersenjata lengkap, memiliki kecepatan dan jangkauan memadai, serta perlindungan yang baik. Secara keseluruhan, lima kapal ditugaskan tetapi hanya empat yang aktif pada awal PD II."
 SAF_heavy_cruiser_2: "Kelas Surrey"
 SAF_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Surrey diusulkan berdasarkan Program Angkatan Laut 1928. Mereka adalah versi perbaikan dari kapal penjelajah berat kelas York sebelumnya. Seandainya selesai, mereka akan dilengkapi dengan empat menara meriam kembar berukuran 8 inci, lapis baja yang lebih berat, dan mesin yang lebih bertenaga. Dua kapal dipesan tetapi tidak ada yang ditetapkan."
 SAF_heavy_cruiser_3: "Kelas Admiral"
 SAF_heavy_cruiser_3_desc: "Penjelajah berat kelas Admiral (tidak boleh disamakan dengan penjelajah tempur kelas Admiral) adalah upaya terakhir Royal Navy untuk merancang dan membangun kapal penjelajah bersenjatakan meriam 8 inci. Studi perancangan dimulai pada 1938 dan berakhir pada 1941, menghasilkan berbagai proposal. Proposal akhir menampilkan meriam 8 inci baru dalam kubah tripel, persenjataan AA berat, lapis baja tebal, dan kecepatan yang baik. Kurangnya penjelajah musuh dan efisiensi biaya dari kapal-kapal ini menyebabkan fokus dialihkan untuk membangun lebih banyak penjelajah ringan."
 SAF_heavy_cruiser_4: "Desain Churchill"
 SAF_heavy_cruiser_4_desc: "Kapal-kapal ini diusulkan oleh Sir Winston Churchill, Lord of the Admirality, pada tahap awal Perang Dunia II untuk melawan kapal penjelajah senjata besar kelas Deutschland Jerman. Kapal-kapal ini akan memiliki meriam 9,2 inci, AA berat, dan baju besi yang kuat. Mereka dirancang untuk secara efektif melawan kapal-kapal besar musuh. Kapal-kapal tersebut akhirnya dibatalkan karena biaya tinggi dan kurangnya permintaan akan kapal penjelajah berat baru."
 SAF_battle_cruiser_1: "Kelas Renown"
 SAF_battle_cruiser_1_desc: "Penjelajah tempur kelas Renown awalnya dibangun sebagai versi peningkatan dari kapal tempur kelas Revenge. Pembangunannya ditangguhkan saat pecahnya PD I. Laksamana Lord Fisher berhasil memulai kembali pembangunannya sebagai penjelajah tempur. Kapal-kapal ini adalah wujud sejati dari penjelajah tempur. Mereka bersenjata lengkap, cepat, dan lincah, namun memiliki lapis baja yang lebih tipis dan jangkauan operasional yang lebih pendek. Hanya dua dari tiga kapal awal, Repulse dan Renown, yang berhasil diselesaikan."
 SAF_battle_cruiser_2: "Princess Kelas Royal"
 SAF_battle_cruiser_2_desc: "Princess Royal adalah kelas kapal penjelajah tempur hipotetis yang merupakan versi kapal perang kelas King George V yang lebih cepat dan lebih murah. Kapal-kapal ini membawa persenjataan serupa tetapi lebih sedikit untuk pertempuran permukaan dan anti-udara: dua meriam triple 14 inci dan enam senjata kembar AA 5,25 inci. Kecepatan tinggi dan jangkauan jauh mereka akan memberikan Angkatan Laut Kerajaan Inggris kemampuan serangan cepat dan perlindungan konvoi, namun lapis baja mereka yang terbatas akan menjadi masalah jika mereka harus melawan kapal perang modern."
 SAF_battleship_1: "Kelas Revenge"
 SAF_battleship_1_desc: "Kapal tempur kelas Revenge dipesan pada tahun 1913 sebagai versi murah dari dreadnought cepat kelas Queen Elizabeth. Meskipun dipersenjatai dan dilapisi baja serupa, kecepatannya yang jauh lebih rendah menurunkan peran mereka ke tugas-tugas sekunder selama PD II. Dari 8 kapal yang direncanakan untuk kelas ini, hanya 5 yang selesai dibangun."
 SAF_battleship_2: "King George Kelas V"
 SAF_battleship_2_desc: "Kapal tempur kelas King George V adalah hasil dari Traktat Angkatan Laut Washington 1922 dan London Pertama 1930 yang membatasi bobot benaman maksimum dan kaliber meriam kapal utama. Oleh karena itu, kapal-kapal ini dilengkapi meriam berkaliber lebih kecil daripada kapal tempur terdahulu maupun semasa. Terlepas dari kaliber yang lebih kecil, kapal-kapal ini dipersenjatai dengan memadai, membawa senjata AA yang kuat, serta memiliki perlindungan yang cukup. Lima kapal dipesan dan dibangun sebagai pengganti kapal tempur tua Kelas Queen Elizabeth."
 SAF_battleship_3: "Kelas Lion"
 SAF_battleship_3_desc: "Kapal perang kelas Lion adalah kelas lanjutan dari kapal perang King George V, yang menggabungkan banyak fiturnya. Enam kapal dipesan dalam Program Angkatan Laut tahun 1938 untuk menggantikan kapal perang kelas Revenge yang sudah tua tetapi tidak ada yang selesai karena meletusnya permusuhan. Kapal-kapal tersebut secara umum akan mirip dengan kelas King George, tetapi persenjataan utamanya akan lebih berat, dan memperkenalkan meriam 16 inci yang baru. Mereka juga akan memiliki baju besi yang lebih tebal dan mesin yang lebih bertenaga."
 SAF_battleship_4: "Kelas Vanguard"
 SAF_battleship_4_desc: "Kapal perang kelas Vanguard adalah kapal perang terakhir yang dibangun untuk Angkatan Laut Kerajaan. Satu kapal dipesan tetapi empat kapal lagi dipertimbangkan untuk teater Pasifik. Diperintahkan berdasarkan Program Perang Darurat 1940, konstruksi tidak mendapat prioritas utama dan selesai setelah perang. Kelas ini memiliki lambung yang ramping, memberikan stabilitas dan kelayakan laut yang sangat baik. Persenjataannya sama dengan kapal perang kelas Ratu Elizabeth dan Revenge, memberikan daya tembak yang cukup besar. Mesin yang kuat dan pelindung yang baik membuat kapal ini cepat dan terlindungi dengan baik."
 SAF_SH_battleship_1: "Kelas Centurion"
 SAF_SH_battleship_1_desc: "Centurion adalah kelas kapal perang berat hipotetis Angkatan Laut Kerajaan Inggris yang dibangun untuk melawan kapal besar angkatan laut Jerman dan Jepang. Senjata besar berukuran 18 inci dan baju besi tebal memberi kapal daya tembak dan perlindungan yang diperlukan untuk melawan kapal-kapal ini. Persenjataan AA yang kuat, jangkauan yang jauh, dan kecepatan yang baik merupakan kebutuhan untuk menutupi lautan luas Kerajaan Inggris."
 SAF_SH_battleship_2: "Lion Kelas II"
 SAF_SH_battleship_2_desc: "Kapal tempur kelas Lion II dirancang pada tahun 1944 sebagai versi peningkatan dari kapal tempur kelas Lion sebelumnya. Menggabungkan pelajaran masa perang, rancangan ini lebih besar dan lebih berat, dan jika diselesaikan, akan membawa tiga atau empat kubah tripel meriam 16 inci tipe terbaru. Pelat lapis baja tebal melindungi kapal dari musuh permukaan maupun udara. Biaya pembangunan kapal ini, kekalahan angkatan laut musuh, dan kebutuhan akan kapal induk menyebabkan proyek ini ditinggalkan."
 SAF_carrier_1: "Kelas Courageous"
 SAF_carrier_1_desc: "Ketiga kapal induk ini diubah menjadi kapal penjelajah tempur dan merupakan kapal induk pertama Angkatan Laut Kerajaan. Konversi kapal-kapal tersebut merupakan hasil dari Perjanjian Angkatan Laut Washington tahun 1922 dan pekerjaan tersebut selesai pada tahun 1925. Kapal-kapal ini memiliki lapis baja sedang namun dipersenjatai dengan baik, dengan jangkauan yang jauh dan kecepatan yang baik, namun karena sifat konversinya, pelengkap pesawat mereka terbatas. Meskipun demikian, mereka memberi Royal Navy pengalaman penting dalam konstruksi kapal induk dan proyeksi armada udara."
 SAF_carrier_2: "Ark Kelas Royal"
 SAF_carrier_2_desc: "Kapal induk Ark Royal adalah kapal pertama yang dibangun untuk memenuhi batasan Perjanjian Angkatan Laut Washington. Dia adalah kapal pertama di mana hanggar dan dek penerbangan merupakan bagian integral dari lambung kapal. Dirancang pada tahun 1934, kapal ini memiliki lapis baja dan persenjataan yang baik. Kapal ini membawa sejumlah besar pesawat dan memiliki jangkauan operasional serta kecepatan yang memadai untuk mengimbangi kekuatan utama Angkatan Laut Kerajaan."
 SAF_carrier_3: "Kelas Illustrious"
 SAF_carrier_3_desc: "Kelas Illustrious dirancang sesuai dengan batasan Perjanjian Angkatan Laut London Kedua tahun 1936, yang membatasi ukuran kapal induk hingga batas atas 23.000 ton. Dia adalah kapal induk Inggris pertama yang memiliki dek penerbangan lapis baja, yang mengurangi ukuran kelompok udaranya. Armor berat dan persenjataan AA memberikan pertahanan yang kuat bagi kapal, sementara mesin yang kuat dan simpanan bahan bakar yang besar memberikan jangkauan operasional yang jauh pada kapal."
 SAF_carrier_4: "Kelas Implacable"
 SAF_carrier_4_desc: "Kapal induk kelas Implacable dipesan berdasarkan Program Angkatan Laut 1938 dan pada dasarnya merupakan versi peningkatan dari kelas Illustrious sebelumnya. Perang dan pergeseran prioritas ke kapal-kapal yang lebih kecil untuk tugas pengawalan konvoi pada tahap awal dan pertengahan perang memperlambat konstruksi kapal-kapal ini. Mereka adalah kapal yang lebih besar yang mampu membawa lebih banyak pesawat sambil mempertahankan lapis baja tebal pada lambung dan dek penerbangan. Mesin yang lebih bertenaga memberinya kecepatan dan jangkauan operasional yang lebih besar dibandingkan kelas Illustrious."
 ### SIA - SIAM ###
 SIA_submarine_2: "Kelas Vilun"
 SIA_submarine_2_desc: "Kapal selam kelas Vilun adalah empat kapal selam pantai kecil yang dibangun di Jepang untuk Angkatan Laut Kerajaan Thailand antara tahun 1936 dan 1938. Kapal selam ini berbobot 370 ton dan dipersenjatai dengan lima tabung torpedo 533 mm."
 SIA_destroyer_1: "Phra Kelas Ruang"
 SIA_destroyer_1_desc: "Phra Ruang adalah bekas kapal perusak kelas R Inggris yang dijual ke Angkatan Laut Kerajaan Thailand pada tahun 1920. Kapal ini berbobot lebih dari 1.000 ton dan dipersenjatai dengan tiga senjata QF Mk IV 120mm/45 dan empat tabung torpedo 533mm. Mereka memiliki kecepatan, jangkauan, dan keandalan yang bagus untuk model vintage mereka."
 SIA_light_cruiser_3: "Kelas Taskin"
 SIA_light_cruiser_3_desc: "Kelas Taskin terdiri dari sepasang kapal penjelajah ringan yang dibangun di Italia. Mereka diluncurkan pada tahun 1941 tetapi diminta oleh angkatan laut Siam pada tahun 1942. Mereka akan menjadi kapal penjelajah AA Italia kelas Etna di Regia Marina tetapi tidak pernah selesai sebelum gencatan senjata Italia. Kapal ini akan berbobot 5.900 ton dan dipersenjatai dengan enam senjata 152mm/53 OTO 1929 sebagai persenjataan utama mereka. Mereka akan memiliki baju besi yang layak tetapi akan cukup lambat untuk sebuah kapal penjelajah."
 SIA_heavy_cruiser_1: "Sri Kelas Ayuthia"
 SIA_heavy_cruiser_1_desc: "Kapal pertahanan pantai kelas Sri Ayuthia mungkin merupakan kapal terakhir dari jenis ini yang dibangun di dunia, dengan kedua kapal kelas tersebut dibangun di Jepang dan ditugaskan untuk Angkatan Laut Kerajaan Thailand pada tahun 1938. Desainnya sebanding dengan ukuran kapal penjelajah kecil (atau kapal perusak besar), kecepatan kapal perang, dan kapal penjelajah berat dalam persenjataan. Senjata utamanya adalah empat meriam 203mm/53 3-Shiki. Mereka memiliki lapis baja ringan dibandingkan dengan kapal penjelajah berat kontemporer."
 ### SPA - NATIONALIST SPAIN ###
 SPA_submarine_1: "Kelas B"
 SPA_submarine_1_desc: "Kelas B adalah kapal selam pertama yang dibangun di Spanyol untuk Angkatan Laut Spanyol. Keenam kapal kelas tersebut ditugaskan antara tahun 1922 dan 1925. Kapal-kapal tersebut dirancang sebagai kapal berlambung tunggal, dan akibatnya keandalannya di bawah standar. Mereka adalah kapal selam berukuran sedang, berbobot lebih dari 550 ton. Mereka dipersenjatai dengan empat tabung torpedo 450mm."
 #SPA_submarine_1b: "C Class"
 SPA_submarine_2: "General Kelas Mola"
 SPA_submarine_2_desc: "§Tkelas Jenderal Mola adalah kelas dari empat kapal selam kelas Archimedes Italia yang ditugaskan pada tahun 1934 dan diserahkan kepada Nasionalis pada tahun 1937. Kapal ini cukup besar, berbobot 880 ton, namun lebih cepat dari kebanyakan kapal selam. Mereka dipersenjatai dengan delapan tabung torpedo 533mm dan memiliki kedalaman menyelam 90m.§!"
 SPA_submarine_3: "Kelas G"
 SPA_submarine_3_desc: "Kapal selam kelas G Spanyol adalah sepasang kapal selam kelas VIIC Jerman yang dibuat dengan lisensi oleh Nasionalis Spanyol. Namun hanya satu yang selesai dibangun dan baru diserahkan kepada Angkatan Laut Spanyol pada tahun 1947. Kapal selam ini memiliki bobot 770 ton dan dipersenjatai dengan lima tabung torpedo 533 mm. Mereka memiliki kecepatan dan jangkauan yang sangat baik, karena Tipe VIIC adalah pekerja keras armada kapal selam Jerman."
 SPA_submarine_4: "Kelas D"
 SPA_submarine_4_desc: "Ketiga kapal selam kelas D Spanyol semuanya diluncurkan pada tahun 1944 dan ditugaskan pada waktu yang berbeda-beda setelah perang. Ketiganya dirancang dan dibangun di Spanyol. Mereka adalah kapal selam besar yang mengarungi lautan, berbobot 1.050 ton. Mereka dipersenjatai dengan enam tabung torpedo 533mm dan memiliki kecepatan dan jangkauan yang sangat baik."
 SPA_destroyer_1: "Kelas Alsedo"
 SPA_destroyer_1_desc: "Tiga kapal perusak kelas Alsedo dibangun untuk Angkatan Laut Spanyol di Spanyol. Mereka didasarkan pada desain kelas L Inggris, dan ditugaskan antara tahun 1924 dan 1925. Mereka memiliki bobot lebih dari 1.040 ton dan memiliki tiga senjata Vickers Mk LA 102mm/45 sebagai persenjataan utama mereka, serta empat tabung torpedo 450mm. Mereka juga memiliki kecepatan dan jangkauan yang layak untuk model vintage mereka."
 SPA_destroyer_2: "Kelas Churruca"
 SPA_destroyer_2_desc: "Kelas Churruca Spanyol mencakup enam belas kapal perusak yang diluncurkan antara tahun 1925 dan 1933, dua di antaranya kemudian dijual ke Argentina. Kapal-kapal tersebut dirancang berdasarkan kapal perusak kelas S Inggris dan menjadi tulang punggung Angkatan Laut Spanyol selama Perang Saudara. Mereka berbobot lebih dari 1.500 ton dan dipersenjatai dengan lima senjata Vickers-Armstrong 120mm/45 sebagai persenjataan utama mereka, serta enam tabung torpedo 533mm. Mereka memiliki kecepatan yang bagus dan jangkauan yang sangat baik."
 SPA_destroyer_4: "ÁKelas lava"
 SPA_destroyer_4_desc: "Kapal perusak kelas Álava diluncurkan pascaperang sebagai peningkatan dari kelas Almirante Antequera sebelumnya (yang merupakan subkelas dari kelas Churruca sebelumnya). Mereka berbobot 1.710 ton dan memiliki empat Vickers-Armstrong Mk F 120mm/45 sebagai senjata utama mereka. Kecepatan dan jangkauannya sebanding dengan desain sebelumnya yang dibangun oleh kelas tersebut."
 SPA_light_cruiser_1: "Méndez NúñKelas es"
 SPA_light_cruiser_1_desc: "Kapal penjelajah ringan kelas Méndez Núñes adalah sepasang kapal penjelajah yang dibangun di Spanyol untuk Angkatan Laut Spanyol pada awal 1920-an. Kapal-kapal tersebut dipesan pada tahun 1915 tetapi kekurangan bahan selama Perang Dunia I menunda pembangunannya. Desainnya sangat dipengaruhi oleh kapal penjelajah kelas C Inggris. Kapal penjelajah ini mempunyai bobot hampir 4.800 ton tetapi relatif lambat. Persenjataan utamanya terdiri dari enam senjata Vickers Mk V 152mm/50. Ia juga memiliki lapis baja yang bagus dan selusin tabung torpedo 533mm."
 #SPA_light_cruiser_1b: "Príncipe Alfonso Class"
 SPA_heavy_cruiser_1: "Kelas Princesa de Asturias"
 SPA_heavy_cruiser_1_desc: "Kelas Princesa de Asturias terdiri dari tiga kapal penjelajah lapis baja yang dibangun untuk Angkatan Laut Spanyol sekitar pergantian abad. Ketiganya telah dibuang atau dirusak pada pertengahan tahun 1930-an. Mereka dipersenjatai dengan senjata kembar Guillén M1896 240mm dan delapan senjata Schneider-Canet 140mm/33. Mereka berlapis baja berat tetapi juga agak lambat dibandingkan dengan kapal penjelajah berat standar."
 SPA_heavy_cruiser_2: "Kelas Canarias"
 SPA_heavy_cruiser_2_desc: "Dua kapal penjelajah berat kelas Canarias dibangun sesuai spesifikasi perjanjian Angkatan Laut Washington. Kapal-kapal tersebut diluncurkan pada awal tahun 1930-an tetapi baru selesai pada tahun 1936. Kapal-kapal tersebut berbobot hampir 10.700 ton dan memiliki kecepatan yang baik. Mereka memiliki lapis baja yang relatif ringan tetapi menggunakan delapan senjata Vickers-Armstrong Mk D 203mm/50 sebagai persenjataan utama mereka."
 SPA_battleship_1: "EspañKelas a"
 SPA_battleship_1_desc: "Kelas España awalnya merupakan kelas yang terdiri dari tiga kapal perang kapal penempur yang ditugaskan sekitar masa Perang Dunia I, meskipun ada satu kapal yang rusak pada masa Perang Saudara Spanyol. Dua lainnya hilang selama perang. Mereka cukup kecil untuk sebuah kapal perang, berbobot lebih dari 15.400 ton. Namun, mereka memiliki lapis baja yang layak dan kecepatan yang layak, serta memiliki baterai utama yang terdiri dari delapan senjata Vickers H 305mm/50."
 ### SPR - REPUBLICAN SPAIN ###
 SPR_submarine_1: "Kelas B"
 SPR_submarine_1_desc: "Kelas B adalah kapal selam pertama yang dibangun di Spanyol untuk Angkatan Laut Spanyol. Keenam kapal kelas tersebut ditugaskan antara tahun 1922 dan 1925. Kapal-kapal tersebut dirancang sebagai kapal berlambung tunggal, dan akibatnya keandalannya di bawah standar. Mereka adalah kapal selam berukuran sedang, berbobot lebih dari 550 ton. Mereka dipersenjatai dengan empat tabung torpedo 450mm."
 #SPR_submarine_1b: "C Class"
 SPR_submarine_2: "General Kelas Mola"
 SPR_submarine_2_desc: "Kelas Jenderal Mola adalah kelas dari empat kapal selam kelas Archimedes Italia yang ditugaskan pada tahun 1934 dan diserahkan kepada Nasionalis pada tahun 1937. Kapal ini cukup besar, berbobot 880 ton, namun lebih cepat dari kebanyakan kapal selam. Mereka dipersenjatai dengan delapan tabung torpedo 533mm dan memiliki kedalaman menyelam 90m."
 SPR_submarine_3: "Kelas G"
 SPR_submarine_3_desc: "Kapal selam kelas G Spanyol adalah sepasang kapal selam kelas VIIC Jerman yang dibuat dengan lisensi oleh Nasionalis Spanyol. Namun hanya satu yang selesai dibangun dan baru diserahkan kepada Angkatan Laut Spanyol pada tahun 1947. Kapal selam ini memiliki bobot 770 ton dan dipersenjatai dengan lima tabung torpedo 533 mm. Mereka memiliki kecepatan dan jangkauan yang sangat baik, karena Tipe VIIC adalah pekerja keras armada kapal selam Jerman."
 SPR_submarine_4: "Kelas D"
 SPR_submarine_4_desc: "Ketiga kapal selam kelas D Spanyol semuanya diluncurkan pada tahun 1944 dan ditugaskan pada waktu yang berbeda-beda setelah perang. Ketiganya dirancang dan dibangun di Spanyol. Mereka adalah kapal selam besar yang mengarungi lautan, berbobot 1.050 ton. Mereka dipersenjatai dengan enam tabung torpedo 533mm dan memiliki kecepatan dan jangkauan yang sangat baik."
 SPR_destroyer_1: "Kelas Alsedo"
 SPR_destroyer_1_desc: "Tiga kapal perusak kelas Alsedo dibangun untuk Angkatan Laut Spanyol di Spanyol. Mereka didasarkan pada desain kelas L Inggris, dan ditugaskan antara tahun 1924 dan 1925. Mereka memiliki bobot lebih dari 1.040 ton dan memiliki tiga senjata Vickers Mk LA 102mm/45 sebagai persenjataan utama mereka, serta empat tabung torpedo 450mm. Mereka juga memiliki kecepatan dan jangkauan yang layak untuk model vintage mereka."
 SPR_destroyer_2: "Kelas Churruca"
 SPR_destroyer_2_desc: "Kelas Churruca Spanyol mencakup enam belas kapal perusak yang diluncurkan antara tahun 1925 dan 1933, dua di antaranya kemudian dijual ke Argentina. Kapal-kapal tersebut dirancang berdasarkan kapal perusak kelas S Inggris dan menjadi tulang punggung Angkatan Laut Spanyol selama Perang Saudara. Mereka berbobot lebih dari 1.500 ton dan dipersenjatai dengan lima senjata Vickers-Armstrong 120mm/45 sebagai persenjataan utama mereka, serta enam tabung torpedo 533mm. Mereka memiliki kecepatan yang bagus dan jangkauan yang sangat baik."
 SPR_destroyer_4: "ÁKelas lava"
 SPR_destroyer_4_desc: "Kapal perusak kelas Álava diluncurkan pascaperang sebagai peningkatan dari kelas Almirante Antequera sebelumnya (yang merupakan subkelas dari kelas Churruca sebelumnya). Mereka berbobot 1.710 ton dan memiliki empat Vickers-Armstrong Mk F 120mm/45 sebagai senjata utama mereka. Kecepatan dan jangkauannya sebanding dengan desain sebelumnya yang dibangun oleh kelas tersebut."
 SPR_light_cruiser_1: "Méndez NúñKelas es"
 SPR_light_cruiser_1_desc: "Kapal penjelajah ringan kelas Méndez Núñes adalah sepasang kapal penjelajah yang dibangun di Spanyol untuk Angkatan Laut Spanyol pada awal 1920-an. Kapal-kapal tersebut dipesan pada tahun 1915 tetapi kekurangan bahan selama Perang Dunia I menunda pembangunannya. Desainnya sangat dipengaruhi oleh kapal penjelajah kelas C Inggris. Kapal penjelajah ini mempunyai bobot hampir 4.800 ton tetapi relatif lambat. Persenjataan utamanya terdiri dari enam senjata Vickers Mk V 152mm/50. Ia juga memiliki lapis baja yang bagus dan selusin tabung torpedo 533mm."
 #SPR_light_cruiser_1b: "Príncipe Alfonso Class"
 SPR_heavy_cruiser_1: "Kelas Princesa de Asturias"
 SPR_heavy_cruiser_1_desc: "Kelas Princesa de Asturias terdiri dari tiga kapal penjelajah lapis baja yang dibangun untuk Angkatan Laut Spanyol sekitar pergantian abad. Ketiganya telah dibuang atau dirusak pada pertengahan tahun 1930-an. Mereka dipersenjatai dengan senjata kembar Guillén M1896 240mm dan delapan senjata Schneider-Canet 140mm/33. Mereka berlapis baja berat tetapi juga agak lambat dibandingkan dengan kapal penjelajah berat standar."
 SPR_heavy_cruiser_2: "Kelas Canarias"
 SPR_heavy_cruiser_2_desc: "Dua kapal penjelajah berat kelas Canarias dibangun sesuai spesifikasi perjanjian Angkatan Laut Washington. Kapal-kapal tersebut diluncurkan pada awal tahun 1930-an tetapi baru selesai pada tahun 1936. Kapal-kapal tersebut berbobot hampir 10.700 ton dan memiliki kecepatan yang baik. Mereka memiliki lapis baja yang relatif ringan tetapi menggunakan delapan senjata Vickers-Armstrong Mk D 203mm/50 sebagai persenjataan utama mereka."
 SPR_battleship_1: "EspañKelas a"
 SPR_battleship_1_desc: "Kelas España awalnya merupakan kelas yang terdiri dari tiga kapal perang kapal penempur yang ditugaskan sekitar masa Perang Dunia I, meskipun ada satu kapal yang rusak pada masa Perang Saudara Spanyol. Dua lainnya hilang selama perang. Mereka cukup kecil untuk sebuah kapal perang, berbobot lebih dari 15.400 ton. Namun, mereka memiliki lapis baja yang layak dan kecepatan yang layak, serta memiliki baterai utama yang terdiri dari delapan senjata Vickers H 305mm/50."
 ### SWE - SWEEDEN ###
 SWE_submarine_1: "Kelas Hajen"
 SWE_submarine_1_desc: "Kelas Hajen, Bävern, Valen adalah serangkaian kapal selam berukuran kecil hingga menengah yang dibangun untuk Angkatan Laut Swedia pada tahun 1920-an. Kelas Hajen, yang ditugaskan pada tahun 1920, memiliki kapal selam yang berbobot hampir 400 ton dan dipersenjatai dengan empat tabung torpedo 450 mm. Mereka memiliki kedalaman menyelam hanya 30m."
 #SWE_submarine_1b: "Draken Class"
 SWE_submarine_2: "SjöKelas lejonet"
 SWE_submarine_2_desc: "Kelas Sjölejonet terdiri dari sembilan kapal selam yang dibangun antara tahun 1936 dan 1942. Kapal selam ini berukuran sedang, berbobot 580 ton, dan desainnya sangat dipengaruhi oleh kapal selam kelas O Belanda. Mereka dipersenjatai dengan enam tabung torpedo 533mm dan memiliki kedalaman menyelam 60m."
 SWE_submarine_3: "Kelas U"
 SWE_submarine_3_desc: "Kapal selam kelas U Swedia adalah kelas yang terdiri dari sembilan kapal selam yang ditugaskan antara tahun 1942 dan 1944. Kapal selam ini cukup kecil dan relatif lambat, hanya berbobot 370 ton. Mereka dipersenjatai dengan empat tabung torpedo 533mm."
 SWE_submarine_4: "Kelas Neptun"
 SWE_submarine_4_desc: "Kelas Neptun terdiri dari tiga kapal selam berukuran sedang yang semuanya ditugaskan pada tahun 1943. Kapal-kapal tersebut digunakan terutama untuk tugas pelapisan ranjau. Mereka berbobot 550 ton dan dipersenjatai dengan lima tabung torpedo 533mm."
 SWE_destroyer_1: "EhrensköKelas ld"
 SWE_destroyer_1_desc: "Dua kapal perusak kelas Ehrensköld selesai dibangun pada tahun 1927, sebagai kapal perusak modern pertama untuk Swedia setelah Perang Dunia I. Kapal tersebut berbobot lebih dari 970 ton dan dipersenjatai dengan tiga senjata 120mm/44 K/45 dan enam tabung torpedo 533mm. Mereka memiliki jangkauan yang pendek tetapi kecepatannya bagus."
 SWE_destroyer_2: "GöKelas teborg"
 SWE_destroyer_2_desc: "Kelas Göteborg terdiri dari enam kapal perusak yang dibangun antara tahun 1935 dan 1942. Kapal ini memiliki lambung yang lebih panjang dan mesin yang lebih baik dibandingkan pendahulunya. Mereka berbobot lebih dari 1.020 ton dan memiliki persenjataan utama berupa meriam 120mm/44 K/45, dan juga enam tabung torpedo 533mm. Mereka memiliki jangkauan terbatas tetapi kecepatan luar biasa."
 SWE_destroyer_3: "Kelas Visby"
 SWE_destroyer_3_desc: "Keempat kapal perusak kelas Visby semuanya dibangun antara tahun 1942 dan 1944. Mereka mirip dengan kelas Göteborg sebelumnya, tetapi lebih besar, berbobot lebih dari 1.130 ton. Mereka juga memiliki mesin yang lebih baik, jangkauan yang lebih baik, dan perlengkapan ASW yang kuat."
 SWE_destroyer_4: "ÖKelas land"
 SWE_destroyer_4_desc: "§Tdua kapal perusak kelas Öland mewakili perubahan radikal dari desain sebelumnya. Mereka diluncurkan dan diselesaikan tak lama setelah Perang Dunia II. Kapal-kapal tersebut berukuran besar, berbobot 1.880 ton. Mereka dipersenjatai dengan empat senjata 120mm/45 M44 sebagai persenjataan utama mereka, dan memiliki pelengkap AA, torpedo, dan ASW yang kuat. Kapal ini sedikit lebih lambat dibandingkan kapal perusak sebelumnya, namun memiliki jangkauan yang jauh lebih baik.§!"
 SWE_light_cruiser_1: "Kelas Fylgia"
 SWE_light_cruiser_1_desc: "Fylgia adalah kapal penjelajah lapis baja yang relatif kecil yang ditugaskan untuk Angkatan Laut Swedia pada tahun 1905. Kapal ini sebagian besar melakukan tugas pelatihan selama perang, dan menjalani reparasi ekstensif pada tahun 1939-41. Sebelum reparasi, kapal ini berbobot lebih dari 4.300 ton dan dipersenjatai dengan enam senjata 152mm/45 K/50 M1903 sebagai persenjataan utamanya. Dia memiliki baju besi yang bagus, tetapi relatif lambat untuk sebuah kapal penjelajah."
 SWE_light_cruiser_4: "Tre Kelas Kronor"
 SWE_light_cruiser_4_desc: "Kelas Tre Kronor terdiri dari sepasang kapal penjelajah ringan yang diselesaikan untuk Angkatan Laut Swedia setelah berakhirnya Perang Dunia II. Bobotnya hanya di bawah 7.700 ton dan memiliki kecepatan serta jangkauan yang layak. Persenjataan utama mereka terdiri dari tujuh senjata 152/53 M42. Mereka juga dilengkapi senjata AA, torpedo, dan peralatan ASW yang kuat."
 SWE_heavy_cruiser_1: "Kelas Sverige"
 SWE_heavy_cruiser_1_desc: "Kelas Sverige terdiri dari tiga kapal perang pesisir yang dibangun untuk Angkatan Laut Swedia sebelum Perang Dunia I. Kapal-kapal tersebut lebih mirip kapal penjelajah berat dalam ukuran (bobot perpindahan lebih dari 6.800 ton) dan persenjataan (empat senjata 283mm/44 K/45 M12). Kapal-kapal tersebut relatif lambat untuk sebuah kapal penjelajah tetapi memiliki lapis baja yang sangat baik. Ketiga kapal tersebut bertugas selama Perang Dunia II."
 ### TUR - TURKEY ###
 TUR_submarine_1: "Kelas Birinci İnönü"
 TUR_submarine_1_desc: "Kelas Birinci İnönü terdiri dari dua kapal selam pesisir yang dibangun di Belanda untuk Turki pada pertengahan tahun 1920-an. Mereka adalah kapal pertama yang dibangun untuk Angkatan Laut Turki setelah Perang Dunia I. Kapal ini berbobot 520 ton dan dipersenjatai dengan enam tabung torpedo 450 mm. Mereka agak lambat tetapi memiliki jangkauan yang bagus."
 #TUR_submarine_1b: "Dumlupınar Class"
 TUR_submarine_2: "Kelas Saldiray"
 TUR_submarine_2_desc: "Tiga kapal selam kelas Saldiray diluncurkan pada akhir tahun 1930-an. Desain mereka sangat dipengaruhi oleh Jerman, dengan kapal pertama di kelasnya dibuat di Jerman, dan dua lainnya dibuat di bawah lisensi di Istanbul. Mereka adalah kapal selam besar yang mampu mengarungi lautan, berbobot lebih dari 930 ton dan memiliki jangkauan yang sangat baik. Mereka dipersenjatai dengan enam tabung torpedo 533mm."
 TUR_submarine_3: "Oruç Kelas Reis"
 TUR_submarine_3_desc: "Kapal selam kelas Oruç Reis dibangun di Inggris sebagai modifikasi desain kelas S Inggris. Kapal-kapal tersebut diluncurkan pada tahun 1940, dan beberapa di antaranya ditahan sementara oleh Angkatan Laut Kerajaan. Semua kecuali satu akhirnya dikembalikan ke Turki. Kapal-kapal tersebut berbobot 625 ton dan dipersenjatai dengan lima tabung torpedo 533 mm. Kecepatan dan jangkauan mereka agak terbatas."
 TUR_submarine_4: "Kelas Sakarya"
 TUR_submarine_4_desc: "Kapal selam kelas Sakarya adalah serangkaian kapal selam kelas Balao Amerika yang dijual ke Turki setelah perang. Mereka adalah kapal selam yang sangat besar pada zamannya, dengan bobot bobot lebih dari 1.520 ton. Mereka memiliki jangkauan dan kecepatan yang sangat baik, dan dipersenjatai dengan sepuluh tabung torpedo 533mm."
 TUR_destroyer_1: "Kelas Peyk"
 TUR_destroyer_1_desc: "Kelas Peyk terdiri dari sepasang kapal torpedo besar dan cepat yang ditugaskan untuk Angkatan Laut Ottoman pada tahun 1907. Kapal-kapal tersebut dibuat di Jerman dan selamat dari Perang Dunia I, tetapi menjadi usang karena Perang Dunia II. Kapal-kapal tersebut berbobot 775 ton dan dipersenjatai dengan senjata kembar 105mm/37 SK L/40, serta tiga tabung torpedo 450mm. Mereka mempunyai jangkauan yang lumayan tapi cukup lambat untuk ukuran kapal perusak."
 TUR_destroyer_2: "Kelas Barbaros"
 TUR_destroyer_3: "Kelas Demirhisar"
 TUR_destroyer_3_desc: "Empat kapal perusak kelas Demirhisar dibangun di Inggris dan selesai pada tahun 1942. Dua kapal diinternir oleh Angkatan Laut Kerajaan, salah satunya dikembalikan setelah perang. Kapal-kapal itu didasarkan pada kelas I Inggris. Mereka berbobot 1.370 ton dan memiliki empat senjata 120mm/45 QF Mk IX sebagai persenjataan utama mereka. Mereka memiliki kecepatan yang layak dan jangkauan yang baik, serta dilengkapi senjata AA dan perlengkapan ASW yang kuat."
 TUR_light_cruiser_1: "Kelas Mecidiye"
 TUR_light_cruiser_1_desc: "Kapal Turki Mecidiye adalah kapal penjelajah terlindungi yang dibangun di AS untuk Angkatan Laut Ottoman pada pergantian abad. Dia sebenarnya ditenggelamkan di perairan dangkal selama Perang Dunia II, namun diangkat dan setelah bertugas singkat sebagai bagian dari Angkatan Laut Kekaisaran Rusia, dikembalikan ke Turki. Beratnya hanya di bawah 3.500 ton dan dipersenjatai dengan dua senjata Bethlehem No. 2 152mm/44 dan delapan senjata Armstrong Y 120mm/45. Mereka memiliki jangkauan yang cukup baik tetapi relatif lambat dan lapis bajanya ringan."
 TUR_battle_cruiser_1: "Kelas Yavuz"
 TUR_battle_cruiser_1_desc: "Yavuz awalnya ditugaskan sebagai kapal penjelajah tempur Jerman Goeben tetapi dijual ke Ottoman dan ditugaskan kembali pada tahun 1914 untuk menghindari interniran. Bobotnya hanya di bawah 23.000 ton dan memiliki kecepatan serta jangkauan yang layak. Kapal ini memiliki lapis baja yang baik dan dipersenjatai dengan sepuluh senjata 283mm/47 SK L/50 serta persenjataan sekunder yang kuat."
 TUR_battleship_1: "ReşKelas adiye"
 TUR_battleship_1_desc: "Kelas Reşadiye mewakili tiga kapal perang kapal penempur yang dipesan dari Inggris untuk Angkatan Laut Turki sesaat sebelum Perang Dunia I. Namun, hanya satu kapal yang selesai dibangun, dan kemudian diinternir oleh Inggris pada awal Perang Dunia I. Kapal-kapal tersebut berbobot 23.000 ton dan memiliki lapis baja, kecepatan, dan jangkauan yang baik. Persenjataan utama mereka akan memiliki sepuluh senjata Vickers 343mm/45."
 ### URU - URUGUAY ###
 URG_destroyer_1: "Kelas Uruguay"
 URG_destroyer_1_desc: "Uruguay adalah kapal torpedo berat yang dibuat di Jerman untuk Angkatan Laut Uruguay sebelum Perang Dunia I. Kapal ini berbobot lebih dari 1.400 ton dan dipersenjatai dengan empat senjata Krupp QF 120mm/45. Ia memiliki pelengkap AA yang kuat dan dua tabung torpedo 450mm. Mengingat vintage dan ukurannya yang besar, kapal ini cukup lambat dibandingkan kapal perusak lainnya."
 ### VEN - VENEZUELA -- generic only ###
 ### VIC - VICHY FRANCE ###
 VIC_submarine_1: "Seri 600"
 VIC_submarine_1_desc: "Kapal selam Seri seberat 600 ton adalah kapal selam modern pertama Perancis pasca Perang Dunia I. Kapal-kapal ini berukuran sedang, berbobot sekitar 600 ton, meskipun merupakan kapal laut, mereka ditetapkan sebagai kapal selam pesisir dan sebagian besar digunakan di perairan hangat Mediterania. Tiga kelas dari empat kapal masing-masing dibangun dari jenis ini: kelas Sirène, Ariane dan Circé. Mereka adalah dasar dari kelas Argonaute, Diane dan Orion Seri 630 ton yang lebih besar."
 #VIC_submarine_1b: "630 Series"
 #VIC_submarine_1c: "Redoutable Class"
 VIC_submarine_2: "Kelas Minerve"
 VIC_submarine_2_desc: "Kapal selam kelas Minerve (nama proyek T2) didasarkan pada Seri 630 ton meskipun mereka memiliki mesin yang lebih baik dan tata letak torpedo yang berbeda. Kapal selam ini merupakan bagian pertama dari program standardisasi yang dihasilkan dari desain terpusat DCAN (Direction des Constructions et Armes Navale), desain galangan kapal yang agak spesifik dari kelas sebelumnya."
 #VIC_submarine_2b: "Aurore Class"
 VIC_submarine_3: "Roland Kelas Morillot"
 VIC_submarine_3_desc: "Kapal selam kelas Roland Morillot (Nama proyek Z2) adalah kapal selam besar yang mengarungi lautan berdasarkan kapal selam kelas Redoubtable sebelumnya. Mereka adalah kapal selam besar yang berbobot 1.800-2.400 ton dan membawa persenjataan tangguh berupa 10 tabung torpedo. Kejatuhan Perancis terjadi sebelum semuanya selesai."
 VIC_submarine_4: "PhéKelas nix"
 VIC_submarine_4_desc: "Kapal selam kelas Phénix adalah kapal penjelajah samudra berukuran sedang dan berjangkauan jauh yang diizinkan dalam program angkatan laut 1939-40, namun awal perang dan Kejatuhan Prancis menyebabkan pembatalan kapal-kapal ini. Mereka serupa dengan kelas Redoutable meski berukuran lebih kecil dan berbobot benaman 1.200 ton. Mereka membawa persenjataan torpedo yang sama beratnya."
 VIC_destroyer_1: "Kelas Bourrasque"
 VIC_destroyer_1_desc: "Kapal perusak kelas Bourrasque merupakan bagian dari Seri 1.500 ton, dan diluncurkan pada pertengahan tahun 1920-an. Bersama dengan kelas Chacal sebelumnya dan kelas L'Adroit berikutnya, mereka adalah tulang punggung armada Prancis modern pasca perang yang baru. Mereka cepat dan dipersenjatai dengan baik pada masanya, tetapi persenjataan torpedo mereka lebih kecil dibandingkan dengan kapal serupa di angkatan laut lainnya."
 #VIC_destroyer_1b: "Chacal Class"
 #VIC_destroyer_1c: "Aigle & Vauquelin Class"
 VIC_destroyer_2: "Le Kelas Fantasque"
 VIC_destroyer_2_desc: "Perusak kelas Le Fantasque pada dasarnya adalah versi peningkatan dari perusak super Seri 2.400 ton sebelumnya (Guépard, Aigle, Vauquelin) yang dibangun berdasarkan program angkatan laut 1930. Mereka adalah perusak berukuran besar, bersenjata berat, dan sangat cepat, sempurna untuk mengawal unit-unit berkecepatan tinggi baru dari armada Prancis. Persenjataannya terdiri dari meriam yang baru dikembangkan, senjata AA yang memadai, dan persenjataan torpedo."
 #VIC_destroyer_2b: "Le Hardi Class"
 #VIC_destroyer_2c: "Mogador Class"
 VIC_destroyer_3: "L'IntréKelas pide"
 VIC_destroyer_3_desc: "Kapal perusak kelas L'Intrépide adalah versi modifikasi dari kapal perusak kelas Le Hardi sebelumnya. Kapal-kapal ini disahkan dalam program angkatan laut tahun 1938 dan 1939 tetapi perang dan Kejatuhan Perancis mengakibatkan pembatalan kapal-kapal ini. Mereka akan lebih fokus pada peran antipesawat, dengan peningkatan bobot perpindahan menjadi 2.800-2.900 ton dan mesin yang lebih besar."
 VIC_destroyer_4: "Kelas Hoche"
 VIC_destroyer_4_desc: "Kelas Hoche dan Bayard adalah rancangan perusak super terakhir dari Angkatan Laut Prancis. Kedua kelas ini didasarkan pada kelas Mogador, berbobot benaman 4.200 ton dengan persenjataan utama serupa tetapi dengan meriam AA yang ditingkatkan dan mesin yang lebih kuat. Mereka diizinkan dalam program angkatan laut 1939-40, tetapi dimulainya perang dan Kejatuhan Prancis berujung pada pembatalan kapal-kapal ini."
 VIC_light_cruiser_1: "Kelas Duguay-Trouin"
 VIC_light_cruiser_1_desc: "Penjelajah ringan Duguay-Trouin adalah kapal perang utama Prancis pertama yang dibangun setelah Perang Dunia I dalam program angkatan laut 1922. Mereka menjadi kapal penjelajah ringan pertama dengan kubah utama tertutup bertingkat (superfiring). Di antara kapal penjelajah ringan, mereka memiliki persenjataan torpedo yang kuat namun praktis tanpa lapis baja."
 VIC_light_cruiser_2: "La GalissonnièKelas re"
 VIC_light_cruiser_2_desc: "Penjelajah ringan kelas La Galissonnière adalah jawaban terhadap penjelajah ringan tipe Condottieri Italia dan didasarkan pada kelas Émile Bertin sebelumnya. Mereka dibangun dalam program angkatan laut 1931 dan 1932, dengan persenjataan utama khas dan persenjataan AA memadai pada zamannya. Kapal-kapal ini berbobot benaman 10.850 ton, membawa lebih banyak pesawat intai, dan memiliki kecepatan yang baik."
 VIC_light_cruiser_3: "Kelas De Grasse"
 VIC_light_cruiser_3_desc: "Kapal penjelajah kelas DeGrasse disahkan pada program angkatan laut tahun 1938 dan 1939 dan pada dasarnya merupakan peningkatan La Galissonnières. Mereka memiliki persenjataan AA yang lebih kuat, serta mesin yang lebih besar. Kejatuhan Perancis menyebabkan dua kapal terakhir dibatalkan dan kapal utama diselesaikan pasca perang dengan desain yang berbeda. Jerman bermaksud untuk menyelesaikannya sebagai kapal induk ringan tetapi proyek ini juga tidak terlaksana."
 VIC_light_cruiser_4: "Kelas Colbert"
 VIC_light_cruiser_4_desc: "Colbert adalah kapal penjelajah ringan antipesawat yang diluncurkan pada tahun 1956. Kapal penjelajah kelas Colbert ini dibuat dengan cara yang sangat mirip dengan De Grasse pascaperang, menampilkan persenjataan berat AA baik untuk jarak jauh maupun pendek. Perbedaan antara Colbert dan DeGrasse adalah Colbert memiliki mesin yang lebih kecil, lapis baja yang lebih tipis, dan sedikit lebih kecil."
 VIC_heavy_cruiser_1: "Kelas Suffren"
 VIC_heavy_cruiser_1_desc: "Kapal penjelajah berat kelas Suffren pada dasarnya merupakan pengulangan dari kelas Duquesne sebelumnya dengan sedikit perbaikan terkait kemampuan berlayar di laut. Kedua kelas tersebut mirip dengan filosofi kapal penjelajah kontemporer angkatan laut Prancis: lapis baja yang sangat tipis tetapi kecepatan dan jangkauan yang baik. Perpindahan standar mereka adalah 10.000 ton dan mereka dilengkapi dengan persenjataan yang merupakan standar untuk kapal penjelajah berat."
 VIC_heavy_cruiser_2: "AlgéKelas rie"
 VIC_heavy_cruiser_2_desc: "Kapal penjelajah berat kelas Algérie merupakan peningkatan lebih lanjut dari kelas Suffren dan Duquesne sebelumnya tetapi dirancang untuk menjadi lawan dari kapal penjelajah berat Italia baru kelas Zara. Sabuk pelindung utama dan perlindungan bawah air ditingkatkan secara signifikan. Persenjataan AA-nya memadai pada masanya, namun karena perubahan ini, bobot standarnya menjadi lebih dari 10.000 ton."
 VIC_heavy_cruiser_3: "Saint Kelas Louis"
 VIC_heavy_cruiser_3_desc: "Penjelajah berat kelas Saint Louis didasarkan pada kelas Algérie namun penampilan keseluruhannya lebih menyerupai kapal utama kelas Dunkerque dan Richelieu. Tiga kapal dipesan dalam program angkatan laut 1940, namun akibat Kejatuhan Prancis tak satu pun yang sempat dibangun. Mereka seharusnya mengerahkan meriam baru dan persenjataan AA yang ditingkatkan, namun lapis bajanya akan sama dengan kelas Algérie. Ini adalah rancangan penjelajah berat terakhir dari Angkatan Laut Prancis."
 VIC_heavy_cruiser_4: "Kelas Forbin"
 VIC_heavy_cruiser_4_desc: "Penjelajah berat kelas Forbin adalah rancangan hipotetis sebagai penerus dari kelas Saint Louis. Dirancang untuk mempertahankan jalur perdagangan antara Prancis Daratan dan daerah koloni, kapal ini memiliki jangkauan jauh dan kecepatan baik bersama dengan persenjataan meriam berat dalam empat kubah tripel serta persenjataan AA yang memadai. Tata letak kapal dan tampilan umum menyerupai pengaruh dari kelas Saint Louis sebelumnya serta kelas Crown Colony Inggris."
 VIC_battle_cruiser_1: "Desain Durand-Viel"
 VIC_battle_cruiser_1_desc: "Rancangan penjelajah tempur Durand-Viel adalah sebuah proposal di antara serangkaian studi sejak era PD I. Mereka pada dasarnya merupakan versi penjelajah tempur dari kapal tempur kelas Normandie dan Lyon yang menampilkan kubah empat dan meriam yang sama meski dalam jumlah lebih sedikit. Seperti penjelajah tempur sezaman dari angkatan laut lainnya, mereka lebih cepat tetapi lebih tipis lapis bajanya dibanding kapal tempur. Kapal-kapal ini dibatalkan sebelum PD I pecah."
 VIC_battle_cruiser_2: "Kelas Dunkerque"
 VIC_battle_cruiser_2_desc: "Kelas Dunkerque dirancang untuk menandingi kapal tempur saku Jerman kelas Deutschland. Kapal-kapal ini merupakan puncak dari serangkaian studi perancangan dari pertengahan 1920-an hingga awal 1930-an. Diizinkan dalam program angkatan laut 1931 dan 1934, mereka serupa dengan kapal tempur kelas Nelson Inggris, dengan semua kubah utama terkonsentrasi di bagian haluan. Hal ini menghasilkan sabuk lapis baja yang lebih pendek dan dengan demikian kapal yang lebih kecil demi mematuhi batasan Traktat Angkatan Laut."
 VIC_battleship_1: "Kelas Courbet"
 VIC_battleship_1_desc: "Kapal tempur kelas Courbet adalah super-dreadnought pertama yang dibangun untuk Angkatan Laut Prancis sebelum dan selama Perang Dunia I. Diizinkan dalam program angkatan laut 1910 dan 1911, mereka melihat dinas terbatas selama Perang Dunia I, tetapi aktif selama PD II. Meskipun memiliki lapis baja yang lebih tebal dan meriam yang lebih kuat daripada kapal tempur kelas Dante sebelumnya, mereka masih kalah dibanding kapal tempur USN dan RN sezamannya. Mereka berbobot benaman tepat di atas 22.000 ton dan satu-satunya modernisasi mereka sebelum PD II adalah persenjataan AA dan ketel uap yang ditingkatkan."
 #VIC_battleship_1b: "Bretagne Class" 
 VIC_battleship_2: "Kelas Richelieu"
 VIC_battleship_2_desc: "Kapal tempur kelas Richelieu adalah kapal tempur terakhir yang ditugaskan ke dalam Angkatan Laut Prancis. Mereka adalah penyempurnaan rancangan dari Dunkerque dan diizinkan berdasarkan program angkatan laut 1935 dan 1938. Mereka memiliki persenjataan AA, kecepatan, dan jangkauan luar biasa, yang menjadikannya kapal utama yang hebat. Dari empat yang dipesan, hanya dua yang diluncurkan dan satu yang diselesaikan sebelum Kejatuhan Prancis. Terdapat banyak upaya untuk menyelesaikan kapal-kapal yang tersisa menggunakan rancangan berbeda, diusulkan untuk digunakan sebagai kapal tempur anti-pesawat, hibrida kapal tempur-induk, atau kapal induk penuh."
 VIC_battleship_3: "Kelas Gascogne"
 VIC_battleship_3_desc: "Kapal tempur kelas Gascogne adalah subkelas dari kelas Richelieu. Tiga kapal dipesan dalam program angkatan laut 1940 tetapi tidak ada yang mulai dibangun. Rancangan ini merupakan pengulangan dari Richelieu, namun dengan persenjataan utama yang didistribusikan merata di haluan dan buritan, persenjataan AA yang ditingkatkan, serta mesin yang lebih baik sehingga menghasilkan kapal yang lebih unggul secara keseluruhan."
 VIC_battleship_4: "Kelas Alsace"
 VIC_battleship_4_desc: "Kapal perang kelas Alsace direncanakan untuk menggantikan kelas Richelieu. Empat kapal dipesan, dengan studi desain selesai pada tahun 1939, disahkan pada tahun 1940, dan diperkirakan akan ditetapkan pada tahun 1941, meskipun Kejatuhan Perancis mencegah hal ini terjadi. Pesawat ini ditingkatkan dari desain Richelieu dengan senjata utama yang lebih berat dan lebih banyak, persenjataan AA yang lebih kuat, pelat baja yang lebih tebal, dan mesin yang lebih besar."
 VIC_SH_battleship_1: "Kelas Charlemagne"
 VIC_SH_battleship_1_desc: "Kapal perang super kelas Charlemagne adalah desain hipotetis yang cocok dengan kapal perang besar angkatan laut lainnya. Mereka menampilkan persenjataan berat di depan dalam posisi tembak super, persenjataan AA berat, dan baju besi tebal. Keseluruhan desain meminjam elemen dari kelas Richelieu dan British Nelson."
 VIC_SH_battleship_2: "Napoléon Kelas Bonaparte"
 VIC_SH_battleship_2_desc: "Kapal perang kelas Napoléon Bonaparte merupakan desain hipotetis dan didasarkan pada kelas Alsace dan Gascogne. Persenjataan beratnya didistribusikan secara merata di depan dan belakang dalam tiga menara, dengan senjata sekunder superfiring dan persenjataan berat AA. Baju besi yang tebal dan mesin yang kuat memberikan kecepatan dan pertahanan yang diperlukan untuk mengimbangi kapal-kapal lain dalam armada dan secara efektif melawan musuh-musuhnya."
 VIC_carrier_1: "BéKelas arn"
 VIC_carrier_1_desc: "Béarn awalnya dibangun sebagai kapal tempur kelas Normandie namun kemudian diselesaikan sebagai kapal induk, berbobot benaman 22.100 ton dan bertugas selama masa antar-perang serta PD II. Sebagai kapal induk konversi, kecepatannya lambat dan memiliki ruang terbatas untuk pesawat, tetapi sabuk lapis baja sedang dan jangkauan jauhnya menutupi kekurangan-kekurangan tersebut. Pembangunannya memberi pengalaman berharga bagi perancang Prancis di DCAN (Direction des Constructions et Armes Navale) dan mendorong serangkaian studi perancangan setelahnya."
 VIC_carrier_2: "Kelas Joffre"
 VIC_carrier_2_desc: "Kapal induk kelas Joffre (nama Proyek PA-16) adalah generasi penerus kapal induk untuk Angkatan Laut Prancis. Ini adalah studi perancangan terakhir yang dimulai pada 1929 dan berakhir pada 1937. Dua kapal diizinkan dalam program angkatan laut 1938, namun konflik yang meningkat memperlambat proses konstruksi dan pada akhirnya Kejatuhan Prancis mencegah penyelesaian kapal-kapal ini. Bobot benamannya sekitar 20.000 ton. Mereka akan memiliki persenjataan AA, lapis baja, dan kecepatan yang baik, namun kapasitas pesawatnya di bawah rata-rata. Secara keseluruhan, kapal ini akan menjadi kapal induk yang serbaguna dan seimbang bagi Angkatan Laut Prancis."
 VIC_carrier_3: "Jean Kelas Bart"
 VIC_carrier_3_desc: "Kapal induk Jean Bart merupakan usulan pada pertengahan perang untuk mengubah kapal perang kelas Richelieu yang belum selesai, Jean Bart, menjadi kapal induk skala penuh dengan cara yang mirip dengan kapal induk IJN Shinano Jepang. Ukuran lambung yang besar akan menghasilkan komponen pesawat yang besar dan, bersama dengan mesin yang besar, kapal pengangkut jarak jauh dan cepat. Persenjataan berat AA asal AS akan memberikan pertahanan yang baik terhadap pesawat dan kombatan permukaan yang lebih kecil."
 VIC_carrier_4: "Kelas Clemenceau"
 VIC_carrier_4_desc: "Kapal induk kelas Clemenceau (nama Proyek PA-28) adalah rancangan kapal induk pascaperang pertama bagi Angkatan Laut Prancis. Rancangan ini serupa dengan kapal induk kelas Joffre yang belum selesai, meskipun perlengkapan dan persenjataan yang dipasang adalah produk modern Prancis. Akuisisi kapal induk pengawal USN dan RN serta kondisi ekonomi Prancis pascaperang membuat kapal-kapal ini urung dibangun. Jangan disamakan dengan kapal induk kelas Clemenceau berikutnya (nama Proyek PA-54), yang mulai dibangun pada tahun 1955 dan 1957."
 ### YUG - YUGOSLAVIA ###
 YUG_submarine_1: "Kelas Hrabri"
 YUG_submarine_1_desc: "Kedua kapal selam kelas Hrabri awalnya ditetapkan sebagai kapal selam kelas L Inggris untuk Angkatan Laut Kerajaan, tetapi dijual dan akhirnya diselesaikan untuk Yugoslavia menggunakan desain yang dimodifikasi pada tahun 1928. Mereka adalah kapal selam besar, berbobot 975 ton, dan dipersenjatai dengan enam tabung torpedo 533mm."
 YUG_submarine_2: "Kelas Osvetnik"
 YUG_submarine_2_desc: "Kedua kapal selam kelas Osvetnik dirancang dan dibangun di Prancis dengan desain kapal selam kelas Circe. Kapal ini lebih kecil dibandingkan kapal selam kelas Hrabri sebelumnya. Dilengkapi dengan enam tabung torpedo 533mm, mereka masih memiliki kekuatan yang sebanding."
 YUG_destroyer_1: "Kelas Dubrovnik"
 YUG_destroyer_1_desc: "Kapal perusak Dubrovnik adalah kapal terbesar di armada Yugoslavia pada saat pembeliannya. Kapal ini dibuat di Inggris dan dikirim ke Yugoslavia pada tahun 1932. Kapal ini merupakan kapal perusak besar, berbobot 1.880 ton. Ia dipersenjatai dengan empat senjata Skoda 140mm/53, pelengkap AA yang kuat, enam tabung torpedo 533mm, dan peralatan ASW yang bagus."
 YUG_destroyer_2: "Kelas Beograd"
 YUG_destroyer_2_desc: "Kelas Beograd terdiri dari tiga kapal perusak yang dibangun dengan bantuan Perancis. Dua kapal dibangun di Split, sedangkan yang ketiga dibangun di Perancis. Ketiganya didasarkan pada kapal perusak kelas L'Adroit Prancis dan ditugaskan pada tahun 1939. Mereka berbobot 1.210 ton dan dipersenjatai dengan empat senjata Skoda 120mm/43 dan enam tabung torpedo 533mm. Mereka memiliki kecepatan luar biasa tetapi jangkauannya di bawah rata-rata."
 YUG_destroyer_4: "Kelas Split"
 YUG_destroyer_4_desc: "Split adalah kapal perusak berat yang diluncurkan dan diselesaikan di Yugoslavia. Diluncurkan pada tahun 1943 tetapi baru selesai pada tahun 1958, dengan desain yang dimodifikasi. Desain aslinya berbobot 2.400 ton dan dipersenjatai dengan lima senjata Skoda 140/56 sebagai persenjataan utamanya. Meskipun ukurannya besar, kecepatannya luar biasa."
 YUG_light_cruiser_1: "Kelas Dalmacija"
 YUG_light_cruiser_1_desc: "Kapal penjelajah Jerman tua SMS Niobe dijual pada tahun 1925 kepada Angkatan Laut Kerajaan Yugoslavia yang masih muda dan dibangun kembali secara ekstensif. Dilengkapi dengan AA modern dan senjata terberat di Angkatan Laut, Dalmacija terutama berfungsi sebagai kapal pelatihan meriam."
