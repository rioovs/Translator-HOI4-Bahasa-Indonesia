 PER_absorb_byzantines_category: "Menyerap Bizantium"
 PER_absorb_byzantines_category_desc: "[BYZ.GetNameDefCap] akhirnya jatuh ke tangan kerajaan superior kita. Kita telah mampu mengakhiri dendam terhadap Yunani yang sudah ada sejak zaman dahulu kala, dan kita akhirnya dapat berupaya menjadikan negeri-negeri ini berada di bawah kekuasaan kedaulatan kita."
