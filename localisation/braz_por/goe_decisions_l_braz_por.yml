 RAJ_GOE_pay_out_dividends_high: "Membayar dividen sebesar §Yhigh§! kepada investor"
 RAJ_GOE_pay_out_dividends_small_tt: "Pada akhir §Ytahun fiskal§! kami akan membayar $eic_low_investments_cost_tt$, menghapusnya secara permanen dari keadaan acak. Sebagai imbalannya, kami akan memperoleh sejumlah kecil investasi tambahan dari investor swasta sepanjang tahun fiskal berikutnya."
 RAJ_GOE_pay_out_dividends_normal_tt: "Pada akhir §Ytahun fiskal§! kami akan membayar $eic_normal_investments_cost_tt$, menghapusnya secara permanen dari keadaan acak. Sebagai imbalannya, kami akan memperoleh rata-rata jumlah investasi tambahan dari investor swasta selama seluruh durasi tahun fiskal berikutnya."
 RAJ_GOE_pay_out_dividends_high_tt: "Pada akhir §Ytahun fiskal§! kami akan membayar $eic_high_investments_cost_tt$, menghapusnya secara permanen dari keadaan acak. Sebagai imbalannya, kami akan memperoleh tambahan investasi dalam jumlah besar dari investor swasta sepanjang tahun anggaran berikutnya."
 RAJ_GOE_modify_dividends: "Memodifikasi §Y$idea_RAJ_eic_dividends_investment$§! menjadi:"
 RAJ_GOE_modify_dividends_2: "selama §Ytahun anggaran§! berikutnya"
 has_payed_dividends: "Telah Membayar Dividen"
 RAJ_GOE_eic_no_more_taxman: "Akhiri pajak untuk selamanya"
 RAJ_GOE_eic_no_more_taxman_tt: "Hapus §YPajak§!."
 taxes_desc: "Kita membayar pajak sebagai persentase dari pendapatan kita secara berlapis yang disebut kurung pajak. Ketika pendapatan kita meningkat, tarif pajak pada lapisan pendapatan berikutnya menjadi lebih tinggi.\n\nPada setiap akhir tahun fiskal kita perlu membayar pajak kepada pemerintah [ENG.GetAdjective], tergantung pada seberapa besar industri kita. Hal ini ditentukan oleh jumlah kami §YPabrik Sipil§!.\n\nJumlah yang dibayarkan pada §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!\nBerapa banyak yang harus dibayar ditentukan oleh berbagai golongan pajak sebagai berikut:"
 eic_industry_tt: "Jumlah Pabrik Sipil Kena Pajak : §Y[?var:actually_controlled_civs]§!\n$RAJ_dividents_status_tt$"
 eic_industry_tt_on_hover: "Saat ini kami memiliki pabrik §Y[?var:actually_controlled_civs]§! Pabrik Sipil, dan oleh karena itu kami memperkirakan akan mendapatkan penalti [?var:taxes_display_tt] §YFaktor Barang Konsumsi§!. Untuk menurunkan golongan pajak yang kita ikuti, kita dapat menyalurkan pabrik sipil ke dalam subyek dengan menyelesaikan fokus §YInstitusional Pencucian Uang§!"
 tier_1_taxes: "§W1: 0-[?var:tier_two_taxes_threshold] pabrik [?tier_one_taxes_tax_tt]%§!"
 tier_1_taxes_tt: "Berada dalam kelompok pajak ini mengharuskan kita untuk memiliki antara 0-[?var:tier_two_taxes_threshold] §YPabrik Sipil§!, dan berada dalam kelompok ini akan menerapkan penalti faktor §Y[?tier_one_taxes_tax_tt]%§! Pabrik Barang Konsumsi."
