 PER_integrate_anatolia_decisions_category: "Integrasikan kembali Anatolia"
 PER_integrate_anatolia_decisions_category_desc: "Anatolia telah menjadi bagian dari wilayah de jure kekaisaran kami selama ratusan tahun, dan akhirnya tiba saatnya untuk mengembalikannya ke dalam kendali kami. Integrasikan wilayah-wilayah ini, dan bantu melanjutkan perluasan [PER.GetNameDef]."
