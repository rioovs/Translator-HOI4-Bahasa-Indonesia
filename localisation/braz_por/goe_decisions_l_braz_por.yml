 PER_memphis_initiative_category: "Inisiatif Memphis"
 PER_memphis_initiative_category_desc: "Akhirnya kita berhasil menaklukkan bekas wilayah yang didambakan oleh Cambyses II, dan membawa Mesir ke dalam kekuasaan kita. Untuk menjaga masa depan kerajaan kita, kita harus mulai mengintegrasikan tanah Mesir di bawah kekuasaan kedaulatan kita."
