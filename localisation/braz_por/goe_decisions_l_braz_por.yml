 PER_profit_from_war_category: "Pengambil Untung Perang"
 PER_profit_from_war_category_desc: "Ketika perang berkecamuk di seluruh dunia, kita diberi kesempatan unik untuk menjual persediaan minyak kita yang sangat besar guna meningkatkan perekonomian kita dan berpotensi melindungi kita dari ancaman eksternal. Inisiatif ini akan memanfaatkan sumber daya alam kita yang melimpah."
