 SOV_soviet_civil_war_not_started_tt: "Perang Saudara Soviet belum dimulai"
 SOV_soviet_civil_war_not_started_tt_NOT: "Perang Saudara Soviet telah dimulai"
 SOV_has_selected_hq_tt: "Telah mendirikan markas rahasia"
 SOV_concessions_japan_vladivostok_SCW: "Tawarkan Vladivostok ke Jepang"
 SOV_concessions_japan_vladivostok_SCW_desc: "Militer Jepang selalu mendambakan Vladivostok. Oleh karena itu, mereka seharusnya cenderung membantu kami dengan pasukan ekspedisi jika kami menggunakan kepemilikan wilayah tersebut di masa depan sebagai alat tawar-menawar."
 SOV_concessions_japan_vladivostok_SCW_accept: "Jika diterima, [JAP.GetNameDef] akan memasok unit yang bertarung dengan [GetSovietOppositionName] selama perang. [JAP.GetNameDefCap] akan menguasai Vladivostok pada akhir perang."
 SOV_not_has_conflict_with_japan: "§Y[ROOT.GetNameWithFlag]§!: Tidak ada konflik berkelanjutan dengan §Y[JAP.GetNameWithFlag]§!"
 SOV_CSW_transfer_vladivostok_flag: "§YVladivostok§! Konsesi"
 SOV_concessions_japan_sakhalin_SCW: "Sakhalin untuk Senjata"
 SOV_concessions_japan_sakhalin_SCW_desc: "Pemberontakan membutuhkan senjata. Mungkin Jepang akan bersedia memberi kami sebagian jika kami menunjukkan bahwa kami siap memberi mereka sisa Sakhalin."
 SOV_concessions_japan_sakhalin_SCW_accept: "Jika diterima, [GetSovietOppositionName] mendapatkan [JAP.GetAdjective] senjata dan senapan, dan mungkin pesawat tempur, saat perang dimulai. [JAP.GetNameDefCap] akan menguasai Sakhalin Utara pada akhir perang."
 SOV_CSW_transfer_sakhalin_flag: "§YSakhalin Utara§! Konsesi"
 SOV_concessions_germany_baku_SCW: "Hak Minyak Baku untuk Peningkatan Militer"
 SOV_concessions_germany_baku_SCW_desc: "[GER.GetNameDefCap] sangat membutuhkan minyak untuk pembangunan militer mereka sendiri. Dengan menjanjikan mereka hak eksklusif atas ladang minyak kita setelah perang, mereka seharusnya bersedia membantu kita."
 SOV_concessions_germany_baku_SCW_accept: "Jika diterima, [GER.GetNameDef] akan mulai membangun pabrik Militer di [?SOV.SOV_civil_war_start_state.GetName]. [GetSovietOppositionName] mendapatkan [GER.GetAdjective] tank dan senapan. [GER.GetNameDefCAP] mendapatkan Hak Sumber Daya untuk [229.GetName] di akhir perang."
 SOV_CSW_baku_oil_flag: "Konsesi Ladang Minyak Baku"
 SOV_CSW_german_generals_flag: "Penasihat Militer Jerman"
 SOV_concessions_germany_ukraininan_oil_SCW: "Pemberontakan Ukraina yang disponsori Jerman"
 SOV_concessions_germany_ukraininan_oil_SCW_desc: "Meskipun kehilangan Ukraina akan berdampak buruk, mereka bisa menjadi sekutu yang berharga dalam perang melawan kaum Stalinis. Jerman dapat melatih milisi Ukraina secara diam-diam, dan kemudian pemberontak Ukraina dapat melancarkan serangan mendadak jika sudah siap."
 SOV_concessions_germany_ukraininan_oil_SCW_accept: "Jika diterima, [GER.GetNameDef] akan melatih unit Ukraina yang akan melancarkan pemberontakan jika sudah siap. [GER.GetNameDefCAP] mendapatkan Hak Sumber Daya atas wilayah Ukraina pada akhir perang."
 SOV_concessions_uk_belarus_SCW: "BLR independen sebagai imbalan atas Dukungan Inggris"
 SOV_concessions_uk_belarus_SCW_desc: "Pemerintah [ENG.GetAdjective] bersimpati kepada pemerintah [BLR.GetAdjective] yang menyerukan kemerdekaan. Jika kami berjanji kepada mereka untuk melepaskan [BLR.GetNameDef] setelah perang, mereka pasti ingin memberikan senjata kepada kami."
 SOV_concessions_uk_belarus_SCW_accept: "Jika diterima, [ENG.GetNameDef] akan mulai membangun pabrik Militer di [?SOV.SOV_civil_war_start_state.GetName]. [BLR.GetNameDefCAP] menjadi mandiri pada akhir perang."
