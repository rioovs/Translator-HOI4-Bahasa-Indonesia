 SOV_planning_uprising_in_northern: "§WMenyusup§! [FROM.GetName] §Wdi§! Oblast Utara"
 SOV_planning_uprising_in_ukraine: "§WMenyusup§! [FROM.GetName] §Wdi§! Ukraina"
 SOV_align_states_steppe: "§WMenyusup§! [FROM.GetName] §Wdi§! Wilayah Stepa"
 SOV_set_civil_war_state_tt: "Sel Oposisi didirikan pada [FROM.GetName], memastikan kesetiaan negara jika terjadi perang saudara."
 SOV_start_infiltrating_state_tt: "Pekerjaan untuk membangun sel di [FROM.GetName] dimulai"
 SOV_sabotage_behind_enemy_lines_decision: "Sabotase di belakang garis musuh"
 SOV_sabotage_behind_enemy_lines_decision_desc: "Partisan setia yang beroperasi di belakang garis musuh dapat digunakan untuk mengganggu komunikasi musuh di [FROM.Getname]. Serangan terhadap pos komando, pemotongan kabel telegraf, atau penggelinciran kereta api, membuat musuh kurang siap menahan serangan unit kami, dan meningkatkan peluang keberhasilan pembebasan Rusia."
 SOV_sabotage_behind_enemy_lines_decision_tt: "§YUnit musuh§! mengalami kerusakan pada §Yorganisasi§!"
 sabotage_behind_enemy_lines_flag: "Mempersiapkan aksi sabotase"
 SOV_dismiss_the_counter_revolution: "Singkirkan kontra-revolusi"
 SOV_dismiss_the_counter_revolution_desc: "Dengan secara terbuka mengecam setiap pembicaraan mengenai kontra-revolusi, kita seharusnya dapat mengalihkan perhatian NKVD dari agen-agen kita. Namun, hal ini mungkin juga berarti bahwa kita akan kehilangan beberapa pendukung yang percaya pada pemecatan palsu tersebut."
 SOV_dismiss_the_counter_revolution_tt: "Mengurangi paranoia politik dengan mengorbankan stabilitas masa depan dan berkurangnya dukungan militer"
 SOV_dismiss_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y60 hari§!."
