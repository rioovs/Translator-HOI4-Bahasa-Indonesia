 form_mountainous_republic_category_desc: "Selama Perang Saudara Rusia, Tapa Tchermoeff yang agung berusaha menyatukan Republik-republik yang terletak di Kaukasus Utara di bawah bendera bersama, untuk menangkis penjajah Rusia. Kini sekali lagi, haruskah rakyat Kaukasus Utara bersatu untuk mengusir kekuatan asing, dan mengembalikan kejayaan mereka!"
