 POL_sanacja_falanga_decisions_desc: "Partai Nasional-Demokrat dan Falangis telah mengambil pengaruh besar di Republik Polandia Kedua. Dengan memberikan konsesi dan mengadakan demonstrasi berskala nasional, pengaruh fasis dapat meluas secara eksponensial di dalam pemerintahan Polandia dan di kalangan masyarakat."
