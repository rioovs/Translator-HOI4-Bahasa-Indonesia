 form_transcaucasus_category: "Republik Transkaukasia"
 form_transcaucasus_category_desc: "Republik Transkaukasia yang baru-baru ini dibubarkan setelah Konstitusi Soviet tahun 1936, masih menjadi sebuah gagasan yang terpatri di benak masyarakat. Jika suatu negara berhasil menyatukan wilayah-wilayah ini, ada kemungkinan Federasi Negara-Negara akan terbentuk kembali, dan Transkaukasia akan kembali bersatu dan kuat."
