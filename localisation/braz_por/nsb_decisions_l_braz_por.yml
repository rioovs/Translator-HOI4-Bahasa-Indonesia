 SOV_soviet_aid_decision_category: "[SOV.GetAdjective] Program Bantuan dan Investasi"
 SOV_soviet_aid_decision_category_desc: "[SOV.GetNameDefCap] telah mengembangkan minat terhadap negara kita, atau lebih tepatnya, pada sumber daya alam, pasar ekonomi, dan hubungan luar negerinya. Seperti yang telah disepakati sebelumnya, pemerintah [SOV.GetAdjective] saat ini sedang menjalankan program investasi di negara kita, yang diklaim akan mendorong pembangunan bangsa kita."
