 SOV_operation_countenance: "Operasi Wajah"
 SOV_preparations_for_operation_countenance_tt: "Kita akan mempunyai waktu §Y[?SOV.SOV_operation_countenance_preparation_days] hari§! untuk bersiap sebelum dimulainya $SOV_operation_countenance$ dan deklarasi perang terhadap [PER.GetNameDef].\n$SOV_preparations_for_operation_countenance_mission_tt$"
