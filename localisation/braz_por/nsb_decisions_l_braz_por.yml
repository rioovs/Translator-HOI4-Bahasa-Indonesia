 form_turkestan_category: "Bentuklah Bangsa Turki"
 form_turkestan_category_desc: "Sepanjang sejarah kita, masyarakat Turki telah bersatu dan terpecah berkali-kali. Jika kita bisa menguasai seluruh kawasan Asia Tengah, kita akan bisa merebut kembali warisan para Khan Turki yang agung sebelum kita dan menyatukan rakyat kita menjadi satu bangsa!"
