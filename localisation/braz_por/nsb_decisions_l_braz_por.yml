 form_siberia_category_desc: "Siberia tidak pernah memiliki identitas yang bersatu, baik secara budaya, etnis, atau politik, selain Rusia saat ini. Namun, berkat dibawa ke dunia yang sama oleh tangan Rusia, masyarakat Siberia semakin bersatu. Jika sebuah negara ingin menyatukan Siberia dan mengusir Imperialis Rusia, banyak orang pasti akan menerima penyatuan di bawah negara baru ini, dan banyak yang memintanya menjadi kenyataan."
