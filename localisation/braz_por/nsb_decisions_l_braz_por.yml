 SOV_gosproyektstroy_bring_foreign_experts_desc: "Kami akan menandatangani perjanjian dengan entitas industri besar [FROM.GetAdjective] untuk mendatangkan insinyur dan arsitek ahli dari [FROM.GetNameDef] untuk bertindak sebagai konsultan untuk proyek industri kami."
 SOV_gosproyektstroy_focus_civ: "Spesialisasi dalam Industri Sipil"
 SOV_gosproyektstroy_focus_civ_desc: "Selama modernisasi industri skala besar, kami akan memprioritaskan peningkatan industri berat dan ringan sipil."
 SOV_gosproyektstroy_focus_mil: "Spesialisasi dalam Industri Militer"
 SOV_gosproyektstroy_focus_mil_desc: "Selama modernisasi industri skala besar, kami akan fokus pada pencapaian efisiensi yang lebih besar dalam produksi militer."
 SOV_gosproyektstroy_focus_dock: "Spesialisasi dalam Industri Pembuatan Kapal"
