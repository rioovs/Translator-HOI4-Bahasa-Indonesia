 SOV_generic_industry_relocation: "Relokasi Industri dari [FROM.GetName]"
 SOV_generic_industry_relocation_desc: "Mengevakuasi alat-alat berat dari pabrik [FROM.GetName] kami ke Ural adalah tugas yang sangat besar, tetapi hal ini perlu untuk mengamankan produksi perang kami."
