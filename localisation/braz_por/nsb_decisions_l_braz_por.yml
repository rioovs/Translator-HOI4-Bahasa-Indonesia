 SOV_expand_nkvd_opposition: "Perluas Cabang Militer NKVD"
 SOV_expand_nkvd_opposition_desc: "Kita harus mengambil kesempatan ini untuk memperluas cabang militer NKVD. Pasukan ini bisa sangat berguna dalam mengamankan kemenangan kita di masa depan."
 SOV_expand_nkvd_opposition_tt: "Menambahkan 5 Divisi NKVD yang akan tetap setia saat [GetSovietCivilWarName] dimulai."
 SOV_nkvd_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y120 hari§!."
 SOV_influence_army_opposition: "Meningkatkan Dukungan Tentara"
 SOV_influence_army_opposition_desc: "Setelah menyusup ke dalam angkatan bersenjata berarti kita sekarang dapat mulai menemukan perwira dan prajurit berpangkat lebih rendah yang bersimpati pada tujuan kita, dan memastikan mereka bergabung dengan kita jika terjadi perang."
 SOV_influence_army_opposition_tt: "Dukungan tentara meningkat"
 SOV_influence_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y60 hari§!."
 SOV_influence_army_opposition_level_tt: "Dukungan di tentara kurang dari §Y70%§!"
 SOV_influence_navy_opposition: "Meningkatkan Dukungan Angkatan Laut"
 SOV_influence_navy_opposition_desc: "Angkatan Laut mungkin tidak terlalu berguna dalam perang saudara, namun mereka tetap dapat membantu kita mengambil lokasi-lokasi penting dan memastikan kita mendapatkan pasokan. Jadi ada baiknya memastikan loyalitas sejumlah kapten. Selain itu, memiliki armada setelah perang membuka pintu baru bagi kami di kancah internasional."
 SOV_influence_navy_opposition_tt: "Dukungan Angkatan Laut meningkat"
 SOV_influence_navy_opposition_level_tt: "Dukungan di angkatan laut kurang dari §Y70%§!"
 SOV_influence_airforce_opposition: "Meningkatkan Dukungan Angkatan Udara"
 SOV_influence_airforce_opposition_desc: "Dengan menggunakan koneksi kita di angkatan bersenjata, kita seharusnya bisa menemukan pilot dan komandan udara yang bersimpati pada tujuan kita. Memiliki angkatan udara di pihak kita pasti akan membuat perang menjadi tugas yang lebih mudah."
 SOV_influence_airforce_opposition_tt: "Dukungan Angkatan Udara meningkat"
 SOV_influence_air_opposition_level_tt: "Dukungan di angkatan udara kurang dari §Y70%§!"
 SOV_recruit_general_opposition: "Rekrut seorang Jenderal untuk tujuan Anda"
 SOV_recruit_general_opposition_desc: "Kita harus menggunakan koneksi kita di dalam Tentara Merah untuk mencoba dan meyakinkan perwira tinggi untuk bergabung dengan kita jika terjadi perang saudara."
 SOV_recruit_general_opposition_tt: "Seorang Jenderal atau Marsekal Lapangan menjadi setia pada tujuan kita"
 SOV_recruit_admiral_opposition: "Rekrut seorang Laksamana untuk tujuan Anda"
 SOV_recruit_admiral_opposition_desc: "Kita harus menggunakan koneksi kita di dalam angkatan laut Merah untuk mencoba dan meyakinkan perwira tinggi untuk bergabung dengan kita jika terjadi perang saudara."
 SOV_recruit_admiral_opposition_tt: "Seorang Laksamana menjadi setia pada tujuan kita"
 SOV_recruit_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y30 hari§!."
 SOV_army_framejob: "Menjebak seorang perwira militer"
 SOV_army_framejob_desc: "Dengan menyebarkan desas-desus tentang jenderal-jenderal yang setia kepada [ROOT.GetLeader], dan dengan menyerahkan beberapa \"bukti\" palsu ke tangan NKVD, kita seharusnya bisa mengalihkan perhatian dari diri kita sendiri untuk sementara waktu. Sebagai dampak tambahannya, jika kita beruntung, personel militer lainnya mungkin tidak akan terpengaruh oleh tindakan represif tersebut."
 SOV_army_framejob_tt: "Seorang Jenderal atau Marsekal Lapangan akan dijebak karena aktivitas pengkhianatan."
 SOV_army_framejob_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y[?SOV_army_framejob_decision_re_enable_days_display] hari§!."
 SOV_navy_framejob: "Bingkai seorang laksamana"
 SOV_navy_framejob_desc: "Dengan menyebarkan desas-desus tentang laksamana yang setia kepada [ROOT.GetLeader], dan dengan menyerahkan beberapa \"bukti\" palsu ke tangan NKVD, kita seharusnya bisa mengalihkan perhatian dari diri kita sendiri untuk sementara waktu. Sebagai dampak tambahannya, jika kita beruntung, personel angkatan laut lainnya mungkin tidak akan terpengaruh oleh tindakan represif tersebut."
 SOV_navy_framejob_tt: "Seorang laksamana akan dijebak karena aktivitas pengkhianatan."
 SOV_navy_framejob_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y[?SOV_navy_framejob_decision_re_enable_days_display] hari§!."
 SOV_plan_start_of_uprising_archangelsk: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_archangelsk_desc: "Wilayah Utara memiliki akses ke pelabuhan dan relatif dekat dengan Moskow, menjadikannya basis yang baik. Namun, negara ini memiliki infrastruktur internal yang buruk, dan pembangunan yang rendah, sehingga melancarkan perang dari sini akan sulit dilakukan kecuali ada tindakan yang dilakukan untuk mengatasinya."
 SOV_plan_start_of_uprising_odessa: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_odessa_desc: "Ukraina adalah basis yang baik untuk melakukan pemberontakan. Ini adalah wilayah yang kaya, dengan kota-kota besar, pelabuhan dan infrastruktur yang bagus. Namun, ini juga berarti bahwa akan lebih sulit untuk mengubah negara-negara bagian menjadi tujuan kita dibandingkan di wilayah-wilayah yang kurang berkembang seperti [SOV.GetNameDef]."
 SOV_plan_start_of_uprising_chita: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_chita_desc: "Siberia secara tradisional merupakan kubu anti-Stalinis dan anti-Bolshevik. Kawasan ini mungkin terbelakang, namun relatif mudah untuk mencapai tujuan kita."
 SOV_plan_start_of_uprising_omsk: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_omsk_desc: "Omsk terletak di Siberia bagian barat, juga berbatasan dengan wilayah Ural dan Stepa Besar. Meskipun sedikit terbelakang, negara ini seharusnya relatif mudah untuk membangun basis yang kuat untuk melakukan pemberontakan di sini, dan kemudian memulai serangan ke Moskow."
 SOV_plan_start_of_uprising_tashkent: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_tashkent_desc: "Membangun basis kami di Wilayah Stepa Besar berarti menjaga keselamatan kami. Ini akan memerlukan perjalanan panjang untuk mencapai Moskow, namun sebagian besar pertempuran akan terjadi di garis depan kami. Selain itu, mendapatkan dukungan di kawasan ini seharusnya relatif mudah."
 SOV_plan_start_of_uprising_ufa: "Siapkan Markas Besar Rahasia di [FROM.GetName]."
 SOV_plan_start_of_uprising_ufa_desc: "Keuntungan dari wilayah Ural adalah pertahanannya yang mudah, dan menempatkan basis kami di sini juga memungkinkan kami untuk menyebarkan pengaruh kami ke Siberia dan wilayah Utara, serta ke selatan hingga wilayah Stepa Besar, sehingga memberi kami banyak pilihan berbeda."
