 form_idel_ural_category_desc: "Pada tanggal 1 Maret 1918, Milli Mejlis, juga dikenal sebagai Dewan Nasional berusaha mendeklarasikan pembentukan Republik Idel-Ural, namun digagalkan oleh kedua pihak yang terlibat dalam Perang Saudara. Saat ini, konsep negara bersatu di kawasan ini masih belum banyak dieksplorasi, namun jika ada yang mendeklarasikannya demi melindungi rakyat dari Imperialisme Rusia, dukungan rakyat akan sangat besar."
