l_braz_por:
 BALTIC_entente: "Entente Baltik"
 BALTIC_entente_desc: "Kami, bangsa Balt, mempunyai persaudaraan yang sama, yang ditandai dengan sejarah panjang penderitaan kami di bawah imperialisme asing. Kita tidak bisa lagi tunduk pada kekuatan asing, jika kita melakukan hal tersebut berarti kita menyerahkan kunci kedaulatan kita kepada kekuatan imperialis lainnya. Hanya dengan bersatu kita bisa berharap bisa mempertahankan kemerdekaan."
 formalize_the_entente: "Meresmikan Entente Baltik"
 formalize_the_entente_desc: "Kami ragu-ragu untuk mendeklarasikan Entente Baltik sebagai sebuah faksi, namun kami merasa yakin bahwa kami telah memperoleh cukup anggota untuk berdiri sendiri melawan meningkatnya imperialisme di perbatasan kami."
 abandon_the_entente: "Tinggalkan Entente"
 abandon_the_entente_desc: "Ini adalah usaha yang bodoh. Meskipun kami menginginkan hal ini menjadi mungkin, berdirinya negara-negara Baltik saja bukanlah pilihan yang tepat untuk bertahan hidup. Kita harus menyerah pada kekuatan asing, siapapun itu."
 baltic_entente_leader_flag: "Apakah pemimpin Entente Baltik."
 baltic_entente_flag: "Telah setuju untuk bergabung dengan Baltic Entente"
 convert_neighbours_baltic_cat: "Sebarkan Revolusi"
 convert_neighbours_baltic_cat_desc: "Revolusi telah sukses besar di sini di [Root.GetNameDef], yang tersisa sekarang hanyalah menyebarkan berita tentang revolusi kepada saudara-saudara kita di Baltik. Para pekerja di Baltik akan dibebaskan dari penindas borjuis mereka dengan tangan mereka sendiri, namun sejumlah bantuan [Root.GetAdjective] akan membantu mereka dalam perjalanan mereka."
 BALTIC_promote_communism: "Propaganda Sosialis di [From.Owner.GetNameDef]"
 BALTIC_promote_communism_desc: "Banyak kaum tani [From.Owner.GetNameDef] yang masih memandang sosialisme sebagai musuh terhadap cara hidup mereka. Meski kita mungkin tidak akan pernah bisa menyembuhkan luka yang ditinggalkan Tentara Merah, kita bisa meyakinkan mereka bahwa cita rasa revolusi kita tidak begitu berdarah."
 BALTIC_promote_communism_militancy: "Mendukung [From.Owner.GetAdjective] Militan"
 BALTIC_promote_communism_militancy_desc: "Semangat sosialis berkobar begitu membara di hati banyak pekerja [From.Owner.GetAdjective] sehingga mereka hanya memerlukan dukungan dari kekuatan luar untuk mulai mengambil langkah-langkah untuk menggulingkan kediktatoran."
 BALTIC_communist_propaganda: "Propaganda Komunis Baltik"
 BALTIC_communist_militancy: "Militan Komunis Baltik"
 infiltrate_belarus_decisions: "Menyusup ke Belarus"
 infiltrate_belarus_decisions_desc: "Uni Soviet mengklaim mewakili kepentingan kelas bawah Belarusia, namun kaum sosialis Baltik mengklaim hal ini hanya sekedar sikap belaka. Mereka mengklaim bahwa [SOV.GetLeader] adalah seorang diktator borjuis dalam segala hal, dan hanya dengan mempersenjatai rakyat Belarus maka mereka dapat benar-benar dibebaskan dalam sebuah negara sosialis."
 BALTIC_promote_unity_BLR: "Kontrol Kontes di [From.GetName]"
 BALTIC_promote_unity_BLR_desc: "Ketika perang saudara di Belarus pecah, semua negara harus memutuskan sendiri pihak mana yang mereka pilih dalam revolusi. Kita harus memastikan bahwa [From.GetName] berada di pihak yang menang."
 BALTIC_belarus_uprising: "Perang Saudara Belarusia yang Tertunda"
 BALTIC_belarus_uprising_desc: "Rakyat Belarusia sedang terpecah belah, separuh dari negaranya ingin tetap menjadi bagian dari [SOV.GetNameDef], dan separuh lainnya ingin membelot ke Baltik."
 support_polish_falange_decisions: "Mendukung Falangisme Polandia"
 support_polish_falange_decisions_desc: "Fasisme telah berhasil di Lituania dan kami tidak melihat alasan mengapa kami harus meninggalkan saudara-saudara kami yang dulu di Polandia. Dengan menyebarkan pemikiran Falangis di kalangan masyarakat, kita mungkin dapat memberdayakan [POL.GetFascistParty] dan dari sana kita dapat berupaya untuk menegaskan supremasi Polandia-Lithuania di seluruh benua."
 LIT_promote_fascism: "Propaganda Fasis di Polandia"
 LIT_promote_fascism_desc: "Selama beberapa dekade, fasisme telah terpinggirkan dalam politik Polandia. Meskipun kita ingin masyarakat Polandia bangkit, mereka tidak akan mempunyai peluang jika kita tidak secara terbuka mempromosikan fasisme di negara mereka."
 LIT_promote_falange_militancy: "Mendukung Militan Falang"
 LIT_promote_falange_militancy_desc: "[POL.GetFascistParty] terkenal karena metode demonstrasinya yang penuh kerusuhan dan kekerasan. Banyak kaum fasis yang takut dengan semangat nasionalis [POL.GetFascistParty], namun kita tahu ini hanyalah ekspresi patriotisme yang membara di hati mereka yang harus didukung."
 LIT_ignite_civil_war_in_POL: "Mulailah Pemberontakan"
 LIT_ignite_civil_war_in_POL_desc: "Persiapan telah dilakukan. Polandia akan segera menjadi medan pertempuran bukan hanya sekedar ide namun juga keberanian dan kejayaan. Kami telah melakukan semua yang kami bisa untuk mendukung kaum Falangis di Polandia, yang perlu kami lakukan sekarang hanyalah menyerah dan berharap Tuhan benar-benar ada di pihak mereka."
 LIT_adopt_the_dobuzhinsky_flag_design_decision: "Mengadopsi Desain Bendera Heraldik Dobuzhinsky"
 LIT_adopt_the_dobuzhinsky_flag_design_decision_desc: "Warna bendera kita harus sesuai dengan warna lambang negara. Tidak ada warna hijau pada lambang negara, dan oleh karena itu warna hijau juga tidak boleh ada pada bendera. Oleh karena itu kita harus menerima usulan yang diberikan kepada kita oleh Mstislav Dobuzhinsky dan Vydūnas."
 march_through_estonia: "Pawai Melalui Estonia"
 march_through_estonia_desc: "Lemahnya pemerintahan Konstantin Päts telah cukup lama membungkam seruan para patriot Estonia. Kita kekurangan tenaga untuk melawan angkatan bersenjata Estonia sendirian, tapi mungkin dengan menunjukkan rasa frustrasi kita terhadap kediktatoran dalam serangkaian demonstrasi di seluruh negeri, kita dapat mengingatkan generasi muda Estonia bahwa ayah mereka berjuang demi kehidupan yang baik bagi mereka, namun Päts dan komplotan rahasianya menyangkal hal tersebut."
 EST_stomp_the_vaps: "Tindakan Keras Pemerintah yang Akan Datang"
 EST_stomp_the_vaps_desc: "[EST.GetLeader] mengetahui bahwa kami berupaya untuk mengganggu rezim [EST.GetLeader.GetHerHis] dan [EST.GetLeader.GetSheHe] sedang membuat persiapan untuk menindak kami dan mengakhiri demonstrasi kami. Jika kita tidak berhasil menggulingkan pemerintahan sebelum itu, Estonia akan menghadapi perang saudara!"
 EST_march_in_state: "Maret di [FROM.GetName]"
 EST_convert_FIN_cat: "Pawai Melalui Finlandia"
 EST_convert_FIN_cat_desc: "[FIN.GetFascistParty] telah lama memiliki hubungan dekat dengan [EST.GetFascistParty] dan sekarang kita telah mengklaim kekuasaan atas negara kita sendiri, kita harus memberdayakan para veteran Finlandia untuk mengambil alih negara mereka."
 EST_march_in_FIN_state: "Maret di [FROM.GetName]"
 EST_march_in_FIN_capital: "Pawai pada [FROM.GetName]"
 EST_march_in_FIN_capital_desc: "Ketika kita merasa para veteran Finlandia sudah cukup berani, kita hanya perlu memberikan sinyal untuk bergerak maju [FROM.GetName] dan Finlandia pada akhirnya akan diberdayakan di bawah fasisme."
 promote_baltic_fascism_cat: "Mempromosikan Fasisme Baltik"
 promote_baltic_fascism_cat_desc: "Baltik dicirikan oleh rezim kekanak-kanakan yang lemah dan tidak mampu mewakili darah Balt yang mengalir melalui pembuluh darah rakyatnya. Lituania, Estonia, dan bahkan beberapa di Polandia harus diingatkan akan kejayaan nenek moyang mereka yang menentang bangsa Jerman dan Slavia yang kini sekali lagi berusaha menindas kita."
 LAT_promote_fascism: "Propaganda Fasis di [From.Owner.GetNameDef]"
 LAT_promote_fascism_desc: "Banyak orang di [From.Owner.GetNameDef] belum menerima bahwa partai [From.Owner.GetFascistParty] mereka adalah satu-satunya cara agar masyarakat [From.Owner.GetAdjective] pada akhirnya bisa memerintah diri mereka sendiri. Hal ini harus dikoreksi dengan upaya propaganda, dan dukungan aktif dari partai [From.Owner.GetFascistParty]."
 LAT_promote_falange_militancy: "Mendukung [From.Owner.GetFascistParty] Militan"
 LAT_promote_falange_militancy_desc: "Ada orang-orang di [From.Owner.GetNameDef] yang menyimpan kemarahan Balt di dalam hati mereka, dan merupakan tugas kita untuk memberi mereka dukungan militer dan politik yang layak mereka dapatkan."
 LAT_ignite_civil_war_in_target: "Nyalakan Perang Saudara [From.Owner.GetAdjective]"
 LAT_ignite_civil_war_in_target_desc: "Propaganda hanya bisa mencapai banyak hal, terkadang diperlukan tindakan langsung untuk memberikan kekuatan dan stabilitas pada negara. Kita sudah berusaha semaksimal mungkin, sekarang kita serahkan [From.Owner.GetFascistParty] pada nasibnya sendiri."
 LIT_iron_wolf_coup: "Kudeta Serigala Besi"
 LIT_iron_wolf_coup_desc: "Para pengikut Augustinas Voldemaras sedang mengorganisir pemberontakan di dalam negara kita. Jika tidak ada tindakan yang dilakukan untuk menghindari Serigala Besi, kita berisiko terjerumus ke dalam perang saudara. Kita harus memutuskan apakah kita akan memberikan konsesi kepada para pendukung Serigala Besi dan mengambil risiko memberdayakan mereka atau apakah kita akan membuang pemimpin mereka dari negara kita, membiarkan para pengikutnya tercerai-berai dan tanpa kepemimpinan kuat yang mereka klaim miliki."
 LIT_iron_wolf_partisans: "Partisan Serigala Besi"
 LIT_iron_wolf_partisans_desc: "Serigala Besi sedang berorganisasi di negara kita. Seiring berjalannya waktu, mereka pasti akan meningkatkan dukungan mereka di kalangan rakyat Lituania dan pada akhirnya mungkin merasa berani untuk melakukan kudeta terhadap pemerintah."
 LIT_iron_wolf_appeasement: "Tunda Pemberontakan Serigala Besi"
 LIT_iron_wolf_appeasement_desc: "Kita harus melakukan upaya untuk mengganggu aktivitas Serigala Besi di negara kita. Meskipun tidak satu pun dari langkah-langkah ini yang dapat memberantas mereka sepenuhnya, kita mungkin dapat menunda upaya mereka cukup lama untuk menemukan solusi permanen."
 LIT_relocate_iron_wolf_recruitment: "Relokasi Pusat Perekrutan Serigala Besi"
 LIT_relocate_iron_wolf_recruitment_desc: "Serigala Besi mengandalkan perekrut lokal untuk merekrut anggota baru ke dalam barisan mereka. Dengan memindahkan secara paksa para perekrut ini, kami akan membingungkan calon pengikut dan berpotensi mencegah mereka masuk ke dalam kelompok Serigala Besi."
 LIT_promote_alternative_paramilitaries: "Mempromosikan Paramiliter Alternatif"
 LIT_promote_alternative_paramilitaries_desc: "Meskipun kami ingin warga negara kami bergabung dengan militer resmi Lituania, tidak dapat dihindari bahwa beberapa orang lebih memilih setia kepada kelompok yang terpisah dari pemerintah. Mungkin dengan mempromosikan kelompok lain seperti Persatuan Penembak Lituania, kita dapat mengalihkan perhatian beberapa kaum nasionalis untuk bergabung dengan Serigala Besi."
 LIT_grant_concessions_to_iron_wolf: "Tawarkan Konsesi kepada Serigala Besi"
 LIT_grant_concessions_to_iron_wolf_desc: "Mungkin dengan memberikan beberapa isyarat simbolis kepada Serigala Besi, kita mungkin bisa meredakan kegelisahan mereka."
 EST_vaps_revolt_category: "Pemberontakan Vapsid"
 EST_vaps_revolt_category_desc: "Serangkaian perkumpulan veteran di seluruh Estonia telah terorganisasi menjadi satu entitas fasis yang dikenal sebagai Gerakan Vaps yang mengancam akan menggulingkan pemerintah. Kita harus mengambil tindakan untuk mengekang kebangkitan nasionalisme Estonia jika kita ingin menjaga rezim tetap damai."
 EST_vaps_uprising: "Vaps Berbaris di Tallinn"
 EST_vaps_uprising_desc: "Vaps terus berbaris dan berdemonstrasi di seluruh Estonia meskipun merupakan organisasi ilegal. Semakin lama kita membiarkan kelompok nasionalis ini berlarut-larut, semakin besar risiko kita membiarkan kelompok lain bergabung dengan perjuangan mereka."
 EST_vaps_crackdown: "Tindakan keras terhadap Vap"
 EST_vaps_crackdown_desc: "Kami mengoordinasikan tindakan keras total terhadap semua masyarakat yang terkait dengan Gerakan Vaps. Jika suku Vaps tetap berada di pinggiran politik, maka tindakan keras yang diambil seharusnya tidak terlalu penting, namun jika mereka telah mengumpulkan cukup dukungan, akibat dari tindakan keras kita mungkin akan menjadi perang saudara yang berdarah dengan beberapa veteran tertua di Estonia."
 EST_fight_vaps_decisions: "Lawan Vap"
 EST_fight_vaps_decisions_desc: "Gerakan Vaps harus dilawan jika ingin tindakan keras kita berhasil. Tindakan yang mengganggu Vaps akan secara drastis mengurangi pengaruhnya di negara kita dan akan membuat penghapusan paksa mereka menjadi lebih lancar."
 EST_divide_veterans_societies: "Bagilah Masyarakat Veteran"
 EST_divide_veterans_societies_desc: "Kelompok Vaps sebagian besar terdiri dari mereka yang bertempur dalam Perang Kemerdekaan Estonia, dan meskipun menyedihkan melihat para pahlawan kita jatuh ke dalam kekuasaan ultranasionalisme, kita harus memecah dan memecah belah masyarakat veteran yang telah dipersatukan oleh Vaps."
 EST_disrupt_vaps_recruitment: "Ganggu Perekrutan Vapsid"
 EST_disrupt_vaps_recruitment_desc: "Meskipun Vaps secara tradisional adalah para veteran mulai dari usia paruh baya hingga lanjut usia, mereka tidak kekurangan simpatisan muda yang ingin bergabung atas nama ayah dan kakek mereka. Kita harus menemukan cara untuk menghentikan perekrutan ini dan menjauhkan para pemuda ini dari lagu sirene fasisme."
 EST_crackdown_on_vaps: "Serang Vap"
 EST_crackdown_on_vaps_desc: "Vaps tumbuh terlalu berani, kita harus melakukan serangan terhadap anggota mereka jika kita ingin menghilangkan pengaruh mereka yang semakin besar."
 EST_put_vaps_leaders_on_trial: "Tempatkan Simpatisan Vapsid di Pengadilan"
 EST_put_vaps_leaders_on_trial_desc: "Bukan rahasia lagi bahwa beberapa anggota pemerintah bersimpati terhadap gerakan Vaps. Hal ini tidak bisa dibiarkan berlanjut; anggota staf militer kita harus diadili sebagai pengkhianat karena hubungannya dengan Vaps."
 EST_launch_vaps_investigation: "Luncurkan Investigasi Vapsid"
 EST_launch_vaps_investigation_desc: "Kita harus mendedikasikan sebagian dari dinas rahasia kita untuk menyusup dan menghentikan upaya Vaps untuk menumbangkan pemerintah."
 EST_anti_vaps_propaganda: "Propaganda Anti-Fasis"
 EST_anti_vaps_propaganda_desc: "Kami mengambil tindakan tegas ketika mempromosikan anti-fasisme di negara kami. Banyak dari mereka yang menentang fasisme berasal dari kalangan demokrat dan komunis, namun mungkin mereka yakin untuk mendukung kediktatoran dalam upaya bersama kita untuk mengekang kebangkitan fasisme."
 EST_delay_the_crackdown: "Tunda Tindakan Keras"
 EST_delay_the_crackdown_desc: "Meskipun kami lebih suka jika Vaps ditangani dengan cara yang bijaksana, kami tidak bisa mengambil risiko membuat negara ini berantakan dan tindakan keras harus ditunda."
 EST_vapsid_takeover: "Pemerintahan Vapsid sudah memerintah negara ini"
 LAT_perkonkrust_revolt_category: "Pemberontakan Pērkonkrusts"
 LAT_perkonkrust_revolt_category_desc: "Kaum ultranasionalis yang mengagung-agungkan suku-suku Baltik dan etnis Latvia, Pērkonkrust adalah ancaman nyata terhadap Latvia yang telah kita perjuangkan dengan susah payah untuk diciptakan. Pērkonkrusts merupakan infeksi terhadap harga diri nasional yang terluka dan harus dilenyapkan."
 LAT_perkonkrust_uprising: "Pemberontakan Pērkonkrusts"
 LAT_perkonkrust_uprising_desc: "Seiring berjalannya waktu, Pērkonkrust akan mengumpulkan dukungan di seluruh negeri, dan jika dibiarkan, mereka akan merasa berani untuk mencoba melakukan kudeta terhadap pemerintah."
 LAT_delay_perkonkrust_decisions: "Lawan Pērkonkrust"
 LAT_delay_perkonkrust_decisions_desc: "Meskipun bukan solusi permanen, kita mungkin akan melakukan beberapa kampanye untuk mengurangi dukungan fasis di negara kita agar Pērkonkrust dapat diatasi, dengan satu atau lain cara."
 LAT_equality_campaigns: "Kampanye Kesetaraan"
 LAT_equality_campaigns_desc: "Pērkonkrust menentang misi [Root.GetLeader] untuk menciptakan Latvia di mana matahari menyinari seluruh rakyat Latvia secara merata, dan oleh karena itu kita harus memperjelas bahwa mendukung narasi supremasi mereka bertentangan dengan nilai-nilai inti bangsa kita."
 LAT_empower_democrats: "Memberdayakan Demokrat"
 LAT_empower_democrats_desc: "Meskipun tidak diinginkan, kaum Demokrat adalah penentang keras Pērkonkrust dan menimbulkan ancaman yang jauh lebih kecil bagi bangsa kita. Hal ini akan meningkatkan dukungan terhadap oposisi demokratis, namun kita harus melakukan segala yang kita bisa untuk mengekang aktivitas Pērkonkrusts."
 LAT_support_loyalists: "Integrasikan Oposisi"
 LAT_support_loyalists_desc: "Dengan mencaplok sektor-sektor oposisi, kita akan lebih berdaya untuk mendorong Pērkonkrust ke dalam kelompok pinggiran politik masyarakat kita."
 BALTIC_forest_brother_resistance_cat: "Perlawanan Saudara Hutan"
 BALTIC_forest_brother_resistance_cat_desc: "Sosialisme belum sepenuhnya diterima oleh semua orang di negara kita, dan tidak ada yang begitu vokal dan aktif dalam ketidaksukaan mereka terhadap [Root.GetNonIdeologyName] baru selain Forest Brothers. Sebagai pendukung setia nasionalisme [Root.GetAdjective], Forest Brothers menolak semua pengaruh asing di [Root.GetNonIdeologyName] dan berusaha menyingkirkan partai komunis dari kekuasaan demi pemerintahan yang lebih nasionalis."
 BALTIC_forest_brothers_resistance: "Aktivitas Perlawanan"
 BALTIC_forest_brothers_resistance_desc: "Forest Brothers sedang bersiap melakukan tindakan pengkhianatan di negara kita. Kami belum tahu apa yang akan mereka lakukan, tapi kami tahu bahwa hal ini tentu saja akan mengganggu tujuan kami menyebarkan sosialisme ke seluruh negeri."
 POL_purchase_madagascar: "Beli [543.GetName]"
 POL_purchase_madagascar_desc: "Madagaskar adalah lanskap asing yang penuh dengan flora dan fauna yang asing bagi orang Polandia. Meski banyak yang menganggap hal ini membuat pulau itu tidak ramah bagi orang Polandia, ada pula yang melihatnya sebagai peluang untuk tinggal di tempat yang benar-benar baru. Ukuran pulau dan potensi sumber daya mentah di sana menjadikannya tujuan ideal untuk menampung pemerintah Polandia di pengasingan, jika memang demikian."
 POL_purchase_gambia: "Beli [701.GetName]"
 POL_purchase_gambia_desc: "Berabad-abad yang lalu, Kadipaten Courland berusaha menjajah [701.GetName] atas nama Persemakmuran Polandia-Lithuania. Meskipun memiliki hubungan baik dengan penduduk setempat, mereka dipaksa keluar oleh kekuatan asing. Sudah saatnya hal ini diperbaiki."
 POL_purchase_cheap_colony: "Beli [FROM.GetName]"
 POL_purchase_cheap_colony_desc: "Minat Polandia terhadap [FROM.GetName] semakin meningkat. Meskipun kepentingan-kepentingan ini berada di luar lingkup pemerintah, antusiasme mereka dapat digunakan sebagai pembenaran untuk pembelian wilayah tersebut oleh Polandia."
 POL_anti_capitalist_decisions: "Revolusi Anti-Kapitalis"
 POL_anti_capitalist_decisions_desc: "Kapitalisme adalah penyakit di bumi. Meskipun banyak dari negara-negara ini menyebut diri mereka \"Demokrat\", mereka hanya memperbudak proletariat dalam demokrasi borjuis, dan tugas setiap sosialis adalah membebaskan kawan-kawan mereka."
 POL_anti_fascist_revolution_category: "Revolusi Anti-Fasis"
 POL_anti_fascist_revolution_category_desc: "Kaum fasis menggunakan bahasa perjuangan proletariat melawan kaum borjuis untuk menciptakan kediktatoran ultranasionalis yang melanjutkan penindasan brutal terhadap kelas pekerja. Sebagai negara sosialis, kita harus membebaskan para pekerja di dunia dari teror fasisme."
 POL_support_monarchy_in_LIT_cat: "Klaim Kami terhadap [Root.GetRoyalClaim]"
 POL_support_monarchy_in_LIT_cat_desc: "Dengan [Root.GetLeader] yang sekarang duduk di singgasana [Root.GetAdjective], kita mempunyai hak ilahi untuk mengklaim [Root.GetRoyalClaim] sebagai bagian yang sah dari bangsa kita.\n\nKekuatan klaim kita saat ini adalah [Root.GetPolRoyalClaimStrength]"
 POL_support_monarchy_in_LIT_tt: "Membuka Keputusan §YKlaim Kami terhadap Lituania§!."
 POL_support_monarchy_in_ROM_tt: "Membuka Keputusan §YKlaim Kami terhadap Rumania§!."
 POL_support_monarchy_in_CZE_tt: "Membuka §YKlaim Kami terhadap Keputusan Cekoslowakia§!."
 LIT_support_monarchy_in_POL_tt: "Membuka Keputusan §YKlaim Kami terhadap Polandia§!."
 lithuania_strength: "§Y[?LIT.monarchist_support]§!"
 romania_strength: "§Y[?ROM.monarchist_support]§!"
 bohemia_strength: "§Y[?CZE.monarchist_support]§!"
 poland_strength: "§Y[?POL.monarchist_support]§!"
 POL_banned_monarchy_flag: "Telah melarang monarki."
 POL_propagandise_monarchist_sentiment: "Mempropagandakan Sentimen Monarki"
 POL_double_propagandise_monarchist_sentiment: "Propaganda Anti-[From.GetLeader]"
 POL_sway_lithuanian_generals: "Goyangkan [From.GetAdjective] Jenderal"
 POL_invest_in_lithuania: "Berinvestasi di [From.GetNameDef]"
 POL_ignite_monarchist_war: "Menyalakan Perang Saudara"
 POL_flip_lithuania_monarchist: "Dorong Klaim"
 POL_fight_against_monarchy_in_LIT_cat: "Memerangi Penggugat Asing"
 POL_fight_against_monarchy_in_LIT_cat_desc: "Seorang agen asing berusaha untuk mengklaim takhta [Root.GetAdjective] dengan mencari dukungan internal dalam pemerintahan kita. Jika kita dapat mempertahankan dukungan masyarakat dan dukungan internal tetap rendah, kita mungkin dapat menumbangkan seluruh pertanyaan mengenai klaim mereka.\n\nKekuatan klaim saat ini adalah [Root.GetPolRoyalClaimStrength]"
 POL_growing_monarchist_sentiment: "Sentimen Monarki yang Tumbuh"
 POL_suppress_monarchist_sentiment: "Menekan Sentimen Monarki"
 POL_ban_monarchist_propaganda: "Larang Propaganda Monarki"
 POL_root_out_monarchists: "Singkirkan Kaum Monarki"
 POL_anti_monarchist_purge: "Pembersihan Militer Anti-Monarkis"
 POL_ban_polish_imports: "Larang [From.GetAdjective] Impor"
