 restructure_supply_system_desc: "Dengan mengalihkan bahan bangunan dan pekerja kereta api, kita dapat dengan cepat menciptakan sejumlah kecil tempat pembuangan sementara di sepanjang jalur kereta api kita. Namun hal ini bukanlah cara yang berkelanjutan dalam menjalankan sistem.\n\n§RKeputusan ini hanya dapat diambil satu kali saja. Bonus akan hilang jika Anda membangun lebih dari 3 pusat pasokan tambahan.§!"
