 SOV_organize_covert_depots_poum: "Siapkan Depot Terselubung"
 SOV_organize_covert_depots_poum_desc: "Kontak anti-Stalinis kami di Spanyol akan menyiapkan depot tersembunyi untuk menyimpan senjata dan peralatan militer yang akan diperoleh agen kami melalui berbagai cara."
 SOV_organize_covert_depots_poum_tt: "Dampak ketika terjadi pemberontakan POUM:"
 SOV_send_infantry_equipment_poum: "Menyediakan Senapan dan Amunisi"
 SOV_send_infantry_equipment_poum_desc: "Pengiriman senapan dan amunisi baru akan memungkinkan kawan-kawan Spanyol kita melanjutkan perang melawan fasisme dan borjuasi kontra-revolusioner."
 SOV_organize_popular_brigades_poum: "Atur Brigade Populer"
 SOV_organize_popular_brigades_poum_desc: "Kami akan menjalin kontak dengan anggota berbagai organisasi politik Kiri Anti-Stalinis, baik lokal maupun asing, untuk membentuk brigade internasional guna mendukung rekan-rekan Spanyol kami dalam perang."
 SOV_send_elite_commandos_poum: "Kirim Komando Elit"
 SOV_send_elite_commandos_poum_desc: "Kita mempunyai orang-orang yang sangat terlatih dan terampil yang mampu melakukan operasi khusus dengan sukses, serta mantan kombatan perang saudara non-Stalinis dan veteran angkatan darat yang tahu cara berperang.\nKita harus menyediakan aset-aset ini kepada pemerintah POUM dalam perjuangannya melawan fasisme dan Stalinisme."
 SOV_send_elite_commandos_poum_flag: "Telah mengirim Komando Elit ke Spanyol"
 SOV_organize_popular_speeches_poum: "Atur Pidato Populer"
 SOV_organize_popular_speeches_poum_desc: "Kawan-kawan kami di Spanyol membutuhkan kerja sama penuh dari rakyat untuk melanjutkan upaya perang. Kita harus melakukan, bekerja sama dengan anggota organisasi lokal yang berpengaruh, kampanye informasi dan agitasi untuk menyalakan kembali api revolusi di kalangan massa Spanyol."
 SOV_infiltrate_stalinist_plans_in_spain_poum: "Menyusup ke Komando Stalinis di Spanyol"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc: "Sejumlah penasihat militer Soviet yang baru akan segera dikirim ke Spanyol untuk membantu pemerintah republik borjuis, dan kita memiliki kesempatan untuk menyusup ke beberapa agen anti-Stalinis di antara mereka.\nAgen-agen ini akan menghubungi dan merekrut tentara, Brigadir dan milisi yang bersimpati kepada POUM di pihak republik borjuis, untuk menciptakan jaringan informan yang memungkinkan kita mengetahui rencana musuh sebelum rencana itu dilaksanakan."
