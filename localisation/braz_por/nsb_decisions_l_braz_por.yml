 SOV_paranoia_system: "Paranoia Politik"
 SOV_paranoia_system_desc: "Suasana kecurigaan dan ketidakpercayaan menyelimuti [ROOT.GetNameDef]. Kekhawatiran [ROOT.GetLeader] terhadap faksionalisme di dalam partai semakin meningkat seiring dengan banyaknya tuduhan dan dugaan tindakan sabotase, perusakan, dan spionase yang diselidiki oleh NKVD."
 SOV_paranoia_bg_tooltip: "Jika nilai £SOV_paranoia_text_icon §YParanoia§! meningkat melebihi §Y25§!, peristiwa pembersihan acak dapat terjadi.\nSemakin tinggi £SOV_paranoia_text_icon §YParanoia§!, dan semakin lama angkanya mencapai angka tersebut, semakin besar kemungkinan terjadinya pembersihan.\nJika nilai £SOV_paranoia_text_icon §YParanoia§! meningkat melebihi §R75§!, peristiwa pembersihan besar-besaran dapat terjadi.\n\nTertentu §Yfokus§!, §Ykeputusan§! dan §Yefek§! akan membuat £SOV_paranoia_text_icon §YParanoia§! segera meningkat/menurun, dan ciri-ciri penasihat dan pemimpin negara tertentu akan perlahan-lahan meningkat §YParanoia§! seiring berjalannya waktu.\n\nMenyelesaikan fokus §Y[GetAppropriateLastPurgeFocusName]§! akan menghapus sistem £SOV_paranoia_text_icon §YParanoia§!."
