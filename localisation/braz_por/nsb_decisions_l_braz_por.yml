 SOV_polish_territory_desc: "Saat ini kami menguasai banyak wilayah yang pernah menjadi bagian dari Republik Polandia. Jika kami menyerahkan sebagiannya kembali, kepemimpinan yang kami tempatkan di [POL.capital.GetCapitalVictoryPointName] akan dapat menggunakannya sebagai bukti manfaat kerja sama dengan [ROOT.GetNameDef]."
