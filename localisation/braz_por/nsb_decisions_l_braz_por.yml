 SOV_ignite_uprising_timer_mission_tt: "§RMilisi Revolusioner Trotskis akan bangkit di berbagai negara yang dikuasai.§!"
 SOV_ignite_revolutionary_uprisings_effect_tt: "Kurangi £stability_texticon §YStabilitas§! dan tingkatkan §YPopularitas Komunisme§! di [FROM.GetNameDef], berdasarkan §YPopularitas Komunisme§! di negara tersebut. Efek saat ini:"
 SOV_ignite_revolutionary_uprisings: "Aduk Misa di [FROM.GetNameDef]"
 SOV_ignite_revolutionary_uprisings_desc: "Kaum buruh [FROM.GetNameDef] sudah mulai menunjukkan ketidakpuasan mereka terhadap [FROM.GetRulingParty] dan kebijakan borjuis mereka. Sudah waktunya untuk mempromosikan ideologi komunis di kalangan kelas pekerja [FROM.GetAdjective]."
 SOV_align_admiral_stalin: "[ROOT.GetLeader] memastikan kesetiaan seorang laksamana"
 SOV_align_admiral_stalin_desc: "Dengan menggunakan ancaman, penyuapan, dan koneksi pribadi, [ROOT.GetLeader] berupaya memastikan kesetiaan seorang pemimpin angkatan laut sebagai persiapan menghadapi konflik di masa depan."
