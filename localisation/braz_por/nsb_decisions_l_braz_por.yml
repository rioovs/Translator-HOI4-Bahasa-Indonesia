 POL_promote_falangism_decisions_desc: "Perang dengan Jerman akan segera terjadi, dan meskipun kita kalah dalam persenjataan, [GER.GetLeader] tidak dapat berharap untuk melenyapkan semua musuh [GER.GetLeader.GerHerHis] sekaligus! Dengan dukungan falang yang tepat di antara masyarakat, negara-negara Katolik yang baik di dunia dapat bergabung dengan kita dalam perjuangan melawan [GER.GetNameDef]."
