 SOV_operation_iskra: "Operasi Iskra"
 SOV_operation_iskra_desc: "Kami akan memulai persiapan operasi militer untuk mematahkan pengepungan [195.GetName]."
 SOV_operation_iskra_ongoing_objective_tt: "Tujuan dari serangan ini adalah untuk mematahkan pengepungan §Y[195.GetName]§!, memulihkan koneksi negara ke ibu kota kita pada saat misi berakhir."
 SOV_operation_iskra_ongoing_success_effects_tt: "Jika kita berhasil:"
 SOV_operation_iskra_ongoing_failure_effects_tt: "Jika kita gagal:"
 SOV_operation_iskra_ongoing_success_tt: "§GKami telah mematahkan pengepungan §YLeningrad§! dan kota tersebut saat ini terhubung dengan ibu kota kami.§!"
 SOV_operation_iskra_ongoing_failure_tt: "§RKami belum berhasil mematahkan pengepungan §YLeningrad§!. Kota masih terisolasi dan dikepung musuh.§!"
 SOV_operation_iskra_tt: "§Y[195.GetName]§!, §Y[208.GetName]§! dan §Y[244.GetName]§!:\nTambahkan Pengubah: §Y$SOV_soviet_military_offensive$§! (Serangan Divisi: §G+10.0%§!, Terobosan: §G+10.00%§! untuk [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! di negara bagian)."
 SOV_operation_iskra_activate_decision_tt: "Mengaktifkan Misi: §YOperasi Iskra Sedang Berlangsung§! (Untuk berhasil dalam misi ini, kita harus mematahkan pengepungan §YLeningrad§! dan memulihkan jalur darat antara kota dan ibu kota kita pada saat misi berakhir)."
 SOV_the_rush_for_berlin: "Perburuan menuju Berlin"
 SOV_the_rush_for_berlin_desc: "Jelas sekali bahwa sekutu kita saat ini dalam perang melawan [GER.GetAdjective] akan menjadi saingan terbesar kita setelah perang. Kami tidak bisa membiarkan mereka mengalahkan kami dalam perebutan Berlin."
 SOV_raise_penal_units: "Naikkan Unit Pidana"
 SOV_raise_penal_units_desc: "Lebih banyak daging untuk penggiling daging."
 SOV_raise_penal_units_days_tt: "Hari-hari saat ini adalah: [?SOV_penal_units_raised_flag:days|Y0]"
 SOV_great_patriotic_war_flag: "Sedang berperang dalam §YPerang Patriotik Hebat§!"
 SOV_add_borderline_state_to_plot: "placeholder: menambahkan negara yang secara politik berbatasan dengan plot fasis"
 SOV_add_borderline_state_to_plot_desc: "placeholder: mendapat negara bagian yang mungkin memisahkan diri untuk bergabung dengan Anda di wilayah Anda saat perang dimulai"
 SOV_woo_army_officers: "placeholder: merekrut seorang perwira untuk fasisme"
 SOV_woo_army_officers_desc: "placeholder: Saat Anda memulai perang saudara, petugas ini mungkin bergabung dengan Anda dan membawa beberapa pasukan mereka"
 SOV_woo_navy_officers: "placeholder: merekrut seorang perwira untuk fasisme"
 SOV_woo_navy_officers_desc: "placeholder: Saat Anda memulai perang saudara, petugas ini mungkin bergabung dengan Anda, tetapi mereka tidak akan membawa pasukan"
 SOV_noisy_meeting_in_paris: "placeholder: mengadakan pertemuan yang bising di Paris"
 SOV_noisy_meeting_in_paris_desc: "placeholder: Belum Selesai, membuat Stalin curiga terhadap salah satu penasihat politik setianya"
 SOV_soviet_civil_war_dec_cat: "[GetSovietCivilWarName]"
 SOV_soviet_civil_war_dec_cat_desc: "Ancaman perang saudara kembali menghadang kita. Kita harus bersiap menghadapi kemungkinan terburuk, dan memastikan kendali atas negara dan angkatan bersenjata sebanyak mungkin. Namun kita juga harus berhati-hati dan menghindari menarik terlalu banyak perhatian, atau [ROOT.getLeader] mungkin akan memaksa tangan kita sebelum kita siap."
 SOV_SOS_civil_war_divisions_tt_long: "§YDukungan Perang Saudara§!\n§LSangat penting bagi kita untuk mendapatkan dukungan sebanyak mungkin jika terjadi perang saudara, baik di angkatan bersenjata maupun di kalangan masyarakat sebagai keseluruhan.§![GetArmedForcesText]\n\n----\nAda §Y20%§! risiko harian Stalin memulai perang ketika paranoia berakhir §R90%§!\n----\n[GetCategoryStateText]"
 SOV_opposition_civil_war_divisions_value: "[GetArmedForcesData]"
 SOV_SOS_civil_war_divisions_value: "[?SOV.SOV_centre_army_support|%Y0]"
 SOV_SOT_civil_war_divisions_value: "[?SOV.SOV_left_opposition_army_support|%Y0]"
 SOV_SOB_civil_war_divisions_value: "[?SOV.SOV_right_opposition_army_support|%Y0]"
 SOV_SOP_civil_war_divisions_value: "[?SOV.SOV_exiles_army_support|%Y0]"
 SOV_SOS_civil_war_divisions_tt: "Jika perang saudara akan dimulai saat ini, [?SOV.SOV_centre_army_support|%Y0] Angkatan Darat, [?SOV.SOV_centre_navy_support|%Y0] dari angkatan laut, dan [?SOV.SOV_centre_air_support|%Y0] dari angkatan udara akan tetap setia kepada [SOV.GetLeader].\n----\nAda risiko §Y20%§! setiap hari dari Stalin yang memulai perang ketika paranoia sudah berakhir §R90%§!"
 SOV_SOT_civil_war_divisions_tt: "Dukungan Angkatan Darat: [?SOV.SOV_left_opposition_army_support|%Y0]\nDukungan Angkatan Laut: [?SOV.SOV_left_opposition_navy_support|%Y0]\nDukungan Angkatan Udara: [?SOV.SOV_left_opposition_air_support|%Y0]\n\nDukungan Rakyat: [?SOV_opposition_popular_support|Y1]§Y%§!\n(Dukungan rakyat mempengaruhi penyerahan [FROM.GetLeader] level, dan menambahkan unit partisan selama perang)"
 SOV_SOB_civil_war_divisions_tt: "Dukungan Angkatan Darat: [?SOV.SOV_right_opposition_army_support|%Y0]\nDukungan Angkatan Laut: [?SOV.SOV_right_opposition_navy_support|%Y0]\nDukungan Angkatan Udara: [?SOV.SOV_right_opposition_air_support|%Y0]\n\nDukungan Rakyat: [?SOV_opposition_popular_support|Y1]§Y%§!\n(Dukungan rakyat mempengaruhi penyerahan [FROM.GetLeader] level, dan menambahkan unit partisan selama perang)"
 SOV_SOP_civil_war_divisions_tt: "Dukungan Angkatan Darat: [?SOV.SOV_exiles_army_support|%Y0]\nDukungan Angkatan Laut: [?SOV.SOV_exiles_navy_support|%Y0]\nDukungan Angkatan Udara: [?SOV.SOV_exiles_air_support|%Y0]\n\nDukungan Rakyat: [?SOV_opposition_popular_support|Y1]§Y%§!\n(Dukungan rakyat mempengaruhi penyerahan [FROM.GetLeader] level, dan menambahkan unit partisan selama perang)"
