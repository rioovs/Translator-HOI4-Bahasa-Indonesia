 SOV_carefully_planned_assassination_desc: "Agen NKVD kelahiran Spanyol Ramón Mercader akan berteman dengan orang kepercayaan Trotsky, dia kemudian akan pindah ke Meksiko di mana agen tersebut akan menyamar sebagai simpatisan Trotsky, menunggu saat yang tepat untuk melakukan pembunuhan."
 SOV_carefully_planned_assassination_tt: "Seorang agen NKVD akan berusaha menyusup ke lingkaran dalam Trotsky dan membunuhnya.\n\nPeluang berhasil membunuh Trotsky akan meningkat jika §Y[FROM.GetFlag][FROM.GetNameDefCap]§!:\n-Memiliki dukungan komunis yang tinggi\n-Memiliki hubungan baik dengan [ROOT.GetFlag][ROOT.GetNameDefCap]\n-Berada dalam faksi dengan [ROOT.GetFlag][ROOT.GetNameDefCap]\n-Subjek [ROOT.GetFlag][ROOT.GetNameDefCap]\n-Telah melakukan penggerebekan di vila Trotsky"
