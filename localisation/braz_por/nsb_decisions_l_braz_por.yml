 SOV_the_head_of_the_nkvd_yezhov: "Kepala NKVD - Yezhov"
 SOV_the_head_of_the_nkvd_yezhov_desc: "$SOV_genrikh_yagoda$, ketua NKVD saat ini, bersahabat dengan banyak oposisi sayap kanan. bukan tidak mungkin untuk meyakinkan dia bahwa jalan yang kita pilih adalah jalan yang tepat untuk negara ini."
 SOV_the_head_of_the_nkvd_yagoda: "Kepala NKVD - Yagoda"
 SOV_the_head_of_the_nkvd_yagoda_desc: "$SOV_genrikh_yagoda$ mungkin tidak bersahabat dengan para pemimpin Oposisi Kanan, tapi setidaknya dia bisa diajak bernalar. Hal ini harus dilakukan agar Yagoda memahami nilai-nilai proposal kita, dan meyakinkannya bahwa pihak kita adalah pihak yang menang."
 SOV_aligned_right_opposition_flag: "Simpatisan Oposisi Kanan"
 SOV_the_head_of_the_nkvd_yagoda_tt: "§Y$SOV_genrikh_yagoda$§! menjadi pendukung Oposisi Kanan."
 SOV_the_head_of_the_nkvd_yezhov_tt: "§Y$SOV_nikolay_yezhov$§! menjadi pendukung Oposisi Kanan."
 SOV_assassinate_stalin: "Hilangkan Stalin"
 SOV_assassinate_stalin_desc: "Satu-satunya cara untuk menghilangkan tirani secara damai adalah dengan menyingkirkan tiran tersebut. Ini adalah tindakan yang menimbulkan keputusasaan, namun massa akan terhindar dari kengerian perang saudara yang akan terjadi lagi. Kita harus menjatuhkannya, dan kemudian melanjutkan rencana kudeta, sebelum penggantinya mempunyai cukup waktu untuk mengumpulkan dukungan."
 SOV_assassinate_stalin_good_tt: "Upaya pembunuhan dilakukan terhadap Stalin\nPeluang berhasil = §G80%§!\n£trigger_yes basis: 50 %\n£trigger_yes $SOV_infiltrate_the_nkvd$: +30%"
 SOV_assassinate_stalin_bad_tt: "Upaya pembunuhan dilakukan terhadap Stalin\nPeluang berhasil: §Y50%§!\n£trigger_yes basis: 50 %\n£trigger_no $SOV_infiltrate_the_nkvd$: +30%"
 SOV_assassinate_stalin_outcome_tt: "---\nJika upaya tersebut berhasil, §Y$SOV_lavrenty_beriya$§! akan mengambil alih kendali sementara, sehingga menciptakan peluang keberhasilan kudeta.\nJika upaya tersebut gagal, $SOV_paranoia_very_high_increase_effect_tt$."
 SOV_send_supporters_abroad: "Kirim Pendukung ke Luar Negeri"
 SOV_send_supporters_abroad_desc: "Tempat teraman adalah sejauh mungkin dari kroni-kroni Stalin. Kita perlu membawa orang-orang penting keluar dari negara ini, ke tempat yang aman, sampai tiba waktunya untuk kembali dan menyelesaikan pekerjaan yang telah kita mulai."
 SOV_send_supporters_abroad_exile_tt: "Karakter berikut akan dikirim ke pengasingan (§Gkarakter di pengasingan tidak dapat dihapus§!):"
 SOV_send_supporters_abroad_back_tt: "Karakter ini akan dibawa kembali ke negaranya untuk mendukung kami jika terjadi perang saudara."
 SOV_character_purged_flag: "Telah dibersihkan"
 SOV_align_general_stalin: "[ROOT.GetLeader] memastikan kesetiaan seorang jenderal"
 SOV_align_general_stalin_desc: "Dengan menggunakan segala cara yang dimilikinya, [ROOT.GetLeader] berupaya memastikan kesetiaan seorang pemimpin militer sebagai persiapan menghadapi konflik di masa depan."
 SOV_align_general_stalin_tt: "§Y[?SOV.SOV_selected_general_stalin.GetName]§! menjadi setia kepada [ROOT.GetLeader]"
 SOV_permanent_revolution_dec_cat: "Revolusi Permanen"
 SOV_permanent_revolution_dec_cat_desc: "[GetAppropriatePermanentRevolutionDecCatDesc]"
 SOV_permanent_revolution_dec_cat_desc_soviet: "$SOV_the_permanent_revolution_desc$"
 SOV_permanent_revolution_dec_cat_desc_targets: "Teori Marxis mengajarkan bahwa revolusi tidak bisa dihindari jika keadaannya tepat, dan banyak agen musuh [SOV.GetAdjective] yang beroperasi di dalam perbatasan kita memastikan bahwa keadaannya tepat di kalangan kelas pekerja agar pemberontakan bersenjata berhasil di [ROOT.GetName]."
 SOV_organize_fifth_columnists_in_enemy_neighbor: "Atur [FROM.GetAdjective] Kolumnis Kelima"
 SOV_organize_fifth_columnists_in_enemy_neighbor_desc: "Buruh dan tani yang bersimpati kepada Partai Bolshevik selama [FROM.GetNameDef] telah melakukan persiapan untuk pemberontakan bersenjata dan mereka siap menyerang di tempat yang paling tidak diduga oleh musuh."
 SOV_ignite_uprising_timer_mission: "Pemberontakan Revolusioner yang Akan Datang"
