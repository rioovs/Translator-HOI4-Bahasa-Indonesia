 SOV_planning_uprising_in_state: "Menyusup ke [FROM.GetName]"
 SOV_planning_uprising_in_siberia: "§WMenyusup§! [FROM.GetName] §Wdi§! Siberia"
 SOV_planning_uprising_in_far_east: "§WMenyusup§! [FROM.GetName] §Wdi§! Timur Jauh Rusia"
