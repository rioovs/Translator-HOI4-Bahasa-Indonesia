 SOV_agreed_anglo_soviet_invasion_of_iran_flag: "Menyetujui invasi gabungan Inggris-Soviet ke Iran"
 SOV_send_infantry_equipment_asia: "Kirim Peralatan Infanteri"
 SOV_send_infantry_equipment_asia_desc: "Kita harus mengirimkan peralatan militer kepada sekutu Tiongkok kita sehingga mereka dapat menang melawan negara-negara imperialis di sekitar mereka dan melawan panglima perang Tiongkok yang ambisius."
 SOV_send_equipment_cd_tt: "Keputusan ini akan tersedia kembali dalam §Y[?SOV_send_infantry_equipment_cd]§! hari."
 SOV_peace_deal_for_south_sakhalin_and_kuril_islands: "Tawarkan Kedamaian untuk [537.GetName] dan [555.GetName]"
 SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc: "Kami akan menawarkan kepada pemerintah [JAP.GetAdjective] penghentian semua permusuhan jika mereka setuju untuk mengembalikan wilayah kami sebelumnya yaitu [537.GetName] dan [555.GetName]."
 SOV_peace_deal_for_hokkaido: "Tawarkan Perdamaian untuk Sakhalin, Kuril, dan Hokkaido"
 SOV_peace_deal_for_hokkaido_desc: "Kami akan menawarkan kepada pemerintah [JAP.GetAdjective] penghentian semua permusuhan jika mereka setuju untuk mengembalikan wilayah [537.GetName] dan [555.GetName] kami sebelumnya, dan penyerahan [536.GetName] di bawah kendali [ROOT.GetAdjective]."
 SOV_sinkiang_investment_ongoing_flag: "Program bantuan lainnya sedang berlangsung di Sinkiang"
 SOV_sinkiang_mineral_prospection_sik: "Usulkan Prospek Mineral di [SIK.GetNameDef] Selatan"
 SOV_sinkiang_mineral_prospection_sik_desc: "[ROOT.GetAdjective] pejabat telah mengembangkan minat terhadap emas dan mineral langka yang ditambang di Altay, [SIK.GetNameDef]. Untuk mengakses pasar Sinkiang, kami akan mengusulkan untuk mencari deposit baru dan memperbaiki infrastruktur di [619.GetName], wilayah yang kaya akan mineral tetapi dengan cara eksploitasi yang sangat kuno oleh tetangga kami."
 SOV_sinkiang_mineral_prospection: "Prospek Mineral di Sinkiang Selatan"
 SOV_sinkiang_mineral_prospection_desc: "Wilayah [619.GetName], di bagian Barat Daya bekas Sinkiang, kaya akan mineral namun hanya sedikit simpanan yang saat ini dieksploitasi, dan dengan cara yang sangat kuno dan tidak efisien. Kita harus mencari sumber daya dan memperbaiki infrastruktur kawasan untuk memfasilitasi eksploitasi."
 SOV_sinkiang_mineral_prospection_mission_dummy: "[SOV.GetAdjective] Prospeksi Mineral"
 SOV_sinkiang_prospection_rejected_flag: "Proposal kami telah ditolak"
 SOV_sinkiang_oil_prospection_sik: "Usulkan Prospek Mineral di [SIK.GetNameDef] Utara"
 SOV_sinkiang_oil_prospection_sik_desc: "[618.GetName], di bagian utara [SIK.GetNameDef], kaya akan minyak dan mineral namun tidak ada satupun yang dieksploitasi oleh tetangga kita. Kami akan meminta izin untuk mencari sumber daya di wilayah tersebut dan mengeksploitasi simpanan apa pun yang kami temukan."
 SOV_sinkiang_oil_prospection: "Prospek Mineral di Sinkiang Utara"
 SOV_sinkiang_oil_prospection_desc: "[618.GetName], di bagian utara bekas Sinkiang, kaya akan minyak dan mineral namun saat ini tidak ada satupun yang dieksploitasi. Kita harus mencari sumber daya dan mengembangkan infrastruktur di wilayah tersebut untuk memfasilitasi eksploitasi simpanan apa pun yang kita temukan."
 SOV_jiuquan_oil_prospection: "Prospek Minyak di Jiuquan"
 SOV_jiuquan_oil_prospection_desc: "Para ahli kami yakin bahwa mungkin terdapat banyak cadangan minyak di [756.GetName], di bagian utara bekas wilayah [XSM.GetNeutralParty]. Kita harus mengembangkan infrastruktur di wilayah tersebut untuk memfasilitasi eksploitasi simpanan apa pun yang kita temukan."
 SOV_sinkiang_oil_prospection_mission_dummy: "[SOV.GetAdjective] Prospeksi Mineral dan Minyak"
 SOV_sinkiang_oil_prospection_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_sinkiang_military_aid_sik: "Bantuan Militer untuk [SIK.GetNameDef]"
 SOV_sinkiang_military_aid_sik_desc: "Kami akan menawarkan bantuan militer kepada [SIK.GetNameDef] sebagai imbalan atas peningkatan ekspor barang komoditas lokal yang dibutuhkan di negara kami."
 SOV_sinkiang_military_aid_mission_dummy: "[SOV.GetAdjective] Bantuan Militer"
 SOV_sinkiang_military_aid_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_sinkiang_support_expansion_mission_dummy: "[SOV.GetAdjective] Dukungan untuk Perluasan Wilayah"
 SOV_sinkiang_support_expansion_sik: "Mendukung Ekspansi [SIK.GetNameDef]"
 SOV_sinkiang_support_expansion_sik_desc: "Agen perdagangan kami di [SIK.GetNameDef] menuntut lebih banyak kebijakan untuk meningkatkan ekspor ke [ROOT.GetNameDef], karena perluasan wilayah Sinkiangs telah memberi mereka lebih banyak barang untuk diperdagangkan."
 SOV_sinkiang_support_expansion_rejected_flag: "$SOV_sinkiang_prospection_rejected_flag$"
 SOV_formalize_of_the_soviet_republic_of_sinkiang: "Meresmikan Republik Soviet Sinkiang"
 SOV_formalize_of_the_soviet_republic_of_sinkiang_desc: "Sudah waktunya untuk menuntut integrasi [SIK.GetNameDef] sebagai Republik Sosialis Soviet Independen, yang berada di bawah pemerintahan [FROM.GetNameDef]."
