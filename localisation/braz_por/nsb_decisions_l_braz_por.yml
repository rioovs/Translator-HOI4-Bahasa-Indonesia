 SOV_return_states_to_poland_desc: "Sebagai tanda niat baik, dan untuk menunjukkan siapa yang berkuasa, kita harus mengembalikan seluruh wilayah barat [95.GetCapitalVictoryPointName] yang diklaim oleh [POL.getNameDef] ke rezim boneka [POL.GetAdjective]."
