 SOV_forge_production_reports: "Membuat Laporan Produksi yang Memuaskan"
 SOV_forge_production_reports_desc: "Laporan produksi terbaru kami sedikit mengkhawatirkan. Kita tidak tahu apakah angka yang diharapkan tidak tercapai karena aksi penyabot atau karena penetapan kuota yang tidak realistis. Yang jelas, jika kita ingin menghindari kampanye teror baru yang dilakukan NKVD, sebaiknya kita sesuaikan angka produksinya agar bisa diterima."
