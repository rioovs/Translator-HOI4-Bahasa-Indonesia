 POL_cossack_republic_decisions: "Republik Cossack"
 POL_cossack_republic_decisions_desc: "Selama Perang Saudara Rusia, beberapa negara tuan rumah Cossack independen didirikan, berperang bersama pihak Putih. Dengan semakin banyaknya warga kulit putih di pengasingan yang memasuki wilayah Rusia, kita mempunyai kesempatan untuk menghidupkan kembali republik-republik yang sudah jatuh."
 POL_restore_don_cossacks: "Pulihkan Republik Don"
 POL_restore_don_cossacks_desc: "Penentang keras Bolshevisme, Don Cossack bertempur bersama pihak Putih dalam perang saudara Rusia. Karena seluruh wilayah mereka kini berada di bawah kepemilikan kita, kita bisa mengundang para pengasingan Don untuk memukimkan kembali tanah ini dan berperang bersama rekan-rekan mereka."
 POL_restore_kuban_cossacks: "Pulihkan Republik Kuban"
 POL_restore_kuban_cossacks_desc: "Pengkhianatan terhadap Cossack Kuban merupakan titik balik besar dalam perang saudara Rusia yang menghasilkan kekalahan bagi pihak Putih. Kali ini, kami akan memastikan bahwa rakyat Kuban dipimpin oleh pemerintahan yang tetap loyal."
