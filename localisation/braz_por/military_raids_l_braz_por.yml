 raid_type_INS_militia_increase_activity_raid: "Mencoba Infiltrasi Gerilya"
 raid_type_INS_militia_increase_activity_raid_desc: "Kami akan mengirimkan Milisi ke negara bagian, di mana mereka akan melakukan kontak dengan kaum revolusioner lokal dan membentuk sel gerilya. Jika operasi berjalan lancar, kami akan mencoba menyusup ke wilayah tersebut dan merebut kendali dari Belanda.\n\n§WNegara target harus berada dalam jangkauan §YBunker§! milik Partai Republik, §YRailway§!, atau §YPangkalan Angkatan Laut§!. Bangunan ini dapat digunakan sebagai titik awal.§!\n\n§YEfek:§!\n§RDivisi yang ditugaskan dikeluarkan§!\n§YKeberhasilan:§!\n§WMenjadi pemilik dan pengendali negara\nMeningkatkan eskalasi sebesar §R1§!§!.\n§YKeberhasilan Terbatas:§!\n§WMenambah §Ysatu tingkat§! aktivitas milisi, meningkatkan peluang keberhasilan upaya di masa depan.§!\n§YKegagalan:§!\n§WTidak ada efek§!."
 #Naval
 raid_type_INS_militia_port_raid: "Menempati Pangkalan Angkatan Laut"
 raid_type_INS_militia_port_raid_desc: "Kami akan mengirimkan milisi yang menyamar sebagai nelayan dengan perahu kecil yang diharapkan tidak dapat ditemukan. Mereka akan berusaha membentuk sel gerilya saat mendarat, dan akan bekerja sama dengan gerilyawan lokal untuk menduduki pangkalan angkatan laut jika ada kesempatan. Ini adalah upaya yang sangat beresiko, jika milisi ketahuan, operasi tersebut pasti gagal.\n\n§YEfek:§!\n§RDivisi yang ditugaskan telah dikeluarkan§!\n§YKeberhasilan:§!\n§WMenjadi pemilik dan pengendali negara\nMeningkatkan eskalasi sebesar §R1§!§!.\n§YKeberhasilan Terbatas:§!\n§WMenambah §Ysatu tingkat§! aktivitas milisi, meningkatkan peluang keberhasilan upaya di masa depan.§!\n§YKegagalan:§!\n§WTidak ada efek§!."
 SIA_pacific_island_raid: "Menyerang Pulau Pasifik"
 SIA_pacific_island_raid_desc: "Kami akan menyerang pulau Pasifik dan berusaha untuk merusak bangunan angkatan laut, kapal, dan tentara mereka di sana."
