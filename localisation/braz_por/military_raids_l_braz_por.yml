 operation_huansheng_success_tt: "Pengeboman yang berani berhasil menyebarkan selebaran ke seluruh kota yang ditunjuk. Beberapa selebaran tersebar di atap rumah atau di kawasan hutan, namun sebagian besar dari selebaran tersebut mendarat di kawasan yang mudah diakses dan padat penduduk, dan dengan cepat diambil oleh penduduk setempat."
 operation_huansheng_critical_success_tt: "Pengeboman yang berani berhasil menyebarkan selebaran ke seluruh kota yang ditunjuk. Semuanya mendarat di daerah yang mudah diakses dan padat penduduk, dan dengan cepat dijemput oleh penduduk setempat, menyebarkan berita invasi Jepang ke mana-mana."
