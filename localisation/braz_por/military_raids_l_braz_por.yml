 tooltip_raid_category_air_raids: "§HSerangan Bom Udara§!\nSerangan udara dengan satu sayap udara yang ditujukan untuk menyerang sasaran tertentu."
 tooltip_raid_category_nuclear_raids: "§HSerangan nuklir§!\nSerangan yang dilakukan oleh pesawat pengebom strategis atau rudal balistik yang membawa senjata nuklir."
 tooltip_raid_category_paratrooper_raids: "§HPenggerebekan pasukan terjun payung§!\nSerangan skala kecil yang dilakukan oleh pasukan khusus Paradropping yang berada di belakang garis musuh, untuk melakukan misi sabotase yang berbahaya."
 tooltip_raid_category_naval_commando_raids: "§HSerangan Komando Marinir§!\nSerangan skala kecil yang dilakukan oleh Marinir di wilayah pesisir, menggunakan speedboat kecil dan peralatan serupa untuk melakukan serangan cepat dan kemudian menghilang sebelum musuh sempat bereaksi."
 tooltip_raid_category_land_infiltration_raids: "§HSerangan darat§!\nSerangan skala kecil yang dilakukan oleh pasukan darat di belakang garis musuh, menggunakan taktik sembunyi-sembunyi dan akal-akalan untuk melakukan taktik tabrak lari cepat."
