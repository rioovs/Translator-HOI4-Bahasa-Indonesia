 #raid_type_INS_militia_knil_sabotage_raid: "Raid KNIL Bases"
 #raid_type_INS_militia_knil_sabotage_raid_desc: "A team of Militias will attempt to raid KNIL bases with the goal of converting Indonesian soldiers to the Republican side, gaining manpower and valuable insights into enemy plans."
 #raid_type_INS_militia_knil_supply_raid: "Raid Weapon Depots"
