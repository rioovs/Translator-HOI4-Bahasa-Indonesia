 raid_type_facility_strike: "Serangan Fasilitas"
 raid_type_facility_strike_desc: "Serangan Udara terhadap Fasilitas Eksperimental musuh dengan tujuan menimbulkan kerusakan serius pada fasilitas tersebut, dan proyek apa pun di sana."
 raid_type_lock_bombing_raid: "Kunci Serangan Bom"
 raid_type_lock_bombing_raid_desc: "Pesawat yang dilengkapi dengan bom pantul khusus mencoba menghancurkan kunci tersebut, untuk mencegah lewatnya kanal."
 raid_type_lock_bombing_raid_no_bba: "$raid_type_lock_bombing_raid$"
 raid_type_lock_bombing_raid_no_bba_desc: "$raid_type_lock_bombing_raid_desc$"
 raid_type_dam_bombing_raid: "Serangan Bom Bendungan"
 raid_type_dam_bombing_raid_desc: "Pesawat yang dilengkapi bom pantul khusus mencoba menghancurkan bendungan, mengurangi efektivitasnya, dan mempersulit musuh untuk bergerak di area tersebut."
 raid_type_dam_bombing_raid_no_bba: "$raid_type_dam_bombing_raid$"
 raid_type_dam_bombing_raid_no_bba_desc: "$raid_type_dam_bombing_raid_desc$"
 raid_type_gun_emplacement_raid: "Serangan Penempatan Senjata"
 raid_type_gun_emplacement_raid_desc: "Sekelompok pembom yang dilengkapi dengan bom pengguncang tanah mencoba menghancurkan tempat penempatan $mega_gun_emplacement$"
 raid_type_gun_emplacement_raid_no_bba: "$raid_type_gun_emplacement_raid$"
 raid_type_gun_emplacement_raid_no_bba_desc: "$raid_type_gun_emplacement_raid_desc$"
 raid_type_mega_gun_emplacement_strike: "Serangan Penempatan Mega-Gun"
 raid_type_mega_gun_emplacement_strike_desc: "Serangan terhadap Mega-Gun Emplacement menggunakan Earthshaker Bombs"
 raid_type_mega_gun_emplacement_strike_no_bba: "$raid_type_mega_gun_emplacement_strike$"
 raid_type_mega_gun_emplacement_strike_no_bba_desc: "$raid_type_mega_gun_emplacement_strike_desc$"
 raid_type_oilfield_raid: "Serangan Ladang Minyak"
 raid_type_oilfield_raid_desc: "Serangan Udara yang ditujukan untuk menghancurkan ladang minyak utama dan kilang-kilang yang terhubung dengannya, sehingga dapat mengganggu produksi bahan bakar musuh secara serius dalam jangka waktu yang lama."
 raid_type_nuclear_strike: "Serangan Nuklir"
 raid_type_nuclear_strike_desc: "Seorang pembom strategis dan pengawalnya akan terbang ke sasaran yang ditentukan dan mengerahkan bom atom. Pembom kemudian akan berusaha melarikan diri dari area tersebut untuk menghindari gelombang ledakan."
 raid_type_nuclear_missile_strike: "Serangan Rudal Nuklir"
 raid_type_nuclear_missile_strike_desc: "Rudal jarak jauh akan mengambil lintasan balistik sub-orbital dari lokasi peluncuran yang ditentukan menuju sasaran yang dituju. Pada saat yang tepat, hulu ledak di kapal akan meledakkan ledakan atom."
 raid_type_nuclear_missile_strike_submarine: "Kapal Selam $raid_type_nuclear_missile_strike$"
 raid_type_nuclear_missile_strike_submarine_desc: "$raid_type_nuclear_missile_strike_desc$"
 raid_type_paratrooper_facility_sabotage: "Serangan Sabotase Fasilitas"
 raid_type_paratrooper_facility_sabotage_desc: "Sebuah tim pasukan terjun payung menjatuhkan fasilitas musuh dan mencoba menghancurkan peralatan penting menggunakan muatan tetap, untuk mengganggu kemajuan ilmiah mereka."
 raid_type_mine_sabotage_raid: "Serangan Sabotase Tambang"
 raid_type_mine_sabotage_raid_desc: "Sebuah tim pasukan terjun payung turun ke kompleks ranjau musuh yang besar dan mencoba melancarkan serangan yang akan mengganggu produksi untuk waktu yang lama."
 raid_type_pathfinder_raid: "Serangan Pathfinder"
 raid_type_pathfinder_raid_desc: "Sebuah tim penerjun payung turun di belakang garis musuh untuk bersiap menghadapi invasi yang akan datang dengan menghancurkan jembatan penting, menyiapkan penyergapan, dan secara umum menciptakan gangguan"
 raid_type_commando_port_raid: "Serangan Pelabuhan Laut"
 raid_type_commando_port_raid_desc: "Sekelompok marinir dikirim untuk menghancurkan $naval_base$ yang besar dan dikendalikan musuh. Kapal-kapal di pelabuhan mungkin juga mengalami kerusakan."
 raid_type_commando_facility_raid: "Penggerebekan Fasilitas Kelautan"
 raid_type_commando_facility_raid_desc: "Sekelompok marinir dikirim untuk merusak Fasilitas Eksperimen di provinsi pesisir."
 raid_type_airfield_raid: "Serangan Lapangan Udara"
 raid_type_supply_hub_raid: "Penggerebekan Pusat Pasokan"
 raid_type_rescue_captured_general: "Komandan yang Ditangkap Penyelamatan"
 raid_type_rescue_captured_general_desc: "Sebuah tim tentara menyusup ke belakang garis musuh untuk mencari dan menyelamatkan seorang Komandan yang ditawan oleh musuh."
 raid_type_rescue_captured_general_captive_line: "§Y$NAME$§! ditawan di sini."
 raid_type_demo_dam_raid: "Demo Penyerbuan Pembantaian"
 raid_type_AUS_reichstag_bombing: "Serangan Bom Reichstag"
 raid_type_AUS_reichstag_bombing_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang markas utama musuh, dan tempat simbolis kekuatan Jerman, kita dapat meningkatkan moral rakyat kita, sekaligus memberikan pukulan kepada musuh-musuh kita."
 raid_type_ENG_reichstag_bombing: "Serangan Bom Reichstag"
 raid_type_ENG_reichstag_bombing_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang markas utama musuh, dan tempat simbolis kekuatan Jerman, kita dapat meningkatkan moral rakyat kita, sekaligus memberikan pukulan terhadap moral musuh kita."
 raid_type_GER_eben_emael_raid: "Serangan Eben Emael"
 raid_type_GER_eben_emael_raid_desc: "Detasemen pasukan terjun payung dan pasukan peluncur akan menyerang benteng yang ditempatkan secara strategis dari atas, serta merebut jembatan, jalan, dan rel kereta api utama di area tersebut untuk membuka jalan bagi kekuatan penyerang utama."
 raid_type_GER_big_ben_bombing: "Serangan Bom Big Ben"
 raid_type_GER_statue_of_liberty_bombing: "Serangan Bom Patung Liberty"
 raid_type_GER_kremlin_bombing: "Serangan Bom Kremlin"
 raid_type_ENG_operation_jericho: "Operasi Jericho"
 raid_type_ENG_operation_jericho_desc: "Berdasarkan informasi dari perlawanan Perancis, Jerman menahan sejumlah besar pejuang perlawanan yang ditangkap di Amiens. Dengan mengirimkan satu skuadron pesawat untuk melubangi tembok penjara, kita seharusnya bisa membebaskan sejumlah besar pejuang perlawanan tersebut."
 raid_type_thermonuclear_strike: "Serangan Termonuklir"
 raid_type_thermonuclear_strike_desc: "Seorang pembom strategis dan pengawalnya akan terbang ke sasaran yang ditentukan dan mengerahkan bom termonuklir. Pembom kemudian akan berusaha melarikan diri dari area tersebut untuk menghindari gelombang ledakan."
 raid_type_thermonuclear_missile_strike: "Serangan Rudal Termonuklir"
 raid_type_thermonuclear_missile_strike_desc: "Rudal jarak jauh akan mengambil lintasan balistik sub-orbital dari lokasi peluncuran yang ditentukan menuju sasaran yang dituju. Pada saat yang tepat, hulu ledak di kapal akan meledakkan ledakan termonuklir."
 raid_type_thermonuclear_missile_strike_submarine: "Kapal Selam $raid_type_thermonuclear_missile_strike$"
 raid_type_thermonuclear_missile_strike_submarine_desc: "$raid_type_thermonuclear_missile_strike_desc$"
 raid_type_CHI_huansheng_raid: "Operasi Huansheng"
 raid_type_CHI_huansheng_raid_desc: "Intelijen kami menyatakan bahwa meskipun merupakan target yang berharga, pabrik baja Yawata dan Persenjataan Angkatan Laut Sasebo terlalu sulit untuk diserang dengan baik oleh angkatan udara kami saat ini. Oleh karena itu telah diputuskan bahwa cara paling efektif untuk menghentikan perang ini adalah dengan meningkatkan hati nurani rakyat Jepang terhadap kekejaman yang dilakukan oleh imperialis penghasut perang Jepang di Tiongkok, dengan menyebarkan selebaran di kota-kota seperti Nagasaki, Fukuoka, Saga dan Osaka."
 raid_type_CHI_tokyo_imperial_palace_bombing: "Pengeboman Istana Kekaisaran Tokyo"
 raid_type_CHI_tokyo_imperial_palace_bombing_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang markas utama musuh, dan tempat simbolis kekuasaan kekaisaran Jepang, kita dapat meningkatkan moral rakyat kita, sekaligus memberikan pukulan terhadap moral musuh kita."
 raid_type_CHI_national_diet_bombing: "Bom Diet Nasional"
 raid_type_CHI_national_diet_bombing_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang markas utama musuh, dan tempat simbolis kekuatan Jepang, kita dapat meningkatkan moral rakyat kita, sekaligus memberikan pukulan terhadap moral musuh kita."
 raid_type_CHI_hakko_ichiu_bombing: "Pengeboman Hakko Ichiu"
 raid_type_CHI_hakko_ichiu_bombing_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang simbol imperialisme musuh, kita menunjukkan kelemahan Jepang, sekaligus meningkatkan moral rakyat kita sendiri."
 raid_type_CHI_great_wall_raid_land: "Serangan Infiltrasi Tembok Besar"
 raid_type_CHI_great_wall_raid_land_desc: "Tembok tersebut tidak memiliki nilai pertahanan yang sama seperti dulu, namun masih dapat memberikan keunggulan pada musuh yang sudah mengakar. Dengan mengirimkan sekelompok kecil tentara, kita dapat menyusup ke garis musuh dan meledakkan serangan tepat untuk menggagalkan keunggulan mereka."
 raid_type_JAP_pearl_harbor_strike: "Serangan Pearl Harbor"
 raid_type_JAP_pearl_harbor_strike_desc: "Dengan mengirimkan sekelompok pesawat pengebom untuk menyerang markas dan armada utama angkatan laut musuh di Samudera Pasifik, kita dapat meningkatkan moral rakyat kita, sekaligus memberikan pukulan terhadap moral dan kemampuan angkatan laut musuh kita. Melalui ini, angkatan laut kita akan dapat berkeliaran dengan bebas selama 6 bulan!"
