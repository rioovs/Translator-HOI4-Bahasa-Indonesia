l_braz_por:
 generic.8.t: "Penguasa Atom"
 generic.8.d: "Kita telah berhasil meledakkan senjata nuklir pertama di dunia, menempatkan kita kokoh di garis terdepan perlombaan senjata. Jerih payah raksasa kita telah membuahkan hasil, dan kini seantero jagat tak punya pilihan selain terpana menyaksikan kedahsyatan kekuatan kita. Suatu saat mereka mungkin mampu menyamai kita, namun kita telah memastikan bahwa mereka tak akan pernah mengungguli kita."
 generic.8.a: "Hancurkan musuh-musuh kita hingga menjadi debu!"
 generic.9.t: "Di Bawah Bayang-Bayang Bangsa Lain"
 generic.9.d: "Bangsa lain telah meledakkan senjata nuklir pertama di dunia, merebut kepemimpinan mutlak dalam perlombaan senjata. Terlepas dari segenap daya upaya kita, kita kini terancam tanpa perisai pertahanan maupun sarana pembalasan sepadan. Kalah telak dalam teknologi, kita tak punya pilihan selain melipatgandakan ikhtiar demi menutup jurang ketertinggalan ini sebelum mereka menimpakan kehancuran yang lebih mengerikan ke atas kita."
 generic.9.a: "Program riset harus memperoleh segala sumber daya yang sanggup kita kerahkan."
 generic.10.t: "Sekutu yang Perkasa"
 generic.10.d: "Sekutu kita telah berhasil meledakkan senjata nuklir pertama di dunia, menempatkan aliansi kita kokoh memimpin perlombaan senjata. Kendati kita sendiri kalah cepat, senjata pemungkas tersebut dikuasai oleh sahabat karib kita, menjamin kemampuan membalas seandainya ada musuh yang berniat menyerang dengan atom."
 generic.10.a: "Hasil yang sangat membesarkan hati."
 wtt_denmark.1.t: "Kemerdekaan Islandia"
 wtt_denmark.1.d: "Terputusnya hubungan dengan tanah air pasca-invasi militer telah mendorong Parlemen Islandia (Althing) mengambil alih sendiri urusan luar negeri bangsa mereka. Langkah ini dipahami sebagai tindakan darurat sementara hingga pendudukan atas Denmark berakhir."
 wtt_denmark.1.a: "Semoga keberuntungan menyertai mereka."
 news.331.t: "Islandia Mengambil Alih Urusan Luar Negeri"
 news.331.desc: "Menyusul kapitulasi mitra serikatnya, Denmark, Parlemen Islandia telah mengambil alih kendali penuh atas kebijakan luar negeri mereka sendiri, dan dengan berbuat demikian praktis telah menjadi negara yang merdeka seutuhnya. Gubernur sementara yang baru terpilih telah menyatakan netralitas Islandia dalam konflik yang berkecamuk saat ini, terlepas dari invasi atas negeri induknya."
 news.331.a: "Netralitas terbukti tak mampu menyelamatkan Denmark."
 wtt_britain.24.t: "Usulan MacDonald"
 wtt_britain.24.d: "Perang yang tengah membara memberi tekanan berat terhadap konvoi kapal dagang Inggris. Tetangga timur kita tersebut kian mendambakan penggunaan pangkalan udara dan laut kita, yang mereka harapkan dapat memperluas payung perlindungan bagi rute-rute konvoi mereka. Seorang utusan khusus Inggris bernama Malcolm MacDonald kini telah tiba untuk menawarkan pengembalian Irlandia Utara ke pangkuan kedaulatan Irlandia, dengan imbalan keikutsertaan militer kita seketika dalam kancah perang di pihak Kerajaan Inggris."
 wtt_britain.24.a: "Gagasan yang sangat cemerlang."
 wtt_britain.24.b: "Imbalan itu tak sebanding dengan mahalnya harga perang."
 wtt_britain.25.t: "Inggris Menuntut Penyerahan Armada Prancis"
 wtt_britain.25.d: "Gugus armada perang Inggris telah berlabuh tepat di luar pelabuhan-pelabuhan pangkalan utama kita, dan kita telah menerima ultimatum yang menuntut penyerahan seketika seluruh kapal perang kita. Jika kita tidak melayarkan armada kita ke pelabuhan Inggris saat ini juga, laksamana Inggris mengancam akan melepaskan tembakan meriam!"
 wtt_britain.25.a: "Kita tak memiliki pilihan lain..."
 wtt_britain.25.b: "Pantang bagi kita membiarkan bangsa asing merampas armada kebanggaan kita!"
 wtt_britain.26.t: "Prancis Menyerahkan Armada Perang"
 wtt_britain.26.d: "Mengingat situasi militer yang mustahil dihadapi, para laksamana Prancis dengan berat hati memutuskan untuk memenuhi tuntutan kita. Kapal-kapal mereka kini tengah berlayar menuju pelabuhan kita, di mana mereka akan diintegrasikan ke dalam armada kita demi melanjutkan perjuangan melawan sang penindas."
 wtt_britain.26.a: "Sungguh melegakan akal sehat akhirnya menang."
 wtt_britain.27.t: "Prancis Menolak Menyerahkan Armada"
 wtt_britain.27.d: "Para laksamana Prancis telah menyatakan bahwa mereka pantang menyerahkan kapal perang mereka kepada bangsa asing, dan bahwa mereka siap membalas tembakan seandainya kita berani mendekat. Mengingat keadaan perang saat ini, kita tidak boleh membiarkan kapal-kapal tersebut berisiko jatuh ke tangan musuh."
 wtt_britain.27.a: "Buka tembakan!"
 wtt_britain.27.b: "Kita tidak boleh menumpahkan darah bekas sekutu kita."
 news.332.t: "Prancis Menyerahkan Armada Perang"
 news.332.desc: "Kemarin, unit-unit tempur Angkatan Laut Kerajaan Inggris memblokade kapal-kapal perang Prancis di pangkalan-pangkalan penting Afrika Utara, menyampaikan ultimatum agar armada Prancis segera berlayar ke pelabuhan Inggris dan menyerahkan kendali, atau Inggris akan melepaskan tembakan meriam ke arah mantan sekutu mereka. Berhadapan dengan daya tembak superior, pihak Prancis menerima ultimatum tersebut, dan armada mereka kini berada di bawah komando Inggris."
 news.332.a: "Keputusan yang bijaksana."
 news.332.b: "Beruntung pertumpahan darah dapat dicegah."
 news.332.c: "Lancung sekali mereka berani bertindak demikian?!"
 news.332.d: "Kita tidak memiliki pilihan lain."
 news.332.e: "Mereka akan meneruskan perjuangan di bawah panji Inggris."
 news.333.t: "Serangan Inggris di Mers-el-Kébir"
 news.333.desc: "Kemarin, armada Angkatan Laut Kerajaan Inggris memblokade rekan-rekan Prancis mereka di pangkalan laut utama Afrika Utara, mengeluarkan ultimatum agar kapal-kapal Prancis segera berlayar ke pelabuhan Inggris dan menyerahkan diri, atau pihak Inggris akan menembaki mantan sekutu mereka. Menyusul penolakan tegas Prancis atas tuntutan tersebut, baku tembak meriam pun meletus yang menenggelamkan setidaknya satu kapal tempur Prancis serta meluluhlantakkan sebagian besar armada Prancis."
 news.333.a: "Kita telah melakukan apa yang wajib dilakukan."
 news.333.b: "Ini adalah kebiadaban yang tak termaafkan!"
 news.333.c: "Kita mungkin telah meremehkan tekad mereka."
 news.333.d: "Pengkhianatan keji ini tak akan pernah kami lupakan!"
 news.333.e: "Mereka telah membuktikan keteguhan hati mereka."
 wtt_britain.28.t: "Irlandia Menerima Usulan MacDonald"
 wtt_britain.28.d: "Pemerintah Irlandia telah menerima usulan kita, dan telah bergabung dalam perjuangan kita dengan imbalan penyerahan Irlandia Utara."
 wtt_britain.29.t: "Irlandia Menolak Usulan MacDonald"
 wtt_britain.29.d: "Pemerintah Irlandia telah menolak usulan kita, enggan bergabung dalam perjuangan membela Demokrasi."
 wtt_britain.29.a: "Siapa yang akan menolong mereka saat tentara Jerman datang menerjang?"
 wtt_britain.30.t: "Pengiriman Senjata Darurat Amerika"
 wtt_britain.30.d: "Pemerintah Amerika Serikat, dengan sokongan mulia dari Komite Amerika untuk Pertahanan Rumah-Rumah Inggris, telah mengapalkan kiriman darurat berupa senapan tua, perlengkapan tempur, dan sejumlah meriam artileri. Jenisnya memang terlampau beragam untuk berguna secara optimal bagi tentara reguler kita, namun persenjataan ini niscaya sangat membantu melengkapi garnisun Home Guard yang dibentuk secara tergesa-gesa."
 wtt_britain.30.a: "Mereka telah menyelamatkan kita dari ancaman invasi!"
 wtt_germany.1.t: "Perwira Wehrmacht Menentang Hitler"
 wtt_germany.1.d: "Keresahan terpendam terhadap kediktatoran Hitler telah mencapai puncaknya menyusul krisis akibat langkah pemerintahannya memiliterisasi kembali Rhineland. Sejumlah jenderal Wehrmacht telah bersatu di bawah komando Marsekal Lapangan legendaris August von Mackensen, yang menggerakkan rencana untuk menggulingkan Hitler dan membersihkan Partai Nazi dari Jerman.\n\nDengan terbelahnya komando tinggi militer Jerman yang tampak gamblang bahkan dari luar negeri, kekuatan-kekuatan asing memilih untuk tidak melayangkan protes atas remiliterisasi tersebut karena lebih mencemaskan instabilitas di dalam negeri Jerman. Sang Marsekal sepuh bergerak kilat, segera mendirikan pemerintahan militer sementara, di mana ribuan rakyat berbondong-bondong merapat demi menentang tirani Nazi.\n\nKudeta militer kini tengah berkobar dengan hebat."
 wtt_germany.1.a: "Basmi cecunguk Nazi ini dari tanah air kita!"
 wtt_germany.2.t: "Kaum Ekspatriat Jerman Bergabung dalam Perjuangan"
 wtt_germany.2.d: "Menyusul perlakuan kejam dan pengasingan paksa di tanah air mereka belakangan ini, banyak kawan senegara Jerman yang terusir kini berduyun-duyun merapat ke barisan kita. Berbekal kepemimpinan yang cakap, kita berhasil membentuk sejumlah divisi tempur dari para rekrutan bersemangat ini, dan kini mereka siap bertarung menumpas musuh-musuh kita!"
 wtt_germany.3.t: "Jerman Mencabut Status Pengasingan Wilhelm II"
 wtt_germany.3.d: "Jerman telah mengundang Wilhelm II untuk kembali ke tanah airnya sebagai Kaisar. Di tengah berbagai peristiwa penuh gejolak belakangan ini, langkah ini mungkin dapat membantu bangsa Jerman memulihkan perdamaian dan stabilitas nasional. Namun, mata dunia kini tertuju pada kita, sebab banyak pihak belum melupakan konflik dahsyat yang disulut oleh sang Kaiser tua hanya dua dekade silam."
 wtt_germany.3.a: "Kita harus mengizinkannya pulang demi memimpin rakyatnya."
 wtt_germany.3.b: "Kita harus menghentikannya — kita tak boleh mengambil risiko pecahnya Perang Besar lagi."
 wtt_germany.4.t: "Sang Kaiser Kembali ke Jerman"
 wtt_germany.4.d: "Di tengah sorak-sorai perayaan yang membahana, Wilhelm II telah kembali bertahta sebagai Kaiser Kekaisaran Jerman! Belanda berhak menerima rasa terima kasih yang mendalam karena telah memberinya suaka perlindungan selama puluhan tahun ini, serta menolak permintaan ekstradisinya dari para mantan musuh kita dalam berbagai kesempatan. Kendati bangsa kita telah menderita hebat dalam perang saudara baru-baru ini, kepulangan sang Kaiser diharapkan mampu membawa stabilitas dan persatuan yang kian kokoh."
 wtt_germany.4.a: "Beliau tanpa ragu akan memimpin bangsa ini menuju kejayaan."
 wtt_germany.5.t: "Belanda Mencegah Kepulangan Sang Kaiser"
 wtt_germany.5.d: "Pihak Belanda yang pengecut, setelah sekian lama dengan mulia memberi suaka kepada Wilhelm II, kini justru menghadang kepulangan sang Kaiser melintasi perbatasan menuju Jerman, dan telah mengawalnya kembali ke kediamannya di Huis Doorn. Pihak Belanda berdalih bahwa kekhawatiran atas stabilitas benua Eropa menjadi alasan penolakan mereka atas pemulihan takhta sang Kaiser di Jerman."
 wtt_germany.5.a: "Kita akan memberi mereka kekhawatiran yang jauh lebih nyata!"
 wtt_germany.5.b: "Mungkin ada benarnya juga... Kita masih memiliki calon pewaris lainnya."
 wtt_germany.5_tt: "Sang Kaiser tua mungkin masih sanggup membimbing putranya dalam memerintah.\n"
 wtt_germany.6.t: "Wilhelm II Dibebaskan"
 wtt_germany.6.d: "Pasukan tempur kita, setelah membersihkan kawasan sekitar Huis Doorn dari tentara Belanda, mendapati sang Kaiser dalam kondisi sehat walafiat dan memulangkannya ke Jerman dalam iring-iringan konvoi lapis baja. Wilhelm II melintasi perbatasan dengan penuh kemenangan beberapa jam yang lalu, dan dengan khidmat menerima kembali amanah sebagai Kaiser Kekaisaran Jerman setibanya di Berlin."
 wtt_germany.6.a: "Tak satu pun yang sanggup menghentikan langkah kita."
 GER_fascism_civil_war_tt: "Para pendukung kaum fasis mengobarkan perang saudara.\n"
 wtt_germany.7.t: "Ketergantungan Ekonomi Tanpa Kendali pada [From.GetName]"
 wtt_germany.7.d: "Seiring pusaran pengaruh [From.GetNameDef] yang kian mencengkeram, perekonomian kita menjadi kian bergantung pada kehendak sekutu kita tersebut. Ketika hari ini pihak Jerman akhirnya bergerak mengambil alih kendali lebih jauh atas perekonomian kita, kita sama sekali tak berdaya membendungnya. Akibatnya, kendali Jerman atas kebijakan luar negeri kita telah mencapai tingkat yang belum pernah terjadi sebelumnya."
 wtt_germany.7.a: "Kita harus menerima kenyataan pahit ini... Untuk saat ini."
 wtt_germany.8.t: "Jerman Menawarkan Dukungan bagi Kudeta Monarkis"
 wtt_germany.8.d: "[From.GetNameDefCap] telah mendekati unsur-unsur pro-monarki dan anti-fasis di dalam pemerintahan dan gerakan bawah tanah Italia dengan rencana pembunuhan Mussolini serta pengangkatan Raja Vittorio Emanuele III sebagai pemimpin tunggal bangsa. Pihak Jerman meyakinkan kita bahwa mereka sanggup membereskan eksekusi pembunuhan tersebut; yang perlu kita lakukan hanyalah menegaskan kesediaan kita membentuk pemerintahan pengganti serta mengikrarkan dukungan militer di masa depan bagi kepentingan Jerman."
 wtt_germany.8.a: "Kita harus berpaling kepada Takhta Kerajaan di masa genting mendatang."
 wtt_germany.8.b: "Keterlaluan! Kami pantang mengkhianati jalan hidup kami!"
 wtt_germany.9.t: "Pihak Italia Menyetujui Rencana Kudeta"
 wtt_germany.9.d: "Unsur-unsur dalam pemerintahan dan gerakan bawah tanah Italia telah menyetujui usulan kudeta kita. Mereka tengah merampungkan persiapan untuk perebutan kekuasaan kilat demi Sang Raja, segera setelah eksekusi pembunuhan dituntaskan."
 wtt_germany.9.a: "Kita dapat menggerakkan rencana agung kita."
 wtt_germany.10.t: "Pihak Italia Menolak Rencana Kudeta"
 wtt_germany.10.d: "Unsur-unsur dalam pemerintahan dan bawah tanah Italia yang kita hubungi telah menegaskan dengan nada keras bahwa mereka sama sekali tidak berminat pada rencana kudeta kita. Mereka bahkan mengancam akan membocorkan rencana rahasia ini kepada rezim Mussolini jika kita berani mengulang tawaran serupa."
 wtt_germany.10.a: "Sungguh sangat disayangkan."
 wtt_germany.11.t: "Pembunuhan Mussolini oleh Operasi Jerman"
 wtt_germany.11.d: "Rencana rahasia Jerman telah dilancarkan dan Mussolini tewas tertembak di dalam mobilnya di jalanan kota Roma hari ini. Raja Vittorio Emanuele III telah mengambil alih kendali kepemimpinan bangsa, dan telah bersumpah untuk bergabung ke dalam Blok Poros Tengah bersama [From.GetNameDef]."
 wtt_germany.11.a: "Kita harus menyatakan rasa terima kasih kita yang mendalam."
 wtt_germany.12.t: "Pembunuhan Mussolini Berhasil Gemilang"
 wtt_germany.12.d: "Rencana operasi kita telah terlaksana tanpa cela, dan Vittorio Emanuele III telah menyandang tampuk kepemimpinan tertinggi bangsanya. Tindakan perdana beliau adalah menandatangani pakta persekutuan yang memastikan bergabungnya Italia ke dalam aliansi Blok Kekuatan Tengah."
 wtt_germany.12.a: "Kekuatan monarki akan bangkit kembali!"
 wtt_germany.13.t: "Penyatuan Kembali Austria-Hungaria"
 wtt_germany.13.d: "Berkat dukungan penuh kita, [From.GetOldName] telah memimpin jalan menuju restorasi Kekaisaran Austria-Hungaria. Perjanjian bersejarah antara pihak-pihak terkait telah ditandatangani pagi ini, mengubur sentimen separatisme yang berlangsung selama dua dekade. Pemerintahan serikat baru tersebut seketika mengikrarkan dukungan militer penuh bagi perjuangan kita, resmi menjadi anggota Blok Kekuatan Tengah."
 wtt_germany.13.a: "Sekutu lama kita telah kembali berdiri tegak di sisi kita."
 wtt_germany.14.t: "Jerman Menawarkan Jaminan demi Wilayah"
 wtt_germany.14.d: "[From.GetNameDefCap] telah mendatangi kita dengan sebuah tawaran yang mereka yakini menguntungkan kedua belah pihak. Mengingat memanasnya situasi geopolitik dan ancaman nyata di perbatasan timur kita, pihak Jerman mengusulkan jaminan perlindungan militer penuh seandainya kita terseret perang melawan [SOV.GetNameDef]. Sebagai imbalannya, mereka hanya meminta pengembalian bekas wilayah mereka yang hilang, yaitu Danzig dan Poznan."
 wtt_germany.14.a: "Kekuatan militer mereka jauh lebih berharga bagi kita daripada sepetak tanah."
 wtt_germany.14.b: "Pantang bagi kami menyerahkan sejengkal pun tanah air kami!"
 wtt_germany.15.t: "Polandia Menerima Tawaran"
 wtt_germany.15.d: "Pihak Polandia telah memutuskan untuk menerima tawaran kita, dan tengah mengatur penyerahan provinsi-provinsi perbatasan tersebut kepada kita. Mereka telah menaruh kepercayaan besar pada kita, dan memohon agar kita bersiap siaga menghadapi potensi agresi [SOV.GetAdjective].."
 wtt_germany.15.a: "Noda kehinaan Versailles akhirnya terhapuskan!"
 wtt_germany.16.t: "Polandia Menolak Tawaran"
 wtt_germany.16.d: "Pihak Polandia memutuskan untuk menolak mentah-mentah tawaran kita. Dengan pernyataan yang keras, mereka menegaskan pantang menyerahkan wilayah mereka secara sukarela, dan lebih memilih menghadapi musuh mana pun seorang diri jika penyerahan tanah adalah harga dari bantuan tersebut."
 wtt_germany.16.a: "Kami tidak akan pernah melepaskan klaim historis kami!"
 wtt_germany.16.b: "Mungkin kita memang harus berlapang dada menerimanya."
 wtt_germany.17.t: "Komunis Jerman Melarikan Diri ke Prancis"
 wtt_germany.17.d: "Pemerintah Jerman telah melancarkan pembersihan besar-besaran terhadap komunisme dan mengusir para pengikutnya ke luar negeri. Akibatnya, kini kita menerima gelombang besar eksodus para ideolog komunis yang membanjiri wilayah perbatasan kita..."
 wtt_germany.17.a: "Semoga saja hal ini tidak terlalu mengguncang stabilitas negeri..."
 wtt_germany.17.b: "Tingkatkan anggaran kepolisian dan batasi pengaruh politik mereka!"
 wtt_germany.18.t: "Petinggi Rezim Nazi Berhasil Ditangkap"
 wtt_germany.18.d: "Akhirnya kita berhasil membebaskan tanah air kita dari cengkeraman tiran, dan segenap rakyat setia yang bangkit menyokong perjuangan kita kini dapat pulang kembali ke sanak saudara mereka. Sebagai satu bangsa, kita dapat memulai proses panjang dan berat membangun kembali tanah air. Para pemimpin bangsa kini bebas merancang masa depan: menegakkan demokrasi sejati, atau kembali memulihkan mahkota monarki lama.\n\nNamun ada satu urusan terakhir yang harus dibereskan. Dengan berakhirnya perang saudara, pasukan kita berhasil meringkus sebagian besar dedengkot kepemimpinan Nazi. Kini tinggal keputusan apa yang akan kita jatuhkan atas bagian kelam sejarah bangsa ini."
 wtt_germany.18.a: "Gantung mereka di tiang gantungan!"
 wtt_germany.18.b: "Penjarakan mereka seumur hidup, mereka mungkin masih berguna di masa depan."
 wtt_germany.19.t: "[GER.GetName] Mengecam Keras [SOV.GetName]"
 wtt_germany.19.d: "Retorika permusuhan terbaru dari Jerman yang ditujukan kepada kita kian merusak martabat dan reputasi kita di mata Eropa. Tuduhan-tuduhan keji atas apa yang mereka sebut sebagai 'agresi' kita mulai menebarkan ketakutan serta salah paham atas niat damai kita."
 wtt_germany.19.a: "Gelar serangkaian latihan militer raksasa untuk menggertak mereka semua!"
 GER_soviet_military_exercises: "Latihan Militer Akbar"
 wtt_germany.19.b: "Kita harus memulihkan reputasi kita dan meredakan ketegangan diplomatik."
 GER_soviet_smoothes_relationships: "Hubungan Diplomatik yang Diredakan"
 wtt_germany.19.c: "Apakah mereka kira kita peduli dengan ocehan mereka?"
 wtt_germany.20.t: "Jerman Membentuk Aliansi Eropa Tengah"
 wtt_germany.20.d: "Melanjutkan kampanye permusuhan mereka terhadap kita, pihak Jerman kini mengumumkan pembentukan aliansi militer baru. Tak pelak lagi, pakta ini ditujukan untuk memusuhi kita dan mencampuri zona pengaruh kedaulatan kita."
 wtt_germany.20.a: "Lebih baik mereka angkat kaki dari zona pengaruh kita!"
 GER_soviet_reiterated_claims: "Penegasan Kembali Klaim Wilayah"
 wtt_germany.20.b: "Kita tidak boleh memberi mereka dalih apa pun untuk memicu eskalasi lebih jauh."
 wtt_germany.21.t: "Jerman Mengundang Negara-Negara Baltik"
 wtt_germany.22.t: "Jerman Mengundang Polandia"
 wtt_germany.23.t: "Jerman Mengundang Finlandia"
 wtt_germany.21.d: "Pihak Jerman telah menawarkan keanggotaan aliansi kepada negara yang berada tepat di zona pengaruh langsung kita. Ancaman nyata terhadap Ibu Pertiwi terpampang jelas di depan mata!"
 wtt_germany.21.a: "Kita harus menyerang demi mengamankan wilayah yang tersisa!"
 GER_soviet_securing_sphere: "Mengamankan Zona Pengaruh"
 wtt_germany.21.b: "Kita tidak mampu menanggung risiko bermusuhan dengan Blok Barat."
 wtt_germany.24.t: "Ancaman Akbar [GER.GetGreatRedMenaceName]"
 wtt_germany.24.d: "Melalui saluran diplomatik resmi maupun bawah tanah, pihak Jerman telah menegaskan bahwa [GER.GetGreatRedMenaceEventDesc1]. Mereka menyerukan kepada kita untuk mengingat bahwa kita tidak sendirian dalam menghadapi [GER.GetGreatRedMenaceEventDesc2], dan bahwa asalkan benua ini bersatu, kita sanggup menumbangkan sang Beruang Merah."
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_COMMUNIST: "[SOV.GetNameDef] adalah, dan senantiasa menjadi, ancaman terbesar bagi stabilitas perdamaian Eropa sejak kelahirannya dua dekade silam"
 SOV_GREAT_RED_MENACE_EVENT_DESC_1_EXILES: "imperialisme [SOV.GetAdjective] adalah, dan senantiasa menjadi, ancaman utama bagi stabilitas perdamaian Eropa di sepanjang sejarah modern"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_COMMUNIST: "bahaya laten komunisme"
 SOV_GREAT_RED_MENACE_EVENT_DESC_2_EXILES: "ancaman mematikan dari Timur ini"
 wtt_germany.24.a: "Semoga perkiraan mereka tepat."
 wtt_germany.24.b: "Jangan pernah mempercayai kata-kata bangsa [GER.GetAdjective]!"
 wtt_germany.25.t: "Uni Soviet Meredakan Hubungan"
 wtt_germany.25.d: "Uni Soviet telah mengerahkan ikhtiar nyata demi menenangkan kekhawatiran bangsa-bangsa Eropa. Melalui maklumat resmi, mereka menegaskan tidak memendam niat bermusuhan apa pun, dan berharap sikap menahan diri mereka di hadapan provokasi retorika perang Jerman dapat menjadi bukti iktikad baik mereka."
 wtt_germany.25.a: "Hal itu masih harus kita buktikan."
 wtt_germany.26.t: "Wilhelm II Wafat"
 wtt_germany.26.d: "Tadi malam Wilhelm II, Kaisar kita yang terkasih, telah berpulang ke haribaan Tuhan dengan damai dalam tidurnya. Terlepas dari pengasingan panjang yang dideritanya, takdir telah berkenan mengizinkan kepulangannya ke tanah air jauh sebelum wafatnya, dan sejak kepulangannya beliau telah memimpin bangsa kita dengan penuh kearifan. Putra beliau, Friedrich Wilhelm, kini memegang tampuk kepemimpinan bangsa, dan seusai upacara penobatannya kelak akan dikenal abadi sebagai Wilhelm III."
 wtt_germany.26.a: "Hidup sang Kaiser!"
 wtt_germany.27.t: "August Von Mackensen Wafat"
 wtt_germany.27.d: "Tadi malam August von Mackensen, marsekal lapangan kita yang paling dihormati, telah menghembuskan napas terakhir dengan damai dalam tidurnya. Jasa-jasa kepahlawanannya dalam Perang Besar serta keberaniannya menumbangkan sang penindas fasis dari tanah air akan senantiasa terpatri di sanubari rakyat. Putra sang Kaiser yang diasingkan, Friedrich Wilhelm, telah mengisi kekosongan kepemimpinan bangsa, dan setelah penobatannya kelak akan dikenal sebagai Wilhelm III, memerintah Kekaisaran sebagai Kaiser pertama sejak turun takhtanya sang ayahanda pada tahun 1918."
 wtt_germany.28.t: "Jerman Mencabut Status Pengasingan Wilhelm II"
 wtt_germany.28.d: "Kekaisaran Jerman telah mencabut status pengasingan Wilhelm II, dan kini telah mengajukan permohonan resmi kepada Belanda demi kepulangan sang Kaiser tua. Tampaknya, terlepas dari berbagai desakan ekstradisi kepada pemerintah Belanda demi menuntut pertanggungjawaban beliau atas pecahnya Perang Besar, sang pembakar perang tersebut akan kembali memegang kendali Kekaisaran Jerman."
 wtt_germany.28.d.2: "Kekaisaran Jerman telah mencabut status pengasingan Wilhelm II, dan kini telah mengajukan permohonan resmi kepada Belanda demi kepulangan sang Kaiser tua. Menyusul penolakan tegas Belanda untuk mengizinkan kepulangannya, pihak Jerman kini meningkatkan perselisihan ini menjadi konflik militer terbuka!"
 germany.60.c: "Mereka tak boleh dibiarkan berjuang sendirian! Kobarkan Inggris untuk berperang!"
 wtt_germany.29.d: "Kekaisaran Jerman telah mencabut status pengasingan Wilhelm II, dan kini telah mendatangi pemerintah Belanda demi kepulangan sang Kaiser tua. Tampaknya, terlepas dari berbagai desakan ekstradisi kepada Belanda untuk menuntut pertanggungjawabannya atas Perang Besar, sang penyulut perang tersebut akan kembali berkuasa.\n\nPihak Prancis telah menegaskan bahwa langkah ini sama sekali tidak dapat ditoleransi, dan bersiap melayangkan ultimatum yang disokong kekuatan militer. Suara publik di Inggris memang menentang perang, namun jika kita enggan mendampingi Prancis, aliansi kita dengan mereka akan bubar seketika."
 wtt_germany.29.d.2: "Kekaisaran Jerman telah mencabut status pengasingan Wilhelm II, dan kini telah mendatangi pemerintah Belanda demi kepulangan sang Kaiser tua. Menyusul penolakan Belanda, pihak Jerman kini mengeskalasikan krisis ini menjadi konflik bersenjata!\n\nPihak Prancis telah menegaskan bahwa langkah ini sama sekali tidak dapat diterima, dan bersiap melayangkan ultimatum yang disokong kekuatan militer. Suara publik di Inggris memang menentang perang, namun jika kita menolak berdiri bersama Prancis, aliansi kita dengan mereka akan bubar seketika."
 germany.61.c: "Kita harus segera datang menolong bangsa Belanda!"
 wtt_germany.30.d: "Kekaisaran Jerman telah mencabut status pengasingan Wilhelm II, dan kini telah mendatangi pihak Belanda demi memulangkan sang Kaiser tua. Tampaknya, terlepas dari berbagai tuntutan ekstradisi terhadap Belanda untuk menuntutnya atas Perang Besar, sang tiran akan kembali bertahta atas Kekaisaran Jerman.\n\nPihak Prancis tampaknya puas membatasi tanggapan atas penghinaan ini sebatas nota keberatan diplomatik, sementara opini publik di Inggris berdiri teguh menentang perang."
 wtt_germany.31.d: "Pihak Inggris menolak mendukung langkah kita melawan Jerman, berdalih bahwa persoalan monarki Jerman adalah urusan domestik mereka. Jika kita mengangkat senjata melawan Jerman, tampaknya kita harus berjuang seorang diri.\n\nOpini publik di Prancis sendiri menentang perang, namun Jerman hanya akan tumbuh kian perkasa, dan kembalinya sang Kaiser niscaya akan membangkitkan kembali nafsu imperialis mereka. Melayangkan ultimatum militer tanpa sokongan Inggris di sisi kita tentu jauh lebih berisiko. Haruskah kita tetap maju melawan mereka sendirian?"
 wtt_germany.32.d: "Kendati dukungan rakyat untuk berperang sangat minim di Inggris, pemerintah Inggris telah menyadari bahaya maut yang ditebarkan Jerman dan telah menawarkan dukungan militer penuh kepada kita. Kita akan melayangkan ultimatum terakhir kepada Jerman guna mencegah kembalinya sang Kaiser pemicu perang. Jika mereka menolak, tiba saatnya bagi pasukan kita merangsek masuk ke jantung Jerman dan menumpas tuntas rezim tiran mereka!"
 wtt_germany.33.d: "Inggris dan Prancis menolak keras kepulangan Kaiser kita, mencapnya sebagai 'penghinaan keji' bahwa sosok yang dianggap biang keladi Perang Besar diizinkan kembali ke singgasananya. Mereka tengah memobilisasi pasukan tempur melawan kita dan telah mengeluarkan ultimatum agar pasukan kita segera mundur serta mengembalikan sang Kaiser ke pengasingan, atau perang terbuka akan meletus di antara bangsa kita."
 wtt_germany.33.a: "Kita pantang mundur! Hidup sang Kaiser!"
 wtt_germany.34.d: "Pihak Inggris telah bersikap rasional dan menerima kepulangan sang Kaiser, namun pihak Prancis yang keras kepala menolak berkompromi! Berdalih bahwa peristiwa ini mengancam langsung keamanan nasional mereka, Prancis memobilisasi kekuatan militernya dan dapat menerobos perbatasan setiap saat! Perang telah meletus!"
 wtt_germany.35.d: "Kendati kami telah memperingatkan secara tegas bahwa kembalinya Wilhelm II ke singgasana Jerman akan dipandang sebagai pernyataan perang, pihak Jerman menolak mundur dan enggan mengembalikan Kaiser mereka ke pengasingan, mengabaikan peringatan kami. Ini berarti, terlepas dari segala ikhtiar kami memelihara perdamaian, perang kembali berkobar di Eropa."
 wtt_germany.38.t: "Bangsa [FROM.GetAdjective] Menuntut Pengembalian Qingdao"
 wtt_germany.38.desc: "[FROM.GetNameDefCap] kian gencar melontarkan retorika belakangan ini, mendesak kembalinya era kolonialisme. Melalui saluran diplomatik resmi, mereka kini melayangkan tuntutan formal untuk membuka kembali konsesi lama mereka di Qingdao, dengan harapan memulihkan imperium seberang lautan mereka yang telah lama sirna. Kendati ini berpotensi menjadi perjanjian tak adil baru di era penghinaan kita, barangkali kita dapat memanfaatkan momentum ini demi mencapai kesepakatan yang menguntungkan..."
 wtt_germany.38.a: "Tuntut kelanjutan dukungan militer Von Falkenhausen sebagai imbalannya."
 wtt_germany.38.b: "Mungkin keberadaan armada mereka di kawasan ini akan berguna bagi kita."
 wtt_germany.38.c: "Kami tidak akan pernah lagi menyerahkan sejengkal pun kedaulatan tanah air kami!"
 wtt_germany.39.t: "Tiongkok Menawarkan Kesepakatan Qingdao"
 wtt_germany.39.desc: "Para pejabat Tiongkok telah menghubungi kita dengan tawaran pertukaran diplomatik yang mereka klaim menguntungkan kedua belah pihak. Mereka mengusulkan pengembalian Qingdao ke tangan Jerman, dengan imbalan jaminan resmi bahwa kita tidak akan menarik pulang misi militer Von Falkenhausen."
 wtt_germany.39.a: "Kita dapat menyepakati tawaran tersebut."
 wtt_germany.39.b: "Tidak, kita harus menjaga opsi strategis kita tetap terbuka."
 wtt_germany.40.t: "[From.GetNameDefCap] Menolak Tuntutan atas Qingdao"
 wtt_germany.40.desc: "[From.GetNameDefCap] menolak mentah-mentah tuntutan kita atas pengembalian Qingdao. Kita tidak punya pilihan selain menuntutnya kembali di masa mendatang."
 wtt_germany.40.a: "Kita harus bersabar."
 wtt_germany.41.t: "Jerman Menerima Kesepakatan Qingdao"
 wtt_germany.41.desc: "Kekaisaran Jerman telah menerima usulan pertukaran wilayah Qingdao dari kita. Mereka telah menjamin kelanjutan dukungan misi militer Von Falkenhausen bagi pasukan kita."
 wtt_germany.42.t: "Jerman Menolak Kesepakatan Qingdao"
 wtt_germany.42.desc: "Kekaisaran Jerman menolak usulan pertukaran wilayah Qingdao. Tampaknya mereka tidak terlalu bernafsu merebut kembali enklaf lama mereka."
 wtt_germany.43.t: "Jerman Menuntut Pengembalian Qingdao"
 wtt_germany.43.desc: "Kekaisaran Jerman kian gencar melontarkan seruan kembali ke era imperialisme kolonial. Terlepas dari kenyataan bahwa mereka kehilangan Qingdao akibat perebutan militer kita pada tahun 1914, pihak Jerman kini memutuskan membuka perundingan diplomatik untuk menuntut pengembalian enklaf lama mereka tersebut. Mungkin kita dapat memanfaatkan situasi ini demi memeras keuntungan..."
 wtt_germany.43.a: "Tuntut agar Jerman menarik mundur Von Falkenhausen sebagai imbalannya."
 wtt_germany.43.b: "Mereka pantang menginjakkan kaki lagi di Timur Jauh!"
 wtt_germany.44.t: "Jepang Menawarkan Kesepakatan Qingdao"
 wtt_germany.44.desc: "Para diplomat Jepang telah mendatangi kita dengan usulan kerja sama yang menguntungkan kedua belah pihak. Mereka menawarkan pengembalian Qingdao ke tangan sah Jerman, dengan syarat kita segera menarik pulang seluruh misi penasihat militer Von Falkenhausen dari Tiongkok."
 wtt_germany.46.desc: "Kekaisaran Jerman telah menyetujui usulan pertukaran wilayah Qingdao. Mereka seketika menarik pulang misi penasihat militer Von Falkenhausen dari Tiongkok."
 wtt_germany.48.t: "[From.GetNameDefCap] Menerima Tuntutan"
 wtt_germany.48.desc: "[From.GetNameDefCap] telah menerima tuntutan kita, dan segera mengatur penyerahan wilayah Qingdao kembali ke pangkuan Jerman!"
 wtt_germany.49.t: "Pengusiran Kaum Nazi Membawa Kehancuran di [nazi_state_withdrawn.GetName]"
 wtt_germany.49.desc: "Kita akhirnya berhasil mengamankan kendali atas [nazi_state_withdrawn.GetName], namun pertempuran berlangsung amat sengit. Kaum Nazi kian fanatik dan membabi buta seiring gerak maju kita, sering kali bertempur hingga meluluhlantakkan wilayah sekitarnya menjadi puing-puing. Muncul pula laporan mengenai penerapan taktik bumi hangus sesuai instruksi 'Nerobefehl' dari Hitler.\n\nKita niscaya harus bersiap menghadapi kehancuran serupa hingga perang saudara ini tuntas."
 wtt_germany.49.a: "Harga kecil demi membersihkan Tanah Air dari kebiadaban mereka."
 wtt_germany.50.t: "Hitler Ditemukan Tewas"
 wtt_germany.50.desc: "Menyusul jatuhnya Berlin, pasukan kita menemukan jenazah Hitler di dalam bunker bawah tanah kota. Lebih memilih mati daripada menyaksikan unsur-unsur anti-fasis menguasai negara, sang diktator jelas-jelas mengakhiri hidupnya sendiri demi menghindari penangkapan hidup-hidup.\n\nSebagai gantinya, Heinrich Himmler kini tampil memimpin sisa-sisa kaum Nazi, dan ia telah bersumpah bahwa pemerintahannya pantang mengendurkan perlawanan terhadap 'pengkhianatan anti-Jerman'."
 wtt_germany.50.a: "Inilah fajar keruntuhan total bagi kaum Nazi."
 wtt_germany.51.t: "Pulihkan Hak Dinas Para Petinggi Nazi yang Ditangkap?"
 wtt_germany.51.desc: "Perang saudara telah berlangsung sedemikian berlarut-larut dan merusak sehingga kini seluruh warga dewasa Jerman dipanggil untuk mengangkat senjata. Kendati ideologi mereka bertentangan dengan prinsip kita, para petinggi Nazi yang kita tawan memiliki keahlian militer dan administratif yang dapat berguna di masa krisis ini.\n\nKita dapat menawarkan kebebasan pasca-perang kepada mereka, sebagai imbalan atas pengabdian keahlian mereka bagi perjuangan kita saat ini."
 wtt_germany.51.a: "Ya, pulihkan sebagian hak dinas kepemimpinan Nazi."
 reinstate_nazi_leadership_TT: "Penasihat khusus fasis kini kembali memenuhi syarat untuk bertugas.\n"
 wtt_germany.51.b: "Tidak, biarkan mereka tetap membusuk di dalam sel."
 wtt_germany.51.c: "Kita tak boleh membiarkan mereka bebas jika situasi perang memburuk... Gantung mereka semua!"
 wtt_germany.52.t: "Perang Saudara Demokratik di [From.From.GetName]"
 wtt_germany.52.desc: "Unsur-unsur demokratik di [From.From.GetName] telah mengobarkan perang saudara demi menegakkan kembali pemilu bebas dan mengembalikan kedaulatan ke tangan rakyat. Mereka tentu memerlukan bantuan kita, dan keberhasilan mereka akan menjamin hadirnya sekutu baru bagi perjuangan kita."
 wtt_germany.52.a: "Kita akan berdiri membela panji demokrasi!"
 wtt_germany.52.b: "Mereka harus menyelesaikan persoalan mereka sendiri."
 wtt_germany.53.t: "Sentimen Pro-Jerman di Austria Meroket"
 wtt_germany.53.desc: "Sentimen persaudaraan Jerman di negeri tetangga selatan kita, Austria, telah melonjak drastis setelah sekian lama kita bersekutu erat. Sangatlah terbuka kemungkinan bahwa referendum unifikasi dengan Jerman akan disambut gembira oleh rakyat Austria. Haruskah kita mendesak pemerintah Austria menyelenggarakannya?"
 wtt_germany.53.a: "Ya, solusi Jerman Kecil (Kleindeutschland) di masa lampau adalah kekeliruan sejarah."
 wtt_germany.53.b: "Tidak, solusi Jerman Raya (Großdeutschland) justru akan menjadi bencana."
 wtt_germany.54.t: "Pemerintah Jerman Mendesak Referendum Unifikasi"
 wtt_germany.54.desc: "Pemerintah Jerman telah mendatangi kita dengan usulan penyatuan bangsa, seandainya rakyat Austria menghendakinya. Mereka mendesak kita menyelenggarakan referendum agar kita dapat mendengar langsung suara rakyat."
 wtt_germany.54.a: "Kampanyekan dukungan bagi unifikasi."
 wtt_germany.54.b: "Kampanyekan penolakan terhadap unifikasi."
 wtt_germany.55.t: "Rakyat Austria Memilih Unifikasi"
 wtt_germany.55.desc: "Rakyat Austria telah memberikan suara bulat mendukung unifikasi dengan saudara sebangsa di utara. Integrasi negara bagian dan militer Austria ke dalam pemerintahan serikat akan segera dimulai."
 wtt_germany.55.a: "Hari bersejarah bagi penuntasan Masalah Jerman!"
 wtt_germany.56.t: "Wilayah-Wilayah Historis Jerman"
 wtt_germany.56.desc: "Perang kita melawan Uni Soviet berjalan sangat buruk, dan kita di ambang kehilangan segalanya. Di sebelah barat kita, Jerman telah mengalami perubahan drastis beberapa tahun terakhir dan kini menjadi benteng kokoh nilai-nilai demokratis. Mengatur pengembalian segera wilayah historis Danzig dan Poznań kepada Jerman niscaya akan menyelamatkan jutaan nyawa rakyat kita dari penindasan sepatu lars Soviet."
 wtt_germany.56.a: "Lebih baik ke tangan Jerman daripada jatuh ke tangan Soviet!"
 wtt_germany.56.b: "Pantang! Tanah Polandia harus tetap milik bangsa Polandia!"
 wtt_germany.57.t: "Polandia Menawarkan Pengembalian Wilayah Jerman"
 wtt_germany.57.desc: "Mengingat perang mereka melawan Uni Soviet kian memburuk, pemerintah Polandia menghubungi kita melalui saluran rahasia, menawarkan pengembalian kilat bekas wilayah kita di Danzig dan Poznań. Mereka meyakini rakyat mereka niscaya akan bernasib jauh lebih baik di bawah naungan Jerman demokratis daripada tertindas oleh cengkeraman Soviet."
 wtt_germany.57.a: "Keputusan yang sangat cerdas! Kita akan melindungi keselamatan mereka."
 wtt_germany.57.b: "Tidak, kita tidak boleh mengambil risiko balasan dari Uni Soviet."
 wtt_germany.58.t: "Rakyat Austria Menolak Unifikasi"
 wtt_germany.58.desc: "Rakyat Austria telah menolak seruan kita untuk penyatuan, lebih memilih mempertahankan kedaulatan independen Austria setidaknya untuk beberapa saat ke depan."
 wtt_germany.58.a: "Kita harus menghormati aspirasi demokrasi mereka."
 wtt_germany.59.t: "Jerman Menerima Danzig dan Poznań"
 wtt_germany.59.desc: "Pemerintah Jerman telah memutuskan untuk menerima kembali bekas wilayah mereka, dan telah bersumpah dengan khidmat untuk menjamin perlindungan bagi segenap warga Polandia di kawasan tersebut."
 wtt_germany.59.a: "Setidaknya rakyat kita di sana akan aman terkendali."
 wtt_germany.60.t: "Jerman Menolak Danzig dan Poznań"
 wtt_germany.60.desc: "Pemerintah Jerman memberi tahu kita bahwa mereka tidak sanggup menerima tawaran tersebut. Mereka mencemaskan pembalasan dendam dari Uni Soviet, sehingga enggan menanggung risikonya."
 wtt_germany.60.a: "Siapa yang akan menolong mereka saat seluruh Eropa jatuh ke tangan Kaum Merah?"
 wtt_germany.62.t: "Perusahaan Menuntut Pencairan Surat Utang MEFO"
 wtt_germany.62.desc: "Dengan berakhirnya perang baru-baru ini, perusahaan-perusahaan yang memegang surat utang MEFO kini mendesak pemerintah untuk segera melakukan pembayaran. Mereka menyatakan tiada lagi urgensi menahan pembayaran 'demi kemaslahatan Tanah Air'."
 wtt_germany.62.a: "Baiklah kalau begitu."
 wtt_germany.63.t: "[GER.GetName] Mereintegrasikan Alsace-Lorraine"
 wtt_germany.63.desc: "Pemerintah [GER.GetAdjective] telah menerbitkan undang-undang yang menetapkan reintegrasi Alsace-Lorraine dan Luksemburg ke dalam [GER.GetName]. Wajib militer massal terhadap penduduk setempat telah dimulai..."
 wtt_germany.63.a: "Keparat! Urusan ini belum selesai!"
 wtt_germany.64.t: "[GER.GetName] Mereintegrasikan Luksemburg"
 wtt_germany.64.a: "Apa lagi yang sanggup kita perbuat?"
 wtt_germany.65.t: "[From.GetName] Menuntut Partisipasi Perang"
 wtt_germany.65.desc: "[From.GetNameDefCap] telah memberi tahu kita bahwa mereka membutuhkan tanah air kita untuk mengalirkan pasukan mereka menghadapi musuh Soviet. Mereka mengingatkan bahwa kita berada di bawah perlindungan militer mereka melawan komunis, dan karena itu kita berhutang budi membantu mereka dalam perang yang berlangsung."
 wtt_germany.65.a: "Mereka benar — kita akan bergabung dalam perang mereka."
 wtt_germany.65.b: "Mereka pikir mereka siapa?! Pantang!"
 wtt_germany.66.t: "[From.GetName] Menerima Tuntutan"
 wtt_germany.66.desc: "[From.GetNameDefCap] telah memutuskan bergabung bersama kita dalam perang melawan [SOV.GetNameDef], yang mendatangkan keuntungan strategis berupa izin perlintasan pasukan melintasi wilayah mereka."
 wtt_germany.67.t: "[From.GetName] Menolak Tuntutan"
 wtt_germany.67.desc: "[From.GetNameDefCap] telah menolak mentah-mentah tuntutan kita untuk berpartisipasi dalam perang, dan terus menutup rapat perbatasan mereka bagi tentara kita. Jika bangsa Polandia enggan membuka jalan bagi pasukan kita, maka kita terpaksa melindas mereka."
 wtt_germany.67.a: "Mereka sendiri yang mengundang petaka ke tanah mereka."
 wtt_germany.68.t: "[From.GetName] Mengusulkan Reintegrasi Kekaisaran"
 wtt_germany.68.desc: "Pemerintah [From.GetAdjective] telah mendatangi kita dengan usulan pemulihan kembali takhta Kekaisaran Austria-Hungaria lama. Karena sentimen monarki sangat tinggi di negara masing-masing, mereka meyakini unifikasi ini akan mendatangkan kemaslahatan besar bagi segenap rakyat."
 wtt_germany.68.a: "Gagasan yang sangat cemerlang! Kita terima."
 wtt_germany.68.b: "Bergabung secara sukarela dengan mereka? Pantang sekali!"
 wtt_germany.69.t: "[From.GetName] Menerima Reintegrasi"
 wtt_germany.69.desc: "Pemerintah [From.GetAdjective] telah menanggapi usulan kita mengenai restorasi Kekaisaran Austria-Hungaria. Mereka mengakui manfaat strategis langkah ini, dan telah menyatakan kesiapan menggabungkan bangsa mereka dengan kita, asalkan seluruh pihak menyetujui."
 wtt_germany.70.t: "[From.GetName] Menolak Reintegrasi"
 wtt_germany.70.desc: "Pemerintah [From.GetAdjective] telah menanggapi usulan kita mengenai restorasi Kekaisaran Austria-Hungaria. Dengan tegas mereka menyatakan pantang tunduk di bawah kepemimpinan kita dalam ikhtiar semacam itu."
 wtt_germany.71.t: "Pemulihan Takhta Kekaisaran Austria-Hungaria"
 wtt_germany.71.desc: "Kedua negara penerus Austria-Hungaria tetangga kita telah menyetujui usulan reintegrasi tanah mereka ke dalam pangkuan bangsa kita, resmi membentuk kembali Kekaisaran Austria-Hungaria yang perkasa. Penandatanganan traktat unifikasi disambut luapan sukacita massa di jalanan kota, dan pemerintah [GER.GetAdjective] dengan penuh kehangatan menyambut kembalinya kita ke dalam persekutuan aliansi."
 wtt_germany.71.a: "Fajar era baru bagi Austria-Hungaria telah menyingsing."
 wtt_germany.72.t: "[From.GetName] Mengusulkan Integrasi Ekonomi"
 wtt_germany.72.desc: "Mengingat kita telah bersekutu amat erat, [From.GetNameDef] telah mengajukan rencana untuk membantu ekspansi ekonomi militer kita dengan mengintegrasikan perekonomian kita secara lebih mendalam. Langkah ini akan melipatgandakan kekuatan tempur kita, namun di saat yang sama akan menundukkan kebijakan luar negeri kita di bawah arahan mereka."
 wtt_germany.72.a: "Gagasan luar biasa — takdir bangsa kita toh sudah saling bertaut."
 wtt_germany.72_tt: "§RKita akan kehilangan kendali atas negara boneka mana pun yang kita miliki.§!\n"
 wtt_germany.72.b: "Kami menolak; kedaulatan bangsa kami terlalu berharga untuk digadaikan."
 wtt_germany.73.t: "[From.GetName] Menerima Integrasi Ekonomi"
 wtt_germany.73.desc: "Pemerintah [From.GetAdjective] memberi tahu kita bahwa mereka menerima usulan integrasi ekonomi perang kita. Mereka menantikan bimbingan kita agar sanggup meniru model kesuksesan militer kita."
 wtt_germany.73.a: "Di bawah bimbingan kita, angkatan perang mereka akan berlipat ganda perkasa."
 wtt_germany.74.t: "[From.GetName] Menolak Integrasi Ekonomi"
 wtt_germany.74.desc: "Pemerintah [From.GetAdjective] mengabarkan bahwa mereka menolak rencana integrasi ekonomi perang kita. Mereka lebih menghargai kedaulatan mereka daripada daya guna angkatan perang mereka..."
 wtt_germany.74.a: "Mereka telah membuang peluang keagungan sejati!"
 wtt_germany.999.t: "[From.GetLeader] Memohon Pemulihan Gelar Kerajaan"
 wtt_germany.999.desc: "Atas nama Kaisar [From.GetLeader], pemerintah [From.GetAdjective] telah memohon agar kita membatalkan pencabutan gelar kebangsawanan Inggris dan gelar kerajaan bagi keluarga pangeran dan raja Jerman, sebagaimana yang tercantum dalam Titles Deprivation Act 1917. Mereka beralasan bahwa langkah ini akan membuktikan kepada dunia bahwa hubungan dinasti bangsawan Inggris dan Jerman telah pulih kembali seperti sebelum perang, serta menjadi lambang persahabatan abadi Anglo-Jerman di masa depan."
 wtt_germany.999.a: "Ini adalah gagasan yang luar biasa mulia!"
 wtt_germany.999.b: "Kami rasa tidak."
 wtt_germany.1000.t: "Pemerintah [From.GetAdjective] Mengabulkan Permohonan"
 wtt_germany.1000.desc: "Pemerintah [From.GetAdjective] telah memutuskan mendukung permohonan pemulihan gelar kebangsawanan Inggris bagi keluarga kerajaan Jerman. Mereka mengusulkan perhelatan akbar 'Upacara Kebangsawanan Abad Ini', di mana seluruh keluarga kerajaan Jerman diundang secara langsung untuk menerima kembali gelar-gelar kehormatan yang dicabut secara tidak adil dua dekade silam.\n\nPara penasihat istana mengusulkan agar seluruh anggota keluarga besar kekaisaran hadir dengan penuh kemegahan menggunakan puncak pencapaian teknologi Jerman. Kapal udara mutakhir Hindenburg akan menjadi sarana transportasi yang sempurna untuk momentum bersejarah ini."
 wtt_germany.1000.a: "Gagasan yang amat cemerlang! Kita akan mengirim perwira penghubung terlebih dahulu."
 wtt_germany.1000.a_tt: "Putri Victoria Louise dikirim lebih dahulu untuk membantu persiapan upacara megah ini. Hal ini akan sedikit membebani kas pemerintahan kita. Semoga seluruh keluarga kekaisaran dapat tiba di [ENG.GetNameDef] dengan selamat tanpa kurang suatu apa pun...\n"
 wtt_germany.1000.b: "Gagasan luar biasa! Kita semua akan berangkat bersama-sama."
 wtt_germany.1000.b_tt: "Seluruh keluarga besar kekaisaran akan menaiki Hindenburg menuju upacara penobatan. Hal ini akan melipatgandakan prestise Dinasti Kekaisaran di mata sekutu dan rakyat, memperkokoh kedudukan pemerintahan kita.\n"
 wtt_germany.1001.t: "Hindenburg Terbakar di London"
 wtt_germany.1001.desc: "Sebuah tragedi mengerikan terjadi hari ini, kapal udara raksasa Hindenburg hancur lebur saat berupaya berlabuh di London. Karena alasan yang belum diketahui pasti, balon udara tersebut terbakar hebat dan jatuh menghantam bumi, merenggut nyawa seluruh penumpang dan awak kapal — termasuk hampir seluruh anggota trah keluarga besar Kekaisaran Jerman.\n\nSatu-satunya yang selamat adalah Putri Victoria Louise, yang telah diberangkatkan lebih awal untuk membantu persiapan upacara. Sang Putri, yang merupakan sosok bangsawan ketiga yang menyandang nama 'Victoria' setelah neneknya, Permaisuri Jerman Victoria, dan buyutnya Ratu Victoria dari Inggris, secara tak terduga menjadi satu-satunya pewaris takhta yang tersisa. Kendati masih terpukul hebat kehilangan seluruh sanak keluarganya, beliau dengan keteguhan hati naik takhta sebagai Kaiserin Victoria I dari Kekaisaran Jerman."
 wtt_germany.1001.a: "Sang Kaiser telah tiada... Hidup Sang Maharani (Kaiserin)!"
 wtt_germany.1002.desc: "Sebuah tragedi mengerikan terjadi hari ini, kapal udara Hindenburg hancur lebur saat berusaha berlabuh di London. Karena sebab yang belum terungkap, kapal udara itu dijilat kobaran api dahsyat dan menghempas tanah, menewaskan seluruh penumpang dan awak kapal — termasuk seluruh keluarga besar Kekaisaran Jerman tanpa sisa.\n\nDengan musnahnya seluruh Dinasti Kekaisaran, pemerintahan militer mengambil alih kendali langsung secara darurat, namun tampaknya sangat kecil kemungkinan demokrasi akan pulih dalam waktu dekat."
 wtt_germany.1002.a: "Sungguh sebuah tragedi memilukan!"
 wtt_germany.1003.t: "Pemerintah [From.GetAdjective] Menolak Permohonan"
 wtt_germany.1003.desc: "Pemerintah [From.GetAdjective], seusai perdebatan sengit berjam-jam di parlemen, telah memutuskan untuk menolak permohonan pemulihan gelar kebangsawanan Inggris bagi keluarga pangeran dan raja Jerman."
 wtt_germany.1003.a: "Sungguh sangat disayangkan..."
 wtt_news.1000.desc: "Sebuah tragedi mengerikan mengguncang dunia hari ini saat kapal udara raksasa Hindenburg terbakar dan hancur berkeping-keping saat bersiap merapat di London. Kobaran api seketika menelan seluruh badan kapal udara dan menghempaskannya ke tanah, merenggut nyawa seluruh penumpang dan awak — termasuk hampir seluruh keluarga besar Dinasti Kekaisaran Jerman.\n\nSatu-satunya yang selamat dari maut adalah Putri Victoria Louise, yang telah tiba terlebih dahulu untuk membantu protokoler upacara. Sang putri, bangsawan ketiga yang mengemban nama 'Victoria' setelah neneknya Permaisuri Victoria dan buyutnya Ratu Victoria, kini resmi menjadi ahli waris tunggal takhta. Di tengah duka mendalam meratapi kepergian seluruh keluarganya, beliau dengan gagah berani naik takhta sebagai Kaiserin Victoria I dari Kekaisaran Jerman."
 wtt_news.1000.a: "Tragedi memilukan... dengan hasil yang di luar dugaan."
 wtt_news.1001.desc: "Sebuah tragedi mengerikan terjadi hari ini saat kapal udara raksasa Hindenburg terbakar dan hancur lebur saat bersiap merapat di London. Karena sebab yang belum terungkap, kapal udara itu dilahap api dan terhempas ke tanah, menewaskan seluruh penumpang dan awak — termasuk segenap anggota keluarga besar Dinasti Kekaisaran Jerman.\n\nDengan binasanya seluruh keluarga kekaisaran, militer mengambil alih kendali darurat, namun tampaknya sangat kecil kemungkinan demokrasi akan pulih dalam waktu dekat."
 wtt_news.1001.a: "Sungguh malapetaka yang teramat memilukan!"
 wtt_news.1.t: "Jerman Terjerumus dalam Perang Saudara"
 wtt_news.1.desc: "Sebuah kudeta Wehrmacht mendadak, yang dipimpin oleh Marsekal Lapangan legendaris August von Mackensen, telah memicu perang saudara berkobar di Jerman pagi ini. Faksi fasis, loyalis monarki, dan kubu demokrat sama-sama mengangkat senjata melawan saudara sebangsa mereka, dan divisi-divisi militer telah ditarik dari perbatasan demi memadamkan ancaman internal.\n\nKaum fasis, di bawah perintah langsung dari Hitler, telah bersumpah untuk menghancurkan negara hingga berkeping-keping daripada membiarkannya jatuh ke tangan 'kaum pengkhianat Jerman'."
 wtt_news.1.a: "Tiada jalan untuk kembali sekarang."
 wtt_news.1.b: "Dikhianati oleh militer sendiri! Kita tidak boleh mengalami nasib serupa."
 wtt_news.1.c: "Semoga perdamaian segera kembali menaungi Eropa..."
 wtt_news.2.t: "[From.GetNameDefCap] Menghadang Kepulangan Wilhelm II"
 wtt_news.2.desc: "Tak lama setelah Kekaisaran Jerman secara mengejutkan mencabut status pengasingan Wilhelm II kemarin pagi, aparat berwenang Belanda menghadang iring-iringan mobil sang Kaiser tua sebelum sempat melintasi perbatasan Jerman, dan memaksanya kembali ke kediamannya di Huis Doorn.\n\nMaklumat resmi Belanda menyebutkan kekhawatiran akan pecahnya instabilitas di benua Eropa seandainya Wilhelm II diizinkan menduduki kembali singgasana Jerman, dan pemerintah Belanda mengambil inisiatif menempatkan sang mantan Kaiser di bawah tahanan rumah.\n\nPemerintah Jerman belum memberikan tanggapan resmi, namun kemarahan publik telah memicu tuntutan penggunaan kekuatan militer demi memulangkan sang Kaiser.\n"
 wtt_news.2.a: "Lancung sekali mereka berani bertindak demikian?!"
 wtt_news.2.b: "Mereka sebaiknya benar-benar menyadari apa yang mereka perbuat..."
 wtt_news.2.c: "Seseorang memang harus mengambil sikap tegas."
 wtt_news.3.t: "Wilhelm II Kembali ke Kekaisaran Jerman"
 wtt_news.3.desc: "Dalam pengumuman mengejutkan kemarin pagi, pemerintah Jerman resmi mencabut status pengasingan atas Wilhelm II. Siang harinya, iring-iringan mobil sang Kaiser tua melintasi perbatasan Belanda-Jerman, dan setibanya di Berlin beliau dinobatkan kembali secara khidmat sebagai Kaiser Kekaisaran Jerman.\n\nSang Kaiser telah bersumpah untuk mengembalikan Jerman ke puncak kejayaan masa lalunya, namun dunia masih menanti arah kebijakan diplomasi apa yang akan ditempuh oleh kekaisaran tersebut."
 wtt_news.3.a: "Hidup sang Kaiser!"
 wtt_news.3.b: "Apakah kita kembali ke fajar abad ini?"
 wtt_news.3.c: "Kami telah menunaikan kewajiban kami menjaganya tetap aman."
 wtt_news.3.d: "Seharusnya kita menekan Belanda lebih keras agar mengekstradisinya!"
 wtt_news.4.t: "Wilhelm II Dibebaskan dari Tahanan Rumah Belanda"
 wtt_news.4.desc: "Kendati tentara Belanda berupaya sia-sia membendung laju pasukan Jerman, pemerintah Belanda akhirnya tak punya pilihan selain menyerah di hadapan kekuatan militer Jerman yang luar biasa perkasa. Pasukan tempur Jerman membebaskan sang Kaiser tua dari tahanan rumahnya di Huis Doorn, dan setibanya di Berlin beliau telah dinobatkan kembali dengan megah sebagai Kaiser Kekaisaran Jerman.\n\nSang Kaiser telah bersumpah memulihkan kejayaan agung Jerman, namun dunia kini mengamati dengan cemas arah manuver diplomatik yang akan ditempuhnya."
 wtt_news.4.a: "Tak satu pun sanggup membendung Kekaisaran Jerman!"
 wtt_news.4.b: "Perlawanan Belanda adalah tindakan gegabah yang sia-sia."
 wtt_news.4.c: "Mungkin menahan beliau bukanlah gagasan yang bijak sejak awal..."
 wtt_news.5.t: "Mussolini Tewas Dibunuh"
 wtt_news.5.desc: "Laporan dari Roma mengonfirmasi bahwa Il Duce tewas ditembak di siang bolong hari ini di jalanan kota tersebut. Secara serentak, unsur-unsur dalam militer dan pemerintahan bergerak cepat merebut kekuasaan dari kaum fasis Italia. Gelombang penangkapan massal dilancarkan, dan tentara memblokade gedung-gedung pemerintahan serta memberlakukan jam malam.\n\nJuru bicara pemerintahan kudeta telah mengumumkan kesetiaan penuh kepada Raja Vittorio Emanuele III, dan dalam dekrit perdananya Sang Raja menandatangani pakta aliansi militer bersama Kekaisaran Jerman."
 wtt_news.5.a: "Semua rencana berjalan tanpa cela."
 wtt_news.5.b: "Hidup Sang Raja!"
 wtt_news.5.c: "Pihak Jerman pasti berada di balik pembunuhan ini..."
 wtt_news.6.t: "Kekaisaran Austria-Hungaria Dipulihkan"
 wtt_news.6.desc: "Negara-negara penerus Lembah Donau bekas Kekaisaran Austria-Hungaria belakangan ini dilanda gelombang sentimen pro-monarki yang dahsyat, dan di bawah kepemimpinan [From.GetOldNameDef], mereka kini sepakat menyatukan kembali tanah air mereka ke dalam Kekaisaran Austria-Hungaria.\n\nPemerintahan serikat Austria-Hungaria yang baru seketika menandatangani traktat persekutuan resmi dengan Kekaisaran Jerman, secara terbuka menyokong kebijakan luar negeri Jerman dalam membendung dominasi Inggris dan Prancis."
 wtt_news.6.a: "Dan kita bahkan tak perlu melepaskan sebutir peluru pun."
 wtt_news.6.b: "Bersatu kembali dalam keagungan!"
 wtt_news.6.c: "Kekuatan poros baru di Eropa? Sungguh mencemaskan."
 wtt_news.7.t: "Polandia Mengembalikan Danzig"
 wtt_news.7.desc: "Pemerintah Polandia telah menyetujui tawaran Jerman untuk mengembalikan Danzig dengan imbalan jaminan perlindungan militer penuh. Traktat resmi telah ditandatangani, memastikan bahwa Jerman akan segera datang membantu seandainya agresi militer dilancarkan terhadap Polandia.\n\nKendati harga yang dibayar sangat mahal karena kembali memutus akses laut Polandia, langkah ini dianggap sangat berharga demi membendung ancaman komunis dari Timur."
 wtt_news.7.a: "'Danzig atau perang'? Hah! Diplomasi kembali menang gemilang."
 wtt_news.7.b: "Semoga pengorbanan ini sepadan dengan hasilnya."
 wtt_news.7.c: "Pihak Jerman mulai lancang mencampuri zona pengaruh kita..."
 wtt_news.7.d: "Kesepakatan yang menguntungkan kedua belah pihak? Kita lihat saja nanti."
 wtt_news.8.t: "Perang Saudara Jerman Berakhir"
 wtt_news.8.desc: "Perang saudara berdarah yang memporak-porandakan Jerman kini resmi berakhir. Pertempuran berlangsung luar biasa dahsyat, di mana perlawanan fanatik kaum Nazi menimbulkan kehancuran berskala kolosal yang mengingatkan pada Perang Besar.\n\nHitler dipastikan tewas, sementara para petinggi Nazi telah dijebloskan ke penjara atau dieksekusi mati. Pemerintah militer sementara kini mengumumkan bahwa prioritas utama adalah memulihkan ketertiban dan stabilitas nasional sebelum memulai reformasi konstitusi."
 wtt_news.8.a: "Mari kita mulai pembangunan kembali tanah air."
 wtt_news.8.b: "Semoga rezim baru ini lebih bersahabat dalam berdiplomasi..."
 wtt_news.9.t: "Uni Soviet Mengumumkan Latihan Militer Akbar"
 wtt_news.9.desc: "Sebagai tanggapan atas apa yang mereka sebut sebagai 'retorika permusuhan Jerman yang kian agresif', komando militer Soviet mengumumkan serangkaian latihan perang berskala raksasa sepanjang tahun ini.\n\nKesiapsiagaan tempur tingkat tinggi ini diharapkan dapat menggertak pihak Jerman agar 'menghentikan ocehan fitnah mereka', demikian pernyataan juru bicara Kremlin."
 wtt_news.9.a: "Mereka terjebak tepat ke dalam skenario kita!"
 wtt_news.9.b: "Langkah ini niscaya membuat mereka berpikir dua kali."
 wtt_news.9.c: "Semoga pihak Jerman tidak mengecewakan harapan kita..."
 wtt_news.9.d: "Langkah tersebut sama sekali tidak membantu meredakan ketegangan..."
 wtt_news.10.t: "Uni Soviet Melipatgandakan Mobilisasi Militer"
 wtt_news.10.desc: "Menanggapi maklumat Jerman mengenai pembentukan Aliansi Eropa Tengah untuk membendung Uni Soviet, pemerintah Soviet telah mengesahkan langkah-langkah darurat guna melipatgandakan kecepatan produksi persenjataan perang.\n\nJuru bicara Kremlin menegaskan secara gamblang bahwa Uni Soviet pantang berdiam diri menyaksikan ancaman perang mengepung perbatasan mereka. Tindakan pembalasan harus dan telah diambil seketika."
 wtt_news.10.a: "Mereka tanpa sadar terus membantu mewujudkan tujuan kita!"
 wtt_news.10.b: "Pasti mereka tak akan berani berbuat lebih ceroboh lagi!"
 wtt_news.10.c: "Setidaknya sebuah aliansi tangguh telah terwujud."
 wtt_news.10.d: "Ketegangan ini kian meruncing dengan sangat cepat..."
 wtt_news.11.t: "Uni Soviet Bergerak Mengamankan Zona Pengaruh"
 wtt_news.11.desc: "Menyusul diundangnya salah satu negara tetangga perbatasan mereka ke dalam [GER.GetFactionName], pemerintah Soviet melayangkan peringatan keras menolak campur tangan asing dalam 'zona pengaruh historis mereka'.\n\nLaporan intelijen mengindikasikan adanya mobilisasi besar-besaran divisi tempur Tentara Merah, bersiap siaga menghadapi perang."
 wtt_news.11.a: "Apakah kita akhirnya berhasil memancing mereka keluar?"
 wtt_news.11.b: "Kita harus segera membentengi perbatasan kita!"
 wtt_news.11.c: "Bersama-sama kita sanggup membendung amukan mereka!"
 wtt_news.11.d: "Apakah ini percikan api perang dunia baru?"
 wtt_news.11.e: "Kita harus bersiap untuk perang total!"
 wtt_news.12.t: "Protes atas Kembalinya Sang Kaiser Berujung Perang"
 wtt_news.12.desc: "Menanggapi keputusan [GER.GetAdjective] mengizinkan kepulangan Wilhelm II, [FRA.GetNameDef] dan [ENG.GetNameDef] resmi menyatakan perang terhadap [GER.GetNameDef]. Pihak [FRA.GetAdjective] dan [ENG.GetAdjective] menuding 'sikap pembangkangan terang-terangan [GER.GetAdjective]' yang membiarkan seorang 'penjahat perang ternama' kembali menjadi kepala negara sebagai biang keladi perang ini.\n\nJuru bicara kedua sekutu menegaskan bahwa sangat tidak bermoral membiarkan sang 'penyulut utama' Perang Besar menduduki Takhta Kekaisaran lagi setelah semua peringatan diabaikan. 'Kami tidak punya pilihan lain'."
 wtt_news.12.a: "Lancung sekali mereka berani mendikte siapa pemimpin kami?!"
 wtt_news.12.b: "Mereka sendiri yang memaksa kami mengangkat senjata!"
 wtt_news.12.c: "Dan kita pun kembali terlempar ke tahun 1914."
 wtt_news.13.t: "Kompromi Wilhelm III"
 wtt_news.13.desc: "Menanggapi penolakan keras Anglo-Prancis atas kepulangan Wilhelm II sebagai Kaiser, pemerintah Jerman mengajukan kompromi di mana Wilhelm II akan tetap tinggal di pengasingan, namun putranya akan naik takhta sebagai Wilhelm III.\n\nSetelah disepakati oleh [ENG.GetNameDef] dan [FRA.GetNameDef], langkah bijak ini diharapkan mampu menjamin perdamaian abadi di antara kekuatan-kekuatan besar Eropa."
 wtt_news.13.a: "Kita tidak memiliki pilihan lain."
 wtt_news.13.b: "Syukurlah pihak Jerman masih mengedepankan akal sehat."
 wtt_news.13.c: "Perdamaian dunia berhasil diselamatkan..."
 wtt_news.14.desc: "Menanggapi keputusan Jerman memulangkan Wilhelm II, dan kendati tanpa dukungan militer Inggris, [FRA.GetNameDef] secara sepihak menyatakan perang terhadap [GER.GetNameDef]. Pihak Prancis menuding 'sikap keras kepala Jerman' yang mengizinkan sang 'penjahat perang' berkuasa kembali sebagai pemicu meletusnya perang.\n\nJuru bicara Prancis menegaskan bahwa adalah kezaliman membiarkan sang biang keladi Perang Besar bertahta kembali, dan bahwa Jerman telah mengabaikan semua ultimatum. 'Kami tidak punya pilihan lain'."
 wtt_news.14.c: "Bangsa Prancis yang dungu dan keras kepala!"
 wtt_news.14.d: "Namun apa yang akan diperbuat oleh pihak Inggris?"
 wtt_news.15.desc: "Menanggapi penolakan keras Prancis atas kepulangan Wilhelm II sebagai Kaiser, pemerintah Jerman mengusulkan kompromi di mana Wilhelm II tetap berada di pengasingan, sementara putranya akan dinobatkan sebagai Wilhelm III.\n\nSetelah diterima dengan lega oleh [FRA.GetNameDef], perdamaian di benua Eropa diharapkan dapat terus terpelihara."
 wtt_news.15.c: "Syukurlah pihak Jerman terbukti jauh lebih rasional dibanding Prancis..."
 wtt_news.16.t: "Tiongkok Mengembalikan Qingdao ke Pangkuan Jerman"
 wtt_news.16.desc: "Pemerintah Tiongkok memutuskan untuk memenuhi tuntutan Jerman atas pengembalian enklaf lama mereka di Qingdao.\n\nBerlaku seketika, kendali kedaulatan Jerman telah dipulihkan di batas kota tersebut, dan Pemerintah Jerman telah meresmikan kembali namanya menjadi nama Jerman lama: Tsingtao."
 wtt_news.16.a: "Kita akan menyaksikan kebangkitan kembali kejayaan koloni kita."
 wtt_news.16.b: "Itu hanyalah harga kecil yang pantas dibayar."
 wtt_news.16.c: "Kita pernah merebutnya dari mereka, kita sanggup mengulanginya lagi!"
 wtt_news.16.d: "Kolonialisme Jerman kembali bangkit?"
 wtt_news.17.t: "Jepang Mengembalikan Qingdao ke Pangkuan Jerman"
 wtt_news.17.desc: "Pemerintah Jepang telah menyetujui tuntutan Jerman atas pengembalian enklaf lama mereka di Qingdao.\n\nBerlaku seketika, kekuasaan Jerman telah dipulihkan di kota tersebut, dan Pemerintah Jerman telah mengembalikan namanya menjadi Tsingtao."
 wtt_news.17.b: "Berani-beraninya mereka menyerahkan wilayah kedaulatan KITA?!"
 wtt_news.17.c: "Anggap saja hutang peristiwa 1914 kita telah impas."
 wtt_news.18.t: "Rakyat Austria Memilih Bergabung dengan Jerman"
 wtt_news.18.desc: "Sejak kemitraan aliansi erat antara [AUS.GetNameDef] dan [GER.GetNameDef] bermula, sentimen pro-unifikasi melonjak drastis di seantero Austria. Plebisit yang digelar kemarin memperlihatkan rakyat Austria secara luar biasa memilih bersatu dengan saudara sebangsa mereka di utara.\n\nIntegrasi institusi negara Austria telah dipercepat seketika, dan pemerintahan lama resmi dibubarkan pagi ini."
 wtt_news.18.a: "Demi terwujudnya Jerman Raya (Großdeutschland)!"
 wtt_news.18.b: "Itulah kehendak tulus rakyat di sana."
 wtt_news.19.t: "Polandia Mengembalikan Danzig dan Poznań"
 wtt_news.19.desc: "Di hadapan serbuan Tentara Merah yang tak terbendung, pemerintah Polandia pagi ini mengumumkan penyerahan segera bekas wilayah Jerman di Danzig dan Poznań kepada [GER.GetNameDef].\n\nKendati kedua belah pihak memilih bungkam mengenai rincian alasannya, para analis sepakat bahwa langkah ini diambil demi mencegah wilayah-wilayah tersebut jatuh ke cengkeraman Soviet di tengah ambruknya pertahanan Polandia."
 wtt_news.19.a: "Kita akan membela dan melindungi mereka dengan taruhan nyawa kita."
 wtt_news.19.b: "Itu adalah opsi terbaik di tengah keputusasaan..."
 wtt_news.19.c: "Muslihat diplomatik yang licik dan menusuk dari belakang!"
 wtt_news.19.d: "Langkah manuver diplomatik yang sangat cerdik..."
 wtt_news.20.t: "Jerman Mengumumkan Pakta Anti-Soviet"
 wtt_news.20.desc: "Menyikapi peningkatan agresi militer Uni Soviet, [GER.GetName] telah menawarkan negara-negara yang terancam komunisme peluang membentuk aliansi pertahanan bersama melawan [SOU.GetName]. Setiap negara anggota pakta berjanji mengangkat senjata melawan [SOU.GetName] seandainya salah satu sekutu diserang."
 wtt_news.21.t: "[From.GetNameDefCap] Mengecam Keras [SOV.GetNameDef]"
 wtt_news.21.desc: "\nPemerintah [FROM.GetAdjective] telah memperkeras retorika perlawanannya terhadap [SOV.GetNameDef], memperingatkan bahwa tetangga timur Eropa tersebut adalah 'Ancaman Bahaya Merah Timur' yang membayangi peradaban benua. Apakah ini sekadar propaganda ketakutan atau fakta nyata masih diperdebatkan, namun bangsa [FROM.GetAdjective] jelas bertekad mempersatukan benua menghadapi Timur."
 wtt_news.21.a: "Dunia harus sadar akan ancaman mematikan dari kaum [SOV.GetAdjective]!"
 wtt_news.21.b: "Lancung sekali mereka berani memfitnah kami seperti itu?!"
 wtt_news.21.d: "Kita tunggu bagaimana kaum Soviet akan menyikapi penghinaan ini."
 wtt_news.22.t: "[From.GetName] Mengumumkan Pembentukan Blok Eropa Tengah"
 wtt_news.22.desc: "Jerman kian gencar melancarkan retorika anti-Soviet, dan kini merumuskan rencana nyata untuk membendung pengaruh Moskow di Eropa. Aliansi baru bernama Blok Eropa Tengah resmi didirikan dan diharapkan mampu memberi perlindungan bagi negara-negara anggotanya menghadapi 'agresi Soviet yang liar'."
 wtt_news.22.a: "Kita akan memimpin Eropa Bebas menghancurkan tirani komunisme!"
 wtt_news.22.b: "Mereka makin terang-terangan mengancam kedaulatan kita..."
 wtt_news.22.c: "Akhirnya pihak Jerman mengambil langkah nyata."
 wtt_news.22.d: "Sangat mustahil pihak Soviet akan tinggal diam menerima hal ini..."
 wtt_news.23.t: "Prancis Vichy Dianeksasi Penuh"
 wtt_news.23.desc: "Operasi militer kilat Jerman untuk mencaplok Prancis Vichy yang dilancarkan awal pekan ini telah rampung dengan sukses mutlak. Pasukan Jerman berhasil menguasai pangkalan laut utama di Toulon sebelum perintah penenggelaman kapal armada Prancis sempat dikirimkan. Dengan demikian, seluruh armada tempur Prancis jatuh utuh ke tangan Jerman."
 wtt_news.23.a: "Kemenangan yang gilang-gemilang!"
 wtt_news.23.b: "Mereka telah gagal menunaikan tugas kehormatan mereka..."
 wtt_news.23.c: "Bangsa Jerman sungguh tanpa ampun."
 wtt_news.24.t: "Armada Prancis Sengaja Ditenggelamkan"
 wtt_news.24.desc: "Operasi militer Jerman mencaplok Prancis Vichy awal pekan ini berhasil menguasai wilayah tersebut. Namun, pasukan Jerman gagal merebut pangkalan laut Toulon sebelum para laksamana Prancis mengeluarkan perintah penenggelaman kapal. Seluruh armada tempur Prancis telah sengaja dikaramkan ke dasar laut demi mencegahnya jatuh ke tangan Jerman."
 wtt_news.24.a: "Mengecewakan, namun bukan persoalan besar bagi kita."
 wtt_news.24.b: "Mereka menepati sumpah kehormatan hingga titik darah penghabisan."
 wtt_news.24.c: "Aksi pembangkangan terakhir yang teramat gagah dari para pelaut Prancis."
 wtt_burma_road.1.t: "Jalur Burma Terputus"
 wtt_burma_road.1.desc: "Pasukan [occupying_country.GetAdjective] yang menyerbu ke [state_occupied.GetName] telah berhasil memotong Jalur Burma di sejumlah titik vital. Pasokan perbekalan militer tak lagi dapat mengalir kepada kita melalui rute darat ini."
 wtt_burma_road.1.a: "Kondisi ini akan mempersulit perjuangan kita."
 wtt_burma_road.2.desc: "Pemerintah [From.GetAdjective] memutuskan untuk tidak lagi mengizinkan lalu lintas bantuan melintasi Jalur Burma. Seluruh konvoi truk dihentikan dan diperintahkan putar balik. Tidak ada lagi pasokan yang sanggup mencapai kita lewat rute ini."
 wtt_burma_road.2.desc_war_with_from: "Pasukan tempur [From.GetAdjective] telah merangsek cepat di sepanjang Jalur Burma dan menguasai berbagai jembatan serta persimpangan penting. Jalur ini kini ditutup bagi seluruh lalu lintas dan pasokan tidak dapat lagi mengalir kepada kita melalui rute ini."
 wtt_burma_road.3.t: "[From.GetNameDefCap] Membuka Kembali Sebagian Jalur Burma"
 wtt_burma_road.3.desc: "Menyusul keberhasilan perebutan kembali sebagian besar Jalur Burma, aparat berwenang [From.GetAdjective] mengizinkan konvoi melanjutkan perjalanan melintasi rute tersebut. Kendati sisa-sisa pasukan musuh membuat perjalanan menjadi kian berbahaya, perbekalan perang kini mulai mengalir kembali."
 wtt_burma_road.3.a: "Langkah awal yang sangat menggembirakan."
 wtt_burma_road.4.t: "[From.GetNameDefCap] Membuka Penuh Jalur Burma"
 wtt_burma_road.4.desc: "Konvoi pasokan logistik perdana yang melintasi Jalur Burma yang baru dibuka telah tiba dengan selamat di Yunnan hari ini. Kendati butuh waktu agar arus transportasi berjalan normal seutuhnya, bantuan kini telah kembali menjangkau pasukan kita."
 wtt_burma_road.4.a: "Bantuan yang teramat sangat melegakan."
 wtt_ledo_road.1.t: "Jalur Ledo Terputus"
 wtt_ledo_road.1.desc: "Pasukan tempur [occupying_country.GetAdjective] yang menyerang [state_occupied.GetName] telah mencapai Jalur Ledo dan memutus jalan tersebut di berbagai tempat. Tak ada lagi pasokan logistik yang sanggup mencapai kita lewat jalur ini."
 wtt_ledo_road.2.desc: "Pemerintah [From.GetAdjective] telah memutuskan menghentikan arus lalu lintas militer melintasi Jalur Ledo. Seluruh konvoi telah disetop dan diperintahkan berbalik arah. Tidak ada lagi perbekalan perang yang mengalir lewat rute ini."
 wtt_ledo_road.2.desc_war_with_from: "Pasukan [From.GetAdjective] telah merangsek cepat di sepanjang Jalur Ledo dan menduduki jembatan-jembatan penyeberangan vital. Rute ini kini tertutup rapat bagi lalu lintas dan tidak ada lagi suplai logistik yang dapat kita terima melalui jalur ini."
 wtt_ledo_road.3.t: "[From.GetNameDefCap] Membuka Kembali Sebagian Jalur Ledo"
 wtt_ledo_road.3.desc: "Menyusul keberhasilan perebutan kembali sebagian besar Jalur Ledo, aparat berwenang [From.GetAdjective] mengizinkan konvoi bergerak kembali. Walau ancaman gerilya musuh membuat ekspedisi ini berbahaya, perbekalan kini kembali mengalir."
 wtt_ledo_road.3.a: "Langkah awal yang sangat baik."
 wtt_ledo_road.4.t: "[From.GetNameDefCap] Membuka Penuh Jalur Ledo"
 wtt_ledo_road.4.desc: "Konvoi truk perdana melalui Jalur Ledo yang telah dibuka kembali telah tiba di Yunnan hari ini. Arus logistik kini kembali memperkuat barisan pertahanan kita."
 wtt_ledo_road.4.a: "Kabar yang sungguh luar biasa!"
 wtt_the_hump.1.t: "Jembatan Udara 'The Hump' Ditangguhkan"
 wtt_the_hump.1.desc: "Pasukan [occupying_country.GetAdjective] telah merebut sejumlah pangkalan udara di [state_occupied.GetName], memaksa skadron angkut udara rute Himalaya mengungsi. Seiring meningkatnya ancaman pencegat musuh dan rute terbang yang makin jauh hingga mustahil ditempuh dengan satu tangki bahan bakar, jembatan udara terpaksa dihentikan sementara. Tak ada lagi pasokan yang dapat menjangkau kita lewat udara."
 wtt_the_hump.2.desc: "Pemerintah [From.GetAdjective] memerintahkan penghentian seketika seluruh penerbangan melintasi Himalaya. Kendati kita melayangkan protes keras, mereka enggan meninjau ulang keputusan tersebut."
 wtt_the_hump.2.desc_war_with_from: "Pasukan [From.GetAdjective] telah menduduki pangkalan-pangkalan udara yang digunakan untuk Jembatan Udara The Hump, melumpuhkan total kemampuan menyuplai pasukan kita dari udara. Tiada lagi pasokan yang dapat diharapkan lewat jalur angkasa ini."
 wtt_the_hump.3.t: "[From.GetNameDefCap] Melanjutkan Jembatan Udara 'The Hump'"
 wtt_the_hump.3.desc: "Pesawat-pesawat angkut [From.GetAdjective] perdana mulai berdatangan, membawa perbekalan vital menerobos cuaca ganas pegunungan Himalaya. Kendati ancaman musuh tetap membayangi, logistik perang kini mengalir kembali."
 wtt_the_hump.3.a: "Langkah awal yang sangat membesarkan hati."
 wtt_the_hump.4.t: "[From.GetNameDefCap] Memulihkan Penuh Jembatan Udara 'The Hump'"
 wtt_the_hump.4.desc: "Jembatan udara melintasi Himalaya kini kembali beroperasi pada kapasitas penuh, dengan jadwal penerbangan harian ketat yang mengangkut berton-ton pasokan yang sangat kita dambakan."
 wtt_the_hump.4.a: "Rahmat karunia yang turun dari langit!"
 wtt_hanoi_route.1.t: "Jalur Hanoi Ditutup"
 wtt_hanoi_route.1.desc: "Kapal-kapal kargo pengangkut suplai militer bagi angkatan bersenjata kita dipaksa putar balik dari pelabuhan Hanoi karena rute ke utara menuju perbatasan Tiongkok telah diblokade oleh [GetVietnamOwner].\n\nTidak ada lagi perbekalan perang yang sanggup bergerak melalui rute ini."
 wtt_hanoi_route.2.desc: "Aparat setempat [From.GetAdjective] menerima perintah untuk memblokir seluruh pembongkaran peralatan perang di Hanoi menuju perbatasan Tiongkok. Pasukan bersenjata ditempatkan di dermaga demi mencegah kapal membobol blokade, sementara kapal patroli pantai [From.GetAdjective] menghalau kapal-kapal dagang yang masih berlayar di laut lepas.\n\nTiada lagi pasokan senjata yang dapat diharapkan lewat pintu masuk ini."
 wtt_hanoi_route.2.desc_war_with_from: "Pasukan [From.GetAdjective] yang menduduki Hanoi telah merampas sejumlah kapal kargo yang mengangkut pasokan militer untuk kita. Kapal-kapal yang masih di laut lepas terpaksa berbalik arah dan berlayar mencari pelabuhan netral.\n\nTidak ada lagi pasokan yang dapat diharapkan mengalir melalui rute ini."
 CHI_vietnam_JAP: "Tentara Kekaisaran Jepang"
 CHI_vietnam_FRA: "Otoritas Kolonial Prancis"
 wtt_china.1.t: "[FROM.GetNameDefCap] Menuntut Kepatuhan"
 wtt_china.1.desc: "Tampaknya [From.GetLeader] akhirnya memutuskan untuk menegakkan kekuasaannya hingga ke pelosok pedalaman Tiongkok. Seorang utusan resmi dari Pemerintah Pusat telah tiba, menuntut agar kita mematuhi perintah [From.GetLeader] atau menghadapi penggantian paksa dengan pemerintahan yang lebih patuh."
 wtt_china.1.a: "Bersatu kita teguh!"
 wtt_china.1.b: "Biarkan mereka mencoba!"
 wtt_china.2.t: "[From.GetLeader] Menyatakan Tunduk"
 wtt_china.2.desc: "[From.GetLeader] telah memulangkan utusan kita membawa surat pribadi, berjanji untuk patuh sepenuhnya pada perintah kita dan mengoordinasikan kebijakan dengan pemerintah pusat."
 wtt_china.2.a: "Pria yang bijak."
 wtt_china.3.t: "[From.GetLeader] Menolak Tunduk"
 wtt_china.3.desc: "[From.GetLeader] telah memulangkan utusan kita dengan pesan pembangkangan, menyatakan bahwa Pemerintah Pusat tidak memiliki wewenang hukum untuk menggulingkan gubernur militer provinsi. Penolakan ini disertai laporan rinci mengenai kesiapsiagaan tempur divisinya."
 wtt_china.3.a: "Kita buktikan nanti di medan tempur."
 wtt_china.10.t: "[FROM.GetName] Menuntut Kepatuhan"
 wtt_china.10.desc: "Pemerintah [From.GetLeader] melayangkan nota diplomatik keras, mengecam serangkaian kebijakan kita selama beberapa bulan terakhir yang dianggap bertentangan dengan kepentingan nasional [From.GetNameDef]. Kecuali kita menyelaraskan kebijakan kita secara patuh dengan pemerintah [From.GetAdjective], mereka mengancam akan mengambil 'tindakan yang dianggap perlu.'"
 wtt_china.10.a: "Kita tidak punya pilihan lain."
 wtt_china.10.b: "Kita akan bertempur mempertahankan kedaulatan!"
 wtt_china.11.t: "[From.GetNameDefCap] Menyatakan Tunduk"
 wtt_china.11.desc: "Pemerintah [From.GetAdjective] telah menanggapi nota kita dan berjanji berkonsultasi dalam setiap pengambilan keputusan strategis. Duta besar kita untuk [From.GetNameDef] telah diangkat menjadi Perwakilan Khusus guna memastikan kaum [From.GetAdjective] tidak melenceng dari garis kepemimpinan kita."
 wtt_china.11.a: "Luar biasa!"
 wtt_china.12.t: "[From.GetNameDefCap] Membangkang"
 wtt_china.12.desc: "Nota diplomatik kita kepada [From.GetNameDef] bocor ke media massa dan memicu kegemparan publik. Surat kabar internasional bahkan memuat tajuk rencana pedas, mengecam tuntutan wajar kita sebagai 'campur tangan urusan dalam negeri', 'preseden berbahaya', dan 'imperialisme telanjang'.\n\nPemerintah [From.GetAdjective] menolak membahas masalah ini lebih jauh dan memperingatkan bahwa mengungkitnya kembali akan berujung pada pemutusan total hubungan diplomatik."
 wtt_china.12.a: "Tindakan tegas harus segera diambil."
 wtt_infiltration.1.t: "Operasi Pembersihan Anti-Infiltrasi"
 wtt_infiltration.2.t: "Sel Komunis Terbongkar di [infiltrated_state.GetName]"
 wtt_infiltration.2.desc: "Penyelidikan intelijen kita berhasil membongkar pangkalan rahasia kaum komunis di [infiltrated_state.GetName]. Seluruh kekuatan militer harus dikerahkan untuk melumat para pemberontak ini secepat mungkin. Setiap penundaan akan memberi mereka waktu memperluas jaringan dan mempersulit pembersihannya."
 wtt_infiltration.2.a: "Kerahkan pasukan penumpas!"
 wtt_infiltration.3.t: "Kaum Komunis Berhasil Dibendung"
 wtt_infiltration.3.desc: "Dalam penggerebekan terbaru terhadap sarang persembunyian komunis, agen-agen kita tidak menemukan aktivitas mencurigakan baru. Kita tahu penyusup komunis masih berkeliaran, namun tampaknya tidak ada sel operasi rahasia di luar yang telah kita awasi."
 wtt_infiltration.3.a: "Mari kita basmi sel-sel yang telah terdeteksi!"
 wtt_infiltration.4.t: "Infiltrasi Komunis Berhasil Dipatahkan?"
 wtt_infiltration.4.desc: "Kabar burung mengenai infiltrasi komunis berskala masif ternyata dibesar-besarkan. Serangkaian penggerebekan terhadap sarang persembunyian dan aktivis komunis tidak membuahkan bukti baru. Ini berarti kaum Komunis gagal membangun jaringan atau sel-sel mereka telah kita hancurkan hingga ke akar. Namun kita harus tetap waspada, karena mereka pasti akan menunggu kita lengah sebelum mencoba menyusup kembali."
 wtt_infiltration.4.a: "Semoga kita benar-benar telah melenyapkan mereka semua."
 wtt_infiltration.5.t: "Pangkalan Basis di [infiltrated_state.GetName] Terbongkar"
 wtt_infiltration.5.desc: "Patroli tentara Nasionalis kian mendekati Pangkalan Basis kita di [infiltrated_state.GetName]. Jika mereka mengerahkan divisi berkekuatan penuh, pangkalan gerilya kita terancam dihancurkan dalam operasi militer terpadu."
 wtt_infiltration.5.a: "Semoga situasinya tidak memburuk hingga ke titik itu."
 wtt_infiltration.6.t: "Pangkalan Basis di [infiltrated_state.GetName] Diserang"
 wtt_infiltration.6.desc: "Pasukan musuh telah melancarkan serbuan terhadap Pangkalan Basis kita di [infiltrated_state.GetName]. Tiada pesan yang berhasil sampai dari kawan-kawan seperjuangan di sana, namun pers musuh memberitakan tuntasnya 'Kampanye Pengepungan dan Pemusnahan di [infiltrated_state.GetName]'. Kita harus bersiap menghadapi kemungkinan terburuk."
 wtt_infiltration.6.a: "Revolusi mengalami pukulan berat."
 wtt_infiltration.10.t: "Pemberontakan Komunis"
 wtt_infiltration.10.desc: "Pergerakan mencurigakan tengah berlangsung di tubuh Partai Komunis. Dinas intelijen kita mencegat kurir-kurir rahasia yang membawa sandi perintah operasi 'Serangan Balasan Revolusioner' yang disiapkan di pangkalan-pangkalan rahasia seluruh negeri. Pasukan dan logistik tengah dihimpun untuk operasi raksasa — bahkan mungkin pemberontakan serentak nasional. Kita harus segera bersiaga penuh!"
 wtt_infiltration.10.a: "Bersiap bertempur mempertahankan Tiongkok!"
 wtt_infiltration.21.t: "Sel Komunis Ditemukan di [infiltrated_state.GetName]"
 wtt_infiltration.21.desc: "Bergerak berdasarkan laporan dinas intelijen, patroli kita berhasil membongkar Pangkalan Basis utama Komunis. Kita harus menggempur saat ini juga sebelum mereka mengorganisir diri dan melawan upaya penertiban kita."
 wtt_infiltration.21.a: "Kecepatan gerak adalah kunci utama."
 wtt_infiltration.23.t: "Ancaman Komunis Mulai Mereda?"
 wtt_infiltration.23.desc: "Serangkaian penggerebekan terhadap tempat persembunyian Komunis mengungkap sedikit sekali temuan baru mengenai skala infiltrasi mereka. Interogasi mendalam terhadap tahanan Komunis tidak menghasilkan informasi baru di luar yang sudah kita ketahui.\n\nTampaknya dinas intelijen kita memegang kendali penuh atas situasi keamanan ini."
 wtt_infiltration.23.a: "Kita harus menyapu bersih segelintir sel yang kita ketahui."
 wtt_infiltration.24.a: "Semoga kita telah melenyapkan seluruh anasir perusak."
 wtt_infiltration.24.t: "Ancaman Komunis Berhasil Dihancurkan"
 wtt_infiltration.24.desc: "Tampaknya kaum Komunis menderita pukulan telak yang melumpuhkan gerakan mereka selama beberapa bulan terakhir. Agen-agen kita mencegat rentetan pesan dari Markas Pusat Partai Komunis yang menanyakan nasib cabang-cabang daerah mereka — yang sering kali dikirim setelah pemimpin cabang diringkus dan markasnya disergap. Saat ini kaum Komunis terdesak hebat, dan struktur organisasi mereka di tingkat provinsi lumpuh total.\n\nNamun kita harus senantiasa waspada, sebab selama Partai Komunis masih berdenyut, mereka sewaktu-waktu dapat menyulut kembali api pemberontakan."
 CHI_xian_warlords_upset: "Langkah ini akan mengecewakan para panglima perang. Mereka dapat memutuskan untuk §Rkeluar dari faksi Anda§!, menolak kendali Anda, dan akan mengingat penghinaan ini di masa mendatang."
 wtt_xian_incident.1.t: "Undangan dari [From.GetLeader]"
 wtt_xian_incident.1.desc: "[From.GetLeader] telah melayangkan undangan resmi kepada [CHI.GetLeader] untuk bertemu di Xi'an guna membahas situasi terkini serta langkah ke depan dalam menuntaskan perang saudara melawan Kaum Komunis.\n\nMenolak undangan ini akan dipandang sebagai penghinaan pribadi oleh [From.GetLeader] dan niscaya disorot tajam oleh para panglima perang lainnya."
 wtt_xian_incident.1.a: "Hadir"
 wtt_xian_incident.1.b: "Tolak Kehadiran"
 wtt_xian_incident.2.t: "[From.GetLeader] Tiba di Xi'an"
 wtt_xian_incident.2.desc: "Bepergian hanya dengan pengawalan kecil, [From.GetLeader] telah tiba di Xi'an untuk berunding dengan kita. Beliau tentu mengharapkan kita memperbarui sumpah setia memerangi kaum komunis hingga tuntas. Dengan moncong senjata tentara Jepang yang telah berada di depan pintu gerbang kita, kita harus menyadarkan beliau akan ancaman yang sesungguhnya."
 wtt_xian_incident.2.a: "Desak beliau bersekutu dengan Kaum Komunis."
 wtt_xian_incident.3.t: "[From.GetLeader] Menolak Bertemu"
 wtt_xian_incident.3.desc: "Berdalih menderita flu berat, [CHI.GetLeader] dengan 'berat hati' menolak undangan kita. Apakah ini pertanda bahwa beliau berencana mengambil alih kendali militer atas wilayah kita secara paksa dalam waktu dekat, atau ada yang membocorkan niat kita kepadanya, masih menjadi tanda tanya besar."
 wtt_xian_incident.3.a: "Mungkin beliau memang benar-benar terserang flu?"
 wtt_xian_incident.4.t: "[From.GetLeader] Mengusulkan Aliansi dengan Kaum Komunis"
 wtt_xian_incident.4.desc: "Dalam perundingan Xi'an, [From.GetLeader] melontarkan gagasan yang sangat mengejutkan: Beliau berpendapat bahwa kita harus menjalin aliansi dengan kaum komunis agar sanggup menghadapi ancaman invasi Jepang sebagai satu Front Persatuan."
 wtt_xian_incident.4.a: "Mungkin beliau ada benarnya."
 wtt_xian_incident.4.b: "Kita masih ingat betul akhir berdarah dari aliansi sebelumnya."
 wtt_xian_incident.5.t: "[CHI.GetLeader] Mengusulkan Aliansi"
 wtt_xian_incident.5.desc: "Tampaknya kubu Nasionalis akhirnya menyadari kesia-siaan upaya melenyapkan kita dari peta sejarah. Dalam pertemuan di Xi'an, [CHI.GetLeader] dikabarkan bersedia menjajaki kemungkinan pembentukan aliansi bersama kita demi membendung Jepang.\n\nKita harus menimbang setiap opsi dengan sangat cermat."
 wtt_xian_incident.5.a: "Jepang adalah ancaman yang jauh lebih mematikan."
 wtt_xian_incident.5.b: "Pantang berkompromi dengan Kaum Nasionalis!"
 reject_second_united_front_tt: "§RMemilih opsi ini berarti Front Persatuan Kedua tidak akan terbentuk§!"
 wtt_xian_incident.6.t: "[From.GetLeader] Menolak Bersekutu dengan Kaum Komunis"
 wtt_xian_incident.6.desc: "Terlepas dari argumen logis dan desakan kita untuk mengakhiri perang saudara yang sia-sia ini, [From.GetLeader] berkeras menolak gagasan Front Persatuan dengan Kaum Komunis. Sangat jelas bahwa tindakan yang lebih tegas harus diambil. Haruskah kita menangkapnya dan menyerahkannya kepada Kaum Komunis?"
 wtt_xian_incident.6.a: "Ini adalah satu-satunya pilihan kita."
 wtt_xian_incident.6.b: "Langkah itu dapat dengan mudah lepas kendali menjadi malapetaka."
 wtt_xian_incident.7.t: "[CHI.GetLeader] Ditangkap di [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.7.desc_a: "[CHI_xian_instigator.GetLeader] mengirimkan sandi kawat rahasia yang menyatakan bahwa ia telah menawan [CHI.GetLeader] dan bersedia menyerahkannya ke tangan kita.\n\nIni mungkin kesempatan emas terbesar yang pernah kita miliki untuk mengeksekusi musuh rakyat ini!"
 wtt_xian_incident.7.desc_b: "[From.GetLeader] menolak usulan kita untuk mengeksekusi mati [CHI.GetLeader]. Sebagai gantinya, kita diminta membentuk aliansi dengan Kaum Nasionalis, karena tampaknya kita belum siap memimpin revolusi sekaligus mempertahankan tanah air melawan agresi Jepang secara bersamaan."
 wtt_xian_incident.7.a: "Minta persetujuan resmi dari pihak Soviet."
 wtt_xian_incident.7.b: "Penggal kepalanya di hadapan rakyat!"
 wtt_xian_incident.7.c: "Kita sebaiknya bersekutu dengannya demi melawan Jepang."
 wtt_xian_incident.7.d: "Tolak mentah-mentah gagasan Front Persatuan Kedua"
 wtt_xian_incident.7.e: "$PRC_mao_zedong$ dan $PRC_zhang_guotao$ sama-sama sepakat bahwa [CHI.GetLeader] tidak dapat dipercaya."
 wtt_xian_incident.8.t: "[From.GetLeader] Menawan [CHI.GetLeader]!"
 wtt_xian_incident.8.desc: "Kita berhasil mencegat pesan rahasia dari [From.GetLeader] yang menyatakan bahwa ia telah menahan [CHI.GetLeader] dan berniat menyerahkannya ke tangan Kaum Komunis. Mengingat dendam membara mereka terhadap beliau, sangat mustahil sang pemimpin akan bertahan hidup lama.\n\nJika kita ingin mencegah [CHI.GetLeader] diadili dalam pengadilan sandiwara oleh [PRC.GetLeader] lalu dieksekusi mati, kita harus bertindak cepat dan mengerahkan kekuatan militer!"
 wtt_xian_incident.8.a: "Kirim divisi pembebas!"
 wtt_xian_incident.8.b: "Mereka tak akan berani mencelakainya. Mari kita amati terlebih dahulu."
 wtt_xian_incident.9.t: "[CHI.GetLeader] Ditahan di [CHI_xian_instigator.GetNameDef]!"
 wtt_xian_incident.9.desc: "[PRC.GetLeader] telah mengirimkan pesan yang menyatakan bahwa kaum Komunis memiliki kesempatan langka untuk mengadili [CHI.GetLeader] atas kejahatannya terhadap rakyat dan revolusi. Menjatuhkan hukuman mati padanya akan menjadi kemenangan moral raksasa bagi Partai Komunis dalam perebutan kepemimpinan Tiongkok.\n\nNamun, tindakan tersebut juga akan melumpuhkan kubu Nasionalis di saat yang sangat kritis, membuka pintu lebar-lebar bagi Jepang untuk mencaplok seluruh Tiongkok."
 wtt_xian_incident.9.a: "Satu lagi musuh borjuis menjemput ajalnya."
 wtt_xian_incident.9.b: "Sosoknya masih mutlak dibutuhkan bagi persatuan bangsa."
 wtt_xian_incident.10.t: "[PRC.GetLeader] Mengusulkan Aliansi"
 wtt_xian_incident.10.desc: "Alih-alih menggelar pengadilan sandiwara dan eksekusi mati seperti yang dicemaskan, kaum Komunis justru memberi sinyal resmi bahwa mereka lebih memilih aliansi formal menghadapi invasi Jepang.\n\nMereka jelas tengah mengulur waktu berharga, menyadari bahwa satu gempuran lagi dari kita akan melenyapkan mereka dari muka bumi. Jika mereka berniat membunuh [CHI.GetLeader], beliau pasti sudah dieksekusi sedari tadi.\n\nNamun beberapa tokoh kabinet kita bertanya-tanya mengapa kaum Komunis bersikeras mengajukan aliansi saat ini — mungkinkah mereka mengetahui bahaya yang belum kita ketahui?"
 wtt_xian_incident.10.a: "Asalkan mereka tunduk mematuhi perintah kita."
 wtt_xian_incident.10.b: "Pantang berkompromi dengan Kaum Komunis!"
 wtt_china_shared.1.t: "[From.GetNameDefCap] Menawarkan Dukungan"
 wtt_china_shared.1.desc: "[From.GetLeader] telah tiba di ibu kota kita untuk membicarakan situasi genting ini. Bertemu dengan para tokoh pejuang kemerdekaan serta petinggi kabinet kita, beliau menegaskan bahwa kemerdekaan sejati kita adalah kepentingan nasional vital bagi [From.GetNameDef], dan mereka siap menyokong setiap ikhtiar menuju kedaulatan penuh."
 wtt_china_shared.1.a: "Bantuan mereka sangat kami sambut dengan tangan terbuka."
 wtt_china_shared.1.b: "Kami sudah cukup puas dengan keadaan kami saat ini."
 wtt_china_shared.2.t: "[From.GetNameDefCap] Menerima Bantuan Kita"
 wtt_china_shared.2.desc: "Dalam perbincangan tertutup, para pejabat pemerintah [From.GetNameDef] menunjukkan minat besar pada bantuan yang sanggup kita kucurkan demi menopang kemerdekaan mereka. Dana perjuangan telah digelontorkan bagi kelompok-kelompok patriotik, dan kita telah mulai membentuk 'Pemerintahan Darurat [From.GetAdjective] Merdeka di Pengasingan'."
 wtt_china_shared.2.a: "Perjuangan mereka adalah perjuangan kita pula."
 wtt_china_shared.3.t: "[From.GetNameDefCap] Menolak Bantuan Kita"
 wtt_china_shared.3.desc: "Dalam nota bernada keras, [From.GetLeader] menegaskan bahwa pemerintahannya pantang mentolerir campur tangan pihak luar dalam urusan internal bangsa [From.GetAdjective]. Kendati protokoler diplomatik melarang penetapan [From.From.GetLeader] sebagai persona non grata, hampir seluruh delegasi perwakilan kita dilarang menginjakkan kaki kembali di [From.GetNameDef]."
 wtt_china_shared.3.a: "Sangat disayangkan."
 wtt_china_shared.4.t: "Gerakan Kemerdekaan di [From.GetNameDef] Makin Menggeliat"
 wtt_china_shared.4.desc: "Tampaknya lawatan diplomatik [From.From.GetLeader] ke [From.GetNameDef] baru-baru ini bukan sekadar jamuan minum teh santai. Belakangan ini, faksi-faksi pejuang kemerdekaan yang sebelumnya terpecah-belah mulai berkoordinasi secara rapi dan solid. Tampak jelas ada kekuatan asing yang menyokong pengorganisasian mereka dari balik layar."
 wtt_china_shared.4.a: "Sungguh perkembangan yang meresahkan."
 wtt_china_shared.10.t: "Harimau Terbang (The Flying Tigers)"
 wtt_china_shared.10.desc_a: "Soong Mei-Ling, istri tercinta Chiang Kai-Shek sekaligus salah satu penasihat terdekatnya, telah melawat ke Washington guna melobi peningkatan bantuan militer bagi Tiongkok dalam menghadapi gempuran Jepang. Angkatan Udara Tiongkok berada dalam keputusasaan akut membutuhkan pesawat tempur modern dan penerbang-penerbang ulung.\n\nPidato Soong membangkitkan simpati mendalam dari masyarakat Amerika, dan sejumlah pilot tempur kita mengundurkan diri dari dinas militer aktif untuk mendaftar pada perusahaan swasta demi memberikan 'Pelatihan dan Instruksi Tempur' kepada pilot-pilot Tiongkok.\n\nDengan terpecahkannya persoalan instruktur terbang, Soong Mei-Ling kini mendekati kita memohon izin transfer sekitar 150 pesawat tempur tercanggih kita guna memperlengkapi kembali Angkatan Udara Tiongkok."
 wtt_china_shared.10.desc_b: "Kancah pertempuran berdarah di Tiongkok telah melumpuhkan Angkatan Udara mereka. Kalah jumlah dan kalah persenjataan oleh lawan, para penerbang Tiongkok telah bertarung gagah berani mempertahankan kedaulatan langit mereka.\n\nTerlepas dari keberanian para pilot, Angkatan Udara [From.GetAdjective] kini mati-matian mencari pasokan pesawat dan penerbang baru guna mengganti kerugian mereka. Sebuah delegasi yang diutus oleh [From.GetLeader] telah tiba di Washington guna merundingkan pembelian 150 pesawat tempur modern serta izin keberangkatan sukarelawan penerbang ke Tiongkok."
 wtt_china_shared.10.a: "Kita harus menyokong mereka dengan segenap daya yang kita miliki."
 wtt_china_shared.10.b: "Kita tidak boleh membiarkan diri kita terseret ke dalam perang ini."
 wtt_china_shared.11.t: "Grup Sukarelawan Soviet"
 wtt_china_shared.11.desc_a: "Pertempuran berlarut-larut di daratan Tiongkok melahirkan kebutuhan mendesak akan perlindungan udara bagi kawan-kawan kita di Tentara Merah [From.GetAdjective]. [From.GetLeader] telah mendatangi kita memohon pengiriman kelompok penerbang dan skuadron sukarelawan. Beliau memohon sekitar 50 pembom dan 100 pesawat tempur pengawal.\n\nLangkah ini dapat menjadi sarana pelatihan berharga bagi para pilot kita serta wadah menguji coba keandalan alutsista terbaru kita di kancah pertempuran nyata."
 wtt_china_shared.11.desc_b: "Seiring membentangnya medan perang Tiongkok, Angkatan Udara [From.GetAdjective] kian kedodoran mempertahankan langit tanah air [From.GetNameDef] sekaligus menyuplai bantuan tembakan udara bagi pasukan darat. [From.GetLeader] melayangkan permohonan pribadi kepada [SOV.GetLeader] demi mengirimkan bantuan berkekuatan 50 pesawat pembom taktis dan 100 pesawat tempur.\n\nIni membuka peluang emas untuk menguji coba perlengkapan perang termutakhir kita di bawah kondisi tempur sesungguhnya."
 wtt_china_shared.11.a: "Kita wajib menyokong mereka dengan segala cara yang ada."
 wtt_china_shared.11.b: "Mereka harus bertahan dengan apa yang mereka miliki saat ini."
 wtt_china_shared.12.t: "Jenderal Baru bagi [From.GetNameDef]"
 wtt_china_shared.12.desc: "[From.GetLeader] telah berkirim surat resmi kepada [USA.GetLeader], menyarankan agar kita menugaskan salah satu Jenderal kita untuk menjabat sebagai Kepala Staf bagi Angkatan Darat [From.GetAdjective].\n\nMengabulkan permintaan ini akan mendatangkan rasa terima kasih pribadi yang mendalam dari [From.GetLeader] serta memberi pengalaman komando lapangan bernilai tinggi bagi jenderal kita demi membantu pasukan [From.GetLeader] memenangkan perang.\n\nJenderal mana yang sebaiknya kita utus ke Tiongkok?"
 wtt_china_shared.12.a: "Utus Joseph Stilwell ('Vinegar Joe')"
 wtt_china_shared.12.b: "Biarkan mereka berjuang mandiri tanpa bantuan kita."
 wtt_china_shared.12.c: "Utus Douglas MacArthur"
 wtt_china_shared.12.d: "Utus Dwight D. Eisenhower"
 wtt_china_shared.13.t: "[CHI_USA_General.GetName] Tiba di Tiongkok"
 wtt_china_shared.13.desc: "[From.GetLeader] telah mengabulkan permohonan bantuan kita dan memerintahkan [CHI_USA_General.GetName] melapor untuk bertugas di Tiongkok secepat mungkin.\n\nSang Jenderal bukan sekadar penasihat pasif bagi [Root.GetLeader], melainkan akan memegang komando pasukan tempur di garis depan, memberinya pengalaman tempur tangan pertama dalam memimpin pertempuran modern skala besar."
 wtt_china_shared.13.a: "Penambahan kekuatan kepemimpinan yang luar biasa berharga."
 wtt_china_shared.14.t: "Tiada Bantuan dari [From.GetNameDef]"
 wtt_china_shared.14.desc: "Permohonan kita kepada [From.GetLeader] menemui jalan buntu. Kendati beberapa perwira tinggi di tubuh Angkatan Darat Amerika Serikat bersedia mengemban misi tersebut, Menteri Perang dan Presiden [From.GetLeader] memveto gagasan itu karena dianggap tidak praktis serta bertentangan dengan kepentingan nasional mereka."
 wtt_china_shared.14.a: "Apakah mereka ini kumpulan orang pengecut, orang bodoh, atau keduanya sekaligus?"
 wtt_prc.1.t: "[From.GetLeader] Mengusulkan Aliansi"
 wtt_prc.1.desc: "Setelah bertahun-tahun terlibat perang saudara yang sia-sia, dan dengan bayang-bayang invasi Jepang yang kian pekat di hadapan kita, kaum komunis telah mendatangi kita menawarkan pembentukan pemerintahan bersama. Tentara kita akan bertempur bahu-membahu di garis depan, dan kita akan menyelaraskan segenap kebijakan negara.\n\nMotif di balik perubahan sikap mendadak kaum komunis ini memang mengundang tanda tanya, dan sebagian pejabat di kabinet meyakini ini hanyalah manuver tahap awal mereka untuk membajak kekuasaan atas seluruh Tiongkok."
 wtt_prc.1.a: "Kita wajib bersatu padu menghadapi musuh bersama."
 wtt_prc.1.b: "Kita pantang terperdaya oleh muslihat murahan semacam ini."
 wtt_prc.2.t: "[From.GetLeader] Menolak Tawaran Aliansi"
 wtt_prc.2.desc: "Seusai perdebatan panjang di istana, [From.GetLeader] memutuskan memulangkan delegasi kita dengan tangan hampa. Sumber intelijen kita melaporkan bahwa beliau dihantui ketakutan paranoid akan konspirasi komunis di setiap sudut dan meyakini kita berniat menggulingkan kekuasaannya serta merampas takhta kepemimpinan dari tangannya."
 wtt_prc.2.a: "Sungguh pikiran yang terlampau paranoid."
 wtt_prc.10.t: "[From.GetNameDefCap] Menuntut Kerja Sama Penuh Kita"
 wtt_prc.10.desc: "Menyusul pembentukan Pemerintahan Pertahanan Nasional, [From.GetNameDef] telah menegaskan bahwa pihaknya pantang mentolerir 'sikap sok mandiri dan pembangkangan'. Mengingat perang melawan imperialis Jepang di ambang meletus, siapa pun yang enggan merapatkan barisan di bawah panji Pertahanan Nasional akan dicap sebagai musuh bangsa, dan [From.GetLeader] secara terbuka bersumpah tidak akan menunggu perang meletus untuk menertibkan para panglima perang yang membangkang."
 wtt_prc.10.a: "Kita serahkan nasib kita bersama Pemerintahan Nasional."
 wtt_prc.10.b: "Pemberang sombong itu jelas-jelas hanya menggertak sambal."
 wtt_prc.11.t: "[From.GetNameDefCap] Bergabung dengan Pemerintahan Pertahanan Nasional"
 wtt_prc.11.desc: "[From.GetLeader] telah membuka mata hatinya dan memutuskan merapatkan barisan ke dalam Aliansi kita. Divisi-divisi tempurnya kini akan menyokong garis pertahanan kita dalam kancah laga yang menjelang."
 wtt_prc.12.t: "[From.GetNameDefCap] Menolak Bergabung"
 wtt_prc.12.desc: "Karena alasan yang sulit diterima akal sehat, [From.GetLeader] menolak bekerja sama dengan kita bahkan dalam urusan paling mendasar sekalipun. Beliau berdalih bahwa kita tak lebih dari sekadar gerombolan bandit yang sebentar lagi akan musnah, dan telah menyerukan kepada para panglima perang lainnya untuk bersatu menentang kita."
 wtt_prc.12.a: "Dia akan dipaksa berlutut mematuhi titah persatuan."
 PRC_provoke_japan_korea: "Korea"
 PRC_provoke_japan_manchuria: "Manchuria"
 wtt_prc.20.t: "Provokasi Tiongkok"
 wtt_prc.20.desc: "Bukti-bukti baru telah terkuak seputar serangan terbaru di tanah kedaulatan kita. Kendati belum ada pelaku yang tertangkap hidup-hidup, jejak di lapangan secara gamblang membuktikan bahwa insiden tersebut merupakan provokasi terencana yang dirancang oleh pihak Tiongkok.\n\nPemerintah Tiongkok secara mencurigakan bungkam mengutuk insiden tersebut, sementara media massa mereka justru mengelu-elukannya sebagai aksi kepahlawanan melawan 'Imperialisme Jepang'.\n\nKabinet telah bersidang secara darurat guna menetapkan tindakan balasan tegas atas serangan biadab ini."
 wtt_prc.20.a: "Tuntut permohonan maaf resmi."
 wtt_prc.20.b: "Mobilisasi segenap divisi tempur dan kobarkan perang!"
 wtt_prc.21.t: "Pabrik Senjata Disabotase"
 wtt_prc.21.desc: "Laporan darurat masuk dari salah satu pabrik persenjataan kita di [JAP.GetManchuriaPuppet], mengabarkan kebakaran hebat melanda fasilitas tersebut tadi malam. Regu pemadam kebakaran setempat masih berjibaku menjinakkan api, namun optimis kobaran dapat dipadamkan menjelang senja. Kerusakan fasilitas manufaktur dipastikan masif karena api bermula dari gudang penyimpanan bahan kimia yang sangat mudah meledak.\n\nPolisi Militer Kempeitai melancarkan investigasi mendalam untuk mengusut bagaimana kebakaran dapat berkobar di tengah protokol keamanan yang super ketat. Indikasi awal mengarah kuat pada aksi sabotase berencana."
 wtt_prc.21.a: "Siapakah yang berani melancarkan kejahatan ini?"
 wtt_prc.22.t: "Pabrik Sipil Disabotase"
 wtt_prc.23.t: "Jembatan Rel Diledakkan"
 wtt_prc.23.desc: "Tadi malam, jembatan rel kereta api utama di [JAP.GetManchuriaPuppet] runtuh berantakan saat dilintasi kereta pengangkut amunisi militer. Operasi evakuasi dan penyelamatan terhambat oleh rentetan ledakan sekunder amunisi yang terbakar. Awak masinis kereta masih dinyatakan hilang dan diduga tewas.\n\nSatuan Intelijen Militer mengerahkan tim investigasi khusus guna mengungkap bagaimana jembatan baja kokoh dapat roboh tanpa tanda-tanda kerusakan awal.\n\nSaksi mata warga lokal menuturkan melihat sekelompok orang mencurigakan di dasar lembah jembatan sehari sebelum insiden. Jejak mereka saat ini masih gelap."
 wtt_prc.24.t: "Patroli Disergap secara Brutal"
 wtt_prc.24.desc: "Salah satu unit patroli tentara kita di [JAP.GetManchuriaPuppet] dilaporkan hilang kontak. Regu penolong yang menelusuri rute patroli menemukan medan pembantaian yang mengerikan, dengan tanda-tanda jelas bahwa patroli disergap mendadak dan dihabisi dalam duel jarak dekat yang kejam.\n\nBelum diketahui apakah penyerang menderita korban luka, namun seluruh jenazah yang tergeletak berlumuran darah adalah prajurit Tentara Kekaisaran Jepang.\n\nJasad-jasad tersebut tampak sengaja ditinggalkan begitu saja di jalanan, seolah-olah penyerang berniat mengirimkan pesan teror kepada kita."
 wtt_japan.1.t: "[From.GetNameDefCap] Menginginkan Pertuanan atas Koloni Kita"
 wtt_japan.1.desc: "Memanfaatkan peluang yang timbul dari kelemahan kita, pihak [From.GetAdjective] telah menawarkan untuk 'membantu' kita dalam 'menjaga ketertiban' di koloni-koloni kita. Mereka berpendapat bahwa, dengan jatuhnya daratan utama kita, kita tidak memiliki peluang untuk mempertahankan kendali kita.\n\nIni jelas merupakan siasat untuk merebut kendali koloni-koloni kita, namun pilihan apa lagi yang kita miliki?"
 wtt_japan.1.a: "Sudah saatnya menerima dominasi Jepang di Timur."
 wtt_japan.1.b: "Mereka harus merebutnya dengan kekerasan!"
 wtt_japan.2.t: "[From.GetNameDefCap] Memberikan Pertuanan atas Koloni"
 wtt_japan.2.desc: "[From.GetNameDefCap] telah mempertimbangkan secara seksama tawaran kita untuk 'menjaga ketertiban' di koloni mereka, dan telah memutuskan untuk menerimanya. Mereka secara efektif telah menyerahkan kendali penuh kepada kita."
 wtt_japan.2.a: "Keputusan yang bijaksana."
 wtt_japan.3.t: "[From.GetNameDefCap] Menolak Pertuanan atas Koloni"
 wtt_japan.3.desc: "[From.GetNameDefCap] telah mempertimbangkan dengan matang tawaran kita untuk 'menjaga ketertiban' di koloni mereka, dan memutuskan untuk menolaknya."
 wtt_japan.3.a: "Kita lihat saja bagaimana nasib mereka nanti."
 wtt_japan.11.t: "Pakta Non-Agresi dengan [From.GetNameDef]"
 wtt_japan.11.desc: "Meskipun ketegangan antara [From.GetAdjective] dan [Root.GetNameDef] meningkat hingga akhir-akhir ini, pihak [From.GetAdjective] kini telah membuka perundingan untuk sebuah Pakta Non-Agresi. Keuntungan bagi kita sudah jelas, namun yang patut kita waspadai adalah keuntungan yang akan diperoleh pihak [From.GetAdjective], dan apakah kita kelak akan menyesali langkah ini."
 wtt_japan.11.a: "Kita harus menjaga perdamaian... untuk saat ini."
 wtt_japan.11.b: "Mencegah mereka meraih keuntungan adalah prioritas utama!"
 wtt_japan.12.t: "[From.GetNameDefCap] Menerima Pakta Non-Agresi"
 wtt_japan.12.desc: "[From.GetNameDefCap] telah secara resmi menerima tawaran Pakta Non-Agresi dari kita."
 wtt_japan.12.a: "Mereka masuk tepat ke dalam perangkap kita."
 wtt_japan.13.t: "[From.GetNameDefCap] Menolak Pakta Non-Agresi"
 wtt_japan.13.desc: "Entah dengan alasan apa, [From.GetNameDef] telah menolak tawaran Pakta Non-Agresi dari kita."
 wtt_japan.13.a: "Apakah mereka sedang bersekongkol melawan kita?"
 wtt_japan.21.t: "Pertukaran Jenderal [From.GetAdjective]"
 wtt_japan.21.desc: "Pihak [From.GetAdjective] telah memutuskan untuk memanggil kembali pegawai negeri dan jenderal berhaluan kiri mereka, dan sebaliknya mengirimkan jenderal serta pegawai negeri berhaluan kanan mereka kepada kita dalam pengasingan tidak resmi."
 wtt_japan.21.a: "Tampaknya sesuatu sedang bergejolak di [From.GetNameDef]..."
 wtt_japan.22.t: "Jenderal [Root.GetAdjective] Telah Ditukar"
 wtt_japan.22.desc: "Proses pertukaran jenderal dan pegawai negeri berhaluan kanan kita dengan jenderal dan pegawai negeri berhaluan kiri yang sebelumnya kita kirim ke pengasingan tidak resmi di [From.GetNameDef] kini telah selesai."
 wtt_japan.22.a: "Ini akan memperkokoh cengkeraman kita atas [Root.GetNameDef]."
 wtt_japan.31.t: "Nasib Keluarga Kekaisaran"
 wtt_japan.31.desc: "Waktunya telah tiba untuk menentukan nasib Kaisar dan keluarganya. Status sosial turun-temurun tidak memiliki tempat di Jepang baru yang sedang kita bangun. Apa yang harus kita lakukan terhadap mereka?"
 wtt_japan.31.a: "Asingkan mereka!"
 wtt_japan.31.b: "Penggal kepala mereka!"
 wtt_japan.32.t: "Keluarga Kekaisaran yang Terasing"
 wtt_japan.32.desc: "[From.GetNameDefCap] telah mengasingkan keluarga kekaisaran, memberikan anugerah besar bagi kita dengan melakukannya! Beliau kini telah tiba di [Root.GetNameDef], dan terlepas dari pengasingannya, pengaruh beliau di mata rakyat dan pasukan masih sangat besar."
 wtt_japan.32.a: "Kita harus layak menjadi rumah bagi beliau!"
 wtt_japan.101.t: "Reunifikasi Manchuria"
 wtt_japan.101.desc: "Dengan kemenangan mereka baru-baru ini melawan [MAN.GetName], pemerintah Jepang kini mengakui ikatan Tiongkok dengan wilayah tersebut, dan segera mengalihkan seluruh kendali kepada kita. Dengan gestur itikad baik ini, mereka menawarkan persekutuan kepada kita."
 wtt_japan.101.a: "Mungkin bangsa Jepang memang masih bisa diajak berunding."
 wtt_japan.101.b: "Kita terima Manchuria, tapi bukan kebaikan mereka."
 wtt_japan.102.desc: "[From.GetNameDefCap] berterima kasih kepada kita atas pengembalian Manchuria, dan telah menerima tawaran persekutuan kita."
 wtt_japan.103.desc: "[From.GetNameDefCap] berterima kasih kepada kita atas pengembalian Manchuria, namun menolak tawaran persekutuan kita."
 wtt_japan.104.t: "Kedaulatan Filipina"
 wtt_japan.104.desc: "[From.GetNameDefCap] telah membuat pernyataan terbuka dan tegas bahwa mereka 'tidak dapat lagi tinggal diam dan menyaksikan' sebuah bangsa di kawasan pengaruh mereka terus hidup di bawah sepatu lars Barat. Mereka kini menuntut agar kita mempercepat garis waktu dekolonisasi dan memberikan kedaulatan penuh kepada Filipina secepatnya."
 wtt_japan.104.a: "Mereka benar. Filipina berhak atas kebebasan mereka."
 wtt_japan.104.b: "Filipina akan tetap menjadi milik Amerika!"
 wtt_japan.105.desc: "[From.GetNameDefCap] telah menanggapi tuntutan kita demi kemerdekaan penuh Filipina, dan pemerintah Amerika kini telah melakukan persiapan segera untuk memberikan kedaulatan penuh kepada wilayah Pasifik mereka."
 wtt_japan.105.a: "Setidaknya mereka masih berpikir jernih."
 wtt_japan.106.desc: "[From.GetNameDefCap] telah menanggapi tuntutan kita demi kemerdekaan penuh Filipina, dengan menegaskan kembali 'kepentingan vital Amerika' yang diwakili oleh Filipina di kawasan tersebut."
 wtt_japan.106.a: "Dan mereka menyebut diri mereka 'pembela Kebebasan'?"
 wtt_japan.107.desc: "[From.GetNameDefCap] telah menanggapi tuntutan Jepang demi kemerdekaan penuh kita, dan pemerintah Amerika kini telah melakukan persiapan segera untuk memberi kita kedaulatan penuh!"
 wtt_japan.107.a: "Pujilah bangsa Jepang!"
 wtt_japan.108.t: "Kudeta Perwira Muda"
 wtt_japan.108.desc: "Sekelompok perwira muda telah berhasil membunuh sejumlah pejabat pemerintah serta perdana menteri. Mereka telah menduduki kota Tokyo dan mengamankan Istana Kekaisaran, seraya mengumumkan niat mereka untuk membersihkan pemerintahan dari 'pejabat korup' dan 'ancaman ideologis', demi memulihkan Kaisar sebagai penguasa tunggal bangsa.\n\nTindakan mereka memperoleh dukungan militer yang luar biasa besar, di mana operasi tandingan yang direncanakan berhasil digagalkan lewat penangkapan massal dan pembunuhan terhadap elemen-elemen yang setia kepada pemerintah lama. Dihadapkan pada peristiwa yang begitu mendadak dan tak terbendung, serta kendali para pemberontak atas istana, Kaisar tidak menunjukkan tanda-tanda mengecam aksi mereka.\n\nPerlawanan terorganisir pemerintah tampaknya telah runtuh, dan para pemberontak diperkirakan akan segera mengumumkan berlakunya kendali Kekaisaran secara mutlak atas seluruh bidang kebijakan domestik, luar negeri, dan militer."
 wtt_japan.108.a: "Tennōheika Banzai!"
 wtt_japan.109.t: "Jepang Mengusulkan Pakta Tripartit"
 wtt_japan.109.desc: "[From.GetNameDefCap] telah mengirimkan utusan penjajakan untuk memastikan minat kita terhadap pakta tiga kekuatan antara kita, pihak [JAP_initiator.GetAdjective], dan pihak [ITA_fascism.GetAdjective]. Pihak [JAP_initiator.GetAdjective] berpendapat bahwa kita harus saling mendukung mengingat opini global yang kian memusuhi perjuangan kita."
 wtt_japan.109.a: "Gagasan yang luar biasa. Kita akan menandatangani Pakta ini."
 wtt_japan.109.b: "Tidak, kita tidak boleh mengambil risiko memusuhi dunia."
 wtt_japan.110.desc: "[JAP_initiator.GetNameDefCap] telah mengirim utusan penjajakan untuk memastikan minat kita terhadap pakta tiga kekuatan antara kita, pihak [JAP_initiator.GetAdjective], dan pihak [GER_fascism.GetAdjective]. Pihak [JAP_initiator.GetAdjective] berpendapat bahwa saling mendukung adalah keharusan di tengah opini global yang kian memusuhi perjuangan kita. Pihak [GER_fascism.GetAdjective] telah menyatakan persetujuannya terhadap gagasan ini."
 wtt_japan.111.t: "Pakta Tripartit Ditandatangani"
 wtt_japan.111.desc: "Pemerintah [GER_fascism.GetAdjective] dan [ITA_fascism.GetAdjective] telah sepakat untuk menandatangani rancangan Pakta Tripartit, berikrar untuk berdiri di sisi kita apabila perang meletus."
 wtt_japan.112.t: "[From.GetNameDefCap] Menolak Pakta Tripartit"
 wtt_japan.112.desc: "Pemerintah [From.GetAdjective] telah menolak usulan Pakta Tripartit, memilih untuk berjuang sendirian."
 wtt_japan.113.t: "[From.GetNameDefCap] Menandatangani Pakta Tripartit"
 wtt_japan.113.desc: "Pemerintah [ITA_fascism.GetAdjective] telah sepakat untuk menandatangani usulan Pakta Tripartit, berikrar untuk berdiri di sisi kita apabila perang meletus."
 wtt_japan.114.t: "Elemen Demokratis Melancarkan Kudeta"
 wtt_japan.114.desc: "Elemen-elemen demokratis di dalam tubuh pemerintahan telah memprakarsai pengambilalihan negara secara mengejutkan, setelah pihak militer mengancam akan kembali mengekang hak-hak demokratis rakyat yang diperoleh dengan susah payah. Dengan ketangkasan yang mencengangkan, sebagian besar militer justru angkat senjata demi membela rakyat dan hak-hak kebebasan mereka.\n\nPerpecahan di tubuh militer ini memungkinkan perwakilan rakyat merebut kekuasaan di cabang legislatif dan eksekutif. Kendati pertempuran baru saja dimulai, kecil kemungkinan pemerintahan saat ini dapat digulingkan dengan mudah."
 wtt_japan.114.a: "Jangan biarkan militer memerintah kita lagi!"
 wtt_japan.115.t: "[From.GetName] Menyerang Uni Soviet"
 wtt_japan.115.desc: "[From.GetNameDefCap] telah menyerang Uni Soviet secara sepihak, mengabaikan pakta non-agresi kita dengan mereka. Kita tidak punya pilihan lain selain menghormati persekutuan kita dan mendukung serangan [From.GetAdjective], atau menghormati pakta non-agresi kita dengan Soviet dan mengecam serangan tersebut."
 wtt_japan.115.a: "Kita akan bergabung dengan sekutu kita!"
 wtt_japan.115.b: "Perjanjian kita tak boleh dilanggar... Untuk saat ini."
 wtt_japan.116.t: "[From.GetName] Bergabung dalam Perang"
 wtt_japan.116.desc: "[From.GetNameDefCap] telah memutuskan untuk bergabung dalam perang kita melawan Soviet, mengabaikan pakta non-agresi mereka sebelumnya."
 wtt_japan.116.a: "Sudah seharusnya demikian."
 wtt_japan.117.t: "[From.GetName] Mengecam Perang Kita"
 wtt_japan.117.desc: "[From.GetNameDefCap] telah memutuskan untuk menghormati pakta non-agresi mereka dengan Soviet, mengabaikan komitmen mereka kepada kita sebagai sekutu. Mereka telah mengecam agresi kita, yang tampaknya merupakan upaya untuk menyelamatkan situasi diplomatik dengan sesama anggota pakta."
 wtt_japan.117.a: "Sungguh sangat disayangkan."
 wtt_japan.118.t: "[From.GetName] Memohon Bantuan"
 wtt_japan.118.desc: "[From.GetNameDefCap] saat ini tengah terjebak dalam perang saudara yang menghancurkan, dan kesulitan mengimbangi kekuatan militer musuh mereka. Pemerintahan transisi mereka kini telah mendekati perwakilan kita dengan tawaran untuk menyerahkan semenanjung Sakhalin Selatan demi mendapatkan bantuan militer yang sangat mereka butuhkan.\n\nIni bisa menjadi cara mudah untuk memperoleh wilayah sebagai imbalan atas pengiriman divisi sukarelawan."
 wtt_japan.118.a: "Gagasan yang sangat bagus!"
 wtt_japan_118_TT: "Para sukarelawan ini akan dikembalikan ke cadangan tenaga manusia jika §Y[From.GetName]§! memenangkan perang saudara."
 wtt_japan.118.b: "Ini bukan pertukaran yang menguntungkan bagi kita."
 wtt_japan.119.t: "[From.GetName] Menerima Pertukaran"
 wtt_japan.119.desc: "[From.GetNameDefCap] telah menerima tawaran kita untuk menukar Semenanjung Sakhalin Selatan dengan dukungan militer. Mereka telah mengerahkan beberapa divisi 'sukarelawan' untuk membantu perjuangan kita!"
 wtt_japan.119.a: "Mereka akan sangat berguna!"
 wtt_japan.119.TT: "Dapatkan 8 unit dengan §Y12 batalion infanteri§! dan §Y3 batalion bantuan§!."
 wtt_japan.120.t: "[From.GetName] Menolak Pertukaran"
 wtt_japan.120.desc: "[From.GetNameDefCap] telah memberitahu kita bahwa mereka menolak tawaran untuk menukar Semenanjung Sakhalin Selatan demi dukungan militer."
 wtt_japan.120.a: "Kita kini harus berjuang sendiri..."
 wtt_japan.121.t: "[From.GetName] Merebut Tokyo"
 wtt_japan.121.desc: "[From.GetNameDefCap] telah merebut ibu kota Jepang, dan pemerintah fasis [From.From.GetAdjective] telah runtuh. Jika kita ingin bertindak, kita harus melakukannya saat ini juga. Sangat penting bagi kita untuk bergerak cepat mengamankan kendali atas pulau-pulau luar Jepang dan mengambil alih komando elemen fasis yang tersisa, jika kita ingin membendung ancaman komunis."
 wtt_japan.121.a: "Jalankan rencana ini."
 wtt_japan.121.b: "Hal ini tidak menarik bagi kita saat ini."
 wtt_japan.122.t: "Kaum Fasis Melarikan Diri ke Manchuria"
 wtt_japan.122.desc: "Dengan jatuhnya Tokyo, pemerintah fasis telah runtuh dan para pendukung serta unit militer mereka yang tersisa melarikan diri ke [MAN.GetName], yang telah mengambil alih kendali atas pulau-pulau terluar serta wilayah kekuasaan di Korea dan Tiongkok.\n\nPerang saudara secara efektif telah berakhir, namun gencatan senjata ini sangat rapuh, karena kaum fasis belum sepenuhnya ditumpas secara telak."
 wtt_japan.122.a: "Kita akan berurusan dengan mereka nanti."
 wtt_japan.123.t: "Perlawanan Fasis Runtuh"
 wtt_japan.123.desc: "Dengan jatuhnya Tokyo, rezim fasis telah hancur lebur. Para pendukung dan unit militer mereka yang tersisa tidak lagi memiliki tempat bergantung dan mulai tercerai-berai, memungkinkan penguasaan yang mudah atas wilayah-wilayah yang tersisa dan terluar."
 wtt_japan.123.a: "Perang telah dimenangkan."
 wtt_japan.124.t: "Sukarelawan Kembali Pulang"
 wtt_japan.124.desc: "Dengan kemenangan komunis di Jepang, para sukarelawan kita yang selamat kini telah kembali ke tanah air."
 wtt_japan.125.t: "Soviet Mengembalikan Manchuria"
 wtt_japan.125.desc: "Setelah membebaskan Manchuria dari cengkeraman Jepang dan menggulingkan kaisar Qing yang digulingkan, [From.GetNameDef] kini menawarkan pengembalian Manchuria kepada kita, seraya menyatakan bahwa wilayah itu harus kembali ke tangan sah [Root.GetAdjective]."
 wtt_japan.126.t: "[From.GetName] Menawarkan Perdamaian"
 wtt_japan.126.desc: "Para pejabat [From.GetAdjective] telah mendekati kita dengan tawaran perdamaian. Mereka bersedia angkat kaki sepenuhnya dari benua ini, sebagai imbalan atas penghentian permusuhan segera."
 wtt_japan.126.a: "Perang telah dimenangkan."
 wtt_japan.126.b: "Kita hanya akan puas dengan kemenangan mutlak!"
 wtt_japan.127.t: "[From.GetName] Menerima Perdamaian"
 wtt_japan.127.desc: "[From.GetNameDef] telah menerima tawaran perdamaian kita, dan telah menghentikan permusuhan sebagai imbalan atas wilayah kekuasaan kita di benua Asia."
 wtt_japan.127.a: "Mereka telah mengungguli kita... Untuk saat ini."
 wtt_japan.128.t: "[From.GetName] Menolak Perdamaian"
 wtt_japan.128.desc: "[From.GetNameDef] telah menolak tawaran perdamaian kita, bersumpah untuk terus berperang hingga memperoleh penyerahan tanpa syarat."
 wtt_japan.128.a: "Maka kita akan bertempur sampai titik darah penghabisan!"
 wtt_japan.40.t: "[From.GetLeader] Menuntut Manchuria"
 wtt_japan.40.desc: "Beberapa hari yang lalu, pemerintah [From.GetNameDef] mulai melancarkan upaya terpadu untuk menekan kita. Artikel utama di surat kabar menuntut agar kita mengembalikan Manchuria ke dalam kendali [From.GetAdjective]. Ini bukan sekadar manuver propaganda untuk konsumsi internal semata, sebab utusan [From.GetLeader] telah menjajaki kita melalui jalur belakang diplomatik untuk mencapai kesepakatan mengenai masa depan wilayah Manchuria.\n\nHari ini, [From.GetLeader] sendiri angkat bicara mengenai persoalan tersebut, menuntut pengembalian penuh Manchuria kepada [From.GetNameDef] sesegera mungkin. Jika tidak, pemerintahnya terpaksa meninjau kembali kerja sama kita saat ini."
 wtt_japan.40.a: "Wilayah itu milik mereka."
 wtt_japan.40.b: "Mereka belum siap untuk memerintah diri sendiri."
 wtt_japan.41.t: "Bantuan Militer dari [From.GetNameDef]"
 wtt_japan.41.desc: "Markas Besar Kekaisaran Jepang telah memutuskan pergeseran mendasar dalam pandangan strategis mereka. Dalam konferensi bersama Kaisar, Menteri Angkatan Darat mempresentasikan rencana baru yang berasumsi bahwa perang melawan Uni Soviet akan pecah dalam waktu dekat. Demi mempersiapkan perang ini, Angkatan Darat Kekaisaran Jepang memutuskan bahwa militer kita harus mampu mempertahankan sebagian garis depan. Untuk tujuan ini, sejumlah besar perlengkapan yang hanya sedikit usang telah disediakan."
 wtt_japan.41.a: "Sungguh baik hati mereka."
 wtt_news.25.t: "[JAP.GetNameDefCap] Mengambil Alih Kendali atas Koloni [From.GetAdjective]"
 wtt_news.25.desc: "Mengingat kelemahan [From.GetNameDef] saat ini, tidaklah mengejutkan bahwa pihak [JAP.GetAdjective] telah meningkatkan tekanan untuk menguasai wilayah jajahan [From.GetAdjective] di Asia Timur. Pagi ini, para pejabat dari pemerintah [From.GetAdjective] membuat pengumuman mengejutkan bahwa kendali atas koloni-koloni [From.GetAdjective] dialihkan kepada [JAP.GetNameDef], berlaku sesegera mungkin."
 wtt_news.25.a: "Asia untuk bangsa Asia!"
 wtt_news.25.b: "Hari yang menyedihkan bagi Eropa..."
 wtt_news.25.c: "Apakah ini akhir dari kolonialisme?"
 wtt_news.26.t: "Kemerdekaan Filipina"
 wtt_news.26.desc: "Sebagai akibat dari tekanan [JAP.GetAdjective], pemerintah [From.GetAdjective] kini telah mengumumkan penghentian segera kekuasaan kolonial [From.GetAdjective] atas kepulauan tersebut. Mulai hari ini, kedaulatan penuh telah diserahkan kepada [PHI.GetNameDef]."
 wtt_news.26.b: "Bagaimanapun juga, kita memang berniat melakukan dekolonisasi."
 wtt_news.26.c: "Hari yang penuh sukacita!"
 wtt_news.27.t: "Kudeta Perwira Muda Jepang"
 wtt_news.27.desc: "Sekelompok perwira muda telah berhasil menggulingkan pemerintah dan memulihkan Kaisar sebagai penguasa tertinggi bangsa Jepang. Tampaknya ini merupakan reaksi terhadap ancaman korupsi pemerintah yang meluas dan para pengikut ideologi yang bermusuhan.\n\nDengan semakin konsisten menyebut negara dalam istilah Kekaisaran, para perwira telah mengumumkan bahwa pembersihan akan terus berlanjut hingga 'semua elemen yang tidak diinginkan telah disingkirkan dari militer dan pemerintahan'. Kaisar Hirohito sendiri telah merilis pernyataan singkat menerima kepemimpinan yang ditawarkan kepadanya oleh para pemberontak, dan menyampaikan sinyal rekonsiliasi yang jelas dengan Tiongkok serta kekuatan kolonial Barat di Pasifik."
 wtt_news.27.a: "Banzai!"
 wtt_news.27.b: "Kabar yang mencemaskan... Mereka tidak menunjukkan sinyal seperti itu kepada kita..."
 wtt_news.27.c: "Apakah ini menjamin perdamaian di Pasifik?"
 wtt_news.27.d: "Pembalikan peristiwa yang mendadak."
 wtt_news.30.t: "Chiang Kai-Shek Dieksekusi"
 wtt_news.30.desc: "Menyusul penangkapannya oleh [CHI_xian_instigator.GetLeader], Chiang Kai-Shek dilaporkan telah ditembak mati oleh regu tembak Komunis pagi ini. Setelah persidangan kilat atas kejahatan terhadap rakyat dan partai, [PRC.GetLeader] menjatuhkan vonis mati kepada Chiang Kai-Shek. Bahkan intervensi langsung dari perwakilan Pemerintah Soviet tidak cukup untuk menyelamatkan nyawanya.\n\n[SOV.GetLeader] dilaporkan sangat murka atas 'pengkhianatan' oleh [PRC.GetLeader] ini dan telah memerintahkan penangkapan delegasi Komintern Tiongkok.\n\nPemimpin Nasionalis baru [CHI.GetLeader] telah bersumpah bahwa kematian Chiang akan dibalas dan kaum Komunis akan 'dimusnahkan'."
 wtt_news.30.a: "Ia mendapatkan apa yang layak diterimanya."
 wtt_news.30.b: "Mereka melakukan pembunuhan dan menyebutnya keadilan!"
 wtt_news.30.c: "Ini akan memicu konsekuensi serius."
 wtt_news.30.d: "Tiongkok akan semakin tidak stabil."
 wtt_news.31.t: "Chiang Kai-Shek Dieksekusi"
 wtt_news.31.desc: "Menyusul penangkapannya oleh [CHI_xian_instigator.GetLeader], Chiang Kai-Shek dilaporkan telah dihukum mati oleh regu tembak komunis pagi ini. Setelah pengadilan singkat atas tuduhan kejahatan terhadap rakyat dan partai, pengkhianatan tingkat tinggi, serta aktivitas kontra-revolusioner, [PRC.GetLeader] membacakan vonis mati untuk Chiang Kai-Shek. Perwakilan Soviet bertindak sebagai jaksa dalam persidangan tersebut, memicu spekulasi bahwa [SOV.GetLeader] secara diam-diam menyetujui keputusan ini.\nPemimpin Nasionalis baru [CHI.GetLeader] telah berikrar bahwa kematian Chiang akan dibalas dan kaum Komunis akan 'dimusnahkan'."
 wtt_news.31.c: "Kita mengambil keputusan yang tepat."
 wtt_news.32.t: "Chiang Kai-Shek Dibebaskan dari Tahanan Rumah"
 wtt_news.32.desc: "Setelah ditangkap oleh [CHI_xian_instigator.GetLeader] dan diserahkan kepada pihak komunis, [CHI.GetLeader] dilaporkan telah kembali ke kediamannya menyusul perundingan yang alot. Laporan masih belum lengkap, namun bukti-bukti mengindikasikan bahwa [PRC.GetLeader] menawarkan persekutuan melawan Jepang. Kedua belah pihak telah membantah rumor tersebut, dengan [PRC.GetLeader] menyatakan bahwa ia lebih suka melihat negeri ini menjadi abu daripada bersekutu dengan kaum Nasionalis, sebuah sentimen yang langsung dibalas setimpal oleh [CHI.GetLeader]."
 wtt_news.32.a: "Rencana apa yang sedang mereka siapkan terhadap kita?"
 wtt_news.32.c: "Seperti anak-anak yang bertengkar..."
 wtt_news.32.d: "Jepang akan memanfaatkan situasi ini demi keuntungan mereka."
 wtt_news.32.e: "Kita bisa memanfaatkan ini untuk keuntungan kita."
 wtt_news.33.t: "[PRC.GetLeader] Mengecam Pengkhianatan Nasionalis"
 wtt_news.33.desc: "\nMenyusul pertemuan antara [CHI.GetLeader] dan [PRC.GetLeader], pihak terakhir mengecam apa yang ia sebut sebagai 'upaya terang-terangan dan murahan untuk mencaplok Tentara Merah demi kepentingan Nasionalis dan kontra-revolusioner.' [CHI.GetLeader] menolak berkomentar mengenai isu ini, hanya menyatakan bahwa tentara Nasionalis siap membela Tiongkok dari penyerang mana pun.\n\nKabarnya, kedua pemimpin tersebut sempat membahas kemungkinan pembentukan Front Persatuan melawan Jepang.\n\nApakah kebuntuan ini akan berujung pada pecahnya kembali konflik antara kedua pihak masih harus dilihat."
 wtt_news.33.b: "Mengapa kita sempat berpikir bahwa mereka akan berubah?"
 wtt_news.34.t: "Macan Terbang (Flying Tigers) Dibentuk"
 wtt_news.34.desc: "Menanggapi permohonan Tiongkok agar pilot dan mekanik Amerika bergabung dalam unit sukarelawan, Presiden AS [USA.GetLeader] secara resmi telah menyetujui transfer lebih dari seratus pesawat tempur modern ke Angkatan Udara Tiongkok. Pilot di Angkatan Darat, Angkatan Laut, atau Korps Marinir AS juga diberi izin cuti untuk bergabung dengan unit ini.\n\nKapal-kapal pertama yang mengangkut pesawat tempur baru tersebut dijadwalkan berangkat segera setelah perlengkapan yang diperlukan terkumpul. Para pemimpin Kongres menyatakan keprihatinan bahwa tindakan yang menyerempet batas hukum internasional seperti ini akan mengundang dampak balasan."
 wtt_news.34.a: "Selamat berburu!"
 wtt_news.34.b: "Kedatangan mereka sangat disambut baik."
 wtt_news.34.c: "Sukarelawan? Lebih mirip Tentara Bayaran!"
 wtt_news.34.d: "Akhir dari isolasionisme AS?"
 wtt_news.35.t: "Insiden Shanghai"
 wtt_news.35.desc: "Ketegangan antara Tiongkok dan Jepang meningkat tajam menyusul bentrokan di Shanghai tadi malam.\n\nLaporan para pengamat barat mengindikasikan bahwa perkelahian massal pecah antara Polisi Tiongkok dan sekelompok pelaut Jepang, di mana kedua pihak menderita luka-luka. Ketika patroli Jepang tiba untuk menyelidiki, unit Tentara Tiongkok telah memblokir semua akses ke lokasi dan menangkap para pelaut Jepang, yang akan didakwa atas percobaan pembunuhan.\n\nPemerintah Jepang telah mengeluarkan peringatan keras bahwa, kecuali para pelaut itu dibebaskan seketika, tindakan tegas akan diambil untuk membebaskan mereka."
 wtt_news.35.a: "Keterlaluan!"
 wtt_news.35.b: "Semua berjalan sesuai rencana."
 wtt_news.35.c: "Bau mesiu dan perang mulai tercium."
 wtt_news.35.d: "Tampaknya ini sudah direncanakan sebelumnya."
 wtt_news.36.t: "Chiang Kai-Shek Tewas dalam Kecelakaan Pesawat"
 wtt_news.36.desc: "Tragedi melanda [CHI.GetNameDef] tadi pagi saat pesawat yang membawa Chiang Kai-Shek meledak di udara sesaat setelah lepas landas. Tim penyelamat masih menyisir puing-puing reruntuhan, namun sedikit yang masih berharap akan menemukan korban selamat dari antara awak dan penumpang.\n\nBaik Generalissimo maupun istrinya diduga kuat telah tewas.\n\nPemimpin baru Tiongkok [CHI.GetLeader] telah berjanji akan melakukan penyelidikan menyeluruh terhadap penyebab bencana ini. Rumor beredar luas mengenai adanya konspirasi untuk menghabisi sang Generalissimo, yang dipandang oleh banyak kalangan sebagai batu sandungan dalam menyatukan berbagai faksi di Tiongkok."
 wtt_news.36.a: "Berkurang satu masalah yang harus dirisaukan."
 wtt_news.36.b: "Ini jelas bukan kecelakaan biasa."
 wtt_news.36.d: "Sungguh tragis."
 wtt_news.37.t: "Republik Rakyat Tiongkok Diproklamasikan"
 wtt_news.37.desc: "Dalam pidato kemenangannya, [PRC.GetLeader] menyatakan bahwa 'rakyat Tiongkok telah bangkit berdiri' dan menghantarkan kaum Komunis meraih kemenangan dalam Perang Saudara Tiongkok. Dengan mundurnya kaum Nasionalis secara menyeluruh, Partai Komunis akhirnya mengamankan kemenangan setelah pertikaian selama berdekade-dekade. Mulai saat ini, kelompok pemberontak kecil yang tadinya bersembunyi di desa-desa pegunungan terpencil telah menjadi pemerintahan penuh di Republik Rakyat Tiongkok."
 wtt_news.37.a: "Hari yang agung."
 wtt_news.37.b: "Sekadar formalitas belaka."
 wtt_news.37.d: "Mereka tidak akan pernah mencapai apa pun."
 wtt_news.38.t: "[PRC.GetLeader] Memenangkan Perebutan Kekuasaan Internal"
 wtt_news.38.desc: "Pertikaian antarfaksi internal di tubuh Partai Komunis Tiongkok tampaknya telah mereda, dengan [PRC.GetLeader] tampil sebagai pemimpin tertinggi. Mao Tse-Tung dan faksi-faksi yang lebih moderat kehilangan pengaruh yang signifikan, karena [PRC.GetLeader] yang didukung Soviet berhasil mengungguli manuver mereka berdua. Peran apa, jika ada, yang dimainkan [SOV.GetLeader] dalam peristiwa ini menjadi bahan perdebatan hangat."
 wtt_news.38.a: "Semoga beliau memimpin kita menuju kemenangan!"
 wtt_news.38.b: "Tidak penting."
 wtt_news.38.c: "Sekutu yang berguna."
 wtt_news.38.d: "Ia mewarisi posisi yang sangat sulit."
 wtt_news.39.t: "Kampanye Pasifikasi Tiongkok"
 wtt_news.39.desc: "Menyusul serangkaian insiden yang digambarkan sebagai 'provokasi terang-terangan', pemerintah Jepang telah menyatakan bahwa keadaan 'konflik bersenjata' kini berlangsung di Tiongkok. Mereka mengklaim bahwa pemerintah pusat [CHI.GetLeader] menunjukkan ketidakmauan atau ketidakmampuan untuk menindak tegas pihak-pihak yang bertanggung jawab. Oleh karena itu, mereka mengumumkan bahwa pasukan 'penjaga perdamaian' tentara Jepang telah dikerahkan ke negeri tersebut demi memulihkan ketertiban dan mencegah serangan lanjutan."
 wtt_news.39.a: "Sesuai rencana."
 wtt_news.39.b: "Siapa yang melakukan ini?"
 wtt_news.39.c: "Apa yang telah kita perbuat!?"
 wtt_news.39.d: "Alasan yang mengada-ada."
 wtt_news.39.e: "Mereka akan menyadari kekeliruan langkah mereka."
 wtt_warlord.1.t: "[From.GetNameDefCap] Menawarkan Ketundukan"
 wtt_warlord.1.desc: "Dengan pemerintah pusat Tiongkok yang sama sekali tak sanggup menjamin keselamatan rakyatnya dari bandit dan komunis, [From.GetLeader] akhirnya menyadari posisinya dan menghubungi kita dalam upaya mengamankan kedudukannya. Ia bersedia bekerja sama penuh dan mengizinkan perlintasan bebas bagi pasukan kita. Sebagai imbalannya, ia hanya meminta agar kita menempatkan sejumlah pasukan guna melindungi wilayahnya dan mengingat jasanya kelak saat kita selesai menata ulang Tiongkok."
 wtt_warlord.1.a: "Akhirnya, seseorang yang berpikiran rasional!"
 wtt_warlord.1.b: "Tidak ada tempat bagi mereka dalam rencana kita."
 wtt_warlord.2.t: "[From.GetNameDefCap] Menerima"
 wtt_warlord.2.desc: "Pemerintah [From.GetAdjective] telah menerima usulan kita. Sebagai imbalan atas perlindungan mereka, kita diminta untuk 'mempertimbangkan dengan sungguh-sungguh' nasihat yang diberikan mengenai bagaimana kita bertindak. Seorang pejabat pemerintah [From.GetAdjective] telah tiba untuk mengoordinasikan kebijakan kita."
 wtt_warlord.2.a: "Harga kecil demi kelangsungan hidup kita."
 wtt_warlord.3.t: "[From.GetNameDefCap] Menolak"
 wtt_warlord.3.desc: "Pemerintah [From.GetAdjective] telah mengembalikan nota kita dengan penolakan mentah-mentah untuk membahasnya, menyatakan bahwa kita tidak memiliki wewenang untuk berunding dengan pemerintah nasional yang sah."
 wtt_warlord.3.a: "Kita akan tumbuh kuat dan membuktikan kemampuan kita kepada mereka."
 wtt_britain_lease_azores.1.t: "[From.GetNameDefCap] Meminta Sewa Kepulauan Azores"
 wtt_britain_lease_azores.1.desc: "Pihak [From.GetAdjective] telah mendekati kita dengan permintaan untuk menyewa Kepulauan Azores selama masa perang. Lokasi strategis kepulauan ini menjadikannya pangkalan penting untuk mengawal jalur pelayaran melintasi Samudra Atlantik. Kepulauan tersebut akan dikembalikan setelah permusuhan usai."
 wtt_britain_lease_azores.1.a: "Lebih baik daripada menyeret kita ke dalam kancah perang..."
 wtt_britain_lease_azores.1.b: "Di mana keuntungan bagi kita?"
 wtt_britain_lease_azores.2.t: "[From.GetNameDefCap] Menerima"
 wtt_britain_lease_azores.2.desc: "Pemerintah [From.GetAdjective] telah menyetujui permintaan kita dan memberi kita kendali penuh atas Azores, dengan pemahaman bahwa kita kini bertanggung jawab untuk melindunginya dari serangan apa pun. Pasukan pendahulu kecil telah tiba di kepulauan tersebut untuk mendirikan pangkalan operasi."
 wtt_britain_lease_azores.2.a: "Ini akan terbukti sangat berguna."
 wtt_britain_lease_azores.3.t: "[From.GetNameDefCap] Menolak"
 wtt_britain_lease_azores.3.desc: "Menyatakan sikap netralitas serta hukum perang, pemerintah [From.GetLeader] telah menolak permintaan kita atas hak pangkalan di Azores. Kecuali kita menemukan cara untuk membawa mereka ke dalam perang di pihak kita, kepulauan itu tetap tertutup bagi kita."
 wtt_britain_lease_azores.3.a: "Kita akan mengingat perlakuan ini."
 wtt_britain_lease_azores.4.t: "Sewa Azores Telah Berakhir"
 wtt_britain_lease_azores.4.desc: "Dengan berakhirnya permusuhan di Eropa, pemerintah [POR.GetAdjective] mengingatkan kita bahwa sewa Azores hanya berlaku selama masa perang. Waktunya telah tiba untuk mengembalikan kendali atas kepulauan itu kepada mereka."
 wtt_britain_lease_azores.4.a: "Bangsa Inggris selalu melunasi kewajibannya."
 wtt_britain_lease_azores.5.t: "Inggris Meninggalkan Azores"
 wtt_britain_lease_azores.5.desc: "Dengan perang di Eropa yang telah usai, [From.GetNameDef] telah menghormati perjanjian kita dan mengembalikan Kepulauan Azores kepada kita. Kita telah mengirim sekelompok administrator untuk mengambil alih kendali kembali."
 wtt_britain_lease_azores.5.a: "Hasil terbaik yang bisa diharapkan."
 wtt_soviet_hold_city_t_success: "[soviet_city.GetName] Bertahan Kokoh"
 wtt_soviet_hold_city_d_success: "Meskipun diterjang gempuran musuh, para pembela [soviet_city.GetName] tetap teguh bertahan dan memukul mundur musuh. Pasukan penyerbu menderita kerugian darah yang luar biasa di hadapan garis pertahanan, membayar mahal untuk setiap sentimeter tanah yang direbut. Kisah-kisah Pahlawan [state.GetName] akan dikenang turun-temurun hingga generasi mendatang!"
 wtt_soviet_hold_city_o_success: "[soviet_city.GetName] akan tetap menjadi milik kita!"
 wtt_soviet_hold_city_t_fail: "[soviet_city.GetName] Jatuh"
 wtt_soviet_hold_city_d_fail: "Mengerahkan segenap kekuatan yang tersedia, para penyerbu [controller.GetAdjective] menghancurkan pertahanan kita di luar [soviet_city.GetName]. Pasukan [controller.GetAdjective] telah memasuki kota. Saat pasukan pertahanan kita bertempur sengit dalam perang kota yang brutal, kota ini diperkirakan akan jatuh dalam hitungan hari."
 decisions.1.t: "Loyalitas Komando Angkatan Darat Tingkat Bawah"
 decisions.1.desc: "Perwira tertentu di eselon bawah militer telah menyatakan pandangan 'alternatif' mengenai kepemimpinan negara. Untuk membatasi kecurigaan, kita harus membatasi upaya kita dengan hanya mendekati satu calon pendukung, dan kita tidak boleh menghemat sumber daya dalam membeli loyalitas mereka."
 decisions.1.a: "Siapa pun boleh, kita hanya butuh seseorang untuk memimpin pasukan kita."
 decisions.1.b: "Kita membutuhkan seseorang yang setidaknya memahami tugasnya."
 decisions.1.c: "Kualitas adalah yang terpenting, kita tidak boleh berkompromi soal biaya."
 decisions.1.d: "Hanya yang terbaik dari yang terbaik yang dapat diterima."
 decisions.2.t: "Loyalitas Komando Angkatan Darat Tingkat Atas"
 decisions.2.desc: "Perwira tertentu di eselon atas militer telah menyatakan pandangan 'alternatif' mengenai kepemimpinan negara. Untuk membatasi kecurigaan, kita harus membatasi upaya kita dengan hanya mendekati satu calon pendukung, dan kita tidak boleh menghemat sumber daya dalam membeli loyalitas mereka."
 wtt_soviet_hold_city_o_fail: "Kemunduran kecil belaka."
 wtt_news.40.t: "Terusan Suez Diledakkan"
 wtt_news.40.desc_eng: "Menanggapi pergerakan pasukan musuh yang kian mendekati Terusan Suez, dan risiko hilangnya urat nadi perdagangan penting ke tangan musuh, [From.GetNameDef] memilih untuk meledakkan terusan tersebut demi memastikan penggunaannya tidak jatuh ke pihak lawan. Melalui kombinasi kapal penyumbat, peledakan terarah, dan ranjau, kehancuran yang ditimbulkan sangat masif, dan kemungkinan butuh waktu berbulan-bulan upaya industri intensif untuk memperbaikinya."
 wtt_news.40.desc_not_eng: "Dalam apa yang hanya bisa digambarkan sebagai operasi militer yang berani dan brilian, [From.GetNameDef] telah berhasil memutus urat nadi perdagangan vital Terusan Suez. Melalui kombinasi kapal pemblokir, peledakan terarah, dan ranjau, kehancurannya sangat parah, dan diperkirakan akan membutuhkan waktu berbulan-bulan upaya industri besar-besaran untuk memperbaikinya."
 wtt_news.40.a: "Sebuah malapetaka!"
 wtt_news.40.b: "Kita tidak boleh membiarkan musuh memanfaatkannya."
 wtt_news.40.c: "Kita tidak akan meremehkan tekad mereka lagi."
 wtt_news.40.d: "Kita telah memutus tali penghubung ke Kekaisaran mereka!"
 wtt_news.40.e: "Pukulan telak nan luar biasa terhadap bangsa Inggris!"
 wtt_news.40.f: "Mereka mengambil keputusan yang tepat."
 wtt_news.40.g: "Pukulan berat bagi sekutu kita..."
 wtt_news.40.h: "Ini akan berdampak pada seluruh dunia..."
 wtt_news.41.t: "Terusan Panama Diledakkan"
 wtt_news.41.desc_usa: "Menanggapi ketidakmampuan mereka mempertahankan Terusan Panama, dan risiko hilangnya urat nadi komunikasi militer vital ke tangan musuh, [From.GetNameDef] memilih untuk meledakkan terusan tersebut guna memastikan musuh tidak dapat menggunakannya. Melalui kombinasi penenggelaman kapal perintang, pembongkaran bahan peledak, dan penyebaran ranjau, kerusakan yang ditimbulkan sangat parah, dan kemungkinan butuh berbulan-bulan upaya industri berat untuk memperbaikinya."
 wtt_news.41.desc_not_usa: "Dalam aksi yang hanya bisa diartikan sebagai operasi militer yang berani dan gemilang, [From.GetNameDef] berhasil memutus urat nadi komunikasi militer yang sangat penting yaitu Terusan Panama. Melalui perpaduan kapal penghalang, peledakan, dan ranjau, kehancurannya nyaris total, dan dipastikan akan menuntut kerja keras industri selama berbulan-bulan untuk memulihkannya."
 wtt_news.41.a: "Sebuah malapetaka!"
 wtt_news.41.b: "Kita tidak boleh membiarkan musuh mempergunakannya."
 wtt_news.41.c: "Kita tidak akan meremehkan ketetapan hati mereka lagi."
 wtt_news.41.d: "Armada laut mereka terputus di sisi seberang!"
 wtt_news.41.e: "Pukulan spektakuler terhadap bangsa Amerika!"
 wtt_news.41.f: "Mereka mengambil langkah yang tepat."
 wtt_news.41.g: "Pukulan hebat bagi sekutu kita..."
 wtt_news.41.h: "Pasifik dan Atlantik terpisahkan sekali lagi."
 wtt_news.42.t: "Terusan Suez Diperbaiki"
 wtt_news.42.desc: "Dengan pengerahan tenaga industri yang luar biasa, [From.GetNameDef] telah berhasil memperbaiki Terusan Suez. Pagi ini menandai pembukaan kembali urat nadi perdagangan vital menuju Laut Mediterania, setelah lebih dari setengah tahun pekerjaan perbaikan intensif."
 wtt_news.42.a: "Kita telah memulihkan jalur penghubung ke Kekaisaran kita."
 wtt_news.42.b: "Investasi yang mutlak diperlukan bagi bangsa kita."
 wtt_news.42.c: "Ini akan sangat membantu perjuangan kita."
 wtt_news.42.d: "Mereka telah membalikkan kemunduran itu..."
 wtt_news.42.e: "Dampaknya akan dirasakan oleh semua pihak."
 wtt_news.43.t: "Terusan Panama Diperbaiki"
 wtt_news.43.desc: "Dengan pengerahan daya industri yang amat besar, [From.GetNameDef] telah berhasil memulihkan Terusan Panama. Pagi ini menyaksikan pembukaan kembali jalur militer vital antara Samudra Atlantik dan Pasifik, menyusul lebih dari satu tahun perbaikan terpadu."
 wtt_news.43.a: "Kita telah memulihkan penghubung penting di antara kedua samudra kita."
 wtt_news.43.b: "Kita kini dapat kembali berlayar bebas dari Pasifik ke Atlantik."
 wtt_news.43.c: "Ini akan sangat menunjang upaya perang kita."
 wtt_news.43.d: "Mereka telah mengatasi kemunduran tersebut..."
 wtt_news.43.e: "Dampaknya akan dirasakan oleh seluruh dunia."
 wtt_news.44.t: "[MAN.GetLeader] Mengklaim Mandat Langit"
 wtt_news.44.desc: "Mengenakan jubah berhias mewah yang layak bagi seorang Kaisar Tiongkok, [MAN.GetLeader], Putra Langit, Penguasa Sepuluh Ribu Tahun, Kaisar Dinasti Qing yang Agung, telah bertakhta di Takhta Naga dalam upacara Penobatan kedua yang tak lazim dan kini bersemayam di dalam Kota Terlarang sebagaimana para leluhurnya dahulu. Merujuk pada adat istiadat kuno, [MAN.GetLeader] mengklaim bahwa kemenangan pasukannya dalam Perang Saudara Tiongkok membuktikan bahwa ia memegang Mandat Langit untuk memimpin Tiongkok.\n\nApakah ia bermaksud meluaskan kekuasaannya hingga mencakup 'Segala Sesuatu di Bawah Langit', seperti yang diklaim oleh para Kaisar sebelumnya, masih harus dinantikan."
 wtt_news.44.a: "Sang Putra Langit telah kembali."
 wtt_news.44.b: "Kesalahan masa lalu telah diluruskan."
 wtt_news.44.c: "Ia pikir ia ini siapa?"
 wtt_news.44.d: "Kemunculan kembali yang luar biasa."
 wtt_news.44.e: "Sangat mustahil dan mengada-ada!"
 wtt_news.45.t: "[new_leader.GetLeader] Mengambil Alih Kepemimpinan Nasional di Tiongkok"
 wtt_news.45.desc: "Menyusul Perebutan Kekuasaan yang berkepanjangan antara [old_leader.GetLeader] dan [new_leader.GetLeader], pihak pertama akhirnya mengakui kekalahan dan bertemu dengan [new_leader.GetLeader] di kediamannya. Hanya setelah dua jam perundingan, [old_leader.GetLeader] dilaporkan menerima usulan pengalihan kekuasaan kepada [new_leader.GetLeader] dan mengundurkan diri sebagai Perdana Menteri Republik.\n\nKelompok pendukung dari kedua kubu sebelumnya telah berkumpul di luar gedung, memicu kekhawatiran akan bentrokan berdarah tergantung hasil perundingan.\n\nKendati demikian, tidak ada laporan kekerasan dan proses transisi kekuasaan tampaknya berlangsung cukup mulus."
 wtt_news.45.a: "Politik. Politik tidak pernah berubah."
 wtt_news.45.b: "Keberhasilan yang menakjubkan."
 wtt_news.45.c: "Lebih baik daripada pertumpahan darah."
 wtt_news.45.d: "Mereka mungkin baru saja mencegah terjadinya Perang Saudara."
 wtt_news.46.t: "[From.GetLeader] Memproklamasikan Kebijakan Satu Tiongkok"
 wtt_news.46.desc: "Berbicara di hadapan para pendukungnya, [From.GetLeader] hari ini mengumumkan pergeseran besar dalam pemerintahannya. Sebelumnya, [From.GetLeader] bersedia menoleransi kenyataan bahwa beberapa wilayah Tiongkok hampir sepenuhnya merdeka. Hal itu kini telah berakhir. Mulai hari ini, [From.GetNameDef] menganggap seluruh daratan Tiongkok sebagai tanggung jawab mereka sebagai satu-satunya pemerintah Tiongkok yang sah. Siapa pun yang menolak perintah dari pemerintah yang sah ini akan dianggap sebagai pemberontak atau pengkhianat, dan akan ditindak tegas.\n\nKendati demikian, masih harus dibuktikan apakah Pemerintah [From.GetLeader] sanggup mewujudkan ancaman ini atau ini sekadar manuver propaganda demi mendulang dukungan rakyat."
 wtt_news.46.a: "Sebuah ancaman langsung."
 wtt_news.46.b: "Kita akan menyatukan seluruh Tiongkok!"
 wtt_news.46.d: "Orang-orang yang lebih hebat pun telah gagal."
 wtt_news.47.t: "Tiongkok Menuntut Wilayah Konsesi Asing"
 wtt_news.47.desc: "Menyusul pidato berapi-api oleh [From.GetLeader], perwakilan diplomatik [From.GetNameDef] telah menyampaikan nota kepada semua kekuatan asing yang memiliki konsesi atau wilayah sewaan di Tiongkok. Dalam nota tersebut, pemerintah [From.GetLeader] menuntut agar semua wilayah Tiongkok dikembalikan secepatnya ke pangkuan [From.GetNameDef].\n\nIni dilihat sebagai langkah pertama dari rencana besar untuk mengusir pengaruh asing dan membatalkan 'Perjanjian-Perjanjian Tidak Adil' abad sebelumnya."
 wtt_news.47.a: "Seseorang harus berani memulainya."
 wtt_news.47.b: "Datang dan rebutlah jika mampu!"
 wtt_news.47.c: "Tentu saja tidak akan ada hal buruk yang terjadi dari ini."
 wtt_news.47.d: "Jangan memaksa kami turun tangan ke sana!"
 wtt_news.48.t: "Perang Kemerdekaan Manchuria"
 wtt_news.48.desc: "Menyusul perebutan kekuasaan internal antara para administrator Jepang dan pemerintah [MAN.GetLeader], pertarungan demi supremasi di Manchuria akhirnya mencapai titik didih.\n\nKabarnya, konfrontasi dipicu oleh sebuah insiden di Lingkungan Kekaisaran, di mana seorang Jenderal Jepang diduga menghina Kaisar Manchukuo dengan menuntut agar beliau membungkuk hormat.\n\nDengan murka, [MAN.GetLeader] menjawab bahwa 'Putra Langit tidak pernah membungkuk' lalu memukul jenderal tersebut dengan tongkatnya, sebelum memerintahkan pasukannya untuk segera mengusir seluruh tentara Jepang dari tanah Tiongkok."
 wtt_news.48.a: "Anak anjing mulai mengaum?"
 wtt_news.48.b: "Kita akan merebut takdir kita!"
 wtt_news.48.c: "Dasar pengkhianat kecil!"
 wtt_news.48.d: "Sang Naga menyerang... Matahari?"
 wtt_news.50.t: "Hitler Dibunuh"
 wtt_news.50.desc: "Radio Jerman hari ini mengumumkan bahwa elemen-elemen pengkhianat di tubuh militer telah mencoba melancarkan kudeta. Menyusul ledakan di Markas Besar Führer yang menewaskan Hitler dan melukai beberapa orang lainnya, unit-unit tentara menyerang sejumlah kantor dan unit SS.\n\nMeskipun [GER.GetLeader] mengklaim memegang kendali penuh atas negara dan militernya, laporan mengenai baku tembak antara pasukan loyalis dan pemberontak masih terus berdatangan dari seantero negeri.\n\nRumor menyebutkan bahwa anggota terkemuka lain dari partai Nazi tengah merencanakan perebutan kekuasaan mereka sendiri di tengah kekacauan ini."
 wtt_news.50.a: "Pengkhianatan yang keji!"
 wtt_news.50.b: "Situasinya sama sekali tidak membaik."
 wtt_news.50.c: "Baguslah dia sudah tiada!"
 wtt_news.50.d: "Ia telah menekan mereka terlalu jauh."
 wtt_news.51.t: "Percobaan Pembunuhan terhadap [GER.GetLeader]"
 wtt_news.51.desc: "Radio Jerman mengumumkan hari ini bahwa elemen-elemen pembangkang di tubuh militer telah mencoba melancarkan kudeta. Menyusul ledakan di Markas Besar Führer yang secara ajaib hanya melukai ringan Hitler dan beberapa perwira lainnya, unit-unit angkatan darat sempat berupaya merebut kendali beberapa gedung pemerintahan di Berlin.\n\nKabar selamatnya [GER.GetLeader] menyebar cepat, dan sebagian besar unit di bawah komando para pemberontak telah kembali ke barak masing-masing.\n\nSejumlah perwira tinggi Jerman memilih bunuh diri menyusul kegagalan tersebut daripada harus menanggung aib diadili di hadapan 'Pengadilan Rakyat' yang terkenal kejam."
 wtt_news.51.c: "Awal dari akhir?"
 wtt_news.52.desc: "Radio Jerman mengumumkan hari ini bahwa [GER.GetLeader] telah mengambil alih tampuk pemerintahan. Menyusul baku tembak di dalam Führerbunker, di mana sang Führer terluka parah dan meregang nyawa, unit-unit SS bergerak cepat menguasai semua jalan raya utama dan persimpangan kereta api yang keluar dari Berlin. Sementara itu, unit-unit Luftwaffe dan Heer dilaporkan telah diperintahkan untuk merapat ke Berlin demi memulihkan ketertiban."
