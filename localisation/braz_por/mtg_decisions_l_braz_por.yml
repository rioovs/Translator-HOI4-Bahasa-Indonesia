 ENG_request_trade_union_support_for_new_factories: "Minta Dukungan Serikat Buruh untuk Pabrik Baru"
 ENG_request_trade_union_support_for_new_factories_desc: "Kita akan meminta Serikat Buruh untuk mendukung pengadaan pabrik-pabrik baru."
 ENG_request_trade_union_factory_worker_support: "Minta Dukungan Buruh Pabrik dari Serikat Buruh"
 ENG_request_trade_union_factory_worker_support_desc: "Kita akan memanfaatkan koneksi dan hubungan baik kita di Serikat Buruh untuk meyakinkan mereka tentang pentingnya peningkatan produktivitas pabrik dalam waktu dekat. Dengan dukungan mereka, kita dapat memotivasi para pekerja."
 ENG_request_trade_union_dockyard_worker_support: "Minta Dukungan Pekerja Galangan Kapal dari Serikat Buruh"
 ENG_request_trade_union_dockyard_worker_support_desc: "Kita akan memanfaatkan koneksi dan hubungan baik kita di Serikat Buruh untuk meyakinkan mereka tentang pentingnya peningkatan produktivitas galangan kapal dalam waktu dekat. Dengan dukungan mereka, kita dapat memotivasi para pekerja galangan kapal."
 ENG_request_trade_union_construction_worker_support: "Minta Dukungan Pekerja Konstruksi dari Serikat Buruh"
 ENG_request_trade_union_construction_worker_support_desc: "Kita akan memanfaatkan koneksi dan hubungan baik kita di Serikat Buruh untuk meyakinkan mereka tentang pentingnya peningkatan produktivitas konstruksi dalam waktu dekat. Dengan dukungan mereka, kita dapat memotivasi tenaga kerja konstruksi."
 ENG_request_trade_union_war_propaganda_support: "Minta Dukungan Propaganda Perang dari Serikat Buruh"
 ENG_request_trade_union_war_propaganda_support_desc: "Kita membutuhkan bantuan dari Serikat Buruh untuk mempersiapkan rakyat menghadapi perang - perang akan segera tiba, dan mereka harus mendukung persiapan pemerintah menghadapinya."
