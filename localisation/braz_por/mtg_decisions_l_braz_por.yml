 MEX_category_church_power: "Kekuasaan Gereja"
 MEX_category_church_power_desc: "§YGereja§! telah ditekan oleh negara Revolusioner selama bertahun-tahun. Kebijakan masa depan kita dapat ditentukan oleh ideologi atau realpolitik, tetapi kita harus bertindak tegas."
 MEX_decision_transfer_lands_to_church: "Serahkan Tanah ke Gereja"
 MEX_decision_transfer_lands_to_church_desc: "Gereja pra-Revolusi berukuran besar dan kaya raya. Para jenderal dan gubernur yang tamak merampas lahan gereja yang luas dari pengurus tradisional mereka, namun kini kita dapat mengembalikan sebagian darinya."
 MEX_decision_nationalize_church_lands: "Nasionalisasi Tanah Gereja"
 MEX_decision_nationalize_church_lands_desc: "Gereja dan seminari secara resmi dimiliki oleh pemerintah, dan para pastor serta biarawati adalah pegawai negeri. Biayanya kian membebani. Mungkinkah kita dapat memangkas anggaran pemerintah dengan merobohkan beberapa gereja lagi?"
 MEX_decision_pardon_cristero_fighter: "Beri Pengampunan kepada Pejuang Cristero"
 MEX_decision_pardon_cristero_fighter_desc: "Presiden Calles bertanggung jawab besar atas pecahnya Perang Cristero. Dia kini telah 'mundur', sehingga kita dapat mengikuti prosedur formal untuk memasukkan pejuang Cristero yang berbakat dan setia ke dalam militer kita."
 MEX_decision_assassinate_cristero_traitor: "Bongkar & Habisi Pengkhianat Cristero"
 MEX_decision_assassinate_cristero_traitor_desc: "Para pemberontak yang mengangkat senjata melawan negara tidak pantas dikasihani dan tidak akan mendapat ampunan. Meskipun ketentuan perdamaian yang dirundingkan dengan para pemimpin Gereja dimaksudkan untuk menghentikan permusuhan, kita tahu bahwa para pengkhianat akan mengangkat senjata lagi jika mendapat kesempatan. Kita harus menyerang terlebih dahulu."
 MEX_decision_attend_public_mass: "Hadiri Misa Terbuka"
 MEX_decision_attend_public_mass_desc: "Selama dua puluh tahun, presiden-presiden Meksiko secara terang-terangan atau diam-diam memusuhi Gereja. Beberapa gestur sederhana dapat membawa dampak besar untuk mendamaikan sistem politik dan keagamaan kita."
 MEX_decision_prosecute_clergyman: "Tuntut Pemuka Agama"
 MEX_decision_prosecute_clergyman_desc: "Konstitusi 1917 melarang para pastor berpartisipasi dalam sistem politik kita. Denda karena mengenakan jubah di tempat umum, pemenjaraan karena membuat pernyataan politik; selalu ada cara untuk menyerang Gereja dan menunjukkan supremasi negara Meksiko atas elemen-elemen takhayul."
 MEX_decision_reconciliation_committee: "Komite Rekonsiliasi"
 MEX_decision_reconciliation_committee_desc: "Banyaknya kejahatan yang dilakukan oleh kedua belah pihak selama Cristiada telah membuka luka yang hingga kini belum sembuh. Dengan menyoroti ketidakadilan di masa lalu, mungkin kita dapat membantu mencegah pelanggaran di masa depan."
 MEX_decision_incite_tensions: "Sulut Ketegangan"
 MEX_decision_incite_tensions_desc: "Musuh-musuh internal kita masih terus berorganisasi melawan kita. Kita harus siap menghadapi segala ancaman! Kita akan menghimpun para pendukung kita dalam sebuah unjuk rasa untuk menunjukkan tekad kita yang tak terpatahkan!"
 MEX_category_military_issues: "Masalah Militer"
 MEX_mission_cedillos_rebellion: "Pemberontakan Caudillo"
 MEX_mission_cedillos_rebellion_desc: "Jenderal Saturnino Cedillo dan para caudillo yang bersekutu dengannya telah bertindak mandiri dari pemerintah pusat selama bertahun-tahun. Upaya [Root.GetLeader] untuk membangun bangsa yang bersatu merupakan ancaman bagi kekuasaan mereka, dan oleh karena itu mereka berupaya membatalkan kemajuan kita dengan cara adil maupun curang."
 MEX_mission_second_cristiada: "Perang Cristero Kedua"
 MEX_mission_second_cristiada_desc: "Serangan kita terhadap para pemuja takhayul di 'Gereja Suci' membuat marah elemen sayap kanan militer. Kita harus melunakkan pendekatan kita atau bersiap mengalahkan mereka di medan tempur."
 MEX_mission_second_cristiada_dummy: "Perang Cristero Kedua"
 MEX_mission_second_cristiada_dummy_desc: "Jika pemerintah bertindak terlalu keras dalam pendekatannya terhadap Gereja, kaum Cristero dapat mengangkat senjata sekali lagi untuk menggulingkan kita."
 MEX_mission_second_revolution: "Revolusi Meksiko Kedua"
 MEX_mission_second_revolution_desc: "Dukungan kita terhadap Gereja Suci membuat marah elemen militer sayap kiri dan anti-Gereja. Kita harus melunakkan pendekatan kita atau bersiap mengalahkan mereka di medan tempur."
 MEX_mission_second_revolution_dummy: "Revolusi Meksiko Kedua"
 MEX_mission_second_revolution_dummy_desc: "Meskipun sikap moderat dalam masalah agama akan ditoleransi oleh kaum sekuler di pemerintahan, hubungan yang terlalu dekat dengan Gereja dapat memicu pemberontakan dari jenderal-jenderal sayap kiri radikal dan ateis."
 MEX_decision_support_spanish_loyalists: "Dukung Sayap Kiri Spanyol"
 MEX_decision_support_spanish_loyalists_desc: "Kita akan mengirimkan pasokan senapan ke pemerintah Republik untuk mempertahankan demokrasi melawan perampas kekuasaan ilegal Franco dan antek-antek fasisnya."
 MEX_decision_support_spanish_fascists: "Dukung Sayap Kanan Spanyol"
 MEX_decision_support_spanish_fascists_desc: "Kita akan mengirimkan pasokan senapan kepada pemulih ketertiban di Spanyol sehingga mereka dapat membasmi ancaman komunis sebelum menyebar."
 MEX_decision_operation_just_cause: "Operasi Just Cause"
 MEX_category_territorial_integration: "Integrasi Wilayah"
 MEX_category_territorial_integration_desc: "Perjuangan revolusioner kita untuk menggulingkan pemerintahan korup memberi kita kendali atas seluruh negara. Penduduk di wilayah-wilayah tersebut selama ini hanya mengenal penindasan, dan agar dapat menikmati pembebasan sejati mereka harus digabungkan ke dalam [MEX.GetNameDef]."
