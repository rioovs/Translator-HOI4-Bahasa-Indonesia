 ENG_urge_restraint: "Himbau Menahan Diri"
 ENG_urge_restraint_desc: "Sangat penting bahwa pawai kita berikutnya berjalan tanpa hambatan, agar tanggapan kekerasan terhadap pawai tersebut tidak menjalar ke seluruh negeri dan memicu kerusuhan nasional, bahkan berpotensi perang saudara. Meskipun hal ini mungkin membuat sebagian pendukung garis keras kita menjauh, kita harus memerintahkan peserta pawai kita untuk menahan diri dari kekerasan dengan segala cara."
 ENG_urge_restraint_tt: "Sangat mengurangi peluang terjadinya §YPawai Penuh Kekerasan§! pada §YPawai Blackshirt§! berikutnya yang diadakan.\n"
 ENG_blackshirt_march_tt: "Kaum fasis mengambil alih kendali atas negara bagian, memastikan wilayah tersebut akan berada di pihak kita jika kita mengalami perang saudara.\n"
 ENG_blackshirt_march_in_northern_ireland: "Pawai Blackshirt di Irlandia Utara"
 ENG_blackshirt_march_in_northern_ireland_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di Irlandia Utara, yang niscaya akan mempengaruhi populasi negara bagian tersebut untuk mendukung perjuangan kita."
