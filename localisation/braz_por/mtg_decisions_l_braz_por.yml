 USA_congress_desc: "Capitol Hill memiliki aturan dan gagasannya sendiri. Kita harus bekerja sama dengan mereka untuk mewujudkan berbagai hal, namun ada cara untuk memastikan bahwa kita memiliki Kongres yang bersimpati dan mendukung kita."
