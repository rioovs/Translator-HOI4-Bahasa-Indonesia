 ENG_blackshirt_march_in_east_anglia: "Pawai Blackshirt di East Anglia"
 ENG_blackshirt_march_in_east_anglia_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di East Anglia, yang niscaya akan mempengaruhi populasi negara bagian tersebut untuk mendukung perjuangan kita."
 ENG_blackshirt_march_in_gloucestershire: "Pawai Blackshirt di Gloucestershire"
 ENG_blackshirt_march_in_gloucestershire_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di Gloucestershire, yang niscaya akan mempengaruhi populasi negara bagian tersebut untuk mendukung perjuangan kita."
 ENG_blackshirt_march_in_london: "Pawai Blackshirt di London"
 ENG_blackshirt_march_in_london_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di London, yang niscaya akan mempengaruhi populasi wilayah tersebut untuk mendukung perjuangan kita, atau memicu perang saudara jika kekerasan terus meningkat."
 ENG_blackshirt_march_in_cornwall: "Pawai Blackshirt di Cornwall"
 ENG_blackshirt_march_in_cornwall_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di Cornwall, yang niscaya akan mempengaruhi populasi wilayah tersebut untuk mendukung perjuangan kita."
 ENG_blackshirt_march_in_sussex: "Pawai Blackshirt di Sussex"
 ENG_blackshirt_march_in_sussex_desc: "Persiapan sedang berlangsung untuk pawai akbar Blackshirt di Sussex, yang niscaya akan mempengaruhi populasi wilayah tersebut untuk mendukung perjuangan kita."
 ENG_march_timer_flag: "Sebuah pawai saat ini sedang berlangsung."
 ENG_restrained_march_flag: "Sudah menghimbau untuk menahan diri."
 ENG_march_on_downing_street: "Pawai ke Downing Street"
 ENG_march_on_downing_street_desc: "Pawai akbar terakhir ke Downing Street No. 10 niscaya akan mendesak pemerintah untuk menyerukan referendum mengenai masa depan bangsa. Mereka tidak dapat menentang kehendak rakyat."
 ENG_speech_against_germany: "Sampaikan Pidato Anti-Jerman"
 ENG_speech_against_germany_desc: "Seiring popularitas Mosley yang melambung tinggi, begitu pula kritik aneh yang ditujukan kepadanya. Untuk meredakan kekhawatiran bahwa ia hanya ingin memaksakan Hitlerisme pada rakyat Inggris, mungkin diperlukan pidato akbar yang dirumuskan secara tegas, di mana Mosley menjauhkan dirinya dalam istilah yang tidak ambigu dari fasisme versi Hitler."
 ENG_speech_against_germany_tt: "§RJika stabilitas turun di bawah 50% selama Pawai Blackshirt, perang saudara akan dimulai!§!\n"
 ENG_reconciliatory_speech: "Pidato Rekonsiliasi"
 ENG_reconciliatory_speech_desc: "Untuk mengurangi ketegangan politik dalam negeri yang kian meningkat, pidato dengan bahasa rekonsiliasi mungkin merupakan hal yang tepat."
 ENG_the_mosley_plan: "Terapkan Rencana Mosley"
 ENG_the_mosley_plan_desc: "Restrukturisasi ekonomi yang berani, dikombinasikan dengan propaganda luas dan investasi publik, akan menggalang rakyat dalam satu upaya besar untuk memulihkan bangsa dan memulai persenjataan kembali kita."
 ENG_imperial_conference_decision: "Konferensi Kekaisaran"
 ENG_imperial_conference_decision_desc: "Konferensi Kekaisaran telah dimulai, dan kita dapat mendorong agenda kita selama dua bulan ke depan, sebelum perwakilan Dominion kembali ke tanah air mereka. Memperbaiki hubungan diplomatik dengan Dominion kita kemungkinan besar akan meningkatkan peluang Dominion tersebut menyetujui usulan kita."
 ENG_imperial_conference_discussion_in_progress: "Pembahasan Konferensi Kekaisaran sedang berlangsung.\n"
 imperial_conference_ends_tt: "Konferensi Kekaisaran berakhir.\n"
 ENG_discuss_imperial_defense: "Bahas Pertahanan Kekaisaran"
 ENG_discuss_imperial_defense_desc: "Kita akan mengajukan mosi yang mengusulkan agar semua anggota Persemakmuran memberikan kontribusi signifikan bagi pertahanan Kekaisaran."
 ENG_discuss_imperial_trade: "Bahas Perdagangan Kekaisaran"
 ENG_discuss_imperial_trade_desc: "Kita akan mengajukan mosi yang mengusulkan agar semua anggota Persemakmuran meningkatkan perdagangan preferensial di dalam Kekaisaran, sehingga kita secara keseluruhan dapat menjadi lebih makmur."
 ENG_discuss_imperial_economy: "Bahas Ekonomi Kekaisaran"
 ENG_discuss_imperial_economy_desc: "Kita akan mengajukan mosi yang mengusulkan agar semua anggota Persemakmuran melakukan investasi signifikan dalam ekonomi domestik mereka, mengurangi ketergantungan mereka pada investasi kita dan memperkuat Kekaisaran secara keseluruhan."
 ENG_discuss_appeasement: "Bahas Kebijakan Pasifikasi (Appeasement)"
 ENG_discuss_appeasement_desc: "Kita telah menerima banyak kritik atas kebijakan pasifikasi kita, jadi kita akan mengajukan kebijakan ini ke Persemakmuran untuk didiskusikan."
 ENG_discuss_imperial_federation: "Bahas Federasi Kekaisaran"
 ENG_discuss_imperial_federation_desc: "Sejak abad sebelumnya, berbagai pihak telah bersuara mendukung penggabungan seluruh bagian Kekaisaran bersama-sama dalam satu Federasi Kekaisaran, alih-alih melangkah lebih jauh ke alternatif 'pemerintahan mandiri', yang melibatkan kemerdekaan bagi semua Dominion. Kita sekarang akan mengajukan mosi untuk mendiskusikannya untuk yang terakhir kalinya."
 won_british_civil_war: "Memenangkan perang saudara kurang dari satu tahun yang lalu.\n"
 ENG_abdication_crisis: "Krisis Turun Takhta Edward VIII"
 ENG_abdication_crisis_changed_mind: "Edward VIII tidak menikahi Wallis Simpson"
 ENG_edward_viii_abdicated: "Edward VIII turun takhta"
 LIT_move_capital_to_vilnius: "Pindahkan Ibu Kota ke Vilnius"
 governments_in_exile: "Pemerintahan di Pengasingan"
 governments_in_exile_desc: "[GetGovernmentInExileCategoryDesc]"
 governments_in_exile_host_desc: "Meskipun tanah air mereka berada di bawah pendudukan musuh, beberapa tentara dan warga negara yang pemberani bersedia melanjutkan perjuangan. Jika kita memberikan pengakuan kepada pemerintahan bersahabat di pengasingan, mereka dapat memanfaatkan sumber daya para ekspatriat, emigran, dan pengungsi, membentuk unit-unit baru yang akan bertempur di pihak kita."
 governments_in_exile_exiled_desc: "Meskipun tanah air kita berada di bawah pendudukan musuh, pemerintah telah berhasil melarikan diri. Kita perlu menggalang dukungan bagi perjuangan kita, mengumpulkan semua ekspatriat, emigran, dan pengungsi di sini, serta bekerja sama dengan tuan rumah untuk merebut kembali tanah air kita."
 governments_in_exile_ETH_desc: "[ROOT.GetLeader] untuk sementara waktu telah mendirikan pemerintahan di pengasingan dari markas [ROOT.GetLeader.GetHerHis] di [?ETH.host_nation.GetNameDef]. Situasinya genting, tetapi jauh dari kata tanpa harapan. Sejumlah pejuang berhasil meloloskan diri dan diharapkan lebih banyak lagi yang akan bergabung seiring waktu. Selain itu, keluarga Kekaisaran memiliki posisi yang baik, sehingga kita seharusnya mampu mengalihkan dana untuk meningkatkan peluang merebut kembali [ETH.GetName].\n\nSaldo Perbendaharaan Kekaisaran saat ini: §Y[?ETH_treasury]§! £GFX_ETH_imperial_treasury"
 request_reinstatement: "Minta Pemulihan Kembali dari [From.GetAdjective]"
 request_reinstatement_desc: "Sekutu setia kita telah membantu kita merebut kembali tanah yang diduduki musuh bersama kita dan tanah air [Root.GetAdjective] relatif aman. Kita harus meminta izin dari tuan rumah kita untuk merelokasi pemerintah kita dan membentuk kabinet [Root.GetRulingPartyLong] sebagai persiapan menjelang berakhirnya perang."
 grant_parliamentary_audience: "Pidato Parlemen [From.GetAdjective]"
 grant_parliamentary_audience_desc: "Kekejaman pasukan pendudukan yang meneror [From.GetNameDef] sungguh tak dapat ditoleransi. Mari kita bawa perwakilan bangsa [From.GetAdjective] ke hadapan badan legislatif kita untuk bersaksi kepada rakyat [Root.GetAdjective] tentang alasan perang kita yang adil."
 lobby_for_parliamentary_support: "Melobi Dukungan Parlemen"
 public_support_for_from: "Pengakuan Publik atas Pemerintah Pengasingan [From.GetAdjective]"
 request_faction_member_support_of_from: "Minta Dukungan Faksi untuk [From.GetNameDef]"
 exile_recruitment_campaign: "Kampanye Perekrutan Pengasingan [Root.GetAdjective]"
 exile_recruitment_campaign_desc: "Berkat kawan-kawan kita di [From.GetNameDef], kita memiliki pangkalan untuk beroperasi, memperkuat kekuatan kita sebagai persiapan kepulangan gemilang ke [Root.GetNameDef]. Kita harus fokus mengumpulkan personel yang berguna untuk membantu upaya perang."
 exile_extraction_campaign: "Kampanye Ekstraksi [From.GetAdjective]"
 exile_extraction_campaign_desc: "Meskipun sebagian besar formasi tentara reguler ditawan dan diinternir ketika pemerintah [From.GetAdjective] menyerah, masih ada pasukan demobilisasi di [From.GetNameDef] yang akan menyambut gembira kesempatan meninggalkan wilayah pendudukan dan membantu upaya perang kita. Kita akan merumuskan rencana untuk membantu mengevakuasi unit-unit yang terdampar yang kemudian dapat dipersenjatai dan dilatih untuk berjuang demi tanah air mereka."
 expatriate_donations: "Donasi Ekspatriat dari [From.GetNameDef]"
 expatriate_donations_desc: "Rakyat yang menderita di [From.GetNameDef] memiliki kerabat dan pengungsi yang tinggal di luar negeri. Dengan memohon kepada komunitas [From.GetAdjective] ini untuk memberikan pengorbanan khusus demi membebaskan tanah air mereka lebih cepat, kita dapat mengumpulkan lebih banyak sumber daya untuk upaya perang."
 request_control_of_navy: "Minta Kendali atas Angkatan Laut [From.GetAdjective]"
 request_control_of_navy_desc: "Demi efisiensi, aliansi kita akan sangat diuntungkan dari integrasi angkatan laut [From.GetAdjective] ke dalam armada kita sendiri."
 category_exile_forces: "Pasukan Pengasingan"
 category_exile_forces_desc: "Front persatuan kita akan menghancurkan musuh yang dibenci! Dengan menggabungkan kekuatan, kita akan menyatukan aset-aset terbaik yang tersedia bagi negara kita dan mengatasi segala rintangan yang dilancarkan agresor ke arah kita!"
 weapons_for_the_resistance: "Senjata untuk Perlawanan [From.GetAdjective]"
 weapons_for_the_resistance_desc: "Elemen patriotik [From.GetAdjective] di belakang garis musuh akan mendatangkan malapetaka bagi musuh bersama kita, jika kita dapat mengirimkan amunisi yang andal kepada mereka."
 purge_infiltrators: "Pembersihan Penyusup [From.GetAdjective]"
 purge_infiltrators_desc: "Kawan-kawan kita di pemerintahan sah [From.GetAdjective] khawatir dengan meningkatnya dukungan untuk gerakan Bolshevis dan ultranasionalis di dalam pasukan sukarelawan yang melayani kita. Kita harus menyingkirkan perwira tidak setia dan melucuti senjata formasi pembangkang sebelum situasi menjadi tak terkendali. Pengaruh yang akan kita peroleh di dalam negeri mereka akan sangat berharga, terutama pascaperang."
 unity_parade: "Parade Persatuan [From.GetAdjective]-[Root.GetAdjective]"
 unity_parade_desc: "Para prajurit veteran dari pasukan sukarelawan [From.GetAdjective] telah meraih banyak kemenangan melawan musuh yang dibenci, dan pengorbanan bersama kita adalah sumber kebanggaan. Kita akan mengarak pasukan keliling Front Dalam Negeri dan menunjukkan kekuatan kita yang tak tergoyahkan! Pengecam pemerintah sah [From.GetAdjective] mungkin menentang hal ini sebagai pemborosan sumber daya, tetapi keberhasilan kita akan membungkam para peragu."
 joint_training_exercise: "Latihan Militer Bersama [From.GetAdjective]-[Root.GetAdjective]"
 joint_training_exercise_desc: "Melalui darat, laut, dan udara, pasukan gabungan kita akan menghancurkan agresor tiran yang mengusir sekutu [From.GetAdjective] kita dari rumah mereka dan mengancam masa depan peradaban dunia! Kita akan meluncurkan latihan bersama untuk mempelajari metode yang lebih baik dalam mengobarkan perang melawan musuh bersama."
 custom_cost_joint_training_exercise: "£command_power  §Y25§!"
 custom_cost_joint_training_exercise_blocked: "£command_power  §R25§!"
 eng_gateway_to_europe_full_influence_breakdown: "[Root.GetNameDefCap] memiliki [?Root.eng_gateway_to_europe_influence|+0] §HPoin Pengaruh Perdagangan§!\n"
 eng_gateway_to_europe_icon_value: "[?Root.eng_gateway_to_europe_influence|0H]"
 ger_gateway_to_europe_full_influence_breakdown: "[Root.GetNameDefCap] memiliki [?Root.ger_gateway_to_europe_influence|+0] §HPoin Pengaruh Perdagangan§!\n"
 ger_gateway_to_europe_icon_value: "[?Root.ger_gateway_to_europe_influence|0H]"
 HOL_gateway_to_europe_hol_category: "Gerbang Menuju Eropa"
 HOL_gateway_to_europe_hol_category_desc: "Tarik-menarik antara pihak Inggris dan Jerman atas perdagangan kita kian meningkat. Dalam menghadapi tuntutan mereka kita harus berhati-hati, karena tunduk pada tuntutan salah satu pihak kemungkinan besar akan memicu permusuhan dengan pihak lainnya..."
 HOL_gateway_to_europe_ger_category: "Gerbang Menuju Eropa"
 HOL_gateway_to_europe_ger_category_desc: "Belanda membentuk 'pintu belakang', memungkinkan kita menghindari blokade Inggris dan mempertahankan perdagangan melalui pelabuhan netral. Kita harus menekan Belanda untuk meningkatkan jumlah perdagangan yang mereka izinkan melewati perbatasan mereka menuju kita."
 HOL_gateway_to_europe_eng_category: "Gerbang Menuju Eropa"
 HOL_gateway_to_europe_eng_category_desc: "Jerman menggunakan Belanda sebagai 'pintu belakang', menghindari blokade kita dengan memanfaatkan perkapalan dan pelabuhan netral Belanda untuk menyalurkan perdagangan. Jika kita ingin membuat blokade kita lebih berhasil, kita harus menundukkan Belanda pada kehendak kita."
 HOL_attract_foreign_investors: "Tarik Investor Asing"
 HOL_attract_foreign_investors_desc: "Menarik lebih banyak investor untuk mendanai sebagian pembangunan kolonial kita akan meringankan beban keuangan kita, dan memungkinkan kita mencurahkan lebih banyak sumber daya ke benua Eropa."
 HOL_attract_foreign_industry: "Tarik Industri Asing"
 HOL_attract_foreign_industry_desc: "Menarik lebih banyak industri asing ke koloni kita akan meringankan beban keuangan kita, dan memungkinkan kita mencurahkan lebih banyak sumber daya untuk mengembangkan industri dalam negeri kita."
 HOL_attract_west_indies_oil_companies: "Tarik Perusahaan Minyak Hindia Barat"
 HOL_attract_west_indies_oil_companies_desc: "Banyak perusahaan minyak asing telah menyatakan minat untuk membangun kilang di Curaçao dan Aruba, guna ikut mengolah minyak Venezuela dan seluruh kekayaan yang menyertainya."
 HOL_attract_west_indies_oil_companies_tt: "Tambahkan §G1§! Slot Bangunan dan §Y1 Pabrik Sipil§! ke §YCuraçao§! setelah mengambil keputusan ini sebanyak §Y5§! kali.\n"
 HOL_attract_east_indies_oil_companies: "Tarik Perusahaan Minyak Hindia Timur"
 HOL_attract_east_indies_oil_companies_desc: "Dengan bantuan perusahaan minyak asing, kilang minyak di Hindia Timur dapat diperluas tanpa biaya besar bagi kita, memungkinkan kita memenuhi peningkatan permintaan minyak di Asia Timur."
 HOL_attract_east_indies_oil_companies_tt: "Tambahkan §G1§! Slot Bangunan dan §Y1 Pabrik Sipil§! ke §YJawa§!, §YSumatra§!, atau §YKalimantan§! setelah mengambil keputusan ini masing-masing sebanyak §Y3§!, §Y6§!, dan §Y10§! kali.\n"
 HOL_inundate_the_water_lines: "Banjiri Lini Pertahanan Air"
 HOL_inundate_the_water_lines_desc: "Lini Pertahanan Air Belanda (Dutch Water Line) yang dipersiapkan dengan cermat kini harus dibanjiri untuk mencegah pergerakan maju musuh, meskipun itu akan menimbulkan kerusakan pada wilayah pedesaan."
 HOL_drain_the_water_lines: "Keringkan Lini Pertahanan Air"
 HOL_drain_the_water_lines_desc: "Bahaya telah mereda, dan oleh karena itu kita dapat mengeringkan Lini Pertahanan Air Belanda, memungkinkan kita memanfaatkan wilayah pedesaan kembali."
 HOL_crack_down_on_pacifist_movements: "Tindak Tegas Gerakan Pasifis"
 HOL_crack_down_on_pacifist_movements_desc: "Berbagai gerakan pasifis telah cukup banyak menghambat persenjataan kembali militer kita. Jika suara rakyat tidak dapat dibujuk, maka harus dibungkam dengan paksa."
 hol_war_on_pacifism_in_progress: "Sudah menangani pasifisme.\n"
 HOL_establish_pro_war_labor_indoctrination: "Terapkan Indoktrinasi Buruh Pro-Perang"
 HOL_establish_pro_war_labor_indoctrination_desc: "Selama kaum buruh berada di pihak kita, sisanya pada akhirnya akan menurut. Dengan biaya kecil berupa sedikit penurunan produktivitas tempat kerja, kita akan menanamkan rasa patriotisme pada rakyat kita, dan membuat mereka memahami perlunya militer yang kuat untuk melindungi nilai-nilai kita."
 HOL_anti_pacifist_propaganda: "Propaganda Anti-Pasifis"
 HOL_anti_pacifist_propaganda_desc: "Hanya kerja keras dan sumber daya yang terarah yang akan mengubah watak rakyat kita. Kita akan memulai kampanye propaganda besar-besaran yang, meski tidak murah, akan menyadarkan rakyat bahwa kita tidak akan lama lagi dapat menikmati kemewahan ketidakberdayaan tanpa konsekuensi."
 HOL_request_equipment: "Minta Perlengkapan"
 HOL_request_equipment_desc: "Militer kita sangat membutuhkan perlengkapan untuk mendukung ekspansi yang diperlukan. Mungkin calon sekutu masa depan kita dapat membantu..."
 HOL_request_equipment_tt: "ATAU\n"
 HOL_request_equipment_tt_2: "§R[From.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!\n"
 HOL_draw_up_combined_staff_plan: "Susun Rencana Staf Gabungan"
 HOL_draw_up_combined_staff_plan_desc: "Kelangsungan hidup kita bergantung pada kerja sama terpadu militer kita dengan calon sekutu masa depan. Kita dapat mengirim misi militer dengan tujuan menyusun rencana staf gabungan, yang akan sangat memfasilitasi kerja sama itu sejak detik pertama invasi oleh kekuatan musuh."
 HOL_exchange_intelligence_data: "Pertukaran Data Intelijen"
 HOL_exchange_intelligence_data_desc: "Dinas intelijen kita telah meraih sejumlah keberhasilan, dan memungkinkan kita menawarkan pertukaran informasi kepada calon sekutu masa depan, yang secara drastis meningkatkan kesiapsiagaan kedua bangsa kita terhadap langkah-langkah pembuka yang paling mungkin dalam skenario invasi."
 HOL_prepare_evacuation_of_gold_reserves: "Siapkan Evakuasi Cadangan Emas"
 HOL_prepare_evacuation_of_gold_reserves_desc: "Cadangan emas nasional kita - fondasi utama dari pemerintahan nasional kita - harus dievakuasi jika terjadi invasi. Membiarkannya tertinggal akan membuat pemerintahan di pengasingan sama sekali tidak berdaya."
 HOL_prepare_evacuation_of_gold_reserves_tt: "Ini akan dihapus saat menjadi §YPemerintahan di Pengasingan§!.\n"
 HOL_prepare_evacuation_of_gold_reserves_tt_2: "Dapatkan §Y100 Kekuatan Politik§! dan peningkatan £legitimacy §YLegitimasi§! saat menjadi §YPemerintahan di Pengasingan§!.\n"
 HOL_share_military_knowledge: "Bagi Pengetahuan Militer"
 HOL_share_military_knowledge_desc: "Setelah hampir 150 tahun hidup damai, negara-negara tetangga kita jauh lebih maju dalam pemahaman urusan militer dibandingkan kita. Mungkin calon sekutu masa depan kita bersedia membagikan sebagian dari pengetahuan tersebut, untuk membantu pertahanan tanah air kita kelak."
 HOL_demand_reduced_dutch_trade_with_germany: "Tuntut Pengurangan Perdagangan Belanda dengan Jerman"
 HOL_demand_reduced_dutch_trade_with_germany_desc: "Belanda harus ditundukkan, dan mematuhi pembatasan perdagangan yang diberlakukan terhadap Jerman. Tentu saja mereka tidak ingin kita memasukkan mereka ke dalam pembatasan tersebut..."
 HOL_demand_increased_dutch_trade_with_germany: "Tuntut Peningkatan Perdagangan Belanda dengan Jerman"
 HOL_demand_increased_dutch_trade_with_germany_desc: "Belanda harus... diingatkan... akan kewajiban perdagangan mereka kepada negara Jerman, serta kerentanan militer mereka sebagai tetangga kita. Secara halus, tentu saja."
 HOL_gateway_to_europe_decisions_tt: "Jika [HOL.GetNameDef] tunduk pada tuntutan kita, kita akan menerima sejumlah §YKekuatan Politik§! yang setara dengan jumlah total yang diinvestasikan oleh semua peserta §YGerbang Menuju Eropa§!. Saat ini jumlahnya mencapai:\n"
 HOL_placate_the_british: "Bujuk Pihak Inggris"
 HOL_placate_the_british_desc: "Kita harus memberikan beberapa konsesi kepada Inggris dalam negosiasi perdagangan saat ini, jika kita ingin mencegah ancaman dimasukkan ke dalam sanksi perdagangan mereka."
 HOL_placate_the_germans: "Bujuk Pihak Jerman"
 HOL_placate_the_germans_desc: "Kita harus memberikan beberapa konsesi kepada Jerman dalam negosiasi perdagangan saat ini, jika kita ingin mencegah ancaman invasi jika mereka tidak puas."
 HOL_radio_oranje: "Radio Oranje"
 HOL_radio_oranje_desc: "Sudah waktunya untuk siaran 'Radio Orange' berbahasa Belanda lainnya di BBC, untuk memberikan harapan bagi mereka yang berada di tanah air yang diduduki maupun mereka yang berjuang demi kemerdekaan bersama sekutu kita."
 HOL_obtain_dockyard_access: "Dapatkan Akses Galangan Kapal"
 HOL_obtain_dockyard_access_desc: "Pada saat invasi, berbagai kapal sedang dalam tahap pembangunan. Kita berhasil menyelamatkan beberapa di antaranya dengan menderek lambung yang belum selesai ke Inggris, tetapi kini kita membutuhkan bantuan Inggris untuk menyelesaikannya."
 HOL_assemble_air_squadron: "Bentuk Skadron Udara"
 HOL_assemble_air_squadron_desc: "Sejumlah rekrutan kita telah menyatakan keinginan untuk belajar menerbangkan pesawat guna berjuang di udara. Kita harus meminta pesawat dari sekutu kita untuk mewujudkannya."
 HOL_request_infantry_equipment: "Minta Perlengkapan Infanteri"
 HOL_request_infantry_equipment_desc: "Jika kita ingin membantu sekutu kita dalam pertempuran, kita harus memperoleh perlengkapan yang diperlukan dari mereka untuk melakukannya."
 HOL_pull_strings_with_british_industrialists: "Manfaatkan Relasi dengan Industrialis Inggris"
 HOL_pull_strings_with_british_industrialists_desc: "Kerja sama industri Anglo-Belanda telah berlangsung selama bertahun-tahun, dan telah melahirkan berbagai perusahaan multinasional, seperti Philips dan Royal Dutch Shell. Kita kini dapat menggunakan koneksi Inggris ini untuk memastikan pasokan bagi pasukan pengasingan kita."
 HOL_request_aid_for_the_engelandvaarders: "Minta Bantuan untuk Para Engelandvaarder"
 HOL_request_aid_for_the_engelandvaarders_desc: "Jarak lebih dari 100 mil di Laut Utara yang memisahkan Inggris dari Belanda bukanlah penghalang bagi orang-orang Belanda yang ingin melarikan diri dari pendudukan dan bertempur bersama rekan-rekan mereka demi pembebasan tanah air. Dengan perahu dayung kecil atau kayak yang reyot, para 'Engelandvaarders' atau 'Pelaut Inggris' ini menerjang perairan terbuka, dalam kondisi yang begitu mengerikan sehingga kurang dari satu dari sepuluh yang selamat dari pelayaran tersebut. Keberanian mereka mencoba pelayaran ini saja sudah menempatkan mereka di antara yang paling berani dari yang paling pemberani, dan merupakan tugas kita untuk meminta Inggris melakukan apa pun yang mereka bisa demi meningkatkan peluang keberhasilan mereka."
 VEN_abc_islands: "Kepulauan ABC"
 VEN_abc_islands_desc: "Kepulauan ABC terletak tepat di lepas pantai kita, dan menurut segala perhitungan seharusnya menjadi milik kita yang sah. Kedekatan geografisnya tidak hanya menjadikannya situasi yang alami, namun hampir semua minyak kita juga disuling di pulau-pulau ini, menjadikannya sangat penting bagi perekonomian kita. Mengingat kelemahan pemerintah Belanda saat ini, mereka tentu tidak akan berani menolak tawaran baik kita untuk 'membantu' mereka dalam mempertahankan kepulauan tersebut..."
 HOL_offer_venezuelan_protection: "Tawarkan Perlindungan ke Venezuela"
 HOL_bernhard: "Bernhard"
 HOL_bernhard_desc: "Menantu Ratu dan suami Putri Juliana, Bernhard van Lippe-Biesterfeld, telah menunjukkan tekad besar untuk memerangi musuh atas nama negaranya. Meski aslinya orang Jerman, ia kini merasa sepenuhnya orang Belanda dan tidak menginginkan apa pun selain menunaikan kewajiban patriotiknya. Mempertimbangkan kepribadiannya yang berjiwa bebas dan mandiri, serta keinginannya untuk terlibat langsung dalam berbagai urusan, memberinya posisi yang diinginkannya bisa saja menimbulkan konsekuensi yang tidak terduga..."
 HOL_give_bernhard_generalship: "Beri Pangkat Jenderal kepada Bernhard"
 HOL_give_bernhard_generalship_desc: "Sang Pangeran telah menyatakan keinginannya untuk bertempur demi tanah air barunya, dan ingin memegang komando pasukan kita, berbagi cobaan dengan mereka, dan memimpin mereka menuju kemenangan."
 HOL_pursue_diplomatic_grievances: "Tindak Lanjuti Keluhan Diplomatik"
 HOL_pursue_diplomatic_grievances_desc: "Penghinaan yang ditujukan kepada Pangeran Bernhard dan seluruh jajaran pemerintahan kita telah meningkat menjadi perselisihan diplomatik penuh hingga ke titik ancaman militer. Kita menuntut permintaan maaf segera dan tanpa syarat, atau kita mungkin terpaksa membuktikan kata-kata kita..."
 HOL_pursue_diplomatic_grievances_tt: "Ini dapat menghasilkan tujuan perang (war goal) terhadap target.\n"
 HOL_relocate_government_to_batavia: "Relokasi Pemerintahan ke Batavia"
 HOL_relocate_government_to_batavia_desc: "Daratan utama kita telah dikuasai musuh, namun koloni kita belum tersentuh. Meskipun bertentangan dengan kehendak Ratu, kita dapat merelokasi pemerintahan kita ke Batavia, ibu kota Hindia Timur, dan melanjutkan upaya perang dari sana."
 HOL_propose_benelux_unification: "Ajukan Penyatuan Benelux"
 HOL_propose_benelux_unification_desc: "Krisis global merebak di mana-mana, dan kita hanyalah bangsa-bangsa kecil di antara bangsa-bangsa besar. Jika ingin melewati badai yang akan datang, kita harus mengupayakan penyatuan di semua tingkat pemerintahan, bahkan jika ini berarti mengorbankan kedaulatan kita."
 HOL_propose_benelux_unification_tt: "§R[BEL.GetNameDefCap] dan [LUX.GetNameDefCap] harus menyetujui perjanjian agar bonus dapat berlaku.§!\n"
 ENG_host_CZE_exile_government: "Bentuk Pemerintahan Pengasingan [CZE.GetAdjective]"
 ENG_demand_treaty_compliance: "Tuntut Kepatuhan Perjanjian"
 ENG_demand_treaty_compliance_tt: "Jika mereka tidak mematuhi dalam §Y60 hari§!, kita akan mendapatkan §YTujuan Perang Menjadikan Boneka§! terhadap mereka.\n"
 ENG_demand_treaty_compliance_tt2: "Ukuran angkatan laut dalam §YKapal Tempur§!, §YPenjelajah Tempur§!, dan §YKapal Induk§! dibandingkan dengan §Y[Root.GetName]§! lebih dari §Y100%§!."
 ENG_demand_treaty_compliance_tt3: "Ukuran angkatan laut dalam §YKapal Tempur§!, §YPenjelajah Tempur§!, dan §YKapal Induk§! dibandingkan dengan §Y[Root.GetName]§! lebih dari §Y65%§!."
 ENG_demand_treaty_compliance_tt4: "Ukuran angkatan laut dalam §YKapal Tempur§!, §YPenjelajah Tempur§!, dan §YKapal Induk§! dibandingkan dengan §Y[Root.GetName]§! lebih dari §Y35%§!."
 ENG_britain_demands_treaty_compliance: "[ENG.GetName] Menuntut Kepatuhan Perjanjian"
 ENG_britain_demands_treaty_compliance_desc: "[ENG.GetNameDefCap] telah menuntut agar kita mengurangi jumlah kapal utama kita untuk kembali mematuhi ketentuan Perjanjian Angkatan Laut Washington."
 ENG_britain_demands_treaty_compliance_tt_1: "Rasio §YKapal Tempur§! dan §YKapal Induk§! dibandingkan dengan §Y[ENG.GetName]§! tidak lebih dari §Y100%§!.\n"
 ENG_britain_demands_treaty_compliance_tt_2: "Rasio §YKapal Tempur§! dan §YKapal Induk§! dibandingkan dengan §Y[ENG.GetName]§! tidak lebih dari §Y65%§!.\n"
 ENG_britain_demands_treaty_compliance_tt_3: "Rasio §YKapal Tempur§! dan §YKapal Induk§! dibandingkan dengan §Y[ENG.GetName]§! tidak lebih dari §Y35%§!.\n"
 foreign_influence: "Pengaruh Asing"
 foreign_influence_desc: "Negara-negara yang telah kita ambil di bawah perlindungan kita berhak mendapatkan pemerintahan yang terbaik dan paling adil. Pengaruh destabilisasi dari ideologi asing harus dibatasi."
 nation_building: "Pembangunan Bangsa di [From.GetNameDef]"
 nation_building_desc: "Kita harus melatih generasi baru administrator untuk membimbing rakyat [From.GetAdjective] menjauh dari totalitarianisme dan menuju demokrasi serta supremasi hukum."
 socialist_education: "Pendidikan Sosialis di [From.GetNameDef]"
 socialist_education_desc: "Musuh-musuh rakyat [From.GetAdjective] menyusup ke sekutu persaudaraan kita dan menabur perselisihan terhadap gerakan demokratis yang kita bina. Kita harus membantu pemerintah yang sah dalam mendidik kembali rakyat dalam ilmu abadi Marx dan Engels."
 paramilitary_training: "Pelatihan Paramiliter di [From.GetNameDef]"
 paramilitary_training_desc: "Agitator sayap kiri dan sampah pengkhianat lainnya melemahkan bangsa [From.GetAdjective]. Kita akan membantu pasukan bersahabat yang bersedia bekerja sama dengan tentara kita."
 military_parade: "Parade Militer di [From.GetNameDef]"
 military_parade_desc: "Kaum demokrat, sosialis, nasionalis, dan produk terkutuk lainnya dari Abad Pencerahan menimbulkan masalah bagi pemerintah [From.GetAdjective]. Kita akan membariskan pasukan perkasa kita melintasi ibu kota [From.GetNameDef] dan menunjukkan kepada mereka kemegahan kekuatan militer [Root.GetAdjective]."
 police_action: "Aksi Kepolisian di [From.GetNameDef]"
 police_action_desc: "Rakyat [From.GetAdjective] siap menerima pemerintahan mandiri yang bertanggung jawab dari kepolisian dan pasukan paramiliter setempat."
 fraternal_republic: "Republik Persaudaraan di [From.GetNameDef]"
 fraternal_republic_desc: "Rakyat [From.GetAdjective] menuntut campur tangan dari pasukan kita untuk menggulingkan tuan tanah dan kapitalis parasit yang berkuasa atas mereka."
 ultranationalist_coup: "Kudeta Ultranasionalis di [From.GetNameDef]"
 ultranationalist_coup_desc: "Pemerintah [From.GetAdjective] yang lemah tidak layak menerima dukungan kita. Kita harus membuka era baru bagi rakyat mereka!"
 military_dictatorship: "Diktatur Militer di [From.GetNameDef]"
 military_dictatorship_desc: "Ada banyak mata rantai yang lemah di tubuh pemerintah [From.GetAdjective] yang harus kita singkirkan. Kaum ateis, serikat buruh, dan bahkan kaum liberal dilaporkan berada di kementerian [From.GetLeader]."
 MTG_naval_treaties: "Perjanjian Angkatan Laut"
 MTG_naval_treaties_desc: "Demi membatasi pengeluaran dan menghindari perlombaan senjata laut yang saling merugikan, negara-negara adidaya laut dunia telah menandatangani sejumlah perjanjian, yang membatasi ukuran keseluruhan armada mereka serta bobot masing-masing kapal. Sebagai salah satu penandatangan perjanjian ini, kita terikat pada pembatasan tertentu, namun selama lawan kita juga mematuhinya, keseimbangan kekuatan harus tetap terjaga.\n\nSaat ini kita berada [GetStrengthRatioBritain] [GetRelevantNavalTreatyNation] dalam Kekuatan Kapal Utama (Capital Ship)."
 ENG_Naval_treaty_nation: "@ENG Britania"
 USA_Naval_treaty_nation: "@USA [USA.GetName]"
 Naval_treaty_over_100: "di atas"
 Naval_treaty_lower_than_50: "di bawah 50% dari"
 Naval_treaty_50: "antara 50 dan 75% dari"
 Naval_treaty_75: "antara 75 dan 90% dari"
 Naval_treaty_90: "antara 90% dan 100% dari"
 MTG_abandon_treaty_democratic: "Menarik Diri dari Perjanjian Angkatan Laut"
 MTG_abandon_treaty_democratic_desc: "Upaya untuk membatasi persenjataan angkatan laut telah gagal. Kita harus diizinkan untuk mempersenjatai diri kembali guna menghadapi ancaman masa depan."
 MTG_abandon_treaty_fascist: "Tinggalkan Perjanjian Angkatan Laut"
 MTG_abandon_treaty_fascist_desc: "Negara-negara demokrasi di dunia dengan bodohnya telah membelenggu diri mereka sendiri pada aturan hukum. Namun dalam perjuangan antarbangsa hanya ada satu hukum: hukum alam, dan hukum alam menuntut kekuatan. Hasrat kita untuk membangun armada yang perkasa tidak akan pernah bisa dibendung!"
 MTG_abandon_treaty_japanese: "Tinggalkan Perjanjian Angkatan Laut"
 MTG_abandon_treaty_japanese_desc: "Negara-negara demokrasi di dunia dengan bodohnya telah membelenggu diri mereka sendiri pada aturan hukum. Namun dalam perjuangan antarbangsa hanya ada satu hukum: hukum alam, dan hukum alam menuntut kekuatan. Hasrat kita untuk membangun armada yang perkasa tidak akan pernah bisa dibendung!"
 MTG_cheat_on_treaty: "Curangi Perjanjian"
 MTG_cheat_on_treaty_desc: "Pembatasan yang diberlakukan terhadap desain kapal kita oleh Perjanjian Angkatan Laut terlalu kejam. Dengan sedikit pembukuan kreatif, kita mungkin bisa membebaskan sejumlah bobot untuk sesuatu yang lebih berguna..."
 MTG_second_london_conference: "Konferensi Perlucutan Senjata Angkatan Laut London Kedua sedang berlangsung"
 MTG_invite_FROM_to_treaty: "Undang [From.GetNameDef] untuk bergabung dengan Perjanjian Angkatan Laut"
 MTG_send_treaty_warning_to_FROM_previous_signatory: "Keluarkan Peringatan kepada [From.GetNameDef]"
 MTG_treaty_reduction_mission: "Terapkan Perlucutan Senjata Angkatan Laut"
 MTG_treaty_reduction_mission_desc: "Kita telah berkomitmen secara terbuka untuk mengurangi kapal utama aktif di angkatan laut kita. Kita harus segera menyingkirkan beberapa di antaranya untuk memenuhi angka yang telah disepakati."
 MTG_treaty_reduction_signatory_mission: "Kembali ke Batas Ukuran Angkatan Laut Perjanjian"
 MTG_treaty_reduction_signatory_mission_desc: "Sebagai penandatangan Perjanjian Angkatan Laut, kita hanya diizinkan memiliki sejumlah kapal utama tertentu. Saat ini kita melebihi batas kuota yang ditentukan, dan orang-orang mulai bertanya-tanya apakah kita benar-benar berkomitmen pada gagasan pembatasan senjata internasional seperti yang kita klaim."
 MTG_treaty_renew_mission: "Konferensi Angkatan Laut London Kedua"
 MTG_escalator_clause_invocation_mission: "Klausul Eskalator Diberlakukan"
 MTG_escalator_clause_invocation_mission_desc: "Salah satu penandatangan perjanjian telah memutuskan untuk tidak lagi mematuhi perjanjian dan bahkan saat ini kemungkinan sedang membangun kapal yang lebih besar dan lebih kuat. Beruntung, sebuah klausul dalam Perjanjian mengizinkan kita untuk secara otomatis memberlakukan Klausul Eskalator, yang memungkinkan kita melonggarkan pembatasan ukuran kapal dan persenjataan dalam situasi ini."
 MTG_escalator_clause_tt: "Ini akan mengurangi pembatasan biaya Kapal Utama bagi semua penandatangan lainnya."
 MTG_send_treaty_warning_to_FROM: "Kirim peringatan ke [From.GetNameDef]"
 MTG_send_treaty_warning_to_FROM_desc: "Tampaknya [From.GetNameDef] mengira kita tidak akan menyadari kejanggalan dalam pembangunan angkatan laut mereka. Kita harus memberi tahu mereka tentang kesalahan penilaian mereka."
 ENG_declare_american_monarchy: "Deklarasikan Monarki Amerika"
 created_american_monarchy: "Mendirikan monarki Amerika.\n"
 ENG_install_american_monarchy: "Tegakkan Monarki Amerika"
 ENG_create_pan_north_american_state: "Bentuk Negara Pan-Amerika Utara"
 ENG_create_pan_north_american_state_tt: "Menganeksasi dan memperoleh klaim inti (core) di seluruh negara bagian §YAmerika§!.\nAkan dikenal sebagai §YDominion Amerika Utara§!.\n"
 USA_reshuffle_congress: "Rombak Kongres"
 USA_join_the_unions: "Bergabung dengan Serikat Buruh"
 USA_freedom_for_Papua: "Kemerdekaan Papua"
 USA_indonesian_liberation: "Pembebasan Indonesia"
 USA_decolonisation: "Dekolonisasi"
 USA_readmit_state_tt: "Negara bagian akan memulai proses untuk menjadi wilayah inti (core)."
 USA_raise_silver_legions: "Bentuk Legiun Perak (Silver Legions)"
 ENG_expected_decolonization: "Dekolonisasi yang Diharapkan"
 ENG_expected_decolonization_tt: "Upaya kudeta akan digagalkan.\n"
 TUR_recall_ataturk_to_active_service: "Panggil Kembali Atatürk ke Tugas Aktif"
 TUR_recall_ataturk_to_active_service_desc: "Mustafa Kemal Atatürk, marsekal lapangan pertama Turki, memainkan peran yang sangat penting dalam mengamankan kemerdekaan kita dalam Kampanye Nasional. Beliau memiliki salah satu pemikiran militer paling tajam di benua ini, dan takdir telah mengharuskan kita memanggil kembali Sang Bapak Bangsa Turki untuk secara pribadi memimpin pasukan kita menuju kemenangan sekali lagi."
 gateway_to_europe_hol_tt: "Memperoleh 5 poin pengaruh perdagangan"
