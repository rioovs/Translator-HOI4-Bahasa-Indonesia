 USA_special_measures: "Langkah-Langkah Khusus"
 USA_special_measures_desc: "Terkadang, Anggota Kongres memerlukan insentif pribadi yang lebih langsung untuk menyadari bahwa apa yang terbaik bagi rekening bank mereka juga merupakan yang terbaik bagi negara mereka."
