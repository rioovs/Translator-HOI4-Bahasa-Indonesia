 ENG_trade_unions_demand_legislation_amendment_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengerahkan upaya politik ekstra untuk mengubah usulan undang-undang saat ini sesuai dengan keinginan mereka."
 ENG_trade_unions_demand_conscription_limitations: "Batasi Wajib Militer"
 ENG_trade_unions_demand_conscription_limitations_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan membatasi upaya wajib militer kita untuk sementara waktu."
 ENG_trade_unions_demand_conscription_limitations_tt: "Mencegah peningkatan Hukum Wajib Militer selama §Y365 hari§!.\n"
 ENG_trade_unions_demand_conscription_limitations_tt2: "Jika Hukum Wajib Militer saat ini di atas §YHanya Sukarelawan§!, menurunkan Hukum Wajib Militer sebanyak satu tingkat.\n"
 ENG_cannot_increase_conscription_law: "Berjanji kepada Serikat Buruh untuk tidak meningkatkan wajib militer.\n"
 ENG_trade_unions_demand_workplace_safety_legislation: "Sahkan Undang-Undang Keselamatan Pabrik"
 ENG_trade_unions_demand_workplace_safety_legislation_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengesahkan undang-undang keselamatan kerja baru, memberikan perlindungan lebih lanjut bagi tenaga kerja kita, dengan konsekuensi penurunan produktivitas yang tak terhindarkan."
 ENG_trade_unions_demand_increase_in_paid_leave: "Sahkan Kenaikan Cuti Berbayar"
 ENG_trade_unions_demand_increase_in_paid_leave_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengesahkan undang-undang yang memberikan lebih banyak cuti berbayar bagi para pekerja dari perusahaan mereka."
 ENG_trade_unions_demand_minimum_pay_increase: "Sahkan Kenaikan Upah Minimum"
 ENG_trade_unions_demand_minimum_pay_increase_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengesahkan undang-undang yang menaikkan upah minimum untuk semua sektor."
 ENG_trade_unions_demand_construction_safety_legislation: "Sahkan Undang-Undang Keselamatan Konstruksi"
 ENG_trade_unions_demand_construction_safety_legislation_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengesahkan undang-undang keselamatan konstruksi baru, memberikan perlindungan lebih lanjut bagi mereka yang bekerja di industri konstruksi."
 ENG_trade_unions_demand_mandatory_union_days: "Tetapkan Hari Serikat Buruh Wajib"
 ENG_trade_unions_demand_mandatory_union_days_desc: "Untuk memenuhi tuntutan Serikat Buruh, kita akan mengesahkan undang-undang baru yang mewajibkan seluruh buruh berpartisipasi dalam 'Hari Serikat', mengedukasi mereka tentang hak-hak mereka, mendorong mereka berserikat, dan menyediakan waktu untuk kegiatan terkait serikat lainnya."
 ENG_trade_unions_demand_referendum: "Gelar Referendum"
 ENG_trade_unions_demand_referendum_desc: "Seiring melonjaknya dukungan sosialis, kita tidak memiliki pilihan selain menyetujui tuntutan Serikat Buruh untuk mengadakan referendum. Hasilnya hampir dapat dipastikan..."
