 ENG_ally_the_canadian_imperialist_uprising: "Sekutukan Pemberontakan Kanada"
 ENG_ally_the_canadian_imperialist_uprising_desc: "Kita tidak akan membiarkan kaum loyalis Kanada menghadapi nasib mereka sendirian; mereka akan menikmati dukungan militer kita, serta perlindungan dan kepemimpinan berkelanjutan kita setelah perang dimenangkan."
 ENG_ally_the_south_african_imperialist_uprising: "Sekutukan Pemberontakan Afrika Selatan"
 ENG_ally_the_south_african_imperialist_uprising_desc: "Kita tidak akan membiarkan kaum loyalis Afrika Selatan menghadapi nasib mereka sendirian; mereka akan menikmati dukungan militer kita, serta perlindungan dan kepemimpinan berkelanjutan kita setelah perang dimenangkan."
 ENG_ally_the_australian_imperialist_uprising: "Sekutukan Pemberontakan Australia"
 ENG_ally_the_australian_imperialist_uprising_desc: "Kita tidak akan membiarkan kaum loyalis Australia menghadapi nasib mereka sendirian; mereka akan menikmati dukungan militer kita, serta perlindungan dan kepemimpinan berkelanjutan kita setelah perang dimenangkan."
 ENG_ally_the_new_zealand_imperialist_uprising: "Sekutukan Pemberontakan Selandia Baru"
