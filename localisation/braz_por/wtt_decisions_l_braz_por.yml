 JAP_ichi_go: "Operasi Ichi-Go"
 JAP_ichi_go_desc: "Akhir dari perang sudah di depan mata. Dengan dorongan terakhir dan upaya penuh tekad, kita dapat membawa konflik ini ke akhir yang cepat. Namun, jika kita tidak mampu meraih kemenangan dalam tahun depan, kita mungkin mengalami ketidakstabilan internal seiring meningkatnya opini publik yang menentang eskalasi upaya perang..."
 JAP_conquer_china: "Taklukkan Tiongkok"
 JAP_release_korea: "Kemerdekaan Korea"
 JAP_southern_expansion: "Ekspansi ke Selatan (Nanshin-ron)"
 JAP_southern_expansion_desc: "Melanjutkan doktrin Angkatan Laut Nanshin-ron, inilah saatnya kita merangsek kekuatan imperialis dan kolonialis di selatan dan memperluas domain kita untuk menguasai seluruh jalur selatan."
 JAP_sue_for_peace_CHI: "Tawarkan Syarat Menyerah kepada [From.GetNameDef]"
 JAP_sue_for_peace_TT: "Tidak ada wilayah inti daratan utama §YTiongkok§! atau §YKorea§! yang dikuasai oleh §YJepang§! atau bawahannya."
 JAP_sue_for_peace_CHI_desc: "Kita telah kehilangan cengkeraman kita di daratan utama. Militer berpandangan bahwa sangat tidak mungkin kita dapat merebut kembali wilayah yang hilang. Pemerintah sipil menyarankan agar kita mencari kesepakatan damai demi setidaknya mempertahankan kedaulatan kita atas pulau-pulau utama."
 JAP_sue_for_peace_MAN: "Tawarkan Syarat Menyerah kepada [From.GetNameDef]"
 JAP_sue_for_peace_MAN_desc: "Kita telah kehilangan cengkeraman kita di daratan utama. Militer berpandangan bahwa sangat tidak mungkin kita dapat merebut kembali wilayah yang hilang. Pemerintah sipil menyarankan agar kita mencari kesepakatan damai demi setidaknya mempertahankan kedaulatan kita atas pulau-pulau utama."
 JAP_sue_for_peace_nuke: "Tawarkan Penyerahan Tanpa Syarat"
 JAP_sue_for_peace_nuke_desc: "Musuh telah mengerahkan bom baru yang paling kejam. Perkembangan perang tidak sepenuhnya menguntungkan kita. Kita harus menanggung apa yang tak tertanggungkan."
 JAP_sue_for_peace_nuke_mission: "Lakukan serangan nuklir di tanah Jepang"
 JAP_sue_for_peace_nuke_mission_desc: "Uji coba bom nuklir yang baru-baru ini berhasil menawarkan alternatif selain invasi skala penuh ke Kepulauan Utama Jepang. Laporan intelijen menunjukkan bahwa jika kita merebut kendali Okinawa dan Iwo Jima dari Jepang, dan mengurangi armadanya menjadi hanya 30 kapal, menghantam dua lokasi di Kepulauan Utama dengan bom nuklir secara berturut-turut akan memaksa pemerintah Jepang menyerah tanpa syarat."
 JAP_request_soviet_support: "Minta Dukungan Soviet"
 JAP_request_soviet_support_desc: "Kita membutuhkan bantuan dalam perang saudara kita saat ini, dan pendukung yang paling mungkin bagi perjuangan kita adalah Soviet di utara kita. Mungkin kita bisa menukar Semenanjung Sakhalin Selatan sebagai imbalan atas sekelompok divisi sukarelawan Soviet."
 JAP_nuke_1: "Serangan nuklir pertama ke Jepang dilaksanakan"
 JAP_nuke_2: "Serangan nuklir kedua ke Jepang dilaksanakan"
 foreign_politics: "Kebijakan Luar Negeri"
 JAP_pressure_france: "Tuntut Indochina"
 JAP_break_the_london_naval_treaty: "Langgar Perjanjian Angkatan Laut London"
 JAP_break_the_london_naval_treaty_desc: "Pembatasan keterlaluan dalam Perjanjian Angkatan Laut London merupakan ancaman bagi keamanan bangsa kita. Kita harus memiliki kebebasan untuk membangun angkatan laut yang mampu menghadapi negara mana pun yang menantang apa yang menjadi hak kita."
 JAP_tora_tora_tora: "Tora! Tora! Tora!"
 JAP_tora_tora_tora_desc: "Pukulan pertama telah menanti. Setelah itu, kita harus terus bergerak cepat, memanfaatkan momentum yang telah kita peroleh untuk melumpuhkan musuh-musuh kita sebelum mereka menyadari apa yang telah terjadi."
 JAP_war_with_soviet_union: "Deklarasikan Perang terhadap [SOV.GetNameDef]"
 JAP_war_with_soviet_union_desc: "Sekutu kita di Eropa telah menandatangani pakta non-agresi dengan [SOV.GetNameDef]. Namun, perang kita tidak bisa menunggu; kita harus secara sepihak mengejar konflik dengan kaum Komunis, bahkan jika itu berisiko mengasingkan sekutu kita."
 prospect_for_resources: "Eksplorasi Sumber Daya"
 prospect_for_resources_desc: "Ahli geologi kita telah menemukan sejumlah deposit sumber daya yang menjanjikan di dalam wilayah kita. Kita dapat mengeluarkan sejumlah modal untuk mengembangkan ladang-ladang ini. Kemajuan dalam teknologi ekstraksi mungkin membuat lebih banyak deposit layak untuk dieksploitasi."
