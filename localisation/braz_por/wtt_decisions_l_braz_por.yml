 recall_von_lettow_vorbeck: "Panggil Kembali Paul von Lettow-Vorbeck"
 recall_von_lettow_vorbeck_desc: "Dengan dipulihkannya Hohenzollern ke atas takhta, Singa Tua Afrika Timur sekali lagi menawarkan jasanya."
 GER_sharpen_air_safety_regulations: "Perketat Regulasi Keselamatan Penerbangan"
 GER_sharpen_air_safety_regulations_desc: "Dengan regulasi keselamatan yang lebih ketat, kita dapat mencegah beberapa penyebab kecelakaan fatal yang paling umum, termasuk yang berkaitan dengan kapal udara (airship)."
 MAN_recruit_bandits_north: "Rekrut Bandit Utara"
 MAN_recruit_bandits_north_desc: "Setiap peluru yang dihabiskan untuk memburu bandit adalah satu peluru lebih sedikit yang tersedia untuk pertempuran yang akan datang. Alih-alih memerangi rakyat kita sendiri, kita harus menawarkan mereka cara untuk menebus kesalahan melalui pengabdian kepada Kaisar."
 MAN_recruit_bandits_west: "Rekrut Bandit Barat"
 MAN_recruit_bandits_west_desc: "Setiap peluru yang dihabiskan untuk memburu bandit adalah satu peluru lebih sedikit yang tersedia untuk pertempuran yang akan datang. Alih-alih memerangi rakyat kita sendiri, kita harus menawarkan mereka cara untuk menebus kesalahan melalui pengabdian kepada Kaisar."
 MAN_recruit_bandits_east: "Rekrut Bandit Timur"
 MAN_recruit_bandits_east_desc: "Setiap peluru yang dihabiskan untuk memburu bandit adalah satu peluru lebih sedikit yang tersedia untuk pertempuran yang akan datang. Alih-alih memerangi rakyat kita sendiri, kita harus menawarkan mereka cara untuk menebus kesalahan melalui pengabdian kepada Kaisar."
 MAN_recruit_bandits_generic: "Rekrut Sisa-Sisa Bandit"
 MAN_recruit_bandits_generic_desc: "Penjara dan kamp kerja kita dipenuhi oleh mereka yang pernah bertempur melawan kita. Kita membutuhkan setiap prajurit dan setiap senapan dalam perjuangan demi kemerdekaan kita. Kaisar dapat menunjukkan belas kasih dan kemurahan hatinya yang legendaris dengan memberi para penjahat ini cara untuk menebus diri melalui pengabdian."
 MAN_release_bandits: "Bebaskan Para Bandit"
 MAN_release_bandits_desc: "Mantan penjahat dan perusuh telah menunjukkan bahwa mereka bersedia berkorban demi Kaisar dan kini dapat dilepaskan kembali dengan aman ke dalam masyarakat."
 MAN_war_preparations: "Perang Kemerdekaan"
 MAN_raise_manchu_banner: "Kibarkan Panji Manchu (Eight Banners)"
 MAN_raise_manchu_banner_desc: "Di masa lampau, para Kaisar Qing dapat memanggil prajurit panji mereka untuk bertempur dalam perang. Meskipun zaman telah berubah, prinsip yang sama tetap berlaku. Wangsa Qing membutuhkan jasa panji-panji mereka sekali lagi."
 MAN_disband_the_banners: "Bubarkan Prajurit Panji"
 MAN_disband_the_banners_desc: "Setelah tugas mereka selesai, panji-panji Manchu dapat kembali dipulangkan ke rumah dan keluarga mereka - hingga mereka dibutuhkan sekali lagi."
 MAN_fund_underground_gun_shops: "Bentuk Bengkel Senjata Bawah Tanah"
 MAN_fund_underground_gun_shops_desc: "Meskipun tidak mendapatkan skala ekonomi yang sama dengan pabrik-pabrik besar - dan memiliki kendali mutu yang sangat bervariasi - mendistribusikan produksi senjata ke bengkel-bengkel kecil yang tersebar di seluruh negeri adalah cara terbaik untuk meningkatkan produksi secara tergesa-gesa."
 MAN_remove_underground_gun_shops: "Tutup Bengkel Senjata Bawah Tanah"
 MAN_remove_underground_gun_shops_desc: "Bengkel senjata yang kita buat telah memenuhi tujuannya. Sudah waktunya untuk kembali ke bentuk produksi senjata yang lebih terorganisir."
 MAN_divert_machine_tools: "Alihkan Perkakas Mesin"
 MAN_divert_machine_tools_desc: "Dengan Jalur Kereta Api di bawah kendali kita, kita dapat memastikan beberapa pengiriman perkakas mesin 'hilang' dalam sebuah 'kesalahan administratif'."
 MAN_prepare_to_seize_arms: "Bersiap Menyita Depot Senjata Jepang"
 MAN_prepare_to_seize_arms_desc: "Depot dan tempat penimbunan pasokan yang tersebar di seluruh negeri tidak dijaga dengan baik. Serangan yang direncanakan dan diatur waktunya dengan baik dapat merebutnya dengan korban minimal, memberi kita akses ke senjata modern dan pada saat yang sama menghilangkan amunisi serta pasokan Jepang. Menghabiskan lebih banyak waktu dan sumber daya untuk hal ini akan memungkinkan kita menyita lebih banyak depot."
 MAN_seize_arms: "Jalankan Rencana"
 MAN_seize_arms_desc: "Serang dengan cepat! DEMI KAISAR!"
 MAN_can_prepare_more_tt: "Persiapan lebih lanjut masih dapat dilakukan untuk merebut depot tambahan.\n"
