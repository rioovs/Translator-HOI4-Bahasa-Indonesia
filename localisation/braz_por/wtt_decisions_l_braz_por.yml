 JAP_test_the_soviets: "Uji Kekuatan [SOV.GetAdjective]"
 JAP_test_the_soviets_desc: "Kita berbagi perbatasan panjang dengan [SOV.GetNameDef] di Korea dan Manchuria. Sejumlah besar titik konflik potensial ada di mana pasukan kita dapat bentrok kapan saja. Bagi kita, hal ini menciptakan kesempatan untuk menguji tanggapan [SOV.GetAdjective] terhadap provokasi kecil."
 JAP_border_conflict_warning_SOV: "Provokasi Perbatasan di Perbatasan Jepang"
 JAP_border_conflict_warning_SOV_desc: "Telah terjadi bentrokan antara penjaga perbatasan kita dan tentara Jepang di perbatasan bersama kita di Korea. Sumber intelijen di Jepang melaporkan bahwa ini mungkin hanyalah langkah awal dalam konfrontasi yang lebih besar. Kita harus segera memperkuat perbatasan dengan Jepang."
 JAP_border_conflict_escalation_warning_SOV: "Persiapan Jepang"
 JAP_border_conflict_escalation_warning_SOV_desc: "Pengintaian udara telah mengonfirmasi pergerakan pasukan besar di sisi perbatasan Jepang. Kita tidak tahu apakah atau kapan Jepang memutuskan untuk menyerang, tetapi kita harus siap."
 JAP_border_incident_forgotten: "Jendela Peluang"
 JAP_border_incident_forgotten_desc: "Jika kita ingin memanfaatkan insiden di perbatasan Soviet dengan Korea, kita harus menyerang dengan cepat."
 JAP_escalate_incident_to_border_conflict_SOV: "Eskalasi Insiden"
 JAP_escalate_incident_to_border_conflict_SOV_desc: "Tampaknya Soviet tidak mundur dari konflik. Pada titik ini, kita harus memilih antara meningkatkan ke konfrontasi bersenjata atau mundur sendiri."
 JAP_border_conflict_time_until_cancelled: "Akhiri konflik"
 JAP_border_conflict_time_until_cancelled_desc: "Pada laju saat ini, kita hanya dapat mempertahankan operasi tempur dalam waktu terbatas sebelum kita perlu menghentikan pertempuran."
 JAP_border_conflict_escalate_conflict: "Eskalasi Konflik"
 JAP_border_conflict_escalate_conflict_desc: "Konflik di perbatasan dengan [FROM.GetNameDef] terhenti. Mungkin dengan meningkatkan eskalasi lebih jauh dan mengerahkan lebih banyak pasukan ke medan operasi, kita masih dapat meraih kemenangan."
 JAP_border_conflict_escalate_to_war: "Deklarasikan Perang"
 JAP_border_conflict_escalate_to_war_desc: "Pertempuran di wilayah yang disengketakan telah berlangsung beberapa waktu sekarang, dan tidak menunjukkan tanda-tanda berhenti. Kita harus bersiap untuk mengambil langkah berikutnya dan memandang konflik ini sebagai langkah awal dalam perang umum."
 JAP_border_conflict_back_out_of_conflict: "Mundur"
 JAP_border_conflict_back_out_of_conflict_desc: "Bahaya konflik ini berkembang di luar kendali dan menjadi perang skala penuh antara negara kita terlalu besar. Kita harus membatasi kerugian kita sekarang dan mengirim sinyal diplomatik ke pihak lain."
 ROOT_inherit_current_scope_wars_effect: "[Root.GetNameDef] bergabung dalam semua perang.\n"
