 GER_aid_hun_democratic_civil_war: "Intervensi dalam Perang Saudara Hungaria"
 GER_aid_rom_democratic_civil_war: "Intervensi dalam Perang Saudara Rumania"
 GER_austro_hungarian_empire: "Austria-Hungaria"
 GER_mefo_bills_category: "Surat Utang MEFO"
 GER_mefo_bills_category_desc: "Demi mendanai industri militer kita yang kian berkembang, dan merahasiakannya dari mata Inggris dan Prancis, kita terpaksa menggunakan entitas neraca untuk menyalurkan pembayaran dalam bentuk surat promes. Jika kita tidak menggunakan koneksi politik kita untuk memperpanjang tanggal jatuh tempo surat-surat ini, kita akan dipaksa untuk membayarnya kembali dan tidak akan lagi menerima manfaatnya."
 GER_mefo_bills_mission: "Jatuh Tempo Surat Utang MEFO"
 GER_can_delay_mefo_payment: "Dapat menunda pembayaran Surat Utang MEFO."
 GER_mefo_bills_mission_desc: "Surat utang yang kita terbitkan akan segera jatuh tempo. Kita harus memutuskan apakah akan memperpanjangnya atau mulai membayar."
 GER_extend_mefo_bills: "Surat Utang MEFO"
 GER_extend_mefo_bills_desc: "Perpanjang tanggal jatuh tempo Surat Utang MEFO selama 3 bulan lagi, memungkinkan kita terus menikmati manfaatnya selama periode tersebut. Namun, hal ini juga akan meningkatkan biaya pembayaran akhir kita."
 GER_extend_mefo_bills_tt: "Putuskan apakah akan memperpanjang '§YSurat Utang MEFO§!' atau mulai membayar.\n"
 GER_mefo_bills_mission_tt: "Terbitkan perpanjangan enam bulan atas '§YSurat Utang MEFO§!', yang mulai berlaku saat tanggal jatuh tempo kumpulan surat utang MEFO saat ini.\n\nBiaya setiap perpanjangan akan meningkat secara progresif, hingga perang pecah, di mana ketergantungan pada surat utang MEFO dihapuskan dan pembayaran ditunda sampai setelah berakhirnya perang.\n\n"
 GER_mefo_bills_effect_in_days: "Hal berikut akan terjadi dalam [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] hari:\n"
 GER_mefo_bills_extension_timer: "Sebelum tanggal jatuh tempo Surat Utang MEFO."
 GER_mefo_bills_extension: "Kurang dari 60 hari sejak Surat Utang MEFO diperpanjang."
 GER_mefo_bills_extended: "Surat Utang MEFO Diperpanjang"
 GER_renew_mefos: "Perbarui Surat Utang MEFO"
 GER_renew_mefos_desc: "Reichsbank sangat penting dalam membangun kembali dan mempersenjatai bangsa kita. Jelas kita telah membuat kesalahan dalam keputusan kita untuk melunasi utang kita, dan kita harus memperpanjang Surat Utang MEFO untuk beberapa bulan lagi."
 GER_cancel_mefos: "Batalkan Surat Utang MEFO"
 GER_cancel_mefos_desc: "Kita telah terlalu lama bergantung pada Reichsbank untuk rekonstruksi industri senjata kita. Sudah saatnya kita menepati kesepakatan surat promes kita dengan para produsen senjata kita dan mengakhiri sandiwara \"Surat Utang MEFO\" ini."
 GER_case_anton_category: "Case Anton"
 GER_case_anton_category_desc: "Tujuan di balik pembentukan Prancis Vichy selalu untuk menjauhkan koloni-koloni Prancis dan armada Prancis dari tangan sekutu. Namun, perjanjian ini dapat kita batalkan kapan saja. Kita memiliki rencana untuk mengintegrasikan wilayah tersebut secara paksa, serta melakukan gebrakan kilat ke pangkalan armada Prancis di Toulon."
 GER_case_anton: "Jalankan Case Anton"
 GER_case_anton_tt2: "Tidak mengontrol mayoritas negara bagian Prancis di Afrika Utara."
 GER_case_anton_desc: "Negara boneka kita di Prancis telah melampaui masa kegunaannya. Kita akan segera memulai integrasi ke dalam [Root.GetName], dan, jika kita bergerak cukup cepat, kita bahkan dapat mengambil alih sisa-sisa armada Prancis."
 GER_case_anton_tt: "Menganeksasi Prancis Vichy dalam 7 hari dan menyita armada Prancis.\n\n§RPrancis dapat menenggelamkan armada mereka sendiri kecuali pasukan Jerman berada di Toulon dalam waktu 2 hari!§!\n"
 GER_case_red: "Fall Rot"
 GER_operation_marita: "Unternehmen Marita"
 political_actions: "Tindakan Politik"
 ban_fascist_party: "Larang Fasisme"
 ban_fascist_party_desc: "Dalam situasi saat ini, membiarkan partai-partai fasis terus berorganisasi akan merusak kemampuan kita untuk memerintah secara efektif. Tindakan drastis perlu diambil."
 ban_fascist_party_tt: "Perubahan popularitas Fasisme: §G-§![?.Root.party_popularity@fascism|%0G].\n"
 ban_democratic_party: "Larang Partai Demokratis"
 ban_democratic_party_desc: "Partai-partai di pusat politik telah terlalu lama menjadi duri dalam daging bagi pemerintah kita. Sikap bersikukuh mereka pada 'hak-hak' individu merusak upaya kita untuk menciptakan bangsa yang lebih baik bagi seluruh rakyat kita."
 ban_democratic_party_tt: "Perubahan popularitas Demokrasi: §G-§![?.Root.party_popularity@democratic|%0G].\n"
 ban_communist_party: "Larang Komunisme"
 ban_communist_party_desc: "Partai Komunis kerap melancarkan protes terhadap pemerintah di setiap kesempatan, menebarkan ketidakpuasan dan mempersulit jalannya pemerintahan. Sudah saatnya untuk menindak tegas hal ini."
 ban_communist_party_tt: "Perubahan popularitas Komunisme: §G-§![?.Root.party_popularity@communism|%0G].\n"
 ban_neutrality_party_tt: "Perubahan popularitas Non-Blok: §G-§![?.Root.party_popularity@neutrality|%0G].\n"
 ban_neutrality_party: "Larang Aktivitas [ROOT.GetNeutralParty]"
 LUX_ban_neutrality_party: "Larang Aktivitas Monarkis"
 anti_fascist_raids: "Serangan Anti-Fasis"
 anti_fascist_raids_desc: "Kita harus menindak tegas elemen-elemen fasis di negara kita demi stabilitas domestik jangka panjang. Pengaruh mereka terlalu besar, dan berpotensi menjadi masalah bagi pemerintah."
 anti_democratic_raids: "Serangan Anti-Demokratis"
 anti_democratic_raids_desc: "Kita harus menindak tegas elemen-elemen demokratis di negara kita demi stabilitas domestik jangka panjang. Pengaruh mereka terlalu besar, dan berpotensi menjadi masalah bagi negara."
 anti_communist_raids: "Serangan Anti-Komunis"
 anti_communist_raids_desc: "Kita harus menindak tegas elemen-elemen komunis di negara kita demi stabilitas domestik jangka panjang. Pengaruh mereka terlalu besar, dan berpotensi menjadi masalah bagi pemerintah."
 anti_neutrality_raids: "Gerebek Pembangkang Politik"
 LUX_anti_neutrality_raids: "Serangan Anti-Monarkis"
 anti_neutrality_raids_desc: "Kita harus menindak tegas aktivitas pembangkang di negara kita demi stabilitas domestik jangka panjang. Cita-cita politik mereka terlalu jauh berbeda dari cita-cita kita, dan berpotensi menjadi masalah bagi pemerintah."
 object_to_attaches: "Ajukan Keberatan atas Atase Militer"
 object_to_attaches_desc: "Musuh kita menerima bantuan asing! Kita harus menyampaikan keberatan keras dan menuntut penarikan atase militer mana pun."
