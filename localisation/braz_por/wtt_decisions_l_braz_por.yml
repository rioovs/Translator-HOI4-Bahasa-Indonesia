 demand_tribute_from_new_communist_china: "Tuntut Peningkatan Upeti"
 blow_suez_canal: "Ledakkan Terusan Suez"
 blow_suez_canal_desc: "Kita tidak boleh membiarkan musuh kita menggunakan Terusan Suez yang sangat penting secara strategis. Oleh karena itu kita harus memulai persiapan untuk menimbulkan kerusakan terarah yang cukup pada terusan sehingga terusan tersebut tidak dapat beroperasi dalam jangka waktu yang lama. Hal ini akan sangat membatasi kemampuan musuh untuk memindahkan kapal dari Asia dan Afrika Timur ke Mediterania."
 blow_panama_canal: "Ledakkan Terusan Panama"
 blow_panama_canal_desc: "Kita tidak boleh membiarkan musuh kita menggunakan Terusan Panama yang sangat penting secara strategis. Oleh karena itu kita harus memulai persiapan untuk menimbulkan kerusakan terarah yang cukup pada terusan sehingga terusan tersebut tidak dapat beroperasi dalam jangka waktu yang lama. Hal ini akan sangat mempersulit musuh untuk memindahkan kapal dari Pasifik ke Atlantik, dan sebaliknya."
 rebuild_suez_canal: "Perbaiki Terusan Suez"
 rebuild_suez_canal_desc: "Terusan Suez sangat penting bagi upaya perang kita. Kita harus mengalokasikan sumber daya apa pun yang diperlukan untuk membangun kembali terusan besar ini, sehingga kita dapat menggunakannya untuk melintasi kapal dan pasukan secara bebas antara Mediterania dan Samudra Hindia."
 rebuild_panama_canal: "Perbaiki Terusan Panama"
 rebuild_panama_canal_desc: "Terusan Panama sangat penting bagi upaya perang kita. Kita harus mengalokasikan sumber daya apa pun yang diperlukan untuk membangun kembali terusan besar ini, sehingga kita dapat menggunakannya untuk melintasi kapal dan pasukan secara bebas antara Samudra Pasifik dan Atlantik."
 border_war_with_from: "Perang Perbatasan dengan [From.GetNameDef]"
 MAN_banditry_category: "Aksi Bandit"
 MAN_banditry_category_desc: "Tentara Kwantung menunjukkan sedikit minat untuk membantu penduduk Manchuria, memandangnya sebagai pendudukan militer daripada pembangunan bangsa. Pemerintah Manchukuo, sebagaimana adanya, hanya diberi sedikit sumber daya oleh Jepang untuk menjaga ketertiban. Ke dalam kekosongan kekuasaan ini masuklah segala macam bandit: terkadang mereka menyebut diri sebagai 'pejuang kemerdekaan', membunuh dan merampok atas nama cita-cita abstrak seperti 'pembebasan nasional' atau 'internasionalisme proletar', tetapi lebih sering tanpa ideologi apa pun untuk menutupi kejahatan mereka."
 MAN_bandit_raids: "Serangan Bandit"
 MAN_bandit_raids_desc: "Gerombolan perampok dan teroris mencuri segala sesuatu yang tidak terpaku kuat dan membakar sisanya! Kerahkan lebih banyak pasukan dan hentikan mereka!"
