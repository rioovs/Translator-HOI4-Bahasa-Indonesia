 institute_press_censorship_fascist_state: "Terapkan Sensor Pers"
 institute_press_censorship_fascist_state_desc: "Ini adalah masa-masa berbahaya dan kita tidak boleh membiarkan suara-suara pembangkang memecah belah negara kita. Membatasi kebebasan pers diperlukan untuk memastikan bahwa kebenaran terdengar lantang dan jelas."
