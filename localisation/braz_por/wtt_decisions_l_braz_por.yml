 JAP_colonial_independence: "Kemerdekaan Kolonial"
 JAP_colonial_independence_desc: "Dengan direbutnya kembali bekas jajahan imperialis, sudah saatnya kita membebaskan rakyat mereka dan memberi mereka kemerdekaan yang layak mereka dapatkan."
 JAP_return_manchuria: "Kembalikan Manchuria"
 PRC_return_manchuria_communist: "Tuntut Pengembalian Manchuria"
 PRC_return_manchuria_communist_desc: "Kaum imperialis Jepang merampas Manchuria dari pemiliknya yang sah - rakyat Tiongkok yang merdeka. Sekarang setelah kawan-kawan kita di Jepang menggulingkan para penindas, kita harus meminta agar wilayah itu dikembalikan kepada rakyat."
 JAP_liberate_manchuria_alliance_tt: "Mengirimkan tawaran aliansi."
 JAP_interservice_rivalry: "Persaingan Antar-Matra"
 JAP_interservice_rivalry_desc: "Angkatan Laut Kekaisaran dan Angkatan Darat Kekaisaran terjebak dalam persaingan sengit demi memperebutkan sumber daya kita yang terbatas. Kita telah mengadakan konferensi berkala untuk memastikan sumber daya kita dialokasikan ke tempat yang tepat. Mengistimewakan salah satu matra akan membawa konsekuensi yang luas."
