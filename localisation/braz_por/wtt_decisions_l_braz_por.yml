 reinstate_wilhelm_iv_succession_rights: "Pulihkan Hak Suksesi Pangeran Wilhelm"
 reinstate_wilhelm_iv_succession_rights_desc: "Putra Kaiser Wilhelm III terpaksa melepaskan hak suksesinya karena berkeinginan menikah tanpa persetujuan kepala keluarga saat itu, Wilhelm II. Karena Wilhelm III kini telah mengambil alih peran tersebut, ia mungkin dapat menekan ayahnya yang diasingkan untuk mendukung pembatalan keputusan ini."
 reinstate_wilhelm_iv_succession_rights_tt: "Garis suksesi diubah.\n"
 modernize_the_succession_laws: "Modernisasi Hukum Suksesi"
 modernize_the_succession_laws_desc: "Putra Kaiser saat ini, calon Wilhelm IV, hanya memiliki dua anak perempuan sebagai pewaris. Kita harus mengamankan garis suksesi, dan karenanya hukum suksesi harus dimodernisasi agar Putri Felicitas dapat bertakhta saat waktunya tiba."
 modernize_the_succession_laws_tt: "Wanita dapat mewarisi takhta.\n"
 request_restoration_of_british_titles: "Minta Pemulihan Gelar Kebangsawanan Britania"
 request_restoration_of_british_titles_desc: "Pada tahun 1917, parlemen Inggris memilih untuk mencabut semua gelar bangsawan dan keluarga kerajaan Inggris dari keluarga Kerajaan dan Kepangeranan Jerman. Sekarang setelah kita menjadi sekutu dan menikmati hubungan yang sangat baik, mungkin inilah saatnya untuk meminta pemulihan keputusan tersebut."
 hindenburg_destroyed_tt: "Hindenburg §YTIDAK§! hancur.\n"
 request_restoration_of_british_titles_tt: "Hal ini niscaya akan mendatangkan penghargaan yang tak tertandingi...\n"
 GER_request_polish_war_participation: "Tuntut Partisipasi Perang Polandia"
 GER_request_polish_war_participation_desc: "Karena kita sedang berperang dengan [SOV.GetName], kita harus melewatkan tentara kita melalui wilayah [POL.GetAdjective]. Karena kita telah bersumpah untuk melindungi mereka, wajar saja jika mereka ikut serta dalam perang kita."
 GER_reform_austro_hungarian_empire: "Bentuk Kembali Kekaisaran Austria-Hungaria"
 GER_reform_austro_hungarian_empire_tt: "Minta negara-negara penerus Austria-Hungaria lainnya untuk membentuk kembali Kekaisaran.\n§RJika mereka menerima, Anda akan mewarisi semua perang yang melibatkan mereka!§!\n"
 GER_reformed_austro_hungarian_empire: "Membentuk kembali Kekaisaran Austria-Hungaria"
 GER_barbarossa_mission: "Petunjuk Führer No. 21"
 emergency_factory_conversion_defensive: "Konversi Pabrik Darurat"
 emergency_factory_conversion_defensive_desc: "Lebih banyak perlengkapan sangat dibutuhkan di garis depan. Kita harus segera mengonversi lebih banyak pabrik untuk memproduksi senjata dan kendaraan guna mempertahankan negara kita."
 emergency_factory_conversion_offensive: "Konversi Pabrik Darurat"
 emergency_factory_conversion_offensive_desc: "Pasukan kita sangat membutuhkan lebih banyak perlengkapan. Lebih banyak pabrik diperlukan untuk memproduksi perlengkapan yang dibutuhkan demi memenangkan perang."
 demolish_enemy_fortifications: "Hancurkan Benteng Pertahanan Musuh"
 dismantle_maginot: "Bongkar Garis Maginot"
 propaganda_efforts: "Upaya Propaganda"
 war_propaganda: "Propaganda Perang"
 war_propaganda_desc: "Saat dunia terbakar di sekitar kita, rakyat kita sama sekali belum siap menghadapi perang. Kita harus menggalang dukungan mereka untuk mengangkat senjata membela negara kita."
 desperate_defense: "Pertahanan Putus Asa"
 desperate_defense_desc: "Kita tidak bisa mundur lebih jauh lagi. Prajurit kita harus bertahan di parit dan mempertahankan garis pertahanan."
 war_bonds: "Obligasi Perang"
 war_bonds_desc: "Kita membutuhkan lebih banyak sumber daya untuk ekonomi perang kita, dan obligasi perang adalah sarana yang tepat untuk mendapatkannya."
 CHI_lessons_of_war: "Pelajaran dari Perang"
 CHI_bolster_our_ranks: "Perkuat Barisan Kita"
 CHI_industrial_evacuations_from_beijing: "Evakuasi Industri dari Beijing"
 GER_barbarossa_mission_desc: "Angkatan Bersenjata Jerman harus bersiap untuk menghancurkan Rusia Soviet dalam kampanye kilat. Sebagian besar Tentara Rusia akan dimusnahkan melalui operasi berani yang dipimpin oleh ujung tombak lapis baja."
 USA_war_measures: "Langkah-Langkah Perang"
 USA_homeland_defense: "Undang-Undang Darurat Pertahanan Tanah Air"
 USA_homeland_defense_desc: "Musuh telah menginjakkan kaki di tanah bangsa kita yang bangga. Rakyat Amerika akan bangkit dan mendesak para penjajah kembali ke laut!"
 USA_aid_britain: "Bantu Britania"
 USA_establish_personal_communication_with_former_naval_person: "Korespondensi dengan Mantan Tokoh Angkatan Laut"
 USA_establish_personal_communication_with_former_naval_person_desc: "Pemimpin baru telah mengambil peran sebagai Perdana Menteri di [ENG.GetName]. Kita harus membuka dialog pribadi dengannya, membantu kita mempersiapkan dan mengoordinasikan keikutsertaan kita dalam perang yang tak terhindarkan."
 USA_battle_domestic_isolationism: "Lawan Isolasionisme Domestik"
 USA_battle_domestic_isolationism_desc: "Jika elemen isolasionis dibiarkan semaunya, kita akan menjadi tidak berdaya melawan bangsa musuh mana pun. Demi kebaikan kita sendiri, kita harus mulai membongkar retorika isolasionis yang lazim beredar."
 USA_emergency_arms_deliveries: "Pengiriman Senjata Darurat"
 USA_emergency_arms_deliveries_desc: "Prancis telah jatuh, dan Britania kini berdiri sendirian melawan agresor, berjuang mempertahankan pantainya dari invasi. Melalui retorika yang berapi-api mereka telah menunjukkan tekad mereka sekuat biasanya, dan mereka tidak berniat menyerah begitu saja dalam kegelapan. Kita berutang kepada demokrasi untuk memastikan mereka diberi sarana membela kebebasan mereka."
 USA_arsenal_of_democracy_decision: "Gudang Senjata Demokrasi"
 USA_arsenal_of_democracy_decision_desc: "Meskipun kita belum akan terseret ke dalam konflik, kita dapat membantu kawan-kawan kita dengan menjadi gudang senjata bagi mereka. Mari kita buat rakyat memahami mengapa hal ini diperlukan."
 USA_women_in_the_workforce: "Rosie the Riveter"
 USA_women_in_the_workforce_desc: "Apakah Anda bisa menggunakan pengocok adonan listrik? Jika demikian, Anda bisa belajar mengoperasikan bor. Sepanjang jalannya perang, lebih dari enam juta wanita Amerika bekerja di pabrik, konstruksi, dan kerja fisik lainnya serta membuktikan untuk selamanya bahwa wanita dapat melakukan pekerjaan itu sebaik pria."
 CAN_women_in_the_workforce: "Ronnie si Gadis Senapan Bren"
 CAN_women_in_the_workforce_desc: "Ronnie berkata: \"Terus Kirimkan!\" Dengan kaum pria kita bertugas di ketentaraan, beban produksi militer kita kini bertumpu di pundak kaum wanita bangsa kita. Sepanjang jalannya perang, 800.000 wanita Kanada mengambil alih pekerjaan yang ditinggalkan mereka yang mendaftar wamil, membuktikan untuk selamanya bahwa perempuan mampu melakukan pekerjaan sebaik laki-laki."
