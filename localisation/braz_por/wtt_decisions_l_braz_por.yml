 form_scandinavia_category: "Pulihkan Uni Kalmar"
 form_scandinavia_category_desc: "Dengan penaklukan seluruh wilayah Skandinavia, inilah saatnya memulihkan semangat Uni Kalmar. Seluruh Skandinavia akan makmur di bawah pemerintahan kita."
 form_nordic_league_category: "Proklamasikan Persatuan Nordik"
 form_nordic_league_category_desc: "Masyarakat Nordik telah lama merasakan kedekatan satu sama lain. Sekarang setelah kita menguasai semua tanah yang pernah menjadi milik negara-negara bagian Nordik, kita dapat membawa persaudaraan itu ke puncak yang baru."
 form_gran_colombia_category: "Hidupkan Kembali Warisan Bolívar"
 form_gran_colombia_category_desc: "Meskipun eksperimen Gran Colombia hanya berumur pendek seabad yang lalu, kita kini sekali lagi berhasil merebut kembali kendali atas wilayah-wilayahnya. Kita dapat, sekali lagi, mewujudkan impian Bolívar."
 form_austria_hungary_category: "Pulihkan Kekaisaran Austria-Hungaria"
 form_austria_hungary_category_desc: "Tanah-tanah lama Austria-Hungaria telah ditaklukkan, dan sebagai satu-satunya negara penerus yang tersisa, terserah pada kita untuk memulihkan Kekaisaran. Jangan menunda-nunda, dan lakukanlah segera."
 form_commonwealth_category: "Bentuk Kembali Persemakmuran"
 form_commonwealth_category_desc: "Ada sejarah panjang antara Polandia dan Lituania. Sekarang setelah kita sekali lagi bersatu melalui kekuatan senjata, mungkin inilah saatnya menghidupkan kembali masa-masa paling gemilang di masa lalu kita."
 form_united_netherlands_category: "Tolak Perjanjian London"
 form_united_netherlands_category_desc: "Perjanjian London tahun 1839 secara memalukan memisahkan wilayah Utara dan Selatan dataran rendah, setelah periode persatuan yang terlalu singkat. Sekarang, di bawah kepemimpinan kita, kita dapat menciptakan kembali masa-masa itu, dan mengambil tempat yang selayaknya sebagai penyeimbang bagi Prancis dan Jerman."
 form_united_central_america_category: "Bentuk Kembali Republik Federal"
 form_united_central_america_category_desc: "Negara kuat yang pernah menaungi bangsa kita seabad yang lalu memiliki masa hidup yang terlalu singkat. Sekarang setelah kita menaklukkan negara-negara bagian pemisah yang menyebabkan kejatuhannya, kita dapat berupaya membentuk kembali republik federal, dan mulai memproyeksikan kekuatan Amerika Tengah yang bersatu."
 form_baltic_federation_category: "Satukan Kawasan Baltik"
 form_baltic_federation_category_desc: "Deklarasi solidaritas regional dan kebijakan luar negeri terpadu kita sebelumnya kini dapat ditingkatkan setelah kita menguasai seluruh kawasan Baltik. Mengintegrasikan bekas tetangga kita akan memberikan peningkatan keamanan bagi semua, dalam menghadapi bahaya di Barat dan Timur."
 form_ottoman_empire_category: "Bentuk Kembali Kesultanan Utsmaniyah"
 form_ottoman_empire_category_desc: "Melalui kekuatan senjata, kita berhasil membalikkan kerugian yang kita derita akibat kelemahan kita dalam Perang Besar. Untuk menandai peristiwa bersejarah ini, tidak ada yang lebih baik daripada memproklamasikan pemulihan Kesultanan Utsmaniyah."
 form_european_union_category: "Wujudkan Persatuan Eropa"
 form_european_union_category_desc: "Meskipun konsep Eropa yang bersatu secara politik baru mendapat perhatian dalam beberapa dekade terakhir, penaklukan baru-baru ini atas negara-negara Eropa kontinental yang paling kuat memberi kita kenyataan yang tak terduga ini. Mungkin restrukturisasi bangsa diperlukan untuk memanfaatkan sepenuhnya peluang yang ditawarkannya kepada kita."
 form_mutapa_category: "Bentuk Kembali Kekaisaran Zimbabwe"
 form_mutapa_category_desc: "Setelah membebaskan bagian selatan benua dari pengaruh kolonial, mungkin inilah saatnya menggalang rakyat di balik konsep sebuah kekaisaran perkasa dari masa lalu kita. Beberapa telah berdiri di kawasan ini, dan kita hanya membutuhkan sebuah nama untuk dijadikan simbol."
 form_roman_empire_category: "Wujudkan Ambisi Romawi"
 form_roman_empire_category_desc: "Gagasan tentang sebuah Kekaisaran yang membentang di Mediterania dalam beberapa tahun terakhir telah dihidupkan kembali dalam benak masyarakat luas. Kini, kampanye militer kita telah melampaui mimpi terliar dari pendukung kita yang paling fanatik sekalipun, dan kita berada di ambang kemampuan untuk mewujudkan ambisi ini. Roma invicta!"
 form_persian_empire_category: "Bentuk Kembali Kekaisaran Persia"
 form_persian_empire_category_desc: "Penaklukan terbaru kita telah mencapai batas Kekaisaran Persia masa lampau. Dengan sejarah kawasan kita yang kaya, bagaimana mungkin kita tidak mengambil kesempatan ini untuk mengidentifikasi ranah kita sebagai kelanjutan dari kekaisaran masa lalu?"
 form_byzantine_empire_category: "Pulihkan Kekaisaran Bizantium"
 form_byzantine_empire_category_desc: "Setelah membebaskan wilayah lama kita dari belenggu Turki, kita sekarang dapat, dengan sedikit propaganda, mengklaim bahwa bangsa kita adalah penerus dari Kekaisaran yang diakhiri oleh bangsa Turki lima abad yang lalu. Warisan ini pasti akan membuat prestise internasional kita melambung!"
 form_arabia_category: "Penyatuan Bangsa Arab"
 form_arabia_category_desc: "Sudah terlalu lama negara-negara Arab terpecah belah oleh persaingan regional. Sekarang setelah kita menyatukan jazirah ini di bawah pemerintahan kita, akhirnya kita dapat mengumumkan pembentukan Arabia yang bersatu!"
 form_majapahit_empire_category: "Impian Nusantara Bersatu"
 form_majapahit_empire_category_desc: "Berabad-abad yang lalu, sebuah kemaharajaan besar membentang di kepulauan Indonesia dan menguasai perdagangannya. Kita telah berhasil memperluas perbatasan kita hingga mencakup wilayah kemaharajaan ini, dan menggunakannya sebagai dasar bagi negara bangsa yang baru dapat menjadi simbol persatuan kawasan ini."
 form_rattanakosin_kingdom_category: "Perkokoh Warisan Rattanakosin"
 form_rattanakosin_kingdom_category_desc: "Dalam beberapa tahun terakhir kita telah menjauh dari nilai-nilai tradisional yang menjadi dasar berdirinya bangsa kita. Sekarang setelah kita mencapai batas wilayah dari masa kejayaan kita, mungkin inilah saatnya untuk merangkul sejarah kita dengan lebih erat."
 form_pan_tai_empire: "Bentuk Kekaisaran Pan-Tai"
 form_pan_tai_empire_category: "Bentuk Kekaisaran Pan-Tai"
 form_pan_tai_empire_category_desc: "Kekaisaran Thai Raya telah memulihkan bangsa kita ke perbatasan masa kejayaannya, namun suku-suku Tai membentang jauh melampaui perbatasan tersebut. Dari perbukitan Shan hingga orang Dai di Yunnan, orang Zhuang di Guangxi, dan orang Ahom yang jauh di Assam, kerabat kita tetap terpecah. Sekarang setelah tanah leluhur ini mengibarkan panji kita, mari kita proklamasikan satu kekaisaran untuk seluruh bangsa Tai."
 form_hre_category: "Hidupkan Kembali Kekaisaran Romawi Suci"
 form_hre_category_desc: "[GetWhoIsFormingHre]"
 GER_is_forming_hre: "Kemegahan Kaiserin kita tak mengenal batas, begitu pula perbatasan bangsa kita. Wilayah ini kini telah berkembang mencakup batas-batas Kekaisaran Romawi Suci kuno, dan bangsa-bangsa yang menghalangi kita tidak lagi berada dalam posisi untuk menolak kebijakan kita. Sang Kaiserin telah menetapkan bahwa kesempatan saat ini harus diraih, dan bangsa ini harus merengkuh perannya sebagai penerus spiritual Kekaisaran Romawi Suci. Aquila Elegit Iovis Omnia Vincit!"
 GER_is_forming_hre_without_victoria: "Kemegahan pemerintah kita tak mengenal batas, begitu pula perbatasan bangsa kita. Wilayah ini kini telah berkembang mencakup batas-batas Kekaisaran Romawi Suci kuno, dan bangsa-bangsa yang menghalangi kita tidak lagi berada dalam posisi untuk menolak kebijakan kita. Kini telah ditetapkan bahwa kesempatan saat ini harus diraih, dan bangsa ini harus merengkuh perannya sebagai penerus spiritual Kekaisaran Romawi Suci. Aquila Elegit Iovis Omnia Vincit!"
 AUS_is_forming_hre: "Kemegahan Adipati Agung kita [ROOT.GetLeader] tak mengenal batas, begitu pula perbatasan bangsa kita. Wilayah ini kini telah berkembang mencakup batas-batas Kekaisaran Romawi Suci kuno, dan bangsa-bangsa yang menghalangi kita tidak lagi berada dalam posisi untuk menolak kebijakan kita. Sang Adipati Agung telah menetapkan bahwa kesempatan saat ini harus diraih, dan bangsa ini harus merengkuh perannya sebagai penerus spiritual Kekaisaran Romawi Suci. Aquila Elegit Iovis Omnia Vincit!"
 form_greater_german_reich_category: "Reich Jermanik Raya dari Bangsa Jerman"
 form_greater_german_reich_category_desc: "Musuh-musuh kita telah bertekuk lutut di hadapan kita, dan tujuan ekspansi kita ke Timur telah tercapai. Sekarang saatnya menyadarkan dunia akan keagungan bangsa kita, dan memulai transformasi ibu kota kita menjadi sesuatu yang dapat dipandang semua orang dengan penuh kebanggaan."
 form_greater_german_reich: "Proklamasikan Tatanan Baru"
 form_greater_german_state_category: "Tatanan Proletar Baru"
 form_greater_german_state_category_desc: "Terlepas dari perlawanan dari segala sisi, kita berhasil mengatasi pemerintahan korup di Eropa Barat. Mereka tidak dapat lagi menindas para pekerja, yang kini telah kita bebaskan dan sedang merapatkan barisan ke pihak kita saat ini juga. Belenggu Kapitalisme telah dihancurkan dan fajar tatanan baru menyingsing di atas Eropa - dan dunia."
 form_greater_proletarian_state: "Proklamasikan Negara Proletar Jerman Raya"
 form_country_andalusia_coring_states_tt: "Dapatkan wilayah inti di semua negara bagian §YSpanyol§! dan §YPortugal§!.\n"
 form_country_polynesia_coring_states_tt: "Dapatkan wilayah inti di semua §YKepulauan Polinesia§!.\n"
