 hold_fight_on_the_beaches_speech: "Sampaikan Pidato 'We Shall Fight on the Beaches'"
 hold_fight_on_the_beaches_speech_desc: "'Kita akan berjuang hingga akhir. Kita akan bertempur di Prancis, kita akan bertempur di lautan dan samudra, kita akan bertempur dengan keyakinan dan kekuatan yang terus tumbuh di udara, kita akan mempertahankan pulau kita, berapa pun biayanya. Kita akan bertempur di pantai, kita akan bertempur di tempat pendaratan, kita akan bertempur di ladang dan di jalanan, kita akan bertempur di perbukitan; kita pantang menyerah...'"
 fight_on_the_beaches_speech: "Pidato 'We Shall Fight on the Beaches'"
 operation_fork: "Operasi Fork"
 operation_fork_desc: "Negara Islandia yang baru merdeka menduduki lokasi yang sangat penting secara strategis di Atlantik Utara. Kehilangan Norwegia akan menempatkan pulau yang tak berdaya ini dalam posisi rentan. Kita harus mendahului musuh dalam menginvasi dan menduduki Islandia, jangan sampai mereka memperoleh pangkalan strategis pulau tersebut yang dapat membahayakan jalur pasokan kita. Hanya dengan perlindungan kita, rakyat Islandia akan aman dari musuh-musuh kita."
 ENG_operation_valentine: "Operasi Valentine"
 ENG_operation_valentine_desc: "Kita akan melindungi Kepulauan Faroe dari segala kepedihan perang dan memantapkan diri di sana dengan nyaman melalui laut dan udara sampai tiba saatnya pulau tersebut dikembalikan ke Denmark setelah dibebaskan dari perbudakan keji agresi musuh, sekaligus memperkuat posisi kita di Laut Utara."
 invade_ireland: "Invasi Irlandia"
 invade_ireland_desc: "Kita harus mengamankan keselamatan konvoi kita dengan cara apa pun yang diperlukan. Invasi ke Irlandia mungkin tidak menyenangkan bagi sebagian dari kita, tetapi jika itu yang diperlukan untuk memperoleh penggunaan pangkalan udara mereka, biarlah terjadi."
 macdonald_proposal: "Usulan Macdonald"
 macdonald_proposal_desc: "Kita harus mengamankan keselamatan konvoi kita, dan untuk mencapai hal ini, pangkalan udara dan laut Irlandia adalah hal yang paling penting. Kita akan mengirim utusan untuk mengusulkan pertukaran Irlandia Utara sebagai imbalan atas keikutsertaan segera Irlandia dalam perang di pihak kita."
 hold_blood_toil_tears_sweat_speech: "Sampaikan Pidato 'Darah, Kerja Keras, Air Mata, dan Keringat'"
 hold_blood_toil_tears_sweat_speech_desc: "'Saya tidak punya apa-apa untuk ditawarkan selain darah, kerja keras, air mata, dan keringat. [...] Anda bertanya, apa kebijakan kita? Saya akan menjawab: Kebijakan kita adalah mengobarkan perang, melalui laut, darat, dan udara, dengan seluruh kekuatan kita dan dengan seluruh daya yang dapat diberikan Tuhan kepada kita; mengobarkan perang melawan tirani mengerikan yang tak pernah tertandingi dalam katalog kejahatan manusia yang kelam dan patut disesalkan. Itulah kebijakan kita. Anda bertanya, apa tujuan kita? Saya dapat menjawab dalam satu kata: Kemenangan. Kemenangan dengan segala cara—Kemenangan terlepas dari semua teror—Kemenangan, betapa pun panjang dan sulitnya jalan yang harus ditempuh, karena tanpa kemenangan tidak ada kelangsungan hidup.'"
 blood_toil_tears_sweat_speech: "Pidato 'Darah, Kerja Keras, Air Mata, dan Keringat'"
 hold_this_was_their_finest_hour_speech: "Sampaikan Pidato 'This Was Their Finest Hour'"
 hold_this_was_their_finest_hour_speech_desc: "'Oleh karena itu, marilah kita menguatkan diri kita terhadap tugas-tugas kita, dan membawakan diri sedemikian rupa, sehingga jika Kekaisaran Britania dan Persemakmurannya bertahan selama seribu tahun, orang-orang akan tetap berkata: Ini adalah masa kejayaan mereka.'"
 this_was_their_finest_hour_speech: "Pidato 'This Was Their Finest Hour'"
 mers_el_kebir_raid: "Operasi Catapult"
 mers_el_kebir_raid_desc: "Armada Prancis telah jatuh ke tangan Prancis Vichy, dan kita tidak boleh membiarkannya jatuh ke tangan Jerman. Betapapun memuakkan, kita harus menuntut penyerahan segera angkatan laut mantan sekutu kita, di bawah ancaman pemboman."
 FRA_vichy_france: "Prancis Vichy"
 FRA_scuttle_the_fleet: "Tenggelamkan Armada Sendiri"
 FRA_scuttle_the_fleet_desc: "Pasukan asing berupaya mengambil alih kendali kekuatan angkatan laut kita secara paksa. Kita tidak boleh membiarkan hal ini terjadi, dan harus menenggelamkan kapal-kapal kita sendiri!"
 FRA_case_anton_mission: "Case Anton Sedang Berlangsung"
 case_anton: "Case Anton"
 FRA_case_anton_mission_tt: "Aneksasi berhasil dihindari."
 war_measures: "Langkah-Langkah Perang"
 women_in_the_workforce: "Kaum Perempuan dalam Angkatan Kerja"
 women_in_the_workforce_desc: "Saat kaum pria pergi ke medan perang, ribuan wanita mengambil alih pekerjaan di pabrik-pabrik demi menjaga roda mesin perang tetap berputar."
 scientist_refuge: "Suaka Ilmuwan"
 scientist_refuge_desc: "Dengan iklim politik saat ini di Eropa, sejumlah ilmuwan memutuskan meninggalkan negara asal mereka. Mereka telah mengajukan visa masuk ke negara kita. Mengabulkannya akan memberi kita bonus riset, namun juga akan membuat gusar sebagian orang yang menganggap ini masalah internal yang sebaiknya tidak kita campuri."
 give_refuge_ger: "Beri suaka kepada ilmuwan Jerman"
 give_refuge_ita: "Beri suaka kepada ilmuwan Italia"
 operations: "Operasi Khusus"
 GER_military_buildup: "Pembangunan Militer"
 GER_weserubung_sud: "Weserübung-Süd"
 GER_weserubung_sud_desc: "Untuk mendapatkan pangkalan awal yang baik bagi invasi ke Norwegia, kita harus bergerak menguasai Denmark terlebih dahulu."
 GER_weserubung_nord: "Weserübung-Nord"
 GER_weserubung_nord_desc: "Norwegia adalah titik strategis yang krusial dan akan menjadi sasaran empuk serangan bagi musuh mana pun yang ingin mengacaukan perdagangan baja kita dengan Swedia. Kita tidak boleh mengambil risiko musuh mendirikan pangkalan di kawasan ini."
 GER_case_yellow_netherlands: "Fall Gelb - Belanda"
 GER_case_yellow_netherlands_desc: "Serangan melalui Belgia memaksa kita melewati front yang terlalu sempit. Kita harus memperluas rencana perang kita untuk mengikutsertakan Belanda guna menghindari kesalahan yang dibuat pada tahun 1914."
 GER_case_yellow_belgium_luxembourg: "Fall Gelb - Belgia dan Luksemburg"
 GER_case_yellow_belgium_luxembourg_desc: "Serangan menembus Garis Maginot adalah tindakan bunuh diri. Kita akan mengepungnya dari utara dan bergerak melintasi Ardennes untuk memotong benteng pertahanan terberat."
 GER_polish_ultimatum: "Keluarkan Ultimatum kepada Polandia"
 SOV_industry_relocation: "Relokasi Industri"
 SOV_relocate_industry_from_moscow: "Relokasi Industri dari Moskwa"
 SOV_relocate_industry_from_moscow_desc: "Mengevakuasi mesin-mesin berat dari pabrik-pabrik Moskwa kita ke Pegunungan Ural adalah pekerjaan raksasa, namun penting untuk mengamankan produksi perang kita."
 SOV_relocate_industry_from_moscow_tt: "§REfek-efek ini membutuhkan kendali atas Moskwa saat batas waktu keputusan habis.§!"
 SOV_relocate_industry_from_leningrad: "Relokasi Industri dari Leningrad"
 SOV_relocate_industry_from_leningrad_desc: "Mengevakuasi mesin-mesin berat dari pabrik-pabrik Leningrad kita ke Pegunungan Ural adalah pekerjaan raksasa, namun penting untuk mengamankan produksi perang kita."
 SOV_relocate_industry_from_leningrad_tt: "§REfek-efek ini membutuhkan kendali atas [569.GetName] saat batas waktu keputusan habis.§!"
 SOV_relocate_industry_from_smolensk: "Relokasi Industri dari Smolensk"
