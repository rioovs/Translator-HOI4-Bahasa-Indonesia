 demobilization_desc: "Dengan ancaman perang yang tampak semakin jauh, rakyat tidak lagi bersedia menerima beratnya hukum masa perang. Kita perlu meninjau undang-undang kita dan mempertimbangkan untuk mengubahnya demi meredam para pemrotes sebelum situasi memburuk."
