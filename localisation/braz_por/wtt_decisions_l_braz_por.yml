 PRC_border_clashes_desc: "Medan Tiongkok memaksa semua pihak untuk memilih pertempuran mereka dengan cermat. Hal itu memberi kita peluang untuk merebut medan rentan tanpa harus terlibat dalam perang terbuka."
 MAN_pacify_bandits_mission_explanation: "Pertahankan divisi di negara bagian selama [?Root.MAN_maintain_control_timer|H0] hari untuk menumpas bandit di kawasan ini.\n"
