 fascism_on_the_rise_desc: "Elemen politik vokal mulai bersuara mendukung nilai-nilai fasis, mendapatkan dukungan dari semakin banyak rakyat. Jalan bangsa menuju fasisme terbuka lebar, tinggal menunggu pilihan transisi damai atau penuh kekerasan."
 prepare_for_fascist_civil_war: "Persiapan Perang Saudara"
 prepare_for_fascist_civil_war_desc: "Kita tidak punya waktu untuk menunggu perubahan lambat dalam benak rakyat. Demi kebaikan mereka sendiri, kita harus memaksakan masalah ini dengan cepat, bahkan jika sebagian orang harus kehilangan nyawa dalam prosesnya. Berbeda dengan referendum damai, perang saudara akan menimbulkan kehancuran luar biasa pada angkatan bersenjata serta industri dan infrastruktur negara, namun juga lebih cepat, dan memastikan kita dapat memaksakan kehendak kita dengan lebih kuat sesudahnya."
 expand_civil_fascism_support: "Perluas Dukungan Sipil"
 expand_civil_fascism_support_desc: "Kita harus memastikan terus meluasnya dukungan bagi perjuangan kita di kalangan rakyat, dan mendorong mereka untuk secara terbuka menentang otoritas pemerintah saat ini. Seiring posisi pemerintah yang semakin tergerus dan keresahan sipil yang terus memuncak, akan lebih mudah bagi kita untuk mencapai tujuan kita. Ini terutama berlaku jika tujuan tersebut melibatkan sarana pergantian rezim yang lebih... mengerikan."
 army_support_for_fascist_civil_war: "Perluas Dukungan Militer"
 army_support_for_fascist_civil_war_desc: "Tanpa dukungan militer yang luas, harapan apa pun untuk meraih kemenangan dalam perjuangan ideologis bersenjata akan sia-sia. Kita harus memastikan loyalitas unit-unit angkatan bersenjata kita yang berposisi strategis."
 army_support_TT: "Setiap kali dukungan tentara ditingkatkan, 10% ditambahkan ke kekuatan faksi Anda dalam perang saudara, hingga kekuatan total maksimum 70%.\n"
 ensure_general_loyalty_for_fascist_civil_war: "Amankan Loyalitas Komando Bawah AD"
 ensure_general_loyalty_for_fascist_civil_war_desc: "Mungkin saja jenderal tertentu memendam sentimen rahasia yang mendukung fasisme. Kita harus mendekati mereka dan memastikan loyalitas mereka saat pertempuran dimulai."
 ensure_marshal_loyalty_for_fascist_civil_war: "Amankan Loyalitas Komando Atas AD"
 ensure_marshal_loyalty_for_fascist_civil_war_desc: "Mungkin saja marsekal lapangan tertentu memendam sentimen rahasia yang mendukung fasisme. Kita harus mendekati mereka dan memastikan loyalitas mereka saat pertempuran dimulai."
 siphon_equipment_stockpiles_for_fascist_civil_war: "Sedot Persediaan Perlengkapan"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc: "Dengan mengambil sebagian dari simpanan perlengkapan negara, kita dapat menciptakan simpanan senjata kecil untuk membantu kita dalam perjuangan di masa depan."
 formulate_surprise_attack_plan_for_fascist_civil_war: "Susun Rencana Serangan Kejutan"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc: "Musuh sama sekali tidak menyadari malapetaka yang akan datang. Kita harus memastikan hal ini tetap terjaga, sembari mengarahkan rencana pertempuran kita untuk memanfaatkan unsur kejutan secara maksimal."
 formulate_surprise_attack_plan_for_civil_war_tt: "Rencana Serangan Kejutan memberikan bonus serangan 25% untuk semua divisi di wilayah inti, selama 30 hari.\n"
 ignite_the_fascist_civil_war: "Sulut Perang Saudara"
 ignite_the_fascist_civil_war_desc: "Waktunya telah tiba untuk mengambil langkah tegas. Semua persiapan yang kita anggap perlu telah dibuat. Tidak ada jalan untuk kembali sekarang."
 rebuild_the_nation_fascism: "Bangun Kembali Bangsa"
 rebuild_the_nation_fascism_desc: "Setelah perang saudara, kini tiba saatnya untuk membangun kembali bangsa kita yang hancur."
 open_up_political_discourse_fascism: "Buka Ruang Wacana Politik"
 open_up_political_discourse_fascism_desc: "Kita harus membuka ruang penerimaan atas sudut pandang yang berbeda dalam pemerintahan. Mungkin hal ini pada akhirnya akan memungkinkan terjadinya perubahan damai dalam politik bangsa kita."
 discredit_government_fascism: "Diskreditkan Pemerintah"
 discredit_government_fascism_desc: "Dengan menunjukkan banyak kelemahan pemerintah kita saat ini, kita dapat membuat rakyat memikirkan penyebab ideologis dari kegagalan-kegagalan ini."
