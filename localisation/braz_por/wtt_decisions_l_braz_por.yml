 GER_reichskommissariats_desc: "Seiring perebutan wilayah-wilayah baru muncullah perlawanan dan perlunya administrasi yang efektif. Oleh karena itu, Reichsminister Alfred Rosenberg telah mengusulkan pembentukan rezim pendudukan khusus yang disebutnya sebagai Reichskommissariat, yang akan membantu mengendalikan penduduk setempat dan menghadapi pejuang perlawanan di tingkat yang lebih lokal dibandingkan yang dapat dilakukan oleh pasukan reguler kita."
