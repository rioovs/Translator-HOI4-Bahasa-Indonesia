 COG_establish_the_anc_locking_tt: "§RMengunci fokus Force Publique agar tidak diambil di masa mendatang§!"
 COG_establish_the_anc_modifier_tt: "Menghapus semangat nasional §YForce Publique§! dan menggantinya dengan §YArmée Nationale Congolaise§!, mempertahankan sekitar setengah dari bonus yang diperoleh sebelumnya"
 COG_closer_cooperation_with_eugene_jungers_tt: "Membuka fokus §YRuanda-Urundi§! dan §YMemperluas Tambang Tungsten§!"
 COG_intore_infantry_recruitment: "Dapatkan satu unit elit dengan 7 batalyon §YInfanteri§!"
 COG_contract_the_empain_group_tt: "Membuka keputusan untuk §YMemperluas Tambang§! dan §YBerinvestasi di Perusahaan§! yang dioperasikan oleh Empain Group"
 COG_increased_powers_for_colonial_governors: "Peningkatan Kekuasaan bagi Gubernur Kolonial"
 COG_make_use_of_the_british_proposal_tt: "If Belgium has not completed the focus §YKing of the Belgians§!, we will gain the ability to use British support when negotiating our independence from Belgium. If however they have §YEmpowered the Collaborator King§!, we will be able to declare independence immediately using British support.\n\nCurrent effects:"
 COG_make_use_of_the_british_proposal_in_negotations: "Kami akan dapat menggunakan §YBritish Support§! untuk mendorong kemerdekaan selama negosiasi di masa depan dengan penguasa kolonial kami dengan imbalan hak sumber daya untuk §Y[538.GetName]§! dan §Y[890.GetName]§!."
 COG_occupy_cabinda_tt: "§RIni dapat menyebabkan perang dengan pemilik [796.GetName]!§!"
 COG_national_committee_for_liberation_tt: "§RKami tidak lagi dapat mencoba merundingkan kemerdekaan kami secara damai, dan akan berkomitmen pada revolusi bersenjata§!"
 COG_endorse_force_publique_mutinies_tt: "Jika pemberontakan sudah berakhir atau masih berlangsung ketika fokus §YSerang Selagi Besinya Panas§! selesai, maka semangat tersebut akan sangat mempengaruhi musuh kita dalam Perang Saudara."
 COG_the_simba_movement_tt: "Ketika perang pembebasan dimulai, kita akan mendapatkan 3 §YDivisi Gerakan Simba§!, dan mereka akan mampu mengkudeta pemerintahan dan mengambil kepemimpinan nasional jika popularitas §YKomunisme§! menjadi cukup tinggi"
 COG_approach_the_disfavored_mwami_tt: "Ketika perang pembebasan dimulai, kita akan memperoleh 2 §YDivisi Rwanda§!, dan sentimen monarki di negara kita akan mulai tumbuh lebih kuat seiring berjalannya waktu"
 COG_approach_the_barotse_litunga_tt: "Ketika perang pembebasan dimulai, kita akan mendapatkan 2 §YBarotse Division§!, dan mendapatkan inti di §Y[981.GetName]§!"
 COG_slander_the_colonial_authorities_tt: "§RSemangat kebangsaan ini akan sirna setelah perang kemerdekaan kita berakhir!§!"
 COG_strike_while_the_iron_is_hot_tt: "Our troops will begin their march toward Léopoldville, officially starting the war for independence. We will be able to force peace with our former overlords and gain full independence if we control §YLéopoldville§!, §YÉlisabethville§! and §YStanleyville§!, or if we can properly capitulate our enemy and force a peace.\n\nSimilarly, they will be able to force peace with us and retain control over our country by controlling §YLéopoldville§!, §YÉlisabethville§! and §YStanleyville§!."
 COG_when_the_war_for_independence_starts_tt: "Kapan §YPerang Kemerdekaan§! dimulai:"
 COG_the_lion_roars_1_tt: "Kita akan menjadi §YKomunis§!, dan dapat memilih antara memilih §YCyrille Adoula§! atau §YChristophe Gbenye§! sebagai pemimpin negara kita"
 COG_the_lion_roars_2_tt: "Kita akan dapat memilih apakah kita ingin mempertahankan §YCyrille Adoula§! sebagai pemimpin negara kita, atau jika kita ingin menggantikannya dengan §YChristophe Gbenye§!"
 CONGO_expanded_rubber_plantations_available_tt: "Musuh kita telah menguasai seluruh §YIndochina Prancis§!"
 CONGO_expanded_rubber_plantations_available_malaya_tt: "Musuh kita telah menguasai §YMalaya§!"
 CONGO_expand_ndolo_and_elisabethville_airports_tt: "Efek ini akan ditingkatkan lebih lanjut jika fokus diselesaikan saat berada dalam faksi dengan §Y[USA.GetNameDef]§!"
 CONGO_appoint_van_overstraeten_tt: "§YRaoul van Overstraeten§! dikirim untuk menjadi §YField Marshal§! untuk §YBelgia Kongo§!"
 congo_more_options_to_threaten_tt: "Seandainya kami mendapat dukungan asing sebelumnya, kami akan mampu mengambil sikap yang lebih agresif dalam perundingan."
 COG_BEL_negotiations_ongoing_flag: "Congolese Independence Negotiations Ongoing"
 CONGO_independence_war_ongoing: "Congolese Independence War Ongoing"
 COG_african_union_faction: "Organisasi Persatuan Afrika"
 COG_pan_african_congress: "Kongres Pan-Afrika"
 COG_kasa_vubus_first_cabinet_1_tt: "Kita akan menjadi §YDemokrat§!, dan §YJoseph Kasa-Vubu§! akan mendapatkan sifat §YBapak Pendiri Bangsa Kongo§!"
 COG_kasa_vubus_first_cabinet_2_tt: "§YJoseph Kasa-Vubu§! akan mendapatkan sifat §YBapak Pendiri Bangsa Kongo§!, dan kita akan mendapatkan §YStabilitas§! dan §YKekuatan Politik§!"
 COG_declaration_of_congolese_unity_tt: "Membuka keputusan untuk §YMengintegrasikan Wilayah Pendudukan Kongo§!"
 COG_assemble_a_regency_council_tt: "Setelah pemimpin dipilih, §YFokus Baru§! akan muncul di bawah §YTergantung Siapa yang Terpilih§!"
 COG_assemble_a_regency_council_2_tt: "Dewan akan mulai mencari kandidat untuk memimpin negara kita, dengan memprioritaskan kandidat yang memiliki legitimasi terbesar"
 COG_monarchism_didnt_work_out_flag: "Dewan tidak dapat memutuskan seorang penguasa"
 COG_uniao_dos_povos_do_norte_de_angola_tt: "Jika negara yang memisahkan diri tersebut mendapatkan kemerdekaannya, maka negara tersebut akan §YTerintegrasi§! ke dalam diri kita"
 COG_to_be_annexed_angola_flag: "Loyalis Kerajaan Kongo"
 COG_time_until_annex_angola_rebellion: "Dukungan terhadap Gerakan Separatis masih menguat"
 COG_days_left_for_rebellion_tt: "Hari-hari saat ini adalah: [?COG_time_until_annex_angola_rebellion:days|Y0]"
 COG_boma_accords_faction: "Perjanjian Boma"
 COG_south_to_lake_malawi_tt: "Membuka keputusan untuk §YMengintegrasikan Malawi dan Zambezia-Moçambique§!"
 COG_invite_german_kasierist_exiles_tt: "§YCarl Friedrich Goerdeler§!, §YPaul von Lettow-Vorbeck§! dan §YAlfred Hugenberg§! berangkat ke Afrika untuk bergabung dengan kami"
 COG_colonial_administration_tt: "Membuka keputusan untuk §YIntegrasi Negara§! di §YAfrika Tengah§!"
 ### GERMAN FOCUS TREE ###
 FOCUS_ICON_SET_HISTORICAL_KEY_FOCUS: "Fokus Kunci Sejarah"
 GER_prioritize_economic_growth: "Prioritaskan Pertumbuhan Ekonomi"
 GER_prioritize_economic_growth_desc: "Kebijakan fiskal yang lalai selama bertahun-tahun hampir menghancurkan perekonomian kita. Kita harus membangun traktor daripada tank, membagikan sekop daripada senapan, dan memprioritaskan pertumbuhan ekonomi daripada mengembangkan industri senjata!"
 GER_currency_reforms: "Reformasi Mata Uang"
 GER_currency_reforms_desc: "Langkah pertama dalam pemulihan dan revitalisasi ekonomi adalah melakukan reformasi mata uang secara menyeluruh."
 GER_lower_taxes: "Pajak Lebih Rendah"
 GER_lower_taxes_desc: "Beban pajak yang ditanggung rakyat kita secara bertahap menjadi semakin berat untuk membiayai program persenjataan kembali. Dengan mengurangi beban ini, kita mungkin akan kehilangan pendapatan negara dalam jangka pendek, namun masyarakat akan mampu membelanjakan lebih banyak uang yang diperoleh dengan susah payah."
 GER_workers_rights: "Hak Pekerja"
 GER_workers_rights_desc: "Serikat pekerja telah berubah secara mendasar dalam beberapa tahun terakhir, dan tidak lagi dapat dikenali seperti dulu. Dengan melakukan reformasi, kita bisa menggalang buruh dan memetik manfaatnya."
 GER_abolish_price_controls: "Hapus Kontrol Harga"
 GER_abolish_price_controls_desc: "Langkah-langkah pengendalian harga yang telah diterapkan untuk meningkatkan persenjataan telah menghambat perekonomian. Menghapuskan hal-hal tersebut mungkin akan mengurangi dana negara, namun akan memungkinkan masyarakat untuk memulai usaha baru dan meningkatkan perekonomian."
 GER_increased_trade: "Peningkatan Perdagangan"
 GER_increased_trade_desc: "Jika rakyat Jerman ingin berkembang, kita harus mengimpor apa yang tidak dapat kita ekstrak atau bangun di dalam negeri kita sendiri. Kita harus melihat ke luar dan menandatangani kesepakatan perdagangan baru dengan negara lain – kesepakatan yang tentu saja menguntungkan kita."
 GER_housing_developments: "Perkembangan Perumahan"
 GER_housing_developments_desc: "Kita dapat merevitalisasi perekonomian kita dengan meluncurkan program pembangunan perumahan, yang bertujuan untuk merenovasi dan menciptakan rumah modern serta menetapkan standar hidup baru."
 GER_invest_in_vereinigte_stahlwerke: "Berinvestasilah di Vereinigte Stahlwerke"
 GER_invest_in_vereinigte_stahlwerke_desc: "Vereinigte Stahlwerke adalah salah satu produsen baja terbesar dan terpenting kami. Menginvestasikan sumber daya ke dalam perusahaan pasti akan menghasilkan peningkatan produktivitas, dan mengubah industri baja Jerman."
 GER_industrial_expansion: "Ekspansi Industri"
 GER_industrial_expansion_desc: "Memiliki industri yang kuat yang dapat bersaing secara internasional dan memelopori teknologi baru akan sangat penting bagi kelanjutan pertumbuhan kami. [ROOT.GetNameDefCap] akan identik dengan kualitas."
 GER_agricultural_reforms: "Reformasi Pertanian"
 GER_agricultural_reforms_desc: "Sektor pertanian kami sebagian besar terdiri dari pertanian skala kecil yang dikelola keluarga, dan melakukan banyak pekerjaan manual. Kita dapat mereformasi seluruh sektor pertanian dengan memperkenalkan peralatan modern dan meningkatkan hasil produksi setiap pertanian. Seluruh bangsa kita akan mendapat manfaatnya!"
 GER_urbanization: "Urbanisasi"
 GER_urbanization_desc: "Pengenalan mesin modern di bidang pertanian telah membebaskan banyak orang, yang kini berbondong-bondong ke kota untuk mencari pekerjaan baru. Orang-orang ini dapat dimanfaatkan dengan baik di pabrik-pabrik kita sehingga mereka dapat terus menjadikan perekonomian kita salah satu yang terkuat di dunia."
 GER_wirtschaftswunder: "Wirtschaftswunder"
 GER_wirtschaftswunder_desc: "Semua program dan inisiatif kami untuk merevitalisasi perekonomian akhirnya membuahkan hasil! Masyarakat di seluruh dunia kagum dengan pemulihan keuangan dan industri kita dan menyebutnya sebagai ‘Wirtschaftswunder’ – sebuah keajaiban ekonomi."
 GER_mass_production: "Produksi Massal"
 GER_mass_production_desc: "Dengan semua kemajuan industri yang kita capai akhir-akhir ini, kita telah belajar banyak tentang alat-alat produksi. Kita harus memanfaatkan semua pengetahuan dan pemahaman baru ini untuk menyederhanakan jalur perakitan dan memproduksi material dalam skala yang belum pernah ada sebelumnya."
 GER_build_defense_industry: "Membangun Industri Pertahanan"
 GER_build_defense_industry_desc: "Setelah akhirnya mampu menstabilkan, dan bahkan memperkuat perekonomian kita hingga berlipat ganda, kini kita dapat mengalihkan perhatian kita untuk mengamankan kedaulatan negara kita dan membangun industri pertahanan yang baik, menjaga ketekunan rakyat Jerman dan mendorong kemajuan dan keunggulan."
 GER_war_production: "Produksi Perang"
 GER_war_production_desc: "Perang telah melanda kami sekali lagi, namun kami tidak akan menyerah dan kami tidak akan terjatuh! Kami akan memobilisasi kekuatan industri kami dan mengalahkan musuh mana pun yang tidak cukup bijaksana untuk berpikir bahwa mereka dapat menghancurkan kemauan keras rakyat Jerman!"
 GER_construct_the_reichsautobahn: "Bangun [GetAutobahnName]"
 GER_autobahn_fascism: "Reichsautobahn"
 GER_autobahn_neutral: "Kaiserliche Autobahn"
 GER_autobahn_democratic: "Jalan raya"
 GER_autobahn_communism: "Volksautobahn"
 GER_construct_the_reichsautobahn_desc: "$GER_autobahn_desc$"
 GER_kdf_wagen_factories: "[GetKfdWagenNames]"
 GER_kdf_wagen_factories_fascist: "Pabrik KdF-Wagen"
 GER_kdf_wagen_factories_neutral: "Pabrik Wilhelm-Wagen"
 GER_kdf_wagen_factories_volkswagen: "Pabrik Volkswagen"
 GER_kdf_wagen_factories_desc: "[GetKDFFactoriesText]"
 GER_kdf_wagen_factories_autarky_text: "$GER_kdf_wagen_desc$" #old loc 
 GER_kdf_wagen_factories_economic_growth_text: "Dengan dibangunnya [GetAutobahnName] baru kita, kita harus mengisinya dengan mobil. Untuk menjadi perekonomian yang benar-benar makmur dan modern, kita perlu membangun pabrik-pabrik yang dapat memproduksi mobil-mobil ini – sekaligus menciptakan lapangan kerja dan lapangan kerja."
 GER_expand_the_reichsautobahn_south: "Perluas [GetAutobahnName] Selatan"
 GER_expand_the_reichsautobahn_south_desc: "Memperluas jaringan Autobahn ke selatan akan merangsang pertumbuhan ekonomi dan pembangunan di wilayah tersebut. Hal ini juga akan memperkuat kemampuan militer kita dengan memungkinkan transportasi pasukan yang cepat menuju Pegunungan Alpen."
 GER_expand_the_reichsautobahn_south_tt: "Tambahkan §G1§! §Y$infrastructure$§! di §Y[53.GetName]§!, §Y[52.GetName]§!, §Y[152.GetName]§!, §Y[4.GetName]§! dan jalur kereta api tingkat §Y1§! dari §Y[53.GetName]§! ke §Y[4.GetName]§!, jika §Y[ROOT.GetName]§! atau subjek Jerman mengendalikan negara bagian. Efek saat ini:"
 GER_expand_the_reichsautobahn_east: "Perluas [GetAutobahnName] Timur"
 GER_expand_the_reichsautobahn_east_desc: "Memperluas jaringan Autobahn menuju Prusia Timur akan menunjukkan tekad negara kita untuk sekali lagi menghubungkan dan menyatukan wilayah paling timur kita dengan [ROOT.GetNameDef] lainnya. Hal ini juga akan memungkinkan kita untuk menyerang ke arah timur lebih keras dan lebih cepat jika diperlukan."
 GER_expand_the_reichsautobahn_east_tt: "Tambahkan §G1§! §Y$infrastructure$§! di §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[807.GetName]§!, §Y[85.GetName]§! dan jalur kereta api tingkat §Y1§! dari §Y[63.GetName]§! ke §Y[85.GetName]§!, jika §Y[ROOT.GetName]§! atau subjek Jerman mengendalikan negara bagian. Efek saat ini:"
 GER_develop_heraeus_facilities: "Mengembangkan Fasilitas Penelitian Heraeus"
 GER_develop_heraeus_facilities_desc: "Berinvestasi dalam fasilitas baru dapat menjamin akses terhadap permintaan logam mulia yang semakin meningkat yang dibutuhkan militer modern. Bahan-bahan khusus ini penting untuk elektronik dan persenjataan berkualitas tinggi."
 GER_build_the_rur_dam: "Bangun Bendungan Rur"
 GER_build_the_rur_dam_desc: "Membangun Bendungan Rur lebih dari sekedar prestasi teknik – ini adalah investasi untuk masa depan. Bendungan ini tidak hanya akan meningkatkan pembangunan ekonomi di wilayah tersebut, tetapi juga akan membantu mendorong upaya industri dan hasil produksi."
 GER_trade_deal_with_sweden: "Kesepakatan Dagang dengan Swedia"
 GER_trade_deal_with_sweden_desc: "$GER_swedish_trade_agreement_desc$" #old loc
 GER_the_four_year_plan: "Rencana Empat Tahun"
 GER_the_four_year_plan_desc: "$GER_four_year_plan_desc$" #old loc
 GER_autarky_efforts: "Upaya Autarki"
 GER_autarky_efforts_desc: "$GER_autarky_desc$" #old loc
 GER_gain_autarkic_economy_lock_free_trade_tt: "§RKunci§! §Y$free_trade$§! dan §Y$export_focus$§!. Dapatkan §Y$autarkic_economy$§!."
 GER_improve_trade_relations_tt: "Meningkatkan §YPengaruh Perdagangan§! dengan §YAnggota Fraksi§! saat ini dan di masa depan"
 GER_institute_price_controls: "Kontrol Harga Lembaga"
 GER_institute_price_controls_desc: "Kita harus menerapkan berbagai langkah untuk memperkuat kendali kita terhadap keuangan agar tidak terjerumus ke dalam tujuan ambisius kita untuk mencapai swasembada. Kita harus mampu mengatur harga impor, barang-barang penting, dan upah pekerja untuk mengendalikan inflasi dan menjamin stabilitas ekonomi."
 GER_unlock_price_controls_decision_tt: "Membuka Keputusan: §Y$GER_price_controls_cat$§!, yang dapat mengurangi §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 GER_industrial_consumer_goods_factor_limit_tt: "§Y[GetIndustrialModifier]§! memiliki §Rkurang§! dari $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y90%§!"
 GER_establish_the_reichswerke: "Tetapkan $GER_reichswerke$"
 GER_establish_the_reichswerke_desc: "$GER_hermann_goring_werke_desc$" #old loc
 GER_unlock_reichswerke_tt: "Membuka Kepedulian Industri §Y$GER_reichswerke$§!"
 GER_seize_foreign_industries: "Rebut Industri Asing"
 GER_seize_foreign_industries_desc: "Dengan mengintegrasikan industri asing ke dalam perekonomian kita, kita mengamankan sumber daya penting yang mendukung upaya perang dan produksi kita."
 GER_coal_liquefaction: "Pencairan Batubara"
 GER_coal_liquefaction_desc: "$GER_coal_liquidization_desc$" #old loc
 GER_subsidize_hoesch_benzin: "Subsidi Hoesch-Benzin"
 GER_subsidize_hoesch_benzin_desc: "Dulu dikatakan bahwa tentara bergerak dengan perutnya, tetapi tentara modern kehabisan bahan bakar. Untuk mempertahankan kemampuan militer kita, kita harus mengintensifkan upaya kita untuk memproduksi bahan bakar sintetis."
 GER_establish_buna_werke: "Mendirikan Buna-Werke"
 GER_establish_buna_werke_desc: "Motorisasi dan penerbangan skala besar membutuhkan karet dalam jumlah besar, yang sumbernya tidak kami miliki di Jerman. Untuk mengurangi ketergantungan pada perdagangan luar negeri kita harus membangun pabrik yang dapat memproduksi karet sintetis."
 GER_autarky_achieved: "Autarki Tercapai"
 GER_autarky_achieved_desc: "Kami akhirnya mencapai tujuan ambisius kami untuk menjadi mandiri sepenuhnya! Bangsa kita telah menjadi sangat kaya akan sumber daya alam, yang akan semakin memperkuat kita – membuat kita tidak dapat dihentikan!"
 GER_improve_autarkic_economy_tt: "Tingkatkan §Y$autarkic_economy$§!"
 GER_accelerate_the_rearmament_program: "Mempercepat Program Persenjataan Kembali"
 GER_accelerate_the_rearmament_program_desc: "Kita harus mematahkan belenggu Perjanjian Versailles, dan membiarkan landasan industri membentuk takdir yang gemilang bagi [ROOT.GetNameDef]. Setiap tank yang diproduksi, setiap pesawat yang dirakit akan menjadi kesaksian atas kemauan teguh rakyat Jerman."
 GER_concentrated_armament_program: "Program Persenjataan Terkonsentrasi"
 GER_concentrated_armament_program_desc: "Industri kita harus mendukung kebutuhan militer untuk mempersenjatai kembali negara kita. Program persenjataan komprehensif untuk memodernisasi dan memperluas angkatan bersenjata kita dengan cepat harus diluncurkan!"
 GER_establish_production_targets: "Tetapkan Target Produksi"
 GER_establish_production_targets_desc: "Sebelum kita dapat melancarkan kampanye militer apa pun, pertama-tama kita harus memodernisasi dan memperlengkapi angkatan bersenjata kita. Untuk meningkatkan hasil produksi, kita harus menerapkan kuota dan target produksi yang ambisius."
 GER_prioritize_the_army: "Prioritaskan Angkatan Darat"
 GER_prioritize_the_army_desc: "Jerman, dan Prusia sebelumnya, selalu menjadi kekuatan darat dan mengandalkan tentara untuk menjaga kedaulatan dan keamanan kita. Kita harus mengarahkan upaya industri kita untuk memastikan tentara kita mempunyai perlengkapan yang baik dan mampu menaklukkan musuh mana pun."
 GER_prioritize_the_navy: "Prioritaskan Angkatan Laut"
 GER_prioritize_the_navy_desc: "Pengendalian atas laut akan menjadi hal yang penting jika kita ingin memperluas jangkauan kita melampaui batas negara kita saat ini. Kita harus memprioritaskan angkatan laut agar dapat menyaingi armada musuh mana pun dalam hal ukuran dan kekuatan."
 GER_extra_funds_to_waffenamt: "Dana Tambahan untuk Waffenamt"
 GER_extra_funds_to_waffenamt_desc: "Waffenamt, atau Badan Senjata, mengawasi desain dan pengembangan peralatan militer. Negara ini bekerja sama dengan produsen senjata dan lembaga penelitian, dan dengan memberikan dana tambahan, kita dapat meningkatkan laju kemajuan."
 GER_zentrale_planung: "Bentuklah Zentrale Planung"
 GER_zentrale_planung_desc: "Perang telah memperlihatkan kekurangan dalam upaya persenjataan kita, kekurangan yang harus kita atasi! Dengan membentuk Badan Perencanaan Pusat yang beranggotakan pemerintah, industri, dan militer, kita dapat mengoordinasikan kebijakan ekonomi dan mengarahkan sumber daya secara efisien untuk meningkatkan produksi senjata dan mendukung tujuan nasional serta supremasi militer."
 GER_criteria_for_economy_laws_tt: "Mengaktifkan §Y$partial_economic_mobilisation$§! akan mengubah UU Ekonomi menjadi §Y$war_economy$§! jika tersedia."
 GER_create_rustungsstab: "Buat Rüstungsstab"
 GER_create_rustungsstab_desc: "Upaya kami untuk menyederhanakan produksi senjata telah terbukti berhasil, namun perbaikan lebih lanjut masih diperlukan! Menciptakan Staf Persenjataan akan memungkinkan kita merancang strategi untuk mengalokasikan sumber daya dan memprioritaskan proyek-proyek untuk meningkatkan produksi senjata kita."
 GER_armament_rationalization: "Rasionalisasi Persenjataan"
 GER_armament_rationalization_desc: "Lini produksi kami hampir tidak dapat memenuhi kebutuhan angkatan bersenjata kami. Kita harus menerapkan langkah-langkah rasionalisasi persenjataan untuk meningkatkan efisiensi dan efektivitas mesin perang industri kita."
 GER_totaler_krieg: "Krieg Total"
 GER_totaler_krieg_desc: "Untuk mencapai kemenangan total, kita harus memobilisasi seluruh masyarakat kita dan melakukan perang total di depan pintu musuh kita. Saatnya [ROOT.GetNameDef] bangkit, dan biarkan badai melanda!"
 GER_gain_totaler_krieg_remove_total_mob_tt: "§RHapus§! §Y$tot_economic_mobilisation$§!. Dapatkan §Y$totaler_krieg_economy$§!."
 #ARMY
 GER_develop_modern_maneuver_warfare: "Kembangkan Perang Manuver Modern"
 GER_develop_modern_maneuver_warfare_desc: "Kita harus menyadari sifat peperangan modern yang terus berkembang dan mengembangkan doktrin baru yang menekankan integrasi infanteri dan teknologi baru untuk memaksimalkan efektivitas militer kita di medan perang."
 GER_fortify_the_vaterland: "Perkuat Vaterland"
 GER_fortify_the_vaterland_desc: "Untuk mengamankan [GER.GetNameDef] kita harus membangun benteng dimanapun diperlukan. Memperkuat pertahanan kita akan memungkinkan kita mempertahankan perbatasan dengan lebih sedikit orang, sehingga membebaskan perpecahan untuk berpartisipasi dalam potensi serangan di tempat lain."
 GER_fortify_the_vaterland_unlock_decision_tt: "Membuka Keputusan: §Y$GER_fortify_the_vaterland_cat$§!"
 GER_all_terrain_military_motorcycle: "Sepeda Motor Militer Segala Medan"
 GER_all_terrain_military_motorcycle_desc: "Pentingnya pengintaian cepat tidak bisa dilebih-lebihkan. Berinvestasi pada unit sepeda motor akan memberikan intelijen medan perang yang penting, menghasilkan pengambilan keputusan strategis dan meningkatkan efektivitas operasional."
 GER_salvage_captured_equipment: "Peralatan Penyelamatan yang Ditangkap"
 GER_salvage_captured_equipment_desc: "Dengan membangun fasilitas untuk menyelamatkan dan menggunakan kembali peralatan musuh yang dirampas untuk militer kita, kita dapat memperbarui dan mengintegrasikan senjata, kendaraan, dan mesin yang dirampas untuk memperkuat angkatan bersenjata kita."
 GER_salvage_captured_equipment_custom_tt: "Dua jenderal [ROOT.GetAdjective] acak akan mendapatkan sifat §YPemulung§!."
 GER_unlock_operational_planning_blitzkrieg_tt: "Membuka Keputusan: §Y$GER_operational_planning_category$§!, yang bila diaktifkan akan memberikan selama §Y45 hari§!:"
 GER_unlock_operational_planning_bewegungskrieg_tt: "Membuka Keputusan: §Y$GER_operational_planning_category$§!, yang bila diaktifkan akan memberikan selama §Y90 hari§!:"
 GER_the_prussian_legacy: "Warisan Prusia"
 GER_the_prussian_legacy_desc: "'Jika beberapa negara bagian mempunyai tentara, maka Tentara Prusia juga mempunyai negara', Voltaire pernah berkata. Kami akan mewujudkan hal ini dengan mengembangkan doktrin Jerman kuno tentang Bewegungskrieg – perang manuver – untuk memastikan kemenangan yang cepat dan luar biasa di medan perang."
 GER_improve_motorized_troops: "Tingkatkan Pasukan Bermotor"
 GER_improve_motorized_troops_desc: "Peperangan modern berkisar pada kecepatan dan kemampuan ofensif yang cepat. Kita harus memastikan bahwa Schnelltruppen kita, unit bermotor kita, siap dan mampu memimpin serangan dan memberikan kemenangan yang cepat dan menentukan."
 GER_lessons_of_the_great_war: "Pelajaran dari Perang Besar"
 GER_lessons_of_the_great_war_desc: "Kegagalan kita dalam Perang Besar memberikan wawasan berharga yang penting bagi konflik kita di masa depan. Kita telah mempelajari masa lalu dengan sangat rinci, dan sekarang kita harus menerapkan pelajaran yang diperoleh dari sejarah."
 GER_stormtroopers: "pasukan badai"
 GER_stormtroopers_desc: "Stosstruppen pada Perang Besar adalah pasukan kejutan elit yang dimaksudkan untuk memimpin serangan terhadap parit musuh dan menciptakan terobosan yang dapat dieksploitasi oleh infanteri utama. Kita harus menghidupkan kembali ide ini dan melatih pasukan kejutan elit baru yang akan melambangkan kecepatan, kelincahan, dan efisiensi yang kejam di medan perang."
 GER_sturmtruppe_battalion_tt: "Membuka kunci batalion pendukung §Y$sturmtruppe_battalion$§!."
 GER_artillery_bombardment: "Pengeboman Artileri"
 GER_artillery_bombardment_desc: "Infanteri adalah tulang punggung tentara kita, dan agar mereka bisa unggul, mereka memerlukan dukungan yang tepat. Kita harus berinvestasi besar-besaran pada artileri sehingga infanteri kita dapat memanfaatkan keuntungan apa pun dan mengalahkan musuh mana pun yang ada di hadapan mereka."
 GER_instill_auftragstaktik: "Tanamkan Auftragstaktik"
 GER_instill_auftragstaktik_desc: "Militer kita telah lama mempraktikkan auftragstaktik, atau komando misi, yang menekankan komando desentralisasi dan inisiatif individu. Hal ini menghasilkan fleksibilitas dan otonomi, meningkatkan kemampuan kita untuk beradaptasi dan berhasil dalam situasi yang tidak terduga. Sangatlah penting bagi kita untuk melanjutkan praktik ini agar pasukan kita selalu menang!"
 GER_establish_the_afrikakorps: "Mendirikan Afrikakorps"
 GER_establish_the_afrikakorps_desc: "Untuk dapat mengganggu jalur pasokan musuh dan mengamankan sumber daya penting serta posisi strategis, kita harus melakukan perang keluar dari Eropa dan ke wilayah asing!"
 GER_unlock_operational_planning_in_africa_tt: "Membuka Keputusan: §YPerencanaan Operasional di Afrika§!"
 GER_revive_the_schutztruppe: "Bangkitkan kembali Schutztruppe"
 GER_revive_the_schutztruppe_desc: "Schutztruppen adalah pasukan kolonial yang kami pekerjakan di wilayah Afrika di kerajaan kolonial kami. Mereka sangat membantu kita selama Kampanye Perang Besar di Afrika Timur dan juga selama konflik-konflik skala kecil sebelumnya. Mengingat mata kita sekali lagi tertuju ke Afrika dan Asia, mungkin ini saatnya untuk membangun kembali kantor kolonial dan mempertimbangkan korps Schutztruppe yang baru dan lebih baik."
 GER_revive_the_schutztruppe_tt: "Membuka §YSchutztruppe§! milisi kolonial dan keputusan untuk §YMerekrut§! dan §YMeningkatkan§! mereka"
 GER_establish_the_skijager: "Membangun Skijäger"
 GER_establish_the_skijager_desc: "Untuk memastikan bahwa angkatan bersenjata kita mempertahankan efektivitas dan kemampuan beradaptasi dalam segala kondisi cuaca, kita harus menguasai seni peperangan musim dingin. Untuk mencapai tujuan ini, kami akan melatih dan memperlengkapi pasukan pegunungan khusus, yang dikenal sebagai Skijäger, untuk beroperasi secara efektif di daerah bersalju dan pegunungan."
 GER_panzergrenadier: "Panzergrenadier"
 GER_panzergrenadier_desc: "Doktrin militer kita bertumpu pada mobilitas dan akan bergantung pada seberapa baik kinerja pasukan bermotor kita. Baik divisi infanteri maupun panzer tidak akan berhasil dalam kemajuan mereka tanpa dukungan yang tepat. Dengan mengintegrasikan infanteri mekanis dengan ujung tombak kami, kami memastikan pasukan kami mempertahankan keunggulan dalam operasi ofensif."
 GER_modify_bewegungskrieg_or_blitzkrieg_tt: "Ubah §Y$GER_blitzkrieg_modifier$§! atau §Y$GER_bewegungskrieg_modifier$§! dengan:"
 GER_heavy_armored_car_recon_company_tt: "§Y$armored_car_recon$§!:\n§YArmor§!: §G+5%§!\n§YHutan§!:\nGerakan Perubahan Efektif: §G+5%§!\n§YDesert§!:\nGerakan Perubahan Efektif: §G+10%§!\n§YDataran§!:\nGerakan Perubahan Efektif: §G+10%§!"
 GER_nationalize_ford_factories: "Nasionalisasi Pabrik Ford"
 GER_nationalize_ford_factories_desc: "Merebut kendali pabrik Ford di [51.GetName] dan menempatkannya di bawah kendali negara akan memperkuat kapasitas industri kita dan menjamin pasokan peralatan dan kendaraan penting yang stabil untuk mendukung angkatan bersenjata dan logistik kita."
 GER_kriegslokomotiven: "Kriegslokomotif"
 GER_kriegslokomotiven_desc: "Tantangan logistik peperangan mengharuskan produksi kriegslokomotiven, atau lokomotif perang. Kereta api ini akan disesuaikan dengan keadaan ekonomi kita dan kebutuhan akan produksi massal yang cepat dan murah."
 GER_improve_the_logistics_system: "Memperbaiki Sistem Logistik"
 GER_improve_the_logistics_system_desc: "Terlalu banyak jenderal kita di Komando Tinggi yang bersikap meremehkan logistik dan rantai pasokan, karena kurangnya pemahaman terhadap permasalahan sistem kita saat ini. Mereka harus disadarkan akan pentingnya logistik yang efisien dalam peperangan modern seiring kita memulai inisiatif komprehensif untuk meningkatkan sistem logistik kita."
 GER_defend_the_vaterland: "Pertahankan Vaterland"
 GER_defend_the_vaterland_desc: "Dengan ancaman yang membayangi perbatasan kita, kita harus berdiri teguh dalam mempertahankan Vaterland! Untuk melindungi rakyat Jerman, kita harus memperkuat posisi kita dan mengerahkan pasukan kita - [ROOT.GetNameDef] akan bertahan dan menang!"
 GER_uranverein: "Uranverein"
 GER_uranverein_desc: "Bangsa kita harus memelopori penelitian energi atom dan memanfaatkan potensinya untuk diri kita sendiri. Kita memiliki beberapa orang dengan pemikiran paling tajam di muka bumi yang mampu melakukan hal ini dan menjadi penghancur dunia."
 GER_adopt_new_panzer_doctrine: "Mengadopsi Doktrin Panzer Baru"
 GER_adopt_new_panzer_doctrine_desc: "$GER_army_innovation_desc$" #old loc
 GER_panzer_troops_school: "Sekolah Pasukan Panzer"
 GER_panzer_troops_school_desc: "Divisi panzer akan memainkan peran penting dalam setiap konflik modern, dan kita harus memastikan bahwa pasukan lapis baja kita berada di garis depan dalam inovasi militer. Melalui pelatihan ketat dan instruktur ahli, kami akan mengembangkan unit panzer elit yang diperlukan untuk meraih kemenangan."
 GER_advanced_panzer_research: "Penelitian Panzer Tingkat Lanjut"
 GER_advanced_panzer_research_desc: "Mengalokasikan sumber daya untuk meneliti dan mengembangkan teknologi tangki mutakhir akan menghasilkan wawasan baru dan hasil terobosan. Hal ini akan meningkatkan kemampuan tempur kami, membuat panzer kami menjadi lebih mematikan."
 GER_expand_kummersdorfs_capacity: "Perluas Kapasitas Kummersdorf"
 GER_expand_kummersdorfs_capacity_desc: "Kita harus memimpin pengembangan panzer dan mempelopori inovasi untuk memastikan dominasi kita di medan perang. Dengan mempelajari desain tank musuh di fasilitas di Kummerdorf dan memanfaatkan teknologi mutakhir, kami akan memelopori kemajuan yang mengalahkan semua pesaing."
 GER_combined_arms: "Senjata Gabungan"
 GER_combined_arms_desc: "Kemajuan pesat dalam teknologi telah mengubah cara peperangan dilakukan, sesuatu yang harus kita manfaatkan. Dengan menerapkan prinsip gabungan senjata dan menetapkan strategi komprehensif untuk menyelaraskan infanteri, kendaraan lapis baja, dan dukungan udara, kita akan menciptakan kekuatan tempur yang tangguh dan menjamin supremasi mereka."
 #LUFTWAFFE
 GER_expanding_the_luftwaffe: "Memperluas Luftwaffe"
 GER_expanding_the_luftwaffe_desc: "$air_innovation_desc$" #old loc
 GER_aeronautical_research_institute: "Lembaga Penelitian Penerbangan"
 GER_aeronautical_research_institute_desc: "Peperangan udara semakin penting dan kompleks sejak Perang Besar, dan sejak Perjanjian Versailles melarang kita mengerahkan angkatan udara, kita tertinggal dalam pengembangan pesawat terbang. Untuk mengatasinya, kita harus membangun Luftfahrtforschungsanstalt, atau Lembaga Penelitian Penerbangan, untuk mengembangkan badan pesawat, mesin, dan senjata inovatif guna menjamin supremasi udara."
 GER_dive_bombers: "Pembom Selam"
 GER_dive_bombers_desc: "$GER_tactical_air_effort_desc$" #old loc
 GER_tactical_bombers: "Pembom Taktis"
 GER_tactical_bombers_desc: "$GER_strategic_air_effort_desc$ Meratakan setiap pabrik di luar perbatasan kita dengan tanah akan menjamin bahwa hanya kita yang dapat mengerahkan militer yang efektif." #Old and new loc
 GER_uralbomber_program: "Program Pembom Ural"
 GER_uralbomber_program_desc: "Kemenangan akan tercapai ketika kita dapat menjangkau musuh kita dimanapun mereka berada. Mengembangkan pesawat yang mampu terbang ke Pegunungan Ural akan menempatkan hampir semua musuh potensial dalam jangkauan kita."
 GER_aerodynamic_research_institute: "Lembaga Penelitian Aerodinamika"
 GER_aerodynamic_research_institute_desc: "[ROOT.GetNameDefCap] baru-baru ini menjadi identik dengan inovasi udara karena kami telah banyak berinvestasi pada Angkatan Udara kami. Kita harus terus mencurahkan sumber daya ke bidang ini agar tetap menjadi yang terdepan dalam persaingan. Mendanai Lembaga Penelitian Aerodinamika dan pengembangan teknik propulsi baru pasti akan menghasilkan inovasi baru dalam upaya kita untuk menjadi ahli di angkasa."
 GER_aerodynamic_research_institute_tt: "Membuka sifat MIO §Y$GER_mio_trait_aerodynamic_research_insitute$§! untuk semua §YDesainer Pesawat§!. §RNamun hanya dapat diterapkan pada salah satu dari mereka§!."
 GER_fallschirmjager: "Fallschirmjäger"
 GER_fallschirmjager_desc: "Pentingnya strategis pasukan lintas udara, Fallschirmjäger, belum hilang dari perhatian kita. Melatih pasukan terjun payung elit ini untuk ditempatkan dengan cepat di belakang garis musuh akan meningkatkan keserbagunaan dan kecakapan tempur mereka, sehingga memperkuat kemampuan ofensif kita secara keseluruhan."
 GER_unlocks_eben_emael_raid_tt: "Membuka §YSerangan Penerjun Payung§! di §YEben Emael§!"
 GER_form_the_jagdwaffe: "Bentuk Jagdwaffe"
 GER_form_the_jagdwaffe_desc: "Kita harus membentuk Jagdwaffe, pasukan khusus pesawat tempur, untuk mengamankan superioritas udara. Menggabungkan pelatihan ketat, taktik canggih, dan teknologi mutakhir, kita akan mendominasi langit dan membiarkan pasukan darat kita melintasi medan perang, mengguncang tanah seperti guntur."
 GER_reorganize_the_luftwaffe: "Atur ulang Luftwaffe"
 GER_reorganize_the_luftwaffe_desc: "Meskipun Angkatan Udara kita baru dibentuk beberapa tahun yang lalu, namun telah menjadi instrumen kekuatan nasional yang tangguh. Namun, pembentukannya yang cepat dan perluasannya yang pesat telah meninggalkan beberapa kesalahan struktural dalam organisasi. Mendelegasikan lebih banyak tanggung jawab, dan mengurangi daya saing serta perebutan kekuasaan internal, akan memberdayakan Angkatan Udara kita untuk mencapai efisiensi dan efektivitas operasional yang lebih besar."
 GER_solve_the_logistical_bottlenecks: "Mengatasi Kemacetan Logistik"
 GER_solve_the_logistical_bottlenecks_desc: "Dengan selesainya reorganisasi Angkatan Udara, kita dapat mengalihkan perhatian kita ke sistem logistik dan rantai pasokan yang tidak efektif. Menyederhanakan masalah ini akan membebaskan lebih banyak orang untuk melakukan hal lain dan akan memfasilitasi perbaikan yang lebih cepat pada pesawat kami."
 GER_experimental_rotorcrafts: "Pesawat Rotor Eksperimental"
 GER_experimental_rotorcrafts_desc: "Dengan berinvestasi pada desain mutakhir dan mengembangkan teknologi baru, kami berupaya mengembangkan prototipe awal yang akan merevolusi mobilitas udara di medan perang. Kami bercita-cita untuk secara efisien mengubah kemampuan lepas landas dan mendarat vertikal dengan apa yang disebut helikopter."
 GER_develop_the_knickebein: "Kembangkan Knickebein"
 GER_develop_the_knickebein_desc: "Dengan menggunakan sistem navigasi radio yang rumit, kami telah menemukan cara untuk memandu pesawat kami agar melakukan pengeboman yang lebih akurat. Dengan memanfaatkan teknologi baru ini, kita mungkin bisa meratakan pabrik musuh dengan lebih efektif – bahkan pada malam hari."
 GER_defense_of_the_reich: "Pertahanan [GetDefenseofGermanyName]"
 GER_defense_of_the_reich_fascism: "negara Jerman"
 GER_defense_of_the_reich_neutral: "Kekaisaran"
 GER_defense_of_the_reich_democratic: "[GER.GetName]"
 GER_defense_of_the_reich_communism: "Revolusi Proletar"
 GER_defense_of_the_reich_desc: "Kita harus menjaga Vaterland dari serangan udara musuh. Mengamankan langit di atas [ROOT.GetNameDef] dan melindungi industri di darat harus diutamakan di atas segalanya!"
 GER_construct_the_kammhuber_line: "Bangun Garis Kammhuber"
 GER_construct_the_kammhuber_line_desc: "Kita tidak bisa membiarkan pembom dan pesawat tempur musuh berkeliaran bebas di langit di atas [ROOT.GetNameDef]. Kita harus membangun garis pertahanan di sepanjang pantai Perancis untuk dapat mencegat mereka sebelum mencapai pusat negara kita."
 GER_controls_atlantic_coast_brittany_finnmark_tt: "§Y[ROOT.GetName]§! atau subjek Jerman sepenuhnya mengendalikan negara non-Jerman di sepanjang §Ypantai Atlantik§! dari §Y[14.GetName]§! hingga §Y[925.GetName]§!."
 GER_controls_atlantic_coast_brittany_finnmark_effects_tt: "Setiap negara bagian yang dikontrol di sepanjang §Ypantai Atlantik Eropa§!: Tambahkan §G1§! §Y$anti_air_building$§!. Efek saat ini:"
 GER_establish_night_fighter_squadrons: "Bentuk Skuadron Tempur Malam"
 GER_establish_night_fighter_squadrons_desc: "Sebagai langkah selanjutnya dalam pertahanan kita di Vaterland, kita harus membentuk Nachtjagdgeschwader, Skuadron Petarung Malam. Penggunaan radar udara akan membuat mereka efektif siang dan malam dalam upaya menjaga langit kita bebas dari musuh."
 GER_torpedobomber: "Pembom torpedo"
 GER_torpedobomber_desc: "$naval_air_effort_desc$" #old loc
 GER_establish_carrier_groups: "Bentuk Grup Pengangkut"
 GER_establish_carrier_groups_desc: "Bertekad untuk menciptakan armada kapal induk yang tak tertandingi, kita harus melatih pilot kita untuk beroperasi dari dek ini. Pesawat udara kami akan menguasai langit di laut dan darat!"
 GER_rocketry_innovations: "Inovasi Roket"
 GER_rocketry_innovations_desc: "Lompatan besar berikutnya dalam perkembangan penerbangan ada dalam genggaman kita! Para insinyur kami tanpa kenal lelah berupaya menyempurnakan tenaga penggerak roket, yang dapat memberikan konsekuensi dan kegunaan besar dalam usaha kami untuk menjadi ahli di angkasa."
 GER_amerikabomber: "pembom Amerika"
 GER_amerikabomber_desc: "Kita harus berkomitmen penuh pada tujuan ambisius untuk menguasai angkasa dan menciptakan pesawat jarak jauh yang mampu mengejutkan musuh kita dengan menyerang sasaran jauh di dalam wilayah mereka – atau melintasi Atlantik untuk menunjukkan kepada semua orang bahwa tidak ada seorang pun yang aman dari jangkauan kita."
 GER_war_with_american_country_tt: "Berperang dengan negara §YAmerika§!"
 GER_unlocks_statue_of_liberty_raid_tt: "Membuka §YSerangan Udara§! di §YPatung Liberty§! saat berperang dengan §Y[USA.GetNameWithFlag]§!"
 #KRIEGSMARINE
 GER_strengthen_the_kriegsmarine: "Perkuat [GetStrengthenKriegsmarineName]"
 GER_strengthen_kriegsmarine_fascism: "Kriegsmarine"
 GER_strengthen_kriegsmarine_neutrality: "Kaiserliche Marinir"
 GER_strengthen_kriegsmarine_democratic: "Jerman Marinir"
 GER_strengthen_kriegsmarine_communism: "Volksmarine"
 GER_strengthen_the_kriegsmarine_desc: "$GER_naval_rearmament_desc$" #old loc
 GER_expand_kriegsmarinewerft: "Perluas [GetKriegsmarinewerftName]"
 GER_expand_kriegsmarinewerft_fascism: "Kriegsmarinewerft"
 GER_expand_kriegsmarinewerft_neutrality: "Kaiserliche Marinewerft"
 GER_expand_kriegsmarinewerft_democratic: "Marinewerft"
 GER_expand_kriegsmarinewerft_communism: "Volksmarinewerft"
 GER_expand_kriegsmarinewerft_desc: "Kita harus melipatgandakan upaya kita untuk membangun angkatan laut yang mampu menyaingi musuh-musuh kita. Dengan menerapkan teknologi di garis depan pembuatan kapal dan membangun kapal perang mutakhir, kita pasti akan merebut kendali laut lepas dari kendali musuh kita."
 GER_construct_aircraft_carriers: "Membangun Kapal Induk"
 GER_construct_aircraft_carriers_desc: "Angkatan laut besar dan modern mana pun yang sesuai dengan namanya harus memiliki kapal induk di armadanya. Kapal-kapal ini akan menjadi semakin penting dalam mendominasi lautan, jadi agar tidak tertinggal dari musuh, kita harus meluncurkan program pembangunan kapal udara yang ambisius."
 GER_carrier_variants_tt: "Buat Carrier §Yvariant§! dan §Ylini produksi§! bergantung pada §Y$early_ship_hull_carrier$§!, §Y$basic_ship_hull_carrier$§!, atau teknologi §Y$ship_hull_carrier_2$§!. Efek saat ini:"
 GER_grosskampfschiff_construction: "Konstruksi Grosskampfschiff"
 GER_grosskampfschiff_construction_desc: "$GER_pride_of_the_modern_germany_desc$" #old loc
 GER_high_seas_fleet: "Armada Laut Tinggi"
 GER_high_seas_fleet_desc: "Tujuan ambisius kami adalah menjadikan [ROOT.GetNameDef] benar-benar kekuatan global. Untuk mencapai tujuan tersebut, kita perlu menghidupkan kembali Hochseeflotte, atau Armada Laut Tinggi, yang pernah hampir menyaingi dominasi Angkatan Laut Kerajaan Inggris di lautan."
 GER_unlock_trade_interdiction_tt: "Membuka fokus §Y$GER_trade_interdiction$§!."
 GER_re_establish_the_seekriegsleitung: "Membangun kembali Seekriegsleitung"
 GER_re_establish_the_seekriegsleitung_desc: "Pembentukan kembali Seekriegsleitung, Komando Angkatan Laut Maritim, akan mengefektifkan perencanaan dan pelaksanaan perintah angkatan laut dan penempatan langsung."
 GER_marinestosstrupp: "Bentuk Stosstrupp Kelautan"
 GER_marinestosstrupp_desc: "Kita perlu membentuk unit infanteri angkatan laut, yang disebut pasukan kejut angkatan laut, yang mampu melakukan invasi angkatan laut dengan berani dan menembus pertahanan pantai musuh jika kita ingin memperluas kekuatan kita ke luar negeri."
 GER_atlantic_naval_bases: "Pangkalan Angkatan Laut Atlantik"
 GER_atlantic_naval_bases_desc: "Menyadari pentingnya wilayah pesisir Atlantik secara strategis, dan sebagai bagian dari upaya kita untuk menegaskan dominasi atas Samudera Atlantik, kita harus memprioritaskan perluasan dan modernisasi pangkalan angkatan laut dalam upaya mencapai keunggulan maritim."
 GER_naval_bases_along_atlantic_coast_tt: "Setiap §Y[ROOT.GetName]§! atau negara bagian yang dikendalikan subjek Jerman dengan §Y$naval_base$§! di sepanjang §Ypantai Atlantik Eropa§!: Tambahkan §G1§! §Y$naval_base$§!. Tambahkan §G1§! §Y$coastal_bunker$§!. Efek saat ini:"
 GER_atlantic_naval_dominance: "Dominasi Angkatan Laut Atlantik"
 GER_atlantic_naval_dominance_desc: "Untuk mengamankan dominasi kami di Samudera Atlantik, kami perlu memperluas jangkauan operasional kami lebih jauh lagi dan memperluas kehadiran angkatan laut kami dari pantai ke pantai."
 GER_controls_an_atantic_island_tt: "§Y[ROOT.GetName]§! atau subjek Jerman sepenuhnya menguasai sebuah pulau di Samudra Atlantik Utara"
 GER_naval_bases_on_atlantic_islands_tt: "Setiap §Y[ROOT.GetName]§! atau pulau yang dikuasai subjek Jerman dengan §Y$naval_base$§! di §YSamudera Atlantik Utara§!: Tambahkan §G1§! §Y$naval_base$§!. Tambahkan §G1§! §Y$coastal_bunker$§!. Efek saat ini:"
 GER_trade_interdiction: "Larangan Perdagangan"
 GER_trade_interdiction_desc: "Untuk mengganggu jalur pasokan musuh dan melemahkan upaya perang mereka, kita harus menerapkan strategi larangan perdagangan untuk melumpuhkan kemampuan mereka dalam berperang. Dengan mengerahkan armada permukaan dan U-boat ke seluruh lautan, kita akan mencegah pengiriman sumber daya penting dan kapal dagang, sehingga memaksa musuh kita untuk tunduk."
 GER_cruiser_warfare: "Perang Penjelajah"
 GER_cruiser_warfare_desc: "Kapal penjelajah ringan kami bisa lebih berguna daripada sekadar ditugaskan untuk tugas pengawalan; kita harus mengirim mereka ke laut lepas untuk mengganggu konvoi musuh dan melumpuhkan kemampuan industri mereka."
 GER_panzerschiff_raiders: "Perampok Panzerschiff"
 GER_panzerschiff_raiders_desc: "Kita harus menggunakan kapal-kapal kita yang lebih berat dalam strategi larangan perdagangan kita. Kapal-kapal ini dapat menyerang dengan keras dan mundur sebelum armada tempur utama musuh sempat meninggalkan pelabuhan."
 GER_wolfpack_tactics: "Taktik Wolfpack"
 GER_wolfpack_tactics_desc: "Gagasan untuk menyerang konvoi dengan kapal selam bukanlah hal baru dan pernah digunakan selama Perang Besar, namun sebuah taktik baru telah diusulkan. Pendekatan baru ini akan membuat U-boat kita bekerja sama dalam Rudel, sebuah kelompok, untuk mencari dan menenggelamkan kapal dagang. Ini mungkin menjadi kunci untuk merampas bahan mentah musuh dan kemampuan untuk melanjutkan perang ini."
 GER_u_boat_efforts: "Upaya U-Boat"
 GER_u_boat_efforts_desc: "Keberhasilan taktik Wolfpack telah meyakinkan Komando Tinggi Angkatan Laut untuk menggandakan pendekatan ini dan fokus pada pembangunan U-boat yang lebih banyak dan lebih baik untuk mengamankan kemenangan kita di laut lepas."
 GER_unrestricted_convoy_raiding: "Penggerebekan Konvoi Tanpa Batas"
 GER_unrestricted_convoy_raiding_desc: "Kita harus melipatgandakan efisiensi serangan konvoi kita, dan melipatgandakan upaya perencanaan kita untuk menjadikan lautan berada di bawah kendali penuh kita!"
 GER_unlock_plan_z_tt: "Membuka fokus §Y$GER_plan_z$§!."
 GER_with_panzerschiff_completed_tt: "Dengan §Y$GER_panzerschiff_raiders$§! selesai:"
 GER_with_u_boat_efforts_completed_tt: "Dengan §Y$GER_u_boat_efforts$§! selesai:"
 GER_seeherrschaft: "Seeherrschaft"
 GER_seeherrschaft_desc: "Kita sudah berada di jalur yang tepat untuk menjadi penguasa lautan yang tak terbantahkan dan mewujudkan visi Seeherrschaft, atau dominasi laut. Sekarang [ROOT.GetNameDef] menguasai ombak!"
 GER_remilitarize_the_rhineland: "Remiliterisasi Rhineland"
 GER_remilitarize_the_rhineland_desc: "$GER_rhineland_desc$"
 GER_legion_condor: "Legiun Condor"
 GER_legion_condor_desc: "Ketika Perang Saudara berkecamuk di semenanjung Iberia, sebuah peluang besar muncul di hadapan kita. Dengan mengirimkan sukarelawan sebanyak yang kita bisa, kita tidak hanya bisa memastikan pihak yang benar menang, tapi juga menawarkan pengalaman medan perang kepada pasukan kita dan mendekatkan orang-orang [SPR.GetAdjective] yang memiliki cita-cita yang sama dengan kita."
 GER_reorganize_secret_services: "Mengatur Ulang Dinas Rahasia"
 GER_reorganize_secret_services_desc: "$GER_wilhelm_canaris$ telah terbukti tidak efisien, atau bahkan tidak setia terhadap pemerintah saat ini jika rumor tersebut dapat dipercaya. Kita perlu memecatnya dan mengatur ulang Abwehr menjadi institusi yang lebih kompeten."
 GER_fuhrerprinzip: "Führerprinzip"
 GER_fuhrerprinzip_desc: "Sang Führer mengharapkan kesetiaan penuh dari orang-orang terdekatnya, namun mereka yang termasuk di antara segelintir orang yang dipercayainya harus ingat bahwa tidak ada satu pun dari mereka yang lebih berarti daripada batu tempat mereka berdiri. Satu langkah yang keluar dari jalur atau kegagalan untuk bertindak sesuai dengan keinginan Führer mungkin akan menimbulkan konsekuensi yang mengerikan. Führer sendiri yang akan menentukan arah kita."
 GER_party_chancellor_hess: "Rektor Partai Hess"
 GER_party_chancellor_hess_desc: "Rudolf Hess telah lama menjadi anggota aktif partai. Dia mendapat kepercayaan dari beberapa anggota elit politik, termasuk Führer sendiri. Wajar jika dia dianugerahi jabatan sebagai Rektor Partai."
 GER_party_chancellor_bormann: "Rektor Partai Bormann"
 GER_party_chancellor_bormann_desc: "Martin Bormann telah terbukti paling tepat dalam posisinya sebagai sekretaris pribadi Wakil Führer. Ia juga memiliki pengetahuan yang luas di bidang keuangan karena sebelumnya mengepalai Hilfskasse der NSDAP, sebuah dana tambahan untuk NSDAP, ia akan menjadi Rektor Partai yang sempurna."
 GER_mega_reichskommissariats: "Mega Reichskommisariat"
 GER_mega_reichskommissariats_desc: "Mengingat Reichskommisariat telah membuktikan upaya yang paling bermanfaat, tidak mengherankan jika pemimpin kita [ROOT.GetLeader] telah menghabiskan banyak waktu untuk mempertimbangkan perbaikan lebih lanjut. Salah satu permasalahan yang dihadapi oleh Reichskommisariat adalah jumlah mereka yang semakin besar, dan dengan itu, semakin besarnya jumlah administrasi yang diperlukan untuk mengatur mereka. Tentunya beberapa dari mereka bisa digabungkan..."
 GER_optimize_reich_labour_service: "Optimalkan Layanan Reich"
 GER_optimize_reich_labour_service_desc: "Layanan Buruh Reich memiliki tujuan yang besar dalam menjaga agar penduduk kita tetap mendapatkan pekerjaan, namun menurut kami layanan ini dapat digunakan untuk hal yang lebih banyak lagi. Kita dapat mengoptimalkan penggunaan RAD untuk memastikan kita mendapatkan hasil maksimal dalam semua aspek, ketenagakerjaan, propaganda, dan persiapan perang."
 GER_ascension_of_himmler: "$GER_inner_circle_member_title$ Himmler"
 GER_ascension_of_himmler_desc: "Di bawah organisasi dan kepemimpinan Heinrich Himmler, SS telah berkembang dari awal yang kecil menjadi kekuatan yang lebih menonjol di negara kita. Mempromosikan dia akan membuat kita lebih memanfaatkan keahliannya dan memanfaatkan SS dengan lebih baik"
 GER_expand_ss_recruitment: "Perluas Rekrutmen SS"
 GER_expand_ss_recruitment_desc: "Persyaratan untuk bergabung dengan SS sangat tinggi, dan prosesnya sendiri digambarkan seperti harus melewati lubang jarum. Meskipun persyaratan harus tetap tinggi untuk memastikan angkatan kerja berkualitas tinggi, rekrutmen dapat diperluas dengan cara lain yang tidak berarti menurunkan standar kami."
 GER_create_four_militia_units_tt: "Buat §Y4 unit Milisi Jerman§!"
 GER_create_two_motorized_units_tt: "Buat §Y2 unit Bermotor Jerman§!"
 GER_SS_recruitment_tt: "Membuka Keputusan: §Y$SS_recruitment$§!"
 GER_strengthen_the_waffen_ss: "Perkuat Waffen-SS"
 GER_strengthen_the_waffen_ss_desc: "Waffen-SS, cabang tempur SS, telah terbukti menjadi aset berharga bagi kami saat berperang. Meskipun secara teknis merupakan cabang paramiliter, kami sangat yakin bahwa dengan sumber daya yang lebih banyak, mereka dapat beroperasi sama efektifnya dengan tentara reguler kami."
 GER_create_two_militia_units_tt: "Buat §Y2 unit Milisi Jerman§!"
 GER_create_one_motorized_units_tt: "Buat unit §Y1 Bermotor Jerman§!"
 GER_create_two_light_panzer_units_tt: "Buat §Y2 unit Armor Ringan Jerman§!"
 GER_create_two_medium_panzer_units_tt: "Buat §Y2 unit Armor Menengah Jerman§!"
 GER_expand_ss_security_duties: "Perluas Tugas Keamanan SS"
 GER_expand_ss_security_duties_desc: "Dengan pertumbuhan SS yang stabil di bawah bimbingan Heinrich Himmler, inilah saatnya mereka mengambil tanggung jawab yang lebih besar untuk keamanan kita. Dengan memperluas tugas mereka, kita dapat membebaskan sumber daya untuk digunakan di tempat lain."
 GER_hegemony_of_the_ss: "Hegemoni SS"
 GER_hegemony_of_the_ss_desc: "Dengan peningkatan rekrutmen dan perlengkapan yang lebih baik, SS kini menjadi kekuatan yang tangguh di medan perang. Di bawah kepemimpinan Himmler, grup ini telah berkembang menjadi salah satu aset kami yang paling menonjol, yang mampu melakukan hal-hal yang jauh melampaui harapan kami. Mempercayakan mereka dengan kekuatan yang mereka miliki saat ini adalah sebuah keputusan yang bijaksana, ke depan kita harus terus membekali mereka dengan sarana yang diperlukan untuk sukses."
 GER_expand_gestapo: "Perluas Gestapo"
 GER_expand_gestapo_desc: "Gestapo terbukti paling tepat dalam menangani oposisi politik dan pembuat onar lainnya. Dengan memperluasnya, kita dapat memastikan masyarakat kita bertindak sesuai dengan hukum dan harapan yang berlaku saat ini."
 GER_absorb_the_abwehr: "Serap Abwehr"
 GER_absorb_the_abwehr_desc: "Memisahkan Abwehr dari Komando Angkatan Darat adalah keputusan yang masuk akal pada saat keputusan itu dibuat. Dengan situasi saat ini, tampaknya yang terjadi justru sebaliknya. Kita harus mempertimbangkan untuk menyerap Abwehr."
 GER_innovative_warfare: "Peperangan Inovatif"
 GER_innovative_warfare_desc: "Metode kita dalam berperang harus terus berkembang atau kita berisiko mengalami stagnasi. Hanya melalui evolusi dan perubahan yang terus-menerus, kita dapat mencegah musuh-musuh kita untuk bersikap bijaksana terhadap taktik dan teknologi kita."
 GER_form_organization_todt: "Bentuk Organisasi Todt"
 GER_form_organization_todt_desc: "Meskipun ada beberapa proyek konstruksi besar yang ingin diselesaikan oleh Führer, sebagian besar harus menunggu. Yang paling mendesak [ROOT.GetNameDef] sangat membutuhkan lebih banyak industri militer. Dengan perencanaan di tangan Fritz Todt kami yakin hasilnya akan bagus."
 GER_employ_philipp_holzmann: "Pekerjakan Philipp Holzmann"
 GER_employ_philipp_holzmann_desc: "Albert Speer, telah mengemukakan ide untuk mempekerjakan Philipp Holzmann AG untuk beberapa proyek konstruksi besar yang ingin dilakukan oleh Führer. Perusahaan ini memiliki reputasi yang baik dan sejarah yang panjang, telah membangun mahakarya arsitektur seperti Balai Kota Hamburg, dan Reichstag yang asli. Mereka akan sesuai dengan kebutuhan kita!"
 GER_prioritize_the_four_year_plan: "Prioritaskan Rencana Empat Tahun"
 GER_prioritize_the_four_year_plan_desc: "Kami tahu sejak awal bahwa Rencana Empat Tahun [ROOT.GetLeader] akan menjadi langkah penting untuk mempersiapkan bangsa menghadapi perang. Karena Führer sendiri adalah orang yang sangat sibuk, diperlukan seseorang untuk mengawasi dan mengoordinasikan tindakan yang diperlukan."
 GER_plenipotentiary_of_the_four_year_plan: "Yang Berkuasa Penuh Rencana Empat Tahun"
 GER_plenipotentiary_of_the_four_year_plan_desc: "Menjadi jelas bahwa upaya untuk mengawasi dan mengefektifkan pelaksanaan Rencana Empat Tahun merupakan tugas yang lebih luas daripada yang diperkirakan sebelumnya. Dengan menjadikan Hermann Göring sebagai Yang Berkuasa Penuh Reich, kami memberikan banyak kekuasaan kepada satu orang, namun sehubungan dengan hasil luar biasa yang ia peroleh, Führer yakin. Hermann Göring terlalu berguna bagi kita untuk tidak memberinya hak diplomasi penuh dalam masalah ini."
 GER_autonomous_organization_todt: "Organisasi Otonom Todt"
 GER_autonomous_organization_todt_desc: "Inisiatif Fritz Todt, Organization Todt, terbukti paling efektif. Proyek-proyek konstruksi diselesaikan dengan cepat sampai pada tingkat yang bahkan disukai oleh Führer sendiri. Mengingat statusnya sebagai Penguasa Persenjataan dan Produksi Perang Reich, Todt bisa menjadi aset nyata bagi negara kita."
 GER_plenipotentiary_of_armaments: "Yang Berkuasa Penuh Persenjataan"
 GER_plenipotentiary_of_armaments_desc: "Menjadi semakin jelas bahwa seseorang perlu mengambil tanggung jawab menyeluruh untuk menyediakan apa yang dibutuhkan Wehrmacht. Albert Speer telah menunjukkan hasil yang paling menjanjikan dalam upayanya memasok Wehrmacht. Mengingat statusnya sebagai Penguasa Persenjataan dan Produksi Perang Reich, orang ini dapat mencapai hasil yang sangat baik secara ajaib!"
 GER_integration_of_puppet_economies: "Integrasi Ekonomi Boneka"
 GER_integration_of_puppet_economies_desc: "Ketika kita melihat bagaimana keadaan rakyat kita, menjadi jelas betapa buruknya mereka mengelola perekonomian mereka. Meskipun hal ini terutama berdampak pada mereka, hal ini juga berdampak buruk pada perekonomian kita. Führer menuntut sesuatu untuk dilakukan mengenai masalah yang ada!"
 GER_ministry_of_public_enlightenment: "Kementerian Pencerahan Masyarakat"
 GER_ministry_of_public_enlightenment_desc: "Kementerian Propaganda telah banyak membantu kami belakangan ini. Dengan mengubah nama Kementerian Propaganda menjadi Kementerian Pencerahan Masyarakat, kita seharusnya dapat memperluas tugasnya, serta meningkatkan pendanaan tanpa menimbulkan kekhawatiran."
 GER_fund_the_film_department: "Danai Departemen Film"
 GER_fund_the_film_department_desc: "Film telah terbukti menjadi alat yang ampuh untuk menginspirasi dan memimpin masyarakat. Dengan memproduksi dan mempromosikan film-film patriotik kita akan memacu bangsa kita untuk mengabdikan diri sepenuhnya pada [ROOT.GetName] kejayaan kita!"
 GER_the_triumphant_will: "Kehendak Kemenangan"
 GER_the_triumphant_will_desc: "$GER_improve_national_spirit_desc$"
 GER_propaganda_master: "Ahli Propaganda"
 GER_propaganda_master_desc: "Kami tidak ragu-ragu ketika menunjuk Joseph Goebbels sebagai Menteri Propaganda kami. Dia sudah menjadi pembicara dan penulis ulung. Kini, setelah beliau menyuarakan ide-ide tentang cara meningkatkan organisasi intelijen, kami yakin sepenuhnya bahwa tindakan berdasarkan ide-ide ini adalah demi kepentingan terbaik kami."
 GER_bribe_senior_officers: "Petugas Senior yang menyuap"
 GER_bribe_senior_officers_desc: "Untuk memastikan loyalitas perwira senior kita terhadap Führer, kita harus mempertimbangkan penghargaan atas kesetiaan dan kepatuhan. Dengan menawarkan pembebasan uang, tanah, dan pajak, kami memastikan bahwa mereka tidak hanya akan tetap setia, namun juga bahwa mereka akan tetap berada di jalur mereka, dan tidak mempertanyakan Führer mereka."
 GER_army_indoctrination: "Indoktrinasi Angkatan Darat"
 GER_army_indoctrination_desc: "Suap dan insentif moneter sangat bermanfaat bagi perwira senior kami dan individu terpilih di Wehrmacht. Namun, bagi prajurit biasa kita tidak bisa bergantung pada suap atau perekonomian kita akan hancur. Mengindoktrinasi mereka agar sepenuhnya setuju dengan keputusan kita melalui upaya propaganda mungkin merupakan tindakan yang lebih masuk akal."
 GER_autonomy_in_the_kriegsschulen: "Otonomi di Kriegsschulen"
 GER_autonomy_in_the_kriegsschulen_desc: "Akademi Perang, atau Kriegsschulen, memiliki tradisi panjang di negara kita. Meskipun kita tergoda untuk mengelola dan menyesuaikan setiap bagian pendidikan yang diberikan di akademi, akan lebih baik jika kita mengizinkan dan memberdayakan sekolah untuk memberikan pelatihan terbaik bagi petugas masa depan kita."
 GER_strafbataillon: "Strafbataillon"
 GER_strafbataillon_desc: "Setelah menerapkan langkah-langkah indoktrinasi di kalangan tentara, kini kita dapat memanfaatkannya dengan lebih dari sekadar membuat tentara loyal kepada kita. Dengan mengerahkan batalyon hukuman, kita dapat menumbuhkan sentimen nasionalistis yang diinginkan pada individu-individu ini melalui indoktrinasi dan membuat mereka mengabdi pada Tanah Air!"
 GER_expand_the_truppenschulen: "Perluas Truppenschulen"
 GER_expand_the_truppenschulen_desc: "Untuk memenuhi meningkatnya permintaan akan petugas khusus, cabang sekolah layanan kami perlu diperluas secara signifikan. Memberikan pelatihan terbaik kepada calon perwira kami akan memastikan keberhasilan kami di medan perang."
 GER_demonstration_of_military_achievements: "Demonstrasi Prestasi Militer"
 GER_demonstration_of_military_achievements_desc: "Sejarah kita penuh dengan prestasi militer yang luar biasa. Dengan mengakui bahwa apa yang telah dicapai pasukan kita saat ini akan menjadi salah satu pencapaian besar militer kita, kita dapat meningkatkan moral dan semakin meningkatkan loyalitas mereka terhadap kita."
 GER_demonstration_of_military_achievements_trigger: "Salah satu dari pernyataan berikut harus benar:\nLebih dari §Y2§! Negara subjek\nLebih dari §Y19§! negara bagian yang diduduki di §YEropa§!" #TODO_Danne make these numbers into a variable!
 GER_country_leader_change_blocks_progress_demonstration_military_achievement_tt: "§RMengganti Pemimpin Negara setelah menyelesaikan §Y$GER_demonstration_of_military_achievements$§! akan memblokir §Y$GER_an_invincible_army$§! dan §Y$GER_the_supreme_leader$§! agar tidak diselesaikan§!"
 GER_an_invincible_army: "Tentara Jerman, Tak Terkalahkan"
 GER_an_invincible_army_desc: "Melalui banyak pencapaian dan kemenangan yang diperoleh tentara kita di medan perang, kita telah membuktikan kepada dunia bahwa terlepas dari apa yang dikatakan oleh para demagog musuh, tentara [ROOT.GetAdjective] benar-benar tak terkalahkan!"
 GER_country_leader_change_blocks_progress_invincible_army_tt: "§RMengganti Pemimpin Negara setelah menyelesaikan §Y$GER_an_invincible_army$§! akan memblokir §Y$GER_the_supreme_leader$§! agar tidak selesai§!"
 GER_an_invincible_army_trigger: "Salah satu dari pernyataan berikut harus benar:\nLebih dari §Y5§! Negara subjek\nLebih dari §Y49§! negara bagian yang diduduki di §YEropa§!"
 GER_the_supreme_leader_trigger: "[ROOT.GetNameDefCap] memiliki §YKapitulasi§! lebih dari §Y2 Negara Besar§!"
 GER_the_supreme_leader: "Pemimpin Tertinggi"
 GER_the_supreme_leader_desc: "Melalui program reformasi dan revitalisasi yang terarah, kesetiaan Wehrmacht terhadap [ROOT.GetLeader] dan perjuangannya telah mencapai puncaknya. Tren dukungan penuh kepada pemimpin kita dan Tanah Air harus dilanjutkan."
 GER_a_strong_successor: "Penerus yang Kuat"
 GER_a_strong_successor_desc: "Pergantian penjaga sudah dekat dan Führer baru harus naik. Kami memiliki kesempatan untuk melantik pemimpin baru yang mencerminkan aspirasi kami untuk [ROOT.GetNameDef]. Pergeseran ini akan memperkuat kembali upaya kami untuk mewujudkan masa depan yang lebih cerah bagi rakyat Jerman."
 GER_loyalty_to_the_fuhrer: "Kesetiaan kepada Führer"
 GER_loyalty_to_the_fuhrer_desc: "Sesuai dengan referendum tahun 1934 ketika peran Presiden dan Kanselir digabungkan, kami menyadari besarnya dukungan yang dimiliki Hitler di antara masyarakat kami. Kami tidak melihat indikasi bahwa lanskap politik telah berubah dan oleh karena itu kami akan terus mendukung Führer."
 GER_heed_von_neuraths_concerns: "Perhatikan Kekhawatiran von Neurath"
 GER_heed_von_neuraths_concerns_desc: "Kekhawatiran mengenai taktik dan kebijakan militer kita saat ini telah dikemukakan oleh sejumlah pejabat tinggi militer kita, yang dipimpin oleh Konstantin von Neurath. Menurut mereka, rencana militer Führer yang agak agresif tidak akan bertahan, dan dalam menghadapi risiko perang habis-habisan yang mungkin terjadi jika kita mengejar mereka, angkatan bersenjata kita belum cukup kuat."
 GER_reorganize_the_wehrmacht: "Atur ulang Wehrmacht"
 GER_reorganize_the_wehrmacht_desc: "Agar kita dapat menindaklanjuti rencana ambisius Führer, reorganisasi besar-besaran harus dilakukan di dalam Wehrmacht. Terlalu banyak pemimpin saat ini yang menghabiskan waktu mereka untuk menyuarakan keprihatinan yang remeh dan tidak berdasar daripada melaksanakan perintah Führer. Hanya dengan menyingkirkan orang-orang ini tujuan kita dapat tercapai!"
 GER_anschluss: "Anschluss"
 GER_anschluss_desc: "Terlepas dari kata-kata politisi [AUS.GetAdjective], jelas bahwa sebagian besar penduduk [AUS.GetNameDef] yang berbahasa [GER.GetAdjective] ingin sekali bersatu kembali dengan Tanah Air. Kita harus menekan pemimpin korup [AUS.GetLeader] untuk mengundurkan diri, dan membiarkan keinginan rakyat dilaksanakan."
 GER_anschluss_army_trigger_tt: "§Y[ROOT.GetAdjective]§! Tentara setidaknya §Y[?global.deployed_manpower_ratio_needed_for_anschluss]§! kali lebih besar dari §Y[AUS.GetAdjective]§! Tentara jika hanya menghitung unit yang dilengkapi perlengkapan yang memadai.\n\nKami memperkirakan bahwa kami memiliki [GetAnschlussProgress] ini"
 GER_antischluss_progress_minimal: "membuat kemajuan §RMinimal§!"
 GER_antischluss_progress_moderate: "membuat kemajuan §OModerat§!"
 GER_antischluss_progress_significant: "membuat kemajuan §YSignifikan§!"
 GER_antischluss_progress_complete: "§GTercapai§!"
 GER_austrian_army_does_not_exist: "Saat ini §Y[AUS.GetnameDef]§! tidak memiliki tentara tetap."
 GER_befriend_czechoslovakia: "$GER_czech_friend$"
 GER_befriend_czechoslovakia_desc: "$GER_czech_friend_desc$"
 GER_war_preparations: "Persiapan Perang"
 GER_war_preparations_desc: "Untuk sepenuhnya mempersiapkan negara menghadapi perang yang akan datang, kita harus memastikan bahwa persiapan dilakukan tidak hanya di dalam Wehrmacht, tetapi juga di dalam industri, dan infrastruktur."
 GER_prepare_for_the_next_blockade_ww: "Bersiaplah untuk Blokade Berikutnya"
 GER_prepare_for_the_next_blockade_ww_desc: "Ketika negara-negara lain menyadari betapa besarnya persiapan yang kami lakukan, tidak dapat dihindari bahwa beberapa negara akan keberatan. Kami pernah mengalami blokade sebelumnya, dan kami tahu cara mengatasinya. Dengan persiapan yang matang, blokade mereka tidak akan berdampak banyak pada kita."
 GER_subversive_infiltrators: "Penyusup Subversif"
 GER_subversive_infiltrators_desc: "Intelijen dan Informasi tentang musuh sangat penting untuk keberhasilan invasi. Ketika kita meningkatkan pengeluaran di banyak bidang, masuk akal jika kita juga berinvestasi dalam meningkatkan pengumpulan intelijen."
 GER_integrate_czechoslovakia: "Integrasikan Cekoslowakia"
 GER_integrate_czechoslovakia_desc: "Ketika kita mendapatkan lebih banyak wawasan tentang bagaimana [CZE.GetNameDef] dijalankan, semakin jelas bahwa masyarakat merindukan perubahan. Integrasi ke dalam [GER.GetNameDef] akan memberikan perubahan yang sangat dibutuhkan ini. Kita harus mengirimkan delegasi dengan ultimatum."
 GER_fate_of_czechoslovakia: "$GER_end_of_czechoslovakia$"
 GER_fate_of_czechoslovakia_desc: "$GER_end_of_czechoslovakia_desc$"
 GER_support_a_coup_in_liechtenstein: "Mendukung Kudeta di Liechtenstein"
 GER_support_a_coup_in_liechtenstein_desc: "Kami telah menerima kabar bahwa orang-orang yang berpikiran sama di Liechtenstein berencana untuk menggulingkan bupati di negara mikro tersebut. Seorang pria bernama Alfons Goop datang untuk meminta dukungan kami, dan memastikan bahwa kami juga akan mendapat manfaat dari hal ini."
 GER_reassert_eastern_claims: "$GER_demand_memel$"
 GER_reassert_eastern_claims_desc: "$GER_demand_memel_desc$"
 GER_expand_claims_in_baltic: "Perluas Klaim di Baltik"
 GER_expand_claims_in_baltic_desc: "Secara historis terdapat diaspora [ROOT.GetAdjective] dalam jumlah besar yang tinggal di Baltik. Adalah demi kepentingan terbaik mereka, sama seperti kepentingan kita, untuk membawa mereka pulang ke [ROOT.GetNameDef]!"
 GER_influence_the_baltics: "Mempengaruhi Baltik"
 GER_influence_the_baltics_desc: "Negara-negara Baltik berada dalam kondisi genting di antara kita dan [SOV.GetNameDef]. Dengan upaya diplomasi dan tawaran yang saling menguntungkan, kita seharusnya bisa mendekatkan keduanya tanpa perlu adanya konflik."
 GER_danzig_for_slovakia: "$GER_danzig_vs_slovakia$"
 GER_danzig_for_slovakia_desc: "$GER_danzig_vs_slovakia_desc$"
 GER_befriend_poland: "$GER_poland_friend$"
 GER_befriend_poland_desc: "$GER_poland_friend_desc$"
 GER_subjugate_romanian_economy: "Menaklukkan Perekonomian Rumania"
 GER_subjugate_romanian_economy_desc: "[ROM.GetNameDefCap] telah menjadi mitra dagang penting bagi kami. Banyaknya minyak mentah yang diekstraksi di dalam negeri telah meningkatkan perekonomian negara dan kini mereka mulai menaikkan harga. Tentunya kita dapat memberikan tekanan untuk memastikan harga terbaik bagi pelanggan lama seperti kami?"
 GER_influence_the_benelux: "Mempengaruhi Benelux"
 GER_influence_the_benelux_desc: "Kawasan Benelux tidak hanya penting bagi upaya perang kami yang berkelanjutan, namun juga karena kemampuan industri dan posisi geografisnya. Meskipun kita mungkin bisa mengalahkan mereka dengan mudah, mengapa tidak mengarahkan mereka ke pihak kita saja?"
 GER_operation_weserubung: "$GER_weserubung$"
 GER_operation_weserubung_desc: "$GER_weserubung_desc$"
 GER_utilize_the_nordliche_gesellschaft: "Memanfaatkan Nordische Gesellschaft" # was Befriend Scandinavia
 GER_utilize_the_nordliche_gesellschaft_desc: "Skandinavia secara tradisional netral. Tidak ada gunanya membuka front lain untuk mencoba mengambil sumber daya yang mereka miliki jika kita dapat memperolehnya secara diplomatis. Oleh karena itu, kita harus memanfaatkan Masyarakat Nordik Alfred Rosenberg, sebuah asosiasi untuk memperkuat kerja sama budaya dan politik Jerman-Nordik, untuk memberikan kesan positif kepada negara-negara Nordik."
 GER_form_rome_berlin_axis: "Membentuk Poros Roma-Berlin"
 GER_form_rome_berlin_axis_desc: "$GER_italy_ally_desc$"
 GER_invade_italy: "Operasi Alaric"
 GER_invade_italy_desc: "Meskipun pada pandangan pertama [ITA.GetNameDef] mungkin tampak sebagai sekutu potensial yang baik bagi kita, kita tahu warna aslinya. Pada awal Perang Besar, mereka menolak untuk berperang bersama kami, dan pada tahun 1915 bahkan berbalik melawan kami, meskipun kami telah bersekutu sebelumnya. Kami mengambil pelajaran dari hal tersebut, kesalahan dalam mempercayai mereka tidak akan terulang lagi."
 GER_alliance_with_spain: "$GER_nationalist_spain_ally$"
 GER_alliance_with_spain_desc: "$GER_nationalist_spain_ally_desc$"
 GER_operation_felix: "Operasi Felix"
 GER_operation_felix_desc: "Dengan berakhirnya Perang Saudara Spanyol, inilah saatnya bagi kita untuk memisahkan [118.GetName] dari [ENG.GetAdjective]. Namun karena kami tidak dapat menyerang dari laut, pertama-tama kami harus memastikan kesetiaan dari [SPR.GetAdjective] agar kami dapat melewati wilayah mereka. Mengingat ideologi kita, seharusnya tidak sulit untuk membuat mereka tunduk."
 GER_secure_spain_desc: "[SPR.GetNameDef] telah terbukti sebagai negara yang paling bergejolak. Saat mereka berjuang dengan pemerintahannya, mungkin kita harus menawarkan bantuan kepada mereka? Pada titik ini, tentunya rezim boneka kita lebih disukai daripada kekacauan yang biasa mereka alami?"
 GER_alliance_with_portugal: "Aliansi dengan Portugal"
 GER_alliance_with_portugal_desc: "Secara historis kami belum memiliki hubungan yang paling positif dengan [POR.GetNameDef]. Meskipun kami adalah musuh bebuyutan dalam Perang Besar, namun mereka tampaknya berubah pikiran. Setelah mendukung kaum nasionalis di Spanyol, kami percaya bahwa mungkin ada kesamaan ideologi dan bahwa kami dapat mencapai kesepakatan dengan [POR.GetAdjective]."
 GER_operation_isabella: "Operasi Isabella"
 GER_operation_isabella_desc: "Dengan hanya [POR.GetNameDef] yang berdiri di antara kita dan kendali penuh atas Semenanjung Iberia, langkah kita selanjutnya adalah membuat mereka tunduk kepada kita. Mempertahankan pemerintahan lokal namun tetap menjamin kesetiaan mereka kepada kami akan memberikan kami semua yang kami perlukan dari mereka dalam hal tanah, infrastruktur, dan struktur militer."
 GER_secure_portugal_desc: "Pada masa Perang Besar, [POR.GetAdjective] terpengaruh oleh propaganda lawan dan berbalik melawan kami. Beberapa kapal tua kita masih berlabuh di pelabuhannya, dan belum ada kabar mengenai pengembaliannya. Meskipun mereka terlihat cukup ramah sekarang, kita tidak bisa mempercayai mereka dan kita harus menjelaskan kepada mereka bahwa kecuali mereka ingin berperang, inilah saatnya untuk tunduk pada kekuasaan kita."
 GER_operation_sea_lion: "Operasi Singa Laut"
 GER_operation_sea_lion_desc: "Posisi geografis [ENG.GetNameDef] telah terbukti menjadi faktor rumit dalam upaya perang kita saat ini. Meluncurkan operasi ofensif habis-habisan baik dari udara maupun laut tampaknya merupakan tindakan terbaik untuk akhirnya mematahkan [ENG.GetAdjective]!"
 GER_operation_green: "Operasi Hijau"
 GER_operation_green_desc: "Untuk mendukung operasi Singa Laut, komando operasional kami di sisi barat harus merencanakan operasi skala penuh di Irlandia, dan mempersiapkan pendudukan pulau itu untuk memastikan bahwa Kepulauan Inggris dapat sepenuhnya berada di bawah kendali kami. Untuk ini komando tinggi kami telah menyusun Fall Grün sebagai rencana operasi yang rinci."
 GER_challenge_the_monroe_doctrine: "Tantang Doktrin Monroe"
 GER_challenge_the_monroe_doctrine_desc: "Meski jaraknya jauh dari kita, beberapa negara di Amerika Tengah dan Selatan secara ideologis sangat dekat dengan kita. Dengan menjalin dan menjaga hubungan baik dengan mereka, kita berdua bisa mendapatkan keuntungan yang besar. Selain itu, membangun pijakan di benua lain bisa menjadi hal yang sangat berharga di masa depan."
 GER_shatter_usas_hegemony: "Hancurkan [USA.GetAdjective] Hegemoni"
 GER_shatter_usas_hegemony_desc: "[USA.GetAdjective] telah lama diberi terlalu banyak kekuasaan di panggung internasional. Saat kita semakin kuat, sekarang saatnya bagi mereka untuk pindah."
 GER_challenge_the_monroe_doctrine_tt: "Membuka keputusan untuk §YMenggoyahkan Doktrin Monroe§!.\n\nMemberi tahu §Y[USA.GetNameDef]§! dan mengizinkan mereka untuk mencoba §RIntervensi§!."
 GER_challenge_the_monroe_doctrine_tt_2: "Setidaknya 7 Negara masih memiliki §YDoktrin Monroe§! aktif"
 GER_establish_protectorates_in_america: "Membangun Protektorat di Amerika"
 GER_establish_protectorates_in_america_desc: "Negara-negara di benua Amerika sudah terlalu lama diatur dengan cara yang tidak sejalan dengan cita-cita kita. Diperlukan reorganisasi skala penuh untuk meluruskan wilayah-wilayah ini setelah sekian lama pengelolaannya tidak optimal."
 GER_demands_to_sweden: "Tuntutan ke Swedia"
 GER_demands_to_sweden_desc: "Tambang baja di [SWE.GetNameDef] utara adalah aset penting bagi industri militer kita. Kita tidak bisa membiarkan kesempatan apakah kita bisa terus berdagang dengan [SWE.GetAdjective] atau tidak. Jalur perdagangan ini perlu diamankan secepatnya."
 GER_the_swiss_gold: "Emas Swiss"
 GER_the_swiss_gold_desc: "Mengingat [SWI.GetAdjective] telah memutuskan untuk tidak terlibat dalam konflik global apa pun untuk saat ini, hal ini memberikan peluang sempurna untuk perdagangan dan spionase. Kita harus memastikan untuk menempatkan petugas di negara mereka, serta menggunakannya secara maksimal ketika harus menyimpan emas yang telah kita peroleh."
 GER_secure_finland: "Amankan Finlandia"
 GER_secure_finland_desc: "[FIN.GetNameDefCap] memiliki perbatasan darat yang panjang dengan [SOV.GetNameDef]. Mendapatkan akses ke perbatasan ini memberi kita potensi front lain melawan Ancaman Merah di timur dan mungkin terbukti sangat berharga jika kita perlu melawan [SOV.GetAdjective]s"
 GER_befriend_china: "$GER_china_friend$"
 GER_befriend_china_desc: "$GER_china_friend_desc$"
 GER_befriend_japan: "$GER_japan_friend$"
 GER_befriend_japan_desc: "$GER_japan_friend_desc$"
 GER_reclaim_former_african_colonies: "Rebut Kembali Bekas Koloni Afrika"
 GER_reclaim_former_african_colonies_desc: "Asia bukanlah satu-satunya tempat di mana kita dulu memiliki kepemilikan yang kini telah hilang. Wilayah kami di Afrika masih menjadi kepentingan kami dan kami harus melakukan yang terbaik untuk mendapatkannya kembali dan mengintegrasikannya sekali lagi."
 GER_mittelafrika: "Mittelafrika"
 GER_mittelafrika_desc: "Terdapat lebih banyak wilayah di Afrika dibandingkan wilayah yang dulu kami miliki dan menjadi kepentingan kami. Dengan kekayaan alamnya yang melimpah, wilayah yang kami namai Mittelafrika akan mendapatkan manfaat yang sangat besar bagi [ROOT.GetNameDef]."
 GER_mittelafrika_revive_the_schutztruppe_tt: "Membuka §YSchutztruppe§! milisi kolonial dan keputusan untuk §YMerekrut§! dan §YMeningkatkan§! mereka di §YAfrika§!"
 GER_asia_revive_the_schutztruppe_tt: "Membuka §YSchutztruppe§! milisi kolonial dan keputusan untuk §YMerekrut§! dan §YMeningkatkan§! mereka di §YAsia§!"
 GER_re_establish_german_control_over_qingdao: "Membangun Kembali Kontrol Jerman atas Qingdao"
 GER_re_establish_german_control_over_qingdao_desc: "Pada tahun 1898 kami menegosiasikan hak sewa di Qingdao. Hak sewa tersebut dihentikan pada tahun 1914 oleh pendudukan [JAP.GetAdjective] tak lama setelah dimulainya Perang Besar. Karena wilayah tersebut tidak lagi diduduki, mungkin inilah saatnya kita mengingatkan mereka akan perjanjian tersebut."
 GER_claim_old_colonies_in_the_east: "Klaim Koloni Tua di Timur"
 GER_claim_old_colonies_in_the_east_desc: "Perjanjian Versailles melucuti wilayah jajahan kita dan membaginya ke negara-negara Sekutu. Masyarakat kami telah menjelaskan bahwa mereka, sama seperti kami, menganggap hal ini melanggar hukum. Sebagai bagian dari membangun hubungan diplomatik di Timur, kita juga harus mempertimbangkan upaya untuk mendapatkan kembali koloni kita."
 GER_ally_chiang_kai_shek: "Sekutu Chiang Kai-Shek"
 GER_ally_chiang_kai_shek_desc: "Usaha kami saat ini di Asia Timur terbukti bermanfaat tidak hanya bagi kami. Dengan bersekutu dengan [CHI.GetLeader] dari [CHI.GetNameDef] dan menyelaraskannya dengan kita, kita memperluas lingkup pengaruh kita dan memfasilitasi pertumbuhan kolonial di wilayah tersebut."
 GER_japanese_naval_cooperation: "Kerja Sama Angkatan Laut Jepang"
 GER_japanese_naval_cooperation_desc: "Kita harus banyak belajar dari [JAP.GetAdjective], khususnya mengenai masalah angkatan laut. Dengan membangun upaya teknologi bersama, kita dapat memastikan untuk memanfaatkan pengetahuan satu sama lain secara maksimal dan mengurangi jumlah waktu yang dihabiskan untuk menemukan kembali apa yang sudah dapat kita akses, sebagai kekuatan gabungan."
 GER_negotiate_old_colonies_in_the_east: "Negosiasikan Koloni Lama di Timur"
 GER_negotiate_old_colonies_in_the_east_desc: "Banyak wilayah kolonial kami di Asia Timur dirampas dari kami oleh [JAP.GetAdjective] selama Perang Besar. Karena kita sekarang secara aktif terlibat dalam perbaikan hubungan diplomatik, kita mungkin bisa mendapatkan kembali beberapa koloni ini melalui cara-cara diplomatik."
 GER_claim_old_colonies_in_the_east_tt: "Mengirim acara ke §YAnggota Fraksi§! dan §Y[CHI.GetNameWithFlag]§! meminta kendali atas bekas koloni [GER.GetAdjective] di §YAsia Tenggara§!. Jika mereka menolak, atau wilayah tersebut dikuasai oleh negara yang kami tidak anggap sebagai sekutu, dapatkan §Yclaims§! di negara-negara yang diperebutkan."
 GER_negotiate_old_colonies_in_the_east_tt: "Salah satu negara bagian berikut yang mereka kendalikan akan ditransfer ke kami:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[1070.GetName]§!"
 GER_sentinels_of_the_pacific: "Penjaga Pasifik"
 GER_sentinels_of_the_pacific_desc: "Pijakan kita di Pasifik pada umumnya belum berkembang dan tidak cocok untuk digunakan baik oleh Kriegsmarine kita sendiri maupun sekutu kita. Upaya yang signifikan harus dilakukan untuk memastikan infrastruktur angkatan laut yang memadai dibangun di wilayah-wilayah yang relevan di Pasifik."
 GER_sentinels_of_the_pacific_tt: "Setiap keadaan terkontrol berikut ini: §Y[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
 GER_create_asian_reichskommissariat: "Bentuklah Reichskommisariat Asia"
 GER_create_asian_reichskommissariat_desc: "Koloni biasa mempunyai banyak keuntungan, tapi Führer kita mempunyai rencana yang lebih besar lagi untuk koloni kita di Asia. Memberlakukan hukum kolonialnya harusnya bermanfaat bagi semua orang yang terlibat!"
 GER_south_east_asian_natural_wealth: "Kekayaan Alam Asia Tenggara"
 GER_south_east_asian_natural_wealth_desc: "Kawasan Asia Tenggara kaya akan sumber daya alam yang sangat bermanfaat bagi kita. Pemiliknya saat ini tidak mengembangkan lahan tersebut secara ideal, dan meskipun lahan tersebut tidak pernah menjadi milik kita, sentimen seperti itu tidak menghentikan negara-negara demokrasi untuk mencuri koloni yang merupakan hak kita, dan juga tidak akan menghentikan kita!"
 GER_south_east_asian_natural_wealth_tt: "Membuka §YKeputusan di Peta§! untuk meningkatkan wilayah Asia Tenggara"
 GER_the_proud_eagle_and_the_resurgent_dragon: "Elang Bangga dan Naga yang Bangkit"
 GER_the_proud_eagle_and_the_resurgent_dragon_desc: "Ancaman invasi [JAP.GetAdjective] terhadap teman-teman kita di [CHI.GetNameDef] terus membayangi kita. Tidak ada gunanya menunggu mereka menyerang secara pasif. Kita harus bersiap untuk berperang melawan prajurit [JAP.GetNameDef], di wilayah kita, atau wilayah mereka."
 GER_blitzkrieg_across_the_pacific: "Blitzkrieg Di Seluruh Pasifik"
 GER_blitzkrieg_across_the_pacific_desc: "Mengobarkan perang di Pasifik tidak seperti apa yang telah dilatih oleh sebagian besar pasukan kita. Selain itu, taktik kami mungkin memerlukan beberapa penyesuaian. Kami tidak percaya ini kelemahan, tapi justru kami pikir ini membuat kami lebih kuat. Pertahanan musuh dibangun berdasarkan apa yang mereka ketahui dan dengan merancang cara baru melancarkan perang di Pasifik, kita dapat mengejutkan mereka."
 GER_molotov_ribbentrop_pact: "$GER_mol_rib_pact$"
 GER_molotov_ribbentrop_pact_desc: "$GER_mol_rib_pact_desc$"
 GER_treaty_with_the_ussr: "$GER_soviet_treaty$"
 GER_treaty_with_the_ussr_desc: "$GER_soviet_treaty_desc$"
 GER_support_finland: "Dukung Finlandia"
 GER_support_finland_desc: "[FIN.GetAdjective] telah lama mengalami konflik mengenai [146.GetName] dengan [SOV.GetAdjective]s. Ketika ketegangan kini meningkat di wilayah tersebut, maka merupakan kepentingan terbaik kita untuk mendukung mereka, dan pada gilirannya mendekatkan mereka kepada kita."
 GER_alliance_with_the_ussr: "$GER_soviet_ally$"
 GER_alliance_with_the_ussr_desc: "$GER_soviet_ally_desc$"
 GER_war_with_the_ussr: "$GER_ussr_war_goal$"
 GER_war_with_the_ussr_desc: "$GER_ussr_war_goal_desc$"
 GER_puppet_turkey: "$GER_turkey_puppet$"
 GER_puppet_turkey_desc: "$GER_turkey_puppet_desc$"
 GER_befriend_turkey: "$GER_turkey_friend$"
 GER_befriend_turkey_desc: "$GER_turkey_friend_desc$"
 GER_influence_the_middle_east: "Mempengaruhi Timur Tengah"
 GER_influence_the_middle_east_desc: "Meskipun secara historis kita tidak memiliki banyak kesamaan dengan Timur Tengah, tidak ada yang dapat menyangkal bahwa kawasan ini mempunyai kepentingan bagi kita. Kita harus menyebarkan pengaruh kita di wilayah tersebut untuk memastikan bahwa kita mempunyai pengaruh diplomatik di wilayah tersebut, jika diperlukan."
 GER_the_final_blow_to_communism: "Pukulan Terakhir terhadap Komunisme"
 GER_the_final_blow_to_communism_desc: "Berurusan dengan [SOV.GetNameDef] bukanlah akhir dari perjuangan kita melawan komunisme di Eropa. Selama negara-negara komunis masih ada di sekitar kita, kita harus terus berjuang. Kita tidak bisa beristirahat sampai ancaman merah sepenuhnya dilenyapkan!"
 GER_war_against_communism_tt: "Dapatkan §YAnnex§! tujuan perang melawan negara §YKomunis§! mana pun di dunia. Target saat ini:"
 GER_war_against_european_communism_tt: "Dapatkan §YAnnex§! tujuan perang melawan negara §YKomunis§! di §YEropa§!. Target saat ini:"
 GER_crossing_the_atlantic_dockyards_tt: "Tambahkan §Y2 $dockyard$s§! di negara-negara pesisir Eropa yang sepenuhnya dikendalikan oleh [ROOT.GetNameWithFlag], hapus §Y1 $arms_factory$§! per galangan kapal yang dibangun.\n(Efek berlaku untuk maksimum [?crossing_the_atlantic_max_states_for_dockyards|Y0] negara bagian yang memprioritaskan negara bagian pesisir dengan setidaknya satu $arms_factory$ di dalamnya)"
 #INNER CIRCLE
 GER_inner_circle_member_title: "Reichsleiter"
 GER_ascension_of_todt: "$GER_inner_circle_member_title$ Todt"
 GER_ascension_of_todt_desc: "Sebagai seorang insinyur terampil dengan pengalaman militer, Fritz Todt telah terbukti menjadi penasihat yang kompeten bagi Führer. Jika diberi kebebasan relatif untuk bertindak, kami yakin dia akan sangat berguna bagi [ROOT.GetNameDef]."
 GER_ascension_of_speer: "$GER_inner_circle_member_title$ Speer"
 GER_ascension_of_speer_desc: "Sebagai seorang arsitek terlatih, Albert Speer memiliki keterampilan yang paling berharga bagi kelangsungan kemakmuran negara. Dengan memberinya kebebasan relatif untuk bertindak, kita dapat memperoleh manfaat dari keahliannya dan kontaknya dengan pemain besar di industri konstruksi [ROOT.GetAdjective]."
 GER_ascension_of_goring: "$GER_inner_circle_member_title$ Goering"
 GER_ascension_of_goring_desc: "Seorang komandan yang terampil mendapat tempat tertentu di Lingkaran Dalam Führer. Karena Hermann Göring bukan hanya seorang komandan yang terampil tetapi juga kaki tangan Führer dalam jangka panjang, memberinya kebebasan relatif untuk bertindak seharusnya menunjukkan sedikit risiko dan banyak imbalan."
 GER_ascension_of_goebbels: "$GER_inner_circle_member_title$ Goebbels"
 GER_ascension_of_goebbels_desc: "Sang Führer selalu mempunyai ruang di lingkaran terdalamnya bagi orang-orang yang dapat membantunya mempertahankan dukungan rakyat. Sebagai pengikut dekat dan pembicara publik yang terampil, memberikan kebebasan relatif kepada Joseph Goebbles untuk bertindak terbukti sangat bermanfaat bagi kita."
 GER_rally_the_industrialists: "Kumpulkan para Industrialis"
 GER_rally_the_industrialists_desc: "Kaum industrialis memegang kekuasaan yang signifikan di negara kita. Mengumpulkan mereka ke pihak kita akan menjadi sebuah investasi waktu, namun Rudolf Hess telah meyakinkan kita bahwa investasi tersebut layak untuk dilakukan."
 GER_glorify_party_rallies: "Muliakan Demonstrasi Partai"
 GER_glorify_party_rallies_desc: "Tanpa inti politik kita, negara ini akan goyah. Martin Bormann telah mengingatkan bahwa Rapat Umum Partai kita dapat ditingkatkan untuk mendapatkan lebih banyak dukungan dari masyarakat, dan dengan demikian memungkinkan kita untuk bertindak lebih bebas dalam hal bagaimana pemerintah berkumpul."
 GER_total_control_over_domestic_affairs: "Kontrol Total Atas Urusan Dalam Negeri"
 GER_total_control_over_domestic_affairs_desc: "Prospek untuk sepenuhnya melepaskan urusan dalam negeri kita dan membiarkan Rektor Partai yang menanganinya mungkin tampak sebagai langkah yang berani. Namun sang Führer yakin. Tugas-tugas yang diemban Rektor Partai selama ini terlaksana jauh di luar ekspektasi dan [ROOT.GetLeader] merasa tenang menyerahkan hal tersebut kepada beliau, untuk fokus pada hal-hal yang lebih penting."
 GER_fuhrerprinzip_inner_circle_tt: "Mengaktifkan Mekanik §YLingkaran Dalam§!."
 GER_rally_the_industrialists_hess_tt: "Akan mencegah terjadinya rantai peristiwa §Y$germany.107.t$§!."
 GER_wunderwaffe_dornberger_trait_tt: "§Y$GER_walter_dornberger$§! ($high_command$):\nGanti sifat §Y$GER_head_of_the_missile_department$§! dengan §Y$GER_head_of_experimental_weapons$§! Perubahan efektif:\nKonsumsi Pasokan Fasilitas: §G-10.00§!\n$specialization_naval_speed_factor$: §G+10%§!\n$specialization_nuclear_speed_factor$: §G+10%§!"
 GER_rally_the_industrialists_hess_stays_tt: "Mencegah §Y$GER_rudolf_hess$§! melakukan penerbangan terkenalnya."
 unlock_decision_category_explained: "Membuka Keputusan §Y$CATEGORY$§!. $DESC$"
 GER_integration_of_puppet_economies_decisions_tt: "Keputusan-keputusan ini memungkinkan kita untuk mengembangkan atau mengeksploitasi perekonomian boneka kita."
 GER_a_strong_successor_trigger_tt: "Semua §Y3§! Ascended Advisor dalam §YLingkaran Dalam§! telah menyelesaikan fokus batu penjuru mereka."
 GER_a_strong_successor_tt: "Mendapat acara '§Y$GER_inner_circle.02.t$§!'.\nSalah satu dari $GER_inner_circle_member_title$ Ascended saat ini dalam §YLingkaran Dalam§! dapat menggantikan §Y[ROOT.GetLeader]§! sebagai Pemimpin Negara."
 GER_a_strong_successor_current_advisors_tt: "Penasihat Ascended Saat Ini: §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! atau §Y[GetAscendedAdvisorName3]§!."
 GER_focus_can_only_be_completed_by_advisor_tt: "Fokus ini hanya dapat dimulai pada §Y$CHARACTER$§! setelah menyelesaikan fokus §Y$FOCUS$§!."
 GER_focus_can_only_be_completed_by_advisor_multiple_tt: "Fokus ini hanya dapat dimulai pada §Y$CHARACTER$§! atau §Y$CHARACTER_2$§! setelah menyelesaikan fokus §Y$FOCUS$§! atau §Y$FOCUS_2$§!."
 GER_ascension_of_character_focus_tt: "§Y$CHARACTER$§! akan mulai mengerjakan fokus di cabangnya seiring berjalannya waktu."
 GER_ascension_of_character_tt: "§Y$CHARACTER$§! diangkat §YReichsleiter§! dan naik dalam §YLingkaran Dalam§! sebagai:"
 GER_ascended_character_trait_swap_tt: "§Y$CHARACTER$§! naik dalam §YLingkaran Dalam§!:"
 GER_total_control_over_domestic_affairs_chancellors_tt: "Berdasarkan Rektor Partai yang ditunjuk di lingkungan §YLingkaran Dalam§!:"
 GER_event_to_replace_ascended_advisor_tt: "Mendapatkan event '§YThe Rise of $CHARACTER$§!':\n§Y$CHARACTER$§! dapat menggantikan §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! atau §Y[GetAscendedAdvisorName3]§! di dalam §YLingkaran Dalam§!."
 replace_ascended_advisor_tt: "§RHapus dari§! §YLingkaran Dalam§!:\n§Y$CHARACTER$§! sebagai $TRAIT$"
 GER_stop_progress_on_advisor_focus_tt: "§Y$CHARACTER$§! akan berhenti bekerja pada fokus §Y$FOCUS$§!."
 GER_advisor_will_continue_focus_tt: "§Y$CHARACTER$§! berlaku dalam §YLingkaran Dalam§! dan akan terus bekerja pada fokus §Y$FOCUS$§!."
 GER_inner_circle_industrial_me_focuses_tt: "(Menyelesaikan fokus ini akan §Rlock§! §Y$FOCUS_1$§! dan §Y$FOCUS_2$§! untuk masing-masing $GER_inner_circle_member_title$s)"
 GER_intrigue_replacing_advisor_already_ascended_tt: "§Y$CHARACTER$§! menang dalam §YLingkaran Dalam§! dan akan mampu menyelesaikan fokus §Y$FOCUS$§!.\n\n§Y$CHARACTER_2$§! dan §Y$CHARACTER_3$§! tidak akan lagi berusaha untuk menyelesaikan fokus masing-masing yang saling eksklusif."
 GER_inner_circle_event_pending_flag: "Ada Acara §YLingkaran Dalam§! yang tertunda."
 GER_intrigue_replacing_advisor_new_ascending_tt: "§Y$CHARACTER$§! naik dalam §YLingkaran Dalam§! sebagai:\n$IDEA$\n§Y$CHARACTER$§! akan dapat menyelesaikan fokus §Y$FOCUS$§!.\n\n§Y$CHARACTER_2$§! dan §Y$CHARACTER_3$§! tidak akan lagi berusaha menyelesaikan fokus masing-masing yang saling eksklusif."
 GER_inner_circle_cd_flag: "Telah menunjuk §Y$GER_inner_circle_member_title$§! lainnya"
 GER_inner_circle_cd_days_tt: "Hari sampai §Y$GER_inner_circle_member_title$§! berikutnya dapat diangkat: [?GER_inner_circle_cd_flag:days_left|Y0]"
 GER_inner_circle_focus_in_progress_tt: "§Y$CHARACTER$§! sedang mengerjakan fokus ini.\nKemajuan: §Y$FLAG_DAYS$§!/[?temp_focus_days] hari"
 GER_industrialists_intrigue_prevailed_tt: "§Y$PREVAILED_CHARACTER$§! dipercaya memimpin upaya industri dan merupakan satu-satunya yang dapat bekerja pada fokus Saling Eksklusif."
 GER_inner_circle_title_text: "LINGKARAN DALAM"
 GER_inner_circle_hide_button_tt: "[!hide_button] BLABLA"
 GER_fuhrer_name_text: "§Y[ROOT.GetLeader]§!"
 GER_fuhrer_title_text: "Fuhrer"
 GER_fuhrer_title_text_female: "Fuhrerin"
 GER_ascended_advisor_1_name_text: "§Y[GetAscendedAdvisorName1]§!"
 GER_ascended_advisor_2_name_text: "§Y[GetAscendedAdvisorName2]§!"
 GER_ascended_advisor_3_name_text: "§Y[GetAscendedAdvisorName3]§!"
 GER_fuhrer_tooltip: "[GetFuhrerGenderedName] §Y[GetFuhrerName]§!."
 remove_character_as_tt: "§RHapus§! §Y$CHARACTER$§! sebagai §Y$ROLE$§!."
 GER_oppose_hitler_ww: "Kumpulkan Wehrmacht"
 GER_oppose_hitler_ww_desc: "Pemerintahan Hitler harus berakhir. Ia bermaksud memprovokasi negara-negara Barat dengan melakukan remiliterisasi di Rhineland, namun hal ini akan memberi kita alasan untuk merebut kekuasaan dengan bantuan elemen loyalis Wehrmacht, dan menggalang dukungan rakyat Jerman untuk menentangnya."
 GER_rally_the_nation: "Kumpulkan Bangsa"
 GER_rally_the_nation_desc: "Ada banyak orang di negara kita yang bersedia melawan Nazi karena kesempatan telah tiba. Kita harus menggalang dukungan rakyat, dan bahkan mungkin melakukan kontak dengan organisasi paramiliter yang memiliki pengalaman berperang melawan Nazi sejak masa Republik Weimar."
 GER_rally_the_nation_tt: "Kita akan dapat memilih semangat nasional yang harus §YDiubah§! atau §RDihapus§! setelah berakhirnya Perang Saudara."
 GER_denazification_campaigns: "Kampanye Denazifikasi"
 GER_denazification_campaigns_desc: "Untuk benar-benar melepaskan diri dari penyakit Nazi yang telah menginfeksi jantung [GER.GetNameDef], kita harus melakukan upaya ekstensif untuk melakukan denazifikasi, dan menangkap Nazi atau mereka yang menyembunyikan mereka segera setelah kita mengetahuinya."
 GER_rebuild_the_nation_ww: "Membangun Kembali Bangsa"
 GER_rebuild_the_nation_ww_desc: "Kita harus memfokuskan semua upaya kita pada rekonstruksi cepat jika kita ingin pulih dari kehancuran akibat Nazi. Sementara itu, masyarakat harus hidup sederhana dan bekerja keras, namun mereka pasti akan melakukannya dengan harapan akan hari esok yang lebih baik."
 GER_revitalize_the_nation: "Merevitalisasi Bangsa"
 GER_revitalize_the_nation_desc: "Setelah kerusakan akibat Perang Saudara, kita harus berupaya membangun kembali negara kita. Kami akan meminta masyarakat untuk mengesampingkan kenyamanan pribadi mereka untuk sementara waktu, sehingga kami dapat memfokuskan semua sumber daya kami untuk mencapai tujuan ini."
 GER_rebuild_the_nation_ww_tt: "Membuka Keputusan: §Y$GER_public_works_modifier$§!"
 GER_tend_to_the_future_of_germany: "Cenderung Masa Depan Jerman"
 GER_tend_to_the_future_of_germany_desc: "Kini setelah Jerman berhasil diselamatkan dari Nazi, kita harus menatap cakrawala baru, dan menentukan masa depan bangsa kita. Untuk persatuan, keadilan dan kebebasan!"
 GER_tend_to_the_future_of_germany_tt: "Segala upaya §YPemberontakan Separatis§! akan berhasil dielakkan"
 #COMMUNISM
 GER_start_the_proletarian_revolution: "Mulai Revolusi Proletar"
 GER_start_the_proletarian_revolution_desc: "Kami berharap setelah Perang Saudara pertama suara buruh akan lebih didengar. Namun tampaknya tidak demikian, proletariat berhak mendapatkan yang lebih baik, dan dengan membiarkan mereka bangkit, kita pada akhirnya bisa mengamankan kekuasaan bagi mereka yang berpihak pada proletariat, untuk selamanya."
 GER_start_the_proletarian_revolution_civil_war_tt: "Hal ini akan menyebabkan §RPerang Saudara§! jika waktu misi habis!"
 GER_states_with_proletarian_uprising_joins_cw_tt: "Negara-negara dengan pengubah §Y$GER_proletariat_uprising_modifier$§! akan bergabung dengan pihak §YKomunis§! jika terjadi Perang Saudara."
 GER_the_proletarian_revolution_flag: "Revolusi Proletar sedang berlangsung."
 GER_formalize_the_intelligence_wing: "Meresmikan Sayap Intelijen"
 GER_formalize_the_intelligence_wing_desc: "Negara ini sangat menderita di bawah pemerintahan yang tidak memikirkan kepentingan rakyatnya. Untuk memastikan kita dapat membangun kembali negara ini, pertama-tama kita harus mengetahui apa yang harus kita lakukan. Sayap Intelijen yang fungsional akan menjadi awal yang baik!"
 GER_propaganda: "Propaganda Nasional"
 GER_propaganda_desc: "Kita telah mengamati kekuatan propaganda sebelumnya dan tidak dapat menyangkal keefektifannya. Dengan mengalokasikan sumber daya untuk memperkuat dukungan bagi para pemimpin kita yang mulia, kita memastikan populasi kita tetap berada di tempat yang kita inginkan."
 GER_form_the_stasi: "Bentuk Stasi"
 GER_form_the_stasi_desc: "Sayap Intelijen telah sukses besar dan kami kini mulai mempertimbangkan kemungkinan untuk membentuk Kementerian yang menangani Keamanan Negara. Ini mungkin bukan keputusan yang paling populer di kalangan masyarakat, tapi ini adalah keputusan yang perlu."
 GER_effective_operations: "Operasi yang Efektif"
 GER_effective_operations_desc: "Seiring dengan pertumbuhan Stasi, kami harus memperluas wilayah operasinya. Misi yang dilakukan di luar perbatasan [ROOT.GetAdjective] sama pentingnya bagi keamanan negara kita dengan misi yang dimulai di dalam negeri."
 GER_assemble_red_orchestra: "Kumpulkan Orkestra Merah"
 GER_assemble_red_orchestra_desc: "Orkestra Merah bukanlah sebuah kelompok yang solid, melainkan hanya sejumlah orang yang berkumpul di sekitar beberapa individu yang memiliki banyak akal. Namun beberapa anggota organisasi ini adalah yang paling mahir, dan kita harus mempertimbangkan untuk merekrut mereka."
 GER_ressurect_the_red_front_fighters_league: "Bangkitkan kembali Liga Pejuang Front Merah"
 GER_ressurect_the_red_front_fighters_league_desc: "Liga Pejuang Front Merah adalah organisasi paramiliter yang berafiliasi dengan gerakan tersebut pada masa Republik Weimar. Di bawah rezim fasis, mereka dengan berani melawan polisi dan penindas lainnya. Dengan cara yang sama seperti yang biasa dilakukan oleh rezim lama kita, Pejuang Front Merah dilarang melakukan hal ini. Sudah waktunya kita membawa mereka kembali!"
 GER_spawn_more_communist_militias_in_civil_war_tt: "Jika §YPerang Saudara§! pecah lagi, buatlah §Y2 unit Jerman§! di tiga negara bagian inti yang terkena dampak §Y$GER_proletariat_uprising_modifier$§!"
 GER_ressurect_the_red_front_fighters_league_tt: "§Y2 Unit Milisi§! akan dibentuk di §Ytiga negara bagian acak§! yang saat ini dipengaruhi oleh §Y$GER_proletariat_uprising_modifier$§! atau dikendalikan oleh §Y[ROOT.GetAdjective] Komunis§!."
 GER_reorganize_nationale_volksarmee: "Reorganisasi Nationale Volksarmee"
 GER_reorganize_nationale_volksarmee_desc: "Korupsi dan sentimen fasis masih tertanam kuat di dalam tubuh tentara kita. Untuk mencegah perbedaan pendapat dan pemberontakan, kita harus menyingkirkan pihak-pihak yang ingin kita celaka. Hal ini akan meninggalkan kesenjangan yang besar dalam barisan kita, jadi untuk menjamin keselamatan rakyat kita, kita harus menunjuk jenderal-jenderal baru yang setia untuk memimpin prajurit kita yang gagah berani ke medan perang jika tindakan seperti itu diperlukan."
 GER_cannot_join_oppossing_civil_war_side_tt: "Karakter berikut tidak akan dapat bergabung dengan pihak lawan dalam potensi §YPerang Saudara§!:"
 GER_ensure_army_loyalty: "Pastikan Loyalitas Tentara"
 GER_ensure_army_loyalty_desc: "Ada orang-orang dalam jajaran kita yang masih bisa terpengaruh pada tujuan kita, dan bukan pada kebodohan yang terpaksa mereka patuhi. Hal ini memerlukan kerja keras, namun dengan menanamkan semangat komunal yang baik pada prajurit kita, kita dapat memastikan kesetiaan mereka selama bertahun-tahun yang akan datang."
 GER_political_commissars: "Komisaris Politik"
 GER_political_commissars_desc: "Ada orang-orang dalam jajaran kita yang masih bisa terpengaruh pada tujuan kita, dan bukan pada kebodohan yang terpaksa mereka patuhi. Kita harus menunjuk perwira yang mempunyai tanggung jawab untuk mendidik prajurit umum tentang manfaat komunisme dan mengorganisasi mereka untuk menjamin kesetiaan."
 GER_rapid_army_expansion: "Ekspansi Tentara yang Cepat"
 GER_rapid_army_expansion_desc: "Angkatan Darat kita tidak tumbuh pada tingkat yang sama seperti sebelumnya setelah adanya perubahan yang sangat kita butuhkan. Kita masih membutuhkan pasukan dalam jumlah besar untuk melindungi rakyat kita di dunia yang semakin bermusuhan. Dorongan mobilisasi dan pelatihan yang signifikan seharusnya bisa mengatasi masalah ini."
 GER_the_peoples_victory: "Kemenangan Rakyat"
 GER_the_peoples_victory_desc: "Rakyat telah berbicara, dan rakyat telah didengarkan. Pemerintahan kita yang lama dan korup telah menunjukkan tanda-tanda kelemahan dan kita harus memanfaatkan kesempatan ini untuk menuntut pengunduran diri mereka dan mengambil alih kekuasaan untuk diri kita sendiri, atas nama rakyat!"
 GER_legacy_of_the_spartacus_league: "Warisan Liga Spartacus"
 GER_legacy_of_the_spartacus_league_desc: "Liga Spartacus tidak ada lagi pada tahun 1919 ketika Kommunistische Partei Deutschlands dibentuk, tetapi beberapa gagasan mereka layak untuk dibawa kembali. Liga tersebut memiliki visi untuk menciptakan republik sosialis dengan basis pemilihan umum demokratis dan kehendak rakyat, namun tetap mengizinkan kelompok revolusioner jika diperlukan. Sudah saatnya kita berupaya mencapai tujuan ini sekali lagi."
 GER_social_ownership: "Kepemilikan Sosial"
 GER_social_ownership_desc: "Kita telah melihat apa yang terjadi ketika pelayanan-pelayanan penting negara dibiarkan dijalankan oleh orang-orang yang tujuannya tidak sejalan dengan apa yang terbaik bagi rakyat. Untuk mencegah hal ini terjadi lagi, kita harus mengalihkan industri kita ke dalam kepemilikan publik."
 GER_civil_liberties: "Kebebasan Sipil"
 GER_civil_liberties_desc: "Ada kesalahpahaman di kalangan kawan-kawan kita bahwa agar negara dapat berfungsi secara efisien dan aman, negara harus memaksa setiap individu untuk patuh. Namun hal ini bertentangan dengan tujuan sosialisme. Hanya melalui perlindungan kebebasan sipil masyarakat akan benar-benar setia kepada negara."
 GER_embrace_democratic_institutions: "Rangkullah Institusi Demokrat"
 GER_embrace_democratic_institutions_desc: "Demokrasi liberal tidak lebih dari sebuah front bagi kaum borjuis. Demokrasi sejati memerlukan kesetaraan ekonomi dan sosial. Oleh karena itu, kita sendirilah yang mempunyai posisi untuk sepenuhnya memasukkan keinginan rakyat ke dalam proses pemerintahan negara."
 GER_establish_volkskommissariats: "Membentuk Volkskomisariat"
 GER_establish_volkskommissariats_desc: "Pendudukan asing tidak dapat diterima, namun untuk membangun pemerintahan sah yang dipimpin oleh buruh di antara tetangga-tetangga kita yang baru dibebaskan, kita harus memikul tanggung jawab yang sulit dalam mengurus dan membimbing mereka menuju cita-cita sosialis."
 GER_establish_volkskommissariats_tt: "Membuka keputusan untuk §YMendirikan Volkskommissariats§! di §Ynegara tetangga§! saat ini dan di masa depan yang memiliki ideologi yang sama."
 GER_industrialize_volkskommissariats: "Industrialisasi Volkskommissariat"
 GER_industrialize_volkskommissariats_desc: "Penerapan tenaga kerja yang tidak efisien karena kurangnya peralatan menyebabkan industri-industri di Komisariat Volkskomisariat tertinggal dibandingkan rekan-rekan mereka yang [ROOT.GetAdjective]. Kita harus berinvestasi dalam skema industrialisasi untuk memperbaiki ketidakseimbangan ini."
 GER_industrialize_volkskommissariats_tt: "Membuka Keputusan untuk menetapkan §YUpaya Industrialisasi§! di §YVolkskommissariats§!"
 GER_protect_the_revolution: "Lindungi Revolusi"
 GER_protect_the_revolution_desc: "Meskipun beberapa orang melihat intervensi kami di luar negeri sebagai taktik untuk mendapatkan pengaruh, kami tahu bahwa misi kami adalah untuk melindungi kaum proletar bahkan di luar perbatasan kami. Untuk melakukan hal ini, kami harus memiliki kemampuan untuk bertindak di luar batas normal yang dapat diterima secara internasional."
 GER_protect_the_revolution_tt: "Membuka keputusan untuk §YMenuntut Subjugasi§! dari §Ynegara tetangga§! di mana Perang Saudara dipicu oleh [ROOT.GetNameDef]"
 GER_instill_german_discipline: "Tanamkan Disiplin Jerman"
 GER_instill_german_discipline_desc: "Melihat pasukan Volkskommissariat, sangat jelas terlihat bahwa mereka tidak memiliki standar disiplin dan efisiensi yang [ROOT.GetAdjective]. Kita harus mendidik mereka dalam hal ini sehingga mereka dapat bertahan lebih baik dari musuh-musuh kita."
 GER_integrate_subjects_economies: "Integrasikan Ekonomi Subjek"
 GER_integrate_subjects_economies_desc: "Perekonomian Volkskommissariat telah mencapai kemajuan besar di bawah pengawasan kami. Untuk lebih memaksimalkan efisiensi, kita akan mengintegrasikan industri-industri kita ke dalam satu blok ekonomi."
 GER_current_future_volkskommisariats_tt: "Semua §YVolkskommissariats§! saat ini dan yang akan datang:"
 GER_integrate_volkskommissariats: "Integrasikan Volkskommissariat"
 GER_integrate_volkskommissariats_desc: "Volkskommissariat dimaksudkan untuk membimbing masyarakat Eropa yang telah dibebaskan menuju sosialisme. Namun, seiring dengan saling terkaitnya perekonomian dan budaya kita, muncullah rasa identitas baru yang mendukung perluasan makna menjadi [ROOT.GetAdjective]. Mulai sekarang, kita adalah satu bangsa, satu negara."
 GER_integrate_volkskommissariats_tt: "Membuka Keputusan untuk §YMengintegrasikan Volkskommissariats§!. Setelah §Y[ROOT.GetNameWithFlag]§! mengintegrasikan §YVolkskommissariat§! pertama, negara tersebut akan dikenal sebagai §Y$GER_german_socialist_union_communism$§!"
 GER_expand_social_welfare: "Memperluas Kesejahteraan Sosial"
 GER_expand_social_welfare_desc: "Setelah Perang Besar, kita mulai mengembangkan sistem kesejahteraan yang memberikan manfaat bagi masyarakat, namun sistem ini menjadi lebih terbatas setelah Depresi Besar. Kita harus mengerahkan sumber daya untuk membangun kembali lembaga ini dan menjadikannya sebagai lencana kehormatan bagi setiap orang Jerman, dan membuktikan kepada dunia keunggulan Komunisme."
 GER_liberate_austria: "Bebaskan Austria"
 GER_liberate_austria_desc: "Tetangga kami di wilayah selatan telah lama hidup dalam kondisi yang sangat buruk bagi masyarakatnya. Meskipun mereka menyebut negara lain sebagai rumah mereka, kami memiliki banyak kesamaan, dan bahkan berbagi bahasa. Untuk yang terbaik dari orang-orang [AUS.GetAdjective] kami akan menyampaikan permintaan, bukan, tawaran untuk bergabung dengan kami!"
 GER_spark_the_flame_of_revolution: "Kobarkan Api Revolusi"
 GER_spark_the_flame_of_revolution_desc: "Situasi para pekerja di negara-negara tetangga tidak sebaik yang kita harapkan. Dalam jangka panjang, revolusi bersenjata di negara-negara ini tidak dapat dihindari, namun untuk saat ini, kita harus berusaha untuk setidaknya menyebarkan berita komunisme di negara-negara tersebut."
 GER_spark_the_flame_of_revolution_tt: "Membuka keputusan untuk §YMeningkatkan Sentimen Komunis§! di §Ynegara tetangga kecil§!. Ketika komunis mendapat dukungan mayoritas di negara yang terkena dampak, maka §YPerang Saudara§! akan mengubah negara menjadi §YKomunis§! akan pecah."
 GER_proletarian_international_alliance: "Proletar Internasional"
 GER_support_the_proletarian_uprising: "Mendukung Pemberontakan Proletar"
 GER_support_the_proletarian_uprising_desc: "Ketika kita memperkirakan akan terjadi peningkatan tajam dalam jumlah Perang Saudara di sekitar kita, kita harus memperbarui sikap kita mengenai cara terbaik untuk mendukung para pekerja yang memberontak. Para pekerja ini mungkin tidak siap menghadapi upaya semacam itu, dan dengan memastikan bahwa mereka setidaknya mempunyai perlengkapan yang baik, kita dapat memastikan bahwa gelombang merah akan menyebar ke seluruh wilayah kita di Eropa."
 GER_support_the_proletarian_uprising_tt: "Membuka §YKeputusan§! untuk mengirim §YPeralatan Infanteri§! ke negara-negara yang saat ini dilanda Perang Saudara sebagai akibat dari §Y[ROOT.GetAdjective]§! yang memperkuat sentimen §YKomunis§!."
 GER_the_proletarian_legion: "Legiun Proletar"
 GER_the_proletarian_legion_desc: "Kita harus bertanggung jawab atas pemberontakan yang telah kita mulai. Kaum proletar di negara-negara yang kini dilanda Perang Saudara memerlukan bantuan kita untuk mengakhiri rezim korup mereka sesegera mungkin. Kita harus mempertimbangkan untuk mengirim pasukan untuk membantu mereka!"
 GER_the_proletarian_legion_tt: "Setelah §YNegara§! yang §Y[ROOT.GetNameWithFlag]§! telah mendorong §YKomunisme§! memasuki §YPerang Saudara§!:"
 GER_strengthen_the_proletarian_international: "Memperkuat Internasional Proletar"
 GER_strengthen_the_proletarian_international_desc: "Ketika para pekerja di negara-negara tetangga kami bangkit untuk memperjuangkan hak-hak mereka, kami melihat banyak peluang untuk memperkuat posisi kami sebagai aliansi yang dapat diandalkan. Dengan mengundang negara-negara Komunis yang baru didirikan ini ke dalam Internasional Proletar, kita semua bisa menjadi lebih kuat."
 GER_strengthen_the_proletarian_international_tt: "Setiap negara di §YEropa§! yang §Y[GER.GetNameWithFlag]§! telah mempengaruhi §YKomunisme§! akan diundang ke §YProletar Internasional§!. Dampak ini akan berlaku pada negara-negara yang terpengaruh Komunisme §Ysetelah fokus ini diambil§! juga."
 GER_proletarian_solidarity: "Solidaritas Proletar"
 GER_proletarian_solidarity_desc: "Kami telah meluangkan banyak waktu dan sumber daya untuk upaya kami mengarahkan Eropa ke jalur Komunisme. Bukankah adil jika kita memetik manfaat dari kerja kita sekarang?"
 GER_proletarian_solidarity_decision_tt: "Membuka Keputusan: §YMendorong Solidaritas Proletar§! untuk meningkatkan perdagangan sumber daya dengan negara-negara [GER.GetName] telah membantu mengubah menjadi Komunis"
 GER_liberate_italy: "Bebaskan Italia"
 GER_liberate_italy_desc: "[ITA.GetAdjective] telah lama menderita di bawah kekuasaan [ITA.GetLeader]. Dahulu mereka adalah sekutu pemerintah kita sebelumnya, dan sekarang kita sudah berubah menjadi lebih baik, sudah menjadi tugas kita untuk mengajak mereka ikut bersama kita!"
 GER_the_end_to_fascist_europe: "Akhir dari Eropa Fasis"
 GER_the_end_to_fascist_europe_desc: "Bahkan saat ini masih ada negara-negara di Eropa yang tunduk pada kekuasaan Fasis. Karena kita sangat menyadari tekanan yang ditimbulkan terhadap populasi, kita harus memastikan bahwa negara-negara ini segera dibebaskan!"
 GER_bypass_end_to_fascist_europe_tt: "Bukan: Negara lain mana pun:\nIbu Kota Negara: Berada di §YEropa§! Partai yang berkuasa saat ini adalah §YFasis§!." #The indentations are there so the tt looks correct
 GER_war_against_fascism_tt: "Dapatkan §YAnnex§! tujuan perang melawan negara §YFasis§! di §YEropa§! yang [GER.GetNameDef] belum mempunyai tujuan perang. Efek saat ini:"
 GER_red_europe: "Eropa Merah"
 GER_red_europe_desc: "Kita tidak bisa membatasi upaya kita untuk mendorong para pekerja mengangkat senjata dan mengibarkan bendera merah ke negara-negara tetangga terdekat kita. Kita harus menyebarkan revolusi proletar ke seluruh Eropa!"
 GER_spark_the_flame_of_revolution_red_europe_tt: "Membuka keputusan untuk §YMeningkatkan Sentimen Komunis§! di §Ynegara-negara kecil di Eropa§!. Ketika komunis mendapat dukungan mayoritas di negara yang terkena dampak, maka §YPerang Saudara§! akan mengubah negara menjadi §YKomunis§! akan pecah."
 GER_root_out_imperialism: "Singkirkan Imperialisme"
 GER_root_out_imperialism_desc: "Akar imperialisme tumbuh jauh di dalam tanah Afrika dan Asia, membelenggu para pekerja di sana. Orang-orang ini sudah terlalu lama menderita di bawah kolonialisme. Kita harus mengakhiri eksploitasi dan memberikan sarana kepada massa tertindas untuk bangkit, mengambil nasib mereka, dan mengalihkan perhatian musuh-musuh kita."
 GER_root_out_imperialism_tt: "Membuka §YKeputusan§! untuk meningkatkan perlawanan dan perolehan otonomi di negara-negara §YAfrika§! dan §YAsia§!."
 GER_strengthen_the_proletarian_international_internationally_tt: "Setiap negara §Ydi luar Eropa§! yang §Y[GER.GetNameWithFlag]§! telah mempengaruhi §YKomunisme§! akan diundang ke §YProletar Internasional§!. Dampak ini akan berlaku pada negara-negara yang terpengaruh Komunisme §Ysetelah fokus ini diambil§! juga."
 GER_hegemony_over_europe: "Hegemoni atas Eropa"
 GER_hegemony_over_europe_desc: "Eropa yang lama dan imperialis sedang runtuh. Kita akan membangun sebuah tatanan sosialis baru sebagai gantinya, dan para pekerja di Eropa berharap kita dapat memimpin mereka melawan tirani borjuis. Kemenangan proletar akan membangun hegemoni kami di seluruh benua."
 GER_war_against_major_countries_in_europe_tt: "Dapatkan §YAnnex§! tujuan perang melawan semua negara §YMayor§! yang menguasai setidaknya satu negara bagian di §YEropa§!. Efek saat ini:"
 GER_align_south_america: "Sejajarkan Amerika Selatan"
 GER_align_south_america_desc: "Para pekerja di Amerika Selatan sudah cukup lama menderita di bawah kuk kapitalisme. Mengajak mereka mendukung tujuan kita pasti akan menghasilkan sekutu yang kuat di seluruh benua"
 GER_communist_propaganda_south_america_decision_tt: "Membuka keputusan untuk §YMeningkatkan Sentimen Komunis§! di §Ynegara-negara kecil di Amerika Selatan§!. Ketika komunis mendapat dukungan mayoritas di negara yang terkena dampak, maka §YPerang Saudara§! akan mengubah negara menjadi §YKomunis§! akan pecah."
 GER_wage_war_on_capitalism: "Melancarkan Perang Melawan Kapitalisme"
 GER_wage_war_on_capitalism_desc: "Kapitalisme adalah musuh alami Komunisme dan harus dibongkar dengan kekerasan jika diperlukan. Kami akan memimpin dakwaan terhadap [USA.GetNameDef], yang merupakan simbol kapitalisme, yang membuka jalan bagi era sosialis baru."
 GER_instigate_middle_eastern_revolutions: "Menghasut Revolusi Timur Tengah"
 GER_instigate_middle_eastern_revolutions_desc: "Timur Tengah telah lama ditindas oleh kekuatan asing dan sudah siap untuk melakukan revolusi sosialis. Kita harus menggugah keinginan rakyat untuk akhirnya terbebas dari eksploitasi dan mengibarkan bendera merah sosialisme."
 GER_communist_propaganda_middle_east_decision_tt: "Membuka keputusan untuk §YMeningkatkan Sentimen Komunis§! di §Ynegara-negara kecil di Timur Tengah§!. Ketika komunis mendapat dukungan mayoritas di negara yang terkena dampak, maka §YPerang Saudara§! akan mengubah negara menjadi §YKomunis§! akan pecah."
 GER_intervene_in_spain: "Intervensi di Spanyol"
 GER_intervene_in_spain_desc: "Adalah tugas kita untuk membantu kawan-kawan kita di Spanyol dengan cara apapun yang kita bisa melawan kekuatan Fasisme. Mengirim pasukan yang tangguh dalam pertempuran pasti akan dihargai."
 GER_assist_our_eastern_comrades: "Bantulah Kamerad Timur Kita"
 GER_assist_our_eastern_comrades_desc: "Perjuangan rekan-rekan kita di Timur Jauh telah membuahkan hasil. Kita harus meringankannya sebaik mungkin. Mengirim pasukan yang tangguh dalam pertempuran mungkin akan mengubah nasib mereka."
 GER_strike_at_the_rising_sun: "Serang Matahari Terbit"
 GER_strike_at_the_rising_sun_desc: "[JAP.GetNameDefCap] tetap menjadi benteng imperialisme, menindas siapapun yang menginginkan kesetaraan dan sosialisme. Sudah saatnya Jepang tunduk dan menerima tatanan dunia proletar yang baru."
 GER_nationalize_industries: "Nasionalisasi Industri"
 GER_nationalize_industries_desc: "Setelah melihat hasil positif dari sentralisasi perekonomian negara, kita mungkin mempertimbangkan hal yang sama untuk industri kita. Saat ini, industri ini terbagi di bawah banyak pemilik swasta, menggunakan proses dan metode berbeda dalam memproduksi barang-barang mereka. Nasionalisasi industri akan memberikan kita kontrol yang lebih besar terhadap output dan efisiensi produksi."
 GER_form_agricultural_cooperatives: "Membentuk Koperasi Pertanian"
 GER_form_agricultural_cooperatives_desc: "Sektor pertanian adalah salah satu sektor terpenting bagi kami. Beberapa industri bergantung pada buruh tani dan pekerjaan mereka, dan membiarkan mereka bekerja sendiri bukanlah tindakan yang bertanggung jawab. Dengan membentuk koperasi kita dapat memastikan bahwa sektor pertanian bekerja sama secara terpadu, dengan efisiensi maksimal dan kerugian minimal."
 GER_effectivize_the_volkswerke: "Efektifkan Volkswerke"
 GER_effectivize_the_volkswerke_desc: "Apa yang disebut Volkswerke adalah salah satu dari sedikit gagasan yang dimiliki para pendahulu kita. Sebagai konglomerat industri yang dikendalikan oleh negara yang mengawasi pertumbuhan dan produksi dalam industri pertambangan dan baja, Volkswerke layak menerima semua perbaikan yang dapat kita lakukan."
 GER_womens_rights_and_equality: "Hak dan Kesetaraan Perempuan"
 GER_womens_rights_and_equality_desc: "Gender telah lama menjadi faktor penentu di mana seseorang diharapkan untuk mengabdi pada negaranya, baik di garis depan, di pabrik, atau di dalam negeri. Dengan menerapkan pembagian beban yang lebih setara, kita memungkinkan adanya angkatan kerja yang lebih besar, dan angkatan bersenjata yang lebih besar, jika diperlukan."
 GER_locks_women_in_workforce_decision_tt: "Keputusan §Y$women_in_the_workforce$§! menjadi §Ytidak tersedia§!"
 GER_labor_rights_and_union_stuff: "Mendirikan Serikat Pekerja"
 GER_labor_rights_and_union_stuff_desc: "Mengizinkan pekerja untuk berserikat untuk bersama-sama menyuarakan keprihatinan mereka dan menetapkan kondisi kerja mereka telah lama diabaikan di negara kita. Pada waktunya negara tidak hanya mengizinkan namun juga mendorong pembentukan serikat pekerja!"
 GER_proletarian_dictatorship: "Kediktatoran Proletar"
 GER_proletarian_dictatorship_desc: "Untuk memberikan peluang dan standar hidup terbaik bagi rakyat kita, kita harus memastikan kepemimpinan yang stabil dan selaras dengan rakyat dan kebutuhan mereka. Sebagai seorang pejuang proletariat sejak lama, [ROOT.GetLeader] memenuhi semua kualifikasi dan telah terbukti memberikan yang terbaik bagi kaum buruh."
 GER_state_controlled_economy: "Perekonomian yang Dikendalikan Negara"
 GER_state_controlled_economy_desc: "Perekonomian kita terlalu rapuh untuk diserahkan kepada orang-orang yang tidak tahu cara terbaik mengelolanya. Untuk menghindari krisis ekonomi yang berdampak jangka panjang pada rakyat kita, negara harus mengambil alih perekonomian kita."
 GER_central_planning: "Perencanaan Pusat"
 GER_central_planning_desc: "Karena perekonomian kita sekarang berada di tangan negara, maka sudah sepantasnya perencanaan perekonomian kita juga dipusatkan. Hanya mereka yang memiliki gambaran umum mengenai perekonomian suatu negara yang dapat diharapkan dapat mengambil keputusan terbaik mengenai di mana berinvestasi, dan bagaimana cara terbaik mendistribusikan sumber daya."
 GER_the_german_stakhanovite_movement: "Gerakan Stakhanovite Jerman"
 GER_the_german_stakhanovite_movement_desc: "Gerakan Stakhanovite dimulai pada [SOV.GetName] di bawah pemerintahan komunis ketika para pekerja mulai bangga bekerja lebih keras dan menghasilkan lebih dari apa yang diharapkan dari mereka. Gerakan ini meroketkan produksi dan memberi para pekerja kesadaran akan tujuan yang lebih kuat. Kita harus mempertimbangkan untuk mendorong sentimen serupa di [ROOT.GetNameDef]."
 GER_the_german_stakhanovite_movement_tt: "Dengan menyelesaikan §Y$GER_establish_the_reichswerke$§! atau §Y$GER_invest_in_vereinigte_stahlwerke$§! fokus ini akan mengubah jumlah sumber daya yang diperoleh sebesar §G5%§!."
 GER_spheres_of_influence: "Lingkup Pengaruh"
 GER_spheres_of_influence_desc: "Dengan dua negara yang memiliki pemikiran serupa dan berada dalam jarak yang begitu dekat, kita harus menetapkan kondisi yang setara bagi kita dan [SOV.GetAdjective]. Dengan menetapkan wilayah pengaruh dan menetapkan wilayah pengaruh untuk kawan-kawan kita di wilayah timur, kita membatasi risiko konflik bersenjata."
 GER_spheres_of_influence_tt: "Kami dan §Y[SOV.GetNameWithFlag]§! Akan membentuk Lingkungan Pengaruh kami di §YEropa§!.\n\n§YLingkungan Pengaruh kami§! akan meliputi:\n§Y[SWE.GetNameWithFlag]\n[NOR.GetNameWithFlag]\n[DEN.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Barat)\n§Y[CZE.GetNameWithFlag]§! (Barat)\n§Y[HUN.GetNameWithFlag]§!\n\n§YLingkungan Pengaruhnya akan termasuk§!:\n§Y[FIN.GetNameWithFlag]\n[EST.GetNameWithFlag]\n[LAT.GetNameWithFlag]\n[LIT.GetNameWithFlag]\n[SLO.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Timur)\n§Y[ROM.GetNameWithFlag]\n[BUL.GetNameWithFlag]\n[YUG.GetNameWithFlag]§!"
 GER_czechoslovakia: "Bebaskan Pekerja di [CZE.GetName]"
 GER_czechoslovakia_desc: "Tepat di seberang perbatasan sebelah selatan, di [CZE.GetNameDef], masih ada pekerja yang perlu dibebaskan dari belenggu kapitalisme. Mereka belum sepenuhnya memahami bentuk komunisme yang benar dan kita harus memastikan untuk mewujudkannya kepada mereka, dengan cara apa pun yang diperlukan. Itulah tugas kita sebagai kawan yang baik."
 GER_poland: "Lindungi [POL.GetAdjective] Proletariat"
 GER_poland_desc: "Kaum proletar di [POL.GetNameDef] belum menikmati hak yang sama dengan para pekerja [ROOT.GetAdjective] kita. Ketika mereka gagal berkembang di bawah kepemimpinan mereka saat ini, mungkin inilah saatnya kita mengambil tindakan untuk membebaskan dan melindungi mereka."
 GER_hungary: "Akhiri Penindasan terhadap [HUN.GetAdjective] Pekerja"
 GER_hungary_desc: "Pekerja di [HUN.GetNameDef] masih memperjuangkan hak-hak yang seharusnya menjadi dasar. Pemerintah di negara ini jelas-jelas gagal melihat kebutuhan mereka dan oleh karena itu, kita harus turun tangan untuk memastikan bahwa kaum proletar di seluruh [HUN.GetName] diperlakukan secara adil dan dengan rasa hormat yang layak mereka dapatkan."
 GER_the_northern_shield: "Perisai Utara"
 GER_the_northern_shield_desc: "Negara-negara Nordik kaya akan sumber daya, namun meskipun ada upaya untuk menyatukan pekerja, kaum proletar masih menderita di bawah kepentingan kapitalis. Kami percaya bahwa para pekerja tidak hanya berhak mendapatkan yang lebih baik, namun kami juga dapat memanfaatkan sumber daya ini dengan lebih baik. Eksploitasi pekerja di Nordik harus diakhiri!"
 GER_sign_the_second_treaty_of_berlin: "Menandatangani Perjanjian Berlin Kedua"
 GER_sign_the_second_treaty_of_berlin_desc: "Kami sadar akan pasukan kami yang cukup besar, namun kami juga sadar bahwa [SOV.GetNameDef] mempunyai pasukan yang tidak ingin kami lawan. Dengan menjangkau dan memastikan bahwa kita mempunyai pemikiran yang sama untuk menghindari permusuhan, kita dapat memastikan masa depan yang lebih baik bagi semua pekerja di negara kita masing-masing."
 GER_defense_treaty_with_the_soviet: "Perjanjian Pertahanan dengan Soviet"
 GER_defense_treaty_with_the_soviet_desc: "Sekarang kita telah sepakat dengan [SOV.GetAdjective] untuk tidak terlibat dalam permusuhan, kita harus mempertimbangkan untuk mengambil hubungan diplomatik selangkah lebih maju. Kami menganggap mereka layak mendapatkan perlindungan kami, dan kami berasumsi, bahwa mereka juga akan merasakan hal yang sama, dan bahwa perjanjian pertahanan bersama akan bermanfaat bagi kepentingan mereka dan juga bagi kepentingan kita."
 GER_industrial_cooperation: "Kerja Sama Industri"
 GER_industrial_cooperation_desc: "Kerja sama kami dengan [SOV.GetAdjective] sejauh ini hanya terbatas pada urusan militer. Mengingat [SOV.GetNameDef] adalah sekutu kami, masuk akal jika kami juga bekerja sama di bidang lain. Filosofi industri kita sudah cukup mirip sehingga upaya bersama di sektor industri tidak akan sulit untuk dicapai."
 GER_tech_sharing: "Berbagi Teknologi Industri"
 GER_tech_sharing_desc: "Berbagi teknologi di antara kita dan negara-negara lain yang berpikiran sama harus menjadi sesuatu yang kita perjuangkan. Menjangkau [SOV.GetAdjective] untuk upaya ini tampaknya merupakan tindakan yang paling rasional."
 GER_resource_trade: "Perdagangan Sumber Daya"
 GER_resource_trade_desc: "Meskipun kita berusaha untuk dapat menghidupi diri kita sendiri sebanyak mungkin, kita harus membiarkan diri kita berdagang dengan negara-negara yang memiliki cita-cita yang sama dengan kita. Dengan menawarkan [SOV.GetNameDef] sejumlah kompensasi dalam bentuk kapasitas industri, kita seharusnya bisa mendapatkan kesepakatan yang sangat menguntungkan dengan mereka."
 GER_factories_for_resources: "Pabrik untuk Sumber Daya"
 GER_factories_for_resources_desc: "Kami memiliki banyak sekali industri sipil di [ROOT.GetNameDef] yang dapat dimanfaatkan dengan lebih baik. Kami menyadari bahwa [SOV.GetNameDef] masih tertinggal di beberapa daerah, dan kebetulan daerah tersebut juga seringkali kaya dengan sumber daya yang berharga. Proposisi untuk merelokasi beberapa industri dengan imbalan sebagian dari sumber daya ini dapat menjadi peluang yang menguntungkan bagi kita."
 GER_factories_for_resources_tt: "Membuka §YKeputusan§! untuk merelokasi industri ke §Y[SOV.GetNameWithFlag]§! dengan imbalan sumber daya."
 #NON-ALIGNED/DEMOCRATIC
 GER_monarchist_sentiment: "Sentimen Monarki"
 GER_monarchist_sentiment_desc: "Rakyat menginginkan monarki, dan itulah yang akan mereka dapatkan. Meskipun bentuk spesifik pemerintahan belum diputuskan, namun jelas bahwa rakyat Jerman membutuhkan Kaiser mereka kembali."
 GER_the_monarchy_compromise_ww: "$GER_the_monarchy_compromise$"
 GER_the_monarchy_compromise_ww_desc: "$GER_the_monarchy_compromise_desc$"
 GER_re_establish_free_elections_ww: "$GER_reestablish_free_elections$"
 GER_re_establish_free_elections_ww_desc: "$GER_reestablish_free_elections_desc$"
 GER_re_ratify_the_locarno_treaty: "Ratifikasi ulang Perjanjian Locarno"
 GER_re_ratify_the_locarno_treaty_desc: "Perjanjian Locarno ditandatangani pada tahun 1925, yang mana Entente berupaya untuk menormalisasi hubungan dengan kami sambil mengamankan integritas teritorial di Eropa. Meskipun hal ini dipandang menindas kita, jelas bahwa hal ini adalah cara terbaik untuk memperbaiki kesalahan Hitler yang menentangnya."
 GER_re_ratify_the_locarno_treaty_tt: "§Y[FRA.GetNameDefCap]§! akan lebih cenderung menerima tindakan diplomatik apa pun yang kita ambil"
 GER_franco_germanic_pact: "Pakta Perancis-Jerman"
 GER_franco_germanic_pact_desc: "Dengan normalisasi hubungan kita baru-baru ini dengan [FRA.GetAdjective], akan menjadi bijaksana jika kita memperdalam hubungan kita dan meresmikan perjanjian persahabatan dan saling membantu, sehingga kita dapat berdiri bersama melawan [SOV.GetAdjective] di Timur."
 GER_request_the_return_of_french_held_colonies: "Meminta Kembalinya Koloni yang dikuasai Prancis"
 GER_request_the_return_of_french_held_colonies_desc: "Pada akhir Perang Besar, kita kehilangan harta milik kolonial kita. Dengan kembali populernya Masyarakat Kolonial Jerman di bawah Adenauer, mungkin sudah waktunya untuk meminta kembali koloni lama kita di Kamerun dan Togoland. Semakin baik hubungan kita dengan Perancis, semakin besar kemungkinan mereka mengizinkan kita mendapatkan kembali wilayah tersebut."
 GER_offer_trade_proposal: "Tawarkan Proposal Perdagangan"
 GER_offer_trade_proposal_desc: "Ada banyak negara dengan sumber daya alam yang melimpah, sehingga perdagangan terbukti sangat menguntungkan. Wilayah Indonesia dan Kongo kaya akan karet dan logam langka, sehingga menjalin kesepakatan perdagangan dengan [BEL.GetNameDEF] dan [HOL.GetNameDef] akan memungkinkan kita mendapatkan sumber daya yang kaya dari koloni mereka untuk mendukung industri kita."
 GER_reverse_the_brain_drain_ww: "$GER_reverse_the_brain_drain$"
 GER_reverse_the_brain_drain_ww_desc: "$GER_reverse_the_brain_drain_desc$"
 GER_shared_rd_programs_ww: "$GER_shared_rd_programs$"
 GER_shared_rd_programs_ww_desc: "$GER_shared_rd_programs_desc$"
 GER_shared_rd_programs_ww_tt: "Bonus kecepatan penelitian dari §Y$GER_rnd_programs_modifier$§! meningkat sebesar §G+1.00%§! untuk setiap anggota faksi baru, hingga maksimum §G+10.00%§!"
 GER_shared_rd_programs_2_tt: "Setiap §YNation§! di §YFaction§! kami juga akan bergabung dengan grup berbagi §YCentral European Research§!."
 GER_pool_technical_know_how_ww: "$GER_pool_technical_know_how$"
 GER_pool_technical_know_how_ww_desc: "$GER_pool_technical_know_how_desc$"
 GER_the_mannheim_project_ww: "Proyek Mannheim"
 GER_the_mannheim_project_ww_desc: "Kita harus melipatgandakan upaya kita dalam memecahkan rahasia atom, dan mempertimbangkan untuk menggunakannya sebagai senjata melawan [SOV.GetAdjective]s. Hal ini akan menjadi lebih mudah berkat sekutu baru kita, yang mungkin bersedia berbagi informasi apa pun yang mereka miliki mengenai masalah ini."
 GER_ban_political_uniforms: "Larang Seragam Politik"
 GER_ban_political_uniforms_desc: "Era Weimar diganggu oleh organisasi paramiliter dan kelompok politik yang melakukan perlawanan di jalan-jalan. Dalam upaya menjamin stabilitas di masa depan, kita harus melarang pertunjukan afiliasi politik secara terbuka."
 GER_embrace_liberal_leanings: "Menerima Kecenderungan Liberal"
 GER_embrace_liberal_leanings_desc: "Konservatisme terbukti ketinggalan jaman ketika Kaiser kita tidak dapat melakukan apa yang dapat dilakukan oleh para politisi kita pada akhir perang. Kita harus selalu melihat ke depan, dan berusaha untuk hari esok yang lebih baik!"
 GER_strive_for_conservative_values: "Mengupayakan Nilai-Nilai Konservatif"
 GER_strive_for_conservative_values_desc: "Ide-ide liberal sudah terlalu lama merajalela di negara kita, melemahkan pikiran masyarakat, dan merusak politisi kita. Kita harus kembali ke nilai-nilai kuno yang baik, sehingga kekacauan di Republik Weimar tidak akan pernah kembali."
 GER_strengthen_the_welfare_state: "Memperkuat Negara Kesejahteraan"
 GER_strengthen_the_welfare_state_desc: "Bangsa kita mempunyai sejarah panjang sebagai negara kesejahteraan, dan hal ini bukanlah sesuatu yang ingin kita ubah sekarang. Kita harus berpegang pada prinsip-prinsip kita, dan memastikan bahwa masyarakat kita menjalani kehidupan sebaik mungkin yang dapat kita berikan kepada mereka."
 GER_democratic_shield: "Perisai Demokratis"
 GER_democratic_shield_desc: "Demokrasi berada dalam bahaya di seluruh dunia, seperti yang pernah terjadi di negara kita. Kita tahu betapa mengerikannya kelompok populis otoriter dan totaliter, dan kita harus memastikan bahwa rakyat negara lain tidak harus mengalami hal yang sama seperti yang pernah kita alami."
 GER_send_military_support_democratic_shield_tt: "Membuka keputusan untuk §YMengirim Peralatan Militer§! ke §YDemokrat§! negara-negara yang sedang berperang"
 GER_revive_the_kaiserreich_ww: "$GER_revive_the_kaiserreich$"
 GER_revive_the_kaiserreich_ww_desc: "$GER_revive_the_kaiserreich_desc$"
 GER_return_of_the_kaiser_ww: "Kembalinya Kaiser"
 GER_return_of_the_kaiser_ww_desc: "Kaiserreich membutuhkan Kaiser, dan Wilhelm II masih hidup, diasingkan di Belanda. Kami akan mencabut pengasingannya dan mengundangnya untuk kembali naik takhta, terlepas dari apa yang mungkin dipikirkan oleh negara-negara demokrasi Barat."
 GER_military_dictatorship: "Kediktatoran Militer"
 GER_military_dictatorship_desc: "Perang Besar membuktikan kepada kita bahwa Kaiser saja tidak cukup untuk mengarahkan bangsa kita ke arah yang terbaik. Seperti yang dilakukan saat itu, Komando Tertinggi Angkatan Darat yang baru harus sekali lagi mengambil alih kekuasaan diktator dan menjadi satu-satunya otoritas politik di Kekaisaran."
 GER_military_dictatorship_tt: "§YKekaisaran Jerman§! akan dikenal sebagai §YKaiserreich Jerman§!."
 GER_invite_scientists_back: "Inisiatif Sains Kekaisaran"
 GER_invite_scientists_back_desc: "Banyak orang cerdas meninggalkan negara ini ketika Nazi mengambil alih, dan untuk alasan yang baik. Namun kini setelah Kekaisaran kita yang mulia dipulihkan, banyak orang mungkin bersedia untuk kembali lagi kepada kita."
 GER_glorious_mechanical_machinations: "Intrik Mekanik yang Mulia"
 GER_glorious_mechanical_machinations_desc: "Kaiser kita telah lama memiliki ketertarikan pada mesin-mesin hebat, dan telah memerintahkan para ilmuwan kita untuk memprioritaskan penelitian terhadap ciptaan yang sebelumnya hanya terlihat dalam mimpi, seperti meriam kereta api raksasa, pesawat yang dapat terbang melintasi Atlantik, dan kapal yang siluetnya menutupi cakrawala."
 GER_prussian_artillery: "Doktrin Artileri Prusia"
 GER_prussian_artillery_desc: "Dulu, kita berhasil memenangkan pertempuran demi pertempuran dengan menggunakan doktrin superior kita. Kualitas dan daya tembak adalah bagian penting dari keberhasilan taktik ini, dan ini adalah sesuatu yang sekali lagi harus kita tiru!"
 GER_fan_prussian_militarism: "$GER_fan_the_prussian_militarism$"
 GER_fan_prussian_militarism_desc: "$GER_fan_the_prussian_militarism_desc$"
 GER_fan_prussian_militarism_tt: "Membuka §YRupprecht von Wittelsbach§! sebagai Field Marshal level 4"
 GER_re_form_the_freikorps: "Membangun kembali Freikorps"
 GER_re_form_the_freikorps_desc: "Freikorps telah lama membantu kami dalam perjuangan melawan lawan ideologis kami, membantu kami menjatuhkan Republik Soviet Bavaria di antara upaya revolusi lainnya sepanjang era Weimar. Kita harus mencoba untuk membangun kembali kekuatan paramiliter, sehingga baik komunis maupun Nazi tidak dapat memperoleh kembali pijakan di negara kita."
 GER_freikrops_militia_recruitment_tt: "Dapatkan lima unit Freikorps §YMilitia§!"
 GER_re_form_the_freikorps_generals_tt: "§YFranz Ritter von Epp§! dan §YHermann Erhardt§! tersedia sebagai jenderal"
 GER_re_establish_the_landwehr: "Membangun kembali Landeswehr"
 GER_re_establish_the_landwehr_desc: "Landwehr telah menjadi alat pertahanan diri yang berguna sejak tahun 1813, dan sangat berguna bagi Republik Weimar. Kita juga harus berusaha menjadikan orang-orang bangsa kita berguna dan membentuk batalyon Landwehr dan Landesschützen kita sendiri."
 GER_all_for_the_front: "Semua Untuk Depan!"
 GER_all_for_the_front_desc: "Setiap orang harus memberikan hati, darah dan jiwanya kepada bangsa Jerman jika ia ingin tanah airnya mendapatkan kembali kejayaannya. Segala sesuatu yang kami lakukan harus menjadi yang terdepan, dan ini adalah kenyataan yang harus dipahami oleh masyarakat kami seiring berjalannya waktu."
 GER_expatriate_the_communists_ww: "$GER_expatriate_the_communists$"
 GER_expatriate_the_communists_ww_desc: "$GER_expatriate_the_communists_desc$"
 GER_demand_the_return_of_southern_jutland: "Menuntut Kembalinya Jutlandia Selatan"
 GER_demand_the_return_of_southern_jutland_desc: "Kepemilikan Kadipaten Schleswig telah lama menjadi perdebatan antara kami dan Denmark. Pada akhir Perang Besar, meskipun tidak ambil bagian di dalamnya, Entente menyerahkan Schleswig Utara kepada mereka. Kita harus menghapuskan ketidakadilan historis ini, dan menuntut agar pemerintah Denmark mengembalikan ketidakadilan tersebut kepada kita."
 GER_glory_to_the_imperial_army: "Kemuliaan bagi Tentara Kekaisaran"
 GER_glory_to_the_imperial_army_desc: "Tentara Kekaisaran telah memenangkan pertempuran demi pertempuran, dan memastikan bahwa Prusia dan Jerman mendapatkan tempat mereka di Eropa. Meskipun para politisi dikhianati pada akhir Weltkrieg, tentara akan mampu mendapatkan kembali kemegahannya yang hilang."
 GER_glory_to_the_imperial_army_tt: "Membuka §YPangeran Eitel Friedrich§! sebagai Jenderal level 2"
 GER_restore_the_holy_roman_empire: "Kembalikan Kekaisaran Romawi Suci"
 GER_restore_the_holy_roman_empire_desc: "Banyak yang meragukan hari seperti ini akan datang, namun inilah kita. Dengan diperolehnya kembali perbatasan lama Kekaisaran, kita mungkin sekali lagi dapat menobatkan kaisar Kekaisaran Romawi Suci, namun kali ini dalam bentuk negara yang bersatu. Kemuliaan bagi Kekaisaran!"
 GER_weltpolitik: "politik luar biasa"
 GER_weltpolitik_desc: "Kita tidak akan dianggap serius sebagai kekuatan besar sampai kita memulihkan kerajaan global kita, atau membangun kerajaan baru sebagai penggantinya. Oleh karena itu kita harus mulai melihat ke luar, dan tidak lagi hanya memusatkan pandangan pada benua Eropa."
 GER_prepare_for_the_next_naval_blockade: "Bersiaplah untuk Blokade Angkatan Laut Berikutnya"
 GER_prepare_for_the_next_naval_blockade_desc: "Kami tahu apa yang terjadi terakhir kali kami berperang melawan musuh dengan armada yang lebih besar dari kami. Berkat pengetahuan yang kita miliki sekarang, kita dapat mencoba menghindari banyak masalah yang pernah kita hadapi dengan melakukan persiapan yang matang bahkan sebelum perang tiba."
 GER_accept_british_naval_dominance_ww: "$GER_accept_british_naval_dominance$"
 GER_accept_british_naval_dominance_ww_desc: "$GER_accept_british_naval_dominance_desc$"
 GER_carve_up_congo: "Mengukir Kongo"
 GER_carve_up_congo_desc: "Kongo sudah matang untuk penjajahan, dan kaya akan sumber daya alam. Mungkin kita bisa mencapai kesepakatan dengan para penenang Inggris untuk membagi wilayah yang luas ini satu sama lain, sebagai batu loncatan besar dalam upaya kita untuk mereformasi kerajaan kolonial kita."
 GER_anglo_germanic_defense_pact: "Pakta Pertahanan Inggris-Jerman"
 GER_anglo_germanic_defense_pact_desc: "Inggris telah menjadi musuh kita sejak lama, namun dengan perkembangan terkini, kita mungkin bisa mencapai kesepakatan defensif dengan mereka yang menyatakan bahwa jika ada yang menyerang salah satu dari kita, mereka akan menyerang keduanya. Ini akan menjadi langkah besar dalam normalisasi hubungan dengan negara mereka."
 GER_signed_the_anglo_german_defence_pact_opm: "Menandatangani Pakta Pertahanan Inggris-Jerman"
 GER_anglo_germanic_cooperation_program: "Program Kerja Sama Inggris-Jerman"
 GER_anglo_germanic_cooperation_program_desc: "Royal Navy memiliki pengetahuan luas tentang pembuatan kapal dan pertempuran laut. Berkat kerja sama yang erat, kita mungkin dapat memperoleh dan memanfaatkan pengetahuan yang sebelumnya dirahasiakan oleh Inggris."
 GER_carte_blanche_for_alsace_and_french_colonies_ww: "$GER_carte_blanche_for_alsace_and_french_colonies$"
 GER_carte_blanche_for_alsace_and_french_colonies_ww_desc: "$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
 GER_petition_for_the_return_of_old_colonies: "Petisi Pengembalian Koloni Lama"
 GER_petition_for_the_return_of_old_colonies_desc: "Teman baru kita di Inggris mungkin terbuka untuk mendiskusikan kembalinya koloni kita yang mereka ambil alih pada akhir Perang Besar. Mereka mungkin menuntut kompensasi dalam bentuk apa pun, namun kami bersedia melakukannya jika hal tersebut dapat berarti pemulihan klaim lama kami."
 GER_unify_west_africa: "Menyatukan Afrika Barat Daya"
 GER_unify_west_africa_desc: "Impian kami terhadap Mittelafrika saat ini terhalang oleh keberadaan kawasan Angola. Untuk menghubungkan wilayah kami di Afrika Barat Daya dengan wilayah Kongo, kami harus mengirimkan ultimatum yang menuntut pengakuan segera atas kekuasaan kami atas wilayah tersebut."
 GER_expand_pacific_holdings: "Perluas Pacific Holdings"
 GER_expand_pacific_holdings_desc: "Dengan sekuat tenaga demi sebuah kerajaan di Samudra Pasifik, para politisi kita menganjurkan perluasan jangkauan kita di seluruh kawasan, dengan tujuan membangun hegemoni [ROOT.GetAdjective] di timur jauh. Kita harus mendukung inisiatif ini dan melakukan serangan."
 GER_closer_sino_germanic_relations: "Hubungan Sino-Jerman Lebih Dekat"
 GER_closer_sino_germanic_relations_desc: "[CHI.GetAdjective] telah menjadi sekutu lama kita, dan banyak yang melihat kemungkinan besar pemerintah [CHI.GetAdjective] akan ikut serta dalam Perang Besar di pihak kita pada saat itu. Kita harus menghargai hubungan kita dengan mereka, dan berusaha memperkuat ikatan antar negara."
 CHI_has_accepted_german_overtures: "Tiongkok telah menerima tawaran [ROOt.GetAdjective]"
 GER_industrial_investments: "Investasi Industri"
 GER_industrial_investments_desc: "[CHI.GetNameDefCap] sangat terbelakang dan tidak memiliki industrialisasi yang dibutuhkan untuk bisa berdiri di panggung dunia sebagai negara besar. Kita harus mengirimkan insinyur untuk membantu industrialisasi mereka, serta mendanai perusahaan [CHI.GetAdjective] yang akan datang dalam upaya membantu mereka dalam pertumbuhan industri."
 GER_launch_sino_germanic_joint_research_program: "Meluncurkan Program Penelitian Bersama Tiongkok-Jerman"
 GER_launch_sino_germanic_joint_research_program_desc: "[CHI.GetAdjective] memiliki pengetahuan yang berharga untuk diketahui, dan kami mengetahui banyak hal yang juga berguna bagi mereka. Oleh karena itu kita harus berupaya membentuk tim penelitian dan pengembangan bersama yang dapat membantu kemajuan kedua negara secara kooperatif."
 GER_send_military_aid: "Kirim Bantuan Militer"
 GER_send_military_aid_desc: "Teman-teman kita di [CHI.GetNameDef] dikelilingi oleh musuh, yang banyak di antaranya berupaya mengancam keberadaan negara mereka. Kita harus mengirimkan amunisi dan peralatan kepada mereka, sehingga mereka dapat mengamankan perbatasan mereka dan berguna bagi kita di tahun-tahun mendatang."
 GER_send_volunteers: "Legiun Timur Jauh"
 GER_send_volunteers_desc: "Banyak [ROOT.GetAdjective] yang mendambakan petualangan, dan ingin berjuang demi tujuan baik. Oleh karena itu, kita harus membentuk legiun 'sukarelawan' yang akan membantu teman-teman [CHI.GetAdjective] kita dalam perang mereka."
 GER_request_the_return_of_qingdao: "Minta Kembalinya Qingdao"
 GER_request_the_return_of_qingdao_desc: "Tsingtao adalah salah satu dari banyak pelabuhan perjanjian yang diperoleh Tiongkok selama abad penghinaan mereka. Meskipun kami kehilangan kota tersebut pada akhir Perang Besar, sebuah kota yang telah diserahkan kepada kami bertahun-tahun yang lalu, kini kami dapat menemukan kesempatan untuk memintanya kembali dari [CHI.GetNameDef], asalkan kami telah menyiapkan kompensasi yang tepat."
 GER_the_sino_germanic_pact: "Pakta Sino-Jerman"
 GER_the_sino_germanic_pact_desc: "Akhirnya tiba waktunya untuk secara resmi mengakui pemerintah [CHI.GetAdjective] sebagai sekutunya. Kita harus segera meresmikan aliansi ini, sehingga kita bisa bersama-sama melawan siapa pun yang berusaha menindas kita!"
 GER_divide_and_conquer: "Bagilah dan Taklukkan"
 GER_divide_and_conquer_desc: "Kami dan [CHI.GetAdjective] mempunyai wilayah pengaruh yang kami inginkan di Timur Jauh, dan pada titik tertentu perbatasan harus dibuat dan dihormati. Karena itu kita harus melakukan itu sesegera mungkin, agar impian kekaisaran kita berdua bisa terwujud."
 GER_asian_spheres_of_influence_tt: "Kami dan §Y[CHI.GetNameWithFlag]§! Akan membentuk Lingkungan Pengaruh kami di §YAsia§!, mengubah biaya pengambilan negara di dalam dan di luar lingkungan masing-masing.\n\n§YLingkungan Pengaruh§! kami akan meliputi:\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§! Semua §YKepulauan Pasifik Selatan§!\n\n§YLingkungan Pengaruh§! mereka akan meliputi:\n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
 GER_the_second_naval_race: "Perlombaan Angkatan Laut Kedua"
 GER_the_second_naval_race_desc: "Kami sudah terlalu lama dipermalukan oleh Inggris dan Prancis! Sudah saatnya kita memulihkan armada kita, dan secara resmi menyatakan bahwa kita tidak berniat untuk tunduk di hadapan mereka lagi. Segera, mereka akan menyadari bahwa lautan adalah milik kita, dan bukan milik orang lain."
 GER_rebuild_the_high_seas_fleet_ww: "$GER_rebuild_the_high_seas_fleet$"
 GER_rebuild_the_high_seas_fleet_ww_desc: "$GER_rebuild_the_high_seas_fleet_desc$"
 GER_break_anglo_french_colonial_hegemony_ww: "$GER_break_the_anglo_french_colonial_hegemony$"
 GER_break_anglo_french_colonial_hegemony_ww_desc: "$GER_break_the_anglo_french_colonial_hegemony_desc$"
 GER_break_anglo_french_colonial_hegemony_ww_tt: "Jika kami telah menandatangani perjanjian kerja sama timbal balik dengan §YPrancis§!, kami tidak akan mendapatkan tujuan perang terhadap mereka"
 GER_asian_allies: "Sekutu Asia"
 GER_asian_allies_desc: "Ada banyak negara kecil di Asia yang belum bisa dikendalikan oleh musuh-musuh kita. Mungkin dengan janji masa depan yang aman dan perolehan wilayah, mereka bersedia membantu kita dalam konflik global."
 GER_our_place_in_the_sun_ww: "Tempat Kita di Bawah Sinar Matahari"
 GER_our_place_in_the_sun_ww_desc: "Beri tahu semua orang bahwa [ROOT.GetNameDef] sekali lagi menegaskan haknya untuk mengambil tempatnya di bawah sinar matahari! Rakyat kita tidak akan lagi dipermalukan dalam bayang-bayang, di bawah kekuasaan Kekaisaran yang mataharinya tidak pernah terbenam!"
 GER_realize_mittelafrika: "Sadarilah Mittelafrika"
 GER_realize_mittelafrika_desc: "Kerajaan kolonial kita akan menjangkau jauh dan luas, dan kekayaan Afrika Tengah selalu memikat. Kita harus mewujudkan impian kita akan Mittelafrika Jerman sesegera mungkin, sehingga kita dapat memanfaatkan jantung Afrika."
 GER_realize_mittelafrika_tt: "Klaim keuntungan di seluruh negara bagian §YKongo§!, §YKenya§!, §YAngolan§! dan §YMozambik§!."
 GER_african_allies: "Sekutu Afrika"
 GER_african_allies_desc: "Rakyat Afrika mendambakan pembebasan dari bangsa Eropa. Mungkin kita bisa memikat mereka ke pihak kita dengan janji otonomi jika mereka bergabung dengan kita."
 GER_african_allies_tt: "Membuka keputusan untuk §YMendukung Kemerdekaan§! negara-negara §YAfrika§!"
 GER_asian_allies_faction_tt: "Minor Asia Independen yang saat ini tidak tergabung dalam faksi mendapatkan event sebagai berikut:"
 GER_african_allies_faction_tt: "Anak di Bawah Umur Afrika Independen yang saat ini tidak tergabung dalam faksi mendapatkan event berikut:"
 GER_asian_allies_tt: "Membuka keputusan untuk §YMendukung Kemerdekaan§! negara-negara §YAsia§!"
 GER_expand_african_reach: "Perluas Jangkauan Afrika"
 GER_expand_african_reach_desc: "Ada wilayah-wilayah di Afrika yang kita klaim tidak berada di bawah kendali musuh-musuh kita saat ini. Kita harus memastikan bahwa klaim kita dibuat jelas, dan menuntut wilayah tersebut dari mereka segera."
 GER_realpolitik: "Realpolitik"
 GER_realpolitik_desc: "Saatnya telah tiba bagi kita untuk melihat ke luar ke wilayah Eropa lainnya, dan melihat ke arah mana angin bertiup. Jika peluang untuk bersekutu atau melakukan penaklukan muncul, kita harus segera memanfaatkannya."
 GER_restore_the_brest_litovsk_borders: "Pulihkan Perbatasan Brest-Litovsk"
 GER_restore_the_brest_litovsk_borders_desc: "Perbatasan yang ditetapkan dalam perjanjian Brest-Litovsk telah lama dicabut secara tidak sah melalui perjanjian Versailles, meskipun Rusia kalah dalam Perang Besar dan menyerahkan wilayah tersebut kepada kami. Kita harus berusaha untuk mendapatkan kembali wilayah timur kita yang hilang, bahkan jika hal itu dapat menyebabkan perang di masa depan."
 GER_demand_further_polish_concessions: "Menuntut Konsesi Polandia Lebih Lanjut"
 GER_demand_further_polish_concessions_desc: "Kami telah meminta Polandia untuk menyerahkan kembali bagian integral Kekaisaran lama kepada kami, tetapi kami tidak akan berhenti di situ. Perbatasan Brest-Litovsk belum dipulihkan, dan Polandia masih dalam perjalanan untuk mewujudkan impian kami."
 GER_restore_eastern_imperial_possessions: "Kembalikan Kepemilikan Kekaisaran Timur"
 GER_restore_eastern_imperial_possessions_desc: "Tanah yang merupakan bagian integral dari kekaisaran kami saat ini dirahasiakan dari kami oleh kekuatan asing. Untuk mewujudkan perbatasan Brest-Litovsk, pertama-tama kita harus melihat ke Poznan, Prusia Barat, dan Silesia."
 GER_incorporate_the_polish_rump_state: "Gabungkan Negara Bagian Rump Polandia"
 GER_incorporate_the_polish_rump_state_desc: "Bahkan bagian terakhir Polandia yang tersisa adalah milik kekaisaran, sebagaimana ditentukan dalam Perjanjian Brest-Litovsk. Kita harus merebut kembali wilayah-wilayah ini, jika perlu dengan kekerasan."
 GER_memel_ultimatum: "Memel Ultimatum"
 GER_memel_ultimatum_desc: "Pelajaran yang bisa kita petik dari Perang Besar adalah kita harus bersiap menghadapi serangan terhadap wilayah timur kita yang terpencil. Harta benda ini harus dipulihkan dan dibentengi dari invasi. Namun hal ini tidak dapat dilakukan tanpa kendali atas Memelland yang penting dan strategis, yang harus kita rebut kembali."
 GER_demand_lithuanian_integration: "Menuntut Integrasi Lituania"
 GER_demand_lithuanian_integration_desc: "Kerajaan Lituania pernah direncanakan untuk menjadi bagian semi-otonom dari negara kita, dan hal itu akan terjadi. Kita harus mengupayakan aneksasi tanah Lituania, dan menobatkan Mindaugas sebagai Adipati wilayah tersebut."
 GER_establish_eastern_grand_duchies: "[GetEasternDuchiesName]"
 GER_establish_eastern_grand_duchies_desc: "Seluruh wilayah yang tercakup dalam perjanjian tidak dapat dikuasai langsung oleh kami. Namun kami mempunyai rencana untuk mendirikan Kadipaten Agung dan Kerajaan Satelit di timur yang akan mampu mempertahankan wilayah ini untuk kami."
 GER_eastern_duchies_name_democratic: "Negara Otonomi Timur"
 GER_eastern_duchies_name_neutrality: "Mendirikan Kadipaten Agung Timur"
 GER_subduing_the_baltic_states: "Menundukkan Negara Baltik"
 GER_subduing_the_baltic_states_desc: "Negara-negara Baltik tidak sah, mengklaim wilayah Kadipaten Baltik Bersatu kita. Kita harus menundukkan mereka, dan menyerahkan tanahnya kepada aristokrasi Baltik-Jerman."
 GER_subduing_the_baltic_states_tt: "Dapatkan tiga unit Baltische Landeswehr §YInfantri§!.\nJika §YPolandia§! belum §YMemulihkan Bermontians§!, §YRüdiger von der Goltz§! akan bergabung dengan kami sebagai Field Marshal level 3."
 GER_strike_eastward: "Serang ke arah Timur"
 GER_strike_eastward_desc: "Dengan amannya perbatasan, sudah saatnya kita menumpas rival terbesar kita, pihak yang melanggar perjanjian Brest-Litovsk, dan pihak yang mengancam stabilitas Eropa Timur, yaitu [SOV.GetNameDef]. Ini saatnya merebut Moskow, dan benar-benar membuat raksasa [SOV.GetAdjective] bertekuk lutut."
 GER_unlocks_kremlin_raid_tt: "Membuka §YSerangan Udara§! di §YKremlin§! saat berperang dengan §Y[SOV.GetNameWithFlag]§!"
 GER_end_european_communism: "Akhiri Komunisme Eropa"
 GER_end_european_communism_desc: "Kini ancaman terbesar bagi bangsa kita telah dihancurkan, sekarang saatnya untuk membereskan kekacauan yang mereka tinggalkan di Eropa. Komunisme adalah ancaman mendasar terhadap nilai-nilai kita dan harus dilenyapkan selamanya."
 GER_strike_eastward_eq_trigger_tt: "Lebih dari §Y100.000§! peralatan infanteri di angkatan darat"
 GER_second_vienna_award_eq_trigger_tt: "Lebih dari §Y60.000§! peralatan infanteri di angkatan darat"
 GER_sea_lion_eq_trigger_tt: "Lebih dari §Y90.000§! peralatan infanteri di angkatan darat"
 GER_puppet_finland: "Pastikan [FIN.GetAdjective] Loyalitas"
 GER_puppet_finland_desc: "[GetFinlandpuppetDescription]"
 GER_finland_puppet_description_democratic: "Orang-orang [FIN.GetAdjective] mungkin adalah saudara seperjuangan kita, tapi kita tidak pernah bisa yakin apakah akan tiba saatnya mereka mengkhianati kita dan berpindah pihak. Kita harus memastikan bahwa hari seperti itu tidak akan pernah datang, apa pun risikonya!"
 GER_finland_puppet_description_neutrality: "Masyarakat [FIN.GetAdjective] pernah menolak tawaran kami untuk melantik raja, namun kami tidak akan mengizinkan mereka melakukannya lagi. Sudah waktunya bagi Pangeran Wolfgang dari Hesse untuk mengambil alih takhta mereka, suka atau tidak suka."
 GER_see_to_the_eastern_front_ww: "Lihat ke Front Timur"
 GER_see_to_the_eastern_front_ww_desc: "Tindakan kami dalam perang sebelumnya masih diingat oleh banyak orang. Kita harus memfokuskan kembali ketakutan benua ini pada bahaya yang sebenarnya: [GER.GetGreatRedMenaceDesc] besar yang mengancam di Timur. Kami akan memulai kampanye propaganda besar-besaran untuk membuka mata benua ini."
 GER_the_eastern_threat: "Ancaman Timur"
 guardian_against_the_eastern_threat: "Penjaga Terhadap Ancaman Timur"
 existential_threat: "Ancaman Eksistensial"
 GER_seeks_to_restore_brest_litovsk: "Berusaha memulihkan Brest-Litovsk"
 GER_seeks_to_restore_brest_litovsk_worse: "$GER_seeks_to_restore_brest_litovsk$"
 GER_safeguard_the_baltic_ww: "$GER_safeguard_the_baltic$"
 GER_safeguard_the_baltic_ww_desc: "$GER_safeguard_the_baltic_desc$"
 GER_tributes_for_guarantees: "Penghargaan untuk Jaminan"
 GER_tributes_for_guarantees_desc: "Kita harus melindungi negara-negara Baltik dari Beruang di timur, tapi kita tidak akan melakukannya secara cuma-cuma. Mengingat negara-negara ini berada dalam posisi yang rentan, akan mudah untuk menuntut kompensasi atas perlindungan."
 tributes_from_lithuania_tt: "Jika §Y[LIT.GetNameWithFlag]§! Menerima:"
 tributes_from_latvia_or_estonia_tt: "Jika §Y[LAT.GetNameWithFlag]§! atau §Y[EST.GetNameWithFlag]§! Menerima:"
 GER_will_also_recieve_trade_and_civs_tt: "Kami juga akan menerima sebagian kecil dari sumber daya dan industri sipil mereka.\nJumlah §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! akan bergantung pada berapa banyak negara yang menerima tuntutan kita"
 GER_support_the_finns_ww: "$GER_support_the_finns$"
 GER_support_the_finns_ww_desc: "Finlandia berada di garis tembak [GER.GetRussiansDemonym]. Kami akan menawarkan mereka jaminan terhadap ancaman dari timur, dan memberi mereka sedikit bantuan industri."
 GER_danzig_for_guarantees_ww: "$GER_danzig_for_guarantees$"
 GER_danzig_for_guarantees_ww_desc: "$GER_danzig_for_guarantees_desc$"
 GER_safeguard_poland: "Lindungi Polandia"
 GER_safeguard_poland_desc: "Polandia rentan terhadap serangan dari timur. Kita harus melindungi mereka dengan segala cara, untuk menjaga keadaan penyangga antara kita dan [SOV.GetAdjective]."
 GER_safeguard_poland_tt: "Jika §YPolandia§! ada di faksi kami atau dijamin oleh kami saat menyelesaikan §YMengadakan Latihan Militer Gabungan§!, kami akan mendapatkan tambahan §G25§! §YPengalaman Tentara§! dan §G15§! §YPengalaman Udara§!"
 GER_offer_military_production_support: "Menawarkan Dukungan Produksi Militer"
 GER_offer_military_production_support_desc: "Negara-negara penyangga di wilayah timur tidak memiliki basis kekuatan industri yang kuat seperti yang kita miliki. Kita harus menawarkan mereka dukungan dalam memproduksi senjata dan amunisi, sehingga mereka dapat bertahan untuk sementara waktu jika diserang oleh [SOV.GetNameDef]."
 GER_offer_military_production_support_tt: "Semua negara Eropa Timur yang berada di bawah perlindungan kami akan memperoleh peningkatan berikut pada §YProduksi Militer§! mereka selama §Y730§! hari:"
 GER_liberate_oppressed_people: "Bebaskan Rakyat yang Tertindas"
 GER_liberate_oppressed_people_desc: "Ada banyak orang di [SOV.GetNameDef] yang menerima kami, dan menginginkan pembebasan lebih dari apapun. Mungkin kita harus membebaskan mereka dari penindas mereka, dan menjadikan mereka sekutu baru kita di timur."
 GER_liberate_oppressed_people_tt: "Menjadi §G40%§! lebih murah untuk dibebaskan dan §G20%§! lebih murah untuk menjadi boneka negara bagian §Y[SOV.GetNameDef]§!."
 GER_liberate_oppressed_people_cossacks_tt: "Memungkinkan pemulihan §YRepublik Cossack§! Rusia Selatan"
 GER_build_the_eastern_bulwark: "Bangun Benteng Timur"
 GER_build_the_eastern_bulwark_desc: "Negara-negara di sebelah timur kita memiliki pertahanan yang sangat lemah untuk dapat menghadapi ancaman [SOV.GetAdjective] dengan baik. Kita harus berinvestasi dalam pembangunan benteng di negara mereka, sehingga upaya merebutnya akan memakan biaya sebesar-besarnya bagi musuh."
 GER_build_the_eastern_bulwark_tt: "Membangun §YLand Forts§! tingkat 2 di semua negara bagian yang dimiliki oleh §Y[ROOT.GetNameDef]§! atau negara mana pun yang dijamin oleh atau dalam faksi dengan §Y[ROOT.GetNameDef]§! di perbatasan dengan §Y[SOV.GetNameDef]§!."
 GER_build_the_eastern_bulwark_ns_tt: "Saat memasuki perang dengan §Y[SOV.GetNameDef]§!, kami akan mendapatkan:"
 GER_ally_white_russian_forces: "Sekutu Gerakan Putih Rusia"
 GER_ally_white_russian_forces_desc: "Ada banyak orang Rusia yang melarikan diri ke luar negeri setelah The Reds memenangkan Perang Saudara di Rusia. Kita harus menjangkau mereka, dan melihat apakah mereka bersedia bekerja sama dalam merebut kembali tanah air mereka, dengan mengorbankan klaim atas tanah yang diberikan kepada kita atau sekutu kita dalam perjanjian Brest-Litovsk."
 GER_hold_joint_military_drills: "Adakan Latihan Militer Gabungan"
 GER_hold_joint_military_drills_desc: "Sekutu timur kita telah melawan [SOV.GetAdjective] lebih baru daripada kita, dan mungkin memiliki pengetahuan berharga tentang cara mengalahkan mereka. Kita harus menyelenggarakan latihan militer bersama-sama, sehingga pengetahuan tersebut dapat disebarkan ke mana-mana."
 GER_hold_joint_military_drills_tt: "Kami, dan negara-negara Eropa Timur mana pun yang kami jamin atau yang tergabung dalam faksi kami akan mendapatkan semangat nasional berikut:"
 GER_extend_mitteleuropas_bounderies: "Perluas Batas Mitteleuropa ke arah Timur"
 GER_extend_mitteleuropas_bounderies_desc: "Negara-negara di sebelah timur kita lebih dari sekedar negara penyangga. Kita harus mengundang mereka ke Mitteleuropa, dan memastikan bahwa mereka juga membantu memperkuat aliansi dan serikat pabean kita."
 GER_extend_mitteleuropas_bounderies_tt: "Mengundang negara-negara Eropa Timur yang Dijamin ke §YMitteleuropa§!"
 GER_reach_out_to_scandinavia: "Jangkau Skandinavia"
 GER_reach_out_to_scandinavia_desc: "Pegunungan dan hawa dingin bukanlah perlindungan terhadap Ancaman [GER.GetGreatRedMenaceName], dan masyarakat Skandinavia harus mengetahui hal ini. Kami akan menawarkan mereka keanggotaan dan perlindungan terhadap ancaman [SOV.GetAdjective]s."
 GER_mitteleuropa: "Mitteleuropa"
 GER_mitteleuropa_desc: "Wilayah kepentingan utama rakyat Jerman adalah Eropa Tengah, yang awalnya dibayangkan oleh Prusia sebagai imperium yang berpusat pada negara pan-Jerman. Ide-ide ini mungkin memerlukan beberapa penyempurnaan, namun merupakan landasan yang baik untuk membangun tatanan baru di Eropa."
 GER_mitteleuropa_tt: "Membuka keputusan untuk §YMenggerakkan Opini Publik di Austria ke Pihak kita§!, yang membuat mereka lebih bersedia menerima aliansi dan penaklukan."
 GER_mitteleuropa_alliance: "Mitteleuropa"
 GER_brothers_in_arms: "Saudara seperjuangan"
 GER_brothers_in_arms_desc: "Saudara-saudara kami di Austria berjuang keras bersama kami sebagai bagian dari Blok Sentral. Kita harus menjangkau mereka dengan tawaran yang tidak bisa mereka tolak, sehingga kita bisa kembali berjuang berdampingan."
 GER_carve_up_czechoslovakia: "Mengukir Cekoslowakia"
 GER_carve_up_czechoslovakia_desc: "Negara [CZE.GetAdjective] tidak hanya menghalangi ambisi kita, tapi juga ambisi sekutu kita di selatan. Kita harus membaginya di antara kita, sehingga Mitteleuropa dapat terwujud."
 GER_rekindle_imperial_sentiment_ww: "$GER_rekindle_imperial_sentiment$"
 GER_rekindle_imperial_sentiment_ww_desc: "$GER_rekindle_imperial_sentiment_desc$"
 GER_the_first_berlin_award: "Penghargaan Berlin Pertama"
 GER_the_first_berlin_award_desc: "Polandia tidak hanya menduduki tanah kami, tetapi juga di tanah Austro-Hungaria. Kita harus berusaha mengintimidasi mereka agar menyerahkan wilayah tersebut kembali ke Mitteleuropa, agar mereka tidak menghadapi kemarahan tentara Jerman."
 GER_the_first_berlin_award_hun_tt: "Jika kita satu faksi dengan §Y[HUN.GetNameDef]§!:"
 GER_the_first_berlin_award_aus_tt: "Jika kita satu faksi dengan §Y[AUS.GetNameDef]§!:"
 GER_the_second_berlin_award: "Penghargaan Berlin Kedua"
 GER_the_second_berlin_award_desc: "Bangsa Rumania dan Slavia juga menduduki tanah Austro-Hungaria yang sah. Kita harus meminta mereka segera mengembalikannya!"
 GER_trade_agreements: "Perjanjian Perdagangan"
 GER_trade_agreements_desc: "Mitteleuropa bukan hanya aliansi kekuatan, tetapi juga serikat pekerja untuk membantu membangun hubungan perdagangan dan kerja sama ekonomi yang lebih baik. Kita harus menekankan peran ini dan menggunakannya untuk menjangkau mereka yang kaya akan sumber daya alam."
 GER_trade_agreements_tt: "Semua sekutu akan menerima §YSemangat Nasional§!:"
 GER_mitteleuropa_cooperation_sphere: "Bidang Kerja Sama Mitteleuropa"
 GER_mitteleuropa_cooperation_sphere_desc: "Eropa Tengah memiliki banyak pemikiran cemerlang. Meskipun demikian, mereka tidak dapat bekerja sama karena keinginan pemerintah yang berbeda untuk menyimpan pengetahuan mereka untuk diri mereka sendiri. Kita harus mendorong kerja sama ilmiah yang lebih erat dengan sekutu kita."
 GER_conquer_italy: "Taklukkan Italia"
 GER_conquer_italy_desc: "Orang Italia mengkhianati kami selama Perang Besar ketika mereka menyerang Austria-Hongaria dan memihak Entente. Kami tidak akan pernah lupa, dan tidak akan pernah memaafkan. Sudah saatnya kita mengajari mereka apa akibat dari pengkhianatan dan pengkhianatan."
 GER_align_italy: "Sejajarkan Italia"
 GER_align_italy_desc: "Italia mungkin telah mengkhianati kita selama Perang Besar, namun kita tidak boleh melupakan fakta bahwa mereka memiliki angkatan laut yang mengesankan, yang mungkin mampu menghadapi musuh-musuh kita. Oleh karena itu, kita harus berupaya membangun kembali aliansi lama kita dengan mereka."
 GER_the_austrian_question: "Pertanyaan Austria"
 GER_the_austrian_question_desc: "Solusi Jerman yang lebih kecil adalah sebuah kesalahan, yang harus segera kita perbaiki. Kita harus memaksa Austria untuk bergabung dengan negara kita, bahkan mungkin mengambil kesempatan untuk menawarkan Burgenland sebagai imbalan atas aliansi dengan [HUN.GetNameDef]."
 GER_the_austrian_question_more_likely_to_accept_tt: "Mereka §RLESS§! kemungkinan besar akan menerima jika mereka saat ini memimpin sebuah faksi."
 GER_align_czechoslovakia: "Sejajarkan Cekoslowakia"
 GER_align_czechoslovakia_desc: "Negara Cekoslowakia kaya akan kemampuan industri dan sumber daya alam, dan telah menjadi salah satu jantung industrialisasi di Austria-Hongaria. Kita harus mengajak mereka bergabung dengan Mitteleuropa, sehingga kita bisa memanfaatkan kekayaan mereka."
 GER_sway_the_balkans: "Goyangkan Balkan"
 GER_sway_the_balkans_desc: "Ada banyak negara di Balkan yang merasa terancam oleh kekuatan asing. Kita harus menawarkan mereka tempat di Mitteleuropa, sehingga persatuan kita bisa semakin kuat."
 GER_sway_the_balkans_tt: "Membuka keputusan untuk §YMemperkuat [ROOT.GetRulingIdeology] Ideologi§! di negara §YBalkan§! dan untuk §YMembawa mereka ke Mitteleuropa§!"
 GER_establish_a_customs_union: "Mendirikan Serikat Pabean"
 GER_establish_a_customs_union_desc: "Sebagaimana rencana program September di masa lalu, kita sekarang harus membentuk serikat pabean Mitteleuropa, dan perlahan tapi pasti menyatukan perekonomian Eropa menjadi satu kekuatan yang paling kuat."
 GER_integrated_economies: "Perekonomian Terintegrasi"
 GER_integrated_economies_desc: "Integrasi ekonomi negara-negara sekutu dengan negara kita, dan pembentukan bank sentral Jerman yang dapat memantau dan membantu situasi ekonomi negara-negara lain, akan sangat bermanfaat bagi kita dalam jangka panjang, tidak hanya memperkuat kita, tetapi juga meningkatkan ketergantungan negara-negara tersebut pada kita, yang pada akhirnya memungkinkan kita untuk mengendalikan urusan luar negeri negara-negara tersebut."
 GER_integrated_economies_tt: "Setiap §YAnggota Fraksi§! akan menerima §YAcara:§! [GER.GetNameDefCap] Harapan untuk Integrasi Lebih Lanjut Perekonomian kita"
 GER_european_confederation: "Konfederasi Eropa"
 GER_european_confederation_desc: "Karena sekutu kita sekarang sangat bergantung pada kita, inilah saatnya untuk mulai mencoba mengintegrasikan mereka lebih jauh, dengan impian untuk dapat mendirikan Konfederasi Eropa."
 GER_bring_turkey_into_the_fold: "Bawa [TUR.GetNameDef] Kembali ke Lipat"
 GER_bring_turkey_into_the_fold_desc: "Turki mempunyai klaim di luar perbatasan mereka saat ini, dan akan dengan mudah dipaksa untuk bergabung dengan faksi kami. Sudah waktunya kita sekali lagi membawa mereka kembali ke kelompoknya."
 GER_german_hegemony_in_the_middle_east: "Hegemoni Jerman di Timur Tengah"
 GER_german_hegemony_in_the_middle_east_desc: "Timur Tengah sudah siap untuk ditaklukkan, dan banyak negara mungkin bersedia bersekutu dengan kita dengan harapan kita bisa melawan kerajaan Inggris atau Perancis. Sudah saatnya kita membangun hegemoni di Timur Tengah."
 GER_sway_the_middle_east_decisions_tt: "Membuka keputusan untuk §YMemperkuat [ROOT.GetRulingIdeology] Ideologi§! di negara-negara §YTimur Tengah§! dan untuk §YMembawa mereka ke Mitteleuropa§!"
 GER_reject_the_locarno_treaty: "Tolak Perjanjian Locarno"
 GER_reject_the_locarno_treaty_desc: "Perjanjian Locarno jelas-jelas dibuat untuk menghalangi kita mendapatkan kembali wilayah-wilayah yang telah dirampas secara tidak adil dari kita. Kita harus menolak perjanjian ini sama sekali, dan bersiap untuk merebut kembali negara kita yang lama."
 GER_backdoor_negotiations: "Negosiasi Pintu Belakang"
 GER_backdoor_negotiations_desc: "Kita bisa mencoba untuk menghindari campur tangan Barat di dataran rendah dengan tidak menyerang mereka semua, tapi malah mendorong salah satu dari mereka untuk menyerang yang lain, dan kemudian bergabung dengan salah satu dari mereka, yang secara efektif menyebabkan perpecahan di antara negara-negara lama di wilayah Belanda Raya."
 GER_backdoor_negotiations_tt: "Keputusan ini memungkinkan kami untuk menambahkan salah satu negara target ke faksi kami sambil menyerang negara lain."
 GER_schlieffen_once_more_ww: "$GER_schlieffen_once_more$"
 GER_schlieffen_once_more_ww_desc: "$GER_schlieffen_once_more_desc$"
 GER_bypass_maginot_in_the_south_ww: "$GER_bypass_maginot_in_the_south$"
 GER_bypass_maginot_in_the_south_ww_desc: "$GER_bypass_maginot_in_the_south_desc$"
 GER_reinstate_imperial_possessions_ww: "$GER_reinstate_imperial_possessions$"
 GER_reinstate_imperial_possessions_ww_desc: "$GER_reinstate_imperial_possessions_desc$"
 GER_establish_western_grand_duchies: "[GetWesternDuchiesName]"
 GER_western_duchies_name_democratic: "Negara Otonomi Barat"
 GER_western_duchies_name_neutrality: "Mendirikan Kadipaten Agung Barat"
 GER_establish_western_grand_duchies_desc: "Seperti yang direncanakan dalam program bulan September, kita harus mencoba membangun kendali kita atas wilayah barat dengan menciptakan negara klien kita sendiri, membagi perbatasan sesuai keinginan kita."
 GER_integrate_western_german_speakers: "Integrasikan Penutur Bahasa Jerman Barat"
 GER_integrate_western_german_speakers_desc: "Program September membayangkan wilayah Luksemburg yang lebih luas terintegrasi dengan negara bagian Jerman. Baik wilayah tersebut maupun Swiss dulunya adalah bagian dari Kekaisaran Romawi Suci, dan kami adalah satu-satunya penerus sahnya. Wilayah Jermanik ini harus dimasukkan kembali ke dalam wilayah kita secepat mungkin."
