 GER_assassinate_mussolini_ww_desc: "Waktunya telah tiba untuk mengakhiri inti fasisme [ITA.GetAdjective]. Tangan Jerman akan membunuh pemimpinnya, setelah itu kaum royalis [ITA.GetAdjective] akan merebut kekuasaan dalam satu gerakan cepat."
