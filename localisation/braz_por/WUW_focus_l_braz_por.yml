 habsburg_alliance_faction: "Aliansi Habsburg"
 wuw_HUN_the_kingdom_of_ukraine_required_states_tt: "§Y[ROOT.GetNameDefCap]§! atau subjek mengendalikan semua §YUkraina§! negara bagian inti di §YUni Soviet§! serta §Y[137.GetName]§!, §Y[218.GetName]§!, §Y[93.GetName]§! dan §Y[234.GetName]§!."
 wuw_HUN_the_kingdom_of_ukraine_tt: "Kami akan melepaskan §YNegara Bagian Ukraina§! baru sebagai subjek kami dari negara bagian yang diwajibkan"
 wuw_HUN_the_kingdom_of_georgia_required_states_tt: "§Y[ROOT.GetNameDefCap]§! atau subjek mengendalikan semua negara bagian inti §YGeorgia§! di §YUni Soviet§!"
 wuw_HUN_enlarge_the_ganz_danubius_division_tt: "Tambahkan §G3§! §YNaval Dockyards§! di §YCoastal State§! yang dikontrol secara acak"
 wuw_HUN_renew_the_shipping_industry_tt: "Tambahkan §G3§! §YNaval Dockyards§! di §YCoastal State§! yang dikontrol secara acak"
 wuw_HUN_economic_intervention: "Intervensi Ekonomi"
 wuw_HUN_economic_intervention_desc: "Kita harus mengarahkan sumber daya politik yang besar untuk mengarahkan perekonomian kita. Meski memadai, kita masih bisa membuatnya lebih kuat dan efisien."
 wuw_HUN_avoid_interventionalist_destablilization: "Hindari Destabilisasi Intervensi"
 wuw_HUN_avoid_interventionalist_destablilization_desc: "Kita harus melakukan yang terbaik dengan sumber daya yang kita miliki. Anggaran yang terencana dan seimbang adalah kunci keberhasilan pemerintah kita."
 wuw_HUN_secret_rearmament: "Persenjataan Kembali Rahasia"
 wuw_HUN_secret_rearmament_desc: "Pembatasan yang diberlakukan kepada kami oleh Perjanjian Trianon melarang kami menambah jumlah pasukan. Meski begitu, iklim politik dunia semakin bergejolak dan konflik akan segera terjadi. Kita tidak bisa tetap tidak berdaya, dan kita harus mulai mempersenjatai kembali bahkan jika itu berarti secara diam-diam melanggar ketentuan perjanjian damai yang diberlakukan pada kita setelah Perang Besar."
 wuw_HUN_forcefully_revitalize_the_industries: "Merevitalisasi Industri Secara Paksa"
 wuw_HUN_forcefully_revitalize_the_industries_desc: "Kita perlu memberikan kejutan pada industri nasional kita, dan menyadarkan mereka agar mereka dapat pulih dari depresi ekonomi kita. Hal ini mungkin merugikan perekonomian kita untuk sementara waktu, namun tentunya akan menjadi investasi yang berharga bagi masa depan bangsa kita."
 wuw_HUN_reintigrate_the_imperial_railroads: "Integrasikan kembali Jalur Kereta Api Kekaisaran"
 wuw_HUN_reintigrate_the_imperial_railroads_desc: "Jaringan kereta api yang mencakup kekaisaran lama Austro-Hongaria telah terfragmentasi sejak pembubarannya di negara-negara merdeka. Kita harus mendekati negara-negara bekas konstituen lainnya dan mengusulkan reintegrasi jaringan kereta api kita, untuk meningkatkan infrastruktur secara keseluruhan."
 wuw_HUN_promote_increased_urbanization: "Mendorong Peningkatan Urbanisasi"
 wuw_HUN_promote_increased_urbanization_desc: "Semakin banyak orang meninggalkan desa dan kota kecil untuk pindah ke pusat kota besar, mencari pekerjaan di pabrik baru. Sekalipun kita tidak bisa langsung menawarkan lapangan pekerjaan kepada mereka, kita bisa membangun kawasan kota baru untuk mempersiapkan jalan bagi perluasan di kemudian hari."
 wuw_HUN_expand_the_ganz_muvek: "Perluas Ganz Müvek"
 wuw_HUN_expand_the_ganz_muvek_desc: "Pabrik Besi dan Mesin Ganz dan Mitranya harus diperluas dan menyerap berbagai industri kecil ke dalamnya, untuk memusatkan kemampuan industri kita dengan lebih baik dan mengarahkan pendanaan dengan lebih baik untuk pengembangan industri di masa depan."
 wuw_HUN_devalue_the_pengo: "Nilai kembali Pengö"
 wuw_HUN_devalue_the_pengo_desc: "Pengö saat ini berada dalam posisi yang sangat buruk, menjadi salah satu kasus hiperinflasi terburuk dalam sejarah. Kita harus mengambil tindakan drastis untuk merevaluasi dan memperkuat mata uang, meskipun tindakan tersebut tidak populer."
 wuw_HUN_announce_the_gyor_program: "Umumkan Program Györi"
 wuw_HUN_announce_the_gyor_program_desc: "Militer kita sangat lemah, dan kita harus meningkatkan ukuran dan kemampuan tempurnya. Untuk melakukan hal ini kita harus memperkuat industri kita secara signifikan, untuk mengimbangi permintaan peralatan yang terus meningkat. Program Györi yang berdurasi lima tahun akan meningkatkan belanja pemerintah tidak hanya pada sektor militer itu sendiri, namun juga pada sektor-sektor tambahan seperti industri, pertanian, infrastruktur, dan pendidikan."
 wuw_HUN_enlarge_the_ganz_danubius_division: "Memperbesar Divisi Ganz Danubius"
 wuw_HUN_enlarge_the_ganz_danubius_division_desc: "Divisi Ganz Danubius dari Ganz Works yang berlokasi di Budapest membangun dan memperbaiki kapal sipil dan kapal angkatan laut perairan coklat. Kita harus memperluas tugas mereka, dan membangun pabrik baru untuk mereka di garis pantai yang baru kita rebut."
 wuw_HUN_support_for_our_finnish_brothers: "Dukungan untuk Saudara-saudara kita di Finlandia"
 wuw_HUN_support_for_our_finnish_brothers_desc: "Baru seratus tahun yang lalu nenek moyang kita diterima secara umum sebagai leluhur Finlandia, namun banyak orang di negara kita sekarang memandang mereka sebagai saudara sedarah kita. Sekarang mereka sedang berperang, kita harus mengirim sukarelawan dan peralatan untuk membantu perjuangan mereka."
 wuw_HUN_support_for_our_finnish_brothers_tt: "Finlandia harus mempunyai pemerintahan yang bisa menerima pemerintahan kita"
 wuw_HUN_undercover_air_maneuvers: "Manuver Udara yang Menyamar"
 wuw_HUN_undercover_air_maneuvers_desc: "Kita harus menghabiskan banyak sumber daya untuk mengembangkan teori-teori baru mengenai perang udara. Jika kita berperang, teori yang dapat dikembangkan akan sangat berharga, dan pelatihan penyamaran akan membuat pilot kita lebih baik dalam pertempuran."
 wuw_HUN_hold_war_games: "Adakan Permainan Perang"
 wuw_HUN_hold_war_games_desc: "Dengan terlibat dalam latihan perang skala kecil, kita dapat menemukan kelemahan dalam struktur militer kita saat ini, dan menggunakan pengalaman yang diperoleh untuk memperbaiki kekurangan tersebut."
 wuw_HUN_negotiate_the_restrictions: "Negosiasikan Pembatasannya"
 wuw_HUN_negotiate_the_restrictions_desc: "Persenjataan kembali secara rahasia dalam skala kecil tidak akan cukup. Kita harus menjangkau negara-negara tetangga kita dan meminta ganti rugi atas perjanjian yang diberlakukan pada kita setelah Perang Besar. Hongaria memiliki hak yang sama atas persenjataan."
 wuw_HUN_reinstate_the_navy: "Aktifkan kembali Haditengerészet"
 wuw_HUN_reinstate_the_navy_desc: "Setelah mendapatkan kembali garis pantai, kita harus memfokuskan upaya kita pada pembangunan kembali armada yang sesuai untuk negara-negara besar."
 wuw_HUN_make_the_magyar_legiero_known: "Jadikan Magyar Légierö Dikenal"
 wuw_HUN_make_the_magyar_legiero_known_desc: "Magyar Légierő adalah cabang angkatan udara dari militer kita. Kami dilarang memiliki pesawat militer. Namun, angkatan udara rahasia secara bertahap dibentuk di bawah kedok klub terbang sipil. Kini dengan adanya perjanjian baru, kita dapat mengumumkan keberadaannya kepada dunia."
 wuw_HUN_initiate_army_maneuvers: "Memulai Manuver Tentara"
 wuw_HUN_initiate_army_maneuvers_desc: "Tentara kita harus kembali bugar untuk menghadapi potensi konflik bersenjata di masa depan. Kami akan mengirim mereka melakukan manuver untuk mengembangkan taktik dan strategi baru."
 wuw_HUN_invest_in_ludovica_academy: "Berinvestasilah di Akademi Ludovica"
 wuw_HUN_invest_in_ludovica_academy_desc: "Akademi Pertahanan Ludovica Kerajaan Hongaria adalah lembaga pelatihan taruna perwira kami. Hal ini harus diperluas sehingga para jenderal kita bisa mendapatkan pendidikan yang lebih baik."
 wuw_HUN_expand_the_diosgyor_machinery_factory: "Perluas Pabrik Mesin Diósgyör"
 wuw_HUN_expand_the_diosgyor_machinery_factory_desc: "Diósgyőri Gépgyár harus diperluas ke lebih banyak sektor, sehingga mempercepat produksi material dan peralatan industri, mesin dan sepeda motor, serta banyak hal lainnya."
 wuw_HUN_manred_weiss_steel_and_metal_works: "Pekerjaan Baja dan Logam Manfréd Weiss"
 wuw_HUN_manred_weiss_steel_and_metal_works_desc: "Pabrik Baja dan Logam Manfréd Weiss, yang biasa disebut Csepel Művek, menunjukkan banyak potensi dan harus dikembangkan seluas-luasnya untuk mendukung pembangunan bangsa kita lebih lanjut."
 wuw_HUN_expand_the_hungarian_academy_of_sciences: "Perluas Akademi Ilmu Pengetahuan Hongaria"
 wuw_HUN_expand_the_hungarian_academy_of_sciences_desc: "Akademi Ilmu Pengetahuan Hongaria adalah perkumpulan terpelajar paling penting dan bergengsi di [ROOT.GetName]. Tanggung jawab utamanya adalah pengembangan ilmu pengetahuan, penyebaran temuan ilmiah, mendukung penelitian dan pengembangan, dan mewakili ilmu pengetahuan [ROOT.GetAdjective] di dalam negeri dan di seluruh dunia."
 wuw_HUN_expand_the_lignite_industry: "Memperluas Industri Lignit"
 wuw_HUN_expand_the_lignite_industry_desc: "Industri batubara lignit kami besar, namun masih relatif terbelakang. Kita harus membuka tambang dan pabrik baru, agar sumber daya alam kita tidak terbuang percuma."
 wuw_HUN_tap_newfound_oil_deposits: "Ketuk Deposit Minyak yang Baru Ditemukan"
 wuw_HUN_tap_newfound_oil_deposits_desc: "Banyak sumur minyak kecil telah ditemukan di seluruh negara kita, misalnya oleh Magyar-Amerikai Olajipari Rt, juga dikenal sebagai MAORT. Salah satu yang nyata adalah penemuan minyak Budafapusztas, yang harus dieksploitasi secepat mungkin."
 wuw_HUN_hungarian_autarky: "[ROOT.GetAdjective] Autarki"
 wuw_HUN_hungarian_autarky_desc: "Kita terlalu bergantung pada sumber minyak asing. Kita harus meniru upaya Jerman dalam mengembangkan minyak sintetis, dan memperkuat perekonomian kita sehingga kita dapat berdiri sendiri."
 wuw_HUN_invite_foreign_investors: "Undang Investor Asing"
 wuw_HUN_invite_foreign_investors_desc: "[ROOT.GetNameDefCap] terletak di jantung Eropa Timur, dan kami dapat memanfaatkan lokasi pusat kami untuk menarik investor asing yang berminat meningkatkan infrastruktur dan industri kami."
 wuw_HUN_hungarian_tradition: "[ROOT.GetAdjective] Tradisi"
 wuw_HUN_hungarian_tradition_desc: "Tradisi [ROOT.GetAdjective] berakar kuat pada pertanian yang dilakukan di Stepa Pannonia, dan kita harus berusaha melestarikan tradisi ini dan meningkatkan hasil panen kita, agar bisa berkembang lebih jauh."
 wuw_HUN_magyar_allamvasutak: "Magyar Államvasutak"
 wuw_HUN_magyar_allamvasutak_desc: "Perusahaan Kereta Api Negara kita, MÁV, harus diperluas tugasnya sehingga mereka dapat menjalankan setiap kereta api di negara ini. Dengan melakukan hal ini, kami akan memiliki kendali yang lebih besar terhadap jalur kami, dan memungkinkan pemanfaatan jaringan kereta api kami secara lebih efisien."
 wuw_HUN_expand_the_aluminum_industry: "Memperluas Industri Aluminium"
 wuw_HUN_expand_the_aluminum_industry_desc: "Kita membutuhkan semua sumber daya yang tersedia, baik untuk ekspor maupun untuk penggunaan dalam negeri. Industri aluminium kita, meskipun sudah berkembang pesat, masih memiliki ruang untuk perbaikan, dan kita harus segera mengarahkan sumber daya untuk mencapai tujuan ini."
 wuw_HUN_budapest_university_of_technology_and_economics: "Perluas Universitas Teknik Budapest"
 wuw_HUN_budapest_university_of_technology_and_economics_desc: "Kita membutuhkan pemikiran yang lebih cerdas untuk menghasilkan penemuan-penemuan terobosan yang akan membantu kita dalam menghadapi konflik-konflik di masa depan. Dengan memperluas universitas di ibu kota kita, kita dapat meningkatkan jumlah insinyur dan ilmuwan terampil untuk industri militer kita."
 wuw_HUN_the_matyasfold_fighter_factory: "Pabrik Pesawat Tempur Mátyásföld"
 wuw_HUN_the_matyasfold_fighter_factory_desc: "Weiss Manfréd Acél- és Fémművek harus membuka fasilitas produksi pesawat baru di Mátyásföld, Budapest, yang didedikasikan untuk memproduksi model pesawat tempur yang mereka kembangkan sendiri."
 wuw_HUN_expand_on_the_weiss_wm_16: "Perluas Weiss WM-16"
 wuw_HUN_expand_on_the_weiss_wm_16_desc: "Kita harus memperluas model Weiss WM-16 Budapest dalam upaya mencapai terobosan teknologi baru untuk produksi pembom kita."
 wuw_HUN_develop_the_weiss_wm_21_solyom: "Kembangkan Weiss WM-21 Sólyom"
 wuw_HUN_develop_the_weiss_wm_21_solyom_desc: "Kita harus mengambil pelajaran dari kegagalan kita sebelumnya dalam pengembangan pesawat dan menciptakan pembom ringan Weiss WM-21 Sólyom. Elang ini akan mampu menjatuhkan musuh kita dari surga, dimanapun mereka berdiri."
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil: "Weiss Manfréd WM-23 Ezüst Nyil"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc: "Kita perlu mengembangkan pesawat tempur baru sesegera mungkin, dan ilmuwan kami di Weiss Manfréd Acél- és Fémművek telah mengembangkan cetak biru untuk apa yang disebut Ezüst Nyíl, Silver Arrow, dan menunggu konfirmasi untuk memulai produksi."
 wuw_HUN_establish_the_mavag_aircraft_factory: "Mendirikan Pabrik Pesawat MÁVAG"
 wuw_HUN_establish_the_mavag_aircraft_factory_desc: "István Horthy akan berkolaborasi dengan MÁVAG untuk mendirikan pabrik baru yang didedikasikan untuk produksi pesawat terbang, dan akan segera memulai pengiriman teknologi baru ke Magyar Légierő."
 wuw_HUN_the_mavag_heja: "MÁVAG Héja"
 wuw_HUN_the_mavag_heja_desc: "Departemen pesawat terbang di MÁVAG telah mengembangkan model prototipe baru yang mereka beri nama Hawk, berdasarkan model Reggiane Re.2000 Italia. Kita harus mendukung mereka untuk memproduksi sebanyak mungkin model pesawat baru ini."
 wuw_HUN_repulo_muszaki_intezet: "Repülö Muszaki Intézet"
 wuw_HUN_repulo_muszaki_intezet_desc: "Udara telah menjadi aspek baru dalam peperangan, dan terbukti dianggap remeh oleh banyak orang. Kita harus belajar menguasai dimensi baru ini, dan mengalokasikan sumber daya untuk pengembangan doktrin dan peralatan baru yang memungkinkan kita melakukan hal tersebut."
 wuw_HUN_develop_laszlo_vargas_design: "Kembangkan Desain László Varga"
 wuw_HUN_develop_laszlo_vargas_design_desc: "Ilmuwan penerbangan kita yang hebat László Varga telah menghasilkan banyak desain asli untuk militer kita, di antaranya adalah prototipe Varga RMI-1 X/H. Kita harus mendanai kegiatannya lebih lanjut, agar perkembangan dan kemajuan kita tidak berhenti sampai di sini."
 wuw_HUN_the_szekesfehervar_sosto_plant: "Pabrik Székesfehérvár-Sóstó"
 wuw_HUN_the_szekesfehervar_sosto_plant_desc: "Kita harus membuka pabrik produksi pesawat baru yang dikendalikan oleh Aeronautic Technology Institute yang dapat memproduksi pesawat yang dirancangnya dan mengujinya untuk memastikan fungsinya dengan baik."
 wuw_HUN_joint_air_development: "Pengembangan Udara Bersama"
 wuw_HUN_joint_air_development_desc: "Cara terbaik untuk mengembangkan model pesawat baru adalah melalui kerja sama dengan sekutu kita. Dengan menyatukan para pemikir paling cemerlang dari seluruh bangsa kita, kita akan mencapai hasil terbaik."
 wuw_HUN_the_arado_ar_96: "Arado Ar 96"
 wuw_HUN_the_arado_ar_96_desc: "Kita harus mendapatkan izin produksi dari produsen pesawat [GER.GetAdjective] Arado Flugzeugwerke, dan pada gilirannya mengalihkan fokus produksi dan pemanfaatan pesawat ke arah pengintaian udara."
 wuw_HUN_extensive_licensing_programs: "Program Perizinan yang Luas"
 wuw_HUN_extensive_licensing_programs_desc: "Angkatan udara asing telah menunjukkan bahwa mereka memiliki desain berkualitas tinggi yang telah teruji dan terbukti. Daripada mencobai nasib dan mengandalkan keahlian penerbangan yang baru kita miliki, kita harus meminta izin untuk memproduksi model asing ini di bawah lisensi."
 wuw_HUN_allied_manufacturing_programs: "Program Manufaktur Sekutu"
 wuw_HUN_allied_manufacturing_programs_desc: "Industri kita mungkin kuat jika berdiri sendiri, namun tidak mampu bersaing dengan kekuatan dunia mana pun. Oleh karena itu, kita harus memproduksi pesawat baru di fasilitas sekutu, dengan imbalan pembayaran kembali di Pengö."
 wuw_HUN_danuvia_submachine_guns: "Senapan Mesin Ringan Danuvia"
 wuw_HUN_danuvia_submachine_guns_desc: "Infanteri kita membutuhkan persenjataan yang baik untuk meningkatkan efektivitasnya. Prototipe awal Danuvia 43M telah menunjukkan kinerja yang baik dalam pengujian, dan dengan meningkatkan pendanaan untuk pengembangannya, kami mungkin dapat segera mulai memproduksi senjata tersebut secara massal."
 wuw_HUN_form_the_gyorshadtest: "Bentuk tes Gyorshad"
 wuw_HUN_form_the_gyorshadtest_desc: "Kita harus berusaha untuk membentuk Korps Cepat, unit mekanis yang modern dan lengkap, yang dapat mengungguli batalion musuh dalam pertempuran. Dengan demikian, dua divisi Gyorshadtest akan dibentuk, satu di bawah Mayor Jenderal Jenö Major, dan yang lainnya di bawah Mayor Jenderal Ferenc Bisza."
 wuw_HUN_establish_the_mavag_army_division: "Bentuk Divisi Angkatan Darat MÁVAG"
 wuw_HUN_establish_the_mavag_army_division_desc: "Pabrik Besi, Baja dan Mesin Negara Kerajaan Hongaria, juga dikenal dengan akronim MÁVAG, melakukan banyak tugas terpisah dan memasok berbagai macam peralatan kepada militer kita. Kita harus meminta lebih banyak perluasan fasilitas mereka, sehingga mereka dapat mulai membantu produksi senjata serbu self-propelled dan tank anti-udara."
 wuw_HUN_doctrinal_studies: "Studi Doktrinal"
 wuw_HUN_doctrinal_studies_desc: "Kami telah belajar banyak dari pertukaran perwira dan sesi strategi dengan sekutu kami, serta melalui badan intelijen militer kami. Menggabungkan sudut pandang yang berbeda-beda tersebut telah menempatkan kita di ambang terobosan doktrinal."
 wuw_HUN_award_military_promotions: "Penghargaan Promosi Militer"
 wuw_HUN_award_military_promotions_desc: "Memang ada banyak orang hebat di militer [ROOT.GetAdjective], namun banyak dari mereka saat ini tidak memegang posisi yang setara dengan nilai yang pantas mereka dapatkan. Oleh karena itu kita harus mengambil langkah-langkah untuk mendukung mereka yang kita anggap cocok, dan membuat tentara kita lebih kuat dari sekarang."
 wuw_HUN_magyar_kiralyi_csendorseg: "Magyar Királyi Csendörség"
 wuw_HUN_magyar_kiralyi_csendorseg_desc: "Kita harus berupaya untuk memperluas [ROOT.GetAdjective] Gendarmerie, dan memberi mereka lebih banyak otonomi, dan memberi mereka lebih banyak kebebasan untuk memilih bagaimana bertindak ketika menumpas pemberontakan dan melawan pasukan skirmisher musuh."
 wuw_HUN_legacy_of_the_black_legion: "Warisan Tentara Hitam"
 wuw_HUN_legacy_of_the_black_legion_desc: "Agar kavaleri dan polisi militer kita berfungsi lebih baik, kita harus mencontoh mereka seperti Tentara Hitam raja legendaris kita Matthias Corvinus, yang pada gilirannya terinspirasi oleh militer besar jenderal Romawi dan legiun kaisar Julius Caesars."
 wuw_HUN_light_infantry_divisions_doctrine: "Doktrin Divisi Infanteri Ringan"
 wuw_HUN_light_infantry_divisions_doctrine_desc: "Kita harus puas dengan keterbatasan tenaga kerja yang kita miliki. Jika kita menginginkan lebih banyak divisi, maka divisi tersebut harus lebih kecil. Divisi infanteri ringan memberikan perpaduan optimal antara kekuatan dan ukuran serangan, dan kami akan menjadikannya sebagai tulang punggung militer kami."
 wuw_HUN_szent_laszlo_infantry_division: "Divisi Infanteri Szent László"
 wuw_HUN_szent_laszlo_infantry_division_desc: "Kita harus berusaha membentuk unit infanteri baru untuk mempertahankan tanah air kita dari ancaman yang akan datang. Kita dapat menamai divisi infanteri baru ini dengan nama Santo Ladislaus, Raja Hongaria dari tahun 1077 hingga 1095 dan santo pelindung para prajurit dan orang buangan."
 wuw_HUN_quantity_over_quality: "Kualitas Dibanding Kuantitas"
 wuw_HUN_quantity_over_quality_desc: "Meskipun pasukan kita mungkin tidak sebesar itu, mereka masih bisa menjadi kuat dan mampu mengimbanginya. Caranya adalah dengan meningkatkan keunggulan teknologi kita atas musuh, dan memanfaatkan unit-unit mutakhir yang mampu mengalahkan unit musuh yang jumlahnya jauh lebih banyak."
 wuw_HUN_expand_the_army: "Perluas Honvédség"
 wuw_HUN_expand_the_army_desc: "Pasukan tetap kita saat ini, Honvéd, terlalu kecil untuk mempunyai peluang melawan tetangga kita. Oleh karena itu kita harus berupaya meningkatkan jumlah tentara secepat mungkin."
 wuw_HUN_the_botond: "Botond"
 wuw_HUN_the_botond_desc: "Untuk memenuhi kebutuhan pasokan dan transportasi secara memadai, kami memerlukan truk berbentuk baru. Versi awal desain Rába 38M Botond telah terbukti berhasil dalam uji coba, dan dengan sumber daya yang sesuai kami dapat menyelesaikan desain dan memulai produksi."
 wuw_HUN_the_turan: "Turan"
 wuw_HUN_the_turan_desc: "Dengan menggunakan basis prototipe tank medium Škoda T-21, kita dapat membuat tank medium milik kita sendiri, yang mampu menembus garis pertahanan musuh yang paling dijaga ketat sekalipun. Kami akan menamai proyek baru ini sebagai upaya untuk mempromosikan Turanisme Hongaria, dan menyebarkannya ke seluruh dunia."
 wuw_HUN_assault_gun_focus: "Fokus Senapan Serbu"
 wuw_HUN_assault_gun_focus_desc: "Daripada fokus pada tank yang lengkap, kami akan mengandalkan senjata serbu untuk membantu infanteri kami dalam melakukan terobosan, sebagai alternatif yang lebih hemat biaya."
 wuw_HUN_the_toldi: "Toldi"
 wuw_HUN_the_toldi_desc: "Dengan menggunakan pangkalan Landsverk L-60 Swedia, kita dapat membuat tank ringan milik kita sendiri, yang mampu dengan cepat mengepung musuh dalam jumlah besar. Kami akan menamai tank baru ini dengan nama ksatria Hongaria abad ke-14, Miklós Toldi."
 wuw_HUN_invest_in_the_special_forces: "Berinvestasilah pada Pasukan Khusus"
 wuw_HUN_invest_in_the_special_forces_desc: "Tentara kita sekarang mempunyai orang-orang yang dibutuhkan untuk melakukan perlawanan yang layak, namun akan sangat bermanfaat bagi kita untuk melatih tentara baru kita menjadi sekuat mungkin, berinvestasi dalam program pasukan khusus yang baru."
 wuw_HUN_construct_the_arpad_line: "Bangun Jalur Árpád"
 wuw_HUN_construct_the_arpad_line_desc: "Untuk melindungi rakyat kita dari ancaman di timur, kita harus membangun benteng yang luas di pegunungan Transylvania. Nama mereka akan diambil dari nama Pangeran Agung Árpád, kepala konfederasi suku Magyar pada pergantian abad ke-9 dan ke-10."
 wuw_HUN_transylvanian_mountaineers: "Pendaki Gunung Transylvania"
 wuw_HUN_transylvanian_mountaineers_desc: "Pegunungan Transylvania termasuk yang tertinggi di wilayah kami, dan merupakan tempat yang sempurna bagi kami untuk melatih pasukan gunung kami."
 wuw_HUN_expand_the_arpad_line: "Perluas Jalur Árpád"
 wuw_HUN_expand_the_arpad_line_available_tt: "Dapat membangun minimal 2 §YLand Forts§! di sepanjang perbatasan Utara dan Timur §Y[73.GetName]§! dan §Y[76.GetName]§!"
 wuw_HUN_expand_the_arpad_line_desc: "Garis Árpád sejauh ini telah terbukti efektif, namun jika kita ingin benar-benar mampu membendung gelombang serangan, kita harus memperluasnya, tidak hanya dalam ukuran, namun juga dalam jangkauan."
 wuw_HUN_construct_the_szeretfalva_deda_railway_line: "Jalur Kereta Api Szeretfalva-Déda"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc: "Untuk memberikan pasokan yang lebih baik kepada pasukan perbatasan yang berjaga di Jalur Árpád di pegunungan Transylvania, kita harus membangun jalur kereta api baru dan pusat pasokan agar pasukan kita dapat menjaga keamanan rakyat kita dengan lebih baik."
 wuw_HUN_the_szekel_command: "Komando Szekler"
 wuw_HUN_the_szekel_command_desc: "Dengan penaklukan kembali [76.GetName] dan Tanah Székely yang baru-baru ini kami lakukan, kami memiliki kemampuan untuk menempatkan penduduk Székely kami, orang Hongaria yang ahli dalam navigasi dan pertempuran di pegunungan, untuk bekerja sebagai pasukan elit di angkatan bersenjata kami."
 wuw_HUN_renew_the_shipping_industry: "Memperbarui Industri Perkapalan"
 wuw_HUN_renew_the_shipping_industry_desc: "Dengan pandangan kita yang tertuju pada pemulihan perbatasan kita, kita harus memulai tugas mengembangkan armada Mediterania untuk menyaingi kejayaan kita di masa lalu."
 wuw_HUN_embrace_navy_traditions: "Merangkul Tradisi Angkatan Laut"
 wuw_HUN_embrace_navy_traditions_desc: "Kita tidak bisa membuang waktu untuk bereksperimen dengan teknologi baru dan belum terbukti. Kami akan tetap menggunakan desain yang telah dicoba dan diuji dari zaman Kekaisaran lama."
 wuw_HUN_a_reformed_navy: "Angkatan Laut Reformasi"
 wuw_HUN_a_reformed_navy_desc: "Tidak masuk akal untuk menciptakan angkatan laut yang dibangun berdasarkan ide-ide yang sudah ketinggalan zaman. Kita telah diberi kesempatan untuk menciptakan angkatan laut baru dari awal, tanpa membebani angkatan laut yang lama. Kita harus menggunakannya untuk membangun angkatan laut yang paling modern dan mampu."
 wuw_HUN_invest_in_destroyer_models: "Berinvestasi dalam Model Penghancur"
 wuw_HUN_invest_in_destroyer_models_desc: "Kapal perusak adalah bagian penting dari armada, namun sering diabaikan. Ditambah dengan biayanya yang rendah, hal ini merupakan awal yang baik untuk setiap program ekspansi angkatan laut."
 wuw_HUN_cruiser_investments: "Investasi Kapal Penjelajah"
 wuw_HUN_cruiser_investments_desc: "Bahkan kekuatan yang paling kuat pun tidak ada gunanya jika tidak dapat menemukan musuh atau melindungi diri dari pesawat. Merancang kapal penjelajah ringan dan berat baru membantu kami mengubah kumpulan kapal menjadi armada sebenarnya."
 wuw_HUN_wolfs_of_the_sea: "Serigala Laut"
 wuw_HUN_wolfs_of_the_sea_desc: "Kapal selam nyaris mengalahkan angkatan laut paling kuat di dunia dalam perang terakhir. Kita tidak bisa dianggap serius sebagai angkatan laut modern jika kita tidak memiliki kapal selam sendiri."
 wuw_HUN_bringing_the_air_battle_to_the_seas: "Membawa Pertempuran Udara ke Laut"
 wuw_HUN_bringing_the_air_battle_to_the_seas_desc: "Kapal perang itu adalah peninggalan masa lalu. Masa depan peperangan laut terletak pada kapal induk dan pesawat terbangnya. Kami akan menjadi yang terdepan dalam perkembangan ini."
 wuw_HUN_capital_ship_efforts: "Upaya Kapal Modal"
 wuw_HUN_capital_ship_efforts_desc: "Inti dari angkatan laut adalah kapal perang. Kita harus mengganti waktu yang hilang dan memulai pembangunan kapal baru sesegera mungkin."
 wuw_HUN_a_new_pride_of_the_fleet: "Armada Kebanggaan Baru"
 wuw_HUN_a_new_pride_of_the_fleet_desc: "Sejarah tradisi angkatan laut kita adalah sebuah cobaan, kesengsaraan, dan pengkhianatan. Dalam upaya mengembalikan kebanggaan terhadap warisan budaya kita, laksamana kita mengusulkan sebuah kapal baru yang dapat menginspirasi seluruh bangsa."
 wuw_HUN_degauss_ship_hulls: "Lambung Kapal Degauss"
 wuw_HUN_degauss_ship_hulls_desc: "Kami akan mulai melakukan degauss pada lambung kapal kami, mengurangi sifat magnetisnya. Hal ini melindungi mereka dari ranjau magnet dan mengurangi profil elektronik kapal."
 wuw_HUN_continue_the_regency: "Lanjutkan Kabupaten"
 wuw_HUN_continue_the_regency_desc: "Sejak Laksamana Horthy mengambil alih kepemimpinan selama Perang Saudara yang menimpa negara kita pada awal tahun 20an, [HUN.GetNameDef] telah kembali ke jalur yang benar, terlepas dari dampak kehancuran Wall Street yang menimpa negara kita. Kabupaten ini harus terus berjalan jika kita ingin kesejahteraan terus berlanjut."
 wuw_HUN_strengthen_horthys_reign: "Perkuat Pemerintahan Horthy"
 wuw_HUN_strengthen_horthys_reign_desc: "Meskipun perdana menteri kita yang fasis mungkin punya ide lain, cara terbaik untuk menjaga perdamaian di negara ini dan mengembalikan [ROOT.GetNameDef] ke kejayaannya adalah dengan memperkuat kendali bupati, dan secara pribadi memastikan bahwa keinginannya terlaksana."
 wuw_HUN_pass_statute_xix: "Lulus Statuta XIX"
 wuw_HUN_pass_statute_xix_desc: "Mengingat [ROOT.GetLeader] sedang sakit, akan bermanfaat untuk mengesahkan Statuta XIX tentang pembentukan Dewan Nasional ketika kursi Bupati kosong, sehingga memungkinkan kita untuk membentuk Országtanács yang akan memilih bupati baru setelah bupati kita saat ini meninggal. Beberapa orang mungkin melihat ini sebagai upaya mendirikan dinasti, tapi kami setuju dengan hal itu."
 wuw_HUN_restrict_voting_rights: "Batasi Hak Pilih"
 wuw_HUN_restrict_voting_rights_desc: "Untuk menghentikan pertumbuhan pengaruh komunis dan demokrasi sayap kiri, kita perlu membatasi hak memilih, memperketat persyaratan, dan memastikan bahwa hanya mereka yang mempunyai pemikiran terbaik yang boleh ambil bagian dalam pemilu."
 wuw_HUN_renounce_the_treaty_of_trianon: "Menolak Perjanjian Trianon"
 wuw_HUN_renounce_the_treaty_of_trianon_desc: "Ketidakadilan yang menimpa negara kita pada akhir Perang Besar, yang merenggut dua pertiga wilayah dan populasi negara kita yang pernah menjadi negara besar, menyaingi aib yang menimpa Jerman dalam Perjanjian Versailles, dan hal ini harus dihilangkan."
 wuw_HUN_renew_the_rome_protocols: "Memperbarui Protokol Roma"
 wuw_HUN_renew_the_rome_protocols_desc: "Mengingat revisionisme [GER.GetNameDef] yang terus berlanjut, kita harus memperbarui Protokol Roma yang dibuat dan ditandatangani pada tahun 1934. Perjanjian tersebut tidak hanya akan berfungsi untuk semakin mengisolasi ancaman [GER.GetAdjective] dan [YUG.GetAdjective], namun juga sebagai kemungkinan pendahulu bagi aliansi yang sebenarnya."
 wuw_HUN_join_the_axis: "Bergabunglah dengan Poros"
 wuw_HUN_join_the_axis_desc: "Karena perekonomian kita sudah sangat bergantung pada Jerman, maka masuk akal jika kita mengikuti jejak mereka dalam perang. Kami akan mengirimkan mereka permintaan untuk masuk secara resmi ke dalam aliansi Poros."
 HUN_can_not_trust_germany_again_flag: "Jerman Mengeksploitasi kami untuk keuntungan pribadi mereka"
 wuw_HUN_an_alliance_with_italy: "Aliansi Dengan [ITA.GetNameDef]"
 wuw_HUN_an_alliance_with_italy_desc: "Tawaran awal menuju aliansi yang dibuat dalam Protokol Roma kini dapat diperluas. Kami akan mengirimkan delegasi ke Italia untuk membahas perjanjian yang mengikat untuk kerja sama militer yang luas, baik secara defensif maupun ofensif."
 wuw_HUN_joint_aluminum_mining_company: "Perusahaan Tambang Aluminium Bersama"
 wuw_HUN_joint_aluminum_mining_company_desc: "Karena aluminium merupakan bagian integral dari industri perang modern, kami dapat dengan mudah memperoleh dukungan [GER.GetAdjective] untuk memperluas tambang di bagian utara negara kami."
 wuw_HUN_reestablish_the_rongyos_garda: "Membangun kembali Rongyos Gárda"
 wuw_HUN_reestablish_the_rongyos_garda_desc: "Paramiliter Ragged Guard pertama kali didirikan pada tahun 1921 untuk melawan Perjanjian Trianon, membantu kami melawan Austria di Lajtabánság, serta berperang bersama Tentara Nasional Horthys selama Perang Saudara. Kapten mereka Pál Prónay kini siap membantu kami sekali lagi, dan dengan demikian kami akan mendapat manfaat dari pembentukan kembali kelompok tersebut."
 wuw_HUN_the_hungarian_life_and_renewal_party: "Pesta Kehidupan dan Pembaruan Hongaria"
 wuw_HUN_the_hungarian_life_and_renewal_party_desc: "Untuk menjaga cengkeraman yang lebih baik terhadap masyarakat, kita harus meminta perdana menteri kita membentuk partai politik baru untuk bertindak sebagai garda depan melawan kelompok kiri radikal."
 wuw_HUN_act_of_defense: "Tindakan Pertahanan"
 wuw_HUN_act_of_defense_desc: "Ketika dunia sedang memanas dan konflik mulai terjadi, kita harus mempersiapkan diri menghadapi badai yang akan datang. Sudah waktunya kita memberlakukan undang-undang baru yang akan membantu kita dalam membela negara kita, hingga orang terakhir jika diperlukan!"
 wuw_HUN_seek_german_contracts: "Carilah [GER.GetAdjective] Kontrak"
 wuw_HUN_seek_german_contracts_desc: "Industri kita kembali bertumbuh, namun jika kita ingin mampu memproduksi semua peralatan yang kita perlukan, akan bermanfaat jika kita mengontrak arsitek [GER.GetAdjective] dan perusahaan konstruksi untuk membangun fasilitas baru."
 wuw_HUN_license_fiat_tankettes: "Tanket Fiat"
 wuw_HUN_license_fiat_tankettes_desc: "Untuk memperkuat industri militer kita dan memperluas batalion pengintaian kita, akan lebih bijaksana jika kita bekerja sama dengan perusahaan kendaraan [ITA.GetAdjective] Fiat untuk memproduksi tank ringan dan tanket untuk kelompok mekanis baru kita."
 wuw_HUN_strenghten_the_order_of_vitez: "Perkuat Ordo Vitéz"
 wuw_HUN_strenghten_the_order_of_vitez_desc: "Urutan jasa yang didirikan pada tahun 1920, Vitézi Rend, saat ini dipimpin oleh Yang Mulia Miklós Horthy. Dia dapat mengarahkan lebih banyak dana dan pasukan kepada para komandan yang merupakan bagian dari ordo tersebut, untuk memperkuat mereka sebaik mungkin."
 wuw_HUN_absolute_rule_of_the_national_unity_party: "Memanfaatkan Partai Persatuan Nasional"
 wuw_HUN_absolute_rule_of_the_national_unity_party_desc: "Dengan memanfaatkan partai politik perdana menteri saat ini, Egységes Párt, [ROOT.GetLeader] dapat mempertahankan kontrol yang kuat atas politik [ROOT.GetAdjective], secara efektif memonopoli situasi tanpa sepenuhnya melarang pemilu."
 wuw_HUN_spur_on_the_trianon_trauma: "Pacu Trauma Trianon"
 wuw_HUN_spur_on_the_trianon_trauma_desc: "Sudah menjadi rahasia umum bahwa [ROOT.GetNameDef] dulu lebih baik dibandingkan sekarang. Dalam Perjanjian Trianon yang terkutuk itu, kami kehilangan dua pertiga tanah kami yang sah kepada tetangga kami yang memanfaatkan posisi rentan kami. Mereka semua akan merasakan ketakutan, hari dimana tentara [ROOT.GetAdjective] datang berbaris untuk merebut semuanya kembali!"
 wuw_HUN_outlaw_the_party_of_national_will: "Melarang Partai Kehendak Nasional"
 wuw_HUN_outlaw_the_party_of_national_will_desc: "Partai Sosialis Nasional Kehendak Nasional yang dipimpin oleh Ferenc Szálasi merupakan ancaman terhadap pemerintahan kita saat ini, karena mereka lebih populer di kalangan [GER.GetAdjective] Nazi dan tidak menyukai pemerintahan pemimpin kita saat ini yang hampir absolut."
 wuw_HUN_carrying_on_arpads_legacy: "Melanjutkan Warisan Árpád"
 wuw_HUN_carrying_on_arpads_legacy_desc: "Árpád yang agung, kepala konfederasi suku Magyar pada pergantian abad ke-9 dan ke-10 adalah inspirasi besar bagi [ROOT.GetLeader], dan dinastinya bertahan dalam waktu yang lama, menjadikan [ROOT.GetnameDef] menjadi yang terbaik. Kita harus mengambil satu halaman dari bukunya dan mengikuti teladannya."
 wuw_HUN_the_turul_association: "Asosiasi Turul"
 wuw_HUN_the_turul_association_desc: "Asosiasi Turul didirikan sebagai gerakan universitas pada tahun 1919, di Budapest. Mereka dengan tegas mendukung Miklós Horthy selama Perang Saudara, dan dalam pertempuran Budaőrs pada musim gugur tahun 1921. Dengan sekitar 40.000 anggota, kita dapat memanfaatkan mereka untuk mengontrol pendidikan di negara kita."
 wuw_HUN_demand_transylvania: "Permintaan Transilvania"
 wuw_HUN_demand_transylvania_desc: "Jika kita bisa mendapatkan kembali wilayah kita yang hilang setelah Perang Besar tanpa pertumpahan darah, itu lebih baik. Penghuni yang tidak sah atas saudara-saudara Székely kami akan diberi ultimatum yang menuntut pengalihan tanah hak kami."
 wuw_HUN_strengthen_the_turani_vadaszok: "Perkuat Turáni Vadászok"
 wuw_HUN_strengthen_the_turani_vadaszok_desc: "Pada tahun 1927, Gyula Gömbös mendirikan kekuatan paramiliter fasis dengan nama Asosiasi Pemburu Turanian. Meskipun fasis, mereka menentang gagasan sosialisme nasional Jerman, dan dibangun di atas cita-cita Hongaria dan Turanisme Hongaria. Kita dapat menggunakannya untuk keuntungan kita jika kita menginginkannya."
 wuw_HUN_demand_southern_slovakia: "Permintaan [664.GetName]"
 wuw_HUN_demand_southern_slovakia_desc: "Etnis minoritas [ROOT.GetAdjective] di [664.GetName] saat ini dianiaya dan dimanfaatkan oleh pemerintah pendudukan, dan oleh karena itu, kita harus memastikan bahwa [ROOT.GetAdjective] dan wilayah tempat mereka tinggal sekali lagi berada di bawah kendali kita."
 wuw_HUN_claim_overlordship_over_slovakia: "Klaim Kekuasaan Atas [SLO.GetNameDef]"
 wuw_HUN_claim_overlordship_over_slovakia_desc: "Sisa wilayah Slovakia juga harus diintegrasikan kembali ke dalam negara Hongaria, baik secara langsung atau dengan menjadi negara ketergantungan. Kami akan mengirimkan ultimatum lagi."
 wuw_HUN_invite_german_investors: "Undang [GER.GetAdjective] Investor"
 wuw_HUN_invite_german_investors_desc: "Sebagaimana telah ditetapkan dalam perjanjian perdagangan kami sebelumnya, hanya [GER.GetAdjective] dan [ROOT.GetAdjective] yang diizinkan untuk melakukan prospek di negara kami saat ini. Oleh karena itu, paling tidak bijaksana untuk memanfaatkan hal ini dan mengundang investor ke negara kita."
 wuw_HUN_protect_austria: "Lindungi [AUS.GetNameDef]"
 wuw_HUN_protect_austria_desc: "Untuk lebih menentang [GER.GetNameDef] kita harus menolak ambisi terbuka mereka untuk bersatu dengan [AUS.GetNameDef]. Kami dapat memberi mereka jaminan, memberikan pemerintah saat ini kekuatan politik yang mereka perlukan agar dapat melawan unsur-unsur pro-[GER.GetAdjective], asalkan mereka mengembalikan Burgenland kepada kami."
 wuw_HUN_proclaim_greater_hungary: "Proklamasikan Hongaria Raya"
 wuw_HUN_proclaim_greater_hungary_desc: "Setelah mendapatkan kembali wilayah yang menjadi hak kami, ukuran negara kami telah meningkat hingga mencapai batas sejarah kami. Kini kita dapat dengan penuh percaya diri memproklamirkan pembentukan Hongaria Raya kepada dunia, dan mengarahkan pandangan kita pada target-target baru."
 wuw_HUN_demand_the_return_of_slovakia: "Permintaan Integrasi [SLO.GetAdjective]"
 wuw_HUN_demand_the_return_of_slovakia_desc: "Untuk waktu yang sangat lama, [SLO.GetNameDef] merupakan bagian dari Hongaria Raya, dan sekarang kita sekali lagi mengejar posisi kita di dunia, kita harus menegaskan kepemilikan kita atas wilayah tersebut."
 wuw_HUN_promote_hungarianism: "Mempromosikan Hongaria"
 wuw_HUN_promote_hungarianism_desc: "Untuk sekali lagi mendapatkan kembali kejayaan kita di masa lalu, kita harus mendukung mereka yang menginginkan hal yang lebih dari itu, betapapun radikalnya mereka. Oleh karena itu, kita harus mempromosikan gagasan-gagasan Hongaria yang baru muncul, yang dikembangkan berdasarkan ajaran uskup Katolik Ottokár Prohászka, dan gagasannya untuk membela kepentingan Hongaria, apa pun risikonya."
 wuw_HUN_demand_the_vojvodina: "Minta Vojvodina"
 wuw_HUN_demand_the_vojvodina_desc: "Wilayah Bácska telah lama menjadi bagian integral dari negara kami, namun wilayah tersebut diambil alih oleh pemerintah [YUG.GetAdjective] setelah Perang Besar berakhir. Kita harus menghilangkan ketidakadilan historis ini, dan merebut kembali apa yang menjadi milik kita!"
 wuw_HUN_demand_carpathian_ruthenia: "Permintaan Rutenia Carpathia"
 wuw_HUN_demand_carpathian_ruthenia_desc: "[ROOT.GetAdjective] di wilayah Carpathian Ruthenia sudah terlalu lama mengalami penindasan di bawah rezim asing, sejak Republik Hutsul yang pengkhianat mendeklarasikan kemerdekaannya dari kami pada tahun 1919. Kami harus merebut kembali tanah ini, demi rakyat kami!"
 wuw_HUN_demand_burgenland: "Permintaan Burgenland"
 wuw_HUN_demand_burgenland_desc: "Rongyos Gárda yang pemberani pernah mendirikan Lajtabánság pada akhir Perang Besar dalam upaya untuk menguasainya dan mengembalikan kekuasaan [HUN.GetAdjective] atas wilayah tersebut, namun kemudian wilayah tersebut dilucuti dari kami dan dimasukkan ke dalam Austria. Kita harus merebut kembali wilayah ini, jika kita ingin mendapatkan kembali harga diri kita."
 wuw_HUN_reaffirm_territorial_claims: "Menegaskan Kembali Klaim Teritorial"
 wuw_HUN_reaffirm_territorial_claims_desc: "Dengan penolakan Perjanjian Trianon, kita sekarang harus melanjutkan untuk menegaskan kembali klaim kita atas wilayah yang dicuri dari kita."
 wuw_HUN_end_the_regency: "Akhiri Kabupaten"
 wuw_HUN_end_the_regency_desc: "Horthy telah menjalani masa jabatan yang baik sebagai bupati, namun akhirnya tiba saatnya untuk sekali lagi mencari raja yang bersedia mengambil takhta [ROOT.GetAdjective]. Entah itu Habsburg, atau seseorang yang lebih sesuai dengan keinginan Little Entente, kita membutuhkan raja baru."
 wuw_HUN_crack_down_on_radicals: "Menindak Kaum Radikal"
 wuw_HUN_crack_down_on_radicals_desc: "Ada banyak milisi dan organisasi politik di negara ini yang menentang pemulihan monarki. Kita harus memastikan untuk membatasi pengaruh mereka dan membubarkan kelompok paramiliter mana pun agar mereka tidak menjadi masalah bagi kita di kemudian hari."
 wuw_HUN_reach_out_to_candidates: "Jangkau Kandidat"
 wuw_HUN_reach_out_to_candidates_desc: "Kita harus membentuk komite yang bertugas mencari calon takhta potensial. Kandidat yang paling jelas adalah Otto, pewaris kerajaan Habsburg saat ini dan Joseph August, raja terbaru kita, juga seorang Habsburg. Namun Entente Kecil melarang kita memiliki raja keturunan Habsburg, jadi kita mungkin harus mencari kemungkinan lain."
 wuw_HUN_subvert_gombos_troops: "Tumbangkan Pasukan Gömbös"
 wuw_HUN_subvert_gombos_troops_desc: "Perdana Menteri yang fasis dan ekstremis Gyula Gömbös bertanggung jawab atas beberapa milisi paramiliter, yang terbesar adalah Asosiasi Pertahanan Nasional Hongaria. Kita harus memastikan untuk melenyapkan kelompok-kelompok ini sebelum mereka menjadi ancaman bagi kerajaan baru kita."
 wuw_HUN_reinstate_the_pragmatic_sanction: "Kembalikan Sanksi Pragmatis tahun 1713"
 wuw_HUN_reinstate_the_pragmatic_sanction_desc: "Sanksi Pragmatis tahun 1713 dikeluarkan oleh Kaisar Romawi Suci Charles VI, untuk memastikan bahwa monarki Habsburg dapat diwarisi oleh seorang putri yang tidak terbagi, yang pada dasarnya menganggap bangsa kita sebagai tanah Habsburg untuk masa depan. Setelah upaya kudeta Charles IV gagal, hal ini dicabut. Untuk memulihkan kekuasaan tersebut, kita harus berusaha untuk menerapkannya kembali, yang bertentangan dengan keinginan Entente Kecil."
 wuw_HUN_aid_the_carlist_struggle: "Membantu Perjuangan Carlist"
 wuw_HUN_aid_the_carlist_struggle_desc: "Kaum Carlist Spanyol melakukan perjuangan mulia untuk memulihkan nilai-nilai tradisional bangsa mereka dan sekali lagi menempatkan raja yang tepat di atas takhta mereka. Jika kita menginginkan sekutu potensial di kawasan ini di masa depan, akan lebih bijaksana jika kita membantu faksi yang sangat dekat dengan kita dalam perjuangan mereka meraih kemenangan dalam Perang Saudara di Spanyol."
 wuw_HUN_invite_otto_to_the_throne: "Undang Otto ke Tahta"
 wuw_HUN_invite_otto_to_the_throne_desc: "Habsburg telah lama memerintah Hongaria, dan di bawah pemerintahan mereka, negara ini merupakan bagian dari salah satu kerajaan terbesar di Eropa. Mengembalikan kepemimpinan Habsburg yang memiliki niat memulihkan Austria-Hongaria pasti akan membawa kita menuju kejayaan sekali lagi. Sebagai pewaris sah seluruh Kekaisaran, dia akan menjadi kunci pemulihan Austria-Hongaria."
 wuw_HUN_attempt_economic_independence: "Mencoba Kemandirian Ekonomi"
 wuw_HUN_attempt_economic_independence_desc: "Jika kita ingin mendapatkan kembali kejayaan kita, kita tidak bisa bergantung pada kekuatan asing untuk meningkatkan dan menjalankan perekonomian kita. Hanya dengan tangan kitalah negara kita bisa berkembang kembali!"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen: "Tanah Mahkota Santo Stefanus"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc: "Sebagai bagian dari Kekaisaran Austro-Hungaria, kami dikenal sebagai Tanah Mahkota Santo Stefanus, atau singkatnya, Transleithania. Sebagai langkah pertama dalam reklamasi kekaisaran, kita harus berusaha untuk sekali lagi mengadopsi nama ini. Itu akan menunjukkan kepada dunia apa niat kita sebenarnya."
 wuw_HUN_the_old_habsburg_king: "Raja Habsburg Lama"
 wuw_HUN_the_old_habsburg_king_desc: "Adipati Agung Joseph August dari Austria adalah Palatine terakhir Hongaria, dan merupakan Reichsverweser Charles sampai Entente menuntut pengunduran dirinya karena mereka tidak mengakui raja Habsburg. Sekarang, dia siap untuk sekali lagi naik takhta, dan memerintah Hongaria sebagai raja sucinya. Sebagai mantan Feldmarschall, pengetahuannya tentang peperangan pasti akan berguna."
 HUN_feldmarchall_augusts_expertise: "Keahlian Feldmarschall Joseph August"
 wuw_HUN_secure_army_loyalty: "Amankan Loyalitas Tentara"
 wuw_HUN_secure_army_loyalty_desc: "Untuk memastikan bahwa tentara berada di pihak kita, memungkinkan kita berinvestasi dengan aman di dalamnya, kita harus memastikan untuk melepaskan diri dari komandan mana pun yang kesetiaannya kepada mahkota bahkan hampir dipertanyakan."
 wuw_HUN_royal_hussars: "Prajurit Hussar Kerajaan"
 wuw_HUN_royal_hussars_desc: "Masyarakat kita memiliki tradisi panjang dan membanggakan dalam menggunakan kavaleri, dan saat ini pun demikian. Pasukan elit kavaleri harus diciptakan yang dapat berfungsi sebagai pengawal kerajaan yang menjamin keselamatan Yang Mulia."
 wuw_HUN_abide_by_the_little_ententes_stipulations: "Patuhi Ketentuan Entente Kecil"
 wuw_HUN_abide_by_the_little_ententes_stipulations_desc: "Sejak berakhirnya Perang Besar, Entente Kecil, yang terdiri dari Rumania, Cekoslowakia, dan Yugoslavia telah menetapkan bahwa kita tidak dapat lagi memiliki raja Habsburg. Sejujurnya, itu cocok untuk kami, karena kami sedang memikirkan calon takhta lainnya."
 wuw_HUN_elect_a_democratic_king: "Pilih Raja Demokrat"
 wuw_HUN_elect_a_democratic_king_desc: "Kita harus mencari seorang Raja yang akan menjunjung tinggi prinsip-prinsip demokrasi bangsa kita dan hak-hak rakyat kita, dan untuk melakukan hal ini kita harus mengalihkan pandangan kita ke monarki konstitusional sosial demokrat di Eropa utara, dan melihat apakah mereka mempunyai kandidat potensial untuk kita tawarkan tahta kita."
 wuw_HUN_honor_the_great_war_veterans: "Hormatilah Para Veteran Perang Besar"
 wuw_HUN_honor_the_great_war_veterans_desc: "Meskipun para komandan baru dan cerdas memegang masa depan di tangan mereka, kita tidak bisa melupakan hutang budi kita kepada para veteran Perang Besar, yang berjuang demi kita untuk melindungi tanah air rakyat kita. Kita harus menghiasinya, dan memastikan bahwa lebih banyak lagi orang yang ingin menjadi seperti sekarang ini di masa depan."
 wuw_HUN_the_legacy_of_the_isonzo_front: "Warisan Front Isonzo"
 wuw_HUN_the_legacy_of_the_isonzo_front_desc: "Yang Mulia Joseph August mengabdi pada Austria-Hongaria dan memimpin banyak pertempuran di front Rusia, Serbia, dan Italia. Namun yang paling penting, ia menemukan taktik yang digunakan dalam banyak pertempuran di Isonzo menginspirasi, dan berupaya menerapkan strategi militer yang dirumuskan di garis depan."
 wuw_HUN_the_bastion_of_catholicism: "Benteng Katolik"
 wuw_HUN_the_bastion_of_catholicism_desc: "Negara kita mayoritas beragama Katolik, begitu pula rajanya. Sudah saatnya Kerajaan Apostolik Hongaria mengambil posisi sebagai pembela agama Kristen, dan mengusir komunis yang tidak bertuhan dari benua kita."
 wuw_HUN_enact_agrarian_reform: "Menetapkan Reforma Agraria"
 wuw_HUN_enact_agrarian_reform_desc: "Sektor agraria kita mempunyai banyak ruang untuk perbaikan. Menyederhanakannya dan meningkatkan efisiensinya akan membebaskan tenaga kerja yang dapat dipekerjakan di sektor lain, seperti konstruksi dan produksi senjata."
 wuw_HUN_demand_austrian_restoration: "Menuntut Restorasi Austria"
 wuw_HUN_demand_austrian_restoration_desc: "Austria, atau yang kemudian dikenal sebagai Cisleithania, adalah bagian integral dari kerajaan federatif kami. Sekarang menjadi lebih penting dari sebelumnya untuk sekali lagi memastikan Habsburg menguasai negaranya, dan menyatukan kembali kerajaan-kerajaan kita di bawah satu federasi."
 wuw_HUN_seek_an_alliance_with_the_kaiser: "Carilah Aliansi dengan Kaiser"
 wuw_HUN_seek_an_alliance_with_the_kaiser_desc: "Dengan kembalinya Kekaisaran [GER.GetAdjective] yang lama, akan lebih bijaksana untuk mereformasi ikatan lama kita dengan [GER.GetLeader], dalam upaya untuk membatalkan tindakan buruk yang menimpa kita berdua di akhir Perang Besar."
 wuw_HUN_a_grand_habsburg_alliance: "Aliansi Habsburg"
 wuw_HUN_a_grand_habsburg_alliance_desc: "Tidak ada seorang pun yang dapat Anda percayai lebih dari saudara Anda sendiri, dan kami telah belajar sepanjang sejarah bahwa setiap orang menentang keluarga besar Habsburg. Oleh karena itu, kita harus menjaga aliansi di dalam keluarga kita, dan membentuk faksi yang hanya terdiri dari negara-negara yang dikuasai Habsburg."
 wuw_HUN_the_old_grand_alliance: "Pulihkan Aliansi Besar"
 wuw_HUN_the_old_grand_alliance_desc: "Pada tahun 1689, kami menandatangani perjanjian bersama William III atas nama Republik Belanda dan Inggris. Tujuannya adalah membentuk aliansi untuk menghentikan kebijakan ekspansionis Perancis. Kini, dunia kembali terbakar, dan kita perlu mengamankan benua ini dengan sekali lagi berupaya memulihkan liga lama ini."
 wuw_HUN_demand_wiedist_restoration: "Menuntut Restorasi Wiedist"
 wuw_HUN_demand_wiedist_restoration_desc: "Pangeran Wilhelm dari Wied pernah memerintah Kerajaan Albania sebagai sekutu Blok Sentral. Namun pada akhir Perang Besar, ia digulingkan secara tidak adil dan setelah bertahun-tahun, Ahmet Zogu yang berpura-pura menyedihkan mencuri takhta Albania. Kita harus segera memperbaiki kesalahan ini!"
 wuw_HUN_a_habsburg_poland: "Polandia Habsburg"
 wuw_HUN_a_habsburg_poland_desc: "Tanah Polandia dulunya merupakan wilayah potensial Habsburg, dan sekali lagi ini adalah waktu yang tepat untuk memperluas wilayah yang dikuasai oleh Habsburg. Kita harus menghubungi pemerintah Polandia, dan meminta mereka memulihkan kerajaan, dan menempatkan Karl Albrecht di singgasana mereka."
 wuw_HUN_habsburg_ascension_in_spain: "Kenaikan Habsburg di Spanyol"
 wuw_HUN_habsburg_ascension_in_spain_desc: "Dahulu kala, Habsburg menguasai Spanyol. Kita harus berusaha memulihkan monarki di Spanyol, dan menggunakan Spanyol untuk memperluas Aliansi Habsburg dan mengapit lawan-lawan kita di Eropa Barat."
 wuw_HUN_reenlist_the_sich_riflemen: "Daftarkan kembali Penembak Sich Ukraina"
 wuw_HUN_reenlist_the_sich_riflemen_desc: "Para Penembak Sich Ukraina bertempur untuk kami selama Perang Besar, dan kemudian berperang demi negara Ukraina yang merdeka selama Perang Saudara di Rusia. Kita harus mereformasi unit militer ini, di bawah salah satu komandan lama dan populer mereka, Adipati Agung Habsburg Wilhelm Franz dari Austria, yang mereka kenal dengan nama Vasyl Vyshyvanyi."
 wuw_HUN_the_kingdom_of_ukraine: "Kerajaan Ukraina"
 wuw_HUN_the_kingdom_of_ukraine_desc: "Setelah Perang Besar, kami berusaha mendirikan negara Ukraina baru dengan bantuan Kekaisaran Jerman. Negara ini kemudian dihancurkan oleh kaum Bolshevik, namun sekarang kita sekali lagi menguasai tanah air Ukraina, dan dapat mencoba mendirikan Kerajaan baru yang dipimpin Habsburg di Ukraina."
 wuw_HUN_restore_the_georgian_monarchy: "Pulihkan Monarki Georgia"
 wuw_HUN_restore_the_georgian_monarchy_desc: "Kontak kami telah menjangkau Pangeran George Bagration dari Mukhrani yang diasingkan, pewaris sah takhta Georgia. Dia telah menjanjikan dukungan abadi bagi perjuangan kita jika kita berjanji untuk membebaskan tanah airnya dan mengembalikan monarki di sana. Bola sekarang ada di tangan kita."
 wuw_HUN_protect_czechoslovakia: "Lindungi Cekoslowakia"
 wuw_HUN_protect_czechoslovakia_desc: "[CZE.GetNameDefCap], sejak kemerdekaannya, telah tumbuh kuat dan rajin, namun tanah mereka dilirik dengan rakus oleh tetangga mereka. Kami akan menawarkan kepada mereka perlindungan kami terhadap ancaman-ancaman ini, baik dengan menyambut mereka sekali lagi sebagai bagian integral dari Kerajaan kami, atau dengan memberikan mereka status asosiasi."
 wuw_HUN_reclaim_transylvania: "Rebut kembali Transylvania"
 wuw_HUN_reclaim_transylvania_desc: "Pada akhir Perang Besar, [ROM.GetAdjective] menduduki Transylvania, yang telah kita kuasai selama berabad-abad. Belum lama ini terjadi, dan orang-orang kami mengingatnya dengan sangat baik. Ini adalah waktu untuk merebut kembali tanah-tanah ini untuk kita sendiri."
 wuw_HUN_a_hungarian_galicia: "Sebuah [ROOT.GetAdjective] Galicia"
 wuw_HUN_a_hungarian_galicia_desc: "Dulu, Galicia dan Bucovina diperintah oleh Cisleithania, tapi mengingat kita sekarang adalah mitra dominan di Kekaisaran, masuk akal jika kitalah yang menjaga dan mengelola wilayah ini."
 wuw_HUN_reintigrate_slovakia: "Integrasikan kembali Slowakia"
 wuw_HUN_reintigrate_slovakia_desc: "Selama berabad-abad, Slovakia merupakan bagian integral dari wilayah [ROOT.GetAdjective], dan dengan perjanjian Trianon yang sangat tercela, tanah-tanah ini dirampas dari kita. Sudah saatnya kita memasukkan wilayah utara kita, dan menambahkannya kembali ke dalam kelompok."
 wuw_HUN_press_maximilians_and_the_iturbides_claims: "Tekan Klaim Maximilian dan Iturbides"
 wuw_HUN_press_maximilians_and_the_iturbides_claims_desc: "Meksiko pertama kali diproklamasikan sebagai sebuah kerajaan di bawah Dinasti Iturbide, dan kemudian, diperintah oleh Maximilian von Habsburg selama kekaisaran kedua, sampai ia dieksekusi secara tidak adil. Pewaris takhta kekaisaran saat ini adalah María Josepha Sophia de Iturbide yang pernah diadopsi olehnya, dan kami akan memastikan bahwa dia dapat memperoleh kembali mahkotanya sekali lagi!"
 wuw_HUN_the_triple_kingdom: "Tiga Monarki"
 wuw_HUN_the_triple_kingdom_desc: "Pada akhir Perang Besar dan bahkan sebelum Perang Besar, ada pihak yang membahas penghapusan Monarki Ganda dan mendukung monarki dengan tiga mahkota, salah satunya adalah mahkota Kroasia-Slavonia. Kita harus berusaha memenuhi janji-janji ini sekarang, sehingga kerajaan kita tidak runtuh lagi di masa depan."
 wuw_HUN_restore_the_lombardo_venetian_kingdom: "Pulihkan Kerajaan Lombardy–Venetia"
 wuw_HUN_restore_the_lombardo_venetian_kingdom_desc: "Kerajaan Lombardy–Venetia adalah wilayah konstituen di kekaisaran kami dari tahun 1815 hingga 1866, dan diambil alih oleh Kerajaan Italia yang baru dibentuk dalam perang kemerdekaan Italia ketiga. Sudah saatnya kita kembali ke semenanjung, dan berusaha mengembalikan Habsburg ke tahta di tanah mahkota lama ini."
 wuw_HUN_restore_the_duchy_of_teschen: "Kembalikan Kadipaten Teschen"
 wuw_HUN_restore_the_duchy_of_teschen_desc: "Tanah Silesia diperintah oleh Bohemia untuk waktu yang lama, dan kemudian digabungkan ke dalam kekaisaran. Namun, setelah Perang Suksesi Austria, negara ini dicuri dari kami oleh Prusia, sebuah kerugian yang tidak dapat kami lupakan. Kita harus membayarnya kembali, dan merebut kembali tanah ini untuk diri kita sendiri sekali lagi!"
 wuw_HUN_reclaim_the_holy_city: "Rebut kembali Kota Suci"
 wuw_HUN_reclaim_the_holy_city_desc: "Kerajaan Yerusalem dihapuskan setelah ditaklukkan oleh Mamluk Mesir pada tahun 1291, namun Kaisar kita masih menyandang gelar Raja Yerusalem melalui Keluarga Lorraines Leopold I. Sudah saatnya kita, para pelindung iman Katolik, merebut kembali kota suci Yerusalem dan melakukan apa yang tidak bisa dilakukan oleh Tentara Salib."
 wuw_HUN_a_holy_empire: "Kekaisaran Suci"
 wuw_HUN_a_holy_empire_desc: "Sekarang tanah suci berada di bawah kendali Raja Yerusalem yang sebenarnya, kita dapat mendekati Paus dan meminta restunya, karena Kerajaan Yerusalem akhirnya dipulihkan. Hal ini akan memungkinkan rakyat kekaisaran kita untuk memahami peran para raja di negara kita, dan memahami bahwa mereka benar-benar dipilih oleh Tuhan."
 wuw_HUN_a_holy_empire_tt: "§YOtto von Habsburg§! dan pengikutnya akan diberkati oleh Paus"
 wuw_HUN_a_multi_ethnic_empire: "Kerajaan Multi-Etnis"
 wuw_HUN_a_multi_ethnic_empire_desc: "Kekaisaran kami mencakup banyak orang dan budaya yang berbeda, dan ini adalah sesuatu yang harus kami rangkul sepenuhnya, memberikan otonomi besar kepada berbagai wilayah di wilayah kami, membuat rakyat kami ingin tetap menjadi bagian dari kami selama bertahun-tahun yang akan datang."
 wuw_HUN_reverse_the_risorgimento: "Balikkan Risorgimento"
 wuw_HUN_reverse_the_risorgimento_desc: "Penyatuan Italia adalah kesalahan yang disebabkan oleh serangkaian pilihan yang tidak bertanggung jawab oleh para penguasa dan tragedi bagi Kekaisaran Austro-Hungaria. Kesalahan ini harus diperbaiki, jika dunia ingin pulih darinya!"
 wuw_HUN_reverse_the_risorgimento_tt: "§Y[ROOT.GetNameDefCap]§! akan melepaskan negara bagian §YPra-Risorgimento§! di §YSemenanjung Italia§! sebagai §YSubjek§! dan memperkuatnya"
 wuw_HUN_integrate_bohemian_and_austrian_industries: "Integrasikan Industri Bohemia dan Austria"
 wuw_HUN_integrate_bohemian_and_austrian_industries_desc: "Negara-negara konstituen lain dari Kekaisaran kita memiliki industri mereka sendiri yang kuat. Adalah bijaksana untuk mengintegrasikan hal-hal ini ke dalam diri kita, karena hal-hal tersebut telah dimasukkan kembali ke dalam kelompok kita."
 wuw_HUN_renovato_imperii: "Renovasi Imperii"
 wuw_HUN_renovato_imperii_desc: "Renovatio imperii Romanorum, \"pembaruan kekaisaran Romawi\" adalah formula yang menyatakan niat untuk memulihkan atau menghidupkan kembali Kekaisaran Romawi, dan telah digunakan berkali-kali sejak pertama kali diciptakan. Kita harus melakukan hal yang sama, dan secara resmi mengumumkan niat kita untuk memulihkan Kekaisaran Austro-Hungaria, dan membawanya menuju kejayaan!"
 wuw_HUN_renovato_imperii_tt: "Membuka Keputusan untuk §YMengintegrasikan Subyek Kekaisaran§! kembali ke dunia nyata, serta kemampuan untuk §YMenginti Tanah Lama Austro-Hungaria§!"
 wuw_HUN_revenge_for_the_brusilov_offensive: "Balas dendam atas Serangan Brusilov"
 wuw_HUN_revenge_for_the_brusilov_offensive_desc: "Rusia mempermalukan kami pada awal Perang Besar, khususnya pada serangan Brusilov yang sangat sukses. Kita harus memastikan bahwa ada semangat nasional yang sama untuk membalas dendam kepada mereka yang menganiaya kita, khususnya Rusia. Dengan melakukan hal ini, kita juga dapat melakukan upaya baru untuk mendirikan Habsburg Ukraina."
 wuw_HUN_purchase_burgenland: "Beli Burgenland"
 wuw_HUN_purchase_burgenland_desc: "Wilayah yang dikenal oleh [AUS.GetAdjective] sebagai Burgenland telah menjadi bagian dari wilayah [ROOT.GetAdjective] selama berabad-abad, hanya untuk dicuri dari kita melalui Perjanjian Trianon. Kita harus mendekati pemerintah mereka dengan sebuah proposal, menawarkan untuk membayar mereka sejumlah besar uang sebagai imbalan atas wilayah tersebut, karena perekonomian mereka saat ini sedang amburadul."
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias: "Warisan Árpád, Andrew dan Matthias"
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc: "Árpád, Andrew III dari Venesia dan Matthias Corvinus adalah tiga penguasa heroik terbesar di negara lama kita. Jika Joseph August ingin hidup sesuai dengan legenda mereka, dia harus mengklaim apa yang pernah menjadi milik mereka, dan mewujudkannya sepenuhnya, membawa semangat mereka ke masa depan."
 wuw_HUN_a_declaration_of_intentions: "Pernyataan Niat"
 wuw_HUN_a_declaration_of_intentions_desc: "Sudah saatnya kita memperjelas niat kita kepada seluruh dunia, dan menunjukkan kepada mereka orang [ROOT.GetAdjective] sebenarnya terbuat dari apa."
 wuw_HUN_undoing_the_yugoslav_mistake: "Membatalkan Kesalahan Yugoslavia"
 wuw_HUN_undoing_the_yugoslav_mistake_desc: "Pembentukan Yugoslavia adalah salah satu kesalahan terbesar dalam sejarah umat manusia, dan kita harus melakukan segala daya kita untuk merebut kembali wilayah lama Negara Slovenia, Kroasia, dan Serbia. Hongaria akan bangkit kembali!"
 wuw_HUN_undoing_the_yugoslav_mistake_tt: "Membuka keputusan untuk §YMeintegrasikan Kembali Wilayah Hongaria Lama§! yang terletak di Negara Bagian Slovenia, Kroasia, dan Serbia yang lama"
 wuw_HUN_reclaim_the_slovak_possessions: "Rebut Kembali Kepemilikan Slovakia"
 wuw_HUN_reclaim_the_slovak_possessions_desc: "Slovakia telah lama menjadi bagian dari negara kami, dan hampir bersatu kembali dengan kami dalam perang setelah Perjanjian Trianon. Kita harus menginjakkan kaki kita kembali ke wilayah ini, dan mengklaim wilayah tersebut untuk diri kita sendiri sekali lagi!"
 wuw_HUN_reclaim_the_slovak_possessions_tt: "Membuka keputusan untuk §YReintegrasi Wilayah Hongaria Lama§! yang terletak di Slovakia"
 wuw_HUN_revenge_for_1919: "Balas dendam untuk tahun 1919"
 wuw_HUN_revenge_for_1919_desc: "Pada tahun 1919, [ROM.GetAdjective] mempermalukan kami dalam konflik memperebutkan tanah Transylvania yang sah, dan tidak hanya menduduki seluruh wilayah, tetapi juga merebut Budapest dan berparade keliling ibu kota kami. Aib ini tidak bisa dibiarkan begitu saja, jika ingin bangsa [ROOT.GetAdjective] kembali berjaya."
 wuw_HUN_revenge_for_1919_tt: "Membuka keputusan untuk §YMengintegrasikan Kembali Wilayah Hongaria Lama§! yang terletak di Transilvania"
 wuw_HUN_a_bulwark_against_communism: "Benteng Melawan Komunisme"
 wuw_HUN_a_bulwark_against_communism_desc: "Ancaman Bolshevik telah menyebar terlalu jauh dan mengancam akan semakin parah jika tidak ada yang mau menghentikannya. Kita harus mengambil jubah pelindung bumi, dan melindunginya dari penyakit busuk ini!"
 wuw_HUN_on_a_high_horse: "Di Atas Kuda Tinggi"
 wuw_HUN_on_a_high_horse_desc: "Orang-orang [ROOT.GetAdjective] benar-benar penguasa dunia ini, seperti yang telah dibuktikan oleh perkembangan terkini kepada kita. Sudah saatnya kita mengambil tempat yang selayaknya kita di bawah sinar matahari, dan berjemur di bawah sinar kemuliaan saat kita menghegemoni bumi! Kerajaan Apostolik akan memerintah atas anak-anak dewa."
 wuw_HUN_cancel_the_german_trade_deal: "Batalkan Kesepakatan Dagang [GER.GetAdjective]"
 wuw_HUN_cancel_the_german_trade_deal_desc: "Gyula Gömbös yang fasis, mantan perdana menteri kita, menandatangani perjanjian dengan iblis ketika dia membuat perjanjian perdagangan dengan [GER.GetAdjective]s. Hal ini mengikat kita pada mereka, dan perlahan tapi pasti menghancurkan jiwa bangsa kita. Kita harus mengakhiri kesepakatan ini secepat mungkin."
 wuw_HUN_establishing_a_royal_guard: "Membentuk Pengawal Kerajaan"
 wuw_HUN_establishing_a_royal_guard_desc: "Sudah menjadi rahasia umum bahwa setiap raja membutuhkan pengawal pribadinya, begitu pula Horthy. Sudah waktunya kita memenuhi hal ini, karena bangsa kita sekali lagi mempunyai seorang raja di singgasananya."
 wuw_HUN_magyar_cserkeszszovetseg: "Magyar Cserkészszövetség"
 wuw_HUN_magyar_cserkeszszovetseg_desc: "Asosiasi Pramuka Hongaria, yang didirikan pada tahun 1912, telah melatih banyak [ROOT.GetAdjective] muda berbakat dalam menjaga diri mereka sendiri, dan membantu operasi paramiliter. Sudah waktunya kita secara resmi mengintegrasikan mereka ke dalam pengawal kerajaan kita, memberikan gelar bangsawan kepada para pemimpin organisasi."
 wuw_HUN_magyar_cserkeszszovetseg_tt: "Ubah §YPengawal Kerajaan§! dengan\nFaktor Populasi yang Dapat Direkrut §G+10%§! Pertahanan Arus Ideologi §G+15%§!\n§Y$category_support_battalions$:§! Organisasi: §G+10§!, HP: §G+5§!"
 wuw_HUN_dissolve_the_volksbund: "Bubarkan Volksbund"
 wuw_HUN_dissolve_the_volksbund_desc: "Volksbund adalah organisasi etnis [GER.GetAdjective] yang terkait dengan DNSAP di negara kita. Mereka mendapat dana dari [GER.GetNameDef], dan menjalankan tugas mereka di negara kita. Kita harus membubarkan mereka sebelum mereka dapat membahayakan stabilitas negara kita."
 wuw_HUN_an_airforce_to_be_reckoned_with: "Angkatan Udara Masa Depan"
 wuw_HUN_an_airforce_to_be_reckoned_with_desc: "Angkatan udara kita perlu dimodernisasi dan diperkuat agar dapat bersaing lebih baik dengan musuh-musuh kita. Gabungan senjata adalah jalan masa depan, dan ini adalah fakta yang harus kita terima."
 wuw_HUN_a_mobile_army: "Tentara Bergerak"
 wuw_HUN_a_mobile_army_desc: "Karena tentara kita tidak bisa mengalahkan kekuatan dunia mana pun dalam hal jumlah tentara, kita harus fokus pada keunggulan teknologi. Armor dan kendaraan darat lainnya yang dapat menembus dan mengepung unit musuh adalah masa depan peperangan, dan kita harus menerima kenyataan tersebut."
 wuw_HUN_royalist_education_initiative: "Inisiatif Pendidikan Royalis"
 wuw_HUN_royalist_education_initiative_desc: "Masyarakat tidak hanya perlu diajari bagaimana bertindak, tetapi juga hal-hal terpenting untuk mempersiapkan mereka menghadapi masa depan gemilang yang kita idamkan, sementara itu juga akan melahirkan banyak ilmuwan [ROOT.GetAdjective] yang baru dan cemerlang."
 wuw_HUN_a_unifying_heritage: "Warisan Pemersatu"
 wuw_HUN_a_unifying_heritage_desc: "Masyarakat [ROOT.GetAdjective] mungkin tersebar di berbagai negara, namun hal itu tidak menghalangi kita untuk merasakan solidaritas satu sama lain. Kita harus merangkul Pan-Hungaria, dan berupaya secepatnya, menyatukan semua orang [ROOT.GetAdjective] di bawah satu bendera."
 wuw_HUN_stage_an_uprising_in_leitha: "Lakukan Pemberontakan di Leitha"
 wuw_HUN_stage_an_uprising_in_leitha_desc: "Pemberontakan melawan Austria di Lajtabánság pada tahun 1921 membuktikan bahwa masyarakat [975.GetName] ingin menjadi bagian dari bangsa kita yang besar. Kita harus mengirimkan agen untuk melakukan hal yang sama untuk kedua kalinya, segera menawarkan mereka perlindungan dan bergerak untuk menduduki wilayah tersebut."
 wuw_HUN_stage_an_uprising_in_leitha_tt: "§RIni dapat menyebabkan perang dengan pemilik [975.GetName]!§!"
 wuw_HUN_anglo_hungarian_alliance: "Aliansi Inggris-Hongaria"
 wuw_HUN_anglo_hungarian_alliance_desc: "Keluarga Horthy selalu memiliki hubungan dekat dengan Inggris, dan dengan meningkatnya ketegangan di sekitar kita, sudah saatnya negara kita mencari aliansi. Inggris tentu saja merupakan mitra kerja sama yang alami, karena bantuan mereka memungkinkan kita untuk fokus pada urusan kita sendiri di benua ini sementara mereka fokus pada hal lain."
 wuw_HUN_establishing_a_new_dynasty: "Mendirikan Dinasti Baru"
 wuw_HUN_establishing_a_new_dynasty_desc: "Mengingat Habsburg tidak diizinkan untuk kembali ke tahta, tidak ada pemenang yang jelas dalam hal klaim atas kerajaan kita. Pilihannya adalah menobatkan raja bupati kami, meskipun tidak populer, atau mengambil jalan yang lebih aman dan menobatkan putranya, István Horthy yang populer dan disukai sebagai raja baru Hongaria."
 wuw_HUN_establishing_a_new_dynasty_tt: "Kita akan dapat memilih antara menobatkan §YMiklós Horthy§! atau putranya §YIstván Horthy§! sebagai §YRaja Hongaria§!"
 HUN_fascist_uprising_mission_activation_tt: "§RFasis Hongaria akan mulai mempersiapkan kudeta!§!"
 wuw_HUN_elect_a_fascist_king: "Pilihlah Raja Fasis"
 wuw_HUN_elect_a_fascist_king_desc: "Bangsa kita membutuhkan pemimpin yang kuat untuk mengarahkannya melewati tahun-tahun penuh gejolak yang akan datang. Penguasa kita harus menjadi pemimpin yang dapat disegani oleh rakyatnya, dan dapat ditakuti oleh musuh-musuh kita."
 wuw_HUN_guarantee_religious_liberties: "Menjamin Kebebasan Beragama"
 wuw_HUN_guarantee_religious_liberties_desc: "Banyak yang melarikan diri dari negara kita ketika terjadi penindasan terhadap mereka yang bukan Katolik. Untuk membalikkan brain drain ini, kita harus mengubah undang-undang ini, dan berupaya mewujudkan negara sekuler. Hal ini akan memungkinkan banyak orang cerdas yang meninggalkan negara kita untuk kembali kepada kita."
 wuw_HUN_joint_oil_exploitation_company: "Perusahaan Eksploitasi Minyak Gabungan"
 wuw_HUN_joint_oil_exploitation_company_desc: "Dengan adanya prospek ladang minyak di wilayah kami, kami telah menarik perhatian asing. Negara-negara sahabat sangat ingin mendukung industri minyak kita dengan pengetahuan teknis mereka, dan ini akan menjadi peluang yang menguntungkan untuk belajar dari kemajuan mereka."
 wuw_HUN_join_the_allies: "Bergabunglah dengan Sekutu"
 wuw_HUN_join_the_allies_desc: "Masa depan Hongaria dan nilai-nilai demokrasinya bergantung pada negara-negara demokrasi besar di Barat dan aliansinya. Sebagai anggota aliansi ini, kita dapat memberikan kekuatan kita kepada mereka, dan juga mengandalkan dukungan mereka."
 wuw_HUN_a_responsible_government: "Pemerintahan yang Bertanggung Jawab"
 wuw_HUN_a_responsible_government_desc: "Secara tradisional, pemerintah pada akhirnya bertanggung jawab kepada raja, sehingga membiarkan raja mengabaikan keinginan rakyat. Kami akan mengubah konstitusi untuk memastikan bahwa rakyatlah, dan bukan penguasa, yang meminta pertanggungjawaban pemerintah."
 wuw_HUN_the_balkan_pact: "Pakta Balkan"
 wuw_HUN_the_balkan_pact_desc: "Negara-negara demokrasi di Barat terlalu jauh untuk membantu kita, sehingga kita harus mencari sekutu yang lebih dekat dengan negara kita. Sebagai pemimpin Pakta Balkan, kami akan menawarkan perlindungan kami dan memimpin mereka menuju kemenangan!"
 wuw_HUN_the_balkan_pact_tt: "Membuka keputusan untuk §YMengundang Negara Balkan§! ke faksi kami"
 wuw_HUN_the_balkan_pact_invitation_tt: "[ROM.GetNameDef] Mendapat acara: §Y[ROOT.GetNameDefCap] mengundang [ROM.GetNameDef] ke Pakta Balkan§!"
 wuw_HUN_end_the_white_terror: "Akhiri Teror Putih"
 wuw_HUN_end_the_white_terror_desc: "Meskipun sebagian besar orang di negara ini mengklaim bahwa Teror Putih telah berakhir, kita tahu kebenarannya... Miklós Horthy dan kelompok paramiliternya masih memburu orang-orang yang memimpikan hari esok yang lebih baik, dan kita harus mengakhiri pemerintahannya melalui revolusi kekerasan, jika penganiayaan kita ingin diakhiri."
 wuw_HUN_parade_istvan_bethlens_platform: "Oposisi Baru István Bethlen"
 wuw_HUN_parade_istvan_bethlens_platform_desc: "Tidak puas dengan keadaan saat ini, dan semakin waspada terhadap meningkatnya retorika otoriter yang dianut oleh Perdana Menteri Gyula Gömbös, mantan Perdana Menteri István Bethlen telah membentuk Oposisi baru. Kita harus menggunakan kesempatan ini untuk semakin melemahkan Laksamana dan antek-antek fasisnya."
 wuw_HUN_politicize_the_levente_associations: "Politisasi Asosiasi Levente"
 wuw_HUN_politicize_the_levente_associations_desc: "Asosiasi pemuda paramiliter Levente membantu mengorganisir pemuda [ROOT.GetAdjective] dan melatih mereka untuk menangani konflik ketika konflik itu tiba di negara kita. Kita harus berusaha menyusup ke kelompok-kelompok ini, dan memastikan bahwa anggotanya tahu kepada siapa mereka harus setia."
 wuw_HUN_politicize_the_levente_associations_tt: "Ketika §Y[ROOT.GetAdjective] Perang Saudara§! dimulai, §YAsosiasi Levente§! akan setia kepada pihak kami, dan kami akan mendapatkan tambahan §G+8000§! Tenaga Kerja"
 wuw_HUN_salami_slicing_tactics: "Taktik Mengiris Salami"
 wuw_HUN_salami_slicing_tactics_desc: "Dengan menggunakan serangkaian tindakan kecil anti-Horthyist untuk menghasilkan hasil yang jauh lebih besar yang akan sulit atau bahkan melanggar hukum untuk dilakukan sekaligus, kita berpotensi melemahkan aturan tersebut hingga hampir tidak ada tentara yang bersedia mempertahankan kebijakannya."
 wuw_HUN_salami_slicing_tactics_tt: "Ketika §Y[ROOT.GetAdjective] Perang Saudara§! dimulai, sebagian besar §YAngkatan Bersenjata§! akan setia kepada kami."
 wuw_HUN_undermine_the_volksbund: "Melemahkan Paramiliter Fasis"
 wuw_HUN_undermine_the_volksbund_desc: "Banyak kelompok paramiliter fasis, seperti organisasi Jerman-Hongaria bernama Volksbund yang memiliki hubungan dekat dengan fasis Jerman, kemungkinan besar akan mengangkat senjata untuk menentang kami jika kami ingin melakukan revolusi. Kita harus berusaha menghancurkan semuanya dari dalam atau luar, sebelum terlambat."
 wuw_HUN_undermine_the_volksbund_tt: "Ketika §Y[ROOT.GetAdjective] Perang Saudara§! dimulai, pihak lawan tidak akan mendapatkan tambahan §YVolksbund§! unit, dan kami akan mendapatkan tambahan §G+15%§! Dukungan Perang dan §G+75§! Kekuatan Politik"
 wuw_HUN_reviving_the_spirit_of_1848: "Menghidupkan Kembali Semangat Tahun 1848"
 wuw_HUN_reviving_the_spirit_of_1848_desc: "Revolusi Hongaria dan Perang Kemerdekaan tahun 1848–1849 adalah salah satu dari banyak Revolusi Eropa pada tahun 1848, dan meskipun gagal memberi kita kemerdekaan yang kita harapkan, hal ini membuka jalan menuju semangat dan cita-cita yang kita semua jalani saat ini. Kita harus menyalakan kembali api revolusi, dan menjatuhkan para penguasa lalim yang menghalangi kebebasan kita!"
 wuw_HUN_reviving_the_spirit_of_1848_tt: "Berbagai elemen Monarki dan Fasis di negara ini akan mengikuti §YMiklós Horthy§! dalam §RPerang Saudara§! melawan kita!"
 wuw_HUN_reviving_the_spirit_of_1848_requirements_tt: "Dukungan terhadap §YKomunis§! atau §YDemokrat§! lebih besar dibandingkan dukungan terhadap §YNEP§! dan §YMNSP§!"
 wuw_HUN_officialize_the_rakosi_battalion: "Resmikan Batalyon Rákosi"
 wuw_HUN_officialize_the_rakosi_battalion_desc: "Para pria [ROOT.GetAdjective] pemberani selalu berjuang untuk hari esok yang lebih baik, bahkan di luar negeri. Inilah sebabnya kita harus melakukan upaya untuk secara resmi mendukung orang-orang seperti ini, dan membawa revolusi kepada mereka yang membutuhkan."
 wuw_HUN_elections_in_the_revolutionary_council: "Pemilihan di Dewan Revolusi"
 wuw_HUN_elections_in_the_revolutionary_council_desc: "Kini, setelah Perang Saudara usai, maka dianggap aman untuk mengadakan pemilihan umum di dewan revolusioner yang dibentuk untuk mengawasi transisi negara tersebut menuju republik. Saat ini sepertinya kandidat komunis lebih diunggulkan, tapi mungkinkah demokrasi masih menjadi pilihan?"
 wuw_HUN_join_the_comintern: "Bergabunglah dengan Komintern"
 wuw_HUN_join_the_comintern_desc: "Jalan ke depan bagi Revolusi ada di tangan Komintern. Dengan berdiri bersama kawan-kawan kita, kita akan menyingkirkan ketidakadilan kapitalis dan ancaman fasis yang membayangi di Barat."
 wuw_HUN_restore_the_socialist_federative_republic: "Pulihkan Republik Federasi Sosialis"
 wuw_HUN_restore_the_socialist_federative_republic_desc: "Komintern telah meninggalkan perjuangan melawan imperialisme dan memilih hidup berdampingan. Jika pekerja di seluruh dunia ingin bebas, kita harus meneruskan semangat Marx dan Lenin – bahkan melawan Uni Soviet, jika perlu."
 wuw_HUN_restore_the_hungarian_red_army: "Kembalikan Tentara Merah Hongaria"
 wuw_HUN_restore_the_hungarian_red_army_desc: "Semua patriot pecinta tanah air wajib melaksanakan tugasnya membela tanah air. Kami akan membentuk Tentara Merah Hongaria, mengikuti contoh Soviet di Timur, yang akan melindungi Revolusi kami yang masih baru."
 wuw_HUN_instate_a_socialist_economy: "Mewujudkan Ekonomi Sosialis"
 wuw_HUN_instate_a_socialist_economy_desc: "Untuk benar-benar mengubah masyarakat kita menjadi lebih baik, kita harus mengubah cara aliran uang, dan menyingkirkan pimpinan perusahaan yang hanya mendapatkan posisi mereka melalui nepotisme. Pekerja akan kembali mempunyai hak untuk bersuara di negaranya, dan semua [ROOT.GetAdjective] akan setara!"
 wuw_HUN_nationalize_key_industries: "Nasionalisasi Industri Utama"
 wuw_HUN_nationalize_key_industries_desc: "Masih banyak pabrik dan perusahaan di negara kita yang dijalankan oleh perusahaan dan pengusaha asing, meskipun kita telah melakukan sosialisasi perekonomian. Langkah selanjutnya menuju sosialisme adalah nasionalisasi aset-aset asing."
 wuw_HUN_invest_in_universal_education: "Berinvestasi dalam Pendidikan Universal"
 wuw_HUN_invest_in_universal_education_desc: "Rakyatlah yang memerintah negara ini, dan tanpa mereka dididik untuk mengetahui yang terbaik dari diri mereka sendiri, mereka pasti akan membawa negara ini menuju kehancuran. Oleh karena itu kita harus berinvestasi dalam pendidikan universal dan gratis untuk semua, sehingga setiap orang [ROOT.GetAdjective] dapat terdidik dan menilai apa yang terbaik ketika memberikan suaranya."
 wuw_HUN_kadars_hussars: "Kádárs Hussars"
 wuw_HUN_kadars_hussars_desc: "Pufajkás, Resimen Kekuatan Revolusioner kami, adalah unit polisi militer Tentara Merah kami, yang dibentuk oleh Kementerian Perang, yang tujuan utamanya adalah menekan aktivitas pembangkang. Kita harus berinvestasi lebih jauh ke dalam unit-unit ini, untuk menjamin keamanan penuh rakyat kita dan negara mereka."
 wuw_HUN_reinstate_the_lenin_boys: "Kembalikan Lenin Boys"
 wuw_HUN_reinstate_the_lenin_boys_desc: "Lenin Boys adalah paramiliter Partai Komunis yang beroperasi di Republik Soviet pada tahun 1919, dan digunakan untuk membasmi dan menekan pembangkang kontra-revolusioner di negara tersebut. Kita harus mengembalikan organisasi paramiliter ini dan memasukkannya ke dalam angkatan bersenjata kita."
 HUN_lenin_boys_militia_recruitment: "Dapatkan dua unit Lenin-fiúk §YMilitia§!"
 wuw_HUN_promote_revanchist_sentiment: "Promosikan Sentimen Revanchist"
 wuw_HUN_promote_revanchist_sentiment_desc: "Kekejian yang dikenal sebagai perjanjian Trianon melucuti lebih dari separuh populasi kita, dan menyebabkan ribuan [ROOT.GetAdjective] kehilangan tempat tinggal dan pengungsian. Kita harus menghilangkan ketidakadilan sejarah yang besar ini untuk selamanya, dan menanamkan rasa balas dendam yang besar pada rakyat kita."
 wuw_HUN_denounce_marxism_leninism: "Mengecam Marxisme-Leninisme"
 wuw_HUN_denounce_marxism_leninism_desc: "Iosif Stalin yang keji telah terlalu lama menginjak-injak cita-cita kita dan mengambil alih ketentuan-ketentuan kita. Kebijakan-kebijakannya yang fasis dan otoriter membuktikan kepada kita bahwa ia tidak lebih dari seorang pembohong dan pengkhianat terhadap revolusi, dan sudah saatnya kita mengakhiri sandiwara menyedihkannya."
 wuw_HUN_proclaim_greater_hungary_core_states_requirement: "Semua negara bagian Hongaria yang baru mulai dikendalikan sepenuhnya"
 wuw_HUN_a_revolutionary_greater_hungary_tt: "Kami akan dikenal sebagai §YPersatuan Republik Sosialis Pannonia§!"
 wuw_HUN_a_revolutionary_greater_hungary: "Persatuan Sosialis Pannonia"
 wuw_HUN_a_revolutionary_greater_hungary_desc: "Dengan kembalinya perbatasan kita, inilah saatnya untuk mengarahkan pandangan kita pada tujuan yang sebenarnya. Kita harus memanfaatkan kesempatan ini untuk mendeklarasikan Persatuan Republik Sosialis Pannonia sebagai negara untuk semua orang, apapun bangsanya. Hal ini akan memungkinkan kita mengarahkan perhatian kita pada tujuan yang lebih besar yaitu menyebarkan revolusi dunia."
 HUN_hero_of_the_revolution: "Pahlawan Revolusi"
 HUN_hero_of_the_revolution_desc: "Dengan adanya reklamasi wilayah-wilayah lama dan proklamasi Persatuan Republik Sosialis Pannonia, jelaslah bahwa Béla Kun adalah Pahlawan Revolusi Internasional."
 HUN_balkan_ambitions: "Ambisi Balkan"
 HUN_balkan_ambitions_desc: "Kaum buruh Balkan berada di bawah pengaruh kaum Kapitalis, Monarki dan Fasis, yang semuanya merupakan musuh terang-terangan revolusi dunia. Kita harus melihat mereka dibebaskan jika kita ingin perdamaian di Balkan."
 wuw_HUN_revenge_for_the_romanian_humiliations: "Balas dendam atas Penghinaan Rumania"
 wuw_HUN_revenge_for_the_romanian_humiliations_desc: "Dalam Perang Hongaria–Rumania tahun 1918-1919 kami dipermalukan dan wilayah Transilvania kami dicuri. Untuk mendapatkan kembali kehormatan kita, kita harus merebut kembali tanah yang menjadi hak kita."
 wuw_HUN_the_second_northern_campaign: "Kampanye Utara Kedua"
 wuw_HUN_the_second_northern_campaign_desc: "Kampanye utara pertama kami yang dilakukan pada tahun 1919 sayangnya gagal, dan rakyat Slovakia jatuh ke tangan Ceko. Kita harus bertindak cepat, untuk membebaskan tidak hanya orang Hongaria, tapi juga Slovakia, di wilayah yang hilang dalam perjanjian Trianon."
 wuw_HUN_march_south: "Maret Selatan"
 wuw_HUN_march_south_desc: "Kita tidak hanya pernah kehilangan wilayah di utara, timur dan barat, tapi juga di selatan, yang sebagian besar berasal dari berdirinya Yugoslavia. Kita harus segera menghapuskan ketidakadilan yang menimpa rakyat kita di Vojvodina dan Banat."
 wuw_HUN_soviet_hungarian_military_academy: "Akademi Militer Soviet-Hongaria"
 wuw_HUN_soviet_hungarian_military_academy_desc: "Tentara kita tidak ada artinya tanpa kepemimpinannya. Soviet memiliki lebih banyak pengalaman dalam urusan militer, sehingga mungkin ada manfaatnya jika kita bekerja sama dengan mereka dalam melatih para ahli militer terbaik kita. Untuk mencapai tujuan ini, kami akan mendirikan akademi militer dengan instruktur paling terampil dari kedua negara."
 wuw_HUN_goulash_communism: "Komunisme Goulash"
 wuw_HUN_goulash_communism_desc: "Dengan kurangnya staf terampil setelah Perang Saudara yang berdarah, banyak talenta muda yang dengan cepat naik pangkat. Diantaranya adalah János Kádár dan bersamanya dia membawa gagasan \"Komunisme Goulash\", sebuah sistem dengan tujuan untuk menjamin standar hidup yang tinggi dan pada gilirannya menyatukan penduduk di bawah pemerintahan kita. Di Hongaria, setiap warga negara harus membeli semangkuk Goulash yang lezat!"
 wuw_HUN_joint_hungarian_soviet_research_effort: "Upaya Penelitian Bersama Soviet-Hongaria"
 wuw_HUN_joint_hungarian_soviet_research_effort_desc: "Untuk memperkuat akademi sains nasional, kita harus mengundang para pemikir dan insinyur Soviet, dan menggunakan bantuan mereka dalam mengembangkan pemikiran dan teknologi baru yang dapat dimanfaatkan oleh negara kita."
 wuw_HUN_soviet_hungarian_war_indsutry: "Industri Perang Soviet-Hongaria"
 wuw_HUN_soviet_hungarian_war_indsutry_desc: "Untuk lebih memperkuat kerja sama kita, kita harus meminta Soviet untuk berinvestasi dalam industri militer kita, sehingga kita dapat memenuhi kewajiban kita dan membela sekutu komunis kita dari siapa pun yang berani mengancam mereka."
 wuw_HUN_state_protection_authority: "Otoritas Perlindungan Negara"
 wuw_HUN_state_protection_authority_desc: "Untuk memastikan perlindungan bagi warga negara kita yang bangga, dan memastikan bahwa unsur-unsur kontra-revolusioner tidak dapat muncul kembali, kita harus membentuk polisi rahasia yang memiliki wewenang penuh untuk membasmi siapa pun yang mereka anggap bertindak melawan pemerintah kita."
 wuw_HUN_central_military_planning_committee: "Komite Perencanaan Militer Pusat"
 wuw_HUN_central_military_planning_committee_desc: "Jika revolusi dunia ingin berhasil, kita harus membentuk komisi untuk kerja sama strategis dan militer yang lebih besar antara kita dan sekutu kita, serta memastikan bahwa tentara kita beroperasi dengan efektivitas penuh, siap menyerang musuh kita kapan saja."
 wuw_HUN_a_cult_of_personality: "Kultus Kepribadian"
 wuw_HUN_a_cult_of_personality_desc: "Anak-anak [ROOT.GetNameDef] membutuhkan sosok yang dapat mereka hormati, jiwa revolusioner yang dapat mereka hormati sepenuhnya. Oleh karena itu, kita harus memusatkan kekuasaan di sekitar Mátyás Rákosi, dan membangun kultus kepribadian yang dapat membawa kehendaknya ke dalam pikiran rakyatnya, dan mengajari mereka nilai-nilai sejati yang harus mereka andalkan."
 wuw_HUN_pressure_romania: "Tekanan [ROM.GetNameDef]"
 wuw_HUN_pressure_romania_desc: "Saat kita fokus pada bahaya Fasis di Barat, kita tidak bisa membiarkan potensi ancaman terus ada di belakang kita, terutama jika ancaman tersebut berada di antara kita dan sekutu kita di Timur. Rumania harus diamankan sebagai negara sesama komunis, atau jalur darat penting bagi sekutu kita harus diserahkan untuk memastikan kita dapat menerima dukungan mereka."
 wuw_HUN_intervene_in_czechoslovakia: "Intervensi Dalam [CZE.GetNameDef]"
 wuw_HUN_intervene_in_czechoslovakia_desc: "Cekoslowakia telah dianugerahi beberapa wilayah yang diambil dari kami berdasarkan Perjanjian Trianon. Pada saat yang sama, kita mengetahui rancangan Jerman di tanah mereka. Mungkin kami bisa mengatur perdagangan; tanah kami yang sah dengan imbalan jaminan dukungan militer Soviet jika terjadi agresi Jerman."
 wuw_HUN_the_bulwark_against_the_west: "Benteng Melawan Barat"
 wuw_HUN_the_bulwark_against_the_west_desc: "Sebagai anggota gerakan komunis internasional yang bangga, kita harus siap setiap saat untuk mempertahankan cara hidup kita, dan ancaman terbesar saat ini adalah kaum fasis dan kapitalis di barat. Kita harus berdiri sebagai sebuah benteng, sebuah benda tak tergoyahkan yang tidak akan pernah goyah, jika kita ingin terus berdiri kokoh."
 wuw_HUN_establish_the_second_republic: "Mendirikan Republik Kedua"
 wuw_HUN_establish_the_second_republic_desc: "Tidak boleh dilupakan bahwa Republik Hongaria pertama yang berdiri sebentar-sebentar antara tahun 1918 dan 1920 dihancurkan melalui upaya gabungan oleh kaum komunis dan nasionalis, yang satu ingin mendirikan Republik Soviet, yang lain memulihkan kerajaan, dan yang terakhir lebih sukses. Kita harus mengambil langkah untuk melestarikan demokrasi kita sekarang, jangan sampai demokrasi direnggut lagi selamanya!"
 wuw_HUN_reverse_the_brain_drain: "Membalikkan Pengurasan Otak"
 wuw_HUN_reverse_the_brain_drain_desc: "Banyak ilmuwan terkemuka meninggalkan negara kita ketika negara ini mulai melakukan tindakan yang menyesakkan dan diskriminatif dalam upaya untuk mendapatkan kendali lebih lanjut atas masyarakat kita, dan sebagai akibatnya kaum intelektual kita sangat menderita. Kita harus berupaya untuk membawa orang-orang ini kembali, dan memajukan ilmu pengetahuan [ROOT.GetAdjective] bersama-sama!"
 wuw_HUN_the_spirit_of_the_aster_revolution: "Semangat Revolusi Aster"
 wuw_HUN_the_spirit_of_the_aster_revolution_desc: "Pada akhir Perang Besar, Mihály Károlyi dan rakyat Hongaria mengupayakan demokrasi dan kemerdekaan. Meskipun republik ini sudah berakhir, kita harus membangkitkan semangat dan solidaritas yang dirasakan rakyat kita selama Revolusi Krisan ini, dan bekerja sama menuju masa depan."
 wuw_HUN_promote_entrepreneurship: "Mempromosikan Kewirausahaan"
 wuw_HUN_promote_entrepreneurship_desc: "Salah satu hal terpenting yang dibutuhkan masyarakat yang sedang tumbuh dan berkembang adalah wirausahawan yang siap dan bersedia mengambil risiko untuk memperbaiki negara tempat mereka tinggal, dan yang akan menginvestasikan modalnya kembali ke bidang tersebut. Perilaku seperti ini harus kita promosikan agar rumah kita sejahtera."
 wuw_HUN_uplift_the_dragon_movement: "Angkat Gerakan Naga"
 wuw_HUN_uplift_the_dragon_movement_desc: "Gerakan Naga, juga dikenal sebagai Persatuan Penduduk Asli Hongaria, adalah kelompok yang terutama mewakili kepentingan kelas menengah, dengan semboyan 'Hongaria adalah milik Hongaria!' Mereka menuntut kaum intelektual yang diperintah oleh Hongaria, dan kebijakan Lembah Danube yang berorientasi Hongaria, untuk Hongaria Raya dengan nilai-nilai lama. Kita harus mendukung mereka, karena gagasan mereka sejalan dengan gagasan kita."
 wuw_HUN_a_danubian_federation: "Federasi Danubia"
 wuw_HUN_a_danubian_federation_desc: "Dengan penempatan kami yang unik di tengah-tengah Eropa, kami mempunyai potensi untuk menjadi sangat berpengaruh tanpa memerlukan perolehan teritorial yang jelas. Sama pentingnya dengan kekuatan tentara kita, adalah kekuatan yang terkandung dalam kata-kata dan tindakan diplomatik kita. Dengan membentuk komunitas di sekitar Sungai Danube, kita dapat memiliki jangkauan dan kekuatan diplomatik yang jauh melampaui batas negara kita."
 AUS_otto_von_habsburg_has_joined_austria_flag: "Otto von Habsburg telah kembali ke Austria"
 wuw_HUN_ward_against_extremism: "Menangkal Melawan Ekstremisme"
 wuw_HUN_ward_against_extremism_desc: "Ketika ekstremisme semakin mendekat, negara-negara di Danubia harus bangga menjadi benteng kebebasan dan demokrasi, menangkal segala musuh kebebasan. Bersama-sama, kita harus mempertahankan demokrasi!"
 wuw_HUN_ward_against_extremism_tt: "Setiap anggota fraksi juga akan memperoleh semangat kebangsaan ini"
 wuw_HUN_bringing_down_the_giants: "Menghancurkan Para Raksasa"
 wuw_HUN_bringing_down_the_giants_desc: "Ada banyak kekuatan besar yang akan menantang kita, dan berupaya mengakhiri kebebasan kita. Kami tidak akan membiarkan mereka melakukan hal tersebut, dan untuk menjamin keselamatan rakyat kami, kami harus terlebih dahulu menyerang negara-negara ini, sehingga kami dapat hidup selamanya tanpa ancaman kehancuran yang semakin besar."
 HUN_bringing_down_the_giants_tt: "Mendapatkan §Y[GetWargoalBasedOnGovernment]§! tujuan perang melawan negara-negara besar Non-Demokrat di Eropa:"
 wuw_HUN_the_cult_of_arpad: "Kultus Árpád"
 wuw_HUN_the_cult_of_arpad_desc: "Árpád yang agung, kepala konfederasi suku Magyar pada pergantian abad ke-9 dan ke-10 adalah inspirasi besar bagi rakyat Hongaria, dan dinastinya bertahan dalam waktu yang lama, menjadikan [ROOT.GetnameDef] yang terbaik. Kita harus mengambil satu halaman dari bukunya dan mengikuti teladannya, sambil menopangnya sebagai pahlawan legenda."
 wuw_HUN_demand_szekely_autonomy: "Menuntut Otonomi Székely"
 wuw_HUN_demand_szekely_autonomy_desc: "Keluarga Székely yang tinggal di Transylvania juga ingin bersatu kembali dengan saudara-saudara mereka di Hongaria, dan kita harus memastikan bahwa Tanah Székely dapat memperoleh kemerdekaannya, asalkan berada di bawah pengelolaan kita."
 wuw_HUN_approach_the_diasporas: "Dekati Diaspora"
 wuw_HUN_approach_the_diasporas_desc: "Sejak perjanjian Trianon, diaspora Hongaria ada di luar negara kita di hampir semua arah. Kita harus mendekati kembali orang-orang ini dan menanamkan rasa kebanggaan nasional dan patriotisme yang besar terhadap negara Hongaria, mempersiapkan mereka untuk pembebasan dari penindas tirani mereka."
 wuw_HUN_revive_the_tribal_consolidation: "Bangkitkan Bangsa Hongaria"
 wuw_HUN_revive_the_tribal_consolidation_desc: "Banyak orang mungkin telah melupakan kehebatan Bangsa Hongaria di masa lalu, namun Gerakan Naga belum melupakannya. Sudah saatnya kita merebut kembali apa yang menjadi milik kita, dan mereformasi masyarakat kita agar sesuai dengan rencana Gerakan Naga."
 wuw_HUN_reclaim_the_pannonian_steppe: "Rebut kembali Stepa Pannonia"
 wuw_HUN_reclaim_the_pannonian_steppe_desc: "Dahulu kala orang-orang Magyar tiba di sini di Cekungan Pannonia dan mengklaimnya sebagai milik mereka, membentuk Konsolidasi Suku-suku Hongaria. Sekarang, penjajah asing menduduki tanah leluhur kami, yang jelas-jelas melanggar hak leluhur kami. Kita harus menyerang dengan cepat dan merebut kembali Pannonia dari musuh kita."
 wuw_HUN_undermine_the_admiral: "Melemahkan Laksamana"
 wuw_HUN_undermine_the_admiral_desc: "Laksamana Muda Miklós Horthy telah terlalu lama menikmati waktunya duduk di atas takhta [ROOT.GetAdjective] yang kosong, dan mungkin akan mulai membangun dinasti. Kita harus mengakhiri pemerintahannya, dan memiliki orang yang lebih bijak, seperti Gyula Gömbös yang akan mengambil alih pemerintahan. MOVE dapat membantu mewujudkan hal ini."
 wuw_HUN_integrate_the_volksbund: "Integrasikan Volksbund"
 wuw_HUN_integrate_the_volksbund_desc: "Untuk menggulingkan Horthy, kita membutuhkan banyak orang. Orang-orang seperti itu, yang dapat kita temukan dalam gerakan sosialis nasional, Volksbund der Deutschen di Ungarn, meskipun mereka tidak penting. Jika kita bisa mempengaruhi mereka agar memihak kita, kita bisa menggunakannya tidak hanya untuk pengambilalihan kekuasaan, tapi juga sebagai kekuatan paramiliter di kemudian hari."
 wuw_HUN_volksbund_der_deutschen_in_ungarn: "Volksbund der Deutschen di Ungarn"
 wuw_HUN_volksbund_der_deutschen_in_ungarn_desc: "Gerakan sosialis nasional yang disponsori DNSAP; Volksbund der Deutschen di Ungarn, akan menjadi organisasi penjaga dan milisi yang setia kepada raja Jerman yang baru. Kita harus menjangkau mereka, dan mendorong kerja sama dengan kepemimpinan mereka."
 franz_and_henrik_available_tt: "§YFranz Anton Basch§! dan §YHenrik Werth§! masing-masing tersedia sebagai level 2 §YGeneral§! dan level 3 §YField Marshal§!"
 HUN_volksbund_militia_recruitment_tt: "Dapatkan empat unit Volksbund §YMilitia§!"
 wuw_HUN_empower_the_greenshirts: "Memberdayakan Kaum Hijau"
 wuw_HUN_empower_the_greenshirts_desc: "Partai Sosialis Nasional Hongaria dan para pengikutnya, meskipun memiliki perbedaan ideologis dengan Gömbös, adalah sekutu yang baik karena kesetiaan mereka tidak terletak pada Horthy. Meski berisiko, menyelundupkan senjata ke partai mereka bisa bermanfaat, sehingga mereka bisa membantu kita dalam penggantian bupati."
 wuw_HUN_the_march_on_budapest: "Pawai di Budapest"
 wuw_HUN_the_march_on_budapest_desc: "Sekarang kaum fasis telah terorganisir dan dipersenjatai, kita dapat meminta mereka bergerak ke ibu kota, menuntut pengunduran diri Bupati Miklós Horthy. Dengan melakukan hal ini, Gömbös dapat mengambil alih posisi yang selayaknya sebagai penguasa negara tersebut, dan segera memulihkan ketertiban, serta mendeklarasikan dirinya sebagai presiden Hongaria."
 wuw_HUN_government_of_national_unity: "Pemerintahan Persatuan Nasional"
 wuw_HUN_government_of_national_unity_desc: "Gömbös antara lain memperkuat dan mempersenjatai partai Kehendak Nasional untuk mencuri kabupaten dari Horthy. Namun apa yang gagal dia sadari adalah bahwa kini merekalah yang memegang kekuasaan sebenarnya, dan kini, tidak ada seorang pun yang menghalangi naiknya pemimpin mereka Ferenc Szálasi ke tampuk kekuasaan."
 wuw_HUN_institute_corporatism: "Institut Korporatisme"
 wuw_HUN_institute_corporatism_desc: "Untuk memulihkan negara kita setelah kehancuran dan penghinaan akibat Perang Besar dan Perjanjian Trianon, kita harus mengadopsi model ekonomi Mussolini, dan melakukan banyak reformasi korporatis."
 wuw_HUN_a_roman_catholic_state: "Negara Katolik Roma"
 wuw_HUN_a_roman_catholic_state_desc: "Negara kami telah menganut agama Kristen sejak lama, dengan beberapa orang Hongaria yang pertama kali bertobat adalah kepala suku harka Bulcsú dan gyula Geula, sekitar tahun 950. Kami masih menganut agama Katolik yang taat hingga hari ini, dan tidak akan menyimpang dari jalan kami, apa pun kesulitan yang kami hadapi."
 wuw_HUN_incorporate_the_hungarian_life_movement: "Gerakan Kehidupan Hongaria"
 wuw_HUN_incorporate_the_hungarian_life_movement_desc: "Kita harus berupaya untuk memasukkan politisi sayap kanan Béla Imrédy dan Gerakan Kehidupan Hongaria ke dalam organisasi kita, sehingga memungkinkan dia mendapat tempat di pemerintahan kita."
 wuw_HUN_wherever_the_cross_points: "Dimanapun Titik Salibnya"
 wuw_HUN_wherever_the_cross_points_desc: "Sesuai dengan simbol gerakan kami, panah silang, Hongaria harus merebut kembali hak kesulungannya, dan memperluas ke segala arah yang ditunjuk oleh panah tersebut. Waktunya telah tiba, untuk merebut kembali apa yang menjadi hak kita!"
 wuw_HUN_the_war_on_atheism: "Perang Melawan Ateisme"
 wuw_HUN_the_war_on_atheism_desc: "Belakangan ini, manusia mulai melupakan Tuhan. Momok ateisme yang semakin besar akan terus menyebar, kecuali kita menyerang intinya. Kita harus menjatuhkan komunis sekarang, jangan sampai ajaran sesat ini berlanjut selamanya."
 wuw_HUN_heirs_of_the_huns: "Pewaris suku Hun"
 wuw_HUN_heirs_of_the_huns_desc: "Ada banyak gagasan berbeda mengenai asal usul orang-orang kami, termasuk orang Finno-Ugric, atau orang Turki. Walaupun semua hal di atas mungkin benar, namun harus ditegaskan bahwa kami adalah pewaris sejati suku Hun, dan bahwa kami akan membawa kehancuran bagi siapa pun yang menentang kami."
 wuw_HUN_sway_the_count: "Goyangkan Hitungannya"
 wuw_HUN_sway_the_count_desc: "Count Fidél Pálffy ab Erdőd adalah seorang bangsawan dan pendukung besar Nazisme gaya Jerman di negara kita. Tampaknya ia sangat disukai oleh kontak-kontak NSDAP, dan mungkin sangat berguna jika kita berada di pihak kita ketika mencoba terlibat dalam diplomasi dengan negara-negara yang berpikiran sama."
 HUN_hire_fidel_palffy_tt: "Mempekerjakan §YCount Fidél Pálffy§! sebagai penasihat"
 wuw_HUN_our_ancestral_lands: "Tanah Leluhur Kita"
 wuw_HUN_our_ancestral_lands_desc: "Dengan memperkuat klaim kami tidak hanya atas tanah kuno Finno-Ugric, tetapi juga atas tanah Turki kuno berkat warisan Turanik yang kami klaim, kami dapat mengklaim semua tanah lama kami, dan merebut kembali tanah yang menjadi hak kami."
 wuw_HUN_demand_croatian_reintigration: "Menuntut Reintegrasi Kroasia"
 wuw_HUN_demand_croatian_reintigration_desc: "Dengan keamanan dan jalur yang terjamin berkat aliansi baru kita, kita dapat fokus pada hal-hal yang lebih penting yang ada. Sebagian besar wilayah yang sekarang disebut Kroasia adalah bagian dari Kerajaan kami hingga akhir Perang Besar, dan sekarang, kami harus menegakkan klaim kami atas wilayah tersebut."
 wuw_HUN_increase_economic_cooperation: "Meningkatkan Kerja Sama Ekonomi"
 wuw_HUN_increase_economic_cooperation_desc: "Dengan semakin terbukanya pemerintah kita terhadap kerja sama dengan negara tetangga dan aktor internasional, kita harus berusaha untuk terlibat dalam perjanjian perdagangan dan pakta ekonomi baru dengan sekutu baru kita."
 HUN_increase_economic_cooperation_tt: "Kami akan menerima §YPabrik Sipil§! di luar peta untuk setiap negara awal di §YBalkan Barat§!, §YBalkan Timur§!, dan §YBalkan Utara§! yang memiliki nilai lebih tinggi dari §G85§! §Ypendapat§! dari kami. Hal ini berlaku juga untuk §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, §Y[TRA.GetNameDef]§! dan §Y[SLO.GetNameDef]§!."
 wuw_HUN_hold_territorial_referendums: "Mengadakan Referendum Teritorial"
 wuw_HUN_hold_territorial_referendums_desc: "Setelah Perang Besar, banyak wilayah dengan jumlah penduduk Hongaria yang tinggi dirampas dari kami tanpa proses demokrasi yang diawasi oleh pengamat internasional, seperti halnya wilayah di Silesia dan Schleswig. Kita harus melakukan pendekatan diplomatis terhadap negara-negara tetangga kita, dan meminta diadakannya referendum, sehingga masyarakat dapat memutuskan di negara mana mereka ingin tinggal."
 wuw_HUN_hold_territorial_referendums_tt: "Membuka keputusan untuk §YMengadakan Referendum di Wilayah yang Hilang§! untuk mencoba dan mendapatkannya kembali sekali lagi"
 wuw_HUN_sailing_the_danube: "Berlayar di Danube"
 wuw_HUN_sailing_the_danube_desc: "Sungai besar Danube telah lama menjadi sumber kehidupan bangsa kita, dan kita memiliki tradisi yang panjang dan membanggakan dalam menyusuri sungai tersebut, baik untuk mengangkut barang atau memindahkan pasukan kita. Oleh karena itu, kita harus berinvestasi pada angkatan laut kita, dan memastikan bahwa pelayaran kita di sungai dapat terus beroperasi semulus mungkin."
 ### AUSTRIAN FOCUS TREE ###
 AUS_totalitarian_safety: "Keamanan Totaliter"
 AUS_totalitarian_safety_desc: "Pada tahun 1933 Engelbert Dolfuss membawa [AUS.GetNameDef] ke keadaan politiknya saat ini, demi keselamatan bangsa kita. Keputusan untuk menghilangkan parlemen sepenuhnya merupakan hal yang kontroversial di kalangan rakyat kami, namun kami yakin bahwa hal ini diperlukan untuk menjaga keamanan kami. Dolfuss mungkin tidak lagi bersama kita, tapi kita harus tetap berada di jalur ini, demi keselamatan kita sendiri."
 AUS_clamp_down_on_dnsap: "Tekan DNSAP"
 AUS_clamp_down_on_dnsap_desc: "Partai politik di luar Front Vaterländische telah lama dilarang di negara kami. Meskipun demikian, beberapa masih bertahan, dan yang paling meresahkan adalah apa yang disebut DNSAP. Dengan secara keliru mengklaim bahwa mereka mewakili Austrofasisme yang sebenarnya, mereka berpendapat bahwa kita harus menyerahkan kedaulatan kita dan bergabung dalam persatuan dengan [GER.GetNameDef]. Kita harus segera menanganinya!"
 AUS_clamp_down_on_dnsap_tt: "§Y$AUS_kurt_schuschnigg$§! menjadi pemimpin §Y$AUS_fascism_vaterlandische_front_long$§! dan partai yang berkuasa akan beralih ke §YFasisme§!."
 AUS_supporting_italy_in_ethiopia_focus: "Mendukung [ITA.GetNameDef] di [ETH.GetNameDef]"
 AUS_supporting_italy_in_ethiopia_focus_desc: "Untuk waktu yang lama [ITA.GetNameDef] berada di pihak kita. Sebagai salah satu penjamin kemerdekaan kita, sangatlah penting bagi kita untuk menjaga hubungan baik dengan mereka dan kita tidak membiarkan mereka terpengaruh oleh upaya [GER.GetAdjective] untuk membujuk mereka. Dengan membantu [ITA.GetAdjective] di [ETH.GetNameDef] kita membangun kepercayaan antar negara kita, dan meningkatkan peluang mereka untuk membantu kita, jika diperlukan."
 AUS_supporting_italy_in_ethiopia_focus_tt: "Membuka keputusan untuk §YMendukung [ITA.GetNameDef] dalam Perang Italia-Ethiopia§!"
 AUS_reach_out_to_italy: "Jangkau Italia"
 AUS_reach_out_to_italy_desc: "Meskipun kita sering berselisih paham, Italia tetap menjadi sekutu paling tepercaya yang kita miliki dalam situasi saat ini. Ketika kerusuhan dan ketegangan meningkat di sekitar kita, akan bermanfaat jika kita menghubungi mereka untuk mendapatkan dukungan."
 AUS_approach_democratic_guarantors: "Dekati Penjamin Demokrat"
 AUS_approach_democratic_guarantors_desc: "Setelah Perjanjian Saint-Germain-En-Laye ditandatangani, kami mendapati pasukan kami terlalu kecil untuk mempertahankan diri. Jika kita ingin menang dalam situasi yang semakin berbahaya, kita memerlukan dukungan. Meskipun kita sering kali tidak bertemu langsung dengan negara-negara penandatangan Traktat lainnya, kita harus menghubungi mereka dan meminta dukungan mereka jika konflik dingin di sekitar kita semakin memanas."
 AUS_approach_democratic_guarantors_tt: "§YEfek untuk masing-masing negara jika mereka menerima:§!"
 AUS_refine_vaterlandische_front: "Sempurnakan Bagian Depan Vaterländische"
 AUS_refine_vaterlandische_front_desc: "Sudah lama Front Vaterländische merupakan kolaborasi Partai-partai politik yang digabung menjadi satu melalui Penghapusan Diri Parlemen. Ideologi awal Austrofasisme perlahan-lahan berubah seiring waktu dengan cara yang tidak menguntungkan kita. Sudah saatnya kita mengarahkan diri kita kembali ke jalur yang benar."
 AUS_seek_agreement_for_rearmament: "Carilah Kesepakatan untuk Mempersenjatai Kembali"
 AUS_seek_agreement_for_rearmament_desc: "Dengan politik internal kita yang sudah lebih terkendali, inilah saatnya kita beralih ke pandangan ke luar. Kami masih terikat oleh Perjanjian Saint-Germain-En-Laye yang tidak adil, sehingga menghambat pertumbuhan militer dan kemampuan membela diri. Karena kami sedikit bergantung pada negara-negara penandatangan lainnya untuk menjaga keamanan kami, akan lebih bijaksana jika kami memberi tahu mereka tentang niat kami untuk mempersenjatai kembali, dan meminta persetujuan mereka."
 AUS_seek_agreement_for_rearmament_tt: "Acara akan dikirim ke §Y[ITA.GetFlag][ITA.GetName], [ENG.GetFlag][ENG.GetName] [FRA.GetFlag][FRA.GetName],§! dan §Y[USA.GetFlag][USA.GetName]§! agar mereka dapat menyetujui atau menolak permintaan tersebut. Apa pun tanggapannya, pilihan untuk mempersenjatai kembali tetap bisa diambil."
 AUS_rearmament_and_guarantees_tt: "§RBertentangan dengan keinginan penjamin dapat menimbulkan konsekuensi diplomatik, mulai dari penurunan opini hingga pencabutan jaminan!§!"
 AUS_disregard_the_treaties: "Abaikan Perjanjian"
 AUS_disregard_the_treaties_desc: "Meskipun kami menghormati para penandatangan yang ingin membuat kami tetap terikat pada Perjanjian Saint-Germain-En-Laye, situasi dunia saat ini tidak lagi memungkinkan kami untuk mengikuti perintah Perjanjian tersebut. Tindakan-tindakan ini mungkin akan membuat marah mitra-mitra Perjanjian kita dan kita mungkin akan menanggung akibatnya, namun kita tidak bisa membiarkan diri kita terikat lebih lama lagi."
 AUS_rapid_rearmament: "Persenjataan Kembali Cepat"
 AUS_rapid_rearmament_desc: "Setelah akhirnya terbebas dari belenggu Perjanjian, kita sekarang harus segera mempersenjatai kembali. Angkatan Darat dan Angkatan Udara kita telah sangat terbengkalai dalam satu dekade terakhir dan diperlukan upaya yang signifikan untuk mengembalikan kita ke tingkat yang dapat diterima."
 AUS_spanish_intervention: "Intervensi di Spanyol"
 AUS_spanish_intervention_desc: "Semenanjung Iberia dilanda Perang Saudara. Banyak kekuatan luar yang ikut campur ketika kaum nasionalis dan republik bentrok dalam konflik kekerasan dan kami tidak melihat alasan mengapa kami tidak ikut campur tangan juga. Dengan melakukan intervensi, kita dapat membuat pasukan kita mendapatkan lebih banyak pengalaman dalam peperangan modern dan mendapatkan tolok ukur seberapa baik pasukan kita memenuhi standar yang ada saat ini."
 AUS_demand_part_of_spanish_winnings: "Minta bagian dari Kemenangan Spanyol"
 AUS_demand_part_of_spanish_winnings_desc: "Ketika api konflik perlahan-lahan memudar di Semenanjung Iberia, dan teman-teman kita di [SPA.GetNameDef] menang, inilah saatnya bagi kita untuk melihat apa yang kita peroleh dari upaya ini. Bantuan kami kepada [SPA.GetAdjective] seharusnya membuat kami mendapat kebaikan dari mereka dan tampaknya tepat bagi kami untuk meminta sejumlah kompensasi atas bantuan kami."
 AUS_volunteer_effort_SPA_flag: "Telah mengirimkan relawan ke [SPA.GetFlag]§Y[SPA.GetNameDef]§!"
 AUS_invite_spanish_refugees: "Undang Nasionalis Spanyol"
 AUS_invite_spanish_refugees_desc: "Meskipun kami telah berupaya semaksimal mungkin dalam Perang Saudara, kami tidak dapat membantu saudara-saudara kami yang [SPA.GetAdjective] meraih kemenangan. Meskipun hasilnya sangat mengecewakan, kami mungkin masih bisa membantu mereka dan kami memulihkan diri dengan mengundang mereka yang berjuang untuk tujuan yang sama kepada kami dan mengintegrasikan mereka ke dalam masyarakat dan tentara [AUS.GetAdjective]."
 AUS_integrate_dnsap_remnants: "Integrasikan Sisa-sisa DNSAP"
 AUS_integrate_dnsap_remnants_desc: "Masih ada sisa DNSAP di [AUS.GetNameDef] meskipun ada larangan yang lebih ketat. Meskipun sebagian besar dari mereka telah mendukung Grossdeutsche Volkspartei, beberapa di antaranya masih berada dalam kekosongan politik. Kita harus berusaha merekrut mereka ke Front Vaterländische untuk mencegah pemberontakan lagi dari mereka."
 AUS_heimwehr_support: "Dapatkan Dukungan Dari Heimwehr"
 AUS_heimwehr_support_desc: "Selama tahun-tahun hidup di bawah Perjanjian Saint-Germain-En-Laye [AUS.GetNameDef] terjadi peningkatan pesat dalam jumlah organisasi paramiliter. Hal ini umumnya dilarang dan sebagian besar mempunyai agenda politik yang ingin mereka dorong. Cita-cita Heimwehr tidak pernah jauh dari cita-cita kita. Dengan mendapatkan dukungan mereka, kita bisa membujuk mereka untuk berperang berdampingan dengan Bundesheer kita."
 AUS_frontmiliz_focus: "Frontmiliz"
 AUS_frontmiliz_focus_desc: "Sekarang kita telah mendapatkan kepercayaan dari [GetMilitiaName] kita harus memastikan integrasi cepat mereka ke dalam Bundesheer. Meskipun mereka masih merupakan entitas yang terpisah, kita harus memastikan kedua belah pihak bekerja sama dengan lancar. Hal ini akan menjamin kesuksesan kita baik di medan perang maupun di jalanan negara kita."
 AUS_fit_for_fight: "Siap untuk Menyerang"
 AUS_fit_for_fight_desc: "Kita telah menempuh perjalanan panjang dalam membangun kembali negara kita dari keadaan yang menyedihkan, namun kita tidak bisa berhenti sampai di sini. Meskipun dampak dari upaya kita untuk mempersenjatai kembali dan membangun kembali dapat terwujud, kita harus mempersiapkan sistem yuridis kita sehingga undang-undang kita tidak akan menghambat upaya kita."
 AUS_form_nachrichtenabteilun: "Bentuk Nachrichtenabteilung"
 AUS_form_nachrichtenabteilun_desc: "Kita telah lama dilucuti senjatanya dan meskipun hal ini mempunyai konsekuensi yang mengerikan, hal ini juga mempunyai dampak positifnya. Dunia menganggap kami hanya sekedar pemula kecil yang hanya berfokus pada tentara kami. Dengan berfokus pada intelijen dan spionase saat ini kita dapat memanfaatkan asumsi mereka sendiri untuk keuntungan kita."
 nachrichtenabteilung_bonus: "Bonus Nachrichtenabteilung"
 AUS_wienfilm_propaganda_effort: "Propaganda Film Wien"
 AUS_wienfilm_propaganda_effort_desc: "Ketika perang berkecamuk di dunia, sangatlah penting bagi kita untuk menjaga bangsa kita sendiri. Akhir-akhir ini kita melihat negara-negara menggunakan industri filmnya untuk meningkatkan semangat masyarakatnya. Mengingat kami memiliki Wien-Film sendiri, kami harus mempertimbangkan untuk melakukan hal yang sama."
 AUS_consolidate_industries: "Der Ständestaat"
 AUS_consolidate_industries_desc: "Sektor industri kita telah tumbuh secara signifikan dalam waktu singkat dan dampak positifnya terhadap perekonomian dan angkatan bersenjata kita sangat besar. Untuk lebih memperkuatnya, kita harus membuat rencana konsolidasi dan memastikan bahwa kita bisa mendapatkan efisiensi dan output terbaik dari industri-industri ini."
 AUS_universitat_graz: "Universitas Graz"
 AUS_universitat_graz_desc: "Universitas di Graz telah melahirkan banyak pemikir cemerlang dan beberapa pemenang Hadiah Nobel. Kolaborasi yang lebih erat dengan Universitas dapat mempercepat penelitian kami secara signifikan."
 AUS_recruiting_the_graduates: "Merekrut dari Universitas"
 AUS_recruiting_the_graduates_desc: "Untuk mempertahankan upaya ilmiah kita dalam jangka panjang, kita harus memastikan untuk terus memperoleh bakat-bakat baru. Dengan bekerja sama dengan Universitas di Graz kami dapat menarik mahasiswa, alumni, dan profesor ke proyek kami."
 AUS_heritage_of_an_empire: "Warisan Sebuah Kerajaan"
 AUS_heritage_of_an_empire_desc: "Kita tidak melupakan masa lalu kita, kecuali beberapa dekade yang lalu. Pada dasarnya [AUS.GetNameDef] masih merupakan sebuah kerajaan, dan dengan kerja keras tidak akan lama lagi kita akan menjadi sebuah kerajaan lagi. Sudah saatnya kita mempersiapkan masyarakat kita untuk menghadapi transisi ini."
 AUS_second_brothers_war: "Perang Saudara Kedua"
 AUS_second_brothers_war_desc: "Pada tahun 1866 perang dimulai antara kami dan pendahulu [GER.GetNameDef]. Saat itu hanya ada perselisihan kecil mengenai Schleswig-Holstein, namun kini zaman telah berubah. [GER.GetAdjective] terus menjadi ancaman di perbatasan utara kita. Sudah saatnya kita mengakhiri persaingan persaudaraan ini untuk selamanya."
 AUS_unlocks_reichstag_raid: "Membuka §YRaid§!:\nSerangan Bom Reichstag di §Y[GER.GetNameWithFlag]§!"
 AUS_an_improved_german_state: "Negara Jerman yang Lebih Baik"
 AUS_an_improved_german_state_desc: "Kami selalu menganggap diri kami sebagai negara Jerman terbaik di dunia dan belakangan ini kami membuktikan bahwa kami benar. Kami tidak akan lagi membiarkan [GER.GetNameDef] menodai reputasi kolektif rakyat Jerman. Sudah waktunya kita mengintegrasikan mereka ke dalam negara kita yang mulia dan menggunakan kekuatan mereka untuk diri kita sendiri!"
 AUS_restoring_our_rightful_flag: "Mengembalikan Hak Atas Bendera Kita"
 AUS_restoring_our_rightful_flag_desc: "Saat kami memasuki Olimpiade 1936 kami menemukan bahwa bendera kami sama dengan bendera [HAI.GetNameDef]. Dengan berat hati kami mengganti bendera kami agar berbeda dengan bendera mereka tetapi faktanya tetap sama, bendera itu milik kami, dan karena [HAI.GetAdjective] tidak menyerahkannya, kami harus menghadapinya dengan cara lain."
 AUS_seek_to_purchase_alaska: "Membeli [463.GetName]"
 AUS_seek_to_purchase_alaska_desc: "Pada tahun 1867 kami ditawari untuk membeli [463.GetName] oleh Alexander II dari Rusia. Kami meneruskan tawaran itu saat itu karena negara tidak punya apa pun untuk ditawarkan kepada kami. Namun zaman telah berubah, dan kita harus mempertimbangkan untuk menghubungi pemilik [463.GetName] untuk mencoba dan menegosiasikan kesepakatan."
 AUS_bring_hungary_back_into_the_fold: "Membawa Hongaria Kembali ke Kekuasaan"
 AUS_bring_hungary_back_into_the_fold_desc: "Belum lama ini kami dan [HUN.GetAdjective] menjadi bagian dari bangsa besar yang sama. Kami secara paksa terpecah setelah Perang Besar dan keduanya sangat lemah karena perjanjian tidak adil yang dipaksakan kepada kami. Untuk mencegah hal serupa terjadi lagi, kami harus mengusulkan integrasi penuh ke dalam [ROOT.GetNameDef]!"
 AUS_bring_hungary_back_into_the_fold_tt: "Membuka keputusan untuk §YMencaplok Tanah Lama§! dan keputusan terpisah untuk §YMeningkatkan Kemungkinan Aneksasi Diplomatik§!."
 target_hun_tt: "Keputusan tersebut akan menyasar §Y[HUN.GetNameWithFlag]§!"
 target_cze_tt: "Keputusan tersebut akan menyasar §Y[CZE.GetNameWithFlag]§!"
 target_yug_tt: "Keputusan tersebut akan menargetkan §Y[YUG.GetNameWithFlag]§! atau §YNegara mana pun§! yang saat ini memiliki §Y[102.GetName]§!, §Y[109.GetName]§! dan §Y[853.GetName]§!."
 target_pol_tt: "Keputusan tersebut akan menyasar §Y[POL.GetNameWithFlag]§!"
 target_rom_tt: "Keputusan tersebut akan menyasar §Y[ROM.GetNameWithFlag]§!"
 target_alb_tt: "Keputusan tersebut akan menyasar §Y[ALB.GetNameWithFlag]§!"
 more_likely_to_accept_if_military_inferior_tt: "Dengan §Ymeningkatkan kekuatan militer kita§! kita meningkatkan peluang mereka menerima §GAneksasi Damai§!!"
 AUS_the_czechoslovakian_lands: "Tanah Cekoslowakia"
 AUS_the_czechoslovakian_lands_desc: "Wilayah di utara kami di [CZE.GetNameDef] dulunya adalah bagian dari kerajaan besar kami sebelum semuanya runtuh. Sampai hari ini masih banyak kelompok penutur bahasa [GER.GetAdjective] yang tinggal di wilayah ini dan berdasarkan hal tersebut, sudah sewajarnya mereka sekali lagi menjadi bagian dari kelahiran kembali Kekaisaran kita, apakah mereka ingin bergabung secara damai atau tidak, itu terserah mereka."
 AUS_reclaiming_yugoslavian_territories: "Merebut Kembali Wilayah Balkan"
 AUS_reclaiming_yugoslavian_territories_desc: "Kerajaan besar kita pernah terbentang hingga Laut Adriatik. Tanah-tanah ini juga dicuri dari kami pada akhir Perang Besar. Dengan mereklamasi lahan-lahan ini, kita juga akan merebut kembali garis pantai yang penting secara taktis. Kita harus memberikan saran kepada pemilik negara-negara bagian ini agar mereka menyerahkannya kepada kita secara damai, atau menanggung risiko konsekuensinya."
 AUS_reclaiming_yugoslavian_territories_tt: "Pemilik §Y[102.GetName]§!, §Y[103.GetName]§! dan §Y[853.GetName]§! Mendapat event '§YUltimatum Dari [AUS.GetNameDef]§!'"
 AUS_take_albania: "Misalnya Albania"
 AUS_take_albania_desc: "[ALB.GetNameDefCap] mungkin bukan bagian terpenting dari tanah kami, faktanya, tanah tersebut tidak pernah benar-benar milik kami meskipun sudah ada rencana untuk mewujudkannya. Namun, kini kita kembali mengintai keberadaan kita di Balkan, tidak ada alasan kita tidak mengklaimnya lagi."
 AUS_take_back_galicia: "Ambil Kembali Galicia"
 AUS_take_back_galicia_desc: "Ketika Kerajaan kita mulai tumbuh kembali, kita tidak bisa segan-segan menuntut kembali tanah yang menjadi hak kita bahkan dari negara-negara yang lebih besar. [POL.GetNameDefCap] setidaknya terlihat lebih besar dari kami, tetapi Galicia tetap harus menjadi milik kami, dan jika mereka tidak bersedia memberikannya kepada kami, kami mungkin harus menggunakan kekerasan."
 AUS_demand_romanian_lands: "Permintaan Transylvania dan Bucovina"
 AUS_demand_romanian_lands_desc: "Setelah mengambil sebagian tanah di daerah tetangga kami, sekarang kami mungkin mulai mempertimbangkan wilayah kami yang lebih jauh. Lahan yang dulu kami miliki di [ROM.GetNameDef] merupakan aset besar bagi kami dan kami harus merebut kembali lahan tersebut sesegera mungkin. Apa yang dipikirkan oleh pimpinan [ROM.GetAdjective] tidak menjadi masalah, jika mereka tidak mau tunduk, kita mungkin harus mempertimbangkan pilihan lain."
 AUS_integrate_northwest: "Integrasikan Böhmen"
 AUS_integrate_northwest_desc: "Untuk memanfaatkan wilayah yang telah kita reklamasi sebagai milik kita dengan lebih baik, kita harus memastikan bahwa negara ini tetap bersatu. Negara-negara bagian yang paling berkeinginan dan berguna harus diintegrasikan ke dalam Kekaisaran sesegera mungkin. Wilayah yang kami klaim dari [CZE.GetNameDef] terbukti paling menjanjikan. Kita harus segera memulai upaya integrasi!"
 AUS_integrate_hungary: "Integrasikan Hongaria"
 AUS_integrate_hungary_desc: "Untuk memanfaatkan wilayah yang telah kita reklamasi sebagai milik kita dengan lebih baik, kita harus memastikan bahwa negara ini tetap bersatu. Negara-negara bagian yang paling berkeinginan dan berguna harus diintegrasikan ke dalam Kekaisaran sesegera mungkin. Wilayah yang kami klaim dari [HUN.GetNameDef] terbukti paling menjanjikan. Kita harus segera memulai upaya integrasi!"
 AUS_proclaim_austrian_empire: "Proklamasikan Kekaisaran Austria"
 AUS_proclaim_austrian_empire_desc: "Upaya kami untuk membangun kembali dan mendirikan kembali Kerajaan kami akhirnya membuahkan hasil. Kami telah menaklukkan semua wilayah lama kami dan berhak menyebut diri kami Kekaisaran sekali lagi!"
 AUS_beyond_our_old_lands: "Melampaui Tanah Lama Kita"
 AUS_beyond_our_old_lands_desc: "Ketika kita kembali menjadi negara besar, pertanyaannya kembali muncul. Kita menguasai seluruh tanah lama kita, tapi mengapa berhenti di sini? Dengan kekuatan yang kita miliki saat ini untuk berkembang lebih jauh seharusnya tidak menjadi masalah."
 AUS_join_the_axis: "Kekuatan dalam Angka"
 AUS_join_the_axis_desc: "Meskipun kita kuat jika kita berdiri sendiri, tidak dapat disangkal bahwa menjadi bagian dari suatu bentuk aliansi militer akan menguntungkan kita dan aliansi yang ingin kita ikuti. Kita harus mempertimbangkan untuk mendekati faksi yang paling dekat dengan kita dan meminta izin untuk bergabung."
 AUS_join_the_axis_tt: "§R[GER.GetNameWithFlag] sangat kecil kemungkinannya untuk menerima kita sebagai anggota [GER.GetFactionName], bahkan dengan hubungan yang sangat baik pun mereka mungkin masih menolak!§!"
 AUS_reforming_the_central_powers: "Reformasi Kekuatan Sentral"
 AUS_reforming_the_central_powers_desc: "Meskipun kami setuju bahwa menjadi bagian dari aliansi militer akan meningkatkan kekuatan kami, namun melihat pilihan-pilihan yang tersedia, kami merasa bahwa pilihan-pilihan tersebut tidak sepenuhnya sesuai dengan standar kami. Selama Perang Besar, kita adalah bagian dari Kekuatan Sentral yang perkasa, sehingga kita tidak mempunyai pilihan yang lebih baik sehingga kita harus mempertimbangkan untuk mereformasi faksi ini."
 AUS_reforming_the_central_powers_tt: "Mengundang §Y[GER.GetNameWithFlag]§!, §Y[TUR.GetNameWithFlag]§!, dan §Y[BUL.GetNameWithFlag]§! ke §YKekuatan Pusat§! jika mereka §YFasis§! atau §YNon-Blok§! dan saat ini tidak berada dalam faksi."
 AUS_for_a_better_future: "Masa Depan [AUS.GetAdjective]"
 AUS_for_a_better_future_desc: "Melihat ke belakang, tujuan kami selalu berkaitan dengan membangun kembali apa yang telah hilang. Sekarang setelah hal ini tercapai, kita perlu mulai menatap masa depan kita."
 AUS_war_against_bolshevism: "Perang Melawan Bolshevisme"
 AUS_war_against_bolshevism_desc: "Kaum Bolshevik [SOV.GetAdjective] di wilayah timur kami selalu menjadi duri di pihak kami. Agar tidak lengah, kita harus memastikan bahwa kitalah yang menyerang lebih dulu."
 AUS_crusade_on_communism: "Perang Salib Melawan Komunisme"
 AUS_crusade_on_communism_desc: "Selama masih ada komunis di benua Eropa, maka negara kita dan rakyatnya tidak akan aman. Kita harus mengakhiri ancaman merah ini sebelum menjadi sumber masalah yang nyata."
 AUS_crusade_on_communism_tt: "Memperoleh §YAnnex§! tujuan perang di seluruh negara §YKomunis§! di §YEropa§!"
 AUS_crusade_on_communism_d_tt: "Mendapatkan §YMenggulingkan Pemerintah§! tujuan perang di seluruh negara §YKomunis§! di §YEropa§!"
 AUS_repeal_the_may_constitution: "Mencabut Konstitusi Mei"
 AUS_repeal_the_may_constitution_desc: "Konstitusi Mei yang ditetapkan oleh Engelbert Dolfuss pada tahun 1934 telah menghambat politik [AUS.GetNameDef] selama beberapa tahun terakhir. Partai-partai politik dilarang dan menghilangkan segala kemungkinan perubahan ke arah yang lebih baik bagi bangsa ini. Kita harus mencabut konstitusi yang tidak adil ini jika negara kita ingin berkembang kembali."
 AUS_austria_against_fascism: "Reichsbund der Österreicher"
 AUS_austria_against_fascism_desc: "Ketika bangsa kita pulih dari isolasi politik yang kita alami, tidak mengherankan jika kita melihat kelompok-kelompok politik bermunculan ketika masyarakat akhirnya berani mengutarakan pendapatnya. Reichsbund Der Österreich yang legitimis adalah salah satu kelompok tersebut. Mudahnya, agenda politik mereka tumpang tindih dengan apa yang telah kita rencanakan untuk negara ini. Kita harus memanfaatkan kerja sama ini semaksimal mungkin."
 AUS_reinstate_the_imperial_council: "Aktifkan kembali Herrenhaus"
 AUS_reinstate_the_imperial_council_desc: "Seperti yang kami harapkan, orang-orang kami mengungkapkan keinginan untuk kembali ke masa lalu. Kita tidak memerlukan lagi sistem yang jelas-jelas cacat dan dapat disalahgunakan seperti yang dilakukan kaum fasis dalam Penghapusan Diri Parlemen pada tahun 1934. Aturan satu orang selalu merupakan sistem yang aman dan diterima dengan baik di Monarki Ganda, sekarang saatnya kita menerapkannya kembali."
 AUS_legacy_of_the_empire: "Warisan Sebuah Kerajaan"
 AUS_legacy_of_the_empire_desc: "Meskipun kita saat ini hanyalah bayang-bayang dari masa lalu kita sebagai sebuah kerajaan yang perkasa, tidak ada yang mengatakan bahwa kita tidak dapat bercita-cita untuk membangun kembali keadaan kita yang dulu. Dengan mengobarkan sentimen monarki di negara kita, kita bisa menjadikannya negara monarki yang kuat sekali lagi."
 AUS_imperilalist_sentiments: "Sentimen Imperialis"
 AUS_bring_back_the_habsburg_rule: "Membawa Mahkota"
 AUS_bring_back_the_habsburg_rule_desc: "Agar kita bisa mendapatkan nama Kerajaan sejati, kita perlu memahkotai seorang Raja untuk memimpin negara kita. Bupati kita saat ini pasti akan menjadi raja yang baik, dan kita harus segera mempersiapkan penobatannya."
 AUS_bring_back_the_habsburg_rule_tt: "Jika wali Anda saat ini adalah §YOtto von Habsburg§! atau §YErnst Rüdiger Starhemberg§! mereka akan dinobatkan sebagai Adipati Agung Austria dan memperoleh sifat:\n\n§YArchduke Austria§!:\n- Kekuatan Politik Keuntungan: §G+10%§!\n- Populasi yang Dapat Direkrut: §Y0.50%§!\n- Stabilitas: §G+5%§!\n- Dukungan Perang: §G+5%§!\n- Dukungan Harian untuk Unaligned: §G+0.03§!"
 AUS_repeal_the_habsburgergesetz: "Cabut Habsburgergesetz"
 AUS_repeal_the_habsburgergesetz_desc: "Habsburgergesetz diberlakukan pada tahun 1919 setelah Perang Besar dan sangat membatasi hak dan kekuasaan keluarga Habsburg. Tidak peduli siapa yang saat ini memerintah negara kita, undang-undang ini merupakan noda pada reputasi [AUS.GetNameDef] sebagai monarki dan harus segera dicabut."
 AUS_rebellious_rearmament: "Persenjataan Kembali Pemberontak"
 AUS_rebellious_rearmament_desc: "Sudah terlalu lama [AUS.GetNameDef] terikat oleh Perjanjian Saint-Germain-En-Laye yang sangat tidak adil dan sangat meresahkan tanpa ada jalan keluar. Dengan menginstal ulang monarki, kita sudah melanggar perjanjian dan seharusnya tidak ada alasan bagi kita untuk mematuhi poin-poin lainnya. Sudah saatnya kita menghapuskan perjanjian yang membawa bencana ini!"
 AUS_strengthen_legitimistische_corps: "Memperkuat Korps Legitimistische"
 AUS_strengthen_legitimistische_corps_desc: "Korps Legitimistische dimulai sebagai organisasi mahasiswa untuk bangsawan [AUS.GetAdjective] yang terdaftar di pendidikan tinggi di negara kita. Awalnya mereka tidak lebih dari sekedar perkumpulan mahasiswa yang memiliki kepentingan yang sama, namun seiring dengan semakin sulitnya iklim politik, mereka menjadi semakin militeristik. Kita harus mempertimbangkan untuk merekrut dari mereka untuk mempercepat waktu penempatan."
 AUS_legitimistische_studentenverbindung: "Legitimistische Studentenverbindung"
 AUS_legitimistische_studentenverbindung_desc: "Organisasi minat pelajar Legitimistische Studentenverbindung melayani pelajar loyalis di semua peringkat pendidikan. Kurang militeristik dibandingkan Korps, mereka lebih menyukai wacana dan perdebatan, serta sains. Kepentingan dan kesetiaan mereka yang teguh kepada pemerintah terbukti sangat berguna bagi kita!"
 AUS_legitimistische_jugend: "Legitimistische Jugend"
 AUS_legitimistische_jugend_desc: "Kita telah melihat bahwa memberikan pengenalan dini kepada anak-anak dan remaja tentang monarki dan seluruh nilai-nilai intinya akan memungkinkan mereka tumbuh menjadi warga negara yang setia dan bahagia, yang bekerja, dan jika diperlukan, berjuang untuk negara kita. Ada pihak-pihak yang takut menyebut hal ini sebagai sebuah peluang menuju hal-hal yang lebih buruk, namun kami yakin bahwa pendidikan ini akan benar-benar bermanfaat bagi mereka."
 AUS_repeal_the_adelsaufhebungsgesetz: "Cabut Adelsaufhebungsgesetz"
 AUS_repeal_the_adelsaufhebungsgesetz_desc: "Adelsaufhebungsgesetz mulai berlaku bersamaan dengan Habsburgergesetz dan secara efektif menghapuskan keberadaan bangsawan [AUS.GetAdjective]. Gelar-gelar, hak istimewa kehormatan dan kekuasaan dilucuti dari keluarga-keluarga ini dalam sekejap. Hukum ini jelas salah, dan dengan memulihkan harga diri para bangsawan dan keluarga mereka, kita dapat memastikan kesetiaan mereka di masa depan."
 AUS_the_evidenzburo: "Biro Bukti"
 AUS_the_evidenzburo_desc: "Bersama dengan banyak sistem lain yang dirancang dengan cermat, Evidenzbureau dibongkar pada akhir Perang Besar. Karena kita tidak lagi terikat oleh perjanjian ini, maka tidak ada alasan bagi kita untuk mematuhi kebodohan ini yaitu tidak lagi diperbolehkannya badan intelijen."
 AUS_the_evidenzburo_bonus: "Biro Bukti"
 AUS_a_royal_alliance: "Aliansi Kerajaan"
 AUS_a_royal_alliance_desc: "Negara ini sangat sepi, dan sebagai salah satu dari sedikit monarki yang ada saat ini, rasanya tepat jika kita berupaya untuk bergandengan tangan dengan mereka yang masih melihat pentingnya memiliki raja yang kuat dalam memerintah negara mereka. Kita harus menjangkau mereka yang berpikiran sama dengan kita dan mengusulkan agar kita bersekutu melawan kejahatan yang lebih besar."
 AUS_a_royal_alliance_tt1: "Mengundang §Y[ENG.GetNameWithFlag]§! ke §Y$AUS_a_royal_alliance$§!"
 AUS_a_royal_alliance_tt2: "Mengundang §Y[FRA.GetNameWithFlag]§! ke §Y$AUS_a_royal_alliance$§!"
 AUS_sturmscharen_support: "Dapatkan Dukungan Sturmscharen"
 AUS_sturmscharen_support_desc: "Sturmscharen selalu bertindak sebagai jalan tengah antara Sosial Demokrat Schutzbund dan Nasionalis Heimwehr. Meskipun secara historis dipimpin oleh lawan kami Kurt Schuschnigg, kami percaya bahwa dengan tumpang tindih politik dan nilai-nilai tradisional kami, kami dapat memperoleh dukungan dari Ostmärkische Sturmscharen dan menjadikan mereka bekerja untuk kami."
 AUS_eiserne_legion: "Bentuk Legiun Eiserne"
 AUS_eiserne_legion_desc: "Dengan perubahan kepemimpinan kita dan organisasi paramiliter sekali lagi memungkinkan kemungkinan untuk membentuk pengawal elit khusus untuk [ROOT.GetLeader] telah muncul. Sekelompok kecil pejabat yang sebelumnya berhaluan fasis telah bertindak sebagai sukarelawan untuk membentuk pasukan elit guna menekan oposisi dan mengendalikan massa. Ini adalah kesempatan besar bagi kami!"
 AUS_the_royals_of_liechtenstein: "Mengundang Kerajaan Liechtenstein"
 AUS_the_royals_of_liechtenstein_desc: "Kami secara historis memiliki hubungan dekat dengan Liechtenstein, pangeran mereka baru-baru ini, Franz Joseph I, bahkan mengambil seorang wanita [AUS.GetAdjective] sebagai istrinya. Karena Ferdinand tidak memiliki anak, mahkota tersebut akan diambil alih oleh Alois atau Johannes dari Liechtenstein, namun keduanya telah melepaskan klaim mereka atas mahkota tersebut. Kedua pangeran sekarang menawarkan bantuan mereka kepada kita, kita harus memanfaatkan tawaran ini dengan baik!"
 AUS_osterreichische_akademie: "Akademi Österreichische"
 AUS_osterreichische_akademie_desc: "Österreichische Akademie der Wissenschaften didirikan pada tahun 1846 berdasarkan dekrit tulisan tangan Kaisar Ferdinand I. Sejak itu, akademi ini telah berkembang dari asosiasi ilmiah kecil dan masyarakat menjadi akademi terhormat, yang membina para pemenang Hadiah Nobel. Akademi ini mengalami kesulitan selama krisis keuangan, namun investasi dari kami pasti akan mengembalikannya ke jalur yang benar, dan memberi kami keuntungan besar di masa depan."
 AUS_royal_scientific_grants: "Hibah Ilmiah Kerajaan"
 AUS_royal_scientific_grants_desc: "Investasi kami pada Österreichische Akademie der Wissenschaften sangat bermanfaat bagi kami dan akademi dan kami kini mempertimbangkan apakah akan membawa kemitraan ini ke tingkat berikutnya. Banyak ilmuwan berbakat yang saat ini bekerja di akademi tersebut dan dengan sedikit bujukan, kita seharusnya bisa meminta mereka mengerjakan proyek kita juga."
 AUS_demand_hungarian_submission: "Permintaan Pengajuan [HUN.GetAdjective]"
 AUS_demand_hungarian_submission_desc: "Untuk waktu yang lama kami makmur sebagai Monarki Ganda bersama dengan [HUN.GetNameDef]. Meskipun pengaturan ini berhasil pada saat itu, mereka terbukti kurang pandai bernegara dibandingkan kita, dan sedikit sekali yang mereka lakukan untuk bangsa kita. Dengan menjadikan mereka rezim boneka, kita bisa mendapatkan bagian terbaik dari Monarki Ganda, namun menghindari yang terburuk."
 AUS_demand_hungarian_submission_tt: "Membuka keputusan untuk §YSubjugasi [HUN.GetNameDef]§! dan keputusan terpisah untuk §YMeningkatkan Kemungkinan Subjugasi Diplomatik§!."
 AUS_subjugate_lands_of_old: "Taklukkan Tanah Lama"
 AUS_subjugate_lands_of_old_desc: "Setelah masalah ini segera diatasi, kita harus mulai melakukan ekspansi kembali ke perbatasan kita sebelumnya. Meskipun kita mempunyai kepercayaan penuh terhadap para diplomat kita, dan jika hal itu terjadi, maka akan lebih bijaksana jika kita merencanakan perluasan ini secara bertahap daripada memulai serangan besar-besaran di semua lini."
 AUS_subjugate_lands_of_old_tt: "Membuka keputusan untuk §YMenaklukkan Tanah Lama§! dan keputusan terpisah untuk §YMeningkatkan Kemungkinan Penaklukan Diplomatik§!."
 AUS_the_silesian_question: "Pertanyaan Silesia"
 AUS_the_silesian_question_desc: "Tanah Silesia telah lama menjadi bagian dari kerajaan kita yang luas. Meskipun tidak terhubung dengan jantung negara kita, negara-negara bagian ini masih memiliki nilai yang sangat besar bagi kita. Kita harus meminta negara-negara bagian ini kembali."
 AUS_reclaim_habsburg: "Rebut kembali Habsburg"
 AUS_reclaim_habsburg_desc: "Tanah air kita sendiri masih belum berada dalam kendali kita. Keluarga Habsburg tidak melupakan awal mula mereka yang sederhana di desa Habsburg, meskipun keluarganya adalah bangsawan, mereka dianggap bangsawan rendahan. Banyak hal telah berubah, sekarang saatnya untuk merebut kembali tanah air."
 AUS_reclaim_habsburg_tt: "Mereka akan lebih mungkin menerima jika kita §GLebih Kuat§! dibandingkan mereka.\n\nMembuka keputusan untuk §YMeintegrasikan Kembali Negara-negara Swiss§!."
 AUS_war_against_guarantors: "Perang Melawan Penjamin"
 AUS_war_against_guarantors_desc: "Teks dalam Perjanjian Saint-Germain-En-Laye yang tercela sudah jelas, jika kami membutuhkan bantuan untuk mempertahankan kemerdekaan kami, kami harus diberikan bantuan itu. Itu terbukti hanya sekedar kata-kata kosong untuk menahan kita. Sekarang kita perlahan-lahan kembali berkuasa, inilah saatnya kita membalas dendam. Kami akan mengajari mereka untuk tidak main-main dengan [ROOT.GetNameDef] lagi!"
 AUS_tighten_control_of_subjects: "Mengontrol Subyek"
 AUS_tighten_control_of_subjects_desc: "Kami telah memantapkan diri kami sebagai tuan atas beberapa wilayah lama kami dan walaupun hal ini sangat bagus, kami tidak bisa berhenti di sini. Negara-negara boneka kita ini layak dipimpin oleh para pemimpin besar, sama seperti kita. Syukurlah, kita hanya mengenal rakyatnya!"
 AUS_tighten_control_of_subjects_tt: "Jika §YOtto von Habsburg§! adalah penguasa saat ini dari §Y[ROOT.GetNameWithFlag]§!, membuka keputusan untuk §YMemasang Raja Habsburg§! di §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! dan §Y[POL.GetNameWithFlag]§! setelah kita menaklukkan mereka."
 AUS_tighten_control_of_subjects_tt2: "Membuka keputusan untuk §YMemasang Habsburg Monarch§! di §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! dan §Y[POL.GetNameWithFlag]§! setelah kita menaklukkan mereka."
 AUS_renew_claims_in_italy: "Perpanjang Klaim di [ITA.GetNameDef]"
 AUS_renew_claims_in_italy_desc: "Dulu ketika wilayah terpecah setelah Perang Besar, [ITA.GetAdjective] mengambil Alto Adige dan Trentino dari kami, meskipun sebenarnya mereka tidak menginginkannya. Dengan sebagian besar kekuatan kami yang kini telah dibangun kembali, kami berhak meminta mereka menyerahkan kembali wilayah kami yang sah kepada kami."
 AUS_extend_italian_claims: "Perluas Klaim [ITA.GetAdjective] Kami"
 AUS_extend_italian_claims_desc: "Kami telah menentukan arah bagaimana kami ingin menangani negara bagian yang [ITA.GetNameDef] curi dari kami pada akhir Perang Besar. Kami tidak pernah memiliki [160.GetName] dan [159.GetName] tetapi keduanya selalu merupakan negara bagian yang sangat menarik bagi kami. Setelah mengklaim apa yang kita miliki sebelumnya, mengapa tidak mengambil langkah lebih jauh dan mengambil apa yang kita inginkan, dan masih kita inginkan?"
 AUS_extend_italian_claims_tt: "Membuka keputusan untuk §YMengintegrasikan Kembali Klaim Italia§!."
 AUS_strike_deal_with_italy: "Buat Kesepakatan Dengan [ITA.GetNameDef]"
 AUS_strike_deal_with_italy_desc: "Kami memiliki keinginan untuk memiliki Trentino dan Alto Adige di Italia Utara sejak diambil dari kami pada akhir Perang Besar. [ITA.GetAdjective] saat itu menyatakan bahwa mereka tidak ingin wilayah ini dipaksakan kepada mereka, hanya untuk menjauhkan kita dari mereka. Dengan upaya diplomasi, kita seharusnya bisa mencapai kesepakatan dengan mereka mengenai wilayah-wilayah ini."
 AUS_the_danubian_federation: "Federasi Danubia"
 AUS_the_danubian_federation_desc: "Dengan penempatan kami yang unik di tengah-tengah Eropa, kami mempunyai potensi untuk menjadi sangat berpengaruh tanpa memerlukan perolehan teritorial yang jelas. Sama pentingnya dengan kekuatan tentara kita, adalah kekuatan yang terkandung dalam kata-kata dan tindakan diplomatik kita. Dengan membentuk komunitas di sekitar Sungai Danube, kita dapat memiliki jangkauan dan kekuatan diplomatik yang jauh melampaui batas negara kita."
 AUS_invite_danubian_countries: "Undang Negara-negara Donau"
 AUS_invite_danubian_countries_desc: "Dengan deklarasi niat kami yang terbuka agar semua orang dapat melihatnya, inilah saatnya untuk memperluas federasi ini menjadi yang terbaik. Langkah pertama kami tentu saja adalah mengundang negara-negara Donau lainnya yang saat ini berdiri sendiri untuk bergabung dengan kami."
 AUS_invite_danubian_countries_tt: "Membuka keputusan untuk §YMengundang Negara-negara Donau ke Federasi Donau§!"
 AUS_danubian_unity: "Persatuan Danubia"
 AUS_danubian_unity_desc: "Dengan pertumbuhan federasi kita yang stabil, kita harus memastikan bahwa kita tidak melupakan negara kita sendiri dan juga politik dalam negeri. Rakyat kita harus tahu kehebatan yang akan diberikan oleh faksi kita ini kepada mereka!"
 AUS_inviting_the_observers: "Mengundang Para Pengamat"
 AUS_inviting_the_observers_desc: "Seiring dengan berkembangnya faksi kami, semakin jelas bahwa kami dapat menjadi kekuatan yang patut diperhitungkan di Eropa. Sungai Danube mempunyai peran penting tidak hanya bagi negara-negara yang dilaluinya, namun juga bagi negara-negara yang bergantung padanya untuk pengiriman. Kita harus mempertimbangkan untuk mengundang negara-negara ini ke dalam [ROOT.GetFactionName]"
 AUS_inviting_the_observers_tt: "Membuka keputusan untuk §YMengundang lebih banyak negara ke Federasi Danubia§!"
 AUS_unexpected_alliances: "Sekutu yang Tak Terduga"
 AUS_unexpected_alliances_desc: "Kita harus tetap membuka pikiran kita terhadap semua bangsa Danubia yang mungkin ingin bergabung dengan faksi kita. Tidak peduli perbedaan masa lalu kita, kita harus menjangkau dan mengundang mereka untuk berdiri di sisi kita demi Persatuan Donau."
 AUS_diplomatic_effort: "Diplomasi Danubia"
 AUS_diplomatic_effort_desc: "Untuk tetap menjadi pemimpin kuat yang pantas untuk federasi kami, kami harus memastikan bahwa kami disukai oleh semua anggota kami. Kita harus meningkatkan upaya diplomasi untuk menghibur dan memperdalam hubungan kita di dalam federasi."
 AUS_diplomatic_effort_tt: "Setelah kami §Ymemperluas federasi kami§! kami akan melalui upaya diplomasi §Ymeningkatkan hubungan dengan anggota lainnya§!."
 AUS_danubian_leader: "Pelindung Kepentingan Danubia"
 AUS_protector_of_the_danube: "Pelindung Sungai Danube"
 AUS_protector_of_the_danube_desc: "Dengan situasi yang terus memburuk di negara-negara tetangga kita, langkah-langkah harus diambil untuk memastikan umur panjang dan keamanan semua anggota kita. Sebagai pemimpin [ROOT.GetFactionName] tanggung jawab ini harus menjadi tanggung jawab kita."
 AUS_protector_of_the_danube_tt: "Membuka keputusan untuk §YMenyarankan penyatuan menjadi negara federatif§! dan §YMembujuk anggota ke pihak kita§!\n\n§RKekuatan besar kemungkinan besar tidak akan menerima hal ini kecuali mereka melemah secara signifikan, atau [AUS.GetNameDef] adalah kekuatan yang lebih besar!§!"
 AUS_via_danube_to_europe: "Melalui Danube ke Eropa"
 AUS_via_danube_to_europe_desc: "Kami telah mengumpulkan faksi yang cukup terhormat di sekitar kami dan meskipun kami dapat berhenti di sini, kami juga dapat melihat ke luar Sungai Donau. Sebuah faksi di seluruh Eropa yang berfokus pada kolaborasi dan komunitas di Eropa dapat membuktikan upaya yang sangat bermanfaat."
 AUS_via_danube_to_europe_tt: "Mengganti keputusan §Y$AUS_the_danubian_federation_category$§! dengan keputusan §Y$BEL_closer_european_union_cat$§! yang memungkinkan untuk mengundang lebih banyak negara dan mendorong §YFederalisasi Terbatas§!\n\n§RHal ini akan mengunci fokus bersama§! ''§Y$HABSBURG_an_empire_not_just_in_name$§!'' §Ryang jika §YNon-Blok§! menerapkan §YSemangat Kebangsaan§! pada semua mata pelajaran dengan §YPohon Fokus Bersama§! menurunkan otonomi, menjadikan mata pelajaran terintegrasi penuh lebih mudah§!."
 AUS_the_right_to_rearm: "Hak untuk Mempersenjatai Kembali"
 AUS_the_right_to_rearm_desc: "Sejak Perang Besar, kami terikat oleh Perjanjian Saint-Germain-En-Laye untuk membatasi jumlah pasukan tetap kami tidak lebih dari 30.000 orang. Dengan perkembangan yang terjadi di sekitar kita, kita percaya bahwa hal ini tidak lagi berkelanjutan, dan kita harus diberi hak untuk mempersenjatai kembali."
 AUS_the_right_to_rearm_dem_tt: "Sebagai negara §YDemokrat§!, carilah kesepakatan untuk mempersenjatai kembali."
 AUS_the_right_to_rearm_dem_instead_tt: "Jika [ROOT.GetNameDef] adalah negara §YDemokrat§!, dampaknya akan membutuhkan kesepakatan untuk mempersenjatai kembali negara tersebut."
 AUS_the_right_to_rearm_fed_tt: "Sebagai negara §YNon-Blok§!, persenjatai kembali apa pun konsekuensinya."
 AUS_the_right_to_rearm_fed_instead_tt: "Jika [ROOT.GetNameDef] adalah negara §YNon-Blok§!, efeknya malah akan mempersenjatai kembali apapun konsekuensinya."
 AUS_defence_of_the_homeland: "Membela NKRI"
 AUS_defence_of_the_homeland_desc: "Sekarang kita akhirnya dapat membangun kembali pasukan kita, kita perlu mencari cara untuk mengkhususkannya. Posisi geografis kita agak rentan, sehingga menjadikan tentara kita ahli dalam pertahanan, dan mengajari mereka cara menggunakan lanskap unik kita untuk keuntungan mereka akan bermanfaat."
 AUS_the_political_front: "Menjaga Front Politik"
 AUS_the_political_front_desc: "Perang tidak hanya dimenangkan di garis depan dan medan perang, namun juga terjadi di pabrik-pabrik dan di jalanan. Dengan memperkuat sistem politik kita, kita dapat memastikan bahwa bahkan jika hal terburuk terjadi, kita akan tetap memegang kendali."
 AUS_austrian_aggression: "Agresi Austria"
 AUS_austrian_aggression_desc: "Meskipun pertahanan mungkin tampak sebagai pilihan yang jelas saat ini, itu hanya berarti menunggu serangan. Seandainya kita memperkuat kekuatan kita dan memastikan bahwa tentara kita siap menyerang kapan saja, maka kita dapat secara efisien mencegah penyerang potensial. Bagaimanapun juga, menyerang adalah pertahanan terbaik."
 AUS_at_the_ready: "Di Siap"
 AUS_at_the_ready_desc: "Tidak hanya pasukan kita yang perlu dilatih untuk mencapai keunggulan dan kesiapan yang konstan. Mereka yang mendukung tentara kita dengan peralatan harus disadarkan akan tanggung jawab mereka terhadap negara. Dengan memastikan para pekerja selalu siap mendukung angkatan bersenjata kita, kita mempersiapkan diri untuk sukses."
 AUS_form_evidenzburo: "Reformasi Biro Bukti"
 AUS_form_evidenzburo_desc: "Tidak peduli sikap kita, agresif atau defensif, mendapatkan informasi intelijen tentang musuh potensial adalah hal yang paling penting. Kita tidak boleh membiarkan diri kita lengah oleh kekuatan, kecepatan, atau koordinasi musuh kita, dan kita juga tidak boleh membiarkan mereka memperoleh informasi tentang kita. Sudah saatnya kita mereformasi Biro Bukti lama agar sesuai dengan kebutuhan kita saat ini."
 AUS_form_evidenzburo_tt: "Peningkatan yang diterapkan pada lembaga tersebut akan bergantung pada pilihan [ROOT.GetNameDef] antara §YMembela Tanah Air§! atau §YAgresi Austria§!"
 AUS_release_imprisoned_leaders: "Melegalkan Oposisi Politik"
 AUS_release_imprisoned_leaders_desc: "Ketika negara kita secara bertahap menjadi lebih otoriter, mereka yang berani menentangnya akan segera dipenjarakan. Pemenjaraan ini sepenuhnya tidak adil dan murni berdasarkan politik. Kita harus membebaskan mereka yang dipenjara dan melegalkan oposisi politik."
 AUS_hold_elections: "Adakan Pemilu"
 AUS_hold_elections_desc: "Dengan pemilu terakhir kita yang diadakan pada tanggal 9 November tahun 1930, sebelum 'Penghapusan Parlemen Sendiri' pada tahun 1934, rakyat kita sudah kehilangan kepercayaan terhadap demokrasi [ROOT.GetAdjective]. Prioritas utama kita adalah memulihkan iman dan membiarkan masyarakat menyampaikan pendapatnya!"
 AUS_rebuild_democratic_systems: "Membangun Kembali Sistem Demokrasi"
 AUS_rebuild_democratic_systems_desc: "Sistem demokrasi adalah sesuatu yang sangat rumit, mudah untuk dibongkar, namun sulit untuk dibangun atau dipulihkan. Namun demi kepentingan rakyat, hal ini harus segera dilakukan. Partai-partai yang mendukung kediktatoran harus dilarang, demi kepentingan negara."
 AUS_rebuild_democratic_systems_tt: "Partai §YFasis§! saat ini §YDNSAP§!, akan dilarang dan:"
 AUS_a_new_constitution: "Konstitusi Baru"
 AUS_a_new_constitution_desc: "Revisi konstitusi kami yang terakhir berakhir dengan bencana karena Konstitusi bulan Mei dan rezim otoriter semakin memperketat kekuasaan mereka terhadap negara tersebut. Kita harus memastikan hal serupa tidak terjadi lagi dengan menegakkan kembali konstitusi yang demokratis."
 AUS_seek_support_from_guarantors: "Mencari Dukungan dari Penjamin"
 AUS_seek_support_from_guarantors_desc: "Perjanjian Saint-Germain-En-Laye membawa banyak batasan bagi kita, namun ada hikmahnya. Karena kami dilarang memiliki tentara terhormat dalam bentuk apa pun, maka yang disebut penjamin adalah yang melindungi kami. Kita harus menghubungi mereka dan meminta dukungan ini."
 AUS_seek_support_from_guarantors_tt: "Mereka akan lebih mungkin merespons secara positif jika mereka mempunyai pendapat §GTinggi§! tentang kita."
 AUS_stabilize_the_political_climate: "Stabilkan Iklim Politik"
 AUS_stabilize_the_political_climate_desc: "Mungkin sisa-sisa partai politik yang dilarang, oposisi kita saat ini bersifat radikal dan ekstrem. Kita perlu memastikan bahwa produk-produk tersebut mematuhi undang-undang yang berlaku dan tidak ada risiko dilarang. Sikap lunak ini juga seharusnya memberi kita dukungan dari para pengikut mereka yang tidak terlalu radikal."
 AUS_outlaw_the_radicals: "Melarang Kaum Radikal"
 AUS_outlaw_the_radicals_desc: "Kita berada dalam situasi politik yang paling rumit. Sekarang bukan waktunya untuk pertikaian antar partai radikal dari berbagai spektrum politik. Sampai situasi terburuk berlalu, kita tidak bisa membiarkan mereka menyebarkan propaganda keji mereka!"
 AUS_strengthen_the_cabinet: "Penguatan Kabinet"
 AUS_strengthen_the_cabinet_desc: "Meskipun sentimen demokrasi telah menyebar cukup cepat ke seluruh [ROOT.GetNameDef] Kabinet kita masih relatif lemah. Kekuasaan tentu saja harus berada di tangan rakyat, dan hanya Parlemen dan Kabinet saja yang bisa menjalankan pemerintahan secara efektif, maka Kabinet harus diprioritaskan."
 AUS_pardon_political_exiles: "Maafkan Pengasingan Politik"
 AUS_pardon_political_exiles_desc: "Pada masa pemerintahan Austrofasisme, banyak politisi brilian meninggalkan negara kita. Kita harus memberikan tawaran kepada mereka untuk kembali, apapun sikap politik mereka."
 AUS_join_the_allies: "Bergabunglah dengan Sekutu"
 AUS_join_the_allies_desc: "Secara tradisional, kita selalu menganggap diri kita sebagai yang terkuat, namun, ketika situasi di sekitar kita terus memburuk, kita terpaksa menghadapi kenyataan, bahwa hal ini mungkin tidak benar. Sendirian tidak selalu merupakan pilihan terbaik. Kita harus berusaha untuk bergabung dengan faksi demokratis yang kuat."
 AUS_join_the_allies_tt: "Kemungkinan diterima menjadi anggota tergantung pada sikap demokratis dan pendapat Anda dengan ketua fraksi.\n\nJika kami ditolak, kami dapat membentuk faksi sendiri."
 AUS_industrial_exchange: "Pertukaran Pengetahuan"
 AUS_industrial_exchange_desc: "Kita harus banyak belajar dari sekutu baru kita, terutama dalam hal konstruksi, dan juga dalam hal strategi militer. Karena sekutu kita bersedia berbagi informasi ini dengan kita, maka kita harus memanfaatkannya sebaik mungkin."
 AUS_alpine_federation_focus: "Federasi Alpen"
 AUS_alpine_federation_focus_desc: "Kami tidak lagi merasa bahwa berdiri sendiri adalah pilihan terbaik untuk [ROOT.GetNameDef], namun tampaknya tidak ada faksi lain yang merupakan pilihan yang tepat. Ini akan menjadi peluang bagus bagi kami untuk menjangkau seluruh wilayah Alpen dengan sebuah proposal."
 AUS_alpine_federation_focus_tt: "Undang §Y[SWI.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§! dan §Y[ITA.GetNameWithFlag]§! ke faksi Anda selama mereka §YDemokrat§! atau §YNon-Blok§! dan saat ini tidak berada di faksi."
 AUS_invite_the_entente: "Mengundang Entente Kecil"
 AUS_invite_the_entente_desc: "Faksi kami akan mendapat manfaat dari lebih banyak anggota di wilayah tersebut bahkan jika itu berarti melampaui akar pegunungan kami. Entente kecil dibentuk untuk mempertahankan diri dari kembalinya Habsburg, dan karena kita sekarang berada di pihak yang sama, mengapa tidak mengundang mereka?"
 AUS_invite_the_entente_tt: "Undang §Y[YUG.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! dan §Y[CZE.GetNameWithFlag]§! ke faksi Anda selama mereka §YDemokrat§! atau §YNon-Blok§! dan saat ini tidak berada di faksi."
 AUS_offensive_on_the_fascists: "Serangan Anti-Fasis"
 AUS_offensive_on_the_fascists_desc: "Kita tidak bisa lagi mengabaikan fakta bahwa tetangga kita di wilayah selatan adalah sumber dari banyak permasalahan kita. Meskipun diplomasi selalu menjadi metode pilihan kita, terkadang diperlukan intervensi yang lebih drastis."
 AUS_lawmaking_leniency: "Kelonggaran Pembuatan Undang-undang"
 AUS_lawmaking_leniency_desc: "Sistem kita dalam mengesahkan undang-undang baru sudah kuno dan sangat membutuhkan peninjauan kembali. Di saat seperti ini, kita harus mampu mengesahkan undang-undang baru dengan cepat seiring dengan perubahan situasi dari hari ke hari. Kita harus mempertimbangkan untuk melakukan lobi demi proses pembuatan undang-undang yang lebih efisien."
 AUS_empowering_the_chancellor: "Memberdayakan Rektor"
 AUS_empowering_the_chancellor_desc: "Peran Rektor negara kita tidaklah mudah untuk diemban. [ROOT.GetNameDefCap] tidak akan seperti sekarang ini jika bukan karena [ROOT.GetLeader], dan meskipun kita tidak boleh menjadi pemuja kepribadian, kita mungkin ingin membuat apresiasi terhadap Rektor kita diketahui."
 AUS_join_the_research_program: "Program Penelitian Bersama"
 AUS_join_the_research_program_desc: "Sekarang kita berada di faksi negara-negara yang berpikiran sama, kita harus berusaha mengambil manfaat sebanyak mungkin dari hal ini. Dengan membentuk grup berbagi teknologi untuk kami dan sekutu kami, kami dapat memperkuat faksi secara keseluruhan melalui kecemerlangan teknologi."
 AUS_join_the_research_program_tt: "§Y[ROOT.GetNameDef]§!, dan setiap negara yang berada dalam faksi bersama kami, akan bergabung dengan §YGrup Berbagi Teknologi§!"
 AUS_the_right_to_self_determination: "Hak Kita untuk Menentukan Nasib Sendiri"
 AUS_the_right_to_self_determination_desc: "Sebelumnya kita mengandalkan hak untuk menentukan nasib sendiri dan perlindungannya. Kini kita berdiri di sisi lain, dan kita harus menjadi pelindung negara-negara yang kini berjuang demi kelangsungan hidup mereka dalam menghadapi penindasan yang kejam!"
 AUS_our_brothers_in_the_east: "Saudara Kita di Timur"
 AUS_our_brothers_in_the_east_desc: "Meskipun kita kini telah kembali mengukuhkan diri sebagai negara demokrasi, masih ada negara lain yang menderita di bawah bayang-bayang diktator otoriter. Meskipun kami tidak terlalu berharap untuk bertemu kembali dengan saudara-saudara kami yang [HUN.GetAdjective], kami tetap percaya bahwa mereka juga harus diizinkan untuk membuat pilihan sendiri. Demokrasi juga harus dicapai untuk mereka!"
 AUS_deal_with_the_german_threat: "Menangani Ancaman Jerman"
 AUS_deal_with_the_german_threat_desc: "[GER.GetNameDefCap] telah menjadi ancaman di perbatasan barat laut kami selama beberapa dekade. Politik mereka sangat keras dan sering kali mereka tidak menyuarakan ancaman terhadap keberadaan kita. Sudah saatnya kita mengakhiri ancaman ini untuk selamanya."
 AUS_end_european_fascism: "Berakhirnya Fasisme Eropa"
 AUS_end_european_fascism_desc: "Tidak ada seorang pun yang aman, sebelum kita semua aman. Fasisme masih menonjol di Eropa dan tidak diragukan lagi akan menimbulkan lebih banyak masalah di masa depan. Kita harus mengambil tindakan untuk mencegah penyebaran ideologi ini."
 AUS_end_european_fascism_tt: "Memperoleh §YBoneka§! Tujuan Perang di semua negara §YFasis§! di §YEropa§!"
 AUS_end_european_fascism_d_tt: "Mendapatkan §YMenggulingkan Pemerintah§! Tujuan Perang di semua negara §YFasis§! di §YEropa§!"
 AUS_austromarxism_focus: "Austromarxisme"
 AUS_austromarxism_focus_desc: "Dipelopori oleh kelompok Victor Adler, Otto Bauer, Karl Renner, Max Adler dan Rudolf Hilferding konsep Austromarxisme telah lama membimbing kita. Dipicu oleh perspektif mereka yang berbeda namun berupaya untuk memahami jalan tengah antara sosial demokrasi dan komunisme, lahirlah. Hal ini memungkinkan adanya dukungan yang jauh lebih luas dari masyarakat dibandingkan jika mereka sendiri-sendiri."
 AUS_rally_the_people: "Kumpulkan Rakyat"
 AUS_rally_the_people_desc: "Dalam sejarah kita telah terjadi banyak kudeta yang dilakukan oleh mereka yang memiliki cita-cita yang sama dengan kita. Dengan harapan kita tidak perlu lagi menggunakan cara-cara seperti itu, kita harus menggalang masyarakat untuk memihak kita dan mendesak dilakukannya reformasi."
 AUS_ban_dnsap: "Singkirkan kaum Nasionalis"
 AUS_ban_dnsap_desc: "Saat ini partai politik yang merupakan ancaman nyata bagi masyarakat ada di negara kita. Meskipun kita ingin melihat adanya oposisi politik, kita harus memastikan bahwa hal tersebut terjadi tanpa membahayakan keselamatan kita sendiri. DNSAP harus benar-benar dilarang, dan Front Vaterländische harus dilihat apa adanya!"
 AUS_renounce_the_treaties: "Penarikan Perjanjian"
 AUS_renounce_the_treaties_desc: "Meskipun pemerintah kita pada umumnya lebih menyukai wacana dan diplomasi dibandingkan konflik dan tindakan kurang ajar, dalam masalah Perjanjian Saint-Germain-En-Laye kita tidak mempunyai alasan untuk berlama-lama. Ketika negara kita sudah stabil dan kita mendapatkan kembali kendali, tidak ada alasan bagi kita untuk terikat pada aturan ketat seperti itu. Kami akan segera menghapus perjanjian ini."
 AUS_emergency_measaures: "Tindakan Darurat"
 AUS_emergency_measaures_desc: "Meskipun kita tidak pernah menjadi pendukung Revolusi, semakin jelas bahwa kita tidak dapat mengandalkan Partai Sosial Demokrat untuk melakukan perubahan yang diperlukan agar negara kita bisa kembali sejahtera. Kita harus mempersiapkan diri untuk memperjuangkan para pekerja [ROOT.GetNameDef]!"
 AUS_schutzbund_support: "Dapatkan Dukungan Schutzbund"
 AUS_schutzbund_support_desc: "Sebagian besar kelompok paramiliter [ROOT.GetAdjective] mempunyai agenda politik nasionalis, legitimis, atau bahkan fasis, dan mereka juga patut disalahkan atas sejumlah konflik bersenjata yang terjadi di negara kita. Meskipun Republikanischer Schutzbund telah menyebabkan banyak masalah, faktanya secara politik kami sangat mirip. Kita harus merekrut mereka untuk tujuan kita."
 AUS_schutzbund_support_tt: "§Y3§! Unit §YDivisi Schutzbund§! akan muncul di §Y[4.GetName]§! pada awal Perang Saudara §YKomunis§!.\n\nPihak lawan akan muncul §Y1§! bukannya §R2§! unit §YDivisi Heimwehr§! di §Y[152.GetName]§!"
 AUS_intervention_in_spain: "Intervensi di Spanyol"
 AUS_intervention_in_spain_desc: "[SPR.GetAdjective] saat ini terlibat dalam Perang Saudara yang kejam yang berkecamuk di semenanjung Iberia. Tidak peduli situasi genting yang kita hadapi, kita harus tetap berusaha membantu mereka, bagaimanapun juga, mereka sedang berjuang melawan kaum Nasionalis."
 AUS_invite_spanish_exiles: "Mengundang orang buangan dari Spanyol"
 AUS_invite_spanish_exiles_desc: "Kami mengharapkan hasil lain dalam Perang Saudara di Spanyol. Sama seperti kita menawarkan bantuan di medan perang, kita sekarang harus menawarkan bantuan di tempat lain dan menerima mereka yang melarikan diri dari pemerintahan Nasionalis."
 AUS_volunteer_effort_SPR_flag: "Mengirim Relawan ke Spanyol"
 AUS_celebrate_spanish_victory: "Merayakan Kemenangan di Spanyol"
 AUS_celebrate_spanish_victory_desc: "Ketika bentrokan sengit di semenanjung Iberia perlahan mereda, menjadi jelas bahwa Partai Republik masih memegang kendali atas negara mereka. Bantuan kami sepertinya juga berperan dalam kemenangan ini, dan sudah sepantasnya kami bertanya tentang kemungkinan kompensasi atas upaya kami."
 AUS_revolution: "Merebut kembali Wina Merah"
 AUS_revolution_desc: "Saatnya telah tiba ketika kita tidak mungkin lagi bertindak hanya sebagai oposisi terhadap partai yang berkuasa. Rakyat kita berhak mendapatkan yang lebih baik dari apa yang bisa diberikan oleh kepemimpinan kita saat ini, dan meningkatnya popularitas kita membuktikan bahwa sekarang adalah waktu yang tepat untuk melakukan aksi mogok!"
 AUS_revolution_tt: "Memiliki Semangat Nasional §YDukungan Milisi§! akan menelurkan 3 unit §YDivisi Schutzbund§! pada awal Perang Saudara."
 AUS_revolution_tt_2: "Jumlah pasukan yang diberikan kepada masing-masing pihak tergantung pada popularitas §YKomunisme§!.\n\nJika §YDukungan Komunisme§! berada di atas §Y60%§!, Perang Saudara akan dapat dihindari sepenuhnya."
 AUS_seek_soviet_support: "Carilah Dukungan Soviet"
 AUS_seek_soviet_support_desc: "Jika kita ingin bertahan melawan ancaman [GER.GetAdjective] di utara dan mengubah negara kita menjadi masyarakat komunis yang layak kita dapatkan, kita akan membutuhkan dukungan dari luar. Kami memiliki sedikit perbedaan ideologi dengan [SOV.GetNameDef] namun pada intinya, kami masih memiliki banyak kesamaan."
 AUS_seek_soviet_support_tt: "§RMengandalkan dukungan [SOV.GetAdjective] sekarang akan membuat kita tidak dapat menyerang mereka nanti!§!"
 AUS_politicized_general_staff: "Staf Umum yang Dipolitisasi"
 AUS_politicized_general_staff_desc: "Meskipun sebelumnya kita telah melihat bagaimana kelompok paramiliter dengan agenda politik dapat menjadi sebuah gangguan besar bagi kita, hal yang sama tidak berlaku bagi tentara reguler kita. Tentara yang paham politik dan memiliki visi yang sama dengan kita akan lebih bersedia dan mampu berjuang demi keselamatan kita!"
 AUS_promote_the_worthy: "Mempromosikan yang Berharga"
 AUS_promote_the_worthy_desc: "Beberapa jenderal kita menunjukkan janji dan kesetiaan yang besar terhadap perjuangan kita dan negara kita. Dengan menjadikan mereka sebagai contoh dan memberikan penghargaan berupa promosi, kami berharap dapat mendorong lebih banyak staf kami untuk berperilaku serupa!"
 AUS_align_with_ussr: "Sejajarkan dengan [SOU.GetAdjective]s"
 AUS_align_with_ussr_desc: "Menjadi semakin jelas bagi kami mengapa [SOV.GetNameDef] dijalankan sebagaimana adanya. Meskipun awalnya kami ragu dengan sistem [SOV.GetAdjective], kami menyadari bahwa ini mungkin cara terbaik untuk mengatur suatu negara. Dengan menyelaraskan diri kita dengan doktrin [SOV.GetLeader], kita akan mendapatkan negara yang lebih stabil, dan kemungkinan besar mendapat dukungan baik dari mereka."
 AUS_align_with_ussr_tt: "Pemimpin §YKPÖ§! saat ini akan memperoleh sifat yang menyelaraskan mereka dengan doktrin §Y[SOV.GetFlag][SOV.GetLeader]§! selama §Y[SOV.GetFlag][SOV.GetNameDef]§! masih §YKomunis§!"
 AUS_raid_military_storages: "Merampok Gudang Militer Lama"
 AUS_raid_military_storages_desc: "Ada banyak peralatan militer yang tersimpan di tumpukan tua di seluruh negeri. Dengan situasi yang ada saat ini, kami yakin hal ini akan lebih bermanfaat bila dilakukan di tangan masyarakat dibandingkan jika dibiarkan begitu saja. Sudah saatnya kita memanfaatkan sumber daya ini sebaik-baiknya."
 AUS_properly_trained_militias: "Milisi yang Terlatih dengan Benar"
 AUS_properly_trained_militias_desc: "Milisi kami telah menjadi bagian integral dari pertahanan negara kami, namun saat ini mereka belum memiliki pelatihan resmi. Meskipun sifat milisi sedemikian rupa sehingga kontrol penuh dan pelatihan penuh terhadap mereka tidak akan pernah mungkin dilakukan, upaya pelatihan akan bermanfaat bagi kita semua."
 AUS_the_peoples_army: "Tentara Rakyat"
 AUS_the_peoples_army_desc: "Dedikasi kami untuk memastikan masyarakat mendapatkan persenjataan yang memadai dalam situasi ini telah memberikan efek samping yang tidak terduga namun sangat diharapkan. Kini semakin banyak orang yang ingin bergabung dengan tentara"
 AUS_a_safe_harbor_for_dissidents: "Tempat yang Aman Bagi Para Pembangkang"
 AUS_a_safe_harbor_for_dissidents_desc: "Pengasingan politik telah menjadi pemandangan umum di dunia akhir-akhir ini, beberapa di antaranya memiliki sentimen politik yang sama dengan kita. Dengan merekrut orang-orang buangan ini ke pihak kita, kita dapat memperoleh manfaat besar dari keterampilan mereka."
 AUS_a_safe_harbor_for_dissidents_tt: "§YOlga Taratuta§!, yang memberikan (§G+5%§! Dukungan Perang, §R-10%§! Stabilitas, §G+10%§! Faktor Populasi yang Dapat Direkrut, §G+0,03§! Harian Dukungan Komunisme)"
 AUS_establish_rote_hilfe: "Mendirikan Kembali Rote Hilfe"
 AUS_establish_rote_hilfe_desc: "Österreichische Rote Hilfe didirikan dan dipimpin oleh Malke Schorr pada tahun 1925. Sejak itu dan hingga dilarang oleh negara Austrofasis yang korup, organisasi ini membantu banyak pengungsi politik dan pencari suaka di [ROOT.GetNameDef]. Sekarang rezim lama kita sudah tidak ada lagi, sudah saatnya kita membiarkan mereka beroperasi dengan bebas sekali lagi."
 AUS_a_new_beginning: "Awal yang Baru"
 AUS_a_new_beginning_desc: "\"Saat abu dan debu mereda, dan pemerintahan baru kita mengambil alih posisi yang semestinya, kita harus memikirkan masa depan. Ini hanyalah awal dari [ROOT.GetNameDef], dan bersama-sama kita akan tumbuh!\""
 AUS_join_comintern: "Bergabunglah dengan Komintern"
 AUS_join_comintern_desc: "Setelah bersekutu dengan Uni Soviet, kini ada jalan yang sangat jelas bagi kita. Kita harus bergabung dengan kawan-kawan kita di Komintern, itulah yang diinginkan dan pantas diterima oleh rakyat kita!"
 AUS_danubian_socialist_communes: "Bentuk Blok Donau"
 AUS_danubian_socialist_communes_desc: "Sejauh ini [ROOT.GetNameDef] telah berdiri sendiri melawan musuh-musuh kita. Kami tidak ingin hal ini terjadi di masa depan, namun saat ini belum ada aliansi yang sejalan dengan cita-cita negara kami. Membuat faksi kita sendiri jelas merupakan pilihan terbaik!"
 AUS_womens_education_initiative: "Inisiatif Pendidikan Perempuan"
 AUS_womens_education_initiative_desc: "Sejak awal tahun 1900-an perempuan diperbolehkan melanjutkan pendidikan di universitas tetapi hanya di fakultas tertentu. Dorongan agar universitas terbuka bagi semua orang kemungkinan besar akan membawa manfaat bagi bangsa kita."
 AUS_universitat_wien: "Universitas Wien"
 AUS_universitat_wien_desc: "Sama seperti kebanyakan universitas kita, universitas di Wien menderita di bawah kekuasaan fasis. Sentimen fasis disebarkan secara bebas, meski sebagian besar dilakukan oleh pelajar. Dengan memperketat peraturan dan memastikan hal ini tidak berlanjut, kita dapat menjamin kualitas pendidikan yang lebih baik."
 AUS_scientific_grants: "Hibah Ilmiah"
 AUS_scientific_grants_desc: "Ketika kita meningkatkan anggaran untuk ilmu pengetahuan dan penelitian, potensi penerapan pengetahuan baru ini menjadi jelas. Dengan memberikan sejumlah hibah, kita seharusnya dapat meningkatkan dampak positifnya lebih jauh lagi."
 available_scientist_tt: "§GTersedia§! sebagai §YIlmuwan§!:"
 AUS_centralize_the_industrial_sector: "Sentralisasi Sektor Industri"
 AUS_centralize_the_industrial_sector_desc: "Seiring berjalannya waktu dan sentimen komunis mengakar di dalam negeri, kita kini mampu mengambil tindakan yang lebih drastis. Beberapa tahun yang lalu, gagasan sentralisasi industri tidak disukai oleh masyarakat kita, namun sekarang hal ini tampaknya merupakan langkah logis berikutnya."
 AUS_cut_ties_with_the_church: "Putuskan Hubungan dengan Gereja"
 AUS_cut_ties_with_the_church_desc: "Hubungan pemerintah kita dengan gereja hanyalah sisa dari apa yang disebut fasisme klerikal. Fasisme sudah disingkirkan, sekarang saatnya kita juga menyingkirkan ulama dari Kekuasaan Politik."
 generic_remove_as_political_advisor_tt: "§RMenghapus§! sebagai §YPenasihat Politik§!:"
 AUS_spur_the_communist_resistance: "Mendorong Sentimen Komunis"
 AUS_spur_the_communist_resistance_desc: "Dunia di sekitar kita menjadi jauh lebih bermusuhan terhadap masyarakat umum dan pekerja. Meskipun kita sendiri bersyukur terhindar dari hal terburuk, kita tidak bisa mengabaikan penderitaan saudara-saudari di sekitar kita."
 AUS_danubian_communism_bypass_tt: "Semua negara §YDanubian§! dan negara-negara dengan §YKepentingan Sejarah§! di §YWilayah Donau§!:\nPartai yang berkuasa saat ini adalah §YKomunis§!."
 AUS_danubian_communism_bypass_has_rejected_tt: "Telah menolak upaya [ROOT.GetAdjective] untuk meningkatkan §YKomunisme§!."
 AUS_spur_the_communist_resistance_tt: "Membuka keputusan untuk §YMendorong Sentimen Komunis§! di:"
 AUS_rapid_revolutions: "Revolusi Cepat"
 AUS_rapid_revolutions_desc: "Meskipun situasi kita telah memburuk karena tindakan kita untuk membebaskan pekerja asing dan mengamankan alat-alat produksi bagi mereka, tidak ada waktu untuk beristirahat. Kita harus membebaskan kawan-kawan kita dari belenggu kapitalisme sesegera mungkin, meskipun hal ini hanya akan membuat rakyat kita terkena dampak yang paling kecil dan sementara terhadap kesejahteraan mereka."
 AUS_meticulous_preparations: "Persiapan yang Teliti"
 AUS_meticulous_preparations_desc: "Memang ada godaan untuk terburu-buru membebaskan para pekerja di sekitar kita, namun hal ini berisiko membiarkan pihak dalam negeri tetap terbuka. Upaya kita di luar negeri telah menimbulkan keributan di [ROOT.GetNameDef], kita harus memastikannya sebelum berkomitmen membantu orang lain."
 AUS_demand_liberation_of_workers: "Menuntut Pembebasan Buruh"
 AUS_demand_liberation_of_workers_desc: "Waktu bagi kita untuk bertindak telah tiba. Dengan memperkuat semangat komunisme di sepanjang sungai Donau, kita sekarang harus membebaskan mereka yang setuju dengan kita!"
 AUS_demand_liberation_of_workers_tt: "Membuka keputusan untuk §YMenuntut Pembebasan Pekerja§! di negara-negara dimana kita sebelumnya berhasil memperkuat sentimen komunis."
 AUS_union_of_danubian_socialist_republics: "Persatuan Sosialis Donau"
 AUS_union_of_danubian_socialist_republics_desc: "Pengaruh kami kini menyebar ke seluruh Eropa seiring dengan pembebasan para pekerja di sekitar kami. Nama lama kita tidak lagi menggambarkan siapa kita sebenarnya, kita harus mempertimbangkan bagaimana kita ingin dikenal."
 AUS_the_correct_communism: "Bentuk Komunisme yang Benar"
 AUS_the_correct_communism_desc: "Ada banyak cara untuk mempraktikkan komunisme, dan kebanyakan di antaranya tidak sesuai dengan keinginan kita. [SOV.GetNameDefCap] mencoreng nama ideologi kita dalam cara mereka memerintah. Mereka tidak bisa dibiarkan terus berlanjut."
 AUS_seize_galicia: "Rebut Tanah Galicia"
 AUS_seize_galicia_desc: "Seiring berlalunya waktu, kami menyadari bahwa kami sangat merindukan salah satu bagian dari kerajaan lama kami. Melihat Galicia dipecah belah dan dilempar ke berbagai negara dalam beberapa tahun terakhir telah membuat kami semakin bertekad untuk merebutnya sekali lagi."
 AUS_seize_galicia_tt: "Mendapatkan inti pada §Y[88.GetName]§!,§Y[89.GetName]§! dan §Y[91.GetName]§!.\n\nKeuntungan §YWargoals§! untuk merebut kembali inti di §YGalicia§!."
 AUS_regulate_austrian_finance_sector: "Mengatur Sektor Keuangan"
 AUS_regulate_austrian_finance_sector_desc: "Perekonomian [AUS.GetAdjective] masih mengalami kesulitan meskipun kami telah melakukan upaya terbaik untuk menyeimbangkannya kembali. Jika kita tidak mengambil tindakan apa pun, kita khawatir akan terjadi kehancuran ekonomi besar-besaran yang disertai dengan hiperinflasi. Sudah saatnya kita mengambil kembali kendali atas sektor keuangan kita."
 AUS_regulate_austrian_finance_sector_tt: "Membuka dan mengkhususkan bank §YKepedulian Industri§! untuk meningkatkan §YMemulai Efisiensi Produksi§! atau mengurangi kebutuhan §YBarang Konsumsi§!. Alternatifnya, bank dapat mempengaruhi §YKeduanya§! pada tingkat yang lebih rendah."
 AUS_seek_papal_support: "Carilah Dukungan Kepausan"
 AUS_seek_papal_support_desc: "Sebagai negara Katolik, kami selalu menjunjung tinggi perkataan para pendeta. Dengan mendapatkan dukungan dari Yang Mulia, kami mungkin dapat meningkatkan kepercayaan orang-orang terhadap kami."
 AUS_seek_papal_support_tt: "Perubahan popularitas partai yang berkuasa saat ini: §G5%§!"
 AUS_saved_creditanstalt_flag: "Memprioritaskan kembali pendanaan untuk Österreichische Creditanstalt"
 AUS_saved_bankverein_flag: "Memprioritaskan kembali pendanaan ke Wiener Bankverein"
 AUS_kept_creditanstalt_bankverein_flag: "Tetap menggabungkan Creditanstalt-Bankverein"
 AUS_invest_in_erzberg_steel_mines: "Berinvestasi di Tambang Baja Erzberg"
 AUS_invest_in_erzberg_steel_mines_desc: "[AUS.GetNameDefCap] selalu memiliki tambang baja yang cukup banyak. Upaya yang dilakukan di Erzberg nampaknya merupakan upaya yang sangat bermanfaat. Kita harus mempertimbangkan investasi lebih lanjut untuk mendapatkan hasil maksimal."
 AUS_courting_the_princess_of_industry: "Merayu Putri Industri"
 AUS_courting_the_princess_of_industry_desc: "Ada banyak tokoh industri di negara kita yang kemungkinan besar akan membantu kita. Elisabeth von Gutmann, putri pendiri Gebrüder Gutmann yang dulu mendominasi perdagangan di Austria, tampaknya yang paling menjanjikan. Kita harus menghubunginya dan meminta bantuannya."
 AUS_expand_stpoltner_steelworks: "Perluas Pabrik Baja St. Pöltner"
 AUS_expand_stpoltner_steelworks_desc: "Pabrik Baja di St. Pöltner menunjukkan hasil yang sangat menjanjikan. Jika kita bertindak cepat, kita harus bisa membentuknya sesuai keinginan kita untuk memaksimalkan keuntungan dari pabrik."
 AUS_invest_in_semperit_synthetics: "Berinvestasi dalam Sintetis Semperit"
 AUS_invest_in_semperit_synthetics_desc: "Setelah pasokan baja kita tersortir, kita perlu mempertimbangkan sumber daya lain yang mungkin kita perlukan untuk pengembangan masa depan. Karena kurangnya sumber karet dan minyak yang baik dan cukup besar, kita perlu mencari cara lain untuk memperoleh sumber daya tersebut secara lokal."
 AUS_invest_in_semperit_synthetics_bonus: "Investasi Semperit"
 AUS_pulverfabrik_skodawerke: "Berinvestasilah di Pulverfabrik Skodawerke"
 AUS_pulverfabrik_skodawerke_desc: "Pabrik kimia Pulverfabrik Skodawerke di Niederösterreich di masa lalu memiliki banyak kegunaan, bubuk mesiu, dinamit, dan bahan kimia untuk pabrik baja. Saat ini, penggunaan terbaik dari keahlian mereka adalah dengan membimbing mereka menuju sumber daya sintetis."
 AUS_pulverfabrik_skodawerke_tt: "§Y3x§! §G25%§! Bonus penelitian untuk: §YPenyimpanan Bahan Bakar§! dan teknologi §YPemurnian Bahan Bakar§!."
 AUS_pulverfabrik_skodawerke_bonus: "Investasi Skodawerke"
 AUS_the_matzen_oil_fields: "Eksploitasi Ladang Minyak Matzen"
 AUS_the_matzen_oil_fields_desc: "Kami baru-baru ini mendapat keberuntungan. Minyak telah ditemukan di daerah sekitar Matzen di timur [AUS.GetNameDef]. Ini adalah kesempatan bagi kita untuk mengekstraksi sumber daya ini dan memberikan keunggulan industri!"
 AUS_autobahn_west: "Perluas Autobahn Barat"
 AUS_autobahn_west_desc: "Infrastruktur kita memerlukan pembaruan, meskipun kita ingin memperkuat infrastruktur di seluruh negeri, namun kenyataan perekonomian dan situasi industri kita tidak memungkinkan hal tersebut. Membangun ke arah barat dan menghubungkan Autobahn kami ke [GER.GetNameDef] adalah pilihan terbaik dalam situasi kami saat ini."
 AUS_autobahn_south: "Perluas Autobahn Selatan"
 AUS_autobahn_south_desc: "Infrastruktur kita memerlukan pembaruan, meskipun kita ingin memperkuat infrastruktur di seluruh negeri, namun kenyataan perekonomian dan situasi industri kita tidak memungkinkan hal tersebut. Membangun ke arah selatan dan menghubungkan Autobahn kami ke [ITA.GetNameDef] adalah pilihan terbaik dalam situasi kami saat ini."
 AUS_autobahn_east: "Perluas Autobahn Timur"
 AUS_autobahn_east_desc: "Kami telah menghubungkan autobahn kami dengan mitra kami. Hal ini terbukti paling menguntungkan kedua belah pihak. Melihat ke arah timur, kita akan menemukan sekutu lama kita dalam sistem Monarki Ganda, [HUN.GetNameDef], jika kita menghubungkan infrastruktur kita, kita mungkin juga dapat membina hubungan yang lebih baik dengan mereka."
 AUS_bbo_focus: "Berinvestasilah di Bundesbahnen Österreich"
 AUS_bbo_focus_desc: "Sampai saat ini, perkeretaapian kami telah terbengkalai, dan BBÖ, perusahaan kereta api kami, kehilangan dana. Namun, untuk menjalankan negara yang sukses, tidak peduli seberapa besar atau kecilnya, kita perlu memastikan cakupan jalur kereta api yang baik di seluruh negeri. Kita harus mulai berinvestasi di BBÖ dan perkeretaapian kita."
 AUS_bbo_focus_tt: "§GMeningkatkan§! efektivitas §YKepedulian Industri§! yang tersedia:"
 AUS_architechtual_advancements: "Kemajuan Arsitektur"
 AUS_architechtual_advancements_desc: "Baru-baru ini kami diberitahu tentang kehadiran seorang arsitek yang sangat terampil di salah satu Universitas kami. Bangunan-bangunannya memiliki integritas struktural dan keanggunan yang pantas didapatkan oleh negara seperti kita. Kita harus mempertimbangkan untuk merekrut individu ini."
 AUS_economic_resuscitation: "Resusitasi Ekonomi"
 AUS_economic_resuscitation_desc: "Perekonomian kita telah stabil dan tumbuh stagnan pada tingkat yang sangat rendah. Meskipun ada yang berpendapat bahwa ini bagus, kami tidak terjatuh lagi, kami tahu bahwa kami bisa melakukan yang lebih baik. Masih ada upaya yang harus dilakukan, dan kali ini kami akan memastikan bahwa upaya tersebut tidak hanya berhasil dalam jangka pendek."
 AUS_economic_resuscitation_tt: "Memberi Austria Semangat Nasional §YMemulihkan Dari Depresi Ekonomi§! lagi jika perekonomian negara tersebut semakin terpuruk."
 AUS_devalue_the_schilling: "Devaluasi Schilling"
 AUS_devalue_the_schilling_desc: "Salah satu alasan mengapa perekonomian kita mengalami kesulitan dan stagnasi adalah lemahnya mata uang kita. Meskipun tingkat inflasi kita tidak mencapai 2.877% seperti pada tahun 1929, inflasi kita masih terlalu tinggi. Ini mungkin bukan keputusan yang paling populer di kalangan masyarakat, namun kita harus mempertimbangkan untuk mendevaluasi mata uang kita."
 AUS_devaluing_the_schilling_tt: "Ketika semangat kebangsaan §Y$AUS_devalued_the_schilling$§! dihilangkan, fokus §Y$AUS_bring_phonix_insurance_from_the_ashes$§! dan §Y$AUS_great_austrian_economic_push$§! akan tersedia."
 AUS_bring_phonix_insurance_from_the_ashes: "Bawalah Asuransi Phönix Dari Abu"
 AUS_bring_phonix_insurance_from_the_ashes_desc: "Perekonomian kami membaik hingga skandal Phönix melanda kami pada awal tahun 1936. Asuransi peserta perang mereka memastikan bahwa kami memiliki orang-orang yang dapat direkrut menjadi tentara, dan menjaga bangsa tetap tenang, bahkan ketika menghadapi perang. Mungkin bijaksana untuk menghidupkan kembali Phönix dari abu."
 AUS_bring_phonix_insurance_from_the_ashes_tt1: "Menggantikan §YPertanggungan untuk Asuransi Phönix§! dengan §YAsuransi Phönix§!"
 AUS_great_austrian_economic_push: "Dorongan Ekonomi Austria yang Besar"
 AUS_great_austrian_economic_push_desc: "Upaya kami yang tak kenal lelah perlahan membuahkan hasil, dan perekonomian kami kembali bertumbuh. Kita bisa saja menerima hal ini, namun selama proses revitalisasi perekonomian kita, kita melihat potensi yang belum dimanfaatkan. Mengapa kita harus menerima lebih sedikit jika kita masih bisa mengembangkan sektor keuangan kita menjadi lebih besar?"
 AUS_great_austrian_economic_push_tt: "Lebih lanjut meningkatkan perekonomian dan output pabrik [ROOT.GetNameDef], menggantikan §YPemulihan dari Depresi Ekonomi§! dengan §YEconomic Boom§!"
 AUS_volkschule: "Volksschule"
 AUS_volkschule_desc: "Pada saat krisis ekonomi, merupakan hal yang lumrah bagi anak-anak untuk tidak bersekolah, melainkan harus bekerja atau membantu pekerjaan rumah. Karena krisis terburuk telah berlalu, kita harus mengatasi hutang pengetahuan ini, agar kita tidak tertinggal dalam hal teknologi dan ilmu pengetahuan."
 AUS_industrialization_effort: "Upaya Industrialisasi"
 AUS_industrialization_effort_desc: "Sektor industri [AUS.GetAdjective] secara mengejutkan telah berhasil melewati situasi sulit ini dengan baik. Dengan tingkat pengangguran yang tinggi, hal ini juga bisa menjadi sebuah peluang. Dengan memperluas industri, kita dapat mengatasi dua permasalahan sekaligus, yaitu meningkatkan kapasitas industri dan mengurangi pengangguran."
 AUS_invest_in_alpen_elektrowerke: "Alpen-Elektrowerke"
 AUS_invest_in_alpen_elektrowerke_desc: "Agar tetap kompetitif di pasar internasional, kami perlu terus berinovasi dan menghasilkan solusi baru. Berinvestasi di perusahaan seperti Alpen-Elektrowerke yang sangat mengkhususkan diri dalam pengembangan elektronik dapat memberi kita keunggulan yang kita butuhkan."
 AUS_invest_in_kapsch: "Telefon- dan Telegrafen-Fabrik"
 AUS_invest_in_kapsch_desc: "Agar tetap kompetitif di pasar internasional, kami perlu terus berinovasi dan menghasilkan solusi baru. Berinvestasi di perusahaan seperti Telefon- und Telegrafen-Fabriks-Aktiengesellschaft yang menangani bidang elektronik dan radar dapat memberikan kita pengetahuan yang luas yang hanya dapat ditandingi oleh beberapa pesaing."
 AUS_construction_guilds: "Bentuk Serikat Konstruksi"
 AUS_construction_guilds_desc: "Ketika [AUS.GetNameDef] tumbuh semakin menarik bagi industri, kami menyadari bahwa kami tidak lagi dapat membangun pabrik baru dengan cukup cepat. Pembentukan serikat konstruksi akan membantu mempercepat pembangunan di dalam negeri."
 AUS_apprentice_programmes: "Mulai Program Magang"
 AUS_apprentice_programmes_desc: "Setelah resesi ekonomi dan pengangguran yang berkepanjangan, banyak orang tidak memiliki keterampilan dan pengalaman yang dibutuhkan oleh pekerjaan di pabrik yang kini tersedia. Dengan mengadakan program magang, kami akan memberikan kesepakatan yang bermanfaat bagi pabrik dan pekerja."
 AUS_osterreichische_luftstreitkrafte: "Österreichische Luftstreitkräfte"
 AUS_osterreichische_luftstreitkrafte_desc: "Angkatan udara kita telah terkena dampak yang parah dan negatif dari perjanjian-perjanjian yang diberlakukan atas tindakan nenek moyang kita. Untuk mendapatkan peluang di dunia yang baru dan jauh lebih keras ini, kita harus mempertimbangkan untuk membangun kembali angkatan udara kita sesuai standar zaman sekarang."
 AUS_preparing_the_industry: "Produksi Pesawat di Lohner-Werke"
 AUS_preparing_the_industry_desc: "Salah satu produsen pesawat terbang kami yang paling penting dan berharga sejak Perjanjian Saint-Germain-En-Laye berlaku sepenuhnya menghentikan produksi pesawat baru mereka. Sekarang kita sedang membangun kembali angkatan udara kita, kita juga harus memastikan untuk membangun kembali pemasok kita."
 AUS_purchase_foreign_designs: "Pembelian Pesawat Asing"
 AUS_purchase_foreign_designs_desc: "Untuk benar-benar bisa bersaing di udara, kita harus mempelajari bagaimana negara lain merancang pesawat mereka. Meskipun produksi dalam negeri mungkin memiliki kelebihan, dengan mengambil sampel dan membeli dari berbagai negara, kita bisa mendapatkan pesawat terbaik untuk kebutuhan kita, tanpa biaya awal yang besar."
 AUS_seek_international_partners: "Carilah Mitra Internasional"
 AUS_seek_international_partners_desc: "Jika kita ingin kompetitif di udara, kita perlu belajar dari orang-orang di sekitar kita tentang cara terbaik menjalankan angkatan udara. Dengan belajar dari negara-negara besar, dan negara-negara yang mengalami kesulitan serupa, kita bisa mencapai tingkat yang lebih tinggi dari sebelumnya."
 AUS_seek_international_partners_tt: "§YEfek untuk negara mana pun yang menerima!§!:"
 AUS_seek_international_partners_tt2: "§Y[ROOT.GetNameWithFlag]§! akan mendapatkan 50 §YPengalaman Udara§! untuk setiap negara yang menerima!"
 AUS_seek_international_partners_tt3: "§Y[ROOT.GetNameWithFlag]§! akan mendapatkan §YAkses Pasar§! ke negara mana pun yang menerimanya!"
 AUS_air_research_boost: "Angkatan Udara yang Inovatif"
 AUS_air_research_boost_desc: "[GetAirPartners]"
 AUS_has_no_air_partners: "Meskipun kami telah melakukan upaya terbaik, kami gagal mendapatkan mitra dalam upaya udara kami. Kita tidak punya pilihan selain berinvestasi pada penelitian kita sendiri."
 AUS_has_air_partners: "Setelah menguji dan menerbangkan berbagai macam pesawat, kami berada dalam posisi unik untuk dapat memilih properti apa yang kami suka dan tidak suka untuk pesawat kami. Kami mungkin ingin mempertimbangkan untuk memanfaatkan pengetahuan baru ini dan merekayasa balik beberapa sifat yang paling diinginkan dari pesawat yang telah kami sampel."
 AUS_innovative_airforce_bonus: "Angkatan Udara yang Inovatif"
 AUS_focus_on_domestic_production: "Produksi Pesawat Dalam Negeri"
 AUS_focus_on_domestic_production_desc: "Membangun dan mempertahankan angkatan udara sepenuhnya sendiri adalah tugas yang sangat besar. Namun dalam situasi sulit seperti ini kita tidak bisa membiarkan diri kita bergantung pada pihak lain sebagai bagian integral dari angkatan bersenjata kita. Tidak peduli tingginya biaya dimuka, kita harus mandiri dalam hal angkatan udara kita."
 AUS_revitalize_austrian_air_industry: "Merevitalisasi Industri Udara"
 AUS_revitalize_austrian_air_industry_desc: "Kami dulu memiliki beberapa produsen pesawat terbang di [AUS.GetNameDef] sebelum, dan selama, Perang Besar. Namun sejak Perjanjian Saint-Germain-En-Laye diberlakukan kepada kami, hal itu menjadi mustahil. Kini setelah perjanjian tersebut dibatalkan, kita harus bergerak cepat untuk membangun kembali industri kita dan merevitalisasinya jika kita membutuhkannya."
 AUS_light_specialization: "Inisiatif Jagdfliegerkompanie"
 AUS_light_specialization_desc: "Kita tidak bisa benar-benar bersaing dengan negara-negara besar dalam hal badan pesawat yang lebih besar, namun, dengan pesawat tempur dan CAS yang lebih unggul kita dapat memastikan bahwa musuh kita bahkan tidak mencapai wilayah kita. Bagaimanapun juga, pertempuran udara ada yang dimenangkan dan dikalahkan dalam pertempuran udara."
 AUS_light_specialization_bonus: "Inisiatif Jagdfliegerkompanie"
 AUS_medium_specialization: "Inisiatif Schlachtfliegerkompanie"
 AUS_medium_specialization_desc: "Angkatan udara kita harus mampu mengisi banyak peran. Kita tidak mempunyai sumber daya untuk membangun semua aspek angkatan udara kita dan oleh karena itu menemukan kompromi yang baik adalah hal yang terpenting. Pesawat bermesin ganda dapat digunakan baik untuk pembom maupun pesawat tempur, dan bagi kami ini merupakan kompromi yang sempurna."
 AUS_medium_specialization_bonus: "Inisiatif Schlachtfliegerkompanie"
 AUS_heavy_specialization: "Inisiatif Grossflugzeugkompanie"
 AUS_heavy_specialization_desc: "Dapat diasumsikan bahwa pihak lain mengharapkan kita memiliki angkatan udara yang sebagian besar terdiri dari pesawat yang lebih kecil. Kekuatan udara yang besar mungkin tampak mustahil atau tidak nyaman, namun dengan investasi yang tepat, kita dapat mengalahkan sebagian besar musuh hanya dengan kekuatan."
 AUS_heavy_specialization_bonus: "Inisiatif Grossflugzeugkompanie"
 AUS_air_base_intiative: "Upaya Pembangunan Pangkalan Udara"
 AUS_air_base_intiative_desc: "Meskipun terdapat Pangkalan Udara di [AUS.GetNameDef], pangkalan tersebut tidak lagi cukup untuk menampung angkatan udara kita, yang saat ini jauh lebih besar. Untuk mengoptimalkan cara kita menggunakan angkatan udara, kita harus mempertimbangkan untuk membangun infrastruktur yang diperlukan agar pesawat kita tetap mengudara."
 AUS_wien_anti_air_effort: "Wiener Flakturme"
 AUS_wien_anti_air_effort_desc: "Meskipun kami memiliki keyakinan penuh bahwa angkatan udara kami akan menjaga negara ini aman dari serangan udara, bangunan anti udara dapat memberikan lapisan perlindungan ekstra di daerah padat penduduk. Kita harus mempertimbangkan untuk mendirikan bangunan anti udara di wilayah Wien."
 AUS_radar_effort: "Upaya Sistem Goldhaube"
 AUS_radar_effort_desc: "Angkatan udara modern tidak hanya bergantung pada pesawatnya, namun juga pada teknologi yang baik untuk memandu mereka. Dengan ditemukannya radar kita tidak bisa membiarkan diri kita tertinggal secara teknologi!"
 AUS_flight_schools: "Österreichischen Fliegerschule"
 AUS_flight_schools_desc: "Agar kita sukses di udara, bukan hanya pesawat kita saja yang perlu lebih unggul. Untuk memastikan dominasi kami di udara, kami juga harus memberikan pelatihan terbaik bagi pilot kami untuk mempersiapkan mereka menghadapi setiap situasi yang mungkin mereka hadapi. Sama seperti kita melatih divisi darat, kita harus menyiapkan program pelatihan untuk pilot kita."
 AUS_neustadter_flugzeugwerke: "Neustädter Flugzeugwerke"
 AUS_neustadter_flugzeugwerke_desc: "Baru-baru ini sebuah pabrikan pesawat baru mengakuisisi pabrik Oesterreichische Flugzeugfabrik yang telah dinonaktifkan. Tujuan dari perusahaan baru, Neustädter Flugzeugwerke, adalah untuk membuat pesawat olahraga ringan, namun karena perusahaan ini didirikan oleh dua mantan pilot pesawat tempur, kami mungkin dapat meyakinkan mereka untuk memproduksinya untuk kami."
 AUS_aerial_strategies: "Strategi Udara"
 AUS_aerial_strategies_desc: "Belajar dari pengalaman adalah suatu kebajikan dalam segala jenis pertempuran. Dengan terus mengembangkan dan meningkatkan strategi udara kita, kita dapat memastikan bahwa kita selalu selangkah lebih maju dari musuh."
 AUS_secret_rearmament: "Persenjataan Kembali Rahasia"
 AUS_secret_rearmament_desc: "Untuk jangka waktu yang sangat lama, pembatasan persenjataan telah membuat mustahil untuk membangun kehadiran tentara dalam bentuk apa pun. Meskipun Perjanjian Saint-Germain-En-Laye masih berlaku, kami telah menemukan beberapa celah yang dapat kami manfaatkan untuk membenarkan persenjataan kembali secara diam-diam."
 AUS_militarization_effort: "Penggembala Maschinen-und Waggonbau"
 AUS_militarization_effort_desc: "Salah satu kompi yang pernah diandalkan oleh tentara kita yang perkasa adalah Grazer Maschinen- und Waggonbau-Aktiengesellschaft. Membangun tidak hanya kendaraan tetapi juga as roda untuk howitzer dan senapan, hal-hal tersebut pernah menjadi landasan dalam kapasitas militer kita. Kita harus membuatnya sekali lagi."
 AUS_osterreichische_bundesheer: "Österreichische[GetArmyName]"
 AUS_army_is_bundesheer: "s Bundesheer"
 AUS_army_is_landwehr: "Landwehr"
 AUS_osterreichische_bundesheer_desc: "Dengan tidak adanya lagi hambatan dalam Perjanjian Saint-Germain-En-Laye, inilah saatnya kita mulai membangun kembali dengan baik. [ROOT.GetNameDefCap] tidak boleh lengah, dan kita juga tidak bisa hanya menunggu saja menghadapi dunia yang semakin mengancam."
 AUS_standardized_army_training: "Pelatihan Angkatan Darat Standar"
 AUS_standardized_army_training_desc: "Bertahun-tahun tidak bisa melatih pasukan baru telah meninggalkan jejaknya pada resimen pelatihan divisi kami. Jika kita ingin memberikan pelatihan terbaik bagi tentara kita, kita harus mempertimbangkan untuk memperbarui prosedur pelatihan bagi pasukan baru."
 AUS_osterreichische_fallschirmsjager: "Österreichische Fallschirmjäger"
 AUS_osterreichische_fallschirmsjager_desc: "Setelah membangun kembali angkatan bersenjata dan angkatan udara kita, inilah saat yang tepat bagi kita untuk melihat bagaimana kita dapat menggabungkan kedua usaha ini demi kebaikan yang lebih besar."
 AUS_osterreichische_gebirgsjager: "Österreichische Gebirgsjäger"
 AUS_osterreichische_gebirgsjager_desc: "Sebagai negara yang sangat bergunung-gunung, kepentingan terbaik kita adalah memastikan pasukan kita cukup terlatih untuk berperang dalam kondisi dan lingkungan seperti ini."
 AUS_osterreichische_gebirgsjager_tt: "Mengaktifkan §HPelatihan Pertahanan Gunung§!\n§HInfantri\nPegunungan§! Pertahanan: §G+5%§! Gerakan: §G+5%§!\n§HPendaki Gunung\nPegunungan§! Pertahanan: §G+5%§! Pergerakan: §G+10%§!\n"
 AUS_osterreichische_seebataillon: "Österreichisches Seebataillon"
 AUS_osterreichische_seebataillon_desc: "Kami telah melalui banyak hal untuk mengamankan pijakan kami di garis pantai, hanya untuk mengetahui bahwa tentara kami sangat tidak siap untuk tugas berperang dalam kondisi seperti ini. Kita harus mencari tahu apa yang bisa membantu orang-orang ini bertarung dengan lebih efisien."
 AUS_steyr_arms_investment: "Berinvestasi di Steyr Arms"
 AUS_steyr_arms_investment_desc: "Mantan produsen senjata andalan kami sangat menderita karena terikat oleh Perjanjian Saint-Germain-En-Laye. Untuk memulai kemampuan mereka dalam memproduksi jumlah yang kita butuhkan, kita harus mempertimbangkan untuk melakukan investasi."
 AUS_steyr_arms_investment_tt: "Membuka §YSteyr Arms§! sebagai Desainer"
 AUS_improve_army_logistics: "Peningkatan Logistik Angkatan Darat"
 AUS_improve_army_logistics_desc: "Negara kita kaya dengan pemandangan yang indah, namun sayangnya hal ini juga berarti kaya akan tantangan medan dan logistik yang sulit dilalui. Jika kita tidak memenuhi hal ini, kita bisa mengambil risiko bahwa upaya kita di masa perang akan berakhir lebih buruk dari yang seharusnya."
 AUS_reinforcing_the_supply_network: "Memperkuat Jaringan Pasokan"
 AUS_reinforcing_the_supply_network_desc: "Kami menyadari bahwa upaya yang kami lakukan untuk memperbaiki situasi pasokan dengan meningkatkan ketahanan tentara kami terhadap kekurangan pasokan tidaklah cukup. Untuk mengatasi situasi ini selamanya, kita perlu benar-benar memperbaiki jaringan pasokan itu sendiri."
 AUS_supporting_the_troops: "Mendukung Pasukan"
 AUS_supporting_the_troops_desc: "Untuk lebih meningkatkan kinerja pasukan kita di medan perang, kita harus memberi mereka dukungan sebanyak mungkin. Perusahaan pendukung yang memiliki rumah sakit lapangan, pengintaian, dan dukungan senjata artileri akan sangat menguntungkan kami."
 AUS_bring_generals_out_of_retirement: "Ingatkan Pensiunan Jenderal untuk Berdinas"
 AUS_bring_generals_out_of_retirement_desc: "Negara kita mempunyai sejarah berperang, dan walaupun ada sisi negatifnya, hal ini juga berarti kita mempunyai banyak komandan berbakat yang bisa kita gunakan. Beberapa dari mereka sudah pensiun, namun dengan sedikit bujukan, kita seharusnya bisa mendapatkannya kembali."
 AUS_follow_the_jansa_plan: "Ikuti Rencana Alfred Jansa"
 AUS_follow_the_jansa_plan_desc: "Marsekal Lapangan Alfred Jansa yang berpengalaman telah lama menyusun rencana untuk mempertahankan [AUS.GetNameDef] jika terjadi serangan [GER.GetAdjective]. Dengan situasi dunia saat ini, sayangnya kita mungkin memerlukan rencana tersebut."
 AUS_follow_the_jansa_plan_tt: "§RAkan mencopot Franz Böhme secara permanen sebagai calon Panglima Angkatan Darat!§!"
 AUS_follow_the_jansa_plan_tt2: "Tersedia sebagai §YPanglima Angkatan Darat§!:"
 AUS_fortify_the_traun_line: "Perkuat Jalur Traun"
 AUS_fortify_the_traun_line_available_tt: "Setidaknya satu provinsi di §Y[152.GetName]§! atau §Y[4.GetName]§! berbatasan dengan §Y[GER.GetNameWithFlag]§! mempunyai ruang untuk membangun §Y3§! atau lebih §YBenteng Tanah§!"
 AUS_fortify_the_traun_line_bypass_tt: "Tidak ada provinsi di §Y[152.GetName]§! atau §Y[4.GetName]§! yang berbatasan dengan §Y[GER.GetNameWithFlag]§! mempunyai ruang untuk membangun §Y3§! atau lebih §YBenteng Tanah§!"
 AUS_fortify_the_traun_line_desc: "Langkah pertama dari rencana yang digariskan oleh Jansa adalah membangun benteng di sepanjang sungai Traun, namun seiring berjalannya waktu, pilihan telah dibuat untuk mendorong benteng tersebut hingga ke perbatasan [GER.GetAdjective]. Kita harus memulai proyek ini sebelum tidak digunakan lagi."
 AUS_fortify_the_traun_line_tt: "Membangun §YLand Forts§! tingkat 3 di sepanjang perbatasan [GER.GetAdjective] dari Linz hingga Salzburg di provinsi yang memiliki ruang untuk itu"
 AUS_extend_the_traun_line: "Perpanjang Jalur Traun"
 AUS_extend_the_traun_line_desc: "Meskipun benteng yang ada saat ini telah mengamankan perbatasan Barat Laut, kita masih memiliki jalur pegunungan di dekat Innsbruck yang tidak dijaga. Dengan memperluas garis benteng kita dapat memastikan tidak ada musuh yang menyelinap di belakang benteng kita."
 AUS_extend_the_traun_line_available_tt: "Setidaknya satu provinsi di §Y[153.GetName]§! yang berbatasan dengan §Y[GER.GetNameWithFlag]§! mempunyai ruang untuk membangun §Y_3§! atau lebih §YBenteng Tanah§!"
 AUS_extend_the_traun_line_bypass_tt: "Tidak ada provinsi di §Y[153.GetName]§! yang berbatasan dengan §Y[GER.GetNameWithFlag]§! mempunyai ruang untuk membangun §Y3§! atau lebih §YBenteng Tanah§!"
 AUS_extend_the_traun_line_tt: "Membangun §YLand Forts§! tingkat 3 di sepanjang perbatasan [GER.GetAdjective] dari Salzburg hingga Innsbruck di provinsi yang memiliki ruang untuk itu"
 AUS_the_homeland_front: "Front Tanah Air"
 AUS_the_homeland_front_desc: "Jika terjadi invasi skala besar yang menimpa kita, setiap warga Austria harus melakukan tugasnya terhadap Tanah Air. Kita harus melatih tentara kita secara khusus untuk skenario ini, perjuangan demi tanah air, untuk memastikan bahwa jika hal itu terjadi, kita sudah siap."
 AUS_establish_bohme_plan: "Tetapkan Rencana Franz Böhme"
 AUS_establish_bohme_plan_desc: "Franz Böhme, salah satu Field Marshals kami, telah mempertimbangkan rencana pertempuran ofensif jika kami ingin menyerang di luar perbatasan kami. Dengan ambisi kita saat ini, rencana ini mungkin berguna."
 AUS_establish_bohme_plan_tt: "§RAkan mencopot Alfred Jansa secara permanen sebagai calon Panglima Angkatan Darat!§!"
 AUS_intensify_training_efforts: "Upaya Pelatihan yang Diintensifkan"
 AUS_intensify_training_efforts_desc: "Meskipun upaya pelatihan kami telah membuahkan hasil, kami yakin bahwa upaya tersebut masih dapat ditingkatkan. Dengan meningkatkan efisiensi pelatihan dasar, kita dapat mengurangi lebih banyak waktu yang dibutuhkan untuk melatih seorang prajurit."
 AUS_heeding_the_call_of_duty: "Mengindahkan Panggilan Tugas"
 AUS_heeding_the_call_of_duty_desc: "Rakyat Austria harus menerima situasi negara kita. Meskipun tidak ada seorang pun yang menginginkan perang diperlukan, namun masih belum ada jaminan bahwa perang tidak akan terjadi. Dengan memastikan negara kita memercayai penilaian kita, dan bersedia berperang jika diperlukan, kita akan meningkatkan kesiapan kita secara signifikan."
 AUS_strengthen_the_arms_industry: "Leopold Gasser Waffenfabrik"
 AUS_strengthen_the_arms_industry_desc: "Beberapa pabrikan lama kita masih terus memproduksi barang-barang sipil, meskipun kita sekarang sangat membutuhkan persenjataan. Dengan insentif moneter, kita seharusnya bisa membuat Leopold Gasser Waffenfabrik kembali berbisnis dan memproduksi beberapa senjata yang sangat dibutuhkan."
 AUS_improved_warfare_strategies: "Peningkatan Strategi Peperangan"
 AUS_improved_warfare_strategies_desc: "Setelah bertahun-tahun berada di bawah Perjanjian Saint-Germain-En-Laye, strategi dan doktrin kami menjadi sangat ketinggalan jaman. Meskipun kita telah berhasil melewatinya sejauh ini, jika kita tidak memperbaikinya, kita sedang mempersiapkan diri untuk gagal."
 AUS_improved_warfare_strategies_bonus: "Peningkatan Strategi Peperangan"
 AUS_hirtenberger_artillery: "Berinvestasi di Artileri Hirtenberger"
 AUS_hirtenberger_artillery_desc: "Untuk waktu yang lama, Hirtenberger adalah pilihan kami ketika kami membutuhkan senjata Artileri dan amunisi. Sekarang mereka sama seperti industri militer kita lainnya yang menderita kekurangan dana ketika kita berada di bawah Perjanjian Saint-Germain-En-Laye. Kita harus melakukan investasi untuk mengembalikan mereka ke jalur yang benar."
 AUS_hirtenberger_artillery_tt: "Membuka §YSistem Pertahanan Hirtenberger§! sebagai desainer"
 AUS_saurerwerke: "Österreichische Saurerwerke"
 AUS_saurerwerke_desc: "Sejak lama Österreichische Saurerwerke telah membuat truk untuk berbagai keperluan. Di saat-saat seperti ini, kita membutuhkan mereka untuk fokus hanya pada keahlian terbaik mereka, yaitu membuat truk untuk militer."
 AUS_graf_und_stift_focus: "Graf & Stift"
 AUS_graf_und_stift_focus_desc: "Meskipun Gräf & Stift praktis tidak pernah membuat truk untuk militer, mereka memiliki reputasi yang sangat baik dalam membuat mobil dan truk yang sangat cepat. Meskipun pendekatan ini tidak konvensional, pendekatan ini terbukti berguna di lapangan."
 AUS_invite_foreign_tank_designers: "Undang Desainer Tank Asing"
 AUS_invite_foreign_tank_designers_desc: "[AUS.GetNameDefCap] saat ini kekurangan perancang tank yang andal. Sejauh ini berbagai macam tangki telah digunakan tetapi sekarang saatnya kita mulai memproduksi tangki sendiri. Mengundang Ansaldo untuk beroperasi di sini adalah langkah awal yang bagus."
 AUS_invite_foreign_tank_designers_tt: "Membuka §YAnsaldo§! sebagai desainer"
 AUS_basic_tanks: "Upaya Panzer"
 AUS_basic_tanks_desc: "Sebagian besar tank kami sudah agak ketinggalan jaman dan memerlukan beberapa perbaikan. Sekarang kita memiliki seseorang untuk membuat tangki, kita mungkin mendapat manfaat dari berinvestasi sedikit untuk meneliti cara terbaik untuk meningkatkan tangki kita."
 AUS_panzer_effort_bonus: "Upaya Panzer"
 AUS_advanced_tanks: "Upaya Panzer Tingkat Lanjut"
 AUS_advanced_tanks_desc: "Melihat tank-tank kita, kita menyadari bahwa tank-tank tersebut memiliki lapis baja yang sangat berat, dan lambat, atau sangat ringan dan gesit, namun tidak begitu kokoh. Dengan memilih yang terbaik dari kedua konsep desain ini, kita seharusnya mampu menghasilkan tank yang kokoh, namun gesit, berlapis baja, namun cepat."
 AUS_reestablish_austrian_navy: "Bentuk kembali Angkatan Laut"
 AUS_reestablish_austrian_navy_desc: "Hilangnya garis pantai kita pada akhir Perang Besar berarti kita tidak lagi mempunyai kemungkinan untuk membangun kapal baru. Kami dengan enggan menyerahkan sisa armada kami ke kondisi pelarian [YUG.GetNameDef] yang kemudian menyerahkannya tidak lebih dari dua minggu kemudian. Sekarang kita sekali lagi mempunyai kemungkinan untuk mengembangkan angkatan laut, kita harus memastikan bahwa kesalahan ini tidak akan terulang lagi."
 AUS_build_dockyards_if_coastal: "Akan langsung membangun §YNaval Dockyard§! di negara bagian pesisir acak yang dikuasai Austria, hanya tersedia jika menguasai setidaknya satu negara bagian pantai."
 AUS_rebuild_the_armada: "Bangun kembali Armada"
 AUS_rebuild_the_armada_desc: "Kami memiliki sejarah dalam memproduksi kapal perang yang kuat dan menguasai lautan. Hari-hari itu terasa jauh sekarang tetapi pengetahuannya belum hilang. Sudah saatnya kita merebut kembali lautan, dan apa lagi yang bisa kita lakukan selain membangun armada yang cukup besar, dengan kapal perang yang besar untuk menghalangi setiap dan semua penyerang potensial."
 AUS_revive_stt: "Menghidupkan kembali STT"
 AUS_revive_stt_desc: "Stabilimento Tecnico Triestino pernah menjadi tempat galangan kapal kami untuk kapal-kapal besar. Kapal-kapal yang mereka hasilkan memiliki kualitas yang sangat baik dan melayani kami dengan baik pada masa itu. Dengan beberapa galangan kapal yang kini berada di bawah kendali kami lagi, kami harus mengoperasikannya kembali."
 AUS_rebuild_the_armada_bonus: "Membangun kembali Armada"
 AUS_streamline_production: "Memperlancar Produksi Kapal"
 AUS_streamline_production_desc: "Kapal berukuran besar mempunyai banyak kelebihan seperti sebagai pencegah serangan, dan mampu menimbulkan kerusakan serius pada lawan kita. Namun mereka juga mempunyai kelemahan besar, yaitu biaya yang tinggi, baik dari segi waktu maupun bahan. Pembuat kapal kami mempunyai ide bagaimana kami dapat mempercepat produksi."
 AUS_continue_old_production: "Lanjutkan Jalur Produksi Lama"
 AUS_continue_old_production_desc: "Sebelum kami kehilangan kendali atas garis pantai, kami telah memulai produksi dua kapal perang yang megah. Lambung kapal-kapal tersebut masih berada di tangan kita dan meskipun sudah ketinggalan jaman, kapal-kapal tersebut masih bisa menjadi aset yang luar biasa dalam upaya angkatan laut kita yang baru."
 AUS_continue_old_production_tt: "Jika teknologi untuk membangun §YBattleships§! belum dibuka, buka kunci teknologi tersebut."
 AUS_reclaim_dockyards: "Merebut Kembali Galangan Kapal Lama"
 AUS_reclaim_dockyards_desc: "Seiring dengan perubahan sifat pertempuran laut, kebutuhan angkatan laut kita juga berubah. Sudah lama berlalu hari-hari ketika hanya membawa sedikit kapal namun perkasa ke medan perang. Pertempuran laut modern mengharuskan kita memiliki kapasitas yang jauh lebih besar untuk membangun kapal baru dan memperbaiki kapal kita sendiri. Kita harus memperluas jumlah galangan kapal"
 AUS_promote_admirals: "Promosikan Laksamana"
 AUS_promote_admirals_desc: "Setelah sekian lama tidak memiliki angkatan laut, wajar saja jika kita tidak lagi memiliki jumlah laksamana seperti dulu. Meskipun jumlah calon laksamana tidak terlalu besar, kami masih memiliki beberapa yang setidaknya memiliki beberapa pengalaman yang mungkin bisa membawa armada kami menuju kemenangan."
 AUS_promote_admirals_tt: "Membuka §YJohannes of Liechtenstein§! (skill 3) dan §YCarl Heinz Birnbacher§! (skill 2) sebagai Laksamana"
 AUS_promote_admirals_fasc_com_tt: "Membuka §YCarl Heinz Birnbacher§! (keterampilan 2) sebagai Laksamana"
 AUS_defending_the_coast: "Mempertahankan Pantai"
 AUS_defending_the_coast_desc: "Sama seperti kita ingin membangun kembali angkatan laut kita yang lama dengan segala kemegahannya, kita juga harus menghadapi kenyataan. Produksi kapal besar dalam skala besar belum akan terjadi dalam waktu dekat. Faktanya, jika kita tidak segera memanfaatkan wilayah pesisir kecil ini, kemungkinan besar kita akan kehilangan wilayah tersebut dibandingkan memenangkan pertempuran laut lagi. Kapal-kapal besar harus menunggu, karena saat ini yang kita butuhkan adalah armada yang mampu melindungi pantai kita."
 AUS_defending_the_coast_bonus: "Mempertahankan Pantai"
 AUS_elin: "ELIN"
 AUS_elin_desc: "Inspirasi bisa datang dari tempat yang paling aneh. ELIN, produsen barang elektronik, akhir-akhir ini telah mengambil risiko membuat kapal selam eksperimental. Kapal selamnya ternyata sangat bagus. Kita harus mempertimbangkan untuk mendekati mereka dan meminta mereka membangun kapal selam kita di masa depan."
 AUS_light_ship_bonus: "Kawanan Defensif"
 AUS_light_ship_bonus_desc: "Tidak butuh waktu lama bagi pembuat kapal kita untuk menemukan metode untuk mempercepat produksi kapal dan kapal selam yang lebih kecil. Dengan menstandardisasi metode-metode ini, kita seharusnya mampu membangun armada yang cukup besar untuk menjaga keamanan garis pantai kita."
 AUS_coastal_defence_forts: "Mengawal Pesisir"
 AUS_coastal_defence_forts_desc: "Apa yang kita lakukan di laut hanyalah bagian dari apa yang menentukan peluang keberhasilan kita. Bagian lainnya adalah garis pantai kita, dan betapa tepat benteng tersebut telah dibentengi. Beberapa benteng pantai yang ditempatkan dengan baik dapat menggagalkan invasi yang direncanakan dengan matang sekalipun."
 AUS_naval_efficiency: "[ROOT.GetAdjective] Efisiensi Angkatan Laut"
 AUS_naval_efficiency_desc: "Melalui kerja keras dan dedikasi, kami berhasil membangun kembali kekuatan angkatan laut dalam jumlah besar, melawan segala rintangan. Kesuksesan kita telah memacu baik para pelaut kita maupun mereka yang bekerja di galangan kapal, kita harus memanfaatkan ini untuk dorongan terakhir menuju keunggulan!"
 ### BELGIAN FOCUS TREE ###
BEL_perpetual_neutrality: "Netralitas Abadi"
BEL_perpetual_neutrality_desc: "Karena negara kita adalah medan perang utama, negara kita menjadi puing-puing setelah Perang Dunia Pertama. Hal ini tidak boleh dibiarkan terulang lagi. Oleh karena itu, kami akan mengumumkan bahwa [BEL.GetNameDef] akan membentuk negara yang merdeka dan netral selamanya, dan akan menerapkan netralitas yang sama terhadap semua negara bagian lainnya."
BEL_independent_neutral_and_loyal: "Independen, Netral dan Setia"
BEL_independent_neutral_and_loyal_desc: "Selama perang terakhir, kami mengandalkan sekutu kami, dan sebagai hasilnya, negara kami menjadi medan perang. Oleh karena itu, dalam upaya untuk mencegah perang terhadap [BEL.GetNameDef], penguasa kami telah mendeklarasikan kami sebagai \"Independen, Netral, dan Setia\".\n\nHal ini akan menyatukan kelas-kelas politik dalam menghadapi kebutuhan untuk mengatasi pertahanan kita sendiri, dan dengan demikian mengembangkan pencegahan militer kita sendiri."
BEL_defensive_neutrality: "Netralitas Pertahanan"
BEL_defensive_neutrality_desc: "Kini setelah kita memperjelas sikap netral kita, inilah waktunya bagi kita untuk mulai berupaya menegakkannya. Kita akan menjadikan diri kita terlalu sulit untuk ditaklukkan, sehingga membuat invasi menjadi tidak mungkin dilakukan."
BEL_national_redoubt_at_antwerp: "Benteng Pertahanan Nasional di Antwerpen"
BEL_national_redoubt_at_antwerp_available_tt: "Salah satu hal berikut ini harus benar:\n1 §Y$bunker$§! dapat dibangun di kota Brussels\n2 §Y$bunker$s§! dapat dibangun di kota Antwerpen"
BEL_national_redoubt_at_antwerp_bypass_tt: "Semua hal berikut ini harus benar:\n1 §Y$bunker$§! TIDAK dapat dibangun di kota Brussels\n2 §Y$bunker$s§! TIDAK dapat dibangun di kota Antwerpen"
BEL_national_redoubt_at_antwerp_desc: "Landasan sejarah pertahanan kami selalu berada di Antwerp. Kami akan meningkatkan benteng di sana, dan menggunakannya sebagai titik tumpu untuk memperkuat wilayah lain di negara ini."
BEL_belgian_gates: "Gerbang Belgia"
BEL_belgian_gates_desc: "Juga dikenal sebagai elemen Cointet, konstruksi besi besar ini dirancang khusus untuk menghalangi jalannya tank."
BEL_fortify_liege: "Perkuat Liege"
BEL_fortify_liege_available_tt: "Setidaknya satu provinsi di §Y[34.GetName]§!, berbatasan dengan sungai Meuse mempunyai ruang untuk membangun 1 §Y$bunker$§!"
BEL_fortify_liege_bypass_tt: "Tidak ada provinsi di §Y[34.GetName]§! yang berbatasan dengan sungai Meuse mempunyai ruang untuk membangun 1 §Y$bunker$§!"
BEL_fortify_liege_tt: "Membangun tingkat 1 §Y$bunker$§! di §Y[34.GetName]§! di sepanjang sungai Meuse di provinsi yang memiliki ruang untuk itu"
BEL_fortify_liege_desc: "Selama Perang Dunia Pertama, posisi Liege yang dibentengi memainkan peran penting dalam menahan pasukan Jerman, sehingga pertahanan berhasil dibangun. Meskipun demikian, kekurangan serius terlihat pada desain benteng. Kita telah memetik pelajaran, dan sekarang saatnya untuk meningkatkan kembali benteng tersebut."
BEL_iron_wall: "Tembok Besi"
BEL_iron_wall_desc: "Gerbang Belgia kami telah terbukti menjadi penghalang yang signifikan terhadap manuver musuh dalam pengujian, jadi kami harus menyebarkannya secara massal di seluruh negara kami untuk menghentikan mereka yang akan menyerang kami."
BEL_eben_emael_fortress: "Benteng Eben Emael"
BEL_eben_emael_fortress_available_tt: "Dapat membangun setidaknya 2 §Y$bunker$s§! di §YLiège§!"
BEL_eben_emael_fortress_bypass_tt: "Tidak dapat membangun setidaknya 2 §Y$bunker$s§! di §YLiège§!"
BEL_eben_emael_fortress_desc: "Benteng terbesar dan termegah di barisan kami, diposisikan di titik tinggi yang menghadap Terusan Albert, Eben Emael akan memberikan landasan pertahanan dan dukungan artileri bagi pasukan di sekitarnya, dan menjadi penghalang yang tidak dapat ditembus oleh siapa pun yang melanggar perbatasan kami."
BEL_our_southern_neighbour: "Tetangga Selatan kami"
BEL_our_southern_neighbour_desc: "Berkat pengalaman kami dalam perang terakhir, sebagian besar pertahanan kami diarahkan ke tetangga kami di sebelah timur, namun mereka bukan satu-satunya kekuatan besar yang berbatasan dengan kami. Kita harus memastikan bahwa kita juga memiliki benteng yang sama di wilayah selatan."
BEL_koningshooikt_wavre_line: "Jalur Koningshooikt-Wavre"
BEL_koningshooikt_wavre_line_desc: "Jalur Koningshooikt – Wavre, atau disingkat Jalur KW, adalah garis pertahanan kedua antara Koningshooikt dan Wavre. Posisi-posisi ini disiapkan khusus untuk pendudukan oleh pasukan kita dan sekutu, bukan garnisun, dan terdiri dari parit, kotak pil, dan gerbang Belgia. Ini adalah garis pertahanan yang sangat kokoh dan seharusnya menjadi titik perlawanan utama bagi kita."
BEL_mobilize_the_nation: "Memobilisasi Bangsa"
BEL_mobilize_the_nation_desc: "Benteng bukanlah satu-satunya hal yang harus kita persiapkan, namun penduduk itu sendiri dapat menjadi aset terbesar kita. Selama perang terakhir mereka berjuang dengan gagah berani melawan penjajah, mari kita manfaatkan semangat yang sama dan menggalang rakyat kita untuk bertahan."
BEL_flooded_tank_barriers: "Penghalang Tangki yang Kebanjiran"
BEL_flooded_tank_barriers_desc: "Kami percaya bahwa tank akan memainkan peran penting dalam perang di masa depan, dan pertahanan kita harus mencerminkan hal ini. Kita bisa menyiapkan Gerbang Belgia, dan menenggelamkannya ke dalam air untuk menggandakan efektivitasnya."
BEL_protect_against_france: "Lindungi Terhadap Perancis"
BEL_protect_against_france_desc: "Persiapan sebelumnya di selatan lebih merupakan persiapan jika terjadi pengepungan, namun kenyataannya adalah bahwa mungkin ada invasi skala penuh dari Perancis - dan kita harus mempersiapkan benteng dan benteng yang sesuai!"
BEL_protect_against_france_available_tt: "Dapat membangun §Y1 Benteng Tanah§! di §YCharleroi§!, §YKortrijik§! atau §Yprovinsi pesisir Barat Laut Kortrijik§!"
BEL_dam_the_consequences: "Bendungan Konsekuensinya"
BEL_dam_the_consequences_desc: "Bendungan Gileppe yang sangat besar menyediakan air dan listrik untuk wilayah timur kita, dan juga memberikan peluang bagus untuk menggenangi daratan di sana jika kita takut akan potensi terobosan musuh."
BEL_defensive_reorganization: "Reorganisasi Defensif"
BEL_defensive_reorganization_desc: "Kita telah melakukan apa yang kita bisa untuk bersiap menghadapi invasi, satu-satunya hal yang perlu dilakukan adalah mengidentifikasi perubahan doktrinal yang lebih strategis dan tingkat tinggi yang diarahkan pada garis pemikiran defensif yang paling modern."
BEL_defense_bill: "RUU Pertahanan"
BEL_defense_bill_desc: "Deklarasi netralitas abadi kami tidak diterima dengan baik di panggung internasional, namun kenyataannya hal ini perlu dilakukan untuk memusatkan dukungan politik terhadap program persenjataan yang signifikan."
BEL_royal_military_academy: "Akademi Militer Kerajaan"
BEL_royal_military_academy_desc: "Akademi Militer Kerajaan adalah satu-satunya lembaga pembelajaran militer di [ROOT.GetNameDef], namun dengan situasi global yang semakin tidak menentu, kita harus memastikan bahwa kita mempersiapkan perwira masa depan dengan teori militer terbaik, dan hal ini memerlukan perluasan akademi tersebut."
BEL_multi_language_courses: "Kursus Multi-Bahasa"
BEL_multi_language_courses_desc: "Salah satu masalah besar yang dihadapi militer kita adalah sifat dua bahasa dari populasi kita. Mari kita ubah ini menjadi keuntungan! Kami dapat mengajari perwira kami bahasa Prancis dan Belanda, dan memanfaatkan manfaat korps perwira bilingual."
BEL_department_of_telecommunications: "Departemen Telekomunikasi"
BEL_department_of_telecommunications_desc: "Komunikasi sangat penting bagi militer, jadi kita harus mengarahkan pendidikan ke arah penggunaan teknologi baru seperti radio dan teknologi lama yang sudah terbukti seperti merpati pos."
BEL_department_of_ballistic_metrology: "Departemen Metrologi Balistik"
BEL_department_of_ballistic_metrology_desc: "Departemen Metrologi Balistik berspesialisasi dalam pengukuran dan balistik, memungkinkan penghitungan lintasan secara akurat."
BEL_resist_and_bite: "Tolak dan Gigit"
BEL_resist_and_bite_desc: "Chasseurs Ardennais adalah unit elit pasukan [ROOT.GetAdjective], yang sebagian besar terdiri dari mereka yang tinggal di provinsi Luksemburg, yang terbiasa dengan hutan lebat di wilayah tersebut. Motto mereka adalah \"Melawan dan Menggigit!\""
BEL_center_for_advanced_military_studies: "Pusat Studi Militer Tingkat Lanjut"
BEL_center_for_advanced_military_studies_desc: "Ketika kekuatan militer semakin besar, tuntutan komando menjadi semakin ketat. Kita harus terus menjadi yang terdepan dan melatih komando tinggi kita dengan prinsip-prinsip strategis terkini dan mengembangkan kemampuan mereka di bidang-bidang seperti logistik, komando dan kendali, dan integrasi senjata gabungan, mungkin dengan mempertimbangkan kekuatan sekutu juga."
BEL_anti_tank_guns: "Senjata Anti-Tank yang Luar Biasa"
BEL_anti_tank_guns_desc: "Kualitas metalurgi [ROOT.GetAdjective] yang hebat telah memungkinkan masinis kami membuat senjata terbaik, dan kami harus memanfaatkan kemampuan kami untuk menciptakan beberapa monster berkecepatan tinggi! Kita bahkan bisa melangkah lebih jauh, dan menaruhnya di tangki mana pun yang kita miliki juga."
BEL_junior_officer_training: "Pelatihan Perwira Muda"
BEL_junior_officer_training_desc: "Seorang perwira yang baik akan menginspirasi tentaranya untuk berjuang melawan rintangan, namun mungkin buta terhadap situasi tanpa harapan. Seorang pemimpin yang baik akan dengan tepat mengidentifikasi keadaan yang suram, namun akan memanfaatkannya sebaik mungkin. Seorang pemimpin yang hebat akan mempunyai rencana yang siap untuk melepaskan diri dari situasi itu dan menyerang lagi dari posisi yang lebih baik. Kami akan mengidentifikasi dan melatih petugas kami untuk menjadi yang terbaik yang mereka bisa."
BEL_belgian_special_forces: "[ROOT.GetAdjective] Pasukan Khusus"
BEL_belgian_special_forces_desc: "Prajurit [ROOT.GetAdjective] selalu tangguh dan berdedikasi, tapi kita harus bertanya-tanya apa yang mampu mereka lakukan jika dipimpin oleh seseorang yang berkompeten seperti Eddy Blondeel, maka kita bisa berspekulasi betapa istimewanya pasukan ini."
BEL_senior_officer_training: "Pelatihan Perwira Senior"
BEL_senior_officer_training_desc: "Perwira dapat dikatakan memiliki dua dari empat sifat berikut: malas, bodoh, rajin, dan pandai. Perwira staf harus rajin dan pandai, perwira senior harus malas dan pandai. Bahkan orang bodoh dan malas pun punya kegunaannya. Yang terpenting, kita harus mengidentifikasi mereka yang bodoh dan rajin, karena mereka mengambil keputusan yang mengarah pada bencana, dan memiliki kemauan serta energi untuk mewujudkannya."
BEL_fonderie_royale_de_canons_liege: "Fonderie Royale de Canons Liege"
BEL_fonderie_royale_de_canons_liege_desc: "Didirikan oleh Napoleon Bonaparte pada tahun 1803, ketika Liege masih menjadi bagian dari Perancis, pabrik pengecoran kanon kerajaan di Liege telah menjadi pengembang utama senjata berat di Belgia. Kami mendapat manfaat besar dari kualitas pengerjaan logam di kawasan ini, senjata berkaliber tinggi yang cukup terkenal, dan fasilitas ini memerlukan investasi lebih lanjut untuk memperluas kemampuan kami lebih lanjut."
BEL_interpreters: "Penerjemah"
BEL_interpreters_desc: "Salah satu kendala besar yang harus diatasi oleh angkatan bersenjata kita adalah persyaratan korps perwira yang bilingual untuk dapat memimpin tentara Flemish dan Walloon. Kini, hal ini dapat menjadi salah satu kekuatan terbesar kami karena kami dapat beroperasi dengan impunitas di wilayah tetangga kami tanpa hambatan bahasa."
BEL_interpreters_tt: "§YSemangat Nasional§! ini akan ditambahkan baik kepada anggota fraksi saat ini maupun anggota fraksi di masa depan."
BEL_center_of_nuclear_chemistry: "Pusat Kimia Nuklir"
BEL_center_of_nuclear_chemistry_desc: "Kami telah mengikuti dengan cermat teori Oppenheimer, Heisenberg dan Bohr dan telah memutuskan bahwa kami harus mempertimbangkan penerapan ilmu ini untuk diri kami sendiri. Bagaimanapun, kami adalah salah satu dari sedikit negara yang memiliki akses mudah terhadap uranium dari Kongo."
BEL_strategic_doctrine_development: "Pengembangan Doktrin Strategis"
BEL_strategic_doctrine_development_desc: "Tidaklah cukup hanya memikirkan pertempuran demi pertempuran, kita harus memiliki pemahaman yang kuat tentang lapisan strategis, dan mengatur militer kita berdasarkan doktrin tertentu untuk memastikan bahwa semua kekuatan kita bergerak menuju tujuan tunggal yang sama: kemenangan."
BEL_belgian_tank_development: "[ROOT.GetAdjective] Pengembangan Tangki"
BEL_belgian_tank_development_desc: "Meskipun industri otomotif kita luas, kita tidak pernah menaruh perhatian khusus pada pengembangan peperangan lapis baja. Dengan mempertimbangkan kemajuan militer terkini, sudah saatnya kita berinvestasi dalam program pengembangan tank kita sendiri."
BEL_doctrinal_innovations: "Inovasi Doktrinal"
BEL_doctrinal_innovations_desc: "Doktrin dapat membantu mengarahkan pasukan dan memastikan semua orang bergerak dengan kecepatan yang sama, namun, terkadang untuk benar-benar maju, Anda perlu berpikir di luar kebiasaan. Kami ingin melampaui hal ini, menghancurkan kotak, memecahkan cetakan dan melakukan hal-hal kami sendiri. Musuh kita tidak akan pernah menyadarinya."
BEL_modernized_army: "Tentara Modern"
BEL_modernized_army_desc: "Seringkali perbedaan antara pemenang dan pecundang dalam perang terletak pada siapa yang mengambil pelajaran terbaik dari pengalaman mereka. Inilah waktunya bagi kita untuk merenungkan semua kemenangan dan kekalahan yang telah kita peroleh, kemudian mereformasi angkatan bersenjata untuk membawanya ke standar yang baru dan modern."
BEL_increased_length_of_service: "Peningkatan Lama Pelayanan"
BEL_increased_length_of_service_desc: "Dengan meningkatnya ketegangan di seluruh dunia, dan posisi strategis kita di antara raksasa militer, kita harus menunjukkan kesediaan kita untuk mempertahankan diri dan memastikan kedaulatan wilayah kita. Oleh karena itu, kami akan meningkatkan kewaspadaan cadangan kami dan meningkatkan masa kerja bagi mereka yang saat ini bertugas."
BEL_fn_herstal: "FN Herstal"
BEL_fn_herstal_desc: "[ROOT.GetNameDefCap] diberkati oleh industri senjata terkenal dunia, Fabrique Nationale de Herstal atau FN Herstal menjadi yang paling menonjol. Produsen senjata ini memproduksi senjata dengan kualitas luar biasa, dirancang oleh orang-orang terbaik dalam bisnisnya. Kolaborasi erat dengan Browning Arms Company semakin memperkuat jangkauan global yang dinikmati perusahaan kami."
BEL_legacy_of_the_great_war: "Warisan Perang Besar"
BEL_legacy_of_the_great_war_desc: "Kita telah menempuh perjalanan panjang sejak kengerian perang \"besar\", dan meskipun luka-luka kita belum sepenuhnya pulih, kita menanggung luka-luka kita dengan bangga. Sekali kita melawan penjajah, kita bisa, tidak, kita akan melawan mereka lagi."
BEL_poudreries_reunies_de_belgique: "Poudreries Réunies de Belgique"
BEL_poudreries_reunies_de_belgique_desc: "Perusahaan senjata tertua kedua di Belgia, Poudreries berspesialisasi dalam amunisi, sehingga merampingkan posisi mereka dalam jaringan logistik kami akan memberi kami hasil yang luar biasa."
BEL_minerva_imperia: "Minerva-Imperia"
BEL_minerva_imperia_desc: "Belgia tidak hanya menjadi pemain terdepan dalam penggunaan mobil lapis baja pada Perang Dunia Pertama, kami juga menikmati posisi utama dalam industri otomotif selama tahun-tahun antar perang. Dua pabrikan terbesar kita, Minerva dan Imperia baru-baru ini melakukan merger dan akan sangat disayangkan jika kita tidak memanfaatkan posisi terdepan mereka demi keuntungan kita bersama."
BEL_repudiate_treaty_with_france: "Menolak Perjanjian Dengan Perancis"
BEL_repudiate_treaty_with_france_desc: "Penolakan [FRA.GetNameDefCap] untuk memperluas garis Maginot di sepanjang perbatasan kita, pada dasarnya meninggalkan pintu terbuka lebar di mana musuh akan terpaksa menyerang. Dengan menolak perjanjian kita dengan mereka, kita bisa bebas dari kewajiban militer apa pun untuk membantu mereka, namun mereka tetap terpaksa melakukan intervensi jika kita diserang, atau mengambil risiko melakukan invasi lanjutan ke wilayah mereka yang tidak dijaga."
BEL_german_non_aggression: "Non-Agresi Jerman"
BEL_german_non_aggression_desc: "[GER.GetName] memuji pengumuman kami mengenai netralitas, dan secara terbuka menunjukkan ketertarikan mereka pada Pakta Non-Agresi bersama untuk memperkuat pendirian ini, dan menjamin keamanan perbatasan mereka."
BEL_dyle_plan: "Rencana Dyle"
BEL_dyle_plan_desc: "Terlepas dari semua pengumuman publik kami mengenai netralitas dan non-intervensionisme militer, secara tertutup kami terus bekerja dengan mitra strategis kami dan menyusun rencana dan kemungkinan jika terjadi invasi. Ide umumnya adalah kami bertahan selama mungkin di belakang sungai Dyle sampai pasukan ekspedisi tiba untuk memperkuat pertahanan kami."
BEL_dyle_plan_tt: "Jika perang pecah, §Y[ENG.GetNameWithFlag]§! dan §Y[FRA.GetNameWithFlag]§! akan lebih mungkin membantu kita!"
BEL_british_guarantee: "Jaminan Inggris"
BEL_british_guarantee_desc: "Hubungan baik kita dengan [ENG.GetNameDef] tidak pernah menjadi rahasia, jadi mari kita jadikan hubungan ini resmi dan berikan jaminan militer bersama."
BEL_government_resigns: "Pemerintah Mengundurkan Diri"
BEL_government_resigns_desc: "Tekanan terhadap pemerintah semakin meningkat karena meluasnya tuduhan korupsi dari organisasi Fasis Rexis, yang menyebabkan jatuhnya pemerintahan, dan dimulainya persiapan untuk pemilu baru."
BEL_auto_complete_government_resigns_tt: "Fokus ini diselesaikan secara otomatis berdasarkan hasil acara §YPemerintah Mengundurkan Diri§!."
BEL_government_of_national_unity: "Pemerintahan Persatuan Nasional"
BEL_government_of_national_unity_desc: "Meskipun oposisi dari gerakan Fasis semakin meningkat, partai-partai demokratis Liberal, Sosialis dan Katolik bersatu kembali di bawah kepemimpinan Paul van Zeeland, dan membentuk Pemerintahan Persatuan Nasional yang baru."
BEL_investigate_bribery_charges: "Selidiki Tuduhan Suap"
BEL_investigate_bribery_charges_desc: "Tuduhan korupsi tidak pernah hilang dari pemerintahan, dan seruan untuk melakukan penyelidikan semakin meningkat. Leon Degrelle, pemimpin Fasis Rexis bahkan secara langsung menuduh Paul van Zeeland sendiri menuduhnya menerima suap."
BEL_royal_intervention: "Intervensi Kerajaan"
BEL_royal_intervention_desc: "Pemerintahan kembali jatuh, dan inilah saatnya bagi Raja untuk turun tangan dan mengambil tindakan. Ada dua calon Perdana Menteri, yaitu Paul-Émile Janson atau Leon Degrelle yang memimpin pengaduan terhadap korupsi rezim sebelumnya."
BEL_auto_complete_royal_intervention_tt: "Fokus ini diselesaikan secara otomatis berdasarkan hasil acara §YRoyal Appointment§!."
BEL_paul_emile_janson: "Paul-Émile Janson"
BEL_paul_emile_janson_desc: "Pilihan liberal untuk Perdana Menteri, Paul-Émile Janson dipilih oleh Raja sebagai tangan yang mantap untuk membimbing pemerintah kembali ke stabilitas di hari-hari yang semakin tidak stabil ini."
BEL_plan_de_man: "Rencana de Man"
BEL_plan_de_man_desc: "Meskipun hal ini memerlukan biaya politik yang besar, Perdana Menteri telah bekerja keras untuk melanjutkan reformasi yang dilakukan Henri de Man, dan menerapkan langkah-langkah pengangguran lebih lanjut. Hal ini bertujuan untuk mengurangi tingkat pengangguran dari angka tertinggi 23,5% pada tahun 1932 menjadi 15%."
BEL_economic_recovery: "Pemulihan Ekonomi"
BEL_economic_recovery_desc: "Kerja keras pemerintah kita, meskipun menghadapi banyak hambatan, telah menghasilkan pertumbuhan dan pemulihan ekonomi yang cepat, namun hal ini masih menimbulkan kegaduhan dan hal ini belumlah cukup."
BEL_adriaan_martens_crisis: "Krisis Adrian Martens"
BEL_adriaan_martens_crisis_desc: "Penunjukan Adriaan Martens di Royal Academy of Medicine yang tampaknya sederhana, kini berubah menjadi krisis politik besar-besaran. Hal ini karena Martens diketahui merupakan kolaborator dalam perang terakhir, dan terang-terangan menyuarakan pandangan fasis. Hal ini bisa menyebabkan runtuhnya pemerintahan Spaak."
BEL_benelux_union: "Serikat Benelux"
BEL_benelux_union_desc: "Perdana Menteri Spaak telah mengajukan proposal untuk menyatukan negara-negara BeNeLux, [BEL.GetNameDef], [HOL.GetNameDef] dan [LUX.GetNameDef] dalam kesatuan pabean tunggal, dengan tujuan akhir dari potensi penyatuan penuh menjadi satu negara kesatuan super. Hal ini bahkan bisa menjadi cetak biru menuju Uni Eropa di masa depan."
BEL_benelux_union_tt: "Jika mereka Demokrat atau Non-Blok, §Y[HOL.GetNameWithFlag]§! dan §Y[LUX.GetNameWithFlag]§! diundang ke §Y$BEL_benelux_union_faction$§!"
BEL_tripartite_government: "Pemerintahan Tripartit"
BEL_tripartite_government_desc: "Seperti pemerintahan persatuan nasional sebelumnya, Perdana Menteri Pierlot telah berhasil menyatukan beberapa partai demokratis untuk menunjukkan solidaritas Belgia. Dengan kesatuan politiknya, ia akhirnya mempunyai kekuatan untuk mendorong undang-undang yang lebih radikal."
BEL_the_council_of_europe: "Dewan Eropa"
BEL_the_council_of_europe_desc: "Menjadi semakin jelas bahwa netralitas bukanlah perlindungan terhadap ekspansionisme militer dari negara-negara tetangga yang agresif. Oleh karena itu, satu-satunya cara untuk menjamin perdamaian di Eropa adalah persatuan. Kita harus menyatukan para diplomat dan kepala negara ke meja tunggal, dan membentuk Dewan Eropa."
BEL_the_council_of_europe_tt: "Membuka keputusan untuk §YMengundang negara lain ke $BEL_european_union$§!."
BEL_broken_neutrality: "Netralitas yang Rusak"
BEL_broken_neutrality_desc: "Deklarasi netralitas kami telah memberikan manfaat yang baik bagi negara kami, dan memungkinkan kami tumbuh ke posisi yang kuat. Kita sekarang bisa melepaskan belenggu ini, dan mengantarkan [BEL.GetNameDef] ke era baru."
BEL_degrelle: "Degrelle"
BEL_degrelle_desc: "Leon Degrelle, pemimpin partai Rexis dan salah satu fasis terkemuka di [BEL.GetName], telah melakukan agitasi selama beberapa waktu terhadap kepemimpinan saat ini, dan berhasil mengungkap korupsi mereka kepada publik. Setelah pemerintahan Van Zealand jatuh, Raja turun tangan dan menunjuk Degrelle sebagai Perdana Menteri baru."
BEL_support_the_rexists: "Dukung Rexis"
BEL_support_the_rexists_desc: "Kini setelah Degrelle menjabat sebagai Perdana Menteri, sudah saatnya partai yang mendukungnya mendapatkan penghargaan atas pengabdian mereka, dan anggota seniornya dipromosikan ke posisi di kabinet."
BEL_dissolve_political_parties: "Membubarkan Partai Politik"
BEL_dissolve_political_parties_desc: "Kelemahan demokrasi terbukti dengan sendirinya sebagai tempat berkembang biaknya korupsi dan keserakahan. Rakyat tidak butuh pilihan, mereka harus dipimpin, dan hanya [ROOT.GetRulingPartyLong] yang mampu melakukannya."
BEL_the_flemish_question: "Pertanyaan Flemish"
BEL_the_flemish_question_desc: "Perpecahan yang sedang berlangsung di dalam [BEL.GetName] terus menimbulkan keretakan di antara masyarakat kita. Kita harus menyelesaikan pertanyaan ini untuk selamanya, dan memutuskan sendiri standar linguistik apa yang seharusnya digunakan. Orang-orang akan melakukan apa yang diperintahkan kepada mereka, lagipula kita semua [BEL.GetAdjective], dan ini mengalahkan bahasa apa pun yang berdalih."
BEL_christian_corporatism: "Korporatisme Kristen"
BEL_christian_corporatism_desc: "Kami telah mempelajari Korporatisme Italia dengan penuh minat, sebuah konsep organisasi pekerja kolektif yang dipimpin oleh negara yang semuanya mendorong tujuan ekonomi yang sama. Niat kami adalah mengikuti model tersebut, namun menerapkan etika dan cita-cita Kristiani untuk menciptakan sesuatu yang lebih unik di Belgia."
BEL_legacy_of_the_soldier_king: "Warisan Raja Prajurit"
BEL_legacy_of_the_soldier_king_desc: "Raja Albert, Raja Prajurit, pahlawan perang dan penyelamat Belgia. Ada banyak hal yang dapat kita pelajari dari orang hebat ini, dan teladannya adalah salah satu contoh yang dapat dipelajari oleh seluruh angkatan bersenjata kita, bahkan seluruh bangsa kita. Kami akan melawan dan melawan penjajah mana pun sampai akhir."
BEL_the_lost_tribe: "Suku yang Hilang"
BEL_the_lost_tribe_desc: "Noda yang harus ditanggung oleh [BEL.GetName] sedang disapu bersama dengan bangsa Galia yang ditaklukkan dan diperbudak. Kami adalah suku Jermanik kami yang hilang. Kami adalah orang-orang yang menolak. Kitalah yang berjuang. Kita adalah orang-orang yang menaklukkan."
BEL_invite_german_tank_organization: "Undang [GER.GetAdjective] Pengembang Tangki"
BEL_invite_german_tank_organization_desc: "Karena sebagian besar kontak lapis baja kami sebelumnya tertutup bagi kami, kami perlu mencari mitra baru untuk bekerja sama dalam menghadirkan Panzer kepada masyarakat."
BEL_the_walloon_legion: "Legiun Walloon"
BEL_the_walloon_legion_desc: "Dengan nenek moyang kita yang sebenarnya sudah ditetapkan dan diklarifikasi, inilah saatnya kita memanfaatkan tradisi mulia ini, dan menunjukkan kepada dunia apa yang sebenarnya bisa kita lakukan."
BEL_the_new_ruhr: "Ruhr Baru"
BEL_the_new_ruhr_desc: "Wilayah Ruhr di Jerman terkenal dengan hasil industri mentahnya, sehingga membuat iri negara-negara besar lainnya. Belgia juga mempunyai klaim atas kehebatan industri, dan potensi yang jauh melampaui tetangga kita. Kita punya peluang, kita punya sumber daya, kita punya dorongan, dan yang paling penting. Kami memiliki orang-orangnya."
BEL_traditional_family_values: "Nilai-Nilai Keluarga Tradisional"
BEL_traditional_family_values_desc: "Gereja Katolik selalu membimbing kita dengan baik dalam hal etika keluarga yang baik, dan ajaran inilah yang harus terus kita patuhi. Ini adalah satu-satunya cara kita dapat memastikan stabilitas dan pertumbuhan yang diperlukan untuk kelanjutan ekspansi dan kemakmuran di masa depan."
BEL_the_french_horse_and_the_red_rider: "Kuda Perancis dan Penunggang Merah"
BEL_the_french_horse_and_the_red_rider_desc: "Belgia sudah terlalu lama berada di bawah kekuasaan Prancis, binatang buas yang dikomandoi oleh para pengendara komunis. Kita harus bangkit dan bertahan melawan invasi berbahaya ini. Hanya dengan menunjukkan kepercayaan diri dan kekuatan kita, makhluk itu akan menghindar dan menjadi takut."
BEL_nationalize_the_banks: "Nasionalisasi Bank"
BEL_nationalize_the_banks_desc: "Sudah terlalu lama bank-bank dijalankan oleh orang-orang kecil yang rakus, yang hanya peduli pada keuntungan. Bank adalah institusi yang melayani semua pihak, jadi sudah sepantasnya kita mengambil kendali atas bank tersebut, dan mengarahkan instrumen keuangan mereka dengan tepat demi keuntungan kita bersama."
BEL_abandon_neutrality: "Abaikan Netralitas"
BEL_abandon_neutrality_desc: "Seruan untuk netralitas adalah kata-kata dari pihak yang lemah. Di dunia ini, satu-satunya diplomasi yang penting ditunjukkan melalui kekuatan."
BEL_international_stipend: "Gaji Internasional"
BEL_international_stipend_desc: "Kami telah ditawari gaji dari negara-negara fasis lainnya untuk membeli kenetralan kami yang berkelanjutan dalam urusan mereka sendiri. Jika ini merupakan harga tanpa campur tangan, maka ini adalah harga yang bisa kita terima. Lagi pula, mereka sepertinya lupa memasukkan tanggal akhir."
BEL_civil_service_purge: "Pembersihan Pegawai Negeri Sipil"
BEL_civil_service_purge_desc: "Noda korupsi sudah terlalu lama tidak ditangani dan telah menyusup ke seluruh jajaran pemerintahan. Penyakit-penyakit radikal membutuhkan pengobatan yang radikal, dan dalam hal ini penyembuhannya adalah pembersihan menyeluruh terhadap siapapun yang kita curigai melakukan praktik korupsi."
BEL_royal_commander_in_chief: "Panglima Kerajaan"
BEL_royal_commander_in_chief_desc: "Raja Leopold III berasal dari keturunan prajurit yang baik. Raja Albert adalah pahlawan perang, dia berdiri di sisi bangsa pada saat-saat tergelap dan membawa kita menuju kemenangan gemilang. Yang diinginkan Leopold hanyalah membuktikan dirinya dan keluar dari bayang-bayang ayahnya. Kami hanya perlu memberinya kesempatan."
BEL_the_european_crusade: "Perang Salib Eropa"
BEL_the_european_crusade_desc: "Ada burung nasar yang berkeliaran di perbatasan Eropa, ideologi barbar mereka mencari kelemahan terhadap negara-negara beradab yang ada di dalamnya. Adalah panggilan kita untuk berdiri sebagai benteng bagi ketertiban dan kemajuan, bangsa kita telah membuktikan tekadnya yang tak tertandingi dan berhak menjadi pemimpin dalam perjuangan ini."
BEL_belgian_renaissance: "Renaisans Belgia"
BEL_belgian_renaissance_desc: "Kami telah babak belur, kami telah dikalahkan, namun kami belum pernah dipatahkan. Hanya melalui contoh luar biasa dari [ROOT.GetRulingPartyLong] hal ini dapat terwujud. Hanya melalui kepemimpinan kami yang berkelanjutan, kebangkitan Belgia ini akan dapat berlanjut, menuju masa keemasan lainnya."
BEL_support_the_vnv: "Dukung VNV"
BEL_support_the_vnv_desc: "Sebagai bagian dari pemilu baru-baru ini, Vlaamsch National Verbond, atau Persatuan Nasional Flemish bersekutu dengan partai Rex dengan tujuan menciptakan negara korporatis. Kini, setelah Degrelle naik ke tampuk kekuasaan, inilah waktunya bagi dia untuk memberi penghargaan kepada sekutunya dan mulai mengambil langkah menuju negara fasis yang lebih ekspansionis dengan fokus pada reunifikasi dengan Belanda."
BEL_vnv_dominant_tt: "§Y[BEL.GetName]§! akan dikenal sebagai §YVlaanderen§!"
BEL_revitalize_nederlands: "Merevitalisasi Nederlands"
BEL_revitalize_nederlands_desc: "Bahasa kami hampir hilang! Bahkan pengadilan mengeluarkan keputusannya dalam bahasa Prancis, dan hanya dialek lokal yang diingat. Langkah pertama untuk memulihkan kehebatan Flemish adalah memastikan bahasa yang tepat digunakan oleh pemerintah dan rakyat kita. Belanda!"
BEL_flanders_ascendant: "Pewaris Flanders"
BEL_flanders_ascendant_desc: "Kini kebanggaan terhadap tradisi dan sejarah Flemish semakin meningkat, inilah saatnya bagi kita untuk memanfaatkan perasaan nasionalis yang baru muncul ini dan memimpin bangsa kita menuju takdirnya, yaitu penyatuan dengan Belanda."
BEL_dietsland: "tanah diet"
BEL_dietsland_desc: "Upaya kami untuk mengamankan wilayah-wilayah berbahasa Belanda lainnya di Eropa telah berhasil, namun nampaknya tidak semua saudara kami mampu beradaptasi dengan masa depan baru ini sebaik yang kami harapkan. Kita harus mengingatkan mereka tentang budaya dan bahasa yang kita sama-sama miliki."
BEL_dietsland_tt: "§Y[BEL.GetName]§! akan dikenal sebagai §YDietsland§!"
BEL_demand_calais: "Permintaan Calais"
BEL_demand_calais_desc: "Meskipun proyek kami untuk menyatukan kembali bangsa hampir selesai, ada bagian penting dari Flanders yang masih berada di tangan asing; Kales. Awalnya merupakan bagian dari Kabupaten Flanders seribu tahun yang lalu, dan oleh karena itu sekarang sudah sepantasnya jika wilayah tersebut dikembalikan kepada kita."
treaty_of_calais: "Perjanjian Calais telah ditandatangani"
BEL_demand_calais_tt: "Pilihan kami untuk hal ini berkisar dari mencoba §Ymembeli Calais§!, hingga §Ymenjual sebagian Kongo untuk Calais§!, hingga membuat §Ypermintaan§!, dan §Ymemperjuangkannya§!, jika tindakan tersebut diperlukan."
BEL_belgian_east_indies: "Hindia Timur Belgia"
BEL_belgian_east_indies_desc: "Belanda mempunyai wilayah kolonial yang signifikan di luar negeri, khususnya di Hindia Timur. Ambisi kekaisaran kita tidak pernah hilang, dan selalu ada ruang untuk menambah beberapa permata lagi pada mahkota kita."
BEL_burgundy_rising: "Merah Marun Meningkat"
BEL_burgundy_rising_desc: "Masa keemasan kekuasaan dan pengaruh Flemish adalah ketika kita mendominasi Kadipaten Burgundia. Jika kita ingin mengembalikan prestise global kita, kita harus menjunjung tinggi tradisi bela diri dan keuangan nenek moyang kita. Langkah pertama untuk mencapai hal ini tentu saja adalah merebut kembali wilayah-wilayah tersebut."
BEL_burgundy_tt: "§Y[BEL.GetName]§! akan dikenal sebagai §YBurgundy§!"
BEL_join_axis: "Bergabunglah dengan Axis"
BEL_join_axis_desc: "Kita sudah terlalu lama terisolasi, inilah saatnya kita bergabung dengan saudara-saudara Jerman kita dan menjalin aliansi di antara kita untuk melindungi dan memperluas ambisi bersama."
BEL_strength_and_brotherhood: "Kekuatan dan Persaudaraan"
BEL_strength_and_brotherhood_desc: "Kami akan mencari mereka yang memiliki cita-cita kekuatan dan persaudaraan yang selaras dengan cita-cita kami, dan seperti singa yang membentuk kebanggaan kami sendiri. Dengan cara ini, kita dapat meneruskan hal-hal yang menjadikan kita kuat, dan mencabik-cabik orang-orang yang lebih lemah pikiran dan jiwanya bagaikan mangsanya."
BEL_demand_further_gallic_concessions: "Menuntut Konsesi Galia Lebih Lanjut"
BEL_demand_further_gallic_concessions_desc: "Sudah saatnya kita membuang jubah intrik dan membiarkan niat kita yang sebenarnya terpancar. Perpecahan di antara kita tidak pernah menjadi rahasia, tapi kita harus menunjukkan superioritas kita untuk selamanya. Inilah waktunya untuk meraih takdir kita, apa pun yang terjadi."
BEL_demand_further_gallic_concessions_tt: "Membuka keputusan untuk §YMendapatkan Inti pada Klaim Galia§! setelah kami mengendalikannya."
BEL_belgica: "Belgia"
BEL_belgica_desc: "Belgica adalah salah satu wilayah paling utara Kekaisaran Romawi, dinamakan demikian karena kelompok masyarakat paling berpengaruh yang tinggal di wilayah tersebut. Jelasnya, jika bangsa Romawi mampu mengenali kekuatan rakyat Belgia, maka sudah sepantasnya kita mengambil contoh dari mereka dan mengambil tindakan lebih jauh dari apa yang pernah diimpikan oleh bangsa Romawi."
BEL_belgica_tt: "§Y[BEL.GetName]§! akan dikenal sebagai §YBelgica§!"
BEL_constitutional_crisis: "Krisis Konstitusi"
BEL_constitutional_crisis_desc: "Hubert Pierlot, seorang kritikus Fasisme yang blak-blakan dan Leon Degrelle secara vokal menentang keputusan Raja untuk mengangkat Fasisme sebagai Perdana Menteri. Dia telah menggalang dukungan di Parlemen dan memaksakan rancangan undang-undang darurat yang menyatakan raja untuk sementara tidak dapat memerintah dan dengan demikian menyatakan penunjukan tersebut batal sebelum mendapatkan persetujuan kerajaan."
BEL_kings_abdication: "Pengunduran Diri Raja"
BEL_kings_abdication_desc: "Menyusul rusaknya hubungan antara parlemen dan raja di depan umum, tekanan diberikan kepada Raja Leopold untuk turun tahta. Harapannya dia bisa pergi dengan damai."
BEL_kings_abdication_tt: "§GDengan kepergian Raja Leopold, Belgia akan jauh lebih tangguh terhadap invasi.§!"
BEL_snap_election: "Jepret Pemilu"
BEL_snap_election_desc: "Dengan teratasinya Krisis Konstitusi saat ini, sudah waktunya untuk memastikan pemerintah sekali lagi mempunyai legitimasinya, jika tidak, maka tidak akan ada bedanya dengan legitimasi yang baru saja digulingkan. Saat ini Paul-Henri Spaak dari Partai Sosialis dan Hubert Pierlot dari Partai Katolik adalah pelopornya."
BEL_auto_complete_snap_election_tt: "Fokus ini dilengkapi secara otomatis berdasarkan hasil acara §YSnap Election§!."
BEL_liberal_victory: "Kemenangan Liberal"
BEL_liberal_victory_desc: "Partai Katolik yang liberal secara ekonomi mengambil posisi teratas dalam pemilu baru-baru ini, dan Hubert Pierlot akan memimpin [BEL.GetName] berjanji untuk membela partai tersebut dan rakyat Belgia sampai akhir."
BEL_socialist_victory: "Kemenangan Sosialis"
BEL_socialist_victory_desc: "Paul-Henri Spaak memimpin Partai Buruh meraih kemenangan dalam pemilu sela, dan berjanji akan melakukan segala daya untuk menjaga integritas perbatasan Belgia, terlepas dari apakah mereka bersekutu dengan Komunis atau Demokrat untuk melakukan hal tersebut."
BEL_expression_of_belgian_unity: "Ekspresi Persatuan Belgia"
BEL_expression_of_belgian_unity_desc: "Budaya yang membentuk identitas [BEL.GetAdjective] adalah kekuatan terbesar kita, karena dari cita-cita, sudut pandang, dan bahkan bahasa yang berbeda kita dapat menemukan pemahaman yang sebenarnya. Yang memisahkan kita, itulah yang mempersatukan kita."
BEL_anti_corruption_taskforce: "Satgas Pemberantasan Korupsi"
BEL_anti_corruption_taskforce_desc: "Korupsi sudah terlalu lama merajalela di negara ini, setelah kita berhasil melepaskan diri dari kebusukan yang ada di kalangan atas, kini saatnya kita memberantas korupsi lainnya. Kami akan memerintahkan satuan tugas investigasi khusus dengan kewenangan luas untuk mengungkap, dan mengusir mereka yang telah memperkaya diri mereka sendiri dengan mengorbankan pembayar pajak."
BEL_diplomatic_rapprochment: "Pemulihan Hubungan Diplomatik"
BEL_diplomatic_rapprochment_desc: "Ekspresi netralitas kami diperlukan dalam realitas politik dan diplomatik pada saat itu, namun hal ini kini telah berubah. Kami tidak pernah berhenti berbicara dengan teman-teman kami di negara lain, namun kami sekarang harus lebih terbuka dan terbuka mengenai hal ini."
BEL_belgian_maginot: "Maginot Belgia"
BEL_belgian_maginot_desc: "Belgia adalah negara penyangga antara dua negara militer yang perkasa dan sepanjang sejarahnya telah terancam oleh keduanya. Dengan demikian, kita telah menjadi ahli dalam peperangan defensif. Garis Maginot Prancis mencapai perbatasan kita, dan kita perlu memperpanjangnya untuk mempertahankan negara kita sendiri. Jika kita menjadikan diri kita tak terkalahkan, kita bahkan tidak akan pernah diserang."
BEL_belgian_maginot_available_tt: "Menguasai dan dapat membangun sekurang-kurangnya §Y3 Benteng Darat§! di suatu provinsi di §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! atau §Y[977.GetName]§! di Perbatasan §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§!"
BEL_belgian_maginot_bypass_tt: "Apakah §RNOT§! menguasai atau tidak dapat membangun setidaknya §Y3 Benteng Darat§! di suatu provinsi di §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! atau §Y[977.GetName]§! di §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Perbatasan"
BEL_belgian_maginot_tt: "Tambahkan §YLand Forts§! di sepanjang §Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Perbatasan"
BEL_soviet_guarantee: "Jaminan Soviet"
BEL_soviet_guarantee_desc: "Meskipun kita cenderung lebih demokratis, kita telah menganut cara sosialis, dan kita mempunyai banyak hal untuk ditawarkan [SOV.GetNameDef]. Selama kita menyampaikan kata-kata hampa yang benar, dan mematuhi tawaran diplomatik mereka yang luas, maka kita mungkin bisa berteman dengan Beruang Rusia."
BEL_soviet_guarantee_tt: "Mereka akan lebih mungkin untuk §Gmenerima§! jika kita telah menyelesaikan §Y$BEL_raise_the_red_flag$§!."
BEL_expedite_fort_construction: "Mempercepat Pembangunan Benteng"
BEL_expedite_fort_construction_desc: "Ini adalah dunia yang berbahaya, dilanda kekuatan musuh. Kita perlu memastikan bahwa kita siap, dan berinvestasi lebih besar di sektor perbentengan dan teknik sehingga kita mempunyai persiapan yang matang, sebelum hal-hal tersebut diperlukan."
BEL_democratization_of_education: "Demokratisasi Pendidikan"
BEL_democratization_of_education_desc: "Masyarakat kita memiliki tradisi kepedulian terhadap satu sama lain, yang paling baik diwujudkan dalam kontrak sosial antara pekerja dan perusahaan. Demikian pula, negara harus berupaya memberikan kesempatan yang sama kepada setiap orang dan menekankan pentingnya pendidikan yang baik."
BEL_invite_soviet_tank_makers: "Undang [SOV.GetAdjective] Pengembang Tangki"
BEL_invite_soviet_tank_makers_desc: "Sebelumnya kami selalu mengandalkan sekutu kami untuk unit lapis baja, dan meskipun teman kami telah mengubah kebijakan ini, kebijakan ini tidak berubah. Berkat hubungan persahabatan kami dengan Uni Soviet, kami mungkin bisa meyakinkan mereka untuk mendukung kami dengan beberapa wawasan."
BEL_join_allies: "Bergabunglah dengan Sekutu"
BEL_join_allies_desc: "Perang Besar membuat kita berdiri bersama sebagai sekutu sebelumnya, dan bersama-sama kita bertahan dalam ujian invasi. Bersama-sama kita akan berdiri kembali, melawan siapa pun yang ingin menyakiti kita."
BEL_unity_makes_strength: "Persatuan Menghasilkan Kekuatan"
BEL_unity_makes_strength_desc: "Awalnya semboyan Republik Belanda, ketika memerintah Belanda dan Belgia. Hal ini secara resmi dianut oleh negara Belgia setelah Revolusi pada tahun 1830 yang menyebabkan kemerdekaan kita. Hal ini benar-benar diabadikan oleh kesatuan kaum progresif liberal dan konservatif Katolik yang berdiri di pusat politik Belgia, dan telah mewujudkan cita-cita Belgia sejak saat itu."
BEL_join_comintern: "Bergabunglah dengan Komintern"
BEL_join_comintern_desc: "Komintern mempunyai sejarah dalam membantu mereka yang mendukung paham sosialis, dan ketika kita berada di pihak yang dikepung oleh mereka yang ingin menghambat pembebasan pekerja kita, kita harus melihat ke timur untuk mencari teman baru."
BEL_better_than_maginot: "Lebih Baik Dari Maginot"
BEL_better_than_maginot_desc: "Benteng kita harus berkembang dari yang terdepan di dunia hingga yang mengalahkan dunia. Kita tidak pernah tahu serangan selanjutnya akan datang dari mana, jadi kita harus bersiap menghadapi apapun. Kita harus membangun parit yang didukung oleh parit, bunker demi bunker, dan yang paling penting. Kami membutuhkan lebih banyak senjata. Lebih banyak senjata. Yang besar."
BEL_vandervelde_minority: "Minoritas Vandervelde"
BEL_vandervelde_minority_desc: "Émile Vandervelde meraih kemenangan dalam pemilu, namun Partai Buruhnya hanya mampu menang melalui minoritas. Setelah perundingan koalisi gagal, ia memilih untuk melakukannya sendiri, meskipun jalan politik ke depan akan sulit."
BEL_problem_of_language: "Masalah Bahasa"
BEL_problem_of_language_desc: "Belgia sudah terlalu lama terpecah belah karena bahasa, dan jika Partai Buruh mempunyai harapan untuk menyatukan bangsa di belakang pemerintahan mereka, maka solusi yang tepat adalah dengan memperjelas pendirian mereka mengenai keunggulan bahasa – atau bahkan memimpin upaya menuju bilingualisme resmi seperti yang dipraktikkan di Brussel."
BEL_trade_union_support: "Dukungan Serikat Pekerja"
BEL_trade_union_support_desc: "Sekutu alami kami dalam perjuangan politik adalah serikat pekerja, namun sejauh ini dukungan mereka terhadap gerakan kami masih suam-suam kuku. Kita bisa memperkuat janji-janji kita kepada mereka, dan pada gilirannya mereka akan menggalang keanggotaan mereka demi kepentingan kita."
BEL_cooperative_cooperation: "Kerja Sama Koperasi"
BEL_cooperative_cooperation_desc: "Koperasi telah menjadi bagian dari masyarakat Belgia selama beberapa waktu, dan model bisnis mereka sangat sesuai dengan cita-cita ekonomi yang kami anut. Kita harus bekerja sama dengan mereka yang sudah mapan, dan menggunakan keahlian mereka untuk melatih generasi baru bisnis yang sadar sosial."
BEL_aid_for_spain: "Bantuan Untuk Spanyol"
BEL_aid_for_spain_desc: "Partai Republik Spanyol memperjuangkan cita-cita demokrasi mereka melawan kaum fasis dan radikal anarkis yang berbahaya. Kita harus secara diam-diam menawarkan dukungan kepada mereka dalam perjuangan mereka, namun tetap berhati-hati dalam menjaga kesan netralitas kita."
BEL_the_grand_place: "Tempat Agung"
BEL_the_grand_place_desc: "Alun-alun besar di pusat kota Brussel telah lama menjadi pusat pemikiran sosialis. Yang paling terkenal adalah Karl Marx yang menulis Manifesto Komunis di sini, kemudian menjadi tuan rumah Kongres Internasional Pertama ke-3, dan akhirnya menjadi lokasi berdirinya partai sosialis pertama, Partai Pekerja Belgia."
BEL_la_belgique_et_le_congo: "La Belgique dan le Kongo"
BEL_la_belgique_et_le_congo_desc: "Peran Belgia di Kongo telah lama berupa eksploitasi dan penganiayaan, padahal seharusnya peran tersebut mempromosikan kesetaraan dan peluang. Dengan penekanan baru dalam negeri kita pada cita-cita sosialis, inilah saat yang tepat bagi kita untuk mulai mendidik saudara-saudara kolonial kita mengenai filosofi ini, dan mulai berinvestasi untuk masa depan sosialis mereka."
BEL_spanish_intervention: "Intervensi Spanyol"
BEL_spanish_intervention_desc: "Situasi Partai Republik di Spanyol sedang lemah, dan jelas bahwa agar demokrasi bisa menang, mereka yang memegang teguh demokrasi harus meningkatkan dukungan mereka terhadap mereka yang memperjuangkannya."
BEL_spanish_intervention_tt: "Membuka keputusan untuk §Y$BEL_intervention_in_spain_cat$§!.\n\nKami akan dapat mengirim peralatan, mendorong emigrasi untuk membantu upaya mereka, dan mendukung mereka secara politik."
BEL_contradictions_in_socialism: "Kontradiksi dalam Sosialisme"
BEL_contradictions_in_socialism_desc: "Keberhasilan kami baru-baru ini dalam memperluas cita-cita sosialis di Kongo jelas membuahkan hasil, karena masyarakat di sana menjadi lebih sejahtera dibandingkan sebelumnya. Oleh karena itu, sangat jelas bagi kami bahwa kami harus memperluas \"Misi Sosialisasi\" ini ke seluruh Afrika!"
BEL_contradictions_in_socialism_tt: "Keuntungan §YAmbil Negara yang Diklaim§! Tujuan perang terhadap negara-negara yang saat ini memegang klaim diperoleh dari fokus ini."
BEL_growing_threat_of_fascism: "Meningkatnya Ancaman Fasisme"
BEL_growing_threat_of_fascism_desc: "Meningkatnya dukungan fasis radikal di seluruh Eropa, dan bahkan di dunia, telah menjadi tren yang sangat memprihatinkan, dan kita harus bersiap melakukan apa yang harus kita lakukan untuk mencegah penyebarannya. Sekalipun tindakan tersebut harus bersifat preemptive."
BEL_peacekeeping_missions: "Misi Penjaga Perdamaian"
BEL_peacekeeping_missions_desc: "Konflik yang sedang berlangsung di seluruh dunia terus menimbulkan kekhawatiran bagi kita, namun, untuk menjaga netralitas, kita hanya dapat mengirim pasukan ke luar negeri dalam misi pemeliharaan perdamaian yang disetujui."
BEL_international_socialist_bureau: "Biro Sosialis Internasional"
BEL_international_socialist_bureau_desc: "Internasional Kedua memiliki sekretariat permanen yang ditempatkan di Brussel, dan meskipun organisasi tersebut dibubarkan pada tahun 1916, perjuangan sosialis terus berlanjut. Sekarang setelah kita mendapatkan kembali pijakan kita di kancah internasional, kita harus membangun kembali institusi tersebut dan mengambil kembali peran kepemimpinan dalam Sosialis Internasional."
BEL_raise_the_red_flag: "Kibarkan Bendera Merah"
BEL_raise_the_red_flag_desc: "Sampai saat ini, sebagian besar upaya kami sejalan dengan cita-cita sosialis yang lebih moderat, namun, untuk lebih menyelaraskan diri dengan blok Soviet, kami mungkin perlu meningkatkan dukungan kami terhadap partai Komunis. Langkah pertama menuju hal ini adalah dengan mendukung \"Le Drapeau Rouge\" (Bendera Merah), Surat Kabar Komunis di Belgia."
BEL_raise_the_red_flag_tt: "Membuka kunci keputusan ke §Y$BEL_rekindle_the_red_flame_cat$§! dan mengubah [BEL.GetNameDef] §YKomunis§!."
BEL_support_the_european_project: "Mendukung Proyek Eropa"
BEL_support_the_european_project_desc: "Di dunia yang didominasi oleh perang dan konflik, menjadi sangat jelas bagi kita bahwa netralitas bukanlah jaminan perdamaian. Oleh karena itu, kita harus menjangkau negara-negara Eropa lainnya dan membentuk sebuah badan yang didedikasikan untuk keamanan bersama dan stabilitas ekonomi, sehingga kita bisa mencapai kesejahteraan bersama."
BEL_european_community: "Komunitas Eropa"
BEL_european_community_desc: "Masa-masa awal Proyek Eropa telah berjalan dengan baik, jadi kita harus mempertimbangkan perluasan keanggotaan kita dan ratifikasi serangkaian perjanjian yang mengatur masa depan komunitas kita. Kita bahkan dapat mempertimbangkan untuk beralih ke model yang lebih federal, dengan Belgia mengambil peran utama."
BEL_european_community_tt: "Membuka keputusan untuk mengejar §Y$BEL_closer_european_union_cat$§!"
BEL_the_king_surrenders: "Raja Menyerah"
BEL_the_king_surrenders_desc: "Secara mengejutkan, Raja Leopold III telah menggunakan kekuasaannya sebagai Panglima Tertinggi untuk menawarkan penyerahan tanpa syarat seluruh unit militer Belgia kepada musuh. Tampaknya hal ini dilakukan untuk menyelamatkan sebanyak mungkin nyawa, namun ada pula yang mengatakan bahwa hal ini memiliki motivasi yang lebih gelap."
BEL_unfit_to_reign: "Tidak Layak untuk Memerintah"
BEL_unfit_to_reign_desc: "Mengingat penyerahan tanpa syarat yang ditawarkan oleh Raja Leopold III tanpa persetujuan parlemen, pemerintah sipil telah menyatakan dia tidak layak untuk memerintah, dan berjanji untuk melanjutkan perang dari luar negeri."
BEL_prisoner_king: "Raja Tahanan"
BEL_prisoner_king_desc: "Raja Leopold III, yang ingin menjalani hukumannya bersama rakyatnya, memilih untuk tetap berada di [BEL.GetNameDef] sebagai tawanan. Kini dijuluki 'Raja Tahanan', rakyatnya menyambut tindakan ini dengan persetujuan dan mulai mendukung teladannya di masa-masa sulit ini."
BEL_government_in_exile: "Pemerintahan di Pengasingan"
BEL_government_in_exile_desc: "Elit politik [BEL.GetAdjective] yang masih hidup kini telah tiba di ibu kota tuan rumah mereka, di antaranya sejumlah menteri penting termasuk, Hubert Pierlot, Paul-Henri Spaak, Camille Gutt dan Albert van Vleeshauwer. Bersama-sama, mereka membentuk \"Pemerintahan Empat\", dan bersumpah untuk memastikan perang ini berakhir dengan kemenangan."
BEL_la_dame_blanche: "La Dame Blanche"
BEL_la_dame_blanche_desc: "Dame Blanche, atau The White Lady adalah organisasi perlawanan bawah tanah selama Perang Besar. Walthère Dewé, pemimpin gerakan pada waktu itu diam-diam mempersiapkan Belgia untuk diduduki lagi, dan sekarang saatnya kita mengeluarkan kemampuan organisasi ini untuk kedua kalinya."
BEL_government_in_exile_tt: "Membuka §Y$BEL_government_in_exile_cat$§! untuk memungkinkan penguatan legitimasi dan perlawanan [ROOT.GetName]."
BEL_moi_dabord: "Aku akan membatalkannya"
BEL_moi_dabord_desc: "Aku batalkan! Aku duluan! Teriakan Spaak yang terkenal ketika duta besar musuh datang dengan deklarasi perang. Karena sangat marah dengan pecahnya permusuhan, Spaak ingin agar serangan mendadak itu dicatat dalam catatan internasional sebelum deklarasi perang dapat disampaikan. Hal ini kemudian menjadi seruan para pendukung pemerintah di pengasingan."
BEL_v_for_victory: "V Untuk Kemenangan"
BEL_v_for_victory_desc: "Kemenangan! Sangat bagus! Dua kata, kemenangan dan kebebasan, ditemukan di antara bahasa-bahasa Belgia dan diidentifikasi dengan huruf yang sama. Jari telunjuk dan jari tengah yang terangkat telah menjadi simbol perlawanan dan tekad di antara masyarakat Belgia sebelum menyebar ke luar negeri, dan bahkan diadopsi oleh para pemimpin nasional yang juga melakukan perlawanan serupa."
BEL_democratic_homecoming: "Mudik Demokrat"
BEL_democratic_homecoming_desc: "Bukan keluarga kerajaan yang memenangkan kembali tanah air kita, namun institusi demokrasi dan proses membesarkan warga negara kita yang paling mampu untuk memimpin kita. Kita harus mengakui kontribusi berharga mereka pada saat ini, dan mengabadikan keberhasilan mereka untuk generasi mendatang."
BEL_charles_count_of_flanders: "Charles, Pangeran Flanders"
BEL_charles_count_of_flanders_desc: "Jelas bahwa Leopold tidak dapat dipercaya untuk kembali naik takhta, karena ia melepaskan tanggung jawabnya segera setelah ia menyerahkan negaranya. Syukurlah dia memiliki adik laki-laki, Pangeran Charles, Pangeran Flanders, yang akan menjadi bupati yang hebat sampai kita dapat memutuskan apa yang harus dilakukan terhadap 'raja' tersebut."
BEL_leopolds_return: "Kembalinya Leopold"
BEL_leopolds_return_desc: "Raja Leopold III adalah penguasa sah [BEL.GetNameDef], dan dia harus melanjutkan tahtanya sekarang setelah Belgia dikembalikan kepada kita."
BEL_secretaries_general: "Sekretaris Jenderal"
BEL_secretaries_general_desc: "Meskipun kami akan melakukan semua yang kami bisa untuk membela negara kami, kami harus realistis ketika melihat negara-negara tetangga kami yang jauh lebih besar, dan mengambil keputusan sulit untuk membuat undang-undang jika kami menyerah. Oleh karena itu, kami telah membentuk Sekretaris Jenderal, mereka adalah pegawai negeri yang secara hukum diizinkan untuk bekerja sama dengan penjajah mana pun, dan memastikan bahwa pemerintah daerah dapat melanjutkannya."
BEL_the_secret_army: "Tentara Rahasia"
BEL_the_secret_army_desc: "Kini setelah negara kita diduduki, kita perlu memulai tugas membangun perlawanan untuk melakukan tindakan sabotase dan gangguan. Tentara Rahasia adalah saluran kita untuk mewujudkan hal ini, didirikan oleh sejumlah perwira dari tentara kita yang kalah, mereka memiliki keterampilan organisasi dan logistik yang diperlukan untuk menggerakkan hal ini. Yang perlu kita lakukan hanyalah memberi perintah."
BEL_the_belgian_legion: "Legiun Belgia"
BEL_the_belgian_legion_desc: "Legiun Belgia adalah kumpulan loyalis konservatif dan royalis, siap dan bersemangat mengangkat senjata atas nama raja mereka. Kita harus menyelundupkan siapa pun yang kita bisa keluar dari negara ini, dan memanfaatkannya dengan baik."
BEL_develop_home_support: "Kembangkan Dukungan Rumah"
BEL_develop_home_support_desc: "Meskipun sebagian besar upaya perang dikoordinasikan dari tempat kami di pengasingan, kami masih mendapat dukungan luas di dalam negeri. Hal ini terutama berkat kerja Sekretaris Jenderal, yang telah terbukti mampu mengorganisir upaya-upaya sipil tanpa terlalu memusuhi penjajah."
BEL_military_service_for_all_in_exile: "Dinas Militer Untuk Semua Orang di Pengasingan"
BEL_military_service_for_all_in_exile_desc: "Ada banyak sekali [BEL.GetAdjective] yang tinggal di seluruh dunia. Kita harus memutuskan bahwa mereka semua harus segera digunakan demi tujuan pembebasan tanah air kita. Semangat patriotik sangat tinggi, dan kita bisa mengharapkan banyak dukungan."
BEL_consolidate_resistance_groups: "Konsolidasikan Kelompok Perlawanan"
BEL_consolidate_resistance_groups_desc: "Ada banyak sekali organisasi perlawanan di [BEL.GetNameDef], semuanya bersemangat untuk mendukung pembebasan kami namun terpecah oleh banyak ideologi, opini, cita-cita, kelompok kepentingan, dan pendukung yang berbeda. Sebagai pemerintah di pengasingan, kita mempunyai wewenang untuk memberikan inisiatif pengorganisasian pusat untuk membawa mereka semua menuju tujuan kita bersama."
BEL_free_belgian_forces: "Pasukan Belgia Bebas"
BEL_free_belgian_forces_desc: "Kehadiran kami di luar negeri kini sudah cukup berkembang sehingga kami dapat memulai aksi militer yang tepat terhadap penjajah kami. Meskipun pertempuran tersebut mungkin tidak langsung terjadi di Belgia, setidaknya kita dapat memberikan perlawanan kepada musuh-musuh kita pada akhirnya, dan memberikan kontribusi lebih langsung terhadap upaya perang dengan darah dan baja [BEL.GetAdjective]."
BEL_free_belgian_forces_tt: "2 §YDivisi d'Infanterie§! akan muncul secara acak di tanah air tuan rumah pengasingan."
BEL_king_law_freedom: "Raja, Hukum, Kebebasan"
BEL_king_law_freedom_desc: "Orang Belgia yang baik berjuang demi Raja, Hukum, dan Kebebasan. Kita harus mencatat bahwa raja berada di atas segalanya, begitu pula Leopold III sebagai raja kita. Sebab hukum-Nyalah yang kita junjung tinggi, dan kebebasan-Nyalah yang kita perjuangkan."
BEL_king_of_the_belgians: "Raja Belgia"
BEL_king_of_the_belgians_desc: "'Saya bersumpah untuk mematuhi Konstitusi dan hukum rakyat Belgia, untuk menjaga kemerdekaan nasional dan integritas wilayah' ini adalah kata-kata yang digunakan seseorang untuk menjadi raja, diucapkan dalam tiga bahasa, Perancis, Belanda dan Jerman."
BEL_rally_to_the_king: "Berkumpul ke Raja"
BEL_rally_to_the_king_desc: "Raja telah menjadi lebih dari sekedar tawanan, ia telah menjadi simbol perjuangan bangsa kita. Kami yakin bahwa dengan kepemimpinan, keterampilan, kecerdasan dan tekadnya, kita akan melewati hari-hari kelam ini, dan menjadi bangsa yang lebih kuat dan sejahtera."
BEL_van_overstraeten_on_the_home_front: "Van Overstraeten di Front Depan"
BEL_van_overstraeten_on_the_home_front_desc: "Sejauh ini yang paling cerdas dari semua personel militer, kelemahannya adalah dia mengetahuinya. Van Overstraeten telah dengan cakap menjabat sebagai penasihat militer Raja sebelum pecahnya perang, dan meskipun karakternya membuat bekerja dengannya menjadi sebuah tantangan, keadaan kita sedemikian rupa sehingga kita harus memintanya untuk mengambil alih, dan memimpin bangsa kita menuju kemenangan."
BEL_expand_the_belgian_legion: "Perluas Legiun Belgia"
BEL_expand_the_belgian_legion_desc: "Semakin banyak orang berduyun-duyun ke panji raja, siap memberikan segalanya untuk melayani mahkota. Kita hanya perlu memberi tahu, dan mereka akan bergerak sesuai permintaan kita."
BEL_expand_the_belgian_legion_tt: "3 §YDivision d'Infanterie§! akan muncul secara acak di tanah air tuan rumah pengasingan."
BEL_the_price_to_pay: "Harga yang Harus Dibayar"
BEL_the_price_to_pay_desc: "Raja telah berdiskusi dengan penjajah kami selama beberapa waktu sekarang, dan karakternya telah memungkinkan dia untuk mendapatkan kepercayaan mereka. Oleh karena itu, ada kemungkinan bahwa kita bisa mendapatkan kembali tanah yang hilang di Belgia. Harga yang mereka minta sebagai imbalannya sederhana. Berlutut."
BEL_monetary_reconstruction: "Rekonstruksi Moneter"
BEL_monetary_reconstruction_desc: "Setelah Perang Dunia Pertama, perekonomian Belgia terpuruk. Dalam upaya memfasilitasi rekonstruksi dan melunasi utangnya yang sangat besar, Kementerian Keuangan Belgia mulai mencetak uang. Banyak uang. Meskipun hal ini membantu pada saat itu, kita berisiko mengalami hiperinflasi, dan kita harus mengendalikannya sebelum reformasi lainnya dapat dilakukan."
BEL_rebuild_wallonian_industry: "Membangun Kembali Industri Wallonia"
BEL_rebuild_wallonian_industry_desc: "Wallonia adalah daerah yang paling terkena dampaknya selama pendudukan Jerman pada Perang Dunia Pertama, dengan sebagian besar industri dan sumber dayanya dijarah oleh penjajah. Rekonstruksi telah berjalan dengan cepat, namun hal ini memerlukan investasi yang lebih besar untuk mencapai potensi sebenarnya sebagai pusat industri [ROOT.GetAdjective]."
BEL_gold_reserves: "Cadangan Emas"
BEL_gold_reserves_desc: "Untungnya negara bagian [ROOT.GetAdjective] memiliki cadangan emas yang cukup besar. Saat ini, hal ini memberi kita landasan yang stabil untuk melakukan peminjaman dan peminjaman di negara kita, meskipun kita juga dapat memilih untuk menjual emas kita untuk sementara waktu meningkatkan pembangunan dan konstruksi."
BEL_social_partners: "Mitra Sosial"
BEL_social_partners_desc: "Pemerintah kami menyelenggarakan Konferensi Perburuhan Nasional untuk mempertemukan perwakilan serikat pekerja dan perusahaan. Dampaknya adalah diberlakukannya upah minimum dan enam hari libur berbayar per tahun."
BEL_revive_coal_mining: "Menghidupkan Kembali Penambangan Batubara"
BEL_revive_coal_mining_desc: "Landasan industri Wallonia adalah baja, dan untuk menghasilkan bahan penting ini dengan lebih baik, kami perlu memperluas tambang batu bara kami secara agresif di wilayah tersebut."
BEL_40_hour_workweek: "40 Jam Kerja Seminggu"
BEL_40_hour_workweek_desc: "Hasil lain dari Konferensi Perburuhan Nasional adalah penerapan radikal jam kerja 40 jam seminggu. Meskipun awalnya skeptis, kami telah melihat peningkatan produktivitas dan kebahagiaan pekerja."
BEL_cockerill: "Ayam jantan"
BEL_cockerill_desc: "Cockerill adalah produsen baja terkemuka di [ROOT.GetNameDef], dengan pabrik besar yang mampu memproduksi apa saja mulai dari mesin hingga artileri. Dengan meningkatnya permintaan untuk semua produk tersebut, kami berada dalam posisi yang tepat untuk memperluas ekspansi lebih lanjut."
BEL_cockerill_tt: "§GMengurangi§! biaya penugasan §Y$BEL_cockerill_industrial$§! sebagai Perusahaan Industri"
BEL_railway_expansion: "Perluasan Kereta Api"
BEL_railway_expansion_desc: "Arteri yang memberi makan [ROOT.GetAdjective] perdagangan dan industri adalah jalur kereta api. Ketika perekonomian kita pulih dan pulih, kita harus memastikan bahwa infrastruktur yang kita miliki dapat mengimbanginya."
BEL_corporate_social_responsibility: "Tanggung Jawab Sosial Perusahaan"
BEL_corporate_social_responsibility_desc: "Meskipun terjadi industrialisasi dan urbanisasi yang signifikan pada [ROOT.GetNameDef], yang mengejutkan adalah serikat pekerja tidak pernah memegang kekuasaan sebesar yang diharapkan. Hal ini karena terdapat tradisi budaya bagi perusahaan untuk mempunyai tanggung jawab sosial terhadap pekerjanya – meskipun tidak ada salahnya untuk mengingatkan mereka akan hal ini dari waktu ke waktu."
BEL_val_benoit_institutes: "Institut Val-Benoît"
BEL_val_benoit_institutes_desc: "Kita harus mendirikan Institut Val-Benoît di Universitas Liege, mendirikan beberapa departemen ilmiah baru di reruntuhan Biara Val-Benoît yang lama."
BEL_stk: "Menetapkan STK"
BEL_stk_desc: "Kami bertujuan untuk mendirikan Studiecentrum voor de Toepassingen van de Kernenergie (Pusat Penelitian Penerapan Energi Nuklir), atau STK, sebagai badan yang berdedikasi untuk menyelidiki kemungkinan ilmiah di balik energi atom."
BEL_embrace_export_economy: "Merangkul Ekonomi Ekspor"
BEL_embrace_export_economy_desc: "Meskipun tidak pernah setenar tetangga kami di utara, [ROOT.GetNameDef] memiliki tradisi perdagangan yang membanggakan yang berpusat di kota Antwerp. Mari kita manfaatkan lebih banyak potensi keuntungan ini – lagipula, ini bisnis yang bagus."
BEL_engine_of_the_economy: "Mesin Perekonomian"
BEL_engine_of_the_economy_desc: "Kereta api memiliki tempat khusus di jantung [ROOT.GetAdjective], kereta api mendorong inovasi baru, menjaga produksi tetap pada jalurnya, dan menjadi bahan bakar untuk pertumbuhan lebih lanjut. Namun yang terpenting, mereka adalah mesin perekonomian."
BEL_belgian_miracle: "Keajaiban Belgia"
BEL_belgian_miracle_desc: "Sulit membayangkan bahwa dua dekade lalu, Belgia berada dalam reruntuhan, yang dianggap oleh banyak orang hanya sebagai medan perang Eropa. Bandingkan dengan keadaan kita saat ini, yang merupakan mercusuar produktivitas dan inovasi. Hal ini berkat keberanian prajurit kami, kegigihan pekerja kami dan kesetiaan sekutu dan teman kami."
BEL_belgian_air_force: "[ROOT.GetAdjective] Angkatan Udara"
BEL_belgian_air_force_desc: "[ROOT.GetNameDef] adalah pengguna awal kekuatan udara, mengembangkan kekuatan selama perang terakhir yang memberikan kesan baik pada diri mereka sendiri. Sayangnya, keterbatasan anggaran telah menghambat inovasi sejak saat itu. Ketika ketegangan meningkat, kita harus memastikan bahwa pertahanan udara kita tetap kuat."
BEL_develop_belgian_air_industry: "Mengembangkan Industri Udara Belgia"
BEL_develop_belgian_air_industry_desc: "Kami tidak memiliki banyak pengalaman dalam mengembangkan pesawat kami sendiri, sayangnya industri pesawat terbang masih kurang berkembang sejak perang terakhir. Ada sejumlah desainer muda dan perusahaan rintisan yang sangat inovatif yang dapat kita subsidi dan kembangkan."
BEL_renard_constructions_aeronautiques: "Konstruksi Renard Aéronautiques"
BEL_renard_constructions_aeronautiques_desc: "Salah satu desainer paling menjanjikan akhir-akhir ini adalah Alfred Renard, dia memiliki beberapa desain yang sangat inovatif, dan kita harus mendukung upaya ini dan perusahaannya."
BEL_stampe_et_vertrongen: "Stampe dan Vertrongen"
BEL_stampe_et_vertrongen_desc: "Meskipun Stampe et Vertrongen berspesialisasi dalam pesawat latih, kita harus berinvestasi di perusahaan dalam negeri ini dan menyesuaikan desain mereka untuk tugas tambahan di garis depan."
BEL_relocate_air_production: "Relokasi Produksi Udara"
BEL_relocate_air_production_desc: "Manufaktur pesawat terbang memerlukan sejumlah besar komponen khusus, dan bergantung pada insinyur penerbangan yang sulit digantikan. Namun, setelah diproduksi, pesawat dapat digunakan di mana saja. Kita harus mengadakan kontrak dengan perusahaan asing untuk memproduksi pesawat kita di luar negeri sehingga jalur produksi kita terlindungi."
BEL_pressurized_cabin_development: "Pengembangan Kabin Bertekanan"
BEL_pressurized_cabin_development_desc: "Dalam upaya meningkatkan kualitas perjalanan udara antara Belgia dan Kongo, kami telah mengerjakan kabin bertekanan yang memungkinkan kami terbang jauh lebih tinggi dari biasanya. Mengadaptasi teknologi yang sama pada pesawat masa perang kita akan meningkatkan kemampuannya secara signifikan."
BEL_foreign_plane_purchases: "Pembelian Pesawat Asing"
BEL_foreign_plane_purchases_desc: "Sayangnya, karena keadaan industri penerbangan [ROOT.GetAdjective], kami terpaksa mencari pembelian pesawat ke luar negeri. Mari kita umumkan sebuah kontes, dan mintalah negara lain mengajukan tawaran untuk kontraknya."
BEL_aviation_school: "Sekolah Penerbangan"
BEL_aviation_school_desc: "Pilot kita memerlukan tempat untuk mempelajari keahlian mereka, dan kita harus mengembangkan fasilitas pelatihan yang sesuai."
BEL_polish_licences: "Lisensi Polandia"
BEL_polish_licences_desc: "[POL.GetNameDef] telah menghubungi kami untuk menyediakan beberapa desain pesawat mereka di bawah lisensi, dan desain tersebut dapat disediakan kepada kami dengan harga yang jauh di bawah harga pasar."
BEL_early_helicopters: "Helikopter Awal"
BEL_early_helicopters_desc: "Nicolas Florine memilih untuk pindah ke [ROOT.GetNameDef] setelah Perang Saudara Rusia, dan telah menunjukkan minat pada bentuk penerbangan baru yang radikal menggunakan rotor yang berputar cepat. Kita harus mendanai pengembangan ini, dan melihat ke mana bidang baru ilmu penerbangan ini akan membawa kita!"
BEL_air_doctrine: "Doktrin Udara"
BEL_air_doctrine_desc: "Peperangan modern terus berubah dan berkembang. Kita harus mendanai studi mengenai doktrin-doktrin yang saat ini digunakan oleh kekuatan militer lain, dan melihat pelajaran apa yang dapat diambil dan diterapkan pada angkatan udara kita sendiri."
BEL_legacy_of_the_belgian_airforce: "Warisan Angkatan Udara Belgia"
BEL_legacy_of_the_belgian_airforce_desc: "Pilot kami termasuk yang paling berani di antara mereka yang bertempur di medan perang Perang Besar, dan tradisi yang membanggakan ini masih dijunjung hingga saat ini."
BEL_re_establish_belgian_navy: "Bentuk Kembali Angkatan Laut Belgia"
BEL_re_establish_belgian_navy_desc: "Meskipun memenangkan beberapa kapal dari Jerman dalam perjanjian Versailles, setelah Perang Dunia Pertama, Belgia menghapuskan angkatan lautnya pada tahun 1927 karena keterbatasan anggaran. Dengan ancaman yang mengancam di luar negeri, dan kebutuhan kita untuk menjaga komunikasi dan perdagangan strategis, khususnya dengan Kongo, kita harus memastikan bahwa kita membangun kembali armada kita."
BEL_re_build_the_fleet: "Membangun kembali Armada"
BEL_re_build_the_fleet_desc: "Langkah pertama untuk memulihkan kekuatan angkatan laut kita adalah dengan membangun angkatan laut baru. Hal ini memerlukan investasi besar pada galangan kapal baru dan kemampuan pembuatan kapal."
BEL_allied_donations: "Sumbangan Sekutu"
BEL_allied_donations_desc: "Kebutuhan kita untuk meningkatkan kehadiran maritim kita kini semakin mendesak, sehingga kita harus menghubungi sekutu-sekutu kita dan melihat apakah mereka dapat memberi kita bantuan dalam mengembangkan kembali kemampuan angkatan laut kita."
BEL_port_of_antwerp: "Pelabuhan Antwerpen"
BEL_port_of_antwerp_desc: "Antwerp adalah kota yang terkenal dengan masa lalu perdagangannya, dan pelabuhan ini tetap menjadi pelabuhan yang penting hingga saat ini. Mari kita manfaatkan reputasi ini untuk memfasilitasi perjanjian perdagangan yang menguntungkan."
BEL_corvette_fleet: "Armada Korvet"
BEL_corvette_fleet_desc: "Pembangunan kapal membutuhkan waktu yang lama, apalagi untuk kapal bermodal besar. Sebaliknya, karena kebutuhan mendesak untuk memperluas angkatan laut kita, kita harus fokus pada kapal-kapal kecil yang mudah diproduksi, yang mengkhususkan diri pada hal yang paling kita butuhkan: melindungi kepentingan dagang kita."
BEL_boelwerf: "Boelwerf"
BEL_boelwerf_desc: "Boelwerf adalah salah satu galangan kapal terbesar di Antwerp, kita harus memanfaatkan kemampuan mereka dan berinvestasi lebih besar dalam perluasan dermaga mereka sehingga kita dapat memperkuat kekuatan angkatan laut kita dengan lebih mudah."
BEL_cockerill_shipyards: "Galangan Kapal Cockerill"
BEL_cockerill_shipyards_desc: "Cockerill Shipyards, anak perusahaan dari konglomerat Cockerill yang lebih besar, adalah jenis hubungan industri yang harus kita bangun. Kapal perang pada zaman ini dibuat dari baja, dan tidak ada yang melakukan pengerjaan baja lebih baik daripada Cockerill."
BEL_antwerp_maritime_academy: "Akademi Maritim Antwerpen"
BEL_antwerp_maritime_academy_desc: "Meskipun lebih didedikasikan untuk pelayaran sipil dan komersial, kami masih dapat memanfaatkan keahlian para guru di sini untuk melatih dan mengembangkan kehadiran angkatan laut kami di laut. Mereka akan sangat berguna dalam menunjukkan kepada petugas kami cara terbaik bekerja dengan pelayaran dagang yang membuat perdagangan kami tetap lancar."
BEL_naval_doctrine: "Doktrin Angkatan Laut"
BEL_naval_doctrine_desc: "Tidak banyak hal yang dapat diajarkan oleh pelatih sipil kepada kita, untuk benar-benar memperluas pemahaman kita tentang urusan angkatan laut, kita harus merekrut beberapa talenta asing dan dengan demikian meningkatkan pengetahuan dan kemampuan pelatihan kita."
BEL_convoy_protection_duties: "Kapal Pedagang yang Dilengkapi Pertahanan"
BEL_convoy_protection_duties_desc: "Pada saat terjadi bahaya dan kebutuhan yang besar, mempersenjatai kapal dagang dapat diterima, dan memberi mereka senjata serta perlengkapan laut untuk melindungi mereka sendiri. Dengan cara ini, mereka yang memburu pedagang kita, akan menemukan bahwa tiba-tiba mangsanya mempunyai gigi."
BEL_maritime_phoenix: "Phoenix Maritim"
BEL_maritime_phoenix_desc: "Dari ketiadaan, armada kami telah berkembang. Galangan kapal kita dipenuhi oleh api industri ketika kapal-kapal baru semakin meninggalkan landasan, dan kepentingan strategis kita di luar negeri dipenuhi oleh armada kita yang berbendera [ROOT.GetAdjective]."
