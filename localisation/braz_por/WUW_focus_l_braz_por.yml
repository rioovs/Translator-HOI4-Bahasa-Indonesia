 ### AUSTRO-HUNGARIAN JOINT FOCUS TREE ###
 HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt: "Apakah §Y[AUS.GetNameDef]§! atau §Y[HUN.GetNameDef]§! dan memiliki §YNegara Kontingen Austro-Hungaria§! sebagai subjeknya, merupakan subjek salah satunya, merupakan pemimpin faksi sebagai §Y[AUS.GetNameDef]§! atau §Y[HUN.GetNameDef]§!, atau berada dalam faksi dengan mereka sebagai §YNegara Kontingen Austria-Hongaria§!."
 HABSBURG_is_originator_country: "§Y[ROOT.GetName]§! adalah §YNegara Asal§!"
 HABSBURG_part_of_something_bigger: "Tak terpisahkan dan tak terpisahkan"
 HABSBURG_part_of_something_bigger_desc: "Semua orang tahu bahwa mereka harus mempertahankan rumah mereka sendiri, tapi federasi yang baru kita bentuk ini pasti akan jatuh jika mereka tidak menyadari pentingnya kerja sama lintas batas dan bantuan dalam melindungi apa yang juga sangat disayangi oleh tetangganya."
 HABSBURG_economic_cooperation_policy: "Kebijakan Kerja Sama Ekonomi"
 HABSBURG_economic_cooperation_policy_desc: "Saat ini anggota federasi kami sepenuhnya mengatur perekonomian mereka sendiri. Meskipun hal ini memberikan kebebasan sebanyak mungkin kepada setiap orang, hal ini juga menghambat kekuatan ekonomi federasi. Dengan menetapkan kebijakan kerja sama, kita dapat memastikan bahwa para anggota bertindak bersama dalam menghadapi masalah ekonomi yang lebih besar."
 HABSBURG_joint_consumer_goods_endeavors: "Bank Sentral Donau"
 HABSBURG_joint_consumer_goods_endeavors_desc: "Kemampuan ekonomi masing-masing negara bagian dalam federasi sangat bervariasi. Bank Sentral kita juga mempunyai kekuatan ekonomi yang berbeda-beda, dan meskipun setiap negara diperbolehkan untuk memiliki Bank Sentral mereka sendiri, membentuk Bank Sentral untuk federasi akan memastikan bahwa kita mempunyai lembaga yang terutama berkaitan dengan status ekonomi federasi secara keseluruhan."
 HABSBURG_technology_sharing: "Kerja Sama Ilmiah"
 HABSBURG_technology_sharing_desc: "Ada banyak orang cerdas di federasi kami. Kita harus menyatukan mereka untuk memajukan pembangunan di wilayah kita, dan memajukan federasi kita menuju masa depan yang layak."
 HABSBURG_increase_scientific_cooperation: "Membangun Fasilitas Penelitian Bersama"
 HABSBURG_increase_scientific_cooperation_desc: "Saatnya telah tiba untuk bersama-sama mendanai laboratorium baru dan fasilitas penelitian rahasia di mana para ilmuwan kita dapat bekerja sama lebih erat, meningkatkan laju penelitian mereka, dan membawa kita menuju cakrawala baru."
 HABSBURG_simplify_economic_lawmaking: "Menyederhanakan Pembuatan Undang-Undang Ekonomi"
 HABSBURG_simplify_economic_lawmaking_desc: "Anggota kami saat ini memiliki undang-undang yang sangat berbeda dalam hal perdagangan dan ekonomi. Meskipun tidak ada kebutuhan untuk mengontrol secara terpusat bahwa peraturan perundang-undangan sama di semua negara anggota, proses perubahan peraturan perundang-undangan secara dinamis sesuai dengan kebutuhan dalam situasi tersebut dapat memperoleh manfaat jika disederhanakan."
 HABSBURG_securing_the_consumer_rights: "Kemakmuran Untuk Rakyat"
 HABSBURG_securing_the_consumer_rights_desc: "Meskipun pendukung perang ada di mana-mana, kita harus ingat siapa yang mewujudkan federasi ini. Ini adalah masyarakatnya, dan kita harus memastikan bahwa mereka selalu puas dengan situasi yang mereka hadapi."
 HABSBURG_discounted_licenses: "Buat Kontrak Senjata yang Menguntungkan"
 HABSBURG_discounted_licenses_desc: "Kita mungkin tidak memiliki senjata paling modern, namun hal itu tidak menjadi masalah, karena para politisi kita menjalin kontak dengan orang-orang yang dapat membantu kita mendapatkan akses yang lebih baik terhadap teknologi asing untuk produksi di fasilitas kita sendiri. Dengan memanfaatkan jaringan yang luas ini, kami akan mendapatkan hak produksi untuk peralatan terbaik, dan dengan memanfaatkan industri kami yang luas, kami akan memiliki akses terhadap peralatan yang unggul untuk pasukan kami."
 HABSBURG_reform_gemeinsame_armee: "Mereformasi Tentara Bersama"
 HABSBURG_reform_gemeinsame_armee_desc: "Di masa lalu Kekaisaran Austro-Hungaria memperkuat Tentara Bersama dalam jumlah besar, melihat semua negara berkontribusi untuk tujuan bersama. Tidak peduli perbedaan dan persamaan ideologi yang kita miliki saat ini, upaya militer bersama hanya akan membuat kita lebih kuat."
 HABSBURG_motorizing_the_armies: "Menggerakan Tentara"
 HABSBURG_motorizing_the_armies_desc: "Perang modern mungkin masih mengenai serangan infanteri, namun meskipun demikian, kita harus memastikan bahwa infanteri dapat berpindah dari satu titik ke titik lain dalam federasi secepat dan seefisien mungkin. Dengan memulai upaya motorisasi untuk mengangkut lebih banyak pasukan kami dengan truk, kami akan memastikan pasukan kami selalu berada di tempat yang dibutuhkan tepat waktu."
 HABSBURG_mechanized_initiative: "Inisiatif Mekanis"
 HABSBURG_mechanized_initiative_desc: "Ada ilmuwan yang mulai mendiskusikan pilihan truk setengah track, yang mampu mengangkut pasukan dan memiliki lapis baja yang lebih berat. Opsi ini mungkin terbukti lebih murah dibandingkan tank, namun lebih kokoh dibandingkan truk, dan mampu mengatasi medan yang lebih menantang. Mungkin kita harus menawarkan pendanaan untuk proyek ini."
 HABSBURG_armor_initiative: "Inisiatif Armor"
 HABSBURG_armor_initiative_desc: "Masa depan peperangan akan ditentukan oleh kendaraan lapis baja, seperti halnya akhir Perang Besar, dimana pendahulu kita kalah. Kita harus memperbaiki kesalahan ini, dan fokus pada kesalahan tersebut agar kita tidak terjatuh lagi."
 HABSBURG_effectivizing_the_motorized_troops: "Penggunaan Bahan Bakar yang Efektif"
 HABSBURG_effectivizing_the_motorized_troops_desc: "Penggunaan bahan bakar kami meroket seiring kami mengintegrasikan lebih banyak unit bermotor, mekanis, dan lapis baja ke dalam angkatan bersenjata kami. Bahan bakar itu sendiri telah menjadi hambatan yang sangat memprihatinkan, sehingga menghambat kemampuan militer kita. Kita harus mempertimbangkan peningkatan penggunaan bahan bakar, karena hal ini akan menguntungkan kita baik secara militer maupun ekonomi."
 HABSBURG_the_strength_of_the_common_man: "Kekuatan Manusia Biasa"
 HABSBURG_the_strength_of_the_common_man_desc: "Bahkan organisasi terbesar sekalipun bergantung pada bagian terkecil. Bagi kami, dan tentara kami pada khususnya, hal ini berarti bergantung pada rakyat jelata, prajurit kami. Kita harus memastikan bahwa setiap prajurit dalam organisasi militer kita memahami beban yang dipikulnya, dan juga bahwa ia mempunyai kekuatan untuk memikulnya, dan itulah tugasnya."
 HABSBURG_joint_training_initiative: "Kementerian Perang Kekaisaran dan Kerajaan"
 HABSBURG_joint_training_initiative_desc: "Tentara Biasa pada masa itu diperintah oleh Kementerian yang ditunjuk. Melihat ke belakang, Kementerian dikelola dengan buruk dan terputus dari apa yang terjadi di medan perang. Namun idenya masuk akal. Jika kita ingin beroperasi bersama, perencanaan dan pengorganisasian kita juga perlu diatur bersama."
 HABSBURG_organizational_exercises: "Latihan Organisasi Bersama"
 HABSBURG_organizational_exercises_desc: "Manuver akan menentukan perang di masa depan. Ketika perang terjadi dengan kecepatan yang semakin tinggi, kebutuhan akan kecepatan tinggi dan pengorganisasian yang sempurna semakin meningkat. Senjata sebanyak apa pun tidak akan bisa menyelamatkan kita jika pasukan kita tidak mengetahui cara bergerak cepat tanpa kehilangan jejak sasarannya. Ketika Angkatan Darat kita berkembang dengan mencakup laki-laki dari berbagai negara, upaya untuk mengoordinasikan dan mengorganisir pasukan kita harus dilakukan."
 HABSBURG_meeting_the_logistical_challenge: "Menghadapi Tantangan Logistik"
 HABSBURG_meeting_the_logistical_challenge_desc: "Tantangan logistik tumbuh seiring dengan federasi kami. Persediaan sekarang membutuhkan waktu lebih lama untuk sampai ke pasukan kami dan kami khawatir jika tidak ditangani, hal ini akan menjadi masalah di masa depan. Pasukan kita harus dilatih untuk berbuat lebih banyak dengan lebih sedikit, dan distribusi pasokan ke pasukan harus ditingkatkan."
 HABSBURG_bring_back_royal_and_imperial_hussars: "Bawa kembali Royal dan Imperial Hussars"
 HABSBURG_bring_back_royal_and_imperial_hussars_desc: "Dulu, Kekaisaran Austro-Hongaria yang lama memiliki Royal dan Imperial Hussars. Semangat para prajurit berkuda masih hidup hingga saat ini, meski sebagian besar unit prajurit berkuda telah lama dibubarkan. Unit-unit yang mendapatkan rasa hormat seperti itu baik dari penduduk kita sendiri maupun dari musuh-musuh kita akan sangat bermanfaat bagi kita bahkan sampai sekarang."
 HABSBURG_defensive_hussars: "Model Setelah Hussar Hongaria"
 HABSBURG_defensive_hussars_desc: "Pasukan Hussar kita yang telah direvitalisasi perlu mengalami beberapa perubahan agar bisa masuk ke dalam pasukan kita yang sekarang lebih modern. Kavaleri ringan Hongaria saat ini, yang mereka gunakan untuk menghadapi Hussar modern, harus menjadi teladan bagi kita untuk membentuk pasukan Hussar baru kita. Dengan memanfaatkan pengalaman mereka, dan berupaya untuk mencapai kelincahan dan kecepatan mereka, kita dapat membangun kekuatan yang patut diperhitungkan."
 HABSBURG_offensive_hussars: "Model setelah Hussar Polandia"
 HABSBURG_offensive_hussars_desc: "Pasukan Hussar kita yang telah direvitalisasi perlu mengalami beberapa perubahan agar bisa masuk ke dalam pasukan kita yang sekarang lebih modern. Kavaleri berat Polandia saat ini, prajurit berkuda bersayap mereka, telah menanamkan rasa takut dan rasa hormat ke dalam hati musuh-musuh mereka. Dengan mengingat hal-hal ini, tampak jelas bahwa Hussar kita harus beroperasi dengan model yang sama."
 HABSBURG_the_modern_hussar: "Prajurit berkuda modern"
 HABSBURG_the_modern_hussar_desc: "Waktu tidak berhenti bagi siapa pun, bahkan prajurit Hussar kita yang pemberani sekalipun. Meskipun orang-orang pemberani ini masih tetap menjadi aset bagi Angkatan Darat Bersama kita, kita harus memodernisasi apa sebenarnya Hussar itu. Masa depan Hussar kita yang kita hormati mungkin tidak selalu berada di atas kuda, tapi tidak terlalu berpengaruh, yang penting adalah semangat Hussar tetap hidup!"
 HABSBURG_for_the_glory_of_the_empire: "Demi Kemuliaan Alam"
 HABSBURG_for_the_glory_of_the_empire_desc: "Kini setelah pasukan kita dapat dianggap siap untuk dihabisi, sekarang saatnya untuk menanamkan rasa tanggung jawab patriotik kepada warga negara kita, agar mereka menyadari bahwa merekalah yang melindungi rumah masing-masing dari musuh."
 HABSBURG_joint_industry_spirit: "Perencanaan Industri Bersama"
 HABSBURG_joint_industry_spirit_desc: "Setiap negara dalam federasi kami harus melakukan bagian mereka dalam hal industri. Namun saat ini kami semua menjalankan rencana yang berbeda, dan hal ini menimbulkan kesulitan karena kami melihat kerja sama yang lebih luas mulai terbentuk. Dengan merencanakan upaya industri bersama-sama, kita dapat memastikan efisiensi maksimum."
 HABSBURG_supplying_the_federation: "Memasok Federasi"
 HABSBURG_supplying_the_federation_desc: "Seiring pertumbuhan federasi kami, pasokan dan jaringan kereta api kami juga harus tumbuh seiring dengan pertumbuhan tersebut. Upaya-upaya harus dilakukan, jika tidak kita akan berisiko mengembangkan infrastruktur kita sendiri dan mengalami kejatuhan yang menyakitkan dan memalukan."
 HABSBURG_optimizing_the_land_usage: "Mengoptimalkan Penggunaan Lahan"
 HABSBURG_optimizing_the_land_usage_desc: "Dengan banyaknya negara yang bekerja sama dalam sebuah federasi, tidak mengherankan jika pemanfaatan lahan kita tidaklah sempurna. Dengan menggabungkan pengetahuan kita tentang cara terbaik memanfaatkan kawasan industri, kita mungkin dapat mengoptimalkan cara kita membangun pabrik."
 HABSBURG_joint_ventures_in_resource_extraction: "Usaha Patungan dalam Ekstraksi Sumber Daya"
 HABSBURG_joint_ventures_in_resource_extraction_desc: "Tidak dapat dihindari bahwa beberapa sumber daya luput dari perhatian atau tidak digali karena alasan lain, biasanya berkaitan dengan ekonomi atau waktu, atau keduanya. Kini setelah semua sumber daya ini dikumpulkan di bawah federasi, kita dapat memanfaatkan perekonomian kita yang lebih besar, dan menambah pengetahuan tentang cara terbaik untuk mengekstraksi sumber daya ini!"
 HABSBURG_industrializing_our_capitals: "Industrialisasi Ibukota"
 HABSBURG_industrializing_our_capitals_desc: "Sebagian besar ibu kota di federasi kami adalah kota tua dan bersejarah. Meskipun hal ini bagus dan menunjukkan sejarah panjang dan kuat dari anggota kami, hal ini membuat kami berharap lebih, secara industrial. Upaya bersama untuk melakukan industrialisasi lebih lanjut di kota-kota ini mungkin terbukti sangat bermanfaat."
 HABSBURG_specializing_in_civilian_logistics: "Mengkhususkan diri dalam Logistik Sipil"
 HABSBURG_specializing_in_civilian_logistics_desc: "Aliran peralatan dan perlengkapan di seluruh federasi dipengaruhi oleh infrastruktur yang buruk dan pemilik pabrik yang korup. Kita harus menaruh fokus besar pada sektor ini dan memperbaikinya sesegera mungkin."
 HABSBURG_specializing_in_the_arms_industry: "Mengkhususkan diri dalam industri Senjata"
 HABSBURG_specializing_in_the_arms_industry_desc: "Jika kita ingin bersaing dengan raksasa [GER.GetAdjective], [SOV.GetAdjective], [ENG.GetAdjective] atau [FRA.GetAdjective], kita harus memperluas industri militer kita!"
 HABSBURG_industrial_effectivization: "Efektifisasi Industri"
 HABSBURG_industrial_effectivization_desc: "Pabrik-pabrik kita perlu bekerja tidak hanya pada masa perang, tetapi tentunya juga pada masa damai. Di dunia yang sempurna, yang terakhir akan jauh lebih penting daripada yang pertama, sayangnya dunia ini tidak sempurna. Namun, kita masih tidak bisa mengabaikan upaya industri di masa damai."
 HABSBURG_reinforced_industry: "Industri yang Diperkuat"
 HABSBURG_reinforced_industry_desc: "Meskipun penting bagi pabrik-pabrik kita untuk dapat beroperasi pada masa damai, sekarang bukanlah waktu yang tepat untuk menangani permasalahan tersebut. Sektor industri kita harus mampu menahan perang yang terjadi di dalam negeri dan sebelum hal itu tercapai, kita tidak punya waktu untuk memikirkan operasi masa damai."
 HABSBURG_improved_production_methods: "Metode Produksi yang Lebih Baik"
 HABSBURG_improved_production_methods_desc: "Kini, setelah industri-industri kita bekerja sama secara efisien, kita dapat berupaya untuk meningkatkan metode produksi, memanfaatkan kekuatan dan potensi sesungguhnya dari sumber daya manusia serta kerja keras mereka."
 HABSBURG_call_the_imperial_diet: "Menyelenggarakan Diet Kekaisaran"
 HABSBURG_call_the_imperial_diet_desc: "Waktunya akhirnya tiba untuk menyusun kembali diet Imperial. Bagi kami, sebagai pemimpin federasi ini, visi federasi ini selalu jelas. Ambisinya selalu berupa reintegrasi kekaisaran, dan inilah saatnya kita mewujudkannya."
 HABSBURG_united_in_the_face_of_danger: "Bersatu dalam Menghadapi Bahaya"
 HABSBURG_united_in_the_face_of_danger_desc: "Ini adalah Kematian atau Ketidakhormatan, dan orang-orang kami mengetahui hal ini dengan baik. Kami akan bersatu sepenuhnya melawan ancaman apa pun yang mungkin menyerang kami!"
 HABSBURG_an_empire_not_just_in_name: "Federasi Seribu Tahun"
 HABSBURG_an_empire_not_just_in_name_desc: "Federasi kami akan benar-benar berdiri selama seribu tahun, dan tidak ada yang bisa menghalangi kami dan masa depan kami saat ini. Perlu diketahui, bahwa wilayah Danube adalah wilayah terkaya dan paling menakjubkan di dunia!"
 HABSBURG_an_empire_not_just_in_name_no_puppets_tt: "Semua subjek yang memiliki §YPohon Fokus Bersama§! ini akan memperoleh:"
 HABSBURG_joint_ft_unlock_tt: "Membuka §YPohon Fokus Bersama Austria-Hongaria§!"
