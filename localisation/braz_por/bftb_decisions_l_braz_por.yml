 BUL_zveno_name_text: "Zveno"
 BUL_bs_name_text: "Sosialis Luas"
 BUL_bzns_name_text: "Serikat Agraria"
 BUL_nsm_name_text: "Gerakan Sosial Nasional"
 BUL_ZVENO_TOOLTIP: "£faction_bul_zveno §YZveno§! adalah organisasi nasionalis yang didirikan oleh perwira militer dan saat ini dipimpin oleh Kimon Georgiev.\nThe £faction_bul_zveno §YZveno§! akan meminta perwira militer untuk bergabung dengan organisasi mereka dan, seiring berjalannya waktu, bahkan dapat mencoba untuk melakukan kudeta terhadap pemerintah dan menerapkan kediktatoran militer."
 BUL_BS_TOOLTIP: "£faction_bul_bs §YSosialis Luas§! adalah kaum sosial-demokrat yang mendukung aliansi kelas luas.\nKaum £faction_bul_bs §YSosialis Luas§! mempunyai pengaruh besar di kalangan pekerja industri dan Serikat Pekerja, dan akan menyerukan pemogokan umum jika mereka tidak setia kepada pemerintah."
 BUL_BZNS_TOOLTIP: "£faction_bul_bzns §YSerikat Agraria§! adalah organisasi politik yang dilarang pada tahun 1934 dan dikhususkan untuk pertanyaan-pertanyaan mengenai pertanian.\nThe £faction_bul_bzns §YSerikat Agraria§! mempunyai pengaruh yang besar di wilayah pedesaan di negara tersebut dan akan berusaha untuk mendapatkan popularitas di kalangan petani."
 BUL_NSM_TOOLTIP: "£faction_bul_nsm §YGerakan Sosial Nasional§! adalah organisasi sayap kanan yang dipimpin oleh mantan anggota Zveno, Aleksandar Tsankov.\n£faction_bul_nsm §YGerakan Sosial Nasional§! akan berusaha untuk mendapatkan popularitas di kalangan massa dengan mengorganisir demonstrasi dan protes di seluruh negeri."
 BUL_LOYALTY_TOOLTIP: "§YLoyalitas§! mewakili keinginan fraksi untuk bekerja sama dengan pemerintah.\nSemakin tinggi §YLoyalitas§!, semakin kecil kemungkinan suatu faksi akan berhadapan dengan pemerintah.\nSebelum mengintegrasikan suatu faksi ke dalam pemerintahan, perlu untuk menyelesaikan keputusan tertentu untuk menyelaraskan anggotanya dengan pemerintah dan meningkatkan §YLoyalty§! mereka menjadi 100."
 BUL_POPULARITY_TOOLTIP: "§YPopularitas§! mewakili dukungan yang diterima sebuah faksi dari sektor masyarakat tertentu (baik militer, proletar, petani, atau radikal sayap kanan).\nSemakin tinggi §YPopularitas§!, semakin besar kemungkinan suatu faksi akan berhadapan dengan pemerintah.\nSebelum menghancurkan sebuah faksi, perlu untuk menyelesaikan keputusan tertentu untuk melemahkannya dan mengurangi §YPopularitas§! menjadi 0."
 BUL_reduced_faction_interaction_cost_tt: "Biaya keputusan untuk mengaktifkan keputusan §YManajemen Fraksi§! dikurangi setengahnya."
 BUL_reduced_communist_oppression_cost_tt: "Biaya pengambilan keputusan untuk menindas faksi §YSosialis Luas§! berkurang setengahnya."
 BUL_improved_faction_effects_tt: "Peningkatan efek pada faksi untuk semua keputusan §YManajemen Fraksi§!."
 BUL_reduced_faction_interaction_cooldown_tt: "Keputusan §YManajemen Fraksi§! akan memakan waktu lebih sedikit untuk diselesaikan dan akan tersedia lebih cepat setelah diaktifkan."
