 form_country_dodecanese_required_state_tt: "Mengontrol §YKepulauan Dodecanese§!."
 form_country_cyprus_required_state_tt: "Mengontrol §YSiprus§!."
 form_country_turkish_coast_coring_states_tt: "Dapatkan inti di semua negara bagian pesisir §YTurki§! bagian barat."
 form_country_cyprus_coring_state_tt: "Dapatkan inti di §YCyprus§!."
 GRE_move_capital_to_constantinople: "Memindahkan Ibukota ke Konstantinopel"
 GRE_move_capital_to_constantinople_desc: "Konstantinopel, ibu kota Peradaban Hellenic Kedua, disebut sebagai 'impian dan harapan semua orang Yunani' dan kota impian dunia. Kita bisa memindahkan ibu kota negara kita ke ibu kota lama sebagai wujud kehebatan kita yang telah ditemukan kembali."
 move_capital_to_thessaloniki: "Pindahkan Ibu Kota ke Tesalonika"
 move_capital_to_thessaloniki_desc: "Athena adalah ibu kota Peradaban Hellenic Pertama, Konstantinopel adalah ibu kota Peradaban Hellenic Kedua, namun Tesalonika – 'ibukota bersama' abadi dalam sejarah Hellenic - akan menjadi ibu kota baru Peradaban Hellenic Ketiga."
 rename_antalya: "Ganti nama Antalya"
 rename_gjirokaster: "Ganti nama Gjirokaster"
 GRE_appoint_aristotle_onassis_as_prime_minister: "Tunjuk Aristoteles Onassis sebagai Perdana Menteri"
 GRE_appoint_aristotle_onassis_as_prime_minister_desc: "Aristoteles Onassis telah berperan penting dalam membantu mewujudkan impian Venezelist agar Ide Megali terpenuhi. Sebagai warga [ROOT.GetAdjective] yang lahir di [339.GetName], mungkin tokoh muda karismatik ini adalah sosok yang bisa mempersatukan kita sebagai sebuah bangsa."
 form_macedonian_empire_category: "Reformasi Kekaisaran Makedonia"
 form_macedonian_empire_category_desc: "Beberapa orang mungkin menganggap gila jika mengingat kembali zaman kekaisaran Alexander Agung, namun untuk benar-benar memperkuat Peradaban Hellenic Ketiga, kita harus kembali sepenuhnya ke asal mula peradaban kita."
 form_macedonian_empire: "Hormati Warisan Argeads"
 form_macedonian_empire_desc: "Ini saatnya untuk menyatukan satrapies kita menjadi satu negara super terpusat yang penyatuannya akan menunjukkan kepada dunia bahwa Yunani bukan lagi sebuah negara yang harus diejek atau diintimidasi, namun sebuah kerajaan yang harus ditakuti."
 form_country_southern_yugoslavia_required_states_tt: "Mengontrol semua negara bagian §YBulgaria§! dan §YAlbania§!, serta semua negara bagian §YYugoslav§! di selatan §YSerbia§!."
 form_country_southern_central_asia_required_states_tt: "Mengontrol §Y[742.GetName]§!, §Y[732.GetName]§!, dan §Y[405.GetName]§!."
 form_country_british_levant_required_states_tt: "Mengontrol §Y[454.GetName]§!, §Y[455.GetName]§!, dan §Y[656.GetName]§!"
 form_country_punjab_required_states_tt: "Mengontrol semua negara bagian §YPakistan§!."
 TUR_the_constitutional_arrows_category: "UU No.3115"
 TUR_the_constitutional_arrows_category_desc: "Enam Prinsip Panduan [ROOT.GetNameDef] telah dikodifikasikan ke dalam konstitusi kita, dan selama kita menghormatinya, kita harus percaya bahwa bangsa kita tidak akan pernah terkoyak dari dalam."
 TUR_republicanism_decision: "Republikanisme"
 TUR_republicanism_decision_desc: "Negara ini lahir dari abu Kesultanan Ottoman yang gagal. Sekarang, kami tidak menjawab pertanyaan Sultan; tidak ada Khalifah; tidak ada tuhan - kami bebas, dan kami menderita demi hak untuk bebas."
 TUR_stoked_republicanism_flag: "Baru-baru ini memicu sentimen Partai Republik."
 TUR_secularism_decision: "Sekularisme"
 TUR_secularism_decision_desc: "Jika kita membiarkan dogma kepercayaan kuno yang masih terjebak di Abad Pertengahan untuk mengarahkan pemerintahan dan cara hidup kita, maka kita tidak akan pernah mengembangkan kemampuan yang diperlukan untuk dianggap setara di antara negara-negara besar di dunia."
 TUR_stoked_secularism_flag: "Baru-baru ini memicu sentimen sekuler."
 TUR_populism_decision: "Populisme"
 TUR_populism_decision_desc: "Rakyat harus selalu menjadi prioritas nomor satu dalam pemerintahan yang bertanggung jawab. Tidak ada ruang untuk perdebatan mengenai masalah ini."
 TUR_stoked_populism_flag: "Baru-baru ini memicu sentimen populis."
 TUR_nationalism_decision: "Nasionalisme"
 TUR_nationalism_decision_desc: "Kita telah berjuang dan mati demi negara kita sebelumnya, dan kita semua harus bersedia melakukannya lagi."
 TUR_stoked_nationalism_flag: "Baru-baru ini memicu sentimen nasionalis."
 TUR_etatism_decision: "Etatisme"
 TUR_etatism_decision_desc: "Keuntungan menjalankan perekonomian komando adalah bahwa eksekutif mempunyai pengaruh yang cukup besar terhadap arah perekonomian melalui mekanisme fiskal. Adalah kepentingan nasional untuk menerapkan mekanisme tersebut sekarang."
 TUR_no_longer_has_etatism_tt: "Tidak lagi mempertahankan §YEtatisme§!"
 TUR_etatism_abolished: "§YEtatisme§! telah dihapuskan."
 TUR_reformism_decision: "Reformisme"
 TUR_reformism_decision_desc: "Rakyat kami selalu terdepan - bahkan Ottoman dikenal sering melakukan reformasi politik dan sosial. Dinamisme orang [FROM.GetAdjective] adalah salah satu kualitas terbesar kami."
 TUR_stoked_reformism_flag: "Baru-baru ini memicu sentimen reformis."
 TUR_revolutionism_decision: "Revolusionisme"
 TUR_revolutionism_decision_desc: "Melepaskan kuk Ottoman dan mendirikan negara Turki adalah sebuah revolusi. Kita telah berubah, dan terus berubah, ketika kita gagal melewati metamorfosis nasional kita dan kemajuan menuju orang-orang yang memang ditakdirkan untuk menjadi seperti kita..."
 TUR_stoked_revolutionism_flag: "Baru-baru ini memicu sentimen revolusioner."
 TUR_liberalism_decision: "Liberalisme"
 TUR_liberalism_decision_desc: "Kebebasan menentukan masa depan adalah landasan impian kita untuk masa depan bangsa ini. Perdagangan bebas, pemilihan umum yang bebas, kebebasan beragama, kebebasan mendapatkan kesempatan – inilah yang harus terus kita cita-citakan."
 TUR_stoked_liberalism_flag: "Baru-baru ini memicu sentimen liberal."
 TUR_jihad_decision: "Jihad"
 TUR_jihad_decision_desc: "Dengan timah dan pedang, kami akan menjalankan kehendak Yang Mahakuasa dan memukul jiwa-jiwa yang tersesat dan tersesat dari jalan-Nya."
 TUR_stoked_jihad_flag: "Baru-baru ini memicu sentimen ekstremis."
 TUR_fidelity_decision: "Kesetiaan"
 TUR_fidelity_decision_desc: "Kesetiaan kepada Sultan; kesetiaan kepada Yang Mahakuasa - di sinilah letak dua pilar penting yang harus ditundukkan setiap warga negara dengan hormat."
 TUR_stoked_fidelity_flag: "Baru-baru ini memicu sentimen setia."
 TUR_absolutism_decision: "Absolutisme"
 TUR_absolutism_decision_desc: "Pemerintahan Sultan bersifat mutlak; Kesultanan Utsmaniyah pernah terkoyak dari dalam, dan sejarah tidak boleh dibiarkan terulang kembali."
 TUR_stoked_absolutism_flag: "Baru-baru ini memicu sentimen monarki."
 TUR_ultranationalism_decision: "Ultranasionalisme"
 TUR_ultranationalism_decision_desc: "Tidaklah cukup hanya rela mati demi negara; setiap warga negara harus menyerahkan diri seutuhnya baik jiwa, raga, dan jiwa demi kesejahteraan bangsa."
 TUR_stoked_ultranationalism_flag: "Baru-baru ini memicu sentimen ultranasionalis."
 TUR_socialism_decision: "Sosialisme"
 TUR_socialism_decision_desc: "Kita membuang royalti kita yang lama, dan sekarang kita harus bekerja sama dengan kelas pekerja untuk menjatuhkan kapitalis arogan saat ini."
 TUR_stoked_socialism_flag: "Baru-baru ini memicu sentimen sosialis."
 TUR_alter_the_royal_laws_of_succession: "Mengubah Hukum Suksesi Kerajaan"
 TUR_alter_the_royal_laws_of_succession_desc: "Kesultanan baru memberikan peluang besar untuk mereformasi undang-undang suksesi kuno kita. Kami akan memberlakukan kebijakan Primogeniture Agnatik-Kognatik, sehingga hanya keturunan langsung Sultan yang boleh mewarisi."
 TUR_industrial_projects_category: "Proyek Industri"
 TUR_industrial_projects_category_desc: "Mengingat betapa mudanya negara [ROOT.GetAdjective] ini, proyek-proyek industri yang masih baru sering kali memerlukan bantuan pemerintah agar dapat terealisasi sepenuhnya."
 TUR_financing_private_enterprise_flag: "Sudah membiayai perusahaan swasta."
 TUR_open_the_nazilli_callico_factory: "Buka Pabrik Nazilli Calico"
 TUR_open_the_nazilli_callico_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_finance_the_bursa_merinos_factory: "Membiayai Pabrik Bursa Merinos"
 TUR_finance_the_bursa_merinos_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_fund_the_gemlik_silk_factory: "Danai Pabrik Sutra Gemlik"
 TUR_fund_the_gemlik_silk_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_construct_the_zonguldak_coal_refinery: "Membangun Kilang Batubara Zonguldak"
 TUR_construct_the_zonguldak_coal_refinery_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_modernise_the_general_directorate_of_military_factories: "Modernisasi Direktorat Jenderal Pabrik Militer"
 TUR_modernise_the_general_directorate_of_military_factories_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_authorise_the_nuri_killigil_factory: "Otorisasi Pabrik Nuri Killigil"
 TUR_authorise_the_nuri_killigil_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_sponsored_killigil_armaments_flag: "Mensponsori §YKilligil Armaments§! melalui keputusan §YSanayiciler Industrial Projects§!."
 TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory: "Mensponsori Pabrik Pesawat Nuri Demirağ Beşiktaş"
 TUR_sponsor_the_nuri_demirag_besiktas_aircraft_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_invest_in_malatya_cigarette_factory: "Berinvestasi di Pabrik Rokok Malatya"
 TUR_invest_in_malatya_cigarette_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_bankroll_the_malatya_clothing_factory: "Membiayai Pabrik Pakaian Malatya"
 TUR_bankroll_the_malatya_clothing_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_subsidise_the_karabuk_iron_steel_factory: "Subsidi Pabrik Besi-Baja Karabük"
 TUR_subsidise_the_karabuk_iron_steel_factory_desc: "Merupakan tanggung jawab pemerintah untuk menilai proyek-proyek industri potensial berdasarkan kasus per kasus."
 TUR_karabuk_iron_steel_factory_modernised_flag: "§YPabrik Besi-Baja Karabuk§! telah dimodernisasi melalui §YSanayiciler§!."
 TUR_sponsor_petrol_olfisis_formation: "Sponsor Formasi Petrol Ofisi"
 TUR_sponsor_petrol_olfisis_formation_desc: "Ada tekanan pada pemerintah untuk membentuk organisasi negara yang didedikasikan untuk penggalian minyak dan masalah energi terkait minyak bumi."
 TUR_petrol_ofisi_formed: "Pembentukan Petrol Ofisi telah disponsori."
 TUR_repeal_the_wealth_tax: "Cabut Pajak Kekayaan"
 TUR_repeal_the_wealth_tax_desc: "Pajak terhadap non-Muslim ini tidak berkelanjutan dan merupakan noda pada catatan Kemalis kami; hal yang benar untuk dilakukan adalah segera mencabut pajak tersebut."
 TUR_repeal_the_faith_tax: "Cabut Pajak Iman"
 TUR_repeal_the_faith_tax_desc: "Pajak terhadap institusi keagamaan ini tidak berkelanjutan, dan meskipun tujuan kami mulia, kenyataannya [ROOT.GetNameDef] belum siap untuk kebijakan radikal seperti itu. Tindakan yang masuk akal adalah menghapuskan pajak."
 TUR_abolish_etatism: "Hapuskan Etatisme"
 TUR_abolish_etatism_desc: "Etatisme adalah pencapaian gemilang dari sistem Kemalis dan merupakan eksperimen yang bermanfaat, namun sayangnya ini adalah eksperimen yang mungkin perlu dihentikan secara permanen demi kebaikan yang lebih besar."
 TUR_absorb_the_tpda: "Menyerap T.P.D.A."
 TUR_absorb_the_tpda_desc: "Administrasi Utang Publik Turki menyatu dengan sektor industri kita seperti sebuah tumor, namun kita dapat mengintegrasikan kembali organisasi tersebut sebagai proses nasional untuk menghilangkan Administrasi Utang yang merupakan hambatan bagi perkembangan kita lebih lanjut."
 TUR_pay_off_our_debts: "Lunasi Hutang Kami"
 TUR_pay_off_our_debts_desc: "Kesultanan Utsmaniyah mempunyai banyak hutang selama keberadaannya, dan kita juga menghabiskan banyak uang untuk membangun kembali negara kita. Saat ini, kami berada dalam posisi yang baik untuk melunasi sebagian utang tersebut!"
 TUR_discuss_investment_possibilities_with_FROM: "Diskusikan Kemungkinan Investasi dengan [FROM.GetNameDef]"
 TUR_discuss_investment_possibilities_with_FROM_desc: "Di masa lalu, kebijakan [ROOT.GetAdjective] adalah menghindari investasi dan campur tangan asing sebisa mungkin - namun kita tidak lagi perlu terlalu takut dengan transaksi sederhana seperti investasi. Mereka akan menganggap kita setara, dan kita bisa menjadi lebih kaya karenanya."
 TUR_investment_in_turkey_pending_flag: "[FROM.GetNameDefCap] telah menyetujui portofolio investasi kami tetapi belum berkomitmen terhadapnya."
 TUR_investment_opinion_tt: "Semakin tinggi opini §Y[FROM.GetNameDef]'s§! terhadap kita, semakin besar pula peluang investasinya."
 ROOT_invest_in_turkish_state_building: "Berinvestasi di [FROM.GetAdjective] Gedung Negara"
 ROOT_invest_in_turkish_state_building_desc: "[FROM.GetAdjective] infrastruktur penting masih terbelakang di banyak wilayah di negara ini; ini adalah sesuatu yang bisa kami perbaiki."
 ROOT_invest_in_turkish_state_light_industry: "Berinvestasi di [FROM.GetAdjective] Industri Ringan"
 ROOT_invest_in_turkish_state_light_industry_desc: "[FROM.GetAdjective] industri ringan kurang berkembang di banyak wilayah di negara ini; ini adalah sesuatu yang bisa kami perbaiki."
 ROOT_invest_in_turkish_state_heavy_industry: "Berinvestasi di [FROM.GetAdjective] Industri Berat"
 ROOT_invest_in_turkish_state_heavy_industry_desc: "[FROM.GetAdjective] industri berat masih terbelakang di banyak wilayah di negara ini; ini adalah sesuatu yang bisa kami perbaiki."
 TUR_investment_pursued: "Investasi Dikejar"
 ROOT_turkish_investment_ai_tt: "Semakin baik §Yinvestasi§! kita ke dalam §Y[TUR.GetNameDef]§!, semakin dekat kita dapat mengikat mereka dengan kepentingan kita sendiri sekaligus mengasingkan mereka dari musuh kita."
 TUR_kurdish_state_management_category: "Manajemen Negara Kurdi"
 TUR_kurdish_state_management_category_desc: "Masalah Kurdi adalah salah satu masalah yang telah menghantui kita bahkan sebelum berdirinya Republik ini, meskipun masalah ini semakin memburuk sejak saat itu. Nasionalisme yang merajalela dan upaya-upaya pembangunan bangsa yang gagal mengancam kehancuran warisan Perang Kemerdekaan, dan kita tidak bisa menoleransi skenario apa pun yang menyatakan bahwa ada Kurdistan merdeka yang lahir dari keterpurukan bangsa kita sendiri."
 TUR_kurdish_state_management_map_category_name: "Ini adalah negara-negara yang menampung pemberontak Kurdi."
 TUR_agitate_kurdish_state_effect_tt: "£faction_tur_kurdish §YPemberontak Kurdi§! akan meningkatkan intensitas perlawanan mereka terhadap pemerintah di §Y[TUR_kurdish_state_event_target.GetName]§!."
 TUR_pacify_kurdish_state_effect_tt: "£faction_tur_kurdish §YPemberontak Kurdi§! di §Y[TUR_kurdish_state_event_target.GetName]§! akan ditenangkan."
 TUR_placate_kurdish_state_effect_tt: "£faction_tur_kurdish §YPemberontak Kurdi§! di §Y[TUR_kurdish_state_event_target.GetName]§! akan ditenangkan."
 TUR_kurdish_modifiers_trigger_tt: "Semua negara bagian £faction_tur_kurdish §YKurdi§! adalah §Ycore§!, atau memiliki pengubah §YKelelahan Separatis§!."
 TUR_no_current_integration_targets_available_tt: "Sebelum negara bagian £faction_tur_kurdish §YKurdi§! dapat di-coret §YKepatuhan§! harus dinaikkan menjadi setidaknya §Y70%§!, dan §YResistance§! harus diturunkan menjadi setidaknya §Y30%§!."
 TUR_integrate_kurdish_state_effect_tt: "Negara bagian £faction_tur_kurdish §YKurdi§! akan kehilangan pengubah negara bagiannya dan menjadi inti dari §Y[TUR.GetNameDef]§!."
 TUR_counter_the_rebels_in_diyarbakir: "Lawan Pemberontak di Diyarbakır"
 TUR_counter_the_rebels_in_diyarbakir_desc: "Pemberontak di Diyarbakır biasanya tidak terlalu menimbulkan masalah dibandingkan di tempat lain; mungkin karena status Diyarbakır yang relatif berkembang."
 TUR_counter_the_rebels_in_erzurum: "Lawan Pemberontak di Erzurum"
 TUR_counter_the_rebels_in_erzurum_desc: "Erzurum adalah pusat aktivitas dan aktivisme politik Kurdi, namun jarang menjadi tempat terjadinya kekerasan politik. Dunia sedang berubah dalam banyak hal, namun..."
 TUR_counter_the_rebels_in_van: "Lawan Pemberontak di Van"
 TUR_counter_the_rebels_in_van_desc: "Van adalah salah satu negara bagian paling timur dan hampir tidak dapat dikenali dalam segala hal dibandingkan dengan negara bagian paling barat."
 TUR_counter_the_rebels_in_hakkari: "Lawan Pemberontak di Hakkâri"
 TUR_counter_the_rebels_in_hakkari_desc: "Pemberontak di Hakkâri biasanya sedikit lebih terorganisir dibandingkan di negara bagian lain, dan mereka jauh lebih sulit dibasmi karena banyaknya gunung dan perbukitan."
 TUR_decision_cost_kurd_rebels: "£command_power §Y15§!"
 TUR_decision_cost_kurd_rebels_blocked: "£command_power §R15§!"
 TUR_offer_conscription_exceptions_to_kurdish_groups: "£faction_tur_kurdish Menawarkan Pengecualian Wajib Militer kepada Kelompok Kurdi"
 TUR_offer_conscription_exceptions_to_kurdish_groups_desc: "Banyak kelompok Kurdi tidak menuntut kemerdekaan penuh, mereka hanya menuntut pengakuan atas otonomi tertentu. Kita dapat memberikan sedikit otonomi atas nama perdamaian dengan menawarkan pengecualian wajib militer secara luas."
 TUR_integrate_kurdish_state: "£faction_tur_kurdish Integrasikan Negara Kurdi"
 TUR_integrate_kurdish_state_desc: "Dengan bekerja sama dengan para pemimpin lokal, kita dapat memastikan bahwa negara-negara Kurdi di negara kita telah diintegrasikan kembali ke dalam kerangka nasional negara-bangsa kita."
 TUR_unlock_kurdish_integration_decisions_tt: "Membuka:§Y$TUR_integrate_kurdish_state$§! keputusan."
 TUR_integrate_diyarbakir: "£faction_tur_kurdish Integrasikan Diyarbakır"
 TUR_integrate_diyarbakir_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_hakkari: "£faction_tur_kurdish Integrasikan Hakkâri"
 TUR_integrate_hakkari_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_tunceli: "£faction_tur_kurdish Integrasikan Erzurum"
 TUR_integrate_tunceli_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_integrate_van: "£faction_tur_kurdish Integrasikan Van"
 TUR_integrate_van_desc: "$TUR_integrate_kurdish_state_desc$"
 TUR_kurdish_resistance_escalation_mission: "£faction_tur_kurdish Perlawanan Kurdi Meningkatkan Upaya Anti-Pemerintah"
 TUR_kurdish_resistance_escalation_mission_desc: "Pemberontak Kurdi sekali lagi mengintensifkan upaya anti-pemerintah mereka di wilayah tenggara negara kita."
 TUR_acted_against_kurd_rebels_recently_flag: "Baru-baru ini Menargetkan Suku Kurdi"
 TUR_fundamentalist_state_management_category: "Manajemen Negara Fundamentalis"
 TUR_fundamentalist_state_management_category_desc: "Ada orang-orang di negeri ini yang belum sepenuhnya siap melihat peran agama yang begitu tiba-tiba berubah di bangsa [ROOT.GetAdjective]. Orang-orang ini membutuhkan sentuhan lembut, meskipun mereka tidak boleh menghalangi langkah kita menuju kemajuan."
 TUR_fundamentalist_state_management_map_category_name: "Inilah negara-negara yang menentang prinsip Kemalisme."
 TUR_encourage_avid_fundamentalist_disciples_to_migrate_into_state: "£faction_tur_traditionalist Mendorong Pengikut Fundamentalis untuk Bermigrasi ke Komunitas Rentan"
 TUR_increase_influence_of_fundamentalists_in_state: "£faction_tur_traditionalist Meningkatkan Pengaruh Fundamentalis"
 TUR_increase_influence_of_fundamentalists_in_state_desc: "Cahaya Yang Maha Kuasa harus menyentuh setiap sudut bangsa yang kita banggakan ini."
 TUR_hold_a_march_in_state: "£faction_tur_kemalist Mengadakan Pawai di Negara Fundamentalis"
 TUR_hold_a_march_in_state_desc: "Unsur-unsur keagamaan di masa lalu di negara ini akan kagum dengan ketaatan yang ditunjukkan oleh para pengikut ideologi kita yang pantang menyerah saat mereka berbaris melewati komunitas pemberontak."
 TUR_acquiesce_to_fundamentalists: "£faction_tur_traditionalist Menyetujui kaum Fundamentalis"
 TUR_acquiesce_to_fundamentalists_desc: "Agar republik ini bisa bertahan, harus ada kompromi – bahkan jika itu berarti melanggar konstitusi yang menjadi dasar negara ini."
 TUR_empower_fundamentalists_in_state: "£faction_tur_traditionalist Memberdayakan Fundamentalis di Negara"
 TUR_empower_fundamentalists_in_state_desc: "Umat seagama kita memerlukan semua dukungan dari pemerintah yang bisa mereka peroleh."
 TUR_kemalist_state_management_category: "Manajemen Negara Kemalis"
 TUR_kemalist_state_management_category_desc: "Penganut Kemalisme cenderung tinggal di kota-kota besar dan mempunyai kecenderungan untuk mempertahankan pandangan politiknya seolah-olah sedang mempertahankan cara hidup."
 TUR_kemalist_state_management_map_category_name: "Inilah negara-negara yang setia pada ideologi Kemalisme."
 TUR_kemalist_loyalty_and_power_update_effect_tt: "§YPetugas Kemalis§! akan menyesuaikan kembali statusnya sebagai respon terhadap tindakan pemerintah."
 TUR_kemalist_influenced_state_effect_tt: "£faction_tur_kemalist §YKemalis§! akan mengambil alih sebagai administrator negara yang tidak ada bandingannya."
 TUR_kemalist_turn_hostile_effect_tt: "£faction_tur_kemalist §YKemalis§! akan menjadi §Rbermusuhan§! terhadap pemerintah."
 TUR_counter_influence_of_fundamentalists_in_state: "£faction_tur_kemalist Memulai Operasi Kontra-Fundamentalis"
 TUR_embed_kemalist_propagandists_into_state: "£faction_tur_kemalist Menanamkan Propagandis Kemalis ke dalam Negara"
 TUR_embed_kemalist_propagandists_into_state_desc: "Kita harus bekerja keras untuk memastikan bahwa ideologi Kemalisme tertanam di hati sebanyak mungkin orang agar dapat bertahan di masa depan."
 TUR_the_enemy_within: "Musuh di Dalam"
 TUR_the_enemy_within_desc: "Negara kita terpecah belah berdasarkan garis politik, etnis, dan agama, dan perpecahan ini mengancam perpecahan bangsa dan menjerumuskan kita ke dalam kekacauan. Kekuatan jahat sedang bekerja keras di rumah kita: mereka tidak boleh dibiarkan menang atas pemerintahan sah [ROOT.GetNameDef]."
 TUR_unaligned_state_management_map_category_name: "Ini adalah negara-negara bagian yang saat ini masih belum selaras."
 TUR_ideological_battleground_state: "Bukan merupakan £faction_tur_unaligned §YNegara Tidak Sejajar§!"
 TUR_is_fundamentalist_state_tt: "Dianggap sebagai £faction_tur_traditionalist §YNegara Tradisionalis§!"
 TUR_is_kemalist_state_tt: "Dianggap sebagai £faction_tur_kemalist §YNegara Kemalis§!"
 TUR_traditionalist_infiltration_mission: "£faction_tur_traditionalist Krisis Infiltrasi Kaum Tradisionalis"
 TUR_traditionalist_infiltration_mission_desc: "Tampaknya unsur-unsur keagamaan dalam masyarakat kita sekali lagi berupaya untuk semakin memperkuat pengikutnya di daerah-daerah yang dukungannya hanya sedikit."
 TUR_thwarting_traditionalist_infiltration: "£faction_tur_kemalist Menggagalkan Upaya Infiltrasi Kaum Tradisionalis"
 TUR_thwarting_traditionalist_infiltration_desc: "Kita tidak boleh membiarkan orang-orang yang merusak sekularisme negara ini menyebar ke negara-negara Barat tanpa terkendali; kita mempunyai kewajiban untuk menghentikan mereka."
 TUR_entrench_kemalism_in_state: "£faction_tur_kemalist Memperkuat Kemalisme di Negara"
 TUR_entrench_kemalism_in_state_desc: "Kita harus bekerja keras untuk memastikan bahwa ideologi Kemalisme tertanam di hati sebanyak mungkin orang agar dapat bertahan di masa depan."
 TUR_root_out_kemalists_in_state: "£faction_tur_traditionalist Membasmi Kemalis di Negara Bagian"
 TUR_root_out_kemalists_in_state_desc: "Kita akan menanamkan rasa takut ke dalam hati momok Kemalis tak bertuhan yang terus melanda bangsa ini."
 TUR_kemalist_infiltration_mission: "£faction_tur_kemalist Krisis Infiltrasi Kemalis"
 TUR_kemalist_infiltration_mission_desc: "Kaum Kemalis, yang tidak puas karena digulingkan oleh publik, masih menggunakan trik lama mereka. Mereka berupaya memonopoli kekuasaan di negara-negara Barat; mereka harus dihentikan."
 TUR_hostile_kemalists_influenced_state_effect_tt: "£faction_tur_kemalist §YPengkhianat Kemalis§! akan bercokol di §Y[TUR_kemalist_state_event_target.GetName]§!."
 TUR_thwarting_kemalist_infiltration: "£faction_tur_traditionalist Menggagalkan Upaya Infiltrasi Kemalis"
 TUR_thwarting_kemalist_infiltration_desc: "Menghentikan kaum Kemalis menyebarkan racun mereka lebih dari sekedar tanggung jawab sipil, namun merupakan tugas Tuhan."
 TUR_reforming_our_armed_forces_category: "Mereformasi Angkatan Bersenjata Kita"
 TUR_reforming_our_armed_forces_category_desc: "Angkatan bersenjata kita hancur setelah Perang Kemerdekaan: dibutuhkan segala yang kita miliki dan lebih banyak lagi untuk memenangkan kebebasan kita dari kaum imperialis, dan meskipun reformasi militer adalah sesuatu yang bisa tertunda untuk beberapa waktu, dunia kini dengan cepat menjadi tempat yang jauh lebih berbahaya."
 TUR_modernize_our_tactics: "Modernkan Taktik Kami"
 TUR_modernize_our_tactics_desc: "Banyak dari mereka yang terdaftar dalam angkatan bersenjata kita adalah veteran Perang Kemerdekaan, namun mereka gagal menyadari bahwa perang apa pun di masa depan tidak akan seperti perang tahun 1922."
 TUR_teach_the_proper_use_of_modern_infrastructure: "Instruksikan Penggunaan Infrastruktur Modern dengan Benar"
 TUR_teach_the_proper_use_of_modern_infrastructure_desc: "Banyak di antara angkatan bersenjata kita yang lambat beradaptasi dengan munculnya gerbong kereta api dan jalan raya serta bersikeras melakukan perjalanan dengan menunggang kuda."
 TUR_commence_an_overhaul_of_our_training_methods: "Memulai Perombakan Metode Pelatihan Kami"
 TUR_commence_an_overhaul_of_our_training_methods_desc: "Metode pengajaran dan pengajaran kami tidak efektif; para veteran kami belajar melalui pengalaman, namun anggota baru kami tampaknya hampir tidak mempunyai akal sehat sama sekali."
 TUR_streamline_communication_methods_between_ships: "Memperlancar Metode Komunikasi Antar Kapal"
 TUR_streamline_communication_methods_between_ships_desc: "Banyak peralatan yang digunakan di kapal angkatan laut kita sudah tua, ketinggalan jaman, dan tidak dapat diandalkan."
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect: "Legalisasikan Peraturan Keselamatan Pesawat Baru"
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect_desc: "Kami selalu bangga menjadi yang terdepan dalam inovasi penerbangan di Eropa, namun pilot kami memiliki reputasi yang sangat baik dalam bertindak seperti orang yang tidak berperikemanusiaan."
 TUR_etatism_crisis_1: "Meningkatnya Inflasi"
 TUR_etatism_crisis_1_desc: "Mencoba mempertahankan model perekonomian Etatist sekaligus mengadopsi perekonomian perang terbukti menimbulkan permasalahan."
 TUR_etatism_crisis_2: "Devaluasi Lira Turki"
 TUR_etatism_crisis_2_desc: "Mencoba mempertahankan model perekonomian Etatist sekaligus mengadopsi perekonomian perang terbukti menimbulkan permasalahan."
 TUR_etatism_crisis_3: "Resesi yang Memburuk"
 TUR_etatism_crisis_3_desc: "Mencoba mempertahankan model perekonomian Etatist sekaligus mengadopsi perekonomian perang terbukti menimbulkan permasalahan."
 TUR_etatism_crisis_4: "Depresi yang Akan Segera Terjadi"
 TUR_etatism_crisis_4_desc: "Mencoba mempertahankan model perekonomian Etatist sekaligus mengadopsi perekonomian perang terbukti menimbulkan permasalahan. Jika kita gagal mengambil tindakan nyata terhadap masalah ini, maka kita bisa menghancurkan seluruh perekonomian kita."
