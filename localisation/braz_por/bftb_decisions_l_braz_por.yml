 BUL_the_fatherland_front_dec_cat_desc: "[GetFfDecisionCategoryDesc]"
 BUL_the_fatherland_front_desc_planning: "Para pemimpin §YFront Tanah Air§! sedang membuat persiapan untuk melakukan kudeta.\nPada akhirnya, mereka akan mencari dukungan dari [GetZvenoName], [GetBsName] dan [GetBznsName].\nKita dapat mengambil beberapa tindakan untuk menghambat persiapan mereka dan melemahkan upaya mereka untuk menggulingkan pemerintah:\n-Membasmi dan menangkap §YFront Tanah Air§! simpatisan dan pemimpin.\n-Hancurkan atau integrasikan salah satu faksi yang mungkin mereka dekati.\n-Memiliki kurang dari 1 §YDukungan Komunis§! akan memungkinkan kita untuk memberikan pukulan terakhir kepada §YFront Tanah Air§!."
 BUL_the_fatherland_front_desc_coup: "Para pemimpin Front Tanah Air telah merencanakan kudeta dan sekarang menunggu saat yang tepat untuk menyerang.\nKemungkinan terjadinya kudeta:\nPangkalan §Y10%§! [GetAtWarFfPercentage] [GetAllyAtWarFfPercentage] [GetSovNeighborFfPercentage] [GetCommunistSovFfPercentage]"
