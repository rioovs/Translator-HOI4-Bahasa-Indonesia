 GRE_pay_back_debt_to_the_ifc_category: "Mengelola Hutang kepada I.F.C."
 GRE_pay_back_debt_to_the_ifc_category_desc: "Yunani telah terlilit utang finansial sejak Perang Kemerdekaan pada tahun 1829, dan Perang Besar tidak benar-benar membantu meringankan kesengsaraan fiskal kita. Jika kita bisa melunasi utang-utang kita, maka hal ini akan sangat membantu menjaga stabilitas ekonomi di Yunani. Alternatifnya, gerakan radikal tertentu diketahui melanggar konvensi politik dan ekonomi. Jika kita mengikuti salah satu gerakan ini, atau membiarkan dunia terurai seiring berjalannya waktu, tindakan yang lebih drastis mungkin akan terjadi...\n\n§YUtang§! kepada §YBritish§!: [ROOT.GetDebtPercentageBritain]\n\n§YUtang§! kepada §YPerancis§!: [ROOT.GetDebtPercentageFrance]\n\n§YUtang§! kepada §YItalia§!: [ROOT.GetDebtPercentageItaly]\n\nTotal §YHutang§! Dibayar: [ROOT.GetDebtPercentagePaidTotal]"
