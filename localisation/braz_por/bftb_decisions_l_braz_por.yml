 BUL_rearmament: "Persenjataan kembali Bulgaria"
 BUL_rearmament_desc: "Setelah kekalahan kami dalam Perang Besar dan penerapan Perjanjian Neuilly, pasukan kami mengalami keterbatasan yang sangat besar. Namun masa-masa penuh gejolak sedang membayangi Eropa saat ini dan, jika kita ingin menjaga integritas wilayah Bulgaria dan kebebasan rakyatnya, kita harus menemukan cara untuk meninggalkan pembatasan tersebut dan mulai membangun kembali angkatan bersenjata kita."
 BUL_demonstrate_our_policies_of_peace: "Tunjukkan Kebijakan Perdamaian kami"
 BUL_demonstrate_our_policies_of_peace_desc: "Perselisihan wilayah dengan tetangga kita harus diakhiri jika kita ingin merundingkan persenjataan militer kita dengan pemerintah Inggris."
 BUL_pressure_to_lift_army_restrictions: "Tekanan untuk Mencabut Pembatasan Tentara"
 BUL_pressure_to_lift_army_restrictions_desc: "Kita harus menekan [ENG.GetNameDef] untuk akhirnya menyetujui pencabutan semua pembatasan yang diberlakukan pada tentara kita."
 BUL_refuse_army_restrictions: "Tolak Pembatasan Tentara"
 BUL_refuse_army_restrictions_desc: "Sekarang kami didukung oleh [GetBulgarianFactionName], kami tidak lagi memerlukan persetujuan [ENG.GetNameDef] untuk memulai persenjataan militer kami."
 BUL_refuse_army_restrictions_faction_name: "[ROOT.GetFactionName]"
 BUL_refuse_army_restrictions_no_faction: "sekutu kita"
 BUL_rearmament_negotiations_ongoing_flag: "Saat ini sedang merundingkan persenjataan kembali militer"
 BUL_rearmament_main_factors_tt: "Faktor utama yang akan mempengaruhi keputusan [ENG.GetAdjective]:\n§G- Mengutuk IMRO secara terbuka\n- Memiliki hubungan baik dengan §Y[ENG.GetNameWithFlag]§!\n- Menyelesaikan fokus §YPerjanjian Persahabatan Abadi§! atau §YPerjanjian Salonika§!\n- Condong ke arah demokrasi\n- Memiliki pemerintahan yang sama dengan §Y[ENG.GetNameWithFlag]§!§!\n§R- Memiliki hubungan buruk dengan §Y[ENG.GetNameWithFlag]§!\n- Mendukung IMRO\n- Menunjuk Bogdan Filov sebagai penasihat atau pemimpin negara§!"
 BUL_purchase_equipment: "Beli Peralatan Asing"
 BUL_purchase_equipment_desc: "Industri [ROOT.GetAdjective] terbelakang dan tidak dapat memproduksi senjata modern pada tingkat yang dapat diterima. Kita harus mencari lebih banyak negara industri di luar negeri yang dapat memasok peralatan militer yang kita butuhkan."
