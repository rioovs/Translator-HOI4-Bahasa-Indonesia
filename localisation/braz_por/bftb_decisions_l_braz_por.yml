 BUL_impending_zveno_coup_size_tt: "[GetZvenoName] pendukung memulai perang saudara.\nUkuran militer Zveno dalam perang saudara didasarkan pada popularitas Zveno."
 BUL_macedonian_revolutionary_organizations: "Organisasi Revolusioner Makedonia"
 BUL_macedonian_revolutionary_organizations_desc: "[GetImroDecisionCategoryDesc]"
 BUL_macedonian_revolutionary_organizations_cooperation_desc: "Kita harus mengupayakan kerja sama Makedonia selama potensi pendudukan Bulgaria dalam waktu dekat. IMRO dapat menjadi alat yang sempurna untuk mempromosikan sentimen Bulgaria di kawasan, memfasilitasi aneksasi Makedonia dalam jangka panjang."
 BUL_macedonian_revolutionary_organizations_hostile_desc: "IMRO sudah terlalu lama menjadi momok di seluruh Balkan. Kita harus memberantas sisa sel yang masih aktif di Bulgaria, memenjarakan anggotanya, yang lebih terlihat seperti gangster dibandingkan revolusioner, dan pada akhirnya mengakhiri teror mereka."
 BUL_repress_imro_propaganda: "Propaganda Anti-IMRO"
 BUL_repress_imro_propaganda_desc: "Kami akan melakukan kampanye propaganda nasional melawan IMRO, mengecam organisasi tersebut secara terbuka melalui pidato, pertemuan, dan demonstrasi."
 BUL_repress_imro_persecute_activists: "Menganiaya Aktivis IMRO"
 BUL_repress_imro_persecute_activists_desc: "Kami akan memburu dan mengadili setiap agitator atau aktivis revolusioner yang beroperasi di wilayah kami."
 BUL_repress_imro_destroy_organization: "Hancurkan Sisa IMRO"
 BUL_repress_imro_destroy_organization_desc: "Kami akan melakukan operasi militer di sepanjang perbatasan Makedonia untuk membasmi IMRO untuk selamanya."
 BUL_support_imro_make_contacts: "Lakukan Kontak dengan Anggota IMRO"
 BUL_support_imro_make_contacts_desc: "Kami akan menghubungi IMRO secara diam-diam dan memberi tahu para pemimpinnya bahwa kerja sama antara organisasi mereka dan pemerintah Bulgaria akan sangat bermanfaat bagi kedua belah pihak."
 BUL_support_imro_supply_activists: "Pasokan Aktivis IMRO"
 BUL_support_imro_supply_activists_desc: "Kami akan memberikan senjata kepada IMRO sehingga mereka dapat menyusup ke Yugoslavia dan Makedonia Yunani serta mengganggu stabilitas kawasan."
 BUL_support_imro_prepare_bulgarian_occupation: "Siapkan Pendudukan Bulgaria"
 BUL_support_imro_prepare_bulgarian_occupation_desc: "IMRO harus membentuk Komite Aksi Bulgaria yang akan segera mengambil alih otoritas lokal jika terjadi pendudukan Bulgaria di wilayah tersebut."
 BUL_support_imro_militias: "Integrasikan Milisi IMRO"
 BUL_support_imro_militias_desc: "Kita harus memanfaatkan pengalaman kaum revolusioner Makedonia dan membentuk divisi milisi IMRO untuk bertugas di tentara kita."
 BUL_support_imro_garrisons: "Tugas Garnisun IMRO"
 BUL_support_imro_garrisons_desc: "Anggota IMRO akan bekerja lebih baik sebagai penjaga perdamaian di wilayah mereka sendiri, sehingga mereka akan ditugaskan untuk menjaga zona pendudukan kami di seluruh Makedonia."
 BUL_macedonian_revolutionary_organizations_foreign: "$BUL_macedonian_revolutionary_organizations$"
 BUL_macedonian_revolutionary_organizations_foreign_desc: "IMRO, sebuah organisasi pro-Bulgaria yang telah terlalu lama menjadi momok di Balkan, kini didukung dan dipersenjatai oleh Bulgaria, dengan tujuan untuk mengacaukan negara kita dan menyebarkan sentimen Bulgaria di wilayah tersebut. Kita harus mengakhiri organisasi ini dan terornya untuk selamanya."
 BUL_repress_imro_foreign: "Menganiaya Aktivis IMRO"
 BUL_repress_imro_foreign_desc: "Kami akan memburu dan mengadili setiap agitator atau aktivis revolusioner yang beroperasi di wilayah kami."
 BUL_destroy_imro_foreign: "Hancurkan IMRO"
 BUL_destroy_imro_foreign_desc: "Kita harus melakukan operasi militer di seluruh Makedonia untuk membasmi IMRO untuk selamanya."
