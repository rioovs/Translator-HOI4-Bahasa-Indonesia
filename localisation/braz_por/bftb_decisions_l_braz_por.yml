 GRE_invest_back_into_neglected_siberian_regions_desc: "Kami akan menawarkan [FROM.GetNameDefCap] untuk berinvestasi di wilayah mereka yang paling terabaikan, sebagai bentuk timbal balik yang memungkinkan kami mengurangi pengaruh [FROM.GetAdjective] terhadap kami."
