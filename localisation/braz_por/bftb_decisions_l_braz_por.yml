 GRE_hold_national_showcase_for_investors_eng: "Adakan Pameran Nasional untuk [FROM.GetAdjective] Investor"
 GRE_hold_national_showcase_for_investors_eng_desc: "Kita akan mengadakan pertunjukan besar di sini, di tempat lahirnya peradaban Barat dengan harapan dapat menarik investasi ke sektor industri kita yang miskin."
 GRE_trade_manufactured_ship_parts_for_investment: "Perdagangkan Suku Cadang Kapal yang Diproduksi untuk Investasi"
 GRE_trade_manufactured_ship_parts_for_investment_desc: "Dengan membantu Inggris mempertahankan Angkatan Laut Kerajaan mereka, kami dapat memastikan bahwa kami akan menerima investasi yang jauh lebih besar daripada yang kami terima dalam keadaan normal."
