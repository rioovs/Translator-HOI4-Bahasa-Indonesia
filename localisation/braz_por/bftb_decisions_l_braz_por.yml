 GRE_investment_decisions_category: "Skema Investasi"
 GRE_investment_decisions_category_desc: "Kesalahan pengelolaan ekonomi selama beberapa dekade oleh pemerintahan masa lalu dan penyalahgunaan kekuasaan asing yang merajalela telah membuat negara kita kekurangan landasan industri yang kuat. Kenyataan yang menyedihkan dari situasi ini adalah bahwa untuk mencapai potensi tertinggi kita, kita mungkin harus meminta bantuan dari beberapa negara yang sama yang telah meninggalkan kita pada posisi ini."
 GRE_invite_politicians_for_investment_talks_in_capital: "Undang Politisi untuk Pembicaraan Investasi"
 GRE_invite_politicians_for_investment_talks_in_capital_desc: "Undangan ke negara kita yang prestisius di mana kita dapat memamerkan potensi besar dari sumber daya manusia dan sektor manufaktur kita akan membuahkan hasil jika kita mendekati orang yang tepat!"
 GRE_hold_national_showcase_for_investors_ger: "Adakan Pameran Nasional untuk [FROM.GetAdjective] Investor"
 GRE_hold_national_showcase_for_investors_ger_desc: "Kita akan mengadakan pertunjukan besar di sini, di tempat lahirnya peradaban Barat dengan harapan dapat menarik investasi ke sektor industri kita yang miskin."
 GRE_exploit_errata_in_schachtplan: "Eksploitasi Errata di Schachtplan"
 GRE_exploit_errata_in_schachtplan_desc: "Schachtplan hanyalah salah satu skema kriminal [FROM.GetAdjective] untuk menjarah negara-negara Eropa yang lebih miskin, seharusnya mudah untuk merancang skenario di mana [FROM.GetAdjective] akan diwajibkan membantu kita untuk melakukan perubahan dan tanpa ikatan apa pun."
 GRE_rebuke_german_investment: "Tegur [FROM.GetAdjective] Investasi"
 GRE_invite_entrepreneurs_for_investment_talks_in_capital: "Undang Pengusaha untuk Bicara Investasi"
