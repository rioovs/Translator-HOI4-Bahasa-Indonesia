 TUR_appoint_nihal_atziz_as_president: "Tunjuk Nihal Atsiz sebagai Presiden"
 TUR_appoint_nihal_atziz_as_president_desc: "Nihal Atsız telah berperan penting dalam membantu mewujudkan impian Turanist kami. Dengan dukungan rakyat, adalah bijaksana untuk mengangkat posisinya."
 TUR_the_fading_father_category: "Ayah yang Memudar"
 TUR_the_fading_father_category_desc: "Bapak Bangsa Turki, Mustafa Kemal Atatürk, semakin sering jatuh sakit. Kita harus menghadapi kenyataan yang tidak menguntungkan bahwa bapak pendiri bangsa kita yang bersifat mesianis mungkin tidak dapat hidup untuk melihat [ROOT.GetNameDef] bertahan hingga akhir krisis yang sedang dihadapi dunia saat ini.\n\nSituasi kesehatan Atatürk saat ini adalah: [ROOT.GetAtaturkHealthBar]."
 TUR_ataturk_health_worsening_crisis: "Kondisi Atatürk yang Memburuk"
 TUR_ataturk_health_worsening_crisis_desc: "Seiring bertambahnya usia Mustafa Kemal Atatürk, periode penyakitnya akan semakin parah. Berapa lama sebelum Bapak Bangsa Turki ini jatuh sakit dan tidak dapat pulih lagi?"
 TUR_seek_treatment_for_ataturk: "Carilah Perawatan untuk Atatürk"
 TUR_seek_treatment_for_ataturk_desc: "Jika Ghazi kita ingin bertahan dalam beberapa tahun ke depan, maka sangat penting bagi dia untuk mengambil waktu sejenak dari pekerjaan yang penuh tekanan dalam menjalankan negara kita. Kami akan mengirimnya ke seluruh dunia untuk dirawat di sanatorium paling mutakhir dan bersantai di resor terbaik dunia."
 TUR_worsen_ataturks_health_effect_tt: "§YMustafa Kemal Atatürk§! akan kurang efisien sebagai seorang pemimpin karena §Rkesehatannya sedang buruk§!."
 TUR_retire_ataturk: "Pensiun Atatürk"
 TUR_retire_ataturk_desc: "Ini adalah hal yang menyedihkan untuk dipertimbangkan, tapi mungkin Ghazi kita akan lebih baik jika menghabiskan hari-hari terakhirnya bersama keluarganya dan bepergian ke benua itu sesuai keinginannya sendiri. Kita tidak bisa terus-menerus mengambil nyawanya dengan egois: tidak setelah dia berkorban begitu banyak demi negara dan rakyatnya."
 TUR_ataturk_health_poor_tt: "§YMustafa Kemal Atatürk§! akan dianggap dalam kondisi §Ymiskin§! kesehatan."
 TUR_ataturk_health_terminal_tt: "§YMustafa Kemal Atatürk§! akan dirawat paliatif karena kondisi §Yterminal§! miliknya."
 TUR_ataturk_health_stable: "§YStabil§!"
 TUR_ataturk_health_poor: "§YMiskin§!"
 TUR_ataturk_health_terminal: "§RTerminal§!"
 TUR_acquiesce_to_fundamentalists_tt: "Hal ini dan hingga §Y2§! tambahan £faction_tur_traditionalist §YNegara-negara tradisionalis§! akan mulai lebih banyak bekerja sama dengan pemerintah."
 the_national_oath_category: "Sumpah Nasional"
 the_national_oath_category_desc: "Kekaisaran Ottoman harus jatuh; hal itu tidak bisa dihindari dan juga diperlukan. Namun, kita kehilangan lebih dari yang kita pertaruhkan ketika kita harus menandatangani Perjanjian Lausanne pada tahun 1923, dan sudah lewat waktunya kita mendapatkan kembali apa yang telah dicuri dari kita."
 restore_the_borders_of_1920: "Mengembalikan Perbatasan tahun 1920"
 restore_the_borders_of_1920_desc: "Dengan proklamasi ini, Perjanjian Lausanne pada akhirnya dibatalkan dan kita benar-benar bebas dari kuk imperialis."
 form_turan_category: "Bentuk Kekaisaran Turanian"
 form_turan_category_desc: "Selama ini Turan lebih terlihat seperti khayalan dibandingkan kenyataan, namun sekarang kita mempunyai kesempatan untuk menyatukan seluruh masyarakat Turki di dunia di bawah satu bendera. Bagaimana kami bisa menolak?"
 form_turan: "Bentuk Turan"
 form_turan_desc: "Dengan bersatunya Turan, status kita sebagai Kekuatan Besar dunia akan ditegaskan. Rakyat Turki tidak akan lagi ditindas oleh kekuatan lain."
