 BUL_ff_root_out_sympathizers: "Membasmi Simpatisan Front Tanah Air"
 BUL_ff_root_out_sympathizers_desc: "Mereka yang secara terbuka bersimpati dengan Front Tanah Air dan mendukung cita-cita mereka harus diburu dan diadili."
 BUL_ff_massive_arrests: "Penangkapan Besar-besaran"
 BUL_ff_massive_arrests_desc: "Tindakan yang lebih drastis diperlukan untuk mengakhiri ancaman yang ditimbulkan oleh Front Tanah Air. Kami akan melakukan penggerebekan besar-besaran, menangkap siapa pun yang terkait dengan organisasi tersebut."
 BUL_ff_deal_the_final_blow: "Hadapi Pukulan Terakhir"
 BUL_ff_deal_the_final_blow_desc: "Kita telah melemahkan kaum komunis secara kritis dan nasib revolusi Front Tanah Air berada di ujung tanduk... Sebuah benang merah akan segera kita potong!"
 BUL_ff_approaching_faction_timer_effects_tt: "Faksi tersebut akan bergabung dengan Front Tanah Air, mengurangi hari dari misi §YMendatang Kudeta Front Tanah Air§!, berdasarkan §Ypopularitas faksi§!. §YLoyalitas fraksi§! terhadap pemerintah akan sedikit mengurangi dampaknya."
 BUL_ff_approaching_faction_cw_effects_tt: "Jika faksi ini bergabung dengan Front Tanah Air, pemberontakan akan semakin intensif."
 BUL_ff_preventive_action_taken_tt: "Mengurangi kemungkinan Front Tanah Air melakukan kudeta sebesar §G[?BUL.BUL_ff_preventive_actions_base_value]%§!.\nNilai dibatasi pada §Y[?BUL.BUL_ff_preventive_actions_cap_value]%§!."
