 BUL_fate_of_the_balkans_bring_back_state: "Bawa Kembali [FROM.GetName]"
 BUL_fate_of_the_balkans_bring_back_state_desc: "Kami akan mengirimkan misi diplomatik ke [FROM.Controller.GetNameDef] untuk menuntut pengalihan [FROM.GetName] ke [ROOT.GetNameDef], yang merupakan miliknya secara sah."
 BUL_fate_of_the_balkans_demand_submission: "Tundukkan [FROM.GetNameDef]"
 BUL_fate_of_the_balkans_demand_submission_desc: "Delegasi [ROOT.GetAdjective] akan dikirim ke ibukota [FROM.GetAdjective] untuk menuntut pengakuan [ROOT.GetNameDef] sebagai penguasa [FROM.GetName]."
 BUL_fate_of_the_balkans_demand_submission_tt: "Memiliki kekuatan militer yang lebih besar dari [FROM.GetNameDef] meningkatkan kemungkinan mereka tunduk pada keinginan kita."
 BUL_dominance_in_the_seas: "Dominasi di Lautan"
 BUL_dominance_in_the_black_sea_mission: "Dominasi di Laut Hitam"
 BUL_dominance_in_the_black_sea_mission_desc: "Kita harus mengamankan Laut Hitam, menghilangkan segala kemungkinan ancaman dari pantainya dan merebut wilayah baru untuk meningkatkan produksi kapal perang guna memastikan dominasi Bulgaria di lautan."
 BUL_dominance_in_the_aegean_sea_mission: "Dominasi di Laut Aegea"
 BUL_dominance_in_the_aegean_sea_mission_desc: "Kita harus mengamankan Laut Aegea, menghilangkan segala kemungkinan ancaman dari pantainya dan merebut wilayah baru untuk meningkatkan produksi kapal perang guna memastikan dominasi Bulgaria di lautan."
 BUL_dominance_in_the_adriatic_sea_mission: "Dominasi di Laut Adriatik"
 BUL_dominance_in_the_adriatic_sea_mission_desc: "Kita harus mengamankan Laut Adriatik, menghilangkan segala kemungkinan ancaman dari pantainya dan merebut wilayah baru untuk meningkatkan produksi kapal perang guna memastikan dominasi Bulgaria di lautan."
 BUL_appoint_tsankov: "Tunjuk Aleksandar Tsankov sebagai Perdana Menteri"
 BUL_appoint_tsankov_desc: "Sudah waktunya untuk mengubah arah menuju kebijakan yang lebih radikal. Aleksandar Tsankov dan Gerakan Sosial Nasionalnya paling cocok untuk memimpin negara ini."
 BUL_appoint_georgiev: "Tunjuk Kimon Georgiev sebagai Perdana Menteri"
 BUL_appoint_georgiev_desc: "Kimon Georgiev telah menjadi salah satu tokoh terpenting di Front Tanah Air, inilah saatnya untuk mengakui jasanya dan menawarinya posisi Perdana Menteri [ROOT.GetNameDef]."
 BUL_balkan_confederation_industrial_investment: "Investasi industri di [FROM.GetNameDef]"
 BUL_balkan_confederation_industrial_investment_desc: "Untuk mempengaruhi pemerintahan [FROM.GetAdjective], kami akan mendorong para raja industri [BUL.GetAdjective] untuk melakukan serangkaian investasi yang akan memungkinkan pengembangan anak perusahaan [BUL.GetAdjective] di [FROM.GetNameDef], sehingga meningkatkan industri nasionalnya dan, secara bersamaan, meningkatkan kendali kita terhadapnya."
 BUL_balkan_confederation_capital_injection: "Suntikan Modal di [FROM.GetNameDef]"
 BUL_balkan_confederation_capital_injection_desc: "Kami akan memberikan dukungan keuangan kepada perusahaan [FROM.GetAdjective] yang sedang kesulitan untuk menstabilkan sektor keuangan negara dan meningkatkan kendali [BUL.GetAdjective] atas perekonomian [FROM.GetNameDef]."
 BUL_balkan_confederation_balkan_summit: "Menyelenggarakan KTT Balkan"
 BUL_balkan_confederation_balkan_summit_desc: "Kami akan mengundang semua negara bebas di Balkan untuk menghadiri KTT Balkan. Acara ini akan memungkinkan kita untuk secara halus mempromosikan ide-ide kita dan meningkatkan pengaruh Bulgaria di negara-negara di kawasan ini."
 BUL_balkan_confederation: "Konfederasi Balkan"
 BUL_balkan_confederation_desc: "[GetABalkanConfederationFocusLoc]"
 BUL_balkan_confederation_ai_tt: "§Y[FROM.GetNameWithFlag]§! akan lebih cenderung menyetujui proposal diplomatik kita."
