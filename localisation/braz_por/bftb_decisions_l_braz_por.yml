 BUL_uranium_concession_agreement: "Perjanjian Konsesi Uranium dengan [FROM.GetNameDef]"
 BUL_uranium_concession_agreement_desc: "Kita tidak dapat memanfaatkan cadangan uranium di tanah kita secara maksimal, dan akan lebih bermanfaat tidak hanya bagi kita, tetapi juga bagi sekutu [FROM.GetAdjective] kita, jika kita menandatangani kontrak yang memberi mereka hak eksploitasi dengan imbalan bahan dan produk yang bermanfaat bagi industri dan pertanian dalam negeri kita."
 BUL_negotiate_claims_in_the_balkans: "Negosiasikan Klaim kami di Balkan"
 BUL_negotiate_claims_in_the_balkans_desc: "Sebelum bersekutu dengan negara besar mana pun, kita harus menegosiasikan tuntutan teritorial kita dengan Jerman. Ketegangan internasional meningkat, dan Bulgaria hanya akan mendukung negara yang menawarkan kesepakatan teritorial terbaik."
 BUL_demand_our_historical_claims: "Tuntut klaim historis kami"
 BUL_secure_occupation_in_balkan_state: "Amankan Pekerjaan di [FROM.GetName]"
 BUL_secure_occupation_in_balkan_state_desc: "Kita harus mengambil peran kita sebagai penjaga perdamaian di Balkan dan mengusulkan sekutu kita untuk memberi kita kendali administratif atas wilayah pendudukan mereka di wilayah tersebut, membebaskan garnisun [ROOT.GetFactionName] asing sehingga mereka dapat memperkuat front lain."
 BUL_secure_occupation_in_balkan_state_tt: "(Negara-negara dengan §YTenaga Kerja§! dan §YPeralatan Infanteri§! yang rendah akan lebih cenderung menerima)"
 BUL_bulgarian_reintegration_campaign: "Kampanye Reintegrasi Bulgaria di [FROM.GetName]"
 bulgarian_territorial_expansion_arranged: "Perluasan Wilayah Bulgaria yang Telah Diatur Sebelumnya"
 BUL_bulgarian_territorial_expansion_arranged_tt: "Negara-negara dengan Pengubah §YPerluasan Wilayah Bulgaria yang Telah Diatur Sebelumnya§! akan dipindahkan ke Bulgaria setelah sekutu faksi mana pun menguasai negara tersebut dan Bulgaria telah bergabung dengan faksi yang sama dengan Jerman"
 BUL_align_bulgaria: "Sejajarkan Bulgaria"
 BUL_align_bulgaria_desc: "Hubungan diplomatik kami dengan Bulgaria telah bersahabat selama beberapa dekade dan, berkat bantuan keuangan kami, pemerintah Bulgaria mampu mengelola utangnya yang melumpuhkan. Sekaranglah waktunya untuk membujuk mereka agar resmi menjadi sekutu [GER.GetNameDef]."
 BUL_germany_donate_fighters: "Donasi Pejuang ke Bulgaria"
 BUL_germany_donate_fighters_desc: "Kami akan menyumbangkan sejumlah kecil pesawat kepada angkatan udara Bulgaria yang baru dibentuk kembali."
 BUL_germany_demand_military_access: "Menuntut Akses Militer Melalui Bulgaria"
 BUL_germany_demand_military_access_desc: "Kita harus menuntut akses militer melalui Bulgaria, bahkan jika mereka tidak ikut serta dalam serangan kita di Balkan, sehingga pasukan kita dapat menggunakan perbatasan Bulgaria sebagai basis operasi untuk melancarkan invasi ke Yunani."
 BUL_germany_demand_replacement_of_bulgarian_prime_minister: "Menuntut Penggantian Perdana Menteri Bulgaria"
 BUL_germany_demand_replacement_of_bulgarian_prime_minister_desc: "Perdana Menteri Bulgaria Georgi Kyoseivanov telah membuktikan dirinya sebagai politisi yang tidak kompeten, kita harus menyarankan kepada [BUL.GetLeader] agar orang ini digantikan oleh seseorang yang lebih mampu dan lebih dekat dengan cita-cita kita, seperti Bogdan Filov."
 BUL_donate_aircraft_tt: "Jika [BUL.GetNameDef] menerima donasi kami, kami akan meningkatkan opini mereka tentang kami dan memfasilitasi kerja sama antar negara kami."
 BUL_the_balkan_federation_dream: "Impian Federasi Balkan"
 BUL_the_balkan_federation_dream_desc: "[ROOT.GetNameDefCap] harus memperjuangkan pembentukan Federasi Balkan yang kuat untuk menghadapi banyak musuh proletariat, dan membuat negara-negara Balkan memahami bahwa satu-satunya cara untuk menang dalam perjuangan kita adalah dengan mengembangkan kerja sama dan solidaritas di antara rakyat kita, yang pada akhirnya akan mengarah pada penyatuan Balkan..."
 BUL_develop_balkan_federation_project: "Proyek Federasi Balkan"
 BUL_develop_balkan_federation_project_desc: "Kita harus mempertemukan para ahli di berbagai bidang, seperti ekonomi, industri, politik dan masyarakat, untuk menganalisis mengapa proyek Federasi Balkan gagal pada tahun 1920an, dan mengembangkan proyek baru yang inklusif dan lebih baik di mana semua negara Balkan akan diperlakukan secara adil dan setara."
 BUL_balkan_federation_propaganda: "Propaganda Federasi Balkan"
 BUL_balkan_federation_propaganda_desc: "Kami akan mengorganisir kampanye propaganda besar-besaran di [FROM.GetNameDef] untuk memenangkan dukungan rakyat dari massa proletar [FROM.GetAdjective] untuk proyek Federasi Balkan kami."
 BUL_destabilize_country: "Mengganggu kestabilan [FROM.GetNameDef]"
 BUL_destabilize_country_desc: "Kita harus menyusup ke agen [ROOT.GetAdjective] di [FROM.GetNameDef] untuk mengumpulkan aktivis lokal yang mendukung proyek federasi kita, memberi mereka pelatihan dasar, dan membentuk kelompok partisan bersenjata untuk mengacaukan negara."
 BUL_fight_alongside_country_comrades: "Berjuang Bersama Rekan [FROM.GetAdjective] kita"
 BUL_fight_alongside_country_comrades_desc: "Kita harus mendukung perjuangan kawan-kawan kita di [FROM.GetNameDef] dan bergabung di pihak mereka dalam perang saudara [FROM.GetAdjective]."
 BUL_fight_alongside_country_comrades_join_cw_tt: "§Y[ROOT.GetNameWithFlag]§! akan bergabung dengan §Y[FROM.GetNameWithFlag]§! dalam perang saudara mereka."
 BUL_balkan_federation_industrial_aid: "Bantuan Industri untuk [FROM.GetNameDef]"
 BUL_balkan_federation_industrial_aid_desc: "Saat ini kami memberikan bantuan kepada pemerintah [FROM.GetAdjective] untuk mendongkrak industri nasional yang kekurangan [FROM.GetNameDef] sebelum mereka bergabung dengan [ROOT.GetFactionName]."
 BUL_balkan_federation_economic_aid: "Bantuan Ekonomi untuk [FROM.GetNameDef]"
 BUL_balkan_federation_economic_aid_desc: "Saat ini kami memberikan bantuan keuangan kepada pemerintah [FROM.GetAdjective] untuk mencegah keruntuhan perekonomian [FROM.GetNameDef], sebelum mereka bergabung dengan [ROOT.GetFactionName]."
 BUL_balkan_federation_military_aid: "Bantuan Militer untuk [FROM.GetNameDef]"
 BUL_balkan_federation_military_aid_desc: "Kami saat ini memberikan bantuan militer kepada pemerintah [FROM.GetAdjective] untuk melaksanakan operasi membasmi beberapa sel pembangkang di berbagai kota pedesaan sekitar [FROM.Capital.GetName] sebelum mereka bergabung dengan [ROOT.GetFactionName]."
 BUL_balkan_federation_project_ready_flag: "Proyek Federasi Balkan sudah siap."
 BUL_balkan_federation_demand_turkish_territory: "Menuntut Wilayah Turki"
 BUL_balkan_federation_demand_turkish_territory_desc: "Kami akan mengirimkan delegasi diplomatik untuk bernegosiasi dengan [TUR.GetLeader] penyerahan [TUR.GetAdjective] wilayah Balkan ke [BUL.GetNameDef]."
 BUL_plot_against_boris_dec_cat: "Plot Melawan Boris"
 BUL_plot_against_boris_dec_cat_desc: "[GetPlotAgainstBorisFocusLoc]"
 BUL_brainwash_political_prisoners: "Cuci Otak Tahanan Politik"
 BUL_brainwash_political_prisoners_desc: "Salah satu tahanan politik kita akan ditekan dan dipaksa melakukan pekerjaan kotor kita sehingga, jika rencana pembunuhan kita gagal, tidak ada anggota pemerintah yang dapat dikaitkan dengan upaya pembunuhan tersebut."
 BUL_persuade_faction_members: "Membujuk [GetFactionMembersToPersuade] anggota"
 BUL_persuade_faction_members_desc: "Kami akan menawarkan sejumlah besar uang kepada salah satu anggota pemerintah yang anti-Tsar untuk mencari orang yang cocok untuk melaksanakan rencana kami."
 BUL_persuade_zveno_members: "[GetZvenoName]"
 BUL_persuade_bs_members: "[GetBsName]"
 BUL_persuade_bzns_members: "[GetBznsName]"
 BUL_persuade_nsm_members: "[GetNsmName]"
 BUL_persuade_generic_members: "faksi"
 BUL_draw_up_a_plan_for_regicide: "Menyusun Rencana Pembunuhan"
 BUL_draw_up_a_plan_for_regicide_desc: "Sekarang saatnya untuk melakukan persiapan akhir dan memutuskan kapan dan di mana operasi kami akan berlangsung."
 BUL_seek_foreign_support: "Mencari Dukungan Asing"
 BUL_seek_foreign_support_desc: "Kita harus mencari dukungan asing yang membantu kita tidak hanya melakukan pembunuhan Tsar dengan cara yang halus, tetapi juga memberikan kredibilitas pada laporan resmi yang telah disiapkan pemerintah kita agar insiden tersebut diketahui masyarakat."
 BUL_execute_plan: "Jalankan Rencana"
 BUL_execute_plan_desc: "Kita telah diberikan kesempatan sempurna untuk bertindak, sekarang saatnya melaksanakan rencana kita!\nBeristirahatlah dengan tenang, Boris..."
 BUL_has_repressed_faction_tt: "Telah menindas faksi internal mana pun"
 BUL_has_imprisoned_faction_leaders_tt: "Telah memenjarakan para pemimpin faksi internal mana pun"
 BUL_has_integrated_faction_tt: "Telah mengintegrasikan faksi internal mana pun"
 BUL_seek_foreign_support_variable_reduction_tt: "Mengurangi waktu yang dibutuhkan untuk melakukan pembunuhan Tsar Boris."
 BUL_seek_foreign_support_reduced_stability_penalty_tt: "Mengurangi hukuman stabilitas setelah kematian Tsar."
 BUL_assassin_persuaded_flag: "Telah mencuci otak tahanan politik atau membujuk anggota fraksi internal yang terintegrasi"
 BUL_the_fate_of_the_balkans_dec_cat: "Nasib Balkan"
 BUL_the_fate_of_the_balkans_dec_cat_desc: "Bulgaria telah lama tunduk pada kepentingan dan keinginan kekuatan asing...\nTetapi zaman telah berubah, negara kita telah tumbuh lebih kuat dan [ROOT.GetNameDef] kini berada dalam posisi untuk menegaskan supremasinya di Balkan."
 BUL_fate_of_the_balkans_influence_government: "Pengaruh [FROM.GetAdjective] Pemerintah"
 BUL_fate_of_the_balkans_influence_government_desc: "Kami akan menjalin kontak dengan menteri [FROM.GetAdjective] untuk mempengaruhi keputusan pemerintah mereka sesuai dengan kepentingan kami, mendorong mereka untuk mendukung kebijakan luar negeri yang paling nyaman bagi [ROOT.GetNameDef], baik melalui suap atau paksaan."
 BUL_fate_of_the_balkans_influence_government_tt: "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! akan lebih cenderung untuk tunduk ke Bulgaria di masa depan."
 BUL_fate_of_the_balkans_influence_government_autonomy: "Kampanye Propaganda Pro-Bulgaria"
 BUL_fate_of_the_balkans_ultimatum: "Ultimatum untuk [FROM.GetNameDef]"
 BUL_fate_of_the_balkans_ultimatum_desc: "Kami akan mengadakan pertemuan dengan pemerintah [FROM.GetAdjective] untuk menekan mereka agar bergabung dengan [ROOT.GetFactionName] sebagai imbalan atas perlindungan [ROOT.GetAdjective]. Dan kami juga harus menegaskan bahwa pemerintah kami tidak akan menganggap enteng penolakan [FROM.GetAdjective]."
 BUL_fate_of_the_balkans_ultimatum_tt: "Faktor yang mempengaruhi kesediaan menerima [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! : [ROOT.GetUltimatumOpinion] [ROOT.GetUltimatumStrength] [ROOT.GetUltimatumIdeology] [ROOT.GetUltimatumFaction] [ROOT.GetUltimatumInfluence] [ROOT.GetUltimatumNeighbor] [ROOT.GetUltimatumMajor]"
