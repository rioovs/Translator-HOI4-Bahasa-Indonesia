 GRE_host_soviet_bureaucrats_in_greece_desc: "Perwakilan dari [FROM.GetNameDefCap] akan melakukan tur ke negara kami dan kemudian memutuskan apakah mereka ingin melakukan investasi moderat di industri militer kami."
