l_braz_por:
 GRE_1936_election_category: "Pemilu 1936"
 GRE_1936_election_category_desc: "Pemilu pertama sejak George II kembali naik takhta akan diadakan sebelum akhir bulan ini. George II bertekad untuk tidak dipaksa turun tahta lagi dan dikatakan siap melakukan apa pun yang diperlukan untuk menjaga keamanan pemerintahannya.\n\nNamun, unsur-unsur tentara kita masih menyimpan kesetiaan tersembunyi kepada Eleftherios Venizelos yang populer di pengasingan, dan mereka mungkin bisa mengamankan pemilu yang bebas dan adil untuk Yunani melalui penggunaan beberapa... taktik tangan besi."
 GRE_the_election_of_1936: "Pemilihan Parlemen Yunani tahun 1936"
 GRE_the_election_of_1936_desc: "Pemilu pertama sejak George II kembali naik takhta akan diadakan sebelum akhir bulan ini. George II bertekad untuk tidak dipaksa turun tahta lagi dan dikatakan siap melakukan apa pun yang diperlukan untuk menjaga keamanan pemerintahannya."
 GRE_1936_election_tt: "Jika Raja §YGeorge II§! tidak ditangkap, maka dia akan ikut campur dalam pemilu bulan Januari dan memastikan para pendukung monarki mempertahankan mandat pemerintahan mereka."
 GRE_put_the_king_under_house_arrest: "Tempatkan Raja Di Bawah Tahanan Rumah"
 GRE_put_the_king_under_house_arrest_desc: "Jika kita menghentikan campur tangan Raja George II dalam proses demokrasi Yunani, maka kelompok Venezel yang lebih populer pasti akan memenangkan pemilu."
 GRE_1936_arrest_the_king_tt: "Raja akan ditangkap dan §YVenezelis§! akan memenangkan pemilu."
 GRE_king_arrested: "Raja Ditempatkan Di Bawah Tahanan Rumah"
 GRE_civil_war_imminent: "Perang Saudara Segera Terjadi!"
 GRE_civil_war_imminent_desc: "Ketegangan antara kaum republiken dan kaum monarki mulai memuncak, dan perang saudara nampaknya menjadi sebuah keniscayaan yang tidak dapat dihindari..."
