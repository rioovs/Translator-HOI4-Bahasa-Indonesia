 GRE_go_to_paris_to_negotiate_investment_talks: "Pergi ke Paris untuk Merundingkan Pembicaraan Investasi"
 GRE_go_to_paris_to_negotiate_investment_talks_desc: "Pertemuan dengan orang-orang yang tepat di Paris di mana kita dapat menunjukkan potensi besar dari masyarakat dan sektor manufaktur kita dapat memberikan manfaat yang besar bagi negara kita."
 GRE_hold_national_showcase_for_investors_fra: "Adakan Pameran Nasional untuk [FROM.GetAdjective] Investor"
 GRE_hold_national_showcase_for_investors_fra_desc: "Kita akan mengadakan pertunjukan besar di sini, di tempat lahirnya peradaban Barat dengan harapan dapat menarik investasi ke sektor industri kita yang miskin."
