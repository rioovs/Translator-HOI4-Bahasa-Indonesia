 BUL_internal_factions: "Manajemen Fraksi"
 BUL_internal_factions_desc: "Masyarakat dan politik Bulgaria terbagi menjadi beberapa faksi, yang berupaya untuk memenangkan dukungan pemerintah atau menghasut massa untuk menentangnya. Pemerintah Bulgaria harus memutuskan faksi mana yang dapat melayani kepentingannya dan faksi mana yang merupakan ancaman yang harus diberantas, demi kepentingan bangsa."
