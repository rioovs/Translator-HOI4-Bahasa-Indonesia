 GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc: "[FROM.GetNameDef] telah lama diperbudak oleh serikat pekerjanya, jadi dengan membantu serikat pekerja menimbulkan ketidakstabilan, kita memperbaiki posisi tawar kita dengan menggunakan pemerasan."
