 GRE_attend_talks_with_the_presidium_desc: "Kami akan mengirimkan perwakilan dari negara kami ke presidium di [FROM.GetNameDefCap] untuk membahas potensi negara kami untuk membujuk mereka agar melakukan investasi kecil di industri militer kami."
