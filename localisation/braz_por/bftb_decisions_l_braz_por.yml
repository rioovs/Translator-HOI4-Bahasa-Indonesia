 BUL_foreign_agreements_desc: "Kita harus fokus pada pembentukan perjanjian yang menguntungkan dengan perusahaan asing terkemuka yang ingin mendirikan anak perusahaan di Bulgaria atau berinvestasi dalam pengembangan industri dalam negeri kita."
