 # Medals
 CAREER_PROFILE_STALWART_DEFENDER_MEDAL: "Pembela yang Kuat"
 CAREER_PROFILE_STALWART_DEFENDER_MEDAL_DESCRIPTION: "Berhasil mempertahankan diri dari sejumlah serangan musuh."
 CAREER_PROFILE_SHIELD_MEDAL: "Perisai"
 CAREER_PROFILE_SHIELD_MEDAL_DESCRIPTION: "Mintalah sebuah divisi mencapai total bonus pertahanan tertentu."
 CAREER_PROFILE_MILITARY_PLANNER_MEDAL: "Perencana Militer"
 CAREER_PROFILE_MILITARY_PLANNER_MEDAL_DESCRIPTION: "Mintalah sebuah divisi mencapai bonus persentase perencanaan tertentu."
 CAREER_PROFILE_COMBAT_EFFICIENCY_MEDAL: "Efisiensi Tempur"
 CAREER_PROFILE_COMBAT_EFFICIENCY_MEDAL_DESCRIPTION: "Hancurkan sejumlah divisi yang terkena dampak pengubah tempur \"Dilingkari\"."
 CAREER_PROFILE_GRAND_ENCIRCLEMENT_MEDAL: "Pengepungan Besar"
 CAREER_PROFILE_GRAND_ENCIRCLEMENT_MEDAL_DESCRIPTION: "Kelilingi sejumlah divisi musuh di satu provinsi."
 CAREER_PROFILE_MILITARY_MASTERY_MEDAL: "Penguasaan Militer"
 CAREER_PROFILE_MILITARY_MASTERY_MEDAL_DESCRIPTION: "Bertarunglah dengan sejumlah pengubah positif yang memengaruhi pertempuran."
 CAREER_PROFILE_TURNING_THE_TIDE_MEDAL: "Membalikkan Arus"
 CAREER_PROFILE_TURNING_THE_TIDE_MEDAL_DESCRIPTION: "Saat berperang, kerahkan sejumlah divisi militer dalam jangka waktu 48 jam. Ukuran divisi minimum: 5 batalyon."
 CAREER_PROFILE_LORD_OF_THE_SEAS_MEDAL: "Penguasa Lautan"
 CAREER_PROFILE_LORD_OF_THE_SEAS_MEDAL_DESCRIPTION: "Membangun setidaknya 75% Dominasi Angkatan Laut di sejumlah wilayah laut yang diperebutkan."
 CAREER_PROFILE_VETERANCY_MEDAL: "Veteranitas"
 CAREER_PROFILE_VETERANCY_MEDAL_DESCRIPTION: "Memiliki pasukan yang terdiri dari sejumlah divisi veteran tertentu."
 CAREER_PROFILE_SKY_SUPPLIES_MEDAL: "Persediaan Langit"
 CAREER_PROFILE_SKY_SUPPLIES_MEDAL_DESCRIPTION: "Mintalah pesawat angkut menyediakan pasokan dalam jumlah tertentu ke suatu wilayah."
 CAREER_PROFILE_PARADROP_MEDAL: "terjun payung"
 CAREER_PROFILE_PARADROP_MEDAL_DESCRIPTION: "Jalankan rencana pertempuran paradrop menggunakan sejumlah divisi penerjun payung tertentu. Ukuran divisi minimum: 5 batalyon."
 CAREER_PROFILE_NAVAL_INVASION_MEDAL: "Invasi Angkatan Laut"
 CAREER_PROFILE_NAVAL_INVASION_MEDAL_DESCRIPTION: "Dalam waktu 96 jam, laksanakan rencana invasi angkatan laut menggunakan sejumlah divisi tertentu. Ukuran divisi minimum: 5 batalyon."
 CAREER_PROFILE_LAND_ACQUISITION_MEDAL: "Pembebasan Tanah"
 CAREER_PROFILE_LAND_ACQUISITION_MEDAL_DESCRIPTION: "Melalui pertempuran darat, raih (dan pertahankan) sejumlah provinsi tambahan dalam jangka waktu 48 jam."
 CAREER_PROFILE_RAINING_DEBRIS_MEDAL: "Hujan Puing"
 CAREER_PROFILE_RAINING_DEBRIS_MEDAL_DESCRIPTION: "Menembak jatuh sejumlah pesawat dalam jangka waktu 48 jam."
 # Ribbons
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE: "Serangan adalah Pertahanan Terbaik"
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_DESCRIPTION: "Selama 2 tahun, terlibat dalam pertempuran ofensif dua kali lebih banyak daripada pertempuran defensif, dengan minimal 100 pertempuran."
 CAREER_PROFILE_OFFENSE_IS_THE_BEST_DEFENSE_QUOTE: "\"Jika Anda berada dalam pertarungan yang adil, Anda tidak merencanakan misi Anda dengan benar.\"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND: "Melewati Bukan Berkeliling"
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_DESCRIPTION: "Berhasil menyerang dan menguasai area dengan benteng level 10 di dalamnya."
 CAREER_PROFILE_GOING_THROUGH_NOT_AROUND_QUOTE: "\"Dari setiap seratus orang, sepuluh orang seharusnya tidak berada di sana, delapan puluh hanyalah target, sembilan adalah pejuang sejati, dan kita beruntung memiliki mereka, karena mereka yang melakukan pertempuran. Ah, tapi yang satu, yang satu adalah pejuang, dan dia akan membawa yang lain kembali.\"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS: "Jalannya Tertutup"
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_DESCRIPTION: "Raih bonus pertahanan 400%."
 CAREER_PROFILE_YOU_SHALL_NOT_PASS_QUOTE: "\"Pertempuran bukanlah saat dimana kamu bisa mati -- meskipun hal itu memang terjadi -- ini adalah saat dimana kamu mengetahui apakah kamu dapat terus hidup. Jangan meremehkan kekuatan dari wahyu tersebut. Jangan meremehkan hal-hal yang akan dipertaruhkan oleh para remaja putra untuk memainkan permainan itu sekali lagi.\"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS: "Seribu Matahari Indah"
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_DESCRIPTION: "Meledakkan 3 bom atom dalam jangka waktu 12 jam di antara ledakan."
 CAREER_PROFILE_THOUSAND_SPLENDID_SUNS_QUOTE: "\"Sampai saat ini manusia harus hidup dengan gagasan tentang kematian sebagai seorang individu; mulai saat ini umat manusia harus hidup dengan gagasan tentang kematiannya sebagai suatu spesies.\"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST: "Senjata Agustus"
 CAREER_PROFILE_THE_GUNS_OF_AUGUST_DESCRIPTION: "Memiliki setidaknya 15 pertempuran bersamaan yang didukung oleh pemboman senjata kereta api."
 CAREER_PROFILE_THE_GUNS_OF_AUGUST_QUOTE: "\"Lebih mudah menemukan laki-laki yang bersedia mati dengan sukarela, daripada menemukan orang yang bersedia menanggung kesakitan dengan penuh kesabaran.\"
 CAREER_PROFILE_LEARNING_ON_THE_JOB: "Belajar sambil Bekerja"
 CAREER_PROFILE_LEARNING_ON_THE_JOB_DESCRIPTION: "Mintalah seorang komandan (tidak termasuk komandan divisi) meningkatkan keterampilannya empat kali lipat."
 CAREER_PROFILE_LEARNING_ON_THE_JOB_QUOTE: "\"Dibutuhkan 15.000 korban untuk melatih seorang mayor jenderal.\"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE: "Mereka Datang Dari Atas"
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_DESCRIPTION: "Jalankan rencana paradrop menggunakan 15 divisi penerjun payung."
 CAREER_PROFILE_THEY_CAME_FROM_ABOVE_QUOTE: "\"Mereka menabur angin, dan sekarang mereka akan menuai angin puyuh.\"
 CAREER_PROFILE_COORDINATED_INVASION: "Invasi Terkoordinasi"
 CAREER_PROFILE_COORDINATED_INVASION_DESCRIPTION: "Jalankan 4 invasi angkatan laut secara bersamaan untuk 4 zona pendaratan berbeda."
 CAREER_PROFILE_COORDINATED_INVASION_QUOTE: "\"Pertempuran dimenangkan dengan pembantaian dan manuver. Semakin hebat sang jenderal, semakin banyak kontribusinya dalam manuver, semakin sedikit tuntutan yang dia perlukan dalam pembantaian.\"
 CAREER_PROFILE_NOT_SO_FAST: "Tidak begitu cepat"
 CAREER_PROFILE_NOT_SO_FAST_DESCRIPTION: "Menyerbu divisi musuh."
 CAREER_PROFILE_NOT_SO_FAST_QUOTE: "\"Kalau bahasa daerahnya kekerasan, fasih.\"
 CAREER_PROFILE_TANKS_NO_THANKS: "Tank, tidak, terima kasih"
 CAREER_PROFILE_TANKS_NO_THANKS_DESCRIPTION: "Menyerbu divisi tank musuh."
 CAREER_PROFILE_TANKS_NO_THANKS_QUOTE: "\"Ketika semua sudah dikatakan dan dilakukan, tangki adalah kotak baja kecil yang diisi dengan bahan mudah terbakar atau meledak yang mudah diubah menjadi krematorium bergerak untuk awaknya yang sangat terampil.\"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE: "Kita Akan Bertarung dalam Bayangan"
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_DESCRIPTION: "Menyebarkan lebih dari 5000 pesawat ke satu wilayah udara."
 CAREER_PROFILE_WE_SHALL_FIGHT_IN_THE_SHADE_QUOTE: "\"Pesawat terbang mengalami begitu banyak kesalahan teknis sehingga hanya masalah waktu sebelum orang berakal sehat menyadari bahwa mereka tidak berguna!\"
 CAREER_PROFILE_ACES_HIGH: "As Tinggi"
 CAREER_PROFILE_ACES_HIGH_DESCRIPTION: "Mintalah 20 ace menggunakan bandara yang sama sebagai markas mereka."
 CAREER_PROFILE_ACES_HIGH_QUOTE: "\"Langit adalah medan perang mereka. Mereka adalah Kavaleri Awan.\"
 CAREER_PROFILE_BEHIND_ENEMY_LINES: "Dibalik Garis Musuh"
 CAREER_PROFILE_BEHIND_ENEMY_LINES_DESCRIPTION: "Kendalikan ibukota musuh menggunakan perintah paradrop."
 CAREER_PROFILE_BEHIND_ENEMY_LINES_QUOTE: "\"Kami adalah letnan pasukan terjun payung. Kami seharusnya dikepung.\"
# First Startup Splash Screen Text
 SUB_MESSAGE_SPLASHSCREEN_TITLE: "Hasilkan Medali & Pita untuk hasil yang menonjol di medan perang!"
 SUB_MESSAGE_SPLASHSCREEN_DESC: "Medali dan Pita adalah bentuk tantangan dan penghargaan baru yang dapat diperoleh dalam permainan non-ironman. Lihat daftar di Profil Karir Anda dan bandingkan statistik dan medali Anda dengan teman-teman.\n\nSelain itu, Profil Karir sekarang mendukung pengumpulan statistik untuk mod!"
# Backup Flavor Texts
 CAREER_PROFILE_BACKUP_QUOTE_01: "\"Akulah Pukulan Tuhan. Sekiranya kamu tidak melakukan dosa besar, niscaya Tuhan tidak akan mengirimkan hukuman sepertiku kepadamu.\"
 CAREER_PROFILE_BACKUP_QUOTE_02: "\"Ada tiga jenis orang: Mereka yang tidak bergerak, mereka yang bergerak, dan mereka yang menggerakkan mereka.\"
 CAREER_PROFILE_BACKUP_QUOTE_03: "\"...orang-orang yang memadamkan badai dan mengendarai guntur.\"
 CAREER_PROFILE_BACKUP_QUOTE_04: "\"Pukul orang lain, secepat yang Anda bisa, dan sekuat yang Anda bisa, di tempat yang paling menyakitkan baginya, saat dia tidak melihat.\"
 CAREER_PROFILE_BACKUP_QUOTE_05: "\"Saat kamu pulang, beri tahu mereka tentang kami dan katakan, untuk hari esok mereka, kami memberikan hari ini.\"
 CAREER_PROFILE_BACKUP_QUOTE_06: "\"Apa pun yang patut diperjuangkan, patut diperjuangkan secara kotor.\"
 CAREER_PROFILE_BACKUP_QUOTE_07: "\"Saya akan kembali secepat mungkin dengan membawa sebanyak yang saya bisa. Sementara itu, Anda harus bertahan!\"
 CAREER_PROFILE_BACKUP_QUOTE_08: "\"Dari suatu tempat artileri musuh terbangun dan peluru-peluru datang mendekat - kamu bisa menghitungnya saat mereka datang. Dan kemudian kamu tidak bisa menghitungnya; mereka jatuh tidak dalam urutan yang teratur, satu-dua-tiga, tapi dengan sadar mengetahui di mana kita berada- ke kiri, ke kanan, ke depan, ke belakang, terhempas seperti tong sampah besar yang diangkut oleh manusia raksasa. Tanah yang pecah menimpa kami, bebatuan yang pecah berhamburan ke bebatuan lereng bukit yang tak terputus. Malam yang semakin larut terasa nyaring di tengah malam kami. telinga.\"
 CAREER_PROFILE_BACKUP_QUOTE_09: "\"O kemana kamu akan pergi ketika kilatan cahaya yang menyilaukan, menebarkan benih sejuta matahari? Dan apa yang akan kamu lakukan di tengah hujan abu? Namun bagaimana jadinya ketika kilatan cahaya yang menyilaukan, mengganggu jalinan erat tubuhmu, menyinari tulang-tulang indahmu? Apa yang akan kamu kenakan di tengah hujan abu?\"
 CAREER_PROFILE_BACKUP_QUOTE_10: "\"Baca berulang kali kampanye Alexander, Hannibal, Caesar, Gustavus, Turenne, Eugene dan Frederic. Ini adalah satu-satunya cara untuk menjadi jenderal hebat dan menguasai rahasia seni perang.\"
 CAREER_PROFILE_BACKUP_QUOTE_11: "\"Saya harus belajar politik dan perang, agar putra-putra saya mempunyai kebebasan untuk belajar matematika dan filsafat... agar anak-anak mereka berhak belajar seni lukis, puisi, dan musik.\"
 CAREER_PROFILE_BACKUP_QUOTE_12: "\"Seluruh lautan tidak dapat menenggelamkan sebuah kapal, kecuali kapal itu masuk ke dalamnya.\"
 CAREER_PROFILE_BACKUP_QUOTE_13: "\"Berlayarlah seperti kamu mencurinya.\"
 CAREER_PROFILE_BACKUP_QUOTE_14: "\"Mereka sangat banyak, dan kita sangat sedikit, bagaimana kita akan mengubur mereka semua?\"
 CAREER_PROFILE_BACKUP_QUOTE_15: "\"Dibutuhkan seorang pemberani untuk menjadi seorang pengecut di Tentara Merah.\"
 CAREER_PROFILE_BACKUP_QUOTE_16: "\"Namamu tidak diketahui. Perbuatanmu abadi.\"
 CAREER_PROFILE_BACKUP_QUOTE_17: "\"Mati demi Kaisar berarti hidup selamanya.\"
 CAREER_PROFILE_BACKUP_QUOTE_18: "\"Sun Tzǔ berkata: Dalam praktik seni perang, hal terbaik dari semuanya adalah merebut negara musuh secara utuh dan utuh; menghancurkan dan menghancurkannya tidaklah baik.\"
 CAREER_PROFILE_BACKUP_QUOTE_19: "\"Semua manusia adalah saudara, ibarat lautan di seluruh dunia; Lalu mengapa angin dan ombak berbenturan begitu dahsyat di mana-mana?\"
 CAREER_PROFILE_BACKUP_QUOTE_20: "\"Facta non-Verba.\"
 CAREER_PROFILE_BACKUP_QUOTE_21: "\"Perang adalah kehidupan yang dikalikan dengan angka tertentu yang belum pernah didengar oleh siapa pun.\"
 CAREER_PROFILE_BACKUP_QUOTE_22: "\"Penyebabnya tidak harus benar dan pertempuran tidak harus dapat dimenangkan; namun berulang kali sepanjang sejarah, manusia memilih mati dalam pertempuran dengan teman-temannya daripada melarikan diri sendiri dan bertahan hidup.\"
 CAREER_PROFILE_BACKUP_QUOTE_23: "\"Masalahnya dengan rasa takut, bagaimanapun, adalah bahwa rasa takut tidak hanya terjadi pada satu hal saja. Rasa takut mempunyai taksonomi yang lengkap—kecemasan, ketakutan, panik, firasat—dan Anda bisa bersiap menghadapi satu bentuk dan benar-benar hancur ketika menghadapi bentuk yang lain.\"
 CAREER_PROFILE_BACKUP_QUOTE_24: "\"Warga sipil menolak keras untuk menyadari bahwa salah satu hal yang paling traumatis dalam pertempuran adalah harus menyerah. Perang jelas-jelas jahat dan salah sehingga gagasan bahwa ada sesuatu yang baik di dalamnya hampir terasa seperti kata-kata kotor.\"
 CAREER_PROFILE_BACKUP_QUOTE_25: "\"Pertempuran menyumbat begitu banyak adrenalin dalam sistem tubuh Anda sehingga rasa takut jarang menjadi masalah; yang lebih menunjukkan keberanian nyata adalah apa yang Anda rasakan sebelum operasi besar, ketika dampak kehilangan nyawa benar-benar memiliki peluang untuk meresap. Kelemahan pribadi saya bukanlah rasa takut, melainkan antisipasi terhadap hal tersebut.\"
 CAREER_PROFILE_BACKUP_QUOTE_26: "\"Garis Maginot diamankan, gencatan senjata disepakati, dan saya berjanji untuk tidak menginvasi Polandia.\"
 CAREER_PROFILE_BACKUP_QUOTE_27: "\"Satu-satunya hal yang lebih sulit daripada memasukkan ide baru ke dalam pikiran militer adalah mengeluarkan ide lama.\"
 CAREER_PROFILE_BACKUP_QUOTE_28: "\"Perang adalah banyak hal dan tidak ada gunanya berpura-pura bahwa hal yang mengasyikkan bukanlah salah satunya.\"
