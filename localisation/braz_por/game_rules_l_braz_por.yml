 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC: "AI Britania akan berupaya melindungi Polandia dan memimpin sekutu dalam perang defensif mereka melawan Jerman, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_TRADE_UNIONS: "Mengalah kepada Serikat Buruh"
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC: "AI Britania akan berupaya memberi konsesi kepada Serikat Buruh dan beralih ke komunis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_THE_KINGS_PARTY: "Perkuat Partai Raja"
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC: "AI Britania akan berupaya mendukung pernikahan Raja Edward VIII dengan Wallis Simpson dan memperkuat Partai Raja, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT: "Hentikan Penenteraman"
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC: "AI Britania akan berupaya menghentikan kebijakan Penenteraman (Appeasement) dan menggantikannya dengan intervensionisme demokratis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS: "Organisir Kaum Kemeja Hitam"
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC: "AI Britania akan berupaya mengorganisir kaum kemeja hitam dan beralih ke fasis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC: "AI Belanda akan berupaya bergabung dengan Sekutu setelah diserang, namun tidak memindahkan pemerintahannya ke Hindia Timur, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY: "Warisan Pemberontakan 'De Zeven Provinciën'"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC: "AI Belanda akan berupaya membangkitkan kembali warisan pemberontakan 'De Zeven Provinciën' dan beralih ke komunis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_ORANJE_BOVEN: "Oranje Boven"
 RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC: "AI Belanda akan berupaya mendukung monarkisme dan menempatkan Ratu Wilhelmina di tampuk kekuasaan, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA: "Lanjutkan Perang di Batavia"
 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC: "AI Belanda akan berupaya tetap demokratis, namun memindahkan ibu kotanya ke Batavia setelah kapitulasi, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS: "Lanjutkan Proyek Zuiderzee"
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC: "AI Belanda akan berupaya tetap demokratis, namun fokus pada pembangunan daratan utama daripada koloninya, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_CAVE_TO_THE_GERMANS: "Tunduk kepada Jerman"
 RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC: "AI Belanda akan berupaya tunduk kepada Jerman dalam perang dagang, dan bersekutu dengan mereka setelah menjadi fasis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES: "Pimpin Demokrasi Kecil"
 RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC: "AI Belanda akan berupaya tetap demokratis dan memimpin negara-negara demokrasi kecil Eropa dalam pembentukan Uni Eropa, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_OPTION_SECULAR_REPUBLIC: "Republik Sekuler"
 RULE_OPTION_SECULAR_REPUBLIC_DESC: "Tren menuju sekularisme moderat dan supremasi hukum akan diperkuat di Meksiko, dengan negara menyelaraskan diri ke arah Amerika."
 RULE_OPTION_SOCIAL_CATHOLICISM: "Katolisisme Sosial"
 RULE_OPTION_SOCIAL_CATHOLICISM_DESC: "Para reformis moderat di dalam Gereja Katolik akan membentuk konkordat baru di Meksiko, mengakhiri perselisihan sosial akibat totalitarianisme dan menyelaraskan Meksiko ke arah Britania."
 RULE_OPTION_FASCIST_DICTATORSHIP: "Kediktatoran Fasis"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC: "Plutarco Calles, Saturnino Cedillo, dan para pemimpin militer lainnya akan menggagalkan upaya demokrasi awal Meksiko, dan berpihak kepada Jerman."
 RULE_OPTION_THEOCRATIC_ORDER: "Ordo Teokratis"
 RULE_OPTION_THEOCRATIC_ORDER_DESC: "Kaum Sinarkis dan Cristero akan merebut kekuasaan di Meksiko, menciptakan tatanan baru Amerika Latin untuk membersihkan benua dari para bidaah."
 RULE_OPTION_SOVIET_REPUBLIC: "Republik Soviet"
 RULE_OPTION_SOVIET_REPUBLIC_DESC: "Meksiko akan menyelaraskan diri ke Uni Soviet, menyebarkan Revolusi ke Amerika Latin di ujung sangkur."
 RULE_OPTION_CARDENISMO: "Cardenismo"
 RULE_OPTION_CARDENISMO_DESC: "Lázaro Cárdenas dan penerus sayap kirinya akan membentuk Aliansi Bolivarian dan menyerang kaum imperialis Yanqui."
