 RULE_OPTION_ETH_FRAGMENTED: "Ethiopia Terfragmentasi"
 RULE_OPTION_ETH_FRAGMENTED_DESC: "Ethiopia akan dipecah menjadi negara-negara bagian regional yang membentuk negara tersebut."
 RULE_OPTION_RAJ_FRAGMENTED_DESC: "Semua bangsa penyusun yang dapat dilepaskan yang membentuk Kemaharajaan Britania dilepaskan sebagai negara bebas dan merdeka pada awal permainan."
 ITA_FRAGMENTATION_STATUS: "Status Fragmentasi Italia"
 RULE_OPTION_ITA_FRAGMENTED: "Pembalikan Risorgimento"
 RULE_OPTION_ITA_FRAGMENTED_DESC: "Membalikkan Risorgimento di Italia dan mengembalikan perbatasan persis seperti sebelum penyatuan."
 RULE_OPTION_NATIONALIST_HISTORICAL: "Frankoisme"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC: "Franco akan mengambil kendali front Nasionalis dan menggabungkan ideologi Falangis dan Karlist ke dalam Spanyol yang baru dan bersatu, berupaya untuk tetap netral dalam Perang Dunia kecuali diserang."
 RULE_OPTION_SECOND_REPUBLIC: "Republik Kedua"
 RULE_OPTION_SECOND_REPUBLIC_DESC: "Pemerintah demokratis Spanyol akan mempertahankan Republik Kedua, menolak Fasisme dan Komunisme."
 RULE_OPTION_FALANGIST: "Falangisme"
 RULE_OPTION_FALANGIST_DESC: "Kaum Falangis di bawah José Antonio Primo de Rivera akan menolak Karlisme dan berupaya memulihkan imperialisme Spanyol."
 RULE_OPTION_CARLIST: "Karlisme"
 RULE_OPTION_CARLIST_DESC: "Kaum Karlist di bawah Manuel Fal Conde akan menolak Falangisme dan memastikan kembalinya monarki absolutis masa lalu, di bawah Raja Karlist yang sah."
 RULE_OPTION_ANARCHIST: "Anarkisme"
 RULE_OPTION_ANARCHIST_DESC: "Komune Anarkis di Aragon dan Katalonia akan bersatu untuk mengalahkan kaum Fasis dan Komunis sekaligus, dan menentang gagasan negara-bangsa sama sekali."
 RULE_OPTION_INDEPENDENT_COMMUNIST: "Komunisme Independen"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC: "POUM dan sekutu Anarkis mereka akan melepaskan kuk Stalinis dan mencari ideologi komunis independen mereka sendiri setelah Perang Saudara."
 RULE_OPTION_STALINIST: "Komunisme Stalinis"
 RULE_OPTION_STALINIST_DESC: "Kaum Komunis sejati, yang menerima perintah dari Moskow, akan melawan kaum Anarkis dan Fasis, mengekang pengaruh Komunis Independen, dan mengantarkan era baru bagi Republik Kedua di bawah bimbingan Stalinis."
 RULE_OPTION_HISTORICAL_POR_AI_DESC: "Di bawah rezim Salazar, Portugal akan memperkuat Estado Novo dan berupaya tetap netral selama Perang Dunia."
 RULE_OPTION_FASCIST_POR_AI_DESC: "Rafael Pereira akan mengambil kendali Portugal sebagai diktator Fasis, mendukung kaum Nasionalis selama Perang Saudara Spanyol dan berupaya bergabung dengan Poros sesudahnya."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE: "Kekaisaran Kelima"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC: "Pemerintah Portugal akan merangkul Fasisme, bertempur melawan kaum Republikan selama Perang Saudara Spanyol dan berupaya merebut kembali wilayahnya yang hilang di Afrika, Asia, dan Amerika, bangkit kembali sebagai kekuatan besar."
 RULE_OPTION_NEUTRALITY_MONARCHIST: "Monarkis"
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC: "Setelah pemulihan monarki di Portugal, Raja Duarte akan menarik simpati kaum monarkis Brasil dan berupaya memulihkan Kekaisaran Portugal dan Brasil."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC: "Dipengaruhi oleh Britania Raya, pemerintah demokratis akan menggulingkan rezim otoriter Salazar dan, dengan bantuan Inggris, fokus mengembangkan industri nasional sebelum bergabung dengan Sekutu."
 RULE_OPTION_COMMUNIST_COMINTERN: "Komunis"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC: "Portugal akan menyelaraskan diri ke Uni Soviet, mendukung Republik Spanyol dan berupaya bergabung dengan Komintern."
 RULE_OPTION_COMMUNIST_INDEPENDENT: "Perserikatan Republik Sosialis Eropa"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC: "Komunis akan menggulingkan pemerintah dan bertempur melawan Nasionalis Spanyol selama Perang Saudara Spanyol, menyatukan Semenanjung Iberia sebagai Perserikatan Republik Sosialis Eropa, benteng terakhir Eropa melawan fasisme."
 RULE_OPTION_MONARCHIST_ORLEANIST: "Monarkis: Wangsa Orléans"
 RULE_OPTION_MONARCHIST_LEGITIMIST: "Monarkis: Wangsa Bourbon"
 RULE_OPTION_MONARCHIST_BONAPARTIST: "Monarkis: Wangsa Bonaparte"
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC: "AI Prancis akan berupaya memulihkan monarki Prancis dan menempatkan pengklaim Orléanist di atas takhta dengan mengambil jalur yang relevan di pohon fokus."
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC: "AI Prancis akan berupaya memulihkan monarki Prancis dan menempatkan pengklaim Legitimis di atas takhta dengan mengambil jalur yang relevan di pohon fokus."
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC: "AI Prancis akan berupaya memulihkan monarki Prancis dan menempatkan pengklaim Bonapartis di atas takhta dengan mengambil jalur yang relevan di pohon fokus."
 RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP: "§Y[ROOT.GetName]§! tidak diizinkan untuk melepaskan §Y[KUR.GetName]§!."
 RULE_ENTENTE_LIT_AI_DESC: "Lituania akan berupaya meresmikan Entente Baltik dan bertahan menghadapi Soviet."
 RULE_ENTENTE_EST_AI_DESC: "Estonia akan berupaya meresmikan Entente Baltik dan bertahan menghadapi Soviet."
 RULE_ENTENTE_LAT_AI_DESC: "Latvia akan berupaya meresmikan Entente Baltik dan bertahan menghadapi Soviet."
 RULE_HISTORICAL_EST_AI_DESC: "AI Estonia akan tetap netral hampir sepanjang kampanye tetapi akan menjadi boneka Soviet pada dekade 1940-an."
 RULE_HISTORICAL_LAT_AI_DESC: "AI Latvia akan tetap netral hampir sepanjang kampanye tetapi akan menjadi boneka Soviet pada dekade 1940-an."
 RULE_HISTORICAL_LIT_AI_DESC: "AI Lituania akan tetap netral hampir sepanjang kampanye tetapi akan menjadi boneka Soviet pada dekade 1940-an."
 RULE_OPTION_MONARCHIST: "Monarkis"
 RULE_OPTION_MONARCHIST_LIT_AI_DESC: "Lituania akan berupaya memulihkan monarki dan mengklaim Persemakmuran Polandia-Lituania."
 RULE_OPTION_BALTIC_ENTENTE: "Entente Baltik"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION: "Komunis - Federasi Balkan"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC: "Bulgaria akan berupaya membentuk aliansi Balkan, mempengaruhi para tetangganya untuk merangkul revolusi dan pada akhirnya menyatukan Balkan."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC: "Bulgaria akan berupaya bergabung dengan Komintern dan berjuang bersama kawan-kawan Sovietnya melawan fasisme dan kapitalisme di Eropa."
 RULE_OPTION_DEMOCRATIC_LIBERAL: "Demokratis - Liberal"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC: "Partai Demokrat Bulgaria akan berupaya bergabung dengan Sekutu seraya berkonspirasi melawan Tsar Boris untuk melengserkannya dari kekuasaan dan membentuk dewan perwalian pro-Sekutu."
 RULE_OPTION_DEMOCRATIC_SOCIALIST: "Demokratis - Sosialis"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC: "Pemerintah yang dipimpin oleh Nikola Mushanov akan mengikuti kebijakan sosialis, berusaha meningkatkan hubungannya dengan negara-negara tetangga untuk membentuk Konfederasi Balkan dan membela Balkan melawan agresor asing."
 RULE_OPTION_FASCIST_BUL_AI_DESC: "Seiring bangkitnya fasisme di negara itu, pemimpin sayap kanan Hristo Lukov akan berupaya bergabung dengan Poros, yang pada akhirnya menggulingkan sang Tsar dan memberlakukan kediktatoran militer."
 RULE_OPTION_HISTORICAL_BUL_AI_DESC: "Tsar Boris III akan memimpin negara menuju Poros, mengandalkan arbitrase Jerman untuk memperluas perbatasan Bulgaria secara damai, yang pada akhirnya menandatangani Pakta Tripartit dan menunda partisipasi Bulgaria dalam perang."
 RULE_OPTION_THE_RETURN_OF_FERDINAND: "Kembalinya Ferdinand I"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC: "Menyusul wafatnya Tsar Boris III, ayahnya Ferdinand I akan menduduki takhta sekali lagi, menuntut balas terhadap mereka yang berbuat salah kepadanya puluhan tahun lalu."
 RULE_OPTION_METAXIST_GRE_AI_DESC: "Yunani akan mengejar kebijakan netralitas sembari mengembangkan gagasan Metaxisme."
 RULE_OPTION_MONARCHIST_GRE_AI: "Monarkis"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC: "Yunani akan menjadi monarki absolut dan berupaya bergabung dengan Sekutu."
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI: "Bergabung dengan Blok Sentral"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC: "Yunani akan menjadi monarki absolut dan berupaya bergabung dengan Blok Sentral bersama Jerman atau Austria-Hungaria."
 RULE_OPTION_STALINIST_GRE_AI: "Stalinis"
 RULE_OPTION_STALINIST_GRE_AI_DESC: "Yunani akan berupaya bergabung dengan Komintern dan memicu pertempuran untuk Selat Bosporus melawan Turki."
 RULE_OPTION_COMMUNIST_GRE_AI: "Komunis"
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC: "Yunani akan berupaya melawan fasisme di Eropa bersama Yugoslavia yang komunis."
 RULE_OPTION_DEMOCRATIC_GRE_AI: "Venizelis"
 RULE_OPTION_VENEZELIST_GRE_AI_DESC: "Yunani akan berjuang demi hak untuk mewujudkan Gagasan Megali (Megali Idea)."
 RULE_OPTION_FASCISM_GRE_AI_DESC: "Yunani akan menjadi republik Sosialis Nasional dan berupaya bergabung dengan Poros bersama Turki."
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI: "Fasis Anatolia"
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC: "Yunani akan menjadi demokratis, mengalami keruntuhan pemerintahan, lalu bercita-cita menggapai ambisi yang paling agung..."
 RULE_OPTION_HISTORICAL_TUR_AI: "Historis"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC: "Turki akan mengupayakan netralitas selama mungkin di bawah kepemimpinan İsmet İnönü, dan kemudian berupaya bergabung dengan Sekutu."
 RULE_OPTION_ALTERNATE_KEMALIST_AI: "Kemalis Alternatif"
 RULE_OPTION_ALTERNATE_KEMALIST_AI_DESC: "Turki akan menunjuk Fevzi Çakmak untuk mengikuti jejak Mustafa Kemal Atatürk sebagai Presiden, dan akan mengupayakan netralitas selama mungkin sebelum berupaya bergabung dengan Poros atau Sekutu."
 RULE_OPTION_OTTOMAN: "Pulihkan Kesultanan Utsmaniyah"
 RULE_OPTION_OTTOMAN_DESC: "Republik Turki akan runtuh dan dari abunya Kesultanan Utsmaniyah akan dipulihkan ke tampuk kekuasaan sekali lagi."
 RULE_OPTION_COMMUNIST_TUR_AI: "Komunisme"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC: "Turki akan mendirikan pemerintahan komunis dan berupaya bergabung dengan Komintern."
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI: "Komunisme Independen"
 RULE_OPTION_ALTERNATE_COMMUNIST_TUR_AI_DESC: "Turki akan mengadopsi pemerintahan komunis yang mempertahankan karakter Kemalisnya dan berupaya membentuk faksi sendiri."
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST: "Kemalisme Demokratis"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC: "Celâl Bayar akan mengalihkan Turki menjadi negara demokrasi Kemalis dan berupaya bergabung dengan Sekutu."
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE: "Konservatisme Demokratis"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC: "Adnan Menderes akan mengalihkan Turki menjadi negara demokrasi konservatif dan berupaya bergabung dengan Sekutu."
 RULE_OPTION_FASCISM_TUR_AI: "Fasisme Kemalis"
 RULE_OPTION_FASCISM_TUR_AI_DESC: "Recep Peker akan mengalihkan Turki menjadi kediktatoran fasis dan berupaya bergabung dengan Poros."
 RULE_OPTION_TUR_FASCISM_ALTERNATE: "Fasisme Militeristik"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC: "Fevzi Çakmak akan mengalihkan Turki menjadi kediktatoran kuasi-fasis konservatif dan berupaya membentuk faksi dengan Italia."
 RULE_OPTION_BALKAN_ENTENTE: "Lindungi Balkan"
 RULE_OPTION_BALKAN_ENTENTE_DESC: "Turki akan berkomitmen untuk menjaga keamanan di Balkan dan berupaya membentuk faksi bersama Yunani, Rumania, dan Yugoslavia."
 RULE_EXILES_TSARIST: "Pengasingan Tsar"
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC: "AI Soviet akan mengusir kaum Komunis melalui perang saudara, dan memulihkan Rusia Tsar, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_EXILES_FASCIST: "Pengasingan Fasis"
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC: "AI Soviet akan mengusir kaum Komunis melalui perang saudara, dan mendirikan pemerintahan fasis, dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_FASCIST_LIT_AI_DESC: "AI Lituania akan berupaya mendirikan pemerintahan fasis dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_FASCIST_LAT_AI_DESC: "AI Latvia akan berupaya mendirikan pemerintahan fasis dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_FASCIST_EST_AI_DESC: "AI Estonia akan berupaya mendirikan pemerintahan fasis dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_COMMUNIST_BALTIC_AI_DESC: "AI akan berupaya mendirikan rezim komunis dengan mengambil jalur yang relevan di pohon fokus nasional."
 RULE_HISTORICAL_ETH_AI_DESC: "AI Ethiopia akan berupaya mengalahkan Italia menggunakan Liga Bangsa-Bangsa, dan jika gagal akan mencoba pergi ke pengasingan. Setelah itu mereka akan berupaya merebut kembali tanah airnya, dan membangun kembali Ethiopia."
 RULE_OPTION_ETH_IMPERIAL: "Kekaisaran: Sang Singa Berdiri Teguh"
 RULE_ETH_IMPERIAL_AI_DESC: "AI Ethiopia akan berupaya mengalahkan Italia sendirian, tanpa bantuan Liga Bangsa-Bangsa. Setelah itu mereka akan berupaya memperluas kekaisarannya."
 RULE_OPTION_ETH_STALINIST_desc: "AI akan berupaya mengubah Ethiopia menjadi komunis dan menggalang dukungan dari Uni Soviet, menjadikannya boneka Stalinis."
 RULE_OPTION_ETH_STALINIST: "Komunis: Bantuan Soviet"
 RULE_OPTION_ETH_ANARCHIST: "Anarko-Komunis: Seruan kepada Dunia"
 RULE_OPTION_ETH_ANARCHIST_desc: "AI akan berupaya mengubah Ethiopia menjadi federasi anarko-komunis dengan dukungan komunis dan anarkis dari seluruh dunia."
 RULE_OPTION_ETH_COLLABORATIONIST: "Fasis: Kolaborasionis"
 RULE_OPTION_ETH_COLLABORATIONIST_desc: "AI akan menusuk Haile Selassie dari belakang dan berpihak kepada Italia, menjadikan Ethiopia boneka fasis."
 RULE_OPTION_ETH_INDEPENDENT_FASCIST: "Fasis: Independen"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc: "AI akan menusuk Haile Selassie dari belakang dan berpihak kepada Italia, menjadikan Ethiopia boneka fasis. Namun, mereka akan berupaya membebaskan diri dan menjadi negara fasis independen."
 RULE_HISTORICAL_SWI_AI_DESC: "Swiss akan tetap netral, sembari membangun milisi dan benteng pertahanan mereka untuk bersiap menghadapi serangan apa pun. Mereka akan memberikan sejumlah dukungan kepada sekutu menjelang akhir perang."
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC: "Demokratis Sekutu"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC: "AI akan mempersenjatai Swiss dan bersiap untuk perang, menyelaraskan Swiss dengan kekuatan demokrasi dunia, dan pada akhirnya memutus netralitas demi memihak Sekutu."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC: "Demokrasi Ekspansionis"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC: "AI akan mencoba meyakinkan negara-negara bagian di sekitar Swiss untuk bergabung dengan konfederasi, dan akan mempersenjatai negara sebagai antisipasi jika pemilik wilayah tersebut menolak membiarkan wilayah mereka bebas."
 RULE_OPTION_SWI_IMPERIAL: "Kekaisaran"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC: "AI akan berupaya membentuk Protektorat Alpen dengan meninggalkan netralitas dan demokrasi demi rezim militeristik dan ekspansionis."
 RULE_OPTION_SWI_FASCIST: "Fasis"
 RULE_OPTION_SWI_FASCIST_AI_DESC: "AI akan membuat Swiss menyelaraskan diri dengan Jerman dan perlahan-lahan mengubah negara menjadi fasis, yang pada akhirnya bersekutu dengan Poros atau menjadi Boneka Jerman."
 RULE_GROUP_GENERAL_UI: "Antarmuka (UI)"
 OBSOLETE_FOCUS_BRANCHES_VISIBILITY: "Tampilkan cabang usang di Pohon Fokus"
 RULE_OPTION_HIDE: "Sembunyikan"
 RULE_OPTION_HIDE_DESC: "Cabang usang tertentu akan disembunyikan dalam situasi yang sesuai demi memudahkan navigasi Pohon Fokus."
 RULE_OPTION_SHOW: "Tampilkan"
 RULE_OPTION_SHOW_DESC_DESC: "Cabang usang akan selalu tetap terlihat di Pohon Fokus."
 LON_NON_INTERFERENCE_RESOLUTION_CALL: "[FROM.GetNameDefCap] tidak dapat dipanggil karena resolusi Non-Intervensi Liga Bangsa-Bangsa"
 LON_NON_INTERFERENCE_RESOLUTION_JOIN: "Anda tidak dapat bergabung dengan [FROM.GetNameDef] karena resolusi Non-Intervensi Liga Bangsa-Bangsa"
 RULE_VOLUNTEERS_ETHIOPIA_ONLY_ONE_TT: "Saat ini Anda hanya dapat mengirim unit relawan ke [ETH.GetName]"
 ICELAND_HAS_DECLARED_NEUTRALITY_JOIN: "Islandia telah menyatakan netralitas mutlak dan tidak dapat bergabung dalam perang"
 ICELAND_HAS_DECLARED_NEUTRALITY_CALL: "Islandia telah menyatakan netralitas mutlak dan tidak dapat dipanggil ke dalam perang"
 DENMARK_IS_A_PUPPET_FACTION: "[DEN.GetNameDefCap] telah diberikan status protektorat khusus dan tidak dapat bergabung dengan faksi"
 DENMARK_IS_A_PUPPET_JOIN: "[DEN.GetNameDefCap] telah diberikan status protektorat khusus dan tidak dapat bergabung dalam perang"
 DENMARK_IS_A_PUPPET_CALL: "[DEN.GetNameDefCap] telah diberikan status protektorat khusus dan tidak dapat dipanggil ke dalam perang"
 RULE_NON_GIE_JOIN: "§RKita tidak dapat bergabung dalam perang melawan negara Pemerintahan dalam Pengasingan§!"
 RULE_NON_GIE_CALL: "§RKita tidak dapat memanggil sekutu jika hanya berperang melawan negara dalam Pengasingan§!"
 RULE_GROUP_PEACE_SCORE: "Distribusi Skor Damai"
 PEACE_SCORE_TO_OVERLORD: "Boneka ke Tuan Penjajah"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC: "Negara boneka memberikan sebagian dari Skor Damai mereka kepada Tuan Penjajah mereka. Rasionya bergantung pada tingkat Otonomi mereka."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC: "Negara boneka mempertahankan semua Skor Damai yang mereka peroleh selama perang."
 PEACE_SCORE_TO_FACTION_LEADER: "Anggota Faksi ke Pemimpin Faksi"
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC: "Anggota Faksi memberikan 10% dari Skor Damai mereka kepada Pemimpin Faksi."
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC: "Anggota Faksi mempertahankan semua Skor Damai yang mereka peroleh selama perang."
 PEACE_SCORE_RESET_LOW_SCORES: "Distribusikan ulang skor rendah"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC: "Pemenang dengan partisipasi perang kurang dari 5% memberikan semua skor mereka kepada pemenang lainnya.\nTidak berlaku jika tidak ada pemenang yang memiliki setidaknya 10% partisipasi perang.\nTidak berlaku untuk Pemain Manusia."
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC: "Semua pemenang mempertahankan semua Skor Damai yang mereka peroleh selama perang."
 RULE_HISTORICAL_SWE_AI_DESC: "AI akan berupaya membangun militer Swedia sembari tetap netral dan demokratis. Mereka akan berhati-hati menghindari konflik dengan Poros dan Komintern, namun mungkin menawarkan dukungan terbatas kepada Sekutu di kemudian hari dalam perang."
 RULE_OPTION_SWE_DEM_ALT: "Demokratis Alternatif"
 RULE_OPTION_SWE_DEM_ALT_DESC: "AI Swedia akan mengambil jalur pohon demokratis namun akan lebih mungkin terlibat aktif dalam perang dengan mempersenjatai diri lebih cepat, lebih condong ke kebijakan sayap kanan."
 RULE_OPTION_SWE_COMMUNISM: "Komunisme"
 RULE_OPTION_SWE_COMMUNISM_DESC: "AI Swedia akan mengambil jalur pohon komunis dan bersekutu dengan Poros atau Sekutu."
 RULE_OPTION_SWE_FASCIST_INDEPENDENT: "Fasis Independen"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC: "AI Swedia akan mengambil jalur fasis, tetap independen dan mencoba membentuk Kerajaan Nordik Raya."
 RULE_OPTION_SWE_FASCIST_PUPPET: "Fasis Reichskommissariat Patuh"
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC: "AI Swedia akan mengambil jalur fasis, tunduk kepada Jerman dan tetap patuh kepada tuan mereka."
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER: "Fasis Reichskommissariat Pengkhianat"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC: "AI Swedia akan mengambil jalur fasis, tunduk kepada Jerman dan membebaskan diri dari mereka ketika waktunya tepat."
 RULE_OPTION_SWE_UNALIGNED: "Monarkis"
 RULE_OPTION_SWE_UNALIGNED_DESC: "AI Swedia akan mengambil jalur non-blok, mengembalikan raja ke tampuk kekuasaan dan mencoba membentuk Kerajaan Nordik Raya."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL: "Dewan Pertahanan Nordik"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC: "AI akan mencoba membentuk Dewan Pertahanan Nordik untuk melindungi negara-negara Nordik."
 RULE_OPTION_NOR_STALINIST: "Stalinis"
 RULE_OPTION_NOR_STALINIST_AI_DESC: "AI akan berupaya meningkatkan popularitas Komunisme, sembari menyelaraskan Norwegia dengan Uni Soviet Stalin, atau negara Komunis Non-Trotskis terbesar jika Stalin telah digulingkan."
 RULE_OPTION_NOR_TROSTSKYIST: "Trotskis"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC: "AI akan mencoba mempertahankan Lev Trotskij di Norwegia, dan mengikuti prinsip-prinsip Komunismenya, menentang Uni Soviet jika tetap Stalinis, dan bersekutu dengannya jika Trotskij menjadi pemimpinnya."
 RULE_OPTION_NOR_FASCIST: "Nasjonal Samling"
 RULE_OPTION_NOR_FASCIST_AI_DESC: "AI akan membiarkan pengaruh Fasisme tumbuh seiring waktu, dan pada akhirnya akan menyelaraskan diri dengan Reich Ketiga, atau bergerak sendiri jika Jerman tidak lagi Fasis."
 RULE_OPTION_NOR_MONARCHIST: "Monarkis"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC: "AI akan mulai menekan Raja Haakon VII untuk membubarkan Storting dan mengubah Norwegia menjadi Monarki Oligarkis."
 RULE_HISTORICAL_FIN_AI_DESC: "AI Finlandia akan berupaya mengikuti rangkaian peristiwa historis sebanyak mungkin."
 RULE_HISTORICAL_DEN_AI_DESC: "AI Denmark akan berupaya menghindari konflik apa pun dan mengikuti peristiwa historis sebanyak mungkin. Jika menjadi negara bawahan, mereka akan mencoba membangun dukungan secara perlahan dengan kekuatan asing untuk menegaskan kembali kemerdekaannya."
 RULE_OPTION_DEN_REARMAMENT: "Persenjataan Kembali Denmark"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC: "Denmark akan mencoba mencari aliansi dengan negara-negara yang lebih kuat dan mencoba bertahan dari upaya invasi apa pun."
 RULE_OPTION_DEN_MONARCHIST: "Monarki Ekspansionis"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC: "Raja Christian X akan mencoba mengamankan sumber daya alam dan memperkuat kemampuan militer Denmark dengan mengendalikan seluruh wilayah Nordik melalui cara apa pun yang diperlukan."
 RULE_OPTION_DEN_FASCIST: "Denmark Fasis"
 RULE_OPTION_DEN_FASCIST_AI_DESC: "Partai Fasis akan mencoba merebut kekuasaan di Denmark dan mendirikan kembali Kekaisaran Laut Utara masa lampau."
 RULE_HISTORICAL_ICE_AI_DESC: "AI Islandia akan mencoba mempertahankan netralitas dan akan mencari perlindungan AS jika diperlukan."
 RULE_OPTION_ICE_SUPPORT: "Mendukung Denmark"
 RULE_OPTION_ICE_SUPPORT_AI_DESC: "AI Islandia akan berupaya mendukung pertahanan Denmark terhadap penyerang mana pun."
 RULE_OPTION_ICE_FASCIST: "Fasis"
 RULE_OPTION_ICE_FASCIST_AI_DESC: "AI Islandia akan mencela Raja Denmark, dan mencoba menciptakan kekaisaran fasis di Laut Utara."
 RULE_OPTION_ICE_COMMUNIST: "Komunis"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC: "AI Islandia akan mencela monarki, dan mendirikan negara komunis di Islandia."
 RULE_HISTORICAL_NOR_AI_DESC: "Norwegia akan berupaya tetap demokratis dan melawan invasi Jerman sebelum terus berjuang sebagai pemerintah dalam pengasingan, bersama Sekutu."
 ### SOUTH AMERICA ###
 CHL_AI_BEHAVIOR: "@CHL Chili"
 RULE_HISTORICAL_CHL_AI_DESC: "AI Chili akan memperkuat sistem demokrasi dan memilih untuk mendukung kebijakan sosial-demokrat sembari menjaga keseimbangan kekuasaan, dan hanya akan bergabung dalam perjuangan global jika perang berlarut-larut."
 RULE_OPTION_CHL_COMMUNIST: "Republik Sosialis Chili"
 RULE_OPTION_CHL_COMMUNIST_AI_DESC: "AI Chili akan memanfaatkan ketidakstabilan yang disebabkan oleh kaum fasis untuk menuntut pengunduran diri Arturo Alessandri, dan meningkatkan kekuasaan presiden agar mereka dapat membentuk negara komunis."
 RULE_OPTION_CHL_OPERATION_BOLIVAR: "Kerja Sama dengan Operasi Bolivar"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC: "AI Chili akan mengambil jalur fasisme, memilih untuk memihak Reich Jerman jika mendapat kesempatan, yang pada akhirnya berperang dan berupaya memulihkan Kerajaan Chili masa lampau."
 RULE_OPTION_CHL_PAN_HISPANISM: "Pan-Hispanisme"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC: "AI Chili akan mengambil jalur fasisme, yang pada akhirnya memilih untuk tidak memihak kekuatan besar dunia mana pun. Mereka kemudian akan menaklukkan dunia Hispanik, atau menyatukannya secara diplomatis."
 RULE_OPTION_CHL_ANTI_IMPERIALISM: "Anti-Imperialisme"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC: "AI Chili akan memilih untuk mendukung berbagai organisasi Mapuche, yang pada akhirnya membuat mereka mengambil alih kendali negara. Negara ini nantinya akan melancarkan perang salib melawan Imperialisme, menyingkirkan negara-negara yang dikuasai Eropa dari Amerika Selatan dan Tengah."
 RULE_OPTION_CHL_LE_DELUGE: "Kerajaan Araucanía dan Patagonia"
 RULE_OPTION_CHL_LE_DELUGE_DESC: "AI Chili akan berpaling ke tradisi dan melengserkan Alessandri dari kekuasaan, menempatkan Ibáñez sebagai gantinya. Negara ini kemudian akan memasuki perang saudara, di mana Antoine III akan memulihkan Kerajaan Araucanía dan Patagonia lama, menyatakan dirinya sebagai penerus Napoleon."
 BRA_AI_BEHAVIOR: "@BRA Brasil"
 RULE_HISTORICAL_BRA_AI_DESC: "Vargas akan berupaya tetap berkuasa dengan melenyapkan oposisi politik secara cermat di Brasil sebelum akhirnya bergabung dengan Sekutu dan bekerja sama dengan Amerika Serikat."
 RULE_OPTION_FASCISM: "Fasisme"
 RULE_FASCISM_BRA_AI_DESC: "Gerakan Integralis akan mengkhianati Vargas dan mengangkat salah satu anggota mereka sendiri sebagai pemimpin. Mereka kemudian akan berupaya mendominasi Amerika Selatan melalui diplomasi dan kekuatan senjata."
 RULE_DEMOCRATIC_BRA_AI_DESC: "Brasil akan berupaya menggulingkan Vargas dengan mengakhiri keadaan darurat. Negara ini kemudian akan mencoba mereformasi bangsa, meningkatkan partisipasi demokratis sebelum akhirnya bekerja sama dengan AS melawan kekuatan Poros."
 RULE_OPTION_MONARCHIST_HENRIQUE: "Monarkis - Dom Pedro Henrique"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC: "AI akan berupaya mereformasi Kekaisaran Brasil dengan menggalang dukungan bagi Pedro Henrique sebagai pewaris takhta yang sah. Negara ini kemudian akan mencoba menaklukkan atau mengintegrasikan tetangga-tetangga Brasil."
 RULE_OPTION_MONARCHIST_ALCANTARA: "Monarkis - Dom Pedro de Alcântara"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC: "AI akan berupaya mereformasi Kekaisaran Brasil dengan menggalang dukungan bagi Pedro de Alcântara sebagai pewaris takhta yang sah. Negara ini kemudian akan mencoba bersatu kembali dengan Portugal melalui diplomasi atau kekuatan senjata."
 RULE_OPTION_BRA_COMMUNIST_STALINISM: "Komunisme - Luís Carlos Prestes"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC: "Brasil akan berupaya menggulingkan pemerintah demokratis dan menggantikannya dengan pemerintahan komunis yang bersekutu dengan Soviet di bawah pimpinan Luís Carlos Prestes. Negara ini kemudian akan bergabung dengan Komintern dan membantu Uni Soviet."
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT: "Komunisme - Aliança Nacional Libertadora"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC: "Brasil akan membangkitkan kembali ANL dan berupaya menggulingkan pemerintah demokratis. Pemerintahan akan digantikan oleh dewan ANL yang kemudian akan menerapkan reformasi komunis sebelum akhirnya berupaya membebaskan benua dari fasisme dan imperialisme."
 ARG_AI_BEHAVIOR: "@ARG Argentina"
 RULE_HISTORICAL_ARG_AI_DESC: "AI akan berupaya mematuhi peristiwa historis dengan menghindari keikutsertaan dalam perang dan secara bertahap bekerja sama dengan Inggris dan AS."
 RULE_FASCISM_ARG_AI_DESC: "AI akan berupaya mengubah negara menjadi fasis dan akan bergabung dengan kekuatan Poros untuk membuka front baru di Amerika Selatan."
 RULE_COMMUNIST_ARG_AI_DESC: "AI akan berupaya mengubah negara menjadi komunis dan akan bergabung dengan Komintern untuk fokus menyebarkan ideologi mereka di Amerika Selatan."
 RULE_DEMOCRATIC_ARG_AI_DESC: "AI akan berupaya beralih ke demokratis dan akan bergabung dengan Sekutu untuk menjaga demokrasi dan kebebasan di Amerika Selatan."
 RULE_ALLOW_RELEASE_NATIONS_NOT_CHILE_TOOLTIP: "§Y[CHL.GetName]§! hanya dapat melepaskan negara ini melalui fokus §YPerang Salib Melawan Imperialisme§! atau dengan mengambil cabang §YDemokratis§! atau §YKomunis§! di §YPohon Fokus§!."
 RULE_ALLOW_RELEASE_NATIONS_NOT_QUEBEC_TOOLTIP: "§Y[CAN.GetName]§! hanya dapat melepaskan negara ini dengan menyelesaikan fokus §Y$CAN_forced_quebec_conscription$§! atau §Y$CAN_compromise_with_quebec$§!."
 RULE_OPTION_HISTORICAL_PAR_AI_DESC: "AI akan menjauhi politik global dan fokus pada masalah internal, melewati berbagai ketidakstabilan yang membuatnya terhindar dari kancah perang."
 RULE_OPTION_COMMUNIST_PAR_AI_DESC: "AI akan mempertahankan pemerintahan komunis Rafael Franco dan berupaya membalas dendam terhadap Bolivia atas Perang Chaco."
 RULE_OPTION_COMMUNIST_PAR_AI: "Komunis"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC: "AI akan melawan kudeta Rafael Franco dan memasuki perang saudara demi menjaga keutuhan pemerintahan demokratisnya."
 RULE_OPTION_DEMOCRATIC_PAR_AI: "Demokratis"
 URG_AI_BEHAVIOR: "@URG Uruguay"
 RULE_OPTION_HISTORICAL_URG_AI_DESC: "AI akan berupaya menjauhi urusan dunia dan fokus pada industrialisasi internal, menempatkan partai Colorado di tampuk kekuasaan. Hanya bergabung dengan sekutu di akhir perang."
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC: "AI akan berupaya menjauhi urusan dunia dan fokus pada industrialisasi internal, menempatkan partai Blanco di tampuk kekuasaan. Hanya bergabung dengan sekutu di akhir perang."
 RULE_OPTION_DEMOCRATIC_ALT_AI: "Demokratis Alternatif"
 RULE_OPTION_FASCIST_AI_URG_DESC: "AI akan menyelaraskan diri dengan Poros, mengubah negara menjadi batu loncatan bagi penaklukan Amerika Selatan."
 RULE_OPTION_FASCIST_URG_AI: "Fasis"
 RULE_OPTION_DISPERSE_MILITARY_POWER: "Sebarkan Kekuatan Militer"
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC: "AI akan tetap netral dalam urusan dunia dan mencoba mengembangkan negaranya sendiri kecuali diprovokasi."
 RULE_OPTION_DICTATORSHIP_NEUTRAL: "Kediktatoran Netral"
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC: "AI akan mengambil rute kediktatoran otoriter namun berupaya tetap netral."
 DICTATORSHIP_WARMONGER: "Penghasut Perang"
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC: "AI akan mengambil rute kediktatoran otoriter dan mencoba memperluas wilayah kekuasaannya."
 PAR_AI_BEHAVIOR: "@PAR Paraguay"
 RULE_ALLOW_RELEASE_NATIONS_NO_SLOVAKIA_TOOLTIP: "§Y[HUN.GetName]§! dan §Y[CZE.GetName]§! hanya dapat melepaskan negara ini melalui peristiwa atau fokus."
 AUS_AI_BEHAVIOR: "@AUS Austria"
 RULE_OPTION_HISTORICAL_AUS_AI_DESC: "AI akan beralih ke fasis dan berupaya mencegah Anschluss dengan Front Vaterländische sebagai pemimpinnya."
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI: "Monarkis - Penundukan"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC: "AI akan berupaya mereformasi Kekaisaran Austria-Hungaria dengan membangun kembali militer mereka dan menuntut penundukan negara-negara yang kini menduduki bekas wilayah kekuasaan mereka."
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI: "Monarkis - Aneksasi"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC: "AI akan berupaya mereformasi Kekaisaran Austria dengan membangun kembali militer mereka lalu memperluas serta menganeksasi wilayah-wilayah lama mereka yang hilang."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI: "Federatif Non-Blok"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC: "AI akan berupaya membentuk Federasi Danube dengan mengundang negara-negara lain di sepanjang Danube di bawah kekuasaan non-blok."
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI: "Soviet Austria"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC: "AI akan berupaya beralih ke komunis dan menggulingkan pemerintah sebelum menyelaraskan diri dengan Uni Soviet dan bergabung dengan Komintern."
 RULE_OPTION_AUS_COMMUNIST_AI: "Komunis"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC: "AI akan berupaya beralih ke komunis dan menggulingkan pemerintah. Berpegang teguh pada agenda ketat Austromarxisme, mereka akan mendirikan faksi sendiri."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI: "Demokratis Austria - Federatif"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC: "AI akan berupaya membentuk Federasi Danube dengan mengundang negara-negara lain di sepanjang Danube di bawah pemerintahan demokratis."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI: "Demokratis Austria - Sekutu"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC: "AI akan berupaya bergabung dengan Sekutu dengan menegakkan kembali demokrasi di Austria."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI: "Demokratis Austria - Federasi Alpen"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC: "AI akan berupaya menegakkan kembali demokrasi di Austria dan membentuk Federasi Alpen."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI: "Varian Historis - Östfrei!"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC: "AI sebagian besar akan mengikuti jalur Historis, namun akan berupaya mencegah Anschluss dengan cara apa pun yang memungkinkan, berjuang mati-matian demi kemerdekaan mereka hingga akhir. Ini mungkin menghadirkan tantangan atau menunda pecahnya perang."
 BEL_AI_BEHAVIOR: "@BEL Belgia"
 RULE_OPTION_HISTORICAL_BEL_AI: "Historis"
 RULE_OPTION_HISTORICAL_BEL_AI_DESC: "Belgia awalnya akan mencoba menahan serangan, tetapi kemudian akan mundur ke Kongo dan melanjutkan perang dari sana."
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI: "Fasis Nasionalis (Rexist)"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC: "AI akan berpihak pada Fasis Rexist, mendirikan negara yang sangat terindustrialisasi, lalu membantu kaum fasis dalam perang."
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI: "Fasis Ekspansionis (VNV)"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC: "AI akan berpihak pada Fasis Nasionalis Flemish, dan secara agresif mencoba menyatukan Negeri-Negeri Rendah (Low Countries) lalu berbalik melawan Prancis."
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI: "Demokrat Defensif"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC: "AI akan melepaskan belenggu raja mereka yang berkemauan lemah, dan berusaha mempertahankan Belgia dengan segala cara."
 RULE_OPTION_COMMUNIST_BEL_AI: "Sosialis"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC: "AI akan membiarkan Partai Buruh memenangkan pemilu, lalu perlahan-lahan mulai menyelaraskan diri dengan blok Komunis."
 COG_AI_BEHAVIOR: "@COG Kongo Belgia"
 RULE_OPTION_HISTORICAL_COG_AI_DESC: "AI Kongo akan tetap bersama Belgia dan memanfaatkan hubungannya dengan negara tersebut semaksimal mungkin, yang pada akhirnya mencari peningkatan otonomi."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI: "Gerakan Emansipasi Demokratis"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC: "AI Kongo akan berupaya meraih kemerdekaannya sesegera mungkin melalui cara-cara damai, dan kemudian mengkampanyekan demokrasi di seluruh Afrika."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI: "Gerakan Emansipasi Komunis"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC: "AI Kongo akan berupaya meraih kemerdekaannya sesegera mungkin melalui cara-cara damai, dan kemudian berupaya menyebarkan komunisme di seluruh Afrika."
 RULE_OPTION_COG_COM_REVOLUTION_AI: "Revolusi Simba"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC: "AI Kongo akan berupaya membebaskan diri dari tuan kolonial mereka melalui revolusi berdarah dan perang saudara berikutnya, lalu berupaya menyebarkan komunisme ke seluruh benua Afrika."
 AFG_AI_BEHAVIOR: "@AFG Afganistan"
 RULE_OPTION_HISTORICAL_AFG_AI_DESC: "AI Afganistan akan berupaya tetap netral sepanjang periode sembari mencoba memperoleh konsesi ekonomi dari kekuatan Sekutu, Komintern, dan Poros."
 RULE_OPTION_FASCISM_AFG_AI_DESC: "AI Afganistan akan berupaya menggulingkan Raja Zahir Shah dan menggantikannya dengan Amanullah Khan yang kemudian akan berupaya memodernisasi negara secara cepat. Afganistan kemudian akan berusaha memperluas perbatasannya dengan bantuan kekuatan Poros."
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "AI Afganistan akan mendorong Raja Zahir Shah untuk melengserkan paman-pamannya sebelum melanjutkan jalur reformasi radikal. Ini akan berujung pada Afganistan menjadi negara demokrasi dan bergabung dengan Sekutu."
 RULE_OPTION_COMMUNIST_AFG_AI_DESC: "AI Afganistan akan mendekatkan diri ke Uni Soviet dan menerapkan reformasi radikal untuk mengubah bangsa menjadi negara Komunis. Negara ini kemudian akan bergabung dengan Komintern dan mencoba mengambil kendali Asia Tengah."
 RULE_OPTION_CALIPHATE_AFG: "Kekhalifahan Baru"
 RULE_OPTION_CALIPHATE_AFG_AI_DESC: "AI Afganistan akan berupaya menggulingkan Raja Zahir Shah dan menggantikannya dengan Faqir dari Ipi yang kemudian akan berupaya membalikkan modernisasi negara. Afganistan kemudian akan memperluas perbatasannya dan pada akhirnya membentuk Kekhalifahan baru."
 RULE_OPTION_EMPIRE_AFG: "Kekaisaran Afganistan Kedua"
 RULE_OPTION_EMPIRE_AFG_AI_DESC: "AI Afganistan akan berupaya menggulingkan Raja Zahir Shah dan menggantikannya dengan Emir Sayyid Mir Muhammad Alim Khan yang kemudian akan berupaya menyatukan suku-suku Afganistan. Afganistan kemudian akan memperluas perbatasannya dan pada akhirnya membentuk Kekaisaran Afganistan yang baru."
 RULE_OPTION_MUGHAL_AFG: "Kekaisaran Mughal Baru"
 RULE_OPTION_MUGHAL_AFG_AI_DESC: "AI Afganistan akan berupaya menggulingkan Raja Zahir Shah dan menggantikannya dengan Mirza Khurshid Jah Bahadur yang kemudian akan berupaya menciptakan kembali Kekaisaran Mughal. Mereka kemudian akan berusaha memperluas perbatasannya hingga akhirnya membentuk Kekaisaran Timuriyah yang baru."
 IRQ_AI_BEHAVIOR: "@IRQ Irak"
 RULE_OPTION_HISTORICAL_IRQ_AI: "Historis"
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC: "AI akan terombang-ambing di antara kudeta-kudeta historis, yang berpuncak pada Golden Square merebut kendali dan berperang melawan Inggris sebelum akhirnya memulihkan monarki dan menyerah."
 RULE_OPTION_FASCISM_IRQ_AI: "Fasisme - Golden Square"
 RULE_OPTION_FASCISM_IRQ_AI_DESC: "AI akan berupaya menempatkan Golden Square di tampuk kekuasaan sesegera mungkin sebelum bergabung dengan Poros untuk melawan Inggris. Mereka kemudian akan berupaya menganeksasi wilayah-wilayah Arab tetangga."
 RULE_OPTION_HASHEMITE_IRQ_AI: "Hasyimiyah - Non-Blok"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC: "AI akan berupaya tetap setia kepada Inggris sembari membangun kekuatannya di kawasan, secara bertahap mengambil alih administrasi wilayah dan akhirnya membentuk Federasi Arab Hasyimiyah."
 RULE_OPTION_SIDQI_IRQ_AI: "Bakr Sidqi - Non-Blok"
 RULE_OPTION_SIDQI_IRQ_AI_DESC: "Bakr Sidqi akan melancarkan kudeta historisnya namun tidak dibunuh. Sebaliknya, pemerintah akan bekerja sama dengan Iran dan Turki untuk membentuk blok kekuatan regional."
 RULE_OPTION_KURDISTAN_IRQ_AI: "Kemerdekaan Kurdistan"
 RULE_OPTION_KURDISTAN_IRQ_AI_DESC: "Kaum Kurdi di Irak Utara akan melancarkan pemberontakan melawan pemerintah Irak. Jika berhasil, mereka akan berupaya menyatukan tanah air mereka yang melintasi Turki dan Iran."
 RULE_ALLOW_RELEASE_NATIONS_NOT_RAJ_TOOLTIP: "§Y[RAJ.GetName]§! hanya dapat melepaskan negara ini dengan menyelesaikan fokus §Y$RAJ_a_secular_state$§!, §Y$RAJ_incorporation_of_the_east_india_company$§!, §Y$RAJ_hindutva$§!, §Y$RAJ_netaji$§!, atau dengan menyelesaikan §YPemisahan (Partition)§!."
 PER_AI_BEHAVIOR: "@PER Iran"
 RULE_OPTION_HISTORICAL_PER_AI: "Historis"
 RULE_OPTION_HISTORICAL_PER_AI_DESC: "AI akan menjalankan reformasi politik dan memperkuat militer mereka, sebelum diinvasi dan langsung menyerah."
 RULE_OPTION_IMPERIAL_PER_AI: "Kekaisaran - Non-Blok"
 RULE_OPTION_IMPERIAL_PER_DESC: "AI akan mendirikan monarki absolut di bawah Reza Shah Pahlavi dan berupaya melancarkan kampanye penaklukan di Timur Tengah."
 RULE_OPTION_DEMOCRATIC_PER_AI: "Demokratis - Monarki Konstitusional"
 RULE_OPTION_DEMOCRATIC_PER_DESC: "AI akan memaksakan batasan konstitusional pada sang Shah dan mengikuti jalur demokrasi sebelum akhirnya berupaya bergabung dengan faksi demokratis."
 RULE_OPTION_COMMUNISM_PER_AI: "Komunisme - Tudeh"
 RULE_OPTION_COMMUNISM_PER_DESC: "AI akan terlibat dalam revolusi yang akan menempatkan partai Tudeh yang pro-Soviet di tampuk kekuasaan. Rezim komunis akan berupaya mendestabilisasi kawasan."
 RULE_OPTION_FASCISM_PER_AI: "Fasisme - SUMKA"
 RULE_OPTION_FASCISM_PER_DESC: "AI akan menyatukan kaum nasionalis negara dan membentuk SUMKA, membawa rezim fasis ke negara tersebut. Mereka akan berupaya bergabung dengan faksi fasis dan menyatakan perang terhadap tetangga mereka."
 PHI_AI_BEHAVIOR: "@PHI Filipina"
 RULE_OPTION_HISTORICAL_PHI_AI: "Historis"
 RULE_OPTION_HISTORICAL_PHI_AI_DESC: "Filipina akan tetap bersekutu dengan Amerika Serikat."
 RULE_OPTION_FLEXIBLE_PHI_AI: "Fleksibel"
 RULE_OPTION_FLEXIBLE_PHI_AI_DESC: "Filipina akan mengadu domba AS dan Jepang satu sama lain, demi memaksimalkan potensi mereka."
 RULE_OPTION_FASCIST_PHI_AI: "Fasisme"
 RULE_OPTION_FASCIST_PHI_AI_DESC: "Filipina akan menyelaraskan diri dengan Jepang, yang berpotensi terjerumus ke dalam fasisme itu sendiri."
 RULE_OPTION_MONARCHIST_PHI_AI: "Hispanik"
 RULE_OPTION_MONARCHIST_PHI_AI_DESC: "Pemilu Filipina akan dibatalkan, membiarkan $PHI_neutrality_party_long$ mengambil alih hingga akhirnya terjadi perang kemerdekaan dengan dukungan negara-negara Hispanik sahabat dan menjadi monarki."
 RULE_OPTION_COMMUNIST_PHI_AI: "Komunisme Maritim"
 RULE_OPTION_COMMUNIST_PHI_AI_DESC: "Matahari merah akan terbit di atas Filipina, seiring berkembangnya komunisme maritim yang berupaya menyebarkan semangat kesetaraan ke seluruh samudra dunia."
 RULE_OPTION_MACARTHUR_PHI_AI: "Deklarasikan Darurat Militer"
 RULE_OPTION_MACARTHUR_PHI_AI_DESC: "Setelah runtuhnya pemerintah Filipina, seorang tokoh militer akan bangkit dan memimpin bangsa melawan setiap dan semua agresor."
 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_SUDETENLAND_TOOLTIP: "Negara ini tidak boleh pernah dilepaskan."
 RULE_ALLOW_RELEASE_NATIONS_ALL_NATIONS_RUTHENIA_TOOLTIP: "Negara ini tidak boleh pernah dilepaskan."
 #AST_AI_BEHAVIOR: "@AST Australia"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL: "Historis"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL_DESC: "Demokrasi yang mengakar kokoh, meski tidak stabil, memberi Australia fondasi untuk memandang dunia yang lebih luas, dan bersiap menghadapi badai yang akan datang."
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI: "Fasis Pankhurst-Walsh"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI_DESC: "Adela Pankhurst-Walsh memimpin Australia dengan tujuan awal memperluas Imperium Britania lebih jauh lagi, meskipun siapa tepatnya yang akan mewarisi kekaisaran yang diperluas tersebut tetap menjadi tanda tanya terbuka."
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI: "Fasis Stephensen"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI_DESC: "Australia First menuntut Australia merdeka yang bebas menempa masa depannya sendiri."
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI: "Sosial-Demokrat Acak"
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI_DESC: "Suara rakyat adalah yang paling penting di Australia yang Demokratis, yang kehendaknya menjadi penentu nasib bangsa."
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI: "Komunis Anti-Persemakmuran"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI_DESC: "Tuan penjajah yang jauh telah menentukan nasib Australia terlalu lama. Sekaranglah saatnya melepaskan kuk kekaisaran... dan membebaskan pihak lain di sepanjang jalan."
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI: "Komunis Komintern"
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI_DESC: "Hanya dalam persatuanlah utopia Komunis dapat terwujud, karena inilah jalan revolusi kaum buruh sedunia."
 INS_ai_behavior: "@INS Hindia Belanda"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI: "Historis"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI_DESC: "AI akan tetap setia kepada Belanda, tetapi akan memulai revolusi setelah menghadapi pendudukan Jepang."
 RULE_OPTION_LOYALIST_INS_AI: "Loyalisme"
 RULE_OPTION_LOYALIST_INS_AI_DESC: "AI akan tetap setia kepada Belanda, baik mencari kemerdekaan secara damai melalui petisi Soetardjo, atau mempertahankan tatanan kolonial."
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI: "Revolusi Sjahrir (Demokratis)"
 RULE_OPTION_REVOLUTION_DEMOCRATIC_INS_AI_DESC: "AI akan memulai revolusi lebih awal. Sutan Sjahrir akan mengambil alih kekuasaan dan mendirikan pemerintahan demokratis."
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI: "Revolusi Sukarno (Non-Blok)"
 RULE_OPTION_REVOLUTION_UNALIGNED_INS_AI_DESC: "AI akan memulai revolusi lebih awal. Sukarno akan mempertahankan kekuasaan dan gerakan oposisi akan dihentikan."
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI: "Revolusi Malaka (Komunisme)"
 RULE_OPTION_REVOLUTION_COMMUNIST_INS_AI_DESC: "AI akan memulai revolusi lebih awal. Tan Malaka akan melancarkan kudeta untuk membentuk pemerintahan komunis sebelum menyebarkan revolusi ke seluruh pasifik."
 SIA_ai_behavior: "@SIA Siam"
 RULE_OPTION_HISTORICAL_SIA_AI: "Historis"
 RULE_OPTION_HISTORICAL_SIA_AI_DESC: "AI akan mengikuti hasil historis. AI akan mengambil pohon fasis, menyerang Indochina dan bergabung dengan faksi Jepang."
