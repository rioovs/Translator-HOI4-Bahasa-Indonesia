 RULE_ALLOW_LEND_LEASE_FREE_DESC: "Negara dapat meminjam-sewakan perlengkapan kepada siapa pun pada tingkat Ketegangan Dunia berapa pun."
 RULE_ALLOW_LEND_LEASE_LIMITED_DESC: "Sewa-Pinjam dibatasi oleh Ketegangan Dunia dan aturan ideologi."
 RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_DESC: "Negara hanya dapat meminjam-sewakan perlengkapan ke negara dengan ideologi penguasa yang sama."
