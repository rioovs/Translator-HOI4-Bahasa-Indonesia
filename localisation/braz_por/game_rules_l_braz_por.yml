 RULE_ALLOW_GUARANTEES_BLOCKED_DESC: "Negara tidak pernah dapat Menjamin negara lain. Ini tidak memengaruhi Jaminan yang sudah ada di awal permainan atau yang diterbitkan melalui fokus nasional."
