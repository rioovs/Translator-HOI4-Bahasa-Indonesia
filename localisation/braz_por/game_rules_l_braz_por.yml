 RULE_ALLOW_VOLUNTEERS_FREE_DESC: "Negara dapat mengirim Relawan ke negara mana pun tanpa memandang Ketegangan Dunia."
 RULE_ALLOW_VOLUNTEERS_LIMITED_DESC: "Pengiriman Relawan dibatasi oleh aturan Ketegangan Dunia dan ideologi."
 RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC: "Negara hanya dapat mengirim Relawan ke negara-negara yang berbagi ideologi penguasa yang sama."
 RULE_ALLOW_VOLUNTEERS_BLOCKED_DESC: "Negara tidak pernah dapat mengirim Relawan ke negara mana pun."
 RULE_ALLOW_GUARANTEES: "Jamin Kemerdekaan"
