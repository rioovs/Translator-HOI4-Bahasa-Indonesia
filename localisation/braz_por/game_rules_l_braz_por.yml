 RULE_ALLOW_WARGOALS_FREE_25_DESC: "Pembuatan tujuan perang dinonaktifkan di bawah 25% Ketegangan Dunia, tetapi tersedia untuk semua negara setelahnya. Ini mengabaikan batasan ideologi apa pun, tetapi tetap mengizinkan perolehan tujuan perang melalui fokus."
 RULE_ALLOW_WARGOALS_FREE_50_DESC: "Pembuatan tujuan perang dinonaktifkan di bawah 50% Ketegangan Dunia, tetapi tersedia untuk semua negara setelahnya. Ini mengabaikan batasan ideologi apa pun, tetapi tetap mengizinkan perolehan tujuan perang melalui fokus."
 RULE_ALLOW_WARGOALS_FREE_75_DESC: "Pembuatan tujuan perang dinonaktifkan di bawah 75% Ketegangan Dunia, tetapi tersedia untuk semua negara setelahnya. Ini mengabaikan batasan ideologi apa pun, tetapi tetap mengizinkan perolehan tujuan perang melalui fokus."
 RULE_ALLOW_WARGOALS_FREE_100_DESC: "Pembuatan tujuan perang dinonaktifkan di bawah 100% Ketegangan Dunia, tetapi tersedia untuk semua negara setelahnya. Ini mengabaikan batasan ideologi apa pun, tetapi tetap mengizinkan perolehan tujuan perang melalui fokus."
