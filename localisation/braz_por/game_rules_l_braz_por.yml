 RULE_OPTION_FASCIST: "Fasis"
 RULE_OPTION_FASCIST_HISTORICAL: "Fasis - Historis"
 RULE_FASCIST_HISTORICAL_ITA_AI_DESC: "AI Italia akan berupaya mengikuti rangkaian peristiwa historis sebanyak mungkin."
 RULE_OPTION_FASCIST_ALTERNATE: "Fasis - Alternatif"
 RULE_FASCIST_ALTERNATE_ITA_AI_DESC: "AI Italia akan berupaya membentuk aliansi dengan Spanyol sebelum bergabung dengan Poros, dengan mengambil cabang yang relevan di pohon fokus nasional."
 RULE_OPTION_ALT_FASCIST_BALBO: "Fasis Alternatif - Italo Balbo"
 RULE_ALT_FASCIST_BALBO_ITA_AI_DESC: "AI Italia akan berupaya menggulingkan Mussolini dari kekuasaan, dan mengangkat Italo Balbo sebagai gantinya untuk mencari jalur independen ke depan."
 RULE_OPTION_ALT_FASCIST_GRANDI: "Fasis Alternatif - Dino Grandi"
 RULE_ALT_FASCIST_GRANDI_ITA_AI_DESC: "AI Italia akan berupaya menggulingkan Mussolini dari kekuasaan, dan mengangkat Dino Grandi sebagai gantinya untuk berupaya memperkuat hubungan dengan Sekutu."
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE: "Monarkis - Kekaisaran Romawi"
 RULE_OPTION_ITA_MONARCHIST_ROMAN_EMPIRE_AI_DESC: "Raja Vittorio Emanuele akan memimpin Italia menuju monarki absolutis, mencoba mewujudkan Mare Nostrum dan mereformasi Kekaisaran Romawi."
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY: "Demokrasi Kristen"
 RULE_OPTION_ITA_CHRISTIAN_DEMOCRACY_AI_DESC: "Raja Vittorio Emanuele akan mencopot Mussolini, berupaya membentuk faksi independen dan memimpin Italia menuju monarki konstitusional yang mendukung partai Kristen Demokrat, yang dipimpin oleh Alcide de Gasperi."
 RULE_OPTION_ITA_COMMUNIST_PLAN: "Komunisme Italia"
 RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC: "Anti-fasis Italia akan menggabungkan kekuatan untuk menggulingkan rezim fasis secara paksa, membentuk pemerintahan komunis, menghapuskan koloni, dan berupaya bergabung dengan Komintern."
 RULE_OPTION_ITA_DEMOCRATIC_PLAN: "Sosialisme Italia"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC: "Anti-fasis Italia akan menggabungkan kekuatan untuk menggulingkan rezim fasis secara paksa, membentuk pemerintahan sosial-demokrat, dan berupaya membentuk Konfederasi dengan bekas koloni di Afrika."
 RULE_OPTION_FIN_FASCIST_PLAN: "Fasis"
 RULE_OPTION_FIN_FASCIST_PLAN_DESC: "Sayap Kanan Finlandia, yang dipimpin oleh Gerakan Rakyat Patriotik, akan menggulingkan demokrasi konservatif terdahulu, berupaya memperkuat hubungan dengan Jerman dan mengandalkan organisasi seperti Mustapaidat dan Suojeluskunta untuk membangun militer yang kuat dan memperluas perbatasan negara sesuai dengan gagasan Finlandia Raya."
 RULE_OPTION_FIN_COMMUNIST_PLAN: "Komunis"
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC: "Mencari bantuan dari Uni Soviet, komunis akan mengorganisir gerakan sayap kiri Finlandia, menyatukan kaum sosialis, sosial-demokrat, dan elemen sayap kiri lainnya demi mengudeta pemerintah dan memimpin negara menuju revolusi baru melawan ancaman kapitalis dan fasis di luar negeri."
 RULE_OPTION_FIN_DEMOCRATIC_PLAN: "Demokratis"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC: "Sosial-Demokrat Finlandia akan menarik simpati rakyat Finlandia dan memimpin perubahan drastis namun tanpa pertumpahan darah dalam arah politik Finlandia. Finlandia kemudian akan berupaya bergabung dengan negara-negara demokrasi besar barat lainnya demi menjaga kedaulatan negara dan masyarakat kiri-konservatifnya."
 RULE_OPTION_GER_COMMUNIST_STALINIST: "Diktatur Proletariat"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC: "AI Jerman akan berupaya menggulingkan Nazi dan membawa revolusi komunis ke Jerman. Mereka kemudian akan berupaya mendirikan kediktatoran proletariat."
 RULE_OPTION_GER_COMMUNIST_SPARTACUS: "Bangkitkan Kembali Liga Spartakus"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC: "AI Jerman akan berupaya menggulingkan Nazi dan membawa revolusi komunis ke Jerman. Mereka kemudian akan berupaya membentuk rezim sosialis yang lebih demokratis di bawah Liga Spartakus yang baru, dan menyebarkan kobaran revolusi komunis ke seluruh Eropa."
 RULE_OPTION_GER_ALT_FASCIST: "Fasisme Alternatif"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC: "AI Jerman akan berupaya menggantikan Hitler dengan salah satu anggota Lingkaran Dalam, memperhatikan kekhawatiran von Neurath, dan berupaya menegakkan Tatanan Dunia Baru mereka."
