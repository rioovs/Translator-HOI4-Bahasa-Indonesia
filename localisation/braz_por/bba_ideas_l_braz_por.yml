 ITA_offensive_in_ethiopia: "Serangan di Ethiopia"
 ITA_offensive_in_ethiopia_desc: "Tentara kita bertekad untuk memukul mundur musuh – apa pun yang terjadi!"
 ITA_logistics_in_ethiopia: "Logistik di Etiopia"
 ITA_logistics_in_ethiopia_desc: "Dengan perencanaan dan logistik yang tepat, kita akan memperoleh keuntungan kecil namun stabil, tanpa mengorbankan orang-orang kita secara tidak perlu."
 ITA_stockpiling_fuel: "Menimbun Bahan Bakar"
 ITA_stockpiling_fuel_desc: "Memiliki cadangan bahan bakar yang besar akan membuat militer kita bisa beroperasi lebih lama."
 ITA_foggia_farm_fields: "Ladang Pertanian Foggia"
 ITA_foggia_farm_fields_desc: "Modernisasi industri pertanian Foggia akan menghasilkan produksi pangan yang lebih besar."
 ITA_hardened_irregular_bands: "Pita Tidak Beraturan yang Mengeras"
 ITA_hardened_irregular_bands_desc: "Dengan memanfaatkan para pejuang pribumi, kami dapat memperoleh banyak manfaat dari pengalaman pertempuran dan pengetahuan geografis mereka."
 ITA_hardened_irregular_bands_tt: "§G+5.00%§! Serangan, Pertahanan dan Kecepatan untuk §Y$irregular_infantry$§!, §Y$cavalry$§! dan §Y$camelry$§!"
 ITA_servizio_informazione_militare_ns: "$ITA_servizio_informazione_militare$"
 ITA_servizio_informazione_militare_ns_desc: "Badan intelijen kami akan membantu mencegah serangan spionase asing terhadap kami, serta meningkatkan ambisi internasional kami."
 ITA_devaluated_lira: "Lira terdevaluasi"
 ITA_devaluated_lira_desc: "Perang yang terjadi baru-baru ini telah memakan banyak biaya dan menghambat perekonomian kita. Devaluasi mata uang telah menjadikan produk-produk kita lebih kompetitif di pasar internasional, sehingga memberikan dorongan yang sangat dibutuhkan perekonomian kita."
 ITA_battaglia_del_grano: "Battaglia del Grano"
 ITA_battaglia_del_grano_desc: "Untuk benar-benar mandiri, kita tidak bisa bergantung pada kekuatan asing untuk pasokan pangan kita, namun kita harus mandiri dalam bidang pertanian. Pertempuran demi Biji-bijian akan membuat kita menjadi mandiri dan kekuatan kita akan semakin berkembang."
 ITA_battaglia_per_la_terra: "Battaglia per la Terra"
 ITA_battaglia_per_la_terra_desc: "Pertempuran kami untuk Tanah akan menguras bermil-mil rawa dan menciptakan lahan pertanian. Hal ini juga akan memberikan peluang kerja baru dan pemerintah asing telah terkesan dengan semangat tak terpatahkan dari masyarakat Italia."
 ITA_battaglia_per_la_nascite: "Battaglia per le Nascite"
 ITA_battaglia_per_la_nascite_desc: "Agar Italia benar-benar berkembang, kita memerlukan lebih banyak tentara. Untuk mendapatkan lebih banyak tentara, kita membutuhkan populasi yang lebih besar. Untuk mendapatkan populasi yang lebih besar, kita membutuhkan ibu. Yang dibutuhkan para ibu adalah kita memenangkan Pertarungan untuk Kelahiran."
 ITA_camicie_nere: "Camicie Nere"
 ITA_camicie_nere_desc: "Kaum Blackshirts telah bersumpah secara pribadi kepada [ITA.GetLeader], menjadikan mereka lebih dapat diandalkan dan setia dibandingkan anggota Angkatan Darat lainnya. Memberi mereka lebih banyak wewenang dan tanggung jawab hanya akan memperkuat pemerintahan kita."
 ITA_camicie_nere_mp_tt: "§YPolisi Militer§!: Bonus Penindasan: §G+5.0%§!"
 ITA_italian_irredentism_ns: "$ITA_italian_irredentism$"
 ITA_italian_irredentism_ns_desc: "Agar [ITA.GetNameDef] dapat mencapai potensi dan kekuatannya secara maksimal, kita harus memperluas perbatasan alam kita dan menyatukan semua wilayah yang menjadi hak milik rakyat Italia!"
 ITA_bandits_war: "Perang Bandit"
 ITA_bandits_war_desc: "Mobilitas dan mekanisasi adalah masa depan peperangan. Kita harus berinvestasi besar-besaran dalam memodernisasi angkatan bersenjata kita agar berhasil di medan perang saat ini."
 ITA_alpine_defense: "Pertahanan Alpen"
 ITA_alpine_defense_desc: "Pertempuran brutal di pegunungan selama Perang Besar masih segar dalam ingatan banyak orang. Kita harus mengamankan front utara kita dari potensi serangan dengan memiliki tentara yang mampu dan mampu berperang secara efektif di medan tersebut."
 ITA_aviazione_legionaria: "Aviazione Legiunaria"
 ITA_aviazione_legionaria_desc: "Mengamankan Superioritas Udara sangat penting bagi pasukan mana pun untuk meraih keunggulan dan memukul mundur musuh."
 ITA_sold_obsolete_escort_ships_ns: "Menjual Kapal Pengawal Usang"
 ITA_sold_obsolete_escort_ships_ns_desc: "Mengekspor kapal perang ke negara lain telah memperkuat kemampuan industri kita."
 ITA_strengthened_heavy_industry: "Penguatan Industri Berat"
 ITA_strengthened_heavy_industry_desc: "Memperluas kapasitas industri kita akan meningkatkan produktivitas industri kita."
 ITA_strengthened_the_army: "Memperkuat Angkatan Darat"
 ITA_strengthened_the_army_desc: "Memperluas angkatan bersenjata telah mengajarkan kita banyak hal mengenai mobilisasi pasukan dan mengorganisasi mereka menjadi kekuatan tempur yang koheren."
 ITA_disgruntlement_in_the_army: "Ketidakpuasan di Angkatan Darat"
 ITA_disgruntlement_in_the_army_desc: "Ketidakpuasan telah merembes ke dalam tubuh militer setelah mereka disalahkan karena tidak mampu melakukan ekspansi dengan cukup cepat."
 ITA_efficient_supply_lines: "Jalur Pasokan yang Efisien"
 ITA_efficient_supply_lines_desc: "Logistik Angkatan Darat tidak akan terlalu rumit karena jalur pasokan kami mendapat manfaat besar dari armada truk pasokan yang baru dibangun."
 ITA_fuel_reserves: "Cadangan Bahan Bakar"
 ITA_fuel_reserves_desc: "Memiliki cadangan bahan bakar yang besar akan membebaskan militer kita untuk melakukan lebih banyak perjalanan dan menjadi lebih aktif."
 ITA_strengthened_the_airforce: "Memperkuat Angkatan Udara"
 ITA_strengthened_the_airforce_desc: "Angkatan udara Italia sekali lagi menjadi salah satu armada udara termegah di dunia. Para pilot yang baru dilatih sangat ingin menunjukkan betapa hebatnya angkatan udara yang kita miliki sekarang."
 ITA_disgruntlement_in_the_airforce: "Ketidakpuasan di Angkatan Udara"
 ITA_disgruntlement_in_the_airforce_desc: "Angkatan udara dijanjikan sumber daya dan dana baru untuk memperluas pasukannya, namun tidak ada yang muncul dan ketidakpuasan menyebar di kalangan pasukan."
 ITA_expanded_intelligence_service_basic: "Badan Intelijen yang Diperluas"
 ITA_expanded_intelligence_service_basic_desc: "Badan intelijen yang diperluas akan meningkatkan keamanan dalam negeri kita."
 ITA_bolstered_political_cabinet: "Kabinet Politik yang Didukung"
 ITA_bolstered_political_cabinet_desc: "Memiliki orang yang tepat di tempat yang tepat akan memperkuat sistem fasis dan kekuasaan kita atas [ITA.GetNameDef]."
 ITA_bolstered_military_high_command: "Komando Tinggi Militer yang Diperkuat"
 ITA_bolstered_military_high_command_desc: "Memiliki kepemimpinan yang kompeten sangat penting agar militer dapat berfungsi secara optimal dan berhasil di medan perang."
 ITA_all_within_the_state_ns: "$ITA_all_within_the_state$"
 ITA_all_within_the_state_ns_desc: "Memperkuat kemampuan kita di belakang garis depan akan menjamin jalan menuju kemenangan."
 ITA_anti_partisan_measures_ns: "$ITA_anti_partisan_measures$"
 ITA_anti_partisan_measures_ns_desc: "Unit khusus kami menghalangi pergerakan para partisan, mempersulit mereka untuk menyerang di belakang garis depan."
 ITA_gappisti_ns: "$ITA_gappisti$"
 ITA_gappisti_ns_desc: "Unit-unit partisan kecil kami menyerang musuh dengan keras di belakang garis depan, melemahkan moral mereka dan meningkatkan perlawanan penduduk setempat."
 ITA_grande_rivolta_rurale_ns: "$ITA_grande_rivolta_rurale$"
 ITA_grande_rivolta_rurale_ns_desc: "Kami telah berhasil menggalang kaum tani di pedesaan untuk mendukung tujuan kami!"
 ITA_liberation_or_death_ns: "$ITA_liberation_or_death$"
 ITA_liberation_or_death_ns_desc: "Dorongan terakhir untuk membebaskan Italia dari tirani telah dimulai; tidak ada jalan untuk kembali sekarang!"
 ITA_grande_rivolta_rurale_terrain_bonus_tt: "Mengaktifkan §YMountain Warfare Doctrine§! saat semangat nasional ini aktif, memberikan §Y$militia$s§! bonus medan di §Y$hills$§! dan §Y$mountain$§!: Serangan: §G+5%§!, Pergerakan: §G+10%§!"
 ITA_independence_war: "Perang Kemerdekaan"
 ITA_independence_war_desc: "Kami akan membebaskan Italia dari penindas kami!"
 ITA_nuclear_research: "Penelitian Nuklir"
 ITA_nuclear_research_desc: "Kita sedang memelopori pengembangan energi atom, dan dalam waktu dekat kita akan menjadi kekuatan militer terbesar di dunia."
 ITA_political_reforms: "Reformasi Politik"
 ITA_political_reforms_desc: "Mereformasi sistem politik akan meremajakan dan menstabilkan bangsa kita."
 ITA_setting_course_ns: "$ITA_setting_course$"
 ITA_setting_course_ns_desc: "$ITA_setting_course_desc$"
 ITA_papal_support: "Dukungan Kepausan"
 ITA_papal_support_desc: "Paus masih mempunyai pengaruh yang besar terhadap masyarakat Italia dan dengan persetujuan serta dukungannya kita akan mampu mempengaruhi banyak hati dan perasaan terhadap tujuan kita."
 ITA_papal_state: "Negara Kepausan"
 ITA_papal_state_desc: "Dengan lahirnya kembali Kepausan dan kendali atas Italia, orang-orang berbondong-bondong menemui Yang Mulia untuk meminta bimbingan dan dukungan."
 ITA_papal_state_catholic_dominion: "Dominasi Katolik"
 ITA_papal_state_catholic_dominion_desc: "Dengan naiknya Kepausan sebagai kekuatan besar dunia, terserah pada kita untuk melaksanakan kehendak Tuhan dan seperti seorang gembala yang membimbing kawanannya, melindungi umat Kristiani yang setia dari kejahatan."
 ITA_papal_state_catholic_dominion_puppet_discount_tt: "§YPengurangan biaya§! untuk aksi §YNegeri Boneka§! dalam Konferensi Perdamaian."
 ITA_cooperation_of_the_bourgeoisie: "Kerjasama Borjuasi"
 #ITA_cooperation_of_the_bourgeoisie_desc: "NEEDED?"
 ITA_seizing_old_equipment: "Merebut Peralatan Lama"
 ITA_international_aid: "Bantuan Internasional"
 ITA_disgruntled_military: "Militer yang tidak puas"
 ITA_disgruntled_military_desc: "Membersihkan militer dari unsur-unsur royalis yang dapat mengancam republik baru kami telah menyebabkan kami kehilangan kepemimpinan yang berpengalaman."
