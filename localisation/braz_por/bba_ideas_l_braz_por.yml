 ITA_italia_irredenta_achieved: "Italia Irredenta Tercapai"
 AOI_africa_orientale_italiana_idea: "Afrika Orientale Italiana"
 ITA_banda_carita_non_la_resistance: "Banda Carita"
 ITA_ALB_italian_settlers: "Masuknya Pemukim Italia"
 ITA_dodecanese_treaty_idea: "Perjanjian Dodecanese"
 ITA_italys_destiny_idea: "Takdir Italia"
 ITA_vento_aureo: "Angin Emas"
 ITA_shadow_of_mussolini: "Bayangan Mussolini"
 ITA_shadow_of_mussolini_desc: "Meski sudah digulingkan dari kekuasaannya, bayang-bayang Mussolini sulit untuk dihilangkan karena masih membayangi politik Italia."
 ITA_divino_duce_1: "Divino Duce"
 ITA_divino_duce_1_desc: "Dengan kultus kepribadian yang kuat di sekitar [ITA.GetLeader], orang-orang Italia tidak akan pernah melepaskan atau menghancurkan kesetiaan mereka kepada Duce mereka. Mereka akan menanggung segala kesulitan yang menimpa mereka dengan mudah dan tidak pernah menyerah."
 ITA_divino_duce_2: "$ITA_divino_duce_1$"
 ITA_divino_duce_2_desc: "$ITA_divino_duce_1_desc$"
 ITA_italian_hegemony_master_1: "Hegemoni Italia"
 ITA_italian_hegemony_master_1_desc: "Sebagai tempat lahirnya Fasisme, tujuan kami jelas; untuk menjadi pelindungnya dan menyebarkannya jauh dan luas. Kami akan menanamkan rasa tanggung jawab dan kesetiaan terhadap sistem fasis pada setiap orang yang berada di bawah hegemoni kami."
 ITA_italian_hegemony_master_2: "$ITA_italian_hegemony_master_1$"
 ITA_italian_hegemony_master_2_desc: "$ITA_italian_hegemony_master_1_desc$"
 ITA_italian_hegemony_master_3: "$ITA_italian_hegemony_master_1$"
 ITA_italian_hegemony_master_3_desc: "$ITA_italian_hegemony_master_1_desc$"
 ITA_italian_hegemony_subjects: "Hegemoni Italia"
 ITA_italian_hegemony_subjects_desc: "Bersatu di bawah hegemoni [ITA.GetNameDef], kami adalah pelindung fasisme, bertindak seperti benteng kebenaran dan pencerahan. Tidak seorang pun dan tidak ada apa pun yang akan menghalangi kita!"
 ITA_prioritizing_the_military: "Mengutamakan Militer"
 ITA_prioritizing_the_military_desc: "Dengan mengalihkan dana dan sumber daya dari tempat lain, kita akan dapat fokus pada angkatan bersenjata kita. Meskipun daerah-daerah tertentu akan terkena dampaknya dalam jangka pendek, kita akan mendapatkan dampak yang lebih besar dalam jangka panjang."
 ITA_impero_italiano: "Impero Italia"
 ITA_impero_italiano_desc: "Proklamasi Kekaisaran Italia telah menguatkan pasukan kami dan melegitimasi klaim kami di Afrika."
 ITA_novus_ordo_modifier: "Novus Ordo"
 ITA_expanded_corporatism_modifier: "Korporatisme yang Diperluas"
### Switzerland ###
 SWI_spirit_of_resistance_idea: "Semangat Perlawanan Swiss"
 SWI_swiss_neutrality: "Netralitas Swiss"
 SWI_werner_risch: "Werner-Risch"
 SWI_eidgenossische_FW: "Eidgenossische F+W"
 SWI_eidgenossische_KW: "Eidgenossische K+W"
 SWI_eidgenossische_WF: "Eidgenossische W+F"
 SWI_sig: "TANDA"
 SWI_oerlikon: "Oerlikon"
 SWI_saurer: "Saurer"
 SWI_berna: "Berna"
 SWI_buero_ha_idea: "Buero Ha"
 SWI_expanded_spy_network_idea: "Jaringan Mata-mata yang Diperluas"
 SWI_spirit_of_saint_bernard_idea: "Semangat Santo Bernard"
 SWI_spirit_of_saint_bernard_idea_tooltip: "Trickleback Rumah Sakit Lapangan: §G+10%§!\nExp. Faktor Kerugian: §G-30%§!"
 SWI_mountaineer_paratroopers_idea: "$SWI_mountaneer_paratroopers$"
 SWI_mountaineer_paratroopers_idea_desc: "Akses ke beberapa puncak paling curam, dan budaya pegunungan Alpen selama berabad-abad memberi Pasukan Terjun Payung Swiss keunggulan dibandingkan semua pasukan infanteri lintas udara lainnya. Mereka dapat turun dari pesawat angkut kita dan mendominasi puncak gunung seolah-olah berada di Monte Rosa atau Matterhorn."
 SWI_mountaineer_paratroopers_idea_TT: "§YPegunungan§!:\nSerangan: §G+35%§!\nPertahanan: §G+10%§!\nPergerakan: §G+20%§!\n§YHills§!:\nSerangan: §G+20%§!\nPertahanan: §G+5%§!\nGerakan: §G+10%§!"
 SWI_air_production_ns: "Produksi Pesawat Swiss"
 SWI_air_production_ns_desc: "Pabrik-pabrik kami berdedikasi untuk memproduksi pesawat terbang secepat mungkin sehingga kemampuan kami untuk berperang di udara dapat mengimbangi tetangga kami."
 SWI_federal_police_idea: "Intelijen Polisi Federal Swiss"
 SWI_federal_police_idea_no_lar: "$SWI_federal_police_idea$"
 SWI_federal_police_idea_no_lar_2: "$SWI_federal_police_idea$"
 SWI_infiltrated_federal_police_idea: "Polisi Federal yang Menyusup"
 SWI_infiltrated_federal_police_idea_no_lar: "$SWI_infiltrated_federal_police_idea$"
 SWI_infiltrated_federal_police_idea_desc: "Elemen fasis telah menyusup ke Kepolisian Federal dan cabang intelijennya. Tidak ada yang tahu cara mereka membantu tetangga kita yang fasis menyusup ke masyarakat [SWI.GetName]."
 SWI_pro_helvetia_idea: "Pro Helvetia"
 SWI_pro_helvetia_idea_desc: "Agar Swiss dapat bertahan, Swiss harus menjadi negara yang berbeda dari bahasa yang digunakan di dalamnya. Itulah sebabnya Pro Helvetia mempunyai tugas untuk mempromosikan nilai-nilai Swiss, dan komitmen yang sesuai terhadap Demokrasi yang menyertainya."
 SWI_martial_law_idea: "Darurat Militer"
 SWI_martial_law_idea_desc: "Saat-saat berbahaya memerlukan tindakan berbahaya. Militer harus mengambil alih untuk menjamin ketertiban dan stabilitas. Jika beruntung [ROOT.GetAdjective] dapat dipulihkan suatu hari nanti."
 SWI_extensive_press_censorship_idea: "Sensor Pers yang Luas"
 SWI_active_trade_agreement: "Persediaan dari perjanjian perdagangan"
 SWI_trading_with_switzerland_military: "Mengimpor produksi perang dari Swiss"
 SWI_trading_with_switzerland_civilian: "Mengimpor produksi sipil dari Swiss"
 SWI_no_confederation_president_idea: "Tidak ada Presiden Konfederasi yang terpilih"
 SWI_no_confederation_president_idea_desc: "Hal yang tidak terpikirkan telah terjadi, dan Dewan Federal gagal memilih Presiden konfederasi Swiss. Dibutuhkan banyak upaya untuk keluar dari situasi ini."
 SWI_foreign_fascist_propaganda: "Propaganda Fasis Asing"
 SWI_foreign_fascist_propaganda_desc: "Meskipun tidak ada gerakan Fasis besar yang berasal dari [SWI.GetName], tetangga Fasis kita sangat ingin menghancurkan konfederasi kita dari dalam, dengan kolom kelima dan operasi propaganda di setiap kanton, terutama di wilayah yang berbahasa [GER.GetAdjective] dan [ITA.GetAdjective]."
 SWI_extensive_fascist_propaganda: "Propaganda Fasis yang Luas"
 SWI_extensive_fascist_propaganda_desc: "Propaganda fasis di Swiss biasanya datang dari luar, namun gerakan ini telah mendapatkan momentum yang cukup untuk membanjiri negara tersebut dengan propaganda fasis dari dalam dan luar."
 SWI_rearmaming_idea: "Persenjataan Kembali yang Berkelanjutan"
 SWI_increased_defense_budget: "Meningkatkan Anggaran Pertahanan"
 SWI_war_bonds: "Obligasi Perang"
 SWI_banned_foreign_nazi_propaganda_idea: "Melarang Propaganda Nazi di Luar Negeri"
 SWI_banned_foreign_nazi_propaganda_idea_desc: "Nazisme tidak mendapat tempat dalam masyarakat seperti kita, jadi kita tidak bisa membiarkan penyebaran ideologi yang mengancam struktur konfederasi kita, apalagi propaganda yang datang dari negara asing."
 SWI_rearmed_idea_industrial: "Mempersenjatai kembali Swiss"
 SWI_army_limitations_TT: "§RTidak dapat melatih pasukan reguler di luar Milisi Warga, dan tidak dapat mengedit template yang ada di luar keputusan Kesiapan Militer§!\n\n§YSwiss§! bergantung pada penduduk sipil untuk mengangkat senjata bila diperlukan. Milisi dalam jumlah terbatas dapat dilatih, dan §YOrganisasi§! mereka pada awalnya akan dibatasi.\n\nSetelah fokus §Y$SWI_armed_neutrality$§! selesai, milisi akan dapat diperluas, ditingkatkan, dan pada akhirnya, dikerahkan dengan menggunakan §Y$SWI_activate_militia$§! keputusan. Ketika milisi dikerahkan, hukuman terhadap perekonomian Swiss akan bertambah seiring berjalannya waktu, namun hukuman tersebut akan diatur ulang setelah ditarik kembali."
 SWI_citizen_militia_1: "Milisi Warga Swiss"
 SWI_citizen_militia_1_desc: "Tidak seperti kebanyakan negara lain, di Swiss, setiap orang yang memenuhi kriteria perekrutan diharapkan untuk mengangkat senjata di Milisi lokalnya jika diperlukan. Hal ini memungkinkan kita untuk memiliki sebagian besar populasi sebagai cadangan tanpa konsekuensi besar terhadap perekonomian kita selama mereka tidak dikerahkan."
 SWI_citizen_militia_2: "Milisi Warga Swiss yang Diperluas"
 SWI_citizen_militia_2_desc: "$SWI_citizen_militia_1_desc$"
 SWI_spirit_of_helvetia_passive_peace: "Roh Pasif Helvetia"
 SWI_spirit_of_helvetia_passive_war: "$SWI_spirit_of_helvetia_passive_peace$"
 SWI_spirit_of_helvetia_defensive_peace: "Semangat Pertahanan Helvetia"
 SWI_spirit_of_helvetia_defensive_war: "$SWI_spirit_of_helvetia_defensive_peace$"
 SWI_spirit_of_helvetia_aggressive_peace: "Semangat Agresif Helvetia"
 SWI_spirit_of_helvetia_aggressive_war: "$SWI_spirit_of_helvetia_aggressive_peace$"
 SWI_frontier_defense_plan_idea_1: "Rencana Pertahanan Perbatasan"
 SWI_infrastructure_rigged_to_blow: "Infrastruktur Dicurangi"
 SWI_infrastructure_rigged_to_blow_desc: "Kita tidak bisa membiarkan musuh menggunakan infrastruktur dan industri yang kita peroleh dengan susah payah untuk melawan kita, kita siap meledakkan semuanya segera setelah musuh menguasainya."
 SWI_aktion_nationaler_widerstand_idea: "Aksi Nasional Lebih Luas"
 SWI_aktion_nationaler_widerstand_idea_desc: "Sekelompok rahasia warga sipil yang mewakili setiap aspek masyarakat Swiss, bertekad untuk mempromosikan nilai-nilai Swiss dan meletakkan dasar perlawanan jika hal terburuk terjadi."
 SWI_old_switzerland_idea: "Kembali ke Swiss Lama"
 SWI_old_switzerland_idea_desc: "Setelah sekian lama mengalami perang yang mengerikan dan ekspansi yang tidak bermoral, masyarakat [ROOT.GetName] menuntut kembalinya netralitas dan demokrasi pada masa sebelum perang. Masa-masa penuh gejolak ini akan segera berakhir."
 SWI_extended_supply_lines_idea: "Jalur Pasokan yang Diperluas"
 SWI_extended_supply_lines_idea_desc: "Kami telah meningkatkan logistik sehingga kami dapat memperluas jalur pasokan kami lebih jauh, dan membangun jalur pasokan baru dengan lebih cepat dibandingkan sebelumnya."
 SWI_expanded_special_forces: "Pasukan Khusus yang Diperluas"
 SWI_swiss_women_in_the_military: "Wanita Swiss di Militer"
 SWI_volunteer_forces_idea: "Pasukan Relawan"
 SWI_volunteer_forces_idea_desc: "Meskipun sesuai dengan kebijakan kami yang biasa, [SWI.GetNameDef] tidak secara resmi menjadi bagian dari konflik apa pun, kami mengizinkan, dan secara diam-diam mendorong, untuk bergabung sebagai sukarelawan, khususnya jika hal tersebut menyangkut pembelaan demokrasi."
 SWI_frozen_assets: "Aset yang Dibekukan oleh Swiss"
 SWI_frozen_assets_desc: "Setelah mengandalkan perbankan Swiss selama bertahun-tahun, mereka telah menunjukkan niat mereka yang sebenarnya dan menusuk kami dari belakang dengan membekukan aset kami! Kami akan pulih secara finansial dari hal ini, namun hal itu memerlukan waktu."
 SWI_intel_support_idea: "Dukungan Intelijen"
 SWI_humanitarian_effort: "Upaya Kemanusiaan"
 SWI_communist_party_banned_idea: "Komunisme Dilarang"
 SWI_alpine_redoubt_dynamic_modifier: "$SWI_alpine_redoubt$"
 SWI_democratic_unrest: "Kerusuhan Demokrat"
 SWI_democratic_unrest_desc: "Setelah satu abad demokrasi langsung, masyarakat [ROOT.GetAdjective] tidak akan tinggal diam dengan keadaan politik [ROOT.GetName] saat ini."
 SWI_resistance_groups_funded_by_foreign_country: "Kelompok Perlawanan Didanai oleh Negara Asing"
 SWI_gold_trade_with_switzerland: "Perdagangan Emas Swiss"
 SWI_swiss_gold_market: "Pasar Emas Swiss"
 SWI_seized_gold: "Emas yang Disita"
 SWI_stole_our_gold_reserves: "Cadangan Emas yang Dicuri"
 SWI_foreign_investments_idea: "Penanaman Modal Asing"
 SWI_swiss_democratic_propaganda: "Propaganda Demokrat Swiss"
 SWI_swiss_democratic_propaganda_desc: "Setelah mereka mendesak Vorarlberg untuk bergabung dengan mereka, [SWI.GetNameDef] melanjutkan kampanye propaganda ekstensif di seluruh [AUS.GetNonIdeologyName]. Mereka memfokuskan upaya mereka dalam mempromosikan bentuk demokrasi yang khas, perlawanan terhadap Fasisme, dan yang terpenting, bergabung dengan konfederasi mereka."
