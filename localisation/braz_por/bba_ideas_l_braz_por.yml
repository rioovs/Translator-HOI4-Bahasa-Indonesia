 ITA_agip: "Agip"
 ITA_terni_industria_ed_elettricita: "Terni Industria dan Elettricita"
 ITA_italcementi: "Italcementi"
 ITA_astaldi: "Astaldi"
 ITA_ducati_energia: "Ducati Energia"
 ITA_northern_designer_tt: "Desainer ini terletak di bagian utara Italia. Menyelesaikan fokus '§Y$ITA_strengthen_northern_industry$§!' dan '§Y$ITA_new_industrialization_program$§!' akan meningkatkan kualitas desainer."
 ITA_southern_designer_tt: "Desainer ini terletak di bagian selatan Italia. Menyelesaikan fokus '§Y$ITA_modernize_the_mezzogiorno$§!' dan '§Y$ITA_new_industrialization_program$§!' akan meningkatkan kualitas desainer."
 ITA_northern_designer_improved_tt: "§YDesainer Utara ini telah ditingkatkan§!."
