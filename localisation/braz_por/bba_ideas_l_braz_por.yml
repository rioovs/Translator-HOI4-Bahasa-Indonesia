 ITA_ricostruzione_industriale_dynamic_modifier: "Rikostruzione Industriale"
 ITA_ricostruzione_industriale_dynamic_modifier_desc: "Upaya kami untuk menyelamatkan industri dalam negeri setelah Depresi Hebat terbukti berhasil. Dengan berinvestasi lebih jauh lagi pada kapasitas industri Italia, produktivitas kita akan segera menyaingi produktivitas negara-negara besar."
 ITA_military_industry_dynamic_modifier: "Industri Militer"
 ITA_military_industry_dynamic_modifier_desc: "Kompleks militer dalam negeri kita telah tertinggal dibandingkan pesaing kita dalam hal produktivitas dan teknologi. Kita harus memperkuat industri militer Italia jika ingin pasukan kita sukses di medan perang."
