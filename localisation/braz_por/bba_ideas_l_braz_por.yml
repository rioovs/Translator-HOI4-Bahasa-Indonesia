 lon_arms_resolution_tt: "Resolusi Liga Bangsa-Bangsa mencegah perdagangan senjata dengan [ROOT.GetName] sampai berakhirnya permusuhan antara [ITA.GetName] dan [ETH.GetName]."
 ETH_ethiopia_supporting_independence_idea: "[ETH.GetName] Mendukung Kemerdekaan"
 ETH_prince_regent_idea: "Pangeran Bupati $ETH_ras_imru_haile_selassie$"
 ETH_prince_regent_idea_desc: "Sementara kaisar $ETH_haile_selassie$ sedang pergi untuk memperjuangkan tujuan [ROOT.GetAdjective] di Liga Bangsa-Bangsa, Ras $ETH_ras_imru_haile_selassie$ ditugaskan untuk membela negara dari penjajah, dan bertindak sebagai pemimpin de facto [ROOT.GetName] hingga kaisar kembali."
 ETH_conservative_high_command_idea: "Komando Tinggi Konservatif"
 ETH_conservative_high_command_idea_desc: "Ras 'dari [ETH.GetName] tahu cara berperang. Tidak ada kebutuhan untuk mengubah sesuatu yang telah terbukti efektif selama berabad-abad. Musuh selalu dikalahkan dengan serangan habis-habisan, dimana moral dan jumlah pasukan [ETH.GetAdjective] yang unggullah yang menang."
 ETH_the_heroes_of_adwa_idea: "Pahlawan Adwa"
 ETH_the_heroes_of_adwa_idea_desc: "Kaisar Menelik mengalahkan penjajah Italia di Pertempuran Adwa. Hari itu kami menunjukkan kepada dunia kemampuan tentara kami, dan memaksa penjajah keluar dari negara kami. Kami telah melakukannya sekali, dan kami dapat melakukannya lagi."
 ETH_taxed_nobility_idea: "Bangsawan yang Dikenai Pajak"
 ETH_on_our_own_idea: "Sendirian"
 ETH_on_our_own_idea_desc: "Komunitas internasional telah mengambil sikap dalam konflik antara [ITA.GetName] dan [ETH.GetName] dan memutuskan bahwa tidak ada negara lain yang boleh ikut campur. [ETH.GetName] berdiri sendiri di saat-saat sulit ini."
