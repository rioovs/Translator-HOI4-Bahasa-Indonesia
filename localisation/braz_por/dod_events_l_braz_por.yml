l_braz_por:
 DOD_hungary.1.t: "Hongaria menuntut referendum"
 DOD_hungary.1.desc: "dalam pidatonya di Budapest, [HUN.GetLeader] menuntut agar rakyat Austria diizinkan kembali ke pemerintahannya. Namun, sebagai isyarat rekonsiliasi, ia secara terbuka menyatakan bahwa rakyat Austria harus diizinkan untuk membuat pilihan sendiri."
 DOD_hungary.1.a: "Biarkan masyarakat menyampaikan pendapatnya."
 DOD_hungary.1.b: "Hal-hal seperti itu harus diserahkan kepada para profesional."
 DOD_hungary.1.c: "Kami akan memastikan hasil yang tepat."
 DOD_hungary.2.t: "Referendum disetujui"
 DOD_hungary.2.desc: "Hasil Referendum sudah keluar, dan penghitungan awal menunjukkan mayoritas yang signifikan mendukung Persatuan dengan Hongaria."
 DOD_hungary.2.a: "Masyarakat sudah angkat bicara."
 DOD_hungary.3.t: "Referendum gagal"
 DOD_hungary.3.desc: "Meskipun terdapat kampanye yang terencana dengan baik oleh kelompok pro-Hungaria dan kaum monarki, hasil awal menunjukkan mayoritas kecil yang mempertahankan status quo."
 DOD_hungary.3.a: "Pilihan yang bijaksana."
 DOD_hungary.4.t: "Referendum berhasil"
 DOD_hungary.4.desc: "Tak lama setelah tengah malam, [AUS.GetLeader] mengumumkan bahwa rakyat Austria telah memilih untuk bersatu dengan Hongaria. Sebuah telegram telah tiba, secara resmi menawarkan [HUN.GetLeader] mahkota Austria sebagai langkah pertama untuk menghidupkan kembali monarki ganda."
 DOD_hungary.4.a: "Bagus sekali."
 DOD_hungary.5.t: "Referendum dikalahkan"
 DOD_hungary.5.desc: "Terlepas dari upaya terbaik kami, rakyat Austria telah memutuskan untuk mempertahankan status quo."
 DOD_hungary.5.a: "Kita harus membebaskan negara ini dan mengembalikannya kepada penguasa yang sah."
 DOD_hungary.5.b: "Kami akan menghormati hasilnya."
 DOD_hungary.6.t: "Referendum ditolak"
 DOD_hungary.6.desc: "Pemimpin Austria [AUS.GetLeader] telah secara terbuka menyatakan bahwa seluruh negara bersatu dalam menentang Habsburg, dan bahwa gagasan referendum kemerdekaan Austria sama sekali tidak masuk akal."
 DOD_hungary.6.a: "Kita akan melihat betapa bersatunya mereka."
 DOD_hungary.6.b: "\"Demokrasi\" sedang berjalan."
 DOD_hungary.7.t: "Memandu referendum"
 DOD_hungary.7.desc: "Tawaran referendum Hongaria telah menempatkan kita pada posisi yang sulit secara internasional. Kita tidak bisa terlihat menolak pilihan masyarakat, tapi kita tidak bisa mempercayai mereka untuk mengambil keputusan yang benar. Untungnya, ada cara dan sarana untuk mengatasi masalah ini. Hasil apa yang kita inginkan dari referendum?"
 DOD_hungary.7.a: "Orang-orang menolak"
 DOD_hungary.7.b: "Orang-orang setuju"
 DOD_hungary.10.t: "Austria-Hongaria menawarkan Jaminan"
 DOD_hungary.10.desc: "Dengan perubahan dramatis yang terjadi baru-baru ini dalam lanskap politik Balkan, pertanyaan mengenai hubungan kita dengan Kekaisaran Austro-Hungaria yang baru telah muncul berulang kali. Hari ini, duta besar Hongaria telah menyerahkan sebuah catatan resmi, yang secara resmi meminta agar kami menyatakan posisi kami terhadap Kekaisaran. Keluarga Habsburg mengklaim bahwa, sebagai wilayah kekuasaan lama, Bohemia dan Moravia adalah milik mereka.\n\nNamun, [HUN.GetLeader] telah mengindikasikan bahwa dia akan menerima solusi kompromi, dengan dirinya sendiri sebagai kepala negara negara kita, tetapi dengan kekuatan nyata yang sangat kecil."
 DOD_hungary.10.a: "Kami akan kembali ke Kekaisaran."
 DOD_hungary.10.b: "Kami akan menerima kompromi tersebut."
 DOD_hungary.10.c: "Kami tidak akan pernah melepaskan kebebasan kami demi keamanan!"
 DOD_hungary.11.t: "Bohemia kembali ke mahkota"
 DOD_hungary.11.desc: "Setelah diskusi di tingkat tertinggi yang berlangsung hingga larut malam, pemerintah [CZE.GetAdjective] telah memutuskan untuk menerima tawaran kami dan menyatakan [HUN.GetLeader] sebagai Raja Bohemia dan Margrave Moravia. Para prajurit bekas Angkatan Darat Ceko telah bersumpah kepada Raja dan Kaisar baru mereka, dan pemerintahan sipil di wilayah tersebut telah terintegrasi sepenuhnya."
 DOD_hungary.11.a: "Satu langkah lagi untuk mendapatkan kembali hak kesulungan kita."
 DOD_hungary.12.t: "Bohemia setuju untuk hubungan yang lebih dekat"
 DOD_hungary.12.desc: "Dengan menjaga keseimbangan antara faksi republik dan monarki di pemerintahannya, [CZE.GetLeader] telah memilih solusi kompromi. [HUN.GetLeader] akan dinyatakan sebagai Raja Bohemia dan Moravia, namun konstitusi [CZE.GetAdjective] akan membatasi kekuasaannya untuk hanya bertindak berdasarkan saran dan persetujuan parlemen."
 DOD_hungary.12.a: "Dapat diterima."
 DOD_hungary.13.t: "[CZE.GetNameDefCap] menolak uang muka"
 DOD_hungary.13.desc: "[CZE.GetNameDefCap] telah menolak untuk melakukan penyelesaian atau perjanjian apa pun mengenai hubungan mereka di masa depan dengan kami. Ketika duta besar kami tiba di kantor luar negeri untuk membahas catatan resmi yang telah ia sampaikan sebelumnya, ia diberitahu bahwa tidak ada yang perlu dibicarakan, dan segera diantar keluar. Duta Besar [CZE.GetAdjective] untuk pemerintah kita telah menyatakan bahwa, meskipun pemerintahannya menginginkan hubungan yang damai dan bersahabat antara negara kita, tidak ada kemungkinan untuk memasukkan [CZE.GetNameDef] ke dalam Kekaisaran Austro-Hungaria."
 DOD_hungary.13.a: "Sangat disayangkan."
 DOD_hungary.20.t: "Perang di Hongaria"
 DOD_hungary.20.desc: "Setelah pecahnya perang di Hongaria, pertanyaan mengenai dukungan terhadap mereka telah muncul berulang kali. Surat kabar konservatif menyerukan tindakan untuk membantu Hongaria, mengklaim bahwa Raja tidak dapat diharapkan untuk berdiam diri sementara putranya sendiri, yang sekarang menjadi Raja Hongaria, sedang diserang. Sebuah surat dari sekelompok perwira Angkatan Darat yang tidak disebutkan namanya telah bocor ke pers, menyatakan bahwa sejumlah besar tentara akan bersedia pergi ke Hongaria untuk berperang, jika pemerintah mengizinkan mereka.\n\nPemerintah telah bertemu untuk membahas sejumlah opsi."
 DOD_hungary.20.a: "Kita tidak boleh terlibat dalam konflik ini."
 DOD_hungary.20.b: "Kirim misi pengamat ke Hongaria. Jadikan itu besar."
 DOD_hungary.20.c: "Perang mereka adalah perang kita."
 DOD_hungary.21.t: "Swedia menolak bantuan."
 DOD_hungary.21.desc: "Meskipun ada banyak permohonan dari raja Swedia dan elemen militer Swedia, pemerintah Swedia menolak mengizinkan siapa pun datang membantu kami. Bahkan individu swasta yang ingin melakukan perjalanan ke Hongaria untuk berperang tidak diberikan visa perjalanan, dan pemerintah telah mendorong undang-undang yang melarang penjualan senjata kepada kami."
 DOD_hungary.21.a: "Kita sendirian."
 DOD_hungary.22.t: "Swedia mengirimkan dukungan"
 DOD_hungary.22.desc: "Meskipun pemerintah Swedia secara resmi netral, pemerintah Swedia secara mengejutkan mengizinkan sejumlah besar tentara dan perwira untuk cuti panjang dan bahkan mengizinkan mereka membawa senjata pribadi. Para prajurit telah menuju Hongaria dan sekarang siap bergabung dengan militer kami."
 DOD_hungary.22.a: "Bagus sekali."
 DOD_hungary.23.t: "Swedia melakukan intervensi"
 DOD_hungary.23.desc: "Dalam perkembangan yang mengejutkan bahkan bagi para diplomat berpengalaman, pemerintah Swedia telah mengumumkan bahwa mereka menganggap kelangsungan hidup kita sebagai kepentingan nasional utama Swedia. Rumor mengatakan bahwa Raja Swedia sendiri telah melakukan intervensi atas nama kami, mengancam akan turun tahta dan melakukan perjalanan ke Hongaria secara langsung untuk menawarkan dinas militernya kecuali pemerintah menawarkan sesuatu yang lebih dari sekedar kata-kata dukungan yang hangat."
 DOD_hungary.23.a: "Akankah mereka tiba di sini tepat waktu?"
 DOD_hungary.24.t: "Swedia sedang diserang."
 DOD_hungary.24.desc: "Swedia telah terlibat dalam konflik berdarah. Jarang muncul di depan kedua majelis parlemen, Raja menyatakan bahwa ia sangat khawatir dengan rumah lamanya, dan khususnya tentang nasib yang harus diderita ayah dan keluarganya jika Swedia dikalahkan. Mengingat hal ini, pemerintah telah memutuskan untuk bertemu dan mendiskusikan apa yang dapat dilakukan untuk membantu Swedia."
 DOD_hungary.24.a: "Kita tidak bisa terlibat dalam konflik mereka."
 DOD_hungary.24.b: "Kirimkan dukungan rahasia."
 DOD_hungary.24.c: "Kami berdiri berdampingan dengan Swedia."
 DOD_hungary.25.t: "Hongaria menolak bantuan."
 DOD_hungary.25.desc: "Meskipun ada permohonan pribadi dari Raja Hongaria, parlemen telah memilih untuk menolak dukungan apa pun kepada Swedia. Pihak oposisi mengancam akan mencopot [HUN.GetLeader] melalui mosi tidak percaya jika dia mencoba melakukan apa pun yang melanggar netralitas Hongaria."
 DOD_hungary.25.a: "Kita sendirian."
 DOD_hungary.26.t: "Hongaria mengirimkan dukungan"
 DOD_hungary.26.desc: "Hongaria telah membuka gudang senjata lama mereka dan mengirimi kami sejumlah senapan dan perlengkapan infanteri lainnya yang telah diperbarui. Beberapa ribu sukarelawan Hongaria juga telah mendatangi kami."
 DOD_hungary.26.a: "Mereka dipersilakan."
 DOD_hungary.27.t: "Hongaria melakukan intervensi"
 DOD_hungary.27.desc: "Pemerintah Hongaria telah mengeluarkan pernyataan yang menyatakan bahwa setiap serangan terhadap Swedia juga dianggap sebagai serangan terhadap Hongaria. Militer Hongaria telah disiagakan tinggi dan diperkirakan akan memasuki perang segera setelah mobilisasi selesai."
 DOD_hungary.27.a: "Apakah ini akan tepat waktu?"
 DOD_hungary.30.t: "Hongaria menawarkan Pemulihan Hubungan"
 DOD_hungary.30.desc: "Pemerintah Hongaria telah mendekati kami dengan tawaran untuk merundingkan kembali Perjanjian Trianon. Berdasarkan tawaran mereka, pembatasan jumlah tentara dalam perjanjian tersebut akan diubah untuk memungkinkan Hongaria meningkatkan kekuatan penuh pasukannya saat ini. Hongaria selanjutnya akan diizinkan untuk menghabiskan sebagian besar anggarannya untuk memperluas dan memodernisasi industri militernya.\n\nDengan pemerintahan demokratis yang memegang kendali negara secara tegas, terdapat dukungan yang besar terhadap skema ini dalam layanan diplomatik kita."
 DOD_hungary.30.a: "Permintaan yang masuk akal."
 DOD_hungary.30.b: "Dan untuk apa mereka membutuhkan pasukan yang lebih besar?"
 DOD_hungary.31.t: "Revisi Trianon"
 DOD_hungary.31.desc: "Pemerintahan [HUN.GetLeader] telah meraih kemenangan politik yang besar, karena [From.GetNameDef] baru saja meratifikasi Revisi Perjanjian Trianon. Kami sekarang diizinkan untuk menerapkan kembali wajib militer dan secara terbuka dapat mengalokasikan uang untuk pembangunan Pabrik Militer dalam anggaran."
 DOD_hungary.31.a: "Bagus sekali."
 DOD_hungary.32.t: "[From.GetNameDefCap] menolak untuk bernegosiasi"
 DOD_hungary.32.desc: "Pemerintah [From.GetNameDef] menolak mengalah dalam masalah persenjataan kembali. Pembicaraan segera terhenti, dengan delegasi [From.GetAdjective] mengulur waktu di setiap kesempatan dan mengubah isu-isu kecil seperti urutan tempat duduk menjadi perdebatan selama satu jam. Jelas bahwa mereka tidak berniat membiarkan kita mempersenjatai kembali, tapi mereka ingin kita menjadi pihak yang keluar dari perundingan tersebut."
 DOD_hungary.32.a: "Baiklah, kami akan memanjakan mereka."
 DOD_hungary.32.b: "Dekati Prancis untuk meminta bantuan."
 DOD_hungary.32.c: "Dekati Inggris untuk meminta bantuan."
 DOD_hungary.33.t: "Hongaria meminta dukungan"
 DOD_hungary.33.desc: "Hongaria baru-baru ini mulai meminta maaf kepada tetangganya mengenai revisi beberapa pembatasan yang diberlakukan setelah perang terakhir. Secara khusus, mereka ingin memperkenalkan kembali wajib militer dan memperluas industri militer mereka. Argumen Hongaria adalah bahwa dunia menjadi semakin tidak aman dari hari ke hari, dan mereka membutuhkan militer yang tepat untuk mempertahankan diri. [From.From.GetNameDefCap] berpikir sebaliknya."
 DOD_hungary.33.a: "Hongaria harus diizinkan mempersenjatai kembali secara terbatas."
 DOD_hungary.33.b: "Kita tidak bisa mengganggu keseimbangan kekuatan di kawasan."
 DOD_hungary.34.t: "[From.GetName] mendukung Hongaria"
 DOD_hungary.34.desc: "Duta Besar dari [From.GetNameDef] telah memperjelas bahwa pemerintahnya sangat menentang keputusan kami yang menolak hak persenjataan Hongaria. Beliau lebih lanjut menjelaskan bahwa jika kita bersikeras agar Hongaria tetap dilucuti, pemerintahnya akan mempertimbangkan hal tersebut ketika masalah diplomatik mengenai kita muncul di masa depan.\n\nDengan kata lain, mereka bersedia mempertaruhkan hubungan baik kita saat ini untuk hal itu."
 DOD_hungary.34.a: "Mari kita berdoa mereka tidak salah."
 DOD_hungary.34.b: "Kita harus tegas dalam masalah ini."
 DOD_hungary.35.t: "[From.GetName] menolak dukungan"
 DOD_hungary.35.desc: "Pemerintah [From.GetNameDef] telah memberi tahu kami bahwa mereka menganggap masalah revisi Perjanjian Trianon sebagai masalah internal negara terkait, dan menolak untuk terlibat dalam masalah tersebut. Tampaknya mereka lebih peduli menjaga hubungan baik dengan mantan sekutu mereka dibandingkan keadilan."
 DOD_hungary.35.a: "Sialan mereka."
 DOD_hungary.36.t: "[From.GetNameDefCap] tetap bandel."
 DOD_hungary.36.desc: "Meskipun ada tekanan politik yang besar dari [From.From.GetNameDef], [From.GetNameDef] dengan tegas menolak untuk membahas masalah ini. Tampaknya mereka masih takut kita akan menggunakan senjata kita untuk melawan mereka.\n\nDengan terhambatnya semua jalur diplomatik, kita harus menunggu dan melihat apakah kita akan mendapat kesempatan lain di masa depan untuk meninjau kembali masalah ini."
 DOD_hungary.36.a: "Apakah kita benar-benar mengancam?"
 DOD_hungary.40.t: "[HUN.GetNameDefCap] membatalkan Perjanjian Trianon"
 DOD_hungary.40.desc: "[HUN.GetLeader] hari ini secara terbuka menyatakan bahwa dia tidak lagi menganggap [HUN.GetNameDef] terikat oleh perjanjian. Lebih dari itu, ia menyatakan perjanjian tersebut batal demi hukum, dan mengklaim bahwa perjanjian tersebut dipaksakan di Hongaria dengan todongan senjata dan oleh karena itu tidak pernah mengikat secara hukum. Pemerintah Hongaria bahkan tidak memberikan informasi resmi kepada kami mengenai keputusan mereka.\n\nBanyak orang di pemerintahan menginginkan jawaban yang tegas. Jika kami menunjukkan kepada Hongaria bahwa kami tidak takut pada mereka, mereka pasti akan menyerah. Namun, mereka mungkin juga menganggap kami hanya menggertak."
 DOD_hungary.40.a: "Keluarkan ultimatum sekaligus."
 DOD_hungary.40.b: "Kita tidak mampu melakukan perang saat ini."
 DOD_hungary.41.t: "[From.GetName] mengeluarkan ultimatum."
 DOD_hungary.41.desc: "Keputusan kami baru-baru ini untuk meninggalkan Perjanjian Trianon mendapat bantahan yang sangat kuat dari [From.GetNameDef]. [From.GetLeader] dilaporkan meminta militer [From.GetAdjective] segera menyiapkan rencana intervensi. Sementara itu, duta besar [From.GetAdjective] telah meminta agar kami mengklarifikasi pernyataan kami mengenai Perjanjian tersebut, yang menunjukkan bahwa opsi militer masih ada di meja perundingan."
 DOD_hungary.41.a: "Mereka jelas-jelas menggertak."
 DOD_hungary.41.b: "Tampaknya ada kesalahpahaman."
 DOD_hungary.42.t: "[From.GetName] lipatan."
 DOD_hungary.42.desc: "Terlepas dari pernyataan kami yang tegas mengenai Perjanjian Trianon, [From.GetNameDef] belum melakukan tindakan apa pun untuk menghentikan kami. Dalam konferensi pers baru-baru ini, [From.GetLeader] melakukan semua yang dia bisa untuk tidak menjawab pertanyaan apa pun tentang keputusan kami untuk meninggalkan Perjanjian. Ini jelas menunjukkan apa yang sudah diduga semua orang: [From.GetNameDef] hanyalah macan kertas."
 DOD_hungary.42.a: "Seperti yang diharapkan."
 DOD_hungary.43.t: "[HUN.GetNameDefCap] menolak untuk mundur."
 DOD_hungary.43.desc: "Tampaknya peringatan kami kepada [HUN.GetNameDef] tidak didengarkan. Pada rapat umum di Budapest malam tadi, massa dilaporkan meneriakkan \"Matilah [From.From.GetNameDef]!\" dan [HUN.GetLeader] secara terbuka bersumpah bahwa segala upaya untuk menghentikan [HUN.GetNameDef] mendapatkan kembali tempat yang selayaknya di dunia akan menemui \"perang yang belum pernah terjadi di dunia, perang yang akan membuat pembantaian besar-besaran pada tahun 1914 hingga 1918 tampak seperti perkelahian di bar belaka\".\n\nKita berada di persimpangan jalan. Kita harus berperang untuk mempertahankan kehormatan dan kredibilitas kita, atau menerima bahwa kita telah dikalahkan."
 DOD_hungary.43.a: "Jika [HUN.GetAdjective] menginginkan perang, maka kami akan memberikannya kepada mereka."
 DOD_hungary.43.b: "Mereka menyebut gertakan kami."
 DOD_hungary.44.t: "[HUN.GetNameDefCap] mundur"
 DOD_hungary.44.desc: "Dengan adanya ancaman perang, pemerintah Hongaria tiba-tiba menjadi lebih bersahabat. Duta Besar kami diundang makan siang pribadi dengan [HUN.GetLeader], di mana dia diyakinkan bahwa [HUN.GetNameDef] hanya menginginkan perdamaian dan hubungan persahabatan dengan kami. Pernyataan apa pun di media sensasional tidak boleh dianggap berasal dari pemerintah Hongaria, yang tidak pernah menginginkan perang."
 DOD_hungary.44.a: "Itulah yang kami pikirkan."
 DOD_hungary.45.t: "Intervensi di [HUN.GetNameDef]"
 DOD_hungary.45.desc: "[From.GetNameDefCap] telah mendeklarasikan intervensi militer setelah [HUN.GetNameDef] secara terbuka meninggalkan Perjanjian Trianon. Mereka telah meminta kami untuk bergabung dengan mereka dalam menjatuhkan [HUN.GetNameDef] sebelum kekuatannya kembali pulih."
 DOD_hungary.45.a: "Kita harus menyerang sebelum terlambat."
 DOD_hungary.45.b: "Kami tidak akan terlibat dalam konflik ini."
 DOD_hungary.46.t: "[From.GetNameDefCap] menyatakan netralitas"
 DOD_hungary.46.desc: "Para pengkhianat dan pengecut di [From.GetNameDef] telah menolak untuk menjawab seruan kami untuk mengangkat senjata! Alih-alih melawan pelaku intimidasi di Budapest, mereka malah berbalik dan membiarkan kita menghadapi [HUN.GetAdjective] sendirian."
 DOD_hungary.46.a: "Kita bisa melakukannya sendiri."
 DOD_hungary.50.t: "[HUN.GetNameDefCap] menuntut Transilvania"
 DOD_hungary.50.desc: "Transylvania sudah lama menjadi bagian dari [HUN.GetNameDef], sebelum penduduknya dengan bebas memutuskan untuk bergabung dengan kami setelah Perang Besar. Sayangnya, [HUN.GetNameDef] tidak pernah bisa melupakan kehilangan wilayahnya. Dalam berbagai kesempatan, mereka secara terbuka mengklaim Transilvania sebagai bagian integral dari negara mereka. Dengan perubahan situasi politik baru-baru ini, mereka sekali lagi memutuskan untuk mengajukan klaim mereka, menuntut agar kita menyerahkan seluruh Transylvania kepada mereka...atau yang lainnya."
 DOD_hungary.50.a: "Ini tidak sebanding dengan pertumpahan darah dalam perang lainnya."
 DOD_hungary.50.b: "Atau yang lain...apa?"
 DOD_hungary.51.t: "[ROM.GetNameDefCap] mentransfer Transilvania"
 DOD_hungary.51.desc: "Daripada menghadapi kekuatan tentara kita, para [ROM.GetAdjective] yang pengecut telah memutuskan untuk mengembalikan wilayah sah kita. Keseluruhan Transilvania telah diserahkan kepada pemerintahan kami, dan pasukan kami telah mengambil kendali penuh."
 DOD_hungary.51.a: "Seperti yang seharusnya."
 DOD_hungary.52.t: "[ROM.GetNameDefCap] menolak menyerahkan Transilvania"
 DOD_hungary.52.desc: "Hal yang mungkin paling menarik adalah bahwa duta besar [ROM.GetAdjective], dalam pertemuan dengan [HUN.GetLeader] pagi ini, merasa perlu untuk menambahkan \"seperti biasa\" pada penolakannya untuk membahas kemungkinan pemindahan wilayah yang diperebutkan. Berkali-kali, pemerintah [ROM.GetAdjective] secara terbuka menolak klaim kami, bahkan mengejeknya. Selama bertahun-tahun, kami terlalu lemah untuk melawan.\n\nTidak lagi."
 DOD_hungary.52.a: "Kemarahan adalah panduan yang buruk dalam perang. Kami akan menunggu waktu kami."
 DOD_hungary.52.b: "Kali ini mereka bertindak terlalu jauh."
 DOD_hungary.53.t: "[HUN.GetNameDefCap] memobilisasi"
 DOD_hungary.53.desc: "[HUN.GetNameDefCap] telah menempatkan pasukannya dalam kondisi kesiapan yang tinggi. Pesawat pengintai Hongaria telah menembus wilayah udara kami puluhan kali dalam beberapa jam terakhir. Badan intelijen kami melaporkan pergerakan pasukan dalam jumlah besar menuju perbatasan dan sirene serangan udara melolong di Budapest. Tampaknya [HUN.GetAdjective] kali ini serius. Kita mungkin akan berperang."
 DOD_hungary.53.a: "Kami membuat isyarat kami. Tidak ada yang menginginkan perang."
 DOD_hungary.53.b: "Mereka tidak akan lulus!"
 DOD_hungary.53.c: "Mungkin ini saatnya untuk berkompromi."
 DOD_hungary.54.t: "[ROM.GetNameDefCap] memobilisasi"
 DOD_hungary.54.desc: "Menanggapi persiapan militer kita, [ROM.GetLeader] telah menandatangani Perintah Umum No. 1, yang menempatkan militer [ROM.GetAdjective] dalam siaga tertinggi. Angkatan Udara [ROM.GetAdjective] telah menduduki stasiun perangnya, dan pesawat tempur mereka telah melawan tentara kita dalam simulasi pertempuran udara. Duta Besar [ROM.GetAdjective] telah meminta paspornya. Belum ada tembakan yang dilepaskan, namun hanya masalah waktu sebelum krisis ini meledak menjadi perang.\n\nDuta Besar kami di Inggris, Perancis dan Jerman melaporkan aktivitas yang ramai di kantor luar negeri masing-masing, yang menunjukkan bahwa negara-negara ini mungkin menaruh perhatian pada krisis yang sedang terjadi. Jika kita ingin menyelesaikan masalah ini dengan kekerasan, kita harus menyerang dengan cepat."
 DOD_hungary.54.a: "Hal ini semakin tidak terkendali."
 DOD_hungary.54.b: "Maka peranglah yang terjadi."
 DOD_hungary.54.c: "Tawarkan untuk menerima mediasi yang tidak memihak."
 DOD_hungary.55.t: "Pilih Mediator"
 DOD_hungary.55.desc: "Meski ketegangan masih tinggi, masih ada peluang untuk menyelesaikan masalah ini melalui diplomasi. Pihak lain telah mendekati kita melalui jalur rahasia, dan menyatakan bahwa mereka tidak serta merta menentang komisi negara-negara yang tidak terlibat dalam menyelesaikan masalah ini. Siapa yang harus kita dekati untuk memperdebatkan kasus kita?"
 DOD_hungary.55.a: "Dekati Jerman"
 DOD_hungary.55.b: "Dekati Inggris"
 DOD_hungary.55.d: "Dekati Prancis"
 DOD_hungary.55.c: "Dekati Uni Soviet"
 DOD_hungary.55.e: "Dekati Italia"
 DOD_hungary.55.f: "Tidak ada seorang pun yang mau mendengar kasus kami..."
 DOD_hungary.57.t: "[HUN.GetNameDefCap] mundur"
 DOD_hungary.57.desc: "Meskipun retorika keras masih keluar dari Budapest, pasukan Hongaria di dekat perbatasan telah mundur. Pelanggaran terhadap wilayah udara kita telah berhenti. Tampaknya [HUN.GetLeader] ingin merahasiakan hal ini, dan ada konsensus di kantor luar negeri bahwa ia harus diizinkan melakukan hal tersebut. Tindakan rekonsiliasi adalah sebuah harga kecil yang harus dibayar ketika kita nyaris menghindari perang."
 DOD_hungary.57.a: "Sebuah kemenangan."
 DOD_hungary.58.t: "[HUN.GetNameDefCap] mencari Mediasi"
 DOD_hungary.58.desc: "Dengan situasi di Balkan yang dengan cepat berubah menuju peperangan habis-habisan, Hongaria memutuskan untuk meminta mediasi perselisihan Transylvania. Mereka telah mendekati kami untuk meminta agar kami duduk di komisi yang memutuskan nasib Transilvania. Mereka jelas yakin bahwa kami akan memperdebatkan kasus mereka pada konferensi mendatang."
 DOD_hungary.58.a: "Kami dengan senang hati akan melakukannya."
 DOD_hungary.58.b: "Mewakili mereka bukanlah kepentingan kami."
 DOD_hungary.59.t: "[ROM.GetNameDefCap] mencari Mediasi"
 DOD_hungary.59.desc: "Menghadapi tekanan yang semakin besar dari Hongaria, Rumania telah meminta komisi yang tidak memihak untuk menyelesaikan perselisihan mengenai Transilvania. Mereka telah mendekati kami untuk menyuarakan kesediaan kami untuk duduk di komisi itu. Tentu saja mereka percaya bahwa kami akan mempertahankan klaim mereka atas wilayah tersebut."
 DOD_hungary.59.a: "Kami pasti akan melakukannya."
 DOD_hungary.59.b: "Kami tidak tertarik membela mereka."
 DOD_hungary.60.t: "Krisis Balkan"
 DOD_hungary.60.desc: "Selama beberapa hari terakhir, ketegangan hubungan antara Hongaria dan Rumania telah putus total. Hongaria menuntut Rumania menyerahkan wilayah Transilvania yang diperebutkan kepada mereka. Rumania menolak. Kedua belah pihak kini telah memobilisasi kekuatan mereka, dan perang di kawasan tampaknya tidak dapat dihindari.\n\nKementerian Luar Negeri percaya bahwa sangatlah penting bagi kita untuk mempersiapkan intervensi untuk mempertahankan kepentingan kita di kawasan. Ada juga kemungkinan bahwa ancaman keterlibatan kita saja akan membawa pihak lain ke meja perundingan."
 DOD_hungary.60.a: "Kita harus mendukung Hongaria."
 DOD_hungary.60.b: "Kita harus mendukung Rumania."
 DOD_hungary.60.c: "Itu hanyalah hal bodoh lainnya di Balkan."
 DOD_hungary.61.t: "Krisis Balkan - [From.GetNameDef] mendukung Hongaria"
 DOD_hungary.61.desc: "Duta Besar [From.GetAdjective] telah tiba di Kementerian Luar Negeri kami pagi ini, memberi tahu kami bahwa pemerintahnya menyaksikan krisis saat ini dengan sangat prihatin. Keputusan kami untuk mengambil risiko perang di Transilvania telah memaksa pemerintah [From.GetNameAdj] untuk mempertimbangkan intervensi militer di pihak Hongaria."
 DOD_hungary.61.a: "Kita tidak bisa berharap untuk melawan mereka."
 DOD_hungary.61.b: "Kita tidak bisa mundur sekarang."
 DOD_hungary.61.c: "Mintalah mediasi."
 DOD_hungary.62.t: "Krisis Balkan - [From.GetNameDef] mendukung Rumania"
 DOD_hungary.62.desc: "Duta Besar kami untuk [From.GetNameDef] telah dipanggil untuk berkonsultasi. Dalam pertemuan tersebut, dia diberitahu bahwa [From.GetNameDef] menganggap integritas wilayah Rumania sebagai kepentingan nasionalnya. Khususnya sumur minyak Ploesti yang sangat penting bagi [From.GetNameDef]. Jika Transilvania jatuh ke tangan kita, atau jika kita mencoba menduduki Rumania secara keseluruhan, pasokan minyak akan sangat terancam. Pemerintah [From.GetAdjective] jelas tidak mau menerima risiko ini, dan bahkan mengancam akan melakukan intervensi militer di pihak Rumania jika perang pecah."
 DOD_hungary.62.a: "Kita harus menyerah."
 DOD_hungary.62.b: "Perang ini akan berakhir bahkan sebelum mereka tiba di sini."
 DOD_hungary.62.c: "Mintalah mediasi."
 DOD_hungary.63.t: "Mediasi gagal"
 DOD_hungary.63.desc_HUN_refused: "Meskipun kami telah berupaya sebaik mungkin, kami tidak dapat memperoleh dukungan apa pun atas klaim kami. Setiap negara yang kami datangi menolak kami, dan mengatakan bahwa kami harus menerima kenyataan bahwa Transylvania adalah bagian dari Rumania.\n\nBagaimana seseorang menerima hal yang tidak dapat diterima?"
 DOD_hungary.63.desc_HUN_nothing: "Hasil dari konferensi di Transilvania benar-benar merupakan bencana besar. Untuk alasan yang tidak diketahui, telah diputuskan bahwa keseluruhan Transilvania akan tetap menjadi milik Rumania. Meskipun perjanjian terakhir memuat beberapa ketentuan yang seharusnya melindungi hak-hak etnis Hongaria, tidak ada keraguan bahwa kita telah mengalami kekalahan diplomatik total."
 DOD_hungary.63.a: "Kami telah dikhianati oleh semua orang!"
 DOD_hungary.63.b: "Kami akan merebut kembali tanah kami, atau mati dalam usahanya!"
 DOD_hungary.64.t: "Mediasi gagal"
 DOD_hungary.64.desc_ROM_refused: "Kami telah berusaha keras untuk mendapatkan dukungan bagi tujuan kami, namun tampaknya hanya sedikit negara saat ini yang peduli untuk mempertahankan tatanan yang diciptakan oleh Versailles dan Trianon. Dengan adanya penindas seperti [HUN.GetLeader], satu-satunya hal yang penting adalah kekuatan."
 DOD_hungary.64.desc_ROM_nothing: "Tampaknya perjanjian dan adat istiadat tidak lagi berarti apa-apa. Konferensi Transilvania telah memutuskan bahwa keseluruhan wilayah yang disengketakan harus jatuh ke tangan Hongaria. Seluruh pegawai negeri masih belum pulih dari keterkejutannya, namun keputusan harus diambil - apakah kita menerima kekejian ini, atau kita melawannya?"
 DOD_hungary.64.a: "Hari yang kelam."
 DOD_hungary.64.b: "Kami masih bisa bertarung."
 DOD_hungary.65.t: "Hongaria menolak menerima hasil mediasi"
 DOD_hungary.65.desc: "Ketika diberitahu tentang hasil arbitrase di wilayah sengketa, [HUN.GetLeader] menolak menerimanya. Menurutnya, apa pun yang kurang dari pemulihan penuh perbatasan lama Hongaria akan dianggap sebagai penghinaan bagi setiap warga Hongaria yang hidup atau mati.\n\nDia bahkan melangkah lebih jauh dengan mengatakan bahwa waktu untuk negosiasi dan diplomasi telah berlalu, dan hanya ada satu cara agar masalah ini dapat diselesaikan.\n\nPemerintah Rumania menanyakan posisi kami dalam perselisihan ini, mengingat kami telah sepakat untuk mendukung mereka sebelumnya."
 DOD_hungary.65.a: "Tawaran ini tidak terlalu luas."
 DOD_hungary.65.b: "Bangsa Hongaria harus dihentikan, sebelum mereka menaklukkan seluruh wilayah."
 DOD_hungary.66.t: "Rumania menolak menerima hasil mediasi"
 DOD_hungary.66.desc: "Ketentuan perjanjian yang dinegosiasikan dalam konferensi baru-baru ini belum diterima oleh pemerintah Rumania. [ROM.GetLeader] dilaporkan bahkan tidak membaca seluruh dokumen sebelum merobeknya dan menyatakan bahwa dia lebih memilih memotong tangannya sendiri daripada menandatangani sesuatu yang memalukan ini.\n\nPemerintah Hongaria telah mengumumkan bahwa mereka sangat bersedia untuk memperjuangkan apa yang telah dinyatakan sebagai hak mereka, namun mereka juga mempertanyakan posisi kami dalam konflik ini."
 DOD_hungary.66.a: "Kami berharap mereka menang."
 DOD_hungary.66.b: "Kami bersedia mendukung mereka."
 DOD_hungary.67.t: "Negosiasi gagal"
 DOD_hungary.67.desc: "Negosiasi antara negara-negara besar telah gagal total, karena kedua negara tidak dapat menemukan titik temu. Setiap upaya untuk mencapai solusi kompromi telah digagalkan oleh tuntutan-tuntutan yang tidak dapat diterima oleh kedua belah pihak. Delegasi-delegasi tersebut telah melakukan perjalanan kembali ke negara asal mereka, meninggalkan masalah tersebut belum terselesaikan."
 DOD_hungary.67.a: "Ini akan diselesaikan dengan api, darah dan baja."
 DOD_hungary.68.t: "Penghargaan Transylvania"
 DOD_hungary.68.desc: "Kedua belah pihak telah mendekati kami untuk memutuskan siapa yang mendapatkan Transylvania. Kementerian Luar Negeri telah menyiapkan laporan singkat berikut:\n\n\"Tidak disarankan, dalam situasi saat ini, untuk menyerahkan keseluruhan Transilvania kepada satu pihak. Solusi kompromi, yang tidak populer namun dapat diterima oleh kedua belah pihak, sebaiknya diutamakan agar tidak menghina salah satu pihak hingga menolak penyelesaiannya.\""
 DOD_hungary.68.a: "Berikan seluruh Transylvania ke Hongaria."
 DOD_hungary.68.b: "Berikan Transylvania Utara ke Hongaria."
 DOD_hungary.68.c: "Transylvania tetap bersama Rumania."
 DOD_hungary.69.t: "Kompromi Transylvania"
 DOD_hungary.69.desc: "Setelah menghabiskan waktu berjam-jam untuk bernegosiasi, tampaknya resolusi sudah hampir tercapai. Kabar buruknya adalah kita harus menyerahkan sebagian wilayah ke Hongaria. Bagian utara Transylvania akan menjadi milik mereka, sementara kami mempertahankan bagian selatan. Ini bukanlah hal yang kami harapkan, namun penilaian realistis terhadap situasi ini menunjukkan bahwa hal ini merupakan hasil terbaik."
 DOD_hungary.69.a: "Hasil yang dapat diterima. Hampir tidak."
 DOD_hungary.69.b: "Kami tidak akan menyerah satu inci pun!"
 DOD_hungary.70.t: "Kompromi Transylvania"
 DOD_hungary.70.desc: "Pada dini hari, delegasi konferensi telah berhasil mencapai kompromi. Berdasarkan ketentuan ini, kita akan mendapatkan Transilvania Utara, sedangkan bagian selatan wilayah tersebut akan tetap menjadi milik Rumania. Delegasi Rumania sudah menyetujuinya. Kementerian Luar Negeri memperingatkan bahwa tidak menerima proposal tersebut akan mengisolasi kita secara diplomatis."
 DOD_hungary.70.a: "Itu yang terbaik yang bisa kami minta."
 DOD_hungary.71.t: "Konferensi Transylvania - Hari ke-1"
 DOD_hungary.71.desc: "Protokol diplomatik ditiadakan, delegasi dari Hongaria, Rumania dan [ROM_mediator.GetNameDef] telah berkumpul untuk membahas masalah tersebut. Telah disepakati bahwa, sebagai perwakilan pihak Hongaria, kami diizinkan untuk mengajukan penawaran pertama."
 DOD_hungary.71.a: "Berikan seluruh Transylvania ke Hongaria."
 DOD_hungary.71.b: "Berikan Transylvania Utara ke Hongaria."
 DOD_hungary.71.c: "Transylvania tetap bersama Rumania."
 DOD_hungary.72.t: "Konferensi Transylvania - Hari ke-2"
 DOD_hungary.72.desc_HUN_all: "Pihak Hongaria telah memberi kami tawaran untuk menyelesaikan krisis yang mengancam ini. Tidak mengherankan, mereka menuntut agar seluruh Transilvania diserahkan ke Hongaria sesegera mungkin. Kami bisa menerima tawaran ini, tapi tidak diragukan lagi hal ini akan membuat marah sekutu kami, Rumania.\n\nKami juga dapat melakukan penawaran balasan. Kepala Diplomat kami sangat menyarankan yang terakhir. Solusi kompromi mungkin akan lebih disetujui oleh kedua belah pihak."
 DOD_hungary.72.desc_compromise: "Pihak Hongaria telah memberi kami tawaran untuk menyelesaikan krisis yang mengancam ini. Dalam tawaran mereka, bagian utara Transilvania akan diberikan kepada Hongaria, bagian selatan akan tetap menjadi milik Rumania.\n\nKepala Diplomat kami percaya bahwa hal ini menunjukkan bahwa pihak Hongaria bersikap dingin, dan bahwa kami harus berusaha mencapai kondisi yang lebih baik."
 DOD_hungary.72.desc_HUN_nothing: "Pihak Hongaria secara mengejutkan menawarkan persyaratan perdamaian. Seluruh wilayah Transilvania akan tetap menjadi milik Rumania, dengan imbalan sejumlah konsesi kecil bagi etnis minoritas. Perwakilan Rumania sangat mendesak kami untuk menerima tawaran ini, dan menjanjikan bahwa konsesi akan dilaksanakan dalam beberapa hari jika disepakati."
 DOD_hungary.72.a: "Terima lamarannya."
 DOD_hungary.72.b: "Dorong untuk persyaratan yang lebih baik."
 DOD_hungary.73.t: "Konferensi Transylvania - Hari ke-3"
 DOD_hungary.73.desc: "Setelah memutuskan untuk menolak tawaran Hongaria, kini terserah kepada kami untuk menawarkan persyaratan yang berbeda."
 DOD_hungary.73.a: "Berikan seluruh Transylvania ke Hongaria."
 DOD_hungary.73.b: "Berikan Transylvania Utara ke Hongaria."
 DOD_hungary.73.c: "Transylvania tetap bersama Rumania."
 DOD_hungary.74.t: "Konferensi Transylvania - Hari ke-4"
 DOD_hungary.74.desc_HUN_all: "Pihak Rumania tampaknya sangat cemas melihat masalah ini selesai, karena mereka telah menolak tawaran perdamaian kami sebelumnya dan malah menawarkan untuk menyerahkan seluruh Transilvania ke Hongaria. Dalam diskusi pribadi, delegasi kami tidak dapat memberikan alasan mengapa mereka mengajukan tawaran tersebut, namun tampaknya tawaran tersebut tulus. Kita harus mengambilnya."
 DOD_hungary.74.desc_compromise: "Rumania telah menawarkan solusi kompromi dengan membagi Transilvania menjadi dua. Mengingat ketegangan antara kedua negara, ini mungkin merupakan solusi terbaik."
 DOD_hungary.74.desc_HUN_nothing: "Tidak mengherankan jika pihak Rumania tidak bergeming terhadap masalah Transylvania. Mereka tampaknya berkomitmen penuh untuk mempertahankan seluruh Transylvania di Rumania. Pada tahap negosiasi ini, sangat sedikit yang bisa kami lakukan – kami menerima tawaran mereka atau keluar."
 DOD_hungary.74.a: "Kami menerima."
 DOD_hungary.74.b: "Konsekuensi dari kegagalan ini ada di tangan mereka!"
 DOD_hungary.75.a: "Kami mencoba semua yang kami bisa."
 DOD_hungary.80.t: "Hongaria Menuntut Slovakia Selatan"
 DOD_hungary.80.desc: "Pemerintah Hongaria telah mendekati kami dan meminta agar kami menyerahkan wilayah selatan Slowakia kepada mereka, dengan alasan bahwa warga Hongaria di wilayah tersebut dianiaya. Pada saat yang sama, anggota kelompok teroris yang disebut \"Pengawal Ragged\" telah ditangkap saat mencoba melintasi perbatasan dari Hongaria. Meskipun orang-orang ini mengklaim bahwa mereka tidak ada hubungannya dengan pemerintah Hongaria, mereka ditemukan dengan peralatan yang membawa tanda resmi Hongaria.\n\nPerang sedang terjadi, namun kita mungkin dapat mencapai solusi diplomatik jika kita dapat memperoleh dukungan dari negara besar."
 DOD_hungary.80.a: "Kita tidak bisa berharap untuk memenangkan perang. Serahkan wilayah itu."
 DOD_hungary.80.b: "Himbauan kepada Sekutu kita."
 DOD_hungary.80.c: "Banding ke Jerman."
 DOD_hungary.80.d: "Kami tidak akan diganggu!"
 DOD_hungary.81.t: "[From.GetNameDefCap] Mengembalikan Slovakia Selatan"
 DOD_hungary.81.desc: "[From.GetName] telah menyerahkan Slovakia selatan dan menarik pasukannya melewati garis demarkasi. Kami sekarang memegang kendali penuh atas wilayah tersebut."
 DOD_hungary.81.a: "Bagus."
 DOD_hungary.82.t: "[CZE.GetName] meminta bantuan."
 DOD_hungary.82.desc: "Duta Besar dari [CZE.GetName] telah datang kepada kami dengan permintaan bantuan yang mendesak. Baru-baru ini, [HUN.GetNameDef] telah meluncurkan kampanye destabilisasi besar-besaran yang ditujukan ke Slovakia selatan. Tujuan mereka jelas - mereka ingin menciptakan dalih untuk melakukan invasi guna melindungi orang-orang yang mereka anggap sebagai warga negara.\n\nPemerintah [CZE.GetAdjective] telah meminta dukungan kami dalam hal ini."
 DOD_hungary.82.a: "Mereka akan memilikinya."
 DOD_hungary.82.b: "Ini bukan pertarungan kita."
 DOD_hungary.83.t: "[SLO.GetName] meminta bantuan."
 DOD_hungary.83.desc: "[SLO.GetName] baru-baru ini mendapat tekanan besar dari [HUN.GetNameDef] untuk mengembalikan wilayah di perbatasan selatannya, yang dulu merupakan milik Hongaria. Pemerintah [HUN.GetAdjective] telah mengindikasikan bahwa mereka cukup bersedia untuk memperjuangkannya, jika hal tersebut memang terjadi.\n\nKami tidak mampu menanggung pecahnya perang di wilayah tersebut hanya karena masalah kecil, dan kami harus mendorong solusi diplomatik."
 DOD_hungary.83.a: "Beritahu Hongaria untuk terus maju."
 DOD_hungary.83.b: "Beritahu Hongaria untuk mundur."
 DOD_hungary.84.t: "[From.GetName] menolak."
 DOD_hungary.84.desc: "[From.GetName] bahkan menolak untuk membahas tuntutan kami, bersikeras bahwa wilayah tersebut selalu menjadi bagian dari [From.GetName] dan akan dipertahankan \"Sampai orang terakhir, hingga peluru terakhir, hingga nafas terakhir.\""
 DOD_hungary.84.a: "Kami akan mempunyai peluang, tapi bukan sekarang."
 DOD_hungary.84.b: "Lalu kita akan memanjakan mereka."
 DOD_hungary.85.t: "[From.GetNameDefCap] mengeluarkan peringatan mengenai Slovakia selatan"
 DOD_hungary.85.desc: "Pemerintah [From.GetNameDef] telah memberi tahu kami bahwa integritas wilayah Slovakia tidak dapat didiskusikan. Kami selanjutnya diinstruksikan untuk menarik pasukan reguler atau tidak teratur yang mungkin kami miliki di wilayah tersebut, atau menghadapi konsekuensinya."
 DOD_hungary.85.a: "Begitu banyak gagasan tentang penentuan nasib sendiri nasional."
 DOD_hungary.85.b: "Kami akan mengambil apa yang menjadi milik kami."
 DOD_hungary.86.t: "[From.GetNameDefCap] menolak mendukung kami"
 DOD_hungary.86.desc: "Pemerintah [From.GetAdjective] telah menolak permintaan kami untuk mendukung kami dalam menghadapi agresi [HUN.GetAdjective] yang terang-terangan. Meskipun mereka bersimpati pada tujuan kita, mereka tidak bersedia mengambil risiko darah atau harta demi membelanya."
 DOD_hungary.86.a: "Kita tidak bisa memenangkan perang hanya dengan kata-kata hangat."
 DOD_hungary.86.b: "Kalau begitu, kita akan bertarung sendirian."
 DOD_hungary.90.t: "[HUN.GetNameDefCap] tuntutan [45.GetName]"
 DOD_hungary.90.desc: "Pemerintah [HUN.GetAdjective] mulai memberikan tekanan lebih besar terhadap masalah Vojvodina, dengan menyatakan bahwa Vojvodina pernah menjadi bagian Hongaria pada masa Kekaisaran dan oleh karena itu harus dikembalikan. Mereka mengklaim bahwa penyatuan dengan Serbia pada akhir Perang Besar adalah \"tidak sah karena tekanan dari luar\", dan oleh karena itu wilayah tersebut masih secara hukum [HUN.GetAdjective]."
 DOD_hungary.90.a: "Ini bukanlah konflik yang bisa kita menangkan."
 DOD_hungary.90.b: "Kami tidak akan mendukung khayalan mereka."
 DOD_hungary.91.t: "[FROM.GetNameDefCap] mentransfer Vojvodina"
 DOD_hungary.91.desc: "[FROM.GetNameDef] telah setuju untuk menyerahkan Vojvodina kepada kami. Pasukan kami telah mengambil kendali penuh."
 DOD_hungary.91.a: "Bagus."
 DOD_hungary.92.t: "[From.GetNameDefCap] menolak tuntutan kami."
 DOD_hungary.92.desc: "Dalam pertemuan yang menegangkan dengan [FROM.GetLeader], delegasi kami diberitahu bahwa kedaulatan Vojvodina tidak dapat didiskusikan, dan bahwa dalam hal apa pun pemerintah [FROM.GetAdjective] tidak akan pernah tunduk pada tekanan tersebut. Penduduk Vojvodina menyampaikan pendapat mereka pada tahun 1919, dan mereka memilih untuk tetap bersama [FROM.GetNameDef]. Bagi pemerintah [FROM.GetAdjective], itu sudah selesai."
 DOD_hungary.92.a: "Mungkin memang begitu."
 DOD_hungary.92.b: "Mintalah dukungan Jerman."
 DOD_hungary.92.c: "Mintalah dukungan dari Italia."
 DOD_hungary.92.d: "Banding ke Jerman dan Italia."
 DOD_hungary.92.e: "Kami akan menyelesaikan ini sendirian."
 DOD_hungary.93.t: "Hongaria menyarankan penataan ulang Yugoslavia"
 DOD_hungary.93.desc: "Dalam pertemuan di Zurich, perwakilan pemerintah [HUN.GetAdjective] telah menyampaikan kepada kami tentang tindakan bersama melawan [YUG.GetNameDef]. Pemerintah [YUG.GetAdjective] sejauh ini menolak permintaan [HUN.GetAdjective] untuk mengembalikan wilayah yang dianeksasi oleh [YUG.GetNameDef] pada akhir Perang Besar. Melihat bagaimana kami juga memperebutkan wilayah dengan [YUG.GetNameDef], kami dapat menggabungkan kekuatan dan mengeluarkan ultimatum yang kuat, namun hal ini mungkin akan memaksa kami untuk berperang memperebutkannya."
 DOD_hungary.93.a: "Mereka akan mendapat dukungan penuh dari kami."
 DOD_hungary.93.b: "Kami tidak akan terlibat dalam masalah ini."
 DOD_hungary.94.t: "[From.GetNameDefCap] menawarkan dukungan melawan Yugoslavia"
 DOD_hungary.94.desc: "Negosiasi melalui jalur belakang dengan [From.GetNameDef] telah menghasilkan kesepakatan, pada prinsipnya, bahwa Yugoslavia harus dibubarkan seluruhnya atau setidaknya dikurangi ukurannya.\n\nDengan pendukung baru kami, kami sekarang dapat bernegosiasi dengan pemerintah [YUG.GetAdjective] dari posisi yang sangat kuat. Kita juga dapat memilih untuk menyelesaikan masalah ini dengan kekerasan, sementara militer Yugoslavia masih belum siap."
 DOD_hungary.94.a: "Kirim ultimatum ke Beograd!"
 DOD_hungary.94.b: "Serang sekarang!"
 DOD_hungary.95.t: "[From.GetNameDefCap] menolak tawaran kami"
 DOD_hungary.95.desc: "Setelah beberapa putaran negosiasi, tidak ada kesepakatan yang dicapai dengan pemerintah [From.GetAdjective] mengenai masalah reorganisasi Yugoslavia. Sebuah catatan yang ditandatangani oleh [From.GetLeader] sendiri menyatakan bahwa setiap masalah teritorial yang belum terselesaikan akan diselesaikan secara bilateral, \"bila situasi memerlukannya.\""
 DOD_hungary.95.a: "Malu."
 DOD_hungary.95.b: "Kalau begitu kita akan melakukannya sendiri!"
 DOD_hungary.96.t: "Ultimatum dari Budapest"
 DOD_hungary.96.desc_HUN_GER: "Alih-alih meredakan situasi, tanggapan kami yang kuat terhadap tuntutan Hongaria terbaru mengenai Vojvodina rupanya telah menghasilkan perjanjian antara Hongaria dan Jerman. Dalam pidatonya baru-baru ini, [GER.GetLeader] menyebut Slovenia sebagai \"salah satu provinsi lama Reich yang belum ditebus\" yang harus direklamasi sesegera mungkin. Duta Besar Hongaria dan Jerman telah menyerahkan sebuah catatan yang menyatakan bahwa Vojvodina dan Slovenia akan segera dialihkan ke kendali mereka."
 DOD_hungary.96.desc_HUN_ITA: "Alih-alih meredakan situasi, tanggapan kami yang kuat terhadap tuntutan Hongaria terbaru mengenai Vojvodina rupanya mengarah pada perjanjian antara Hongaria dan Italia. Dalam pidatonya baru-baru ini, [ITA.GetLeader] menyebut Dalmatia sebagai \"pantai jauh Laut Adriatik yang belum ditebus\". Duta Besar Hongaria dan Italia telah menyerahkan catatan yang menyatakan bahwa Vojvodina dan Dalmatia akan segera dialihkan ke kendali mereka."
 DOD_hungary.96.desc_HUN_both: "Penolakan kami untuk tunduk pada tuntutan Hongaria tidak membawa perubahan sikap di Budapest. Retorika kemarahan yang keluar dari ibu kota Hongaria kini diimbangi dengan pernyataan yang sama meresahkannya dari Roma dan Berlin. Kedua negara telah menyatakan dukungan terhadap posisi Hongaria, sekaligus mengumumkan tuntutan mereka sendiri. Para duta besar dari ketiga negara telah hadir bersama di Kementerian Luar Negeri untuk secara resmi menyerahkan sebuah catatan yang menuntut agar Vojvodina, Slovenia dan Dalmatia dipindahkan ke masing-masing penggugat."
 DOD_hungary.96.a: "Kami tidak punya pilihan selain menerima."
 DOD_hungary.96.b: "Kami lebih baik mati dalam pertempuran!"
 DOD_hungary.97.t: "Yugoslavia menentang"
 DOD_hungary.97.desc: "Meskipun mereka menghadapi banyak rintangan, pemerintah [YUG.GetAdjective] menolak memberikan alasan, dan mengatakan kepada perwakilan kita bahwa jika kita mencari solusi militer, maka militer [YUG.GetAdjective] akan siap dan siap."
 DOD_hungary.97.a: "Maka peranglah yang terjadi."
 DOD_hungary.100.t: "Hongaria menuntut Slovakia"
 DOD_hungary.100.desc: "Pemerintah Hongaria telah menghubungi kami mengenai status Slovakia di masa depan. Mereka sangat percaya bahwa mereka harus memiliki kendali penuh atas nasib Slovakia, mengingat Slovakia pernah menjadi bagian dari Hongaria pada masa Kekaisaran.\n\nSementara delegasi Hongaria enggan mengeluarkan ancaman eksplisit apa pun, dinas intelijen kami melaporkan sejumlah aktivitas yang meresahkan di dalam militer Hongaria."
 DOD_hungary.100.a: "Kami tidak punya pilihan."
 DOD_hungary.100.b: "Kami tidak akan menyerah satu inci pun."
 DOD_hungary.101.t: "Slowakia dipindahkan"
 DOD_hungary.101.desc: "Slovakia telah kembali ke kendali kami. Pertanyaannya sekarang adalah bagaimana kita harus mengaturnya. Meskipun banyak orang di pemerintahan mendukung aneksasi langsung, dan menyebutnya sebagai \"Kembali ke perbatasan sejarah\", beberapa orang lainnya khawatir tentang dampak dari upaya mengintegrasikan begitu banyak warga non-Hongaria ke negara kita. Pilihan yang mereka pilih adalah membentuk pemerintahan yang terdevolusi di Bratislava, dengan beberapa kewenangan atas kebijakan internal mereka, namun memiliki hubungan erat dengan kita dalam semua hal lainnya."
 DOD_hungary.101.a: "Kami akan kembali ke perbatasan lama kami."
 DOD_hungary.101.b: "Pemerintahan boneka lebih baik."
 DOD_hungary.102.t: "[From.GetNameDefCap] menolak untuk mentransfer Slovakia"
 DOD_hungary.102.desc: "Negosiasi mengenai transfer Slovakia terhenti seketika. Delegasi [From.GetAdjective] telah menyatakan posisi mereka sebagai status quo, dan tidak ada usulan perubahan besar. Delegasi kami, tentu saja, menyatakan kembali bahwa kami menganggap Slovakia sebagai wilayah kami, yang direbut secara ilegal pada akhir Perang Besar.\n\nTidak ada kemajuan yang dicapai, dan meningkatnya rasa frustrasi di kedua belah pihak membuat kecil kemungkinan bahwa kemajuan akan tercapai."
 DOD_hungary.102.a: "Biarkan masalahnya berlalu."
 DOD_hungary.102.b: "Dekati Jerman untuk memecah negaranya."
 DOD_hungary.103.t: "Hongaria ingin membagi [CZE.GetNameDef]"
 DOD_hungary.103.desc: "Pemerintah Hongaria telah mendekati kami dengan tawaran untuk membagi [CZE.GetNameDef]. Kita akan mendapatkan bagian barat negara tersebut, sementara Hongaria akan mendapatkan sebagian besar Slovakia, dengan garis demarkasi antara negara-negara kita kira-kira membagi dua negara tersebut.\n\nMereka telah meyakinkan kami bahwa selama mereka mendapatkan bagiannya pada akhirnya, mereka bersedia membiarkan kami mengambil langkah pertama."
 DOD_hungary.103.a: "Kami akan mempertimbangkan kepentingan mereka."
 DOD_hungary.103.b: "Mereka tidak mendapatkan apa pun."
 germany.55.do: "Hormatilah janji kepada Hongaria."
 DOD_hungary.104.t: "[GER.GetLeader] setuju"
 DOD_hungary.104.desc: "Dalam telegram rahasia, pemerintah Jerman telah meyakinkan kami bahwa kepentingan kami akan dipertimbangkan ketika nasib [CZE.GetNameDef] diputuskan. Kapan hal itu akan terjadi masih belum diketahui."
 DOD_hungary.104.a: "Bagus."
 DOD_hungary.105.t: "Jerman menolak untuk membagi [CZE.GetName]"
 DOD_hungary.105.desc: "Saat mendengar usulan kami untuk memisahkan [CZE.GetNameDef], [From.GetLeader] dikabarkan menjadi marah dan menyebut kami \"orang-orang yang tidak mempunyai petunjuk sedikit pun tentang realitas dunia\".\n\nTak perlu dikatakan lagi, usulan kami belum diterima."
 DOD_hungary.105.a: "Kasar sekali."
 DOD_hungary.105.b: "Kami akan mengambil apa yang menjadi milik kami."
 DOD_hungary.106.t: "[From.GetLeader] mengkhianati janji"
 DOD_hungary.106.desc: "Meskipun ada janji tertulis dari [From.GetLeader], pemerintah Jerman belum menepati komitmen mereka kepada kami. Dalam negosiasi baru-baru ini mengenai nasib [CZE.GetNameDef], kami tidak memainkan peran apa pun kecuali sebagai alat untuk menekan pihak lain agar patuh. Tampaknya [From.GetLeader] tidak pernah bermaksud menepati janjinya."
 DOD_hungary.106.a: "Protes dengan cara yang sekuat mungkin."
 DOD_hungary.106.b: "Memobilisasi Angkatan Darat."
 DOD_hungary.107.t: "Hongaria menuntut Ketuhanan"
 DOD_hungary.107.desc_SLO_independent: "Setelah beberapa minggu aktivitas yang heboh di militer Hongaria, [HUN.GetLeader] telah mengeluarkan proklamasi, menyatakan bahwa situasi saat ini di Slovakia merupakan keprihatinan serius bagi Hongaria, dan menuntut jaminan tertentu dari kami.\n\nDi antara hal-hal lain, kami harus berkonsultasi dengan mereka sebelum kami memasuki aliansi apa pun atau menandatangani perjanjian apa pun dan perlu menerima misi militer untuk mengoordinasikan militer kami."
 DOD_hungary.107.desc_SLO_puppet: "Delegasi Hongaria telah tiba untuk membahas masalah Slovakia. Mereka menganggap negara ini berada dalam lingkup pengaruh historis mereka, dan sangat prihatin dengan pengaruh yang kita miliki terhadap kebijakan Slovakia.\n\nPemimpin delegasi bahkan menyarankan agar wilayah Slovakia dapat digunakan sebagai batu loncatan untuk melancarkan invasi ke Hongaria.\n\nMereka menyarankan agar pemerintah Hongaria diizinkan untuk menggunakan jumlah pengaruh yang sama di Slovakia seperti yang kita nikmati saat ini."
 DOD_hungary.107.a: "Baiklah."
 DOD_hungary.107.b: "Di luar pertanyaan."
 DOD_hungary.108.t: "Slovakia berada di bawah kendali kami"
 DOD_hungary.108.desc: "Yang Berkuasa Penuh kami telah bertempat tinggal di Bratislava, memastikan bahwa pemerintah Slovakia akan menyelaraskan kebijakan mereka dengan kebijakan kami."
 DOD_hungary.108.a: "Bagus."
 DOD_hungary.109.t: "Kontrol atas Slovakia ditolak"
 DOD_hungary.109.desc: "Terlepas dari upaya terbaik kami, pemerintah Slovakia menolak menerima peran mereka yang lebih rendah dibandingkan dengan kami. Kita sekarang harus mempertimbangkan kemungkinan tindakan militer untuk mengamankan perbatasan utara kita."
 DOD_hungary.109.a: "Kami akan mendapatkannya, dengan satu atau lain cara."
 DOD_hungary.110.t: "Hongaria ingin memberikan tekanan pada Rumania"
 DOD_hungary.110.desc: "[HUN.GetLeader] telah tiba di Moskow untuk membahas masalah Rumania. Pada akhir Perang Besar, Rumania secara ilegal merebut sejumlah wilayah, termasuk Bessarabia dan Transylvania. Kawan-kawan kami di Hongaria menyarankan agar kami menekan Rumania agar mengembalikan wilayah-wilayah tersebut kepada pemiliknya yang sah."
 DOD_hungary.110.a: "Saran yang bagus sekali, kawan!"
 DOD_hungary.110.b: "Tidak sekarang."
 DOD_hungary.111.t: "Ultimatum Komunis"
 DOD_hungary.111.desc: "Pemerintah [HUN.GetNameDef] dan [SOV.GetNameDef] telah menyampaikan pemberitahuan bersama, menyatakan bahwa mereka menganggap aneksasi kami atas Transylvania dan Bessarabia tidak sah. Sejauh yang mereka ketahui, wilayah-wilayah ini berada di bawah pendudukan ilegal, dan mereka memberi kita satu kesempatan terakhir untuk menarik diri dari wilayah tersebut."
 DOD_hungary.111.a: "Kami tidak punya pilihan."
 DOD_hungary.111.b: "Mungkin kita bisa berkompromi."
 DOD_hungary.111.c: "Pemerintahan komunis mungkin bisa mendapatkan hasil yang lebih baik."
 DOD_hungary.111.d: "Tanah ini suci!"
 DOD_hungary.112.t: "[SOV.GetLeader] menolak tawaran kami."
 DOD_hungary.112.desc: "Dalam perjalanannya baru-baru ini ke Moskow, [HUN.GetLeader] harus mengalami beberapa jam pertemuan yang melelahkan dengan [SOV.GetLeader], yang berulang kali menyebutnya idiot karena mencoba menyarankan skema yang jelas-jelas salah arah. Tampaknya, kita belum sepenuhnya memahami peran wilayah nasional dalam perjuangan revolusioner, dan oleh karena itu kita mengambil kesimpulan yang salah mengenai strategi apa yang seharusnya kita terapkan."
 DOD_hungary.112.a: "Kami akan terus maju sendirian."
 DOD_hungary.112.b: "Kami akan mempertimbangkan kesalahan kami."
 DOD_hungary.113.t: "Rumania menawarkan kompromi"
 DOD_hungary.113.desc: "Pemerintah Rumania di bawah [ROM.GetLeader] telah mengirimkan delegasi ke Moskow untuk merundingkan masalah wilayah yang diperebutkan. Tampaknya mereka percaya bahwa mereka dapat mencapai solusi kompromi, di mana mereka akan menyerahkan satu bagian wilayah yang diperebutkan untuk dikuasai bagian lainnya. Kalau kita setuju, bagian mana yang harus kita tuntut?"
 DOD_hungary.113.a: "Paksa mereka untuk menyerahkan Transylvania"
 DOD_hungary.113.b: "Paksa mereka untuk menyerahkan Bessarabia"
 DOD_hungary.113.c: "Ulangi tawaran pertama kami dengan lebih kuat."
 DOD_hungary.114.t: "Rumania menawarkan konsesi politik"
 DOD_hungary.114.desc: "Dalam sebuah langkah yang mengejutkan, [ROM.GetLeader] telah menawarkan untuk berbagi kekuasaan dengan Partai Komunis Rumania, jika sebagai imbalannya kami menjamin perbatasan mereka. Ini mungkin merupakan cara yang baik untuk mengembangkan pengaruh kita di kawasan ini, tanpa harus mengambil risiko perang."
 DOD_hungary.114.a: "Revolusi terus bergerak maju."
 DOD_hungary.114.b: "Bersikeras di wilayah itu."
 DOD_hungary.115.t: "Rumania menolak tuntutan tersebut"
 DOD_hungary.115.desc: "Pemerintah [ROM.GetAdjective] telah menolak untuk merundingkan wilayah yang diperebutkan. Dalam sebuah pertemuan pribadi, menteri luar negeri Rumania bahkan mengatakan kepada duta besar kami bahwa satu-satunya cara kami bisa mendapatkan tanah ini adalah dengan mengorbankan satu juta orang."
 DOD_hungary.115.a: "Tidak sepadan dengan usahanya."
 DOD_hungary.115.b: "Bersikeras di wilayah itu."
 DOD_hungary.115.c: "Maka satu juta orang akan mereka miliki."
 DOD_hungary.116.t: "[SOV.GetLeader] menanggapi tawaran"
 DOD_hungary.116.desc_transylvania: "Setelah pertemuan dengan delegasi kami, [SOV.GetLeader] telah menawarkan kami semacam kompromi. [SOV.GetNameDefCap] pada prinsipnya telah menyetujui bahwa Bessarabia harus tetap bersama kami, tetapi sebuah \"komisi perbatasan independen\" yang terdiri dari pejabat Uni Soviet dan Tannu Tuva telah sampai pada kesimpulan bahwa sebagian besar Transilvania harus diserahkan ke Hongaria."
 DOD_hungary.116.desc_bessarabia: "Setelah pertemuan dengan delegasi kami, [SOV.GetLeader] telah menawarkan kami semacam kompromi. Karena delegasi Hongaria tidak hadir, kami diberitahu bahwa Soviet bersedia membatalkan pemindahan Transilvania jika kami setuju memberi mereka Bessarabia."
 DOD_hungary.116.desc_no_deal: "Selama pertemuan dengan delegasi kami, pihak Soviet-Hongaria menegaskan kembali tuntutan mereka. Kecuali Bessarabia dan Transylvania diserahkan kepada masing-masing pengklaimnya, mereka akan mempertimbangkan tindakan militer."
 DOD_hungary.116.a: "Dapat diterima."
 DOD_hungary.116.b: "Kami tidak akan pernah menyetujui persyaratan seperti itu!"
 DOD_hungary.117.t: "[SOV.GetLeader] menerima lamaran"
 DOD_hungary.117.desc: "Soviet telah menerima tawaran kami untuk menempatkan Komunis sebagai pemimpin. [SOV.GetLeader] secara pribadi meyakinkan delegasi kami bahwa tidak ada klaim teritorial lebih lanjut yang akan diajukan terhadap kami, setidaknya oleh Komintern."
 DOD_hungary.117.a: "Kami akan menahannya."
 DOD_hungary.118.t: "Soviet mundur"
 DOD_hungary.118.desc: "Respons kuat kami terhadap agresi Soviet-Hongaria tampaknya membuahkan hasil. 'Pravda' baru-baru ini memuat artikel utama yang menentang \"klaim revisionis anti-sosialis\", dan secara khusus mencatat isu-isu klaim atas Bessarabia dan Transilvania sebagai \"perilaku imperialis yang tidak dilakukan oleh negara-negara sosialis maju di dunia.\"\n\nNamun, reaksi di Budapest sangat tidak terdengar dalam menanggapi hal tersebut. Ada kemungkinan [HUN.GetLeader] masih memiliki desain di wilayah kami."
 DOD_hungary.118.a: "Kita akan senang melihat mereka mencoba."
 DOD_hungary.120.t: "Hongaria menyarankan dukungan untuk Cekoslowakia"
 DOD_hungary.120.desc: "[HUN.GetLeader] telah melakukan perjalanan ke Moskow, membawa proposal untuk menawarkan jaminan bersama kepada [CZE.GetNameDef] sebagai imbalan atas pencabutan pembatasan terhadap partai Komunis dan pengalihan kedaulatan Slovakia selatan ke Hongaria."
 DOD_hungary.120.a: "Ide bagus."
 DOD_hungary.120.b: "Mengapa kita harus terlibat dalam perang imperialis?"
 DOD_hungary.121.t: "Komintern menawarkan jaminan"
 DOD_hungary.121.desc: "Duta Besar [HUN.GetNameDef] dan [SOV.GetNameDef] telah mendekati kami dengan tawaran bersama untuk menjamin perbatasan kami dari segala agresi musuh. Sebagai imbalannya, kita harus menjamin kursi komunis di pemerintahan. Hongaria juga telah mengikat komitmen mereka untuk mengembalikan wilayah selatan Slovakia ke dalam kendali mereka."
 DOD_hungary.121.a: "Harga yang dapat diterima."
 DOD_hungary.121.b: "Inilah tuntutan-tuntutan yang perlu kita pertahankan!"
 DOD_hungary.122.t: "Cekoslowakia menolak tawaran kami"
 DOD_hungary.122.desc: "Tawaran jaminan kami belum disambut dengan antusias oleh [CZE.GetAdjective]s. Konsesi politik yang kami minta telah menimbulkan keributan di [CZE.GetNameDef], dengan beberapa Jenderal dan tokoh politik terkemuka mengancam akan mengundurkan diri jika pemerintah menyetujuinya.\n\nMengutip kekhawatiran besar bahwa dukungan akan sampai kepada mereka tepat waktu, pemerintah [CZE.GetAdjective] secara resmi telah menolak tawaran kami."
 DOD_hungary.122.a: "Reaksi yang bisa dimengerti."
 DOD_hungary.122.b: "Dekati Jerman"
 DOD_hungary.123.t: "[SOV.GetLeader] menolak saran kami"
 DOD_hungary.123.desc: "Berdiri di depan peta besar Eropa, [SOV.GetLeader] menyampaikan ceramah selama satu jam kepada delegasi kami, berulang kali menunjukkan kekurangan dan cacat dalam rencana yang diusulkan dan berbicara panjang lebar tentang kebodohan yang luar biasa dari proposal kami, bahkan menuduh kami membuat kesepakatan dengan kaum Imperialis.\n\nDelegasi kami telah kembali dari Moskow dengan tangan kosong, tetapi dalam keadaan hidup."
 DOD_hungary.123.a: "Mungkin ini bukanlah rencana terbaik."
 DOD_hungary.123.b: "Dekati Jerman."
 DOD_hungary.124.t: "[From.GetNameDefCap] menawarkan untuk membagi Cekoslowakia"
 DOD_hungary.124.desc: "Menteri Luar Negeri [From.GetAdjective] telah tiba di Berlin untuk membahas skema pembagian [CZE.GetNameDef] menjadi dua bagian. Masing-masing pihak dalam perjanjian yang diusulkan akan memiliki kendali penuh atas wilayah mereka. Tentu saja, kita akan mendapatkan wilayah barat Bohemia dan Moravia, sementara mereka akan mendapatkan Slovakia."
 DOD_hungary.124.a: "Sebuah skema yang menarik."
 DOD_hungary.124.b: "Kami tidak akan mentolerir campur tangan mereka di lingkungan kami!"
 DOD_hungary.126.t: "[CZE.GetAdjective]menolak"
 DOD_hungary.126.desc: "Pemerintah [CZE.GetAdjective] dilaporkan telah menolak tawaran jaminan, karena konsesi yang 'tak tertahankan' yang diminta sebagai imbalannya.\n\nNamun, duta besar kami untuk [SOV.GetNameDef] melaporkan bahwa ada aktivitas berat di kementerian luar negeri [SOV.GetAdjective]. Rumor di kalangan diplomatik mengarah pada kemungkinan kesepakatan dengan Jerman."
 DOD_hungary.126.a: "Kita akan lihat."
 DOD_hungary.127.t: "Jerman setuju untuk membagi [CZE.GetNameDef]"
 DOD_hungary.127.desc: "[GER.GetLeader] telah menandatangani Perjanjian rahasia Berlin, di mana pemerintah Jerman setuju untuk membagi [CZE.GetNameDef] menjadi dua wilayah kepentingan dan berjanji untuk menghormati setiap keputusan yang dibuat sehubungan dengan Slovakia."
 DOD_hungary.127.a: "Kemenangan untuk diplomasi."
 DOD_hungary.127.b: "Ini bukanlah kesepakatan yang kami harapkan."
 DOD_hungary.128.t: "Jerman menolak tawaran tersebut"
 DOD_hungary.128.desc: "Dalam pertemuan dengan duta besar kami, [GER.GetLeader] telah memperjelas bahwa pemerintahannya menganggap [CZE.GetNameDef] sepenuhnya berada dalam lingkup kepentingan mereka, dan bahwa campur tangan apa pun terhadap perbatasannya akan dianggap sebagai tindakan permusuhan."
 DOD_hungary.128.a: "Kasar."
 DOD_hungary.128.b: "Mereka jelas-jelas menggertak."
 DOD_hungary.129.t: "Ultimatum Jerman"
 DOD_hungary.129.desc: "Duta Besar Jerman hari ini telah menyerahkan sebuah catatan dari [GER.GetLeader], menuntut pengalihan kekuasaan pemerintahan kepadanya sebagai \"Reichsprotektor\" yang baru, sambil menunggu kedatangan administrator yang dipilih secara khusus dari Berlin. Dalam catatan yang sama, duta besar menuntut agar [From.From.GetNameDef] diberikan hak yang sama sehubungan dengan Slovakia.\n\nJika kami menolak, catatan tersebut menjanjikan \"aksi militer yang cepat dan tegas.\""
 DOD_hungary.129.a: "Kami tidak punya pilihan."
 DOD_hungary.129.b: "Buang dia ke luar jendela!"
 DOD_hungary.130.t: "[From.GetAdjective]s meninggalkan pembicaraan"
 DOD_hungary.130.desc: "Meskipun pada awalnya berhasil, tampaknya pemerintah [From.GetLeader] telah berubah pikiran mengenai usulan perjanjian tersebut pada menit-menit terakhir. Mereka sangat bungkam mengenai alasan pasti keputusan mereka, namun dinas intelijen kami mencurigai kurangnya kesiapan angkatan bersenjata mereka sebagai alasannya."
 DOD_hungary.130.a: "Malu."
 DOD_hungary.140.t: "[FROM.GetNameDefCap] menuntut hak untuk mempersenjatai kembali"
 DOD_hungary.140.desc: "Mengutip situasi politik yang semakin memburuk di Eropa dan kegagalan Liga Bangsa-Bangsa untuk menghentikan hal ini, [HUN.GetLeader] telah mengumumkan secara terbuka bahwa pemerintahannya akan berusaha mendapatkan dukungan dari negara-negara tetangga untuk memungkinkan revisi Perjanjian Trianon. Tanpa menyebutkan klaim teritorial apa pun, [HUN.GetLeader] hanya membahas pembatasan militer Hongaria.\n\nDelegasi dari Hongaria telah tiba di ibu kota kami untuk mendapatkan persetujuan resmi mengenai persenjataan kembali Hongaria."
 DOD_hungary.140.a: "Mereka harus dibiarkan membela diri."
 DOD_hungary.140.b: "Mereka sudah menjerumuskan dunia ke dalam perang!"
 DOD_hungary.141.t: "[HUN.GetNameDefCap] mengamankan dukungan [From.GetAdjective] untuk persenjataan kembali"
 DOD_hungary.141.desc: "Tanpa berkonsultasi dengan kami, pemerintah [From.GetAdjective] telah menandatangani perjanjian dengan Hongaria, mengubah atau menghapus pembatasan Perjanjian Trianon. Hongaria sekarang diperbolehkan untuk mempersenjatai kembali secara bebas dan mengembangkan segala jenis peralatan militer, termasuk tank dan pesawat terbang.\n\nMeskipun sudah menjadi rahasia umum bahwa Hongaria telah memperluas pasukannya, perjanjian baru ini akan segera membawa mereka ke titik di mana mereka dapat kembali menjadi ancaman militer bagi kita."
 DOD_hungary.141.a: "Kita harus menyerang sebelum terlambat!"
 DOD_hungary.141.b: "Ajukan protes diplomatik."
 DOD_hungary.141.c: "Ikuti petunjuk [From.GetAdjective]."
 DOD_hungary.142.t: "Perjanjian Berdarah"
 DOD_hungary.142.desc: "Kami telah berhasil mendapatkan dukungan [From.GetAdjective] untuk revisi sebagian Perjanjian Trianon. Semua pembatasan pada militer kita telah dihapus. Para pengawas senjata internasional telah meninggalkan negara tersebut, dan kementerian perang telah menyusun rencana awal untuk melakukan perluasan kecil pada angkatan bersenjata kita."
 DOD_hungary.142.a: "Besar."
 DOD_hungary.143.t: "[From.GetNameDefCap] menerbitkan Nota Protes"
 DOD_hungary.143.desc: "Duta Besar [From.GetAdjective] telah mengirimkan catatan berikut:\n\"Pemerintah [From.GetNameDef] mengamati perkembangan terkini di [HUN.GetNameDef] dengan sangat prihatin. Perjanjian Trianon telah lama menjadi jaminan perdamaian dan stabilitas di kawasan ini. Meskipun pemerintah [From.GetAdjective] pada prinsipnya menerima bahwa negara-negara harus diizinkan untuk memilih nasib mereka sendiri, kita harus mendesak pemerintah [HUN.GetNameDef] dalam kondisi sekuat mungkin untuk mematuhi perjanjian tersebut. Konsekuensi dari destabilisasi kawasan dapat dengan cepat menjadi tidak terkendali.\""
 DOD_hungary.143.a: "Bagus untuk mereka."
 DOD_hungary.144.t: "[From.GetNameDefCap] berdiri teguh dalam persenjataan kembali"
 DOD_hungary.144.desc: "Negosiasi mengenai kemungkinan revisi Perjanjian Trianon tidak mengalami banyak kemajuan setelah tahap awal. Pemerintah [From.GetNameDef] telah menegaskan bahwa mereka tidak akan bergerak sedikit pun dari pendiriannya dalam mempertahankan status quo.\n\nKami dapat menerima hal ini atau mencoba mendapatkan dukungan dari pihak ketiga."
 DOD_hungary.144.a: "Kita harus menyerah pada tekanan mereka."
 DOD_hungary.144.b: "Memohon dukungan kepada kekuatan besar."
 DOD_hungary.145.t: "Memohon dukungan"
 DOD_hungary.145.desc: "Dengan perundingan di Bled yang menemui jalan buntu, kita harus mendapatkan kembali inisiatif diplomasi dengan melibatkan aktor luar. Jika kita bisa mendapatkan dukungan dari negara besar, [From.From.GetLeader] mungkin masih bisa diyakinkan untuk menyerah. Siapa yang harus kita dekati?"
 DOD_hungary.145.a: "Jerman"
 DOD_hungary.145.b: "Perancis"
 DOD_hungary.145.c: "Uni Soviet"
 DOD_hungary.145.d: "Italia"
 DOD_hungary.145.e: "Britania"
 DOD_hungary.146.t: "[HUN.GetLeader] meminta dukungan diplomatik"
 DOD_hungary.146.desc: "Pemerintah Hongaria saat ini berupaya mengubah Perjanjian Trianon agar Hongaria dapat mulai membangun kembali militernya. Negosiasi di Bled telah terhenti selama beberapa hari. Duta Besar Hongaria telah menghubungi pemerintah kami dengan permintaan untuk memberikan tekanan diplomatik di pihak lain.\n\nKementerian Luar Negeri memperingatkan bahwa memihak Hongaria tidak diragukan lagi akan berdampak negatif pada hubungan dengan negara tetangganya dan mengubah keseimbangan kekuatan di wilayah tersebut. Namun, penolakan terhadap Hongaria dapat menyebabkan mereka mengambil tindakan agresif dan meninggalkan diplomasi sama sekali, yang dapat mengganggu stabilitas seluruh wilayah."
 DOD_hungary.146.a: "Hongaria harus diizinkan untuk mempersenjatai kembali."
 DOD_hungary.146.b: "Hongaria tidak boleh diizinkan mempersenjatai kembali."
 DOD_hungary.147.t: "[From.GetNameDefCap] melakukan intervensi dalam Krisis Persenjataan Kembali Hongaria"
 DOD_hungary.147.desc: "Dalam surat pribadinya, [From.GetLeader] mendesak kami untuk mempertimbangkan kembali pendirian kami mengenai Masalah Persenjataan Kembali Hongaria. Secara khusus, ia mencatat bahwa meskipun diizinkan untuk mempersenjatai kembali sekarang, Hongaria akan membutuhkan waktu bertahun-tahun untuk mengumpulkan pasukan yang cukup kuat untuk mengancam apa pun di wilayah tersebut.\n\nTetap teguh dalam masalah ini akan mengisolasi kita secara diplomatis. Kita harus memutuskan apakah keamanan tambahannya sepadan."
 DOD_hungary.147.a: "Mari kita berdoa semoga mereka benar."
 DOD_hungary.147.b: "Kami tahu apa yang terbaik untuk kami."
 DOD_hungary.148.t: "Konferensi Bled gagal"
 DOD_hungary.148.desc: "Setelah beberapa hari perundingan sengit, tidak ada kemajuan yang dicapai di Bled, dan para delegasi telah kembali ke negara asalnya masing-masing. Bahkan intervensi [From.From.GetLeader] tidak menghasilkan apa-apa.\n\nAda banyak rasa frustrasi di dalam dinas diplomatik. Banyak diplomat senior yang menyarankan agar kami mempersenjatai kembali, hanya untuk menunjukkan kepada [From.GetLeader] apa yang terjadi jika dia menolak untuk bernegosiasi."
 DOD_hungary.148.a: "Kita tidak bisa mengambil risiko perang."
 DOD_hungary.148.b: "Sekaranglah waktunya untuk bertindak, bukan kata-kata!"
 DOD_hungary.150.t: "Kompetisi Petarung"
 DOD_hungary.150.desc: "Sebuah studi baru-baru ini mengenai pertempuran udara modern menunjukkan kelemahan kritis dalam angkatan udara kita. Para pejuang kita sangat tertinggal dari perkembangan yang terjadi di negara-negara lain. Kementerian Udara telah memulai program cepat untuk memperoleh pesawat tempur modern sesegera mungkin. Karena pembangunan dalam negeri akan memakan waktu yang sangat lama, maka diputuskan untuk membeli lisensi dari luar negeri. Anggaran tambahan telah disahkan.\n\nPara ahli berbeda pendapat mengenai jenis pesawat apa yang paling cocok untuk memodernisasi sayap tempur kita."
 DOD_hungary.150.a: "Pencegat kecil dan ringan."
 DOD_hungary.150.b: "Petarung yang besar dan berat."
 DOD_hungary.151.t: "Kompetisi Petarung Ringan"
 DOD_hungary.151.desc_light_fighter: "Kementerian Udara sedang mencari untuk membeli pesawat tempur ringan baru untuk serangan pesawat tempur ofensif dan pertahanan titik, namun Kementerian Luar Negeri telah menyarankan bahwa kepentingan politik dan diplomatik juga harus berperan dalam memutuskan negara mana yang akan membeli."
 DOD_hungary.151.desc_light_fighter_refused: "Mengutip keamanan nasional, pemerintah [From.GetAdjective] menolak mengeluarkan izin produksi. Kita mungkin mempunyai peluang yang lebih baik di tempat lain, atau kita dapat mempertimbangkan peningkatan kualitas pesawat yang ada sebagai upaya sementara."
 DOD_hungary.151.a: "Dekati Jerman"
 DOD_hungary.151.b: "Dekati Italia"
 DOD_hungary.151.c: "Dekati Prancis"
 DOD_hungary.151.d: "Dekati Inggris"
 DOD_hungary.151.e: "Dekati AS"
 DOD_hungary.151.f: "Gunakan pengalaman yang diperoleh dari kompetisi untuk meningkatkan pesawat kita sendiri."
 DOD_hungary.152.t: "Kompetisi Petarung Berat"
 DOD_hungary.152.desc_heavy_fighter: "Kementerian Udara sedang mencari cara untuk membeli pesawat tempur berat baru untuk intersepsi jarak jauh dan pengawalan pembom, namun Kementerian Luar Negeri telah menyarankan bahwa kepentingan politik dan diplomatik juga harus berperan dalam memutuskan negara mana yang akan membeli pesawat tersebut."
 DOD_hungary.152.desc_heavy_fighter_refused: "Mengutip keamanan nasional, pemerintah [From.GetAdjective] menolak mengeluarkan izin produksi. Kita mungkin mempunyai peluang yang lebih baik di tempat lain, atau kita dapat mempertimbangkan peningkatan kualitas pesawat yang ada sebagai upaya sementara."
 DOD_hungary.153.t: "[From.GetAdjective] Kompetisi Petarung"
 DOD_hungary.153.desc: "Angkatan Udara [From.GetAdjective] saat ini sedang mengadakan uji coba untuk pesawat tempur ringan baru. Menurut Atase Udara kami, model terbaru kami siap untuk menang. Permintaan resmi dari pemerintah [From.GetAdjective] diharapkan segera dilakukan.\n\nPerwakilan pabrikan sangat mendukung penjualan tersebut, namun ada kekhawatiran keamanan nasional mengenai penjualan peralatan paling modern kami ke negara asing. Haruskah kita mengizinkan penjualan itu dilakukan?"
 DOD_hungary.153.a: "Sangat."
 DOD_hungary.153.b: "Kami tidak bisa mengambil risiko kebocoran apa pun."
 DOD_hungary.154.desc: "Angkatan Udara [From.GetAdjective] saat ini sedang mengadakan uji coba untuk pesawat tempur berat baru. Menurut Atase Udara kami, model terbaru kami siap untuk menang. Permintaan resmi dari pemerintah [From.GetAdjective] diharapkan segera dilakukan.\n\nPerwakilan pabrikan sangat mendukung penjualan tersebut, namun ada kekhawatiran keamanan nasional mengenai penjualan peralatan paling modern kami ke negara asing. Haruskah kita mengizinkan penjualan itu dilakukan?"
 DOD_hungary.155.t: "Kompetisi Petarung selesai"
 DOD_hungary.155.desc: "Setelah negosiasi dengan pabrikan dan pejabat negara, kami telah berhasil mendapatkan izin produksi untuk pesawat tempur baru. Sebuah contoh pesawat telah tiba untuk melatih mekanik dalam pemeliharaannya, dan serangkaian gambar serta cetak biru lengkap diharapkan segera tersedia. Produksi dapat dimulai kapan saja."
 DOD_hungary.155.a: "Rapi."
 DOD_hungary.160.t: "Kompetisi Pengebom"
 DOD_hungary.160.desc: "Sebuah studi yang dilakukan oleh Kementerian Udara mengungkapkan bahwa angkatan udara kita tidak mempunyai perlengkapan yang memadai untuk mendukung angkatan bersenjata. Serangan udara jarak jauh dan dukungan udara jarak dekat telah diidentifikasi sebagai bidang utama dimana kita sangat kekurangan. Pemerintah telah menyediakan dana untuk program kilat guna memperoleh pembom modern, namun kita harus mengambil keputusan mengenai pesawat mana yang harus kita beli."
 DOD_hungary.160.a: "Sebuah pembom kecil untuk dukungan jarak dekat."
 DOD_hungary.160.b: "Pesawat yang lebih besar dengan jangkauan lebih luas."
 DOD_hungary.161.t: "Kompetisi Pembom Ringan"
 DOD_hungary.161.desc_cas: "Kementerian Udara sedang mencari cara untuk membeli pesawat pembom ringan baru untuk memberikan dukungan penuh kepada pasukan darat, namun Kementerian Luar Negeri telah menyarankan bahwa kepentingan politik dan diplomatik juga harus berperan dalam memutuskan negara mana yang akan membeli pesawat tersebut."
 DOD_hungary.161.desc_cas_refused: "Mengutip keamanan nasional, pemerintah [From.GetAdjective] menolak mengeluarkan izin produksi. Kita mungkin mempunyai peluang yang lebih baik di tempat lain, atau kita dapat mempertimbangkan peningkatan kualitas pesawat yang ada sebagai upaya sementara."
 DOD_hungary.162.t: "Kompetisi Pembom Menengah"
 DOD_hungary.162.desc_tac: "Kementerian Udara sedang mencari cara untuk membeli pesawat pembom menengah baru untuk larangan jarak jauh dan serangan udara taktis, namun Kementerian Luar Negeri telah menyarankan bahwa pertimbangan politik dan diplomatik juga harus berperan dalam memutuskan negara mana yang akan membeli pesawat tersebut."
 DOD_hungary.162.desc_tac_refused: "Mengutip keamanan nasional, pemerintah [From.GetAdjective] menolak mengeluarkan izin produksi. Kita mungkin mempunyai peluang yang lebih baik di tempat lain, atau kita dapat mempertimbangkan peningkatan kualitas pesawat yang ada sebagai upaya sementara."
 DOD_hungary.163.t: "[From.GetAdjective] Kompetisi Pengebom"
 DOD_hungary.163.desc: "Angkatan Udara [From.GetAdjective] saat ini sedang mengadakan uji coba untuk pesawat pengebom ringan baru. Menurut Atase Udara kami, model terbaru kami siap untuk menang. Permintaan resmi dari pemerintah [From.GetAdjective] diharapkan segera dilakukan.\n\nPerwakilan pabrikan sangat mendukung penjualan tersebut, namun ada kekhawatiran keamanan nasional mengenai penjualan peralatan paling modern kami ke negara asing. Haruskah kita mengizinkan penjualan itu dilakukan?"
 DOD_hungary.164.t: "[From.GetAdjective] Kompetisi Pengebom"
 DOD_hungary.164.desc: "Angkatan Udara [From.GetAdjective] saat ini sedang mengadakan uji coba untuk pembom menengah baru. Menurut Atase Udara kami, model terbaru kami siap untuk menang. Permintaan resmi dari pemerintah [From.GetAdjective] diharapkan segera dilakukan.\n\nPerwakilan pabrikan sangat mendukung penjualan tersebut, namun ada kekhawatiran keamanan nasional mengenai penjualan peralatan paling modern kami ke negara asing. Haruskah kita mengizinkan penjualan itu dilakukan?"
 DOD_hungary.165.t: "Kompetisi Pengebom selesai"
 DOD_hungary.165.desc: "Setelah negosiasi dengan pabrikan dan pejabat negara, kami berhasil mendapatkan izin produksi untuk pembom baru. Sebuah contoh pesawat telah tiba untuk melatih mekanik dalam pemeliharaannya, dan serangkaian gambar serta cetak biru lengkap diharapkan segera tersedia. Produksi dapat dimulai kapan saja."
 DOD_hungary.165.a: "Rapi."
 DOD_hungary.170.t: "Akhir dari Perjanjian"
 DOD_hungary.170.desc: "Dengan hilangnya pendukung lamanya, Perjanjian Trianon tidak lagi sebanding dengan kertas yang digunakan untuk mencetaknya. Sekarang tidak ada seorang pun yang bisa menolak hak kami untuk memanggul senjata!"
 DOD_hungary.170.a: "Bagus sekali!"
 SWE_HUN_ALLIANCE: "Rumah Bernadotte"
 DOD_romania.1.t: "Rumania ingin memulihkan Aliansi"
 DOD_romania.1.desc: "Aliansi lama dengan Rumania telah berakhir dalam beberapa tahun terakhir. Ancaman Jerman dan Hongaria tampak kecil. Namun dalam menghadapi situasi yang berubah, [ROM.GetLeader] datang ke Warsawa untuk membahas pembaruan Aliansi Rumania-Polandia. Untuk saat ini, perjanjian ini hanya bersifat defensif, dan kedua belah pihak berjanji untuk saling mendukung jika terjadi perang."
 DOD_romania.1.a: "Permintaan yang masuk akal."
 DOD_romania.1.b: "Kami tidak tertarik."
 DOD_romania.2.t: "[From.GetNameDefCap] menyetujui aliansi"
 DOD_romania.2.desc: "Delegasi kami ke Warsawa telah kembali dengan perjanjian bantuan yang ditandatangani oleh [POL.GetLeader]. Kita sekarang diwajibkan untuk membela satu sama lain jika perang terjadi."
 DOD_romania.2.a: "Bagus."
 DOD_romania.3.t: "[From.GetNameDefCap] menolak aliansi"
 DOD_romania.3.desc: "[From.GetLeader] telah menolak untuk bertemu dengan delegasi kami di Warsawa, dan hanya mengirimkan pesan singkat bahwa hubungan yang lebih dekat dengan Rumania 'saat ini tidak sesuai dengan kepentingan pemerintah [From.GetAdjective].'\n\nPermintaan klarifikasi lebih lanjut belum dijawab."
 DOD_romania.3.a: "Sayangnya."
 DOD_romania.10.t: "Sanitasi Cordon"
 DOD_romania.10.desc: "Awalnya dimaksudkan untuk membendung penyebaran Komunisme dan menghalangi Tentara Merah memasuki Eropa, gagasan Cordon Sanitaire baru-baru ini dihidupkan kembali oleh [ROM.GetLeader] untuk memisahkan orang-orang buangan diplomatik dari [GER.GetNameDef] dan [SOV.GetNameDef].\n\nOrang-orang Rumania telah memperingatkan kami untuk bergabung dalam aliansi formal dengan mereka."
 DOD_romania.10.a: "Kami berdiri bersatu."
 DOD_romania.10.b: "Netralitas adalah pertahanan terbaik."
 DOD_romania.11.t: "[From.GetNameDefCap] setuju untuk bergabung dengan Cordon Sanitaire"
 DOD_romania.11.desc: "pemerintah [From.GetLeader] telah menyatakan dukungannya terhadap Cordon Sanitaire. Delegasi dari [From.GetNameDef] telah tiba untuk membahas secara spesifik bergabung dengan faksi kami dan mengatur rencana dukungan militer jika terjadi perang."
 DOD_romania.11.a: "Bagus."
 DOD_romania.12.t: "[From.GetNameDefCap] menurun."
 DOD_romania.12.desc: "Negosiasi dengan [From.GetNameDef] tentang bergabung dengan faksi kami telah gagal. Delegasi dari [From.GetNameDef] telah mengajukan daftar tuntutan yang luas sebagai prasyarat untuk bergabung dengan faksi kami, termasuk komitmen dukungan militer yang luas.\n\nStaf Umum telah menolak tuntutan tersebut dengan alasan bahwa tuntutan tersebut tidak mungkin dipenuhi, dan Kementerian Luar Negeri sekarang percaya bahwa ini adalah tindakan yang disengaja oleh [From.GetLeader] untuk menolak tawaran kami tanpa terlihat bertanggung jawab atasnya."
 DOD_romania.12.a: "Kasar sekali."
 DOD_romania.20.t: "Rumania menuntut jaminan"
 DOD_romania.20.desc: "Selama beberapa bulan ini, kami telah mencoba untuk mendapatkan aliansi dengan [ROM.GetNameDef], meskipun hanya untuk menjaga minyak mereka agar tidak jatuh ke tangan musuh. Sekarang [ROM.GetLeader] telah menyatakan bahwa jaminan formal dukungan militer jika terjadi perang adalah langkah penting sebelum pemerintahnya mempertimbangkan untuk bergabung dengan faksi kami."
 DOD_romania.20.a: "Mereka akan mendapat jaminannya."
 DOD_romania.20.b: "Itu hanya akan membuat kita semakin kurus."
 DOD_romania.21.t: "[From.GetNameDefCap] menjamin perbatasan Rumania"
 DOD_romania.21.desc: "Berbicara sebelum pertemuan Asosiasi Persahabatan Rumania-[From.GetAdjective], [From.GetLeader] mengumumkan bahwa perbatasan Rumania saat ini 'tidak dapat diubah dan permanen', dan berjanji bahwa pemerintahnya akan melakukan segala daya untuk mempertahankan perbatasan tersebut jika terjadi perang."
 DOD_romania.21.a: "Bagus."
 DOD_romania.22.t: "[From.GetNameDefCap] menolak Jaminan"
 DOD_romania.22.desc: "Serangan diplomatik kami baru-baru ini mendapat penolakan dingin dari [From.GetNameDef]. Berbicara di hadapan parlemen, [From.GetLeader] menyatakan bahwa pertanyaan mengenai jaminan formal kepada Rumania 'akan diputuskan jika dan ketika hal tersebut menjadi relevan'."
 DOD_romania.22.a: "Kasar."
 DOD_romania.30.t: "Rumania menawarkan pangkalan"
 DOD_romania.30.desc: "Ketika ketegangan meningkat di Eropa, [ROM.GetLeader] datang kepada kami dengan tawaran yang mengejutkan: Jika kami berkomitmen untuk membela Rumania dari ancaman luar, kami akan diizinkan untuk menempatkan pasukan di tanah Rumania.\n\nSebagai ukuran niat baik, [ROM.GetLeader] juga telah melonggarkan pembatasan terhadap Partai Komunis."
 DOD_romania.30.desc_alt: "Ketika ketegangan meningkat di Eropa, [ROM.GetLeader] datang kepada kami dengan tawaran yang mengejutkan: Jika kami berkomitmen untuk membela Rumania dari ancaman luar, kami akan diizinkan untuk menempatkan pasukan di tanah Rumania."
 DOD_romania.30.a: "Mereka akan mendapat jaminannya."
 DOD_romania.30.b: "Tidak ada kesepakatan dengan kaum imperialis!"
 DOD_romania.31.t: "[From.GetNameDefCap] menyetujui tawaran tersebut"
 DOD_romania.31.desc: "[SOV.GetLeader] secara pribadi telah memerintahkan Angkatan Darat [SOV.GetSovietArmyAdjectiveBasedOnIdeology] untuk merencanakan pertahanan Rumania jika terjadi perang. Sebuah misi militer kecil telah tiba untuk mempersiapkan pangkalan dan lapangan udara bagi kedatangan pasukan garnisun dalam waktu dekat."
 DOD_romania.31.a: "Semoga kita tidak menyesali hal ini."
 DOD_romania.32.t: "[From.GetNameDefCap] menolak tawaran kami"
 DOD_romania.32.desc: "Pembicaraan tentang penempatan pasukan [SOV.GetAdjective] di Rumania telah berakhir hanya dalam beberapa jam, dan [SOV.GetAdjective] menyatakan bahwa mereka tidak tertarik untuk menjamin perbatasan kita.\n\nBeberapa Jenderal kita telah menangkap implikasi yang meresahkan bahwa hal ini mungkin terjadi karena mereka tidak menyukai bentuk mereka saat ini dan berusaha mengubahnya."
 DOD_romania.32.a: "Memang mengganggu."
 DOD_romania.40.t: "tekanan Rumania"
 DOD_romania.40.desc: "Duta Besar kami untuk [ROM.GetNameDef] segera dipanggil ke kantor [ROM.GetLeader]. Sebelum dia sempat menanyakan tentang pergerakan baru-baru ini militer Rumania menuju perbatasan bersama kami, dia diberi ultimatum. [BUL.GetNameDefCap], [ROM.GetLeader] menegaskan, tidak dapat lagi diizinkan untuk bertindak sendiri tanpa persetujuan tertulis darinya, dan harus menyerahkan setiap keputusan kebijakan penting untuk disetujuinya.\n\nPenolakan akan ditindak dengan kekerasan."
 DOD_romania.40.a: "Kita harus menuruti tuntutan mereka."
 DOD_romania.40.b: "Kematian sebelum Aib!"
 DOD_romania.41.t: "[From.GetNameDefCap] dikirimkan"
 DOD_romania.41.desc: "[BUL.GetNameDefCap] telah menerima permintaan kami dan sekarang berkonsultasi dengan kami sebelum mengambil keputusan politik apa pun.\n\nSeorang Perwakilan Khusus telah tiba di Sofia untuk berkoordinasi dengan pemerintah mereka."
 DOD_romania.41.a: "Bagus."
 DOD_romania.42.t: "[From.GetNameDefCap] menantang"
 DOD_romania.42.desc: "Ketika diberikan daftar tuntutan kami, [BUL.GetLeader] dilaporkan tertawa dan kemudian merobek kertas tersebut, mengklaim bahwa tidak ada tentara Rumania yang bisa mengalahkan tentara Bulgaria dalam pertempuran."
 DOD_romania.42.a: "Ini tidak sebanding dengan pertumpahan darah."
 DOD_romania.42.b: "Mari kita cari tahu apakah dia benar."
 DOD_romania.50.t: "Rumania menuntut perubahan pada pemerintahan."
 DOD_romania.50.desc: "Ketika [ROM.GetLeader] secara terbuka menuntut agar ia diizinkan memveto penunjukan apa pun dalam pemerintahan [HUN.GetAdjective], hanya karena hal tersebut demi kepentingan Rumania, sebagian besar orang di dinas diplomatik menganggapnya sebagai propaganda sederhana yang ditujukan untuk khalayak domestik.\n\nKami terkejut ketika menerima nota resmi yang menyatakan hal yang sama beberapa saat kemudian.\n\nAncaman kekuatan militer jika kami tidak mematuhinya telah membuat Staf Umum panik, dan Komando Tinggi Angkatan Darat menimbulkan keraguan besar apakah kami dapat menahan pasukan Rumania di perbatasan."
 DOD_romania.50.a: "Kami tidak punya pilihan."
 DOD_romania.50.b: "Kita bisa membuat beberapa konsesi."
 DOD_romania.50.c: "Lebih baik mati bebas daripada hidup sebagai budak."
 DOD_romania.51.t: "[From.GetNameDefCap] Sejajar"
 DOD_romania.51.desc: "Menyadari bahwa perlawanan militer tidak mungkin dilakukan dan tidak ada gunanya, pemerintah Hongaria memutuskan untuk mengikuti saran kami dan siap membantu kami, dan [HUN.GetLeader] berjanji untuk berkonsultasi dengan kami sebelum mengambil keputusan kebijakan besar."
 DOD_romania.51.a: "Bagus."
 DOD_romania.52.t: "[From.GetNameDefCap] menawarkan Perjanjian Persahabatan"
 DOD_romania.52.desc: "Menanggapi permintaan kami baru-baru ini untuk beberapa perubahan dalam pemerintahan Hongaria, [HUN.GetLeader] telah menawarkan Perjanjian Persahabatan dan Saling Membantu, yang akan memaksa mereka untuk membantu kami pada saat perang, tetapi juga berisi klausul di mana kami bersumpah untuk tidak ikut campur dalam politik Hongaria."
 DOD_romania.52.a: "Kompromi yang bisa diterima."
 DOD_romania.52.b: "Bukan itu yang kami maksudkan."
 DOD_romania.53.t: "[From.GetNameDefCap] Menantang"
 DOD_romania.53.desc: "Terlepas dari inferioritas angkatan bersenjatanya, [HUN.GetLeader] menolak alasan yang masuk akal dan memerintahkan pasukannya untuk mengambil posisi bertahan di sepanjang perbatasan kita. Untuk alasan yang tidak diketahui, nampaknya sebagian besar tentara mereka telah mengikuti perintah ini.\n\nSepertinya mereka ingin melakukan perlawanan."
 DOD_romania.53.a: "Ini tidak sebanding dengan waktu dan usaha."
 DOD_romania.53.b: "Kemenangan sudah pasti. Untuk berperang!"
 DOD_romania.60.t: "Rumania menuntut reorganisasi radikal"
 DOD_romania.60.desc: "Dengan tentara Rumania yang siap di perbatasan kami, rumor beredar mengenai tujuan mereka. Ketika duta besar kami di Bukares menanyakan masalah ini, dia diberitahu secara blak-blakan bahwa [ROM.GetLeader] telah memutuskan bahwa persatuan Yugoslavia tidak lagi menjadi kepentingannya. Sebaliknya, negara kita akan dipecah menjadi beberapa negara klien di bawah kendali langsung Rumania.\n\nUltimatum resmi diharapkan akan dikeluarkan dalam waktu satu jam."
 DOD_romania.60.a: "Kita tidak bisa berharap untuk melawan mereka."
 DOD_romania.60.b: "Tidak pernah!"
 DOD_romania.61.t: "[From.GetNameDefCap] lipatan"
 DOD_romania.61.desc: "Beberapa menit sebelum ultimatum kepada Beograd habis, sebuah komunike resmi tiba, menyatakan bahwa pemerintah Yugoslavia telah membubarkan dan mengalihkan kekuasaannya kepada sejumlah pemerintah daerah, yang semuanya telah menyatakan kesetiaannya kepada kami."
 DOD_romania.61.a: "Bagus."
 DOD_romania.62.t: "[From.GetNameDefCap] menantang"
 DOD_romania.62.desc: "Pemerintah [YUG.GetAdjective] membiarkan ultimatum tersebut habis tanpa ada balasan. Penerbangan pengintaian telah mengungkap pergerakan pasukan di sisi perbatasan Yugoslavia, sehingga mendorong Staf Umum untuk meninjau rencana invasi. Para penasihat militer terkemuka menolak memberikan jaminan bahwa kemenangan melawan Yugoslavia akan diraih dengan cepat."
 DOD_romania.62.a: "Kami akan menjatuhkan mereka."
 DOD_romania.62.b: "Mari kita meminta dukungan."
 DOD_romania.63.t: "[From.GetLeader] bertujuan untuk memecah Yugoslavia"
 DOD_romania.63.desc: "Krisis telah muncul antara Rumania dan Yugoslavia, yang mungkin memberikan peluang bagi kita. [YUG.GetLeader] telah menolak tuntutan [ROM.GetLeader] untuk menyerahkan negaranya. Sebagai imbalannya, [ROM.GetLeader] telah mendekati kami dengan kesepakatan untuk memecah Yugoslavia. Dia telah menawari kami Slovenia dan pembentukan Negara Kroasia Merdeka di bawah kendali kami."
 DOD_romania.63.a: "Sebuah skema yang menarik."
 DOD_romania.63.b: "Mengapa kita membutuhkan bantuan mereka?"
 DOD_romania.64.desc: "Krisis telah muncul antara Rumania dan Yugoslavia, yang mungkin memberikan peluang bagi kita. [YUG.GetLeader] telah menolak tuntutan [ROM.GetLeader] untuk menyerahkan negaranya. Sebagai imbalannya, [ROM.GetLeader] telah mendekati kami dengan kesepakatan untuk memecah Yugoslavia. Dia telah menawari kami Dalmatia dan pembentukan negara boneka di Montenegro di bawah kendali kami."
 DOD_romania.65.t: "[From.GetNameDefCap] menerima"
 DOD_romania.65.desc: "[From.GetLeader] telah mengisyaratkan penerimaannya terhadap persyaratan tersebut. Pemerintah [From.GetAdjective] akan mendukung tindakan kami di Yugoslavia."
 DOD_romania.65.a: "Bagus sekali."
 DOD_romania.66.t: "[From.GetNameDefCap] menolak"
 DOD_romania.66.desc: "Meskipun tidak secara langsung memperingatkan kami untuk tidak melakukan intervensi di Yugoslavia, pemerintah [From.GetNameDef] menolak menyetujui usulan kami.\n\nMungkin mereka mengira kita akan gagal dan ingin merebut Yugoslavia, tanpa melibatkan kita."
 DOD_romania.66.a: "Kami akan menyesal mengecewakan mereka."
 DOD_romania.67.t: "Ultimatum kepada Yugoslavia"
 DOD_romania.67.desc: "Setelah mendapat dukungan diplomatik tambahan, sekarang saatnya memberi tahu Yugoslavia bahwa situasinya telah berubah secara dramatis. Tersebar tipis dalam upaya mempertahankan perbatasan yang panjang, situasi militer mereka bahkan lebih tidak ada harapan lagi."
 DOD_romania.67.a: "Kemenangan sudah dekat."
 DOD_romania.68.t: "Kemajuan diplomatik gagal"
 DOD_romania.68.desc: "Upaya kami untuk menjangkau Jerman dan Italia untuk mendapatkan dukungan belum membuahkan hasil. Ruang bernapas yang diberikan kepada Yugoslavia pasti akan berdampak pada kampanye mendatang, namun Staf Umum masih optimistis bahwa kita akan dapat segera meraih kemenangan."
 DOD_romania.68.a: "Untuk mempersenjatai!"
 DOD_romania.69.t: "Pengepungan"
 DOD_romania.69.desc_GER: "Ultimatum kedua telah disampaikan. Kali ini, tuntutan tersebut diapit oleh catatan serupa dari duta besar [GER.GetNameDef], yang menyatakan dukungannya terhadap skema Rumania, dan menegaskan bahwa Angkatan Darat kita tidak akan mengganggu pendudukan Slovenia dan Kroasia oleh pasukan Jerman."
 DOD_romania.69.desc_ITA: "Ultimatum kedua telah disampaikan. Kali ini, tuntutan tersebut diapit oleh catatan serupa dari duta besar [ITA.GetNameDef], yang menyatakan dukungannya terhadap skema Rumania, dan menegaskan bahwa Angkatan Darat kita tidak akan mengganggu pendudukan Dalmatia dan Montenegro oleh pasukan Italia."
 DOD_romania.69.desc_GERITA: "Ultimatum kedua telah disampaikan. Kali ini, tuntutan tersebut disertai dengan catatan serupa dari duta besar [GER.GetNameDef] dan [ITA.GetNameDef], yang menyatakan dukungan mereka terhadap skema Rumania, dan menegaskan bahwa Angkatan Darat kita tidak akan ikut campur dalam pendudukan, untuk menghindari pertumpahan darah yang tidak perlu."
 DOD_romania.69.a: "Turun."
 DOD_romania.69.b: "Kami akan berjuang sampai nafas terakhir!"
 DOD_romania.70.t: "Yugoslavia terpecah"
 DOD_romania.70.desc: "Pemerintah Yugoslavia telah menerima kekalahan. Kekuatan negara sekutu telah menguasai negara dan menduduki zona yang ditentukan."
 DOD_romania.70.a: "Kemenangan lain untuk diplomasi."
 DOD_romania.71.t: "Yugoslavia menentang"
 DOD_romania.71.desc: "Tentara Yugoslavia telah menduduki posisi di sepanjang perbatasan kami dan Angkatan Udara Yugoslavia telah menduduki stasiun perangnya. Mereka tampak siap bertarung.\n\nNamun, sumber di Kementerian Perang Yugoslavia mengklaim bahwa ini hanyalah sebuah isyarat pembangkangan, karena [YUG.GetLeader] sangat yakin bahwa kami hanya menggertak dan tidak akan ada perang."
 DOD_romania.71.a: "Kami tidak menggertak."
 DOD_romania.81.t: "Nyonya Raja membeli vila"
 DOD_romania.81.desc: "Magda Lupescu, nyonya Raja Carol II, dilaporkan telah membeli sebuah vila baru di pinggiran kota Bucharest yang mahal. Bagaimana dia mampu membelinya masih menjadi bahan spekulasi luas. Bukti baru di surat kabar asing menunjukkan dengan kuat bahwa Raja sendiri yang mengizinkan pembelian tersebut dengan uang pemerintah.\n\nSkandal ini menyebar, dan kita harus mengumumkan masalah ini kepada publik sesegera mungkin."
 DOD_romania.81.a: "Pemerintah telah membeli gedung tersebut dan mengizinkan Nona Lupescu tinggal."
 DOD_romania.81.b: "Raja mengambil uang itu dari uang muka uang sakunya."
 DOD_romania.82.t: "Raja melarang buku kritis"
 DOD_romania.82.desc: "Sebuah buku baru yang ditulis oleh seorang ilmuwan sosial terkenal baru-baru ini diterbitkan, merinci pengaruh luas lingkaran dalam Raja terhadap keputusan kebijakan. Sebagian besar keputusan tersebut pada akhirnya menguntungkan para anggota setelahnya. Yang menarik adalah urusan Nyonya Raja, yang dilaporkan telah menggunakan koneksinya untuk memperkaya dirinya sendiri. Raja telah memerintahkan penulisnya ditangkap.\n\nSurat kabar liberal dan kelompok sayap kanan sedang gempar mengenai hal ini, meskipun dengan alasan yang sangat berbeda. Kita perlu membuat pernyataan mengenai hal ini sebelum keadaan menjadi tidak terkendali."
 DOD_romania.82.a: "Pencemaran nama baik adalah tindak pidana."
 DOD_romania.82.b: "Penulis akan segera dibebaskan."
 DOD_romania.83.t: "Raja mengadakan pesta mewah"
 DOD_romania.83.desc: "Meskipun telah diperiksa oleh Raja sendiri, liputan resmi mengenai pesta baru-baru ini di istana Kerajaan telah menyebabkan perbedaan pendapat publik yang besar. Gambar nyonya Raja dalam gaun malam Prancis yang mahal dan penjelasan rinci tentang 7 hidangan yang disantap dari piring emas telah semakin mengobarkan kemarahan masyarakat, yang masih menderita akibat Depresi Hebat.\n\nRaja menuntut agar kita segera membuat pernyataan dukungan publik."
 DOD_romania.83.a: "Raja harus diizinkan untuk menjadi wakil."
 DOD_romania.83.b: "Masalah pribadi Raja bukanlah urusan pemerintah."
 DOD_romania.84.t: "Nyonya Raja terlihat di Paris"
 DOD_romania.84.desc: "Surat kabar Perancis penuh dengan eksploitasi Magda Lupescu di Paris, di mana dia dilaporkan terlibat dalam belanja besar-besaran.\n\nMeskipun hal ini biasa terjadi, laporan bahwa dia meminta bantuan dari kedutaan Rumania untuk memindahkan pembeliannya dan meminta toko-toko untuk mengirimkan tagihan ke pemerintah Rumania telah diangkat oleh pers nasional. Kami telah diminta untuk mengomentari laporan ini."
 DOD_romania.84.a: "Nona Lupescu bertindak atas permintaan Raja."
 DOD_romania.84.b: "Pemerintah tidak mengomentari tindakan warga negara."
 DOD_romania.85.t: "Raja berlibur di Nice"
 DOD_romania.85.desc: "Ditemani majikannya dan sebagian besar lingkaran dalamnya, Raja Carol II tiba di Nice untuk berlibur. Bertempat tinggal di Royal Lounge di Hotel Negresco, Raja mengatakan kepada wartawan setempat bahwa ia bermaksud menghabiskan beberapa minggu ke depan menikmati makanan dan keramahtamahan terbaik, dengan rencana kunjungan ke Nice Opera dan perjalanan singkat ke Paris untuk berbelanja.\n\nPers lokal telah mengajukan pertanyaan tajam tentang waktu kunjungan ini, serta dari mana uang untuk membayar kunjungan tersebut seharusnya berasal."
 DOD_romania.85.a: "Itu adalah kunjungan resmi kenegaraan."
 DOD_romania.85.b: "Raja pergi ke Nice untuk berlibur setiap tahun."
 DOD_romania.86.t: "King terlibat dalam skandal penggelapan"
 DOD_romania.86.desc: "Menyusul rumor korupsi dalam proses pengadaan Angkatan Darat, Raja berjanji akan melakukan penyelidikan yang tidak memihak terhadap masalah tersebut. Sebuah laporan awal telah dibocorkan kepada pers, membenarkan tidak hanya rumor tersebut tetapi juga secara langsung melibatkan penasihat terdekat Raja dalam masalah ini.\n\nSeluruh kejadian ini telah mempermalukan pemerintah. Raja menuntut tindakan, namun telah menyatakan dukungan penuhnya terhadap para penasihat tersebut."
 DOD_romania.86.a: "Kontrak yang ditandatangani tidak dapat disangkal."
 DOD_romania.86.b: "Reformasi prosesnya."
 DOD_romania.110.t: "Rumania menawarkan untuk membagi [CZE.GetNameDef]"
 DOD_romania.110.desc: "[ROM.GetLeader] telah menghubungi kami dengan tawaran untuk menangani [CZE.GetNameDef]. Memperhatikan kepentingan bersama kita di wilayah tersebut, ia menyarankan agar negara ini dibagi tiga cara: Kita akan mendapatkan bagian barat, Rumania akan menguasai Slovakia dan Hongaria akan diberikan sebagian kecil wilayah di perbatasan selatan."
 DOD_romania.110.a: "Kita harus memanfaatkan peluang ini."
 DOD_romania.110.b: "Mengapa bernegosiasi untuk mendapatkan apa yang bisa kita ambil sendiri?"
 DOD_romania.111.t: "[GER.GetLeader] menerima"
 DOD_romania.111.desc: "Pemerintah Jerman telah menyetujui rancangan perjanjian kami dan usulan garis demarkasi. Yang tersisa hanyalah mengirimkan ultimatum ke Praha."
 DOD_romania.111.a: "Ayo kirim catatan."
 DOD_romania.113.t: "[GER.GetLeader] menolak"
 DOD_romania.113.desc: "Dalam pertemuan yang penuh kemarahan dengan [GER.GetLeader], duta besar kami dihadapkan pada penolakan keras untuk berdiskusi atau bernegosiasi mengenai apa pun mengenai [CZE.GetNameDef]. Pemerintah Jerman menganggap negara tersebut sepenuhnya berada dalam wilayah pengaruh mereka dan telah memperingatkan bahwa campur tangan apa pun akan dianggap bertentangan dengan keinginan [GER.GetLeader]."
 DOD_romania.113.a: "Saatnya memikirkan kembali pendekatan kita."
 DOD_romania.113.b: "Kami akan menyerang sendirian."
 DOD_romania.114.t: "Ultimatum Jerman"
 DOD_romania.114.desc: "Dengan banyaknya pasukan Jerman di perbatasan kita, Duta Besar Jerman dan Rumania telah mengeluarkan ultimatum bersama: Kecuali kita setuju untuk menyerahkan Slovakia ke Hongaria dan Rumania dan menjadi 'Protektorat' Jerman, Luftwaffe Jerman siap untuk 'membasmi' Praha sementara pasukan Hongaria bersiap untuk menyerang negara kita dari selatan."
 DOD_romania.114.a: "Kami tidak punya pilihan."
 DOD_romania.114.b: "Kami akan memilih Kematian sebelum Dishonor."
 DOD_romania.115.t: "[CZE.GetLeader] menantang"
 DOD_romania.115.desc: "Pemerintah [CZE.GetAdjective] telah mengabaikan ultimatum kami dan mengerahkan pasukannya. [CZE.GetLeader] telah berjanji bahwa setiap penyerbu akan menemukan tentara yang lebih dari siap untuk mempertahankan negara sampai orang terakhir."
 DOD_romania.115.a: "Kami akan mempertimbangkan pilihan kami."
 DOD_romania.120.t: "Undang Perusahaan Motor Asing"
 DOD_romania.120.desc: "Beberapa perusahaan truk asing telah menyatakan minatnya untuk membuka pabrik di Rumania, guna memproduksi truk baru untuk pasar komersial dan juga militer. Memilih salah satu akan dianggap sebagai kesepakatan utama yang dapat diikuti dengan perolehan izin produksi lebih lanjut.\n\nSiapa yang harus kami dekati?"
 DOD_romania.120.a: "Vauxhall, untuk kendaraan yang lebih cepat."
 DOD_romania.120.b: "Opel, untuk teknik Jerman yang andal."
 DOD_romania.120.c: "Ford, untuk produksi massal."
 DOD_yugoslavia.1.t: "Militer melancarkan Kudeta"
 DOD_yugoslavia.1.desc: "Menyusul keputusan kami untuk menandatangani perjanjian dengan Jerman, sekelompok perwira Angkatan Udara melancarkan kudeta. Militer telah merebut titik-titik penting di Beograd. Raja Peter telah dinyatakan cukup umur, mengakhiri masa jabatan [YUG.GetLeader].\n\nMasyarakat umum mendukung kudeta, dengan massa yang meneriakkan \"Lebih baik perang daripada perjanjian, lebih baik kuburan daripada budak!\"\n\nPemerintah berada di persimpangan jalan. Kami dapat mendukung kudeta, yang berarti perang dengan Jerman. Atau kita bisa mencoba melawannya, yang akan menghancurkan negara ini dalam perang saudara yang berdarah-darah."
 DOD_yugoslavia.1.a: "Kami seharusnya mendengarkan petugas."
 DOD_yugoslavia.1.a.tt: "§YPeter II§! menjadi ketua partai §Y[YUG.GetIdeologyNameWithCaps]§!."
 DOD_yugoslavia.1.b: "Kami teguh dengan keputusan kami!"
 DOD_yugoslavia.2.t: "Kudeta di [YUG.GetNameDef]"
 DOD_yugoslavia.2.desc: "Segera setelah pemerintahan Pangeran Paul menandatangani Pakta Tripartit, sekelompok perwira Angkatan Udara [YUG.GetAdjective] melaksanakan kudeta terencana yang menggantikan pemerintahan sah dan mengangkat Peter II yang masih di bawah umur ke takhta.\n\nPemerintahan Yugoslavia telah bubar seluruhnya, dengan para pemimpin baru menyatakan tanda tangan Pangeran Paul batal demi hukum."
 DOD_yugoslavia.2.a: "Jalankan Petunjuk Führer 25."
 DOD_yugoslavia.3.desc: "Segera setelah pemerintahan Pangeran Paul menandatangani Pakta Tripartit, sekelompok perwira Angkatan Udara [YUG.GetAdjective] melaksanakan kudeta terencana yang menggantikan pemerintahan yang sah dan mengangkat Peter II di bawah umur ke takhta.\n\nElemen pemerintahan sebelumnya mengecam kudeta tersebut dan mengumumkan keadaan darurat nasional. Karena ini jelas-jelas ulah agen asing, maka mereka menyatakan bahwa kita wajib membela mereka."
 DOD_yugoslavia.3.a: "Mereka salah besar."
 DOD_yugoslavia.3.b: "Kami akan menyelamatkan mereka."
 DOD_yugoslavia.10.t: "Kolom Kelima"
 DOD_yugoslavia.10.desc: "Ketika berita deklarasi perang melawan Jerman menyebar ke seluruh negeri, dengan cepat menjadi jelas bahwa banyak orang di negara tersebut tidak berniat mengangkat senjata melawan penjajah. Mayoritas unit Kroasia menolak perintah untuk bergerak menuju perbatasan, dan dalam beberapa kesempatan bahkan menembaki unit lain yang mengikuti perintah.\n\nTampaknya kami tidak dapat lagi mengandalkan dukungan Kroasia, yang membuat pertahanan perbatasan dengan Jerman menjadi sulit."
 DOD_yugoslavia.10.a: "Pengkhianat!"
 DOD_yugoslavia.10.b: "Sebenarnya mereka ada benarnya..."
 warning_we_will_change_to_this_country_tt: "§RAkan mengganti tag ke [CRO.GetNameDef]§!"
 YUG_CRO_independence_war_troops_tt: "Satu §Y[CRO.GetAdjective] Kavaleri§! dan Lima §Y[CRO.GetAdjective] Divisi Infanteri§! akan bergabung dalam pemberontakan"
 DOD_yugoslavia.20.t: "[YUG.GetName] meminta penjualan pesawat terbang"
 DOD_yugoslavia.20.desc: "Menyadari kelemahan strategisnya, Angkatan Udara [YUG.GetAdjective] telah memulai program cepat untuk memodernisasi dan memperluas kekuatannya. Cadangan uang yang signifikan telah disisihkan untuk menutupi pembelian tersebut. Sebuah komisi sedang berkeliling Eropa untuk mencari sumber baru pesawat tempur dan pembom menengah.\n\nMengingat urgensi masalah ini, [YUG.GetAdjective] bersikeras untuk segera mengirimkan atau mentransfer pesawat langsung dari produsennya."
 DOD_yugoslavia.20.a: "Menyetujui penjualan pesawat tempur dari cadangan kami."
 DOD_yugoslavia.20.b: "Menyetujui penjualan pesawat pengebom dari cadangan kami."
 DOD_yugoslavia.20.d: "Alihkan produksi pesawat tempur untuk memenuhi pesanan mereka."
 DOD_yugoslavia.20.e: "Mengalihkan produksi pembom untuk menutupi pesanan mereka."
 DOD_yugoslavia.20.c: "Kami tidak bisa menyisihkan apa pun."
 DOD_yugoslavia.21.t: "[From.GetNameDefCap] menyetujui penjualan pesawat tempur"
 DOD_yugoslavia.21.desc: "Komisi pembelian kami di [From.GetNameDef] telah mengamankan penjualan sejumlah pesawat tempur untuk angkatan udara kami. Pesawat pertama telah diterima, dan pilot kami telah memulai pelatihan konversi."
 DOD_yugoslavia.21.a: "Bagus sekali."
 DOD_yugoslavia.22.t: "[From.GetNameDefCap] menyetujui penjualan pesawat pengebom"
 DOD_yugoslavia.22.desc: "Komisi pembelian kami di [From.GetNameDef] telah mengamankan penjualan sejumlah pembom menengah untuk angkatan udara kami. Pesawat pertama telah diterima, dan pilot kami telah memulai pelatihan konversi."
 DOD_yugoslavia.30.t: "Pertanyaan [YUG.GetNameDef]"
 DOD_yugoslavia.30.desc: "Setelah kembalinya Austria ke Reich, kami sekarang berbagi perbatasan dengan [YUG.GetNameDef]. Pemerintah [YUG.GetLeader] cukup diam mengenai sikap mereka terhadap usulan penataan ulang Eropa. Mungkin kita harus mengingatkan mereka bahwa akan tiba saatnya mereka harus menentukan pilihan."
 DOD_yugoslavia.30.a: "Berikan tekanan pada mereka."
 DOD_yugoslavia.30.b: "Pendapat mereka tidak relevan."
 DOD_yugoslavia.31.t: "tekanan Jerman"
 DOD_yugoslavia.31.desc: "Beberapa hari yang lalu, duta besar Jerman menyudutkan [YUG.GetLeader] di sebuah resepsi diplomatik. Setelah Anschluss Austria, ia mencatat, [YUG.GetNameDef] dan [GER.GetNameDef] sekarang berbagi perbatasan yang sama. Duta Besar meyakinkan [YUG.GetLeader] bahwa Jerman tentu saja sangat tertarik dengan hubungan persahabatan.\n\nBeliau hanya meminta agar kita selalu mengingat hal tersebut ketika mengambil keputusan kebijakan di kemudian hari."
 DOD_yugoslavia.31.a: "Betapa baiknya dia."
 DOD_yugoslavia.31.b: "Kita harus menjaga hubungan baik dengan mereka..."
 YUG_wavering_to_GER_pressure_opm: "Goyah terhadap Tekanan kita"
 YUG_wavering_to_GER_pressure_reverse_opm: "Bimbang terhadap Tekanan Jerman"
 YUG_GER_pressured_us_annoyed_opm: "Kesal dengan Tekanan Diplomatik"
 DOD_yugoslavia.32.desc: "Dengan tidak adanya [CZE.GetNameDef], keseimbangan kekuatan di Eropa Tenggara telah berubah secara dramatis. Senjata dan uang Ceko digunakan untuk mendukung sejumlah negara yang kini perlu mencari sponsor baru. Mungkin ini saatnya mengingatkan [YUG.GetLeader] akan fakta tersebut."
 DOD_yugoslavia.32.a: "Tekan dia."
 DOD_yugoslavia.32.b: "Kami punya rencana lain."
 DOD_yugoslavia.33.desc: "Hanya beberapa jam setelah pasukan Jerman memasuki Praha, ketika duta besar [CZE.GetAdjective] masih mengucapkan selamat tinggal, duta besar [GER.GetNameDef] menelepon di Kementerian Luar Negeri.\n\nMenurutnya, pemerintah Jerman sangat menyesalkan bahwa mereka harus mengambil tindakan seperti itu di [CZE.GetNameDef], dan [GER.GetLeader] senang bahwa tindakan [YUG.GetLeader] tidak memberinya alasan untuk mempertimbangkan tindakan tersebut sehubungan dengan Yugoslavia.\n\nDuta Besar mengakhiri dengan mengungkapkan harapannya bahwa hal ini akan terus berlanjut di masa depan."
 DOD_yugoslavia.33.a: "Betapa baiknya dia."
 DOD_yugoslavia.33.b: "Ini semakin serius, kita harus segera menindak unsur anti-Jerman!"
 DOD_yugoslavia.34.desc: "Kami sekarang berdiri tertinggi di Eropa. Perancis telah lama menjadi fondasi stabilitas di Eropa Tenggara, namun kini seluruh wilayah tersebut dapat direbut. Kita dapat menarik semua negara ke dalam orbit kita, tanpa ada seorang pun yang dapat menghentikan kita.\n\nSaatnya memberi tahu Yugoslavia bahwa mereka harus membuat pilihan. Entah mereka berdiri bersama kita - atau mereka akan tersapu bersih."
 DOD_yugoslavia.34.a: "Kesabaran kami terhadap mereka mulai menipis."
 DOD_yugoslavia.34.b: "Harimau tidak peduli dengan pendapat tikus."
 DOD_yugoslavia.35.desc: "Dalam pertemuan baru-baru ini di Berghof, [GER.GetLeader] dan [YUG.GetLeader] membahas situasi di Eropa, dan peran kita di dalamnya. [GER.GetLeader] menegaskan bahwa Yugoslavia tidak dapat menghindari keberpihakan dalam perjuangan hidup atau mati yang akan segera terjadi. Jerman juga tidak bisa mentolerir negara yang tidak selaras di perbatasannya.\n\nHampir lebih baik, dia mengakhiri, jika Yugoslavia memilih untuk memihak Sekutu, supaya semua orang tahu di mana mereka berdiri."
 DOD_yugoslavia.35.a: "Waktu hampir habis."
 DOD_yugoslavia.35.b: "Tidak, kita tidak boleh menenangkan mereka lebih jauh!"
 enemy_of_the_reich_opm: "Musuh Reich"
 YUG_wavering_to_GER_pressure_2_opm: "Goyah terhadap Tekanan kita"
 YUG_wavering_to_GER_pressure_reverse_2_opm: "Bimbang terhadap Tekanan Jerman"
 DOD_yugoslavia.36.t: "Nasib Yugoslavia"
 DOD_yugoslavia.36.desc: "Setelah berkali-kali mendesak mereka untuk memihak satu pihak, pemerintah [YUG.GetLeader] masih berpegang teguh pada gagasan bahwa Yugoslavia dapat mengesampingkan konflik ini. Kini mereka harus menghadapi konsekuensi dari kepengecutan mereka."
 DOD_yugoslavia.36.a: "Jika mereka tidak bersama kita, mereka melawan kita!"
 DOD_yugoslavia.36.b: "Hal-hal tersebut, dan akan selamanya tetap, tidak relevan."
 DOD_yugoslavia.40.desc: "Yugoslavia merupakan inti dari strategi Balkan baru kami. Sejauh ini mereka masih tidak berkomitmen, melakukan perdagangan dengan Jerman namun tidak bergabung dengan Poros. Kita harus mengingatkan mereka bahwa kita tidak akan mentolerir perdagangan dengan musuh jika terjadi perang."
 DOD_yugoslavia.40.a: "Beri mereka satu baris."
 DOD_yugoslavia.40.b: "Kita tidak bisa mencampuri urusan negara lain."
 DOD_yugoslavia.41.t: "tekanan Inggris"
 DOD_yugoslavia.41.desc: "[ENG.GetLeader] baru-baru ini mengumumkan serangan diplomatik di wilayah Balkan. Salah satu kemajuannya adalah pertemuan pribadi antara dia dan duta besar kami di London. Dalam pertemuan ini, beliau menanyakan posisi kami terhadap Jerman. [GER.GetNameDefCap], katanya, menyumbang sejumlah besar ekspor non-sumber daya kita. Kita sebaiknya, lanjutnya, mengurangi ketergantungan kita pada Jerman."
 DOD_yugoslavia.41.a: "Kami akan mempertimbangkannya."
 DOD_yugoslavia.42.desc: "Perjanjian Munich mungkin berarti perdamaian di zaman kita – atau mungkin juga tidak. Jerman bukanlah satu-satunya negara yang berupaya mengubah perbatasan Eropa. Pemerintah [YUG.GetLeader] sejauh ini secara mengejutkan bersikap bungkam mengenai nasib pemasok utama persenjataan mereka.\n\nHal ini membuat beberapa orang di dinas diplomatik bertanya-tanya apakah Yugoslavia mengetahui apa yang akan terjadi, dan mungkin sebenarnya menyetujuinya.\n\nKita harus mempertimbangkan untuk mengingatkan mereka bahwa perjanjian apa pun dengan Jerman akan dianggap sebagai tindakan permusuhan jika perang pecah."
 DOD_yugoslavia.42.a: "Kirim Perwakilan Khusus."
 DOD_yugoslavia.42.b: "Mereka pasti masih shock."
 DOD_yugoslavia.43.desc: "Perwakilan Khusus telah tiba dari Inggris, di sini untuk mendiskusikan pendapat kami tentang Perjanjian Munich. Tampaknya [ENG.GetLeader] mengharapkan pernyataan dukungan yang lebih tegas dari kami selama ketakutan perang yang menyertai negosiasi. Nasib [CZE.GetNameDef], ia mengingatkan kita, terikat pada nasib kita sendiri. Jika [CZE.GetNameDef] jatuh ke tangan Jerman, kita akan semakin terisolasi di benua ini."
 DOD_yugoslavia.43.a: "Mereka hanya mencari pion baru."
 DOD_yugoslavia.44.desc: "Meskipun perang telah berkecamuk selama beberapa bulan, [YUG.GetLeader] masih menolak menyatakan diri di satu pihak, bahkan terus berdagang dengan Jerman dengan tetap memperhatikan netralitas yang ketat. Meskipun dukungan mereka terhadap Jerman mungkin tidak terlalu penting, kita harus memutuskan apakah kita ingin mengizinkan mereka mendukung negara yang sedang berperang dengan kita."
 DOD_yugoslavia.44.a: "Mereka harus membuat pilihan."
 DOD_yugoslavia.44.b: "Netralitas mereka lebih cocok untuk kita."
 DOD_yugoslavia.45.desc: "Duta Besar Inggris mengunjungi Kementerian Luar Negeri hari ini, menanyakan mengapa kami masih berdagang dengan Jerman. Pemerintah Inggris, kami diberitahu, menganggap hal ini sebagai tindakan bermusuhan, dan akan mempertimbangkan 'tindakan yang tepat' kecuali kami segera menghentikannya."
 DOD_yugoslavia.45.a: "Kita harus membuat pilihan."
 YUG_if_we_dont_side_with_britain_within_a_year_warning_tt: "§RJika kita tidak memihak [ENG.GetAdjective] dalam tahun mendatang, mereka mungkin melihat kita sebagai musuh.§!"
 DOD_yugoslavia.46.desc: "Tampaknya tekanan kami terhadap Yugoslavia tidak membuahkan hasil yang diharapkan. Daripada menghentikan perdagangan dengan Jerman atau menyatakan dukungan mereka terhadap tujuan sekutu, pemerintah [YUG.GetLeader] tetap berpegang pada netralitasnya dan menolak untuk mengalah. Akhir-akhir ini, MI6 menerima laporan bahwa pemerintah Yugoslavia mempertimbangkan untuk memberikan hak kepada Jerman untuk secara bebas memindahkan pasukan melalui negaranya."
 DOD_yugoslavia.46.a: "Mereka mungkin sudah menjadi musuh."
 DOD_yugoslavia.46.b: "Kita seharusnya tidak membuat lebih banyak musuh sekarang."
 DOD_yugoslavia.181.t: "Sentimen Komunis Menyebar di [This.GetNameDef]"
 DOD_yugoslavia.181.d: "Dengan berdirinya Kongres Pekerja Pan-Slavia, nampaknya banyak kelas pekerja [This.GetAdjective] mulai mendukung gagasan [This.GetNameDef] memasuki faksi tersebut sebagai negara komunis berdasarkan model [From.GetNameDef]. Meskipun gerakan ini masih kecil, banyak pejabat [This.GetAdjective] khawatir jika para aktivis ini tidak segera dihukum karena mempromosikan gagasan ini, [This.GetNameDef] mungkin akan menghadapi pemogokan nasional dan bahkan meningkatnya paramiliterisme sayap kiri."
 DOD_yugoslavia.182.t: "Propaganda Pan-Slavia"
 DOD_yugoslavia.182.d: "Di seluruh negara kita, para pendukung Kongres Pekerja Pan-Slavia mulai menghiasi jalan-jalan [This.Capital.GetName] dengan poster dan selebaran yang mempromosikan model [From.GetAdjective] untuk sosialisme. Mereka memuji [From.GetLeader] dan rezimnya dan percaya bahwa pemerintah [This.GetAdjective] akan mendapatkan manfaat dari reformasi sosial seperti yang terjadi di [From.GetNameDef]. Meskipun banyak yang menduga ini adalah upaya berani [From.GetLeader] untuk melemahkan kemerdekaan [This.GetAdjective], tidak dapat diabaikan bahwa propaganda ini mempunyai dampak yang cukup besar terhadap sikap rata-rata warga [This.GetAdjective] terhadap prospek komunisme dan persatuan aliansi Balkan."
 DOD_yugoslavia.183.t: "Milisi Pan-Balkan"
 DOD_yugoslavia.183.d: "Ketika sentimen komunis terus berkembang di negara kita, banyak kelompok paramiliter kecil mulai terbentuk di kalangan sayap kiri negara kita. Senjata-senjata yang dipermasalahkan tampaknya berasal dari Yugoslavia, dan banyak yang mencurigai [From.GetLeader] dan rezimnya mempunyai rencana untuk menggulingkan pemerintahan [This.GetAdjective] demi pemerintahan lain yang selaras dengan negara bagian [From.GetRulingIdeology] yang baru."
 DOD_yugoslavia.183.a: "Sebaiknya kita melangkah dengan hati-hati."
 DOD_yugoslavia.184.t: "Militan Komunis Menuntut Perubahan Rezim"
 DOD_yugoslavia.184.d: "Ketegangan antara pemerintah [This.GetAdjective] dan kaum tani telah mencapai titik didih, dengan banyak militan sayap kiri di seluruh negeri mempersenjatai diri dengan persenjataan yang diyakini diperoleh dari [From.GetNameDef]. Para petani kini menuntut agar [This.GetLeader] melepaskan kekuasaannya dan memberikan kekuasaan tersebut kepada rakyat yang ia wakili. Tuntutan mereka mengandung peringatan tersirat bahwa jika mereka tidak melakukan apa yang mereka minta, maka kaum tani akan mengangkat senjata atas nama pemerintahan [From.GetRulingIdeology] yang baru."
 DOD_yugoslavia.184.a: "Jika itu yang diinginkan masyarakat..."
 DOD_yugoslavia.184.b: "Basmi kelompok petani yang tidak dapat ditoleransi ini!"
 DOD_yugoslavia.50.t: "Gala Grosvenor"
 DOD_yugoslavia.50.desc: "Persoalan perkawinan dan suksesi di [YUG.GetName] sudah lama menjadi perbincangan kalangan politik. Lamanya waktu yang kita habiskan tanpa raja yang sah di atas takhta telah membuat beberapa orang mempertanyakan keabsahan pemerintahan Karađorđević. Namun, pada sebuah pesta baru-baru ini di London, hati Raja Peter muda dicuri oleh seorang wanita bangsawan cantik. Anggota kabinet kerajaan sudah mendiskusikan rencana pernikahan untuk mengamankan minat romantis Raja dengan pernikahan. Tidak diragukan lagi, siapa pun yang dinikahinya akan mempunyai pengaruh diplomatik jangka panjang terhadap bangsa kita dan mungkin mempengaruhi negara-negara lain mana yang bersedia bersekutu dengan Yugoslavia."
 DOD_yugoslavia.50.a: "Putri Alexandra dari Yunani memiliki hati seorang Raja."
 DOD_yugoslavia.50.b: "Putri Maria Francesca dari Italia."
 DOD_yugoslavia.50.c: "Putri Alexandrine dari Jerman."
 DOD_yugoslavia.50.d: "Adelheid von Habsburg."
 DOD_yugoslavia.50.e: "Putri Marie-Françoise dari Spanyol."
 DOD_yugoslavia.501.t: "[From.GetNameDefCap] Mencari Ratu"
 DOD_yugoslavia.501.desc: "Karađorđević dari [From.GetNameDef] berusaha untuk melanjutkan keberadaan garis keturunan kerajaan dan bangsanya melalui pernikahan kerajaan. Tampaknya [From.GetLeader] menjadi sangat tergila-gila dengan [Root.GetPrincessName], seorang bangsawan dari keluarga [Root.GetFamilyName] dan telah melamarnya. Jika wanita muda itu menerima, [From.GetNameDef] dan [Root.GetNameDef] harus disatukan dalam darah. Meskipun hal ini tidak serta merta menghasilkan aliansi bersama [From.GetAdjective]-[Root.GetAdjective], hal ini akan mendorong hal tersebut menjadi mungkin dalam waktu dekat."
 DOD_yugoslavia.501.a: "Pernikahan terdengar menakjubkan!"
 DOD_yugoslavia.501.b: "[Root.GetPrincessName] tidak akan pernah menikah [From.GetLeader]!"
 italian_princess_name: "Putri Maria"
 german_princess_name: "Putri Alexandrina"
 hungarian_princess_name: "Adipati Agung Adelheid"
 spanish_princess_name: "Putri Marie-Françoise"
 italian_dynasty_name: "Savoy"
 german_dynasty_name: "Hohenzollern"
 hungarian_dynasty_name: "Habsburg"
 spanish_dynasty_name: "Bourbon"
 DOD_yugoslavia.19.t: "Raja Peter Sudah Dewasa!"
 DOD_yugoslavia.19.desc: "Naik takhta jauh sebelum masanya karena kondisi konflik global yang mengerikan, Raja [Root.GetLeader] akhirnya mencapai usia dewasa dan membuktikan dirinya sebagai pemimpin yang bijaksana dan kompeten. Dengan pewaris sah takhta yang cukup umur, masyarakat [YUG.GetNameDef] akhirnya mendapatkan simbol identitas nasional mereka untuk didukung dan diperjuangkan."
 DOD_yugoslavia.19.a: "Hidup Raja!"
 DOD_yugoslavia.502.t: "[From.GetPrincessName] Menerima!"
 DOD_yugoslavia.502.desc: "Raja muda [Root.GetLeader] telah menyatakan cinta dan pengabdiannya kepada [From.GetPrincessName] di depan umum melalui ikatan suci pernikahan dalam sebuah upacara yang diadakan di [Root.GetLondonBelgrade] di hadapan penonton yang bersorak-sorai, menyaksikan kisah cinta dongeng dari dua kekasih yang dipertemukan di saat krisis. [Root.GetWeddingGoodBad] Meskipun pernikahan ini tidak memperkuat terciptanya aliansi formal [yugoslavia_wedding_partner.GetAdjective]-[Root.GetAdjective], nampaknya pada titik ini sudah ada kepastian bahwa kerja sama antara negara-negara ini tidak berakhir di sini."
 DOD_yugoslavia.502.a: "Romantis sekali!"
 YUG_wedding_bad: "Namun, ketika kembali ke negaranya pada [Root.GetNameDef], raja muda ini menghadapi banyak kritik dari media konservatif [Root.GetAdjective] karena memilih untuk menikah pada saat krisis besar bagi negaranya."
 YUG_wedding_good: "Dari Beograd hingga Bukares, seluruh wilayah Balkan bersatu merayakan kegigihan raja [Root.GetAdjective] dalam menghadapi malapetaka yang semakin besar."
 DOD_yugoslavia.503.t: "[From.GetPrincessName] Menolak!"
 DOD_yugoslavia.503.desc: "Meskipun Raja [Root.GetLeader] menyatakan cintanya benar, putri asing impiannya tetap tidak tergerak oleh kegilaannya. Setelah berminggu-minggu pacaran dan percintaan yang intens, [From.GetPrincessName] telah menolak lamaran pernikahan Raja dan keputusannya datang dengan persetujuan publik dari pemerintah [From.GetAdjective]. Meski jelas patah hati karena rasa sayang yang dicemoohnya, Raja tetap bertekad bahwa suatu hari nanti dia akan menemukan ratu yang cocok untuk Kerajaannya."
 DOD_yugoslavia.503.a: "Mungkin Putri Alexandra yang baik hati..."
 DOD_yugoslavia.60.t: "Penobatan"
 DOD_yugoslavia.60.peter: "Untuk pertama kalinya sejak awal abad ke-20, [YUG.GetNameDef] menyaksikan penobatan rajanya di Katedral Beograd dalam acara yang agak sekuler, yang mencerminkan keragaman agama yang ada di negara Yugoslavia modern. Meskipun beberapa orang akan membantah kemampuan Raja Peter yang masih muda untuk memerintah di usia yang begitu muda, mahkota kini ada di kepalanya dan baik atau buruk, masa depan Yugoslavia ada di tangan [YUG.GetLeader.GetHerHis]."
 DOD_yugoslavia.60.paul: "Untuk pertama kalinya sejak awal abad ke-20, [YUG.GetNameDef] menyaksikan penobatan rajanya di Katedral Beograd dalam upacara tradisional Ortodoks Serbia. Meski banyak yang masih melihat Raja Paul sebagai perampas kekuasaan dan lebih merupakan diktator fasis daripada Raja yang layak, mahkota kini ada di kepalanya dan baik atau buruk, masa depan Yugoslavia ada di tangan [YUG.GetLeader.GetHerHis]."
 DOD_yugoslavia.60.a: "Hidup Raja!"
 DOD_yugoslavia.70.t: "[FROM.GetNameDefCap] Berusaha Menandatangani Pakta Tripartit"
 DOD_yugoslavia.70.desc: "Sebuah telegram tiba dari [From.GetLeader] hingga [Root.Capital.GetName] hari ini menyatakan minatnya untuk menandatangani pakta non-agresi dengan kekuatan fasis dunia. Takut akan invasi [SOV.GetAdjective] dan tumbuhnya nasionalisme di negara [From.GetLeader.GetHerHis], [From.GetLeader] berupaya menyelaraskan [From.GetLeader.GetHerselfHimself] dengan [Root.GetNameDef]. Meskipun hal ini tidak menandakan suatu aliansi resmi, namun hal ini membawa [From.GetNameDef] ke dalam lingkup pengaruh kita dan akan mempercepat proses masuknya [From.GetAdjective] ke dalam [Root.GetFactionName]."
 DOD_yugoslavia.70.a: "Kami setuju."
 DOD_yugoslavia.70.b: "Kami memiliki visi lain untuk [FROM.GetNameDef]."
 DOD_yugoslavia.701.t: "[FROM.GetNameDefCap] Benda!"
 DOD_yugoslavia.701.tripartite_rejection: "[FROM.GetLeader] telah menanggapi usulan [ROOT.GetAdjective] untuk menandatangani Pakta Tripartit dengan pemberhentian, dengan menyatakan bahwa mereka memiliki \"ide lain\" untuk masa depan negara kita."
 DOD_yugoslavia.701.allied_objection: "Keputusan untuk menandatangani Pakta Tripartit telah sangat kontroversial baik di dalam maupun di luar negara kita dan telah menghilangkan legitimasi hak [ROOT.GetLeader] untuk bertindak sebagai wali Raja Peter II, atau bahkan jika kabupaten tersebut diperlukan. Sekelompok perwira dari Tentara Kerajaan Yugoslavia telah menyatakan Peter II sudah cukup umur dan, dengan dukungan [From.GetAdjective], berbaris ke Beograd dan menuntut agar [ROOT.GetLeader] segera disingkirkan dari kekuasaan."
 DOD_yugoslavia.701.a: "Kami tidak punya pilihan selain menerima."
 DOD_yugoslavia.701.b: "Untuk mempersenjatai!"
 DOD_yugoslavia.702.t: "[YUG.GetNameDefCap] Menandatangani Pakta Tripartit"
 DOD_yugoslavia.702.desc: "Pemerintah [YUG.GetAdjective] hari ini telah bergabung dengan negara-negara fasis dalam menandatangani Pakta Tripartit. Meskipun hal ini belum menandakan bahwa [YUG.GetNameDef] telah bergabung dengan [From.GetFactionName], hal ini menunjukkan semakin besarnya kesetiaan antara kedua negara dan bahwa [YUG.GetLeader] mungkin mempunyai simpati terhadap fasis. Banyak yang mengharapkan tanggapan [Root.GetAdjective] terhadap perkembangan yang mengkhawatirkan ini, namun [Root.GetLeader] sejauh ini tetap bungkam mengenai masalah ini…"
 DOD_yugoslavia.702.a: "[YUG.GetLeader] adalah pengecut yang tidak sah!"
 DOD_yugoslavia.702.b: "Saya rasa tidak perlu peduli."
 DOD_yugoslavia.80.t: "Zara untuk Aliansi"
 DOD_yugoslavia.80.desc: "[From.GetLeader] hari ini mengumumkan bahwa [From.GetNameDef] bersedia untuk bersekutu dengan [Root.GetNameDef] dan secara resmi memasuki [Root.GetFactionName] tetapi hanya sebagai imbalan atas penarikan kami dari Balkan dalam bentuk penyerahan kendali kami atas [163.GetName]."
 DOD_yugoslavia.80.a: "Kedengarannya adil."
 DOD_yugoslavia.80.b: "Mereka seharusnya menyerahkan [103.GetName] sebagai gantinya."
 DOD_yugoslavia.801.t: "[From.GetNameDefCap] Tuntutan [103.GetName]!"
 DOD_yugoslavia.801.desc: "Delegasi kami tampaknya tidak diterima dengan baik di [From.GetNameDef] karena duta besar malah merespons dengan meminta [103.GetName] dari kami sebagai imbalan atas keanggotaan [From.GetFactionName]."
 DOD_yugoslavia.801.a: "Baiklah..."
 DOD_yugoslavia.801.b: "Sama sekali tidak."
 DOD_yugoslavia.802.t: "[From.GetNameDefCap] Menerima!"
 DOD_yugoslavia.802.desc: "Perselisihan di perbatasan dengan [From.GetNameDef] akhirnya akan terselesaikan karena pemerintah [From.GetAdjective] telah setuju untuk mengembalikan wilayah Dalmatian yang saat ini berada di bawah pendudukan [From.GetAdjective] kembali ke kendali Yugoslavia mereka yang sah. [Root.GetLeader] hari ini mendeklarasikan [From.GetLeader] sebagai sahabat sejati [Root.GetAdjective] kebebasan dan penentuan nasib sendiri, dan kedua negara kini bergerak maju sebagai sekutu."
 DOD_yugoslavia.802.a: "Persis seperti yang direncanakan."
 czech.1.t: "Keanggotaan Komintern"
 czech.1.d: "Hubungan kami dengan Ceko sempat buruk pada masa lalu, namun belakangan ini politik mereka telah berubah tajam ke arah sisi kanan dalam sejarah. Ditambah dengan meningkatnya tekanan dari Jerman dan kurangnya kepercayaan terhadap kemampuan negara-negara demokrasi Barat dalam melindungi mereka, muncullah permintaan resmi untuk bergabung dengan Komintern."
 czech.1.a: "Mereka sangat diterima."
 czech.1.b: "Mereka belum siap."
 czech.2.d: "[SOV.GetLeader] telah menerima permintaan kami untuk bergabung dengan Komintern. Delegasi kami telah bergabung dengan Komite Eksekutif dengan hak suara penuh."
 czech.3.d: "[SOV.GetLeader] telah menolak permintaan kami untuk bergabung dengan Komintern, tanpa memberikan alasan apapun."
 czech.3.a: "Begitu banyak untuk ikatan Slavia kita..."
 czech.4.t: "Masalah Rumania"
 czech.4.d: "Hubungan dengan Rumania selalu tegang karena pendudukan mereka atas wilayah sah kami, Bessarabia, namun seolah-olah itu belum cukup, seluruh negara menghalangi kemampuan kami untuk membantu sekutu [From.GetNameAdj] kami. Sekutu yang sama kini telah mengusulkan solusi: Pisahkan Rumania di antara kita untuk menyelesaikan masalah ini untuk selamanya!"
 czech.4.a: "Cemerlang dalam kesederhanaannya."
 czech.4.b: "Kami akan mencari solusi lain."
 czech.5.d: "[From.GetNameDefCap] telah menyetujui solusi kami untuk masalah Rumania. Militer sudah siap, dan kampanye dapat dimulai sesuai kebijaksanaan kita."
 czech.6.d: "[From.GetLeader] telah menolak usulan kami mengenai masalah Rumania. Tampaknya dia masih punya rencana ke Rumania."
 czech.6.a: "Itu layak untuk dicoba."
 czech.7.t: "Situasi Polandia"
 czech.7.d: "Sejak awal upaya kami untuk membebaskan para pekerja di seluruh dunia, Polandia hanyalah sebuah masalah. Sekarang sekutu [From.GetNameAdj] kita telah membuat proposisi yang menarik: Polandia telah mengambil tanah dari kedua negara kita, jadi mengapa tidak membalas budi dan membagi Polandia di antara kita?"
 czech.7.a: "Mengapa tidak?"
 czech.8.d: "[From.GetNameDefCap] telah menyetujui usulan solusi kami untuk Situasi Polandia. Kami akan mulai beroperasi segera setelah perintah diberikan."
 czech.9.d: "[From.GetNameDefCap] belum menyetujui usulan kami. Kita harus menunggu waktu dan mempertimbangkan pilihan lain."
 czech.10.d: "Sejak berakhirnya Perang Besar, Polandia telah menduduki wilayah Jerman. Seolah-olah itu belum cukup, mereka terus-menerus menyerang tetangganya untuk memperluas wilayahnya secara agresif. Sekutu [From.GetNameAdj] kami sampai pada kesimpulan yang sama dengan kami: Untuk menjamin perdamaian di Eropa, negara Polandia harus dilenyapkan."
 czech.10.a: "Mari kita mulai."
 czech.11.d: "[From.GetNameDefCap] telah menyetujui rencana kami untuk menghadapi Situasi Polandia. Kita bisa menyerang segera setelah persiapan selesai."
 czech.12.d: "[From.GetNameDefCap] telah menolak solusi kami terhadap Situasi Polandia. Waktu akan memberi tahu jika ada peluang lain yang muncul."
 czech.14.t: "Pemberontakan Slovakia"
 czech.14.d: "Sejak kami menyingkirkan mereka dari pemerintahan, para Pemimpin Slovakia dipenuhi kebencian dan menghasut masyarakat untuk melakukan kekerasan. Saat ini, perkataan mereka akhirnya berhasil mewujudkan perang yang sangat mereka inginkan. Pemberontakan Slovakia telah dimulai."
 czech.14.a: "Jika mereka menginginkan perang, maka mereka akan melakukannya."
 czech.15.d: "Benteng terakhir kekuasaan Slovakia telah hancur. Pemberontakan sudah berakhir."
 czech.15.a: "Kemenangan!"
 czech.16.t: "Ceko di Poros?"
 czech.16.d: "Meskipun pada awalnya merasa was-was, Ceko menganggap Bolshevisme sebagai ancaman yang sebenarnya, dan kini meminta untuk bergabung dengan kekuatan Poros. Pemerintah [CZE.GetLeader] secara khusus menyatakan bahwa hal ini tidak berdampak pada permasalahan Sudetenland dengan cara apa pun."
 czech.17.d: "[From.GetNameDefCap] telah menerima permintaan kami untuk bergabung dengan Axis!"
 czech.17.a: "Bagus sekali!"
 czech.18.d: "[From.GetNameDefCap] telah menolak permintaan kami untuk bergabung dengan Axis!"
 czech.18.a: "Sulit."
 czech.19.t: "Aib Sebelum Kematian"
 czech.19.d: "Pemerintah [From.GetLeader] telah menyadari apa yang telah kita ketahui selama ini: [From.GetNameDef] hanya dapat terus ada di bawah perlindungan kita. Meskipun hal ini menghalangi kemungkinan untuk menduduki tanah mereka secara langsung, akan lebih baik jika memiliki sekutu yang bersedia, dan menghindari campur tangan pihak asing."
 czech.20.t: "Aib Sebelum Kematian"
 czech.20.d: "[From.GetLeader] telah menerima tawaran kami. Seorang yang berkuasa penuh [From.GetAdjective] telah tiba di Praha untuk mengoordinasikan kebijakan."
 czech.20.a: "Itu satu-satunya cara."
 czech.21.t: "Aib Sebelum Kematian"
 czech.21.d: "Ketika proposal kami diajukan, [From.GetLeader] dilaporkan berseru \"Tidak dalam Seribu Tahun!\", sebelum melontarkan omelan panjang lebar tentang inferioritas rakyat kami, sistem pemerintahan kami, dan kualitas kepemimpinan [CZE.GetLeader]. Tidak ada penolakan resmi yang disampaikan, namun duta besar kami tidak menaruh harapan besar."
 czech.21.a: "Mungkin ini yang terbaik."
 czech.22.t: "Pertanyaan Sudeten"
 czech.22.d: "Pemerintah [From.GetNameDef] telah menawarkan Sudetenland sebagai langkah menuju pemahaman bersama. Di satu sisi, ini adalah peluang besar untuk memperoleh negara kaya dengan sedikit biaya dan sedikit bahaya. Di sisi lain, menciptakan krisis di Sudetenland akan menjadi peluang bagus untuk menunjukkan kepada dunia bahwa negara-negara yang disebut sebagai Kekuatan Besar yang memegang Perjanjian Versailles adalah negara-negara yang ompong dan inferior secara moral."
 czech.23.d: "[From.GetNameDefCap] telah menerima tawaran kami. [From.GetAdjective] pasukan telah pindah ke Sudetenland dan mendapat dukungan dari penduduk setempat."
 czech.23.a: "Tentu saja mereka tidak bisa bertanya lagi."
 czech.24.d: "[From.GetLeader] telah menolak tawaran kami untuk menyerahkan Sudetenland. Dia tidak memberikan alasan apa pun atas tindakan ini, namun keputusan [From.GetAdjective] telah menimbulkan kejutan di kalangan militer, yang percaya bahwa Jerman mungkin mempunyai rencana yang lebih besar untuk kita."
 czech.24.a: "Tunggu dan lihat."
 czech.25.t: "Yugoslavia di Entente"
 czech.25.d: "Pemerintahan [From.GetNameDef] telah memutuskan untuk menegaskan kembali aliansi 'Entente Kecil', yang telah berakhir dalam beberapa tahun terakhir karena semakin besarnya pengaruh Jerman. Menteri luar negeri mereka baru-baru ini berada di ibu kota kami untuk membahas apakah kami tertarik untuk bergabung dengan aliansi tersebut sebagai anggota tetap."
 czech.26.d: "[From.GetName] telah setuju untuk bergabung dengan Entente. Delegasi militer telah tiba untuk membahas pengaturan pertahanan."
 czech.27.d: "Meskipun [From.GetLeader] setuju untuk bertemu dengan delegasi kami, sejauh ini dia menolak komitmen negaranya untuk bergabung dengan Entente. [From.GetAdjective] tampaknya khawatir bahwa bergabung dengan aliansi kami akan mengganggu stabilitas keseimbangan kekuatan di wilayah tersebut."
 czech.28.t: "Rumania di Entente"
 czech.32.t: "Pemulihan Hubungan Ceko-Hongaria"
 czech.32.d: "Entente yang dipimpin oleh [From.GetNameDef] telah lama bertujuan untuk membendung bangsa kita. Namun seiring berkembangnya kekuatan Jerman, [From.GetNameDef] merasa semakin terancam dari arah tersebut. Tak mau menghadapi ancaman dari kedua belah pihak, [From.GetLeader] kini berupaya mencapai kesepahaman dengan kami.\n\nPemerintah kita terpecah dalam masalah ini. Satu faksi percaya bahwa kesepakatan dengan [From.GetNameDef] adalah langkah pertama untuk menghancurkan pengepungan, sementara faksi lainnya berpendapat bahwa hal ini pasti akan mengundang kemarahan [GER.GetLeader]."
 czech.32.a: "Kami menerima tawaran mereka."
 czech.32.b: "Tidak pernah!"
 czech.33.d: "[From.GetLeader] secara mengejutkan terbuka terhadap tawaran kami. Kami telah menandatangani Perjanjian Persahabatan Bersama, yang menegaskan bahwa tidak satu pun dari kami memiliki klaim teritorial terhadap satu sama lain."
 czech.33.a: "Lebih baik dari yang diharapkan!"
 czech.34.d: "Yang mengejutkan sedikit orang, [From.GetLeader] telah menolak tawaran kami, dengan alasan keengganan kami untuk menyerahkan wilayah tertentu ke Hongaria."
 czech.34.a: "Kalau begitu, tidak ada yang baru."
 dod_news.1.t: "Entente Kecil Ditegaskan Kembali"
 dod_news.1.d: "[From.GetName] hari ini mengumumkan bahwa sistem aliansi 'Little Entente' yang hampir mati akan mempertahankan komitmen mereka. Pernyataan yang dikeluarkan oleh [From.GetNameAdj] Kantor Luar Negeri mengumumkan:\n'[From.GetName] bukanlah Kekuatan Besar, tetapi merupakan Kekuatan Regional. Kami sangat yakin bahwa aliansi Kekuatan Regional dapat dan akan mencegah negara-negara yang disebut Kekuatan Besar untuk ikut campur dalam urusan kami."
 dod_news.1.a: "Bersama-sama kita adalah Kekuatan Besar."
 dod_news.1.b: "Saran yang menarik."
 dod_news.1.c: "Kami belum lupa siapa yang dilawan."
 dod_news.1.e: "Kami akan segera menyelesaikannya, jika perlu."
 dod_news.1.f: "Perkembangan yang menarik!"
 dod_news.2.a: "Kami akan berjuang bersama sekutu baru kami sampai akhir."
 dod_news.2.b: "Mereka telah membuat pilihan yang bijaksana."
 dod_news.2.c: "Berita yang paling meresahkan..."
 dod_news.2.t: "[CZE.GetName] bergabung dengan Poros"
 dod_news.2.d: "Mengejutkan sebagian besar Eropa, [CZE.GetName] telah menandatangani perjanjian Aliansi dengan [GER.GetNameDef]. [CZE.GetName], yang sebelumnya sangat demokratis, kini semakin bergerak ke arah sayap kanan dalam beberapa bulan terakhir."
 dod_news.3.t: "[CZE.GetName] bergabung dengan Komintern"
 dod_news.3.d: "Mengejutkan sebagian besar Eropa, [CZE.GetName] telah menandatangani perjanjian Aliansi dengan [SOV.GetNameDef]. [CZE.GetName], yang sebelumnya sangat demokratis, kini semakin bergerak ke arah Kiri dalam beberapa bulan terakhir."
 dod_news.4.t: "[CZE.GetName] menyerahkan Sudetenland"
 dod_news.4.d: "Dalam sebuah tindakan yang mengejutkan banyak orang, [CZE.GetName] hari ini secara sepihak menyerahkan wilayah Sudetenland kepada Jerman. Ketika ditanyai, sumber di [CZE.GetName] Kantor Luar Negeri menjawab bahwa 'Sudah jelas ke arah mana angin bertiup, ini adalah satu-satunya jalan menuju kelangsungan hidup nasional.'\n\nSeorang menteri Perancis yang tidak disebutkan namanya dilaporkan mengecam tindakan [CZE.GetNameAdj], mengklaim bahwa Barat akan mendukung [CZE.GetName] seandainya Jerman menekan mereka."
 dod_news.4.a: "Tidak ada pilihan lain."
 dod_news.4.b: "Melalui pandangan mereka ke depan, mereka mencegah krisis."
 dod_news.4.c: "Mereka memilih dengan bijak."
 dod_news.4.e: "Bisakah kita melakukan sesuatu?"
 DOD_romania.999.t: "Sebuah Penghormatan untuk Cinta"
 DOD_romania.999.desc: "Raja Carol II yang sangat mabuk dan emosional membajak pertemuan strategi hari ini, meminta perhatian semua orang pada ide 'cemerlang' yang ia dapatkan pada malam sebelumnya.\n\nBenar-benar seorang yang berjiwa romantis, Raja menyatakan dengan berlinang air mata bahwa ia berharap para wanita dalam hidupnya mengetahui cinta yang intens dan sejati yang ia rasakan terhadap mereka. Berbicara kepada para Kepala Staf dan Kabinet dengan monolog yang panjang, meskipun agak tidak jelas, ia menghimbau kepekaan mereka yang paling halus dan menyentuh hati, hanya untuk mengakhirinya dengan sungguh-sungguh menyerukan penggantian nama dua kota besar musuh sebagai penghormatan terhadap perasaan terbesar dan terdalam yang diketahui manusia; love.\n\nRaja jelas-jelas telah terpaku sepenuhnya pada gagasan ini dalam pikirannya, dan dia sangat tidak mungkin untuk mengalah dengan mudah jika kita ingin mencegahnya."
 DOD_romania.a: "Dia benar-benar jenius yang diturunkan dari surga!"
 DOD_romania.b: "Adakan pesta untuk mengalihkan perhatiannya. Yang -sangat- besar."
 DOD_romania.16.t: "[FROM.GetNameDefCap] Berusaha Bergabung dengan [ROOT.GetFactionName]"
 DOD_romania.16.desc: "Meskipun saat ini sejalan dengan [romania_former_ally_target.GetNameDef], perubahan dalam pemerintahan [FROM.GetAdjective] telah membuat negara ini lebih sejalan dengan cita-cita [ROOT.GetAdjective] dan [FROM.GetLeader] telah menyatakan minatnya untuk bergabung dengan [ROOT.GetFactionName]. Ini adalah kesempatan bersejarah, ketika musuh membelakangi [FROM.GetNameDef], hal terakhir yang mereka harapkan adalah pasukan [FROM.GetAdjective] mengarahkan senjatanya ke arah mereka."
 DOD_romania.16.a: "Selamat datang, [FROM.GetAdjective] teman-teman!"
 DOD_romania.161.t: "[FROM.GetNameDefCap] Mengkhianati [ROOT.GetNameDef]!"
 DOD_romania.161.desc: "Sayangnya, menteri luar negeri [FROM.GetAdjective] telah menyampaikan pesan [FROM.GetNameDef] yang, tanpa diragukan lagi, merupakan pengkhianatan terhadap cita-cita [ROOT.GetFactionName] dan [ROOT.GetRulingIdeology]! [FROM.GetNameDefCap] telah menyatakan bahwa dia sekarang akan bertarung untuk [romania_new_ally_target.GetFactionName]."
 DOD_romania.161.a: "Kita seharusnya tahu [FROM.GetLeader] tidak bisa dipercaya!"
 DOD_romania.162.t: "[romania_new_ally_target.GetNameDefCap] Menerima!"
 DOD_romania.162.desc: "Kami telah diberitahu bahwa [romania_new_ally_target.GetNameDef] telah menerima permintaan kami untuk masuk ke [romania_new_ally_target.GetFactionName] dan segera, [romania_former_ally_target.GetLeader] akan mempelajari bagaimana seorang prajurit [ROOT.GetAdjective] sejati bertarung."
 DOD_romania.162.a: "Untuk mempersenjatai!"
 DOD_romania.601.t: "[FROM.GetName] Berusaha Memecah [YUG.GetNameDef]"
 DOD_romania.601.desc: "Melihat perselisihan internal yang menjadi ciri [YUG.GetNameDef], [ROM.GetLeader] memutuskan untuk melanjutkan kebijakan [ROM.GetLeader.GetHerHis] Dominasi Balkan dengan membagi rakyat Yugoslavia di antara beberapa kekuatan lokal. [Root.GetNameDefCap] termasuk di antara negara-negara yang diundang untuk memecah belah Yugoslavia, dan meskipun ini merupakan peluang menarik untuk memperluas wilayah Balkan, kami wajib ikut serta dalam konflik jika Yugoslavia menolak ultimatum tersebut."
 DOD_romania.601.a: "Ide yang bagus!"
 DOD_romania.601.b: "Mungkin kita harus menghindari hal ini."
 invited_to_split_yugo: "Menerima undangan untuk membagi Yugoslavia"
 strongest_claimant_ROM: "§YRumania§! memiliki klaim terkuat"
 strongest_claimant_GER: "§YJerman§! memiliki klaim terkuat"
 strongest_claimant_ITA: "§YItalia§! memiliki klaim terkuat"
 strongest_claimant_HUN: "§YHongaria§! memiliki klaim terkuat"
 DOD_romania.163.t: "Codreanu Meninggal"
 DOD_romania.163.desc: "Codreanu merupakan ancaman bagi masa depan negara Rumania. Tindakannya yang ceroboh menjadi alasan penangkapan, demi stabilitas. Kematiannya akan menjadi pengingat berharga bahwa seseorang dapat memilih untuk menjadi teladan yang baik, atau peringatan yang buruk. Pemimpin yang lebih terukur dan bertanggung jawab menunggu kaum fasis di Rumania."
 DOD_romania.163.a: "Hilang, tapi tidak dilupakan."
