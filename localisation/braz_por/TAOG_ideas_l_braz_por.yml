  AST_unratified_westminster_act_idea: "Undang-Undang Westminster yang Belum Diratifikasi"
  AST_unratified_westminster_act_idea_desc: "Statuta Westminster disahkan pada tahun 1931, yang memungkinkan Dominion [ENG.GetNameDef] yang memiliki pemerintahan sendiri untuk meningkatkan kedaulatan mereka. Jika kami meratifikasinya, sebagian besar wewenang Parlemen Inggris untuk membuat undang-undang [AST.GetName] akan dihapuskan."
  AST_australian_war_cabinet_idea: "Kabinet Perang Australia"
  AST_australian_war_cabinet_idea_tt: "Setelah berperang, §Y$AST_australian_war_cabinet_idea$§! akan dimodifikasi oleh:\n§Y2§! offmap §Y$arms_factory$§!"
