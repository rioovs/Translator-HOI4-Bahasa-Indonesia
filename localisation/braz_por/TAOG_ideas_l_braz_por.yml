  idea_SIA_agricultural_tax_reduction: "Pengurangan Pajak Pertanian"
  idea_SIA_agrarian_economical_policy: "Kebijakan Ekonomi Agraria"
  idea_SIA_contingency_funds: "Dana Darurat"
  idea_SIA_agrarian_economical_policy_modify: "Memodifikasi §Y$idea_SIA_agrarian_economical_policy$§! dengan:"
  idea_SIA_farmers_moving_to_bangkok_good: "Petani pindah ke Bangkok"
  idea_SIA_farmers_moving_to_bangkok_bad: "$idea_SIA_farmers_moving_to_bangkok_good$"
  idea_SIA_irrigation: "Irigasi"
  idea_SIA_debt_repayment: "Pelunasan Hutang"
  idea_SIA_debt_repayment_desc: "Dampak dari program belanja defisit sudah mulai terasa. Pendapatan dialihkan ke kreditor, dan kecepatan pembangunan yang sebelumnya memungkinkan pinjaman tidak lagi dapat dipertahankan."
  idea_SIA_an_unceasy_alliance: "Aliansi yang Tidak Nyaman"
  idea_SIA_an_unceasy_alliance_desc: "Aliansi ini bertahan, namun ketegangan mulai terlihat. Keraguan dalam pemerintahan diam-diam menarik negara ini ke arah yang lebih netral."
  idea_SIA_rural_support: "Dukungan Pedesaan"
  idea_SIA_the_sacred_hierarchy: "Hierarki Suci"
  idea_SIA_order_discipline_and_unity: "Ketertiban, Disiplin dan Persatuan"
  idea_SIA_constitutional_virtue: "Kebajikan Konstitusional"
  idea_SIA_an_absolute_monarchy: "Monarki Absolut"
  idea_SIA_an_absolute_monarchy_desc: "Semua otoritas politik berada di tangan mahkota. Perkataan raja adalah hukum, perbedaan pendapat dapat ditindas, dan seluruh prestise kerajaan diserahkan kepada mobilisasi nasional. Tahta memerintahkan kesetiaan, dan tentara adalah instrumennya."
  idea_SIA_a_constituional_monarchy: "Monarki Konstitusional"
  idea_SIA_a_constituional_monarchy_desc: "Kerangka konstitusional mendefinisikan batas-batas kekuasaan kerajaan dan menjamin hak-hak rakyat. Dengan mahkota sebagai simbol pemersatu dan bukan sebagai otoritas absolut, negara ini tumbuh lebih stabil, lebih terbuka terhadap ide-ide baru, dan lebih selaras dengan dunia demokrasi."
  idea_SIA_restoring_order: "Memulihkan Ketertiban"
  idea_SIA_japanese_fighter_instruction: "Instruksi Pesawat Tempur Jepang"
  idea_SIA_japanese_fighter_instruction_desc: "Instruktur dari Angkatan Udara Kekaisaran Jepang sedang melatih pilot kami dan membimbing para insinyur kami melalui desain pesawat tempur mereka sendiri. Apa yang mereka tinggalkan di buku catatan kita akan bertahan lebih lama dari masa tinggal mereka."
  idea_SIA_military_expansion_costs: "Biaya Ekspansi Militer"
  idea_SIA_a_modern_economy: "Perekonomian Modern"
  idea_SIA_death_to_communists: "Kematian bagi Komunis"
  idea_SIA_death_to_communists_desc: "Semangat anti-komunis menjalar ke seluruh jajaran, memberikan kekuatan kita keunggulan melawan tentara komunis Tiongkok."
  idea_SIA_death_to_nationalists: "Kematian bagi kaum Nasionalis"
  idea_SIA_death_to_nationalists_desc: "Sentimen anti-nasionalis menjalar ke seluruh jajaran, memberikan kekuatan kita keunggulan melawan tentara nasionalis Tiongkok."
  idea_SIA_breaking_the_burmese_line: "Melanggar Garis Burma"
  idea_SIA_the_yellow_dossier: "Berkas Kuning"
  idea_SIA_the_yellow_dossier_desc: "Sebuah laporan rahasia mengenai keadaan industri dalam negeri telah memaksa kita untuk memperhitungkan inefisiensi yang sudah mengakar. Reformasi yang dituntut telah membuahkan hasil di pabrik-pabrik kita, meskipun gangguan yang diakibatkannya bukannya tanpa konsekuensi."
  idea_SIA_the_yellow_dossier_2: "$idea_SIA_the_yellow_dossier$"
  idea_SIA_the_yellow_dossier_2_desc: "$idea_SIA_the_yellow_dossier_desc$"
  idea_SIA_pacific_war_preparations: "Persiapan Perang Pasifik"
  idea_SIA_a_race_against_time: "Perlombaan Melawan Waktu"
  idea_SIA_overheated_economy: "Ekonomi yang Terlalu Panas"
  idea_SIA_overheated_economy_desc: "Perekonomian telah didorong melampaui batas alaminya. Permintaan konsumen telah melampaui kapasitas dan booming konstruksi terhenti sementara keadaan menjadi lebih tenang."
  idea_SIA_ending_military_grift: "Mengakhiri Grift Militer"
  idea_SIA_the_military_oversight_bureau: "$SIA_military_oversight_bureau$"
  idea_SIA_the_military_oversight_bureau_desc: "Biro Pengawasan Militer menetapkan standar yang lebih tinggi bagi komandan baru dan mempercepat pengembangan keahlian di seluruh korps perwira."
  idea_SIA_public_credit_debt: "Hutang Kredit Publik"
  idea_SIA_public_credit_debt_desc: "Kewajiban kredit negara terus-menerus menguras perekonomian, menghabiskan sumber daya yang seharusnya mengalir ke produksi dan barang-barang sipil."
  idea_SIA_public_credit_debt_2: "$idea_SIA_public_credit_debt$ Pelunasan"
  idea_SIA_public_credit_debt_2_desc: "$idea_SIA_public_credit_debt_desc$"
  idea_SIA_revision_of_unequal_treaties: "Revisi Perjanjian yang Tidak Setara"
  idea_SIA_purged_military: "Militer yang Dibersihkan"
  idea_SIA_purged_military_desc: "Pemecatan para perwira yang dianggap tidak dapat diandalkan secara politik telah menyebabkan militer kekurangan kepemimpinan yang berpengalaman, sehingga menghambat organisasi dan pengembangan pasukan yang tersisa."
  SIA_khana_ratsadon_inlay_title: "Khana Ratsadon"
  SIA_civilian_wing_label: "Sayap Sipil"
  SIA_military_wing_label: "Sayap Militer"
  SIA_wing_state_full_support: "§GDukungan Penuh§!"
  SIA_wing_state_slight_support: "§GSedikit Dukungan§!"
  SIA_wing_state_neutral: "§YNetral§!"
  SIA_wing_state_opposition: "§RDalam Oposisi§!"
  SIA_wing_state_rebellious: "§RPemberontak§!"
  SIA_civilian_wing_history_tt: "Faksi sipil Khana Ratsadon dipimpin oleh administrator dan teknokrat progresif, terutama di antara mereka §YPridi Phanomyong§!. Setelah belajar hukum di Prancis, Pridi kembali dengan ambisi untuk reformasi tanah, perencanaan ekonomi negara, dan demokrasi konstitusional yang benar-benar akan memberdayakan rakyat biasa.\n\nSayap sipil secara luas §Gpro-pembangunan§!, mendukung investasi di bidang pendidikan, infrastruktur, dan industri. Mereka skeptis terhadap belanja militer yang besar dan khawatir terhadap kecenderungan menuju kekuasaan yang kuat. Dukungan mereka paling mudah diperoleh melalui kebijakan yang memodernisasi negara dan melindungi pemerintahan konstitusional."
  SIA_military_wing_history_tt: "Faksi militer Khana Ratsadon didominasi oleh perwira militer yang memandang diri mereka sebagai penjaga revolusi yang sebenarnya. Sosok mereka yang paling ambisius adalah §YPlaek Phibunsongkhram§!, seorang kolonel yang kekagumannya terhadap gerakan nasionalis Eropa semakin meningkat setiap tahunnya.\n\nSayap militernya §Gpro-persenjataan kembali§! dan tertarik pada negara yang kuat dan terpusat. Mereka curiga terhadap gagasan ekonomi Pridi, yang mereka anggap sangat radikal, dan tidak sabar terhadap campur tangan sipil dalam urusan pertahanan. Loyalitas mereka paling mudah diperoleh melalui investasi militer dan kebijakan yang mencerminkan kekuatan nasional."
  idea_SIA_wing_promotion_disruption: "Penataan Kembali Faksi"
  idea_SIA_wing_promotion_disruption_desc: "Secara terbuka mendukung salah satu sayap Khana Ratsadon telah membuat pemerintah kehilangan keseimbangan. Faksi yang diremehkan menjadi lamban, rutinitas militer menjadi kacau, dan pemerintahan biasa menderita sampai pengaturan baru diterapkan."
  idea_SIA_military_wing_unrest: "Sayap Militer dalam Pemberontakan"
  idea_SIA_military_wing_unrest_desc: "Kesabaran petugas kembali habis. Setelah gagal merebut kekuasaan secara langsung, sayap militer kini melampiaskan kemarahannya melalui sabotase, desersi, dan penolakan tegas untuk bekerja sama. Kekuatan tempur tentara runtuh hingga pihak-pihak yang tidak puas dapat ditundukkan."
  idea_SIA_civilian_wing_unrest: "Sayap Sipil dalam Pemberontakan"
  idea_SIA_civilian_wing_unrest_desc: "Fraksi Pridi kembali kehilangan kepercayaan terhadap pemerintah. Karena tidak mendapat kesempatan kedua untuk berkuasa, sayap sipil beralih ke pemogokan, hambatan birokrasi, dan agitasi di kota-kota. Perekonomian melemah dan negara menjadi tidak dapat diatur sampai keadaan menjadi tenang."
  idea_SIA_unwavering_civilian_support: "Dukungan Sipil yang Tak Tergoyahkan"
  idea_SIA_unwavering_civilian_support_desc: "Dengan dibubarkannya sayap militer dan permasalahan legitimasi telah diselesaikan, pemerintahan sipil tidak akan tertandingi. Terbebas dari campur tangan tentara, para teknokrat Pridi terjun ke dalam pemerintahan dengan semangat yang tidak akan pernah bisa dikerahkan oleh koalisi lama."
  idea_SIA_unified_khana_ratsadon: "Partai Persatuan Rakyat"
  idea_SIA_unified_khana_ratsadon_desc: "Pertengkaran lama antara tentara dan warga sipil telah berakhir. Dengan kedua sayap Khana Ratsadon akhirnya bergerak ke arah yang sama, pemerintah dapat bertindak dengan kesatuan tujuan yang belum pernah diketahui sebelumnya. Tentara, administrator, dan industrialis kini bekerja sebagai satu kesatuan."
