  idea_SIA_civilian_full_support: "Sayap Sipil: §GDukungan Penuh§!"
  idea_SIA_civilian_full_support_desc: "Sayap sipil berdiri kokoh di belakang pemerintah. Para administrator dan teknokrat menyumbangkan keahlian mereka untuk mendorong pembangunan ke depan."
  idea_SIA_civilian_slight_support: "Sayap Sipil: Sedikit Dukungan"
  idea_SIA_civilian_slight_support_desc: "Sayap sipil secara luas mendukung arahan pemerintah. Kerja sama mereka membawa manfaat yang sederhana namun nyata."
  idea_SIA_civilian_neutral: "Sayap Sipil: Netral"
  idea_SIA_civilian_neutral_desc: "Sayap sipil tidak membantu atau menghalangi pemerintah. Pemerintahan berfungsi, namun tanpa dorongan keselarasan politik yang sejati."
  idea_SIA_civilian_opposition: "Sayap Sipil: Dalam Oposisi"
  idea_SIA_civilian_opposition_desc: "Sayap sipil telah berbalik melawan pemerintah. Para pejabat berlarut-larut dan anggaran tidak dialokasikan secara tepat, sehingga menghambat kinerja mesin negara."
  idea_SIA_civilian_rebellious: "Sayap Sipil: §RPemberontak§!"
  idea_SIA_civilian_rebellious_desc: "Sayap sipil melakukan perlawanan terbuka. Ketidakstabilan menyebar dan ancaman perpecahan politik semakin meningkat dari hari ke hari."
  idea_SIA_military_full_support: "Sayap Militer: §GDukungan Penuh§!"
  idea_SIA_military_full_support_desc: "Sayap militer berdiri kokoh di belakang pemerintah. Para perwira mendukung upaya perekrutan dan produksi senjata, serta menyalurkan sumber daya tentara untuk mencapai tujuan nasional."
  idea_SIA_military_slight_support: "Sayap Militer: Sedikit Dukungan"
  idea_SIA_military_slight_support_desc: "Sayap militer pada umumnya bersifat kooperatif. Dukungan mereka hanya memberikan sedikit perbaikan pada rekrutmen dan produksi, meskipun tanpa komitmen penuh."
  idea_SIA_military_neutral: "Sayap Militer: Netral"
  idea_SIA_military_neutral_desc: "Sayap militer tidak mengambil posisi apa pun. Tentara menjalankan tugasnya tanpa antusiasme atau perlawanan, menunggu untuk melihat bagaimana keadaan berkembang."
  idea_SIA_military_opposition: "Sayap Militer: Dalam Oposisi"
  idea_SIA_military_opposition_desc: "Sayap militer bekerja melawan pemerintah. Para petugas meremehkan upaya-upaya produksi dan antusiasme terhadap tujuan pemerintah terkuras dari jajarannya."
  idea_SIA_military_rebellious: "Sayap Militer: §RPemberontak§!"
  idea_SIA_military_rebellious_desc: "Sayap militer berada di ambang pembangkangan terbuka. Wajib militer disabotase, produksi senjata menurun, dan ancaman kudeta semakin dekat."
  idea_SIA_defenders_of_constitutional_liberty: "Pembela Kebebasan Konstitusional"
  idea_SIA_civil_service_heroism_1: "Kepahlawanan Pegawai Negeri Sipil"
  idea_SIA_civil_service_heroism_1_desc: "Aparatur Sipil Negara telah mengambil peran dalam hal ini, dedikasi dan keahliannya diam-diam mempercepat laju penelitian dan pembangunan negara."
  idea_SIA_civil_service_heroism_2: "$idea_civil_service_heroism_1$"
  idea_SIA_civil_service_heroism_2_desc: "$idea_SIA_civil_service_heroism_1_desc$"
  idea_SIA_redirected_military_funds: "Dana Militer yang Diarahkan"
  idea_SIA_thai_irredentism: "Irredentisme Thailand"
  idea_SIA_oss_special_forces_training: "Pelatihan Pasukan Khusus OSS"
  idea_SIA_seized_japanese_funds: "Menyita Dana Jepang"
  idea_SIA_seized_japanese_funds_desc: "Dengan dilanggarnya perjanjian Jepang, dana dan persediaan yang mereka tinggalkan menjadi milik kita, sehingga memicu lonjakan hasil konstruksi dan industri."
  idea_SIA_oss_special_forces_training_desc: "Agen kami telah berlatih bersama OSS dalam sabotase, infiltrasi, dan operasi lintas udara. Pembelajaran yang didapat telah mempertajam pasukan khusus kita menjadi instrumen yang tangguh."
  idea_SIA_sold_privy_purse_lands: "Menjual Tanah Dompet Privy"
  idea_SIA_sold_privy_purse_lands_desc: "Penjualan tanah milik keluarga kerajaan telah menyuntikkan modal ke negara, mengurangi tekanan ekonomi dan membebaskan sumber daya untuk pembangunan."
  idea_SIA_war_fervor: "Semangat Perang"
  idea_SIA_bloodlusted_irredentism: "Irredentisme yang haus darah"
  idea_SIA_bloodlusted_irredentism_desc: "Ambisi teritorial telah berubah menjadi sesuatu yang lebih ganas. Tentara berperang dengan keyakinan mereka yang yakin bahwa mereka sedang merebut kembali apa yang menjadi hak mereka."
  idea_SIA_the_royal_police_counterweight: "Kesetiaan Polisi Kerajaan"
  idea_SIA_civilian_technocrats_in_institutions: "Teknokrat Sipil"
  idea_SIA_civilian_technocrats_in_institutions_desc: "Para ahli sipil yang ditempatkan di lembaga-lembaga penting negara telah meningkatkan ekstraksi sumber daya dan efisiensi penunjukan politik."
  idea_SIA_yuvachon: "Yuvachon"
  idea_SIA_yuvachon_desc: "Gerakan Yuvachon melatih generasi muda negara ini dalam disiplin militer, membangun sumber daya manusia yang terlatih, dan membangkitkan sentimen nasionalis."
  idea_SIA_yuvachon_2: "$idea_SIA_yuvachon$"
  idea_SIA_yuvachon_2_desc: "$idea_SIA_yuvachon_desc$"
  idea_SIA_rebuilding_the_war_torn_economy: "Membangun Kembali Perekonomian yang Rusak akibat Perang"
  idea_SIA_specialist_marine_forces: "Angkatan Laut Spesialis"
  idea_SIA_specialist_marine_forces_desc: "Kader spesialis amfibi yang berdedikasi telah dilatih dan diperlengkapi untuk operasi penyerangan pantai."
  idea_SIA_rehabilitated_military: "Militer yang Direhabilitasi"
  idea_SIA_desperate_gambit: "Langkah Putus Asa"
  idea_SIA_desperate_gambit_desc: "Mungkin ada jalan keluar dari lubang tempat Anda berada, panjatlah!"
  idea_SIA_purged_senior_military: "Militer Senior yang Dibersihkan"
  idea_SIA_purged_senior_military_desc: "Perwira senior yang dianggap sebagai ancaman terhadap pemerintah telah dicopot dari jabatannya. Hilangnya komandan-komandan berpengalaman telah berdampak pada kohesi dan pengembangan profesional angkatan bersenjata."
  idea_SIA_cemented_control: "Kontrol yang Disemen"
  idea_SIA_cemented_control_desc: "Pemerintah telah mengkonsolidasikan cengkeramannya pada lembaga-lembaga negara. Oposisi politik telah dikesampingkan dan mesin kekuasaan kini berpihak pada pemerintah."
  idea_SIA_cemented_control_2: "Kontrol yang Mengakar"
  idea_SIA_cemented_control_2_desc: "$idea_SIA_cemented_control_desc$"
  idea_SIA_cemented_control_3: "Undang-Undang Tugas Thailand Selama Perang"
  idea_SIA_cemented_control_3_desc: "Sudah menjadi kewajiban setiap orang Thailand, bahwa jika terjadi perang yang mengancam kedaulatan kerajaan, dan rakyatnya, setiap orang Thailand yang terhormat harus menolak pendudukan dengan cara apa pun yang mungkin dilakukan, baik dengan senjata atau lainnya."
  idea_SIA_suspend_ordinary_legal_procedures: "Prosedur Hukum Biasa yang Ditangguhkan"
  idea_SIA_thai_cultural_mandates: "Mandat Budaya Thailand"
  idea_SIA_military_humiliation: "Penghinaan Militer"
  idea_SIA_death_defiant: "Penentang Kematian"
  idea_SIA_death_defiant_desc: "Kami sudah mati. Ayo ambil hakmu, jika kamu bisa"
  idea_SIA_songsuradet_ascendant_0: "Pewaris Lagusuradet"
  idea_SIA_songsuradet_ascendant_0_desc: "Setelah berhasil mengatasi kemarahan pemerintah, Phraya Songsuradet telah memperkuat basisnya dan tampil lebih kuat. Dia sekarang adalah orang yang dianggap tidak dapat disentuh, terlalu menonjol dan mengakar untuk disingkirkan.\nDia kemungkinan besar akan mengganggu kebijakan pemerintah, memperlambat pengambilan keputusan untuk memastikan dia tidak menjadi target pembersihan lagi."
