  AST_singapore_strategy_idea: "Konstruksi Pertahanan Singapura"
  AST_singapore_strategy_idea_desc: "Atas permintaan Australia, kami akan melakukan upaya untuk meningkatkan struktur pertahanan di Singapura. Strategi Singapura adalah komponen inti kebijakan pertahanan Pasifik.\n\n§W§YSaat dihapus§! (§YSingapura§!):\nTambahkan §G2§! §YAir Pangkalan_§!.\nTambahkan §G2§! §YPangkalan Angkatan Laut§!.\nTambahkan §G1§! §YPesisir Benteng§!.§!"
  AST_all_dressed_up_idea: "Semua Berdandan"
  AST_all_dressed_up_idea_tt: "§Y2§! di luar peta §Y$arms_factory$§!"
