  AST_anti_fascist_measures: "Tindakan Anti-Fasis"
  AST_anti_fascist_measures_desc: "Fasisme belum menguasai Australia, dan kekuatan demokrasi menginginkannya tetap seperti itu. Cabang Investigasi Persemakmuran akan mengawasi dan menahan semua elemen yang mencurigakan untuk mencegah kelompok fasis mendapatkan pengaruh."
  ABDA_corps_expeditionnaire_spirit: "Ekspedisi Korps"
  ABDA_corps_expeditionnaire_spirit_desc: "Pasukan Perancis yang berkomitmen pada teater Pasifik telah diperkuat oleh layanan kolonial dan terbiasa beroperasi jauh dari rumah dalam kondisi sulit. Pengalaman mereka berperang di Asia Tenggara memberi mereka kesadaran khusus akan taktik dan medan Jepang, menjadikan mereka kekuatan yang tangguh ketika musuh terus maju."
  ABDA_maintain_strategic_flexibility_spirit: "Fleksibilitas Strategis"
  ABDA_maintain_strategic_flexibility_spirit_desc: "Hasil industri Amerika diarahkan ke wilayah Pasifik, dengan mempercepat produksi galangan kapal untuk menopang armada yang mampu memproyeksikan tenaga melintasi seluruh lautan. Dengan menolak memberikan komitmen berlebihan pada satu pihak, Amerika Serikat memastikan kekuatan angkatan lautnya dapat digunakan kapan pun situasi menuntutnya."
  AST_toe_the_line_spirit: "Ikuti Garisnya"
  AST_toe_the_line_spirit_desc: "Negara telah menyerukan pengorbanan dan masyarakat telah menjawabnya. Penjatahan, jam kerja yang lebih panjang, dan pengalihan produksi sipil ke upaya nasional telah membebaskan sumber daya yang tidak dapat diperoleh oleh pemerintah. Ini merupakan pengaturan yang ketat dan tidak populer secara universal."
  AST_defying_american_interference_idea: "$AST_defying_american_interference$"
  AST_new_guard_spirit: "Pengawal Baru"
  AST_new_guard_spirit_desc: "Setelah beberapa tahun tidak aktif, kelompok paramiliter terkemuka, Garda Baru, terpaksa kembali berperang untuk menantang musuh yang bangkit kembali.\n\nMeskipun beberapa kelompok sempalan mungkin memiliki agenda ekstremis, organisasi ini sekali lagi menjalankan tugas menjaga ketertiban umum dengan menekan komunisme dan menjunjung cita-cita monarki Inggris."
  AST_new_guard_spirit_tt: "Anggota Garda Baru: §Y[?AST_ng_members_var|0]§!\nPeningkatan anggota harian: §Y[?AST_ng_daily_var|0]§!\n\nGerakan ini memiliki kapasitas maksimum §Y50,000§! anggota"
  AST_add_ng_fascist_tt: "Mengungkapkan fokus:\n§Y$AST_campbells_men$\n$AST_the_commander_returns$§!"
  AST_new_guard_spirit_modify: "Ubah §Y$AST_new_guard_spirit$§! menjadi:\nAnggota Garda baru: §Y2500§!\nPeningkatan anggota harian: §Y10§!"
  AST_fascist_legion_spirit: "Legiun Fasis"
  AST_fascist_legion_spirit_desc: "Sebuah kelompok sempalan dari Garda Baru telah terbukti memiliki pandangan yang lebih luas terhadap pemerintah dibandingkan dengan Garda Baru itu sendiri. Dipercayakan oleh Campbell dengan sumber daya negara, Legiun Fasis kini menjalankan tugas penting untuk melindungi persatuan sipil dengan membasmi perbedaan pendapat politik."
