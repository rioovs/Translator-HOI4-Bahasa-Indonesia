  NZL_railways_board: "Dewan Perkeretaapian Pemerintah"
  NZL_railways_board_desc: "Dewan Perkeretaapian Pemerintah dibentuk pada tahun 1931 sebagai restrukturisasi Departemen Perkeretaapian dalam upaya untuk memisahkan pengambilan keputusan dari departemen pemerintah. Namun, hanya ada sedikit tanda perbaikan pada jaringan kereta api sejak didirikan. Ada tekanan yang meningkat bagi pemerintah untuk menghapuskan dewan tersebut dan mengambil kembali kendali langsung."
  NZL_great_depression: "Depresi Hebat"
  NZL_great_depression_desc: "Runtuhnya perekonomian global pada tahun 1929 memberikan pukulan yang sangat keras terhadap perekonomian Selandia Baru yang sebagian besar merupakan sektor pertanian. Karena negara-negara tersebut membeli lebih sedikit produk dari Selandia Baru, banyak yang menjadi pengangguran, sehingga mengurangi daya beli konsumen dan pada gilirannya menyebabkan industri lain runtuh. Penghematan selama bertahun-tahun telah membuat negara ini mendambakan perubahan arah."
  NZL_commonwealth_loyalty: "Loyalitas Persemakmuran Inggris"
  NZL_commonwealth_loyalty_desc: "Selandia Baru tetap menjadi anggota Persemakmuran Inggris yang berkomitmen dan tetap mempertahankan Raja sebagai kepala negara yang sah. Perekonomian Selandia Baru juga sangat terintegrasi ke dalam sistem ekonomi kekaisaran yang lebih luas."
  NZL_national_coal_board_idea: "Dewan Batubara Nasional"
