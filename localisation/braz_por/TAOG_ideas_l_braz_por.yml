  AST_voluntary_foreign_service_idea: "Dinas Luar Negeri Sukarela"
  AST_liberty_loans_idea: "Pinjaman Kebebasan"
  AST_faction_training_initiative_idea_1: "Inisiatif Pelatihan"
  AST_faction_training_initiative_idea_1_desc: "Inisiatif Pelatihan Gabungan Perlawanan Pasifik adalah program kerja sama di antara para anggotanya, yang memastikan bahwa semua tentara sekutu menjalani pelatihan militer yang sama ketatnya."
  AST_faction_training_initiative_idea_1_tt: "Efek roh akan berlipat ganda jika §Y[AST.GetFactionName]§! memiliki lebih dari §Y4§! anggota"
  AST_faction_training_initiative_idea_2: "Inisiatif Pelatihan"
  AST_faction_training_initiative_idea_2_desc: "Inisiatif Pelatihan Gabungan Perlawanan Pasifik adalah program kerja sama di antara para anggotanya, yang memastikan bahwa semua tentara sekutu menjalani pelatihan militer yang sama ketatnya."
  AST_faction_training_initiative_idea_2_tt: "Efek roh akan berkurang setengahnya jika §Y[AST.GetFactionName]§! memiliki anggota kurang dari §Y5§!"
  AST_temp_political_power_factor_cost: "Bunga Pinjaman Bank"
  AST_war_carriers_idea: "$AST_war_carriers$"
  AST_war_carriers_tech_tt: "§Y$logistics_company$§!:\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-15%§!"
  AST_wool_agreement_idea: "Perjanjian Wol"
  AST_wool_agreement_idea_desc: "[ENG.GetNameDefCap] telah memperoleh hak atas seluruh produksi wol tahunan [AST.GetName], memastikan bahwa prajurit kita akan diberi pakaian dan perlengkapan selama penempatan mereka."
  AST_australian_comforts_fund_idea: "Dana Kenyamanan Australia"
  AST_australian_comforts_fund_idea_desc: "$AST_australian_comforts_fund_desc$"
  AST_british_military_construction_aid_idea: "Bantuan Konstruksi Militer Inggris"
  AST_british_military_construction_aid_idea_tt: "§Y2§! di luar peta §Y$industrial_complex$§!"
