  idea_SIA_bank_of_siam: "Bank Siam"
  idea_SIA_bank_of_siam_desc: "Bank of Siam berfungsi sebagai tulang punggung keuangan negara, mengarahkan penanaman modal dan mengelola kebijakan moneter untuk mendukung ekspansi industri."
  idea_SIA_bank_of_siam_2: "$idea_SIA_bank_of_siam$"
  idea_SIA_bank_of_siam_2_desc: "$idea_SIA_bank_of_siam_desc$"
  idea_SIA_boon_rawd_brewery: "Pabrik Bir Boon Rawd"
  idea_SIA_boon_rawd_brewery_desc: "Pabrik Bir Boon Rawd telah berkembang menjadi simbol perusahaan dalam negeri, kesuksesan komersialnya menghasilkan niat baik dan modal politik bagi mereka yang memperjuangkannya."
  idea_SIA_siam_cement_group: "[ROOT.GetName] Grup Semen"
