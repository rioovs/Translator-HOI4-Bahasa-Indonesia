  AST_invasion_planning_desc: "§YSaat dihapus§!:\nTambahkan §YRencana Perang Jepang§!."
  AST_war_plan_japan: "Rencana Perang Jepang"
  AST_war_strategy: "Strategi Perang"
  AST_australias_glorious_fleet: "Armada Agung Australia"
  AST_australias_glorious_fleet_desc: "Angkatan Laut Australia telah lama mempersiapkan diri untuk menghadapi kekuatan angkatan laut lainnya, dan tampaknya kekuatan tersebut adalah kita."
  AST_australian_culture_investments_idea: "Investasi Kebudayaan Australia"
  AST_australian_culture_investments_idea_desc: "§W§YSaat dihapus§!:\nTambahkan §YRasa Tempat§!, yang memberikan\nStabilitas: §G+10,00%§!\nDukungan Perang: §G+10.00%§!.§!"
  AST_a_sense_of_place: "Rasa Tempat"
  AST_a_sense_of_place_desc: "Identitas nasional adalah ikatan yang menyatukan suatu bangsa. Di bawah budaya yang makmur, warga Australia telah bersatu, berkomitmen untuk melawan siapa pun yang mungkin mengancam perbatasan mereka."
  AST_a_sense_of_place_upgraded: "Rasa Tempat"
  AST_a_sense_of_place_upgraded_desc: "Identitas nasional yang tadinya tumbuh dengan tenang kini semakin terpuruk. Hal ini bukan lagi sekedar kebanggaan terhadap tanah air dan cara hidup – ini adalah keyakinan bahwa apa yang telah dibangun Australia layak untuk diperjuangkan, dan bahwa laki-laki dan perempuan yang hidup di bawah Southern Cross siap untuk melakukan hal tersebut."
  AST_the_promise_of_nauru: "Janji Nauru"
  AST_the_promise_of_nauru_tt: "Efek setelah §Y[AST.GetName]§! menyelesaikan perjanjian:\n§YNauru§! Menjadi dimiliki dan dikendalikan oleh §Y[GER.GetName]§!\n§Y[AST.GetName]§! menjadi gratis\n[GET_AST_NAURU_PACT_FACTION_EFFECT]"
  AST_nauru_pact_guarantee_tt: "Jaminan §Y[AST.GetName]§!"
  AST_nauru_pact_faction_tt: "§Y[AST.GetName]§! gabung §Y[GER.GetFactionName]§!"
  AST_poor_population_growth: "Pertumbuhan Penduduk yang Buruk"
  AST_poor_population_growth_desc: "Ketika Depresi Hebat melanda pada tahun 1929, angka kelahiran di Australia turun drastis. Ditambah dengan penurunan imigrasi, sejak saat itu pertumbuhan populasi mengalami kesulitan untuk pulih."
  AST_the_pacific_garrison_1: "Garnisun Pasifik"
  AST_the_pacific_garrison_2: "Garnisun Pasifik"
