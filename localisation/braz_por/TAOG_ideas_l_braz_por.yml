  idea_INS_volksraad: "Volksraad"
  idea_INS_volksraad_desc: "Volksraad adalah sebuah dewan yang didirikan oleh Belanda pada tahun 1918 sebagai bagian dari sistem \"Kebijakan Etis\", yang bertujuan untuk menciptakan sistem semi-demokrasi di mana berbagai etnis minoritas dan budaya di seluruh nusantara dapat terwakili. Meskipun secara teori bersifat demokratis, Gubernur Jenderal dan Kerajaan Belanda mempunyai hak veto tanpa syarat."
  INS_volksraad_custom_tt: "Memungkinkan Anda untuk mempekerjakan §YVolksraad Advisors§!\nMemungkinkan Anda menggunakan §YVolksraad Decisions§!"
  INS_great_depression: "Depresi Hebat"
  INS_great_depression_desc: "Meskipun dampak langsung Depresi Besar terhadap Hindia Belanda kecil, kebijakan proteksionis yang diterapkan negara-negara di seluruh dunia berdampak buruk terhadap perekonomian Hindia, yang bergantung pada ekspor bahan mentah seperti karet dan minyak secara terus-menerus."
  INS_great_depression_tt: "Memodifikasi §Y$INS_great_depression$§! dengan:"
  INS_dutch_east_indies: "Administrasi yang Salah urus"
  INS_dutch_east_indies_desc: "Hindia Timur adalah negara kepulauan yang luas dan memiliki ratusan budaya dan bahasa yang berbeda, menjadikannya koloni yang terkenal sulit untuk diadministrasikan. Berbagai gerakan kemerdekaan, hambatan budaya, dan dampak ekonomi dari Depresi Besar tidak membantu permasalahan ini, dan pemerintahan berjalan dengan sangat tidak efisien. \"Kebijakan Etis\" yang ditetapkan pada tahun 1918 berupaya untuk memperbaiki situasi dengan mewajibkan peraturan ketenagakerjaan yang etis dan memberikan perwakilan demokratis kepada kelompok minoritas, namun depresi besar membuat sebagian besar peraturan tersebut tidak dilaksanakan."
  INS_dutch_east_indies_tt: "Memodifikasi §Y$INS_dutch_east_indies$§! dengan:"
  INS_volksraad_tt: "Memodifikasi §Y$INS_dutch_east_indies$§! dengan:"
  INS_royal_netherlands_east_indies_army_desc: "Koninklijk Nederlands Indisch Leger (KNIL) adalah tentara lama di Hindia Timur, yang beroperasi secara independen dari Belanda. KNIL terdiri dari tentara Eropa dan Indonesia, meskipun hambatan budaya dan bahasa antara banyak budaya di nusantara dan Belanda, membuat proses perekrutan menjadi sulit dan lambat."
  idea_INS_netherlands_most_precious_jewel: "Permata Paling Berharga di Belanda"
  idea_INS_netherlands_most_precious_jewel_desc: "Hindia Belanda telah menjadi wilayah jajahan Belanda selama kurang lebih 350 tahun, dan administrasi wilayah jajahan tersebut terintegrasi erat dengan pemerintah Belanda. Hindia Timur sering disebut sebagai \"permata di mahkota Belanda\", dan Belanda tidak menunjukkan keinginan untuk melonggarkan cengkeramannya atas permata berharga tersebut."
  INS_netherlands_most_precious_jewel_tt: "£GFX_trigger_no Dapat meningkatkan otonomi menjadi Bebas"
