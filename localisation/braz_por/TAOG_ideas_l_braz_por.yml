  idea_SIA_sued_king_prajadhipok: "Menggugat Raja Prajadhipok"
  idea_SIA_pan_thaiism: "Pan-Thaiisme"
  idea_SIA_pan_thaiism_desc: "Ideologi Pan-Thaiisme menyatakan bahwa semua orang keturunan Thailand harus bersatu di bawah satu negara. Hal ini mendorong negara menuju ekspansi, mempertahankan moral melalui tindakan ofensif."
  idea_SIA_pan_thaiism_2: "$idea_SIA_pan_thaiism$"
  idea_SIA_pan_thaiism_2_desc: "$idea_SIA_pan_thaiism_desc$"
  idea_SIA_unity_propaganda: "Propaganda Persatuan"
  idea_SIA_royal_palace_bureau_directive_no_1523: "Petunjuk Biro Istana Kerajaan No.1523"
