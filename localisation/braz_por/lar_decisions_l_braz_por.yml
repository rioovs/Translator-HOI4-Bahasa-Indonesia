 form_andalusia_category: "Restorasi Moor"
 form_andalusia_category_desc: "Sudah terlalu lama bangsa Moor ditaklukkan dan dianiaya oleh kekuatan Latin. Kini kami mempunyai kemampuan untuk memulihkan Al-Andalus dan seluruh bekas wilayah Kekhalifahan Cordoba."
 form_andalusia: "Pulihkan Al-Andalus"
 form_andalusia_desc: "Dengan Cordoba, Emirat Granada, dan sebagian besar Iberia Selatan di bawah kendali kami, kami memiliki kesempatan unik untuk memulihkan Kesultanan Al-Andalus yang lama dan memproklamirkan semua bekas wilayahnya sebagai bagian yang sah dari negara kami."
 adu_restore_sultanate_of_africa: "Kembalikan Kesultanan Afrika"
 adu_restore_sultanate_of_africa_desc: "Dahulu kala, bangsa Moor di Afrika Utara bersatu menjadi satu kesultanan; Kesultanan Afrika, cabang penting Kekhalifahan Umayyah. Dengan dipulihkannya Andalusia dan seluruh masyarakat Moor kini hidup berdampingan di negara kami, kami dapat menyatukan identitas Moor."
 north_africa_needed_tooltip: "Mengontrol semua negara bagian §YMaroko, Tunisia, Aljazair, dan Libya§!."
 coring_north_africa_tt: "Dapatkan inti di semua negara bagian §YMaroko, Tunisia, Aljazair, Sahara Barat, dan Libya§!."
 adu_mediterrenean_emirates: "Kembalikan Emirat Sisilia"
 adu_mediterrenean_emirates_desc: "Pada puncak pengaruh Moor di Mediterania, pulau-pulau tersebut menjadi rumah bagi banyak Emirat Islam. Dengan Sisilia, Kreta, dan Siprus kini berada di tangan Andalusia, kita dapat sekali lagi mengembalikan wilayah-wilayah ini kepada penguasa sah bangsa Moor."
 adu_restore_umayyad_caliphate: "Menciptakan Kembali Kekhalifahan Bani Umayyah"
 adu_restore_umayyad_caliphate_desc: "Akhirnya, kota suci Bagdad, Mekah, dan Yerusalem bersatu menjadi satu negara. Dengan wilayah jantung Arabia yang kini berada di tangan kita, kita dapat memproklamirkan diri kita sebagai lebih dari sekedar persatuan bangsa Moor, namun Khilafah dipulihkan; tanah air bagi seluruh umat dan kebudayaan Islam."
 adu_recreate_rashid_expansion: "Ekspansi Rashidi"
 adu_recreate_rashid_expansion_desc: "Sebelum pemerintahan Umayyah di Arab, Rasyid berdaulat atas dunia Arab dan di bawah pemerintahan mereka Khilafah menyebar ke Persia dan Hindustan. Dengan menciptakan kembali penaklukan kuno ini, kita dapat menyatukan kembali Persia dan tanah mitos Hindustan dengan negara kita."
 form_country_pakistani_required_states_tt: "Mengontrol semua negara bagian §YPakistan§! kecuali §Y[430.GetName]§!."
 form_country_pakistan_coring_states_tt: "Dapatkan inti di semua negara bagian §YPakistan§! kecuali §Y[430.GetName]§!."
 form_country_egypt_required_states_tt: "Mengontrol semua negara bagian §YMesir§!."
 middle_east_coring_states_tt: "Dapatkan inti di semua negara bagian §YTimur Tengah§!."
 adu_northern_expansion: "Ekspansi Utara"
 adu_northern_expansion_desc: "Kekhalifahan sangat luas dan menyebarkan pemerintahannya jauh melampaui Timur Tengah dan Iberia. Dahulu kala, Georgia, Azerbaijan, dan Transoxiana menyebut Kekhalifahan sebagai rumah mereka, dan inilah saatnya kita memulihkan apa yang telah hilang."
 form_polynesia: "Satukan Polinesia"
 form_polynesia_desc: "Dengan pulau Hawai’i, Aotearoa, Tahiti, dan Samoa berada di bawah kendali kita, kita mungkin bisa menyatukan seluruh masyarakat Pasifik."
