l_braz_por:
 SPR_the_inevitable_civil_war: "Perang Saudara yang Tak Terelakkan"
 SPR_the_inevitable_civil_war_desc: "Setelah pemilu, perang saudara sudah menjadi suatu hal yang pasti. [Root.GetSCWsideloc] Kita harus mengambil inisiatif, dan mengamankan kendali atas garnisun negara."
 SPR_NATIONALISTS_INSTRUCTIONS: "Sangat penting bagi kita untuk tidak menunda-nunda terlalu lama, agar kita tidak memberikan waktu kepada Partai Republik untuk mempersiapkan pertahanan mereka."
 SPR_REPUBLICANS_INSTRUCTIONS: "Kita harus menunda perang saudara sebanyak yang kita bisa, memberi kita waktu untuk bersiap menghadapi pemberontakan Nasionalis."
 spa_civil_war_divisions_counter_full_breakdown: "[SPA.GetNameDefCap] saat ini akan dimulai dengan [?SPR.spa_civil_war_divisions_counter_var|+0] §HDivisi§!, jika Perang Saudara dimulai sekarang."
 spa_civil_war_divisions_counter_icon_value: "[?SPR.spa_civil_war_divisions_counter_var|0H]"
 spr_civil_war_divisions_counter_full_breakdown: "Republik Spanyol saat ini akan memulai dengan [?SPR.spr_civil_war_divisions_counter_var|+0] §HDivisions§!, jika Perang Saudara dimulai sekarang."
 spr_civil_war_divisions_counter_icon_value: "[?SPR.spr_civil_war_divisions_counter_var|0H]"
 SPR_the_inevitable_civil_war_map_category_name: "Pilih tempat untuk mengelola pengaruh garnisun Anda."
 SPR_opposition_civil_war_preparations: "Persiapan Perang Saudara Oposisi"
 SPR_opposition_civil_war_preparations_desc: "Meskipun kita berupaya menggagalkan setiap gerakan mereka, musuh kita tidak tinggal diam. Kita sebaiknya mengingat tindakan mereka saat kita melakukan persiapan menghadapi konflik yang akan datang."
 SPR_civil_war_offensives: "Serangan Perang Saudara"
 SPR_civil_war_offensives_desc: "Masalah dengan kemampuan kami untuk memasok pasukan garis depan membuat kami sulit melakukan serangan efektif terhadap benteng musuh. Kita harus membuat rencana ke depan dan memperluas penyimpanan peralatan garis depan secara memadai sebelum mempersiapkan serangan besar apa pun."
 SPR_civil_war_offensives_map_category_name: "Pilih tempat untuk mempersiapkan serangan Anda."
 SPA_military_plot_nationalists: "Plot Militer"
 SPA_military_plot_nationalists_desc: "Persiapan kami untuk menggulingkan pemerintah sedang dilakukan, namun untuk memastikan kami tidak terulangnya upaya kudeta yang gagal pada tahun 1932, kami harus memastikan bahwa kami mempunyai dukungan yang cukup dari masyarakat sebelum melancarkan kudeta. Waktunya harus tepat!"
 SPR_military_plot_republicans: "Plot Militer"
 SPR_military_plot_republicans_desc: "Desas-desus telah sampai kepada kita mengenai rencana jahat untuk menggulingkan pemerintah, dan meskipun kita baru-baru ini mengalami upaya kudeta, kita sayangnya tidak siap untuk menghadapi upaya kudeta lainnya. Kita harus menggagalkan rencana mereka sebisa mungkin dan menundanya agar kita punya waktu untuk bersiap."
 SPA_primo_de_rivera_speech: "Pidato Primo de Rivera"
 SPA_primo_de_rivera_speech_desc: "José Antonio Primo de Rivera adalah salah satu pendiri Falange Española. Sebagai seorang pembicara publik yang kritis terhadap demokrasi, mungkin ia harus didorong untuk terus berpidato guna meningkatkan dukungan masyarakat dan semakin mengacaukan stabilitas negara."
 SPA_primo_de_rivera_imprisoned: "Primo de Rivera telah dipenjara"
 SPR_inevitable_civil_war_in_progress_flag: "Keputusan Perang Saudara yang Tak Terelakkan saat ini sedang berlangsung"
 SPR_imprison_primo_de_rivera: "Penjarakan Primo de Rivera"
 SPR_imprison_primo_de_rivera_desc: "José Antonio Primo de Rivera telah cukup meresahkan negara dengan pidato-pidatonya yang menghasut yang tak henti-hentinya. Kami akan menangkapnya dan menahannya di tempat yang bisa kami awasi. Suara Falange harus dibungkam."
 SPR_imprison_primo_de_rivera_tt: "Mencegah pidato yang menghasut lebih lanjut oleh Primo de Rivera."
 SPR_primo_de_rivera_first_speech: "Primo de Rivera telah menyampaikan pidato pertamanya"
 SPA_political_assassination: "Pembunuhan Politik"
 SPA_political_assassination_desc: "Musuh politik kita terbukti menjadi duri di pihak kita, mempengaruhi orang-orang yang seharusnya bisa terpengaruh ke pihak kita. Dengan secara taktis menyingkirkan salah satu lawan utama kami, kami dapat mengurangi tekanan pada diri kami dan memberikan peluang lebih besar untuk menyampaikan pesan kami."
 SPR_political_arrest: "Penangkapan Politik"
 SPR_political_arrest_desc: "Musuh-musuh politik kita telah melakukan pembunuhan untuk menyampaikan pesan mereka. Kita tidak bisa mentolerir hal ini - para pelakunya harus diadili!"
 SPA_political_assassination_flag: "Pembunuhan politik telah terjadi"
 SPA_sway_leader_loyalty: "Menggoyahkan Loyalitas Pemimpin"
 SPA_sway_leader_loyalty_desc: "Dengan cara persuasi yang tepat, kami mungkin akan memperluas dukungan kami kepada para perwira terkemuka di militer Spanyol. Mendapatkan dukungan mereka ketika saatnya tiba mungkin terbukti sangat berharga."
 SPA_swayed_leader_loyalty_flag: "Kesetiaan telah terombang-ambing."
 SPR_secure_leader_loyalty: "Amankan Loyalitas Pemimpin"
 SPR_secure_leader_loyalty_desc: "Ada desas-desus yang sampai kepada kita bahwa kesetiaan salah satu pemimpin militer kita yang tadinya setia patut dipertanyakan. Kita harus memastikan bahwa kita mendapatkan kembali kesetiaan mereka, meskipun imbalan yang kita perlukan di hadapan mereka bisa jadi agak mahal..."
 SPR_reassign_disloyal_leader: "Tetapkan kembali Pemimpin yang Tidak Setia"
 SPR_reassign_disloyal_leader_desc: "Ada desas-desus yang sampai kepada kita bahwa kesetiaan beberapa pemimpin militer kita dipertanyakan. Kami sebaiknya menugaskan mereka kembali ke pos-pos jarak jauh, agar mereka tidak dapat melanjutkan rencana mereka dengan mudah."
 SPR_reassign_disloyal_leader_tt: "Tidak akan tersedia untuk Nasionalis selama dua bulan setelah dimulainya Perang Saudara."
 SPA_suppress_the_strikes: "Menekan Pemogokan"
 SPA_suppress_the_strikes_desc: "Pemogokan ini menyebabkan kerusuhan besar-besaran dan kerusakan ekonomi pada negara kita. Kami akan mengirimkan milisi untuk membubarkan mereka dan memastikan masyarakat kembali bekerja."
 SPA_suppress_the_strikes_tt: "Telah sepenuhnya menekan Pemogokan Nasional"
 SPA_suppress_the_strikes_tt_NOT: "Tidak: Telah sepenuhnya menekan Pemogokan Nasional"
 SPR_concessions_to_the_left: "Konsesi ke Kiri"
 SPR_concessions_to_the_left_desc: "Para pemogok mempunyai alasan yang sah atas kekhawatiran mereka. Kami berjanji untuk mengatasi masalah-masalah tersebut, dan pada saat yang sama memberikan konsesi dalam bentuk tidak melakukan penganiayaan terhadap pendudukan tanah secara ilegal dan kejahatan sosial ringan serta pencurian. Hal ini diharapkan bisa mengurangi keresahan sosial."
 SPA_concessions_to_the_left_tt: "Telah sepenuhnya menyerah pada sayap kiri"
 SPR_primo_de_rivera_speech_mission: "Pidato Primo de Rivera"
 SPR_primo_de_rivera_speech_mission_desc: "José Antonio Primo de Rivera, salah satu pendiri Falange Española, berencana untuk mengadakan pidato yang menghasut, menarik orang-orang ke panji Nasionalis dan memicu kerusuhan sipil."
 SPA_imprison_primo_de_rivera_mission: "Penjarakan Primo de Rivera"
 SPA_imprison_primo_de_rivera_mission_desc: "Pemerintah tampaknya telah memutuskan Primo de Rivera telah cukup menimbulkan keresahan, dan telah mengeluarkan surat perintah penangkapannya!"
 SPR_political_assassination_mission: "Pembunuhan Politik"
 SPR_political_assassination_mission_desc: "Retorika haus darah dari musuh-musuh politik kita telah menyerukan penghapusan pendukung utama perjuangan kita... Kita tidak perlu terkejut jika seseorang memutuskan untuk bertindak berdasarkan kata-kata ini."
 SPA_political_arrest_mission: "Penangkapan Politik"
 SPA_political_arrest_mission_desc: "Pemerintah sedang mencari pembalasan atas tersingkirnya salah satu pendukung mereka, dan berusaha menangkap seseorang untuk dijadikan contoh."
 SPR_sway_leader_loyalty_mission: "Menggoyahkan Loyalitas Pemimpin"
 SPR_sway_leader_loyalty_mission_desc: "Para komplotan nasionalis berusaha memperluas dukungan mereka di kalangan pimpinan militer kita, dan kita mendapat kabar bahwa berbagai individu telah didekati dengan tawaran yang menarik... Kita hanya bisa berdoa agar mereka tidak berhasil mempengaruhi salah satu dari mereka."
 SPA_reassign_disloyal_leader_mission: "Tetapkan kembali Pemimpin yang Tidak Setia"
 SPA_reassign_disloyal_leader_mission_desc: "Pemerintah menjadi semakin curiga terhadap beberapa pendukung kami di militer, dan kini berencana untuk menugaskan kembali salah satu konspirator utama kami ke posisi terpencil, sehingga mempersulit kami untuk membuat rencana dan bekerja sama."
 SPR_suppress_the_strikes_mission: "Menekan Pemogokan"
 SPR_suppress_the_strikes_mission_desc: "Milisi sayap kanan dan pemecah pemogokan menindak para pekerja yang tidak puas, memaksa mereka kembali bekerja dan meningkatkan keresahan sosial dan kekecewaan terhadap kemampuan pemerintah untuk melindungi warganya."
 SPA_concessions_to_the_left_mission: "Konsesi ke Kiri"
 SPA_concessions_to_the_left_mission_desc: "Pemerintah memberikan kelonggaran yang luas kepada para pekerja yang mogok, membiarkan mereka lolos dari hukuman yang membuat saudara-saudari sayap kanan kita dipenjarakan. Meskipun tercela, tampaknya tindakan ini populer di kalangan para pemogok."
 SPA_expand_influence_nationalists_trigger_tt: "Kaum Nasionalis mempunyai kendali kurang dari §YTotal§! atas garnisun."
 SPR_expand_influence_republicans_trigger_tt: "Kaum Nasionalis setidaknya memiliki kendali §YLemah§! atas garnisun."
