 SPA_carlist_uprising_mission: "Pemberontakan Carlist yang Akan Datang"
 SPA_carlist_uprising_mission_desc: "Elemen Carlist di faksi kami merasa kesal dengan kepemimpinan kami dan pengaruh kami yang semakin meningkat. Alih-alih mengikuti antrean, ketidakpuasan malah menyebar ke seluruh Requetés, dan rumor pemberontakan pun menyebar. Kita harus siap menghadapi pemberontakan Carlist, bahkan ketika kita menghadapi musuh-musuh Partai Republik."
 SPR_anarchist_uprising_mission: "Pemberontakan Anarkis yang Akan Datang"
 SPR_anarchist_uprising_mission_desc: "'Sekutu' Anarkis kita terus berperilaku dengan harapan independensi dan otonomi yang tidak beralasan. Semakin kita berupaya untuk mengorganisir wilayah-wilayah yang dikuasai kaum anarkis untuk keperluan perang, semakin besar pula mereka mencambuk rakyatnya untuk melawan pemerintah Spanyol yang sah. Kita harus siap menghadapi pemberontakan Anarkis besar-besaran, jika hal ini semakin meningkat."
 SPA_fascist_crackdown_mission: "Tindakan Keras Fasis yang Akan Datang"
 SPA_fascist_crackdown_mission_desc: "Sejak dimulainya perang saudara, kami telah dikesampingkan oleh 'sekutu' Falang kami. Mereka telah memperjelas bahwa visi mereka tentang masa depan Spanyol tidak sesuai dengan visi Kerajaan Carlist yang sah, dan mereka pasti berencana untuk membungkam pengaruh kami sepenuhnya dengan segala cara yang mungkin. Kita harus siap mempertahankan cita-cita kita dengan kekerasan, jika cita-cita tersebut tidak memberi kita pilihan."
 SPR_government_crackdown_mission: "Tindakan Keras Pemerintah yang Akan Datang"
 SPR_government_crackdown_mission_desc: "Sejak dimulainya perang saudara, penindasan kaum Stalinis dan Republik terhadap gerakan kita terus meningkat kekuatannya. Kami telah berusaha sekuat tenaga untuk menghentikan kudeta fasis, namun kelanjutan otonomi kami merupakan duri bagi pemerintah dan jelas mereka lebih memilih melepaskan diri dari kami daripada terus menikmati bantuan kami. Kita harus siap mempertahankan kebebasan kita dengan kekerasan, jika kita tidak mempunyai pilihan lain."
 SPA_negotiate_carlist_support_mission_tt: "Setelah dimulainya perang saudara, kaum Nasionalis memperoleh 5 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPA_negotiate_carlist_support_mission_tt_2: "Setelah dimulainya perang saudara, kaum Nasionalis memperoleh 10 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPA_the_army_of_africa_mission_tt: "Setelah dimulainya perang saudara, kaum Nasionalis memperoleh 5 unit terlatih dengan §Y7 infanteri§! dan §Y2 batalyon artileri§! dan §YRecon§! dan §YEngineer§! Dukungan, serta jaminan kendali atas §Y[290.GetName]§!."
 SPA_secure_the_northern_garrisons_mission_tt: "Kaum Nasionalis meningkatkan §YKontrol Garnisun§! menjadi §RTotal§! di §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§!, dan §Y[172.GetName]§!.\n\nKaum Nasionalis akan memulai perang saudara menguasai provinsi-provinsi ini selama §YPengendalian Garnisun§! di dalamnya paling sedikit §YLemah§!."
 SPR_secure_the_guardia_de_asalto_mission_tt: "Setelah dimulainya perang saudara, dapatkan 6 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!. Partai Republik mendapatkan 3 unit terlatih dengan §Y6 batalyon infanteri§!."
 SPR_secure_the_guardia_de_asalto_mission_tt_2: "Setelah dimulainya perang saudara, dapatkan 10 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!. Partai Republik memperoleh 5 unit terlatih dengan §Y6 batalyon infanteri§!."
 SPR_secure_the_guardia_civil_mission_tt: "Setelah dimulainya perang saudara, dapatkan 3 unit terlatih dengan batalyon §Y6 infanteri§!. Partai Republik mendapatkan 6 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!."
 SPR_secure_the_guardia_civil_mission_tt_2: "Setelah dimulainya perang saudara, dapatkan 5 unit terlatih dengan batalyon §Y6 infanteri§!. Partai Republik memperoleh 10 unit yang kurang terlatih dengan §Y3 batalyon infanteri§!."
 SPR_train_the_union_youth_mission_tt: "Setelah dimulainya perang saudara, Partai Republik memperoleh 5 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPR_train_the_union_youth_mission_tt_2: "Setelah dimulainya perang saudara, Partai Republik memperoleh 10 unit terlatih dengan §Y3 batalyon infanteri§!."
 SPR_enlarge_the_weapon_caches_mission_tt: "Setelah dimulainya perang saudara, bagian peralatan kami akan dikurangi menjadi §Y20%§!, bukan §Y50%§!."
 SPR_distribute_arms_to_the_people_mission_tt: "Setelah dimulainya perang saudara, Partai Republik memperoleh 10 unit tidak terlatih dengan §Y3 batalyon infanteri§!."
 SPR_disband_the_army_mission_tt: "§GMengurangi proporsi tentara yang akan memihak faksi Republik pada awal perang saudara dari §Y50%§! menjadi §Y80%§!, dan mengurangi jumlah divisi Angkatan Darat Afrika dari §Y5§! menjadi §Y3§!.§!\nBagian §Y80%§! ini §Rdibubarkan§!.\n\n§RHal ini akan segera menyebabkan dimulainya aksi sipil perang!§!"
