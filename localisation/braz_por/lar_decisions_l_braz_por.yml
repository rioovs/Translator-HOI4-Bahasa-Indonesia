 lar_local_recruitment: "Rekrutmen Agen Lokal"
 lar_local_recruitment_desc: "Kami membutuhkan agen yang dapat berbaur dengan komunitas lokal. Beberapa diantaranya dapat ditemukan di negara kita sendiri, namun kita harus melakukan upaya bersama untuk mengidentifikasi, merekrut dan melatih mereka."
 recruit_in_state_tt: "Kami akan mendapatkan agen lokal dari §Y[From.Owner.GetNameDef]§!. Agen ini akan lebih sulit dideteksi ketika menyusup dan beroperasi di §Y[From.Owner.GetNameDef]§!."
 recruit_in_state_to_pool_tt: "Agen lokal dari §Y[From.Owner.GetNameDef]§! tersedia untuk perekrutan jika kami memiliki §YOperative Slot§! yang terbuka. Agen ini akan lebih sulit dideteksi ketika menyusup dan beroperasi di §Y[From.Owner.GetNameDef]§!."
 POR_naval_blockade: "Blokade Laut"
 POR_naval_blockade_desc: "Pemerintah Portugis telah menawarkan untuk menghindari blokade laut Inggris dan mengangkut perbekalan untuk pasukan kita. Bantuan untuk upaya perang kita ini dapat menjadi kunci dalam konflik tersebut."
 POR_evade_blockade_flag: "Menghindari blokade dengan konvoi Portugis aktif."
 POR_cancel_evade_blockade_flag: "Pembatalan Perjanjian Penghindaran Blokade Portugis diaktifkan."
 POR_evade_blockade_with_portuguese_convoys: "Hindari blokade dengan konvoi Portugis"
 POR_evade_blockade_with_portuguese_convoys_desc: "Kami akan menerima tawaran untuk menggunakan konvoi Portugis untuk mengangkut barang-barang yang tidak dapat dijangkau oleh kapal kami sendiri. Semangat pasukan kita akan meningkat ketika masalah pasokan dasar mereka akhirnya teratasi."
 POR_major_cancel_portuguese_blockade_evasion: "Membatalkan Perjanjian Penghindaran Blokade Portugis"
 POR_major_cancel_portuguese_blockade_evasion_desc: "Kita tidak perlu terus menggunakan konvoi Portugis untuk menghindari blokade Inggris. Kami akan segera membatalkan perjanjian itu."
 POR_portugal_cancel_blockade_evasion_for_country: "Batalkan Perjanjian Penghindaran Blokade dengan [From.GetNameDef]"
 POR_portugal_cancel_blockade_evasion_for_country_desc: "Perjanjian dimana kami menggunakan sejumlah konvoi untuk menghindari blokade Inggris untuk pemerintah [From.GetAdjective] tidak lagi bermanfaat bagi kami, oleh karena itu kami akan segera membatalkannya."
 POR_monarchist_cause: "Penyebab Monarki"
 POR_stir_monarchist_sentiment_in_brazil: "Bangkitkan Sentimen Monarki di Brasil"
 POR_stir_monarchist_sentiment_in_brazil_desc: "Kami akan mendesak unsur-unsur monarki di Brasil untuk mengambil tindakan dan menyebarkan sentimen royalis di kalangan penduduk Brasil."
 POR_portugal_promoting_monarchist_cause_in_brazil: "Portugal Mendesak Kaum Monarki"
 POR_portugal_promoting_monarchist_cause_in_brazil_desc: "Pemerintah Portugal mendesak penduduknya untuk menganut monarki dan menerima Pangeran Pedro Henrique sebagai penguasa sah Brasil."
 POR_stir_monarchist_sentiment_in_brazil_tt: "§Y[BRA.GetFlag][BRA.GetNameDefCap]§! akan menerima Dukungan Harian untuk Unaligned: §G+0.10§!§Yselama 180 hari§!."
 POR_promote_communism_in_latin_america_tt: "§Y[From.GetFlag][From.GetNameDefCap]§! akan menerima Dukungan Harian untuk §YKomunisme§!: §G+0.10§!§Yselama 180 hari§!."
 POR_portugal_stirring_brazilian_monarchists_flag: "Portugal saat ini sedang menggerakkan kaum Monarki Brasil"
 POR_repress_brazilian_monarchists: "Menekan Kaum Monarki"
 POR_repress_brazilian_monarchists_desc: "Kita harus menentang gerakan monarki yang semakin kuat di kalangan masyarakat kita. Kita harus menemukan siapa yang bertanggung jawab menyebarkan sentimen royalis ini dan menghukum mereka di depan umum."
 POR_stir_monarchist_sentiment_in_portugal: "Bangkitkan Sentimen Monarki di Portugal"
 POR_stir_monarchist_sentiment_in_portugal_desc: "Kita harus mendesak rakyat untuk menerima Dom Duarte sebagai raja Portugal yang sah."
 POR_Iberian_Summit_Receiver_Portugal: "Portugal"
 POR_Iberian_Summit_Receiver_Spain: "Spanyol"
 POR_iberian_summit: "KTT Iberia"
 POR_iberian_summit_desc: "Negara-negara Iberia perlu bekerja sama jika kita ingin mengatasi rintangan. Kita harus mendesak [GetIberianSummitReceiverName] untuk mendiskusikan sisi konflik mana yang harus kita dukung di masa yang tidak pasti ini."
 POR_iberian_summit_pro_axis: "Proposal untuk Bergabung dengan [GER.GetFactionName]"
 POR_iberian_summit_pro_axis_desc: "[GER.GetFactionName] akan menjadi kekuatan dominan di Eropa. Kita harus selaras dengan mereka sebelum mereka memutuskan untuk mengambil kendali langsung atas wilayah dan sumber daya kita.\nKami akan mengirimkan surat ke [GetIberianSummitReceiverName], mendesak mereka untuk mendiskusikan proposal bersama yang meminta [GER.GetNameDef] untuk menerima kami di [GER.GetFactionName]."
 POR_iberian_summit_pro_allies: "Proposal untuk Bergabung dengan [ENG.GetFactionName]"
 POR_iberian_summit_pro_allies_desc: "Kita harus memihak [ENG.GetAdjective] dan menghadapi semua pihak yang mengancam kebebasan kita dan berusaha mendominasi kita.\nKami akan mengirimkan surat ke [GetIberianSummitReceiverName], mendesak mereka untuk mendiskusikan proposal bersama yang meminta [ENG.GetNameDef] untuk menerima kami di [ENG.GetFactionName]."
 POR_iberian_summit_proposal_delayed: "Mengerjakan Proposal untuk Bergabung dengan [?global.POR_iberian_summit_target.GetFactionName]"
 POR_iberian_summit_proposal_delayed_desc: "Para diplomat Iberia saat ini sedang mendekati menteri-menteri [?global.POR_iberian_summit_target.GetAdjective] dan menguraikan perjanjian menarik yang akan membuka jalan bagi penerimaan kami ke [?global.POR_iberian_summit_target.GetFactionName]."
 POR_iberian_summit_in_progress_flag: "KTT Iberia sedang berlangsung"
 POR_arms_purchases: "Pembelian Senjata"
 POR_arms_purchases_desc: "Industri militer dan fasilitas angkatan laut [Root.GetNameDef] saat ini tidak mampu memproduksi peralatan yang dibutuhkan pasukan kita. Oleh karena itu, kita harus berupaya mengatur kesepakatan dengan kekuatan asing yang dapat memberi kita senjata dan kapal modern."
 POR_buy_artillery_in_britain: "Beli Senjata Artileri di [ENG.GetNameDef]"
 POR_buy_artillery_in_britain_desc: "Kami akan mengatur kesepakatan dengan [ENG.GetAdjective] untuk membeli senjata artileri modern."
 POR_buy_aa_in_britain: "Beli Senjata Anti Udara di [ENG.GetNameDef]"
 POR_buy_aa_in_britain_desc: "Kami akan mengatur kesepakatan dengan [ENG.GetAdjective] untuk pembelian senjata anti-udara modern."
 POR_buy_at_in_britain: "Beli Senjata Anti-Tank di [ENG.GetNameDef]"
 POR_buy_at_in_britain_desc: "Kami akan membuat kesepakatan dengan [ENG.GetAdjective] untuk pembelian senjata anti-tank modern."
 POR_buy_ships_britain: "Ajukan Penawaran untuk Membeli Kapal [ENG.GetAdjective]"
