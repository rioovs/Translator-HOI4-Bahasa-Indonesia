  generic_choice_tt: "Memberikan pilihan antara:"
  generic_or_tt: "Atau:"
  SIA_a_land_war_in_asia: "Perang Darat di Asia"
  idea_SIA_land_war_in_asia: "Perang Darat di Asia"
  # Alternative Communist Focus
  SIA_the_peoples_war_in_asia: "Perang Rakyat di Asia"
  SIA_the_peoples_war_in_asia_desc: "Perjuangan melawan imperialisme [JAP.GetAdjective] bukan sekedar pertarungan antar negara. Ini adalah perang antara buruh, tani dan tentara melawan dominasi dari luar negeri. Dengan berdiri bersama kekuatan komunis di Tiongkok, [ROOT.GetNameDef] berkomitmen pada perang rakyat yang lebih luas di seluruh Asia."
  SIA_peoples_war_in_asia_idea: "Perang Rakyat di Asia"
  SIA_peoples_war_in_asia_idea_desc: "Perang ini ditopang oleh lebih dari sekedar formasi biasa. Komite lokal, pemandu partisan, dan kolom pasokan petani kini bertugas di lapangan bagi tentara. Setiap desa menjadi gudang, setiap jalan menjadi kemungkinan penyergapan, dan setiap kemunduran menjadi peluang untuk menarik musuh lebih jauh ke pedalaman."
  # Alternative Nationalist Focus
  SIA_national_defense_in_asia: "Pertahanan Nasional di Asia"
  SIA_national_defense_in_asia_desc: "Pertahanan Asia memerlukan disiplin, hierarki, dan tujuan strategis bersama. Dengan berdiri bersama pemerintah nasionalis Tiongkok, [ROOT.GetNameDef] bergabung dengan koalisi yang bertekad untuk melawan ekspansi [JAP.GetAdjective] melalui tentara yang terorganisir dan komando yang terkoordinasi."
  SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! bersekutu dengan kekuatan nasionalis di Front Persatuan.\nMenambahkan §Y$SIA_national_defense_in_asia_idea$§!, yang memberikan:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n$MODIFIER_PLANNING_SPEED$: §G+10%§!\n$MODIFIER_MAX_PLANNING$: §G+10%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
  SIA_stronger_together: "Bersama Lebih Kuat"
  SIA_stronger_together_desc: "Perang telah mengurangi janji-janji yang jauh dan aliansi paralel menjadi sekadar hambatan. Jika [ROOT.GetNameDef] ingin menentukan arah Asia, kita harus meminta mitra kita untuk mengikat faksi mereka dengan faksi kita dan menerima satu komando dalam perjuangan ke depan."
  idea_SIA_national_defense_in_asia: "Pertahanan Nasional di Asia"
  SIA_directorate_of_aeronautical_engineering_desc: "Masa depan angkatan udara [ROOT.GetNameDef] tidak akan terjamin hanya oleh pilot saja. Hal ini membutuhkan insinyur, inspektur, bengkel dan otoritas pusat yang mampu mengubah pembelian asing menjadi pesawat yang bisa diservis. Direktorat Teknik Penerbangan akan menjadi tumpuan upaya ini."
  idea_SIA_aeronautical_engineering_directorate: "Direktorat Teknik Penerbangan"
  SIA_standardize_aircraft_maintenance: "Standarisasi Perawatan Pesawat"
  SIA_standardize_aircraft_maintenance_desc: "Pesawat kami berasal dari berbagai sumber, masing-masing memiliki suku cadang, peralatan, dan kebiasaan perbaikannya sendiri. Dengan melakukan standarisasi prosedur pemeliharaan di bawah Direktorat, [ROOT.GetNameDef] dapat menjaga lebih banyak pesawat tetap mengudara dan mengurangi limbah akibat kebingungan di darat."
  SIA_expand_aircraft_workshops: "Perluas Bengkel Pesawat Terbang"
  SIA_expand_aircraft_workshops_desc: "Direktorat membutuhkan lebih dari sekadar kantor dan surat inspeksi. Bengkel baru, peralatan mesin, dan mekanik terlatih akan memungkinkan pesawat yang rusak diperbaiki di dalam negeri, sementara komponen sederhana dapat diproduksi tanpa menunggu pengiriman ke luar negeri."
  SIA_license_modern_airframes: "Lisensi Badan Pesawat Modern"
  SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap] belum dapat merancang semua pesawat yang dibutuhkannya. Kursus yang lebih praktis adalah melisensikan model asing, mempelajari konstruksinya dan menyesuaikannya dengan iklim, lapangan terbang, dan kondisi pasokan di bawah pengawasan Direktorat."
  SIA_tropical_air_operations: "Operasi Udara Tropis"
  SIA_tropical_air_operations_desc: "Panas, kelembapan, hujan monsun, dan kondisi medan yang kasar memberikan tuntutan tersendiri pada pesawat dan awaknya. Dengan menyesuaikan mesin, jadwal perawatan, dan doktrin pilot dengan kondisi tersebut, Direktorat dapat membuat angkatan udara kita lebih andal di angkasa Asia Tenggara."
  SIA_thai_french_liaison: "Penghubung Thailand-Prancis"
  SIA_thai_french_liaison_no_indochina_tt: "Kami tidak menempati sebagian wilayah Indochina Prancis (Laos, Kamboja, atau Vietnam)"
  SIA_thai_french_liaison_desc: "Ikatan yang terjalin saat penerbang pertama kami dilatih di Prancis masih bertahan. Meskipun Paris dan Bangkok tetap damai, hubungan tetap menjaga keahlian teknis, panduan, dan niat baik Prancis tetap mengalir ke angkatan udara kami."
  SIA_expand_don_mueang: "Perluas Pangkalan Udara Don Mueang"
  SIA_expand_don_mueang_desc: "Don Mueang adalah jantung dari angkatan udara kita. Landasan pacu, hanggar, dan depot baru akan menjadikannya pangkalan yang layak bagi angkatan udara modern, dan landasan di mana skuadron kita dibentuk."
  SIA_hawk_iii_production_line: "Lini Produksi Hawk III"
  SIA_hawk_iii_production_line_desc: "Hawk III sudah tidak asing lagi bagi pilot dan bengkel kami. Melakukan standarisasi pada pesawat tempur yang telah terbukti dan dibuat dengan lisensi akan memberikan waktu sementara kita memutuskan apa arti sebenarnya dari modernisasi."
  SIA_mixed_inventory_standardization: "Standardisasi Persediaan Campuran"
  SIA_mixed_inventory_standardization_desc: "Praktek-praktek yang dilakukan Amerika, Jepang, dan Perancis tidak akan menghasilkan angkatan udara yang koheren dengan sendirinya. Suku cadang, penandaan, radio, dan disiplin pemeliharaan harus distandarisasi sebelum perang berikutnya tiba."
  SIA_womens_auxiliary_air_force: "Angkatan Udara Pembantu Wanita"
  SIA_womens_auxiliary_air_force_desc: "Setiap mekanik, juru tulis, dan operator radio yang dibebaskan dari awak darat adalah pilot lain di udara. Perempuan Thailand telah membuktikan diri mereka di rumah sakit dan kementerian; lapangan terbang Don Mueang juga tidak akan berbeda."
  SIA_air_defense_of_the_kra: "Pertahanan Udara Tanah Genting Kra"
  SIA_air_defense_of_the_kra_desc: "Thailand Selatan adalah penghubung antara Malaya dan Burma. Kekuatan apa pun yang bergerak melalui semenanjung harus menghadapi lapangan terbang, pos peringatan, dan pencegat Thailand. Kita akan memegang langit di atas tanah kita sendiri daripada meraih milik orang lain."
  SIA_the_interceptor_force: "Pasukan Pencegat"
  SIA_the_interceptor_force_desc: "Patroli tetap dan jaring pengamat darat mengubah pesawat tempur kita menjadi kekuatan pencegat sejati. Radar dan pengacakan cepat akan menemui perampok sebelum mereka mencapai kota kita."
  SIA_hardened_air_defenses: "Pertahanan Udara yang Diperkuat"
  SIA_hardened_air_defenses_desc: "Strip yang tersebar, revetmen, dan baterai antipeluru yang padat membuat lengan udara kita menyerap pukulan dan terus terbang. Apa yang selamat dari serangan pertama akan tetap ada pada serangan kedua."
  SIA_forward_strike_wings: "Sayap Serangan ke Depan"
  SIA_forward_strike_wings_desc: "Daripada menunggu untuk diserang, kami akan melatih sayap untuk menguasai udara di depan dan melakukan perlawanan terhadap musuh saat perang dimulai."
  SIA_increase_air_crews: "Tingkatkan Kru Udara"
  SIA_increase_air_crews_desc: "Kami akan menambah jumlah kru darat yang merawat pesawat kami. Dibutuhkan tenaga kerja untuk mengisi barisan mereka, namun mesin yang dirawat dengan baik dan terlindungi dengan baik akan terbang lagi di tempat yang terbengkalai dan hilang."
  SIA_conserve_air_crews: "Menghemat Kru Udara"
  SIA_conserve_air_crews_desc: "Setiap mekanik di lapangan terbang adalah penembak, bukan di depan. Kami akan menjalankan angkatan udara kami secara ramping, membebaskan tenaga kerja tersebut untuk angkatan darat, dan menerima bahwa pesawat kami akan lebih sering mogok karenanya."
  SIA_tropical_operations: "Operasi Tropis"
  SIA_tropical_operations_desc: "Panas, musim hujan, dan kanopi hutan lebih menghukum penerbang yang ceroboh dibandingkan senjata musuh. Kami akan merancang angkatan udara kami berdasarkan iklim wilayah kami sendiri, menyerang musuh di darat dengan keras meskipun cuaca buruk."
  SIA_veteran_jungle_aviators: "Penerbang Hutan Veteran"
  SIA_veteran_jungle_aviators_desc: "Terbang dalam iklim seperti ini akan merusak pilot ramah lingkungan dan mesin yang sudah usang. Pemeliharaan yang lebih baik dan pengalaman yang diperoleh dengan susah payah akan mengubah kelangsungan hidup menjadi keterampilan, dan keterampilan menjadi kartu as."
  SIA_long_range_strike_wings: "Sayap Serangan Jarak Jauh"
  SIA_long_range_strike_wings_desc: "Daripada membangun untuk hutan di depan kita, kita akan membangun untuk jarak di luarnya. Armada pembom berkaki panjang, yang diperoleh dan diproduksi tanpa menggunakan limbah biasa, akan memungkinkan kita menyerang jauh melampaui perbatasan kita sendiri."
  SIA_lightweight_airframes: "Badan Pesawat Ringan"
  SIA_lightweight_airframes_desc: "Lepaskan tangki feri dan beban yang dimaksudkan untuk jarak, dan apa yang tersisa akan menjadi lebih rapat, memanjat lebih cepat, dan membawa pukulan yang lebih berat ke sasaran. Sayap kita tidak akan menjangkau jauh, namun tidak ada sesuatu pun yang berada dalam jangkauan mereka akan aman."
  SIA_tactical_bombing_school: "Sekolah Bom Taktis"
  SIA_tactical_bombing_school_desc: "Sebuah sekolah yang didedikasikan untuk kru pembom akan mengubah pembom taktis kita dari instrumen tumpul menjadi instrumen yang presisi, menyerang lebih keras dan lebih tepat pada apa pun yang menghalangi mereka."
  SIA_reinforced_platings: "Pelapisan yang Diperkuat"
  SIA_reinforced_platings_desc: "Pelapisan lapis baja dan tangki bahan bakar tambahan memungkinkan pesawat tempur pengawal kami menerima serangan dan tetap mencapai target yang jauh dari rumah. Bobot tambahan akan membakar lebih banyak bahan bakar selama perjalanan, namun sayap pengawal yang dibor dengan baik sepadan dengan biayanya."
  SIA_destroy_the_indochinese_ports: "Hancurkan Pelabuhan Indochina"
  SIA_destroy_the_indochinese_ports_desc: "Pelabuhan-pelabuhan di Indochina adalah tempat dimana setiap kampanye musuh melawan kita bisa dilakukan. Kami akan menjadikan pemusnahan mereka sebagai tujuan utama angkatan udara, baik dengan serangan pembom saat pecahnya perang atau dengan serangan diam-diam yang dilakukan jauh sebelum tembakan pertama."
  SIA_destroy_the_indochinese_ports_tt: "Membuka operasi intelijen §YSabotase Pelabuhan Indochina§!."
  SIA_destroy_the_indochinese_ports_raid_tt: "Membuka kunci serangan udara §YRaid Indochinese Port§!."
  SIA_destroy_the_indochinese_ports_planes_bba_tt: "Dapatkan §Y30§! §YB-17 Flying Fortress§! dan §Y20§! §YP-38 Lightning§! di timbunan nasional."
  SIA_destroy_the_indochinese_ports_planes_legacy_tt: "Dapatkan §Y30§! §Y$strat_bomber_equipment_1$§! dan §Y20§! §Y$heavy_fighter_equipment_1$§! di timbunan nasional."
  SIA_accept_a_japanese_technical_mission: "Terima Misi Teknis Jepang"
  SIA_accept_a_japanese_technical_mission_desc: "Tokyo menawarkan instruktur, panduan teknis, dan pesawat yang dapat kita peroleh dengan cepat. Jika kita menerima, kita memperoleh kecepatan. Kami juga mendapatkan ketergantungan."
  SIA_fighter_type_12_conversion: "Pelatihan Tipe 12"
  SIA_fighter_type_12_conversion_desc: "Nakajima Ki-27, Tipe 12 kami, adalah tunggangan gesit yang memberi penghargaan pada tangan yang agresif. Siklus latihan yang keras pada tipe ini akan mempertajam pilot kami dan mengasah setiap ace dalam roster, meskipun intensitasnya tidak dapat dipertahankan selamanya."
  SIA_preserve_american_procurement_channels: "Pertahankan Saluran Pengadaan Amerika"
  SIA_preserve_american_procurement_channels_desc: "Kekuatan udara Thailand dibangun melalui pengadaan yang cermat dari Curtiss dan Vought. Menjaga saluran-saluran Amerika tetap hidup akan menjaga jalur menuju pesawat yang lebih baik dan mengurangi ketergantungan pada Jepang."
  SIA_free_thai_air_liaison: "Penghubung Udara Thailand Gratis"
  SIA_free_thai_air_liaison_desc: "Kekuatan udara bukan hanya pesawat terbang di angkasa. Radio, laporan cuaca, jalur tersembunyi, dan penerbang yang diselamatkan dapat berarti lebih dari satu skuadron tambahan. Orang Thailand Merdeka akan membangun jaringan yang tenang itu."
  idea_SIA_kra_air_defense: "Pertahanan Udara Kra"
  idea_SIA_kra_air_defense_desc: "Pos-pos tersembunyi di sepanjang dataran tinggi semenanjung radio dalam cuaca dan pandangan pertama penyusup, dan skuadron kami terbang mengetahui apa yang menunggu mereka."
  idea_SIA_fighter_type_12: "Pelatihan Tipe 12"
  idea_SIA_fighter_type_12_desc: "Siklus pelatihan intensif pada Tipe 12 yang gesit membuat pilot kami terbang paling tajam, dengan ace yang memimpin. Kecepatan ini tidak dapat dipertahankan tanpa batas waktu."
  SIA_air_cooperation_japan: "Kerjasama Udara"
  SIA_air_cooperation_usa: "Kerjasama Udara"
  SIA_air_cooperation_france: "Kerjasama Udara"
  SIA_free_thai_rescued_airmen: "Melindungi penerbang kami yang jatuh"
  SIA_free_thai_air_network_unlock_tt: "Membuka keputusan §YFree Thai Air Network§!."
  SIA_reverse_engineer_french_airplanes: "Reverse Engineer Pesawat Prancis"
  SIA_reverse_engineer_french_airplanes_desc: "Lapangan terbang dan bengkel di Indochina jatuh ke tangan kami dengan sebagian besar mesin Prancis masih utuh. Teknisi kami akan mengupasnya hingga tuntas dan mempelajari setiap rahasia yang mereka simpan."
  SIA_specialized_airframe_construction: "Konstruksi Badan Pesawat Khusus"
  SIA_specialized_airframe_construction_desc: "Daripada mengejar setiap desain sekaligus, pabrik kami akan menguasai satu badan pesawat tempur dan membangunnya lebih baik dari siapa pun di kawasan ini."
  SIA_license_equipment: "Peralatan Lisensi"
  SIA_license_equipment_desc: "Dengan amannya Indochina, kami bernegosiasi dengan kekuatan. Desain asing akan dibuat di bawah lisensi di pabrik kami sendiri, dengan biaya murah dan dalam skala besar."
  SIA_controls_all_indochina_tt: "Kami mengendalikan seluruh §YIndochina§!"
  SIA_hawk_iii_max_efficiency_tt: "Menambahkan garis pada efisiensi maksimal yang tersedia"
  idea_SIA_increase_air_crews: "Peningkatan Kru Udara"
  idea_SIA_increase_air_crews_desc: "Awak darat yang diperluas menjaga pesawat kami tetap terbang. Kebutuhan tenaga awak darat udara lebih tinggi, namun keandalan dan lapis baja pesawat lebih besar."
  idea_SIA_conserve_air_crews: "Kru Udara yang Dikonservasi"
  idea_SIA_conserve_air_crews_desc: "Lengan udara yang ramping membebaskan tenaga untuk bagian depan. Kebutuhan tenaga kerja awak darat yang lebih rendah dan lebih banyak populasi yang dapat direkrut, dengan mengorbankan keandalan pesawat."
  idea_SIA_specialized_airframe_construction_conserve: "Badan Pesawat Tempur Khusus"
  idea_SIA_specialized_airframe_construction_conserve_desc: "Pabrik-pabrik kami disesuaikan dengan satu badan pesawat tempur, yang dikelola oleh perusahaan yang berbasis darat. Ia terbang lebih gesit dan lebih jauh serta biaya pembuatannya lebih murah, dengan mengorbankan keandalannya, sementara mekanik yang tidak kami pekerjakan bertugas di depan. Nanti badan pesawat kita tidak siap menderita karenanya."
  idea_SIA_specialized_airframe_construction_increase: "Badan Pesawat Tempur Khusus"
  idea_SIA_specialized_airframe_construction_increase_desc: "Pabrik kami disesuaikan dengan satu badan pesawat tempur, dan kru darat penuh menjaganya tetap di udara. Ia terbang lebih gesit dan lebih jauh serta biaya pembangunannya lebih murah, dan pemeliharaan yang lebih baik mengimbangi kerapuhan desain yang dipaksakan sekeras ini. Nanti badan pesawat kita tidak siap menderita karenanya."
  idea_SIA_specialized_airframe_construction_legacy_conserve: "Badan Pesawat Tempur Khusus"
  idea_SIA_specialized_airframe_construction_legacy_conserve_desc: "Pabrik-pabrik kami disesuaikan dengan satu badan pesawat tempur, yang dikelola oleh perusahaan yang berbasis darat. Ia terbang lebih gesit dan lebih jauh serta biaya pembuatannya lebih murah, dengan mengorbankan keandalannya, sementara mekanik yang tidak kami pekerjakan bertugas di depan. Nanti badan pesawat kita tidak siap menderita karenanya."
  idea_SIA_specialized_airframe_construction_legacy_increase: "Badan Pesawat Tempur Khusus"
  idea_SIA_specialized_airframe_construction_legacy_increase_desc: "Pabrik kami disesuaikan dengan satu badan pesawat tempur, dan kru darat penuh menjaganya tetap di udara. Ia terbang lebih gesit dan lebih jauh serta biaya pembangunannya lebih murah, dan pemeliharaan yang lebih baik mengimbangi kerapuhan desain yang dipaksakan sekeras ini. Nanti badan pesawat kita tidak siap menderita karenanya."
  idea_SIA_license_equipment_conserve: "Jaringan Produksi Berlisensi"
  idea_SIA_license_equipment_conserve_desc: "Kontrol atas industri Indochina memungkinkan kita membangun desain asing di bawah lisensi dengan jauh lebih murah dan cepat, dilayani oleh perusahaan yang ramping dan menyerahkan sumber daya manusia kepada tentara."
  idea_SIA_license_equipment_increase: "Jaringan Produksi Berlisensi"
  idea_SIA_license_equipment_increase_desc: "Kendali atas industri Indochina memungkinkan kami membangun desain asing di bawah lisensi dengan jauh lebih murah dan cepat, dan kru darat penuh menjaga mesin berlisensi tetap terbang."
  idea_SIA_bomber_procurement_program: "Program Pengadaan Pesawat Pengebom"
  idea_SIA_bomber_procurement_program_desc: "Kontrak yang disederhanakan dan produksi berlisensi telah menurunkan biaya armada pembom taktis kami secara substansial, meskipun persyaratan yang menguntungkan hanya akan berlaku selama kontrak saat ini berjalan."
  SIA_mio_trait_japanese_air_mission_unlock_tt: "Membuka sifat §YMisi Teknis Jepang§! untuk §YDirektorat Teknik Penerbangan§!"
  SIA_mio_trait_american_procurement_unlock_tt: "Membuka sifat §YSaluran Pengadaan Amerika§! untuk §YDirektorat Teknik Penerbangan§!"
##########
  #### AUSTRALIA ####
  ###################
  effects_of_event_tt: "§YEfek peristiwa§!:"
  AST_war_is_coming: "Perang Akan Datang"
  AST_war_is_coming_desc: "Selama tiga dekade terakhir kita dihadapkan pada tantangan demi tantangan, namun tantangan terakhir tampaknya akan menguji kekuatan demokrasi Australia untuk selamanya. Mantan Perdana Menteri Billy Hughes sangat jelas mengenai masalah ini, dan kita tidak bertanggung jawab jika mengabaikan pernyataannya bahwa – suka atau tidak – perang akan segera terjadi."
  AST_war_is_coming_tt: "Membuka §YPemilu Demokrat§!"
  AST_war_is_coming_uap_advisors_tt: "(§Y$AST_billy_hughes$§!):"
  AST_war_is_coming_alp_advisors_tt: "(§Y$AST_james_scullin$§!):"
  AST_war_is_coming_decrease_advisors_tt: "(§Y$AST_maurice_blackburn$§!):"
  AST_war_is_coming_advisors_tt: "Modifikasi Penasihat Politik dengan:"
  AST_advance_pacific_initiatives: "Inisiatif Pasifik yang Maju"
  AST_advance_pacific_initiatives_desc: "Berkat pakta non-agresi yang berhasil kami jalin, hubungan kami dengan negara-negara tetangga di Asia menjadi lebih baik. Kami akan terus memanfaatkan hubungan ini sebaik-baiknya dan menyerukan sekutu baru kami untuk membantu pembangunan industri kami."
  AST_advance_pacific_initiatives_tt: "Membuat pakta non-agresi dengan:"
  AST_advance_pacific_initiatives_jap_tt: "§Y[JAP.GetName]§! untuk Menambahkan §G2§! offmap §YDockyards§! ke efek."
  AST_advance_pacific_initiatives_ins_tt: "§Y[INS.GetName]§! untuk Menambahkan §G1§! offmap §YKilang Sintetis§! ke efeknya."
  AST_advance_pacific_initiatives_chi_tt: "§Y[CHI.GetName]§! untuk Menambahkan §G2§! offmap §YPabrik Sipil§! ke efeknya."
  AST_advance_pacific_initiatives_jap_2_tt: "§Y[JAP.GetName]§! menawarkan:"
  AST_advance_pacific_initiatives_ins_2_tt: "§Y[INS.GetName]§! menawarkan:"
  AST_advance_pacific_initiatives_chi_2_tt: "§Y[CHI.GetName]§! menawarkan:"
  AST_advance_pacific_initiatives_2_tt: "Bangunan akan dipindahkan jika berperang dengan negara terkait."
  AST_pacific_initiatives_modifier: "Inisiatif Diplomatik"
  AST_domestic_industry: "Industri Dalam Negeri"
  AST_domestic_industry_desc: "Kita tidak bisa bergantung pada industri pertahanan sekutu untuk memasok kebutuhan kita jika perang terjadi. Kita harus mengembangkan industri kita sendiri sehingga kita siap menghadapi apa pun yang akan terjadi."
  AST_a_democratic_bulwark: "Benteng Demokrat"
  AST_a_democratic_bulwark_desc: "Untuk bisa bertahan melawan ancaman fasis dan komunis, demokrasi harus memimpin. Pemerintah harus menerapkan kebijakan langkah-langkah proaktif untuk memastikan bahwa warga negara terwakili dalam aparatur pemerintahan, dan bahwa ketidakpuasan politisi dapat dipuaskan dengan bergabung dengan partai-partai demokratis yang berbeda dan bukan dengan ideologi yang merugikan."
  AST_the_pacific_pact: "Pakta Pasifik"
  AST_the_pacific_pact_desc: "Inisiatif Pasifik Lyons pada tahun 1934 menjalin kontak antara Australia dan negara-negara besar di Asia, sehingga kita tidak lagi bergantung pada pejabat Inggris untuk mewakili kepentingan kita. Jika kita dapat memanfaatkan hubungan tersebut untuk memastikan negara-negara Asia tidak melakukan agresi terhadap Australia, maka hal tersebut akan menjadi tujuan utama upaya diplomasi kita. Ini mungkin merupakan upaya yang menantang, namun bermanfaat."
  AST_a_collapsing_league_of_nations: "Liga Bangsa-Bangsa yang Runtuh"
  AST_a_collapsing_league_of_nations_desc: "Liga Bangsa-Bangsa sedang runtuh – sebuah inisiatif yang bermaksud baik, sayangnya berakar pada harapan yang tidak realistis. Kebijakan sanksi dengan mudah menjadi tindakan kosong, terlebih lagi ketika tidak ada angkatan bersenjata yang tersedia untuk mencegah negara-negara yang sulit diatur. Persenjataan kembali kita harus dimulai."
  AST_department_of_munitions: "Departemen Amunisi"
  AST_department_of_munitions_desc: "Untuk memasok pasukan kita di garis depan dengan baik, kita perlu mempercepat produksi amunisi kita. Dengan membentuk Departemen Amunisi, kita dapat memastikan peningkatan pengawasan terhadap produksi komponen pertahanan."
  AST_call_for_a_referendum: "Panggilan untuk Referendum"
  AST_call_for_a_referendum_desc: "Kami ingin meningkatkan kendali pemerintah federal; namun kami memerlukan persetujuan pemilih terlebih dahulu. Dengan mengadakan referendum, kita bisa meminta persetujuan mereka."
  AST_rural_concessions: "Konsesi Pedesaan"
  AST_rural_concessions_desc: "Perwakilan pedesaan dari Country Party memperoleh suara yang sangat sedikit untuk memerintah sendirian, namun dengan menyambut baik pengaruh mereka dalam politik Australia, kami sebagai partai yang memerintah saat ini mungkin akan memperoleh dukungan tambahan."
  AST_rural_concessions_tt: "§Y$AST_country_party_influence_uap$§! akan menambah suara partai yang berkuasa ketika Fokus selesai."
  AST_solidarity_by_the_empire: "Solidaritas oleh Kekaisaran"
  AST_solidarity_by_the_empire_desc: "Hingga saat ini, Kerajaan Inggris telah membimbing kita melalui perang dan perdamaian. Kami akan terus menghargai nasihatnya dan berkolaborasi dalam persiapan menghadapi potensi konflik."
  AST_solidarity_by_the_empire_modifier: "Solidaritas oleh Kekaisaran"
  AST_wool_agreement: "Perjanjian Wol"
  AST_wool_agreement_desc: "Karena wol menjadi salah satu produk komersial terbesar Australia, ekspornya tidak hanya memberikan kontribusi terhadap keuntungan tetapi juga meningkatkan hubungan dengan negara-negara pengimpor. Namun Inggris menuntut semuanya, sebagian dengan tujuan menggunakannya untuk seragam tentaranya, tetapi juga dalam negosiasi dengan negara-negara yang kekurangan wol. Kami akan menyetujui tuntutan Inggris."
  AST_australian_war_cabinet: "Kabinet Perang Australia"
  AST_australian_war_cabinet_desc: "Sebagaimana diperintahkan oleh Inggris, kami akan membentuk Kabinet Perang kami sendiri. Dengan melakukan hal ini, kita dapat memastikan pengambilan keputusan yang efektif dan strategis dengan membiarkan badan tersebut fokus hanya pada keamanan nasional."
  AST_singapore_strategy: "Strategi Singapura"
  AST_singapore_strategy_desc: "Strategi Singapura merupakan komponen inti kebijakan pertahanan Australia, dan sebagai pangkalan bagi kapal-kapal Angkatan Laut Kerajaan Inggris yang ditempatkan di Pasifik, wilayah Singapura sendiri adalah yang paling penting. Kami akan meyakinkan Inggris untuk melakukan pembangunan pertahanan tambahan, sementara kami sendiri memperkuat kemampuan angkatan laut Australia."
  AST_singapore_strategy_tt: "Setelah §Y180§! hari (§YSingapura§!):\nTambahkan §G2§! §YPangkalan Udara§!.\nTambahkan §G2§! §YPangkalan Angkatan Laut§!.\nTambahkan §G1§! §YBenteng Pesisir§!."
  AST_british_war_cabinet: "Kabinet Perang Inggris"
  AST_british_war_cabinet_desc: "Perang telah pecah, dan Inggris telah membentuk Kabinet Perang untuk memastikan upaya perang Sekutu dilakukan secara efisien. Mereka telah memanggil kami untuk menyampaikan pandangan kami mengenai masalah ini juga, sehingga Perdana Menteri akan berangkat untuk mewakili kepentingan Australia."
  potential_consequence_tt: "§YPotensi akibat§!:"
  AST_british_pacific_fleet: "Armada Pasifik Inggris"
  AST_british_pacific_fleet_desc: "Kehadiran Inggris di Pasifik akan menjadi sangat penting untuk mencegah dan mempertahankan diri dari kapal musuh yang memperluas dominasi angkatan laut mereka ke arah selatan. Sebagai bagian dari [Root.GetFactionName], kami akan mengambil tindakan untuk membentuk struktur komando gabungan untuk melindungi perairan pantai kami."
  AST_all_dressed_up: "Semua Berdandan"
  AST_all_dressed_up_desc: "Jika tentara Australia berperang melawan Inggris, pabrik-pabrik Inggris akan memperlengkapi mereka."
  AST_overseas_loyalties: "Loyalitas Luar Negeri"
  AST_overseas_loyalties_desc: "Kami akan melanjutkan kontribusi kami dalam perang di luar negeri, membuktikan kembali bahwa tidak ada wilayah yang asing bagi tentara Australia. Perang tidak terjadi pada kita – kitalah yang mengalaminya."
  AST_the_ultimate_overseas_duty: "Tugas Utama di Luar Negeri"
  AST_the_ultimate_overseas_duty_desc: "Perdana Menteri Inggris telah salah menjalankan tanggung jawabnya sedemikian rupa sehingga ketidakpercayaan menyebar di antara para menterinya sendiri. Menzies telah memberikan kesan yang sangat kuat selama kunjungannya untuk menghadiri Kabinet Perang Inggris, dan sekarang beberapa orang berpendapat bahwa dia mungkin merupakan pilihan yang lebih baik bagi Inggris. Dengan dia di kendali Persemakmuran, kita dapat memanfaatkan kesetiaan Menzies kepada [AST.GetName] dan meningkatkan otoritas."
  AST_the_ultimate_overseas_duty_tt: "Dengan §Y$AST_robert_menzies$§! sebagai Pemimpin di §Y[ENG.GetNameDef]§!, kita dapat di Fokus §Y$AST_a_change_of_authority$§! menjadi §Y$autonomy_associated_dominion$§!."
  AST_pleading_britain: "Memohon Inggris"
  AST_pleading_britain_desc: "Perang pasti akan terjadi, dan hal ini membuat kita bertekuk lutut. Dengan segala hormat terhadap semangat ANZAC kami dan reputasi para Diggers, kapasitas perang Australia akan cepat habis tanpa [ENG.GetName] datang membantu kami. Perdana Menteri akan mengirim kabel [ENG.GetLeader] sesegera mungkin."
  AST_bound_once_more: "Terikat Sekali Lagi"
  AST_bound_once_more_desc: "Jalan kita telah terpecah, namun akan menyatu kembali. [ENG.GetNameDefCap] dan [AST.GetName] keduanya sedang mengalami perubahan nasional, namun jarak antara kita yang diakibatkan oleh hal ini hanyalah dampak yang tidak disengaja dan merugikan. Setidaknya di pihak kita. Kita akan bersekutu sekali lagi, dan menaklukkan rintangan-rintangan yang menghadang perubahan bangsa kita secara bersatu."
  AST_eng_to_ast_faction_tt: "§Y[ENG.GetName]§! dan mata pelajarannya bergabung dengan §Y[AST.GetFactionName]§!."
  AST_faction_leader_tt: "Ditetapkan sebagai ketua Fraksi §Y[AST.GetFactionName]§!"
  AST_eng_as_faction_leader_tt: "([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
  AST_australian_command: "Komando Australia"
  AST_australian_command_desc: "Karena pentingnya pertahanan dan keamanan Australia menjadi jelas bahkan pada [ENG.GetNameDef], reorganisasi pasukan gabungan kita diperlukan. Dengan lebih banyaknya pasukan Inggris yang ditempatkan di bawah komando Australia, upaya perang yang lebih efisien dapat dilakukan."
  AST_taking_the_helm: "Mengambil Helm"
  AST_taking_the_helm_desc: "Dengan meluasnya pengaruh kita di Asia Tenggara, kemampuan angkatan laut kita harus tumbuh untuk mempertahankannya. Kami akan memprioritaskan investasi berkelanjutan pada Angkatan Laut Australia, dan menegaskan kendali atas laut timur."
  AST_eastern_focus: "Fokus Timur"
  AST_eastern_focus_desc: "Jika perang Inggris adalah perang Australia, maka perang Australia adalah perang Inggris juga. Invasi Jepang sudah lama terjadi, dan kita tidak akan lagi menerima sikap pasif yang hanya menunggu sampai konflik tersebut jatuh ke tangan kita. Kami akan menunjukkan kepada Jepang apa arti tekad Australia, sementara Inggris membuktikan kesetiaannya dengan deklarasi paling berani: deklarasi perang."
  AST_eastern_focus_tt: "Misi akan memungkinkan §Y[ENG.GetNameDef]§! untuk segera mendeklarasikan perang terhadap §Y[JAP.GetNameDef]§!, dan memaksa mereka untuk melakukannya jika mereka belum melakukannya dalam waktu 180 hari. §Y[ENG.GetNameDefCap]§! dapat menunda tanggal penyelesaian misi dengan mendanai pembangunan pertahanan Australia."
  AST_holding_the_battlefield: "Memegang Medan Perang"
  AST_holding_the_battlefield_desc: "Banyak tentara Australia yang berjatuhan di luar negeri, hanya karena upaya mereka dianggap sebagai upaya Inggris. Australia menuntut pengaruh yang lebih besar dalam perundingan bersama [ENG.GetNameDef] dalam konferensi perdamaian; jika tidak, kontribusi kami mungkin terhenti."
  AST_holding_the_battlefield_tt: "§YPengurangan biaya§! untuk tindakan §YBoneka§! dan §YAmbil Negara§! dalam Konferensi Perdamaian dengan §Y[ENG.GetNameDef]§!."
  AST_a_change_of_authority: "Perubahan Otoritas"
  AST_a_change_of_authority_desc: "Dari negara yang patuh, Australia telah tumbuh menjadi negara yang dihormati dan tegas, dan inilah saatnya untuk mengambil langkah terakhir untuk menjadi salah satu kekuatan dunia. Sebagai pemimpin [AST.GetFactionName], teman harus menghormati kita, dan musuh takut pada kita. Dengan terus menggali dan bertahan, Australia tidak akan menyerah."
  AST_a_change_of_authority_tt: "§Y[ROOT.GetName]§! sekarang dapat menyatakan perang.\n§Y[ROOT.GetName]§! sekarang dapat menolak seruan perang.\n§Y[ROOT.GetName]§! tidak lagi mentransfer Skor Perdamaian apa pun kepada Tuannya."
  AST_reinforcements: "Bala bantuan"
  AST_reinforcements_desc: "Kami akan mempersiapkan wilayah utara yang sebagian besar belum berkembang dengan instalasi pertahanan dan pangkalan udara."
  AST_weekly_stability_tt: "Stabilitas Mingguan: §G+1,00%§!"
  AST_ending_overseas_conscription: "Mengakhiri Wajib Militer di Luar Negeri"
  AST_ending_overseas_conscription_desc: "Tentara kita harus segera meninggalkan pantai asing; mereka dibutuhkan di sini."
  AST_unlocking_conscription_1903_tt: "Diperlukan untuk membuka §YHukum Wajib Militer§!."
  AST_unlocking_further_conscription_tt: "Untuk §YWajib Militer Ekstensif§! atau §YLayanan berdasarkan Persyaratan§!, Anda juga memerlukan salah satu dari fokus berikut; §Y$AST_british_pact$§! (Fasis), §Y$AST_refuse_british_wars$§! (Fasis), §Y$AST_toe_the_line$§! (Fasis), §Y$AST_from_picket_line_to_front_line$§! (Komunis), atau §Y$AST_part_with_colonizer$§! (Komunis)."
  AST_unlocking_conscription_tt: "Jika Anda juga memiliki §Y$AST_invoke_the_1903_defence_act$§! Anda akan membuka semua §YHukum Wajib Militer§! yang tersisa."
  AST_an_uncle_for_father_figure: "Sosok Paman untuk Ayah"
  AST_an_uncle_for_father_figure_desc: "Kami kekurangan persenjataan modern dan karena itu akan memanggil [USA.GetName], meminta agar mereka memasok kami."
  AST_seven_million_britishers: "Tujuh Juta Orang Inggris"
  AST_seven_million_britishers_desc: "Meskipun [ENG.GetLeader] ragu-ragu untuk memberikan janji apa pun kepada kami, kami harus percaya pada komitmennya dan komitmen Inggris terhadap [AST.GetNameDef] ketika ada tekanan. Bagaimanapun, kita hanya berjumlah tujuh juta orang Inggris."
  AST_seven_million_britishers_reinforcements_tt: "§YJika $AST_reinforcements$ belum selesai§!:"
  AST_seven_million_britishers_conscription_tt: "§YJika $AST_ending_overseas_conscription$ belum selesai§!:"
  AST_seven_million_britishers_uncle_tt: "§YJika $AST_an_uncle_for_father_figure$ belum selesai§!:"
  AST_we_endured: "Kami Bertahan"
  AST_we_endured_desc: "Prediksi akan terjadinya konflik pada awalnya mungkin terlalu mengejutkan, namun dengan menggunakannya untuk mempercepat perluasan kemampuan pertahanan kita, hal ini ternyata mempunyai tujuan. Kami bertahan, dan kami akan bertahan, sekarang berkomitmen penuh pada tugas utama kami: memenangkan perang."
  AST_under_the_rule_of_canberra: "Di Bawah Pemerintahan Canberra"
  AST_under_the_rule_of_canberra_desc: "Meningkatnya ketegangan di antara negara-negara Pasifik sungguh mengkhawatirkan, dan dengan Inggris yang terlibat dalam konflik yang terjadi di wilayah tersebut, kemampuan Inggris untuk menyelamatkan kita tampaknya tidak masuk akal. Jika kita ingin merekonstruksi Persemakmuran Inggris sehingga negara-negara di Samudera Pasifik dan Hindia dikelola langsung dari Canberra, kita mungkin dapat bersatu dalam satu front — bahkan tanpa [ENG.GetNameDef]."
  AST_its_fight_work_or_perish: "Ini Bertarung, Bekerja, atau Binasa"
  AST_its_fight_work_or_perish_desc: "Perang telah dimulai, dan hanya satu hal yang tersisa: membuktikan bahwa kita siap menghadapinya."
  AST_no_foreign_battlefields: "Tidak Ada Medan Perang Asing"
  AST_no_foreign_battlefields_desc: "Hal ini sudah lama terjadi, namun pada akhirnya, pemerintah akan menyatakan bahwa tidak ada paksaan yang akan diterapkan terhadap warga negara mana pun untuk bertugas di medan perang asing."
  AST_no_foreign_battlefields_modifier: "Tidak Ada Medan Perang Asing"
  AST_platypus_modifier: "Platipus Berbakat"
  AST_aerial_defense: "Pertahanan Udara"
  AST_aerial_defense_desc: "Jika kita tidak mampu, dan kita tidak mampu, memiliki angkatan laut terapung yang setara dengan kekuatan dunia, maka kita masih mampu mempertahankan armada udara yang setara dengan apa pun yang dapat digunakan untuk melawan kita."
  AST_ratify_westminster_adoption_act: "Ratifikasi Undang-Undang Adopsi Westminster"
  AST_ratify_westminster_adoption_act_desc: "Terlepas dari kontroversi yang mungkin ditimbulkan oleh perubahan kebijakan yang sudah lama ada, kita sudah lama terlambat untuk meratifikasi Undang-Undang Adopsi Westminster. Kita akan memilih sendiri perang mana yang akan menjadi milik kita."
  AST_ratify_westminster_adoption_act_tt: "£GFX_trigger_no Dapat menolak seruan perang"
  AST_administer_the_mandate: "Menjalankan Amanat"
  AST_administer_the_mandate_desc: "Setelah memerintah Nugini di bawah mandat Liga Bangsa-Bangsa sejak tahun 1920, dan karena Papua telah menjadi wilayah luar [AST.GetName] hampir sejak Federasi, bagian timur Papua Nugini akan menjadi tambahan alami bagi wilayah inti [AST.GetName]. Kini setelah Liga Bangsa-Bangsa dibubarkan, peluang untuk melakukan reorganisasi federal telah terbuka."
  AST_a_rational_request: "Permintaan Rasional"
  AST_a_rational_request_desc: "Strategi Singapura berpegang pada teori, namun hanya teori saja. Henry Wynter dan suara-suara keras lainnya selama ini memang benar; Inggris kemungkinan besar akan menduduki benuanya sendiri jika perang Pasifik pecah, dan strategi yang dibangun berdasarkan bantuan Inggris tidak akan bertahan. Kami akan meminta kendali atas Singapura sehingga kami sendiri yang bertanggung jawab atas pertahanan lautan kami."
  add_trait_to_theorist_tt: "Tambahkan sifat pada §YTeoretikus§!:"
  AST_volunteers: "Relawan"
  AST_volunteers_desc: "Memiliki pilihan adalah hal yang penting; kemampuan untuk menolak seruan senjata tidak berarti Australia akan selalu melakukan hal yang sama. Warga Australia mempunyai hak untuk memperjuangkan apa yang benar, baik di negaranya sendiri maupun di negara lain."
  AST_until_the_tide_of_battle_swings: "Sampai Gelombang Pertempuran Berayun"
  AST_until_the_tide_of_battle_swings_desc: "Dalam pernyataan publik, kami akan menegaskan bahwa waktu untuk mengabaikan ancaman yang terjadi di halaman belakang rumah kita telah habis. Kami menolak untuk menerima kebijakan bahwa perjuangan di Pasifik harus diperlakukan sebagai bagian subordinat dari konflik umum; Australia akan segera bersiap menghadapi invasi."
  AST_walls_and_whispers: "Dinding dan Bisikan"
  AST_walls_and_whispers_desc: "Tembok yang tidak dapat ditembus dan dipasangkan dengan permukaan tanah menciptakan potensi besar bagi keamanan nasional. Langkah-langkah harus diambil untuk menempatkan pertahanan darat dan pantai secara lebih baik di seluruh wilayah kita, dan untuk mendirikan markas intelijen di dalamnya."
  AST_united_states_as_our_keystone: "Amerika Serikat sebagai Batu Kunci Kami"
  AST_united_states_as_our_keystone_desc: "Kami tahu permasalahan yang dihadapi Inggris. Kita tahu bahayanya penyebaran kekuatan, tapi kita juga tahu, bahwa Australia bisa maju dan Inggris masih bisa bertahan. Oleh karena itu, kami bertekad bahwa Australia tidak akan ikut serta, dan kami akan mengerahkan seluruh energi kami untuk menyusun rencana tersebut, dengan Amerika Serikat sebagai landasannya."
  AST_liberty_loans: "Pinjaman Kebebasan"
  AST_liberty_loans_desc: "Dari pengalamannya sebagai Bendahara – yang merupakan yang terhebat di negara ini, bahkan ada yang mengklaim – Ben Chifley telah membuktikan kemampuannya dalam mengelola perekonomian di masa perang. Berdasarkan rekomendasinya, kami akan mendorong warga negara kami untuk mentransfer kelebihan pendapatan pribadi ke tabungan, dan berinvestasi dalam pinjaman perang."
  AST_inevitably_independent: "Pastinya Mandiri"
  AST_inevitably_independent_desc: "Meskipun Partai Persatuan Australia selalu menghargai kewarganegaraan Inggris, ketidakpedulian [ENG.GetNameDef] terhadap kepentingan Australia memaksa kami untuk mendeklarasikan kemerdekaan dan memprioritaskan pertahanan kami sendiri. Sekarang, ketika dinas luar negeri dalam perang Inggris sudah tidak lagi menjadi isu, bahkan kelompok anti-loyalis pun lebih cenderung untuk mengikuti aturan tersebut; Oleh karena itu, wajib militer yang lebih luas akan menemui lebih sedikit perlawanan."
  AST_bring_on_the_giant: "Bawa Raksasa itu"
  AST_bring_on_the_giant_desc: "Sebagai bangsa yang bersatu dan otonom, keberanian kita akan segera diuji. Sisi lain Pasifik tampaknya memiliki kepentingan yang sama dengan kita, dan dengan industri militernya yang berkembang dengan baik, [USA.GetNameDef] dapat memberikan keuntungan besar bagi dirinya sendiri dan Australia dengan menyewakan sebagian dari pasokannya yang melimpah kepada pasukan kita."
  AST_bring_on_the_giant_tt: "Jika §Y[USA.GetNameDefCap]§! setuju:\n§Y+50§! unit §YKonvoi§! ditambahkan ke persediaan nasional."
  AST_allied_after_all: "Bagaimanapun, Sekutu"
  AST_allied_after_all_desc: "Meskipun kemerdekaan Australia merupakan suatu keharusan, semua kolaborasi dengan penguasa lama kita tidak akan berhenti. Kami akan tetap setia kepada [ENG.GetFactionName], seperti yang selalu kami lakukan, namun bertujuan untuk mendapatkan pengaruh yang lebih besar di dalam faksi."
  AST_the_pacific_resistance: "Perlawanan Pasifik"
  AST_the_pacific_resistance_desc: "Kemerdekaan Australia akhirnya tiba, dan sudah sepantasnya kita juga melepaskan diri dari upaya perang Inggris. Dengan mengupayakan persatuan dengan [USA.GetNameDef], kita dapat membentuk strategi komando bersama yang menghargai kepentingan Australia sementara kita secara mandiri mengambil kendali penuh atas industri pertahanan kita sendiri dan perluasannya."
  AST_the_pacific_resistance_tt1: "§YAustralia§! bergabung dengan §Y[USA.GetFactionName]§!."
  AST_the_pacific_resistance_tt2: "§Y[USA.GetName]§! bergabung dengan §YPerlawanan Pasifik§!."
  AST_conscription_at_last: "Wajib Militer Akhirnya"
  AST_conscription_at_last_desc: "Kemandirian memang terasa manis, karena kita menyadari bahwa kita kini mempunyai kekuatan untuk memprioritaskan pertahanan kita sendiri — namun kekuatan itu juga disertai dengan tanggung jawab. Wajib militer tidak boleh ditingkatkan dengan mudah, namun dengan adanya perang, hal ini menjadi suatu keharusan."
  AST_equal_training: "Pelatihan yang Setara"
  AST_equal_training_desc: "Kerja sama dengan sekutu harus diasah, bukan sekadar dianggap berfungsi tanpa berpikir panjang. Australia akan mengambil inisiatif untuk menyelenggarakan kamp pelatihan bersama untuk negara-negara [ROOT.GetFactionName], dan memastikan bahwa semua prajurit menerima pelatihan yang sama ketatnya."
  AST_a_northern_barrier: "Penghalang Utara"
  AST_a_northern_barrier_desc: "Musuh datang dari utara, dan di hadapannya terdapat negara-negara kecil yang tidak siap sehingga mereka dapat menyerang sesuka hati sebelum akhirnya tiba di depan pintu kita. Jika kita bersatu dengan [INS.GetNameDef] untuk membentuk satu penghalang, kita mungkin masih mempunyai kesempatan untuk menahan mereka."
  AST_demand_resources: "Sumber Daya Permintaan"
  AST_demand_resources_desc: "Agresor ekspansionis mengincar Indochina bukan hanya karena wilayahnya sendiri, tapi juga sumber daya yang dimilikinya. Jika kekayaan berakhir di tangan musuh, maka hal itu hanya akan memperpanjang perang, sementara kekayaan yang ada di tangan kita dapat membantu mengakhirinya. Kami akan meminta kendali atas sumber daya ini; jika pemiliknya menolak untuk bekerja sama, mereka tidak lebih baik dari musuh."
  AST_demand_resources_tt: "Membuka §Y$AST_resource_acquisition_cat$§! Keputusan untuk meminta pembagian sumber daya negara-negara Asia Tenggara."
  AST_reclaim_the_lost_territory: "Rebut kembali Wilayah yang Hilang"
  AST_reclaim_the_lost_territory_desc: "Selama proses menyatukan koloni-koloni Australia menjadi sebuah federasi, Selandia Baru akhirnya memutuskan untuk tidak ambil bagian. Namun sejak saat itu, Konstitusi terus mendefinisikan Selandia Baru sebagai salah satu negara bagian Persemakmuran Australia yang potensial, dan mengizinkan penerimaan negara tersebut. Kami akan mengingatkan tetangga-tetangga kami di wilayah timur akan hal ini, dan berpendapat bahwa situasi dunia saat ini menuntut persatuan."
  AST_reclaim_the_lost_territory_tt: "([NZL.GetFlag]§Y[NZL.GetName]§!) Menyerahkan seluruh angkatan darat, laut, dan udara ke §Y[AST.GetNameDef]§!"
  AST_australia_first: "Australia Pertama"
  AST_australia_first_desc: "Kekuatan Partai Tengah yang berhaluan ekstrim kanan hanya berumur pendek, berakhir dengan pembubarannya pada tahun 1935. Namun sesuatu yang baru mulai muncul, yang berasal dari ide-ide pengusaha dan aktivis politik William John Miles. Namun, jika tidak ada tindakan yang diambil untuk memobilisasi sentimen tersebut, sentimen tersebut mungkin akan berkurang secepat munculnya sentimen tersebut. Oleh karena itu, tindakan harus diambil."
  AST_pankhurst_walsh: "Adela Pankhurst Walsh"
  AST_pankhurst_walsh_desc: "Dalam pembentukan resmi Gerakan Australia Pertama, kami akan menunjuk Adela Pankhurst Walsh sebagai presiden. Sebagai pendiri Australian Women's Guild of Empire, Pankhurst Walsh telah lama – sambil mempertahankan hubungan dekat dengan Women’s Guild yang berbasis di London – telah lama menganjurkan nilai kewarganegaraan Inggris. Nilai tersebut akan menjadi prinsip inti gerakan kami: hubungan yang berkelanjutan dengan Inggris."
  AST_stephensen: "PR Stephensen"
  AST_stephensen_desc: "Dalam pembentukan resmi Gerakan Australia Pertama, kami akan menunjuk P.R. Stephensen sebagai presiden. Sebagai penasihat sastra William John Miles, Stephensen berbagi pandangan isolasionis dan nasionalis mentornya. Hal ini akan membentuk dua prinsip inti dari konstitusi gerakan kami: kemerdekaan dari Inggris dan penyatuan budaya Australia."
  AST_stephensen_tt: "Pilihan presiden untuk §YGerakan Pertama Australia§! menentukan tindakan yang mungkin dilakukan di masa depan."
  AST_leave_eng_faction_tt: "Apabila tingkat otonomi ditingkatkan menjadi §YBebas§! sebagai subjek §Y[ENG.GetNameDef]§!, [AST.GetName] akan keluar dari §Y[ENG.GetFactionName]§!."
  AST_a_growing_womens_guild: "Persatuan Wanita yang Berkembang"
  AST_a_growing_womens_guild_desc: "Sejak didirikan pada tahun 1928, Australian Women's Guild of Empire telah menganjurkan kerja sama industri untuk memerangi masalah ekonomi nasional. Demi kebaikan negara, warga negara harus membantu pemerintahnya, bukan menentangnya. Dengan Pankhurst Walsh sebagai presiden Australia First, kita dapat menyebarkan pesan ini lebih jauh melalui gerakan politiknya."
  AST_realize_the_value_of_british_citizenship: "Sadarilah Nilai Kewarganegaraan Inggris"
  AST_realize_the_value_of_british_citizenship_desc: "Kekuasaan [ENG.GetNameDefCap] atas [AST.GetName] telah lama berfungsi sebagai perisai pelindung dan cahaya penuntun bagi bangsa kita. Dari Inggris kita datang, dan dari Inggris kita akan tetap tinggal – selama hal itu masih bermanfaat bagi kita."
  AST_the_bolsheviks_counterforce: "Kekuatan Kontra Bolshevik"
  AST_the_bolsheviks_counterforce_desc: "Cabang Investigasi selama beberapa dekade telah melakukan investigasi terhadap aktivitas kelompok subversif. Upaya mereka untuk menekan ancaman sayap kiri sangatlah bernilai, dan tidak boleh diabaikan karena para penentang Australia First justru berkomitmen untuk menolak pertumbuhan kita. Kami akan mencari posisi di kantor intelijen Australia, dan memastikan bahwa ancaman nyata terhadap keamanan nasional diprioritaskan."
  AST_public_meetings_tt: "Membuka §YGerakan Pertama Australia§! Keputusan untuk memobilisasi anggota dan menggalang Dukungan Fasisme."
  AST_rile_up_veterans: "Bangkitkan Para Veteran"
  AST_rile_up_veterans_desc: "Pada awal Depresi Besar, para veteran Perang Dunia I bersatu dalam kelompok paramiliter sayap kanan untuk melawan kebangkitan komunisme. Sekalipun kelompok-kelompok tersebut telah bubar, kebangkitan Australia First mungkin cukup untuk membawa mereka kembali, dan membiarkan obor anti-komunisme menyala lebih terang dari sebelumnya."
  AST_eureka_stockade_monument_rally: "Reli Monumen Eureka Stockade"
  AST_eureka_stockade_monument_rally_desc: "Pada tahun 1854, dalam Pertempuran Eureka Stockade, para penambang emas Australia berperang sengit melawan pasukan kolonial karena biaya izin penambangan yang tidak masuk akal dan perpajakan tambang emas. Ketidakpuasan terhadap kekuasaan Inggris terlihat jelas pada saat itu, dan hal yang sama juga terjadi pada saat ini. Kita akan berkumpul di monumen pertempuran dan melakukan unjuk rasa untuk memisahkan diri dari Inggris."
  AST_australian_pivot_modifier: "Poros Australia"
  AST_well-being_of_the_community: "Kesejahteraan Masyarakat"
  AST_well-being_of_the_community_desc: "Cita-cita Kristiani tentang kehidupan dan keluarga harus dihargai tinggi oleh penduduk Australia. Namun, dengan tingkat kelahiran yang buruk dalam beberapa tahun terakhir, tidak dapat disangkal bahwa cita-cita ini masih belum cukup dijunjung tinggi. Demi kesejahteraan masyarakat, kami akan meluncurkan kampanye yang mempromosikan kehidupan keluarga."
  AST_for_crown_and_empire: "Untuk Mahkota dan Kekaisaran"
  AST_for_crown_and_empire_desc: "Sebagai bekas jajahan Persemakmuran, adat istiadat [ENG.GetNameDef] adalah milik kita sendiri. Meskipun hal ini berarti bahwa banyak institusi di Inggris telah mendapatkan mitra [AST.GetAdjective], namun tidak semuanya demikian. Sebagai perwakilan raja Inggris, Gubernur Jenderal [AST.GetName] telah membawa persatuan Inggris ke benua kita sendiri, namun [AST.GetName] membutuhkan simbol patriotiknya sendiri."
  AST_for_crown_and_empire_trigger_tt: "Lebih dari §Y25.000§! anggota Garda Baru"
  AST_royal_prestige: "Prestise Kerajaan"
  AST_royal_prestige_desc: "Identitas nasional yang kuat dibangun di atas nilai-nilai bersama, dan dilestarikan oleh kehormatan dan kebanggaan. Untuk membedakan dirinya dari Inggris dan negara-negara Persemakmuran lainnya, [AST.GetName] harus membangun kepercayaan nasionalnya, dan berinvestasi dalam upaya yang patut dihormati: armada yang cukup besar untuk menandingi armada Inggris sekalipun."
  AST_reform_the_state: "Reformasi Negara"
  AST_reform_the_state_desc: "Untuk melindungi [AST.GetName] dari krisis dan kebijakan pemerintah yang merugikan bangsa kita alih-alih memperkuatnya, negara [AST.GetAdjective] harus menjalani reorganisasi. Senat akan menjadi Dewan Kerajaan, dan Kabinet akan menjadi Kementerian Kerajaan, yang keduanya bertanggung jawab kepada kepala negara baru kita, yang kewenangannya akan meluas ke seluruh penjuru dunia."
  AST_reform_the_state_tt: "Pilihan Presiden akan memutuskan §Yefek§! untuk fokus berikut §Y$AST_the_councils_advice$§!"
  AST_council_president_tt: "Presiden : §Y[GET_AST_COUNCIL_PRESIDENT]§!"
  AST_council_president_tbd_tt: "Belum dilantik"
  AST_glory_of_the_fleet: "Kemuliaan Armada"
  AST_glory_of_the_fleet_desc: "Melalui komitmen yang pantang menyerah, armada [AST.GetName] telah tumbuh lebih besar dibandingkan sebelum Perjanjian Angkatan Laut Washington, dan pembongkaran kapal perang setelah Perang Dunia I. Sekali lagi, kita siap untuk berperang dan menang di laut, dan dengan investasi lebih lanjut, kita pada akhirnya akan mengklaim lautan sebagai milik kita."
  AST_glory_of_the_fleet_capital_trigger: "Setidaknya §Y4§! Kapal atau Pengangkut Modal"
  AST_glory_of_the_fleet_screen_trigger: "Setidaknya §Y20§! Layar"
  AST_the_councils_advice: "Saran Dewan"
  AST_the_councils_advice_desc: "Dipimpin oleh Presidennya, Dewan Kerajaan memberikan nasihat tentang prioritas nasional yang baru. [GET_AST_THE_COUNCILS_ADVISE_DESC]"
  AST_the_councils_advice_pankhurst_walsh_desc: "Presiden Pankhurst Walsh, yang merupakan seorang imigran dari Inggris, selalu menghargai kerja sama Persemakmuran. Meskipun [AST.GetName] mulai membedakan dirinya dari Inggris dalam banyak hal, Pankhurst menyarankan agar kita membina hubungan Australia-Inggris untuk mendorong bantuan mereka dalam pemisahan kita."
  AST_the_councils_advice_hughes_desc: "Beberapa tahun sebelum perang pecah, Billy Hughes meramalkan konflik dan sejak itu menganjurkan persenjataan kembali. Namun, Presiden tidak menganggap kebutuhan militer [AST.GetName] dapat dipenuhi sepenuhnya, dan oleh karena itu Dewan Kerajaan merekomendasikan investasi lebih lanjut."
  AST_the_councils_advice_hore_ruthven_desc: "Perlindungan wilayah harus dihargai di atas segalanya; jika kita tidak mempunyai tanah untuk dipertahankan, kekuatan militer tidak ada gunanya. Dewan Kerajaan sepakat dalam keyakinannya bahwa perbatasan kita harus diperkuat."
  AST_president_pankhurst_walsh_flag: "§Y$AST_adela_walsh$§! adalah Presiden Dewan Mahkota"
  AST_president_pankhurst_walsh_effect_tt: "Jika $AST_adela_walsh$ adalah Presiden Dewan Mahkota:"
  AST_president_hughes_effect_tt: "Jika $AST_billy_hughes$ adalah Presiden Dewan Mahkota:"
  AST_president_hore_ruthven_effect_tt: "Jika $AST_alexander_hore_ruthven$ adalah Presiden Dewan Mahkota:"
  AST_no_king_without_kingdom: "Tidak Ada Raja Tanpa Kerajaan"
  AST_no_king_without_kingdom_desc: "Jika warga Australia ingin tumbuh menjadi patriotik terhadap bangsanya, negara tersebut harus bersatu dalam kedaulatan. Dengan armada yang berkembang pesat, dan institusi pemerintahan kita sekarang melayani negara dengan baik, kesendirian dan kemandirian tidak lagi menjadi hal yang menakutkan bagi [AST.GetName]. Akhirnya, [AST.GetName] akan menjadi sebuah kerajaan."
  AST_heavy_is_the_head: "Berat adalah Kepala"
  AST_heavy_is_the_head_desc: "Dengan adanya kekuasaan maka akan ada pula tanggung jawab, dan dengan semakin besarnya kekuatan militer [AST.GetNameDef], maka tidak masuk akal lagi jika wilayah sekitar harus dilindungi oleh negara-negara yang jelas-jelas tidak mempunyai kapasitas untuk melakukan hal tersebut. Kami akan bertanya kepada sekutu kami apakah mereka benar-benar dapat melindungi wilayah mereka di Asia Tenggara, atau apakah wilayah tersebut akan lebih terpelihara di wilayah Australia."
  AST_enemy_of_the_realm: "Musuh Alam"
  AST_enemy_of_the_realm_desc: "Ekspansi Jepang seakan tidak mengenal batas, mengabaikan kedaulatan dan keutuhan kerajaan dimanapun jangkauannya. [AST.GetNameDefCap] tidak akan mendukungnya; jika [JAP.GetNameDef] mengancam wilayah Australia, maka Australia akan mengancam wilayah mereka. Demi Kerajaan dan Negara, [AST.GetNameDef] berperang."
  AST_enemy_of_the_realm_at_peace_tt: "Jika tidak berperang dengan §Y[JAP.GetName]§!:"
  AST_enemy_of_the_realm_at_war_tt: "Jika sudah berperang dengan §Y[JAP.GetName]§!:"
  AST_a_throne_upon_the_seas: "Singgasana Di Atas Lautan"
  AST_a_throne_upon_the_seas_desc: "Waktunya telah tiba bagi Kerajaan tersebut untuk akhirnya membuktikan dirinya layak berada di lautan. Negara adidaya angkatan laut tidak lagi bisa membungkam kita, tidak ketika ombak mulai datang dan layar kita sedang tegang. Pada akhirnya, lautan akan menjadi milik kita."
  AST_a_throne_upon_the_seas_tt: "Setiap negara musuh dengan perkiraan rasio kekuatan angkatan laut §Y100%§! atau lebih dibandingkan dengan Australia:\n(§YTidak ada negara§!):"
  AST_refuse_british_wars: "Tolak Perang Inggris"
  AST_refuse_british_wars_desc: "Kampanye Gallipoli pada Perang Besar, menunjukkan kecerobohan [ENG.GetNameDef] dalam memperlakukan pasukan ekspedisi kita, membuat gagasan kampanye asing lainnya atas namanya sama sekali tidak terpikirkan. Warga Australia menuntut agar darah tidak lagi tertumpah di bawah komando Inggris, sehingga memaksa pemerintah untuk bertindak; Undang-Undang Westminster harus diratifikasi."
  AST_walls_like_uluru: "Dinding Seperti Uluru"
  AST_walls_like_uluru_desc: "Australia adalah sebuah benua tersendiri. Jika kita tidak ingin menjadi tidak berdaya tanpa perisai Kekaisaran, kita harus menempa perisai kita sendiri. Garis pantai akan diperkeras, pelabuhan-pelabuhan akan dibentengi, dan pendekatan-pendekatan yang ada akan menjadi berbahaya bagi siapapun yang menganggap negara ini sebagai hadiah yang mudah."
  AST_at_the_gates: "Di Gerbang"
  AST_at_the_gates_desc: "Dunia sedang bergerak menuju perang dan Australia tidak boleh lengah. Pabrik-pabrik dan galangan kapal di negara ini harus beralih ke tingkat yang lebih tinggi. Ini bukanlah persiapan untuk konflik orang lain, ini adalah persiapan untuk kelangsungan hidup kita sendiri."
  AST_at_the_gates_hidden: "$AST_at_the_gates$"
  AST_at_the_gates_hidden_desc: "$AST_at_the_gates_desc$"
  AST_the_guild_for_the_war_effort: "Persekutuan untuk Upaya Perang"
  AST_the_guild_for_the_war_effort_desc: "Persatuan Kerajaan Wanita Australia dibangun untuk melayani Kerajaan. Tujuannya dialihkan seluruhnya. Jaringan organisasi luas yang dibangunnya kini akan menyalurkan energinya ke industri perang, rumah sakit, dan rantai pasokan Australia yang mandiri."
  AST_for_the_southern_cross: "Untuk Salib Selatan"
  AST_for_the_southern_cross_desc: "Southern Cross tidak terbang di atas Inggris. Itu terbang di atas kita. Identitas Australia adalah sesuatu yang nyata, sesuatu yang diperoleh, sesuatu yang patut dipertahankan. Kebanggaan nasional yang baru sedang ditempa, bukan dipinjam dari London atau ditentukan oleh lembaga-lembaga yang jauh, namun tumbuh di sini, dari tanah ini, di bawah bintang-bintang."
  AST_through_the_gates: "Melalui Gerbang"
  AST_through_the_gates_desc: "Persiapan telah digantikan oleh urgensi. Program Pertahanan Nasional diperluas dengan dukungan penuh dari industri Australia. Fasilitas-fasilitas baru semakin bertambah seiring dengan bertambahnya fasilitas-fasilitas yang sudah ada, target produksi direvisi naik, dan batas antara produksi sipil dan kebutuhan militer perlahan-lahan terhapus."
  AST_toe_the_line: "Ikuti Garisnya"
  AST_toe_the_line_desc: "Kenyamanan yang biasa dirasakan warga Australia selama tahun-tahun kemakmuran kini harus dikesampingkan. Penjatahan, jam kerja yang lebih panjang, dan panggilan untuk melayani adalah harga dari kemandirian. Mereka yang menjawab akan menemukan negara yang siap mendukung mereka. Namun negara tidak akan terlalu sabar terhadap mereka yang percaya bahwa pengorbanan adalah beban orang lain."
  AST_crush_the_gates: "Hancurkan Gerbangnya"
  AST_crush_the_gates_desc: "Pembangunannya selesai. Industri Australia kini beroperasi dengan landasan perang, outputnya disalurkan sepenuhnya untuk pertahanan dan proyeksi kekuatan nasional. Apa pun badai yang akan terjadi, Australia akan menghadapinya bukan sebagai negara yang enggan melakukan mobilisasi."
  AST_national_defense: "Pertahanan Nasional"
  AST_national_defense_desc: "Melalui investasi yang disengaja dan arahan nasional, Australia telah membangun basis industri yang mampu menopang pertahanannya sendiri. Pabrik-pabrik dan galangan kapal beroperasi di bawah pengawasan negara, dan outputnya diukur bukan berdasarkan keuntungan, melainkan berdasarkan kebutuhan negara."
  modify_AST_national_defense_tt: "Memodifikasi §Y$AST_national_defense$§! dengan:"
  AST_nauru_pact: "Pakta Nauru"
  AST_nauru_pact_desc: "Dengan hambatan awal untuk mengambil alih kekuasaan yang masih menghadang kita, persoalan kemerdekaan nampaknya masih jauh; namun, otonomi Australia bukan hanya kepentingan kami. Sebagai imbalan atas jaminan [GER.GetNameDef] atas kedaulatan kami jika terjadi perlawanan Inggris terhadap Australia First atau akhirnya memisahkan diri dari Persemakmuran, kami akan, setelah berkuasa, mengembalikan salah satu pulau Pasifik mereka yang hilang: Nauru."
  AST_australian_culture_investments: "Investasi Kebudayaan Australia"
  AST_australian_culture_investments_desc: "Dengan esainya The Foundations of Culture in Australia, Stephensen telah mempengaruhi terbentuknya gerakan puisi Jindyworobak dan memperjelas satu hal: budaya Australia harus diprioritaskan. Pemerintah tampaknya mengabaikan sepenuhnya nilai seniman dan penulis, namun kita tidak akan melakukannya. Dengan memobilisasi pendukung Jindyworobak dan Australia terlebih dahulu, kita akan merangsang perkembangan budaya."
  AST_australian_culture_investments_tt: "Setelah §Y365§! hari:"
  AST_australia_first_party_focus: "Partai Pertama Australia"
  AST_australia_first_party_focus_desc: "Jumlah anggota Australia First telah meningkat sedemikian rupa sehingga kemajuan gerakan ini tidak dapat ditahan lagi. Sudah saatnya masyarakat Australia menyambut suara nasionalis yang baru dan paling lantang: Partai Pertama Australia."
  AST_australia_first_party_req_tt: "§YAustralia First Party§! telah didirikan."
  AST_in_from_the_cold: "Masuk Dari Dingin"
  AST_in_from_the_cold_desc: "Warga negara yang anti-demokrasi tidak perlu lagi bersembunyi. Perlakuan buruk yang dialami negara kita di bawah pemerintahan sebelumnya akhirnya terungkap, dan inilah saatnya suara-suara baru harus didengar."
  AST_absorb_the_uap: "Menyerap UAP"
  AST_absorb_the_uap_desc: "Meskipun Partai Persatuan Australia (United Australia Party) selalu bersifat liberal, partai ini telah menarik berbagai macam pembangkang politik. Namun, dengan adanya partai politik baru, para anggota UAP – mau atau tidak – mungkin tidak punya banyak pilihan selain mendukung perjuangan pemerintah saat ini. Kami akan merekrut anggota yang paling menonjol."
  AST_big_business_pact: "Pakta Bisnis Besar"
  AST_big_business_pact_desc: "Dalam upaya kami untuk melindungi industri dalam negeri, kami menemukan banyak pendukung di kalangan pemimpin bisnis terkemuka. Mereka akan mendukung tujuan politik dan militer kita, sebagai imbalan atas kebijakan yang meningkatkan keuntungan mereka."
  AST_big_business_pact_tt: "Membuka §YPakta Bisnis Besar§! Keputusan yang berdampak pada tujuan Industri dan Konstruksi."
  AST_autarky: "Autarki"
  AST_autarky_desc: "Ketergantungan pada perdagangan luar negeri sangatlah berbahaya, terutama pada saat konflik; Industri Australia harus diprioritaskan, bukan dikalahkan oleh impor. Hanya dengan membatasi undang-undang perdagangan kita, kita dapat melindungi perekonomian domestik dan memastikan bahwa Australia dapat memasok kebutuhannya sendiri."
  AST_energy_independence: "Kemandirian Energi"
  AST_energy_independence_desc: "Ketergantungan pada perdagangan luar negeri sangatlah berbahaya, terutama pada saat konflik; kemandirian energi sangat penting untuk memastikan bahwa Australia dapat berfungsi bahkan di saat-saat paling sulit sekalipun. Dengan berinvestasi pada kilang, kita dapat mendorong produksi energi dalam negeri."
  AST_the_kings_men: "Anak buah Raja"
  AST_the_kings_men_desc: "Terlepas dari reputasi Garda Baru sebagai penenang fasis, kenyataannya lebih beragam. Meskipun beberapa kelompok sempalan, serta pendiri gerakan itu sendiri, menganut cita-cita fasis, sebagian besar anggotanya tidak menganut paham fasis. Sangat patriotik dan mengabdi pada monarki, para Pengawal akan dengan senang hati berjuang demi Mahkota."
  AST_the_kings_men_tt: "Buat §Y[GET_AST_NG_INF_UNITS] [AST.GetAdjective]§! unit infanteri"
  AST_ng_inf_units_tt: "Dapatkan §Y1§! unit infanteri untuk setiap §Y10,000§! anggota Garda Baru"
  AST_campbells_men: "Lelaki Campbell"
  AST_campbells_men_desc: "Gerakan Australia Pertama, dalam pertumbuhannya yang makmur, membangkitkan gerakan lain yang sudah lama tertidur. Garda Baru kembali turun ke jalan, namun untungnya, kali ini para anggotanya berada di pihak pemerintah. Kami akan memasukkan mereka ke dalam partai kami dan membiarkan mereka berjuang demi Australia, seperti yang selalu mereka lakukan."
  AST_campbells_men_tt: "Bentuk unit milisi §Y[GET_AST_NG_MIL_UNITS] [AST.GetAdjective]§!"
  AST_ng_mil_units_tt: "Dapatkan §Y1§! unit milisi untuk setiap §Y5.000§! anggota Garda Baru"
  AST_the_commander_returns: "Komandan Kembali"
  AST_the_commander_returns_desc: "Angin yang familier mengaduk abu seorang legenda, yang masih hidup dan merangkak di bawah abu. Bapak Garda Baru belajar dari pengalaman pahit bahwa tidak semua mitra bisa menjadi sekutu ketika perbedaan ideologi menjadi terlalu besar, dan bahwa persatuan sipil sama pentingnya bagi pertahanan nasional seperti halnya kekuatan militer. Jika dipercaya memegang kendali Australia First, ia akan mengabdikan pasukannya yang paling setia untuk mendisiplinkan para pembangkang politik."
  AST_the_commander_returns_trigger_tt: "Lebih dari §Y15.000§! anggota Garda Baru"
  remove_2_offsite_dockyard: "Hapus §R2§! §YGalangan Kapal Luar Peta§!."
  AST_british_pact: "Pakta Inggris"
  AST_british_pact_desc: "Meskipun terjadi perubahan politik baru-baru ini, [AST.GetName] masih tertarik untuk melanjutkan kerja sama dengan tanah air lama. Mengingat [ENG.GetNameDef] tersebar luas di seluruh dunia, kesediaan kita untuk berbagi beban dengan menawarkan kerja sama militer patut diapresiasi."
  AST_naurus_return_to_german_hands: "Kembalinya Nauru ke Tangan Jerman"
  AST_naurus_return_to_german_hands_desc: "Kini setelah Australia First sepenuhnya memegang kendali negara ini, inilah saatnya janji Nauru dipenuhi, dan bagi sekutu Jerman kita untuk mewujudkan kesepakatan mereka. [AST.GetName] pada akhirnya akan melepaskan diri dari belenggu Persemakmuran, dan membiarkan Inggris tidak mempunyai suara apa pun dalam masalah ini."
  AST_naurus_return_to_german_hands_tt: "'§YPakta Nauru§!' menjadi aktif."
  AST_naurus_return_to_german_hands_tt_2: "'§YPakta Nauru§!' aktif."
  AST_the_winner_takes_it_all: "Pemenang Mengambil Semuanya"
  AST_the_winner_takes_it_all_desc: "Meskipun pengorbanan pulau Nauru demi kerja sama Jerman dulunya tampak masuk akal, kini hal itu tidak lagi terjadi. Dengan kemampuan kami yang terbukti kuat, kami akan mengupayakan ekspansi ke Kepulauan Solomon dan Selandia Baru, bahkan jika hal tersebut dapat menambah pengkhianatan kami terhadap Pakta Nauru. Bagaimanapun, Kepulauan Solomon akan menjadi wilayah Jerman lainnya yang hilang dari tangan Australia."
  AST_resist_western_intruders: "Melawan Penyusup Barat"
  AST_resist_western_intruders_desc: "Negara-negara Barat nampaknya terpaksa ikut campur dalam urusan di Pasifik, namun hal itu tidak akan bertahan lama. Sebelum mereka mencapai pantai kita, kita akan mencapai pantai mereka, membuktikan bahwa [AST.GetName] bukanlah negara yang menyerah pada tuntutan."
  AST_invasion_preparation_tt: "Waktu Persiapan Invasi: §G-20.0%§!"
  AST_naval_invasion_penalty_tt: "Penalti Invasi: §G-20.0%§!"
  AST_expand_the_fort: "Perluas Benteng"
  AST_expand_the_fort_desc: "Pasifik bagian barat bukan untuk diperintah oleh [USA.GetNameDef]. Pulau-pulau yang diklaim Amerika adalah milik negara-negara Asia Timur, dan seiring dengan berkembangnya pengaruh Australia, kitalah yang akan mengklaim pulau-pulau tersebut."
  AST_integrate_the_fort: "Integrasikan Benteng"
  AST_integrate_the_fort_desc: "Setelah memerintah Nugini di bawah mandat Liga Bangsa-Bangsa sejak tahun 1920, dan karena Papua telah menjadi wilayah luar [AST.GetName] hampir sejak Federasi, bagian timur Papua Nugini akan menjadi tambahan alami bagi wilayah inti [AST.GetName]. Sebagai bagian dari upaya kami untuk menyatukan budaya Australia, ini akan menjadi langkah berikutnya."
  AST_defying_american_interference: "Menentang Intervensi Amerika"
  AST_defying_american_interference_desc: "Bayangan [USA.GetNameDefCap] membayangi kita, mengancam akan ikut campur bila tindakan kita tidak sejalan dengan kepentingannya. Dengan kekuatan global sebesar ini yang memegang tangan besinya pada [PHI.GetNameDef], negara-negara Asia Timur tidak akan pernah benar-benar menjadi bagian dari Asia Timur. [AST.GetName] tidak boleh tunduk pada otoritas penyusup asing mana pun — Filipina akan menjadi milik kami."
  AST_the_pacific_garrison: "Garnisun Pasifik"
  AST_the_pacific_garrison_desc: "Meski perlindungan Asia Tenggara dan Pasifik berada dalam kepentingan Inggris, kawasan ini jauh dari Kepulauan Inggris. Sebagai imbalan atas dukungan mereka dalam pasokan, kami akan menawarkan untuk mengambil alih komando pertahanan wilayah tersebut, sehingga memungkinkan [ENG.GetNameDef] untuk mengarahkan perhatiannya ke tempat lain."
  AST_vichy_out_of_africa: "Vichy Keluar dari Afrika"
  AST_vichy_out_of_africa_desc: "Jatuhnya atau kerja sama Vichy France adalah salah satu tujuan utama [ENG.GetNameDef]. Sebagai tanda niat baik, [AST.GetName] akan bergabung dan mengejar koloni Perancis di Afrika sampai mereka ditundukkan."
  AST_vichy_out_of_africa_tt1: "Tambahkan klaim ke wilayah §YVichy France§! di §YAfrika§! melalui §YVichy Out of Africa§! Fokus."
  AST_vichy_out_of_africa_tt2: "Tambahkan klaim ke wilayah §YVichy France§! di §YAfrika§! melalui Keputusan §YVichy Out of Africa§!."
  AST_vichy_africa_claim_flag: "Klaim oleh [AST.GetFlag]§Y[AST.GetName]§! dari seluruh wilayah §YVichy Prancis§! di §YAfrika§! ditambahkan ke §YTak Dapat Disangkal Milik Kita§!."
  AST_vichy_claim_tt: "Klaim oleh [AST.GetFlag]§Y[AST.GetName]§! ditambahkan ke §YTak dapat disangkal Milik Kami§!."
  vichy_in_africa_trigger: "§YVichy Perancis§!: Semua negara bagian yang dikontrol:\nBerada di §YAfrika§!"
  vichy_wargoal: "Mendapatkan §YAnnex§! tujuan perang melawan §YVichy France§!."
  AST_britain_supplying_ships: "Inggris Memasok Kapal"
  AST_britain_supplying_ships_desc: "Dari beban menjaga pantai sekutu Inggris, menjadi jelas bahwa armada [ROOT.GetName] perlu diperluas. Memang benar bahwa [ENG.GetNameDefCap] akan memasok kapal kepada kita."
  AST_hand_in_glove: "Serahkan Sarung Tangan"
  AST_hand_in_glove_desc: "Dengan melakukan ekspansi ke wilayah utara, kita dapat meningkatkan pengaruh Australia terhadap diplomasi dan konflik di Asia Tenggara. Kami telah membuktikan kemampuan kami untuk melindungi kepentingan Inggris dan kepentingan kami sendiri, sehingga [ENG.GetNameDef] harus memahami mengapa wilayah terpencil mereka lebih baik berada di tangan kami."
  AST_claim_french_indochina: "Klaim Indochina Prancis"
  AST_claim_french_indochina_desc: "Dengan nasib Perancis yang belum ditentukan, nasib koloni-koloninya pun tidak lagi ditentukan. Negara-negara lain mungkin berupaya untuk menguasai Indochina Prancis, namun mereka tidak akan bisa memenangkan negara kita."
  AST_undeniably_ours: "Tidak dapat disangkal milik kita"
  AST_undeniably_ours_desc: "Terlepas dari apa yang diplomasi berikan kepada kita, diplomasi tidak akan pernah memberikan kita semua. Dalam kondisinya yang rapuh, perbatasan Prancis Vichy hanya berfungsi sebagai saran saja, dan mengabaikan kesempatan untuk menduduki sepenuhnya wilayah mereka adalah tindakan yang sangat tidak bijaksana. Tidak dapat dipungkiri, waktu perang telah tiba."
  AST_done_meddling: "Selesai ikut campur"
  AST_done_meddling_desc: "Selalu setia kepada negara lama, [AST.GetName] terus berperang melawan Inggris dengan kepala tegak. Warga Australia adalah orang yang bisa diandalkan, namun bukan berarti mereka bisa dianggap remeh. Sementara [AST.GetName] memperebutkan [ENG.GetNameDef], [ENG.GetNameDef] juga akan memperebutkan [AST.GetName]."
  AST_northern_advancement: "Kemajuan Utara"
  AST_northern_advancement_desc: "Meskipun Australia lebih suka mengurus urusan politiknya sendiri, kita tidak bisa dibiarkan begitu saja kecuali kita menjadikan diri kita sendiri sebagai ancaman. [INS.GetNameDefCap] adalah negara seperti kita, korban dari penyusup Eropa yang tidak kunjung pergi. Dengan mengajukan klaim kami sendiri atas wilayah tersebut, kami mengirimkan sinyal yang jelas: negara-negara Pasifik tidak perlu khawatir."
  AST_soothing_australian_fears: "Ketakutan Australia yang Menenangkan"
  AST_soothing_australian_fears_desc: "Meskipun beberapa pejabat pemerintah percaya pada kemungkinan kerja sama Australia dan Jepang, namun masyarakat Australia tidak percaya. Setelah sekian lama takut akan invasi Jepang, gagasan untuk bergandengan tangan dengan calon agresor yang sama sulit dipahami oleh sebagian besar orang. Maka kita akan meredakan ketakutan mereka dengan mempersiapkan perang."
  AST_soothing_australian_fears_tt: "Setelah §Y180§! hari:"
  AST_dividing_the_pacific: "Membagi Pasifik"
  AST_dividing_the_pacific_desc: "Australia First mengadvokasi perdamaian dengan [JAP.GetNameDef], yang mendefinisikan negara ini – tidak seperti kebanyakan warga negara Australia – sebagai sekutu potensial di Pasifik dan bukan sebagai ancaman yang terus mengancam. Ketika kekuatan [AST.GetName] meluas, masuk akal jika [JAP.GetName] juga setuju, dan potensi konflik antara kedua negara diselesaikan sebelum konflik tersebut sempat muncul."
  AST_dividing_the_pacific_ast_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
  AST_dividing_the_pacific_jap_gain_tt: "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
  AST_dividing_the_pacific_tt1: "§GKami memperoleh§!:"
  AST_dividing_the_pacific_tt2: "§RMereka memperoleh§!:"
  AST_dividing_the_pacific_tt3: "§Y[AST.GetName]§! transfer wilayah yang dikuasai berikut:"
  AST_against_war_and_fascism: "Melawan Perang dan Fasisme"
  AST_against_war_and_fascism_desc: "Gerakan Melawan Perang dan Fasisme adalah upaya internasional yang disponsori Komintern cabang Australia untuk memobilisasi pekerja melawan kekuatan reaksioner. Meskipun momentumnya telah hilang dalam beberapa tahun terakhir, kitalah yang harus meneruskannya sekali lagi."
  AST_world_peace: "Perdamaian Dunia"
  AST_world_peace_desc: "Gerakan Melawan Perang dan Fasisme telah bekerja keras memproduksi majalah bertajuk 'Perdamaian Dunia' yang mengungkap kejahatan gerakan Fasis di Jerman, Italia, khususnya pada masa Perang Saudara Spanyol. Didorong oleh artikel-artikel di dalamnya, para sukarelawan sangat bersemangat untuk bergabung dalam perjuangan melawan Fasisme."
  AST_red_fred: "Fred Merah"
  AST_red_fred_desc: "Fred Paterson 'Merah', yang menjabat sebagai anggota dewan di Townsville, telah membuktikan dirinya sebagai pemimpin yang populer dan cakap. Dengan banyaknya anggota partai yang lebih menyukai kepemimpinannya dibandingkan Jack Miles, Paterson telah muncul sebagai pilihan yang wajar untuk memimpin Australia menuju masa depan sosialis."
  AST_workers_defence_corps_sparks_anew: "Korps Pertahanan Pekerja Berkobar Lagi"
  AST_workers_defence_corps_sparks_anew_desc: "Korps Pertahanan Pekerja awalnya dibentuk untuk mempertahankan garis piket dan pemogokan. Dengan meningkatnya agresi dari kelompok-kelompok seperti Garda Baru, kelompok ini telah berkumpul kembali untuk sekali lagi bertindak sebagai tameng bagi mereka yang melakukan protes demi hak dan peluang yang lebih baik."
  AST_a_controversial_recruitment: "Rekrutmen yang Kontroversial"
  AST_a_controversial_recruitment_desc: "Maurice Blackburn adalah seorang pengacara sosialis terkenal, yang terkenal karena membela hak-hak pekerja dalam perjuangan hukum melawan majikan yang menindas. Sebagai anggota Partai Buruh, kesetiaannya dipertanyakan karena hubungannya dengan Gerakan Melawan Perang dan Fasisme yang lebih radikal."
  AST_from_picket_line_to_front_line: "Dari Garis Piket hingga Garis Depan"
  AST_from_picket_line_to_front_line_desc: "Ketika taktik intimidasi yang dilakukan pihak-pihak yang menentang pembebasan kelas pekerja semakin agresif, pertahanan kita sendiri harus berkembang sebagai responsnya. Dengan setiap insiden, para pekerja menjadi lebih bertekad, dan semakin banyak orang yang bergabung dengan Korps Pertahanan."
  AST_pig_iron_protests: "Protes Besi Babi"
  AST_pig_iron_protests_desc: "Dalam banyak kasus, para pelaut kita tidak setuju dengan pemerintah mereka, dan terutama dalam kasus penjualan pig iron ke negara-negara yang bertikai. Warga Australia tidak berkepentingan untuk berpartisipasi dalam agresi atau mengangkut peralatan yang digunakan untuk melawan warga sipil yang tidak bersalah, sehingga [AST.GetName] juga tidak boleh; menyerukan mogok."
  AST_part_with_colonizer: "Berpisah Dengan Penjajah"
  AST_part_with_colonizer_desc: "Akar perjuangan kita terletak pada Kerajaan Inggris dan sistem kapitalis yang diterapkannya dari jauh. Tidak lagi. Ketika Inggris terganggu oleh krisis yang terjadi di negaranya sendiri, sekaranglah waktunya untuk menentukan nasib kita dan menentukan arah kita sendiri sebagai negara yang bebas dan mandiri."
  AST_take_it_to_the_streets: "Bawa ke Jalanan"
  AST_take_it_to_the_streets_desc: "Aksi industri adalah salah satu alat paling ampuh yang kita miliki untuk mendorong perubahan dalam masyarakat, dan kita harus menggunakannya untuk melawan sistem yang dirancang hanya untuk mengeksploitasi. Sekaranglah waktunya untuk mengambil kembali alat-alat produksi, para pekerja Australia, bersatu!"
  AST_workers_educational_association: "Asosiasi Pendidikan Pekerja"
  AST_workers_educational_association_desc: "Asosiasi Pendidikan Pekerja adalah organisasi internasional yang berdedikasi untuk membuat pendidikan dapat diakses oleh pekerja. Kita harus membentuk cabang kita sendiri, karena kesetaraan kesempatan yang sesungguhnya dimulai di dalam kelas."
  AST_off_leash: "Lepas Tali"
  AST_off_leash_desc: "Pekerja pelabuhan adalah tulang punggung aksi serikat pekerja di Australia. Sebagai pulau berukuran benua, tidak mengherankan jika tenaga kerja maritim memainkan peran penting dalam perekonomian kita. Ini adalah waktu yang tepat untuk melepaskan diri dari segala hambatan dan melepaskan pengaruh-pengaruh industri yang tidak bertanggung jawab."
  AST_a_national_housing_commission: "Komisi Perumahan Nasional"
  AST_a_national_housing_commission_desc: "Perumahan telah lama menjadi isu kontroversial. Setiap orang berhak mendapatkan tempat tinggal, namun sering kali kebutuhan dasar ini dimanfaatkan untuk merugikan pekerja, dan hal ini mengakibatkan penindasan ekonomi. Tidak lagi. Kami akan menuntut akses yang adil terhadap perumahan bagi semua."
  AST_guaranteed_employment: "Jaminan Pekerjaan"
  AST_guaranteed_employment_desc: "Sosialisme terlalu sering diabaikan dengan tuduhan kemalasan atau ketergantungan yang ditujukan pada mereka yang membutuhkan. Ini harus diakhiri. Yang kami cari hanyalah kesempatan yang adil di tempat kerja, dan upah yang adil untuk menghidupi keluarga kami."
  AST_equal_pay: "Gaji yang Sama"
  AST_equal_pay_desc: "Adalah suatu kekeliruan yang terus-menerus terjadi bahwa mereka yang memiliki alat-alat produksi berhak mendapatkan lebih dari mereka yang bekerja di dalamnya. Pemilik dan manajer tidak bekerja lebih keras, dan mereka juga tidak lebih terampil. Dengan menyamakan upah, hasil kerja dapat dibagi secara lebih adil ke seluruh masyarakat."
  AST_all_for_one_one_for_all: "Semua untuk Satu, Satu untuk Semua"
  AST_all_for_one_one_for_all_desc: "'Semua untuk satu, dan lebih banyak untuk saya' telah lama menjadi seruan kaum borjuis, keserakahan mereka menuntut lebih banyak dan memberi lebih sedikit. Janji bahwa kekayaan akan mengalir ke bawah adalah sebuah kebohongan. Hal ini harus dibagi secara merata, oleh semua dan untuk semua."
  AST_abolition_of_private_property: "Penghapusan Milik Pribadi"
  AST_abolition_of_private_property_desc: "Roda-roda industri dilumuri dengan darah para pekerja. Kita harus mengakhiri kebrutalan akumulasi dan menghapuskan kepemilikan pribadi sepenuhnya. Semuanya akan dibagikan, dari masing-masing sesuai kemampuannya, hingga masing-masing sesuai kebutuhannya."
  AST_centralized_production: "Produksi Terpusat"
  AST_centralized_production_desc: "Kekuatan pasar kacau dan tidak setara. Jika kita ingin membangun masyarakat yang benar-benar adil, negara harus mengambil peran sentral dalam menentukan apa yang diproduksi, oleh siapa, dan di mana. Birokrasi kami menyimpan catatan yang cermat dan berada pada posisi terbaik untuk menetapkan kuota produksi."
  AST_public_institutions: "Institusi Publik"
  AST_public_institutions_desc: "Masyarakat membutuhkan banyak layanan penting agar dapat berfungsi, mulai dari layanan kesehatan dan perumahan hingga penitipan anak dan transportasi. Negara harus menyediakan hal-hal tersebut secara universal, menjamin akses bagi semua orang tanpa batasan. Terbebas dari keharusan untuk menghasilkan keuntungan pribadi, sistem ini dapat beroperasi secara efisien untuk melayani kebutuhan seluruh masyarakat."
  AST_planned_extraction: "Ekstraksi yang Direncanakan"
  AST_planned_extraction_desc: "Kami beruntung memiliki tanah yang kaya akan sumber daya. Kita harus memastikan kekayaannya diekstraksi secara sistematis dan diarahkan ke industri yang paling membutuhkannya."
  AST_maritime_commission: "$USA_maritime_commission$"
  AST_maritime_commission_desc: "$USA_maritime_commission_desc$"
  AST_state_research_funding: "Pendanaan Penelitian Negara"
  AST_state_research_funding_desc: "Untuk memaksimalkan efektivitas lembaga penelitian kita, negara harus menjadi sumber pendanaan utama, mengarahkan upaya ke tempat yang paling membutuhkan, dan memastikan bahwa informasi tetap dikontrol dengan ketat. Bagaimanapun, kita tidak bisa mengambil risiko warga negara kita diganggu oleh gagasan yang salah."
  AST_graziers_to_industry: "Penggembala ke Industri"
  AST_graziers_to_industry_desc: "Selama Depresi Hebat, kota-kota kita menjadi sepi karena para pekerja mencari stabilitas di pedesaan. Kini, dengan kendali atas alat-alat produksi, kita dapat menarik mereka kembali ke industri. Kita harus menekankan kepada mereka kebutuhan bangsa ini: bahwa tungku-tungku industri harus dipenuhi oleh keringat manusia."
  AST_free_school_policy: "Kebijakan Sekolah Gratis"
  AST_free_school_policy_desc: "Untuk membentuk warga negara teladan, kita harus membentuk ide-ide mereka. Dari buaian hingga universitas, negara akan membimbing apa yang diajarkan kepada anak-anak kita. Dengan cara ini, kita dapat memastikan generasi mendatang memahami pentingnya cita-cita sosialis, dan bahaya pasar bebas... dan pemikiran bebas."
  AST_free_healthcare_policy: "Kebijakan Layanan Kesehatan Gratis"
  AST_free_healthcare_policy_desc: "Masyarakat kita berhak untuk bebas dari penyakit dan cedera, dan jika hal terburuk terjadi, mereka tidak boleh mengalami kemalangan seperti yang terjadi di masyarakat lain. Kami akan memberikan akses universal terhadap layanan kesehatan, rumah sakit, dan dokter – karena masyarakat yang sehat adalah masyarakat yang produktif."
  AST_the_publics_australia: "Australia untuk Publik"
  AST_the_publics_australia_desc: "Kita telah mengesampingkan tatanan lama dan membangun sebuah negara yang hadir untuk banyak orang, bukan untuk segelintir orang. Industri, tenaga kerja, dan sumber daya kini melayani masyarakat secara keseluruhan. Ini adalah Australia milik Publik. Setara, bersatu, dan tidak bisa dipatahkan."
  # 'Cominwealth' over 'Commonwealth' is intentional
  AST_the_australian_commonwealth: "Persemakmuran Australia"
  AST_the_australian_commonwealth_desc: "Inggris pernah mengklaim kepemimpinan atas Persemakmuran, namun visinya telah dirusak oleh kepentingan kapitalis. Kami akan mengambil peran itu dan memimpin negara-negara menuju utopia sosialis bersama."
  AST_union_control_commonwealth: "Membuka keputusan §YUnion Control§!.\nMemungkinkan infiltrasi Komunis ke Selandia Baru, Malaysia, Burma dan akhirnya, India."
  AST_a_comrade_emancipated: "Seorang Kamerad yang Dibebaskan"
  AST_a_comrade_emancipated_desc: "Di seluruh dunia, banyak negara masih terikat oleh rantai kapitalisme, dan rakyatnya tidak mendapatkan kebebasan sejati. Sebagai negara sosialis yang bebas, tugas kita adalah membantu emansipasi mereka. Para pekerja di seluruh dunia, bersatulah, dan kita akan bersama-sama melepaskan rantai ini."
  AST_union_control_local: "Membuka keputusan §YUnion Control§!.\nMemungkinkan infiltrasi Komunis ke Indonesia dan Filipina."
  AST_comintern: "Kesepakatan Kominwealth-Komintern"
  AST_comintern_desc: "Meskipun mereka kadang-kadang ragu-ragu dari prinsip-prinsip Marxis yang sebenarnya, Uni Soviet tetap menjadi pembawa standar internasional pekerja. Dengan bergabung dengan Komintern, kita dapat menyatukan upaya kita untuk membawa obor sosialisme ke seluruh dunia."
  AST_comintern_tt: "Jika §Y[AST.GetName]§! memimpin sebuah faksi, maka faksi tersebut akan bergabung ke dalam Komintern. Jika tidak, §Y[AST.GetName]§! akan bergabung dengan Komintern sendirian."
  AST_southern_academy_of_sciences: "Akademi Ilmu Pengetahuan Selatan"
  AST_southern_academy_of_sciences_desc: "Obor kemajuan berkobar tertiup angin, tenggelam oleh rasa was-was orang-orang yang berpikiran sempit. Kita harus mendirikan Southern Academy of Sciences dan menyalakan mercusuar pencerahan, untuk membimbing dunia menuju utopia sosialis kita."
  AST_for_greater_good: "Demi Kebaikan yang Lebih Besar"
  AST_for_greater_good_desc: "Visi kami mengenai revolusi dunia membutuhkan darah dan pengorbanan. Di banyak tempat, obor sosialisme menyala; kita harus menjawab panggilan tersebut dan mengirimkan dukungan kita untuk memastikan hal itu tidak padam. Bagaimanapun, ini demi kebaikan yang lebih besar (the Greater Good)."
  AST_make_common_cause: "Buatlah Penyebab Bersama"
  AST_make_common_cause_desc: "Di bawah kepemimpinan kami, Persemakmuran mulai makmur, dipandu oleh cahaya sosialisme yang keluar dari kegelapan penindasan kapitalis. Pada saat kritis ini, kita harus memastikan tekad kita tidak terpatahkan dan kita bergerak bersama menuju masa depan yang lebih baik."
  AST_the_red_pacific: "Pasifik Merah"
  AST_the_red_pacific_desc: "Pasifik harus diubah sesuai dengan gambaran revolusi. Di seluruh pulau dan pesisir wilayah kami, kami akan mendukung kebangkitan pemerintahan sosialis dan memastikan bendera merah berkibar dari pantai ke pantai."
  AST_the_irish_anti-britain_pact: "Pakta Anti-Inggris Irlandia"
  AST_the_irish_anti-britain_pact_desc: "Inggris telah terlalu lama berdiri sebagai benteng kapitalisme, dilindungi oleh posisi pulau dan kekuatan angkatan lautnya. Dengan menghasut kerusuhan di kalangan pekerja pelabuhan di Irlandia dan Irlandia Utara, kita dapat menembus pertahanannya dan membuka jalan melintasi Laut Irlandia bagi pasukan kita."
  AST_stretch_the_fleet: "Regangkan Armada"
  AST_stretch_the_fleet_desc: "Inggris masih berdiri sebagai benteng kapitalisme, dilindungi oleh armadanya yang perkasa. Inilah saatnya untuk memperluas kemampuan angkatan laut kita, melakukan perlawanan terhadap mereka, dan menunjukkan kepada dunia pulau mana yang lebih besar."
  AST_chinese_relations: "Hubungan Tiongkok"
  AST_chinese_relations_desc: "Rekan-rekan kami di Tiongkok berjuang demi kelangsungan hidup mereka. Kita mempunyai sarana untuk membantu mereka, namun kita harus bertindak cepat sebelum mereka dikalahkan oleh kekuatan imperialis yang melawan mereka."
  AST_westward_battles: "Pertempuran ke arah Barat"
  AST_westward_battles_desc: "Kekuatan fasis mendominasi wilayah barat dan mengancam kelangsungan hidup kita. Kini, sejalan dengan Komintern, kita harus melawan mereka dan melawan mereka yang akan menghancurkan utopia buruh yang sedang kita bangun."
  AST_strongholds: "Benteng"
  AST_strongholds_desc: "Untuk mengamankan posisi kita di teater baru ini, kita harus mendukung rekan-rekan kita di Irlandia melawan jantung imperialisme kapitalisme. Perjuangan mereka untuk mencapai kemerdekaan memberikan pelajaran berharga saat kita bersama-sama mempersiapkan diri menghadapi tahap konflik global berikutnya."
  AST_out_of_the_den: "Keluar dari Sarang"
  AST_out_of_the_den_desc: "Banyak orang di Irlandia masih menyimpan kebencian yang mendalam terhadap pemerintahan Inggris. Inilah saatnya untuk menunjukkan kekuatan kita dan menarik mereka keluar dari bayang-bayang, menggalang mereka untuk mendukung perjuangan kita melawan musuh bersama."
  AST_end_the_kingdom: "Akhiri Kerajaan"
  AST_end_the_kingdom_desc: "Waktunya telah tiba. Akar kapitalisme imperialis akan tertusuk hingga ke bagian jantungnya yang busuk. Pembebasan pekerja di seluruh Kerajaan Inggris sudah dekat. Akhiri monarki. Akhiri kerajaan. Akhiri penindasan. Pekerja Persemakmuran, bersatu!"
  AST_red_solidarity: "Solidaritas Merah"
  AST_red_solidarity_desc: "Perjuangan di Tiongkok terus berlanjut, ketika jutaan orang menderita dan meninggal. Perjuangan mereka adalah perjuangan kita, dan kita tidak bisa berpangku tangan. Kita bisa melakukan intervensi, ikut menanggung beban mereka, dan memastikan api revolusi tidak padam."
  AST_red_solidarity_tt: "§Y[AST.GetName]§! bergabung dalam perang §Y[PRC.GetNameDef]§! melawan §Y[CHI.GetNameDef]§!. Faksi yang lebih kecil menyerap faksi lain, atau §Y[AST.GetName]§! langsung bergabung dalam perang jika keduanya sudah bersekutu."
  AST_free_the_colonies: "Bebaskan Koloni"
  AST_free_the_colonies_desc: "Api revolusi membakar Kerajaan Inggris yang sedang runtuh. Koloni-koloni tidak lagi menjadi koloni, melainkan negara-negara bebas. Bangkitlah, kawan! Lepaskan belenggu Anda dan bergabunglah dengan revolusi!"
  AST_free_the_colonies_tt: "§Y[AST.GetName]§! menurunkan seluruh bekas jajahan Inggris di bawah kendalinya menjadi boneka terintegrasi."
  AST_battle_of_the_ocean: "Pertempuran Samudera"
  AST_battle_of_the_ocean_desc: "Lautan telah lama menjadi arteri perdagangan global. Kini, saatnya untuk melakukan perlawanan di Pasifik dan memutus sistem yang menopangnya. Perairan akan memerah karena darah para kapitalis korup dan para pahlawan revolusi."
  AST_borderless_solidarity: "Solidaritas Tanpa Batas"
  AST_borderless_solidarity_desc: "Solidaritas. Kata yang menyatukan para pekerja sedunia. Tidak ada batas yang dapat memisahkan kita, tidak ada negara yang dapat berdiri sendiri. Di mana pun perjuangan terjadi, kami akan menjawab seruan tersebut, dan berdiri bersama dalam perjuangan global demi pembebasan."
  AST_an_equal_union: "Persatuan yang Setara"
  AST_an_equal_union_desc: "Meskipun kami membawa panji revolusi, semua yang bergabung dengan kami mempunyai kedudukan yang setara. Dalam persatuan ini, sumber daya, tenaga kerja, dan gagasan dibagikan secara bebas, sehingga membentuk masa depan di mana kemakmuran bersifat kolektif dan tidak ada negara yang lebih unggul dari negara lain."
  AST_expanding_influence: "Memperluas Pengaruh"
  AST_expanding_influence_desc: "Berdiri di sisi kanan sejarah, ide-ide kami berbicara sendiri. Janji akan surga pekerja bukanlah sebuah mimpi, namun sebuah kenyataan yang akan segera terjadi. Kita dapat memperluas visi ini ke luar, mengundang pihak lain untuk bergabung dengan kita dalam membangun masa depan bersama."
  AST_public_works: "Pekerjaan Umum"
  AST_public_works_desc: "Depresi Hebat telah menyebabkan perekonomian Australia berada dalam kesulitan. Kami akan memulai serangkaian program pekerjaan umum untuk mengembalikan masyarakat bekerja dan memulihkan belanja konsumen."
  AST_lang_plan: "Rencana Lang"
  AST_lang_plan_desc: "Meskipun terdapat kontroversi dan lawan politik yang vokal, Jack Lang telah menjadi yang terdepan dalam kebijakan ekonomi. Ia menolak untuk memenuhi kewajiban utang luar negeri, dan menyatakan bahwa mengalihkan dana tersebut ke inisiatif publik akan merangsang pertumbuhan dalam negeri. Lagi pula, Anda tidak bisa mendapatkan darah dari batu."
  AST_exports_for_economic_recovery: "Ekspor untuk Pemulihan Ekonomi"
  AST_exports_for_economic_recovery_desc: "Penentang gagasan Lang malah mengusulkan pemanfaatan pasar luar negeri dan utang untuk mendorong investasi dan penjualan luar negeri, berkomitmen pada ekonomi berorientasi ekspor untuk meningkatkan produksi dalam negeri, lapangan kerja, dan pada akhirnya belanja konsumen."
  AST_the_phosphate_commision: "Komisi Fosfat"
  AST_the_phosphate_commision_desc: "Setelah Perang Besar, Nauru ditempatkan di bawah perwalian bersama Australia, Selandia Baru, dan Inggris. Pada tahun 1919, hak atas semua penjualan fosfat di pulau itu dialihkan kepada wali ini, yang dipimpin oleh Australia. Dengan menggunakan posisi kepemimpinan kami, kami dapat mempengaruhi harga dan mendapatkan harga yang sangat kompetitif untuk pasar domestik kami."
  AST_goods_standard: "Standar Barang"
  AST_goods_standard_desc: "Prinsip inti teori ekonomi Jack Lang adalah penghapusan Standar Emas di Australia, untuk digantikan dengan Standar Barang, yang menghubungkan jumlah uang beredar dengan jumlah barang sebenarnya yang diproduksi. Hal ini memastikan bahwa aliran modal terkait langsung dengan produktivitas domestik dan bukan faktor eksternal."
  AST_standard_gauge_line_to_darwin: "Jalur Pengukur Standar ke Darwin"
  AST_standard_gauge_line_to_darwin_desc: "Kami sudah terlalu lama kekurangan koneksi yang memadai ke wilayah utara kami. Sebagai bagian dari program pekerjaan umum yang lebih luas yang bertujuan untuk mengembalikan uang ke perekonomian, kita dapat membangun jalur kereta api yang menghubungkan kota-kota di selatan ke utara."
  AST_lang_is_right: "Lang Benar"
  AST_lang_is_right_desc: "Ternyata Lang benar! Dengan menolak memprioritaskan kreditor asing dan malah memanfaatkan sistem perbankan kita sendiri secara lebih agresif, kita bisa mendapatkan dana dalam jumlah besar. Hal ini kemudian dapat diarahkan pada perekonomian domestik, menyediakan investasi yang sangat dibutuhkan dan merangsang pertumbuhan."
  AST_within_reach: "Dalam Jangkauan"
  AST_within_reach_desc: "Begitu dekat, namun sejauh ini. Australia adalah negara yang sangat kaya akan sumber daya, dan jika kita menggali lebih dalam, kekayaan yang tak terhitung jumlahnya ada di bawah kaki kita. Dengan perluasan infrastruktur kami, tambang-tambang terpencil pun kini dapat diakses, dan kami berada di ambang era kemakmuran Australia yang didorong oleh kekayaan mineral."
  AST_a_domestic_supply_chain: "Rantai Pasokan Domestik"
  AST_a_domestic_supply_chain_desc: "Salah satu efek samping dari fokus kami pada perekonomian domestik adalah pengembangan sistem produksi yang sangat tangguh. Dengan semua tingkat produksi yang berbasis di dalam negeri, kita sebagian besar terlindungi dari guncangan eksternal."
  AST_broken_hill_propietary_company: "Perusahaan Kepemilikan Broken Hill"
  AST_broken_hill_propietary_company_desc: "The Broken Hill Proprietary Company adalah salah satu produsen pertambangan dan baja terkemuka di Australia. Dijuluki 'The Big Australian' oleh penduduk setempat, perusahaan ini mendominasi industri ini. Dengan peningkatan dramatis dalam permintaan bahan baku, perusahaan berada pada posisi yang tepat untuk pertumbuhan yang lebih pesat."
  AST_radium_hill: "Bukit Radium"
  AST_radium_hill_desc: "Uranium telah ditemukan di Australia Selatan, dan tambang Radium Hill memiliki potensi ekspansi yang signifikan. Meskipun kita masih mengungkap kemungkinan-kemungkinan penuh dari teknologi-teknologi baru ini, jelas bahwa kita sedang berada di ambang Era Atom, dan ini bisa menjadi awal masuknya kita ke dalamnya."
  AST_industrial_expansion: "Ekspansi Industri"
  AST_industrial_expansion_desc: "Depresi Hebat telah melumpuhkan perekonomian negara kita selama beberapa dekade terakhir. Kini setelah kita mempunyai kemauan politik untuk melakukan tindakan yang lebih langsung, kita harus menyalurkannya dengan memperluas basis industri kita, menciptakan lapangan kerja, meningkatkan permintaan akan sumber daya, dan memproduksi lebih banyak barang untuk pasar."
  AST_income_tax_assessment_act: "Undang-Undang Ketetapan Pajak Penghasilan"
  AST_income_tax_assessment_act_desc: "Sistem perpajakan kita berada dalam kondisi yang buruk dan sulit untuk dinavigasi oleh masyarakat, sehingga membutuhkan pengawasan ketat dari pemerintah yang tidak mampu kita tanggung. Dengan merombak dan menyederhanakan ketentuan-ketentuan terkait, kita dapat membuat pengumpulan pajak jauh lebih efisien."
  AST_council_for_scientific_and_industrial_research: "Dewan Penelitian Ilmiah dan Industri"
  AST_council_for_scientific_and_industrial_research_desc: "Dewan Riset Ilmiah dan Industri diperkuat setelah Konferensi Kekaisaran tahun 1923 untuk membantu memperluas basis ekonomi berbagai koloni dan wilayah kekuasaan. Meskipun kontribusinya signifikan, kini saatnya memberikan fokus baru pada badan ini: pengembangan manufaktur dan industri sekunder."
  AST_bring_home_the_farmers: "Bawa Pulang Para Petani"
  AST_bring_home_the_farmers_desc: "Selama Depresi Hebat, kota-kota besar kita mengalami penurunan populasi yang parah karena para pekerja pindah ke pedesaan untuk mencari tenaga kerja di bidang pertanian. Kini, ketika kondisi sudah mulai membaik, kita harus memberikan insentif bagi kembalinya tenaga kerja sehingga kita dapat menghidupkan kembali pabrik dan melanjutkan produksi."
  AST_reverse_wage_cuts: "Membalikkan Pemotongan Upah"
  AST_reverse_wage_cuts_desc: "Untuk memberikan peluang bagi dunia usaha untuk berjuang, kami menerapkan serangkaian pemotongan upah di seluruh perekonomian. Sekarang kita sudah melihat tanda-tanda pemulihan, kita harus mengambil tindakan sebaliknya. Meningkatnya upah menyebabkan daya beli yang lebih besar, membantu mendorong konsumsi dan pertumbuhan ekonomi."
  AST_the_manpower_directorate: "Direktorat Ketenagakerjaan"
  AST_the_manpower_directorate_desc: "Ketika perekonomian kita tumbuh semakin kompleks, kita menghadapi tantangan ketenagakerjaan yang semakin besar. Direktorat ini akan memastikan bahwa orang-orang yang tepat ditempatkan pada peran yang tepat, dengan keterampilan yang tepat, dan pada waktu yang tepat."
  AST_recovery: "Pemulihan"
  AST_recovery_desc: "Untuk pertama kalinya, produk domestik bruto kita telah melampaui tingkat sebelum Depresi. Ini adalah momen yang patut dirayakan, karena satu-satunya arah perekonomian kita saat ini adalah menuju ke atas. Kita sedang memasuki periode pertumbuhan yang kuat, dan inilah saatnya untuk memetik manfaat dari kemakmuran kita yang baru."
  AST_devalued_currency: "Mata Uang yang Devaluasi"
  AST_devalued_currency_desc: "Salah satu cara paling efektif untuk meningkatkan ekspor adalah melalui pelemahan mata uang. Jika pembeli asing dapat membeli lebih banyak barang-barang kita karena uang mereka mempunyai nilai yang lebih besar, maka kita akan menjadi lebih kompetitif secara internasional. Namun hal ini merupakan pedang bermata dua, karena impor dari negara lain juga akan menjadi lebih mahal."
  AST_reverse_industry_tariffs: "Membalikkan Tarif Industri"
  AST_reverse_industry_tariffs_desc: "Di masa lalu, kita telah menggunakan tarif untuk melindungi industri dalam negeri dari persaingan asing. Namun, hal ini telah menyebabkan perang dagang dan tarif balasan terhadap ekspor kita, sehingga menaikkan harga. Kita harus mengurangi hambatan-hambatan ini dan mendorong pengurangan timbal balik untuk membantu memperluas perdagangan."
  AST_foreign_competition: "Persaingan Asing"
  AST_foreign_competition_desc: "Persaingan baik untuk bisnis; ini mendorong inovasi dan efisiensi sekaligus menghilangkan rasa berpuas diri. Dunia ini seperti anjing-makan-anjing, dan kita perlu memastikan bahwa anjing kita adalah yang terbesar, dan kita telah melepaskan kalungnya sehingga ia benar-benar bebas untuk berkompetisi."
  AST_expanding_into_new_markets: "Memperluas Ke Pasar Baru"
  AST_expanding_into_new_markets_desc: "Keuntungan mengandalkan pasar luar negeri dibandingkan pasar dalam negeri sangatlah sederhana. Pasar global sangat luas. Akan selalu ada pasar baru untuk dimasuki; kita hanya perlu menemukan keunggulan kita dan menunjukkan keunggulan barang-barang dan praktik bisnis Australia."
  AST_populate_or_perish: "Berpopulasi atau binasa"
  AST_populate_or_perish_desc: "Ketika Depresi Hebat melanda, angka kelahiran menurun dengan cepat dan sejak itu sulit untuk pulih. Dalam rangka melanjutkan pembangunan dalam negeri, kami akan membentuk Departemen Imigrasi federal untuk melakukan dan mengawasi program imigrasi baru."
  AST_recruitment_drive: "Dorongan Perekrutan"
  AST_recruitment_drive_desc: "Lemahnya kemauan pemerintah-pemerintah sebelumnya, serta ketergantungan mereka yang berlebihan pada Inggris, telah mengakibatkan pengabaian angkatan bersenjata Australia dalam jangka waktu yang lama. Hal ini tidak akan berlaku lagi, karena kami meluncurkan kampanye untuk mendorong perekrutan anggota Angkatan Pertahanan Australia."
  AST_new_deal: "Kesepakatan Baru"
  AST_new_deal_desc: "Protes yang terjadi pada peringatan 150 tahun [AST.GetName] membuktikan bahwa undang-undang kita mengenai warga masyarakat adat harus dipertimbangkan kembali. Atas permintaan aktivis hak-hak Aborigin, kami akan bertemu dengan mereka untuk bersama-sama menentukan jalan menuju kewarganegaraan penuh bagi masyarakat adat."
  AST_the_1938_sesquicentenary_flag: "Peristiwa §YSesquicentenary 1938§! telah terjadi."
  AST_the_1938_sesquicentenary_tt: "Fokus '§YKesepakatan Baru§!' di §YCabang Terisi atau Binasa§! telah tersedia."
  AST_repeal_immigration_restrictions: "Mencabut Pembatasan Imigrasi"
  AST_repeal_immigration_restrictions_desc: "Departemen Imigrasi dibatasi oleh undang-undang usang yang menentukan siapa yang diizinkan berimigrasi ke [AST.GetName]. Meskipun ada risiko menimbulkan kontroversi, kami akan mencabut undang-undang ini dan menetapkan sistem kuota untuk mengendalikan arus imigran."
  AST_womens_armed_services: "Angkatan Bersenjata Wanita"
  AST_womens_armed_services_desc: "Meski mendapat tentangan sengit, pembentukan angkatan bersenjata perempuan akan tetap dilanjutkan. Setiap uluran tangan akan diterima untuk membela [AST.GetName] dari penyerangnya, tanpa memandang gender. Untuk memacu rekrutmen dan pelatihan, pemilihan direktur pasukan adalah hal yang paling penting."
  AST_northern_territory_reconnaissance_unit: "Unit Pengintaian Wilayah Utara"
  AST_northern_territory_reconnaissance_unit_desc: "Letnan Penerbangan dan antropolog Donald Thomson telah mendukung dimasukkannya penduduk Aborigin dalam angkatan bersenjata [AST.GetName], dan pada akhirnya harus diindahkan. Kami akan menugaskan Thomson secara pribadi untuk membentuk unit pengintai yang terdiri dari orang-orang yang memiliki pengetahuan lokal dan keterampilan kerajinan semak untuk mengawasi wilayah kami yang paling terpencil dan tidak ramah sekalipun."
  AST_northern_territory_reconnaissance_unit_tt: "Buka kunci perusahaan pendukung §YUnit Pengintaian Wilayah Utara§!."
  AST_torres_strait_battalion: "Batalyon Selat Torres"
  AST_torres_strait_battalion_desc: "Upaya Perusahaan Selat Torres sebagai garnisun telah dikelola dengan baik, namun anak buahnya memiliki potensi untuk mencapai prestasi lain. Dengan anggotanya yang berasal dari pulau-pulau di lepas pantai utara [AST.GetName], unit ini memiliki pengetahuan luas tentang Selat Torres. Kami akan melatih orang-orangnya sebagai Marinir dan meminta lebih banyak sukarelawan untuk membentuk batalion."
  AST_department_of_aboriginal_affairs: "Departemen Urusan Aborigin"
  AST_department_of_aboriginal_affairs_desc: "Kami akan melaksanakan saran kelompok aktivis hak-hak Aborigin untuk membentuk Departemen Urusan Aborigin yang baru. Departemen ini akan diberi nasihat oleh sebuah komite warisan Aborigin, dan tujuannya adalah untuk memastikan akses penduduk Pribumi terhadap makanan yang layak dan bantuan medis."
  AST_immediate_rights: "Hak Segera"
  AST_immediate_rights_desc: "Tidak ada kelompok populasi dalam [AST.GetName] yang boleh diatur oleh federasi, dan tidak ada warisan yang membatasi pemberian hak-hak sipil seseorang. Dengan menetapkan undang-undang kewarganegaraan kita sendiri dan menjauh dari anggapan bahwa populasi kita hanya terdiri dari warga negara Inggris, hak-hak Australia tidak lagi bersifat bersyarat."
  AST_diverse_army: "Tentara Beragam"
  AST_diverse_army_desc: "Tindakan membela negara bukan hanya sebuah keistimewaan, tapi sebuah hak. Setiap warga Australia yang bersedia harus bisa mendaftar, dan setiap tentara yang ambisius harus bisa naik pangkat."
