  INS_exile_tt: "§Y[HOL.GetNameDefCap]§! akan dapat terus mengungsi ke §Y[INS.GetNameDef]§!."
  INS_army_located_tt: "§Y[HOL.GetNameDefCap]§! memindahkan Angkatan Bersenjatanya ke kita."
  INS_govt_relocated_tt: "§Y[HOL.GetNameDefCap]§! memindahkan Pemerintahannya ke Jawa."
  indonesia_trading_with_us_modifier: "Perjanjian Dagang"
  indonesia_opposing_us_modifier: "Penentangan Dagang"
  indonesia_trading_with_enemy_modifier: "Berdagang dengan Jepang"
  # <Military Branch - Modernize our Army>
  INS_revolution_ended_tt: "Revolusi Nasional telah berakhir"
  # <Empower the Volksraad>
  INS_the_jewel_in_the_crown: "Permata di Mahkota"
  INS_the_jewel_in_the_crown_desc: "Hindia Timur adalah permata paling berkilau dalam mahkota kolonial Belanda, dan kita berniat menjaganya tetap demikian. Melalui Volksraad, suara kita bergema hingga ke Den Haag."
  INSHOL_java: "$HOL_java$"
  INSHOL_java_desc: "$HOL_java_desc$"
  INSHOL_sumatra: "$HOL_sumatra$"
  INSHOL_sumatra_desc: "$HOL_sumatra_desc$"
  INSHOL_borneo_and_the_grote_oost: "$HOL_borneo_and_the_grote_oost$"
  INSHOL_borneo_and_the_grote_oost_desc: "$HOL_borneo_and_the_grote_oost_desc$"
  INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
  INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
  INSHOL_investments_in_civ_railways_tt: "Jika [HOL.GetFlag]§Y[HOL.GetName]§! melengkapi fokus:\n([INS.GetFlag]§Y[INS.GetName]§!: Tambahkan §Y£autonomy_texticon -250.00§!)\nJika [INS.GetFlag]§Y[INS.GetName]§! melengkapi fokus:\nTambahkan §Y£autonomy_texticon 250.00§!"
  INSHOL_investments_in_civ_railways: "Investasi Jalur Kereta Sipil"
  INSHOL_investments_in_civ_railways_desc: "Memenangkan hati rakyat Hindia menuntut investasi nyata pada infrastruktur sipil. Saat ini, jalur kereta api kita utamanya digunakan untuk mengangkut komoditas kargo. Kita harus mengadakan armada kereta penumpang yang melintasi rel-rel di Jawa dan Sumatra."
  INSHOL_continue_exclusive_rights: "Hak Eksklusif untuk De Javasche Bank"
  INSHOL_continue_exclusive_rights_desc: "Gulden Hindia Timur telah kehilangan sebagian besar nilainya selama depresi besar, dan pertumbuhan ekonomi kita terhenti. Kita dapat mencoba menstabilkan Gulden dengan memberikan hak pencetakan eksklusif kepada Bank Jawa, yang dimilikinya hingga tahun 1922."
  INSHOL_peg_indies_guilder_to_dutch_guilder: "Patok Gulden Hindia ke Gulden Belanda"
  INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Gulden Hindia terpuruk parah selama masa depresi. Solusi termudah adalah mematok nilai Gulden Hindia ke Gulden Belanda, mata uang yang jauh lebih stabil. Ini juga akan mempererat ikatan ekonomi dengan tanah air Belanda."
  INSHOL_peg_indies_guilder_to_us_dollar: "Patok Gulden Hindia ke Dolar AS"
  INSHOL_peg_indies_guilder_to_us_dollar_desc: "Meskipun kita bisa mematok Gulden Hindia ke Gulden Belanda, Dolar Amerika Serikat adalah mata uang yang jauh lebih kokoh dan dominan. Mematok kurs ke Dolar memberi kita kemandirian ekonomi yang lebih luas, menjadikan cita-cita pemerintahan mandiri kian terjangkau."
  indonesia_currency_pegged_to_dollar_modifier: "Gulden Hindia dipatok ke Dolar AS"
  INS_direct_rule_tt: "Membuka hukum pendudukan §Y$INS_direct_rule_occupation_law$§! di negara bagian indonesia.\nEfek:\n§GMeningkatkan§! pabrik dan sumber daya dari negara\n§RMenurun§! pertumbuhan kepatuhan\n§RMeningkatkan§! pertumbuhan resistensi"
  INS_local_autonomy_tt: "Membuka hukum pendudukan §Y$INS_local_autonomy_occupation_law$§! di negara bagian indonesia.\nEfek:\nMemberikan §Ykecil§! peningkatan di seluruh\n§GMeningkatkan§! pertumbuhan kepatuhan"
  INS_invest_in_batavian_education_req_tt: "Telah berhasil menyelesaikan setidaknya §Y3§! misi Volksraad"
  INS_invest_in_batavian_education_req_2_tt: "Telah berhasil menyelesaikan setidaknya §Y6§! misi Volksraad"
  INSHOL_eventual_autonomy_req_tt: "Telah berhasil menyelesaikan setidaknya §Y4§! misi Volksraad"
  indonesia_volksraad_passed_12: "Bendera nasional Indonesia telah diakui secara resmi"
  INS_stronghold_java_tt: "Wilayah Bagian Indonesia Mana Saja: Tidak diduduki oleh [ROOT.GetFlag][ROOT.GetNameDefCap]"
  INSHOL_request_east_timor: "Tuntut Pengembalian Timor Timur"
  INSHOL_request_east_timor_desc: "Portugal tidak berhak menduduki Timor; itu adalah sisa-sisa sejarah kolonial yang tak boleh kita biarkan berlanjut, karena Timor adalah bagian tak terpisahkan dari kepulauan Indonesia. Kita akan melayangkan tuntutan resmi kepada Portugal agar mengembalikan Timor kepada kita."
  INS_resist_occupation: "Melawan Pendudukan"
  INS_resist_occupation_desc: "Kemarahan yang dipendam oleh banyak rakyat Indonesia terhadap Belanda tidak boleh membuat kita jatuh ke pelukan Fasisme. Kita harus mengerahkan segala upaya untuk melawan invasi Jepang dan membela tanah air."
  INS_local_resistance: "Perlawanan Lokal"
  INS_local_resistance_desc: "Kita akan membentuk sel-sel perlawanan di wilayah yang belum diduduki, memastikan bahwa jika wilayah tersebut jatuh, kita siap merebutnya kembali pada waktu yang tepat."
  INS_stronghold_java: "Benteng Jawa"
  INS_stronghold_java_desc: "Hindia adalah kepulauan mahaluas yang dihuni beragam suku dengan medan alam yang amat berat. Berusaha mempertahankan setiap jengkal pulau, hutan, dan gunung dari serangan tentara musuh yang jauh lebih besar pasti akan berujung kekalahan. Kendati memilukan meninggalkan saudara-saudara kita di pulau lain, mengevakuasi semua pulau dan memusatkan seluruh kekuatan militer kita di Jawa adalah langkah terbaik bagi keselamatan negara secara keseluruhan."
  INS_silence_nationalists: "Bungkam Simpatisan Nasionalis"
  INS_silence_nationalists_desc: "Invasi Jepang menyebabkan gerakan-gerakan nasionalis revolusioner mulai berpihak pada bala tentara Jepang karena memiliki musuh bersama: Belanda. Kegentingan akibat invasi telah membuat pergerakan ini meluas pada laju yang belum pernah terjadi sebelumnya. Bila kita tidak bertindak sekarang, pergerakan ini akan lepas sama sekali dari kendali kita."
  INS_east_indies_exile_government: "Pemerintah Pengasingan Hindia Timur"
  INS_east_indies_exile_government_desc: "Sayang seribu sayang, terlepas dari segala ikhtiar terbaik kita, Hindia telah jatuh. Namun kita tidak boleh patah arang. Kita harus terus berikhtiar semaksimal mungkin dengan sumber daya terbatas yang tersisa. Kita mungkin kalah dalam satu pertempuran, tetapi kita belum kalah dalam perang ini."
  INS_establish_nefis: "Bentuk NEFIS"
  INS_establish_nefis_desc: "Kita akan membentuk Netherlands East Indies Forces Intelligence Service (NEFIS) bersama Sekutu, yang berpusat di Australia. Lewat dinas rahasia ini kita akan menggelar operasi-operasi klandestin untuk menyabotase pasukan pendudukan Jepang. Melalui setiap kemenangan kecil, kita selangkah lebih dekat untuk kembali ke tanah air tercinta."
  INS_evacuate_soldiers_to_australia: "Evakuasi Prajurit ke Australia"
  INS_evacuate_soldiers_to_australia_desc: "Kita akan membangun pangkalan militer di dekat markas NEFIS di Australia Utara. Di sana, kita akan menghimpun serdadu-serdadu KNIL yang lolos dari penawanan selama masa pendudukan, agar kita dapat terus melanjutkan perjuangan."
  INS_australian_weapons: "Senjata Australia"
  INS_australian_weapons_desc: "Operasi klandestin bukanlah perkara mudah, dan kita membutuhkan perlengkapan yang memadai agar berhasil. Kita dapat membeli lisensi pabrik-pabrik Australia dan memanfaatkannya untuk memproduksi persenjataan bagi NEFIS."
  INS_defenders_of_homeland: "Tentara Sukarela Pembela Tanah Air"
  INS_defenders_of_homeland_tt: "Fokus ini akan selesai secara otomatis jika Pembela Tanah Air (PETA) dibentuk."
  INS_resist_occupation_tt: "Fokus ini akan selesai secara otomatis jika kita diinvasi dan menolak menyerah."
  INS_defenders_of_homeland_desc: "Pemerintah Hindia Belanda telah runtuh, dan rezim baru menggantikan tempatnya. Dipimpin oleh kaum Nasionalis bersama Pemerintah Militer Jepang, kita akan membentuk tentara baru yang lebih tangguh dari KNIL dan memenangkan perang. Namun tak dapat dipungkiri bahwa persekutuan antara kaum Nasionalis dan Imperialis ini sangat rapuh. Akankah persekutuan ini bertahan, ataukah akan berakhir dengan pertumpahan darah?"
  INS_embrace_co_prosp_sphere: "Rangkul Lingkungan Kemakmuran Bersama"
  INS_embrace_co_prosp_sphere_desc: "Kita akhirnya berhasil mengakhiri kekuasaan Belanda, dan kendati kita hanya menggantikan satu penjajah dengan penjajah lainnya, janji kemakmuran ekonomi dan Pan-Asianisme sangat memikat. Kita akan terus menyokong upaya perang Jepang demi memastikan Belanda tidak akan pernah berani kembali lagi ke Indonesia."
  INS_seize_oppurtunity: "Rebut Kesempatan"
  INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] sedang terdesak kalah, dan pemerintahan pendudukan militer mereka semakin lemah. Untuk pertama kalinya dalam berabad-abad, kita memiliki kesempatan nyata mematahkan belenggu penindasan di Indonesia untuk selamanya, mendirikan negara berdaulat. Bila kita tidak merebut momentum ini untuk memproklamasikan kemerdekaan sekarang, entah berapa lama lagi kita harus menanti kesempatan berikutnya."
  INS_japanese_resource_infrastructure: "Danai Upaya Perang Raya"
  INS_japanese_resource_infrastructure_desc: "Menyerahkan kendali atas infrastruktur penambangan sumber daya utama kita kepada [JAP.GetNameDef] merupakan langkah mutlak untuk memenangkan perang, mengingat prioritas tertinggi adalah menjaga unit-unit [JAP.GetAdjective] tetap terpenuhi pasokannya setiap saat. [JAP.GetNameDefCap] juga akan membangun infrastruktur lokal kita demi meningkatkan efisiensi ekspor bahan mentah."
  INS_japanese_army_training: "Reformasi Angkatan Perang"
  INS_japanese_army_training_desc: "Banyak yang harus kita pelajari dari penguasa [JAP.GetAdjective] kita, dan kini setelah KNIL dibubarkan, kita harus membangun angkatan perang baru yang dilatih langsung oleh tentara Jepang, siap mempertahankan bumi Indonesia dari ancaman luar."
  INS_governor_general_de_jonge: "Gubernur Jenderal de Jonge"
  INS_governor_general_de_jonge_desc: "Bonifacius Cornelis de Jonge dikenal memerintah dengan tangan besi, menentang segala bentuk nasionalisme dan sering mengabaikan keinginan Volksraad. Kekuasaannya atas Hindia telah berlangsung lama, dan pengalamannya dimulai sejak perang besar di mana ia menjabat sebagai Menteri Perang Hindia."
  INS_governor_general_tjarda: "Gubernur Jenderal Tjarda"
  INS_tjarda_explain_tt: "Masa jabatan §YBonifacius Cornelis de Jonge§! telah berakhir, dan §YAlidius Tjarda van Starkenborgh Stachouwer§! dipilih sebagai Gubernur pengganti pada bulan September 1936."
  INS_governor_general_tjarda_desc: "Alidius Tjarda van Starkenborgh Stachouwer memiliki pandangan yang sedikit berbeda bagi Hindia dibanding pendahulunya. Kendati ia tetap menentang Nasionalisme pribumi, ia memiliki kebijakan yang agak lebih liberal dan lebih bersedia mendengar masukan dari Volksraad."
  INS_electrical_investments: "Investasi Kelistrikan"
  INS_electrical_investments_desc: "Setiap negara industri Eropa memiliki jaringan listrik yang kuat guna menopang perindustrian mereka. Jika kita ingin melepaskan diri dari ketergantungan ekspor bahan mentah dan membangun industri manufaktur mandiri seperti mereka, kita harus membangun jaringan transmisi listrik berkapasitas tinggi di seantero Jawa."
  INS_reduce_land_taxes: "Turunkan Pajak Tanah"
  INS_reduce_land_taxes_desc: "Pajak tinggi yang dikenakan atas kepemilikan tanah telah menyulitkan kaum pribumi untuk memiliki perkebunan dan menjalankan usaha. Meskipun hal ini memudahkan kita mempertahankan monopoli atas industri karet, kebijakan ini memicu masalah ekonomi di seantero negeri. Kita harus mempertimbangkan untuk menurunkan kembali pajak ini ke tarif semula, memungkinkan perkebunan karet swasta skala kecil milik rakyat untuk berkembang."
  INS_invest_in_batavian_education: "Investasi Pendidikan Batavia"
  INS_invest_in_batavian_education_desc: "Volksraad telah menegaskan bahwa kehendak rakyat Indonesia adalah agar pendidikan menjadi lebih mudah diakses, mengingat saat ini pendidikan bermutu hampir hanya dinikmati oleh warga Belanda-Indo dan segelintir kaum bangsawan priyayi. Untuk mematuhi mosi Volksraad tersebut, kita harus mendirikan sejumlah sekolah dasar dan lanjutan di Batavia dan sekitarnya."
  INS_javanese_education_investments: "Investasi Pendidikan Jawa"
  INS_javanese_education_investments_desc: "Selain proyek pembangunan sekolah dasar dan menengah yang sedang berjalan, kita dapat mendirikan perguruan tinggi kejuruan dan sekolah vokasi kejuruan khusus, yang akan membuka akses pendidikan tinggi bagi kalangan keluarga kelas menengah."
  INS_allow_local_autonomy: "Beri Otonomi Daerah"
  INS_allow_local_autonomy_desc: "Sistem Vorstenlanden yang memberikan swapraja kepada swapraja-swapraja kerajaan telah membuat gerakan nasionalis jauh lebih mudah diredam dan meningkatkan stabilitas negeri secara keseluruhan. Kita sebaiknya menambah wewenang otonomi yang diberikan kepada daerah-daerah swapraja ini, memungkinkan pemerintah pusat berfokus pada urusan yang lebih krusial."
  INS_direct_rule: "Pemerintahan Langsung"
  INS_direct_rule_desc: "Sistem Vorstenlanden yang memberikan swapraja kepada daerah kerajaan telah memperumit roda birokrasi dan membuang banyak waktu pemerintahan. Sudah tiba saatnya untuk menghapus sistem swapraja tersebut sama sekali dan menegakkan kekuasaan langsung (direct rule) di segenap penjuru kepulauan."
  INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§! telah dipukul mundur, dan menguasai kurang dari §Y[?var:temp_states_plus_more]§! wilayah bagian. (saat ini: §Y[?var:JAP.num_controlled_states]§!)"
  INS_seize_oppurtunity_refuse_warn_tt: "§RRevolusi nasional akan berkobar, yang dapat memicu perang melawan [HOL.GetNameDef]§!."
  INS_economic_stabilization: "Stabilisasi Ekonomi"
  INS_economic_stabilization_desc: "Depresi Besar dan proteksionisme global telah melumpuhkan ekonomi kita, dan banyak rakyat Indonesia yang dahulunya bekerja di sektor bahan mentah kini menganggur. Kita harus mengambil tindakan tegas dengan meluncurkan program padat karya di mana warga yang menganggur akan diberi pekerjaan."
  INS_restore_order_in_indies: "Pulihkan Ketertiban di Hindia"
  INS_restore_order_in_indies_desc: "Meningkatnya gerakan nasionalis di Hindia telah mengguncang beberapa wilayah, dan dapat berkembang tak terkendali jika kita tidak segera menghentikannya. Memulihkan ketertiban dan ketenteraman harus menjadi prioritas utama kita."
  INS_detangle_supply_chains: "Benahi Rantai Pasok"
  INS_detangle_supply_chains_desc: "Ekonomi ekspor kita mengharuskan komoditas melewati belasan pedagang perantara sebelum tiba di tujuan akhir, di mana setiap rantai memungut biaya, pajak, atau komisi sampingan. Kita harus membenahi kesemrawutan ini dan memegang kendali mayoritas rantai pasok secara langsung."
  INS_prioritize_industrial_growth: "Prioritaskan Pertumbuhan Industri"
  INS_prioritize_industrial_growth_desc: "Ekonomi ekspor kita terlalu rentan gejolak dan terus membuat kita bergantung pada kerja sama Belanda. Kita harus membangun industri manufaktur dengan mendirikan pabrik-pabrik di penjuru Batavia. Kita berpeluang menjadi negara paling maju industrinya di kawasan Pasifik."
  INS_closer_economic_ties_to_netherlands: "Pererat Ikatan Ekonomi dengan Belanda"
  INS_closer_economic_ties_to_netherlands_desc: "Banyak hal yang dapat kita pelajari dari negeri induk kita, khususnya dalam bidang ekonomi. Jika kita mengintegrasikan ekonomi ekspor kita lebih dalam lagi dengan Belanda, kita dapat memanfaatkan jaringan infrastruktur dan koneksi dagang mereka untuk mengamankan kesepakatan-kesepakatan yang jauh lebih menguntungkan."
  INS_prioritize_dutch_companies: "Prioritaskan Perusahaan-Perusahaan Belanda"
  INS_prioritize_dutch_companies_desc: "Perusahaan-perusahaan Belanda seperti Shell dan Fokker telah menjadi penopang utama ekonomi kita selama berabad-abad, dengan ekspor bahan mentah kita terintegrasi kuat bersama Shell. Hal ini telah mendatangkan kemakmuran besar bagi Hindia, dan kita harus memprioritaskan mereka di atas usaha-usaha kecil demi menjaga hubungan kemitraan tetap kukuh."
  INSHOL_java_factories: "Buka Pabrik Senjata di Jawa"
  INSHOL_java_factories_desc: "Membangun pabrik senjata adalah langkah paling nyata untuk memperkokoh angkatan darat. Sebagai jantung industri koloni, Jawa adalah lokasi yang paling tepat untuk mendirikannya."
  INSHOL_license_dutch_weapon_blueprints: "Lisensi Cetak Biru Senjata Belanda"
  INSHOL_license_dutch_weapon_blueprints_desc: "Daripada menghabiskan waktu merancang teknologi dari nol, kita dapat bekerja sama dengan perusahaan-perusahaan Belanda untuk membeli lisensi cetak biru senjata mereka."
  INSHOL_bangka_production_lines: "Lini Produksi Bangka"
  INSHOL_bangka_production_lines_desc: "Pembangunan infrastruktur besar-besaran di Bangka melalui Proyek Bangka telah mengubah pulau ini menjadi sentra industri baru. Kita dapat membangun pabrik senjata di Bangka yang terhubung langsung dengan jalan raya, rel, dan pelabuhan yang efisien."
  INSHOL_artillerie_inrichtingen: "Artileri Inrichtingen"
  INSHOL_artillerie_inrichtingen_desc: "Artillerie Inrichtingen telah memproduksi artileri dan amunisi di Belanda selama lebih dari 250 tahun. Memperluas fasilitas manufaktur mereka di Hindia akan melipatgandakan kapabilitas KNIL sekaligus membuka lapangan kerja baru bagi penduduk lokal."
  INSHOL_ai_pyrotechnische: "Artileri Inrichtingen Pyrotechnische"
  INSHOL_ai_pyrotechnische_desc: "Melanjutkan ekspansi fasilitas Artillerie Inrichtingen di Hindia Belanda, kita akan mendanai pembentukan anak perusahaan piroteknik dan bahan peledak di Hindia."
  INSHOL_bio_pharma: "Bio Farma"
  INSHOL_bio_pharma_desc: "Memperluas industri farmasi di Bandung adalah langkah penting dalam reformasi medis KNIL, menjamin prajurit yang terluka mendapatkan perawatan terbaik. Melimpahnya kina di Hindia membuat biaya proyek ini jauh lebih efisien."
  INSHOL_develop_fighters: "Kembangkan Pesawat Tempur Baru"
  INSHOL_develop_fighters_desc: "Kami akan mengirim insinyur Batavia ke Amsterdam untuk mempelajari produksi pesawat tempur Fokker secara langsung, sehingga mendapatkan akses terhadap rahasia manufaktur yang dijaga ketat. Mereka akan kembali dengan pengetahuan dan keahlian teknis yang dibutuhkan untuk membangun industri pesawat tempur domestik modern di Hindia Belanda."
  INSHOL_develop_bombers: "Kembangkan Pesawat Pengebom Baru"
  INSHOL_develop_bombers_desc: "Kami akan mengirimkan insinyur Batavia ke Amsterdam untuk mempelajari langsung produksi pesawat pembom Fokker, sehingga mendapatkan akses terhadap rahasia manufaktur yang dijaga ketat. Mereka akan kembali dengan pengetahuan dan keahlian teknis yang dibutuhkan untuk membangun industri pembom domestik modern di Hindia Belanda."
  INSHOL_bandung_aircraft_facility: "Fasilitas Manufaktur Pesawat Bandung"
  INSHOL_bandung_aircraft_facility_desc: "Cetak biru tidak ada gunanya tanpa pabrik perakitan. Kita akan membuka fasilitas manufaktur pesawat baru di Bandung untuk memenuhi kebutuhan mendesak ML-KNIL."
  INSHOL_netherlands_indies_air_doctrine: "Doktrin Udara Belanda-Hindia"
  INSHOL_netherlands_indies_air_doctrine_desc: "Kita akan mempelajari pengalaman angkatan udara negara-negara yang menghadapi tantangan geografis serupa, merumuskan doktrin tempur yang selaras dengan bentang kepulauan Hindia Belanda."
  INSHOL_manado_military_academy: "Akademi Militer Makassar"
  INSHOL_manado_military_academy_desc: "Mendirikan akademi militer di luar Jawa akan mengatasi keterbatasan perwira dan mempermudah perekrutan di pulau-pulau timur. Makassar, yang berada di poros tengah kepulauan, adalah lokasi yang ideal."
  INSHOL_infantry_training_in_borneo: "Latihan Infanteri di Borneo"
  INSHOL_infantry_training_in_borneo_desc: "Hindia Belanda dipenuhi rimba lebat, perbukitan terjal, dan medan ganas. Prajurit kita di Jawa belum sepenuhnya terbiasa dengan medan ekstrem semacam ini. Hutan belantara Borneo adalah kawah candradimuka terbaik untuk menempa pasukan perintis kelas dunia."
  INSHOL_knil_engineers: "Korps Zeni (Genie)"
  INSHOL_knil_engineers_desc: "Kita tidak boleh hanya memusatkan perhatian pada infanteri dan senapan, melainkan harus mengingat bahwa zeni dan komunikasi memegang peran kunci memenangkan laga pertempuran. Kita akan melatih korps zeni dan mendanai sekolah kejuruan teknik."
  INSHOL_work_with_oil_barons: "Bekerja Sama Dengan Baron Minyak"
  INSHOL_work_with_oil_barons_desc: "Depresi Hebat telah menyebabkan perekonomian kita yang berbasis ekspor berada dalam kondisi yang menyedihkan. Mungkin sudah waktunya untuk mempertimbangkan untuk menyerahkan beberapa negosiasi perdagangan kepada para raja minyak di Sumatera, untuk menjamin minyak dapat dijual. Namun hal ini memerlukan konsekuensi, karena agar mereka dapat menyetujui kesepakatan ini, kita harus menjual minyak dengan harga yang jauh lebih rendah dari harga pasar."
  INSHOL_rubber_taxation: "Perpajakan Karet"
  INSHOL_rubber_taxation_desc: "Investasi dan keahlian Belanda telah menyulap perkebunan karet di Hindia menjadi aset paling bernilai bagi Kerajaan. Sangat wajar jika Mahkota memungut bagian sah dari kekayaan yang diciptakannya."
  INSHOL_padang_port: "Pelabuhan Internasional di Padang"
  INSHOL_padang_port_desc: "Komoditas dari Sumatra selama ini harus transit melalui Jawa sebelum menuju pasar internasional. Dengan membangun pelabuhan samudra modern di Padang, kita memangkas rute logistik ini dan melipatgandakan keuntungan perkebunan Sumatra."
  INSHOL_subsidize_bauxite: "Subsidi Proyek Bauksit"
  INSHOL_subsidize_bauxite_desc: "Proyek modernisasi tambang bauksit di Kepulauan Bangka-Belitung sangat prospektif. Kita harus mendukung pemerintah Hindia dengan subsidi ekonomi untuk mempercepat produksi."
  INSHOL_agricultural_subsidies: "Privatisasi Sektor Pertanian"
  INSHOL_agricultural_subsidies_desc: "Dengan mengizinkan berdirinya lahan pertanian swasta, kita mempercepat pembangunan infrastruktur di pelosok pedesaan sekaligus meningkatkan pendapatan pajak yang disetorkan langsung ke kas negara."
  INSHOL_import_sugar: "Impor Gula"
  INSHOL_import_sugar_desc: "Kita akan memberlakukan kontrol harga pada sektor perkebunan Hindia guna mengimpor seluruh kebutuhan gula tanah air dari Hindia dengan harga murah, serta menegakkan monopoli gula negara."
  INSHOL_import_lumber: "Impor Kayu Gelondongan"
  INSHOL_import_lumber_desc: "Kita akan memberlakukan kontrol harga guna mengimpor kayu berkualitas tinggi dari rimba Hindia untuk menopang industri galangan dan perumahan di tanah air."
  INSHOL_industrialized_colony: "Koloni Terindustrialisasi"
  INS_no_peta_tt: "Indonesia tidak akan dapat bekerja sama dengan pihak penjajah asing."
  INSHOL_industrialized_colony_desc: "Hindia Belanda, yang semula sekadar tanah jajahan agraris, kini telah menjelma menjadi salah satu kawasan paling maju dan berindustri di seantero Asia. Ini membuktikan keberhasilan pembangunan kita dan mengukuhkan kembali status Belanda sebagai kekuatan dunia."
  INSHOL_economic_integration: "Integrasi Ekonomi"
  INSHOL_economic_integration_desc: "Hindia Belanda adalah permata berkilau dalam mahkota Kerajaan. Kemakmurannya tercipta berkat kepemimpinan mantap Ratu, Perdana Menteri, dan Gubernur Jenderal. Stabilitas ini tidak boleh dirusak oleh seruan kemerdekaan yang ceroboh. Kita akan mengikat perekonomian Belanda dan Hindia kian erat."
  INSHOL_republic_of_indonesia: "Republik Indonesia"
  INSHOL_republic_of_indonesia_desc: "Ketika Belanda dengan berat hati menyetujui Petisi Soetardjo, undang-undang yang lahir mengikat kemerdekaan Indonesia pada daftar panjang persyaratan swasembada ekonomi. Berkat keuletan dan tekad baja bangsa Indonesia, seluruh syarat itu kini telah terpenuhi tuntas. Belanda tiada pilihan selain mengakui proklamasi kemerdekaan kita secara sah."
  INSHOL_propose_malay_unification: "Usulkan Penyatuan Melayu"
  INSHOL_propose_malay_unification_desc: "Indonesia adalah rumah bagi ratusan suku bangsa dan bahasa yang dipersatukan oleh nasib senasib sepenanggungan melawan penjajahan. Persatuan ini tidak boleh terhenti di batas kolonial semu, ketika saudara-saudara kita di Malaya memiliki akar rumpun dan cita-cita yang sama di seberang selat."
  INSHOL_singapore_compromise: "Kompromi Singapura"
  INSHOL_singapore_compromise_desc: "Singapura secara historis dan budaya adalah tanah kepulauan Melayu. Namun Britania enggan melepaskannya karena nilai strategis pangkalannya. Kita usulkan kompromi: Singapura bergabung dengan persatuan kita, dengan syarat Britania mempertahankan hak garnisun pangkalannya di pulau tersebut."
  INSHOL_request_ceylon: "Minta Penyerahan Ceylon"
  INSHOL_request_ceylon_desc: "Koloni Inggris di Ceylon (Sri Lanka) memiliki pertautan sejarah perniagaan yang panjang dengan dunia Melayu. Seiring mekarnya konfederasi Maphilindo, wajar jika pulau ini disambut ke dalam naungan persaudaraan kita."
  INSHOL_papua_referendum: "Referendum Papua"
  INSHOL_papua_referendum_desc: "Pulau Papua saat ini terbelah antara Indonesia dan Australia. Di saat belahan barat yang kita kelola bertransformasi pesat, wilayah yang dikuasai Australia terbengkalai. Masa depan pulau ini harus ditentukan oleh rakyatnya sendiri; kita menuntut referendum resmi atas penyatuan Papua."
  INSHOL_invite_phillipines: "Gagas Maphilindo"
  INSHOL_invite_phillipines_desc: "Bangsa-bangsa di kepulauan kita berakar pada rumpun keluarga besar Austronesia dan Melayu. Kita satukan kekuatan membentuk konfederasi raya Maphilindo (Malaysia, Filipina, Indonesia), mengundang Filipina bergabung. Bekas tanah jajahan ini akan bangkit bersatu sebagai kekuatan adidaya di Asia Tenggara."
  INS_focus_time_reduce_usa_tt: "§Y$INS_realign_supply_chains$§! akan memangkas waktu fokus ini sebanyak 70 hari."
  INS_focus_time_reduce_jap_tt: "§Y$INS_first_come_first_serve$§! akan memangkas waktu fokus ini sebanyak 70 hari."
  INS_focus_time_reduce_fokker_tt: "§Y$INSHOL_east_indies_fokker_division$§! akan memangkas waktu fokus ini sebanyak 35 hari."
  INS_focus_time_reduce_tjarda_tt: "§Y$INS_governor_general_tjarda$§! akan memangkas waktu fokus ini sebanyak 35 hari."
  INS_focus_time_reduce_pki_tt: "§Y$INS_utilize_tan_malakas_militia$§! akan memangkas waktu fokus ini sebanyak 35 hari."
