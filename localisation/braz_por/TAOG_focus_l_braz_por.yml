l_braz_por:
  INS_nationalize_companies_tt: "Seluruh Badan Usaha Industri Militer dan Kepentingan Industri akan dinasionalisasi dan diberi nama baru."
  available_focus_tt: "§GTersedia§! fokus:"
  INS_is_union_tt: "Telah membentuk Uni Belanda-Indonesia"
  INS_is_union_tt_NOT: "Belum membentuk Uni Belanda-Indonesia"
  INS_denounce_soetardjo: "Kecam Soetardjo"
  INS_denounce_soetardjo_tt: "Kita akan mulai merancang revolusi bawah tanah, menyusup ke tubuh pemerintahan dan mendirikan sel-sel gerilya di seantero nusantara. Begitu persiapan kita matang, kita akan mengobarkan perang kemerdekaan gerilya melawan Belanda."
  INS_soetardjo_petition_debate_done_tt: "Perdebatan Volksraad mengenai petisi otonomi Soetardjo telah tuntas"
  INS_tkr_tt: "Memodifikasi §YTentara Keamanan Rakyat§! sebesar:"
  INS_commander_sudirman_tt: "§YSoedirman§!([INS.GetFlag]) Dinaikkan pangkatnya menjadi §YMarsekal Lapangan§!"
  INS_the_declaration_of_independence: "Proklamasi Kemerdekaan"
  INS_the_declaration_of_independence_desc: "Kita tidak boleh menunda lebih lama lagi, kita harus memukul selagi besi masih panas! Kita harus mengirim milisi kita untuk merebut pelabuhan, kota, dan pusat industri cukup cepat sehingga otoritas Belanda tidak punya waktu untuk bereaksi. Kemudian, kita akan menyatakan kemerdekaan, memproklamasikan Republik Indonesia."
  INS_the_declaration_of_independence_tt: "Kami akan mendeklarasikan §YKemerdekaan§!. Setiap negara bagian di mana kami mendirikan §YPangkalan Milisi§! atau §YMarkas Besar§! akan berada di bawah kendali kami, dan sisanya tetap berada di [HOL.GetNameDef]\n\n[HOL.GetNameDefCap] tidak akan mengakui kedaulatan kami dan konflik dengan intensitas rendah akan dimulai. Hal ini dapat meningkat menjadi §Rwar§!.\n\nMembuka serangan darat untuk mengambil alih negara bagian."
  INSHOL_the_declaration_of_independence: "Revolusi Nasional"
  INS_laskar_rakjat: "Laskar Rakyat"
  INS_laskar_rakjat_desc: "Revolusi ditopang oleh berbagai laskar milisi di seantero Indonesia, ada yang besar dan ada yang kecil. Mengorganisasi laskar-laskar ini adalah langkah mutlak demi meraih kemenangan. Namun kita tidak boleh tergesa-gesa, karena memperkuat laskar yang terafiliasi dengan rival politik kita dapat mendatangkan bencana."
  INS_militia_tt: "Membentuk templat divisi milisi §YPejuang Kemerdekaan§! baru dan membuka keputusan untuk mengelolanya."
  INS_militia_warning_tt: "Laskar milisi adalah kelompok pejuang kemerdekaan yang bersifat §Ysemi-otonom§!. Mereka akan bertempur demi kita, namun bantuan mereka tidak gratis. Mereka menuntut imbalan atas perjuangan mereka. §RStabilitas akan terpukul drastis jika tuntutan mereka tidak dipenuhi!§!"
  INS_usa_tanks_opinion_mod: "Membeli Tank Kita"
  INS_republic_add_generals_tt: "(§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) diangkat menjadi Jenderal."
  INS_big_militia_presence_tt: "Akan dikendalikan oleh Laskar Milisi kita saat proklamasi kemerdekaan."
  INS_prepare_raiding_bases: "Siapkan Pangkalan Serbuan"
  INS_prepare_raiding_bases_desc: "Kita akan mengerahkan jejaring mata-mata untuk mendirikan bungker-bungker rahasia di seluruh kepulauan, memastikan kesiapan tempur kita begitu fajar revolusi menyingsing."
  # <Joint Tree - Central Milestones>
  INSHOL_dutch_east_indies: "Hindia Belanda"
  INSHOL_dutch_east_indies_desc: "Koloni ini didirikan hampir 500 tahun yang lalu, dan telah mengalami banyak perubahan sejak saat itu. Dunia tengah berubah dengan cepat, dan tindakan kita sekarang akan menentukan masa depan hubungan Belanda-Indonesia jauh ke depan."
  INSHOL_the_war_in_europe: "Perang di Eropa"
  INSHOL_the_war_in_europe_desc: "Konflik di Eropa tereskalasi dengan cepat, dan Belanda kini terseret dalam kancah peperangan. Kita tidak dapat lagi mengandalkan mereka untuk melindungi kita dan harus berdiri di atas kaki sendiri, atau kita berisiko ditaklukkan oleh kekuatan asing."
  # <Joint Tree - Military Equipment Contracts>
  INSHOL_military_equipment_contracts: "Kontrak Perlengkapan Militer"
  INSHOL_military_equipment_contracts_desc: "Hindia adalah kepulauan mahaluas berpenghuni puluhan juta jiwa. Kita masih jauh dari kapasitas industri yang memadai untuk membela diri. Kendati demikian, kita memiliki cukup sumber daya alam untuk mengamankan perdagangan ke seluruh penjuru dunia. Dengan menjalin kontrak bersama negara-negara Demokrasi di dunia, masalah kita dapat teratasi."
  INSHOL_hawk_75a7: "Pesawat Hawk 75A-7"
  INSHOL_hawk_75a7_desc: "Pesawat tempur Amerika Hawk 75A-7 adalah armada udara yang sempurna bagi Hindia, terjangkau dan tangguh. Kita dapat mengamankan kesepakatan dengan pihak pabrikan guna melakukan pemutakhiran mendesak pada Angkatan Udara kita."
  INSHOL_purchase_american_tanks: "Beli Tank Amerika"
  INSHOL_purchase_american_tanks_desc: "Meskipun Hindia belum memiliki industri yang memadai untuk memproduksi tank, kita dapat membelinya langsung dari Amerika Serikat yang didanai oleh kekayaan industri karet Hindia."
  INSHOL_purchase_british_artillery: "Beli Artileri Inggris"
  INSHOL_purchase_british_artillery_desc: "Kita dapat mengalihkan pembuatan artileri kita kepada pihak Britania Raya, sehingga memungkinkan kita memprioritaskan lini perlengkapan lainnya."
  INSHOL_produce_own_goods: "Produksi Barang Kita Sendiri"
  INSHOL_produce_own_goods_desc: "Meskipun banyak kesepakatan dagang menggiurkan yang dapat kita amankan, kita tidak boleh melupakan lini produksi dan badan industri militer kita sendiri. Kita harus menyubsidi perusahaan-perusahaan tersebut demi menekan ketergantungan kita pada impor luar negeri."
  # <Joint Tree - East Indies Investments>
  INSHOL_east_indies_investments: "Investasi Hindia Belanda"
  INSHOL_east_indies_investments_desc: "Tuan kolonial yang baik adalah yang berinvestasi dalam pembangunan koloninya. Menanam modal dalam pembangunan ekonomi Hindia adalah demi kepentingan terbaik kita, sekaligus memberi manfaat nyata bagi rakyat di negeri jajahan."
  INSHOL_east_indies_student_exchange: "Program Pertukaran Pelajar Hindia Belanda"
  INSHOL_east_indies_student_exchange_desc: "Membangun sistem di mana pemuda-pemudi Indonesia dapat merantau ke Belanda untuk menuntut ilmu di universitas-universitas kita akan menjadi berkah besar bagi perekonomian Belanda maupun Hindia."
  INSHOL_east_indies_fokker_division: "Bentuk Divisi Fokker Hindia Belanda"
  INSHOL_east_indies_fokker_division_desc: "Lisensi Fokker kian banyak digunakan oleh Angkatan Udara Hindia hingga layak dipertimbangkan pembentukan anak perusahaan khusus yang memprioritaskan kebutuhan Angkatan Udara Hindia."
  INSHOL_expand_shell: "Perluas Infrastruktur Shell"
  INSHOL_expand_shell_desc: "Shell secara bertahap menjadi pilar perekonomian kita yang kian dominan. Sudah semestinya kita memperluas infrastruktur perminyakan di Hindia guna mengimbangi kapasitas ekspor Shell."
  INSHOL_increase_funding_for_tix: "Tingkatkan Dana Proyek Pesawat T.IX"
  INSHOL_increase_funding_for_tix_desc: "Para insinyur di Fokker sedang mengembangkan pesawat pembom bermesin ganda baru untuk menggantikan model usang yang digunakan oleh Angkatan Udara Hindia. Proyek ini memiliki anggaran yang sangat rendah, dan kemungkinan besar tidak akan selesai dalam waktu yang lama. Kita dapat meningkatkan pendanaan mereka untuk mempercepat kemajuan."
  INSHOL_reduce_land_ownership_taxes: "Kurangi Pajak Kepemilikan Tanah"
  INSHOL_reduce_land_ownership_taxes_desc: "Kita harus memangkas pajak yang dibebankan kepada warga Indonesia pemilik tanah, mendorong tumbuhnya lahan pertanian mandiri dan kegiatan wirausaha rakyat."
  INSHOL_coffee_plantations: "Perkebunan Kopi"
  INSHOL_coffee_plantations_desc: "Kita harus berfokus menguasai lebih banyak tanah milik negara di pulau-pulau timur. Kita dapat memanfaatkan tanah ini untuk membangun perkebunan kopi skala besar."
  INSHOL_overallwagen: "Wagen berlebihan"
  INSHOL_overallwagen_desc: "Tank tempur belum tentu menjadi jawaban bagi Tentara Hindia Belanda. Kita kekurangan kapasitas industri untuk memproduksinya, dan medan kepulauan yang ekstrem membuatnya sangat terbatas. Kita dapat berinvestasi memproduksi Panser Lapis Baja (Overvalwagen) untuk mengisi celah tersebut."
  INSHOL_indonesian_cheap_labor: "Tenaga Kerja Murah Indonesia"
  INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$" #LL: stealing this to save time, hope you don't mind!
  INSHOL_eastern_development_fund: "Dana Pembangunan Kepulauan Timur"
  INSHOL_eastern_development_fund_desc: "Kita terlalu banyak berfokus pada investasi di Jawa dan Sumatra, mengabaikan sebagian besar daratan di negeri koloni. Kita harus berkomitmen membangun infrastruktur di Kepulauan Timur demi membuka jalan bagi industrialisasi masa depan."
  INSHOL_increase_rubber_taxes: "Naikkan Pajak Karet"
  INSHOL_increase_rubber_taxes_desc: "Banyak perusahaan karet di Hindia meraup kekayaan melimpah dari sumber daya alam negeri jajahan ini. Sangat adil jika kita mengenakan pajak yang cukup besar atas operasi mereka."
  INSHOL_reform_knil: "Reformasi KNIL"
  INSHOL_reform_knil_desc: "Sejak Hindia Belanda menuntaskan penaklukannya atas seluruh kepulauan, Koninklijk Nederlandsch-Indisch Leger (KNIL) cenderung statis dan mengalami defisit pendanaan yang parah. Dengan memuncaknya ketegangan dunia, kita harus mulai mempersenjatai kembali Hindia sedini mungkin."
  INSHOL_fund_ml_knil: "Danai ML-KNIL"
  INSHOL_fund_ml_knil_desc: "Jika kita ingin mengimbangi angkatan perang modern dunia, kita harus membangun kekuatan angkatan udara mandiri (ML-KNIL) yang mumpuni, atau kita akan berada dalam kelemahan yang fatal."
  INSHOL_bandung_aircraft_facility_tt: "§YJawa Barat:§!\nTambahkan §G1§! Slot Bangunan dan §G1§! §YPabrik Militer§! per fokus prasyarat selesai."
  INSHOL_rangers: "Pasukan Perintis"
  INSHOL_rangers_desc: "Hindia adalah kepulauan mahaluas dengan bentang alam yang beraneka ragam. Kita harus melatih Pasukan Perintis yang terbiasa bertempur di lingkungan rimba ganas ini, memastikan kita siap mempertahankannya."
  INSHOL_mountaineers: "Pasukan Gunung"
  INSHOL_mountaineers_desc: "Kita harus melatih Pasukan Gunung yang siap bertempur di medan perbukitan terjal dan pegunungan kepulauan kita."
  INSHOL_elevate_elite_infantry: "Depot Khusus Troepen"
  INSHOL_elevate_elite_infantry_desc: "Kita tidak dapat selamanya bersandar pada doktrin Perang Dunia I. Kita harus beradaptasi dengan taktik modern. Kita perlu membentuk beberapa satuan infanteri komando elite (Depot Speciale Troepen) yang siap mempertahankan berbagai medan operasi."
  INSHOL_modernize_knil: "Modernisasi KNIL"
  INSHOL_modernize_knil_desc: "Kita akan mempelajari doktrin dan strategi mutakhir bagi Angkatan Darat Hindia Belanda, guna memastikan keunggulan taktis atas musuh."
  INSHOL_transfer_of_henri_winkelman: "Pemindahan Henri Winkelman"
  INSHOL_transfer_of_henri_winkelman_desc: "Henri Winkelman sebelumnya mengabdi di KNIL selama bertahun-tahun. Kehadirannya sangat dibutuhkan kembali di Hindia, dan kita harus mengatur kepulangannya secara resmi ke Hindia Belanda."
  INSHOL_eastern_conscription: "Bentuk Korps Barisan Pembantu"
  INSHOL_eastern_conscription_desc: "Ada beberapa korps pembantu adat di Jawa dan Madura yang dikendalikan oleh penguasa pangeran setempat. Di masa-masa sulit ini, kita bisa menegosiasikan kesepakatan dengan penguasa lokal dimana pembagian ini akan berada di bawah wewenang kita."
  INSHOL_establish_vk_knil: "Bentuk VK-KNIL"
  INSHOL_establish_vk_knil_desc: "Kita akan membentuk Korps Sukarelawan Wanita untuk KNIL (Vrouwenkorps KNIL). Pengabdian mereka akan memegang peranan krusial dalam memperkokoh jaringan logistik dan komunikasi militer kita."
  INSHOL_emergency_dockyard_construction: "Pembangunan Galangan Kapal Darurat"
  INSHOL_emergency_dockyard_construction_desc: "Bahaya invasi amfibi lewat laut tidak boleh dipandang sebelah mata; kita harus menjadikan pertahanan maritim sebagai prioritas utama."
  INSHOL_emergency_powers_gov_general: "Wewenang Darurat bagi Gubernur Jenderal"
  INSHOL_emergency_powers_gov_general_desc: "Perang yang tengah berkobar menuntut keputusan-keputusan keras diambil tanpa penundaan, hal yang mustahil terwujud jika setiap keputusan di Hindia harus menunggu persetujuan berbelit-belit dari Belanda. Kita harus menganugerahkan wewenang darurat kepada [INS.GetLeader] agar ia dapat bertindak sigap."
  INSHOL_emergency_naval_purchases: "Pembelian Armada Laut Darurat"
  INSHOL_emergency_naval_purchases_desc: "Garis pantai kita sangat rawan dan minim pertahanan. Waktu adalah penentu keselamatan; kita harus memiliki angkatan laut yang lebih tangguh atau kita akan binasa. Kita akan membeli kapal dari perusahaan swasta melalui utang, lalu memodifikasinya menjadi kapal perusak tempur."
  INSHOL_east_indies_navy: "Angkatan Laut Hindia Belanda"
  INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] belum memiliki Angkatan Laut resmi sendiri, membebankan pertahanan perairan koloni sepenuhnya pada armada Belanda. Dengan naiknya eskalasi di Eropa dan Asia, tatanan ini tidak akan sanggup bertahan. Kita harus mengambil langkah pertama membentuk angkatan laut [INS.GetAdjective] yang berdedikasi."
  INSHOL_marines: "Korps Marinir"
  INSHOL_marines_desc: "Kita harus membentuk Korps Marinir Hindia khusus di bawah naungan Angkatan Laut baru, dan mengirim prajurit taruna untuk berlatih di atas kapal-kapal perang Belanda."
  INSHOL_domestic_ship_production: "Produksi Kapal Mandiri"
  INSHOL_domestic_ship_production_desc: "Jika kita ingin Angkatan Laut kita mampu melawan negara tetangga kita, kita harus mulai meningkatkan produksi kapal dalam negeri."
  INSHOL_destroyers: "Kapal Perusak"
  INSHOL_destroyers_desc: "Kapal perang berat kita tidak akan sanggup bermanuver di selat-selat sempit nusantara tanpa tirai pelindung kapal perusak. Dengan memproduksi kapal perusak modern, armada [ROOT.GetAdjective] dapat mengawal alur pelayaran dan menyapu kapal torpedo musuh di sekeliling selat."
  INSHOL_cruisers: "Kapal Penjelajah"
  INSHOL_cruisers_desc: "Armada laut tanpa kapal tempur utama harus bertumpu pada keandalan kapal penjelajahnya. Membangun skuadron kapal penjelajah tangguh memberi angkatan laut [ROOT.GetAdjective] inti armada yang mampu meronda jarak jauh antarpulau dan meladeni kapal penyusup musuh di perairan kita."
  INSHOL_submarines: "Kapal Selam"
  INSHOL_submarines_desc: "Selat-selat di Hindia Belanda teramat ideal untuk taktik penyergapan, dan sebuah kapal selam bernilai jauh lebih murah daripada kapal perang musuh yang ditenggelamkannya ke dasar samudra. Armada kapal selam yang kuat memungkinkan angkatan laut [ROOT.GetAdjective] mencengkeram jalur laut tanpa pernah menampakkan wujudnya di permukaan."
  INSHOL_outsourced_navy: "Alihkan Produksi ke Perusahaan Swasta"
  INSHOL_outsourced_navy_desc: "Pengeluaran kita sudah teramat besar; kita tidak dapat terus mengalihkan anggaran kolonial ke Angkatan Laut. Kita dapat membayar pihak korporasi untuk menangani lini produksi armada demi kita."
  INSHOL_divert_civilian_to_navy: "Alihkan Dana Sipil & Militer Darat ke Angkatan Laut"
  INSHOL_divert_civilian_to_navy_desc: "Melihat situasi dunia saat ini, risiko invasi laut berada pada titik tertinggi. Kita tidak boleh berhemat secara keliru; kita harus menyedot pendanaan dari seluruh sektor pemerintahan ke kas Angkatan Laut."
  INS_netherlands_can_remove_autonomy_tt_50: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -50.00§!"
  INS_netherlands_can_remove_autonomy_tt_75: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -75.00§!"
  INS_netherlands_can_remove_autonomy_tt_100: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -100.00§!"
  INS_netherlands_can_remove_autonomy_tt_150: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -150.00§!"
  INS_netherlands_can_remove_autonomy_tt_200: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -200.00§!"
  INS_netherlands_can_remove_autonomy_tt_250: "Jika [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! menyelesaikan fokus ini terlebih dahulu:\n([INS.GetFlag]§Y[INS.GetName]§!): Tambahkan §Y£autonomy_texticon -250.00§!"
  INSHOL_begin_negotiations_soetardjo: "Buka Perundingan dengan Soetardjo"
  INSHOL_begin_negotiations_soetardjo_desc: "Petisi otonomi yang diajukan Soetardjo menawarkan prospek menjanjikan, memberi peluang kompromi politik antara kaum Nasionalis dan Loyalis. Kita harus memulai perundingan resmi bersama partainya."
  INSHOL_urge_gov_veto: "Desak Veto Gubernur Jenderal"
  INSHOL_urge_gov_veto_desc: "Petisi Soetardjo adalah muslihat kaum nasionalis yang ditelan mentah-mentah oleh pemerintah Hindia. Kita harus mendesak Gubernur Jenderal untuk memveto petisi itu secepatnya, atau kita akan kehilangan koloni agung kita."
  INSHOL_eventual_autonomy: "Setujui Otonomi Bertahap"
  INSHOL_eventual_autonomy_desc: "Aspirasi kemerdekaan bangsa Indonesia kian meluap dan mustahil dibendung. Kita akan menyetujui otonomi bertahap bagi Hindia, namun hanya setelah koloni ini membuktikan kemandirian ekonominya serta komitmennya menjunjung nilai-nilai demokrasi."
  INSHOL_autonomous_dominion: "Undang-Undang Soetardjo [GetYear]"
  INSHOL_autonomous_dominion_desc: "Kendati Belanda menetapkan definisi 'kemandirian ekonomi' yang berat sebagai syarat sahnya Petisi Soetardjo, tekad bangsa Indonesia berhasil melampaui seluruh kriteria tersebut. Berdasarkan perjanjian, kita menyatakan kemerdekaan penuh tanpa syarat dari Mahkota Belanda."
  INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! akan §Rdikunci permanen dari meraih kemerdekaan§! tanpa campur tangan luar negeri.§!"
  INSHOL_sideline_the_volksraad: "Tepikan Volksraad"
  INSHOL_sideline_the_volksraad_desc: "Petisi yang digagas Soetardjo melanggar Pasal 1 Konstitusi Belanda secara terang-terangan dan hanya akan mempersulit jalannya administrasi Hindia Belanda. Petisi tersebut wajib diveto."
  INSHOL_prioritize_dutch_profits: "Prioritaskan Keuntungan Belanda"
  INSHOL_prioritize_dutch_profits_desc: "Kita akan memusatkan upaya kita untuk melipatgandakan devisa dan keuntungan bagi tanah air Belanda. Stabilitas ekonomi Belanda adalah demi kebaikan segenap Kerajaan."
  INSHOL_development_loans_netherlands: "Pinjaman Pembangunan dari Belanda"
  INSHOL_development_loans_netherlands_desc: "Kita dapat menarik pinjaman modal dari perusahaan-perusahaan Belanda demi mempercepat industrialisasi. Meskipun status kita sebagai koloni berkembang memberi jaminan bunga rendah, kita tetap harus mengembalikan pinjaman tersebut beserta bunganya."
  INSHOL_request_economic_dev_subsidy: "Ajukan Subsidi Pembangunan Ekonomi"
  INSHOL_request_economic_dev_subsidy_desc: "Kita telah membuktikan nilai strategis kita kepada tuan kolonial sebagai tanah jajahan yang mendatangkan laba besar. Kita dapat memanfaatkan pencapaian ini sebagai modal tawar untuk menuntut subsidi industrialisasi."
  INSHOL_loyalty_to_crown: "Kesetiaan kepada Mahkota"
  INSHOL_loyalty_to_crown_desc: "Hindia Belanda terdiri atas banyak ragam bangsa, namun di atas segalanya kita adalah koloni Belanda yang setia. Ratu Wilhelmina akan membimbing kita menuju kejayaan. Kita tidak boleh membiarkan nasionalisme mengubur hampir 500 tahun sejarah persatuan, dan menegaskan kembali kesetiaan mutlak kita kepada Mahkota."
  INS_loans_timer: "Dalam §Y365§! hari:"
  INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: Pengubah Kecepatan Riset setidaknya §G1.00%§!."
  INS_subsidize_local_business: "Subsidi Usaha Lokal"
  INS_subsidize_local_business_desc: "Kita harus mengucurkan subsidi kepada wirausaha pribumi demi memacu pertumbuhan ekonomi mandiri dalam jangka panjang."
  INSHOL_education_reforms: "Reformasi Pendidikan"
  INSHOL_education_reforms_desc: "Banyak rakyat Hindia Belanda belum memiliki akses ke bangku sekolah, dan sangat sedikit yang menamatkan pendidikan menengah. Jika kita menghendaki Hindia bertransformasi menjadi negara industri yang makmur, kita harus menjamin akses pendidikan merata bagi seluruh rakyat."
  INS_expand_batavia_med_school: "Perluas Sekolah Kedokteran Batavia (STOVIA)"
  INS_expand_batavia_med_school_desc: "Memperluas Sekolah Kedokteran Batavia dengan membangun gedung kampus baru dan mengangkat lebih banyak pengajar pribumi akan membuat pendidikan tinggi kian terjangkau bagi pemuda-pemudi kita."
  INS_prepare_for_policy_shift: "Bersiap untuk Pergeseran Kebijakan"
  INS_prepare_for_policy_shift_desc: "Lanskap politik Hindia terdorong oleh kebangkitan nasional dalam beberapa dekade terakhir, dan kebijakan kolonial lama sudah usang. Kita harus merombak struktur pemerintahan."
  INS_reallocate_rubber_industry_funding: "Realokasi Pendanaan Industri Karet"
  INS_reallocate_rubber_industry_funding_desc: "Ketergantungan semata pada ekspor karet memukul telak ekonomi kita saat harga anjlok. Kita harus mendiversifikasi perekonomian dengan membuka tambang mineral dan pabrik baru di seantero nusantara."
  INS_reallocate_rubber_industry_funding_tt: "Membuka keputusan untuk §Ymenghapus karet dari suatu wilayah§! dan menggantikannya dengan sejumlah §Ysumber daya lainnya§!."
  INSHOL_nationalist_coallition: "Koalisi Nasionalis"
  INSHOL_nationalist_coallition_desc: "Volksraad telah berbicara dengan satu suara terlalu lama, dan suara itu terlampau lirih. Waktu untuk sekadar mengajukan petisi dan bersabar telah usai. Sebuah koalisi anggota nasionalis di dewan akan mengesampingkan perselisihan dan menuntut kemerdekaan mutlak. Tokoh-tokoh kawakan di luar parlemen yang dahulu ditepikan Belanda akan disambut kembali ke barisan perjuangan."
  INSHOL_volksraad_compromises: "Kompromi Volksraad"
  INSHOL_volksraad_compromises_desc: "Reformasi melalui jalur dewan telah mengantarkan kita sejauh ini dan tiada alasan untuk mencampakkan jalan tersebut sekarang. Volksraad akan meneruskan perjuangannya yang terukur, menukar konsesi demi konsesi dengan Den Haag, merengkuh pemerintahan mandiri lewat kesabaran alih-alih konfrontasi bersenjata. Masa depan di dalam persemakmuran Belanda menawarkan prospek yang jauh lebih cerah."
  INSHOL_establish_the_princely_council: "Bentuk Dewan Swapraja"
  INSHOL_establish_the_princely_council_desc: "Para sultan dan raja di nusantara memiliki kesetiaan yang tidak dimiliki kamar mana pun di Batavia. Pengadilan mereka lebih tua dari Kompeni dan lebih tua dari Republik yang menggantikannya. Sebuah dewan formal yang terdiri dari keluarga pangeran akan memberikan para penguasa ini kursi di meja negara baru, dan mengikat otoritas mereka pada kita."
  INSHOL_nationalize_dutch_companies: "Nasionalisasi Perusahaan-Perusahaan Belanda"
  INSHOL_nationalize_dutch_companies_desc: "Kongsi dagang raksasa, armada perkapalan KPM, perkebunan, dan perbankan telah memakai nama Belanda sejak zaman yang lampau. Mulai saat ini semuanya akan memakai nama Indonesia. Kursi direksi akan dirombak, papan nama diganti, dan modal yang telah diperas dari kepulauan ini selama tiga abad akhirnya menjadi milik sah bangsa Indonesia."
  INSHOL_democracy: "Indonesia yang Demokratis"
  INSHOL_democracy_desc: "Volksraad memulai kehidupannya sebagai badan setengah-setengah, sebuah badan penasehat dengan gigi yang dibatasi secara hati-hati, yang dirancang untuk menawarkan penampilan representasi namun tetap menyembunyikan substansinya. Ini telah melampaui pembuatnya. Dewan tersebut akan dibentuk kembali menjadi badan legislatif yang sebenarnya, dengan anggota-anggota yang dipilih oleh rakyat yang mereka klaim mewakili mereka dan keputusan-keputusan mengikat pemerintah yang pernah mengendalikan mereka."
  INSHOL_princely_authority: "Kekuasaan Kaum Swapraja"
  INSHOL_princely_authority_desc: "Dewan penasihat adalah hal yang baik, namun para sultan yang menyumbangkan nama mereka pada pendirian negara ini mungkin akan memberikan lebih dari itu. Parlemen tidak akan menghalangi mereka yang ingin salah satu dari mereka diunggulkan. Pengadilan lama telah menunggu lama hingga pertanyaan ini ditanyakan kembali kepada mereka."
  INSHOL_encourage_further_investment: "Dorong Penanaman Modal Lanjutan"
  INSHOL_encourage_further_investment_desc: "Persyaratan yang disepakati di Volksraad telah menyelesaikan permasalahan politik saat ini, dan pemerintah Belanda pun telah memperhatikan hal ini. Tarif akan dilonggarkan, jaminan akan diperluas, dan kamar dagang di Amsterdam dan Rotterdam akan diyakinkan bahwa kepulauan ini tetap terbuka untuk bisnis. Apa yang menguntungkan dalam pengaturan lama akan menguntungkan dalam pengaturan baru."
  # <Joint Tree - ABDACOM>
  INSHOL_east_indies_artillery: "Manufaktur Artileri Hindia Belanda"
  INSHOL_east_indies_artillery_desc: "Membuka pabrik manufaktur artileri di Jawa akan membebaskan militer kita dari ketergantungan impor senjata asing."
  INSHOL_recall_gerardus_johannes_berenschot: "Panggil Kembali Jenderal Berenschot"
  INSHOL_recall_gerardus_johannes_berenschot_desc: "Gerardus Johannes Berenschot adalah salah satu jenderal paling cakap di lingkungan militer. Ia menghabiskan sebagian besar kariernya di Hindia namun sempat bertugas di Belanda. Di masa genting ini, kita harus memanggilnya pulang ke Hindia untuk memimpin pertahanan militer."
  INSHOL_east_indies_cruiser_manufacturing: "Manufaktur Kapal Penjelajah Hindia"
  INSHOL_east_indies_cruiser_manufacturing_desc: "Memproduksi kapal penjelajah kita sendiri alih-alih memesannya dari Belanda adalah langkah perdana membangun Angkatan Laut sejati, ikhtiar yang sangat krusial dalam menghadapi agresi Jepang."
  INSHOL_transfer_of_conrad_helfrich: "Pindahkan Conrad Helfrich ke Hindia"
  INSHOL_transfer_of_conrad_helfrich_desc: "Menempatkan Laksamana Conrad Helfrich ke Hindia secara langsung akan mendongkrak keandalan pertahanan maritim armada laut kita."
  # <Joint Tree - Naval Program>
  INSHOL_naval_program: "Program Angkatan Laut Belanda-Indonesia"
  INSHOL_naval_program_desc: "Angkatan Laut Hindia Belanda tertinggal jauh di belakang kekuatan laut lainnya. Adalah kepentingan semua pihak untuk mempercepat pembangunan armada ini demi kesiapsiagaan menghadapi ancaman bersama."
  INSHOL_naval_program_transfer_25_tt: "Alihkan §Y25%§! armada laut kita kepada [INS.GetNameDef]."
  INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! akan mengalihkan §Y25%§! armada laut mereka kepada §Y[INS.GetNameDefCap]§!."
  INSHOL_naval_program_transfer_100_tt: "Alihkan §Rseluruh armada angkatan laut kita§! kepada [INS.GetNameDef]."
  INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! akan mengalihkan seluruh armada laut mereka kepada §Y[INS.GetNameDefCap]§!."
  INSHOL_naval_program_rejected_tt: "Membuka fokus nasional §Y$INSHOL_naval_secondchance$§!."
  INSHOL_hybrid_navy: "Armada Laut Campuran"
  INSHOL_hybrid_navy_desc: "Angkatan Laut kita tidak boleh hanya mengandalkan armada Pasifik warisan [HOL.GetNameDef]; kita harus mulai merakit kapal sendiri agar suplai armada tidak terputus bila terjadi kekalahan tempur."
  INSHOL_request_naval_control: "Skuadron Hindia Belanda"
  INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap] telah jatuh dan tidak lagi berada dalam posisi mengendalikan armada laut utuh. Kita harus mengambil alih kepemimpinannya selama sisa perang berkecamuk."
  INSHOL_naval_secondchance: "Skema Maritim Hindia Belanda"
  INSHOL_naval_secondchance_desc: "Kendati [HOL.GetNameDef] menolak menyerahkan kendali resmi atas armadanya, kita tetap harus mengawal perairan Pasifik jika tidak ingin dilibas musuh. Kita akan mencari alternatif yang memadai."
  # <Joint Tree - Netherlands in Exile>
  INSHOL_netherlands_in_exile: "Pemerintahan Belanda di Pengasingan"
  INSHOL_netherlands_in_exile_desc: "Jatuhnya tanah air tercinta kini menjadi kenyataan pahit. Kita tidak boleh tenggelam dalam keputusasaan. Kita harus menerima kenyataan dan menyelamatkan apa pun yang masih tersisa."
 # INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
  INSHOL_relocate_our_generals: "Pindahkan Angkatan Perang ke Jawa"
  INSHOL_relocate_our_generals_desc: "Jendral, Komandan, dan Prajurit yang tersisa di pengasingan harus dipindahkan ke [1058.GetName] dengan prioritas utama, sebelum terlambat."
  #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
  INSHOL_netherlands_indonesia_union: "Uni Belanda-Indonesia"
  INSHOL_netherlands_indonesia_union_desc: "Gagasan tentang uni yang setara antara [HOL.GetNameDef] dan [INS.GetNameDef] mungkin dianggap aneh oleh sebagian kalangan, namun dalam badai krisis yang kita hadapi, ini adalah jalan terbaik untuk mempertahankan kedaulatan kita bersama."
  # <Sukarno Shared Branch - Resistance Buildup>
  INS_underground_revolution: "Revolusi Bawah Tanah"
  INS_underground_revolution_desc: "Kita akan menyusun siasat revolusi dari kegelapan bawah tanah, perlahan memperluas kader dan aktivitas milisi hingga saat yang tepat untuk menyerang tiba."
  INS_infiltrate_the_media: "Infiltrasi Media Massa"
  INS_infiltrate_the_media_desc: "Pergerakan kita telah menempatkan kader-kader di jajaran redaksi surat kabar terkemuka di Hindia. Kita dapat memanfaatkan corong ini untuk menanamkan sentimen pro-kemerdekaan ke benak rakyat."
  INS_infiltrate_the_army: "Infiltrasi Angkatan Perang"
  INS_infiltrate_the_army_desc: "Banyak dari kawan kita berdinas di tubuh KNIL, mulai dari serdadu rendahan hingga perwira. Kita kumpulkan rahasia militer sebanyak mungkin sembari mengangkat orang-orang kita ke posisi strategis untuk melumpuhkan KNIL dari dalam."
  INS_privately_owned_military_industry: "Industri Militer Terselubung"
  INS_privately_owned_military_industry_desc: "Kita akan mendirikan beberapa perusahaan bayangan di sektor bengkel permesinan dan mesiu, memastikan kendali penuh atas industri senjata begitu perang kemerdekaan pecah."
  INS_privately_owned_military_industry_tt: "Tambah §G2§! §YPabrik Militer§! di Markas Besar Anda"
  INS_instigate_chaos_sulawesi: "Kobarkan Pergolakan di Sulawesi"
  INS_instigate_chaos_sulawesi_desc: "Kita akan merangkul tokoh nasionalis lokal di Sulawesi, mengorganisasi pemogokan, perlawanan rakyat, dan membakar semangat juang massa."
  INS_instigate_chaos_sulawesi_tt: "Begitu kita memproklamasikan kemerdekaan, kita akan memperoleh §Gwilayah inti§! di §Y[673.GetName]§! dan §Y[1056.GetName]§!."
  INS_instigate_chaos_medan: "Kobarkan Pergolakan di Medan"
  INS_instigate_chaos_medan_desc: "Kami akan bekerja sama dengan kaum nasionalis lokal di Medan dan Riouw, mengorganisir pemogokan, kerusuhan, dan meradikalisasi masyarakat."
  INS_instigate_chaos_medan_tt: "Begitu kita memproklamasikan kemerdekaan, kita akan memperoleh §Gwilayah inti§! di §Y[1049.GetName]§!."
  INS_embezzlement_scheme_in_batavia: "Siasat Pengalihan Logistik di Batavia"
  INS_embezzlement_scheme_in_batavia_desc: "Kita akan merancang skema rahasia untuk memindahkan mesin pabrik dan amunisi dari Batavia ke wilayah kekuasaan Republik saat proklamasi dikumandangkan."
  INS_embezzlement_scheme_in_batavia_tt: "Saat menyatakan kemerdekaan, separuh pabrik di §Y[1058.GetName]§! akan dipindahkan ke §YMarkas Besar Revolusioner§! kita."
  INS_volksraad_rumors: "Desas-desus di Volksraad"
  INS_volksraad_rumors_desc: "Kami akan mulai mendiskusikan revolusi secara diam-diam di dalam Volksraad. Jika kita berhasil, kita bisa meyakinkan anggota Volksraad Indonesia untuk bergabung dengan kita."
  INS_volksraad_rumors_tt: "Seluruh penasihat pribumi §YIndonesia§! di Volksraad akan §Gdipertahankan§! setelah proklamasi kemerdekaan."
  INS_railway_youth_force: "Rangkul Angkatan Pemuda Kereta Api (AMKA)"
  INS_railway_youth_force_desc: "Angkatan Pemuda Kereta Api adalah barisan milisi pemuda yang sangat militan di Jawa Tengah, terkenal piawai merebut dan mengoperasikan jalur kereta api strategis. Mereka adalah sekutu tempur yang berani, namun tidak sabaran dalam gencatan senjata yang berlarut-larut."
  INS_sleeper_informant_network: "[GetInformantNetworkName]"
  INS_Sleeper_Informant_Network_name: "Jejaring Informan Bawah Tanah"
  INS_KNIL_Informant_Network_name: "Jejaring Intelijen KNIL"
  INS_sleeper_informant_network_desc: "Kita akan membangun jejaring informan yang tertanam rapi di seluruh aparatur militer KNIL, memberi peringatan dini atas setiap rencana ofensif Belanda."
  INS_sleeper_informant_network_tt: "§RSaat Kemerdekaan diproklamirkan:§!"
  # <Sukarno Shared Branch - Peoples Security Army>
  INS_the_peoples_security_army: "Tentara Keamanan Rakyat (TKR)"
  INS_the_peoples_security_army_desc: "Anggota kami yang sebagian besar adalah generasi muda Indonesia semakin tidak sabar, bersemangat untuk berkontribusi dan memperjuangkan kemerdekaan kita. Kita harus membentuk Angkatan Bersenjata Revolusioner dan mulai melatih prajurit masa depan kita."
  INS_commander_sudirman: "Panglima Besar Soedirman"
  INS_commander_sudirman_desc: "Sudirman, meskipun merupakan pendatang muda, telah menunjukkan potensi besar dan sangat populer di kalangan muda anggota perlawanan. Dia harus memandu jalan Tentara Keamanan Rakyat dan memimpin kita menuju kemenangan."
  INS_commander_oerip: "Tentara Profesional Oerip Soemohardjo"
  INS_commander_oerip_desc: "Oerip Soemohardjo telah mengabdi puluhan tahun dalam dinas militer dan merupakan perwira pribumi berprestasi di KNIL. Pengalaman dan kedisiplinan militernya akan meletakkan fondasi profesional bagi tentara Republik."
  INS_sudirmans_promotion: "Kenaikan Pangkat Soedirman"
  INS_sudirmans_promotion_desc: "Soedirman telah membuktikan kepiawaian taktisnya memimpin pertempuran Ambarawa dan menyatukan laskar. Waktunya menganugerahkan pangkat Panglima Besar Jenderal kepadanya."
  INS_tkr_steal_general: "Rekrut Perwira Berpengalaman KNIL"
  INS_tkr_steal_general_desc: "Jika kita dapat meyakinkan para petinggi Angkatan Darat Hindia Timur untuk bergabung dengan perjuangan kita, kita akan meningkatkan angkatan bersenjata kita sekaligus menyabotase angkatan bersenjata mereka."
  INS_tkr_supply: "Setiap Pejuang Wajib Bertempur"
  INS_tkr_supply_desc: "Kita pastikan setiap kader gerakan kemerdekaan menerima pelatihan kemiliteran dasar tanpa terkecuali."
  INS_tkr_professional_army: "Tentara Nasional yang Profesional"
  INS_tkr_professional_army_desc: "Kita tidak boleh selamanya mengandalkan laskar bersenjata bambu runcing; kita harus membangun angkatan perang reguler yang berdisiplin tinggi demi menegakkan ketertiban dan kedaulatan."
  INS_arm_the_revolutionaries: "Persenjatai Kaum Revolusioner"
  INS_arm_the_revolutionaries_desc: "Kita harus mulai dari kaum revolusioner dan nasionalis yang penuh energi dan siap memberikan segala yang dimilikinya untuk Indonesia. Kami akan memberi mereka pelatihan dan peralatan yang mereka perlukan untuk berjuang demi negara mereka."
  INS_arm_the_youth: "Persenjatai Barisan Pemuda"
  INS_arm_the_youth_desc: "Selain kaum revolusioner, kita harus mempersenjatai generasi muda. Masih penuh energi dan harapan, mereka akan membawa api revolusi. Kita harus memastikan sebanyak mungkin generasi muda Indonesia dilatih dan diperlengkapi untuk berperang. Jika pertempuran mencapai rumah mereka, mereka akan siap bertindak."
  INS_arm_the_students: "Persenjatai Mahasiswa dan Pelajar"
  INS_arm_the_students_desc: "Mahasiswa telah membangun landasan revolusi sejak puluhan tahun yang lalu, dan mereka akan terus memimpinnya ke depan."
  INS_guerilla_industry: "Industri Gerilya"
  INS_guerilla_industry_desc: "Kita manfaatkan bengkel-bengkel rakyat di pedalaman hutan untuk merakit senjata api, mencetak peluru darurat, dan memperbaiki mortir rampasan perang."
  INS_indonesian_assault_doctrine: "Doktrin Serbuan Indonesia"
  INS_indonesian_assault_doctrine_desc: "Semangat membara butuh daya gempur nyata. Kita harus memprioritaskan persenjataan artileri dan mortir untuk mendobrak garis pertahanan kota musuh."
  INS_tighter_tkr_integration: "Integrasi TKR dan Laskar Rakyat"
  INS_tighter_tkr_integration_desc: "Tentara resmi TKR dan berbagai laskar milisi sering kali bergerak sendiri-sendiri tanpa koordinasi komando. Kita harus melebur mereka menjadi satu wadah kepemimpinan terpadu (TRI/TNI), kendati menghadapi keberatan dari komandan laskar."
  INS_quality_over_quantity: "Kualitas di Atas Kuantitas"
  INS_quality_over_quantity_desc: "Satu regu komando terlatih dengan doktrin matang dan senapan modern jauh lebih mematikan daripada puluhan pemuda bersenjata seadanya. Kita utamakan pembentukan pasukan khusus dan pasukan penyerbu profesional."
  INS_add_militia_cap_1_tt: "§YFreedom Fighter§! batas divisi meningkat sebesar §Y1§!."
  INS_add_militia_cap_2_tt: "§YFreedom Fighter§! batas divisi meningkat sebesar §Y2§!."
  INS_add_militia_cap_3_tt: "§YFreedom Fighter§! batas divisi meningkat sebesar §Y3§!."
  INS_add_3_militia_unit_tt: "Bentuk tiga satuan §YPejuang Kemerdekaan§!, yang dapat dikerahkan dalam §Yserbuan§! untuk melipatgandakan §Gkeberadaan milisi§! di wilayah Belanda."
  INS_add_fully_trained_militia_unit_tt: "Buat satu unit §YPejuang Kemerdekaan§! yang terlatih."
  # <Sukarno Shared Branch - Expand Resistance Membership>
  INS_expand_resistance_membership: "Perluas Keanggotaan Perlawanan"
  INS_expand_resistance_membership_desc: "Memusatkan perlawanan hanya di satu markas adalah kekeliruan fatal. Kita sebar utusan laskar ke berbagai pulau guna menggalang simpati dan menguasai daerah."
  # <Central Independence Branch - Militias>
  INS_deploy_the_kris: "Kebaktian Rakyat Indonesia Sulawesi (KRIS)"
  INS_deploy_the_kris_desc: "Kebaktian Rakyat Indonesia Sulawesi (KRIS) adalah laskar tempur pemuda asal Sulawesi yang sangat tangguh di medan laga. Kita rangkul mereka untuk bertempur bahu-membahu bersama TKR."
  INS_assist_the_pemuda: "Bantu Barisan Pemuda"
  INS_assist_the_pemuda_desc: "Pulau Jawa dipenuhi laskar pemuda berani mati. Memberi mereka amunisi dan bimbingan militer akan menjamin kesetiaan mereka pada komando Republik."
  INS_mobilize_the_pemuda: "Mobilisasi Barisan Pemuda"
  INS_mobilize_the_pemuda_desc: "Setelah memenangkan kepercayaan kelompok-kelompok pemuda terbesar, kita integrasikan barisan mereka ke dalam kesatuan reguler TKR."
  INS_organize_jakarta_pemuda: "Organisasi Pemuda Jakarta"
  INS_organize_jakarta_pemuda_desc: "Di jalanan Jakarta, laskar-laskar pemuda dan kelompok pejuang perkotaan bergerilya menentang tentara Sekutu dan NICA. Kita satukan mereka di bawah komando resmi."
  INS_recognize_moestopos_batallion: "Pengakuan Batalion Moestopo"
  INS_recognize_moestopos_batallion_desc: "Tokoh revolusioner Moestopo yang mengangkat dirinya sebagai 'Menteri Pertahanan Ad Interim' di Surabaya memimpin laskar perlawanan dengan gigih. Kita akui jasanya dan angkat beliau menjadi Mayor Jenderal TKR."
  INS_darul_islam_focus: "Laskar Hizbullah & Sabilillah (Darul Islam)"
  INS_darul_islam_focus_desc: "Laskar Hizbullah pimpinan Kartosoewirjo telah membuktikan kehebatannya di perbukitan Jawa Barat. Kita rangkul mereka ke dalam barisan pertahanan Republik, memberi mereka pangkat kehormatan."
  # <Central Independence Branch - Navy>
  INS_just_a_fisherman: "Hanyalah Seorang Nelayan"
  INS_just_a_fisherman_desc: "Mengobarkan perang di negara kepulauan tanpa armada laut adalah misi mustahil. Kita gunakan taktik penyamaran: menyusupkan pasukan milisi menggunakan perahu-perahu nelayan tradisional melintasi blokade laut Belanda."
  INS_a_cheap_navy: "Armada Laut Darurat"
  INS_a_cheap_navy_desc: "Kita tidak memiliki modal melimpah untuk membangun kapal perang baja. Kita modifikasi kapal motor kayu, perahu patroli, dan kapal tunda dengan senapan mesin rampasan."
  INS_divert_army_funds_to_navy: "Alihkan Dana Angkatan Darat ke Angkatan Laut"
  INS_divert_army_funds_to_navy_desc: "Indonesia adalah negeri bahari; pasukan darat kita akan terkepung tanpa kapal untuk mengangkut logistik dan menerobos blokade. Pengorbanan anggaran ini mutlak diperlukan."
  INS_indonesian_naval_doctrine: "Doktrin Angkatan Laut Indonesia"
  INS_indonesian_naval_doctrine_desc: "Membangun armada maritim menuntut doktrin tempur yang sesuai dengan taktik perang laut kepulauan dan gerilya selat sempit nusantara."
  INS_domestic_shipbuilding: "Galangan Kapal Nasional"
  INS_domestic_shipbuilding_desc: "Kita tidak bisa selamanya bergantung pada kapal rampasan Belanda. Kita harus menggerakkan galangan kapal rakyat di Surabaya dan Cirebon untuk membangun armada sendiri."
  INS_acquire_modern_blueprints: "Dapatkan Cetak Biru Modern"
  INS_acquire_modern_blueprints_desc: "Kita selundupkan cetak biru desain kapal cepat dan torpedo dari luar negeri guna meningkatkan persenjataan armada Republik."
  INS_reclaiming_the_dutch_navy: "Rebut Kembali Pangkalan Armada Hindia"
  INS_reclaiming_the_dutch_navy_desc: "Belanda meninggalkan sejumlah kapal patroli dan fasilitas pangkalan laut di pelabuhan yang kini kita kuasai. Kita ambil alih armada tersebut untuk melengkapi BKR Laut."
  INS_admiral_mas_pardi: "Laksamana Mas Pardi"
  INS_admiral_mas_pardi_desc: "Setiap angkatan laut membutuhkan nahkoda ulung. Mas Pardi, tokoh pelayaran pribumi pendiri BKR Laut, adalah sosok yang paling tepat memegang komando maritim kita."
  INS_akademi_angkatan_laut: "Dirikan Akademi Angkatan Laut (AAL)"
  INS_akademi_angkatan_laut_desc: "Kita bangun Akademi Angkatan Laut di Surabaya untuk mendidik kader perwira bahari dan insinyur maritim masa depan bangsa."
  # <Central Independence Branch - Militia Logistics>
  INS_pki_militia_tt: "Tan Malaka memimpin laskar milisi yang sangat kuat, namun mereka bertempur tidak hanya demi Indonesia tetapi juga demi panji §Rkomunisme§! dan perjuangan Soviet. §RPada akhirnya, mereka akan menentang pemerintahan non-komunis dengan kekerasan.§!"
  INS_increase_laskar_funding_tt: "§WMendapatkan§! 1 §YPabrik Militer§! untuk setiap tuntutan laskar yang berhasil dipenuhi (maksimal §G6§!)"
  INS_subsidize_laskar_armament: "Subsidi Persenjataan Laskar"
  INS_subsidize_laskar_armament_desc: "Milisi yang hanya bersenjatakan bambu runcing tidak akan bertahan lama melawan tentara modern bersenjata otomatis. Kita harus memproduksi senapan dan amunisi untuk laskar."
  INS_loot_knil_weapons_caches: "Jarahlah Gudang Senjata KNIL"
  INS_loot_knil_weapons_caches_desc: "Terdapat banyak gudang amunisi rahasia yang ditinggalkan KNIL. Karena banyak kader kita mantan serdadu KNIL, kita dapat melacak dan mengamankan timbunan senjata berharga tersebut."
  INS_utilize_tan_malakas_militia: "Kerahkan Barisan Milisi Tan Malaka"
  INS_utilize_tan_malakas_militia_desc: "Laskar Merah binaan Tan Malaka adalah salah satu kekuatan tempur terkuat di Indonesia, dan memobilisasinya ke dalam TKR akan menjadi kekuatan dahsyat. Namun ini mengandung risiko politik besar."
  INS_increase_laskar_funding: "Tingkatkan Dana Laskar"
  INS_increase_laskar_funding_desc: "Laskar rakyat menyumbang porsi terbesar kekuatan bersenjata kita. Kita harus menghargai pengorbanan mereka dengan kucuran logistik yang layak."
  INS_develop_a_functioning_airforce: "Bangun Angkatan Udara Sejati"
  INS_develop_a_functioning_airforce_desc: "Menguasai angkasa adalah kunci pertahanan; kita kumpulkan pesawat peninggalan Jepang di pangkalan Maguwo dan Bugis untuk merintis cikal bakal AURI."
  INS_political_stabilization: "Komite Nasional Indonesia Pusat (KNIP)"
  INS_political_stabilization_desc: "Guna mengakhiri perselisihan antarfaksi politik, kita berikan ruang musyawarah di KNIP yang berfungsi sebagai parlemen darurat pendamping Presiden."
  INS_nationalize: "Nasionalisasi Aset!"
  INS_nationalize_desc: "Republik yang merdeka tidak boleh dibelenggu oleh gurita bisnis kolonial. Kilang minyak, perkebunan, dan industri strategis Belanda dinasionalisasi menjadi milik bangsa."
  # <Vice Presidential Edict - Intro>
  INS_restore_order: "Pulihkan Ketertiban"
  INS_restore_order_desc: "Bangsa kita menjadi semakin tidak stabil dari hari ke hari. Jika kita tidak segera bereaksi, perang saudara tidak dapat dihindari. Kita harus memulai negosiasi antara Komite Nasional, Presiden, dan pemimpin Milisi untuk menemukan solusi."
  INS_vice_presidential_edict: "Maklumat Wakil Presiden No. X"
  INS_vice_presidential_edict_desc: "Bung Hatta menandatangani Maklumat Wakil Presiden No. X yang memberikan wewenang legislatif nyata kepada KNIP dan membuka jalan bagi berdirinya multipartai di Indonesia."
  INS_local_cooperatives: "Bentuk Koperasi Rakyat"
  INS_local_cooperatives_desc: "Kita bangun ekonomi berasaskan kekeluargaan dan gotong royong sebagaimana dicita-citakan Mohammad Hatta, memberdayakan koperasi di setiap daerah."
  INS_local_unity: "Otonomi Parsial bagi Daerah Swapraja"
  INS_local_unity_desc: "Kita hormati kedudukan kesultanan dan daerah istimewa yang setia membela Republik, memberi mereka otonomi pemerintahan mandiri."
  INS_education_subsidies: "Subsidi Pendidikan Rakyat"
  INS_education_subsidies_desc: "Mencerdaskan kehidupan bangsa adalah amanat kemerdekaan. Kita dirikan sekolah-sekolah rakyat yang terjangkau di setiap penjuru republik."
  INS_land_reform: "Reforma Agraria"
  INS_land_reform_desc: "Bekas perkebunan dan tanah partikelir milik kolonial disita dan dibagikan secara adil kepada kaum petani penggarap dengan harga terjangkau."
  INS_dominion_of_atjeh: "Daerah Modal Aceh"
  INS_dominion_of_atjeh_desc: "Rakyat Aceh yang gigih berjuang dan menopang perjuangan Republik kita berikan otonomi istimewa untuk mengelola urusan keagamaan dan adat istiadatnya."
  # <Vice Presidential Edict - Presidential Balance>
  INS_dissolve_national_party: "Tolak Partai Tunggal"
  INS_dissolve_national_party_desc: "Membatasi kekuasaan mutlak Presiden dan menolak gagasan partai tunggal demi menjamin tegaknya sistem demokrasi multipartai yang sehat."
  INS_womens_sufferage: "Hak Pilih Kaum Wanita"
  INS_womens_sufferage_desc: "Memberikan hak suara dan partisipasi politik setara bagi kaum perempuan Indonesia dalam panggung demokrasi."
  INS_women_in_military: "Laskar Wanita dalam Angkatan Perang"
  INS_women_in_military_desc: "Mengakui keberanian Laskar Wanita Indonesia (Laswi) dan memberi mereka hak berdinas resmi di jajaran militer."
  INS_fair_election: "Pemilihan Umum yang Bebas dan Demokratis"
  INS_fair_election_desc: "Setelah perang kemerdekaan reda, kita gelar pemilihan umum demokratis pertama yang jujur dan adil tanpa bayang-bayang otoritarianisme."
  # < Hybrid Politics >
  INS_continue_hybrid_politics: "Pertahankan Demokrasi Terpimpin"
  INS_continue_hybrid_politics_desc: "Indonesia masih terlalu muda dan rentan dari ancaman perpecahan. Diperlukan kepemimpinan negara yang kuat diimbangi pengawasan dewan demi stabilitas persatuan."
  INS_guided_economy: "Ekonomi Terpimpin"
  INS_guided_economy_desc: "Negara mengendalikan cabang-cabang produksi penting dan yang menguasai hajat hidup orang banyak demi kemakmuran bersama."
  INS_reform_education_system: "Pendidikan Ideologi Kebangsaan"
  INS_reform_education_system_desc: "Menanamkan nilai-nilai dasar Pancasila dan cinta tanah air ke dalam kurikulum seluruh jenjang pendidikan nasional."
  INS_reform_education_system_2: "Reformasi Pendidikan Nasional"
  INS_reform_education_system_2_desc: "Menjamin hak setiap anak bangsa dari Sabang sampai Merauke untuk memperoleh pendidikan bermutu dan bebas diskriminasi."
  INS_three_year_plan: "Rencana Tiga Tahun"
  INS_three_year_plan_desc: "Kita dapat menyusun rencana tiga tahun untuk membangun infrastruktur di seluruh kepulauan dan menghubungkan pulau-pulau."
  INS_destroy_pacific_colonialism: "Hancurkan Kolonialisme Pasifik"
  INS_destroy_pacific_colonialism_desc: "Revolusi mungkin telah berakhir, namun masih ada perjuangan yang harus dilakukan. Masih banyak orang yang hidup di bawah tirani kolonial di depan pintu kita. Kita tidak bisa hanya duduk diam dan menonton, kita harus bertindak untuk membebaskan mereka dari penguasanya!"
  INS_rapid_mobilization: "Mobilisasi Cepat"
  INS_rapid_mobilization_desc: "Setiap negara yang kuat memiliki tentara yang kuat sebagai penopangnya. Jika kita ingin menjadi kekuatan besar regional yang mampu mempertahankan kedaulatan kita, kita harus mulai dengan menjadikan tentara kita jauh lebih kuat daripada saat ini."
  INS_greater_indonesia: "Proklamasikan Indonesia Raya"
  INS_greater_indonesia_desc: "Kerajaan kuno Nusantara pernah menyatukan dunia Melayu sebagai satu kesatuan, satu bangsa. Dengan terbebasnya Malaya dari tirani kolonial, kita harus melakukan seperti nenek moyang kita di Nusantara, mendeklarasikan seluruh dunia Melayu sebagai satu bangsa yang bersatu."
  # < State Religion >
  INS_secularism: "Sekularisme"
  INS_secularism_desc: "Indonesia adalah rumah bagi berbagai kalangan dari banyak agama. Mencampuradukkan agama dan politik hanya akan memicu perpecahan, oleh karena itu kita harus melarang partai-partai politik berbasis agama."
  INS_integrate_sarekat_islam: "Integrasikan Sarekat Islam"
  INS_integrate_sarekat_islam_desc: "Partai-partai politik Islam besar memiliki banyak dukungan rakyat. Demi kepentingan terbaik kita, kita harus mengintegrasikan mereka ke dalam pemerintahan."
  # <Vice Presidential Edict - Sjahrir>
  INS_sjahrirs_continued_tenure: "Kelanjutan Masa Jabatan Sjahrir"
  INS_sjahrirs_continued_tenure_desc: "Perdana Menteri Sjahrir telah membuktikan dirinya sebagai pemimpin ulung, membimbing kita melewati masa revolusi, memperbaiki perekonomian kita, dan menegakkan demokrasi. Kita harus memilihnya kembali sebagai Perdana Menteri."
  INS_unity_in_diversity: "Bhinneka Tunggal Ika"
  INS_unity_in_diversity_desc: "Selama berabad-abad semboyan Bhinneka Tunggal Ika telah menangkap jiwa kepulauan kita. Semasa revolusi, gagasan ini menjadi seruan pemersatu, mengingatkan bangsa Indonesia bahwa kendati kita berbicara dalam banyak bahasa dan memeluk beragam adat istiadat, kita berdiri bersama sebagai satu bangsa. Kita harus mematri semboyan ini ke dalam konstitusi kita, agar persatuan kita lestari untuk generasi-generasi mendatang."
  INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
  INS_timor_issue_scripted_name_issue: "Masalah Timor"
  INS_timor_issue_scripted_name_attack: "Serang Timor Timur"
  INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
  INS_timor_issue_scripted_desc_issue: "Timor Timur jelas merupakan wilayah sah Indonesia, dan meski revolusi telah berakhir, wilayah itu masih berada di bawah kekuasaan kolonial. Kita akan mengirim ultimatum kepada [721.OWNER.GetName] menuntut penyerahan segera Timor Timur."
  INS_timor_issue_scripted_desc_attack: "Timor Timur jelas merupakan wilayah sah Indonesia. Para pemberontak di pulau tersebut mungkin mengklaim kemerdekaan, namun mereka jelas tidak mewakili seluruh penduduk. Sisa-sisa kolonialisme Portugis harus diintegrasikan ke dalam Republik."
  INS_pledge_to_allies: "Ikrar kepada Sekutu"
  INS_pledge_to_allies_desc: "Kita berada dalam risiko diserang sebagai bagian dari konflik yang meluas di seluruh dunia. Kendati hubungan kita dengan Sekutu sempat goyah, kita telah memantapkan diri sebagai kekuatan Demokrasi di Pasifik dan harus menyelaraskan diri dengan negara-negara demokrasi besar."
  INS_mixed_economy_system: "Sistem Ekonomi Campuran"
  INS_mixed_economy_system_desc: "Indonesia adalah negara yang unik dan tidak akan berkembang di bawah Kapitalisme maupun Komunisme tradisional. Kita harus membangun sistem ekonomi campuran, dengan memadukan unsur-unsur kapitalisme dan komunisme."
  INS_social_democracy: "Demokrasi Sosial"
  INS_social_democracy_desc: "Perekonomian [INS.GetAdjective] telah tumbuh pesat sejak kebijakan ekonomi Sjahrir diterapkan. Kita harus menyatakan Indonesia sebagai negara Sosial Demokrat sejati, dan mengembangkan kebijakan ekonomi masa depan berdasarkan prinsip-prinsip sosial demokrasi."
  # <Vice Presidential Edict - Sjarifuddin>
  INS_prime_minister_sjarifuddin: "Perdana Menteri Sjarifuddin"
  INS_prime_minister_sjarifuddin_desc: "Sjarifuddin adalah calon terbaik bagi Indonesia, kebijakan-kebijakannya yang moderat memungkinkan kompromi antara kaum komunis dan sosialis."
  INS_concessions_to_communists: "Konsesi kepada Kaum Komunis"
  INS_concessions_to_communists_desc: "PKI mempunyai jumlah kursi yang signifikan di parlemen, kita harus memberikan beberapa posisi menteri kepada para pemimpin PKI untuk menjamin stabilitas."
  INS_sjarifuddin_focus_2: "Ekonomi Ekspor Mandiri"
  INS_sjarifuddin_focus_2_desc: "Dengan kemerdekaan yang baru kita raih, kita harus meninjau kembali sistem ekonomi ekspor kita dan menata ulangnya sehingga tidak lagi memperhitungkan keuntungan Belanda. Meskipun ekonomi berbasis ekspor masih riskan, kita dapat membuatnya jauh lebih andal dibanding tahun-tahun sebelumnya."
  # <Vice Presidential Edict - Hatta>
  INS_prime_minister_hatta: "Perdana Menteri Hatta"
  INS_prime_minister_hatta_desc: "Mohammad Hatta, yang dikenal sebagai proklamator revolusi bersama Sukarno, menjabat sebagai Wakil Presiden dan secara umum memiliki kecenderungan lebih demokratis di antara keduanya. Beliau akan menjadi Perdana Menteri yang tepat dan dapat diterima secara kompromi oleh sebagian besar partai politik."
  INS_hatta_focus_2: "Langkah Selanjutnya"
  INS_hatta_focus_2_desc: "Revolusi telah usai, dan kendati beberapa tokoh politik bersikeras bahwa revolusi harus terus berlanjut, suara-suara tersebut sebaiknya diabaikan. Sebaliknya kita harus menatap ke depan, kita harus membangun Indonesia agar generasi masa depan dapat hidup dalam kemakmuran."
  INS_hatta_princely_advisors: "Integrasikan Daerah Swapraja"
  INS_hatta_princely_advisors_desc: "Melalui keberagaman kita bersama, kita menemukan kesatuan. Kita mendasarkan bangsa kita pada prinsip ini, namun berakhirnya revolusi telah menghambat gagasan tersebut karena kurangnya perjuangan bersama. Untuk mencegah kebencian dan pemberontakan dari kelompok minoritas, kita harus membentuk dewan tambahan di mana penguasa lokal dari negara-negara pangeran mempunyai suara langsung dalam politik nasional."
  INS_prime_minister_tt: "Pemilihan umum Indonesia pertama telah dilaksanakan"
  # < Guided Democracy >
  INS_guided_democracy: "Nyatakan Darurat Militer"
  INS_guided_democracy_desc: "Kini jelas bahwa pembagian kekuasaan melalui pembentukan Komite Nasional adalah sebuah kesalahan dan hanya membuahkan ketidakstabilan. Kita tidak boleh membiarkan hal ini berlanjut kecuali kita menginginkan perang saudara lagi. Kita harus memberlakukan darurat militer dan untuk sementara mengambil alih kendali komite sampai ketertiban dipulihkan."
  INS_centralization: "Sentralisasi"
  INS_centralization_desc: "Kekuasaan akan dipusatkan di Jawa dengan pulau-pulau lain memiliki otonomi terbatas. Semua keputusan harus melalui Jawa untuk menjamin ketertiban dan stabilitas. Presiden akan mengawasi jalannya demokrasi."
  INS_abolish_national_committee: "Bubarkan Komite Nasional"
  INS_abolish_national_committee_desc: "Komite Nasional akan dibubarkan dan digantikan oleh Badan Pekerja yang mengabdi di bawah kepresidenan. Presiden akan menjabat seumur hidup untuk menjaga ketertiban. Badan Pekerja akan diberikan wewenang secara bertahap ketimbang sekaligus."
  INS_abolish_national_committee_tt: "Dukungan untuk §Y[ROOT.GetNeutralParty]§! akan ditetapkan menjadi §Y100%§!."
  INS_pancasila_achieved: "Pancasila Terwujud"
  INS_pancasila_achieved_desc: "Ketika kita mendirikan negara ini, ia didasarkan pada lima asas Pancasila: Ketuhanan Yang Maha Esa, Kemanusiaan yang adil dan beradab, Persatuan Indonesia, Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan, dan Keadilan sosial bagi seluruh rakyat Indonesia. Meskipun kita belum selalu berhasil beroperasi penuh di bawah prinsip-prinsip ini, kita akhirnya mencapai persatuan yang dicita-citakan oleh asas-asas mula tersebut, dan secara resmi dapat memulai babak berikutnya bagi kemakmuran berkelanjutan Republik kita."
  INS_the_co_prosperity_sphere: "Lingkungan Kemakmuran Bersama"
  INS_the_co_prosperity_sphere_tt: "Membuka keputusan §Y$INS_request_membership$§! dan keputusan §Y$INS_assume_complete_power$§! untuk mengubah ideologi negara dan §Y$INS_sukarno$ menjadi Fasis§!."
  INS_the_co_prosperity_sphere_desc: "Kendati ada banyak penentangan terhadap kerja sama dengan pihak Jepang, demi kepentingan terbaik kita di masa-masa penuh gejolak ini adalah bergabung dengan kekuatan yang lebih besar agar mampu teguh melawan Sekutu barat."
  INS_strengthen_ins_jap_trade: "Perkuat Perdagangan [ROOT.GetAdjective]-[JAP.GetAdjective]"
  INS_strengthen_ins_jap_trade_desc: "Kita harus meningkatkan hubungan dagang antara kita dan sekutu baru kita. Jika kita menjual kelebihan sumber daya kita dengan harga yang jauh lebih murah, kita dapat membuktikan keberhargaan kita dan memperoleh posisi tawar lebih tinggi setelah perang."
  INS_seek_recognition_of_mal_claims: "Tuntut Pengakuan atas Klaim Melayu Kita"
  INS_seek_recognition_of_mal_claims_desc: "Malaya dan Borneo Utara adalah serumpun dengan kita, hanya terpisahkan oleh batas kolonial yang semu. Kita harus mengupayakan agar [JAP.GetNameDef] mengakui hak kita atas wilayah ini dan menjanjikannya kepada kita begitu kita berhasil mengalahkan Britania."
  INS_demand_northern_malay: "Tuntut Melayu Utara"
  INS_demand_northern_malay_desc: "Melayu Utara saat ini dikuasai oleh Siam, meskipun secara etnis merupakan orang Melayu. Kita tidak akan mentolerir pihak yang mengaku \"sekutu\" menduduki wilayah kita, kita harus menuntut campur tangan dari Jepang."
  INS_siam_agreement: "Perjanjian Siam"
  INS_siam_agreement_desc: "Siam adalah bangsa yang lemah dan tidak mampu berdiri tegak sendiri. Kita telah membuktikan kemampuan kita kepada Jepang, sementara Siam terus tunduk pada tekanan. Tidak diragukan lagi kita semua akan lebih diuntungkan jika Siam menjadi boneka Indonesia."
  INS_local_autonomy: "Otonomi Daerah"
  INS_local_autonomy_industry_tt: "§Y1§! Pabrik Sipil §Rdihapus§! dari §Y[1051.GetName]§!, §Y[335.GetName]§! dan §Y[1058.GetName]§!.\n§Y1§! Pabrik Sipil §Gditambahkan§! ke §Y4 negara bagian yang dimiliki secara acak§!."
  INS_local_autonomy_desc: "Banyaknya pulau yang mencakup Indonesia memiliki beragam kebudayaan, bahasa, dan kebutuhan yang berbeda. Tidaklah masuk akal menganggap satu pemerintahan pusat dapat mengawasi semuanya dengan berhasil. Kita akan mulai mereformasi Indonesia menjadi Federasi, di mana setiap provinsi memiliki tingkat otonomi yang signifikan atas dirinya sendiri."
  INS_union_of_ins_states: "Persatuan Provinsi [ROOT.GetAdjective]"
  INS_union_of_ins_states_desc: "Kita harus memberikan otonomi yang lebih besar kepada provinsi, dengan mengurangi peran pemerintah federal hanya pada urusan antarprovinsi dan urusan luar negeri. Kami akan memilih Presiden federal yang baru berdasarkan keinginan provinsi. Penguasa lokal akan bebas membentuk struktur kepemimpinan mereka sendiri sesuai pilihan mereka."
  INS_union_of_ins_states_tt: "Rilis §Y[ATJ.GetName]§!, §Y[BLI.Getname]§!, §Y[SSI.GetName]§!, §Y[TNE.GetName]§!, §Y[POK.GetName]§! dan §Y[GOW.GetName]§! sebagai §Y$autonomy_taog_indonesian_union_state$s§!."
  INS_indonesian_inter_province_trade_agreement: "Perjanjian Dagang Antarprovinsi [ROOT.GetAdjective]"
  INS_indonesian_inter_province_trade_agreement_tt: "Semua negara §YIndonesia§! memperoleh:"
  INS_indonesian_inter_province_trade_agreement_desc: "Perdagangan antarprovinsi harus cepat dan murah. Kita akan memastikan bahwa membeli dan menjual ke provinsi lain hampir selalu lebih menguntungkan ketimbang ke negara lain, melalui pemotongan pajak perdagangan secara drastis dan pembangunan infrastruktur baru antarwilayah."
  INS_expanding_the_union: "Memperluas Persatuan"
  INS_expanding_the_union_desc: "Rakyat di Borneo Utara telah hidup di bawah tirani terlalu lama. Kita akan memanfaatkan perang gerilya demi memaksa Britania mundur, memungkinkan Brunei, Sabah, dan Kerajaan Sarawak menjadi provinsi-provinsi Indonesia."
  INS_expanding_the_union_tt: "Membuka keputusan untuk memulai §YPerang Terbatas§! bagi setiap wilayah bagian yang belum kita kuasai di §YBorneo§!."
  INS_dismantle_indonesia: "Bubarkan [ROOT.GetName]"
  INS_dismantle_indonesia_tt: "§YBubarkan federasi§! dan pilih wilayah bagian mana yang menjadi pusat pemerintahan Anda. Provinsi-provinsi selebihnya akan dimerdekakan."
  INS_dismantle_indonesia_desc: "Kita telah mencoba banyak jenis pemerintahan dan semuanya berakhir dengan ketidakstabilan. Revolusi telah berakhir, dan penjajah Belanda telah dikalahkan, kita tidak lagi dituntut untuk bersatu dalam satu front persatuan. Kami akan membubarkan federasi tersebut, memberikan kebebasan kepada sultan setempat untuk mendirikan negara merdeka mereka sendiri."
  INS_all_toward_the_war_effort: "Semua untuk Usaha Perang"
  INS_all_toward_the_war_effort_desc: "Front Melayu dan [AST.GetAdjective] yang kami pimpin akan menentukan hasil persatuan Melayu di tahun-tahun mendatang. Kita tidak bisa menyia-nyiakan sumber daya apa pun, semuanya harus diberikan kepada para prajurit pemberani yang memperjuangkan kebebasan Melayu."
  INS_enact_militarism: "Terapkan Militerisme"
  INS_enact_militarism_desc: "Kita harus memetik sejumlah pelajaran dari [JAP.GetNameDefCap] dan kebijakan militeristiknya. Mengadopsi prinsip-prinsip serupa akan membawa manfaat besar bagi pemerintahan baru kita."
  INS_sukarnos_industrialization: "Perkuat Industri Jawa"
  INS_sukarnos_industrialization_desc: "Industri di Jawa adalah tulang punggung perekonomian dan militer kita. Semua jalan harus menuju ke Roma."
  INS_sukarnos_industrialization2: "Setiap Orang Harus Mengambil Peran"
  INS_sukarnos_industrialization2_desc: "Upaya perang adalah prioritas nomor satu bangsa ini, dan oleh karenanya menjadi kewajiban utama setiap insan Indonesia untuk berkorban. Kemewahan adalah musuh, kompleks industri militer harus terus berkembang."
  INS_japanese_military_lessons: "Pelajaran Militer Jepang"
  INS_japanese_military_lessons_desc: "Kita harus mempelajari doktrin militer Jepang dan menyesuaikan tentara kita seturut dengannya."
  # < Support Tan Malaka's Coup>
  INS_support_tan_malakas_coup: "Dukung Kudeta Tan Malaka"
  INS_support_tan_malakas_coup_desc: "Sukarno memproklamasikan kemerdekaan kita, tetapi ia terbukti sebagai sosok yang ragu-ragu dan gemar berkompromi diplomatik. Tan Malaka dan Persatuan Perjuangannya menuntut apa yang dituntut oleh rakyat: Merdeka Seratus Persen, tanpa perundingan, tanpa kompromi! Jika Sukarno enggan berjuang demi revolusi secara utuh, maka revolusi harus mencari pemimpin yang berani melakukannya."
  INS_minimum_program: "Program Minimum"
  INS_minimum_program_desc: "Persatuan Perjuangan telah menyampaikan tuntutannya: pemerintahan rakyat, tentara rakyat, dan nasionalisasi semua perkebunan dan industri milik asing. Kita membutuhkan orang-orang yang cakap untuk melaksanakan program ini. Njono mewakili buruh, Setyadjit mewakili intelektual partai. Bersama-sama mereka akan melihat bahwa revolusi diorganisir dari lantai pabrik hingga balai pemerintahan."
  INS_agrarian_reform: "Reforma Agraria"
  INS_agrarian_reform_desc: "Selama tiga abad tanah Indonesia telah memperkaya perkebunan-perkebunan milik kaum asing. Kaum tani yang menggarapnya hampir tak pernah mengecap hasil jerih payahnya sendiri. Revolusi yang membiarkan ketidakadilan ini berlanjut bukanlah revolusi sama sekali. Kita akan memastikan tanah jatuh ke tangan mereka yang menggarapnya."
  INS_soviet_aid: "Bantuan Soviet"
  INS_soviet_aid_desc: "Uni Soviet telah mengakui revolusi kita dan siap memberikan pasokan. Apa pun perbedaan pandangan antara program kita dengan Moskow, kita tidak boleh menolak bantuan yang ditawarkan. Kita harus menerima persenjataan tersebut dan terus maju melangkah."
  INS_pacific_revolution: "Revolusi Pasifik"
  INS_pacific_revolution_desc: "Kekuatan kolonial belum sepenuhnya mundur dari Asia, mereka hanya hengkang dari Indonesia. Tatanan lama masih bercokol di wilayah seperti Malaya dan Filipina, dan di setiap tempat itu ada rakyat yang mendambakan pembebasan. Revolusi kita telah memberikan martabat sekaligus kewajiban moral untuk membantu mereka. Kita harus melakukannya."
  INS_purge_oppurtunists_tt: "Membuka §Y$INS_launch_revolution$§! di negara-negara dengan dukungan komunis §Y60%§! atau lebih. Negara tempat kita menyulut revolusi akan menjadi §Ynegara boneka§! kita."
  INS_purge_oppurtunists: "Pembersihan Kaum Oportunis"
  INS_purge_oppurtunists_desc: "Musso menghabiskan dua puluh tahun di Moskow belajar menerima perintah. Ia kembali dengan instruksi Soviet di sakunya dan sebuah rencana untuk mengubah republik kita menjadi boneka Komintern. Kita tidak menggulingkan kekuasaan Belanda hanya untuk bersujud di hadapan tuan asing lainnya. Kaum oportunis yang hendak menjual revolusi kita ke Moskow harus diberantas hingga ke akar-akarnya, dan bangsa-bangsa yang kita bebaskan harus berkiblat ke Jakarta, bukan ke Kremlin."
  INS_the_maphilindo_speech: "Pidato Maphilindo"
  INS_the_maphilindo_speech_desc: "Jika orang Betawi dan Banjar sama-sama menjadi orang Indonesia kendati berbeda kebudayaan berkat perjuangan bersama melawan tirani, maka tidak ada alasan orang Melayu dan Filipina tidak bisa bersatu bersama kita. Kita harus menyatukan tanah-tanah ini menjadi satu negara kesatuan yang megah!"
  INS_the_maphilindo_speech_tt: "Mengizinkan pengklaiman inti (core) dan aneksasi subjek §YMelayu§!"
  INS_pan_asian_union: "Uni Pan-Asia"
  INS_pan_asian_union_desc: "Revolusi Pasifik baru saja dimulai, dan posisi kita belum aman. Kita harus berdiri bersama dan bekerja sama untuk melindungi satu sama lain dari kekuatan-kekuatan besar dunia. Bersatu kita teguh."
  INS_federation_of_aslia: "Federasi Aslia"
  INS_federation_of_aslia_trigger_tt: "Telah menyelesaikan keputusan §Y$form_maphilindo$§!."
  INS_federation_of_aslia_desc: "Bangsa-bangsa yang telah kita bebaskan tidak perlu berdiri sendiri. Tan Malaka selalu membayangkan sesuatu yang lebih agung daripada satu republik semata: sebuah federasi dari daratan Asia hingga Pasifik, bersatu melawan kekuatan kolonial mana pun yang berani kembali. Kita akan menawarkan mereka keanggotaan penuh di negara kita."
  INS_aslia_tt: "Mengizinkan pengklaiman inti (core) dan aneksasi subjek §YPasifik§!"
  INS_pan_economic_area: "Kawasan Ekonomi Pan-Asia"
  INS_pan_economic_area_desc: "Kerja sama ekonomi di dalam uni sangat penting demi kemakmuran bersama kita. Kita harus memfasilitasi perdagangan bebas bea antar semua negara anggota guna mengurangi ketergantungan kita pada bangsa-bangsa luar."
  INS_pan_economic_area_tt: "Semua anggota faksi yang merupakan subjek dari §Y[ROOT.GetNameDef]§!"
  INS_musso_ascends: "Kebangkitan Musso"
  INS_musso_ascends_tt: "Membuka §Y$INS_launch_revolution$§! di negara-negara dengan dukungan komunis §Y30%§! atau lebih. Negara tempat kita menyulut revolusi akan tetap merdeka."
  INS_musso_ascends_desc: "Tan Malaka hanyalah seorang pemimpi. Musso membawa apa yang tidak dapat diberikan oleh pemimpi: dukungan penuh dari Uni Soviet dan solidaritas gerakan komunis internasional. Revolusi kita tidak perlu berdiri sendirian."
  INS_utilize_comintern_connections: "Manfaatkan Koneksi Komintern"
  INS_utilize_comintern_connections_desc: "Koneksi Musso dengan pejabat tinggi kointern membuat proses bergabung dengan kointern menjadi mudah. Kita harus mengirimnya ke [SOV.GetNameDef] untuk bernegosiasi tanpa penundaan."
  INS_united_against_japan: "Bersatu Melawan [JAP.GetNameDef]"
  INS_united_against_japan_desc: "Meskipun tidak ada yang senang berpihak pada Sekutu dan luka batin yang ditinggalkan oleh Belanda belum terlupakan, kita harus untuk sementara waktu mengesampingkan perbedaan demi melawan musuh bersama kita, jika tidak kita berisiko melihat penjajah lain menduduki [ROOT.GetName]."
  INS_revolutionary_economic_cooperation: "Kerja Sama Ekonomi Revolusioner"
  INS_revolutionary_economic_cooperation_desc: "Kita telah menyelamatkan jutaan nyawa yang tak lagi hidup di bawah tirani. Sekarang, kita harus membangun bersama. Melalui kerja sama dan perdagangan, kita dapat menempa perekonomian dan bala tentara yang tangguh, melindungi kita dari ancaman kekuatan asing di tahun-tahun mendatang."
  INS_revolutionary_economic_cooperation_tt: "Keuntungan §Y$INS_revolutionary_economic_cooperation_modifier$§! yang memberikan:\n§Y4%§! Stabilitas §Yper Negara§! yang kita miliki §Ymemulai revolusi di§!\n§Y4%§! Kecepatan Konstruksi §Yper Negara§! yang kita miliki §Ymemulai revolusi di§!\n§Y4%§! Perolehan Kekuatan Politik §Yper Negara§! yang kita miliki §Ymemulai revolusi di§!\n§Y-4%§! Barang Konsumsi §Yper Negara§! yang kita miliki §Ymemulai revolusi di§!\n\nSaat ini kita telah memulai revolusi di §Y[?INS_communist_revolts_succeeded]§! negara."
  INS_soviet_economic_integration: "Integrasi Ekonomi Soviet"
  INS_soviet_economic_integration_desc: "Revolusi telah memberi kita kemerdekaan, tetapi kemerdekaan semata tidak membangun pabrik atau memberi makan rakyat banyak. Uni Soviet menawarkan apa yang tidak sudi diberikan oleh kekuatan kapitalis mana pun: keahlian industri, kredit pembangunan, dan perdagangan dengan syarat yang tidak disertai ikatan kolonial. Kita bodoh jika menolaknya."
  INS_the_three_year_plan: "Rencana Tiga Tahun"
  INS_the_three_year_plan_desc: "Kita akan mencanangkan rencana tiga tahun bagi perekonomian kita, yang akan memandu kita dalam jangka panjang dan memangkas waktu birokrasi."
  INS_the_three_year_plan_tt: "§YSemangat Nasional§! akan meningkat sebesar §G1%§! setiap bulan hingga mencapai potensi maksimalnya di §Y26%§!."
  INS_realign_export_markets: "Menata Ulang Pasar Ekspor"
  INS_realign_export_markets_desc: "Kita harus memperkuat hubungan dagang global kita, mengurangi ketergantungan pada segelintir kekuatan besar. Sebaliknya, kita harus menjalin banyak transaksi perdagangan dengan negara-negara serta perusahaan-perusahaan yang lebih kecil."
  INS_divert_javanese_education_funding_the_east: "Alihkan Dana Pendidikan Jawa ke Timur"
  INS_divert_javanese_education_funding_the_east_desc: "Tidak dapat disangkal bahwa bekas penjajah kolonial hanya berinvestasi pada kemajuan Jawa dan wilayah Sumatra yang kaya sumber daya, sembari membiarkan wilayah koloni lainnya terbengkalai. Kita dapat memperbaiki ketidakadilan ini dengan mengalokasikan sebagian anggaran pendidikan Jawa untuk membangun sekolah-sekolah baru di kawasan timur."
  INS_eastern_universities: "Universitas Kawasan Timur"
  INS_eastern_universities_desc: "Dengan membangun universitas baru di wilayah timur, pendidikan tinggi akan tersedia bagi lebih banyak masyarakat, dan siswa akan didorong untuk pindah dari Jawa untuk bersekolah di sekolah yang jauh, sehingga mengurangi kesenjangan budaya antara Jawa dan wilayah [ROOT.GetName] lainnya."
  # <National Revolution - Reasserting Control>
  INSHOL_revolution_ongoing_tt: "Revolusi Indonesia Sedang Berlangsung"
  INSHOL_reasserting_control: "Tegakkan Kembali Kekuasaan atas Hindia"
  INSHOL_reasserting_control_desc: "Kita tidak boleh berpangku tangan menyaksikan kaum pemberontak berupaya meruntuhkan apa yang telah kita bangun berabad-abad, sembari merusak infrastruktur dan meradikalisasi pemuda. Kita harus mengambil tindakan keras!"
  INSHOL_request_british_support: "Minta Bantuan Inggris"
  INSHOL_request_british_support_desc: "[ENG.GetNameDefCap], sebagai sesama imperium kolonial, tentu memahami kegentingan situasi kita, terlebih jika kaum revolusioner berhasil, hal itu dapat memicu efek domino di seantero Asia Timur. Kita harus memohon bantuan ekonomi dan militer mereka."
  INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! akan secara resmi menyatakan keberpihakannya di sisi kita dalam konflik dan memberikan bantuan substansial. Jika perang berakhir dengan kemenangan, §Y[ENG.GetNameDefCap]§! berhak atas Borneo."
  INS_eng_treaty_engside_tt: "Kita akan secara resmi bersekutu dengan §Y[HOL.GetNameDefCap]§! dalam konflik Hindia Timur. Jika §Y[HOL.GetNameDefCap]§! menang, kita berhak atas kepemilikan Borneo."
  INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! akan secara resmi menyatakan keberpihakannya di sisi kita dalam konflik dan memberikan bantuan substansial. Jika perang berakhir dengan kemenangan, §Y[FRA.GetNameDefCap]§! berhak atas Sumatra timur laut."
  INS_fra_treaty_fraside_tt: "Kita akan secara resmi bersekutu dengan §Y[HOL.GetNameDefCap]§! dalam konflik Hindia Timur. Jika §Y[HOL.GetNameDefCap]§! menang, kita berhak atas kepemilikan Sumatra timur laut."
  INSHOL_franco_dutch_accord: "Kesepakatan Prancis-Belanda"
  INSHOL_franco_dutch_accord_desc: "Meskipun serdadu kita terlatih dan berperalatan lebih baik daripada milisi Republik, jumlah mereka yang luar biasa masif telah membalikkan keadaan. Untuk mengamankan kemenangan, kita butuh sokongan luar negeri. Prancis mungkin bersedia turun tangan jika kita menawarkan konsesi wilayah di Hindia untuk memperluas pengaruh mereka di Pasifik."
  INSHOL_london_batavia_accord: "Kesepakatan London-Batavia"
  INSHOL_london_batavia_accord_desc: "Kendati persenjataan kita lebih unggul dari milisi Republik, keunggulan jumlah mereka mulai menyudutkan kita. [ENG.GetNameDefCap] memiliki kepentingan langsung mengingat posisi mereka di Malaya. Mereka dapat dibujuk jika kita bersedia memberikan imbalan teritorial."
  INSHOL_australian_divisions: "Kirim Infanteri Australia ke Jawa"
  INSHOL_australian_divisions_desc: "Berdasarkan Kesepakatan London-Batavia, Britania berkewajiban mengirimkan divisi tambahan ke Hindia melalui Australia begitu kita memintanya, mengingat letak Australia yang sangat dekat menjadikannya pangkalan aju yang ideal."
  INSHOL_indian_divisions: "Divisi Angkatan Darat India Britania"
  INSHOL_indian_divisions_desc: "Meskipun Britania enggan mengirimkan pemudanya sendiri ke Hindia, membujuk mereka mengerahkan divisi-divisi serdadu India jauh lebih mudah, terlebih letak geografisnya yang dekat dengan Batavia."
  INSHOL_undermine_the_militias: "Runtuhkan Moril Milisi"
  INSHOL_undermine_the_militias_desc: "Surat kabar melebih-lebihkan kegentingan masalah ini; laskar milisi itu hanyalah sekelompok pemuda nekat yang mengejar angan-angan kosong. Kita tidak perlu menguras seluruh sumber daya kita; pertahankan garis pertahanan dan biarkan mereka kelelahan sendiri."
  INSHOL_flag_will_fly_again: "Sang Triwarna Akan Berkibar Kembali"
  INSHOL_flag_will_fly_again_desc: "Bendera Belanda telah berkibar di Hindia selama berabad-abad, tiada sejengkal ruang pun di mana kita sudi melihatnya diturunkan. Jika mempertahankan koloni permata mahkota kita membutuhkan pengerahan tank dan pesawat pengebom, maka armada itu akan kita terjunkan!"
  INSHOL_flag_will_fly_again_tt: "§YBegitu revolusi usai, spirit nasional ini akan dicabut dan aturan awal akan dipulihkan.§!"
  # <National Revolution - Escalation>
  INSHOL_mass_mobilization: "Mobilisasi Massa"
  INSHOL_mass_mobilization_desc: "Kita tidak dapat memenangkan pertempuran ini dan menumpas Republik tanpa tentara yang bersenjata lengkap. Kita harus mempersenjatai kembali Hindia dan mengalirkan dana dari pos-pos sipil ke kas KNIL."
  INSHOL_batavia_storm_operation: "Serbu Batavia"
  INSHOL_instigate_infighting: "Sulut Perpecahan di Tubuh Republik"
  INSHOL_ultimatum_to_republic: "Ultimatum kepada Republik"
  INSHOL_comite_rijkseenheid: "Komite Rijkseenheid"
  INSHOL_comite_rijkseenheid_desc: "Bendera kita tengah diturunkan di Hindia, namun masyarakat di tanah air seakan hanya menonton. Kita tidak boleh membiarkan ini; kita harus meyakinkan Administrasi Hindia bahwa rakyat Belanda menuntut agar pemberontakan ini segera dipadamkan!"
  INSHOL_increase_esclation_placeholder: "Eskalasi Cepat"
  INSHOL_increase_esclation_placeholder_desc: "Laskar milisi kita telah merebut banyak pelabuhan penting, kota besar, dan sentra industri. Kita tidak akan terus menunggu Belanda bertindak; kita sendiri yang akan melancarkan ofensif militer besar-besaran!"
  INS_take_batavia_explination_tt: "Jika kita berhasil menduduki seluruh Jawa, kita akan menghancurkan pemerintah kolonial dari dalam dan §Gmemenangkan perang§!. Namun, jika kita tidak berhasil melakukannya dalam waktu §Y730 hari§!, kita akan §Rhancur§!."
  INSHOL_linggadjati_agreement: "Perundingan Gencatan Senjata"
  INSHOL_linggadjati_agreement_desc: "Menyerbu Jawa terbukti sangat sulit, dan pemerintahan kita makin goyah. Kita harus mundur dan bermain defensif agar tidak mempertaruhkan runtuhnya seluruh Republik. Kita harus merundingkan gencatan senjata lokal dengan Belanda, memberi ruang untuk menata kembali kekuatan sebelum mengarahkan fokus kembali ke Jawa."
  INSHOL_increase_esclation_placeholder_tt: "Membuka §YKeputusan§! untuk merundingkan gencatan senjata lokal dan §Ymenambah waktu batas§! untuk merebut Jawa."
  # <National Revolution - Peace Negotiation>
  INSHOL_seek_foreign_help: "Cari Bantuan Luar Negeri"
  INSHOL_seek_foreign_help_desc: "Bukan rahasia lagi bahwa memenangkan perang melawan kekuatan kolonial industri berat sebagai negara muda tanpa stabilitas ekonomi adalah perjuangan yang nyaris mustahil. Kita harus menjalin kontak dengan bangsa-bangsa sahabat yang mendukung perjuangan kemerdekaan kita untuk mencari bantuan."
  INSHOL_renville_agreement: "Perjanjian Renville"
  INSHOL_renville_agreement_desc: "Agresi militer Belanda yang sewenang-wenang telah menarik perhatian dunia internasional ke medan revolusi, kendati Belanda terus melanggar gencatan senjata dan memprovokasi kita. Kita harus mengajukan banding diplomatik kepada [USA.GetNameDef], karena jika kita mampu meyakinkan mereka membela Indonesia, Belanda tak akan punya pilihan selain mundur."
  INSHOL_no_compromise: "Tanpa Kompromi, Tanpa Menyerah"
  INSHOL_no_compromise_desc: "Keserakahan Belanda yang membuat mereka berinvestasi hampir secara eksklusif di Jawa dan menelantarkan pulau-pulau timur telah menjadikan Jawa tumit rapuh bagi seluruh koloni. Ini akan menjadi palu godam kehancuran mereka!"
  INSHOL_end_to_bloodshed: "Solusi Dua Negara"
  INSHOL_end_to_bloodshed_desc: "Konflik ini telah berlangsung terlalu lama, dengan sedikit kemajuan di kedua arah, hanya saja semakin banyak nyawa yang hilang setiap harinya. Tidak ada yang ingin hal ini terus berlanjut, sekarang saatnya kita berdiskusi dengan para pemimpin Belanda di meja perundingan."
  INSHOL_reorganize_colonies: "Reorganisasi Koloni"
  INS_we_will_need_another_tt: "Karena kita telah menguasai seluruh Jawa, kita perlu menguasai satu wilayah bagian tambahan di luar Jawa."
  # Industry Branch - New
  INS_centralize_the_state: "Sentralisasi Negara"
  INS_centralize_the_state_desc: "Dari Sumatra hingga Sulawesi, dari Borneo hingga Bangka, program pembangunan kita telah menghadirkan jalan raya, pabrik, dan pranata pemerintahan ke wilayah-wilayah yang dahulunya hanya dikelola di atas kertas oleh [1058.GetName]. Wilayah-wilayah ini bukan lagi provinsi pedalaman yang terpencil. Mereka adalah [INS.GetNameDefCap]."
  INS_centralize_the_state_1_tt: "Wilayah bagian prasyarat yang berstatus §Ywilayah inti (core)§!:"
  INS_centralize_the_state_2_tt: "Wilayah bagian prasyarat yang berstatus §Ybukan wilayah inti§!:"
  INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
  INS_fate_of_de_javasche_bank_scripted_name_colony: "Nasib De Javasche Bank"
  INS_fate_of_de_javasche_bank_scripted_name_independent: "Nasib Bank Indonesia"
  INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
  INS_fate_of_de_javasche_bank_scripted_desc_colony: "Gulden Hindia Timur telah terjun bebas sejak depresi melanda, dan De Javasche Bank tidak mempunyai alat untuk menahan penurunan tersebut. Kita harus memutuskan bagaimana menstabilkan mata uang kita sebelum kepercayaan investor yang tersisa hilang seluruhnya."
  INS_fate_of_de_javasche_bank_scripted_desc_independent: "Kita mewarisi mata uang yang dilanda krisis. Gulden kolonial lama sudah goyah, dan peralihan ke Rupiah belum mampu menenangkan pasar. Bank Indonesia memerlukan arah kebijakan yang jelas dari pemerintah, atau ekonomi muda kita akan menanggung akibatnya."
  INS_finish_the_bauxite_project: "Tuntaskan Proyek Bangka"
  INS_finish_the_bauxite_project_desc: "Dengan beroperasinya jalan, pelabuhan, dan rel kereta api baru di seluruh Bangka-Belitung, tim survei melaporkan adanya endapan wolfram dan kromium yang melebihi perkiraan awal kita. Pulau-pulau ini akan membuktikan nilai tak ternilainya bagi republik."
  INS_australian_contracts: "Kontrak Australia"
  INS_australian_contracts_desc: "Cadangan karet kita telah tumbuh melampaui kebutuhan domestik. Australia, yang haus akan bahan mentah demi menghidupi industrinya sendiri, merupakan mitra dagang yang sangat alami. Mengamankan kontrak jangka panjang dengan perusahaan-perusahaan Australia akan mendatangkan pendapatan stabil dan memperkokoh posisi kita dalam ekonomi kawasan."
  INS_coopereate_with_chinese_businessmen: "Kerja Sama dengan Pedagang Tionghoa"
  INS_coopereate_with_chinese_businessmen_desc: "Kalangan saudagar kaya dan memiliki jaringan luas telah lama memfasilitasi perdagangan di seantero nusantara. Daripada menyingkirkan jaringan yang telah mapan ini, kita harus merangkul mereka. Modal dan keahlian niaga mereka dapat menjadi sangat berharga untuk menarik perekonomian kita keluar dari keterpurukan."
  INS_oil_decisions_unlock_tt: "Membuka keputusan §Y$INS_realign_supply_chains_cat$§! baru untuk menjual §YMinyak§!."
  INS_negotiate_new_contracts_unlock_tt: "Membuka keputusan §Y$INS_realign_supply_chains_cat$§! baru."
  INS_realign_supply_chains_explain_tt: "Membuka Keputusan §Y$INS_realign_supply_chains_cat$§! untuk menjual sumber daya ke perusahaan swasta dengan kontrak sewa 2 tahun."
  INS_negotiate_new_contracts: "Rundingkan Kontrak Baru"
  INS_negotiate_new_contracts_desc: "Reputasi kami yang semakin meningkat sebagai pemasok yang dapat diandalkan telah membuka pintu yang sebelumnya tertutup bagi kami. Pembeli-pembeli baru terus bermunculan, dan kita harus bergerak cepat untuk mengikat mereka dalam perjanjian jangka panjang sebelum pesaing kita dapat melemahkan kita."
  INS_all_in_on_rubber: "Fokus Penuh pada Karet"
  INS_all_in_on_rubber_desc: "Karet adalah komoditas andalan terkuat kita, dan kita berniat memanfaatkannya semaksimal mungkin. Setiap jengkal lahan perkebunan yang tersedia akan dialihkan untuk budidaya karet, dan aparatur ekspor kita ditata ulang untuk memasarkannya lebih cepat dan lebih murah dibanding siapa pun di kawasan ini."
  INS_more_market_resources: "Mengatasi Dampak Depresi Besar"
  INS_more_market_resources_desc: "Dunia mungkin sedang terperosok dalam krisis ekonomi, namun krisis melahirkan peluang bagi mereka yang cukup berani memanfaatkannya. Dengan membanjiri pasar komoditas kita pada harga yang tak tertandingi pesaing, kita memastikan bahwa ketika dunia pulih kembali, produk-produk Indonesia telah memadati setiap etalase dan gudang penyimpanan."
  # <Industry Branch - Trade Policy>
  INS_recovering_from_the_great_depression: "Pemulihan dari Depresi Besar"
  INS_recovering_from_the_great_depression_desc: "Depresi Besar telah membawa dampak yang memporak-porandakan bagi [INS.GetNameDef]. Dengan perekonomian kita yang bertumpu pada ekspor, proteksionisme global telah melumpuhkan kita. Saat perdagangan dunia mulai pulih dan terbuka kembali, kita harus giat mencari pasar-pasar baru serta membangun kembali jalur dagang lama kita."
  INS_first_come_first_serve: "Siapa Cepat, Dia Dapat"
  INS_first_come_first_serve_desc: "Kendati proteksionisme Depresi Besar mulai mereda, lonjakan produksi dan nilai gulden yang terlampau tinggi telah menghancurkan pasar ekspor Belanda, karena mitra dagang lama kita di barat beralih ke Amerika Selatan untuk memenuhi pasokan mereka. Daripada bersusah payah mengejar mereka demi perjanjian baru, kita dapat memanfaatkan ini sebagai peluang memperluas pengaruh ke pasar-pasar baru di Asia."
  INS_oil_export: "Peningkatan Ekspor Minyak"
  INS_oil_export_desc: "Kita akan meningkatkan infrastruktur minyak di Sumatra dan Kalimantan demi mengamankan kesepakatan dagang dengan mitra-mitra baru kita."
  INS_increased_trade_with_japan: "Peningkatan Perdagangan dengan Jepang"
  INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] telah menjadi mitra dagang yang kian berharga dan tidak mengecewakan kita. Kita harus merundingkan perjanjian dagang baru untuk memperdalam kerja sama ekonomi antara kedua bangsa kita, serta membantu kita lepas dari bayang-bayang Depresi Besar. Hal ini mungkin membuat gusar sekutu-sekutu kita di Barat, terutama Belanda. Namun, jika kita ingin menentukan nasib kita sendiri, kita wajib mengamankan jalur perdagangan mandiri kita."
  INS_asian_trade_investments: "Investasi Perdagangan Asia"
  INS_asian_trade_investments_desc: "Kehancuran akibat Depresi Besar menyadarkan kita betapa kita terlampau bergantung pada mitra dagang barat jangka panjang kita. Dengan ekonomi yang bertumpu pada ekspor, kini sangat mendesak bagi kita untuk mengembangkan dan memperluas pasar-pasar baru di Asia Tenggara demi menjamin ekonomi kita tidak bergantung pada satu negara mana pun."
  INS_asian_trade_investments_tt: "Setiap §Y420§! hari, penalti sumber daya ke pasar dari §YDepresi Besar§! akan §GMembaik§! sebesar §Y5%§! hingga modifier negatif hilang sepenuhnya."
  INS_declare_free_trade: "Deklarasikan Perdagangan Bebas"
  INS_declare_free_trade_desc: "Kita tidak boleh berpihak secara eksklusif kepada satu negara mana pun; kita akan membiarkan mekanisme pasar menentukan secara alami pilihan terbaik bagi [INS.GetNameDef]."
  INS_japanese_export_contracts: "Satu Kontrak Dagang untuk Menguasai Semuanya"
  INS_japanese_export_contracts_desc: "Kita akan merundingkan perjanjian dagang besar dengan [JAP.GetNameDef], menjual seluruh karet di [1049.GetName] dan [672.GetName]. Meski kita menjualnya dengan harga sangat murah, kita dijamin semua hasil produksi akan terjual habis."
  INS_realign_supply_chains: "Menata Ulang Rantai Pasok"
  INS_realign_supply_chains_desc: "Meskipun proteksionisme Depresi Besar mulai mereda, peningkatan produksi dan nilai gulden yang terlampau tinggi telah memporak-porandakan pasar ekspor Belanda, saat mitra dagang lama kita di barat beralih ke Amerika Selatan untuk memenuhi kebutuhan mereka. Kita harus mengambil langkah-langkah meyakinkan sekutu kita agar mulai berdagang kembali dengan kita."
  INS_invite_foreign_companies: "Dukung Eksplorasi Minyak Amerika"
  INS_invite_foreign_companies_desc: "Sejak tahun 1930, Standard Oil California telah beroperasi di negara kita melalui anak perusahaan Belandanya, Nederlandsche Pacific Petroleum Maatschappij. Survei mereka di Riau menunjukkan potensi besar, kita harus mendukung operasi hulu mereka dengan segala cara — penemuan cadangan besar akan mendongkrak pendapatan kita sekaligus menarik perusahaan internasional lainnya untuk menanamkan modal di negeri kita."
  INS_expand_sea_routes: "Perluas Jalur Laut"
  INS_expand_sea_routes_desc: "Negara kita kaya akan sumber daya alam, namun industri ekstraksi kita terlampau terspesialisasi dan kita kekurangan infrastruktur yang memadai untuk menambang mineral langka tertentu seperti kromium dan wolfram. Jika kita ingin meningkatkan kemampuan produksi militer kita, kita perlu mengimpornya dari tempat lain. Untuk memanfaatkan sepenuhnya jaringan perdagangan kita yang berkembang, kita harus meningkatkan kapasitas armada kapal dagang kita."
  INS_ship_contracts: "Amankan Kontrak Perkapalan"
  INS_ship_contracts_desc: "Pembangunan angkatan laut sangat penting guna mengamankan jalur-jalur perdagangan kita jika perang pecah. Kita dapat memanfaatkan hubungan dagang baru kita untuk memperoleh kontrak perkapalan angkatan laut."
  # <Industry Branch - Sumatra>
  INS_developing_sumatra: "Pembangunan Sumatra"
  INS_developing_sumatra_desc: "Sumatra adalah pulau yang paling kaya akan sumber daya alam di kepulauan ini, namun infrastrukturnya begitu tertinggal sehingga sebagian besar sumber daya yang ditambang bahkan tidak pernah sampai ke Batavia. Transportasi hanya bertumpu pada jalan tanah yang rusak dan jalur rel yang terputus-putus, sama sekali tidak memadai untuk menopang rencana kita atas pulau ini. Kita tidak boleh membiarkan keadaan ini berlarut-larut."
  INS_sumatra_railway: "Jalur Kereta Api Sumatra"
  INS_sumatra_railway_desc: "Sebagai bagian dari upaya berkelanjutan kita dalam mengembangkan infrastruktur Sumatra, kita harus membangun jalur rel kereta api besar yang membentang dari Aceh utara hingga pelabuhan paling selatan di Sumatra, yang terhubung ke Batavia lewat kapal dengan sangat cepat. Dengan cara ini, sumber daya alam hanya perlu diangkut ke stasiun kereta terdekat, lalu dapat kita bawa ke Batavia dalam hitungan hari."
  INS_develop_borneo: "Pembangunan Kalimantan"
  INS_develop_borneo_desc: "Kalimantan menyimpan potensi kemakmuran yang luar biasa, namun pulau ini sangat minim pembangunan dan rakyatnya didera kemiskinan. Pengangkutan barang sangat bergantung pada sungai dan jalur air, sedangkan komunikasi jarak jauh terhambat oleh tiadanya aliran listrik. Dengan membangun jaringan listrik dan jalan darat, kita membuka jalan bagi kegiatan survei dan ekstraksi sumber daya alam di masa depan."
  INS_kalimantan_mic: "Industri Militer Kalimantan"
  INS_kalimantan_mic_desc: "Upaya pembangunan infrastruktur kita di Kalimantan telah membuahkan hasil. Meluasnya jaringan listrik dan komunikasi telah menghubungkan kita dengan komunitas-komunitas yang dulunya berada di luar jangkauan pemerintah. Kita dapat memanfaatkan kesempatan ini untuk memenuhi kebutuhan peningkatan produksi militer, dengan mendirikan pabrik-pabrik baru di kawasan tersebut dan memberdayakan tenaga kerja setempat."
  INS_pontianak_to_balikpapan: "Dari Pontianak ke Tanjung Selor"
  INS_pontianak_to_balikpapan_desc: "Gagasan membangun rel kereta api di Kalimantan telah dibahas mendalam, namun medan liar yang berat dan belum terjamah di pedalaman pulau menjadikannya tugas yang sangat sukar. Satu-satunya jalan keluar adalah membangun jalur kereta tapal kuda berbentuk U dari pantai ke pantai. Ini tidak akan murah, tetapi dalam jangka panjang hasilnya akan terbayar lunas."
  INS_develop_sulawesi: "Pembangunan Sulawesi"
  INS_develop_sulawesi_desc: "Sulawesi berada di jantung kepulauan ini, sehingga menjadi lokasi yang sangat bernilai strategis. Kita harus membangun jalan raya, jaringan listrik, dan sarana komunikasi demi memastikannya dapat difungsikan sebagai pusat komando militer bila perang meletus."
  # <Industry Branch - Bangka Project>
  INS_the_bangka_project: "Proyek Bangka"
  INS_the_bangka_project_desc: "Kepulauan Bangka-Belitung, kendati berukuran kecil, merupakan tiang penopang perekonomian Indonesia berkat kandungan bauksitnya yang melimpah. Kita perlu membangun jalan, pelabuhan, dan rel kereta api di Bangka-Belitung demi memastikan kita dapat memetik hasil maksimal dari kekayaan tambang kepulauan tersebut."
  INS_aluminium_factory: "Pabrik Aluminium Pangkalpinang"
  INS_aluminium_factory_desc: "Penambangan bauksit mentah kita kian meningkat, namun ketiadaan fasilitas pengolahan aluminium domestik membatasi laba yang kita raih. Sebagai ibu kota kepulauan Bangka-Belitung, Pangkalpinang menjadi lokasi yang ideal untuk mendirikan pabrik-pabrik pengolahan kita sendiri. Langkah ini memungkinkan kita memangkas perantara dan memaksimalkan pendapatan kita."
  INS_bauxite_export: "Tingkatkan Ekspor Bauksit"
  INS_bauxite_export_desc: "Tuntasnya Proyek Bangka menghasilkan cadangan bauksit mentah yang melimpah ruah. Kendati menjual semuanya secara serentak bukan perkara gampang, kita dapat menawarkan harga yang jauh lebih murah dibanding pemasok mana pun di pasar dunia, guna memastikan setiap gramnya habis terbeli. Berkat jumlah volume raksasa yang kita jual, langkah ini tetap akan memberikan lonjakan laba yang sangat besar dibanding ekspor kita saat ini."
  INS_tin_mining: "Investasi Tambang Timah"
  INS_tin_mining_desc: "Sejarah penambangan timah di kepulauan Bangka-Belitung sudah ada jauh sebelum kedatangan bangsa Eropa di nusantara. Maka wajar bila industri timah di pulau-pulau ini sudah sangat mendesak untuk dimodernisasi. Meremajakan kapasitas produksi memang menelan biaya besar, dan industri timah kita yang ada akan berhenti beroperasi untuk sementara waktu selama pemugaran. Kendati demikian, potensi keuntungan jangka panjangnya amatlah menjanjikan."
  in_240_days_tt: "§YDalam 240 hari:§!"
  INS_tin_to_usa: "Jual Timah ke [USA.GetNameDef]"
  INS_tin_to_usa_desc: "[USA.GetNameDefCap] dipenuhi oleh korporasi dan lembaga pemerintah yang membutuhkan pasokan timah. Kini setelah kita memiliki operasi penambangan yang mumpuni, kita berkesempatan meraih keuntungan besar di sana."
  INS_tin_to_japan: "Jual Timah ke [JAP.GetNameDef]"
  INS_tin_to_japan_desc: "[JAP.GetNameDefCap] memiliki banyak kapal perang yang kini dianggap usang dan dapat diganti, meski kapal-kapal tersebut sangat cocok bagi angkatan laut [INS.GetAdjective]. Kita harus membeli kapal-kapal ini menggunakan hasil pendapatan dari produksi timah kita."
  INS_tin_to_japan_tt: "[JAP.GetNameDefCap] akan mengirimkan §Y9§! kapal perusak tua kepada kita."
  INS_new_bauxite_routes: "Jalur Baru Bauksit"
  INS_new_bauxite_routes_desc: "Strategi kita memotong harga pasar demi mendongkrak volume ekspor bauksit terbukti sukses gemilang, dan kita telah melipatgandakan pendapatan kita secara substansial. Namun, kita tidak boleh berpuas diri sampai di sini. Kita harus terus memperluas jaringan perdagangan kita, mengoptimalkan rantai pasok, dan mencari setiap peluang lain demi memaksimalkan keuntungan."
  INS_bangka_bauxite_export_flag: "Telah menyelesaikan fokus §Y$INS_bauxite_export$§!:"
  INS_not_industry: "Rencana Masa Depan"
  INS_not_industry_desc: "Jawa adalah detak jantung bangsa kita, rumah bagi sebagian besar penduduk dan pusat pemerintahan kita. Sebelum kita dapat mengindustrialisasi pulau ini secara sungguh-sungguh, kita harus mempersiapkan landasannya terlebih dahulu. Survei lahan, penataan zonasi, dan pembersihan lahan akan memastikan bahwa ketika pabrik-pabrik dibangun, semuanya berdiri di tempat yang memberikan manfaat sebesar-besarnya."
  INS_construction_focus: "Ledakan Industri"
  INS_construction_focus_desc: "Modal asing mulai mengalir masuk, pendapatan ekspor kian melonjak, dan untuk pertama kalinya setelah bertahun-tahun tersedia dana nyata untuk berinvestasi pada industri dalam negeri. Kita harus memanfaatkan momen ini dan membangun selagi keadaan memihak kepada kita."
  # <Industry Branch - Java>
  INS_developing_java: "Perluas Infrastruktur Jawa"
  INS_developing_java_desc: "Jawa sejauh ini merupakan pulau yang paling maju industrinya di kepulauan ini, dan sumber utama sebagian besar kekayaan kita. Kendati demikian, kota-kota tertentu seperti Batavia menjadi semakin padat akibat pertumbuhan penduduk. Kita harus memperluas kota-kota ini dengan perumahan baru, kawasan komersial, trem, kereta api, dan pabrik-pabrik guna menopang pertambahan populasi."
  INS_prioritize_sugar_economy: "Prioritaskan Ekonomi Gula"
  INS_prioritize_sugar_economy_desc: "Kita sebaiknya mengurangi alokasi anggaran pemerintah bagi pengembangan industri di Batavia; kota ini sudah jauh lebih maju dibanding kota mana pun di nusantara. Sebaliknya, kita dapat mengalihkan dana ini untuk mendirikan kebun-kebun aren dan kelapa sawit rakyat di seantero negeri guna memproduksi gula kelapa dan komoditas dengan permintaan internasional yang tinggi."
  INS_all_cards_into_industry: "Fokus Penuh pada Industri"
  INS_all_cards_into_industry_desc: "Industrialisasi telah membawa dampak raksasa bagi perekonomian [1058.GetName]. Jika kita mengindustrialisasikan segenap penjuru pulau dengan puluhan juta penduduknya, kita dapat menjadi kekuatan yang sangat berpengaruh di panggung dunia."
  INS_expand_batavia_technical_institute: "Perluas Institut Teknologi Batavia"
  INS_expand_batavia_technical_institute_desc: "Memperluas Sekolah Tinggi Teknik Batavia (Technische Hoogeschool) akan memungkinkan lebih banyak pemuda terdidik dan mempercepat laju kemajuan teknologi kita."
  INS_quinine_export: "Perjanjian Kina yang Lebih Menguntungkan"
  INS_quinine_export_desc: "Kina Bureau di Amsterdam hampir memonopoli ekspor kinina dunia, yang sangat mendatangkan laba berlimpah mengingat tingginya kebutuhan obat malaria secara global. Biro tersebut memperoleh sebagian besar pasokan kinanya dari Hindia Timur. Meski demikian, kita hanya menerima sebagian kecil dari keuntungan itu. Kita harus memanfaatkan produksi kina kita sebagai daya tawar untuk merundingkan perjanjian yang lebih adil."
  INS_spend_profits_on_rural: "Gunakan Laba untuk Pembangunan Pedesaan"
  INS_spend_profits_on_rural_desc: "Dengan disepakatinya perjanjian baru mengenai kina, kita memiliki kesempatan emas untuk memanfaatkan pendapatan tambahan guna memajukan sarana transportasi dan komunikasi di wilayah pedesaan, membuka jalan bagi industrialisasi di masa mendatang."
  INS_spend_profits_on_urban: "Gunakan Laba untuk Pembangunan Perkotaan"
  INS_spend_profits_on_urban_desc: "Dengan disepakatinya perjanjian baru mengenai kina, kita memperoleh peluang untuk menggunakan pendapatan tambahan demi memperluas industri manufaktur Batavia, yang akan mendiversifikasi perekonomian kita dan mengurangi ketergantungan pada ekspor bahan mentah belaka."
  INS_spend_profits_on_military: "Gunakan Laba untuk Pembangunan Militer"
  INS_spend_profits_on_military_desc: "Dengan disepakatinya perjanjian baru mengenai kina, kita berkesempatan memperkuat angkatan bersenjata kita secara signifikan dengan mengalokasikan pendapatan tambahan untuk membangun dan memelihara pabrik-pabrik senjata baru di Yogyakarta dan Semarang."
  INS_end_to_bloodshed_tt: "Perang akan berakhir, dengan perbatasan baru yang ditarik berdasarkan pendudukan saat ini. Jawa, Sumatra, dan Borneo akan §Ydianeksasi§! oleh pihak yang saat ini menguasai wilayah tersebut terbanyak."
  HOL_british_light_support: "§Y[ENG.GetNameDefCap]§! telah setuju untuk membantu dalam revolusi"
