  AST_uap_50_discount: "§YPengaruh memiliki >50% Suara Demokrat§!:\n(§YU.A.P§! Kelompok fokus):\n§Y5§! hari Waktu Penyelesaian menurun.\n\nNaikkan Suara di atas §Y70%§! untuk menerima §Y10§! hari Penurunan Waktu Penyelesaian pada §YU.A.P§! Cluster fokus."
