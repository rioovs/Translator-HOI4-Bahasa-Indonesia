  idea_SIA_weather_broadcasts: "Siaran Cuaca"
  idea_SIA_weather_broadcasts_desc: "Siaran cuaca rutin memberikan gambaran kondisi yang lebih jelas kepada angkatan udara dan angkatan laut kita, meningkatkan efektivitasnya dan mengurangi risiko beroperasi dalam cuaca buruk."
  idea_SIA_seri_thai_contacts: "Kontak Seri Thailand"
  idea_SIA_seri_thai_contacts_desc: "Kontak dengan jaringan perlawanan Seri Thai membuktikan manfaatnya, mendatangkan pejuang berpengalaman dan memperkuat hubungan dengan Sekutu."
  idea_SIA_secure_rubber_islands: "Mengamankan Pulau Karet"
  idea_SIA_joint_military_command: "Komando Militer Gabungan"
