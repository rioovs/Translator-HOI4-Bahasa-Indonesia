  AST_australian_military_forces: "Angkatan Militer Australia"
  AST_australian_military_forces_desc: "Dilanda oleh api dalam Perang Besar, militer Australia membuktikan keberaniannya di wilayah yang jauh, berdiri teguh dalam beberapa kampanye paling brutal dalam konflik tersebut. Pada tahun-tahun berikutnya, jumlah tentara telah dikurangi dan dibentuk kembali menjadi kekuatan pertahanan, yang tugas utamanya adalah menjaga pulau-pulau asal. Pelajaran yang diperoleh dengan susah payah di masa lalu akan bertahan, siap untuk digunakan sekali lagi."
  AST_permanant_military_forces: "Pasukan Militer Permanen"
  AST_permanant_military_forces_desc: "Kekuatan militer utama Australia adalah milisi, yang bertugas mempertahankan daratan utama. Namun, di tengah meningkatnya ketegangan global saat ini, adalah bijaksana untuk membentuk kader perwira dan tentara profesional, yang banyak di antaranya memperoleh pengalaman selama Perang Besar. Sekalipun pada awalnya bertugas dalam kapasitas cadangan, pasukan ini akan memberikan permanensi dan tingkat pelatihan yang terstandarisasi."
  AST_invoke_the_1903_defence_act: "Gunakan Undang-Undang Pertahanan tahun 1903"
  AST_invoke_the_1903_defence_act_desc: "Secara tradisional, Australia mengandalkan milisinya untuk pertahanan nasional. Namun, pada saat terjadi ancaman besar, kita dapat menerapkan Undang-Undang Pertahanan tahun 1903. Hal ini memungkinkan kita untuk memanggil tenaga kerja tambahan untuk tujuan pertahanan."
  AST_lithgow_small_arms_factory: "Pabrik Senjata Kecil Lithgow"
  AST_lithgow_small_arms_factory_desc: "Didirikan pada tahun 1912, Pabrik Senjata Kecil Lithgow didirikan untuk mengurangi ketergantungan pada senjata dan peralatan buatan Inggris pada saat perang. Ketika ketegangan global kembali meningkat, kita harus memperluas produksi untuk memenuhi kebutuhan angkatan bersenjata kita yang terus meningkat."
  AST_dingo_scout_car: "Mobil Pramuka Dingo"
  AST_dingo_scout_car_desc: "Australia tidak memiliki tradisi yang kuat dalam pengembangan kendaraan lapis baja, namun angkatan bersenjata kita semakin menyerukan penguatan di bidang ini. Oleh karena itu, kita harus lebih ketat mengadopsi desain lokal seperti Dingo Scout Car."
  AST_volunteer_defence_corps_taog: "Korps Pertahanan Relawan"
  AST_volunteer_defence_corps_taog_desc: "Didirikan sebagai kekuatan yang mirip dengan British Home Guard, Korps Pertahanan Relawan adalah milisi warga negara tidak berbayar yang terdiri dari mereka yang tidak memenuhi syarat untuk dinas reguler. Terlepas dari keterbatasan ini, pengetahuan mereka tentang medan setempat membuat mereka cocok untuk melakukan perang gerilya jika terjadi keadaan terburuk."
  AST_war_carriers: "Pembawa Perang"
  AST_war_carriers_desc: "Logistik memenangkan perang, dan sebagian besar wilayah operasi Australia tidak cocok untuk transportasi konvensional seperti truk atau kereta api. Sebaliknya, kita harus mengandalkan tenaga kerja lokal, yang mampu beradaptasi dengan baik terhadap kondisi dan memahami jalan serta jalan pintas yang tersembunyi."
  AST_anzac_spirit: "Semangat ANZAC"
  AST_anzac_spirit_desc: "Korps Angkatan Darat Australia dan Selandia Baru memperoleh reputasi yang luar biasa selama Perang Besar, mengerahkan upaya besar dan banyak darah dalam mengejar kemenangan bagi Kekaisaran. Kualitas mereka terlihat jelas bagi semua orang: daya tahan, keberanian, kecerdikan, dan humor yang baik — dipadukan dengan sikap menantang saat menghadapi bahaya dan kesulitan."
  AST_lee_enfield_no1_mark3: "Lee-Enfield No.1 Mk III*"
  AST_lee_enfield_no1_mark3_desc: "Bintang kecil itu penting — Lee-Enfield No. 1 Mk III* menunjukkan modifikasi masa perang untuk produksi yang lebih cepat dan lebih murah. Ketika permintaan bahkan melebihi kenaikan ini, kita harus mengadopsi 'skema menjajakan', dengan komponen-komponen yang diproduksi oleh perusahaan-perusahaan kecil dan dirakit di Lithgow untuk meningkatkan output."
  AST_new_south_wales_government_railways: "Kereta Api Pemerintah New South Wales"
  AST_new_south_wales_government_railways_desc: "Bengkel Kereta Api Pemerintah New South Wales menyediakan kemampuan unik: komponen baja berukuran besar, dicetak dalam satu bagian. Sebagai salah satu dari sedikit negara Persemakmuran yang mampu memproduksi lambung dan menara tank sepenuhnya, kita harus memanfaatkan kapasitas ini dengan baik."
  AST_second_australian_imperial_force: "Angkatan Kekaisaran Australia Kedua"
  AST_second_australian_imperial_force_desc: "Australia mengerahkan Pasukan Kekaisaran Australia Pertama selama Perang Besar, mengirimkan pasukan ke luar negeri untuk berperang. Dengan perang yang sekali lagi mengancam akan melanda dunia, kita harus membentuk Pasukan Kekaisaran Kedua untuk menunjukkan kekuatan Australia di luar negeri."
  AST_expeditionary_leader: "§YUmum§! akan memiliki sifat §YPemimpin Ekspedisi§! yang meningkatkan kemampuan mereka di luar negeri, namun akan membatasi jumlah divisi yang dapat mereka pimpin."
  AST_expeditionary_leader_plural: "Kedua §YJenderal§! akan memiliki sifat §YPemimpin Ekspedisi§! yang meningkatkan kemampuan mereka di luar negeri, namun akan membatasi jumlah divisi yang dapat mereka pimpin."
  AST_larrikinism: "Larrikinisme"
  AST_larrikinism_desc: "Didefinisikan sebagai 'orang yang tidak terlatih, gaduh namun baik hati', larrikinisme telah menjadi bagian dari budaya Australia; ketahanan yang kuat, sikap tidak hormat terhadap otoritas, dan pembangkangan yang baik hati saat menghadapi bahaya. Tentara Australia mendapatkan reputasi dalam Perang Besar karena menghadapi kesulitan dengan ketangguhan dan menghadapi semuanya dengan tenang."
  AST_diggers: "Penggali"
  AST_diggers_desc: "\"Gali, gali, gali, sampai Anda aman\" adalah perintah yang disampaikan Jenderal William Birdwood ketika ANZAC mendarat di Gallipoli, kata-kata yang menjadi sinonim dengan cara perang Australia. Namun semangat Digger tertanam lebih dalam, mengikat tentara Australia dan Selandia Baru melalui ‘persahabatan’: ikatan abadi dalam berjuang bersama, dan untuk, rekan satu tim."
  AST_owen_gun: "Owen Gun"
  AST_owen_gun_desc: "Owen Gun yang inovatif dan dikembangkan sendiri telah mendapatkan reputasi atas keandalannya yang kokoh, sama seperti tentara kita. Saat pasukan kita berperang di seluruh dunia, kita harus menganggap senjata ini tidak hanya sebagai simbol kecerdikan dan rancangan Australia, namun juga sebagai semangat perang kita."
  AST_department_of_supply_and_development_taog: "Departemen Pasokan dan Pengembangan"
  AST_department_of_supply_and_development_taog_desc: "Ketika tuntutan perang mendorong sistem produksi dan logistik kita hingga mencapai batasnya, kita harus memusatkan upaya kita di bawah sebuah badan khusus yang bertanggung jawab untuk mengoordinasikan dan mempertahankannya."
  AST_sentinel_tank_development: "Pengembangan Tangki Sentinel"
  AST_sentinel_tank_development_desc: "Secara historis, kami mengandalkan desain tangki impor, bahkan ketika memproduksinya di dalam negeri. Kita harus memanfaatkan pelajaran yang didapat dari mesin-mesin ini dan, dengan inovasi Australia, mengembangkan tank kita sendiri, yang disesuaikan dengan kemampuan dan sumber daya kita."
  AST_establish_training_camps: "Mendirikan Kamp Pelatihan"
  AST_establish_training_camps_desc: "Seperti dalam Perang Besar, Pasukan Kekaisaran Kedua dapat dipanggil untuk berperang di mana pun di dunia. Oleh karena itu, kita harus mengembangkan program pelatihan komprehensif untuk mempersiapkan prajurit kita menghadapi lingkungan apa pun, mulai dari gurun di Afrika Utara hingga hutan di Pasifik Selatan."
  AST_jungle_tanks_if_sentinel_tank_development: "Jika kami telah menyelesaikan 'Pengembangan Tank Sentinel':"
  jungle_heavy_tanks: "Tank Berat Rimba"
  AST_anti_malaria_campaign: "Kampanye Anti Malaria"
  AST_anti_malaria_campaign_desc: "Pasukan kita mungkin dipanggil untuk berperang melintasi hutan di Pasifik, tempat ancaman yang lebih mematikan daripada peluru musuh yang menanti: malaria. Kita harus mengambil tindakan tegas untuk melindungi pasukan kita dari musuh yang tidak terlihat ini."
  AST_defence_citizen_military_forces_act: "Undang-Undang Pasukan Militer Warga Pertahanan"
  AST_defence_citizen_military_forces_act_desc: "Hingga saat ini, hanya tentara sukarelawan profesional yang dapat dikerahkan ke luar negeri. Ketika konflik terus meningkat, kita harus menetapkan kerangka hukum yang memungkinkan unit-unit milisi bertugas di luar negeri jika diperlukan."
  AST_call_that_a_knife: "Jangan Khawatir!"
  AST_call_that_a_knife_desc: "'Itu bukan pisau... INI pisau!' Sedikit keberanian dan humor akan sangat bermanfaat. Prajurit kita menghadapi bahaya dengan percaya diri, ketabahan, dan kesombongan."
  AST_army_inventions_directorate_taog: "Direktorat Penemuan Angkatan Darat"
  AST_army_inventions_directorate_taog_desc: "Salah satu dari sedikit keuntungan perang, jika bisa disebut demikian, adalah pesatnya inovasi teknologi yang didorong oleh kebutuhan. Kita harus membentuk organisasi terpusat untuk mengembangkan, menyempurnakan, dan memanfaatkan terobosan-terobosan ini."
  AST_yeramba: "Yeramba"
  AST_yeramba_desc: "Berdasarkan kesuksesan kendaraan yang dikembangkan Australia seperti Sentinel, kami telah mengambil langkah berikutnya dengan Yeramba, sebuah tambahan baru yang kuat pada persenjataan kami. Meriam seberat 25 pon yang dipasang pada sasis tank, menghasilkan daya tembak yang mobile dan menghancurkan terhadap musuh-musuh kita."
  AST_alice_springs: "Mata Air Alice"
  AST_alice_springs_desc: "Pedalamannya besar...sangat besar. Pusatnya terletak di kota kecil Alice Springs, yang dapat berfungsi sebagai pusat logistik untuk operasi di seluruh Australia. Kita harus mengembangkannya dan membangun pangkalan militer untuk melatih pasukan yang siap menghadapi lingkungan apa pun."
  AST_australian_regular_army: "Tentara Reguler Australia"
  AST_australian_regular_army_desc: "Kami telah memetik banyak pelajaran, mulai dari pantai Gallipoli hingga gurun pasir di Afrika Utara, pegunungan di Yunani, dan hutan di Asia Tenggara. Pengalaman yang diperoleh dengan susah payah ini telah membentuk militer yang lebih fleksibel dan mudah beradaptasi dibandingkan militer lainnya."
  AST_no1_flying_training_school: "Sekolah Pelatihan Terbang No.1"
  AST_no1_flying_training_school_desc: "Didirikan pada tahun 1921 dengan terbentuknya Royal Australian Air Force, Sekolah Pelatihan Terbang telah dibuka dan ditutup karena permintaan personel udara berfluktuasi. Dengan meningkatnya ketegangan global, kita harus membukanya kembali untuk melatih pilot dan awak pesawat generasi baru."
  AST_empire_air_training_scheme_taog: "Skema Pelatihan Empire Air"
  AST_empire_air_training_scheme_taog_desc: "Rencana Pelatihan Udara Persemakmuran Inggris menawarkan pendanaan dan keahlian yang signifikan kepada negara Persemakmuran untuk melatih sejumlah besar pilot dan awak pesawat. Persaingan untuk menjadi tuan rumah sangat ketat, dengan Australia dan Kanada sebagai pesaing utama. Kami telah mengajukan tawaran kami sendiri di bawah Skema Pelatihan Empire Air."
  AST_volunteer_air_corps: "Korps Pengamat Udara Relawan"
  AST_volunteer_air_corps_desc: "Wilayah udara Australia sangat luas, jauh di luar jangkauan unit resmi saja. Kita sebaiknya bergantung pada sukarelawan lokal, yang bertugas di ribuan pos pengamatan yang tersebar di seluruh negeri untuk mengawasi langit kita."
  AST_improved_ground_crews: "Peningkatan Kru Darat"
  AST_improved_ground_crews_desc: "Untuk setiap pilot, ada seluruh tim awak darat yang diperlukan untuk memastikan perawatan pesawat, koordinasi penerbangan, dan operasi pangkalan yang tepat. Belum lagi para navigator, penembak, dan pembom yang menemani mereka di udara. Kita harus membangun fasilitas pelatihan yang tepat untuk memastikan angkatan udara kita beroperasi dengan efisiensi maksimum."
  AST_advanced_pilot_training: "Pelatihan Pilot Tingkat Lanjut"
  AST_advanced_pilot_training_desc: "Ketika pesawat terbang menjadi lebih kompleks, lebih cepat, dan lebih maju, keterampilan pilot kita harus meningkat agar dapat memanfaatkan sepenuhnya teknologi ini."
  AST_advanced_pilot_training_tt: "§G+10%§! Kecepatan Peningkatan Penguasaan untuk §YDoktrin Udara§!."
  AST_commonwealth_aircraft_corporation_taog: "Perusahaan Pesawat Persemakmuran"
  AST_commonwealth_aircraft_corporation_taog_desc: "Dengan meningkatnya minat terhadap perang untuk memperebutkan angkasa, kita harus memastikan bahwa kita tidak ketinggalan. Penggemar dan inovator masyarakat sipil sudah mulai melihat potensi industri penerbangan; dengan memberikan pendanaan awal kepada mereka, kita dapat mendorong dan memperluas sektor yang sedang berkembang ini."
  AST_reestablish_central_flying_school: "Mendirikan kembali Sekolah Penerbangan Pusat"
  AST_reestablish_central_flying_school_desc: "Sekolah terbang Australia lainnya, yang beroperasi bersama Sekolah Pelatihan Terbang No. 1, Central Flying School akan membantu memenuhi tuntutan angkatan udara modern yang semakin meningkat. Ketika ketegangan meningkat, kita harus memastikan personel kita mendapatkan fasilitas yang mereka perlukan."
  AST_aerodrome_of_democracy_democracy: "Bandar Udara Demokrasi"
  AST_aerodrome_of_democracy_fascism: "Bandar Udara Dominasi"
  AST_aerodrome_of_democracy_communism: "Bandar Udara Emansipasi"
  AST_aerodrome_of_democracy_neutrality: "Bandar Udara Kekuatan"
  AST_aerodrome_of_democracy: "[GET_AERODOME_NAME]"
  AST_aerodrome_of_democracy_desc: "Setelah mencapai garis depan dalam kemampuan penerbangan, Angkatan Udara Australia telah menyandang gelar '[GET_AERODOME_NAME].' Pesawat-pesawat terbang kami terlibat dalam pertempuran udara di seluruh dunia, sementara pesawat-pesawat pembom kami memberikan bayangan mematikan terhadap industri-industri musuh kami."
  AST_government_aircraft_factories: "Pabrik Pesawat Pemerintah"
  AST_government_aircraft_factories_desc: "Mengingat jarak kami dari Eropa, kami tidak dapat mengandalkan sumber pasokan pesawat tradisional di masa perang. Oleh karena itu, penting bagi kita untuk mengembangkan kemampuan manufaktur dalam negeri, sehingga memungkinkan kita memproduksi rangka dan mesin pesawat sesuai spesifikasi kita sendiri."
  AST_death_from_down_under_taog: "Kematian Dari Bawah"
  AST_death_from_down_under_taog_desc: "Dari belahan bumi selatan, kita telah membentuk angkatan udara yang tiada tandingannya. Pesawat kami tersebar di seluruh dunia, menyerang dengan presisi dan kekuatan dahsyat, di mana pun musuh kami bersembunyi, kematian akan datang dari Down Under."
  AST_ride_the_lightning: "Naiki Petir"
  AST_ride_the_lightning_desc: "Pilot pesawat tempur kita adalah ujung tombak kekuatan udara kita; cepat, agresif, dan tanpa henti. Dengan mengendarai petir dalam pertempuran, mereka menguasai langit, mencegat pesawat musuh, dan memastikan bahwa ke mana pun pasukan kita pergi, superioritas udara akan mengikuti di belakangnya."
  AST_the_gathering_storm: "Badai Pengumpulan"
  AST_the_gathering_storm_desc: "Badai sedang berkumpul di cakrawala. Kekuatan udara kita yang semakin meningkat membawa tekanan yang semakin besar dari atas, menyerang tempat musuh yang paling lemah dan mendukung kemajuan kita. Apa yang awalnya hanya berupa keributan di kejauhan akan segera berubah menjadi badai kehancuran yang tiada henti."
  AST_hear_the_thunder: "Dengarkan Guntur"
  AST_hear_the_thunder_desc: "Bisakah kamu mendengar, bisakah kamu mendengar guntur? Dari daratan, pesawat pembom strategis kami membawa kekuatan Australia ke seluruh dunia. Saat langit bergemuruh dan tanah bergetar, musuh kita akan tahu: badai telah datang dan membawa kehancuran."
  AST_department_of_aircraft_production: "Departemen Produksi Pesawat Terbang"
  AST_department_of_aircraft_production_desc: "Ekspansi Angkatan Udara Australia yang pesat telah memberikan tekanan yang signifikan terhadap kapasitas produksi kami. Kita harus berpikir lebih ambisius, memperluas dan mengoordinasikan basis industri kita untuk memenuhi permintaan, dan memastikan kita dapat mengubah keadaan menjadi gelap dengan pesawat kita."
  AST_royal_australian_navy: "Angkatan Laut Kerajaan Australia"
  AST_royal_australian_navy_desc: "Dibentuk setelah federasi dengan menyatukan armada kolonial, Angkatan Laut Kerajaan Australia bertugas di hampir setiap medan Perang Besar. Sejak saat itu, jumlah tersebut telah berkurang karena keterbatasan dana, namun dengan meningkatnya ketegangan global, inilah saatnya bagi armada tersebut untuk kembali melaut."
  AST_coast_watchers: "Pengamat pantai"
  AST_coast_watchers_desc: "Meskipun sebagian besar pasukan kami tetap fokus di daratan, pendekatan kami di utara menawarkan jaringan peringatan dini yang penting. Dengan mengerahkan agen intelijen lokal di pulau-pulau terpencil ini, kita dapat mendeteksi pergerakan udara dan laut musuh jauh sebelum mereka mengancam pantai Australia."
  AST_marines: "Marinir"
  AST_marines_desc: "Sebagai pulau terbesar di lautan kepulauan, kita harus memastikan bahwa kita memiliki kemampuan amfibi untuk memproyeksikan kekuatan di luar pantai kita. Jika kita perlu beralih dari bertahan ke menyerang, kekuatan ini akan memungkinkan operasi penjelajahan pulau secara efektif."
  AST_naval_auxiliary_patrol_taog: "Patroli Bantuan Angkatan Laut"
  AST_naval_auxiliary_patrol_taog_desc: "Dengan dilibatkannya pasukan profesional kita, kita dapat beralih ke sukarelawan lokal yang bersemangat untuk menjaga pelabuhan dan fasilitas pesisir kita. Pengetahuan mereka yang mendalam tentang perairan setempat menjadikan mereka sangat berharga, dan tidak seorang pun akan curiga ada nelayan lokal yang membantu kami."
  AST_cockatoo_island_shipyards_taog: "Galangan Kapal Pulau Kakatua"
  AST_cockatoo_island_shipyards_taog_desc: "Galangan Kapal Pulau Cockatoo telah lama berfungsi sebagai pusat perbaikan dan pemeliharaan kekaisaran, mendukung operasi Angkatan Laut Kerajaan di luar negeri. Sekarang, sebagai landasan Angkatan Laut Australia, kita harus memperluas kapasitasnya untuk memenuhi permintaan armada kita yang terus meningkat dan mempertahankan kekuatan angkatan laut kita."
  AST_kangaroo_point_dry_dock_taog: "Dermaga Kering Kangaroo Point"
  AST_kangaroo_point_dry_dock_taog_desc: "Meskipun Evans Deakin and Company pada dasarnya adalah perusahaan teknik, mereka telah dengan tepat mengidentifikasi kebutuhan untuk memperluas kapasitas pembuatan kapal seiring dengan meningkatnya ketegangan global, dan mereka mengarahkan perhatian mereka ke Kangaroo Point. Kita harus memfasilitasi pengambilalihan tanah ini oleh mereka untuk mendukung pertumbuhan armada kita yang berkelanjutan."
  AST_scrap_iron_flotilla_taog: "Armada Besi Tua"
  AST_scrap_iron_flotilla_taog_desc: "Dianggap oleh para kritikus sebagai kapal yang ketinggalan jaman dan usang, sejumlah kapal perusak tua kita masih disatukan menjadi satu formasi. Meskipun tidak memiliki prestise seperti kapal modern, kapal-kapal ini mewakili pemanfaatan yang cerdik dari apa yang sudah kita miliki."
  AST_cruising_for_a_bruising: "Berlayar untuk Memar"
  AST_cruising_for_a_bruising_desc: "Angkatan Laut kita telah lama memanfaatkan kapal penjelajah dengan terampil, dan ini merupakan tradisi yang patut dikembangkan. Cepat, serbaguna, dan memiliki daya hantaman yang keras, kapal-kapal ini akan segera mendapatkan reputasi di seluruh dunia—setiap musuh yang melintasi jalur mereka akan mendapat luka yang sangat serius."
  AST_strike_from_down_under: "Serang Dari Bawah"
  AST_strike_from_down_under_desc: "Di bawah ombak mereka meluncur, tidak ada gemuruh guntur, dan jika mereka menemukan Anda, kapal Anda akan mereka rampas. Pernahkah Anda mendengar tentang kapal selam dari Down Under? Sebaiknya kau lari, atau armadamu akan kausia-siakan. Ya-aaah!"
  AST_hmas_sydney: "HMAS Sydney"
  AST_hmas_sydney_desc: "Usia kapal perang telah berakhir. Masa depan kekuatan angkatan laut terletak di atas armada, dan Australia tidak akan ketinggalan. Setelah bertahun-tahun membangun kembali dan memodernisasi angkatan laut kami, kami siap mengambil langkah terakhir; sebuah kapal induk yang akan menentukan kekuatan laut Australia untuk generasi mendatang."
  AST_conscription_level_allowed_tt: "Keinginan politik untuk melakukan wajib militer lebih banyak (cari ikon tenaga kerja di fokus)"
  AST_conscription_level_allowed_limited_conscription_tt: "Buka level tambahan §YHukum Wajib Militer§!, yang akan mengaktifkan §YWajib Militer Terbatas§!"
  AST_conscription_level_allowed_extensive_conscription_tt: "Buka level tambahan §YHukum Wajib Militer§!, yang akan mengaktifkan §YWajib Militer Ekstensif§!"
  AST_conscription_level_allowed_service_by_requirement_tt: "Buka level tambahan §YHukum Wajib Militer§!, yang akan mengaktifkan §YLayanan berdasarkan Persyaratan§!"
  AST_conscription_level_allowed_all_adults_serve_tt: "Buka level tambahan §YHukum Wajib Militer§!, yang akan memungkinkan §YSemua Orang Dewasa Melayani§!"
  AST_conscription_level_allowed_scraping_the_barrel_tt: "Buka level tambahan §YHukum Wajib Militer§!, yang akan mengaktifkan §YScraping the Barrel§!"
  AST_conscription_law_so_far: "[CONSCRIPTION_LAW_SO_FAR]"
  ############
  ### MISC ###
  ############
  add_random_stat_to_general_tt: "Menambahkan satu statistik keahlian acak ekstra pada jenderal ini"
  generic_unlock_industrial_concern_tt: "Tersedia sebagai Kepedulian Industri:"
  NZL_rail_standardization_tt: "§Y[?NZL_train_var]§! unit §Y$NZL_train_equipment_1$§! ditambahkan ke timbunan nasional."
  NZL_ministry_of_public_works: "Kementerian Pekerjaan Umum"
  NZL_ministry_of_public_works_desc: "Melalui perencanaan yang terkoordinasi dan investasi yang disiplin, jalan raya, jalur kereta api dan skema pembangkit listrik akan dikembangkan berdasarkan strategi nasional yang koheren dan bukan upaya yang dilakukan sedikit demi sedikit."
  NZL_abolish_the_railways_board: "Hapuskan Dewan Kereta Api"
  NZL_abolish_the_railways_board_desc: "Dewan Perkeretaapian Pemerintah tidak efektif dalam memodernisasi jaringan. Sudah waktunya bagi kita untuk menghapuskan penyimpangan ini dan mengembalikan perkeretaapian ke kendali kementerian."
  NZL_rail_standardization: "Standardisasi Lokomotif"
  NZL_rail_standardization_desc: "[ROOT.GetName] memiliki sejumlah bengkel di seluruh tanah air yang memproduksi lokomotif dengan kualitas berbeda-beda. Untuk membuat sistem perkeretaapian lebih efisien, kami akan menetapkan sejumlah lokomotif standar untuk diproduksi, masing-masing dikhususkan untuk tujuan tertentu."
  NZL_full_employment: "Pekerjaan Penuh"
  NZL_full_employment_desc: "Melalui pekerjaan umum yang berkelanjutan, perencanaan yang matang, dan ekspansi industri yang stabil, pengangguran akhirnya membuka peluang. Lokakarya yang menganggur pada tahun-tahun depresi kini kembali aktif, dan para pekerja di negara ini sepenuhnya terlibat dalam usaha produktif. Setelah memulihkan kepercayaan dan stabilitas, kita tidak hanya pulih, namun juga semakin kuat menghadapi tantangan di masa depan."
  NZL_direct_the_coal_industry: "Mengarahkan Industri Batubara"
  NZL_direct_the_coal_industry_desc: "Ketika batu bara menjadi semakin penting bagi perkeretaapian, industri, dan pembangkit listrik, pemerintah harus turun tangan untuk mengoordinasikan produksi dan distribusi demi kepentingan nasional."
  NZL_establish_the_ncb: "Membentuk Dewan Batubara Nasional"
  NZL_establish_the_ncb_desc: "Dengan membentuk Dewan Batubara Nasional, kita dapat mengarahkan tambang-tambang yang tersebar di negara ini ke dalam arahan yang terkoordinasi dan mengamankan pasokan bahan bakar yang stabil untuk kereta api, industri, dan pembangkit listrik. Pengawasan terpusat akan memungkinkan kita merasionalisasi produksi, meningkatkan efisiensi, dan memastikan bahwa kebutuhan strategis lebih diutamakan daripada kepentingan swasta."
  NZL_electrification: "Perluas Pembangkit Listrik"
  NZL_electrification_desc: "Dengan memanfaatkan sungai dan memperluas pembangkit listrik tenaga air, kita dapat meletakkan fondasi bagi kekuatan industri yang langgeng. Pembangunan bendungan dan transmisi baru akan meningkatkan kapasitas di seluruh negeri, memastikan bahwa pabrik, jalur kereta api, dan pelabuhan mempunyai pasokan listrik yang mereka perlukan."
  NZL_bureau_of_industry_taog: "$NZL_bureau_of_industry$"
  NZL_bureau_of_industry_taog_desc: "$NZL_bureau_of_industry_desc$"
  NZL_wairarapa_sheep_farms_taog: "$NZL_wairarapa_sheep_farms$"
  NZL_wairarapa_sheep_farms_taog_desc: "$NZL_wairarapa_sheep_farms_desc$"
  NZL_national_roads_board_taog: "$NZL_national_roads_board$"
  NZL_national_roads_board_taog_desc: "$NZL_national_roads_board_desc$"
  NZL_taranaki_oil_taog: "$NZL_taranaki_oil$"
  NZL_taranaki_oil_taog_desc: "$NZL_taranaki_oil_desc$"
  NZL_women_in_the_workforce: "Perempuan dalam Angkatan Kerja"
  NZL_women_in_the_workforce_desc: "Ketika kekurangan tenaga kerja semakin parah, perempuan mengambil langkah maju untuk mengisi peran penting di pabrik, pertanian, dan layanan publik serta memastikan bahwa produksi tidak terhenti di bawah tekanan masa perang. Memperluas kesempatan pelatihan dan lapangan kerja akan memungkinkan kita mempertahankan hasil industri sambil menjaga pertahanan nasional."
  NZL_restart_the_onekaka_ironworks: "Mulai ulang Pabrik Besi Onekaka"
  NZL_restart_the_onekaka_ironworks_desc: "Pabrik besi Onekaka pernah mewakili ambisi kami untuk memproduksi besi dan baja di dalam negeri, sehingga mengurangi ketergantungan pada pasokan luar negeri. Untuk menghidupkan kembali perekonomian dan meningkatkan keamanan nasional, terdapat minat untuk menghidupkan kembali tungku Onekaka sekali lagi."
  NZL_new_zealand_steel_taog: "$NZL_new_zealand_steel$"
  NZL_new_zealand_steel_taog_desc: "$NZL_new_zealand_steel_desc$"
  NZL_scrap_metal_recycling: "Kampanye Daur Ulang"
  NZL_scrap_metal_recycling_desc: "Perekonomian yang banyak mengimpor seperti kita tidak boleh boros dalam menggunakan sumber daya strategis. Untuk memperkuat ketahanan ekonomi, kami akan membangun fasilitas daur ulang barang bekas untuk memproses dan menggunakan kembali logam dan karet."
  NZL_domestic_car_industry: "Berinvestasi di Pabrik Perakitan Kendaraan"
  NZL_domestic_car_industry_desc: "Produksi kendaraan di [ROOT.GetName] dibatasi pada perakitan suku cadang dari pabrikan asing yang dikirim ke sini untuk konstruksi akhir. Dengan investasi terbaru kami pada produksi baja dalam negeri, kami mungkin dapat mulai memproduksi komponen sendiri."
  NZL_department_of_scientific_and_industrial_research_taog: "$NZL_department_of_scientific_and_industrial_research$"
  NZL_department_of_scientific_and_industrial_research_taog_desc: "$NZL_department_of_scientific_and_industrial_research_desc$"
  NZL_project_seal_taog: "$NZL_project_seal$"
  NZL_project_seal_taog_desc: "$NZL_project_seal_desc$"
  NZL_industrial_conscription_taog: "$NZL_industrial_conscription$"
  NZL_think_big_taog: "$NZL_think_big$"
  NZL_industrial_conscription_taog_desc: "$NZL_industrial_conscription_desc$"
  NZL_think_big_taog_desc: "$NZL_think_big_desc$"
  NZL_expand_the_university_of_auckland_taog: "$NZL_expand_the_university_of_auckland$"
  NZL_expand_the_university_of_auckland_taog_desc: "$NZL_expand_the_university_of_auckland_desc$"
  NZL_national_broadcasting_service: "Layanan Penyiaran Nasional"
  NZL_national_broadcasting_service_desc: "Menyusul campur tangan Kantor Pos dalam pemilu tahun 1935 dan pengawasan mereka terhadap layanan penyiaran negara, tampak jelas bahwa kita perlu mereformasi manajemen organisasi tersebut. Kita juga harus berinvestasi dalam memperbarui peralatan penyiaran yang digunakannya."
  NZL_support_allies_with_meat: "Memanfaatkan Industri Daging"
  NZL_support_allies_with_meat_desc: "Sekutu kita di Pasifik sering kali memperluas jalur pasokan mereka hingga mencapai batas kemampuannya. Untuk mengurangi ketegangan dan menjaga pasukan mereka tetap diberi makan, kami akan mulai memasok daging kepada mereka."
  NZL_support_allies_with_meat_tt: "Setiap Sekutu akan menerima §G1§! §YPabrik Sipil Offmap§!"
  AST_COMINWEALTH_FACTION: "kekayaan"
  AST_cominwealth_tech_sharing_tt: "Kami akan mengadakan §Yperjanjian pembagian teknologi§! dengan semua anggota faksi kami."
  AST_modify_offshore_advancements_spirit_tt: "Ubah §Y$AST_offshore_advancements_spirit$§! dengan:"
  AST_gain_claims_on_japan_tt: "Kami akan mendapatkan klaim atas §YJapanese Home Isles§!"
  AST_ireland_anti_british_pact_offer_accept_tt: "Jika mereka menerima:"
  AST_through_the_barricades_tt: "Jika §Y[ENG.GetNameDef]§! memiliki setidaknya §Y10%§! Dukungan Komunis, maka pada awal perang para pekerja pelabuhan §Y[132.GetCapitalVictoryPointName]§! akan bangkit untuk mendukung kami!"
  AST_end_the_kingdom_ireland_join_tt: "Karena [IRE.GetName] menandatangani pakta Anti-Inggris, mereka akan ikut berperang di pihak kita setelah kita menyatakan perang terhadap [ENG.GetNameDef]."
 ###########################
 ##### FABDA BRANCH ########
 ###########################
 # Root
 ABDA_abdacom: "Bentuk ABDACOM"
 ABDA_abdacom_desc: "Dengan merangsek majunya kekuatan musuh di Asia Tenggara dan Pasifik, angkatan bersenjata Sekutu di kawasan harus bertindak padu. Dengan mendirikan Komando Tertinggi Gabungan (ABDACOM), kita dapat menghimpun sumber daya, mengoordinasikan armada maritim, dan menghadirkan front perlawanan yang kokoh."
 # Tier 1 - country-locked
 ABDA_fortress_singapore: "Benteng Singapura"
 ABDA_fortress_singapore_desc: "Singapura adalah paku pertahanan strategis kita di kawasan. Memperkokoh bentengnya dan menempatkan garnisun tangguh akan mengulur waktu berharga bagi upaya besar ABDACOM dan menggagalkan kemenangan kilat musuh."
 ABDA_corps_expeditionnaire: "CEFEO"
 ABDA_corps_expeditionnaire_desc: "Indocina Prancis berada di sayap utara batas pertahanan ABDACOM. Dengan melibatkan Corps Expéditionnaire Français en Extrême-Orient ke dalam kancah operasi tempur, [FRA.GetNameDef] menyumbangkan pengalaman dan prajurit kolonial yang sangat berharga bagi komando bersama."
 ABDA_maintain_strategic_flexibility: "Jaga Fleksibilitas Strategis"
 ABDA_maintain_strategic_flexibility_desc: "Amerika Serikat tidak boleh memusatkan seluruh pasukannya hanya pada satu teater. Dengan mengelola cadangan strategis secara cermat, kita memastikan kekuatan industri dan militer Amerika dapat diterjunkan ke mana pun ia paling dibutuhkan di Pasifik."
 # Tier 2
 ABDA_the_malay_barrier: "Rintangan Melayu (Malay Barrier)"
 ABDA_the_malay_barrier_desc: "Rantai kepulauan yang membentang dari Semenanjung Malaya melintasi [INS.GetNonIdeologyName] membentuk benteng pertahanan alami. Pasukan ABDA harus memanfaatkan bentang alam ini, menggelar pertahanan laut dan darat terpadu demi memperlambat laju pasukan musuh."
 ABDA_develop_naval_infrastructure: "Bangun Infrastruktur Maritim"
 ABDA_develop_naval_infrastructure_desc: "Operasi laut berkelanjutan di Pasifik membutuhkan pangkalan, depot bahan bakar, dan fasilitas perbaikan yang andal. Menanam investasi pada infrastruktur pelabuhan dan dermaga kita akan memperpanjang jangkauan serta daya tahan armada laut ABDA."
 # Tier 3
 ABDA_unified_naval_command: "Komando Maritim Terpadu"
 ABDA_unified_naval_command_desc: "Dengan pertahanan darat dan infrastruktur yang telah terbangun, ABDA kini dapat menyatukan seluruh armada maritim di bawah satu rantai komando. Standarisasi sandi komunikasi, pertukaran intelijen, dan rute patroli terpadu akan melipatgandakan efektivitas setiap kapal di teater ini."
 # Tier 4
 ABDA_ship_a_day_sinking_quotas: "Kuota Penenggelaman 'Satu Kapal Sehari'"
 ABDA_ship_a_day_sinking_quotas_desc: "Jalur pasokan logistik musuh yang terbentang melintasi Pasifik adalah titik terlemah mereka. Dengan menetapkan kuota penenggelaman kapal musuh yang agresif dan terkoordinasi bagi armada kapal selam dan kapal permukaan kita, ABDACOM dapat mencekik logistik musuh dan memaksa mereka bersikap defensif."
 ABDA_naval_procurement: "Pengadaan Armada Laut"
 ABDA_naval_procurement_desc: "Kerugian kapal perang yang diderita menuntut penggantian secepatnya. Program pengadaan ABDACOM yang terpadu akan memprioritaskan kapal perusak, kapal selam, dan kapal patroli yang paling cocok untuk teater Pasifik."
 ABDA_keep_trade_open: "Jaga Jalur Perdagangan Terbuka"
 ABDA_keep_trade_open_desc: "Karet dan minyak bumi dari [INS.GetNonIdeologyName] sangat vital bagi upaya perang Sekutu. ABDACOM harus mengamankan jalur pelayaran yang mengangkut sumber daya krusial ini, melindungi konvoi dari sergapan musuh dan menjaga pasokan tetap mengalir ke pabrik-pabrik kita."
 # Tier 5 - capstone
 ABDA_expand_the_command: "Perluas Ruang Lingkup Komando"
 ABDA_expand_the_command_desc: "ABDACOM telah membuktikan keandalannya. Kini kita harus memperluas keanggotaannya kepada bangsa-bangsa Sekutu lainnya di kawasan serta memperdalam kerja sama riset dan intelijen."
 # Tooltips
 ABDA_basic_available_trigger_tt: "Tidak sedang berperang melawan anggota ABDACOM mana pun"
 ABDA_spirit_tooltip: "Memodifikasi §YKomando Tertinggi ABDA§!:"
