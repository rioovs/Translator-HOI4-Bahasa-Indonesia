  idea_SIA_yielded_the_air_war: "Menghasilkan Perang Udara"
  idea_SIA_yielded_the_air_war_desc: "Setelah menyerahkan kendali atas langit, sumber daya dialihkan ke pertahanan anti-udara daripada melawan superioritas udara secara langsung."
