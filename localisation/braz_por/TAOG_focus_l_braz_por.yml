  AST_cannot_campaign_for_two_parties_at_once: "Bukan: Berkampanye untuk partai lain"
  AST_election_campaign_pp_cost_hidden_idea: "Kampanye Pemilu"
  AST_uap_election_campaign_tt: "§YU.A.P Kampanye Pemilu§!\n§LMengumpulkan kelas menengah, pemilik bisnis, dan loyalis kekaisaran; Partai Persatuan Australia akan melancarkan kampanye politik.§!\n\n§YEfek:§!\nBiaya Kekuasaan Politik Harian: §R1.00§!\nHarian §YU.A.P§! Suara meningkat: §G+0,05%§!"
  AST_alp_election_campaign_tt: "§YA.L.P Kampanye Pemilu§!\n§LMengumpulkan kelas pekerja, anggota serikat pekerja, dan reformis yang berpikiran dalam negeri; Partai Buruh Australia akan melancarkan kampanye politik.§!\n\n§YEfek:§!\nBiaya Kekuasaan Politik Harian: §R1.00§!\nHarian §YA.L.P§! Suara meningkat: §G+0,05%§!"
  AST_uap_win_count_trigger_tt: "§YU.A.P§! memiliki setidaknya $COUNT|Y$ Kemenangan Pemilu."
  AST_alp_win_count_trigger_tt: "§YA.L.P§! memiliki setidaknya $COUNT|Y$ Kemenangan Pemilu."
  AST_natunity_desc: "§YPemerintahan Persatuan Nasional§!\n§LPada saat krisis, perjuangan kecil memberi jalan bagi perjuangan yang lebih besar. Negara-negara di sekitar kita menghadapi konflik demi konflik, dan meskipun isu-isu dalam negeri mempunyai urgensi tersendiri, urgensi tersebut memudar ketika ancaman pertumpahan darah semakin dekat. Partai demokrasi [AST.GetName] harus mengesampingkan perbedaan pendapat mereka dan menghadapi dunia dengan bersatu.§!"
  AST_uap_becomes_ruling_party: "§YUnited Australia Party§! menjadi partai yang berkuasa."
  AST_alp_becomes_ruling_party: "§YPartai Buruh Australia§! menjadi partai yang berkuasa"
  AST_increased_focuses_become_available: "Fokus yang terdaftar akan menjadi §Gtersedia§!."
  effect_tt: "§YEfek§!:"
  AST_natunity_becomes_ruling_party: "[GET_AST_RULING_PARTY] akan mengundang [GET_AST_NON_RULING_PARTY] untuk bergabung dalam Pemerintahan Persatuan Nasional.\n\n[GET_AST_NON_RULING_PARTY] Keuntungan §Y1§! Kemenangan Pemilu"
  AST_natunity_effect_update_tt: "Daftar Fokus diperbarui berdasarkan §YPartai Non-Penguasa§! saat ini dan kluster Fokusnya yang sudah terbuka."
  AST_change_democratic_flag_tt: "Bendera §Y[AST.GetAdjective]§! akan diganti."
