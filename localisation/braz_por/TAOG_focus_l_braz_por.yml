  idea_SIA_german_tank_studies_desc: "Perwira kami telah menghabiskan waktu mempelajari doktrin dan desain lapis baja asing, kembali dengan pengetahuan teknis yang langsung digunakan untuk pengembangan pasukan lapis baja kami sendiri."
