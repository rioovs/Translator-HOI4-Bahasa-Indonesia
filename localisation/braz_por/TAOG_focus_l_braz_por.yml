  HOL_taog_guarantee_colonial_loyalty: "Jamin Kesetiaan Koloni"
  HOL_taog_guarantee_colonial_loyalty_desc: "Nasionalisme kian membara di Hindia dan tanda-tanda revolusi baru kian kentara. Meskipun pemberontakan 1927 dapat kita padamkan dengan mudah, intelijen kita melaporkan bahwa kelompok revolusioner kali ini jauh lebih terorganisir. Barangkali jika kita memberikan sejumlah konsesi bagi gerakan nasionalis damai Soetardjo, kita dapat mengalihkan perhatian rakyat dari jalur revolusi kekerasan."
  HOL_taog_guarantee_colonial_loyalty_tt: "§WMenjamin bahwa [INS.GetNameDef] tidak akan mengadakan revolusi.§!\n[INS.GetNameDefCap] akan berusaha memproklamirkan kemerdekaan secara damai. Hal ini dapat dihentikan dengan menyelesaikan fokus §Y$INSHOL_industrialized_colony$§!, yang akan memerlukan investasi besar di koloni tersebut."
  ################
  ###   SIAM   ###
  ################
  SIA_the_khana_ratsadon: "Khana Ratsadon"
  SIA_the_khana_ratsadon_desc: "Partai Rakyat mengakhiri absolutisme dan membuka jalan menuju pemerintahan konstitusional. Warisannya telah diperebutkan, dikhianati, dan berlumuran darah, namun ia tetap menjadi fondasi di mana [SIA.GetName] modern dapat dibangun."
  SIA_the_khana_ratsadon_tt: "§YKhana Ratsadon§! menjadi aktif.\n\n§YKhana Ratsadon§! adalah partai terdepan di [ROOT.GetName], yang terbagi menjadi §YSayap Tentara§! dan §YSayap Sipil§!.\n\nSayap §YSayap Sipil§! umumnya menyukai kebijakan pro-demokrasi yang fokus pada industri sipil, sedangkan §YSayap Militer§! umumnya menyukai kebijakan pro-fasis dan militerisasi industri.\n\nPilihan kita akan membuat mereka lebih atau kurang menyukai kita, memberikan bonus atau malu yang berbeda.\nJika mereka memberontak, mereka mungkin akan mencoba melancarkan kudeta.\n\nNegara persetujuan yang berbeda adalah §YRebellious§!, §YIn Oposisi§!, §YNetral§!, §YDukungan Sedikit§! dan §YDukungan Penuh§!"
  SIA_shuffle_pridi_to_the_minister_of_interior: "Memperkuat Posisi Sayap Sipil"
  SIA_shuffle_pridi_to_the_minister_of_interior_desc: "Dengan menggeser Pridi ke posisi Menteri Dalam Negeri dan bukan Menteri Luar Negeri, ia dapat mengontrol alokasi sumber daya pemerintah secara lebih efektif dan berfungsi sebagai penghambat pengaruh militer."
  SIA_shuffle_pridi_to_the_minister_of_interior_tt: "§Y$anti_fascist_raids$§! sekarang akan meningkatkan persetujuan §YSayap Sipil§!, dan mengurangi persetujuan §YSayap Militer§!"
  SIA_civil_nationalism: "Nasionalisme Sipil"
  SIA_civil_nationalism_desc: "Setiap orang Thailand, apapun statusnya, harus mengetahui bahwa kesetiaan mereka tidak boleh tertuju pada satu pemerintah, atau pada satu orang, melainkan menjunjung tinggi nilai-nilai kebebasan, kebebasan dan kesetaraan, tidak peduli siapa yang saat ini menduduki takhta kekuasaan."
  SIA_the_true_heirs_of_1932: "Pewaris Sejati tahun 1932"
  SIA_the_true_heirs_of_1932_desc: "Militer suka membingkai revolusi tahun 1932 sebagai satu-satunya pencapaian mereka, mengabaikan fakta bahwa revolusi tahun 1932 adalah kemenangan rakyat. Masyarakat hanya perlu diingatkan akan fakta itu, dan dari mereka kita akan menghimpun kekuatan."
  SIA_thammasat_university: "Universitas Thammasat"
  SIA_thammasat_university_desc: "Thammasat sebagai universitas yang baru didirikan dapat, dan harus, diperluas untuk membuka jalan bagi era baru inovasi Thailand."
  SIA_defenders_of_constitutional_liberty: "Pembela Kebebasan Konstitusional"
  SIA_defenders_of_constitutional_liberty_desc: "Guru, Bankir, Perawat – lapisan menengah terpelajar dapat digalakkan dan dimobilisasi untuk membela kebebasan jika sayap militer bertindak terlalu jauh."
  SIA_dominate_public_symbols: "Dominasi Simbol Publik"
  SIA_dominate_public_symbols_desc: "Sayap Militer telah lama mendominasi simbol-simbol publik, mendirikan patung-patung dan menyatakan hari libur nasional untuk merayakan dirinya sendiri. Kita perlu melawan hal ini dengan membangun simbol-simbol kita sendiri, merayakan hak rakyat untuk menentukan nasib sendiri, dan kemenangan atas otokrasi lama."
  SIA_civil_service_heroism: "Kepahlawanan Pegawai Negeri Sipil"
  SIA_civil_service_heroism_desc: "Setiap orang Thailand harus ditanamkan kewajiban yang melekat untuk melindungi supremasi hukum, jika ada kekuatan, asing atau dalam negeri, yang mencoba merebut kekuasaan itu untuk dirinya sendiri. Kita tidak hanya memerlukan dukungan masyarakat jika ada yang mencoba merampas kebebasan kita, namun kita juga memerlukan masyarakat yang bertindak sebagai pembawa standar."
  SIA_spread_democratic_sentiment_in_universities: "Sebarkan Sentimen Demokratis di Perguruan Tinggi"
  SIA_spread_democratic_sentiment_in_universities_desc: "Akademisi menyimpan dalam diri mereka arah masa depan [SIA.GetName]. Apa yang mereka pelajari saat ini akan berdampak di masa depan, dan dengan menanamkan rasa tanggung jawab demokratis yang kuat kepada para cendekiawan masa kini, kita dapat menyebarkannya melampaui batas-batas ruang keilmuan."
  SIA_sideline_disloyal_officers: "Petugas Tidak Setia Sampingan"
  SIA_sideline_disloyal_officers_desc: "Korps Perwira Angkatan Darat bukanlah sebuah monolit. Di dalam jajarannya terdapat orang-orang yang loyalitasnya dimiliki oleh mantan pendukungnya, faksi saingannya, atau ambisinya sendiri, bukan pada pemerintah. Dengan penugasan ulang yang hati-hati dan tekanan administratif, angka-angka ini dapat dipindahkan ke posisi yang tidak menimbulkan ancaman, sementara mereka yang telah menunjukkan keandalannya akan diberi tanggung jawab yang layak mereka terima."
  SIA_sideline_disloyal_officers_tt: "Dua jenderal acak akan mendapatkan sifat §YReassigned§! selama 4 tahun, menyebabkan mereka tidak memberikan bonus.\nDua jenderal acak yang tidak memiliki sifat §YReassigned§! akan mendapatkan statistik ekstra dan sifat ekstra positif."
  SIA_direct_funds_from_the_military_towards_development: "Dana Langsung dari Militer untuk Pembangunan"
  SIA_direct_funds_from_the_military_towards_development_desc: "Meskipun Sayap Militer tidak senang jika pendanaannya dialihkan untuk pembangunan, merekalah yang bertanggung jawab, bukan tanggung jawab kita, untuk menjelaskan kepada masyarakat mengapa kurangnya investasi ini pada akhirnya bermanfaat bagi mereka."
  SIA_as_the_eyes_turn_towards_southeast_asia: "Saat Mata Beralih ke Asia"
  SIA_as_the_eyes_turn_towards_southeast_asia_desc: "Asia Tenggara bukan lagi sebuah teater yang jauh. Ini adalah persimpangan kerajaan, revolusi, dan perang. [SIA.GetName] harus memutuskan apakah akan menjadi pion dalam perjuangan ini atau kekuatan dengan rancangannya sendiri."
  SIA_support_songsuradets_military_clique: "Mendukung Klik Militer Songsuradet"
  SIA_support_songsuradets_military_clique_desc: "Tidak semua perwira adalah musuh bangsa. Songsuradet dan loyalisnya menawarkan alternatif militer yang disiplin dibandingkan para jenderal korup yang membawa Siam ke jurang kehancuran. Dengan dukungan mereka, ketertiban dapat dipulihkan tanpa membuat negara menjadi kacau balau."
  SIA_support_songsuradets_military_clique_tt: "Jika §YPerang Saudara§! pecah Songsuradet akan mendukung kita, memberikan §Y3§! divisi tambahan\n§RJika kita memperkuat Songsuradet dan kemudian mencoba menangkapnya melalui $SIA_the_songsuradet_rebellion$ dia mungkin akan melawan.§!"
  SIA_the_royal_police_counterweight: "Polisi Kerajaan"
  SIA_the_royal_police_counterweight_desc: "Polisi Kerajaan bertindak sebagai kekuatan independen dan dapat dimanfaatkan untuk melawan oposisi kita jika mereka mencoba merebut kekuasaan untuk diri mereka sendiri."
  SIA_the_royal_police_counterweight_tt: "Jika §YPerang Saudara§! pecah, Polisi Kerajaan akan mendukung kami, memberikan §Y2§! divisi tambahan"
  SIA_for_the_preservation_of_siamese_independence: "Konsolidasikan Kontrol Sayap Militer"
  SIA_for_the_preservation_of_siamese_independence_desc: "Abad yang lalu telah menyaksikan kekuatan-kekuatan dunia melanggar integritas teritorial [SIA.GetAdjective], dan abad ini tampaknya juga demikian. Kita harus bertindak tegas jika kita ingin mempertahankan cara hidup kita, jangan sampai kita menjadi miskin, lumpuh, terpecah belah, dan terkoyak."
  SIA_for_the_preservation_of_siamese_independence_tt: "§Y$anti_democratic_raids$§! sekarang akan meningkatkan persetujuan §YSayap Militer§!, dan mengurangi persetujuan §YSayap Sipil§!"
  SIA_the_peoples_day: "Hari Rakyat"
  SIA_the_peoples_day_desc: "Daripada lebih menekankan peran militer dalam menggulingkan monarki lama, kita harus meningkatkan peran rakyat sendiri. Menetapkan Hari Rakyat akan menyemangati bangsa ini, dan mengajarkan warga negara kita untuk berharap tidak kurang dari itu."
  SIA_hold_military_parades: "Adakan Parade Militer"
  SIA_hold_military_parades_desc: "Untuk meningkatkan moral militer, memberi penghargaan kepada jenderal-jenderal kami yang setia, dan mengingatkan warga kami akan kekuatan angkatan bersenjata [SIA.GetAdjective], kami akan mengadakan parade besar melalui Bangkok. Biarkan surat kabar mempunyai sesuatu yang layak untuk dicetak!"
  SIA_embed_technocrats_in_civilian_institutions: "Tanamkan Teknokrat di Institusi Sipil"
  SIA_embed_technocrats_in_civilian_institutions_desc: "Kita dapat membentuk aliansi dengan para teknokrat di pemerintahan, menggunakan mereka sebagai perpanjangan tangan sayap sipil untuk menjangkau lebih jauh dan melawan pengaruh militer."
  SIA_military_academies_indoctrination: "Indoktrinasi Akademi Militer"
  SIA_military_academies_indoctrination_desc: "Akademi militer kami adalah target ideal untuk pelatihan ideologi. Mereka dipersenjatai dengan baik, dan taruna muda mudah dipengaruhi oleh instruktur mereka. Menangkan instruktur, dan Anda menang atas pemuda militer. Militer yang kuat, setia kepada kelas penguasa, adalah fondasi negara yang kuat, dan kita akan menjadi kuat."
  SIA_the_king_of_the_white_elephant: "Raja Gajah Putih"
  SIA_the_king_of_the_white_elephant_desc: "Histeria mengenai reklamasi wilayah yang hilang mengancam akan menghancurkan negara ini, dan dunia sedang menyaksikannya. Untuk meredam semangat ini, kami akan memproduksi film anti-perang, film Thailand pertama yang dibuat dalam bahasa Inggris, untuk menunjukkan kepada dunia wajah sebenarnya dari [SIA.GetName]."
  SIA_the_king_of_the_white_elephant_tt: "Membuka Kampanye Propaganda §Y$SIA_the_king_of_the_white_elephant$§! ketika menyelesaikan fokus §Y$SIA_sala_chaloem_thai_movie_theater$§! yang menghasilkan:\nStabilitas Mingguan: §G+0.45%§! selama 180 hari"
  SIA_drum_up_irredentism: "Menghidupkan Irredentisme"
  SIA_drum_up_irredentism_desc: "Mendapatkan dukungan militer untuk perang di masa depan saja tidak cukup, kita juga harus mendapatkan dukungan masyarakat luas. Melalui puisi, film, dan pidato, kami akan mempersiapkan [SIA.GetName] untuk menghadapi kekuatan imperialis yang mencuri tanah bersejarah kami."
  SIA_sell_privy_purse_lands: "Jual Tanah Privy Purse"
  SIA_sell_privy_purse_lands_desc: "Keluarga kerajaan memiliki sebidang tanah luas yang sekarang berada di bawah kendali kami. Perkebunan ini dapat meningkatkan pendapatan kami secara signifikan, dan sebagiannya dapat dijual dengan harga yang menguntungkan kepada petugas terpilih untuk menjamin loyalitas mereka."
  SIA_sell_privy_purse_lands_tt: "Ketika semangat habis masa berlakunya §Y[SIA_phraya_phahon.GetName]§! akan terlibat dalam skandal, memungkinkan Anda untuk mengabaikan persyaratan fasisme untuk §Y$SIA_phibuns_premiership$§!"
  SIA_war_fervor: "Semangat Perang"
  SIA_war_fervor_desc: "Genderang dibunyikan untuk mengantisipasi konflik yang akan datang. Masyarakat sudah siap, pertandingan telah dimulai, dan semangat perang akan segera mencapai puncaknya. Kita harus berhati-hati untuk mengarahkan energi ini menuju tujuan yang mulia."
  SIA_war_fervor_tt: "Dukungan Perang akan meningkat secara permanen sampai kita menyatakan perang terhadap negara lain, yang mana semangatnya akan dihilangkan.\n\nJika §YDukungan Perang§! tetap di atas §Y95%§! tanpa deklarasi perang terlalu lama maka perang saudara akan dimulai.\nSetelah deklarasi perang:"
  SIA_the_midnight_meeting: "Pertemuan Tengah Malam"
  SIA_the_midnight_meeting_tt: "[SIA_plaek_phibunsongkhram.GetName] akan merebut kekuasaan di [SIA.GetNameDef], memimpin pemerintahan. Kita perlu menggesernya untuk memulihkan monarki."
  SIA_the_midnight_meeting_desc: "Marsekal Lapangan Songsuradet menyaksikan Phibun mengumpulkan kekuatan yang semakin besar dan melihat hal itu sebagai janji pembalasan. Jika monarki dan Songsuradet ingin bertahan maka para royalis, perwira senior, dan tokoh sipil harus bertemu secara rahasia dan menyetujui pemecatan Phibun sebelum dia bergerak melawan mereka terlebih dahulu."
  SIA_meet_with_king_prajadhipok: "Bertemu dengan Raja Prajadhipok"
  SIA_meet_with_king_prajadhipok_desc: "Konspirasi tanpa Raja hanyalah intrik militer. Dengan bertemu Raja Prajadhipok di pengasingan, kita dapat menempatkan perjuangan mereka di bawah legitimasi kerajaan dan mendapatkan restu dari orang yang kembalinya mungkin akan membuat mereka ragu-ragu dan memecah belah rezim."
  SIA_prajadhipok_audience_with_churchill: "Penonton Prajadhipok dengan [ENG.GetLeader]"
  SIA_prajadhipok_audience_with_churchill_desc: "Kehadiran Prajadhipok di [ENG.GetName] menawarkan lebih dari sekedar prestise saja. Jika ia dapat meyakinkan [ENG.GetLeader] bahwa kebangkitan loyalis akan menguntungkan kepentingan Inggris di Asia, maka senjata dari Malaya mungkin akan jatuh ke tangan orang-orang yang masih setia pada takhta."
  SIA_prajadhipok_audience_with_churchill_tt: "[ENG.GetName] akan memberi kami"
  SIA_prajadhipok_audience_with_churchill_tt2: "Setelah dimulainya perang saudara."
  SIA_facilitate_prajadhipoks_move_to_japan: "Memfasilitasi Prajadhipoks Pindah ke Jepang"
  SIA_facilitate_prajadhipoks_move_to_japan_desc: "Inggris bukan satu-satunya negara yang mendapat keuntungan dari kekacauan di [ROOT.GetNameDef]. Dengan mengatur perjalanan Prajadhipok ke Jepang, kita dapat memperoleh dukungan Tokyo dan bahkan mungkin jaminan bahwa perpecahan akan terjadi jika kaum royalis yang bangkit terlibat dalam perang saudara."
  SIA_facilitate_prajadhipoks_move_to_japan_tt: "3 Divisi Ranger dari [JAP.GetNameDef] akan mendukung kami selama perang saudara."
  SIA_the_kings_gambit: "Gambit Raja"
  SIA_the_kings_gambit_desc: "Prajadhipok akan kembali ke Bangkok dengan harapan penuh bahwa rezim akan menahannya. Tindakan itu akan memberikan kaum royalis kemarahan, legitimasi, dan otoritas yang mereka perlukan untuk mengesampingkan keraguan dan mengangkat nama Trump. Setelah raja yang diasingkan ditangkap, sinyal akan diberikan dan perjuangan untuk [ROOT.GetName] akan dimulai."
  SIA_the_kings_gambit_tt: "Dukungan kami akan bergantung pada berapa banyak klik yang kami miliki di pihak kami."
  SIA_restore_order: "Pulihkan Pesanan"
  SIA_restore_order_desc: "Perang saudara telah dimenangkan, namun kemenangan saja tidak menyembuhkan suatu kerajaan. Puing-puing harus dibangun kembali, penjagaan lama ditenangkan dan pemerintahan dibangun kembali, sehingga [ROOT.GetName] dapat bangkit dari kekacauan dengan keamanan Kerajaan dan kehidupan publik kembali ke jalur yang semestinya."
  SIA_ananda_age_trigger_12: "Raja Ananda berusia minimal §Y12§! tahun (Saat ini §Y[?var:SIA_anandas_age]§!). Ulang tahunnya adalah tanggal 20 September"
  SIA_ananda_age_trigger_15: "Raja Ananda berusia minimal §Y15§! tahun (Saat ini §Y[?var:SIA_anandas_age]§!). Ulang tahunnya adalah tanggal 20 September"
  SIA_ananda_trait_tt: "Ketika Ananda naik tahta ia akan memperoleh :"
  SIA_to_forge_a_king: "Untuk Menempa Raja"
  SIA_to_forge_a_king_desc: "Raja Ananda masih berada jauh di Swiss, masih cukup muda sehingga pikiran dan karakternya masih dibentuk. Jika kita membimbing studinya dengan hati-hati, kita mungkin tidak hanya akan membentuk sosok yang diberi mahkota, namun juga seorang penguasa yang sesuai dengan takdir yang kita inginkan [ROOT.GetNameDef]."
  SIA_to_forge_a_king_tt: "Raja Masa Depan, Ananda Mahidol saat ini masih muda dan belajar di [SWI.GetName]. Kita dapat mempengaruhi studi dan minatnya di masa depan, memastikan bahwa dia menjadi raja yang hebat.\n\nSetiap tahun, pada hari ulang tahunnya, hingga dia berusia 15 tahun, kami akan dapat memilih minat untuk belajar, yang akan memberikan bonus berbeda ketika dia akhirnya naik takhta.\n\nTanggal lahirnya adalah 20 September dan usianya adalah §Y[?var:SIA_anandas_age]§!"
  SIA_ascend_the_throne: "Naik Tahta"
  SIA_ascend_the_throne_desc: "Tahun-tahun pemerintahan tidak bisa berlangsung selamanya. Ananda sekarang sudah cukup umur untuk memikul beban kekuasaannya sendiri, dan kenaikan formalnya ke takhta akan memungkinkan monarki yang dipulihkan beralih dari perwalian dan intrik ke pemerintahan yang baru dan sah."
  SIA_the_provincial_council_of_state: "Dewan Negara Provinsi"
  SIA_the_provincial_council_of_state_desc: "Pertikaian ini menyebabkan sistem pemerintahan rusak dan otoritas menjadi tidak menentu. Sampai Raja muda Ananda dapat memerintah atas namanya sendiri, Dewan Negara Provinsi harus bertindak sebagai pemerintahan sementara dan menyatakan bahwa para loyalis tidak berperang untuk diri mereka sendiri, tetapi untuk pemulihan monarki yang sah."
  SIA_the_regency_of_boworadet: "Kabupaten Boworadej"
  SIA_the_regency_of_boworadet_desc: "Pangeran Boworadej mempunyai wibawa orde lama dan tidak ada yang meragukan kesetiaannya. Dengan menunjuknya sebagai Bupati atas nama Ananda, kami menempatkan negara di tangan kelompok konservatif dan memperjelas bahwa restorasi bukan sekadar pergantian menteri."
  SIA_the_sacred_hierarchy: "Hierarki Suci"
  SIA_the_sacred_hierarchy_desc: "Boworadej berpendapat bahwa kerajaan akan menjadi yang terkuat ketika setiap wilayah mengetahui tempatnya dan Mahkota berdiri di atas segala ambisi duniawi. Monarki, kepercayaan, dan hierarki alami [ROOT.GetNameDef] sekali lagi harus diperlakukan sebagai pilar suci dan bukan peninggalan yang bisa ditawar."
  SIA_the_regency_of_songsuradet: "Kabupaten Songsuradet"
  SIA_the_regency_of_songsuradet_desc: "Songsuradet bukanlah seorang liberal, namun ia juga tidak buta terhadap kebutuhan negara modern. Sebagai Bupati ia dapat mempertahankan kekuasaan kerajaan sambil mempercayakan masa depan [ROOT.GetNameDef] pada disiplin, perencanaan, dan program pembangunan nasional yang dipandu militer."
  SIA_order_discipline_and_unity: "Disiplin Ketertiban dan Persatuan"
  SIA_order_discipline_and_unity_desc: "Kekacauan politik faksi dan perang saudara hampir menghancurkan dunia ini. Jawaban Songsuradet jelas: ketertiban dalam pemerintahan, kedisiplinan dalam masyarakat, dan kesatuan tujuan, agar kerajaan dapat kembali menjadi negara yang lebih kuat dan modern."
  SIA_the_regency_of_rangsit: "Kabupaten Rangsit"
  SIA_the_regency_of_rangsit_desc: "Pangeran Rangsit memahami bahwa monarki hanya dapat bertahan jika melakukan rekonsiliasi dengan pemerintahan perwakilan. Kabupatennya menawarkan restorasi kerajaan yang bermartabat secara konservatif, namun metodenya demokratis dan siap memberikan [ROOT.GetNameDef] masa depan parlemen yang stabil."
  SIA_constitutional_virtue: "Kebajikan Konstitusional"
  SIA_constitutional_virtue_desc: "Monarki yang menghormati hukum lebih sulit digulingkan dan dipertahankan. Di bawah bimbingan Rangsit, kita akan menghidupkan kembali pemerintahan konstitusional, mengendalikan kekuasaan sewenang-wenang dan mengajarkan bangsa ini bahwa Kerajaan akan merasa paling aman ketika ia berdiri sebagai penjaga kebebasan yang sah."
  SIA_an_absolute_monarchy: "Monarki Absolut"
  SIA_an_absolute_monarchy_desc: "Eksperimen monarki terbatas hanya menghasilkan penghinaan, kudeta, dan perampasan kekuasaan kerajaan oleh pejabat ambisius. Jika tahta ingin mendapatkan kesetiaan sekali lagi, maka Kerajaan harus mendapatkan kembali hak prerogatif penuhnya dan memerintah tanpa subordinasi kepada partai atau parlemen."
  SIA_a_constitutional_monarchy: "Monarki Konstitusional"
  SIA_a_constitutional_monarchy_desc: "Tahta tidak perlu mendominasi negara untuk mempertahankan kerajaan. Dengan memulihkan monarki dalam penyelesaian konstitusional yang tahan lama, kita dapat mengikat Kerajaan dan rakyatnya bersama-sama dan memastikan bahwa martabat kerajaan hidup berdampingan dengan pemerintahan yang bertanggung jawab."
  SIA_to_lay_the_bait: "Untuk Meletakkan Umpan"
  SIA_to_lay_the_bait_tt: "Kami akan membocorkan rencana ekonomi yang dibuat-buat untuk memusuhi militer.\nSemakin lama kami menunda §Y$SIA_and_spring_the_trap$§!, semakin besar reaksi terhadap militer dan semakin kuat dukungan kami akan tumbuh.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nSetiap kali militer mengkritik rancangan palsu tersebut, dukungan kami terhadap perang saudara akan meningkat, hingga a maksimal §Y75%§! dukungan perang saudara. Tambahan dukungan perang saudara sebesar §Y25%§! dapat diperoleh dari total dukungan demokratis kami (diskalakan dari §Y0%-100%§!)"
  SIA_dem_event_count_cw_scale_tt: "§YDukungan Prediksi Saat Ini§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
  SIA_to_lay_the_bait_desc: "Berkas Kuning menyerukan reformasi ekonomi, namun militer akan menyebutnya komunis. Dengan membocorkan rancangan radikal palsu terlebih dahulu, kita dapat memancing kemarahan mereka, kemudian mendiskreditkan mereka ketika versi yang sebenarnya dan lebih ringan dirilis."
  SIA_and_spring_the_trap: "Dan Pasang Perangkapnya"
  SIA_and_spring_the_trap_desc: "Para jenderal telah mengambil umpannya. Kemarahan mereka telah berubah menjadi pemberontakan, pemberontakan mereka telah mengungkap ambisi mereka, dan pemerintah sipil sudah siap. Sekarang jebakannya sudah tertutup, dan masa depan [ROOT.GetName] akan ditentukan oleh mereka yang setia pada konstitusi."
  SIA_and_spring_the_trap_tt: "Jika total dukungan kami melebihi §Y80%§! kami akan menghindari perang saudara dan segera menggulingkan militer."
  SIA_rebuild_the_war_torn_economy: "Membangun Kembali Perekonomian yang Rusak Akibat Perang"
  SIA_rebuild_the_war_torn_economy_desc: "Perang saudara telah menghancurkan jalan, pabrik, sawah, dan jalur perdagangan. Rekonstruksi harus segera dimulai. Upah, pangan, kereta api, dan kredit akan lebih berperan dalam menstabilkan [ROOT.GetName] dibandingkan pidato apa pun dari Bangkok."
  SIA_end_military_grift: "Akhiri Grift Militer"
  SIA_end_military_grift_desc: "Sudah terlalu lama anggaran militer hanya memberi makan kekayaan swasta, jaringan patronase, dan proyek prestise yang tidak berguna. Perang telah mengungkap kebusukan. Setiap kontrak yang korup, unit hantu, dan kiriman yang dicuri harus diselidiki dan disingkirkan dari klik lama."
  SIA_the_purge: "Pembersihan"
  SIA_the_purge_desc: "Klik militer telah membuat bangsa ini berlumuran darah dan bukannya tunduk pada pemerintahan sipil. Tidak ada kompromi dengan pengkhianat. Petugas, kolaborator, dan simpatisan harus disingkirkan dari setiap komando sebelum mereka dapat mengancam negara lagi."
  SIA_achieve_foreign_legitimacy: "Mencapai Legitimasi Asing"
  SIA_achieve_foreign_legitimacy_desc: "Kekuatan asing telah menyaksikan krisis ini dengan penuh kecurigaan, menunggu apakah Siam akan jatuh ke dalam kekuasaan junta atau revolusi. Kita harus membuktikan bahwa pemerintahan sipil stabil, sah, dan mampu membela negara."
  SIA_achieve_foreign_legitimacy_trigger: "Kekuatan Besar mana pun memiliki lebih dari §Y75§! Pendapat kami"
  SIA_countries_that_like_me_doctrine_tt: "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! Pengurangan Biaya untuk: §YDoktrin Pertanahan§!"
  SIA_achieve_foreign_legitimacy_tt: "Dapatkan stabilitas §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! untuk setiap negara besar yang memiliki lebih dari §Y75§! opini kami.\n\nJika lebih dari §Y3§! negara besar memenuhi syarat, kami juga akan mendapatkan §Y1x§! §G50%§! Pengurangan Biaya untuk: §YDoktrin Tanah§! untuk setiap negara besar yang memenuhi syarat melampaui batas tersebut.\n\nJika §Y6§! atau lebih negara besar memenuhi syarat, kami akan memperoleh keuntungan §G+2§! §YPabrik Sipil§!."
  SIA_secure_the_state: "Amankan Negara"
  SIA_secure_the_state_desc: "Kemenangan dalam perang saudara tidak berarti stabilitas. Jalur kereta api, pelabuhan, gudang senjata, dan pusat komunikasi harus diamankan sebelum petugas reaksioner dapat berkumpul kembali. Bangkok harus tetap tenang, terhubung, dan berada di bawah kendali sipil."
  SIA_expand_upon_the_dossier: "Perluas Berkasnya"
  SIA_expand_upon_the_dossier_desc: "Berkas Kuning ditulis untuk momen yang rapuh. Saat itu telah berlalu. Dengan dikalahkannya kelompok militer, kita dapat melangkah lebih jauh: reformasi pertanahan yang lebih mendalam, perlindungan tenaga kerja yang lebih kuat, dan negara yang mampu membentuk kembali Siam dari awal."
  SIA_military_oversight_bureau: "Biro Pengawasan Militer"
  SIA_military_oversight_bureau_desc: "Tentara tidak bisa dibiarkan menjadi negara di dalam negara lagi. Biro pengawas yang dipimpin sipil akan memantau penunjukan, anggaran, dan aktivitas politik dalam angkatan bersenjata, memastikan bahwa barak-barak tersebut berada di Bangkok, bukan sebaliknya."
  SIA_military_oversight_bureau_tt: "§YMOB§! melakukan investigasi terhadap jenderal setiap 5-9 bulan. Selama periode ini, para jenderal yang terkena dampak beroperasi dengan efisiensi yang berkurang, dan waspada terhadap peningkatan pengawasan."
  SIA_the_yellow_dossier: "Berkas Kuning"
  SIA_the_yellow_dossier_desc: "Rancangan radikal yang dipalsukan telah berhasil. Kini Dokumen Kuning yang sebenarnya dapat diimplementasikan: reformasi terukur, modernisasi ekonomi, dan perlindungan politik yang dirancang untuk mematahkan dominasi militer tanpa menyebabkan kekacauan pada negara."
  SIA_achieve_domestic_legitimacy: "Mencapai Legitimasi Domestik"
  SIA_achieve_domestic_legitimacy_desc: "Pemerintah bertahan dengan kekuatan senjata, namun kini harus menang melalui hukum, pangan, dan ketertiban. Kepercayaan masyarakat harus dipulihkan, tindakan darurat harus dibenarkan, dan masyarakat harus melihat bahwa pemerintahan sipil menawarkan lebih dari sekedar kelangsungan hidup."
  SIA_achieve_domestic_legitimacy_tt: "§YKhana Ratsadon System§! akan dinonaktifkan.\n§YSayap Militer§! akan dibubarkan secara permanen, menghilangkan semangatnya sepenuhnya.\n\n§YSayap Sipil§! akan direorganisasi secara permanen menjadi §Y$idea_SIA_unwavering_civilian_support$§!."
  SIA_allies_integration: "Integrasi Sekutu"
  SIA_allies_integration_desc: "Pasukan kita harus belajar berperang bersama Sekutu. Struktur komando, komunikasi, prosedur pasokan, dan standar peralatan harus disesuaikan sebelum Siam dapat menjadi lebih dari sekadar mitra simbolis."
  SIA_prepare_for_a_pacific_war: "Bersiaplah untuk Perang Pasifik"
  SIA_prepare_for_a_pacific_war_desc: "Mata negara-negara imperium beralih ke Pasifik. Ambisi Jepang, koloni-koloni Eropa, dan strategi Sekutu semuanya mengarah pada badai yang akan datang. Siam harus bersiap sebelum tembakan pertama mencapai pantai kita."
  SIA_the_end_of_gunboat_diplomacy: "Berakhirnya Diplomasi Kapal Perang"
  SIA_the_end_of_gunboat_diplomacy_desc: "Kapal perang asing tidak akan pernah lagi mendiktekan persyaratan dari mulut Chao Phraya. Siam harus memiliki senjata, dermaga, ranjau, dan pertahanan pantai yang diperlukan untuk menjadikan ancaman apa pun terhadap Bangkok sebagai tindakan gila."
  SIA_preemtive_strike: "Serangan Preemptif"
  SIA_preemtive_strike_desc: "Menunggu Jepang untuk memilih waktu perang adalah suatu kebodohan. Jika kekaisaran bermaksud untuk menghancurkan Asia, maka [SIA.GetName] harus menyerang sebelum pasukan dan armadanya ditugaskan sepenuhnya ke tempat lain."
  SIA_the_siamese_armada: "Armada [SIA.GetAdjective]"
  SIA_the_siamese_armada_desc: "[SIA.GetName] modern membutuhkan armada modern. Dengan kapal-kapal baru, awak kapal yang terlatih, dan infrastruktur angkatan laut yang diperluas, Armada [SIA.GetAdjective] akan menjadi kekuatan yang mampu mempertahankan pantai kita dan memproyeksikan kekuatan di luar wilayah tersebut."
  SIA_asian_democratic_compact: "Perjanjian Demokratik Asia"
  SIA_a_more_moderate_option: "Opsi yang Lebih Moderat"
  SIA_a_more_moderate_option_desc: "Reformasi harus bertahan, bukan padam dalam badai pertentangan. Dengan menjaga Berkas Kuning dalam batasan yang moderat, kita dapat mengisolasi kaum ekstremis, menenangkan kelas menengah, dan membangun tatanan sipil yang mampu bertahan dari kemenangan pertamanya."
  SIA_asian_democratic_compact_desc: "Asia tidak bisa selamanya bergantung pada kerajaan yang jauh atau janji-janji kekuatan besar. Negara-negara demokratis di kawasan ini harus berdiri bersama, membela satu sama lain, dan membuktikan bahwa kemerdekaan dan kebebasan dapat bertahan di Asia."
  SIA_asian_democratic_compact_tt: "Membuka kemampuan untuk menuntut kemerdekaan bagi negara-negara yang menjadi subyek Asia, dan memungkinkan kita untuk mengundang mereka ke dalam faksi kita."
  SIA_asian_democratic_compact_modify: "Memodifikasi §Y$SIA_asian_democratic_compact$§! dengan:"
  SIA_southeast_asia_joint_command: "Komando Gabungan Asia Tenggara"
  SIA_southeast_asia_joint_command_desc: "Kesepakatan kita harus menjadi lebih dari sekadar janji diplomatik. Sebuah komando gabungan akan mengoordinasikan strategi, pasokan, intelijen, dan perencanaan pertahanan di seluruh Asia Tenggara, mengubah pasukan yang terpisah menjadi perisai bersama."
  SIA_pan_asian_weapon_standardization: "Standardisasi Senjata Pan Asia"
  SIA_pan_asian_weapon_standardization_desc: "Setiap sekutu yang menggunakan senapan, kaliber, radio, dan kendaraan berbeda akan mengundang kegagalan logistik. Senjata yang terstandarisasi dan rencana produksi bersama akan membuat koalisi kita lebih kuat, lebih murah, dan lebih cepat dalam mempersenjatai."
  SIA_united_against_aggression: "Bersatu Melawan Agresi"
  SIA_united_against_aggression_desc: "Tidak ada anggota dari perjanjian kita yang dapat berdiri sendiri. Apakah ancaman tersebut datang dari kekaisaran, fasisme, militerisme, atau negara tetangga yang oportunis, negara-negara Asia akan menjawabnya bersama-sama."
  SIA_the_hammers_that_strike: "Palu yang Menyerang"
  SIA_the_hammers_that_strike_desc: "Aliansi kita bukan lagi kumpulan negara-negara kecil yang berharap untuk bertahan hidup. Itu adalah senjata. Setiap negara adalah sebuah palu, dan bersama-sama kita akan menyerang kekuatan apa pun yang ingin mendominasi Asia."
  SIA_mobilize_the_defenders_of_siam: "Memobilisasi Pembela Siam"
  SIA_mobilize_the_defenders_of_siam_desc: "Militer lama telah mengecewakan negaranya, namun Siam masih membutuhkan pembela. Relawan, petugas setia, penjaga provinsi, dan warga negara yang patriotik harus diorganisir menjadi kekuatan yang melindungi konstitusi dari musuh di dalam dan di luar."
  SIA_join_the_allies: "Bergabunglah dengan Sekutu"
  SIA_join_the_allies_desc: "[ROOT.GetName] tidak bisa berdiri sendiri ketika dunia sedang dilanda peperangan. Sekutu menawarkan senjata, pengakuan, dan tempat di antara negara-negara yang melawan agresi. Dengan bergabung dengan mereka, kami mengikat kelangsungan hidup Siam dengan perjuangan yang lebih luas demi dunia yang bebas."
  SIA_the_malay_peninsular_defense_plan: "Rencana Pertahanan Semenanjung Malaya"
  SIA_the_malay_peninsular_defense_plan_desc: "Jika perang terjadi di Asia Tenggara, Malaya akan menjadi salah satu medan pertempuran pertamanya. Benteng, depot pasokan, dan perencanaan bersama dengan Inggris akan mengubah semenanjung menjadi perisai melawan invasi."
  SIA_the_malay_peninsular_defense_plan_tt: "Membangun jalur kereta api antara Bangkok dan Singapura.\n\nSetiap Poin Kemenangan di [MAL.GetName], Singapura, [724.GetName], [289.GetName] dan [1076.GetName]\nTambahkan §G2§! §YBenteng Pantai§!\nTambahkan §G2§! §YBenteng Tanah§!\nMasing-masing negara bagian ini:\nTambahkan §G1§! §YStatis Anti Udara§!"
  SIA_join_the_united_front: "Bergabunglah dengan Front Persatuan"
  SIA_join_the_united_front_desc: "Tiongkok berdarah-darah akibat agresi [JAP.GetAdjective], namun Tiongkok masih terus berjuang. Dengan bergabung dengan Front Persatuan, [SIA.GetName] dapat membantu mengubah perang darat menjadi kuburan ambisi kekaisaran."
  SIA_a_land_war_in_asia_desc: "Perang tidak akan dimenangkan hanya dengan deklarasi. Tentara Siam harus berbaris, berperang, dan bertahan melintasi medan sulit di Asia. Komitmen kami terhadap Front Persatuan harus diukur dalam tindakan."
  SIA_death_to_the_communists: "Kematian bagi Komunis"
  SIA_death_to_the_communists_desc: "Kekalahan klik militer tidak boleh membuka pintu bagi tirani lainnya. Para agitator komunis yakin krisis ini telah melemahkan negara. Mereka akan segera menyadari bahwa demokrasi sipil bukannya tanpa pertahanan."
  SIA_death_to_the_nationalists: "Kematian bagi kaum Nasionalis"
  SIA_death_to_the_nationalists_desc: "Jepang telah terpukul mundur, namun pertanyaan mengenai masa depan Asia masih tetap ada. Tatanan nasionalis lama hanya akan menggantikan satu hierarki dengan hierarki lainnya. Jika Asia ingin dibangun kembali, komunis harus menang."
  SIA_a_new_dawn_over_asia: "Fajar Baru di Asia"
  SIA_a_new_dawn_over_asia_desc: "Kekaisaran Jepang telah jatuh, dan kekuatan korup yang berupaya mewarisi reruntuhannya telah disingkirkan. Di seluruh Asia, fajar baru terbit bagi negara-negara yang bertekad membangun masa depan mereka bebas dari dominasi kekaisaran."
  SIA_phibuns_premiership: "Liga Utama Phibun"
  SIA_phibuns_premiership_desc: "Ketika masa jabatan perdana menteri [SIA_phraya_phahon.GetName] berakhir, penerus terpilih dari partai tersebut, Plaek Phibunsongkhram, siap untuk mengambil alih kekuasaan. Hal ini akan sangat menyenangkan posisi militer terhadap kita, namun akan membuat sayap sipil berada di belakang dengan kegelisahan.\nBagi kita hanya ada satu jalan ke depan di zaman baru ini; dengan keyakinan besar!"
  SIA_siamese_youth_movement: "[THIS.GetAdjective] Gerakan Pemuda"
  SIA_siamese_youth_movement_desc: "Dewasa muda [THIS.GetName] perlu ditempa, seperti baja di atas api yang panas. Mereka akan belajar menghormati negara, bagaimana membela tanah air dan menjadi anggota masyarakat Thailand yang berharga."
  SIA_territorial_defense_student: "Mahasiswa Pertahanan Teritorial"
  SIA_territorial_defense_student_desc: "Memperluas momen pemuda, kandidat yang paling menjanjikan dapat dipindahkan ke kamp pelatihan prajurit junior, di mana mereka akan membantu pertahanan [SIA.GetNameDef]. Mereka akan menerima pelatihan militer yang tepat dan bertindak sebagai alat tambahan yang dapat digunakan tentara."
  SIA_expand_domestic_arms_workshops: "Perluas Bengkel Senjata Dalam Negeri"
  SIA_expand_domestic_arms_workshops_desc: "Kemampuan dalam negeri kita dalam memproduksi bahan perang sangat tertinggal dibandingkan negara-negara maju lainnya. Kita perlu fokus pada perluasan produksi militer di dalam negeri untuk memastikan bahwa pasukan kita terus-menerus diberikan peralatan baru."
  SIA_look_to_european_fascism: "Lihatlah Fasisme Eropa"
  SIA_look_to_european_fascism_desc: "Kita mempunyai kesempatan untuk mereformasi negara ini, tidak terbelenggu oleh masa lalu, kita akan menatap masa depan yang baru, terinspirasi oleh apa yang terjadi di Barat. Jelas bahwa tatanan dunia yang lama sedang dibongkar, dan mereka yang tertinggal akan menanggung akibat dari kurangnya penglihatan mereka."
  SIA_the_songsuradet_rebellion: "Pemberontakan Songsuradet"
  SIA_the_songsuradet_rebellion_desc: "Perwira senior Phraya Songsuradet adalah ancaman bagi rezim saat ini, jika ia menginginkannya. Bahaya terhadap rezim ini tidak dapat ditanggung, dan sebagai lawan utama Phibun dia harus pergi.\nTidak diragukan lagi terdapat banyak bahan perusak yang dapat digunakan untuk melawan Songsuradet dan para pendukungnya, yang akan membantu mengkonsolidasikan kekuatan kita dan melenyapkan lawan-lawan dalam negeri kita."
  SIA_the_songsuradet_rebellion_historical_tt: "Jenderal Phraya Songsuradet akan dituduh berkonspirasi melawan negara. Dia dan penasihat §Y[SIA_rangsit_prayurasakdi.GetName]§! akan disingkirkan.\n\nKami akan mendapatkan"
  SIA_the_songsuradet_rebellion_historical_tt2: "Setelah waktu habis, keuntungan:"
  SIA_the_songsuradet_rebellion_historical_tt3: "selama §Y[?var:SIA_purged_military_timer]§! hari"
  SIA_the_songsuradet_rebellion_alt_tt: "Jenderal Phraya Songsuradet akan dituduh berkonspirasi melawan negara.\n\nNamun karena kita memperkuat klik militernya, dia mungkin akan berani dan menolak panggilan tersebut, sehingga menyebabkan kebuntuan atau berpotensi menimbulkan perang saudara."
  SIA_sue_the_king_in_exile: "Menuntut Raja di Pengasingan"
  SIA_sue_the_king_in_exile_desc: "Raja di pengasingan dikabarkan membawa cukup banyak barang berharga ke [ENG.GetNameDefCap]. Kita harus mendapatkannya kembali, dan jika menuntut dia dan pasangannya untuk mencapai hal itu, biarlah."
  SIA_suspend_ordinary_legal_procedures: "Tangguhkan Prosedur Hukum Biasa"
  SIA_suspend_ordinary_legal_procedures_desc: "Pemberontakan Songsuradet memberi kita peluang untuk melakukan reformasi besar-besaran atas nama keamanan nasional. Pengawasan dan keseimbangan yang dilakukan oleh pengadilan dan organ politik lainnya akan dikebiri, sehingga memberi kita waktu yang diperlukan untuk memusatkan kekuasaan."
  SIA_the_duty_of_the_thai_people_during_the_war_act: "Tindakan Kewajiban Rakyat Thailand Selama Perang"
  SIA_the_duty_of_the_thai_people_during_the_war_act_desc: "$idea_SIA_cemented_control_3_desc$"
  SIA_recognize_manchukuo: "Kenali Manchukuo"
  SIA_recognize_manchukuo_desc: "TODO_CM"
  SIA_press_censorship: "Sensor Pers"
  SIA_press_censorship_desc: "Pers yang bebas berisiko merusak stabilitas negara. Walaupun harus ada kelonggaran, kita perlu memastikan bahwa suara dan kemauan pemerintah diprioritaskan di media."
  SIA_department_of_publicity: "Departemen Publisitas"
  SIA_department_of_publicity_desc: "Mesin propaganda sangat penting bagi negara mana pun, terutama negara seperti kita yang memiliki ambisi teritorial. Mendanai departemen publisitas akan memungkinkan kita mencapai hal ini."
  SIA_thai_cultural_mandates: "Mandat Budaya Thailand"
  SIA_thai_cultural_mandates_desc: "Kita dapat menyemangati masyarakat Thailand dan membangun budaya nasional yang kuat dengan mengeluarkan mandat, memperkuat persatuan masyarakat, dan membentuk identitas yang bersatu."
  SIA_thai_cultural_mandates_tt: "Membuka keputusan untuk memberlakukan mandat budaya, memberikan berbagai dorongan untuk biaya §YKekuatan Politik§!. Amanat Pertama dan Amanat pertama lainnya tidak dipungut biaya."
  SIA_relocate_the_capital_to_phetchabun: "Pindahkan Ibukota ke Phetchabun"
  SIA_relocate_the_capital_to_phetchabun_desc: "Pemerintah terancam! Sebagaimana telah dibuktikan oleh sejarah, Bangkok rentan terhadap serangan angkatan laut dan meskipun hal ini jelas merupakan keputusan yang tidak populer, memindahkan ibu kota lebih jauh ke pedalaman adalah keputusan yang harus diambil."
  SIA_relocate_the_capital_to_phetchabun_tt: "Pindah hingga §G3§! §YPabrik Militer§! dari §Y[1076.GetName]§! ke §Y[1077.GetName]§!\nPindahkan §G3§! §YPabrik Sipil§! dari §Y[1076.GetName]§! hingga §Y[1077.GetName]§!\nMembangun Tingkat §G3§! Benteng di sekitar Petchabun"
  SIA_relocate_the_capital_to_phetchabun_tt2: "Setelah batas waktu roh habis - Dapatkan Stabilitas Basis: §R-25%§!"
  SIA_radio_propaganda: "Propaganda Radio"
  SIA_radio_propaganda_desc: "Radio menjadi andalan ketika [SIA.GetName] menggemparkan, dan sebagaimana kita harus menguasai pers, kita juga perlu menguasai apa yang disiarkan."
  SIA_sala_chaloem_thai_movie_theater: "Teater Film Sala Chaloem Thai"
  SIA_sala_chaloem_thai_movie_theater_tt: "Membuka keputusan untuk membuat film propaganda, memberikan berbagai dorongan. Misalnya:"
  SIA_sala_chaloem_thai_movie_theater_desc: "Film adalah media baru di negara kita, namun potensinya masih terbuka untuk dilihat semua orang. Seperti halnya puisi, buku, dan radio, hal ini dapat mengisi hati dan pikiran rakyat jelata dan elit. Dengan menggunakan media ini kita dapat memperkuat tekad masyarakat untuk melihat peningkatan besar [SIA.GetName]."
  SIA_pan_thaiism: "Pan-Thaiisme"
  SIA_pan_thaiism_desc: "Hal ini tidak hanya cukup untuk [ROOT.GetName] untuk hidup, namun juga perlu untuk berkembang. Masa depan masyarakat [ROOT.GetAdjective] bukan sekedar pasrah sebagai negara kelas tiga, tapi berperan aktif dalam urusan dunia. Pertama, hati dan pikiran rakyat harus digembleng melawan kaum imperialis yang merampas apa yang pernah menjadi milik kita, dan mengingatkan rakyat akan apa yang telah dirampas dari kita."
  vichy_exist_trigger: "§YVichy Perancis§! Ada"
  vichy_exist_not_trigger: "§YVichy Perancis§! Tidak Ada"
  SIA_retake_lost_british_states: "Rebut kembali Negara Bagian Inggris yang Hilang"
  SIA_retake_lost_british_states_tt: "Membuka kemampuan untuk melancarkan perang terbatas melawan wilayah Inggris di §YBurma§! dan §YMalaysia§!"
  INS_retake_lost_british_states_tt: "Membuka kemampuan untuk melancarkan perang terbatas terhadap wilayah kekuasaan Britania di §YMalaysia§!"
  SIA_retake_lost_british_states_desc: "Bukan hanya [FRA.GetAdjective] yang membagi kerajaan besar kita, tetapi juga [ENG.GetAdjective] yang, didorong oleh ambisi, juga memanfaatkan setiap kesempatan untuk mengklaim bagiannya. Ketika perhatian mereka tertuju pada rival yang lebih besar, inilah saatnya bagi kita untuk bertindak."
  SIA_recover_indochina: "Pulihkan Indochina"
  SIA_recover_indochina_desc: "Abad terakhir ini menyaksikan negara kita terpecah-belah oleh [FRA.GetAdjective], sebuah pemerintahan di seluruh dunia yang tidak mempunyai urusan untuk memberi tahu kita apa yang harus kita lakukan atau bagaimana hidup, namun dengan kapal perang dan senjata mereka merampas milik kita. Di abad ini kekuatan [FRA.GetAdjecive] mulai memudar; abad ini adalah milik kita."
  SIA_recover_indochina_tt: "Membuka kemampuan untuk melancarkan perang terbatas melawan wilayah §YIndochina§!"
  SIA_demand_the_return_of_lost_territory: "Menuntut Pengembalian Wilayah yang Hilang"
  SIA_demand_the_return_of_lost_territory_desc: "[FRA.GetNameDefCap] telah menunjukkan kelemahannya, tidak lebih dari seekor macan kertas yang bergantung pada pengaruh memudarnya yang masih dimilikinya. Dengan runtuhnya angkatan bersenjata, mereka tidak dapat lagi menunjukkan kekuatan yang mereka miliki dan tidak mampu menentang tuntutan kami."
  SIA_demand_the_return_of_lost_territory_tt: "Kami akan meminta pemilik §YIndochina§! dan bagian dari §Y[MAL.GetName]§! untuk mengembalikan §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! dan §Y[670.Getname]§! kepada kami.\n\nFaktor yang mempengaruhi :\n-Kekuatan Pertarungan minimal 30% dibandingkan pemilik\n-Pemilik sedang berperang dengan mayor\n-Pemilik tidak berada dalam faksi\n-Pemilik adalah §YVichy France§!\n-Kami berada di faksi\n-Pemilik tidak menyukai kami"
  SIA_the_greater_thai_empire: "Kekaisaran Thailand Raya"
  SIA_the_greater_thai_empire_available_trigger: "§Y[ROOT.GetName]§! mengendalikan setiap Negara Bagian Indochina\nKepatuhan setiap negara bagian Indochina lebih dari: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nSelain itu mensyaratkan:"
  SIA_the_greater_thai_empire_desc: "Saat kenaikan kita sudah dekat. Apa yang pernah direbut kini telah dipulihkan, dan dengan pengakuan masyarakat terhadap kami sebagai otoritas de facto, kami telah dengan tegas mengukuhkan legitimasi kami sebagai pemimpin sah Kerajaan Besar Thailand yang baru ini."
  SIA_crack_down_of_foreign_merchants: "Menindak Pedagang Asing"
  SIA_crack_down_of_foreign_merchants_desc: "Perdagangan telah lama dipengaruhi oleh kepentingan eksternal, sehingga menciptakan kerentanan yang dapat mempengaruhi ketahanan nasional. Untuk menjaga keamanan ekonomi, kita harus mampu mengendalikan perdagangan kita sendiri, memastikan bahwa kemakmuran dan stabilitas dibangun di atas fondasi yang kita kendalikan sendiri."
  SIA_royal_palace_bureau_directive_no_1523: "Petunjuk Biro Istana Kerajaan No 1523"
  SIA_royal_palace_bureau_directive_no_1523_desc: "Dengan melonjaknya nasionalisme di negara tersebut, bahkan kerajaan pun keluar untuk mendukung pemerintah, meminta setiap anggota Istana Kerajaan untuk menyumbangkan 10% dari pendapatan mereka untuk membeli persenjataan terbaru."
  SIA_end_factionalism: "Akhiri Faksionalisme"
  SIA_end_factionalism_desc: "Perpecahan antara sayap militer dan sipil Khana Ratsadon telah membayangi setiap keputusan sejak revolusi. Jika kita bisa menjaga kedua faksi tersebut tetap berada di belakang pemerintah dalam waktu yang cukup lama, kita akhirnya bisa menggabungkan mereka menjadi satu Partai Rakyat yang bersatu dan menghilangkan momok kudeta untuk selama-lamanya."
  SIA_end_factionalism_available_tt: "Baik §YSayap Sipil§! maupun §YSayap Militer§! telah berada di §GDukungan Penuh§! selama §Y270§! hari berturut-turut."
  SIA_end_factionalism_tt: "Persaingan faksi dalam Khana Ratsadon dikuburkan:\nSayap §YSipil§! dan §YMiliter§! dibubarkan menjadi §GPartai Rakyat Bersatu§!\nDapatkan semangat §Y$idea_SIA_unified_khana_ratsadon$§!"
  SIA_turn_off_the_khana_ratsadon: "Khana Ratsadon dinonaktifkan"
  SIA_factionalism_overcome: "Faksionalisme teratasi"
  SIA_new_territories_administration: "Administrasi Wilayah Baru"
  SIA_new_territories_administration_tt: "Membuka keputusan untuk mengelola wilayah §YIndochina§!, memberikan peningkatan kepatuhan, industri, dan benteng."
  SIA_new_territories_administration_desc: "Merebut kembali wilayah kita yang hilang hanyalah permulaan. Kita harus menunjukkan kepada mereka yang tinggal di sana bahwa kita adalah pilihan yang lebih baik. Sebuah program komprehensif akan dilaksanakan untuk meningkatkan standar hidup semua orang, memastikan bahwa setiap warga negara merasa setara dalam [ROOT.GetName] baru yang lebih besar ini."
  SIA_new_territories_administration_available_trigger: "Setiap Negara Bagian di §YIndochina§!\nDikendalikan Oleh §Y[ROOT.GetName]§!"
  SIA_industrialization_drive: "Penggerak Industrialisasi"
  SIA_industrialization_drive_desc: "Secara turun temurun, kekayaan [ROOT.GetName] bertumpu pada sawah dan pedesaan. Namun dunia modern tidak dibentuk oleh bajak, melainkan oleh pabrik dan mesin. Jika kita ingin mempertahankan kemerdekaan kita di antara negara-negara besar, kita harus mengubah kerajaan agraris kita menjadi negara industri."
  SIA_industrialization_drive_trigger: "§YKhana Ratsadon§! aktif"
  SIA_asian_financial_compact: "Perjanjian Keuangan Asia"
  SIA_asian_financial_compact_desc: "Modal Eropa masih mendominasi sebagian besar perdagangan Asia, sehingga perekonomian kita terkena tekanan asing. Dengan mengupayakan perjanjian keuangan yang lebih dekat dengan negara-negara tetangga, kita dapat memperluas akses terhadap kredit, pasar, dan investasi tanpa mengorbankan kemerdekaan kita."
  SIA_revision_of_unequal_treaties: "Revisi Perjanjian yang Tidak Setara"
  SIA_revision_of_unequal_treaties_desc: "Perjanjian-perjanjian lama yang ditandatangani karena kelemahan masih memberikan keistimewaan bagi kepentingan asing yang tidak boleh ditoleransi oleh negara modern mana pun. Kita harus merevisi perjanjian yang tidak setara ini dan memulihkan otoritas penuh [ROOT.GetNameDef] atas perdagangan, pengadilan, dan konsesinya."
  SIA_renegotiate_teak_control: "Negosiasi ulang Pengendalian Jati"
  SIA_renegotiate_teak_control_desc: "Hutan di wilayah utara kita memperkaya pemegang konsesi, namun hanya sedikit yang memberikan hasil kepada negara. Dengan menegosiasikan kembali penguasaan jati, kita dapat memperoleh kembali pendapatan, mengatur ekstraksi dan memastikan kayu Siam bermanfaat bagi pembangunan Siam."
  SIA_a_fledgling_tobacco_industry: "Industri Tembakau yang Masih Baru"
  SIA_a_fledgling_tobacco_industry_desc: "Tembakau masih merupakan perdagangan kecil, tersebar dan tidak terorganisir dengan baik. Dengan perlindungan yang sederhana dan investasi yang hati-hati, tanaman kecil ini dapat menjadi sumber pendapatan cukai, pendapatan pedesaan, dan pekerjaan pabrik yang dapat diandalkan."
  SIA_a_fledgling_tobacco_industry_tt: "Berada di §Y$limited_exports$§! atau §Y$closed_economy$§! akan memberi kita tambahan §YPabrik Sipil§!"
  SIA_all_weather_roads: "Semua Jalan Cuaca"
  SIA_all_weather_roads_desc: "Terlalu banyak jalan yang rusak karena hujan, menyebabkan provinsi-provinsi terputus dari ibu kota dan pasar. Jaringan jalan segala cuaca akan mengikat kerajaan dan memungkinkan barang dan tentara bergerak di setiap musim."
  SIA_the_bank_of_siam: "Bank Siam"
  SIA_the_bank_of_siam_desc: "Pertumbuhan industri tidak bisa berjalan hanya karena adat istiadat dan kepentingan swasta. Bank nasional yang lebih kuat akan memberikan negara kendali yang lebih besar terhadap kredit, mata uang, dan sirkulasi modal."
  SIA_thai_rice_company: "Perusahaan Beras Thailand"
  SIA_thai_rice_company_desc: "Beras masih menjadi sumber kehidupan [ROOT.GetName], namun banyak perdagangannya yang terfragmentasi, spekulatif dan rentan terhadap tekanan asing. Perusahaan beras nasional akan memungkinkan negara untuk memandu ekspor, menstabilkan harga dan mengubah hasil panen padi kita menjadi fondasi yang lebih kokoh bagi kekuatan nasional."
  SIA_uk_japan_focus_tt: "Yang memungkinkan memilih antara [ENG.GetNameDef] dan [JAP.GetNameDef] dengan efek berikut:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
  SIA_japan_option_tt: "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
  SIA_send_bureaucrats_abroad: "Kirim Birokrat ke Luar Negeri"
  SIA_send_bureaucrats_abroad_desc: "Negara-negara lain telah membangun kementerian, sekolah, dan layanan teknis yang kita butuhkan saat ini. Dengan mengirimkan pejabat-pejabat yang menjanjikan ke luar negeri, kita dapat mengimpor pengalaman administratif tanpa harus mengimpor peraturan asing."
  SIA_baht_stabilization_act: "Undang-Undang Stabilisasi Baht"
  SIA_baht_stabilization_act_desc: "Perekonomian modern membutuhkan mata uang yang dipercaya oleh pedagang dan diterima oleh investor. Menstabilkan baht akan mengurangi ketidakpastian dalam perdagangan dan memberikan [ROOT.GetNameDef] pijakan yang lebih kuat di pasar internasional."
  SIA_siamese_development_cooperative: "Koperasi Pembangunan Siam"
  SIA_siamese_development_cooperative_desc: "Modal swasta bersikap hati-hati dan negara tidak bisa membangun semuanya sendirian. Koperasi pembangunan nasional akan memungkinkan para pejabat, pedagang dan pemilik tanah untuk mengumpulkan sumber daya untuk proyek-proyek yang melayani perekonomian bersama."
  SIA_boon_rawd_brewery: "Pabrik Bir Boon Rawd"
  SIA_boon_rawd_brewery_desc: "Industri pembuatan bir dalam negeri lebih dari sekedar masalah konsumsi. Perusahaan seperti Boon Rawd menunjukkan bahwa modal, mesin, dan manajemen Siam dapat menciptakan industri modern di tanah Siam."
  SIA_national_savings_bond: "Obligasi Tabungan Nasional"
  SIA_national_savings_bond_desc: "Kekayaan bangsa tidak boleh dibiarkan begitu saja di dalam kotak-kotak besi dan hiasan-hiasan sementara jalan-jalan dan pabrik-pabrik tidak dibangun. Obligasi tabungan nasional akan mengubah penghematan swasta menjadi investasi publik."
  SIA_national_savings_bond_tt: "Mendapatkan Semangat $SIA_national_savings_bond$, yang kekuatannya meningkat tergantung pada §YHukum Wajib Militer§! Anda. Semakin rendah undang-undang wajib militer Anda, semakin kuat dampak positifnya, sedangkan semakin tinggi undang-undang tersebut, semakin buruk dampaknya.\n\nPada §Y$disarmed_nation$§! keuntungan:"
  SIA_national_savings_bond_scraping_the_barrel: "Pada §Y$scraping_the_barrel$§! memperoleh:"
  SIA_national_savings_bond_volunteer_only: "Pada §Y$volunteer_only$§! memperoleh:"
  SIA_national_savings_bond_limited_conscription: "Pada §Y$limited_conscription$§! memperoleh:"
  SIA_national_savings_bond_extensive_conscription: "Pada §Y$extensive_conscription$§! memperoleh:"
  SIA_national_savings_bond_service_by_requirement: "Pada §Y$service_by_requirement$§! memperoleh:"
  SIA_national_savings_bond_all_adult_serve: "Pada §Y$all_adults_serve$§! memperoleh:"
  SIA_national_savings_bond_current: "Undang-undang mobilisasi kita saat ini akan memberi kita:"
  SIA_deficit_spending: "Pengeluaran Defisit"
  SIA_deficit_spending_desc: "Pembukuan ortodoks tidak akan membangun perekonomian modern pada waktunya untuk menghadapi dunia yang berbahaya. Negara harus bersedia mengeluarkan anggaran lebih besar dari pendapatan saat ini, menggunakan pekerjaan umum dan pengadaan barang dan jasa untuk mendorong pertumbuhan industri."
  SIA_deficit_spending_tt: "Setelah semangat habis, dapatkan:"
  SIA_acquire_light_tools: "Dapatkan Alat Ringan"
  SIA_acquire_light_tools_desc: "Sebelum kita dapat menghasilkan mesin yang hebat, pertama-tama kita harus menguasai peralatan industri yang sederhana. Impor peralatan ringan dan perlengkapan bengkel akan memungkinkan pabrik kecil dan bengkel berkembang biak di [ROOT.GetName]."
  SIA_railway_and_port_extensions: "Perluasan Kereta Api dan Pelabuhan"
  SIA_railway_and_port_extensions_desc: "Beras, kayu, dan timah tidak ada gunanya jika tidak mampu menjangkau pasar. Memperluas jalur kereta api dan memperluas pelabuhan kita akan menarik provinsi-provinsi tersebut ke dalam perdagangan nasional dan menghubungkan [ROOT.GetNameDef] dengan dunia yang lebih luas."
  SIA_mechanization_of_agriculture: "Mekanisasi Pertanian"
  SIA_mechanization_of_agriculture_desc: "Terlalu banyak tenaga kerja yang masih terikat pada budidaya tradisional, sehingga hanya menghasilkan sedikit surplus bagi industri. Dengan memperkenalkan peralatan dan mesin modern ke pedesaan, kita dapat meningkatkan produksi dan melepaskan tenaga kerja ke pabrik."
  SIA_irrigation: "Irigasi"
  SIA_irrigation_desc: "Nasib petani masih naik turun seiring dengan banjir dan kekeringan. Sistem irigasi yang lebih luas akan menstabilkan panen, memperluas lahan pertanian dan menjadikan pedesaan sebagai basis yang lebih kokoh bagi pembangunan nasional."
  SIA_siam_cement_group: "[ROOT.GetName] Grup Semen"
  SIA_siam_cement_group_desc: "Didirikan di bawah naungan kerajaan, Grup Semen [ROOT.GetName] berdiri sebagai salah satu perusahaan industri paling signifikan di [ROOT.GetNameDef]. Dengan investasi yang ditargetkan dan dukungan pemerintah, perusahaan ini dapat bertransformasi dari pemasok dalam negeri menjadi landasan bagi kapasitas industri kami yang lebih luas – meletakkan fondasi bagi masa depan bangsa."
  SIA_chemical_imports: "Impor Bahan Kimia"
  SIA_chemical_imports_desc: "Pertanian dan industri modern sama-sama bergantung pada senyawa yang belum kita produksi dalam jumlah yang cukup. Impor bahan kimia akan memasok pupuk, obat-obatan, pewarna dan bahan peledak hingga industri dalam negeri dapat melakukan tugas tersebut."
  SIA_chemical_imports_tt: "Tambahkan §G+1§! offmap §YPabrik Sipil§! jika opini berada di atas §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! ketika fokus ini selesai."
  INS_chemical_imports_stolen_tt: "Tambahkan §G[?var:ROOT.INS_guns_from_seek_help_focus]§! unit Perlengkapan Infanteri jika opini di atas §Y75§! saat fokus ini diselesaikan."
  SIA_foreign_currency_exchange: "Penukaran Mata Uang Asing"
  SIA_foreign_currency_exchange_desc: "Industrialisasi memerlukan mesin, obat-obatan dan bahan bakar dari luar negeri, namun semua itu hanya dapat dibeli dengan nilai tukar yang terbatas. Sistem pertukaran mata uang yang terkendali akan mengarahkan dana asing ke industri-industri yang paling penting bagi negara."
  SIA_farmers_into_the_city: "Petani ke Kota"
  SIA_farmers_into_the_city_desc: "Perekonomian modern tidak dapat ditopang oleh tenaga kerja desa saja. Seiring dengan berkembangnya industri, negara harus mendorong migrasi yang teratur dari sawah ke kota, sehingga angkatan kerja perkotaan yang baru dapat terbentuk."
  SIA_textile_mills: "Pabrik Tekstil"
  SIA_textile_mills_desc: "Kain merupakan kebutuhan sehari-hari, namun banyak pula yang ditenun ke luar negeri dan dijual kembali kepada kami. Pabrik tekstil akan menggantikan barang impor, mempekerjakan tenaga kerja perkotaan dan menjadikan [ROOT.GetNameDef] salah satu industri dasar kehidupan modern."
  SIA_public_credit: "Kredit Publik"
  SIA_public_credit_desc: "Pedagang, petani, dan produsen sama-sama terkendala oleh terbatasnya akses terhadap modal. Dengan memperluas kredit publik, pemerintah dapat memberikan pinjaman ketika pembiayaan swasta ragu-ragu dan mendorong pembangunan ke sektor-sektor yang terabaikan."
  SIA_public_credit_trigger: "$idea_SIA_public_credit_debt$ telah aktif setidaknya selama §Y180 hari§!"
  SIA_a_modern_economy: "Perekonomian Modern"
  SIA_a_modern_economy_desc: "Tatanan agraria yang lama tidak hilang dalam sehari, namun tidak dapat lagi menentukan masa depan [ROOT.GetNameDef]. Dengan terbentuknya bank, sekolah, pabrik, dan infrastruktur, kita mulai membangun perekonomian yang layak untuk menjadi negara modern yang mandiri."
  SIA_reduction_of_agricultural_yield_taxes: "Pengurangan Pajak Hasil Pertanian"
  SIA_reduction_of_agricultural_yield_taxes_tt: "Mengurangi §YBarang Konsumsi§! dari $idea_SIA_agricultural_tax_reduction$ sebesar §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! setiap bulan, dan meningkatkan §YStabilitas§! sebesar §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! setiap bulan, hingga §YKonsumen Barang§! malus mencapai §Y0%§!\n\nBila semangat dihilangkan memperoleh :"
  SIA_reduction_of_agricultural_yield_taxes_desc: "Kaum tani tidak bisa diminta untuk memberi makan kerajaan, membiayai negara, dan menanggung setiap kesulitan tanpa bantuan. Dengan mengurangi pajak atas hasil pertanian, kita menyisakan lebih banyak surplus di pedesaan, memperkuat loyalitas di antara para petani dan mendorong produksi yang lebih besar dari lahan tersebut."
  SIA_fuel_oil_act: "UU Bahan Bakar Minyak"
  SIA_fuel_oil_act_desc: "Transportasi modern, industri dan pertahanan semuanya bergantung pada bahan bakar, namun akses terhadap bahan bakar mungkin terhambat karena perang. Undang-undang bahan bakar minyak akan menempatkan konsumsi, penyimpanan dan alokasi darurat di bawah pengawasan negara yang lebih ketat sehingga pasokan yang langka tidak terbuang percuma."
  SIA_siam_electricity_company: "Perusahaan Listrik Siam"
  SIA_siam_electricity_company_desc: "Tidak ada perekonomian yang dapat bertahan menghadapi tekanan modern tanpa pasokan listrik yang dapat diandalkan. Dengan memperkuat Siam Electricity Company, kita dapat memperluas pembangkitan listrik, meningkatkan koordinasi dan memastikan bahwa bengkel, depo, dan kota tetap mendapat pasokan listrik bahkan dalam kondisi sulit sekalipun."
  SIA_revise_the_taxation_system: "Revisi Sistem Perpajakan"
  SIA_revise_the_taxation_system_desc: "Struktur pajak yang ada saat ini tidak cukup membantu negara dalam mempersiapkan diri menghadapi kesulitan dan kemandirian. Sistem yang direvisi akan mengumpulkan pendapatan secara lebih merata, mengurangi limbah, dan mengarahkan beban pertahanan dan pembangunan nasional dengan lebih disiplin."
  SIA_census_the_hill_tribes: "Sensus Suku Perbukitan"
  SIA_census_the_hill_tribes_desc: "Daerah dataran tinggi masih berada di luar jangkauan administrasi, perpajakan dan pasokan. Sensus yang tepat akan memberikan pemerintah pengetahuan yang dibutuhkan untuk mengatur daerah-daerah tersebut secara lebih efektif dan menarik masyarakat serta sumber daya mereka ke dalam kehidupan bangsa yang lebih luas."
  SIA_increase_rice_exports: "Meningkatkan Ekspor Beras"
  SIA_increase_rice_exports_desc: "Beras adalah sumber pendapatan asing yang paling pasti bagi [ROOT.GetNameDef]. Dengan memperluas ekspor sementara pasar tetap terbuka, kita dapat membangun cadangan, membiayai impor strategis, dan mempersiapkan keuangan untuk menghadapi gangguan yang mungkin terjadi."
  SIA_pad_thai: "Pad Thailand"
  SIA_pad_thai_desc: "Sebuah negara modern tidak hanya ditopang oleh kementerian dan pabrik, namun juga oleh kebiasaan-kebiasaan umum yang menyatukan masyarakatnya. Dengan mempromosikan hidangan nasi nasional yang terbuat dari bahan-bahan Siam, kami mendorong konsumsi dalam negeri, mendukung petani, dan mengurangi ketergantungan pada makanan asing di masa yang tidak menentu."
  SIA_rice_husk_steam_turbines: "Turbin Uap Sekam Padi"
  SIA_rice_husk_steam_turbines_desc: "Apa yang orang asing lihat sebagai sampah, kebutuhan mengajarkan kita untuk menghargainya. Dengan membakar sekam padi untuk menghasilkan uap, kita dapat memperoleh listrik dari hasil panen kita sendiri dan mengurangi ketergantungan kita pada batubara dan minyak impor."
  SIA_domestic_tin_smelters: "Pabrik Peleburan Timah Domestik"
  SIA_domestic_tin_smelters_desc: "Tidak lagi cukup hanya menggali bijih dari dalam tanah dan mengirimkannya ke luar negeri. Dengan membangun pabrik peleburan timah dalam negeri, kami mempertahankan lebih banyak nilai sumber daya kami di dalam negeri dan mengamankan logam industri yang penting bagi perdagangan dan perang."
  SIA_use_ships_as_generators: "Gunakan Kapal sebagai Generator"
  SIA_use_ships_as_generators_tt: "Menempatkan §YKapal Modal§! milik kami di §YPelabuhan Inti Negara§! akan memberi kami bonus §G-2%§! untuk Konsumsi Energi Pabrik per §YKapal Modal§!, hingga total §G-15%§!.\n\nKapal-kapal yang meninggalkan pelabuhan akan mengurangi bonus sebanyak itu, dan dapat diperoleh kembali dengan menempatkan kapal-kapal di pelabuhan sekali lagi."
  SIA_use_ships_as_generators_desc: "Bahkan kapal-kapal yang lebih tua pun masih dapat melayani negara ketika sudah tidak layak lagi untuk berperang atau berdagang. Dengan menambatkan kapal sebagai pembangkit listrik terapung, kita dapat menyediakan listrik darurat ke pelabuhan dan industri pesisir sekaligus menghemat bahan bakar dan infrastruktur yang berharga."
  SIA_diversity_foreign_reserves: "Diversifikasi Cadangan Devisa"
  SIA_diversity_foreign_reserves_desc: "Berbahaya bagi [ROOT.GetNameDef] untuk menempatkan keamanan keuangannya pada mata uang atau kredit suatu negara asing. Dengan melakukan diversifikasi cadangan devisa, kita mengurangi risiko guncangan eksternal dan menjaga kebebasan bertindak dalam perdagangan dan diplomasi."
  SIA_diversity_foreign_reserves_tt: "Tambahkan §G2§! offmap §YPabrik Militer§! saat akan berperang.\nTambahkan Produksi §G8§! Baja dalam kondisi inti acak saat akan berperang."
  SIA_exclusivity_resource_contract: "Kontrak Sumber Daya Eksklusivitas"
  SIA_exclusivity_resource_contract_desc: "Satu mitra asing menawarkan modal dan jaminan pembelian sebagai imbalan atas akses istimewa terhadap sumber daya kami. Kontrak eksklusif semacam itu mungkin mempercepat pembangunan, meski mengikat satu bagian dari masa depan [ROOT.GetNameDef] dengan selera negara lain."
  SIA_maintain_resource_independence: "Pertahankan Kemandirian Sumber Daya"
  SIA_maintain_resource_independence_desc: "Kontrak luar negeri mungkin mendatangkan keuntungan cepat, namun ketergantungan akan menyusul. Dengan mempertahankan kendali atas sumber daya yang kita miliki, kita mempunyai kebebasan untuk mengarahkan sumber daya tersebut sesuai dengan kebutuhan Siam dan bukan berdasarkan permintaan luar negeri."
  SIA_kasetsart_university: "Universitas Kasetsart"
  SIA_kasetsart_university_desc: "Jika pertanian ingin menjadi lebih produktif, pertanian harus berpedoman pada ilmu pengetahuan dan bukan warisan semata. Universitas Kasetsart akan melatih ahli agronomi, dokter hewan, dan ahli teknis untuk modernisasi lahan."
  SIA_mahidol_university: "Universitas Mahidol"
  SIA_mahidol_university_desc: "Negara modern membutuhkan dokter, peneliti, dan administrator, sama seperti negara modern membutuhkan tentara dan insinyur. Universitas Mahidol akan memperkuat pendidikan tinggi dan menyediakan pemikiran terlatih yang diperlukan untuk reformasi nasional."
  SIA_silpakorn_university: "Universitas Silpakorn"
  SIA_silpakorn_university_desc: "TODO_CM"
  SIA_contingency_funds: "Dana Darurat"
  SIA_contingency_funds_desc: "Kemakmuran dalam perdamaian tidak akan berarti apa-apa jika negara memasuki krisis tanpa persiapan. Dengan menyisihkan dana darurat sekarang, kami memastikan bahwa blokade, kegagalan panen, atau perang mendadak tidak akan serta merta menghentikan jalannya pemerintahan."
  SIA_contingency_funds_tt: "Kami akan mengumpulkan dana darurat selama masa damai. Saat mengumpulkan dana ini, kita akan memperoleh §Yfaktor barang konsumsi§!.\n\nSelama perang, kita dapat mengeluarkan dana ini sesuai keinginan kita, sehingga memperoleh bonus produksi yang besar.\nBerapa lama dana tersebut bertahan bergantung pada berapa lama kita mengumpulkan dana tersebut sebelum melepaskannya."
  SIA_prepare_for_the_next_blockade: "Bersiaplah untuk Blokade Berikutnya"
  SIA_prepare_for_the_next_blockade_desc: "Jika laut menjadi tidak bersahabat, [ROOT.GetNameDef] mungkin akan terputus dari pasar, mesin, dan bahan bakar. Oleh karena itu, kita harus bersiap sekarang untuk blokade berikutnya, membangun persediaan, rencana darurat dan penggantinya sebelum kebutuhan memaksa kita."
  SIA_domestic_arms_industry: "Industri Senjata Dalam Negeri"
  SIA_domestic_arms_industry_desc: "Sebuah kerajaan yang harus mengimpor setiap senapan dan peluru tidak bisa menyebut dirinya aman. Betapapun sederhananya permulaannya, industri senjata dalam negeri akan mengizinkan [ROOT.GetNameDef] mempersenjatai tentaranya dari bengkelnya sendiri dan bertahan ketika pasokan dari luar negeri habis."
  SIA_war_material_substitutions: "Pergantian Materi Perang"
  SIA_war_material_substitutions_desc: "Pada saat blokade, material yang sempurna menjadi kurang berharga dibandingkan material yang tersedia. Kita harus mempelajari pengganti logam, bahan kimia, dan komponen impor sehingga produksi dapat terus berlanjut bahkan ketika barang asing tidak lagi sampai ke negara kita."
  SIA_royal_thai_ordnance_factory: "Pabrik Persenjataan Kerajaan Thailand"
  SIA_royal_thai_ordnance_factory_desc: "Negara yang aman memerlukan lebih dari sekadar senjata impor dan bengkel-bengkel yang tersebar. Pabrik Persenjataan Kerajaan Thailand akan memusatkan keterampilan, mesin, dan pengawasan di bawah mahkota, memberikan [ROOT.GetNameDef] pusat permanen untuk pembuatan senjata dan amunisi."
  SIA_built_to_withstand_every_flame: "Dibangun untuk Menahan Setiap Nyala Api"
  SIA_built_to_withstand_every_flame_desc: "Pabrik yang terbakar dalam satu malam tidak bisa melayani negara di pagi hari. Gudang, pabrik, dan bengkel kita harus dibangun dengan mempertimbangkan penyebaran, ketahanan api, dan perlindungan darurat sehingga sabotase, pemboman, atau kecelakaan tidak dapat dengan mudah melumpuhkan produksi."
  SIA_the_army_of_siam: "Tentara Siam"
  SIA_the_army_of_siam_desc: "Struktur angkatan bersenjata kita yang lama tidak lagi menjawab tuntutan zaman. Jika [ROOT.GetName] ingin mempertahankan kedaulatannya dan menegaskan kepentingannya di luar negeri, kita harus membangun tentara modern baru, dilengkapi, dilatih dan diorganisir untuk perang yang sedang terjadi di seluruh dunia."
  SIA_plan_for_a_short_war: "Rencanakan Perang Singkat"
  SIA_plan_for_a_short_war_desc: "Sumber daya kita terbatas dan musuh kita mungkin banyak. [ROOT.GetNameDefCap] tidak mampu melakukan kontes gesekan yang panjang. Jika perang terjadi, perang harus dilakukan dengan cepat, tegas, dan diselesaikan sebelum musuh dapat mengumpulkan kekuatan."
  SIA_plan_for_a_short_war_tt: "Pertama kali §Y[SIA.GetName]§! menyerang keuntungan negara lain"
  SIA_plan_for_a_short_war_tt2: "selama §Y90 hari§!.\n\nSetelah semangat ini habis, dapatkan:"
  SIA_plan_for_a_short_war_tt3: "selama §Y90 hari§!"
  SIA_intermediate_war_preparation: "Persiapan Perang Menengah"
  SIA_intermediate_war_preparation_desc: "Berbahaya jika hanya melakukan persiapan untuk kampanye kilat, namun sia-sia jika mengorganisir seluruhnya untuk perjuangan tanpa akhir. Doktrin yang seimbang akan memungkinkan [ROOT.GetName] menyerang dengan penuh semangat sambil mempertahankan daya tahan yang dibutuhkan untuk menghadapi musuh yang lebih keras kepala."
  SIA_prepare_for_a_long_war: "Bersiaplah untuk Perang Panjang"
  SIA_prepare_for_a_long_war_desc: "Negara-negara besar mungkin memutuskan perang dalam hitungan bulan, namun negara-negara kecil sering kali terpaksa menanggungnya selama bertahun-tahun. Oleh karena itu kita harus mempersiapkan [ROOT.GetAdjective] persenjataan, industri dan transportasi untuk menghadapi konflik berkepanjangan yang mana kesabaran dan ketahanan lebih penting daripada keberanian."
  SIA_specialized_warfare: "Peperangan Khusus"
  SIA_specialized_warfare_desc: "Medan di wilayah kami tidak mendukung tentara yang seragam. Pegunungan, hutan, dan sungai masing-masing menuntut keterampilan yang berbeda. Dengan mengembangkan pasukan khusus, kami dapat memastikan bahwa [ROOT.GetNameDef] menghadapi musuh dengan kekuatan yang tepat di segala bidang."
  SIA_artillery_reigns_supreme: "Artileri Berkuasa Tertinggi"
  SIA_artillery_reigns_supreme_desc: "Pertarungan modern tidak dimenangkan hanya dengan semangat. Senjata tetap menjadi raja di medan perang, menghancurkan benteng, menghancurkan serangan, dan membuka jalan bagi infanteri kita. Jika kita ingin menang, daya tembak [ROOT.GetAdjective] harus dibuat banyak dan tepat."
  SIA_yield_the_air_war: "Hasilkan Perang Udara"
  SIA_yield_the_air_war_desc: "Kita tidak bisa berharap untuk menantang kekuatan-kekuatan besar di angkasa secara setara. Daripada menyia-nyiakan sumber daya yang berharga dalam kontes yang kemungkinan besar tidak akan kita menangkan, kita akan memperkuat pertahanan anti-udara kita dan melarang pesawat musuh untuk menyerang pasukan dan kota kita tanpa biaya apapun."
  SIA_camouflage: "Kamuflase"
  SIA_camouflage_desc: "Jika kita tidak bisa menguasai langit, kita akan menolak serangan apa pun yang layak dilakukan musuh di bawahnya. Jaring, penyebaran, dan disiplin pergerakan di malam hari akan menyembunyikan pasukan kita dari pandangan di atas, dan penembak yang kita latih di samping mereka akan membuat setiap operan menjadi mahal."
  SIA_the_thunder_at_the_gates: "Guntur di Gerbang"
  SIA_the_thunder_at_the_gates_desc: "Ada benteng yang tidak bisa dihancurkan oleh senjata biasa dan serangan harus diumumkan dengan kekuatan yang luar biasa. Artileri berat, senjata pengepungan, dan kereta api akan memberi [ROOT.GetNameDef] kekuatan untuk mendobrak gerbang musuh mana pun yang menganggap pengekangan kita sebagai kelemahan."
  SIA_night_time_training: "Pelatihan Malam Hari"
  SIA_night_time_training_desc: "Serangan yang berani di siang hari bolong mengundang bencana bagi musuh yang telah bersiap. Dengan melatih orang-orang kita untuk melakukan infiltrasi, bergerak dan menyerang dalam kegelapan, kita dapat mengambil inisiatif ketika musuh buta, bingung dan tidak siap untuk menjawab kita."
  SIA_steel_arteries: "Arteri Baja"
  SIA_steel_arteries_desc: "Tidak ada tentara yang bergerak jauh tanpa rel dan jalan yang menopangnya. Arteri baja negara ini harus diperkuat sehingga pasukan, perbekalan, dan senjata dapat diangkut dengan cepat ke setiap perbatasan yang terancam. Dalam upaya ini, keamanan militer dan pembangunan nasional berjalan beriringan."
  SIA_prepare_northern_infrastructure_for_war: "Mempersiapkan Infrastruktur Utara untuk Perang"
  SIA_prepare_northern_infrastructure_for_war_desc: "Pendekatan di wilayah utara akan menjadi hal yang penting dalam setiap persaingan dengan Burma dan pihak-pihak yang mendukungnya. Jalan raya, rel kereta api dan depo di wilayah tersebut harus segera diperluas, sehingga pasukan [ROOT.GetAdjective] dapat maju atau melawan di sana tanpa penundaan."
  SIA_unconventional_tank_construction: "Konstruksi Tangki Tidak Konvensional"
  SIA_unconventional_tank_construction_desc: "Kita tidak bisa meniru program-program negara-negara besar satu per satu. Jika [ROOT.GetNameDef] ingin menggunakan tank, kita harus menggunakan metode konstruksi yang lebih murah dan lebih mudah beradaptasi, mengorbankan kemegahan demi jumlah dan kegunaan."
  SIA_conventional_tank_construction: "Konstruksi Tangki Konvensional"
  SIA_conventional_tank_construction_desc: "Armor telah menjadi alat perang modern yang diterima, dan solusi darurat hanya akan membawa kita sejauh ini. Oleh karena itu, kita harus membangun industri tank yang tepat berdasarkan prinsip-prinsip yang baik, desain standar, dan metode produksi yang andal yang layak untuk dimiliki oleh tentara modern."
  SIA_reverse_engineer_allied_tanks: "Tank Sekutu Insinyur Terbalik"
  SIA_reverse_engineer_allied_tanks_desc: "Yang lain sudah menanggung biaya eksperimen. Tank-tank yang direbut dan mesin-mesin impor dapat dipisahkan, dipelajari dan ditiru. Dengan belajar dari desain asing, [ROOT.GetName] dapat memperpendek jalur menuju kekuatan lapis bajanya sendiri."
  SIA_tankettes: "tanket"
  SIA_tankettes_desc: "Ringan, murah, dan mudah diproduksi, tanket mungkin tidak dapat menentukan sendiri pertempuran besar, namun tanket masih dapat melayani pengintaian, peperangan kolonial, dan dukungan infanteri. Bagi negara yang ekonominya sederhana, kendaraan lapis baja kecil seperti itu menawarkan jalan masuk praktis ke dalam perang mekanis."
  SIA_jungle_armor: "Pelindung Hutan"
  SIA_jungle_armor_desc: "Hutan di wilayah kami bukanlah tempat bagi mesin berat yang dirancang untuk dataran Eropa. Jika baju besi akan dipakai pada [ROOT.GetNameDef], maka baju besi tersebut harus disesuaikan untuk jalur yang sempit, tanah yang buruk dan iklim yang buruk, menukar beban dengan mobilitas dimana hutan menuntutnya."
  SIA_mountain_tanks: "Tank Gunung"
  SIA_mountain_tanks_desc: "Perbukitan terjal dan jalur pegunungan tidak bisa diserahkan begitu saja kepada infanteri saja. Dengan menggunakan kendaraan lapis baja kompak yang cocok untuk medan yang rusak, kita dapat memberikan pasukan kita sarana untuk membawa senjata yang dilindungi ke wilayah di mana tank biasa tidak akan mampu bertahan."
  SIA_reluctant_submission: "Penyerahan yang enggan"
  SIA_reluctant_submission_desc: "Jika [ROOT.GetNameDef] menghadapi invasi dari musuh yang lebih kuat, mungkin akan tiba saatnya perlawanan terbuka hanya menjanjikan kehancuran. Membungkuk memang pahit, namun terkadang pemerintah harus menyerah untuk menjaga negaranya dari kehancuran dan menunggu saat yang lebih baik."
  SIA_reluctant_submission_trigger: "Fokus ini akan otomatis selesai jika kita diserang dan memilih opsi §YSubmission§! di event tersebut."
  SIA_reluctant_submission_tt: "Kita akan mampu mendamaikan negara besar yang menyerang. Namun mereka mengharapkan kita mencetak uang untuk mereka.\n§YFaktor Pabrik Barang Konsumsi§! kami akan meningkat sebesar §Y[?idea_SIA_printing_money_monthly_change|%]§! setiap bulannya, hingga maksimum §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nMengambil fokus §Y$SIA_thai_rice_company$§! akan mengurangi tingkat kenaikan sebesar §G50%§!\n\nMengambil fokus §Y$SIA_demand_repatriation$§! akan menghilangkan kebutuhan untuk mencetak uang."
  SIA_seri_thai: "Seri Thailand"
  SIA_seri_thai_desc: "Ketundukan tidak harus berarti penyerahan semangat kebangsaan. Di bawah permukaan pendudukan dan kepatuhan, kelompok bawah tanah yang setia dapat diorganisir untuk mempertahankan perjuangan kemerdekaan, mengumpulkan intelijen dan mempersiapkan hari ketika [ROOT.GetName] bangkit kembali."
  SIA_contact_the_south_east_asia_command: "Hubungi Komando Asia Tenggara"
  SIA_contact_the_south_east_asia_command_desc: "Jika perlawanan tidak hanya berarti tindakan berani, hal ini harus dikaitkan dengan strategi yang lebih luas. Dengan menjalin kontak dengan komando Sekutu di Asia Tenggara, para patriot [ROOT.GetName] dapat memperoleh bimbingan, perbekalan, dan tempat dalam perjuangan yang lebih besar."
  SIA_broadcast_weather_reports_to_the_allies: "Menyiarkan Laporan Cuaca kepada Sekutu"
  SIA_broadcast_weather_reports_to_the_allies_desc: "Langit dan lautan di kawasan ini dipengaruhi oleh cuaca dan juga oleh armada dan tentara. Laporan terpercaya dari [ROOT.GetNameDef] dapat membantu perencanaan Sekutu, melindungi operasi mereka dari kejutan dan menjadikan tanah air kita sebagai mitra yang diam namun berharga dalam perang mereka."
  SIA_american_investment_aid: "Bantuan Investasi Amerika"
  SIA_american_investment_aid_desc: "Amerika Serikat memiliki kekayaan melebihi apa pun yang tersedia di kawasan kita sendiri. Jika kita dapat memperoleh bantuan dan investasi Amerika untuk upaya klandestin dan nasional kita, [ROOT.GetNameDef] akan memperoleh materi untuk menanggung kesulitan dan bersiap untuk pembebasan."
  SIA_thai_students_in_the_oss: "Pelajar Thailand di OSS"
  SIA_thai_students_in_the_oss_desc: "Generasi baru pemuda patriotik dapat dilatih di luar negeri dalam seni spionase, sabotase, dan peperangan tidak teratur. Dengan mengirimkan pelajar Thailand yang terpercaya ke dalam intelijen Sekutu, kita akan mempersiapkan pelayan yang cakap untuk perang tersembunyi yang akan datang."
  SIA_prepare_to_drop: "Bersiaplah untuk Jatuh"
  SIA_prepare_to_drop_desc: "Ketika saat pembebasan tiba, Sekutu mungkin akan berusaha turun ke tanah air kita dari langit. Oleh karena itu kita harus mengidentifikasi lokasi pendaratan, mempersiapkan kontak dan mengatur jaringan dukungan sehingga pasukan lintas udara dapat diterima dan diarahkan ke tempat yang paling membutuhkan."
  SIA_unseat_the_government: "Gulingkan Pemerintah"
  SIA_unseat_the_government_desc: "Sebuah rezim yang telah mengikat [ROOT.GetNameDef] pada dominasi asing tidak dapat dibiarkan bertahan selamanya. Melalui perlawanan, intrik dan tindakan yang tepat waktu, kita dapat menyingkirkan mereka yang telah membahayakan negara ini dan memulihkan pemerintahan yang lebih layak bagi Siam."
  SIA_unseat_the_government_tt: "[ROOT.GetName] akan meninggalkan faksinya saat ini dan beralih pihak dalam perang, bergabung dengan §YSekutu§!.\n\nLoyalis akan bangkit melawan perubahan, memicu perang saudara.\n\nJika dukungan gabungan kami §Ylebih dari 80%§! kami akan menggulingkan pemerintah dan menghindari perang saudara. Dukungan total kami adalah §Y5%§! untuk setiap jenderal yang terpengaruh, selain dukungan demokratis kami.\n\nDukungan kami dari jenderal yang terpengaruh adalah §Y[?var:SIA_seri_thai_cw_scale|%]§! dan dukungan demokratis kami adalah §Y[?var:party_popularity@democratic|%]§!"
  SIA_choose_new_leader_tt: "Dengan runtuhnya rezim lama, pemenang harus memilih siapa yang akan memimpin pemerintahan baru."
  SIA_the_phayap_army: "Tentara Phayap"
  SIA_the_phayap_army_desc: "Jika kita melawan penjajah, maka pasukan kita harus diberi tempat dalam tatanan perang yang baru. Komando lapangan khusus untuk operasi di barat dan utara akan memungkinkan [ROOT.GetName] untuk maju bersama mitra kuatnya dan mengejar keuntungannya sendiri."
  SIA_securing_the_rubber_islands: "Mengamankan Pulau Karet"
  SIA_securing_the_rubber_islands_desc: "Karet adalah sumber kehidupan perang modern, memberi makan ban, segel, dan instrumen konflik mekanis yang tak terhitung jumlahnya. Wilayah yang kaya sumber daya di selatan kita menghadirkan peluang sekaligus kebutuhan. Kita harus bergerak untuk mengamankannya sebelum orang lain melakukannya."
  SIA_breaking_the_burmese_line: "Melanggar Garis Burma"
  SIA_breaking_the_burmese_line_desc: "Burma berdiri sebagai penghalang antara ambisi kami dan negara-negara lain. Jika senjata [ROOT.GetAdjective] ingin membuktikan kemampuannya, garis musuh di sana harus dipatahkan dengan tekad, perencanaan dan penggunaan kekuatan yang terkonsentrasi."
  SIA_pacific_war: "Perang Pasifik"
  SIA_pacific_war_desc: "Konflik di Asia Timur tidak bisa lagi dianggap remeh. Perang di Pasifik menentukan nasib semua negara di kawasan kita, dan [ROOT.GetNameDef] harus menentukan posisinya dalam perjuangan tersebut, apakah sebagai pengikut, mitra, atau korban."
  SIA_joint_asian_military_command: "Komando Militer Gabungan Asia"
  SIA_joint_asian_military_command_desc: "Upaya kami akan lebih kuat jika dikoordinasikan dengan mitra regional kami. Struktur komando gabungan menjanjikan efisiensi yang lebih besar, perencanaan yang lebih jelas, dan arah kampanye yang sama, yang jika tidak maka akan berisiko terbuang sia-sia karena persaingan dan kebingungan."
  SIA_demand_repatriation: "Permintaan Repatriasi"
  SIA_demand_repatriation_desc: "Mereka yang memasuki tanah kami dengan dalih kebutuhan telah berhutang kepada [ROOT.GetNameDef]. Ketika nasib kita membaik, kita harus menuntut pengembalian apa yang telah kita rampas dan menekan penjajah untuk membayar kembali kerugian yang ditimbulkan akibat gangguan tersebut."
  SIA_standing_our_ground: "Mempertahankan Posisi Kami"
  SIA_standing_our_ground_desc: "Ada saatnya ketika kemunduran dan negosiasi hanya memberikan penghinaan lebih lanjut. [ROOT.GetNameDefCap] harus menunjukkan bahwa mereka masih mempunyai kemauan untuk bertahan, melawan dan mengusir orang-orang yang menganggap mereka dapat menentukan nasib kita di bawah todongan senjata."
  SIA_standing_our_ground_trigger: "Fokus ini akan otomatis selesai jika kita diserang dan memilih opsi §YResistance§! di event tersebut."
  SIA_ask_for_the_release_of_american_commodities: "Minta Pelepasan Komoditas Amerika"
  SIA_ask_for_the_release_of_american_commodities_desc: "Toko-toko, mesin-mesin dan barang-barang Amerika mungkin menyediakan ruang bernapas yang dibutuhkan negara kita. Melalui diplomasi yang hati-hati kita dapat meminta pelepasan komoditas tersebut, mengurangi kekurangan dan memperkuat basis material dalam upaya perang kita."
  SIA_japanese_fighters: "Pejuang Jepang"
  SIA_japanese_fighters_desc: "Meskipun industri penerbangan kita sendiri masih kecil, pesawat asing dapat membantu mengisi kesenjangan tersebut. Pesawat tempur Jepang di tangan [ROOT.GetAdjective] setidaknya akan memberi kita kekuatan udara modern, meskipun hanya dalam batas yang ditentukan oleh kelemahan industri kita."
  SIA_get_off_our_shores: "Keluar dari Pantai Kami"
  SIA_get_off_our_shores_desc: "Kehadiran pasukan asing di tanah Siam merupakan penghinaan yang tidak bisa dilunakkan dengan alasan apa pun. Baik dengan kekuatan senjata atau karena tekanan dari peristiwa di luar negeri, kita harus mendesak agar penjajah meninggalkan wilayah kita dan mengembalikan martabat [ROOT.GetNameDef].\n\nMereka adalah pengecut, seperti semua orang kejam. Sekarang, pergilah dari pantai kami."
  SIA_singaporean_reinforcements: "Bala Bantuan Singapura"
  SIA_singaporean_reinforcements_desc: "Perjuangan di Malaya dan sekitarnya tidak dapat dipisahkan dari keamanan kita sendiri. Bala bantuan yang diperoleh dari kekuatan yang berkumpul di sekitar Singapura dapat memperketat garis pertahanan kita, memperluas kerja sama kita dengan Sekutu, dan menyatukan teater-teater tersebut berdasarkan tujuan yang sama."
  modify_SIA_directorate_of_aeronautical_engineering: "Memodifikasi §YDirektorat Teknik Penerbangan§! dengan:"
  SIA_aid_for_resources: "Bantuan Sumber Daya"
  SIA_aid_for_resources_desc: "Negara kita mempunyai sumber daya yang diinginkan oleh kekuatan asing dan tidak mempunyai alat tertentu yang dapat mereka sediakan. Pertukaran bantuan dengan material yang bijaksana akan membantu menjaga pasokan [ROOT.GetNameDef] sekaligus memastikan kekayaan kita berkontribusi pada pelestarian kita sendiri."
  SIA_aid_for_resources_tt: "Kami akan meminta [JAP.GetNameDef] untuk bergabung dalam perang kami, melawan mereka untuk mendapatkan hak sumber daya karet di §Y[724.GetName]§!"
  SIA_how_quickly_the_tables_turn: "Seberapa Cepat Tabel Berubah"
  SIA_how_quickly_the_tables_turn_desc: "Mereka yang pernah memperlakukan [ROOT.GetNameDef] sebagai orang yang lemah dan patuh mungkin akan mendapati keseimbangannya terbalik. Keberuntungan dalam perang berubah dengan cepat, dan kita harus siap memanfaatkan momen ketika para penindas kita melemah dan keadaan akhirnya berbalik melawan mereka."
  SIA_how_quickly_the_tables_turn_trigger: "Kami telah diserang oleh seorang mayor dan menyerah pada mayor tersebut."
  SIA_royal_thai_navy: "Angkatan Laut Kerajaan Thailand"
  SIA_royal_thai_navy_desc: "Pertahanan [ROOT.GetNameDef] tidak berakhir di garis pantai. Pesisir, sungai, dan perdagangan maritim kita memerlukan armada yang sesuai dengan kebutuhan kerajaan. Dengan memperkuat Angkatan Laut Kerajaan Thailand, kami akan memastikan bahwa Siam tetap menguasai perairannya sendiri."
  modify_royal_thai_navy: "Memodifikasi §Y$idea_SIA_thai_royal_navy$§! dengan:"
  SIA_direct_army_fundings_towards_the_navy: "Pendanaan Angkatan Darat Langsung ke Angkatan Laut"
  SIA_direct_army_fundings_towards_the_navy_desc: "Tentara telah lama menghabiskan sebagian besar pengeluaran militer, namun kebutuhan strategis [ROOT.GetNameDef] tidak hanya bersifat kontinental. Dengan mengalihkan dana ke sektor armada, kita dapat mulai memperbaiki ketidakseimbangan ini dan mengamankan lautan yang melindungi perdagangan dan pesisir kita."
  SIA_thonburi_class_coastal_defense_ship: "Kapal Pertahanan Pesisir Kelas Thonburi"
  SIA_thonburi_class_coastal_defense_ship_desc: "Armada yang sederhana mungkin masih memiliki gigi yang tajam jika dirancang dengan baik untuk kondisi lokal. Kelas Thonburi menawarkan [ROOT.GetNameDef] sarana praktis pertahanan pantai, menggabungkan daya tembak yang baik dengan peran yang sesuai dengan perairan yang paling perlu kita lindungi."
  SIA_acquire_submarines: "Dapatkan Kapal Selam"
  SIA_acquire_submarines_desc: "Kapal selam menawarkan angkatan laut kecil kesempatan untuk menyerang melebihi bobotnya. Tersembunyi di bawah gelombang, mereka dapat mengancam pelayaran, menghalangi armada yang lebih kuat, dan mempersulit rencana permusuhan terhadap pantai kita. [ROOT.GetNameDefCap] tidak boleh mengabaikan senjata seperti itu."
  SIA_submarine_day: "Hari Kapal Selam"
  SIA_submarine_day_desc: "Pengenalan peperangan bawah laut ke dalam armada kami patut mendapatkan pengakuan publik dan antusiasme nasional. Dengan merayakan angkatan laut, kita dapat mendorong rekrutmen, meningkatkan prestise, dan menanamkan gagasan di benak masyarakat bahwa Siam sedang memasuki era angkatan laut baru."
  SIA_the_thonburi_dockyard_project: "Proyek Galangan Kapal Thonburi"
  SIA_the_thonburi_dockyard_project_desc: "Angkatan laut tidak dapat ditopang oleh lambung kapal impor saja. Jika [ROOT.GetNameDef] ingin mempertahankan dan memperluas kekuatan maritimnya, maka mereka harus berinvestasi pada galangan kapal, bengkel kerja, dan tenaga kerja yang menjadi fondasi kekuatan laut yang sebenarnya."
  SIA_expand_the_slipways: "Perluas Slipways"
  SIA_expand_the_slipways_desc: "Fasilitas kami saat ini terlalu sempit untuk mewujudkan ambisi kami. Dengan memperbesar slipways, kami akan meningkatkan kapasitas kami untuk membangun dan memperbaiki kapal, sehingga armada dapat bertambah dalam ukuran dan kesiapan."
  SIA_a_new_drydock: "Drydock Baru"
  SIA_a_new_drydock_desc: "Pemeliharaan angkatan laut yang serius menuntut adanya dok kering yang modern. Tanpa hal ini, pemeliharaan kapal-kapal besar akan menjadi lambat, tidak efisien dan bergantung pada bantuan asing. Drydock baru akan memberikan [ROOT.GetNameDef] pegangan yang lebih kuat atas masa depan angkatan lautnya sendiri."
  SIA_install_heavy_cranes_and_power_plant: "Pasang Derek Berat dan Pembangkit Listrik"
  SIA_install_heavy_cranes_and_power_plant_desc: "Pembuatan kapal bukan hanya soal kayu dan baja, tapi soal mesin dan energi. Derek berat dan pasokan listrik yang andal akan mengubah pekarangan kita dari fasilitas sederhana menjadi instrumen industri modern yang layak."
  SIA_establish_the_foundry_and_machine_shop: "Mendirikan Pabrik Pengecoran dan Bengkel Mesin"
  SIA_establish_the_foundry_and_machine_shop_desc: "Angkatan Laut yang berdaulat membutuhkan lebih dari sekadar lambung kapal yang dirakit dari suku cadang impor. Dengan mendirikan pabrik pengecoran dan bengkel mesin kami sendiri, kami akan memperkuat urat-urat industri yang memungkinkan [ROOT.GetNameDef] untuk mencetak, membentuk, dan memperbaiki komponen-komponen penting kapal perang di dalam negeri."
  SIA_the_thonburi_arsenal: "Arsenal Thonburi"
  SIA_the_thonburi_arsenal_desc: "Galangan kapal tanpa persenjataan masih belum lengkap. Pendirian gudang senjata di Thonburi akan memungkinkan pembuatan dan penyimpanan senjata angkatan laut, amunisi dan peralatan terkait, sehingga mengikat armada kita lebih dekat dengan industri nasional."
  SIA_focus_on_commercial_civilian_ships: "Fokus pada Kapal Sipil Komersial"
  SIA_focus_on_commercial_civilian_ships_desc: "Tidak setiap lunas yang diletakkan harus dimaksudkan untuk berperang. Pedagang, angkutan dan kapal sipil lainnya membentuk sistem peredaran darah perekonomian nasional. Dengan mendorong pembuatan kapal komersial, [ROOT.GetNameDef] memperkuat kemakmuran dan ketahanan masa perang."
  SIA_empower_the_coastguard: "Berdayakan Penjaga Pantai"
  SIA_empower_the_coastguard_desc: "Armada tidak bisa berada di mana-mana sekaligus, dan banyak tugas keamanan pesisir lebih baik ditangani oleh layanan yang lebih ringan. Penjaga pantai yang diperkuat akan melindungi perikanan kita, mengawasi pantai kita dan membebaskan angkatan laut untuk menghadapi ancaman yang lebih besar."
  SIA_river_patrols: "Patroli Sungai"
  SIA_river_patrols_desc: "Sungai-sungai [ROOT.GetNameDef] merupakan jalan raya, perbatasan dan jalur kehidupan sekaligus. Kapal patroli di perairan ini akan membantu kita menegakkan ketertiban, mendukung garnisun lokal, dan memperluas jangkauan negara ke wilayah-wilayah di mana ibu kota yang jauh akan lambat dalam mengambil tindakan."
  SIA_sell_bangkok_dock_co: "Jual Bangkok Dock Co"
  SIA_sell_bangkok_dock_co_desc: "Modal swasta mungkin mencapai kinerja manajemen negara yang terlalu lambat. Dengan menjual Bangkok Dock Company ke tangan yang cakap, kita dapat menarik investasi, menstimulasi efisiensi, dan mengalihkan dana publik untuk kebutuhan militer yang lebih mendesak."
  SIA_a_race_against_time: "Perlombaan Melawan Waktu"
  SIA_a_race_against_time_desc: "Angkatan Laut kita sudah ketinggalan zaman, kekurangan dana, dan tidak siap menghadapi perang modern. Dana harus segera dialihkan untuk pembuatan kapal, perbaikan, pertahanan pantai, dan pelatihan angkatan laut. Jam berjalan lebih cepat dari galangan kapal kita."
  SIA_a_race_against_time_tt: "Setelah masa semangat kita akan memperoleh:"
  SIA_a_race_against_time_tt2: "selama §Y280§! hari"
