 SWE_folkhemmet_system_desc: "Ketika dunia semakin dekat dengan konflik global, Swedia dihadapkan pada pilihan apakah harus mempersenjatai kembali negaranya dengan mengorbankan sistem kesejahteraannya. atau tetap mempertahankannya namun berisiko tidak siap menghadapi konflik di masa depan."
