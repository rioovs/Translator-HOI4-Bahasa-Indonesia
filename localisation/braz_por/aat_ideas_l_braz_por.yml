 SWE_fascist_counter_revolution_0_desc: "Kita akhirnya berkuasa, namun masih ada desas-desus perbedaan pendapat dari kelompok totaliter sayap kanan. Apakah itu hanya bisikan-bisikan perbedaan pendapat yang akan memudar seperti gema, atau akankah berkembang menjadi suara gemuruh yang akan memicu longsoran salju?"
 SWE_fascist_counter_revolution_1: "Perbedaan Pendapat Tentara"
