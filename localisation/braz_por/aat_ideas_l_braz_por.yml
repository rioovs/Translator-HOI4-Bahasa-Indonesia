 SWE_full_capacity_furnaces: "Tungku berkapasitas penuh"
 SWE_full_capacity_furnaces_desc: "Setelah melakukan embargo terhadap musuh, kini kita mempunyai bahan mentah yang melimpah. Industri berat yang sebelumnya dibatasi oleh kuota sumber daya kini memiliki semua yang mereka perlukan untuk dapat bekerja siang dan malam. Meskipun demikian, persediaan kita dengan cepat terisi, dan kita harus memastikan bahwa pasar global mengetahui bahwa kita bersedia menyediakan sumber daya yang dibutuhkan untuk mencapai kondisi yang lebih baik."
