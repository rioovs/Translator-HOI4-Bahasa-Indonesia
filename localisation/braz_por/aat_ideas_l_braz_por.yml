 FIN_finnish_army: "Tentara Finlandia"
 FIN_finnish_army_desc: "Sebagai produk warisan yang membanggakan dan mandiri, Angkatan Darat Finlandia berdiri sebagai kekuatan yang tangguh, diperkuat oleh perjuangan bertahun-tahun melawan agresi luar. Dengan tekad yang kuat untuk mempertahankan tanah air mereka, para prajurit Finlandia adalah penembak jitu yang terampil dan pejuang yang tangguh, siap menghadapi musuh yang paling menakutkan sekalipun. Meskipun sumber dayanya terbatas, Angkatan Darat Finlandia mewakili semangat yang ulet dan pantang menyerah yang tidak akan mudah dipatahkan."
 FIN_finnish_navy: "Angkatan Laut Finlandia"
 FIN_finnish_navy_desc: "Angkatan Laut Finlandia adalah kekuatan kecil namun bangga yang siap mempertahankan tanah airnya dari segala ancaman. Dengan fokusnya pada pertahanan pesisir dan perlindungan jalur laut, Angkatan Laut Finlandia merupakan simbol kemerdekaan Finlandia dan elemen kunci dalam strategi pertahanan negara secara keseluruhan. Meskipun mungkin menghadapi rintangan besar, para pelaut Angkatan Laut Finlandia bertekad untuk berperang dengan segenap keberanian dan kegigihan rekan-rekan mereka di darat."
 FIN_finnish_airforce: "Angkatan Udara Finlandia"
 FIN_finnish_airforce_desc: "Meskipun ukurannya kecil dan sumber dayanya terbatas, Angkatan Udara Finlandia memiliki kader pilot terampil dan perancang inovatif, yang telah mengasah keahlian mereka melalui eksperimen dan improvisasi selama bertahun-tahun. Melalui tekad dan kemauan untuk beradaptasi dengan perubahan keadaan, Angkatan Udara Finlandia telah mengembangkan reputasi sebagai kekuatan yang patut diperhitungkan, yang akan mempertahankan tanah airnya dengan segenap keberanian dan kegigihan pasukan daratnya."
 FIN_national_industry_expand: "$BUL_national_industry_01$"
 FIN_national_industry_expand_desc: "$SWI_expand_arms_industry_desc$"
 FIN_sami_pathfinders: "Penemu Jalan Sami"
 FIN_sami_pathfinders_desc: "Pelacak ahli dan pemandu hutan belantara, Sámi mampu menavigasi medan terjal di utara Finlandia dengan mudah dan memberikan intelijen penting kepada pasukan Finlandia.\nBaik dalam panasnya pertempuran atau di kedalaman hutan yang sunyi, pencari jalan Sámi kini menjadi aset utama Angkatan Darat Finlandia dan simbol abadi dari warisan kebanggaan negara tersebut."
 FIN_fortification_effort: "Upaya Fortifikasi"
 FIN_fortification_effort_desc: "$FIN_defense_in_depth_desc$"
 FIN_coastal_batteries_effort: "Upaya Baterai Pesisir"
 FIN_coastal_batteries_effort_desc: "$FIN_coastal_defense_desc$"
 FIN_mannerheim_line_expansion_modifier: "Perluasan Jalur Mannerheim"
 FIN_mannerheim_line_expansion_modifier_desc: "Dengan memperkuat dan memperluas Garis Mannerheim, kami akan mengirimkan pesan yang jelas bahwa Finlandia tidak akan dianggap enteng, dan bahwa Finlandia siap mempertahankan kemerdekaannya dengan segala cara yang dimilikinya."
 FIN_bank_of_aland_ns: "$FIN_bank_of_aland$"
 FIN_bank_of_aland_ns_desc: "$FIN_bank_of_aland_desc$"
 FIN_infrastructure_effort: "Upaya Infrastruktur"
 FIN_infrastructure_effort_desc: "$FIN_industrial_development_desc$"
 FIN_hydro_electric_expansion: "Ekspansi Hidro-Listrik"
 FIN_hydro_electric_expansion_desc: "Memanfaatkan sumber daya alam sungai yang melimpah di [ROOT.GetName], perluasan infrastruktur pembangkit listrik tenaga air kami sedang berlangsung. Berinvestasi dalam pembangunan pembangkit listrik tenaga air baru akan memberikan sarana untuk meningkatkan kapasitas industri secara drastis dan mendorong pertumbuhan negara kita."
 FIN_motti_tactics_modifier: "Taktik Motti"
 FIN_motti_tactics_modifier_desc: "Pasukan Finlandia menggunakan taktik Motti di negara bagian tersebut, mengepung dan mengisolasi unit musuh dengan tujuan melumpuhkan jalur logistik dan komunikasi mereka."
 FIN_weapon_caches_modifier: "Cache Senjata"
 FIN_weapon_caches_modifier_desc: "Setelah operasi militer rahasia, sejumlah besar senjata dan peralatan Angkatan Darat Finlandia telah disembunyikan di tempat persembunyian yang tersebar di seluruh negara bagian sehingga elemen Perlawanan Finlandia dapat melanjutkan perang melawan penjajah."
 FIN_public_opposition_to_the_winter_war: "Oposisi Publik terhadap Perang Musim Dingin"
 FIN_public_opposition_to_the_winter_war_desc: "Masyarakat menjadi skeptis terhadap perlunya perang kita melawan [FIN.GetNonIdeologyName]. Apa yang dulunya merupakan opini pinggiran, yang diawasi oleh dinas keamanan kita, telah berkembang menjadi sentimen arus utama yang berada di luar kendali kita."
 FIN_we_are_the_white_death_idea: "Kami Adalah Kematian Putih"
 FIN_we_are_the_white_death_idea_desc: "Penembak jitu kita yang terkenal, Simo Häyhä, telah meningkatkan moral angkatan bersenjata kita melalui tindakannya yang berani di medan perang. Pasukan sekarang bersatu dengan nama kolektif ‘kematian kulit putih’. Sebuah nama yang mengerikan untuk mencerminkan komitmen pantang menyerah mereka dalam menghancurkan semua musuh yang cukup bodoh untuk menyerang negara kita."
 FIN_embraced_by_the_white_death: "Dipeluk oleh Kematian Putih"
 FIN_embraced_by_the_white_death_desc: "Simo Häyhä, meskipun ia sendiri sering mengalami kematian yang hampir fatal, terus memberikan pelukan dingin akan kematian dan ketakutan kepada musuh-musuh kita."
 FIN_the_lapland_war: "Terlibat dalam Perang Lapland"
 FIN_compensation_for_side_switch_good: "Kompensasi dari Finlandia"
 FIN_compensation_for_side_switch_bad: "Reparasi Perang"
 FIN_sami_pathfinders_recon_bonus_tt: "§YPengintaian dan $long_range_patrol_support$:§! Pengintaian: §G+100.0%§!, §Y$snow$§!: Pergerakan: §G+10%§!, §Y$forest$§!, §Y$hills$§!, §Y$mountain$§!, §Y$marsh$§!, §Y$plains$§! dan §Y$river$§!: Pergerakan: §G+5%§!"
