 NORDIC_receiving_investments_fake_ns: "Investasi Nordik"
 NORDIC_receiving_investments_fake_ns_desc: "Negara Nordik lainnya berinvestasi dalam perekonomian negara kita."
 NORDIC_receiving_investments_TT: "Pabrik Sipil di Luar Lokasi: §G£civ_factory +3§!"
 NORDIC_sending_investments_ns: "$NORDIC_receiving_investments_fake_ns$"
 NORDIC_sending_investments_ns_desc: "Berinvestasi pada perekonomian negara Nordik lainnya."
 NORDIC_investing_in_neighbor_ns: "Berinvestasi di Tetangga"
 NORDIC_investing_in_neighbor_ns_desc: "Tidak ada cara yang lebih baik untuk menginvestasikan modal kita selain tetangga kita. Tidak hanya kedekatannya, namun dengan ikatan jangka panjang dan warisan bersama, kami yakin mereka pada akhirnya juga akan berinvestasi pada kami."
 NORDIC_economic_cooperation_ns: "Kerja Sama Ekonomi"
 NORDIC_economic_cooperation_ns_desc: "Di saat seperti ini, kita tidak boleh menjadi korban keterasingan dan permusuhan terhadap tetangga kita. Itu sebabnya kami berinvestasi pada tetangga kami agar semua kapal kami bisa naik. Semuanya sambil menghasilkan keuntungan yang lumayan."
