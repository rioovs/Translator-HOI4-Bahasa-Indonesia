 FIN_repurposed_small_industries: "Industri Kecil yang Digunakan Kembali"
 FIN_repurposed_small_industries_desc: "Dengan mengambil kendali atas industri-industri kecil dan menggunakannya kembali untuk memenuhi tuntutan upaya perang, pemerintah Finlandia kini dapat mengerahkan sumber dayanya dan memobilisasi perekonomiannya sepenuhnya untuk kebutuhan sipil dan militer."
 FIN_lotta_svard: "Lotta Svard"
 FIN_lotta_svard_desc: "Lotta Svärd telah mendukung angkatan bersenjata kami dalam kapasitas tambahan selama bertahun-tahun. Ketika negara ini menghadapi keadaan yang mengerikan, kami telah memperluas peran mereka dengan mempersenjatai mereka dan memungkinkan anggotanya mengambil peran di garis depan dalam mendukung pertahanan negara."
 FIN_lotta_svard_support_battalions_bonus_tt: "§Y$category_support_battalions$:§! Organisasi: §G+10§!, HP: §G+5§!"
 FIN_international_volunteers: "Relawan Internasional"
 FIN_international_volunteers_desc: "Relawan dari seluruh dunia melakukan perjalanan ke Finlandia untuk bergabung dengan pasukan kami. Finlandia tidak akan berperang sendirian!"
 FIN_militarized_society_requirement_tt: "§RAkan diberhentikan sementara§! jika tidak berdasarkan §Y$all_adults_serve$§! atau §Y$scraping_the_barrel$§! Undang-Undang Wajib Militer."
 FIN_the_lone_wolf_tt: "§RTidak Dapat Membuat atau Bergabung dengan faksi§!"
 FIN_popular_support_for_the_revolution: "Dukungan Rakyat untuk Revolusi"
 FIN_popular_support_for_the_revolution_desc: "Kaum proletar [FIN.GetAdjective] akhirnya bangkit dan melepaskan belenggu penindasan borjuis. Bersama-sama, gerakan kita akan mengguncang fondasi imperialisme tidak hanya di [FIN.GetNonIdeologyName], namun di seluruh dunia!"
 FIN_imprisoned_right_wing_leaders: "Pemimpin Sayap Kanan yang Dipenjara"
 FIN_imprisoned_right_wing_leaders_desc: "Para pemimpin dari berbagai faksi sayap kanan, seperti politisi dan tokoh bisnis, telah dipenjarakan terlebih dahulu untuk mencegah mereka melakukan kegiatan kontra-revolusioner."
 FIN_low_army_morale: "Moral Tentara Rendah"
 FIN_low_army_morale_desc: "Angkatan bersenjata kita kurang antusias dengan kemungkinan terjadinya perang saudara lagi, segera setelah perang saudara yang terakhir. Moral khususnya telah terpukul dalam angkatan bersenjata kita sejak pecahnya permusuhan."
 FIN_commitment_from_construction_workers: "Komitmen Dari Pekerja Konstruksi"
 FIN_commitment_from_construction_workers_desc: "Pekerja konstruksi tidak asing dengan kekejaman eksploitasi kapitalis. Oleh karena itu, banyak yang menjadi pendukung setia gerakan revolusioner kita. Meskipun beberapa dari mereka telah bergabung dengan angkatan bersenjata, banyak juga yang berkomitmen untuk menggunakan keahlian mereka dalam operasi konstruksi apa pun yang mungkin diperlukan negara untuk melaksanakan perang."
 FIN_commitment_from_the_trade_unions: "Komitmen Serikat Pekerja"
 FIN_commitment_from_the_trade_unions_desc: "Serikat pekerja telah berjuang keras selama beberapa dekade melawan ketidakadilan akibat penindasan kapitalis di tempat kerja dan berperan penting dalam meningkatkan kesadaran kelas di kalangan masyarakat. Kini, mereka dengan sepenuh hati bergabung dengan gerakan revolusioner kita untuk mengakhiri kapitalisme untuk selamanya."
 FIN_infiltrated_assets: "Aset yang Disusupi"
 FIN_infiltrated_assets_desc: "Dengan ditemukannya perjanjian perdagangan baru dengan negara lain, kita juga memperoleh peluang untuk menyusup ke mitra kita. Hal ini diharapkan dapat memberikan pemahaman yang lebih baik mengenai motif dan tujuan mereka, yang pada gilirannya akan memungkinkan kita untuk lebih melindungi diri kita sendiri."
 FIN_baltic_sea_focus: "Fokus Laut Baltik"
 FIN_baltic_sea_focus_desc: "Laut Baltik menjadi perhatian utama pertahanan negara. Kita harus memberikan pelatihan dan sumber daya yang dibutuhkan angkatan laut kita untuk melaksanakan tujuan mereka di kawasan ini seefektif mungkin."
 FIN_finnish_goods: "Barang Finlandia"
 FIN_finnish_goods_desc: "Dalam manuver yang cerdik, kami telah membuat perjanjian perdagangan yang kuat dengan [FIN.GetName] Kuusinen, memastikan kami memiliki akses istimewa terhadap barang-barang berharga mereka dan mengamankan persyaratan yang sangat menguntungkan untuk pengadaan mereka."
 FIN_fascist_regime: "Rezim Fasis"
 FIN_fascist_regime_desc: "$FIN_a_fascist_regime$"
 FIN_patriotic_peoples_movement_ns_1: "$FIN_patriotic_peoples_movement$"
 FIN_academic_karelian_society_ns_1: "$FIN_academic_karelian_society$"
 FIN_suojeluskunta_ns_1: "Suojeluskunta"
 FIN_anti_soviet_sentiment: "Sentimen Anti-Soviet"
 FIN_anti_soviet_sentiment_desc: "Masyarakat di negara bagian ini menyimpan kebencian yang mendalam terhadap [SOU.GetNameDef], karena menganggapnya tidak lebih dari sekadar perubahan nama Kekaisaran Rusia atau ancaman terhadap nilai-nilai tradisional mereka."
 FIN_confederation_of_finno_russian_republics_dm: "Konfederasi Republik Finno-Rusia"
 FIN_confederation_of_finno_russian_republics_dm_desc: "$FIN_confederated_finno_russian_republics$"
#NORWAY - National Spirits 
# Ideas 
 NOR_complacent_cabinet_ns: "Kabinet yang Puas"
 NOR_complacent_cabinet_ns_desc: "Fakta bahwa Johan Nygaardsvold berhasil mendapatkan pemerintahan yang stabil bukanlah suatu prestasi kecil, dia dan kabinetnya tampaknya berpikir bahwa itu adalah rintangan terakhir, namun yang belum mereka ketahui adalah bahwa ini hanyalah rintangan pertama dari banyak rintangan lainnya."
 NOR_obsolete_armed_forces_ns_1: "Angkatan Bersenjata yang sudah ketinggalan jaman"
 NOR_obsolete_armed_forces_ns_1_desc: "Norwegia sudah lama tidak mengurus angkatan bersenjatanya, dan sekarang mereka akan lebih berguna di museum daripada di pertempuran."
 NOR_the_hard_thirties_ns: "Tahun Tiga Puluh yang Sulit"
 NOR_the_hard_thirties_ns_desc: "Depresi Hebat tahun 1929 masih terasa di setiap rumah tangga dan bisnis di Norwegia. Mungkin diperlukan keajaiban untuk bisa melewati dekade ini."
 NOR_anti_communist_sentiment_ns: "Sentimen Anti-Komunis"
 NOR_anti_communist_sentiment_ns_desc: "[SOU.GetNameDefCap] dan komunis di luar negeri telah menanamkan ketakutan di banyak [NOR.GetAdjective], sampai pada titik di mana fasisme tidak menjadi perhatian nyata selama mereka mampu mengatasi ancaman merah."
 NOR_disjointed_cabinet_conscription_law_TT: "§RTidak Dapat Menaikkan UU Wajib Militer§!"
 NOR_broken_gun_ns: "Senjata Rusak"
 NOR_broken_gun_ns_desc: "Kebijakan Broken Gun kami akan memastikan perdamaian dan kemakmuran tersebar di [NOR.GetName] dan sekitarnya. Kita dapat menggunakan uang tersebut untuk memperbaiki kehidupan masyarakat kita, dan menunjukkan kepada tetangga kita bahwa kita tidak bermaksud jahat."
 NOR_printing_money_ns: "Mencetak Uang"
 NOR_printing_money_ns_desc: "Jika kita ingin keluar dari masa Hard Thirties sebelum dekade ini benar-benar berakhir, maka kita memerlukan uang dan banyak uang!"
 NOR_defensive_rearmament_ns: "Persenjataan kembali defensif"
 NOR_defensive_rearmament_ns_desc: "Kita tidak bisa membiarkan seluruh dunia berpikir bahwa kita adalah penghasut perang dan menyerang kita terlebih dahulu. Setiap upaya mempersenjatai kembali harus mempunyai tujuan pertahanan yang jelas."
 NOR_coordinating_committee: "Komite Koordinasi"
 NOR_coordinating_committee_desc: "Di pusat upaya perlawanan sipil terletak Koordinasjonskomiteen, yang bertugas menghubungkan pemerintah di pengasingan dengan berbagai elemen perlawanan sipil di [NOR.GetName]."
 NOR_kretsen_ns: "Kretsen"
 NOR_kretsen_ns_desc: "Kelompok ini, yang tertanam jauh di dalam perut penjajah kita, dan mengadakan pertemuan rahasia di pertanian Grimelund, tugas mereka adalah memimpin perlawanan sipil semampu mereka, dari luar dan dalam pendudukan fasis."
 NOR_sivorg_ns: "Sivorg"
 NOR_sivorg_ns_desc: "Kumpulan kelompok perlawanan sipil, termasuk Komite Koordinasi dan Kretsen. Mereka adalah laki-laki dan perempuan di garis depan, yang harus berpegang pada harapan bahwa kita akan mengalahkan fasisme dan mengembalikan kebebasan ke [NOR.GetName]."
 NOR_ketsen_plus_KK_fake_ns: "$NOR_kretsen_ns$ §Wdan§! $NOR_coordinating_committee$"
 NOR_efficient_production_ns: "Produksi yang Efisien"
 NOR_efficient_production_ns_desc: "Tidak ada perbaikan menuju efisiensi yang dapat diabaikan. Kita harus memastikan bahwa kita dapat melakukan yang terbaik dengan apa yang kita miliki, jika tidak maka kita akan menghadapi risiko produksi yang berlebihan."
 NOR_new_haeren_ns_1: "Haæren Baru"
 NOR_new_haeren_ns_1_desc: "Tentara [NOR.GetAdjective] di masa lalu tidak cukup untuk menghadapi masa-masa berbahaya ini. Ini adalah tentara modern untuk perang modern."
 NOR_new_haeren_ns_2_desc: "$NOR_new_haeren_ns_1_desc$"
 NOR_kungens_garde_ns: "Hans Majestet Kongens Garde"
 NOR_kungens_garde_ns_desc: "Raja mungkin memiliki 3 juta pengawal tetapi hanya satu kekuatan, pasukan elit [NOR.GetAdjective] yang mampu melawan musuh kita."
 NOR_expanded_conscription_ns: "Wajib Militer yang Diperluas"
 NOR_expanded_conscription_ns_desc: "Sebagai negara berpenduduk jarang yang berada di masa sulit, tidak ada [NOR.GetAdjective] yang bisa berdiam diri. Setiap orang yang memenuhi persyaratan minimum harus didaftarkan jika tujuan kita ingin tercapai."
 NOR_XU_ns: "XU"
 NOR_XU_ns_desc: "Banyak warga Norwegia yang menentang pendudukan fasis ingin melakukan bagian mereka untuk menghalangi penindas mereka. XU dapat mengatur semua elemen ini di bawah payungnya, dan mendukung upaya mereka untuk memata-matai, memperlambat, dan pada akhirnya, mengusir para penyusup ini."
 NOR_communist_education_centers_ns_1: "Pusat Pendidikan Komunis"
 NOR_communist_education_centers_ns_1_desc: "Pusat-pusat ini didirikan oleh rekan-rekan kami dari luar negeri, dan mereka berada di garis depan upaya kami dalam mempersiapkan [NOR.GetAdjective] untuk [NOR.GetNonIdeologyName] baru yang akan datang."
 NOR_crumbling_fortifications_ns: "Benteng yang Runtuh"
 NOR_crumbling_fortifications_ns_desc: "Dalam beberapa kasus, menyebut mereka sebagai benteng adalah tindakan yang murah hati. Mereka tidak hanya tidak berdaya, tetapi mereka sama sekali tidak siap menghadapi pertempuran modern."
# Allied Democratic
 NOR_reduced_workers_rights_ns: "Berkurangnya Hak-Hak Pekerja"
 NOR_reduced_workers_rights_ns_desc: "Dengan alasan bahwa perang dan kehancuran akan segera terjadi, kami telah berkorban dengan membatasi hak-hak pekerja kami untuk saat ini. Mudah-mudahan mereka akan mengerti setelah perang usai."
 NOR_investing_in_norway_ns: "Berinvestasi di Norwegia"
 NOR_investing_in_norway_ns_desc: "Menginvestasikan sebagian modal kita ke [NOR.GetName] tidak hanya akan menyatukan negara-negara kita tetapi juga akan memperkuat sekutu jika kita membutuhkan bantuan mereka di masa depan."
 NOR_improved_training_ns: "Peningkatan Pelatihan"
 NOR_improved_training_ns_desc: "Program pelatihan baru kami memungkinkan kami membawa orang ke medan perang lebih cepat sambil tetap mengajari mereka segala hal yang perlu mereka ketahui untuk bertahan hidup dan menghancurkan musuh dan banyak lagi."
 NOR_flexible_officers_academy_spirit: "Petugas yang Fleksibel"
 NOR_flexible_officers_academy_spirit_desc: "Perwira generasi baru ini akan memimpin pasukan [NOR.GetAdjective] menuju kemenangan, karena mereka dapat belajar dari lebih dari sekedar buku-buku berdebu dan profesor-profesor kuno di masa damai."
    # Fascist Path 
 NOR_contested_leadership_ns: "Kepemimpinan yang Diperebutkan"
 NOR_contested_leadership_ns_desc: "[get_NOR_contested_leadership_ns_desc]"
 NOR_contested_leadership_ns_desc_ger: "Terlepas dari apa yang ingin dicapai Quisling melalui kudetanya, [GER.GetNameDef] mempunyai rencana mereka sendiri terhadap pemerintahan yang dimaksudkan untuk dilantik ketika [NOR.GetNonIdeologyName] ditaklukkan. Kenyataannya adalah, sangat sedikit orang di Reich yang menganggap Quisling cocok untuk pekerjaan itu, kecuali Hitler sendiri, yang anehnya menyukai tiran kecil [NOR.GetAdjective]."
 NOR_contested_leadership_ns_desc_generic: "Meskipun Quisling berhasil melakukan kudeta, kenyataannya hierarki kekuasaan sangat kacau, karena tidak semua orang di angkatan bersenjata, atau bahkan pemerintahannya sendiri, menyetujui pengambilalihan tersebut."
 NOR_abandoning_nynorsk_ns: "$NOR_abandoning_nynorsk$"
 NOR_abandoning_nynorsk_ns_desc: "Para pemimpin Nasjonal Samling telah menetapkan bahwa Nynorsk tidak akan ditoleransi dan setiap warga negara harus menggunakan Bahasa Norwegia versi Bokmål."
 NOR_oppressed_civilians_dmod: "Warga Sipil yang Tertindas"
 NOR_oppressed_civilians_dmod_desc: "Warga Norwegia sedang melakukan serangkaian tindakan untuk menekan perbedaan pendapat terhadap rezim fasis yang diberlakukan oleh Nasjonal Samling atas nama tiran asing."
 NOR_ulfhedhnar_ns: "$NOR_ulfhedhnar_wolf_coats$"
 NOR_ulfhedhnar_ns_desc: "Kami telah menghidupkan kembali pengamuk viking tradisional kami, Wolfcoats. Orang-orang ini bersemangat berperang dan siap menjadi ujung tombak penaklukan kita di seluruh dunia."
 NOR_permanent_revolution_ns: "Revolusi Permanen"
 NOR_permanent_revolution_ns_desc: "Seperti yang diajarkan Lev Trotskij kepada kita, revolusi tidak akan berakhir sampai setiap pekerja di seluruh dunia dibebaskan dan dipersatukan kembali dengan hasil kerja mereka. Perbatasan tidak ada artinya bagi kelas pekerja."
 NOR_attack_sweden_ns: "Serang Swedia"
 NOR_attack_sweden_ns_desc: "[SWE.GetNonIdeologyName] adalah target yang terlalu penting untuk dibiarkan kosong. Jika kita tidak merebut sumber daya mereka terlebih dahulu, mereka mungkin jatuh ke tangan musuh atau lebih buruk lagi, [SWE.GetAdjective] pencatut perang."
 NOR_attack_denmark_ns: "Serang Denmark"
 NOR_attack_denmark_ns_desc: "[DEN.GetNonIdeologyName] adalah jembatan ke seluruh Eropa. Sayangnya hal ini juga berarti bahwa negara ini bisa menjadi landasan peluncuran musuh kita ke Skandinavia. Kita tidak bisa membiarkannya begitu saja."
 NOR_crush_stalin_ns: "Hancurkan Stalin"
 NOR_crush_stalin_ns_desc: "Stalin dan apa yang disebutnya [SOU.GetName] digunakan sebagai ukuran dari apa yang diperjuangkan Komunisme. Kita tidak bisa membiarkan hal itu berlanjut, karena rezim preman ini tidak lebih dari Kekaisaran Rusia kuno yang dilapisi cat merah."
 NOR_crush_hitler_ns: "Hancurkan Hitler"
 NOR_crush_hitler_ns_desc: "Hanya sedikit rezim yang brutal dan tidak manusiawi seperti rezim Hitler. Kita tidak bisa membiarkan orang gila ini merajalela di pengawasan kita. Mari kita hadapi dia dan [GER.GetNonIdeologyName] Nazi-nya dengan cepat dan tegas."
 NOR_liberate_finland_ns: "Bebaskan Finlandia"
 NOR_liberate_finland_ns_desc: "Para pekerja [FIN.GetName] jelas membutuhkan pembebasan. Mereka bekerja keras bukan untuk diri mereka sendiri atau sesama warga Finlandia, tapi untuk tuan tanah dan industrialis. Mari kita bantu kawan-kawan kita dalam membebaskan negeri ini agar mereka bisa bekerja demi revolusi."
 # Monarchist Path 
 NOR_king_haakon_vii_ns: "Raja Haakon VII"
 NOR_king_haakon_vii_ns_desc: "Sebagai raja [NOR.GetAdjective] pertama sejak abad ke-13, Raja Haakon VII adalah teladan demokrasi. Hanya setelah referendum dia menerima mahkota, dan menyerahkan kekuasaan [NOR.GetName] kepada penasihatnya, dan bangsawan berpangkat tinggi lainnya."
 NOR_new_high_king: "Raja Agung yang Baru"
 NOR_new_high_king_desc: "Bupati Peder Anker Wedel-Jarlsberg telah mendeklarasikan dirinya sebagai Raja Agung Norwegia yang baru, mengukuhkan dirinya sebagai penguasa, tanpa secara langsung menyandang gelar Raja Haakon. Namun langkah ini tidak populer di kalangan negara tetangga."
 NOR_norwegian_regency: "Kabupaten Norwegia"
 NOR_norwegian_regency_desc: "Bupati Peder Anker Wedel-Jarlsberg menyatakan dirinya hanya berniat melaksanakan kemauan dan perintah rajanya, Haakon VII. Oleh karena itu, ia berupaya melakukan pemulihan hubungan dengan monarki Skandinavia yang bertetangga."
 NOR_second_north_sea_empire: "Kekaisaran Laut Utara Kedua"
 NOR_second_north_sea_empire_desc: "Bupati Peder Anker Wedel-Jarlsberg telah menyatakan bahwa ia bermaksud mengembalikan Norwegia ke kejayaannya, dan hanya masalah waktu sebelum Kekaisaran Norwegia yang baru bangkit."
 #Dynamic Modifiers 
 NOR_independent_norway_dmod: "Norwegia yang Merdeka"
 NOR_independent_norway_dmod_desc: "Kami telah merdeka dari Swedia sejak tahun 1905, dan kami telah mengalami banyak kemajuan sejak saat itu. Sekarang giliran kita untuk menciptakan [NOR.GetNonIdeologyName] yang diimpikan oleh nenek moyang kita."
 NOR_army_air_force_dmod: "Hærens Flyvevaaben"
 NOR_army_air_force_dmod_desc: "Untuk saat ini, tugas angkatan udara kita yang baru adalah mendukung angkatan darat kita ke mana pun mereka pergi, jadi tidak diperlukan hierarki terpisah untuk saat ini."
 NOR_royal_air_force_dmod: "Luftforsvaret"
 NOR_royal_air_force_dmod_desc: "Angkatan udara kita telah berkembang hingga pada titik di mana mereka tidak hanya dianggap sebagai penguasa langit [NOR.GetAdjective], namun juga nasib mereka sendiri."
 NOR_royal_navy_dmod: "Selamat datang"
 NOR_royal_navy_dmod_desc: "Angkatan laut kebanggaan kita akan mengarungi lautan sekitar [NOR.GetName] dan seterusnya. Bagaimanapun, jalan raya terluas menuju negara kita adalah Laut Utara itu sendiri."
 NOR_administrative_council_dmod: "Dewan Administratif"
 NOR_administrative_council_dmod_desc: "Ketika negara kita berada di bawah pendudukan, laki-laki dan perempuan ini akan menjadi kelompok yang ditugasi menangani masalah-masalah kecil sementara keputusan-keputusan besar diambil alih oleh penguasa Fasis kita."
 NOR_kingdom_of_norway_dmod: "$NOR_the_kingdom_of_norway$"
 NOR_kingdom_of_norway_dmod_desc: "Apa gunanya demokrasi yang tampak seperti itu? Sekarang setelah Storting akhirnya dibubarkan, kerajaan kita dapat berkembang di bawah tangan baik hati raja kita dan tangan lurus dari Lord Regent kita Peder Anker Wedel-Jarlsberg."
 # State Modifiers 
 NOR_prep_his_dmod_1: "Berkembang"
 NOR_prep_his_dmod_1_desc: "Kami sedang berupaya mengembangkan negara bagian ini dari negara terpencil menjadi industri sipil kecil-kecilan."
 NOR_prep_his_dmod_2: "Dikembangkan"
 NOR_prep_his_dmod_2_desc: "#Negara bagian ini cukup berkembang, namun jalan masih panjang untuk dianggap sebagai pusat industri."
 NOR_prep_his_dmod_3: "sangat maju"
 NOR_prep_his_dmod_3_desc: "Negara ini berkomitmen penuh terhadap perjuangan industri sipil di Norwegia."
 NOR_prep_resistance_dmod: "Ketahanan Tanam"
 NOR_prep_resistance_dmod_desc: "Terlepas dari apa yang penjajah pikirkan tentang kami, penduduk [NOR.GetNonIdeologyName] tidak akan menyerah begitu saja. Kami telah menanam orang, peralatan tersembunyi, dan sumber daya yang tersebar yang dapat mereka gunakan untuk melawan penjajah yang mengerikan ini dengan lebih baik."
 NOR_defend_state_dmod: "Bela Negara"
 NOR_defend_state_dmod_desc: "Kami akan mempertahankan apa yang menjadi hak kami dengan segala yang kami miliki. Penjajah harus mati."
 NOR_prep_fasc_dmod_1: "Pendukung Fasis"
 NOR_prep_fasc_dmod_2: "$NOR_prep_fasc_dmod_1$"
 NOR_prep_fasc_dmod_3: "$NOR_prep_fasc_dmod_1$"
 NOR_royal_defenses: "Pertahanan Kerajaan"
 NOR_royal_defenses_desc: "Atas perintah Istana Kerajaan, negara bagian ini akan fokus pada pembangunan pertahanan yang diperlukan untuk melindungi wilayah tersebut."
