#NATIONAL SPIRITS
 DEN_industrial_capability_dynamic_modifier: "Kemampuan Industri Denmark"
 DEN_light_market_regulation_research_bonus: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_desc: "Denmark secara tradisional merupakan negara agraris dan produsen, namun industrinya semakin penting dan signifikan secara ekonomi. Kita harus melakukan industrialisasi dan modernisasi untuk mengikuti perkembangan pesat di zaman modern."
 DEN_industrial_capability_dynamic_modifier_light_regulation_desc: "$DEN_industrial_capability_dynamic_modifier_desc$"
 DEN_industrial_capability_dynamic_modifier_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_improved_desc: "Denmark secara tradisional merupakan negara agraris dan produsen, namun industrinya semakin penting dan signifikan secara ekonomi. Kami telah mengambil langkah pertama untuk memodernisasi dan mengembangkan industri kami, menjadikan kami lebih kompetitif dan produktif."
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved_desc: "$DEN_industrial_capability_dynamic_modifier_improved_desc$"
 DEN_industrial_capability_dynamic_modifier_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved: "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_max_improved_desc: "Denmark secara tradisional merupakan negara agraris dan produsen, namun industrinya semakin penting dan signifikan secara ekonomi. Industri kami sepenuhnya dimodernisasi dan dikembangkan, beroperasi dengan kapasitas penuh siang dan malam."
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved_desc: "$DEN_industrial_capability_dynamic_modifier_max_improved_desc$"
 DEN_economic_crisis_dynamic_modifier: "Krisis Ekonomi"
 DEN_economic_crisis_dynamic_modifier_desc: "Depresi Hebat telah menghantam kita dengan kekuatan penuh. Akibatnya, menurunnya permintaan terhadap hasil pertanian berarti banyaknya petani yang harus menanggung utang dan penyitaan, dan melonjaknya angka pengangguran telah menjadi tempat berkembang biaknya gerakan-gerakan ekstremis di kalangan politik."
 DEN_neglected_military_dynamic_modifier: "Militer yang Terabaikan"
 DEN_neglected_military_dynamic_modifier_desc: "Kami telah menerapkan kebijakan melucuti netralitas selama bertahun-tahun agar tidak memprovokasi Jerman. Militer hanyalah sekedar kekuatan simbolis yang melindungi kedaulatan kita. Angkatan bersenjata terus menerus menerima pemotongan dana selama bertahun-tahun sehingga membuat mereka sama sekali tidak siap menghadapi potensi konflik."
 DEN_danish_produce: "Produk Denmark"
 DEN_danish_produce_desc: "Bacon dan produk susu telah menjadi makanan pokok ekspor Denmark, sehingga pada masa Perang Besar istilah 'Goulash Barons' diciptakan, mengacu pada mereka yang mendapat keuntungan dari perdagangan dengan Inggris Raya dan Jerman."
 DEN_sahnefront: "Bagian Depan Mentega"
 DEN_sahnefront_desc: "Denmark adalah negara kaya dengan tradisi pertanian yang kaya, dan sebagai warga negara kami, kami berhak mendapatkan manfaat tersebut. Memiliki Denmark akan memperkuat kekuatan dan kemampuan militer kita."
 DEN_improved_logistics: "Peningkatan Logistik"
 DEN_improved_logistics_desc: "Denmark adalah negara yang kaya dan melimpah, dan dengan memanfaatkan sumber daya ini kita akan mengamankan makanan bagi pasukan kita dan memperkuat kemampuan militer kita."
 DEN_danish_licensing_ns: "Perjanjian Perdagangan"
 DEN_danish_licensing_ns_desc: "Di dunia di mana transaksi dan perdagangan antar negara merupakan suatu kebutuhan, sangatlah baik untuk memiliki mitra dagang yang dekat. Kesepakatan ini akan menguntungkan kedua negara dan memperkuat ikatan di antara kita."
 DEN_danish_licensing_ns_no_DOD_desc: "$DEN_danish_licensing_ns_desc$"
 DEN_overlord_licensing_ns_desc: "$DEN_danish_licensing_ns_desc$" #TODO_DANNE; Refine if there is time
 DEN_overlord_licensing_ns_no_DOD_desc: "$DEN_danish_licensing_ns_desc$" #TODO_DANNE; Refine if there is time
 DEN_war_preparations_dynamic_modifier: "Persiapan Perang"
 DEN_war_preparations_dynamic_modifier_desc: "Hanya dengan bersiap kita bisa menghadapi badai. Kita harus menambah persediaan bahan mentah dan persediaan lainnya ketika dibutuhkan, dan mempersiapkan industri kita untuk membantu upaya perang."
 DEN_rule_the_north_sea: "Kuasai Laut Utara"
 DEN_rule_the_north_sea_desc: "Untuk memenuhi ambisi kita di Laut Utara, kita harus menciptakan Armada Besar dengan daya tembak tertinggi untuk mengamankan wilayah kita dan mencegah negara lain mengambil alih wilayah tersebut."
 DEN_fromandskorpset_ns: "$DEN_fromandskorpset$"
 DEN_fromandskorpset_ns_desc: "Dengan terbentuknya pasukan amfibi khusus, kami siap untuk memproyeksikan kekuatan militer kami jauh dan luas - melintasi perairan dan pantai asing."
 DEN_declaration_of_neutrality: "Deklarasi Netralitas"
 DEN_declaration_of_neutrality_desc: "Denmark telah berhasil menghindari peperangan selama beberapa dekade, dan hal ini hanya mungkin terjadi melalui kebijakan netralitas kami. Ini telah membantu kami dengan baik dan akan terus melakukannya."
 DEN_denmark_becomes_a_puppet_tt: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! akan mendapatkan pilihan untuk mencoba menjadi boneka jika negara terdekat yang lebih kuat melakukan invasi, sambil mempertahankan bentuk pemerintahannya saat ini"
 DEN_neutrality_flag: "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! merdeka dan tidak berperang"
 DEN_political_edicts_dynamic_modifier: "Dekrit Politik"
 DEN_political_edicts_dynamic_modifier_desc: "Setiap warga Denmark harus mengetahui apa yang diharapkan dan dituntut dari mereka di masa-masa sulit ini. Kita harus waspada terhadap tindakan permusuhan terhadap bangsa kita dan bersatu untuk mencapai tujuan bersama."
 DEN_resistance_dynamic_modifier: "Modstandsbevægelsen"
 DEN_resistance_dynamic_modifier_desc: "Hanya dengan menyatukan dan melawan kekuatan pendudukan [?DEN.DEN_overlord_nation.GetAdjective] kita dapat berharap untuk melihat [DEN.GetNameDef] yang bebas lagi. Gerakan Perlawanan adalah pusat dari hal ini dan akan sangat penting untuk mendapatkan kembali kebebasan kita suatu hari nanti."
 DEN_resistance_dynamic_modifier_improved: "$DEN_resistance_dynamic_modifier$"
 DEN_resistance_dynamic_modifier_improved_desc: "$DEN_resistance_dynamic_modifier_desc$"
 DEN_occupation_laws_dynamic_modifier: "Hukum Pekerjaan"
 DEN_occupation_laws_dynamic_modifier_desc: "Tuan [?DEN.DEN_overlord_nation.GetAdjective] kami telah menugaskan kami untuk membantu mereka dalam perang dan telah menerapkan beberapa undang-undang untuk memastikan kami mematuhinya."
 DEN_securing_sweden_ns: "Mengamankan [SWE.GetNameDef]"
 DEN_securing_sweden_ns_desc: "Swedia pernah menjadi bagian dari Persatuan Kalmar dan berada di bawah kekuasaan Denmark. Waktunya telah tiba untuk memasukkan kembali Swedia ke dalam wilayah kita. Militer kami telah bersiap untuk hari ini dan berlatih dengan tekun untuk melawan dan menghancurkan pasukan Swedia yang bermusuhan."
 DEN_securing_norway_ns: "Mengamankan [NOR.GetNameDef]"
 DEN_securing_norway_ns_desc: "Orang-orang Norwegia telah menjadi bagian dari wilayah kita selama ratusan tahun. Waktunya telah tiba untuk menggabungkan kembali Norwegia ke dalam [DEN.GetNameDefCap] sekali lagi. Militer kami telah mempersiapkan diri untuk hari ini dan berlatih dengan tekun untuk melawan dan menghancurkan pasukan Norwegia yang bermusuhan."
 DEN_securing_finland_ns: "Mengamankan [FIN.GetNameDef]"
 DEN_securing_finland_ns_desc: "Meskipun kami tidak pernah menjalankan kekuasaan langsung atas mereka, Finlandia mematuhi kami di bawah Kalmar Union. Kini saatnya menempatkan Finlandia di bawah kekuasaan langsung Denmark. Militer kami telah bersiap untuk hari ini dan berlatih dengan tekun untuk melawan dan menghancurkan pasukan Finlandia yang bermusuhan."
 DEN_foreign_influence_ns: "Pengaruh Opini Publik Asing"
 DEN_fascist_propaganda_ns: "Propaganda Fasis"
 DEN_fascist_propaganda_ns_desc: "Kaum Fasis yang penipu dan tidak jujur menyebarkan rumor jahat tentang pemerintah kita dalam upaya melemahkan pemerintahan kita."
 DEN_communist_propaganda_ns: "Propaganda Komunis"
 DEN_communist_propaganda_ns_desc: "Komunis yang penipu dan tidak jujur menyebarkan rumor jahat tentang pemerintah kita dalam upaya melemahkan pemerintahan kita."
 DEN_monarchist_discontent_ns: "Ketidakpuasan Monarki"
 DEN_monarchist_discontent_ns_desc: "Sebuah gerakan patriotik telah dimulai, berkumpul di belakang simbol kuno Raja. Mereka tidak puas dengan pemerintahan kita yang terdiri dari rakyat, oleh rakyat, untuk rakyat, dan lebih memilih melihat Raja sendiri mengambil alih kekuasaan."
 DEN_haeren_dynamic_modifier: "Selamat"
 DEN_haeren_dynamic_modifier_desc: "Denmark menguasai Skandinavia selama berabad-abad dan merupakan kekuatan utama di wilayah tersebut. Tentara kami bergerak melintasi wilayah Laut Baltik tanpa hambatan dan perlawanan. Tentara hanyalah bayangan dari keadaan sebelumnya, namun kita dapat kembali membangun kekuatan dan kekuatan militer untuk melindungi perbatasan dan rakyat kita."
 DEN_haeren_dynamic_modifier_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_improved_desc: "Denmark menguasai Skandinavia selama berabad-abad dan merupakan kekuatan utama di wilayah tersebut. Tentara kami bergerak melintasi wilayah Laut Baltik tanpa hambatan dan perlawanan. Tentara telah mendapatkan kembali kekuatannya seperti semula, namun kami telah mengambil langkah pertama untuk mengembalikannya ke kejayaannya."
 DEN_haeren_dynamic_modifier_max_improved: "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_max_improved_desc: "Denmark menguasai Skandinavia selama berabad-abad dan merupakan kekuatan utama di wilayah tersebut. Tentara kami bergerak melintasi wilayah Laut Baltik tanpa hambatan dan perlawanan. Tentara kita sekali lagi merupakan sesuatu yang membuat kagum dan takut! Kami telah berhasil membangun kembali kekuatannya dan kami siap menghadapi apa pun yang mungkin terjadi."
 DEN_sovaernet_dynamic_modifier: "Unduh"
 DEN_sovaernet_dynamic_modifier_desc: "Denmark pernah menjadi kekuatan besar di Laut Baltik, mendominasi ombak dengan armada besar kami - namun kami memiliki sejarah pelayaran yang panjang bahkan sebelum itu. Bangsa Viking berlayar jauh dan luas untuk menyebarkan ketakutan dan menaklukkan daratan. Dengan ketabahan dan tekad, kita dapat membangun kembali angkatan laut kita untuk menguasai lautan sekali lagi."
 DEN_sovaernet_dynamic_modifier_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_improved_desc: "Denmark pernah menjadi kekuatan besar di Laut Baltik, mendominasi ombak dengan armada besar kami - namun kami memiliki sejarah pelayaran yang panjang bahkan sebelum itu. Bangsa Viking berlayar jauh dan luas untuk menyebarkan ketakutan dan menaklukkan daratan. Meskipun masih banyak pekerjaan yang harus dilakukan, angkatan laut telah memulihkan sebagian besar kejayaan dan kekuatannya."
 DEN_sovaernet_dynamic_modifier_max_improved: "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_max_improved_desc: "Denmark pernah menjadi kekuatan besar di Laut Baltik, mendominasi ombak dengan armada besar kami - namun kami memiliki sejarah pelayaran yang panjang bahkan sebelum itu. Bangsa Viking berlayar jauh dan luas untuk menyebarkan ketakutan dan menaklukkan daratan. Kami telah membangun angkatan laut kami dan siap untuk berlayar dan menguasai lautan sekali lagi."
 DEN_flyvevabnet_dynamic_modifier: "Terbangvevåbnet"
 DEN_flyvevabnet_dynamic_modifier_desc: "Peperangan udara adalah cara terbaru untuk berperang dan merupakan tolak ukur militer modern. Dengan terbentuknya cabang terbaru militer Denmark, Flyvevåbnet, kami kini benar-benar menjadi kekuatan modern yang patut diperhitungkan."
 DEN_flyvevabnet_dynamic_modifier_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_flyvevabnet_dynamic_modifier_max_improved: "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_max_improved_desc: "$DEN_flyvevabnet_dynamic_modifier_desc$"
#STATE MODIFIERS
 DEN_development_projects_state_modifier: "Proyek Pengembangan Industri"
 DEN_development_projects_state_modifier_desc: "Sektor industri perlu memperluas dan mengembangkan proses dan produk yang lebih hemat biaya. Kami telah menginvestasikan sumber daya di sini agar industri dapat tumbuh dan berkembang guna membantu pertumbuhan perekonomian negara."
 DEN_development_projects_mainland_state_modifier: "$DEN_development_projects_state_modifier$"
 DEN_development_projects_mainland_state_modifier_desc: "$DEN_development_projects_state_modifier_desc$"
 DEN_military_projects_state_modifier: "Proyek Pembangunan Militer"
 DEN_military_projects_state_modifier_desc: "Hal ini dianggap perlu oleh negara untuk melindungi dan membangun kemampuan militernya guna menjamin keamanan negara."
 DEN_home_guard_state_modifier: "Hjemmeværnet"
 DEN_home_guard_state_modifier_desc: "Home Guard aktif dalam kondisi ini, memperlambat gerak maju musuh."
 DEN_pan_scandinavianism_modifier: "Semangat Pan-Skandinavianisme"
 DEN_pan_scandinavianism_modifier_desc: "Semangat Pan-Skandinavianisme telah mencengkeram negara ini, memperkuat tekad dan pengabdian penduduknya."
###### NORDIC SHARED IDEAS ######
 NORDIC_to_arms_against_tyranny_ns: "Untuk Mempersenjatai Melawan Tirani"
 NORDIC_to_arms_against_tyranny_ns_desc: "Ketika cakar Tirani mengancam kemerdekaan tetangga kita di Nordik, kita harus siap membela mereka, jangan sampai kita menjadi santapan tiran berikutnya."
 NORDIC_the_nordic_march_ns: "Pawai Nordik"
 NORDIC_the_nordic_march_ns_desc: "Negara-negara di sekitar kita belum melihatnya, tapi apa yang mereka sebut tirani tidak lebih dari angin perubahan, dan setelah mereka selesai menghancurkan segala sesuatu yang menghalangi mereka, sebuah tatanan Nordik yang baru akan bangkit dari abu, dan kita akan berada dalam posisi untuk merebut kekuasaan itu."
