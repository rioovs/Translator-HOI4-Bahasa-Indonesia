 SWE_hungershield: "Kelaparan"
 SWE_hungershield_instant_desc: "Swedia berisiko melakukan pemogokan atau kerusuhan jika stabilitas berada di bawah §Y68%§!. §YAkan dihapus jika salah satu hal berikut ini benar:§!\nMemiliki lebih dari §Y45§! pabrik sipil termasuk perdagangan\nTelah membangun lebih dari §Y14§! pabrik sipil tidak termasuk perdagangan\nKeuntungan §G120§! §Ykekuatan politik§! setelah pemecatan"
 SWE_severe_lack_of_ammunition: "Kurangnya amunisi"
 SWE_severe_lack_of_ammunition_desc: "Militer kita menderita karena kurangnya amunisi untuk senjata kita, serta banyaknya senjata kecil yang diproduksi dan dibeli dari berbagai negara asing. Kita harus mengatasi masalah ini sesegera mungkin."
 SWE_folkhemmet: "Folkhemmet"
 SWE_folkhemmet_desc: "$SWE_per_albin_hansson$ dan Partai Sosial Demokrat telah memperkenalkan gelombang reformasi selama bertahun-tahun yang kemudian dikenal sebagai ‘Folkhemmet’ atau ‘rumah rakyat’. Reformasi tersebut telah menciptakan jaring pengaman sosial, perumahan yang lebih baik dan akses yang lebih besar terhadap pendidikan bagi masyarakat dengan mengorbankan anggaran militer. Meskipun banyak orang yang sangat menghargai reformasi ini, mereka yang memiliki kedudukan lebih kaya atau militeristik memandangnya dengan meremehkan."
 SWE_folkhemmet_communism: "$SWE_folkhemmet$"
 SWE_folkhemmet_communism_desc: "Partai Sosial Demokrat memperkenalkan gelombang reformasi selama bertahun-tahun yang kemudian dikenal sebagai ‘Folkhemmet’ atau ‘rumah rakyat’. Reformasi tersebut telah menciptakan jaring pengaman sosial, perumahan yang lebih baik dan akses yang lebih besar terhadap pendidikan bagi masyarakat dengan mengorbankan anggaran militer. Dengan terbentuknya kediktatoran buruh, kita mempunyai peluang untuk memperluas kebijakan tersebut."
