 SWE_rearmament_1_text: "§YDana rendah§!"
 SWE_rearmament_0_text: "§YTidak ada dana§!"
 SWE_folkhemmet_pdx_tooltip: "Setiap tahun kami dapat menetapkan kebijakan untuk persenjataan kembali atau perlucutan senjata atau [SWE.GetnameDef]. Semakin kita mendorong masyarakat untuk mempersenjatai kembali §YDukungan Perang§!, §YPabrik Militer§! dan §YDockyard§! bonus kecepatan konstruksi akan menjadi lebih kuat, sedangkan §YStabilitas§! dan §YPabrik Sipil§! kecepatan konstruksi akan menjadi lebih lemah.\nA §YFolkhemmet§! dengan 0 §YKeutuhan§! adalah kebalikan dari dirinya sendiri, dimana bonus sipil adalah §Rnegatif§! dan bonus militer adalah §Gpositif§!.\n\nSaat komite persenjataan kembali bersidang, kita akan mempunyai jangka waktu untuk bebas mengubah kebijakan, namun setelah komite tersebut berakhir, pilihan-pilihan tersebut akan terkunci hingga tahun depan."
