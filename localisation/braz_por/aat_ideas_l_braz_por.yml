# ICELAND
 ICE_the_icelandic_economy_modifier: "Perekonomian Islandia"
 ICE_the_icelandic_economy_modifier_desc: "Perekonomian kita sangat menderita selama Perang Besar ketika Islandia terisolasi dari dunia luar. Kemudian depresi melanda, dan meskipun daratan Eropa sudah sedikit pulih, perekonomian Islandia terus menderita. Tapi mungkin suatu hari nanti, kita akan membuat dunia takjub..."
 ICE_the_icelandic_economy_modifier_tt: "Memodifikasi §Y$ICE_the_icelandic_economy_modifier$§!:"
 ICE_christian_x: "Kristen X"
 ICE_christian_x_desc: "Christian X adalah Raja gabungan Denmark dan Islandia. Tautan terakhir antara kedua negara."
 ICE_dissent_in_the_working_class: "Perbedaan pendapat di Kelas Pekerja"
 ICE_travel_guide: "$ICE_bjorn_olafsson$"
 ICE_marine_corps: "Korps Marinir Kerajaan Islandia"
 ICE_home_defence_corps: "Penjaga Rumah"
 ICE_civilian_fleet: "Memperbesar Armada Sipil"
 ICE_fishing_industry: "Memperluas Industri Perikanan"
 ICE_fishing_industry_2: "Memperluas Industri Perikanan"
 ICE_knud_i: "Knud I dari Islandia"
 ICE_compensation_purchase_idea: "Pembayaran Kompensasi"
 ICE_compensation_sale_idea: "Pembayaran Kompensasi"
 ICE_esso: "Itu juga"
 ICE_eimskip: "Eimskip"
 ICE_vifilfell: "Vifilfell"
 ICE_siemens: "Siemens Islandia"
 ICE_transformation_of_nature_state_modifier: "Produksi Energi yang Efisien"
 ICE_landsvirkjun: "Landsvirkjun"
 ICE_greyshirts: "kemeja abu-abu"
 ICE_greyshirts_desc: "Milisi bersenjata lengkap yang dilatih sejak masa muda dapat menjadi alat yang berguna untuk membina generasi muda dan membentuk mereka agar sesuai dengan dunia baru kita. Selain itu, pelatihan semi-militer juga berarti memperkuat kemampuan angkatan bersenjata, yang terbukti berguna dalam merebut kembali apa yang menjadi hak kita."
 ICE_viking_spirit: "Ásatrú"
 ICE_viking_spirit_desc: "Tak kenal takut dan mematikan adalah kata-kata yang diasosiasikan dengan kaum viking di masa lalu. Mereka menyeberangi lautan, tidak mengetahui apa yang ada di baliknya, dan hanya yang kuat yang berhasil. Orang Islandia harus menjadi orang yang tidak kenal takut dan berani saat ini, karena hanya melalui keberanian dan keberanian, negara ini akan melampaui apa yang pernah ada, dan menguasai Laut Utara sekali lagi."
 ICE_fascist_tech_sharing_group_name: "Organisasi Penelitian Islandia"
 ICE_fascist_tech_sharing_group_desc: "Negara Islandia telah menyelenggarakan program kerja sama penelitian antara dirinya dan negara-negara yang memiliki ideologi yang sama, dalam upaya untuk memajukan pengembangan teknologinya."
 ICE_hosting_american_soldiers: "Menjadi tuan rumah bagi Tentara Amerika"
 ICE_hosting_american_soldiers_desc: "Menjadi tuan rumah bagi Tentara Amerika di pulau kami memungkinkan kami memikat mereka untuk bergabung dengan negara kami, sehingga menghasilkan orang-orang cakap yang bersedia berjuang demi tujuan persatuan kami."
 ICE_conscription_idea: "Ini dia"
 ICE_conscription_idea_desc: "Setiap dewasa muda di Islandia diharuskan melakukan dinas militer selama 4 tahun antara usia 18 dan 22 tahun, untuk melindungi kedaulatan negara mereka."
 ICE_professional_army_idea: "Vikingasveitin"
 ICE_professional_army_idea_desc: "Tentara Islandia terdiri dari orang-orang paling berani dan gagah berani di luar sana, dan siap membela negara Islandia dengan cara apa pun."
 ICE_civil_defence_organization: "Organisasi Pertahanan Sipil"
 ICE_civil_defence_organization_desc: "Setiap warga negara Islandia siap kapan saja untuk melakukan semua yang perlu dilakukan untuk melindungi negaranya, membantu rakyatnya, atau menyelamatkan infrastrukturnya."
