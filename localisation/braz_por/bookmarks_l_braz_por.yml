l_braz_por:
 BM_HISTORY_TITLE: "Sejarah Singkat"
 GATHERING_STORM_NAME: "Badai yang Berkumpul"
 GATHERING_STORM_DESC: "Masa-masa kelam segera tiba. Di Eropa, Hitler telah mengonsolidasikan kekuasaannya dan perhatiannya kini kian tertuju ke luar perbatasan Jerman. Italia di bawah Mussolini terus melancarkan petualangan militer yang berani, sementara Kekaisaran Jepang bersiap menyerang Tiongkok di Asia. Hampir dua puluh tahun berlalu sejak berakhirnya Perang Besar, dan dunia kembali tersiram bensin. Satu percikan api saja sudah cukup untuk menyulut segalanya."
 HITTING_FAN_NAME: "Kekacauan Memuncak"
 HITTING_FAN_DESC: "Ya, benar sekali! Koleksi payung itu akan sangat berguna sekarang."
 ENG_GATHERING_STORM_DESC: "Meskipun Britania Raya keluar sebagai pemenang dalam Perang Besar, fondasi kekaisaran agungnya terguncang hingga ke akarnya. Satu generasi pemuda terbaik bangsa gugur di parit-parit Flandria dan Prancis Utara, sementara keresahan meluas ke seluruh Persemakmuran dan utang menumpuk luar biasa.\n\nDengan trauma perang sebelumnya yang masih segar dalam ingatan, negara ini kini menghadapi prospek perang lainnya. Semakin jelas bahwa tidak akan ada Perdamaian untuk Zaman Kita."
 FRA_GATHERING_STORM_DESC: "Kendati menderita kehancuran akibat Perang Besar, Prancis berada di jalur pemulihan berkat perekonomian yang kuat. Namun, Depresi Besar tetap memukul negara ini, dan rezim baru Jerman sama sekali tidak berminat membayar pampasan perang yang diatur dalam Perjanjian Versailles.\n\nKetika perjanjian itu ditandatangani, seorang marsekal Prancis melontarkan ucapan terkenal bahwa ini bukanlah perdamaian, melainkan gencatan senjata selama 20 tahun. Dan waktu 20 tahun tersebut kini kian menipis dengan cepat."
 GER_GATHERING_STORM_DESC: "Jerman yang baru telah bangkit. Tiga tahun telah berlalu sejak Republik Weimar dibubarkan dan digantikan oleh Reich Ketiga pimpinan Hitler. Stabilitas ekonomi telah kembali setelah masa-masa sulit Depresi Besar, dan pengangguran massal telah teratasi.\n\nBatasan militer yang dipaksakan pada Jerman oleh Perjanjian Versailles telah lama dilupakan, dan Wehrmacht semakin kuat dari hari ke hari. Sebuah Weltkrieg baru kini membayangi di cakrawala."
 ITA_GATHERING_STORM_DESC: "Dengan bangkitnya Fasisme, Italia telah memasuki era kejayaan baru. Pasukannya kini tengah menambahkan Etiopia ke dalam kekaisaran kolonial Italia yang terus berkembang, tetapi ambisi Mussolini tidak berhenti di situ saja.\n\nDominasi atas Laut Tengah selalu menjadi takdir Italia, dan sebuah tatanan baru mulai terbentuk di Eropa. Ketika gelombang pasang perubahan itu tiba, Italia harus berada di puncaknya atau berisiko tersapu habis."
 JAP_GATHERING_STORM_DESC: "Kekaisaran Jepang berdiri di persimpangan jalan. Hokushin-ron, Doktrin Ekspansi ke Utara, didukung oleh Angkatan Darat dan menuntut pergerakan menuju Siberia. Nanshin-ron, Doktrin Ekspansi ke Selatan, didukung oleh Angkatan Laut dan menargetkan koloni-koloni kaya bangsa Eropa di Asia Tenggara dan Pasifik.\n\nDan tentu saja, selalu ada Tiongkok. Jepang memiliki kekuatan militer yang tangguh, namun industrinya haus akan sumber daya dan waktu semakin mendesak. Jalan manakah yang akan dipilih?"
 SOV_GATHERING_STORM_DESC: "Saat debu mereda usai Perang Saudara Rusia, Uni Soviet muncul sebagai penguasa mutlak atas sebagian besar wilayah yang dulunya merupakan Kekaisaran Rusia. Industrialisasi kilat dan kolektivisasi menyusul, sering kali dengan mengorbankan begitu banyak nyawa manusia.\n\nKini Uni Soviet dihadapkan pada ancaman kebangkitan Jerman di barat, dan agresi Jepang di timur. Dan tentu saja, ada pula ancaman internal di dalam jajaran Partai Komunis yang harus dihadapi..."
 USA_GATHERING_STORM_DESC: "Amerika Serikat kembali menarik diri ke dalam isolasi di akhir perang lalu dan menikmati masa kemakmuran ekonomi selama era Roaring Twenties. Hal itu berakhir secara dramatis ketika bangsa ini dilanda Depresi Besar.\n\nKebijakan non-intervensi Amerika dalam perang luar negeri masih berdiri teguh, namun ketegangan kian memuncak di Eropa maupun Asia. Sang 'Raksasa Netral' mungkin akan terseret ke dalam pusaran badai, suka ataupun tidak."
 OTHER_GATHERING_STORM_DESC: "Bangsa-bangsa di dunia, besar maupun kecil, tidak semuanya puas hanya berdiam diri menanti meletusnya konflik global lainnya. Mulai dari negara-negara besar di ambang perang saudara hingga banyak negara yang terbentuk dan bertransformasi akibat Perang Besar, semuanya harus mengambil keputusan sulit dan menyeimbangkan idealisme dengan pragmatisme demi memengaruhi masa depan dunia."
 POL_GATHERING_STORM_DESC: "Setelah berabad-abad bangsa Polandia terpecah di antara tiga kekaisaran, Polandia kini berdiri merdeka kembali. Namun posisinya bukanlah posisi yang mudah.\n\nDi timur, Uni Soviet belum melupakan kekalahan memalukan dalam Perang Polandia-Soviet.\n\nDi barat, Führer Jerman Adolf Hitler tak merahasiakan hasratnya akan lebih banyak 'ruang hidup' (Lebensraum) - dan wilayah bekas Jerman yang kini berada di bawah kendali Polandia akan menjadi langkah pertama untuk mewujudkannya."
 CAN_GATHERING_STORM_DESC: "Kanada memasuki Perang Besar sebagai koloni biasa dan meninggalkannya sebagai sebuah bangsa. Terlahir dari lumpur Passchendaele, Kanada kini mengambil langkah-langkah pertamanya yang penuh keraguan di panggung dunia.\n\nTertatih-tatih akibat Depresi Besar serta perpecahan internal antara penutur bahasa Inggris dan Prancis, masa depan bangsa baru ini tampak jauh dari kata aman."
 AST_GATHERING_STORM_DESC: "Rakyat Australia menorehkan tempat mereka dalam buku sejarah Perang Besar dengan darah. Pengorbanan yang dilakukan dalam kampanye Gallipoli belum dilupakan - begitu pula mereka yang memerintahkannya.\n\nAustralia kini berada di persimpangan jalan: haruskah ia tetap bersama tuan koloninya, yang akan segera terseret ke dalam konflik lain di Eropa yang jauh, ataukah fokusnya harus diarahkan pada ancaman-ancaman yang muncul lebih dekat dari tanah airnya sendiri?"
 AST_BLITZKRIEG_TAOG_DESC: "Dari peristirahatannya, para digger bangkit kembali, mengusap kantuk dari mata mereka seiring berkobarnya semangat ANZAC. Saat warga Australia mengenakan seragam mereka dan mengucapkan selamat tinggal sekali lagi kepada tanah air, bayang-bayang perang menggantung di udara bagai pistol start yang menunggu untuk ditembakkan.\n\nAkankah investasi militer beberapa tahun terakhir cukup untuk menahan ancaman dari Eropa maupun Asia, dan mampukah Britania menepati janjinya kepada Australia di saat kekuatannya tersebar tipis di seluruh dunia? Banyak pertanyaan tersisa, namun satu hal selalu pasti: ketika pertempuran harus dihadapi, Australia akan selalu hadir di sana untuk bertempur."
 SAF_GATHERING_STORM_DESC: "Ketika Perang Besar meletus, banyak warga Afrika Selatan menolak mengangkat senjata demi tuan Britania mereka. Militer Afrika Selatan menghabiskan sebagian besar Perang Besar mengejar pasukan Jerman di koloni-koloni Afrika dengan hasil terbatas.\n\nKini perang baru membayangi di cakrawala. Dulu maupun sekarang, ada pihak di Afrika Selatan yang menganggap negara ini seharusnya tidak memerangi bangsa Jerman sama sekali. Beberapa bahkan meyakini bahwa saatnya telah tiba bagi para keturunan Boer untuk merebut kebebasan yang pernah dirampas dari para leluhur mereka."
 NZL_GATHERING_STORM_DESC: "Negara kecil di Pasifik Selatan ini bertempur dengan gagah berani dalam Perang Besar, menderita korban jiwa yang tinggi dalam pertempuran berdarah di Gallipoli dan di front barat. Hampir separuh pria usia tempur bertugas di medan laga seberang lautan, dan banyak yang tak pernah kembali pulang.\n\nKira-kira dua puluh tahun setelah berakhirnya Perang Besar, rakyat Selandia Baru memandang dengan cemas ke panggung dunia, karena kali ini, ancaman perang terasa semakin mendekat ke rumah mereka sendiri..."
 RAJ_GATHERING_STORM_DESC: "Permata mahkota Imperium Britania, Kemaharajaan India (British Raj) adalah perpaduan aneh antara kekuasaan kekaisaran dan ketidakberdayaan kekaisaran. Segelintir elit pegawai negeri Britania memerintah anak benua luas yang dihuni oleh ratusan juta rakyat jelata. Dari jajaran merekalah direkrut Angkatan Darat India, yang bertempur dengan gagah berani dalam Perang Besar.\n\nPara pemimpin India berharap bahwa pengorbanan yang diberikan dalam perang terdahulu akan membantu India meraih kemerdekaannya dari Britania, namun sejauh ini harapan itu kandas. Dengan membayangnya perang baru, banyak yang meyakini bahwa saatnya telah tiba untuk merebut kebebasan itu - dengan cara apa pun yang diperlukan."
 SWI_GATHERING_STORM_DESC: "Swiss memiliki keunikan tersendiri di antara bangsa-bangsa di Eropa. Ia berdiri sebagai bangsa multikultural dan terdesentralisasi yang didasarkan pada prinsip saling menghormati dan saling mendukung.\n\nNetralitas teguh yang dipegangnya berhasil bertahan melewati Perang Besar, dan setelah menyaksikan kengerian tersebut dari kejauhan, ia kian yakin akan perlunya mempertahankan diri. Seiring bayang-bayang perang kian mendekat, bangsa yang damai ini harus memilih: tetap netral dan menangkal penyerbu mana pun melalui Netralitas Bersenjata, membentuk aliansi terpaksa dengan salah satu tetangganya, atau secara proaktif menumpas musuh-musuhnya sebelum mereka berani berpikir untuk mengusik."
 SWI_BLITZKRIEG_DESC: "Swiss berada dalam situasi genting bahkan sebelum Anschluss, namun kini setelah Reich Jerman merasakan kemudahan ekspansi ke wilayah-wilayah berbahasa Jerman lainnya, ada bahaya nyata bahwa negara Alpen yang damai ini adalah sasaran berikutnya. Kini lebih dari sebelumnya, netralitas mutlak Swiss akan diuji, dan jika segalanya memburuk, bahkan mungkin pertahanannya pun demikian."
 BLITZKRIEG_NAME: "Serangan Kilat"
 BLITZKRIEG_DESC: "Dalam beberapa tahun terakhir dunia telah menyaksikan beberapa perang baru meletus di Eropa dan Asia. Spanyol kini diperintah oleh kaum nasionalis dan Jepang telah bertempur melawan Uni Soviet dan Tiongkok demi wilayah, di mana pertempuran melawan Tiongkok lebih menguntungkan bagi Jepang. Pakta non-agresi baru antara Uni Soviet dan Jerman bisa menjadi kabar buruk bagi seluruh Eropa."
 ENG_BLITZKRIEG_DESC: "Meskipun Britania Raya keluar sebagai pemenang dalam Perang Besar, fondasi kekaisaran agungnya terguncang hingga ke akarnya. Satu generasi pemuda terbaik bangsa gugur di parit-parit Flandria dan Prancis Utara, sementara keresahan meluas ke seluruh Persemakmuran dan utang menumpuk luar biasa.\n\nDengan trauma perang sebelumnya yang masih segar dalam ingatan, negara ini kini menghadapi prospek perang lainnya. Semakin jelas bahwa tidak akan ada Perdamaian untuk Zaman Kita."
 FRA_BLITZKRIEG_DESC: "Dengan Perang Besar yang masih segar dalam ingatan, Prancis menghadapi konflik baru setelah Jerman menunjukkan bahwa mereka tak berniat menjaga perdamaian. Memperkuat pertahanan perbatasan dan memilih Sekutu secara bijak mungkin merupakan cara bagi Prancis untuk menghindari perang yang membawa bencana.\n\nPrancis pernah menang sebelumnya, kali ini pun tak akan ada bedanya!"
 GER_BLITZKRIEG_DESC: "Setelah remiliterisasi Rheinland, Prancis dan Britania menjadi semakin curiga terhadap niat Jerman. Perjanjian Munich memberi izin kepada Jerman untuk menganeksasi Sudetenland demi rakyat Jermannya. Pakta Molotov-Ribbentrop menjamin non-agresi antara Jerman dan Uni Soviet, sekaligus mengatur pembagian wilayah Polandia di antara kedua negara.\n\nJerman telah menunggu terlalu lama untuk saat ini. Waktunya bertindak adalah sekarang!"
 JAP_BLITZKRIEG_DESC: "Perang tengah berkecamuk di Asia Timur. Meskipun Jepang menderita sejumlah kekalahan di awal tahun '39, sebagian besar wilayah Tiongkok kini berada di bawah kendali Jepang. Ketegangan kian memuncak di Eropa, dan selagi Uni Soviet memusatkan perhatian pada urusan-urusan tersebut, mereka tidak akan mencampuri perang di Asia.\n\nSaat sumber daya Tiongkok berada di tangan Jepang, Uni Soviet akan mudah diatasi."
 ITA_BLITZKRIEG_DESC: "Mussolini, diktator Italia, sempat meraih ketenaran sebagai pembawa damai atas perannya dalam Perjanjian Munich setahun silam. Namun, ekspansi teritorial Jerman menyadarkan Italia bahwa masih banyak wilayah yang bisa diklaim jika kesepahaman dengan Jerman dapat dicapai.\n\nAlbania telah ditaklukkan sekadar sebagai unjuk kemampuan militer Italia, dan seisi dunia patut merasa cemas."
 SOV_BLITZKRIEG_DESC: "Dukungan terhadap Manuel Azaña dan 'Republik Spanyol Kedua' selama Perang Saudara Spanyol telah dengan jelas menunjukkan posisi Uni Soviet terhadap Italia dan Jerman. Kemenangan atas tentara Jepang dalam beberapa konflik perbatasan baru-baru ini membuat Uni Soviet saat ini tampak sebagai kekuatan yang terlampau besar untuk ditentang oleh negara mana pun sendirian.\n\nJanji Jerman untuk membagi Negara-Negara Baltik dan Polandia disambut baik saat ini."
 USA_BLITZKRIEG_DESC: "Meningkatnya ketegangan di Eropa sangat mengkhawatirkan. Kendati belum menjadi ancaman nyata bagi Amerika Serikat, agresi yang ditunjukkan Jerman akan segera menggema ke seluruh penjuru dunia. Selagi situasi cukup damai di barat, persiapan militer bukanlah gagasan yang buruk dengan mempertimbangkan segalanya.\n\nJika Amerika Serikat terseret ke dalam perang lain, merekalah yang akan mengakhirinya."
 OTHER_BLITZKRIEG_DESC: "Bangsa-bangsa di dunia, besar maupun kecil, tidak semuanya puas hanya berdiam diri menanti meletusnya konflik global lainnya. Mulai dari negara-negara besar di ambang perang saudara hingga banyak negara yang terbentuk dan bertransformasi akibat Perang Besar, semuanya harus mengambil keputusan sulit dan menyeimbangkan idealisme dengan pragmatisme demi memengaruhi masa depan dunia."
