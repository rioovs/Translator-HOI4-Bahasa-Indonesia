 RAJ_BLITZKRIEG_DESC: "Permata mahkota Imperium Britania, Kemaharajaan India (British Raj) adalah perpaduan aneh antara kekuasaan kekaisaran dan ketidakberdayaan kekaisaran. Segelintir elit pegawai negeri Britania memerintah anak benua luas yang dihuni oleh ratusan juta rakyat jelata. Dari jajaran merekalah direkrut Angkatan Darat India, yang bertempur dengan gagah berani dalam Perang Besar.\n\nPara pemimpin India berharap bahwa pengorbanan yang diberikan dalam perang terdahulu akan membantu India meraih kemerdekaannya dari Britania, namun sejauh ini harapan itu kandas. Dengan membayangnya perang baru, banyak yang meyakini bahwa saatnya telah tiba untuk merebut kebebasan itu - dengan cara apa pun yang diperlukan."
 CZE_GATHERING_STORM_DESC: "Selama Perang Besar, pasukan Ceko bertempur bersama pasukan Entente di seantero Eropa demi mengamankan pengakuan atas bangsa mereka. Upaya mereka membuahkan hasil dan Cekoslowakia bangkit dari abu Kekaisaran Austria-Hongaria.\n\nSejak kelahirannya yang gemilang sebagai sebuah negara, Cekoslowakia membentuk aliansi 'Entente Kecil' bersama Yugoslavia dan Rumania dengan tujuan meredam upaya Hongaria untuk memulihkan Kekaisaran Austria-Hongaria, meskipun seiring bangkitnya kekuatan Jerman, lanskap politik Eropa kini berubah dengan cepat."
 HUN_GATHERING_STORM_DESC: "Sebagai separuh bagian dari bekas Kekaisaran Austria-Hongaria, Hongaria diperlakukan sebagai musuh yang kalah oleh pihak Entente pemenang usai Perang Besar. Dalam Perjanjian Trianon, negara ini kehilangan hampir dua pertiga wilayahnya. Jutaan etnis Hongaria mendapati diri mereka terdampar di luar perbatasannya, dan ekonominya hancur lebur. Pembatasan persenjataan yang ketat dimaksudkan untuk memastikan Hongaria tak akan pernah lagi mengancam perdamaian di Eropa.\n\nNamun seiring bergesernya iklim politik di Eropa, saatnya mungkin telah tiba untuk memulihkan ketidakadilan masa lalu dan merebut kembali kejayaan bangsa terdahulu."
 ROM_GATHERING_STORM_DESC: "Rumania mendapati dirinya berada di pihak pemenang dalam Perang Besar, dan sebagai hasilnya memperoleh wilayah dan penduduk baru - yang tidak semuanya merupakan orang Rumania. Demi membentengi diri dari hasrat revansionis negara-negara yang dipaksa menyerahkan tanah, Rumania membentuk jejaring aliansi di seluruh Balkan. Namun dalam beberapa tahun terakhir, negara ini lebih disibukkan oleh urusan domestik, dan pemerintahan Raja Carol II membiarkan aliansi-aliansi tersebut terbengkalai.\n\nSeiring berubahnya situasi politik di Eropa, Rumania bisa jadi mendapati dirinya berdiri seorang diri - dan rentan."
 HUN_BLITZKRIEG_DESC: "Sebagai separuh bagian dari bekas Kekaisaran Austria-Hongaria, Hongaria diperlakukan sebagai musuh yang kalah oleh pihak Entente pemenang usai Perang Besar. Dalam Perjanjian Trianon, negara ini kehilangan hampir dua pertiga wilayahnya. Jutaan etnis Hongaria mendapati diri mereka terdampar di luar perbatasannya, dan ekonominya hancur lebur. Pembatasan persenjataan yang ketat dimaksudkan untuk memastikan Hongaria tak akan pernah lagi mengancam perdamaian di Eropa.\n\nNamun seiring bergesernya iklim politik di Eropa, saatnya mungkin telah tiba untuk memulihkan ketidakadilan masa lalu dan merebut kembali kejayaan bangsa terdahulu."
 ROM_BLITZKRIEG_DESC: "Rumania mendapati dirinya berada di pihak pemenang dalam Perang Besar, dan sebagai hasilnya memperoleh wilayah dan penduduk baru - yang tidak semuanya merupakan orang Rumania. Demi membentengi diri dari hasrat revansionis negara-negara yang dipaksa menyerahkan tanah, Rumania membentuk jejaring aliansi di seluruh Balkan. Namun dalam beberapa tahun terakhir, negara ini lebih disibukkan oleh urusan domestik, dan pemerintahan Raja Carol II membiarkan aliansi-aliansi tersebut terbengkalai.\n\nSeiring berubahnya situasi politik di Eropa, Rumania bisa jadi mendapati dirinya berdiri seorang diri - dan rentan."
 YUG_GATHERING_STORM_DESC: "Yugoslavia terbentuk setelah Negara Serbia, Kroasia, dan Slovenia yang baru bergabung dengan Kerajaan Serbia yang sebelumnya merdeka pada tahun 1922. Awalnya Yugoslavia bergabung dengan Entente Kecil dan Pakta Balkan untuk mengamankan kemerdekaannya, namun akhir-akhir ini pembunuhan Raja Aleksander dipadukan dengan meningkatnya tekanan internal dari kaum nasionalis serta tekanan eksternal dari Italia dan Jerman telah memicu gejolak drastis dan evaluasi ulang atas posisi politik dan strategis mereka."
 YUG_BLITZKRIEG_DESC: "Yugoslavia terbentuk setelah Kerajaan Serbia, Kroasia, dan Slovenia yang baru bergabung dengan Kerajaan Serbia yang sebelumnya merdeka pada tahun 1922. Awalnya Yugoslavia bergabung dengan Entente Kecil dan Pakta Balkan untuk mengamankan kemerdekaannya, namun akhir-akhir ini meningkatnya tekanan internal dari kaum nasionalis serta tekanan eksternal dari Italia dan Jerman telah memicu gejolak drastis dan evaluasi ulang atas posisi politik dan strategis mereka."
 CHI_GATHERING_STORM_DESC: "Menyusul revolusi yang menggulingkan kaisar Qing terakhir, Republik Tiongkok yang masih belia berjuang keras untuk bertahan hidup. Para panglima perang menguasai sebagian besar wilayah di pelosok. Di jantung negeri, kaum Komunis mendirikan wilayah pangkalan di lembah pegunungan terpencil. Tepat di seberang perbatasan, pihak Jepang membentuk pemerintahan boneka di bawah kaisar Tiongkok terakhir dan berupaya menyatukan kembali negeri di bawah kekuasaannya.\n\nDengan banyaknya musuh yang mengancam, pemerintahan Chiang Kai-shek harus mengambil keputusan sulit jika ingin bertahan dan berkuasa mutlak di Tiongkok."
 PRC_GATHERING_STORM_DESC: "Hanya dua tahun silam, Partai Komunis Tiongkok menghadapi pemusnahan total. Demi bertahan hidup, partai ini menempuh perjalanan epik yang kelak dikenal sebagai Mars Panjang (Long March). Dengan hanya sebagian kecil pasukan yang selamat dari beratnya perjalanan dan industri yang minim, prospek kemenangan dalam Perang Saudara Tiongkok memang sangat tipis.\n\nNamun seiring waktu, rakyat dapat dirangkul demi perjuangan Komunis, pasukan baru dihimpun, pangkalan baru didirikan, dan manakala saatnya tepat, perjuangan revolusioner akan diperbarui kembali hingga kemenangan akhir tercapai."
 CHI_BLITZKRIEG_DESC: "Setelah dua tahun berperang melawan Jepang, tentara Chiang Kai-shek telah berdarah-darah mencoba menahan serangan tersebut. Musuh telah menduduki daerah-daerah terkaya di negeri ini. Bantuan minim datang dari negara-negara demokrasi barat, dan pihak Komunis tampak enggan menghadapi musuh dalam pertempuran terbuka.\n\nDengan perang yang mengancam akan meluas lebih jauh, tampaknya hal terburuk masih akan tiba. Namun seiring melambatnya serangan Jepang akibat luasnya negeri, mereka mungkin akan mengalihkan pandangan ke arah lain, dan aliansi baru mungkin masih dapat membalikkan keadaan..."
 PRC_BLITZKRIEG_DESC: "Menghadapi serangan habis-habisan Jepang, kaum Nasionalis dan Komunis menyepakati gencatan senjata yang rentan. Kedua belah pihak sadar betul bahwa Front Persatuan ini tak akan bertahan lama. Wilayah pangkalan Komunis di Yan'an kini menjadi garis depan dalam perang melawan Jepang.\n\nKaum Komunis harus mengelola sumber dayanya dengan hati-hati jika ingin bertahan hidup. Setiap korban yang jatuh dalam pertempuran melawan Jepang akan terasa dua kali lipat lebih berat saat tiba waktunya berperang melawan kaum Nasionalis, dan ini bisa jadi merupakan hal yang sangat diharapkan oleh pemerintahan Chiang Kai-shek..."
 MAN_GATHERING_STORM_DESC: "Tersingkir dari Takhta Naga pada usia enam tahun, Puyi, kaisar Tiongkok terakhir, menunggu saat yang tepat. Di saat bekas wilayah kekuasaannya mencabik-cabik dirinya sendiri dalam Perang Saudara Tiongkok, Puyi menemukan sekutu baru di Jepang.\n\nBagi Puyi, pendirian Kekaisaran Manchukuo pada tahun 1932 barulah langkah awal dalam upaya merebut kembali hak waris leluhurnya. Untuk saat ini, ia bergantung pada Tentara Jepang untuk mempertahankan kekuasaannya, namun seiring waktu, peluang mungkin muncul untuk melepaskan belenggu penghambaan dan menjadi sosok yang memang ditakdirkan baginya..."
 MAN_BLITZKRIEG_DESC: "Tersingkir dari Takhta Naga pada usia enam tahun, Puyi, kaisar Tiongkok terakhir, menunggu saat yang tepat. Di saat bekas wilayah kekuasaannya mencabik-cabik dirinya sendiri dalam Perang Saudara Tiongkok, Puyi menemukan sekutu baru di Jepang.\n\nBagi Puyi, pendirian Kekaisaran Manchukuo pada tahun 1932 barulah langkah awal dalam upaya merebut kembali hak waris leluhurnya. Untuk saat ini, ia bergantung pada Tentara Jepang untuk mempertahankan kekuasaannya, namun seiring waktu, peluang mungkin muncul untuk melepaskan belenggu penghambaan dan menjadi sosok yang memang ditakdirkan baginya..."
  MAN_TSR_GATHERING_STORM_DESC: "Kekaisaran Manchuria berdiri di atas fondasi yang rapuh. Dibentuk sebagai cara bagi pihak Jepang untuk melegitimasi kekuasaannya atas Manchuria pada tahun 1932, mereka memilih membiarkan Puyi menjadi kaisar atas negara baru mereka.\n\nPertanyaannya kini adalah apakah Puyi akan terus berdiam dalam bayang-bayang selagi Asosiasi Concordia dan Tentara Jepang memerintah negeri, ataukah ia akan mencoba merebut kembali kekuasaannya, yang pada gilirannya berpotensi kehilangannya sama sekali ke tangan sekelompok bandit yang juga menginginkan peran tersebut?"
 MAN_TSR_BLITZKRIEG_DESC: "Manchukuo, yang dulunya merupakan negara pecahan bentukan tentara Jepang di Tiongkok Utara, bergantung pada secuil legitimasi dengan mengangkat Puyi sebagai Kaisar dan kini telah menjadi anggota penuh Kawasan Kemakmuran Bersama Asia Timur Raya. Pertanyaannya sekarang adalah apakah negara ini akan tetap berada di tangan Asosiasi Concordia ataukah akan jatuh ke genggaman Puyi."
 WARLORDS_GATHERING_STORM_DESC: "Kelemahan Pemerintah Pusat mungkin memberikan kesempatan bagi orang yang cukup berambisi untuk merebut kekuasaan. Di pelosok negeri, para pemimpin lokal telah mendirikan wilayah kekuasaan mereka sendiri, tanpa memedulikan perintah Pemerintah Pusat.\n\nPerang membayangi di cakrawala, dan setiap Panglima Perang ini menghadapi pilihan pelik: Berkolaborasi dengan Pemerintah Pusat atau beraliansi dengan kaum Komunis? Kedua opsi menjanjikan peluang untuk ikut menentukan nasib bangsa, namun ada kemungkinan ketiga - merebut seluruh Tiongkok untuk diri mereka sendiri."
 WARLORDS_BLITZKRIEG_DESC: "Perang dengan Jepang telah memaksa para Panglima Perang Tiongkok untuk memilih kubu, namun tak diragukan lagi bahwa aliansi ini berjalan dengan waktu pinjaman. Harinya akan tiba ketika aliansi ini tak lagi berguna, dan pada hari itu permainan kembali terbuka bagi setiap orang yang cukup berambisi dan kejam untuk bersaing merebut gelar Penguasa Tiongkok."
 MEXICO_GATHERING_STORM_DESC: "Meksiko menghadapi dua dekade perang saudara usai penggulingan tiran Porfirio Díaz. Kaum sentralis bertempur melawan kaum regionalis, kaum petani dan sosialis bersatu melawan tuan tanah hacienda, dan perselisihan atas peran negara versus agama muncul dari catatan sejarah Abad Pencerahan untuk meneror Meksiko.\n\nPemerintahan sekuler berkeras telah memenangkan pertempuran-pertempuran ini, namun ia bertakhta di atas puing-puing kehancuran. Setelah Meksiko dibangun kembali, mungkin pemenang yang berbeda akan muncul ke permukaan."
 MEXICO_BLITZKRIEG_DESC: "Pemerintahan Lázaro Cárdenas telah membuktikan dirinya sebagai kekuatan yang lebih besar bagi perubahan sosial positif dibanding pendahulunya, Presiden Plutarco Calles, yang kini diasingkan ke Amerika. Dengan situasi ekonomi yang stabil dan perusahaan-perusahaan minyak asing diambil alih oleh negara, pemerintah Meksiko dapat mulai memandang ke luar. Amerika menghadapi musuh di banyak front dan kemungkinan besar akan memaafkan nasionalisasi Standard Oil, namun musuh-musuh tersebut mungkin jauh lebih menguntungkan untuk dijadikan kawan..."
 NETHERLANDS_GATHERING_STORM_DESC: "Pemerintah Belanda memandang meningkatnya ketegangan global dengan rasa cemas. Terjepit di antara ekonomi yang terpuruk, gerakan pasifis yang kuat, dan keyakinan teguh pada netralitas hingga menjauhkan calon-calon sekutu, mereka tak mampu mempersiapkan pertahanan dengan memadai.\n\nPada saat yang sama, pentingnya Belanda sebagai pintu gerbang perdagangan menuju benua membuat Britania maupun Jerman menginginkan 'kerja sama' Belanda demi menggagalkan pihak lawan, dan penolakan dapat dianggap sebagai alasan permusuhan. Barangkali mundur ke koloni-koloni adalah satu-satunya cara yang memungkinkan untuk melawan invasi semacam itu..."
 NETHERLANDS_BLITZKRIEG_DESC: "Perang antara Jerman dan kekuatan-kekuatan besar Eropa lainnya tampak tak terhindarkan, dan meskipun Belanda kembali menggantungkan harapannya pada netralitas, para pemimpinnya tengah mempertimbangkan rencana staf rahasia bersama tetangga selatan mereka sebagai persiapan menghadapi kemungkinan pecahnya permusuhan.\n\nTentara telah dimobilisasi, dan pembangunan garis pertahanan Belanda dipercepat dalam upaya mempersiapkan negara sebaik mungkin demi menangkal pelanggaran kedaulatan apa pun. Jika ini gagal, koloni-koloni selalu tersedia..."
 SPAIN_GATHERING_STORM_DESC: "Dalam lima tahun pertama berdirinya, Republik Spanyol Kedua yang masih muda telah dihadapkan pada aksi mogok, upaya kudeta militer, dan pemberontakan revolusioner besar. Kendati berhasil melewati tantangan-tantangan ini, masyarakat Spanyol terus dirundung polarisasi politik dan kekerasan antara kaum anarkis, komunis, dan falangis.\n\nKedua belah pihak menatap pemilu 1936 mendatang dengan penuh harap, namun kemenangan salah satu pihak tampaknya mustahil memulihkan stabilitas. Dan selagi kekerasan terus berlanjut, militer menanti dan menyusun siasat..."
 SPAIN_BLITZKRIEG_DESC: "Perang saudara yang meluluhlantakkan negeri selama tiga tahun terakhir akhirnya usai. Di bawah kepemimpinan Franco, para pemenang kini harus mengurus pemulihan Spanyol, menumpas kantong-kantong perlawanan yang tersisa, dan merajut kembali perpecahan yang timbul akibat perang.\n\nNamun waktu sangat terbatas, karena dunia terus bergerak menuju apa yang niscaya akan menjadi perang yang jauh lebih besar dan berdarah. Jika Spanyol ingin mempertahankan posisinya, apalagi memetik buah kesempatan dari konflik mendatang, ia harus mempersiapkan industri dan militernya tanpa penundaan."
 PORTUGAL_GATHERING_STORM_DESC: "Sejak naiknya Salazar ke tampuk kekuasaan pada tahun 1932, Portugal secara bertahap menjauhkan diri dari periode Republik Pertama yang tidak stabil. Otonomi Fiskal dan Independensi Politik dari kekuatan-kekuatan besar mendorong lahirnya Estado Novo, yang meletakkan fondasi bagi pembangunan industri Portugal dan modernisasi militernya.\n\nKini, Portugal harus menentukan arah langkahnya di tengah ketidakstabilan politik dan sosial yang kian memanas di negara tetangga Spanyol serta ketegangan internasional yang terus memburuk..."
 PORTUGAL_BLITZKRIEG_DESC: "Pemerintahan konservatif Salazar memungkinkan Portugal untuk tetap netral selama Perang Saudara Spanyol sembari secara aktif mendukung kaum Nasionalis, sehingga memastikan kekalahan kaum Komunis dan Anarkis.\n\nKini setelah Semenanjung Iberia akhirnya meraih stabilitas, saatnya memandang ke luar negeri untuk mencari calon sekutu dan mempertimbangkan peran yang akan dimainkan Portugal dalam konflik dunia yang tampaknya tak terhindarkan."
 LIT_GATHERING_STORM_DESC: "Dengan Polandia yang masih berhasrat menjebak Lituania ke dalam Persemakmuran baru, Soviet yang menolak mengakui hak penentuan nasib sendiri Lituania, serta ancaman Nazi yang kian membesar di wilayah Memel, seorang veteran perang kemerdekaan bangkit demi menjaga stabilitas dan kemerdekaan bangsa Lituania. Dengan sumber daya terbatas yang dimilikinya, Antanas Smetona memimpin sebuah rezim yang rapuh; sementara paramiliter fasis Serigala Besi berkeliaran di pedesaan, murka atas dipenjarakannya pemimpin mereka: Augustinas Voldemaras. Dengan perang di depan mata, Lituania harus mempertahankan rakyatnya, apa pun taruhannya."
 LIT_BLITZKRIEG_DESC: "Panggung telah disiapkan. Antanas Smetona telah mengukuhkan kediktatorannya dan impian untuk memulihkan Republik Lituania sudah jauh di luar jangkauan. Kesepakatan telah dicapai dengan pihak Soviet untuk mengembalikan Vilnius ke Lituania setelah pembagian Polandia, namun sejauh mana Smetona dapat memercayai Stalin dan mesin perangnya yang haus kekuasaan untuk menghormati kedaulatan Lituania selamanya?"
 LAT_GATHERING_STORM_DESC: "Dua tahun telah berlalu sejak Kudeta Mei dan Latvia masih berada dalam situasi yang serba tak pasti. Kārlis Ulmanis yang pernah menjabat sebagai Perdana Menteri Latvia kini mengangkat dirinya sebagai diktator, dengan para pendukung demokrasi menentang keras serangan terhadap kebebasan Latvia ini. Organisasi fasis Pērkonkrusts kian bergolak akibat penangkapan pemimpin mereka, Gustavs Celmiņš, dan jika kediktatoran tidak segera membasmi ancaman ini, Latvia berisiko terjerumus ke dalam perang saudara.\n\nDengan ancaman dari Timur dan Barat, Latvia mendapati dirinya berjalan di ujung mata pisau antara kemenangan dan kehancuran."
 LAT_BLITZKRIEG_DESC: "Ketergantungan Latvia yang berlebihan pada perdagangan Soviet akhirnya berbalik menjerat leher sang diktator. Uni Soviet dan Reich Jerman telah memperlihatkan taringnya dan mengintai Ulmanis dari dekat. Mobilisasi kilat mutlak diperlukan jika kemerdekaan Latvia ingin dipertahankan, kecuali jika sang diktator lebih memilih bertekuk lutut dan memohon belas kasihan kepada Soviet..."
 EST_GATHERING_STORM_DESC: "Dengan ancaman komunis di Timur dan fasis di Selatan, Konstantin Päts dan Isamaaliit telah mengambil alih kendali penuh atas bangsa demi mengamankan masa depan Estonia. Sekelompok veteran Perang Kemerdekaan Estonia menghimpun diri ke dalam gerakan yang dikenal sebagai Vaps; kaum populis sayap kanan yang berupaya merebut kendali negara dari tangan kaum netral.\n\nMasa depan Estonia masih belum menentu. Akankah Päts menjaga perdamaian dan menghadirkan Era Keheningan, ataukah Vaps akan mengambil alih kekuasaan dan mendirikan negara Estonia yang baru?"
 EST_BLITZKRIEG_DESC: "Estonia terjebak di antara Ancaman Merah di Timur dan lautan, serta mendapati dirinya tanpa bantuan dari sekutu-sekutu masa lalunya. Kendati kapitulasi tampak tak terelakkan, bangsa Estonia mungkin dapat bertahan; baik sebagai bawahan Uni Soviet atau sebagai gerakan perlawanan bawah tanah yang bergerilya dari hutan-hutan."
 BUL_GATHERING_STORM_DESC: "Sejak Perang Pembebasan tahun 1878 dan penolakan Perjanjian San Stefano oleh negara-negara demokrasi Barat, Bulgaria telah melewati sejarah panjang konflik dan pengkhianatan di Balkan. Sebagai anggota Blok Sentral yang kalah dalam Perang Besar, Bulgaria menderita kerugian wilayah yang besar dan Perjanjian Neuilly-sur-Seine memaksakan sanksi ekonomi yang berat serta pembatasan militer yang ketat.\n\nNamun dengan perubahan politik dan sosial besar yang tengah terjadi di Eropa, kini saatnya bagi Bulgaria untuk memilih jalannya sendiri dan menemukan tempat yang layak baginya di Balkan."
 BUL_BLITZKRIEG_DESC: "Selama beberapa tahun terakhir, Tsar Boris telah mengonsolidasikan kekuasaannya, membubarkan organisasi konspiratif Zveno dan mengarahkan kembali politik luar negeri Bulgaria ke arah Jerman. Negosiasi terkini dengan para tetangga Balkan membuat Britania Raya mencabut pembatasan militer yang dipaksakan usai Perang Besar, demi mencegah Bulgaria bergabung dengan kekuatan Poros.\nKini sang Tsar berupaya merebut kembali wilayah-wilayah yang hilang di masa lalu tanpa menyeret negaranya ke dalam konflik baru, namun dengan ketegangan internasional yang kian memuncak di Eropa, masih harus dilihat apa yang akan terjadi pada masa depan Bulgaria..."
 GRE_GATHERING_STORM_DESC: "Yunani adalah bangsa dalam krisis. Kaum royalis dan republikan terus berselisih sengit memperebutkan jiwa bangsa yang berujung pada pembubaran Republik Helenik Kedua pada tahun 1935. Sang raja, seorang tokoh asing yang otokratis, tetap menjadi figur yang sangat memecah belah dengan masa depan yang tak menentu.\n\nTerganggu oleh politik domestik yang remeh, Bulgaria yang menyimpan dendam revansionis dibiarkan mengintai di utara, sementara musuh bebuyutan sekaligus sekutu baru Yunani, Turki, tengah mengalami metamorfosis politik di timur, belum lagi monster yang mulai bergerak di seberang Laut Adriatik..."
 GRE_BLITZKRIEG_DESC: "Di bawah tangan dingin diktator Ioannis Metaxas, stabilitas telah kembali ke Yunani. Rencana Empat Tahun memungkinkan basis industri Yunani tumbuh pesat dalam beberapa tahun terakhir, dan utang negara - meski masih teramat tinggi - tampaknya cukup terkendali.\n\nSayangnya, pemerintahan yang kuat dan kebijakan ekonomi yang masuk akal mungkin sia-sia bagi bangsa yang terancam ini. Perang yang dahsyat membayangi di cakrawala, dan kendati Metaxas berkeras bahwa Yunani akan mempertahankan netralitasnya dalam setiap kemungkinan konflik mendatang, keputusan akhir mungkin bukanlah miliknya..."
 TUR_GATHERING_STORM_DESC: "Dari abu Kekaisaran Utsmaniyah, Republik Turki terlahir. Kemerdekaan Turki direbut dengan darah dan peluru dalam Kampanye Nasional tahun 1923, dan meski perjuangan tersebut mulia, pengorbanannya terus membebani rakyat Turki.\n\nKaum konservatif religius bercokol di pelosok dan menolak keras upaya modernisasi nasional, sementara kaum nasionalis Kurdi memicu kekacauan di bagian timur negeri. Presiden yang diagungkan, Mustafa Kemal Atatürk, harus menyatukan bangsa atau meneruskan tongkat estafet kepada pemimpin yang mampu, dan mereka harus bertindak cepat seiring berkecamuknya prahara di Eropa..."
 TUR_BLITZKRIEG_DESC: "Sang Bapak Bangsa Turki, Mustafa Kemal Atatürk, telah berpulang. Turki dirundung duka, kini dipimpin oleh negarawan terhormat İsmet İnönü. İnönü mewarisi negeri yang terpecah belah, di mana perpecahannya kian nyata setelah kepergian sang pelita penuntun.\n\nDi luar masalah domestik, İnönü juga menghadapi bayang-bayang perang di Eropa yang mengancam akan melampaui Perang Besar dalam hal kehancuran. Atatürk kerap mendengungkan semboyan, \"Damai di Rumah, Damai di Dunia.\" Mampukah İnönü menjaga perdamaian di masa-masa penuh pergolakan ini?"
 ETH_GATHERING_STORM_DESC: "Etiopia memiliki sejarah yang membentang berabad-abad lamanya dan dinasti kekaisaran yang sepadan. Kendati Haile Selassie telah mengambil langkah besar untuk memodernisasi kekaisaran, proses tersebut terhenti saat Etiopia diserang oleh Italia untuk kedua kalinya dalam 40 tahun. Situasinya suram, namun jika seluruh kekaisaran bersatu padu, mereka dapat memukul mundur para penyerbu sekali lagi.\n\nAgar Etiopia tetap merdeka, seluruh Afrika Timur harus dibebaskan dari belenggu kekuasaan bangsa Eropa, untuk selama-lamanya."
 AFA_GATHERING_STORM_DESC: "Rakyat Afar telah lama mendiami Gurun Danakil yang luas, membentang dari Jibuti di timur hingga Etiopia di barat. Namun akhir-akhir ini, Italia kian menancapkan pengaruhnya atas wilayah tersebut, dengan Mohammed Yayyo yang lebih condong ke Benito Mussolini ketimbang Haile Selassie.\n\nDengan berkecamuknya Perang Italia-Etiopia kedua, tampaknya sebuah sikap harus segera diambil dalam waktu dekat: akankah masa depan Afar berada di pihak Italia, ataukah mereka akan lebih baik berdiri sendiri?"
 FIN_GATHERING_STORM_DESC: "Finlandia adalah negara muda yang meraih kemerdekaannya dari Rusia pada tahun 1917, disusul oleh perang saudara yang berdarah. Bekas luka perang tersebut masih segar, dan pemerintah koalisi masih tertatih-tatih untuk bekerja sama secara efektif. Uni Soviet tampak mengincar wilayah Finlandia yang berdekatan dengan Leningrad, dan Finlandia kurang siap menghadapi potensi konflik, namun ia memiliki sejarah panjang keberanian dan tekad militer, serta prajurit-prajurit yang setia mati kepada tanah airnya.\n\nDengan memuncaknya ketegangan dan ancaman konflik yang membayangi, masa depan Finlandia kini berada di ujung tanduk."
 FIN_BLITZKRIEG_DESC: "Finlandia mendapati dirinya terjepit di antara Uni Soviet dan Jerman Nazi, dengan ketegangan di antara kedua kekuatan besar yang terus meningkat. Negosiasi dengan Uni Soviet telah kandas dan pemerintah kini menghadapi keputusan sulit perihal cara melindungi kedaulatan negara.\n\nUpaya telah dilakukan untuk memperkuat pertahanan Finlandia, namun tentaranya masih minim perlengkapan, serta angkatan udara dan lautnya nyaris tidak ada. Meski demikian, rasa bangga nasional yang kuat dan keberanian militer memberi Finlandia tekad baja untuk mempertahankan kemerdekaannya."
 SWE_GATHERING_STORM_DESC: "Meskipun tetap netral dalam Perang Besar, Swedia menderita banyak kesulitan akibat upaya Britania memblokade Jerman. Seiring meningkatnya ketegangan di benua Eropa, rakyat Swedia khawatir mereka akan kembali dipaksa menanggung derita di tangan kekuatan-kekuatan besar.\n\nSementara itu, Partai Sosial Demokrat berupaya menemukan keseimbangan antara menciptakan negara kesejahteraan yang dapat menopang rakyat yang kesusahan dan membangun daya gentar militer yang andal demi menjaga komitmen netralitas bangsa yang telah berusia seabad."
 SWE_BLITZKRIEG_DESC: "Gemuruh Perang Besar lainnya terdengar kian kencang setiap hari seiring Jerman mengikis perbatasan tetangga-tetangganya. Dengan kekuatan militeristik tersebut yang bergantung pada bijih besi Swedia, kekhawatiran kian memuncak bahwa ambisi teritorial mereka akan segera meluas melintasi Baltik menuju Skandinavia.\n\nDemi mengantisipasi ancaman semacam itu, militer Swedia telah mulai mempersenjatai diri dan memodernisasi kekuatannya berkat industri pertahanan dalam negeri yang berkembang pesat. Kini tinggal pembuktian apakah bangsa ini sanggup menangkal invasi musuh."
 NOR_GATHERING_STORM_DESC: "Sejak meraih kemerdekaan dari Swedia pada tahun 1905, Norwegia berjuang keras menemukan pijakan politiknya, dan baru sekarang mulai memperlihatkan tanda-tanda stabilitas politik dan pemulihan dari masa-masa sulit dekade 1930-an.\n\nKini di saat para tetangga di selatannya mulai berselisih dan perang tampak kian dekat, Norwegia harus menemukan jalan untuk mempertahankan kemerdekaannya yang rapuh. Kabinet Nygaardsvold bertaruh pada netralitas dan pelucutan senjata agar tampak seharum dan seringan mungkin bagi kekuatan-kekuatan besar Eropa, namun ketepatan pendekatan ini masih harus dibuktikan."
 NOR_BLITZKRIEG_DESC: "Seiring membesarnya kekuatan dan wilayah Reich Ketiga, elemen-elemen fasis di dalam Norwegia tampak bersiap memanfaatkan kemungkinan invasi Jerman untuk merebut kendali atas negara dan berkolaborasi dengan musuh.\n\nVidkun Quisling, kaki tangan Partai Nazi yang tak berprinsip, tampak bersekongkol demi meraih kekuasaan bagi dirinya dan partainya, Nasjonal Samling. Kini saatnya persiapan segera dimulai, dan bagi Norwegia untuk bersatu demi menepis bahaya yang mengintai dari dalam maupun luar."
 DEN_GATHERING_STORM_DESC: "Seiring meningkatnya kembali ketegangan di Eropa, Denmark mendapati militernya lemah dan ekonominya masih porak-poranda akibat Depresi Besar.\n\nRakyat Denmark harus menemukan cara untuk mengatasi pengangguran yang tinggi serta gerakan ekstremis yang tumbuh di pinggiran politik, dan pada saat yang sama mengevaluasi kembali manfaat dari kebijakan netralitas dan peredaan (appeasement).\n\nDenmark saat ini masih menjadi penentu nasibnya sendiri, namun entah sampai kapan hal itu dapat bertahan."
 DEN_BLITZKRIEG_DESC: "Denmark berada dalam situasi genting dengan militer yang terabaikan akibat pemotongan anggaran tahun demi tahun demi meredam sang tetangga yang jauh lebih besar dan kuat, Jerman.\n\nNamun, kebijakan peredaan tersebut tidak menghalangi Reich Jerman untuk mengonsolidasikan kekuasaannya di Eropa dan mengklaim bangsa-bangsa lain. Denmark kini harus menggantungkan keyakinannya pada deklarasi netralitas, yang dulu menyelamatkan mereka dari bencana Perang Besar."
 ICE_GATHERING_STORM_DESC: "Islandia memiliki sejarah panjang keterpencilan dan penjelajahan. Sempat berpindah tangan dari pemilik terdahulunya Norwegia ke penguasa saat ini Denmark ketika Norwegia menjadi mitra junior Swedia pada tahun 1814, dan baru saja menerima pemerintahan mandiri pada tahun 1919.\n\nDengan Depresi Besar yang melanda Islandia, situasinya tampak suram, dan dengan konflik yang membayangi di cakrawala, mungkin sudah saatnya untuk berpaling dan memutuskan hubungan dengan Denmark untuk selamanya."
 ICE_BLITZKRIEG_DESC: "Dengan tuntutan-tuntutan terkini dari Jerman, semakin jelas dari hari ke hari bahwa situasi di Eropa sudah tak dapat dipertahankan, dan serangan terhadap Denmark hampir pasti tak terhindarkan.\n\nMengingat hal itu, masa depan Islandia berada di ujung tanduk, dan kemungkinan besar ia perlu mencari perlindungan dari pihak Amerika jika ingin tetap berada di luar konflik yang akan segera meletus."
 BRA_GATHERING_STORM_DESC: "Depresi Besar menghancurkan perekonomian Brasil akibat ketergantungan yang berlebihan pada ekspor. Tahun-tahun berikutnya diwarnai oleh meningkatnya pergolakan politik saat koalisi perwira militer, buruh, dan politisi menggulingkan oligarki yang memerintah negeri dan menggantikannya dengan konstitusi demokratis yang rapuh.\n\nGetúlio Vargas telah tampil di garis depan politik Brasil, baru-baru ini berhasil membendung kudeta komunis dan memegang kekuasaan darurat. Masih harus dilihat apakah demokrasi akan dipulihkan, ataukah Vargas akan membawa bangsa ke arah yang lebih otoriter."
 BRA_BLITZKRIEG_DESC: "Getúlio Vargas telah merebut kendali atas pemerintahan dan membekukan proses demokrasi. Dengan cengkeraman kekuasaan yang terkendali untuk saat ini, sang pemimpin Brasil kini mengalihkan perhatiannya ke urusan internasional. Perang di Eropa tampak tak terelakkan dan kecurigaan akan serbuan Argentina ke wilayah Brasil menghantui benak kepemimpinan bangsa. Namun ada harapan bahwa keberpihakan kepada Amerika Serikat dapat membantu mengamankan masa depan Brasil."
 ARG_GATHERING_STORM_DESC: "Pada tahun 1930, kabinet Hipólito Yrigoyen digulingkan dalam kudeta militer pertama sejak pengesahan Konstitusi Argentina, mengawali apa yang dikenal sebagai Dekade Tercela (Década Infame). Argentina harus mengarungi dunia yang berubah cepat di mana kekuatan-kekuatan besar mengancam perdamaian rapuh yang terjaga sejak akhir Perang Besar.\n\nManakah ancaman yang lebih nyata? Badai yang berkumpul di Eropa? Tetangga mereka sendiri? Ataukah diri mereka sendiri? Argentina harus teguh mempertahankan posisinya dan mengukuhkan tempatnya di panggung dunia."
 ARG_BLITZKRIEG_DESC: "Melalui pemilu paling curang dalam sejarah Argentina, koalisi Concordancia terus memegang mayoritas dalam pemerintahan dengan Roberto María Ortiz kini memimpin negara sebagai presidennya.\n\nNamun seiring memuncaknya ketegangan antara dua sahabat terdekat Argentina di Eropa, negara ini kini harus bersiap menghadapi kenyataan pahit terombang-ambing di antara dua faksi. Tak hanya itu, ketidakpuasan di tubuh militer kian membesar, dan kecurigaan terus tersulut mengenai rival mereka di utara yang tengah tertidur. Argentina berdiri di persimpangan jalan besar, dan harus berpikir masak-masak tentang bagaimana bersikap."
 CHL_GATHERING_STORM_DESC: "Sebagai dampak dari Kejatuhan Wall Street, AS menghentikan impor tembaga dan nitrat dari Chili, yang merupakan sumber pendapatan utama negara tersebut. Hal ini menyebabkan Chili menjadi negara Amerika Selatan yang paling parah terkena dampak depresi ekonomi, dan ketidakstabilan politik yang memburuk akibat depresi tersebut belum juga terselesaikan.\n\nSaat masa jabatan Arturo Alessandri mendekati akhir, gerakan fasis kian bangkit, dan bangsa ini masih mengingat jelas kudeta-kudeta pada dekade sebelumnya, serta Republik Sosialis Chili pada tahun 1932."
 CHL_BLITZKRIEG_DESC: "Dengan baru saja diatasinya upaya kudeta Jorge González von Marées dan rekan-rekan Nacistas-nya, Arturo Alessandri telah mundur dan Pedro Aguirre Cerda terpilih sebagai Presiden Chili yang baru. Namun ancaman militer masih membayangi dari dekat, dan tampak tak terelakkan bahwa Jenderal Ariosto Herrera dan para pendukungnya akan mencoba kudeta mereka sendiri.\n\nPerang juga membayangi di cakrawala, karena ketegangan tidak hanya meningkat di Eropa dan Asia, tetapi juga di wilayah Amazon, dekat dengan jantung negeri Chili."
 PAR_GATHERING_STORM_DESC: "Meskipun baru saja keluar sebagai pemenang dari Perang Chaco yang berdarah melawan Bolivia, negara ini terkuras habis secara ekonomi dan termiliterisasi secara berlebihan, dengan Ayala yang tidak populer tak mampu mengendalikan situasi karena ia, bersama tangan kanannya José Félix Estigarribia, disalahkan atas terjadinya perang tersebut sejak awal.\n\nMiliter, yang bersatu di belakang Rafael Franco dan gerakan sosialis Febrerista, tampak bersiap untuk menggulingkan pemerintah, dan tampaknya mereka tidak akan mundur tanpa perlawanan."
 PAR_BLITZKRIEG_DESC: "Dengan kudeta Febrerista yang sukses mendepak Ayala dan kroni-kroni liberalnya, banyak orang kini berharap kepada Rafael Franco untuk membalaskan berbagai penghinaan bangsa dan sekali lagi memukul Bolivia, meski hal ini tampak kian mustahil.\n\nBeberapa perwira sudah mulai bersekongkol untuk menggulingkan dan menggantikannya dengan Higinio Morínigo dengan bantuan organisasi paramiliter fasis Guión Rojo, demi menjalin hubungan yang lebih erat dengan kekuatan Poros."
 URG_GATHERING_STORM_DESC: "Dalam sebuah langkah yang disebut sebagai kudeta Uruguay 1933, Presiden Gabriel Terra mengudeta pemerintahannya sendiri, membubarkan parlemen, melemahkan pengawasan konstitusional, dan memerintah dengan cara yang kian otoriter. Hingga saat itu, Uruguay telah menjadi salah satu negara demokrasi paling progresif di Amerika Latin di bawah José Batlle y Ordóñez, melalui doktrin liberal yang disebut Batllismo.\n\nUtang luar negeri sama sekali tidak membantu situasi politik, dan republik oriental ini kini mendapati dirinya berada di tengah cengkeraman kediktatoran, kediktatoran yang tak dapat bertahan selamanya."
 URG_BLITZKRIEG_DESC: "Mantan diktator Gabriel Terra baru-baru ini menyerahkan kekuasaan kepada saudara iparnya Alfredo Baldomir, yang juga bagian dari partai Colorado. Karena lebih berhaluan liberal dan pro-Sekutu, tampaknya bangsa ini ditakdirkan untuk sekali lagi menapaki jalan demokrasi liberal, membantu kekuatan-kekuatan besar dalam menegakkan hukum dan ketertiban internasional."
 AUS_GATHERING_STORM_DESC: "Masih terguncang oleh 'Penghapusan Mandiri Parlemen' tahun 1934 dan pembunuhan Kanselir Engelbert Dollfuss setelahnya, ketegangan masih membara di Austria. Terikat oleh Perjanjian Saint-Germain-en-Laye yang ketat dan didera krisis ekonomi, kepemimpinan Austria di bawah Kanselir Schuschnigg mendapati diri mereka menghadapi keputusan berskala luar biasa. Menerima takdir mereka jika Jerman datang menjemput? Melawan hingga titik darah penghabisan, secara diplomatik maupun militer? Ataukah menoleh ke masa lalu, sebagai sebuah Kekaisaran dahulu, dan Kekaisaran ia akan kembali?"
 AFG_GATHERING_STORM_DESC: "Di bawah pemerintahan Raja Zahir Shah dan paman-pamannya, Afganistan memasuki era stabilitas yang relatif tenang. Namun di bawah permukaan Kerajaan yang abadi ini, arus amarah dan kecurigaan terus membara. Sebagian orang mengharapkan modernisasi radikal seperti yang pernah diupayakan oleh Amanullah Khan yang kini diasingkan, yang diyakini sebagian pihak tengah merencanakan kembalinya ia ke takhta. Sementara yang lain menganggap lambatnya perubahan di bawah Zahir Shah masih terlalu cepat dan bangsa ini perlu kembali ke akar tradisionalnya. Namun barangkali di saat dunia di sekitarnya berguncang, rakyat Afganistan dapat bersatu padu memanfaatkan situasi tersebut."
 AFG_BLITZKRIEG_DESC: "Seiring Raja Zahir Shah kian matang dalam perannya, tantangan yang dihadapi pemerintahannya terus menumpuk. Britania, Jerman, dan Uni Soviet saling berebut pengaruh atas Kerajaan yang terletak strategis ini, membawa investasi sekaligus ancaman intervensi. Sementara itu, para pembuat onar melintasi perbatasan dengan Kemaharajaan India (Raj), menyulut keresahan di kedua sisi. Namun saat dunia kembali terjerumus ke dalam perang, pertanyaan di kawasan ini adalah: 'apa yang akan dilakukan Afganistan?'"
 BEL_GATHERING_STORM_DESC: "Belgia masih menanggung bekas luka akibat pengalamannya dalam Perang Besar, dengan sebagian besar wilayah negeri masih berupa puing-puing dan luka yang lebih dalam tertanam pada jiwa rakyatnya. Masa depan demokrasi bangsa itu sendiri dipertanyakan, dirundung tuduhan korupsi yang dilancarkan terhadap mereka oleh berbagai faksi fasis.\n\nDi kancah internasional, Belgia berjalan di atas tali tipis antara kewajiban perjanjian terhadap mereka yang mengubah negerinya menjadi medan pertempuran, dan kekhawatiran akan keamanan mereka sendiri di dunia yang kian bergolak."
 BEL_BLITZKRIEG_DESC: "Ketidakstabilan masih melanda Belgia secara domestik, namun ini tidak ada apa-apanya dibanding ketidakstabilan yang dirasakan di panggung dunia saat ini. Militer negara telah mengalami modernisasi dan perluasan, dengan perhatian besar diberikan pada benteng-benteng perkasa yang bahkan menyaingi Garis Maginot milik Prancis.\n\nPemerintah Belgia telah melepaskan aliansi mereka dan mendeklarasikan netralitas mutlak, namun hal ini tidak menghentikan kesepakatan rahasia yang diteken untuk mengantisipasi serangan. Belgia memandang kebangkitan militerisme tetangganya dengan kekhawatiran yang teramat besar."
 COG_GATHERING_STORM_DESC: "Masih terluka oleh era Negara Bebas Kongo dan Raja Leopold II, Kongo Belgia telah melangkah jauh sejak masa itu. Pemerintah kolonial masih memanfaatkan tenaga kerja murah di pertambangan, dan sebuah batas tak kasat mata tetap ada demi memastikan mayoritas penduduk pribumi tak mampu mengenyam pendidikan tinggi, namun tidak semuanya suram.\n\nSeiring ambisi kolonial Italia yang kian membesar, dan setelah menunjukkan kinerja baik dalam Perang Besar, Force Publique sekali lagi bersiap melindungi negara, betapa pun minimnya perlengkapan yang mereka miliki."
 COG_BLITZKRIEG_DESC: "Dengan tuntasnya penaklukan Abisinia oleh Italia, dan Reich Jerman yang merebut wilayah baru di Eropa, situasinya tampak kian berbahaya. Ambisi kolonial Italia tidak berhenti di Afrika Timur, dan bisa jadi akan mengancam kita dalam waktu dekat, sementara Hitler secara aktif mengincar tuan Belgia kita sebagai langkah dalam rencananya meraih hegemoni atas benua Eropa.\n\nTampaknya perang akan segera mendatangi kita, jika kita tidak mendahuluinya menyerang mereka..."
 PER_GATHERING_STORM_DESC: "Dahulu dikenal sebagai Persia, bangsa agung Iran mendapati dirinya terjebak dalam baku tembak para raksasa yang saling berhadapan. Saat Iran yang netral memodernisasi diri dengan pesat berkat bantuan Reich Jerman, mantan mitra di Britania Raya dan Uni Soviet memandang dengan penuh kecurigaan. Reza Shah Pahlavi menolak membiarkan kedua negara ini menginjak-injak kedaulatan Iran, sekalipun risiko invasi kian nyata.\n\nAkankah netralitas Iran dihormati? Siapkah kita melindungi tanah air dari para penyerbu yang berniat jahat? Jika segalanya gagal, barangkali inilah saatnya menoleh ke masa lalu dan menyalakan kembali semangat Kekaisaran Persia kuno..."
 IRQ_GATHERING_STORM_DESC: "Di bawah kekuasaan Raja Faisal I dan kemudian putranya, Raja Ghazi, Irak mengarungi masa-masa penuh gejolak pasca-Perang Dunia I sebagai wilayah mandat Britania. Monarki Hashemit berupaya keras menyeimbangkan modernisasi dan nasionalisme, namun di bawah permukaan, ketidakpuasan terus membara. Para pemimpin suku membenci otoritas pusat, sementara kaum elit perkotaan mendesak kemerdekaan yang lebih besar dari pengaruh Britania. Sentimen Pan-Arab berbenturan dengan keberagaman etnis dan agama di Irak, menciptakan persatuan yang rapuh. Seiring dunia kian mendekat ke konflik besar berikutnya, Irak terombang-ambing antara konsolidasi dan pergolakan, masa depannya tak menentu namun sarat dengan berbagai kemungkinan."
 IRQ_BLITZKRIEG_DESC: "Irak mendapati dirinya berada dalam periode pergolakan yang kian memanas dalam beberapa tahun terakhir. Kudeta tahun 1936 yang dipimpin oleh Bakr Sidqi menghancurkan otoritas rapuh monarki Hashemit dan menciptakan preseden berbahaya bagi campur tangan militer dalam politik. Di bawah permukaan, ketegangan mendidih antara para pemimpin suku yang menentang sentralisasi, kaum pembaru yang mendorong modernisasi, dan militer yang kian berani karena kekuasaan barunya. Nasionalisme Pan-Arab kian berkobar, menantang pengaruh Britania dan memupuk impian akan persatuan regional. Seiring dunia yang kian tidak stabil, Irak berdiri di persimpangan jalan, masa depannya tak pasti dan rakyatnya terpecah belah."
 PER_BLITZKRIEG_DESC: "Iran berdiri di tepi jurang masa depan yang bergolak dan tak menentu. Saat perang bermula di Eropa, Reza Shah Pahlavi memandang dengan cemas manakala dirinya terjepit di antara dua pemain besar yang tampak berminat melibatkan diri dalam konflik luas.\n\nKedaulatan Iran bisa dipertanyakan jika menyangkut sumber daya, dan pemerintahan sang Shah harus bersiap untuk memukul mundur setiap potensi invasi. Pertanyaannya adalah: mampukah mereka memobilisasi kekuatan tepat pada waktunya?"
 PHI_GATHERING_STORM_DESC: "Pada tahun 1935, Amerika Serikat akhirnya menyetujui transisi damai menuju kemerdekaan selama kurun waktu sepuluh tahun. Filipina masih berada di tahap awal proses ini, namun kini semakin memegang kendali atas nasibnya sendiri.\n\nAkankah mereka mempertahankan hubungan dengan AS, ataukah justru mencari dukungan asing demi mempercepat langkah menuju kemerdekaan? Filipina menatap ke depan menuju masa depan yang makmur, namun adakah hiu-hiu yang telah berputar-putar mengintai bangsa belia ini?"
 SIA_BLITZKRIEG_DESC: "Sejak berkuasa pada akhir tahun 1938, Perdana Menteri Phibunsongkhram telah mengubah Siam seturut citra dirinya. Negara ini memiliki nama baru — Thailand — dan sebuah doktrin baru: disiplin militer, nasionalisme Pan-Thai, serta ambisi teritorial yang menyasar masyarakat penutur bahasa Thai yang masih berada di bawah kekuasaan kolonial Prancis dan Britania.\n\nSaat Eropa meluncur menuju perang dan Jepang merangsek kian dalam ke Tiongkok, pasukan Phibun bertambah kuat setiap hari. Ambisinya bukan lagi rahasia. Satu-satunya pertanyaan adalah di sisi siapa Thailand akan berdiri ketika saatnya tiba."
 PHI_BLITZKRIEG_DESC: "Amerika Serikat sejauh ini menepati janjinya, membantu Filipina dalam jalurnya menuju kemerdekaan.\n\nSementara itu, perang telah meletus antara Tiongkok dan Jepang, dan negara kepulauan ini memandang dengan cemas terhadap aspirasi imperialis sang tetangga di utara.\n\nBala bantuan Amerika telah mulai berdatangan untuk memperkokoh pertahanan, namun akankah jumlahnya mencukupi? Jepang telah mencium bau darah di perairan."
 SIA_GATHERING_STORM_DESC: "Baru empat tahun berlalu sejak Khana Ratsadon mengakhiri monarki absolut yang telah berlangsung berabad-abad. Siam mengambil langkah pertamanya sebagai negara konstitusional, namun persatuan telah mulai terkikis: kaum reformis sipil memimpikan demokrasi sementara militer menuntut kekuatan, kedisiplinan, dan ekspansi Pan-Thai.\n\nDikepung oleh kekuatan kolonial Britania dan Prancis, dengan Jepang yang kian berani merangsek di utara, Siam harus melangkah dengan sangat hati-hati. Badai yang datang mungkin memaksa bangsa muda ini untuk memilih kubu — atau menemukan cara untuk bertahan hidup tanpa memihak siapa pun."
 INS_GATHERING_STORM_DESC: "Selama lebih dari tiga abad, Hindia Belanda telah menjadi permata mahkota imperium kolonial Belanda. Kepulauannya yang luas, dengan beraneka ragam bahasa dan budaya, terikat bersama nyaris hanya oleh administrasi kolonial yang berkuasa atas mereka.\n\nCengkeraman Den Haag kian hari kian goyah. Rakyat yang lelah akan penindasan dan eksploitasi kian terbuka menyambut gerakan-gerakan nasionalis. Namun gerakan-gerakan ini masih jauh dari kata bersatu, masing-masing dengan visi yang bertolak belakang mengenai Indonesia. Mampukah mereka mengesampingkan perbedaan dan bersatu dengan satu suara yang kelak akan menentukan nasib Hindia."
 INS_BLITZKRIEG_DESC: "Tiga tahun lalu, Soetardjo dan rekan-rekan pemohonnya meminta kepada Den Haag sebuah konferensi mengenai pemerintahan mandiri dalam kurun waktu satu dekade. November lalu, titah kerajaan tiba. Jawabannya adalah tidak.\n\nPenolakan tersebut memicu apa yang tak mampu dicapai oleh agitasi bertahun-tahun. Pada bulan Mei, delapan organisasi nasionalis terbesar mengesampingkan perselisihan mereka dan bergabung menjadi satu federasi, menyuarakan dengan satu suara tuntutan pembentukan parlemen Indonesia. Administrasi kolonial menjawab seperti biasanya, namun Jepang terus merangsek ke selatan melintasi Tiongkok, dan Hindia terbentang teramat jauh dari Den Haag."
