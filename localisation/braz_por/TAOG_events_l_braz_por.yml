  ##### ABDACOM EVENTS ######
  ###########################
  ABDA_events.1.t: "Undangan Menuju Komando Tertinggi Bersama"
  ABDA_events.1.desc: "[FROM.GetNameDef] telah membentuk komando tertinggi gabungan untuk teater Pasifik dan mengundang kita untuk bergabung. Inisiatif yang dinamai ABDACOM ini bertujuan menghimpun kekuatan angkatan laut, udara, dan darat negara-negara Sekutu di kawasan tersebut di bawah struktur komando terpadu. Bergabung berarti koordinasi erat dengan [FROM.GetNameDef] serta mitra lainnya. Kita harus mengambil keputusan."
  ABDA_events.1.a: "Kita akan berjuang bersama-sama."
  ABDA_events.1.b: "Kita belum dapat berkomitmen untuk saat ini."
  ABDA_events.2.t: "[FROM.GetName] Bergabung dengan ABDACOM"
  ABDA_events.2.desc: "[FROM.GetNameDef] telah menerima undangan kita untuk bergabung ke dalam Komando Tertinggi ABDACOM. Pasukan mereka kini akan beroperasi di bawah struktur komando bersama, memperkokoh posisi kita di teater Pasifik."
  ABDA_events.2.a: "Sebuah perkembangan yang sangat disambut baik."
  ABDA_events.3.t: "[FROM.GetName] Menolak Bergabung"
  ABDA_events.3.desc: "[FROM.GetNameDef] telah menolak undangan untuk bergabung ke dalam Komando Tertinggi ABDACOM. Pasukan mereka tidak akan dikerahkan ke dalam operasi gabungan saat ini, meski pintu diplomasi tetap terbuka."
  ABDA_events.3.a: "Disayangkan, namun kita catat keputusannya."
  ABDA_events.5.t: "Undangan untuk Bergabung dengan ABDACOM"
  ABDA_events.5.desc: "[FROM.GetNameDef] telah menyampaikan undangan resmi bagi kita untuk bergabung dengan American-British-Dutch-Australian Command. ABDACOM telah diakui sebagai otoritas koordinasi tertinggi bagi pasukan Sekutu di Pasifik, memadukan angkatan laut dan darat kekuatan-kekuatan utama di bawah satu bendera kepemimpinan."
  ABDA_events.5.a: "Kita akan berdiri bersama."
  ABDA_events.5.b: "Kita tidak dapat berkomitmen pada saat ini."
  ABDA_events.4.t: "Pertahanan Singapura"
  ABDA_events.4.desc: "Dengan ditetapkannya Singapura sebagai pusat pertahanan ABDACOM, para komandan kita harus memutuskan bagaimana berinvestasi pada benteng pertahanannya. Kita dapat memprioritaskan pendekatan angkatan laut dan pertahanan pelabuhan, memperkuat pendekatan darat terhadap serangan darat, atau menyebarkan sumber daya kita ke keduanya. Setiap tindakan akan menentukan bagaimana Singapura dapat bertahan ketika musuh datang."
  ABDA_events.4.a: "Perkuat sektor laut. Kekuatan utama Singapura terletak pada pelabuhannya."
  ABDA_events.4.b: "Bentengi perimeter darat. Ancaman sesungguhnya akan datang lewat daratan."
  ABDA_events.4.c: "Pendekatan seimbang. Tidak boleh ada satu pun celah serangan yang tak terlindungi."
  ABDA_fortress_singapore_choice_tt: "Menuntaskan fokus ini akan memunculkan pilihan bagaimana membentengi Singapura."
  ABDA_faction_membership_requirement_tt: "Anggota faksi yang memenuhi syarat akan menerima undangan untuk bergabung."
